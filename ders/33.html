<script>
const D={"no": 33, "vid": "JOCO5SHTJT8", "title_ar": "الدرس (٣٣) من شرح كليات العقيدة — من كليات التكفير", "title_tr": "Şerhu Külliyyâti'l-Akîde — 33. Ders: Tekfir Külliyeleri (Lâzım, İçtihadî Tekfirle İmtihan, Vera', Kazâ Hükmü, Küfrü Hikâye, Zâtı İtibarıyla Küfür, Mürcie, İstihlâl, Va'îdiyye, Zaruri Haramı Helal Saymak)", "sections": [{"ts": "00:00", "title": "1. Külliye: Bir sözün lâzımı, söyleyene arz edilip o da iltizam etmedikçe onun sözü değildir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.1, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.1, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.7, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [10.8, "لقد افتتحنا في الدرس الماضي الكلامَ على جُمَلٍ من كلّيّات باب التكفير عند أهل السنة والجماعة،"], [19.0, "ونُكملها اليوم ـ إن شاء الله ـ بعشر كلّيّات،"], [23.0, "ستطول قليلًا، لكن لعلّكم تتحمّلون طولَها."], [29.0, "الكلّيّة الأولى: <b>كلُّ لازمٍ على قولٍ فليس بقولٍ إلا بعد عرضِه والتزامِه.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرةً ثالثة:"], [50.0, "<b>كلُّ لازمٍ على قولٍ فليس بقولٍ إلا بعد عرضِه والتزامِه.<\/b>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.5, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.8, "Geçen derste Ehl-i Sünnet ve'l-Cemaat'e göre tekfir babının külliyelerinden bir kısmı hakkında söze başlamıştık."], [18.0, "Allah'ın izniyle bugün on külliyeyle onu tamamlayacağız;"], [21.9, "biraz uzun sürecek, ama umarım uzunluğuna katlanırsınız."], [29.0, "<b>1. külliye: Bir söz üzerine lâzım gelen (gerekli sonuç), söyleyene arz edilip o da onu iltizam etmedikçe (benimsemedikçe) onun sözü sayılmaz.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [50.0, "<b>Bir söz üzerine lâzım gelen, söyleyene arz edilip o da onu iltizam etmedikçe onun sözü sayılmaz.<\/b>"]]}, {"reader": false, "ar": [[57.0, "أقول وبالله التوفيق: وذلك أنّ الإنسان قد يقول قولًا أو يفعل فعلًا ليس كفرًا في أوائله،"], [67.0, "ولكنّه يُفضي إلى الكفر،"], [69.9, "أو يلزم عليه الكفر،"], [73.0, "وهذا من باب التكفير بالمآلات أو اللوازم."], [77.0, "وأهلُ السنة والجماعة يقولون بأنّ التكفير باللوازم لا يجوز إلا بشرطين:"], [86.0, "الشرط الأول: أن تعرض هذا اللازمَ على المتكلّم أو الفاعل،"], [90.0, "فتقول: إنّك قلتَ كذا،"], [91.7, "أو فعلتَ كذا، ويلزم على قولك أو فعلك كذا وكذا."], [96.0, "وإذا عرضتَه فلا يخلو من حالتين:"], [99.3, "إمّا أن يُنكره ويأباه ويرفضه،"], [102.0, "فحينئذٍ لا حقَّ لك أن تنسب هذا اللازم إليه،"], [106.8, "أو أن تحاسبه به،"], [109.0, "أو أن تكفّره أو تبدّعه أو تفسّقه أو تؤثّمه،"], [114.0, "بناءً على هذا اللازم الذي صرّح بأنه لا يلتزمه."]], "tr": [[57.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [58.9, "İnsan, başlangıcında küfür olmayan bir söz söyleyebilir ya da bir fiil işleyebilir;"], [64.5, "ama bu söz veya fiil küfre götürür ya da onun üzerine küfür lâzım gelir."], [72.1, "Bu, meâlât (varılan sonuçlar) veya lâzımlar ile tekfir babındandır."], [77.0, "Ehl-i Sünnet ve'l-Cemaat, lâzımlar ile tekfirin ancak iki şartla caiz olduğunu söyler."], [86.0, "Birinci şart: Bu lâzımı konuşana ya da fiili işleyene arz etmendir."], [90.4, "Ona şöyle dersin: \"Sen şöyle dedin ya da şöyle yaptın;"], [93.0, "senin sözün ya da fiilin üzerine şu şu lâzım gelir.\" Bunu ona arz ettiğinde iki hâlden biri olur:"], [99.3, "Ya onu inkâr eder, ondan kaçınır ve reddeder;"], [102.5, "bu durumda bu lâzımı ona nispet etmeye, onu bununla hesaba çekmeye, iltizam etmediğini açıkça söylediği bu lâzıma dayanarak onu tekfir, tebdî', tefsîk ya da te'sîm etmeye (kâfir, bid'atçi, fâsık ya da günahkâr saymaya) hakkın yoktur."]]}, {"reader": false, "ar": [[120.0, "وإنّ هذا ـ أي: وإنّ نسبةَ اللوازم إلى أصحابها وهم يرفضونها ـ هذا من الظلم والبغي بالعلم."], [134.0, "فبما أنّه صرّح بلفظ هذا اللازم وأنّه يرفضه ويأباه ولا يقبله،"], [142.0, "فلا حقَّ لنا أن نحاسبه به بعد ذلك،"], [145.0, "لا سيّما وأنّ المتقرّر في القواعد أنّ المقطوعَ به مقدَّمٌ على المظنون."], [153.0, "وهذا التصريح منه برفض هذا اللازم أمرٌ مقطوعٌ به أنّه يتبرّأ منه،"], [162.0, "وكونُه ممّا يلزم على كلامه،"], [164.5, "فهل يُنسب له أو لا؟"], [167.0, "هذا أمرٌ مظنون. وبما أنّ الصريح قد وُجد،"], [171.0, "فلا يجوز لنا أن نتغافل عن الصريح ونتعامل مع الشخص باللوازم،"], [177.0, "فإنّ هذا من الظلم العظيم والبغي بالعلم."]], "tr": [[120.0, "Bu —yani lâzımları, onları reddettikleri hâlde sahiplerine nispet etmek— zulümden ve ilimle haddi aşmaktandır."], [134.0, "Madem ki o, bu lâzımı lafzen açıkça söylemiş, onu reddettiğini, ondan kaçındığını ve kabul etmediğini belirtmiştir;"], [143.1, "bundan sonra onu bununla hesaba çekmeye hakkımız yoktur."], [146.3, "Hele ki kaidelerde, kesin olanın zannî olana takdim edildiği sabittir."], [153.0, "Onun bu lâzımı reddettiğini açıkça söylemesi, ondan beri olduğuna dair kesin bir şeydir."], [159.8, "Bunun onun sözü üzerine lâzım gelen bir şey olması ise —ona nispet edilir mi edilmez mi?— zannî bir şeydir."], [169.0, "Madem ki açık ifade mevcuttur, açık ifadeyi görmezden gelip kişiye lâzımlar ile muamele etmemiz caiz değildir;"], [176.2, "çünkü bu büyük zulümden ve ilimle haddi aşmaktandır."]]}, {"reader": false, "ar": [[181.0, "وإنّ أكثرَ ما نراه في الساحة في هذا الزمان إنّما هو الحكم على الناس باللوازم؛"], [190.0, "فتجدون أنّ كثيرًا من الناس يكفّر باللوازم تكفيرًا مطلقًا،"], [196.0, "أو يبدّع باللوازم تبديعًا مطلقًا،"], [200.0, "ولا يكلّف نفسَه أن يعرضها على المتكلّم أو القائل."], [205.0, "فإذا عرضناها عليه ورفضها فلا يجوز أن نحاسبه بها."], [211.0, "الحالة الثانية: أن يقبلها،"], [213.7, "وأن يدين الله عز وجل بها،"], [217.7, "وأن يصرّح أنه معتقدٌ لها،"], [221.0, "فحينئذٍ لا بأسَ علينا أن نحاسبه بلوازمه."]], "tr": [[181.0, "Bu zamanda meydanda gördüğümüz şeylerin çoğu, insanlar hakkında lâzımlar ile hüküm vermekten ibarettir."], [190.0, "İnsanların birçoğunun lâzımlar ile mutlak olarak tekfir ettiğini ya da lâzımlar ile mutlak olarak tebdî' ettiğini görürsünüz;"], [200.0, "bunu konuşana ya da söyleyene arz etme zahmetine de katlanmaz."], [205.0, "Biz onu ona arz eder, o da reddederse, onu bununla hesaba çekmemiz caiz değildir."], [211.0, "İkinci hâl: Onu kabul etmesi, Allah Azze ve Celle'ye onunla dindarlık etmesi ve ona inandığını açıkça söylemesidir;"], [219.7, "bu durumda onu lâzımları ile hesaba çekmemizde bir sakınca yoktur."]]}, {"reader": false, "ar": [[225.0, "فإن قلتَ: ولماذا نستفصل منه الجواب؟"], [232.0, "فأقول الجواب: لأنّ الإنسان لا يُحيط بالشيء علمًا،"], [236.0, "وإنّما ذلك لله عز وجل."], [239.0, "فلوازمُ كلام الله في القرآن حقّ؛"], [242.0, "لأنّه ـ وهو يتكلّم بالقرآن ـ يعرف منطوقَه،"], [247.0, "أو يعلم منطوقَه ومضمونَه ولوازمَه عز وجل؛"], [251.0, "لأنّ له العلمَ الكامل."], [253.0, "وكذلك كلامُ نبيّه صلى الله عليه وسلم،"], [257.0, "فهو حقٌّ في منطوقه،"], [259.0, "وحقٌّ في مضمونه، وحقٌّ في لوازمه،"], [262.0, "فلازمُ الحقِّ حقّ، ولا شكّ في ذلك."]], "tr": [[225.0, "Eğer \"Neden ondan cevabın tafsilatını istiyoruz?\" dersen, cevap olarak derim ki:"], [232.0, "Çünkü insan bir şeyi ilmen kuşatamaz;"], [234.0, "bu ancak Allah Azze ve Celle'ye aittir."], [236.6, "Allah'ın Kur'an'daki kelamının lâzımları haktır;"], [239.0, "çünkü O, Kur'an ile konuşurken onun mantûkunu (lafzen ifade ettiğini) bilir;"], [244.3, "ya da Azze ve Celle onun mantûkunu, muhtevasını ve lâzımlarını bilir;"], [251.0, "çünkü O'nun kâmil ilmi vardır."], [253.0, "Nebîsi ﷺ'in sözü de böyledir:"], [256.4, "Mantûkunda hak, muhtevasında hak, lâzımlarında haktır."], [260.5, "Hakkın lâzımı da haktır; bunda şüphe yoktur."]]}, {"reader": false, "ar": [[268.0, "وأمّا آحادُ العلماء وطلبةِ العلم،"], [272.0, "فإنّه قد يتكلّم بالكلام الذي لا يستحضر إلا منطوقَه،"], [277.0, "وهو غافلٌ عمّا يلزم عليه."], [281.0, "فبما أنّ العالِم قد يجهل اللوازم،"], [283.6, "وقد ينطق بالكلام وهو لا يعرف ما وراءه من اللوازم،"], [288.0, "فمن باب إزالة الشبهة لا بدّ أن نعرض لازمَ كلامه عليه،"], [295.0, "حتى نتأكّد ـ فيما لو نسبنا له شيئًا من هذه الأحكام ـ أنّه يكون نسبةَ قطعٍ ويقين،"], [300.8, "لا ظنٍّ وتخمينٍ وهوى."]], "tr": [[268.0, "Âlimlerin ve ilim talebelerinin tek tek fertlerine gelince:"], [272.6, "Onlardan biri, sadece mantûkunu göz önünde bulundurduğu bir söz söyleyebilir ve onun üzerine lâzım gelenden gâfildir."], [281.0, "Madem ki âlim lâzımları bilmeyebilir ve ardındaki lâzımları bilmeden bir söz söyleyebilir;"], [286.2, "şüpheyi gidermek kabilinden, sözünün lâzımını ona mutlaka arz etmemiz gerekir."], [291.8, "Böylece bu hükümlerden birini ona nispet edersek, bunun zan, tahmin ve hevâ ile değil, kesinlik ve yakîn ile yapılmış bir nispet olduğundan emin oluruz."]]}]}, {"ts": "05:03", "title": "1. Külliye (devam): Lâzımı sormaktan kaçınanlar; İbn Teymiyye ve diğer âlimlerin sözleri", "paras": [{"reader": false, "ar": [[303.0, "وإنّ من العجائب أنّني قرأتُ لبعض هؤلاء الذين يبدّعون جِزافًا ويكفّرون جِزافًا أنّهم يتواصَون فيما بينهم ألّا يسألوا صاحبَ الكلام عن لوازم كلامه،"], [320.0, "لينفُثوا سمومَ تبديعهم وتكفيرهم فيه من غير أن يجدوا غضاضة."], [327.0, "وإلا فليس بينهم وبين الاستفسار إلا مجرّدُ مهاتفةٍ واتّصال،"], [334.9, "أو مجيءٍ وزيارة، ولكنّهم يرفضون ذلك خشيةَ أن يُبيِّن لهم عدمَ التزامه،"], [343.0, "فلا يجدون طريقًا إلى تبديعه وتكفيره."], [348.0, "ونعوذ بالله من الهوى إذا تحكّم في الإنسان."]], "tr": [[303.0, "Şaşılacak şeylerden biri şudur: Gelişigüzel tebdî' ve tekfir eden bu kimselerden bazılarının, söz sahibine sözünün lâzımlarını sormamayı aralarında birbirlerine tavsiye ettiklerini okudum;"], [319.2, "ta ki tebdî' ve tekfir zehirlerini hiçbir rahatsızlık duymadan onun hakkında saçabilsinler."], [327.0, "Yoksa onlarla soruşturma arasında bir telefon görüşmesi ve irtibat ya da gidip ziyaret etmekten başka bir şey yoktur."], [340.3, "Fakat onun iltizam etmediğini kendilerine açıklamasından korktukları için bunu reddederler;"], [348.0, "çünkü o zaman onu tebdî' ve tekfir etmeye bir yol bulamazlar."], [351.6, "İnsana hâkim olduğunda hevâdan Allah'a sığınırız."]]}, {"reader": false, "ar": [[354.0, "وهذه القاعدة في باب التكفير من قواعد العدل في الحكم على الآخرين؛"], [361.0, "فليس ـ والله ـ من العدل أن نحاكم الناسَ بلوازم كلامهم وهم في غفلةٍ عنها،"], [367.0, "بل لا بدّ أن نعرضها عليهم؛"], [370.0, "فإن التزموها حاسبناهم عليها،"], [373.0, "وإن لم يلتزموها فلا نحاسبهم عليها."]], "tr": [[354.0, "Tekfir babındaki bu kaide, başkaları hakkında hüküm vermede adalet kaidelerindendir."], [361.0, "Vallahi, insanları gâfil oldukları hâlde sözlerinin lâzımları ile yargılamamız adaletten değildir."], [366.0, "Bilakis onları kendilerine mutlaka arz etmemiz gerekir:"], [370.0, "Eğer iltizam ederlerse onları bunlarla hesaba çekeriz;"], [373.7, "iltizam etmezlerse onları bunlarla hesaba çekmeyiz."]]}, {"reader": false, "ar": [[377.0, "قال الإمام ابن تيمية رحمه الله تعالى:"], [382.0, "«لازمُ قول الإنسان نوعان: أحدهما: لازمُ قوله الحقّ، فهذا ممّا يجب عليه أن يلتزمه، فإنّ لازمَ الحقِّ حقّ، ويجوز أن يُضاف إليه إذا عُلم من حاله أنّه لا يمتنع من التزامه بعد ظهوره. وكثيرٌ ممّا يضيفه الناس إلى مذاهب الأئمة من هذا الباب»."], [408.0, "فهم يأتون بقولةٍ للإمام أحمد،"], [411.2, "ويقول أتباعه: ويلزم على قول الإمام أحمد كذا وكذا،"], [417.1, "فيجعلون اللوازمَ من جملة مذهب الإمام أحمد."], [422.6, "فيقول ابن تيمية: إنّ غالبَ تخريجات الأصحاب والأتباع للأئمة من هذا الصنف؛"], [430.3, "أنّهم يُخرّجون عشرةَ فروعٍ على قولةٍ واحدة،"], [434.8, "كلُّه من باب التخريج باللوازم."]], "tr": [[377.0, "İmam İbn Teymiyye rahimehullahu teâlâ şöyle demiştir:"], [379.9, "\"İnsanın sözünün lâzımı iki türlüdür:"], [382.0, "Birincisi, hak olan sözünün lâzımıdır."], [386.6, "Bu, onun iltizam etmesi vacip olan şeylerdendir;"], [392.5, "çünkü hakkın lâzımı haktır. Ortaya çıktıktan sonra onu iltizam etmekten kaçınmayacağı hâlinden biliniyorsa, ona izafe edilmesi caizdir."], [408.0, "İnsanların imamların mezheplerine izafe ettiği şeylerin birçoğu bu babdandır.\" Onlar İmam Ahmed'in bir sözünü getirirler, tâbileri de \"İmam Ahmed'in sözü üzerine şu şu lâzım gelir\" der ve lâzımları İmam Ahmed'in mezhebinin bir parçası yaparlar."], [422.6, "İbn Teymiyye diyor ki: Ashâbın ve tâbilerin imamlar adına yaptığı tahrîclerin (çıkarımların) çoğu bu türdendir;"], [430.3, "tek bir söz üzerine on fer'î mesele tahrîc ederler;"], [434.8, "hepsi lâzımlar ile tahrîc babındandır."]]}, {"reader": false, "ar": [[441.0, "ثم قال رحمه الله:"], [443.4, "«والثاني: لازمُ قوله الذي ليس بحقّ، فهذا لا يجب التزامه؛ إذ أكثرُ ما فيه أنّه تناقض. ثم إن عُلم من حاله أنّه يلتزمه بعد ظهوره فقد يُضاف إليه، وإلا فلا يجوز أن يُضاف إليه قولٌ لو ظهر له فسادُه لم يلتزمه»."], [465.0, "انتهى كلامه. ويقول أيضًا أبو العباس في نقلٍ أوضحَ من هذا:"], [470.0, "«فالصواب أنّ مذهبَ الإنسان <span class=\"note\">(كذا قال، والمراد: لازمَ مذهب الإنسان)<\/span> ليس بمذهبٍ له إذا لم يلتزمه؛ فإنّه إذا كان قد أنكره ونفاه كانت إضافتُه إليه كذبًا عليه»."], [484.0, "انتهى كلامه رحمه الله."]], "tr": [[441.0, "Sonra rahimehullah şöyle demiştir: \"İkincisi, hak olmayan sözünün lâzımıdır."], [442.2, "Bunu iltizam etmek vacip değildir;"], [443.4, "çünkü onda olabilecek en fazla şey bir çelişkidir."], [448.8, "Sonra, ortaya çıktıktan sonra onu iltizam edeceği hâlinden biliniyorsa ona izafe edilebilir;"], [456.5, "aksi hâlde, bozukluğu kendisine görünse iltizam etmeyeceği bir sözün ona izafe edilmesi caiz değildir.\" Sözü bitti."], [465.0, "Ebu'l-Abbâs (İbn Teymiyye) bundan daha açık bir nakilde de şöyle der:"], [470.0, "\"Doğrusu, insanın mezhebi(nin lâzımı) —Şeyh böyle söylüyor— iltizam etmedikçe onun mezhebi değildir."], [476.3, "Çünkü onu inkâr etmiş ve reddetmişse, onu ona izafe etmek ona karşı yalan olur.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[486.0, "ويقول أيضًا رحمه الله في موضعٍ آخر ـ تابِعوا معي يا جماعة ـ:"], [492.0, "«ليس كلُّ من تكلّم بالكفر يكفر حتى تقوم عليه الحجّةُ المثبِتة لكفره، فلازمُ المذهب ليس بمذهب إلا أن يلتزمه صاحبُ المذهب نفسُه. فخلقٌ كثيرٌ من الناس ينفون ألفاظًا أو يُثبتونها، بل ينفون معانيَ أو يُثبتونها، ويكون ذلك مستلزمًا لأمورٍ هي كفر، وهم لا يعلمون بالملازمة، بل يتناقضون، وما أكثرَ تناقضَ الناس، لا سيّما في هذا الباب، وليس التناقض في القول كفرًا»."], [527.0, "انتهى كلامه رحمه الله."]], "tr": [[486.0, "Rahimehullah başka bir yerde de şöyle der —benimle takip edin, cemaat—:"], [488.1, "\"Küfür sözü söyleyen herkes, küfrünü isbat eden hüccet kendisine ikame edilmedikçe kâfir olmaz."], [492.0, "Mezhebin lâzımı, mezhep sahibinin kendisi onu iltizam etmedikçe mezhep değildir."], [501.8, "İnsanlardan pek çoğu birtakım lafızları nefyeder ya da isbat eder, hatta birtakım manaları nefyeder ya da isbat eder;"], [520.5, "bu da küfür olan birtakım şeyleri gerektirir;"], [527.0, "onlar ise bu gerektirmeyi bilmezler, bilakis çelişkiye düşerler."], [527.5, "İnsanların çelişkisi ne kadar çoktur, hele bu babda!"], [528.0, "Sözdeki çelişki ise küfür değildir.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[529.0, "ويؤيّد ذلك ابنُ حزم رحمه الله تعالى فقال:"], [534.0, "«وأمّا من كفّر الناسَ بما تؤول إليه أقوالُهم فخطأ؛ لأنّه كذبٌ على الخصم، وتقويلٌ له ما لم يقل به»."], [547.0, "انتهى كلامه رحمه الله."], [549.0, "ويقول ابنُ حجرٍ المكّيّ رحمه الله تعالى:"], [553.0, "«الصواب عند الأكثرين من علماء السلف والخلف أنّنا لا نكفّر أهلَ البدع والأهواء إلا إذا أتَوا بمكفِّرٍ صريح، لا استلزاميّ؛ لأنّ الأصحَّ أنّ لازمَ المذهب ليس بلازم»."], [569.0, "انتهى كلامه رحمه الله."]], "tr": [[529.0, "İbn Hazm rahimehullahu teâlâ da bunu destekleyerek şöyle der:"], [534.0, "\"İnsanları sözlerinin varacağı şeyle tekfir edene gelince, bu hatadır;"], [539.0, "çünkü bu hasma karşı yalandır ve ona söylemediği bir şeyi söyletmektir.\" Sözü bitti, Allah ona rahmet etsin."], [549.0, "İbn Hacer el-Mekkî rahimehullahu teâlâ da şöyle der:"], [553.0, "\"Selef ve halef âlimlerinin çoğunluğuna göre doğru olan, bid'at ve hevâ ehlini, gerektirme yoluyla olan değil, açık bir tekfir sebebi getirmedikçe tekfir etmememizdir;"], [563.0, "çünkü en sahih olan, mezhebin lâzımının lâzım (bağlayıcı) olmadığıdır.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[571.0, "وهذا المَزلَق ـ أي: التكفير باللوازم ـ وقع فيه أهلُ البدع الذين يكفّر بعضُهم بعضًا،"], [581.0, "كما حكاه ابنُ رشدٍ الحفيد رحمه الله تعالى،"], [587.0, "قال: «وأكثرُ أهل البدع إنّما يكفّرون بالمآل» ـ أي:"], [592.1, "باللوازم ـ. ولذلك استقبح العلماءُ التكفيرَ باللوازم،"], [596.5, "واعتبروه ضربًا من الجهل ورقّةً في الدين."]], "tr": [[571.0, "Bu kaygan zemine —yani lâzımlar ile tekfire— birbirini tekfir eden bid'at ehli düşmüştür."], [579.8, "Nitekim İbn Rüşd el-Hafîd rahimehullahu teâlâ bunu nakleder ve şöyle der:"], [587.6, "\"Bid'at ehlinin çoğu ancak meâl ile\" —yani lâzımlar ile— \"tekfir eder.\" Bu yüzden âlimler lâzımlar ile tekfiri çirkin görmüş ve onu bir tür cehalet ve dinde zaaf saymışlardır."]]}]}, {"ts": "10:00", "title": "1. Külliye (devam): Aceleci tebdî'ciler ve Ehl-i Sünnet'in adaleti", "paras": [{"reader": false, "ar": [[600.0, "وإنّ من أعجب ما وقعتُ عليه هو أنّ بعض هؤلاء المتعجّلين في التبديع يبدّع عالِمًا من علماء أهل السنة لأنّه نقل من كتابٍ من كتب بعض أهل البدع نقلًا هو حقٌّ في ذاته،"], [620.0, "فجعل من لوازم النقل من كتب أهل البدع ما هو الحقّ:"], [626.5, "أنّه راضٍ ببدعتهم، أنّه راضٍ ببدعتهم."], [632.0, "ومن ذلك أيضًا أنّ بعض المتسرّعين في التبديع يجعلون مجرّدَ وجودك في مجلسٍ مع بعض أهل البدع موجبًا لتبديعك،"], [646.0, "ولا يكلّف أحدُهم نفسَه ليسأل:"], [649.3, "ما الذي أجلسك معه؟"], [652.0, "أو: أنّ جلوسك وتبسّطك معه يُفضي إلى إقرارك ببدعته أو رضاك بها،"], [659.0, "هل ترضى بهذا اللازم أو لا ترضى؟"], [661.0, "لكنّهم يتسارعون في التبديع كما تتكادم الحُمُرُ على بقيّة الزرع، وكأنّها غنيمة."]], "tr": [[600.0, "Rastladığım en şaşırtıcı şeylerden biri şudur:"], [603.8, "Tebdî'de acele eden bu kimselerden bazıları, Ehl-i Sünnet âlimlerinden bir âlimi, bid'at ehlinin kitaplarından birinden kendi zatında hak olan bir nakil yaptığı için tebdî' eder."], [617.9, "Bid'at ehlinin kitaplarından hak olan bir şeyi nakletmenin lâzımlarından, onun onların bid'atine razı olduğunu çıkarır —onların bid'atine razı olduğunu!"], [626.5, "Bunlardan biri de şudur: Tebdî'de aceleciliğe düşen bazıları, bid'at ehlinden bazılarıyla bir mecliste sırf bulunmanı tebdî' edilmeni gerektiren bir sebep sayar."], [644.7, "İçlerinden biri şunu sorma zahmetine katlanmaz:"], [649.3, "\"Seni onunla oturtan ne?\" Ya da:"], [652.0, "\"Onunla oturman ve rahat davranman, onun bid'atini onaylamana ya da ona razı olmana götürür;"], [659.0, "bu lâzıma razı mısın, değil misin?\" Fakat onlar, eşeklerin ekinin artığı üzerine birbirini ısırarak üşüşmesi gibi, sanki bir ganimetmiş gibi tebdî'e koşuşurlar."]]}, {"reader": false, "ar": [[674.0, "ولذلك نفى أهلُ السنة والجماعة كثيرًا من التكفير عن أهل البدع بسبب أنّه تكفيرٌ باللوازم،"], [687.0, "وإن صرّح أهلُ السنة بهذه اللوازم من باب التنفير عن القول،"], [693.0, "لا من باب الحكم على أصحابها."], [695.0, "فإنّه لا يخفاكم أنّ أهل السنة قالوا:"], [699.7, "إنّ من شبّه اللهَ بخلقه فقد كفر؛"], [706.0, "لأنّ مقتضى ذلك أن تجعل الخالقَ بمنزلة المخلوق،"], [711.0, "ومع ذلك لا يكفّرون أعيانَ من قال ذلك."]], "tr": [[674.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat, lâzımlar ile tekfir olduğu için bid'at ehlinden tekfirin birçoğunu nefyetmiştir."], [688.1, "Ehl-i Sünnet bu lâzımları açıkça söylemişse de bu, sözden nefret ettirmek kabilindendir;"], [695.0, "sahipleri hakkında hüküm vermek kabilinden değildir."], [699.7, "Malumunuzdur ki Ehl-i Sünnet \"Kim Allah'ı yaratıklarına benzetirse kâfir olur\" demiştir;"], [706.0, "çünkü bunun gereği, Yaratıcı'yı yaratılmış konumuna koymandır."], [711.0, "Buna rağmen bunu söyleyenlerin şahıslarını tekfir etmezler."]]}, {"reader": false, "ar": [[714.0, "بل إنّ مآلَ قول الأشاعرة في مسألة الكلام النفسيّ هو القولُ بخلق القرآن؛"], [723.0, "لأنّهم يقولون: إنّ جبريل لم يسمع كلامًا من حرفٍ وصوتٍ من الله عز وجل،"], [730.0, "ولكنّه خلق ما يريد قولَه في نفس جبريل،"], [733.3, "فعلم ما يريد الله."], [735.0, "فمآلُ قول الأشاعرة في القرآن هو بعينه قولُ المعتزلة،"], [744.0, "ومع ذلك لم يكفّرهم أهلُ السنة والجماعة؛"], [748.0, "لأنّنا لو عرضنا عليهم ذلك لرفضوه."]], "tr": [[714.0, "Hatta Eş'arîlerin kelâm-ı nefsî meselesindeki sözlerinin varacağı yer, Kur'an'ın mahlûk olduğu görüşüdür."], [723.0, "Çünkü onlar şöyle der: Cebrâil, Allah Azze ve Celle'den harf ve sesten oluşan bir kelam işitmemiştir;"], [730.0, "fakat O, söylemek istediğini Cebrâil'in nefsinde yaratmıştır;"], [732.5, "böylece Cebrâil Allah'ın ne istediğini bilmiştir."], [735.0, "Eş'arîlerin Kur'an hakkındaki sözünün varacağı yer, aynen Mu'tezile'nin sözüdür."], [740.7, "Buna rağmen Ehl-i Sünnet ve'l-Cemaat onları tekfir etmemiştir;"], [748.0, "çünkü bunu onlara arz etseydik reddederlerdi."]]}, {"reader": false, "ar": [[751.0, "بل إنّ من أنكر صفاتِ الله عز وجل،"], [755.3, "فإنّ من لوازم تعطيل الله عن صفاته أنّه يصف ربَّه بالعدم،"], [761.0, "فليس فوق العرش ربٌّ يُعبد،"], [764.5, "ولا إلهٌ يُصلّى له ويُسجد."], [769.0, "لكن هل نكفّرهم بهذا اللازم؟"], [771.1, "الجواب: لا، وهذا من عدل أهل السنة والجماعة."], [776.0, "وإلا فلوازمُ السوء على أقوال أهل البدع كثيرةٌ جدًّا،"], [782.0, "فلو أنّنا حاسبناهم عليها لكفّرناهم،"], [786.0, "ولأخرجناهم عن دائرة الإسلام بالكلّيّة،"], [789.0, "ولكن ليس هذا من العدل أبدًا، فالواجب التنبّهُ لذلك."]], "tr": [[751.0, "Hatta Allah Azze ve Celle'nin sıfatlarını inkâr eden kimse:"], [754.7, "Allah'ı sıfatlarından ta'til etmenin lâzımlarından biri, Rabbini yoklukla nitelemesidir;"], [758.5, "buna göre Arş'ın üzerinde ibadet edilen bir Rab ve kendisi için namaz kılınıp secde edilen bir İlah yoktur."], [769.0, "Fakat onları bu lâzım ile tekfir eder miyiz?"], [771.6, "Cevap: Hayır. Bu, Ehl-i Sünnet ve'l-Cemaat'in adaletindendir."], [776.0, "Yoksa bid'at ehlinin sözleri üzerine lâzım gelen kötü sonuçlar pek çoktur;"], [782.0, "onları bunlarla hesaba çekseydik onları tekfir eder ve İslam dairesinden tamamen çıkarırdık."], [789.7, "Fakat bu asla adaletten değildir. Buna dikkat etmek vaciptir."]]}, {"reader": false, "ar": [[795.0, "بل إنّكم تسمعون من بعض المعاصرين أنّه يقول:"], [800.0, "«وأمّا إخوانُنا من أهل الكتاب فإنّهم كذا وكذا»،"], [805.0, "ومقتضى أُخوّته رضاه بما هم عليه من الكفر،"], [814.0, "أليس كذلك؟ ولكنّنا لا نعامله بلازم قوله،"], [821.0, "وإلا فليس بيننا وبين كافرٍ شيءٌ من أُخوّة الدين ولا الإيمان."], [829.0, "وأمّا قول الله عز وجل:"], [831.5, "<span class=\"ayah\">﴿إِذْ قَالَ لَهُمْ أَخُوهُمْ نُوحٌ﴾<\/span> <span class=\"ref\">[الشعراء: ١٠٦]<\/span>،"], [834.0, "<span class=\"ayah\">﴿إِذْ قَالَ لَهُمْ أَخُوهُمْ هُودٌ﴾<\/span> <span class=\"ref\">[الشعراء: ١٢٤]<\/span>،"], [836.0, "<span class=\"ayah\">﴿إِذْ قَالَ لَهُمْ أَخُوهُمْ صَالِحٌ﴾<\/span> <span class=\"ref\">[الشعراء: ١٤٢]<\/span>،"], [840.0, "فإنّما هي الأخوّة العِرقيّة النسبيّة القبَليّة،"], [845.0, "وليست الأخوّة الدينيّة الأمريّة الشرعيّة، والله أعلم."]], "tr": [[795.0, "Hatta bazı çağdaşlardan şöyle dediğini işitirsiniz:"], [800.0, "\"Ehl-i kitaptan kardeşlerimize gelince, onlar şöyle şöyledir.\" Onun bu kardeşliğinin gereği, onların üzerinde bulunduğu küfre razı olmasıdır, öyle değil mi?"], [815.5, "Fakat biz ona sözünün lâzımı ile muamele etmeyiz."], [821.7, "Yoksa bizimle bir kâfir arasında din ya da iman kardeşliğinden hiçbir şey yoktur."], [829.0, "Allah Azze ve Celle'nin şu sözlerine gelince:"], [831.5, "<span class=\"ayah\">﴿Hani kardeşleri Nûh onlara demişti ki﴾<\/span> [Şuarâ 106], <span class=\"ayah\">﴿Hani kardeşleri Hûd onlara demişti ki﴾<\/span> [Şuarâ 124], <span class=\"ayah\">﴿Hani kardeşleri Sâlih onlara demişti ki﴾<\/span> [Şuarâ 142];"], [840.8, "bu ancak soy, neseb ve kabile kardeşliğidir;"], [845.0, "dinî, emrî ve şer'î kardeşlik değildir. Allah en iyisini bilir."]]}]}, {"ts": "14:09", "title": "2. Külliye: İçtihada dayanan bir tekfirle insanları imtihan etmek caiz değildir", "paras": [{"reader": false, "ar": [[850.6, "ومن الكلّيّات أيضًا: <b>كلُّ تكفيرٍ كان عن اجتهادٍ فلا يجوز امتحانُ الناس به.<\/b> واضح؟"], [872.5, "<span class=\"note\">(يكررها)<\/span> أظنّ واضحٌ الكلام،"], [878.7, "ها؟ أُعيدها مرةً ثالثة:"], [881.0, "<b>كلُّ تكفيرٍ كان عن اجتهادٍ فلا يجوز امتحانُ الناس به.<\/b>"]], "tr": [[850.6, "Külliyelerden biri de şudur: 2."], [854.0, "külliye: İçtihada dayanan her tekfir ile insanları imtihan etmek caiz değildir. Açık mı?"], [872.5, "(Tekrar ediyor.) Sanırım söz açık, değil mi?"], [879.0, "Üçüncü kez tekrar ediyorum: <b>İçtihada dayanan her tekfir ile insanları imtihan etmek caiz değildir.<\/b>"]]}, {"reader": false, "ar": [[889.0, "فلا يجوز امتحانُ الناس به."], [892.2, "أقول وبالله التوفيق: وذلك لأنّ التكفير ينقسم إلى قسمين:"], [898.0, "إلى تكفيرٍ مقطوعٍ به،"], [900.7, "متواترٍ، معلومٍ من الدين بالضرورة؛"], [904.0, "فهذا يجب على كلّ أحدٍ أن ينصاع إليه وأن ينقاد إليه،"], [911.0, "ولا تجوز مخالفتُه، وهو الذي يقول فيه أهلُ العلم رحمهم الله تعالى:"], [917.0, "«من لم يكفّر الكافرَ المقطوعَ بكفره فقد كفر»."], [924.0, "فمن ناقشنا في كفر النصارى فقد كفر؛"], [929.0, "لأنّ كفرهم مقطوعٌ به،"], [931.9, "مُجمَعٌ عليه، متواتر. ومن شكّك في كفر اليهود فهو كافر؛"], [938.7, "لأنّ تكفيرهم منصوصٌ عليه عينًا، ومقطوعٌ به، ومتواتر."]], "tr": [[889.0, "Onunla insanları imtihan etmek caiz değildir."], [894.1, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [898.0, "Tekfir iki kısma ayrılır. Birincisi kesin, mütevâtir ve dinden zaruri olarak bilinen tekfirdir."], [904.0, "Buna herkesin boyun eğmesi ve teslim olması vaciptir;"], [907.8, "ona muhalefet etmek caiz değildir."], [910.4, "İlim ehlinin rahimehumullahu teâlâ hakkında \"Küfrü kesin olan kâfiri tekfir etmeyen kâfir olur\" dediği budur."], [917.0, "Hristiyanların küfrü hakkında bizimle tartışan kâfir olur;"], [924.0, "çünkü onların küfrü kesindir, üzerinde icmâ vardır ve mütevâtirdir."], [934.0, "Yahudilerin küfrü hakkında şüphe uyandıran kâfirdir;"], [938.7, "çünkü onların tekfiri nas ile açıkça belirtilmiştir, kesindir ve mütevâtirdir."]]}, {"reader": false, "ar": [[948.0, "ومن شكّ في كفر إبليس،"], [950.8, "أو فرعون، أو هامان،"], [953.1, "أو شكّ في كفر أبي لهب أو أبي جهل،"], [958.2, "أو غيرهم من أصناف الكفرة ممّن ثبت كفرُهم بالنصّ عينًا،"], [965.0, "أو وقع عليه الإجماعُ المتواتر المقطوع به،"], [970.0, "فإنّه كافر. فإنّ من نواقض الإسلام العشرة:"], [974.0, "من لم يكفّر المشركين،"], [978.0, "أو شكّ في كفرهم،"], [979.7, "أو صحّح مذهبهم. وهذا محمولٌ على من كان كفرُه مقطوعًا به."], [985.0, "وليس هذا النوعُ من التكفير ممّا تتكلّم عنه هذه الكلّيّة."]], "tr": [[948.0, "İblis'in, Firavun'un ya da Hâmân'ın küfründen şüphe eden, ya da Ebû Leheb'in veya Ebû Cehil'in ya da küfrü nas ile şahsen sabit olan veya hakkında kesin mütevâtir icmâ bulunan diğer kâfir sınıflarının küfründen şüphe eden kâfirdir."], [971.0, "Çünkü İslam'ı bozan on şeyden biri şudur:"], [974.0, "Müşrikleri tekfir etmeyen, ya da onların küfründen şüphe eden veya mezheplerini doğru sayan."], [981.0, "Bu da küfrü kesin olan kimseye hamledilir."], [985.0, "Tekfirin bu türü, bu külliyenin bahsettiği şey değildir."]]}, {"reader": false, "ar": [[994.0, "وإنّما تتكلّم الكلّيّة عن النوع الثاني،"], [998.0, "وهو التكفير الاجتهاديّ؛ بمعنى أنّ هذا الرجل إنّما كُفِّر بتكفيرٍ اجتهادًا في النظر في حاله."], [1010.0, "فهذا النوع من التكفير لا يحلّ أن تبتلي الناسَ به:"], [1016.0, "فمن وافقك فيه فهو مؤمن،"], [1019.0, "ومن خالفك فيه فهو كافر؛"], [1023.0, "فإنّ هذا من الطغيان والبغي بالعلم،"], [1028.0, "وهو محرّمٌ بإجماع أهل السنة والجماعة."], [1032.0, "فلا يجوز أن نبتلي الناسَ بتكفيرٍ ظنّيٍّ اجتهاديّ،"], [1039.0, "حتى ولو كان من كبار العلماء،"], [1043.1, "ما لم يقع عليه الإجماع،"], [1047.0, "ما لم يقع عليه الإجماع."]], "tr": [[994.0, "Külliye ancak ikinci türden, yani içtihadî tekfirden bahsetmektedir."], [1000.0, "Yani bu adam, ancak hâline bakmada içtihat yoluyla yapılan bir tekfirle tekfir edilmiştir."], [1010.0, "Bu tür tekfirle insanları imtihan etmen helal değildir:"], [1016.0, "Bu konuda sana uyan mümindir, sana muhalefet eden kâfirdir (demek)."], [1023.0, "Çünkü bu, azgınlıktan ve ilimle haddi aşmaktandır ve Ehl-i Sünnet ve'l-Cemaat'in icmâıyla haramdır."], [1032.0, "Zannî, içtihadî bir tekfirle insanları imtihan etmemiz caiz değildir;"], [1041.1, "büyük âlimlerden de olsa, üzerinde icmâ olmadıkça —üzerinde icmâ olmadıkça."]]}, {"reader": false, "ar": [[1051.0, "ولأنّ المتقرّر في القواعد أنّ الاجتهاد غيرُ مُلزِمٍ للغير؛"], [1057.0, "فإنّما الاجتهاد يُلزم المجتهدَ فقط،"], [1060.0, "وأمّا غيرُه فلا حقَّ لأحدٍ أن يُلزم الآخرين بنتائج اجتهاداته."], [1066.0, "وبناءً عليه: فلا يحلّ لك أن تكفّر من لم يكفّر من كفّرتَه اجتهادًا،"], [1075.0, "ولا أن تبدّع من (لم يبدّع من) بدّعتَه اجتهادًا،"], [1079.0, "ولا أن تفسّق من لم يوافق على تفسيقك الاجتهاديّ؛"], [1084.9, "فإنّ ذلك من باب الإلزام بالأمور الاجتهاديّة،"], [1089.4, "وهو ممنوعٌ بالإجماع. ولا يزال أهلُ العلم فيما بينهم يجتهدون في أمورٍ كثيرة،"], [1100.0, "ولا يُلزم أحدُهم الأطرافَ الأخرى بقبول اجتهاده،"], [1105.0, "وإلا حاسبهم بما يقتضيه اجتهادُه، والله أعلم."]], "tr": [[1051.0, "Ayrıca kaidelerde sabit olan şudur:"], [1057.0, "İçtihat başkasını bağlamaz; içtihat sadece müçtehidi bağlar."], [1060.0, "Başkasına gelince, hiç kimsenin kendi içtihatlarının sonuçlarını başkalarına dayatmaya hakkı yoktur."], [1066.0, "Buna göre: İçtihaden tekfir ettiğin kimseyi tekfir etmeyeni tekfir etmen helal değildir;"], [1074.1, "içtihaden tebdî' ettiğin kimseyi (tebdî' etmeyeni) tebdî' etmen de, içtihadî tefsîkine katılmayanı tefsîk etmen de helal değildir."], [1084.9, "Çünkü bu, içtihadî meseleleri dayatma babındandır ve icmâ ile yasaktır."], [1094.0, "İlim ehli kendi aralarında birçok meselede hep içtihat etmişlerdir;"], [1098.2, "hiçbiri diğer tarafları kendi içtihadını kabul etmeye zorlamaz, (kabul etmezlerse) onları içtihadının gerektirdiğiyle hesaba çekmez. Allah en iyisini bilir."]]}]}, {"ts": "18:33", "title": "3. Külliye: İçtihadî ihtilaf bulunan bir küfür, vera' gereği şahıslara uygulanmaz", "paras": [{"reader": false, "ar": [[1113.0, "الكلّيّة الثالثة: <b>كلُّ كفرٍ مختلَفٍ فيه اختلافًا اجتهاديًّا فلا يُنزَّل على الأعيان ورعًا.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرةً ثالثة:"], [1141.0, "<b>كلُّ كفرٍ مختلَفٍ فيه اختلافًا اجتهاديًّا فلا يُنزَّل على الأعيان ورعًا.<\/b>"]], "tr": [[1113.0, "<b>3. külliye: Hakkında içtihadî bir ihtilaf bulunan her küfür, vera' (takva ihtiyatı) gereği şahıslara uygulanmaz.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [1141.7, "<b>Hakkında içtihadî bir ihtilaf bulunan her küfür, vera' gereği şahıslara uygulanmaz.<\/b>"]]}, {"reader": false, "ar": [[1148.0, "أقول وبالله التوفيق: ذلك لأنّ من مقتضيات التكفير عندنا ـ معاشرَ أهل السنة والجماعة ـ أن نكفّر بلا شبهة."], [1163.0, "فمتى ما طرأت الشبهةُ في الأمر التكفيريّ،"], [1166.0, "فإنّ وجود الشبهة يجعلنا نترفّع عن تكفير الأعيان."], [1171.0, "وإنّ من أعظم الشُّبه التي تجعل الإنسان يتورّع عن تكفير المعيّن:"], [1177.0, "قوّةَ الخلاف في التكفير من عدمه في هذه الجزئيّة."], [1181.0, "فنكتفي بأن نقول: من قال كذا فهو كافر،"], [1184.7, "ومن فعل كذا فهو كافر،"], [1187.0, "ولكن لا ننزل من الإطلاق إلى التقييد،"], [1191.7, "ولا من الأوصاف إلى التعيين،"], [1195.0, "من باب الورع. وأنتم تعرفون أنّ الورع هو تركُ الشيء الذي يُخشى ضررُه في الآخرة."]], "tr": [[1148.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [1152.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğuna göre tekfirin gereklerinden biri, şüphesiz tekfir etmemizdir."], [1163.0, "Tekfirle ilgili bir meselede şüphe ortaya çıktığında, şüphenin varlığı bizi şahısları tekfir etmekten uzak durmaya sevk eder."], [1171.0, "İnsanı muayyen kişiyi tekfir etmekten çekindiren en büyük şüphelerden biri, bu cüz'î meselede tekfir edilip edilmeyeceği hakkındaki ihtilafın güçlü olmasıdır."], [1182.4, "Bu durumda \"Kim şöyle derse kâfirdir, kim şöyle yaparsa kâfirdir\" demekle yetiniriz;"], [1189.0, "fakat vera' kabilinden, mutlaktan takyîde, vasıflardan ta'yîne (belirli şahsa) inmeyiz."], [1197.0, "Bilirsiniz ki vera', âhirette zararından korkulan şeyi terk etmektir."]]}]}, {"ts": "20:07", "title": "3. Külliye (devam): Namazı, zekâtı ve orucu terk edenin tekfiri", "paras": [{"reader": false, "ar": [[1207.0, "وبما أنّ الإنسان مسؤولٌ عمّا ينطق لسانُه،"], [1211.0, "وأعظمُ فِريةٍ في عِرض المسلم أن تكفّره ـ فإنّ من كفّر مسلمًا فكقتله،"], [1219.0, "والعياذ بالله ـ فلا جَرَمَ أنّ المتورّع الذي يخشى من مغبّة السؤال عن هذا التكفير التعيينيّ يوم القيامة يتورّع عن إنزال الكفر من الأوصاف إلى العين،"], [1234.0, "ومن الإطلاق إلى التقييد،"], [1236.5, "بسبب وجود الشبهة القويّة،"], [1239.0, "وهي شدّةُ اختلاف العلماء في هذه المسألة."]], "tr": [[1207.0, "İnsan dilinin söylediğinden sorumlu olduğuna ve bir Müslümanın ırzına yapılan en büyük iftira onu tekfir etmek olduğuna göre —çünkü bir Müslümanı tekfir eden onu öldürmüş gibidir, Allah korusun— kıyamet günü bu şahsî tekfirden sorulmanın akıbetinden korkan müttakî kişinin, güçlü bir şüphenin, yani âlimlerin bu meselede şiddetle ihtilaf etmesinin varlığı sebebiyle, küfrü vasıflardan şahsa, mutlaktan takyîde indirmekten çekinmesi kaçınılmazdır."]]}, {"reader": false, "ar": [[1242.0, "فإن قلتَ: ولماذا قلتَ «ورعًا»؟"], [1246.0, "فأقول الجواب: لأنّ الإنسان إذا عظُم اجتهادُه في المسألة،"], [1251.4, "ورأى أنّها لم تعُد ظنّيّةً عنده،"], [1255.0, "وإنّما صارت قطعيّة، وأنّ الشبهة فيها منتفية،"], [1259.9, "فيتحمّل ما تحمّل، فلا نقول بأنّه ارتكب حرامًا،"], [1264.2, "ولكنّه خالف مقتضى الورع."], [1266.0, "ولا يزال أهلُ السنة والجماعة ـ رحم الله أمواتَهم وثبّت أحياءهم ـ يتورّعون عن إنزال التكفير من العموم إلى التعيين بسبب قوّة الخلاف في المسألة."]], "tr": [[1242.0, "Eğer \"Neden 'vera' gereği' dedin?\" dersen, cevap olarak derim ki:"], [1246.0, "Çünkü insanın bir meseledeki içtihadı büyür ve o meselenin artık kendisine göre zannî olmadığını, bilakis kesin hâle geldiğini ve onda şüphenin bulunmadığını görürse, yüklendiğini yüklenir."], [1261.3, "Onun bir haram işlediğini söylemeyiz;"], [1263.8, "fakat vera'ın gereğine muhalefet etmiştir."], [1266.0, "Ehl-i Sünnet ve'l-Cemaat —Allah ölülerine rahmet etsin, dirilerine sebat versin— meseledeki ihtilafın güçlü olması sebebiyle tekfiri umumdan ta'yîne indirmekten hep çekinmiştir."]]}, {"reader": false, "ar": [[1281.0, "فيدخل في ذلك تكفيرُ تارك الصلاة؛"], [1286.0, "فإنّ المسألة فيها خلافٌ شديدٌ جدًّا بين أهل العلم،"], [1291.0, "فالأورع أن نقول: من ترك الصلاة التركَ المطلق فقد كفر،"], [1296.0, "لكن لا نُنزّله على معيّنٍ بشخصه من باب الورع."], [1303.0, "ويدخل فيها خلافُهم في تكفير تارك الزكاة؛"], [1309.0, "فإنّ أهل العلم يختلفون في كفر تارك الزكاة المُقِرِّ بوجوبها والممتنعِ عن إخراجها بخلًا وشُحًّا بالمال على قولين،"], [1324.5, "والخلاف فيها شديدٌ وقويّ؛"], [1329.0, "فنصيحتي لمن رآه كافرًا أن يكتفي بقوله:"], [1335.0, "من ترك الزكاة بخلًا فقد كفر،"], [1338.0, "لكن لا ينبغي له أن ينزل من تكفير الأوصاف إلى تكفير الأعيان، من باب الورع."]], "tr": [[1281.0, "Namazı terk edenin tekfiri buna dahildir."], [1286.0, "Bu meselede ilim ehli arasında çok şiddetli bir ihtilaf vardır."], [1289.9, "Vera'a en uygun olan şunu söylememizdir:"], [1292.5, "Namazı mutlak olarak terk eden kâfir olur;"], [1296.0, "fakat vera' kabilinden bunu şahsen belirli birine uygulamayız."], [1303.0, "Zekâtı terk edenin tekfiri hakkındaki ihtilafları da buna dahildir."], [1309.0, "İlim ehli, zekâtın farz olduğunu kabul eden ama cimrilik ve mala düşkünlükten onu vermekten kaçınan kimsenin küfrü hakkında iki görüşle ihtilaf etmiştir;"], [1329.0, "bu konudaki ihtilaf şiddetli ve güçlüdür."], [1335.0, "Onu kâfir görene nasihatim, \"Cimrilikten zekâtı terk eden kâfir olur\" demekle yetinmesidir;"], [1340.8, "fakat vera' kabilinden, vasıfların tekfirinden şahısların tekfirine inmemesi gerekir."]]}, {"reader": false, "ar": [[1345.0, "وكذلك اختلفوا أيضًا في كفر تارك الصيام مع الإقرار بوجوبه على قولين،"], [1353.3, "ومن رأى كفرَه فنصيحتي له ألّا ينزل من تكفير العين ـ من تكفير الوصف ـ إلى تكفير المعيّن؛"], [1362.4, "لشدّة الخلاف فيه. مع أنّ القول الصحيح في هذه المسائل أنّه لا يكفر الإنسان بشيءٍ من ترك أركان الإسلام العمليّة إلا الصلاة،"], [1376.0, "إذا كان تركُه لها التركَ الدائمَ المطلقَ الذي لا ينتهي."], [1381.0, "ولكن على مسيرتنا في التعليم لم نُنزّل هذا الحكم من كونه حكمًا عامًّا على معيّنٍ بخصوصه،"], [1394.0, "على معيّنٍ بخصوصه، من باب الورع. فهمتم هذا؟ طيّب."]], "tr": [[1345.0, "Aynı şekilde, farz olduğunu kabul etmekle birlikte orucu terk edenin küfrü hakkında da iki görüşle ihtilaf etmişlerdir."], [1355.3, "Onun küfrünü görene nasihatim, bu konudaki ihtilafın şiddeti sebebiyle şahsın tekfirinden —vasfın tekfirinden— muayyen kişinin tekfirine inmemesidir."], [1365.0, "Bununla birlikte bu meselelerde sahih görüş şudur:"], [1369.1, "İnsan, İslam'ın amelî rükünlerinden hiçbirini terk etmekle kâfir olmaz;"], [1374.3, "ancak namaz müstesnadır; o da terki, bitmeyen, sürekli ve mutlak bir terk olursa."], [1381.0, "Fakat öğretimdeki yolumuz üzere, vera' kabilinden, bu hükmü genel bir hüküm olmaktan çıkarıp bizzat belirli birine —bizzat belirli birine— uygulamadık. Bunu anladınız mı? Peki."]]}]}, {"ts": "23:21", "title": "4. Külliye: İhtilaflı küfrün sonuçlarının uygulanması kazâ hükmüne bağlıdır", "paras": [{"reader": false, "ar": [[1401.0, "ويوضّح هذا الكلّيّةُ التي بعدها:"], [1404.0, "<b>كلُّ كفرٍ مختلَفٍ فيه فتتوقّف آثارُه تطبيقًا على حكم القضاء.<\/b> ماشي؟"], [1421.0, "كلُّ كفرٍ مختلَفٍ فيه فتتوقّف تطبيقُ آثاره،"], [1428.0, "أو نقول: فتتوقّف آثارُه تطبيقًا على حكم القضاء."], [1434.0, "<b>كلُّ كفرٍ مختلَفٍ فيه فتتوقّف آثارُه تطبيقًا على حكم القضاء.<\/b>"]], "tr": [[1401.0, "Bunu, ondan sonraki külliye açıklar:"], [1404.0, "<b>4. külliye: Hakkında ihtilaf bulunan her küfrün sonuçlarının uygulanması kazâ (mahkeme) hükmüne bağlıdır.<\/b> Tamam mı?"], [1422.0, "Hakkında ihtilaf bulunan her küfrün sonuçlarının uygulanması..."], [1429.5, "ya da şöyle diyelim: Sonuçlarının uygulanması kazâ hükmüne bağlıdır."], [1434.7, "<b>Hakkında ihtilaf bulunan her küfrün sonuçlarının uygulanması kazâ hükmüne bağlıdır.<\/b>"]]}, {"reader": false, "ar": [[1444.0, "أقول وبالله التوفيق: فلا يجوز لنا أن نعمد إلى تطبيق شيءٍ من الآثار التكفيريّة على معيّنٍ في تكفيرٍ مختلَفٍ فيه،"], [1456.8, "إلا إذا صدر حكمُ تكفيره بحكم القضاء."], [1462.0, "وإنّما واجبُنا فقط الدعوةُ والنصيحة،"], [1465.4, "أو التحذير من الوقوع فيما وقع فيه،"], [1472.0, "أو نرفع أمرَه إلى الحاكم ليأخذ القاضي حكمَه فيه."], [1478.0, "فلا يحلّ لآحاد الأمّة أن يفسخوا نكاحَ زوجته من تلقاء أنفسهم،"], [1487.0, "ولا أن يقيموا عليه حدَّ الردّة من تلقاء أنفسهم،"], [1492.0, "ولا أن يمنعوا المسلمين من الصلاة عليه من تلقاء أنفسهم،"], [1498.0, "ولا أن يطبّقوا عليه شيئًا من آثار القول بأنّه كافر،"], [1504.0, "ما لم يصدر فيه حكمُ القضاء."]], "tr": [[1444.0, "Tevfik Allah'tandır, derim ki: Hakkında ihtilaf bulunan bir tekfirde, tekfir hükmü kazâ hükmüyle sadır olmadıkça, tekfirin sonuçlarından herhangi birini belirli bir kişiye uygulamaya kalkışmamız caiz değildir."], [1462.0, "Bizim vazifemiz sadece davet ve nasihat ya da onun düştüğü şeye düşmekten sakındırmaktır;"], [1469.5, "ya da kadının onun hakkında hükmünü vermesi için meselesini yöneticiye götürürüz."], [1478.0, "Ümmetin fertlerinin kendiliklerinden onun karısıyla nikâhını feshetmeleri, kendiliklerinden ona irtidat haddi uygulamaları, kendiliklerinden Müslümanları onun cenaze namazını kılmaktan alıkoymaları ya da hakkında kazâ hükmü sadır olmadıkça onun kâfir olduğu görüşünün sonuçlarından herhangi birini ona uygulamaları helal değildir."]]}, {"reader": false, "ar": [[1508.0, "وبناءً على ذلك: فلا يحلّ لك أن تحرّم الزوجةَ على زوجها التارك للصلاة إلا إذا صدر بكفره حكمُ القضاء،"], [1518.0, "ولا أن تمنع الناسَ من الصلاة عليه إذا قُدِّم بين ظهرانيهم إلا إذا صدر بكفره حكمُ القضاء،"], [1528.0, "ولا أن تجزم بأنّه لا يُغسَّل ولا يُكفَّن ولا يُدفن في مقابر المسلمين ولا يرثه أولادُه إلا إذا صدر في حقّه حكمُ القضاء."], [1543.0, "وهكذا في سائر الآثار التكفيريّة في هذا الكفر المختلَف فيه،"], [1550.0, "فإنّه لا بدّ فيه من صدور حكم القضاء؛"], [1554.0, "لأنّ المتقرّر في القواعد أنّ حكم الحاكم يرفع الخلاف."], [1559.0, "فانتبهوا لهذا؛ لأنّنا نرى أنّ بعض الناس يبدأ بتطبيق الآثار التكفيريّة على من يكفّره اجتهادًا قبل رفع أمره للحاكم وصدور حكم القضاء، والله أعلم."]], "tr": [[1508.0, "Buna göre: Namazı terk eden kocanın küfrüne dair kazâ hükmü sadır olmadıkça, karısını ona haram kılman helal değildir."], [1509.8, "Önlerine (cenazesi) konulduğunda, küfrüne dair kazâ hükmü sadır olmadıkça insanları onun cenaze namazını kılmaktan alıkoyman da helal değildir."], [1520.9, "Hakkında kazâ hükmü sadır olmadıkça onun yıkanmayacağına, kefenlenmeyeceğine, Müslüman mezarlığına defnedilmeyeceğine ve çocuklarının ona mirasçı olmayacağına kesin hükmetmen de helal değildir."], [1535.7, "Bu ihtilaflı küfürdeki diğer bütün tekfir sonuçları da böyledir;"], [1543.0, "bunda mutlaka kazâ hükmünün sadır olması gerekir."], [1550.0, "Çünkü kaidelerde sabit olan şudur:"], [1554.0, "Hâkimin hükmü ihtilafı kaldırır. Buna dikkat edin;"], [1559.0, "çünkü bazı insanların, içtihaden tekfir ettiği kimseye, meselesini yöneticiye götürmeden ve kazâ hükmü sadır olmadan önce tekfir sonuçlarını uygulamaya başladığını görüyoruz. Allah en iyisini bilir."]]}]}, {"ts": "26:19", "title": "5. Külliye: Küfrü rıza ve ikrar yoluyla hikâye eden kâfirdir; haber ve uyarı yoluyla hikâye eden kâfir olmaz", "paras": [{"reader": false, "ar": [[1579.0, "ومن الكلّيّات أيضًا: كلُّ من حكى كفرًا حكايةَ رضًا وإقرارٍ فكافر،"], [1595.0, "ومن حكاها حكايةَ إخبارٍ وإنذارٍ فلا يكفر. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1579.0, "Külliyelerden biri de şudur: 5."], [1583.0, "külliye: Bir küfrü rıza ve ikrar (onaylama) yoluyla hikâye eden (aktaran) herkes kâfirdir;"], [1595.0, "onu haber verme ve uyarma yoluyla hikâye eden ise kâfir olmaz. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1619.0, "أقول وبالله التوفيق: وما دلّت عليه هذه الكلّيّة هو الحقّ الذي يجب الأخذ به،"], [1631.0, "والعدل الذي لا ينبغي الحَيدةُ عنه؛"], [1636.0, "فإنّ مجرّد الحكاية لا تجعلنا ننسب المحكيَّ للحاكي،"], [1646.0, "إلا إذا صدرت منه قرائنُ الرضا والإقرار بما يحكيه."], [1651.0, "وأمّا إذا حكاه حكايةَ إنذارٍ وتخويفٍ منه،"], [1657.0, "أو حكاه حكايةَ إخبارٍ عن قصّةٍ حصلت،"], [1662.0, "فإنّ ذلك دليلٌ على أنّه لم يرضَ به."], [1666.0, "وليس مجرّدُ حركة اللسان بكلمة الكفر حكايةً توجب كفرَ من يحكيها،"], [1676.0, "إلا بضميمة قرينة الإقرار والرضا."], [1681.0, "فمن حكى الكفرَ راضيًا به فإنّه كافر،"], [1686.0, "أو حكاه مُقِرًّا له أو به فإنّه كافر."]], "tr": [[1619.0, "Tevfik Allah'tandır, derim ki: Bu külliyenin delalet ettiği şey, alınması vacip olan hak ve ondan sapılmaması gereken adalettir."], [1636.0, "Çünkü sırf hikâye etmek, hikâye edilen şeyi hikâye edene nispet etmemizi gerektirmez;"], [1646.0, "ancak ondan hikâye ettiği şeye rıza ve ikrar karîneleri sadır olursa (nispet edilir)."], [1651.0, "Onu ondan uyarmak ve korkutmak üzere hikâye ederse ya da olmuş bir kıssayı haber vermek üzere hikâye ederse, bu onun ona razı olmadığının delilidir."], [1666.0, "Dilin küfür kelimesiyle sırf hikâye olarak hareket etmesi, ikrar ve rıza karînesi eklenmedikçe, onu hikâye edenin küfrünü gerektirmez."], [1681.0, "Küfrü ona razı olarak hikâye eden kâfirdir;"], [1686.0, "ya da onu onaylayarak hikâye ederse kâfirdir."]]}, {"reader": false, "ar": [[1692.0, "ويعجبني في ذلك نقلٌ عن الشيخ محمد بن إبراهيم ـ مفتي الديار السعوديّة في زمانه ـ رحمه الله تعالى،"], [1701.0, "قال: «وفي كلام العلماء ما يدلّ على أنّ المسألة ليست على هذا الإطلاق، بل فيها تفصيلٌ يتلخّص في أنّ حاكي الكفر عن الغير يختلف حكمُه باختلاف القرائن؛ فإن كانت الحكاية لغرضٍ شرعيٍّ فالأمر كذلك لإجماع أئمّة الهدى» ـ «فالأمر كذلك» يعني:"], [1728.5, "أنّه لا يكفر؛ لأنّه حكاها لغرضٍ شرعيّ،"], [1732.0, "إمّا ليحذّر منها، والتحذير غرضٌ شرعيّ ـ ويقول:"], [1736.7, "«فالأمر كذلك لإجماع أئمّة الهدى على حكايات مقالات الكفرة والملحدين في كتبهم التي صنّفوها، ومجالسهم <span class=\"q\">؟ 29:09<\/span>، ليبيّنوا ما فيها من فسادٍ ليُجتنَب، وليُبطلوا شُبَهَها عليهم."]], "tr": [[1692.0, "Bu konuda Şeyh Muhammed b."], [1693.6, "İbrâhîm'den —zamanında Suudi diyarının müftüsü, Allah ona rahmet etsin— yapılan bir nakil hoşuma gider."], [1697.8, "Şöyle der: \"Âlimlerin sözlerinde meselenin bu mutlaklıkta olmadığını gösteren şeyler vardır;"], [1701.7, "bilakis onda bir tafsilat vardır."], [1706.4, "Özeti şudur: Küfrü başkasından hikâye edenin hükmü karînelerin farklılığına göre değişir."], [1716.9, "Eğer hikâye şer'î bir amaç için ise durum böyledir;"], [1728.5, "çünkü hidayet imamlarının icmâı vardır.\" —\"Durum böyledir\" yani kâfir olmaz;"], [1730.0, "çünkü onu şer'î bir amaç için hikâye etmiştir;"], [1732.0, "mesela ondan sakındırmak için; sakındırmak da şer'î bir amaçtır.— Ve şöyle der:"], [1736.7, "\"Durum böyledir; çünkü hidayet imamları, kâfirlerin ve mülhidlerin görüşlerini, telif ettikleri kitaplarında ve meclislerinde <span class=\"q\">؟<\/span>, onlardaki bozukluğu açıklayıp ondan kaçınılsın diye ve onların şüphelerini çürütmek için hikâye etmekte icmâ etmişlerdir."]]}, {"reader": false, "ar": [[1756.0, "ومن أدلّتهم على ذلك:"], [1757.7, "أنّ الله تعالى قد حكى مقالاتِ المفترين عليه وعلى رسله في كتابه على وجه الإنكار لقولهم،"], [1765.0, "والتحذير من كفرهم، والوعيد عليه بالعقاب في الدارين،"], [1770.0, "والردّ عليهم بما بيّنه في محكم كتابه."], [1773.0, "وكذلك وقع في أحاديث النبيّ صلى الله عليه وسلم الصحيحة»."], [1777.2, "هذه الحالة الأولى. ثم قال:"], [1785.0, "«وإن كانت الحكاية على وجه الاستحسان لمقالة المحكيّ عنه، فلا شكّ في كفر الحاكي، واستحقاقه بما يستحقّه المحكيُّ عنه»."], [1798.0, "يعني: المحكيُّ عنه كافر،"], [1800.4, "والحاكي لها إقرارًا واستحسانًا كافرٌ أيضًا."], [1804.0, "انتهى كلامه رحمه الله تعالى، والله أعلم."]], "tr": [[1756.0, "Bu konudaki delillerinden biri şudur:"], [1757.7, "Allah Teâlâ, Kitabı'nda kendisine ve resullerine iftira edenlerin sözlerini, onların sözünü inkâr etmek, küfürlerinden sakındırmak, buna karşı iki dünyada ceza ile tehdit etmek ve Kitabı'nın muhkem ayetlerinde açıkladığı şeyle onlara reddiye vermek üzere hikâye etmiştir."], [1773.0, "Nebî ﷺ'in sahih hadislerinde de böyle olmuştur.\" Bu birinci hâldir."], [1777.2, "Sonra şöyle der: \"Eğer hikâye, hikâye edilen kişinin sözünü güzel görme şeklinde ise, hikâye edenin küfründe ve hikâye edilenin hak ettiğini hak ettiğinde şüphe yoktur.\" Yani hikâye edilen kâfirdir;"], [1798.0, "onu ikrar ve güzel görerek hikâye eden de kâfirdir."], [1802.8, "Sözü bitti, Allah ona rahmet etsin. Allah en iyisini bilir."]]}]}, {"ts": "30:07", "title": "6. Külliye: Zâtı itibarıyla küfür olan şeyle tekfir için istihlâl şart değildir", "paras": [{"reader": false, "ar": [[1807.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما كان كفرًا بذاته فلا يُشترط الاستحلالُ للتكفير به.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1807.0, "Külliyelerden biri de şudur: 6."], [1809.0, "külliye: Zâtı itibarıyla küfür olan her şeyle tekfir etmek için istihlâl (helal sayma) şart koşulmaz. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1852.0, "أقول وبالله التوفيق: وذلك لأنّ الذنوب عندنا تنقسم إلى قسمين:"], [1858.0, "إلى ذنوبٍ هي كفرٌ بذاتها وصورتها،"], [1861.0, "وإلى ذنوبٍ ليست كفرًا لا بذاتها ولا بصورتها."], [1866.0, "وهذه القاعدة في النوع الأول،"], [1870.0, "وستأتي كلّيّةُ النوع الثاني إن شاء الله تعالى."], [1874.0, "فما كان كفرًا بصورته وذاته فإنّنا نكفّر من وقع فيه غيرَ مستفصِلين قلبَه:"], [1883.0, "أهو مستحلٌّ لما فعل أو غيرُ مستحلّ؟"]], "tr": [[1852.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [1854.4, "Bize göre günahlar iki kısma ayrılır:"], [1858.0, "Zâtı ve sureti itibarıyla küfür olan günahlar ve ne zâtı ne de sureti itibarıyla küfür olmayan günahlar."], [1866.0, "Bu kaide birinci tür hakkındadır;"], [1870.0, "ikinci türün külliyesi de inşallah gelecektir."], [1874.0, "Sureti ve zâtı itibarıyla küfür olan şeye düşen kimseyi, kalbini —yaptığını helal mi sayıyor, yoksa helal saymıyor mu diye— tafsilatıyla sorgulamadan tekfir ederiz."]]}, {"reader": false, "ar": [[1886.0, "فإذا رأينا الإنسان يسبّ اللهَ عز وجل فإنّنا نكفّره،"], [1891.7, "ولا نسأله: أأنت تستحلّ سبَّ الله أو لا تستحلّ؟"], [1898.0, "وإذا رأينا الإنسان يطأ المصحفَ بقدمه فإنّنا نكفّره،"], [1903.3, "ولا نسأله: أأنت مستحلٌّ لذلك أو لا؟"], [1908.0, "وإذا رأيناه يسجد للصنم سجدةَ تعظيمٍ وتعبّد فإنّنا نكفّره،"], [1916.1, "ولا نسأله: أأنت مستحلٌّ لذلك أو لا؟"], [1920.0, "وإذا رأيناه يستهزئ بالله،"], [1922.8, "أو برسوله، أو بدينه وشريعته،"], [1927.0, "أو بشيءٍ من آيات الله عز وجل،"], [1930.0, "فإنّنا نكفّره، ولا نسأله:"], [1932.0, "هل أنت مستحلٌّ لذلك أو لا؟"]], "tr": [[1886.0, "Bir insanın Allah Azze ve Celle'ye sövdüğünü görürsek onu tekfir ederiz ve ona \"Allah'a sövmeyi helal sayıyor musun, saymıyor musun?\" diye sormayız."], [1898.0, "Bir insanın Mushaf'ı ayağıyla çiğnediğini görürsek onu tekfir ederiz ve ona \"Bunu helal sayıyor musun, saymıyor musun?\" diye sormayız."], [1908.0, "Onun puta tazim ve ibadet secdesiyle secde ettiğini görürsek onu tekfir ederiz ve ona \"Bunu helal sayıyor musun, saymıyor musun?\" diye sormayız."], [1920.0, "Onun Allah ile, Resûlü ile, dini ve şeriatiyle ya da Allah Azze ve Celle'nin ayetlerinden herhangi biriyle alay ettiğini görürsek onu tekfir ederiz ve ona \"Bunu helal sayıyor musun, saymıyor musun?\" diye sormayız."]]}, {"reader": false, "ar": [[1935.0, "فإنّ الاستحلال فيما صورتُه كفرٌ بالذات هو منهجُ أهل الإرجاء،"], [1944.2, "كما ستأتينا كلّيّتُهم في ذلك إن شاء الله تعالى."], [1949.0, "فأهل السنة والجماعة مُجمِعون على أنّ ما كان كفرًا بصورته وذاته فإنّه لا يُشترط للتكفير به الاستحلال."], [1961.0, "ومرجعُ ذلك هو أنّ الكفر عند أهل السنة يتعدّد سببُه:"], [1972.0, "فقد يكون جحودًا وإباءً،"], [1975.0, "وقد يكون عنادًا واستكبارًا،"], [1978.0, "وقد يكون كفرًا قوليًّا،"], [1981.0, "أو كفرًا عمليًّا، أو كفرَ جحودٍ، يعني: كفرٌ قلبيّ."]], "tr": [[1935.0, "Zâtı itibarıyla sureti küfür olan şeyde istihlâl (şartı), irca ehlinin metodudur;"], [1945.2, "inşallah bu konudaki külliyeleri bize gelecektir."], [1949.0, "Ehl-i Sünnet ve'l-Cemaat, sureti ve zâtı itibarıyla küfür olan şeyle tekfir için istihlâlin şart koşulmadığında icmâ etmiştir."], [1961.0, "Bunun dayanağı şudur: Ehl-i Sünnet'e göre küfrün sebebi çeşitlidir:"], [1972.0, "Bazen inkâr ve diretme olur, bazen inat ve kibir olur, bazen sözlü küfür ya da amelî küfür olur, ya da cühûd küfrü, yani kalbî küfür olur."]]}, {"reader": false, "ar": [[1987.0, "وأمّا المرجئة فليس الكفر عندهم إلا نوعًا واحدًا فقط،"], [1994.0, "إلا نوعًا واحدًا فقط،"], [1996.9, "وهو كفرُ القلب. وأمّا كفرُ اللسان فهو عبارةٌ عن الكفر وليس كفرًا،"], [2004.0, "وكفرُ العمل عبارةٌ عن الكفر وليس كفرًا،"], [2009.0, "ما لم تقترن بجحود القلب واستحلاله."], [2014.0, "أفهمتم هذا؟ هذا هو أصلُ المسألة وفيصلُها."]], "tr": [[1987.0, "Mürcie'ye gelince, onlara göre küfür sadece tek bir türdür —sadece tek bir türdür—, o da kalbin küfrüdür."], [1999.0, "Dilin küfrü ise küfrün ifadesidir, küfür değildir;"], [2002.9, "amelin küfrü de küfrün ifadesidir, küfür değildir;"], [2008.3, "kalbin inkârı ve istihlâli ile birleşmedikçe."], [2014.0, "Bunu anladınız mı? Meselenin aslı ve hüküm noktası budur."]]}, {"reader": false, "ar": [[2019.0, "وعلى ذلك تكاثرت نقولُ أهل العلم،"], [2022.0, "فاستمعوها معي. قال الإمام عبد الله بن الزبير الحُميديّ رحمه الله تعالى:"], [2029.0, "«أُخبرتُ أنّ قومًا يقولون: إنّ من أقرّ بالصلاة والزكاة والصوم والحجّ» ـ انتبه ـ «ولم يفعل من ذلك شيئًا حتى يموت، أو يصلّي مستدبرَ القبلة حتى يموت، فهو مؤمنٌ ما لم يكن جاحدًا»."], [2051.0, "هذا اللي سمعه؛ يعني:"], [2053.6, "أنّه وإن فعل هذه الأمورَ الكفريّة فإنّه لا يزال مؤمنًا ما لم يجحد،"], [2061.6, "أي: ما لم يستحلّ."], [2064.0, "«فهو مؤمنٌ ما لم يجحد، ما لم يكن جاحدًا، إذا كان يُقرّ بالفرائض واستقبال القبلة. فقلتُ: هذا الكفرُ الصُّراح، وخلافُ كتاب الله وسنّة رسوله صلى الله عليه وسلم وفعلِ المسلمين». انتهى كلامه."]], "tr": [[2019.0, "Buna dair ilim ehlinin nakilleri çoğalmıştır;"], [2020.5, "benimle birlikte onları dinleyin. İmam Abdullah b."], [2023.0, "ez-Zübeyr el-Humeydî rahimehullahu teâlâ şöyle demiştir:"], [2025.4, "\"Bana haber verildi ki bir topluluk şöyle diyormuş:"], [2029.0, "Namazı, zekâtı, orucu ve haccı kabul eden\" —dikkat et— \"ve ölünceye kadar bunlardan hiçbirini yapmayan ya da ölünceye kadar kıbleye arkasını dönerek namaz kılan kimse, inkâr etmedikçe mümindir.\" Bu, onun işittiği şeydir."], [2053.0, "Yani bu küfrî şeyleri yapsa bile inkâr etmedikçe, yani helal saymadıkça hâlâ mümindir."], [2064.0, "\"Farzları ve kıbleye yönelmeyi kabul ediyorsa, inkâr etmedikçe, inkârcı olmadıkça mümindir."], [2072.0, "Ben de dedim ki: Bu apaçık küfürdür;"], [2079.7, "Allah'ın Kitabı'na, Resûlü ﷺ'in Sünnetine ve Müslümanların uygulamasına aykırıdır.\" Sözü bitti."]]}, {"reader": false, "ar": [[2090.0, "وقال الإمام إسحاق بن راهويه رحمه الله تعالى:"], [2094.0, "«ممّا أجمعوا على تكفيره، وحكموا عليه كما حكموا على الجاحد: فالمؤمنُ الذي آمن بالله تعالى وبما جاء من عنده، ثم قتل نبيًّا» ـ هذا كفرٌ عمليّ عندنا،"], [2105.9, "ها ـ قال: «ثم قتل نبيًّا، أو أعان على قتله، أو كان مُقرًّا ويقول: قتلُ الأنبياء محرَّم، فهو كافرٌ عندنا. وكذلك من شتم نبيًّا، أو ردّ عليه قولَه من غير تقيّةٍ ولا خوف»."], [2122.0, "يعني: مهما قال بأنّني أُحرّم ذلك ولا أُحِلّه،"], [2126.0, "إلا أنّ صورته كفرٌ بذاتها."]], "tr": [[2090.0, "İmam İshâk b. Râhûye rahimehullahu teâlâ şöyle demiştir:"], [2094.0, "\"Tekfir edilmesinde icmâ ettikleri ve hakkında inkârcı hakkında hükmettikleri gibi hükmettikleri şeylerden biri şudur:"], [2098.0, "Allah Teâlâ'ya ve O'nun katından gelene iman eden, sonra bir peygamberi öldüren mümin\" —bu bize göre amelî küfürdür, değil mi?— diyor ki:"], [2106.7, "\"Sonra bir peygamberi öldüren, ya da öldürülmesine yardım eden, ya da (bunu) kabul edip 'Peygamberleri öldürmek haramdır' diyen kimse bize göre kâfirdir."], [2117.4, "Aynı şekilde bir peygambere söven ya da takiyye ve korku olmaksızın onun sözünü reddeden de böyledir.\" Yani \"Ben bunu haram sayıyorum, helal saymıyorum\" dese bile, onun sureti zâtı itibarıyla küfürdür."]]}, {"reader": false, "ar": [[2131.0, "وقال الإمام إسحاق أيضًا:"], [2134.0, "«أجمع المسلمون على أنّ من سبّ الله، أو سبّ رسولَه صلى الله عليه وسلم، أو دفع شيئًا ممّا أنزل الله عز وجل، أو قتل نبيًّا من أنبياء الله، أنّه كافرٌ بذلك، وإن كان مُقرًّا بكلّ ما أنزل الله»."], [2149.0, "ما يُشترط الاستحلال، ما يُشترط الاستحلال؛"], [2150.0, "صورةُ الذنب إذا كانت كفرًا نكفّر بها من غير استحلال."]], "tr": [[2131.0, "İmam İshâk şöyle de demiştir:"], [2134.0, "\"Müslümanlar şunda icmâ etmiştir: Allah'a söven, ya da Resûlü ﷺ'e söven, ya da Allah Azze ve Celle'nin indirdiği bir şeyi reddeden, ya da Allah'ın peygamberlerinden birini öldüren kimse, Allah'ın indirdiği her şeyi kabul ediyor olsa bile bununla kâfir olur.\" İstihlâl şart koşulmaz, istihlâl şart koşulmaz;"], [2150.0, "günahın sureti küfür olunca, istihlâl olmaksızın onunla tekfir ederiz."]]}, {"reader": false, "ar": [[2156.0, "وقال الإمام ابن تيمية رحمه الله تعالى:"], [2161.0, "«إنّ من سبّ اللهَ أو سبّ رسولَه كفر ظاهرًا وباطنًا، وسواءٌ كان السابُّ يعتقد أنّ ذلك محرَّم، أو كان مستحلًّا له، أو كان ذاهلًا عن اعتقاده. هذا مذهبُ الفقهاء وسائرِ أهل السنة القائلين بأنّ الإيمان قولٌ وعمل»."], [2183.0, "انتهى كلامه رحمه الله."]], "tr": [[2156.0, "İmam İbn Teymiyye rahimehullahu teâlâ şöyle demiştir:"], [2157.4, "\"Allah'a ya da Resûlü'ne söven, zâhiren ve bâtınen kâfir olur;"], [2161.0, "söven kişi bunun haram olduğuna inansın, ya da onu helal saysın, ya da inancından gâfil olsun, fark etmez."], [2172.9, "Bu, fakihlerin ve imanın söz ve amel olduğunu söyleyen diğer bütün Ehl-i Sünnet'in mezhebidir.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2185.0, "وقال الإمام أبو ثورٍ رحمه الله تعالى:"], [2189.0, "«اعلم ـ يرحمنا الله وإيّاك ـ أنّ الإيمان تصديقٌ بالقلب، وقولٌ باللسان، وعملٌ بالجوارح. وذلك أنّه ليس بين أهل العلم خلافٌ في رجلٍ لو قال: أشهد أنّ الله عز وجل واحد، وأنّ ما جاءت به الرسلُ حقّ، وأقرّ بجميع الشرائع» ـ إذن الإقرار عنده جميل ـ «ثم قال: ما عقد قلبي على شيءٍ من هذا، ولا أُصدّق به، أنّه ليس بمسلم. ولو قال: المسيحُ هو الله، وجحد أمرَ الإسلام، وقال: إنّني لا أعتقد بما ينطق به لساني، أنّه كافرٌ إذا أظهر ذلك»."]], "tr": [[2185.0, "İmam Ebû Sevr rahimehullahu teâlâ şöyle demiştir:"], [2189.0, "\"Bil ki —Allah bize ve sana rahmet etsin— iman, kalple tasdik, dille söz ve azalarla ameldir."], [2197.1, "Bu şundandır: İlim ehli arasında, 'Şehadet ederim ki Allah Azze ve Celle birdir ve resullerin getirdiği haktır' diyen ve bütün şeriatleri kabul eden\" —demek ki ikrarı güzel— \"sonra da 'Kalbim bunlardan hiçbirine bağlanmadı ve onu tasdik etmiyorum' diyen bir adamın Müslüman olmadığı hususunda ihtilaf yoktur."], [2219.0, "Eğer 'Mesih Allah'tır' der, İslam'ın emrini inkâr eder ve 'Dilimin söylediğine inanmıyorum' derse, bunu açığa vurduğunda kâfir olduğu hususunda da (ihtilaf yoktur).\""]]}, {"reader": false, "ar": [[2233.0, "وقال رحمه الله تعالى:"], [2236.2, "«وبالجملة فمن قال أو فعل ما هو كفرٌ كفر بذلك، وإن لم يقصد أن يكون كافرًا؛ إذ لا يكاد يقصد الكفرَ أحدٌ إلا ما شاء الله تعالى»."], [2250.0, "وقال ابن تيمية رحمه الله أيضًا:"], [2252.0, "«فتكذيبُ الرسول كفر، وبغضُه وسبُّه وعداوتُه مع العلم بصدقه في الباطن كفرٌ عند الصحابة والتابعين لهم بإحسان، وأئمّة العلم، وسائر الطوائف، إلا الجهمَ ومن وافقه كالصالحيّ والأشعريّ وغيرهم؛ فإنّهم قالوا: هذا كفرٌ في الظاهر، وأمّا في الباطن فلا يكون كفرًا»."], [2277.0, "انتهى كلامه رحمه الله تعالى."], [2279.0, "وبه يتمّ الكلام على هذه القاعدة."]], "tr": [[2233.0, "Rahimehullahu teâlâ şöyle de demiştir:"], [2236.2, "\"Özetle, küfür olan bir şeyi söyleyen ya da yapan, kâfir olmayı kastetmese bile bununla kâfir olur;"], [2245.5, "çünkü Allah'ın dilediği müstesna, neredeyse hiç kimse küfrü kastetmez.\" İbn Teymiyye rahimehullah şöyle de demiştir:"], [2252.0, "\"Resûlü yalanlamak küfürdür; bâtında doğruluğunu bilmekle birlikte ona buğzetmek, sövmek ve düşmanlık etmek de sahâbeye, onlara güzellikle tâbi olan tâbiûna, ilim imamlarına ve diğer bütün fırkalara göre küfürdür;"], [2270.0, "ancak Cehm ve ona uyanlar, Sâlihî, Eş'arî ve diğerleri gibi, müstesnadır."], [2277.0, "Onlar 'Bu zâhirde küfürdür; bâtında ise küfür olmaz' demişlerdir.\" Sözü bitti, Allah ona rahmet etsin."], [2279.0, "Bununla bu kaide hakkındaki söz tamamlanır."]]}]}, {"ts": "38:02", "title": "7. Külliye: Sureti zâtı itibarıyla küfür olan şeyde istihlâli şart koşan Mürcie'dendir", "paras": [{"reader": false, "ar": [[2282.0, "القاعدة التي بعدها: <b>كلُّ من اشترط الاستحلالَ فيما صورتُه كفرٌ ذاتيٌّ فمن المرجئة.<\/b> كلُّ من اشترط الاستحلالَ فيما كفرُه،"], [2294.1, "أو فيما صورةُ كفره ذاتيٌّ، فمن المرجئة. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2282.0, "Ondan sonraki kaide: 7. külliye:"], [2284.6, "Sureti zâtı itibarıyla küfür olan şeyde istihlâli şart koşan herkes Mürcie'dendir. Küfrü —ya da küfrünün sureti— zâtî olan şeyde istihlâli şart koşan herkes Mürcie'dendir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2307.0, "وهذا ممّا أجمعت عليه المرجئةُ وصرّحت به."], [2319.0, "يقول ذلك البغداديّ ـ وهو منهم ـ:"], [2324.0, "«السجود للشمس» ـ اسمعوا يا إخوان الكلامَ العظيم،"], [2328.0, "أعوذ بالله ـ «السجود للشمس أو للصنم، وما جرى مجرى ذلك من علامات الكفر، وإن لم يكن في نفسه كفرًا إذا لم يُضامَّه عقدُ القلب على الكفر، ومن فعل شيئًا من ذلك أجرينا عليه حكمَ أهل الكفر، وإن لم نعلم كفرَه باطنًا. وأمّا تارك الصلاة فإن تركها عن استحلالٍ فهو كافر، لكن إذا تركها ـ يعني إذا تركها ـ تهاونًا وكسلًا، التركَ المطلق، فإنّه لا يكفر»."]], "tr": [[2307.0, "Bu, Mürcie'nin icmâ ettiği ve açıkça söylediği şeylerdendir."], [2308.5, "Bunu, onlardan olan Bağdâdî söylüyor:"], [2310.0, "\"Güneşe secde\" —ey kardeşler, bu büyük sözü dinleyin!"], [2319.0, "Allah'a sığınırım— \"Güneşe ya da puta secde ve bu türden şeyler küfrün alametlerindendir;"], [2320.6, "kalbin küfre bağlanması ona eşlik etmedikçe kendi başına küfür değildir."], [2324.0, "Bunlardan birini yapana kâfirlerin hükmünü uygularız, bâtında küfrünü bilmesek bile."], [2338.0, "Namazı terk edene gelince: Onu istihlâl ederek terk ederse kâfirdir;"], [2351.8, "fakat onu —yani onu— gevşeklik ve tembellikten, mutlak terk ile terk ederse kâfir olmaz.\""]]}, {"reader": false, "ar": [[2368.0, "قال الشهرستانيّ ـ وهو منهم أيضًا ـ:"], [2373.0, "«وإلى هذا المذهب مال ابنُ الراونديّ وبِشرٌ المرّيسيّ، قال: الإيمان هو التصديق بالقلب واللسان جميعًا، والكفر هو الجحود والإنكار، والسجود للشمس وللقمر والصنم ليس بكفرٍ في نفسه، ولكنّه علامةُ الكفر»."], [2391.0, "انتهى كلامه رحمه الله."], [2392.0, "فالمرجئة يقولون: إنّ السجود للصنم ليس بكفر،"], [2398.0, "لكنّه دليلٌ على الكفر."]], "tr": [[2368.0, "Onlardan olan Şehristânî de şöyle der:"], [2370.3, "\"İbnü'r-Râvendî ve Bişr el-Merîsî bu mezhebe meyletmiştir."], [2373.0, "Dedi ki: İman, kalp ve dille birlikte tasdiktir;"], [2378.0, "küfür ise inkâr ve reddir."], [2381.4, "Güneşe, aya ve puta secde kendi başına küfür değildir, ama küfrün alametidir.\" Sözü bitti."], [2391.0, "Mürcie, puta secdenin küfür olmadığını, fakat küfrün delili olduğunu söyler."]]}, {"reader": false, "ar": [[2400.0, "والصواب عند أهل السنة والجماعة أنّ السجود للصنم كفرٌ إذا كان قاصدًا للسجود له."], [2407.0, "وقولي «قاصدًا» يُخرج النائم،"], [2411.0, "أو يُخرج من سجد لله ووافق أنّ أمامه صنم،"], [2416.0, "فهو لا يقصد السجود له فقط."], [2418.0, "لكن من قصد السجود للصنم فإنّه كافر،"], [2423.0, "وإن قال: إنّني في داخلي أُحرّم السجود للصنم."], [2430.0, "فهمتم هذا يا جماعة؟"]], "tr": [[2400.0, "Ehl-i Sünnet ve'l-Cemaat'e göre doğru olan şudur:"], [2403.0, "Puta secde, kişi ona secde etmeyi kastediyorsa küfürdür."], [2407.0, "\"Kastediyorsa\" sözüm uyuyanı dışarıda bırakır;"], [2409.6, "ya da Allah'a secde edip de tesadüfen önünde bir put bulunan kimseyi dışarıda bırakır;"], [2416.3, "o sadece ona secde etmeyi kastetmemiştir."], [2418.0, "Fakat puta secde etmeyi kasteden kimse, \"Ben içimde puta secde etmeyi haram sayıyorum\" dese bile kâfirdir. Bunu anladınız mı, cemaat?"]]}]}, {"ts": "40:30", "title": "8. Külliye: Küfürden aşağı olan bir masiyetle ancak istihlâl ile tekfir ederiz", "paras": [{"reader": false, "ar": [[2432.7, "ومن الكلّيّات أيضًا: <b>كلُّ معصيةٍ دون الكفر فلا نكفّر بها إلا بالاستحلال.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرةً ثالثة:"], [2444.1, "<b>كلُّ معصيةٍ دون الكفر فلا نكفّر بها إلا بالاستحلال.<\/b>"]], "tr": [[2432.7, "Külliyelerden biri de şudur: 8."], [2434.6, "külliye: Küfürden aşağı olan her masiyetle ancak istihlâl ile tekfir ederiz. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [2444.1, "<b>Küfürden aşağı olan her masiyetle ancak istihlâl ile tekfir ederiz.<\/b>"]]}, {"reader": false, "ar": [[2468.0, "أقول وبالله التوفيق: وقد عقد الإمام البخاريّ رحمه الله تعالى في صحيحه بابًا قال فيه ـ أو عفوًا:"], [2477.2, "قطع فيه ـ بأنّ المعاصي لا يكفر مرتكبُها،"], [2481.0, "فقال: «المعاصي من أمر الجاهليّة، ولا يكفر صاحبُها بارتكابها»؛"], [2486.0, "وذلك لقول النبيّ صلى الله عليه وسلم لأبي ذرّ:"], [2491.5, "«إنّك امرؤٌ فيك جاهليّة»،"], [2494.0, "ولقول الله عز وجل:"], [2495.4, "<span class=\"ayah\">﴿إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ﴾<\/span> <span class=\"ref\">[النساء: ٤٨]<\/span>."]], "tr": [[2468.0, "Tevfik Allah'tandır, derim ki: İmam Buhârî rahimehullahu teâlâ Sahîh'inde bir bab açmış ve orada —ya da, affedersiniz:"], [2477.2, "orada kesin olarak belirtmiştir ki— masiyetleri işleyen kâfir olmaz."], [2481.6, "Şöyle demiştir: \"Masiyetler cahiliye işlerindendir;"], [2486.0, "sahibi onları işlemekle kâfir olmaz.\" Bu, Nebî ﷺ'in Ebû Zer'e \"Sen kendisinde cahiliye (huyu) bulunan bir adamsın\" demesinden ve Allah Azze ve Celle'nin şu sözünden dolayıdır:"], [2495.4, "<span class=\"ayah\">﴿Şüphesiz Allah kendisine ortak koşulmasını bağışlamaz; bundan aşağısını ise dilediği kimse için bağışlar﴾<\/span> [Nisâ 48]."]]}, {"reader": false, "ar": [[2500.0, "قال أبو الحسن الأشعريّ رحمه الله تعالى:"], [2504.0, "«وندين بألّا نكفّر أحدًا من أهل القبلة بذنبٍ يرتكبه، كالزنا والسرقة وشرب الخمر، كما دانت بذلك الخوارج، وزعمت أنّهم كافرون»."], [2517.0, "انتهى كلامه رحمه الله."], [2519.0, "وبيانُه: أنّ أهل السنة والجماعة لا يعتقدون أنّ ما دون الكفر من الذنوب والمعاصي كفرٌ في ذاته،"], [2526.9, "فلا بدّ من ضميمة شيءٍ آخر حتى يكون كفرًا، وهو استحلالُ القلب."]], "tr": [[2500.0, "Ebu'l-Hasen el-Eş'arî rahimehullahu teâlâ şöyle demiştir:"], [2504.0, "\"Kıble ehlinden hiç kimseyi, zina, hırsızlık ve içki içmek gibi işlediği bir günah sebebiyle tekfir etmemeyi din ediniriz;"], [2511.4, "Hâricîlerin bunu din edinip onların kâfir olduğunu iddia ettiği gibi değil.\" Sözü bitti, Allah ona rahmet etsin."], [2519.0, "Bunun açıklaması şudur: Ehl-i Sünnet ve'l-Cemaat, günahlardan ve masiyetlerden küfürden aşağı olanın kendi zâtında küfür olduğuna inanmaz."], [2526.5, "Küfür olması için mutlaka başka bir şeyin eklenmesi gerekir; o da kalbin istihlâlidir."]]}, {"reader": false, "ar": [[2533.0, "وقال الإمام أبو بكرٍ الإسماعيليّ رحمه الله تعالى في «اعتقاد أهل الحديث» وأهل السنة والجماعة،"], [2540.0, "قال: «ويقولون: إنّ أحدًا من أهل التوحيد، ومن يصلّي إلى قبلة المسلمين، لو ارتكب ذنبًا أو ذنوبًا كثيرةً، صغائرَ أو كبائر، مع الإقامة على التوحيد لله، والإقرار بما التزمه وقبِله عن الله، فإنّه لا يكفر بذلك»."], [2558.0, "انتهى كلامه. وقال الإمام ابن بطّة العُكبَريّ رحمه الله تعالى في «الإبانة»:"], [2565.0, "«وقد أجمعت العلماء ـ لا خلاف بينهم ـ أنّه لا يكفر أحدٌ من أهل القبلة بذنب، ولا نُخرجه من الإسلام بمعصية، نرجو للمحسن ونخاف على المسيء». انتهى كلامه."]], "tr": [[2533.0, "İmam Ebû Bekir el-İsmâîlî rahimehullahu teâlâ, \"İ'tikâdu Ehli'l-Hadîs\" (ve Ehl-i Sünnet ve'l-Cemaat'in itikadı) adlı eserinde şöyle demiştir:"], [2540.5, "\"Derler ki: Tevhid ehlinden ve Müslümanların kıblesine doğru namaz kılanlardan biri, Allah'ı birlemeye devam etmek ve Allah'tan iltizam ettiği ve kabul ettiği şeyi ikrar etmekle birlikte, küçük ya da büyük, bir günah ya da birçok günah işlese, bununla kâfir olmaz.\" Sözü bitti."], [2559.0, "İmam İbn Batta el-Ukberî rahimehullahu teâlâ da \"el-İbâne\"de şöyle demiştir:"], [2565.0, "\"Âlimler —aralarında ihtilaf olmaksızın— kıble ehlinden hiç kimsenin bir günah sebebiyle kâfir olmayacağında icmâ etmiştir."], [2570.2, "Onu bir masiyet sebebiyle İslam'dan çıkarmayız."], [2572.8, "İyilik yapan için (rahmet) umar, kötülük yapan için korkarız.\" Sözü bitti."]]}, {"reader": false, "ar": [[2578.0, "وقال الإمام الصابونيّ في «اعتقاد أئمّة السلف وأهل الحديث»،"], [2582.0, "قال: «ويعتقد أهل السنة أنّ المؤمن وإن أذنب ذنوبًا كثيرةً، صغائرَ كانت أو كبائر، فإنّه لا يكفر بها، وإن خرج من الدنيا غيرَ تائبٍ منها ومات على التوحيد والإخلاص، فإنّ أمرَه إلى الله عز وجل: إن شاء عفا عنه وأدخله الجنّة يوم القيامة سالمًا غانمًا، غيرَ مبتلًى بالنار، ولا معاقَبٍ على ما ارتكبه من الذنوب واكتسبه، ثم مات عليه. وإن شاء عاقبه وعذّبه مدّةً بعذاب النار، وإذا عذّبه لم يُخلّده فيها، بل أعتقه وأخرجه منها إلى نعيم دار القرار»."], [2621.0, "انتهى كلامه رحمه الله. كلامٌ واضح."]], "tr": [[2578.0, "İmam Sâbûnî \"İ'tikâdu Eimmeti's-Selef ve Ehli'l-Hadîs\" adlı eserinde şöyle demiştir:"], [2582.5, "\"Ehl-i Sünnet şuna inanır: Mümin, küçük ya da büyük, birçok günah işlese bile onlarla kâfir olmaz."], [2592.4, "Onlardan tövbe etmeden dünyadan çıksa ve tevhid ve ihlas üzere ölse, onun işi Allah Azze ve Celle'ye kalmıştır:"], [2603.3, "Dilerse onu affeder ve kıyamet günü onu cennete salim ve kazançlı olarak, ateşle imtihan edilmeksizin, işlediği ve kazandığı, sonra da üzerinde öldüğü günahlardan dolayı cezalandırılmaksızın sokar."], [2621.0, "Dilerse onu cezalandırır ve bir müddet ateş azabıyla azap eder;"], [2621.5, "azap ettiğinde de onu orada ebedî bırakmaz;"], [2622.0, "bilakis onu azat eder ve oradan çıkarıp karar yurdunun nimetlerine götürür.\" Sözü bitti, Allah ona rahmet etsin. Açık bir söz."]]}, {"reader": false, "ar": [[2623.0, "وقال البغويّ رحمه الله تعالى في «شرح السنة»:"], [2628.0, "«اتّفق أهل السنة على أنّ المؤمن لا يخرج عن الإيمان بارتكاب شيءٍ من الكبائر إذا لم يعتقد إباحتَها، وإذا عمل شيئًا منها فمات قبل التوبة لا يُخلَّد في النار، كما جاء به الحديث، بل هو إلى الله: إن شاء عفا عنه، وإن شاء عاقبه بقدر ذنوبه، ثم أدخله الجنّة برحمته». انتهى كلامه."]], "tr": [[2623.0, "Beğavî rahimehullahu teâlâ \"Şerhu's-Sünne\"de şöyle demiştir:"], [2625.5, "\"Ehl-i Sünnet şunda ittifak etmiştir:"], [2628.0, "Mümin, büyük günahlardan birini işlemekle —onun mubah olduğuna inanmadıkça— imandan çıkmaz."], [2633.6, "Onlardan birini işleyip tövbe etmeden ölürse, hadiste geldiği gibi ateşte ebedî kalmaz;"], [2642.5, "bilakis o Allah'a kalmıştır: Dilerse onu affeder, dilerse günahları kadar cezalandırır, sonra rahmetiyle onu cennete sokar.\" Sözü bitti."]]}, {"reader": false, "ar": [[2652.0, "ويؤكّد ذلك أبو العباس ابن تيمية رحمه الله تعالى،"], [2656.2, "كما في «العقيدة الواسطيّة»،"], [2658.0, "فقال: «إنّ الدين والإيمان قولٌ وعمل: قولُ القلب واللسان، وعملُ القلب واللسان والجوارح، وأنّ الإيمان يزيد بالطاعة وينقص بالمعصية. وهم مع ذلك لا يكفّرون أهلَ القبلة بمطلق المعاصي والكبائر، كما يفعله الخوارج». انتهى كلامه."]], "tr": [[2652.0, "Ebu'l-Abbâs İbn Teymiyye rahimehullahu teâlâ da \"el-Akîdetü'l-Vâsitıyye\"de olduğu gibi bunu teyit ederek şöyle demiştir:"], [2656.2, "\"Din ve iman söz ve ameldir:"], [2658.5, "Kalbin ve dilin sözü; kalbin, dilin ve azaların amelidir."], [2662.6, "İman taatle artar, masiyetle eksilir."], [2665.5, "Bununla birlikte onlar, Hâricîlerin yaptığı gibi kıble ehlini mutlak masiyetler ve büyük günahlar sebebiyle tekfir etmezler.\" Sözü bitti."]]}, {"reader": false, "ar": [[2678.0, "فالذنوب ـ أيّها الأحبّة ـ سواءٌ أكانت صغائرَ أو كبائر،"], [2682.0, "لا يكفر فاعلُها إلا إذا استحلّها،"], [2685.0, "وكانت ممّا أجمع العلماء على تحريمه،"], [2689.0, "وظهر حكمُه بين المسلمين."], [2692.0, "وبناءً على ذلك: فلا يجوز أن نكفّر بمجرّد الوقوع في الزنا،"], [2697.0, "ولا الوقوع في شرب الخمر،"], [2698.0, "ولا الوقوع في السرقة،"], [2700.0, "ولا في الوقوع في الكذب،"], [2701.0, "ولا في إسبال الثياب،"], [2703.0, "ولا في عقوق الوالدين،"], [2706.0, "ولا في شهادة الزور،"], [2707.0, "ولا غيرها من الكبائر، والله أعلم."]], "tr": [[2678.0, "Ey sevgili kardeşler! Günahlar, ister küçük ister büyük olsun, onları işleyen kâfir olmaz;"], [2683.0, "ancak onları helal sayarsa ve bu, âlimlerin haramlığında icmâ ettiği ve hükmü Müslümanlar arasında açıkça bilinen bir şey olursa (kâfir olur)."], [2693.4, "Buna göre: Sırf zinaya düşmekle, içki içmeye düşmekle, hırsızlığa düşmekle, yalana düşmekle, elbiseyi sarkıtmakla (isbâl), anne babaya isyanla, yalancı şahitlikle ya da diğer büyük günahlarla tekfir etmemiz caiz değildir. Allah en iyisini bilir."]]}]}, {"ts": "45:10", "title": "9. Külliye: Mutlak günahlar sebebiyle istihlâl olmaksızın tekfir eden Va'îdiyye'dendir", "paras": [{"reader": false, "ar": [[2710.0, "ويؤكّد ذلك القاعدةُ الكلّيّةُ التي بعدها،"], [2713.0, "ورقمُها كم؟ نعم، الكلّيّة التاسعة:"], [2716.0, "<b>كلُّ من كفّر بمطلق الذنوب بلا استحلالٍ فهو من الوعيديّة.<\/b> كما قلناه في المرجئة، أليس كذلك؟ <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2710.0, "Bunu, ondan sonraki külliye kaide teyit eder."], [2713.0, "Numarası kaç? Evet, 9. külliye:"], [2716.0, "Mutlak günahlar sebebiyle istihlâl olmaksızın tekfir eden herkes Va'îdiyye'dendir. Mürcie hakkında söylediğimiz gibi, öyle değil mi? (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2741.0, "أقول وبالله التوفيق: ونقصد بالوعيديّة:"], [2744.6, "أي الخوارج والمعتزلة. فالخوارج يكفّرون المسلمين بالذنوب،"], [2752.0, "فيرون أنّ من ارتكب كبيرةً من الكبائر فقد كفر بذلك وخرج من الإسلام،"], [2757.0, "وهو في الآخرة خالدٌ مخلَّدٌ في النار أبدًا،"], [2760.6, "لا يقبل الله عز وجل منه لا صرفًا ولا عدلًا."], [2765.0, "والعجيب أنّ من الخوارج من لا يوقف هذا الحكم على مجرّد الكبائر فقط،"], [2771.0, "بل يُدخل معها، بل يُدخل معها الصغائر، والعياذ بالله."]], "tr": [[2741.0, "Tevfik Allah'tandır, derim ki: Va'îdiyye ile Hâricîleri ve Mu'tezile'yi kastediyoruz."], [2749.0, "Hâricîler Müslümanları günahlar sebebiyle tekfir ederler;"], [2752.4, "büyük günahlardan birini işleyenin bununla kâfir olduğunu ve İslam'dan çıktığını, âhirette de ateşte ebedî olarak kalacağını, Allah Azze ve Celle'nin ondan ne farz ne nafile hiçbir şey kabul etmeyeceğini düşünürler."], [2765.0, "İşin şaşılacak yanı, Hâricîlerden bazıları bu hükmü sadece büyük günahlarla sınırlı tutmaz;"], [2770.5, "bilakis onlara, bilakis onlara küçük günahları da katar. Allah'a sığınırız."]]}, {"reader": false, "ar": [[2777.0, "قال ابن تيمية رحمه الله تعالى عن الوعيديّة،"], [2782.1, "قال: «إنّهم يكفّرون بالذنوب والسيّئات، ويترتّب على تكفيرهم بالذنوب استحلالُ دماء المسلمين وأموالهم، وأنّ دار الإسلام دارُ حرب. وكذلك يقول جمهور الرافضة، وجمهور المعتزلة، والجهميّة، وطائفةٌ من غُلاة المنتسبة إلى أهل الحديث والفقه ومتكلّميهم»."], [2806.0, "انتهى كلامه رحمه الله."]], "tr": [[2777.0, "İbn Teymiyye rahimehullahu teâlâ Va'îdiyye hakkında şöyle demiştir:"], [2779.6, "\"Onlar günahlar ve kötülükler sebebiyle tekfir ederler."], [2782.7, "Günahlar sebebiyle tekfir etmelerinin üzerine Müslümanların kanlarını ve mallarını helal saymak ve İslam diyarının harp diyarı olduğu (görüşü) terettüp eder."], [2792.3, "Râfıza'nın çoğunluğu, Mu'tezile'nin çoğunluğu, Cehmiyye ve hadis ile fıkıh ehline ve onların kelamcılarına nispet edilenlerin aşırılarından bir grup da böyle der.\" Sözü bitti, Allah ona rahmet etsin."]]}]}, {"ts": "46:48", "title": "10. Külliye: Dinden zaruri olarak haramlığı bilinen bir haramın helal olduğuna inanan kâfirdir", "paras": [{"reader": false, "ar": [[2808.0, "ومن الكلّيّات أيضًا: <b>كلُّ من اعتقد حِلَّ محرَّمٍ معلومٍ حرمتُه من الدين بالضرورة فهو كافر.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرةً ثالثة:"], [2845.0, "<b>كلُّ من اعتقد حِلَّ محرَّمٍ معلومٍ حرمتُه من الدين بالضرورة فهو كافر.<\/b>"]], "tr": [[2808.0, "Külliyelerden biri de şudur: 10."], [2810.0, "külliye: Haramlığı dinden zaruri olarak bilinen bir haramın helal olduğuna inanan herkes kâfirdir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [2845.0, "<b>Haramlığı dinden zaruri olarak bilinen bir haramın helal olduğuna inanan herkes kâfirdir.<\/b>"]]}, {"reader": false, "ar": [[2850.0, "أقول وبالله التوفيق: لقد ذكرتُ في الكلّيّة التي سبقت بأنّنا لا نكفّر بمجرّد الكبائر ولا بالصغائر،"], [2870.0, "ولا بمطلق الذنوب دون الشرك والكفر،"], [2874.0, "إلا إذا استحلّها صاحبُها،"], [2876.0, "أليس كذلك؟ فمتى يكون اعتقادُ حِلِّ الذنب كفرًا؟"]], "tr": [[2850.0, "Tevfik Allah'tandır, derim ki: Önceki külliyede, sırf büyük günahlar, küçük günahlar ya da şirk ve küfürden aşağı olan mutlak günahlar sebebiyle —sahibi onları helal saymadıkça— tekfir etmediğimizi söylemiştim, öyle değil mi?"], [2877.0, "Peki, günahın helal olduğuna inanmak ne zaman küfür olur?"]]}, {"reader": false, "ar": [[2888.0, "الجواب: إذا استحلّ الإنسانُ شيئًا من الذنوب فلا يكون استحلالُه كفرًا إلا بشرطين:"], [2898.0, "الشرط الأول: أن يكون استحلالُه استحلالًا قلبيًّا،"], [2902.2, "لا استحلالًا عمليًّا. وهذا يبيّن لنا أنّ الاستحلال ينقسم إلى قسمين:"], [2911.0, "إلى استحلالٍ قلبيٍّ باطنيٍّ اعتقاديّ،"], [2915.0, "وإلى استحلالٍ ظاهريٍّ عمليّ."], [2919.0, "فمجرّدُ الاستحلال العمليّ ـ أي:"], [2924.8, "طولُ مزاولة الوقوع في الذنب ـ هذا لا يوجب أن نكفّر صاحبَه به؛"], [2933.0, "لأنّ الاستحلال الذي هو شرطٌ في تكفير صاحب الكبيرة عند أهل السنة والجماعة إنّما هو الاستحلال القلبيّ الباطنيّ الاعتقاديّ."]], "tr": [[2888.0, "Cevap: İnsan günahlardan birini helal sayarsa, bu istihlâli ancak iki şartla küfür olur."], [2898.0, "Birinci şart: İstihlâlinin amelî bir istihlâl değil, kalbî bir istihlâl olmasıdır."], [2904.0, "Bu da bize istihlâlin iki kısma ayrıldığını gösterir:"], [2911.0, "Kalbî, bâtınî, itikadî istihlâl ve zâhirî, amelî istihlâl."], [2919.0, "Sırf amelî istihlâl —yani günaha düşmeyi uzun süre sürdürmek— sahibini bununla tekfir etmemizi gerektirmez."], [2933.0, "Çünkü Ehl-i Sünnet ve'l-Cemaat'e göre büyük günah sahibinin tekfirinde şart olan istihlâl, ancak kalbî, bâtınî, itikadî istihlâldir."]]}, {"reader": false, "ar": [[2943.0, "فلو تصوّرنا أنّ رجلًا شرب الخمرَ سبعين سنة،"], [2948.5, "ولكن يعتقد أنّها حرام،"], [2953.0, "فهل عنده استحلال؟ الجواب:"], [2955.7, "نعم، عنده استحلال، ولكنّه الاستحلال العمليّ،"], [2959.7, "وهو الإصرار على مزاولتها."], [2964.0, "ولو فرضنا أنّ رجلًا لم يشرب قطرةً من خمر،"], [2970.0, "ولكنّه كان يعتقد بقلبه أنّها حلال،"], [2975.0, "فإنّه كافر، مع أنّه لم يشرب منها شيئًا."], [2979.0, "فالاستحلال الذي هو شرطٌ في التكفير إنّما هو الاستحلال القلبيّ الاعتقاديّ الباطنيّ،"], [2987.0, "وليس مجرّدَ الاستحلال العمليّ الظاهريّ، فانتبهوا لذلك."]], "tr": [[2943.0, "Bir adamın yetmiş yıl içki içtiğini, ama onun haram olduğuna inandığını düşünelim."], [2949.8, "Onda istihlâl var mıdır? Cevap:"], [2955.0, "Evet, onda istihlâl vardır; ama bu amelî istihlâldir, yani onu sürdürmekte ısrar etmektir."], [2964.0, "Bir adamın da bir damla içki içmediğini, ama kalbiyle onun helal olduğuna inandığını farz edelim;"], [2975.0, "o, içkiden hiçbir şey içmemiş olmasına rağmen kâfirdir."], [2979.0, "O hâlde tekfirde şart olan istihlâl, ancak kalbî, itikadî, bâtınî istihlâldir;"], [2986.3, "sırf amelî, zâhirî istihlâl değildir. Buna dikkat edin."]]}, {"reader": false, "ar": [[2993.0, "ولذلك عرّف أهلُ العلم الاستحلالَ بقولهم:"], [2999.0, "«المستحلُّ للشيء هو الذي يفعله معتقدًا حِلَّه»،"], [3005.0, "كما قاله الإمام ابن القيّم رحمه الله تعالى."], [3010.0, "ويؤكّد ذلك ابن قدامة رحمه الله في «المغني»،"], [3015.0, "قال: «من اعتقد حِلَّ شيءٍ أُجمِع على تحريمه، وظهر حكمُه بين المسلمين، وزالت الشبهةُ فيه للنصوص الواردة فيه، كلحم الخنزير والزنا وأشباه هذا ممّا لا خلاف فيه، فقد كفر»."], [3034.0, "فهذا هو الاستحلال، وهو الاستحلال القلبيّ الباطنيّ."]], "tr": [[2993.0, "Bu yüzden ehl-i ilim istihlâli şöyle tarif etmiştir:"], [2999.0, "\"Bir şeyi helal sayan (müstahill), onun helal olduğuna inanarak onu yapan kimsedir.\" İmam İbnü'l-Kayyim rahimehullahu teâlâ böyle demiştir."], [3010.0, "İbn Kudâme rahimehullah da \"el-Muğnî\"de bunu teyit ederek şöyle demiştir:"], [3015.7, "\"Haramlığında icmâ edilmiş, hükmü Müslümanlar arasında açıkça bilinen ve hakkında gelen nasslar sebebiyle şüphesi kalkmış bir şeyin —domuz eti, zina ve bunlara benzer, hakkında ihtilaf bulunmayan şeyler gibi— helal olduğuna inanan kâfir olur.\" İşte istihlâl budur;"], [3035.9, "o da kalbî, bâtınî istihlâldir."]]}]}, {"ts": "50:41", "title": "10. Külliye (devam): İkinci şart: haramlığında zaruri icmâ bulunması; ihtilaflı haramlar", "paras": [{"reader": false, "ar": [[3041.0, "فإذا توفّر الشرط الأول ـ وهو الاستحلال القلبيّ ـ فلا يجوز أن نكفّره بمجرّد وجود ذلك،"], [3048.0, "بل لا بدّ أن نضمّ له الشرطَ الثاني،"], [3052.5, "وهو أن يكون هذا الذنب ممّا أجمع العلماء على تحريمه إجماعًا معلومًا من الدين بالضرورة،"], [3061.0, "إجماعًا معلومًا من الدين بالضرورة."], [3065.0, "وهذا قيدٌ يُخرج ذلك الحرامَ الذي اختلف فيه العلماء،"], [3069.2, "كما ستأتينا كلّيّةُ التكفير به إن شاء الله في هذا الدرس أو الدرس القادم إن شاء الله."], [3076.0, "فلا يجوز لنا أن نكفّر من استحلّ محرَّمًا مختلَفًا فيه؛"], [3083.0, "لأنّ وجود الاختلاف في هذا المحرَّم يُعتبر شبهةً تدفع التكفير،"], [3091.0, "إذ قد يكون مقلِّدًا في حِلِّه ذلك العالِمَ الذي قال بأنّه حلال،"], [3097.0, "فلا يجوز أن نكفّره به."]], "tr": [[3041.0, "Birinci şart —yani kalbî istihlâl— bulununca, sırf bunun varlığıyla onu tekfir etmemiz caiz değildir;"], [3047.5, "bilakis ona ikinci şartı da eklememiz gerekir:"], [3050.8, "O da bu günahın, âlimlerin har
