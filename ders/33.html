amlığında dinden zaruri olarak bilinen bir icmâ ile, dinden zaruri olarak bilinen bir icmâ ile icmâ ettiği şeylerden olmasıdır."], [3065.0, "Bu kayıt, âlimlerin hakkında ihtilaf ettiği haramı dışarıda bırakır;"], [3069.7, "Allah'ın izniyle bu derste ya da gelecek derste, Allah'ın izniyle, onunla tekfirin külliyesi gelecek."], [3076.0, "Hakkında ihtilaf edilen bir haramı helal sayanı tekfir etmemiz caiz değildir;"], [3083.0, "çünkü bu haramda ihtilafın bulunması tekfiri defeden bir şüphe sayılır."], [3088.7, "Zira o, bunu helal saymakta, onun helal olduğunu söyleyen âlimi taklit ediyor olabilir."], [3096.0, "Bu sebeple onu bununla tekfir etmemiz caiz değildir."]]}, {"reader": false, "ar": [[3102.0, "فمن اعتقد جوازَ الغناء فلا يكون كافرًا؛"], [3107.1, "لأنّها من المسائل الخلافيّة،"], [3109.8, "وإن كان الراجحُ حرمتَه."], [3113.0, "وإذا اعتقد الإنسانُ حِلَّ صلاته الفريضةَ في البيت،"], [3122.0, "فإنّه لا يُعتبر كافرًا؛"], [3124.1, "إذ أنّ من أهل العلم من قال:"], [3127.8, "إنّ شهود الجماعة من السنن،"], [3130.4, "وليس من الواجبات أو الفرائض."], [3133.0, "ومن قال بجواز كشف وجه المرأة،"], [3137.1, "فإنّنا لا نقول له:"], [3139.8, "قد استحللتَ حرامًا؛ لأنّ هذا من الحرام الذي ثبت خلافُ أهل العلم فيه."], [3151.0, "وهكذا دواليك في سائر المحرَّمات."]], "tr": [[3102.0, "Şarkının (gınâ) caiz olduğuna inanan kâfir olmaz;"], [3107.1, "çünkü o, —racih olan haramlığı olsa da— ihtilaflı meselelerdendir."], [3113.0, "İnsan farz namazını evde kılmasının helal olduğuna inanırsa kâfir sayılmaz;"], [3124.1, "zira ehl-i ilimden bazıları cemaate katılmanın vacip ya da farz değil, sünnet olduğunu söylemiştir."], [3133.0, "Kadının yüzünü açmasının caiz olduğunu söyleyene de \"Bir haramı helal saydın\" demeyiz;"], [3143.0, "çünkü bu, hakkında ehl-i ilmin ihtilafı sabit olan haramlardandır."], [3151.0, "Diğer haramlarda da durum böyle devam eder."]]}, {"reader": false, "ar": [[3155.0, "لكن لو جاءنا رجلٌ وقال:"], [3158.5, "إنّ الزنا حلال، فإنّنا نكفّره."], [3163.0, "أو قال: شربُ الخمر حلال،"], [3166.6, "فإنّنا نكفّره. أو قال:"], [3169.4, "قذفُ المسلم ظلمًا وعدوانًا حلال،"], [3173.0, "فإنّنا نكفّره. أو قال:"], [3176.4, "شهادةُ الزور جائزةٌ لا بأس بها،"], [3180.6, "فإنّنا نكفّره. أو قال:"], [3184.4, "إنّ دم المسلم حلالٌ بلا مسوِّغٍ شرعيّ،"], [3189.2, "فإنّنا نكفّره؛ لأنّه في هذا الاستحلال ـ ها ـ استحلّ محرَّمًا مُجمَعًا على تحريمه،"], [3198.1, "معلومًا من الدين بالضرورة. أفهمتم هذا؟"]], "tr": [[3155.0, "Ama bize bir adam gelip \"Zina helaldir\" derse onu tekfir ederiz."], [3163.0, "Ya da \"İçki içmek helaldir\" derse onu tekfir ederiz."], [3168.0, "Ya da \"Müslümana zulüm ve düşmanlıkla zina iftirası atmak helaldir\" derse onu tekfir ederiz."], [3175.0, "Ya da \"Yalancı şahitlik caizdir, bir sakıncası yoktur\" derse onu tekfir ederiz."], [3183.0, "Ya da \"Müslümanın kanı şer'î bir gerekçe olmaksızın helaldir\" derse onu tekfir ederiz."], [3192.0, "Çünkü o bu istihlâlde —ha!— haramlığında icmâ edilmiş, dinden zaruri olarak bilinen bir haramı helal saymıştır. Bunu anladınız mı?"]]}, {"reader": false, "ar": [[3205.0, "فمتى ما توفّر هذان الشرطان،"], [3208.4, "فكان قد استحلّ المحرَّمَ استحلالًا قلبيًّا عَقَديًّا،"], [3214.0, "وكان هذا المحرَّم من المحرَّمات التي أجمع العلماء على تحريمها،"], [3221.0, "فلا جَرَمَ أنّنا نكفّره حينئذٍ بهذا الاستحلال."], [3227.0, "ولذلك قال الإمام ابن تيمية رحمه الله تعالى:"], [3231.0, "«إنّ الإيمان بوجوب الواجبات الظاهرة المتواترة، وتحريمِ المحرَّمات الظاهرة المتواترة، هو من أعظم أصول الإيمان وقواعد الدين، والجاحدُ لها كافرٌ بالاتفاق»."], [3246.0, "اشترط ماذا؟ ها؟ الظاهرة المتواترة."]], "tr": [[3205.0, "Bu iki şart ne zaman bulunursa —haramı kalbî, itikadî bir istihlâlle helal saymış ve bu haram da âlimlerin haramlığında icmâ ettiği haramlardan olursa— o zaman şüphesiz onu bu istihlâl sebebiyle tekfir ederiz."], [3227.0, "Bu yüzden İmam İbn Teymiyye rahimehullahu teâlâ şöyle demiştir:"], [3231.0, "\"Zâhir ve mütevâtir vaciplerin vacipliğine ve zâhir ve mütevâtir haramların haramlığına iman, imanın en büyük asıllarından ve dinin kaidelerindendir;"], [3242.3, "onları inkâr eden ittifakla kâfirdir.\" Neyi şart koştu?"], [3246.0, "Ha? Zâhir ve mütevâtir olmayı."]]}, {"reader": false, "ar": [[3251.0, "وقال رحمه الله تعالى:"], [3253.6, "«إنّ من فعل المحارمَ مستحلًّا لها فهو كافرٌ بالاتفاق، وكذلك لو استحلّها بغير فعل»."], [3263.0, "وقال الشاطبيّ رحمه الله:"], [3265.7, "«إنّ تحليل الشيء إذا كان مشهورًا ـ انتبه ـ فحرّمه بغير تأويل، أو التحريم كان مشهورًا فحلّله بغير تأويل، كان كفرًا وعنادًا»."], [3282.0, "بمعنى: أنّ من حرّم حلالًا مُجمَعًا على حِلّيّته فإنّه كافر،"], [3290.0, "ومن اعتقد حِلَّ حرامٍ مُجمَعًا على تحريمه فإنّه كافر،"], [3296.0, "فإنّه كافر. ما أدري،"], [3298.9, "وضحت لكم كلّكم؟ <span class=\"q\">؟ 54:58<\/span> والله أعلى وأعلم."]], "tr": [[3251.0, "Yine rahimehullahu teâlâ şöyle demiştir:"], [3253.6, "\"Haramları helal sayarak işleyen ittifakla kâfirdir;"], [3256.2, "işlemeden helal sayarsa da durum böyledir.\" Şâtıbî rahimehullah da şöyle demiştir:"], [3263.0, "\"Bir şeyin helalliği meşhur iken —dikkat et— onu te'vil olmaksızın haram kılarsa, ya da haramlığı meşhur iken onu te'vil olmaksızın helal kılarsa, bu küfür ve inattır.\" Yani:"], [3282.0, "Helalliğinde icmâ edilmiş bir helali haram kılan kâfirdir;"], [3286.9, "haramlığında icmâ edilmiş bir haramın helal olduğuna inanan da kâfirdir, kâfirdir."], [3294.0, "Bilmiyorum, hepinize açık oldu mu?"], [3298.0, "<span class=\"q\">؟<\/span> Allah en yüce olandır ve en iyisini bilendir."]]}]}, {"ts": "55:02", "title": "Gelecek dersin külliyesi", "paras": [{"reader": false, "ar": [[3302.0, "اكتبوا رأسَ القاعدة عندكم:"], [3304.0, "<b>كلُّ محرَّمٍ ثبت الخلافُ المعتبرُ في تحريمه فلا يُكفَّر باستحلاله.<\/b> <span class=\"note\">(يكررها)<\/span> ونشرحها الدرسَ القادم،"], [3315.7, "والله أعلى وأعلم، وصلى الله وسلم على نبينا محمد."]], "tr": [[3302.0, "Kaidenin başlığını yanınıza yazın: <b>Haramlığında muteber ihtilaf sabit olan her haramı helal sayan tekfir edilmez.<\/b> (Tekrar ediyor.) Onu gelecek derste şerh edeceğiz."], [3304.0, "Allah en yüce olandır ve en iyisini bilendir."], [3314.8, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
