<script>
const D={"no": 43, "vid": "JWle2UCJBsU", "title_ar": "الدرس (٤٣) من شرح كليات العقيدة — من كليات توحيد الألوهية: النفاق", "title_tr": "Şerhu Külliyyâti'l-Akîde — 43. Ders: Ulûhiyyet Tevhidi Külliyeleri (Nifak: Tanımı, Büyük Nifak ve Türleri, Küçük Nifak, Zahire Göre Muamele, Kur'an'da Nifak ve Kalp Hastalığı)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Hayrı açığa vurup şerri gizleyen herkes münafıktır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.1, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.2, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.7, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [10.8, "أمّا بعد: فلا نزال في سياق شرح كلّيّات توحيد الألوهيّة،"], [16.0, "وعندنا في هذا الدرس عشرُ كلّيّات."], [19.0, "الكلّيّة الأولى: <b>كلُّ من أظهر الخيرَ وأبطن الشرَّ فمنافق.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.1, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [11.9, "Bundan sonra: Hâlâ ulûhiyyet tevhidi külliyelerinin şerhi bağlamındayız."], [16.0, "Bu derste elimizde on külliye var."], [19.0, "<b>1. külliye: Hayrı açığa vurup şerri gizleyen herkes münafıktır.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[24.0, "وهذا حقيقةُ النفاق في اللغة العربيّة،"], [40.0, "وهو مخالفةُ الباطن للظاهر،"], [44.0, "مأخوذٌ من نافقاء اليَرْبوع كما قال علماءُ اللغة؛"], [49.0, "وذلك لأنّ اليربوع يدخل من منفذٍ ويخرج من منفذٍ آخر."], [56.0, "وهكذا المنافق؛ لأنه يخرج من الإسلام من غير الوجه الذي دخل فيه،"], [61.0, "وذلك أنه يُبدي للناس علانيةً ما لا يُخفيه سرًّا <span class=\"q\">؟ 01:01<\/span>."], [68.0, "فأصلُ النفاق هو إخفاءُ الشيء وإغماضُه."]], "tr": [[24.0, "Bu, Arap dilinde nifakın hakikatidir;"], [27.1, "o da bâtının zahire aykırı olmasıdır."], [42.9, "Dil âlimlerinin dediği gibi, \"yerbû'un (çöl faresinin) nâfikâ'sından\" alınmıştır."], [49.0, "Çünkü yerbû' bir delikten girer, başka bir delikten çıkar."], [56.0, "Münafık da böyledir; çünkü İslâm'dan, girdiği yönden başka bir yönden çıkar."], [60.2, "Bu da şundandır: İnsanlara açıkça, gizlice saklamadığı (?) şeyi gösterir <span class=\"q\">؟<\/span>."], [68.0, "Nifakın aslı, bir şeyi gizlemek ve örtmektir."]]}, {"reader": false, "ar": [[72.0, "وأمّا النفاقُ في الاصطلاح:"], [76.0, "فهو القولُ أو الفعلُ بخلاف ما في القلب."], [82.0, "فهو القولُ أو الفعلُ بخلاف ما في القلب."], [87.0, "فالمنافقُ هو الذي يستر الشرَّ،"], [90.5, "ولا يُظهر للناس إلا الخير."]], "tr": [[72.0, "Istılahta nifak ise kalpteki şeye aykırı söz ya da fiildir."], [82.0, "Yani kalpteki şeye aykırı söz ya da fiildir."], [87.0, "Münafık, şerri örten ve insanlara hayırdan başka bir şey göstermeyen kimsedir."]]}, {"reader": false, "ar": [[96.0, "ومن العجائب أنّ هذا الاسمَ ـ بهذه الحقيقة الشرعيّة ـ من الأمور التي لم تكن تعرفها الأممُ السابقة؛"], [104.0, "فإنّ الأمم السابقة إنما ينقسم أفرادُها إلى مؤمنين خُلَّص،"], [109.5, "أو إلى كفّارٍ خُلَّص."], [112.0, "وأمّا هذه الأمّة فقد خرج فيها ذلك الاسمُ،"], [116.0, "وهو النفاق. وإن كان علماءُ اللغة يعرفونه،"], [121.0, "إلا أننا نقصد الحقيقةَ الشرعيّة."]], "tr": [[96.0, "İşin şaşılacak yanlarından biri şudur:"], [98.5, "Bu isim —bu şer'î hakikatiyle— önceki ümmetlerin bilmediği şeylerdendir."], [104.0, "Çünkü önceki ümmetlerin fertleri ya halis müminlere ya da halis kâfirlere ayrılırdı."], [112.0, "Bu ümmette ise bu isim, yani nifak ortaya çıktı."], [117.0, "Dil âlimleri onu biliyor olsa da biz şer'î hakikati kastediyoruz."]]}, {"reader": false, "ar": [[126.0, "فإنّ النفاق بمعناه الشرعيّ لم تعرفه العربُ قبل بعثة النبيّ صلى الله عليه وسلم،"], [137.0, "ولم يكن معروفًا هذا الاسمُ في العهد المكّيّ أبدًا،"], [141.0, "ولا في بدايات الهجرة."], [143.0, "وإنما عُرف ذلك الاسمُ بعد غزوة بدر،"], [146.0, "وظهورِ أمر النبيّ صلى الله عليه وسلم وصحابته،"], [151.5, "وظهورِ أمر الدين؛ حينئذٍ ناوأه <span class=\"q\">؟ 02:34<\/span> وكاد له جمعٌ من المنافقين،"], [158.0, "كما سيأتي بيانُه إن شاء الله."]], "tr": [[126.0, "Şer'î manasıyla nifakı Araplar, Peygamber sallallâhu aleyhi ve sellem'in gönderilişinden önce bilmiyorlardı."], [137.0, "Bu isim Mekke döneminde de aslâ bilinmiyordu, hicretin başlarında da."], [143.0, "Bu isim ancak Bedir Gazvesi'nden, Peygamber sallallâhu aleyhi ve sellem'in ve ashâbının işinin ve dinin işinin ortaya çıkıp güçlenmesinden sonra bilindi."], [154.0, "O zaman bir grup münafık ona düşmanlık etti <span class=\"q\">؟<\/span> ve ona tuzak kurdu; inşallah açıklaması gelecek."]]}, {"reader": false, "ar": [[161.0, "فالمنافقُ لا بدّ أن تختلف سريرتُه وعلانيتُه،"], [165.7, "وظاهرُه وباطنُه. والعجيبُ أنّ القرآن أفصح عن هذه الحقيقة،"], [171.5, "وهي مخالفةُ الظاهر للباطن،"], [174.0, "وهي حقيقةٌ لا بدّ من بيانها حتى نميّز بينه وبين الكفر وبين الشرك."], [181.0, "فقال الله عز وجل:"], [183.3, "<span class=\"ayah\">﴿يَحْذَرُ الْمُنَافِقُونَ أَن تُنَزَّلَ عَلَيْهِمْ سُورَةٌ تُنَبِّئُهُم بِمَا فِي قُلُوبِهِمْ﴾<\/span> <span class=\"ref\">[التوبة: ٦٤]<\/span>،"], [189.0, "فدلّ ذلك على أنهم يُخفون ما لا يُظهرون."]], "tr": [[161.0, "Münafığın gizlisi ile açığı, zahiri ile bâtını mutlaka birbirinden farklı olur."], [167.0, "Şaşılacak olan şu ki Kur'an bu hakikati, yani zahirin bâtına aykırılığını açıkça ortaya koymuştur."], [174.5, "Bu, onu (nifakı) küfürden ve şirkten ayırt edebilmemiz için mutlaka açıklanması gereken bir hakikattir."], [181.0, "Allah Azze ve Celle şöyle buyurdu:"], [183.3, "<span class=\"ayah\">﴿Münafıklar, kalplerinde olanı kendilerine haber verecek bir sûrenin, kendileri hakkında indirilmesinden çekinirler﴾<\/span> [Tevbe 64]."], [190.0, "Bu da onların açığa vurmadıklarını gizlediklerini gösterir."]]}, {"reader": false, "ar": [[193.0, "وقال الله عز وجل عن المنافقين:"], [196.0, "<span class=\"ayah\">﴿وَاللَّهُ يَشْهَدُ إِنَّهُمْ لَكَاذِبُونَ﴾<\/span> <span class=\"ref\">[الحشر: ١١]<\/span>،"], [198.0, "والكاذبُ هو الذي يُظهر شيئًا ويُخفي شيئًا."], [201.0, "ويقول الله عز وجل في آيةٍ أخرى:"], [205.0, "<span class=\"ayah\">﴿وَاللَّهُ يَشْهَدُ إِنَّ الْمُنَافِقِينَ لَكَاذِبُونَ﴾<\/span> <span class=\"ref\">[المنافقون: ١]<\/span>."], [208.0, "ويقول الله عز وجل:"], [209.6, "<span class=\"ayah\">﴿وَلَهُمْ عَذَابٌ أَلِيمٌ بِمَا كَانُوا يَكْذِبُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٠]<\/span>."]], "tr": [[193.0, "Allah Azze ve Celle münafıklar hakkında şöyle buyurdu:"], [196.0, "<span class=\"ayah\">﴿Allah şahitlik eder ki onlar kesinlikle yalancıdırlar﴾<\/span> [Haşr 11]."], [198.4, "Yalancı, bir şeyi gösterip başka bir şeyi gizleyendir."], [201.0, "Allah Azze ve Celle başka bir ayette şöyle buyurur:"], [205.0, "<span class=\"ayah\">﴿Allah şahitlik eder ki münafıklar kesinlikle yalancıdırlar﴾<\/span> [Münâfikûn 1]."], [208.0, "Allah Azze ve Celle şöyle buyurur:"], [209.6, "<span class=\"ayah\">﴿Yalan söylemelerinden dolayı onlar için elem verici bir azap vardır﴾<\/span> [Bakara 10]."]]}, {"reader": false, "ar": [[212.0, "فأخصُّ ما يتميّز به المنافقُ عن غيره:"], [217.0, "الاختلافُ بين الظاهر والباطن،"], [219.0, "وبين الدعوى والحقيقة؛ كما قال الله عز وجل:"], [224.0, "<span class=\"ayah\">﴿وَمِنَ النَّاسِ مَن يَقُولُ آمَنَّا بِاللَّهِ وَبِالْيَوْمِ الْآخِرِ﴾<\/span> <span class=\"note\">(Şeyh «واليوم الآخر» diyor)<\/span> أي ظاهرًا،"], [228.0, "<span class=\"ayah\">﴿وَمَا هُم بِمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[البقرة: ٨]<\/span> أي باطنًا."]], "tr": [[212.0, "Münafığı başkasından ayıran en hususî özellik, zahir ile bâtın, iddia ile hakikat arasındaki farklılıktır."], [221.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [224.0, "<span class=\"ayah\">﴿İnsanlardan bazıları \"Allah'a ve ahiret gününe iman ettik\" derler﴾<\/span> —yani zahiren— <span class=\"ayah\">﴿oysa onlar mümin değillerdir﴾<\/span> [Bakara 8] —yani bâtınen."]]}, {"reader": false, "ar": [[231.0, "قال الإمامُ ابنُ جرير رحمه الله تعالى:"], [234.8, "«أجمع جميعُ أهل التأويل على أنّ هذه الآية نزلت في قومٍ من أهل النفاق، وأنّ هذه الصفة صفتُهم»،"], [243.0, "وهي إظهارُ الخير وإبطانُ الشرّ."], [246.0, "وصرّح الله عز وجل بها كذلك في قوله:"], [251.0, "<span class=\"ayah\">﴿يُخَادِعُونَ اللَّهَ وَالَّذِينَ آمَنُوا وَمَا يَخْدَعُونَ إِلَّا أَنفُسَهُمْ وَمَا يَشْعُرُونَ﴾<\/span> <span class=\"ref\">[البقرة: ٩]<\/span>."]], "tr": [[231.0, "İmam İbn Cerîr —Allah ona rahmet etsin— şöyle demiştir:"], [234.8, "\"Bütün te'vil (tefsir) ehli, bu ayetin nifak ehlinden bir topluluk hakkında indiğinde ve bu sıfatın onların sıfatı olduğunda icmâ etmiştir.\" Bu sıfat, hayrı açığa vurup şerri gizlemektir."], [246.0, "Allah Azze ve Celle bunu şu sözünde de açıkça belirtmiştir:"], [251.0, "<span class=\"ayah\">﴿Allah'ı ve iman edenleri aldatmaya çalışırlar; oysa yalnızca kendilerini aldatırlar da farkında olmazlar﴾<\/span> [Bakara 9]."]]}, {"reader": false, "ar": [[258.0, "وقال الإمامُ ابنُ كثير رحمه الله تعالى مبيّنًا هذه الكلّيّة:"], [265.0, "«النفاقُ هو إظهارُ الخير وإسرارُ الشرّ، وهو أنواع: اعتقاديٌّ، وهو الذي يُخلَّد صاحبُه في النار؛ وعمليٌّ، وهو من أكبر الذنوب»."], [276.0, "والخلاصةُ من هذه الكلّيّة هي أنّ حقيقة النفاق دائرةٌ على إخفاء شيءٍ وإظهار شيء. والله أعلم."]], "tr": [[258.0, "İmam İbn Kesîr —Allah ona rahmet etsin— bu külliyeyi açıklayarak şöyle demiştir:"], [265.0, "\"Nifak, hayrı açığa vurup şerri gizlemektir."], [268.3, "Türleri vardır: İtikadî nifak; sahibi ateşte ebedî kalır."], [272.3, "Amelî nifak; günahların en büyüklerindendir.\" Bu külliyenin özeti şudur:"], [276.0, "Nifakın hakikati, bir şeyi gizleyip başka bir şeyi açığa vurmak etrafında döner. Allah en iyisini bilir."]]}]}, {"ts": "04:44", "title": "2. Külliye: Nifakı bâtınen, kulun İslâm'a girdiği aslî hususta olan kimsenin nifakı büyük nifaktır", "paras": [{"reader": false, "ar": [[284.0, "الكلّيّة الثانية: <b>كلُّ من وقع نفاقُه باطنًا في أصل ما يدخل به العبدُ في الإسلام فنفاقٌ أكبر.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثانية:"], [318.0, "<b>كلُّ من وقع نفاقُه باطنًا في أصل ما يدخل به العبدُ في الإسلام فنفاقٌ أكبر.<\/b>"]], "tr": [[284.0, "<b>2. külliye: Nifakı bâtınen, kulun İslâm'a kendisiyle girdiği aslî hususta meydana gelen herkesin nifakı büyük nifaktır.<\/b> (Tekrar ediyor.) İkinci kez tekrar ediyorum:"], [318.5, "<b>Nifakı bâtınen, kulun İslâm'a kendisiyle girdiği aslî hususta meydana gelen herkesin nifakı büyük nifaktır.<\/b>"]]}, {"reader": false, "ar": [[325.0, "أقول وبالله التوفيق: لقد أجمع أهلُ السنة والجماعة رحمهم الله تعالى على أنّ النفاق ينقسم إلى قسمين،"], [334.0, "ولكنهم اختلفوا في هذين القسمين:"], [339.0, "فمنهم من جعله نفاقًا اعتقاديًّا وعمليًّا،"], [343.0, "ومنهم من جعله نفاقًا أكبرَ وأصغر."], [346.0, "وهذا الخلافُ ليس من الخلاف المحقَّق،"], [348.7, "وإنما هو من الخلاف اللفظيّ؛"], [351.0, "فسواءٌ قسمناه إلى نفاقٍ اعتقاديّ ـ ونعني به النفاقَ الأكبر ـ وإلى نفاقٍ عمليّ ـ ونقصد به النفاقَ الأصغر ـ فإنّ ذلك ليس من الخلاف الذي ينبغي الوقوفُ عنده."]], "tr": [[325.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat —Allah onlara rahmet etsin— nifakın iki kısma ayrıldığında icmâ etmiştir;"], [332.3, "ancak bu iki kısım (nasıl adlandırılacağı) konusunda farklı görüşlere sahip olmuşlardır."], [339.0, "Kimisi onu itikadî ve amelî nifak, kimisi de büyük ve küçük nifak diye ayırmıştır."], [346.0, "Bu ihtilaf gerçek (hakiki) bir ihtilaf değil, lafzî bir ihtilaftır."], [351.0, "Onu itikadî nifak —ki bununla büyük nifakı kastediyoruz— ve amelî nifak —ki bununla küçük nifakı kastediyoruz— diye ayırsak da, bu üzerinde durulması gereken bir ihtilaf değildir."]]}, {"reader": false, "ar": [[366.0, "ثمّ اعلم ـ رحمك الله تعالى ـ أنّ واجبات الدين تنقسم إلى قسمين:"], [373.0, "إلى واجباتٍ لا يُحكم على الإنسان بأنه مسلمٌ أصلًا إلا بوجودها،"], [378.0, "وإلى واجباتٍ لا يُحكم عليه بكمال الإيمان الواجب إلا بوجودها."], [385.0, "فإذا وقع النفاقُ في القسم الأوّل ـ أي وقع النفاقُ فيما هو شرطٌ في صحّة الإسلام أصالةً ـ فإنّ هذا هو النفاقُ الأكبر،"], [395.8, "أو النفاقُ الاعتقاديّ، سمِّه ما شئت."], [398.0, "وأمّا إذا وقع النفاقُ في الأمور التي يتعلّق بها كمالُ الإيمان الواجب،"], [405.0, "فإنّ هذا هو النفاقُ الأصغر،"], [407.1, "كما ستأتي كلّيّتُه إن شاء الله تعالى."]], "tr": [[366.0, "Sonra bil —Allah sana rahmet etsin— ki dinin vâcipleri iki kısma ayrılır:"], [373.0, "Bulunmadıkça insanın aslâ Müslüman olduğuna hükmedilmeyen vâcipler ve bulunmadıkça vâcip olan iman kemâline sahip olduğuna hükmedilmeyen vâcipler."], [385.0, "Nifak birinci kısımda meydana gelirse —yani aslen İslâm'ın sıhhatinde şart olan şeyde meydana gelirse— bu büyük nifaktır ya da itikadî nifaktır;"], [398.0, "ona dilediğin adı ver. Nifak, vâcip olan iman kemâlinin bağlı olduğu hususlarda meydana gelirse, bu da küçük nifaktır; inşallah onun külliyesi gelecek."]]}, {"reader": false, "ar": [[410.0, "وبناءً على ذلك: فالذي يكون نفاقُه في أصل الشهادتين ـ فهو ينطق نُطقَ لسانٍ بالشهادتين،"], [418.0, "ولكنّ قلبه مُبطِنٌ للكفر بهما ـ فإنّ هذا نفاقٌ قد وقع في أصل ما يدخل به العبدُ في الإسلام،"], [426.0, "فيكون كافرًا. وكذلك إذا أظهر محبّةَ الله ورسوله صلى الله عليه وسلم،"], [434.0, "ولكنه أبطن في قلبه بُغضَهما؛"], [437.0, "فلا جرمَ أنّ أصلَ أصول ما يدخل به العبدُ في الإسلام محبّةُ الله ورسوله صلى الله عليه وسلم،"], [447.0, "فإذا أبطن بُغضَ الله ورسوله وأظهر محبّتَهما فيكون نفاقُه قد وقع في أمرٍ يتوقّف عليه صحّةُ الإسلام."]], "tr": [[410.0, "Buna binaen: Nifakı iki şehadetin aslında olan kimse —yani dilîyle iki şehadeti söyleyen ama kalbi onları inkârı gizleyen kimse— (bilsin ki) bu, kulun İslâm'a kendisiyle girdiği aslî hususta meydana gelmiş bir nifaktır;"], [428.0, "dolayısıyla o kâfir olur. Aynı şekilde, Allah'ı ve Resûlü sallallâhu aleyhi ve sellem'i sevdiğini gösterip kalbinde O ikisine buğzu gizlerse (durum aynıdır)."], [437.0, "Şüphesiz kulun İslâm'a kendisiyle girdiği şeylerin asıllarının aslı, Allah'ı ve Resûlü sallallâhu aleyhi ve sellem'i sevmektir."], [444.9, "Allah'a ve Resûlü'ne buğzu gizleyip O ikisini sevdiğini gösterirse, nifakı İslâm'ın sıhhatinin kendisine bağlı olduğu bir hususta meydana gelmiş olur."]]}, {"reader": false, "ar": [[457.0, "وإذا أبطن الكفرَ بالملائكة وأظهر الإيمانَ فنفاقُه أكبر."], [463.0, "وإذا أبطن بُغضَ الأنبياء والرسل،"], [466.6, "أو بُغضَ الشريعة والدين،"], [470.0, "أو بُغضَ تطبيق الشريعة وأحكامِ القرآن،"], [474.3, "وأظهر موافقتَها ومحبّتَها؛ فلا جرمَ أنّ نفاقه حينئذٍ وقع في أصل ما يدخل به العبدُ في الإسلام،"], [484.0, "وهو كمالُ الإذعان والتسليم لله عز وجل ولرسوله صلى الله عليه وسلم،"], [490.0, "ومحبّةُ الله، ومحبّةُ رسوله صلى الله عليه وسلم،"], [494.0, "ومحبّةُ شريعته. فمتى ما رأيتَ النفاقَ واقعًا في أصل ما يدخل به العبدُ في الإسلام،"], [500.0, "فاعرفْ مباشرةً أنه من النفاق الأكبر."]], "tr": [[457.0, "Meleklere küfrü gizleyip imanı açığa vurursa nifakı büyüktür."], [463.0, "Peygamberlere ve resullere buğzu, ya da şeriate ve dine buğzu, ya da şeriatin ve Kur'an hükümlerinin uygulanmasına buğzu gizleyip bunlara uyduğunu ve bunları sevdiğini gösterirse, şüphesiz bu durumda nifakı, kulun İslâm'a kendisiyle girdiği aslî hususta meydana gelmiştir."], [486.0, "O da Allah Azze ve Celle'ye ve Resûlü sallallâhu aleyhi ve sellem'e tam bir boyun eğiş ve teslimiyet;"], [495.0, "Allah sevgisi, Resûlü sallallâhu aleyhi ve sellem'in sevgisi ve O'nun şeriatinin sevgisidir."], [497.7, "Nifakın, kulun İslâm'a kendisiyle girdiği aslî hususta meydana geldiğini gördüğün an, onun büyük nifaktan olduğunu doğrudan bil."]]}, {"reader": false, "ar": [[504.0, "وهذا أصلُ النفاق الذي كان على عهد النبيّ صلى الله عليه وسلم؛"], [510.0, "فإنّ قومًا لا يريدون النطقَ بالشهادتين،"], [513.0, "ولا يريدون الدخولَ في حكم الإسلام ولا في حكم الشرع،"], [518.0, "ولكن اضطرّتهم الظروفُ، والخوفُ من النبيّ صلى الله عليه وسلم ومن الفتك بهم أو قتلِهم،"], [527.0, "أن يُظهروا الإسلامَ ويُبطنوا الكفر."]], "tr": [[504.0, "Peygamber sallallâhu aleyhi ve sellem döneminde var olan nifakın aslı da budur."], [510.0, "Bir topluluk iki şehadeti söylemek istemiyor, İslâm'ın hükmüne ve şeriatin hükmüne girmek istemiyordu;"], [516.5, "fakat şartlar, Peygamber sallallâhu aleyhi ve sellem'den korku ve kendilerine saldırılacağı ya da öldürülecekleri korkusu, onları İslâm'ı açığa vurup küfrü gizlemeye mecbur etti."]]}, {"reader": false, "ar": [[532.0, "وقد تتابعت نصوصُ أهل العلم على بيان هذه الحقيقة التي نصّت عليها هذه الكلّيّة."], [540.0, "فهذا ابنُ تيميّة رحمه الله يقول:"], [543.0, "«فمن النفاق ما هو أكبر، ويكون صاحبُه في الدرك الأسفل من النار»،"], [549.0, "ثم قال: «كنفاق عبد الله بن أُبَيّ وغيره؛ بأن يُظهر تكذيبَ الرسول… أو بأن يُبطن تكذيبَ الرسول، أو جحودَ بعض ما جاء به، أو بُغضَه، أو عدمَ اعتقاد وجوب اتّباعه، أو المسرّةَ بانخفاض دينه، أو المساءةَ بظهور دينه» ـ يعني يشعر بالإساءة النفسيّة شعورًا داخليًّا إذا اعتلى أمرُ الدين والشريعة ـ ثم قال:"], [583.0, "«ونحو ذلك ممّا لا يكون صاحبُه إلا عدوًّا لله ورسوله. وهذا القدرُ كان موجودًا في زمن رسول الله صلى الله عليه وسلم، وما زال بعده، بل هو بعده أكثرُ منه على عهده». انتهى كلامه."]], "tr": [[532.0, "Ehl-i ilmin sözleri, bu külliyenin ifade ettiği bu hakikati açıklamada art arda gelmiştir."], [540.0, "İşte İbn Teymiyye —Allah ona rahmet etsin— şöyle der:"], [543.0, "\"Nifakın bir kısmı büyüktür; sahibi ateşin en alt tabakasında olur.\" Sonra şöyle der:"], [547.3, "\"Abdullah b. Übey'in ve başkalarının nifakı gibi:"], [550.0, "Resûl'ü yalanlamayı açığa vurması… ya da Resûl'ü yalanlamayı gizlemesi, ya da onun getirdiklerinin bir kısmını inkâr etmesi, ya da ona buğzetmesi, ya da ona uymanın vâcip olduğuna inanmaması, ya da dininin alçalmasından sevinç duyması, ya da dininin üstün gelmesinden rahatsızlık duyması\" —yani din ve şeriatin işi yükseldiğinde içten içe nefsî bir rahatsızlık hissetmesi— sonra şöyle der:"], [583.0, "\"ve benzeri, sahibinin ancak Allah'ın ve Resûlü'nün düşmanı olabileceği şeyler."], [588.0, "Bu kadarı Resûlullah sallallâhu aleyhi ve sellem zamanında vardı, ondan sonra da devam etti;"], [593.7, "hatta ondan sonra, onun dönemindekinden daha fazladır.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[599.0, "فلو تأمّلتم إلى هذه الأمثلة التي ذكرها أبو العبّاس ابنُ تيميّة،"], [604.0, "لوجدتموها أمورًا لا يُحكم على الإنسان أصلًا بأنه مسلمٌ إلا بها،"], [610.0, "فيكون هذا النفاقُ قد وقع في أصل ما يدخل به العبدُ في الإسلام."]], "tr": [[599.0, "Ebu'l-Abbâs İbn Teymiyye'nin zikrettiği bu örnekleri düşünseniz, onların, bulunmadıkça insanın aslâ Müslüman olduğuna hükmedilmeyen şeyler olduğunu görürsünüz."], [608.9, "Dolayısıyla bu nifak, kulun İslâm'a kendisiyle girdiği aslî hususta meydana gelmiş olur."]]}]}, {"ts": "10:15", "title": "2. Külliye (devam): İbn Teymiyye, İbnü'l-Kayyim, İbn Receb ve Muhammed b. Abdülvehhâb'ın nakilleri", "paras": [{"reader": false, "ar": [[615.0, "ويؤكّد ابنُ تيميّة رحمه الله ذلك في نقلٍ آخر،"], [618.0, "قال: «فأمّا النفاقُ المحض الذي لا ريبَ في كفر صاحبه، فألّا يرى وجوبَ تصديق الرسول صلى الله عليه وسلم فيما أخبر به، ولا وجوبَ طاعته فيما أمر به، وإن اعتقد أنّ الرسول عظيمُ القدر علمًا وعملًا، وأنه يجوز تصديقُه وطاعتُه؛ لكنه يقول: إنه لا يضرّ اختلافُ الملل إذا كان المعبودُ واحدًا، ويرى أنه تحصل النجاةُ والسعادةُ بمتابعة الرسول وبغير متابعته، إمّا بطريق الفلسفة، أو بطريق التهوّد والتنصّر». انتهى كلامه."]], "tr": [[615.0, "İbn Teymiyye —Allah ona rahmet etsin— bunu başka bir nakilde de teyit ederek şöyle der:"], [617.0, "\"Sahibinin küfründe hiç şüphe olmayan katıksız nifaka gelince:"], [618.5, "Resûl sallallâhu aleyhi ve sellem'i haber verdiği şeylerde tasdik etmenin vâcip olduğunu ve emrettiği şeylerde ona itaat etmenin vâcip olduğunu görmemesidir."], [627.7, "Resûl'ün ilim ve amel bakımından büyük bir kadre sahip olduğuna ve onu tasdik etmenin ve ona itaat etmenin caiz olduğuna inansa bile;"], [636.8, "fakat 'Mabut bir olduktan sonra dinlerin farklı olması zarar vermez' der ve kurtuluşun ve saadetin Resûl'e uymakla da, ona uymadan da —ya felsefe yoluyla ya da Yahudileşme ve Hristiyanlaşma yoluyla— elde edileceği görüşünde olur.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[654.0, "وكلُّ ذلك نفاقٌ وقع في أصل ما يدخل به العبدُ في الإسلام؛"], [659.0, "فإنّ كلَّ من صحّح عباداتِ أهل الكفر والوثنيّة والشرك،"], [663.0, "وقال: إنها تعبّداتٌ وطقوسٌ توصل العبدَ إلى الله،"], [667.0, "ولا حاجةَ إلى متابعة الرسول صلى الله عليه وسلم ولا إلى امتثال شريعته،"], [673.2, "فإنّ هذا هو الكفرُ بعينه."]], "tr": [[654.0, "Bunların hepsi, kulun İslâm'a kendisiyle girdiği aslî hususta meydana gelmiş nifaktır."], [659.0, "Çünkü küfür, putperestlik ve şirk ehlinin ibadetlerini sahih sayan ve \"Bunlar kulu Allah'a ulaştıran ibadetler ve ayinlerdir;"], [666.0, "Resûl sallallâhu aleyhi ve sellem'e uymaya da, onun şeriatine boyun eğmeye de gerek yoktur\" diyen herkes (bilsin ki) bu, küfrün ta kendisidir."]]}, {"reader": false, "ar": [[676.0, "وقال الإمامُ ابنُ القيّم رحمه الله في بيان أقسام النفاق:"], [681.0, "«هو نوعان: أكبر وأصغر؛ فالأكبرُ يوجب الخلودَ في النار في دَرْكها الأسفل، وهو أن يُظهر للمسلمين إيمانَه بالله وملائكته وكتبه ورسله واليوم الآخر، وهو في الباطن منسلخٌ من ذلك كلّه مكذِّبٌ به»."], [702.0, "فهذا دليلٌ على أنّ حقيقة النفاق الأكبر هي أن يقع في الأمر الذي لا يُحكم على العبد بأنه مسلمٌ إلا إذا أقرّ به وآمن به."]], "tr": [[676.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— nifakın kısımlarını açıklarken şöyle demiştir:"], [679.0, "\"Nifak iki türlüdür: büyük ve küçük."], [681.0, "Büyük nifak, ateşte, onun en alt tabakasında ebedî kalmayı gerektirir."], [687.6, "O da kişinin Müslümanlara Allah'a, meleklerine, kitaplarına, resullerine ve ahiret gününe imanını göstermesi, hâlbuki bâtında bunların hepsinden sıyrılmış ve onları yalanlıyor olmasıdır.\" Bu, büyük nifakın hakikatinin, kul ikrar edip iman etmedikçe Müslüman olduğuna hükmedilmeyen hususta meydana gelmesi olduğunun delilidir."]]}, {"reader": false, "ar": [[713.0, "وقال الإمامُ ابنُ رجب رحمه الله تعالى:"], [716.0, "«النفاقُ الأكبر هو أن يُظهر الإنسانُ الإيمانَ بالله وملائكته وكتبه ورسله واليوم الآخر، ويُبطن ما يناقض ذلك كلَّه أو بعضَه. وهذا هو النفاقُ الذي كان على عهد رسول الله صلى الله عليه وسلم، ونزل القرآنُ بذمّ أهله وتكفيرهم، وأخبر أنهم في الدرك الأسفل من النار»."]], "tr": [[713.0, "İmam İbn Receb —Allah ona rahmet etsin— şöyle demiştir:"], [716.0, "\"Büyük nifak, insanın Allah'a, meleklerine, kitaplarına, resullerine ve ahiret gününe imanı açığa vurup bunların hepsine ya da bir kısmına aykırı olanı gizlemesidir."], [728.0, "Resûlullah sallallâhu aleyhi ve sellem döneminde var olan nifak budur."], [731.5, "Kur'an, ehlini kınayarak ve onları tekfir ederek inmiş ve onların ateşin en alt tabakasında olduklarını haber vermiştir.\""]]}, {"reader": false, "ar": [[738.0, "ويؤكّد ذلك الشيخُ محمّدُ بنُ عبد الوهّاب رحمه الله في قوله:"], [742.0, "«فأمّا النفاقُ الاعتقاديّ فهو ستّة: تكذيبُ الرسول صلى الله عليه وسلم، أو تكذيبُ بعض ما جاء به الرسول صلى الله عليه وسلم، أو بُغضُ الرسول، أو بُغضُ ما جاء به الرسول، أو المسرّةُ بانخفاض دين الرسول، أو الكراهيةُ لانتصار دين الرسول. فهذه الأنواع الستّة صاحبُها من أهل الدرك الأسفل من النار»."], [770.0, "وكلُّها أمثلةٌ يَصدُق عليها هذه الكلّيّة."]], "tr": [[738.0, "Şeyh Muhammed b. Abdülvehhâb —Allah ona rahmet etsin— bunu şu sözüyle teyit eder:"], [742.0, "\"İtikadî nifak altı türlüdür: Resûl sallallâhu aleyhi ve sellem'i yalanlamak, ya da Resûl sallallâhu aleyhi ve sellem'in getirdiklerinin bir kısmını yalanlamak, ya da Resûl'e buğzetmek, ya da Resûl'ün getirdiğine buğzetmek, ya da Resûl'ün dininin alçalmasından sevinç duymak, ya da Resûl'ün dininin zafer kazanmasından hoşlanmamak."], [763.0, "Bu altı türün sahibi, ateşin en alt tabakasının ehlindendir.\" Bunların hepsi, bu külliyenin üzerlerine doğru düştüğü örneklerdir."]]}, {"reader": false, "ar": [[775.0, "فمتى ما وقع نفاقُ المنافق في أمرٍ يتعلّق به أصلُ الدخول في الإسلام والحكمِ به،"], [781.0, "فإنّ نفاقه يُعتبر من الكفر الأكبر."], [784.0, "فكلُّ من أبطن الكفرَ وأظهر الإسلامَ فنفاقُه أكبر،"], [788.0, "وكلُّ من أبطن بُغضَ رسول الله صلى الله عليه وسلم وأظهر محبّتَه فنفاقُه أكبر،"], [794.0, "وكلُّ من أبطن بُغضَ الشريعة وأظهر اتّباعَها فنفاقُه أكبر. والله أعلم."]], "tr": [[775.0, "Münafığın nifakı, İslâm'a girişin ve İslâm ile hükmedilmenin aslının bağlı olduğu bir hususta meydana geldiğinde, onun nifakı büyük küfürden sayılır."], [784.0, "Küfrü gizleyip İslâm'ı açığa vuran herkesin nifakı büyüktür."], [787.5, "Resûlullah sallallâhu aleyhi ve sellem'e buğzu gizleyip onu sevdiğini gösteren herkesin nifakı büyüktür."], [793.1, "Şeriate buğzu gizleyip ona uyduğunu gösteren herkesin nifakı büyüktür. Allah en iyisini bilir."]]}]}, {"ts": "13:19", "title": "3. Külliye: Kâfirlere velâyeti ve onların müminlere karşı zaferini sevmeyi içinde gizleyenin nifakı büyüktür", "paras": [{"reader": false, "ar": [[799.0, "ويؤكّد ذلك الكلّيّةُ الثالثة:"], [803.0, "<b>كلُّ من أبطن موالاةَ الكفّار ومحبّةَ انتصارهم على المؤمنين فنفاقُه أكبر.<\/b> كلُّ من أبطن ـ أبطن يعني في قلبه،"], [812.0, "عن اعتقاد ـ <span class=\"note\">(يكررها)<\/span> وبرهانُ هذه الكلّيّة… ولّا أُعيدها مرّةً ثالثة؟"], [835.2, "طيّب: <b>كلُّ من أبطن موالاةَ الكفّار ومحبّةَ انتصارهم على المؤمنين فنفاقُه أكبر.<\/b>"]], "tr": [[799.0, "Bunu 3. külliye de teyit eder:"], [803.0, "<b>3. külliye: Kâfirlere velâyeti ve onların müminlere karşı zafer kazanmasını sevmeyi (içinde) gizleyen herkesin nifakı büyüktür.<\/b> \"Gizleyen\" —gizlemek, yani kalbinde, bir inanç olarak.— (Tekrar ediyor.) Bu külliyenin delili… Yoksa üçüncü kez tekrar edeyim mi?"], [835.2, "Peki: <b>Kâfirlere velâyeti ve onların müminlere karşı zafer kazanmasını sevmeyi (içinde) gizleyen herkesin nifakı büyüktür.<\/b>"]]}, {"reader": false, "ar": [[844.0, "وبرهانُ هذه الكلّيّة قولُ الله عز وجل:"], [848.0, "<span class=\"ayah\">﴿أَلَمْ تَرَ إِلَى الَّذِينَ نَافَقُوا يَقُولُونَ لِإِخْوَانِهِمُ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ لَئِنْ أُخْرِجْتُمْ لَنَخْرُجَنَّ مَعَكُمْ﴾<\/span> أي نصرةً لكم،"], [860.0, "<span class=\"ayah\">﴿وَلَا نُطِيعُ فِيكُمْ أَحَدًا أَبَدًا وَإِن قُوتِلْتُمْ لَنَنصُرَنَّكُمْ وَاللَّهُ يَشْهَدُ إِنَّهُمْ لَكَاذِبُونَ﴾<\/span> <span class=\"ref\">[الحشر: ١١]<\/span>."], [872.0, "فجعل الله عز وجل هاتين الصفتين من جملة النفاق الأكبر."]], "tr": [[844.0, "Bu külliyenin delili Allah Azze ve Celle'nin şu sözüdür:"], [848.0, "<span class=\"ayah\">﴿Münafıklık edenleri görmedin mi? Kitap ehlinden inkâr eden kardeşlerine şöyle derler: \"Andolsun, eğer (yurdunuzdan) çıkarılırsanız biz de mutlaka sizinle birlikte çıkarız\"﴾<\/span> —yani size yardım için— <span class=\"ayah\">﴿\"Sizin hakkınızda hiç kimseye aslâ itaat etmeyiz. Eğer savaşa maruz kalırsanız mutlaka size yardım ederiz.\" Allah şahitlik eder ki onlar kesinlikle yalancıdırlar﴾<\/span> [Haşr 11]."], [873.0, "Allah Azze ve Celle bu iki sıfatı büyük nifakın kapsamında saymıştır."]]}, {"reader": false, "ar": [[877.0, "ويؤكّدها قولُ الله عز وجل:"], [880.0, "<span class=\"ayah\">﴿وَإِذَا لَقُوا الَّذِينَ آمَنُوا قَالُوا آمَنَّا وَإِذَا خَلَوْا إِلَىٰ شَيَاطِينِهِمْ﴾<\/span> ـ أي من المشركين واليهود ـ <span class=\"ayah\">﴿قَالُوا إِنَّا مَعَكُمْ﴾<\/span> <span class=\"ref\">[البقرة: ١٤]<\/span>،"], [890.0, "أي إنّا مناصروكم ومؤيّدوكم على النبيّ صلى الله عليه وسلم والمسلمين."]], "tr": [[877.0, "Bunu Allah Azze ve Celle'nin şu sözü de teyit eder:"], [880.0, "<span class=\"ayah\">﴿İman edenlerle karşılaştıklarında \"İman ettik\" derler; şeytanlarıyla baş başa kaldıklarında ise﴾<\/span> —yani müşriklerden ve Yahudilerden olan (şeytanlarıyla)— <span class=\"ayah\">﴿\"Biz sizinle beraberiz\" derler﴾<\/span> [Bakara 14];"], [889.5, "yani Peygamber sallallâhu aleyhi ve sellem'e ve Müslümanlara karşı size yardım eden ve sizi destekleyenleriz."]]}, {"reader": false, "ar": [[897.0, "ويؤكّدها أيضًا قولُ الله عز وجل:"], [900.0, "<span class=\"ayah\">﴿بَشِّرِ الْمُنَافِقِينَ بِأَنَّ لَهُمْ عَذَابًا أَلِيمًا ۝ الَّذِينَ يَتَّخِذُونَ الْكَافِرِينَ أَوْلِيَاءَ مِن دُونِ الْمُؤْمِنِينَ ۚ أَيَبْتَغُونَ عِندَهُمُ الْعِزَّةَ فَإِنَّ الْعِزَّةَ لِلَّهِ جَمِيعًا﴾<\/span> <span class=\"ref\">[النساء: ١٣٨–١٣٩]<\/span>."], [913.0, "وتأمّلْ معي قولَ الله عز وجل:"], [916.6, "<span class=\"ayah\">﴿أَوْلِيَاءَ مِن دُونِ الْمُؤْمِنِينَ﴾<\/span>؛"], [919.0, "فهذا دليلٌ على أنّ قلب هذا المنافق لم يَعُدْ فيه ولا مطلقُ الموالاة لأهل الإيمان،"], [924.0, "ولا مطلقُ المحبّة، ولا مطلقُ النصرة لأهل الإيمان،"], [928.0, "وإنما لا يوجد في قلبه إلا الموالاةُ المطلقة للكفّار وأعداء الملّة والدين."]], "tr": [[897.0, "Bunu Allah Azze ve Celle'nin şu sözü de teyit eder:"], [900.0, "<span class=\"ayah\">﴿Münafıklara, kendileri için elem verici bir azap olduğunu müjdele! Onlar ki müminleri bırakıp kâfirleri dost (veli) edinirler. İzzeti onların yanında mı arıyorlar? Şüphesiz izzetin tamamı Allah'ındır﴾<\/span> [Nisâ 138–139]."], [913.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿müminleri bırakıp dostlar﴾<\/span> sözünü benimle birlikte düşün:"], [919.0, "Bu, bu münafığın kalbinde iman ehline karşı en küçük bir velâyetin, en küçük bir sevginin ve iman ehline en küçük bir yardım duygusunun kalmadığının delilidir."], [928.0, "Onun kalbinde ancak kâfirlere ve millet ve din düşmanlarına mutlak bir velâyet vardır."]]}, {"reader": false, "ar": [[936.0, "فلم يقل الله عز وجل:"], [939.4, "«أولياءَ مع المؤمنين»، وإنما قال:"], [942.7, "<span class=\"ayah\">﴿أَوْلِيَاءَ مِن دُونِ الْمُؤْمِنِينَ﴾<\/span>."], [946.0, "وهذا دليلٌ على أنّ قلب المنافق فيه المفاصلةُ المطلقة؛"], [951.0, "فلا يحبّ المؤمنين، ولا يواليهم،"], [953.5, "ولا ينصرهم، بمطلق المحبّة والموالاة أو النصرة."], [957.0, "أعوذ بالله من حاله!"]], "tr": [[936.0, "Allah Azze ve Celle \"müminlerle birlikte dostlar\" demedi;"], [942.7, "<span class=\"ayah\">﴿müminleri bırakıp dostlar﴾<\/span> dedi. Bu, münafığın kalbinde (müminlerden) mutlak bir kopuş olduğunun delilidir."], [951.0, "Müminleri en küçük bir sevgi, velâyet ya da yardım ile sevmez, onları dost edinmez ve onlara yardım etmez. Onun hâlinden Allah'a sığınırım!"]]}, {"reader": false, "ar": [[958.0, "يقول الله عز وجل أيضًا:"], [963.0, "<span class=\"ayah\">﴿الَّذِينَ يَتَرَبَّصُونَ بِكُمْ﴾<\/span> ـ وهو بيانُ حال المنافقين ـ <span class=\"ayah\">﴿الَّذِينَ يَتَرَبَّصُونَ بِكُمْ فَإِن كَانَ لَكُمْ فَتْحٌ مِّنَ اللَّهِ قَالُوا أَلَمْ نَكُن مَّعَكُمْ وَإِن كَانَ لِلْكَافِرِينَ نَصِيبٌ قَالُوا أَلَمْ نَسْتَحْوِذْ عَلَيْكُمْ وَنَمْنَعْكُم مِّنَ الْمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[النساء: ١٤١]<\/span>؛"], [981.8, "أي منعَ نصرةٍ وموالاةٍ ومحبّة."]], "tr": [[958.0, "Allah Azze ve Celle şöyle de buyurur:"], [963.0, "<span class=\"ayah\">﴿Onlar ki sizi gözetlerler﴾<\/span> —bu, münafıkların hâlinin beyanıdır— <span class=\"ayah\">﴿Onlar ki sizi gözetlerler; size Allah'tan bir fetih (zafer) gelirse \"Biz sizinle beraber değil miydik?\" derler. Kâfirlere bir pay düşerse \"Size üstün gelip sizi müminlerden korumadık mı?\" derler﴾<\/span> [Nisâ 141];"], [981.0, "yani (müminlerin) yardımından, velâyetinden ve sevgisinden korumadık mı?"]]}, {"reader": false, "ar": [[985.0, "وقال الله عز وجل:"], [987.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّخِذُوا الْيَهُودَ وَالنَّصَارَىٰ أَوْلِيَاءَ ۘ بَعْضُهُمْ أَوْلِيَاءُ بَعْضٍ ۚ وَمَن يَتَوَلَّهُم مِّنكُمْ فَإِنَّهُ مِنْهُمْ ۗ إِنَّ اللَّهَ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ﴾<\/span> <span class=\"ref\">[المائدة: ٥١]<\/span>؛"], [999.0, "هذا كفرٌ ظاهر. ثمّ بيّن الكفرَ الباطن بقوله:"], [1002.0, "<span class=\"ayah\">﴿فَتَرَى الَّذِينَ فِي قُلُوبِهِم مَّرَضٌ يُسَارِعُونَ فِيهِمْ يَقُولُونَ نَخْشَىٰ أَن تُصِيبَنَا دَائِرَةٌ ۚ فَعَسَى اللَّهُ أَن يَأْتِيَ بِالْفَتْحِ أَوْ أَمْرٍ مِّنْ عِندِهِ فَيُصْبِحُوا عَلَىٰ مَا أَسَرُّوا فِي أَنفُسِهِمْ نَادِمِينَ﴾<\/span> <span class=\"ref\">[المائدة: ٥٢]<\/span>."], [1018.0, "فهم يُظهرون أنهم مع المؤمنين،"], [1021.3, "ولكنّ قلوبهم ومحبّتهم وهوى أفئدتهم وموالاتهم ونصرتهم مع الكفّار، والعياذ بالله."]], "tr": [[985.0, "Allah Azze ve Celle şöyle buyurdu:"], [987.0, "<span class=\"ayah\">﴿Ey iman edenler! Yahudileri ve Hristiyanları dost (veli) edinmeyin. Onlar birbirlerinin dostlarıdır. Sizden kim onları dost edinirse, o da onlardandır. Şüphesiz Allah zalimler topluluğunu doğru yola iletmez﴾<\/span> [Mâide 51]."], [999.0, "Bu, zahirî küfürdür. Sonra bâtınî küfrü şu sözüyle açıkladı:"], [1002.0, "<span class=\"ayah\">﴿Kalplerinde hastalık bulunanların \"Başımıza bir felaketin gelmesinden korkuyoruz\" diyerek onların arasına koştuklarını görürsün. Umulur ki Allah bir fetih ya da katından bir emir getirir de onlar içlerinde gizlediklerine pişman olurlar﴾<\/span> [Mâide 52]."], [1018.0, "Onlar müminlerle beraber olduklarını gösterirler;"], [1020.6, "fakat kalpleri, sevgileri, gönüllerinin meyli, velâyetleri ve yardımları kâfirlerle beraberdir. Allah'a sığınırız."]]}, {"reader": false, "ar": [[1030.0, "فهذا من النفاق الأكبر؛"], [1032.0, "فكلُّ من رأيتَه يفرح بانتصار أهل الكفر على أهل الإسلام،"], [1037.0, "ودائمًا يذمّ أهلَ الإسلام في مواجهة أهل الكفر،"], [1041.0, "فاعلمْ أنّ هذا من النفاق الذي وقع في أصل ما يدخل به العبدُ في الإسلام؛"], [1048.0, "فإنّ أصلَ الموالاة للمسلمين شرطٌ لصحّة الإيمان."], [1052.0, "فمن ليس له… فمن ليس في قلبه ولا مطلقُ الموالاة لله ولرسوله ولعباده المؤمنين،"], [1060.0, "ولا مطلقُ النصرة، ولا مطلقُ المحبّة لله ولرسوله وللمؤمنين،"], [1066.0, "فلا يكون صاحبُ ذلك إلا كافرًا."]], "tr": [[1030.0, "Bu, büyük nifaktandır. Küfür ehlinin İslâm ehline karşı zafer kazanmasına sevindiğini ve küfür ehli karşısında İslâm ehlini sürekli kötülediğini gördüğün herkes için bil ki bu, kulun İslâm'a kendisiyle girdiği aslî hususta meydana gelmiş nifaktandır."], [1048.0, "Çünkü Müslümanlara velâyetin aslı, imanın sıhhatinin şartıdır."], [1052.0, "Kimin… Kimin kalbinde Allah'a, Resûlü'ne ve mümin kullarına en küçük bir velâyet, Allah'a, Resûlü'ne ve müminlere en küçük bir yardım ve en küçük bir sevgi yoksa, böyle birisi ancak kâfir olur."]]}]}, {"ts": "17:50", "title": "4. Külliye: Bâtınen Allah'ın ve Resûlü'nün hükmünden başkasına muhakeme olmayı isteyen ve seven kimsenin nifakı büyüktür", "paras": [{"reader": false, "ar": [[1070.0, "ومن الكلّيّات أيضًا: <b>كلُّ من كان مريدًا في الباطن ومحبًّا للتحاكم لغير الله ورسوله فنفاقُه أكبر.<\/b> <b>كلُّ من كان مريدًا في الباطن ومحبًّا للتحاكم لغير حُكم الله ورسوله فنفاقُه أكبر<\/b>، والعياذ بالله."]], "tr": [[1070.0, "Külliyelerden biri de şudur: 4."], [1072.2, "külliye: Bâtınen Allah'tan ve Resûlü'nden başkasına muhakeme olmayı isteyen ve seven herkesin nifakı büyüktür. Bâtınen Allah'ın ve Resûlü'nün hükmünden başkasına muhakeme olmayı isteyen ve seven herkesin nifakı büyüktür. Allah'a sığınırız."]]}, {"reader": false, "ar": [[1098.0, "وهذه صفةٌ عظيمةٌ من صفات المنافقين نفاقًا أكبر،"], [1107.0, "وهي أنهم يُدعَون إلى كتاب الله عز وجل ليحكم بينهم،"], [1112.0, "ثم تأبى قلوبُهم التحاكمَ إلى كتاب الله وإلى سنّة رسوله صلى الله عليه وسلم،"], [1118.0, "ويتملّصون من التحاكم إليهما والحكمِ بهما،"], [1122.0, "إلى أحكام الشرق والغرب،"], [1124.2, "وإلى التحاكم إلى القوانين الوضعيّة."]], "tr": [[1098.0, "Bu, büyük nifakla münafık olanların büyük sıfatlarından biridir:"], [1103.1, "Aralarında hüküm versin diye Allah Azze ve Celle'nin Kitabı'na çağrılırlar;"], [1111.0, "sonra kalpleri Allah'ın Kitabı'na ve Resûlü sallallâhu aleyhi ve sellem'in sünnetine muhakeme olmaktan kaçınır."], [1116.7, "Bu ikisine muhakeme olmaktan ve bu ikisiyle hükmetmekten sıyrılıp doğunun ve batının hükümlerine ve beşerî kanunlara muhakeme olmaya yönelirler."]]}, {"reader": false, "ar": [[1127.0, "وقد ذكر الله عز وجل هذه الصفةَ في قوله:"], [1133.0, "<span class=\"ayah\">﴿أَلَمْ تَرَ إِلَى الَّذِينَ يَزْعُمُونَ أَنَّهُمْ آمَنُوا بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ﴾<\/span> ـ وهذا دليلٌ على أنهم يزعمونها زعمَ ظاهرٍ لا زعمَ باطن،"], [1146.0, "وهم المنافقون ـ <span class=\"ayah\">﴿يُرِيدُونَ﴾<\/span> ـ أي من سُوَيداء قلوبهم،"], [1153.0, "وهذه إرادةٌ قلبيّةٌ باطنيّة ـ <span class=\"ayah\">﴿أَن يَتَحَاكَمُوا إِلَى الطَّاغُوتِ وَقَدْ أُمِرُوا أَن يَكْفُرُوا بِهِ وَيُرِيدُ الشَّيْطَانُ أَن يُضِلَّهُمْ ضَلَالًا بَعِيدًا ۝ وَإِذَا قِيلَ لَهُمْ تَعَالَوْا إِلَىٰ مَا أَنزَلَ اللَّهُ وَإِلَى الرَّسُولِ رَأَيْتَ الْمُنَافِقِينَ يَصُدُّونَ عَنكَ صُدُودًا ۝ فَكَيْفَ إِذَا أَصَابَتْهُم مُّصِيبَةٌ بِمَا قَدَّمَتْ أَيْدِيهِمْ ثُمَّ جَاءُوكَ يَحْلِفُونَ بِاللَّهِ إِنْ أَرَدْنَا إِلَّا إِحْسَانًا وَتَوْفِيقًا ۝ أُولَٰئِكَ الَّذِينَ يَعْلَمُ اللَّهُ مَا فِي قُلُوبِهِمْ فَأَعْرِضْ عَنْهُمْ وَعِظْهُمْ وَقُل لَّهُمْ فِي أَنفُسِهِمْ قَوْلًا بَلِيغًا﴾<\/span> <span class=\"ref\">[النساء: ٦٠–٦٣]<\/span> الآيات."]], "tr": [[1127.0, "Allah Azze ve Celle bu sıfatı şu sözünde zikretmiştir:"], [1133.0, "<span class=\"ayah\">﴿Sana indirilene ve senden önce indirilene iman ettiklerini iddia edenleri görmedin mi?﴾<\/span> —Bu, onların bunu zahirî bir iddia ile iddia ettiklerinin, bâtınî bir iddia ile değil, delilidir;"], [1144.8, "bunlar münafıklardır— <span class=\"ayah\">﴿İsterler﴾<\/span> —yani kalplerinin ta derinliğinden;"], [1148.6, "bu, kalbî ve bâtınî bir istektir— <span class=\"ayah\">﴿ki tâğûtun önünde muhakeme olsunlar; oysa onu inkâr etmekle emrolunmuşlardı. Şeytan ise onları derin bir sapıklıkla saptırmak ister. Onlara \"Allah'ın indirdiğine ve Resûl'e gelin\" denildiğinde, münafıkların senden büsbütün yüz çevirdiklerini görürsün. Kendi elleriyle yaptıkları yüzünden başlarına bir musibet geldiğinde, sonra sana gelip \"Biz iyilikten ve uzlaştırmaktan başka bir şey istemedik\" diye Allah'a yemin ettiklerinde nasıl olacak? Onlar, Allah'ın kalplerindekini bildiği kimselerdir. Onlardan yüz çevir, onlara öğüt ver ve onlara kendileri hakkında etkili bir söz söyle﴾<\/span> [Nisâ 60–63] ayetleri."]]}, {"reader": false, "ar": [[1197.0, "فقد سمّى الله عز وجل من اختار التحاكمَ إلى غير الله ورسوله صلى الله عليه وسلم تحاكمًا إلى الشيطان،"], [1206.8, "وهو الطاغوت. فكان المنافقون يؤثرون حكمَ الطواغيت،"], [1212.0, "ويقدّمون حكمَ الكهنة، ويؤثرون التحاكمَ لغير الله عز وجل على الحكم بما أنزل الله عز وجل."]], "tr": [[1197.0, "Allah Azze ve Celle, Allah'tan ve Resûlü sallallâhu aleyhi ve sellem'den başkasına muhakeme olmayı seçenin bu muhakemesini şeytana —ki o tâğûttur— muhakeme olmak diye adlandırmıştır."], [1208.0, "Münafıklar tâğûtların hükmünü tercih eder, kâhinlerin hükmünü öne geçirir ve Allah Azze ve Celle'den başkasına muhakeme olmayı Allah Azze ve Celle'nin indirdiğiyle hükmetmeye tercih ederlerdi."]]}]}, {"ts": "20:21", "title": "4. Külliye (devam): Münafıkların Allah'ın ve Resûlü'nün hükmünden yüz çevirmesi", "paras": [{"reader": false, "ar": [[1221.0, "وانظرْ وتأمّلْ في هذه الآيات كيف أمر الله عز وجل رسولَه صلى الله عليه وسلم بالإعراض عن هؤلاء المنافقين؛"], [1231.0, "لأنه لا يحترم التحاكمَ إلى الله ورسوله إلا المؤمنُ الثابت،"], [1238.6, "صحيحُ الإيمان، تقيُّ العقيدة ممّا يشوبها."], [1242.0, "ويقول الله عز وجل:"], [1244.5, "<span class=\"ayah\">﴿وَإِذَا دُعُوا إِلَى اللَّهِ وَرَسُولِهِ لِيَحْكُمَ بَيْنَهُمْ إِذَا فَرِيقٌ مِّنْهُم مُّعْرِضُونَ ۝ وَإِن يَكُن لَّهُمُ الْحَقُّ يَأْتُوا إِلَيْهِ مُذْعِنِينَ ۝ أَفِي قُلُوبِهِم مَّرَضٌ أَمِ ارْتَابُوا أَمْ يَخَافُونَ أَن يَحِيفَ اللَّهُ عَلَيْهِمْ وَرَسُولُهُ ۚ بَلْ أُولَٰئِكَ هُمُ الظَّالِمُونَ﴾<\/span> <span class=\"ref\">[النور: ٤٨–٥٠]<\/span>."]], "tr": [[1221.0, "Bak ve bu ayetlerde Allah Azze ve Celle'nin Resûlü sallallâhu aleyhi ve sellem'e bu münafıklardan yüz çevirmesini nasıl emrettiğini düşün."], [1231.0, "Çünkü Allah'a ve Resûlü'ne muhakeme olmaya ancak sebatlı, imanı sahih, akîdesi onu bulandıran şeylerden korunmuş mümin saygı gösterir."], [1239.7, "Allah Azze ve Celle şöyle buyurur:"], [1242.0, "<span class=\"ayah\">﴿Aralarında hüküm vermesi için Allah'a ve Resûlü'ne çağrıldıklarında, bakarsın ki içlerinden bir grup yüz çevirir. Ama hak kendi lehlerine ise boyun eğerek ona gelirler. Kalplerinde bir hastalık mı var, yoksa şüpheye mi düştüler, yoksa Allah'ın ve Resûlü'nün kendilerine haksızlık edeceğinden mi korkuyorlar? Hayır, asıl zalimler onlardır﴾<\/span> [Nûr 48–50]."]]}, {"reader": false, "ar": [[1264.0, "فالمنافقون ما كان لهم أن يرضَوا بحكم الله ورسوله أبدًا،"], [1270.0, "بل يضعون العراقيلَ والصعوبات،"], [1273.6, "ويتعلّلون بأسبابٍ واهية، بل قد يتعمّدون تشويهَ صورة حكم الله ورسوله جحودًا وتكذيبًا به،"], [1284.0, "فيصفون تطبيقَ الحدود بصفاتٍ مستهجَنة ليُبغِّضوا في تطبيق حكم الله ورسوله في أرضه."], [1293.0, "فالرغبةُ عن حكم الله ورسوله آفةُ النفاق وشُعبتُه الواضحةُ الظاهرة؛"], [1300.0, "فيستكثرون على الله عز وجل اسمَه «الحَكَم»،"], [1306.0, "فيعطّلون هذا الاسمَ وهذه الصفةَ إلى التحاكم لغير شريعته. والله أعلم."]], "tr": [[1264.0, "Münafıkların Allah'ın ve Resûlü'nün hükmüne razı olması aslâ mümkün değildi."], [1272.5, "Aksine engeller ve zorluklar çıkarır, çürük sebepler ileri sürerler."], [1281.5, "Hatta inkâr ve yalanlama olarak Allah'ın ve Resûlü'nün hükmünün görüntüsünü kasten çirkinleştirebilirler;"], [1293.0, "Allah'ın ve Resûlü'nün hükmünün O'nun yeryüzünde uygulanmasını (insanlara) sevimsiz göstermek için hadlerin uygulanmasını çirkin sıfatlarla nitelerler."], [1296.5, "Allah'ın ve Resûlü'nün hükmünden yüz çevirmek, nifakın âfeti ve onun açık, belirgin şubesidir."], [1300.0, "Allah Azze ve Celle'nin \"el-Hakem\" ismini O'na çok görürler;"], [1304.5, "O'nun şeriatinden başkasına muhakeme olmaya yönelerek bu ismi ve bu sıfatı ta'til ederler. Allah en iyisini bilir."]]}]}, {"ts": "21:53", "title": "5. Külliye: İman ehline imanlarından dolayı buğzeden kimsenin nifakı büyüktür", "paras": [{"reader": false, "ar": [[1313.0, "ومن الكلّيّات أيضًا: <b>كلُّ من أبغض أهلَ الإيمان لإيمانهم فنفاقُه أكبر.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[1313.0, "Külliyelerden biri de şudur: 5."], [1314.9, "külliye: İman ehline imanlarından dolayı buğzeden herkesin nifakı büyüktür. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1335.0, "فهو لا يُبغضهم لأشخاصهم،"], [1337.4, "ولا لألوانهم، ولا لبلادهم،"], [1339.8, "ولا لجنسيّاتهم، ولا لوظائفهم،"], [1342.5, "ولا لحظوظٍ شخصيّةٍ فيما بينه وبينهم،"], [1347.0, "وإنما يُبغضهم لتمسّكهم بشريعة الله عز وجل."], [1350.0, "الشوكةُ التي عجز أن يبتلعها هي تمسّكُ أهل الإيمان بشريعة الله تبارك وتعالى."], [1359.0, "فهو يُبغض أهلَ اللِّحى لامتثالهم أمرَ الله بتربية اللحية،"], [1364.0, "ويُبغض المطبِّقين للحدود والداعين لتطبيق شريعة الله عز وجل في الدولة؛ لأنها شريعةُ الله."]], "tr": [[1335.0, "O, onlara şahısları, renkleri, memleketleri, milliyetleri, meslekleri ya da kendisiyle onlar arasındaki şahsî çıkarlar yüzünden buğzetmez;"], [1344.6, "onlara ancak Allah Azze ve Celle'nin şeriatine sarıldıkları için buğzeder."], [1350.0, "Yutmaktan âciz kaldığı diken, iman ehlinin Allah Tebâreke ve Teâlâ'nın şeriatine sarılmasıdır."], [1359.0, "Allah'ın sakal bırakma emrine uydukları için sakal sahiplerine buğzeder;"], [1363.4, "hadleri uygulayanlara ve Allah Azze ve Celle'nin şeriatinin devlette uygulanmasına çağıranlara buğzeder; çünkü o, Allah'ın şeriatidir."]]}, {"reader": false, "ar": [[1373.0, "فهو لا يريد الدينَ،"], [1375.0, "ولا يريد الشريعةَ لذاتها؛"], [1377.0, "فكلُّ من يدعو إليها،"], [1379.0, "وكلُّ من يأمر بها،"], [1381.0, "وكلُّ من ينهى عمّا يخالفها،"], [1384.0, "فهذا المنافقُ يُبغضه لأمرٍ دينيٍّ يتعلّق بالشرع."], [1389.0, "فمتى ما وجد الإنسانُ في قلبه ـ والعياذ بالله ـ بُغضًا لأحدٍ من أهل الإيمان لِما يحمله من صفات الإيمان وتطبيق الدين والشرع،"], [1398.0, "فليعلمْ أنّ في قلبه نفاقًا أكبر."]], "tr": [[1373.0, "O, dini istemez; şeriati de bizzat kendisi için istemez."], [1377.0, "Ona çağıran, onu emreden ve ona aykırı olandan nehyeden herkese bu münafık, şeriatle ilgili dinî bir sebepten dolayı buğzeder."], [1389.0, "İnsan kalbinde —Allah korusun— iman ehlinden birine, taşıdığı iman sıfatları, dini ve şeriati uygulaması sebebiyle bir buğz bulursa, kalbinde büyük nifak olduğunu bilsin."]]}, {"reader": false, "ar": [[1401.0, "كما قال الله عز وجل مبيّنًا هذه الحقيقة:"], [1407.7, "<span class=\"ayah\">﴿هَا أَنتُمْ أُولَاءِ تُحِبُّونَهُمْ وَلَا يُحِبُّونَكُمْ وَتُؤْمِنُونَ بِالْكِتَابِ كُلِّهِ وَإِذَا لَقُوكُمْ قَالُوا آمَنَّا وَإِذَا خَلَوْا عَضُّوا عَلَيْكُمُ الْأَنَامِلَ مِنَ الْغَيْظِ ۚ قُلْ مُوتُوا بِغَيْظِكُمْ ۗ إِنَّ اللَّهَ عَلِيمٌ بِذَاتِ الصُّدُورِ ۝ إِن تَمْسَسْكُمْ حَسَنَةٌ تَسُؤْهُمْ وَإِن تُصِبْكُمْ سَيِّئَةٌ يَفْرَحُوا بِهَا ۖ وَإِن تَصْبِرُوا وَتَتَّقُوا لَا يَضُرُّكُمْ كَيْدُهُمْ شَيْئًا ۗ إِنَّ اللَّهَ بِمَا يَعْمَلُونَ مُحِيطٌ﴾<\/span> <span class=\"ref\">[آل عمران: ١١٩–١٢٠]<\/span>."]], "tr": [[1401.0, "Nitekim Allah Azze ve Celle bu hakikati açıklayarak şöyle buyurmuştur:"], [1407.7, "<span class=\"ayah\">﴿İşte siz öyle kimselersiniz ki onları seversiniz, onlar ise sizi sevmezler. Siz Kitab'ın tamamına iman edersiniz. Onlar sizinle karşılaştıklarında \"İman ettik\" derler; yalnız kaldıklarında ise size olan öfkelerinden parmak uçlarını ısırırlar. De ki: \"Öfkenizle ölün!\" Şüphesiz Allah göğüslerin özünü bilir. Size bir iyilik dokunsa onları üzer; başınıza bir kötülük gelse ona sevinirler. Eğer sabreder ve takvâ sahibi olursanız onların hilesi size hiçbir zarar vermez. Şüphesiz Allah onların yaptıklarını kuşatandır﴾<\/span> [Âl-i İmrân 119–120]."]]}, {"reader": false, "ar": [[1442.0, "وتأمّلْ عِظَمَ البغضاء لأهل الإيمان في قول الله عز وجل عن الحسنة:"], [1449.6, "<span class=\"ayah\">﴿تَمْسَسْكُمْ﴾<\/span>، وفي قوله عن المصيبة:"], [1453.2, "<span class=\"ayah\">﴿تُصِبْكُمْ﴾<\/span>؛ وذلك لأنّ أدنى الحسنات لا يريد أهلُ النفاق أن تأتي لأهل الإيمان،"], [1462.0, "فمجرّدُ وجود شيءٍ من الحسنات والخير لأهل الإيمان يُبغضه أهلُ النفاق."]], "tr": [[1442.0, "İman ehline karşı buğzun büyüklüğünü, Allah Azze ve Celle'nin iyilik hakkında <span class=\"ayah\">﴿size dokunsa﴾<\/span>, musibet hakkında ise <span class=\"ayah\">﴿başınıza gelse (sizi isabet etse)﴾<\/span> buyurmasında düşün."], [1453.2, "Çünkü nifak ehli iyiliklerin en küçüğünün bile iman ehline gelmesini istemez;"], [1460.2, "iman ehline iyilik ve hayırdan bir şeyin sırf bulunması bile nifak ehlinin hoşuna gitmez."]]}, {"reader": false, "ar": [[1470.0, "فإنّ الإنسان ربما يرضى ببعض الحسنات على بعض إخوانه،"], [1475.0, "لكنّ أهل النفاق لا يرضَون ولا بمطلق الحسنة أن تمسّ أهلَ الإيمان،"], [1480.0, "فيحاولون جاهدين ألّا يمسّ أهلَ الإيمان شيءٌ من الحسنات،"], [1485.0, "فيقفون حجرَ عثرةٍ في وصول أيّ شيءٍ من الحسنات لأهل الإيمان."]], "tr": [[1470.0, "İnsan, bazı kardeşlerine bazı iyiliklerin gelmesine razı olabilir;"], [1473.9, "fakat nifak ehli en küçük bir iyiliğin bile iman ehline dokunmasına razı olmaz."], [1479.6, "İman ehline iyiliklerden hiçbir şeyin dokunmaması için var güçleriyle çalışırlar;"], [1485.0, "iman ehline herhangi bir iyiliğin ulaşmasının önünde engel taşı olarak dururlar."]]}, {"reader": false, "ar": [[1490.0, "وقد جرت عادةُ الإنسان الرحيم أنّ الإنسان إذا رأى إنسانًا قد أُصيب بمصيبةٍ كبيرة أن يرحمه،"], [1498.9, "لكنّ أهل النفاق ـ لشدّة بغضهم لأهل الإيمان ـ مهما تُصِبْكم من المصائب العظيمة فإنّ ذلك لا يزيد قلوبَهم إلا طربًا،"], [1507.0, "ولا أفئدتَهم إلا فرحًا."], [1508.0, "فعبّر عن الحسنة بأنّ أهل النفاق يكرهون وصولَ شيءٍ منها،"], [1514.0, "وعبّر عن المصيبة بأنهم يريدون وصولَ أكبر شيءٍ منها لأهل الإسلام والدين."], [1521.0, "فأيُّ بغضٍ انطوت عليه قلوبُ هؤلاء الشِّرذمة،"], [1525.9, "لعنهم الله في الدنيا والآخرة!"]], "tr": [[1490.0, "Merhametli insanın âdeti şudur: İnsan, büyük bir musibete uğramış birini gördüğünde ona acır."], [1497.5, "Fakat nifak ehli —iman ehline olan şiddetli buğzlarından dolayı— başınıza ne kadar büyük musibetler gelirse gelsin, bu onların kalplerine coşkudan, gönüllerine sevinçten başka bir şey katmaz."], [1508.0, "(Allah) iyilikten, nifak ehlinin ondan bir şeyin ulaşmasından hoşlanmadığını (ifade edecek şekilde) söz etti;"], [1514.0, "musibetten ise onun en büyüğünün İslâm ve din ehline ulaşmasını istediklerini (ifade edecek şekilde) söz etti."], [1521.0, "Bu güruhun —Allah onlara dünyada ve ahirette lanet etsin— kalpleri ne büyük bir buğzu barındırıyor!"]]}]}, {"ts": "25:29", "title": "5. Külliye (devam): Müminlere duanın imandan, sahabeye buğzun nifaktan olması", "paras": [{"reader": false, "ar": [[1529.0, "وقال الله عز وجل مبيّنًا حالَ أهل الإيمان:"], [1533.0, "<span class=\"ayah\">﴿وَالَّذِينَ جَاءُوا مِن بَعْدِهِمْ يَقُولُونَ رَبَّنَا اغْفِرْ لَنَا وَلِإِخْوَانِنَا الَّذِينَ سَبَقُونَا بِالْإِيمَانِ وَلَا تَجْعَلْ فِي قُلُوبِنَا غِلًّا لِّلَّذِينَ آمَنُوا رَبَّنَا إِنَّكَ رَءُوفٌ رَّحِيمٌ﴾<\/span> <span class=\"ref\">[الحشر: ١٠]<\/span>،"], [1546.0, "ثم ذكر حالَ المنافقين بعد هذه الآية مباشرةً:"], [1549.2, "<span class=\"ayah\">﴿أَلَمْ تَرَ إِلَى الَّذِينَ نَافَقُوا﴾<\/span> <span class=\"ref\">[الحشر: ١١]<\/span> الآيةَ بتمامها؛"], [1552.0, "ممّا يدلّ على أنّ من أخصّ خصائص وجود الإيمان في القلب محبّةَ أهل الإيمان،"], [1559.0, "والدعاءَ لهم، والاستغفارَ لهم،"], [1561.1, "وألّا يجد الإنسانُ في قلبه غضاضةً ولا غِلًّا ولا حقدًا ولا حسدًا لأحدٍ من عباد الله عز وجل."]], "tr": [[1529.0, "Allah Azze ve Celle iman ehlinin hâlini açıklayarak şöyle buyurdu:"], [1533.0, "<span class=\"ayah\">﴿Onlardan sonra gelenler şöyle derler: \"Rabbimiz! Bizi ve bizden önce iman etmiş kardeşlerimizi bağışla. Kalplerimizde iman edenlere karşı hiçbir kin bırakma. Rabbimiz! Şüphesiz sen çok şefkatlisin, çok merhametlisin.\"﴾<\/span> [Haşr 10]."], [1546.4, "Sonra bu ayetin hemen ardından münafıkların hâlini zikretti:"], [1549.2, "<span class=\"ayah\">﴿Münafıklık edenleri görmedin mi?﴾<\/span> [Haşr 11] ayetin tamamı."], [1552.0, "Bu da kalpte imanın bulunmasının en hususî özelliklerinden birinin iman ehlini sevmek, onlara dua etmek, onlar için bağışlanma dilemek ve insanın kalbinde Allah Azze ve Celle'nin kullarından hiçbirine karşı bir rahatsızlık, kin, hınç ve haset bulmaması olduğunu gösterir."]]}, {"reader": false, "ar": [[1567.0, "وإنّ من أعظم علامات وجود النفاق في القلب بغضَ أهل الإيمان لإيمانهم،"], [1573.0, "ومحبّةَ وصول المصائب والشرّ لهم."], [1577.0, "فأهلُ النفاق يحرصون على أن يكونوا سدًّا منيعًا لوصول أيّ شيءٍ من الخير لأهل الإسلام،"], [1587.0, "وبوّابةً كبرى لوصول أعظم مصيبةٍ على أهل الإسلام، والعياذ بالله."]], "tr": [[1567.0, "Kalpte nifakın bulunmasının en büyük alametlerinden biri, iman ehline imanlarından dolayı buğzetmek ve onlara musibetlerin ve kötülüğün ulaşmasını sevmektir."], [1577.0, "Nifak ehli, İslâm ehline hayırdan herhangi bir şeyin ulaşmasının önünde aşılmaz bir set, İslâm ehline en büyük musibetin ulaşması için de büyük bir kapı olmaya hırs gösterirler. Allah'a sığınırız."]]}, {"reader": false, "ar": [[1593.0, "ولا سيّما بغضُ الصحابة؛"], [1600.0, "فإنّ بين المنافقين وصحابةِ النبيّ صلى الله عليه وسلم بغضاءَ عجيبةً جدًّا."], [1606.0, "فمن أعظم من يُبغضه أهلُ النفاق:"], [1609.4, "الصحابةُ من المهاجرين والأنصار،"], [1611.5, "وأولياءُ الله الصالحون من أهل العلم والعبادة."], [1615.0, "لذلك جعل النبيّ صلى الله عليه وسلم ـ بل جعل أهلُ السنة والجماعة ـ من علامات الإيمان محبّةَ أصحاب النبيّ صلى الله عليه وسلم،"], [1627.0, "وموالاتَهم، والبراءةَ ممّن يُبغضهم ويعاديهم."]], "tr": [[1593.0, "Özellikle de sahabeye buğz. Çünkü münafıklarla Peygamber sallallâhu aleyhi ve sellem'in ashâbı arasında pek tuhaf bir buğz vardır."], [1606.0, "Nifak ehlinin en çok buğzettikleri arasında Muhâcir ve Ensâr'dan sahabe ile ilim ve ibadet ehlinden Allah'ın sâlih velîleri bulunur."], [1615.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem —hatta Ehl-i Sünnet ve'l-Cemaat— Peygamber sallallâhu aleyhi ve sellem'in ashâbını sevmeyi, onlara velâyet beslemeyi ve onlara buğzedip düşmanlık edenlerden uzak durmayı imanın alametlerinden saymıştır."]]}, {"reader": false, "ar": [[1631.0, "كما في حديث البراء بن عازب رضي الله عنه قال:"], [1634.4, "قال النبيّ صلى الله عليه وسلم:"], [1637.0, "«الأنصارُ لا يحبّهم إلا مؤمن، ولا يُبغضهم إلا منافق، من أحبّهم أحبّه الله، ومن أبغضهم أبغضه الله»."], [1646.0, "وفي الحديث عن أنس بن مالك رضي الله عنه قال:"], [1649.3, "قال النبيّ صلى الله عليه وسلم:"], [1651.0, "«آيةُ الإيمان حبُّ الأنصار، وآيةُ النفاق بغضُ الأنصار»."], [1656.0, "ويقول عليُّ بنُ أبي طالب رضي الله تعالى عنه:"], [1659.0, "«والذي فلق الحبّةَ وبرأ النَّسَمة، إنه لعهدُ النبيّ الأمّيّ إليّ: أنه لا يحبّني إلا مؤمن، ولا يُبغضني إلا منافق»."]], "tr": [[1631.0, "Nitekim Berâ b. Âzib radıyallâhu anh hadisinde şöyle dedi:"], [1634.4, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1637.0, "\"Ensâr'ı ancak mümin sever, onlara ancak münafık buğzeder."], [1641.0, "Onları seveni Allah sever, onlara buğzedene Allah buğzeder.\" Enes b."], [1646.0, "Mâlik radıyallâhu anh'tan gelen hadiste şöyle dedi:"], [1649.3, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1651.0, "\"İmanın alameti Ensâr'ı sevmek, nifakın alameti Ensâr'a buğzetmektir.\" Ali b."], [1656.7, "Ebî Tâlib radıyallâhu anh şöyle der:"], [1659.0, "\"Taneyi yarıp (filizlendiren) ve canlıyı yaratana andolsun ki, ümmî Peygamber'in bana ahdi (vasiyeti) şudur:"], [1665.9, "Beni ancak mümin sever, bana ancak münafık buğzeder.\""]]}, {"reader": false, "ar": [[1669.0, "ولله درُّ الإمام خَيْثَمة رحمه الله تعالى لمّا قال:"], [1674.0, "«واللهِ ما أحبَّ منافقٌ مؤمنًا أبدًا»."], [1678.0, "«واللهِ ما أحبَّ منافقٌ مؤمنًا أبدًا». والله أعلم."]], "tr": [[1669.0, "İmam Hayseme —Allah ona rahmet etsin— ne güzel söylemiştir:"], [1674.0, "\"Allah'a andolsun ki hiçbir münafık bir mümini aslâ sevmemiştir.\" \"Allah'a andolsun ki hiçbir münafık bir mümini aslâ sevmemiştir.\" Allah en iyisini bilir."]]}]}, {"ts": "28:06", "title": "6. Külliye: Dinle ve dinleri ve imanları sebebiyle din ehliyle alay edenin nifakı büyüktür", "paras": [{"reader": false, "ar": [[1686.0, "ومن الكلّيّات أيضًا: <b>كلُّ من استهزأ بالدين وأهلِه لدينهم وإيمانهم فنفاقُه أكبر.<\/b> <span class=\"note\">(يكررها)<\/span> كلُّ من استهزأ بالدين وأهله لإيمانهم ودينهم ـ أو تكتفي بواحدة،"], [1710.2, "لا بأس ـ فنفاقُه أكبر."], [1712.5, "وهذا من أعظم صفات المنافقين أيضًا،"], [1717.0, "وهي السبُّ والتنقّصُ والاستهزاءُ بالدين وأهلِه المتمسّكين به."]], "tr": [[1686.0, "Külliyelerden biri de şudur: 6."], [1688.0, "külliye: Dinle ve din ehliyle, dinleri ve imanları sebebiyle alay eden herkesin nifakı büyüktür. (Tekrar ediyor.) Dinle ve din ehliyle imanları ve dinleri sebebiyle alay eden herkesin —ya da (ikisinden) biriyle yetinebilirsin, sakıncası yok— nifakı büyüktür."], [1712.5, "Bu da münafıkların en büyük sıfatlarındandır:"], [1715.3, "dine ve ona sarılan din ehline sövmek, onları küçümsemek ve onlarla alay etmek."]]}, {"reader": false, "ar": [[1722.0, "فمن صفات المنافقين التي فضحهم الله عز وجل بها في كتابه أنهم يستهزئون بالله،"], [1728.8, "ويستهزئون برسول الله صلى الله عليه وسلم،"], [1733.0, "ويستهزئون بالصحابة، وأولياءِ الله،"], [1735.9, "والعُبّاد، والزُّهّاد، والدعاة، والعلماء،"], [1740.0, "وأهلِ الدين، والمتمسّكين بشريعة ربّ العالمين عز وجل."]], "tr": [[1722.0, "Allah Azze ve Celle'nin Kitabı'nda münafıkları kendisiyle rezil ettiği sıfatlarından biri şudur:"], [1726.5, "Allah ile alay ederler, Resûlullah sallallâhu aleyhi ve sellem ile alay ederler;"], [1732.4, "sahabe, Allah'ın velîleri, âbidler, zâhidler, davetçiler, âlimler, din ehli ve âlemlerin Rabbi Azze ve Celle'nin şeriatine sarılanlarla alay ederler."]]}, {"reader": false, "ar": [[1744.0, "كما قال الله عز وجل:"], [1746.0, "<span class=\"ayah\">﴿وَإِذَا قِيلَ لَهُمْ آمِنُوا كَمَا آمَنَ النَّاسُ قَالُوا أَنُؤْمِنُ كَمَا آمَنَ السُّفَهَاءُ ۗ أَلَا إِنَّهُمْ هُمُ السُّفَهَاءُ وَلَٰكِن لَّا يَعْلَمُونَ ۝ وَإِذَا لَقُوا الَّذِينَ آمَنُوا قَالُوا آمَنَّا وَإِذَا خَلَوْا إِلَىٰ شَيَاطِينِهِمْ قَالُوا إِنَّا مَعَكُمْ إِنَّمَا نَحْنُ مُسْتَهْزِئُونَ﴾<\/span> ـ أي بالنبيّ صلى الله عليه وسلم وصحابته وشريعته ـ <span class=\"ayah\">﴿اللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِي طُغْيَانِهِمْ يَعْمَهُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٣–١٥]<\/span>."]], "tr": [[1744.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1746.0, "<span class=\"ayah\">﴿Onlara \"İnsanların iman ettiği gibi siz de iman edin\" denildiğinde, \"Beyinsizlerin iman ettiği gibi mi iman edelim?\" derler. İyi bilin ki asıl beyinsizler onlardır, fakat bilmezler. İman edenlerle karşılaştıklarında \"İman ettik\" derler; şeytanlarıyla baş başa kaldıklarında ise \"Biz sizinle beraberiz, biz sadece alay ediyoruz\" derler﴾<\/span> —yani Peygamber sallallâhu aleyhi ve sellem ile, ashâbıyla ve şeriatiyle— <span class=\"ayah\">﴿Allah onlarla alay eder ve onları azgınlıkları içinde bocalar hâlde bırakır﴾<\/span> [Bakara 13–15]."]]}, {"reader": false, "ar": [[1778.0, "ويقول الله عز وجل:"], [1780.6, "<span class=\"ayah\">﴿يَحْذَرُ الْمُنَافِقُونَ أَن تُنَزَّلَ عَلَيْهِمْ سُورَةٌ تُنَبِّئُهُم بِمَا فِي قُلُوبِهِمْ ۚ قُلِ اسْتَهْزِئُوا﴾<\/span> <span class=\"note\">(يكررها)<\/span> <span class=\"ayah\">﴿إِنَّ اللَّهَ مُخْرِجٌ مَّا تَحْذَرُونَ ۝ وَلَئِن سَأَلْتَهُمْ لَيَقُولُنَّ إِنَّمَا كُنَّا نَخُوضُ وَنَلْعَبُ ۚ قُلْ أَبِاللَّهِ وَآيَاتِهِ وَرَسُولِهِ كُنتُمْ تَسْتَهْزِئُونَ ۝ لَا تَعْتَذِرُوا قَدْ كَفَرْتُم بَعْدَ إِيمَانِكُمْ﴾<\/span> <span class=\"ref\">[التوبة: ٦٤–٦٦]<\/span>."]], "tr": [[1778.0, "Allah Azze ve Celle şöyle buyurur:"], [1780.6, "<span class=\"ayah\">﴿Münafıklar, kalplerinde olanı kendilerine haber verecek bir sûrenin, kendileri hakkında indirilmesinden çekinirler. De ki: \"Alay edin!\"﴾<\/span> (Tekrar ediyor.) <span class=\"ayah\">﴿\"Şüphesiz Allah çekindiğiniz şeyi ortaya çıkaracaktır.\" Andolsun, onlara sorsan, \"Biz sadece lafa dalıyor ve şakalaşıyorduk\" derler. De ki: \"Allah ile, O'nun ayetleriyle ve Resûlü ile mi alay ediyordunuz? Özür dilemeyin; iman ettikten sonra kâfir oldunuz.\"﴾<\/span> [Tevbe 64–66]."]]}]}, {"ts": "30:08", "title": "6. Külliye (devam): Kur'an'da ve sünnette alay edenler", "paras": [{"reader": false, "ar": [[1808.0, "ويقول الله عز وجل:"], [1811.0, "<span class=\"ayah\">﴿الَّذِينَ يَلْمِزُونَ﴾<\/span> ـ وهذا نوعُ سخريةٍ واستهزاء ـ <span class=\"ayah\">﴿الَّذِينَ يَلْمِزُونَ الْمُطَّوِّعِينَ مِنَ الْمُؤْمِنِينَ فِي الصَّدَقَاتِ وَالَّذِينَ لَا يَجِدُونَ إِلَّا جُهْدَهُمْ فَيَسْخَرُونَ مِنْهُمْ ۙ سَخِرَ اللَّهُ مِنْهُمْ وَلَهُمْ عَذَابٌ أَلِيمٌ﴾<\/span> <span class=\"ref\">[التوبة: ٧٩]<\/span>."], [1831.0, "وقال الله عز وجل في آخر سورة المطفّفين:"], [1834.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ أَجْرَمُوا كَانُوا مِنَ الَّذِينَ آمَنُوا يَضْحَكُونَ ۝ وَإِذَا مَرُّوا بِهِمْ يَتَغَامَزُونَ ۝ وَإِذَا انقَلَبُوا إِلَىٰ أَهْلِهِمُ انقَلَبُوا فَكِهِينَ﴾<\/span> <span class=\"ref\">[المطففين: ٢٩–٣١]<\/span> الآياتِ بتمامها."]], "tr": [[1808.0, "Allah Azze ve Celle şöyle buyurur:"], [1811.0, "<span class=\"ayah\">﴿Onlar ki dil uzatırlar﴾<\/span> —bu bir tür alay ve istihzadır— <span class=\"ayah\">﴿Onlar ki sadakalar konusunda gönülden bağışta bulunan müminlere ve güçlerinin yettiğinden başka bir şey bulamayanlara dil uzatır, onlarla alay ederler. Allah da onlarla alay eder (karşılığını verir); onlar için elem verici bir azap vardır﴾<\/span> [Tevbe 79]."], [1834.0, "Allah Azze ve Celle Mutaffifîn sûresinin sonunda şöyle buyurdu:"], [1838.1, "<span class=\"ayah\">﴿Suç işleyenler, iman edenlere gülerlerdi. Yanlarından geçtiklerinde birbirlerine kaş göz ederlerdi. Ailelerine döndüklerinde (yaptıklarından) zevk alarak dönerlerdi﴾<\/span> [Mutaffifîn 29–31] ayetlerin tamamı."]]}, {"reader": false, "ar": [[1849.0, "ويقول الله عز وجل مبيّنًا أنّ هذه الحقيقة كانت في الأمم السابقة،"], [1855.0, "وهي اتّخاذُ الله ورسلِه وشريعتِه هزوًا،"], [1861.0, "كما قال الله عز وجل:"], [1863.0, "<span class=\"ayah\">﴿وَلَقَدِ اسْتُهْزِئَ بِرُسُلٍ مِّن قَبْلِكَ فَحَاقَ بِالَّذِينَ سَخِرُوا مِنْهُم مَّا كَانُوا بِهِ يَسْتَهْزِئُونَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٠]<\/span>،"], [1870.0, "وبقول الله عز وجل:"], [1872.2, "<span class=\"ayah\">﴿وَلَا تَتَّخِذُوا آيَاتِ اللَّهِ هُزُوًا﴾<\/span> <span class=\"ref\">[البقرة: ٢٣١]<\/span>،"], [1875.0, "وبقول الله عز وجل:"], [1876.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّخِذُوا الَّذِينَ اتَّخَذُوا دِينَكُمْ هُزُوًا وَلَعِبًا مِّنَ الَّذِينَ أُوتُوا الْكِتَابَ مِن قَبْلِكُمْ وَالْكُفَّارَ أَوْلِيَاءَ﴾<\/span> <span class=\"ref\">[المائدة: ٥٧]<\/span>."]], "tr": [[1849.0, "Allah Azze ve Celle, bu hakikatin —yani Allah'ı, resullerini ve şeriatini alay konusu edinmenin— önceki ümmetlerde de bulunduğunu açıklar."], [1858.1, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1863.0, "<span class=\"ayah\">﴿Andolsun, senden önceki resullerle de alay edildi; sonunda onlarla alay edenleri, alay ettikleri şey kuşatıverdi﴾<\/span> [En'âm 10]."], [1869.5, "Allah Azze ve Celle'nin şu sözüyle de:"], [1872.2, "<span class=\"ayah\">﴿Allah'ın ayetlerini alay konusu edinmeyin﴾<\/span> [Bakara 231]."], [1874.4, "Allah Azze ve Celle'nin şu sözüyle de:"], [1876.0, "<span class=\"ayah\">﴿Ey iman edenler! Sizden önce kendilerine kitap verilenlerden dininizi alay ve oyun konusu edinenleri ve kâfirleri dost edinmeyin﴾<\/span> [Mâide 57]."]]}, {"reader": false, "ar": [[1886.0, "وقال الله عز وجل:"], [1887.3, "<span class=\"ayah\">﴿وَقَدْ نَزَّلَ عَلَيْكُمْ فِي الْكِتَابِ أَنْ إِذَا سَمِعْتُمْ آيَاتِ اللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا﴾<\/span> ـ انتبهْ مَن الذي يفعلها؟"], [1898.0, "ذكرهم في آخر الآية ـ <span class=\"ayah\">﴿وَقَدْ نَزَّلَ عَلَيْكُمْ فِي الْكِتَابِ أَنْ إِذَا سَمِعْتُمْ آيَاتِ اللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُوا مَعَهُمْ حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ ۚ إِنَّكُمْ إِذًا مِّثْلُهُمْ ۗ إِنَّ اللَّهَ جَامِعُ الْمُنَافِقِينَ وَالْكَافِرِينَ فِي جَهَنَّمَ جَمِيعًا﴾<\/span> <span class=\"ref\">[النساء: ١٤٠]<\/span>."]], "tr": [[1886.0, "Allah Azze ve Celle şöyle buyurdu:"], [1887.3, "<span class=\"ayah\">﴿O, Kitap'ta size şunu indirmiştir: Allah'ın ayetlerinin inkâr edildiğini ve onlarla alay edildiğini işittiğinizde…﴾<\/span> —dikkat et, bunu kim yapıyor?"], [1898.0, "Onları ayetin sonunda zikretti— <span class=\"ayah\">﴿O, Kitap'ta size şunu indirmiştir: Allah'ın ayetlerinin inkâr edildiğini ve onlarla alay edildiğini işittiğinizde, onlar başka bir söze dalıncaya kadar yanlarında oturmayın; yoksa siz de onlar gibi olursunuz. Şüphesiz Allah münafıkları ve kâfirleri cehennemde toplayacaktır﴾<\/span> [Nisâ 140]."]]}, {"reader": false, "ar": [[1920.0, "وفي الحديث عن عبد الله بن عمر ـ عفوًا،"], [1923.8, "عبد الله بن عمر ـ رضي الله عنهما قال:"], [1926.7, "جاء رجلٌ في غزوة تبوك إلى النبيّ… قال:"], [1933.5, "جاء رجلٌ في غزوة تبوك في مجلسٍ:"], [1937.0, "ما رأيتُ… نعم، فقال:"], [1938.7, "«ما رأينا مثلَ قُرّائنا هؤلاء، أرغبَ بطونًا، ولا أكذبَ ألسُنًا، ولا أجبنَ عند اللقاء»."], [1947.0, "فقال رجلٌ معه كان في المجلس:"], [1950.4, "كذبتَ، ولكنّك منافق، لأُخبرنّ رسولَ الله صلى الله عليه وسلم."], [1957.0, "فبلغ ذلك رسولَ الله صلى الله عليه وسلم ونزل به القرآن."]], "tr": [[1920.0, "Abdullah b. Ömer —pardon, Abdullah b."], [1922.4, "Ömer— radıyallâhu anhümâ'dan gelen hadiste şöyle dedi:"], [1923.9, "Tebük Gazvesi'nde bir adam Peygamber'e geldi… Şöyle dedi:"], [1926.7, "Tebük Gazvesi'nde bir adam bir mecliste:"], [1930.3, "\"Görmedim…\" Evet, şöyle dedi: \"Bu kurrâlarımız (Kur'an okuyucularımız) gibisini görmedik;"], [1937.0, "karınları daha düşkün, dilleri daha yalancı ve düşmanla karşılaşınca daha korkak.\" Mecliste onunla birlikte bulunan bir adam:"], [1947.0, "\"Yalan söyledin; sen münafıksın! Bunu mutlaka Resûlullah sallallâhu aleyhi ve sellem'e haber vereceğim\" dedi."], [1957.0, "Bu, Resûlullah sallallâhu aleyhi ve sellem'e ulaştı ve bu konuda Kur'an indi."]]}, {"reader": false, "ar": [[1962.0, "فقال عبدُ الله بنُ عمر:"], [1964.2, "أنا رأيتُه متعلّقًا بحَقَب ناقة رسول الله صلى الله عليه وسلم تنكُبُه الحجارة،"], [1969.9, "وهو يقول: يا رسول الله،"], [1972.2, "إنما كنّا نخوض ونلعب،"], [1974.0, "ورسولُ الله صلى الله عليه وسلم يقول:"], [1978.5, "<span class=\"ayah\">﴿قُلْ أَبِاللَّهِ وَآيَاتِهِ وَرَسُولِهِ كُنتُمْ تَسْتَهْزِئُونَ﴾<\/span> <span class=\"ref\">[التوبة: ٦٥]<\/span>،"], [1983.0, "لا يزيده على أن يقرأ عليه ذلك."], [1986.0, "والحديث حسنٌ إن شاء الله."], [1988.0, "فالذين يستهزئون بأهل الدين وأهل الإسلام في تمسّكهم بإيمانهم وشريعة ربّهم،"], [1995.0, "هذا لا يصدر أبدًا إلا عن قلبٍ قد حلّه النفاقُ الأكبر، والعياذ بالله."]], "tr": [[1962.0, "Abdullah b. Ömer şöyle dedi:"], [1964.2, "\"Onu, taşlar ayaklarını yaralarken Resûlullah sallallâhu aleyhi ve sellem'in devesinin semer kayışına tutunmuş hâlde gördüm."], [1970.8, "'Ey Allah'ın Resûlü! Biz sadece lafa dalıyor ve şakalaşıyorduk' diyordu."], [1978.5, "Resûlullah sallallâhu aleyhi ve sellem ise <span class=\"ayah\">﴿De ki: Allah ile, O'nun ayetleriyle ve Resûlü ile mi alay ediyordunuz?﴾<\/span> [Tevbe 65] diyor, ona bunu okumaktan fazlasını söylemiyordu.\" Hadis inşallah hasendir."], [1988.0, "İman ehliyle ve İslâm ehliyle imanlarına ve Rablerinin şeriatine sarılmalarından dolayı alay edenler (bilsinler ki) bu, ancak büyük nifakın yerleştiği bir kalpten çıkar. Allah'a sığınırız."]]}]}, {"ts": "33:20", "title": "7. Külliye: Zahirî vâcip amellerde bâtının zahire aykırı olmasıyla meydana gelen her nifak küçük nifaktır", "paras": [{"reader": false, "ar": [[2000.0, "ومن الكلّيّات أيضًا: <b>كلُّ نفاقٍ وقع في مخالفة الباطن للظاهر في الأعمال الواجبة الظاهرة فنفاقٌ أصغر.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيده مرّةً ثالثة:"], [2042.0, "<b>كلُّ نفاقٍ وقع في مخالفة الباطن للظاهر في الأعمال الواجبة الظاهرة فنفاقٌ أصغر<\/b>،"], [2049.0, "وإن سمّيتَه نفاقًا عمليًّا فلا بأس."]], "tr": [[2000.0, "Külliyelerden biri de şudur: 7."], [2005.0, "külliye: Zahirî vâcip amellerde bâtının zahire aykırı olmasıyla meydana gelen her nifak küçük nifaktır. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [2042.0, "<b>Zahirî vâcip amellerde bâtının zahire aykırı olmasıyla meydana gelen her nifak küçük nifaktır.<\/b> Ona amelî nifak dersen de sakıncası yok."]]}, {"reader": false, "ar": [[2051.0, "وهذه الكلّيّة صرّح بها جمعٌ من أهل العلم رحمهم الله تعالى."], [2061.0, "قال الإمامُ ابنُ العربيّ:"], [2064.0, "«أصولُه» ـ أي النفاق ـ «وهي قسمان: أحدهما أن يكون الخبرُ أو الفعلُ في توحيد الله وتصديقه، أو يكون في الأعمال؛ فإن كان في التوحيد كان صريحًا» ـ يعني أكبر ـ «وإن كان في الأعمال كان معصية»."]], "tr": [[2051.0, "Bu külliyeyi ehl-i ilimden —Allah onlara rahmet etsin— bir topluluk açıkça ifade etmiştir."], [2064.0, "İmam İbnü'l-Arabî şöyle demiştir: \"Onun\" —yani nifakın— \"asılları iki kısımdır:"], [2069.9, "Birincisi, haberin ya da fiilin Allah'ın tevhidinde ve tasdikinde olması;"], [2075.7, "ya da amellerde olması. Eğer tevhidde ise sarih (açık küfür) olur\" —yani büyük— \"amellerde ise masiyet olur.\""]]}, {"reader": false, "ar": [[2090.0, "ويدلّ على ذلك ما في الصحيحين من حديث أبي هريرة رضي الله عنه قال:"], [2095.4, "قال النبيّ صلى الله عليه وسلم:"], [2098.0, "«آيةُ المنافق ثلاث: إذا حدّث كذب، وإذا وعد أخلف، وإذا اؤتُمن خان»."], [2103.0, "وأنت ترى أنّ النفاق هنا إنما صار في الأمور الظاهرة،"], [2107.0, "ولكن لا تعلّقَ له بأصل ما يدخل به العبدُ في الإسلام؛"], [2112.0, "فقد يُحكم له بالإسلام وهو يكذب في الحديث،"], [2115.0, "ويُحكم له بالإسلام وهو يخون في الأمانة."], [2119.0, "فهذه العلاماتُ الثلاث لا شأنَ لها بأصل الإسلام،"], [2125.0, "وإنما هي مخالفاتٌ فيما يجب في الظاهر."]], "tr": [[2090.0, "Buna Sahîhayn'de (Buhârî ve Müslim'de) Ebû Hüreyre radıyallâhu anh hadisinde gelen şu söz delildir:"], [2095.4, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [2098.0, "\"Münafığın alameti üçtür: Konuştuğunda yalan söyler, söz verdiğinde sözünden döner, kendisine bir şey emanet edildiğinde hıyanet eder.\" Görüyorsun ki buradaki nifak ancak zahirî işlerde meydana gelmiştir;"], [2108.8, "kulun İslâm'a kendisiyle girdiği asılla bir ilgisi yoktur."], [2112.0, "Kişi konuşmasında yalan söylediği hâlde Müslüman olduğuna hükmedilebilir;"], [2115.0, "emanette hıyanet ettiği hâlde Müslüman olduğuna hükmedilir."], [2119.0, "Bu üç alametin İslâm'ın aslıyla bir ilgisi yoktur;"], [2125.0, "bunlar ancak zahiren vâcip olan şeylerdeki muhalefetlerdir."]]}, {"reader": false, "ar": [[2127.0, "وفي الصحيحين من حديث عبد الله بن عمرو بن العاص رضي الله عنهما قال:"], [2133.5, "قال النبيّ صلى الله عليه وسلم:"], [2136.5, "«أربعٌ من كنّ فيه كان منافقًا خالصًا، ومن كانت فيه خصلةٌ منهنّ كانت فيه خصلةٌ من النفاق حتى يدَعَها: إذا اؤتُمن خان، وإذا حدّث كذب، وإذا عاهد غدر، وإذا خاصم فجر»."], [2153.0, "وفي «صحيح الإمام مسلم» من حديث عبد الله بن عمر رضي الله عنهما قال:"], [2158.5, "قال النبيّ صلى الله عليه وسلم:"], [2161.5, "«مثلُ المنافق كمثل الشاة العائرة بين الغنمين، تَعِيرُ إلى هذا مرّةً، وإلى هذا مرّة»."]], "tr": [[2127.0, "Sahîhayn'de Abdullah b. Amr b."], [2128.8, "el-Âs radıyallâhu anhümâ hadisinde şöyle dedi:"], [2131.2, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [2133.5, "\"Dört şey vardır ki kimde bulunursa halis bir münafık olur."], [2136.5, "Kimde bunlardan bir haslet bulunursa, onu bırakıncaya kadar onda nifaktan bir haslet var demektir:"], [2142.2, "Kendisine bir şey emanet edildiğinde hıyanet eder, konuştuğunda yalan söyler, ahitleştiğinde ahdini bozar, husumet ettiğinde haddi aşar.\" İmam Müslim'in Sahîh'inde Abdullah b."], [2153.0, "Ömer radıyallâhu anhümâ hadisinde şöyle dedi:"], [2155.7, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [2158.5, "\"Münafığın misali, iki koyun sürüsü arasında gidip gelen koyunun misali gibidir;"], [2164.5, "bir bu tarafa koşar, bir öbür tarafa.\""]]}]}, {"ts": "36:09", "title": "7. Külliye (devam): Amelî nifakın sıfatları ve iki nifak arasındaki fark", "paras": [{"reader": false, "ar": [[2169.0, "فإخلافُ الوعد من صفات النفاق العمليّ،"], [2173.2, "وخيانةُ الأمانة من صفاته،"], [2176.0, "وكذبُ الحديث من صفاته،"], [2178.7, "والفجورُ في الخصومة من صفاته."], [2182.0, "ومن صفاته كذلك التقاعسُ عن العبادات وتأخيرُها عن وقتها،"], [2189.0, "كما قال الله عز وجل:"], [2191.6, "<span class=\"ayah\">﴿وَإِذَا قَامُوا إِلَى الصَّلَاةِ قَامُوا كُسَالَىٰ يُرَاءُونَ النَّاسَ وَلَا يَذْكُرُونَ اللَّهَ إِلَّا قَلِيلًا﴾<\/span> <span class=\"ref\">[النساء: ١٤٢]<\/span>."]], "tr": [[2169.0, "Sözden dönmek amelî nifakın sıfatlarındandır;"], [2172.5, "emanete hıyanet onun sıfatlarındandır; konuşmada yalan onun sıfatlarındandır;"], [2178.0, "husumette haddi aşmak onun sıfatlarındandır."], [2182.0, "İbadetlerde gevşeklik göstermek ve onları vaktinden geciktirmek de onun sıfatlarındandır."], [2187.7, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2191.6, "<span class=\"ayah\">﴿Namaza kalktıklarında tembel tembel kalkarlar, insanlara gösteriş yaparlar ve Allah'ı pek az anarlar﴾<\/span> [Nisâ 142]."]]}, {"reader": false, "ar": [[2199.0, "وفي الصحيحين من حديث أبي هريرة رضي الله عنه قال:"], [2202.5, "قال النبيّ صلى الله عليه وسلم:"], [2205.3, "«أثقلُ الصلاة على المنافقين صلاةُ العشاء وصلاةُ الفجر، ولو يعلمون ما فيهما لأتَوهما ولو حَبْوًا»."], [2212.0, "وفي الصحيح أيضًا يقول النبيّ صلى الله عليه وسلم:"], [2217.2, "«تلك صلاةُ المنافق، تلك صلاةُ المنافق: يجلس يرقُب الشمسَ، حتى إذا كانت بين قرنَي شيطانٍ قام فنقرها أربعًا، لا يذكر اللهَ فيها إلا قليلًا»."]], "tr": [[2199.0, "Sahîhayn'de Ebû Hüreyre radıyallâhu anh hadisinde şöyle dedi:"], [2202.5, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [2205.3, "\"Münafıklara en ağır gelen namaz yatsı namazı ile sabah namazıdır."], [2209.0, "Bu ikisinde ne (sevap) olduğunu bilselerdi, emekleyerek de olsa onlara gelirlerdi.\" Yine Sahîh'te Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [2217.2, "\"İşte bu münafığın namazıdır, işte bu münafığın namazıdır:"], [2220.6, "Oturup güneşi gözetler; nihayet güneş şeytanın iki boynuzu arasına gelince kalkar ve (namazı) dört kez gagalar;"], [2228.1, "onda Allah'ı pek az anar.\""]]}, {"reader": false, "ar": [[2231.0, "وعند الإمام أبي داود ـ بإسنادٍ حسنٍ لغيره ـ من حديث أُبَيّ بن كعب رضي الله عنه قال:"], [2236.7, "صلّى بنا رسولُ الله صلى الله عليه وسلم ذاتَ يومٍ صلاةَ الصبح،"], [2241.0, "فلمّا سلّم قال: «أشاهدٌ فلان؟» قالوا:"], [2243.6, "لا. قال: «أشاهدٌ فلان؟» قالوا:"], [2246.4, "لا ـ فسمّى رجالًا ـ فقال:"], [2248.6, "«إنّ هاتين الصلاتين أثقلُ الصلوات على المنافقين، ولو تعلمون ما فيهما لأتيتموهما ولو حَبْوًا على الرُّكَب»،"], [2259.0, "أو كما قال صلى الله عليه وسلم."]], "tr": [[2231.0, "İmam Ebû Dâvûd'da —hasen li-gayrihî bir isnadla— Übey b."], [2234.2, "Ka'b radıyallâhu anh hadisinde şöyle dedi:"], [2236.7, "Bir gün Resûlullah sallallâhu aleyhi ve sellem bize sabah namazını kıldırdı."], [2239.9, "Selâm verince \"Falan burada mı?\" diye sordu."], [2242.3, "\"Hayır\" dediler. \"Falan burada mı?\" diye sordu."], [2243.6, "\"Hayır\" dediler —birkaç adamın adını saydı— Sonra şöyle buyurdu:"], [2246.4, "\"Bu iki namaz, münafıklara en ağır gelen namazlardır."], [2249.9, "Bu ikisinde ne olduğunu bilseydiniz, dizleriniz üzerinde emekleyerek de olsa onlara gelirdiniz.\" Ya da buna benzer bir söz söyledi sallallâhu aleyhi ve sellem."]]}, {"reader": false, "ar": [[2262.0, "ومن علامات النفاق العمليّ قلّةُ ذكر الله عز وجل؛"], [2265.0, "فلا ترى نصيبَ ذكر الله من يومه وليلته إلا نَزْرًا،"], [2270.0, "إلا نَزْرًا يسيرًا، كما قال الله عز وجل:"], [2273.0, "<span class=\"ayah\">﴿وَلَا يَذْكُرُونَ اللَّهَ إِلَّا قَلِيلًا﴾<\/span> <span class=\"ref\">[النساء: ١٤٢]<\/span>،"], [2275.0, "وفي حديث أنس الآنفِ الذِّكر:"], [2278.0, "«لا يذكر اللهَ فيها إلا قليلًا»."]], "tr": [[2262.0, "Amelî nifakın alametlerinden biri de Allah Azze ve Celle'yi az anmaktır."], [2265.0, "Onun gece ve gündüzünden Allah'ın zikrine düşen payın ancak pek az, pek az bir miktar olduğunu görürsün."], [2271.3, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2273.0, "<span class=\"ayah\">﴿Allah'ı pek az anarlar﴾<\/span> [Nisâ 142]."], [2275.0, "Az önce zikredilen Enes hadisinde de:"], [2278.0, "\"Onda Allah'ı pek az anar.\""]]}, {"reader": false, "ar": [[2281.0, "فمن صفات الإيمان كثرةُ ذكر الله،"], [2284.0, "كما قال الله عز وجل:"], [2285.0, "<span class=\"ayah\">﴿وَالذَّاكِرِينَ اللَّهَ كَثِيرًا وَالذَّاكِرَاتِ﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٥]<\/span>،"], [2289.0, "وقال الله عز وجل:"], [2290.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اذْكُرُوا اللَّهَ ذِكْرًا كَثِيرًا ۝ وَسَبِّحُوهُ بُكْرَةً وَأَصِيلًا﴾<\/span> <span class=\"ref\">[الأحزاب: ٤١–٤٢]<\/span>."]], "tr": [[2281.0, "İmanın sıfatlarından biri Allah'ı çok anmaktır."], [2283.5, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2285.0, "<span class=\"ayah\">﴿Allah'ı çok anan erkekler ve (çok anan) kadınlar﴾<\/span> [Ahzâb 35]."], [2290.0, "Allah Azze ve Celle şöyle de buyurmuştur:"], [2291.0, "<span class=\"ayah\">﴿Ey iman edenler! Allah'ı çokça anın. Sabah akşam O'nu tesbih edin﴾<\/span> [Ahzâb 41–42]."]]}, {"reader": false, "ar": [[2296.0, "ومن أعظم صفات المنافقين النفاقَ العمليَّ:"], [2300.0, "تعطيلُ شريعة الأمر بالمعروف والنهي عن المنكر،"], [2303.0, "بل والأمرُ بالمنكر والنهيُ عن المعروف،"], [2308.0, "كما قال الله عز وجل:"], [2309.0, "<span class=\"ayah\">﴿الْمُنَافِقُونَ وَالْمُنَافِقَاتُ بَعْضُهُم مِّن بَعْضٍ ۚ يَأْمُرُونَ بِالْمُنكَرِ وَيَنْهَوْنَ عَنِ الْمَعْرُوفِ وَيَقْبِضُونَ أَيْدِيَهُمْ ۚ نَسُوا اللَّهَ فَنَسِيَهُمْ ۗ إِنَّ الْمُنَافِقِينَ هُمُ الْفَاسِقُونَ﴾<\/span> <span class=\"ref\">[التوبة: ٦٧]<\/span>،"], [2324.0, "وغيرُ ذلك من الصفات."]], "tr": [[2296.0, "Amelî nifakla münafık olanların en büyük sıfatlarından biri, iyiliği emretme ve kötülükten sakındırma şeriatini işlemez hâle getirmektir;"], [2306.1, "hatta kötülüğü emretmek ve iyilikten sakındırmaktır."], [2309.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2311.4, "<span class=\"ayah\">﴿Münafık erkekler ve münafık kadınlar birbirlerindendir. Kötülüğü emreder, iyilikten alıkoyarlar ve ellerini (hayırdan) sıkı tutarlar. Allah'ı unuttular, Allah da onları unuttu. Şüphesiz münafıklar fâsıkların ta kendileridir﴾<\/span> [Tevbe 67]."], [2324.0, "Bunlar dışında başka sıfatlar da vardır."]]}, {"reader": false, "ar": [[2326.0, "فالفُرقانُ بين النفاق الاعتقاديّ الأكبر وبين النفاق العمليّ الأصغر إنما هو مكانُ وقوعه:"], [2338.0, "فإذا وقع فيما هو شرطٌ في الحكم بالإسلام فنفاقٌ أكبر،"], [2344.0, "وأمّا إذا وقع في الأمور التي يتوقّف عليها كمالُ الإيمان الواجب فنفاقٌ أصغر. والله أعلم."]], "tr": [[2326.0, "Büyük itikadî nifak ile küçük amelî nifak arasındaki ayırıcı fark, ancak onun meydana geldiği yerdir."], [2338.0, "İslâm ile hükmedilmede şart olan şeyde meydana gelirse büyük nifaktır;"], [2344.0, "vâcip olan iman kemâlinin bağlı olduğu hususlarda meydana gelirse küçük nifaktır. Allah en iyisini bilir."]]}]}, {"ts": "39:13", "title": "8. Külliye: İslâm'ı ve hayır istediğini açığa vuran kimseye zahirine göre muamele edilir, içi Allah'a bırakılır", "paras": [{"reader": false, "ar": [[2353.0, "ومن الكلّيّات أيضًا: كلُّ من أظهر الإسلامَ وإرادةَ الخير عُومل بظاهره،"], [2359.3, "وتُركت سريرتُه إلى الله.<b> <\/b>كلُّ من أظهر الإسلامَ وإرادةَ الخير عُومل بظاهره،"], [2368.4, "وتُركت سريرتُه إلى الله عز وجل."]], "tr": [[2353.0, "Külliyelerden biri de şudur: 8."], [2354.6, "külliye: İslâm'ı ve hayır istediğini açığa vuran herkese zahirine göre muamele edilir, içi (gizlisi) Allah'a bırakılır. İslâm'ı ve hayır istediğini açığa vuran herkese zahirine göre muamele edilir, içi Allah Azze ve Celle'ye bırakılır."]]}, {"reader": false, "ar": [[2372.5, "وذلك لأنّ المتقرّر في القواعد أنّ لنا الظاهرَ،"], [2387.0, "والله يتولّى السرائر. ومن المعلوم أنّ النفاق أمرٌ باطنيّ،"], [2391.0, "قد لا يُظهره الإنسان،"], [2393.0, "ولا يعلم أهلُ الإيمان بوجوده في قلبه؛"], [2395.7, "لأنّ أمور القلوب لا يعلم بها إلا علّامُ الغيوب تبارك وتعالى."]], "tr": [[2372.5, "Bu şundandır: Kaidelerde yerleşik olan şudur:"], [2386.0, "Zahir bize aittir, içleri ise Allah üstlenir."], [2388.3, "Bilinen bir şeydir ki nifak bâtınî bir iştir;"], [2391.5, "insan onu açığa vurmayabilir, iman ehli de onun kalbinde bulunduğunu bilmez."], [2395.7, "Çünkü kalplerin işlerini ancak gaybları çok iyi bilen Allah Tebâreke ve Teâlâ bilir."]]}, {"reader": false, "ar": [[2400.0, "فحينئذٍ أمرنا الشارعُ بأن نتعامل مع الناس على حسب ما يُظهرونه لنا من خيرٍ أو شرّ،"], [2407.2, "وألّا نُسيء الظنَّ في أحدٍ ما لم تظهر لنا منه قرائنُ سوء الظنّ."], [2413.0, "فمن أظهر لنا الخيرَ ما ظننّا به إلا الخير،"], [2417.0, "وعاملناه على ما يظهر لنا منه،"], [2420.0, "ومن أظهر لنا الشرَّ والسوءَ عاملناه على حسب ما يظهر لنا منه."]], "tr": [[2400.0, "Bu durumda Şâri' bize, insanlara bize gösterdikleri hayır ya da şerre göre muamele etmemizi ve kendisinden sû-i zan karineleri görmedikçe hiç kimse hakkında kötü zanda bulunmamamızı emretti."], [2413.0, "Bize hayır gösterene hayırdan başka bir zanda bulunmayız ve ona bize görünen hâline göre muamele ederiz."], [2420.0, "Bize şer ve kötülük gösterene de bize görünen hâline göre muamele ederiz."]]}, {"reader": false, "ar": [[2426.0, "وقد أمرنا الله عز وجل بذلك في قوله:"], [2430.0, "<span class=\"ayah\">﴿فَإِن تَابُوا وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ فَخَلُّوا سَبِيلَهُمْ﴾<\/span> <span class=\"ref\">[التوبة: ٥]<\/span>؛"], [2434.3, "أي عملًا بالظاهر. وقد كان أهلُ النفاق يخرجون في الجهاد مع النبيّ صلى الله عليه وسلم،"], [2441.0, "ولا يأمر أحدًا منهم بأن يرجع،"], [2445.0, "بل كانوا يشهدون الصلواتِ الخمس في المسجد مع النبيّ صلى الله عليه وسلم،"], [2452.0, "وكانوا إذا تخلّفوا عن بعض الغزوات جاءوا واستغفروا الله،"], [2456.5, "واستغفر لهم الرسول، ويأخذهم بظواهرهم،"], [2459.5, "ولم يكن يحكم على بواطنهم،"], [2464.0, "بل كان يكفّ عن قتلهم ويقول:"], [2467.0, "«حتى لا يتحدّث الناسُ أنّ محمّدًا يقتل أصحابَه»."]], "tr": [[2426.0, "Allah Azze ve Celle bize bunu şu sözüyle emretmiştir:"], [2430.0, "<span class=\"ayah\">﴿Eğer tevbe eder, namazı kılar ve zekâtı verirlerse yollarını serbest bırakın﴾<\/span> [Tevbe 5];"], [2432.6, "yani za
