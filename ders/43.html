hire göre amel ederek."], [2434.3, "Nifak ehli Peygamber sallallâhu aleyhi ve sellem ile birlikte cihada çıkarlardı;"], [2434.9, "o, onlardan hiçbirine geri dönmesini emretmezdi."], [2436.0, "Hatta Peygamber sallallâhu aleyhi ve sellem ile birlikte mescitte beş vakit namazda hazır bulunurlardı."], [2449.8, "Bazı gazvelerden geri kaldıklarında gelir, Allah'tan bağışlanma dilerlerdi;"], [2458.0, "Resûl de onlar için bağışlanma dilerdi."], [2467.0, "Onları zahirlerine göre alır, bâtınlarına göre hüküm vermezdi."], [2468.5, "Hatta onları öldürmekten geri durur ve \"İnsanlar Muhammed'in ashâbını öldürdüğünü konuşmasın diye\" derdi."]]}]}, {"ts": "41:11", "title": "8. Külliye (devam): Zahire göre muameleye dair hadisler", "paras": [{"reader": false, "ar": [[2471.0, "وفي الحديث عن ابن عمر رضي الله عنهما قال:"], [2475.5, "قال النبيّ صلى الله عليه وسلم:"], [2478.2, "«أُمرتُ أن أقاتل الناسَ حتى يشهدوا أن لا إله إلا الله وأنّ محمّدًا رسولُ الله، ويقيموا الصلاة، ويؤتوا الزكاة، فإذا فعلوا ذلك» ـ أي ظاهرًا ـ «عصموا منّي دماءَهم وأموالَهم إلا بحقّ الإسلام، وحسابُهم على الله»."], [2495.0, "وفي حديث أبي عبد الله طارقِ بن أَشْيَم رضي الله عنه قال:"], [2501.4, "قال النبيّ صلى الله عليه وسلم:"], [2504.1, "«من قال: لا إله إلا الله، وكفر بما يُعبد من دون الله، حَرُم مالُه ودمُه، وحسابُه على الله عز وجل»."]], "tr": [[2471.0, "İbn Ömer radıyallâhu anhümâ'dan gelen hadiste şöyle dedi:"], [2475.5, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [2478.2, "\"Allah'tan başka ilâh olmadığına ve Muhammed'in Allah'ın Resûlü olduğuna şehadet edinceye, namazı kılıncaya ve zekâtı verinceye kadar insanlarla savaşmakla emrolundum."], [2487.5, "Bunu yaptıklarında\" —yani zahiren— \"İslâm'ın hakkı hariç kanlarını ve mallarını benden korumuş olurlar;"], [2495.0, "hesapları ise Allah'a aittir.\" Ebû Abdillah Târık b."], [2498.3, "Eşyem radıyallâhu anh hadisinde şöyle dedi:"], [2501.4, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [2504.1, "\"Kim 'Lâ ilâhe illallah' der ve Allah'tan başka ibadet edilenleri inkâr ederse, malı ve kanı haram olur;"], [2510.3, "hesabı ise Allah Azze ve Celle'ye aittir.\""]]}, {"reader": false, "ar": [[2513.0, "وفي حديث المقداد رضي الله عنه قال:"], [2516.9, "قلتُ: يا رسول الله،"], [2519.1, "أرأيتَ لو لقيتُ رجلًا من الكفّار فقاتلني،"], [2523.0, "فضرب إحدى يديّ بالسيف فقطعها،"], [2525.0, "ثم لاذ منّي بشجرةٍ فقال:"], [2527.1, "أسلمتُ لله، أفأقتله يا رسول الله بعد أن قالها؟"], [2531.0, "فقال النبيّ صلى الله عليه وسلم:"], [2533.2, "«لا تقتله». قال: قلتُ:"], [2534.9, "يا رسول الله، إنه قد قطع يدي،"], [2538.0, "ثم قالها بعد أن قطعها،"], [2540.5, "أفأقتله؟ قال: «لا تقتله، فإنك إن قتلتَه فهو بمنزلتك قبل أن تقتله، وأنت بمنزلته قبل أن يقول كلمتَه التي قال»."], [2550.0, "وهذا نصٌّ واضحٌ في أخذ الناس بالظاهر،"], [2553.2, "وتركِ السرائر إلى الله عز وجل."]], "tr": [[2513.0, "Mikdâd radıyallâhu anh hadisinde şöyle dedi:"], [2516.9, "\"Ey Allah'ın Resûlü! Ne dersin, kâfirlerden bir adamla karşılaşsam, benimle savaşsa, kılıçla ellerimden birine vurup onu kesse, sonra benden bir ağaca sığınıp 'Allah'a teslim oldum (Müslüman oldum)' dese, bunu söyledikten sonra onu öldüreyim mi, ey Allah'ın Resûlü?\" dedim."], [2531.0, "Peygamber sallallâhu aleyhi ve sellem \"Onu öldürme\" buyurdu."], [2533.2, "\"Ey Allah'ın Resûlü! O elimi kesti, sonra elimi kestikten sonra bunu söyledi;"], [2538.0, "onu öldüreyim mi?\" dedim. Buyurdu ki:"], [2541.0, "\"Onu öldürme. Eğer onu öldürürsen, o, sen onu öldürmeden önceki senin konumunda olur;"], [2546.2, "sen de onun, söylediği o sözü söylemeden önceki konumunda olursun.\" Bu, insanları zahire göre almak ve içlerini Allah Azze ve Celle'ye bırakmak hakkında açık bir nastır."]]}, {"reader": false, "ar": [[2556.0, "ولذلك يقول صلى الله عليه وسلم:"], [2558.0, "«إنّي لم أُومَر أن أُنقِّب عن قلوب الناس، ولا أشقَّ بطونَهم»؛"], [2563.0, "عملًا بماذا؟ بما يظهر لي منهم."], [2565.0, "وقد بعث النبيّ صلى الله عليه وسلم أسامةَ بنَ زيدٍ في سريّةٍ إلى الحُرَقات من جُهَينة،"], [2572.0, "قال: فهزمنا القومَ، فلحقتُ أنا ورجلٌ من الأنصار رجلًا منهم،"], [2581.0, "فلمّا رأى شعاعَ السيف قال:"], [2583.1, "لا إله إلا الله ـ أو قال:"], [2585.7, "أسلمتُ لله ـ فكفّ صاحبي الأنصاريُّ عنه،"], [2588.3, "وعلوتُه بالسيف حتى بَرَد."]], "tr": [[2556.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [2558.0, "\"Ben insanların kalplerini araştırmakla ve karınlarını yarmakla emrolunmadım.\" Neye göre amel ederek?"], [2563.0, "Bana onlardan görünene göre. Peygamber sallallâhu aleyhi ve sellem Üsâme b."], [2565.0, "Zeyd'i bir seriyye ile Cüheyne'nin Hurakât (kolu) üzerine gönderdi."], [2568.9, "(Üsâme) şöyle dedi: \"O topluluğu bozguna uğrattık."], [2572.9, "Ben ve Ensâr'dan bir adam, onlardan bir adama yetiştik."], [2580.3, "Kılıcın parıltısını görünce 'Lâ ilâhe illallah' dedi —ya da 'Allah'a teslim oldum' dedi—."], [2585.7, "Ensârî arkadaşım ondan elini çekti;"], [2587.0, "ben ise onu kılıçla vurdum, nihayet (öldü ve) soğudu.\""]]}, {"reader": false, "ar": [[2590.0, "فجاء الخبرُ إلى النبيّ صلى الله عليه وسلم فقال:"], [2593.3, "«يا أسامة، أقتلتَه بعد أن قال: لا إله إلا الله؟» قال:"], [2597.5, "قلتُ: يا رسول الله،"], [2599.6, "كان متعوّذًا. قال: «أفلا شققتَ عن قلبه حتى تعلمَ أقالها أم لا؟ كيف تفعل بلا إله إلا الله إذا جاءت يوم القيامة؟» الحديثُ متّفقٌ عليه."], [2612.0, "فيجب علينا ألّا نتّهم أحدًا بالنفاق ولا بالزندقة ما لم يظهر لنا شيءٌ من ذلك،"], [2620.0, "وإنما نأخذ الناسَ بما يظهر لنا منهم،"], [2623.2, "ونترك سرائرَهم إلى الله عز وجل. والله أعلم."]], "tr": [[2590.0, "Haber Peygamber sallallâhu aleyhi ve sellem'e ulaştı."], [2592.2, "Şöyle buyurdu: \"Ey Üsâme! 'Lâ ilâhe illallah' dedikten sonra mı onu öldürdün?\" (Üsâme) dedi ki:"], [2597.5, "\"Ey Allah'ın Resûlü! O (bu sözü) sığınmak için söyledi.\" Buyurdu ki:"], [2600.7, "\"Onu söyleyip söylemediğini bilmek için kalbini yarsaydın ya!"], [2605.5, "Kıyamet günü Lâ ilâhe illallah geldiğinde ne yapacaksın?\" Hadis müttefakun aleyhtir."], [2612.0, "Bize, kendisinden buna dair bir şey görünmedikçe hiç kimseyi nifak ve zındıklıkla itham etmememiz vâciptir."], [2619.2, "Biz insanları ancak bize onlardan görünene göre alırız, içlerini Allah Azze ve Celle'ye bırakırız. Allah en iyisini bilir."]]}]}, {"ts": "43:47", "title": "9. Külliye: Kur'an'daki her nifak ile büyük nifak kastedilir", "paras": [{"reader": false, "ar": [[2627.0, "ومن الكلّيّات أيضًا: <b>كلُّ نفاقٍ في القرآن فيُراد به الأكبر.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[2627.0, "Külliyelerden biri de şudur: 9."], [2628.5, "külliye: Kur'an'daki her nifak ile büyük nifak kastedilir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[2644.0, "وهذا على حسب استقراء آيات القرآن التي وردت في النفاق والمنافقين؛"], [2650.0, "فإنّ الله عز وجل إنما يخاطب بها من وقع نفاقُه في أصل ما يدخل به العبدُ في الإسلام،"], [2657.0, "كقول الله عز وجل:"], [2658.7, "<span class=\"ayah\">﴿وَإِذَا قِيلَ لَهُمْ تَعَالَوْا إِلَىٰ مَا أَنزَلَ اللَّهُ وَإِلَى الرَّسُولِ رَأَيْتَ الْمُنَافِقِينَ يَصُدُّونَ عَنكَ صُدُودًا﴾<\/span> <span class=\"ref\">[النساء: ٦١]<\/span>،"], [2665.2, "وهي في النفاق الأكبر."], [2667.0, "نستعرض شيئًا من الآيات فقط."]], "tr": [[2644.0, "Bu, Kur'an'ın nifak ve münafıklar hakkında gelen ayetlerinin tümevarımla incelenmesine göredir."], [2650.0, "Çünkü Allah Azze ve Celle bu ayetlerle ancak nifakı, kulun İslâm'a kendisiyle girdiği aslî hususta meydana gelen kimseye hitap eder."], [2656.2, "Allah Azze ve Celle'nin şu sözü gibi:"], [2658.7, "<span class=\"ayah\">﴿Onlara \"Allah'ın indirdiğine ve Resûl'e gelin\" denildiğinde, münafıkların senden büsbütün yüz çevirdiklerini görürsün﴾<\/span> [Nisâ 61]."], [2664.8, "Bu, büyük nifak hakkındadır. Ayetlerden sadece bir kısmını gözden geçirelim."]]}, {"reader": false, "ar": [[2669.0, "وكقول الله عز وجل:"], [2670.8, "<span class=\"ayah\">﴿فَمَا لَكُمْ فِي الْمُنَافِقِينَ فِئَتَيْنِ﴾<\/span> <span class=\"ref\">[النساء: ٨٨]<\/span>،"], [2673.0, "أي الأكبر. <span class=\"ayah\">﴿بَشِّرِ الْمُنَافِقِينَ بِأَنَّ لَهُمْ عَذَابًا أَلِيمًا﴾<\/span> <span class=\"ref\">[النساء: ١٣٨]<\/span>،"], [2677.0, "أي الأكبر. <span class=\"ayah\">﴿وَقَدْ نَزَّلَ عَلَيْكُمْ فِي الْكِتَابِ أَنْ إِذَا سَمِعْتُمْ آيَاتِ اللَّهِ يُكْفَرُ بِهَا وَيُسْتَهْزَأُ بِهَا فَلَا تَقْعُدُوا مَعَهُمْ حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ ۚ إِنَّكُمْ إِذًا مِّثْلُهُمْ ۗ إِنَّ اللَّهَ جَامِعُ الْمُنَافِقِينَ وَالْكَافِرِينَ فِي جَهَنَّمَ جَمِيعًا﴾<\/span> <span class=\"ref\">[النساء: ١٤٠]<\/span>،"], [2691.1, "أي الأكبر. <span class=\"ayah\">﴿إِنَّ الْمُنَافِقِينَ يُخَادِعُونَ اللَّهَ وَهُوَ خَادِعُهُمْ﴾<\/span> <span class=\"ref\">[النساء: ١٤٢]<\/span>،"], [2695.0, "أي الأكبر. <span class=\"ayah\">﴿إِنَّ الْمُنَافِقِينَ فِي الدَّرْكِ الْأَسْفَلِ مِنَ النَّارِ﴾<\/span> <span class=\"ref\">[النساء: ١٤٥]<\/span>، أي الأكبر."]], "tr": [[2669.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [2670.8, "<span class=\"ayah\">﴿Size ne oluyor da münafıklar hakkında iki gruba ayrıldınız?﴾<\/span> [Nisâ 88];"], [2674.0, "yani büyük (nifak). <span class=\"ayah\">﴿Münafıklara, kendileri için elem verici bir azap olduğunu müjdele﴾<\/span> [Nisâ 138];"], [2678.0, "yani büyük. <span class=\"ayah\">﴿O, Kitap'ta size şunu indirmiştir: Allah'ın ayetlerinin inkâr edildiğini ve onlarla alay edildiğini işittiğinizde, onlar başka bir söze dalıncaya kadar yanlarında oturmayın; yoksa siz de onlar gibi olursunuz. Şüphesiz Allah münafıkları ve kâfirleri cehennemde toplayacaktır﴾<\/span> [Nisâ 140];"], [2690.2, "yani büyük. <span class=\"ayah\">﴿Şüphesiz münafıklar Allah'ı aldatmaya çalışırlar; oysa O, onların aldatmalarını başlarına geçirendir﴾<\/span> [Nisâ 142];"], [2696.0, "yani büyük. <span class=\"ayah\">﴿Şüphesiz münafıklar ateşin en alt tabakasındadırlar﴾<\/span> [Nisâ 145]; yani büyük."]]}, {"reader": false, "ar": [[2700.1, "<span class=\"ayah\">﴿الْمُنَافِقُونَ وَالْمُنَافِقَاتُ بَعْضُهُم مِّن بَعْضٍ﴾<\/span> <span class=\"ref\">[التوبة: ٦٧]<\/span>،"], [2702.9, "أي الأكبر. <span class=\"ayah\">﴿وَعَدَ اللَّهُ الْمُنَافِقِينَ وَالْمُنَافِقَاتِ وَالْكُفَّارَ نَارَ جَهَنَّمَ خَالِدِينَ فِيهَا ۚ هِيَ حَسْبُهُمْ ۚ وَلَعَنَهُمُ اللَّهُ ۖ وَلَهُمْ عَذَابٌ مُّقِيمٌ﴾<\/span> <span class=\"ref\">[التوبة: ٦٨]<\/span>؛"], [2712.8, "أي دائم، وهو الأكبر."], [2715.0, "<span class=\"ayah\">﴿وَلَيَعْلَمَنَّ اللَّهُ الَّذِينَ آمَنُوا وَلَيَعْلَمَنَّ الْمُنَافِقِينَ﴾<\/span> <span class=\"ref\">[العنكبوت: ١١]<\/span>،"], [2719.3, "أي النفاقَ الأكبر. <span class=\"ayah\">﴿لِّيَجْزِيَ اللَّهُ الصَّادِقِينَ بِصِدْقِهِمْ وَيُعَذِّبَ الْمُنَافِقِينَ﴾<\/span> <span class=\"ref\">[الأحزاب: ٢٤]<\/span>،"], [2727.0, "أي الأكبر. <span class=\"ayah\">﴿لِّيُعَذِّبَ اللَّهُ الْمُنَافِقِينَ وَالْمُنَافِقَاتِ﴾<\/span> <span class=\"ref\">[الأحزاب: ٧٣]<\/span>، أي الأكبر."]], "tr": [[2700.1, "<span class=\"ayah\">﴿Münafık erkekler ve münafık kadınlar birbirlerindendir﴾<\/span> [Tevbe 67];"], [2702.3, "yani büyük. <span class=\"ayah\">﴿Allah münafık erkeklere, münafık kadınlara ve kâfirlere, içinde ebedî kalacakları cehennem ateşini vaat etmiştir. O onlara yeter. Allah onlara lanet etmiştir; onlar için sürekli bir azap vardır﴾<\/span> [Tevbe 68];"], [2712.8, "yani devamlı; bu da büyük (nifaktır)."], [2715.0, "<span class=\"ayah\">﴿Andolsun Allah iman edenleri de bilecek (ortaya çıkaracak), münafıkları da bilecek﴾<\/span> [Ankebût 11];"], [2723.0, "yani büyük nifak. <span class=\"ayah\">﴿Allah sadıklara sadakatlerinin karşılığını versin ve münafıklara azap etsin diye﴾<\/span> [Ahzâb 24];"], [2729.0, "yani büyük. <span class=\"ayah\">﴿Allah münafık erkeklere ve münafık kadınlara azap etsin diye﴾<\/span> [Ahzâb 73]; yani büyük."]]}, {"reader": false, "ar": [[2734.0, "وفي أوّل سورة الحجرات… <span class=\"ayah\">﴿إِذَا جَاءَكَ﴾<\/span>… في أوّل سورة المنافقون:"], [2744.0, "<span class=\"ayah\">﴿إِذَا جَاءَكَ الْمُنَافِقُونَ قَالُوا نَشْهَدُ إِنَّكَ لَرَسُولُ اللَّهِ ۗ وَاللَّهُ يَعْلَمُ إِنَّكَ لَرَسُولُهُ وَاللَّهُ يَشْهَدُ إِنَّ الْمُنَافِقِينَ لَكَاذِبُونَ﴾<\/span> <span class=\"ref\">[المنافقون: ١]<\/span>،"], [2754.0, "أي الأكبر. <span class=\"ayah\">﴿يَقُولُونَ لَئِن رَّجَعْنَا إِلَى الْمَدِينَةِ لَيُخْرِجَنَّ الْأَعَزُّ مِنْهَا الْأَذَلَّ ۚ وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ وَلَٰكِنَّ الْمُنَافِقِينَ لَا يَعْلَمُونَ﴾<\/span> <span class=\"ref\">[المنافقون: ٨]<\/span>،"], [2763.8, "أي الأكبر. <span class=\"ayah\">﴿إِذْ يَقُولُ الْمُنَافِقُونَ وَالَّذِينَ فِي قُلُوبِهِم مَّرَضٌ غَرَّ هَٰؤُلَاءِ دِينُهُمْ﴾<\/span> <span class=\"ref\">[الأنفال: ٤٩]<\/span>، أي الأكبر."]], "tr": [[2734.0, "Hucurât sûresinin başında… <span class=\"ayah\">﴿Sana geldiklerinde﴾<\/span>… Münâfikûn sûresinin başında:"], [2741.0, "<span class=\"ayah\">﴿Münafıklar sana geldiklerinde \"Şahitlik ederiz ki sen elbette Allah'ın Resûlüsün\" derler. Allah da biliyor ki sen elbette O'nun Resûlüsün. Allah şahitlik eder ki münafıklar kesinlikle yalancıdırlar﴾<\/span> [Münâfikûn 1];"], [2754.0, "yani büyük. <span class=\"ayah\">﴿\"Andolsun, eğer Medine'ye dönersek, izzetli olan zelil olanı oradan mutlaka çıkaracaktır\" diyorlar. Hâlbuki izzet Allah'ın, Resûlü'nün ve müminlerindir; fakat münafıklar bilmezler﴾<\/span> [Münâfikûn 8];"], [2765.0, "yani büyük. <span class=\"ayah\">﴿Hani münafıklar ve kalplerinde hastalık bulunanlar \"Bunları dinleri aldattı\" diyorlardı﴾<\/span> [Enfâl 49]; yani büyük."]]}, {"reader": false, "ar": [[2770.0, "وهكذا في آياتٍ كثيرة لا نريد الإطالةَ عليكم بها."], [2774.0, "ومن باب الفائدة: فإنّ كلَّ شركٍ ذُكر في القرآن فهو الأكبر،"], [2779.0, "وكلَّ كفرٍ ذُكر في القرآن فهو الأكبر،"], [2782.0, "وكلَّ نفاقٍ ذُكر في القرآن فهو الأكبر،"], [2787.0, "وإنما الأصغرُ أدلّتُه في السنة."]], "tr": [[2770.0, "Bunu uzatmak istemediğimiz pek çok ayette de böyledir."], [2774.0, "Faydalı bir bilgi olarak: Kur'an'da zikredilen her şirk büyük şirktir, Kur'an'da zikredilen her küfür büyük küfürdür, Kur'an'da zikredilen her nifak büyük nifaktır."], [2786.3, "Küçük olanın delilleri ise sünnettedir."]]}]}, {"ts": "46:31", "title": "10. Külliye: Kur'an'daki her kalp hastalığı ile nifak ve iman zayıflığı kastedilir · Dersin kapanışı", "paras": [{"reader": false, "ar": [[2791.0, "ومن الكلّيّات أيضًا: <b>كلُّ مرضٍ للقلوب في القرآن فيُراد به النفاقُ وضعفُ الإيمان.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[2791.0, "Külliyelerden biri de şudur: 10."], [2796.0, "külliye: Kur'an'daki her kalp hastalığı ile nifak ve iman zayıflığı kastedilir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[2825.0, "وذلك لأنّ مرض القلوب قد يخصّ به أهلَ النفاق في الآية،"], [2832.0, "فيُراد به مرضُ النفاق،"], [2836.0, "ولكن أحيانًا يقرن اللهُ بين المنافقين والذين في قلوبهم مرض،"], [2842.0, "فيكون معناها ضعفاءَ الإيمان،"], [2846.0, "فيكون معناها ضعفاءَ الإيمان."], [2849.0, "كما في قوله عز وجل:"], [2851.0, "<span class=\"ayah\">﴿أَفِي قُلُوبِهِم مَّرَضٌ أَمِ ارْتَابُوا أَمْ يَخَافُونَ أَن يَحِيفَ اللَّهُ عَلَيْهِمْ وَرَسُولُهُ﴾<\/span> <span class=\"ref\">[النور: ٥٠]<\/span>؛"], [2856.0, "فالمرادُ بمرض القلوب هنا مرضُ النفاق."]], "tr": [[2825.0, "Bu şundandır: Kalp hastalığı ile ayette bazen (sadece) nifak ehli kastedilir;"], [2833.7, "bu durumda onunla nifak hastalığı kastedilir."], [2839.6, "Fakat Allah bazen münafıklarla kalplerinde hastalık bulunanları birlikte zikreder;"], [2849.0, "bu durumda manası iman bakımından zayıf olanlardır, yani manası iman bakımından zayıf olanlardır."], [2849.8, "Nitekim Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [2851.0, "<span class=\"ayah\">﴿Kalplerinde bir hastalık mı var, yoksa şüpheye mi düştüler, yoksa Allah'ın ve Resûlü'nün kendilerine haksızlık edeceğinden mi korkuyorlar?﴾<\/span> [Nûr 50]."], [2856.5, "Burada kalplerin hastalığından maksat nifak hastalığıdır."]]}, {"reader": false, "ar": [[2859.0, "وكقول الله عز وجل:"], [2861.3, "<span class=\"ayah\">﴿فِي قُلُوبِهِم مَّرَضٌ فَزَادَهُمُ اللَّهُ مَرَضًا﴾<\/span> <span class=\"ref\">[البقرة: ١٠]<\/span>،"], [2866.0, "والمقصود هنا مرضُ النفاق."], [2868.0, "وكقول الله عز وجل:"], [2870.0, "<span class=\"ayah\">﴿فَتَرَى الَّذِينَ فِي قُلُوبِهِم مَّرَضٌ يُسَارِعُونَ فِيهِمْ﴾<\/span> <span class=\"ref\">[المائدة: ٥٢]<\/span>،"], [2874.6, "أي مرضُ النفاق. لكن في قوله عز وجل:"], [2880.0, "<span class=\"ayah\">﴿إِذْ يَقُولُ الْمُنَافِقُونَ وَالَّذِينَ فِي قُلُوبِهِم مَّرَضٌ غَرَّ هَٰؤُلَاءِ دِينُهُمْ﴾<\/span> <span class=\"ref\">[الأنفال: ٤٩]<\/span> فيُراد بها ضعفُ الإيمان."]], "tr": [[2859.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [2861.9, "<span class=\"ayah\">﴿Kalplerinde bir hastalık vardır; Allah da hastalıklarını artırmıştır﴾<\/span> [Bakara 10]."], [2868.0, "Burada kastedilen nifak hastalığıdır. Allah Azze ve Celle'nin şu sözü gibi:"], [2871.8, "<span class=\"ayah\">﴿Kalplerinde hastalık bulunanların onların arasına koştuklarını görürsün﴾<\/span> [Mâide 52];"], [2877.0, "yani nifak hastalığı. Fakat Allah Azze ve Celle'nin <span class=\"ayah\">﴿Hani münafıklar ve kalplerinde hastalık bulunanlar \"Bunları dinleri aldattı\" diyorlardı﴾<\/span> [Enfâl 49] sözünde onunla iman zayıflığı kastedilir."]]}, {"reader": false, "ar": [[2888.0, "وقال الله عز وجل:"], [2892.0, "<span class=\"ayah\">﴿وَأَمَّا الَّذِينَ فِي قُلُوبِهِم مَّرَضٌ فَزَادَتْهُمْ رِجْسًا إِلَىٰ رِجْسِهِمْ﴾<\/span> <span class=\"ref\">[التوبة: ١٢٥]<\/span>،"], [2897.0, "أي مرضُ النفاق. وكقوله عز وجل:"], [2900.0, "<span class=\"ayah\">﴿لِّيَجْعَلَ مَا يُلْقِي الشَّيْطَانُ فِتْنَةً لِّلَّذِينَ فِي قُلُوبِهِم مَّرَضٌ وَالْقَاسِيَةِ قُلُوبُهُمْ﴾<\/span> <span class=\"ref\">[الحج: ٥٣]<\/span>،"], [2906.0, "أي المنافقون والكفّار. وكقول الله عز وجل:"], [2911.0, "<span class=\"ayah\">﴿وَإِذْ يَقُولُ الْمُنَافِقُونَ وَالَّذِينَ فِي قُلُوبِهِم مَّرَضٌ مَّا وَعَدَنَا اللَّهُ وَرَسُولُهُ إِلَّا غُرُورًا﴾<\/span> <span class=\"ref\">[الأحزاب: ١٢]<\/span>، أي ضعفُ الإيمان."]], "tr": [[2888.0, "Allah Azze ve Celle şöyle buyurdu:"], [2892.0, "<span class=\"ayah\">﴿Kalplerinde hastalık bulunanlara gelince, (o sûre) onların pisliklerine pislik katmıştır﴾<\/span> [Tevbe 125];"], [2896.2, "yani nifak hastalığı. Allah Azze ve Celle'nin şu sözü gibi:"], [2900.0, "<span class=\"ayah\">﴿(Bu,) şeytanın attığı şeyi kalplerinde hastalık bulunanlar ve kalpleri katılaşmış olanlar için bir imtihan kılması içindir﴾<\/span> [Hac 53];"], [2908.0, "yani münafıklar ve kâfirler. Allah Azze ve Celle'nin şu sözü gibi:"], [2913.0, "<span class=\"ayah\">﴿Hani münafıklar ve kalplerinde hastalık bulunanlar \"Allah ve Resûlü bize sadece aldatmaca vaat etmiş\" diyorlardı﴾<\/span> [Ahzâb 12]; yani iman zayıflığı."]]}, {"reader": false, "ar": [[2920.0, "وقولِ الله عز وجل:"], [2922.0, "<span class=\"ayah\">﴿يَا نِسَاءَ النَّبِيِّ لَسْتُنَّ كَأَحَدٍ مِّنَ النِّسَاءِ ۚ إِنِ اتَّقَيْتُنَّ فَلَا تَخْضَعْنَ بِالْقَوْلِ فَيَطْمَعَ الَّذِي فِي قَلْبِهِ مَرَضٌ﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٢]<\/span>،"], [2930.0, "أي مرضُ ضعف الإيمان."], [2933.0, "وقولِ الله عز وجل:"], [2936.0, "<span class=\"ayah\">﴿لَّئِن لَّمْ يَنتَهِ الْمُنَافِقُونَ وَالَّذِينَ فِي قُلُوبِهِم مَّرَضٌ﴾<\/span> <span class=\"ref\">[الأحزاب: ٦٠]<\/span>،"], [2939.0, "أي ضعفاءُ الإيمان. إلى آياتٍ كثيرة."]], "tr": [[2920.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [2922.0, "<span class=\"ayah\">﴿Ey Peygamber'in hanımları! Siz kadınlardan herhangi biri gibi değilsiniz. Eğer takvâ sahibi iseniz, (yabancılara karşı) sözü yumuşak ve çekici bir eda ile söylemeyin; yoksa kalbinde hastalık bulunan kimse ümide kapılır﴾<\/span> [Ahzâb 32];"], [2930.8, "yani iman zayıflığı hastalığı. Allah Azze ve Celle'nin şu sözü gibi:"], [2936.0, "<span class=\"ayah\">﴿Andolsun, eğer münafıklar ve kalplerinde hastalık bulunanlar (yaptıklarına) son vermezlerse﴾<\/span> [Ahzâb 60];"], [2938.6, "yani iman bakımından zayıf olanlar."], [2940.0, "Daha pek çok ayet vardır."]]}, {"reader": false, "ar": [[2942.0, "فمتى ما رأيتَ اللهَ يصف القلوبَ بالمرض،"], [2945.0, "فاعلمْ أنه دائرٌ بين مرض النفاق ومرض ضعف الإيمان."], [2950.0, "وأظنّ أننا انتهينا… هذه العاشرة."], [2954.0, "سبحان الله! طيّب، ولعلّنا نكتفي بهذا القدر،"], [2957.0, "والله أعلى وأعلم، وصلّى الله وسلّم."]], "tr": [[2942.0, "Allah'ın kalpleri hastalıkla nitelediğini gördüğünde, bunun nifak hastalığı ile iman zayıflığı hastalığı arasında döndüğünü bil."], [2947.8, "Sanırım bitirdik… Bu onuncusuydu. Sübhânallah!"], [2950.0, "Peki, inşallah bu kadarıyla yetinelim."], [2954.0, "Allah en yüce olan ve en iyi bilendir."], [2957.3, "Allah salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
