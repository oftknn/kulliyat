(Adam) dönüp gidince onu çağırdı ve \"Benim babam da senin baban da ateştedir\" buyurdu."], [2611.0, "<span class=\"note\">(Müslim)<\/span> Sâlih kimse kötü kimseye bir fayda sağlamaz;"], [2614.6, "sâlihlerin akrabalığı da ancak sahih iman, saf tevhid ve makbul amel üzerine kurulu olduğunda fayda verir."], [2623.0, "Sâlihlerden birinin sana yakın olması seni asla aldatmasın."]]}, {"reader": false, "ar": [[2630.0, "وهناك أسبابٌ كثيرةٌ هي التي تحمل الإنسانَ على أن يأمن من مكر الله عز وجل،"], [2639.0, "فهذه من جملة الكبائر التي يجب الحذرُ منها."], [2645.0, "فإن قلتَ: هل يعني كلامُك هذا ألّا نأمن اللهَ أبدًا؟"], [2651.0, "الجواب: بلى، بل هو مصدرُ الأمن والأمان،"], [2654.0, "ولكن إنما أحارب صورةً من صور الأمن،"], [2660.0, "وهي الأمنُ الذي يحملك على مخالفة الله عز وجل في ترك مأمورٍ أو الوقوع في محظور."], [2668.0, "فهذا هو الأمنُ الذي نحاربه ونحذّر منه،"], [2674.0, "ودلّت الأدلّةُ التي ذكرتُ طرفًا منها في الكلّيّة السابقة على أنه من جملة الكبائر."]], "tr": [[2630.0, "İnsanı Allah Azze ve Celle'nin mekrinden emin olmaya sevk eden daha birçok sebep vardır."], [2639.7, "Bu, sakınılması vacip olan büyük günahlardandır."], [2645.0, "Eğer \"Bu sözün, Allah'tan asla emin olmayacağımız anlamına mı geliyor?\" dersen, cevap:"], [2649.4, "Hayır (biz O'ndan emin oluruz);"], [2651.0, "bilakis O, emniyetin ve güvenin kaynağıdır."], [2653.1, "Ama ben emniyetin sadece bir şeklini reddediyorum:"], [2657.7, "Seni bir emri terk etmekte ya da bir yasağa düşmekte Allah Azze ve Celle'ye muhalefet etmeye sevk eden emniyet."], [2668.0, "İşte reddettiğimiz ve sakındırdığımız emniyet budur."], [2674.0, "Önceki külliyede bir kısmını zikrettiğim deliller onun büyük günahlardan olduğunu göstermiştir."]]}]}, {"ts": "44:42", "title": "9. Külliye: Hem ibadet olarak hem de başka şekilde vuku bulan bir şeyle ancak itikadî-taabbudî yönünde tekfir edilir", "paras": [{"reader": false, "ar": [[2682.0, "ومن الكلّيّات أيضًا ـ كم رقم عندكم؟"], [2686.0, "ـ هذه الكلّيّة التي سأذكرها أريدكم أن تفهموها أوّلًا،"], [2694.7, "اكتبوا رأسها: <b>كلُّ ما يقع على وجه التعبُّد وغيره فلا يُكفَّر به إلا في جانبه الاعتقاديّ التعبُّديّ.<\/b> أُعيدها مرةً أخرى:"], [2719.0, "<b>كلُّ ما يقع على وجه التعبُّد وغيره فلا يُكفَّر به إلا في جانبه الاعتقاديّ التعبُّديّ.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2682.0, "Külliyelerden biri de şudur —sizde kaç numara?— Zikredeceğim bu külliyeyi önce anlamanızı istiyorum;"], [2695.0, "başlığını yazın: <b>9. külliye: Hem taabbud yoluyla hem de başka şekilde vuku bulan her şeyle, ancak onun itikadî ve taabbudî yönünde tekfir edilir.<\/b> Bir kez daha tekrar ediyorum:"], [2719.0, "<b>9. külliye: Hem taabbud yoluyla hem de başka şekilde vuku bulan her şeyle, ancak onun itikadî ve taabbudî yönünde tekfir edilir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2725.0, "أقول وبالله التوفيق: إنّ ممّا مضى في الكلّيّات السابقة في توحيد الألوهية:"], [2732.0, "ذكرتُ لكم أنواعًا من التعبُّدات لا تكون عبادةً في كلّ صورها،"], [2738.0, "وإنما لا تكون عبادةً إلا إذا قُرنت بجانب التعبُّد والاعتقاد،"], [2744.0, "وأمّا في جوانبها الأخرى التي لا تعلُّقَ لها بجانب الاعتقاد والتعبُّد فإنها تكون أمرًا جائزًا لا بأس به."], [2751.0, "أليس كذلك؟ الجواب: بلى."]], "tr": [[2725.0, "Tevfik Allah'tandır, derim ki: Ulûhiyyet tevhidine dair önceki külliyelerde geçenlerden biri şudur:"], [2732.0, "Size, her suretinde ibadet olmayan, ancak taabbud ve itikad yönüyle birleştiğinde ibadet olan birtakım taabbud türlerini zikretmiştim."], [2743.4, "İtikad ve taabbud yönüyle ilgisi olmayan diğer yönlerinde ise sakıncası olmayan caiz bir şey olur."], [2751.0, "Öyle değil mi? Cevap: Evet, öyle."]]}, {"reader": false, "ar": [[2754.0, "فذكرتُ لكم ممّا مضى دعاءَ المسألة؛"], [2759.0, "فإنك إذا دعوتَ مخلوقًا حاضرًا في أمرٍ يقدر عليه فإنّ هذا ليس جانبًا تعبُّديًّا قد صرفتَه لغير الله عز وجل،"], [2768.0, "ولكن لا يكون الدعاءُ عبادةً لا يجوز صرفُها لغير الله إلا إذا دعوتَ مخلوقًا في أمرٍ لا يقدر عليه إلا الله عز وجل؛"], [2779.0, "فهذا هو جانبُ دعاء المسألة التعبُّديّ."], [2784.0, "فلا يكون دعاءُ المسألة كفرًا إلا في جانبه التعبُّديّ الاعتقاديّ."]], "tr": [[2754.0, "Geçmişte size istek duasını zikretmiştim."], [2759.0, "Hazır olan bir mahlûka gücünün yettiği bir işte dua edersen (ondan istersen), bu, Allah Azze ve Celle'den başkasına yönelttiğin taabbudî bir yön değildir."], [2768.6, "Ama dua, ancak sadece Allah Azze ve Celle'nin gücü yettiği bir şeyde bir mahlûka dua ettiğinde, Allah'tan başkasına yöneltilmesi caiz olmayan bir ibadet olur."], [2779.0, "İşte bu, istek duasının taabbudî yönüdür."], [2784.0, "Dolayısıyla istek duası ancak taabbudî ve itikadî yönünde küfür olur."]]}, {"reader": false, "ar": [[2790.0, "وممّا ذكرتُه أيضًا: الاستغاثة؛"], [2794.0, "فإنّ الاستغاثة بالحيّ الحاضر القادر فيما يُستغاث فيه هذا ليس جانبًا تعبُّديًّا في هذا الأمر،"], [2805.0, "ولكن لو استغثتَ بغير الله عز وجل في الأمر الذي لا يقدر عليه إلا الله،"], [2811.0, "فالاستغاثةُ في هذا الجانب الاعتقاديّ التعبُّديّ هي التي تكون شركًا وكفرًا."], [2817.0, "وممّا ذكرتُه لكم أيضًا:"], [2820.2, "الاستعانة؛ فإنك إذا استعنتَ بغير الله عز وجل في الأمر الذي لا يقدر عليه إلا الله،"], [2826.0, "فالاستعانةُ بهذا الجانب الاعتقاديّ التعبُّديّ هي التي تُعتبر شركًا فيما لو صرفتَها لغير الله عز وجل،"], [2834.0, "ولكن لو استعنتَ بغير الله في الأمر المقدور عليه فإنّ ذلك لا يُعتبر من التوحيد،"], [2840.0, "ولا يُعتبر من صرف شيءٍ من أنواع العبادة لغير الله."]], "tr": [[2790.0, "Zikrettiğim şeylerden biri de istiğâsedir (imdat istemek)."], [2792.6, "İmdat istenen şeyde gücü yeten, hazır olan diriden imdat istemek, bu işte taabbudî bir yön değildir."], [2805.4, "Ama sadece Allah'ın gücü yettiği bir şeyde Allah Azze ve Celle'den başkasından imdat istersen, işte bu itikadî ve taabbudî yöndeki istiğâse şirk ve küfür olur."], [2820.2, "Size zikrettiğim şeylerden biri de istiânedir (yardım istemek)."], [2823.0, "Sadece Allah'ın gücü yettiği bir şeyde Allah Azze ve Celle'den başkasından yardım istersen, Allah Azze ve Celle'den başkasına yönelttiğin takdirde şirk sayılan, bu itikadî ve taabbudî yöndeki istiânedir."], [2835.3, "Ama gücü yetilen bir şeyde Allah'tan başkasından yardım istersen, bu tevhid (meselesinden) sayılmaz ve ibadet türlerinden bir şeyi Allah'tan başkasına yöneltmekten sayılmaz."]]}, {"reader": false, "ar": [[2844.0, "وممّا ذكرتُه أيضًا: الخوفُ الجبلّيُّ الطبعيّ؛"], [2848.0, "فإذا خفتَ من غير الله في أمرٍ سببيّتُه ظاهرةٌ متحقّقة فلا تُعتبر صارفًا لشيءٍ من مقتضيات توحيد الألوهية لغير الله،"], [2858.0, "لكن لو أنك خفتَ من غير الله في أمرٍ لا يقدر عليه إلا الله،"], [2862.0, "وسببيّتُه خفيّةٌ غيرُ ظاهرة،"], [2865.0, "فهذا الخوفُ هو الذي يُعتبر صرفُه لغير الله عز وجل من الشرك."], [2870.0, "وخلاصةُ ما أريد أن أقوله لكم:"], [2875.0, "أنّ ما ينقسم إلى تعبُّدٍ وغير تعبُّد لا يجوز أن نُطلق التكفيرَ به إلا بالتفصيل،"], [2888.0, "فلا نجعله مؤثّرًا في التوحيد إلا في جانبه الاعتقاديّ التعبُّديّ."]], "tr": [[2844.0, "Zikrettiğim şeylerden biri de fıtrî, tabiî korkudur."], [2848.0, "Sebebiyeti açık ve gerçekleşmiş bir işte Allah'tan başkasından korkarsan, ulûhiyyet tevhidinin gereklerinden bir şeyi Allah'tan başkasına yönelten biri sayılmazsın."], [2856.8, "Ama sadece Allah'ın gücü yettiği ve sebebiyeti açık olmayıp gizli olan bir şeyde Allah'tan başkasından korkarsan, işte Allah Azze ve Celle'den başkasına yöneltilmesi şirkten sayılan korku budur."], [2867.9, "Size söylemek istediğimin özeti şudur:"], [2870.0, "Taabbud olan ve taabbud olmayan diye ikiye ayrılan bir şeyle ancak tafsilatla tekfir edebiliriz, onunla mutlak olarak tekfir etmek caiz değildir."], [2884.0, "Onu ancak itikadî ve taabbudî yönünde tevhide tesir eden bir şey sayarız."]]}]}, {"ts": "48:15", "title": "10. Külliye: Sadece ibadet olarak vuku bulan şeyi Allah'tan başkasına yöneltmek mutlak olarak şirktir", "paras": [{"reader": false, "ar": [[2895.0, "ويوضّح ذلك الكلّيّةُ الأخيرة:"], [2898.0, "<b>كلُّ ما لا يقع إلا عبادةً فصرفُه لغير الله شركٌ مطلقًا.<\/b> واضحة؟"], [2911.0, "<b>كلُّ ما لا يقع إلا عبادةً فصرفُه لغير الله شركٌ مطلقًا.<\/b> أُعيدها مرةً أخرى:"], [2924.0, "<b>كلُّ ما لا يقع إلا عبادةً فصرفُه لغير الله شركٌ مطلقًا.<\/b>"]], "tr": [[2895.0, "Bunu son külliye açıklar: 10."], [2898.0, "külliye: Sadece ibadet olarak vuku bulan her şeyi Allah'tan başkasına yöneltmek mutlak olarak şirktir. Açık mı?"], [2911.0, "<b>10. külliye: Sadece ibadet olarak vuku bulan her şeyi Allah'tan başkasına yöneltmek mutlak olarak şirktir.<\/b> Bir kez daha tekrar ediyorum:"], [2924.0, "<b>10. külliye: Sadece ibadet olarak vuku bulan her şeyi Allah'tan başkasına yöneltmek mutlak olarak şirktir.<\/b>"]]}, {"reader": false, "ar": [[2934.0, "وهو الذي نعنيه بقولنا:"], [2937.1, "دعاءُ العبادة. فهذا النوعُ من العبادات ليس بمنقسمٍ إلى تعبُّدٍ وغير تعبُّد،"], [2945.0, "بل كلُّه من أوّله إلى آخره،"], [2949.1, "بكلّ أنواعه وجزئيّاته، يُسمّى عبادة."], [2954.0, "فهذا النوعُ هو الذي لا نفصّل فيه،"], [2958.0, "ولا نربط التكفيرَ به بالاعتقاد في المصروف له أنه موصوفٌ بشيءٍ من مقتضيات الربوبيّة أو الألوهية."]], "tr": [[2934.0, "Bu, \"ibadet duası\" sözümüzle kastettiğimiz şeydir."], [2937.1, "İbadetlerin bu türü, taabbud olan ve taabbud olmayan diye ikiye ayrılmaz;"], [2944.4, "bilakis baştan sona, bütün türleri ve cüz'î hâlleriyle tamamı ibadet diye adlandırılır."], [2954.0, "İşte tafsilat yapmadığımız ve onunla tekfir etmeyi, kendisine yöneltilen kimsenin rubûbiyyet ya da ulûhiyyet gereklerinden bir şeyle nitelendiğine dair itikada bağlamadığımız tür budur."]]}, {"reader": false, "ar": [[2976.0, "كالصلاة؛ فإذا صلّى الإنسانُ لغير الله عز وجل فلا نقول:"], [2982.0, "إن كان صلّى له كذا فلا بأس به،"], [2986.0, "وإن كان صلّى له كذا فمشرك؛"], [2989.0, "وإنما نقول: إنّ الصلاة لغير الله عز وجل من الشرك؛"], [2993.0, "لأنّ الصلاة لا تقع إلا عبادة،"], [2996.5, "فلا تنقسم إلى تعبُّدٍ وغير تعبُّد."], [3000.0, "وكالنذر؛ فإنه لا يقع إلا عبادة،"], [3006.0, "فمن نذر لغير الله عز وجل فيكون قد وقع في الشرك."]], "tr": [[2976.0, "Namaz gibi: İnsan Allah Azze ve Celle'den başkası için namaz kılarsa, \"Eğer onun için şöyle kıldıysa sakıncası yok, şöyle kıldıysa müşriktir\" demeyiz."], [2989.0, "Bilakis şöyle deriz: Allah Azze ve Celle'den başkası için namaz kılmak şirktendir."], [2993.0, "Çünkü namaz ancak ibadet olarak vuku bulur;"], [2995.9, "taabbud olan ve taabbud olmayan diye ikiye ayrılmaz."], [3000.0, "Adak gibi: O da ancak ibadet olarak vuku bulur;"], [3006.5, "Allah Azze ve Celle'den başkası için adakta bulunan kimse şirke düşmüş olur."]]}, {"reader": false, "ar": [[3011.2, "وكالحلف؛ فإنه عبادة، ليس منه حلفٌ ـ ليس منه:"], [3022.2, "حلفٌ بغير الله جائز،"], [3024.9, "وحلفٌ بغير الله لا يجوز ـ وإنما الحلفُ كلُّه بكلّ متعلّقاته عبادة؛"], [3032.0, "فمن حلف بغير الله فقد أشرك،"], [3034.4, "على التفصيل الذي سيأتينا إن شاء الله فيما بعد."], [3038.0, "وكالصيام؛ فمن صام متعبّدًا بهذا الصيام لغير الله عز وجل ـ فهو يريد بصيامه أن يتقرّب لغير الله ـ فإنّ هذا من الشرك الأكبر."], [3053.0, "وكالذين يعتكفون متقرّبين باعتكافهم للأولياء والصالحين،"], [3059.0, "فيمكثون الليالي ذواتِ العدد عند قبور الأولياء والصالحين اعتكافًا؛"], [3064.0, "فالاعتكافُ لا يقع إلا عبادة."]], "tr": [[3011.2, "Yemin gibi: O bir ibadettir;"], [3022.2, "onda \"Allah'tan başkası adına caiz yemin\" ve \"Allah'tan başkası adına caiz olmayan yemin\" diye bir ayrım yoktur."], [3032.0, "Bilakis yeminin tamamı bütün taalluklarıyla ibadettir."], [3033.6, "Allah'tan başkası adına yemin eden kimse şirk koşmuştur;"], [3036.0, "inşallah ileride bize gelecek olan tafsilat üzere."], [3038.0, "Oruç gibi: Bu orucuyla Allah Azze ve Celle'den başkasına taabbud ederek oruç tutan —yani orucuyla Allah'tan başkasına yaklaşmak isteyen— kimsenin bu yaptığı büyük şirktendir."], [3053.0, "İtikâflarıyla velîlere ve sâlihlere yaklaşmak isteyerek itikâfa giren, velîlerin ve sâlihlerin kabirleri yanında itikâf niyetiyle günlerce kalan kimseler gibi."], [3064.0, "İtikâf da ancak ibadet olarak vuku bulur."]]}, {"reader": false, "ar": [[3067.0, "وكالحجّ للقبور والمشاهد، كما يزعم بعضُ الطوائف بأنّ حجّةً إلى قبر فلانٍ وفلانٍ من الأولياء والصالحين أعظمُ عند الله عز وجل من ألف حجّةٍ لبيت الله الحرام."], [3082.0, "والحجُّ عبادةٌ بكلّ متعلّقاته،"], [3084.7, "لا يقع إلا قُربةً وتعبُّدًا؛"], [3088.0, "فمن قصد جهةً يقصد بها الحجَّ تعبُّدًا لهذه الجهة،"], [3095.0, "فلا جرمَ أنه يكون مشركًا،"], [3097.3, "خالعًا رِبقةَ الإسلام من عنقه بالكلّيّة."]], "tr": [[3067.0, "Kabirlere ve meşhedlere (türbelere) hac gibi."], [3072.5, "Nitekim bazı fırkalar, velîlerden ve sâlihlerden falan ve falanın kabrine bir haccın Allah Azze ve Celle katında Beytullâh-ı Harâm'a yapılan bin hacdan daha büyük olduğunu iddia ederler."], [3082.0, "Hac bütün taalluklarıyla bir ibadettir;"], [3084.0, "ancak kurbet ve taabbud olarak vuku bulur."], [3088.0, "Bir yeri, o yere taabbud ederek hac kastıyla kasteden kimse, şüphesiz İslam bağını boynundan tamamen çıkarıp atmış bir müşrik olur."]]}, {"reader": false, "ar": [[3100.0, "وكالطواف؛ فإنّ الطواف لا يقع إلا عبادة،"], [3104.4, "ليس هناك طوافٌ تعبُّديٌّ وطوافٌ غيرُ تعبُّديّ،"], [3108.9, "وإنما الطوافُ كلُّه عبادة،"], [3111.4, "ولا يُشرع الطوافُ بشيءٍ من أجزاء الأرض إلا بالبيت العتيق فقط."], [3120.0, "فمن طاف بالقبر فقد أشرك،"], [3123.0, "ومن طاف بالأشجار فقد أشرك،"], [3126.0, "ومن طاف بالأحجار فقد أشرك،"], [3129.0, "ومن طاف على الأولياء والصالحين متعبّدًا لهم بهذا الطواف فقد أشرك."], [3135.0, "ولكن هل هو شركٌ أكبرُ أو أصغر؟"], [3138.0, "هذا على تفاصيلَ ستأتينا إن شاء الله في بقيّة ثنايا شرح كلّيّات توحيد الألوهية."]], "tr": [[3100.0, "Tavaf gibi: Tavaf ancak ibadet olarak vuku bulur."], [3104.4, "Taabbudî tavaf ve taabbudî olmayan tavaf diye bir şey yoktur;"], [3109.5, "bilakis tavafın tamamı ibadettir. Yeryüzünün hiçbir parçasında, sadece Beyt-i Atîk (Kâbe) dışında tavaf meşru değildir."], [3120.0, "Kabri tavaf eden şirk koşmuştur;"], [3124.8, "ağaçları tavaf eden şirk koşmuştur;"], [3130.1, "taşları tavaf eden şirk koşmuştur;"], [3135.0, "velîlerin ve sâlihlerin etrafında, bu tavafla onlara taabbud ederek tavaf eden şirk koşmuştur."], [3138.0, "Peki bu büyük şirk midir, küçük şirk mi?"], [3140.3, "Bu, inşallah ulûhiyyet tevhidi külliyeleri şerhinin geri kalan kısımlarında bize gelecek tafsilata bağlıdır."]]}]}, {"ts": "52:26", "title": "10. Külliye (devam): Bu ayrımın önemi; ibadetin şirk olmasını rubûbiyyet itikadına bağlayanların yanlışı", "paras": [{"reader": false, "ar": [[3145.5, "فلا بدّ أن نفرّق بين هذين النوعين من التعبُّدات."], [3153.0, "فإن قلتَ: ولماذا نصصتَ على هذا التفريق في كلّيّتين منفصلتين؟"], [3158.0, "فأقول: لأهمّيّتها في هذا الزمان خاصّةً."], [3162.0, "فإن قلتَ: بيّن لنا هذه الأهمّيّة،"], [3166.0, "فأقول: إنّ هناك طائفةً تنتسب لأهل السنة ظلمًا وزورًا،"], [3172.0, "تقول بأنّ العبادة لا تكون شركًا أكبرَ إذا صُرفت لغير الله عز وجل إلا إذا صاحبها اعتقادُ الربوبيّة في المصروفة له؛"], [3184.0, "يقولون هذا الكلام بهذا الإطلاق غيرَ مفصّلين بين نوعي العبادات."]], "tr": [[3145.5, "Taabbudların bu iki türünü mutlaka birbirinden ayırmamız gerekir."], [3153.0, "Eğer \"Bu ayrımı neden iki ayrı külliyede açıkça belirttin?\" dersen, derim ki:"], [3158.0, "Özellikle bu zamandaki önemi sebebiyle."], [3162.0, "Eğer \"Bu önemi bize açıkla\" dersen, derim ki:"], [3166.7, "Haksız yere ve yalan yere Ehl-i Sünnet'e nispet edilen bir grup var;"], [3172.9, "ibadetin Allah Azze ve Celle'den başkasına yöneltildiğinde, ancak kendisine yöneltilen kimse hakkında rubûbiyyet itikadı eşlik ederse büyük şirk olacağını söylüyorlar."], [3184.0, "Bu sözü, ibadetlerin iki türü arasında ayrım yapmadan, bu şekilde mutlak olarak söylüyorlar."]]}, {"reader": false, "ar": [[3195.0, "مستدلّين على ذلك بسجود والد يوسف وإخوته ليوسف،"], [3203.0, "فقالوا: هذا السجود كان جائزًا في شرعهم،"], [3208.0, "لكن لم يكن مصحوبًا باعتقاد الربوبيّة في يوسف،"], [3212.0, "فكان سجودًا جائزًا في شريعتهم."], [3215.0, "ونحن في شريعتنا إذا سجد أحدُنا لآخر من باب التحيّة فقط،"], [3221.0, "لا من باب اعتقاد الربوبيّة في المسجود له،"], [3224.0, "فيقولون: هذا عندنا نحن في شريعتنا حرام،"], [3229.0, "ولكن ليس بشرك؛ لأنّ السجود منه ما يكون توحيدًا وعقيدة،"], [3233.8, "ومنه ما يكون تحيّةً وإكرامًا،"], [3237.0, "إذًا ليس شركًا في كلّ صوره."]], "tr": [[3195.0, "Buna, Yûsuf'un babasının ve kardeşlerinin Yûsuf'a secde etmesini delil getiriyorlar ve şöyle diyorlar:"], [3203.8, "Bu secde onların şeriatinde caizdi;"], [3207.4, "ama Yûsuf hakkında rubûbiyyet itikadı eşlik etmiyordu."], [3211.0, "Dolayısıyla onların şeriatinde caiz bir secdeydi."], [3215.0, "Bizim şeriatimizde ise birimiz bir başkasına, kendisine secde edilen hakkında rubûbiyyet itikadı babından değil de sadece selamlama babından secde ederse, şöyle diyorlar:"], [3224.7, "Bu, bizim şeriatimizde haramdır ama şirk değildir."], [3230.0, "Çünkü secdenin bir kısmı tevhid ve akîde olur, bir kısmı da selamlama ve ikram olur."], [3237.0, "O hâlde her suretinde şirk değildir."]]}, {"reader": false, "ar": [[3241.0, "فيقولون: بما أنّ سجود والدَي يوسف ليوسف لم يكن شركًا لعدم مصاحبة الاعتقاد له،"], [3252.0, "فكذلك كلُّ عبادةٍ صرفتَها لغير الله لا تكون شركًا إلا إذا صاحبها اعتقادُ الربوبيّة في المصروف له."], [3259.0, "وخرّجوا على ذلك تخريجاتٍ فاسدة:"], [3262.0, "فإذا جاء الإنسانُ يستغيث بالأموات والأولياء والصالحين من دون الله لا نقول:"], [3268.5, "قد أشركتَ، إلا إذا سألناه:"], [3270.6, "هل أنت استغثتَ بهم معتقدًا أنهم أربابٌ من دون الله؟"], [3276.0, "فإذا قال: نعم، صار شركًا أكبر،"], [3279.0, "وإذا قال: لا، صار حرامًا،"], [3281.3, "ولكن لا يحلّ لأحدٍ أن يكفّره بهذا الفعل."]], "tr": [[3241.0, "Şöyle diyorlar: Yûsuf'un anne-babasının Yûsuf'a secdesi, ona itikad eşlik etmediği için şirk olmadığına göre, Allah'tan başkasına yönelttiğin her ibadet de ancak kendisine yöneltilen kimse hakkında rubûbiyyet itikadı eşlik ederse şirk olur."], [3259.0, "Bunun üzerine bozuk sonuçlar çıkardılar:"], [3262.0, "İnsan gelip Allah'ı bırakıp ölülerden, velîlerden ve sâlihlerden imdat isterse, ona \"Şirk koştun\" demeyiz;"], [3268.5, "ancak ona \"Sen onlardan, Allah'ı bırakıp rab olduklarına inanarak mı imdat istedin?\" diye sorarız."], [3276.0, "\"Evet\" derse büyük şirk olur;"], [3278.0, "\"Hayır\" derse haram olur, ama hiç kimsenin onu bu fiilden dolayı tekfir etmesi helal olmaz."]]}, {"reader": false, "ar": [[3285.0, "وعليه دعواتٌ في هذا الزمان،"], [3290.0, "ولهم حلقاتٌ الآن يدعون لها،"], [3293.0, "وهذا مخالفٌ للقرآن، ومخالفٌ لما أجمع عليه أهلُ السنة والجماعة."]], "tr": [[3285.0, "Bu zamanda buna dayanan davetler var;"], [3288.2, "onların şu anda bu görüşe davet ettikleri halkaları (dersleri) var."], [3293.9, "Bu ise Kur'an'a aykırıdır ve Ehl-i Sünnet ve'l-Cemaat'in icmâ ettiği şeye aykırıdır."]]}]}, {"ts": "55:00", "title": "Müşriklerin şirki rubûbiyyet itikadına değil vasıta edinmeye dayanıyordu · Dersin kapanışı", "paras": [{"reader": false, "ar": [[3300.0, "فإنّ الله عز وجل بيّن أنّ تعبُّدات المشركين لأصنامهم لم تكن عن اعتقاد أنّ هذه الأصنام أربابٌ من دون الله،"], [3309.0, "أو أنها تملك ما يملك اللهُ من مقتضيات الربوبيّة."], [3312.0, "بل إنّ الله عز وجل قرّر المشركين:"], [3314.9, "من الذي يخلق؟ يقولون:"], [3316.5, "الله. من الذي يرزق؟"], [3318.2, "يقولون: الله. من الذي ينصركم؟"], [3320.2, "الله. من الذي يدبّر الأمر؟"], [3322.3, "الله. من الذي بيده التصريف؟"], [3324.4, "الله؛ في آياتٍ كثيرة."]], "tr": [[3300.0, "Çünkü Allah Azze ve Celle, müşriklerin putlarına yaptıkları taabbudların, bu putların Allah'ı bırakıp rabler olduklarına ya da Allah'ın mâlik olduğu rubûbiyyet gereklerine mâlik olduklarına dair bir itikaddan kaynaklanmadığını açıklamıştır."], [3312.0, "Bilakis Allah Azze ve Celle, birçok ayette müşriklere (şunu) ikrar ettirmiştir:"], [3316.1, "Kim yaratıyor? \"Allah\" diyorlar. Kim rızık veriyor?"], [3320.2, "\"Allah\" diyorlar. Size kim yardım ediyor?"], [3322.3, "Allah. İşleri kim çekip çeviriyor?"], [3324.4, "Allah. Tasarruf kimin elinde? Allah."]]}, {"reader": false, "ar": [[3326.0, "قال الله عز وجل على لسان إبراهيم أنه قال لقومه:"], [3332.1, "<span class=\"ayah\">﴿هَلْ يَسْمَعُونَكُمْ إِذْ تَدْعُونَ ۝ أَوْ يَنفَعُونَكُمْ أَوْ يَضُرُّونَ ۝ قَالُوا بَلْ وَجَدْنَا آبَاءَنَا كَذَٰلِكَ يَفْعَلُونَ﴾<\/span> <span class=\"ref\">[الشعراء: ٧٢–٧٤]<\/span>."], [3341.4, "و«بل» تنفي ما قبلها؛"], [3345.0, "يعني: لا يسمعوننا إذا دعوناهم،"], [3349.0, "ولا ينفعوننا ولا يضرّوننا،"], [3351.0, "وإنما اللهُ هو الذي يفعل ذلك،"], [3353.0, "ولكنّ الحقيقة أننا وجدنا آباءنا «على أمّةٍ وإنّا على آثارهم مقتدون ومهتدون» <span class=\"note\">(Zuhruf 22–23'ün birleştirilmiş ifadesi)<\/span>."]], "tr": [[3326.0, "Allah Azze ve Celle, İbrâhîm'in diliyle onun kavmine şöyle dediğini bildirdi:"], [3330.3, "<span class=\"ayah\">﴿Dua ettiğinizde sizi işitiyorlar mı? Yahut size fayda veya zarar verebiliyorlar mı? Dediler ki: Hayır, ama biz babalarımızı böyle yaparken bulduk﴾<\/span> [Şuarâ 72–74]."], [3341.4, "\"Bel\" (hayır, bilakis) kendisinden öncesini nefyeder."], [3345.0, "Yani: Onlara dua ettiğimizde bizi işitmezler, bize fayda da zarar da vermezler;"], [3350.0, "bunu yapan ancak Allah'tır. Ama gerçek şu ki biz babalarımızı \"bir din üzere bulduk ve biz onların izlerine uyuyor ve onların izleriyle doğru yolu buluyoruz.\" <span class=\"note\">(Zuhruf 22–23'ün birleştirilmiş ifadesi)<\/span>"]]}, {"reader": false, "ar": [[3359.0, "فالمشركون لم يكونوا يعتقدون الربوبيّةَ في أصنامهم،"], [3364.0, "وإنما كانوا يعتقدون فيها أنها تقرّبهم إلى الله زُلفى،"], [3369.4, "وأنها تشفع لهم عند الله عز وجل؛"], [3372.0, "فهم يرجونها أن تكون واسطةً فيما بينهم وبين الله عز وجل."], [3377.0, "فأصلُ شرك المشركين مبنيٌّ على اتّخاذ الوسائط،"], [3380.0, "لا على اعتقاد الربوبيّة."], [3383.0, "ولكنّ كثيرًا من الدعاة في هذا الزمان الآن يريدون أن يروّجوا للأمّة أنّ الشرك مبنيٌّ على اعتقاد الربوبيّة فيمن تُصرف له هذا الشيء؛"], [3396.0, "فإن صرفتَه له معتقدًا الربوبيّةَ فيه فقد أشركتَ،"], [3400.4, "وإن صرفتَه لغير الله لا معتقدًا ـ لا معتقدًا الربوبيّةَ فيه ـ فإنّ ذلك يبقى في دائرة الحرام."]], "tr": [[3359.0, "Müşrikler putları hakkında rubûbiyyet itikadı taşımıyorlardı;"], [3363.3, "onlar hakkında ancak kendilerini Allah'a iyice yaklaştırdıklarına ve Allah Azze ve Celle katında kendilerine şefaat ettiklerine inanıyorlardı."], [3372.0, "Onlardan, kendileriyle Allah Azze ve Celle arasında bir vasıta olmalarını umuyorlardı."], [3377.0, "Dolayısıyla müşriklerin şirkinin aslı rubûbiyyet itikadına değil, vasıtalar edinmeye dayanır."], [3383.0, "Ama bu zamanda davetçilerin çoğu şu anda ümmete şunu yaymak istiyor:"], [3390.0, "Şirk, bu şeyin kendisine yöneltildiği kimse hakkındaki rubûbiyyet itikadına dayanır;"], [3396.0, "onu ona, onun hakkında rubûbiyyete inanarak yöneltirsen şirk koşmuş olursun;"], [3401.9, "onu Allah'tan başkasına, inanmadan —onun hakkında rubûbiyyete inanmadan— yöneltirsen, bu haram dairesinde kalır."]]}, {"reader": false, "ar": [[3410.0, "وهو الذي جعلني أفرّق بين التعبُّدات التي لا تقع إلا عبادة،"], [3417.0, "وبين التعبُّدات التي تقع مرةً تعبُّدًا ومرةً غيرَ تعبُّد."], [3427.0, "فأمّا العباداتُ التي لا تقع إلا عبادة فإنّ مجرّد صرفها لغير الله عز وجل يُعتبر شركًا،"], [3433.0, "وإن لم تعتقد في المصروف له شيئًا من مقتضيات الربوبيّة."], [3436.0, "وأمّا التعبُّداتُ التي تنقسم إلى عبادةٍ وغير عبادة،"], [3441.0, "فهنا يتوقّف تكفيرُك على اعتقادك في المصروف له شيئًا من مقتضيات الربوبيّة."]], "tr": [[3410.0, "İşte bu, beni sadece ibadet olarak vuku bulan taabbudlar ile bazen taabbud, bazen taabbud olmayarak vuku bulan taabbudlar arasında ayrım yapmaya sevk etti."], [3427.0, "Sadece ibadet olarak vuku bulan ibadetlere gelince, kendisine yöneltilen kimse hakkında rubûbiyyet gereklerinden hiçbir şeye inanmasan bile onları Allah Azze ve Celle'den başkasına sırf yöneltmek şirk sayılır."], [3435.1, "İbadet olan ve ibadet olmayan diye ikiye ayrılan taabbudlara gelince, burada (kişiyi) tekfir etmen, onun, kendisine yöneltilen kimse hakkında rubûbiyyet gereklerinden bir şeye inanmasına bağlıdır."]]}, {"reader": false, "ar": [[3449.0, "ولذلك دائمًا نقول: إن دعا غيرَ الله في الأمر الذي لا يقدر عليه إلا الله فكأنه إنما دعاه لاعتقاده أنّ له تدبيرًا خفيًّا في الكون،"], [3462.0, "أي أضفى عليه شيئًا من مقتضيات الربوبيّة ولو يسيرًا،"], [3466.0, "أو استعان بغير الله في الأمر الذي لا يقدر عليه إلا الله."], [3471.0, "فنحن إنما نقيّد بـ«في الأمر الذي لا يقدر عليه إلا الله»،"], [3475.0, "أو «في الأمر الذي لا يجوز صرفُه إلا لله»،"], [3479.0, "أو «على الوجه الذي لا يجوز أن يُعبد به إلا الله عز وجل»،"], [3484.0, "في تلك العبادات التي تنقسم إلى عبادةٍ وغير عبادة."]], "tr": [[3449.0, "Bu yüzden her zaman şöyle deriz:"], [3450.8, "Sadece Allah'ın gücü yettiği bir şeyde Allah'tan başkasına dua ederse, sanki ona ancak kâinatta gizli bir tedbiri olduğuna inandığı için dua etmiştir;"], [3461.6, "yani ona —az da olsa— rubûbiyyet gereklerinden bir şey atfetmiştir."], [3465.6, "Ya da sadece Allah'ın gücü yettiği bir şeyde Allah'tan başkasından yardım isterse (böyledir)."], [3471.0, "Biz \"sadece Allah'ın gücü yettiği bir şeyde\", ya da \"sadece Allah'a yöneltilmesi caiz olan bir şeyde\", ya da \"sadece Allah Azze ve Celle'ye ibadet edilmesi caiz olan şekilde\" kaydını ancak ibadet olan ve ibadet olmayan diye ikiye ayrılan o ibadetlerde koyarız."]]}, {"reader": false, "ar": [[3491.0, "وأمّا هؤلاء فإنهم يُخرجون كلامَهم على وجه الإجمال:"], [3498.0, "فمن صلّى لغير الله عندهم فنسأله،"], [3501.0, "ومن نذر لغير الله عندهم فنسأله،"], [3505.0, "ومن طاف لغير الله عز وجل عندهم فإننا نسأله."], [3512.0, "أنتم معي في هذا ولّا لا؟"], [3516.0, "فإذًا خطؤهم في الإطلاق وتسوية التعبُّدين من غير تفريقٍ بين هذا وبين هذا هو الذي جعلني أفرّق بينهما."]], "tr": [[3491.0, "Bunlar ise sözlerini mücmel (ayrımsız) olarak ortaya koyarlar:"], [3498.0, "Onlara göre Allah'tan başkası için namaz kılana soracağız;"], [3501.0, "onlara göre Allah'tan başkası için adakta bulunana soracağız;"], [3505.0, "onlara göre Allah Azze ve Celle'den başkası için tavaf edene soracağız."], [3512.0, "Bu konuda benimle misiniz, değil misiniz?"], [3516.0, "Demek ki onların, bununla şunun arasını ayırmadan mutlak konuşmaları ve iki taabbud türünü bir tutmalarındaki hataları, beni ikisini birbirinden ayırmaya sevk etmiştir."]]}, {"reader": false, "ar": [[3526.0, "فإذا قال لك قائل:"], [3527.0, "هل لا بدّ من اعتقاد شيءٍ من مقتضيات الربوبيّة حتى نحكم بالشرك؟"], [3532.0, "فنقول: هذا يُشترط فيما يقع عبادةً تارةً ولا يقع عبادةً أخرى،"], [3538.0, "ولكن ليس بشرطٍ فيما يكون ـ فيما لا يقع إلا عبادة."], [3542.5, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد <span class=\"q\">؟ 59:04<\/span>."]], "tr": [[3526.0, "Biri sana \"Şirk hükmü vermemiz için rubûbiyyet gereklerinden bir şeye inanmak şart mıdır?\" derse, deriz ki:"], [3532.0, "Bu, bazen ibadet olarak vuku bulup bazen ibadet olarak vuku bulmayan şeyde şart koşulur;"], [3538.4, "ama sadece ibadet olarak vuku bulan şeyde şart değildir."], [3542.5, "Allah en yüce olandır ve en iyisini bilendir."], [3544.4, "Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin <span class=\"q\">؟<\/span>."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
