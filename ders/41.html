<script>
const D={"no": 41, "vid": "d1mf7AG7sNw", "title_ar": "الدرس (٤١) من شرح كليات العقيدة — من كليات توحيد الألوهية: الخوف والرجاء", "title_tr": "Şerhu Külliyyâti'l-Akîde — 41. Ders: Ulûhiyyet Tevhidi Külliyeleri (Fıtrî Korku ve Vehmî Korku, Şirk Olan Ümit ve Normal Ümit, Havf ile Recânın Birlikteliği ve Birinin Tercihi, Kunût ve Mekr-i İlâhîden Emin Olmak, İbadet Olarak da Olmayarak da Vuku Bulan ile Sadece İbadet Olarak Vuku Bulan Arasındaki Fark)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Sebebi açık ve gerçekleşmiş fıtrî korkudan dolayı insan kınanmaz", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.2, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.4, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.1, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [11.4, "أمّا بعد: فلا نزال في سياق كلّيّات توحيد الألوهية،"], [16.2, "وقد ذكرتُ في الدرس الماضي قاعدةَ شرك الخوف،"], [20.6, "وبيّنتُ متى يكون الخوفُ من غير الله عز وجل شركًا،"], [26.0, "أم لا. ماشي، نُكمل إن شاء الله شيئًا من القواعد في الخوف والرجاء."], [33.0, "الكلّيّة الأولى: <b>كلُّ خوفٍ جِبِلّيٍّ سببيّتُه ظاهرةٌ متحقّقةٌ فلا يُلام الإنسانُ عليه.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرةً ثالثة:"], [42.1, "كلُّ خوفٍ جِبِلّيٍّ سببيّتُه ظاهرةٌ ومتحقّقةٌ،"], [58.0, "ظاهرةٌ متحقّقةٌ، فلا يُلام الإنسانُ عليه."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.2, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.4, "Bundan sonra: Hâlâ ulûhiyyet tevhidi külliyelerinin akışı içindeyiz."], [16.2, "Geçen derste korku şirki kaidesini zikretmiş ve Allah Azze ve Celle'den başkasından korkmanın ne zaman şirk olduğunu, ne zaman olmadığını açıklamıştım."], [27.0, "Peki; inşallah korku ve ümit hakkındaki kaidelerden bir kısmını tamamlıyoruz."], [33.0, "<b>1. külliye: Sebebiyeti açık ve gerçekleşmiş olan her fıtrî (cibillî) korkudan dolayı insan kınanmaz.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [42.1, "<b>1. külliye: Sebebiyeti açık ve gerçekleşmiş —açık ve gerçekleşmiş— olan her fıtrî korkudan dolayı insan kınanmaz.<\/b>"]]}, {"reader": false, "ar": [[63.0, "أقول وبالله التوفيق: وهو الذي يسمّيه علماءُ الاعتقاد بالخوف الطبعيّ،"], [67.0, "وهو أمرٌ فطريٌّ جَبَل اللهُ عز وجل عليه البشريّة،"], [71.0, "جَبَل اللهُ عليه الثقلين من الجنّ والإنس."], [75.0, "فمن جملة ما جبل الله عز وجل عليه فطرتنا أننا نخاف ممّا يوجب الخوفَ منه:"], [82.0, "فنحن نخاف من النار،"], [83.7, "ونخاف من اللصوص، ونخاف من الحيّة،"], [87.1, "ونخاف من الحيوانات المفترسة،"], [90.0, "ونخاف من الطغاة، ونخاف من الإيذاء،"], [94.2, "ونخاف من خسارات التجارة،"], [101.0, "ونخاف على دمائنا، ونخاف على أموالنا،"], [104.3, "ونخاف على أولادنا. وكلُّ ذلك من الخوف الجبلّيّ الطبعيّ الذي فطر اللهُ عز وجل النفوسَ عليه."]], "tr": [[63.0, "Tevfik Allah'tandır, derim ki: Bu, akîde âlimlerinin \"tabiî korku\" diye adlandırdığı korkudur."], [64.2, "O, Allah Azze ve Celle'nin insanlığı üzerinde yarattığı fıtrî bir şeydir;"], [69.2, "Allah onu cin ve insten iki ağır topluluğun yaratılışına koymuştur."], [75.0, "Allah Azze ve Celle'nin fıtratımızı üzerinde yarattığı şeylerden biri de, korkulmayı gerektiren şeyden korkmamızdır:"], [82.0, "Ateşten korkarız, hırsızlardan korkarız, yılandan korkarız, yırtıcı hayvanlardan korkarız, zorbalardan korkarız, eziyetten korkarız, ticaret zararlarından korkarız;"], [94.9, "canımız için korkarız, mallarımız için korkarız, çocuklarımız için korkarız."], [106.0, "Bunların hepsi, Allah Azze ve Celle'nin nefisleri üzerinde yarattığı fıtrî, tabiî korkudandır."]]}, {"reader": false, "ar": [[112.0, "لكنّ هذا الخوف لا يكون جائزًا إلا إذا كانت سببيّتُه ظاهرة؛"], [118.0, "يعني بمعنى أنّ وصولَ الخوف من الأمر المخوف منه إليك سببيّتُه ظاهرةٌ لا خفيّة،"], [128.0, "وأن تكون تلك السببيّةُ متحقّقةً وليست بمتوهَّمة،"], [132.6, "كما سيأتينا في الكلّيّة التي بعدها إن شاء الله."], [139.0, "وقد دلّ الدليلُ على أنّ مثل هذا الخوف إذا صدر من الإنسان لا يكون متعلّقًا بشيءٍ من التوحيد،"], [147.0, "كما فرّ موسى عليه الصلاة والسلام من فرعون وقومه خائفًا منه،"], [152.0, "فقال الله عز وجل عنه:"], [155.3, "<span class=\"ayah\">﴿فَفَرَرْتُ مِنكُمْ لَمَّا خِفْتُكُمْ فَوَهَبَ لِي رَبِّي حُكْمًا وَجَعَلَنِي مِنَ الْمُرْسَلِينَ﴾<\/span> <span class=\"ref\">[الشعراء: ٢١]<\/span>."], [163.0, "وقال الله عز وجل عنه:"], [166.6, "<span class=\"ayah\">﴿فَخَرَجَ مِنْهَا خَائِفًا يَتَرَقَّبُ﴾<\/span> <span class=\"ref\">[القصص: ٢١]<\/span>."], [170.0, "وقال الله عز وجل:"], [172.2, "<span class=\"ayah\">﴿إِنِّي قَتَلْتُ مِنْهُمْ نَفْسًا فَأَخَافُ أَن يَقْتُلُونِ﴾<\/span> <span class=\"ref\">[القصص: ٣٣]<\/span>."]], "tr": [[112.0, "Ancak bu korku, sebebiyeti açık olmadıkça caiz olmaz."], [114.2, "Yani korkulan şeyden gelecek korkunun sana ulaşmasının sebebiyeti gizli değil açık olmalıdır;"], [118.0, "ve bu sebebiyet vehme dayalı değil, gerçekleşmiş olmalıdır."], [123.4, "İnşallah bundan sonraki külliyede bu bize gelecek."], [128.7, "Delil, bu tür bir korku insandan sadır olduğunda onun tevhid ile hiçbir ilgisinin olmadığını göstermiştir."], [139.0, "Nitekim Mûsâ aleyhisselâm Firavun'dan ve kavminden korkarak kaçmıştı."], [142.6, "Allah Azze ve Celle onun hakkında şöyle buyurdu:"], [146.6, "<span class=\"ayah\">﴿Sizden korkunca aranızdan kaçtım; sonra Rabbim bana hikmet (hüküm) bağışladı ve beni peygamberlerden kıldı﴾<\/span> [Şuarâ 21]."], [155.3, "Allah Azze ve Celle onun hakkında şöyle buyurdu:"], [163.0, "<span class=\"ayah\">﴿Korka korka, etrafı gözetleyerek oradan çıktı﴾<\/span> [Kasas 21]."], [170.0, "Allah Azze ve Celle şöyle buyurdu:"], [172.2, "<span class=\"ayah\">﴿Ben onlardan birini öldürdüm; beni öldürmelerinden korkuyorum﴾<\/span> [Kasas 33]."]]}, {"reader": false, "ar": [[176.0, "وهذا الخوفُ الذي صدر من موسى عليه الصلاة والسلام إنما هو ذلك الخوفُ الجبلّيّ في سببيّةٍ ظاهرةٍ ومتحقّقة؛"], [187.0, "فإنّ فرعون طاغيةٌ، ويستطيع أن يؤذي موسى إذا شاء اللهُ عز وجل بمشيئته."], [193.0, "فموسى عليه الصلاة والسلام إنما خاف ممّا سببيّتُه ظاهرةٌ ومتحقّقة."], [200.0, "فخوفُ الإنسان إذا كان يحمل هذين الأمرين:"], [204.0, "أن تكون سببيّتُه ظاهرة،"], [206.9, "وأن تكون متحقّقة، فذلك لا تعلُّقَ له بالتوحيد أبدًا،"], [210.6, "لا في صَدَرٍ ولا وِرْد. والله أعلم."]], "tr": [[176.0, "Mûsâ aleyhisselâmdan sadır olan bu korku, açık ve gerçekleşmiş bir sebebiyet içindeki o fıtrî korkudan başka bir şey değildir."], [187.0, "Çünkü Firavun bir zorbadır; Allah Azze ve Celle dilerse, O'nun meşîetiyle Mûsâ'ya eziyet edebilir."], [193.0, "Dolayısıyla Mûsâ aleyhisselâm ancak sebebiyeti açık ve gerçekleşmiş olan bir şeyden korkmuştur."], [200.0, "İnsanın korkusu şu iki şeyi taşıdığında —sebebiyetinin açık olması ve gerçekleşmiş olması— onun tevhid ile ne gelişte ne gidişte hiçbir ilgisi yoktur. Allah en iyisini bilir."]]}]}, {"ts": "03:33", "title": "2. Külliye: Sebebiyeti vehme dayalı olup şeriata muhalefete götüren fıtrî korku haramdır", "paras": [{"reader": false, "ar": [[213.0, "ومن الكلّيّات أيضًا: <b>كلُّ خوفٍ جِبِلّيٍّ سببيّتُه متوهَّمةٌ أوجب الوقوعَ في مخالفة الشرع فمحرَّم.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ خوفٍ جِبِلّيٍّ سببيّتُه متوهَّمةٌ أوجب الوقوعَ في مخالفةٍ شرعيّةٍ فمحرَّم.<\/b>"]], "tr": [[213.0, "Külliyelerden biri de şudur: 2."], [215.0, "külliye: Sebebiyeti vehme dayalı olup şeriata muhalefete düşmeyi gerektiren her fıtrî korku haramdır.<b> (Tekrar ediyor.) <\/b>2."], [231.0, "külliye: Sebebiyeti vehme dayalı olup şer'î bir muhalefete düşmeyi gerektiren her fıtrî korku haramdır."]]}, {"reader": false, "ar": [[244.0, "والفرقانُ بين هذه الكلّيّة والكلّيّة التي قبلها هو في تحقُّق هذه السببيّة من عدم تحقُّقها؛"], [257.0, "فإنّ من الناس من يكون خوفُه خوفَ توهُّم،"], [262.0, "ليس في سببيّةٍ واضحة،"], [265.0, "وإنما هو يفرض على نفسه أشياءَ من الخوف ليس لها سببيّةٌ ظاهرة،"], [271.0, "فتجده يخاف ممّا لا يُخاف منه."], [276.0, "فخوفُه وإن كان جبلّيًّا إلا أنه لا يستند إلى سببيّةٍ ظاهرةٍ وواضحة."], [284.0, "فمتى ما كان هذا الخوفُ الصادرُ من هذا الإنسان ـ بهذا المعنى ـ حاملًا له على ترك ما يجب فعلُه شرعًا،"], [295.0, "أو حاملًا له على ارتكاب ما يحرم عليه شرعًا،"], [301.0, "فإنّ هذا الخوف الذي يحمل على مخالفة الشرع يُعتبر من الخوف المحرَّم."]], "tr": [[244.0, "Bu külliye ile bundan önceki külliye arasındaki fark, bu sebebiyetin gerçekleşmiş olup olmamasındadır."], [257.0, "Çünkü insanlardan bazısının korkusu vehim korkusudur;"], [260.8, "açık bir sebebiyete dayanmaz. O kendi kendine, açık bir sebebiyeti olmayan birtakım korkular farz eder (kurar);"], [270.0, "bu yüzden onu korkulmayacak şeyden korkarken bulursun."], [276.0, "Onun korkusu fıtrî olsa da açık ve net bir sebebiyete dayanmaz."], [284.0, "Bu insandan sadır olan bu korku —bu anlamıyla— onu şer'an yapılması vacip olanı terk etmeye ya da şer'an kendisine haram olanı işlemeye sevk ettiği zaman, şeriata muhalefete sevk eden bu korku haram korkudan sayılır."]]}, {"reader": false, "ar": [[307.0, "كخوف الإنسان من ظالمٍ ليس بينه وبينه أيُّ وسيلةٍ يؤذيه بسببها،"], [315.0, "أو خوف الإنسان من سلوك طريقٍ يفرض على هذا الطريق شيئًا من أمور الخوف،"], [324.0, "أو خوف الإنسان من ملازمة غريمٍ لم يلازمه أصالةً،"], [330.0, "ويحمله ذلك الخوفُ على تعطيل الصلاة في الجماعة خوفًا من وجود هذا الغريم في المسجد،"], [338.0, "وهو يفرض هذا الخوف ويتوهّمه فقط."], [342.0, "وكخوف العالِم من التعليم أن يتسلّط عليه أحد،"], [348.0, "مع أنّ أحدًا لم يتسلّط عليه ولم يكلّمه أحد،"], [352.0, "ولكن لا تزال نفسُه تفرض ذلك الخوفَ ذا الأسباب المتوهَّمة."]], "tr": [[307.0, "Tıpkı insanın, kendisiyle arasında onun sebebiyle kendisine eziyet edebileceği hiçbir vasıta bulunmayan bir zalimden korkması gibi;"], [317.6, "ya da insanın, o yolda birtakım korku sebepleri farz ederek bir yoldan gitmekten korkması gibi;"], [326.7, "ya da insanın, esasen peşine düşmemiş bir alacaklının peşine düşmesinden korkması ve bu korkunun onu, o alacaklının mescitte bulunmasından korkarak cemaatle namazı terk etmeye sevk etmesi gibi;"], [342.0, "oysa o bu korkuyu sadece farz etmekte ve vehmetmektedir."], [346.4, "Âlimin, birinin kendisine musallat olacağı korkusuyla öğretmekten korkması gibi;"], [350.2, "oysa kimse ona musallat olmamış, kimse onunla konuşmamıştır, ama nefsi hâlâ o vehmî sebepli korkuyu farz edip durmaktadır."]]}, {"reader": false, "ar": [[361.0, "أو أن يُعطّل المسلمون الجهادَ خائفين من الكفار،"], [365.0, "مع قوّة المسلمين وكثرة عددهم وعتادهم؛"], [370.0, "فليس هناك أسبابٌ ظاهرةٌ تجعل ذلك الخوفَ عذرًا لك في تفويت مأمورٍ أو ارتكاب محظور."], [378.0, "وكخوف الإنسان من تربية لحيته أن ينتقده الناس،"], [383.0, "ولم ينتقده أحد، حتى وإن انتقدوه فليس ذلك من الخوف الذي يرجع عليه ـ إيش؟"], [390.4, "ـ بالضرر. وكخوف الإنسان من تقصير ثيابه أن يرفضه أهلُه أو تغضب عليه عائلتُه."], [401.0, "وكخوف الداعية إلى الله عز وجل من سلوك طريق الدعوة أن يواجهه في دعوته من يبصق في وجهه،"], [409.0, "أو يرفض دعوته، أو يؤذيه باليد أو القول."]], "tr": [[361.0, "Ya da Müslümanların, güçlü olmalarına, sayılarının ve teçhizatlarının çokluğuna rağmen kâfirlerden korkarak cihadı terk etmeleri gibi."], [370.0, "Bu durumda o korkuyu, bir emri kaçırman ya da bir yasağı işlemen için sana mazeret kılacak açık sebepler yoktur."], [378.0, "İnsanın, insanlar kendisini eleştirir diye sakal bırakmaktan korkması gibi;"], [382.4, "oysa kimse onu eleştirmemiştir. Eleştirseler bile bu, ona —ne ile?— zarar olarak dönecek bir korku türünden değildir."], [390.4, "İnsanın, ailesi onu reddeder ya da akrabaları ona kızar diye elbisesini kısaltmaktan korkması gibi."], [401.0, "Allah Azze ve Celle'ye davet eden dâînin, davetinde karşısına yüzüne tükürecek, davetini reddedecek ya da ona elle veya sözle eziyet edecek birinin çıkacağı korkusuyla davet yoluna girmekten korkması gibi."]]}, {"reader": false, "ar": [[415.0, "وكلُّ ذلك من الخوف التوهُّميّ الذي لا يُعتبر عذرًا في الشرع في تفويت شيءٍ من المأمورات،"], [424.0, "ولا في ترك شيءٍ ـ في تفويت شيءٍ من المأمورات ـ ولا في الوقوع في شيءٍ من المحظورات."], [428.0, "لكن متى ما انقلبت أسبابُه من كونها متوهَّمةً إلى كونها متحقّقة،"], [437.0, "كأن يُهدَّد الداعيةُ فيما لو طرق الدعوةَ أن يُسجَن <span class=\"q\">؟ 07:17<\/span> أو يُؤذى في نفسه أو أهله بسببيّةٍ واضحة،"], [445.0, "فترك الدعوةَ اتّقاءً لهذا الشرّ، فلا بأس عليه."]], "tr": [[415.0, "Bunların hepsi vehmî korkudandır ki şeriatte emredilen şeylerden birini kaçırmada, bir şeyi terk etmede —emredilen şeylerden birini kaçırmada— ve yasaklanan şeylerden birine düşmede mazeret sayılmaz."], [427.0, "Ancak sebepleri vehme dayalı olmaktan çıkıp gerçekleşmiş hâle dönüştüğü zaman —meselâ dâî, davete girişirse hapsedileceği <span class=\"q\">؟<\/span> ya da canına veya ailesine açık bir sebebiyetle eziyet edileceği ile tehdit edilir de bu kötülükten sakınmak için daveti terk ederse— ona bir sakınca yoktur."]]}, {"reader": false, "ar": [[449.0, "فالفرقانُ بين هذه الكلّيّة والكلّيّة التي قبلها هو أنّ الأسباب في الأولى متحقّقة،"], [458.0, "وأمّا الأسبابُ في الكلّيّة الثانية فإنها أسبابٌ متوهَّمة."], [465.0, "فلا يجوز للإنسان أن يعطّل شيئًا من المأمورات،"], [471.0, "ولا أن يقع في شيءٍ من المحظورات،"], [473.8, "بخوفٍ يفرضه ويتوهّمه وليست له سببيّةٌ ظاهرة."], [479.0, "وعلى ذلك قولُ الله عز وجل:"], [482.0, "<span class=\"ayah\">﴿إِنَّمَا ذَٰلِكُمُ الشَّيْطَانُ يُخَوِّفُ أَوْلِيَاءَهُ فَلَا تَخَافُوهُمْ وَخَافُونِ إِن كُنتُم مُّؤْمِنِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ١٧٥]<\/span>،"], [489.0, "وقولُ الله عز وجل:"], [491.9, "<span class=\"ayah\">﴿فَلَا تَخْشَوُا النَّاسَ وَاخْشَوْنِ﴾<\/span> <span class=\"ref\">[المائدة: ٤٤]<\/span>،"], [495.0, "وقولُ الله عز وجل:"], [497.0, "<span class=\"ayah\">﴿وَتَخْشَى النَّاسَ وَاللَّهُ أَحَقُّ أَن تَخْشَاهُ﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٧]<\/span>. والله أعلم."]], "tr": [[449.0, "Bu külliye ile bundan önceki külliye arasındaki fark şudur:"], [456.7, "Birincisinde sebepler gerçekleşmiştir; ikinci külliyede ise sebepler vehmîdir."], [465.0, "Dolayısıyla insanın, farz ettiği ve vehmettiği, açık bir sebebiyeti olmayan bir korku yüzünden emredilen şeylerden birini terk etmesi ya da yasaklanan şeylerden birine düşmesi caiz değildir."], [479.0, "Allah Azze ve Celle'nin şu sözü buna dayanır:"], [482.0, "<span class=\"ayah\">﴿O (korkutan) şeytandır; ancak kendi dostlarını korkutur. Eğer mü'minseniz onlardan korkmayın, Benden korkun﴾<\/span> [Âl-i İmrân 175]."], [488.5, "Allah Azze ve Celle'nin şu sözü de:"], [491.9, "<span class=\"ayah\">﴿İnsanlardan korkmayın, Benden korkun﴾<\/span> [Mâide 44]."], [494.2, "Allah Azze ve Celle'nin şu sözü de:"], [497.0, "<span class=\"ayah\">﴿İnsanlardan çekiniyordun; oysa kendisinden çekinmene Allah daha lâyıktır﴾<\/span> [Ahzâb 37]. Allah en iyisini bilir."]]}]}, {"ts": "08:22", "title": "3. Külliye: Sadece Allah'ın gücü yettiği bir şeyde mahlûku ummak büyük şirktir", "paras": [{"reader": false, "ar": [[502.0, "ومن الكلّيّات أيضًا: <b>كلُّ رجاءٍ لمخلوقٍ في أمرٍ لا يقدر عليه إلا اللهُ فشركٌ أكبر.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[502.0, "Külliyelerden biri de şudur: 3."], [503.0, "külliye: Sadece Allah'ın gücü yettiği bir şeyde bir mahlûka beslenen her ümit büyük şirktir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[533.0, "أقول وبالله التوفيق: وذلك لأنّ رجاءَ الله عز وجل من جملة العبادات التي أُمرنا بها في كتاب الله وفي سنّة نبيّه صلى الله عليه وسلم،"], [543.0, "والأدلّةُ والآياتُ التي فيها رجاءُ الله ورجاءُ لقاء الله كثيرةٌ كثيرةٌ جدًّا،"], [550.0, "ممّا يدلّ على أنّ من جملة أنواع التعبُّدات وأصناف التوحيد:"], [556.4, "الرجاء. وبما أنه عبادةٌ فلا يجوز صرفُه لغير الله عز وجل في الأمر الذي لا يقدر عليه إلا اللهُ تبارك وتعالى."], [567.0, "وذلك كالرجاء في الأموات أو الغائبين،"], [570.0, "أو الرجاء في الحيّ الحاضر في الأمر الذي لا يقدر عليه إلا الله عز وجل."]], "tr": [[533.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [534.2, "Allah Azze ve Celle'yi ummak, Allah'ın Kitabı'nda ve Peygamberi sallallâhu aleyhi ve sellem'in Sünneti'nde bize emredilen ibadetlerdendir."], [540.9, "Allah'ı ummayı ve Allah'a kavuşmayı ummayı içeren deliller ve ayetler pek çoktur, gerçekten çok fazladır."], [548.8, "Bu da taabbud türlerinden ve tevhid çeşitlerinden birinin recâ (ümit) olduğunu gösterir."], [556.4, "Madem ki o bir ibadettir, sadece Allah Tebâreke ve Teâlâ'nın gücü yettiği bir şeyde onu Allah Azze ve Celle'den başkasına yöneltmek caiz değildir."], [567.0, "Bu, ölüleri ya da gâib olanları ummak veya sadece Allah Azze ve Celle'nin gücü yettiği bir şeyde hazır olan diriyi ummak gibidir."]]}, {"reader": false, "ar": [[578.0, "كأن يرجوَهم مغفرةَ ذنوبه وسترَ عيوبه،"], [581.0, "أو يرجوَهم نصرَه على أعدائه،"], [585.0, "أو يرجوَهم في الوقاية من عذاب الله عز وجل،"], [589.0, "أو يرجوَهم في الحماية من الجنّ،"], [593.0, "أو يرجوَهم في العصمة من الذنوب،"], [597.0, "أو يرجوَهم في إنجاب الأولاد وتفريج الكروب وإغاثة اللهفات،"], [604.0, "أو يرجوَهم في هداية القلوب."], [608.0, "فهذا هو الشركُ الذي يسمّيه العلماءُ بشرك الرجاء."], [614.0, "فليس كلُّ رجاءٍ مصروفٍ لغير الله يُعتبر شركًا،"], [618.0, "إلا إذا كان صُرف في الأمر الذي لا يقدر عليه إلا الله عز وجل."]], "tr": [[578.0, "Meselâ onlardan günahlarının bağışlanmasını ve ayıplarının örtülmesini ummak;"], [581.8, "ya da düşmanlarına karşı kendisine yardım etmelerini ummak;"], [586.3, "ya da Allah Azze ve Celle'nin azabından korunmada onları ummak;"], [590.3, "ya da cinlerden korunmada onları ummak;"], [594.3, "ya da günahlardan masum kalmada onları ummak;"], [598.4, "ya da çocuk sahibi olmada, sıkıntıların giderilmesinde ve feryatlara yetişilmesinde onları ummak;"], [607.2, "ya da kalplerin hidayetinde onları ummak gibi."], [611.6, "İşte bu, âlimlerin \"recâ şirki\" diye adlandırdığı şirktir."], [616.0, "Allah'tan başkasına yöneltilen her ümit şirk sayılmaz;"], [618.9, "ancak sadece Allah Azze ve Celle'nin gücü yettiği bir şeyde yöneltilmişse (şirk olur)."]]}, {"reader": false, "ar": [[624.0, "فإذا قيل لك: ما الشركُ في الرجاء؟"], [627.0, "فقل: هو أن يرجوَ غيرَ الله فيما لا يقدر عليه إلا الله عز وجل،"], [632.2, "ليحصل له مطلوبُه من جهة من يرجوه،"], [636.0, "كما مثّلتُ لكم. ولذلك قال الله عز وجل:"], [641.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ آمَنُوا وَالَّذِينَ هَاجَرُوا وَجَاهَدُوا فِي سَبِيلِ اللَّهِ أُولَٰئِكَ يَرْجُونَ رَحْمَتَ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ٢١٨]<\/span>."], [646.4, "ويقول الله عز وجل ـ بلى،"], [646.9, "نعم <span class=\"q\">؟ 10:44<\/span> ـ وقال الله عز وجل:"], [649.6, "<span class=\"ayah\">﴿فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا﴾<\/span> <span class=\"ref\">[الكهف: ١١٠]<\/span>."]], "tr": [[624.0, "Sana \"Recâda şirk nedir?\" denirse, de ki:"], [627.0, "Sadece Allah Azze ve Celle'nin gücü yettiği bir şeyde, umduğu kimse tarafından isteği gerçekleşsin diye Allah'tan başkasını ummaktır;"], [633.8, "size örneklerini verdiğim gibi. Bu yüzden Allah Azze ve Celle şöyle buyurdu:"], [641.0, "<span class=\"ayah\">﴿İman edenler, hicret edenler ve Allah yolunda cihad edenler, işte onlar Allah'ın rahmetini umarlar﴾<\/span> [Bakara 218]."], [646.4, "Allah Azze ve Celle şöyle buyurur —evet, evet <span class=\"q\">؟<\/span>— Allah Azze ve Celle şöyle buyurdu:"], [649.6, "<span class=\"ayah\">﴿Kim Rabbine kavuşmayı umuyorsa salih amel işlesin ve Rabbine ibadette hiç kimseyi ortak koşmasın﴾<\/span> [Kehf 110]."]]}]}, {"ts": "11:01", "title": "3. Külliye (devam): Şirk, gizli sebebiyete dayanır", "paras": [{"reader": false, "ar": [[661.0, "وهنا تنبيهٌ أريد أن أنبّهكم عليه:"], [664.0, "وهي أنّ الشرك في مثل هذه الأمور إنما يرجع إلى خفاء الأسباب؛"], [670.0, "إنما يرجع إلى سببيّةٍ خفيّةٍ ترجع إلى اعتقاد الراجي بأنّ من يرجوه له تصرّفٌ خفيٌّ في الكون،"], [683.0, "أو أنّ له قدرًا ومنزلةً عند الله تجعله يحقّق له هذا الرجاء،"], [689.0, "وليس هناك سببيّةٌ ظاهرةٌ واضحةٌ فيمن ترجوه."], [694.0, "لكن لو أنك رجوتَ مخلوقًا في شيءٍ سببيّتُه ظاهرة،"], [697.5, "وفي أمرٍ مقدورٍ عليه،"], [699.0, "فهذه السببيّةُ الظاهرة تجعل الأمرَ لا علاقةَ له بالتوحيد."]], "tr": [[661.0, "Burada size dikkatinizi çekmek istediğim bir uyarı var:"], [664.0, "Bu gibi işlerde şirk, ancak sebeplerin gizliliğine dayanır."], [670.0, "Ancak, umanın, umduğu kimsenin kâinatta gizli bir tasarrufu olduğuna ya da onun Allah katında bu ümidi kendisi için gerçekleştirmesini sağlayacak bir kadri ve makamı olduğuna dair inancına dayanan gizli bir sebebiyete dayanır;"], [688.5, "oysa umduğun kimsede açık ve net bir sebebiyet yoktur."], [694.0, "Ama sen bir mahlûku, sebebiyeti açık olan bir şeyde ve gücü yetilen bir işte ummuş olsaydın, bu açık sebebiyet meseleyi tevhid ile hiçbir ilgisi olmayan bir hâle getirir."]]}, {"reader": false, "ar": [[703.0, "فتجدون أنّ الشرك مبنيٌّ على الأسباب الخفيّة المتوهَّمة،"], [708.0, "والتي يسمّيها العلماءُ بخوف السرّ،"], [711.0, "أي خوفٌ سببيّتُه خفيّة،"], [714.0, "ورجاءِ السرّ، أي رجاءٌ سببيّتُه خفيّة،"], [719.0, "أو خشيةِ السرّ، أي خشيةٌ سببيّتُها خفيّة."], [725.0, "فإذا وقفتَ عند ميّتٍ ثم رجوتَه في تحقيق مطلوبٍ أو دفع مكروب،"], [730.0, "فأيُّ سببيّةٍ ظاهرةٍ تجعل هذا الميّتَ يحقّق لك رجاءك،"], [737.0, "إلا لأنك تعتقد فيه أنّ له تصرّفًا خفيًّا في الكون؟"]], "tr": [[703.0, "Böylece şirkin gizli ve vehmî sebeplere dayandığını görürsünüz."], [706.8, "Âlimler bunları \"gizli korku\" —yani sebebiyeti gizli olan korku—, \"gizli ümit\" —yani sebebiyeti gizli olan ümit— ya da \"gizli haşyet\" —yani sebebiyeti gizli olan haşyet— diye adlandırırlar."], [725.0, "Bir ölünün yanında durup bir isteğin gerçekleşmesini ya da bir sıkıntının giderilmesini ondan umarsan, bu ölünün ümidini gerçekleştirmesini sağlayacak açık sebebiyet nedir?"], [735.7, "Ancak sen onun kâinatta gizli bir tasarrufu olduğuna inandığın için (bunu yaparsın)."]]}, {"reader": false, "ar": [[741.0, "وإذا رجوتَ إنسانًا غائبًا عنك لم يسمع رجاءك،"], [745.0, "وليس بينك وبينه أيُّ وسيلةٍ تجعله يسمع رجاءك ويعرف مطلوبك،"], [750.0, "فإنك لم تفعل هذا في هذه السببيّة الخفيّة إلا لأنك تعتقد أنّ لهذا المرجوّ تصرّفًا خفيًّا في الكون."], [759.0, "وكذلك لو رجوتَ إنسانًا حاضرًا أمامك،"], [764.0, "لكن في أمرٍ لا يقدر عليه إلا اللهُ وحده عز وجل،"], [768.0, "فهذا رجاءٌ سببيّتُه خفيّة؛"], [771.0, "فما السببيّةُ التي تجعل هذا المرجوَّ في هذا الأمر المعجوز عنه يحقّق لك رجاءك؟"], [779.0, "فسببيّةُ تحقيق الرجاء في مثل هذه الأسباب سببيّةٌ ـ إيش؟ ـ خفيّة."]], "tr": [[741.0, "Senden uzakta olan, ümidini işitmeyen ve seninle arasında ümidini işitmesini ve isteğini bilmesini sağlayacak hiçbir vasıta bulunmayan bir insanı umarsan, bunu bu gizli sebebiyet içinde ancak, umulan bu kimsenin kâinatta gizli bir tasarrufu olduğuna inandığın için yapmışsındır."], [759.0, "Aynı şekilde önünde hazır olan bir insanı, ama sadece tek başına Allah Azze ve Celle'nin gücü yettiği bir şeyde umsan, bu da sebebiyeti gizli bir ümittir."], [772.1, "Umulan bu kimsenin, (insanların) âciz kaldığı bu işte ümidini gerçekleştirmesini sağlayacak sebebiyet nedir?"], [779.0, "Bu gibi sebeplerde ümidin gerçekleşmesinin sebebiyeti —nedir?— gizli bir sebebiyettir."]]}, {"reader": false, "ar": [[785.0, "والشركُ قائمٌ على السببيّات الخفيّة؛"], [788.0, "أعظمُ ما تُوصف به الأعمالُ بأنها شرك ترجع إلى تلك السببيّات الخفيّة."], [796.0, "كالذي يعلّق التميمةَ ليستدفع بها شرًّا أو يجلب بها خيرًا؛"], [800.0, "ما السببيّةُ في مثل هذا التعليق وجلب الخيرات؟"], [803.0, "سببٌ خفيّ، إلا إذا كنتَ تعتقد أنّ لها تدبيرًا وتصريفًا في مثل ذلك."], [810.0, "فإذا رجوتَ ميّتًا فإنك رجوتَ مرجوًّا سببُ الرجاء فيه خفيّ،"], [818.0, "وإذا رجوتَ غائبًا فتكون قد رجوتَ مرجوًّا سببُ الرجاء فيه خفيّ،"], [824.0, "وإذا رجوتَ حيًّا حاضرًا في أمرٍ لا يقدر عليه إلا الله فتكون قد رجوتَ مرجوًّا في أمرٍ سببيّتُه خفيّة."], [834.0, "فإذا قيل لك: متى يكون الرجاءُ شركًا؟"], [837.0, "قل: إذا كانت سببيّتُه خفيّة."]], "tr": [[785.0, "Şirk, gizli sebebiyetler üzerine kuruludur."], [788.0, "Amellerin şirk diye nitelendirilmesinin en büyük kısmı o gizli sebebiyetlere dayanır."], [796.0, "Meselâ bir kötülüğü def etmek ya da bir hayır celbetmek için muska asan kimse gibi:"], [800.0, "Bu asmada ve hayırları celbetmede sebebiyet nedir?"], [803.0, "Gizli bir sebeptir; ancak sen onun böyle bir şeyde bir tedbiri ve tasarrufu olduğuna inanıyorsan (böyle yaparsın)."], [810.0, "Bir ölüyü umarsan, umma sebebi gizli olan birini ummuşsundur."], [817.5, "Gâib birini umarsan, umma sebebi gizli olan birini ummuş olursun."], [823.5, "Hazır bir diriyi, sadece Allah'ın gücü yettiği bir şeyde umarsan, sebebiyeti gizli olan bir işte birini ummuş olursun."], [834.0, "Sana \"Recâ ne zaman şirk olur?\" denirse, de ki: Sebebiyeti gizli olduğu zaman."]]}, {"reader": false, "ar": [[840.0, "فإن قلتَ: وما الفرقانُ بين كلّيّتك هذه والكلّيّة التي قبلها؟"], [847.0, "فأقول: الفرقانُ بينهما أنّ السببيّة في الكلّيّة التي قبلها هي السببيّةُ الظاهرةُ الواضحة،"], [855.6, "ولكن أنت تتوهّم الخوف،"], [859.0, "فهي سببيّةٌ ظاهرةٌ متوهَّمة."], [863.0, "وأمّا السببيّةُ في رجاء الشرك فسببيّتُه خفيّةٌ أصلًا؛"], [871.0, "لا ندري نحن عن العلاقة التي تجعل المرجوَّ سيحقّق لك ذلك،"], [877.0, "إلا أنك تعتقد في هذا المرجوّ اعتقادًا لا يجوز إلا في الله عز وجل:"], [883.0, "وأنّ له تدبيرًا خفيًّا في الكون،"], [887.0, "أو أنه يملك النفعَ والضرّ،"], [889.0, "وأنّ بيده تحقيقَ مطلوبك وكشفَ كربتك وتحقيقَ رجائك."], [896.0, "وكلُّ ذلك من الشرك الأكبر. أفهمتم هذا؟"]], "tr": [[840.0, "Eğer \"Bu külliyen ile ondan önceki külliye arasındaki fark nedir?\" dersen, derim ki:"], [847.0, "Aralarındaki fark şudur: Önceki külliyedeki sebebiyet açık ve net sebebiyettir;"], [853.6, "ama sen korkuyu vehmediyorsun, dolayısıyla o açık ama vehmî bir sebebiyettir."], [863.0, "Şirk olan ümitteki sebebiyet ise esasen gizlidir."], [871.0, "Umulan kimsenin bunu senin için gerçekleştireceğini sağlayan bağ hakkında biz hiçbir şey bilmeyiz;"], [876.5, "ancak sen umulan bu kimse hakkında sadece Allah Azze ve Celle hakkında caiz olan bir inanç besliyorsun:"], [883.0, "Onun kâinatta gizli bir tedbiri olduğuna, ya da fayda ve zarara mâlik olduğuna, isteğinin gerçekleşmesinin, sıkıntının giderilmesinin ve ümidinin gerçekleşmesinin onun elinde olduğuna (inanıyorsun)."], [896.0, "Bunların hepsi büyük şirktendir. Bunu anladınız mı?"]]}]}, {"ts": "15:00", "title": "4. Külliye: Gücü yetilen ve sebebiyeti açık bir işte hazır bir mahlûku ummakta sakınca yoktur", "paras": [{"reader": false, "ar": [[900.0, "طيّب. ومن الكلّيّات أيضًا:"], [903.0, "كلُّ من يرجو مخلوقًا حاضرًا ـ هاه ـ كلُّ من يرجو مخلوقًا حاضرًا في أمرٍ مقدورٍ عليه،"], [914.0, "وسببيّتُه ظاهرةٌ، فلا بأس به. <span class=\"note\">(يكررها)<\/span> واضحٌ الكلام؟"], [930.5, "فهمتم هذا؟ إذًا الأسبابُ الخفيّة هذه يعني أصلٌ من أصول الشرك،"], [935.0, "ولا بدّ أن تعلّموا طلابكم؛"], [937.0, "لا بدّ أن يفقه الطالبُ حتى يعرف رجاءَ الشرك والرجاءَ العاديّ،"], [943.0, "خوفَ الشرك والخوفَ العاديّ."], [945.0, "أقول مرةً أخرى: كلُّ من يرجو مخلوقًا حاضرًا في أمرٍ مقدورٍ عليه،"], [950.6, "وسببيّتُه ظاهرةٌ، فلا بأس به."]], "tr": [[900.0, "Peki. Külliyelerden biri de şudur:"], [903.0, "<b>4. külliye: Hazır olan bir mahlûku —ha— gücü yetilen bir işte ve sebebiyeti açık olarak uman herkes için bir sakınca yoktur.<\/b> (Tekrar ediyor.) Söz açık mı?"], [930.5, "Bunu anladınız mı? Demek ki bu gizli sebepler, şirkin asıllarından bir asıldır."], [934.6, "Bunu talebelerinize mutlaka öğretmelisiniz. Talebe mutlaka iyice kavramalı ki şirk olan ümidi ve normal ümidi, şirk olan korkuyu ve normal korkuyu bilsin."], [945.0, "Bir kez daha söylüyorum: 4."], [946.4, "külliye: Hazır olan bir mahlûku, gücü yetilen bir işte ve sebebiyeti açık olarak uman herkes için bir sakınca yoktur."]]}, {"reader": false, "ar": [[953.0, "أقول وبالله التوفيق: وذلك لأنه رجاءٌ عاديٌّ لا بأس به ولا حرج."], [958.0, "فرجاءُ الغير في الأمر المقدور عليه كاستعانتك به،"], [963.0, "وكطلبك أن يعينك في شيءٍ معيّنٍ هو قادرٌ عليه،"], [968.0, "كأن ترجوَ أخاك أن يُصلح سيّارتك أو يبنيَ بيتك،"], [973.0, "أو ترجوَه في قرضٍ ماليّ؛"], [976.0, "فهذا ليس من الشرك أبدًا،"], [977.7, "في صَدَرٍ ولا وِرْد،"], [979.0, "لأنه رجاءٌ عاديٌّ أسبابُه ظاهرةٌ واضحة،"], [984.0, "وليس منها شيءٌ يؤثّر في التوحيد."], [989.0, "فرجاءُ المخلوق من المخلوق واستعانتُه به فيما يقدر عليه أمرٌ جائز،"], [995.0, "وليس فيه ما يناقض التوحيد،"], [997.0, "كاستعانة المخلوق بالمخلوق واستغاثته به فيما يقدر عليه. والله أعلم."]], "tr": [[953.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [954.2, "Bu, sakıncası ve vebali olmayan normal bir ümittir."], [958.0, "Gücü yetilen bir işte başkasını ummak, ondan yardım istemen ve gücünün yettiği belirli bir şeyde sana yardım etmesini talep etmen gibidir."], [967.4, "Meselâ kardeşinin arabanı tamir etmesini ya da evini yapmasını ummak veya bir borç para (vermesini) ondan ummak gibi."], [976.0, "Bu, ne gelişte ne gidişte asla şirkten değildir;"], [978.0, "çünkü sebepleri açık ve net olan normal bir ümittir ve onda tevhide tesir eden hiçbir şey yoktur."], [989.0, "Mahlûkun mahlûku, onun gücünün yettiği bir şeyde umması ve ondan yardım istemesi caiz bir şeydir;"], [994.5, "onda tevhide aykırı bir şey yoktur."], [996.1, "Tıpkı mahlûkun, mahlûkun gücünün yettiği bir şeyde ondan yardım ve imdat istemesi gibi. Allah en iyisini bilir."]]}]}, {"ts": "16:44", "title": "5. Külliye: Rağbet ile rehbeti birleştirmeyen her taabbud, ikisinden eksik kalan ölçüde eksiktir", "paras": [{"reader": false, "ar": [[1004.0, "ومن الكلّيّات أيضًا: <b>كلُّ تعبُّدٍ لا يقوم على الجمع بين الرَّغَب والرَّهَب فناقصٌ بقدر ما نقص منهما.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرةً ثالثة:"], [1017.0, "<b>كلُّ تعبُّدٍ لا يقوم على الجمع بين الرَّغَب والرَّهَب فناقصٌ بقدر ما نقص منهما.<\/b>"]], "tr": [[1004.0, "Külliyelerden biri de şudur: 5."], [1006.0, "külliye: Rağbet (ümit) ile rehbeti (korkuyu) birleştirmeye dayanmayan her taabbud, ikisinden eksik kalan ölçüde eksiktir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [1017.0, "<b>5. külliye: Rağbet ile rehbeti birleştirmeye dayanmayan her taabbud, ikisinden eksik kalan ölçüde eksiktir.<\/b>"]]}, {"reader": false, "ar": [[1045.0, "أقول وبالله التوفيق: وهذا من أعظم آداب التعبُّد وسير القلوب إلى الله عز وجل؛"], [1053.0, "فإنّ الله عز وجل لا يجوز عبادتُه بالخوف وحده،"], [1057.0, "ولا يجوز عبادتُه بالرجاء وحده،"], [1061.0, "بل كلُّ تعبُّدٍ لا بدّ أن يكون مشتملًا على خوفٍ ورجاء."], [1068.0, "فنحن نعبد الله عز وجل بالخوف والرجاء."], [1071.0, "فإنّ طائفةً عبدوا الله بالخوف فوقعوا في القنوط من رحمة الله،"], [1076.1, "كما سيأتينا، وطائفةً عبدوا الله عز وجل بالرجاء وحده فوقعوا في الأمن من مكر الله عز وجل،"], [1083.0, "كما سيأتينا في كلّيّاته الخاصّة."]], "tr": [[1045.0, "Tevfik Allah'tandır, derim ki: Bu, taabbudun ve kalplerin Allah Azze ve Celle'ye yürüyüşünün en büyük edeplerindendir."], [1053.0, "Çünkü Allah Azze ve Celle'ye yalnızca korkuyla ibadet etmek caiz değildir;"], [1057.8, "yalnızca ümitle ibadet etmek de caiz değildir."], [1062.9, "Bilakis her taabbud mutlaka korkuyu ve ümidi içermelidir."], [1068.0, "Biz Allah Azze ve Celle'ye korku ve ümitle ibadet ederiz."], [1071.0, "Bir grup Allah'a (yalnızca) korkuyla ibadet etti de Allah'ın rahmetinden ümit kesmeye (kunûta) düştü;"], [1075.6, "bu bize gelecek. Bir grup da Allah Azze ve Celle'ye yalnızca ümitle ibadet etti de Allah Azze ve Celle'nin mekrinden emin olmaya düştü;"], [1082.6, "bu da kendine has külliyelerinde bize gelecek."]]}, {"reader": false, "ar": [[1085.0, "وأمّا عبادةُ الموحّدين وسيرُ قلوبهم إلى الله عز وجل فإنه لا يتمّ إلا بجناحين:"], [1093.6, "الخوف والرجاء، فلا يجوز تغليبُ أحدهما على الآخر إلا إذا اقتضت المصلحةُ ترجيحَ أحدهما،"], [1102.7, "كما سيأتينا إن شاء الله عز وجل."], [1107.0, "ولذلك حذّر اللهُ عز وجل من اليأس من رحمته ورَوْحه،"], [1112.7, "ومن الأمن من مكره،"], [1115.0, "وأخبر أنّ عباده الصالحين يعبدونه بالجناحين جميعًا."], [1121.0, "فقال الله عز وجل:"], [1122.8, "<span class=\"ayah\">﴿فَلَا يَأْمَنُ مَكْرَ اللَّهِ إِلَّا الْقَوْمُ الْخَاسِرُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ٩٩]<\/span>."], [1126.0, "وقال الله عز وجل:"], [1128.2, "<span class=\"ayah\">﴿إِنَّهُ لَا يَيْأَسُ مِن رَّوْحِ اللَّهِ إِلَّا الْقَوْمُ الْكَافِرُونَ﴾<\/span> <span class=\"ref\">[يوسف: ٨٧]<\/span>."], [1133.0, "وقال الله عز وجل:"], [1135.5, "<span class=\"ayah\">﴿فَلَا تَكُن مِّنَ الْقَانِطِينَ﴾<\/span> <span class=\"ref\">[الحجر: ٥٥]<\/span>،"], [1138.0, "<span class=\"ayah\">﴿قَالَ وَمَن يَقْنَطُ مِن رَّحْمَةِ رَبِّهِ إِلَّا الضَّالُّونَ﴾<\/span> <span class=\"ref\">[الحجر: ٥٦]<\/span>."]], "tr": [[1085.0, "Muvahhidlerin ibadeti ve kalplerinin Allah Azze ve Celle'ye yürüyüşü ise ancak iki kanatla tamam olur:"], [1093.6, "korku ve ümit. Maslahat ikisinden birinin tercih edilmesini gerektirmedikçe birini diğerine galip getirmek caiz değildir;"], [1102.1, "inşallah bu bize gelecek. Bu yüzden Allah Azze ve Celle, rahmetinden ve ravhından (lütfundan) ümit kesmekten ve mekrinden emin olmaktan sakındırmış, salih kullarının O'na iki kanatla birlikte ibadet ettiklerini haber vermiştir."], [1121.0, "Allah Azze ve Celle şöyle buyurdu:"], [1122.8, "<span class=\"ayah\">﴿Allah'ın mekrinden ancak hüsrana uğrayan topluluk emin olur﴾<\/span> [A'râf 99]."], [1126.0, "Allah Azze ve Celle şöyle buyurdu:"], [1128.2, "<span class=\"ayah\">﴿Allah'ın rahmetinden ancak kâfirler topluluğu ümit keser﴾<\/span> [Yûsuf 87]."], [1133.0, "Allah Azze ve Celle şöyle buyurdu:"], [1135.5, "<span class=\"ayah\">﴿Sakın ümitsizlerden olma﴾<\/span> [Hicr 55]."], [1137.4, "<span class=\"ayah\">﴿Dedi ki: Rabbinin rahmetinden sapıklardan başka kim ümit keser?﴾<\/span> [Hicr 56]."]]}, {"reader": false, "ar": [[1143.0, "وقال الله عز وجل عن عباده الصالحين:"], [1146.0, "<span class=\"ayah\">﴿وَيَدْعُونَنَا﴾<\/span> ـ أي يعبدوننا ـ <span class=\"ayah\">﴿رَغَبًا﴾<\/span> أي رجاءً،"], [1150.2, "<span class=\"ayah\">﴿وَرَهَبًا﴾<\/span> أي خوفًا وخشيةً <span class=\"ref\">[الأنبياء: ٩٠]<\/span>."], [1153.0, "وقال الله عز وجل في آياتٍ كثيرة جامعًا بين مقتضى الخوف والرغب:"], [1162.0, "<span class=\"ayah\">﴿إِنَّ الْأَبْرَارَ لَفِي نَعِيمٍ﴾<\/span> <span class=\"ref\">[الانفطار: ١٣]<\/span>،"], [1163.7, "وهذا يفيد الرجاء، <span class=\"ayah\">﴿وَإِنَّ الْفُجَّارَ لَفِي جَحِيمٍ﴾<\/span> <span class=\"ref\">[الانفطار: ١٤]<\/span>،"], [1167.9, "وهذا يفيد الرهبَ والخوف."], [1171.0, "وقال الله عز وجل:"], [1172.8, "<span class=\"ayah\">﴿نَبِّئْ عِبَادِي أَنِّي أَنَا الْغَفُورُ الرَّحِيمُ﴾<\/span> <span class=\"ref\">[الحجر: ٤٩]<\/span>،"], [1175.6, "وهذا جانبُ الرجاء، <span class=\"ayah\">﴿وَأَنَّ عَذَابِي هُوَ الْعَذَابُ الْأَلِيمُ﴾<\/span> <span class=\"ref\">[الحجر: ٥٠]<\/span>،"], [1180.3, "وهذا جانبُ الخوف والخشية."], [1183.0, "فلا يستقيم سيرُ القلب إلى الله في كافّة تعبُّداته إلا إذا كان جامعًا لهذين الأمرين."]], "tr": [[1143.0, "Allah Azze ve Celle salih kulları hakkında şöyle buyurdu:"], [1146.0, "<span class=\"ayah\">﴿Bize dua ederlerdi﴾<\/span> —yani Bize ibadet ederlerdi— <span class=\"ayah\">﴿rağbetle﴾<\/span> yani ümitle, <span class=\"ayah\">﴿ve rehbetle﴾<\/span> yani korku ve haşyetle [Enbiyâ 90]."], [1153.0, "Allah Azze ve Celle birçok ayette korkunun ve rağbetin gereğini bir araya getirerek şöyle buyurdu:"], [1162.0, "<span class=\"ayah\">﴿İyiler şüphesiz nimet içindedir﴾<\/span> [İnfitâr 13] —bu ümit ifade eder— <span class=\"ayah\">﴿Günahkârlar da şüphesiz cehennem içindedir﴾<\/span> [İnfitâr 14] —bu da rehbet ve korku ifade eder."], [1171.0, "Allah Azze ve Celle şöyle buyurdu:"], [1172.8, "<span class=\"ayah\">﴿Kullarıma haber ver ki Ben gerçekten çok bağışlayanım, çok merhamet edenim﴾<\/span> [Hicr 49] —bu ümit tarafıdır— <span class=\"ayah\">﴿ve azabım da elem dolu azabın ta kendisidir﴾<\/span> [Hicr 50] —bu da korku ve haşyet tarafıdır."], [1185.2, "Kalbin bütün taabbudlarında Allah'a yürüyüşü, ancak bu iki şeyi birleştirdiği zaman dosdoğru olur."]]}, {"reader": false, "ar": [[1190.0, "وقال الله عز وجل:"], [1192.8, "<span class=\"ayah\">﴿أَمَّنْ هُوَ قَانِتٌ آنَاءَ اللَّيْلِ سَاجِدًا وَقَائِمًا﴾<\/span> ـ ماذا يريد؟"], [1201.4, "ـ <span class=\"ayah\">﴿يَحْذَرُ الْآخِرَةَ﴾<\/span> ـ وهذا جانبُ الخوف ـ <span class=\"ayah\">﴿وَيَرْجُو رَحْمَةَ رَبِّهِ﴾<\/span> <span class=\"ref\">[الزمر: ٩]<\/span>."], [1206.9, "إذًا جمع في تعبُّداته بين الرَّهَب والرَّغَب."], [1211.0, "والآياتُ في هذا المعنى كثيرة."]], "tr": [[1190.0, "Allah Azze ve Celle şöyle buyurdu:"], [1192.8, "<span class=\"ayah\">﴿Yoksa gece saatlerinde secde ederek ve kıyamda durarak ibadet eden﴾<\/span> —ne istiyor?— <span class=\"ayah\">﴿âhiretten sakınan﴾<\/span> —bu korku tarafıdır— <span class=\"ayah\">﴿ve Rabbinin rahmetini uman kimse mi?﴾<\/span> [Zümer 9]."], [1206.9, "Demek ki o, taabbudlarında rehbet ile rağbeti birleştirmiştir. Bu anlamdaki ayetler çoktur."]]}]}, {"ts": "20:15", "title": "5. Külliye (devam): Her ibadette havf ve recâ; hadisler ve selefin sözleri", "paras": [{"reader": false, "ar": [[1215.0, "فيجتمع الخوفُ والرجاءُ في قلب المؤمن في كلّ تعبُّدٍ يريد أن يتعبّد به إلى الله عز وجل:"], [1224.0, "فنحن نطقنا بالشهادتين خوفًا ورجاءً،"], [1228.0, "ونقيم الصلاةَ خوفًا ورجاءً،"], [1231.0, "ونزكّي خوفًا ورجاءً، ونصوم خوفًا ورجاءً،"], [1236.0, "ونحجّ خوفًا ورجاءً، ونركع خوفًا ورجاءً،"], [1240.0, "ونسجد خوفًا ورجاءً، ونتصدّق خوفًا ورجاءً،"], [1244.0, "ونقوم الليلَ خوفًا ورجاءً،"], [1246.0, "وهكذا في سائر التعبُّدات."], [1249.0, "فإن قلتَ: وهل نرجّح أحدَ الطرفين؟"], [1252.0, "فأقول: ستأتينا كلّيّةٌ خاصّةٌ بهذا الأمر إن شاء الله عز وجل."]], "tr": [[1215.0, "Böylece mü'minin kalbinde, Allah Azze ve Celle'ye onunla taabbud etmek istediği her taabbudda korku ve ümit bir araya gelir:"], [1222.9, "Kelime-i şehâdeti korku ve ümitle söyledik;"], [1225.6, "namazı korku ve ümitle kılarız;"], [1228.8, "zekâtı korku ve ümitle veririz;"], [1231.9, "korku ve ümitle oruç tutarız;"], [1235.7, "korku ve ümitle hacca gideriz;"], [1237.3, "korku ve ümitle rükû ederiz;"], [1240.0, "korku ve ümitle secde ederiz;"], [1242.7, "korku ve ümitle sadaka veririz;"], [1245.0, "geceyi korku ve ümitle ibadetle geçiririz."], [1248.2, "Diğer bütün taabbudlarda da böyledir."], [1250.5, "Eğer \"İki taraftan birini tercih eder miyiz?\" dersen, derim ki:"], [1253.8, "İnşallah bu meseleye has bir külliye bize gelecek."]]}, {"reader": false, "ar": [[1257.0, "وفي الحديث عن أبي هريرة رضي الله تعالى عنه قال:"], [1262.4, "قال النبيُّ صلى الله عليه وسلم ـ واسمعوا إلى الجمع بين الأمرين ـ قال:"], [1268.6, "«لو يعلم المؤمنُ ما عند الله من العقوبة ما طمع بجنّته أحد» ـ وهذا يبعث الخوف ـ «ولو يعلم الكافرُ ما عند الله من الرحمة ما قنط من ـ رحمته ـ من جنّته أحد» <span class=\"note\">(Müslim)<\/span>،"], [1288.2, "أخرجه الإمام مسلم. وهذا دليلٌ على وجوب الجمع بين الخوف والرجاء."]], "tr": [[1257.0, "Ebû Hüreyre radıyallâhu anh'dan gelen hadiste şöyle dedi:"], [1262.4, "Peygamber sallallâhu aleyhi ve sellem buyurdu —iki şeyin birleştirilmesine kulak verin—:"], [1268.6, "\"Mü'min, Allah katındaki cezayı bilseydi hiç kimse O'nun cennetini ummazdı\" —bu korku uyandırır— \"Kâfir de Allah katındaki rahmeti bilseydi hiç kimse O'nun —rahmetinden— cennetinden ümit kesmezdi.\" <span class=\"note\">(Müslim)<\/span> Bunu İmam Müslim rivayet etmiştir."], [1290.0, "Bu, korku ile ümidi birleştirmenin vacip olduğuna delildir."]]}, {"reader": false, "ar": [[1300.0, "وفي الحديث عن أبي سعيدٍ الخدريّ رضي الله تعالى عنه قال:"], [1304.6, "قال النبيُّ صلى الله عليه وسلم:"], [1308.0, "«إذا وُضعت الجنازةُ واحتملها الناسُ ـ أو الرجالُ ـ على أعناقهم، فإن كانت صالحةً قالت: قدّموني، قدّموني، وإن كانت غيرَ صالحةٍ قالت: يا ويلها، أين تذهبون بها؟» <span class=\"note\">(Buhârî)<\/span>."], [1323.0, "فجمع بين موجِب الخوف والرجاء في حديثٍ واحد."], [1329.0, "ويقول النبيُّ صلى الله عليه وسلم كما في حديث ابن مسعود:"], [1333.0, "«الجنّةُ أقربُ إلى أحدكم من شِراك نعله» ـ وهذا جانبُ الرجاء ـ «والنارُ أقربُ إلى أحدكم من شِراك نعله» ـ وهذا جانبُ الخوف."]], "tr": [[1300.0, "Ebû Saîd el-Hudrî radıyallâhu anh'dan gelen hadiste şöyle dedi:"], [1304.6, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1308.0, "\"Cenaze konulup da insanlar —ya da adamlar— onu omuzlarına aldıklarında, eğer salih ise 'Beni öne götürün, beni öne götürün!' der."], [1320.5, "Eğer salih değilse 'Vay haline!"], [1323.0, "Onu nereye götürüyorsunuz?' der.\" <span class=\"note\">(Buhârî)<\/span> Böylece tek bir hadiste korkuyu ve ümidi gerektiren şeyi bir araya getirmiştir."], [1329.0, "İbn Mes'ûd hadisinde olduğu gibi Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [1333.0, "\"Cennet herhangi birinize ayakkabısının bağından daha yakındır\" —bu ümit tarafıdır— \"Cehennem de herhangi birinize ayakkabısının bağından daha yakındır\" —bu da korku tarafıdır."]]}, {"reader": false, "ar": [[1348.0, "ولذلك نصّ السلفُ رحمهم الله تعالى على وجوب استجماع الأمرين في التعبُّدات."], [1353.0, "فهذا الحسنُ البصريُّ رحمه الله تعالى يقول:"], [1357.0, "«الرجاءُ والخوفُ مطيّةُ المؤمن»،"], [1359.5, "أي في سيره إلى الله عز وجل."], [1364.0, "وقال الفُضيلُ بنُ عياضٍ رحمه الله تعالى:"], [1368.0, "«الخوفُ أفضلُ من الرجاء ما دام الرجلُ صحيحًا، فإذا نزل به الموتُ فالرجاءُ أفضل». انتهى كلامه."]], "tr": [[1348.0, "Bu yüzden selef —Allah onlara rahmet etsin— taabbudlarda iki şeyi bir araya getirmenin vacip olduğunu açıkça ifade etmişlerdir."], [1353.0, "İşte Hasan-ı Basrî —Allah ona rahmet etsin— şöyle der:"], [1357.0, "\"Ümit ve korku, mü'minin bineğidir\";"], [1360.2, "yani Allah Azze ve Celle'ye yürüyüşünde."], [1364.0, "Fudayl b. İyâz —Allah ona rahmet etsin— şöyle dedi:"], [1368.0, "\"Kişi sağlıklı olduğu sürece korku ümitten daha faziletlidir."], [1372.3, "Ona ölüm gelip çattığında ise ümit daha faziletlidir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1381.0, "ولله درُّ الإمام الشافعيّ في أبياتٍ شعريّةٍ قالها تعبّر عن هذه الكلّيّة تعبيرًا عظيمًا؛"], [1389.0, "فإنه لمّا دخل عليه المُزَنيُّ في علّته التي مات فيها فقال:"], [1395.4, "كيف أصبحتَ يا إمام؟"], [1397.0, "قال: «أصبحتُ من الدنيا راحلًا، ولإخواني مفارقًا، ولكأس المنيّة شاربًا، ولسوء أعمالي ملاقيًا، وعلى الله واردًا، فلا أدري روحي تصير إلى الجنّة فأهنّيها» ـ وهذا جانبُ الرجاء ـ «أو إلى النار فأعزّيها»."], [1416.5, "ثم بكى وأنشأ يقول:"], [1419.2, "«تعاظمني ذنبي فلمّا قرنتُه ... بعفوك ربّي كان عفوُك أعظما ۝ وما زلتَ ذا عفوٍ عن الذنب لم تزل ... تجود وتعفو منّةً وتكرُّما»."]], "tr": [[1381.0, "İmam Şâfiî'nin, bu külliyeyi çok güzel ifade eden söylediği şiir beyitlerine ne denir!"], [1389.0, "Öldüğü hastalığında Müzenî yanına girip \"Nasıl sabahladın ey imam?\" diye sorduğunda şöyle dedi:"], [1397.0, "\"Dünyadan göçen, kardeşlerimden ayrılan, ölüm kadehini içen, amellerimin kötülüğüyle karşılaşan ve Allah'a varan biri olarak sabahladım."], [1405.3, "Ruhum cennete mi gidecek ki onu tebrik edeyim\" —bu ümit tarafıdır— \"yoksa cehenneme mi ki ona taziyede bulunayım, bilmiyorum.\" Sonra ağladı ve şu (beyitleri) söylemeye başladı:"], [1419.2, "\"Günahım gözümde büyüdü; ama onu Rabbim, Senin affınla karşılaştırınca affın daha büyük oldu."], [1428.0, "Sen günahı affeden olmaya devam ettin;"], [1431.4, "hâlâ lütuf ve kerem olarak cömertlik eder ve affedersin.\""]]}, {"reader": false, "ar": [[1437.0, "وقال السَّرِيُّ السَّقَطيُّ رحمه الله تعالى:"], [1442.0, "«ينبغي للعبد أن يكون أخوفَ ما يكون من الله، وآمَنَ ما يكون من ربّه»؛"], [1452.0, "فينبغي أن يكون أشدَّ الناس أمنًا وأشدَّ الناس خوفًا."], [1460.0, "والكلامُ على ذلك كثير."]], "tr": [[1437.0, "Seriyy-i Sakatî —Allah ona rahmet etsin— şöyle dedi:"], [1442.0, "\"Kulun, Allah'tan olabildiğince korkan ve Rabbinden (gelecek iyilik hususunda) olabildiğince emin olan biri olması gerekir.\" Dolayısıyla insanların en emin olanı ve insanların en çok korkanı olması gerekir. Bu konudaki söz çoktur."]]}, {"reader": false, "ar": [[1462.0, "فإن قلتَ: وهل هناك طوائفُ خالفت هذا الأمر؟"], [1466.8, "فأقول: نعم؛ فإنّ طائفة الوعيديّة من الخوارج والمعتزلة إنما عبدوا الله عز وجل بالوعيد فقط،"], [1477.0, "فلا ينظرون من الله عز وجل إلا جانبَ الوعيد والتخويف والتهديد والعذاب الأليم،"], [1487.0, "فوقعوا في القنوط واليأس من رحمة الله ورَوْحه."], [1490.0, "وأمّا المرجئة فإنهم عكسوا الأمرَ تمامًا،"], [1494.1, "فعبدوا الله عز وجل بجانب الرجاء فقط،"], [1499.0, "حتى قال قائلُهم: لا يضرّ مع الإيمان معصيةٌ ولا كبيرةٌ دون الشرك."]], "tr": [[1462.0, "Eğer \"Bu meseleye muhalefet eden fırkalar var mı?\" dersen, derim ki:"], [1466.8, "Evet. Hâricîler'den ve Mu'tezile'den olan Va'îdiyye fırkası Allah Azze ve Celle'ye sadece va'îd (tehdit) ile ibadet ettiler."], [1476.3, "Allah Azze ve Celle'den sadece va'îd, korkutma, tehdit ve elem dolu azap tarafına bakarlar."], [1485.1, "Böylece Allah'ın rahmetinden ve ravhından ümitsizliğe ve ümit kesmeye düştüler."], [1490.0, "Mürcie ise işi tamamen tersine çevirdi;"], [1492.7, "Allah Azze ve Celle'ye sadece ümit tarafıyla ibadet ettiler."], [1498.1, "Hatta içlerinden biri şöyle dedi:"], [1501.0, "\"İman varken şirkten aşağı hiçbir günah ve hiçbir büyük günah zarar vermez.\""]]}, {"reader": false, "ar": [[1507.0, "فإنما وقع الوعيديّةُ فيما وقعوا فيه لأنهم أفردوا في تعبُّداتهم واعتقادهم الخوفَ فقط عن الرجاء،"], [1515.0, "وإنما ضلّ المرجئةُ في عقائدهم الفاسدة لأنهم أفردوا جانبَ الرجاء عن جانب الخوف."], [1525.0, "وأمّا المؤمنُ الموحّد فإنه في سيره إلى الله عز وجل يعيش بين الخوف والرجاء."]], "tr": [[1507.0, "Va'îdiyye düştükleri şeye ancak taabbudlarında ve itikadlarında sadece korkuyu ümitten ayırıp tek başına aldıkları için düştüler."], [1514.5, "Mürcie de bozuk akîdelerinde ancak ümit tarafını korku tarafından ayırıp tek başına aldıkları için saptılar."], [1525.0, "Muvahhid mü'min ise Allah Azze ve Celle'ye yürüyüşünde korku ile ümit arasında yaşar."]]}]}, {"ts": "25:31", "title": "6. Külliye: Rağbeti rehbete ya da tersine tercih etmeyi içeren her şer'î maslahatla tercih yapılır", "paras": [{"reader": false, "ar": [[1531.0, "الكلّيّةُ التي بعدها: <b>كلُّ مصلحةٍ تتضمّن ترجيحَ الرَّغَب على الرَّهَب أو العكس فيُرجَّح بها<\/b>؛"], [1539.0, "<b>كلُّ مصلحةٍ شرعيّةٍ تتضمّن ترجيحَ الرَّغَب على الرَّهَب أو العكس فيُرجَّح بها.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1531.0, "Bundan sonraki külliye: 6. külliye:"], [1534.0, "Rağbeti rehbete ya da tersini tercih etmeyi içeren her maslahatla tercih yapılır.<b> <\/b>6."], [1539.0, "külliye: Rağbeti rehbete ya da tersini tercih etmeyi içeren her şer'î maslahatla tercih yapılır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1565.0, "أقول وبالله التوفيق: وهذه الكلّيّة تُعتبر استثناءً من الكلّيّة التي قبلها؛"], [1573.0, "فإنه متى ما اقتضت المصلحةُ الشرعيّة ترجيحَ أحد الجانبين على الآخر فإنه لا بأس من ترجيحه في هذه الحالة دون غيرها،"], [1588.0, "وإلا فالأصلُ استواءُ الجانبين."], [1590.0, "فإن قلتَ: وهل هناك حالاتٌ تمثّل بها؟"], [1594.9, "فأقول: كثيرةٌ جدًّا. فمنها عند الدعاء؛"], [1601.0, "فإنّ الإنسان إذا كان في حالة الدعاء ينبغي له أن يرجّح حسنَ الظنّ في الله عز وجل ورجاءَ الله أن يستجيب له،"], [1609.0, "فإنّ الله عز وجل يقول:"], [1611.9, "«أنا عند ظنّ عبدي بي» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[1565.0, "Tevfik Allah'tandır, derim ki: Bu külliye, bundan önceki külliyeden bir istisna sayılır."], [1573.0, "Şer'î maslahat iki taraftan birinin diğerine tercih edilmesini gerektirdiği zaman, başka durumlarda değil de bu durumda onu tercih etmekte bir sakınca yoktur."], [1590.0, "Aksi hâlde asıl olan, iki tarafın eşit olmasıdır."], [1594.9, "Eğer \"Örnek vereceğin durumlar var mı?\" dersen, derim ki:"], [1601.0, "Pek çoktur. Bunlardan biri dua anıdır."], [1603.1, "İnsan dua hâlindeyken Allah Azze ve Celle hakkında hüsnüzannı ve Allah'ın kendisine icabet edeceğini ummayı tercih etmelidir."], [1608.3, "Çünkü Allah Azze ve Celle şöyle buyurur:"], [1611.9, "\"Ben kulumun Beni zannı üzereyim.\" <span class=\"note\">(Buhârî, Müslim)<\/span>"]]}, {"reader": false, "ar": [[1614.0, "فلا ينبغي له أن يغلّب جانبَ الخوف في حال الدعاء،"], [1619.7, "فيحمله تغليبُ الخوف على القنوط من أن يستجيب الله عز وجل له؛"], [1627.0, "فالدعاءُ يُغلَّب عليه جانبُ الرجاء على الخوف."], [1632.0, "ومنها كذلك عند الموت؛"], [1634.0, "فإنّ الإنسان إذا حلّت به سكراتُ الموت فينبغي أن يغلّب جانبَ الرجاء في الله على الخوف منه،"], [1642.0, "لقول النبيّ صلى الله عليه وسلم:"], [1646.0, "«لا يموتنّ أحدُكم إلا وهو يُحسن الظنَّ في الله عز وجل» <span class=\"note\">(Müslim)<\/span>،"], [1654.0, "وحتى يُقبل العبدُ على ربّه بقلبٍ محسنٍ الظنَّ فيه."], [1662.0, "فلا ينبغي للإنسان أبدًا أن يموت وهو مسيءٌ للظنّ في الله عز وجل."]], "tr": [[1614.0, "Dolayısıyla dua hâlinde korku tarafını galip getirmemelidir;"], [1617.5, "yoksa korkuyu galip getirmesi onu, Allah Azze ve Celle'nin kendisine icabet edeceğinden ümit kesmeye sevk eder."], [1627.0, "Duada ümit tarafı korkuya galip getirilir."], [1632.0, "Bunlardan biri de ölüm anıdır."], [1634.0, "İnsana ölüm sarhoşlukları geldiğinde Allah'a dair ümit tarafını O'ndan korkuya galip getirmelidir."], [1640.4, "Çünkü Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1646.0, "\"Sizden biri, Allah Azze ve Celle hakkında hüsnüzan beslemedikçe sakın ölmesin.\" <span class=\"note\">(Müslim)<\/span> Ta ki kul, Rabbine O'nun hakkında hüsnüzan besleyen bir kalple varsın."], [1662.0, "İnsanın, Allah Azze ve Celle hakkında sûizan beslerken ölmesi asla uygun değildir."]]}, {"reader": false, "ar": [[1669.0, "ومنها كذلك عند التوبة؛"], [1672.0, "فإذا أسرف الإنسانُ على نفسه بالذنوب والمعاصي ثم تاب،"], [1676.0, "فينبغي له أن يغلّب في هذه الحالة جانبَ الرجاء وقبولِ التوبة."], [1683.0, "ولذلك قال الله عز وجل:"], [1685.0, "<span class=\"ayah\">﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ﴾<\/span> <span class=\"ref\">[الزمر: ٥٣]<\/span>."], [1691.0, "ونهيُهم عن القنوط أمرٌ لهم بتغليب جانب الرجاء في الله عز وجل."], [1697.0, "فالذي يظهر أنّ التائب لا بدّ أن يغلّب جانبَ الرجاء على جانب الخوف."]], "tr": [[1669.0, "Bunlardan biri de tövbe anıdır."], [1672.0, "İnsan günahlar ve isyanlarla kendi aleyhine haddi aşar, sonra tövbe ederse, bu durumda ümit ve tövbenin kabulü tarafını galip getirmelidir."], [1681.1, "Bu yüzden Allah Azze ve Celle şöyle buyurdu:"], [1685.0, "<span class=\"ayah\">﴿De ki: Ey kendi aleyhlerine haddi aşan kullarım! Allah'ın rahmetinden ümidinizi kesmeyin﴾<\/span> [Zümer 53]."], [1691.0, "Onları ümit kesmekten nehyetmesi, onlara Allah Azze ve Celle'ye dair ümit tarafını galip getirmelerini emretmektir."], [1697.0, "Görünen o ki tövbe eden kimse ümit tarafını korku tarafına mutlaka galip getirmelidir."]]}, {"reader": false, "ar": [[1702.0, "وكما غلّب سحرةُ فرعون جانبَ الرجاء في الله عز وجل على جانب الخوف،"], [1709.0, "مع أنهم سحرة، وجاؤوا يحاربون نبيَّ الله صلى الله عليه وسلم،"], [1717.0, "ويؤيّدون أعظمَ طاغيةٍ في الأرض في ذلك الزمان؛"], [1720.0, "ولكن مع ذلك لمّا تابوا وأنابوا قال الله عز وجل عنهم:"], [1726.1, "<span class=\"ayah\">﴿إِنَّا نَطْمَعُ أَن يَغْفِرَ لَنَا رَبُّنَا خَطَايَانَا أَن كُنَّا أَوَّلَ الْمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[الشعراء: ٥١]<\/span>."]], "tr": [[1702.0, "Firavun'un sihirbazlarının, Allah Azze ve Celle'ye dair ümit tarafını korku tarafına galip getirmeleri gibi."], [1709.0, "Oysa onlar sihirbazdı; Allah'ın peygamberiyle sallallâhu aleyhi ve sellem savaşmaya gelmişlerdi ve o zamanda yeryüzündeki en büyük zorbayı destekliyorlardı."], [1720.0, "Ama buna rağmen tövbe edip (Allah'a) yöneldiklerinde Allah Azze ve Celle onlar hakkında şöyle buyurdu:"], [1726.1, "<span class=\"ayah\">﴿Biz, iman edenlerin ilki olduğumuz için Rabbimizin hatalarımızı bağışlayacağını umuyoruz﴾<\/span> [Şuarâ 51]."]]}, {"reader": false, "ar": [[1733.0, "وأمّا عند وفور الصحّة والقرب من المعصية،"], [1742.0, "فإنّ الإنسان ينبغي له في هذه الحالة أن يغلّب جانبَ الخوف من الله عز وجل؛"], [1749.0, "وذلك لأنّ من همّت نفسُه بشيءٍ من الذنوب أو الوقوع في شيءٍ من المخالفات الشرعيّة لو غلّب جانبَ الرجاء لكان ذلك حاملًا له على أن يقع."], [1761.0, "فتغليبُ جانب الخوف عند وفور الصحّة والرغبة في المعصية هو ـ الأصل، هو ـ مقتضى الشرع."]], "tr": [[1733.0, "Sağlığın yerinde olduğu ve günaha yakın olunduğu zaman ise insan bu durumda Allah Azze ve Celle'den korku tarafını galip getirmelidir."], [1749.0, "Çünkü nefsi bir günaha ya da şer'î muhalefetlerden birine düşmeye niyetlenen kimse ümit tarafını galip getirseydi, bu onu (günaha) düşmeye sevk ederdi."], [1758.8, "Sağlığın yerinde olduğu ve günaha istek duyulduğu zaman korku tarafını galip getirmek —asıl olan budur— şeriatin gereğidir."]]}]}, {"ts": "29:35", "title": "6. Külliye (devam): İbadeti bitirdikten sonra havf mı recâ mı?", "paras": [{"reader": false, "ar": [[1775.0, "فإن قلتَ: وبعد الفراغ من التعبُّدات هل أغلّب جانبَ الخوف أو جانبَ الرجاء؟"], [1784.0, "ماذا تقولون؟ إذا فرغ الإنسانُ من صلاته،"], [1791.1, "أو من قيامه من الليل،"], [1793.3, "أو تصدّق بصدقةٍ عظيمة،"], [1795.0, "أو بنى مسجدًا، أو استكثر من التعبُّدات،"], [1799.0, "فهل يغلّب جانبَ الخوف أو جانبَ الرجاء؟"]], "tr": [[1775.0, "Eğer \"Taabbudları bitirdikten sonra korku tarafını mı galip getireyim, ümit tarafını mı?\" dersen —ne dersiniz?— İnsan namazını ya da gece ibadetini bitirdiğinde, ya da büyük bir sadaka verdiğinde, ya da bir mescit yaptırdığında, ya da taabbudları çoğalttığında, korku tarafını mı galip getirir, ümit tarafını mı?"]]}, {"reader": false, "ar": [[1802.0, "أقول: لا يغلّب هذا ولا هذا،"], [1806.0, "وإنما لا بدّ من التفريق بين أمرين:"], [1809.0, "ففي جانب النظر إلى عظيم رحمة الله وقيامه بمأموره في أرضه فيغلّب جانبَ رجاء القبول،"], [1817.0, "وبالنظر إلى نفسه وتقصيرها في القيام بالواجب على الوجه المأمور به شرعًا يغلّب جانبَ الخوف."], [1826.0, "وعليه قولُ الله عز وجل:"], [1828.8, "<span class=\"ayah\">﴿وَالَّذِينَ يُؤْتُونَ مَا آتَوا﴾<\/span> ـ أي يقدّمون لله عز وجل ما يقدّمونه من التعبُّدات الشرعيّة ـ <span class=\"ayah\">﴿وَّقُلُوبُهُمْ وَجِلَةٌ﴾<\/span> <span class=\"ref\">[المؤمنون: ٦٠]<\/span>."]], "tr": [[1802.0, "Derim ki: Ne bunu ne de şunu galip getirir;"], [1806.3, "bilakis iki şeyi birbirinden ayırmak gerekir:"], [1809.0, "Allah'ın rahmetinin büyüklüğüne ve kendisinin Allah'ın yeryüzündeki emrini yerine getirmesine bakma yönünden kabul ümidi tarafını galip getirir."], [1817.0, "Kendi nefsine ve onun vacibi şer'an emredildiği şekilde yerine getirmedeki kusuruna bakarak da korku tarafını galip getirir."], [1826.0, "Allah Azze ve Celle'nin şu sözü buna dayanır:"], [1828.8, "<span class=\"ayah\">﴿Onlar verdiklerini verirken﴾<\/span> —yani Allah Azze ve Celle'ye şer'î taabbudlardan sundukları şeyi sunarken— <span class=\"ayah\">﴿kalpleri korku içindedir﴾<\/span> [Mü'minûn 60]."]]}, {"reader": false, "ar": [[1839.0, "فاستشكلت عائشةُ ذلك الأمر،"], [1843.0, "وحملته على هؤلاء الذين يتعبّدون الله ولكن عندهم جوانبُ معاصٍ كالسرقة والزنا وشرب الخمر،"], [1851.0, "فبيّن لها النبيُّ صلى الله عليه وسلم أنهم الذين يصلّون ويصومون ويتصدّقون ويخافون ألّا يُقبل منهم."], [1860.0, "أَلِأمرٍ يرجع إلى الله <span class=\"q\">؟ 31:00<\/span>،"], [1863.0, "أو لاتّهام نفوسهم بأنهم لم يقوموا بما أوجب الله على الوجه المأمور به شرعًا؟"]], "tr": [[1839.0, "Âişe bu meseleyi müşkil buldu ve onu, Allah'a ibadet eden ama hırsızlık, zina ve içki içmek gibi günah yönleri bulunan kimselere hamletti."], [1850.0, "Peygamber sallallâhu aleyhi ve sellem de ona, bunların namaz kılan, oruç tutan, sadaka veren ve (amellerinin) kendilerinden kabul edilmemesinden korkan kimseler olduğunu açıkladı."], [1860.0, "(Bu korku) Allah'a dönük bir sebepten mi <span class=\"q\">؟<\/span>, yoksa nefislerini, Allah'ın vacip kıldığı şeyi şer'an emredilen şekilde yerine getirmemiş olmakla itham etmelerinden mi?"]]}, {"reader": false, "ar": [[1869.0, "ففي حال الفراغ من التعبُّد لا ينبغي أن تُغلِّب جانبَ الخوف في الجهتين،"], [1876.0, "ولا جانبَ الرجاء في الجهتين،"], [1879.0, "وإنما غلِّبْ جانبَ رجاء القبول إذا نظرتَ إلى سعة رحمة الله عز وجل،"], [1885.0, "وأنك قمتَ بما أمرك به على الوجه الذي أمرك به،"], [1890.0, "مستوفيًا أركانَه وشروطَه وواجباتِه."], [1894.0, "وإذا نظرتَ إلى نفسك وتقصيرها في جنب الله عز وجل فغلِّبْ جانبَ الخوف،"], [1899.0, "وأكثِرْ من دعاء الله عز وجل بالقبول؛"], [1902.0, "لأنك متى ما نظرتَ إلى نفسك بعين الرضا على ما قدّمتَ من العبادات،"], [1909.0, "فإنّ ذلك سيوقعك في المنّة بالتعبُّد على الله عز وجل،"], [1913.0, "وفي جانب العُجب بما قدّمتَه."]], "tr": [[1869.0, "Dolayısıyla taabbudu bitirdiğin hâlde, iki yönde de korku tarafını galip getirmen uygun olmaz;"], [1875.2, "iki yönde de ümit tarafını (galip getirmen uygun olmaz)."], [1879.6, "Bilakis Allah Azze ve Celle'nin rahmetinin genişliğine ve O'nun sana emrettiği şeyi, emrettiği şekilde, rükünlerini, şartlarını ve vaciplerini eksiksiz yerine getirerek yaptığına baktığında kabul ümidi tarafını galip getir."], [1894.0, "Kendi nefsine ve onun Allah Azze ve Celle'nin hakkındaki kusuruna baktığında ise korku tarafını galip getir ve Allah Azze ve Celle'ye kabul için çokça dua et."], [1904.5, "Çünkü sunduğun ibadetler hususunda nefsine hoşnutluk gözüyle baktığın zaman, bu seni taabbudu Allah Azze ve Celle'ye minnet etmeye ve sunduğun şeyle ucba (kendini beğenmeye) düşürür."]]}, {"reader": false, "ar": [[1915.0, "ولذلك من أعظم ما ينبغي سدُّه:"], [1920.0, "النظرُ إلى الثقة في النفس بعد فعل التعبُّدات بأنها قامت بالتعبُّد على الوجه الذي يُرضي الله عز وجل."], [1929.0, "ولو تأمّلتَ في أوّل ذكرٍ بعد الفراغ من الصلاة لوجدتَه استغفارًا،"], [1936.0, "كما في «صحيح مسلم» من حديث ثوبان وعائشة رضي الله عنهما:"], [1941.0, "كان النبيُّ صلى الله عليه وسلم إذا سلّم ـ أو قال:"], [1944.7, "انصرف من صلاته ـ استغفر ثلاثًا."], [1947.0, "فلماذا تستغفر أيّها المسلم وقد أدّيتَ عبادة؟"], [1951.3, "الجواب: ليس في أمرٍ يرجع لله،"], [1954.0, "وإنما في أمرٍ يرجع إلى تقصيرٍ في جنب الله عز وجل."]], "tr": [[1915.0, "Bu yüzden kapatılması gereken en büyük şeylerden biri, taabbudları yaptıktan sonra nefsin, taabbudu Allah Azze ve Celle'yi razı edecek şekilde yerine getirdiğine dair nefse güvene bakmaktır."], [1929.0, "Namazı bitirdikten sonraki ilk zikri düşünürsen onu istiğfar olarak bulursun."], [1935.5, "Nitekim Sahîh-i Müslim'de Sevbân ve Âişe radıyallâhu anhümâ'nın hadisinde (şöyle geçer):"], [1941.0, "Peygamber sallallâhu aleyhi ve sellem selâm verdiğinde —ya da \"namazından ayrıldığında\" dedi— üç kez istiğfar ederdi."], [1947.0, "Ey Müslüman, bir ibadeti eda etmişken niçin istiğfar ediyorsun?"], [1951.3, "Cevap: Allah'a dönük bir sebepten değil, Allah Azze ve Celle'nin hakkındaki bir kusura dönük bir sebepten."]]}, {"reader": false, "ar": [[1958.0, "وكذلك أيضًا إذا فرغ الإنسانُ من الحجّ فإنّ الله عز وجل أمره بكثرة الذكر،"], [1966.5, "والتي منها الاستغفار. فينبغي للإنسان بعد الفراغ من التعبُّدات أو الإكثار منها ألّا يمنّ على ربّه."], [1976.0, "وحقيقةُ المنّة بالتعبُّد: العُجبُ بما قدّمتَ،"], [1981.0, "نظرًا ـ تغليبًا ـ لجانب الرجاء في نفسك."], [1986.0, "فلا نقول في باب التعبُّد بتغليب الرجاء مطلقًا،"], [1992.0, "ولا بتغليب الخوف مطلقًا،"], [1994.0, "وإنما لا بدّ من النظر بهذين الاعتبارين،"], [1997.0, "حتى نضع النقاطَ على الحروف فيها. والله أعلم."]], "tr": [[1958.0, "Aynı şekilde insan haccı bitirdiğinde de Allah Azze ve Celle ona çokça zikretmeyi emretmiştir;"], [1968.0, "istiğfar da bu zikirdendir. Dolayısıyla insan taabbudları bitirdikten ya da onları çoğalttıktan sonra Rabbine minnet etmemelidir."], [1976.0, "Taabbudu minnet etmenin hakikati, nefsinde ümit tarafına bakarak —onu galip getirerek— sunduğun şeyi beğenmendir."], [1986.0, "Taabbud babında ne mutlak olarak ümidin galip getirilmesini ne de mutlak olarak korkunun galip getirilmesini söyleriz;"], [1994.0, "bilakis bu meselede noktaları harflerin üzerine koymak (meseleyi netleştirmek) için bu iki itibarla bakmak gerekir. Allah en iyisini bilir."]]}]}, {"ts": "33:21", "title": "7. Külliye: Allah'ın rahmetinden ümit kesmeye sevk eden her korku büyük günahtır", "paras": [{"reader": false, "ar": [[2001.0, "ومن الكلّيّات أيضًا: <b>كلُّ خوفٍ يحمل على القنوط ـ من الله ـ من رحمة الله تعالى فكبيرة.<\/b> <span class=\"note\">(يكررها)<\/span> وهذا واضح:"], [2017.4, "<b>كلُّ خوفٍ يحمل على القنوط من رحمة الله فكبيرة.<\/b>"]], "tr": [[2001.0, "Külliyelerden biri de şudur: 7."], [2006.0, "külliye: (Kişiyi) Allah'tan —Allah Teâlâ'nın rahmetinden— ümit kesmeye sevk eden her korku büyük günahtır. (Tekrar ediyor.) Bu açıktır:"], [2017.4, "<b>7. külliye: Allah'ın rahmetinden ümit kesmeye sevk eden her korku büyük günahtır.<\/b>"]]}, {"reader": false, "ar": [[2027.0, "وقد نهانا اللهُ عز وجل عن هذا الخوف الذي يُثمر هذه الثمرة،"], [2033.0, "فقال الله عز وجل:"], [2035.8, "<span class=\"ayah\">﴿لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ﴾<\/span> <span class=\"ref\">[الزمر: ٥٣]<\/span>."], [2040.0, "وقال الله عز وجل:"], [2042.2, "<span class=\"ayah\">﴿إِنَّهُ لَا يَيْأَسُ مِن رَّوْحِ اللَّهِ إِلَّا الْقَوْمُ الْكَافِرُونَ﴾<\/span> <span class=\"ref\">[يوسف: ٨٧]<\/span>."], [2047.0, "وقال الله عز وجل:"], [2049.2, "<span class=\"ayah\">﴿وَإِذَا أَنْعَمْنَا عَلَى الْإِنسَانِ أَعْرَضَ وَنَأَىٰ بِجَانِبِهِ ۖ وَإِذَا مَسَّهُ الشَّرُّ كَانَ يَئُوسًا﴾<\/span> <span class=\"ref\">[الإسراء: ٨٣]<\/span>."], [2056.0, "وفي الحديث يقول النبيُّ صلى الله عليه وسلم:"], [2061.2, "«الكبائرُ: الشركُ بالله، واليأسُ من رَوْح الله، والقنوطُ من رحمة الله»،"], [2072.0, "كما أخرجه البزّار، وحسّن إسنادَه الإمامُ الألبانيُّ رحمه الله تعالى."]], "tr": [[2027.0, "Allah Azze ve Celle bizi bu meyveyi veren korkudan nehyetmiş ve şöyle buyurmuştur:"], [2032.0, "<span class=\"ayah\">﴿Allah'ın rahmetinden ümidinizi kesmeyin﴾<\/span> [Zümer 53]."], [2035.8, "Allah Azze ve Celle şöyle buyurdu:"], [2040.0, "<span class=\"ayah\">﴿Allah'ın rahmetinden ancak kâfirler topluluğu ümit keser﴾<\/span> [Yûsuf 87]."], [2043.8, "Allah Azze ve Celle şöyle buyurdu:"], [2047.0, "<span class=\"ayah\">﴿İnsana nimet verdiğimizde yüz çevirir ve yan çizer; ona bir kötülük dokunduğunda da büsbütün ümitsiz olur﴾<\/span> [İsrâ 83]."], [2056.0, "Hadiste Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [2061.2, "\"Büyük günahlar: Allah'a şirk koşmak, Allah'ın ravhından ümit kesmek ve Allah'ın rahmetinden ümitsizliğe düşmektir.\" Bunu Bezzâr rivayet etmiş, İmam Elbânî —Allah ona rahmet etsin— de isnadını hasen saymıştır."]]}, {"reader": false, "ar": [[2077.0, "وكذلك روى الطبرانيُّ في «معجمه» عن ابن مسعودٍ رضي الله عنه أنه قال:"], [2085.1, "«أكبرُ الكبائر: الإشراكُ بالله، والأمنُ من مكر الله، والقنوطُ من رحمة الله، واليأسُ من رَوْح الله»."], [2095.0, "وقد جعل الله عز وجل القنوطَ واليأسَ من رَوْحه ورحمته من صفات الكافرين،"], [2105.0, "فقال الله عز وجل:"], [2107.2, "<span class=\"ayah\">﴿إِنَّهُ لَا يَيْأَسُ مِن رَّوْحِ اللَّهِ إِلَّا الْقَوْمُ الْكَافِرُونَ﴾<\/span> <span class=\"ref\">[يوسف: ٨٧]<\/span>."], [2112.0, "قال الإمامُ ابنُ عطيّة رحمه الله تعالى:"], [2115.0, "«اليأسُ من رحمة الله وتفريجِه من صفة الكافرين»."]], "tr": [[2077.0, "Aynı şekilde Taberânî Mu'cem'inde İbn Mes'ûd radıyallâhu anh'dan şöyle dediğini rivayet etmiştir:"], [2085.1, "\"Büyük günahların en büyüğü: Allah'a şirk koşmak, Allah'ın mekrinden emin olmak, Allah'ın rahmetinden ümitsizliğe düşmek ve Allah'ın ravhından ümit kesmektir.\" Allah Azze ve Celle, ravhından ve rahmetinden ümitsizliği ve ümit kesmeyi kâfirlerin sıfatlarından kılmış ve şöyle buyurmuştur:"], [2107.2, "<span class=\"ayah\">﴿Allah'ın rahmetinden ancak kâfirler topluluğu ümit keser﴾<\/span> [Yûsuf 87]."], [2112.0, "İmam İbn Atıyye —Allah ona rahmet etsin— şöyle dedi:"], [2115.0, "\"Allah'ın rahmetinden ve (sıkıntıyı) gidermesinden ümit kesmek kâfirin sıfatındandır.\""]]}, {"reader": false, "ar": [[2120.0, "وقال الإمامُ البغويُّ رحمه الله تعالى في قول الله عز وجل:"], [2125.0, "<span class=\"ayah\">﴿وَإِن تُصِبْهُمْ سَيِّئَةٌ بِمَا قَدَّمَتْ أَيْدِيهِمْ إِذَا هُمْ يَقْنَطُونَ﴾<\/span> <span class=\"ref\">[الروم: ٣٦]<\/span>،"], [2132.0, "أي يخافون من الله خوفًا يُخرجهم إلى القنوط."], [2136.0, "قال رحمه الله: «أي ييأسون من رحمة الله، وهذا خلافُ وصف المؤمن؛ فإنه يشكر اللهَ عند النعمة، ويرجو ربَّه عند الشدّة». انتهى كلامه."]], "tr": [[2120.0, "İmam Begavî —Allah ona rahmet etsin— Allah Azze ve Celle'nin şu sözü hakkında:"], [2125.0, "<span class=\"ayah\">﴿Kendi ellerinin önceden yaptıkları yüzünden başlarına bir kötülük gelince hemen ümitsizliğe düşerler﴾<\/span> [Rûm 36] —yani Allah'tan, kendilerini ümitsizliğe çıkaracak bir korkuyla korkarlar— şöyle dedi:"], [2137.9, "\"Yani Allah'ın rahmetinden ümit keserler."], [2140.4, "Bu, mü'minin vasfına aykırıdır; çünkü mü'min nimet anında Allah'a şükreder, sıkıntı anında Rabbini umar.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2151.0, "قال الرازيُّ رحمه الله تعالى في قول الله عز وجل:"], [2156.0, "<span class=\"ayah\">﴿وَإِذَا مَسَّهُ الشَّرُّ كَانَ يَئُوسًا﴾<\/span> <span class=\"ref\">[الإسراء: ٨٣]<\/span>،"], [2160.0, "قال كلامًا جميلًا أنقله لكم وإن كان طويلًا،"], [2166.0, "لكن أحاول أن أختصره ما استطعت."], [2168.0, "قال: «أي إن فاز بالنعمة والدولة اغترّ بها فنسيَ ذكرَ الله»."], [2176.0, "ثم قال كلامًا طويلًا وآخرُه:"], [2180.0, "«وإن بقيَ في الحرمان عن الدنيا استولى عليه الأسفُ والحزن، ولم يتفرّغ لذكر الله عز وجل، فهذا المسكينُ محرومٌ أبدًا عن ذكر الله عز وجل»."]], "tr": [[2151.0, "Râzî —Allah ona rahmet etsin— Allah Azze ve Celle'nin şu sözü hakkında:"], [2156.0, "<span class=\"ayah\">﴿Ona bir kötülük dokunduğunda da büsbütün ümitsiz olur﴾<\/span> [İsrâ 83] güzel bir söz söylemiştir;"], [2163.6, "uzun olsa da onu size naklediyorum, ama elimden geldiğince kısaltmaya çalışacağım."], [2168.0, "Şöyle dedi: \"Yani nimete ve devlete (talihin dönmesine) kavuşursa onunla aldanır ve Allah'ı zikretmeyi unutur.\" Sonra uzun bir söz söyledi;"], [2180.0, "sonu şudur: \"Dünyadan mahrum kalırsa onu esef ve hüzün kaplar ve Allah Azze ve Celle'yi zikretmeye vakit bulamaz."], [2190.0, "Bu zavallı, Allah Azze ve Celle'yi zikretmekten ebediyen mahrumdur.\""]]}, {"reader": false, "ar": [[2195.0, "وقال الإمامُ أبو قِلابة رحمه الله تعالى:"], [2198.0, "«الرجلُ يصيب الذنبَ فيقول: قد هلكتُ، ليس لي توبة، فييأس من رحمة الله، وينهمك في المعاصي، فنهاهم الله تعالى عن ذلك»."], [2211.0, "قال الله عز وجل:"], [2212.8, "<span class=\"ayah\">﴿إِنَّهُ لَا يَيْأَسُ مِن رَّوْحِ اللَّهِ إِلَّا الْقَوْمُ الْكَافِرُونَ﴾<\/span> <span class=\"ref\">[يوسف: ٨٧]<\/span>."], [2217.0, "وقال الإمامُ ابنُ القيّم رحمه الله تعالى وهو يعدّد الكبائر،"], [2221.0, "قال: «القنوطُ من رحمة الله، واليأسُ من رَوْح الله، وتوابعُ هذه الأمور التي هي أشدُّ تحريمًا من الزنا وشرب الخمر وغيرهما من الكبائر الظاهرة، ولا صلاحَ للقلب ولا للجسد إلا باجتنابها والتوبة منها، وإلا فهو قلبٌ فاسد، وإذا فسد القلبُ فسد البدن»."]], "tr": [[2195.0, "İmam Ebû Kılâbe —Allah ona rahmet etsin— şöyle dedi:"], [2196.3, "\"Adam bir günah işler de 'Helâk oldum, benim için tövbe yok' der;"], [2198.0, "böylece Allah'ın rahmetinden ümit keser ve günahlara dalar."], [2202.0, "Allah Teâlâ onları bundan nehyetti.\" Allah Azze ve Celle şöyle buyurdu:"], [2207.6, "<span class=\"ayah\">﴿Allah'ın rahmetinden ancak kâfirler topluluğu ümit keser﴾<\/span> [Yûsuf 87]."], [2211.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— büyük günahları sayarken şöyle dedi:"], [2212.8, "\"Allah'ın rahmetinden ümitsizliğe düşmek, Allah'ın ravhından ümit kesmek ve bunlara tâbi olan şeyler;"], [2217.0, "ki bunlar zinadan, içki içmekten ve diğer zâhirî büyük günahlardan daha şiddetli haramdır."], [2221.6, "Kalbin ve bedenin salâhı ancak bunlardan kaçınmak ve bunlardan tövbe etmekle olur."], [2232.7, "Aksi hâlde o, bozuk bir kalptir;"], [2241.0, "kalp bozulunca da beden bozulur.\""]]}, {"reader": false, "ar": [[2246.0, "والخلاصةُ من هذه الكلّيّة:"], [2247.7, "أنّ اليأسَ من رَوْح الله والقنوطَ من رحمته من أعظم ما يُفضي بالعبد إلى ترك العمل،"], [2257.0, "وإلى الانهماك في المعصية،"], [2259.0, "إذ لا فائدةَ من التوبة بزعمه."], [2262.0, "وهذه من أعظم الطوامّ،"], [2264.3, "ومن أعظم الكبائر التي يحاول الشيطانُ أن يُقنع قلوبَنا بها، نعوذ بالله منه."]], "tr": [[2246.0, "Bu külliyenin özeti şudur: Allah'ın ravhından ümit kesmek ve rahmetinden ümitsizliğe düşmek, kulu ameli terk etmeye ve günaha dalmaya götüren en büyük şeylerdendir;"], [2258.5, "çünkü onun iddiasına göre tövbenin faydası yoktur."], [2262.0, "Bu, en büyük felaketlerden ve şeytanın kalplerimizi ikna etmeye çalıştığı en büyük günahlardandır. Ondan Allah'a sığınırız."]]}]}, {"ts": "37:50", "title": "8. Külliye: Sahibini Allah'ın mekrinden emin olmaya sevk eden her ümit büyük günahtır", "paras": [{"reader": false, "ar": [[2270.0, "ومن الكلّيّات أيضًا: <b>كلُّ رجاءٍ يحمل صاحبَه على الأمن ـ<\/b> <b>كلُّ رجاءٍ يحمل صاحبَه على الأمن من مكر الله فكبيرة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2270.0, "Külliyelerden biri de şudur: 8."], [2272.0, "külliye: Sahibini emin olmaya —<b> <\/b>8."], [2274.5, "külliye: Sahibini Allah'ın mekrinden emin olmaya sevk eden her ümit büyük günahtır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2297.0, "أقول وبالله التوفيق: إن قلتَ:"], [2300.2, "وما معنى الأمن من مكر الله؟"], [2304.0, "فأقول: معناه كونُ الإنسان يطمئنّ قلبُه ولا يخاف من عقوبة الله،"], [2311.0, "ويأمن جانبَ الله عز وجل أمنًا تامًّا بأنّ الله عز وجل لن يؤاخذه،"], [2320.0, "ولن يحاسبه، ولن يعاقبه على ما يصدر منه من التقصير والهفوات الشرعيّة؛"], [2325.0, "فمهما فعل من السيّئات فإنّ الله عز وجل لن يعاقبه."], [2331.0, "فهذا الظنُّ يسمّيه أهلُ العلم بالأمن من مكر الله عز وجل،"], [2338.0, "فلا يبالي بالله عز وجل،"], [2340.5, "ولا يبالي بمأموراته، ولا بارتكاب منهيّاته، ولا يخاف عقوبتَه."]], "tr": [[2297.0, "Tevfik Allah'tandır, derim ki: Eğer \"Allah'ın mekrinden emin olmanın anlamı nedir?\" dersen, derim ki:"], [2304.0, "Anlamı, insanın kalbinin rahat olması, Allah'ın cezasından korkmaması ve Allah Azze ve Celle'nin kendisini kendisinden sadır olan kusur ve şer'î hatalardan dolayı sorgulamayacağından, hesaba çekmeyeceğinden ve cezalandırmayacağından tam bir emniyetle Allah Azze ve Celle tarafından emin olmasıdır;"], [2325.0, "ne kadar kötülük yaparsa yapsın Allah Azze ve Celle onu cezalandırmayacaktır (diye düşünmesidir)."], [2331.0, "İlim ehli bu zannı \"Allah Azze ve Celle'nin mekrinden emin olmak\" diye adlandırır."], [2337.4, "Böylesi Allah Azze ve Celle'ye aldırmaz;"], [2340.0, "O'nun emirlerine de, yasaklarını işlemeye de aldırmaz ve O'nun cezasından korkmaz."]]}, {"reader": false, "ar": [[2346.0, "فإن قلتَ: وما الذي يحمل الإنسانَ على ذلك؟"], [2350.0, "الجواب: عدّةُ أمور. الأمرُ الأوّل ـ وهو أعظمُها ـ:"], [2355.0, "الجهلُ بالله؛ فإنّ كثيرًا ممّن أمنوا من مكر الله حقيقةُ أمنهم <span class=\"q\">؟ 39:20<\/span> سببُه أنهم ما عرفوا الله عز وجل،"], [2364.0, "وما عرفوا من الله إلا أنه غفورٌ رحيمٌ ودودٌ لطيف،"], [2371.0, "ولكن لم يعرفوه أنه جبّارٌ قيّومٌ شديدُ العقاب،"], [2376.0, "وغيرُ ذلك من صفات الرَّهَب."], [2378.0, "فكلّما عظُم جهلُ القلب بالله كلّما وقع إمّا في الأمن من مكر الله،"], [2384.2, "أو اليأس من رَوْح الله."]], "tr": [[2346.0, "Eğer \"İnsanı buna ne sevk eder?\" dersen, cevap:"], [2350.0, "Birkaç şey. Birincisi —ki en büyüğüdür—:"], [2353.0, "Allah'ı tanımamak (Allah hakkında cehalet)."], [2355.0, "Allah'ın mekrinden emin olanların çoğunun emin olmasının <span class=\"q\">؟<\/span> hakikati, onların Allah Azze ve Celle'yi tanımamalarından kaynaklanır."], [2363.1, "Allah hakkında sadece O'nun Gafûr, Rahîm, Vedûd ve Latîf olduğunu bildiler;"], [2370.3, "ama O'nun Cebbâr, Kayyûm, cezası çetin olduğunu ve bunun dışındaki korku uyandıran sıfatlarını bilmediler."], [2378.0, "Kalbin Allah hakkındaki cehaleti ne kadar büyük olursa, ya Allah'ın mekrinden emin olmaya ya da Allah'ın ravhından ümit kesmeye o kadar düşer."]]}, {"reader": false, "ar": [[2386.0, "السببُ الثاني: غرورُ النفس؛"], [2392.0, "فإنّ من الناس من يحمله غرورُه على أنّ الله لن يعذّبه،"], [2399.0, "كما قال الله عز وجل عن صاحب الجنّة:"], [2402.0, "<span class=\"ayah\">﴿وَلَئِن رُّدِدتُّ إِلَىٰ رَبِّي لَأَجِدَنَّ خَيْرًا مِّنْهَا مُنقَلَبًا﴾<\/span> <span class=\"ref\">[الكهف: ٣٦]<\/span>."], [2407.0, "فيقول: إذا أنعم الله عز وجل عليّ في هذه الدنيا بالنعم الوفيرة الكثيرة وبالمال الغزير،"], [2415.0, "فإنّ هذا أوائلُ إكرامه لي في الدنيا،"], [2418.3, "وما ينتظرني في الآخرة من إكرامه أكثرُ وأكثر."], [2422.0, "هذا حقيقةُ الغرور. ولذلك قال الله عز وجل:"], [2427.0, "<span class=\"ayah\">﴿وَلَا يَغُرَّنَّكُم بِاللَّهِ الْغَرُورُ﴾<\/span> <span class=\"ref\">[لقمان: ٣٣]<\/span>،"], [2430.0, "أي لا تتقحّموا معاصيَه ثم تأمنوا من مكره."], [2435.0, "فغرورُ النفس هذا شيءٌ عجيب."]], "tr": [[2386.0, "İkinci sebep: Nefsin gururu (aldanışı)."], [2392.0, "İnsanlardan bazısını gururu, Allah'ın kendisine azap etmeyeceği (inancına) sevk eder."], [2398.2, "Nitekim Allah Azze ve Celle bahçe sahibi hakkında şöyle buyurdu:"], [2402.0, "<span class=\"ayah\">﴿Eğer Rabbime döndürülürsem, andolsun ki dönüş yeri olarak bundan daha hayırlısını bulurum﴾<\/span> [Kehf 36]."], [2407.0, "Şöyle der: Allah Azze ve Celle bu dünyada bana bol ve çok nimetler ve bol mal verdiyse, bu O'nun dünyada bana ikramının başlangıcıdır;"], [2418.7, "âhirette beni bekleyen ikramı daha da fazladır."], [2422.0, "İşte gururun hakikati budur. Bu yüzden Allah Azze ve Celle şöyle buyurdu:"], [2427.0, "<span class=\"ayah\">﴿Aldatıcı (şeytan) sizi Allah hakkında aldatmasın﴾<\/span> [Lokmân 33];"], [2430.6, "yani O'na isyanlara dalıp da sonra O'nun mekrinden emin olmayın."], [2435.0, "Nefsin bu gururu şaşılacak bir şeydir."]]}]}, {"ts": "40:39", "title": "8. Külliye (devam): Başkasının ameline güvenmek; neseb ve yakınlık kurtarmaz", "paras": [{"reader": false, "ar": [[2439.0, "ومن الأسباب أيضًا: الاعتمادُ على عمل الغير؛"], [2449.0, "كأن يكون الإنسانُ من جملة نسب النبيّ صلى الله عليه وسلم،"], [2454.0, "أو أن يكون قريبًا من بعض الأولياء والصالحين،"], [2458.0, "فيقول: بما أنني نسيبٌ لهذا الوليّ،"], [2461.0, "أو نسيبٌ لهذا النبيّ،"], [2464.0, "أو قريبٌ لهذا الصالح العابد،"], [2467.0, "فسيُغفر لي. فأخبر الله عز وجل يوم القيامة أنّ الأنساب تتقطّع،"], [2475.0, "قال الله عز وجل:"], [2477.0, "<span class=\"ayah\">﴿فَلَا أَنسَابَ بَيْنَهُمْ يَوْمَئِذٍ وَلَا يَتَسَاءَلُونَ﴾<\/span> <span class=\"ref\">[المؤمنون: ١٠١]<\/span>."]], "tr": [[2439.0, "Sebeplerden biri de başkasının ameline güvenmektir."], [2449.0, "Meselâ insanın, Peygamber sallallâhu aleyhi ve sellem'in nesebinden olması ya da bazı velîlere ve sâlihlere yakın olması gibi."], [2458.5, "Şöyle der: Ben bu velînin akrabası, ya da bu peygamberin akrabası, ya da bu sâlih âbidin yakını olduğuma göre bağışlanacağım."], [2469.0, "Allah Azze ve Celle de kıyamet günü nesep bağlarının kopacağını haber vermiştir."], [2474.3, "Allah Azze ve Celle şöyle buyurdu:"], [2477.0, "<span class=\"ayah\">﴿O gün aralarında soy bağları yoktur ve birbirlerine (bir şey) soramazlar﴾<\/span> [Mü'minûn 101]."]]}, {"reader": false, "ar": [[2481.0, "وقال الله عز وجل:"], [2482.7, "<span class=\"ayah\">﴿وَلَا يَسْأَلُ حَمِيمٌ حَمِيمًا ۝ يُبَصَّرُونَهُمْ ۚ يَوَدُّ الْمُجْرِمُ لَوْ يَفْتَدِي مِنْ عَذَابِ يَوْمِئِذٍ بِبَنِيهِ ۝ وَصَاحِبَتِهِ وَأَخِيهِ ۝ وَفَصِيلَتِهِ الَّتِي تُؤْوِيهِ ۝ وَمَن فِي الْأَرْضِ جَمِيعًا ثُمَّ يُنجِيهِ﴾<\/span> <span class=\"ref\">[المعارج: ١٠–١٤]<\/span>."], [2498.0, "وقال الله عز وجل:"], [2499.8, "<span class=\"ayah\">﴿يَوْمَ يَفِرُّ الْمَرْءُ مِنْ أَخِيهِ ۝ وَأُمِّهِ وَأَبِيهِ ۝ وَصَاحِبَتِهِ وَبَنِيهِ ۝ لِكُلِّ امْرِئٍ مِّنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ﴾<\/span> <span class=\"ref\">[عبس: ٣٤–٣٧]<\/span>."], [2507.0, "ولذلك قال النبيُّ صلى الله عليه وسلم:"], [2510.0, "«يا فاطمة، سليني من مالي ما شئتِ، لا أُغني عنكِ من الله شيئًا» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[2481.0, "Allah Azze ve Celle şöyle buyurdu:"], [2482.7, "<span class=\"ayah\">﴿Hiçbir yakın dost, yakın dostunu sormaz. Birbirlerine gösterilirler. Suçlu kimse, o günün azabından kurtulmak için fidye olarak oğullarını, eşini, kardeşini, kendisini barındıran aşiretini ve yeryüzündekilerin hepsini verip de sonra kendisini kurtarmak ister﴾<\/span> [Meâric 10–14]."], [2498.0, "Allah Azze ve Celle şöyle buyurdu:"], [2499.8, "<span class=\"ayah\">﴿O gün kişi kardeşinden, annesinden, babasından, eşinden ve oğullarından kaçar. O gün onlardan her birinin kendisine yetecek bir işi vardır﴾<\/span> [Abese 34–37]."], [2507.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2510.0, "\"Ey Fâtıma! Malımdan dilediğini benden iste;"], [2512.3, "(ama) seni Allah'tan (gelecek hiçbir şeyden) kurtaramam.\" <span class=\"note\">(Buhârî, Müslim)<\/span>"]]}, {"reader": false, "ar": [[2516.0, "فإنّ من الناس من قد يغترّ بقربه أو نسبته لبعض الأولياء والصالحين أو الأنبياء،"], [2523.0, "ويقول: بما أنني من جملتهم فإنهم سيشفعون لي يوم القيامة،"], [2529.0, "وستُغفر لي ذنوبي، وسيكفّر الله عني سيّئاتي بسبب قربي لهذا الصالح."], [2540.0, "ولذلك قال الله عز وجل عن إبراهيم ـ عن إبراهيم ـ:"], [2544.0, "أنّ بُنوّة هذا النبيّ لهذا الوالد الكافر المسمّى بآزر لا تنفعه يوم القيامة."], [2555.0, "ولم يستجب اللهُ عز وجل لخليله إبراهيم لمّا قال:"], [2561.0, "<span class=\"ayah\">﴿وَاغْفِرْ لِأَبِي إِنَّهُ كَانَ مِنَ الضَّالِّينَ﴾<\/span> <span class=\"ref\">[الشعراء: ٨٦]<\/span>،"], [2564.0, "ونهاه اللهُ عز وجل عن هذا الاستغفار في قوله:"], [2568.1, "<span class=\"ayah\">﴿مَا كَانَ لِلنَّبِيِّ وَالَّذِينَ آمَنُوا أَن يَسْتَغْفِرُوا لِلْمُشْرِكِينَ وَلَوْ كَانُوا أُولِي قُرْبَىٰ مِن بَعْدِ مَا تَبَيَّنَ لَهُمْ أَنَّهُمْ أَصْحَابُ الْجَحِيمِ﴾<\/span> <span class=\"ref\">[التوبة: ١١٣]<\/span>."]], "tr": [[2516.0, "İnsanlardan bazısı bazı velîlere, sâlihlere ya da peygamberlere yakınlığı veya nesebiyle aldanabilir ve şöyle der:"], [2523.6, "Ben onlardan olduğuma göre kıyamet günü bana şefaat edecekler, bu sâlih kimseye yakınlığım sebebiyle günahlarım bağışlanacak ve Allah benim kötülüklerimi örtecek."], [2540.0, "Bu yüzden Allah Azze ve Celle İbrâhîm hakkında —İbrâhîm hakkında— bu peygamberin, Âzer adındaki bu kâfir babanın oğlu olmasının ona (babaya) kıyamet günü fayda vermeyeceğini (haber verdi)."], [2555.0, "Allah Azze ve Celle, dostu İbrâhîm şöyle dediğinde ona icabet etmedi:"], [2561.0, "<span class=\"ayah\">﴿Babamı bağışla, çünkü o sapıklardan oldu﴾<\/span> [Şuarâ 86]."], [2564.0, "Allah Azze ve Celle onu şu sözüyle bu istiğfardan nehyetti:"], [2568.1, "<span class=\"ayah\">﴿Cehennemlik oldukları kendilerine apaçık belli olduktan sonra, akraba bile olsalar, müşrikler için af dilemek ne Peygamber'e ne de iman edenlere yaraşır﴾<\/span> [Tevbe 113]."]]}, {"reader": false, "ar": [[2579.0, "وما نفعت زوجيّةُ امرأة نوحٍ ولوطٍ لهذين النبيّين الكريمين،"], [2585.0, "وأخبر الله عز وجل أنّ مجرّد الزوجيّة ـ وإن كانت من أقرب ما تكون للإنسان ـ إلا أنها غيرُ نافعةٍ إذا لم تكن مبنيّةً على توحيدٍ وإيمانٍ وإخلاص،"], [2595.0, "وهكذا في آياتٍ كثيرة."], [2599.0, "والنبيُّ صلى الله عليه وسلم لمّا سُئل:"], [2602.5, "يا رسول الله، أين أبي؟"], [2605.0, "قال: «أبوك في النار»،"], [2607.0, "فلمّا ولّى دعاه فقال:"], [2608.8, "«إنّ أبي وأباك في النار» <span class=\"note\">(Müslim)<\/span>."], [2611.0, "فلا يُغني صالحٌ عن طالح،"], [2614.0, "ولا تنفع قرابةُ الصالحين إلا إذا كانت مبنيّةً على الإيمان الصحيح،"], [2620.6, "والتوحيد الصافي، والعمل المقبول."], [2623.0, "فلا يغرّنّك أبدًا قربُ أحدٍ من الصالحين لك."]], "tr": [[2579.0, "Nûh'un ve Lût'un hanımlarının zevceliği, bu iki kerim peygambere fayda vermedi."], [2586.3, "Allah Azze ve Celle, sırf zevceliğin —insana en yakın şeylerden olsa da— tevhid, iman ve ihlâs üzerine kurulu olmadığı zaman fayda vermediğini haber verdi;"], [2599.0, "birçok ayette de böyledir. Peygamber sallallâhu aleyhi ve sellem'e \"Ey Allah'ın Resûlü, babam nerede?\" diye sorulduğunda \"Baban ateştedir\" buyurdu."], [2605.0, "
