> <span class=\"ref\">[الطور: ٣٠]<\/span>،"], [2959.0, "ويقول الله عز وجل:"], [2960.8, "<span class=\"ayah\">﴿وَمَا هُوَ بِقَوْلِ شَاعِرٍ ۚ قَلِيلًا مَّا تُؤْمِنُونَ ۝ وَلَا بِقَوْلِ كَاهِنٍ ۚ قَلِيلًا مَّا تَذَكَّرُونَ ۝ تَنزِيلٌ مِّن رَّبِّ الْعَالَمِينَ﴾<\/span> <span class=\"ref\">[الحاقة: ٤١–٤٣]<\/span>."]], "tr": [[2934.0, "Velîd b. el-Muğîre Kur'an'ı işitip onun doğruluğuna inandığında şöyle dedi:"], [2938.3, "<span class=\"ayah\">﴿Bu, (öncekilerden) aktarılan bir büyüden başka bir şey değildir. Bu ancak beşer sözüdür﴾<\/span> [Müddessir 24–25]."], [2943.8, "Böylece hakka bir elbise —ne?— bâtıl bir elbise giydirdi ki insanlar onu reddetsin."], [2948.1, "Yine: <span class=\"ayah\">﴿Yoksa \"O bir şairdir, biz onun zamanın felaketine uğramasını bekliyoruz\" mu diyorlar?﴾<\/span> [Tûr 30] Allah Azze ve Celle şöyle buyurur:"], [2960.4, "<span class=\"ayah\">﴿O bir şair sözü değildir; ne kadar da az inanıyorsunuz! Bir kâhin sözü de değildir; ne kadar da az düşünüyorsunuz! O, âlemlerin Rabbinden indirilmedir﴾<\/span> [Hâkka 41–43]."]]}, {"reader": false, "ar": [[2969.0, "وقد ورث هذا المنهجَ الإبليسيَّ أتباعُ الأمم الماضية من هذه الأمّة؛"], [2981.0, "فإنك تجدهم دائمًا يصفون باطلهم بصفاتٍ مليحةٍ ليُقبَل،"], [2987.0, "ويصفون أهلَ الحقّ ـ والحقّ ـ ويصفون الحقَّ وأهلَه بصفاتٍ قبيحةٍ ليُرَدّ."]], "tr": [[2969.0, "Bu iblisçe metodu, bu ümmetten geçmiş ümmetlere uyanlar miras almıştır."], [2974.5, "Görürsün ki bâtıllarını kabul edilsin diye daima hoş sıfatlarla nitelerler;"], [2985.3, "hak ehlini —ve hakkı—, hakkı ve ehlini de reddedilsin diye çirkin sıfatlarla nitelerler."]]}, {"reader": false, "ar": [[2993.0, "قال أبو حاتمٍ الرازيّ رحمه الله تعالى:"], [2997.0, "«علامةُ الجهميّة تسميتُهم أهلَ السنة مشبِّهة، وعلامةُ القدريّة تسميتُهم أهلَ السنة مُجبِرة» ـ جبريّة يعني ـ «وعلامةُ المرجئة تسميتُهم أهلَ السنة مخالِفةً ونُقصانيّة» ـ لأنّ أهل السنة يقولون:"], [3021.3, "الإيمان يزيد وينقص ـ «وعلامةُ الرافضة تسميتُهم أهلَ السنة ناصبة»."], [3029.0, "انتهى كلامه رحمه الله."]], "tr": [[2993.0, "Ebû Hâtim er-Râzî —Allah ona rahmet etsin— şöyle dedi:"], [2996.4, "\"Cehmiyye'nin alâmeti, Ehl-i Sünnet'i 'Müşebbihe' diye isimlendirmeleridir."], [3000.8, "Kaderiyye'nin alâmeti, Ehl-i Sünnet'i 'Mücbire' diye isimlendirmeleridir\" —yani Cebriyye— \"Mürcie'nin alâmeti, Ehl-i Sünnet'i 'Muhâlife' ve 'Nuksâniyye' diye isimlendirmeleridir\" —çünkü Ehl-i Sünnet \"İman artar ve eksilir\" der— \"Râfıza'nın alâmeti de Ehl-i Sünnet'i 'Nâsıbe' diye isimlendirmeleridir.\" Onun —Allah ona rahmet etsin— sözü burada bitti."]]}, {"reader": false, "ar": [[3033.0, "ولا نزال نسمع من يسمّي الشركَ بالأولياء والصالحين توسّلًا بأهل المقامات العالية،"], [3043.0, "ويسمّي الخمرَ بأمّ الأرواح،"], [3047.0, "ويسمّي التعطيلَ ـ تعطيلَ الله عن صفاته ـ يسمّيه تنزيهًا للخالق عن مشابهة المخلوق."], [3056.0, "وتجد أنّ المعتزلة يسمّون الخروجَ على الحكّام بالأمر بالمعروف والنهي عن المنكر،"], [3067.3, "وهو من أصولهم الخمسة،"], [3070.0, "ويسمّون إخراجَ فعل العبد عن كونه مخلوقًا لله ـ يسمّون هذا الباطلَ والكفرَ والبهتانَ ـ يسمّونه العدل:"], [3079.0, "هذا من عدل الله!"]], "tr": [[3033.0, "Hâlâ velîlerle ve salihlerle şirk koşmayı \"yüksek makam sahipleriyle tevessül\" diye isimlendiren, içkiyi \"ruhların anası\" diye isimlendiren, ta'tili —Allah'ı sıfatlarından soyutlamayı— \"Yaratanı yaratılana benzemekten tenzih\" diye isimlendiren kimseleri işitmekteyiz."], [3056.7, "Mu'tezile'nin, yöneticilere karşı ayaklanmayı \"iyiliği emretmek ve kötülükten nehyetmek\" diye isimlendirdiğini görürsün;"], [3068.0, "bu, onların beş esasından biridir."], [3071.2, "Kulun fiilini Allah'ın mahlûku olmaktan çıkarmayı —bu bâtılı, küfrü ve iftirayı— \"adalet\" diye isimlendirirler: \"Bu, Allah'ın adaletindendir!\""]]}, {"reader": false, "ar": [[3081.0, "وكما قال صلى الله عليه وسلم:"], [3087.0, "«لَيشربنّ ناسٌ الخمرَ يسمّونها بغير اسمها»."], [3092.0, "ونسمع كثيرًا استحلالَ الربا باسم الفوائد والعوائد البنكيّة،"], [3099.0, "والمكافآت الماليّة، والجوائز الدوريّة،"], [3102.0, "وهو في حقيقته ربا."], [3107.0, "ويسمّون التبرّجَ والسفورَ واختلاطَ الرجال بالنساء تطوّرًا وتحضّرًا وتقدّميّة."]], "tr": [[3081.0, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [3083.3, "\"Andolsun, birtakım insanlar içkiyi, onu kendi adından başka bir adla adlandırarak içeceklerdir.\" Faizin, banka faizleri ve getirileri, maddi ödüller ve dönemsel ikramiyeler adı altında helal sayıldığını sıkça işitiyoruz;"], [3101.2, "oysa o, hakikatinde faizdir. Teberrücü (süslenip açılmayı), örtüsüzlüğü ve kadın-erkek karışımını da gelişme, medenîlik ve ilericilik diye isimlendirirler."]]}, {"reader": false, "ar": [[3117.0, "ولو سبرتَ أهلَ الباطل لوجدتَ أنّ هذا منهجُهم الذي ورثوه عمّن قبلهم،"], [3123.0, "وورثوه عن إبليس. فكلُّ من رأيته يصف الحقَّ بغير صفاته ليُخرج الناسَ عنه فهو من أهل البدع،"], [3134.0, "وكلُّ من رأيته يصف الباطلَ بصفاتٍ جميلةٍ ليرغّب الناسَ فيه فهذا من أهل البدع،"], [3142.0, "وما أكثرَهم في هذا الزمان، لا كثّرهم <span class=\"q\">؟ 52:22<\/span>!"]], "tr": [[3117.0, "Bâtıl ehlini araştırırsan bunun, kendilerinden öncekilerden miras aldıkları ve İblis'ten miras aldıkları metotları olduğunu görürsün."], [3124.9, "İnsanları haktan çıkarmak için hakkı kendi sıfatlarından başka sıfatlarla nitelediğini gördüğün herkes bid'at ehlindendir."], [3133.0, "İnsanları bâtıla rağbet ettirmek için onu güzel sıfatlarla nitelediğini gördüğün herkes de bid'at ehlindendir."], [3140.5, "Bu zamanda ne kadar da çokturlar —(Allah) onları çoğaltmasın <span class=\"q\">؟<\/span>!"]]}]}, {"ts": "52:24", "title": "10. Külliye: Her bid'at masiyettir, ama tersi değil", "paras": [{"reader": false, "ar": [[3144.0, "الكلّيّة الأخيرة، وأظنّ أنني أطلتُ عليكم:"], [3149.0, "<b>كلُّ بدعةٍ معصيةٌ، ولا عكس.<\/b> وذلك لأنّ وصفَ الشيء بالبدعة أعظمُ من وصفه بأنه معصية؛"], [3166.0, "فتتّفق البدعةُ والمعصيةُ في شيءٍ،"], [3169.6, "ويختلفان في أشياء. فتتّفق البدعةُ والمعصيةُ في أنّ كلًّا منهما مخالفةٌ شرعيّة،"], [3178.0, "ولكن تتميّز البدعةُ على المعصية بعدّة أشياء:"]], "tr": [[3144.0, "Son külliye —sanırım sizi uzun tuttum—:"], [3147.8, "<b>10. külliye: Her bid'at masiyettir (günahtır), ama tersi değil.<\/b> Bu şundandır:"], [3154.1, "Bir şeyi bid'at olarak nitelemek, onu masiyet olarak nitelemekten daha büyüktür."], [3167.4, "Bid'at ile masiyet bir şeyde birleşir, birçok şeyde ayrılır."], [3173.4, "Bid'at ile masiyet, her birinin şer'î bir muhalefet olmasında birleşir;"], [3178.7, "fakat bid'at masiyetten birkaç şeyle ayrılır:"]]}, {"reader": false, "ar": [[3183.0, "الأوّل: أنّ صاحبها يرى أنها حقّ،"], [3189.0, "وأمّا صاحبُ المعصية فيُقدم عليها مستشعرًا أنها باطل."], [3197.0, "ومنها: أنّ صاحب البدعة يُقدم عليها متقرّبًا بها إلى الله عز وجل ومتعبّدًا بها إليه،"], [3211.0, "فهو يراها ممّا ينفعه في الآخرة،"], [3214.0, "وأمّا صاحب المعصية فهو يُقدم عليها معتقدًا أنها تُبعده عن الله عز وجل،"], [3222.0, "ولكن لغلبة شيطانه وهواه وشهوته ونفسه الأمّارة بالسوء أقدم عليها."]], "tr": [[3183.0, "Birincisi: Bid'at sahibi onun hak olduğunu düşünür;"], [3186.8, "masiyet sahibi ise onun bâtıl olduğunun farkında olarak ona girişir."], [3197.0, "Bunlardan biri de şudur: Bid'at sahibi ona, onunla Allah Azze ve Celle'ye yaklaşarak ve onunla O'na ibadet ederek girişir;"], [3211.5, "onu âhirette kendisine fayda verecek şeylerden görür."], [3214.6, "Masiyet sahibi ise onun kendisini Allah Azze ve Celle'den uzaklaştırdığına inanarak ona girişir;"], [3221.4, "fakat şeytanının, hevâsının, şehvetinin ve kötülüğü emreden nefsinin galebesi yüzünden ona girişmiştir."]]}, {"reader": false, "ar": [[3229.0, "ومنها أيضًا: أنّ البدعةَ خللُها ـ خللُها ـ خللُها يؤثّر في التوحيد،"], [3240.0, "وأمّا المعصية فخللُها مؤثّرٌ في الإيمان."], [3246.0, "ومنها: أنّ الحاملَ على البدعة هي الشبهة،"], [3256.0, "وأمّا الحامل على المعصية فهو الشهوة؛"], [3263.0, "فالبدعة تدخل في باب الشبهات،"], [3266.5, "والمعاصي تدخل في باب الشهوات."]], "tr": [[3229.0, "Bunlardan biri de şudur: Bid'atin kusuru —kusuru— kusuru tevhide tesir eder;"], [3240.8, "masiyetin kusuru ise imana tesir eder."], [3246.7, "Bunlardan biri de şudur: Bid'ate sevk eden şey şüphedir;"], [3258.3, "masiyete sevk eden ise şehvettir."], [3263.7, "Bid'at şüpheler babına, masiyetler ise şehvetler babına girer."]]}, {"reader": false, "ar": [[3270.0, "ومنها: أنّ جهلَ صاحب البدعة جهلٌ مركّب؛"], [3280.0, "لأنه على ضلالٍ ولا يدري أنه على ضلال؛"], [3289.0, "فكونُه على جهالةٍ هذا جهل،"], [3293.0, "وكونُه يرى جهلَه حقًّا هذا جهلٌ آخر؛"], [3298.0, "فجهلُ صاحب البدعة جهلٌ مركّب."], [3301.0, "وأمّا جهلُ صاحب المعصية فجهلٌ بسيط،"], [3305.0, "وهو جهالةُ شهوته التي حملته عليها."]], "tr": [[3270.0, "Bunlardan biri de şudur: Bid'at sahibinin cehaleti cehl-i mürekkeptir (katmerli cehalettir);"], [3281.9, "çünkü o dalâlettedir ve dalâlette olduğunu bilmez."], [3289.0, "Cehalet üzere olması bir cehalettir;"], [3293.0, "cehaletini hak görmesi de başka bir cehalettir."], [3296.9, "Dolayısıyla bid'at sahibinin cehaleti katmerli cehalettir."], [3300.4, "Masiyet sahibinin cehaleti ise basit cehalettir;"], [3303.0, "o da kendisini masiyete sevk eden şehvetinin cehaletidir."]]}, {"reader": false, "ar": [[3309.0, "ومنها: عُسرُ توبة المبتدع،"], [3312.0, "ويُسرُ توبة العاصي؛ كما قال أهل السنة:"], [3321.8, "إنّ البدعة أحبُّ إلى إبليس من المعصية."], [3327.0, "قيل: لماذا؟ قال: لأنّ المعصية يُتاب منها،"], [3331.1, "وأمّا البدعة فلا يُتاب منها."], [3334.0, "قلتُ: لأنّ أوّل منازل التوبة من الذنب استشعارُ قبحه،"], [3341.0, "والمبتدع إنما يُقدم على بدعته مستشعرًا أنها حقٌّ وقُربةٌ وطاعة."], [3349.0, "ولا نعني بذلك أنّ المبتدع لا تُتصوّر منه التوبة،"], [3357.0, "بل تُتصوّر، ولكنها أعسرُ من تصوّر توبة العاصي؛"], [3364.0, "لاستقرار قبح المعصية في قلبه حتى وإن زاولها."]], "tr": [[3309.0, "Bunlardan biri de şudur: Bid'atçinin tövbesi zor, günahkârın tövbesi kolaydır."], [3320.4, "Nitekim Ehl-i Sünnet şöyle demiştir:"], [3323.8, "\"Bid'at İblis'e masiyetten daha sevimlidir.\" \"Neden?\" denildi."], [3328.2, "Dedi ki: \"Çünkü masiyetten tövbe edilir;"], [3331.7, "bid'atten ise tövbe edilmez.\" Ben de derim ki:"], [3336.8, "Çünkü günahtan tövbenin ilk merhalesi onun çirkinliğinin farkına varmaktır;"], [3343.3, "bid'atçi ise bid'atine onun hak, kurbet ve itaat olduğunu hissederek girişir."], [3351.8, "Bununla bid'atçiden tövbenin düşünülemeyeceğini kastetmiyoruz;"], [3354.7, "bilakis düşünülebilir, fakat günahkârın tövbesinin düşünülmesinden daha zordur."], [3362.1, "Çünkü masiyetin çirkinliği —onu işlese bile— günahkârın kalbinde yerleşmiştir."]]}, {"reader": false, "ar": [[3370.0, "ولعلّنا نكتفي بهذا القدر،"], [3372.3, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[3370.0, "Belki bu kadarla yetinelim. Allah en yüce ve en iyi bilendir."], [3374.0, "Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
