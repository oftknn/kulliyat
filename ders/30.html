<script>
const D={"no": 30, "vid": "iSWouLhBBlM", "title_ar": "الدرس (٣٠) من شرح كليات العقيدة — من كليات البدع", "title_tr": "Şerhu Külliyyâti'l-Akîde — 30. Ders: Bid'at Külliyeleri (Re'y ve Heva, Büyüklere Uyma, Taklit, Maslahat, Makâsıd, Kalpleri Mahlûka Kul Etme, Yolculuk, Zikirler, Telbis, Bid'at ve Masiyet)", "sections": [{"ts": "00:00", "title": "1. Külliye: Sırf re'ye ve hevâya dayanan her ibadet bid'attir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.2, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.5, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.2, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [11.8, "أمّا بعد: فلا نزال ـ ولله الحمدُ والمنّة ـ في سياق كلّيّات البدع وأصولها وقواعدها،"], [19.2, "وعندنا في هذا الدرس عشرُ كلّيّاتٍ كالعادة."], [23.0, "الكلّيّة الأولى: <b>كلُّ عبادةٍ تستند إلى الرأي المجرّد والهوى فبدعة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.2, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.6, "Bundan sonra: Hamd ve minnet Allah'a, hâlâ bid'at külliyeleri, onların usûlü ve kaideleri bağlamındayız."], [19.2, "Bu derste her zamanki gibi on külliyemiz var."], [23.0, "<b>1. külliye: Sırf re'ye (görüşe) ve hevâya dayanan her ibadet bid'attir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[51.0, "أقول وبالله التوفيق: وذلك لأنّ العبادة لا بدّ أن تستند إلى دليلٍ من الكتاب أو صحيح السنة،"], [61.0, "فلا يجوز للإنسان أن يبني تعبُّدًا على شيءٍ لا أصلَ له في الشرع؛"], [68.0, "كأن يبني عبادةً على شيءٍ من الهوى:"], [71.9, "ثار في قلبه شيءٌ من الهوى فبنى على هواه شيئًا من التعبّدات."], [76.0, "ولا يجوز أن تُبنى على مجرّد الاستحسانات:"], [80.0, "استحسن شيئًا فجعله عبادة."], [84.0, "ولا يجوز أيضًا أن تُبنى على الرأي المجرّد."], [88.0, "فكلُّ عبادةٍ بناها الإنسان على شيءٍ من الأهواء أو الآراء المجرّدة عن الأدلّة فإنها تُعتبر من البدع والمحدثات، «وكلُّ بدعةٍ ضلالة»."]], "tr": [[51.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [53.9, "İbadetin mutlaka Kitap'tan ya da sahih Sünnet'ten bir delile dayanması gerekir."], [59.8, "İnsanın, şeriatte aslı olmayan bir şey üzerine bir taabbud bina etmesi caiz değildir."], [65.8, "Mesela bir ibadeti hevâdan bir şey üzerine bina etmesi gibi:"], [70.9, "Kalbinde bir hevâ kabarır, o da hevâsı üzerine birtakım taabbudlar bina eder."], [75.0, "İbadetin sırf istihsanlar (güzel görmeler) üzerine bina edilmesi de caiz değildir:"], [80.0, "Bir şeyi güzel görür ve onu ibadet yapar."], [85.5, "Sırf re'y üzerine bina edilmesi de caiz değildir."], [89.3, "İnsanın delillerden soyutlanmış hevâlar ya da re'yler üzerine bina ettiği her ibadet, bid'atlerden ve sonradan çıkarılmış şeylerden sayılır; \"Her bid'at dalâlettir.\""]]}, {"reader": false, "ar": [[103.0, "وقد جرت عادةُ أهل البدع أنهم لا بدّ أن يُشرعِنوا بدعَهم بشيءٍ من التعليلات،"], [114.0, "وأغلبُ تعليلاتهم إنما هي أهواءٌ وآراءٌ مجرّدة،"], [118.0, "لا تمتّ لا إلى دليل الكتاب ولا إلى صحيح السنة بشيءٍ من الطرق."], [127.0, "وبناءً على ذلك: فالتعبّدات المبنيّة على الحكاوي والقصص التي لا خِطامَ لها ولا زِمام،"], [137.0, "هذه كلُّها من البدع."], [139.0, "وكذلك التعبّدات المبنيّة على الرؤى والمنامات والأحلام،"], [146.0, "أيضًا هي مبنيّةٌ على آراءٍ وأهواء، فهي من البدع."]], "tr": [[103.0, "Bid'at ehlinin âdeti, bid'atlerini mutlaka birtakım ta'lîllerle (gerekçelerle) meşrulaştırmaları şeklinde cereyan etmiştir."], [110.4, "Onların ta'lîllerinin çoğu da sırf hevâlar ve re'ylerdir;"], [116.9, "ne Kitap delili ne de sahih Sünnet ile hiçbir yoldan bir bağı vardır."], [125.4, "Buna göre: Yularsız ve dizginsiz (dayanaksız) hikâyeler ve kıssalar üzerine bina edilen taabbudların hepsi bid'atlerdendir."], [136.0, "Rüyalar, uykuda görülenler ve düşler üzerine bina edilen taabbudlar da böyledir;"], [143.5, "onlar da re'yler ve hevâlar üzerine bina edilmiştir, dolayısıyla bid'atlerdendir."]]}, {"reader": false, "ar": [[152.0, "وكذلك التحليل والتحريم المبنيّ على ما يسمّونه بسواليف البادية،"], [160.0, "وهي تلك القصص التي يتوارثها الأبناء عن الآباء،"], [166.0, "ويقصّونها بتفاصيلها، ويتّخذون منها تعبّداتٍ يعيش عليها الأبناء زمنًا طويلًا،"], [177.0, "ويعسر عليهم مفارقتُها فيما بعد."], [182.0, "وكالأحكام التي يبنيها الأتباع على قول الكبراء والسادة،"], [193.0, "كما قال الله عز وجل:"], [196.0, "<span class=\"ayah\">﴿وَقَالُوا رَبَّنَا إِنَّا أَطَعْنَا سَادَتَنَا وَكُبَرَاءَنَا فَأَضَلُّونَا السَّبِيلَا﴾<\/span> <span class=\"ref\">[الأحزاب: ٦٧]<\/span>؛"], [201.0, "فتجد أنّ الكبراء يقرّرون لهم أقوالًا ويأمرون الأتباعَ بالتعبّد بها،"], [207.0, "فيتابعهم عليها الأتباع بلا زِمامٍ من أدلّة الكتاب ولا السنة، ولا السنة."]], "tr": [[152.0, "Aynı şekilde \"çöl hikâyeleri (sevâlîfu'l-bâdiye)\" dedikleri şeylere dayanan helal ve haram kılma da böyledir."], [160.7, "Bunlar, oğulların babalarından miras aldığı, ayrıntılarıyla anlattıkları ve kendilerinden taabbudlar edindikleri hikâyelerdir;"], [167.4, "oğullar uzun zaman bunlarla yaşar ve daha sonra onlardan ayrılmak kendilerine zor gelir."], [177.8, "Tâbilerin, büyüklerin ve efendilerin sözü üzerine bina ettikleri hükümler de böyledir."], [184.9, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [193.6, "<span class=\"ayah\">﴿Ve dediler ki: Rabbimiz! Biz efendilerimize ve büyüklerimize itaat ettik, onlar da bizi yoldan saptırdılar﴾<\/span> [Ahzâb 67]."], [201.6, "Görürsün ki büyükler onlara birtakım sözler takrir eder ve tâbilere onlarla ibadet etmeyi emreder;"], [207.7, "tâbiler de Kitap ve Sünnet delillerinden hiçbir dizgin (dayanak) olmaksızın bu konuda onlara uyarlar."]]}, {"reader": false, "ar": [[219.0, "وكأغلب تعبّدات الصوفية المبنيّة على الاستحسانات؛"], [226.0, "كالأذكار الجماعية، والرقص، والضرب بالدفوف عند الأذكار،"], [233.0, "كلُّ ذلك إنما يبنونه على الاستحسان الذي لا يمتّ إلى الشرع بصلة."], [239.0, "وكاختراع بعض الأذكار التي لا يُفقه معناها،"], [246.0, "وهي إلى التمتمة والطمطمة أقربُ منها إلى لغة العرب واللسان العربي،"], [251.0, "ويورّثونها لأتباعهم ومريديهم، ولعلّكم سمعتم شيئًا من ذلك في بعض وسائل التواصل."], [263.0, "فيأمرون أتباعهم بشيءٍ من الأذكار لا تمتّ إلى اللغة العربية بأيّ صلة،"], [270.0, "ويأمرونهم بتكرارها مئةً أو مئتين أو ألفًا أو ألفين،"], [275.0, "ويبنون على تكرار هذه الأقوال التي لا تمتّ إلى العربية بصلةٍ أشياءَ كثيرةً من تسخير الكون،"], [286.0, "في استجلاب الخيرات أو استدفاع المضرّات؛"], [291.0, "وكلُّ ذلك من العبادات المبنيّة على الآراء المجرّدة والأهواء."]], "tr": [[219.0, "Sûfîlerin istihsanlar üzerine bina edilmiş taabbudlarının çoğu da böyledir:"], [227.5, "Toplu zikirler, dans ve zikirler sırasında def çalmak gibi."], [234.5, "Bunların hepsini ancak şeriatle hiçbir bağı olmayan istihsan üzerine bina ederler."], [239.0, "Anlamı anlaşılmayan birtakım zikirler uydurmak da böyledir;"], [246.0, "bunlar Arap diline ve Arapçaya olmaktan çok mırıltıya ve anlaşılmaz yabancı söze daha yakındır."], [251.9, "Bunları tâbilerine ve müridlerine miras bırakırlar;"], [259.7, "belki bunlardan bir kısmını bazı sosyal medya araçlarında duymuşsunuzdur."], [264.2, "Tâbilerine Arap diliyle hiçbir bağı olmayan birtakım zikirleri emrederler ve onları yüz, iki yüz, bin ya da iki bin kez tekrar etmelerini emrederler."], [276.3, "Arapçayla hiçbir bağı olmayan bu sözlerin tekrarı üzerine, hayırları celbetme veya zararları defetme hususunda kâinatı musahhar kılmaya dair birçok şey bina ederler."], [291.0, "Bunların hepsi, sırf re'yler ve hevâlar üzerine bina edilmiş ibadetlerdendir."]]}, {"reader": false, "ar": [[295.0, "وكما يفعله أقطابُ الصوفية في أتباعهم بأنهم لا يُجيزون لهم الأذكار إلا بإجازات،"], [305.0, "فيأتي الأتباع إلى كبرائهم وأقطابهم ويقولون:"], [308.8, "نريدك أن تُجيزنا في الذِّكر،"], [312.0, "فيشترطون عليهم اشتراطاتٍ حتى يُجيزوهم بالذكر."], [318.0, "ومن المعلوم أنّ الذكرَ تعبُّدٌ شرعيٌّ لا يحتاج إلى إجازة أشياخ."]], "tr": [[295.0, "Sûfî kutuplarının tâbilerine yaptığı da böyledir:"], [298.4, "Onlara zikirleri ancak icazetlerle izin verirler."], [302.4, "Tâbiler büyüklerine ve kutuplarına gelip \"Bize zikirde icazet vermeni istiyoruz\" derler;"], [310.1, "onlar da kendilerine zikirde icazet vermek için birtakım şartlar koşarlar."], [318.0, "Bilinen şudur ki zikir, şeyhlerin icazetine ihtiyaç duymayan şer'î bir taabbuddur."]]}, {"reader": false, "ar": [[324.0, "وبالجملة: فإنّ أغلب التعبّدات التي يبنيها الرافضة،"], [328.7, "أو يبنيها الصوفية، أو يأمرون أتباعهم بها،"], [337.0, "فإنها تدخل تحت هذه الكلّيّة؛"], [339.3, "لأنه لا يقف وراءها برهانُ الشرع،"], [342.0, "وإنما لا يقف وراءها إلا الرأيُ المجرّد والشهواتُ والأهواء."], [348.0, "ومن المعلوم أنّ الله عز وجل إنما تعبّدنا بالاتّباع والهدى،"], [354.2, "لا بالابتداع والهوى. والله أعلم."]], "tr": [[324.0, "Özetle: Râfıza'nın ya da sûfîlerin bina ettiği veya tâbilerine emrettiği taabbudların çoğu bu külliyenin altına girer."], [332.7, "Çünkü onların arkasında şeriatin burhanı (kesin delili) yoktur;"], [339.7, "arkalarında sadece sırf re'y, şehvetler ve hevâlar vardır."], [343.3, "Bilinen şudur ki Allah Azze ve Celle bizi ancak ittibâ ve hidayetle mükellef kılmıştır;"], [351.1, "ibtidâ' (bid'at çıkarma) ve hevâ ile değil. Allah en iyisini bilir."]]}]}, {"ts": "05:56", "title": "2. Külliye: Hak açıklandıktan sonra şer'î bir muhalefette tazim edilen birine uyan sapkın ve dalâlettedir", "paras": [{"reader": false, "ar": [[357.3, "ومن الكلّيّات أيضًا: <b>كلُّ من اتّبع معظَّمًا في مخالفةٍ شرعيّةٍ بعد بيان الحقّ فزائغٌ ضالّ.<\/b> <span class=\"note\">(يكررها)<\/span> وقوله في الكلّيّة:"], [380.1, "«معظَّمًا» يدخل فيها تعظيمُ القرابة والأبوّة،"], [387.0, "كما كان أهلُ الشرك إذا أُمروا بالتوحيد يستدلّون بفعل آبائهم وأسلافهم،"], [395.0, "ويتركون الحقَّ متابعةً لآبائهم،"], [397.7, "تعظيمًا لما عليه الآباء والأسلاف؛"], [401.0, "فاتّبعوا معظَّمًا في مخالفة الحقّ."]], "tr": [[357.3, "<b>2. külliye: Hak açıklandıktan sonra şer'î bir muhalefette tazim edilen birine uyan herkes, sapkın (zâiğ) ve dalâlettedir.<\/b> (Tekrar ediyor.) Külliyedeki \"tazim edilen\" sözüne akrabalık ve babalık tazimi de girer."], [383.0, "Nitekim şirk ehli tevhide davet edildiklerinde babalarının ve atalarının fiilini delil getirirlerdi;"], [391.8, "babaların ve ataların üzerinde bulunduğu şeyi tazim ederek babalarına uymak için hakkı terk ederlerdi."], [399.7, "Böylece hakka muhalefette tazim edilen birine uymuş oldular."]]}, {"reader": false, "ar": [[404.0, "وقد يكون تعظيمَ علمٍ وديانة،"], [408.0, "كالنصارى واليهود الذين يطيعون أحبارهم ورهبانهم في مخالفة الحقّ،"], [414.0, "وفيهم نزل قولُ الله عز وجل:"], [418.0, "<span class=\"ayah\">﴿اتَّخَذُوا أَحْبَارَهُمْ وَرُهْبَانَهُمْ أَرْبَابًا مِّن دُونِ اللَّهِ﴾<\/span> <span class=\"ref\">[التوبة: ٣١]<\/span>،"], [423.0, "فيأمرونهم بتحليل الحرام فيُحلّونه،"], [427.0, "وبتحريم الحلال فيُحرّمونه، والحديث في ذلك معروفٌ مشهور."], [434.0, "وما جعلهم يتّبعونهم في مثل ذلك إلا لأنهم معظَّمون في أنفسهم تعظيمَ علمٍ وديانة."], [442.0, "فكلُّ من اتّبع معظَّمًا في علمه وديانته في مخالفة الحقّ بعد بيانه له،"], [448.0, "فهذا طريقٌ من طرق أهل البدع والزيغ والضلال."]], "tr": [[404.0, "(Bu tazim) ilim ve diyanet tazimi de olabilir;"], [408.0, "hakka muhalefette hahamlarına ve rahiplerine itaat eden Hristiyanlar ve Yahudiler gibi."], [412.7, "Allah Azze ve Celle'nin şu sözü onlar hakkında inmiştir:"], [416.7, "<span class=\"ayah\">﴿Onlar Allah'ı bırakıp hahamlarını ve rahiplerini rabler edindiler﴾<\/span> [Tevbe 31]."], [421.6, "Onlara haramı helal kılmayı emrederler, onlar da onu helal sayarlar;"], [427.9, "helali haram kılmayı emrederler, onlar da onu haram sayarlar."], [433.2, "Bu konudaki hadis bilinen, meşhur bir hadistir."], [436.7, "Onları bu gibi şeylerde onlara uymaya sevk eden tek şey, onların kendi gözlerinde ilim ve diyanet bakımından tazim edilmiş olmalarıdır."], [443.4, "Hak kendisine açıklandıktan sonra hakka muhalefette, ilmi ve diyaneti sebebiyle tazim edilen birine uyan herkes (bilsin ki) bu, bid'at, sapkınlık ve dalâlet ehlinin yollarından bir yoldur."]]}, {"reader": false, "ar": [[451.0, "وقد يكون معظَّمًا تعظيمَ مُلكٍ ورئاسة،"], [456.0, "فتجده يأمر بالبدعة أو بمخالفة الشرع،"], [461.0, "فيطيعه الناسُ ويتّبعونه لما هو عليه من المُلك والرئاسة؛"], [467.0, "كحال فرعون إذ كان يأمر أتباعه بعبادته،"], [471.5, "وبمحاربة دين الله عز وجل وأنبيائه ورسله،"], [476.0, "ويقول: <span class=\"ayah\">﴿مَا أُرِيكُمْ إِلَّا مَا أَرَىٰ﴾<\/span> <span class=\"ref\">[غافر: ٢٩]<\/span>،"], [479.0, "وكما قال الله عز وجل:"], [481.5, "<span class=\"ayah\">﴿فَاتَّبَعُوا أَمْرَ فِرْعَوْنَ ۖ وَمَا أَمْرُ فِرْعَوْنَ بِرَشِيدٍ﴾<\/span> <span class=\"ref\">[هود: ٩٧]<\/span>."], [486.0, "وما أكثرَ هؤلاء، خاصّةً من العامّة!"], [490.0, "فإذا وجدوا أنّ كبراءهم وملوكهم ورؤساءهم فتحوا لهم بابًا من المحرّمات أو البدع،"], [499.0, "فتجد أنّ أغلب الناس يتابعونهم."]], "tr": [[451.0, "(Bu tazim) mülk ve riyaset (hükümdarlık ve başkanlık) tazimi de olabilir:"], [457.5, "Onun bid'atı ya da şeriate muhalefeti emrettiğini görürsün;"], [462.3, "insanlar da sahip olduğu mülk ve riyaset sebebiyle ona itaat eder ve uyarlar."], [468.3, "Firavun'un hâli gibi: Tâbilerine kendisine ibadet etmeyi, Allah Azze ve Celle'nin dinine, peygamberlerine ve resullerine karşı savaşmayı emrediyor ve şöyle diyordu:"], [478.0, "<span class=\"ayah\">﴿Ben size ancak kendi gördüğümü gösteriyorum﴾<\/span> [Mü'min 29]."], [481.0, "Allah Azze ve Celle'nin buyurduğu gibi:"], [483.0, "<span class=\"ayah\">﴿Onlar Firavun'un emrine uydular; oysa Firavun'un emri doğru değildi﴾<\/span> [Hûd 97]."], [488.7, "Bunlar ne kadar çoktur, özellikle de avam arasında!"], [492.7, "Büyüklerinin, krallarının ve başkanlarının kendilerine haramlardan ya da bid'atlerden bir kapı açtığını gördüklerinde, insanların çoğunun onlara uyduğunu görürsün."]]}, {"reader": false, "ar": [[502.0, "وقد نزل فيهم قولُ الله عز وجل:"], [507.0, "<span class=\"ayah\">﴿فَقَالَ الضُّعَفَاءُ لِلَّذِينَ اسْتَكْبَرُوا إِنَّا كُنَّا لَكُمْ تَبَعًا فَهَلْ أَنتُم مُّغْنُونَ عَنَّا مِنْ عَذَابِ اللَّهِ مِن شَيْءٍ﴾<\/span> <span class=\"ref\">[إبراهيم: ٢١]<\/span> <span class=\"note\">(Şeyh «قال» diyor)<\/span>،"], [518.0, "والآيات في قضيّة محاجّة الأتباع مع الكبراء كثيرةٌ في القرآن."], [523.0, "فإمّا أن يكون المعظَّمُ تعظيمَ قرابة،"], [527.0, "أو تعظيمَ علمٍ وديانة،"], [529.7, "أو تعظيمَ مُلكٍ ورئاسة."], [533.0, "وقد جاءت الأدلّة بتحريم مخالفة الحقّ لمتابعة أيِّ معظَّمٍ كان،"], [539.0, "فلا يجوز لك أن تتّبع معظَّمًا ـ أيًّا كان نوعُ تعظيمه ـ في مخالفة الحقّ."]], "tr": [[502.0, "Allah Azze ve Celle'nin şu sözü onlar hakkında inmiştir:"], [507.0, "<span class=\"ayah\">﴿Zayıflar, büyüklük taslayanlara dediler ki: Biz size tâbi idik; şimdi siz Allah'ın azabından herhangi bir şeyi bizden savabilir misiniz?﴾<\/span> [İbrâhîm 21]."], [518.0, "Tâbilerin büyüklerle tartışması meselesine dair ayetler Kur'an'da çoktur."], [521.5, "Tazim edilen kişi ya akrabalık tazimiyle, ya ilim ve diyanet tazimiyle ya da mülk ve riyaset tazimiyle tazim edilir."], [531.7, "Deliller, hangi tazim edilen kişi olursa olsun, ona uymak için hakka muhalefet etmenin haram olduğunu göstermiştir."], [540.2, "Tazimin türü ne olursa olsun, hakka muhalefette tazim edilen birine uyman caiz değildir."]]}, {"reader": false, "ar": [[547.0, "وعلى ذلك قولُ الله عز وجل:"], [550.0, "<span class=\"ayah\">﴿بَلْ قَالُوا إِنَّا وَجَدْنَا آبَاءَنَا عَلَىٰ أُمَّةٍ وَإِنَّا عَلَىٰ آثَارِهِم مُّهْتَدُونَ﴾<\/span> <span class=\"ref\">[الزخرف: ٢٢]<\/span>،"], [557.0, "وفي الآية الثانية: <span class=\"ayah\">﴿مُّقْتَدُونَ﴾<\/span> <span class=\"ref\">[الزخرف: ٢٣]<\/span>."], [560.0, "ويقول الله عز وجل:"], [562.4, "<span class=\"ayah\">﴿وَإِذَا قِيلَ لَهُمْ تَعَالَوْا إِلَىٰ مَا أَنزَلَ اللَّهُ وَإِلَى الرَّسُولِ قَالُوا حَسْبُنَا مَا وَجَدْنَا عَلَيْهِ آبَاءَنَا﴾<\/span> <span class=\"ref\">[المائدة: ١٠٤]<\/span>؛"], [572.0, "وذلك لتعظيم آبائهم وأسلافهم في قلوبهم،"], [576.1, "فتركوا الحقَّ لاتّباع الآباء والأسلاف."]], "tr": [[547.0, "Allah Azze ve Celle'nin şu sözü buna delildir:"], [549.5, "<span class=\"ayah\">﴿Bilakis dediler ki: Biz babalarımızı bir din üzere bulduk; biz de onların izleri üzerinde doğru yolu bulmuş kimseleriz﴾<\/span> [Zuhruf 22]."], [558.5, "Diğer ayette de: <span class=\"ayah\">﴿…uyan kimseleriz﴾<\/span> [Zuhruf 23]."], [561.8, "Allah Azze ve Celle şöyle buyurur:"], [564.8, "<span class=\"ayah\">﴿Onlara, Allah'ın indirdiğine ve Resûl'e gelin denildiğinde, babalarımızı üzerinde bulduğumuz şey bize yeter, dediler﴾<\/span> [Mâide 104]."], [571.4, "Bu, kalplerinde babalarını ve atalarını tazim etmelerinden dolayıdır;"], [575.5, "babalara ve atalara uymak için hakkı terk ettiler."]]}, {"reader": false, "ar": [[580.0, "وإذا تأمّلتَ سِيَرَ الأمم،"], [582.4, "ونظرتَ في أحوال المعاندين للأنبياء والمرسلين،"], [586.0, "وجدتَ أنّ أعظم أسباب بقائهم على الكفر هو هذا:"], [591.0, "هو متابعةُ هؤلاء المعظَّمين؛"], [595.0, "كما قال الله عز وجل عن إبراهيم ـ إبراهيم عليه وعلى نبيّنا الصلاة والسلام ـ لمّا نهاهم عن عبادة الأصنام:"], [605.0, "<span class=\"ayah\">﴿قَالُوا وَجَدْنَا آبَاءَنَا لَهَا عَابِدِينَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٥٣]<\/span>،"], [610.0, "وقال الله عز وجل:"], [613.0, "<span class=\"ayah\">﴿قَالُوا بَلْ وَجَدْنَا آبَاءَنَا كَذَٰلِكَ يَفْعَلُونَ﴾<\/span> <span class=\"ref\">[الشعراء: ٧٤]<\/span>."]], "tr": [[580.0, "Ümmetlerin tarihini düşünür, peygamberlere ve resullere inat edenlerin hâllerine bakarsan, onların küfür üzerinde kalmalarının en büyük sebebinin şu olduğunu görürsün:"], [588.6, "Bu tazim edilen kişilere uymak."], [591.9, "Nitekim Allah Azze ve Celle İbrâhîm'den —ona ve Peygamberimize salât ve selâm olsun— onları putlara ibadetten nehyettiğinde şöyle bahseder:"], [602.5, "<span class=\"ayah\">﴿Dediler ki: Babalarımızı onlara ibadet eder bulduk﴾<\/span> [Enbiyâ 53]."], [605.8, "Allah Azze ve Celle şöyle buyurur:"], [610.8, "<span class=\"ayah\">﴿Dediler ki: Hayır, fakat biz babalarımızı böyle yapar bulduk﴾<\/span> [Şuarâ 74]."]]}, {"reader": false, "ar": [[618.0, "ولذلك نبّه أئمّةُ السلف ـ من الصحابة ومن بعدهم ـ على خطورة هذا الأمر تنبيهًا عظيمًا،"], [630.0, "وهي أنّ من أعظم ما يُزيغ العبدَ عن متابعة الحقّ اتّباعَه لأحد المعظَّمين."], [635.0, "قال ابن مسعود رضي الله تعالى عنه:"], [641.0, "«ألا لا يقلِّدنّ أحدُكم دينَه رجلًا؛ إن آمن آمن، وإن كفر كفر، وإن كنتم لا بدّ مقتدين فاقتدوا بالميّت، فإنّ الحيَّ لا تُؤمَن عليه الفتنة»."]], "tr": [[618.0, "Bu yüzden selef imamları —sahabeden ve onlardan sonrakilerden— bu işin tehlikesine büyük bir önemle dikkat çekmişlerdir:"], [626.7, "Kulu hakka uymaktan saptıran en büyük şeylerden biri, onun tazim edilen birine uymasıdır."], [633.7, "İbn Mes'ûd —Allah ondan razı olsun— şöyle dedi:"], [638.7, "\"Dikkat edin! Sizden biri dininde bir adamı taklit etmesin;"], [644.3, "o iman ederse iman eden, küfrederse küfreden (biri olmasın)."], [651.8, "Mutlaka birine uyacaksanız ölmüş olana uyun;"], [655.7, "çünkü yaşayan kimse hakkında fitneden emin olunamaz.\""]]}, {"reader": false, "ar": [[661.0, "وقال رضي الله تعالى عنه:"], [664.6, "«لَيُوطِّنَنَّ المرءُ نفسَه على أنه إن كفر مَن في الأرض جميعًا لم يكفر»،"], [676.0, "يعني: إن أجمع أهلُ الأرض على مخالفة الحقّ فإنك لا تتّبعهم."], [686.0, "«ليوطّننّ المرءُ نفسَه على أنه إن كفر من في الأرض لم يكفر، ولا يكوننّ أحدُكم إمّعة. قيل: وما الإمّعة؟ قال: الذي يقول: أنا مع الناس؛ إنه لا أُسوةَ في الشرّ أبدًا»."]], "tr": [[661.0, "Yine o —Allah ondan razı olsun— şöyle dedi:"], [670.0, "\"Kişi kendini, yeryüzündekilerin hepsi küfretse bile kendisinin küfretmeyeceğine alıştırsın.\" Yani yeryüzü halkı hakka muhalefette icmâ etse bile sen onlara uymazsın."], [686.7, "\"Kişi kendini, yeryüzündekiler küfretse bile kendisinin küfretmeyeceğine alıştırsın."], [692.1, "Sizden biri 'imma'a' olmasın. 'İmma'a nedir?' denildi."], [697.5, "Dedi ki: 'Ben insanlarla beraberim' diyendir."], [701.0, "Şüphesiz kötülükte asla örnek alınacak kimse yoktur.\""]]}, {"reader": false, "ar": [[705.0, "وكان الفضيل بن عياض رحمه الله تعالى يقول:"], [711.0, "«اتّبع طريقَ الحقّ ولا يضرُّك قلّةُ السالكين، وإيّاك وطريقَ الضلالة ولا تغترَّ بكثرة الهالكين»."], [721.0, "وقال الإمام ابن القيّم رحمه الله تعالى:"], [725.4, "«وكانوا يسمّون ـ أي: الصحابة والتابعون ـ المقلِّدَ على ضلالٍ إمّعة، وكانوا يسمّونه الأعمى الذي لا بصيرةَ له، ويسمّون المقلّدين أتباعَ كلِّ ناعق، يميلون مع كلِّ صائح»."]], "tr": [[705.0, "Fudayl b. Iyâz —Allah ona rahmet etsin— şöyle derdi:"], [711.0, "\"Hak yoluna uy; o yolda yürüyenlerin azlığı sana zarar vermez."], [717.4, "Dalâlet yolundan sakın; helak olanların çokluğuna aldanma.\" İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle dedi:"], [726.0, "\"Onlar —yani sahabe ve tâbiîn— dalâlet üzere taklit edene 'imma'a' derlerdi;"], [732.4, "ona basireti olmayan kör derlerdi;"], [735.5, "mukallitlere de her bağırana uyan, her çığırana meyleden kimseler derlerdi.\""]]}, {"reader": false, "ar": [[747.0, "كما قال الله عز وجل:"], [749.0, "<span class=\"ayah\">﴿وَإِذَا قِيلَ لَهُمُ اتَّبِعُوا مَا أَنزَلَ اللَّهُ قَالُوا بَلْ نَتَّبِعُ مَا أَلْفَيْنَا عَلَيْهِ آبَاءَنَا ۗ أَوَلَوْ كَانَ آبَاؤُهُمْ لَا يَعْقِلُونَ شَيْئًا وَلَا يَهْتَدُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٧٠]<\/span>،"], [759.0, "<span class=\"ayah\">﴿وَمَثَلُ الَّذِينَ كَفَرُوا كَمَثَلِ الَّذِي يَنْعِقُ بِمَا لَا يَسْمَعُ إِلَّا دُعَاءً وَنِدَاءً﴾<\/span> <span class=\"ref\">[البقرة: ١٧١]<\/span>."], [766.0, "فهؤلاء هم أتباعُ كلِّ ناعق."]], "tr": [[747.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [749.0, "<span class=\"ayah\">﴿Onlara, Allah'ın indirdiğine uyun denildiğinde, hayır, biz babalarımızı üzerinde bulduğumuz şeye uyarız, dediler. Peki ya babaları hiçbir şey akletmeyen ve doğru yolu bulamayan kimseler idiyse?﴾<\/span> [Bakara 170] <span class=\"ayah\">﴿Kâfirlerin durumu, bağırıp çağırmadan başka bir şey işitmeyen (hayvanlara) bağıran kimsenin durumu gibidir﴾<\/span> [Bakara 171]."], [766.0, "İşte bunlar her bağırana uyanlardır."]]}, {"reader": false, "ar": [[769.0, "ولذلك حذّر الأئمّةُ الأربعة من اتّباعهم وتقليدهم على شيءٍ ممّا ظهر خطؤهم فيه،"], [778.0, "من باب تحقيق هذه الكلّيّة العظيمة،"], [780.8, "وهي أنه لا ينبغي أن تتّبع إمامًا معظَّمًا بعد بيان الحقّ."], [786.0, "فهذا الإمام أبو حنيفة رحمه الله تعالى يقول:"], [789.7, "«إذا قلتُ قولًا يخالف كتابَ الله عز وجل وخبرَ الرسول صلى الله عليه وسلم فاتركوا قولي»."], [797.0, "هذا من أعظم التربية التي ينبغي على المتبوعين أن يربّوا أتباعهم عليها."]], "tr": [[769.0, "Bu yüzden dört imam, hatalarının ortaya çıktığı bir şeyde kendilerine uyulmasına ve taklit edilmelerine karşı uyarmışlardır."], [778.9, "Bu, şu büyük külliyeyi gerçekleştirmek kabilindendir:"], [781.8, "Hak açıklandıktan sonra tazim edilen bir imama uymak uygun değildir."], [786.5, "İşte İmam Ebû Hanîfe —Allah ona rahmet etsin— şöyle der:"], [790.6, "\"Allah Azze ve Celle'nin Kitabı'na ve Resûl ﷺ'in haberine muhalif bir söz söylersem sözümü bırakın.\" Bu, kendisine uyulan kimselerin tâbilerini üzerinde yetiştirmesi gereken en büyük terbiyedendir."]]}, {"reader": false, "ar": [[804.0, "وكان الإمام مالك رحمه الله تعالى يقول:"], [807.5, "«ليس أحدٌ بعد النبيّ صلى الله عليه وسلم إلا يُؤخذ من قوله ويُترك»."], [814.0, "ويقول رحمه الله: «إنما أنا بشرٌ أُخطئ وأُصيب، فانظروا في رأيي، فكلُّ ما وافق الكتاب والسنة فخذوه، وكلُّ ما لم يوافق الكتاب والسنة فاتركوه»."], [834.0, "وقال الإمام الشافعي رحمه الله تعالى:"], [836.8, "«أجمع المسلمون على أنّ من استبانت له سنّةُ رسول الله صلى الله عليه وسلم لم يحلَّ له أن يدعها لقول أحد»."], [846.0, "وكان يقول رحمه الله تعالى:"], [849.5, "«إذا صحّ الحديث فهو مذهبي»."]], "tr": [[804.0, "İmam Mâlik —Allah ona rahmet etsin— şöyle derdi:"], [807.0, "\"Nebî ﷺ'den sonra sözünden alınmayan ve bırakılmayan hiç kimse yoktur.\" Yine o —Allah ona rahmet etsin— şöyle der:"], [815.3, "\"Ben ancak hata eden ve isabet eden bir beşerim."], [820.4, "Görüşüme bakın; Kitap ve Sünnet'e uygun olan her şeyi alın, Kitap ve Sünnet'e uygun olmayan her şeyi bırakın.\" İmam Şâfiî —Allah ona rahmet etsin— şöyle dedi:"], [837.7, "\"Müslümanlar, kendisine Resûlullah ﷺ'in sünneti açıkça belli olan kimsenin, onu birinin sözü için bırakmasının helal olmadığı üzerinde icmâ etmişlerdir.\" Yine o —Allah ona rahmet etsin— şöyle derdi:"], [848.8, "\"Hadis sahih olursa benim mezhebim odur.\""]]}, {"reader": false, "ar": [[853.0, "وكان الإمام أحمد رحمه الله تعالى يقول:"], [856.5, "«من ردّ حديثَ رسول الله صلى الله عليه وسلم فهو على شفا هَلَكة»."], [863.0, "فلا يجوز لك بعد بيان الحقّ أن تتركه لموافقة أحدٍ كائنًا من كان."], [870.0, "وبناءً على ذلك: فلا يجوز تقليد المعظَّمين على ما هم عليه من مخالفة التوحيد الصحيح والإيمان الصحيح،"], [885.0, "ولا يجوز تقليد المعظَّمين في أخلاقهم السيّئة،"], [890.0, "ولا يجوز تقليد المعظَّمين في عاداتهم وتقاليدهم وسُلومهم وأحكامهم العُرفيّة؛"], [896.0, "لأنّ ذلك كلَّه من البدع،"], [899.0, "لأنّ ذلك كلَّه من البدع. والله أعلم."]], "tr": [[853.0, "İmam Ahmed —Allah ona rahmet etsin— şöyle derdi:"], [856.5, "\"Resûlullah ﷺ'in hadisini reddeden kimse helakin kıyısındadır.\" Hak açıklandıktan sonra, kim olursa olsun birine uymak için onu terk etmen caiz değildir."], [867.1, "Buna göre: Tazim edilen kimseleri, sahih tevhide ve sahih imana muhalefet üzere bulundukları şeyde taklit etmek caiz değildir."], [877.2, "Tazim edilen kimseleri kötü ahlaklarında taklit etmek caiz değildir."], [886.4, "Tazim edilen kimseleri âdetlerinde, geleneklerinde, töre ve usullerinde (sulûm) ve örfî hükümlerinde taklit etmek caiz değildir;"], [896.0, "çünkü bunların hepsi bid'atlerdendir, çünkü bunların hepsi bid'atlerdendir. Allah en iyisini bilir."]]}]}, {"ts": "15:06", "title": "3. Külliye: Sahibini dinin nizamından çıkaran her taklit kınanmış bir bid'attir", "paras": [{"reader": false, "ar": [[903.9, "ومن الكلّيّات أيضًا: <b>كلُّ تقليدٍ<\/b> ـ وهي قريبةٌ من الأولى ـ <b>كلُّ تقليدٍ أخرج صاحبَه عن نظام الدين فبدعةٌ مذمومة.<\/b> <span class=\"note\">(يكررها)<\/span> كلُّ تقليدٍ أوجب لصاحبه الخروجَ عن نظام الدين فبدعةٌ مذمومة."], [936.0, "وهذه الكلّيّة تبيّن لك أنواعَ التقليد المحرّمة،"], [943.0, "ويجمعها أن نقول: كلُّ من قلّد غيرَه في مخالفة الحقّ بعد بيانه فمذموم؛"], [952.0, "كالذي يقلّد غيرَه في أصل عقيدته الفاسدة، فإنه مذموم."]], "tr": [[903.9, "Külliyelerden biri de şudur: Her taklit —bu, öncekine yakındır— 3."], [909.8, "külliye: Sahibini dinin nizamından çıkaran her taklit, kınanmış bir bid'attir. (Tekrar ediyor.) Sahibinin dinin nizamından çıkmasını gerektiren her taklit, kınanmış bir bid'attir."], [933.3, "Bu külliye sana haram olan taklit türlerini açıklar."], [940.5, "Bunları şöyle diyerek toplayabiliriz: Hak açıklandıktan sonra hakka muhalefette başkasını taklit eden herkes kınanmıştır."], [951.5, "Mesela fâsid akidesinin aslında başkasını taklit eden kimse gibi; o kınanmıştır."]]}, {"reader": false, "ar": [[964.0, "أو الذي يقلّد الكفّارَ في عاداتهم وسُلومهم وأعرافهم وطقوس دينهم؛"], [971.0, "فإنّ «من تشبّه بقومٍ فهو منهم»."], [974.0, "فإنّ من الناس من يتابعهم في كلّ ما يعلمه عنهم،"], [983.0, "حتى لو دخلوا جُحرَ ضبٍّ لدخله معهم."], [987.0, "وكذلك يدخل فيه تقليدُ المجتمع الإسلاميّ للمجتمعات الغربيّة؛"], [994.0, "فإنّ هذا من التقليد المحرّم،"], [998.0, "لأنه يُخرج المجتمعات الإسلاميّة عن نظام الدين."]], "tr": [[964.0, "Ya da kâfirleri âdetlerinde, töre ve usullerinde (sulûm), örflerinde ve dinî ayinlerinde taklit eden kimse (kınanmıştır);"], [972.5, "çünkü \"Kim bir kavme benzerse o onlardandır.\" İnsanlardan öyleleri vardır ki onlar hakkında bildiği her şeyde onlara uyar;"], [984.1, "hatta onlar bir keler deliğine girseler o da onlarla birlikte oraya girer."], [990.6, "İslam toplumunun Batı toplumlarını taklit etmesi de buna girer;"], [997.2, "bu haram taklittendir, çünkü İslam toplumlarını dinin nizamından çıkarır."]]}, {"reader": false, "ar": [[1002.0, "ويدخل في ذلك أيضًا التقليدُ السياسيّ للأنظمة الغربيّة،"], [1007.3, "ومحاولةُ هدم الشريعة بتحكيم القوانين الأرضيّة الباطلة؛"], [1015.0, "فكلُّ ذلك من التقليد المحرّم."], [1018.0, "ويدخل في ذلك تقليدُ العلماء فيما ثبتت مخالفتُهم للدليل فيه."], [1024.0, "فكلُّ من قلّد غيرَه تقليدًا أوجب خروجَه عن واجب الشرع،"], [1030.6, "فإنّ هذا التقليد نصفه بأنه بدعةٌ وبأنه مذموم."]], "tr": [[1002.0, "Batı rejimlerinin siyasi olarak taklit edilmesi ve batıl dünyevî kanunları hakem kılarak şeriati yıkmaya çalışmak da buna girer;"], [1016.2, "bunların hepsi haram taklittendir. Delile muhalefetleri sabit olan hususlarda âlimleri taklit etmek de buna girer."], [1024.7, "Başkasını, şeriatin vâcibinden çıkmasını gerektiren bir taklitle taklit eden herkesin bu taklidini, bid'at ve kınanmış olmakla nitelendiririz."]]}]}, {"ts": "17:18", "title": "4. Külliye: Şer'an muteber bir maslahat üzerine dalâlet bina edenin binası bid'at ve dalâlettir", "paras": [{"reader": false, "ar": [[1038.0, "ومن الكلّيّات أيضًا: <b>كلُّ من بنى ضلالًا على مصلحةٍ معتبرةٍ شرعًا فبناؤه بدعةٌ وضلال.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [1073.0, "<b>كلُّ من بنى ضلالًا على مصلحةٍ معتبرةٍ شرعًا فبناؤه بدعةٌ وضلال.<\/b>"]], "tr": [[1038.0, "Külliyelerden biri de şudur: 4."], [1040.0, "külliye: Şer'an muteber bir maslahat üzerine bir dalâlet bina eden herkesin bu binası bid'at ve dalâlettir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [1073.0, "<b>Şer'an muteber bir maslahat üzerine bir dalâlet bina eden herkesin bu binası bid'at ve dalâlettir.<\/b>"]]}, {"reader": false, "ar": [[1084.0, "أقول وبالله التوفيق: وذلك لأنّ أهل البدع لن يتركوا بدعَهم خِلْوًا عن الاستدلال،"], [1092.0, "فلا بدّ أن يُخرجوها مُخرجَ الأمر المشروع،"], [1097.0, "وأنها حقّ. وقد يعلّلون فعلَهم لها بمصالحَ معتبرةٍ شرعًا،"], [1107.0, "فيقولون: إنما نفعل كذا لأنّ من مقاصد الدين كذا وكذا؛"], [1112.0, "فيبنون بدعَهم على مصالحَ معتبرةٍ شرعًا."], [1116.0, "فتأتيك هذه الكلّيّة التي تبيّن أنّ كلَّ بدعةٍ بناها صاحبُها على شيءٍ من مصالح الدين المعتبرة،"], [1124.0, "أو على شيءٍ من مقاصد الشرع الضروريّة،"], [1128.0, "فإنّ بناءه هذا ضلالٌ وبدعة."]], "tr": [[1084.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [1087.1, "Bid'at ehli bid'atlerini asla istidlalden (delil getirmekten) boş bırakmazlar;"], [1091.4, "onları mutlaka meşru bir iş kılığında ve hak olarak sunarlar."], [1097.7, "Bazen onları yapmalarını şer'an muteber maslahatlarla ta'lîl ederler ve \"Biz şunu ancak dinin makâsıdından (amaçlarından) şu şu olduğu için yapıyoruz\" derler."], [1112.0, "Böylece bid'atlerini şer'an muteber maslahatlar üzerine bina ederler."], [1116.0, "İşte bu külliye karşına çıkar ve şunu açıklar:"], [1119.5, "Sahibinin dinin muteber maslahatlarından bir şey ya da şeriatin zarurî makâsıdından bir şey üzerine bina ettiği her bid'at;"], [1127.4, "onun bu binası dalâlet ve bid'attir."]]}, {"reader": false, "ar": [[1131.0, "ولا يمكن أن تكون مصلحةُ الدين المعتبرة ولا مقصودُه الشرعيّ الضروريّ يدلّ على شيءٍ من البدع والمخالفات أو المحدثات."], [1143.0, "وعلى ذلك كلُّ أهل البدع؛"], [1148.0, "فإنك ما إن تسأله عن دليلٍ على بدعته إلا ويسرد لك المصالحَ الشرعيّة والمقاصدَ المرعيّة لهذه البدعة."], [1158.0, "فيقول قائلهم مثلًا: نحن نكذب في الحديث لنرغّب الناس في الإسلام،"], [1167.0, "فنحن نكذب للرسول لا على الرسول!"], [1172.0, "فتجدهم يضعون الأحاديث ويكذبون فيها من باب الترغيب في الإسلام وتحبيب الناس فيه."]], "tr": [[1131.0, "Dinin muteber maslahatının ve onun zarurî şer'î maksadının bid'atlerden, muhalefetlerden ya da sonradan çıkarılmış şeylerden herhangi birine delâlet etmesi mümkün değildir."], [1142.1, "Bütün bid'at ehli bu şekildedir:"], [1145.4, "Ona bid'atine dair bir delil sorar sormaz sana bu bid'atin şer'î maslahatlarını ve gözetilen makâsıdını sıralar."], [1154.7, "Mesela onlardan biri şöyle der:"], [1158.0, "\"Biz insanları İslam'a teşvik etmek için hadiste yalan söylüyoruz;"], [1165.1, "biz Resûl'ün aleyhine değil, Resûl'ün lehine yalan söylüyoruz!\" Görürsün ki İslam'a teşvik etmek ve insanlara onu sevdirmek kabilinden hadis uydururlar ve bu hususta yalan söylerler."]]}, {"reader": false, "ar": [[1181.0, "فأمّا هذه المصلحة فهي معتبرةٌ شرعًا؛"], [1186.0, "فإنّ الله أمرنا أن نحبّب الإسلام للناس،"], [1189.5, "وأن نعرضه بالصورة المحبَّبة للنفوس،"], [1192.0, "ولكنهم يبنون هذا الضلال على هذه المصلحة المعتبرة،"], [1196.0, "فبناؤهم ضلالٌ وبدعةٌ مذمومة."], [1198.0, "وكالذين يحتفلون بالمولد النبويّ؛"], [1204.0, "فإنّ أُولى حججهم: حتى نعمُرَ القلوب بمحبّة رسول الله صلى الله عليه وسلم وتعظيمه."], [1210.0, "أليس كذلك؟ الجواب: بلى."]], "tr": [[1181.0, "Bu maslahata gelince, o şer'an muteberdir."], [1184.8, "Çünkü Allah bize İslam'ı insanlara sevdirmemizi ve onu nefislere sevimli gelen bir surette sunmamızı emretmiştir."], [1191.5, "Fakat onlar bu dalâleti bu muteber maslahat üzerine bina ediyorlar;"], [1196.0, "dolayısıyla onların binası dalâlet ve kınanmış bir bid'attir."], [1199.7, "Mevlid-i Nebevî'yi kutlayanlar da böyledir."], [1204.9, "Onların ilk delili şudur: \"Kalpleri Resûlullah ﷺ'in sevgisi ve tazimiyle imar etmek için.\" Öyle değil mi? Cevap: Evet."]]}, {"reader": false, "ar": [[1212.0, "فأمّا المصلحة فإنها معتبرةٌ شرعًا،"], [1215.7, "لكنّ بناءهم هذه البدعةَ عليها هو الزيغ والضلال؛"], [1221.0, "لأننا نستطيع أن نعمُر قلوب الأمّة بمحبّته صلى الله عليه وسلم،"], [1229.0, "وتوقيره وإجلاله وتعظيمه وتعزيره صلى الله عليه وسلم،"], [1236.0, "بلا وقوعٍ في شيءٍ من المحدثات ولا البدع."]], "tr": [[1212.0, "Maslahata gelince, o şer'an muteberdir;"], [1215.0, "fakat bu bid'ati onun üzerine bina etmeleri sapkınlık ve dalâlettir."], [1221.7, "Çünkü biz ümmetin kalplerini, sonradan çıkarılmış şeylerden ve bid'atlerden hiçbirine düşmeden, onun ﷺ sevgisiyle, ona saygı, hürmet, tazim ve ona yardım edip destek olmakla (ta'zîr) imar edebiliriz."]]}]}, {"ts": "20:39", "title": "4. Külliyenin şerhi (devam): Kabirlerdeki şirk, sahabeye düşmanlık, iftira ve \"hürriyet\" bahanesi", "paras": [{"reader": false, "ar": [[1239.0, "وكالذين يسمّون شركهم عند قبور الأولياء والصالحين تعظيمًا للأولياء ومعرفةً لمنازلهم وأقدارهم؛"], [1254.0, "ولذلك تجدهم يفعلون عند قبور الأولياء والصالحين من الشرك الشيءَ الكثير،"], [1261.0, "ثم يقولون: <span class=\"ayah\">﴿أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ﴾<\/span> <span class=\"ref\">[يونس: ٦٢]<\/span>؛"], [1266.0, "فيبنون شركهم وضلالهم على هذه المصلحة المعتبرة شرعًا، فبناؤهم زيغٌ وضلال."]], "tr": [[1239.0, "Velîlerin ve salihlerin kabirleri başında yaptıkları şirki, velîleri tazim etmek ve onların mertebelerini ve kadirlerini bilmek diye isimlendirenler de böyledir."], [1255.3, "Bu yüzden onların, velîlerin ve salihlerin kabirleri başında pek çok şirk işlediklerini görürsün;"], [1261.0, "sonra da şöyle derler: <span class=\"ayah\">﴿Bilesiniz ki Allah'ın velîlerine hiçbir korku yoktur, onlar üzülmeyeceklerdir de﴾<\/span> [Yûnus 62]."], [1265.6, "Böylece şirklerini ve dalâletlerini bu şer'an muteber maslahat üzerine bina ederler;"], [1270.4, "onların binası sapkınlık ve dalâlettir."]]}, {"reader": false, "ar": [[1273.0, "وكمعاداة أصحاب النبيّ صلى الله عليه وسلم عند الرافضة بناءً على محبّة آل البيت؛"], [1283.0, "فإنهم يلعنون الصحابة لأنهم يحبّون آل البيت،"], [1288.0, "ويُضفون على أهل البيت صفاتِ الربوبيّة والألوهيّة بحجّة أنهم يحبّون آل البيت،"], [1298.0, "فيبنون تلك الوثنيّات والكفريّات على شيءٍ من المصالح المعتبرة شرعًا."], [1303.0, "فإنّ محبّة آل البيت دينٌ وإيمان،"], [1305.0, "ولكن لا يسوّغ لصاحبه أن يبني عليه شيئًا من هذا،"], [1310.0, "من هذا الضلال والشرك والوثنيّة."], [1313.0, "ما أدري، كلامي واضح؟"]], "tr": [[1273.0, "Râfıza'nın, Ehl-i Beyt sevgisine dayanarak Nebî ﷺ'in ashâbına düşmanlık etmesi de böyledir."], [1281.2, "Ehl-i Beyt'i sevdikleri için sahabeye lanet ederler;"], [1285.9, "Ehl-i Beyt'i sevdikleri bahanesiyle Ehl-i Beyt'e rubûbiyyet ve ulûhiyyet sıfatları yakıştırırlar."], [1294.0, "Böylece bu putperestlikleri ve küfürleri şer'an muteber maslahatlardan bir şey üzerine bina ederler."], [1302.0, "Ehl-i Beyt sevgisi din ve imandır;"], [1304.0, "fakat bu, sahibine onun üzerine bundan, bu dalâlet, şirk ve putperestlikten herhangi bir şey bina etmeyi caiz kılmaz. Bilmiyorum, sözüm açık mı?"]]}, {"reader": false, "ar": [[1314.0, "وكاتّهام الأبرياء، وكتابة التقارير فيهم،"], [1321.0, "وإلباسهم ما ليس فيهم من التُّهم،"], [1325.0, "بحجّة الدفاع عن السلفيّة وعن الدين،"], [1329.0, "وبحجّة بيان البدعة حتى لا يقع فيها العامّة؛"], [1334.0, "فتجده يظلم الآخرين ويبغي عليهم،"], [1340.0, "ويبغي عليهم بحجّة أنه يريد الدفاع عن السلفيّة."], [1346.0, "فأمّا الدفاع عن السلفيّة وعن منهج أهل السنة والجماعة فهو مأمورٌ به شرعًا،"], [1352.0, "لكن لا يجوز أن يكون سببًا لهذه التصرّفات التي لا تمتّ إلى منهج السلف بأيّ صلة."]], "tr": [[1314.0, "Selefîliği ve dini savunma bahanesiyle ve avam bid'ate düşmesin diye bid'ati açıklama bahanesiyle masumları itham etmek, onlar hakkında raporlar yazmak ve onlara kendilerinde olmayan suçlamaları giydirmek de böyledir."], [1335.6, "Görürsün ki o, selefîliği savunmak istediği bahanesiyle başkalarına zulmeder ve onlara haddi aşar, onlara haddi aşar."], [1347.8, "Selefîliği ve Ehl-i Sünnet ve'l-Cemaat menhecini savunmaya gelince, bu şer'an emredilmiş bir şeydir;"], [1354.0, "fakat selef menheciyle hiçbir bağı olmayan bu davranışlara sebep olması caiz değildir."]]}, {"reader": false, "ar": [[1362.0, "وكالدعوة للانحلال عن الدين،"], [1365.0, "وتجويز الكفر والردّة، بحجّة حرّيّة الأديان،"], [1374.0, "بحجّة المحافظة على الحرّيّات."], [1377.0, "ونقول: بأنّ المحافظة على حرّيّات الناس هذا من مقاصد الشريعة ولا شكّ؛"], [1383.0, "فإنّ الله عز وجل إنما أنزل شريعته وأنزل كتبه لنكون أحرارًا،"], [1390.0, "لكن لا يجوز أن نبني على هذا المقصود الشرعيّ والمصلحة المعتبرة شيئًا لا يريده الله عز وجل."]], "tr": [[1362.0, "Din hürriyeti bahanesiyle, hürriyetleri koruma bahanesiyle dinden çözülmeye davet etmek ve küfrü ve irtidadı caiz görmek de böyledir."], [1378.3, "Deriz ki: İnsanların hürriyetlerini korumak, şüphesiz şeriatin makâsıdındandır;"], [1382.3, "çünkü Allah Azze ve Celle şeriatini ve kitaplarını ancak hür olalım diye indirmiştir."], [1389.4, "Fakat bu şer'î maksat ve muteber maslahat üzerine Allah Azze ve Celle'nin istemediği bir şeyi bina etmemiz caiz değildir."]]}, {"reader": false, "ar": [[1396.0, "وهذا لو تأمّلتموه وجدتم أنّ أهل البدع كلَّهم يقعون فيه؛"], [1402.0, "فدائمًا يعلّلون بدعهم بمقاصد الشريعة،"], [1406.0, "ويحتجّون لبدعهم بمصالح الدين المعتبرة."], [1412.0, "فتأتي هذه الكلّيّة لتسدّ هذا الباب:"], [1414.0, "بأنّ مقصود الدين لا يدلّ على شيءٍ من المخالفات الشرعيّة أبدًا؛"], [1419.1, "فبناؤكم هذه الأمورَ والمخالفاتِ على تلك المقاصد والمصالح المعتبرة الشرعيّة بناءٌ ضالّ،"], [1426.0, "وهو عينُ البدعة والهوى،"], [1428.0, "وهو عينُ البدعة والهوى. والله أعلم."]], "tr": [[1396.0, "Bunu düşünürseniz bütün bid'at ehlinin buna düştüğünü görürsünüz:"], [1399.6, "Bid'atlerini daima şeriatin makâsıdıyla ta'lîl ederler ve bid'atleri için dinin muteber maslahatlarını delil getirirler."], [1407.6, "İşte bu külliye şu ilkeyle bu kapıyı kapatmak için gelir:"], [1413.7, "Dinin maksadı asla şer'î muhalefetlerden hiçbirine delâlet etmez."], [1416.7, "Dolayısıyla sizin bu işleri ve muhalefetleri o muteber şer'î makâsıd ve maslahatlar üzerine bina etmeniz sapık bir binadır;"], [1424.4, "o, bid'atin ve hevânın ta kendisidir, bid'atin ve hevânın ta kendisidir. Allah en iyisini bilir."]]}]}, {"ts": "23:53", "title": "5. Külliye: Dinin makâsıdından ve şeriatin usulünden bir şeyi nakzeden her ibadet bid'attir", "paras": [{"reader": false, "ar": [[1433.0, "ومن الكلّيّات أيضًا: كلُّ بدعةٍ ناقضت شيئًا من مقاصد الشرع وأصول الدين فبدعة..."], [1439.3, "يا الله! كلُّ عبادةٍ ـ أو نقول إيش؟"], [1439.5, "كلّ... لا لا ـ كلُّ عبادة:"], [1439.7, "<b>كلُّ عبادةٍ ناقضت شيئًا من مقاصد الدين وأصول الشريعة فبدعة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1433.0, "Külliyelerden biri de şudur: Dinin makâsıdından ve şeriatin usulünden bir şeyi nakzeden her bid'at bid'attir… Yâ Allah!"], [1439.3, "Her ibadet —ya da ne diyelim?"], [1439.9, "Her… hayır, hayır— her ibadet:"], [1440.5, "<b>5. külliye: Dinin makâsıdından ve şeriatin usulünden bir şeyi nakzeden (ona aykırı düşen) her ibadet bid'attir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1467.0, "وأعني بمقاصد الدين تلك المقاصدَ التي قرّرها العلماء رحمهم الله تعالى في كتب مقاصد التشريع؛"], [1479.0, "فأيُّ عبادةٍ تراها مناقِضةً لشيءٍ من هذه المقاصد وأصول الملّة العامّة،"], [1487.0, "فاعرف أنها بدعةٌ وليست عبادة."], [1490.0, "فالعبادة لا يمكن أبدًا أن تكون مناقضةً أو مصادمةً لشيءٍ من مقاصد الشرع،"], [1498.0, "وإنما الله عز وجل شرع التعبّدات لإحياء مقاصد الشرع وإقامتها، لا لمناقضتها ومصادمتها."]], "tr": [[1467.0, "Dinin makâsıdı ile, âlimlerin —Allah onlara rahmet etsin— teşrîin makâsıdına dair kitaplarda takrir ettikleri makâsıdı kastediyorum."], [1476.8, "Bu makâsıddan ve milletin genel usulünden bir şeye aykırı gördüğün her ibadetin, ibadet değil bid'at olduğunu bil."], [1487.0, "İbadetin şeriatin makâsıdından bir şeye aykırı olması ya da onunla çatışması asla mümkün değildir."], [1493.7, "Allah Azze ve Celle taabbudları ancak şeriatin makâsıdını ihya etmek ve ikame etmek için meşru kılmıştır;"], [1501.7, "onlara aykırı düşmek ve onlarla çatışmak için değil."]]}, {"reader": false, "ar": [[1506.0, "كالتعبّد لله عز وجل بمعاشرة الأفاعي أو الوحوش في البرّيّة طلبًا للكرامة؛"], [1516.0, "فإنّ هذا الفعل ـ مع كونه مُحدَثةً ـ إلا أنه يعارض مقصودًا من مقاصد الشريعة،"], [1522.8, "وهي حفظُ النفس للتلف والعطب والهلاك."], [1526.0, "فلا يمكن أبدًا أن يكون ذلك مشروعًا،"], [1531.0, "ولا يمكن أن يوصف في لحظةٍ من اللحظات بأنه عبادة؛ لمناقضته لأصل الدين."]], "tr": [[1506.0, "Mesela keramet elde etmek için kırlarda yılanlarla ya da vahşi hayvanlarla birlikte yaşayarak Allah Azze ve Celle'ye ibadet etmek gibi."], [1518.1, "Bu fiil, sonradan çıkarılmış bir şey olmasının yanı sıra şeriatin makâsıdından bir maksatla da çatışır;"], [1524.4, "o da canı telef, zarar ve helake karşı korumaktır."], [1528.9, "Bunun meşru olması asla mümkün değildir;"], [1531.8, "anlardan hiçbir anda ibadet olarak nitelendirilmesi de mümkün değildir, çünkü dinin aslına aykırıdır."]]}, {"reader": false, "ar": [[1538.0, "وكتعظيم الأنبياء أو الأولياء التعظيمَ الذي يرفعهم عن بشريّتهم إلى مرتبة الربوبيّة والألوهيّة؛"], [1551.0, "فإنّ هذا الأمر لا يوصف بأنه عبادة."], [1556.0, "فكلُّ من أوصله تعظيمُه لنبيٍّ أو وليٍّ إلى أن يقع في شيءٍ من الشرك،"], [1562.9, "فإنّ ما يفعله بدعةٌ وليس عبادة؛"], [1568.3, "لمناقضة فعله لأصل الدين،"], [1572.0, "وهو حفظ الدين، حفظ الدين."]], "tr": [[1538.0, "Peygamberleri ya da velîleri, onları beşeriyetlerinden rubûbiyyet ve ulûhiyyet mertebesine yükselten bir tazimle tazim etmek de böyledir;"], [1553.1, "bu iş ibadet olarak nitelendirilmez."], [1556.0, "Bir peygambere ya da velîye tazimi kendisini şirkten bir şeye düşürecek dereceye ulaştıran herkesin yaptığı şey ibadet değil bid'attir."], [1565.4, "Çünkü onun fiili dinin aslına, yani dinin korunmasına, dinin korunmasına aykırıdır."]]}, {"reader": false, "ar": [[1575.0, "وكتضييق بعض أقطاب الصوفيّة على أنفسهم بترك الطعام مدّةً طويلة،"], [1585.0, "وترك الشراب مدّةً طويلة،"], [1589.0, "والخلوة في البرّيّة مدّةً طويلة طلبًا للكرامة؛"], [1597.0, "فإنّ هذا مناقضٌ لمقاصد الدين وأصول الشريعة."], [1601.0, "وكذلك أيضًا كإحياء بعض الأزمنة والأمكنة ببعض التعبّدات التي لا دليل عليها بخصوصها؛"], [1613.0, "فإنّ ذلك مناقضٌ لأصل الدين الأعظم،"], [1617.0, "وهو توحيد الحاكميّة لله عز وجل."], [1622.0, "فلا حاكمَ بتخصيص زمانٍ إلا الله،"], [1625.0, "ولا حاكمَ في تخصيص مكانٍ بشيءٍ من التعبّدات إلا من؟"], [1630.0, "إلا الله تبارك وتعالى."]], "tr": [[1575.0, "Bazı sûfî kutuplarının keramet elde etmek için uzun süre yemeği terk ederek, uzun süre içmeyi terk ederek ve uzun süre kırlarda halvete çekilerek kendilerini sıkıntıya sokmaları da böyledir;"], [1597.0, "bu, dinin makâsıdına ve şeriatin usulüne aykırıdır."], [1599.9, "Aynı şekilde bazı zamanları ve mekânları, özellikle onlara dair delil bulunmayan birtakım taabbudlarla ihya etmek de böyledir."], [1611.8, "Bu, dinin en büyük aslına, yani hâkimiyetin Allah Azze ve Celle'ye ait olduğunu tevhid etmeye (tevhîdu'l-hâkimiyye) aykırıdır."], [1620.6, "Bir zamanı tahsis etme hususunda Allah'tan başka hüküm koyan yoktur;"], [1625.0, "bir mekânı birtakım taabbudlarla tahsis etme hususunda da kimden başka hüküm koyan yoktur?"], [1630.0, "Allah Tebâreke ve Teâlâ'dan başka."]]}, {"reader": false, "ar": [[1633.0, "ويدخل في ذلك قراءةُ سورة الأنعام في جمعةٍ من جُمَع رمضان كاملةً في ركعةٍ واحدة،"], [1640.0, "كما يزعمه من يزعمه بأنه عبادة؛"], [1645.0, "ولا والله، لا يمتّ هذا إلى العبادة بأيّ صلة،"], [1649.1, "لما فيه من التضييق والمشقّة العظيمة التي لا تأتي مقاصدُ الشريعة بمثله."], [1654.0, "وكرفع الصوت بالأذكار الجماعيّة بعد الصلاة؛"], [1661.0, "فإنّ في ذلك من الإضرار بأهل المسجد ما يتنافى مع مقصود الشرع الأعظم،"], [1666.1, "وهو: «لا ضررَ ولا ضِرار»."]], "tr": [[1633.0, "Ramazan cumalarından birinde En'âm sûresinin tamamını tek rekâtta okumak da —onu ibadet diye iddia edenlerin iddia ettiği gibi— buna girer."], [1642.3, "Hayır, vallahi bunun ibadetle hiçbir bağı yoktur;"], [1646.2, "çünkü onda, şeriatin makâsıdının benzerini getirmediği sıkıntı ve büyük meşakkat vardır."], [1650.7, "Namazdan sonra toplu zikirlerde sesi yükseltmek de böyledir;"], [1654.0, "çünkü bunda mescit ehline, şeriatin en büyük maksadıyla bağdaşmayan bir zarar verme vardır;"], [1663.3, "o maksat da şudur: \"Zarar vermek de zarara zararla karşılık vermek de yoktur.\""]]}, {"reader": false, "ar": [[1668.0, "فمن الأوجه التي نعرف بها البدعةَ:"], [1672.1, "موافقتُها لمقاصد الدين أو مخالفتُها لمقاصد الدين؛"], [1680.0, "فما وافق مقاصدَ الدين فهو البدعة المأمور بها <span class=\"note\">(Şeyh böyle diyor; kastı «emredilen ibadet» olmalı)<\/span>،"], [1683.0, "وما خالف مقاصدَ الشريعة وأصولَ الملّة فإنه البدعة التي وردت الأدلّة بذمّها."]], "tr": [[1668.0, "Bid'ati tanıdığımız yönlerden biri de onun dinin makâsıdına uygun ya da dinin makâsıdına aykırı olmasıdır."], [1676.1, "Dinin makâsıdına uygun olan şey emredilen \"bid'at\"tir (Şeyh'in lafzı böyle; kastettiği emredilen ibadet olmalıdır);"], [1684.4, "şeriatin makâsıdına ve milletin usulüne aykırı olan ise delillerin kınadığı bid'attir."]]}, {"reader": false, "ar": [[1694.0, "وكما يفعله الصوفيّة من اختلاط الرجال بالنساء في الحضرات الصوفيّة،"], [1700.8, "والرقص والطرب في بعض احتفالاتهم وموالدهم؛"], [1705.8, "فإنّ في ذلك من انتهاك الأعراض ما لا تأتي الشريعة بمثله أبدًا."], [1715.0, "فاجتماعاتهم تتناقض مع مقصود حفظ الأعراض،"], [1718.0, "فلا يمكن أن تأتي الشريعة به. لعلّ الكلّيّة واضحة."]], "tr": [[1694.0, "Sûfîlerin, sûfî hadralarında (zikir meclislerinde) kadın-erkek karışık bulunması, bazı kutlamalarında ve mevlitlerinde dans ve tarab (coşkulu müzik) yapmaları da böyledir;"], [1708.6, "bunda, şeriatin asla benzerini getirmeyeceği bir namus çiğnenmesi vardır."], [1716.0, "Onların toplantıları namusu koruma maksadıyla çelişir;"], [1718.3, "şeriatin bunu getirmesi mümkün değildir. Herhalde külliye açıktır."]]}]}, {"ts": "28:43", "title": "6. Külliye: Kalpleri mahlûka kul etmeye çalışan herkes bid'atçidir", "paras": [{"reader": false, "ar": [[1723.0, "ومن الكلّيّات أيضًا: <b>كلُّ من سعى لتعبيد القلوب للمخلوق فمبتدع.<\/b> <span class=\"note\">(يكررها)<\/span> واضحة؟"]], "tr": [[1723.0, "Külliyelerden biri de şudur: 6."], [1729.0, "külliye: Kalpleri mahlûka kul etmeye çalışan herkes bid'atçidir. (Tekrar ediyor.) Açık mı?"]]}, {"reader": false, "ar": [[1748.0, "أقول وبالله التوفيق: وهذا من علامة علماء أهل البدع؛"], [1753.0, "فإنّ من أعظم مقاصدهم أن يعبّدوا قلوبَ أتباعهم لبعض المخلوقين:"], [1761.0, "إمّا لهم، أو لغيرهم من الأنبياء،"], [1764.9, "أو لغيرهم من الأولياء،"], [1767.5, "أو لغيرهم من صالحٍ يزعمون فيه الولاية."], [1772.0, "فتجدهم دائمًا يفرضون شيئًا من القصص على هذا المخلوق ليعلّق قلوبَ السامعين به في جلب خيراتهم ودفع مضرّاتهم،"], [1784.0, "ولا تسمع من هؤلاء الشرذمة شيئًا يعلّق القلوب بالله عز وجل."]], "tr": [[1748.0, "Tevfik Allah'tandır, derim ki: Bu, bid'at ehli âlimlerinin alâmetlerindendir."], [1752.7, "Onların en büyük maksatlarından biri, tâbilerinin kalplerini bazı mahlûklara kul etmektir:"], [1759.3, "Ya kendilerine, ya peygamberlerden başkalarına, ya velîlerden başkalarına ya da kendisinde velâyet iddia ettikleri bir salih kimse gibi başkalarına."], [1771.4, "Görürsün ki dinleyenlerin kalplerini hayırlarını celbetme ve zararlarını defetme hususunda bu mahlûka bağlamak için daima bu mahlûk hakkında birtakım kıssalar ortaya koyarlar."], [1784.7, "Bu güruhtan kalpleri Allah Azze ve Celle'ye bağlayan hiçbir şey duymazsın."]]}, {"reader": false, "ar": [[1792.0, "ولذلك علامةُ العالم الصادق أن يعلّق قلوبَ أتباعه بالله عز وجل،"], [1800.0, "ومن علامة العالم الزائغ أن يعلّق قلوبَ الأمّة وقلوبَ أتباعه ببعض المخلوقين."], [1808.0, "ألا ترون ـ وفّقكم الله ـ كيف يعلّق علماءُ الرافضة قلوبَ أتباعهم بآل البيت؟"], [1819.0, "لا يعلّقونهم بالله، وإنما يعلّقونهم دائمًا بآل البيت،"], [1826.0, "حتى نشأ أتباعُهم وهم يعبدون مَن؟"], [1829.0, "يعبدون آلَ البيت، ولا يعبدون الله عز وجل أبدًا."]], "tr": [[1792.0, "Bu yüzden sadık âlimin alâmeti, tâbilerinin kalplerini Allah Azze ve Celle'ye bağlamasıdır;"], [1798.9, "sapkın âlimin alâmetlerinden biri de ümmetin kalplerini ve tâbilerinin kalplerini bazı mahlûklara bağlamasıdır."], [1807.3, "Görmüyor musunuz —Allah sizi muvaffak kılsın— Râfıza âlimleri tâbilerinin kalplerini Ehl-i Beyt'e nasıl bağlıyorlar?"], [1815.5, "Onları Allah'a bağlamıyorlar; daima Ehl-i Beyt'e bağlıyorlar."], [1823.3, "Öyle ki tâbileri kime ibadet ederek yetişti?"], [1828.0, "Ehl-i Beyt'e ibadet ederek; Allah Azze ve Celle'ye ise asla ibadet etmiyorlar."]]}, {"reader": false, "ar": [[1834.0, "وانظر ـ يا رعاك الله ـ كيف يعبّد علماءُ الصوفيّة أتباعَهم ومريديهم لأوليائهم وصالحيهم؛"], [1843.0, "فتجدهم يذكرون من القصص عن هذا الوليّ الشيءَ الذي يجعل القلوب ترتبط به،"], [1851.1, "وتتعلّق شُعَبُها بطلب النفع ودفع الضرّ منه،"], [1856.9, "فيحجبون قلوبَهم عن التعلّق بالله عز وجل،"], [1863.0, "لا يجعلون لله عز وجل في قلوب أتباعهم شيئًا من المكانة أو المنزلة."], [1870.0, "فتجدهم ما إن تنزل بهم نازلةٌ إلا وتنصرف شُعَبُ قلوبهم إلى هذا المخلوق،"], [1878.0, "فيطلبون منه الحاجات، ويستغيثونه في كشف الملمّات وتفريج الكُرُبات،"], [1884.0, "ويُلقون على قبره عرائضَ الشكوى ـ الأوراق التي فيها الطلبات يعني ـ معرضين عن الله عز وجل."]], "tr": [[1834.0, "Bak —Allah seni korusun— sûfî âlimleri tâbilerini ve müridlerini velîlerine ve salihlerine nasıl kul ediyorlar!"], [1843.0, "Görürsün ki bu velî hakkında kalplerin ona bağlanmasını ve kalplerin bütün yönleriyle (şuabıyla) ondan fayda isteme ve zararı defetmesini isteme hususunda ona takılmasını sağlayacak kıssalar anlatırlar."], [1860.1, "Böylece onların kalplerini Allah Azze ve Celle'ye bağlanmaktan alıkoyarlar;"], [1865.2, "tâbilerinin kalplerinde Allah Azze ve Celle'ye hiçbir yer ve mertebe bırakmazlar."], [1870.0, "Görürsün ki başlarına bir musibet iner inmez kalplerinin bütün yönleri bu mahlûka yönelir:"], [1876.8, "Ondan ihtiyaçlarını isterler, belaların giderilmesi ve sıkıntıların açılması için ondan yardım dilerler ve kabrinin üzerine şikâyet dilekçeleri —yani içinde talepler bulunan kâğıtlar— bırakırlar;"], [1890.3, "Allah Azze ve Celle'den yüz çevirerek."]]}, {"reader": false, "ar": [[1894.0, "وهذا من تربية أهل البدع إذا تولّوا تربيةَ الأمّة."], [1899.0, "ولذلك تجد أنّ النبيّ صلى الله عليه وسلم ـ على عِظَم منزلته عند الله ـ دائمًا يحرص على ألّا يتعلّق أصحابُه به،"], [1908.0, "وقد قال الله عز وجل في شأن ذلك كثيرًا:"], [1912.0, "<span class=\"ayah\">﴿قُلْ إِنَّمَا أَنَا بَشَرٌ مِّثْلُكُمْ﴾<\/span> <span class=\"ref\">[الكهف: ١١٠]<\/span>،"], [1918.0, "«لا أملك لنفسي لا نفعًا ولا ضرًّا ولا موتًا ولا حياةً ولا نشورًا» <span class=\"note\">(Şeyh iki ayetin lafzını birleştiriyor; bk. ayet notları)<\/span>."], [1923.0, "ودائمًا يربّيهم على دعاء الله عز وجل في نوازلهم وفي ضروراتهم،"], [1931.0, "ويربّيهم على جلب الخيرات بدعاء الله عز وجل."], [1935.0, "فهذا علامةُ العالم الصادق:"], [1938.0, "أن يربّي أتباعه على التعلّق بالله عز وجل."]], "tr": [[1894.0, "Bu, bid'at ehlinin ümmetin terbiyesini üstlendiklerinde verdikleri terbiyedendir."], [1897.3, "Bu yüzden Nebî ﷺ'in, Allah katındaki mertebesinin büyüklüğüne rağmen, ashâbının kendisine (kalben) bağlanmaması için daima titizlik gösterdiğini görürsün."], [1904.0, "Allah Azze ve Celle bu hususta pek çok şey söylemiştir:"], [1908.9, "<span class=\"ayah\">﴿De ki: Ben ancak sizin gibi bir beşerim﴾<\/span> [Kehf 110], \"Kendime ne bir fayda ne bir zarar, ne ölüm ne hayat ne de yeniden diriliş verme gücüne sahibim.\" Ashâbını daima musibetlerinde ve zaruretlerinde Allah Azze ve Celle'ye dua etme üzere yetiştirir, hayırları Allah Azze ve Celle'ye dua ederek elde etme üzere yetiştirirdi."], [1935.0, "İşte sadık âlimin alâmeti budur:"], [1938.5, "Tâbilerini Allah Azze ve Celle'ye bağlanma üzere yetiştirmesi."]]}, {"reader": false, "ar": [[1942.0, "وانظر ـ يا رعاك الله ـ أيضًا كيف يسعى القبوريّون لتعبيد القلوب للأموات،"], [1950.0, "وانظر كيف يسعى أقطابُ الصوفيّة لتعبيد مريديهم لهم،"], [1958.0, "حتى لا يملك المريدُ من أمره شيئًا،"], [1962.0, "فلا يقدّم رِجلًا ولا يؤخّر أخرى إلا باستئذان شيخه،"], [1967.0, "وتجده يتمسّح بشيخه ويطلب البركة منه؛"], [1970.8, "لأنّ شيخه عبّد قلبَه له."], [1974.0, "فمن أعظم أبواب البدع تعبيدُ القلوب للمخلوق،"], [1979.0, "أيًّا كان هذا المخلوق."]], "tr": [[1942.0, "Yine bak —Allah seni korusun— kabirciler kalpleri ölülere kul etmek için nasıl çalışıyorlar!"], [1949.3, "Bak, sûfî kutupları müridlerini kendilerine kul etmek için nasıl çalışıyorlar!"], [1954.3, "Öyle ki mürid kendi işinden hiçbir şeye sahip olmaz;"], [1960.9, "şeyhinden izin almadan ne bir ayağını öne atar ne de diğerini geri çeker."], [1967.0, "Onun şeyhine sürünüp ondan bereket istediğini görürsün;"], [1970.2, "çünkü şeyhi onun kalbini kendisine kul etmiştir."], [1974.0, "Bid'atlerin en büyük kapılarından biri, kalpleri mahlûka —bu mahlûk kim olursa olsun— kul etmektir."]]}, {"reader": false, "ar": [[1981.0, "ولذلك وصيّتي لكم في حياتي وبعد مماتي:"], [1984.5, "إن درّستم يومًا وكثر أتباعُكم،"], [1987.0, "أن تحاولوا أن تعلّقوا قلوبَهم دائمًا بالله."], [1992.0, "إيّاكم أن تفرضوا على أنفسكم من الهيبة والعظمة ما يجعل قلوبَ الأتباع متعلّقةً بكم،"], [2001.0, "وإنما دائمًا علّقوا قلوبهم بالله عز وجل،"], [2005.0, "إن كنتم تريدون أن تكونوا من العلماء الصالحين."]], "tr": [[1981.0, "Bu yüzden hayatımda ve ölümümden sonra size vasiyetim şudur:"], [1985.5, "Bir gün ders verir ve tâbileriniz çoğalırsa, onların kalplerini daima Allah'a bağlamaya çalışın."], [1994.5, "Kendinize, tâbilerin kalplerini size bağlayacak bir heybet ve azamet biçmekten sakının."], [2002.1, "Salih âlimlerden olmak istiyorsanız, onların kalplerini daima Allah Azze ve Celle'ye bağlayın."]]}]}, {"ts": "33:28", "title": "7. Külliye: Özellikle tazim edilmek istenen bir mekâna yapılan her yolculuk bid'attir; üç mescit hariç", "paras": [{"reader": false, "ar": [[2008.0, "ومن الكلّيّات أيضًا: كلُّ سفرٍ لمكانٍ يُقصد تعظيمُه بخصوصه فبدعة،"], [2029.0, "إلا المساجد الثلاثة. <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [2051.0, "<b>كلُّ سفرٍ لمكانٍ يُقصد تعظيمُه بخصوصه فبدعة، إلا المساجد الثلاثة.<\/b>"]], "tr": [[2008.0, "Külliyelerden biri de şudur: 7."], [2015.0, "külliye: Bizzat kendisi tazim edilmek istenen bir mekâna yapılan her yolculuk bid'attir;"], [2029.7, "üç mescit hariç. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [2051.0, "<b>Bizzat kendisi tazim edilmek istenen bir mekâna yapılan her yolculuk bid'attir; üç mescit hariç.<\/b>"]]}, {"reader": false, "ar": [[2062.0, "أقول وبالله التوفيق: وذلك لِما تواتر عن النبيّ صلى الله عليه وسلم من قوله:"], [2068.0, "«لا تُشَدُّ الرِّحالُ إلا إلى ثلاثة مساجد: المسجدِ الحرام، والمسجدِ الأقصى، ومسجدي هذا»."], [2077.0, "فقوله: «لا تُشدّ الرحال» إنما يُقصد به شدُّ الرحل للمكان الذي يُراد به التعظيم،"], [2085.0, "يُراد تعظيمُه بخصوصه. وأمّا شدُّ الرحال في الأمور المباحة فإنّ ذلك لا يدخل في دائرة التعبّدات أصلًا؛"], [2095.0, "فللإنسان أن يشدّ رحله سائحًا،"], [2098.6, "بائعًا، مشتريًا، خاطبًا، متنزّهًا؛"], [2104.0, "لأنّ هذه مقاصدُ مباحةٌ جائزةٌ لا بأس بها،"], [2107.0, "ما لم يَرِد عليها ما يوجب تحريمها."]], "tr": [[2062.0, "Tevfik Allah'tandır, derim ki: Bu, Nebî ﷺ'den tevâtür yoluyla gelen şu sözü sebebiyledir:"], [2067.2, "\"Yolculuk için yük ancak üç mescide bağlanır:"], [2070.7, "Mescid-i Harâm, Mescid-i Aksâ ve şu mescidim.\" \"Yolculuk için yük bağlanmaz\" sözüyle ancak tazim edilmek istenen, bizzat kendisi tazim edilmek istenen mekân için yük bağlamak kastedilir."], [2086.9, "Mubah işler için yük bağlamaya gelince, bu aslen taabbudlar dairesine girmez."], [2092.5, "İnsan gezmek, satmak, satın almak, evlenmek için kız istemek ya da gezintiye çıkmak üzere yükünü bağlayabilir;"], [2104.4, "çünkü bunlar, haram kılınmalarını gerektiren bir şey arız olmadıkça mubah, caiz ve sakıncasız maksatlardır."]]}, {"reader": false, "ar": [[2112.0, "ولكنّنا نقصد في هذه الكلّيّة:"], [2115.4, "أن يحزم الإنسانُ أمتعةَ سفره ليقصد مكانًا معيّنًا،"], [2121.0, "يقصد أن يتعبّد لله عز وجل في هذا المكان لخصوصيّةٍ تعظيميّةٍ في هذا المكان؛"], [2130.0, "فهذا لا يجوز أبدًا إلا في ثلاثة أمكنةٍ فقط خصّها الحديث،"], [2136.9, "وهي: المسجد الحرام ـ فيجوز شدُّ الرحل إليه لتعظيمه ـ ومسجدُ النبيّ صلى الله عليه وسلم،"], [2145.7, "والمسجدُ الأقصى. وأمّا ما عداها فلا يجوز إعمالُ المطيّ لها لتعظيمها."]], "tr": [[2112.0, "Fakat bu külliyede kastettiğimiz şudur:"], [2114.7, "İnsanın belirli bir mekâna gitmek için yolculuk eşyasını toplaması;"], [2120.1, "bu mekânda, o mekâna has bir tazim özelliği sebebiyle Allah Azze ve Celle'ye ibadet etmeyi kastetmesi."], [2130.0, "Bu, hadisin özel olarak belirttiği sadece üç mekân dışında asla caiz değildir:"], [2136.9, "Mescid-i Harâm —onu tazim için oraya yük bağlamak caizdir—, Nebî ﷺ'in mescidi ve Mescid-i Aksâ."], [2145.7, "Bunların dışındakilere gelince, onları tazim için onlara binek sürmek caiz değildir."]]}, {"reader": false, "ar": [[2157.0, "وبناءً على ذلك: فلا يجوز شدُّ الرحل لقبر النبيّ صلى الله عليه وسلم بخصوصه،"], [2165.0, "وأمّا إذا كان أصلُ شدِّ رحله لزيارة المسجد النبويّ،"], [2170.0, "ثم زار قبرَ النبيّ صلى الله عليه وسلم زيارةً تبعيّة،"], [2175.0, "فلا جَرَمَ أنه يُغتفر في الأمور التابعة ما لا يُغتفر في الأمور الابتدائيّة."], [2182.0, "وكذلك أيضًا لا يجوز شدُّ الرحل لزيارة قبور المعظَّمين والأولياء الذين يُعبدون من دون الله عز وجل؛"], [2196.0, "كشدّ الرحل لقبر السيّد البدويّ،"], [2198.5, "أو شدّ الرحل لقبر نبيٍّ من الأنبياء،"], [2202.0, "أو شدّ الرحل لزيارة قبر العيدروس،"], [2206.1, "أو السِّتّ زينب ـ على ما يقولونه ـ أو قبر الحسين؛"], [2212.0, "فكلُّ ذلك من شدّ الرحل لتعظيم بقعةٍ بخصوصها، وهذا أمرٌ محرّم."]], "tr": [[2157.0, "Buna göre: Özellikle Nebî ﷺ'in kabri için yük bağlamak caiz değildir."], [2162.7, "Ama yük bağlamasının aslı Mescid-i Nebevî'yi ziyaret ise ve sonra Nebî ﷺ'in kabrini tâbi (ikincil) bir ziyaretle ziyaret ederse, şüphesiz tâbi olan işlerde, başlangıçta (bizzat) yapılan işlerde affedilmeyen şeyler affedilir."], [2177.7, "Aynı şekilde Allah Azze ve Celle'yi bırakıp kendilerine ibadet edilen tazim edilmiş kimselerin ve velîlerin kabirlerini ziyaret için yük bağlamak da caiz değildir:"], [2190.6, "Seyyid Bedevî'nin kabri için yük bağlamak, peygamberlerden birinin kabri için yük bağlamak, Aydarûs'un ya da —onların dediği üzere— Sitt Zeyneb'in kabrini veya Hüseyin'in kabrini ziyaret için yük bağlamak gibi."], [2209.5, "Bunların hepsi, bir yeri bizzat tazim etmek için yük bağlamaktandır ve bu haram bir iştir."]]}, {"reader": false, "ar": [[2219.0, "ولا يجوز شدُّ الرحل لكهفٍ يعظّمه أتباعُه،"], [2226.0, "أو لمغارةٍ يعظّمها أتباعُها،"], [2229.0, "أو لشجرةٍ يعظّمها أتباعُها."], [2233.0, "بل ولا يجوز شدُّ الرحل لغار حِراء ولا لغار ثَور بحجّة أنّ النبيّ صلى الله عليه وسلم قد نزل فيهما؛"], [2245.0, "لأنه صلى الله عليه وسلم لا يُحفظ عنه ـ لا ـ ولا عن أحدٍ من صحابته أنهم كانوا يشدّون الرحل إلى شيءٍ من هذه الأماكن."], [2254.0, "ولا يجوز شدُّ الرحل لجبل الطور الذي كلّم اللهُ عز وجل عليه موسى."]], "tr": [[2219.0, "Tâbilerinin tazim ettiği bir kehf (mağara) için, tâbilerinin tazim ettiği bir in için ya da tâbilerinin tazim ettiği bir ağaç için yük bağlamak caiz değildir."], [2237.9, "Hatta Nebî ﷺ'in içlerinde bulunmuş olması bahanesiyle Hira mağarası ve Sevr mağarası için bile yük bağlamak caiz değildir."], [2246.8, "Çünkü ne ondan ﷺ —hayır— ne de ashâbından herhangi birinden bu mekânlardan birine yük bağladıkları rivayet edilmemiştir."], [2253.1, "Allah Azze ve Celle'nin üzerinde Mûsâ ile konuştuğu Tûr dağı için de yük bağlamak caiz değildir."]]}, {"reader": false, "ar": [[2262.0, "والخلاصة من ذلك: أنّ شدَّ الرحل تعبُّدًا لمكانٍ الأصلُ فيه المنع،"], [2269.0, "إلا إذا أجاز الدليلُ شدَّ الرحل لهذه المكانيّة لتعظيمه؛"], [2275.0, "فإذا أجاز الدليلُ ذلك فأهلًا وسهلًا،"], [2279.0, "وإن لم يُجِز الدليلُ فلا أهلًا ولا سهلًا. واضحة الكلّيّة؟"]], "tr": [[2262.0, "Bundan çıkan sonuç şudur: Bir mekâna taabbud için yük bağlamada asıl olan yasaklıktır;"], [2269.0, "ancak delil, o mekânı tazim için oraya yük bağlamaya izin verirse başka."], [2275.7, "Delil buna izin verirse başüstüne;"], [2278.3, "delil izin vermezse ne başüstüne ne de hoş geldin. Külliye açık mı?"]]}]}, {"ts": "38:03", "title": "8. Külliye: Bütün zikirler, taalluklarıyla birlikte tevkîfîdir", "paras": [{"reader": false, "ar": [[2283.0, "ومن الكلّيّات أيضًا: <b>كلُّ الأذكار بمتعلَّقاتها توقيفيّة.<\/b> كم رقمها عندكم؟"], [2290.9, "ها؟ <b>كلُّ الأذكار بمتعلَّقاتها توقيفيّة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2283.0, "Külliyelerden biri de şudur: 8."], [2285.0, "külliye: Bütün zikirler, taalluklarıyla birlikte tevkîfîdir (nassa bağlıdır). Sizde numarası kaç?"], [2290.9, "Hı? <b>Bütün zikirler, taalluklarıyla birlikte tevkîfîdir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2308.0, "أقول وبالله التوفيق: ولا بدّ أن تفرّق بين باب الدعاء ومتعلّقاته،"], [2317.0, "وباب الذكر ومتعلّقاته؛ فالكلّيّة التي نحن بصدد شرحها لا تعلُّقَ لها بباب الأدعية،"], [2325.0, "وإنما لها تعلّقٌ بباب الأذكار:"], [2329.3, "كالتسبيح، والتهليل، والتكبير، والحوقلة،"], [2333.0, "وغيرها من الأذكار المشروعة زمانًا ومكانًا،"], [2336.6, "مطلقةً أو مقيّدة. فالأصل في هذه الذِّكريّة بكلّ متعلّقاتها التوقيف."]], "tr": [[2308.0, "Tevfik Allah'tandır, derim ki: Dua babı ve taallukları ile zikir babı ve taallukları arasını mutlaka ayırman gerekir."], [2317.7, "Şerhini yapmakta olduğumuz külliyenin dualar babıyla bir ilgisi yoktur;"], [2321.4, "onun ilgisi ancak zikirler babıyladır:"], [2323.8, "Tesbih (sübhânallah), tehlîl (lâ ilâhe illallah), tekbir, havkale (lâ havle velâ kuvvete illâ billâh) ve zaman ve mekân bakımından mutlak ya da mukayyet olarak meşru kılınmış diğer zikirler gibi."], [2340.0, "Bu zikirlerde, bütün taallukları ile birlikte asıl olan tevkîftir."]]}, {"reader": false, "ar": [[2346.0, "ويدخل في ذلك جُمَلٌ من الأصول والقواعد:"], [2351.0, "منها: أنّ الأصل في الأذكار الإطلاق؛"], [2356.0, "فمن أراد أن يقيّد ذكرًا بشيءٍ من القيود فإنه مطالَبٌ بالدليل الدالّ على صحّة هذا القيد؛"], [2365.0, "لأنه مخالفٌ للأصل، والمتقرّر في القواعد أنّ الدليل يُطلب من الناقل عن الأصل لا من الثابت عليه."]], "tr": [[2346.0, "Buna bir takım usuller ve kaideler girer."], [2351.0, "Bunlardan biri şudur: Zikirlerde asıl olan mutlaklıktır."], [2356.6, "Kim bir zikri birtakım kayıtlarla kayıtlamak isterse, bu kaydın sıhhatine delâlet eden delili getirmesi istenir;"], [2365.0, "çünkü bu, asla muhaliftir. Kaidelerde yerleşik olan şudur:"], [2369.2, "Delil, asıl üzerinde sabit kalandan değil, asıldan ayrılandan istenir."]]}, {"reader": false, "ar": [[2374.0, "ومنها: الأصل في ألفاظ الذكر التوقيف؛"], [2381.0, "فلا يجوز لك أن تزيد في بعض الأذكار ألفاظًا لا دليل عليها،"], [2388.0, "ولا يجوز لك أن تنقص من الذكر ألفاظًا ثبت الدليلُ بها،"], [2393.0, "ولا أن تبدّل ذكرًا بذكر؛"], [2397.0, "لِما في الصحيحين من حديث البراء بن عازب رضي الله عنهما:"], [2403.0, "أنّ النبيّ صلى الله عليه وسلم قال له:"], [2406.0, "«إذا أخذتَ مضجعك فتوضّأ وضوءك للصلاة، ثم اضطجع على شقّك الأيمن» إلى أن قال:"], [2413.5, "«ونبيِّك الذي أرسلت»، فلمّا أعادها البراء قال:"], [2417.9, "«ورسولِك الذي أرسلت»، فقال النبيّ صلى الله عليه وسلم:"], [2422.6, "«لا، ونبيِّك الذي أرسلت»."]], "tr": [[2374.0, "Bunlardan biri de şudur: Zikrin lafızlarında asıl olan tevkîftir."], [2382.2, "Bazı zikirlere delili olmayan lafızlar eklemen caiz değildir;"], [2386.8, "zikirden delille sabit olmuş lafızları eksiltmen de caiz değildir;"], [2391.2, "bir zikri başka bir zikirle değiştirmen de (caiz değildir)."], [2396.2, "Bunun delili Sahîhayn'da Berâ b."], [2399.2, "Âzib'den —Allah ondan ve babasından razı olsun— gelen hadistir:"], [2403.8, "Nebî ﷺ ona şöyle buyurdu:"], [2405.6, "\"Yatağına girdiğinde namaz abdesti gibi abdest al, sonra sağ yanına yat…\" ve \"…ve gönderdiğin Nebî'ne (iman ettim)\" sözüne kadar söyledi."], [2415.7, "Berâ bunu tekrarladığında \"…ve gönderdiğin Resûl'üne\" dedi."], [2420.4, "Bunun üzerine Nebî ﷺ şöyle buyurdu: \"Hayır, gönderdiğin Nebî'ne.\""]]}, {"reader": false, "ar": [[2426.0, "ممّا يدلّ على أنّ الأصل في ألفاظ الذكر التوقيف؛"], [2430.0, "فلا يحلّ لأحدٍ أن يخترع ألفاظًا ذكريّةً يتقرّب بها إلى الله عز وجل إلا وعليها دليل."], [2439.0, "وبناءً على ذلك: فما يسمّى بأذكار الصلوات على النبيّ صلى الله عليه وسلم عند شُعَب الصوفيّة،"], [2448.0, "كلُّها ممّا لا دليل عليه؛"], [2450.1, "لأنها ألفاظٌ في الصلاة والسلام لا دليل عليها."]], "tr": [[2426.0, "Bu, zikrin lafızlarında asıl olanın tevkîf olduğunu gösterir."], [2430.0, "Hiç kimsenin, üzerinde bir delil olmadıkça Allah Azze ve Celle'ye yaklaşmak için zikir lafızları uydurması helal değildir."], [2440.0, "Buna göre: Sûfî kollarında \"Nebî ﷺ'e salavât zikirleri\" denilen şeylerin hepsi delili olmayan şeylerdendir;"], [2448.8, "çünkü bunlar, salât ve selâm hususunda delili olmayan lafızlardır."]]}, {"reader": false, "ar": [[2453.0, "ومنها أيضًا: الأصل في صفة الذكر التوقيف؛"], [2461.0, "فلا يجوز لك أن تتعبّد لله عز وجل بصفةٍ ذكريّةٍ إلا وعلى تلك الصفة دليلٌ من الشرع."], [2471.0, "فالذِّكريّة التي تُشرع لك واقفًا تعبّدْ بها لله عز وجل واقفًا،"], [2477.0, "والذِّكريّة التي تُشرع لك ساجدًا تعبّدْ لله عز وجل بها ساجدًا،"], [2483.0, "والذِّكريّة التي تُشرع لك في حال قعودٍ أو غير ذلك تعبّدْ لله عز وجل على الصفة الذِّكريّة المشروعة."]], "tr": [[2453.0, "Bunlardan biri de şudur: Zikrin sıfatında (yapılış şeklinde) asıl olan tevkîftir."], [2462.0, "O sıfata dair şeriatten bir delil olmadıkça Allah Azze ve Celle'ye bir zikir şekliyle ibadet etmen caiz değildir."], [2471.0, "Sana ayakta meşru kılınan zikirle Allah Azze ve Celle'ye ayakta ibadet et;"], [2476.5, "sana secdede meşru kılınan zikirle Allah Azze ve Celle'ye secdede ibadet et;"], [2482.5, "sana oturma hâlinde ya da başka bir hâlde meşru kılınan zikirle de Allah Azze ve Celle'ye meşru zikir şekli üzere ibadet et."]]}, {"reader": false, "ar": [[2492.0, "فما ورد من أذكار الصباح فتعبّدْ لله عز وجل بقوله صباحًا،"], [2500.0, "وما ورد من أذكار المساء تعبّدْ لله عز وجل بقوله مساءً؛"], [2505.0, "فإيّاك أن تقلب أذكارَ الصباح للمساء وأذكارَ المساء للصباح."], [2510.0, "وما ورد من أذكار الدخول تعبّدْ لله عز وجل عند دخولك،"], [2516.0, "أو أذكار الخروج فتعبّدْ به لله عند خروجك؛"], [2520.0, "فإيّاك أن تجعل ذكرَ الدخول للخروج وذكرَ الخروج للدخول."], [2524.0, "إيّاك أن تخالف الصفةَ الشرعيّة الذِّكريّة حتى لا تقع في شيءٍ من البدع."]], "tr": [[2492.0, "Sabah zikirlerinden varid olanı sabahleyin söyleyerek Allah Azze ve Celle'ye ibadet et;"], [2500.5, "akşam zikirlerinden varid olanı akşamleyin söyleyerek Allah Azze ve Celle'ye ibadet et."], [2506.7, "Sabah zikirlerini akşama, akşam zikirlerini sabaha çevirmekten sakın."], [2511.1, "Giriş zikirlerinden varid olanla girerken Allah Azze ve Celle'ye ibadet et;"], [2517.0, "çıkış zikirleriyle de çıkarken Allah'a ibadet et."], [2520.9, "Giriş zikrini çıkışa, çıkış zikrini girişe koymaktan sakın."], [2524.5, "Bid'atlerden bir şeye düşmemek için zikrin şer'î şekline muhalefet etmekten sakın."]]}, {"reader": false, "ar": [[2530.0, "ومنها أيضًا: الأصل في زمانيّة الذكر التوقيفُ على النصّ؛"], [2536.0, "فإيّاك أن تتعبّد لله عز وجل بقَرْن ذكرٍ بزمانٍ تعتقد أنت فضيلةَ قوله فيه بخصوصه،"], [2546.0, "إلا وعلى تلك الزمانيّة دليلٌ من الشرع،"], [2549.0, "وإلا كنتَ مُحدِثًا مبتدِعًا في دين الله ما ليس منه."], [2553.0, "فلا تربط ذكرًا من الأذكار بزمانٍ من الأزمنة إلا وعلى ذلك الربط دليلٌ من الشرع."]], "tr": [[2530.0, "Bunlardan biri de şudur: Zikrin zamanında asıl olan nassa bağlılıktır (tevkîftir)."], [2536.0, "O zamana dair şeriatten bir delil olmadıkça, bir zikri, özellikle o zamanda söylenmesinin faziletli olduğuna inandığın bir zamana bağlayarak Allah Azze ve Celle'ye ibadet etmekten sakın;"], [2549.4, "aksi hâlde Allah'ın dininde ondan olmayan bir şeyi sonradan çıkaran bir bid'atçi olursun."], [2554.4, "O bağlamaya dair şeriatten bir delil olmadıkça hiçbir zikri zamanlardan herhangi bir zamana bağlama."]]}, {"reader": false, "ar": [[2563.0, "ومنها أيضًا: الأصل في مكانيّة الذكر التوقيف؛"], [2568.0, "فلا يجوز لك أن تتعبّد لله عز وجل بذكرٍ تعتقد فضيلةَ قوله في هذا المكان بخصوصه دون سائر الأمكنة،"], [2579.0, "إلا وعلى ذلك الربط دليلٌ من الشرع،"], [2582.0, "دليلٌ من الشرع. هذه عقيدتنا، هذه عقيدتنا."]], "tr": [[2563.0, "Bunlardan biri de şudur: Zikrin mekânında asıl olan tevkîftir."], [2568.0, "O bağlamaya dair şeriatten bir delil, şeriatten bir delil olmadıkça, diğer bütün mekânlar arasından özellikle bu mekânda söylenmesinin faziletli olduğuna inandığın bir zikirle Allah Azze ve Celle'ye ibadet etmen caiz değildir."], [2582.7, "Bu bizim akidemizdir, bu bizim akidemizdir."]]}, {"reader": false, "ar": [[2587.0, "ومنها أيضًا: الأصل في عدديّة الذكر التوقيف؛"], [2595.0, "فلا يحلّ لك أن تتعبّد لله بالوصول إلى عددٍ تعتقد فضيلتَه بخصوصه،"], [2602.0, "إلا وعلى ذلك العدد دليلٌ من الشرع."]], "tr": [[2587.0, "Bunlardan biri de şudur: Zikrin sayısında asıl olan tevkîftir."], [2595.6, "O sayıya dair şeriatten bir delil olmadıkça, özellikle faziletli olduğuna inandığın bir sayıya ulaşarak Allah'a ibadet etmen helal değildir."]]}, {"reader": false, "ar": [[2607.0, "ومنها أيضًا: الأصل منعُ التلفيق بين الأذكار؛"], [2616.0, "بمعنى أن تأخذ جزءًا من الذكر الأوّل وجزءًا من الذكر الثاني،"], [2623.0, "ثم تُنتج ذكرًا جديدًا ملفَّقًا بين الذكر الأوّل والثاني؛"], [2629.0, "فهذا من البدع والمحدثات."], [2632.0, "كالذي يقول: «لا إله إلا الله عددَ خلقه، ورضا نفسه، وزِنةَ عرشه، ومِدادَ كلماته»؛"], [2642.0, "هذا من البدع. لماذا؟"], [2643.6, "لأنّ تلك الكلمات الأربع إنما جاءت مع «سبحان الله وبحمده»،"], [2650.0, "فإيّاك أن تنقلها إلى شيءٍ من الأذكار الأخرى،"], [2654.0, "حتى وإن استحسنته نفسُك وعظّمه الشيطانُ في قلبك؛"], [2660.0, "فإنه يبقى من البدع التي لا ينبغي لك أن تفعلها،"], [2666.0, "لأنها تلفيقٌ في باب الأذكار،"], [2669.0, "والأصل في باب التلفيق المنع."]], "tr": [[2607.0, "Bunlardan biri de şudur: Zikirler arasında telfîkte (birleştirmede) asıl olan yasaklıktır."], [2617.3, "Yani birinci zikirden bir parça ve ikinci zikirden bir parça alıp sonra birinci ve ikinci zikir arasından derlenmiş yeni bir zikir ortaya çıkarman;"], [2631.2, "bu, bid'atlerden ve sonradan çıkarılmış şeylerdendir."], [2634.7, "\"Lâ ilâhe illallah, yarattıklarının sayısınca, kendi rızası kadar, Arşının ağırlığınca ve kelimelerinin mürekkebi kadar\" diyen kimse gibi;"], [2644.9, "bu bid'atlerdendir. Neden? Çünkü bu dört kelime ancak \"Sübhânallahi ve bi-hamdihî\" ile birlikte gelmiştir."], [2652.0, "Onları başka zikirlerden birine taşımaktan sakın;"], [2655.4, "nefsin onu güzel bulsa ve şeytan onu kalbinde büyütse bile."], [2661.2, "Çünkü bu, yapmaman gereken bid'atlerden olmaya devam eder;"], [2666.0, "zira zikirler babında bir telfîktir ve telfîk babında asıl olan yasaklıktır."]]}, {"reader": false, "ar": [[2672.0, "ومنها أيضًا في باب الأذكار..."], [2677.0, "ماذا قلتُ هنا؟ نعم،"], [2679.2, "في باب الأذكار: والأصل في التلفيق في باب الأذكار المنع."], [2684.0, "ومنها أيضًا: الأصل في فضائل الذكر التوقيف؛"], [2689.0, "فلا يحلّ لك أن تفرض فضيلةً شرعيّةً على شيءٍ من الأذكار إلا وعلى تلك الفضيلة دليلٌ من الشرع،"], [2697.0, "وإلا كنتَ قائلًا على الله عز وجل بغير علم؛"], [2701.0, "فإنّ الفضيلة أمرٌ غيبيّ،"], [2705.0, "والغيبيّات توقيفيّةٌ على النصّ."]], "tr": [[2672.0, "Bunlardan biri de zikirler babında… Burada ne demiştim?"], [2678.3, "Evet, zikirler babında: Zikirler babında telfîkte asıl olan yasaklıktır."], [2682.3, "Bunlardan biri de şudur: Zikrin faziletlerinde asıl olan tevkîftir."], [2687.6, "O fazilete dair şeriatten bir delil olmadıkça zikirlerden herhangi birine şer'î bir fazilet biçmen helal değildir;"], [2695.9, "aksi hâlde Allah Azze ve Celle hakkında bilgisizce söz söylemiş olursun."], [2699.4, "Çünkü fazilet gaybî bir iştir;"], [2702.7, "gaybî şeyler de nassa bağlıdır (tevkîfîdir)."]]}, {"reader": false, "ar": [[2708.0, "فلا تصدّقوا كثيرًا ممّا يُطرح في وسائل التواصل:"], [2715.0, "أنّ هذا تاجُ الذكر الذي من فضائله كذا وكذا وكذا،"], [2719.0, "ومن قال هذا الذكر فإنّ له من الفضائل كذا وكذا؛"], [2724.0, "ويعظّمون تلك الأذكار في قلبك بإضفاء تلك الفضائل عليها،"], [2733.0, "ممّا لا خِطامَ لها ولا زِمامَ من دليل الوحي."]], "tr": [[2708.0, "Sosyal medya araçlarında ortaya atılan şeylerin çoğuna inanmayın:"], [2713.1, "\"Bu, zikrin tacıdır; faziletlerinden biri şu şu şudur\", \"Kim bu zikri söylerse onun şu şu faziletleri vardır\" gibi."], [2722.5, "O zikirlere bu faziletleri yakıştırarak onları senin kalbinde büyütürler;"], [2728.3, "oysa bunların vahiy delilinden ne yuları ne de dizgini (hiçbir dayanağı) vardır."]]}, {"reader": false, "ar": [[2735.0, "ومنها: الأصل في تأثير الأذكار التوقيف؛"], [2744.0, "فلا يحقّ لأحدٍ أبدًا أن يبني أثرًا على ذكرٍ إلا وعلى هذا البناء دليلٌ من الشرع."], [2752.0, "فلا يحلّ لأحدٍ أن يقول لامرأةٍ طال زمنُ عزوبتها:"], [2757.1, "إن كنتِ تريدين زوجًا فعليكِ بهذا الذكر؛"], [2761.0, "فيبني أثرًا على ذكر."], [2763.0, "أو يقول لمن خاف من الخسارة في تجارته:"], [2768.3, "إن كنت تريد الأمانَ من الخسارة فعليك بهذا الذكر،"], [2775.0, "وإن كنت تريد النجاح في اختبارك فعليك بهذا الذكر."], [2779.0, "فيبنون آثارًا على أذكارٍ لو طلبتَ منهم دليلًا لما جاؤوك به."]], "tr": [[2735.0, "Bunlardan biri de şudur: Zikirlerin tesirinde asıl olan tevkîftir."], [2744.5, "Bu binaya dair şeriatten bir delil olmadıkça hiç kimsenin bir zikir üzerine bir tesir (sonuç) bina etmeye asla hakkı yoktur."], [2753.7, "Hiç kimsenin, bekârlık süresi uzamış bir kadına \"Eğer bir koca istiyorsan bu zikre sarıl\" demesi helal değildir;"], [2761.5, "böylece bir zikir üzerine bir tesir bina etmiş olur."], [2766.3, "Ya da ticaretinde zarar etmekten korkan birine \"Zarardan emin olmak istiyorsan bu zikre sarıl\", \"Sınavında başarılı olmak istiyorsan bu zikre sarıl\" demesi de (helal değildir)."], [2779.7, "Böylece zikirler üzerine, kendilerinden delil isteyecek olsan getiremeyecekleri tesirler bina ederler."]]}, {"reader": false, "ar": [[2787.0, "فالأصل في فضائل الذكر التوقيف،"], [2790.5, "والأصل في آثار الأذكار التوقيف؛"], [2796.0, "فلا يحلّ لأحدٍ أن يبني فضيلةً على ذكرٍ إلا بدليل،"], [2801.6, "ولا أثرًا على ذكرٍ إلا بدليل."], [2805.0, "ونخلص من ذلك: أنّ الأذكار بكلّ متعلّقاتها وما يحيط بها مبنيّةٌ على التوقيف."]], "tr": [[2787.0, "Zikrin faziletlerinde asıl olan tevkîftir;"], [2789.8, "zikirlerin tesirlerinde de asıl olan tevkîftir."], [2793.3, "Hiç kimsenin bir zikir üzerine delilsiz bir fazilet ya da delilsiz bir tesir bina etmesi helal değildir."], [2803.9, "Bundan şu sonuca varırız: Zikirler, bütün taallukları ve onları çevreleyen her şeyle birlikte tevkîf üzerine kuruludur."]]}]}, {"ts": "46:54", "title": "9. Külliye: Hakkı ya da bâtılı telbis yoluyla hakikatinden çıkaran bir şeyle niteleyen herkes bid'atçidir", "paras": [{"reader": false, "ar": [[2814.0, "ومن الكلّيّات أيضًا: <b>كلُّ من وصف الحقَّ أو الباطلَ بشيءٍ يُخرجه عن حقيقته تلبيسًا فمبتدع.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2814.0, "Külliyelerden biri de şudur: 9."], [2818.0, "külliye: Hakkı ya da bâtılı, telbis (karıştırıp aldatma) yoluyla onu hakikatinden çıkaracak bir şeyle niteleyen herkes bid'atçidir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2846.0, "أقول وبالله التوفيق: وهذا من شأن أهل البدع؛"], [2854.0, "فإنّ عندهم سلاحين يستخدمونهما دائمًا في نصرة بدعهم ومخالفاتهم الشرعيّة:"], [2865.0, "إمّا أن يصف الحقَّ بصفات السوء والبهتان حتى ينفِّر الناسَ منه تلبيسًا ومخادعةً،"], [2876.0, "وإمّا أن يصفوا باطلَهم بصفاتٍ حسنةٍ مليحةٍ جميلةٍ ليرغّب الناسَ فيه."], [2885.0, "وهذا مسلكُ أهل الزيغ والضلال في كلّ أمّة،"], [2892.0, "حتى ذكر القرآنُ شيئًا كثيرًا من ذلك."]], "tr": [[2846.0, "Tevfik Allah'tandır, derim ki: Bu, bid'at ehlinin işidir."], [2850.3, "Onların, bid'atlerine ve şer'î muhalefetlerine yardım etmek için daima kullandıkları iki silahı vardır:"], [2860.3, "Ya telbis ve aldatma yoluyla insanları ondan nefret ettirmek için hakkı kötü ve iftira niteliğindeki sıfatlarla nitelerler, ya da insanları ona rağbet ettirmek için bâtıllarını güzel, hoş ve cazip sıfatlarla nitelerler."], [2885.7, "Bu, her ümmette sapkınlık ve dalâlet ehlinin yoludur;"], [2892.0, "öyle ki Kur'an bundan pek çok şey zikretmiştir."]]}, {"reader": false, "ar": [[2896.0, "فكانوا إذا تُليت عليهم آياتُ الله عز وجل يقولون:"], [2900.5, "<span class=\"ayah\">﴿إِنْ هَٰذَا إِلَّا سِحْرٌ مُّبِينٌ﴾<\/span> <span class=\"ref\">[سبأ: ٤٣]<\/span>،"], [2903.0, "ويقول قائلهم: <span class=\"ayah\">﴿إِنْ هَٰذَا إِلَّا قَوْلُ الْبَشَرِ﴾<\/span> <span class=\"ref\">[المدثر: ٢٥]<\/span>؛"], [2907.0, "فيصفون الحقَّ بما يُخرجه عن حقيقته تلبيسًا ومخادعةً."], [2911.0, "ويصفون آياتِ الله عز وجل التي تُتلى عليهم بأنها <span class=\"ayah\">﴿أَسَاطِيرُ الْأَوَّلِينَ اكْتَتَبَهَا فَهِيَ تُمْلَىٰ عَلَيْهِ بُكْرَةً وَأَصِيلًا﴾<\/span> <span class=\"ref\">[الفرقان: ٥]<\/span>."], [2924.0, "ويصفون أهلَ الحقّ بقولهم:"], [2927.1, "<span class=\"ayah\">﴿كَذَّابٌ أَشِرٌ﴾<\/span> <span class=\"ref\">[القمر: ٢٥]<\/span>، <span class=\"ayah\">﴿سَيَعْلَمُونَ غَدًا مَّنِ الْكَذَّابُ الْأَشِرُ﴾<\/span> <span class=\"ref\">[القمر: ٢٦]<\/span>."]], "tr": [[2896.0, "Kendilerine Allah Azze ve Celle'nin ayetleri okunduğunda şöyle derlerdi:"], [2899.0, "<span class=\"ayah\">﴿Bu apaçık bir büyüden başka bir şey değildir﴾<\/span> [Sebe' 43]."], [2902.0, "Onlardan biri de şöyle der:"], [2904.1, "<span class=\"ayah\">﴿Bu ancak beşer sözüdür﴾<\/span> [Müddessir 25]."], [2906.4, "Böylece telbis ve aldatma yoluyla hakkı, onu hakikatinden çıkaracak şeylerle nitelerler."], [2910.0, "Kendilerine okunan Allah Azze ve Celle'nin ayetlerini de şöyle nitelerler:"], [2914.5, "<span class=\"ayah\">﴿(Bunlar) öncekilerin masallarıdır; onları yazdırmış, sabah akşam kendisine okunup duruyor﴾<\/span> [Furkân 5]."], [2922.0, "Hak ehlini de şu sözleriyle nitelerler:"], [2924.0, "<span class=\"ayah\">﴿(O) çok yalancı, şımarık biridir﴾<\/span> [Kamer 25]."], [2927.1, "<span class=\"ayah\">﴿Yarın kimin çok yalancı, şımarık olduğunu bilecekler﴾<\/span> [Kamer 26]."]]}, {"reader": false, "ar": [[2934.0, "ولمّا سمع الوليدُ بن المغيرة القرآنَ واعتقد صحّته قال:"], [2940.5, "<span class=\"ayah\">﴿إِنْ هَٰذَا إِلَّا سِحْرٌ يُؤْثَرُ ۝ إِنْ هَٰذَا إِلَّا قَوْلُ الْبَشَرِ﴾<\/span> <span class=\"ref\">[المدثر: ٢٤–٢٥]<\/span>؛"], [2945.0, "فألبس الحقَّ لَبوسًا ـ إيش؟"], [2946.5, "ـ لَبوسًا باطلًا ليردّه الناس."], [2953.0, "وأيضًا: <span class=\"ayah\">﴿أَمْ يَقُولُونَ شَاعِرٌ نَّتَرَبَّصُ بِهِ رَيْبَ الْمَنُونِ﴾<\/span
