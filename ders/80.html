<script>
const D={"no": 80, "vid": "2sqtFx5rI34", "title_ar": "الدرس (٨٠) من شرح كليات العقيدة — كليات باب الإيمان: التلازم بين الظاهر والباطن، وتفاوت أعمال القلوب، وزيادة الإيمان ونقصانه، وآحاد العمل", "title_tr": "Şerhu Külliyyâti'l-Akîde — 80. Ders: İman Babının Külliyeleri (Zahir ile Bâtın Arasındaki Telâzüm; Kalp Amellerinin Farklılaşması; İmanın Artıp Eksilmesi; Amellerin Tek Tek Fertleri)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Kalbin imanı farklılaştıkça azaların amelleri de farklılaşır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.9, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.8, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.2, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [10.1, "أمّا بعد: فقد افتتحنا في اللقاء الماضي ـ ولله الحمدُ والمنّة ـ الكلّيّاتِ في باب الإيمان،"], [17.3, "وأخذنا منها جُمَلًا، ونُكمِلُها إن شاء الله في هذا اللقاء."], [22.1, "وأظنّ وقفنا عند الكلّيّة التي تقول:"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.4, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.1, "Bundan sonra: Geçen buluşmada —hamd ve minnet Allah'a— iman babındaki külliyelere başladık ve onlardan bir kısmını aldık;"], [19.7, "inşallah bu buluşmada onları tamamlayacağız. Zannederim şu külliyede kalmıştık:"]]}, {"reader": false, "ar": [[25.0, "<b>كلّما تفاوت إيمانُ القلب تفاوتت أعمالُ الجوارح.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [38.0, "بمعنى أنها تزيد بزيادة ما في القلب،"], [42.7, "وتنقص بنقصه. وهي قاعدةٌ عظيمةٌ عند أهل السنة والجماعة،"], [48.0, "تُسمّى بقاعدة التلازم بين الظاهر والباطن،"], [51.0, "وهي من قواعد الإيمان التي أجمع عليها أهلُ السنة والجماعة."]], "tr": [[25.0, "<b>1. külliye: Kalbin imanı farklılaştıkça azaların amelleri de farklılaşır.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [38.7, "Yani azaların amelleri kalpteki (imanın) artmasıyla artar, eksilmesiyle eksilir."], [44.0, "Bu, Ehl-i Sünnet ve'l-Cemaat katında büyük bir kaidedir;"], [48.0, "\"zahir ile bâtın arasındaki telâzüm kaidesi\" diye adlandırılır ve Ehl-i Sünnet ve'l-Cemaat'in icmâ ettiği iman kaidelerindendir."]]}, {"reader": false, "ar": [[58.0, "فمتى ما كان القلبُ مشتمِلًا على أعماله المطلوبة منه شرعًا،"], [66.0, "فإنّ ذلك سيكون مؤثِّرًا ـ ولا بدّ ـ على أعمال الجوارح."], [70.0, "فأعمالُ الباطن والظاهر متلازمان تلازُمًا لا ينفكّ أبدًا؛"], [78.0, "فصلاحُ الباطن يقتضي صلاحَ الظاهر،"], [81.0, "وفسادُ الظاهر دليلٌ على فساد الباطن."], [85.0, "ولا يُتصوَّر إيمانٌ تامٌّ في القلب بلا أثرٍ ظاهرٍ على الجوارح."]], "tr": [[58.0, "Kalp, şer'an kendisinden istenen amelleri ihtiva ettiğinde, bu mutlaka azaların amellerine tesir edecektir."], [67.8, "Bâtının ve zahirin amelleri, asla birbirinden ayrılmayan bir telâzümle birbirini gerektirir."], [78.0, "Bâtının salâhı zahirin salâhını gerektirir;"], [81.0, "zahirin fesadı da bâtının fesadına delildir."], [85.0, "Kalpte, azalar üzerinde zahirî bir eseri olmayan tam bir iman tasavvur edilemez."]]}, {"reader": false, "ar": [[91.0, "وبه تعلمون أنّ من يدّعي الإيمانَ في قلبه،"], [99.0, "ولا يعمل بمقتضى ذلك الإيمان،"], [102.0, "فإنه كاذبٌ في هذه الدعوى."], [105.0, "ولذلك نجد آياتٍ كثيرةً يُعلِّل اللهُ عز وجل فيها تركَ الأعمال الظاهرة بعدم إيمان القلوب؛"], [114.0, "فيقول: لو كان في قلوبهم إيمانٌ لفعلوا كذا وكذا،"], [118.0, "ولكنهم لم يفعلوا لأنّ قلوبهم خاليةٌ عن المعنى الإيمانيّ المطلوب منها."]], "tr": [[91.0, "Bununla şunu bilirsiniz: Kalbinde iman olduğunu iddia edip de o imanın gereğiyle amel etmeyen kimse, bu iddiasında yalancıdır."], [105.0, "Bu yüzden Allah Azze ve Celle'nin, zahirî amellerin terk edilmesini kalplerin iman etmemesiyle gerekçelendirdiği pek çok ayet buluruz."], [114.0, "(Sanki) şöyle buyurur: Kalplerinde iman olsaydı şunu şunu yaparlardı;"], [118.5, "fakat yapmadılar, çünkü kalpleri kendilerinden istenen imanî anlamdan boştur."]]}, {"reader": false, "ar": [[124.0, "كما قال الله عز وجل:"], [126.5, "<span class=\"ayah\">﴿وَلَوْ كَانُوا يُؤْمِنُونَ بِاللَّهِ وَالنَّبِيِّ وَمَا أُنزِلَ إِلَيْهِ مَا اتَّخَذُوهُمْ أَوْلِيَاءَ﴾<\/span> <span class=\"ref\">[المائدة: ٨١]<\/span>؛"], [132.0, "فعِلّةُ اتّخاذ اليهود والنصارى أولياءَ هو خلوُّ الإيمان من القلب أو نقصُه."], [141.0, "فعلّل اللهُ عز وجل تركَ العمل الظاهر بعِلّةٍ في الباطن،"], [146.0, "وذلك لوجود التلازم العظيم بين الظاهر والباطن."]], "tr": [[124.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [126.5, "<span class=\"ayah\">﴿Eğer Allah'a, Peygamber'e ve ona indirilene iman etmiş olsalardı, onları dost edinmezlerdi﴾<\/span> [Mâide 81]."], [132.0, "Yahudi ve Hristiyanları dost edinmenin illeti, kalbin imandan boş olması veya imanın eksik olmasıdır."], [141.0, "Allah Azze ve Celle zahirî amelin terkini bâtındaki bir illetle gerekçelendirmiştir;"], [145.0, "bu da zahir ile bâtın arasındaki büyük telâzümün varlığından dolayıdır."]]}, {"reader": false, "ar": [[150.0, "وقال الله عز وجل:"], [152.2, "<span class=\"ayah\">﴿لَّا تَجِدُ قَوْمًا يُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ يُوَادُّونَ مَنْ حَادَّ اللَّهَ وَرَسُولَهُ وَلَوْ كَانُوا آبَاءَهُمْ أَوْ أَبْنَاءَهُمْ أَوْ إِخْوَانَهُمْ أَوْ عَشِيرَتَهُمْ ۚ أُولَٰئِكَ كَتَبَ فِي قُلُوبِهِمُ الْإِيمَانَ﴾<\/span> <span class=\"ref\">[المجادلة: ٢٢]<\/span>؛"], [167.0, "فاللهُ عز وجل ينفي هذه الموادّةَ في الظاهر إذا كان القلبُ مليئًا بالإيمان."]], "tr": [[150.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [152.2, "<span class=\"ayah\">﴿Allah'a ve âhiret gününe iman eden bir kavmin, babaları, oğulları, kardeşleri veya akrabaları da olsa Allah'a ve Resûlü'ne düşmanlık edenlerle dostluk ettiğini göremezsin. İşte Allah onların kalplerine imanı yazmıştır﴾<\/span> [Mücâdele 22]."], [168.2, "Allah Azze ve Celle, kalp imanla dolu olduğunda zahirdeki bu dostluğu nefyetmektedir."]]}, {"reader": false, "ar": [[175.0, "وكما قال الله عز وجل:"], [178.5, "<span class=\"ayah\">﴿وَيَقُولُونَ آمَنَّا بِاللَّهِ وَبِالرَّسُولِ وَأَطَعْنَا﴾<\/span>،"], [183.0, "فهذه دعوى منهم لهذا الإيمان،"], [188.0, "<span class=\"ayah\">﴿ثُمَّ يَتَوَلَّىٰ فَرِيقٌ مِّنْهُم مِّن بَعْدِ ذَٰلِكَ ۚ وَمَا أُولَٰئِكَ بِالْمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[النور: ٤٧]<\/span>؛"], [194.0, "فعلّل اللهُ عز وجل تولّيَهم عن الحقّ بخلوّ قلوبهم من الإيمان."]], "tr": [[175.0, "Ve Allah Azze ve Celle'nin buyurduğu gibi:"], [178.5, "<span class=\"ayah\">﴿\"Allah'a ve Peygamber'e iman ettik ve itaat ettik\" derler﴾<\/span> —bu, onların bu imanı iddia etmeleridir— <span class=\"ayah\">﴿sonra bunun ardından içlerinden bir grup yüz çevirir. Onlar mümin değillerdir﴾<\/span> [Nûr 47]."], [194.5, "Allah Azze ve Celle onların haktan yüz çevirmelerini, kalplerinin imandan boş olmasıyla gerekçelendirmiştir."]]}, {"reader": false, "ar": [[200.0, "وقال الله عز وجل أيضًا في هذه الآية،"], [205.3, "قال: <span class=\"ayah\">﴿وَإِذَا دُعُوا إِلَى اللَّهِ وَرَسُولِهِ لِيَحْكُمَ بَيْنَهُمْ إِذَا فَرِيقٌ مِّنْهُم مُّعْرِضُونَ﴾<\/span> <span class=\"ref\">[النور: ٤٨]<\/span> <span class=\"ayah\">﴿وَإِن يَكُن لَّهُمُ الْحَقُّ يَأْتُوا إِلَيْهِ مُذْعِنِينَ﴾<\/span> <span class=\"ref\">[النور: ٤٩]<\/span>،"], [215.0, "ثم علّل هذا العملَ الظاهريَّ الباطلَ بخللٍ في القلب،"], [220.0, "فقال الله عز وجل:"], [222.3, "<span class=\"ayah\">﴿أَفِي قُلُوبِهِم مَّرَضٌ أَمِ ارْتَابُوا أَمْ يَخَافُونَ أَن يَحِيفَ اللَّهُ عَلَيْهِمْ وَرَسُولُهُ ۚ بَلْ أُولَٰئِكَ هُمُ الظَّالِمُونَ﴾<\/span> <span class=\"ref\">[النور: ٥٠]<\/span>."]], "tr": [[200.0, "Allah Azze ve Celle yine bu ayette (devamında) şöyle buyurmuştur:"], [206.0, "<span class=\"ayah\">﴿Aralarında hüküm vermesi için Allah'a ve Resûlü'ne çağrıldıklarında, bakarsın ki içlerinden bir grup yüz çevirmektedir﴾<\/span> [Nûr 48]."], [211.8, "<span class=\"ayah\">﴿Eğer hak kendi lehlerine ise boyun eğerek ona gelirler﴾<\/span> [Nûr 49]."], [215.6, "Sonra bu bâtıl zahirî ameli kalpteki bir bozuklukla gerekçelendirdi ve Allah Azze ve Celle şöyle buyurdu:"], [222.3, "<span class=\"ayah\">﴿Kalplerinde bir hastalık mı var, yoksa şüpheye mi düştüler, yoksa Allah'ın ve Resûlü'nün kendilerine haksızlık edeceğinden mi korkuyorlar? Hayır, asıl zalimler onlardır﴾<\/span> [Nûr 50]."]]}, {"reader": false, "ar": [[233.0, "ثم قال الله عز وجل:"], [235.8, "<span class=\"ayah\">﴿إِنَّمَا كَانَ قَوْلَ الْمُؤْمِنِينَ إِذَا دُعُوا إِلَى اللَّهِ وَرَسُولِهِ لِيَحْكُمَ بَيْنَهُمْ أَن يَقُولُوا سَمِعْنَا وَأَطَعْنَا ۚ وَأُولَٰئِكَ هُمُ الْمُفْلِحُونَ﴾<\/span> <span class=\"ref\">[النور: ٥١]<\/span>؛"], [246.0, "فعلّل اللهُ عز وجل هذه الأعمالَ الظاهرةَ بوجود الإيمان وعدمه."], [252.0, "فلا يمكن أن يوجد الإيمانُ في القلب إلا ولا بدّ أن تظهر آثارُه على الجوارح."]], "tr": [[233.0, "Sonra Allah Azze ve Celle şöyle buyurdu:"], [235.8, "<span class=\"ayah\">﴿Aralarında hüküm vermesi için Allah'a ve Resûlü'ne çağrıldıklarında müminlerin sözü ancak \"İşittik ve itaat ettik\" demeleridir. İşte kurtuluşa erenler onlardır﴾<\/span> [Nûr 51]."], [246.0, "Allah Azze ve Celle bu zahirî amelleri imanın varlığı ve yokluğuyla gerekçelendirmiştir."], [252.0, "Kalpte iman bulunup da onun eserlerinin azalar üzerinde mutlaka görünmemesi mümkün değildir."]]}, {"reader": false, "ar": [[259.0, "وقال الله عز وجل:"], [261.8, "<span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ﴾<\/span> ـ وهذا حصرٌ للإيمان ـ <span class=\"ayah\">﴿الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ﴾<\/span> <span class=\"ref\">[الأنفال: ٢]<\/span> <span class=\"ayah\">﴿الَّذِينَ يُقِيمُونَ الصَّلَاةَ﴾<\/span> ـ وهو عملٌ ظاهر ـ <span class=\"ayah\">﴿وَمِمَّا رَزَقْنَاهُمْ يُنفِقُونَ﴾<\/span> <span class=\"ref\">[الأنفال: ٣]<\/span> ـ وهو عملٌ ظاهر ـ ثم قال:"], [283.9, "<span class=\"ayah\">﴿أُولَٰئِكَ هُمُ الْمُؤْمِنُونَ حَقًّا﴾<\/span> <span class=\"ref\">[الأنفال: ٤]<\/span>، وهو عملُ الباطن."]], "tr": [[259.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [261.8, "<span class=\"ayah\">﴿Müminler ancak﴾<\/span> —bu, imanı (bu vasıflara) hasretmektir— <span class=\"ayah\">﴿o kimselerdir ki Allah anıldığında kalpleri ürperir, O'nun ayetleri kendilerine okunduğunda imanlarını artırır ve yalnız Rablerine tevekkül ederler﴾<\/span> [Enfâl 2]."], [276.3, "<span class=\"ayah\">﴿Onlar namazı kılarlar﴾<\/span> —bu zahirî bir ameldir— <span class=\"ayah\">﴿ve kendilerine verdiğimiz rızıktan infak ederler﴾<\/span> [Enfâl 3] —bu da zahirî bir ameldir."], [283.9, "Sonra buyurdu: <span class=\"ayah\">﴿İşte gerçek müminler onlardır﴾<\/span> [Enfâl 4]; bu da bâtının amelidir."]]}, {"reader": false, "ar": [[287.0, "وقال الله عز وجل:"], [289.3, "<span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا وَجَاهَدُوا بِأَمْوَالِهِمْ وَأَنفُسِهِمْ فِي سَبِيلِ اللَّهِ ۚ أُولَٰئِكَ هُمُ الصَّادِقُونَ﴾<\/span> <span class=\"ref\">[الحجرات: ١٥]<\/span>؛"]], "tr": [[287.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [289.3, "<span class=\"ayah\">﴿Müminler ancak Allah'a ve Resûlü'ne iman eden, sonra şüpheye düşmeyen ve Allah yolunda mallarıyla ve canlarıyla cihad eden kimselerdir. İşte sadık olanlar onlardır﴾<\/span> [Hucurât 15]."]]}]}, {"ts": "05:00", "title": "1. Külliye (devam): Ayet ve hadislerde telâzüm; selefin sözleri", "paras": [{"reader": false, "ar": [[300.0, "فعلّل اللهُ عز وجل هذا الجهادَ في سبيله بالمال والنفس بالإيمان في القلب."], [307.0, "وقال الله عز وجل:"], [309.4, "<span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ وَإِذَا كَانُوا مَعَهُ عَلَىٰ أَمْرٍ جَامِعٍ لَّمْ يَذْهَبُوا حَتَّىٰ يَسْتَأْذِنُوهُ﴾<\/span> <span class=\"ref\">[النور: ٦٢]<\/span> الآيةَ بتمامها؛"], [321.0, "فجعل عدمَ مفارقة النبيّ صلى الله عليه وسلم في هذا الأمر الجامع إلا بعد استئذانه دليلًا على وجود الإيمان في القلب."]], "tr": [[300.0, "Allah Azze ve Celle, kendi yolunda malla ve canla yapılan bu cihadı kalpteki imanla gerekçelendirmiştir."], [307.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [309.4, "<span class=\"ayah\">﴿Müminler ancak Allah'a ve Resûlü'ne iman eden ve onunla birlikte toplu bir iş üzerinde bulunduklarında ondan izin istemedikçe gitmeyen kimselerdir﴾<\/span> [Nûr 62] —ayetin tamamı."], [322.2, "(Allah,) bu toplu işte Peygamber sallallâhu aleyhi ve sellem'den ancak izin istedikten sonra ayrılmayı kalpte imanın bulunduğuna delil kılmıştır."]]}, {"reader": false, "ar": [[330.0, "وقال الله عز وجل:"], [332.5, "<span class=\"ayah\">﴿فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّىٰ يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لَا يَجِدُوا فِي أَنفُسِهِمْ حَرَجًا مِّمَّا قَضَيْتَ وَيُسَلِّمُوا تَسْلِيمًا﴾<\/span> <span class=\"ref\">[النساء: ٦٥]<\/span>."], [343.0, "والآياتُ في هذا المعنى كثيرة،"], [345.9, "يربط اللهُ عز وجل فيها بين عمل الظاهر وعمل الباطن،"], [351.2, "لبيان التلازم العظيم الذي لا ينفكّ أبدًا بين الظاهر والباطن."], [357.1, "ونقصد بالباطن: أي عملَ القلب،"], [360.1, "ونقصد بالظاهر: أي عملَ الجوارح."]], "tr": [[330.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [332.5, "<span class=\"ayah\">﴿Hayır! Rabbine andolsun ki aralarında çıkan anlaşmazlıklarda seni hakem kılıp sonra da verdiğin hükümden içlerinde hiçbir sıkıntı duymadan tam bir teslimiyetle teslim olmadıkça iman etmiş olmazlar﴾<\/span> [Nisâ 65]."], [344.8, "Bu anlamda ayetler çoktur; Allah Azze ve Celle bunlarda, zahir ile bâtın arasındaki asla ayrılmayan büyük telâzümü açıklamak için zahirin ameli ile bâtının amelini birbirine bağlar."], [357.1, "Bâtın ile kalbin amelini, zahir ile de azaların amelini kastediyoruz."]]}, {"reader": false, "ar": [[363.0, "وفي الصحيحين يقول النبيّ صلى الله عليه وسلم في بيان هذا التلازم:"], [368.0, "«ألا وإنّ في الجسد مُضغةً، إذا صلَحت صلَح الجسدُ كلُّه، وإذا فسدت فسد الجسدُ كلُّه، ألا وهي القلب»."], [379.0, "فصلاحُ الباطن دليلٌ على صلاح الظاهر،"], [382.0, "وصلاحُ الظاهر دليلٌ على صلاح الباطن."]], "tr": [[363.0, "Sahîhayn'de Peygamber sallallâhu aleyhi ve sellem bu telâzümü açıklarken şöyle buyurur:"], [368.0, "\"Dikkat edin! Cesette bir et parçası vardır;"], [371.7, "o düzgün olursa bütün ceset düzgün olur, o bozulursa bütün ceset bozulur."], [379.0, "Dikkat edin, o kalptir.\" Bâtının salâhı zahirin salâhına delildir;"], [382.5, "zahirin salâhı da bâtının salâhına delildir."]]}, {"reader": false, "ar": [[385.0, "فلا يمكن أبدًا أن يقبل اللهُ عز وجل صلاحَ ظاهرٍ إذا لم يُبنَ على إيمانٍ صحيحٍ في الباطن؛"], [394.0, "لأنّ هذا عملُ المنافقين."], [396.0, "واللهُ عز وجل بيّن أنّ أعمال المنافقين وإن وافقت الشرعَ في الظاهر،"], [402.0, "إلا أنها لم تُبنَ على إيمانٍ صحيحٍ في الباطن."], [406.0, "ولا يمكن أن نقبل دعوى مُدَّعٍ بأنّ قلبه معمورٌ بالإيمان،"], [412.0, "وأنه مؤمنٌ بالله ورسوله،"], [414.0, "ونرى أنه لا يتّبع الشريعة أو يخالف فيها."]], "tr": [[385.0, "Allah Azze ve Celle'nin, bâtında sahih bir iman üzerine bina edilmemiş bir zahir salâhını kabul etmesi asla mümkün değildir;"], [394.0, "çünkü bu, münafıkların amelidir. Allah Azze ve Celle, münafıkların amellerinin zahirde şeriata uygun düşse bile bâtında sahih bir iman üzerine bina edilmediğini açıklamıştır."], [406.0, "Kalbinin imanla mamur olduğunu, Allah'a ve Resûlü'ne iman ettiğini iddia eden birinin iddiasını, onun şeriata uymadığını veya ona muhalefet ettiğini görürken kabul etmemiz mümkün değildir."]]}, {"reader": false, "ar": [[422.0, "ولذلك قال الحسنُ البصريّ رحمه الله تعالى:"], [426.0, "«الإيمانُ كلامٌ، وحقيقتُه العمل؛ فإن لم يُحقِّق القولَ بالعمل لم ينفعه القول»."], [437.0, "وقال الإمام الآجُرّيّ رحمه الله تعالى:"], [441.0, "«فالأعمالُ ـ رحمكم الله ـ بالجوارح تصديقٌ عن الإيمان بالقلب واللسان؛ فمن لم يُصدِّق الإيمانَ بعمل جوارحه ـ مثل الطهارة، والصلاة، والزكاة، والصيام، والحجّ، وأشباه ذلك ـ ورضي من نفسه بالمعرفة والقول، لم يكن مؤمنًا، ولم تنفعه المعرفةُ والقول، وكان تركُه للعمل تكذيبًا لإيمانه، وكان العملُ بما ذكرناه تصديقًا لإيمانه، وبالله التوفيق». انتهى كلامه."]], "tr": [[422.0, "Bu yüzden Hasan-ı Basrî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [424.3, "\"İman sözdür, hakikati ise ameldir;"], [426.0, "sözü amelle gerçekleştirmezse söz ona fayda vermez.\" İmam Âcurrî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [432.4, "\"Azalarla yapılan ameller —Allah size rahmet etsin— kalp ve dil ile olan imanın tasdikidir."], [437.0, "Kim imanı —temizlik, namaz, zekât, oruç, hac ve benzerleri gibi— azalarının ameliyle tasdik etmez de kendisi için ma'rifet ve sözle yetinirse mümin olmaz;"], [439.7, "ma'rifet ve söz ona fayda vermez."], [441.0, "Ameli terk etmesi imanını yalanlamak olur;"], [453.3, "zikrettiğimiz şeylerle amel etmesi ise imanını tasdik etmek olur."], [474.6, "Tevfik Allah'tandır.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[485.0, "وقال الأوزاعيّ رحمه الله تعالى:"], [489.0, "«كان من مضى ممّن سلف لا يُفرّقون بين الإيمان والعمل؛ العملُ من الإيمان، والإيمانُ من العمل. وإنما الإيمانُ اسمٌ جامع، كما جمع هذه الأديانَ اسمُها، وتصديقُه العمل. فمن آمن بلسانه، وعرف بقلبه، وصدّق ذلك بعمله، فذلك العروةُ الوثقى التي لا انفصامَ لها. ومن قال بلسانه، ولم يعرف بقلبه، ولم يُصدِّق بعمله، لم يُقبَل منه، وكان في الآخرة من الخاسرين». انتهى كلامه."]], "tr": [[485.0, "Evzâî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [489.7, "\"Geçmişte selef olanlar iman ile amel arasında ayrım yapmazlardı;"], [495.3, "amel imandandır, iman da amelden."], [498.3, "İman ancak (bunları) bir araya getiren bir isimdir;"], [502.9, "tıpkı bu dinleri isimlerinin bir araya getirmesi gibi."], [507.4, "Onun tasdiki ise ameldir. Kim diliyle iman eder, kalbiyle bilir ve bunu ameliyle tasdik ederse, işte bu, kopması olmayan sağlam kulptur."], [518.7, "Kim de diliyle söyleyip kalbiyle bilmez ve ameliyle tasdik etmezse ondan kabul edilmez ve âhirette hüsrana uğrayanlardan olur.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[528.0, "وقال الإمام ابن تيميّة رحمه الله تعالى:"], [532.0, "«إذا أُفرِد الإيمانُ» ـ يعني:"], [534.2, "ذُكر الإيمانُ في النصّ مُفرَدًا ـ قال رحمه الله:"], [538.8, "«إذا ذُكر الإيمانُ أُدخِل فيه الأعمالُ الظاهرة؛ لأنها لوازمُ ما في القلب؛ لأنه متى ثبت الإيمانُ في القلب، والتصديقُ بما أخبر به الرسولُ صلى الله عليه وسلم، وجب حصولُ مقتضى ذلك ضرورةً؛ فإنه ما أسرّ أحدٌ سريرةً إلا أبداها اللهُ على صفحات وجهه وفلتات لسانه. فإذا ثبت التصديقُ في القلب لم يتخلّف العملُ بمقتضاه ألبتّة»."], [573.6, "انتهى كلامه رحمه الله."]], "tr": [[528.0, "İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [532.0, "\"İman tek başına zikredildiğinde\" —yani nasta iman tek başına anıldığında— —Allah ona rahmet etsin— dedi ki:"], [536.4, "\"İman zikredildiğinde zahirî ameller ona dahil edilir;"], [538.8, "çünkü bunlar kalpteki şeyin lâzımlarıdır."], [542.4, "Zira kalpte iman ve Resûl sallallâhu aleyhi ve sellem'in haber verdiği şeylerin tasdiki sabit olduğunda, bunun gereğinin hâsıl olması zorunlu olarak vacip olur."], [560.8, "Çünkü hiç kimse bir sır gizlemez ki Allah onu yüzünün çizgilerinde ve dilinin sürçmelerinde açığa çıkarmasın."], [573.6, "Kalpte tasdik sabit olduğunda, onun gereğiyle amel asla geri kalmaz.\" Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[576.0, "وقال أيضًا رحمه الله تعالى:"], [579.4, "«القرآنُ يُبيّن أنّ إيمان القلب يستلزم العملَ الظاهرَ بحسبه»؛"], [587.0, "بمعنى أنه متى ما زاد إيمانُ القلب زاد عملُ الجوارح،"], [592.8, "ومتى نقص نقصت. وقال أيضًا:"], [595.3, "«القلبُ هو الأصل، فإذا كان فيه معرفةٌ وإرادةٌ سرى ذلك إلى البدن بالضرورة،"]], "tr": [[576.0, "Yine —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [579.4, "\"Kur'an, kalbin imanının, kendi ölçüsünce zahirî ameli gerektirdiğini açıklar.\" Yani kalbin imanı arttıkça azaların ameli artar;"], [590.5, "eksildikçe de (ameller) eksilir. Yine şöyle dedi:"], [594.0, "\"Kalp asıldır; onda ma'rifet ve irade bulunduğunda bu zorunlu olarak bedene sirayet eder;"]]}]}, {"ts": "10:05", "title": "1. Külliye (sonuç): İbn Teymiyye ve İbnü'l-Kayyim'in sözleri, özet", "paras": [{"reader": false, "ar": [[605.0, "لا يمكن أن يتخلّف البدنُ عمّا يريده القلب»."], [610.0, "انتهى كلامه. وقال رحمه الله:"], [613.0, "«فإذا كان القلبُ صالحًا بما فيه من الإيمان ـ علمًا وعملًا قلبيًّا ـ لزم ضرورةً صلاحُ الجسد بالقول الظاهر والعمل بالإيمان المطلق، كما قال أئمّةُ الحديث: قولٌ وعمل؛ قولٌ باطنٌ وظاهر، وعملٌ باطنٌ وظاهر». انتهى كلامه."]], "tr": [[605.0, "bedenin, kalbin istediği şeyden geri kalması mümkün değildir.\" Sözü burada bitti."], [610.0, "Yine —Allah ona rahmet etsin— şöyle dedi:"], [613.0, "\"Kalp, içindeki iman sebebiyle —ilim ve kalbî amel olarak— salih olduğunda, mutlak iman ile zahirî söz ve amelde cesedin salâhı zorunlu olarak lâzım gelir."], [623.7, "Nitekim hadis imamları (iman için) 'söz ve ameldir;"], [628.0, "bâtın ve zahir söz, bâtın ve zahir amel' demişlerdir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[635.0, "وأختم ذلك بقول الإمام ابن القيّم رحمه الله تعالى،"], [638.0, "قال: «فكلُّ إسلامٍ ظاهرٍ لا ينفذ صاحبُه منه إلى حقيقة الإيمان الباطنة فليس بنافعٍ حتى يكون معه شيءٌ من الإيمان الباطن، وكلُّ حقيقةٍ باطنةٍ لا يقوم صاحبُها بشرائع الإسلام الظاهرة لا تنفع ولو كانت ما كانت. فلو تمزّق القلبُ بالمحبّة والخوف، ولم يتعبّد بالأمر وظاهرِ الشرع، لم يُنجِه ذلك من النار، كما أنه لو قام بظواهر الإسلام وليس في باطنه حقيقةُ الإيمان لم يُنجِه من النار». انتهى كلامه."]], "tr": [[635.0, "Bunu İmam İbnü'l-Kayyim'in —Allah Teâlâ ona rahmet etsin— sözüyle bitiriyorum."], [636.0, "Dedi ki: \"Sahibinin ondan bâtınî iman hakikatine ulaşamadığı her zahirî İslâm, beraberinde bâtınî imandan bir şey bulunmadıkça fayda vermez."], [638.7, "Sahibinin İslâm'ın zahirî şeriatlerini yerine getirmediği her bâtınî hakikat de ne olursa olsun fayda vermez."], [649.1, "Kalp sevgi ve korkudan paramparça olsa, fakat (kişi) emirle ve şeriatın zahiriyle kulluk etmese, bu onu ateşten kurtarmaz."], [664.5, "Aynı şekilde İslâm'ın zahirî hükümlerini yerine getirse de bâtınında iman hakikati bulunmasa, (bu da) onu ateşten kurtarmaz.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[679.0, "والخلاصة ـ وفّقكم الله ـ أنّ هذا التلازم بين الظاهر والباطن يُبيّن لك أنّ نقصَ أحدهما مؤثِّرٌ على نقص الآخر؛"], [689.0, "فالنقصُ في الأعمال الظاهرة إنما هو لنقص ما في القلب من الإيمان،"], [695.0, "كما أنّ التفريط في الأعمال الظاهرة مؤثِّرٌ على نقص الإيمان في القلب."], [701.0, "وكمالُ الإيمان الواجب الذي في القلب لا يمكن أن يكون صادقًا إلا إذا أيّده العمل."]], "tr": [[679.0, "Özet —Allah size muvaffakiyet versin— şudur:"], [681.8, "Zahir ile bâtın arasındaki bu telâzüm, birinin eksikliğinin diğerinin eksikliğine tesir ettiğini sana açıklar."], [689.0, "Zahirî amellerdeki eksiklik ancak kalpteki imanın eksikliğindendir;"], [693.0, "aynı şekilde zahirî amellerde kusur etmek de kalpteki imanın eksilmesine tesir eder."], [701.0, "Kalpteki vacip imanın kemâli ancak amel onu desteklediğinde sadık (gerçek) olabilir."]]}, {"reader": false, "ar": [[711.0, "وأزيد الأمرَ توضيحًا وأقول:"], [714.0, "من المعلوم أنّ من شروط «لا إله إلا الله» القبولَ والانقياد،"], [719.1, "أليس كذلك؟ الجواب: بلى."], [721.2, "والقبولُ هو عملُ القلب،"], [723.6, "والانقيادُ هو عملُ الجوارح؛"], [726.0, "فكلّما عظُم قبولُ القلب عظُم انقيادُ الجوارح. والله أعلم."]], "tr": [[711.0, "Meseleyi daha da açıklayarak derim ki:"], [714.0, "Bilindiği üzere \"Lâ ilâhe illallah\"ın şartlarından biri kabul ve inkıyaddır (boyun eğmektir), öyle değil mi?"], [720.0, "Cevap: Evet. Kabul kalbin amelidir, inkıyad ise azaların amelidir."], [726.0, "Kalbin kabulü büyüdükçe azaların inkıyadı da büyür. Allah en iyisini bilir."]]}]}, {"ts": "12:14", "title": "2. Külliye: Bütün kalp amelleri, sebeplerinin farklılaşmasıyla artma ve eksilme bakımından farklılaşır", "paras": [{"reader": false, "ar": [[734.0, "ومن الكلّيّات أيضًا: <b>كلُّ أعمال القلوب تتفاوت بتفاوت أسبابها زيادةً ونقصًا.<\/b> <span class=\"note\">(يكررها)<\/span> مرّةً ثالثة:"], [755.0, "<b>كلُّ أعمال القلوب تتفاوت بتفاوت أسبابها زيادةً ونقصًا.<\/b> أقول وبالله التوفيق:"], [763.2, "وهي من الكلّيّات التي أجمع عليها أهلُ السنة والجماعة."], [767.0, "ونعني بأعمال القلوب: أي كالمحبّة،"], [770.5, "والخشية، والخشوع، والذلّ، والإنابة،"], [773.3, "والتوكّل، والحياء، والرغبة، والرهبة،"], [776.3, "والخوف، والرجاء، وغيرها؛ فهي جميعُها من أعمال القلوب."]], "tr": [[734.0, "Külliyelerden biri de şudur: 2."], [736.1, "külliye: Bütün kalp amelleri, sebeplerinin farklılaşmasıyla artma ve eksilme bakımından farklılaşır. (Tekrar ediyor.) Üçüncü kez:"], [755.0, "<b>Bütün kalp amelleri, sebeplerinin farklılaşmasıyla artma ve eksilme bakımından farklılaşır.<\/b> Tevfik Allah'tandır, derim ki:"], [763.2, "Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâ ettiği külliyelerdendir."], [767.0, "Kalp amelleri ile sevgi, haşyet, huşû, zillet (boyun eğiş), inâbe, tevekkül, hayâ, rağbet, rehbet (dehşet), havf, recâ ve benzerlerini kastediyoruz; bunların hepsi kalp amellerindendir."]]}, {"reader": false, "ar": [[783.0, "وهذه الأعمالُ القلبيّة تتفاوت بتفاوت أسبابها؛"], [790.0, "أي: فمتى ما حقّق المسلمُ أسبابَ زيادتها زادت في قلبه،"], [795.0, "ومتى ما أهمل أسبابَ زيادتها،"], [797.3, "أو ارتكب شيئًا من أسباب نقصها،"], [800.0, "فإنها تنقص في قلبه."], [802.0, "قال الإمام ابن تيميّة رحمه الله تعالى:"], [806.0, "«الذي مضى عليه سلفُ الأمّة وأئمّتُها أنّ نفسَ الإيمان الذي في القلوب يتفاضل». انتهى كلامه."]], "tr": [[783.0, "Bu kalbî ameller, sebeplerinin farklılaşmasıyla farklılaşır;"], [790.0, "yani Müslüman onların artma sebeplerini gerçekleştirdiğinde kalbinde artarlar;"], [793.0, "artma sebeplerini ihmal ettiğinde veya eksilme sebeplerinden bir şey işlediğinde kalbinde eksilirler."], [797.7, "İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [802.0, "\"Ümmetin selefinin ve imamlarının üzerinde olduğu görüş şudur:"], [806.0, "Kalplerdeki imanın bizzat kendisi derece derece üstünlük gösterir (tefâzul eder).\" Sözü burada bitti."]]}, {"reader": false, "ar": [[816.0, "والدليلُ على هذا التفاضل قولُ الله عز وجل:"], [820.0, "<span class=\"ayah\">﴿وَمِنَ النَّاسِ مَن يَتَّخِذُ مِن دُونِ اللَّهِ أَندَادًا يُحِبُّونَهُمْ كَحُبِّ اللَّهِ ۖ وَالَّذِينَ آمَنُوا أَشَدُّ حُبًّا لِّلَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ١٦٥]<\/span>،"], [828.1, "والمحبّةُ عملٌ قلبيّ، فأثبت الشارعُ تفاوتَها بين المؤمن والكافر."]], "tr": [[816.0, "Bu tefâzulün delili Allah Azze ve Celle'nin şu sözüdür:"], [820.0, "<span class=\"ayah\">﴿İnsanlardan bazıları Allah'tan başkasını O'na denk tutarlar da onları Allah'ı sever gibi severler. İman edenlerin Allah'a sevgisi ise daha şiddetlidir﴾<\/span> [Bakara 165]."], [827.5, "Sevgi kalbî bir ameldir; Şâri' onun mümin ile kâfir arasında farklılaştığını isbat etmiştir."]]}, {"reader": false, "ar": [[833.0, "وقال الله عز وجل:"], [835.5, "<span class=\"ayah\">﴿قُلْ إِن كَانَ آبَاؤُكُمْ وَأَبْنَاؤُكُمْ وَإِخْوَانُكُمْ وَأَزْوَاجُكُمْ وَعَشِيرَتُكُمْ وَأَمْوَالٌ اقْتَرَفْتُمُوهَا وَتِجَارَةٌ تَخْشَوْنَ كَسَادَهَا وَمَسَاكِنُ تَرْضَوْنَهَا أَحَبَّ إِلَيْكُم مِّنَ اللَّهِ وَرَسُولِهِ وَجِهَادٍ فِي سَبِيلِهِ فَتَرَبَّصُوا حَتَّىٰ يَأْتِيَ اللَّهُ بِأَمْرِهِ ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الْفَاسِقِينَ﴾<\/span> <span class=\"ref\">[التوبة: ٢٤]<\/span>."], [857.0, "وهذا دليلٌ على تفاوت أعمال القلوب؛"], [860.0, "فقولُه في الآيتين: «أحبّ» ـ هذا من أصرح الأدلّة الدالّة على تفاضل الناس في المحبّة؛"], [868.0, "لأنه أفعلُ تفضيلٍ على ما تقرّر في اللغة."]], "tr": [[833.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [835.5, "<span class=\"ayah\">﴿De ki: Eğer babalarınız, oğullarınız, kardeşleriniz, eşleriniz, akrabanız, kazandığınız mallar, kesada uğramasından korktuğunuz ticaret ve hoşlandığınız meskenler size Allah'tan, Resûlü'nden ve O'nun yolunda cihad etmekten daha sevimli ise, Allah emrini getirinceye kadar bekleyin. Allah fâsıklar topluluğunu hidayete erdirmez﴾<\/span> [Tevbe 24]."], [857.0, "Bu, kalp amellerinin farklılaştığına delildir."], [860.0, "İki ayetteki \"daha (sevimli/şiddetli)\" ifadesi, insanların sevgide derece derece farklı olduğuna delâlet eden en açık delillerdendir;"], [868.0, "çünkü dilde yerleşik olduğu üzere bu, ism-i tafdîldir (üstünlük sîgasıdır)."]]}, {"reader": false, "ar": [[873.0, "وكذلك يقول الله عز وجل:"], [874.0, "<span class=\"ayah\">﴿وَيَزْدَادَ الَّذِينَ آمَنُوا إِيمَانًا﴾<\/span> <span class=\"ref\">[المدثر: ٣١]<\/span>،"], [877.0, "والزيادةُ والنقصانُ في الإيمان تقع في أصله وفي كمالاته."], [882.0, "وقال الله عز وجل:"], [884.9, "<span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ﴾<\/span> <span class=\"ref\">[الأنفال: ٢]<\/span>؛"], [889.1, "فكلّما ازدادوا ذِكرًا ازدادوا وجَلًا."], [893.0, "وكذلك أيضًا يدلّ عليها ما في الصحيحين من حديث أنسٍ رضي الله عنه،"], [898.0, "قال: قال النبيّ صلى الله عليه وسلم:"]], "tr": [[873.0, "Aynı şekilde Allah Azze ve Celle şöyle buyurur:"], [874.0, "<span class=\"ayah\">﴿…ve iman edenlerin imanı artsın﴾<\/span> [Müddessir 31]."], [877.6, "İmandaki artma ve eksilme hem onun aslında hem de kemâllerinde olur."], [882.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [884.9, "<span class=\"ayah\">﴿Müminler ancak o kimselerdir ki Allah anıldığında kalpleri ürperir﴾<\/span> [Enfâl 2];"], [889.1, "zikirleri arttıkça ürpermeleri de artar."], [893.0, "Aynı şekilde Sahîhayn'de Enes'in —Allah ondan razı olsun— hadisinde geçen şu da buna delâlet eder;"], [898.3, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"]]}]}, {"ts": "15:00", "title": "2. Külliye (devam): Sevgide ve diğer kalp amellerinde tefâzulün delilleri", "paras": [{"reader": false, "ar": [[900.0, "«لا يؤمن أحدُكم حتى أكون أحبَّ إليه من ولده ووالده والناس أجمعين»."], [907.0, "فهذا دليلٌ على التفاضل في المحبّة."], [909.0, "ومثلُهما في الصحيحين أيضًا من حديثه رضي الله عنه،"], [913.0, "قال: قال النبيّ صلى الله عليه وسلم:"], [916.7, "«ثلاثٌ من كنّ فيه وجد بهنّ حلاوةَ الإيمان» ـ وتلك الحلاوةُ تتفاوت زيادةً ونقصًا بتحقيق العابد لهذه المقتضيات الثلاث المذكورة في قوله صلى الله عليه وسلم ـ:"], [930.0, "«أن يكون اللهُ ورسولُه أحبَّ إليه ممّا سواهما، وأن يُحبَّ المرءَ لا يُحبُّه إلا لله، وأن يكره أن يعود في الكفر بعد أن أنقذه اللهُ منه كما يكره أن يُقذَف في النار»."]], "tr": [[900.0, "\"Ben kendisine çocuğundan, babasından ve bütün insanlardan daha sevimli olmadıkça sizden biri iman etmiş olmaz.\" Bu, sevgide tefâzule delildir."], [909.0, "Bunun benzeri yine Sahîhayn'de onun —Allah ondan razı olsun— hadisindedir;"], [913.5, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [916.7, "\"Üç şey vardır ki kimde bulunursa onlarla imanın tadını bulur\" —bu tat, kulun sallallâhu aleyhi ve sellem'in sözünde zikredilen bu üç gerekliliği gerçekleştirmesine göre artma ve eksilme bakımından farklılaşır—:"], [931.4, "\"Allah ve Resûlü'nün kendisine onlardan başka her şeyden daha sevimli olması, bir kimseyi yalnızca Allah için sevmesi ve Allah onu küfürden kurtardıktan sonra küfre dönmekten, ateşe atılmaktan hoşlanmadığı gibi hoşlanmaması.\""]]}, {"reader": false, "ar": [[943.0, "وفي الحديث عن عبد الله بن هشام قال:"], [946.7, "«كنّا مع النبيّ صلى الله عليه وسلم وهو آخذٌ بيد عمرَ بن الخطّاب رضي الله عنه، فقال له عمر: يا رسول الله، لأنتَ أحبُّ إليّ من كلّ شيءٍ إلا من نفسي. فقال النبيّ صلى الله عليه وسلم: لا، والذي نفسي بيده، حتى أكون أحبَّ إليك من نفسك. فقال له عمر: فإنه الآن ـ والله ـ لأنتَ أحبُّ إليّ من نفسي. فقال النبيّ صلى الله عليه وسلم: الآنَ يا عمر»."]], "tr": [[943.0, "Abdullah b. Hişâm'dan gelen hadiste şöyle dedi:"], [945.8, "\"Peygamber sallallâhu aleyhi ve sellem ile birlikteydik;"], [949.0, "o, Ömer b. el-Hattâb'ın —Allah ondan razı olsun— elini tutuyordu."], [953.5, "Ömer ona: 'Ey Allah'ın Resûlü!"], [955.4, "Sen bana nefsim dışında her şeyden daha sevimlisin' dedi."], [959.6, "Peygamber sallallâhu aleyhi ve sellem:"], [961.9, "'Hayır, nefsim elinde olana andolsun ki ben sana nefsinden daha sevimli olana kadar (olmaz)' buyurdu."], [968.0, "Ömer ona: 'Şimdi —vallahi— sen bana nefsimden daha sevimlisin' dedi."], [973.5, "Peygamber sallallâhu aleyhi ve sellem:"], [975.8, "'Şimdi oldu, ey Ömer' buyurdu.\""]]}, {"reader": false, "ar": [[978.0, "فالناسُ يتفاضلون في حبّ الله ورسوله،"], [980.7, "وفي خشية الله، ويتفاوتون في الإنابة إلى الله والتوكّل عليه،"], [985.0, "ويتفاوتون في الإخلاص له،"], [988.0, "ويتفاوتون في سلامة القلوب من الرياء والكِبر والعُجب وغير ذلك،"], [993.0, "وكذلك أيضًا يتفاوتون في الإخلاص،"], [996.6, "ويتفاوتون في الرجاء، ويتفاوتون في كلّ عملٍ من أعمال القلوب."]], "tr": [[978.0, "İnsanlar Allah'ı ve Resûlü'nü sevmede ve Allah'tan haşyet duymada birbirlerinden üstün olurlar;"], [983.7, "Allah'a inâbede ve O'na tevekkülde farklılaşırlar;"], [987.2, "O'na ihlâsta farklılaşırlar; kalplerin riyâdan, kibirden, ucbdan ve diğerlerinden selâmetinde farklılaşırlar."], [993.7, "Aynı şekilde ihlâsta farklılaşırlar, recâda farklılaşırlar ve kalp amellerinin her birinde farklılaşırlar."]]}, {"reader": false, "ar": [[1004.0, "فليس من صدّق اللهَ ورسولَه تصديقًا مُجمَلًا لجهله بالأدلّة،"], [1012.0, "كمن صدّق اللهَ ورسولَه تصديقًا مُفصَّلًا بعد دراسةٍ في الأدلّة."], [1018.0, "ولذلك قال الله عز وجل عن خليله إبراهيم:"], [1023.0, "<span class=\"ayah\">﴿أَرِنِي كَيْفَ تُحْيِي الْمَوْتَىٰ ۖ قَالَ أَوَلَمْ تُؤْمِن ۖ قَالَ بَلَىٰ وَلَٰكِن لِّيَطْمَئِنَّ قَلْبِي﴾<\/span> <span class=\"ref\">[البقرة: ٢٦٠]<\/span>؛"], [1033.0, "فأراد إبراهيمُ عليه الصلاة والسلام أن ينتقل من علم اليقين إلى عين اليقين،"], [1042.0, "وهذا دليلٌ على تفاوت أصل الإيمان في القلب."]], "tr": [[1004.0, "Delilleri bilmediği için Allah'ı ve Resûlü'nü icmâlî (genel) bir tasdikle tasdik eden kimse, delilleri inceledikten sonra Allah'ı ve Resûlü'nü tafsîlî (ayrıntılı) bir tasdikle tasdik eden kimse gibi değildir."], [1023.0, "Bu yüzden Allah Azze ve Celle, dostu İbrâhîm hakkında şöyle buyurdu:"], [1033.0, "<span class=\"ayah\">﴿\"Bana ölüleri nasıl dirilttiğini göster.\" (Allah) \"İnanmadın mı?\" dedi. (İbrâhîm) \"Evet (inandım), fakat kalbim tatmin olsun diye\" dedi﴾<\/span> [Bakara 260]."], [1041.1, "İbrâhîm aleyhissalâtü vesselâm ilme'l-yakînden ayne'l-yakîne geçmek istedi."], [1044.0, "Bu, kalpteki imanın aslının farklılaştığına delildir."]]}, {"reader": false, "ar": [[1046.0, "وسؤالُه عليه الصلاة والسلام ليس سؤالَ شكٍّ أبدًا،"], [1051.0, "كما قال صلى الله عليه وسلم:"], [1053.7, "«نحن أولى بالشكّ من إبراهيم»،"], [1056.0, "وإنما أراد أن ينتقل بإيمانه في إحياء الموتى من علم اليقين القطعيّ إلى عين اليقين."], [1065.0, "وبناءً على ذلك، فالإيمانُ في القلب يزيد وينقص،"], [1069.6, "كما أجمع عليه أهلُ السنة والجماعة."]], "tr": [[1046.0, "Onun —aleyhissalâtü vesselâm— sorusu asla bir şüphe sorusu değildir."], [1050.4, "Nitekim sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1053.7, "\"Şüpheye biz İbrâhîm'den daha lâyığız.\" O ancak ölülerin diriltilmesi hususundaki imanıyla kesin ilme'l-yakînden ayne'l-yakîne geçmek istemişti."], [1065.0, "Buna göre kalpteki iman artar ve eksilir;"], [1069.0, "Ehl-i Sünnet ve'l-Cemaat'in icmâ ettiği gibi."]]}, {"reader": false, "ar": [[1073.0, "وكذلك أيضًا المحبّةُ تزيد وتنقص،"], [1076.5, "والتوكّلُ يزيد وينقص، والخشيةُ تزيد وتنقص،"], [1082.0, "والخوفُ يزيد وينقص، والرغبةُ والإخلاصُ والرجاءُ والصبرُ والرضا كلُّ ذلك يزيد وينقص،"], [1092.0, "واليقينُ يزيد وينقص، وتفكُّرُ العبد بقلبه يزيد وينقص،"], [1098.0, "وشكرُ القلب لله عز وجل يزيد وينقص،"], [1103.0, "والخشوعُ والحياءُ والمراقبةُ وندمُ القلب وتوبتُه أيضًا تزيد وتنقص."], [1112.0, "وهذه قاعدةٌ بالإجماع؛ فكلُّ ما يُنسَب إلى القلب من العمل فإنه يتفاوت بتفاوت أسبابه زيادةً ونقصًا."]], "tr": [[1073.0, "Aynı şekilde sevgi artar ve eksilir;"], [1079.2, "tevekkül artar ve eksilir; haşyet artar ve eksilir;"], [1089.5, "havf artar ve eksilir; rağbet, ihlâs, recâ, sabır ve rızâ, bunların hepsi artar ve eksilir;"], [1112.0, "yakîn artar ve eksilir; kulun kalbiyle tefekkürü artar ve eksilir;"], [1112.7, "kalbin Allah Azze ve Celle'ye şükrü artar ve eksilir;"], [1113.3, "huşû, hayâ, murâkabe, kalbin pişmanlığı ve tövbesi de artar ve eksilir."], [1114.0, "Bu, icmâ ile sabit bir kaidedir:"], [1116.9, "Kalbe nispet edilen her amel, sebeplerinin farklılaşmasıyla artma ve eksilme bakımından farklılaşır."]]}]}, {"ts": "18:44", "title": "3. Külliye: Bütün kalp amellerinin asılları vacip, kemâlleri menduptur", "paras": [{"reader": false, "ar": [[1124.0, "ويُوضِّح ذلك الكلّيّةُ الثالثة ـ أو الرابعة ـ:"], [1130.0, "<b>كلُّ أعمال القلوب فأصولُها واجبةٌ وكمالاتُها مندوبة.<\/b> <span class=\"note\">(يكررها)<\/span> أظنّ القاعدة واضحة:"], [1147.0, "<b>كلُّ أعمال القلوب فأصولُها واجبةٌ وكمالاتُها مندوبة.<\/b>"]], "tr": [[1124.0, "Bunu üçüncü —veya dördüncü— külliye açıklar:"], [1130.0, "<b>3. külliye: Bütün kalp amellerinin asılları vacip, kemâlleri menduptur.<\/b> (Tekrar ediyor.) Zannederim kaide açıktır:"], [1147.7, "<b>Bütün kalp amellerinin asılları vacip, kemâlleri menduptur.<\/b>"]]}, {"reader": false, "ar": [[1154.0, "أقول وبالله التوفيق: فأصلُ أعمال القلوب الواجبة ـ كالإخلاص،"], [1159.5, "والمحبّة، والتوكّل، والخوف، والرجاء ـ هذه أصولُها فرضٌ على كلّ مسلمٍ لا يسقط بحال،"], [1172.0, "وما زاد على القدر المُجزِئ منها فيتوجّه نحو الكمالات والمستحبّات والنوافل القلبيّة،"], [1181.0, "ليترقّى العبدُ في منازل الإحسان."]], "tr": [[1154.0, "Tevfik Allah'tandır, derim ki: Vacip olan kalp amellerinin aslı —ihlâs, sevgi, tevekkül, havf ve recâ gibi—, bunların asılları her Müslümana farzdır, hiçbir hâlde düşmez."], [1156.0, "Bunların yeterli (müczî) miktarının üzerinde olan ise kemâllere, müstehaplara ve kalbî nafilelere yönelir;"], [1174.5, "ta ki kul ihsan menzillerinde yükselsin."]]}, {"reader": false, "ar": [[1184.0, "قال ابن تيميّة رحمه الله ـ وهو يُقرِّر هذه الكلّيّة ـ،"], [1188.0, "قال: «أعمالُ القلوب هي من أصول الإيمان وقواعد الدين، مثل محبّة الله ورسوله، والتوكّل عليه، وإخلاص الدين له، والشكر له، والصبر على حكمه، والخوف منه، والرجاء له، وما يتبع ذلك؛ فهذه الأعمالُ جميعًا واجبةٌ على جميع الخلق باتّفاق أئمّة الدين». انتهى كلامه."]], "tr": [[1184.0, "İbn Teymiyye —Allah ona rahmet etsin— bu külliyeyi tespit ederken şöyle dedi:"], [1188.4, "\"Kalp amelleri imanın asıllarından ve dinin kaidelerindendir;"], [1191.1, "Allah'ı ve Resûlü'nü sevmek, O'na tevekkül etmek, dini O'na has kılmak, O'na şükretmek, O'nun hükmüne sabretmek, O'ndan korkmak, O'ndan ummak ve bunlara tâbi olan şeyler gibi."], [1204.8, "Bu amellerin hepsi, din imamlarının ittifakıyla bütün halka vaciptir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1212.0, "ويوضّحه ما قاله الإمام ابن القيّم رحمه الله؛"], [1215.0, "فإنه قد حكى اتّفاقَ الأمّة على وجوب الأعمال السابقة من حيث الجملة،"], [1221.0, "وزاد عليها: الصدقَ، والإنابةَ،"], [1223.4, "والنيّةَ في العبادة، والنصحَ في العبوديّة."], [1227.0, "ثم قال رحمه الله ـ مقرِّرًا لهذه الكلّيّة ـ:"], [1231.0, "«وكذلك كلُّ واحدٍ من هذه الواجبات القلبيّة له طرفان: واجبٌ مستحَقّ، وهي مرتبةُ أصحاب اليمين، وكمالٌ مستحبّ، وهي مرتبةُ المقرَّبين»."]], "tr": [[1212.0, "Bunu İmam İbnü'l-Kayyim'in —Allah ona rahmet etsin— söylediği de açıklar."], [1215.0, "O, ümmetin, yukarıdaki amellerin genel olarak vacip olduğunda ittifak ettiğini nakletmiş ve bunlara sıdkı, inâbeyi, ibadette niyeti ve kullukta samimiyeti (nasihati) eklemiştir."], [1227.0, "Sonra —Allah ona rahmet etsin— bu külliyeyi tespit ederek şöyle demiştir:"], [1231.0, "\"Aynı şekilde bu kalbî vaciplerin her birinin iki ucu vardır:"], [1234.6, "Hak edilen vacip —bu, Ashâb-ı Yemîn'in mertebesidir— ve müstehap kemâl —bu da mukarrebûnun mertebesidir.\""]]}, {"reader": false, "ar": [[1247.0, "وبناءً على ذلك فأصلُ الإخلاص واجبٌ وكمالاتُه مندوبة،"], [1257.0, "وأصلُ التوكّل واجبٌ وكمالاتُه مندوبة،"], [1260.0, "وأصلُ الرجاء واجبٌ وكمالاتُه مندوبة،"], [1263.3, "وأصلُ الرضا واجبٌ وكمالاتُه مندوبة."], [1264.0, "وهكذا نقوله في كلّ أعمال القلوب؛"], [1271.0, "فإنّ منها قدرًا لا يصحّ الإيمانُ إلا به،"], [1275.3, "وهو أصلُها، أصلُ وجودها في القلب،"], [1278.0, "ومنها كمالٌ مندوبٌ مستحبّ قد ندب إليه الشرع، وهو كمالاتُها."]], "tr": [[1247.0, "Buna göre ihlâsın aslı vacip, kemâlleri menduptur;"], [1257.6, "tevekkülün aslı vacip, kemâlleri menduptur;"], [1262.4, "recânın aslı vacip, kemâlleri menduptur;"], [1264.0, "rızânın aslı vacip, kemâlleri menduptur."], [1266.3, "Bütün kalp amellerinde böyle deriz:"], [1271.0, "Bunlardan, iman ancak onunla sahih olan bir miktar vardır;"], [1274.2, "bu onların aslıdır, kalpte var olmalarının aslıdır."], [1276.9, "Bunlardan şeriatın teşvik ettiği mendup ve müstehap bir kemâl de vardır; bu da onların kemâlleridir."]]}, {"reader": false, "ar": [[1286.0, "وكلُّ من حقّق كمالاتِ الأعمال القلبيّة فهو مُحسِنٌ،"], [1295.0, "داخلٌ في قول النبيّ صلى الله عليه وسلم في تفسير الإحسان:"], [1299.7, "«أن تعبدَ اللهَ كأنّك تراه، فإن لم تكن تراه فإنه يراك»."], [1305.2, "والإحسانُ يختلف كمالًا ونقصًا باختلاف أعمال القلوب كمالًا ونقصًا. والله أعلم."]], "tr": [[1286.0, "Kalbî amellerin kemâllerini gerçekleştiren herkes muhsindir;"], [1288.9, "Peygamber sallallâhu aleyhi ve sellem'in ihsanı tefsir ederken söylediği şu söze dahildir:"], [1297.6, "\"Allah'a, O'nu görüyormuşsun gibi ibadet etmendir;"], [1299.7, "sen O'nu görmüyorsan da O seni görür.\" İhsan, kalp amellerinin kemâl ve noksanlıkta farklılaşmasıyla kemâl ve noksanlıkta farklılaşır. Allah en iyisini bilir."]]}]}, {"ts": "21:51", "title": "4. Külliye: Selefin hepsi imanın artıp eksildiğinde ittifak etmiştir", "paras": [{"reader": false, "ar": [[1311.0, "الكلّيّة الرابعة: <b>كلُّ السلف متّفقون على أنّ الإيمان يزيد وينقص.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [1324.0, "وهذا إجماعٌ قطعيٌّ يقينيٌّ ثابتٌ عن سلف الأمّة وأئمّتها،"], [1342.0, "وقد حكاه جمعٌ من أهل العلم."]], "tr": [[1311.0, "<b>4. külliye: Selefin hepsi imanın artıp eksildiğinde ittifak etmiştir.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [1324.0, "Bu, ümmetin selefinden ve imamlarından sabit, kat'î ve yakînî bir icmâdır;"], [1342.0, "ilim ehlinden bir topluluk bunu nakletmiştir."]]}, {"reader": false, "ar": [[1346.0, "قال يحيى بن سعيدٍ القطّان رحمه الله:"], [1350.3, "«ما أدركتُ أحدًا من أصحابنا إلا على سُنّتنا في الإيمان، ويقولون: الإيمانُ يزيد وينقص»."], [1359.0, "وقال أيضًا: «كلُّ من أدركتُ من الأئمّة كانوا يقولون: الإيمانُ قولٌ وعمل، يزيد وينقص»."]], "tr": [[1346.0, "Yahyâ b. Saîd el-Kattân —Allah ona rahmet etsin— şöyle dedi:"], [1352.2, "\"Arkadaşlarımızdan, iman konusunda bizim sünnetimiz üzere olmayan hiç kimseye yetişmedim;"], [1359.0, "'İman artar ve eksilir' derler.\" Yine şöyle dedi:"], [1361.5, "\"Yetiştiğim imamların hepsi 'İman söz ve ameldir; artar ve eksilir' derlerdi.\""]]}, {"reader": false, "ar": [[1366.0, "وقال عبد الرزّاق الصنعانيّ:"], [1368.1, "«لقيتُ اثنين وستّين شيخًا، منهم: مَعمَر، والأوزاعيّ، والثوريّ، والوليد بن محمدٍ القُرَشيّ، ويزيد بن السائب، وحمّاد بن سلمة، وحمّاد بن زيد، وسفيان بن عُيَينة، وشعيب بن حرب، ووكيع بن الجرّاح، ومالك بن أنس، وابن أبي ليلى، وإسماعيل بن عيّاش، والوليد بن مسلم، ومن لم نُسَمِّه؛ كلُّهم يقولون: الإيمانُ قولٌ وعمل، يزيد وينقص»."]], "tr": [[1366.0, "Abdürrezzâk es-San'ânî şöyle dedi: \"Altmış iki şeyhle karşılaştım;"], [1368.6, "aralarında Ma'mer, Evzâî, Sevrî, Velîd b."], [1371.7, "Muhammed el-Kureşî, Yezîd b. es-Sâib, Hammâd b."], [1374.8, "Seleme, Hammâd b. Zeyd, Süfyân b."], [1377.9, "Uyeyne, Şuayb b. Harb, Vekî' b."], [1381.0, "el-Cerrâh, Mâlik b. Enes, İbn Ebî Leylâ, İsmâîl b."], [1385.2, "Ayyâş, Velîd b. Müslim ve adını saymadıklarımız vardır;"], [1389.3, "hepsi 'İman söz ve ameldir; artar ve eksilir' derler.\""]]}, {"reader": false, "ar": [[1394.0, "وقال الإمام أحمد رحمه الله تعالى في ذكر جُمَلٍ من اعتقاده:"], [1399.0, "«الإيمانُ قولٌ وعمل، يزيد وينقص»،"], [1404.0, "ثم ذكر أمورًا، ثم قال:"], [1406.1, "«هذا ما اجتمع عليه السلفُ من العلماء في الآفاق»."], [1410.0, "وقال الإمام البخاريّ رحمه الله تعالى:"], [1412.0, "«لقيتُ أكثرَ من ألف رجلٍ من العلماء بالأمصار، فما رأيتُ أحدًا يختلف في أنّ الإيمان قولٌ وعمل، ويزيد وينقص»."]], "tr": [[1394.0, "İmam Ahmed —Allah Teâlâ ona rahmet etsin— itikadından bazı cümleleri zikrederken şöyle dedi:"], [1399.0, "\"İman söz ve ameldir; artar ve eksilir.\" Sonra bazı hususları zikretti, ardından şöyle dedi:"], [1406.1, "\"Bu, ufuklardaki âlimlerden selefin üzerinde birleştiği şeydir.\" İmam Buhârî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1412.0, "\"Şehirlerde âlimlerden binden fazla adamla karşılaştım;"], [1415.8, "hiçbirinin imanın söz ve amel olduğunda, artıp eksildiğinde ihtilaf ettiğini görmedim.\""]]}, {"reader": false, "ar": [[1423.0, "وقال الإمام ابن بطّال رحمه الله تعالى:"], [1426.7, "«مذهبُ جماعة أهل السنة من سلف الأمّة وخلفها أنّ الإيمان قولٌ وعمل، ويزيد وينقص»."], [1434.0, "وقال الإمام ابن عبد البرّ رحمه الله تعالى:"], [1437.8, "«أجمع أهلُ الفقه والحديث على أنّ الإيمان قولٌ وعمل، ولا عملَ إلا بنيّة، والإيمانُ عندهم يزيد بالطاعة، وينقص بالمعصية»."], [1448.0, "وقال ابن تيميّة ـ ونختم به ـ:"], [1451.4, "«أجمع السلفُ أنّ الإيمان قولٌ وعمل، يزيد وينقص»."]], "tr": [[1423.0, "İmam İbn Battâl —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1426.7, "\"Ümmetin selefinden ve haleflerinden Ehl-i Sünnet cemaatinin mezhebi, imanın söz ve amel olduğu, artıp eksildiğidir.\" İmam İbn Abdilber —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1437.8, "\"Fıkıh ve hadis ehli, imanın söz ve amel olduğunda ve niyetsiz amelin olmadığında icmâ etmişlerdir;"], [1444.2, "onlara göre iman taatle artar, masiyetle eksilir.\" İbn Teymiyye —ki onunla bitiriyoruz— şöyle dedi:"], [1451.4, "\"Selef, imanın söz ve amel olduğunda, artıp eksildiğinde icmâ etmiştir.\""]]}, {"reader": false, "ar": [[1457.0, "وهذا الإجماعُ مؤيَّدٌ بالأدلّة من الكتاب والسنة."], [1461.0, "فأمّا من الكتاب فقولُ الله عز وجل:"], [1464.8, "<span class=\"ayah\">﴿وَيَزْدَادَ الَّذِينَ آمَنُوا إِيمَانًا﴾<\/span> <span class=\"ref\">[المدثر: ٣١]<\/span>،"], [1467.0, "وقال الله عز وجل:"], [1469.0, "<span class=\"ayah\">﴿لِيَزْدَادُوا إِيمَانًا مَّعَ إِيمَانِهِمْ﴾<\/span> <span class=\"ref\">[الفتح: ٤]<\/span>،"], [1471.0, "وقال الله عز وجل:"], [1473.2, "<span class=\"ayah\">﴿وَيَزِيدُ اللَّهُ الَّذِينَ اهْتَدَوْا هُدًى﴾<\/span> <span class=\"ref\">[مريم: ٧٦]<\/span>،"], [1476.0, "وقال الله عز وجل:"], [1478.2, "<span class=\"ayah\">﴿وَمَا زَادَهُمْ إِلَّا إِيمَانًا وَتَسْلِيمًا﴾<\/span> <span class=\"ref\">[الأحزاب: ٢٢]<\/span>."]], "tr": [[1457.0, "Bu icmâ Kitap ve Sünnet'ten delillerle desteklenmiştir."], [1461.0, "Kitap'tan olanlara gelince: Allah Azze ve Celle'nin şu sözü:"], [1464.8, "<span class=\"ayah\">﴿…ve iman edenlerin imanı artsın﴾<\/span> [Müddessir 31]."], [1467.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1469.0, "<span class=\"ayah\">﴿…imanlarına iman katsınlar diye﴾<\/span> [Fetih 4]."], [1471.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1473.2, "<span class=\"ayah\">﴿Allah hidayete erenlerin hidayetini artırır﴾<\/span> [Meryem 76]."], [1475.4, "Allah Azze ve Celle şöyle buyurmuştur:"], [1478.2, "<span class=\"ayah\">﴿Bu, onların ancak imanlarını ve teslimiyetlerini artırdı﴾<\/span> [Ahzâb 22]."]]}, {"reader": false, "ar": [[1481.0, "وقال الله عز وجل:"], [1483.0, "<span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ﴾<\/span> ـ وهذا الوجلُ دليلٌ على زيادة الإيمان ـ <span class=\"ayah\">﴿وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ﴾<\/span> <span class=\"ref\">[الأنفال: ٢]<\/span>."], [1496.0, "وقال الله عز وجل:"], [1498.8, "«وإذا ما أُنزلت سورةٌ نظر بعضُهم» ـ عفوًا ـ"]], "tr": [[1481.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1483.0, "<span class=\"ayah\">﴿Müminler ancak o kimselerdir ki Allah anıldığında kalpleri ürperir﴾<\/span> —bu ürperti imanın artmasına delildir— <span class=\"ayah\">﴿O'nun ayetleri kendilerine okunduğunda imanlarını artırır ve yalnız Rablerine tevekkül ederler﴾<\/span> [Enfâl 2]."], [1496.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1499.5, "\"Bir sûre indirildiğinde birbirlerine bakarlar\" —pardon—"]]}]}, {"ts": "25:06", "title": "4. Külliye (devam): İmanın artıp eksildiğine Sünnet'ten ve sahâbeden deliller", "paras": [{"reader": false, "ar": [[1501.2, "<span class=\"ayah\">﴿وَإِذَا مَا أُنزِلَتْ سُورَةٌ فَمِنْهُم مَّن يَقُولُ أَيُّكُمْ زَادَتْهُ هَٰذِهِ إِيمَانًا ۚ فَأَمَّا الَّذِينَ آمَنُوا فَزَادَتْهُمْ إِيمَانًا وَهُمْ يَسْتَبْشِرُونَ﴾<\/span> <span class=\"ref\">[التوبة: ١٢٤]<\/span>."], [1514.0, "وكذلك في السنة أيضًا،"], [1516.2, "كما في حديث أبي سعيدٍ الخدريّ رضي الله عنه،"], [1521.0, "قال: قال النبيّ صلى الله عليه وسلم:"], [1525.5, "«يدخل أهلُ الجنّة الجنّةَ، وأهلُ النار النارَ، ثم يقول الله عز وجل: أخرِجوا من كان في قلبه مثقالُ حبّةِ خردلٍ من إيمان» متّفقٌ عليه."], [1540.4, "ووجهُ الشاهد منه: أنّ مقدار الخردلة شيءٌ يسيرٌ جدًّا."]], "tr": [[1501.2, "<span class=\"ayah\">﴿Bir sûre indirildiğinde içlerinden \"Bu, hanginizin imanını artırdı?\" diyenler olur. İman edenlere gelince, o onların imanını artırmıştır ve onlar sevinirler﴾<\/span> [Tevbe 124]."], [1514.0, "Aynı şekilde Sünnet'te de vardır;"], [1516.2, "Ebû Saîd el-Hudrî'nin —Allah ondan razı olsun— hadisinde olduğu gibi;"], [1521.6, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1525.5, "\"Cennet ehli cennete, cehennem ehli cehenneme girer."], [1530.0, "Sonra Allah Azze ve Celle:"], [1533.0, "'Kalbinde hardal tanesi ağırlığınca iman bulunanı (ateşten) çıkarın' buyurur.\" Müttefekun aleyh."], [1540.4, "Buradaki delil yönü şudur: Hardal tanesinin miktarı çok az bir şeydir."]]}, {"reader": false, "ar": [[1550.0, "وكذلك أيضًا في حديث أبي هريرة أنّ النبيّ صلى الله عليه وسلم قال:"], [1557.2, "«لا يزني الزاني حين يزني وهو مؤمن، ولا يسرق السارقُ حين يسرق وهو مؤمن، ولا يشرب الخمرَ حين يشربها وهو مؤمن، ولا ينتهب نُهبةً ذاتَ شرفٍ يرفع الناسُ إليه أبصارَهم فيها حين ينتهبها وهو مؤمن، ولا يَغُلّ حين يَغُلّ وهو مؤمن»،"], [1577.0, "والحديث في الصحيحين. وفي رواية الإمام البخاريّ من حديث ابن عبّاس:"], [1582.0, "«ولا يقتل حين يقتل وهو مؤمن»."], [1585.0, "قال الإمام أبو عبد الله البخاريّ رحمه الله تعالى:"], [1588.0, "«أي: لا يكون مؤمنًا تامًّا، ولا يكون له نورُ الإيمان»."], [1592.0, "فالإيمانُ المنفيُّ هنا إنما هو كمالُه."]], "tr": [[1550.0, "Aynı şekilde Ebû Hüreyre'nin hadisinde Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1553.8, "\"Zina eden, zina ettiği sırada mümin olarak zina etmez;"], [1557.2, "hırsız, çaldığı sırada mümin olarak çalmaz;"], [1561.6, "içki içen, içtiği sırada mümin olarak içmez;"], [1566.0, "insanların gözlerini kendisine kaldırıp baktığı değerli bir şeyi yağmalayan, yağmaladığı sırada mümin olarak yağmalamaz;"], [1579.0, "ganimetten çalan, çaldığı sırada mümin olarak çalmaz.\" Hadis Sahîhayn'dedir."], [1582.0, "İmam Buhârî'nin İbn Abbâs hadisinden rivayetinde:"], [1585.0, "\"Adam öldüren, öldürdüğü sırada mümin olarak öldürmez.\" İmam Ebû Abdillah el-Buhârî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1588.0, "\"Yani tam mümin olmaz ve onun için imanın nuru olmaz.\" Burada nefyedilen iman, ancak imanın kemâlidir."]]}, {"reader": false, "ar": [[1596.0, "وفي حديث أبي سعيدٍ رضي الله عنه في الصحيحين أنّ النبيّ صلى الله عليه وسلم قال للنساء:"], [1603.0, "«ما رأيتُ من ناقصاتِ عقلٍ ودينٍ أذهبَ لِلُبِّ الرجل الحازم من إحداكنّ»."], [1612.0, "وفي الحديث يقول النبيّ صلى الله عليه وسلم:"], [1615.0, "«أكملُ المؤمنين إيمانًا أحسنُهم خُلُقًا»."], [1619.0, "وهذا دليلٌ على تفاوت الإيمان زيادةً ونقصًا."]], "tr": [[1596.0, "Sahîhayn'de Ebû Saîd'in —Allah ondan razı olsun— hadisinde Peygamber sallallâhu aleyhi ve sellem kadınlara şöyle buyurmuştur:"], [1603.0, "\"Aklı ve dini eksik olup da kararlı bir adamın aklını sizden biri kadar çelen birini görmedim.\" Hadiste Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [1615.0, "\"İmanca müminlerin en kâmili, ahlâkça en güzel olanlarıdır.\" Bu, imanın artma ve eksilme bakımından farklılaştığına delildir."]]}, {"reader": false, "ar": [[1623.0, "وفي الصحيح من حديث ابن مسعودٍ رضي الله عنه قال:"], [1627.1, "قال النبيّ صلى الله عليه وسلم:"], [1629.5, "«ما من نبيٍّ بعثه اللهُ في أمّةٍ قبلي إلا كان له من أمّته حواريّون وأصحابٌ يأخذون بسُنّته ويقتدون بأمره، ثم إنها تخلُف من بعدهم خُلوفٌ يقولون ما لا يفعلون، ويفعلون ما لا يُؤمَرون؛ فمن جاهدهم بيده فهو مؤمن، ومن جاهدهم بلسانه فهو مؤمن، ومن جاهدهم بقلبه فهو مؤمن، وليس وراء ذلك من الإيمان حبّةُ خردل»."], [1655.0, "وفي صحيح الإمام مسلم من حديث أبي سعيدٍ أيضًا:"], [1660.0, "«من رأى منكم منكرًا فليُغيِّره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه، وذلك أضعفُ الإيمان»."]], "tr": [[1623.0, "Sahîh'te İbn Mes'ûd'un —Allah ondan razı olsun— hadisinde şöyle dedi:"], [1627.1, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1629.5, "\"Allah'ın benden önce bir ümmete gönderdiği her peygamberin, ümmetinden sünnetine sarılan ve emrine uyan havârileri ve ashâbı olmuştur."], [1640.1, "Sonra onların ardından, yapmadıklarını söyleyen ve emredilmedikleri şeyleri yapan kötü nesiller gelir."], [1648.9, "Kim onlarla eliyle cihad ederse o mümindir;"], [1655.0, "kim diliyle cihad ederse o mümindir;"], [1656.1, "kim kalbiyle cihad ederse o mümindir."], [1657.2, "Bunun ötesinde hardal tanesi kadar iman yoktur.\" Yine İmam Müslim'in Sahîh'inde Ebû Saîd'in hadisinde:"], [1660.0, "\"Sizden kim bir münker görürse onu eliyle değiştirsin;"], [1662.9, "buna gücü yetmezse diliyle; buna da gücü yetmezse kalbiyle (buğzetsin);"], [1667.6, "bu da imanın en zayıfıdır.\""]]}, {"reader": false, "ar": [[1670.0, "وكان عمرُ بن الخطّاب رضي الله عنه يقول لأصحابه:"], [1675.2, "«هلُمّوا نزددْ إيمانًا»، وفي لفظ:"], [1678.1, "«تعالَوا نزددْ إيمانًا». وقال عبد الله بن مسعودٍ رضي الله عنه:"], [1684.5, "«اجلسوا بنا نزددْ إيمانًا»،"], [1686.8, "وكان يقول في دعائه:"], [1689.1, "«اللهمّ زِدني إيمانًا ويقينًا وفقهًا»."]], "tr": [[1670.0, "Ömer b. el-Hattâb —Allah ondan razı olsun— arkadaşlarına \"Gelin, imanımızı artıralım\" derdi;"], [1675.2, "bir lafızda: \"Haydi gelin, imanımızı artıralım.\" Abdullah b."], [1679.8, "Mes'ûd —Allah ondan razı olsun— şöyle dedi:"], [1684.5, "\"Bizimle oturun da imanımızı artıralım.\" Duasında da \"Allah'ım!"], [1687.9, "Bana iman, yakîn ve fıkıh (anlayış) artır\" derdi."]]}, {"reader": false, "ar": [[1692.0, "وعن جُندب بن عبد الله البَجَليّ رضي الله عنه قال:"], [1696.5, "«كنّا مع النبيّ صلى الله عليه وسلم ونحن فتيانٌ حَزاوِرة، فتعلّمنا الإيمانَ قبل أن نتعلّم القرآن، فازددنا به إيمانًا»."], [1707.0, "وعن عُمَير بن حبيبٍ الخَطْميّ رضي الله عنه قال:"], [1711.8, "«الإيمانُ يزيد وينقص». فقيل:"], [1714.8, "وما زيادتُه ونقصانُه؟ قال:"], [1717.6, "«إذا ذكرنا اللهَ عز وجل وحمدناه وسبّحناه فذلك زيادتُه، وإذا غفلنا وضيّعنا ونسينا فذلك نقصانُه»."]], "tr": [[1692.0, "Cündeb b. Abdullah el-Becelî'den —Allah ondan razı olsun— şöyle dediği rivayet edilir:"], [1694.7, "\"Peygamber sallallâhu aleyhi ve sellem ile birlikteydik;"], [1696.5, "biz buluğa yaklaşmış güçlü gençlerdik."], [1698.7, "Kur'an'ı öğrenmeden önce imanı öğrendik;"], [1701.0, "(sonra Kur'an'ı öğrendik ve) onunla imanımız arttı.\" Umeyr b."], [1707.0, "Habîb el-Hatmî'den —Allah ondan razı olsun— şöyle dediği rivayet edilir:"], [1710.0, "\"İman artar ve eksilir.\" \"Artması ve eksilmesi nedir?\" denildi."], [1714.0, "Dedi ki: \"Allah Azze ve Celle'yi zikrettiğimizde, O'na hamd ettiğimizde ve O'nu tesbih ettiğimizde, işte bu onun artmasıdır;"], [1722.0, "gafil olduğumuzda, zayi ettiğimizde ve unuttuğumuzda, işte bu da onun eksilmesidir.\""]]}, {"reader": false, "ar": [[1727.0, "وعن علقمة بن قيسٍ النخعيّ أنه كان يقول لأصحابه:"], [1731.8, "«امشوا بنا نزددْ إيمانًا»."], [1734.0, "وكتب عمرُ بن عبد العزيز رحمه الله تعالى إلى عديّ بن عديّ:"], [1738.0, "«إنّ للإيمان فرائضَ وشرائعَ وحدودًا وسُنَنًا، فمن استكملها استكمل الإيمان، ومن لم يستكملها لم يستكمل الإيمان»."], [1748.7, "وكلامُ السلف في هذا كثيرٌ جدًّا."]], "tr": [[1727.0, "Alkame b. Kays en-Neha'î'den, arkadaşlarına \"Bizimle yürüyün de imanımızı artıralım\" dediği rivayet edilir."], [1734.0, "Ömer b. Abdülazîz —Allah Teâlâ ona rahmet etsin— Adî b."], [1738.0, "Adî'ye şöyle yazdı: \"İmanın farzları, şeriatleri, hadleri ve sünnetleri vardır."], [1746.0, "Kim bunları tamamlarsa imanı tamamlamış olur;"], [1748.7, "kim bunları tamamlamazsa imanı tamamlamamış olur.\" Selefin bu konudaki sözleri pek çoktur."]]}]}, {"ts": "29:11", "title": "4. Külliye (devam): Bazı seleften \"eksilir\" demekte tevakkuf ve İmam Mâlik'in görüşü", "paras": [{"reader": false, "ar": [[1751.0, "فإن قلت: أوَلم يثبت عن بعض السلف ـ رحمهم الله تعالى ـ كمالك بن أنسٍ وغيره أنهم أثبتوا زيادةَ الإيمان ولم يقولوا بأنه ينقص،"], [1767.0, "فأثبتوا الزيادةَ دون النقصان؟"], [1769.6, "فأقول: بلى، قد ثبت ذلك،"], [1772.8, "ولكن ثبت عن مالكٍ رحمه الله تعالى تراجعُه عن عدم وصف الإيمان بالنقصان."]], "tr": [[1751.0, "Eğer şöyle dersen: Mâlik b."], [1753.6, "Enes ve başkaları gibi bazı seleften —Allah Teâlâ onlara rahmet etsin— imanın artmasını isbat edip eksildiğini söylemedikleri, yani eksilmeyi değil yalnız artmayı isbat ettikleri sabit olmadı mı?"], [1769.6, "Derim ki: Evet, bu sabit olmuştur."], [1772.8, "Fakat Mâlik'ten —Allah Teâlâ ona rahmet etsin— imanı eksilmeyle nitelememekten döndüğü de sabit olmuştur."]]}, {"reader": false, "ar": [[1784.0, "والذي حمل هؤلاء على عدم التصريح بالنقصان ليس لأنهم يعتقدون أنه لا ينقص،"], [1792.0, "وإنما لأنّ لفظ النقصان لم يرد في القرآن موصوفًا به الإيمان؛"], [1798.0, "وإنما اللهُ عز وجل وصف الإيمانَ بأنه يزداد،"], [1804.0, "وليس في القرآن شيءٌ من وصف الإيمان بالنقص."], [1808.0, "فصرّحوا بما صرّح به القرآن،"], [1810.7, "وسكتوا عمّا لم يتكلّم به القرآن."]], "tr": [[1784.0, "Bunları eksilmeyi açıkça söylememeye sevk eden şey, imanın eksilmediğine inanmaları değildir;"], [1792.0, "aksine eksilme lafzının Kur'an'da imanın vasfı olarak gelmemesidir."], [1798.0, "Allah Azze ve Celle imanı ancak artmakla nitelemiştir;"], [1804.0, "Kur'an'da imanın eksilmeyle nitelenmesine dair bir şey yoktur."], [1808.0, "Onlar da Kur'an'ın açıkça söylediğini açıkça söylemiş, Kur'an'ın söz etmediği şey hakkında susmuşlardır."]]}, {"reader": false, "ar": [[1814.0, "وإلا فالجميعُ متّفقون على أنّ الإيمان من شأنه أن يزيد وأن ينقص،"], [1822.0, "لكنّ التعبير بالنقص لمّا لم يُذكَر في القرآن توقّف جمعٌ من السلف عن التصريح به."], [1831.0, "وقد ثبت عن مالكٍ ـ رضي الله تعالى عنه وأرضاه ـ أنه صرّح بالنقص."]], "tr": [[1814.0, "Yoksa hepsi, imanın artmak ve eksilmek özelliğine sahip olduğunda ittifak hâlindedir."], [1822.0, "Fakat eksilme ifadesi Kur'an'da zikredilmeyince seleften bir topluluk onu açıkça söylemekte tevakkuf etmiştir."], [1831.0, "Mâlik'ten —Allah Teâlâ ondan razı olsun ve onu razı etsin— eksilmeyi açıkça söylediği sabit olmuştur."]]}, {"reader": false, "ar": [[1838.0, "قال ابن تيميّة رحمه الله ـ انتبهوا ـ:"], [1840.0, "«كان بعضُ الفقهاء من أتباع التابعين لم يوافقوا في إطلاق النقصان عليه؛ لأنهم وجدوا ذِكرَ الزيادة في القرآن، ولم يجدوا ذِكرَ النقص، وهذه إحدى الروايتين عن مالك»."], [1855.0, "ولكنه رحمه الله ترك التوقّف في القول بالنقص،"], [1860.0, "وثبت عنه القولُ بزيادة الإيمان ونقصانه،"], [1863.0, "وهذا هو المعروفُ عنه عند أهل العلم رحمهم الله تعالى."]], "tr": [[1838.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi —dikkat edin!—:"], [1840.0, "\"Etbâu't-tâbiînden bazı fakihler, imana eksilme (lafzının) mutlak olarak verilmesinde (diğerlerine) muvafakat etmediler;"], [1844.5, "çünkü Kur'an'da artmanın zikrini buldular, eksilmenin zikrini bulmadılar."], [1847.8, "Bu, Mâlik'ten gelen iki rivayetten biridir.\" Fakat o —Allah ona rahmet etsin— eksilmeyi söylemekte tevakkufu bırakmıştır;"], [1855.0, "ondan imanın artması ve eksilmesi görüşü sabit olmuştur."], [1860.5, "İlim ehli —Allah Teâlâ onlara rahmet etsin— katında ondan bilinen görüş de budur."]]}, {"reader": false, "ar": [[1868.0, "كما قال أحمدُ بن القاسم:"], [1871.3, "«تذاكرنا من قال: الإيمانُ يزيد وينقص، فعدّ الإمامُ أحمد غيرَ واحد، ثم قال: ومالكُ بن أنسٍ يقول: يزيد وينقص. فقلتُ له: إنّ مالكًا يحكون عنه أنه قال: يزيد ولا ينقص. فقال: بلى، قد رُوي عنه: يزيد وينقص؛ كان ابنُ نافعٍ يحكيه عن مالك. فقلتُ له: ابنُ نافعٍ يحكيه عن مالك؟ قال: نعم»."]], "tr": [[1868.0, "Nitekim Ahmed b. el-Kâsım şöyle dedi:"], [1871.3, "\"'İman artar ve eksilir' diyenleri müzakere ettik;"], [1876.0, "İmam Ahmed birçok kişiyi saydı, sonra 'Mâlik b."], [1880.7, "Enes de artar ve eksilir der' dedi."], [1884.8, "Ona: 'Mâlik'ten artar, eksilmez dediğini naklediyorlar' dedim."], [1888.3, "'Evet, (ama) ondan artar ve eksilir (dediği) de rivayet edilmiştir;"], [1895.0, "İbn Nâfi' bunu Mâlik'ten naklederdi' dedi."], [1896.7, "Ona: 'İbn Nâfi' bunu Mâlik'ten mi naklediyor?' dedim. 'Evet' dedi.\""]]}, {"reader": false, "ar": [[1902.0, "وقال عبد الرزّاق: «سمعتُ معمرًا، وسفيانَ الثوريّ، ومالكَ بن أنس، وابنَ جُرَيج، وسفيانَ بن عُيَينة، كلُّهم يقول: الإيمانُ قولٌ وعمل، يزيد وينقص». والله أعلم."]], "tr": [[1902.0, "Abdürrezzâk şöyle dedi: \"Ma'mer'i, Süfyân es-Sevrî'yi, Mâlik b."], [1904.4, "Enes'i, İbn Cüreyc'i ve Süfyân b."], [1908.4, "Uyeyne'yi işittim; hepsi 'İman söz ve ameldir;"], [1912.7, "artar ve eksilir' diyordu.\" Allah en iyisini bilir."]]}]}, {"ts": "31:59", "title": "5. Külliye: İmanı artmayan ve eksilmeyen tek bir parça sayan herkes bid'at ehlindendir", "paras": [{"reader": false, "ar": [[1919.0, "ومن الكلّيّات أيضًا ـ الكلّيّة الخامسة ـ «ملّيتُه، ملّيتُه منّي» <span class=\"q\">؟ 31:59<\/span> ـ الخامسة ـ:"], [1922.0, "<b>كلُّ من جعل الإيمانَ جزءًا واحدًا لا يزيد ولا ينقص فمن أهل البدع.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [1946.0, "<b>كلُّ من جعل الإيمانَ جزءًا واحدًا لا يزيد ولا ينقص فمن أهل البدع.<\/b>"]], "tr": [[1919.0, "Külliyelerden biri de —beşinci külliye— (…) <span class=\"q\">؟<\/span> —beşinci—:"], [1922.0, "<b>5. külliye: İmanı artmayan ve eksilmeyen tek bir parça sayan herkes bid'at ehlindendir.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [1946.9, "<b>İmanı artmayan ve eksilmeyen tek bir parça sayan herkes bid'at ehlindendir.<\/b>"]]}, {"reader": false, "ar": [[1952.1, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أنّ من أعظم الخلل في باب الإيمان هو ما تنصّ عليه هذه الكلّيّة العظيمة،"], [1966.0, "وهي أنّ كلَّ الطوائف التي خالفت أهلَ السنة في مقتضيات الإيمان اتّفقوا على أنّ الإيمان جزءٌ واحدٌ كالحجر،"], [1975.8, "لا يزيد ولا ينقص."], [1979.0, "فالإيمانُ عند أهل البدع جزءٌ لا يقبل زيادةً ولا نقصًا،"], [1986.4, "ويقولون بأنّ زيادتَه غلوّ،"], [1989.2, "ونقصانَه كفر؛ هكذا يقولون."]], "tr": [[1952.1, "Tevfik Allah'tandır, derim ki: Bil ki —Allah Teâlâ sana rahmet etsin— iman babındaki en büyük bozukluklardan biri, bu büyük külliyenin belirttiği şeydir:"], [1966.5, "İmanın gerektirdikleri konusunda Ehl-i Sünnet'e muhalefet eden bütün fırkalar, imanın taş gibi tek bir parça olduğunda, artmadığında ve eksilmediğinde ittifak etmişlerdir."], [1979.0, "Bid'at ehline göre iman, artma da eksilme de kabul etmeyen bir parçadır."], [1985.7, "Onun artmasının gulüv (aşırılık), eksilmesinin küfür olduğunu söylerler; işte böyle derler."]]}, {"reader": false, "ar": [[1996.0, "فإن قلت: ومن الذي ذهب إلى ذلك؟"], [2000.5, "فأقول: ذهب إليه المرجئةُ على مختلف أصنافهم،"], [2005.0, "سواءٌ المرجئةُ الغلاة أو مرجئةُ الفقهاء؛"], [2008.6, "فكلُّهم متّفقون على أنّ الإيمان لا يزيد ولا ينقص."], [2014.0, "وذهب إليه الوعيديّةُ من الخوارج والمعتزلة؛"], [2021.0, "فكلُّهم متّفقون على أنّ الإيمان لا يزيد ولا ينقص."]], "tr": [[1996.0, "Eğer \"Buna kim gitmiştir?\" dersen, derim ki:"], [2000.5, "Buna çeşitli sınıflarıyla Mürcie gitmiştir;"], [2003.7, "ister aşırı Mürcie olsun ister fukahâ Mürcie'si, hepsi imanın artmadığında ve eksilmediğinde ittifak etmişlerdir."], [2014.0, "Buna Hâricîler ve Mu'tezile'den oluşan Vaîdiyye de gitmiştir;"], [2021.0, "onların hepsi de imanın artmadığında ve eksilmediğinde ittifak etmişlerdir."]]}, {"reader": false, "ar": [[2026.0, "وهذا الاعتقادُ الفاسدُ في الإيمان هو الذي جعل المرجئةَ يقولون:"], [2032.5, "لا يضرّ مع الإيمان ذنب؛"], [2036.0, "لأننا لو قلنا بأنّ الذنب يُنقِص الإيمان،"], [2041.0, "فإننا نُثبت النقص، ونحن نقول بأنه لا ينقص."], [2047.0, "وهو الذي حمل الوعيديّةَ من الخوارج والمعتزلة على إخراج مرتكب الكبيرة من الإيمان؛"], [2056.0, "لأنهم يعتقدون أنه متى ما نقص شيءٌ من الإيمان بالذنب فإنّ نقصانَ البعض ذهابٌ للكلّ."]], "tr": [[2026.0, "İmandaki bu fâsid inanç, Mürcie'yi \"İmanla birlikte hiçbir günah zarar vermez\" demeye sevk eden şeydir."], [2036.0, "(Onların mantığı şudur:) \"Günahın imanı eksilttiğini söylersek eksilmeyi isbat etmiş oluruz;"], [2043.0, "oysa biz imanın eksilmediğini söylüyoruz.\" Hâricîler ve Mu'tezile'den oluşan Vaîdiyye'yi büyük günah işleyeni imandan çıkarmaya sevk eden de odur;"], [2056.0, "çünkü onlar, günahla imandan bir şey eksildiğinde, bir kısmın eksilmesinin bütünün gitmesi olduğuna inanırlar."]]}, {"reader": false, "ar": [[2067.0, "فصرّح الخوارجُ بأنّ ارتكاب الذنب يُدمِّر الإيمانَ كلَّه،"], [2075.0, "فيخرج به العبدُ من دائرة الإيمان إلى دائرة الكفر."], [2079.0, "وأمّا المعتزلة فإنهم قالوا:"], [2081.9, "بمجرّد فعله للذنب دُمِّر إيمانُه كلُّه،"], [2087.0, "ولكن فيكون قد خرج من دائرة الإيمان،"], [2091.0, "ولكن لم يصل إلى دائرة الكفر؛"], [2094.0, "فهو في منزلةٍ بين المنزلتين."]], "tr": [[2067.0, "Hâricîler, günah işlemenin imanın tamamını yok ettiğini, kulun bununla iman dairesinden küfür dairesine çıktığını açıkça söylediler."], [2079.0, "Mu'tezile ise şöyle dediler: Sadece günahı işlemesiyle imanının tamamı yok olur;"], [2087.6, "fakat iman dairesinden çıkmış olur, ama küfür dairesine de ulaşmamış olur;"], [2094.0, "o, iki menzile arasındaki bir menziledir."]]}, {"reader": false, "ar": [[2096.0, "فلو تأمّلتَ الذي أوقعهم ـ فلو تأمّلتَ ما أوقعهم في هذه الأقوال الفاسدة ـ"]], "tr": [[2096.0, "Onları düşüren şeyi —onları bu fâsid sözlere düşüren şeyi— düşünecek olursan,"]]}]}, {"ts": "35:03", "title": "5. Külliye (devam): İbn Teymiyye'nin açıklaması ve Ehl-i Sünnet'in bu bid'atlerden korunması", "paras": [{"reader": false, "ar": [[2103.0, "لوجدتَ أنها تلك العقيدةُ الفاسدة التي تنصّ على أنّ الإيمان جزءٌ واحدٌ لا يزيد ولا ينقص."], [2112.0, "فمن أعظم الخلل في مسألة الإيمان هو أن نعتقد أنّ الإيمان جزءٌ واحدٌ لا يقبل زيادةً ولا نقصًا."], [2123.0, "ويُوضّح ذلك ابنُ تيميّة رحمه الله بقوله ـ انتبهوا ـ:"], [2126.0, "«أمّا قولُ القائل: إنّ الإيمان إذا ذهب بعضُه ذهب كلُّه، فهذا ممنوع»،"], [2135.0, "وهذا ـ أي: هذا الاعتقادُ الفاسد بأنه لا يزيد ولا ينقص ـ «وهذا هو الأصلُ الذي تفرّعت عنه البدعُ في الإيمان»."]], "tr": [[2103.0, "imanın artmayan ve eksilmeyen tek bir parça olduğunu belirten o fâsid akîde olduğunu görürdün."], [2112.0, "İman meselesindeki en büyük bozukluklardan biri, imanın artma ve eksilme kabul etmeyen tek bir parça olduğuna inanmamızdır."], [2123.0, "İbn Teymiyye —Allah ona rahmet etsin— bunu şu sözüyle açıklar —dikkat edin!—:"], [2126.0, "\"Birinin 'İmanın bir kısmı gittiğinde tamamı gider' demesine gelince, bu kabul edilemez.\" Bu —yani imanın artmadığı ve eksilmediğine dair bu fâsid inanç—, \"bu, iman konusundaki bid'atlerin kendisinden dallandığı asıldır.\""]]}, {"reader": false, "ar": [[2145.7, "أنتم معي يا إخواني ولّا لا؟"], [2149.0, "«وهذا هو الأصلُ الذي تفرّعت عنه البدعُ في الإيمان؛ فإنهم ظنّوا أنه متى ما ذهب بعضُه ذهب كلُّه، لم يبقَ منه شيء. ثم قالت الخوارجُ والمعتزلة: هو مجموعُ ما أمر اللهُ به ورسولُه، وهو الإيمانُ المطلق، كما قال أهلُ الحديث. قالوا: فإذا ذهب شيءٌ منه لم يبقَ مع صاحبه من الإيمان شيء، فيُخلَّد في النار»؛"], [2175.0, "يعني: بمعنى أنهم قالوا قولًا يخالف أقوالَ أهل الحديث."]], "tr": [[2145.7, "Benimle misiniz kardeşlerim, değil misiniz?"], [2146.7, "\"Bu, iman konusundaki bid'atlerin kendisinden dallandığı asıldır."], [2149.0, "Çünkü onlar, imanın bir kısmı gittiğinde tamamının gideceğini, ondan hiçbir şey kalmayacağını zannettiler."], [2162.3, "Sonra Hâricîler ve Mu'tezile şöyle dediler:"], [2168.0, "İman, Allah'ın ve Resûlü'nün emrettiği şeylerin toplamıdır;"], [2175.0, "hadis ehlinin dediği gibi mutlak iman budur."], [2176.3, "Dediler ki: Ondan bir şey gittiğinde sahibinde imandan hiçbir şey kalmaz;"], [2178.3, "dolayısıyla ateşte ebedî kalır.\" Yani hadis ehlinin sözlerine aykırı bir söz söylediler."]]}, {"reader": false, "ar": [[2181.0, "فالذي جعل المرجئةَ يقولون بأنه لا يضرّ مع الإيمان ذنب هو المحافظةُ على تلك القاعدة الفاسدة،"], [2189.0, "والذي جعل الخوارجَ من الوعيديّة والمعتزلةَ يُخرِجون مرتكبَ الكبيرة عن دائرة الإيمان هو المحافظةُ على هذه القاعدة الفاسدة."], [2199.0, "وأمّا نحن ـ معاشرَ أهل السنة والجماعة ـ فإننا كُفينا شرَّ هذه البدع بقولنا واعتقادنا بأنّ الإيمان يزيد وينقص. والله أعلم."]], "tr": [[2181.0, "Mürcie'yi \"İmanla birlikte hiçbir günah zarar vermez\" demeye sevk eden şey, o fâsid kaideyi korumaktır."], [2188.3, "Vaîdiyye'den olan Hâricîleri ve Mu'tezile'yi büyük günah işleyeni iman dairesinden çıkarmaya sevk eden şey de bu fâsid kaideyi korumaktır."], [2199.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğuna gelince, imanın artıp eksildiğini söylememiz ve buna inanmamızla bu bid'atlerin şerrinden korunduk. Allah en iyisini bilir."]]}]}, {"ts": "36:51", "title": "6. Külliye: Amellerin tek tek fertlerini imanın sıhhatinde şart kılan herkes, delil hariç, Vaîdî'dir", "paras": [{"reader": false, "ar": [[2211.0, "ومن الكلّيّات أيضًا، ومن الكلّيّات أيضًا:"], [2218.0, "<b>كلُّ من جعل آحادَ العمل شرطًا في صحّة الإيمان فهو وعيديٌّ إلا بدليل.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [2231.0, "<b>كلُّ من جعل آحادَ العمل شرطًا لصحّة الإيمان فهو وعيديٌّ إلا بدليل.<\/b>"]], "tr": [[2211.0, "Külliyelerden biri de —külliyelerden biri de— şudur:"], [2218.0, "<b>6. külliye: Amellerin tek tek fertlerini imanın sıhhatinde şart kılan herkes, delil (ile sabit olan) hariç, Vaîdî'dir.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [2231.7, "<b>Amellerin tek tek fertlerini imanın sıhhati için şart kılan herkes, delil hariç, Vaîdî'dir.<\/b>"]]}, {"reader": false, "ar": [[2257.0, "أقول وبالله التوفيق: إن سألنا سائلٌ فقال:"], [2267.0, "إنّ أهلَ السنة والجماعة يُقِرّون بأنّ العملَ من الإيمان،"], [2273.0, "وكذلك الوعيديّةُ من الخوارج والمعتزلة يُقِرّون أيضًا بأنّ العملَ من الإيمان،"], [2280.0, "ومع ذلك فإنّ اعتقادَ أهل السنة هو الحقّ،"], [2285.0, "واعتقادَ الوعيديّة من الخوارج والمعتزلة هو الباطل؛"], [2290.0, "فلماذا كان اعتقادُنا في أنّ العملَ من الإيمان حقًّا،"], [2295.0, "وكان اعتقادُهم في أنّ العملَ من الإيمان باطلًا؟"]], "tr": [[2257.0, "Tevfik Allah'tandır, derim ki: Biri bize şöyle sorsa:"], [2267.0, "Ehl-i Sünnet ve'l-Cemaat amelin imandan olduğunu kabul ediyor;"], [2272.3, "aynı şekilde Hâricîler ve Mu'tezile'den oluşan Vaîdiyye de amelin imandan olduğunu kabul ediyor."], [2280.6, "Buna rağmen Ehl-i Sünnet'in itikadı hak, Hâricîler ve Mu'tezile'den oluşan Vaîdiyye'nin itikadı ise bâtıldır."], [2290.0, "Peki, amelin imandan olduğuna dair bizim itikadımız neden hak, onların amelin imandan olduğuna dair itikadı neden bâtıl oldu?"]]}, {"reader": false, "ar": [[2301.0, "الجوابُ في هذه الكلّيّة؛"], [2305.0, "وهي أنّ الأعمالَ التي نجعلها ـ معاشرَ أهل السنة ـ شرطًا في صحّة الإيمان هي جنسُ العمل؛"], [2314.0, "فمتى ما وُجد جنسُ العمل مع النطق بالشهادتين،"], [2320.0, "فإنّ الإنسانَ يُوصَف بأنه مسلمٌ مؤمن."], [2324.0, "وأمّا الوعيديّةُ من الخوارج والمعتزلة فإنهم يجعلون الواحدَ من الأعمال شرطًا في صحّة وجود الإيمان في القلب؛"], [2337.0, "فمتى ما تخلّف آحادُ العمل ـ إمّا بترك مأمورٍ واجب،"], [2343.2, "أو بفعل محظورٍ منهيٍّ،"], [2345.0, "أو بفعل منهيٍّ عنه محرّم ـ فإنّ الإيمانَ يختلّ كلُّه."]], "tr": [[2301.0, "Cevap bu külliyededir: Biz Ehl-i Sünnet topluluğunun imanın sıhhatinde şart kıldığımız ameller, amel cinsidir."], [2314.0, "Kelime-i şehâdeti söylemekle birlikte amel cinsi bulunduğunda, insan Müslüman ve mümin olarak nitelenir."], [2324.0, "Hâricîler ve Mu'tezile'den oluşan Vaîdiyye'ye gelince, onlar amellerden her birini kalpte imanın var olmasının sıhhatinde şart kılarlar."], [2337.0, "Amellerin tek tek fertlerinden biri —ya vacip olan bir emri terk ederek ya yasaklanmış bir şeyi ya da haram kılınmış bir nehyedileni işleyerek— geri kaldığında, imanın tamamı bozulur."]]}, {"reader": false, "ar": [[2354.0, "فنحن نجعل العملَ شرطًا،"], [2357.0, "وهم يجعلون العملَ شرطًا،"], [2360.0, "إلا أننا نجعل جنسَ الأعمال هي الرُّكنَ في الإيمان،"], [2364.0, "وهم يجعلون آحادَ الأعمال رُكنًا في الإيمان."], [2368.0, "وأهلُ السنة والجماعة يقولون بأنّ تخلُّفَ آحاد الأعمال مُنقِصٌ لا ناقض."], [2377.0, "أُعيدها مرّةً ثانية: وأهلُ السنة والجماعة يقولون بأنّ تخلُّفَ آحاد الأعمال مُنقِصٌ لا ناقض."], [2388.0, "والوعيديّةُ من الخوارج والمعتزلة يقولون بأنّ تخلُّفَ آحاد الأعمال ناقضٌ للإيمان،"], [2396.0, "ومُبطِلٌ لوجود أصله في القلب."]], "tr": [[2354.0, "Biz de ameli şart kılıyoruz, onlar da ameli şart kılıyor;"], [2360.4, "ancak biz amellerin cinsini imanda rükün kılıyoruz, onlar ise amellerin tek tek fertlerini imanda rükün kılıyorlar."], [2368.0, "Ehl-i Sünnet ve'l-Cemaat, amellerin tek tek fertlerinin geri kalmasının (imanı) eksiltici olduğunu, bozucu olmadığını söyler."], [2377.0, "İkinci kez tekrar ediyorum: Ehl-i Sünnet ve'l-Cemaat, amellerin tek tek fertlerinin geri kalmasının eksiltici olduğunu, bozucu olmadığını söyler."], [2388.0, "Hâricîler ve Mu'tezile'den oluşan Vaîdiyye ise amellerin tek tek fertlerinin geri kalmasının imanı bozduğunu ve onun aslının kalpte var olmasını iptal ettiğini söyler."]]}]}, {"ts": "39:59", "title": "6. Külliye (devam): Vaîdiyye kimlerdir; «delil hariç» kaydı ve dersin sonu", "paras": [{"reader": false, "ar": [[2399.0, "فإن قلت: ومَن الوعيديّةُ أصلًا؟"], [2405.0, "فأقول: هم الخوارجُ والمعتزلة."], [2407.0, "والخوارجُ والمعتزلة تختلف أسماؤهم باختلاف الأبواب العقديّة؛"], [2412.0, "فهم عندنا في باب أسماء الأحكام والدين وعيديّة،"], [2420.0, "كما أنّ المعتزلة في باب القضاء والقدر قدريّة،"], [2426.0, "وكما أنّ المعتزلة والخوارج أيضًا في باب الأسماء والصفات معطّلة."], [2433.0, "فإذن هم طوائفُ واحدة،"], [2435.8, "وإن اختلفت أسماؤها باختلاف الأبواب العقديّة."]], "tr": [[2399.0, "Eğer \"Vaîdiyye zaten kimlerdir?\" dersen, derim ki:"], [2405.0, "Onlar Hâricîler ve Mu'tezile'dir. Hâricîlerin ve Mu'tezile'nin isimleri, akîde bablarının farklılaşmasıyla farklılaşır."], [2412.0, "Onlar bizim nezdimizde ahkâm ve din isimleri babında Vaîdiyye'dir;"], [2417.7, "tıpkı Mu'tezile'nin kazâ ve kader babında Kaderiyye olması gibi;"], [2425.2, "ve yine Mu'tezile ile Hâricîlerin isim ve sıfatlar babında Muattıla olması gibi."], [2433.0, "Demek ki isimleri akîde bablarının farklılaşmasıyla farklılaşsa da onlar aynı fırkalardır."]]}, {"reader": false, "ar": [[2441.0, "والشاهدُ من ذلك أنّ كلَّ من جعل آحادَ العمل شرطًا في صحّة وجود الإيمان في القلب فإنه نحا منحى الوعيديّة من الخوارج والمعتزلة."], [2453.0, "فإن قلت: ولماذا قلتَ:"], [2455.0, "«إلا بدليل»؟ ولماذا قلتَ في الكلّيّة:"], [2458.7, "«إلا بدليل»؟ فأقول: ليخرجَ بذلك القيدِ العملُ الذي دلّ الدليلُ على أنّ من تركه فقد كفر،"], [2470.0, "كالصلاة؛ فإنّ الدليلَ دلّ على أنّ من تركها التركَ المطلقَ فإنه يُعتبَر كافرًا."]], "tr": [[2441.0, "Buradaki maksat şudur: Amellerin tek tek fertlerini kalpte imanın var olmasının sıhhatinde şart kılan herkes, Hâricîler ve Mu'tezile'den oluşan Vaîdiyye'nin yoluna gitmiştir."], [2453.0, "Eğer \"Neden 'delil hariç' dedin?"], [2455.0, "Külliyede neden 'delil hariç' dedin?\" dersen, derim ki:"], [2460.7, "Bu kayıtla, terk edenin kâfir olduğuna delilin delâlet ettiği amel (hükümden) çıksın diye;"], [2470.5, "namaz gibi. Çünkü delil, onu mutlak olarak terk edenin kâfir sayıldığına delâlet etmiştir."]]}, {"reader": false, "ar": [[2477.0, "كما في صحيح الإمام مسلم من حديث جابرٍ رضي الله عنه،"], [2481.0, "قال: قال النبيّ صلى الله عليه وسلم:"], [2484.3, "«بين الرجل والكفر ـ أو قال: الشرك ـ تركُ الصلاة»."], [2488.0, "وفي حديث بُرَيدة مرفوعًا:"], [2489.8, "«العهدُ الذي بيننا وبينهم الصلاة، فمن تركها فقد كفر»."], [2494.0, "وأمّا ما لم يرد فيه دليلٌ بخصوصه فيبقى أنه عندنا مُنقِصٌ لا يَنقُض،"], [2504.0, "كما سيأتينا في الكلّيّات التي بعدها إن شاء الله."]], "tr": [[2477.0, "Nitekim İmam Müslim'in Sahîh'inde Câbir'in —Allah ondan razı olsun— hadisinde şöyle dedi:"], [2481.5, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [2484.3, "\"Adam ile küfür —veya 'şirk' dedi— arasında namazı terk etmek vardır.\" Büreyde'nin merfû hadisinde de:"], [2489.8, "\"Bizimle onlar arasındaki ahit namazdır;"], [2494.0, "kim onu terk ederse kâfir olmuştur.\" Hakkında özel olarak delil gelmeyen (amele) gelince, o bizim nezdimizde eksiltici olarak kalır, bozmaz;"], [2504.7, "inşallah bundan sonraki külliyelerde geleceği gibi."]]}, {"reader": false, "ar": [[2506.0, "طيّب، لعلّنا نكتفي بهذا القدر إن شاء الله."], [2511.0, "عندنا في الدرس القادم:"], [2512.5, "«كلُّ من أخرج العملَ عن حقيقة الإيمان فمن المرجئة»،"], [2516.0, "وكلُّ الكلّيّات التي ستأتي بعد هذه الكلّيّة كلُّها من باب الردّ على المرجئة في إخراج العمل عن دائرة الإيمان."], [2524.0, "وأنا أُشدِّد في مسألة المرجئة لأنّ أعظمَ مذهبٍ نُبتلى به ـ أهلَ السنة والجماعة ـ من الإرجاء… <span class=\"q\">؟ 42:04<\/span>"]], "tr": [[2506.0, "Peki, inşallah bu kadarıyla yetinelim."], [2509.8, "Gelecek derste elimizde şu var:"], [2512.5, "\"Ameli imanın hakikatinden çıkaran herkes Mürcie'dendir.\" Bu külliyeden sonra gelecek bütün külliyelerin hepsi, ameli iman dairesinden çıkarmaları konusunda Mürcie'ye reddiye babındandır."], [2521.5, "Mürcie meselesi üzerinde şiddetle duruyorum;"], [2524.0, "çünkü biz Ehl-i Sünnet ve'l-Cemaat'in kendisiyle imtihan edildiğimiz en büyük mezhep irca (mezhebi)dir… <span class=\"q\">؟<\/span>"]]}]}]};
