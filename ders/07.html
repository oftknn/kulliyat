<script>
const D={"no": 7, "vid": "MW9P6GfJTtQ", "title_ar": "الدرس (٧) من شرح كليات العقيدة — كليات في توحيد الربوبية", "title_tr": "Şerhu Külliyyâti'l-Akîde — 7. Ders: Rubûbiyyet Tevhidine Dair Külliyeler", "sections": [{"ts": "00:00", "title": "1. Külliye: Rubûbiyyeti isbat eden her ayet ulûhiyyete delildir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.7, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.5, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [9.1, "أمّا بعد: سوف نأخذ في هذا الدرس ـ إن شاء الله ـ جُمَلًا من كلّيّات الاعتقاد،"], [16.9, "تكملةً للدروس السابقة التي تمّ شرحُ جُمَلٍ من الكلّيّات فيها،"], [22.7, "تَقرُب على الثمانين كلّيّة."], [25.0, "فنقول وبالله التوفيق، ومنه نستمدُّ العونَ والفضلَ وحُسنَ القول والتحقيق."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.7, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [11.7, "Bundan sonra: Bu derste, inşallah, önceki derslerin devamı olarak itikad külliyelerinden bir kısmını ele alacağız;"], [20.4, "o derslerde seksene yakın külliye şerh edilmişti."], [24.4, "Tevfik Allah'tandır, deriz; yardımı, lütfu, güzel sözü ve tahkiki O'ndan dileriz."]]}, {"reader": false, "ar": [[34.0, "<b>فالكلّيّة الأولى: كلُّ آيةٍ تُثبت استحقاقَ الله للربوبية فدليلٌ على استحقاقه في وحدانية الألوهية.<\/b> أقول وبالله التوفيق:"], [53.0, "وهذا منهج القرآن العام من أول الفاتحة إلى سورة الناس."], [72.0, "فإذا أراد الله عز وجل أن يستدلّ على وحدانيته في ألوهيته،"], [78.0, "فإنّ طريق الاستدلال هو الاستدلال بربوبيته على ألوهيته."], [84.0, "فإذا أراد الله عز وجل أن يُثبت ألوهيته فإنه يذكر شيئًا من مقتضيات ربوبيته،"], [93.0, "فيجعل الاستدلال بربوبيته دليلًا على ألوهيته."], [98.0, "كما أنه إذا أراد أن يُبطل ألوهية غيره سلب خصائص الربوبية عنه."]], "tr": [[34.0, "<b>1. külliye: Allah'ın rubûbiyyete layık olduğunu isbat eden her ayet, O'nun ulûhiyyette tek olmaya layık olduğuna delildir.<\/b> Tevfik Allah'tandır, derim ki:"], [56.4, "Bu, Fâtiha'nın başından Nâs sûresine kadar Kur'an'ın genel metodudur."], [74.2, "Allah Teâlâ ulûhiyyetinde tek olduğuna delil getirmek istediğinde, delil getirme yolu, rubûbiyyetiyle ulûhiyyetine delil getirmektir."], [84.7, "Allah Teâlâ ulûhiyyetini isbat etmek istediğinde rubûbiyyetinin gereklerinden bir kısmını zikreder ve rubûbiyyetiyle istidlali, ulûhiyyetine delil kılar."], [96.8, "Aynı şekilde, başkasının ulûhiyyetini iptal etmek istediğinde de ondan rubûbiyyetin hususiyetlerini nefyeder."]]}, {"reader": false, "ar": [[108.0, "فهما طريقان قرآنيان ومنهجان ثابتان من أوله إلى آخره:"], [116.0, "فإذا أراد الله أن يُثبت ألوهيته جعل طريقَ إثباتها إثباتَ ربوبيته،"], [124.0, "وإذا أراد الله أن يسلب أو يُبطل ألوهية غيره جعل سبيلَ إبطالها سلبَ خصائص الألوهية عنه."], [133.0, "وهذا في آياتٍ كثيرة."]], "tr": [[108.0, "Bunlar, Kur'an'ın başından sonuna kadar sabit iki Kur'anî yol ve iki metottur:"], [116.7, "Allah ulûhiyyetini isbat etmek istediğinde, onu isbatın yolu olarak rubûbiyyetini isbatı kılar;"], [124.0, "başkasının ulûhiyyetini gidermek ya da iptal etmek istediğinde, onu iptalin yolu olarak ondan ulûhiyyetin hususiyetlerini nefyetmeyi kılar."], [132.4, "Bu, pek çok ayette vardır."]]}, {"reader": false, "ar": [[136.0, "كقول الله عز وجل:"], [137.7, "<span class=\"ayah\">﴿يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ﴾<\/span> ـ وهذا هو الألوهية ـ ثم استدلّ على هذا الأمر بقوله:"], [144.2, "<span class=\"ayah\">﴿الَّذِي خَلَقَكُمْ﴾<\/span> ـ وهو ربوبية ـ <span class=\"ayah\">﴿وَالَّذِينَ مِن قَبْلِكُمْ﴾<\/span> ـ وهو ربوبية ـ <span class=\"ayah\">﴿لَعَلَّكُمْ تَتَّقُونَ ۝ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ فِرَاشًا﴾<\/span> ـ وهي ربوبية ـ <span class=\"ayah\">﴿وَالسَّمَاءَ بِنَاءً﴾<\/span> ـ وهي ربوبية ـ <span class=\"ayah\">﴿وَأَنزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجَ بِهِ مِنَ الثَّمَرَاتِ رِزْقًا لَّكُمْ﴾<\/span> <span class=\"note\">(Şeyh «وأنزل لكم» diyor)<\/span> ـ وكلُّ هذا ربوبية ـ ثم ختمها بالمطلوب الأعظم:"], [168.0, "<span class=\"ayah\">﴿فَلَا تَجْعَلُوا لِلَّهِ أَندَادًا وَأَنتُمْ تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[البقرة: ٢١-٢٢]<\/span>."], [173.0, "فاستدلّ بربوبيته على وحدانيته في ألوهيته."]], "tr": [[136.0, "Allah Teâlâ'nın şu sözü gibi:"], [137.2, "<span class=\"ayah\">﴿Ey insanlar! Rabbinize ibadet edin﴾<\/span> — bu ulûhiyyettir."], [139.8, "Sonra bu emre şu sözüyle delil getirdi:"], [142.1, "<span class=\"ayah\">﴿Sizi yaratan﴾<\/span> — bu rubûbiyyettir — <span class=\"ayah\">﴿ve sizden öncekileri de (yaratan)﴾<\/span> — bu da rubûbiyyettir — <span class=\"ayah\">﴿ki korunasınız. O, yeri sizin için bir döşek yaptı﴾<\/span> — bu rubûbiyyettir — <span class=\"ayah\">﴿göğü de bir bina﴾<\/span> — bu da rubûbiyyettir — <span class=\"ayah\">﴿gökten su indirdi ve onunla size rızık olarak ürünler çıkardı﴾<\/span> — bunların hepsi rubûbiyyettir."], [166.0, "Sonra onu en büyük matlupla bitirdi:"], [168.0, "<span class=\"ayah\">﴿O hâlde bile bile Allah'a eşler koşmayın﴾<\/span> [Bakara 21-22]."], [173.8, "Böylece rubûbiyyetiyle ulûhiyyetindeki tekliğine delil getirdi."]]}, {"reader": false, "ar": [[179.0, "ويقول الله عز وجل:"], [182.0, "<span class=\"ayah\">﴿وَأَنَا رَبُّكُمْ فَاعْبُدُونِ﴾<\/span> <span class=\"ref\">[الأنبياء: ٩٢]<\/span>؛ فأمر بعبادته في توحيد ألوهيته بأنه الربُّ المستحقُّ لكلّ مقتضيات الربوبية."], [198.0, "فالمستحِقُّ لكلّ مقتضيات الربوبية هو المستحِقُّ لكلّ مقتضيات الألوهية، ومن لا فلا."]], "tr": [[179.0, "Allah Teâlâ şöyle buyurur: <span class=\"ayah\">﴿Ben de sizin Rabbinizim; öyleyse bana ibadet edin﴾<\/span> [Enbiyâ 92]."], [188.5, "Ulûhiyyetini tevhid ederek kendisine ibadet edilmesini, rubûbiyyetin bütün gereklerine layık Rab olmasına dayandırarak emretti."], [198.0, "Rubûbiyyetin bütün gereklerine layık olan, ulûhiyyetin bütün gereklerine de layık olandır;"], [203.5, "öyle olmayan da (buna) layık değildir."]]}, {"reader": false, "ar": [[207.0, "قال الله عز وجل:"], [209.7, "<span class=\"ayah\">﴿قُلِ الْحَمْدُ لِلَّهِ وَسَلَامٌ عَلَىٰ عِبَادِهِ الَّذِينَ اصْطَفَىٰ ۗ آللَّهُ خَيْرٌ أَمَّا يُشْرِكُونَ ۝ أَمَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَأَنزَلَ لَكُم مِّنَ السَّمَاءِ مَاءً فَأَنبَتْنَا بِهِ حَدَائِقَ ذَاتَ بَهْجَةٍ مَّا كَانَ لَكُمْ أَن تُنبِتُوا شَجَرَهَا﴾<\/span> ـ هذا كلُّه ربوبية ـ ثم قال:"], [230.8, "<span class=\"ayah\">﴿أَإِلَٰهٌ مَّعَ اللَّهِ ۚ بَلْ هُمْ قَوْمٌ يَعْدِلُونَ﴾<\/span> <span class=\"ref\">[النمل: ٥٩-٦٠]<\/span>؛"], [234.0, "فاستدلّ بربوبيته على ألوهيته."]], "tr": [[207.0, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿De ki: Hamd Allah'a, seçtiği kullarına da selâm olsun. Allah mı hayırlı, yoksa onların ortak koştukları mı? Yoksa gökleri ve yeri yaratan, size gökten su indiren mi? O su ile gönül açan bahçeler bitirdik; onların ağaçlarını bitirmek sizin elinizde değildi﴾<\/span> — bunların hepsi rubûbiyyettir."], [227.3, "Sonra buyurdu: <span class=\"ayah\">﴿Allah ile beraber başka bir ilah mı? Hayır, onlar (Allah'a başkasını) denk tutan bir topluluktur﴾<\/span> [Neml 59-60]."], [234.0, "Böylece rubûbiyyetiyle ulûhiyyetine delil getirdi."]]}, {"reader": false, "ar": [[237.0, "ثم قال: <span class=\"ayah\">﴿أَمَّن جَعَلَ الْأَرْضَ قَرَارًا﴾<\/span> ـ والسماءَ بناءً ـ <span class=\"ayah\">﴿وَجَعَلَ خِلَالَهَا أَنْهَارًا وَجَعَلَ لَهَا رَوَاسِيَ وَجَعَلَ بَيْنَ الْبَحْرَيْنِ حَاجِزًا﴾<\/span> <span class=\"note\">(«والسماء بناءً» bu ayette yok; bkz. notlar)<\/span> ـ هذا كلُّه ربوبية ـ ثم قال مستدلًّا بها على ألوهيته:"], [255.0, "<span class=\"ayah\">﴿أَإِلَٰهٌ مَّعَ اللَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ﴾<\/span> <span class=\"ref\">[النمل: ٦١]<\/span>،"], [259.0, "إلى آخر الآيات؛ كلُّها يستدلّ الله عز وجل على ألوهيته بربوبيته."], [267.0, "فالمستحِقُّ للربوبية الكاملة هو المستحِقُّ للألوهية الكاملة."]], "tr": [[237.0, "Sonra buyurdu: <span class=\"ayah\">﴿Yoksa yeri durak yapan﴾<\/span> — göğü de bina — <span class=\"ayah\">﴿aralarında ırmaklar akıtan, ona sabit dağlar yerleştiren ve iki deniz arasına bir engel koyan mı?﴾<\/span> — bunların hepsi rubûbiyyettir."], [253.3, "Sonra bunlarla ulûhiyyetine delil getirerek buyurdu:"], [255.0, "<span class=\"ayah\">﴿Allah ile beraber başka bir ilah mı? Hayır, onların çoğu bilmiyor﴾<\/span> [Neml 61]."], [261.1, "Ayetlerin sonuna kadar hepsinde Allah Teâlâ rubûbiyyetiyle ulûhiyyetine delil getirir."], [267.0, "Tam rubûbiyyete layık olan, tam ulûhiyyete de layık olandır."]]}, {"reader": false, "ar": [[273.0, "قال الله عز وجل:"], [275.7, "<span class=\"ayah\">﴿وَالسَّمَاءَ بَنَيْنَاهَا بِأَيْدٍ﴾<\/span> ـ وهو ربوبية ـ <span class=\"ayah\">﴿وَإِنَّا لَمُوسِعُونَ﴾<\/span> ـ وهي ربوبية ـ <span class=\"ayah\">﴿وَالْأَرْضَ فَرَشْنَاهَا﴾<\/span> ـ ربوبية ـ <span class=\"ayah\">﴿فَنِعْمَ الْمَاهِدُونَ﴾<\/span> ـ ربوبية ـ <span class=\"ayah\">﴿وَمِن كُلِّ شَيْءٍ خَلَقْنَا زَوْجَيْنِ لَعَلَّكُمْ تَذَكَّرُونَ﴾<\/span>،"], [293.0, "ثم أمرهم بالفرار إليه ـ ألوهية ـ:"], [295.3, "<span class=\"ayah\">﴿فَفِرُّوا إِلَى اللَّهِ ۖ إِنِّي لَكُم مِّنْهُ نَذِيرٌ مُّبِينٌ ۝ وَلَا تَجْعَلُوا مَعَ اللَّهِ إِلَٰهًا آخَرَ ۖ إِنِّي لَكُم مِّنْهُ نَذِيرٌ مُّبِينٌ﴾<\/span> <span class=\"ref\">[الذاريات: ٤٧-٥١]<\/span>."]], "tr": [[273.0, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Göğü kudretle biz bina ettik﴾<\/span> — bu rubûbiyyettir — <span class=\"ayah\">﴿ve şüphesiz biz onu genişleticiyiz﴾<\/span> — bu da rubûbiyyettir — <span class=\"ayah\">﴿yeri de biz döşedik﴾<\/span> — rubûbiyyet — <span class=\"ayah\">﴿ne güzel döşeyicileriz﴾<\/span> — rubûbiyyet — <span class=\"ayah\">﴿ve düşünüp öğüt alasınız diye her şeyden çift çift yarattık﴾<\/span>."], [293.5, "Sonra onlara kendisine kaçmalarını emretti — bu ulûhiyyettir:"], [295.8, "<span class=\"ayah\">﴿O hâlde Allah'a kaçın; şüphesiz ben size O'ndan gelmiş apaçık bir uyarıcıyım. Allah ile beraber başka bir ilah edinmeyin; şüphesiz ben size O'ndan gelmiş apaçık bir uyarıcıyım﴾<\/span> [Zâriyât 47-51]."]]}]}, {"ts": "05:05", "title": "2. Külliye: Rubûbiyyetin gereklerinden birinden aciz olan ulûhiyyete layık değildir", "paras": [{"reader": false, "ar": [[305.0, "والآيات في هذا المعنى كثيرةٌ جدًّا."], [308.0, "فإذا أردتَ أن تدعو الناس إلى توحيد الله عز وجل في ألوهيته،"], [314.0, "فالطريق الأعظم المقنِع للقلوب والعقول والنفوس والأرواح إنما هو ذكرُ الربوبية التي لا يستحقّها إلا الله تبارك وتعالى."], [327.0, "فالمستحِقُّ للربوبية هو المستحِقُّ للألوهية."]], "tr": [[305.0, "Bu anlamdaki ayetler pek çoktur."], [307.5, "İnsanları Allah Teâlâ'yı ulûhiyyetinde tevhid etmeye davet etmek istersen, kalpleri, akılları, nefisleri ve ruhları ikna eden en büyük yol, ancak Allah Tebâreke ve Teâlâ'dan başkasının layık olmadığı rubûbiyyeti zikretmektir."], [325.7, "Rubûbiyyete layık olan, ulûhiyyete de layık olandır."]]}, {"reader": false, "ar": [[332.6, "ونُكمل بالكلّيّة الثانية: <b>كلُّ موصوفٍ بالعجز عن شيءٍ من مقتضيات الربوبية فليس بمستحِقٍّ للألوهية.<\/b> <span class=\"note\">(يكررها)<\/span> وهي مفهوم المخالفة من الكلّيّة التي قبلها."], [380.0, "فكما أن الله عز وجل يستدلّ على استحقاقه في ألوهيته بربوبيته،"], [390.0, "فكذلك يستدلّ على بطلان عبادة غيره بسلب خصائص الربوبية عنه."], [396.0, "وهذا منهج القرآن الأعظم في إبطال عبادة ما عُبد من دون الله عز وجل."]], "tr": [[332.6, "2. külliye ile devam ediyoruz:"], [343.9, "<b>2. külliye: Rubûbiyyetin gereklerinden herhangi birinden aciz olmakla nitelenen hiçbir şey ulûhiyyete layık değildir.<\/b> (Tekrar ediyor.) Bu, kendisinden önceki külliyenin mefhûm-i muhâlifidir."], [382.1, "Allah Teâlâ ulûhiyyete layık olduğuna rubûbiyyetiyle delil getirdiği gibi, başkasına ibadetin bâtıl olduğuna da ondan rubûbiyyetin hususiyetlerini nefyederek delil getirir."], [396.6, "Bu, Allah Teâlâ'dan başka ibadet edilen şeylere ibadeti iptalde Kur'an'ın en büyük metodudur."]]}, {"reader": false, "ar": [[405.0, "كما قال الله عز وجل:"], [407.0, "<span class=\"ayah\">﴿وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ ۚ قُلْ أَفَرَأَيْتُم مَّا تَدْعُونَ﴾<\/span> ـ أي ما تعبدون ـ <span class=\"ayah\">﴿مِن دُونِ اللَّهِ إِنْ أَرَادَنِيَ اللَّهُ بِضُرٍّ هَلْ هُنَّ كَاشِفَاتُ ضُرِّهِ أَوْ أَرَادَنِي بِرَحْمَةٍ هَلْ هُنَّ مُمْسِكَاتُ رَحْمَتِهِ﴾<\/span>،"], [431.2, "النتيجة: <span class=\"ayah\">﴿قُلْ حَسْبِيَ اللَّهُ ۖ عَلَيْهِ يَتَوَكَّلُ الْمُتَوَكِّلُونَ﴾<\/span> <span class=\"ref\">[الزمر: ٣٨]<\/span>."], [435.0, "فإذا كانت هذه الآلهة التي تعبدونها مع الله عز وجل لا تملك لكم ضرًّا ولا نفعًا،"], [444.0, "ولا تحبس عنكم رحمةً،"], [446.0, "ولا تجلب لكم خيرًا،"], [448.0, "فلماذا تعبدونها وتتركون عبادةَ مَن خلق السماوات والأرض وما فيهما؟"], [453.0, "فاستدلّ على بطلان عبادتهم لها بسلب خصائص الربوبية عنها."]], "tr": [[405.0, "Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿Andolsun, onlara \"Gökleri ve yeri kim yarattı?\" diye sorsan, elbette \"Allah\" derler. De ki: Allah'ı bırakıp da taptıklarınızı﴾<\/span> — yani ibadet ettiklerinizi — <span class=\"ayah\">﴿gördünüz mü? Allah bana bir zarar dilerse onlar O'nun zararını kaldırabilirler mi? Ya da bana bir rahmet dilerse onlar O'nun rahmetini tutabilirler mi?﴾<\/span> Sonuç:"], [432.5, "<span class=\"ayah\">﴿De ki: Bana Allah yeter; tevekkül edenler yalnız O'na tevekkül eder﴾<\/span> [Zümer 38]."], [438.0, "Allah Teâlâ ile beraber ibadet ettiğiniz bu ilahlar size ne bir zarar ne bir fayda verebiliyorsa, sizden bir rahmeti alıkoyamıyor ve size bir hayır getiremiyorsa, neden onlara ibadet edip gökleri, yeri ve ikisindekileri yaratana ibadeti bırakıyorsunuz?"], [452.5, "Böylece onlardan rubûbiyyetin hususiyetlerini nefyederek onlara yaptıkları ibadetin bâtıl olduğuna delil getirdi."]]}, {"reader": false, "ar": [[461.0, "وقال الله عز وجل عن إبراهيم عليه السلام أنه قال لأبيه:"], [467.0, "<span class=\"ayah\">﴿يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ﴾<\/span> <span class=\"ref\">[مريم: ٤٢]<\/span>،"], [471.0, "والسماع من مقتضيات الربوبية؛"], [475.0, "فالذي لا يسمع لا يصلح أن يكون ربًّا ولا إلهًا ولا معبودًا."], [480.0, "فمن خصائص الربّ أن يسمع،"], [482.5, "كما قال الله عز وجل:"], [485.0, "<span class=\"ayah\">﴿قَدْ سَمِعَ اللَّهُ قَوْلَ الَّتِي تُجَادِلُكَ﴾<\/span> <span class=\"ref\">[المجادلة: ١]<\/span>،"], [489.0, "وفي آياتٍ كثيرة يقول:"], [491.5, "<span class=\"ayah\">﴿إِنَّ اللَّهَ سَمِيعٌ عَلِيمٌ﴾<\/span>،"], [494.0, "<span class=\"ayah\">﴿سَمِيعٌ بَصِيرٌ﴾<\/span>، <span class=\"ayah\">﴿إِنَّ رَبِّي لَسَمِيعُ الدُّعَاءِ﴾<\/span> <span class=\"ref\">[إبراهيم: ٣٩]<\/span>."], [499.0, "فالذي لا يسمع لا يصلح أن يكون ربًّا."]], "tr": [[461.0, "Allah Teâlâ, İbrâhîm aleyhisselâmın babasına şöyle dediğini bildirir:"], [465.4, "<span class=\"ayah\">﴿Babacığım! İşitmeyen şeye niçin ibadet ediyorsun?﴾<\/span> [Meryem 42]."], [469.9, "İşitmek rubûbiyyetin gereklerindendir; işitmeyen şey ne rab ne ilah ne de mabud olmaya elverişlidir."], [478.8, "İşitmek Rabbin hususiyetlerindendir; Allah Teâlâ'nın buyurduğu gibi:"], [482.0, "<span class=\"ayah\">﴿Seninle tartışan kadının sözünü Allah işitti﴾<\/span> [Mücâdele 1]."], [486.0, "Pek çok ayette de şöyle buyurur:"], [490.9, "<span class=\"ayah\">﴿Şüphesiz Allah işitendir, bilendir﴾<\/span>, <span class=\"ayah\">﴿işitendir, görendir﴾<\/span>, <span class=\"ayah\">﴿Şüphesiz Rabbim duayı işitendir﴾<\/span> [İbrâhîm 39]."], [499.6, "İşitmeyen şey rab olmaya elverişli değildir."]]}, {"reader": false, "ar": [[504.0, "كما قال الله عز وجل في آيةٍ أخرى:"], [508.0, "<span class=\"ayah\">﴿وَالَّذِينَ تَدْعُونَ مِن دُونِهِ مَا يَمْلِكُونَ مِن قِطْمِيرٍ﴾<\/span>،"], [513.0, "والربُّ لا بدّ أن يكون مالكًا لكلّ شيء؛"], [517.0, "فالذي لا يملك القطمير ـ وهو لُفافة النواة ـ لا يصلح أن يكون ربًّا ولا إلهًا."], [525.0, "<span class=\"ayah\">﴿إِن تَدْعُوهُمْ لَا يَسْمَعُوا دُعَاءَكُمْ﴾<\/span>،"], [529.3, "فنفى عنهم صفةً من صفات الربوبية وهي السمع،"], [533.0, "<span class=\"ayah\">﴿وَلَوْ سَمِعُوا مَا اسْتَجَابُوا لَكُمْ﴾<\/span> لأنهم عاجزون لا يملكون شيئًا،"], [541.0, "<span class=\"ayah\">﴿وَيَوْمَ الْقِيَامَةِ يَكْفُرُونَ بِشِرْكِكُمْ ۚ وَلَا يُنَبِّئُكَ مِثْلُ خَبِيرٍ﴾<\/span> <span class=\"ref\">[فاطر: ١٣-١٤]<\/span>."], [546.0, "وهذا في آياتٍ كثيرة."]], "tr": [[504.0, "Allah Teâlâ'nın başka bir ayette buyurduğu gibi:"], [506.5, "<span class=\"ayah\">﴿O'nu bırakıp da dua ettikleriniz bir çekirdek zarına bile sahip değildir﴾<\/span>."], [511.8, "Rab ise mutlaka her şeye malik olmalıdır."], [514.1, "Kıtmîre — yani hurma çekirdeğinin zarına — bile sahip olmayan şey ne rab ne de ilah olmaya elverişlidir."], [522.7, "<span class=\"ayah\">﴿Onlara dua etseniz duanızı işitmezler﴾<\/span>;"], [525.0, "böylece onlardan rubûbiyyet sıfatlarından birini, işitmeyi nefyetti."], [529.3, "<span class=\"ayah\">﴿İşitseler bile size cevap veremezler﴾<\/span>;"], [531.5, "çünkü onlar acizdir, hiçbir şeye sahip değildir."], [534.4, "<span class=\"ayah\">﴿Kıyamet günü de sizin ortak koşmanızı inkâr ederler. (Her şeyden) haberdar olan (Allah) gibi sana kimse haber veremez﴾<\/span> [Fâtır 13-14]."], [546.0, "Bu, pek çok ayette vardır."]]}, {"reader": false, "ar": [[549.0, "يقول الله عز وجل:"], [550.8, "<span class=\"ayah\">﴿وَيَعْبُدُونَ مِن دُونِ اللَّهِ مَا لَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ﴾<\/span> <span class=\"ref\">[يونس: ١٨]<\/span>،"], [557.0, "ويقول الله عز وجل:"], [559.7, "<span class=\"ayah\">﴿وَيَعْبُدُونَ مِن دُونِ اللَّهِ مَا لَا يَمْلِكُ لَهُمْ رِزْقًا مِّنَ السَّمَاوَاتِ وَالْأَرْضِ شَيْئًا وَلَا يَسْتَطِيعُونَ﴾<\/span> <span class=\"ref\">[النحل: ٧٣]<\/span> <span class=\"note\">(Şeyh «في السماوات» diyor)<\/span>."], [569.0, "ويقول الله عز وجل:"], [571.3, "<span class=\"ayah\">﴿يَا أَيُّهَا النَّاسُ ضُرِبَ مَثَلٌ فَاسْتَمِعُوا لَهُ ۚ إِنَّ الَّذِينَ تَدْعُونَ﴾<\/span> ـ أي تعبدون ـ <span class=\"ayah\">﴿مِن دُونِ اللَّهِ لَن يَخْلُقُوا ذُبَابًا وَلَوِ اجْتَمَعُوا لَهُ﴾<\/span>،"], [585.0, "نفى عنهم صفةَ الخلق ولو للشيء المَهين اليسير الصغير،"], [591.0, "<span class=\"ayah\">﴿وَإِن يَسْلُبْهُمُ الذُّبَابُ شَيْئًا لَّا يَسْتَنقِذُوهُ مِنْهُ ۚ ضَعُفَ الطَّالِبُ﴾<\/span> ـ أي العابد ـ"]], "tr": [[549.0, "Allah Teâlâ buyurur: <span class=\"ayah\">﴿Allah'ı bırakıp kendilerine ne zarar ne fayda veremeyen şeylere ibadet ediyorlar﴾<\/span> [Yûnus 18]."], [554.5, "Allah Teâlâ buyurur: <span class=\"ayah\">﴿Allah'ı bırakıp kendilerine göklerden ve yerden hiçbir rızık veremeyen ve buna güçleri de yetmeyen şeylere ibadet ediyorlar﴾<\/span> [Nahl 73]."], [568.0, "Allah Teâlâ buyurur: <span class=\"ayah\">﴿Ey insanlar! Bir misal verildi, onu dinleyin: Allah'ı bırakıp da dua ettikleriniz﴾<\/span> — yani ibadet ettikleriniz — <span class=\"ayah\">﴿hepsi bir araya gelseler bile bir sinek dahi yaratamazlar﴾<\/span>."], [583.0, "Hakir, basit, küçük bir şey için bile olsa onlardan yaratma sıfatını nefyetti."], [589.0, "<span class=\"ayah\">﴿Sinek onlardan bir şey kapsa, onu ondan kurtaramazlar. İsteyen de aciz﴾<\/span> — yani ibadet eden —"]]}]}, {"ts": "10:01", "title": "2. Külliye (devam): Yardım edemeyen ilahlar; İbrâhîm'in putları kırması", "paras": [{"reader": false, "ar": [[601.0, "<span class=\"ayah\">﴿وَالْمَطْلُوبُ﴾<\/span> <span class=\"ref\">[الحج: ٧٣]<\/span> ـ أي المعبود من دون الله عز وجل."], [605.0, "فكيف تعبدون آلهةً عاجزةً عن استنقاذ ما أخذ الذباب منها،"], [613.0, "وتتركون عبادةَ مَن يملك كلَّ شيء،"], [616.7, "وقادرٌ على كل شيء،"], [619.2, "ولا يُعجزه شيء؟ ولذلك فالشرك هو أظلمُ الظلم على الإطلاق."]], "tr": [[601.0, "<span class=\"ayah\">﴿istenen de﴾<\/span> [Hac 73] — yani Allah Teâlâ'yı bırakıp ibadet edilen."], [605.7, "Sineğin kendilerinden aldığını kurtarmaktan aciz ilahlara nasıl ibadet eder de her şeye malik olan, her şeye gücü yeten ve hiçbir şeyin aciz bırakamadığı Zât'a ibadeti bırakırsınız?"], [621.0, "Bu yüzden şirk, mutlak olarak zulmün en zalimcesidir."]]}, {"reader": false, "ar": [[624.0, "ويقول الله عز وجل:"], [630.0, "<span class=\"ayah\">﴿وَاتَّخَذُوا مِن دُونِ اللَّهِ آلِهَةً لَّعَلَّهُمْ يُنصَرُونَ ۝ لَا يَسْتَطِيعُونَ نَصْرَهُمْ﴾<\/span>؛"], [640.0, "أبطل عبادتهم بسلب شيءٍ من خصائص الربوبية عنهم،"], [646.0, "وهي النُّصرة. والنصرة من مقتضيات الربوبية:"], [651.0, "<span class=\"ayah\">﴿يَنصُرُ مَن يَشَاءُ﴾<\/span> <span class=\"ref\">[الروم: ٥]<\/span>، <span class=\"ayah\">﴿إِن تَنصُرُوا اللَّهَ يَنصُرْكُمْ﴾<\/span> <span class=\"ref\">[محمد: ٧]<\/span>،"], [655.5, "من مقتضيات الربوبية. فهؤلاء أفنَوا أعمارهم في عبادة مَن يستنصرونه ولا ينصرهم."]], "tr": [[624.0, "Allah Teâlâ buyurur: <span class=\"ayah\">﴿Yardım görürler umuduyla Allah'ı bırakıp ilahlar edindiler. Onlar kendilerine yardım edemezler﴾<\/span>."], [634.1, "Onlardan rubûbiyyetin hususiyetlerinden birini, yani yardım etmeyi nefyederek ibadetlerini iptal etti."], [644.0, "Yardım etmek rubûbiyyetin gereklerindendir: <span class=\"ayah\">﴿Dilediğine yardım eder﴾<\/span> [Rûm 5], <span class=\"ayah\">﴿Siz Allah'a yardım ederseniz O da size yardım eder﴾<\/span> [Muhammed 7] — bu, rubûbiyyetin gereklerindendir."], [656.5, "İşte bunlar ömürlerini, kendisinden yardım istedikleri ama kendilerine yardım etmeyen şeylere ibadetle tükettiler."]]}, {"reader": false, "ar": [[667.0, "ثم قال الله عز وجل:"], [669.0, "<span class=\"ayah\">﴿وَاتَّخَذُوا مِن دُونِ اللَّهِ آلِهَةً لَّعَلَّهُمْ يُنصَرُونَ ۝ لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ﴾<\/span> ـ أي العابدون ـ <span class=\"ayah\">﴿لَهُمْ﴾<\/span> ـ أي مَن يعبدونه ـ <span class=\"ayah\">﴿جُندٌ مُّحْضَرُونَ﴾<\/span> <span class=\"ref\">[يس: ٧٤-٧٥]<\/span>،"], [683.0, "أي يَحمون آلهتهم ممّن أرادها بسوء."], [687.7, "فآلهةٌ لا تنصركم، بل هي محتاجةٌ لأن تكونوا جنودًا حولها لتحموها ممّن أرادها بالسوء،"], [696.0, "كيف تطلبون منها رزقًا ونفعًا واستدفاعَ ضُرّ؟"], [702.0, "كيف تطلبون منها ذلك وهي المفتقرة إليكم؟"]], "tr": [[667.0, "Sonra Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Yardım görürler umuduyla Allah'ı bırakıp ilahlar edindiler. Onlar kendilerine yardım edemezler; bunlar﴾<\/span> — yani ibadet edenler — <span class=\"ayah\">﴿onlar için﴾<\/span> — yani ibadet ettikleri için — <span class=\"ayah\">﴿hazır bekletilen askerlerdir﴾<\/span> [Yâsîn 74-75];"], [685.3, "yani ilahlarını onlara kötülük dileyenlerden korurlar."], [689.2, "Size yardım etmeyen, aksine kendisine kötülük dileyenlerden korumanız için etrafında asker olmanıza muhtaç olan ilahlardan nasıl rızık, fayda ve zararı def etmeyi istersiniz?"], [700.5, "Size muhtaç olan şeyler iken bunu onlardan nasıl istersiniz?"]]}, {"reader": false, "ar": [[708.0, "ولذلك استدلّ إبراهيم على بطلان آلهة قومه بمثل هذا الجنس من الأدلة:"], [716.0, "لمّا حطّم آلهتهم <span class=\"ayah\">﴿فَجَعَلَهُمْ جُذَاذًا إِلَّا كَبِيرًا لَّهُمْ لَعَلَّهُمْ إِلَيْهِ يَرْجِعُونَ﴾<\/span> <span class=\"note\">(Şeyh «وجعلها» diyor)<\/span>،"], [723.0, "<span class=\"ayah\">﴿قَالُوا مَن فَعَلَ هَٰذَا بِآلِهَتِنَا إِنَّهُ لَمِنَ الظَّالِمِينَ ۝ قَالُوا سَمِعْنَا فَتًى يَذْكُرُهُمْ﴾<\/span> ـ أن يذكرهم بالسوء والتكسير ـ <span class=\"ayah\">﴿يُقَالُ لَهُ إِبْرَاهِيمُ ۝ قَالُوا فَأْتُوا بِهِ عَلَىٰ أَعْيُنِ النَّاسِ لَعَلَّهُمْ يَشْهَدُونَ ۝ قَالُوا أَأَنتَ فَعَلْتَ هَٰذَا بِآلِهَتِنَا يَا إِبْرَاهِيمُ ۝ قَالَ بَلْ فَعَلَهُ كَبِيرُهُمْ هَٰذَا﴾<\/span> ـ فإيش؟"], [750.8, "ـ <span class=\"ayah\">﴿فَاسْأَلُوهُمْ إِن كَانُوا يَنطِقُونَ ۝ فَرَجَعُوا إِلَىٰ أَنفُسِهِمْ فَقَالُوا إِنَّكُمْ أَنتُمُ الظَّالِمُونَ ۝ ثُمَّ نُكِسُوا عَلَىٰ رُءُوسِهِمْ لَقَدْ عَلِمْتَ مَا هَٰؤُلَاءِ يَنطِقُونَ ۝ قَالَ أَفَتَعْبُدُونَ مِن دُونِ اللَّهِ مَا لَا يَنفَعُكُمْ شَيْئًا وَلَا يَضُرُّكُمْ ۝ أُفٍّ لَّكُمْ وَلِمَا تَعْبُدُونَ مِن دُونِ اللَّهِ ۖ أَفَلَا تَعْقِلُونَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٥٨-٦٧]<\/span>."]], "tr": [[708.0, "Bu yüzden İbrâhîm de kavminin ilahlarının bâtıl olduğuna bu cinsten delillerle delil getirdi."], [714.0, "Onların ilahlarını kırıp <span class=\"ayah\">﴿onları paramparça etti; yalnız büyüklerini bıraktı ki ona başvursunlar﴾<\/span>."], [720.5, "<span class=\"ayah\">﴿\"Bunu ilahlarımıza kim yaptı? Şüphesiz o zalimlerdendir\" dediler. \"Onları anan bir genç işittik﴾<\/span> — yani onları kötülükle ve kırmakla anan — <span class=\"ayah\">﴿ona İbrâhîm denir\" dediler. \"Onu insanların gözü önüne getirin ki şahit olsunlar\" dediler. \"Ey İbrâhîm! Bunu ilahlarımıza sen mi yaptın?\" dediler. \"Hayır, bunu şu büyükleri yaptı﴾<\/span> — ne o hâlde?"], [748.8, "— <span class=\"ayah\">﴿konuşabiliyorlarsa onlara sorun\" dedi. Bunun üzerine kendi vicdanlarına dönüp \"Asıl zalimler sizsiniz\" dediler. Sonra yine eski hâllerine döndüler: \"Andolsun, sen bunların konuşmadığını bilirsin\" dediler. İbrâhîm: \"Allah'ı bırakıp size hiçbir fayda vermeyen ve zarar da veremeyen şeylere mi ibadet ediyorsunuz? Size de Allah'ı bırakıp ibadet ettiklerinize de yazıklar olsun! Hâlâ akıl erdirmeyecek misiniz?\" dedi﴾<\/span> [Enbiyâ 58-67]."]]}, {"reader": false, "ar": [[782.0, "أمرٌ عقلي، حجةٌ عقليةٌ واضحة:"], [785.0, "أين عقولكم؟ فلو كانت هذه آلهةً ما استطاع إبراهيم أن يمسّها بالسوء،"], [793.0, "ولِمَ احتاج عابدوها أن يقولوا:"], [795.2, "من فعل هذا بآلهتنا؟"], [797.0, "وآلهتُكم تَفعل أو يُفعَل بها؟"], [799.0, "فالإله يَفعل ما يريد ولا يُفعَل به،"], [804.0, "<span class=\"ayah\">﴿لَا يُسْأَلُ عَمَّا يَفْعَلُ وَهُمْ يُسْأَلُونَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٣]<\/span>."], [807.0, "ولكنها العقول إذا انطفأ فيها نورُ التوحيد ونورُ البصيرة عشّشت فيها مثلُ هذه الشُّبَه التي تقلب الحقَّ باطلًا والباطلَ حقًّا."]], "tr": [[782.0, "Bu aklî bir iştir, apaçık aklî bir hüccettir:"], [786.0, "Akıllarınız nerede? Bunlar ilah olsaydı İbrâhîm onlara kötülükle dokunamazdı."], [791.6, "Onlara ibadet edenler neden \"Bunu ilahlarımıza kim yaptı?\" demeye muhtaç oldular?"], [796.1, "İlahlarınız iş mi yapar, yoksa onlara bir şey mi yapılır?"], [800.4, "İlah dilediğini yapar, ona bir şey yapılmaz."], [805.1, "<span class=\"ayah\">﴿O yaptığından sorulmaz, onlar ise sorulurlar﴾<\/span> [Enbiyâ 23]."], [809.1, "Fakat akıllarda tevhid nuru ve basiret nuru söndüğünde, hakkı bâtıl, bâtılı hak gösteren bu tür şüpheler oralarda yuva kurar."]]}, {"reader": false, "ar": [[823.0, "قال الله عز وجل:"], [825.7, "<span class=\"ayah\">﴿اللَّهُ الَّذِي خَلَقَكُمْ ثُمَّ رَزَقَكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ۖ هَلْ مِن شُرَكَائِكُم مَّن يَفْعَلُ مِن ذَٰلِكُم مِّن شَيْءٍ ۚ سُبْحَانَهُ وَتَعَالَىٰ عَمَّا يُشْرِكُونَ﴾<\/span> <span class=\"ref\">[الروم: ٤٠]<\/span>."], [841.0, "فمنهج القرآن هو هذان الأمران:"], [846.0, "فإذا أراد أن يُثبت الألوهية له وحده دون ما سواه جعل طريقَ إثباتها استحقاقَه لكلّ مقتضيات الربوبية،"], [858.0, "وإذا أراد أن يُبطل عبادة غيره فإنّ طريق إبطالها سلبُ خصائص الربوبية عن هذه المعبودات من دون الله عز وجل."], [874.0, "والآيات في هذا كثيرةٌ جدًّا."]], "tr": [[823.0, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Allah, sizi yaratan, sonra sizi rızıklandıran, sonra sizi öldüren, sonra sizi diriltendir. Ortaklarınızdan bunlardan herhangi birini yapabilen var mı? O, onların ortak koştuklarından münezzeh ve yücedir﴾<\/span> [Rûm 40]."], [842.6, "Kur'an'ın metodu bu iki şeydir:"], [847.0, "Ulûhiyyeti kendisinden başkasına değil yalnız kendisine isbat etmek istediğinde, onu isbatın yolu olarak rubûbiyyetin bütün gereklerine layık olmasını kılar;"], [859.5, "başkasına ibadeti iptal etmek istediğinde ise onu iptalin yolu, Allah Teâlâ'yı bırakıp ibadet edilen bu mabudlardan rubûbiyyetin hususiyetlerini nefyetmektir."], [874.0, "Bu konudaki ayetler pek çoktur."]]}]}, {"ts": "14:37", "title": "3. Külliye: Ulûhiyyetteki her bozukluk rubûbiyyetteki bir bozukluktandır", "paras": [{"reader": false, "ar": [[876.6, "الكلّيّة الثالثة: <b>كلُّ خللٍ وقع في الألوهية فلِخَللٍ وقع في الربوبية.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[876.6, "<b>3. külliye: Ulûhiyyette meydana gelen her bozukluk, rubûbiyyette meydana gelen bir bozukluktan dolayıdır.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[910.0, "أقول وبالله التوفيق: وذلك لأن الشرك في الربوبية هو البوّابة الكبرى لشرك الألوهية."], [922.0, "فلا يقع الإنسان ـ في الأعمّ الأغلبي ـ في شيءٍ من مخالفات الألوهية،"], [930.0, "أو من صرف شيءٍ من العبادة والتألّه لغير الله عز وجل،"], [936.0, "إلا وقد سبق ذلك خللٌ في شيءٍ من مقتضيات الربوبية؛"], [943.0, "فأشرك في الربوبية أولًا،"], [945.8, "ووقع في شرك الألوهية ثانيًا."], [951.0, "فإذا أردنا أن نُبطل الشرك في الألوهية فلنُبطل أولًا الشركَ في الربوبية."]], "tr": [[910.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, rubûbiyyette şirkin ulûhiyyet şirkinin en büyük kapısı olmasıdır."], [922.7, "İnsan — çoğunlukla — ulûhiyyete aykırı bir şeye ya da ibadet ve teellühten bir şeyi Allah Teâlâ'dan başkasına yöneltmeye, ancak ondan önce rubûbiyyetin gereklerinden birinde bir bozukluk meydana geldikten sonra düşer."], [944.4, "Önce rubûbiyyette şirk koşar, sonra ulûhiyyet şirkine düşer."], [951.7, "Ulûhiyyetteki şirki iptal etmek istiyorsak, önce rubûbiyyetteki şirki iptal edelim."]]}, {"reader": false, "ar": [[962.0, "وهذا منهج القرآن، وهي أن الله عز وجل إذا أراد أن يُبطل عبادة غيره ـ ألوهية ـ سلب خصائص الربوبية عنها."], [975.0, "وذلك لأن الإنسان قد فُطر على أن لا يصرف الألوهية لشيءٍ من دون الله إلا ولا بدّ أن يُضفي عليه شيئًا من خصائص الربوبية،"], [987.0, "فيصفه بالربوبيات ويصرف له بعد ذلك الألوهية."]], "tr": [[962.0, "Kur'an'ın metodu budur: Allah Teâlâ başkasına ibadeti — yani ulûhiyyeti — iptal etmek istediğinde, ondan rubûbiyyetin hususiyetlerini nefyeder."], [975.5, "Çünkü insan, Allah'tan başka bir şeye ulûhiyyeti ancak ona rubûbiyyetin hususiyetlerinden bir şey yükledikten sonra yöneltecek bir yaratılıştadır."], [985.5, "Onu rubûbiyyete ait vasıflarla niteler, ardından ona ulûhiyyeti yöneltir."]]}, {"reader": false, "ar": [[991.0, "ولذلك ما عُبدت الشمس إلا لمّا وُصفت بشيءٍ من مقتضيات الربوبية،"], [999.0, "وما عُبد القمر إلا لمّا وُصف بشيءٍ من مقتضيات الربوبية،"], [1005.0, "وما عُبدت الملائكة ـ <span class=\"ayah\">﴿وَيَوْمَ يَحْشُرُهُمْ جَمِيعًا ثُمَّ يَقُولُ لِلْمَلَائِكَةِ أَهَٰؤُلَاءِ إِيَّاكُمْ كَانُوا يَعْبُدُونَ﴾<\/span> <span class=\"ref\">[سبأ: ٤٠]<\/span> ـ فالملائكة عُبدت من دون الله،"], [1016.0, "والشمس عُبدت من دون الله،"], [1018.0, "والقمر عُبد من دون الله،"], [1020.0, "كما قال الله عز وجل:"], [1022.5, "<span class=\"ayah\">﴿لَا تَسْجُدُوا لِلشَّمْسِ وَلَا لِلْقَمَرِ وَاسْجُدُوا لِلَّهِ الَّذِي خَلَقَهُنَّ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ﴾<\/span> <span class=\"ref\">[فصلت: ٣٧]<\/span>."]], "tr": [[991.0, "Bu yüzden güneşe, ancak rubûbiyyetin gereklerinden bir şeyle nitelendiğinde ibadet edildi;"], [997.2, "aya da ancak rubûbiyyetin gereklerinden bir şeyle nitelendiğinde ibadet edildi;"], [1002.6, "meleklere de ibadet edildi — <span class=\"ayah\">﴿O gün Allah onların hepsini toplar, sonra meleklere: \"Bunlar size mi ibadet ediyorlardı?\" der﴾<\/span> [Sebe' 40]."], [1014.4, "Meleklere Allah'ı bırakıp ibadet edildi, güneşe Allah'ı bırakıp ibadet edildi, aya Allah'ı bırakıp ibadet edildi."], [1019.6, "Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿Güneşe de aya da secde etmeyin; eğer yalnız O'na ibadet ediyorsanız, onları yaratan Allah'a secde edin﴾<\/span> [Fussilet 37]."]]}, {"reader": false, "ar": [[1029.0, "وعُبدت الأنبياء من دون الله لأنهم أضفَوا على الأنبياء شيئًا من مقتضيات الربوبية،"], [1039.0, "وعُبد آلُ البيت من دون الله عز وجل لأنهم أضفَوا عليهم شيئًا من مقتضيات الربوبية،"], [1048.0, "وعُبد الأولياء والصالحون من دون الله عز وجل لأنهم أضفَوا عليهم شيئًا من مقتضيات الربوبية."], [1056.0, "وعُبدت القبور والأشجار والأحجار والكهوف والمغارات والبقر والنجوم والأفلاك؛"], [1064.0, "كلُّها عُبدت من دون الله عز وجل،"], [1067.0, "ولكن يسبق ذلك أنّ عابدها قد أضفى عليها شيئًا من مقتضيات الربوبية،"], [1076.0, "فوقع في شرك الربوبية أولًا،"], [1078.9, "ثم جرّه ذلك إلى الشرك في الألوهية."]], "tr": [[1029.0, "Peygamberlere Allah'ı bırakıp ibadet edildi;"], [1035.0, "çünkü peygamberlere rubûbiyyetin gereklerinden bir şey yüklediler."], [1038.5, "Ehl-i Beyt'e Allah Teâlâ'yı bırakıp ibadet edildi;"], [1042.8, "çünkü onlara rubûbiyyetin gereklerinden bir şey yüklediler."], [1046.9, "Velilere ve salihlere Allah Teâlâ'yı bırakıp ibadet edildi;"], [1051.0, "çünkü onlara rubûbiyyetin gereklerinden bir şey yüklediler."], [1055.4, "Kabirlere, ağaçlara, taşlara, kovuklara, mağaralara, ineklere, yıldızlara ve feleklere ibadet edildi;"], [1064.4, "hepsine Allah Teâlâ'yı bırakıp ibadet edildi."], [1067.0, "Fakat bundan önce, onlara ibadet eden kişi onlara rubûbiyyetin gereklerinden bir şey yüklemişti."], [1076.6, "Önce rubûbiyyet şirkine düştü, sonra bu onu ulûhiyyette şirke sürükledi."]]}, {"reader": false, "ar": [[1083.0, "ولذلك يقول الله تبارك وتعالى عن قوم هود أنهم قالوا له ـ لمّا أمرهم بالتوحيد وترك الأوثان ـ:"], [1093.6, "<span class=\"ayah\">﴿إِن نَّقُولُ إِلَّا اعْتَرَاكَ بَعْضُ آلِهَتِنَا بِسُوءٍ﴾<\/span> <span class=\"ref\">[هود: ٥٤]<\/span>؛"], [1098.0, "فقد كانوا يظنّون أو يعتقدون أن آلهتهم تضرّ وتنفع."], [1104.0, "فلو أنهم لم يعتقدوا فيها شيئًا من ذلك لما صرفوا لها شيئًا من الألوهية."]], "tr": [[1083.0, "Bu yüzden Allah Tebâreke ve Teâlâ, Hûd'un kavminin — onlara tevhidi ve putları terk etmeyi emrettiğinde — ona şöyle dediklerini bildirir:"], [1094.9, "<span class=\"ayah\">﴿Biz ancak, ilahlarımızdan birinin seni fena çarptığını söyleriz﴾<\/span> [Hûd 54]."], [1100.0, "Onlar ilahlarının zarar ve fayda verdiğini zannediyor ya da inanıyorlardı."], [1105.3, "Eğer onlar hakkında böyle bir şeye inanmasalardı, onlara ulûhiyyetten hiçbir şey yöneltmezlerdi."]]}, {"reader": false, "ar": [[1110.0, "ولذلك نحن لا نعبد هذا الماء الذي أمامي؛"], [1116.0, "لماذا؟ لأننا لم نُضفِ عليه شيئًا من الربوبية."], [1120.0, "لكن تأكّدوا أنه متى ما اقتنعت قلوبنا أنه موصوفٌ بشيءٍ من مقتضيات الربوبية فسترى من يصرف له شيئًا من مقتضيات الألوهية."], [1133.0, "ولذلك إذا سألتَ الناس عن سببيّة صرف الألوهيات لغير الله،"], [1142.0, "فلا يُعلّلون لك إلا بعِلَلٍ ترجع إلى الربوبية:"], [1146.0, "أنه يرزق ـ وهذا ربوبية ـ أو أنه يضرّ ـ وهي ربوبية ـ أو أنه يشفي ـ وهي ربوبية."], [1158.0, "لا يجدون تعليلًا آخر؛"], [1161.0, "فيُعلّلون صرفهم للألوهيات بأن معبودهم متّصفٌ بشيءٍ من الربوبيات."]], "tr": [[1110.0, "Bu yüzden biz önümdeki şu suya ibadet etmiyoruz."], [1115.1, "Neden? Çünkü ona rubûbiyyetten hiçbir şey yüklemedik."], [1118.5, "Fakat emin olun ki kalplerimiz onun rubûbiyyetin gereklerinden bir şeyle nitelendiğine ikna olduğu anda, ona ulûhiyyetin gereklerinden bir şey yönelten kimseyi görürsün."], [1130.5, "Bu yüzden insanlara ulûhiyyete ait şeyleri Allah'tan başkasına yöneltmelerinin sebebini sorarsan, sana ancak rubûbiyyete dönen gerekçeler gösterirler:"], [1143.0, "Rızık verdiği — bu rubûbiyyettir —, ya da zarar verdiği — bu rubûbiyyettir —, ya da şifa verdiği — bu rubûbiyyettir."], [1157.4, "Başka bir gerekçe bulamazlar. Ulûhiyyete ait şeyleri yöneltmelerini, mabudlarının rubûbiyyete ait şeylerden biriyle nitelenmesiyle gerekçelendirirler."]]}, {"reader": false, "ar": [[1172.0, "ولذلك فمتى ما أردنا أن نُبطل الشرك في الألوهية فلنُصحّح سيرَ القلب في الربوبية؛"], [1181.0, "لأنّ من صحّت ربوبيّاته صحّت ألوهيّاته،"], [1187.0, "ومن اختُرقت ربوبيّاته اختُرقت ألوهيّاته."], [1195.0, "فهما متلازمان، فهما متلازمان."], [1199.0, "واسمعوا إلى قول الله عز وجل:"]], "tr": [[1172.0, "Bu yüzden ulûhiyyetteki şirki iptal etmek istediğimizde, kalbin rubûbiyyetteki gidişatını düzeltelim."], [1176.4, "Çünkü rubûbiyyete dair inançları sahih olanın ulûhiyyete dair amelleri de sahih olur;"], [1183.3, "rubûbiyyete dair inançlarında gedik açılanın ulûhiyyete dair amellerinde de gedik açılır."], [1195.5, "İkisi birbirinden ayrılmaz, ikisi birbirinden ayrılmaz."], [1199.7, "Allah Teâlâ'nın şu sözünü dinleyin:"]]}]}, {"ts": "20:01", "title": "3. Külliye (sonu) · 4. Külliye: Her mülk hakikatte Allah'ındır", "paras": [{"reader": false, "ar": [[1201.0, "<span class=\"ayah\">﴿مَا نَعْبُدُهُمْ إِلَّا لِيُقَرِّبُونَا إِلَى اللَّهِ زُلْفَىٰ﴾<\/span> <span class=\"ref\">[الزمر: ٣]<\/span>؛"], [1208.0, "فلمّا أضفَوا على معبوداتهم التصرّفَ والتدبيرَ في التقريب إلى الله عز وجل زلفى صاروا يعبدونهم من دون الله عز وجل."], [1219.0, "وقال الله عز وجل عنهم:"], [1222.0, "<span class=\"ayah\">﴿وَاتَّخَذُوا مِن دُونِ اللَّهِ آلِهَةً﴾<\/span> ـ أي صرفوا لها شيئًا من الألوهيات ـ لماذا؟"], [1227.8, "قال: <span class=\"ayah\">﴿لَّعَلَّهُمْ يُنصَرُونَ﴾<\/span> <span class=\"ref\">[يس: ٧٤]<\/span>؛ لمّا أضفَوا عليهم أنّ آلهتهم تنصر استقلالًا وابتداءً عبدوها من دون الله عز وجل."], [1242.0, "والآيات في هذا المعنى كثيرة."]], "tr": [[1201.0, "<span class=\"ayah\">﴿Biz onlara ancak bizi Allah'a daha çok yaklaştırsınlar diye ibadet ediyoruz﴾<\/span> [Zümer 3]."], [1209.4, "Mabudlarına, Allah Teâlâ'ya yaklaştırma konusunda tasarruf ve tedbir yetkisi yükleyince, onlara Allah Teâlâ'yı bırakıp ibadet eder oldular."], [1216.9, "Allah Teâlâ onlar hakkında şöyle buyurdu:"], [1220.2, "<span class=\"ayah\">﴿Allah'ı bırakıp ilahlar edindiler﴾<\/span> — yani onlara ulûhiyyete ait şeylerden bir kısmını yönelttiler."], [1225.5, "Neden? Buyurdu ki: <span class=\"ayah\">﴿Yardım görürler umuduyla﴾<\/span> [Yâsîn 74]."], [1232.0, "İlahlarının müstakil olarak ve ilk elden (kendiliğinden) yardım ettiği inancını onlara yükleyince, Allah Teâlâ'yı bırakıp onlara ibadet ettiler."], [1242.0, "Bu anlamdaki ayetler pek çoktur."]]}, {"reader": false, "ar": [[1245.0, "الكلّيّة الرابعة ـ أطلتُ عليكم أنا ـ الكلّيّة الرابعة:"], [1251.0, "<b>كلُّ مملوكٍ فالله مالكُه مِلكَ حقيقة.<\/b> لا نزال في توحيد الربوبية ومتعلّقاته."], [1263.0, "<b>كلُّ مملوكٍ فالله يملكه مِلكَ حقيقة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1245.0, "4. külliye — size uzun tuttum — 4."], [1250.0, "külliye: Mülk olan her şeyin sahibi, hakikat mülkiyetiyle Allah'tır. Hâlâ rubûbiyyet tevhidi ve onun taalluklarındayız."], [1259.8, "<b>Mülk olan her şeye Allah hakikat mülkiyetiyle maliktir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1275.0, "أقول وبالله التوفيق: وهذا ما ندين الله عز وجل به:"], [1282.0, "أنّ الله مالكٌ لكلّ ذرّات السماوات والأرض،"], [1285.0, "وكلّ ذرّات العالم العلوي والسفلي وما بينهما،"], [1289.0, "ولا يخرج شيءٌ عن كونه مملوكًا لله عز وجل بالملكية الحقيقية التامّة الكاملة،"], [1298.0, "والتي لا يمكن أن تنفكّ عن الله عز وجل أزلًا ولا أبدًا."], [1304.0, "ولذلك تمدّح الله عز وجل بمقتضًى من مقتضيات ربوبيته،"], [1310.0, "وهي عمومُ مُلكه لكلّ شيء."]], "tr": [[1275.0, "Tevfik Allah'tandır, derim ki: Allah Teâlâ'ya karşı din edindiğimiz (inandığımız) şudur:"], [1282.4, "Allah, göklerin ve yerin bütün zerrelerine, üst ve alt âlemin ve ikisi arasındakilerin bütün zerrelerine maliktir."], [1290.3, "Hiçbir şey, tam ve kâmil hakiki mülkiyetle Allah Teâlâ'nın mülkü olmaktan çıkmaz;"], [1299.0, "bu mülkiyet ezelde de ebedde de Allah Teâlâ'dan ayrılamaz."], [1303.5, "Bu yüzden Allah Teâlâ, rubûbiyyetinin gereklerinden biriyle, yani mülkünün her şeyi kuşatmasıyla kendini övmüştür."]]}, {"reader": false, "ar": [[1315.0, "فقال الله عز وجل:"], [1317.2, "<span class=\"ayah\">﴿تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ﴾<\/span> <span class=\"ref\">[الملك: ١]<\/span>."], [1322.0, "وقال الله عز وجل:"], [1324.3, "<span class=\"ayah\">﴿وَقُلِ الْحَمْدُ لِلَّهِ﴾<\/span> ـ على أيّ شيء؟"], [1327.7, "ـ <span class=\"ayah\">﴿الَّذِي لَمْ يَتَّخِذْ وَلَدًا وَلَمْ يَكُن لَّهُ شَرِيكٌ فِي الْمُلْكِ وَلَمْ يَكُن لَّهُ وَلِيٌّ مِّنَ الذُّلِّ ۖ وَكَبِّرْهُ تَكْبِيرًا﴾<\/span> <span class=\"ref\">[الإسراء: ١١١]<\/span>."], [1337.0, "وقال الله عز وجل:"], [1339.0, "<span class=\"ayah\">﴿الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[الفرقان: ٢]<\/span> ولم… <span class=\"ayah\">﴿الَّذِي لَهُ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ﴾<\/span>، في آياتٍ متعدّدة."]], "tr": [[1315.0, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Mülk elinde olan (Allah) yücedir; O her şeye kadirdir﴾<\/span> [Mülk 1]."], [1320.9, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Ve de ki: Hamd olsun﴾<\/span> — neye karşı?"], [1326.6, "— <span class=\"ayah\">﴿çocuk edinmeyen, mülkte ortağı olmayan, acizlikten dolayı bir yardımcıya ihtiyacı olmayan Allah'a. Ve O'nu tekbir ettikçe et﴾<\/span> [İsrâ 111]."], [1335.5, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Göklerin ve yerin mülkü kendisine ait olan﴾<\/span> [Furkân 2] ve … <span class=\"ayah\">﴿Göklerin ve yerin mülkü kendisine ait olan﴾<\/span>; birçok ayette (böyledir)."]]}, {"reader": false, "ar": [[1348.0, "وقال الله عز وجل:"], [1350.2, "<span class=\"ayah\">﴿ذَٰلِكُمُ اللَّهُ رَبُّكُمْ لَهُ الْمُلْكُ﴾<\/span> <span class=\"ref\">[فاطر: ١٣]<\/span>،"], [1354.0, "وأنتم تعرفون أن تقديم الجارّ والمجرور يفيد الحصر؛"], [1359.1, "أي: لا مالكَ على الحقيقة إلا الله عز وجل."], [1364.0, "وقال الله عز وجل:"], [1366.5, "<span class=\"ayah\">﴿الْمُلْكُ يَوْمَئِذٍ الْحَقُّ لِلرَّحْمَٰنِ ۚ وَكَانَ يَوْمًا عَلَى الْكَافِرِينَ عَسِيرًا﴾<\/span> <span class=\"ref\">[الفرقان: ٢٦]<\/span>."], [1372.0, "ويقول الله عز وجل:"], [1374.0, "<span class=\"ayah\">﴿لِّمَنِ الْمُلْكُ الْيَوْمَ ۖ لِلَّهِ الْوَاحِدِ الْقَهَّارِ﴾<\/span> <span class=\"ref\">[غافر: ١٦]<\/span>."], [1377.0, "ويقول الله عز وجل:"], [1378.7, "<span class=\"ayah\">﴿يُسَبِّحُ لِلَّهِ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۖ لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ ۖ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ﴾<\/span> <span class=\"ref\">[التغابن: ١]<\/span>."], [1388.0, "والآيات في هذا المعنى كثيرة."]], "tr": [[1348.0, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿İşte Rabbiniz Allah budur; mülk O'nundur﴾<\/span> [Fâtır 13]."], [1354.0, "Bilirsiniz ki câr ve mecrûrun öne alınması hasr ifade eder;"], [1359.6, "yani hakikatte Allah Teâlâ'dan başka malik yoktur."], [1362.9, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿O gün hak olan mülk Rahmân'ındır. O, kâfirler için çetin bir gün olmuştur﴾<\/span> [Furkân 26]."], [1372.5, "Allah Teâlâ buyurur: <span class=\"ayah\">﴿Bugün mülk kimindir? Bir olan, her şeye galip olan Allah'ındır﴾<\/span> [Gâfir 16]."], [1378.7, "Allah Teâlâ buyurur: <span class=\"ayah\">﴿Göklerde ve yerde olanlar Allah'ı tesbih eder. Mülk O'nundur, hamd O'nundur; O her şeye kadirdir﴾<\/span> [Teğâbün 1]."], [1388.0, "Bu anlamdaki ayetler pek çoktur."]]}, {"reader": false, "ar": [[1390.0, "فالمالك لكلّ شيءٍ مملوكٍ على الحقيقة إنما هو الله تبارك وتعالى،"], [1397.0, "ولا يوصف بالملك حقيقةً إلا الله؛"], [1403.0, "فليس أحدٌ يملك مِلكَ حقيقةٍ إلا الله تبارك وتعالى."], [1408.0, "فكما أنه لا شريك له في ألوهيته،"], [1412.0, "فكذلك لا شريك له في ملكوته ومالكيّته."]], "tr": [[1390.0, "Hakikatte mülk olan her şeyin maliki ancak Allah Tebâreke ve Teâlâ'dır."], [1397.0, "Hakikatte mülk sahibi olmakla ancak Allah nitelenir."], [1403.6, "Allah Tebâreke ve Teâlâ'dan başka hiç kimse hakikat mülkiyetiyle malik değildir."], [1409.7, "Ulûhiyyetinde ortağı olmadığı gibi, melekûtunda ve malikiyetinde de ortağı yoktur."]]}, {"reader": false, "ar": [[1416.0, "فإن قلت: أوَلا يُشكل على قولك هذا بعضُ الآيات التي تصف المخلوق بأنه يملك؟"], [1425.0, "كقول الله عز وجل:"], [1427.9, "<span class=\"ayah\">﴿أَوْ مَا مَلَكْتُم مَّفَاتِحَهُ﴾<\/span> <span class=\"ref\">[النور: ٦١]<\/span>،"], [1431.0, "وقول الله عز وجل:"], [1434.0, "<span class=\"ayah\">﴿مَلَكَتْ أَيْمَانُكُمْ﴾<\/span>، وآياتٍ تصف المخلوق بأنه يملك."], [1444.0, "فنقول: إنّ كلّ آيةٍ تصف المخلوق بأنه يملك فلا بدّ أن تُفهم على عدّة أشياء:"]], "tr": [[1416.0, "\"Mahlûkun malik olduğunu bildiren bazı ayetler senin bu sözüne itiraz teşkil etmez mi?\" dersen — Allah Teâlâ'nın <span class=\"ayah\">﴿ya da anahtarlarına sahip olduğunuz (evlerde)﴾<\/span> [Nûr 61] sözü ve <span class=\"ayah\">﴿sağ ellerinizin malik olduğu﴾<\/span> sözü gibi;"], [1438.8, "ve mahlûkun malik olduğunu bildiren (başka) ayetler — deriz ki:"], [1447.6, "Mahlûkun malik olduğunu bildiren her ayet birkaç şey üzere anlaşılmalıdır:"]]}, {"reader": false, "ar": [[1454.0, "الشيء الأول: أنه مطلقُ المِلك،"], [1459.0, "لا الملكيةُ المطلقة. فالملكية التي نصف الله عز وجل ونوحّده بها إنما هي الملكية المطلقة التي لا تخرج عنها ذرّة،"], [1472.0, "وأما ملكية المخلوق فهي الملكية المقيّدة المحدّدة بما تحت يده:"], [1479.0, "فهو يملك سيارته ولا يملك سيارة جاره،"], [1483.0, "يملك بيته ولا يملك بيت جاره،"], [1487.0, "يملك أثاثه ولا يملك أثاث جاره."], [1491.0, "فملكية الله هي الملكية العامّة المطلقة،"], [1495.0, "وملكية المخلوق هي الملكية المحدّدة الخاصّة."]], "tr": [[1454.0, "Birincisi: Bu, mutlak mülkiyet değil, mülkiyetin mutlakıdır (bir ölçüde mülkiyettir)."], [1462.6, "Allah Teâlâ'yı nitelediğimiz ve onunla tevhid ettiğimiz mülkiyet, tek bir zerrenin bile dışında kalmadığı mutlak mülkiyettir."], [1470.9, "Mahlûkun mülkiyeti ise elinin altındakiyle kayıtlı ve sınırlı mülkiyettir:"], [1476.9, "Kendi arabasına malik olur, komşusunun arabasına malik olmaz;"], [1481.3, "kendi evine malik olur, komşusunun evine malik olmaz;"], [1485.7, "kendi eşyasına malik olur, komşusunun eşyasına malik olmaz."], [1491.0, "Allah'ın mülkiyeti genel ve mutlak mülkiyettir;"], [1494.3, "mahlûkun mülkiyeti ise sınırlı ve hususi mülkiyettir."]]}]}, {"ts": "25:01", "title": "4. Külliye (devam): Mahlûkun mülkiyeti istihlâftır, tasarrufu ve süresi sınırlıdır", "paras": [{"reader": false, "ar": [[1501.0, "وأضف إلى هذا أن الملكية التي يوصف بها المخلوق إنما هي ملكيةُ استخلاف،"], [1507.0, "لا ملكيةُ ذوات؛ كما قال الله عز وجل:"], [1513.4, "<span class=\"ayah\">﴿وَأَنفِقُوا مِمَّا جَعَلَكُم﴾<\/span> ـ مالكين له؟"], [1516.8, "لا ـ <span class=\"ayah\">﴿مُّسْتَخْلَفِينَ فِيهِ﴾<\/span> <span class=\"ref\">[الحديد: ٧]<\/span>. فالمالك على الحقيقة لكلّ ما تراه عينك أو ما لا تراه إنما هو الله."], [1529.0, "فملكية الله للأشياء هي ملكيةٌ ذاتيةٌ حقيقية،"], [1532.2, "وأما ملكيتك لها فهي ملكية استخلاف؛"], [1535.0, "بدليل أنها تنتقل لمن بعدك عند الموت ـ أنها تنتقل لمن بعدك بعد الموت ـ أو تنتقل للمشتري إذا بعتها. واضح؟"]], "tr": [[1501.0, "Buna şunu da ekle: Mahlûkun nitelendiği mülkiyet, zatlara (şeylerin kendisine) mülkiyet değil, ancak istihlâf (emanetçi olarak tasarruf) mülkiyetidir."], [1510.0, "Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿Sizi … kıldığı şeylerden infak edin﴾<\/span> — ona malik mi?"], [1518.1, "Hayır — <span class=\"ayah\">﴿içinde halife (emanetçi) kıldığı﴾<\/span> [Hadîd 7]."], [1523.9, "Gözünün gördüğü ya da görmediği her şeyin hakikatteki maliki ancak Allah'tır."], [1529.9, "Allah'ın eşyaya mülkiyeti zatî ve hakiki mülkiyettir;"], [1532.7, "senin onlara mülkiyetin ise istihlâf mülkiyetidir."], [1535.7, "Bunun delili, ölünce senden sonrakilere geçmesi — ölümden sonra senden sonrakilere geçmesi — ya da satınca alıcıya geçmesidir. Açık mı?"]]}, {"reader": false, "ar": [[1552.0, "وأضف إلى هذا أن ملكية المخلوق محدودةُ التصرّف؛"], [1557.0, "فليس لأنك تملك الشيء يحقّ لك أن تتصرّف فيه كيفما شئت."], [1563.0, "فإنك لو أردت أن تحرق سيارتك لمُنعتَ شرعًا من ذلك،"], [1569.0, "ولو أردت أن تمزّق دراهمك لمُنعتَ شرعًا من ذلك،"], [1574.2, "مع أنك تملكها. فالتصرّف فيما يملكه المخلوق مضبوطٌ بضابط الشرع؛"], [1584.0, "فكلُّ من تصرّف في ماليّته بما لا يُجيزه الشارع فهو آثمٌ والواجب منعُه،"], [1592.0, "ويكون سفيهًا يُمنع من التصرّف في ماله إذا أساء التصرّف فيه."]], "tr": [[1552.0, "Buna şunu da ekle: Mahlûkun mülkiyeti tasarruf bakımından sınırlıdır."], [1557.5, "Bir şeye malik olman, onda dilediğin gibi tasarruf etme hakkını sana vermez."], [1564.2, "Arabanı yakmak istesen şer'an bundan men edilirsin;"], [1568.4, "paralarını yırtmak istesen, onlara malik olduğun hâlde şer'an bundan men edilirsin."], [1574.8, "Mahlûkun malik olduğu şeydeki tasarruf, şeriatın ölçüsüyle kayıtlıdır."], [1580.5, "Malında Şâri'in caiz görmediği şekilde tasarruf eden herkes günahkârdır ve onun men edilmesi gerekir;"], [1592.0, "malında kötü tasarruf ederse, malında tasarruftan men edilen bir sefih olur."]]}, {"reader": false, "ar": [[1600.0, "ولذلك منع الشارع المجنونَ من التصرّف في المال،"], [1607.0, "ومنع الصبيَّ من التصرّف في ماله،"], [1612.0, "ومنع السفيهَ من التصرّف في ماله،"], [1615.3, "مع أنهم يملكونه. وأمّا ما يملكه الله فله التصرّفُ الكامل فيه:"], [1624.0, "فيُعدم هذا، ويُتلف هذا،"], [1626.9, "ويُحرق هذا، ويُدمّر هذا،"], [1630.0, "ويُرسل الريح الصرصر على هذا،"], [1633.0, "ويُهلك هؤلاء بالصيحة؛ <span class=\"ayah\">﴿فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنبِهِمْ فَسَوَّاهَا ۝ وَلَا يَخَافُ عُقْبَاهَا﴾<\/span> <span class=\"ref\">[الشمس: ١٤-١٥]<\/span>."], [1640.5, "ولا أحد يقول: كيف تأمرنا؟"], [1643.5, "كيف تبني الشيء ثم تهدمه؟"]], "tr": [[1600.0, "Bu yüzden Şâri', malik oldukları hâlde deliyi malda tasarruftan, çocuğu malında tasarruftan ve sefihi malında tasarruftan men etmiştir."], [1612.6, "Allah'ın malik olduğu şeye gelince, onda tam tasarruf O'nundur:"], [1617.0, "Şunu yok eder, şunu telef eder, şunu yakar, şunu helak eder, şunun üzerine kasırga rüzgârı gönderir, şunları sayha ile helak eder."], [1631.2, "<span class=\"ayah\">﴿Rableri onları günahları yüzünden yerle bir etti, (yeri) dümdüz etti. O, bunun sonucundan korkmaz﴾<\/span> [Şems 14-15]."], [1640.3, "Hiç kimse \"Bize nasıl emredersin?"], [1642.8, "Bir şeyi nasıl yapıp sonra yıkarsın?\" diyemez."]]}, {"reader": false, "ar": [[1647.0, "فتصرّف الله عز وجل فيما يملكه هو التصرّف المطلق الذي لا يُحدّ بضابطٍ ولا بقيد،"], [1657.0, "وأما تصرّف المخلوق فيما يملكه فإنما هو مطلقُ تصرّفٍ مضبوطٍ بضابط الشرع."]], "tr": [[1647.0, "Allah Teâlâ'nın malik olduğu şeydeki tasarrufu, hiçbir ölçü ve kayıtla sınırlanmayan mutlak tasarruftur."], [1656.3, "Mahlûkun malik olduğu şeydeki tasarrufu ise ancak şeriatın ölçüsüyle kayıtlı, bir ölçüde tasarruftur."]]}, {"reader": false, "ar": [[1666.0, "وأضف إلى هذا أن ملكية المخلوق محدودةٌ بزمن ابتداءٍ وزمن انتهاء؛"], [1676.0, "فقد كانت السيارة مملوكةً لغيرك،"], [1679.5, "وبعد شرائها ابتدأت ملكيتك لها،"], [1683.0, "ثم إذا بعتها انتهت ملكيتك عنها،"], [1686.0, "أليس كذلك؟ وأما ملكية الله للأشياء فإنها لا تُسبق بعدم،"], [1694.5, "ولا تُلحق بزوال؛ فهو مالكٌ للأشياء أزلًا،"], [1700.0, "ومالكٌ للأشياء أبدًا. فملكية المخلوق محدودةٌ بابتداءٍ وانتهاء،"], [1709.0, "وأما ملكية الله عز وجل فليست محدودةً لا بابتداءٍ ولا بانتهاء؛"], [1714.0, "فأين هذا من هذا؟"]], "tr": [[1666.0, "Buna şunu da ekle: Mahlûkun mülkiyeti bir başlangıç ve bir bitiş zamanıyla sınırlıdır."], [1672.9, "Araba önce başkasının mülküydü; onu satın aldıktan sonra senin ona mülkiyetin başladı;"], [1682.3, "sonra onu satarsan ondan mülkiyetin sona erer, öyle değil mi?"], [1687.1, "Allah'ın eşyaya mülkiyeti ise ne bir yokluktan sonra gelir ne de bir zevalle sona erer."], [1697.0, "O, ezelde de eşyanın malikidir, ebedde de eşyanın malikidir."], [1705.8, "Mahlûkun mülkiyeti bir başlangıç ve bitişle sınırlıdır;"], [1709.5, "Allah Teâlâ'nın mülkiyeti ise ne bir başlangıçla ne de bir bitişle sınırlıdır. Bu nerede, o nerede?"]]}, {"reader": false, "ar": [[1719.0, "فالملكية التي تنصّ عليها هذه الكلّيّة هي الملكية المطلقة لكلّ شيء،"], [1726.2, "والتي لم تُسبق بعدم ولا يلحقها زوال،"], [1735.0, "وهي ملكيةٌ لمالكها الأحقّيّةُ المطلقة في أن يتصرّف فيها بما تقتضيه حكمته وعلمه وخبرته تبارك وتعالى."], [1748.0, "فكلُّ آيةٍ فيها وصفُ المخلوق بشيءٍ من التملّك فلا بدّ أن تُفهم على غرار هذه النقاط التي ذكرتُها. والله أعلم."]], "tr": [[1719.0, "Bu külliyenin ifade ettiği mülkiyet, her şeye yönelik, bir yokluktan sonra gelmemiş ve kendisine zeval arız olmayan mutlak mülkiyettir."], [1730.1, "Bu öyle bir mülkiyettir ki sahibinin, onda Allah Tebâreke ve Teâlâ'nın hikmetinin, ilminin ve habîr oluşunun gerektirdiği şekilde tasarruf etmeye mutlak hakkı vardır."], [1750.9, "Mahlûkun bir şeye malik olmakla nitelendiği her ayet, zikrettiğim bu noktalar çerçevesinde anlaşılmalıdır. Allah en iyisini bilir."]]}]}, {"ts": "29:22", "title": "5. Külliye: Mahlûktan çıkan tedbir ve tasarruf ona sebep olarak, Allah'a yaratma olarak nispet edilir", "paras": [{"reader": false, "ar": [[1762.0, "ومن الكلّيّات أيضًا: كلُّ تدبيرٍ وتصريفٍ يصدر من المخلوق فيُنسب إليه نسبةَ سببيّة،"], [1780.8, "وإلى الله نسبةَ خلقٍ وتقدير. <span class=\"note\">(يكررها)<\/span> أُعيدها مرةً أخرى:"], [1794.0, "كلُّ تدبيرٍ أو تصريفٍ يصدر من المخلوق فيُنسب إليه نسبةَ سببيّة،"], [1800.5, "ويُنسب إلى الله نسبةَ خلقٍ وإرادةٍ وتقدير."]], "tr": [[1762.0, "Külliyelerden biri de şudur: 5."], [1764.0, "külliye: Mahlûktan çıkan her tedbir ve tasarruf, ona sebep olma nispetiyle, Allah'a ise yaratma ve takdir nispetiyle nispet edilir. (Tekrar ediyor.) Bir kez daha tekrar ediyorum:"], [1795.1, "<b>Mahlûktan çıkan her tedbir ya da tasarruf, ona sebep olma nispetiyle, Allah'a ise yaratma, irade ve takdir nispetiyle nispet edilir.<\/b>"]]}]}, {"ts": "30:05", "title": "5. Külliye (devam): Sebep nispeti ve yaratma nispeti", "paras": [{"reader": false, "ar": [[1805.0, "وذلك لأننا ـ معاشرَ أهل الإسلام ـ نعتقد الاعتقاد الجازم الذي لا يدخله شبهةٌ ولا شكّ أنّ المدبّر والمتصرّف لهذا العالم كلّه على الحقيقة إنما هو الله تبارك وتعالى،"], [1831.0, "وهو الخالق على الحقيقة،"], [1833.8, "والمريد لهذه الأشياء بإرادته الكونية على الحقيقة،"], [1839.0, "وهو المقدّر لوجودها وكونها على الحقيقة."], [1843.0, "ولكن إذا رأيتَ شيئًا من النصوص ينسب بعض التدبير والتصريف لأحدٍ من المخلوقين،"], [1851.0, "فاعلم أنها نسبةٌ سببيّةٌ فقط؛"], [1854.6, "أي أنّ المخلوق سببٌ في هذا الشيء،"], [1859.0, "لكنّ الذي يوجِد هذا الشيء ويقدّر هذا الشيء ويخلق هذا الشيء حقيقةً إنما هو الله عز وجل."]], "tr": [[1805.0, "Çünkü biz Müslümanlar topluluğu, içine hiçbir şüphe ve tereddüt girmeyen kesin bir itikadla inanırız ki, bu âlemin tamamını hakikatte tedbir eden ve onda tasarruf eden ancak Allah Tebâreke ve Teâlâ'dır."], [1833.1, "Hakikatte yaratan O'dur, bu şeyleri kevnî iradesiyle hakikatte dileyen O'dur, onların varlığını ve oluşunu hakikatte takdir eden O'dur."], [1845.5, "Fakat naslardan birinin bazı tedbir ve tasarrufu mahlûklardan birine nispet ettiğini görürsen, bil ki bu yalnızca bir sebep nispetidir;"], [1857.7, "yani mahlûk bu şeyde bir sebeptir."], [1861.0, "Fakat bu şeyi hakikatte var eden, takdir eden ve yaratan ancak Allah Teâlâ'dır."]]}, {"reader": false, "ar": [[1868.0, "ولذلك نجد في الأدلة نسبةَ الإيتاء للمخلوق،"], [1874.0, "كما قال الله عز وجل:"], [1876.0, "<span class=\"ayah\">﴿وَآتُوهُم مِّن مَّالِ اللَّهِ الَّذِي آتَاكُمْ﴾<\/span> <span class=\"ref\">[النور: ٣٣]<\/span>."], [1881.0, "فهل المخلوق يُؤتي؟ الجواب:"], [1883.7, "يُؤتي إيتاءَ سببيّة، والله يُؤتي إيتاءَ خلقٍ وإرادةٍ وتقدير."], [1892.0, "وهل المخلوق يُنعم؟ الجواب:"], [1894.7, "يُنعم إنعامَ سببيّة، والله يُنعم إنعامَ خلقٍ وإرادةٍ وتقدير."]], "tr": [[1868.0, "Bu yüzden delillerde vermenin (îtâ) mahlûka nispet edildiğini görürüz."], [1874.0, "Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿Allah'ın size verdiği malından onlara verin﴾<\/span> [Nûr 33]."], [1879.2, "Mahlûk verir mi? Cevap: Sebep olarak verir;"], [1883.7, "Allah ise yaratma, irade ve takdir olarak verir."], [1888.4, "Mahlûk nimet verir mi? Cevap:"], [1893.4, "Sebep olarak nimet verir; Allah ise yaratma, irade ve takdir olarak nimet verir."]]}, {"reader": false, "ar": [[1908.0, "كما قال الله عز وجل:"], [1911.2, "<span class=\"ayah\">﴿وَإِذْ تَقُولُ لِلَّذِي أَنْعَمَ اللَّهُ عَلَيْهِ﴾<\/span> ـ أي نعمةَ خلقٍ وإرادةٍ وتقديرٍ وإيجاد ـ <span class=\"ayah\">﴿وَأَنْعَمْتَ عَلَيْهِ﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٧]<\/span> ـ أي نعمةً سببيّةً بعتقه."], [1926.0, "والإنعام تدبيرٌ وتصريف؛ فالمخلوق يُنعم إنعامَ سببيّة،"], [1930.5, "والله عز وجل يُنعم إنعامَ ابتداءٍ وخلقٍ وإرادةٍ وتقدير،"], [1936.4, "عبّر عنها بما شئت."]], "tr": [[1908.0, "Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿Hani Allah'ın nimet verdiği﴾<\/span> — yani yaratma, irade, takdir ve var etme nimeti — <span class=\"ayah\">﴿ve senin de nimet verdiğin kimseye diyordun﴾<\/span> [Ahzâb 37] — yani onu azat etmekle sebep olarak verilen bir nimet."], [1926.7, "Nimet vermek bir tedbir ve tasarruftur."], [1929.2, "Mahlûk sebep olarak nimet verir;"], [1931.2, "Allah Teâlâ ise ilk elden (ibtidâen), yaratma, irade ve takdir olarak nimet verir;"], [1936.4, "bunu dilediğin şekilde ifade et."]]}, {"reader": false, "ar": [[1947.0, "فإن قلت: وهل المخلوق يرزق؟"], [1950.3, "الجواب: نعم، لكن يرزق رزقَ سببيّة،"], [1954.2, "والله يرزق رزقَ ابتدائيّةٍ وخلقٍ وإرادةٍ وتقدير؛"], [1962.0, "كما قال الله عز وجل:"], [1965.5, "<span class=\"ayah\">﴿فَارْزُقُوهُم مِّنْهُ﴾<\/span> <span class=\"ref\">[النساء: ٨]<\/span>، ووصف المخلوق بأنه يرزق."], [1970.0, "وهكذا في سائر تصرّفات المخلوق."]], "tr": [[1947.0, "\"Mahlûk rızık verir mi?\" dersen, cevap:"], [1949.6, "Evet, fakat sebep olarak rızık verir;"], [1952.9, "Allah ise ilk elden, yaratma, irade ve takdir olarak rızık verir."], [1958.1, "Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿Ondan onları rızıklandırın﴾<\/span> [Nisâ 8];"], [1966.1, "burada mahlûku rızık vermekle nitelemiştir."], [1968.9, "Mahlûkun diğer bütün tasarruflarında da durum böyledir."]]}, {"reader": false, "ar": [[1976.0, "هل المخلوق يُعطي؟ الجواب:"], [1978.7, "يُعطي عطاءَ سببيّة، والله يُعطي عطاءَ خلقٍ وتقديرٍ وإيجاد."], [1985.0, "هل المخلوق يمنع؟ الجواب:"], [1987.7, "يمنع منعَ سببيّة، والله يمنع الشيء منعَ إرادةٍ وخلقٍ وابتداءٍ وتقدير."], [1996.0, "هل المخلوق يضرّ؟ الجواب:"], [1998.6, "يضرّ ضررَ سببيّة، والله هو الذي يملك الضرَّ ويخلقه ويقدّره ويريده بإرادته الكونية."], [2013.0, "هل المخلوق ينفع؟ الجواب:"], [2015.6, "ينفع نفعَ سببيّة، والله هو الذي ينفع عباده نفعَ خلقٍ وابتداءٍ وإرادةٍ وتقدير."]], "tr": [[1976.0, "Mahlûk verir mi? Cevap: Sebep olarak verir;"], [1979.4, "Allah ise yaratma, takdir ve var etme olarak verir."], [1984.1, "Mahlûk engeller mi? Cevap: Sebep olarak engeller;"], [1988.3, "Allah ise bir şeyi irade, yaratma, ilk elden ve takdir olarak engeller."], [1994.3, "Mahlûk zarar verir mi? Cevap:"], [1998.0, "Sebep olarak zarar verir; zarara malik olan, onu yaratan, takdir eden ve kevnî iradesiyle dileyen ise Allah'tır."], [2013.0, "Mahlûk fayda verir mi? Cevap:"], [2015.6, "Sebep olarak fayda verir; kullarına yaratma, ilk elden, irade ve takdir olarak fayda veren ise Allah'tır."]]}, {"reader": false, "ar": [[2027.0, "هل المخلوق يشاء؟ الجواب:"], [2029.6, "يشاء مشيئةَ سببيّة، والله عز وجل يشاء مشيئةً كونيّةً قدريّةً يُوجَد عندها مقتضاها؛"], [2041.1, "كما قال الله عز وجل:"], [2046.8, "<span class=\"ayah\">﴿وَمَا تَشَاءُونَ﴾<\/span> ـ أي سببيّةً ـ <span class=\"ayah\">﴿إِلَّا أَن يَشَاءَ اللَّهُ﴾<\/span> <span class=\"ref\">[الإنسان: ٣٠]<\/span> ـ خلقًا وتقديرًا وإرادةً."], [2053.0, "فإذا وصفت الأدلةُ المخلوقَ بشيءٍ من التدبير والتصريف،"], [2058.2, "فإيّاك أن تعتقد أنه مشاركٌ لله عز وجل في التدبير الابتدائي الاستقلالي أو التصريف الابتدائي الاستقلالي،"], [2069.6, "وإنما هو تدبيرٌ سببي."], [2072.1, "فبالتفريق بين النسبتين يتحرّر كثيرٌ من الإشكالات في نسبة التدبير إلى المخلوق أو نسبته إلى الخالق."]], "tr": [[2027.0, "Mahlûk diler mi? Cevap: Sebep olarak diler;"], [2031.0, "Allah Teâlâ ise kendisiyle gereği var olan kevnî ve kaderî bir meşîetle diler."], [2041.1, "Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿Siz dilemezsiniz﴾<\/span> — yani sebep olarak — <span class=\"ayah\">﴿ancak Allah dilerse﴾<\/span> [İnsân 30] — yaratma, takdir ve irade olarak."], [2054.9, "Deliller mahlûku bir tür tedbir ve tasarrufla nitelediğinde, sakın onun Allah Teâlâ'ya ilk elden ve müstakil tedbirde ya da ilk elden ve müstakil tasarrufta ortak olduğuna inanma;"], [2070.8, "bu ancak sebep olarak bir tedbirdir."], [2074.1, "İki nispet arasını ayırmakla, tedbirin mahlûka ya da Hâlık'a nispet edilmesindeki birçok müşkil çözülür."]]}, {"reader": false, "ar": [[2085.0, "والخلاصة: أنّ التدبير الذي يُنسب إلى الله إنما هو التدبير والتصريف المطلق،"], [2093.0, "والتدبير الذي يُنسب إلى المخلوق فإنما هو مطلقُ التدبير ومطلقُ التصريف. والله أعلم."]], "tr": [[2085.0, "Özetle: Allah'a nispet edilen tedbir, mutlak tedbir ve tasarruftur;"], [2090.3, "mahlûka nispet edilen tedbir ise ancak bir ölçüde tedbir ve bir ölçüde tasarruftur. Allah en iyisini bilir."]]}]}, {"ts": "35:04", "title": "6. Külliye: Mertebesi ne kadar yüce olsa da hiçbir mahlûk rubûbiyyetin gereklerine layık değildir", "paras": [{"reader": false, "ar": [[2104.0, "ومن الكلّيّات أيضًا: <b>كلُّ مخلوقٍ وإن عظمت مرتبتُه فليس بمستحِقٍّ لشيءٍ من مقتضيات الربوبية.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [2131.8, "فالمخلوق وإن عظمت مرتبته عند الله عز وجل،"], [2136.7, "فلا يزال ذلك المخلوقَ العبدَ الضعيفَ لله تبارك وتعالى،"], [2142.3, "لا يصلح أن يُضفى عليه شيءٌ من مقتضيات الربوبية أو الألوهية."], [2149.0, "وليس عِظَمُ منزلته عند الله بمسوِّغٍ لنا أن نعطيه شيئًا من مقتضيات ربوبية الله عز وجل."]], "tr": [[2104.0, "Külliyelerden biri de şudur: 6."], [2106.7, "külliye: Mertebesi ne kadar yüce olursa olsun hiçbir mahlûk rubûbiyyetin gereklerinden hiçbir şeye layık değildir. (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [2134.3, "Mahlûkun Allah Teâlâ katındaki mertebesi ne kadar yüce olursa olsun, o hâlâ Allah Tebâreke ve Teâlâ'nın zayıf kulu olan mahlûktur;"], [2144.7, "ona rubûbiyyetin ya da ulûhiyyetin gereklerinden bir şey yüklenemez."], [2149.7, "Onun Allah katındaki menzilesinin büyüklüğü, ona Allah Teâlâ'nın rubûbiyyetinin gereklerinden bir şey vermemiz için bir gerekçe değildir."]]}, {"reader": false, "ar": [[2161.0, "وأعظمُ المخلوقات السماوية هم الملائكة،"], [2166.0, "فالله عز وجل يسلب عنهم صفات الربوبية،"], [2169.0, "وأنهم <span class=\"ayah\">﴿عِبَادٌ مُّكْرَمُونَ ۝ لَا يَسْبِقُونَهُ بِالْقَوْلِ وَهُم بِأَمْرِهِ يَعْمَلُونَ ۝ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يَشْفَعُونَ إِلَّا لِمَنِ ارْتَضَىٰ وَهُم مِّنْ خَشْيَتِهِ مُشْفِقُونَ ۝ وَمَن يَقُلْ مِنْهُمْ إِنِّي إِلَٰهٌ مِّن دُونِهِ﴾<\/span> ـ أي مستحِقٌّ لشيءٍ من مقتضيات الربوبية أو الألوهية،"], [2197.0, "مع أنه مَلَكٌ من الملائكة ـ فيتوعّده الله عز وجل بقوله: <span class=\"ayah\">﴿فَذَٰلِكَ نَجْزِيهِ جَهَنَّمَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٦-٢٩]<\/span>."]], "tr": [[2161.0, "Semavî mahlûkların en büyüğü meleklerdir."], [2163.4, "Allah Teâlâ onlardan rubûbiyyet sıfatlarını nefyeder ve onların <span class=\"ayah\">﴿ikram edilmiş kullar﴾<\/span> olduğunu bildirir:"], [2169.8, "<span class=\"ayah\">﴿Sözde O'nun önüne geçmezler; onlar O'nun emriyle iş görürler. O, önlerindekini ve arkalarındakini bilir. Onlar O'nun razı olduğu kimseden başkasına şefaat etmezler ve O'nun korkusundan titrerler. Onlardan kim \"Ben O'ndan başka bir ilahım\" derse﴾<\/span> — yani rubûbiyyetin ya da ulûhiyyetin gereklerinden bir şeye layığım derse;"], [2195.1, "üstelik o meleklerden bir melek olduğu hâlde — Allah Teâlâ onu şu sözüyle tehdit eder:"], [2201.4, "<span class=\"ayah\">﴿İşte onu cehennemle cezalandırırız﴾<\/span> [Enbiyâ 26-29]."]]}, {"reader": false, "ar": [[2205.0, "«وإذا قضى اللهُ الأمرَ في السماء ضربت الملائكةُ بأجنحتها خُضْعانًا لقوله، كأنه سلسلةٌ على صَفْوان، يَنفُذُهم ذلك» <span class=\"note\">(Buhârî)<\/span>،"], [2219.0, "وهو قول الله عز وجل:"], [2221.9, "<span class=\"ayah\">﴿حَتَّىٰ إِذَا فُزِّعَ عَن قُلُوبِهِمْ قَالُوا مَاذَا قَالَ رَبُّكُمْ ۖ قَالُوا الْحَقَّ ۖ وَهُوَ الْعَلِيُّ الْكَبِيرُ﴾<\/span> <span class=\"ref\">[سبأ: ٢٣]<\/span>."], [2230.0, "فالملائكة تخاف من الله،"], [2232.4, "وتخشع لله، وتطيع الله ولا تعصيه؛"], [2236.0, "كما قال الله عز وجل:"], [2238.6, "<span class=\"ayah\">﴿عَلَيْهَا مَلَائِكَةٌ غِلَاظٌ شِدَادٌ لَّا يَعْصُونَ اللَّهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ﴾<\/span> <span class=\"ref\">[التحريم: ٦]<\/span>."]], "tr": [[2205.0, "«Allah gökte bir işe hükmettiğinde, melekler O'nun sözüne boyun eğerek kanatlarını çırparlar; (bu ses) sanki düz bir kaya üzerindeki zincir (sesi) gibidir; bu onlara nüfuz eder.» <span class=\"note\">(Buhârî)<\/span> Bu, Allah Teâlâ'nın şu sözüdür:"], [2223.1, "<span class=\"ayah\">﴿Nihayet kalplerinden korku giderilince \"Rabbiniz ne buyurdu?\" derler. \"Hakkı (buyurdu)\" derler. O yücedir, büyüktür﴾<\/span> [Sebe' 23]."], [2230.0, "Melekler Allah'tan korkar, Allah'a huşu duyar, Allah'a itaat eder ve O'na isyan etmezler."], [2235.4, "Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿Onun başında, Allah'ın kendilerine verdiği emirlere karşı gelmeyen ve emredildikleri şeyi yapan katı ve şiddetli melekler vardır﴾<\/span> [Tahrîm 6]."]]}, {"reader": false, "ar": [[2245.0, "وقال النبي ﷺ: «أطّت السماءُ وحُقَّ لها أن تئطّ، ما من موضعِ أربعِ أصابعَ إلا مَلَكٌ ساجدٌ أو راكع»."], [2258.0, "فإذا كان أعظمُ سكّان السماء سلب الله عز وجل عنهم صفات الربوبية والألوهية،"], [2267.1, "فمَن دونهم من باب أولى."]], "tr": [[2245.0, "Peygamber ﷺ buyurdu: «Gök gıcırdadı; gıcırdaması da hakkıdır. Onda dört parmaklık bir yer yoktur ki orada secde ya da rükû eden bir melek bulunmasın.» Semanın en büyük sakinlerinden Allah Teâlâ rubûbiyyet ve ulûhiyyet sıfatlarını nefyettiyse, onlardan aşağıdakilerden haydi haydi nefyetmiştir."]]}, {"reader": false, "ar": [[2270.0, "وكذلك الأنبياء، وهم أشرف سكّان الأرض؛"], [2274.0, "فالله عز وجل في الأدلة يسلب عنهم صفات الربوبية،"], [2279.0, "كما قال الله عز وجل عن نبيّه ـ وهو أكملهم على الإطلاق ـ:"], [2284.0, "<span class=\"ayah\">﴿قُل لَّا أَمْلِكُ لِنَفْسِي نَفْعًا وَلَا ضَرًّا … وَلَوْ كُنتُ أَعْلَمُ الْغَيْبَ لَاسْتَكْثَرْتُ مِنَ الْخَيْرِ وَمَا مَسَّنِيَ السُّوءُ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٨]<\/span> <span class=\"note\">(Şeyh «إلا ما شاء الله» kısmını okumuyor)<\/span>."], [2298.0, "ويقول الله عز وجل له:"], [2301.0, "<span class=\"ayah\">﴿لَيْسَ لَكَ مِنَ الْأَمْرِ شَيْءٌ﴾<\/span> <span class=\"ref\">[آل عمران: ١٢٨]<\/span>؛"], [2303.8, "ما لك شأنٌ فيهم،"], [2306.0, "أنا مالكهم، وأنا الذي أدبّر أمورهم،"], [2310.1, "وأنا الذي أصرّف أحوالهم،"], [2313.0, "فلا حقّ لك أن تدعو على أحد."], [2316.0, "لأن النبي ﷺ دعا على بعض المشركين،"], [2320.0, "فأنزل الله عز وجل:"], [2322.7, "<span class=\"ayah\">﴿لَيْسَ لَكَ مِنَ الْأَمْرِ شَيْءٌ﴾<\/span>."]], "tr": [[2270.0, "Peygamberler de böyledir; onlar yeryüzü sakinlerinin en şereflileridir."], [2274.0, "Allah Teâlâ delillerde onlardan rubûbiyyet sıfatlarını nefyeder."], [2276.8, "Allah Teâlâ'nın, mutlak olarak onların en kâmili olan Peygamberi hakkında buyurduğu gibi:"], [2281.7, "<span class=\"ayah\">﴿De ki: Ben kendime bir fayda ya da zarar verme gücüne sahip değilim … Eğer gaybı bilseydim elbette daha çok hayır yapardım ve bana hiçbir kötülük dokunmazdı﴾<\/span> [A'râf 188]."], [2298.6, "Allah Teâlâ ona şöyle buyurur:"], [2301.0, "<span class=\"ayah\">﴿Bu işte senin hiçbir yetkin yoktur﴾<\/span> [Âl-i İmrân 128];"], [2304.7, "yani onlar hakkında senin bir yetkin yok;"], [2308.7, "onların maliki benim, işlerini tedbir eden benim, hâllerini çekip çeviren benim;"], [2313.9, "kimseye beddua etmeye hakkın yok."], [2315.6, "Çünkü Peygamber ﷺ bazı müşriklere beddua etmişti;"], [2319.6, "bunun üzerine Allah Teâlâ <span class=\"ayah\">﴿Bu işte senin hiçbir yetkin yoktur﴾<\/span> ayetini indirdi."]]}, {"reader": false, "ar": [[2326.0, "فإذا كان أشرفُ سكّان السماء تُسلب عنهم صفات الربوبية،"], [2330.0, "وأشرفُ سكّان الأرض تُسلب عنهم صفات الربوبية،"], [2337.0, "فإذًا من المستحِقّ لأن يوصف بشيءٍ من مقتضيات الربوبية أو الألوهية؟"], [2344.0, "الجواب: لا أحد. فمهما عظمت منزلة المخلوق عند الله عز وجل،"], [2350.9, "فإنه يبقى ذلك العبدَ الضعيفَ المربوبَ المخلوقَ المفتقرَ بذاته إلى الله عز وجل في تدبير أحواله،"], [2360.9, "وتصريف أموره، وطعامه وشرابه،"], [2363.4, "وقيامه وقعوده؛ ليس بمستغنٍ عن الله عز وجل طرفةَ عين."]], "tr": [[2326.0, "Semanın en şerefli sakinlerinden rubûbiyyet sıfatları nefyediliyor, yeryüzünün en şerefli sakinlerinden de rubûbiyyet sıfatları nefyediliyorsa, o hâlde rubûbiyyetin ya da ulûhiyyetin gereklerinden bir şeyle nitelenmeye kim layıktır?"], [2342.1, "Cevap: Hiç kimse. Mahlûkun Allah Teâlâ katındaki menzilesi ne kadar büyük olursa olsun, o;"], [2350.2, "hâllerinin tedbirinde, işlerinin çekilip çevrilmesinde, yemesinde, içmesinde, kalkmasında ve oturmasında zatı itibarıyla Allah Teâlâ'ya muhtaç, rubûbiyyete tâbi (merbûb), yaratılmış, zayıf bir kul olarak kalır."], [2364.0, "Göz açıp kapayıncaya kadar bile Allah Teâlâ'dan müstağni değildir."]]}, {"reader": false, "ar": [[2370.0, "فكما أن الله عز وجل هو الغنيّ بألوهيته وربوبيته غِنى ذاتٍ عن خلقه،"], [2377.0, "كذلك المخلوقات هي الفقيرة الفقرَ الذاتيَّ ـ بضعفها وعجزها ـ إلى الله عز وجل في كلّ أحوالها ولحظاتها وسكناتها."], [2387.0, "فمسكينٌ هذا الرجل الذي يُضفي على شيءٍ من المخلوقات شيئًا من خصائص الربوبية أو الألوهية بحجّة أنها مخلوقٌ عظيم،"], [2398.2, "أو لها منزلةٌ عند الله عز وجل."], [2402.2, "وكلُّ هذا من أبطل الباطل وأعظم البهتان."]], "tr": [[2370.0, "Allah Teâlâ ulûhiyyeti ve rubûbiyyetiyle mahlûklarından zatî bir istiğna ile müstağni olduğu gibi, mahlûklar da zayıflıkları ve acizlikleri sebebiyle bütün hâllerinde, anlarında ve durgunluklarında Allah Teâlâ'ya zatî bir fakirlikle muhtaçtır."], [2386.4, "Mahlûklardan birine, büyük bir mahlûk olduğu ya da Allah Teâlâ katında bir menzilesi olduğu gerekçesiyle rubûbiyyetin ya da ulûhiyyetin hususiyetlerinden bir şey yükleyen adam zavallıdır."], [2401.1, "Bunların hepsi bâtılların en bâtılı ve iftiraların en büyüğüdür."]]}, {"reader": false, "ar": [[2406.0, "فلا الملائكة يملكون شيئًا من ذلك،"], [2410.0, "ولا الأنبياء يملكون شيئًا من ذلك،"], [2413.0, "ولا الرسل يملكون شيئًا من ذلك،"], [2416.0, "ولا الشمس والقمر والأفلاك والنجوم والأشجار والأحجار والأولياء والصالحون يملكون شيئًا من ذلك."], [2426.0, "فمقتضيات الربوبية لا يملكها إلا واحدٌ أحد،"], [2429.4, "فردٌ صمد، <span class=\"ayah\">﴿لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٣-٤]<\/span>،"], [2434.6, "وهو الله تبارك وتعالى، لا شريك له."]], "tr": [[2406.0, "Ne melekler bundan bir şeye maliktir, ne peygamberler bundan bir şeye maliktir, ne resuller bundan bir şeye maliktir;"], [2415.0, "ne güneş, ay, felekler, yıldızlar, ağaçlar, taşlar, veliler ve salihler bundan bir şeye maliktir."], [2422.8, "Rubûbiyyetin gereklerine ancak bir, tek, yegâne ve samed olan;"], [2428.4, "<span class=\"ayah\">﴿doğurmamış ve doğurulmamış olan; hiçbir şey O'na denk olmayan﴾<\/span> [İhlâs 3-4] Zât malik olur;"], [2434.2, "O da ortağı olmayan Allah Tebâreke ve Teâlâ'dır."]]}]}, {"ts": "40:38", "title": "7. Külliye: Allah'tan başka her şey O'nun mahlûkudur", "paras": [{"reader": false, "ar": [[2438.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما سوى الله فمخلوقٌ لله.<\/b> هذا توحيد الخالقيّة."], [2451.7, "كلُّ ما سوى الله… مدري كم رقمها عندكم… <b>كلُّ ما سوى الله فمخلوقٌ لله.<\/b>"]], "tr": [[2438.0, "Külliyelerden biri de şudur: 7."], [2440.8, "külliye: Allah'tan başka her şey Allah'ın mahlûkudur. Bu, hâlıkıyyet (yaratıcılık) tevhididir."], [2452.3, "Allah'tan başka her şey… Sizde numarası kaçtır bilmiyorum… <b>Allah'tan başka her şey Allah'ın mahlûkudur.<\/b>"]]}, {"reader": false, "ar": [[2464.0, "أقول وبالله التوفيق: وهذا ما ندين الله عز وجل به،"], [2469.3, "من أنه خالقُ كلّ شيءٍ من ذرّات هذا الكون."], [2474.0, "فكلُّ ما سواه ـ ذاتًا وصفاتٍ ـ فإنه مخلوق،"], [2478.8, "من العرش فما دونه:"], [2484.0, "فالعرش مخلوق، وحملته مخلوقون،"], [2487.0, "وملائكة السماء والأرض مخلوقون،"], [2490.8, "والسماوات السبع والأرضون السبع كلّها مخلوقة،"], [2496.3, "وما فيها من أصناف المخلوقات وأنواع الكائنات ـ صغيرها وكبيرها ـ كلّها توصف بأنها مخلوقة."]], "tr": [[2464.0, "Tevfik Allah'tandır, derim ki: Allah Teâlâ'ya karşı din edindiğimiz (inandığımız) şudur:"], [2468.7, "O, bu kâinatın zerrelerinden her şeyin yaratıcısıdır."], [2471.9, "O'ndan başka her şey — zatıyla da sıfatlarıyla da — mahlûktur;"], [2478.1, "Arş'tan itibaren ondan aşağıdaki her şey."], [2484.0, "Arş mahlûktur, onu taşıyanlar mahlûktur, göğün ve yerin melekleri mahlûktur, yedi gök ve yedi yer mahlûktur;"], [2496.3, "bunlardaki mahlûk çeşitleri ve varlık türleri de — küçüğüyle büyüğüyle — hepsi mahlûk olmakla nitelenir."]]}, {"reader": false, "ar": [[2507.0, "وقد اختصر الله عز وجل هذه العقيدة بقوله:"], [2512.5, "<span class=\"ayah\">﴿اللَّهُ خَالِقُ كُلِّ شَيْءٍ﴾<\/span> <span class=\"ref\">[الزمر: ٦٢]<\/span>."], [2516.0, "وقال الله عز وجل:"], [2518.2, "<span class=\"ayah\">﴿هَلْ مِنْ خَالِقٍ غَيْرُ اللَّهِ يَرْزُقُكُم مِّنَ السَّمَاءِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[فاطر: ٣]<\/span> <span class=\"note\">(Şeyh «من السماوات» diyor)<\/span>."], [2523.0, "وقال الله عز وجل:"], [2525.8, "<span class=\"ayah\">﴿ذَٰلِكُمُ اللَّهُ رَبُّكُمْ خَالِقُ كُلِّ شَيْءٍ﴾<\/span> <span class=\"ref\">[غافر: ٦٢]<\/span>."], [2532.0, "فكلُّ ما سوى الله عز وجل مخلوقٌ له."]], "tr": [[2507.0, "Allah Teâlâ bu akîdeyi şu sözüyle özetlemiştir:"], [2511.1, "<span class=\"ayah\">﴿Allah her şeyin yaratıcısıdır﴾<\/span> [Zümer 62]."], [2514.5, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Sizi gökten ve yerden rızıklandıran Allah'tan başka bir yaratıcı var mı?﴾<\/span> [Fâtır 3]."], [2523.0, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿İşte Rabbiniz, her şeyin yaratıcısı Allah budur﴾<\/span> [Gâfir 62]."], [2532.4, "Allah Teâlâ'dan başka her şey O'nun mahlûkudur."]]}, {"reader": false, "ar": [[2535.0, "فإن قلت: وكيف تقول ذلك،"], [2538.3, "ونحن نجد أن الله يصف بعض المخلوقات بأنها تخلق؟"], [2545.0, "كقول الله عز وجل:"], [2548.0, "<span class=\"ayah\">﴿وَتَخْلُقُونَ إِفْكًا﴾<\/span>، <span class=\"ayah\">﴿إِنَّمَا تَعْبُدُونَ مِن دُونِ اللَّهِ أَوْثَانًا وَتَخْلُقُونَ إِفْكًا﴾<\/span> <span class=\"ref\">[العنكبوت: ١٧]<\/span>؛"], [2559.0, "فوصفهم بأنهم يخلقون هذا الإفك."], [2561.0, "وقال الله عز وجل:"], [2563.0, "<span class=\"ayah\">﴿ثُمَّ أَنشَأْنَاهُ خَلْقًا آخَرَ ۚ فَتَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ﴾<\/span> <span class=\"ref\">[المؤمنون: ١٤]<\/span>؛"], [2572.0, "فأثبت خالقين غيره. فكيف نوحّد الله عز وجل بصفة الخالقيّة،"], [2579.0, "مع أن الله يصف بعض المخلوقات بأنها تخلق؟"]], "tr": [[2535.0, "\"Allah'ın bazı mahlûkları yaratmakla nitelediğini görürken bunu nasıl söylersin?\" dersen — Allah Teâlâ'nın <span class=\"ayah\">﴿ve bir yalan uyduruyorsunuz (yaratıyorsunuz)﴾<\/span>, <span class=\"ayah\">﴿Siz Allah'ı bırakıp ancak birtakım putlara tapıyor ve bir yalan uyduruyorsunuz﴾<\/span> [Ankebût 17] sözü gibi;"], [2557.1, "onları bu yalanı \"yaratmakla\" niteledi."], [2560.2, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Sonra onu başka bir yaratılışta inşa ettik. Yaratanların en güzeli olan Allah ne yücedir!﴾<\/span> [Mü'minûn 14];"], [2573.9, "böylece kendisinden başka yaratanlar isbat etti."], [2577.3, "Allah bazı mahlûkları yaratmakla nitelediği hâlde, Allah Teâlâ'yı yaratıcılık sıfatında nasıl tevhid ederiz?"]]}, {"reader": false, "ar": [[2584.0, "الجواب: اعلم ـ رحمك الله تعالى ـ أن الخلق ينقسم إلى قسمين:"], [2590.0, "خلقِ إيجادٍ عن عدم،"], [2593.1, "وخلقِ تصوير. فالخالقيّة التي يختصّ الله عز وجل بها إنما هي الخالقيّة عن عدم،"], [2607.0, "بأن يكون الشيء معدومًا لا وجود له البتّة،"], [2612.4, "ثم يوجده الله تبارك وتعالى."], [2616.0, "فالخالقيّة بهذا الاعتبار وهذا المعنى من خصائص الله عز وجل،"], [2622.6, "لا يشركه أحدٌ من خلقه فيها،"], [2628.0, "لا ملكٌ مقرّب، ولا نبيٌّ مرسل، ولا وليٌّ صالح."]], "tr": [[2584.0, "Cevap: Bil — Allah sana rahmet etsin — yaratma iki kısma ayrılır:"], [2590.0, "Yokluktan var etme şeklinde yaratma ve tasvir (şekil verme) şeklinde yaratma."], [2601.0, "Allah Teâlâ'nın kendisine has kıldığı yaratıcılık, yokluktan yaratmadır:"], [2605.7, "Bir şeyin hiçbir şekilde varlığı olmayan bir yok iken, sonra Allah Tebâreke ve Teâlâ'nın onu var etmesidir."], [2615.1, "Bu itibarla ve bu anlamda yaratıcılık Allah Teâlâ'nın hususiyetlerindendir;"], [2620.6, "mahlûklarından hiçbiri — ne mukarreb bir melek, ne gönderilmiş bir peygamber, ne de salih bir veli — bunda O'na ortak olamaz."]]}, {"reader": false, "ar": [[2632.0, "وأما الخالقيّة الثانية فهي نقلُ شيءٍ من صورةٍ إلى صورة،"], [2640.0, "وهذه قد مُكِّن منها المخلوق."], [2645.0, "لكنّ أحسنَ من ينقل الشيء من صورةٍ إلى صورةٍ هو الله عز وجل،"], [2651.5, "فهو أحسن الخالقين، أي المصوِّرين؛"], [2654.0, "بدليل أنّ الله عز وجل ذكر مراحل خلق الجنين في رحم أمّه،"], [2662.0, "ينقله من طبقٍ إلى طبق،"], [2664.8, "ومن طورٍ إلى طور،"], [2667.0, "ثم يُخرجه في صورةٍ نهائيةٍ على أبدع صورة،"], [2671.4, "مُدحت في قوله: <span class=\"ayah\">﴿لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ﴾<\/span> <span class=\"ref\">[التين: ٤]<\/span>."], [2678.0, "وقال الله عز وجل:"], [2680.3, "<span class=\"ayah\">﴿فِي أَيِّ صُورَةٍ مَّا شَاءَ رَكَّبَكَ﴾<\/span> <span class=\"ref\">[الانفطار: ٨]<\/span>."]], "tr": [[2632.0, "İkinci yaratıcılık ise bir şeyi bir sûretten başka bir sûrete nakletmektir;"], [2638.3, "buna mahlûka da imkân verilmiştir."], [2643.2, "Fakat bir şeyi bir sûretten başka bir sûrete en güzel nakleden Allah Teâlâ'dır;"], [2650.0, "O yaratanların, yani şekil verenlerin en güzelidir."], [2653.5, "Bunun delili şudur: Allah Teâlâ, annesinin rahmindeki ceninin yaratılış merhalelerini zikretmiştir;"], [2659.3, "onu bir tabakadan bir tabakaya, bir evreden bir evreye nakleder, sonra onu en harikulade şekilde nihai bir sûrette çıkarır."], [2669.2, "Bu sûret şu sözünde övülmüştür:"], [2671.9, "<span class=\"ayah\">﴿Andolsun, biz insanı en güzel biçimde yarattık﴾<\/span> [Tîn 4]."], [2678.0, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Seni dilediği bir sûrette terkip etti﴾<\/span> [İnfitâr 8]."]]}, {"reader": false, "ar": [[2685.0, "والخلق بمعنى التصوير هو المقصود في قول الله عز وجل:"], [2693.0, "<span class=\"ayah\">﴿وَتَخْلُقُونَ إِفْكًا﴾<\/span>، أي تُصوّرون آلهةً تعبدونها من دون الله عز وجل."]], "tr": [[2685.0, "Allah Teâlâ'nın <span class=\"ayah\">﴿ve bir yalan yaratıyorsunuz﴾<\/span> sözünde kastedilen, tasvir anlamındaki yaratmadır;"], [2693.6, "yani Allah Teâlâ'yı bırakıp ibadet ettiğiniz ilahlara şekil veriyorsunuz."]]}]}, {"ts": "45:00", "title": "7. Külliye (devam): Yokluktan yaratma ile tasvir arasındaki fark", "paras": [{"reader": false, "ar": [[2700.0, "فالحجارة كانت موجودة، لكن صوّروها إلى وثن،"], [2703.8, "أو صوّروها إلى صنم،"], [2706.0, "أو صوّروها إلى شيءٍ آخر."], [2708.0, "فهم لم يخلقوا بمعنى يُوجِدوا،"], [2713.0, "وإنما خلقوا بمعنى صوّروا،"], [2716.0, "أي نقلوا الشيء من صورةٍ قديمةٍ إلى صورةٍ جديدة."], [2722.0, "وهو المقصود بقول النبي صلى الله عليه وسلم في الحديث القدسي أن الله عز وجل قال:"], [2730.0, "«ومَن أظلمُ ممّن ذهب يخلق كخلقي» <span class=\"note\">(Buhârî, Müslim)<\/span>، أي يُصوِّر كتصويري."]], "tr": [[2700.0, "Taşlar zaten mevcuttu; fakat onlara bir vesen (heykel) şekli verdiler, ya da bir sanem (put) şekli verdiler, ya da başka bir şeyin şeklini verdiler."], [2709.6, "Onlar \"var etmek\" anlamında yaratmadılar;"], [2713.8, "ancak \"şekil vermek\" anlamında yarattılar, yani bir şeyi eski bir sûretten yeni bir sûrete naklettiler."], [2722.0, "Nebî ﷺ'in kudsî hadiste Allah Teâlâ'nın şöyle buyurduğunu haber vermesinde kastedilen de budur:"], [2727.5, "«Benim yarattığım gibi yaratmaya kalkışandan daha zalim kim vardır?» <span class=\"note\">(Buhârî, Müslim)<\/span>;"], [2731.5, "yani benim şekil verişim gibi şekil vermeye kalkışan."]]}, {"reader": false, "ar": [[2738.0, "فالخلق المراد في الكلّيّة التي معنا إنما هو خلقُ الإيجاد عن عدم،"], [2747.0, "لا خلقُ التصوير والنقل؛"], [2750.0, "فلا إشكال في ذلك إن شاء الله."], [2754.0, "فكلُّ من زعم في مخلوقٍ أنه يخلق الشيء عن عدم،"], [2762.0, "فقد وصفه بشيءٍ من مقتضيات ربوبية الله عز وجل،"], [2767.0, "فيكون مشركًا في ربوبيته،"], [2769.0, "نعوذ بالله من ذلك."]], "tr": [[2738.0, "Elimizdeki külliyede kastedilen yaratma, ancak yokluktan var etme şeklindeki yaratmadır;"], [2745.5, "tasvir ve nakil şeklindeki yaratma değildir."], [2749.2, "Dolayısıyla bunda, inşallah, bir müşkil yoktur."], [2752.1, "Bir mahlûk hakkında onun bir şeyi yokluktan yarattığını iddia eden herkes, onu Allah Teâ
