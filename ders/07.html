lâ'nın rubûbiyyetinin gereklerinden bir şeyle nitelemiş olur ve böylece O'nun rubûbiyyetinde müşrik olur. Bundan Allah'a sığınırız."]]}]}, {"ts": "46:12", "title": "8. Külliye: Rubûbiyyetin gereklerinde başkasını Allah'a eşit tutan rubûbiyyette müşriktir", "paras": [{"reader": false, "ar": [[2772.0, "ومن الكلّيّات أيضًا: <b>كلُّ من سوّى غيرَ الله بالله في شيءٍ من مقتضيات ربوبيته ـ التسويةَ المطلقة ـ فمشركٌ في الربوبية.<\/b> أقول وبالله التوفيق:"], [2799.2, "وهذا حقيقة الشرك في الربوبية."], [2806.0, "فإذا قيل لك: ما معنى شرك الربوبية؟"], [2810.5, "فالجواب أن تقول: أن يُسوّي العبدُ غيرَ الله بالله في شيءٍ من مقتضيات ربوبيته،"], [2820.0, "أو في شيءٍ من مقتضيات أسمائه وصفاته التي تخصّه عز وجل."]], "tr": [[2772.0, "Külliyelerden biri de şudur: 8."], [2777.7, "külliye: Allah'ın rubûbiyyetinin gereklerinden birinde Allah'tan başkasını Allah'a — mutlak bir eşitlemeyle — eşit tutan herkes rubûbiyyette müşriktir. Tevfik Allah'tandır, derim ki:"], [2800.6, "Rubûbiyyette şirkin hakikati budur. Sana \"Rubûbiyyet şirkinin anlamı nedir?\" denirse cevap olarak şöyle dersin:"], [2812.5, "Kulun, Allah'ın rubûbiyyetinin gereklerinden bir şeyde ya da Allah Teâlâ'ya has olan isim ve sıfatlarının gereklerinden bir şeyde Allah'tan başkasını Allah'a eşit tutmasıdır."]]}, {"reader": false, "ar": [[2828.0, "فكلُّ من اعتقد في مخلوقٍ أنه مشاركٌ لله في الملك فمشركٌ شركَ ربوبية،"], [2837.0, "أو أنه مشاركٌ لله في شيءٍ من خلق الإيجاد فمشركٌ شركَ ربوبية،"], [2845.0, "أو أنه مشاركٌ لله عز وجل في التدبير أو التصريف الاستقلاليّ الابتدائيّ فمشركٌ شركَ ربوبية،"], [2856.0, "أو أنه مشاركٌ لله عز وجل في النفع والضرّ الاستقلاليّ الابتدائيّ فمشركٌ شركَ ربوبية،"], [2868.0, "أو أنه ينفع نفعًا استقلاليًّا ابتدائيًّا فمشركٌ شركَ ربوبية،"], [2875.0, "أو أنه يضرّ ضررًا استقلاليًّا ابتدائيًّا فإنه مشركٌ شركَ ربوبية."]], "tr": [[2828.0, "Bir mahlûk hakkında onun mülkte Allah'a ortak olduğuna inanan herkes rubûbiyyet şirkiyle müşriktir;"], [2834.8, "ya da onun yokluktan var etme şeklindeki yaratmadan bir şeyde Allah'a ortak olduğuna inanan rubûbiyyet şirkiyle müşriktir;"], [2842.9, "ya da onun müstakil ve ilk elden tedbir veya tasarrufta Allah Teâlâ'ya ortak olduğuna inanan rubûbiyyet şirkiyle müşriktir;"], [2852.9, "ya da onun müstakil ve ilk elden fayda ve zararda Allah Teâlâ'ya ortak olduğuna inanan rubûbiyyet şirkiyle müşriktir;"], [2864.9, "ya da onun müstakil ve ilk elden fayda verdiğine inanan rubûbiyyet şirkiyle müşriktir;"], [2874.3, "ya da onun müstakil ve ilk elden zarar verdiğine inanan rubûbiyyet şirkiyle müşriktir."]]}, {"reader": false, "ar": [[2884.0, "أو أنه يُحيي عن موت،"], [2887.6, "أو يُميت عن حياة،"], [2890.7, "فمشركٌ شركَ ربوبية؛ أو أنه يُعطي أو يرزق عطاءً أو رزقًا ابتداءً واستقلالًا،"], [2906.0, "فإنه مشركٌ شركَ ربوبية."], [2909.0, "فكلُّ من جعل غيرَ الله مساويًا لله في شيءٍ من مقتضيات ربوبية الله،"], [2918.0, "فإنه يُعتبر مشركًا شركًا أكبر."]], "tr": [[2884.0, "Ya da onun ölümden sonra dirilttiğine ya da hayattan sonra öldürdüğüne inanan rubûbiyyet şirkiyle müşriktir;"], [2895.7, "ya da onun ilk elden ve müstakil olarak bir ihsan ya da rızık verdiğine inanan rubûbiyyet şirkiyle müşriktir."], [2911.7, "Allah'ın rubûbiyyetinin gereklerinden bir şeyde Allah'tan başkasını Allah'a eşit kılan herkes, büyük şirkle müşrik sayılır."]]}, {"reader": false, "ar": [[2921.0, "وعلى ذلك يُخرَّج تكفيرُ من زعم أنّ أحدًا يعلم شيئًا من مقتضيات الغيب المطلق؛"], [2931.0, "لأنّ علم الغيب المطلق من خصائص ربوبية الله عز وجل،"], [2937.0, "فإذا سوّى العبدُ غيرَ الله بالله في علم الغيب فإنه يكون مشركًا مع الله عز وجل في ربوبيته."], [2950.0, "فإن قلت: ولماذا قيّدتَ ذلك بقولك:"], [2954.3, "«ابتدائيّ استقلاليّ»؟ فأقول: حتى يخرج السببيّ الذي شرحتُه في الكلّيّة الماضية."]], "tr": [[2921.0, "Birinin mutlak gaybın gereklerinden bir şeyi bildiğini iddia edenin tekfiri de buna dayanır;"], [2930.5, "çünkü mutlak gaybı bilmek Allah Teâlâ'nın rubûbiyyetinin hususiyetlerindendir."], [2935.8, "Kul gaybı bilmekte Allah'tan başkasını Allah'a eşit tutarsa, Allah Teâlâ'nın rubûbiyyetinde O'na şirk koşmuş olur."], [2945.6, "\"Bunu neden 'ilk elden, müstakil' sözüyle kayıtladın?\" dersen, derim ki:"], [2955.1, "Geçen külliyede açıkladığım sebep olarak (nispet) dışarıda kalsın diye."]]}]}, {"ts": "49:27", "title": "9. Külliye: Bütün mahlûklar rubûbiyyeti ikrar fıtratı üzere yaratılmıştır", "paras": [{"reader": false, "ar": [[2967.0, "ومن الكلّيّات أيضًا: كلُّ الخلق مفطورون على الإقرار بالربوبية،"], [2980.0, "إلا من جحدها ظلمًا وعنادًا ـ أو ظلمًا وعلوًّا ـ."], [2986.5, "<span class=\"note\">(يكررها)<\/span> كلُّ الخلق مفطورون على الإقرار بالربوبية،"], [2994.9, "إلا من جحدها ظلمًا وعلوًّا وعنادًا."]], "tr": [[2967.0, "Külliyelerden biri de şudur: 9."], [2969.1, "külliye: Bütün mahlûklar rubûbiyyeti ikrar etme fıtratı üzere yaratılmıştır;"], [2972.7, "ancak onu zulüm ve inatla<b> — ya da zulüm ve büyüklenmeyle — <\/b>inkâr eden müstesnadır.<b> (Tekrar eder:) <\/b>Bütün mahlûklar rubûbiyyeti ikrar etme fıtratı üzere yaratılmıştır;"], [2994.9, "ancak onu zulüm, büyüklenme ve inatla inkâr eden müstesnadır."]]}, {"reader": false, "ar": [[3006.0, "أقول وبالله التوفيق: وهذا ما نصّ عليه كتاب الله عز وجل في آياتٍ كثيرة."], [3017.3, "يقول الله عز وجل:"], [3019.0, "<span class=\"ayah\">﴿وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ لَيَقُولُنَّ اللَّهُ﴾<\/span> <span class=\"ref\">[العنكبوت: ٦١]<\/span>؛"], [3025.0, "فأقرّوا بصفة الخالقيّة، وأنّ الله متوحّدٌ بخلق السماوات والأرض."], [3032.0, "وقال الله عز وجل:"], [3035.0, "<span class=\"ayah\">﴿وَلَئِن سَأَلْتَهُم مَّن نَّزَّلَ مِنَ السَّمَاءِ مَاءً فَأَحْيَا بِهِ الْأَرْضَ مِن بَعْدِ مَوْتِهَا لَيَقُولُنَّ اللَّهُ﴾<\/span> <span class=\"ref\">[العنكبوت: ٦٣]<\/span>."], [3046.0, "وقال الله عز وجل:"], [3047.0, "<span class=\"ayah\">﴿وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ ۚ قُلِ الْحَمْدُ لِلَّهِ ۚ بَلْ أَكْثَرُهُمْ لَا يَعْلَمُونَ﴾<\/span> <span class=\"ref\">[لقمان: ٢٥]<\/span>."]], "tr": [[3006.0, "Tevfik Allah'tandır, derim ki: Allah Teâlâ'nın Kitabı birçok ayette bunu açıkça bildirmiştir."], [3015.0, "Allah Teâlâ buyurur: <span class=\"ayah\">﴿Andolsun, onlara gökleri ve yeri kim yarattı, güneşi ve ayı kim boyun eğdirdi diye sorsan, elbette \"Allah\" derler﴾<\/span> [Ankebût 61];"], [3024.5, "böylece yaratıcılık sıfatını ve göklerin ve yerin yaratılmasında Allah'ın tek olduğunu ikrar ettiler."], [3032.0, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Andolsun, onlara gökten su indirip onunla yeri ölümünden sonra dirilten kimdir diye sorsan, elbette \"Allah\" derler﴾<\/span> [Ankebût 63]."], [3043.7, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Andolsun, onlara gökleri ve yeri kim yarattı diye sorsan, elbette \"Allah\" derler. De ki: Hamd Allah'a mahsustur. Fakat onların çoğu bilmezler﴾<\/span> [Lokmân 25]."]]}, {"reader": false, "ar": [[3055.0, "وقال الله عز وجل:"], [3057.0, "<span class=\"ayah\">﴿قُل لِّمَنِ الْأَرْضُ وَمَن فِيهَا إِن كُنتُمْ تَعْلَمُونَ ۝ سَيَقُولُونَ لِلَّهِ ۚ قُلْ أَفَلَا تَذَكَّرُونَ ۝ قُلْ مَن رَّبُّ السَّمَاوَاتِ السَّبْعِ وَرَبُّ الْعَرْشِ الْعَظِيمِ ۝ سَيَقُولُونَ لِلَّهِ ۚ قُلْ أَفَلَا تَتَّقُونَ ۝ قُلْ مَن بِيَدِهِ مَلَكُوتُ كُلِّ شَيْءٍ وَهُوَ يُجِيرُ وَلَا يُجَارُ عَلَيْهِ إِن كُنتُمْ تَعْلَمُونَ ۝ سَيَقُولُونَ لِلَّهِ ۚ قُلْ فَأَنَّىٰ تُسْحَرُونَ﴾<\/span> <span class=\"ref\">[المؤمنون: ٨٤-٨٩]<\/span>."], [3085.0, "والآيات في هذا المعنى متعدّدة."]], "tr": [[3055.0, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿De ki: Eğer biliyorsanız (söyleyin), yer ve içindekiler kimindir? \"Allah'ındır\" diyecekler. De ki: Öyleyse düşünüp ibret almaz mısınız? De ki: Yedi göğün Rabbi ve büyük Arş'ın Rabbi kimdir? \"Allah'tır\" diyecekler. De ki: Öyleyse sakınmaz mısınız? De ki: Eğer biliyorsanız (söyleyin), her şeyin melekûtu elinde olan, koruyan ama kendisine karşı korunulamayan kimdir? \"Allah'tır\" diyecekler. De ki: Öyleyse nasıl olup da büyüleniyorsunuz?﴾<\/span> [Mü'minûn 84-89]. Bu anlamdaki ayetler çoktur."]]}, {"reader": false, "ar": [[3088.0, "فإن قلت: وكيف تزعم أن الخلق مفطورون ـ عن بَكرة أبيهم ـ على الإقرار بالربوبية،"], [3099.7, "مع أننا نجد في القرآن نفسه أناسًا أنكروه وعطّلوه؟"], [3108.0, "كفرعون لمّا قال: <span class=\"ayah\">﴿مَا عَلِمْتُ لَكُم مِّنْ إِلَٰهٍ غَيْرِي﴾<\/span> <span class=\"ref\">[القصص: ٣٨]<\/span>،"], [3113.0, "وقال الله عنه: <span class=\"ayah\">﴿أَنَا رَبُّكُمُ الْأَعْلَىٰ﴾<\/span> <span class=\"ref\">[النازعات: ٢٤]<\/span>."], [3119.0, "وقال الله عز وجل عن <span class=\"ayah\">﴿الَّذِي حَاجَّ إِبْرَاهِيمَ فِي رَبِّهِ أَنْ آتَاهُ اللَّهُ الْمُلْكَ إِذْ قَالَ إِبْرَاهِيمُ رَبِّيَ الَّذِي يُحْيِي وَيُمِيتُ﴾<\/span> ـ أي ربوبية ـ <span class=\"ayah\">﴿قَالَ أَنَا أُحْيِي وَأُمِيتُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٨]<\/span>؛ فأنكر الربوبية وعطّلها."]], "tr": [[3088.0, "\"Kur'an'ın kendisinde onu inkâr eden ve ta'til eden insanlar bulduğumuz hâlde, nasıl olur da mahlûkların — istisnasız hepsinin — rubûbiyyeti ikrar fıtratı üzere yaratıldığını iddia edersin?\" dersen — Firavun gibi;"], [3103.9, "o <span class=\"ayah\">﴿Sizin için benden başka bir ilah bilmiyorum﴾<\/span> [Kasas 38] demişti;"], [3110.8, "Allah da onun hakkında <span class=\"ayah\">﴿Ben sizin en yüce rabbinizim﴾<\/span> [Nâziât 24] (dediğini) bildirdi."], [3116.8, "Allah Teâlâ, <span class=\"ayah\">﴿Allah kendisine mülk verdi diye Rabbi hakkında İbrâhîm ile tartışan kişi; hani İbrâhîm \"Benim Rabbim diriltir ve öldürür\" demişti﴾<\/span> — yani rubûbiyyet — <span class=\"ayah\">﴿o da \"Ben de diriltir ve öldürürüm\" demişti﴾<\/span> [Bakara 258] (ayetinde onu) anlattı;"], [3135.4, "o rubûbiyyeti inkâr etti ve ta'til etti."]]}, {"reader": false, "ar": [[3142.0, "بل إنّ الله عز وجل قال عن الدهرية:"], [3146.0, "<span class=\"ayah\">﴿وَقَالُوا مَا هِيَ إِلَّا حَيَاتُنَا الدُّنْيَا نَمُوتُ وَنَحْيَا وَمَا يُهْلِكُنَا إِلَّا الدَّهْرُ﴾<\/span> <span class=\"ref\">[الجاثية: ٢٤]<\/span>؛"], [3155.0, "فنسبوا الإحياء والإماتة والتدبير والتصريف إلى الدهر."], [3160.0, "فكيف تقول بأن الخلق مفطورون على الربوبية،"], [3167.0, "والقرآن يذكر طائفةً قد أنكروه؟"]], "tr": [[3142.0, "Hatta Allah Teâlâ Dehriyye hakkında şöyle buyurmuştur:"], [3144.5, "<span class=\"ayah\">﴿Dediler ki: Hayat ancak bu dünya hayatımızdır; ölürüz ve yaşarız; bizi ancak zaman (dehr) helak eder﴾<\/span> [Câsiye 24]."], [3154.2, "Böylece diriltmeyi, öldürmeyi, tedbiri ve tasarrufu zamana nispet ettiler."], [3159.3, "Kur'an onu inkâr etmiş bir grubu anlatırken, sen nasıl mahlûkların rubûbiyyet (ikrarı) fıtratı üzere yaratıldığını söylersin?"]]}, {"reader": false, "ar": [[3171.0, "الجواب من عدّة أوجه:"], [3176.0, "الوجه الأول: أنّ الإقرار ينقسم إلى قسمين:"], [3180.7, "إلى إقرارٍ فطريٍّ باطني،"], [3183.3, "وإلى إقرارٍ ظاهريٍّ علني."], [3190.0, "فكلّيّتنا لا تعني الإقرار الثاني،"], [3193.5, "وإنما هي في الإقرار الأول."], [3198.0, "فحتى هؤلاء الذين كابروا ما تقرّر في فطرتهم،"], [3203.3, "لو رجعوا إلى فطرتهم لوجدوها مُقرّةً بذلك."]], "tr": [[3171.0, "Cevap birkaç yönden verilir. Birinci yön:"], [3176.7, "İkrar iki kısma ayrılır: Fıtrî ve bâtınî (iç) ikrar ile zahirî ve alenî ikrar."], [3190.0, "Bizim külliyemiz ikinci ikrarı kastetmez;"], [3193.5, "ancak birinci ikrar hakkındadır. Fıtratlarında yerleşik olana karşı büyüklenen bu kimseler bile, fıtratlarına dönseler onu bunu ikrar eder hâlde bulurlardı."]]}, {"reader": false, "ar": [[3215.0, "فإنكار فرعون إنما هو إنكارٌ للربوبية في الظاهر،"], [3220.0, "بدليل قول الله عز وجل:"], [3222.8, "<span class=\"ayah\">﴿وَجَحَدُوا بِهَا﴾<\/span> ـ أي ظاهرًا ـ <span class=\"ayah\">﴿وَاسْتَيْقَنَتْهَا أَنفُسُهُمْ﴾<\/span> ـ أي باطنًا ـ،"], [3230.0, "والسبب في ذلك: <span class=\"ayah\">﴿ظُلْمًا وَعُلُوًّا﴾<\/span> <span class=\"ref\">[النمل: ١٤]<\/span>."], [3233.0, "والدهرية يُقرّون بأنّ الله عز وجل ـ حقيقةً في قلوبهم ـ هو الذي يُحييهم ويُميتهم،"], [3243.3, "ولكن ظاهرًا أنكروه. فإذا قلنا بأنّ الخلق مفطورون على الإقرار بمقتضيات الربوبية،"], [3251.0, "فنعني به الإقرار الفطريّ القلبيّ الباطني،"], [3255.0, "وإن جُوحِد ظلمًا وعلوًّا في الظاهر."]], "tr": [[3215.0, "Firavun'un inkârı ancak zahirde rubûbiyyeti inkârdır."], [3217.5, "Delili Allah Teâlâ'nın şu sözüdür:"], [3220.6, "<span class=\"ayah\">﴿Onları inkâr ettiler﴾<\/span> — yani zahiren — <span class=\"ayah\">﴿kalpleri onlara kesin olarak inandığı hâlde﴾<\/span> — yani bâtınen —;"], [3230.6, "bunun sebebi de: <span class=\"ayah\">﴿zulüm ve büyüklenme yüzünden﴾<\/span> [Neml 14]."], [3235.7, "Dehriyye de gerçekte kalplerinde, kendilerini diriltenin ve öldürenin Allah Teâlâ olduğunu ikrar ederler;"], [3244.0, "fakat zahiren onu inkâr ettiler."], [3247.7, "Mahlûkların rubûbiyyetin gereklerini ikrar fıtratı üzere yaratıldığını söylediğimizde, bununla fıtrî, kalbî ve bâtınî ikrarı kastediyoruz;"], [3255.0, "zahirde zulüm ve büyüklenmeyle inkâr edilse bile."]]}, {"reader": false, "ar": [[3260.0, "ولذلك لمّا أراد فرعون أن يُكذّب موسى في وجود الله قال:"], [3265.8, "<span class=\"ayah\">﴿يَا هَامَانُ ابْنِ لِي صَرْحًا﴾<\/span> <span class=\"ref\">[غافر: ٣٦]<\/span>."], [3270.0, "ولماذا لم يقل: يا هامان،"], [3273.5, "خذ معك طائفةً من الجيش،"], [3278.0, "واذهب يمينًا وشمالًا، واضرب مشارق الأرض ومغاربها بحثًا عن الله؟"], [3283.0, "ولماذا لم يقل: يا هامان،"], [3286.0, "احفر لي في الأرض حتى نبحث عن الله؟"], [3288.2, "لِمَ خصّ جهةَ العلوّ بالبحث؟"], [3291.0, "لاستقرارِ أنّ الله عز وجل في السماء."]], "tr": [[3260.0, "Bu yüzden Firavun, Allah'ın varlığı konusunda Mûsâ'yı yalanlamak istediğinde şöyle dedi:"], [3265.0, "<span class=\"ayah\">﴿Ey Hâmân! Bana yüksek bir kule yap﴾<\/span> [Gâfir 36]."], [3272.1, "Neden \"Ey Hâmân, yanına ordudan bir birlik al, sağa sola git, Allah'ı aramak için yerin doğularını ve batılarını dolaş\" demedi?"], [3284.2, "Neden \"Ey Hâmân, Allah'ı arayalım diye bana yeri kaz\" demedi?"], [3287.8, "Neden aramayı yukarı yönüne tahsis etti?"], [3291.0, "Çünkü Allah Teâlâ'nın gökte olduğu (fıtratında) yerleşikti."]]}]}, {"ts": "55:01", "title": "9. Külliye (devam): Bâtınî ve zahirî ikrar; ikinci cevap: asıl fıtrat ve sonradan bozulma", "paras": [{"reader": false, "ar": [[3299.0, "كما قال الله عز وجل عن موسى لمّا أراه الآيات التسع:"], [3303.0, "<span class=\"ayah\">﴿لَقَدْ عَلِمْتَ﴾<\/span> ـ أي يا فرعون ـ <span class=\"ayah\">﴿مَا أَنزَلَ هَٰؤُلَاءِ﴾<\/span> ـ أي الآيات ـ <span class=\"ayah\">﴿إِلَّا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ بَصَائِرَ﴾<\/span> <span class=\"ref\">[الإسراء: ١٠٢]<\/span>."], [3314.0, "علمتَ باطنًا أو ظاهرًا؟"], [3316.6, "باطنًا. فلا بدّ من التفريق بين الإقرار الباطنيّ الفطريّ القلبي،"], [3322.6, "وبين الإقرار الظاهريّ اللساني."], [3329.0, "فإذا قلنا بأنّ الخلق مفطورون على الإقرار بالربوبية،"], [3334.1, "فإنما نعني به الإقرار الباطنيّ لا الظاهري."], [3338.0, "فإنّ الظاهر قد يَجحد ظلمًا وعلوًّا واستكبارًا وإباءً وغطرسةً وكفرًا وجحودًا،"], [3349.0, "لكن لا يستطيع الإنسان أن يُنكر مقتضًى من ضرورات فطرته."]], "tr": [[3299.0, "Allah Teâlâ'nın, ona dokuz mucizeyi gösterdiğinde Mûsâ'nın (Firavun'a) söylediğini bildirdiği gibi:"], [3302.3, "<span class=\"ayah\">﴿Andolsun, bildin ki﴾<\/span> — yani ey Firavun — <span class=\"ayah\">﴿bunları﴾<\/span> — yani mucizeleri — <span class=\"ayah\">﴿ancak göklerin ve yerin Rabbi, birer basiret olarak indirmiştir﴾<\/span> [İsrâ 102]."], [3317.1, "Bâtınen mi bildi, zahiren mi?"], [3319.3, "Bâtınen. Dolayısıyla bâtınî, fıtrî ve kalbî ikrar ile zahirî ve dil ile ikrar arasını ayırmak gerekir."], [3332.0, "Mahlûkların rubûbiyyeti ikrar fıtratı üzere yaratıldığını söylediğimizde, bununla zahirî değil, bâtınî ikrarı kastediyoruz."], [3339.4, "Çünkü zahir; zulüm, büyüklenme, kibir, dikbaşlılık, küstahlık, küfür ve inkârla inkâr edebilir;"], [3350.4, "fakat insan fıtratının zaruretlerinden olan bir gereği inkâr edemez."]]}, {"reader": false, "ar": [[3356.0, "وأضف إلى هذا جوابًا ثانيًا،"], [3358.9, "وهو أننا إذا قلنا بأنّ الخلق مفطورون على مقتضيات الربوبية،"], [3368.0, "فنعني به الإقرارَ أو الفطرةَ الأصلية،"], [3372.0, "لكن قد يعرض لهذه الفطرة ما يُلوّثها ويُبدّلها؛"], [3378.0, "فالتبديل الثاني لا يُلغي ما فُطرت عليه النفوس في أول الأمر."], [3385.9, "كما قال الله… كما قال النبي صلى الله عليه وسلم:"], [3393.0, "«كلُّ مولودٍ يولد على الفطرة» ـ أي باعتبار الأصالة والولادة ـ «فأبواه يُهوّدانه أو يُنصّرانه أو يُمجّسانه» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [3407.0, "فقد تُطمس فطرة الإنسان بسبب المؤثّرات البيئية الفاسدة."]], "tr": [[3356.0, "Buna ikinci bir cevap da ekle:"], [3358.9, "Mahlûkların rubûbiyyetin gerekleri üzere yaratıldığını söylediğimizde, bununla asıl ikrarı ya da asıl fıtratı kastediyoruz."], [3370.0, "Fakat bu fıtrata onu kirleten ve değiştiren şeyler arız olabilir;"], [3376.7, "sonradan gelen bu değişiklik, nefislerin başlangıçta üzerinde yaratıldığı şeyi ortadan kaldırmaz."], [3383.5, "Nitekim Allah… Nitekim Nebî ﷺ şöyle buyurmuştur:"], [3389.6, "«Her doğan fıtrat üzere doğar» — yani asıl ve doğum itibarıyla — «sonra anne babası onu Yahudi, Hristiyan ya da Mecûsî yapar» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [3407.7, "İnsanın fıtratı bozuk çevresel etkiler sebebiyle silinebilir."]]}, {"reader": false, "ar": [[3415.0, "ففرعون وُلد على الفطرة،"], [3417.8, "لكن فسدت بسبب تعاطيه <span class=\"q\">؟ 56:55<\/span> وكِبره وكفره وعناده،"], [3423.0, "فقال: <span class=\"ayah\">﴿أَنَا رَبُّكُمُ الْأَعْلَىٰ﴾<\/span>،"], [3425.8, "لا لأنه يجحد، وإنما لأنّ فطرته فسدت."], [3431.0, "والدهرية فسدت فطرتهم بسبب سوء معتقداتهم."], [3437.0, "فإذا قلنا بأنّ الخلق مفطورون على الإقرار بمقتضيات الربوبية،"], [3442.0, "فنعني به فطرةَ الأصالة،"], [3445.0, "لا باعتبار ما يُلوّث هذه الفطرة فيما بعد من المؤثّرات البيئية الخارجية. وهما جوابان واضحان."]], "tr": [[3415.0, "Firavun fıtrat üzere doğdu; fakat (fıtratı) onun ta'âtîsi (kendini kaptırması) <span class=\"q\">؟<\/span>, kibri, küfrü ve inadı sebebiyle bozuldu."], [3425.1, "Böylece <span class=\"ayah\">﴿Ben sizin en yüce rabbinizim﴾<\/span> dedi;"], [3429.2, "(içten) inkâr ettiği için değil, fıtratı bozulduğu için."], [3434.8, "Dehriyye'nin fıtratı da inançlarının kötülüğü sebebiyle bozuldu."], [3439.8, "Mahlûkların rubûbiyyetin gereklerini ikrar fıtratı üzere yaratıldığını söylediğimizde, bununla asıl fıtratı kastediyoruz;"], [3446.2, "bu fıtratı sonradan dış çevresel etkilerden kirleten şeyler itibarıyla değil. Bunlar iki açık cevaptır."]]}, {"reader": false, "ar": [[3457.0, "ويؤكّد هذه الكلّيّة الحديثُ الذي ذكرته لكم آنفًا:"], [3461.8, "«كلُّ مولودٍ يولد على الفطرة»،"], [3464.8, "أي فطرة الإسلام والإقرار بالربوبية."], [3467.8, "ويُقوّيه قولُ الله عز وجل:"], [3470.8, "<span class=\"ayah\">﴿وَإِذْ أَخَذَ رَبُّكَ مِن بَنِي آدَمَ مِن ظُهُورِهِمْ ذُرِّيَّتَهُمْ﴾<\/span> ـ في… في العهد الأول ـ <span class=\"ayah\">﴿وَأَشْهَدَهُمْ عَلَىٰ أَنفُسِهِمْ أَلَسْتُ بِرَبِّكُمْ ۖ قَالُوا بَلَىٰ﴾<\/span> <span class=\"ref\">[الأعراف: ١٧٢]<\/span>؛"], [3484.0, "الخلق كلّهم قالوا: بلى."]], "tr": [[3457.0, "Bu külliyeyi, size az önce zikrettiğim hadis teyit eder:"], [3461.2, "«Her doğan fıtrat üzere doğar», yani İslâm ve rubûbiyyeti ikrar fıtratı üzere."], [3467.2, "Allah Teâlâ'nın şu sözü de onu güçlendirir:"], [3470.2, "<span class=\"ayah\">﴿Hani Rabbin Âdemoğullarından, onların sırtlarından zürriyetlerini aldı﴾<\/span> — ilk ahitte — <span class=\"ayah\">﴿ve onları kendilerine şahit tuttu: \"Ben sizin Rabbiniz değil miyim?\" \"Evet (Rabbimizsin)\" dediler﴾<\/span> [A'râf 172]. Mahlûkların hepsi \"Evet\" dedi."]]}, {"reader": false, "ar": [[3486.0, "ويؤكّده حديث عياض بن حمار رضي الله عنه في صحيح مسلم،"], [3491.2, "من قوله صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل:"], [3495.0, "«وإنّي خلقتُ عبادي حنفاءَ كلَّهم، فجاءتهم الشياطين فاجتالتهم عن دينهم، وحرّمت عليهم ما أحللتُ لهم» <span class=\"note\">(Müslim)<\/span>."], [3508.0, "إذن الفساد ليس فسادَ أصالة،"], [3510.0, "وإنما فسادُ اكتسابٍ وعَرَض."], [3513.0, "فبهذين الجوابين يزول الإشكال إن شاء الله."]], "tr": [[3486.0, "Onu, Sahîh-i Müslim'deki İyâz b."], [3488.0, "Himâr (r.a.) hadisi de teyit eder;"], [3490.4, "Nebî ﷺ Rabbinden rivayet ettiği sözde şöyle buyurur:"], [3493.1, "«Ben kullarımın hepsini hanîfler olarak yarattım; sonra şeytanlar onlara geldi, onları dinlerinden saptırdı ve onlara helal kıldığım şeyleri haram kıldı» <span class=\"note\">(Müslim)<\/span>."], [3505.6, "Demek ki bozulma asıldan gelen bir bozulma değil, ancak sonradan kazanılan ve arız olan bir bozulmadır."], [3513.6, "Bu iki cevapla, inşallah, müşkil ortadan kalkar."]]}]}, {"ts": "58:37", "title": "10. Külliye: Her mevcudun bir var edicisi, her hâdisin bir muhdisi vardır", "paras": [{"reader": false, "ar": [[3517.0, "ومن الكلّيّات أيضًا: <b>كلُّ موجودٍ أو حادثٍ فلا بدّ له من موجِدٍ ومُحدِث.<\/b> طوّلنا عليكم اليوم الدرس،"], [3538.0, "استرسلنا شوي، نعتذر إليكم."], [3540.0, "<b>كلُّ موجودٍ أو حادثٍ فلا بدّ له من موجِدٍ ومُحدِث.<\/b> وهو قول الله عز وجل:"], [3549.7, "<span class=\"ayah\">﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ أَمْ هُمُ الْخَالِقُونَ﴾<\/span> <span class=\"ref\">[الطور: ٣٥]<\/span>."], [3554.0, "وهو من أعظم الأدلة العقلية على وجود الله عز وجل."]], "tr": [[3517.0, "Külliyelerden biri de şudur: 10."], [3520.0, "külliye: Her mevcudun ya da her hâdisin mutlaka bir var edicisi ve bir muhdisi (meydana getireni) vardır. Bugün dersi size uzattık, biraz daldık;"], [3540.0, "sizden özür dileriz. <b>Her mevcudun ya da her hâdisin mutlaka bir var edicisi ve bir muhdisi vardır.<\/b> Bu, Allah Teâlâ'nın şu sözüdür:"], [3550.2, "<span class=\"ayah\">﴿Yoksa onlar hiçbir şey olmaksızın mı yaratıldılar, yoksa yaratanlar kendileri mi?﴾<\/span> [Tûr 35]."], [3555.5, "Bu, Allah Teâlâ'nın varlığına dair aklî delillerin en büyüklerindendir."]]}, {"reader": false, "ar": [[3559.0, "فإنّ من مقتضيات العقول أنّ كلَّ حادثٍ فلا بدّ أن يقف وراءه مُحدِثٌ أحدثه،"], [3567.4, "وكلَّ موجودٍ فلا بدّ أن يقف وراءه مُوجِدٌ أوجده."], [3576.0, "وذلك لأنّ هذا الكون كائنٌ بعد أن لم يكن،"], [3581.0, "وحادثٌ بعد أن لم يكن له أثر."], [3587.0, "وحدوثُه ووجودُه له ثلاثة احتمالاتٍ لا رابع لها:"], [3594.0, "إمّا أن يكون قد أوجد نفسه بنفسه."]], "tr": [[3559.0, "Akılların gereklerindendir ki her hâdisin arkasında mutlaka onu meydana getiren bir muhdis, her mevcudun arkasında da mutlaka onu var eden bir var edici bulunur."], [3576.6, "Çünkü bu kâinat yokken var olmuştur ve hiçbir izi yokken meydana gelmiştir."], [3584.0, "Onun meydana gelişi ve var oluşu için dördüncüsü olmayan üç ihtimal vardır:"], [3594.7, "Ya kendi kendini var etmiştir."]]}]}, {"ts": "1:00:01", "title": "10. Külliye (devam): Üç ihtimal ve Tûr sûresindeki aklî delil", "paras": [{"reader": false, "ar": [[3601.0, "وهذا احتمالٌ ترفضه العقول في أصغر الأشياء،"], [3606.0, "فكيف بأكبرها؟ فلو أننا جئنا إلى رجلٍ وقلنا:"], [3612.2, "إنّ القصر الذي تراه عينك لم يكن بالأمس موجودًا،"], [3617.0, "وأصبح الناسُ وهو موجودٌ من غير بانٍ بناه ولا خبيرٍ عمّره،"], [3627.0, "فإنّ عقله لا يقبل ذلك."], [3631.0, "بل فيما هو أصغر من ذلك،"], [3634.8, "كالإبرة الصغيرة؛ فإننا من حين ما نرى الإبرة الصغيرة نتصوّر أنّ لها صانعًا قد صنعها،"], [3644.6, "ومصوّرًا قد صوّرها. فإذا كانت العقول تأبى وجودَ شيءٍ بلا موجِد،"], [3652.2, "وحدوثَ شيءٍ بلا مُحدِث في أصغر الأشياء،"], [3656.8, "ففي أكبرها من باب أولى. فهذا الاحتمال مرفوض."]], "tr": [[3601.0, "Bu, akılların en küçük şeylerde bile reddettiği bir ihtimaldir;"], [3607.1, "en büyüklerinde nasıl olur? Bir adama gelip \"Gözünün gördüğü bu saray dün mevcut değildi;"], [3614.9, "onu bina eden bir yapıcı ve onu imar eden bir usta olmadan insanlar sabahladığında o mevcuttu\" desek, aklı bunu kabul etmez."], [3630.2, "Hatta bundan daha küçük olan bir şeyde, küçük bir iğnede bile;"], [3636.7, "küçük iğneyi gördüğümüz andan itibaren onu yapan bir yapıcısı ve ona şekil veren bir şekil vericisi olduğunu düşünürüz."], [3647.7, "Akıllar en küçük şeylerde bile bir şeyin var edicisiz var olmasını ve muhdissiz meydana gelmesini reddediyorsa, en büyüklerinde evleviyetle reddeder. Dolayısıyla bu ihtimal reddedilmiştir."]]}, {"reader": false, "ar": [[3663.0, "ثم أضف إلى هذا احتمالًا آخر،"], [3667.0, "وهي أن يكون قد وُجد من عدم،"], [3672.0, "أو وُجد صدفةً؛ وهذا احتمالٌ مرفوض،"], [3677.0, "لأنه قبل أن يُوجِد نفسه كان موصوفًا بالعدم،"], [3682.0, "والعدم لا يوصف بأنه خالقٌ أو قادر."], [3686.0, "فإذا لم يكن هذا الكون قد أوجد نفسه بنفسه،"], [3691.0, "ولا وُجد صدفةً، فيبقى أنّ ـ أصحّ ـ فيبقى أنّ الاحتمال الحقّ الذي لا يجوز القول بغيره هو الثالث:"], [3705.0, "وهو أنّ له موجِدًا قد أوجده،"], [3709.0, "وخالقًا قد خلقه وأبدعه من العدم،"], [3713.0, "وهو الله تبارك وتعالى."]], "tr": [[3663.0, "Sonra buna başka bir ihtimal daha ekle:"], [3667.0, "Yokluktan (kendiliğinden) var olmuş olması ya da tesadüfen var olmuş olması."], [3673.9, "Bu da reddedilmiş bir ihtimaldir;"], [3677.6, "çünkü kendini var etmeden önce yoklukla nitelenmişti;"], [3681.4, "yokluk ise yaratıcı ya da kadir olmakla nitelenemez."], [3685.4, "Bu kâinat kendi kendini var etmediyse ve tesadüfen de var olmadıysa, geriye — en doğrusu — geriye, başkasını söylemenin caiz olmadığı hak ihtimal olarak üçüncüsü kalır:"], [3697.7, "Onun kendisini var eden bir var edicisi, onu yaratan ve yokluktan icat eden bir yaratıcısı vardır;"], [3711.7, "O da Allah Tebâreke ve Teâlâ'dır."]]}, {"reader": false, "ar": [[3715.0, "ولذلك ذكرت الآية احتمالين ولم تذكر الثالث،"], [3720.0, "اكتفاءً بالمقرَّر العقليّ الذي سيستنتجه قارئ هذه الآية."], [3727.0, "فقال الله عز وجل:"], [3728.3, "<span class=\"ayah\">﴿أَمْ خُلِقُوا مِنْ غَيْرِ شَيْءٍ﴾<\/span> ـ أي أنهم خُلقوا من عدم ـ <span class=\"ayah\">﴿أَمْ هُمُ الْخَالِقُونَ﴾<\/span> ـ أي هم الذين أوجدوا أنفسهم ـ؛"], [3739.0, "فلا الأول صحيح، ولا الثاني صحيح."], [3741.0, "ثم سكت الله عز وجل وتجاوز الاحتمال الثالث؛"], [3744.0, "لأنّ نتيجة العقل أنّ لهم موجِدًا قد أوجدهم،"], [3750.1, "وخالقًا قد أبدع صنعتهم وخلقهم،"], [3753.0, "وهو الله تبارك وتعالى."]], "tr": [[3715.0, "Bu yüzden ayet iki ihtimali zikretmiş, üçüncüsünü zikretmemiştir;"], [3719.3, "bu ayeti okuyanın çıkaracağı aklî yerleşik bilgiyle yetinmiştir."], [3724.3, "Allah Teâlâ buyurdu: <span class=\"ayah\">﴿Yoksa onlar hiçbir şey olmaksızın mı yaratıldılar﴾<\/span> — yani yokluktan mı yaratıldılar — <span class=\"ayah\">﴿yoksa yaratanlar kendileri mi?﴾<\/span> — yani kendilerini var edenler onlar mı?"], [3737.8, "Ne birincisi doğrudur ne de ikincisi."], [3740.0, "Sonra Allah Teâlâ sustu ve üçüncü ihtimali geçti;"], [3742.5, "çünkü aklın vardığı sonuç, onların kendilerini var eden bir var edicisi, yapılışlarını ve yaratılışlarını icat eden bir yaratıcısı olduğudur;"], [3752.4, "O da Allah Tebâreke ve Teâlâ'dır."]]}, {"reader": false, "ar": [[3756.0, "فالعقل يمنع وجودَ شيءٍ لا موجِدَ له،"], [3759.0, "ويمنع حدوثَ شيءٍ لا مُحدِثَ له."], [3763.0, "فهذا من الأدلة التي يستدلّ بها أهل السـ… بل استدلّ بها القرآن على وجود الله عز وجل."], [3771.0, "ولذلك لمّا سمع جُبير بن مُطعِم رسولَ الله صلى الله عليه وسلم يقرأ هذه الآية من سورة الطور قال:"], [3779.5, "«فكاد قلبي أن يطير» <span class=\"note\">(Buhârî)<\/span>."], [3783.0, "استدلالٌ عقليٌّ واضحٌ على وجود الله عز وجل،"], [3787.0, "وأنه المتوحّد بالخالقيّة، والمتفرّد بالإحداث والإبداع؛"], [3793.0, "فهو بديع السماوات والأرض عز وجل."]], "tr": [[3756.0, "Akıl, var edicisi olmayan bir şeyin var olmasına ve muhdisi olmayan bir şeyin meydana gelmesine engel olur."], [3765.7, "Bu, Ehl-i Sün… hatta Kur'an'ın Allah Teâlâ'nın varlığına delil getirdiği delillerdendir."], [3769.7, "Bu yüzden Cübeyr b. Mut'im, Resûlullah ﷺ'i Tûr sûresinden bu ayeti okurken işitince şöyle dedi:"], [3776.3, "«Kalbim neredeyse uçacaktı» <span class=\"note\">(Buhârî)<\/span>. (Bu,) Allah Teâlâ'nın varlığına, yaratıcılıkta tek olduğuna, meydana getirme ve icat etmede yegâne olduğuna dair açık bir aklî istidlaldir."], [3792.3, "O, göklerin ve yerin eşsiz yaratıcısıdır."]]}, {"reader": false, "ar": [[3797.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد،"], [3800.0, "وعلى آله وصحبه أجمعين."]], "tr": [[3797.0, "Allah en yüce olandır ve en iyisini bilendir."], [3798.7, "Allah, Peygamberimiz Muhammed'e, onun âline ve ashâbının tamamına salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}

  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
