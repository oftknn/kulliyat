<script>
const D={"no": 65, "vid": "Y5quM9J9z74", "title_ar": "الدرس (٦٥) من شرح كليات العقيدة — الإثبات بلا تمثيل والتنزيه بلا تعطيل، والألفاظ المجملة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 65. Ders: Temsil Gerektiren İsbat ve Ta'til Gerektiren Tenzih, Hakkında Özel Delil Varid Olmayan Mücmel Lafızlar (Cihet, Cisim, Mekân, Hayyiz, \"Mâ semme illallah\"), Nefyedilen Şeyin Zıddıyla Vasıflanma", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Temsili gerektiren her isbat bâtıldır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.5, "والصلاةُ والسلامُ على رسول الله الأمين،"], [6.4, "وعلى آله وأصحابه الطيبين الطاهرين،"], [9.5, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [13.3, "وعنّا معهم بمنّه وكرمه،"], [15.9, "إنه جوادٌ كريم. أسأل الله عز وجل أن يجعل جهودَنا وجهودَكم والمسلمين خالصةً لوجهه،"], [26.0, "ونافعةً <span class=\"q\">؟ 00:19<\/span> لعباده في أرضه."], [28.5, "لا نزال ـ ولله الحمد والمنّة ـ في سياق الكلّيّات المتعلّقة بصفات الله عز وجل."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.9, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun;"], [13.3, "lütfu ve keremiyle onlarla birlikte bize de (rahmet etsin)."], [19.0, "Şüphesiz O cömerttir, kerîmdir. Allah Azze ve Celle'den, bizim, sizin ve Müslümanların çabalarını O'nun rızası için hâlis ve yeryüzündeki kullarına faydalı <span class=\"q\">؟<\/span> kılmasını dilerim."], [30.4, "Hamd ve minnet Allah'a, hâlâ Allah Azze ve Celle'nin sıfatlarıyla ilgili külliyeler bağlamındayız."]]}, {"reader": false, "ar": [[37.0, "وأظنّ أنّنا وقفنا على كلّيّةٍ تقول:"], [41.0, "«كلُّ تلازمٍ باطلٍ على شيءٍ من صفات الله عز وجل فسببُه تمثيلُ صفات الله بصفات خلقه»،"], [54.2, "أليس كذلك؟ أجيبوني. نعم."], [57.0, "طيّب، ومن كلّيّات هذا الدرس أيضًا:"], [61.1, "<b>كلُّ إثباتٍ أوجبَ تمثيلًا فباطل.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ إثباتٍ أوجبَ تمثيلًا فباطل.<\/b>"]], "tr": [[37.0, "Zannediyorum şöyle diyen bir külliyede kalmıştık:"], [41.0, "\"Allah Azze ve Celle'nin sıfatlarından birine (yüklenen) her bâtıl telâzum (gereklilik iddiası), sebebi Allah'ın sıfatlarını halkının sıfatlarına temsil etmektir.\" Öyle değil mi?"], [55.6, "Cevap verin. Evet. Peki, bu dersin külliyelerinden biri de şudur:"], [61.1, "1. külliye: Temsili gerektiren her isbat bâtıldır. (Tekrar ediyor.) 1."], [70.0, "külliye: Temsili gerektiren her isbat bâtıldır."]]}, {"reader": false, "ar": [[77.0, "أقول وبالله تعالى التوفيق:"], [82.0, "وذلك لأنّ أهل القبلة انقسموا في باب صفات الله عز وجل إلى ثلاثة أقسام:"], [89.0, "إلى ممثّلةٍ، وإلى معطّلةٍ،"], [91.9, "وإلى أهل سنّةٍ وجماعة."], [97.0, "فأمّا الممثّلة فإنهم يُثبتون أسماءَ الله عز وجل وصفاتِه،"], [105.0, "ولا شكّ في هذا الإثبات،"], [106.0, "ولكنّ إثباتَهم هذا حصل فيه شيءٌ من الغلوّ،"], [111.0, "حتى جعلوا صفاتِ الله عز وجل كصفات خلقه."]], "tr": [[77.0, "Yüce Allah'tan tevfik dileyerek derim ki:"], [82.5, "Bu şundandır: Kıble ehli, Allah Azze ve Celle'nin sıfatları babında üç kısma ayrılmıştır:"], [89.0, "Mümessile, Muattıla ve Ehl-i Sünnet ve'l-Cemaat."], [97.0, "Mümessile'ye gelince, onlar Allah Azze ve Celle'nin isim ve sıfatlarını isbat ederler;"], [105.2, "bu isbatta şüphe yoktur. Fakat onların bu isbatında bir miktar aşırılık (gulüv) meydana gelmiş, hatta Allah Azze ve Celle'nin sıfatlarını halkının sıfatları gibi kılmışlardır."]]}, {"reader": false, "ar": [[114.0, "فعند الممثّلة حقٌّ وباطل:"], [118.0, "فأمّا الحقُّ الذي عندهم فهو إثباتُ أسماء الله عز وجل وصفاته،"], [124.0, "وأمّا الباطلُ الذي عندهم فهو الغلوُّ في هذا الإثبات،"], [131.0, "حتى مثّلوا صفاتِ الله عز وجل بصفات خلقه."], [136.0, "فلو أنهم وقفوا على الإثبات فقط،"], [139.9, "ولم يحملهم ذلك الإثباتُ على هذا التمثيل،"], [144.5, "لكان قولُهم من أحقّ الحقّ."]], "tr": [[114.0, "Mümessile'de hem hak hem bâtıl vardır."], [118.0, "Onlardaki hak, Allah Azze ve Celle'nin isim ve sıfatlarını isbat etmektir."], [123.5, "Onlardaki bâtıl ise bu isbatta aşırılığa gitmeleridir;"], [129.2, "öyle ki Allah Azze ve Celle'nin sıfatlarını halkının sıfatlarına temsil ettiler."], [136.0, "Eğer sadece isbatta durmuş olsalar ve o isbat onları bu temsile sürüklememiş olsaydı, sözleri hakkın en hakkı olurdu."]]}, {"reader": false, "ar": [[148.0, "فإن قلت: وما الذي أوقعهم في هذا التمثيل بعد الإثبات؟"], [154.0, "فأقول: الذي أوقعهم في ذلك ثلاثُ قواعدَ باطلة،"], [161.0, "كانوا يعتمدونها في النظر فيما يُثبته الله عز وجل له من الأسماء والصفات؛"], [167.0, "فبسبب هذه القواعد الإبليسيّة الثلاث عندهم وقعوا في التمثيل بعد أن أثبتوا الأسماءَ والصفات."]], "tr": [[148.0, "Eğer \"Peki, isbattan sonra onları bu temsile düşüren nedir?\" dersen, derim ki:"], [154.0, "Onları buna düşüren üç bâtıl kaidedir."], [158.3, "Allah Azze ve Celle'nin kendisi için isbat ettiği isim ve sıfatlara bakarken bu kaidelere dayanıyorlardı."], [167.0, "İşte onlardaki bu üç İblisçe kaide sebebiyle, isim ve sıfatları isbat ettikten sonra temsile düştüler."]]}, {"reader": false, "ar": [[180.0, "القاعدة الأولى: أنّ الاتّفاق في الأسماء يستلزم الاتّفاقَ في الصفات."], [187.0, "فلمّا رأوا أسماءَ صفات الله عز وجل وجدوها متّفقةً في الاسم مع أسماء صفات خلقه،"], [197.0, "وعندهم هذه القاعدة: أنّ كلَّ شيئين اتّفقا في الاسم فلا بدّ أن يتّفقا في الكيفيّة."], [207.0, "فلمّا رأوا أنّ لله وجهًا وللمخلوق وجهًا،"], [214.0, "قالوا: إذن وجهُ الله كوجه المخلوق،"], [218.0, "للاتّفاق في الاسم. ولمّا رأوا أنّ لله يدًا وأنّ للمخلوق يدًا،"], [226.0, "قالوا: إذن يدُ الله كيد المخلوق،"], [229.3, "للاتّفاق في الاسم. وهكذا في سائر صفات الله عز وجل."], [235.0, "فانظر كيف أوصلهم الإثباتُ إلى التمثيل!"], [240.0, "فكلُّ إثباتٍ تضمّن تمثيلًا فهو إثباتٌ باطل."]], "tr": [[180.0, "Birinci kaide: İsimlerde ittifak (ortaklık), sıfatlarda ittifakı gerektirir."], [187.0, "Allah Azze ve Celle'nin sıfatlarının isimlerini görünce, onları isim bakımından halkının sıfatlarının isimleriyle aynı buldular."], [199.0, "Onlarda şu kaide vardı: İsimde ortak olan her iki şeyin keyfiyette de ortak olması gerekir."], [207.0, "Allah'ın bir yüzü ve mahlûkun bir yüzü olduğunu görünce, \"O hâlde Allah'ın yüzü mahlûkun yüzü gibidir;"], [217.3, "çünkü isimde ortaklık var\" dediler."], [220.0, "Allah'ın bir eli ve mahlûkun bir eli olduğunu görünce, \"O hâlde Allah'ın eli mahlûkun eli gibidir;"], [228.2, "çünkü isimde ortaklık var\" dediler."], [231.0, "Allah Azze ve Celle'nin diğer sıfatlarında da böyle."], [235.0, "Bak, isbat onları temsile nasıl ulaştırdı!"], [240.0, "Temsili içeren her isbat bâtıl bir isbattır."]]}, {"reader": false, "ar": [[246.0, "القاعدة الثانية: أنهم رأوا أنّ الاتّفاق في الاسم الكلّيّ المطلق يستلزم الاتّفاقَ بعد الإضافة والتقييد والتخصيص."], [261.0, "فلمّا رأوا أنّ لله يدًا وأنّ للمخلوق يدًا ـ فلو حذفنا الإضافة لكانت:"], [272.1, "يدٌ ويد، هذا هو الاسم المطلق،"], [276.4, "غيرُ مضافٍ لا لله ولا للمخلوق ـ فحصل الاتّفاقُ بين اليد الأولى واليد الثانية في الاسم المطلق،"], [286.0, "فبما أنّ بين الاسمين ـ فكما أنّ بين الاسمين شيئًا من الاتّفاق في الاسم المطلق،"], [296.0, "فحينئذٍ لا بدّ بعد الإضافة أن يكون هناك تماثل."]], "tr": [[246.0, "İkinci kaide: Onlar, mutlak küllî isimde ortaklığın, izafe, takyîd ve tahsisten sonra da ortaklığı gerektirdiğini düşündüler."], [261.0, "Allah'ın bir eli ve mahlûkun bir eli olduğunu görünce —izafeyi kaldırsak \"el\" ve \"el\" kalır;"], [272.1, "işte bu, ne Allah'a ne mahlûka izafe edilmemiş mutlak isimdir—, birinci el ile ikinci el arasında mutlak isimde ortaklık meydana geldi."], [284.8, "Madem iki isim arasında —iki isim arasında mutlak isimde bir miktar ortaklık bulunduğu gibi, o hâlde izafeden sonra da bir benzerlik (temâsül) bulunması gerekir (dediler)."]]}]}, {"ts": "05:00", "title": "1. Külliye (devam): Üçüncü kaide: Gâibi şâhide kıyas; üç kaideye Ehl-i Sünnet'in cevabı", "paras": [{"reader": false, "ar": [[300.0, "وهذا خطأٌ عظيم؛ لأنّ المتقرِّر في قواعد أهل السنّة أنّ الاتّفاق في الأسماء لا يستلزم الاتّفاقَ في الصفات،"], [312.0, "ولأنّ المتقرِّر في القواعد عند أهل السنّة والجماعة أنّ الاتّفاق في الاسم الكلّيّ لا يستلزم الاتّفاقَ بعد الإضافة والتقييد والتخصيص."]], "tr": [[300.0, "Bu büyük bir hatadır. Çünkü Ehl-i Sünnet'in kaidelerinde yerleşik olan şudur:"], [304.0, "İsimlerde ortaklık, sıfatlarda ortaklığı gerektirmez."], [307.6, "Yine Ehl-i Sünnet ve'l-Cemaat nezdinde kaidelerde yerleşik olan şudur:"], [314.5, "Küllî isimde ortaklık, izafe, takyîd ve tahsisten sonra ortaklığı gerektirmez."]]}, {"reader": false, "ar": [[324.0, "وعندهم قاعدةٌ ملعونةٌ ثالثة،"], [326.8, "وهي: وجوبُ قياس الغائب على الشاهد."], [332.0, "فيقول هؤلاء الممثّلة: كلُّ شيءٍ خاطبنا الله به من الغائبات فلا بدّ أن نقيسه في كيفيّته على المشاهَدات."], [344.0, "فالله خاطبنا بوجهٍ غائب،"], [347.0, "فقال: <span class=\"ayah\">﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٧]<\/span>،"], [350.0, "ولا نعلم من الوجه إلا ذلك الوجهَ المشاهَد ـ أنتم معي ولّا لا؟"], [354.6, "ـ فإذن الوجهُ الغائب كالوجه المشاهَد."], [359.0, "والله خاطبنا بيدٍ غائبة،"], [363.0, "ولا نعلم من معنى اليد إلا هذه اليدَ المشاهَدة،"], [367.0, "فتكون اليدُ الغائبة في كيفيّتها كاليد المشاهَدة ـ وَهَا المشاهَدةُ <span class=\"q\">؟ 06:12<\/span> ـ وكذلك قالوه في سائر الصفات."]], "tr": [[324.0, "Onlarda üçüncü bir mel'ûn kaide daha vardır:"], [327.5, "Gâibi şâhide (görünmeyeni görünene) kıyas etmenin vâcip olması."], [334.1, "Bu Mümessile der ki: \"Allah'ın gaybî şeylerden bize hitap ettiği her şeyi, keyfiyeti bakımından gözlenen şeylere kıyas etmemiz gerekir."], [344.0, "Allah bize gaybî bir yüzden hitap etti ve <span class=\"ayah\">﴿Rabbinin yüzü bâki kalır﴾<\/span> [Rahmân 27] buyurdu."], [347.8, "Biz yüzden ancak şu gözlenen yüzü biliyoruz\" —benimle misiniz, değil misiniz?— \"O hâlde gaybî yüz, gözlenen yüz gibidir."], [354.6, "Allah bize gaybî bir elden hitap etti;"], [359.0, "biz elin anlamından ancak şu gözlenen eli biliyoruz."], [364.8, "O hâlde gaybî el, keyfiyetinde gözlenen el gibidir\" —işte gözlenen (el) <span class=\"q\">؟<\/span>—."], [372.6, "Diğer sıfatlarda da böyle dediler."]]}, {"reader": false, "ar": [[376.0, "فتلك القواعد الثلاث عندهم هي التي أوجبت لهم التمثيلَ بعد الإثبات."], [385.0, "وأُعيدها مختصرةً مع بيان الحقّ فيها:"], [390.0, "قالوا: إنّ الاتّفاق في الاسم يستلزم الاتّفاقَ في الصفات،"], [397.0, "قلنا: هذا باطل، بل الاتّفاقُ في الاسم لا يستلزم الاتّفاقَ في الصفات."], [404.0, "وقالوا: إنّ الاتّفاق في الاسم الكلّيّ العامّ يستلزم الاتّفاقَ بعد الإضافة والتقييد والتخصيص،"], [413.0, "قلنا: هذا باطل، بل الاتّفاقُ في الاسم الكلّيّ العامّ لا يستلزم الاتّفاقَ بعد الإضافة والتقييد والتخصيص."]], "tr": [[376.0, "İşte onlardaki bu üç kaide, isbattan sonra onlara temsili gerektiren şeydir."], [385.0, "Onları, içlerindeki hakkı da beyan ederek kısaca tekrar ediyorum:"], [392.1, "\"İsimde ortaklık sıfatlarda ortaklığı gerektirir\" dediler;"], [397.7, "biz dedik ki: Bu bâtıldır;"], [400.7, "bilakis isimde ortaklık sıfatlarda ortaklığı gerektirmez."], [404.0, "\"Genel küllî isimde ortaklık, izafe, takyîd ve tahsisten sonra ortaklığı gerektirir\" dediler;"], [413.7, "biz dedik ki: Bu bâtıldır;"], [416.3, "bilakis genel küllî isimde ortaklık, izafe, takyîd ve tahsisten sonra ortaklığı gerektirmez."]]}, {"reader": false, "ar": [[424.0, "ثمّ قالوا: يُقاس الغائبُ على الشاهد،"], [429.0, "قلنا: هذا باطل؛ لأنّ المتقرِّر في القواعد ألّا قياسَ في غيب،"], [437.0, "فلا يجوز إقحامُ العقل استقلالًا في مسألةٍ غيبيّة،"], [442.0, "ولا يجوز إقحامُ القياس استقلالًا في مسألةٍ غيبيّة."], [447.0, "والخلاصةُ من ذلك: أنّ القسم الأوّل من أهل القبلة عندهم إثبات،"], [453.0, "ولكنّ إثباتهم صار مشوَّهًا بما وقع فيه من التمثيل."]], "tr": [[424.0, "Sonra \"Gâib şâhide kıyas edilir\" dediler;"], [426.3, "biz dedik ki: Bu bâtıldır."], [429.7, "Çünkü kaidelerde yerleşik olan şudur:"], [432.6, "Gaybda kıyas yoktur. Gaybî bir meseleye aklı tek başına (bağımsız olarak) sokmak caiz değildir;"], [441.4, "gaybî bir meseleye kıyası tek başına sokmak da caiz değildir."], [447.0, "Bundan çıkan sonuç şudur: Kıble ehlinin birinci kısmında isbat vardır;"], [452.5, "fakat onların isbatı, düştükleri temsil sebebiyle çarpık hâle gelmiştir."]]}]}, {"ts": "07:41", "title": "2. Külliye: Ta'tili gerektiren her tenzih bâtıldır", "paras": [{"reader": false, "ar": [[461.0, "ويتّضح ذلك بالكلّيّة الثانية:"], [465.0, "<b>كلُّ تنزيهٍ أوجبَ تعطيلًا فباطل.<\/b> أنتم معي؟"], [471.7, "ماشيين معي؟ <span class=\"note\">(يكررها)<\/span> <b>كلُّ تنزيهٍ أوجبَ تعطيلًا فباطل.<\/b>"]], "tr": [[461.0, "Bu, ikinci külliyeyle açıklık kazanır:"], [465.0, "<b>2. külliye: Ta'tili gerektiren her tenzih bâtıldır.<\/b> Benimle misiniz?"], [471.7, "Benimle beraber yürüyor musunuz? (Tekrar ediyor.) 2."], [483.8, "külliye: Ta'tili gerektiren her tenzih bâtıldır."]]}, {"reader": false, "ar": [[487.0, "أقول وبالله التوفيق: اعلم رحمك الله تعالى ـ انتبهوا لي،"], [495.0, "ضعوا الأقلام ـ اعلم رحمك الله تعالى أنّ الممثِّل والمعطِّل كانا أخوين يمشيان في طريقٍ واحدة،"], [510.0, "لا يُعرف هذا بتمثيل،"], [512.0, "ولا يُعرف هذا بتعطيل."], [515.0, "وكان كلٌّ منهما قد قعّد في باب الأسماء والصفات ثلاثَ قواعدَ باطلة،"], [524.0, "وهي عينُ القواعد التي ذكرتُها لكم في الكلّيّة السابقة."], [531.0, "فتلك القواعد هي التي اعتمدها الممثِّل،"], [538.0, "وهي بعينها التي اعتمدها المعطِّل،"], [542.0, "ولكنّه مختلفٌ بعد خروج نتائج هذه القواعد."]], "tr": [[487.0, "Tevfik Allah'tandır, derim ki: Bil —Allah Teâlâ sana rahmet etsin— —bana dikkat edin, kalemleri bırakın— bil —Allah Teâlâ sana rahmet etsin— ki mümessil ile muattıl, aynı yolda yürüyen iki kardeştiler;"], [510.5, "ne bu temsille ne de şu ta'tille tanınıyordu."], [515.0, "Her biri isimler ve sıfatlar babında üç bâtıl kaide koymuştu;"], [521.0, "bunlar önceki külliyede size zikrettiğim kaidelerin ta kendisidir."], [527.1, "O kaideler, mümessilin dayandığı kaidelerdir;"], [531.0, "muattılın dayandığı da tam olarak onlardır."], [538.0, "Fakat o (muattıl), bu kaidelerin neticeleri ortaya çıktıktan sonra (ondan) ayrılır."]]}, {"reader": false, "ar": [[548.0, "فلمّا خرجت نتيجةُ هذه القاعدة أنّ صفاتِ الله كصفات خلقه،"], [555.1, "رضي بتلك النتيجة الممثِّل،"], [560.0, "فوقع في التمثيل. وأمّا المعطِّل فإنه لمّا رأى نتيجةَ هذه القواعد أنها تقتضي مماثلةَ الله الكاملِ من كلّ وجهٍ بالمخلوق الضعيف من كلّ وجه،"], [577.0, "أبى عقلُه أن يقبل هذه النتيجة،"], [580.0, "فصار حائرًا بين تصحيح القواعد أو تحريف نصوص الصفات،"], [587.0, "فرأى بجهله أنّ تحريف نصوص الصفات أيسرُ على قلبه من تصحيح القواعد،"], [598.0, "فعطّل صفاتِ الله عز وجل."]], "tr": [[548.0, "Bu kaidenin neticesi \"Allah'ın sıfatları halkının sıfatları gibidir\" diye çıkınca mümessil bu neticeye razı oldu ve temsile düştü."], [562.0, "Muattıl ise bu kaidelerin neticesinin, her yönden kâmil olan Allah'ı her yönden zayıf olan mahlûka benzetmeyi gerektirdiğini görünce, aklı bu neticeyi kabul etmekten kaçındı."], [578.5, "Kaideleri düzeltmekle sıfat naslarını tahrif etmek arasında şaşırıp kaldı."], [584.3, "Cehaletiyle, sıfat naslarını tahrif etmeyi kaideleri düzeltmekten kalbine daha kolay gördü ve Allah Azze ve Celle'nin sıfatlarını ta'til etti."]]}]}, {"ts": "10:00", "title": "2. Külliye (devam): Bid'at ehlinin usulde birleşip neticede ayrılması; Ehl-i Sünnet'in yolu", "paras": [{"reader": false, "ar": [[600.0, "لماذا؟ لأنّ الاتّفاق في الأسماء عنده يستلزم الاتّفاقَ في الصفات،"], [608.0, "ولأنّ الاتّفاق في الاسم الكلّيّ عنده يستلزم الاتّفاقَ بعد الإضافة والتخصيص،"], [615.0, "ولأنّ الغائب عنده يجب قياسُه على الشاهد."]], "tr": [[600.0, "Niçin? Çünkü onun nezdinde isimlerde ortaklık sıfatlarda ortaklığı gerektirir;"], [606.3, "onun nezdinde küllî isimde ortaklık, izafe ve tahsisten sonra ortaklığı gerektirir;"], [614.4, "onun nezdinde gâibin şâhide kıyas edilmesi vâciptir."]]}, {"reader": false, "ar": [[622.0, "فإن قلت: ولماذا كان تأصيلُهم واحدًا ونتائجُهم مختلفة؟"], [629.0, "أقول: هذا شأنُ أهل البدع في الباب الواحد من أبواب الاعتقاد؛"], [634.0, "فإنهم يتّفقون في التأصيل ويختلفون في النتائج والتفصيل."], [644.0, "ولذلك الوعيديّةُ والمرجئةُ في باب الإيمان أصولُهم واحدة ونتائجُهم مختلفة،"], [653.0, "والقدريّةُ والجبريّةُ في باب القضاء والقدر أصولُهم واحدة ونتائجُهم مختلفة،"], [663.0, "وقد شرحتُ لكم جُمَلًا كثيرةً من ذلك."]], "tr": [[622.0, "Eğer \"Peki, niçin usulleri bir, neticeleri farklı oldu?\" dersen, derim ki:"], [630.4, "Bu, akîde bablarından aynı babdaki bid'at ehlinin hâlidir:"], [634.0, "Usulde birleşir, neticelerde ve tafsilatta ayrılırlar."], [644.0, "Bu sebeple iman babında Va'îdiyye ile Mürcie'nin usulleri birdir, neticeleri farklıdır."], [653.0, "Kaza ve kader babında Kaderiyye ile Cebriyye'nin usulleri birdir, neticeleri farklıdır."], [663.0, "Size bundan pek çok şey şerh etmiştim."]]}, {"reader": false, "ar": [[667.0, "لكنّ الذي يخصّنا هنا أنّ المعطّلة قرّروا في باب الأسماء من القواعد عينَ ما قرّره الممثّلة،"], [681.0, "ولكنهم اختلفوا معهم بعد خروج هذه النتائج التي تقتضي تمثيلَ الله بخلقه؛"], [691.0, "فرضي الممثّلةُ بالنتيجة فمثّلوا،"], [693.9, "وأبى المعطّلةُ النتيجةَ فعطّلوا."]], "tr": [[667.0, "Fakat burada bizi ilgilendiren şudur:"], [670.3, "Muattıla, isimler babında kaidelerden Mümessile'nin koyduğunun aynısını koydu."], [675.7, "Fakat Allah'ı halkına temsil etmeyi gerektiren bu neticeler ortaya çıktıktan sonra onlardan ayrıldılar."], [691.0, "Mümessile neticeye razı olup temsil etti;"], [693.2, "Muattıla ise neticeyi kabul etmeyip ta'til etti."]]}, {"reader": false, "ar": [[698.0, "فالمعطّلة عندهم حقٌّ وباطل:"], [703.0, "فأمّا الحقُّ الذي عندهم فهو تنزيهُ الله عن مماثلة المخلوقات،"], [709.0, "فإلى هذه الجزئيّة قولُهم حقّ،"], [716.0, "ولكنّ تنزيهَهم حملهم على أن عطّلوا الله عز وجل عن أسمائه وصفاته."], [726.0, "فلو أنهم سلم تنزيهُهم من التعطيل لكان تنزيهًا سُنّيًّا سلفيًّا لا غبارَ عليه."]], "tr": [[698.0, "Muattıla'da da hem hak hem bâtıl vardır."], [703.0, "Onlardaki hak, Allah'ı mahlûkata benzemekten tenzih etmektir;"], [707.2, "bu noktaya kadar sözleri haktır."], [710.6, "Fakat tenzihleri, onları Allah Azze ve Celle'yi isim ve sıfatlarından ta'til etmeye sürükledi."], [726.0, "Eğer tenzihleri ta'tilden salim kalsaydı, üzerinde hiçbir toz bulunmayan Sünnî, Selefî bir tenzih olurdu."]]}, {"reader": false, "ar": [[734.0, "فأنت ترى أنّ الممثّلة معهم حقٌّ وهو الإثبات،"], [739.0, "ولكنهم خلطوه بباطلٍ وهو التمثيل."], [744.0, "وترى أنّ المعطّلة معهم حقٌّ وهو التنزيه،"], [748.8, "ولكنهم خلطوه بباطلٍ وهو التعطيل."], [753.1, "فدَعِ الباطلَ لهما، وخُذِ الحقَّ من كلٍّ منهما،"], [759.4, "يتبيّنْ لك منهجُ أهل السنّة والجماعة."]], "tr": [[734.0, "Görüyorsun ki Mümessile'nin yanında bir hak vardır, o da isbattır;"], [738.4, "fakat onu bir bâtılla, yani temsille karıştırmışlardır."], [744.0, "Muattıla'nın yanında da bir hak vardır, o da tenzihtir;"], [748.1, "fakat onu bir bâtılla, yani ta'tille karıştırmışlardır."], [753.1, "Bâtılı onlara bırak, ikisinden de hakkı al;"], [758.7, "Ehl-i Sünnet ve'l-Cemaat'in metodu sana açıkça görünür."]]}, {"reader": false, "ar": [[765.0, "فأهلُ السنّة والجماعة يُثبتون لله الأسماءَ والصفاتِ إثباتًا بلا تمثيل،"], [775.0, "ويُنزّهون الله عز وجل عن مماثلة المخلوقات ـ مَن يُكمل؟"], [781.1, "<span class=\"q\">؟ 12:55<\/span> ـ تنزيهًا بلا تعطيل؛ امتثالًا لقول الله عز وجل:"], [789.1, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>، فهو تنزيهٌ له عن مماثلة المخلوقات،"], [795.0, "لكنه تنزيهٌ مقرونٌ بقوله:"], [797.9, "<span class=\"ayah\">﴿وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>. فالإثباتُ بالتمثيل تمثيل، والتنزيهُ بالتعطيل تعطيل."]], "tr": [[765.0, "Ehl-i Sünnet ve'l-Cemaat, Allah için isim ve sıfatları temsilsiz bir isbatla isbat eder;"], [771.3, "Allah Azze ve Celle'yi mahlûkata benzemekten —kim tamamlar?"], [777.7, "<span class=\"q\">؟<\/span>— ta'tilsiz bir tenzihle tenzih eder."], [781.1, "Bunu, Allah Azze ve Celle'nin <span class=\"ayah\">﴿O'nun benzeri gibi hiçbir şey yoktur﴾<\/span> [Şûrâ 11] sözüne uyarak yaparlar."], [789.1, "Bu, O'nu mahlûkata benzemekten tenzihtir;"], [791.7, "fakat O'nun <span class=\"ayah\">﴿O, hakkıyla işitendir, hakkıyla görendir﴾<\/span> [Şûrâ 11] sözüyle birlikte olan bir tenzihtir."], [800.0, "Temsille isbat temsildir; ta'tille tenzih ta'tildir."]]}, {"reader": false, "ar": [[808.0, "وأمّا أهلُ السنّة والجماعة فيجعلون صفاتِ الله عز وجل دائرةً بين قوله:"], [814.4, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>، ومقرونةً بقوله:"], [817.6, "<span class=\"ayah\">﴿وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>. فلم يحملنا الإثباتُ إلى أن نمثّل،"], [824.0, "ولم يحملنا التنزيهُ إلى أن نعطّل."], [828.0, "ولعلّ الكلّيّتين واضحة إن شاء الله عز وجل."]], "tr": [[808.0, "Ehl-i Sünnet ve'l-Cemaat ise Allah Azze ve Celle'nin sıfatlarını O'nun <span class=\"ayah\">﴿O'nun benzeri gibi hiçbir şey yoktur﴾<\/span> [Şûrâ 11] sözü etrafında döner ve <span class=\"ayah\">﴿O, hakkıyla işitendir, hakkıyla görendir﴾<\/span> [Şûrâ 11] sözüyle bağlantılı kılar."], [820.0, "İsbat bizi temsil etmeye sürüklemedi;"], [823.3, "tenzih de bizi ta'til etmeye sürüklemedi."], [828.0, "Umarım iki külliye inşallah açıktır."]]}]}, {"ts": "13:52", "title": "3. Külliye: Hakkında özel delil varid olmayan her şeyin lafzını ne isbat ne nefyederiz, manasını tafsil ederiz", "paras": [{"reader": false, "ar": [[832.0, "الكلّيّة الثالثة ـ لفظُها طويلٌ قليلًا،"], [839.0, "ولكن أعتذر إليكم ـ: كلُّ ما لم يَرِد فيه دليلٌ بخصوصه ـ كلُّ ما لم يَرِد فيه دليلٌ بخصوصه فلا نُثبت لفظَه ولا ننفيه ـ فلا نُثبت لفظَه ولا ننفيه ـ ونستفصل في معناه،"], [874.0, "فإن أُريد الحقُّ قبلناه،"], [876.5, "وإن أُريد الباطلُ رددناه. أُعيدها مرّةً ثانية:"], [882.0, "كلُّ ما لم يَرِد فيه دليلٌ بخصوصه فلا نُثبت لفظَه ولا ننفيه،"], [894.0, "ونستفصل في معناه<b> ـ <\/b>معناه،"], [898.7, "فإن أُريد به الحقُّ قبلناه،"], [902.1, "وإن أُريد به الباطلُ رددناه."]], "tr": [[832.0, "Üçüncü külliye —lafzı biraz uzun, ama sizden özür dilerim—:"], [842.0, "3. külliye: Hakkında özel olarak delil varid olmayan her şey — 3."], [847.7, "külliye: Hakkında özel olarak delil varid olmayan her şeyin lafzını ne isbat ederiz ne de nefyederiz<b> — <\/b>lafzını ne isbat ederiz ne de nefyederiz<b> — <\/b>manasını ise tafsil ederiz (istifsâl);"], [875.2, "eğer hak kastedilmişse kabul ederiz, bâtıl kastedilmişse reddederiz. İkinci kez tekrar ediyorum:"], [882.0, "3. külliye: Hakkında özel olarak delil varid olmayan her şeyin lafzını ne isbat ederiz ne de nefyederiz;"], [894.9, "manasını ise tafsil ederiz<b> — <\/b>manasını;"], [900.1, "eğer onunla hak kastedilmişse kabul ederiz, onunla bâtıl kastedilmişse reddederiz."]]}, {"reader": false, "ar": [[910.0, "أُعيدها بسرعةٍ مرّةً ثالثة:"], [913.0, "كلُّ ما لم يَرِد فيه دليلٌ بخصوصه فلا نُثبت لفظَه ولا ننفيه،"], [920.0, "ونستفصل في معناه، فإن أُريد به الحقُّ قبلناه،"], [926.0, "وإن أُريد به الباطلُ رددناه."]], "tr": [[910.0, "Hızlıca üçüncü kez tekrar ediyorum:"], [913.0, "3. külliye: Hakkında özel olarak delil varid olmayan her şeyin lafzını ne isbat ederiz ne de nefyederiz;"], [920.7, "manasını ise tafsil ederiz; eğer onunla hak kastedilmişse kabul ederiz, onunla bâtıl kastedilmişse reddederiz."]]}]}, {"ts": "15:31", "title": "3. Külliye (devam): İsim ve sıfatlar babının üç şeye dayanması; bid'at ehlinin kullandığı lafızlar", "paras": [{"reader": false, "ar": [[931.0, "أقول وبالله تعالى التوفيق ـ ضعوا الأقلام ـ:"], [935.0, "اعلم رحمك الله تعالى أنّ باب الأسماء والصفات عندنا ـ معاشرَ أهل السنّة والجماعة ـ يدور على ثلاثة أشياء:"], [947.0, "الأوّل: صفاتٌ أثبتها الله لنفسه،"], [954.0, "فيجب علينا إثباتُها. الثاني ـ أحسنت ـ:"], [958.8, "صفاتٌ نفاها الله عن نفسه،"], [966.0, "فيجب علينا نفيُها وإثباتُ كمال ضدّها،"], [969.5, "كما سيأتينا في كلّيّةٍ بعد قليل."]], "tr": [[931.0, "Yüce Allah'tan tevfik dileyerek derim ki —kalemleri bırakın—:"], [935.0, "Bil —Allah Teâlâ sana rahmet etsin— ki biz Ehl-i Sünnet ve'l-Cemaat topluluğu nezdinde isimler ve sıfatlar babı üç şey etrafında döner."], [947.0, "Birincisi: Allah'ın kendisi için isbat ettiği sıfatlar;"], [958.0, "bunları isbat etmemiz vâciptir. İkincisi —aferin—:"], [960.3, "Allah'ın kendisinden nefyettiği sıfatlar; bunları nefyetmemiz ve zıtlarının kemalini isbat etmemiz vâciptir."], [969.5, "Az sonra bir külliyede bu bize gelecek."]]}, {"reader": false, "ar": [[973.0, "والكلّيّة التي عندنا لا شأنَ لها لا بمسألة الإثبات،"], [982.0, "ولا بمسألة ما ورد نفيُه،"], [985.0, "وإنما لها تعلّقٌ بالأمر الثالث:"], [989.0, "وهي أنّنا نسمع أهلَ البدع يصفون الله عز وجل بصفاتٍ لا وجودَ لألفاظها،"], [1001.0, "لا في كتاب الله عز وجل،"], [1004.0, "ولا في سنّة نبيّه صلى الله عليه وسلم،"], [1008.0, "ولا في لسان أصحاب رسول الله صلى الله عليه وسلم،"], [1013.0, "ولم يتكلّم بها أحدٌ من السلف الصالح."], [1016.0, "فليس عليها دليلٌ بخصوصها يُثبتها،"], [1020.0, "وليس عليها دليلٌ بخصوصها ينفيها،"], [1025.0, "وهذا ما نعنيه بقولنا:"], [1027.8, "«ما لم يَرِد فيه دليلٌ بخصوصه»."]], "tr": [[973.0, "Elimizdeki külliyenin ne isbat meselesiyle ne de nefyi varid olan şey meselesiyle bir ilgisi vardır;"], [985.0, "onun ilgisi ancak üçüncü husustadır:"], [989.0, "Bid'at ehlinin Allah Azze ve Celle'yi, lafızları ne Allah Azze ve Celle'nin Kitabı'nda, ne Peygamberi sallallâhu aleyhi ve sellem'in sünnetinde, ne de Resûlullah sallallâhu aleyhi ve sellem'in ashâbının dilinde bulunan ve selef-i sâlihînden hiç kimsenin söylemediği sıfatlarla vasıflandırdığını işitiriz."], [1012.0, "Bunlar üzerinde onları özel olarak isbat eden bir delil yoktur;"], [1016.0, "onları özel olarak nefyeden bir delil de yoktur."], [1023.2, "\"Hakkında özel olarak delil varid olmayan\" sözümüzle kastettiğimiz budur."]]}, {"reader": false, "ar": [[1032.0, "فإن قلت: وما مذهبُ أهل السنّة والجماعة في هذا النوع من الصفات؟"], [1039.0, "فأقول: أوّلًا: اعلم أنه لا يجوز للسُّنّيّ ابتداءً أن يتكلّم بشيءٍ من هذه الصفات مطلقًا؛"], [1049.8, "لأنّ باب الصفات بابٌ غيبيّ،"], [1054.0, "والمتقرِّر في القواعد أنّ ما كان غيبيًّا فيكون توقيفيًّا على النصّ."], [1060.0, "فلا يجوز لك ـ أيّها السُّنّيّ ـ أن تُثبت لله ما لم يُثبته لنفسه،"], [1066.0, "ولا أن تنفي عن الله ما لم ينفِه عن نفسه؛"], [1071.0, "فمبنى الإثبات والنفي في باب الصفات على الدليل."]], "tr": [[1032.0, "Eğer \"Ehl-i Sünnet ve'l-Cemaat'in bu tür sıfatlardaki mezhebi nedir?\" dersen, derim ki:"], [1039.0, "Önce bil ki Sünnî'nin bu sıfatlardan herhangi birini kendiliğinden (ilk ağızdan) dile getirmesi kesinlikle caiz değildir."], [1049.8, "Çünkü sıfatlar babı gaybî bir babdır;"], [1054.5, "kaidelerde yerleşik olan şudur: Gaybî olan şey nassa bağlıdır (tevkîfîdir)."], [1060.0, "Ey Sünnî! Allah'ın kendisi için isbat etmediği bir şeyi O'na isbat etmen de, Allah'ın kendisinden nefyetmediği bir şeyi O'ndan nefyetmen de caiz değildir."], [1071.0, "Sıfatlar babında isbat ve nefyin dayanağı delildir."]]}, {"reader": false, "ar": [[1079.0, "ولكن إن ابتُليتَ في زمانك بمبتدعٍ قد فتن الناسَ بهذه الصفات التي لم يَرِد فيها دليلٌ بخصوصه،"], [1090.8, "فلا بدّ اضطرارًا أن تُبيّن الحقَّ فيها."], [1096.0, "فإن قلت: وما الحقُّ فيها؟"], [1099.4, "فأقول: لنا مذهبٌ في ألفاظها،"], [1102.7, "ولنا مذهبٌ في معانيها."], [1108.0, "فأمّا ألفاظُها فلا نُثبتها لله ولا ننفيها،"], [1114.0, "وهو الذي أقصده بقولي في الكلّيّة:"], [1118.0, "«فلا نُثبت لفظَه ولا ننفيه»."]], "tr": [[1079.0, "Fakat zamanında, hakkında özel olarak delil varid olmayan bu sıfatlarla insanları fitneye düşüren bir bid'atçiyle imtihan edilirsen, zaruretten dolayı bunlardaki hakkı beyan etmen gerekir."], [1096.0, "Eğer \"Bunlardaki hak nedir?\" dersen, derim ki:"], [1099.4, "Bizim bunların lafızları hakkında bir mezhebimiz, manaları hakkında da bir mezhebimiz vardır."], [1108.0, "Lafızlarına gelince, onları Allah için ne isbat ederiz ne de nefyederiz."], [1115.3, "Külliyedeki \"lafzını ne isbat ederiz ne de nefyederiz\" sözümle kastettiğim budur."]]}, {"reader": false, "ar": [[1121.0, "فلا نقول مثلًا: إنّ الله في جهة،"], [1125.0, "ولا نقول بأنّ الله ليس في جهة؛"], [1130.0, "لأنه لم يَرِد في الدليل الصحيح أنّ الله أثبت لنفسه الجهة،"], [1136.0, "ولا نفى عن نفسه الجهة،"], [1139.0, "فنتوقّف في لفظها. ولا يجوز لنا أن نقول بأنّ الله جسم،"], [1146.0, "ولا يجوز أن نقول بأنّ الله ليس له جسم."], [1151.0, "فلفظُ «الجسم» المركّبُ من جيمٍ وسينٍ وميم لا يجوز أن يُنسب لله؛"], [1159.5, "لا إثباتًا، لعدم وجود ما يُثبته بعينه،"], [1163.0, "ولا نفيًا، لعدم وجود ما ينفيه بعينه."], [1169.0, "وهكذا ما سأذكره في التفريع إن شاء الله."]], "tr": [[1121.0, "Meselâ \"Allah bir cihettedir\" demeyiz;"], [1124.4, "\"Allah bir cihette değildir\" de demeyiz."], [1130.0, "Çünkü sahih delilde Allah'ın kendisi için cihet isbat ettiği de, kendisinden cihet nefyettiği de varid olmamıştır;"], [1141.0, "bu yüzden lafzında tevakkuf ederiz."], [1143.5, "\"Allah cisimdir\" dememiz de caiz değildir;"], [1147.1, "\"Allah'ın cismi yoktur\" dememiz de caiz değildir."], [1151.0, "Cim, sin ve mim harflerinden oluşan \"cisim\" lafzını Allah'a nispet etmek caiz değildir:"], [1159.5, "Ne isbat olarak —çünkü onu bizzat isbat eden bir şey yoktur— ne de nefy olarak —çünkü onu bizzat nefyeden bir şey yoktur—."], [1170.9, "İnşallah tefrîde (örneklerde) zikredeceklerim de böyledir."]]}, {"reader": false, "ar": [[1174.0, "فإذا قيل لك: ما مذهبُك في هذه الصفات التي تكلّم بها أهلُ البدع؟"], [1182.0, "فتقول: إنّ مذهبي في ألفاظها هو أنّني أتوقّف فيها،"], [1188.1, "فلا أُثبتها ولا أنفيها."], [1193.0, "وأمّا في معناها ـ لأنّ كلَّ لفظٍ لا بدّ أن يكون له معنى ـ"]], "tr": [[1174.0, "Sana \"Bid'at ehlinin dile getirdiği bu sıfatlar hakkında mezhebin nedir?\" denirse, dersin ki:"], [1182.0, "Bunların lafızları hakkındaki mezhebim, onlarda tevakkuf etmemdir;"], [1186.1, "onları ne isbat ederim ne de nefyederim."], [1193.0, "Manalarına gelince —çünkü her lafzın mutlaka bir manası vardır—"]]}]}, {"ts": "20:01", "title": "3. Külliye (devam): Manada istifsâl · 1. örnek: Cihet", "paras": [{"reader": false, "ar": [[1201.0, "فأمّا مذهبُنا في اللفظ فبيّنّاه،"], [1204.0, "وأمّا مذهبُنا في المعاني فإنّني أستفصل فيها:"], [1209.0, "فإن بيّن مَن أطلقها على الله معنًى حقًّا جائزًا على الله عز وجل،"], [1216.0, "فأنا أقبلُ هذا الإطلاقَ ـ ولكن لا أقبل لفظَه ـ بل أُعبّر عنه بما ورد في الكتاب والسنّة؛"], [1229.0, "فلا ينبغي أن أُعبّر عن الحقّ بلفظٍ مجملٍ يحتمل الحقَّ والباطل،"], [1237.0, "وإنما أُعبّر عن الحقّ الذي في معناها بما عبّر به الكتابُ والسنّة."]], "tr": [[1201.0, "Lafız hakkındaki mezhebimizi açıkladık. Manalar hakkındaki mezhebimize gelince, onlarda istifsâl ederim (ne kastedildiğini sorarım):"], [1209.0, "Eğer onu Allah için kullanan kimse, Allah Azze ve Celle hakkında caiz olan hak bir mana beyan ederse, ben bu kullanımı (manası itibarıyla) kabul ederim —fakat lafzını kabul etmem—;"], [1223.7, "bilakis onu Kitap ve Sünnet'te varid olan ifadeyle ifade ederim."], [1229.0, "Hakkı, hem hakka hem bâtıla ihtimali olan mücmel bir lafızla ifade etmem uygun değildir;"], [1237.7, "bilakis onun manasındaki hakkı, Kitap ve Sünnet'in ifade ettiği şekilde ifade ederim."]]}, {"reader": false, "ar": [[1245.0, "وأمّا إذا بيّن لي من معاني هذا اللفظ البدعيّ شيئًا باطلًا لا يجوز على الله عز وجل،"], [1254.0, "فأنا أنفي ذلك. وهو المقصود بقوله في الكلّيّة:"], [1260.0, "«ونستفصل في معناه، فإن أُريد به الحقُّ قبلناه، وإن أُريد به الباطلُ رددناه». وأضرب لكم أمثلة:"]], "tr": [[1245.0, "Ama bu bid'at lafzının manalarından bana Allah Azze ve Celle hakkında caiz olmayan bâtıl bir şey beyan ederse, ben onu nefyederim."], [1256.0, "Külliyedeki \"manasını tafsil ederiz; eğer onunla hak kastedilmişse kabul ederiz, onunla bâtıl kastedilmişse reddederiz\" sözüyle kastedilen budur. Size örnekler vereyim:"]]}, {"reader": false, "ar": [[1273.0, "المثال الأوّل: لفظُ «الجهة»."], [1277.0, "إذا قيل لك: هل الله في جهة أو ليس في جهة؟"], [1281.0, "فقل: لي في الجهة مذهبان:"], [1284.4, "أمّا لفظُها فلا أُثبتها لله ولا أنفيها؛"], [1291.0, "فلا أقول: إنّ الله في جهة،"], [1293.3, "ولا أقول: إنّ الله ليس في جهة."], [1296.0, "وأمّا معناها فأستفصل فيها،"], [1298.7, "فأقول: هل أنت تقصد بالجهة:"], [1302.0, "أي جهةَ سُفل؟ فإن أراد بها ذلك فهذا معنًى باطل؛"], [1307.5, "لأنّ السُّفل نقص، والله منزَّهٌ عن النقص."]], "tr": [[1273.0, "Birinci örnek: \"Cihet\" lafzı. Sana \"Allah bir cihette midir, yoksa bir cihette değil midir?\" denirse, de ki:"], [1281.0, "Benim cihet hakkında iki mezhebim var."], [1284.4, "Lafzına gelince, onu Allah için ne isbat ederim ne de nefyederim;"], [1291.0, "\"Allah bir cihettedir\" demem, \"Allah bir cihette değildir\" de demem."], [1296.0, "Manasına gelince, onda istifsâl eder ve derim ki:"], [1302.0, "\"Cihetle aşağı cihetini mi kastediyorsun?\" Eğer bunu kastediyorsa, bu bâtıl bir manadır;"], [1307.5, "çünkü aşağılık noksanlıktır, Allah ise noksanlıktan münezzehtir."]]}, {"reader": false, "ar": [[1311.0, "وإن قال: أقصد به جهةَ علوٍّ محيطةً بالله عز وجل،"], [1320.0, "فأقول: هذا باطل؛ لأنّ الله لا يحيط به شيءٌ من مخلوقاته."], [1326.0, "لكن إن قال لي:"], [1328.7, "أقصد بها جهةَ علوٍّ لائقةً بالله عز وجل،"], [1334.0, "غيرَ محيطةٍ به، فأقول:"], [1337.7, "هذا المعنى حقّ، ولكن لا أُسمّيه بالجهة،"], [1343.0, "وإنما أُسمّيه بما سمّاه النصُّ به،"], [1346.6, "وهو: الله في العلوّ،"], [1349.0, "أو: الله في السماء؛"], [1353.0, "لقول الله عز وجل:"], [1355.5, "<span class=\"ayah\">﴿أَأَمِنتُم مَّن فِي السَّمَاءِ﴾<\/span> <span class=\"ref\">[الملك: ١٦]<\/span>،"], [1358.0, "ولم يقل: من في جهة."], [1361.0, "وقال: <span class=\"ayah\">﴿سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى﴾<\/span> <span class=\"ref\">[الأعلى: ١]<\/span>،"], [1364.6, "<span class=\"ayah\">﴿وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>. وذلك لأنّ المتقرِّر في القواعد أنّ التعبير عن المعاني الشرعيّة بألفاظ النصوص أَولى وأوجب."]], "tr": [[1311.0, "Eğer \"Bununla Allah Azze ve Celle'yi kuşatan bir yukarı cihetini kastediyorum\" derse, derim ki:"], [1320.5, "Bu bâtıldır; çünkü Allah'ı mahlûkatından hiçbir şey kuşatmaz."], [1326.0, "Fakat bana \"Bununla Allah Azze ve Celle'ye lâyık, O'nu kuşatmayan bir yukarı cihetini kastediyorum\" derse, derim ki:"], [1337.7, "Bu mana haktır; fakat ona \"cihet\" adını vermem."], [1343.6, "Bilakis ona nassın verdiği adı veririm;"], [1347.2, "o da \"Allah yücelikte (uluvv)\" veya \"Allah semadadır\" ifadesidir."], [1353.0, "Çünkü Allah Azze ve Celle şöyle buyurmuştur:"], [1355.5, "<span class=\"ayah\">﴿Semadaki (Allah'ın)... güvende misiniz?﴾<\/span> [Mülk 16];"], [1359.2, "\"cihette olandan\" dememiştir. Yine şöyle buyurmuştur:"], [1361.0, "<span class=\"ayah\">﴿Pek yüce olan Rabbinin adını tesbih et﴾<\/span> [A'lâ 1], <span class=\"ayah\">﴿O, çok yücedir, çok büyüktür﴾<\/span> [Bakara 255]."], [1368.0, "Bu, şundandır: Kaidelerde yerleşik olan şudur:"], [1370.3, "Şer'î manaları nasların lafızlarıyla ifade etmek daha evlâ ve daha vâciptir."]]}]}, {"ts": "22:56", "title": "3. Külliye (devam) · 2. örnek: Cisim; zât ve sıfat lafızlarının nastaki delili", "paras": [{"reader": false, "ar": [[1376.0, "المثال الثاني: إذا قيل:"], [1378.7, "هل الله له جسم أو ليس له جسم؟"], [1389.0, "فقل: أمّا لفظُ الجسم ـ ها،"], [1391.3, "ماذا نقول فيه؟ ـ فأتوقّف فيه،"], [1393.1, "فلا أُثبته ولا أنفيه؛"], [1399.0, "لا أُثبته لعدم وجود الدليل المُثبت له بعينه،"], [1403.0, "ولا أنفيه لعدم وجود الدليل النافي له بعينه."], [1408.0, "وأمّا معناه فأستفصل فيه:"], [1413.0, "ماذا تقصد بقولك: إنّ لله جسمًا؟"]], "tr": [[1376.0, "İkinci örnek: \"Allah'ın cismi var mıdır, yok mudur?\" denirse, de ki:"], [1389.0, "\"Cisim\" lafzına gelince —hı, onun hakkında ne diyoruz?— onda tevakkuf ederim;"], [1391.8, "onu ne isbat ederim ne de nefyederim."], [1399.0, "Onu isbat etmem, çünkü onu bizzat isbat eden delil yoktur;"], [1403.0, "onu nefyetmem, çünkü onu bizzat nefyeden delil yoktur."], [1408.0, "Manasına gelince, onda istifsâl ederim:"], [1413.0, "\"Allah'ın cismi vardır\" sözünle neyi kastediyorsun?"]]}, {"reader": false, "ar": [[1417.0, "فإن قال: أقصد به ما هو معهودٌ من أجسامنا،"], [1424.0, "فلله يدٌ كأيدينا، ووجهٌ كوجوهنا،"], [1427.7, "وعينٌ كأعيننا، وكلُّ ما يختصّ به جسمُ المخلوق فهو متحقّقٌ في الخالق،"], [1436.0, "فأقول: هذا المعنى باطل،"], [1439.7, "بل كفرٌ مُخرجٌ عن الملّة بالكلّيّة؛"], [1444.0, "لأنه قد تواتر النقلُ بأنّ الله <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ ۖ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>،"], [1456.0, "<span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [1458.0, "<span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>،"], [1460.0, "<span class=\"ayah\">﴿فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ﴾<\/span> <span class=\"ref\">[النحل: ٧٤]<\/span>."]], "tr": [[1417.0, "Eğer \"Bununla cisimlerimizden bilinen şeyi kastediyorum;"], [1420.6, "Allah'ın ellerimiz gibi bir eli, yüzlerimiz gibi bir yüzü, gözlerimiz gibi bir gözü vardır;"], [1430.0, "mahlûkun cismine has olan her şey Yaratan'da da mevcuttur\" derse, derim ki:"], [1436.9, "Bu mana bâtıldır; hatta insanı dinden tamamen çıkaran bir küfürdür."], [1441.1, "Çünkü şu nakil tevâtür derecesine ulaşmıştır:"], [1444.0, "<span class=\"ayah\">﴿O'nun benzeri gibi hiçbir şey yoktur. O, hakkıyla işitendir, hakkıyla görendir﴾<\/span> [Şûrâ 11], <span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4], <span class=\"ayah\">﴿O'nun adaşı (benzeri) olan birini biliyor musun?﴾<\/span> [Meryem 65], <span class=\"ayah\">﴿Artık Allah'a misaller getirmeyin﴾<\/span> [Nahl 74]."]]}, {"reader": false, "ar": [[1462.0, "وأمّا إذا قال ـ انتبهوا ـ:"], [1463.9, "أعني بالجسميّة تلك الذاتَ الإلهيّةَ الكاملةَ من كلّ وجه،"], [1469.7, "الموصوفةَ بصفات الجمال والكمال والجلال والكبرياء والعظمة،"], [1474.2, "على وجهٍ لا يماثل صفاتِ المخلوقين،"], [1486.0, "فأقول: أمّا هذا المعنى فهو حقّ،"], [1492.0, "ولكن لا أُسمّي هذا الحقَّ بلفظ الجسم المجمل الباطل،"], [1499.0, "وإنما أُسمّيه بما سمّاه به النصّ،"], [1503.1, "وهي أنّ لله ذاتًا وصفات."]], "tr": [[1462.0, "Ama —dikkat edin— \"Cisimlikle, her yönden kâmil olan, cemâl, kemal, celâl, kibriyâ ve azamet sıfatlarıyla mahlûkların sıfatlarına benzemeyecek şekilde vasıflanan o ilâhî zâtı kastediyorum\" derse, derim ki:"], [1486.8, "Bu mana haktır; fakat bu hakkı mücmel ve bâtıl \"cisim\" lafzıyla adlandırmam."], [1496.3, "Bilakis onu nassın onu adlandırdığı şekilde adlandırırım;"], [1501.1, "o da Allah'ın bir zâtı ve sıfatları olduğudur."]]}, {"reader": false, "ar": [[1507.0, "أمّا «الذات» فقد ثبت عن النبيّ صلى الله عليه وسلم ـ في قوله ـ أنه قال:"], [1516.0, "«لم يكذب إبراهيمُ إلا ثلاثَ كذباتٍ، كلُّهنّ في ذات الله»."], [1522.0, "وأمّا لفظُ «الصفة» ففي «الصحيحين» من حديث عائشة رضي الله تعالى عنها قالت:"], [1529.5, "«بعث النبيُّ صلى الله عليه وسلم رجلًا على سريّة، فأمّره عليهم، فكان يصلّي بأصحابه فيختم بهم، فيقرأ <span class=\"ayah\">﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ١]<\/span>. فلمّا رجعوا ذكروا ذلك للنبيّ صلى الله عليه وسلم، فقال: سلوه لأيّ شيءٍ يصنع ذلك؟ قال: لأنها صفةُ الرحمن، فأنا أحبّ أن أقرأ بها. فقال: أخبروه أنّ الله عز وجل يحبّه»."]], "tr": [[1507.0, "\"Zât\" lafzına gelince, Peygamber sallallâhu aleyhi ve sellem'den sabit olmuştur ki şöyle buyurmuştur:"], [1511.8, "\"İbrâhîm ancak üç kez yalan (görünen söz) söylemiştir;"], [1516.0, "hepsi de Allah'ın zâtı uğrunadır.\" \"Sıfat\" lafzına gelince, \"Sahîhayn\"da Âişe'den —Allah ondan razı olsun— rivayet edilen hadiste şöyle demiştir:"], [1519.0, "\"Peygamber sallallâhu aleyhi ve sellem bir adamı bir seriyyeye gönderdi ve onu onlara emir yaptı."], [1522.0, "O, arkadaşlarına namaz kıldırıyor ve (kıraatini) onlarla <span class=\"ayah\">﴿De ki: O Allah birdir﴾<\/span> [İhlâs 1] okuyarak bitiriyordu."], [1525.5, "Döndüklerinde bunu Peygamber sallallâhu aleyhi ve sellem'e anlattılar."], [1527.8, "'Ona bunu niçin yaptığını sorun' buyurdu."], [1529.5, "(Adam) 'Çünkü o, Rahmân'ın sıfatıdır;"], [1534.5, "ben de onu okumayı seviyorum' dedi."], [1541.3, "Bunun üzerine (Peygamber) 'Ona Allah Azze ve Celle'nin onu sevdiğini haber verin' buyurdu.\""]]}, {"reader": false, "ar": [[1560.0, "فأنت ترى أنّ الأدلّة أطلقت على الله لفظَ الذات ولفظَ الصفات،"], [1566.0, "وعلى ذلك جرى إجماعُ أهل السنّة والجماعة ـ رحم الله أمواتَهم وثبّت أحياءَهم ـ في تجويز إطلاق الذات والصفات على الله عز وجل."], [1579.0, "فلا أُعبّر عن هذا المعنى الحقّ بهذا اللفظ البدعيّ المحتمل المجمل،"], [1586.0, "وإنما أُعبّر عنه بما عبّر به النصّ؛"], [1589.0, "لأنّ التعبير عن المعاني الشرعيّة بألفاظ النصوص أَولى."]], "tr": [[1560.0, "Görüyorsun ki deliller Allah için \"zât\" lafzını ve \"sıfatlar\" lafzını kullanmıştır."], [1564.9, "Ehl-i Sünnet ve'l-Cemaat'in icmâı da —Allah ölülerine rahmet etsin, dirilerine sebat versin— Allah Azze ve Celle için zât ve sıfatlar lafızlarını kullanmanın caiz olduğu üzerine cereyan etmiştir."], [1579.0, "Bu hak manayı, ihtimalli ve mücmel olan bu bid'at lafzıyla ifade etmem;"], [1585.4, "bilakis onu nassın ifade ettiği şekilde ifade ederim."], [1589.0, "Çünkü şer'î manaları nasların lafızlarıyla ifade etmek daha evlâdır."]]}]}, {"ts": "26:34", "title": "3. Külliye (devam) · 3. örnek: Mekân; istivâ ayetleri", "paras": [{"reader": false, "ar": [[1594.0, "المثال الثالث: إذا قيل:"], [1597.4, "هل الله في مكان،"], [1600.1, "أو ليس الله في مكان؟"], [1604.0, "فقل: لي في المكان مذهبان:"], [1607.2, "مذهبٌ في ألفاظه ـ لفظِه ـ ومذهبٌ في معناه."], [1611.1, "أمّا لفظُه فأتوقّف فيه،"], [1613.7, "فلا أُثبته فأقول: إنّ الله في مكان،"], [1624.0, "ولا أنفيه فأقول: إنّ الله ليس في مكان؛"], [1629.0, "لأنه لا يُعرف في الأدلّة الصحيحة إثباتُ هذا المكان ولا نفيُه،"], [1636.0, "وما لم يَرِد فيه دليلٌ بخصوصه فلا حقَّ لي أن أُثبت لفظَه أو أن أنفي لفظَه."], [1643.6, "أنتم معي في هذا ولّا لا؟"]], "tr": [[1594.0, "Üçüncü örnek: \"Allah bir mekânda mıdır, yoksa Allah bir mekânda değil midir?\" denirse, de ki:"], [1604.0, "Benim mekân hakkında iki mezhebim var:"], [1607.2, "Lafızları —lafzı— hakkında bir mezhep ve manası hakkında bir mezhep."], [1612.4, "Lafzına gelince, onda tevakkuf ederim;"], [1615.6, "onu isbat edip \"Allah bir mekândadır\" demem, onu nefyedip \"Allah bir mekânda değildir\" de demem."], [1629.0, "Çünkü sahih delillerde bu mekânın ne isbatı ne de nefyi bilinmektedir."], [1636.0, "Hakkında özel olarak delil varid olmayan şeyin lafzını isbat etmeye veya lafzını nefyetmeye hakkım yoktur."], [1643.6, "Bu konuda benimle misiniz, değil misiniz?"]]}, {"reader": false, "ar": [[1644.0, "وأمّا معناه فأستفصل فيه:"], [1650.0, "ماذا تقصد بقولك: إنّ الله في مكان؟"], [1655.0, "هل تقصد به في مكانِ سُفل؟"], [1660.0, "فإن كنت تقصد هذا فهو معنًى باطل؛"], [1665.0, "لأنّ السُّفل نقص، والله منزَّهٌ عن النقص."], [1670.0, "هل تقصد به مكانَ علوٍّ محيطٍ بالله عز وجل؟"], [1679.0, "فإن كنت تقصد هذا فهو معنًى باطل؛"], [1684.0, "لأنّ الله لا يحيط به شيءٌ من مخلوقاته."], [1688.0, "أم تقصد به مكانَ علوٍّ غيرِ محيطٍ بالله عز وجل،"], [1698.0, "على ما يليق بجلاله وعظمته؟"], [1702.0, "فأقول: هذا المعنى حقّ."]], "tr": [[1644.0, "Manasına gelince, onda istifsâl ederim:"], [1650.0, "\"Allah bir mekândadır\" sözünle neyi kastediyorsun?"], [1655.0, "Bununla aşağı bir mekânda olmayı mı kastediyorsun?"], [1660.0, "Eğer bunu kastediyorsan, bu bâtıl bir manadır;"], [1665.0, "çünkü aşağılık noksanlıktır, Allah ise noksanlıktan münezzehtir."], [1670.0, "Bununla Allah Azze ve Celle'yi kuşatan bir yukarı mekânını mı kastediyorsun?"], [1679.0, "Eğer bunu kastediyorsan, bu bâtıl bir manadır;"], [1684.0, "çünkü Allah'ı mahlûkatından hiçbir şey kuşatmaz."], [1688.0, "Yoksa bununla Allah Azze ve Celle'yi kuşatmayan, O'nun celâline ve azametine lâyık bir yukarı mekânını mı kastediyorsun?"], [1702.0, "(O zaman) derim ki: Bu mana haktır."]]}, {"reader": false, "ar": [[1706.0, "ولكن لا أُعبّر عن هذا الحقّ بلفظ المكان،"], [1710.0, "وإنما أُعبّر عنه بما ثبت التعبيرُ به عنه في الكتاب والسنّة،"], [1717.0, "وهو أنّ الله استوى على عرشه."], [1723.0, "فإذا قيل لك: أين الله؟"], [1727.0, "فقل: الله فوق سماواته،"], [1731.0, "مستوٍ على عرشه، بائنٌ من خلقه."], [1737.0, "فهذا هو التعبير الصحيح الذي ثبت في الكتاب والسنّة،"], [1744.0, "في سبع آياتٍ من القرآن:"], [1749.0, "في السجدة، والرعد، والحديد،"], [1753.0, "ويونس، وطه، والأعراف، والفرقان؛"], [1759.0, "كلُّها يُثبت الله عز وجل أنه استوى على عرشه."]], "tr": [[1706.0, "Fakat bu hakkı \"mekân\" lafzıyla ifade etmem;"], [1709.0, "bilakis onu, Kitap ve Sünnet'te kendisiyle ifade edilmesi sabit olan şekilde ifade ederim;"], [1717.0, "o da Allah'ın Arşı'na istivâ ettiğidir."], [1723.0, "Sana \"Allah nerededir?\" denirse, de ki:"], [1727.8, "Allah göklerinin üstündedir, Arşı'na istivâ etmiştir, halkından ayrıdır (bâindir)."], [1737.0, "İşte Kitap ve Sünnet'te sabit olan doğru ifade budur;"], [1744.0, "Kur'an'ın yedi ayetinde: Secde, Ra'd, Hadîd, Yûnus, Tâhâ, A'râf ve Furkân (sûrelerinde)."], [1759.0, "Bunların hepsinde Allah Azze ve Celle, Arşı'na istivâ ettiğini isbat eder."]]}]}, {"ts": "29:25", "title": "3. Külliye (devam) · 4. örnek: Hayyiz; hayyizin iki manası, Hulûliyye ve İttihâdiyye", "paras": [{"reader": false, "ar": [[1765.0, "المثال الرابع ـ ولا أريد الإطالةَ عليكم ـ:"], [1768.0, "إذا قيل: هل الله في حيّز أو ليس في حيّز؟"], [1776.0, "ومعنى الحيّز: الشيءُ في الشيء؛"], [1781.0, "فنحن الآن وإيّاكم في حيّز المجلس،"], [1784.8, "أي في فراغه ـ معي ولّا لا؟"], [1788.6, "ـ والنجومُ والأفلاكُ في حيّز السماء،"], [1791.8, "يعني داخلةً فيها، ويدي في حيّز جيبي، أي داخلةٌ فيه."]], "tr": [[1765.0, "Dördüncü örnek —sizi uzun tutmak istemiyorum—:"], [1768.0, "\"Allah bir hayyizde midir, yoksa bir hayyizde değil midir?\" denirse..."], [1776.0, "Hayyizin manası, bir şeyin başka bir şeyin içinde olmasıdır."], [1781.0, "Şu an biz ve siz meclisin hayyizindeyiz, yani onun boşluğundayız —benimle misiniz, değil misiniz?—;"], [1788.6, "yıldızlar ve felekler göğün hayyizindedir, yani onun içindedir;"], [1793.7, "elim cebimin hayyizindedir, yani onun içindedir."]]}, {"reader": false, "ar": [[1810.0, "فأقول: تعالَ <span class=\"q\">؟ 30:10<\/span>، لي في الحيّز مذهبان:"], [1814.1, "مذهبٌ في لفظه، ومذهبٌ في معناه."], [1824.0, "أمّا لفظُه فأتوقّف فيه،"], [1826.9, "فلا أُثبته ولا أنفيه؛"], [1833.0, "فلا أقول بأنّ الله في حيّز،"], [1836.2, "ولا أقول بأنّ الله ليس في حيّز؛"], [1840.0, "لأنّ الدليل لم يَرِد به إثباتًا ولا نفيًا."], [1844.0, "وأمّا معناه فأستفصل فيه:"], [1850.0, "فإن أُريد به الحقُّ قبلتُه وعبّرت عنه بالتعبير الشرعيّ،"], [1857.0, "وإن أُريد به الباطلُ رددتُه."]], "tr": [[1810.0, "Derim ki: Gel <span class=\"q\">؟<\/span>, benim hayyiz hakkında iki mezhebim var:"], [1814.1, "Lafzı hakkında bir mezhep ve manası hakkında bir mezhep."], [1826.2, "Lafzına gelince, onda tevakkuf ederim;"], [1833.0, "onu ne isbat ederim ne de nefyederim."], [1835.7, "\"Allah bir hayyizdedir\" demem, \"Allah bir hayyizde değildir\" de demem;"], [1840.0, "çünkü delil onu ne isbat ne de nefy olarak getirmiştir."], [1844.0, "Manasına gelince, onda istifsâl ederim:"], [1850.0, "Eğer onunla hak kastedilmişse onu kabul eder ve şer'î ifadeyle ifade ederim;"], [1857.0, "onunla bâtıl kastedilmişse onu reddederim."]]}, {"reader": false, "ar": [[1860.0, "والحيّز له معنيان: فإن قال ـ أو فإن كان يقصد ـ بأنّ الله في حيّز،"], [1873.0, "بمعنى أنه قد اتّصلت ذاتُه بذوات خلقه فحازته فصار في جوفها،"], [1885.0, "كما يعتقده ملاحدةُ الحلوليّة والاتّحاديّة،"], [1893.0, "الذين يقولون بأنّ ذات الله عز وجل قد اتّحدت بذوات خلقه،"], [1902.0, "أو الحلوليّة الذين يقولون بأنّ ذاته قد حلّت في ذوات خلقه."]], "tr": [[1860.0, "Hayyizin iki manası vardır. Eğer \"Allah bir hayyizdedir\" sözüyle —veya bununla— şunu kastediyorsa:"], [1870.6, "O'nun zâtı halkının zâtlarına bitişmiş, onlar O'nu kuşatmış (hayyizlerine almış) ve O onların içine girmiştir —ki bu, Allah Azze ve Celle'nin zâtının halkının zâtlarıyla birleştiğini (ittihad ettiğini) söyleyen mülhid Hulûliyye ve İttihâdiyye'nin, ya da O'nun zâtının halkının zâtlarına girdiğini (hulûl ettiğini) söyleyen Hulûliyye'nin inancıdır—..."]]}, {"reader": false, "ar": [[1910.0, "والفرقانُ بين الحلول والاتّحاد كما بيّنته لكم بمثال السكّر في الشاي:"], [1919.0, "فإذا وضعتَ قطعةَ سكّرٍ في الشاي ولم تتحلّل أجزاؤها،"], [1923.5, "فقد حلّت ولكن لم تتّحد."], [1926.0, "لكن إذا ذاب السكّر ولم يَعُد يتميّز سكّرُه من مائه،"], [1932.7, "ولا ماؤه من سكّره،"], [1938.0, "فنقول: اتّحدت ذاتُه بذات الماء."], [1941.0, "فأيّهما أعظمُ كفرًا: قولُ الحلوليّة أو الاتّحاديّة؟"], [1947.0, "لا جَرَمَ أنّ قول الاتّحاديّة أعظمُ كفرًا،"], [1951.1, "كما بيّنّاه في قواعد الربوبيّة، إن كنتم تذكرون."]], "tr": [[1910.0, "Hulûl ile ittihad arasındaki fark, size çaydaki şeker örneğiyle açıkladığım gibidir:"], [1919.0, "Çaya bir parça şeker koyduğunda parçaları çözülmemişse, o (çaya) girmiş (hulûl etmiş) ama birleşmemiştir (ittihad etmemiştir)."], [1926.0, "Fakat şeker erir de artık şekeri suyundan, suyu şekerinden ayırt edilemez hâle gelirse, \"Onun zâtı suyun zâtıyla birleşti (ittihad etti)\" deriz."], [1941.0, "Hangisi küfür bakımından daha büyüktür:"], [1943.2, "Hulûliyye'nin sözü mü, İttihâdiyye'nin sözü mü?"], [1947.0, "Şüphesiz İttihâdiyye'nin sözü küfür bakımından daha büyüktür;"], [1951.7, "hatırlıyorsanız rubûbiyyet kaidelerinde bunu açıklamıştık."]]}, {"reader": false, "ar": [[1956.0, "فإن كنت تقصد بأنّ الله منحازٌ في خلقه،"], [1961.0, "أنّ شيئًا من ذوات الخلق قد حلّت في ذاته،"], [1966.0, "أو أنّ شيئًا من ذاته قد حلّت في ذوات خلقه،"], [1972.0, "فحازهم في ذاته أو حازوه في ذواتهم،"], [1979.0, "فهذا هو الكفرُ الصريح الذي اتّفقت كلمةُ المسلمين على أنه كفر،"], [1985.0, "ومن شكّ في كفر قائل هذه المقالة ـ وهو عالمٌ بحقيقتها ـ فهو كافرٌ مثلُه."]], "tr": [[1956.0, "Eğer \"Allah halkının içinde hayyizlenmiştir (münhâzdır)\" sözünle, halkın zâtlarından bir şeyin O'nun zâtına girdiğini veya O'nun zâtından bir şeyin halkının zâtlarına girdiğini;"], [1969.0, "O'nun onları kendi zâtında kuşattığını veya onların O'nu kendi zâtlarında kuşattığını kastediyorsan, bu, Müslümanların sözbirliğiyle küfür olduğunu kabul ettiği apaçık küfürdür."], [1984.1, "Bu sözü söyleyenin küfründen —hakikatini bildiği hâlde— şüphe eden kimse de onun gibi kâfirdir."]]}, {"reader": false, "ar": [[1997.0, "فهذا المعنى من معاني الحيّز معنًى باطل؛"], [2003.0, "لأنّ أعظم قاعدةٍ في الربوبيّة على الإطلاق هو اعتقادُ مباينة ذات الخالق عن ذوات المخلوق."], [2016.0, "وما حلّ كفرٌ ولا شركٌ في الأرض ـ مذ خلق الله آدمَ إلى أن يرث الله الأرضَ ومن عليها ـ إلا وسببُه حلولُ الذاتين في بعضهما."], [2029.0, "فلو رجعتم إلى شرك الوثنيّين،"], [2035.0, "وإلى شرك أهل الكتاب ـ وإلى شرك من اليهود والنصارى ـ وإلى شرك المجوس،"], [2044.0, "لوجدتم أنه يقف وراءه اعتقادُ حلول شيءٍ من ذاته في شيءٍ من ذوات خلقه."]], "tr": [[1997.0, "Hayyizin manalarından bu mana bâtıl bir manadır."], [2003.0, "Çünkü rubûbiyyette mutlak olarak en büyük kaide, Yaratan'ın zâtının mahlûkun zâtlarından ayrı (mübâyin) olduğuna inanmaktır."], [2016.0, "Allah'ın Âdem'i yarattığı günden yeryüzüne ve üzerindekilere vâris olacağı güne kadar yeryüzüne hiçbir küfür ve şirk inmemiştir ki sebebi, iki zâtın birbirine girmesi (hulûlü) olmasın."], [2030.6, "Putperestlerin şirkine, Ehl-i Kitab'ın —Yahudi ve Hristiyanların— şirkine ve Mecûsîlerin şirkine dönüp baksanız, ardında O'nun zâtından bir şeyin halkının zâtlarından bir şeye girdiği inancının durduğunu görürsünüz."]]}, {"reader": false, "ar": [[2051.0, "فأعظمُ قاعدةٍ من قواعد الربوبيّة هو اعتقادُ المباينة المطلقة بين ذات الخالق وذات المخلوق،"], [2059.0, "كما بيّنته أيضًا في قواعد الربوبيّة."], [2064.0, "وأمّا المعنى الثاني: إن كنت تقصد بالحيّز:"], [2070.1, "أي المنحاز، بمعنى المنفصل عن الشيء ـ انحاز فلانٌ عنّا:"], [2078.0, "بمعنى انفصل، انحاز عن مذهبنا:"], [2081.0, "أي خرج عنه وانفصل ـ فالحيّز تأتي بمعنى المنفصل."], [2088.0, "فإن كنت تقصد ذلك،"], [2090.8, "بمعنى أنّ الله منفصلٌ عن خلقه،"], [2096.0, "فهذا معنًى حقّ؛ فإنّنا نعتقد أنّ الله عز وجل ليس في ذاته شيءٌ من ذوات خلقه،"]], "tr": [[2051.0, "Rubûbiyyet kaidelerinin en büyüğü, Yaratan'ın zâtı ile mahlûkun zâtı arasında mutlak ayrılığa (mübâyenete) inanmaktır;"], [2059.0, "bunu da rubûbiyyet kaidelerinde açıklamıştım."], [2064.0, "İkinci manaya gelince: Eğer hayyizle \"münhâz\"ı, yani bir şeyden ayrılmış olanı kastediyorsan —\"Falanca bizden inhiyâz etti (ayrıldı)\" yani ayrıldı;"], [2078.0, "\"Mezhebimizden inhiyâz etti\" yani ondan çıktı ve ayrıldı—, hayyiz \"ayrılmış\" anlamında gelir."], [2088.0, "Eğer bunu, yani Allah'ın halkından ayrı olduğunu kastediyorsan, bu hak bir manadır."], [2098.0, "Çünkü biz, Allah Azze ve Celle'nin zâtında halkının zâtlarından hiçbir şey bulunmadığına,"]]}]}, {"ts": "35:09", "title": "3. Külliye (devam): \"Bâin\" ifadesi · 5. örnek: «Mâ semme illallah» ve vahdet-i vücûd", "paras": [{"reader": false, "ar": [[2109.0, "ولا في شيءٍ من ذوات خلقه شيءٌ من ذاته،"], [2114.0, "فهو منفصلٌ عن خلقه."], [2117.0, "ولكنّ هذا المعنى الحقّ لا أُعبّر عنه بأنه منحازٌ أو حيّز،"], [2124.0, "وإنما أُعبّر عنه بما أجمعت كلمةُ أهل السنّة والجماعة على التعبير به،"], [2130.0, "وهي أنّني أقول: فوق سماواته،"], [2133.6, "مستوٍ على عرشه، بائنٌ ـ بائنٌ من خلقه."], [2139.0, "لا أقول: منحاز، ولا:"], [2140.3, "في حيّز، وإنما أقول: بائنٌ من خلقه."]], "tr": [[2109.0, "halkının zâtlarından hiçbirinde de O'nun zâtından bir şey bulunmadığına inanırız;"], [2117.0, "O, halkından ayrıdır. Fakat bu hak manayı \"münhâzdır\" veya \"hayyizdir\" diye ifade etmem;"], [2125.1, "bilakis Ehl-i Sünnet ve'l-Cemaat'in kendisiyle ifade etmekte sözbirliği ettiği şekilde ifade ederim."], [2132.2, "O da şöyle dememdir: (Allah) göklerinin üstündedir, Arşı'na istivâ etmiştir, ayrıdır —halkından ayrıdır (bâindir)."], [2140.3, "\"Münhâz\" demem, \"hayyizde\" de demem;"], [2142.6, "bilakis \"halkından ayrıdır (bâindir)\" derim."]]}, {"reader": false, "ar": [[2145.0, "المثال الخامس ـ إن كنتم فيكم … <span class=\"q\">؟ 35:45<\/span> ـ المثال الخامس:"], [2154.0, "إن سمعتَ رجلًا من أهل البدع يقول:"], [2159.6, "«ما ثَمَّ إلا الله»،"], [2162.0, "«ما ثَمَّ إلا الله» ـ ومعنى «ثَمَّ» أي:"], [2169.2, "هناك، كما قال الله عز وجل:"], [2173.0, "<span class=\"ayah\">﴿وَإِذَا رَأَيْتَ ثَمَّ﴾<\/span> أي هناك <span class=\"ayah\">﴿رَأَيْتَ نَعِيمًا وَمُلْكًا كَبِيرًا﴾<\/span> <span class=\"ref\">[الإنسان: ٢٠]<\/span> ـ فإذا قالوا لك:"], [2181.7, "«ما ثَمَّ إلا الله»،"], [2184.0, "فقل: أمّا هذا التعبير فأنا أتوقّف فيه،"], [2189.0, "فلا أُثبته ولا أنفيه؛"], [2192.0, "لعدم وجود الدليل الذي يدلّ على إثباته بعينه،"], [2197.0, "ولا على نفيه بعينه."]], "tr": [[2145.0, "Beşinci örnek —içinizde … varsa <span class=\"q\">؟<\/span>— beşinci örnek:"], [2154.0, "Bid'at ehlinden bir adamın \"Mâ semme illallah\" (Orada Allah'tan başkası yoktur), \"Mâ semme illallah\" dediğini işitirsen —\"semme\" \"orada\" demektir;"], [2169.2, "nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2173.0, "<span class=\"ayah\">﴿Oraya baktığın zaman﴾<\/span> —yani orada— <span class=\"ayah\">﴿bir nimet ve büyük bir mülk görürsün﴾<\/span> [İnsân 20]—, sana \"Mâ semme illallah\" derlerse, de ki:"], [2184.7, "Bu ifadeye gelince, ben onda tevakkuf ederim;"], [2188.3, "onu ne isbat ederim ne de nefyederim."], [2192.0, "Çünkü onun bizzat isbatına da bizzat nefyine de delalet eden bir delil yoktur."]]}, {"reader": false, "ar": [[2199.0, "وأمّا معناه فأستفصل فيه،"], [2202.0, "فأقول: ماذا تقصد بقولك:"], [2204.5, "ما هناك إلا الله؟"], [2207.0, "هل تقصد بأنه ما ثَمَّ ربٌّ إلا الله،"], [2212.0, "ما ثَمَّ إلهٌ إلا الله،"], [2215.0, "ما ثَمَّ مدبّرٌ ومتصرّفٌ لهذا العالم إلا الله،"], [2221.0, "ما ثَمَّ مالكٌ إلا الله؟"], [2224.0, "فلا جَرَمَ أنّ هذا المعنى حقّ،"], [2226.0, "وأنا أُثبته لله عز وجل،"], [2229.0, "ولكن أُعبّر عنه بالتعبير الشرعيّ:"], [2232.5, "<span class=\"ayah\">﴿بِيَدِهِ الْمُلْكُ﴾<\/span> <span class=\"ref\">[الملك: ١]<\/span>، <span class=\"ayah\">﴿خَالِقُ كُلِّ شَيْءٍ﴾<\/span> <span class=\"ref\">[الأنعام: ١٠٢]<\/span>،"], [2237.0, "ونحو هذه التعبيرات التي وردت في الكتاب والسنّة."]], "tr": [[2199.0, "Manasına gelince, onda istifsâl eder ve derim ki:"], [2204.5, "\"Orada Allah'tan başkası yoktur\" sözünle neyi kastediyorsun?"], [2208.2, "Allah'tan başka rab yoktur, Allah'tan başka ilah yoktur, bu âlemi Allah'tan başka idare eden ve onda tasarruf eden yoktur, Allah'tan başka mâlik yoktur demeyi mi kastediyorsun?"], [2224.0, "Şüphesiz bu mana haktır ve ben onu Allah Azze ve Celle için isbat ederim."], [2229.0, "Fakat onu şer'î ifadeyle ifade ederim:"], [2232.5, "<span class=\"ayah\">﴿Mülk O'nun elindedir﴾<\/span> [Mülk 1], <span class=\"ayah\">﴿Her şeyin yaratıcısıdır﴾<\/span> [En'âm 102] ve Kitap ve Sünnet'te varid olan bunun gibi ifadeler."]]}, {"reader": false, "ar": [[2241.0, "وأمّا إذا كنتَ تقصد «ما ثَمَّ إلا الله» أي:"], [2248.7, "ما ثَمَّ موجودٌ إلا الله،"], [2252.0, "فهذا حقيقةُ مذهب الحلوليّة والاتّحاديّة؛"], [2256.6, "فيقولون: أيُّ شيءٍ يَصدُق عليه اسمُ الموجود فيَصدُق عليه اسمُ الله."], [2264.0, "السماواتُ موجودة، إذن السماواتُ هي الله."], [2269.0, "الأرضُ موجودة، إذن الأرضُ هي الله."], [2271.0, "الخلقُ موجودون، إذن الخلقُ هم عينُ الله."], [2274.0, "الأصنامُ موجودة، إذن الأصنامُ هي الله."], [2277.0, "فكلُّ شيءٍ موجودٍ فإنّ عينك تراه ـ عفوًا ـ فإنه هو الله عز وجل،"], [2286.0, "وإن اختلفت صورُ الموجودات،"], [2288.3, "ولكنها في الحقيقة هي ذاتُ الله عز وجل."]], "tr": [[2241.0, "Ama \"Mâ semme illallah\" sözüyle \"Orada Allah'tan başka mevcut yoktur\" demeyi kastediyorsan, bu, Hulûliyye ve İttihâdiyye mezhebinin ta kendisidir."], [2256.6, "Derler ki: \"Mevcut\" isminin doğru olarak söylendiği her şey için \"Allah\" ismi de doğru olarak söylenir."], [2264.0, "Gökler mevcuttur; o hâlde gökler Allah'tır."], [2269.0, "Yer mevcuttur; o hâlde yer Allah'tır."], [2271.0, "Mahlûklar mevcuttur; o hâlde mahlûklar Allah'ın ta kendisidir."], [2274.0, "Putlar mevcuttur; o hâlde putlar Allah'tır."], [2277.0, "Mevcut olan ve gözünün gördüğü her şey —affedersiniz— Allah Azze ve Celle'nin ta kendisidir."], [2286.0, "Mevcutların suretleri farklı olsa da hakikatte onlar Allah Azze ve Celle'nin zâtıdır (derler)."]]}, {"reader": false, "ar": [[2293.0, "ولذلك هذا المذهبُ وأصحابُه يُصحّحون عباداتِ المشركين؛"], [2299.0, "لأنّ المشرك يسجد للصنم،"], [2301.0, "وذاتُ الله قد حلّت في الصنم."], [2304.0, "بل يقولون: قد أصاب فرعونُ لمّا قال:"], [2307.2, "<span class=\"ayah\">﴿مَا عَلِمْتُ لَكُم مِّنْ إِلَٰهٍ غَيْرِي﴾<\/span> <span class=\"ref\">[القصص: ٣٨]<\/span>؛"], [2310.0, "لأنّ فرعون موجود، إذن فيه شيءٌ من ذات الله عز وجل."], [2315.0, "ويُصحّحون قولَ فرعون لمّا قال:"], [2317.8, "<span class=\"ayah\">﴿أَنَا رَبُّكُمُ الْأَعْلَىٰ﴾<\/span> <span class=\"ref\">[النازعات: ٢٤]<\/span>؛ لأنّ جزءًا من ذات الربوبيّة قد حلّت فيه."]], "tr": [[2293.0, "Bu sebeple bu mezhep ve mensupları müşriklerin ibadetlerini doğru sayarlar;"], [2299.0, "çünkü müşrik puta secde eder, Allah'ın zâtı ise (onlara göre) puta girmiştir."], [2304.0, "Hatta derler ki: Firavun <span class=\"ayah\">﴿Sizin için benden başka bir ilah bilmiyorum﴾<\/span> [Kasas 38] dediğinde isabet etmiştir;"], [2310.0, "çünkü Firavun mevcuttur, o hâlde onda Allah Azze ve Celle'nin zâtından bir şey vardır."], [2315.0, "Firavun'un <span class=\"ayah\">﴿Ben sizin en yüce rabbinizim﴾<\/span> [Nâziât 24] sözünü de doğru sayarlar;"], [2319.5, "çünkü (onlara göre) rubûbiyyet zâtından bir cüz ona girmiştir."]]}, {"reader": false, "ar": [[2324.0, "ويجعلون الزوجةَ عينَ الأمّ،"], [2326.8, "فيُجيزون جماعَ الأمّ ويُجيزون جماعَ الزوجة،"], [2334.0, "ويجعلون عينَ الماء هي عينَ الخمر،"], [2337.6, "والخمرَ هي عينَ الماء."], [2340.0, "فالأشياءُ في الظاهر وإن اختلفت صورُها في النظر،"], [2344.0, "إلا أنها عينٌ واحدة."], [2346.0, "وهذا المذهبُ هو أكفرُ <span class=\"q\">؟ 39:06<\/span> المذاهب على الإطلاق."]], "tr": [[2324.0, "Eşi annenin ta kendisi sayarlar;"], [2326.8, "böylece anneyle cinsel ilişkiyi de eşle cinsel ilişkiyi de caiz görürler."], [2335.2, "Suyun aynını içkinin aynı, içkiyi de suyun aynı sayarlar."], [2340.0, "(Onlara göre) eşyanın suretleri zahirde ve bakışta farklı olsa da hepsi tek bir aynıdır (varlıktır)."], [2346.0, "Bu mezhep, mutlak olarak mezheplerin en kâfirce olanıdır <span class=\"q\">؟<\/span>."]]}, {"reader": false, "ar": [[2353.0, "والخلاصةُ من ذلك: أنّ لفظة «الحيّز» لا أُثبتها ولا أنفيها،"], [2360.0, "وأمّا معناه فأستفصل فيه:"], [2363.0, "فإن أُريد به أنّ الله قد حاز في ذاته ذواتِ خلقه،"], [2369.0, "أو أنّ المخلوقين قد حازوا ذاتَه في ذواتهم،"], [2374.0, "فهذا كفرٌ أكبرُ مُخرجٌ من الملّة بالكلّيّة."], [2379.0, "وأمّا إذا كان يُراد به أنّ الله منحازٌ بمعنى منفصلٌ عن خلقه،"], [2385.0, "فليس في ذاته شيءٌ من ذوات خلقه،"], [2388.0, "ولا في خلقه شيءٌ من ذاته،"], [2391.0, "فهذا المعنى حقّ، ولكن لا أُسمّيه بالحيّز،"], [2395.0, "وإنما أُسمّيه بالبائن، فأقول:"], [2399.7, "الله فوق سماواته، مستوٍ على عرشه استواءً يليق بجلاله وعظمته،"], [2406.3, "منفصلٌ ـ أو بائنٌ ـ من خلقه."]], "tr": [[2353.0, "Bundan çıkan sonuç şudur: \"Hayyiz\" lafzını ne isbat ederim ne de nefyederim."], [2359.3, "Manasına gelince, onda istifsâl ederim:"], [2363.0, "Eğer onunla Allah'ın kendi zâtında halkının zâtlarını kuşattığı (hayyizine aldığı) veya mahlûkların O'nun zâtını kendi zâtlarında kuşattığı kastediliyorsa, bu, insanı dinden tamamen çıkaran büyük küfürdür."], [2379.0, "Ama onunla Allah'ın münhâz, yani halkından ayrı olduğu kastediliyorsa —O'nun zâtında halkının zâtlarından hiçbir şey, halkında da O'nun zâtından hiçbir şey yoktur—, bu mana haktır."], [2390.0, "Fakat ona \"hayyiz\" adını vermem;"], [2392.7, "bilakis \"bâin\" (ayrı) adını veririm ve derim ki:"], [2399.7, "Allah göklerinin üstündedir, celâline ve azametine lâyık bir istivâ ile Arşı'na istivâ etmiştir, halkından ayrıdır —veya bâindir—."]]}]}, {"ts": "40:10", "title": "4. Külliye: Allah'ın kendisinden nefyettiği her şey, O'nun zıddıyla vasıflı olmasındandır · Kapanış", "paras": [{"reader": false, "ar": [[2410.0, "ومن الكلّيّات أيضًا، وهي كلّيّةٌ خفيفة:"], [2415.0, "<b>كلُّ ما نفاه الله عن نفسه فلأنّه متّصفٌ بضدّه.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span> <b>كلُّ ما نفاه الله عن نفسه فلأنّه متّصفٌ بضدّه.<\/b>"]], "tr": [[2410.0, "Külliyelerden biri de —hafif bir külliyedir— şudur:"], [2415.0, "4. külliye: Allah'ın kendisinden nefyettiği her şey, O'nun onun zıddıyla vasıflı olmasındandır. (Üç kez tekrar ediyor.) 4."], [2430.8, "külliye: Allah'ın kendisinden nefyettiği her şey, O'nun onun zıddıyla vasıflı olmasındandır."]]}, {"reader": false, "ar": [[2437.0, "طيّب، خلّوها للدرس القادم إن شاء الله."], [2440.6, "والله أعلم، وصلى الله وسلم على نبيّنا."]], "tr": [[2437.0, "Peki, onu gelecek derse bırakın inşallah."], [2440.2, "Allah en iyisini bilir. Allah Peygamberimize salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
