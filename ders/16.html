<script>
const D={"no": 16, "vid": "87O49FewLKo", "title_ar": "الدرس (١٦) من شرح كليات العقيدة — تابع: كليات في القضاء والقدر", "title_tr": "Şerhu Külliyyâti'l-Akîde — 16. Ders: Kaza ve Kadere Dair Külliyeler (Kulların Fiilleri, Mübrem ve Muallak Kader, Kaderle İhticac, Teshîr ve Tahyîr)", "sections": [{"ts": "00:00", "title": "1. Külliye: Kulların yaptığı her şey yaratma ve takdir yönüyle Allah'a, tahsil ve kesb yönüyle kullara nispet edilir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.9, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.8, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.1, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [10.0, "<span class=\"ayah\">﴿سُبْحَانَكَ لَا عِلْمَ لَنَا إِلَّا مَا عَلَّمْتَنَا ۖ إِنَّكَ أَنتَ الْعَلِيمُ الْحَكِيمُ﴾<\/span> <span class=\"ref\">[البقرة: ٣٢]<\/span>."], [16.0, "لا نزال في سياق قواعد توحيد الربوبية ممثَّلةً في قواعد القضاء والقدر،"], [23.9, "وعندنا في هذا الدرس عشرُ كلّيّات."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.4, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.0, "<span class=\"ayah\">﴿Seni tenzih ederiz! Bize öğrettiğinden başka hiçbir bilgimiz yoktur. Şüphesiz sen her şeyi bilensin, hüküm ve hikmet sahibisin﴾<\/span> [Bakara 32]."], [16.0, "Hâlâ kaza ve kader kaideleri şeklinde temsil edilen rubûbiyyet tevhidi kaideleri bağlamındayız."], [23.9, "Bu derste on külliyemiz var."]]}, {"reader": false, "ar": [[29.0, "الكلّيّة الأولى: كلُّ ما يفعله العباد فمنسوبٌ..."], [32.5, "فيُنسب إلى الله؛ كلُّ ما يفعله العباد فيُنسب إلى الله خلقًا وتقديرًا،"], [40.1, "وإلى العباد تحصيلًا واكتسابًا. كلُّ ما يفعله العباد فمنسوبٌ إلى الله عز وجل خلقًا وتقديرًا،"], [52.0, "وإليهم تحصيلًا واكتسابًا؛ أي:"], [57.6, "وإلى العباد تحصيلًا واكتسابًا."], [60.0, "أُعيدها مرةً ثالثة: كلُّ ما يفعله العباد فيُنسب إلى الله خلقًا وتقديرًا،"], [66.0, "وإلى العباد تحصيلًا واكتسابًا."]], "tr": [[29.0, "Birinci külliye: Kulların yaptığı her şey nispet edilmiştir..."], [32.5, "Allah'a nispet edilir; 1. külliye:"], [34.0, "Kulların yaptığı her şey, yaratma ve takdir yönüyle Allah'a, tahsil ve kesb (kazanma) yönüyle kullara nispet edilir. Kulların yaptığı her şey, yaratma ve takdir yönüyle Allah Azze ve Celle'ye, tahsil ve kesb yönüyle de onlara nispet edilmiştir;"], [57.0, "yani tahsil ve kesb yönüyle kullara."], [60.0, "Üçüncü kez tekrar ediyorum: Kulların yaptığı her şey, yaratma ve takdir yönüyle Allah'a, tahsil ve kesb yönüyle kullara nispet edilir."]]}, {"reader": false, "ar": [[68.0, "أقول وبالله التوفيق: قوله:"], [71.2, "«كلّ»: هذه كلّيّةٌ تبقى على عمومها،"], [75.5, "فيدخل فيها أفعالُ الخير وأفعالُ الشرّ."], [80.0, "قوله: «فيُنسب إلى الله خلقًا وتقديرًا وإلى العباد تحصيلًا واكتسابًا»:"], [87.0, "وهذه الكلّيّة تبيّن مذهب أهل السنة والجماعة في أفعال العباد،"], [92.0, "ونحن في هذا المذهب وسطٌ بين طائفتين في باب القضاء والقدر:"], [98.0, "إلى طائفة الجبرية الذين ينسبون فعلَ العبد بكلّ متعلَّقاته إلى الله عز وجل؛"], [105.0, "فالعبد عندهم في أفعاله ليس له ـ ولا ـ مطلقُ القدرة،"], [109.2, "ولا مطلقُ المشيئة، ولا مطلقُ الاختيار؛"], [112.0, "فجميع ما يصدر من العباد بكلّ متعلَّقاته هم ينسبونه إلى الله تبارك وتعالى."]], "tr": [[68.0, "Tevfik Allah'tandır, derim ki: \"Her\" sözü:"], [70.4, "Bu, umumiliği üzere kalan bir külliyedir;"], [74.1, "hayır fiilleri de şer fiilleri de buna girer."], [80.0, "\"Yaratma ve takdir yönüyle Allah'a, tahsil ve kesb yönüyle kullara nispet edilir\" sözü:"], [87.0, "Bu külliye, kulların fiilleri konusunda Ehl-i Sünnet ve'l-Cemaat'in mezhebini açıklar."], [91.5, "Biz bu mezhepte, kaza ve kader babında iki taife arasında orta yoldayız:"], [98.0, "Birincisi, kulun fiilini bütün taalluklarıyla Allah Azze ve Celle'ye nispet eden Cebriyye taifesidir."], [105.0, "Onlara göre kulun fiillerinde ne mutlak bir kudreti, ne mutlak bir meşîeti (dilemesi), ne de mutlak bir ihtiyarı (seçimi) vardır."], [112.0, "Kullardan sadır olan her şeyi bütün taalluklarıyla Allah Tebâreke ve Teâlâ'ya nispet ederler."]]}, {"reader": false, "ar": [[121.0, "وبين مذهب القدرية الذين يجعلون فعلَ العبد بكلّ متعلَّقاته منسوبًا إلى العبد؛"], [130.0, "فالله عز وجل لم يخلق فعلَ العباد،"], [133.5, "ولم يشأها منهم، ولم يخترها لهم،"], [137.0, "وإنما العبد نفسه هو الذي شاء فعلَه،"], [141.0, "وشاء تحصيلَه، وشاء اكتسابَه."], [145.0, "فتأتيك هذه الكلّيّة لتبيّن الوسطيةَ في مذهب أهل السنة والجماعة في هذه المسألة القدرية العظيمة،"], [155.0, "وتبيّن أنّ أفعال العباد ليست منسوبةً إلى الله مطلقًا ردًّا على الجبرية،"], [161.0, "وليست منسوبةً إلى العبد مطلقًا ردًّا على القدرية،"], [165.0, "وإنما فيها شائبتان ومتعلَّقان:"], [169.0, "متعلَّقٌ يرجع إلى الله عز وجل،"], [171.4, "ومتعلَّقٌ يرجع إلى المخلوق."]], "tr": [[121.0, "Diğeri de kulun fiilini bütün taalluklarıyla kula nispet eden Kaderiyye mezhebidir."], [130.0, "(Onlara göre) Allah Azze ve Celle kulların fiilini yaratmamış, onlardan dilememiş ve onlar için seçmemiştir;"], [137.0, "fiilini dileyen, onu tahsil etmeyi dileyen ve kazanmayı dileyen bizzat kulun kendisidir."], [145.0, "İşte bu külliye, bu büyük kader meselesinde Ehl-i Sünnet ve'l-Cemaat mezhebindeki orta yolu açıklamak için gelir."], [154.4, "Kulların fiillerinin, Cebriyye'ye reddiye olarak mutlak surette Allah'a nispet edilmediğini, Kaderiyye'ye reddiye olarak da mutlak surette kula nispet edilmediğini açıklar."], [163.0, "Bilakis onlarda iki yön ve iki taalluk vardır:"], [169.0, "Allah Azze ve Celle'ye dönen bir taalluk ve mahlûka dönen bir taalluk."]]}, {"reader": false, "ar": [[173.0, "أمّا المتعلَّق الذي يرجع إلى الله تبارك وتعالى فهو متعلَّق الخلق والتقدير؛"], [181.0, "فالله عز وجل هو الذي علم فعلَ العبد،"], [186.2, "وكتبه في اللوح المحفوظ قضاءً وقدرًا،"], [190.2, "وشاءه بمشيئته الكونية، وخلقه؛"], [195.0, "ففعلُ العبد بهذا الاعتبار يُنسب إلى الله عز وجل."], [201.0, "ولكن يُنسب إلى العبد باعتبار تحصيله واكتسابه وفعله واقترافه؛"], [210.0, "فالعبد هو الذي يفعل حقيقةً،"], [213.5, "ويكتسب حقيقةً، ويقترف الفعلَ حقيقةً."]], "tr": [[173.0, "Allah Tebâreke ve Teâlâ'ya dönen taalluk, yaratma ve takdir taallukudur."], [181.0, "Kulun fiilini bilen, onu Levh-i Mahfûz'da kaza ve kader olarak yazan, kevnî meşîetiyle dileyen ve onu yaratan Allah Azze ve Celle'dir."], [195.0, "Bu itibarla kulun fiili Allah Azze ve Celle'ye nispet edilir."], [201.0, "Fakat tahsili, kesbi, işlemesi ve iktirâfı (irtikâbı) itibarıyla da kula nispet edilir."], [210.0, "Çünkü gerçekten yapan, gerçekten kazanan ve fiili gerçekten irtikâb eden kuldur."]]}, {"reader": false, "ar": [[220.0, "فالله عز وجل هو الذي قدّر وخلق صلاةَ العبد،"], [224.2, "ولكنّ العبد هو الذي صلّى حقيقةً فعلًا واكتسابًا."], [228.0, "والله عز وجل هو الذي خلق زكاةَ العبد وقدّرها وقضاها،"], [234.0, "ولكنّ العبد هو الذي باشر إخراجها تحصيلًا واكتسابًا."], [238.0, "و... والله عز وجل هو الذي خلق صيامَ العبد وشاءه وقدّره،"], [244.0, "ولكنّ العبد هو الذي صام حقيقةً."], [247.0, "فكلُّ فعلٍ يصدر من العبد فلا بد أن يُنسب إلى الله خلقًا وتقديرًا،"], [253.0, "وإلى المخلوق تحصيلًا واكتسابًا."]], "tr": [[220.0, "Kulun namazını takdir eden ve yaratan Allah Azze ve Celle'dir;"], [223.8, "fakat fiil ve kesb olarak gerçekten namaz kılan kuldur."], [228.0, "Kulun zekâtını yaratan, takdir eden ve hükmeden Allah Azze ve Celle'dir;"], [233.4, "fakat tahsil ve kesb olarak onu çıkarmayı bizzat yapan kuldur."], [238.0, "Ve... Kulun orucunu yaratan, dileyen ve takdir eden Allah Azze ve Celle'dir;"], [244.5, "fakat gerçekten oruç tutan kuldur."], [247.0, "Kuldan sadır olan her fiil, mutlaka yaratma ve takdir yönüyle Allah'a, tahsil ve kesb yönüyle mahlûka nispet edilmelidir."]]}, {"reader": false, "ar": [[256.0, "وعلى ذلك دلّت الأدلةُ من الكتاب والسنة،"], [260.0, "كقول الله عز وجل:"], [262.7, "<span class=\"ayah\">﴿وَخَلَقَ كُلَّ شَيْءٍ فَقَدَّرَهُ تَقْدِيرًا﴾<\/span> <span class=\"ref\">[الفرقان: ٢]<\/span>،"], [266.0, "وهذه كلّيّةٌ يدخل فيها أفعالُ العباد."], [271.0, "ومن عجائب القدرية أنهم أخرجوا منها فعلَ العبد الذي يدخل بالإجماع،"], [279.0, "وأدخلوا فيها القرآنَ الذي لا يدخل فيها بالإجماع؛"], [286.0, "فأخرجوا ما واجبُه الدخول،"], [288.9, "وأدخلوا ما واجبُه الخروج."], [293.0, "وقولُ الله عز وجل:"], [295.6, "<span class=\"ayah\">﴿اللَّهُ خَالِقُ كُلِّ شَيْءٍ﴾<\/span> <span class=\"ref\">[الزمر: ٦٢]<\/span>،"], [298.1, "وأفعالُ العباد تدخل في هذا العموم."]], "tr": [[256.0, "Kitap ve Sünnet'ten deliller buna delâlet etmiştir."], [258.9, "Allah Azze ve Celle'nin şu sözü gibi:"], [262.7, "<span class=\"ayah\">﴿Her şeyi yaratmış ve ona bir ölçü vermiştir﴾<\/span> [Furkân 2]."], [271.0, "Bu, kulların fiillerinin de girdiği bir külliyedir."], [274.5, "Kaderiyye'nin tuhaflıklarındandır ki icmâ ile buna giren kulun fiilini ondan çıkardılar, icmâ ile ona girmeyen Kur'an'ı ise içine soktular."], [286.0, "Girmesi gerekeni çıkardılar, çıkması gerekeni soktular."], [289.6, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [295.6, "<span class=\"ayah\">﴿Allah her şeyin yaratıcısıdır﴾<\/span> [Zümer 62]."], [298.8, "Kulların fiilleri bu umuma girer."]]}]}, {"ts": "05:02", "title": "1. Külliye (devam): Kitap ve Sünnet'ten deliller; iyilik ve kötülüğün Allah'tan oluşu", "paras": [{"reader": false, "ar": [[302.0, "وقال الله عز وجل:"], [304.9, "<span class=\"ayah\">﴿وَاللَّهُ خَلَقَكُمْ وَمَا تَعْمَلُونَ﴾<\/span> <span class=\"ref\">[الصافات: ٩٦]<\/span>،"], [308.0, "أي: خلقكم وعملَكم ومعمولَكم؛"], [313.0, "لأنّ السلف يفسّرون هذه الآية بالتفسيرين؛"], [317.0, "لأنّ قول الله عز وجل:"], [320.5, "«وما» هذا اسمٌ موصولٌ بمعنى «الذي»،"], [324.6, "و«تعملون» فعلٌ مضارع."], [327.6, "ولّا لا؟ طيب. فإذًا يدخل في ذلك عملُ العبد الذي هو صفةٌ له،"], [339.0, "وما يفعله الذي هو معمولٌ له؛"], [342.0, "فكلاهما يدخلان. وهذا من باب التفسير الذي يشتمل على معانٍ متعددة،"], [352.0, "والمتقرّر في القواعد أنّ اللفظ إذا احتمل معنيين لا تنافيَ بينهما فإنه يُحمل عليهما."]], "tr": [[302.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [304.9, "<span class=\"ayah\">﴿Sizi de yaptıklarınızı da Allah yaratmıştır﴾<\/span> [Sâffât 96];"], [313.0, "yani sizi, amelinizi ve amel ettiğiniz şeyi yaratmıştır."], [317.0, "Çünkü selef bu ayeti iki tefsirle açıklar."], [320.5, "Zira Allah Azze ve Celle'nin sözündeki \"mâ\", \"ellezî\" (-ki o şey) anlamında bir ism-i mevsûldür;"], [327.6, "\"ta'melûn\" ise muzâri fiildir. Öyle değil mi?"], [331.4, "Peki. O hâlde buna, kulun sıfatı olan ameli de, onun amel ettiği şey olan yaptığı şey de girer;"], [342.0, "ikisi de girer. Bu, birden çok anlamı içine alan tefsir türündendir."], [349.4, "Kaidelerde sabit olan şudur: Bir lafız, aralarında çelişki olmayan iki anlama ihtimalli ise her ikisine de hamledilir."]]}, {"reader": false, "ar": [[359.0, "وأيضًا يقول النبي صلى الله عليه وسلم:"], [366.0, "«إنّ الله يصنع كلَّ صانعٍ وصنعتَه»،"], [373.0, "وفي لفظٍ: «إنّ الله خالقُ كلِّ صانعٍ وصنعتِه»."], [377.0, "قال الإمام البخاري رحمه الله تعالى في «خلق أفعال العباد»:"], [382.0, "«فأخبر أنّ الصناعات وأهلَها مخلوقة». انتهى كلامه."]], "tr": [[359.0, "Ayrıca Nebî ﷺ şöyle buyurur:"], [366.0, "«Allah her san'atkârı da san'atını da yapar.» Bir lafızda da:"], [374.0, "«Allah her san'atkârın da san'atının da yaratıcısıdır.» İmam Buhârî —Allah ona rahmet etsin— \"Halku Ef'âli'l-İbâd\"da şöyle der:"], [382.0, "\"(Nebî ﷺ) san'atların da san'atkârların da mahlûk olduğunu haber vermiştir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[388.0, "وفي الصحيح يقول النبي صلى الله عليه وسلم لمّا سُئل:"], [393.7, "«يا رسول الله، أرأيتَ ما يعمل الناسُ اليوم ويكدحون فيه، أشيءٌ قُضي عليهم ومضى فيهم من قدرٍ سبق، أم فيما يستقبلونه مما أتاهم به نبيُّهم وثبتت الحجةُ عليهم؟ فقال: لا، بل شيءٌ قُضي عليهم ومضى فيهم» <span class=\"note\">(Müslim)<\/span>."], [414.0, "فجميع ما يعمله العباد ويكدحون فيه من الأعمال،"], [418.0, "من خيرٍ أو شرّ،"], [420.0, "فهو شيءٌ جرى به قلمُ القدر، وسبق به القضاء."]], "tr": [[388.0, "Sahîh'te, Nebî ﷺ'e şöyle sorulduğunda:"], [393.7, "«Ey Allah'ın Resûlü! İnsanların bugün yaptıkları ve uğrunda çabaladıkları şey hakkında ne dersin? O, onlar hakkında hükmedilmiş ve önceden geçmiş bir kaderle onlarda cereyan etmiş bir şey midir, yoksa peygamberlerinin kendilerine getirdiği ve aleyhlerine hüccetin sabit olduğu şeylerden (yeni) karşılaşacakları bir şey midir?» O şöyle buyurdu:"], [414.0, "«Hayır, bilakis onlar hakkında hükmedilmiş ve onlarda cereyan etmiş bir şeydir.» <span class=\"note\">(Müslim)<\/span>."], [417.5, "Kulların yaptığı ve uğrunda çabaladığı hayır ya da şer bütün ameller, kader kaleminin onunla cereyan ettiği ve kazanın onunla önceden geçtiği bir şeydir."]]}, {"reader": false, "ar": [[426.0, "ويقول النبي صلى الله عليه وسلم:"], [430.2, "«كلُّ شيءٍ بقدرِ الله، حتى العجزُ والكَيْسُ» <span class=\"note\">(Müslim)<\/span>."], [435.0, "ويدخل في هذه الكلّيّة أفعالُ العباد التي ضرب لها مثالين:"], [441.7, "بالعجز، وهو الفتور عن العمل،"], [445.0, "والكَيْس، وهو النشاط والعزيمة والجدّ والهمّة في العمل."], [452.0, "ويدلّ عليها أيضًا قولُ النبي صلى الله عليه وسلم:"], [458.0, "«كتب الله مقاديرَ الخلائق قبل أن يخلق السماوات والأرض بخمسين ألف سنة» <span class=\"note\">(Müslim)<\/span>."]], "tr": [[426.0, "Nebî ﷺ şöyle buyurur: «Her şey Allah'ın kaderiyledir; acizlik ve zekâ (becerikli olmak) bile.» <span class=\"note\">(Müslim)<\/span>."], [435.0, "Bu külliyeye, (Nebî ﷺ'in) iki misal verdiği kulların fiilleri girer:"], [441.7, "Acizlik, yani amelden gevşemek; keys, yani amelde canlılık, azim, ciddiyet ve himmet."], [452.0, "Nebî ﷺ'in şu sözü de buna delâlet eder:"], [458.0, "«Allah, gökleri ve yeri yaratmadan elli bin yıl önce mahlûkatın kaderlerini yazdı.» <span class=\"note\">(Müslim)<\/span>."]]}, {"reader": false, "ar": [[467.0, "ويدلّ عليها قولُ الله عز وجل:"], [472.0, "<span class=\"ayah\">﴿إِن تُصِبْهُمْ حَسَنَةٌ يَقُولُوا هَٰذِهِ مِنْ عِندِ اللَّهِ ۖ وَإِن تُصِبْهُمْ سَيِّئَةٌ يَقُولُوا هَٰذِهِ مِنْ عِندِكَ ۚ قُلْ كُلٌّ مِّنْ عِندِ اللَّهِ﴾<\/span> <span class=\"ref\">[النساء: ٧٨]<\/span>،"], [487.1, "أي: خلقًا وتقديرًا. فالله عز وجل نسب الحسنات والسيئات أنها من عنده خلقًا وتقديرًا وإيجادًا؛"], [498.0, "فلا تكون الحسنات والسيئات إلا بمشيئته الكونية."]], "tr": [[467.0, "Allah Azze ve Celle'nin şu sözü de buna delâlet eder:"], [472.0, "<span class=\"ayah\">﴿Onlara bir iyilik dokunursa \"Bu Allah katındandır\" derler; bir kötülük dokunursa \"Bu senin yüzündendir\" derler. De ki: Hepsi Allah katındandır﴾<\/span> [Nisâ 78];"], [485.2, "yani yaratma ve takdir yönüyle."], [487.8, "Allah Azze ve Celle iyilikleri ve kötülükleri, yaratma, takdir ve icat yönüyle kendi katından olarak nispet etmiştir."], [498.0, "İyilikler ve kötülükler ancak O'nun kevnî meşîetiyle olur."]]}, {"reader": false, "ar": [[503.0, "فإن قلتَ: وكيف نجمع بين هذه الآية والآية التي بعدها،"], [509.4, "وهي قوله عز وجل مفرِّقًا بين الحسنة والسيئة في قوله:"], [516.2, "<span class=\"ayah\">﴿مَّا أَصَابَكَ مِنْ حَسَنَةٍ فَمِنَ اللَّهِ ۖ وَمَا أَصَابَكَ مِن سَيِّئَةٍ فَمِن نَّفْسِكَ﴾<\/span> <span class=\"ref\">[النساء: ٧٩]<\/span>؟"], [525.0, "فكيف يُنكر الله عز وجل عليهم تقسيمَ الحسنات والسيئات في الآية الأولى بقوله:"], [531.4, "<span class=\"ayah\">﴿كُلٌّ مِّنْ عِندِ اللَّهِ﴾<\/span>،"], [533.0, "ثم هو نفسُه قسّم الحسنات والسيئات،"], [538.0, "فجعل الحسنات منه والسيئات من قِبَل نفس العبد؟"]], "tr": [[503.0, "\"Bu ayet ile ondan sonraki ayeti nasıl bağdaştırırız?\" dersen —ki o, Allah Azze ve Celle'nin iyilik ile kötülük arasında ayrım yaparak söylediği şu sözdür:"], [516.2, "<span class=\"ayah\">﴿Sana gelen her iyilik Allah'tandır; sana gelen her kötülük ise kendindendir﴾<\/span> [Nisâ 79]—."], [525.0, "Allah Azze ve Celle birinci ayette <span class=\"ayah\">﴿Hepsi Allah katındandır﴾<\/span> sözüyle onların iyilik ve kötülükleri taksim etmesini nasıl reddeder de sonra kendisi iyilikleri ve kötülükleri taksim ederek iyilikleri kendinden, kötülükleri de kulun nefsinden kılar?"]]}, {"reader": false, "ar": [[541.0, "الجواب: لا إشكال في ذلك،"], [543.0, "بل هذا مما يؤيّد كلّيّتنا؛"], [546.0, "وهي أنّ الحسنات والسيئات في الآية الأولى تتكلّم عن خلقها وتقديرها؛"], [553.0, "فلمّا قسّموا باعتبار الخلق والتقدير أنكر الله عليهم هذا التقسيمَ بقوله:"], [558.0, "<span class=\"ayah\">﴿قُلْ كُلٌّ مِّنْ عِندِ اللَّهِ﴾<\/span>،"], [560.2, "أي: خلقًا وتقديرًا وإيجادًا."], [562.0, "وأمّا في الآية الثانية فإنه يتكلّم عن الحسنات والسيئات باعتبار التحصيل والاكتساب؛"], [570.0, "فالعبد له قدرةٌ واختيارٌ في تحصيل الحسنة،"], [575.0, "وله قدرةٌ واختيارٌ في فعل السيئة."], [579.0, "فالآية الأولى تتكلّم عن الحسنات والسيئات تقديرًا وخلقًا وإيجادًا،"], [585.0, "والآية الثانية تتكلّم عن الحسنات والسيئات تحصيلًا واكتسابًا."]], "tr": [[541.0, "Cevap: Bunda bir problem yoktur;"], [543.0, "bilakis bu, külliyemizi destekleyen şeylerdendir."], [546.0, "Şöyle ki birinci ayetteki iyilikler ve kötülükler onların yaratılmasından ve takdirinden bahseder."], [553.0, "Onlar yaratma ve takdir itibarıyla taksim edince, Allah bu taksimi <span class=\"ayah\">﴿De ki: Hepsi Allah katındandır﴾<\/span> sözüyle reddetti;"], [560.7, "yani yaratma, takdir ve icat yönüyle."], [563.1, "İkinci ayette ise iyiliklerden ve kötülüklerden tahsil ve kesb itibarıyla bahseder."], [570.0, "Kulun iyiliği tahsil etmede kudreti ve ihtiyarı vardır;"], [574.3, "kötülüğü işlemede de kudreti ve ihtiyarı vardır."], [579.0, "Birinci ayet iyilik ve kötülüklerden takdir, yaratma ve icat yönüyle;"], [585.0, "ikinci ayet ise tahsil ve kesb yönüyle bahseder."]]}]}, {"ts": "09:53", "title": "1. Külliye (devam): Kulun fiilinin kula nispet edildiğine dair deliller", "paras": [{"reader": false, "ar": [[593.0, "وإذا تأمّلتَ هذه الآيات والنصوص التي ذكرتُها لك يتبيّن لك أنّ كلّ فعلٍ ـ أفعالَ العباد ـ فهي من الله خلقًا وتقديرًا."], [610.0, "وهذه الجزئية من الأدلة هي التي اكتفت بها الجبرية،"], [616.0, "فقالوا: إنّ أفعال العباد بكلّ متعلَّقاتها تُنسب إلى الله."], [621.0, "وهذا من أعظم الخلط والغلط في البحث العلمي:"], [627.0, "أنّ الإنسان يستعجل بالنظر في جزئيةٍ من الأدلة،"], [632.0, "فيُخرج نتيجتها قبل النظر في الجزء الثاني."], [637.0, "فلا ينبغي للإنسان أبدًا أن يستعجل في استخراج النتائج إلا إذا استوفى أدلةَ المسألة كلَّها."]], "tr": [[593.0, "Sana zikrettiğim bu ayetleri ve nasları düşündüğünde, kulların fiillerinin her birinin yaratma ve takdir yönüyle Allah'tan olduğu sana açıkça ortaya çıkar."], [612.0, "Cebriyye'nin yetindiği şey, delillerin bu kısmıdır;"], [616.6, "bu yüzden \"Kulların fiilleri bütün taalluklarıyla Allah'a nispet edilir\" dediler."], [621.0, "Bu, ilmî araştırmadaki en büyük karışıklık ve hatalardandır:"], [627.0, "İnsanın delillerin bir kısmına bakmakta acele edip diğer kısmına bakmadan onun sonucunu çıkarması."], [637.0, "İnsan, meselenin bütün delillerini tamamlamadıkça sonuç çıkarmakta asla acele etmemelidir."]]}, {"reader": false, "ar": [[646.0, "وبما أنّ هناك أدلةً تدلّ على أنّ أفعال العباد تُنسب إلى الله خلقًا وتقديرًا،"], [653.0, "فأيضًا هناك أدلةٌ تدلّ على أنها تُنسب إلى العبد تحصيلًا واكتسابًا؛"], [660.0, "كقول الله عز وجل:"], [662.2, "<span class=\"ayah\">﴿فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ ۝ وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ﴾<\/span> <span class=\"ref\">[الزلزلة: ٧–٨]<\/span>،"], [668.8, "فنسب العملَ إلى العبد،"], [671.0, "وهذه نسبةُ تحصيلٍ واكتساب."], [673.0, "وقال الله عز وجل:"], [675.8, "<span class=\"ayah\">﴿لِيُذِيقَهُم بَعْضَ الَّذِي عَمِلُوا﴾<\/span> <span class=\"ref\">[الروم: ٤١]<\/span>،"], [678.5, "فنسب العملَ للعبد. وقال الله عز وجل في آياتٍ متعددة:"], [685.8, "<span class=\"ayah\">﴿بِمَا كَسَبَتْ أَيْدِيكُمْ﴾<\/span> <span class=\"ref\">[الشورى: ٣٠]<\/span>، فنسب الكسبَ للعبد."]], "tr": [[646.0, "Kulların fiillerinin yaratma ve takdir yönüyle Allah'a nispet edildiğine delâlet eden deliller olduğu gibi, tahsil ve kesb yönüyle kula nispet edildiğine delâlet eden deliller de vardır."], [660.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [662.2, "<span class=\"ayah\">﴿Kim zerre ağırlığınca bir hayır yaparsa onu görür. Kim de zerre ağırlığınca bir şer yaparsa onu görür﴾<\/span> [Zilzâl 7–8]."], [668.8, "Burada ameli kula nispet etmiştir;"], [670.5, "bu da bir tahsil ve kesb nispetidir."], [673.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [675.8, "<span class=\"ayah\">﴿Yaptıklarının bir kısmını onlara tattırmak için﴾<\/span> [Rûm 41];"], [682.0, "ameli kula nispet etmiştir. Allah Azze ve Celle birçok ayette <span class=\"ayah\">﴿ellerinizin kazandıkları yüzünden﴾<\/span> [Şûrâ 30] buyurmuştur; kesbi kula nispet etmiştir."]]}, {"reader": false, "ar": [[689.0, "وقال الله عز وجل:"], [691.2, "<span class=\"ayah\">﴿وَمَن يَقْتَرِفْ حَسَنَةً نَّزِدْ لَهُ فِيهَا حُسْنًا﴾<\/span> <span class=\"ref\">[الشورى: ٢٣]<\/span>،"], [695.0, "وفي الآية الأخرى: <span class=\"ayah\">﴿بِمَا كَانُوا يَقْتَرِفُونَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٢٠]<\/span>،"], [700.0, "فنسب الاقترافَ للعبد. بل إنّ الله عز وجل ينسب مشيئةَ العمل للعبد أحيانًا،"], [708.0, "كقول الله عز وجل:"], [710.2, "<span class=\"ayah\">﴿لِمَن شَاءَ مِنكُمْ أَن يَسْتَقِيمَ﴾<\/span> <span class=\"ref\">[التكوير: ٢٨]<\/span>،"], [713.0, "فنسب الاستقامةَ للعباد، أي:"], [715.7, "تحصيلًا واكتسابًا. وقولِ الله عز وجل:"], [719.1, "<span class=\"ayah\">﴿لِمَن شَاءَ مِنكُمْ أَن يَتَقَدَّمَ﴾<\/span>،"], [721.7, "أي: بفعل الطاعات والإيمان بالرسل،"], [724.3, "<span class=\"ayah\">﴿أَوْ يَتَأَخَّرَ﴾<\/span> <span class=\"ref\">[المدثر: ٣٧]<\/span>، أي: بتكذيب الرسل وترك الطاعة."]], "tr": [[689.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [691.2, "<span class=\"ayah\">﴿Kim bir iyilik kazanırsa, onun iyiliğini artırırız﴾<\/span> [Şûrâ 23]."], [693.9, "Diğer ayette de: <span class=\"ayah\">﴿irtikâb ettikleri şeyler yüzünden﴾<\/span> [En'âm 120];"], [697.3, "iktirâfı (irtikâbı) kula nispet etmiştir."], [702.0, "Hatta Allah Azze ve Celle bazen amelin meşîetini (dilemesini) kula nispet eder."], [706.8, "Allah Azze ve Celle'nin şu sözü gibi:"], [710.2, "<span class=\"ayah\">﴿İçinizden doğru yolda gitmeyi dileyen için﴾<\/span> [Tekvîr 28];"], [712.4, "istikameti kullara nispet etmiştir, yani tahsil ve kesb yönüyle."], [715.7, "Allah Azze ve Celle'nin şu sözü de:"], [719.1, "<span class=\"ayah\">﴿İçinizden öne geçmeyi﴾<\/span> —yani taatleri yapmak ve resullere iman etmekle— <span class=\"ayah\">﴿veya geri kalmayı dileyen için﴾<\/span> [Müddessir 37] —yani resulleri yalanlamak ve taati terk etmekle—."]]}, {"reader": false, "ar": [[728.0, "ولذلك قال الإمام الخطّابي رحمه الله تعالى:"], [732.6, "«الله سبحانه خالقُ الخير والشرّ جميعًا، لا يكون شيءٌ منهما إلا بمشيئته؛ فهما ـ أي الخير والشرّ ـ مضافان إلى الله خلقًا وإيجادًا، وإلى الفاعلين لهما من عباده فعلًا واكتسابًا»."], [754.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[728.0, "Bu yüzden İmam Hattâbî —Allah ona rahmet etsin— şöyle demiştir:"], [730.6, "\"Allah Sübhânehû hayrın da şerrin de yaratıcısıdır;"], [732.6, "onlardan hiçbir şey ancak O'nun meşîetiyle olur."], [736.5, "Bu ikisi —yani hayır ve şer— yaratma ve icat yönüyle Allah'a, fiil ve kesb yönüyle de kullarından onları işleyenlere izafe edilir.\" Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[757.0, "وكقول الله عز وجل:"], [759.0, "<span class=\"ayah\">﴿وَلَوْ شَاءَ اللَّهُ مَا اقْتَتَلُوا﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٣]<\/span>،"], [761.0, "فنسب الاقتتالَ لهم، أي:"], [763.7, "تحصيلًا واكتسابًا. وعليه أيضًا قولُ الله عز وجل:"], [769.0, "<span class=\"ayah\">﴿أَنفِقُوا مِن طَيِّبَاتِ مَا كَسَبْتُمْ﴾<\/span> <span class=\"ref\">[البقرة: ٢٦٧]<\/span>،"], [773.0, "وقولُ الله عز وجل:"], [775.3, "<span class=\"ayah\">﴿لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ﴾<\/span> <span class=\"ref\">[البقرة: ٢٨٦]<\/span>،"], [780.0, "فنسب الكسبَ للعبد. وقال الله عز وجل:"], [783.0, "<span class=\"ayah\">﴿تِلْكَ أُمَّةٌ قَدْ خَلَتْ ۖ لَهَا مَا كَسَبَتْ وَلَكُم مَّا كَسَبْتُمْ﴾<\/span> <span class=\"ref\">[البقرة: ١٣٤]<\/span> <span class=\"note\">(Şeyh «ما اكتسبتم» diyor)<\/span>."]], "tr": [[757.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [759.0, "<span class=\"ayah\">﴿Allah dileseydi onlar birbirleriyle savaşmazlardı﴾<\/span> [Bakara 253];"], [760.3, "savaşmayı onlara nispet etmiştir, yani tahsil ve kesb yönüyle."], [763.7, "Allah Azze ve Celle'nin şu sözü de bu türdendir:"], [769.0, "<span class=\"ayah\">﴿Kazandıklarınızın iyilerinden infak edin﴾<\/span> [Bakara 267]."], [772.2, "Allah Azze ve Celle'nin şu sözü de:"], [775.3, "<span class=\"ayah\">﴿Kazandığı (iyilik) kendi lehine, kazandığı (kötülük) de kendi aleyhinedir﴾<\/span> [Bakara 286];"], [780.0, "kesbi kula nispet etmiştir. Allah Azze ve Celle şöyle buyurmuştur:"], [783.0, "<span class=\"ayah\">﴿Onlar gelip geçmiş bir ümmettir. Onların kazandıkları kendilerine, sizin kazandıklarınız da sizedir﴾<\/span> [Bakara 134]."]]}, {"reader": false, "ar": [[789.0, "ويقول الله عز وجل:"], [793.0, "<span class=\"ayah\">﴿وَذَرُوا ظَاهِرَ الْإِثْمِ وَبَاطِنَهُ ۚ إِنَّ الَّذِينَ يَكْسِبُونَ الْإِثْمَ سَيُجْزَوْنَ بِمَا كَانُوا يَقْتَرِفُونَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٢٠]<\/span>،"], [801.8, "فنسب الكسبَ والاقترافَ للعبد."], [805.0, "وقال الله عز وجل:"], [806.8, "<span class=\"ayah\">﴿وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ﴾<\/span> <span class=\"ref\">[الإنسان: ٣٠]<\/span>،"], [809.6, "فنسب المشيئةَ للعبد؛ أي:"], [811.7, "ما تشاؤون تحصيلًا واكتسابًا وفعلًا وعملًا،"], [816.0, "إلا أن يشاء الله خلقًا وتقديرًا وإيجادًا."], [822.0, "وقال الله عز وجل:"], [824.4, "<span class=\"ayah\">﴿وَذُوقُوا عَذَابَ الْخُلْدِ بِمَا كُنتُمْ تَعْمَلُونَ﴾<\/span> <span class=\"ref\">[السجدة: ١٤]<\/span>،"], [828.0, "ويقول الله عز وجل:"], [830.7, "<span class=\"ayah\">﴿وَنُودُوا أَن تِلْكُمُ الْجَنَّةُ أُورِثْتُمُوهَا بِمَا كُنتُمْ تَعْمَلُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ٤٣]<\/span>."], [836.0, "والآيات في هذا متعددة."]], "tr": [[789.0, "Allah Azze ve Celle şöyle buyurur:"], [793.0, "<span class=\"ayah\">﴿Günahın açığını da gizlisini de bırakın. Günah kazananlar, irtikâb ettikleri şeyler yüzünden cezalandırılacaklardır﴾<\/span> [En'âm 120];"], [801.0, "kesbi ve iktirâfı kula nispet etmiştir."], [805.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [806.8, "<span class=\"ayah\">﴿Allah dilemedikçe siz dileyemezsiniz﴾<\/span> [İnsân 30];"], [809.2, "meşîeti kula nispet etmiştir. Yani tahsil, kesb, fiil ve amel olarak dilediğiniz şeyi, Allah yaratma, takdir ve icat olarak dilemedikçe dileyemezsiniz."], [822.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [824.4, "<span class=\"ayah\">﴿Yaptıklarınız yüzünden ebedî azabı tadın﴾<\/span> [Secde 14]."], [827.4, "Allah Azze ve Celle şöyle buyurur:"], [830.7, "<span class=\"ayah\">﴿Onlara \"İşte yaptıklarınız karşılığında size miras kılınan cennet budur\" diye seslenilir﴾<\/span> [A'râf 43]. Bu konudaki ayetler çoktur."]]}, {"reader": false, "ar": [[839.0, "فهذا دليلٌ ـ وفّقكم الله ـ على أنّ أفعال العباد فيها تلك الشائبتان اللتان عجز الجبريةُ والقدريةُ أن يجمعوا بينهما،"], [855.0, "وإنما وفّق الله عز وجل أهلَ السنة للجمع بينهما."], [860.0, "فالنصوص الأولى تدلّ على أنّ فعل العبد يُنسب إلى الله خلقًا وتقديرًا،"], [866.0, "والنصوص الثانية تدلّ على أنّ فعل العبد يُنسب إليه تحصيلًا واكتسابًا. والله أعلم."]], "tr": [[839.0, "—Allah sizi muvaffak kılsın— bu, kulların fiillerinde Cebriyye'nin ve Kaderiyye'nin bir araya getirmekten aciz kaldığı o iki yönün bulunduğunun delilidir."], [853.6, "Allah Azze ve Celle ancak Ehl-i Sünnet'i bu ikisini birleştirmeye muvaffak kılmıştır."], [860.0, "Birinci grup naslar, kulun fiilinin yaratma ve takdir yönüyle Allah'a nispet edildiğine;"], [865.0, "ikinci grup naslar ise tahsil ve kesb yönüyle kula nispet edildiğine delâlet eder. Allah en iyisini bilir."]]}]}, {"ts": "14:33", "title": "2. Külliye: Her ihtiyarî fiilde kulun kudreti, meşîeti ve ihtiyarı vardır", "paras": [{"reader": false, "ar": [[873.0, "الكلّيّة الثانية: <b>كلُّ فعلٍ اختياريٍّ فللعبد فيه قدرةٌ ومشيئةٌ واختيار.<\/b> كلُّ فعلٍ اختياريٍّ فللعبد فيه قدرةٌ ومشيئةٌ واختيار."], [889.0, "كلُّ فعلٍ اختياريٍّ فللعبد فيه قدرةٌ ومشيئةٌ واختيار."], [899.0, "وهذه القاعدة فيها الردُّ على الجبرية الذين ينفون عن العبد قدرته واختياره في أفعاله الاختيارية."]], "tr": [[873.0, "İkinci külliye: <b>2. külliye: Her ihtiyarî (iradeye bağlı) fiilde kulun kudreti, meşîeti ve ihtiyarı vardır.<\/b> (İki kez tekrar ediyor.) Bu kaidede, ihtiyarî fiillerinde kulun kudretini ve ihtiyarını nefyeden Cebriyye'ye reddiye vardır."]]}, {"reader": false, "ar": [[908.0, "قوله: «كلُّ فعلٍ اختياري»:"], [913.0, "فتقييدُ هذه الأفعال بالاختيارية يُخرج الأفعالَ الاضطرارية التي تقع على العبد بلا اختيارٍ منه؛"], [922.0, "فهذه لا تدخل معنا في هذه الكلّيّة."], [928.0, "فهذه الأفعال الاضطرارية إنما تُنسب إلى الله عز وجل خلقًا وإيجادًا فقط،"], [934.0, "وليس فيها شائبةٌ تُنسب إلى المخلوق،"], [938.0, "كارتعاش المريض، أو الإكراه المُلجِئ الذي يسلب العبدَ قدرته واختياره،"], [944.7, "على تفاصيلَ في كتب الأصول."]], "tr": [[908.0, "\"Her ihtiyarî fiil\" sözü: Bu fiilleri \"ihtiyarî\" olmakla kayıtlamak, kulun ihtiyarı olmadan onun üzerinde meydana gelen ıztırarî (zorunlu) fiilleri dışarıda bırakır;"], [922.0, "bunlar bizimle birlikte bu külliyeye girmez."], [923.5, "Bu ıztırarî fiiller sadece yaratma ve icat yönüyle Allah Azze ve Celle'ye nispet edilir;"], [928.0, "onlarda mahlûka nispet edilen bir yön yoktur."], [932.5, "Hastanın titremesi veya kulun kudretini ve ihtiyarını elinden alan ilcâî (tam) ikrah gibi;"], [943.3, "usul kitaplarında bunun ayrıntıları vardır."]]}, {"reader": false, "ar": [[949.0, "فجميع الأفعال الاختيارية إنما تصدر عن العبد وهو مختارٌ لها،"], [956.0, "والله عز وجل قد خلق في العبد مشيئةً وقدرةً على الفعل وعدم الفعل،"], [962.0, "كما قال الله عز وجل:"], [964.5, "<span class=\"ayah\">﴿لِمَن شَاءَ مِنكُمْ أَن يَسْتَقِيمَ﴾<\/span> <span class=\"ref\">[التكوير: ٢٨]<\/span>،"], [967.0, "ومن لوازم المشيئة القدرةُ والاختيار."], [971.0, "وكقول الله عز وجل:"], [973.0, "<span class=\"ayah\">﴿وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ﴾<\/span> <span class=\"ref\">[الإنسان: ٣٠]<\/span>،"], [976.0, "فنسب المشيئةَ لهم، ومن لوازمها القدرةُ والاختيار."], [980.0, "وكذلك قولُ الله عز وجل:"], [983.2, "<span class=\"ayah\">﴿فَمَن شَاءَ فَلْيُؤْمِن وَمَن شَاءَ فَلْيَكْفُرْ﴾<\/span> <span class=\"ref\">[الكهف: ٢٩]<\/span>،"], [987.0, "وهذه المشيئة دليلٌ على أنّ العبد له قدرةٌ واختيار."]], "tr": [[949.0, "Bütün ihtiyarî fiiller ancak kul onları seçmiş olarak ondan sadır olur."], [955.3, "Allah Azze ve Celle kulda, yapmaya ve yapmamaya dair bir meşîet ve kudret yaratmıştır."], [961.1, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [964.5, "<span class=\"ayah\">﴿İçinizden doğru yolda gitmeyi dileyen için﴾<\/span> [Tekvîr 28]."], [967.8, "Kudret ve ihtiyar, meşîetin lâzımlarındandır."], [971.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [973.0, "<span class=\"ayah\">﴿Allah dilemedikçe siz dileyemezsiniz﴾<\/span> [İnsân 30];"], [975.0, "meşîeti onlara nispet etmiştir; kudret ve ihtiyar da onun lâzımlarındandır."], [980.0, "Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [983.2, "<span class=\"ayah\">﴿Dileyen iman etsin, dileyen inkâr etsin﴾<\/span> [Kehf 29]."], [987.7, "Bu meşîet, kulun kudreti ve ihtiyarı olduğunun delilidir."]]}, {"reader": false, "ar": [[993.0, "فكلُّ مشيئةٍ تُنسب إلى العبد في النصوص فهي دليلٌ على أنّ العبد ليس بمجبورٍ على أفعاله كما تقوله الجبرية."], [1005.0, "وكقول الله عز وجل:"], [1007.9, "<span class=\"ayah\">﴿فَمَن شَاءَ ذَكَرَهُ﴾<\/span> <span class=\"ref\">[عبس: ١٢]<\/span>، وقولِ الله عز وجل:"], [1012.8, "<span class=\"ayah\">﴿فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ سَبِيلًا﴾<\/span> <span class=\"ref\">[المزمل: ١٩]<\/span>،"], [1017.0, "وقولِ الله عز وجل:"], [1019.2, "<span class=\"ayah\">﴿لِمَن شَاءَ مِنكُمْ أَن يَسْتَقِيمَ﴾<\/span> <span class=\"ref\">[التكوير: ٢٨]<\/span>،"], [1022.0, "وقولِ الله عز وجل:"], [1024.5, "<span class=\"ayah\">﴿لَا إِكْرَاهَ فِي الدِّينِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٦]<\/span>،"], [1027.0, "أي: لا يمكن أبدًا أن يُكرِه اللهُ عز وجل أحدًا على الدخول في الدين بمشيئته الكونية."]], "tr": [[993.0, "Naslarda kula nispet edilen her meşîet, Cebriyye'nin dediği gibi kulun fiillerinde mecbur olmadığının delilidir."], [1000.6, "Allah Azze ve Celle'nin şu sözü gibi:"], [1005.0, "<span class=\"ayah\">﴿Dileyen onu düşünüp öğüt alır﴾<\/span> [Abese 12]."], [1008.6, "Allah Azze ve Celle'nin şu sözü:"], [1012.8, "<span class=\"ayah\">﴿Dileyen Rabbine bir yol tutar﴾<\/span> [Müzzemmil 19]."], [1016.3, "Allah Azze ve Celle'nin şu sözü:"], [1019.2, "<span class=\"ayah\">﴿İçinizden doğru yolda gitmeyi dileyen için﴾<\/span> [Tekvîr 28]."], [1024.5, "Allah Azze ve Celle'nin şu sözü:"], [1027.5, "<span class=\"ayah\">﴿Dinde zorlama yoktur﴾<\/span> [Bakara 256];"], [1029.0, "yani Allah Azze ve Celle'nin kevnî meşîetiyle hiç kimseyi dine girmeye zorlaması asla mümkün değildir."]]}, {"reader": false, "ar": [[1035.0, "فالعبد له مشيئةٌ واختيارٌ وقدرة،"], [1039.0, "إلا أنها لا بد أن تكون تابعةً لمشيئة الله عز وجل وقدرته واختياره؛"], [1047.0, "فالله تعالى جعل العبدَ مريدًا ومختارًا وشائيًا."], [1053.0, "وهذا دليلٌ على بطلان مذهب الجبرية؛"], [1056.0, "فمذهب الجبرية يتنافى مع العقل ومع النقل."], [1063.0, "ومن الكلّيّات أيضًا... عفوًا."]], "tr": [[1035.0, "Kulun meşîeti, ihtiyarı ve kudreti vardır;"], [1039.0, "ancak bunların mutlaka Allah Azze ve Celle'nin meşîetine, kudretine ve ihtiyarına tâbi olması gerekir."], [1047.0, "Allah Teâlâ kulu irade eden, seçen ve dileyen biri kılmıştır."], [1053.0, "Bu, Cebriyye mezhebinin bâtıl olduğunun delilidir;"], [1056.0, "Cebriyye mezhebi akla da nakle de aykırıdır. Külliyelerden biri de... Pardon."]]}, {"reader": false, "ar": [[1066.1, "إذًا العبد له قدرةٌ على الاختيار بين الإيمان والكفر،"], [1073.0, "فليس بمجبورٍ لا على أن يؤمن ولا على أن يكفر."], [1076.0, "والعبد له اختيارٌ بين البرّ والفجور،"], [1080.0, "فليس بمجبورٍ على أحدهما أبدًا."], [1083.0, "وله اختيارٌ وقدرةٌ على أن يكون مهتديًا أو ضالًّا،"], [1089.0, "وله اختيارٌ على أن يصلّي أو يترك الصلاة،"], [1094.0, "وله اختيارٌ على أن يلتزم بشعائر الدين الظاهرة والباطنة أو ألّا يلتزم."]], "tr": [[1066.1, "Demek ki kulun iman ile küfür arasında seçim yapmaya kudreti vardır;"], [1073.6, "ne iman etmeye ne de küfretmeye mecburdur."], [1076.0, "Kulun iyilik ile günah arasında seçimi vardır;"], [1080.0, "ikisinden birine asla mecbur değildir."], [1083.0, "Hidayette olmak ya da sapık olmak konusunda seçimi ve kudreti vardır;"], [1089.0, "namaz kılmak ya da namazı terk etmek konusunda seçimi vardır;"], [1094.0, "dinin zahirî ve bâtınî şiarlarına bağlı kalmak ya da kalmamak konusunda seçimi vardır."]]}, {"reader": false, "ar": [[1101.0, "فالله عز وجل لم يُجبر أحدًا كونًا ـ بمشيئته الكونية ـ على واحدٍ من هذين الطرفين،"], [1109.0, "ولكنه هداه لهما، وبيّن له صلاحَ هذا الطريق وفسادَ هذا الطريق،"], [1117.0, "ونتائجَ هذا الطريق ونتائجَ الطريق الثاني،"], [1122.0, "كما قال الله عز وجل:"], [1124.5, "<span class=\"ayah\">﴿فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا﴾<\/span> <span class=\"ref\">[الشمس: ٨]<\/span>، وقولِ الله عز وجل: <span class=\"ayah\">﴿وَهَدَيْنَاهُ النَّجْدَيْنِ﴾<\/span> <span class=\"ref\">[البلد: ١٠]<\/span>."]], "tr": [[1101.0, "Allah Azze ve Celle hiç kimseyi kevnî olarak —kevnî meşîetiyle— bu iki taraftan birine zorlamamıştır;"], [1107.9, "fakat onu bu ikisine yöneltmiş (ikisini göstermiş), ona bu yolun salâhını ve şu yolun fesadını, bu yolun sonuçlarını ve ikinci yolun sonuçlarını açıklamıştır."], [1120.8, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1124.5, "<span class=\"ayah\">﴿Sonra ona günahını ve takvasını ilham etti﴾<\/span> [Şems 8]."], [1126.0, "Allah Azze ve Celle'nin şu sözü de:"], [1127.0, "<span class=\"ayah\">﴿Ona iki yolu (hayır ve şerri) göstermedik mi?﴾<\/span> [Beled 10]."]]}, {"reader": false, "ar": [[1129.0, "لكنّ الله عز وجل لم يقهر أحدًا،"], [1132.3, "ولم يُجبر أحدًا بمشيئته الكونية على إيمانٍ ولا على كفر،"], [1137.0, "كما قال الله عز وجل:"], [1140.0, "<span class=\"ayah\">﴿وَلَوْ شَاءَ رَبُّكَ﴾<\/span> ـ أي بمشيئته الكونية ـ <span class=\"ayah\">﴿لَآمَنَ مَن فِي الْأَرْضِ كُلُّهُمْ جَمِيعًا﴾<\/span> <span class=\"ref\">[يونس: ٩٩]<\/span>،"], [1146.0, "لكنه يبقى إيمانًا لا ثوابَ لهم فيه،"], [1149.0, "لأنهم مقهورون ومجبورون عليه."]], "tr": [[1129.0, "Fakat Allah Azze ve Celle hiç kimseyi kevnî meşîetiyle ne imana ne de küfre zorla boyun eğdirmiş ve mecbur etmiştir."], [1136.5, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1140.0, "<span class=\"ayah\">﴿Rabbin dileseydi﴾<\/span> —yani kevnî meşîetiyle— <span class=\"ayah\">﴿yeryüzündeki herkes topyekûn iman ederdi﴾<\/span> [Yûnus 99]."], [1144.5, "Fakat bu, onlar için sevabı olmayan bir iman olarak kalırdı;"], [1148.1, "çünkü ona zorlanmış ve mecbur edilmiş olurlardı."]]}, {"reader": false, "ar": [[1152.0, "وهذا يدلّك على أنّ مذهب الجبرية تبطل معه الشرائعُ كلُّها؛"], [1158.0, "لأنه إذا كان العبد مجبورًا على طاعته جبرًا قسريًّا لا اختيارَ له فيه،"], [1165.0, "فتنتفي عنه مقاصدُ التكليف؛"], [1168.0, "فإنّ أعظم مقاصد التكليف امتثالُ أمر الله عز وجل،"], [1173.0, "وكيف يتحقّق هذا الامتثال في فعلٍ أنت أصلًا مجبورٌ عليه بإرادة الله عز وجل الكونية؟!"]], "tr": [[1152.0, "Bu da sana gösterir ki Cebriyye mezhebiyle birlikte bütün şeriatler bâtıl olur."], [1159.1, "Çünkü kul, taatine hiçbir seçimi olmayan zorlayıcı bir cebirle mecbur edilmişse, teklifin maksatları ondan kalkar."], [1168.0, "Teklifin en büyük maksadı Allah Azze ve Celle'nin emrine uymaktır."], [1173.0, "Aslen Allah Azze ve Celle'nin kevnî iradesiyle mecbur edildiğin bir fiilde bu itaat nasıl gerçekleşir?!"]]}, {"reader": false, "ar": [[1182.0, "فعلى مذهب الجبرية لا يستحقّ الطائعُ الثوابَ،"], [1185.8, "لأنّ طاعته قام بها قهرًا وجبرًا،"], [1189.0, "ولا يستحقّ صاحبُ المعصية العقابَ،"], [1191.5, "لأنه اتّجه لها قسرًا وجبرًا؛"], [1194.0, "فلا اختيارَ له في إيمانٍ ليُؤجَر،"], [1196.5, "ولا اختيارَ له في كفرٍ ليُعاقَب."], [1199.0, "فمذهب الجبرية تبطل معه الشرائع كلُّها،"], [1202.6, "كما سيأتي بيانُه بأوضحَ من ذلك إن شاء الله."]], "tr": [[1182.0, "Cebriyye mezhebine göre itaat eden sevaba müstahak olmaz, çünkü taatini zorla ve cebren yapmıştır;"], [1188.5, "günah işleyen de cezaya müstahak olmaz, çünkü ona zorla ve cebren yönelmiştir."], [1194.0, "Ecir alsın diye imanda bir seçimi, cezalandırılsın diye küfürde bir seçimi yoktur."], [1199.0, "Cebriyye mezhebiyle birlikte bütün şeriatler bâtıl olur;"], [1203.8, "inşallah bunun daha açık beyanı gelecektir."]]}]}, {"ts": "20:08", "title": "3. Külliye: Her mübrem takdire değişiklik, mahv ve isbat girmez", "paras": [{"reader": false, "ar": [[1208.0, "ومن الكلّيّات أيضًا: <b>كلُّ تقديرٍ مُبرَمٍ فلا يدخله التغييرُ والمحوُ والإثبات.<\/b> أُعيدها مرةً أخرى:"], [1219.0, "كلُّ تقديرٍ مُبرَمٍ ـ أي مطلقٍ ـ فلا يدخله التغييرُ والمحوُ والإثبات."]], "tr": [[1208.0, "Külliyelerden biri de şudur: 3."], [1210.1, "külliye: Her mübrem (kesinleşmiş) takdire değişiklik, mahv (silme) ve isbat (yazma) girmez. Bir kez daha tekrar ediyorum:"], [1220.4, "Her mübrem —yani mutlak— takdire değişiklik, mahv ve isbat girmez."]]}, {"reader": false, "ar": [[1229.0, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أنّ الأقدار تنقسم عند أهل السنة والجماعة إلى قسمين:"], [1237.0, "إلى قدرٍ مُبرَم، وإلى قدرٍ معلَّق."], [1242.0, "وهذه الكلّيّة لا شأنَ لها بالأقدار المعلَّقة،"], [1246.1, "وإنما تتكلّم عن الأقدار المبرَمة."], [1249.0, "فإن قلتَ: وما معنى قولك:"], [1251.9, "«التقدير المبرَم»؟ فأقول: ما كُتب في لوح الله عز وجل المحفوظ."]], "tr": [[1229.0, "Tevfik Allah'tandır, derim ki: Bil ki —Allah Teâlâ sana rahmet etsin— Ehl-i Sünnet ve'l-Cemaat'e göre kaderler iki kısma ayrılır:"], [1237.0, "mübrem kader ve muallak (bir şarta bağlı) kader."], [1242.0, "Bu külliyenin muallak kaderlerle bir ilgisi yoktur;"], [1245.5, "sadece mübrem kaderlerden bahseder. \"Mübrem takdir sözünün anlamı nedir?\" dersen, derim ki:"], [1251.9, "Allah Azze ve Celle'nin Levh-i Mahfûz'unda yazılmış olandır."]]}, {"reader": false, "ar": [[1258.0, "فما كُتب في اللوح المحفوظ فإننا نسمّيه بالقدر المبرَم،"], [1261.0, "أو نسمّيه بالقدر المطلق،"], [1265.0, "أو نسمّيه بالقدر المحتوم،"], [1269.0, "وكلّها تسمياتٌ تدلّ على أنّ هذا النوع من القدر لا يدخله لا تبديلٌ،"], [1278.0, "ولا تغييرٌ، ولا محوٌ،"], [1282.0, "ولا إثباتٌ، ولا زيادةٌ،"], [1286.0, "ولا نقصان، ولا يدخله شيءٌ من التبديل أبدًا؛"], [1292.0, "لأنه كُتب على نهايات الأشياء التي يعلمها الله عز وجل."]], "tr": [[1258.0, "Levh-i Mahfûz'da yazılmış olana mübrem kader, mutlak kader ya da mahtûm (kesin) kader deriz."], [1267.8, "Bunların hepsi, kaderin bu türüne ne değiştirme, ne başkalaştırma, ne mahv, ne isbat, ne artma ne de eksilme girmediğini gösteren isimlerdir;"], [1288.0, "ona hiçbir şekilde değişiklik girmez."], [1292.0, "Çünkü o, Allah Azze ve Celle'nin bildiği şeylerin nihayetleri üzere yazılmıştır."]]}, {"reader": false, "ar": [[1297.0, "كما قال الله عز وجل:"], [1300.0, "<span class=\"ayah\">﴿يَمْحُو اللَّهُ مَا يَشَاءُ وَيُثْبِتُ ۖ وَعِندَهُ أُمُّ الْكِتَابِ﴾<\/span> <span class=\"ref\">[الرعد: ٣٩]<\/span>،"], [1304.8, "أي: الذي لا يدخله المحوُ ولا الإثبات،"], [1309.0, "وهو اللوح المحفوظ. وقولُ الله عز وجل:"], [1313.0, "<span class=\"ayah\">﴿مَا يُبَدَّلُ الْقَوْلُ لَدَيَّ﴾<\/span> <span class=\"ref\">[ق: ٢٩]<\/span>،"], [1315.0, "أي: ما كُتب في اللوح المحفوظ."], [1318.0, "وقولُ الله عز وجل:"], [1320.3, "<span class=\"ayah\">﴿لَا تَبْدِيلَ لِكَلِمَاتِ اللَّهِ﴾<\/span> <span class=\"ref\">[يونس: ٦٤]<\/span>،"], [1322.6, "أي: الكونية المكتوبة في اللوح المحفوظ."]], "tr": [[1297.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1300.0, "<span class=\"ayah\">﴿Allah dilediğini siler, dilediğini sabit bırakır. Ümmü'l-Kitâb (ana kitap) O'nun katındadır﴾<\/span> [Ra'd 39];"], [1305.4, "yani kendisine mahv ve isbat girmeyen (kitap), o da Levh-i Mahfûz'dur."], [1311.0, "Allah Azze ve Celle'nin şu sözü:"], [1313.0, "<span class=\"ayah\">﴿Benim katımda söz değiştirilmez﴾<\/span> [Kâf 29];"], [1315.5, "yani Levh-i Mahfûz'da yazılmış olan."], [1318.0, "Allah Azze ve Celle'nin şu sözü:"], [1320.3, "<span class=\"ayah\">﴿Allah'ın kelimeleri için değişiklik yoktur﴾<\/span> [Yûnus 64];"], [1323.1, "yani Levh-i Mahfûz'da yazılmış kevnî (kelimeler)."]]}, {"reader": false, "ar": [[1326.0, "وقال الله عز وجل:"], [1328.7, "<span class=\"ayah\">﴿وَلَن يُؤَخِّرَ اللَّهُ نَفْسًا إِذَا جَاءَ أَجَلُهَا﴾<\/span> <span class=\"ref\">[المنافقون: ١١]<\/span>،"], [1333.3, "أي: المكتوب في اللوح المحفوظ."], [1337.0, "ولذلك قال... وقولُ الله عز وجل:"], [1341.1, "<span class=\"ayah\">﴿إِنَّ أَجَلَ اللَّهِ إِذَا جَاءَ لَا يُؤَخَّرُ﴾<\/span> <span class=\"ref\">[نوح: ٤]<\/span>،"], [1346.0, "وقولُ الله عز وجل:"], [1348.5, "<span class=\"ayah\">﴿وَيُؤَخِّرْكُمْ إِلَىٰ أَجَلٍ مُّسَمًّى﴾<\/span> <span class=\"ref\">[نوح: ٤]<\/span>؛"], [1351.0, "فجميع تلك الآجال إنما يريد الله عز وجل بها ما كُتب في القدر المبرَم، أي اللوح المحفوظ."]], "tr": [[1326.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1328.7, "<span class=\"ayah\">﴿Eceli geldiğinde Allah hiçbir canı asla ertelemez﴾<\/span> [Münâfikûn 11];"], [1334.0, "yani Levh-i Mahfûz'da yazılmış olan (ecel)."], [1337.0, "Bu yüzden şöyle dedi... Allah Azze ve Celle'nin şu sözü:"], [1343.1, "<span class=\"ayah\">﴿Allah'ın (takdir ettiği) ecel gelince ertelenmez﴾<\/span> [Nûh 4]."], [1348.5, "Allah Azze ve Celle'nin şu sözü:"], [1351.0, "<span class=\"ayah\">﴿Sizi belirlenmiş bir süreye kadar ertelesin﴾<\/span> [Nûh 4]."], [1353.6, "Allah Azze ve Celle bütün bu ecellerle mübrem kaderde, yani Levh-i Mahfûz'da yazılmış olanı kasteder."]]}, {"reader": false, "ar": [[1360.0, "ولمّا سمع النبي صلى الله عليه وسلم أمَّ حبيبة تدعو لنفسها ولأبيها ولأخيها بطول البقاء،"], [1368.0, "قال لها النبي صلى الله عليه وسلم:"], [1372.2, "«لقد سألتِ الله لآجالٍ مضروبة، وأيامٍ معدودة، وأرزاقٍ مقسومة، لن يُعجّل اللهُ منها شيئًا قبل حِلّه، ولن يؤخّر شيئًا منها عن حِلّه» <span class=\"note\">(Müslim)<\/span>،"], [1388.0, "حديثٌ صحيح. وكلُّ ذلك يدلّ على أنّ ما كُتب في اللوح المحفوظ فإنه أبدًا لا يدخله لا تبديلٌ،"], [1396.6, "ولا تغييرٌ، ولا زيادةٌ،"], [1398.2, "ولا نقصان، ولا محوٌ، ولا إثبات."]], "tr": [[1360.0, "Nebî ﷺ, Ümmü Habîbe'nin kendisi, babası ve kardeşi için uzun ömür duası ettiğini işitince ona şöyle buyurdu:"], [1369.8, "«Sen Allah'tan, belirlenmiş ecelleri, sayılı günleri ve taksim edilmiş rızıkları istedin. Allah onlardan hiçbir şeyi vaktinden önce öne almaz ve hiçbirini vaktinden sonraya bırakmaz.» <span class=\"note\">(Müslim)<\/span>;"], [1389.0, "sahih bir hadistir. Bütün bunlar, Levh-i Mahfûz'da yazılmış olana asla ne değiştirme, ne başkalaştırma, ne artma, ne eksilme, ne mahv ne de isbat girmeyeceğini gösterir."]]}]}, {"ts": "23:22", "title": "4. Külliye: Naslarda kaderin değişmesine dair gelen her şeyle muallak kader kastedilir", "paras": [{"reader": false, "ar": [[1402.0, "ويوضّح ذلك الكلّيّةُ التي بعدها:"], [1406.0, "<b>كلُّ ما ورد في النصوص من تغيير القدر فيُراد به القدرُ المعلَّق.<\/b> أقول وبالله التوفيق:"], [1416.5, "وهذا النوع الثاني من أنواع القضاء والقدر،"], [1420.0, "وهو القدر المعلَّق، ونعني به تلك الأقدارَ التي في صحف الملائكة؛"], [1427.0, "فهناك صحفٌ قدريّةٌ قد وكّل الله عز وجل بها ملائكة."]], "tr": [[1402.0, "Bunu, ondan sonraki külliye açıklar:"], [1406.0, "<b>4. külliye: Naslarda kaderin değişmesine dair gelen her şeyle muallak kader kastedilir.<\/b> Tevfik Allah'tandır, derim ki:"], [1416.5, "Bu, kaza ve kaderin türlerinden ikincisidir;"], [1420.0, "o da muallak kaderdir. Bununla meleklerin sahifelerindeki kaderleri kastediyoruz."], [1427.0, "Allah Azze ve Celle'nin meleklere vekil kıldığı kader sahifeleri vardır."]]}, {"reader": false, "ar": [[1435.0, "فهذه الصحف القدرية التي في أيدي الملائكة يسمّيها أهلُ السنة والجماعة بالأقدار المعلَّقة؛"], [1445.0, "فمنها ما كُتب على ما يوافق اللوحَ المحفوظ،"], [1450.0, "ومنها ما كُتب على وجه التعليق."], [1454.0, "فإذا رأيتَ النصوص تدلّ على أنّ القدر قد يتغيّر،"], [1462.0, "فاعلم أنّ هذا التغيير إنما يكون في الأقدار المعلَّقة لا في القدر المبرَم."]], "tr": [[1435.0, "Meleklerin elindeki bu kader sahifelerine Ehl-i Sünnet ve'l-Cemaat muallak kaderler der."], [1445.0, "Bunların bir kısmı Levh-i Mahfûz'a uygun olarak, bir kısmı da (bir şarta) bağlı olarak yazılmıştır."], [1454.7, "Naslarda kaderin değişebileceğine delâlet eden bir şey gördüğünde bil ki bu değişiklik mübrem kaderde değil, ancak muallak kaderlerde olur."]]}, {"reader": false, "ar": [[1471.0, "كقول الله عز وجل:"], [1473.7, "<span class=\"ayah\">﴿يَمْحُو اللَّهُ مَا يَشَاءُ وَيُثْبِتُ﴾<\/span> <span class=\"ref\">[الرعد: ٣٩]<\/span>،"], [1477.0, "أي: من الأقدار المعلَّقة؛"], [1480.0, "فيأمر الله عز وجل الملَكَ أن يكتب عمره خمسين،"], [1486.0, "فإن وصل رحمه فيُزاد إلى ستين،"], [1489.0, "فيبقى القدرُ معلَّقًا على ما يعلمه الله عز وجل."], [1494.0, "ولكنّ ما كُتب في اللوح المحفوظ لا تعليقَ فيه،"], [1498.0, "لأنّ الله يعلم الأشياءَ على مآلاتها."]], "tr": [[1471.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1473.7, "<span class=\"ayah\">﴿Allah dilediğini siler, dilediğini sabit bırakır﴾<\/span> [Ra'd 39];"], [1480.0, "yani muallak kaderlerden. Allah Azze ve Celle meleğe onun ömrünü elli (yıl) yazmasını emreder;"], [1486.5, "eğer akrabalık bağını gözetirse altmışa çıkarılır."], [1489.0, "Böylece kader, Allah Azze ve Celle'nin bildiği şeye bağlı olarak kalır."], [1494.0, "Fakat Levh-i Mahfûz'da yazılmış olanda (bir şarta) bağlılık yoktur;"], [1497.6, "çünkü Allah eşyayı varacakları sonuçlar üzere bilir."]]}]}, {"ts": "25:04", "title": "4. Külliye (devam): İki kader ayrımının çözdüğü problemler: dua, rızık, sıla-i rahim", "paras": [{"reader": false, "ar": [[1504.0, "والتقسيمُ بين نوعي القدر يجيب عن إشكالاتٍ كثيرة؛"], [1510.0, "من هذه الإشكالات: هل الدعاء يردّ القدر؟"], [1520.0, "الجواب: الدعاء لا شأنَ له بردّ القدر المبرَم،"], [1525.0, "وإنما شأنُه ـ إذا أراد الله عز وجل ـ في ردّ القدر المعلَّق؛"], [1530.0, "بمعنى أن يقدّر الله في الصحف التي في أيدي الملائكة أنّ فلانًا يُصاب يومَ كذا بحادثِ كذا،"], [1538.0, "فإن دعا كُشف عنه ذلك."]], "tr": [[1504.0, "Kaderin iki türü arasındaki bu ayrım birçok probleme cevap verir."], [1510.0, "Bu problemlerden biri: Dua kaderi geri çevirir mi?"], [1520.0, "Cevap: Duanın mübrem kaderi geri çevirmekle bir ilgisi yoktur;"], [1525.0, "onun işi —Allah Azze ve Celle dilerse— muallak kaderi geri çevirmektir."], [1530.0, "Yani Allah, meleklerin elindeki sahifelerde falancanın falan gün falan kazaya uğrayacağını takdir eder;"], [1537.1, "eğer dua ederse bu ondan kaldırılır."]]}, {"reader": false, "ar": [[1542.0, "والملَكُ ـ لأنه لا يعلم الغيب ولا المستقبل ـ يُبقيها على ما أمره الله عز وجل بكتابتها،"], [1550.0, "ولكنّ الله في القدر المبرَم يكتبها على ما يقتضيه علمُه في نهايات الأشياء ومآلاتها."], [1559.0, "فلا نقول بأنّ الدعاء يردّ القدرَ مطلقًا،"], [1563.6, "ولا أنه لا يردّ القدرَ مطلقًا،"], [1567.6, "وإنما على هذا التفصيل."]], "tr": [[1542.0, "Melek, gaybı ve geleceği bilmediği için onu, Allah Azze ve Celle'nin kendisine yazmasını emrettiği şekilde bırakır."], [1549.5, "Fakat Allah mübrem kaderde onu, eşyanın nihayetleri ve varacakları sonuçlar hakkındaki ilminin gerektirdiği şekilde yazar."], [1559.0, "Dolayısıyla ne duanın kaderi mutlak olarak geri çevirdiğini ne de mutlak olarak geri çevirmediğini söyleriz;"], [1566.9, "bilakis bu tafsilata göre söyleriz."]]}, {"reader": false, "ar": [[1571.0, "ومن الإشكالات أيضًا قولُ مَن قال:"], [1574.9, "إذا كان الرزق قسمه الله وقضاه وقدّره فإنه سيأتيني ولو لم أسعَ إليه،"], [1589.0, "وإن كان الله لم يقسمه ولم يقدّره ولم يقضه فإنني وإن سعيتُ وسعيتُ وسعيتُ فلن يأتيني ذلك؛"], [1601.0, "فما الداعي إلى فعل الأسباب إذا كان كلُّ أمرٍ قد قُضي وقُدّر؟"]], "tr": [[1571.0, "Problemlerden biri de şunu söyleyenin sözüdür:"], [1574.9, "\"Eğer rızkı Allah taksim etmiş, hükmetmiş ve takdir etmişse, ben ona koşmasam da bana gelecektir."], [1589.0, "Eğer Allah onu taksim etmemiş, takdir etmemiş ve hükmetmemişse, ben koşsam da koşsam da koşsam da o bana gelmeyecektir."], [1601.0, "Her iş hükmedilmiş ve takdir edilmişse sebeplere yapışmaya ne gerek var?\""]]}, {"reader": false, "ar": [[1608.0, "الجواب: إنّ الرزق ينقسم إلى قسمين باعتبار القضاء ـ باعتبار القدرين ـ:"], [1616.0, "فهناك أرزاقٌ كتبها الله عز وجل أن تأتيك في القدر المبرَم،"], [1621.0, "فهذه ستأتيك سواءٌ فعلتَ أسبابها أو لم تفعل أسبابها؛"], [1626.0, "فكلُّ رزقٍ مقسومٍ في القدر المبرَم فإنه سيأتي لا محالة."], [1635.0, "وأمّا القسم الثاني فهي الأرزاق التي عُلّقت على أسبابٍ في القدر المعلَّق؛"], [1642.0, "فهذه مرهونةٌ، أو منوطةٌ،"], [1645.0, "أو معلَّقةٌ بأسبابها، فمن فعل سببيّتَها قُدّرت له،"], [1653.0, "ومن لم يأتِ بسببيّتها فإنه يُحرم منها."], [1657.0, "فالدعاء بالرزق إنما ينفع استجلابًا في الأقدار المعلَّقة،"], [1662.5, "لا في الأقدار المبرَمة."]], "tr": [[1608.0, "Cevap: Rızık, kaza itibarıyla —iki kader itibarıyla— iki kısma ayrılır."], [1616.0, "Allah Azze ve Celle'nin mübrem kaderde sana gelmesini yazdığı rızıklar vardır;"], [1621.0, "bunlar, sebeplerine yapışsan da yapışmasan da sana gelecektir."], [1626.0, "Mübrem kaderde taksim edilmiş her rızık kaçınılmaz olarak gelecektir."], [1635.0, "İkinci kısım ise muallak kaderde sebeplere bağlanmış rızıklardır."], [1638.5, "Bunlar sebeplerine bağlı, rehin ya da muallaktır:"], [1642.0, "Kim onların sebebini yerine getirirse onun için takdir edilir;"], [1650.4, "kim de sebebini yerine getirmezse onlardan mahrum kalır."], [1657.0, "Rızık için dua, ancak muallak kaderlerde (rızkı) celbetmek için fayda verir, mübrem kaderlerde değil."]]}, {"reader": false, "ar": [[1666.0, "ومن الإشكالات التي يجيب عنها أيضًا هذا:"], [1670.0, "أنهم يقولون: كيف يقول النبي صلى الله عليه وسلم:"], [1676.0, "«مَن أحبّ أن يُبسط له في رزقه، أو يُنسأ له في أثره، فليصل رحمه» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [1684.0, "فإذا كانت الآجال مضروبةً ومقدَّرة،"], [1687.2, "وإذا جاء أجلُ العبد فلا يؤخَّر ساعةً ولا يُقدَّم،"], [1692.0, "فكيف تكون صلةُ الأرحام سببًا لسعة الرزق وزيادته على الأمر المقدَّر،"], [1699.0, "وسببًا لزيادة الأجل على الأجل المقدَّر؟"]], "tr": [[1666.0, "Bu (ayrımın) cevap verdiği problemlerden biri de şudur:"], [1670.0, "Diyorlar ki: Nebî ﷺ nasıl «Rızkının genişletilmesini veya ömrünün uzatılmasını seven, akrabalık bağını gözetsin» <span class=\"note\">(Buhârî, Müslim)<\/span> buyurur?"], [1680.6, "Ecel belirlenmiş ve takdir edilmişse, kulun eceli geldiğinde bir saat ne ertelenir ne de öne alınırsa, sıla-i rahim nasıl rızkın genişlemesine ve takdir edilen miktarın üzerine artmasına, ecelin de takdir edilen ecelin üzerine uzamasına sebep olur?"]]}, {"reader": false, "ar": [[1704.0, "فنقول: إنّ هذا الحديث لا يتكلّم عن القدر ـ لا يتكلّم عن القدر المطلق المبرَم ـ،"], [1711.0, "وإنما يتكلّم عن تلك الأقدار المعلَّقة التي يدخلها التغييرُ والتبديلُ والزيادةُ والنقصانُ والمحوُ والإثبات؛"], [1720.0, "فزيادةُ الأجل إنما تكون في القدر المعلَّق،"], [1727.0, "وزيادةُ الرزق وبسطُه إنما تكون في القدر المعلَّق."]], "tr": [[1704.0, "Deriz ki: Bu hadis kaderden —mutlak, mübrem kaderden— bahsetmiyor;"], [1709.5, "bilakis kendisine değişiklik, başkalaşma, artma, eksilme, mahv ve isbat giren muallak kaderlerden bahsediyor."], [1720.0, "Ecelin uzaması ancak muallak kaderde olur;"], [1724.5, "rızkın artması ve genişlemesi de ancak muallak kaderde olur."]]}, {"reader": false, "ar": [[1732.0, "ومن الإشكالات أيضًا قولُهم:"], [1734.9, "هل الدعاء يدفع الشرّ؟"], [1739.0, "الجواب: إنما يدفع الشرَّ في القضاء المعلَّق،"], [1746.0, "لا الشرَّ في القضاء المبرَم؛"], [1750.0, "فما كتب الله عز وجل في اللوح المحفوظ أنه يأتيك من الشرّ فسوف يأتيك وإن دعوتَ الله بألّا يأتيك،"], [1760.0, "لأنه قدرٌ مبرَمٌ لا بد من وقوعه."], [1762.0, "ولكن هناك أنواعٌ من الشرّ علّقها الله عز وجل على سببيّةٍ معيّنةٍ في أقداره المعلَّقة؛"], [1771.0, "فمن اتّقى سببيّتَها وقاه الله عز وجل،"], [1775.0, "ومن لم يتّقِ سببيّتَها فإنها ستصيبه لا محالة."], [1780.0, "فإذا فرّقنا بين نوعي القدر،"], [1783.7, "المبرَم والمعلَّق، حينئذٍ تزول إشكالاتٌ كثيرة، ولله الحمد والمنّة."]], "tr": [[1732.0, "Problemlerden biri de onların şu sözüdür:"], [1739.0, "Dua şerri defeder mi? Cevap:"], [1742.0, "Muallak kazadaki şerri defeder, mübrem kazadaki şerri değil."], [1750.0, "Allah Azze ve Celle'nin Levh-i Mahfûz'da sana gelmesini yazdığı şer, gelmemesi için Allah'a dua etsen de sana gelecektir;"], [1759.5, "çünkü o, meydana gelmesi kaçınılmaz mübrem bir kaderdir."], [1762.0, "Fakat Allah Azze ve Celle'nin muallak kaderlerinde belirli bir sebebe bağladığı şer türleri vardır:"], [1771.0, "Kim onların sebebinden sakınırsa Allah Azze ve Celle onu korur;"], [1775.0, "kim de sebebinden sakınmazsa o şer kaçınılmaz olarak ona isabet eder."], [1780.0, "Kaderin iki türünü, mübrem ve muallakı birbirinden ayırdığımızda birçok problem ortadan kalkar. Hamd ve minnet Allah'adır."]]}]}, {"ts": "29:51", "title": "5. Külliye: Meşru olanı yapmak ile kadere iman arasında çelişki varsayan herkes zındıktır", "paras": [{"reader": false, "ar": [[1791.0, "ومن الكلّيّات أيضًا: <b>كلُّ مَن فرض تعارضًا بين فعل المشروع والإيمان بالمقدور فزنديق.<\/b> كلُّ من فرض تعارضًا بين فعل المشروع والإيمان بالمقدور فزنديق."], [1815.0, "أُعيدها مرةً ثالثة: كلُّ من فرض تعارضًا بين فعل المشروع والإيمان بالمقدور فزنديق."]], "tr": [[1791.0, "Külliyelerden biri de şudur: 5."], [1797.0, "külliye: Meşru olanı yapmak ile makdûra (takdir edilene) iman arasında bir çelişki varsayan herkes zındıktır. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [1815.0, "Meşru olanı yapmak ile makdûra iman arasında bir çelişki varsayan herkes zındıktır."]]}, {"reader": false, "ar": [[1826.0, "أقول وبالله التوفيق: لقد جعل أهلُ السنة من جملة أصناف الزندقة أن يعارض الإنسانُ الشرعَ بالقدر معارضةً توجب له تركَ المشروع احتجاجًا بالمقدور؛"], [1843.0, "فتراه يتملّص من المأمورات فلا يفعلها،"], [1849.0, "ويحتجّ على ترك الائتمار بها بالقضاء والقدر،"], [1853.0, "وتراه يفعل المحظورات ويستدلّ على فعلها بالقضاء والقدر؛"], [1860.0, "فيحمله إيمانُه بالقضاء والقدر على ترك الأمور المشروعة."], [1866.0, "فكلُّ من وقع في ذلك فهو زنديق،"], [1869.0, "أي: أنه نوعٌ من أنواع النفاق العملي والعلمي."]], "tr": [[1826.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet, insanın şeriata kaderle, kendisine makdûrla ihticac ederek (onu delil getirerek) meşru olanı terk ettirecek şekilde muâraza etmesini zındıklık türlerinden saymıştır."], [1843.0, "Onu emredilen şeylerden sıyrılıp onları yapmazken, onlara uymayı terk etmesine kaza ve kaderi delil getirirken görürsün;"], [1852.4, "yasaklanmış şeyleri yapıp onları yapmasına kaza ve kaderle delil getirirken görürsün."], [1860.0, "Kaza ve kadere imanı onu meşru işleri terk etmeye sevk eder."], [1866.0, "Buna düşen herkes zındıktır; yani bu, amelî ve ilmî nifak türlerinden biridir."]]}, {"reader": false, "ar": [[1877.0, "لأنه في حقيقة أمره إنما يتّخذ إلهَه هواه؛"], [1886.0, "فهو لا يريد أن يمتثل مأمورًا،"], [1888.7, "ولا يترك محظورًا، ولكن يجعل تركَ المأمورات وفعلَ المحظورات بصورةٍ له فيها حجّة،"], [1898.0, "كما سيأتينا بعد قليلٍ إن شاء الله."], [1901.0, "ولذلك فحقيقةُ الإيمان هي أن تؤمن بالقضاء والقدر مقرونًا بامتثال الشرع،"], [1911.0, "كما قال الله عز وجل:"], [1913.8, "<span class=\"ayah\">﴿أَلَا لَهُ الْخَلْقُ وَالْأَمْرُ﴾<\/span> <span class=\"ref\">[الأعراف: ٥٤]<\/span>؛"], [1916.0, "فالخلق هو القضاء والقدر،"], [1919.0, "والأمر هو الشرع. فمن جعل تعارضًا بينهما فإنه لا بد وأن يقع في ورطة الاحتجاج بالقضاء على فعل الحرام."]], "tr": [[1877.0, "Çünkü o, işin hakikatinde hevâsını ilah edinmektedir."], [1886.0, "Ne bir emre uymak ister ne de bir yasağı terk etmek;"], [1890.7, "fakat emredilenleri terk etmeyi ve yasakları yapmayı, kendisi için bir delil varmış gibi bir kılığa sokar."], [1901.0, "Az sonra inşallah bu (konu) bize gelecektir."], [1904.5, "Bu yüzden imanın hakikati, kaza ve kadere, şeriata uymakla birlikte iman etmendir."], [1913.8, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1916.0, "<span class=\"ayah\">﴿Bilin ki yaratma da emir de O'nundur﴾<\/span> [A'râf 54]."], [1922.0, "Yaratma kaza ve kaderdir; emir ise şeriattir."], [1924.8, "Bu ikisi arasında bir çelişki kuran kimse, haram işlemeye kazayı delil getirme batağına mutlaka düşer."]]}, {"reader": false, "ar": [[1931.0, "ولذلك في الصحيحين من حديث عليٍّ رضي الله عنه قال:"], [1936.6, "قال النبي صلى الله عليه وسلم:"], [1940.4, "«ما منكم من أحدٍ إلا وقد كُتب مقعدُه من النار ومقعدُه من الجنة»،"], [1948.5, "وهذا هو القضاء والقدر."], [1951.0, "فسأل أصحابُ النبي صلى الله عليه وسلم سؤالًا عظيمًا،"], [1956.8, "فقالوا: «يا رسول الله، أفلا نتّكل على كتابنا» ـ أي القدري ـ «وندع العمل؟» ـ أي الشرعي ـ فقال صلى الله عليه وسلم:"], [1968.7, "«اعملوا، فكلٌّ ميسَّرٌ لما خُلق له»."]], "tr": [[1931.0, "Bu yüzden Sahîhayn'da Ali (radıyallahu anh) hadisinde şöyle geçer:"], [1936.6, "Nebî ﷺ buyurdu: «Sizden hiç kimse yoktur ki ateşteki yeri ve cennetteki yeri yazılmış olmasın.» İşte bu, kaza ve kaderdir."], [1951.0, "Nebî ﷺ'in ashâbı büyük bir soru sordular ve dediler ki:"], [1957.4, "«Ey Allah'ın Resûlü! Kitabımıza» —yani kaderî kitaba— «güvenip ameli» —yani şer'î ameli— «bırakmayalım mı?» Nebî ﷺ buyurdu:"], [1968.7, "«Amel edin; herkes ne için yaratıldıysa ona kolaylaştırılmıştır.»"]]}, {"reader": false, "ar": [[1972.0, "وفي حديث عبد الله بن عمرو بن العاص رضي الله عنهما قال:"], [1979.5, "«خرج علينا رسول الله صلى الله عليه وسلم وفي يديه كتابان، فقال: هل تدرون ما هذان الكتابان؟ قلنا: الله ورسوله أعلم. فقال للذي في يمينه: هذا كتابٌ من ربّ العالمين، فيه أسماءُ أهل الجنة وأسماءُ آبائهم وقبائلهم، ثم أُجمل على آخرهم، فلا يُزاد فيهم ولا يُنقص. وقال للذي في شماله: وهذا كتابٌ من ربّ العالمين، فيه أسماءُ أهل النار وأسماءُ آبائهم وقبائلهم، ثم أُجمل» ـ أي خُتم ـ «على آخرهم، فلا يُزاد فيهم ولا يُنقص»."], [2026.0, "إلى هنا تقريرُ أمرٍ قدري."]], "tr": [[1972.0, "Abdullah b. Amr b. el-Âs (radıyallahu anhümâ) hadisinde şöyle der:"], [1979.5, "«Resûlullah ﷺ elinde iki kitapla yanımıza çıktı ve \"Bu iki kitabın ne olduğunu biliyor musunuz?\" dedi. \"Allah ve Resûlü daha iyi bilir\" dedik. Sağ elindekine \"Bu, âlemlerin Rabbinden bir kitaptır; içinde cennet ehlinin isimleri, babalarının ve kabilelerinin isimleri vardır. Sonra sonuncularının ardından toplamı çekilmiştir; artık onlara ne eklenir ne de onlardan eksiltilir\" dedi. Sol elindekine de \"Bu da âlemlerin Rabbinden bir kitaptır; içinde ateş ehlinin isimleri, babalarının ve kabilelerinin isimleri vardır. Sonra sonuncularının ardından toplamı çekilmiştir» —yani mühürlenmiştir— «artık onlara ne eklenir ne de onlardan eksiltilir.\"» Buraya kadarki kısım kaderî bir işin takriridir."]]}, {"reader": false, "ar": [[2030.0, "فقالوا: «يا رسول الله، ففيمَ العملُ إذا كان أمرٌ قد فُرغ منه؟» ـ ففيمَ العمل إذا كان أمرٌ قد فُرغ منه؟"], [2043.0, "ـ فقال صلى الله عليه وسلم:"], [2045.0, "«اعملوا، فكلٌّ ميسَّرٌ لما خُلق له؛ فمن كان من أصحاب السعادة فسيُيسَّر لعمل السعادة، ومن كان من أصحاب الشقاوة فيُيسَّر لعمل الشقاوة»."], [2060.0, "ثم تلا قولَ الله عز وجل:"], [2063.0, "<span class=\"ayah\">﴿فَرِيقٌ فِي الْجَنَّةِ وَفَرِيقٌ فِي السَّعِيرِ﴾<\/span> <span class=\"ref\">[الشورى: ٧]<\/span>."]], "tr": [[2030.0, "Dediler ki: «Ey Allah'ın Resûlü! İş bitirilmiş bir iş ise amel ne için?» —İş bitirilmiş bir iş ise amel ne için?— Nebî ﷺ buyurdu:"], [2043.0, "«Amel edin; herkes ne için yaratıldıysa ona kolaylaştırılmıştır. Kim saadet ehlindense saadet ameline kolaylaştırılır; kim şekâvet ehlindense şekâvet ameline kolaylaştırılır.» Sonra Allah Azze ve Celle'nin şu sözünü okudu:"], [2060.0, "<span class=\"ayah\">﴿Bir grup cennette, bir grup da çılgın alevli ateştedir﴾<\/span> [Şûrâ 7]."]]}, {"reader": false, "ar": [[2066.0, "فإن قلتَ: وما سببيّةُ ترك الشرع احتجاجًا بالقدر؟"], [2075.0, "فأقول: سببيّتُها أمرٌ خطير،"], [2077.5, "وهي مطالعةُ العبد للمقدور،"], [2080.0, "وتركُ مطالعته للمأمور. والله عز وجل لم يأمرنا أبدًا بمطالعة ما قُضي وقُدّر لنا،"], [2089.0, "وإنما أمرنا بمطالعة ما أُمرنا به فنمتثله،"], [2094.0, "وما نُهينا عنه فنجتنبه."]], "tr": [[2066.0, "\"Kaderi delil getirerek şeriatı terk etmenin sebebi nedir?\" dersen, derim ki:"], [2075.0, "Onun sebebi tehlikeli bir iştir;"], [2076.9, "o da kulun makdûra bakıp emredilene bakmayı terk etmesidir."], [2083.0, "Allah Azze ve Celle bize bizim için hükmedilen ve takdir edilen şeye bakmayı asla emretmedi;"], [2089.0, "bilakis bize emredilen şeye bakıp ona uymamızı ve yasaklanan şeye bakıp ondan kaçınmamızı emretti."]]}, {"reader": false, "ar": [[2097.0, "فمتى ما انقلب نظرُ العبد عن المشروع إلى المقدور ثارت مثلُ هذه الشكوكِ والأوهامِ والأسئلةِ والخيالات التي تجعل العبدَ يترك المشروعاتِ احتجاجًا بالمقدورات،"], [2114.8, "أو بالقضاء والقدر. فإيّاك ـ أيها العبد ـ أن تطالع ما قُضي وقُدّر لك؛"], [2122.0, "فإنّ ذلك ليس من فعلك،"], [2124.8, "وليس مما أُمرتَ به،"], [2127.0, "وليس مما ستُحاسَب عنه يوم القيامة،"], [2130.0, "وليس محطًّا للثواب والعقاب؛"], [2133.0, "لأنّ القدر سرُّ الله المكتوم الذي لم يُطلع عليه أحدًا إلا من شاء الله عز وجل."]], "tr": [[2097.0, "Kulun bakışı meşru olandan makdûra döndüğü zaman, kulu makdûrları ya da kaza ve kaderi delil getirerek meşru olanları terk etmeye götüren bu tür şüpheler, vehimler, sorular ve hayaller ortaya çıkar."], [2117.0, "Ey kul! Sakın senin için hükmedilen ve takdir edilen şeyle meşgul olma."], [2122.0, "Çünkü o senin fiilin değildir, sana emredilenlerden değildir, kıyamet günü ondan hesaba çekileceğin şeylerden değildir, sevap ve cezanın konusu da değildir."], [2133.0, "Zira kader, Allah'ın gizli sırrıdır;"], [2135.8, "Allah Azze ve Celle'nin dilediği kimseler hariç ona hiç kimseyi muttali kılmamıştır."]]}, {"reader": false, "ar": [[2142.0, "والله عز وجل لم يخلقنا في أرضه لنطالع أقداره وقضاءه فنحمل المشروعَ عليها،"], [2152.0, "وإنما خلقنا في أرضه لننظر إلى المأمورات والمنهيّات فنحمل القدرَ عليها؛"], [2161.0, "يعني: بمعنى أنّ العبد إنما هو مأمورٌ بمطالعة الشرع لا بمطالعة القدر."], [2169.0, "فمثلُ هذه الأسئلة القدرية التي توجب الحيرةَ والشكوك سببُها تركُ مطالعة المشروع والاشتغالُ بمطالعة المقدور؛"], [2183.0, "فانتبهوا لذلك وفّقكم الله."]], "tr": [[2142.0, "Allah Azze ve Celle bizi yeryüzünde kaderlerine ve kazasına bakıp meşru olanı onlara hamledelim diye yaratmadı;"], [2152.0, "bilakis bizi yeryüzünde emredilenlere ve yasaklananlara bakıp kaderi onlara hamledelim diye yarattı."], [2161.0, "Yani kul, kadere bakmakla değil, şeriata bakmakla emrolunmuştur."], [2166.3, "Hayrete ve şüphelere yol açan bu tür kaderî soruların sebebi, meşru olana bakmayı terk edip makdûra bakmakla meşgul olmaktır."], [2183.0, "Buna dikkat edin, Allah sizi muvaffak kılsın."]]}]}, {"ts": "36:26", "title": "6. Külliye: Günah işlemeye kaderi delil getiren herkes bâtıl üzeredir", "paras": [{"reader": false, "ar": [[2186.0, "ويؤكّدها الكلّيّةُ التي بعدها:"], [2189.0, "<b>كلُّ محتجٍّ بالقدر على فعل المعصية فمُبطِل<\/b>،"], [2195.0, "أي: قائلٌ بالباطل. كلُّ محتجٍّ بالقدر على فعل المعصية فمبطل."], [2207.0, "كلُّ محتجٍّ بالقدر على فعل المعصية فمبطل."]], "tr": [[2186.0, "Bunu, ondan sonraki külliye pekiştirir:"], [2189.0, "<b>6. külliye: Günah işlemeye kaderi delil getiren herkes mübtıldır<\/b>;"], [2207.0, "yani bâtılı söyleyendir. (İki kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[2214.0, "أقول وبالله التوفيق: اعلم أنّ الاحتجاج بالقدر ينقسم إلى ثلاثة أقسام:"], [2222.0, "إلى قسمين سائغين، وإلى قسمٍ زائغ،"], [2231.0, "وكلُّ واحدٍ من هذه الأقسام سيأتينا فيه كلّيّةٌ خاصة."], [2237.0, "ولكنّ هذه الكلّيّة تتكلّم عن الاحتجاج بالقدر عند فعل المعصية،"], [2245.0, "والاحتجاج بالقدر على المعاصي ينقسم إلى قسمين:"]], "tr": [[2214.0, "Tevfik Allah'tandır, derim ki: Bil ki kaderle ihticac (kaderi delil getirmek) üç kısma ayrılır:"], [2222.0, "caiz olan iki kısım ve (haktan) sapmış bir kısım."], [2231.7, "Bu kısımların her biri hakkında bize özel bir külliye gelecektir."], [2237.0, "Fakat bu külliye, günah işlerken kaderi delil getirmekten bahseder."], [2243.3, "Günahlara kaderi delil getirmek de iki kısma ayrılır:"]]}, {"reader": false, "ar": [[2250.0, "إلى الاحتجاج بالقدر على معصيةٍ قد تاب صاحبُها منها التوبةَ الصادقةَ النصوحَ المستجمعةَ لشروطها،"], [2260.0, "فهذا احتجاجٌ صحيحٌ ولا غبارَ عليه؛"], [2263.0, "كمن يشرب الخمر ستين سنة،"], [2265.7, "ثم يتوب من شربها التوبةَ الصادقة،"], [2269.0, "فيُسأل عن تلك السنين في شربها،"], [2274.0, "فيقول: كلُّ ذلك بقضاء الله وقدره؛"], [2278.0, "فهذا جائزٌ لا بأس به ولا حرج فيه."]], "tr": [[2250.0, "(Birincisi,) sahibinin, şartlarını toplamış samimi ve nasûh bir tevbeyle tevbe ettiği bir günaha kaderi delil getirmektir."], [2258.9, "Bu sahih bir ihticactır, üzerinde hiçbir toz yoktur."], [2263.0, "Altmış yıl içki içip sonra ondan samimi bir tevbeyle tevbe eden ve içtiği o yıllar sorulduğunda \"Bütün bunlar Allah'ın kaza ve kaderiyledir\" diyen kimse gibi."], [2278.0, "Bu caizdir; bunda bir sakınca ve bir vebal yoktur."]]}, {"reader": false, "ar": [[2281.0, "ويُستدلّ عليه بما في الصحيحين من حديث أبي هريرة رضي الله عنه قال:"], [2291.4, "قال النبي صلى الله عليه وسلم:"], [2294.0, "«احتجّ آدمُ وموسى عند ربّهما، فحجّ آدمُ موسى. قال موسى: أنت آدمُ الذي خلقك الله بيده، ونفخ فيك من روحه، وأسكنك في جنّته، وأمر الملائكة فسجدوا لك، ثم أهبطتَ الناسَ بخطيئتك إلى الأرض؟"]], "tr": [[2281.0, "Buna Sahîhayn'daki Ebû Hüreyre (radıyallahu anh) hadisiyle delil getirilir."], [2291.4, "Nebî ﷺ buyurdu: «Âdem ile Mûsâ Rableri katında tartıştılar; Âdem, Mûsâ'ya delille galip geldi. Mûsâ dedi ki: Sen, Allah'ın kendi eliyle yarattığı, sana ruhundan üflediği, seni cennetine yerleştirdiği ve meleklere emredip sana secde ettikleri Âdem'sin; sonra hatan yüzünden insanları yeryüzüne indirdin (öyle mi)?"]]}, {"reader": false, "ar": [[2316.0, "قال آدم: وأنت موسى الذي اصطفاك الله برسالاته وبكلامه،"], [2323.0, "وأعطاك الألواحَ فيها تبيانُ كلّ شيء،"], [2327.0, "فبكم وجدتَ الله كتب التوراة قبل أن يخلقني؟"], [2332.0, "قال موسى: بأربعين سنة."]], "tr": [[2316.0, "Âdem dedi ki: Sen de Allah'ın risaletleriyle ve kelâmıyla seçtiği, sana içinde her şeyin açıklaması bulunan levhaları verdiği Mûsâ'sın."], [2327.0, "Allah'ın Tevrat'ı beni yaratmadan ne kadar önce yazdığını buldun?"], [2332.0, "Mûsâ dedi ki: Kırk yıl önce."]]}, {"reader": false, "ar": [[2335.0, "قال آدم: فهل وجدتَ فيها:"], [2338.0, "<span class=\"ayah\">﴿وَعَصَىٰ آدَمُ رَبَّهُ فَغَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ١٢١]<\/span>؟"], [2342.0, "قال موسى: نعم. قال آدم:"], [2344.2, "يا موسى، أفتلومني على أن عملتُ عملًا كتبه الله عليّ أن أعمله قبل أن يخلقني بأربعين عامًا؟"], [2357.0, "قال النبي صلى الله عليه وسلم: فحجّ آدمُ موسى» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[2335.0, "Âdem dedi ki: Peki onda <span class=\"ayah\">﴿Âdem Rabbine isyan etti ve yolunu şaşırdı﴾<\/span> [Tâhâ 121] (ifadesini) buldun mu?"], [2343.0, "Mûsâ dedi ki: Evet. Âdem dedi ki:"], [2346.0, "Ey Mûsâ! Allah'ın beni yaratmadan kırk yıl önce işlememi üzerime yazdığı bir ameli işledim diye beni mi kınıyorsun?"], [2357.0, "Nebî ﷺ buyurdu: Böylece Âdem, Mûsâ'ya delille galip geldi.» <span class=\"note\">(Buhârî, Müslim)<\/span>."]]}, {"reader": false, "ar": [[2362.0, "والعلماء مختلفون في هذه الحجّيّة على قولين يصلح حملُ الحديث عليهما جميعًا،"], [2375.0, "لأنه من خلاف التنوّع لا خلاف التضادّ <span class=\"q\">؟ 39:35<\/span>."], [2380.0, "فمنهم من قال: «أفتلومني على أن عملتُ عملًا» يقصد به الخروجَ من الجنة؛"], [2388.0, "فيكون الحديث يدلّ على جواز الاحتجاج بالقدر عند وجود المصيبة،"], [2395.0, "لأنّ أعظم المصائب التي جرت على ابن آدم خروجُ أبيهم من الجنة."]], "tr": [[2362.0, "Âlimler bu delil getirme hakkında iki görüşe ayrılmışlardır;"], [2367.7, "hadisi ikisine birden hamletmek uygundur, çünkü bu tenevvü' (çeşitlilik) ihtilafındandır, tezat ihtilafı değildir <span class=\"q\">؟<\/span>."], [2380.0, "Onlardan bazıları şöyle demiştir: \"Bir ameli işledim diye beni mi kınıyorsun?\" sözüyle cennetten çıkışı kastetmiştir."], [2388.0, "Bu durumda hadis, musibet anında kaderi delil getirmenin caiz olduğuna delâlet eder;"], [2396.2, "çünkü Âdemoğluna gelen en büyük musibet, babalarının cennetten çıkmasıdır."]]}]}, {"ts": "40:02", "title": "6. Külliye (devam): Tevbe edilmemiş günaha kaderi delil getirmenin bâtıllığı", "paras": [{"reader": false, "ar": [[2402.0, "ومن أهل العلم من قال في قوله:"], [2405.8, "«أفتلومني أن عملتُ عملًا»،"], [2408.0, "أي: الأكل من الشجرة،"], [2411.0, "وأكلُه من الشجرة من جملة المعاصي التي أخبر القرآنُ أنّ الله قد تاب عليه منها،"], [2419.0, "كما قال الله عز وجل:"], [2421.9, "<span class=\"ayah\">﴿فَتَلَقَّىٰ آدَمُ مِن رَّبِّهِ كَلِمَاتٍ فَتَابَ عَلَيْهِ﴾<\/span> <span class=\"ref\">[البقرة: ٣٧]<\/span>،"], [2426.0, "في قول الله عز وجل:"], [2428.2, "<span class=\"ayah\">﴿رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٣]<\/span>."]], "tr": [[2402.0, "Âlimlerden bazıları da \"Bir ameli işledim diye beni mi kınıyorsun?\" sözü hakkında, (bununla) ağaçtan yemeyi (kastettiğini) söylemiştir."], [2408.8, "Onun ağaçtan yemesi, Kur'an'ın, Allah'ın kendisinden dolayı tevbesini kabul ettiğini haber verdiği günahlardandır."], [2414.2, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2416.3, "<span class=\"ayah\">﴿Âdem, Rabbinden birtakım kelimeler aldı; Allah da onun tevbesini kabul etti﴾<\/span> [Bakara 37];"], [2421.9, "(bu kelimeler) Allah Azze ve Celle'nin şu sözündedir:"], [2426.0, "<span class=\"ayah\">﴿Rabbimiz! Biz kendimize zulmettik. Eğer bizi bağışlamaz ve bize merhamet etmezsen, mutlaka hüsrana uğrayanlardan oluruz﴾<\/span> [A'râf 23]."]]}, {"reader": false, "ar": [[2433.0, "فإن جعلناه على الخروج من الجنة فيكون من جملة الاحتجاج بالقدر عند نزول المصائب،"], [2441.0, "وإن جعلناه على الأكل من الشجرة فيكون من جملة الاحتجاج بالقدر على المعصية،"], [2447.0, "المعصيةِ التي قد تاب العبد منها وظهرت منه مخايلُ التوبة النصوح."]], "tr": [[2433.0, "Eğer onu cennetten çıkmaya hamledersek, musibetler inerken kaderi delil getirme türünden olur."], [2440.4, "Eğer ağaçtan yemeye hamledersek, günaha kaderi delil getirme türünden olur;"], [2446.1, "kulun tevbe ettiği ve kendisinde nasûh tevbenin alametleri görünen bir günaha."]]}, {"reader": false, "ar": [[2454.0, "والقسم الثاني: أن يحتجّ بالقدر على المعصية التي لا يزال يفعلها ويرتكبها ويقترفها،"], [2465.0, "فكلّما أنكر عليه منكِرٌ أو ذكّره مذكِّرٌ قال:"], [2470.2, "إنّ الله قضاها وقدّرها عليّ؛"], [2473.5, "ليسوّغ لنفسه الاستمرارَ على فعلها."], [2479.0, "فهذا الاحتجاج من الحجج ـ أو من الحجج الباطلة ـ بإجماع المسلمين،"], [2489.0, "وقد دلّ على بطلانها النقلُ والعقلُ والحسُّ والاعتبارُ الصحيح."]], "tr": [[2454.0, "İkinci kısım: Hâlâ işlemeye, irtikâb etmeye ve yapmaya devam ettiği bir günaha kaderi delil getirmesidir."], [2460.1, "Ne zaman biri ona itiraz etse veya bir öğüt veren ona hatırlatsa, onu işlemeye devam etmeyi kendine meşru göstermek için \"Allah bunu üzerime hükmetti ve takdir etti\" der."], [2473.5, "Bu ihticac, Müslümanların icmâıyla delillerden —ya da bâtıl delillerden— biridir."], [2482.5, "Nakil, akıl, his ve sahih itibar (düşünce) bunun bâtıl olduğuna delâlet etmiştir."]]}, {"reader": false, "ar": [[2498.0, "فأمّا من النقل فقولُ الله عز وجل:"], [2501.0, "«وقال الذين أشركوا»: <span class=\"ayah\">﴿لَوْ شَاءَ اللَّهُ مَا أَشْرَكْنَا ... وَلَا حَرَّمْنَا مِن شَيْءٍ﴾<\/span> <span class=\"ref\">[الأنعام: ١٤٨]<\/span> <span class=\"note\">(Şeyh ayete Nahl 35'in başıyla giriyor ve «من دونه» ekliyor; mushafta En'âm 148 «سَيَقُولُ» ile başlar)<\/span>،"], [2515.0, "وهذا من باب الاحتجاج بالقدر على الشرك؛"], [2519.0, "فيقولون: لو أنّ الله لم يشأ منّا أن نشرك لما وقع منّا شيءٌ من الشرك ولا التحريم."]], "tr": [[2498.0, "Nakilden (delil) Allah Azze ve Celle'nin şu sözüdür:"], [2501.0, "\"Müşrik olanlar dediler ki\": <span class=\"ayah\">﴿Allah dileseydi biz şirk koşmazdık... ve hiçbir şeyi haram kılmazdık﴾<\/span> [En'âm 148]."], [2515.6, "Bu, şirke kaderi delil getirme türündendir."], [2519.0, "Diyorlar ki: Allah bizden şirk koşmamızı dilemeseydi bizden ne şirk ne de haram kılma meydana gelirdi."]]}, {"reader": false, "ar": [[2530.0, "فوصف الله عز وجل هذه الحجّةَ بعدّة صفات:"], [2533.0, "أولًا: وصفها بالكذب في قوله:"], [2536.0, "<span class=\"ayah\">﴿كَذَٰلِكَ كَذَّبَ الَّذِينَ مِن قَبْلِهِمْ﴾<\/span>،"], [2539.0, "فهي حجّةٌ كاذبةٌ وليست حجّةً صادقة."], [2542.0, "ووصفها بأنها غيرُ مانعةٍ من العذاب في قوله:"], [2547.5, "<span class=\"ayah\">﴿حَتَّىٰ ذَاقُوا بَأْسَنَا﴾<\/span>، مع أنهم احتجّوا بها،"], [2553.3, "ولكن لم تمنعهم من عذاب الله عز وجل."], [2558.0, "ثم وصفها الله عز وجل بقوله:"], [2561.3, "<span class=\"ayah\">﴿حَتَّىٰ ذَاقُوا بَأْسَنَا ۗ قُلْ هَلْ عِندَكُم مِّنْ عِلْمٍ فَتُخْرِجُوهُ لَنَا﴾<\/span>،"], [2568.0, "فوصفها الله بأنها جهلٌ وزيفٌ وزيف."], [2573.0, "ثم قال الله عز وجل:"], [2576.0, "<span class=\"ayah\">﴿إِن تَتَّبِعُونَ إِلَّا الظَّنَّ وَإِنْ أَنتُمْ إِلَّا تَخْرُصُونَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٤٨]<\/span>،"], [2582.0, "فوصفها الله عز وجل بأنها ظنٌّ كاذب."]], "tr": [[2530.0, "Allah Azze ve Celle bu delili birkaç sıfatla nitelemiştir."], [2533.0, "Birincisi, onu şu sözüyle yalanla nitelemiştir:"], [2536.0, "<span class=\"ayah\">﴿Onlardan öncekiler de böyle yalanladılar﴾<\/span>;"], [2537.8, "demek ki bu doğru bir delil değil, yalan bir delildir."], [2542.0, "Onu şu sözüyle azaba engel olmamakla nitelemiştir:"], [2547.5, "<span class=\"ayah\">﴿Nihayet azabımızı tattılar﴾<\/span>; onlar bunu delil getirdikleri hâlde bu, onları Allah Azze ve Celle'nin azabından alıkoymadı."], [2558.0, "Sonra Allah Azze ve Celle onu şu sözüyle nitelemiştir:"], [2561.3, "<span class=\"ayah\">﴿Nihayet azabımızı tattılar. De ki: Yanınızda bize çıkarıp göstereceğiniz bir bilgi var mı?﴾<\/span>;"], [2568.0, "Allah onu cehalet ve sahtelikle nitelemiştir."], [2573.0, "Sonra Allah Azze ve Celle şöyle buyurmuştur:"], [2576.0, "<span class=\"ayah\">﴿Siz sadece zanna uyuyorsunuz ve siz sadece yalan uyduruyorsunuz﴾<\/span> [En'âm 148]."], [2581.2, "Allah Azze ve Celle onu yalan bir zan olmakla nitelemiştir."]]}, {"reader": false, "ar": [[2585.0, "ومنها أيضًا قولُ الله عز وجل:"], [2588.0, "<span class=\"ayah\">﴿وَقَالَ الَّذِينَ أَشْرَكُوا لَوْ شَاءَ اللَّهُ مَا عَبَدْنَا مِن دُونِهِ مِن شَيْءٍ نَّحْنُ وَلَا آبَاؤُنَا وَلَا حَرَّمْنَا مِن دُونِهِ مِن شَيْءٍ﴾<\/span> <span class=\"ref\">[النحل: ٣٥]<\/span>."], [2600.0, "وقال الله عز وجل:"], [2602.0, "<span class=\"ayah\">﴿أَن تَقُولَ نَفْسٌ يَا حَسْرَتَىٰ عَلَىٰ مَا فَرَّطتُ فِي جَنبِ اللَّهِ وَإِن كُنتُ لَمِنَ السَّاخِرِينَ ۝ أَوْ تَقُولَ لَوْ أَنَّ اللَّهَ هَدَانِي لَكُنتُ مِنَ الْمُتَّقِينَ﴾<\/span> <span class=\"ref\">[الزمر: ٥٦–٥٧]<\/span>؛"], [2617.0, "فهذه نفسٌ نسبت الضلالَ إلى الله عز وجل،"], [2621.0, "واحتجّت في ضلالها بأنّ الله قدّر عليها ذلك الضلال،"], [2625.0, "ثم كانت نهايتُها أن قال الله عز وجل لها:"], [2629.0, "<span class=\"ayah\">﴿بَلَىٰ قَدْ جَاءَتْكَ آيَاتِي فَكَذَّبْتَ بِهَا وَاسْتَكْبَرْتَ وَكُنتَ مِنَ الْكَافِرِينَ ۝ وَيَوْمَ الْقِيَامَةِ تَرَى الَّذِينَ كَذَبُوا عَلَى اللَّهِ وُجُوهُهُم مُّسْوَدَّةٌ﴾<\/span> <span class=\"ref\">[الزمر: ٥٩–٦٠]<\/span>."], [2639.0, "والأدلةُ النقلية في هذا كثيرة."]], "tr": [[2585.0, "Bu (delillerden) biri de Allah Azze ve Celle'nin şu sözüdür:"], [2588.0, "<span class=\"ayah\">﴿Şirk koşanlar dediler ki: \"Allah dileseydi, ne biz ne de babalarımız O'ndan başka hiçbir şeye ibadet etmezdik ve O'nun (emri) dışında hiçbir şeyi haram kılmazdık.\"﴾<\/span> [Nahl 35]."], [2600.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [2602.0, "<span class=\"ayah\">﴿(Sonra) kişinin \"Allah'a karşı yükümlülüklerimde yaptığım kusurlardan dolayı vay hâlime! Gerçekten ben alay edenlerden idim\" demesinden, yahut \"Allah bana hidayet verseydi elbette takva sahiplerinden olurdum\" demesinden (sakının)﴾<\/span> [Zümer 56–57]."], [2617.0, "Bu, sapıklığı Allah Azze ve Celle'ye nispet eden ve sapıklığında Allah'ın o sapıklığı kendisine takdir ettiğini delil getiren bir nefistir."], [2624.6, "Sonra onun sonu, Allah Azze ve Celle'nin ona şöyle demesi oldu:"], [2629.0, "<span class=\"ayah\">﴿Hayır! Sana ayetlerim geldi de sen onları yalanladın, büyüklük tasladın ve kâfirlerden oldun. Kıyamet günü Allah'a karşı yalan söyleyenlerin yüzlerinin kapkara olduğunu görürsün﴾<\/span> [Zümer 59–60]."], [2639.0, "Bu konuda naklî deliller çoktur."]]}, {"reader": false, "ar": [[2642.0, "ونقول أيضًا: إنه لو كان الاحتجاج بالقدر صحيحًا لكان عذرًا لإبليس في عدم السجود،"], [2653.0, "لأنه نسب عدم سجوده لربّه في قوله:"], [2658.0, "<span class=\"ayah\">﴿قَالَ فَبِمَا أَغْوَيْتَنِي﴾<\/span> <span class=\"ref\">[الأعراف: ١٦]<\/span>، <span class=\"ayah\">﴿قَالَ فَبِمَا أَغْوَيْتَنِي﴾<\/span>،"], [2665.0, "ولكنّ الله عز وجل لم يقبل منه هذه الحجّة."]], "tr": [[2642.0, "Şunu da söyleriz: Eğer kaderi delil getirmek sahih olsaydı, secde etmemesinde İblis için bir mazeret olurdu."], [2652.5, "Çünkü o, secde etmemesini şu sözüyle Rabbine nispet etmişti:"], [2658.0, "<span class=\"ayah\">﴿Beni azdırmana karşılık...﴾<\/span> [A'râf 16];"], [2661.9, "<span class=\"ayah\">﴿Beni azdırmana karşılık...﴾<\/span>. Fakat Allah Azze ve Celle bu delili ondan kabul etmedi."]]}, {"reader": false, "ar": [[2669.0, "ونقول أيضًا: لو كان الاحتجاج بالقدر صحيحًا لبطلت الشرائعُ كلُّها،"], [2677.0, "ولكان الأمرُ لا مصلحةَ فيه،"], [2680.3, "والنهيُ لا مصلحةَ فيه؛"], [2683.0, "فإنّ كلَّ من يترك مأمورًا ويحتجّ على تركه بالقدر،"], [2687.0, "أو يفعل منهيًّا أو محظورًا ويحتجّ على فعله بالقدر،"], [2693.0, "فإذا كان الله يقبل من هذا ومن هذا حجّتَه في الترك والفعل،"], [2698.2, "فلِمَ يأمرهم وينهاهم أصلًا؟!"]], "tr": [[
