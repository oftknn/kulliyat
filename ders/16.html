2669.0, "Şunu da söyleriz: Eğer kaderi delil getirmek sahih olsaydı bütün şeriatler bâtıl olur, emirde de nehiyde de hiçbir maslahat olmazdı."], [2683.0, "Çünkü bir emri terk edip terkine kaderi delil getiren ya da bir yasağı veya haramı işleyip işlemesine kaderi delil getiren herkesin terkteki ve işlemedeki delilini Allah hem bundan hem ondan kabul ediyorsa, onlara niye emredip yasaklasın ki?!"]]}]}, {"ts": "45:01", "title": "6. Külliye (devam): Kaderle ihticacın bâtıllığına aklî deliller; \"itaatte Kaderî, günahta Cebrî\"", "paras": [{"reader": false, "ar": [[2701.0, "ونقول أيضًا: إذا كان الاحتجاج بالقدر صحيحًا لبطل كلُّ ما يُسمّى استغفارًا،"], [2711.3, "إذ لا فائدةَ منه،"], [2714.0, "وبطل كلُّ ما يُسمّى توبةً،"], [2716.2, "إذ لا فائدةَ منه؛"], [2718.0, "فلا داعيَ للاستغفار ولا للتوبة،"], [2721.6, "بل ولا للجهاد؛ لأنّ الجهاد إنما ننفي به فتنةَ الشرك،"], [2731.0, "فإذا كان مَن سنجاهدهم عند الله معذورين في شركهم،"], [2736.0, "فلماذا نقتلهم؟! ولماذا نسبي أموالهم،"], [2739.6, "ونغزو ديارهم، ونسترقّ نساءهم؟!"], [2743.0, "فالاحتجاج بالقدر لو كان مقبولًا لبطل الدينُ كلُّه من أوله إلى آخره."]], "tr": [[2701.0, "Şunu da söyleriz: Eğer kaderi delil getirmek sahih olsaydı, istiğfar denen her şey bâtıl olurdu, çünkü onun bir faydası olmazdı;"], [2713.3, "tevbe denen her şey de bâtıl olurdu, çünkü onun da bir faydası olmazdı."], [2718.0, "İstiğfara da tevbeye de, hatta cihada da gerek kalmazdı."], [2726.0, "Çünkü cihadla ancak şirk fitnesini ortadan kaldırırız."], [2731.0, "Cihad edeceğimiz kimseler şirklerinde Allah katında mazur iseler, onları niye öldürelim?!"], [2737.4, "Mallarını niye ganimet alalım, yurtlarına niye sefer düzenleyelim, kadınlarını niye esir edelim?!"], [2744.2, "Kaderi delil getirmek kabul edilseydi, din baştan sona tamamen bâtıl olurdu."]]}, {"reader": false, "ar": [[2750.0, "ونقول أيضًا: لو كان الاحتجاج بالقدر صحيحًا لبطلت مسألةُ الثواب والعقاب في الآخرة،"], [2758.0, "ولكان خلقُ الجنة والنار لا فائدةَ منهما أصلًا،"], [2765.0, "ولكان هذا الوعيدُ الذي ملأ الله عز وجل به كتابَه لا فائدةَ منه؛"], [2774.0, "فإنّ كلَّ مبطلٍ سيحتجّ على بطلانه بالقدر،"], [2779.0, "فإذا كان ذلك مقبولًا فإنه لا داعيَ لأن تُخلق نار،"], [2785.0, "ولا أن يُتوعَّد بشيءٍ من العقوبة أو العذاب."]], "tr": [[2750.0, "Şunu da söyleriz: Eğer kaderi delil getirmek sahih olsaydı, âhiretteki sevap ve ceza meselesi bâtıl olur, cennetin ve cehennemin yaratılmasının aslında hiçbir faydası olmaz, Allah Azze ve Celle'nin Kitabı'nı kendisiyle doldurduğu bu tehdidin de hiçbir faydası olmazdı."], [2774.0, "Çünkü her bâtıl ehli, bâtılına kaderi delil getirecektir."], [2779.0, "Bu kabul edilirse, ne bir ateşin yaratılmasına ne de herhangi bir ceza veya azapla tehdit edilmeye gerek kalır."]]}, {"reader": false, "ar": [[2791.0, "بل ونقول أيضًا: إنّ مما يدلّ على أنها من حجج إبليس أنّ الناس يحرصون على قولها فيما يقرّبهم إلى الله،"], [2802.0, "لا فيما يحصّلون من مصالح دنياهم؛"], [2805.0, "فإننا لا نسمع أنّ أحدًا يقول:"], [2809.0, "إذا كان الله قدّر لي الزواج فسيأتيني بلا طلب،"], [2815.0, "أو قدّر لي الولد فسيأتيني بلا جماعٍ أو علاج،"], [2819.0, "وإذا قدّر الله لي المالَ والرزق فلا داعيَ إلى الوظيفة ولا إلى الكدّ والمشي في مناكب الأرض."]], "tr": [[2791.0, "Hatta şunu da söyleriz: Bunun İblis'in delillerinden olduğunu gösteren şeylerden biri, insanların bu sözü dünya maslahatlarından elde ettikleri şeylerde değil, kendilerini Allah'a yaklaştıran şeylerde söylemeye düşkün olmalarıdır."], [2805.0, "Hiç kimsenin \"Allah bana evliliği takdir ettiyse, ben istemeden bana gelecektir\" ya da \"Bana çocuğu takdir ettiyse cinsel ilişki veya tedavi olmadan gelecektir\" ya da \"Allah bana malı ve rızkı takdir ettiyse işe, çalışıp didinmeye ve yeryüzünün dört bir yanında dolaşmaya gerek yok\" dediğini işitmeyiz."]]}, {"reader": false, "ar": [[2827.0, "لكن إذا جاءت الصلاة قال:"], [2829.5, "إن قدّر الله عليّ أن أصلّي فسأصلّي،"], [2833.0, "أو جاء الصوم قال:"], [2834.8, "إن قدّر الله عليّ أن أصوم فأصوم."], [2838.0, "فتجد أنّ الناس لا يتفوّهون بمثل هذه الحجّة إلا في طريق..."], [2843.5, "إلا فيما يقرّبهم إلى الله عز وجل،"], [2847.0, "وأمّا فيما تقوم به مصالحُ دينهم ـ عفوًا ـ مصالحُ دنياهم فإنّ الناس لا يتكلّمون بها ولا يتفوّهون بها،"], [2857.0, "بل تجدهم يتسابقون إلى تحصيلها بفعل الأسباب."]], "tr": [[2827.0, "Fakat namaz gelince \"Allah namaz kılmamı takdir ettiyse kılarım\" der;"], [2831.0, "oruç gelince \"Allah oruç tutmamı takdir ettiyse tutarım\" der."], [2834.8, "İnsanların bu tür bir delili ancak ..."], [2838.0, "yolunda, ancak kendilerini Allah Azze ve Celle'ye yaklaştıran şeylerde ağızlarına aldıklarını görürsün."], [2843.5, "Din maslahatlarının —pardon— dünya maslahatlarının kaim olduğu şeylerde ise insanlar bunu ne konuşur ne de ağızlarına alırlar;"], [2853.7, "bilakis onları sebeplere yapışarak elde etmek için yarıştıklarını görürsün."]]}, {"reader": false, "ar": [[2864.0, "وما أجملَ ما قيل في ذلك عن بعض السلف،"], [2873.0, "يقول بعضهم: «أنت يا ابن آدم عند الطاعة قدريّ، وعند المعصية جبريّ»."], [2880.0, "فإذا أطاع العبدُ منّا ربَّه يبقى ممتنًّا،"], [2886.0, "يمنّ على الله بهذه الطاعة،"], [2888.0, "وأنه بعد هذه الطاعة لن يرى شيئًا من الضيق ولا الضنك،"], [2892.0, "ولا المصائب ولا المشاكل في حياته،"], [2894.0, "لأنه أطاع الله في قيام الليل أو الصدقة العظيمة؛"], [2897.0, "فلا يزال يمنّ على ربّه بتلك العبادة وكأنها من خلقه وتقديره هو."]], "tr": [[2864.0, "Bu konuda seleften bazılarından nakledilen söz ne güzeldir!"], [2874.1, "Onlardan biri şöyle der: \"Ey Âdemoğlu!"], [2880.0, "Sen itaat anında Kaderî, günah anında Cebrîsin.\" Bizden biri Rabbine itaat ettiğinde minnet eder hâle gelir;"], [2888.4, "bu itaati Allah'a minnet olarak sayar ve bu itaatten sonra hayatında hiçbir darlık, sıkıntı, musibet ve problem görmeyeceğini (zanneder);"], [2894.0, "çünkü gece namazında veya büyük bir sadakada Allah'a itaat etmiştir."], [2897.0, "O ibadeti, sanki kendi yaratması ve takdiriymiş gibi Rabbine minnet olarak saymaya devam eder."]]}, {"reader": false, "ar": [[2905.0, "وأمّا إذا جاء عند المعاصي فإنه يغلّب مذهبَ الجبرية الذين يسلبون عن العبد قدرته واختياره،"], [2912.8, "وأنه لا مشيئةَ له،"], [2914.9, "وأنه مجبورٌ على فعلها."], [2917.0, "وهذا من اتّخاذ الهوى إلهًا:"], [2920.3, "«أفرأيت» ـ ولّا «أرأيت»؟ ـ <span class=\"ayah\">﴿أَرَأَيْتَ مَنِ اتَّخَذَ إِلَٰهَهُ هَوَاهُ﴾<\/span> <span class=\"ref\">[الفرقان: ٤٣]<\/span>،"], [2924.3, "نعوذ بالله من ذلك."]], "tr": [[2905.0, "Günahlara gelince ise, kulun kudretini ve ihtiyarını elinden alan, onun hiçbir meşîeti olmadığını ve onu işlemeye mecbur olduğunu söyleyen Cebriyye mezhebini üstün tutar."], [2917.0, "Bu, hevâyı ilah edinmektendir: \"Efe raeyte\" —yoksa \"E raeyte\" mi?— <span class=\"ayah\">﴿Hevâsını ilah edinen kimseyi gördün mü?﴾<\/span> [Furkân 43]. Bundan Allah'a sığınırız."]]}]}, {"ts": "48:48", "title": "7. Külliye: Her türlü musibete kader delil getirilir", "paras": [{"reader": false, "ar": [[2928.0, "ومن الكلّيّات أيضًا: <b>كلُّ المصائب بأنواعها يُحتجّ عليها بالقدر.<\/b> كلُّ المصائب بأنواعها يُحتجّ لها بالقدر."], [2932.4, "كلُّ المصائب بأنواعها يُحتجّ لها ـ أو عليها ـ بالقدر."], [2934.0, "وهذا من المواضع التي يجوز الاحتجاج بالقدر فيها."], [2949.0, "فمتى ما حلّت عليك شيءٌ من المصائب في بدنك،"], [2953.0, "أو في ولدك وأهلك أو أقاربك،"], [2955.7, "أو في مالك، فلك أن تقول:"], [2958.5, "قدّر الله وما شاء فعل."]], "tr": [[2928.0, "Külliyelerden biri de şudur: 7."], [2930.0, "külliye: Her türlü musibete kader delil getirilir. (İki kez tekrar ediyor; \"ona karşı\" yerine bir kez \"onun için\" diyor.) Bu, kaderi delil getirmenin caiz olduğu yerlerdendir."], [2949.0, "Bedeninde, çocuğunda, ailende, akrabalarında veya malında sana bir musibet isabet ettiğinde \"Allah takdir etti, dilediğini yaptı\" diyebilirsin."]]}, {"reader": false, "ar": [[2961.0, "كما قال الله عز وجل:"], [2964.2, "<span class=\"ayah\">﴿مَا أَصَابَ مِن مُّصِيبَةٍ إِلَّا بِإِذْنِ اللَّهِ ۗ وَمَن يُؤْمِن بِاللَّهِ يَهْدِ قَلْبَهُ﴾<\/span> <span class=\"ref\">[التغابن: ١١]<\/span>."], [2972.0, "قال الإمام علقمة رحمه الله تعالى:"], [2975.3, "«هو الرجل تصيبه المصيبة فيعلم أنها من الله فيرضى ويسلّم»."], [2980.0, "وقولُ النبي صلى الله عليه وسلم:"], [2983.8, "«فإن أصابك شيءٌ فلا تقل: لو أنّي فعلتُ كذا وكذا لكان كذا وكذا، ولكن قل: قدّر الله وما شاء فعل» <span class=\"note\">(Müslim)<\/span>."]], "tr": [[2961.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2964.2, "<span class=\"ayah\">﴿Allah'ın izni olmadan hiçbir musibet isabet etmez. Kim Allah'a iman ederse, Allah onun kalbine hidayet verir﴾<\/span> [Teğâbun 11]."], [2972.0, "İmam Alkame —Allah ona rahmet etsin— şöyle demiştir:"], [2975.3, "\"Bu, kendisine bir musibet isabet eden ve onun Allah'tan olduğunu bilip razı olan ve teslim olan adamdır.\" Nebî ﷺ'in şu sözü de (buna delildir):"], [2983.8, "«Sana bir şey isabet ederse \"Keşke şöyle şöyle yapsaydım, şöyle şöyle olurdu\" deme; fakat \"Allah takdir etti, dilediğini yaptı\" de.» <span class=\"note\">(Müslim)<\/span>."]]}, {"reader": false, "ar": [[2997.0, "وقولُ الله عز وجل:"], [2999.2, "<span class=\"ayah\">﴿الَّذِينَ إِذَا أَصَابَتْهُم مُّصِيبَةٌ قَالُوا إِنَّا لِلَّهِ﴾<\/span> ـ وهذا هو الإيمان ـ <span class=\"ayah\">﴿إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٥٦]<\/span>."], [3007.0, "وقولُ النبي صلى الله عليه وسلم:"], [3010.0, "«ما من مسلمٍ تصيبه مصيبةٌ فيقول: اللهم أْجُرني في مصيبتي، وأخلِف لي خيرًا منها، إلا أخلف الله له خيرًا منها» <span class=\"note\">(Müslim)<\/span>."], [3019.0, "فهذا من جملة المواضع التي يُحتجّ بالقدر عليها."]], "tr": [[2997.0, "Allah Azze ve Celle'nin şu sözü de:"], [2999.2, "<span class=\"ayah\">﴿Onlar kendilerine bir musibet isabet ettiğinde \"Biz Allah'ınız...\" derler﴾<\/span> —işte iman budur— <span class=\"ayah\">﴿\"Biz Allah'ınız ve biz O'na döneceğiz\"﴾<\/span> [Bakara 156]."], [3007.0, "Nebî ﷺ'in şu sözü de:"], [3010.0, "«Kendisine bir musibet isabet edip de \"Allah'ım! Musibetimde bana ecir ver ve bana ondan daha hayırlısını ihsan et\" diyen hiçbir Müslüman yoktur ki Allah ona ondan daha hayırlısını ihsan etmesin.» <span class=\"note\">(Müslim)<\/span>."], [3021.2, "İşte bu, kaderin delil getirildiği yerlerdendir."]]}, {"reader": false, "ar": [[3027.0, "وإنّ هذا الاحتجاج من أعظم ما يُضعف سلاطةَ المصيبة على القلب،"], [3034.0, "ويُنهي أثرها بإذن الله عز وجل."], [3038.0, "ولذلك تجد أنّ القضاء والقدر كالشمّاعة التي نعلّق عليها مصائبَنا لِيخفّ حملُها عن ظهورنا وأكتافنا."], [3049.0, "وتجد أنّ الذين ليس عندهم شيءٌ من هذا الإيمان ـ القضاءِ والقدر ـ ينتحرون ويقتلون أنفسهم،"], [3058.0, "أو يتسخّطون ويتضجّرون من قضاء الله عز وجل وقدره،"], [3062.3, "نسأل الله العافية. والله أعلم."]], "tr": [[3027.0, "Bu ihticac, musibetin kalp üzerindeki keskinliğini (baskısını) zayıflatan ve Allah Azze ve Celle'nin izniyle onun etkisini sona erdiren şeylerin en büyüklerindendir."], [3038.0, "Bu yüzden kaza ve kaderin, yükü sırtlarımızdan ve omuzlarımızdan hafiflesin diye musibetlerimizi üzerine astığımız bir askı gibi olduğunu görürsün."], [3049.0, "Bu imana —kaza ve kadere imana— hiç sahip olmayanların ise intihar edip kendilerini öldürdüklerini ya da Allah Azze ve Celle'nin kaza ve kaderine öfkelenip sızlandıklarını görürsün."], [3062.0, "Allah'tan âfiyet dileriz. Allah en iyisini bilir."]]}]}, {"ts": "51:04", "title": "8. Külliye: Her ihtiyarî fiilde kul hem müseyyer hem muhayyerdir", "paras": [{"reader": false, "ar": [[3064.0, "ومن الكلّيّات أيضًا: <b>كلُّ فعلٍ اختياريٍّ فالعبدُ فيه مسيَّرٌ ومخيَّر.<\/b> ـ يا ربّ ـ كلُّ فعلٍ اختياريٍّ فالعبد فيه مسيَّرٌ ومخيَّر."], [3084.0, "كلُّ فعلٍ اختياريٍّ فالعبد فيه مسيَّرٌ ومخيَّر."]], "tr": [[3064.0, "Külliyelerden biri de şudur: 8."], [3067.0, "külliye: Her ihtiyarî fiilde kul hem müseyyer (sevk edilmiş) hem de muhayyerdir (seçme hakkına sahiptir). —Yâ Rab— (İki kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[3092.0, "أقول وبالله التوفيق: اعلم ـ رحمنا الله وإيّاك ـ..."], [3097.3, "انتبهوا... اعلم ـ رحمنا الله وإيّاك ـ أنّ مسألة التسيير والتخيير فرعٌ عن مذاهب الناس في أصل القضاء والقدر وفعل العبد."], [3109.0, "فالجبرية كما أنهم يسلبون العبدَ قدرته واختياره في مجاري الأقدار،"], [3116.0, "ويجعلون العبدَ كالريشة في مهبّ الريح لا اختيارَ لها في اختيار جهتها،"], [3124.0, "وكالميّت بين يدي مغسّله،"], [3127.0, "فينتج عن مذهبهم ذلك بأنّ العبد مسيَّرٌ مطلقًا."]], "tr": [[3092.0, "Tevfik Allah'tandır, derim ki: Bil ki —Allah bize ve sana rahmet etsin—..."], [3097.3, "Dikkat edin... Bil ki —Allah bize ve sana rahmet etsin— teshîr (sevk edilme) ve tahyîr (seçme hakkı verilme) meselesi, insanların kaza ve kaderin aslı ile kulun fiili hakkındaki mezheplerinin bir fer'idir."], [3112.5, "Cebriyye, kaderlerin cereyanında kulun kudretini ve ihtiyarını elinden aldıkları, kulu rüzgârın estiği yerde yönünü seçmekte hiçbir seçimi olmayan bir tüy gibi ve yıkayıcısının elindeki ölü gibi kıldıkları için, mezheplerinden kulun mutlak olarak müseyyer olduğu sonucu çıkar."]]}, {"reader": false, "ar": [[3133.0, "وأمّا القدرية الذين يجعلون للعبد القدرةَ التامة والمشيئةَ التامة والاختيارَ الكامل،"], [3143.0, "وأنّ الله عز وجل لم يخلق فعلَ العبد،"], [3146.8, "فينتج من ذلك أنّ العبد عندهم مخيَّرٌ في فعله الاختياري مطلقًا."], [3152.0, "وكما أنّ أهل السنة يقولون:"], [3155.3, "إنّ فعل العبد يُنسب إلى الله خلقًا وتقديرًا،"], [3160.5, "ويُنسب إلى العباد تحصيلًا واكتسابًا،"], [3166.0, "فيقولون بالتسيير باعتبار، وبالتخيير باعتبارٍ آخر،"], [3174.0, "وهو الذي تدلّ عليه هذه الكلّيّة."]], "tr": [[3133.0, "Kula tam kudret, tam meşîet ve kâmil ihtiyar veren ve Allah Azze ve Celle'nin kulun fiilini yaratmadığını söyleyen Kaderiyye'ye gelince, bundan onlara göre kulun ihtiyarî fiilinde mutlak olarak muhayyer olduğu sonucu çıkar."], [3152.0, "Ehl-i Sünnet ise kulun fiilinin yaratma ve takdir yönüyle Allah'a, tahsil ve kesb yönüyle kullara nispet edildiğini söyledikleri gibi, bir itibarla teshîri, başka bir itibarla da tahyîri söylerler."], [3174.0, "Bu külliyenin delâlet ettiği de budur."]]}, {"reader": false, "ar": [[3176.0, "فلا نقول بأنّ العبد مسيَّرٌ مطلقًا كما قالته الجبرية،"], [3181.0, "ولا بأنه مخيَّرٌ مطلقًا كما قالته القدرية،"], [3187.0, "وإنما نقول: مسيَّرٌ ومخيَّر."], [3190.0, "فقولُنا: «مسيَّر» أي باعتبار الشائبة الأولى التي تتعلّق ـ التي تُنسب ـ لله عز وجل،"], [3200.6, "وهي الخلق والإيجاد والتقدير؛"], [3204.0, "فالعبد مسيَّرٌ في أفعاله الاختيارية باعتبار الخلق والإيجاد والتقدير."], [3211.0, "وقولُنا: «مخيَّر» أي باعتبار الشائبة الأخرى التي تُنسب إلى العبد،"], [3219.0, "وهي التحصيل والاكتساب والاقتراف."], [3223.0, "فالعبد مسيَّرٌ باعتبار سبق التقدير،"], [3226.4, "ومخيَّرٌ باعتبار دخول الفعل تحت قدرته واختياره."]], "tr": [[3176.0, "Cebriyye'nin dediği gibi kulun mutlak olarak müseyyer olduğunu da, Kaderiyye'nin dediği gibi mutlak olarak muhayyer olduğunu da söylemeyiz;"], [3185.5, "bilakis \"hem müseyyer hem muhayyer\" deriz."], [3190.7, "\"Müseyyer\" sözümüz, Allah Azze ve Celle'ye taalluk eden —nispet edilen— birinci yön itibarıyladır;"], [3199.1, "o da yaratma, icat ve takdirdir."], [3204.0, "Kul, ihtiyarî fiillerinde yaratma, icat ve takdir itibarıyla müseyyerdir."], [3211.0, "\"Muhayyer\" sözümüz ise kula nispet edilen diğer yön itibarıyladır;"], [3216.6, "o da tahsil, kesb ve iktirâftır."], [3223.0, "Kul, takdirin önceden geçmesi itibarıyla müseyyer;"], [3226.4, "fiilin kudreti ve ihtiyarı altına girmesi itibarıyla muhayyerdir."]]}, {"reader": false, "ar": [[3234.0, "وأضرب لكم مثالين يسيرين:"], [3237.0, "لو أنّ الإنسان خُيّر في الزواج بامرأتين،"], [3241.0, "فإنّ الزواج بواحدةٍ منهما من الأفعال الاختيارية التي له فيها مشيئةٌ وقدرةٌ واختيار،"], [3251.0, "وهو لا يحسّ بأنّ أحدًا يأخذ بقافية رأسه ليزوّجه بهذه أو يزوّجه بتلك؛"], [3262.0, "فدخولُ الزواج بواحدةٍ منهما تحت اختياره يجعله مخيَّرًا فيه."], [3270.0, "ولكن اعلم أنك لن تتزوّج إلا التي اختارها الله عز وجل لك في سبق القضاء والقدر؛"], [3281.0, "فالزواج بواحدةٍ منهما أنت مسيَّرٌ فيه باعتبار سبق التقدير،"], [3285.0, "ومخيَّرٌ باعتبار دخول الفعل تحت قدرتك واختيارك."]], "tr": [[3234.0, "Size iki basit misal vereyim:"], [3237.0, "Bir insan iki kadınla evlenmek arasında serbest bırakılsa, onlardan biriyle evlenmek, onun meşîeti, kudreti ve ihtiyarı bulunan ihtiyarî fiillerdendir."], [3251.0, "Onu bununla ya da şununla evlendirmek için birinin ensesinden tuttuğunu hissetmez."], [3262.0, "Onlardan biriyle evlenmenin ihtiyarı altına girmesi, onu bunda muhayyer kılar."], [3270.0, "Fakat bil ki sen ancak Allah Azze ve Celle'nin kazanın ve kaderin önceden geçmesinde senin için seçtiği kadınla evleneceksin."], [3281.0, "Onlardan biriyle evlenmekte, takdirin önceden geçmesi itibarıyla müseyyer;"], [3284.6, "fiilin kudretin ve ihtiyarın altına girmesi itibarıyla muhayyersin."]]}, {"reader": false, "ar": [[3291.0, "ولو أنّ الإنسان جاء بين طريقين:"], [3294.0, "إمّا أن يسلك يمينًا أو شمالًا،"], [3297.0, "فسلوكُ أحد الطريقين فعلٌ أنت فيه مخيَّر،"], [3303.0, "لأنه يدخل تحت قدرتك واختيارك،"], [3306.0, "وليس ثمّةَ أحدٌ يقهرك أو يُجبرك على سلوك واحدٍ منهما؛"], [3312.0, "لكن اعلم أنك لن تسلك إلا الطريقَ الذي قدّره الله عز وجل وسبق في قضائه."]], "tr": [[3291.0, "Bir insan iki yol arasına gelse, ya sağa ya da sola gidecektir."], [3294.0, "Bu iki yoldan birine gitmek, senin muhayyer olduğun bir fiildir;"], [3300.0, "çünkü kudretinin ve ihtiyarının altına girer;"], [3305.4, "seni ikisinden birine gitmeye zorlayan veya mecbur eden kimse yoktur."], [3312.0, "Fakat bil ki sen ancak Allah Azze ve Celle'nin takdir ettiği ve kazasında önceden geçmiş olan yola gideceksin."]]}, {"reader": false, "ar": [[3318.0, "فإذا نظرنا إلى فعل العبد الاختياري وجدناه مسيَّرًا،"], [3325.1, "لأنّ أفعاله في أرض الله لا يمكن أن تكون متعارضةً مع سبق القضاء في اللوح المحفوظ،"], [3332.0, "وإذا رأيناه مختارًا لفعله وأنّ أحدًا لا يُجبره عليه جعلناه مخيَّرًا."], [3343.0, "والأمر في ذلك واضحٌ إن شاء الله."]], "tr": [[3318.0, "Kulun ihtiyarî fiiline (bu açıdan) baktığımızda onu müseyyer buluruz;"], [3325.1, "çünkü onun Allah'ın yeryüzündeki fiillerinin, Levh-i Mahfûz'da önceden geçmiş kaza ile çelişmesi mümkün değildir."], [3330.9, "Onu fiilini seçen biri olarak ve kimsenin onu buna zorlamadığını gördüğümüzde ise muhayyer sayarız."], [3343.0, "Bu konuda iş inşallah açıktır."]]}, {"reader": false, "ar": [[3346.0, "ولذلك قال الله عز وجل:"], [3347.5, "<span class=\"ayah\">﴿لَا إِكْرَاهَ فِي الدِّينِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٦]<\/span>،"], [3348.8, "لأنّ العبد فيه مخيَّر؛"], [3350.0, "لكن إن اختار الإيمانَ في الأرض فقد سبق في القضاء والقدر اختيارُه،"], [3358.0, "وإن اختار الكفرَ في الأرض فقد سبق في إرادة الله الكونية اختيارُه،"], [3364.0, "اختيارُه. قال الله ـ وقال الله عز وجل ـ:"], [3369.0, "<span class=\"ayah\">﴿فَمَن شَاءَ فَلْيُؤْمِن وَمَن شَاءَ فَلْيَكْفُرْ﴾<\/span> <span class=\"ref\">[الكهف: ٢٩]<\/span>،"], [3373.0, "وقال الله عز وجل:"], [3375.2, "<span class=\"ayah\">﴿لِمَن شَاءَ مِنكُمْ أَن يَسْتَقِيمَ﴾<\/span> <span class=\"ref\">[التكوير: ٢٨]<\/span>."]], "tr": [[3346.0, "Bu yüzden Allah Azze ve Celle <span class=\"ayah\">﴿Dinde zorlama yoktur﴾<\/span> [Bakara 256] buyurmuştur;"], [3350.0, "çünkü kul bunda muhayyerdir. Fakat yeryüzünde imanı seçerse, onun seçimi kaza ve kaderde önceden geçmiştir;"], [3359.5, "yeryüzünde küfrü seçerse, onun seçimi Allah'ın kevnî iradesinde önceden geçmiştir."], [3365.0, "Allah —Allah Azze ve Celle— şöyle buyurmuştur:"], [3369.0, "<span class=\"ayah\">﴿Dileyen iman etsin, dileyen inkâr etsin﴾<\/span> [Kehf 29]."], [3372.3, "Allah Azze ve Celle şöyle buyurmuştur:"], [3375.2, "<span class=\"ayah\">﴿İçinizden doğru yolda gitmeyi dileyen için﴾<\/span> [Tekvîr 28]."]]}]}, {"ts": "56:18", "title": "9. Külliye: Bütün sevap ve ceza teshîre değil tahyîre göre olur", "paras": [{"reader": false, "ar": [[3378.0, "نعم. ومن الكلّيّات أيضًا:"], [3382.0, "<b>كلُّ الثواب والعقاب يقع على التخيير لا على التسيير.<\/b> وهذه الكلّيّة تجيبك عن سؤالٍ قدريٍّ طالت الحيرةُ فيه،"], [3399.0, "وهي قولُهم: كيف يقدّر الله عز وجل عليّ المعصية ثم يعاقبني عليها؟"], [3408.0, "وهذا سؤالٌ يتردّد في كثيرٍ من المواضع."]], "tr": [[3378.0, "Evet. Külliyelerden biri de şudur:"], [3382.0, "<b>9. külliye: Bütün sevap ve ceza teshîre göre değil, tahyîre göre olur.<\/b> Bu külliye, sana hakkında hayretin uzun sürdüğü kaderî bir soruya cevap verir;"], [3396.0, "o da onların şu sözüdür:"], [3400.4, "\"Allah Azze ve Celle günahı üzerime nasıl takdir eder de sonra beni onun yüzünden cezalandırır?\" Bu, birçok yerde tekrarlanan bir sorudur."]]}, {"reader": false, "ar": [[3416.0, "والجواب عنه أن نقول:"], [3419.0, "إنما الثوابُ والعقاب في أفعالك الاختيارية ـ أو على أفعالك الاختيارية ـ إنما يقع على جزئية التخيير فيها،"], [3428.0, "لا على جزئية التسيير؛"], [3430.0, "وذلك لأنّ الله عز وجل لا يعاقب العبدَ على شيءٍ لمجرّد أنه قدّره عليه ما لم يقع منه باختياره ـ يقع منه لا عليه ـ؛"], [3448.0, "لأنّ وقوع الفعل عليك هذا يُنسب إلى الله عز وجل،"], [3454.0, "ولكنّ وقوع الفعل منك هذا يُنسب إليك."]], "tr": [[3416.0, "Buna cevap olarak deriz ki:"], [3419.0, "İhtiyarî fiillerindeki —ya da ihtiyarî fiillerine verilen— sevap ve ceza, ancak onlardaki tahyîr cüzüne göre olur, teshîr cüzüne göre değil."], [3430.0, "Çünkü Allah Azze ve Celle kulu, kendi ihtiyarıyla ondan meydana gelmedikçe —\"onun üzerine\" değil, \"ondan\" meydana gelmedikçe— sırf onu üzerine takdir etti diye bir şey yüzünden cezalandırmaz."], [3448.0, "Zira fiilin senin üzerine meydana gelmesi Allah Azze ve Celle'ye nispet edilir;"], [3454.0, "fakat fiilin senden meydana gelmesi sana nispet edilir."]]}, {"reader": false, "ar": [[3459.0, "وأزيد الأمرَ وضوحًا فأقول:"], [3462.0, "اعلم ـ رحمك الله عز وجل ـ أنّ الذي قدّر السيئاتِ عليك هو الله،"], [3468.0, "والذي قدّر الحسناتِ لك هو الله؛"], [3471.0, "فإذا كنتَ تحتجّ بالقدر على ألّا يعاقبك الله على فعل شيءٍ من السيئات لأنه قدّرها،"], [3480.0, "فلا حقَّ لك أيضًا أن تطالب الله عز وجل بثواب الحسنات لأنه هو الذي قدّرها."], [3488.0, "فإذا كان التقديرُ يمنع العقابَ فإنه يكون مانعًا من الثواب."]], "tr": [[3459.0, "İşi daha da açıklığa kavuşturarak derim ki:"], [3462.0, "Bil ki —Allah Azze ve Celle sana rahmet etsin— kötülükleri senin aleyhine takdir eden de Allah'tır, iyilikleri senin lehine takdir eden de Allah'tır."], [3471.0, "Eğer Allah'ın seni kötülüklerden birini işlemen yüzünden cezalandırmaması için —O takdir etti diye— kaderi delil getiriyorsan, iyiliklerin sevabını da Allah Azze ve Celle'den isteme hakkın yoktur;"], [3484.8, "çünkü onları takdir eden de O'dur."], [3488.0, "Eğer takdir cezaya engel oluyorsa, sevaba da engel olur."]]}, {"reader": false, "ar": [[3496.0, "فكما أنك لا تستغرب ولا تستنكر من الله أن يقدّر الخيرَ لك ثم يُثيبك عليه،"], [3506.0, "فكذلك لا ينبغي لك أن تستنكر أنّ الله يقدّر عليك الشرَّ ثم يعاقبك عليه."], [3514.0, "فكما أنّ تقدير الخير لا يرفع ثوابَه إن فعلتَه،"], [3520.0, "فكذلك تقدير المعصية والشرّ لا يرفع عقابَها إن فعلتَها؛"], [3527.0, "لأنّ مجرّد كتابة الحسنة في اللوح المحفوظ لك لا تُقرَن كتابتُها بثوابها ما لم تقع منك في الأرض اختيارًا،"], [3541.0, "ومجرّد كتابة المعصية عليك لا تُقرَن بعقوبتها ما لم تقع منك في الأرض فعلًا منك."]], "tr": [[3496.0, "Allah'ın hayrı senin için takdir edip sonra sana onun sevabını vermesini garip ve tuhaf karşılamadığın gibi, Allah'ın şerri senin aleyhine takdir edip sonra seni onun yüzünden cezalandırmasını da tuhaf karşılamaman gerekir."], [3515.3, "Hayrın takdiri, onu yaptığında sevabını kaldırmadığı gibi, günahın ve şerrin takdiri de onu yaptığında cezasını kaldırmaz."], [3527.0, "Çünkü iyiliğin Levh-i Mahfûz'da senin lehine sadece yazılmış olması, yeryüzünde senden ihtiyarî olarak meydana gelmedikçe, yazılmasını sevabıyla birleştirmez."], [3538.2, "Günahın senin aleyhine sadece yazılmış olması da, yeryüzünde senden senin bir fiilin olarak meydana gelmedikçe, cezasıyla birleştirilmez."]]}, {"reader": false, "ar": [[3552.0, "فجانبُ التسيير في أفعالك الذي يُنسب إلى الله ليس محطًّا لا للثواب ولا للعقاب،"], [3563.0, "وإنما محطُّ الثواب والعقاب على ما يُنسب لك أنت،"], [3568.9, "وهي تحصيلُك واكتسابُك واقترافُك للشيء باختيارك ومشيئتك وقدرتك."], [3576.0, "لا سيّما بأنّ القدر سرُّ الله المكتوم؛"], [3582.0, "فقبل وقوع المعصية منك لم تكن تعرف أنّ الله في السماء قد قدّرها عليك،"], [3590.0, "فأنت أقدمتَ عليها بكامل اختيارك ومشيئتك وإرادتك."], [3597.0, "فهل اتّخذتَ عند الله عهدًا أنّ الله أطلعك على أنك ستفعل؟ الجواب: لا."]], "tr": [[3552.0, "Fiillerinde Allah'a nispet edilen teshîr tarafı, ne sevabın ne de cezanın konusudur."], [3558.7, "Sevap ve cezanın konusu ancak sana nispet edilen şeydir;"], [3565.6, "o da bir şeyi kendi ihtiyarın, meşîetin ve kudretinle tahsil etmen, kazanman ve irtikâb etmendir."], [3576.0, "Hele ki kader Allah'ın gizli sırrıdır."], [3582.0, "Günah senden meydana gelmeden önce, gökteki Allah'ın onu senin aleyhine takdir ettiğini bilmiyordun;"], [3588.9, "sen ona tam bir ihtiyar, meşîet ve iradeyle giriştin."], [3597.0, "Allah katında, Allah'ın seni (bunu) yapacağına muttali kıldığına dair bir ahit mi aldın? Cevap: Hayır."]]}]}, {"ts": "01:00:04", "title": "9. Külliye (devam): Ceza kadere değil makdûra göredir", "paras": [{"reader": false, "ar": [[3604.0, "فلا ينبغي إضافةُ الثواب على الحسنة لمجرّد تقديرها،"], [3612.0, "بل بفعلها ووقوعها، ولا ينبغي أن يُقرَن العقابُ على السيئة لمجرّد تقديرها،"], [3622.0, "بل على وقوعها واقترافها."], [3627.0, "فالشيطان حريصٌ على أن يربط الثوابَ والعقاب بالقدر،"], [3633.0, "ليجعل فعلَك للمعصية... ليجعل تقديرَها حجّةً على فعلك لها."], [3647.0, "فلعلّكم فرّقتم بين الأمرين."]], "tr": [[3604.0, "Sevabı, iyiliğe sırf takdir edildiği için değil, onun yapılması ve meydana gelmesiyle izafe etmek gerekir."], [3615.0, "Cezayı da kötülüğe sırf takdir edildiği için değil, onun meydana gelmesi ve irtikâb edilmesi üzerine bağlamak gerekir."], [3627.0, "Şeytan, sevabı ve cezayı kadere bağlamaya düşkündür;"], [3631.3, "senin günahı işlemeni... onun takdirini, onu işlemen için bir delil kılmak için."], [3647.0, "Umarım iki şeyi birbirinden ayırmışsınızdır."]]}, {"reader": false, "ar": [[3650.0, "فإذا قال لكم قائل:"], [3652.0, "لماذا يكتب علينا المعصيةَ ثم يعاقبنا؟"], [3655.0, "فتقول: عقابُه لك ليس على مجرّد كتابته،"], [3661.0, "وإنما على فعلك واقترافك؛"], [3665.0, "فالعقوبةُ ليست على القدر وإنما على المقدور،"], [3670.0, "والثوابُ ليس على القدر وإنما على المقدور الذي هو فعلُ العبد. ولعلّ هذا واضح."]], "tr": [[3650.0, "Biri size \"Günahı niçin üzerimize yazıyor da sonra bizi cezalandırıyor?\" derse, şöyle dersin:"], [3655.0, "O'nun seni cezalandırması sırf onu yazması yüzünden değil, ancak senin onu işlemen ve irtikâb etmen yüzündendir."], [3665.0, "Ceza kadere göre değil makdûra göredir;"], [3669.3, "sevap da kadere göre değil, kulun fiili olan makdûra göredir. Umarım bu açıktır."]]}, {"reader": false, "ar": [[3680.0, "فلو أنّ العبد جاء يوم القيامة بصلاةٍ وصيامٍ وزكاةٍ وبرٍّ وصدقات،"], [3689.0, "ثم جعل الله حسناتِها هباءً منثورًا،"], [3692.9, "لاستغرب العبدُ، فقال: يا ربّ،"], [3696.5, "أين ثوابُ عملي؟ فيقول له:"], [3699.4, "لا تستحقّ ثوابها لأنك إنما فعلتها بقضائي وقدري."], [3706.0, "فإنّ العبد لا يرضى ذلك؛"], [3710.0, "لأنك ـ يا الله ـ وعدتَني بالثواب إن فعلتُها وقد فعلتُها."]], "tr": [[3680.0, "Eğer kul kıyamet günü namazla, oruçla, zekâtla, iyilikle ve sadakalarla gelse, sonra Allah onların iyiliklerini savrulmuş toz hâline getirse, kul bunu garip karşılar ve \"Ya Rab!"], [3695.5, "Amelimin sevabı nerede?\" der. (Allah) ona \"Onun sevabını hak etmiyorsun;"], [3698.0, "çünkü sen onu ancak benim kazam ve kaderimle yaptın\" dese, kul buna razı olmaz."], [3706.0, "(Der ki:) Çünkü sen, ey Allah, onları yaparsam bana sevap vaat ettin; ben de yaptım."]]}, {"reader": false, "ar": [[3718.0, "فيقول الله له: وكذلك أيضًا قدّرتُ عليك المعصية،"], [3723.7, "ولكن بعثتُ لك الرسلَ لتحذّرك منها،"], [3727.0, "وأنزلتُ عليك الكتبَ لتحذّرك منها،"], [3731.0, "وبعثتُ في قلبك فطرةً لتعرف قبحها،"], [3737.0, "وجعلتُ لك عقلًا تتعرّف به على ما يصلح وما لا يصلح،"], [3743.0, "والحسنَ من القبيح؛ فتركتَ ذلك كلَّه وفعلتَها بمحض مشيئتك وإرادتك واختيارك؛"], [3752.0, "فحينئذٍ أعاقبك عليها، لأنني حذّرتك منها،"], [3755.8, "وتوعّدتك إن فعلتَها بالعقوبة البليغة."], [3759.0, "فكما أنني الآن أوفي بوعدي لفاعل الحسنات بالثواب،"], [3766.0, "فكذلك أوفي بوعيدي لفاعل السيئة بالعقاب."]], "tr": [[3718.0, "Allah ona şöyle der: Aynı şekilde günahı da senin aleyhine takdir ettim;"], [3724.3, "fakat seni ondan sakındırmaları için sana resuller gönderdim, seni ondan sakındırmaları için sana kitaplar indirdim, onun çirkinliğini bilesin diye kalbine bir fıtrat koydum, neyin iyi neyin iyi olmadığını ve güzeli çirkinden ayırt edesin diye sana bir akıl verdim."], [3745.0, "Sen bunların hepsini bıraktın ve onu tamamen kendi meşîetin, iradenle ve ihtiyarınla işledin."], [3752.0, "İşte o zaman seni onun yüzünden cezalandırırım;"], [3753.9, "çünkü seni ondan sakındırdım ve onu işlersen ağır bir cezayla seni tehdit ettim."], [3759.0, "Şimdi iyilikleri yapana sevap vaadimi yerine getirdiğim gibi, kötülüğü yapana da ceza tehdidimi yerine getiririm."]]}]}, {"ts": "01:02:53", "title": "10. Külliye: Kevnî olarak kazanın önceden geçtiği her şeyde şer'an istenen bir şey vardır", "paras": [{"reader": false, "ar": [[3773.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما سبق به القضاءُ كونًا فمصحوبٌ بالمطلوب فيه شرعًا.<\/b> كلُّ ما سبق به القضاء كونًا فيُصحَب بالمطلوب فيه شرعًا."], [3791.0, "كلُّ ما سبق به القضاء كونًا فيُصحَب بالمطلوب فيه شرعًا."], [3797.0, "أُعيدها مرةً ثالثة: كلُّ ما سبق به القضاء كونًا فيُصحَب بالمطلوب فيه شرعًا."]], "tr": [[3773.0, "Külliyelerden biri de şudur: 10."], [3774.8, "külliye: Kevnî olarak kazanın önceden geçtiği her şeye, onda şer'an istenen şey eşlik eder. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [3797.0, "Kevnî olarak kazanın önceden geçtiği her şeye, onda şer'an istenen şey eşlik eder."]]}, {"reader": false, "ar": [[3811.0, "وذلك لأنّ كلَّ قضاءٍ كونيٍّ فإنه وسيلةٌ لمطلوبٍ شرعي؛"], [3818.0, "فلا ينبغي أن يُفصل بين القضاء والشرع؛"], [3822.0, "فإنّ القضاء كالحكم الوضعي،"], [3824.8, "وكلُّ حكمٍ وضعيٍّ فيُطلب عنده حكمٌ شرعي."], [3831.0, "فإذا قضى الله عز وجل عليك الجوعَ فيُطلب منك أن تأكل،"], [3836.0, "وإذا قدّر عليك الظمأَ فيُطلب منك شرعًا أن تشرب،"], [3840.0, "وإذا قدّر عليك السَّقَمَ فيُطلب منك شرعًا أن تتداوى،"], [3847.0, "وإذا قدّر عليك الفقرَ فيُطلب منك شرعًا أن تسعى في أسباب تحصيل الرزق والمعاش والكسب."]], "tr": [[3811.0, "Bunun sebebi, her kevnî kazanın şer'an istenen bir şeye vesile olmasıdır."], [3818.0, "Dolayısıyla kaza ile şeriat birbirinden ayrılmamalıdır."], [3819.7, "Çünkü kaza, hüküm-i vaz'î gibidir;"], [3822.0, "her hüküm-i vaz'înin yanında da bir hüküm-i şer'î istenir."], [3824.8, "Allah Azze ve Celle senin üzerine açlığı hükmederse, senden yemen istenir;"], [3831.0, "sana susuzluğu takdir ederse, senden şer'an içmen istenir;"], [3836.0, "sana hastalığı takdir ederse, senden şer'an tedavi olman istenir;"], [3842.1, "sana fakirliği takdir ederse, senden şer'an rızık, geçim ve kazanç elde etmenin sebeplerine koşman istenir."]]}, {"reader": false, "ar": [[3854.0, "وإذا قدّر عليك في كونه الضلالَ فيُطلب منك البحثُ عن أسباب الهداية،"], [3861.0, "وإذا قدّر عليك الكفرَ فيُطلب منك البحثُ عن أسباب الإيمان،"], [3866.0, "والتفكّرُ في آيات الله الكونية والشرعية."], [3870.0, "فلا ينبغي أبدًا أن تقف عندما قضاه الله وقدّره وتفصله عن المطلوب فيه شرعًا؛"], [3880.0, "فكلُّ قضاءٍ كونيٍّ فالعبدُ مطلوبٌ بأن يتأمّل مرادَ الله الشرعيَّ فيه."], [3887.0, "وهذه هي آخرُ كلّيّةٍ أريد شرحها في هذا الدرس."], [3894.0, "والله أعلى وأعلم، وصلى الله وسلم على نبينا محمد."]], "tr": [[3854.0, "Kevninde sana sapıklığı takdir ederse, senden hidayetin sebeplerini araştırman istenir;"], [3859.8, "sana küfrü takdir ederse, senden imanın sebeplerini araştırman ve Allah'ın kevnî ve şer'î ayetleri üzerinde tefekkür etmen istenir."], [3870.0, "Allah'ın hükmettiği ve takdir ettiği şeyde durup onu, onda şer'an istenen şeyden asla ayırmamalısın."], [3880.0, "Her kevnî kazada kuldan, Allah'ın ondaki şer'î muradını düşünmesi istenir."], [3887.0, "Bu derste şerh etmek istediğim son külliye budur."], [3894.0, "Allah en yüce olandır ve en iyisini bilendir."], [3895.6, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};

const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
