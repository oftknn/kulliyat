<script>
const D={"no": 1, "vid": "qf_zOEhXkVs", "title_ar": "الدرس (١) من شرح كليات العقيدة — مقدمة في العقيدة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 1. Ders: Akîdeye Giriş", "sections": [{"ts": "00:00", "title": "Giriş: Usûl ve kaide yoluyla öğretim", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.9, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.8, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.2, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [10.0, "فأهلًا وسهلًا بكم جميعًا في هذه المجالس العلمية التي سنشرح فيها ـ إن شاء الله عز وجل ـ جُمَلًا كثيرةً من كلّيّات العقائد في مختلف أبواب التوحيد والعقيدة إن شاء الله عز وجل."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.9, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.0, "Allah'ın izniyle tevhid ve akîdenin çeşitli bablarındaki akîde külliyelerinden birçoğunu şerh edeceğimiz bu ilim meclislerine hepiniz hoş geldiniz."]]}, {"reader": false, "ar": [[24.8, "وهذه طريقتي في التعليم:"], [26.7, "وهي أننا نأتي الفنَّ من أصوله وقواعده وكلّيّاته وضوابطه العامة،"], [31.7, "حتى يتعرّف الطالب كيف استُنبطت هذه الجزئيات والفروع."], [39.0, "ولا يمكن للإنسان أن يفهم فنًّا من الفنون إلا إذا طلبه على طريقة التأصيل والتقعيد."], [47.0, "فإذا كان الطالب لا يزال يدور في بوتقة الفروع والجزئيات،"], [54.0, "وتغافل عن القواعد والأصول والكليات،"], [59.0, "فإنه لا يزال غيرَ فاهمٍ لهذا الفن مهما بذل فيه ما بذل من الجهود."]], "tr": [[24.8, "Öğretimdeki yolum şudur: Bir ilme onun usûlünden, kaidelerinden, külliyelerinden ve genel zâbıtlarından gireriz."], [31.7, "Böylece talebe bu cüz'î meselelerin ve fer'î hükümlerin nasıl istinbat edildiğini öğrenir."], [39.0, "İnsan bir ilmi ancak onu te'sîl ve takʿîd (usûl ve kaide kurma) yoluyla öğrenirse anlayabilir."], [47.0, "Talebe hâlâ fürû ve cüz'iyyât potasında dönüp duruyor, kaideleri, usûlü ve külliyeleri ihmal ediyorsa, ne kadar emek harcarsa harcasın o ilmi hâlâ anlamış değildir."]]}, {"reader": false, "ar": [[65.0, "فطريقُ فهم الفن: ضبطُ قواعده،"], [68.5, "وضبطُ أصوله، وضبطُ كلياته وضوابطه العامة،"], [78.0, "حتى ينظر الإنسان إلى هذا الفن وجزئياته وفروعه من طاقةٍ عُلويّة،"], [85.0, "يتعرّف بها كيف استنبط العلماء هذه الجزئيات والفروع."], [90.0, "وهذه طريقةٌ توصل الطالب إلى فهم المسألة،"], [94.7, "وفهم الدين، وفهم الفن، وفهم ما يقول."]], "tr": [[65.0, "Bir ilmi anlamanın yolu; kaidelerini, usûlünü, külliyelerini ve genel zâbıtlarını sağlamca öğrenmektir."], [78.0, "Böylece insan bu ilme, onun cüz'î ve fer'î meselelerine yukarıdan bir pencereden bakar ve âlimlerin bu cüz'iyyât ve fürûu nasıl istinbat ettiklerini görür."], [90.0, "Bu yol, talebeyi meseleyi, dini, ilmi ve söylediği şeyi anlamaya ulaştırır."]]}, {"reader": false, "ar": [[102.0, "وهي طريقة الكتاب والسنة الأغلبيّة في التعليم،"], [110.0, "وهي عبارةٌ عن سلاحٍ علميّ يدافع به الطالب عن نفسه كلَّ من يريد علميّتَه <span class=\"q\">؟ 01:50<\/span> بشيءٍ من الضرر أو الشر."], [122.0, "وهي طريقةٌ سلسةٌ يسيرةٌ سهلةٌ في إيصال المعلومة من المعلم إلى التلاميذ،"], [132.0, "بل إن السامع يقتنع بالمعلومة إذا كانت مقرونةً بقاعدتها وأصلها أكثرَ من اقتناعه بالمعلومة إذا جُرِّدت عن قاعدتها وأصلها."]], "tr": [[102.0, "Bu, Kitap ve Sünnet'in öğretimde çoğunlukla kullandığı yoldur."], [110.0, "Talebenin, ilmî birikimine <span class=\"q\">؟<\/span> zarar veya kötülük vermek isteyen herkese karşı kendini savunduğu ilmî bir silahtır."], [122.0, "Bilgiyi hocadan talebeye ulaştırmada akıcı, kolay ve rahat bir yoldur."], [122.0, "Hatta dinleyen kişi, bilgi kaidesi ve aslıyla birlikte verildiğinde, kaidesinden ve aslından soyulmuş hâline göre ona çok daha fazla ikna olur."]]}, {"reader": false, "ar": [[146.0, "فإذا كنتم تريدون حقيقةَ الفهم في الفنون فعليكم بطريقة التأصيل والتقعيد."], [155.0, "فإذا جئتَ إلى علم التوحيد والعقيدة فأْتِ إليه من باب التأصيل والتقعيد،"], [162.0, "كما هو حال دروسنا بإذن الله عز وجل."], [167.0, "وإذا جئت إلى باب الفقه فتعالَ له من كلياته وقواعده وأصوله."], [173.0, "وإذا جئت إلى فن التفسير فتعالَ إليه من قواعده وكلياته وأصوله،"], [181.0, "حتى تكون مشاركًا للعلماء في هذا الفن في تقريراتهم،"], [186.8, "وفاهمًا أتمَّ الفهم لما يقال في هذا الفن."]], "tr": [[146.0, "İlimlerde gerçek anlayışı istiyorsanız te'sîl ve takʿîd yolunu tutun."], [146.0, "Tevhid ve akîde ilmine geldiğinde, ona te'sîl ve takʿîd kapısından gir;"], [155.0, "Allah'ın izniyle derslerimiz de böyledir."], [162.0, "Fıkıh babına geldiğinde ona külliyelerinden, kaidelerinden ve usûlünden gir."], [167.0, "Tefsir ilmine geldiğinde ona kaidelerinden, külliyelerinden ve usûlünden gir."], [181.0, "Böylece o ilimde âlimlerin takrirlerine ortak olur, o ilimde söylenenleri en mükemmel şekilde anlarsın."]]}, {"reader": false, "ar": [[192.0, "فدرسُنا هذا منبثقٌ من هذه الطريقة المحبّبة لديّ من ثلاثين سنة،"], [198.0, "وأنا أحب هذه الطريقة:"], [200.2, "أنني أشرح العلم على طريقة التأصيل والتقعيد،"], [204.0, "حتى يتعرف الطالب على أصول الفن وقواعده وكلياته،"], [209.2, "ليكون راسخًا في هذا الفن بإذن الله عز وجل."]], "tr": [[192.0, "Bu dersimiz, otuz yıldır sevdiğim bu yoldan doğmuştur."], [192.0, "İlmi te'sîl ve takʿîd yoluyla şerh etmeyi severim ki talebe ilmin usûlünü, kaidelerini ve külliyelerini tanısın ve Allah'ın izniyle o ilimde râsih (sağlam) olsun."]]}, {"reader": false, "ar": [[215.0, "وقد جمعتُ لكم في هذه الدروس جُملًا كثيرةً من الكليات قد تزيد على ألف كلية،"], [225.0, "كلها تتكلم عن مسائل العقيدة والتوحيد."], [231.0, "وسوف نأخذها ـ إن شاء الله عز وجل ـ في خمسةٍ وعشرين درسًا،"], [238.3, "كلَّ شهرٍ درسٌ واحد،"], [246.0, "نأخذ فيه إن شاء الله أربعين قاعدة،"], [252.0, "وسوف نستوفي هذا الشرح في سنتين إن شاء الله عز وجل."], [258.0, "فاستعدّوا لما سيقال، واكتبوا وقيّدوا."]], "tr": [[215.0, "Bu derslerde sizin için binden fazla olabilecek pek çok külliye topladım;"], [215.0, "hepsi akîde ve tevhid meselelerinden bahseder."], [225.0, "Allah'ın izniyle bunları her ay bir ders olmak üzere yirmi beş derste işleyeceğiz;"], [238.3, "her derste inşallah kırk kaide ele alacağız ve bu şerhi inşallah iki yılda tamamlayacağız."], [252.0, "Söylenecek olana hazırlanın; yazın ve kaydedin."]]}, {"reader": false, "ar": [[264.0, "وفي بداية كل درس إن شاء الله سوف أراجع الكليات الماضية،"], [270.0, "وسوف يخرج بعد ذلك إن شاء الله في كتاب،"], [274.2, "أنتم بركتُه وأنتم سببُه إن شاء الله تعالى."], [278.0, "هذه القواعد في هذه الدروس سوف تكون في مقدماتٍ في علم التوحيد والعقيدة،"], [289.0, "وهي مقدماتٌ لا بد من معرفتها وفهمها."], [293.1, "فنبدؤها مستعينين بالله عز وجل بالكلية الأولى."], [298.0, "تفضّل يا شيخ فهد."]], "tr": [[264.0, "Her dersin başında inşallah geçmiş külliyeleri tekrar edeceğim."], [264.0, "Daha sonra bu (şerh) inşallah bir kitap olarak çıkacak;"], [274.2, "onun bereketi de sebebi de sizsiniz."], [274.2, "Bu derslerdeki kaideler, tevhid ve akîde ilmine dair mukaddimeler olacak;"], [278.0, "bilinmesi ve anlaşılması zorunlu mukaddimeler."], [289.0, "Allah'tan yardım dileyerek birinci külliye ile başlıyoruz. Buyur Şeyh Fehd."]]}]}, {"ts": "05:00", "title": "1. Külliye: Tevhid, nefy ile isbatın birleşmesidir", "paras": [{"reader": true, "ar": [[300.0, "الحمد لله رب العالمين،"], [302.2, "والصلاة والسلام على أشرف الأنبياء وخاتم المرسلين،"], [306.0, "نبينا محمد وعلى آله وصحبه أجمعين،"], [309.0, "أما بعد: اللهم اغفر لنا ولشيخنا ولوالديه ولوالدينا وللحاضرين والمستمعين ولجميع المسلمين."], [315.0, "قال المؤلف رحمه الله تعالى وعفا الله عنا وعنه في الدنيا والآخرة:"], [320.0, "الكليات العقدية. الكلية الأولى:"], [325.0, "كلُّ توحيدٍ لا يُبنى على الجمع بين النفي والإثبات فليس بتوحيد."]], "tr": [[300.0, "Âlemlerin Rabbi Allah'a hamd, peygamberlerin en şereflisi ve resullerin sonuncusu Peygamberimiz Muhammed'e, âline ve bütün ashâbına salât ve selâm olsun."], [309.0, "Allah'ım! Bizi, hocamızı, onun anne-babasını, anne-babalarımızı, burada bulunanları, dinleyenleri ve bütün Müslümanları bağışla."], [315.0, "Müellif —Allah ona rahmet etsin, dünyada ve âhirette bizi ve onu affetsin— şöyle dedi:"], [320.0, "<b>Akîde külliyeleri. Birinci külliye: Nefy ile isbatı birleştirme üzerine bina edilmeyen her tevhid, tevhid değildir.<\/b>"]]}, {"reader": false, "ar": [[330.0, "هذه من أعظم الكليات التي يتعرف بها الطالب على حقيقة التوحيد:"], [336.0, "<b>فكلُّ توحيدٍ لم يُبنَ على النفي والإثبات فليس بتوحيد.<\/b> كل توحيدٍ لم يُبنَ على النفي والإثبات فليس بتوحيد."], [358.0, "أعيدها مرةً ثالثة: كل توحيدٍ لم يُبنَ على النفي والإثبات فليس بتوحيد."]], "tr": [[330.0, "Bu, talebenin tevhidin hakikatini tanıdığı en büyük külliyelerdendir:"], [336.0, "<b>Nefy ve isbat üzerine bina edilmeyen her tevhid, tevhid değildir.<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[367.0, "أقول وبالله التوفيق: هذه الكلية يتعرف الطالب بها على حقيقة التوحيد المطلوب منه شرعًا."], [376.0, "فالتوحيد له ركنان لا ينفكّان عن بعضهما ولا ينفصلان أبدًا:"], [384.0, "الركن الأول ركن النفي،"], [386.9, "والركن الثاني ركن الإثبات."], [391.0, "فالتوحيد ليس هو النفي فقط،"], [394.6, "لأن النفي تعطيلٌ محض،"], [400.0, "وليس التوحيد بإثباتٍ فقط،"], [402.8, "لأن الإثبات لا يمنع المشاركة."], [409.0, "فلا النفيُ لوحده توحيد،"], [411.9, "ولا الإثباتُ لوحده توحيد،"], [417.0, "وإنما حقيقة التوحيد أن تجمع بين النفي والإثبات."], [423.0, "فمتى ما قام الركنان في أمرٍ من الأمور فأنت موحِّدٌ له،"], [431.0, "ومتى ما سقط واحدٌ من هذه الأركان فأنت لستَ بموحّدٍ له."]], "tr": [[367.0, "Tevfik Allah'tandır, derim ki: Bu külliye ile talebe, şer'an kendisinden istenen tevhidin hakikatini öğrenir."], [376.0, "Tevhidin birbirinden asla ayrılmayan iki rüknü vardır:"], [376.0, "Birincisi nefy (olumsuzlama), ikincisi isbat (olumlama) rüknüdür."], [386.9, "Tevhid sadece nefy değildir; çünkü sadece nefy, katıksız ta'tildir (sıfatsız bırakmaktır)."], [400.0, "Tevhid sadece isbat da değildir;"], [402.8, "çünkü isbat, ortaklığa engel olmaz."], [409.0, "Ne tek başına nefy tevhiddir ne de tek başına isbat."], [417.0, "Tevhidin hakikati, nefy ile isbatı birleştirmendir."], [423.0, "Bir hususta iki rükün birlikte bulunursa o hususta birleyici (muvahhid) olursun;"], [431.0, "bu rükünlerden biri düşerse o hususta muvahhid olmazsın."]]}, {"reader": false, "ar": [[438.0, "فلو قلتَ: «زيدٌ شجاع»،"], [440.7, "فأنت وصفتَ زيدًا بالشجاعة،"], [443.4, "ولكن لم تنفِها عن غيره،"], [449.0, "فأنت لستَ بموحّدٍ لزيدٍ بالشجاعة."], [453.0, "وإذا قلت: «ما زيدٌ بشجاع»،"], [456.3, "فأنت نفيتَ الشجاعة عن زيد،"], [459.6, "وهذا تعطيلٌ له عن هذه الصفة."], [464.0, "فإذا أردت أن توحّد زيدًا بالشجاعة فقل:"], [468.8, "«ما شجاعٌ إلا زيد»."], [472.0, "فإذا جمعت بين النفي والإثبات في وصف زيدٍ بالشجاعة فحينئذٍ تكون موحِّدًا له بالشجاعة."]], "tr": [[438.0, "\"Zeyd cesurdur\" dersen, Zeyd'i cesaretle nitelemiş olursun, ama cesareti başkasından nefyetmemişsindir;"], [449.0, "dolayısıyla Zeyd'i cesarette tekleştirmiş olmazsın."], [453.0, "\"Zeyd cesur değildir\" dersen, cesareti Zeyd'den nefyetmiş olursun;"], [459.6, "bu da onu bu sıfattan mahrum bırakmaktır (ta'til)."], [464.0, "Zeyd'i cesarette tekleştirmek istersen \"Zeyd'den başka cesur yoktur\" de."], [472.0, "Zeyd'i cesaretle nitelemede nefy ile isbatı birleştirdiğinde, işte o zaman onu cesarette tekleştirmiş olursun."]]}, {"reader": false, "ar": [[481.0, "وعلى ذلك جاءت الأدلة في توحيد الله عز وجل في كل شيء."], [488.0, "فقال في توحيد ألوهيته:"], [490.6, "<span class=\"ayah\">﴿فَاعْلَمْ أَنَّهُ لَا إِلَٰهَ إِلَّا اللَّهُ﴾<\/span> <span class=\"ref\">[محمد: ١٩]<\/span>،"], [492.9, "«لا إله» وهذا النفي،"], [494.4, "«إلا الله» وهذا الإثبات."], [497.0, "فجمع الله عز وجل في توحيد ألوهيته بين النفي والإثبات."], [503.0, "فلو قلت: «لا إله» فقط،"], [506.6, "فهذا تعطيلٌ للإلهية. ولو قلت:"], [510.4, "«الله هو الإله» فقط،"], [513.2, "فهذا وصفٌ له بالألوهية،"], [516.0, "ولكنك لم تنفِها عن غيره."], [519.0, "فلا الأولُ بتوحيد لأنه نفيٌ فقط،"], [523.0, "ولا الثاني بتوحيد لأنه إثباتٌ فقط."], [527.0, "ولكن إن قلت: «لا إله إلا الله»،"], [531.0, "فأنت موحّدٌ لله عز وجل في هذه الصفة،"], [535.0, "أي في صفة الألوهية."]], "tr": [[481.0, "Allah Teâlâ'yı her şeyde tevhid konusundaki deliller de bu şekilde gelmiştir."], [488.0, "Ulûhiyyetinin tevhidi hakkında şöyle buyurmuştur:"], [490.6, "<span class=\"ayah\">﴿Bil ki Allah'tan başka ilah yoktur﴾<\/span> [Muhammed 19]."], [492.9, "\"İlah yoktur\" nefydir, \"Allah'tan başka\" isbattır."], [494.4, "Allah Teâlâ ulûhiyyetinin tevhidinde nefy ile isbatı birleştirmiştir."], [497.0, "Sadece \"ilah yoktur\" dersen bu, ilahlığı ta'til olur."], [506.6, "Sadece \"Allah ilahtır\" dersen bu, O'nu ulûhiyyetle nitelemektir, ama bunu başkasından nefyetmemişsindir."], [519.0, "Birincisi tevhid değildir, çünkü sadece nefydir;"], [523.0, "ikincisi de tevhid değildir, çünkü sadece isbattır."], [527.0, "Ama \"Lâ ilâhe illallah\" dersen, Allah'ı bu sıfatta, yani ulûhiyyet sıfatında tekleştirmiş olursun."]]}, {"reader": false, "ar": [[537.0, "وكذلك قال الله عز وجل في توحيده في صفة الخلق:"], [543.0, "<span class=\"ayah\">﴿هَلْ مِنْ خَالِقٍ غَيْرُ اللَّهِ﴾<\/span> <span class=\"ref\">[فاطر: ٣]<\/span>."], [546.0, "فقوله: «هل من خالق» هذا نفيٌ للخالقية عن غيره،"], [551.0, "وقوله: «غير الله» هذا إثباتٌ لصفته بالخلق."], [557.0, "فلو قلت: «الله خالق» فقط،"], [562.0, "فأنت تثبت وصف الخلق لله عز وجل ولكنك لم توحّده به."], [567.0, "وإذا قلت: «ما من خالق» فقط،"], [572.0, "فأنت تعطّل الله عز وجل عن صفة الخلق."], [575.0, "لكن إن قلت: «لا خالق إلا الله»،"], [578.7, "فحينئذٍ تكون موحّدًا لله عز وجل بصفة الخلق،"], [583.0, "لأنك نفيتَها عن غيره وأثبتَّها له."], [587.0, "فلما قام ركنا التوحيد في صفة الخلق تكون على سَنَن التوحيد الصحيح في هذه الصفة."]], "tr": [[537.0, "Aynı şekilde Allah Teâlâ yaratma sıfatındaki tevhidi hakkında şöyle buyurmuştur:"], [543.0, "<span class=\"ayah\">﴿Allah'tan başka bir yaratıcı var mı?﴾<\/span> [Fâtır 3]."], [546.0, "\"Bir yaratıcı var mı?\" ifadesi yaratıcılığı başkasından nefyetmektir;"], [551.0, "\"Allah'tan başka\" ifadesi ise O'nun yaratma sıfatını isbattır."], [557.0, "Sadece \"Allah yaratıcıdır\" dersen, yaratma vasfını Allah'a isbat etmiş olursun, ama O'nu bu vasıfta tekleştirmiş olmazsın."], [567.0, "Sadece \"hiçbir yaratıcı yoktur\" dersen, Allah'ı yaratma sıfatından ta'til etmiş olursun."], [575.0, "Ama \"Allah'tan başka yaratıcı yoktur\" dersen, Allah'ı yaratma sıfatında tekleştirmiş olursun;"], [583.0, "çünkü onu başkasından nefyedip O'na isbat etmişsindir."], [587.0, "Tevhidin iki rüknü yaratma sıfatında bir araya gelince, bu sıfatta doğru tevhid yolunda olursun."]]}, {"reader": false, "ar": [[596.0, "ولما جاء الله عز وجل يُثبت له صفة الغيب أثبتها له بالركنين جميعًا،"]], "tr": [[596.0, "Allah Teâlâ kendisi için gayb (bilgisi) sıfatını isbat ettiğinde de onu iki rükünle birlikte isbat etmiştir:"]]}]}, {"ts": "10:00", "title": "1. Külliye (devam)", "paras": [{"reader": false, "ar": [[605.0, "فقال الله عز وجل:"], [607.3, "<span class=\"ayah\">﴿قُل لَّا يَعْلَمُ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ الْغَيْبَ إِلَّا اللَّهُ﴾<\/span> <span class=\"ref\">[النمل: ٦٥]<\/span>."], [613.0, "فجمع الله عز وجل في اتصافه بعلم الغيب المطلق بين النفي في قوله:"], [621.5, "«لا يعلم من في السماوات والأرض الغيب»،"], [628.0, "وبين الإثبات في قوله:"], [630.7, "«إلا الله». فلا يتم توحيد الله عز وجل بهذه الصفة إلا إذا قامت على ركني النفي والإثبات."], [642.0, "وهكذا دواليك في آياتٍ كثيرة."]], "tr": [[605.0, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿De ki: Göklerde ve yerde olanlar gaybı bilmez, ancak Allah bilir﴾<\/span> [Neml 65]."], [607.3, "Allah Teâlâ mutlak gayb bilgisiyle nitelenmesinde, \"göklerde ve yerde olanlar gaybı bilmez\" sözündeki nefy ile \"ancak Allah\" sözündeki isbatı birleştirmiştir."], [630.7, "Allah'ı bu sıfatta tevhid, ancak nefy ve isbat rükünleri üzerine kurulursa tamam olur."], [630.7, "Pek çok ayette de durum böyledir."]]}, {"reader": false, "ar": [[647.0, "فمن أراد أن يوحّد الله في ألوهيته فليقل:"], [650.6, "«لا إله إلا الله»."], [653.0, "وإذا أراد الإنسان أن يوحّد الله عز وجل في ربوبيته فليقل:"], [660.2, "«لا ربَّ لهذا العالم إلا الله»."], [665.0, "وتأمّل معي قول الله عز وجل في توحيد الأسماء والصفات،"], [672.0, "وكيف جمع الله فيه بين النفي في قوله:"], [677.1, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span>، وبين الإثبات في قوله: <span class=\"ayah\">﴿وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>."]], "tr": [[647.0, "Allah'ı ulûhiyyetinde tevhid etmek isteyen \"Lâ ilâhe illallah\" desin."], [650.6, "İnsan Allah'ı rubûbiyyetinde tevhid etmek isterse \"Bu âlemin Allah'tan başka Rabbi yoktur\" desin."], [660.2, "Benimle birlikte, Allah Teâlâ'nın isim ve sıfatların tevhidi hakkındaki sözünü düşün:"], [672.0, "Allah burada <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> sözündeki nefy ile <span class=\"ayah\">﴿O, işitendir, görendir﴾<\/span> [Şûrâ 11] sözündeki isbatı nasıl birleştirmiştir."]]}, {"reader": false, "ar": [[685.0, "فتوحيد الأسماء والصفات قائمٌ على ركنين:"], [692.0, "على ركن النفي، في أن الله لا يماثله شيءٌ في هذه الصفات،"], [697.0, "وعلى ركن الإثبات، وهو إثبات صفات الكمال لله عز وجل."], [703.0, "فمن نفى الصفات فقط فقد عطّل الله عن صفاته،"], [711.0, "ومن أثبت صفات الكمال لله فقط ولم ينفِ المماثلة فإنه حينئذٍ لم يمنع مشاركة أحدٍ من المخلوقات لله عز وجل في هذه الصفات."], [726.0, "لكن إن قال: أُثبت لله الأسماء والصفات على وجهٍ لا يماثل صفات المخلوقات،"], [736.0, "فحينئذٍ يكون قد جمع في توحيده بين النفي والإثبات."]], "tr": [[685.0, "İsim ve sıfatların tevhidi iki rükün üzerine kuruludur:"], [692.0, "Nefy rüknü, yani bu sıfatlarda hiçbir şeyin Allah'a benzemediği;"], [692.0, "isbat rüknü, yani kemal sıfatlarının Allah Teâlâ'ya isbatı."], [697.0, "Sadece sıfatları nefyeden, Allah'ı sıfatlarından ta'til etmiştir."], [711.0, "Allah'a kemal sıfatlarını isbat edip benzerliği nefyetmeyen ise mahlûkattan herhangi birinin bu sıfatlarda Allah'a ortak olmasını engellememiş olur."], [711.0, "Ama \"Allah'a isim ve sıfatları, mahlûkatın sıfatlarına benzemeyecek şekilde isbat ediyorum\" derse, işte o zaman tevhidinde nefy ile isbatı birleştirmiş olur."]]}, {"reader": false, "ar": [[742.0, "وإذا أردتَ أن توحّد الله في صفة التدبير والتصريف فقل:"], [747.7, "«لا مدبِّرَ» ـ وهذا النفي ـ «ولا متصرِّفَ» ـ وهذا النفي ـ «في هذا العالم استقلالًا إلا الله»."], [758.0, "فإذا جمعت في هذا التوحيد التدبيري التصريفي لله عز وجل بين الإثبات والنفي تكون فعلًا قد أقمتَ توحيدك على ركنيه."], [771.0, "والكلام في هذا يطول،"], [773.9, "ولكن لعلكم فهمتم مقصودي:"], [777.0, "فحقيقة التوحيد ليست هي الإثبات فقط،"], [781.2, "وليست هي النفي فقط،"], [784.0, "بل لا بد في حقيقة التوحيد من الجمع بين ركني الإثبات والنفي."], [790.4, "والله الموفق والهادي. واضح؟"]], "tr": [[742.0, "Allah'ı tedbir ve tasarruf sıfatında tevhid etmek istersen \"Bu âlemde müstakil olarak Allah'tan başka müdebbir (idare eden) yoktur\" —bu nefydir— \"ve mutasarrıf (tasarruf eden) yoktur\" de."], [758.0, "Allah'ın bu tedbir ve tasarruf tevhidinde isbat ile nefyi birleştirdiğinde, tevhidini gerçekten iki rüknü üzerine kurmuş olursun."], [771.0, "Bu konuda söz uzar, ama umarım maksadımı anladınız:"], [777.0, "Tevhidin hakikati ne sadece isbattır ne sadece nefy."], [781.2, "Tevhidin hakikatinde isbat ve nefy rükünlerini birleştirmek şarttır."], [784.0, "Tevfik ve hidayet Allah'tandır. Anlaşıldı mı?"]]}]}, {"ts": "13:12", "title": "2. Külliye: Şer'î delilin şahitlik etmediği her akîde bâtıldır", "paras": [{"reader": true, "ar": [[796.0, "أحسن الله إليكم. الكلية الثانية:"], [799.3, "كلُّ عقيدةٍ لا يشهد لها دليلُ الشرع بالصحة والاعتبار فباطلة."]], "tr": [[796.0, "Allah size iyilik etsin. İkinci külliye:"], [799.3, "Şer'î delilin sıhhat ve itibar ile şahitlik etmediği her akîde bâtıldır."]]}, {"reader": false, "ar": [[807.0, "نعم، تقول هذه الكلية:"], [809.8, "كلُّ عقيدةٍ لا يشهد لها دليلُ الشرع بالصحة والاعتبار فهي باطلة."], [830.0, "وأعيدها مرةً أخرى، لأن حفظ الكليات عندي أهمُّ من حفظ غيرها من الجزئيات:"], [839.0, "كل عقيدةٍ لا يشهد لها دليل الشرع بالصحة والاعتبار فهي باطلة."], [852.0, "أعيدها مرةً أخرى: كل عقيدةٍ لا يشهد لها دليل الشرع بالصحة والاعتبار فهي باطلة."]], "tr": [[807.0, "Evet, bu külliye der ki:"], [809.8, "Şer'î delilin sıhhat ve itibar ile şahitlik etmediği her akîde bâtıldır."], [830.0, "Bir kez daha tekrar ediyorum, çünkü bence külliyeleri ezberlemek, cüz'î meseleleri ezberlemekten daha önemlidir."], [852.0, "(İki kez daha tekrar ediyor.)"]]}, {"reader": false, "ar": [[867.0, "أقول وبالله التوفيق: إن إثبات العقائد نوعٌ من إثبات الأحكام الشرعية ـ إن إثبات العقيدة نوعٌ من إثبات الأحكام الشرعية ـ والمتقرر في القواعد أن إثبات الأحكام الشرعية مفتقرٌ إلى دليلٍ صحيحٍ صريح."], [892.0, "فلا حقَّ لأحدٍ أن يُثبت عقيدةً من العقائد إلا وعلى هذا الإثبات دليلٌ من الوحي."]], "tr": [[867.0, "Tevfik Allah'tandır, derim ki: Akîdeleri isbat etmek, şer'î hükümleri isbat etmenin bir türüdür."], [867.0, "Kaidelerde yerleşik olan şudur: Şer'î hükümleri isbat etmek, sahih ve sarih bir delile muhtaçtır."], [867.0, "Dolayısıyla hiç kimsenin, o isbata dair vahiyden bir delil olmadıkça herhangi bir akîdeyi isbat etme hakkı yoktur."]]}]}, {"ts": "15:00", "title": "2. Külliye (devam): Ehl-i Sünnet'in kaynağı, Kur'an'ın delil isteme metodu", "paras": [{"reader": false, "ar": [[903.0, "فأهل السنة والجماعة متفقون على أنهم لا يأخذون معتقداتهم إلا من الكتاب والسنة،"], [911.4, "وعلى فهم سلف الأمة كما سيأتي إن شاء الله."], [918.0, "وقد شهدت الأدلة بأن من أخذ عقائده من هذين المصدرين فقط فإنه على الهدى والصراط المستقيم،"], [931.0, "وقد سلك طريق النجاة في باب الاعتقاد."], [934.0, "قال الله عز وجل:"], [936.8, "<span class=\"ayah\">﴿وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا﴾<\/span> <span class=\"ref\">[آل عمران: ١٠٣]<\/span>،"], [941.0, "وحبلُ الله: أي كتابه وعهده وميثاقه."], [945.0, "وقال الله عز وجل:"], [947.8, "<span class=\"ayah\">﴿وَالَّذِينَ يُمَسِّكُونَ بِالْكِتَابِ وَأَقَامُوا الصَّلَاةَ إِنَّا لَا نُضِيعُ أَجْرَ الْمُصْلِحِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٧٠]<\/span>."], [955.0, "والشاهد من ذلك قوله عز وجل:"], [958.8, "«يُمسِّكون بالكتاب»، أي يأمرون الناس بالأخذ من الكتاب والسنة."]], "tr": [[903.0, "Ehl-i Sünnet ve'l-Cemaat, inançlarını ancak Kitap ve Sünnet'ten ve —inşallah ileride geleceği üzere— ümmetin selefinin anlayışına göre aldıkları konusunda ittifak hâlindedir."], [918.0, "Deliller, akîdelerini sadece bu iki kaynaktan alanın hidayet ve sırât-ı müstakîm üzere olduğuna ve itikad babında kurtuluş yoluna girdiğine şahitlik etmiştir."], [936.8, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿Hep birlikte Allah'ın ipine sımsıkı sarılın ve ayrılmayın﴾<\/span> [Âl-i İmrân 103]."], [941.0, "Allah'ın ipi; O'nun Kitabı, ahdi ve misakıdır."], [945.0, "Allah Teâlâ şöyle de buyurmuştur:"], [947.8, "<span class=\"ayah\">﴿Kitab'a sımsıkı sarılan ve namazı dosdoğru kılanlar (bilsinler ki) biz, ıslah edenlerin ecrini zayi etmeyiz﴾<\/span> [A'râf 170]."], [955.0, "Buradaki delil \"Kitab'a sımsıkı sarılanlar\" ifadesidir;"], [958.8, "yani insanlara Kitap ve Sünnet'ten almayı emrederler."]]}, {"reader": false, "ar": [[965.0, "فليس لنا ـ معاشرَ أهل السنة والجماعة ـ مصادرُ أخرى نسوق منها عقائدنا."], [972.0, "فكلُّ من دعاك إلى اعتقاد شيءٍ،"], [976.0, "فقبل أن تقبل دعوته لا بد أن تسأل عن برهان عقيدته،"], [986.0, "عن دليل عقيدته. فإن جاء به صحيحًا صريحًا ومفهومًا على فهم الصحابة فقل:"], [995.6, "أهلًا وسهلًا، وسأعتقد ما تدعوني إليه."], [999.0, "وأما إن لم يأتِ على هذه الدعوة بدليلٍ صحيحٍ صريح،"], [1006.0, "فلا يجوز لك أن تُسلِّم له سمعَ أذنك ولا اهتمامَ قلبك،"], [1011.9, "لأنه يدعوك إلى الباطل."]], "tr": [[965.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğunun, akîdelerimizi dayandırdığımız başka kaynakları yoktur."], [972.0, "Seni bir şeye inanmaya çağıran herkesin davetini kabul etmeden önce, akîdesinin burhanını, delilini sorman gerekir."], [986.0, "Onu sahih, sarih ve sahabenin anlayışına göre anlaşılmış olarak getirirse \"Başüstüne, beni çağırdığın şeye inanacağım\" de."], [999.0, "Bu davete sahih ve sarih bir delil getirmezse, ona ne kulağını ne de kalbinin ilgisini vermen caizdir; çünkü seni bâtıla çağırmaktadır."]]}, {"reader": false, "ar": [[1014.0, "ولذلك فإن منهج القرآن عند إبطال العقائد الفاسدة هو طلبُ الدليل."], [1023.0, "فالله عز وجل يحكي العقيدة الفاسدة،"], [1026.7, "ثم يبيّن فسادها بأنه لا دليل عليها،"], [1031.0, "ليس لها دليلٌ يشهد لها من الشرع،"], [1035.0, "ليس عليها أثارةٌ من علمٍ ولا برهان."], [1040.0, "والاعتقادُ توقيفيٌّ على دلالة النص،"], [1045.0, "فكل عقيدةٍ لا يشهد لها النص الصحيح الصريح بالاعتبار والصحة فإنها عقيدةٌ فاسدة."]], "tr": [[1014.0, "Bu yüzden Kur'an'ın fâsid akîdeleri iptal ederken izlediği metot delil istemektir."], [1014.0, "Allah Teâlâ fâsid akîdeyi nakleder, sonra onun fesadını, üzerinde hiçbir delil olmadığıyla açıklar:"], [1031.0, "Şeriattan ona şahitlik eden bir delil yoktur, onu destekleyen bir ilim kalıntısı veya burhan yoktur."], [1040.0, "İtikad, nassın delâletine bağlı (tevkîfî) bir iştir."], [1045.0, "Sahih ve sarih nassın itibar ve sıhhatle şahitlik etmediği her akîde fâsid bir akîdedir."]]}, {"reader": false, "ar": [[1053.0, "تأمّلوا معي قول الله عز وجل:"], [1056.1, "<span class=\"ayah\">﴿سَيَقُولُ الَّذِينَ أَشْرَكُوا لَوْ شَاءَ اللَّهُ مَا أَشْرَكْنَا وَلَا آبَاؤُنَا وَلَا حَرَّمْنَا مِن شَيْءٍ ۚ كَذَٰلِكَ كَذَّبَ الَّذِينَ مِن قَبْلِهِمْ حَتَّىٰ ذَاقُوا بَأْسَنَا ۗ قُلْ هَلْ عِندَكُم مِّنْ عِلْمٍ فَتُخْرِجُوهُ لَنَا ۖ إِن تَتَّبِعُونَ إِلَّا الظَّنَّ وَإِنْ أَنتُمْ إِلَّا تَخْرُصُونَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٤٨]<\/span> <span class=\"note\">(Şeyh ayete «وقال الذين أشركوا» diye başlıyor; bu, Nahl 35'in başıdır. Ayetin geri kalanı En'âm 148'dir.)<\/span> فكانوا يعتقدون أن الاحتجاج بالقدر على فعل الشرك بمُنجٍ لهم بين يدي الله يوم القيامة،"], [1088.0, "فكانوا يعتقدون أنهم إذا قالوا ذلك بين يدي الله أنهم سينجون من عذاب الله،"], [1098.0, "وهذه عقيدةٌ في قلوبهم."]], "tr": [[1053.0, "Benimle birlikte Allah Teâlâ'nın şu sözünü düşünün:"], [1056.1, "<span class=\"ayah\">﴿Şirk koşanlar diyecekler ki: \"Allah dileseydi ne biz şirk koşardık ne de atalarımız; hiçbir şeyi de haram kılmazdık.\" Onlardan öncekiler de azabımızı tadıncaya kadar böyle yalanladılar. De ki: \"Yanınızda bize çıkarıp göstereceğiniz bir ilim var mı? Siz ancak zanna uyuyorsunuz ve siz ancak tahminde bulunuyorsunuz.\"﴾<\/span> [En'âm 148]."], [1056.1, "Onlar, şirk koşmalarına kaderi delil getirmenin kıyamet günü Allah'ın huzurunda kendilerini kurtaracağına inanıyorlardı."], [1056.1, "Allah'ın huzurunda bunu söylediklerinde Allah'ın azabından kurtulacaklarına inanıyorlardı; bu, kalplerindeki bir akîdeydi."]]}, {"reader": false, "ar": [[1101.0, "فطلب الله عز وجل منهم البرهانَ المصحِّحَ لهذا الاعتقاد،"], [1107.0, "وبيّن أن عقيدتهم هذه لا يشهد لها دليل الشرع بالصحة والاعتبار،"], [1116.0, "ووصفها الله عز وجل بالكذب لأنها لا تستند إلى دليل،"], [1121.0, "وبالتخرّص لأنها لا تستند إلى دليل،"], [1126.0, "وبالظن الكاذب والبهتان الفاجر لأنها لا تستند إلى دليل."], [1132.0, "فأخذنا من ذلك أن كل عقيدةٍ لا تستند إلى دليلٍ وبرهانٍ من الشرع صحيحٍ صريح فإنها عقيدةٌ فاسدة."]], "tr": [[1101.0, "Allah Teâlâ onlardan bu inancı doğrulayacak burhanı istedi ve bu akîdelerine şer'î delilin sıhhat ve itibarla şahitlik etmediğini açıkladı."], [1107.0, "Allah onu yalanla nitelendi, çünkü bir delile dayanmıyordu;"], [1116.0, "tahminle (tahârrus) nitelendi, çünkü bir delile dayanmıyordu;"], [1126.0, "yalan zan ve günahkâr iftira ile nitelendi, çünkü bir delile dayanmıyordu."], [1132.0, "Buradan şunu çıkardık: Şeriattan sahih ve sarih bir delile ve burhana dayanmayan her akîde fâsid bir akîdedir."]]}, {"reader": false, "ar": [[1146.0, "وكذلك تأمّلوا معي قول الله تبارك وتعالى:"], [1154.0, "<span class=\"ayah\">﴿وَجَعَلُوا الْمَلَائِكَةَ الَّذِينَ هُمْ عِبَادُ الرَّحْمَٰنِ إِنَاثًا ۚ أَشَهِدُوا خَلْقَهُمْ ۚ سَتُكْتَبُ شَهَادَتُهُمْ وَيُسْأَلُونَ﴾<\/span> <span class=\"ref\">[الزخرف: ١٩]<\/span>."], [1165.0, "طالبهم الله عز وجل بالبرهان المصحِّح لهذه العقيدة:"], [1170.0, "أين برهانكم على أن الله قد خلق الملائكة إناثًا؟"], [1174.0, "هل عندكم شيءٌ يشهد لهذا الاعتقاد؟"], [1178.0, "أم أنكم تقولون على الله ما لا تعلمون،"], [1181.0, "وتهذون وتخرّفون بما لا تفقهون؟"], [1186.0, "وهذا حال أهل العقائد الفاسدة:"], [1189.0, "أن أصعب سؤالٍ عليهم:"], [1193.0, "أين الدليل على صحة ما تقول؟"]], "tr": [[1146.0, "Aynı şekilde Allah Tebâreke ve Teâlâ'nın şu sözünü de düşünün:"], [1154.0, "<span class=\"ayah\">﴿Rahmân'ın kulları olan melekleri dişi saydılar. Onların yaratılışına şahit mi oldular? Şahitlikleri yazılacak ve sorguya çekilecekler﴾<\/span> [Zuhruf 19]."], [1154.0, "Allah Teâlâ onlardan bu akîdeyi doğrulayacak burhanı istedi:"], [1165.0, "Allah'ın melekleri dişi yarattığına dair burhanınız nerede?"], [1170.0, "Bu inanca şahitlik eden bir şeyiniz var mı?"], [1174.0, "Yoksa Allah hakkında bilmediğiniz şeyleri mi söylüyor, anlamadığınız şeylerle saçmalayıp hurafe mi uyduruyorsunuz?"], [1181.0, "Fâsid akîde sahiplerinin hâli budur:"], [1186.0, "Onlara en zor gelen soru \"Söylediğinin doğruluğuna delil nerede?\" sorusudur."]]}]}, {"ts": "20:00", "title": "2. Külliye (devam): Delili olmayan bâtıl akîdelere örnekler", "paras": [{"reader": false, "ar": [[1200.0, "حتى صاروا يسخرون منا لمّا رأوه منا بكثرة طلب الدليل،"], [1211.0, "صاروا يسخرون منا ويقولون:"], [1213.7, "وهل كلُّ شيءٍ يحتاج إلى دليل؟"], [1217.8, "الجواب: نعم، لأن الأمر أمرٌ عقدي،"], [1222.9, "وإثبات العقائد حكمٌ شرعي،"], [1226.0, "والأحكام الشرعية تفتقر في ثبوتها للأدلة الصحيحة الصريحة."]], "tr": [[1200.0, "Hatta bizde gördükleri çok delil isteme yüzünden bizimle alay etmeye başladılar ve \"Her şey delile mi muhtaç?\" dediler."], [1213.7, "Cevap: Evet. Çünkü mesele itikadî bir meseledir, akîdeleri isbat etmek şer'î bir hükümdür ve şer'î hükümler sabit olmak için sahih ve sarih delillere muhtaçtır."]]}, {"reader": false, "ar": [[1234.0, "وتأمّل معي أيضًا قول الله عز وجل في سورة النجم ـ ولعلكم تذكّرونني إذا أخطأتُ أو نسيت ـ في قول الله تبارك وتعالى:"], [1247.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ لَيُسَمُّونَ الْمَلَائِكَةَ تَسْمِيَةَ الْأُنثَىٰ﴾<\/span>،"], [1256.0, "وهذه عقيدتهم، فأبطلها الله عز وجل بقوله:"], [1261.5, "<span class=\"ayah\">﴿وَمَا لَهُم بِهِ مِنْ عِلْمٍ ۖ إِن يَتَّبِعُونَ إِلَّا الظَّنَّ ۖ وَإِنَّ الظَّنَّ لَا يُغْنِي مِنَ الْحَقِّ شَيْئًا﴾<\/span> <span class=\"ref\">[النجم: ٢٧–٢٨]<\/span>."], [1271.0, "فكيف أبطل الله عقيدتهم في تسمية الملائكة بأسماء الإناث؟"], [1277.0, "بأنها عقيدةٌ لم تُبنَ على علمٍ ولا على برهانٍ ولا على دليلٍ من الشرع."], [1288.0, "فبمجرّد انفصال العقيدة عن برهانها فهو دليلٌ على بطلانها."]], "tr": [[1234.0, "Benimle birlikte Allah Teâlâ'nın Necm sûresindeki şu sözünü de düşün —hata edersem veya unutursam bana hatırlatırsınız—:"], [1247.0, "<span class=\"ayah\">﴿Âhirete inanmayanlar melekleri dişi isimleriyle adlandırıyorlar﴾<\/span>."], [1247.0, "Bu onların akîdesidir. Allah onu şu sözüyle iptal etti:"], [1256.0, "<span class=\"ayah\">﴿Onların bu konuda hiçbir bilgisi yoktur; sadece zanna uyuyorlar. Zan ise haktan hiçbir şeyin yerini tutmaz﴾<\/span> [Necm 27–28]."], [1261.5, "Allah, melekleri dişi isimleriyle adlandırma akîdelerini nasıl iptal etti?"], [1271.0, "Bunun ilme, burhana ve şer'î bir delile dayanmayan bir akîde olduğunu bildirerek."], [1277.0, "Bir akîdenin burhanından kopuk olması, tek başına bâtıl olduğunun delilidir."]]}, {"reader": false, "ar": [[1295.0, "ولذلك فإن الطواف حول القبور عقيدةٌ باطلة،"], [1301.0, "لأنها لا يشهد لها دليل الشرع بالصحة والاعتبار."], [1306.0, "واعتقادُ جواز دعاء الأموات والاستغاثة بهم من دون الله عز وجل عقيدةٌ فاسدةٌ باطلةٌ كاسدةٌ إبليسيةٌ شيطانية،"], [1323.0, "لماذا؟ لأنه لا يشهد لها دليل الشرع بالاعتبار ولا بالصحة."], [1332.0, "واعتقادُ جواز الذبح للأموات وللأولياء والصالحين عقيدةٌ باطلةٌ فاسدة،"], [1340.1, "لماذا؟ لأنه لا يشهد لها دليل الشرع بالاعتبار."], [1348.0, "واعتقادُ أن الوليّ يملك شيئًا من التدبير الاستقلالي أو التصريف الابتدائي هذا اعتقادٌ باطل،"], [1360.0, "لماذا؟ لأنه لا يشهد له دليل الشرع بالصحة والاعتبار."]], "tr": [[1295.0, "Bu yüzden kabirlerin etrafında tavaf etmek bâtıl bir akîdedir, çünkü şer'î delil ona sıhhat ve itibarla şahitlik etmez."], [1306.0, "Ölülere dua etmenin ve Allah'ı bırakıp onlardan istiğase etmenin (yardım dilemenin) caiz olduğuna inanmak fâsid, bâtıl, geçersiz, iblisçe ve şeytanca bir akîdedir."], [1323.0, "Neden? Çünkü şer'î delil ona ne itibarla ne de sıhhatle şahitlik eder."], [1332.0, "Ölüler, veliler ve salihler için kurban kesmenin caiz olduğuna inanmak bâtıl ve fâsid bir akîdedir."], [1340.1, "Neden? Çünkü şer'î delil ona itibarla şahitlik etmez."], [1348.0, "Velinin müstakil bir tedbire veya kendiliğinden bir tasarrufa sahip olduğuna inanmak bâtıl bir inançtır."], [1360.0, "Neden? Çünkü şer'î delil ona sıhhat ve itibarla şahitlik etmez."]]}, {"reader": false, "ar": [[1367.8, "واعتقادُ مشروعية الأذكار الجماعية،"], [1373.0, "وضربِ الطبول والدفوف، والتراقصِ على أنغام الأذكار والتسابيح والتهاليل،"], [1382.0, "كلُّه عقيدةٌ فاسدةٌ باطلة،"], [1387.0, "لماذا؟ لأنه لا يشهد لها دليل الشرع بالصحة والاعتبار."], [1394.8, "<span class=\"ayah\">﴿ائْتُونِي بِكِتَابٍ مِّن قَبْلِ هَٰذَا أَوْ أَثَارَةٍ مِّنْ عِلْمٍ إِن كُنتُمْ صَادِقِينَ﴾<\/span> <span class=\"ref\">[الأحقاف: ٤]<\/span>،"], [1403.0, "<span class=\"ayah\">﴿قُلْ هَاتُوا بُرْهَانَكُمْ إِن كُنتُمْ صَادِقِينَ﴾<\/span> <span class=\"ref\">[البقرة: ١١١]<\/span>."], [1409.0, "فليس كلُّ من دعاك إلى عقيدةٍ تقبل دعواه حتى تُمحّص هذه الدعوة،"], [1415.0, "وتنظر إلى مستندها وإلى برهانها."], [1419.0, "فإن رأيت دليل الشرع يشهد لها بالاعتبار فاعتقدها وأنت مطمئنُّ القلب،"], [1425.7, "وإن رأيت دليل الشرع لا يشهد لها بالاعتبار فارفضها وأنت مطمئنُّ القلب."]], "tr": [[1367.8, "Toplu zikirlerin, davul ve def çalmanın, zikir, tesbih ve tehlîl nağmeleri eşliğinde raks etmenin meşru olduğuna inanmak;"], [1382.0, "bunların hepsi fâsid ve bâtıl bir akîdedir."], [1387.0, "Neden? Çünkü şer'î delil ona sıhhat ve itibarla şahitlik etmez."], [1394.8, "<span class=\"ayah\">﴿Eğer doğru söyleyenlerseniz bana bundan önceki bir kitap ya da bir ilim kalıntısı getirin﴾<\/span> [Ahkâf 4]."], [1394.8, "<span class=\"ayah\">﴿De ki: Doğru söyleyenlerseniz delilinizi getirin﴾<\/span> [Bakara 111]."], [1403.0, "Seni bir akîdeye çağıran herkesin iddiasını, bu daveti incelemeden, dayanağına ve burhanına bakmadan kabul etmezsin."], [1415.0, "Şer'î delilin ona itibarla şahitlik ettiğini görürsen gönül huzuruyla ona inan;"], [1419.0, "şer'î delilin ona itibarla şahitlik etmediğini görürsen gönül huzuruyla onu reddet."]]}, {"reader": false, "ar": [[1434.0, "واعتقادُ أنه لا يضرُّ مع الإيمان ذنب ـ كما تعتقده المرجئة ـ اعتقادٌ فاسدٌ باطل،"], [1447.8, "لأنه لا يشهد له دليل الشرع بالاعتبار."], [1452.0, "واعتقادُ خروج مرتكب الكبيرة من ملّة الإسلام ـ كما هو عقيدة الوعيدية من الخوارج والمعتزلة ـ عقيدةٌ باطلةٌ فاسدة،"], [1466.0, "لأنه لا يشهد لها دليل الشرع بالاعتبار."], [1471.0, "واعتقادُ أن العبد مسلوبُ القدرة،"], [1475.0, "فلا قدرةَ له ولا اختيارَ في باب القضاء والقدر ـ كما تعتقده الجبرية ـ عقيدةٌ باطلةٌ فاسدة،"], [1483.8, "لأنه لا يشهد لها دليل الشرع بالاعتبار."], [1488.3, "واعتقادُ أن للمخلوق الاختيارَ المطلق الكامل،"], [1492.1, "والمشيئةَ الكاملة المنفصلة عن مشيئة الله عز وجل واختياره ـ كما هو عقيدة القدرية من المعتزلة في باب القدر ـ"]], "tr": [[1434.0, "Mürcie'nin inandığı gibi \"İmanla birlikte hiçbir günah zarar vermez\" inancı fâsid ve bâtıl bir inançtır, çünkü şer'î delil ona itibarla şahitlik etmez."], [1447.8, "Hâricîler ve Mu'tezile'den oluşan Vaîdiyye'nin akîdesi olan, büyük günah işleyenin İslâm milletinden çıktığı inancı bâtıl ve fâsid bir akîdedir, çünkü şer'î delil ona itibarla şahitlik etmez."], [1466.0, "Cebriyye'nin inandığı gibi, kaza ve kader babında kulun kudretinin elinden alınmış olduğu, onun ne kudretinin ne de ihtiyarının bulunduğu inancı bâtıl ve fâsid bir akîdedir, çünkü şer'î delil ona itibarla şahitlik etmez."], [1488.3, "Kader babında Mu'tezile'den Kaderiyye'nin akîdesi olduğu gibi, mahlûkun Allah'ın meşîetinden ve ihtiyarından bağımsız, mutlak ve tam bir ihtiyara ve tam bir meşîete sahip olduğu inancı —"]]}]}, {"ts": "25:00", "title": "2. Külliye (devam): Ehl-i Sünnet'in ayırt edici vasfı", "paras": [{"reader": false, "ar": [[1505.0, "هي عقيدةٌ باطلةٌ فاسدة،"], [1507.5, "لأنه لا يشهد لها دليل الشرع بالاعتبار."], [1512.0, "واعتقادُ أن صفات الله مماثلةٌ لصفات المخلوقات عقيدةٌ فاسدةٌ باطلة،"], [1520.1, "لأنه لا يشهد لها دليل الشرع بالاعتبار."], [1525.0, "واعتقادُ تعطيل الله عز وجل عن أسمائه الحسنى وصفاته العُلا ـ كما هو معتقد الجهمية وغيرهم ـ عقيدةٌ باطلةٌ فاسدة،"], [1538.0, "لأنه لا يشهد لها دليل الشرع بالاعتبار."], [1541.0, "وهكذا دواليك في كل العقائد."]], "tr": [[1505.0, "— bâtıl ve fâsid bir akîdedir, çünkü şer'î delil ona itibarla şahitlik etmez."], [1507.5, "Allah'ın sıfatlarının mahlûkatın sıfatlarına benzediği inancı fâsid ve bâtıl bir akîdedir, çünkü şer'î delil ona itibarla şahitlik etmez."], [1520.1, "Cehmiyye ve başkalarının inancı olduğu gibi, Allah Teâlâ'yı güzel isimlerinden ve yüce sıfatlarından ta'til etme inancı bâtıl ve fâsid bir akîdedir, çünkü şer'î delil ona itibarla şahitlik etmez. Bütün akîdelerde durum böyledir."]]}, {"reader": false, "ar": [[1543.0, "وهو الأصلُ الذي اختصّ به أهل السنة والجماعة فقط من دون سائر فرق الأمة."], [1553.0, "فمن أعظم ما تتميّز به فرقةُ أهل السنة والجماعة:"], [1558.8, "المطالبةُ بالدليل على كل عقيدة."], [1562.0, "ولا نقبل أن يكون دليلًا عقليًّا،"], [1566.0, "ولا نقبل أن يكون دليلًا من الرؤى والأحلام والأذواق والمواجيد والخطرات والمكاشفات والمخاريق الشيطانية الإبليسية،"], [1583.0, "وإنما لا نرضى إلا أن يكون دليلًا من كتاب الله عز وجل،"], [1588.0, "أو سنةٍ صحيحةٍ من سنن النبي صلى الله عليه وسلم،"], [1594.0, "لأننا نريد أن لا نعتقد خيالًا ولا نعتقد وهمًا،"], [1597.7, "كما سيأتينا في كليةٍ خاصة إن شاء الله."]], "tr": [[1543.0, "Bu, ümmetin diğer fırkaları arasında sadece Ehl-i Sünnet ve'l-Cemaat'e has olan asıldır."], [1543.0, "Ehl-i Sünnet ve'l-Cemaat fırkasını en çok ayırt eden şeylerden biri, her akîde için delil istemektir."], [1562.0, "(Tek başına) aklî bir delili kabul etmeyiz;"], [1566.0, "rüyalardan, düşlerden, zevklerden, vecdlerden, hatıralardan (kalbe gelen düşüncelerden), keşiflerden ve şeytanî-iblisî hokkabazlıklardan gelen bir delili de kabul etmeyiz."], [1583.0, "Ancak Allah Teâlâ'nın Kitabından veya Nebî ﷺ'in sünnetlerinden sahih bir sünnetten gelen delile razı oluruz."], [1594.0, "Çünkü bir hayale veya vehme inanmak istemeyiz;"], [1597.7, "inşallah buna özel bir külliyede değineceğiz."]]}, {"reader": false, "ar": [[1601.0, "فلو تأمّلتم هذه الكلية لوجدتم أهل السنة هم المتميّزون بها من دون سائر عقائد أهل القبلة."], [1614.0, "فمشايخ الرافضة من حينما يُملون العقائد على أتباعهم يقبلونها من غير مطالبةٍ بالدليل،"], [1623.0, "ومشايخ الصوفية من حينما يأمرون أتباعهم ومريديهم بشيءٍ من العقائد يقبلونها مباشرةً من غير دليل،"], [1635.6, "وهذا هو سبب ضلالهم،"], [1638.0, "لأنهم لا يطلبون مصحِّحًا لهذه العقائد من برهان الشرع وأدلة الوحي."]], "tr": [[1601.0, "Bu külliyeyi düşünürseniz, Ehl-i Kıble'nin diğer akîdeleri arasında onunla temayüz edenin Ehl-i Sünnet olduğunu görürsünüz."], [1614.0, "Râfizî şeyhleri akîdeleri müritlerine yazdırdıkları anda, onlar bunları delil istemeden kabul ederler."], [1614.0, "Sûfî şeyhleri müritlerine ve müridlerine akîdeden bir şey emrettikleri anda, onlar bunu delilsiz, hemen kabul ederler."], [1623.0, "Sapıklıklarının sebebi budur; çünkü bu akîdeler için şer'î burhandan ve vahiy delillerinden bir doğrulayıcı istemezler."]]}, {"reader": false, "ar": [[1645.0, "فاعتمدوا هذا الأصل وافرحوا به،"], [1648.2, "وهي كليةٌ عظيمة، من سار على منوالها والتزم بغَرزها وسار على منهجها وصراطها ـ واللهِ ـ لن يضلَّ،"], [1658.8, "لا بسبب شبهةٍ عرضت لقلبه،"], [1663.0, "ولا شهوةٍ عرضت لفؤاده،"], [1665.7, "ولا تزيينِ باطلٍ سمعه من دعاة أهل الضلال والبدع."], [1672.0, "وخلاصة الأمر أن نقول:"], [1674.8, "العقائد توقيفيةٌ على صحة برهان الشرع،"], [1679.0, "فلا نقبل أيَّ عقيدةٍ إلا إذا شهد لها دليل الشرع بالاعتبار."], [1685.8, "والله أعلم. واضحٌ كلامي؟ ـ نعم."]], "tr": [[1645.0, "Bu asla sarılın ve onunla sevinin."], [1645.0, "Bu büyük bir külliyedir. Onun yolunda yürüyen, izine sımsıkı bağlanan, metodu ve yolu üzere giden —vallahi— sapmaz:"], [1648.2, "ne kalbine arız olan bir şüphe sebebiyle, ne gönlüne arız olan bir şehvet sebebiyle, ne de sapıklık ve bid'at davetçilerinden duyduğu bir bâtılın süslenmesi sebebiyle."], [1672.0, "Özetle deriz ki: Akîdeler, şer'î burhanın sıhhatine bağlıdır (tevkîfîdir)."], [1679.0, "Şer'î delilin itibarla şahitlik etmediği hiçbir akîdeyi kabul etmeyiz."], [1679.0, "Allah en iyisini bilir. Sözüm açık mı? — Evet."]]}]}, {"ts": "28:11", "title": "3. Külliye: Selefin anlayışına aykırı her anlayış bâtıldır", "paras": [{"reader": true, "ar": [[1691.0, "أحسن الله إليكم. الكلية الثالثة:"], [1697.0, "كلُّ فهمٍ في أدلة الاعتقاد خالف فهمَ السلف فهو باطل."]], "tr": [[1691.0, "Allah size iyilik etsin. Üçüncü külliye:"], [1691.0, "İtikad delillerinde selefin anlayışına aykırı olan her anlayış bâtıldır."]]}, {"reader": false, "ar": [[1704.0, "نعم، تقول هذه الكلية:"], [1706.7, "كلُّ فهمٍ خالف فهمَ السلف في أدلة الاعتقاد فهو باطل. <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[1704.0, "Evet, bu külliye der ki:"], [1704.0, "İtikad delillerinde selefin anlayışına aykırı olan her anlayış bâtıldır. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1739.0, "أقول وبالله التوفيق: متى ما رأيتم أحدًا يقول:"], [1746.4, "قال الله، أو قال رسوله صلى الله عليه وسلم،"], [1753.0, "على مسألةٍ عقدية، فإياكم أن تقبلوا كلامه حتى تنظروا إلى فهمه للكتاب والسنة."], [1765.0, "فإن وافق فهمُه فهمَ السلف الصالح فإن تنزيله صحيح،"], [1772.0, "وإن خالف فهمُه لهذا الدليل العقدي فهمَ السلف الصالح فإن قوله مرفوض."], [1780.0, "فيجب أن تُحاط أدلة الاعتقاد بسياج فهم السلف الصالح."], [1788.0, "وإذا أطلقنا «السلف الصالح» فنعني بهم أصالةً أصحابَ النبي صلى الله عليه وسلم."], [1797.0, "فلا يجوز لنا أن نفهم أدلة الاعتقاد بفهمٍ مخالفٍ"]], "tr": [[1739.0, "Tevfik Allah'tandır, derim ki: Birinin itikadî bir mesele hakkında \"Allah buyurdu\" veya \"Resûlü ﷺ buyurdu\" dediğini gördüğünüzde, onun Kitap ve Sünnet'i nasıl anladığına bakmadan sözünü sakın kabul etmeyin."], [1753.0, "Anlayışı selef-i sâlihînin anlayışına uygunsa, (delili meseleye) uygulaması doğrudur."], [1772.0, "Bu itikadî delili anlayışı selef-i sâlihînin anlayışına aykırıysa, sözü reddedilir."], [1780.0, "İtikad delillerinin, selef-i sâlihînin anlayışından bir çitle çevrilmesi gerekir."], [1788.0, "\"Selef-i sâlihîn\" dediğimizde, asıl olarak Nebî ﷺ'in ashâbını kastederiz."], [1788.0, "Bize itikad delillerini aykırı bir anlayışla anlamak caiz değildir —"]]}]}, {"ts": "30:00", "title": "3. Külliye (devam): Sahabenin anlayışına uymanın delilleri", "paras": [{"reader": false, "ar": [[1802.0, "لما عليه أصحابُ النبي صلى الله عليه وسلم،"], [1806.0, "حتى لا نكون ممن قال الله عز وجل فيهم:"], [1810.0, "<span class=\"ayah\">﴿وَمَن يُشَاقِقِ الرَّسُولَ مِن بَعْدِ مَا تَبَيَّنَ لَهُ الْهُدَىٰ﴾<\/span> ـ انتبهوا ـ <span class=\"ayah\">﴿وَيَتَّبِعْ غَيْرَ سَبِيلِ الْمُؤْمِنِينَ نُوَلِّهِ مَا تَوَلَّىٰ وَنُصْلِهِ جَهَنَّمَ ۖ وَسَاءَتْ مَصِيرًا﴾<\/span> <span class=\"ref\">[النساء: ١١٥]<\/span>."], [1824.0, "ويدخل في وصف المؤمنين دخولًا أوّليًّا أصحابُ النبي صلى الله عليه وسلم،"], [1831.0, "ويدخل في متابعة سبيلهم المأمورِ به شرعًا متابعتُهم في الفهم."], [1838.0, "فكلُّ من ابتغى في الأدلة فهمًا مخالفًا لفهم الصحابة فقد ابتغى غيرَ سبيلهم،"], [1846.0, "ومن يبتغي غيرَ سبيلهم يولِّه الله ما تولّى،"], [1850.0, "ويُصلِه جهنمَ يوم القيامة، وساءت مصيرًا."]], "tr": [[1802.0, "— Nebî ﷺ'in ashâbının üzerinde olduğu anlayışa aykırı bir anlayışla."], [1806.0, "Ta ki Allah Teâlâ'nın hakkında şöyle buyurduğu kimselerden olmayalım:"], [1810.0, "<span class=\"ayah\">﴿Kim kendisine hidayet apaçık belli olduktan sonra Peygamber'e muhalefet eder —dikkat edin— ve müminlerin yolundan başkasına uyarsa, onu döndüğü yöne döndürürüz ve cehenneme sokarız. O ne kötü bir varış yeridir﴾<\/span> [Nisâ 115]."], [1824.0, "Müminlerin vasfına öncelikle Nebî ﷺ'in ashâbı girer."], [1824.0, "Şer'an emredilen, onların yoluna tâbi olmaya ise anlayışta onlara uymak da girer."], [1831.0, "Delillerde sahabenin anlayışına aykırı bir anlayış arayan, onların yolundan başkasını aramış olur."], [1838.0, "Onların yolundan başkasını arayanı Allah döndüğü yöne döndürür, kıyamet günü cehenneme sokar;"], [1850.0, "o ne kötü bir varış yeridir."]]}, {"reader": false, "ar": [[1854.0, "وقد زكّى الله عز وجل فهومَ أصحاب النبي صلى الله عليه وسلم في آياتٍ كثيرة،"], [1863.0, "وأخبر برضاه عنهم، وزكّاهم في عقائدهم باطنًا،"], [1869.0, "وفي أعمالهم ظاهرًا، وفي أقوالهم وفي إيمانهم،"], [1875.0, "في آياتٍ كثيرة، كقول الله عز وجل:"], [1881.7, "<span class=\"ayah\">﴿وَالسَّابِقُونَ الْأَوَّلُونَ مِنَ الْمُهَاجِرِينَ وَالْأَنصَارِ وَالَّذِينَ اتَّبَعُوهُم بِإِحْسَانٍ﴾<\/span>:"], [1888.0, "اتّبعوهم في فهمهم بإحسان،"], [1892.0, "فلم يفهموا في الأدلة فهمًا غير فهمهم؛"], [1895.0, "واتّبعوهم في إيمانهم بإحسان،"], [1899.0, "فلم يؤمنوا بقضايا خارجةٍ عن قضاياهم؛"], [1904.0, "واتّبعوهم في أعمالهم بإحسان،"], [1909.0, "فلم يبتدعوا ولم يُحدثوا في دين الله عز وجل شيئًا من البدع والمنكرات أو المحدثات."], [1918.0, "فاتّبعناهم ظاهرًا في أعمالهم وأقوالهم،"], [1923.0, "واتّبعناهم باطنًا في إيمانهم ومعتقداتهم وتوحيدهم."], [1929.0, "فهؤلاء التابعون بهذا المعنى هم الموعودون بقول الله عز وجل: <span class=\"ayah\">﴿وَالَّذِينَ اتَّبَعُوهُم بِإِحْسَانٍ﴾<\/span>."]], "tr": [[1854.0, "Allah Teâlâ pek çok ayette Nebî ﷺ'in ashâbının anlayışlarını tezkiye etmiş, onlardan razı olduğunu bildirmiş;"], [1863.0, "onları içte akîdelerinde, dışta amellerinde, sözlerinde ve imanlarında tezkiye etmiştir."], [1869.0, "Allah Teâlâ'nın şu sözü gibi:"], [1875.0, "<span class=\"ayah\">﴿Muhacirlerden ve Ensar'dan (İslâm'a girmede) öne geçen ilkler ve onlara güzellikle tâbi olanlar…﴾<\/span>."], [1881.7, "Onlara anlayışlarında güzellikle tâbi oldular;"], [1881.7, "delillerde onların anlayışından başka bir anlayış edinmediler."], [1892.0, "İmanlarında onlara güzellikle tâbi oldular;"], [1895.0, "onların inandığı meselelerin dışında kalan meselelere inanmadılar."], [1904.0, "Amellerinde onlara güzellikle tâbi oldular;"], [1909.0, "Allah'ın dininde bid'at, münker veya muhdes (sonradan uydurulmuş) bir şey ortaya çıkarmadılar."], [1918.0, "Biz de dışta amellerinde ve sözlerinde, içte imanlarında, inançlarında ve tevhidlerinde onlara tâbi olduk."], [1929.0, "Bu anlamda tâbi olanlar, Allah Teâlâ'nın <span class=\"ayah\">﴿ve onlara güzellikle tâbi olanlar﴾<\/span> sözüyle vaat ettiği kimselerdir."]]}, {"reader": false, "ar": [[1938.0, "فالخوارج لم يتّبعوا الصحابة بإحسان،"], [1942.0, "بل بإحداثٍ وابتداع. والجهمية لم يتّبعوا الصحابة بإحسان،"], [1948.0, "بل بإحداثٍ وابتداع. والمعتزلة لم يتّبعوا الصحابة بإحسان،"], [1955.0, "بل بإحداثٍ وابتداع. والرافضة لم يتّبعوا الصحابة بإحسان،"], [1962.0, "بل بإحداثٍ وابتداع. والأشاعرة لم يتّبعوا الصحابة بإحسان،"], [1969.0, "بل بإحداثٍ وابتداع. ولا نعلم طائفةً في الدنيا قد اتّبعت الصحابة بإحسان ـ باطنًا في العقائد،"], [1980.2, "وظاهرًا في الأقوال والأعمال ـ إلا طائفةً واحدةً فقط،"], [1987.9, "وهم أهل السنة والجماعة."], [1991.0, "فلم يُحدثوا في دين الله ما ليس منه،"], [1994.0, "ولم يبتدعوا في العقائد ما ليس منها،"], [1997.0, "وكانوا على وَفق ما كان عليه أصحاب النبي صلى الله عليه وسلم باطنًا وظاهرًا."]], "tr": [[1938.0, "Hâricîler sahabeye güzellikle (ihsanla) değil, ihdas ve bid'atla tâbi oldular."], [1942.0, "Cehmiyye sahabeye güzellikle değil, ihdas ve bid'atla tâbi oldu."], [1948.0, "Mu'tezile sahabeye güzellikle değil, ihdas ve bid'atla tâbi oldu."], [1955.0, "Râfıza sahabeye güzellikle değil, ihdas ve bid'atla tâbi oldu."], [1962.0, "Eş'arîler sahabeye güzellikle değil, ihdas ve bid'atla tâbi oldular."], [1969.0, "Dünyada, içte akîdelerde, dışta söz ve amellerde sahabeye güzellikle tâbi olmuş tek bir taife biliyoruz:"], [1980.2, "Ehl-i Sünnet ve'l-Cemaat. Onlar Allah'ın dininde ondan olmayanı ortaya çıkarmadılar, akîdelerde ondan olmayanı uydurmadılar ve içte ve dışta Nebî ﷺ'in ashâbının üzerinde olduğu şeye uygun oldular."]]}, {"reader": false, "ar": [[2005.0, "فهم الموعودون بقول الله عز وجل:"], [2007.0, "<span class=\"ayah\">﴿وَالَّذِينَ اتَّبَعُوهُم بِإِحْسَانٍ رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ وَأَعَدَّ لَهُمْ جَنَّاتٍ تَجْرِي تَحْتَهَا الْأَنْهَارُ خَالِدِينَ فِيهَا أَبَدًا ۚ ذَٰلِكَ الْفَوْزُ الْعَظِيمُ﴾<\/span> <span class=\"ref\">[التوبة: ١٠٠]<\/span>."], [2019.0, "وقال الله عز وجل:"], [2021.6, "<span class=\"ayah\">﴿لَّقَدْ رَضِيَ اللَّهُ عَنِ الْمُؤْمِنِينَ إِذْ يُبَايِعُونَكَ تَحْتَ الشَّجَرَةِ﴾<\/span> <span class=\"ref\">[الفتح: ١٨]<\/span>،"], [2027.5, "ورضاه مبنيٌّ على متابعة شرعه باطنًا وظاهرًا."], [2033.0, "فلما أخبر الله عز وجل عن رضاه عن أصحاب النبي صلى الله عليه وسلم فهذا دليلٌ على صحة عقائدهم،"], [2041.0, "فكلُّ من خالف عقيدتهم فيتخلّف عنه رضا الله بقدر مخالفته."]], "tr": [[2005.0, "İşte Allah Teâlâ'nın şu sözüyle vaat edilenler onlardır:"], [2007.0, "<span class=\"ayah\">﴿…ve onlara güzellikle tâbi olanlar; Allah onlardan razı olmuş, onlar da O'ndan razı olmuşlardır. Allah onlar için içinde ebedî kalacakları, altından ırmaklar akan cennetler hazırlamıştır. İşte büyük kurtuluş budur﴾<\/span> [Tevbe 100]."], [2007.0, "Allah Teâlâ şöyle de buyurmuştur:"], [2019.0, "<span class=\"ayah\">﴿Andolsun ki Allah, ağacın altında sana biat ettikleri sırada müminlerden razı olmuştur﴾<\/span> [Fetih 18]."], [2021.6, "O'nun rızası, içte ve dışta şeriatına uymaya bağlıdır."], [2027.5, "Allah Teâlâ Nebî ﷺ'in ashâbından razı olduğunu bildirdiğine göre, bu onların akîdelerinin doğruluğuna delildir."], [2033.0, "Onların akîdesine aykırı davranan herkesten, aykırılığı ölçüsünde Allah'ın rızası geri kalır."]]}, {"reader": false, "ar": [[2048.0, "وكذلك قال الله عز وجل لمن بعدهم ـ انتبهوا ماذا قال ـ قال:"], [2056.6, "<span class=\"ayah\">﴿فَإِنْ آمَنُوا﴾<\/span> ـ أي من بعدكم ـ <span class=\"ayah\">﴿بِمِثْلِ مَا آمَنتُم بِهِ فَقَدِ اهْتَدَوا﴾<\/span> <span class=\"ref\">[البقرة: ١٣٧]<\/span>."], [2063.0, "ويُفهم منها أن من بعدكم إن خالفوا ما أنتم عليه من العقائد والأعمال فقد ضلّوا."], [2075.0, "فلما مدح الله أصحاب نبيه صلى الله عليه وسلم بصحة الاعتقاد،"], [2088.0, "وأمر من بعدهم بأن يؤمنوا بمثل ما آمن الصحابة به،"], [2093.0, "دلّ ذلك على وجوب فهمنا لأدلة الاعتقاد كما فهمها أصحاب النبي صلى الله عليه وسلم."]], "tr": [[2048.0, "Allah Teâlâ onlardan sonrakiler için de —dikkat edin ne buyurdu— şöyle buyurdu:"], [2056.6, "<span class=\"ayah\">﴿Eğer onlar —yani sizden sonrakiler— sizin inandığınız gibi inanırlarsa doğru yolu bulmuş olurlar﴾<\/span> [Bakara 137]."], [2056.6, "Buradan şu anlaşılır: Sizden sonrakiler sizin üzerinde olduğunuz akîdelere ve amellere aykırı davranırlarsa sapmış olurlar."], [2075.0, "Allah, Peygamberinin ﷺ ashâbını itikadın doğruluğuyla övüp onlardan sonrakilere de sahabenin inandığı gibi inanmayı emrettiğine göre, bu, itikad delillerini Nebî ﷺ'in ashâbının anladığı gibi anlamamızın vacip olduğunu gösterir."]]}]}, {"ts": "35:00", "title": "3. Külliye (devam): Bid'at ehlinin ayetleri yanlış anlamasına örnekler", "paras": [{"reader": false, "ar": [[2102.0, "إذ لو أحدثنا فهمًا مخالفًا لفهمهم فسينتج لنا إيمانٌ بخلاف ما آمنوا به،"], [2112.0, "وإذا آمنّا بغير ما آمنوا به فإننا سوف نكون على طريق غوايةٍ ودربِ ضلالة <span class=\"q\">؟ 35:19<\/span>،"], [2121.0, "نسأل الله لنا ولكم السلامة والعافية."]], "tr": [[2102.0, "Çünkü onların anlayışına aykırı bir anlayış ortaya çıkarırsak, bu bize onların inandığından farklı bir iman doğurur."], [2112.0, "Onların inandığından başkasına inanırsak, bir azgınlık yolu ve sapıklık patikası <span class=\"q\">؟<\/span> üzerinde oluruz."], [2112.0, "Allah'tan bizim ve sizin için selamet ve afiyet dileriz."]]}, {"reader": false, "ar": [[2125.0, "وإنّ من أعظم ما يُغضب أهلَ البدع هذا الأصل،"], [2134.0, "فإنهم يقولون: دعونا نفهم أدلة الكتاب والسنة على مقتضى عقولنا،"], [2142.0, "ولا تُلزمونا بمتابعة أفهام أناسٍ قد ماتوا."], [2151.0, "وهذا كله من الدعاوى الباطلة التي يُراد بها الهجوم على أدلة الوحيين،"], [2158.8, "والاستدلالُ بها على الشرك وعلى البدعة وعلى الخرافة والوثنية."]], "tr": [[2125.0, "Bid'at ehlini en çok kızdıran şeylerden biri bu asıldır."], [2125.0, "Derler ki: \"Bırakın, Kitap ve Sünnet'in delillerini aklımızın gerektirdiği şekilde anlayalım;"], [2142.0, "bizi ölmüş insanların anlayışlarına uymaya zorlamayın.\" Bunların hepsi, iki vahyin (Kur'an ve Sünnet'in) delillerine saldırmak ve onları şirke, bid'ate, hurafeye ve putperestliğe delil yapmak için ortaya atılan bâtıl iddialardır."]]}, {"reader": false, "ar": [[2169.0, "فإن قلتَ: وهل أهل البدع استدلّوا بأدلة الوحيين على شركهم وبدعهم ووثنيتهم؟"], [2185.0, "فأقول: نعم. فالمشركون يستدلّون على شركهم بالأولياء والصالحين بقول الله عز وجل:"], [2196.0, "<span class=\"ayah\">﴿أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ﴾<\/span> <span class=\"ref\">[يونس: ٦٢]<\/span>،"], [2201.0, "فيجعلونها دليلًا على دعاء الوليّ من دون الله،"], [2206.0, "والاستغاثة به من دون الله،"], [2208.0, "وتعظيمه التعظيمَ المفضي إلى الشرك به مع الله عز وجل،"], [2213.0, "وعلى جواز الذبح له من دون الله عز وجل،"], [2217.0, "وعلى أن الله قد أعطاهم الأحقّيّة في التدبير والتصريف والمشاركة في ملكوت السماوات والأرض."], [2228.0, "وهذا كله من فهم الآية بفهمٍ مخالفٍ لفهم السلف الصالح."]], "tr": [[2169.0, "\"Bid'at ehli iki vahyin delillerini şirklerine, bid'atlerine ve putperestliklerine delil mi getirdiler?\" dersen, derim ki:"], [2185.0, "Evet. Veliler ve salihler üzerinden şirk koşanlar, şirklerine Allah Teâlâ'nın şu sözünü delil getirirler:"], [2196.0, "<span class=\"ayah\">﴿Bilesiniz ki Allah'ın velilerine korku yoktur, onlar üzülmeyeceklerdir de﴾<\/span> [Yûnus 62]."], [2196.0, "Bunu; Allah'ı bırakıp veliye dua etmeye, Allah'ı bırakıp ondan istiğase etmeye, onu Allah'a şirk koşmaya götüren bir tazimle yüceltmeye, Allah'tan başkası için ona kurban kesmenin caiz olduğuna ve Allah'ın onlara tedbir, tasarruf ve göklerin ve yerin melekûtunda ortaklık hakkı verdiğine delil yaparlar."], [2217.0, "Bunların hepsi ayeti selef-i sâlihînin anlayışına aykırı bir anlayışla anlamaktan kaynaklanır."]]}, {"reader": false, "ar": [[2236.0, "بل نقول كذلك: إن من يدعو إلى دعاء رسول الله بعد موته يستدلّ بقول الله عز وجل:"], [2248.0, "<span class=\"ayah\">﴿وَلَوْ أَنَّهُمْ إِذ ظَّلَمُوا أَنفُسَهُمْ جَاءُوكَ فَاسْتَغْفَرُوا اللَّهَ وَاسْتَغْفَرَ لَهُمُ الرَّسُولُ لَوَجَدُوا اللَّهَ تَوَّابًا رَّحِيمًا﴾<\/span> <span class=\"ref\">[النساء: ٦٤]<\/span>."], [2258.0, "والسلف متفقون على أن المجيء المذكور في الآية إنما هو مجيءٌ له في حياته لا بعد مماته."], [2268.0, "ولذلك فقد كان الصحابة تصيبهم القوارعُ والقحطُ والخوفُ الشديد من عدوهم،"], [2277.0, "وليس بينهم وبين قبر رسول الله صلى الله عليه وسلم إلا بضعُ خطوات،"], [2283.7, "ولم يكن يتكلّف الواحد منهم أن يأتيه ليدعوه من دون الله،"], [2290.0, "أو ليستغيث به من دون الله،"], [2293.8, "أو ليستنصره من دون الله،"], [2297.0, "أو ليتوسّل به من دون الله،"], [2301.1, "أو ليستسقيه من دون الله،"], [2305.0, "أو ليجعله واسطةً فيما بينهم وبين الله في قبول توبتهم والأوبة من ذنوبهم."]], "tr": [[2236.0, "Hatta şunu da söyleriz: Resûlullah'a vefatından sonra dua etmeye çağıran kimse, Allah Teâlâ'nın şu sözünü delil getirir:"], [2248.0, "<span class=\"ayah\">﴿Eğer onlar kendilerine zulmettiklerinde sana gelip Allah'tan bağışlanma dileselerdi ve Peygamber de onlar için bağışlanma dileseydi, Allah'ı tevbeleri çokça kabul eden ve çok merhametli bulurlardı﴾<\/span> [Nisâ 64]."], [2258.0, "Selef, ayette zikredilen gelmenin, vefatından sonra değil, hayatında O'na gelmek olduğunda ittifak etmiştir."], [2268.0, "Bu yüzden sahabeye felaketler, kıtlık ve düşmanlarından şiddetli korku isabet ederdi;"], [2277.0, "kendileriyle Resûlullah ﷺ'in kabri arasında sadece birkaç adım vardı."], [2283.7, "Yine de hiçbiri, Allah'ı bırakıp O'na dua etmek, O'ndan istiğase etmek, O'ndan yardım istemek, O'nunla tevessül etmek, O'ndan yağmur istemek ya da tevbelerinin kabulünde ve günahlarından dönüşlerinde O'nu kendileriyle Allah arasında vasıta yapmak için O'na gelme zahmetine girmezdi."]]}, {"reader": false, "ar": [[2312.0, "وكلُّ ذلك يدلّ على أن المجيء ـ باتفاق السلف ـ إنما هو مجيءٌ في حياته لا بعد مماته."], [2321.0, "ولكن لما أبعد المبتدعةُ فهمَ السلف عن هذه الآية جعلوه مجيئًا له في الحياة وبعد الممات،"], [2330.6, "فوقع الشرك والوثنية استدلالًا بالقرآن."], [2334.6, "فلا بد أن يُحفظ القرآن والسنة في مكانٍ لا يستطيع أهل البدع والشرك الوصول إليه،"], [2347.0, "وما ذلك إلا إذا حُفظ بفهم السلف الصالح."]], "tr": [[2312.0, "Bütün bunlar, selefin ittifakıyla bu gelmenin vefatından sonra değil, hayatında O'na gelmek olduğunu gösterir."], [2312.0, "Ama bid'atçılar selefin anlayışını bu ayetten uzaklaştırınca, onu hem hayatında hem de vefatından sonra O'na gelmek olarak yorumladılar;"], [2330.6, "böylece Kur'an'dan delil getirilerek şirk ve putperestlik ortaya çıktı."], [2334.6, "Kur'an ve Sünnet'in, bid'at ve şirk ehlinin ulaşamayacağı bir yerde korunması gerekir."], [2334.6, "Bu da ancak selef-i sâlihînin anlayışıyla korunmasıyla olur."]]}, {"reader": false, "ar": [[2351.0, "بل نقول كذلك: إن المعتزلة يستدلّون على خلق القرآن ـ وهي عقيدةٌ كفرية ـ بقول الله عز وجل:"], [2365.6, "<span class=\"ayah\">﴿مَا يَأْتِيهِم مِّن ذِكْرٍ مِّنَ الرَّحْمَٰنِ مُحْدَثٍ﴾<\/span> <span class=\"ref\">[الشعراء: ٥]<\/span>،"], [2370.1, "ويفهمون «الإحداث» هنا بأنه مخلوق،"], [2373.3, "وهذا فهمٌ مخالفٌ لفهم السلف الصالح."], [2381.0, "فإن السلف متفقون على أن «المُحدَث» هنا:"], [2385.3, "أي الشيء الجديد أو الأمر الجديد،"], [2389.0, "لأن القرآن كان ينزل تِباعًا منجَّمًا على حسب الحوادث،"], [2395.0, "فكلما حدثت حادثةٌ نزلت الآيات التي تعالج هذه الحادثة،"]], "tr": [[2351.0, "Hatta şunu da söyleriz: Mu'tezile, küfrî bir akîde olan Kur'an'ın mahlûk olduğu inancına Allah Teâlâ'nın şu sözünü delil getirir:"], [2365.6, "<span class=\"ayah\">﴿Onlara Rahmân'dan yeni (muhdes) bir zikir gelmez ki…﴾<\/span> [Şuarâ 5]."], [2365.6, "Buradaki \"ihdas\"ı \"mahlûk\" olarak anlarlar;"], [2373.3, "bu, selef-i sâlihînin anlayışına aykırı bir anlayıştır."], [2381.0, "Selef, buradaki \"muhdes\"in yeni şey veya yeni emir anlamında olduğunda ittifak etmiştir."], [2389.0, "Çünkü Kur'an olaylara göre peyderpey, parça parça iniyordu;"], [2395.0, "bir olay meydana geldikçe o olayı ele alan ayetler iniyordu."]]}]}, {"ts": "40:00", "title": "3. Külliye (devam): Ru'yetullah ve sıfat ayetleri", "paras": [{"reader": false, "ar": [[2401.0, "فهو «محدَث» بمعنى جديد،"], [2403.9, "وليس محدَثًا بمعنى مخلوق."], [2407.0, "فلما أُبعدت الآية عن فهم السلف دخل المعتزلة في الاستدلال بها على عقيدتهم الكفرية."], [2416.0, "بل نقول كذلك: إن المعتزلة يستدلّون على نفي رؤية الله يوم القيامة ـ وهي عقيدةٌ كفرية ـ بالقرآن،"], [2428.0, "واستدلّوا على عقيدتهم الكفرية بقول الله عز وجل:"], [2432.0, "<span class=\"ayah\">﴿لَّا تُدْرِكُهُ الْأَبْصَارُ﴾<\/span> <span class=\"ref\">[الأنعام: ١٠٣]<\/span>، وبقول الله عز وجل:"], [2438.0, "<span class=\"ayah\">﴿قَالَ لَن تَرَانِي﴾<\/span> <span class=\"ref\">[الأعراف: ١٤٣]<\/span>، وخالفوا في فهمهما فهمَ سلف الأمة من صحابة رسول الله صلى الله عليه وسلم."]], "tr": [[2401.0, "Yani o \"yeni\" anlamında muhdestir, \"mahlûk\" anlamında muhdes değildir."], [2407.0, "Ayet selefin anlayışından uzaklaştırılınca Mu'tezile onu küfrî akîdelerine delil getirmeye giriştiler."], [2416.0, "Hatta şunu da söyleriz: Mu'tezile, küfrî bir akîde olan kıyamet günü Allah'ın görülmesinin nefyine Kur'an'dan delil getirir."], [2428.0, "Küfrî akîdelerine Allah Teâlâ'nın <span class=\"ayah\">﴿Gözler O'nu idrak edemez﴾<\/span> [En'âm 103] ve <span class=\"ayah\">﴿(Allah) \"Beni asla göremezsin\" dedi﴾<\/span> [A'râf 143] sözlerini delil getirdiler ve bu iki ayetin anlaşılmasında Resûlullah ﷺ'in sahabesinden oluşan ümmetin selefinin anlayışına muhalefet ettiler."]]}, {"reader": false, "ar": [[2452.0, "فإن قول الله عز وجل:"], [2455.6, "<span class=\"ayah\">﴿لَّا تُدْرِكُهُ الْأَبْصَارُ﴾<\/span> أي لا تحيط به إذا رأته،"], [2460.0, "فليس كلُّ مرئيٍّ يُحاط به."], [2463.0, "فأنت ترى السماوات ولكنك لا تحيط بها رؤيةً،"], [2468.0, "وترى الجبل العظيم ولكن لا تحيط به رؤيةً،"], [2474.0, "وترى الكرة الأرضية ولكن لا تحيط بها رؤيةً،"], [2479.0, "فليس كلُّ مرئيٍّ يُحاط به رؤيةً."], [2486.0, "فالله عز وجل نفى الإحاطة به في أمرين:"], [2492.0, "في قول الله عز وجل:"], [2495.0, "<span class=\"ayah\">﴿وَلَا يُحِيطُونَ بِهِ عِلْمًا﴾<\/span> <span class=\"ref\">[طه: ١١٠]<\/span>،"], [2497.0, "أي لا يستطيعون أن يستجمعوا العلم المتعلّق بالله عز وجل مهما بلغوا من العلم،"], [2504.0, "<span class=\"ayah\">﴿وَمَا أُوتِيتُم مِّنَ الْعِلْمِ إِلَّا قَلِيلًا﴾<\/span> <span class=\"ref\">[الإسراء: ٨٥]<\/span>؛"], [2507.0, "إذن عَلِموا ولم يُحيطوا."]], "tr": [[2452.0, "Allah Teâlâ'nın <span class=\"ayah\">﴿Gözler O'nu idrak edemez﴾<\/span> sözü, \"O'nu gördüklerinde O'nu kuşatamazlar\" demektir;"], [2460.0, "çünkü görülen her şey kuşatılmaz."], [2463.0, "Sen gökleri görürsün ama görüşünle onları kuşatamazsın;"], [2468.0, "büyük dağı görürsün ama görüşünle onu kuşatamazsın;"], [2474.0, "yerküreyi görürsün ama görüşünle onu kuşatamazsın."], [2479.0, "Görülen her şey görüşle kuşatılmaz."], [2486.0, "Allah Teâlâ kendisinin kuşatılmasını iki hususta nefyetmiştir."], [2492.0, "(Birincisi) Allah Teâlâ'nın <span class=\"ayah\">﴿Onlar O'nu ilimce kuşatamazlar﴾<\/span> [Tâhâ 110] sözündedir;"], [2497.0, "yani ne kadar ilme ulaşırlarsa ulaşsınlar, Allah Teâlâ'ya dair ilmi toplayıp kuşatamazlar."], [2504.0, "<span class=\"ayah\">﴿Size ilimden ancak az bir şey verilmiştir﴾<\/span> [İsrâ 85]."], [2504.0, "Demek ki bildiler ama kuşatamadılar."]]}, {"reader": false, "ar": [[2510.0, "الأمر الثاني: نفيُ إحاطة الرؤية به،"], [2515.0, "فقال الله عز وجل:"], [2516.7, "<span class=\"ayah\">﴿لَّا تُدْرِكُهُ الْأَبْصَارُ﴾<\/span>، و«تُدركه» أي تحيط به،"], [2520.7, "باتفاق السلف. فإن أهل الجنة إذا رأوا الله يوم القيامة فلا تستطيع أبصارهم أن تحيط به رؤيةً،"], [2531.0, "وإنما يرون منه ما أراد الله عز وجل أن يروه."], [2537.0, "ولكن مع إثبات الرؤية إلا أن الإحاطة منفية،"], [2542.0, "وهذا بإجماع أهل السنة والجماعة."], [2546.0, "فالله يُعلَم ولا يُحاط به علمًا،"], [2549.9, "ويُرى ولا تحيط الأعينُ أو العيونُ به رؤيةً."], [2555.0, "أما المعتزلة فإنهم يفهمون منها «لا تراه»،"], [2559.6, "وهذا مخالفٌ لإجماع أهل السنة في فهم هذه الآية."]], "tr": [[2510.0, "İkinci husus, görüşün O'nu kuşatmasının nefyidir."], [2515.0, "Allah Teâlâ <span class=\"ayah\">﴿Gözler O'nu idrak edemez﴾<\/span> buyurmuştur."], [2516.7, "Selefin ittifakıyla \"idrak eder\" burada \"kuşatır\" demektir."], [2520.7, "Cennet ehli kıyamet günü Allah'ı gördüklerinde gözleri O'nu görüşle kuşatamaz;"], [2520.7, "ancak Allah Teâlâ'nın görmelerini dilediği kadarını görürler."], [2537.0, "Görme isbat edilmekle birlikte kuşatma nefyedilmiştir;"], [2542.0, "bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır."], [2546.0, "Allah bilinir ama ilimce kuşatılmaz;"], [2549.9, "görülür ama gözler O'nu görüşle kuşatamaz."], [2549.9, "Mu'tezile ise bundan \"O'nu göremez\" anlamını çıkarır;"], [2555.0, "bu, Ehl-i Sünnet'in bu ayeti anlamadaki icmâına aykırıdır."]]}, {"reader": false, "ar": [[2567.0, "وقوله: <span class=\"ayah\">﴿لَن تَرَانِي﴾<\/span> أجمع السلف على أنها نفيٌ للرؤية في الدنيا فقط،"], [2576.0, "لأن موسى عليه الصلاة والسلام إنما طلب رؤية الله في هذه الدنيا،"], [2584.0, "فقال: <span class=\"ayah\">﴿رَبِّ أَرِنِي أَنظُرْ إِلَيْكَ ۚ قَالَ لَن تَرَانِي﴾<\/span>."], [2589.0, "فالنفي منصبٌّ على ما قبله،"], [2592.0, "فلما كان الطلب للرؤية في هذه الدنيا فيكون النفي مخصوصًا بهذه الدنيا،"], [2602.0, "وذلك لتواتر الأدلة على أن المؤمنين يرون الله يوم القيامة رؤيةَ عيانٍ بأبصارهم،"], [2610.1, "على الوجه اللائق بالله عز وجل،"], [2613.8, "لا ندخل في هذا الباب متأوّلين بآرائنا ولا متوهّمين بأهوائنا."]], "tr": [[2567.0, "<span class=\"ayah\">﴿Beni asla göremezsin﴾<\/span> sözü hakkında selef, bunun sadece dünyada görmenin nefyi olduğunda icmâ etmiştir."], [2576.0, "Çünkü Mûsâ aleyhisselâm Allah'ı ancak bu dünyada görmeyi istemişti:"], [2576.0, "<span class=\"ayah\">﴿\"Rabbim! Bana (kendini) göster, sana bakayım\" dedi. (Allah) \"Beni asla göremezsin\" dedi﴾<\/span>."], [2589.0, "Nefy kendisinden öncekine (talebe) yöneliktir."], [2592.0, "Talep bu dünyada görmek olduğuna göre, nefy de bu dünyaya mahsustur."], [2592.0, "Bu, müminlerin kıyamet günü Allah'ı gözleriyle, açıkça, Allah Teâlâ'ya yakışır şekilde göreceklerine dair delillerin mütevâtir olmasından dolayıdır."], [2610.1, "Bu baba ne görüşlerimizle te'vil ederek ne de heveslerimizle vehme kapılarak gireriz."]]}, {"reader": false, "ar": [[2620.0, "والمقصود من ذلك: أنك لا تجد مبتدعًا إلا ولا بد أن يستدلّ على بعض عقائده بأدلة الكتاب والسنة،"], [2635.0, "وكلُّ أهل البدع يزعمون أنهم أهل الكتاب والسنة،"], [2642.0, "إلا أن الفيصل بيننا وبينهم هو فهمُ الكتاب والسنة."], [2649.0, "فمن فهم أدلة الاعتقاد على مقتضى فهم السلف الصالح فهو من أهل الكتاب والسنة،"], [2656.0, "وأما من فهم أدلة الكتاب والسنة على غير فهم السلف الصالح فلا ـ والله ـ ليس هو من أهل الكتاب وإن استدلّ بألف آية،"], [2670.7, "ولا من أهل السنة وإن استدلّ بألف حديث،"], [2674.8, "إذا كان يفهمها على غير فهم السلف الصالح من الصحابة والتابعين وأتباعهم من أهل القرون المفضّلة."]], "tr": [[2620.0, "Bundan maksat şudur: Bazı akîdelerine Kitap ve Sünnet'in delillerini getirmeyen hiçbir bid'atçı bulamazsın."], [2620.0, "Bütün bid'at ehli, Kitap ve Sünnet ehli olduklarını iddia eder."], [2635.0, "Ancak bizimle onlar arasındaki ayırıcı ölçü, Kitap ve Sünnet'in anlaşılmasıdır."], [2642.0, "İtikad delillerini selef-i sâlihînin anlayışına göre anlayan, Kitap ve Sünnet ehlindendir."], [2649.0, "Kitap ve Sünnet'in delillerini selef-i sâlihînin anlayışından başka türlü anlayan ise —vallahi— bin ayet delil getirse de Kitap ehlinden değildir;"], [2656.0, "bin hadis delil getirse de Sünnet ehlinden değildir;"], [2670.7, "eğer onları sahabe, tâbiûn ve onlara tâbi olanlardan, faziletli asırların ehli olan selef-i sâlihînin anlayışından başka türlü anlıyorsa."]]}, {"reader": false, "ar": [[2683.0, "فتمسّكوا بهذه الكلية يا طلاب العلم."], [2687.0, "فافهموا من قول الله عز وجل:"], [2690.0, "<span class=\"ayah\">﴿وَجَاءَ رَبُّكَ﴾<\/span> <span class=\"ref\">[الفجر: ٢٢]<\/span> أن لله مجيئًا يوم القيامة يليق بجلاله وعظمته،"], [2697.0, "لأن هذا هو ما فهمه أصحاب النبي صلى الله عليه وسلم."]], "tr": [[2683.0, "Ey ilim talebeleri, bu külliyeye sımsıkı sarılın."], [2687.0, "Allah Teâlâ'nın <span class=\"ayah\">﴿Rabbin geldi﴾<\/span> [Fecr 22] sözünden, Allah'ın kıyamet günü celâline ve azametine yakışır bir gelişinin olduğunu anlayın;"], [2697.0, "çünkü Nebî ﷺ'in ashâbının anladığı budur."]]}]}, {"ts": "45:00", "title": "3. Külliye (sonu) · 4. Külliye: Gayb ancak delille sabit olur", "paras": [{"reader": false, "ar": [[2702.0, "وافهموا من قول الله عز وجل:"], [2705.0, "<span class=\"ayah\">﴿هَلْ يَنظُرُونَ إِلَّا أَن يَأْتِيَهُمُ اللَّهُ﴾<\/span> <span class=\"ref\">[البقرة: ٢١٠]<\/span> أن لله إتيانًا يوم القيامة يليق بجلاله وعظمته،"], [2717.0, "لأنه فهمُ أهل السنة."], [2719.8, "وفهموا من قول الله عز وجل:"], [2724.0, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span> أنه استواءٌ يليق بجلاله وعظمته،"], [2732.0, "ليس استيلاءً كما قاله أهل البدع،"], [2735.3, "بل استواءٌ حقيقي، لا نتكلم في كيفيته ونسكت عنها،"], [2741.1, "كما فهمه أهل السنة والجماعة."], [2747.0, "أفهمتم هذا؟ وهكذا دواليك في كل اعتقاد."], [2752.0, "فمن جعل عقيدته واستدلالاته في أمور الاعتقاد مبنيّةً على فهم السلف الصالح فطوبى له،"], [2760.0, "وأما من حاد عن فهم السلف الصالح يمينًا وشمالًا فسيصيبه من الغواية والضلال والحيرة والخسارة بقدر ما خالف فيه فهمَ السلف الصالح. والله الموفق."]], "tr": [[2702.0, "Allah Teâlâ'nın <span class=\"ayah\">﴿Onlar ancak Allah'ın kendilerine gelmesini mi bekliyorlar?﴾<\/span> [Bakara 210] sözünden, Allah'ın kıyamet günü celâline ve azametine yakışır bir gelişinin (ityân) olduğunu anlayın;"], [2705.0, "çünkü Ehl-i Sünnet'in anlayışı budur."], [2719.8, "(Ehl-i Sünnet) Allah Teâlâ'nın <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5] sözünden de bunun O'nun celâline ve azametine yakışır bir istivâ olduğunu anlamışlardır."], [2732.0, "Bid'at ehlinin dediği gibi \"istîlâ\" (ele geçirme) değil, hakiki bir istivâdır."], [2735.3, "Ehl-i Sünnet ve'l-Cemaat'in anladığı gibi keyfiyeti hakkında konuşmayız, onun hakkında susarız."], [2747.0, "Bunu anladınız mı? Her itikad meselesinde de durum böyledir."], [2752.0, "Akîdesini ve itikad meselelerindeki istidlallerini selef-i sâlihînin anlayışına dayandırana ne mutlu!"], [2760.0, "Selef-i sâlihînin anlayışından sağa sola sapan ise, selef-i sâlihînin anlayışına aykırı düştüğü ölçüde azgınlığa, sapıklığa, şaşkınlığa ve hüsrana uğrayacaktır. Tevfik Allah'tandır."]]}, {"reader": true, "ar": [[2774.0, "أحسن الله إليكم. القاعدة الرابعة ـ أو الكلية الرابعة:"], [2781.0, "كلُّ ما كان من قبيل الغيب فلا يثبت إلا بالدليل."]], "tr": [[2774.0, "Allah size iyilik etsin. Dördüncü kaide, ya da dördüncü külliye:"], [2781.0, "Gayb türünden olan her şey ancak delille sabit olur."]]}, {"reader": false, "ar": [[2787.0, "تقول هذه الكلية: كلُّ ما كان من قبيل الغيب فلا يثبت إلا بدليل،"], [2797.0, "أو نقول: فأصلُ إثباته توقيفيٌّ على الدليل."], [2802.0, "كلُّ ما كان من قبيل الغيب فأصل إثباته توقيفيٌّ على الدليل."]], "tr": [[2787.0, "Bu külliye der ki: Gayb türünden olan her şey ancak delille sabit olur."], [2787.0, "Ya da şöyle deriz: Onun isbatının aslı delile bağlıdır (tevkîfîdir)."], [2802.0, "Gayb türünden olan her şeyin isbatının aslı delile bağlıdır."]]}, {"reader": false, "ar": [[2816.0, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أن الله عز وجل لما خلق الخلق جعله على قسمين:"], [2839.0, "على عالم الشهادة، وعلى عالم الغيب."], [2845.0, "واستدلّ الله عز وجل بربوبيته للعالمين،"], [2857.0, "فقال الله عز وجل:"], [2859.7, "<span class=\"ayah\">﴿عَالِمُ الْغَيْبِ﴾<\/span> ـ وهو القسم الأول ـ <span class=\"ayah\">﴿وَالشَّهَادَةِ﴾<\/span> ـ وهو القسم الثاني ـ <span class=\"ref\">[الأنعام: ٧٣]<\/span>."], [2866.0, "وكليتنا هذه لا تتكلم عن عالم الشهادة،"], [2870.8, "وإنما تتكلم عن عالم الغيب."]], "tr": [[2816.0, "Tevfik Allah'tandır, derim ki: Bil —Allah sana rahmet etsin— Allah Teâlâ mahlûkatı yarattığında onu iki kısım kıldı:"], [2839.0, "şehâdet (görünen) âlemi ve gayb âlemi."], [2845.0, "Allah Teâlâ âlemlerin Rabbi oluşunu delil getirerek <span class=\"ayah\">﴿gaybı —ki bu birinci kısımdır— ve şehâdeti —ki bu ikinci kısımdır— bilen﴾<\/span> [En'âm 73] buyurmuştur."], [2866.0, "Bu külliyemiz şehâdet âleminden değil, gayb âleminden bahseder."]]}, {"reader": false, "ar": [[2876.0, "فإن قلت: ومتى يجوز لي أن أُثبت الأمر الغيبي؟"], [2883.0, "فأقول: إذا صحّ الدليل بإثباته."], [2890.0, "فلا حقَّ لعقلك أن يُثبت غيبًا بلا دليل،"], [2894.0, "ولا حقَّ لحسّك أن يُثبت غيبًا بلا دليل،"], [2898.0, "ولا حقَّ لآرائك واجتهاداتك أن تُثبت غيبًا بلا دليل."], [2904.0, "فلا مدخلَ في إثبات الغيبيات للعقول،"], [2909.0, "ولا للأوهام والخرافات، ولا لسوالف البادية،"], [2914.0, "ولا للعادات والسُّلوم، ولا للرؤى والأحلام والمواجيد والمكاشفات والأذواق؛"], [2922.0, "كلُّ ذلك لا مدخل له في شيءٍ من إثبات أمور الغيب."], [2927.0, "وإنما أمور الغيب توقيفيةٌ على النص."]], "tr": [[2876.0, "\"Gaybî bir şeyi isbat etmem ne zaman caiz olur?\" dersen, derim ki:"], [2883.0, "Onu isbat eden delil sahih olduğunda."], [2890.0, "Aklının delilsiz bir gaybı isbat etme hakkı yoktur;"], [2894.0, "duyularının delilsiz bir gaybı isbat etme hakkı yoktur;"], [2898.0, "görüşlerinin ve içtihatlarının delilsiz bir gaybı isbat etme hakkı yoktur."], [2904.0, "Gaybîlerin isbatında akılların payı yoktur;"], [2909.0, "vehimlerin ve hurafelerin, bâdiyenin (çöl halkının) eski hikâyelerinin, âdetlerin ve örflerin, rüyaların, düşlerin, vecdlerin, keşiflerin ve zevklerin de payı yoktur."], [2922.0, "Bunların hiçbirinin gayb işlerinin isbatında bir payı yoktur."], [2927.0, "Gayb işleri ancak nassa bağlıdır."]]}, {"reader": false, "ar": [[2931.0, "فمتى ما أثبت النصُّ غيبًا فالواجب عليك أن تُثبته،"], [2935.0, "ومتى ما نفى النصُّ غيبًا فالواجب عليك أن تنفيه،"], [2943.0, "وأما ما لم يأتِ النصُّ بإثباته من أمور الغيب ولا بنفيه فلا حقَّ لك أن تُثبته لعدم دليل إثباته،"], [2954.0, "ولا أن تنفيه لعدم دليل نفيه،"], [2958.0, "وإنما تتوقّف فيه. وإنّ كافة الطوائف غير أهل السنة والجماعة كلُّهم لا بد أن تكون عقائدهم مشتملةً على غيبياتٍ لا دليل عليها،"], [2976.0, "قلَّ هذا الإثبات أو كثر باختلاف الطوائف،"], [2981.0, "إلا أهل السنة والجماعة؛"], [2984.0, "فليس عندهم قضيةٌ غيبيةٌ يُثبتونها ويؤمنون بها إلا ويقف وراءها دليلُ الشرع من الكتاب والسنة."]], "tr": [[2931.0, "Nass bir gaybı isbat ettiğinde onu isbat etmen vaciptir;"], [2931.0, "nass bir gaybı nefyettiğinde onu nefyetmen vaciptir."], [2935.0, "Gayb işlerinden nassın ne isbat ne de nefyini getirdiği şeye gelince;"], [2943.0, "isbatına delil olmadığı için onu isbat etmeye, nefyine delil olmadığı için onu nefyetmeye hakkın yoktur;"], [2958.0, "onda tevakkuf edersin (durursun). Ehl-i Sünnet ve'l-Cemaat dışındaki bütün taifelerin akîdeleri mutlaka üzerinde delil olmayan gaybî şeyler içerir;"], [2958.0, "bu isbat taifelere göre az veya çok olabilir."], [2976.0, "Ehl-i Sünnet ve'l-Cemaat bunun dışındadır:"], [2984.0, "Onların isbat edip iman ettikleri, arkasında Kitap ve Sünnet'ten şer'î delil bulunmayan hiçbir gaybî mesele yoktur."]]}, {"reader": false, "ar": [[2993.0, "فلماذا نُثبت وجود الله؟"], [2995.3, "لأن الدليل أثبته. ولماذا نُثبت أسماء الله؟ لأن الدليل أثبتها."]], "tr": [[2993.0, "Allah'ın varlığını neden isbat ediyoruz?"], [2995.3, "Çünkü delil onu isbat etmiştir."], [2995.3, "Allah'ın isimlerini neden isbat ediyoruz?"], [2995.3, "Çünkü delil onları isbat etmiştir."]]}]}, {"ts": "50:00", "title": "4. Külliye (devam) · 5. Külliye: Gaybı isbat eden delile iman ve teslim", "paras": [{"reader": false, "ar": [[3003.0, "ولماذا نُثبت صفات الله؟"], [3005.9, "لأن الدليل أثبتها. لماذا نُثبت عالم الملائكة وهو غيب؟"], [3012.3, "لأن الدليل أثبته. لماذا نُثبت عالم الجن،"], [3017.8, "وأنهم مخلوقون مربوبون مأمورون منهيّون مُثابون معاقَبون؟"], [3024.6, "لأن الدليل أثبته. لماذا نُثبت أن للملائكة أجنحة؟"], [3035.0, "لأن الدليل أثبتها. لماذا نُثبت أن الملائكة خلقٌ صَمَد لا يأكل ولا يشرب؟"], [3043.0, "لأن الدليل أثبته. لماذا نُثبت أن لهم وظائف ـ فمنهم من وظيفته الوحي،"], [3050.0, "ومنهم من عمله تسيير السحاب،"], [3053.0, "ومنهم من عمله النفخ في الأجنّة ـ؟"], [3055.0, "لأن الدليل أثبتها. لماذا نُثبت سؤال القبر ونعيمه وعذابه مع أنه غيب؟"], [3064.2, "لأن الدليل أثبته. لماذا نُثبت اليوم الآخر،"], [3069.6, "وما يكون فيه من حقائق:"], [3072.8, "من بعثٍ ونشورٍ وجزاءٍ وثوابٍ وعقابٍ وجنةٍ ونارٍ وصراطٍ وميزانٍ وتطايُرِ صحف،"], [3085.0, "إلى غير ذلك من حقائق اليوم الآخر؟ لأن الدليل أثبتها."]], "tr": [[3003.0, "Allah'ın sıfatlarını neden isbat ediyoruz?"], [3005.9, "Çünkü delil onları isbat etmiştir."], [3005.9, "Gayb olduğu hâlde melekler âlemini neden isbat ediyoruz?"], [3012.3, "Çünkü delil onu isbat etmiştir."], [3012.3, "Cinler âlemini ve onların yaratılmış, terbiye edilen (Rab'lerine kul olan), emir ve nehye muhatap, sevap ve ceza görecek varlıklar olduklarını neden isbat ediyoruz?"], [3024.6, "Çünkü delil bunu isbat etmiştir."], [3035.0, "Meleklerin kanatları olduğunu neden isbat ediyoruz?"], [3035.0, "Çünkü delil onu isbat etmiştir."], [3035.0, "Meleklerin yemeyen ve içmeyen, samed (içi boş olmayan) bir mahlûk olduğunu neden isbat ediyoruz?"], [3043.0, "Çünkü delil bunu isbat etmiştir."], [3043.0, "Onların görevleri olduğunu —kimisinin görevi vahiy, kimisinin işi bulutları sevk etmek, kimisinin işi ceninlere (ruh) üflemek— neden isbat ediyoruz?"], [3055.0, "Çünkü delil bunları isbat etmiştir."], [3055.0, "Gayb olduğu hâlde kabir sualini, nimetini ve azabını neden isbat ediyoruz?"], [3064.2, "Çünkü delil onu isbat etmiştir."], [3069.6, "Âhiret gününü ve orada olacak hakikatleri —diriliş, neşr, karşılık, sevap, ceza, cennet, cehennem, sırat, mizan, amel defterlerinin uçuşması ve âhiret gününün diğer hakikatlerini— neden isbat ediyoruz?"], [3085.0, "Çünkü delil bunları isbat etmiştir."]]}, {"reader": false, "ar": [[3091.0, "فكلُّ ما كان من قبيل الغيب فلا يجوز لنا أن نُثبته إلا بمقتضى الدليل."], [3105.0, "فإن قلت: وهل هذه الكلية مهمّةٌ في باب الاعتقاد؟"], [3110.0, "فأقول: هي من أعظم مهمّات الاعتقاد."], [3115.0, "فإن قلت: ولماذا؟ فأقول:"], [3117.9, "لأن العقائد كلها غيبية؛"], [3122.0, "فالله عز وجل غيب،"], [3124.8, "ووجوده غيب، وأسماؤه وصفاته غيب،"], [3131.0, "والملائكة غيب، واليوم الآخر غيب،"], [3134.6, "والقضاء والقدر غيب، واليوم الآخر بكل تفاصيله غيب."], [3145.0, "فبما أن العقيدة مبنيّةٌ على غيبيات فلا بد أن نتّفق جميعًا على أن طريق إثبات هذه الغيبيات العقدية مبنيٌّ على ثبوت النص."]], "tr": [[3091.0, "Gayb türünden olan her şeyi ancak delilin gereğiyle isbat etmemiz caizdir."], [3091.0, "\"Bu külliye itikad babında önemli mi?\" dersen, derim ki:"], [3105.0, "İtikadın en önemli meselelerindendir. \"Neden?\" dersen, derim ki:"], [3115.0, "Çünkü akîdelerin hepsi gaybîdir. Allah Teâlâ gaybdır;"], [3122.0, "O'nun varlığı gaybdır; isimleri ve sıfatları gaybdır;"], [3124.8, "melekler gaybdır; âhiret günü gaybdır;"], [3131.0, "kaza ve kader gaybdır; âhiret günü bütün ayrıntılarıyla gaybdır."], [3134.6, "Akîde gaybî şeyler üzerine kurulu olduğuna göre, bu itikadî gaybîleri isbat etmenin yolunun nassın sübûtuna dayandığında hepimizin ittifak etmesi gerekir."]]}, {"reader": false, "ar": [[3163.0, "فكلُّ من دعاك إلى عقيدةٍ غيبية،"], [3167.0, "فقبل أن تقبل كلامه ودعواه لا بد أن تطالبه بالدليل؛"], [3173.0, "فإن جاءك بالدليل المُثبِت لهذه العقيدة الغيبية فأهلًا وسهلًا،"], [3178.1, "وإلا فلا حقَّ لك أن تعتقد غيبًا بلا دليل."], [3183.0, "والكلام واضحٌ إن شاء الله، والله أعلم."]], "tr": [[3163.0, "Seni gaybî bir akîdeye çağıran herkesten, sözünü ve iddiasını kabul etmeden önce delil istemen gerekir."], [3173.0, "Sana bu gaybî akîdeyi isbat eden delili getirirse başüstüne;"], [3173.0, "aksi hâlde delilsiz bir gayba inanmaya hakkın yoktur."], [3178.1, "Söz inşallah açıktır. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[3185.0, "أحسن الله إليكم. الكلية الخامسة:"], [3189.4, "كلُّ دليلٍ يُثبت غيبًا فالواجبُ الإيمانُ به والتسليمُ له."]], "tr": [[3185.0, "Allah size iyilik etsin. Beşinci külliye:"], [3189.4, "Bir gaybı isbat eden her delile iman etmek ve teslim olmak vaciptir."]]}, {"reader": false, "ar": [[3197.0, "كلُّ دليلٍ يُثبت غيبًا فالواجب الإيمان به والتسليم له. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[3197.0, "Bir gaybı isbat eden her delile iman etmek ve teslim olmak vaciptir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[3220.0, "بما أننا في الكلية التي قبلها قلنا بأن الغيبيات توقيفيةٌ على الدليل،"], [3233.0, "فلا نُثبت من أمور الغيب إلا ما أثبته الدليل،"], [3236.0, "ولا ننفي من أمور الغيب إلا ما نفاه الدليل،"], [3241.0, "وأن باب الغيب مبنيٌّ كله على صحة الدليل،"], [3245.0, "فتأتيك هذه الكلية لتُكمل لك الواجبَ عليك إذا ثبت الدليل بأمرٍ غيبي."], [3253.0, "فكأنها تجيبك عن سؤال:"], [3257.0, "ما الواجب عليّ إذا أثبت الكتاب والسنة أمرًا غيبيًّا،"], [3264.0, "وقد صحّت بهذا الأمر الغيبي نصوص الكتاب والسنة؟"], [3268.0, "الجواب: الواجب عليك فيه أمران:"]], "tr": [[3220.0, "Bir önceki külliyede gaybîlerin delile bağlı olduğunu söyledi
