ğimize göre —gayb işlerinden ancak delilin isbat ettiğini isbat eder, ancak delilin nefyettiğini nefyederiz ve gayb babının tamamı delilin sıhhatine dayanır—, bu külliye, gaybî bir iş delille sabit olduğunda sana düşen vazifeyi tamamlamak için gelir."], [3245.0, "Adeta şu soruya cevap verir:"], [3253.0, "Kitap ve Sünnet gaybî bir işi isbat ettiğinde ve bu gaybî işe dair Kitap ve Sünnet'in nasları sahih olduğunda bana düşen vazife nedir?"], [3268.0, "Cevap: Sana düşen iki şeydir:"]]}, {"reader": false, "ar": [[3272.0, "الأمر الأول: الإيمان بهذه القضية الغيبية،"], [3278.0, "فتجعلها من قضايا الإيمان العقدية التي يجب عليك أن تعقد على الإيمان بها قلبك،"], [3289.0, "وأن تعقد على تصديقها جَنانك،"], [3294.0, "وأن لا تستريب فيها أو تشكّ أو تتردّد في الإيمان بها،"]], "tr": [[3272.0, "Birincisi: Bu gaybî meseleye iman etmek."], [3272.0, "Onu, kalbini imanına bağlaman, gönlünü tasdikine bağlaman ve ona iman etmede şüpheye düşmemen, tereddüt etmemen gereken itikadî iman meselelerinden kılarsın."]]}]}, {"ts": "55:00", "title": "5. Külliye (devam): Teslimin anlamı", "paras": [{"reader": false, "ar": [[3302.0, "لأن قضايا الإيمان مبنيّةٌ على القطع واليقين،"], [3308.0, "فلا حقَّ لك أن تشكّك أو تتردّد في الإيمان بما أثبته الدليل من الكتاب والسنة من القضايا الغيبية."], [3316.0, "فواجبك الأول بعد ثبوت النص بأمرٍ غيبي:"], [3321.0, "الإيمانُ بهذا الأمر الغيبي."], [3324.0, "الواجب الثاني: التسليمُ لهذا الأمر الغيبي،"], [3330.0, "والتسليم يقتضي عدم المعارضة،"], [3332.6, "والذي سيأتينا في كليةٍ قادمة إن شاء الله عز وجل."], [3339.0, "فمن واجبات الغيب التسليم،"], [3341.9, "والتسليمُ مرتبةٌ فوق الإيمان؛"], [3345.0, "فأنت تؤمن به، ويجب أن يكون إيمانًا مبناه على التسليم."]], "tr": [[3302.0, "Çünkü iman meseleleri kesinlik ve yakîn üzerine kuruludur."], [3308.0, "Kitap ve Sünnet'ten delilin isbat ettiği gaybî meselelere iman etmekte şüpheye düşmeye veya tereddüt etmeye hakkın yoktur."], [3316.0, "Nass gaybî bir işi isbat ettikten sonra birinci vazifen, bu gaybî işe iman etmektir."], [3324.0, "İkinci vazife: Bu gaybî işe teslim olmak."], [3324.0, "Teslim, muâraza etmemeyi (itiraz etmemeyi) gerektirir;"], [3332.6, "inşallah ileriki bir külliyede buna değineceğiz."], [3332.6, "Gaybın vazifelerinden biri teslimdir ve teslim, imanın üstünde bir mertebedir."], [3341.9, "Ona iman edersin, ama bu imanın teslim üzerine kurulu olması gerekir."]]}, {"reader": false, "ar": [[3352.0, "كما قال الله عز وجل:"], [3354.9, "<span class=\"ayah\">﴿فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّىٰ يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لَا يَجِدُوا فِي أَنفُسِهِمْ حَرَجًا مِّمَّا قَضَيْتَ وَيُسَلِّمُوا تَسْلِيمًا﴾<\/span> <span class=\"ref\">[النساء: ٦٥]<\/span>،"], [3369.0, "وكما قال الله عز وجل:"], [3372.1, "<span class=\"ayah\">﴿وَمَن يُسْلِمْ وَجْهَهُ إِلَى اللَّهِ وَهُوَ مُحْسِنٌ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ﴾<\/span> <span class=\"ref\">[لقمان: ٢٢]<\/span>."], [3379.0, "والتسليم معناه: استقرارُ الإيمان في القلب؛"], [3383.0, "فكلُّ من استقرّ الإيمان في قلبه فهو مُسلِّمٌ بهذه القضية الإيمانية."]], "tr": [[3352.0, "Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿Hayır! Rabbine andolsun ki aralarında çıkan anlaşmazlıklarda seni hakem kılıp sonra da verdiğin hükümden içlerinde hiçbir sıkıntı duymadan tam bir teslimiyetle teslim olmadıkça iman etmiş olmazlar﴾<\/span> [Nisâ 65]."], [3372.1, "Yine Allah Teâlâ'nın buyurduğu gibi:"], [3372.1, "<span class=\"ayah\">﴿Kim ihsan sahibi olarak yüzünü Allah'a teslim ederse, en sağlam kulpa yapışmış olur﴾<\/span> [Lokmân 22]."], [3379.0, "Teslimin anlamı, imanın kalpte yerleşmesidir."], [3383.0, "Kalbinde iman yerleşen herkes bu iman meselesine teslim olmuştur."]]}, {"reader": false, "ar": [[3390.0, "فتجد أنه مؤمنٌ بوجود الله إيمانًا مستقرًّا في قلبه،"], [3397.0, "أي إيمانٌ بتسليم. ومؤمنٌ بأسماء الله عز وجل الثابتة له في الكتاب والسنة إيمانًا مستقرًّا راسخًا ثابتًا في قلبه،"], [3409.0, "أعظمَ من رسوخ الجبال الرواسي في الأرض؛"], [3412.0, "إذن هو إيمانٌ مع كمال التسليم."], [3415.0, "وتجد أنه مؤمنٌ بصفات الله التي وصف بها نفسه في كتابه أو وصفه بها رسوله صلى الله عليه وسلم في صحيح سنته،"], [3426.0, "إيمانًا مستقرًّا ثابتًا راسخًا في قلبه،"], [3431.0, "لو اجتمع عليه مَن بأقطارها ليُشكّكوه في شيءٍ من هذا الإيمان لما تشكّك،"], [3438.4, "ولما انزاح الإيمان عن قلبه؛"], [3442.0, "فهذا إيمانٌ مع كمال التسليم."]], "tr": [[3390.0, "Onu, Allah'ın varlığına kalbinde yerleşmiş bir imanla, yani teslimiyetli bir imanla inanmış bulursun."], [3397.0, "Kitap ve Sünnet'te Allah Teâlâ için sabit olan isimlerine de kalbinde yerleşmiş, köklü ve sabit bir imanla, yerdeki sarsılmaz dağların köklülüğünden daha büyük bir imanla inanmış bulursun;"], [3412.0, "demek ki bu, tam teslimiyetle birlikte bir imandır."], [3415.0, "Allah'ın Kitabında kendisini nitelediği veya Resûlü ﷺ'in sahih sünnetinde O'nu nitelediği sıfatlara da kalbinde yerleşmiş, sabit ve köklü bir imanla inanmış bulursun."], [3426.0, "Yeryüzünün dört bir yanındakiler bu imanın bir kısmında onu şüpheye düşürmek için toplansalar şüpheye düşmez, iman kalbinden kaymaz."], [3438.4, "İşte bu, tam teslimiyetle birlikte bir imandır."]]}, {"reader": false, "ar": [[3446.0, "إذ إن هناك من الناس من يأتي إلى قضيةٍ غيبية فيؤمن بها إيمانًا لسانيًّا،"], [3453.7, "ولكن في قلبه شيءٌ من التردّد أو الريب أو الشبهة؛"], [3461.0, "فهذا وإن كان موصوفًا بالإيمان ظاهرًا إلا أنه موصوفٌ بغير التسليم باطنًا."], [3468.0, "ومن الناس من يؤمن بهذه القضية الغيبية ولكن قلبه متسخّطٌ عليها،"], [3477.0, "كالذي يؤمن بأن الأرزاق بيد الله ولكنه متسخّطٌ على رزق الله،"], [3484.0, "مؤمنٌ بأن الأمراض والصحة بيد الله،"], [3491.0, "ويقول: كلُّ شيءٍ بقضاء الله وأنا مؤمنٌ بقضائه،"], [3495.0, "ولكن قلبه متسخّطٌ على المرض الذي يحلّ به."], [3498.0, "فوجودُ الشكّ في القلب،"], [3500.8, "أو التسخّطِ على القضاء والقدر،"], [3506.0, "هذا دليلٌ على أن الإيمان لم يستقرّ ولم يرسخ،"], [3511.0, "أي أن التسليم فيه خللٌ بهذه القضية الإيمانية."]], "tr": [[3446.0, "Çünkü insanlardan kimi gaybî bir meseleye gelir, ona diliyle iman eder, ama kalbinde bir tereddüt, şüphe veya şübhe (kafa karışıklığı) vardır."], [3453.7, "Bu kişi dışta imanla nitelense de içte teslimiyetsizlikle nitelenir."], [3461.0, "İnsanlardan kimi bu gaybî meseleye iman eder, ama kalbi ona öfkelidir."], [3468.0, "Rızıkların Allah'ın elinde olduğuna inanıp Allah'ın rızkına öfkelenen kimse gibi."], [3477.0, "Hastalığın ve sağlığın Allah'ın elinde olduğuna inanır, \"Her şey Allah'ın kazasıyladır, ben O'nun kazasına inanıyorum\" der, ama kalbi başına gelen hastalığa öfkelidir."], [3498.0, "Kalpte şüphenin veya kaza ve kadere öfkenin bulunması, imanın yerleşmediğinin ve kökleşmediğinin, yani bu iman meselesindeki teslimde bir kusur olduğunun delilidir."]]}, {"reader": false, "ar": [[3516.0, "ولذلك قال الله عز وجل في كتابه الكريم:"], [3521.0, "<span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ﴾<\/span> ـ أي حقًّا وصدقًا ـ <span class=\"ayah\">﴿الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا﴾<\/span> <span class=\"ref\">[الحجرات: ١٥]<\/span>،"], [3535.0, "أي لم يشكّوا في هذا الإيمان الذي أوجبه الله ورسوله."], [3540.0, "وكذلك الله عز وجل يقول:"], [3543.3, "<span class=\"ayah\">﴿ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ﴾<\/span> <span class=\"ref\">[البقرة: ٢]<\/span>،"], [3546.6, "أي لا شكَّ يعتريه ولا تردّد فيه أبدًا."]], "tr": [[3516.0, "Bu yüzden Allah Teâlâ Kitâb-ı Kerîm'inde şöyle buyurmuştur:"], [3521.0, "<span class=\"ayah\">﴿Müminler —yani hakkıyla ve gerçekten müminler— ancak Allah'a ve Resûlüne iman eden, sonra da şüpheye düşmeyenlerdir﴾<\/span> [Hucurât 15];"], [3521.0, "yani Allah'ın ve Resûlünün vacip kıldığı bu imanda şüphe etmeyenlerdir."], [3535.0, "Allah Teâlâ yine şöyle buyurur:"], [3540.0, "<span class=\"ayah\">﴿Bu, kendisinde şüphe olmayan Kitap'tır﴾<\/span> [Bakara 2];"], [3543.3, "yani ona hiçbir şüphe arız olmaz ve onda asla tereddüt yoktur."]]}, {"reader": false, "ar": [[3555.0, "فيجب عليك ـ إذا كنت تريد أن تحقّق الإيمان الذي تحصل به النجاة يوم القيامة ـ أن يكون مبنيًّا… عفوًا،"], [3565.0, "فيجب عليك ـ إذا أردت الإيمان بالغيب الذي يقتضي النجاة يوم القيامة ـ أن تبنيه على هذه الأمور الثلاثة:"], [3574.0, "أن لا تُثبت غيبًا إلا بدليل،"], [3577.0, "وأن تؤمن بكل غيبٍ ثبت به الدليل،"], [3580.0, "وأن يرسخ إيمانك في قلبك رسوخَ الجبال الرواسي،"], [3585.0, "فلا تهزُّه أعاصيرُ الفتن،"], [3588.0, "ولا رياحُ الشبهات، ولا كثرةُ الشهوات <span class=\"q\">؟ 59:52<\/span> ولا تواردُها على قلبك."]], "tr": [[3555.0, "Kıyamet günü kurtuluşu sağlayan imanı gerçekleştirmek istiyorsan, onun … pardon;"], [3555.0, "kıyamet günü kurtuluşu gerektiren gayb imanını istiyorsan, onu şu üç şey üzerine kurman gerekir:"], [3565.0, "Delilsiz bir gaybı isbat etmemen, delille sabit olan her gayba iman etmen ve imanının kalbinde sarsılmaz dağlar gibi kökleşmesi."], [3580.0, "Öyle ki onu ne fitnelerin kasırgaları, ne şüphelerin rüzgârları, ne şehvetlerin çokluğu <span class=\"q\">؟<\/span> ne de bunların kalbine art arda gelmesi sarsabilsin."]]}]}, {"ts": "1:00:00", "title": "5. Külliye (sonu) · 6. Külliye: Gayba muâraza haramdır", "paras": [{"reader": false, "ar": [[3601.0, "فإن النبي صلى الله عليه وسلم قد أخبر أن الإيمان في آخر الزمان سيكون مهتزًّا،"], [3609.0, "حتى يصبح الرجل مؤمنًا ويمسي كافرًا ـ أي يتخلّى عن قضايا إيمانه ـ أو يمسي مؤمنًا ويصبح كافرًا،"], [3624.0, "يبيع دينه بعرَضٍ من الدنيا <span class=\"note\">(Hadis: Müslim, No. 118, Ebû Hüreyre'den)<\/span>."], [3628.0, "فعنده الاستعداد الكامل أن يتنازل عن مسلّمات إيمانه إذا دُفع له،"], [3633.0, "وعنده الاستعداد الكامل أن يتنازل عن منصب يقينه <span class=\"q\">؟ 01:00:33<\/span> إذا أُغري بالمناصب والدنيا،"], [3641.0, "فهؤلاء في حقيقتهم ليسوا بمؤمنين."]], "tr": [[3601.0, "Çünkü Nebî ﷺ, âhir zamanda imanın sarsılacağını haber vermiştir:"], [3601.0, "Öyle ki kişi mümin olarak sabahlayıp kâfir olarak akşamlayacak —yani iman meselelerinden vazgeçecek— ya da mümin olarak akşamlayıp kâfir olarak sabahlayacak;"], [3624.0, "dinini dünyalık bir menfaate satacaktır <span class=\"note\">(Müslim, Ebû Hüreyre'den)<\/span>."], [3628.0, "Kendisine (para) verilirse imanının apaçık esaslarından vazgeçmeye tamamen hazırdır;"], [3633.0, "makamlarla ve dünyayla ayartılırsa yakîninin makamından <span class=\"q\">؟<\/span> vazgeçmeye tamamen hazırdır. Bunlar hakikatte mümin değildir."]]}, {"reader": false, "ar": [[3646.0, "واعلموا أن كلَّ إيمانٍ لسانيٍّ لم ينعقد عليه قولُ القلب فليس بإيمانٍ مُنجٍ لصاحبه يوم القيامة،"], [3659.0, "كما قال الله عز وجل عن المنافقين:"], [3662.5, "<span class=\"ayah\">﴿إِذَا جَاءَكَ الْمُنَافِقُونَ قَالُوا نَشْهَدُ إِنَّكَ لَرَسُولُ اللَّهِ ۗ وَاللَّهُ يَعْلَمُ إِنَّكَ لَرَسُولُهُ وَاللَّهُ يَشْهَدُ إِنَّ الْمُنَافِقِينَ لَكَاذِبُونَ﴾<\/span> <span class=\"ref\">[المنافقون: ١]<\/span>."], [3673.0, "لكاذبون في ماذا؟ في خبرهم في نطق قلوبهم بأنك رسول الله؛"], [3682.0, "إنما هي أقوالٌ ينطقونها بألسنتهم،"], [3685.6, "وشهاداتٌ يتفوّهون بها بألسنتهم،"], [3689.0, "لكن لم ينعقد الإيمان عليها في بواطنهم."], [3692.0, "فكلُّ قضيةٍ إيمانيةٍ نطق بها اللسان ولم يُسلِّم لها الجَنان فلا تنفع صاحبها يوم القيامة."], [3703.0, "فالإيمان: اعتقادٌ بالجَنان، ونطقٌ باللسان، وعملٌ بالجوارح والأركان."]], "tr": [[3646.0, "Bilin ki kalbin sözünün (tasdikinin) bağlanmadığı her dilsel iman, sahibini kıyamet günü kurtaran bir iman değildir."], [3659.0, "Allah Teâlâ'nın münafıklar hakkında buyurduğu gibi:"], [3662.5, "<span class=\"ayah\">﴿Münafıklar sana geldiklerinde \"Şahitlik ederiz ki sen elbette Allah'ın Resûlüsün\" derler. Allah da bilir ki sen elbette O'nun Resûlüsün. Allah şahitlik eder ki münafıklar kesinlikle yalancıdır﴾<\/span> [Münâfikûn 1]."], [3662.5, "Neyde yalancıdırlar? Kalplerinin senin Allah'ın Resûlü olduğunu söylediği yönündeki haberlerinde."], [3682.0, "Bunlar sadece dilleriyle söyledikleri sözler, ağızlarıyla telaffuz ettikleri şahitliklerdir;"], [3689.0, "ama iç dünyalarında iman bunlara bağlanmamıştır."], [3692.0, "Dilin söyleyip gönlün teslim olmadığı her iman meselesi, kıyamet günü sahibine fayda vermez."], [3703.0, "İman, kalple itikad, dille ikrar, azalar ve organlarla ameldir."]]}, {"reader": false, "ar": [[3710.0, "فنسأل الله أن يجعلنا وإياكم ممن تعامل مع الغيب بهذه الأصول الثلاثة:"], [3715.0, "أنه لم يُثبت غيبًا إلا بدليل،"], [3718.3, "وأنه آمن بكل قضيةٍ غيبية،"], [3721.0, "وأن الإيمان بها قد استقرّ في قلبه،"], [3724.5, "وسلّم لها قلبه بكل تفاصيلها تسليمًا كاملًا. والله أعلم."]], "tr": [[3710.0, "Allah'tan, bizi ve sizi gayba şu üç esasla muamele edenlerden kılmasını dileriz:"], [3710.0, "Delilsiz bir gaybı isbat etmemiş, (delille sabit olan) her gaybî meseleye iman etmiş, bu iman kalbine yerleşmiş ve kalbi bütün ayrıntılarıyla ona tam bir teslimiyetle teslim olmuş olmak. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[3729.1, "أحسن الله إليكم. الكلية السادسة:"], [3732.6, "كلُّ غيبٍ تحرم معارضته."]], "tr": [[3729.1, "Allah size iyilik etsin. Altıncı külliye:"], [3729.1, "Her gayba muâraza etmek (itiraz etmek) haramdır."]]}, {"reader": false, "ar": [[3737.0, "نعم، تقول القاعدة: كلُّ غيبٍ فتحرم معارضته."], [3742.0, "كلُّ غيبٍ فتحرم معارضته."], [3747.0, "وعدمُ معارضة الغيب مبنيٌّ على كمال التسليم أو نقصه <span class=\"q\">؟ 01:02:27<\/span>؛"], [3754.0, "فأعظمُنا تسليمًا للغيب أبعدُنا معارضةً له،"], [3761.0, "وكلما ضعف تسليم القلب لهذا الأمر الغيبي كلما عظمت معارضتك له."]], "tr": [[3737.0, "Evet, kaide der ki: Her gayba muâraza etmek haramdır."], [3742.0, "Gayba muâraza etmemek, teslimin kemaline veya noksanlığına <span class=\"q\">؟<\/span> bağlıdır."], [3747.0, "Gayba en çok teslim olanımız, ona muârazadan en uzak olanımızdır."], [3754.0, "Kalbin bu gaybî işe teslimiyeti zayıfladıkça ona muârazan da büyür."]]}, {"reader": false, "ar": [[3769.0, "فنحن لا نعارض في وجود الله أبدًا،"], [3773.0, "ولا نقبل أيَّ معارضةٍ تطرأ عليه،"], [3776.0, "لكمال تسليم قلوبنا بوجوده."], [3780.0, "ولا نعارض في أسمائه وصفاته،"], [3784.0, "ولا نقبل أيَّ معارضةٍ في ذلك،"], [3787.0, "لكمال تسليم قلوبنا بأسمائه وصفاته."], [3792.0, "ولا نعارض أبدًا في استحقاقه للألوهية أو الربوبية،"], [3798.0, "لكمال تسليم قلوبنا بهاتين القضيتين العقديتين الغيبيتين."], [3805.0, "ولا نعارض أبدًا في عذاب القبر وسؤاله ونعيمه،"], [3811.0, "لكمال تسليم قلوبنا لهذه القضية الغيبية."], [3816.0, "وهذا هو الإيمان الذي يُنجي صاحبه."]], "tr": [[3769.0, "Biz Allah'ın varlığına asla muâraza etmeyiz ve kalplerimizin O'nun varlığına tam teslim olmasından dolayı ona yöneltilen hiçbir itirazı kabul etmeyiz."], [3780.0, "İsim ve sıfatlarına muâraza etmeyiz ve kalplerimizin O'nun isim ve sıfatlarına tam teslim olmasından dolayı bu konuda hiçbir itirazı kabul etmeyiz."], [3792.0, "Kalplerimizin bu iki gaybî itikadî meseleye tam teslim olmasından dolayı O'nun ulûhiyyete ve rubûbiyyete layık oluşuna asla muâraza etmeyiz."], [3805.0, "Kalplerimizin bu gaybî meseleye tam teslim olmasından dolayı kabir azabına, sualine ve nimetine asla muâraza etmeyiz. Sahibini kurtaran iman budur."]]}, {"reader": false, "ar": [[3819.0, "لكنك ترى كثيرًا من الناس إذا دُعي للإيمان بالقرآن عارض ذلك بقوله:"], [3828.9, "وكيف أؤمن به ولم أتيقّن أنه كلام الله؟"], [3834.0, "وكيف أؤمن به وفيه مخالفاتٌ لغويةٌ أو أخطاءٌ لفظية؟"], [3843.0, "وكيف أؤمن به وأنا أجده يُثبت شيئًا في مكانٍ وينفيه في مكان،"], [3851.0, "ويُخبر به في مكانٍ ويكذّبه في مكانٍ آخر؟"], [3856.0, "ويورد عليك من الشُّبَه الشيءَ الكثير؛"], [3860.2, "كلُّ هذا من باب المعارضة في الإيمان بأن القرآن كلام الله."], [3867.0, "وإذا قيل له: آمِن بوجود الله،"], [3870.0, "قال: وكيف أؤمن بوجوده وأنا لا أراه،"], [3874.0, "وعقلي لا يُدركه، ولا يمكن أن يكون خالقُ هذا العالم ومبدعُه وصانعُه واحدًا لا يساعده أحد؟"], [3886.0, "وأين هو الله حتى نؤمن به؟"], [3890.0, "وإذا قيل له: آمِن بسؤال القبر وعذابه ونعيمه ـ والذي تواترت عليه الأدلة من الكتاب والسنة ـ يقول:"], [3899.5, "وكيف تريدون مني أن أؤمن بهذه القضية"]], "tr": [[3819.0, "Ama insanların çoğunu görürsün ki Kur'an'a imana çağrıldığında şöyle diyerek itiraz eder:"], [3819.0, "\"Onun Allah'ın kelamı olduğuna kesin kanaat getirmemişken ona nasıl iman edeyim?"], [3834.0, "İçinde dil kurallarına aykırılıklar veya lafzî hatalar varken ona nasıl iman edeyim?"], [3843.0, "Bir yerde bir şeyi isbat edip başka yerde nefyettiğini, bir yerde bir şeyi haber verip başka yerde onu yalanladığını görürken ona nasıl iman edeyim?\" Ve sana pek çok şüphe getirir."], [3860.2, "Bunların hepsi Kur'an'ın Allah'ın kelamı olduğuna imanda muâraza kabilindendir."], [3867.0, "Ona \"Allah'ın varlığına iman et\" denildiğinde şöyle der:"], [3870.0, "\"O'nu görmüyorken ve aklım O'nu idrak etmiyorken O'nun varlığına nasıl iman edeyim?"], [3874.0, "Bu âlemin yaratıcısı, mucidi ve yapıcısının kimsenin yardım etmediği tek biri olması mümkün değil."], [3886.0, "Allah nerede ki O'na iman edelim?\" Ona Kitap ve Sünnet'ten delillerin mütevâtir olduğu kabir sualine, azabına ve nimetine iman et denildiğinde şöyle der:"], [3899.5, "\"Bu meseleye iman etmemi nasıl istersiniz —"]]}]}, {"ts": "1:05:00", "title": "6. Külliye (devam)", "paras": [{"reader": false, "ar": [[3903.0, "وعقلي لا يدركها، أو بصري لا يراها؟"], [3906.0, "فإننا لو فتحنا قبر كافرٍ لم نرَ فيه اختلافَ أضلاعٍ ولا ضيقًا ولا نارًا،"], [3914.0, "وإذا فتحنا قبر مؤمنٍ لم نجد فيه سعةَ سبعين ذراعًا ولا نعيمًا،"], [3921.9, "ولا نشمّ منه رائحة الجنة»."], [3926.0, "وهكذا دواليك في معارضاتٍ للوحي الغيبي كثيرةٍ جدًّا،"], [3931.0, "تسمعها من ها هنا وها هنا،"], [3934.0, "يتفوّه بها من لا خلاق له،"], [3937.0, "يريد تشكيك الناس في هذا الأمر الغيبي،"], [3941.0, "أو الطعن فيه بعد ثبوته بالتواتر القطعي."]], "tr": [[3903.0, "— aklım onu idrak etmiyorken veya gözüm onu görmüyorken?"], [3906.0, "Bir kâfirin kabrini açsak içinde ne kaburgaların birbirine geçtiğini, ne darlık ne de ateş görürüz."], [3914.0, "Bir müminin kabrini açsak içinde ne yetmiş zira genişlik, ne nimet buluruz, ne de ondan cennet kokusu alırız.\" Gaybî vahye karşı buna benzer pek çok itiraz vardır;"], [3926.0, "onları oradan buradan duyarsın. Bunları (âhirette) nasibi olmayanlar söyler;"], [3934.0, "insanları bu gaybî meselede şüpheye düşürmek veya kesin tevâtürle sabit olduktan sonra onu tenkit etmek ister."]]}, {"reader": false, "ar": [[3945.0, "فمتى ما رأيت من نفسك معارضةً لأمرٍ غيبي فاعلم أن هذا دليلٌ على اهتزاز تسليم الباطن؛"], [3960.0, "فلو أن الغيب قد استقرّ في قلبك ورسخ لعظُم تسليمك،"], [3966.0, "ومتى ما عظُم تسليمك يئس شيطانك من معارضته في قلبك."], [3973.0, "أنتم معي في هذا ولّا لا؟"]], "tr": [[3945.0, "Kendinde gaybî bir işe karşı muâraza gördüğünde bil ki bu, iç teslimiyetin sarsıldığının delilidir."], [3945.0, "Gayb kalbine yerleşip kökleşmiş olsaydı teslimiyetin büyürdü;"], [3960.0, "teslimiyetin büyüdüğünde ise şeytanın kalbinde ona itiraz ettirmekten ümidini keser."], [3966.0, "Bu konuda benimle misiniz, değil misiniz?"]]}, {"reader": false, "ar": [[3976.0, "ولذلك قال الله عز وجل:"], [3978.0, "<span class=\"ayah\">﴿وَمَا كَانَ لِمُؤْمِنٍ وَلَا مُؤْمِنَةٍ إِذَا قَضَى اللَّهُ وَرَسُولُهُ أَمْرًا أَن يَكُونَ لَهُمُ الْخِيَرَةُ مِنْ أَمْرِهِمْ﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٦]<\/span>."], [3990.0, "ولما جاء المشركون إلى أبي بكرٍ رضي الله عنه بعد حادثة الإسراء والمعراج يريدون تشكيكه في خبر رسول الله صلى الله عليه وسلم،"], [4005.0, "قالوا له ما قالوه،"], [4007.8, "فردّ عليهم بقوله: أَقالَه هو؟"], [4013.0, "قالوا: نعم. قال: إن كان قاله فقد صدق؛"], [4019.0, "أُصدّقه بأن خبرًا يأتيه من السماء،"], [4023.0, "ولا أُصدّقه في هذا الإسراء والمعراج في ليلة؟!"], [4027.0, "<span class=\"note\">(Rivayet: el-Hâkim, el-Müstedrek, Hz. Âişe'den)<\/span> هكذا يَقِرُّ الإيمان في القلب."], [4032.0, "فالإيمان لا يكون إيمانًا صادقًا نافعًا إلا إذا وقر في القلب من غير شكٍّ ولا ريبٍ ولا تردّدٍ ولا معارضة."]], "tr": [[3976.0, "Bu yüzden Allah Teâlâ şöyle buyurmuştur:"], [3978.0, "<span class=\"ayah\">﴿Allah ve Resûlü bir işe hüküm verdiği zaman, hiçbir mümin erkek ve mümin kadına o işi kendi isteklerine göre seçme hakkı yoktur﴾<\/span> [Ahzâb 36]."], [3978.0, "İsrâ ve Mi'râc hadisesinden sonra müşrikler, onu Resûlullah ﷺ'in haberi hakkında şüpheye düşürmek için Ebû Bekir'e (r.a.) geldiler ve ona söyleyeceklerini söylediler."], [4005.0, "O da onlara şöyle cevap verdi:"], [4007.8, "\"Bunu O mu söyledi?\" \"Evet\" dediler."], [4013.0, "Dedi ki: \"Eğer O söylediyse doğru söylemiştir."], [4019.0, "O'na gökten haber geldiğine inanıyorum da bir gecede olan bu İsrâ ve Mi'râc'ta mı O'na inanmayacağım?!\" <span class=\"note\">(el-Hâkim, el-Müstedrek)<\/span>."], [4027.0, "İman kalpte işte böyle yerleşir."], [4032.0, "İman, ancak kalpte şüphesiz, tereddütsüz ve muârazasız yerleştiğinde sadık ve faydalı bir iman olur."]]}, {"reader": false, "ar": [[4045.0, "فلا يكفي أن تُثبت غيبًا بالدليل،"], [4049.0, "ولا يكفي أن تؤمن بالغيب،"], [4054.0, "ولا يكفي أن تُسلِّم له،"], [4057.0, "بل أكمِلْ ذلك بعدم معارضته،"], [4061.0, "وإنما تقول كما قال الله عن عباده المؤمنين:"], [4065.0, "<span class=\"ayah\">﴿إِنَّمَا كَانَ قَوْلَ الْمُؤْمِنِينَ إِذَا دُعُوا إِلَى اللَّهِ وَرَسُولِهِ لِيَحْكُمَ بَيْنَهُمْ أَن يَقُولُوا سَمِعْنَا وَأَطَعْنَا﴾<\/span> <span class=\"ref\">[النور: ٥١]<\/span>،"], [4074.0, "يعني: سلّمنا وآمنّا، ولا نعارض ما أخبر به ربنا ولا ما أخبر به نبينا بأيِّ شيءٍ من أنواع المعارضة."], [4088.0, "ولا يرانا الله عز وجل في أرضه بالنسبة لوحيه إلا في مقام التسليم والإيمان وعدم المعارضة."], [4102.0, "فنسأل الله أن يُميتنا على ذلك."]], "tr": [[4045.0, "Bir gaybı delille isbat etmen yetmez, gayba iman etmen yetmez, ona teslim olman da yetmez;"], [4057.0, "bunu ona muâraza etmemekle tamamla."], [4061.0, "Allah'ın mümin kulları hakkında buyurduğu gibi de:"], [4065.0, "<span class=\"ayah\">﴿Aralarında hüküm vermesi için Allah'a ve Resûlüne çağrıldıkları zaman müminlerin sözü ancak \"İşittik ve itaat ettik\" demeleridir﴾<\/span> [Nûr 51]."], [4065.0, "Yani teslim olduk ve iman ettik;"], [4074.0, "Rabbimizin ve Peygamberimizin haber verdiğine hiçbir şekilde muâraza etmeyiz."], [4074.0, "Allah Teâlâ bizi yeryüzünde, vahyine karşı ancak teslim, iman ve muâraza etmeme makamında görsün."], [4088.0, "Allah'tan bizi bu hâl üzere öldürmesini dileriz."]]}, {"reader": false, "ar": [[4105.0, "ونحن ـ ولله الحمد ـ إلى الآن في مسيرتنا العلمية لم نعارض شيئًا مما ثبت به الوحي غيبًا،"], [4113.0, "ونسأل الله أن يقبضنا على ذلك."], [4116.0, "ونعوذ بالله مما يتفوّه به كثيرٌ ممن لا خلاق له من قلّة الأدب على الله بكثرة المعارضة في أسمائه وفي صفاته وفي وجوده."], [4129.0, "فإذا سمع قول الله عز وجل:"], [4132.0, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> اكفهرّ وجهه وزمجرت عيناه،"], [4137.0, "وقال: كيف تريدون مني أن أُثبت استواءً لله،"], [4141.0, "والله مستغنٍ عن كل شيء؟"], [4143.0, "كيف تريدون مني أن أُثبت عرشًا يعلو الله عز وجل عليه،"], [4149.0, "ولو أبعدنا العرش لسقط الرب؟!"], [4152.1, "ويُوردون الإيرادات الكثيرة على تلك القضية الغيبية،"], [4157.0, "حتى يوصلهم الأمر إلى الكفران بها،"], [4160.0, "أو الإلحاد فيها، أو تعطيلها،"], [4162.0, "أو إخراجها عن مدلولاتها الصحيحة."]], "tr": [[4105.0, "Allah'a hamd olsun, biz ilim yolculuğumuzda şimdiye kadar vahyin gayb olarak sabit kıldığı hiçbir şeye muâraza etmedik."], [4113.0, "Allah'tan canımızı bu hâl üzere almasını dileriz."], [4116.0, "(Âhirette) nasibi olmayan birçoklarının, Allah'ın isimlerine, sıfatlarına ve varlığına çokça itiraz ederek Allah'a karşı sergilediği edepsizlikten Allah'a sığınırız."], [4129.0, "Böyle biri Allah Teâlâ'nın <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> sözünü işittiğinde yüzü kararır, gözleri öfkeyle parlar ve şöyle der:"], [4137.0, "\"Allah her şeyden müstağniyken benden Allah'a istivâ isbat etmemi nasıl istersiniz?"], [4143.0, "Allah Teâlâ'nın üzerinde yükseldiği bir Arş isbat etmemi nasıl istersiniz?"], [4149.0, "Arş'ı kaldırsak Rab düşer (mi diyeceğiz)?!\" Bu gaybî meseleye pek çok itiraz yöneltirler;"], [4152.1, "sonunda iş onları ona küfretmeye, onda ilhada (sapmaya), onu ta'til etmeye veya onu sahih anlamlarının dışına çıkarmaya götürür."]]}, {"reader": false, "ar": [[4164.0, "فقل لي بربك: ما الذي جعل المعتزلة يُخرجون الأدلة عن معانيها الصحيحة؟"], [4170.0, "إنما هي كثرة المعارضات العقلية."], [4172.0, "وما الذي جعل الأشاعرة يُخرجون كثيرًا من أدلة الصفات عن مدلولاتها الصحيحة؟"], [4179.0, "إنما هي المعارضات العقلية."], [4181.0, "ما الذي جعل الماتريدية يُخرجون الأدلة عن سياقها الصحيح ومعناها الصحيح؟"], [4191.0, "إنما هي كثرة المعارضات العقلية."], [4193.0, "ما الذي جعل الفلاسفة يُخرجون أدلة الوحيين عن مدلولاتها الصحيحة؟"]], "tr": [[4164.0, "Rabbin aşkına söyle: Mu'tezile'yi delilleri sahih manalarının dışına çıkarmaya sevk eden nedir?"], [4170.0, "Sadece aklî itirazların çokluğu. Eş'arîleri sıfat delillerinin birçoğunu sahih anlamlarının dışına çıkarmaya sevk eden nedir?"], [4179.0, "Sadece aklî itirazlar. Mâtürîdîleri delilleri sahih bağlamlarının ve sahih manalarının dışına çıkarmaya sevk eden nedir?"], [4181.0, "Sadece aklî itirazların çokluğu. Filozofları iki vahyin delillerini sahih anlamlarının dışına çıkarmaya sevk eden nedir?"]]}]}, {"ts": "1:10:00", "title": "6. Külliye (sonu) · 7. Külliye: Gaybda aklın müstakil payı yoktur", "paras": [{"reader": false, "ar": [[4200.0, "إنما هي كثرة المعارضات."], [4201.0, "والإلحاد سببه المعارضة، والبدع والإصرار عليها سببه المعارضة،"], [4209.0, "وهكذا دواليك في كل من عارض شيئًا."], [4215.0, "وإنّ من عقوبة الله للمعارِض ـ بعد علمه بثبوت النص ـ حرمانَ قلبه من الإيمان بها،"], [4223.0, "حرمانَ قلبه من الإيمان،"], [4227.0, "كما قال الله عز وجل:"], [4229.0, "<span class=\"ayah\">﴿فَلَمَّا زَاغُوا﴾<\/span> ـ أي بكثرة المعارضات بعد ثبوت الوحي ـ <span class=\"ayah\">﴿أَزَاغَ اللَّهُ قُلُوبَهُمْ﴾<\/span> <span class=\"ref\">[الصف: ٥]<\/span>،"], [4235.0, "أي حرم قلوبهم من الإيمان بها حرمانًا كونيًّا."]], "tr": [[4200.0, "Sadece itirazların çokluğu. İlhadın sebebi muârazadır;"], [4201.0, "bid'atlerin ve onlarda ısrar etmenin sebebi de muârazadır."], [4201.0, "Bir şeye muâraza eden herkeste durum böyledir."], [4209.0, "Allah'ın, nassın sabit olduğunu bildikten sonra muâraza eden kimseye verdiği cezalardan biri, kalbini ona imandan mahrum bırakmasıdır;"], [4223.0, "kalbini imandan mahrum bırakmasıdır. Allah Teâlâ'nın buyurduğu gibi:"], [4229.0, "<span class=\"ayah\">﴿Onlar (haktan) sapınca —yani vahiy sabit olduktan sonra çokça itiraz ederek— Allah da kalplerini saptırdı﴾<\/span> [Saf 5]."], [4229.0, "Yani kalplerini ona imandan kevnî (kaderî) bir mahrumiyetle mahrum bıraktı."]]}, {"reader": false, "ar": [[4240.0, "وكما قال الله عز وجل:"], [4242.0, "<span class=\"ayah\">﴿وَنُقَلِّبُ أَفْئِدَتَهُمْ وَأَبْصَارَهُمْ كَمَا لَمْ يُؤْمِنُوا بِهِ أَوَّلَ مَرَّةٍ﴾<\/span> <span class=\"ref\">[الأنعام: ١١٠]<\/span>."], [4247.0, "فلما عُرض عليهم الحقُّ بالدليل الصافي الصحيح الصريح رفضوه وعارضوه،"], [4254.0, "فجعل الله قلوبهم مقلَّبة:"], [4256.0, "يقلّبها من الوحدانية إلى الشرك،"], [4260.0, "يقلّبها من السنة إلى البدعة،"], [4262.0, "يقلّبها من الطاعة إلى المعصية،"], [4265.0, "يقلّبها من اليقين إلى الريب والشك."], [4267.4, "<span class=\"ayah\">﴿وَنُقَلِّبُ أَفْئِدَتَهُمْ وَأَبْصَارَهُمْ﴾<\/span>. فمن عقوبة من لم يؤمن بالحق بعد ثبوت دليله حرمانُ قلبه أن يؤمن به مرةً أخرى."], [4277.0, "فنعوذ بالله من الزيغ والضلال، والله الموفق."]], "tr": [[4240.0, "Yine Allah Teâlâ'nın buyurduğu gibi:"], [4242.0, "<span class=\"ayah\">﴿İlk defa ona iman etmedikleri gibi, biz de onların gönüllerini ve gözlerini ters çeviririz﴾<\/span> [En'âm 110]."], [4242.0, "Hak onlara saf, sahih ve sarih delille sunulunca onu reddettiler ve ona itiraz ettiler;"], [4247.0, "Allah da kalplerini evrilip çevrilen kalpler yaptı:"], [4256.0, "Onları vahdâniyetten şirke, sünnetten bid'ate, itaatten isyana, yakînden şüpheye çevirir."], [4262.0, "<span class=\"ayah\">﴿Onların gönüllerini ve gözlerini ters çeviririz﴾<\/span>."], [4267.4, "Delili sabit olduktan sonra hakka iman etmeyenin cezalarından biri, kalbinin ona bir daha iman etmekten mahrum bırakılmasıdır."], [4267.4, "Kaymaktan ve sapıklıktan Allah'a sığınırız. Tevfik Allah'tandır."]]}, {"reader": false, "ar": [[4280.0, "إذن الخلاصة من ذلك:"], [4284.0, "أن الغيب لا بد أن نتعامل معه بأربعة أمور:"], [4289.0, "الأمر الأول: أن لا نُثبته إلا بدليل."], [4291.0, "الأمر الثاني: أن نؤمن به بعد ثبوت الدليل به."], [4294.0, "الثالث: أن يعظُم إيماننا حتى يصل إلى مرتبة التسليم ـ عرفتم التسليم؟"], [4299.6, "هو الرسوخ وعدم الريب <span class=\"q\">؟ 01:11:38<\/span>."], [4304.0, "الرابع: أن لا نعارضه بكلمةٍ واحدةٍ ولا بحرفٍ واحد."]], "tr": [[4280.0, "Özetle: Gayba dört şeyle muamele etmemiz gerekir."], [4284.0, "Birincisi: Onu ancak delille isbat etmek."], [4289.0, "İkincisi: Onunla ilgili delil sabit olduktan sonra ona iman etmek."], [4291.0, "Üçüncüsü: İmanımızın teslim mertebesine ulaşacak kadar büyümesi."], [4294.0, "Teslimi anladınız mı? Kökleşmek ve şüphe etmemektir <span class=\"q\">؟<\/span>."], [4299.6, "Dördüncüsü: Ona tek bir kelimeyle, tek bir harfle bile muâraza etmemek."]]}, {"reader": false, "ar": [[4315.0, "ولذلك كانت الآيات بأمور الغيب تنزل على أصحاب النبي صلى الله عليه وسلم فيقولون:"], [4319.8, "آمنّا وصدّقنا، وسمعنا وأطعنا."], [4325.0, "وقال الله عز وجل:"], [4327.7, "<span class=\"ayah\">﴿مِنْهُ آيَاتٌ مُّحْكَمَاتٌ هُنَّ أُمُّ الْكِتَابِ وَأُخَرُ مُتَشَابِهَاتٌ ۖ فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَابَهَ مِنْهُ﴾<\/span> ـ أي بكثرة المعارضات ـ <span class=\"ayah\">﴿ابْتِغَاءَ الْفِتْنَةِ وَابْتِغَاءَ تَأْوِيلِهِ ۗ وَمَا يَعْلَمُ تَأْوِيلَهُ إِلَّا اللَّهُ﴾<\/span>،"], [4343.0, "والشاهد منه قوله: <span class=\"ayah\">﴿وَالرَّاسِخُونَ فِي الْعِلْمِ يَقُولُونَ آمَنَّا بِهِ كُلٌّ مِّنْ عِندِ رَبِّنَا﴾<\/span> <span class=\"ref\">[آل عمران: ٧]<\/span>؛"], [4349.0, "لا توجد معارضات، لن نعارض أبدًا."], [4353.0, "أحسنت، بارك الله فيكم."]], "tr": [[4315.0, "Bu yüzden gayb işlerine dair ayetler Nebî ﷺ'in ashâbına iner, onlar da \"İman ettik ve tasdik ettik, işittik ve itaat ettik\" derlerdi."], [4325.0, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿Onun bir kısmı muhkem ayetlerdir ki bunlar Kitab'ın anasıdır; diğerleri de müteşabihtir. Kalplerinde eğrilik bulunanlar, fitne çıkarmak ve onu te'vil etmek için onun müteşabih olanlarına —yani çok itiraz ederek— uyarlar. Oysa onun te'vilini Allah'tan başkası bilmez﴾<\/span>."], [4327.7, "Buradaki delil şu sözüdür: <span class=\"ayah\">﴿İlimde derinleşmiş olanlar ise \"Ona iman ettik; hepsi Rabbimizin katındandır\" derler﴾<\/span> [Âl-i İmrân 7]."], [4343.0, "İtiraz yok; asla itiraz etmeyiz."], [4349.0, "Güzel, Allah sizi mübarek kılsın."]]}, {"reader": true, "ar": [[4353.7, "أحسن الله إليكم. الكلية السابعة:"], [4354.0, "كلُّ ما كان من قبيل الغيب فلا مدخلَ للعقل فيه استقلالًا."]], "tr": [[4353.7, "Allah size iyilik etsin. Yedinci külliye:"], [4354.0, "Gayb türünden olan her şeyde aklın müstakil (bağımsız) bir payı yoktur."]]}, {"reader": false, "ar": [[4366.0, "كلُّ ما كان من قبيل الغيب فلا مدخل للعقل فيه استقلالًا. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[4366.0, "Gayb türünden olan her şeyde aklın müstakil bir payı yoktur. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[4379.0, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أن الله لما خلق العقول جعل لها حدودًا وطاقات،"], [4392.0, "لا يزال تفكير العقل سليمًا ما دام داخل حدوده وطاقاته ومُدرَكاته،"], [4399.0, "ولكن متى ما أخرجه العبد عن هذه الدائرة إلى دائرةٍ أخرى فإن العقل سوف يتعطّل،"], [4407.0, "لأن الله ما خلق العقول لتُدرك الغيبيات،"], [4411.0, "وإنما خلق العقول لتُدرك الأشياء التي نشاهدها أو نحسّ بها،"], [4417.0, "وأما الغيبيات فإنها بابٌ أعلى وأوسع وأرفع من مُدرَكات العقل."]], "tr": [[4379.0, "Tevfik Allah'tandır, derim ki: Bil —Allah sana rahmet etsin— Allah akılları yarattığında onlara sınırlar ve kapasiteler koydu."], [4392.0, "Akıl, sınırları, kapasiteleri ve idrak alanı içinde kaldıkça düşüncesi sağlıklı olmaya devam eder."], [4399.0, "Ama kul onu bu dairenin dışına, başka bir daireye çıkardığında akıl işlemez hâle gelir."], [4407.0, "Çünkü Allah akılları gaybîleri idrak etsinler diye yaratmadı;"], [4411.0, "gördüğümüz veya hissettiğimiz şeyleri idrak etsinler diye yarattı."], [4411.0, "Gaybîler ise aklın idrak alanından daha yüksek, daha geniş ve daha yüce bir babdır."]]}, {"reader": false, "ar": [[4425.0, "فإياك أن تخوض في غيبٍ بعقلك المجرّد،"], [4430.0, "فإنك سوف تكون مُفتتِحًا على نفسك وعلى المسلمين بابَ غوايةٍ وبابَ ضلالةٍ وبابَ بدعة."], [4439.0, "ولذلك فإن من أعظم أسباب ضلال الطوائف كلِّها إنما لأنهم أقحموا عقولهم في باب الغيبيات."], [4452.0, "فكلُّ من ضلّ في باب الاعتقاد فسببُ ضلاله يرجع إلى إقحام العقل في دَرك كيفية هذا الأمر الغيبي."], [4466.0, "فما عُطّلت صفات الله عز وجل عن مدلولاتها الصحيحة إلا بسبب إقحام عقولهم في درك كيفياتها،"], [4475.0, "ولا عُطّلت حقائق اليوم الآخر عن مدلولاتها الصحيحة ومعانيها السلفية إلا بسبب إقحام العقول في إدراك كيفياتها،"], [4491.0, "وما عُطّل وجود الله عز وجل إلا بسبب إقحام العقل الضعيف العاجز الحقير في إدراك كيفية وجوده."]], "tr": [[4425.0, "Sakın yalın aklınla bir gayba dalma!"], [4425.0, "Aksi hâlde kendine ve Müslümanlara bir azgınlık, sapıklık ve bid'at kapısı açmış olursun."], [4430.0, "Bu yüzden bütün taifelerin sapmasının en büyük sebeplerinden biri, akıllarını gaybîler babına sokmalarıdır."], [4439.0, "İtikad babında sapan herkesin sapıklığının sebebi, aklı bu gaybî işin keyfiyetini idrak etmeye sokmasına dayanır."], [4452.0, "Allah Teâlâ'nın sıfatları sahih anlamlarından ancak akıllarını onların keyfiyetini idrak etmeye sokmaları sebebiyle ta'til edildi."], [4466.0, "Âhiret gününün hakikatleri sahih anlamlarından ve selefî manalarından ancak akılları onların keyfiyetini idrak etmeye sokmak sebebiyle ta'til edildi."], [4475.0, "Allah Teâlâ'nın varlığı da ancak zayıf, aciz ve hakir aklı O'nun varlığının keyfiyetini idrak etmeye sokmak sebebiyle inkâr edildi."]]}]}, {"ts": "1:15:00", "title": "7. Külliye (devam) · 8. Külliye: Gaybî âlemler bütün taalluklarıyla tevkîfîdir", "paras": [{"reader": false, "ar": [[4503.0, "وهكذا دواليك في كل من ضلّ في مسألةٍ غيبية،"], [4508.2, "فيرجع سبب ضلاله لأنه أراد استكشاف هذا الغيب بعقله المجرّد."], [4514.0, "فلا بد أن تعقد صفقةً بينك وبين عقلك:"], [4518.0, "بأنك ـ أيها العقل ـ لا يحلّ لك أن تدخل في هذا الأمر الغيبي،"], [4524.0, "لأن الأمر الغيبي مبناه على التسليم وعدم المعارضة،"], [4527.8, "ومتى ما أدخل العبدُ عقله فيه فلن يُسلِّم له وسوف يعارضه."], [4533.0, "فعدم التسليم للغيبيات سببه إقحام العقل فيها،"], [4539.0, "وكثرة معارضة الغيبيات سببها إقحام العقل فيها."], [4547.0, "ولذلك لا يُعرف عن أهل السنة والجماعة معارضةٌ في أمرٍ غيبي،"], [4553.0, "لأنهم لم يُقحموا عقولهم في شيءٍ من هذه الغيبيات."], [4556.2, "فإذن: لا مدخل للعقول استقلالًا في أبواب الغيب."]], "tr": [[4503.0, "Gaybî bir meselede sapan herkeste durum böyledir:"], [4503.0, "Sapıklığının sebebi, bu gaybı yalın aklıyla keşfetmek istemesine dayanır."], [4514.0, "Seninle aklın arasında bir anlaşma yapman gerekir:"], [4518.0, "\"Ey akıl! Bu gaybî işe girmen sana helal değildir.\" Çünkü gaybî iş teslim ve muâraza etmeme üzerine kuruludur."], [4524.0, "Kul aklını ona soktuğunda ona teslim olmaz ve ona muâraza eder."], [4527.8, "Gaybîlere teslim olmamanın sebebi, aklı onlara sokmaktır;"], [4533.0, "gaybîlere çokça muâraza etmenin sebebi de aklı onlara sokmaktır."], [4539.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat'ten gaybî bir işe muâraza bilinmez;"], [4547.0, "çünkü onlar bu gaybîlerin hiçbirine akıllarını sokmadılar."], [4553.0, "Demek ki gayb bablarında akılların müstakil bir payı yoktur."]]}, {"reader": false, "ar": [[4562.0, "فإن قلت: ولماذا قلتَ «استقلالًا»؟"], [4565.0, "فأقول: لأن أهل السنة يقبلون دخولَ العقل في الغيب تبعًا للنقل؛"], [4570.0, "فإذا كان الأمر الغيبي قد أثبته النقلُ ابتداءً،"], [4578.0, "وكان للعقل فيه مجال،"], [4580.0, "فلا بأس حينئذٍ أن ندخل بعقولنا في هذا الأمر الغيبي الذي أصّل ثبوتَه دليلُ الوحي."], [4589.0, "فعلمُ الله عز وجل أثبتناه بالنقل،"], [4597.0, "وللعقل مدخلٌ فيه؛ فإن العقل يقضي بأن من خلق هذه السماوات على هذا الطراز البديع والنسق الرفيع لم يخلقها إلا وهو عالمٌ خبير،"], [4611.0, "إذ إن من لا علم عنده فإنه لا يُتقن صنعته،"], [4617.0, "من لا علم عنده لن يُتقن صنعته."]], "tr": [[4562.0, "\"Neden 'müstakil olarak' dedin?\" dersen, derim ki:"], [4565.0, "Çünkü Ehl-i Sünnet, aklın gayba nakle tâbi olarak girmesini kabul eder."], [4570.0, "Gaybî bir işi önce nakil isbat etmişse ve onda akla bir alan varsa, işte o zaman sübûtunu vahiy delilinin temellendirdiği bu gaybî işe aklımızla girmemizde sakınca yoktur."], [4589.0, "Allah Teâlâ'nın ilmini nakille isbat ettik;"], [4597.0, "aklın da onda bir payı vardır."], [4597.0, "Çünkü akıl, bu gökleri bu harika tarzda ve yüce düzende yaratanın ancak âlim ve habîr (her şeyden haberdar) olarak yarattığına hükmeder."], [4611.0, "Zira ilmi olmayan, yaptığı işi sağlam yapamaz."]]}, {"reader": false, "ar": [[4623.0, "فلما كانت صنعة الله وإبداعه للسماوات والأرض صنعةً لا مثيل لها،"], [4630.8, "ولا خطأ يعتريها أبدًا ولا خلل فيها،"], [4636.0, "علمنا أنها من عند حكيم ـ إذ من ليس حكيمًا لا يُتقن صنعته ـ ومن عند عليم ـ إذ من لا علم عنده لا يُتقن صنعته ـ ومن عند خبير ـ إذ من ليس له خبرةٌ في صنعته فلن يُتقنها."], [4658.0, "انظر كيف أثبتنا ذلك بالعقل،"], [4662.0, "لكن ليس استقلالًا، وإنما لأن النص أثبته ابتداءً."]], "tr": [[4623.0, "Allah'ın gökleri ve yeri yaratması ve icadı eşi olmayan, asla hata arız olmayan ve kusur bulunmayan bir sanat olunca, bunun hakîm birinden geldiğini bildik;"], [4636.0, "çünkü hakîm olmayan işini sağlam yapamaz."], [4636.0, "Âlim birinden geldiğini bildik; çünkü ilmi olmayan işini sağlam yapamaz."], [4636.0, "Habîr birinden geldiğini bildik; çünkü işinde tecrübesi olmayan onu sağlam yapamaz."], [4658.0, "Bak, bunu akılla nasıl isbat ettik;"], [4662.0, "ama müstakil olarak değil, nass onu önceden isbat ettiği için."]]}, {"reader": false, "ar": [[4666.0, "ووجود الله عز وجل نقليٌّ باعتبار أصل إثباته،"], [4672.0, "وعقليٌّ باعتبار التبعية. وكذلك رحمة الله،"], [4679.0, "فإنها نقليةٌ باعتبار أصل إثباتها،"], [4683.0, "وللعقل فيها مجال. وغضب الله نقليٌّ باعتبار أصل إثباته له،"], [4689.0, "ولكن للعقل فيه مجال؛"], [4691.0, "فإن خلق الجنة بأنواع النعيم دليلٌ على رحمته بأهلها،"], [4697.0, "وخلق النار بأنواع الجحيم والعقوبة والعذاب دليلٌ على غضبه على أهلها."], [4703.0, "فالذي يُنكره أهل السنة إنما هو إقحام العقل استقلالًا وابتداءً في مسائل الغيب،"], [4712.0, "وأما أن يكون العقل تابعًا في مسائل الغيب للنقل فإن هذا لا يرفضه أهل السنة،"], [4720.4, "بل يُقرّونه، وعليه كثيرٌ من تقريراتهم. والله أعلم."]], "tr": [[4666.0, "Allah Teâlâ'nın varlığı, isbatının aslı itibarıyla naklî, tâbi olma itibarıyla aklîdir."], [4672.0, "Allah'ın rahmeti de böyledir: İsbatının aslı itibarıyla naklîdir ve onda akla bir alan vardır."], [4683.0, "Allah'ın gazabı da O'na isbatının aslı itibarıyla naklîdir, ama onda da akla bir alan vardır."], [4691.0, "Çünkü cennetin türlü nimetlerle yaratılması, ehline olan rahmetinin delilidir;"], [4697.0, "cehennemin türlü alevler, cezalar ve azapla yaratılması da ehline olan gazabının delilidir."], [4703.0, "Ehl-i Sünnet'in inkâr ettiği şey, aklı gayb meselelerine müstakil olarak ve ilk kaynak olarak sokmaktır."], [4712.0, "Aklın gayb meselelerinde nakle tâbi olmasını ise Ehl-i Sünnet reddetmez, bilakis kabul eder;"], [4720.4, "takrirlerinin birçoğu da buna dayanır. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[4724.7, "أحسن الله إليكم. الكلية الثامنة:"], [4726.4, "كلُّ العوالم الغيبية مبناها على التوقيف في كل متعلّقاتها."]], "tr": [[4724.7, "Allah size iyilik etsin. Sekizinci külliye:"], [4724.7, "Bütün gaybî âlemler, bütün taalluklarında (kendileriyle ilgili her şeyde) tevkîf (nassa bağlılık) üzerine kuruludur."]]}, {"reader": false, "ar": [[4736.6, "تقول الكلية: كلُّ العوالم الغيبية فمبناها على التوقيف في كل متعلّقاتها. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[4736.6, "Külliye der ki: Bütün gaybî âlemler, bütün taalluklarında tevkîf üzerine kuruludur. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[4762.0, "أقول وبالله التوفيق: هذا فرعٌ من فروع الكلية التي أثبتنا فيها أن الغيب توقيفيٌّ على الدليل."], [4772.0, "ويدخل في ذلك العوالمُ الموصوفة بأنها غيبية،"], [4779.0, "وهي التي لا تُدركها حواسّنا الخمس،"], [4783.0, "فلا نراها ولا نذوقها ولا نشمّها ولا نسمعها ولا نلمسها."], [4792.0, "فكلُّ ما خفي عن الحواس فهو من عالم الغيب."], [4799.0, "فهذه الكلية تتكلم عن العوالم الغيبية"]], "tr": [[4762.0, "Tevfik Allah'tandır, derim ki: Bu, gaybın delile bağlı olduğunu isbat ettiğimiz külliyenin fer'lerinden biridir."], [4772.0, "Buna gaybî olarak nitelenen âlemler girer;"], [4772.0, "bunlar beş duyumuzun idrak etmediği âlemlerdir:"], [4783.0, "Onları görmeyiz, tatmayız, koklamayız, işitmeyiz, dokunmayız."], [4792.0, "Duyulardan gizli kalan her şey gayb âlemindendir."], [4799.0, "Bu külliye, gaybî âlemlerden bahseder —"]]}]}, {"ts": "1:20:00", "title": "8. Külliye (devam): Melekler, cinler, berzah, mahşer, cennet ve cehennem", "paras": [{"reader": false, "ar": [[4804.0, "التي هي خارجةٌ عن مُدرَكات عقولنا وحواسّ أبصارنا."], [4809.0, "فما الواجب علينا فيها؟"], [4814.0, "الجواب: الواجب علينا توقيفُها بكل متعلّقاتها على الدليل."], [4818.0, "فأصلُ عالم الملائكة غيبي،"], [4823.0, "وكلُّ متعلّقات هذا العالم غيبية."], [4826.0, "هل لهم أجنحة؟ الجواب:"], [4831.0, "نعم، لأن الدليل أثبتها."], [4835.0, "فأجنحة الملائكة من متعلّقات هذا العالم فجعلناها غيبية."], [4839.0, "وأعمالهم من متعلّقات عالمهم فجعلناها غيبية ـ عفوًا:"], [4845.7, "فجعلناها توقيفية. وهل يأكلون أو يشربون؟"], [4851.0, "من متعلّقات عالم الملائكة،"], [4854.0, "فجعلناها توقيفية. وهل يتمثّلون بصور البشر؟"], [4859.0, "هي من جملة متعلّقات هذا العالم، فجعلناها توقيفية."]], "tr": [[4804.0, "— aklımızın idrak alanının ve gözlerimizin duyusunun dışında kalan âlemlerden."], [4809.0, "Bunlarda bize düşen nedir? Cevap:"], [4814.0, "Bize düşen, onları bütün taalluklarıyla delile bağlamaktır."], [4818.0, "Melekler âleminin aslı gaybîdir; bu âlemle ilgili her şey de gaybîdir."], [4826.0, "Kanatları var mı? Cevap: Evet, çünkü delil onları isbat etmiştir."], [4835.0, "Meleklerin kanatları bu âlemin taalluklarındandır;"], [4835.0, "bu yüzden onu gaybî kıldık."], [4839.0, "Amelleri onların âleminin taalluklarındandır; onu gaybî —pardon, tevkîfî— kıldık."], [4845.7, "Yerler mi, içerler mi? Bu, melekler âleminin taalluklarındandır;"], [4854.0, "onu tevkîfî kıldık. İnsan suretine girerler mi?"], [4859.0, "Bu, bu âlemin taallukları cümlesindendir; onu tevkîfî kıldık."]]}, {"reader": false, "ar": [[4864.0, "فأصلُ العالم الغيبي توقيفي،"], [4867.0, "وكلُّ ما يتعلّق بهذا العالم غيبي."], [4871.0, "فعالمُ الملائكة توقيفيٌّ بكل متعلّقاته؛"], [4876.0, "فلا نُثبت لهذا العالم إلا ما أثبته النص،"], [4879.0, "ولا ننفي عن هذا العالم إلا ما نفاه النص،"], [4884.0, "وما لم يأتِ النص بإثباته ولا بنفيه فلا حقَّ لنا أن نُثبت شيئًا منه أو ننفيه."]], "tr": [[4864.0, "Gaybî âlemin aslı tevkîfîdir; bu âlemle ilgili her şey de gaybîdir."], [4867.0, "Melekler âlemi bütün taalluklarıyla tevkîfîdir."], [4871.0, "Bu âleme ancak nassın isbat ettiğini isbat ederiz, bu âlemden ancak nassın nefyettiğini nefyederiz."], [4879.0, "Nassın ne isbatını ne nefyini getirdiği şeyden bir şeyi isbat etmeye veya nefyetmeye hakkımız yoktur."]]}, {"reader": false, "ar": [[4891.0, "ومنها عالمُ الجن، فإنه من العوالم الغيبية باعتبار أصله،"], [4898.0, "فيكون كذلك من العوالم الغيبية باعتبار متعلّقاته."], [4903.0, "فأصلُ وجودهم غيبي، وصفاتُ خلقهم غيبية،"], [4909.0, "وأكلُهم وشربهم غيبي، وتزاوجُهم وتناكحُهم وتوالدُهم أمرٌ غيبي،"], [4921.0, "وقوّتُهم وسلطانهم وموتهم وأعمارهم وما يحبّونه أو يكرهونه وأماكنهم كلُّها من الأمور الغيبية،"], [4935.9, "لأنها متعلّقاتٌ لأصلٍ غيبي،"], [4940.0, "وما كان أصله غيبيًّا توقيفيًّا فمتعلّقاته غيبيةٌ توقيفية."], [4949.0, "وذلك لأن المتقرّر في القواعد أن التابع تابع،"], [4955.0, "ومتعلّقاتُ الشيء تتبعه في حكمه؛"], [4959.0, "فإذا كان أصله الإباحة فمتعلّقاته مباحة،"], [4964.0, "وإذا كان أصله تعبّديًّا فمتعلّقاته تعبّدية،"], [4969.0, "وإذا كان أصله غيبيًّا فمتعلّقاته غيبيةٌ كذلك."]], "tr": [[4891.0, "Bunlardan biri de cinler âlemidir."], [4891.0, "Bu âlem aslı itibarıyla gaybî âlemlerdendir;"], [4898.0, "dolayısıyla taallukları itibarıyla da gaybî âlemlerdendir."], [4903.0, "Varlıklarının aslı gaybîdir; yaratılış sıfatları gaybîdir;"], [4909.0, "yemeleri ve içmeleri gaybîdir; evlenmeleri, nikâhlanmaları ve üremeleri gaybî bir iştir;"], [4921.0, "güçleri, hâkimiyetleri, ölümleri, ömürleri, sevdikleri veya hoşlanmadıkları şeyler ve mekânları;"], [4921.0, "bunların hepsi gaybî işlerdendir. Çünkü bunlar gaybî bir aslın taalluklarıdır;"], [4940.0, "aslı gaybî ve tevkîfî olanın taallukları da gaybî ve tevkîfîdir."], [4949.0, "Bu, kaidelerde yerleşik olan \"Tâbi olan tâbidir\" ilkesinden dolayıdır;"], [4959.0, "bir şeyin taallukları hükümde ona tâbidir."], [4959.0, "Aslı mubah ise taallukları mubahtır;"], [4964.0, "aslı taabbüdî ise taallukları taabbüdîdir;"], [4969.0, "aslı gaybî ise taallukları da gaybîdir."]]}, {"reader": false, "ar": [[4979.0, "ومنها عالمُ البرزخ؛ فإنما يكون للإنسان في عالم البرزخ كلُّه من عالم الغيب بكل متعلّقاته."], [4992.0, "فلو لم يُثبت الدليلُ متعلَّقَ سؤال أصحاب القبور لما أثبتناه،"], [4999.0, "ونعيمَهم لما أثبتناه، وعذابَهم لما أثبتناه،"], [5005.0, "واختلافَ أضلاع الكافر منهم لما أثبتناه،"], [5009.0, "وهكذا دواليك في كل متعلّقات عالم البرزخ."], [5015.0, "فعالمُ البرزخ توقيفيٌّ غيبيٌّ باعتبار أصله،"], [5021.0, "فيكون غيبيًّا توقيفيًّا باعتبار كل متعلّقاته."], [5026.0, "فلا حقَّ لك أن تُثبت متعلَّقًا في أمرٍ غيبي إلا وعلى ذلك الإثبات دليلٌ من الشرع."]], "tr": [[4979.0, "Bunlardan biri de berzah âlemidir."], [4979.0, "İnsanın berzah âleminde karşılaşacağı her şey, bütün taalluklarıyla gayb âlemindendir."], [4979.0, "Delil, kabir ehlinin sorgulanmasıyla ilgili hususu isbat etmeseydi onu isbat etmezdik;"], [4999.0, "nimetlerini isbat etmezdik; azaplarını isbat etmezdik;"], [4999.0, "aralarındaki kâfirin kaburgalarının birbirine geçmesini isbat etmezdik."], [5009.0, "Berzah âleminin bütün taalluklarında durum böyledir."], [5015.0, "Berzah âlemi aslı itibarıyla tevkîfî ve gaybîdir;"], [5021.0, "dolayısıyla bütün taallukları itibarıyla da gaybî ve tevkîfîdir."], [5026.0, "Gaybî bir işte, o isbatın üzerinde şeriattan bir delil olmadıkça hiçbir taalluku isbat etmeye hakkın yoktur."]]}, {"reader": false, "ar": [[5035.0, "ومنها كذلك عالمُ المحشر والمنشر يوم القيامة؛"], [5042.0, "فإن الدليل قد أخبر أن الناس سيُحشرون يوم القيامة حفاةً عراةً غُرلًا <span class=\"note\">(Hadis: Buhârî, Müslim)<\/span>،"], [5050.0, "ويخرجون من قبورهم ويُساقون إلى أرض المحشر،"], [5055.0, "وأن الصحف سوف تتطاير يوم القيامة،"], [5059.0, "وأن الصراط على متن جهنم سيُنصب،"], [5062.0, "وأن الميزان ستُوزن فيه الأعمال."], [5066.0, "وكلُّ هذا من العوالم الغيبية بكل متعلّقاته،"], [5070.0, "فلا يجوز لنا أن نُثبت في عالم المحشر والمنشر شيئًا إلا وعلى ذلك الإثبات دليل،"], [5078.0, "ولا أن ننفي شيئًا إلا وعلى ذلك النفي دليلٌ من الشرع."]], "tr": [[5035.0, "Bunlardan biri de kıyamet günündeki mahşer ve neşr (diriliş) âlemidir."], [5042.0, "Delil, insanların kıyamet günü yalınayak, çıplak ve sünnetsiz olarak haşredileceklerini <span class=\"note\">(Buhârî, Müslim)<\/span>, kabirlerinden çıkıp mahşer yerine sevk edileceklerini, kıyamet günü amel defterlerinin uçuşacağını, sıratın cehennemin üzerine kurulacağını ve mizanda amellerin tartılacağını haber vermiştir."], [5062.0, "Bunların hepsi, bütün taalluklarıyla gaybî âlemlerdendir."], [5066.0, "Mahşer ve neşr âleminde, o isbatın üzerinde bir delil olmadıkça hiçbir şeyi isbat etmemiz;"], [5070.0, "o nefyin üzerinde şeriattan bir delil olmadıkça hiçbir şeyi nefyetmemiz caiz değildir."]]}, {"reader": false, "ar": [[5082.0, "ومنها عالمُ الجنة والنار؛"], [5086.0, "فإن عالم الجنة وعالم النار من العوالم التي خلقها الله عز وجل،"], [5095.0, "وأعدّ فيها ما أعدّه لإكرام عباده الطائعين في جنّته،"]], "tr": [[5082.0, "Bunlardan biri de cennet ve cehennem âlemidir."], [5086.0, "Cennet âlemi ve cehennem âlemi, Allah Teâlâ'nın yarattığı âlemlerdendir."], [5086.0, "Allah, cennetinde itaatkâr kullarına ikram için hazırladığını orada hazırlamıştır —"]]}]}, {"ts": "1:25:00", "title": "8. Külliye (sonu) · Dersin kapanışı", "paras": [{"reader": false, "ar": [[5103.0, "ولعذاب العباد الكافرين أو المخالفين لشريعته في ناره."], [5110.0, "فلا يجوز لنا أن نُثبت في هذا العالم الغيبي إلا ما أثبته النص؛"], [5116.0, "فمن أثبت شيئًا في الجنة فإن إثباته موقوفٌ قبوله على ثبوت الدليل،"], [5121.0, "ومن أثبت شيئًا من عذاب أهل النار فإن قبول إثباته توقيفيٌّ على الدليل."], [5129.0, "فلا نُثبت ولا ننفي في العوالم الغيبية إلا بدليل،"], [5134.0, "فكلُّ العوالم الغيبية ـ باعتبار أصلها وباعتبار متعلّقاتها ـ مبنيّةٌ على التوقيف. والله أعلم."]], "tr": [[5103.0, "— ve cehenneminde kâfir kulların veya şeriatına muhalefet edenlerin azabı için (hazırladığını hazırlamıştır)."], [5110.0, "Bu gaybî âlemde ancak nassın isbat ettiğini isbat etmemiz caizdir."], [5116.0, "Cennette bir şeyi isbat edenin isbatının kabulü, delilin sübûtuna bağlıdır."], [5121.0, "Cehennem ehlinin azabından bir şeyi isbat edenin isbatının kabulü de delile bağlıdır."], [5129.0, "Gaybî âlemlerde ancak delille isbat eder ve nefyederiz."], [5134.0, "Bütün gaybî âlemler, aslı ve taallukları itibarıyla tevkîf üzerine kuruludur. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[5146.0, "لعلنا نكتفي بهذا القدر، ومن أراد أن … <span class=\"q\">؟ 01:25:48 — kayıt burada kesiliyor<\/span>"]], "tr": [[5146.0, "Belki bu kadarla yetinelim. Kim … isterse … <span class=\"note\">(kayıt kesiliyor)<\/span>"]]}]}]};
