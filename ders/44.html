[2630.2, "<span class=\"ayah\">﴿قُلْ بِفَضْلِ اللَّهِ وَبِرَحْمَتِهِ فَبِذَٰلِكَ فَلْيَفْرَحُوا هُوَ خَيْرٌ مِّمَّا يَجْمَعُونَ﴾<\/span> <span class=\"ref\">[يونس: ٥٨]<\/span> <span class=\"note\">(Şeyh «وخيرٌ ممّا يجمعون» diyor)<\/span>."]], "tr": [[2602.0, "Çünkü bu, Allah Azze ve Celle'nin şer'î iradesiyle açığa çıkarmayı —insanlara açığa çıkarmayı— istediği bir fazldır;"], [2606.6, "kulu hakkında bildiği bir hikmet içindir."], [2610.0, "Hatta bundan sonra Allah'ın fazlına sevinmek kabilinden insanların senasına sevinse bile, onun insanların ameli üzerindeki senasına sevinmesi ve bununla müjdelenmesi Allah'a bundan dolayı şükretmek kabilindendir;"], [2620.3, "bu da onu (ameli) iptal etmez ve ona zarar vermez."], [2624.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2628.0, "<span class=\"ayah\">﴿De ki: Allah'ın fazlıyla ve rahmetiyle, işte yalnız bununla sevinsinler. Bu, onların toplayıp durduklarından daha hayırlıdır.﴾<\/span> [Yûnus 58]"]]}, {"reader": false, "ar": [[2636.0, "وقد بوّب الإمام النوويّ رحمه الله تعالى في كتابه النافع «رياض الصالحين» عينَ هذه الكلّيّة،"], [2644.0, "قال: «بابُ ما يُتوهَّم أنه رياءٌ وليس هو رياءً»،"], [2652.0, "وساق تحته حديثَ أبي ذرّ رضي الله عنه الذي ذكرتُه على مسامعكم آنفًا."], [2660.0, "قال النوويّ رحمه الله عن هذا الحديث:"], [2663.0, "«قال العلماء: معناه: هذه البشرى المعجَّلة له بالخير، وهي دليلٌ على رضا الله عز وجل عنه ومحبّته له، فيحبّبه إلى الخلق كما سبق في الحديث، ثم يوضع له القبولُ في الأرض. هذا كلُّه إذا حمده الناسُ ـ انتبهوا ـ من غير تعرّضٍ منه لحمدهم»."], [2686.0, "فهمتوه؟ «من غير تعرّضٍ منه لحمدهم، وإلا فالتعرّضُ مذموم». وإلا فالتعرّضُ مذموم."]], "tr": [[2636.0, "İmam Nevevî —Allah ona rahmet etsin— faydalı kitabı Riyâzü's-Sâlihîn'de bu külliyenin ta kendisini bab başlığı yapmıştır:"], [2642.9, "\"Riyâ sanılan ama riyâ olmayan şeyler babı\" demiş ve altında, az önce kulaklarınıza okuduğum Ebû Zer radıyallâhu anh hadisini getirmiştir."], [2656.0, "Nevevî —Allah ona rahmet etsin— bu hadis hakkında şöyle demiştir:"], [2661.7, "\"Âlimler dediler ki: Bunun mânâsı, bu onun için hayırla acele verilmiş müjdedir;"], [2668.0, "Allah Azze ve Celle'nin ondan razı olduğuna ve onu sevdiğine delildir."], [2673.0, "Böylece onu halka sevdirir; nitekim hadiste geçtiği gibi, sonra onun için yeryüzünde kabul konur."], [2680.0, "Bütün bunlar, insanlar onu —dikkat edin— kendisi onların övgüsüne yönelmeksizin övdüğünde (geçerlidir).\" Anladınız mı?"], [2689.4, "\"Kendisi onların övgüsüne yönelmeksizin; yoksa (övgüye) yönelmek kınanmıştır.\" Yoksa yönelmek kınanmıştır."]]}, {"reader": false, "ar": [[2698.0, "وهل له أن يفرح بهذا؟"], [2700.9, "الجواب: نعم، لا بأس به ولا حرج."], [2705.0, "فإنّ كونَ الإنسان يفرح بطاعته التي صارت سببًا لمدح الناس وثناء الناس عليه،"], [2712.0, "من غير قصدٍ منه ولا تعرّضٍ لذلك،"], [2715.0, "فإنّ ذلك داخلٌ في قول النبيّ صلى الله عليه وسلم في حديث الرجل الذي جاءه فقال:"], [2723.5, "«يا رسول الله، ما الإيمان؟ قال: إذا سرّتك حسنتُك وساءتك سيّئتُك فأنت مؤمن. قال: يا رسول الله، فما الإثم؟ قال: إذا حاك في صدرك شيءٌ فدَعْه»."], [2740.0, "أخرجه الإمام أحمد في مسنده بإسنادٍ صحيح. ولعلّ الكلّيّة واضحة."]], "tr": [[2698.0, "Peki buna sevinmesi caiz midir?"], [2700.3, "Cevap: Evet, bunda bir sakınca ve vebal yoktur."], [2705.0, "Çünkü insanın, kendi kastı ve buna yönelmesi olmaksızın insanların kendisini övmesine ve ona sena etmesine sebep olan itaatine sevinmesi, Peygamber sallallâhu aleyhi ve sellem'in, kendisine gelen adam hadisindeki sözünün kapsamına girer."], [2718.6, "(Adam) \"Ey Allah'ın Resûlü! İman nedir?\" dedi."], [2723.0, "Buyurdu ki: \"İyiliğin seni sevindirir, kötülüğün seni üzerse, sen müminsin.\" \"Ey Allah'ın Resûlü!"], [2730.5, "Peki günah nedir?\" dedi. Buyurdu ki:"], [2735.0, "\"Bir şey göğsünü tırmalarsa (içine sinmezse) onu bırak.\" Bunu İmam Ahmed Müsned'inde sahih bir isnadla rivayet etmiştir. Umarım külliye açıktır."]]}]}, {"ts": "45:47", "title": "10. Külliye: Halkı gözeterek sâlih amelin aslını terk eden riyâya düşmüştür", "paras": [{"reader": false, "ar": [[2747.0, "الكلّيّة الأخيرة: <b>كلُّ من ترك أصلَ العمل الصالح لأجل مطالعة الخلق فقد وقع في الرياء.<\/b> يعني فيك فيك <span class=\"q\">؟ 45:54<\/span>."], [2757.0, "كلُّ من ترك أصلَ العمل الصالح لأجل مطالعة الخلق فقد وقع في الرياء."], [2769.0, "أُعيدها مرّةً ثالثة: <b>كلُّ من ترك أصلَ العمل الصالح لأجل مطالعة الخلق فقد وقع في الرياء.<\/b>"]], "tr": [[2747.0, "<b>Son külliye (10. külliye): Halkı gözetmek yüzünden sâlih amelin aslını terk eden herkes riyâya düşmüştür.<\/b> Yani \"fîke fîke\" <span class=\"q\">؟<\/span>."], [2757.8, "Halkı gözetmek yüzünden sâlih amelin aslını terk eden herkes riyâya düşmüştür."], [2769.0, "Üçüncü kez tekrar ediyorum: <b>Halkı gözetmek yüzünden sâlih amelin aslını terk eden herkes riyâya düşmüştür.<\/b>"]]}, {"reader": false, "ar": [[2776.0, "اعلم ـ رحمك الله تعالى ـ أنّ تركَ بعض الأعمال الصالحة من باب مخافة الرياء حقيقتُه أنه من تلبيس إبليس،"], [2788.0, "وقد عدّه جمعٌ من أهل العلم من الرياء."], [2791.0, "وأصلُ هذه الكلّيّة ما رُوي عن الفضيل بن عياض رحمه الله تعالى ـ كما في «شعب الإيمان» ـ أنه قال:"], [2803.8, "«تركُ العمل من أجل الناس رياء، والعملُ من أجل الناس شرك، والإخلاصُ أن يعافيَك الله منهما»."], [2815.0, "قال ابن مفلح رحمه الله تعالى:"], [2819.1, "«لا ينبغي تركُ العمل المشروع خوفَ الرياء»."]], "tr": [[2776.0, "Bil ki —Allah sana rahmet etsin— riyâ korkusuyla bazı sâlih amelleri terk etmenin hakikati, İblis'in telbisindendir (aldatmacasındandır);"], [2785.4, "ehl-i ilimden bir topluluk onu riyâdan saymıştır."], [2789.9, "Bu külliyenin aslı, Fudayl b."], [2792.4, "İyâz'dan —Allah ona rahmet etsin— Şuabü'l-Îmân'da geçtiği üzere rivayet edilen şu sözdür:"], [2800.6, "\"İnsanlar yüzünden ameli terk etmek riyâdır;"], [2804.4, "insanlar için amel etmek şirktir;"], [2807.6, "ihlâs ise Allah'ın seni bu ikisinden korumasıdır.\" İbn Müflih —Allah ona rahmet etsin— şöyle demiştir:"], [2818.4, "\"Riyâ korkusuyla meşru ameli terk etmek uygun değildir.\""]]}, {"reader": false, "ar": [[2824.0, "فممّا يقع للإنسان أنه أراد ـ إذا أراد فعلَ طاعةٍ يقوم عنده شيءٌ من خوف مدح الناس وثنائهم،"], [2837.0, "فيحمله ذلك إلى ترك أصل العمل؛"], [2840.0, "بمعنى أنه يتركه ويزهد فيه ظنًّا منه أنّ ذلك أنفعُ له في الهروب من دائرة الرياء،"], [2850.0, "وهو في الحقيقة واقعٌ بسبب ذلك في الرياء."], [2854.0, "فإن قلتَ: وما الذي ينبغي حينئذٍ؟"], [2857.7, "فأقول: الذي ينبغي عدمُ الالتفات إلى ذلك،"], [2862.0, "وللإنسان أن يفعل ما أمره الله عز وجل به ورغّبه فيه،"], [2868.0, "وعليه مع ذلك أن يستعين بالله عز وجل وأن يتوكّل عليه في وقوع الفعل منه على الوجه الشرعيّ."]], "tr": [[2824.0, "İnsanın başına gelen şeylerden biri şudur:"], [2827.3, "Bir itaati yapmak istediğinde, içinde insanların övgüsünden ve senasından bir korku belirir ve bu, onu amelin aslını terk etmeye sevk eder;"], [2841.2, "yani bunun riyâ dairesinden kaçmada kendisi için daha faydalı olduğunu zannederek onu terk eder ve ondan yüz çevirir."], [2851.0, "Hâlbuki gerçekte bu sebeple riyâya düşmektedir."], [2854.0, "Eğer \"Bu durumda yapılması gereken nedir?\" dersen, derim ki:"], [2858.9, "Yapılması gereken, buna aldırmamaktır. İnsan, Allah Azze ve Celle'nin kendisine emrettiği ve teşvik ettiği şeyi yapar;"], [2867.5, "bununla birlikte fiilin kendisinden şer'î şekilde sâdır olması için Allah Azze ve Celle'den yardım dilemesi ve O'na tevekkül etmesi gerekir."]]}, {"reader": false, "ar": [[2874.0, "ولذلك قال الإمام النوويّ رحمه الله تعالى:"], [2881.0, "«لا ينبغي أن يُترك الذكرُ باللسان مع القلب خوفًا من أن يُظنّ به الرياء، بل يذكر بهما جميعًا ويقصد به وجهَ الله عز وجل»."], [2893.0, "ثم ذكر قولَ الفضيل الذي تلوتُه على مسامعكم آنفًا،"], [2898.0, "ثم قال رحمه الله:"], [2900.6, "«فلو فتح الإنسانُ عليه بابَ ملاحظة الناس والاحترازِ من تطرّق ظنونهم الباطلة لانسدّ عليه أكثرُ أبواب الخير»."], [2913.0, "انتهى كلامه رحمه الله."]], "tr": [[2874.0, "Bu yüzden İmam Nevevî —Allah ona rahmet etsin— şöyle demiştir:"], [2881.5, "\"Kendisi hakkında riyâ zannedilir korkusuyla kalple birlikte dil ile zikir terk edilmemelidir;"], [2887.0, "aksine ikisiyle birlikte zikretmeli ve onunla Allah Azze ve Celle'nin rızasını kastetmelidir.\" Sonra az önce kulaklarınıza okuduğum Fudayl'ın sözünü zikretti."], [2896.3, "Sonra —Allah ona rahmet etsin— şöyle dedi:"], [2899.9, "\"İnsan kendine insanları gözetme ve onların bâtıl zanlarının sızmasından sakınma kapısını açsaydı, hayır kapılarının çoğu ona kapanırdı.\" Sözü burada bitti; Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2915.0, "قال أبو الفرج ابنُ الجوزيّ رحمه الله تعالى:"], [2919.0, "«فأمّا تركُ الطاعات خوفًا من الرياء، فإن كان الباعثُ له على الطاعة غيرَ الدين فهذا ينبغي أن يُترك لأنه معصية، وإن كان الباعثُ على ذلك الدينَ وكان ذلك لأجل الله عز وجل مخلصًا فلا ينبغي أن يُترك العمل؛ لأنّ الباعث الدين. وكذلك إذا ترك العملَ خوفًا من أن يقال: مُراءٍ، فلا ينبغي ذلك؛ لأنه من مكائد الشيطان»."]], "tr": [[2915.0, "Ebü'l-Ferec İbnü'l-Cevzî —Allah ona rahmet etsin— şöyle demiştir:"], [2918.5, "\"Riyâ korkusuyla itaatleri terk etmeye gelince:"], [2921.5, "Eğer kişiyi itaate sevk eden şey dinden başkası ise, bu terk edilmelidir;"], [2926.2, "çünkü o bir masiyettir. Eğer buna sevk eden din ise ve bu, Allah Azze ve Celle için ihlâsla yapılıyorsa, amel terk edilmemelidir;"], [2936.6, "çünkü sevk eden şey dindir."], [2938.7, "Aynı şekilde 'riyâkâr' denilir korkusuyla ameli terk ederse, bu uygun değildir; çünkü bu şeytanın tuzaklarındandır.\""]]}, {"reader": false, "ar": [[2945.0, "ومن جميل ما يُذكر هنا ما رُوي عن إبراهيم النخعيّ رحمه الله تعالى أنه قال:"], [2952.0, "«إذا أتاك الشيطانُ وأنت في صلاةٍ فقال: إنك مُراءٍ، فزِدها طولًا»."], [2959.0, "وأمّا ما رُوي عن بعض السلف أنه ترك العبادةَ خوفًا من الرياء،"], [2967.0, "فيُحمل هذا على أنهم أحسّوا من أنفسهم بنوع تزيُّنٍ فسدّوا الذرائع،"], [2981.0, "وهو كما قال، وهذا جوابُ جمعٍ من أهل العلم."]], "tr": [[2945.0, "Burada zikredilen güzel şeylerden biri de İbrâhîm en-Nehaî'den —Allah ona rahmet etsin— rivayet edilen şu sözdür:"], [2951.5, "\"Sen namazdayken şeytan sana gelip 'Sen riyâkârsın' derse, onu daha da uzat.\" Selefin bazısından riyâ korkusuyla ibadeti terk ettiğine dair rivayet edilene gelince, bu, onların nefislerinde bir tür süslenme (gösteriş arzusu) hissettikleri ve böylece (riyâya giden) yolları kapattıkları şeklinde yorumlanır."], [2981.0, "Bu, (İbnü'l-Cevzî'nin) dediği gibidir; bu, ehl-i ilimden bir topluluğun cevabıdır."]]}, {"reader": false, "ar": [[2988.0, "ولذلك كان الأعمش رحمه الله تعالى عند إبراهيم النخعيّ وهو يقرأ في المصحف،"], [2996.0, "فاستأذن عليهما رجلٌ، فغطّى إبراهيمُ المصحفَ ـ يعني ترك القراءة ـ وقال:"], [3002.5, "«لا يظنّ أني أقرأ فيه كلَّ ساعة»."]], "tr": [[2988.0, "Bu yüzden A'meş —Allah ona rahmet etsin— İbrâhîm en-Nehaî'nin yanındaydı;"], [2993.3, "(İbrâhîm) mushaftan okuyordu. Bir adam yanlarına girmek için izin istedi;"], [2999.7, "İbrâhîm mushafı örttü —yani okumayı bıraktı— ve \"(Adam) benim her saat ondan okuduğumu zannetmesin\" dedi."]]}, {"reader": false, "ar": [[3006.0, "وقد جاء في فتاوى اللجنة الدائمة ـ رحم الله أمواتَهم وثبّت أحياءهم ـ:"], [3015.0, "«أمّا قوله: إنّ العمل من أجل الناس شرك، فهو صحيح؛ لأنّ الأدلّة من الكتاب والسنّة تدلّ على وجوب إخلاص العبادة لله وحده وتحريم الرياء، وقد سمّاه النبيّ صلى الله عليه وسلم الشركَ الأصغر، وذكر أنه أخوفُ ما يخاف على أمّته. وأمّا قوله» ـ وهو الشاهد عندنا ـ «إنّ تركَ العمل من أجل الناس رياء» ـ انتبهوا ـ «فليس على إطلاقه، بل فيه تفصيل، والمعوَّل في ذلك على النيّة؛ لقول النبيّ صلى الله عليه وسلم: إنما الأعمال بالنيّات وإنما لكلّ امرئٍ ما نوى."]], "tr": [[3006.0, "Lecne-i Dâime fetvalarında —Allah onların vefat edenlerine rahmet etsin, hayatta olanlarını sabit kılsın— şöyle geçmiştir:"], [3015.5, "\"Onun (Fudayl'ın) 'İnsanlar için amel etmek şirktir' sözüne gelince, bu doğrudur;"], [3020.0, "çünkü Kitap ve Sünnet'ten deliller, ibadeti yalnızca Allah'a hâlis kılmanın vâcip, riyânın haram olduğuna delâlet eder."], [3026.5, "Peygamber sallallâhu aleyhi ve sellem onu küçük şirk diye adlandırmış ve ümmeti için en çok korktuğu şey olduğunu zikretmiştir."], [3034.4, "Onun\" —bizim için delil olan kısım budur— \"'İnsanlar yüzünden ameli terk etmek riyâdır' sözüne gelince\" —dikkat edin— \"bu mutlak değildir;"], [3043.5, "aksine bunda tafsilat vardır. Bunda dayanılacak şey niyettir;"], [3048.2, "çünkü Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [3051.7, "'Ameller ancak niyetlere göredir ve herkese ancak niyet ettiği vardır.'"]]}, {"reader": false, "ar": [[3055.0, "مع العناية بتحرّي موافقة الشريعة في جميع الأعمال؛"], [3060.0, "لقول النبيّ صلى الله عليه وسلم:"], [3062.0, "من عمل عملًا ليس عليه أمرُنا فهو ردّ."], [3065.0, "فإذا وقع للإنسان حالةٌ ترك فيها العملَ الذي لا يجب عليه لئلّا يُظنّ به ما يضرّه فليس هذا رياءً،"], [3073.0, "بل هو من السياسة الشرعيّة."], [3075.0, "وهكذا لو ترك بعضَ النوافل عند بعض الناس خشيةَ أن يمدحوه بما يضرّه،"], [3081.5, "أو يخشى الفتنةَ به،"], [3083.5, "فإنّ ذلك لا بأس به."], [3086.0, "أمّا الواجبُ عليه فليس له أن يتركه إلا لعذرٍ شرعيّ»."], [3091.0, "انتهى كلامهم رحمهم الله تعالى."]], "tr": [[3055.0, "Bununla birlikte bütün amellerde şeriata uygunluğu araştırmaya özen göstermek gerekir;"], [3060.0, "çünkü Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [3062.4, "'Kim bizim işimizin üzerinde olmadığı bir amel işlerse, o reddedilmiştir.' İnsanın başına, kendisine vâcip olmayan ameli, hakkında kendisine zarar verecek bir şey zannedilmesin diye terk ettiği bir durum gelirse, bu riyâ değildir;"], [3073.4, "aksine bu şer'î siyasettendir. Aynı şekilde bazı insanların yanında, kendisine zarar verecek şekilde onu övmelerinden korkarak ya da onunla fitneye düşülmesinden korkarak bazı nafileleri terk ederse, bunda bir sakınca yoktur."], [3085.5, "Kendisine vâcip olana gelince, onu ancak şer'î bir mazeretle terk edebilir.\" Sözleri burada bitti; Allah onlara rahmet etsin."]]}, {"reader": false, "ar": [[3093.1, "وبه ينتهي الكلامُ على هذه الكلّيّات في هذا الدرس."], [3097.0, "وآخرُ دعوانا أنِ الحمدُ لله ربِّ العالمين،"], [3099.8, "وصلّى الله وسلّم على نبيّنا محمّد."]], "tr": [[3093.1, "Bu dersteki bu külliyeler hakkındaki söz de bununla bitiyor."], [3096.6, "Son duamız, âlemlerin Rabbi Allah'a hamd olsun (demektir)."], [3099.4, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
