<script>
const D={"no": 44, "vid": "yvrpPQFQVuw", "title_ar": "الدرس (٤٤) من شرح كليات العقيدة — من كليات توحيد الألوهية: الرياء ومتعلقاته", "title_tr": "Şerhu Külliyyâti'l-Akîde — 44. Ders: Ulûhiyyet Tevhidi Külliyeleri (Riyâ ve Ona Bağlı Meseleler: Dünya İçin Amel, Sonradan Arız Olan Riyâ, Niyet, Mubah İkincil Maksat, Gizli İbadet, Amelin Açığa Vurulması, Övgüye Kendiliğinden Mazhar Olmak, Riyâ Korkusuyla Ameli Terk)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Dünya nasiplerinden bir şey elde etmek için yapılan amelin tamamı bâtıldır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.2, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.6, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.4, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [11.8, "أمّا بعد: فلا نزال في سياق شرح كلّيّات توحيد الألوهية،"], [17.4, "وعندنا في هذا الدرس عشرُ كلّيّات ـ وعندنا في هذا الدرس عشرُ كلّيّات ـ وهي تخصّ أبوابَ الرياء،"], [26.3, "بابَ الرياء ومتعلَّقاته. فأقول وبالله التوفيق:"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.2, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.3, "Bundan sonra: Hâlâ ulûhiyyet tevhidi külliyelerinin şerhi akışı içindeyiz."], [16.8, "Bu derste elimizde on külliye var —bu derste elimizde on külliye var— ve bunlar riyâ bablarıyla, riyâ babı ve ona bağlı meselelerle ilgilidir. Tevfik Allah'tandır, derim ki:"]]}, {"reader": false, "ar": [[31.0, "الكلّيّة الأولى: <b>كلُّ عملٍ كان الباعثُ عليه تحصيلَ شيءٍ من حظوظ الدنيا فباطلٌ كلُّه.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [39.0, "وذلك أن يكون الباعثُ له تحصيلَ شيءٍ من حظوظ هذه الدنيا،"], [63.0, "فهو لا يريد بالعبادة إلا الدنيا وحدها:"], [66.5, "كمن يحجّ ليأخذ المالَ فقط،"], [69.0, "وكمن يغزو من أجل الغنيمة فقط،"], [72.0, "وكمن يصلّي من أجل المدح والثناء فقط،"], [77.0, "وكمن يطلب العلمَ الشرعيّ ـ والعياذُ بالله ـ من أجل الشهادة فقط،"], [82.0, "أو من أجل الوظيفة فقط."]], "tr": [[31.0, "<b>1. külliye: Kendisine sevk eden şey dünya nasiplerinden bir şey elde etmek olan her amelin tamamı bâtıldır.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [40.4, "Bu, kişiyi (amele) sevk eden şeyin bu dünyanın nasiplerinden bir şey elde etmek olmasıdır;"], [65.0, "o, ibadetle yalnızca dünyayı ister."], [67.5, "Sadece mal almak için haccedenin, sadece ganimet için gazveye çıkanın, sadece övgü ve sena için namaz kılanın, —Allah korusun— şer'î ilmi sadece diploma için ya da sadece iş (memuriyet) için talep edenin durumu gibi."]]}, {"reader": false, "ar": [[83.0, "ولا يريد بشيءٍ من ذلك ـ ولا مطلقَ الإرادة ـ وجهَ الله عز وجل والدارَ الآخرة،"], [90.0, "ولا يخطر بباله أصلًا احتسابُ الأجر عند الله عز وجل في فعل هذه التعبّدات."], [96.0, "وهذا ـ لا جرمَ ـ أنه من أعظم صور الرياء،"], [99.8, "والتي حكم عليها جمعٌ من أهل العلم بأنها من الشرك الأكبر،"], [105.0, "ليست الشركَ الأصغر. ولكنّ القول الصحيح أنها من المحرّمات،"], [110.1, "ومن جملة الكبائر، ومن جملة الشرك الأصغر."], [115.0, "ولا جرمَ أنّ الجميع متّفقون على أنّ هذا العمل لا حظَّ لصاحبه عند الله عز وجل يوم القيامة."]], "tr": [[83.0, "Bunların hiçbiriyle —en ufak bir irade ile bile— Allah Azze ve Celle'nin rızasını ve âhiret yurdunu istemez;"], [91.3, "bu ibadetleri yaparken ecri Allah Azze ve Celle katında ummak aklının ucundan bile geçmez."], [97.4, "Şüphesiz bu, riyânın en büyük suretlerindendir;"], [100.3, "ehl-i ilimden bir topluluk bunun küçük şirk değil, büyük şirkten olduğuna hükmetmiştir."], [106.0, "Ancak sahih görüş, bunun haramlardan, büyük günahlar cümlesinden ve küçük şirk cümlesinden olduğudur."], [115.0, "Şüphesiz herkes, bu amelin sahibinin kıyamet günü Allah Azze ve Celle katında hiçbir nasibi olmadığında ittifak etmiştir."]]}, {"reader": false, "ar": [[122.0, "وقد دلّت الأدلّةُ الكثيرة على أنّ الله لا يقبل من العبادات إلا ما كان خالصًا لوجهه الكريم،"], [131.0, "كما قال الله عز وجل:"], [133.1, "<span class=\"ayah\">﴿وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ﴾<\/span> <span class=\"ref\">[البينة: ٥]<\/span>."], [137.0, "ويقول الله عز وجل:"], [138.8, "<span class=\"ayah\">﴿قُلْ إِنِّي أُمِرْتُ أَنْ أَعْبُدَ اللَّهَ مُخْلِصًا لَّهُ الدِّينَ﴾<\/span> <span class=\"ref\">[الزمر: ١١]<\/span>."], [143.0, "ويقول الله عز وجل:"], [145.0, "<span class=\"ayah\">﴿قُلِ اللَّهَ أَعْبُدُ مُخْلِصًا لَّهُ دِينِي﴾<\/span> <span class=\"ref\">[الزمر: ١٤]<\/span>."]], "tr": [[122.0, "Pek çok delil, Allah'ın ibadetlerden ancak O'nun kerim vechi (rızası) için hâlis olanı kabul ettiğine delâlet etmiştir."], [127.8, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [130.5, "<span class=\"ayah\">﴿Hâlbuki onlara ancak, dini yalnız O'na has kılarak, hanîfler olarak Allah'a ibadet etmeleri emredilmişti.﴾<\/span> [Beyyine 5] Allah Azze ve Celle şöyle buyurur:"], [137.0, "<span class=\"ayah\">﴿De ki: Bana, dini yalnız O'na has kılarak Allah'a ibadet etmem emredildi.﴾<\/span> [Zümer 11] Allah Azze ve Celle şöyle buyurur:"], [143.0, "<span class=\"ayah\">﴿De ki: Ben dinimi yalnız O'na has kılarak yalnız Allah'a ibadet ederim.﴾<\/span> [Zümer 14]"]]}, {"reader": false, "ar": [[148.0, "ويدلّ على هذه الكلّيّة أيضًا قولُ الله عز وجل:"], [152.8, "<span class=\"ayah\">﴿مَن كَانَ يُرِيدُ الْحَيَاةَ الدُّنْيَا وَزِينَتَهَا نُوَفِّ إِلَيْهِمْ أَعْمَالَهُمْ فِيهَا وَهُمْ فِيهَا لَا يُبْخَسُونَ ۝ أُولَٰئِكَ الَّذِينَ لَيْسَ لَهُمْ فِي الْآخِرَةِ إِلَّا النَّارُ ۖ وَحَبِطَ مَا صَنَعُوا فِيهَا وَبَاطِلٌ مَّا كَانُوا يَعْمَلُونَ﴾<\/span> <span class=\"ref\">[هود: ١٥–١٦]<\/span>."], [167.0, "ويدلّ عليها أيضًا قولُ الله عز وجل:"], [169.9, "<span class=\"ayah\">﴿مَن كَانَ يُرِيدُ حَرْثَ الْآخِرَةِ﴾<\/span> ـ أي نصيبَه في الآخرة ـ <span class=\"ayah\">﴿نَزِدْ لَهُ فِي حَرْثِهِ ۖ وَمَن كَانَ يُرِيدُ حَرْثَ الدُّنْيَا نُؤْتِهِ مِنْهَا وَمَا لَهُ فِي الْآخِرَةِ مِن نَّصِيبٍ﴾<\/span> <span class=\"ref\">[الشورى: ٢٠]<\/span>."]], "tr": [[148.0, "Bu külliyeye Allah Azze ve Celle'nin şu sözü de delâlet eder:"], [152.8, "<span class=\"ayah\">﴿Kim dünya hayatını ve onun süsünü isterse, onlara amellerinin karşılığını orada tam olarak veririz ve orada onlar hiçbir eksikliğe uğratılmazlar. İşte onlar, âhirette kendileri için ateşten başka bir şey olmayanlardır; orada yaptıkları boşa gitmiştir ve yapmakta oldukları şeyler bâtıldır.﴾<\/span> [Hûd 15–16] Ona Allah Azze ve Celle'nin şu sözü de delâlet eder:"], [171.6, "<span class=\"ayah\">﴿Kim âhiret kazancını﴾<\/span> —yani âhiretteki nasibini— <span class=\"ayah\">﴿isterse, onun kazancını artırırız; kim de dünya kazancını isterse ona ondan veririz, ama onun âhirette hiçbir nasibi yoktur.﴾<\/span> [Şûrâ 20]"]]}, {"reader": false, "ar": [[183.0, "وكذلك يقول الله عز وجل:"], [184.7, "<span class=\"ayah\">﴿مَّن كَانَ يُرِيدُ الْعَاجِلَةَ﴾<\/span> ـ أي هذه الدنيا ـ <span class=\"ayah\">﴿عَجَّلْنَا لَهُ فِيهَا مَا نَشَاءُ لِمَن نُّرِيدُ ثُمَّ جَعَلْنَا لَهُ جَهَنَّمَ يَصْلَاهَا مَذْمُومًا مَّدْحُورًا ۝ وَمَنْ أَرَادَ الْآخِرَةَ وَسَعَىٰ لَهَا سَعْيَهَا وَهُوَ مُؤْمِنٌ فَأُولَٰئِكَ كَانَ سَعْيُهُم مَّشْكُورًا﴾<\/span> <span class=\"ref\">[الإسراء: ١٨–١٩]<\/span>."], [202.0, "قال الإمام قتادة رحمه الله تعالى:"], [205.0, "«من كانت الدنيا همَّه وطلبَه ونيّتَه جازاه الله بحسناته في الدنيا، ثم يُفضي إلى الآخرة وليس له حسنةٌ يُعطى بها جزاءً. وأمّا المؤمن فيُجازى بحسناته في الدنيا ويُثاب عليها في الآخرة»."]], "tr": [[183.0, "Yine Allah Azze ve Celle şöyle buyurur:"], [184.7, "<span class=\"ayah\">﴿Kim peşin olanı﴾<\/span> —yani bu dünyayı— <span class=\"ayah\">﴿isterse, ona orada, dilediğimiz kimseye dilediğimiz kadarını hemen veririz. Sonra onun için cehennemi hazırlarız; kınanmış ve kovulmuş olarak oraya girer. Kim de âhireti ister ve mümin olarak onun için gereken çabayı gösterirse, işte onların çabası şükranla karşılanır.﴾<\/span> [İsrâ 18–19] İmam Katâde —Allah ona rahmet etsin— şöyle demiştir:"], [205.5, "\"Kimin derdi, talebi ve niyeti dünya olursa, Allah onu iyiliklerinin karşılığını dünyada vererek mükâfatlandırır;"], [211.5, "sonra âhirete, karşılığında kendisine mükâfat verilecek hiçbir iyiliği olmadan varır."], [215.7, "Mümine gelince, o iyiliklerinin karşılığını dünyada da görür, âhirette de onlar için sevap verilir.\""]]}, {"reader": false, "ar": [[221.0, "وعلى ذلك أيضًا قولُ الله عز وجل:"], [224.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُبْطِلُوا صَدَقَاتِكُم بِالْمَنِّ وَالْأَذَىٰ كَالَّذِي يُنفِقُ مَالَهُ رِئَاءَ النَّاسِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٦٤]<\/span> ـ يعني لا يريد بنفقته ولا بصدقاته إلا منافقةَ الناس ومراءاتهم فقط ـ الآيةَ بتمامها."], [243.0, "وقال الله عز وجل:"], [245.0, "<span class=\"ayah\">﴿إِنَّ الْمُنَافِقِينَ يُخَادِعُونَ اللَّهَ وَهُوَ خَادِعُهُمْ وَإِذَا قَامُوا إِلَى الصَّلَاةِ قَامُوا كُسَالَىٰ يُرَاءُونَ النَّاسَ وَلَا يَذْكُرُونَ اللَّهَ إِلَّا قَلِيلًا﴾<\/span> <span class=\"ref\">[النساء: ١٤٢]<\/span>."], [257.0, "فأخبر الله عز وجل أنّ إرادةَ شيءٍ من حُطام الدنيا بشيءٍ من التعبّدات أنه من جملة أعمال المنافقين."]], "tr": [[221.0, "Allah Azze ve Celle'nin şu sözü de bunun üzerinedir:"], [224.0, "<span class=\"ayah\">﴿Ey iman edenler! Malını insanlara gösteriş için harcayan kimse gibi sadakalarınızı başa kakmak ve eziyet etmekle boşa çıkarmayın.﴾<\/span> [Bakara 264] —yani o, infakıyla ve sadakalarıyla yalnızca insanlara karşı ikiyüzlülük yapmayı ve onlara gösteriş yapmayı ister— ayetin tamamı."], [244.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [247.6, "<span class=\"ayah\">﴿Şüphesiz münafıklar Allah'ı aldatmaya çalışırlar; hâlbuki O, onları aldatmaktadır. Namaza kalktıklarında tembel tembel kalkarlar, insanlara gösteriş yaparlar ve Allah'ı pek az anarlar.﴾<\/span> [Nisâ 142] Böylece Allah Azze ve Celle, ibadetlerden bir şeyle dünya metaından bir şey istemenin münafıkların amelleri cümlesinden olduğunu haber vermiştir."]]}, {"reader": false, "ar": [[267.0, "وفي الصحيحين من حديث عمر رضي الله تعالى عنه قال:"], [271.3, "قال النبيّ صلى الله عليه وسلم:"], [274.0, "«إنما الأعمالُ بالنيّات، وإنما لامرئٍ ما نوى، فمن كانت هجرتُه إلى الله ورسوله فهجرتُه إلى الله ورسوله، ومن كانت هجرتُه إلى دنيا يصيبها أو امرأةٍ ينكحها فهجرتُه إلى ما هاجر إليه»."], [288.0, "وكلُّكم تحفظون الحديثَ الذي في الصحيح من حديث أبي هريرة رضي الله عنه قال:"], [294.5, "قال النبيّ صلى الله عليه وسلم:"], [297.3, "«تَعِسَ عبدُ الدينار، تعس عبدُ الدرهم، تعس عبدُ الخميصة، تعس عبدُ الخميلة، إن أُعطي رضي وإن لم يُعطَ سخط، تعس وانتكس، وإذا شِيكَ فلا انتقش» ـ فلا انتقش."]], "tr": [[267.0, "Sahîhayn'de Ömer radıyallâhu teâlâ anh hadisinde şöyle dedi:"], [269.6, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [271.8, "\"Ameller ancak niyetlere göredir. Herkese ancak niyet ettiği vardır."], [275.3, "Kimin hicreti Allah'a ve Resûlü'ne ise, onun hicreti Allah'a ve Resûlü'nedir."], [279.8, "Kimin hicreti de elde edeceği bir dünyalığa ya da nikâhlanacağı bir kadına ise, onun hicreti hicret ettiği şeyedir.\" Sahîh'te Ebû Hüreyre radıyallâhu anh hadisinden gelen şu hadisi hepiniz ezbere bilirsiniz;"], [291.3, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [294.5, "\"Dinarın kulu helâk olsun, dirhemin kulu helâk olsun, hamîsanın (desenli yünlü elbisenin) kulu helâk olsun, hamîlenin (saçaklı kadifenin) kulu helâk olsun!"], [302.9, "Kendisine verilirse razı olur, verilmezse öfkelenir."], [305.3, "Helâk olsun ve baş aşağı düşsün;"], [307.6, "ayağına diken batsa çıkarılmasın\" —çıkarılmasın."]]}]}, {"ts": "05:10", "title": "1. Külliye (devam): Allah'ın kendileriyle ilk hüküm vereceği üç kişi; İbn Receb'in riyâ taksimi", "paras": [{"reader": false, "ar": [[310.0, "وفي صحيح الإمام مسلم من حديث أبي هريرة رضي الله عنه قال:"], [314.4, "قال النبيّ صلى الله عليه وسلم:"], [317.0, "«إنّ أوّلَ الناس يُقضى عليه يومَ القيامة رجلٌ استُشهد، فأُتي به فعرّفه نِعَمَه فعرفها، قال: فما عملتَ فيها؟ قال: قاتلتُ فيك حتى استُشهدت. فيقول: كذبتَ، ولكنك قاتلتَ ليُقال: جريء، فقد قيل. ثم أُمر به فسُحب على وجهه حتى أُلقي في النار»."], [335.0, "وهذا دليلٌ على أنّ هذا الرجل ما أراد بجهاده وجهَ الله والدارَ الآخرة،"], [341.0, "وإنما كان الباعثُ والحاملُ له على الجهاد إنما هو إرادةُ شيءٍ من حُطام الدنيا:"], [345.7, "من التسميع، أو الثناء، أو الغنائم."]], "tr": [[310.0, "İmam Müslim'in Sahîh'inde Ebû Hüreyre radıyallâhu anh hadisinde şöyle dedi:"], [313.3, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [315.3, "\"Kıyamet günü hakkında ilk hüküm verilecek insan, şehit edilmiş bir adamdır."], [319.7, "O getirilir, (Allah) ona nimetlerini tanıtır, o da onları tanır."], [324.4, "'Bunlarda ne yaptın?' der. 'Senin yolunda savaştım, sonunda şehit edildim' der."], [329.0, "(Allah) 'Yalan söyledin; sen ancak cesur desinler diye savaştın, o da denildi' buyurur."], [333.7, "Sonra onun hakkında emir verilir, yüzüstü sürüklenir ve ateşe atılır.\" Bu, o adamın cihadıyla Allah'ın rızasını ve âhiret yurdunu istemediğine delildir."], [341.6, "Onu cihada sevk eden ve iten şey, ancak dünya metaından bir şey istemekti:"], [345.7, "Duyurulmak (tesmî'), övgü ya da ganimetler."]]}, {"reader": false, "ar": [[348.0, "ثم قال النبيّ صلى الله عليه وسلم:"], [351.0, "«ورجلٌ تعلّم العلمَ وعلّمه وقرأ القرآن، فأُتي به فعرّفه نِعَمَه فعرفها، قال: فما عملتَ فيها؟ قال: تعلّمتُ العلمَ وعلّمتُه، وقرأتُ فيك القرآن» ـ فهو يدّعي الإخلاص ـ «فيقول الله عز وجل: كذبتَ، ولكنك تعلّمتَ العلمَ ليُقال: عالم، وقرأتَ القرآن ليُقال: قارئ، فقد قيل. ثم أُمر به فسُحب على وجهه حتى أُلقي في النار»."]], "tr": [[348.0, "Sonra Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [350.1, "\"Bir de ilmi öğrenmiş, onu öğretmiş ve Kur'an okumuş bir adam."], [354.0, "O getirilir, (Allah) ona nimetlerini tanıtır, o da onları tanır."], [357.6, "'Bunlarda ne yaptın?' der. 'İlmi öğrendim, onu öğrettim ve senin için Kur'an okudum' der.\" —O, ihlâs iddia ediyor— \"Allah Azze ve Celle 'Yalan söyledin;"], [367.0, "sen ancak âlim desinler diye ilmi öğrendin, kârî desinler diye Kur'an okudun, o da denildi' buyurur."], [372.0, "Sonra onun hakkında emir verilir, yüzüstü sürüklenir ve ateşe atılır.\""]]}, {"reader": false, "ar": [[375.0, "«ورجلٌ وسّع الله عليه وأعطاه من أصناف المال كلِّه، فأُتي به فعرّفه نِعَمَه فعرفها، قال: فما عملتَ فيها؟ قال: ما تركتُ من سبيلٍ تحبّ أن يُنفَق فيها إلا أنفقتُ فيها لك. فيقول: كذبتَ، ولكنك أنفقتَ ليُقال: جواد، فقد قيل. ثم أُمر به فسُحب على وجهه حتى أُلقي في النار»."], [395.0, "نعوذ بالله من ذلك."], [397.0, "فهذه الأعمال التعبّديّة العظيمة،"], [399.0, "التي هي من أعظم أعمال الإسلام،"], [402.0, "صارت وبالًا ولعنةً وسخطًا وعقوبةً وعذابًا على صاحبها؛"], [408.0, "بسبب أنه كان الباعثُ له على القيام بها إنما هو إرادةُ شيءٍ من حُطام الدنيا."]], "tr": [[375.0, "\"Bir de Allah'ın bolluk verdiği ve malın her türünden kendisine ihsan ettiği bir adam."], [380.1, "O getirilir, (Allah) ona nimetlerini tanıtır, o da onları tanır."], [383.1, "'Bunlarda ne yaptın?' der. 'İçinde mal harcanmasını sevdiğin hiçbir yol bırakmadım ki senin için oraya harcamamış olayım' der."], [390.1, "(Allah) 'Yalan söyledin; sen ancak cömert desinler diye harcadın, o da denildi' buyurur."], [394.4, "Sonra onun hakkında emir verilir, yüzüstü sürüklenir ve ateşe atılır.\" Bundan Allah'a sığınırız."], [400.0, "İşte İslâm'ın en büyük amellerinden olan bu büyük ibadet amelleri, sahibine vebal, lânet, gazap, ceza ve azap oldu;"], [409.1, "çünkü onu bunları yapmaya sevk eden şey ancak dünya metaından bir şey istemekti."]]}, {"reader": false, "ar": [[415.0, "ويقول النبيّ صلى الله عليه وسلم:"], [417.0, "«من تعلّم علمًا ممّا يُبتغى به وجهُ الله لا يتعلّمه إلا لينال به عَرَضًا من الدنيا لم يجد عَرْفَ الجنة يوم القيامة» ـ يعني ريحَها ـ أخرجه الإمام أبو داود في سننه بإسنادٍ صحيحٍ لغيره."], [432.0, "وكذلك أيضًا أخرج الإمام الترمذيّ في جامعه من حديث كعب بن مالك رضي الله عنه قال:"], [438.5, "قال النبيّ صلى الله عليه وسلم:"], [441.7, "«من طلب العلمَ ليُجاريَ به العلماء، أو ليُماريَ به السفهاء، أو ليصرفَ وجوهَ الناس إليه، أدخله الله النار» يومَ القيامة."], [453.0, "وهذا كلُّه دليلٌ على أنّ كلَّ من أراد بتعبّده شيئًا من حُطام الدنيا فليس له في الآخرة من نصيب."]], "tr": [[415.0, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [417.2, "\"Kim kendisiyle Allah'ın rızası aranan bir ilmi, sadece onunla dünyalıktan bir pay elde etmek için öğrenirse, kıyamet günü cennetin kokusunu alamaz\" —yani rayihasını."], [427.0, "Bunu İmam Ebû Dâvûd Sünen'inde li-gayrihî sahih bir isnadla rivayet etmiştir."], [432.8, "Yine İmam Tirmizî de Câmi'inde Ka'b b."], [435.6, "Mâlik radıyallâhu anh hadisinden rivayet etmiştir;"], [438.5, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [442.8, "\"Kim ilmi, onunla âlimlerle yarışmak, beyinsizlerle tartışmak ya da insanların yüzlerini kendisine çevirmek için talep ederse, Allah onu ateşe sokar\" kıyamet günü."], [454.5, "Bütün bunlar, ibadetiyle dünya metaından bir şey isteyen herkesin âhirette hiçbir nasibi olmadığına delildir."]]}, {"reader": false, "ar": [[462.0, "قال الإمام ابن رجب رحمه الله تعالى:"], [466.0, "«اعلم أنّ العمل لغير الله أقسام: فتارةً يكون رياءً محضًا، بحيث لا يُراد به سوى مراءاة المخلوقين لغرضٍ دنيويّ، كحال المنافقين في صلاتهم، كما قال الله عز وجل: <span class=\"ayah\">﴿وَإِذَا قَامُوا إِلَى الصَّلَاةِ قَامُوا كُسَالَىٰ يُرَاءُونَ النَّاسَ وَلَا يَذْكُرُونَ اللَّهَ إِلَّا قَلِيلًا﴾<\/span> <span class=\"ref\">[النساء: ١٤٢]<\/span>. وقال الله عز وجل: <span class=\"ayah\">﴿فَوَيْلٌ لِّلْمُصَلِّينَ ۝ الَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ ۝ الَّذِينَ هُمْ يُرَاءُونَ﴾<\/span> <span class=\"ref\">[الماعون: ٤–٦]<\/span>. وكذلك وصف الله تعالى الكفارَ بالرياء في قوله: <span class=\"ayah\">﴿وَلَا تَكُونُوا كَالَّذِينَ خَرَجُوا مِن دِيَارِهِم بَطَرًا وَرِئَاءَ النَّاسِ﴾<\/span> <span class=\"ref\">[الأنفال: ٤٧]<\/span>."]], "tr": [[462.0, "İmam İbn Receb —Allah ona rahmet etsin— şöyle demiştir:"], [466.0, "\"Bil ki Allah'tan başkası için yapılan amel kısımlara ayrılır:"], [469.9, "Bazen saf riyâ olur; öyle ki onunla dünyevî bir amaç için mahlûklara gösterişten başka bir şey istenmez."], [478.5, "Münafıkların namazlarındaki hâli gibi; nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [482.4, "<span class=\"ayah\">﴿Namaza kalktıklarında tembel tembel kalkarlar, insanlara gösteriş yaparlar ve Allah'ı pek az anarlar.﴾<\/span> [Nisâ 142] Allah Azze ve Celle şöyle buyurmuştur:"], [490.6, "<span class=\"ayah\">﴿Vay o namaz kılanların hâline ki, onlar namazlarından gafildirler; onlar gösteriş yaparlar.﴾<\/span> [Mâûn 4–6] Yine Allah Teâlâ kâfirleri riyâ ile nitelemiştir:"], [500.0, "<span class=\"ayah\">﴿Yurtlarından şımarıkça ve insanlara gösteriş için çıkanlar gibi olmayın.﴾<\/span> [Enfâl 47]"]]}, {"reader": false, "ar": [[504.0, "وهذا الرياءُ المحض لا يكاد يصدر من مؤمنٍ في فرض الصلاة والصيام،"], [511.0, "وقد يصدر في الصدقة الواجبة أو الحجّ وغيرهما من الأعمال الظاهرة أو التي يتعدّى نفعُها،"], [519.0, "فإنّ الإخلاص فيها عزيز."], [522.0, "وهذا العمل لا يشكّ مسلمٌ أنه حابط،"], [526.0, "وأنّ صاحبه يستحقّ المقتَ من الله والعقوبة»."], [530.0, "انتهى كلامه. وبه ينتهي الكلامُ عن الكلّيّة، ولله الحمدُ والمِنّة."]], "tr": [[504.0, "Bu saf riyâ, farz namazda ve oruçta bir müminden neredeyse sâdır olmaz."], [509.8, "Ama farz sadakada, hacda ve bunlar gibi açıktan yapılan ya da faydası başkasına geçen amellerde sâdır olabilir;"], [518.0, "çünkü bunlarda ihlâs nadirdir. Bu amelin boşa gittiğinden hiçbir Müslüman şüphe etmez;"], [524.3, "sahibi de Allah'ın buğzunu ve cezasını hak eder.\" Sözü burada bitti."], [530.0, "Bu külliye hakkındaki söz de bununla bitiyor; hamd ve minnet Allah'adır."]]}]}, {"ts": "08:54", "title": "2. Külliye: Allah için başlayıp sonra riyâ arız olan ve sahibinin ona kapıldığı amel boşa gider", "paras": [{"reader": false, "ar": [[534.0, "الكلّيّة الثانية: كلُّ عملٍ كان لله،"], [539.0, "ثم طرأ عليه الرياء،"], [542.0, "واسترسل فاعلُه معه، فحابطٌ كلُّه. كلُّ عملٍ كان لله،"], [549.0, "ثم طرأ عليه الرياء،"], [552.0, "واسترسل فاعلُه معه، فحابط."], [557.0, "كلُّ عملٍ كان لله،"], [559.3, "ثم طرأ عليه الرياء،"], [561.7, "واسترسل فاعلُه معه، فحابط."]], "tr": [[534.0, "<b>2. külliye: Allah için olan, sonra kendisine riyâ arız olan ve yapanın da onunla birlikte akıp gittiği her amelin tamamı boşa gitmiştir.<\/b> Allah için olan, sonra kendisine riyâ arız olan ve yapanın da onunla birlikte akıp gittiği her amel boşa gitmiştir."], [555.0, "Allah için olan, sonra kendisine riyâ arız olan ve yapanın da onunla birlikte akıp gittiği her amel boşa gitmiştir."]]}, {"reader": false, "ar": [[564.0, "أقول وبالله التوفيق: وهذه الكلّيّة تختلف عن الكلّيّة الأولى باعتبار الابتداء،"], [572.4, "ولكنها تتّفق معها باعتبار الانتهاء."], [577.0, "فأصلُ صلاته كانت لله،"], [578.3, "لكن طرأ عليها الرياءُ طُروءًا."], [580.0, "وأصلُ صدقته كانت لله،"], [581.8, "ولكن طرأ الرياءُ عليها طُروءًا."], [584.0, "وأصلُ جهاده كان لله،"], [586.2, "ولكن طرأ الرياءُ عليه طُروءًا."], [589.0, "وأصلُ حجّه أو عمرته كانت لله عز وجل،"], [592.7, "ولكن طرأ عليها الرياءُ طُروءًا."]], "tr": [[564.0, "Tevfik Allah'tandır, derim ki: Bu külliye, başlangıç itibarıyla birinci külliyeden ayrılır, ama sonuç itibarıyla onunla birleşir."], [573.8, "Namazının aslı Allah için idi, ancak ona sonradan riyâ arız oldu."], [579.0, "Sadakasının aslı Allah için idi, ancak ona sonradan riyâ arız oldu."], [583.1, "Cihadının aslı Allah için idi, ancak ona sonradan riyâ arız oldu."], [587.9, "Haccının ya da umresinin aslı Allah Azze ve Celle için idi, ancak ona sonradan riyâ arız oldu."]]}, {"reader": false, "ar": [[595.0, "ولمّا طرأ عليه ذلك الرياءُ لم يجاهده ولم يدافعه،"], [599.5, "وإنما رضي به، وعمل بمقتضاه،"], [602.6, "واسترسل معه، وأعجبه؛ فحينئذٍ يُعتبر عملُه في هذه الحالة باطلًا كلُّه."], [613.0, "لِما في صحيح الإمام مسلم من حديث أبي هريرة رضي الله عنه قال:"], [617.4, "قال النبيّ صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل أنه قال:"], [623.9, "«أنا أغنى الشركاء عن الشرك، من عمل عملًا أشرك معي فيه غيري تركتُه وشركَه»."]], "tr": [[595.0, "O riyâ kendisine arız olunca onunla mücadele etmedi, onu defetmeye çalışmadı;"], [599.0, "aksine ona razı oldu, onun gereğiyle amel etti, onunla birlikte akıp gitti ve bu hoşuna gitti."], [607.2, "İşte o zaman bu durumda amelinin tamamı bâtıl sayılır."], [613.7, "Çünkü İmam Müslim'in Sahîh'inde Ebû Hüreyre radıyallâhu anh hadisinde şöyle dedi:"], [616.7, "Peygamber sallallâhu aleyhi ve sellem, Rabbi Azze ve Celle'den rivayet ettiği hadiste O'nun şöyle buyurduğunu bildirdi:"], [622.0, "\"Ben ortakların şirkten en müstağni olanıyım."], [623.9, "Kim bir amel yapar da onda benimle birlikte başkasını ortak koşarsa, onu da şirkini de terk ederim.\""]]}, {"reader": false, "ar": [[632.0, "وأخرج الإمام النسائيّ بإسنادٍ جيّدٍ من حديث أبي أمامة الباهليّ رضي الله عنه أنّ رجلًا جاء إلى رسول الله صلى الله عليه وسلم فقال:"], [641.6, "«يا رسول الله، أرأيتَ رجلًا يغزو ـ أو قال: يجاهد ـ يلتمس الأجرَ والذِّكرَ ـ يلتمس الأجرَ والذِّكر ـ؟ فقال رسول الله صلى الله عليه وسلم: لا شيءَ له. فأعادها ثلاثَ مرّات، كلُّ ذلك يقول له النبيّ صلى الله عليه وسلم: لا شيءَ له. ثم قال النبيّ صلى الله عليه وسلم: إنّ الله تبارك وتعالى لا يقبل من العمل إلا ما كان خالصًا وابتُغي به وجهُه». إسنادُه جيّد."]], "tr": [[632.0, "İmam Nesâî, Ebû Ümâme el-Bâhilî radıyallâhu anh hadisinden ceyyid bir isnadla şunu rivayet etmiştir:"], [637.3, "Bir adam Resûlullah sallallâhu aleyhi ve sellem'e geldi ve şöyle dedi:"], [640.1, "\"Ey Allah'ın Resûlü! Gazveye çıkan —ya da 'cihad eden' dedi— ve hem ecri hem şöhreti arayan —hem ecri hem şöhreti arayan— bir adam hakkında ne dersin?\" Resûlullah sallallâhu aleyhi ve sellem:"], [655.1, "\"Onun için hiçbir şey yoktur\" buyurdu."], [656.5, "Adam bunu üç kez tekrarladı;"], [659.2, "her seferinde Peygamber sallallâhu aleyhi ve sellem ona \"Onun için hiçbir şey yoktur\" diyordu."], [664.9, "Sonra Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [667.9, "\"Allah Tebâreke ve Teâlâ amelden ancak hâlis olanı ve kendisiyle O'nun rızası aranmış olanı kabul eder.\" İsnadı ceyyiddir."]]}, {"reader": false, "ar": [[676.0, "وهذا المعنى عليه جماهيرُ أهل العلم،"], [680.0, "من أنه متى ما كان أصلُ العمل لله،"], [683.0, "ثم طرأ الرياءُ على صاحبه ورضي واسترسل معه،"], [686.0, "فإنه يُعتبر حابطًا. وهذا مرويٌّ عن عُبادة بن الصامت،"], [694.4, "وعن أبي الدرداء، والحسن،"], [696.7, "وسعيد بن المسيِّب، وغيرهم،"], [699.0, "بل لا يُعرف عن السلف في هذا خلاف."], [701.0, "وإنما الخلافُ المنقول في هذه المسألة إنما هو عن بعض أهل العلم المتأخّرين."], [708.0, "فلا يجوز للإنسان أن يرضى بشيءٍ من طوارئ الرياء قطّ."]], "tr": [[676.0, "Ehl-i ilmin cumhuru bu mânâ üzerindedir:"], [679.3, "Amelin aslı Allah için olur, sonra sahibine riyâ arız olur ve o buna razı olup onunla birlikte akıp giderse, (o amel) boşa gitmiş sayılır."], [692.7, "Bu, Ubâde b. es-Sâmit'ten, Ebü'd-Derdâ'dan, Hasan'dan, Saîd b."], [697.3, "el-Müseyyeb'den ve başkalarından rivayet edilmiştir;"], [699.5, "hatta selefin bu konuda ihtilaf ettiği bilinmemektedir."], [701.0, "Bu meselede nakledilen ihtilaf, ancak sonraki dönem ehl-i ilminin bazılarından gelmektedir."], [706.9, "Dolayısıyla insanın, riyânın arız olan hâllerinden hiçbirine asla razı olması caiz değildir."]]}, {"reader": false, "ar": [[715.0, "فإن قلتَ: وما الحكمُ فيما لو دافعه ولم يسترسل معه؟"], [720.0, "فأقول: هو في هذه الحالة مأجورٌ ليس بمأزور؛"], [723.7, "لقول الله عز وجل:"], [726.0, "<span class=\"ayah\">﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا ۚ وَإِنَّ اللَّهَ لَمَعَ الْمُحْسِنِينَ﴾<\/span> <span class=\"ref\">[العنكبوت: ٦٩]<\/span>. والله أعلم."]], "tr": [[715.0, "Eğer \"Onu defetmeye çalışsa ve onunla birlikte akıp gitmese hüküm nedir?\" dersen, derim ki:"], [720.0, "Bu durumda o, ecir alır, günahkâr olmaz."], [722.0, "Çünkü Allah Azze ve Celle şöyle buyurmuştur:"], [724.9, "<span class=\"ayah\">﴿Bizim uğrumuzda mücâhede edenleri elbette yollarımıza ileteceğiz. Şüphesiz Allah iyilik edenlerle beraberdir.﴾<\/span> [Ankebût 69] Allah en iyisini bilir."]]}]}, {"ts": "12:11", "title": "3. Külliye: Her amel, sıhhat ve butlan, kemal ve noksan bakımından niyetine bağlıdır", "paras": [{"reader": false, "ar": [[731.0, "الكلّيّة الثالثة: كلُّ عملٍ فمقرونٌ بنيّته. كلُّ عملٍ فمقرونٌ بنيّته صحّةً وبطلانًا،"], [741.4, "وكمالًا ونقصًا. أُعيدها مرّةً ثالثة:"], [753.0, "<b>كلُّ عملٍ فمقرونٌ بنيّته صحّةً وبطلانًا، وكمالًا ونقصًا.<\/b>"]], "tr": [[731.0, "<b>3. külliye: Her amel niyetine bağlıdır.<\/b> Her amel, <b>sıhhat ve butlan, kemal ve noksan bakımından<\/b> niyetine bağlıdır."], [742.1, "Üçüncü kez tekrar ediyorum: <b>Her amel, sıhhat ve butlan, kemal ve noksan bakımından niyetine bağlıdır.<\/b>"]]}, {"reader": false, "ar": [[761.0, "وعليه قولُ النبيّ صلى الله عليه وسلم:"], [763.0, "«إنما الأعمال بالنيّات»؛ أي:"], [765.8, "إنما صحّةُ الأعمال بالنيّات،"], [769.0, "وإنما بطلانُ الأعمال بالنيّات،"], [771.0, "وإنما كمالُ الأعمال بالنيّات،"], [773.0, "وإنما نقصُ الأعمال بالنيّات."], [776.0, "فالأعمال وإن اتّفقت صورُها في الظاهر،"], [780.0, "إلا أنها تتفاوت عند الله عز وجل تفاوتًا عظيمًا بحسب ما يقوم في قلوب أصحابها من النيّات."], [787.0, "وقد أجمع فقهاءُ الإسلام على أنّ الله لا يقبل من الأعمال إلا ما كان مقرونًا بنيّةٍ صالحة."]], "tr": [[761.0, "Peygamber sallallâhu aleyhi ve sellem'in \"Ameller ancak niyetlere göredir\" sözü de bunun üzerinedir;"], [766.6, "yani amellerin sıhhati ancak niyetlerledir, amellerin butlanı ancak niyetlerledir, amellerin kemali ancak niyetlerledir ve amellerin noksanlığı ancak niyetlerledir."], [778.0, "Ameller dış görünüşte suret olarak aynı olsa da, sahiplerinin kalplerinde bulunan niyetlere göre Allah Azze ve Celle katında birbirinden çok büyük farklılık gösterir."], [788.9, "İslâm fakihleri, Allah'ın amellerden ancak sâlih bir niyetle birlikte olanı kabul ettiğinde icmâ etmişlerdir."]]}, {"reader": false, "ar": [[796.0, "والنيّةُ عند أهل العلم تنقسم إلى قسمين:"], [800.0, "إلى نيّة إيقاع العمل،"], [801.8, "وإلى نيّة توحيد المعمول له."], [804.0, "فأمّا نيّةُ إيقاع العمل فهي النيّة التي يتكلّم عليها الفقهاء،"], [813.0, "والتي قرّر فيها أبو العباس ابنُ تيمية رحمه الله القاعدةَ المعروفة:"], [818.5, "أنّ النيّة تتبع العلم،"], [823.0, "فمن علم ما سيفعل فقد نواه."], [827.0, "وهي نيّةٌ لا تقتضي استحضارًا شديدًا ولا استشعارًا قويًّا،"], [833.0, "وإنما تأتي مباشرةً إذا علم الإنسانُ ما سيفعل وعزم عليه."], [839.0, "فالمقصود من نيّة إيقاع العمل:"], [841.3, "أي العزيمةُ على فعل هذا العمل وقصدُ العمل."]], "tr": [[796.0, "Ehl-i ilme göre niyet iki kısma ayrılır:"], [799.4, "Ameli gerçekleştirme niyeti ve amelin kendisi için yapıldığı Zât'ı birleme (tevhid) niyeti."], [805.4, "Ameli gerçekleştirme niyeti, fakihlerin üzerinde konuştuğu niyettir;"], [810.3, "Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— bu konuda bilinen şu kaideyi takrir etmiştir:"], [820.1, "Niyet ilme tâbidir; ne yapacağını bilen ona niyet etmiş olur."], [827.7, "Bu, şiddetli bir hazırlık (istihzâr) ve güçlü bir hissetme gerektirmeyen bir niyettir;"], [835.4, "insan ne yapacağını bilip ona azmettiğinde doğrudan gelir."], [839.9, "Ameli gerçekleştirme niyetinden maksat, bu ameli yapmaya azmetmek ve ameli kastetmektir."]]}, {"reader": false, "ar": [[845.0, "وأمّا النيّةُ التي هي أخطرُ منها على الإطلاق فهي نيّةُ توحيد المعمول له،"], [854.0, "بمعنى: أن لا تقصد بعملك غيرَ وجه الله عز وجل والدارِ الآخرة."], [859.0, "وهي النيّة التي يتكلّم عليها علماءُ الاعتقاد في باب «ما جاء في الرياء» وغيره،"], [865.0, "وهي من أعظم ما يحرص الشيطانُ على تغفيل القلوب عنه."], [873.0, "فإنّ النيّة الأولى إن فاتت فقُصارى العمل أن يكون حابطًا،"], [878.0, "ولكنّ النيّة الثانية إن فاتت وحلّ محلَّها ضدُّها،"], [882.0, "فإنّ الإنسان لا يقع في بطلان العمل فقط،"], [885.3, "وإنما يقع في الشرك."]], "tr": [[845.0, "Mutlak olarak ondan daha tehlikeli olan niyet ise amelin kendisi için yapıldığı Zât'ı birleme niyetidir;"], [854.8, "yani amelinle Allah Azze ve Celle'nin rızasından ve âhiret yurdundan başkasını kastetmemen."], [859.9, "Bu, akîde âlimlerinin \"Riyâ hakkında gelenler\" babında ve başka yerlerde üzerinde konuştukları niyettir;"], [865.7, "şeytanın kalpleri ondan gafil bırakmaya en çok hırs gösterdiği şeylerdendir."], [873.5, "Çünkü birinci niyet kaçarsa, amelin varacağı en son nokta boşa gitmesidir."], [879.0, "Ama ikinci niyet kaçar ve yerine onun zıddı gelirse, insan sadece amelin butlanına düşmekle kalmaz, şirke de düşer."]]}, {"reader": false, "ar": [[887.0, "ولذلك يجب على الإنسان أن يستحضر نيّةَ توحيد المعمول له أكثرَ وأشدَّ من مجرّد استحضاره لنيّة إيقاع العمل؛"], [897.0, "لأنّ عليها مدارَ العمل صحّةً وبطلانًا،"], [901.7, "وكمالًا ونقصًا. والله أعلم."], [904.0, "وأنا اختصرتُ هذه القاعدة لأنها عند الفقهاء."]], "tr": [[887.0, "Bu yüzden insanın, amelin kendisi için yapıldığı Zât'ı birleme niyetini, ameli gerçekleştirme niyetini sadece hazır tutmasından daha çok ve daha kuvvetli bir şekilde (zihninde) hazır tutması vâciptir."], [896.4, "Çünkü amelin sıhhat ve butlan, kemal ve noksan bakımından dayandığı eksen odur."], [902.3, "Allah en iyisini bilir. Bu kaideyi kısa tuttum, çünkü o fakihlerin (ele aldığı) bir kaidedir."]]}]}, {"ts": "15:08", "title": "4. Külliye: Asıl ibadet maksadına ortak olmayan mubah bir maksat ibadete zarar vermez", "paras": [{"reader": false, "ar": [[908.0, "القاعدة ـ الكلّيّة ـ الرابعة: <b>كلُّ مُرادٍ مباحٍ لا يقع مشاركًا للمقصود الأوّل من التعبّد فلا يضرّه.<\/b> كلُّ مرادٍ مباحٍ لا يقع مشاركًا للمقصود الأوّل من التعبّد فلا يضرّه."], [938.0, "أُعيدها مرّةً ثالثة: <b>كلُّ مرادٍ مباحٍ لا يقع مشاركًا للمقصود الأوّل من التعبّد فلا يضرّه.<\/b>"]], "tr": [[908.0, "<b>4.<\/b> Kaide —<b>külliye: İbadetteki birinci (asıl) maksada ortak olmayan her mubah istek, (ibadete) zarar vermez.<\/b> İbadetteki birinci maksada ortak olmayan her mubah istek, ona zarar vermez."], [927.5, "Üçüncü kez tekrar ediyorum: <b>İbadetteki birinci maksada ortak olmayan her mubah istek, ona zarar vermez.<\/b>"]]}, {"reader": false, "ar": [[945.0, "وذلك لأنّ المتقرّر في القواعد أنه يُغتفر في المقصود الثاني ما لا يُغتفر في المقصود الأوّل،"], [954.0, "وأنه يُغتفر في المقصود التبعيّ ما لا يُغتفر في المقصود الأصليّ الأساسيّ."], [960.0, "وذلك لأنّ من الناس من يكون الباعثُ الأوّل له والمقصودُ الأعظم في فعل هذا التعبّد إنما هو إرادةُ وجه الله والدار الآخرة،"], [968.0, "ولكنه أراد بالمقصود التبعيّ الثانويّ الثاني شيئًا من الدنيا؛"], [975.0, "فحينئذٍ لا بأس بذلك ولا حرج فيه،"], [980.0, "ولكن شريطةَ أن يكون هذا المرادُ الثاني لا يحلّ محلَّ المقصود الأوّل ـ والعياذ بالله ـ ولا يكون مزاحمًا له."]], "tr": [[945.0, "Bu şundandır: Kaidelerde sabit olan şudur:"], [948.4, "İkinci maksatta, birinci maksatta affedilmeyen şey affedilir;"], [952.9, "tâbi maksatta, asıl ve temel maksatta affedilmeyen şey affedilir."], [957.5, "Bu şundandır: İnsanlardan bazısını bu ibadeti yapmaya sevk eden ilk şey ve en büyük maksat ancak Allah'ın rızasını ve âhiret yurdunu istemektir;"], [966.7, "ama tâbi, ikincil, ikinci maksatla dünyadan bir şey istemiştir."], [971.9, "Bu durumda bunda bir sakınca ve vebal yoktur."], [979.3, "Ancak şu şartla ki bu ikinci istek —Allah korusun— birinci maksadın yerini almasın ve onunla rekabet etmesin."]]}, {"reader": false, "ar": [[989.0, "فالذي يجب على المسلم أن يحميَه في المقصود الأوّل هو:"], [995.3, "الاستبدالُ والمزاحمة. فإيّاك أن يزاحم مقصودَك الأوّلَ شيءٌ،"], [999.0, "أو أن تستبدله بشيءٍ آخر."], [1002.0, "فإنك إن استبدلتَه بشيءٍ من حُطام الدنيا وقعتَ فيما قرّرته الكلّيّة الأولى،"], [1009.0, "وإن زاحمتَه بشيءٍ من محبّة المدح والثناء أو شيءٍ من حُطام الدنيا وقعتَ فيما تقرّره الكلّيّة الثانية، كما شرحتُ لكم."]], "tr": [[989.0, "Müslümanın birinci maksatta (ondan) koruması vâcip olan şey, yer değiştirme ve rekabettir."], [995.3, "Sakın birinci maksadınla bir şey rekabet etmesin ya da onu başka bir şeyle değiştirmeyesin."], [1002.0, "Çünkü onu dünya metaından bir şeyle değiştirirsen birinci külliyenin takrir ettiği şeye düşersin;"], [1008.4, "onunla övgü ve sena sevgisinden ya da dünya metaından bir şeyi rekabet ettirirsen, size şerh ettiğim gibi ikinci külliyenin takrir ettiği şeye düşersin."]]}, {"reader": false, "ar": [[1019.0, "لكن أن يكون مقصودًا منفصلًا،"], [1022.4, "ولا شأنَ له بأصل الباعث على هذا التعبّد،"], [1028.0, "وإنما يكون مقصودًا ثانيًا غيرَ مزاحمٍ للمقصود الأوّل،"], [1033.5, "فإنّ ذلك جائز. وقد دلّت الأدلّةُ على جواز ذلك،"], [1041.0, "كما قال الله عز وجل في الحجّ:"], [1044.0, "<span class=\"ayah\">﴿لَيْسَ عَلَيْكُمْ جُنَاحٌ أَن تَبْتَغُوا فَضْلًا مِّن رَّبِّكُمْ﴾<\/span> <span class=\"ref\">[البقرة: ١٩٨]<\/span>."], [1049.0, "قال ابن عباس رضي الله عنهما في تفسيرها:"], [1053.0, "«لا حرج عليكم في الشراء والبيع قبل الإحرام وبعده»."]], "tr": [[1019.0, "Fakat (bu istek), ayrı bir maksat olur, bu ibadete sevk eden asıl şeyle bir ilgisi bulunmaz, sadece birinci maksatla rekabet etmeyen ikinci bir maksat olursa, bu caizdir."], [1034.9, "Deliller bunun caiz olduğuna delâlet etmiştir."], [1040.3, "Nitekim Allah Azze ve Celle hac hakkında şöyle buyurmuştur:"], [1043.6, "<span class=\"ayah\">﴿Rabbinizden bir lütuf (rızık) aramanızda size bir günah yoktur.﴾<\/span> [Bakara 198] İbn Abbâs radıyallâhu anhümâ bunun tefsirinde şöyle demiştir:"], [1052.5, "\"İhramdan önce ve sonra alım satım yapmanızda size bir vebal yoktur.\""]]}, {"reader": false, "ar": [[1056.0, "فإنّ من الناس من يريد الحجّ ولكن معه سلعةٌ يريد أن يبيعها،"], [1061.0, "أو يقصد شراءَ شيءٍ بسفرته هذه؛"], [1064.2, "بما أنه في مكة يريد أن يشتريَ شيئًا أو يبيعَ شيئًا."], [1070.0, "فإذا كان البيعُ والشراء هو المقصودَ الأوّل أو مزاحمًا للمقصود الأوّل فإنّ حجّه باطل."], [1076.0, "وأمّا إذا كان أصلُ مقصوده في سفرته الحجَّ،"], [1079.0, "ولكن بما أنه قطع هذه المسافة فإنه لا بأس عليه أن ينتفع بشيءٍ ممّا يريده بيعًا وشراءً على وجهٍ غيرِ مزاحمٍ للمقصود الأوّل،"], [1092.5, "فإنّ ذلك جائزٌ لا بأس به."]], "tr": [[1056.0, "Çünkü insanlardan kimi hac yapmak ister, ama yanında satmak istediği bir mal vardır ya da bu yolculuğuyla bir şey satın almayı kasteder;"], [1065.8, "Mekke'de olduğuna göre bir şey almak ya da bir şey satmak ister."], [1071.7, "Eğer alım satım birinci maksat ya da birinci maksatla rekabet eden bir şey olursa, haccı bâtıldır."], [1077.9, "Ama yolculuğundaki asıl maksadı hac olur da, bu mesafeyi katettiğine göre birinci maksatla rekabet etmeyecek şekilde, alım satım olarak istediği bir şeyden faydalanmasında bir sakınca yoksa, bu caizdir, bunda bir sakınca yoktur."]]}, {"reader": false, "ar": [[1096.0, "ويدلّ عليها أيضًا ما في الصحيحين من حديث ابن مسعود رضي الله عنه قال:"], [1103.5, "قال النبيّ صلى الله عليه وسلم:"], [1106.3, "«يا معشرَ الشباب، من استطاع منكم الباءةَ فليتزوّج، فإنه أغضُّ للبصر وأحصنُ للفرج، ومن لم يستطع فعليه بالصوم فإنه له وِجاء»."], [1119.0, "فهو يصوم تعبّدًا لله عز وجل بهذا الصوم في المقصود الأوّل،"], [1126.0, "ولكن في المقصود الثاني فهو يتّخذ هذا الصومَ سبيلًا لغضّ بصره وحفظ فرجه."], [1133.0, "فهذا لا يجوز أن يكون هو المقصودَ الأوّل في الصوم ولا مزاحمًا للمقصود الأوّل،"], [1139.9, "ولكن يكون من جملة المرادات المباحة التي تُعتبر في القصد الثاني."]], "tr": [[1096.0, "Buna Sahîhayn'de İbn Mes'ûd radıyallâhu anh hadisinde geçen şu söz de delâlet eder;"], [1101.9, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1105.3, "\"Ey gençler topluluğu! Sizden evlenmeye gücü yeten evlensin;"], [1108.6, "çünkü bu, gözü daha çok sakındırır ve iffeti daha çok korur."], [1114.7, "Gücü yetmeyen oruç tutsun; çünkü oruç onun için bir kalkandır (şehveti kırar).\" O, birinci maksatta bu oruçla Allah Azze ve Celle'ye ibadet için oruç tutar;"], [1128.7, "ama ikinci maksatta bu orucu gözünü sakınmak ve iffetini korumak için bir yol edinir."], [1135.5, "Bunun oruçta birinci maksat olması ya da birinci maksatla rekabet etmesi caiz değildir;"], [1140.8, "ama ikinci kasıtta itibar edilen mubah istekler cümlesinden olur."]]}, {"reader": false, "ar": [[1145.0, "ويدلّ عليها أيضًا قولُ النبيّ صلى الله عليه وسلم:"], [1150.0, "«من أحبّ أن يُبسط له في رزقه ويُنسأ له في أثره فليصل رحمه»."], [1157.0, "فلو تصوّرنا إنسانًا إنما كان الباعثُ له على صلة الرحم زيادةَ الرزق وتأخيرَ الأجل،"], [1165.0, "فإنه ليس له عند الله عز وجل من خَلاق."], [1168.0, "فلا ينبغي أن يكون هذا الفضلُ أو الأثرُ المترتّب على هذا التعبّد ـ وإن كان مذكورًا في الحديث ـ لا ينبغي أن يكون هو المقصودَ الأوّل أو مزاحمًا للمقصود الأوّل،"], [1180.0, "وإنما يكون ممّا يترتّب على فعلك هذا."]], "tr": [[1145.0, "Buna Peygamber sallallâhu aleyhi ve sellem'in şu sözü de delâlet eder:"], [1151.1, "\"Kim rızkının genişletilmesini ve ecelinin geciktirilmesini severse, akrabalık bağını gözetsin.\" Eğer akrabalık bağını gözetmeye kendisini sevk eden şey yalnızca rızkın artması ve ecelin gecikmesi olan bir insan düşünürsek, onun Allah Azze ve Celle katında hiçbir nasibi yoktur."], [1169.5, "Bu ibadete terettüp eden bu fazilet ya da sonuç —hadiste zikredilmiş olsa bile— birinci maksat ya da birinci maksatla rekabet eden bir şey olmamalıdır;"], [1179.6, "ancak bu fiiline terettüp eden bir şey olmalıdır."]]}, {"reader": false, "ar": [[1184.0, "فإنك إذا وصلتَ أرحامك فإنه سيترتّب على صلة الرحم ـ بالنيّة الطيّبة ـ ما نصّ عليه النبيّ صلى الله عليه وسلم،"], [1193.0, "سواءٌ التفت قلبُك له أو لم يلتفت قلبُك له."], [1197.0, "فإذا التفت قلبُك له على أنه مقصودٌ ثانٍ فإنّ ذلك جائزٌ لا بأس به."]], "tr": [[1184.0, "Çünkü akrabalarınla bağını gözettiğinde, güzel niyetle yapılan akrabalık bağına, Peygamber sallallâhu aleyhi ve sellem'in açıkça bildirdiği şey terettüp edecektir;"], [1193.9, "kalbin ona yönelse de yönelmese de."], [1196.6, "Kalbin ona ikinci bir maksat olarak yönelirse, bu caizdir, bunda bir sakınca yoktur."]]}, {"reader": false, "ar": [[1204.0, "وبناءً على ذلك: فلو أنّ الإنسان صام لحفظ الصحّة في المقصود الثاني فلا بأس عليه."], [1212.0, "ولو أنّ الإنسان تصدّق لشفاء مريضه في المقصود الثاني فلا بأس عليه."], [1219.0, "ولو أنّ الإنسان درس في كلّيّةٍ شرعيّة ونال علمًا كثيرًا،"], [1226.0, "يريد الوظيفةَ والشهادة بالمقصود الثاني،"], [1228.3, "فإنّ ذلك جائزٌ لا بأس به."], [1231.0, "فيجب علينا أن نفرّق بين مقاصد التعبّد،"], [1235.0, "فلا يكون شيءٌ من حُطام الدنيا محبطًا لشيءٍ من التعبّدات إلا إذا كان هو المقصودَ الأوّل أو زاحم المقصودَ الأوّل."], [1247.0, "وأمّا إذا أردتَه بالقصد الثاني فإنّ ذلك جائزٌ لا بأس به، والله أعلم."]], "tr": [[1204.0, "Buna göre: İnsan ikinci maksatta sağlığını korumak için oruç tutsa, ona bir sakınca yoktur."], [1211.5, "İnsan ikinci maksatta hastasının şifası için sadaka verse, ona bir sakınca yoktur."], [1218.4, "İnsan şer'î bir fakültede okuyup çok ilim elde etse ve ikinci maksatla iş ve diploma istese, bu caizdir, bunda bir sakınca yoktur."], [1231.0, "Dolayısıyla ibadetin maksatları arasında ayrım yapmamız vâciptir:"], [1235.0, "Dünya metaından hiçbir şey, ancak birinci maksat olursa ya da birinci maksatla rekabet ederse ibadetlerden bir şeyi boşa çıkarır."], [1246.2, "Onu ikinci kasıtla istersen, bu caizdir, bunda bir sakınca yoktur. Allah en iyisini bilir."]]}]}, {"ts": "20:52", "title": "5. Külliye: İbadet ne kadar gizli olursa ihlâsı o kadar tam, ecri o kadar mükemmel olur", "paras": [{"reader": false, "ar": [[1252.0, "ومن الكلّيّات أيضًا: <b>كلّما كان التعبّدُ أخفى كان إخلاصُه أتمَّ وأجرُه أكمل.<\/b> كلّما كان التعبّد أخفى كان إخلاصه أتمّ وأجره أكمل."], [1273.0, "أُعيدها مرّةً ثالثة: <b>كلّما كان التعبّد أخفى كان إخلاصه أتمّ وأجره أكمل.<\/b>"]], "tr": [[1252.0, "Külliyelerden biri de şudur (<b>5. külliye<\/b>):"], [1254.0, "<b>İbadet ne kadar gizli olursa, ihlâsı o kadar tam, ecri o kadar mükemmel olur.<\/b> İbadet ne kadar gizli olursa, ihlâsı o kadar tam, ecri o kadar mükemmel olur."], [1273.0, "Üçüncü kez tekrar ediyorum: <b>İbadet ne kadar gizli olursa, ihlâsı o kadar tam, ecri o kadar mükemmel olur.<\/b>"]]}, {"reader": false, "ar": [[1283.0, "أقول وبالله التوفيق: المتقرّر في القواعد أنّ الأصل في التعبّدات الإخفاء،"], [1289.0, "إلا إذا أمر الشارع بإظهاره،"], [1291.5, "أو اقتضت المصلحةُ الشرعيّة إظهارَه."], [1294.0, "وإلا فالأصل أنّ الإنسان يسعى جاهدًا في إخفاء عبادته."], [1301.0, "فتلك الأعمال الخفيّة التي لا يكاد يطّلع عليها إلا صاحبُها،"], [1307.2, "أو من فُعلت له أو معه،"], [1311.0, "ولم يعرف عنها لا قريبٌ ولا بعيد،"], [1314.0, "فلا جرمَ أنّ أجرها أكملُ عند الله عز وجل،"], [1317.0, "واستحضارُ صاحبها للنيّة والتعبّدِ لله عز وجل بها أكمل؛"], [1323.0, "لأنه ليس عنده من يُرائيه أو يصرف له شيئًا من مقصود تعبّده."]], "tr": [[1283.0, "Tevfik Allah'tandır, derim ki: Kaidelerde sabit olan şudur:"], [1286.3, "İbadetlerde asıl olan gizliliktir; ancak Şâri' onun açığa vurulmasını emrederse ya da şer'î maslahat onun açığa vurulmasını gerektirirse (durum değişir)."], [1295.4, "Bunun dışında asıl olan, insanın ibadetini gizlemek için var gücüyle çalışmasıdır."], [1302.2, "Sahibinden ya da kendisi için veya kendisiyle birlikte yapılandan başkasının neredeyse muttali olmadığı, ne yakının ne uzağın bildiği o gizli ameller;"], [1312.3, "şüphesiz onların ecri Allah Azze ve Celle katında daha mükemmeldir."], [1315.7, "Sahibinin niyeti ve onlarla Allah Azze ve Celle'ye ibadet etmeyi (zihninde) hazır tutması da daha mükemmeldir;"], [1323.0, "çünkü yanında gösteriş yapacağı ya da ibadet maksadından bir şeyi kendisine yönelteceği kimse yoktur."]]}, {"reader": false, "ar": [[1330.0, "فعبادةُ السرّ وطاعاتُ الخفاء أجلُّ القربات،"], [1336.0, "وأعظمُ ما تُفرَّج به الكربات،"], [1338.0, "وتسمو به الدرجات، وتُكفَّر به السيّئات."], [1342.0, "وهي زينةُ العبد في خلواته،"], [1344.0, "وهي من أعظم ما يجعل القلوبَ متّصلةً بالله عز وجل اتّصالًا وثيقًا لا يشوبه شيءٌ من النظر يمينًا أو شمالًا."], [1355.0, "فهذا من أعظم ما يتزوّد به العبدُ من هذه الدنيا للدار الآخرة، وهي عباداتُ السرّ."]], "tr": [[1330.0, "Gizli ibadet ve gizli itaatler, kurbetlerin en yücesidir;"], [1336.4, "sıkıntıların kendisiyle giderildiği, derecelerin kendisiyle yükseldiği ve kötülüklerin kendisiyle örtüldüğü şeylerin en büyüğüdür."], [1343.2, "O, kulun yalnızlığındaki süsüdür; kalpleri Allah Azze ve Celle'ye, sağa sola bakmanın hiçbir şekilde bulaşmadığı sağlam bir bağla bağlayan şeylerin en büyüklerindendir."], [1354.5, "Kulun bu dünyadan âhiret yurdu için edindiği azıkların en büyüklerinden biri budur; o da gizli ibadetlerdir."]]}, {"reader": false, "ar": [[1364.0, "فعبادةُ السرّ وطاعةُ السرّ من أعظم ما يدلّ على صدق العبد في تعبّده،"], [1371.0, "ومن أعظم ما يُعينه على الإخلاص في مقصود تعبّده،"], [1376.0, "بل هي من أعظم علامات الإيمان وحبِّ الرحمن."], [1379.0, "فلذلك لا تكون ـ في الأعمّ الأغلب،"], [1383.3, "أقصد عباداتِ السرّ ـ لا تكون إلا من صاحب قلبٍ ملأه اللهُ عز وجل <span class=\"q\">؟ 23:06<\/span>؛"], [1390.2, "ملأه: يعني امتلأ قلبُه بحبّ الله تبارك وتعالى."]], "tr": [[1364.0, "Gizli ibadet ve gizli itaat, kulun ibadetindeki sadakatine delâlet eden şeylerin en büyüklerinden ve ibadet maksadında ihlâsa ona yardım eden şeylerin en büyüklerindendir;"], [1375.4, "hatta o, imanın ve Rahmân sevgisinin en büyük alametlerindendir."], [1379.0, "Bu yüzden o —çoğunlukla; gizli ibadetleri kastediyorum— ancak Allah Azze ve Celle'nin doldurduğu <span class=\"q\">؟<\/span> bir kalbin sahibinden sâdır olur;"], [1389.6, "doldurdu, yani kalbi Allah Tebâreke ve Teâlâ sevgisiyle doldu."]]}, {"reader": false, "ar": [[1396.0, "وأمّا من في قلبه دَخَن فإنه من أكسل الناس وأفتر الناس إذا خلا بنفسه،"], [1405.0, "فلا تجد عنده شيئًا كثيرًا من عبادات السرّ."], [1408.8, "وإنما لا يدفعه ولا يعينه ولا يثير همّتَه ولا يقوّي عزيمتَه إلا تلك العباداتُ التي يراه الناسُ فيها،"], [1417.5, "وهذا من أعظم ما يُتّهم به قصدُه."], [1421.0, "ولهذا كانت عباداتُ السرّ من أشقّ العبادات على المنافقين،"], [1430.0, "ومن أصعب ما يكون على الكذّابين،"], [1433.5, "ولا مكانَ لها عند المدّعين المُرائين؛"], [1437.0, "لأنّ المُرائي في الأعمّ الأغلب إنما يعمل ليراه الناس،"], [1442.1, "ويحسّن أعمالَه ليمدحوه ويُثنوا عليه."]], "tr": [[1396.0, "Kalbinde bulanıklık olana gelince, o yalnız kaldığında insanların en tembeli ve en gevşeğidir;"], [1403.2, "onun yanında gizli ibadetlerden fazla bir şey bulamazsın."], [1407.4, "Onu ancak insanların kendisini gördüğü o ibadetler harekete geçirir, ona yardım eder, gayretini uyandırır ve azmini kuvvetlendirir;"], [1414.5, "bu da onun maksadının kendisiyle itham edildiği şeylerin en büyüklerindendir."], [1419.0, "Bu yüzden gizli ibadetler münafıklara en ağır gelen ibadetlerden ve yalancılara en zor gelen şeylerdendir;"], [1430.6, "iddiacı riyâkârların yanında ise onlara hiç yer yoktur."], [1434.7, "Çünkü riyâkâr çoğunlukla ancak insanlar kendisini görsün diye amel eder ve onu övsünler, ona sena etsinler diye amellerini güzelleştirir."]]}, {"reader": false, "ar": [[1445.0, "وأمّا المؤمن الصادق فإنه إنما يريد بتعبّده وجهَ الله،"], [1449.0, "فيكون اجتهادُه في طاعات السرّ أكثرَ من اجتهاده في طاعات الظهور والجلاء."], [1459.0, "ولذلك قال الله عز وجل عن الصدقات:"], [1462.9, "<span class=\"ayah\">﴿إِن تُبْدُوا الصَّدَقَاتِ فَنِعِمَّا هِيَ ۖ وَإِن تُخْفُوهَا وَتُؤْتُوهَا الْفُقَرَاءَ فَهُوَ خَيْرٌ لَّكُمْ﴾<\/span> <span class=\"ref\">[البقرة: ٢٧١]<\/span>."], [1469.0, "وفي حديث السبعة الذين يظلّهم الله في ظلّه يومَ لا ظلَّ إلا ظلُّه،"], [1477.5, "قال عليه الصلاة والسلام:"], [1480.1, "«ورجلٌ تصدّق بصدقةٍ فأخفاها حتى لا تعلمَ شمالُه ما تُنفق يمينُه»."], [1487.0, "وعليها أيضًا قولُ النبيّ صلى الله عليه وسلم:"], [1491.3, "«صدقةُ السرّ تُطفئ غضبَ الربّ»، حديثٌ حسن."]], "tr": [[1445.0, "Sâdık mümine gelince, o ibadetiyle ancak Allah'ın rızasını ister;"], [1448.1, "bu yüzden gizli itaatlerdeki gayreti, açık ve aşikâr itaatlerdeki gayretinden daha fazla olur."], [1455.2, "Bu yüzden Allah Azze ve Celle sadakalar hakkında şöyle buyurmuştur:"], [1461.8, "<span class=\"ayah\">﴿Sadakaları açıktan verirseniz ne güzel! Eğer onları gizler de fakirlere verirseniz, bu sizin için daha hayırlıdır.﴾<\/span> [Bakara 271] Allah'ın, kendi gölgesinden başka gölgenin olmadığı günde gölgesinde gölgelendireceği yedi kişi hadisinde, aleyhissalâtu vesselâm şöyle buyurmuştur:"], [1478.1, "\"Bir de bir sadaka verip onu, sağ elinin infak ettiğini sol eli bilmeyecek kadar gizleyen adam.\" Buna Peygamber sallallâhu aleyhi ve sellem'in şu sözü de delildir:"], [1491.3, "\"Gizli sadaka Rabbin gazabını söndürür.\" Hasen bir hadistir."]]}, {"reader": false, "ar": [[1495.0, "وقال النبيّ صلى الله عليه وسلم عن قراءة القرآن:"], [1500.0, "«فضلُ قراءة السرّ على قراءة العلن كفضل صدقة السرّ على صدقة العلن»،"], [1508.1, "حديثٌ حسن. وقال صلى الله عليه وسلم:"], [1514.5, "«من استطاع منكم أن يكون له خَبْءٌ من عملٍ صالحٍ فليفعل»."], [1520.0, "بل إنّ من جميل الاستدلال على عِظَم أجر المطيع في الخفاء قولَ الله عز وجل:"], [1532.4, "<span class=\"ayah\">﴿فَلَا تَعْلَمُ نَفْسٌ مَّا أُخْفِيَ لَهُم مِّن قُرَّةِ أَعْيُنٍ جَزَاءً بِمَا كَانُوا يَعْمَلُونَ﴾<\/span> <span class=\"ref\">[السجدة: ١٧]<\/span>."]], "tr": [[1495.0, "Peygamber sallallâhu aleyhi ve sellem Kur'an okumak hakkında şöyle buyurmuştur:"], [1500.0, "\"Gizli okumanın açık okumaya üstünlüğü, gizli sadakanın açık sadakaya üstünlüğü gibidir.\" Hasen bir hadistir."], [1508.7, "Yine sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1514.5, "\"Sizden kim sâlih amelden gizli bir birikimi olmasını sağlayabilirse, yapsın.\" Hatta gizlide itaat edenin ecrinin büyüklüğüne yapılan güzel istidlallerden biri de Allah Azze ve Celle'nin şu sözüdür:"], [1531.8, "<span class=\"ayah\">﴿Yapmakta olduklarına karşılık olarak onlar için saklanan göz aydınlığını hiçbir nefis bilmez.﴾<\/span> [Secde 17]"]]}, {"reader": false, "ar": [[1540.0, "فلمّا أخفَوا عملَهم عن الناس أخفى الله عز وجل جزاءَهم،"], [1546.5, "ليُوفّيَهم إيّاه يومَ القيامة أكملَ ما يكون،"], [1551.0, "وإنما أخفاه الله عز وجل تنويهًا بعظمته وكثرته،"], [1555.7, "والجزاءُ من جنس العمل."], [1558.0, "والعبادة التي ينبغي إخفاؤها هي العبادة التي لا يجب أو يُسنّ الجهرُ بها،"], [1568.9, "كما سيأتي إن شاء الله."], [1571.0, "فيدخل في ذلك الصدقات،"], [1573.7, "فالمستحبّ إخفاؤها. ويدخل في ذلك قيامُ الليل،"], [1578.0, "وصلاةُ الضحى، والنافلةُ القبليّة والبعديّة."]], "tr": [[1540.0, "Onlar amellerini insanlardan gizleyince, Allah Azze ve Celle de onların mükâfatını gizledi ki kıyamet günü onu kendilerine olabilecek en mükemmel şekilde tam olarak versin."], [1553.3, "Allah Azze ve Celle onu, büyüklüğüne ve çokluğuna dikkat çekmek için gizlemiştir;"], [1559.4, "karşılık amelin cinsindendir. Gizlenmesi gereken ibadet, —inşallah ileride geleceği gibi— açıktan yapılması vâcip veya sünnet olmayan ibadettir."], [1570.6, "Sadakalar buna girer; onların gizlenmesi müstehaptır."], [1573.7, "Gece namazı, kuşluk namazı, (farzlardan) önceki ve sonraki nafile namazlar da buna girer."]]}, {"reader": false, "ar": [[1581.0, "فإنّ من سنّة النبيّ صلى الله عليه وسلم أن يجعل النوافلَ كلَّها ـ المؤكّدةَ وغيرَ المؤكّدة ـ كلَّها في البيت؛"], [1591.0, "لما في الصحيحين من حديث زيد بن ثابت رضي الله عنه قال:"], [1594.4, "قال النبيّ صلى الله عليه وسلم:"], [1597.0, "«فصلّوا أيها الناسُ في بيوتكم، فإنّ أفضلَ صلاة المرء في بيته إلا المكتوبة»."], [1605.0, "وفي حديث عبد الله بن شقيق عند الإمام مسلم قال:"], [1608.4, "سألتُ عائشة رضي الله عنها عن صلاة رسول الله صلى الله عليه وسلم،"], [1613.2, "عن تطوّعه، فقالت: «كان النبيّ صلى الله عليه وسلم يصلّي قبل الظهر في بيتي أربعًا، ثم يخرج فيصلّي بالناس، ثم يدخل بيتي فيصلّي ركعتين، ثم يصلّي بالناس المغرب، ثم يدخل فيصلّي ركعتين، ثم يخرج فيصلّي بالناس العشاء، ثم يدخل فيصلّي ركعتين»."]], "tr": [[1581.0, "Çünkü Peygamber sallallâhu aleyhi ve sellem'in sünnetinden biri, müekked olsun olmasın bütün nafileleri evde kılmasıdır."], [1589.3, "Sahîhayn'de Zeyd b. Sâbit radıyallâhu anh hadisinde şöyle geçer;"], [1592.6, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1595.3, "\"Ey insanlar! Evlerinizde namaz kılın;"], [1597.8, "çünkü kişinin en faziletli namazı, farz namaz dışında evinde kıldığı namazdır.\" İmam Müslim'deki Abdullah b."], [1606.0, "Şakîk hadisinde şöyle dedi: Âişe radıyallâhu anhâ'ya Resûlullah sallallâhu aleyhi ve sellem'in namazını, nafilesini sordum."], [1611.8, "Şöyle dedi: \"Peygamber sallallâhu aleyhi ve sellem öğleden önce benim evimde dört (rekât) kılardı, sonra çıkar insanlara namaz kıldırırdı, sonra evime girer iki rekât kılardı."], [1622.0, "Sonra insanlara akşamı kıldırır, sonra girer iki rekât kılardı."], [1626.8, "Sonra çıkar insanlara yatsıyı kıldırır, sonra girer iki rekât kılardı.\""]]}, {"reader": false, "ar": [[1634.0, "ومن المعلوم أنّ المتواتر عن النبيّ صلى الله عليه وسلم في قيام الليل إنما كان يقومه في بيته،"], [1643.2, "لا يراه إلا من عنده من زوجةٍ أو قريب."], [1649.0, "ونسأل الله أن يُعيننا على هذه العبادات،"], [1653.0, "نسأل الله أن يُعيننا على هذه العبادات."]], "tr": [[1634.0, "Bilindiği gibi, Peygamber sallallâhu aleyhi ve sellem'den gece namazı hakkında mütevâtir olarak gelen, onu ancak evinde kıldığıdır;"], [1642.5, "onu yanındaki eşinden ya da yakınından başkası görmezdi."], [1648.4, "Allah'tan bu ibadetlerde bize yardım etmesini dileriz;"], [1652.4, "Allah'tan bu ibadetlerde bize yardım etmesini dileriz."]]}]}, {"ts": "27:36", "title": "6. Külliye: Rabbin kalpteki kadri ne kadar büyük olursa, kalbin halkı gözetmesi o kadar zayıflar", "paras": [{"reader": false, "ar": [[1656.0, "ومن الكلّيّات أيضًا: <b>كلّما عظُم قدرُ الربّ في القلب ضعُفت مطالعتُه للخلق.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [1669.1, "وهذا من أعظم ما يُعين القلوبَ على إخلاص العمل لله عز وجل."], [1690.0, "فإنّ صرفَ شيءٍ من التعبّدات لنظر الناس هذا دليلٌ على ضعف تقدير القلب لله عز وجل،"], [1700.0, "فيكون العبدُ داخلًا في قول الله عز وجل:"], [1703.0, "<span class=\"ayah\">﴿وَمَا قَدَرُوا اللَّهَ حَقَّ قَدْرِهِ﴾<\/span> <span class=\"ref\">[الزمر: ٦٧]<\/span>."]], "tr": [[1656.0, "Külliyelerden biri de şudur (<b>6. külliye<\/b>):"], [1661.7, "<b>Rabbin kalpteki kadri ne kadar büyük olursa, (kalbin) halkı gözetmesi o kadar zayıflar.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [1671.3, "Bu, kalplere ameli Allah Azze ve Celle için hâlis kılmada yardım eden şeylerin en büyüklerindendir."], [1692.2, "Çünkü ibadetlerden bir şeyi insanların bakışına yöneltmek, kalbin Allah Azze ve Celle'yi takdir etmesinin zayıflığına delildir."], [1699.6, "Böylece kul, Allah Azze ve Celle'nin şu sözünün kapsamına girer:"], [1702.6, "<span class=\"ayah\">﴿Onlar Allah'ı hakkıyla takdir edemediler.﴾<\/span> [Zümer 67]"]]}, {"reader": false, "ar": [[1707.0, "ولكنّ القلب الذي استقرّ فيه اليقينُ بالله،"], [1711.0, "وأدرك عظمةَ الله، واستشعر قُربَه عز وجل،"], [1714.0, "ورأى أنّ كلَّ الخير بيده وحده،"], [1718.0, "وأنّ رضاه هو الغايةُ العُليا؛"], [1721.0, "فحينئذٍ لا يمكن أبدًا أن يلتفت ذلك القلبُ لمطالعة شيءٍ من الخلق."], [1726.0, "ولذلك ينبغي أن تعظُم معرفةُ قلوبنا بهذا الربّ العظيم بمقتضى معرفته بأسمائه وصفاته."], [1735.0, "فإنّ عظمة الربّ متى ما استقرّت في قلب عبدٍ فإنّ الرغبة في ثناء الناس،"], [1741.8, "والرغبة في مدح الناس،"], [1744.0, "والرغبة في نظر الناس،"], [1746.0, "ومحبّة ثنائهم، كلُّ ذلك سوف يخرج ـ بإذن الله عز وجل ـ من القلب."]], "tr": [[1707.0, "Fakat içinde Allah'a yakînin yerleştiği, Allah'ın azametini idrak eden, O Azze ve Celle'nin yakınlığını hisseden, bütün hayrın yalnızca O'nun elinde olduğunu ve O'nun rızasının en yüce gaye olduğunu gören kalp;"], [1722.7, "işte o zaman o kalbin halktan bir şeyi gözetmeye yönelmesi asla mümkün olmaz."], [1729.3, "Bu yüzden kalplerimizin bu yüce Rabbi tanıması, O'nu isimleri ve sıfatlarıyla tanımanın gereğince büyümelidir."], [1737.2, "Çünkü Rabbin azameti bir kulun kalbine yerleştiğinde, insanların senasına rağbet, insanların övgüsüne rağbet, insanların bakışına rağbet ve onların senasını sevmek;"], [1750.3, "bunların hepsi Allah Azze ve Celle'nin izniyle kalpten çıkacaktır."]]}, {"reader": false, "ar": [[1753.0, "ولذلك كلّما عظُم قدرُ الربّ ضعُفت مطالعةُ القلب للخلق،"], [1758.0, "وكلّما ضعُفت معرفةُ الربّ كلّما عظُمت مطالعةُ الخلق،"], [1763.0, "فهو قياسٌ عكسيٌّ صحيح. والله أعلم."]], "tr": [[1753.0, "Bu yüzden Rabbin kadri ne kadar büyük olursa kalbin halkı gözetmesi o kadar zayıflar;"], [1758.0, "Rabbi tanıma ne kadar zayıflarsa halkı gözetme o kadar büyür."], [1762.0, "Bu, sahih bir ters orantıdır (aks kıyası). Allah en iyisini bilir."]]}]}, {"ts": "29:25", "title": "7. Külliye: Mahlûklarla ilişkiler kalpten kesildikçe kalbin maksadı yalnızca Hâlık'a has olur", "paras": [{"reader": false, "ar": [[1765.0, "الكلّيّة السابعة: <b>كلّما انقطعت عن القلب علائقُ الخلائق تمحّض قصدُه للخالق.<\/b> كلّما انقطعت عن القلب علائقُ الخلق تمحّض قصدُه للخالق."], [1790.0, "أقول وبالله التوفيق: وذلك لأنّ الإنسان لا يصرف شيئًا من أعماله لمطالعة الخلق إلا إذا كان يرجو منهم نفعًا أو استدفاعَ ضرّ."]], "tr": [[1765.0, "<b>7. külliye: Mahlûkların ilişkileri kalpten kesildikçe, (kalbin) maksadı yalnızca Hâlık'a has olur.<\/b> Halkın ilişkileri kalpten kesildikçe, maksadı yalnızca Hâlık'a has olur."], [1783.9, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [1798.0, "İnsan amellerinden bir şeyi, ancak onlardan bir fayda umuyor ya da bir zararın defedilmesini istiyorsa halkı gözetmeye yöneltir."]]}, {"reader": false, "ar": [[1805.0, "لكن إذا علم الإنسان بأنّ هذا المخلوق الذي صرف له شيئًا من عمله لا يملك له لا نفعًا ولا ضرًّا،"], [1814.2, "ولا ثوابًا ولا جنّةً ولا نارًا ولا عقابًا،"], [1819.0, "ولا موتًا ولا حياةً ولا نشورًا،"], [1822.0, "فلماذا يصرف شيئًا من عمله لمطالعته؟"], [1825.0, "فإذا استقرّ ضعفُ هذا المخلوق في قلبك فإنه لا يمكن أبدًا أن ينصرف قلبُك لمطالعته."], [1832.0, "فمهما مدحك الخلقُ أو ذمّك الخلق فإنّ ذلك ليس بمعيار القبول أو الردّ عند الله عز وجل."]], "tr": [[1805.0, "Fakat insan, amelinden bir şeyi kendisine yönelttiği bu mahlûkun ona ne bir fayda ne bir zarar, ne bir sevap, ne cennet, ne cehennem, ne bir ceza, ne ölüm, ne hayat, ne de diriliş verebileceğini bilirse, amelinden bir şeyi neden onu gözetmeye yöneltsin?"], [1824.5, "Bu mahlûkun acizliği kalbine yerleşirse, kalbinin onu gözetmeye yönelmesi asla mümkün olmaz."], [1829.7, "Halk seni ne kadar överse ya da ne kadar yererse yersin, bu Allah Azze ve Celle katında kabulün ya da reddin ölçüsü değildir."]]}, {"reader": false, "ar": [[1841.0, "فإني أُقسم بالله عز وجل أنه لو مدحك مَن بأقطارها لا ينفعك مدحُهم إذا كان مَن في السماء ساخطًا عليك،"], [1849.0, "وأنه إن ذمّك مَن بأقطارها فإنه لا يضرّك ذمُّهم إن كان مَن في السماء راضيًا عنك."], [1857.0, "فالذي مدحُه زَين وذمُّه شَين إنما هو الله تبارك وتعالى."], [1863.0, "وإني أحبّ أن أترك الكلامَ في هذه الكلّيّة للإمام ابن القيّم رحمه الله تعالى،"], [1869.6, "وهو طبيبُ القلوب. أسأل الله عز وجل أن ينفعنا بما نقول ونسمع."]], "tr": [[1841.0, "Allah Azze ve Celle'ye yemin ederim ki, (yeryüzünün) dört bir yanındakiler seni övse, gökte olan sana gazap ediyorsa onların övgüsü sana fayda vermez."], [1850.0, "(Yeryüzünün) dört bir yanındakiler seni yerse, gökte olan senden razıysa onların yergisi sana zarar vermez."], [1857.0, "Övgüsü süs (zinet), yergisi ayıp olan ancak Allah Tebâreke ve Teâlâ'dır."], [1863.5, "Bu külliyedeki sözü İmam İbnü'l-Kayyim'e —Allah ona rahmet etsin— bırakmak istiyorum;"], [1868.2, "o kalplerin tabibidir. Allah Azze ve Celle'den, söylediğimiz ve dinlediğimiz şeyle bize fayda vermesini dilerim."]]}, {"reader": false, "ar": [[1877.0, "قال الإمام ابن القيّم رحمه الله:"], [1879.0, "«لا يجتمع الإخلاصُ في القلب ومحبّةُ المدح والثناء من الخلق والطمعُ فيما عند الناس، إلا كما يجتمع الماءُ والنار، والضبُّ والحوت. فإذا حدّثتك نفسُك بطلب الإخلاص فأقبِل على الطمع» ـ أي الطمع في الخلق ـ «فأقبِل على الطمع أوّلًا فاذبحه بسكّين اليأس، وأقبِل على المدح والثناء فازهد فيهما زُهدَ عشّاق الدنيا في الآخرة»."], [1911.0, "ـ يعني: كما أنّ عشّاق الدنيا زاهدون في الآخرة،"], [1915.0, "فعليك أن تزهد في مدح الناس وثنائهم كزهد هؤلاء في الدار الآخرة ـ «فإذا استقام لك ذبحُ الطمع والزهدُ في الثناء والمدح سهُل عليك الإخلاص». سهُل عليك الإخلاص."]], "tr": [[1877.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [1879.0, "\"Kalpte ihlâs ile halkın övgüsünü ve senasını sevmek ve insanların elindekine tamah etmek, ancak su ile ateşin, keler ile balığın bir araya gelmesi gibi bir araya gelir."], [1893.4, "Nefsin sana ihlâsı talep etmekten söz ederse, önce tamaha yönel\" —yani halka tamaha— \"önce tamaha yönel ve onu ümitsizlik bıçağıyla boğazla;"], [1905.1, "övgüye ve senaya yönel ve dünya âşıklarının âhirete karşı zühdü gibi onlara karşı zühd göster.\" —Yani dünya âşıkları âhirete nasıl ilgisizse, sen de insanların övgüsüne ve senasına, bunların âhiret yurduna ilgisizliği gibi ilgisiz olmalısın.— \"Tamahı boğazlamak ve senaya, övgüye karşı zühd sende yerleşirse, ihlâs sana kolay gelir.\" İhlâs sana kolay gelir."]]}, {"reader": false, "ar": [[1933.0, "«فإن قلتَ» ـ والكلامُ لابن القيّم ـ «فإن قلتَ: وما الذي يسهّل عليّ ذبحَ الطمع والزهدَ في الثناء والمدح؟» أجاب بقوله:"], [1948.0, "«قلتُ: أمّا ذبحُ الطمع فيسهّله عليك علمُك يقينًا أنه ليس من شيءٍ يُطمع فيه» ـ أي من هؤلاء الخلق ـ «إلا وبيد الله وحده خزائنُه، لا يملكها غيرُه، ولا يؤتي العبدَ منها شيئًا سواه»."]], "tr": [[1933.0, "\"Eğer dersen ki\" —söz İbnü'l-Kayyim'indir— \"Eğer dersen ki:"], [1936.0, "Tamahı boğazlamayı ve senaya, övgüye karşı zühdü bana kolaylaştıracak olan nedir?\" Şu sözüyle cevap verdi:"], [1948.0, "\"Derim ki: Tamahı boğazlamayı sana kolaylaştıracak olan, tamah edilen hiçbir şeyin\" —yani bu mahlûklardan— \"bulunmadığını, ancak onun hazinelerinin yalnızca Allah'ın elinde olduğunu, O'ndan başkasının onlara sahip olmadığını ve O'ndan başkasının kula onlardan bir şey vermediğini kesin olarak bilmendir.\""]]}, {"reader": false, "ar": [[1973.0, "فكلّ ـ قلتُ يعني من باب التعليق فقط ـ يعني أنه إذا كنتَ تريد مدحَ هؤلاء فعند الله؛"], [1981.0, "فمدحُ الله أعظم. وإذا كنتَ تريد منصبًا من هؤلاء،"], [1985.0, "فما أعدّه الله لك في الجنة من النعيم المقيم والسرمديّ أعظمُ بكثير."], [1990.0, "فهذا من أعظم ما يُعين العبدَ على قطع الطمع."]], "tr": [[1973.0, "Her— Bunu sadece bir açıklama (ta'lik) olarak söylüyorum— yani bunların övgüsünü istiyorsan, o Allah katındadır;"], [1980.5, "Allah'ın övgüsü daha büyüktür. Bunlardan bir makam istiyorsan, Allah'ın sana cennette hazırladığı kalıcı ve ebedî nimet çok daha büyüktür."], [1988.7, "İşte bu, kula tamahı kesmede yardım eden şeylerin en büyüklerindendir."]]}, {"reader": false, "ar": [[1994.0, "بقينا في الإشكال الثاني:"], [1996.0, "الزهدُ في الثناء والمدح."], [1998.0, "قال رحمه الله: «وأمّا الزهدُ في الثناء والمدح فيسهّله عليك علمُك أنه ليس أحدٌ ينفع مدحُه ويَزين، ويضرّ ذمُّه ويَشين، إلا الله وحده، كما قال ذلك الأعرابيّ للنبيّ صلى الله عليه وسلم: إنّ مدحي زَين وذمّي شَين، فقال النبيّ صلى الله عليه وسلم: ذلك الله عز وجل. فازهد في مدح من لا يَزينك مدحُه، وفي ذمّ من لا يَشينك ذمُّه، وارغب في مدح من كلُّ الزَّين في مدحه وكلُّ الشَّين في ذمّه."]], "tr": [[1994.0, "İkinci müşkil kaldı: Senaya ve övgüye karşı zühd."], [1997.5, "(İbnü'l-Kayyim) —Allah ona rahmet etsin— şöyle dedi:"], [2000.5, "\"Senaya ve övgüye karşı zühdü sana kolaylaştıracak olan, övgüsü fayda veren ve süsleyen, yergisi zarar veren ve ayıplayan kimsenin yalnızca Allah olduğunu bilmendir."], [2014.7, "Nitekim o bedevi Peygamber sallallâhu aleyhi ve sellem'e 'Benim övgüm süstür, yergim ayıptır' dedi;"], [2022.4, "Peygamber sallallâhu aleyhi ve sellem de 'O, Allah Azze ve Celle'dir' buyurdu."], [2027.4, "Öyleyse övgüsü seni süslemeyenin övgüsüne ve yergisi seni ayıplı kılmayanın yergisine karşı zâhid ol;"], [2036.0, "bütün süsün övgüsünde, bütün ayıbın yergisinde olduğu Zât'ın övgüsüne rağbet et."]]}, {"reader": false, "ar": [[2044.0, "ولن يُقدَر على ذلك إلا بالصبر واليقين،"], [2050.0, "فمتى فقدتَ الصبرَ واليقين كنتَ كمن أراد السفرَ في البحر من غير مركب."], [2058.0, "قال الله تبارك وتعالى:"], [2059.6, "<span class=\"ayah\">﴿فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ ۖ وَلَا يَسْتَخِفَّنَّكَ الَّذِينَ لَا يُوقِنُونَ﴾<\/span> <span class=\"ref\">[الروم: ٦٠]<\/span>."], [2065.0, "وقال الله تعالى: <span class=\"ayah\">﴿وَجَعَلْنَا مِنْهُمْ أَئِمَّةً يَهْدُونَ بِأَمْرِنَا لَمَّا صَبَرُوا ۖ وَكَانُوا بِآيَاتِنَا يُوقِنُونَ﴾<\/span> <span class=\"ref\">[السجدة: ٢٤]<\/span>». انتهى كلامه."]], "tr": [[2044.0, "Buna ancak sabır ve yakîn ile güç yetirilir."], [2048.5, "Sabrı ve yakîni kaybettiğinde, gemisiz denizde yolculuk etmek isteyen kimse gibi olursun."], [2055.2, "Allah Tebâreke ve Teâlâ şöyle buyurmuştur:"], [2058.0, "<span class=\"ayah\">﴿Sabret! Şüphesiz Allah'ın vaadi haktır. Kesin inanmayanlar sakın seni hafifliğe sürüklemesin.﴾<\/span> [Rûm 60] Allah Teâlâ şöyle buyurmuştur:"], [2064.4, "<span class=\"ayah\">﴿Sabrettikleri ve âyetlerimize kesin olarak inandıkları için onların içinden, emrimizle doğru yolu gösteren önderler kıldık.﴾<\/span> [Secde 24]\" Sözü burada bitti."]]}]}, {"ts": "34:33", "title": "8. Külliye: Açığa vurulmasında hâlis ya da râcih bir maslahat bulunan ibadetin açığa vurulması meşrudur", "paras": [{"reader": false, "ar": [[2073.0, "ومن الكلّيّات أيضًا، الكلّيّة الثامنة:"], [2078.0, "<b>كلُّ ما في إظهاره مصلحةٌ خالصةٌ أو راجحةٌ فالمشروعُ إظهارُه.<\/b> كلُّ ما في إظهاره مصلحةٌ خالصةٌ أو راجحةٌ فالمشروعُ إظهاره."], [2089.0, "كلُّ ما في إظهاره ـ أي من العبادات أقصد ـ مصلحةٌ خالصةٌ أو راجحةٌ فالمشروعُ إظهاره."]], "tr": [[2073.0, "Külliyelerden biri de 8. külliyedir:"], [2076.0, "Açığa vurulmasında hâlis ya da râcih (ağır basan) bir maslahat bulunan her şeyin açığa vurulması meşrudur. Açığa vurulmasında hâlis ya da râcih bir maslahat bulunan her şeyin açığa vurulması meşrudur."], [2089.7, "Açığa vurulmasında —ibadetlerden olanı kastediyorum— hâlis ya da râcih bir maslahat bulunan her şeyin açığa vurulması meşrudur."]]}, {"reader": false, "ar": [[2100.0, "أقول وبالله التوفيق: لا جرمَ أنّ الأصل هو إخفاءُ الأعمال كما قرّرتُه لكم سابقًا،"], [2107.1, "ولكنّي استثنيتُ من هذا الإخفاء أمرين:"], [2111.0, "الأمر الأوّل: إذا أوجب الشارعُ أو استحبّ إظهارَ هذا العمل،"], [2115.0, "فحينئذٍ لا ينبغي إخفاؤه ما دام الشارعُ قد شرع إظهارَه."], [2122.0, "وهذه الكلّيّة في الأمر الثاني:"], [2125.0, "وهي إذا اقتضت المصلحةُ إظهارَ ما شُرع إخفاؤه أصالةً؛"], [2130.0, "لأنّ المصلحة الراجحة أو الخالصة تقتضي إظهارَه،"], [2136.0, "فحينئذٍ يُستحبّ إظهارُ العمل لهذه المصلحة."]], "tr": [[2100.0, "Tevfik Allah'tandır, derim ki: Şüphesiz, daha önce size takrir ettiğim gibi asıl olan amelleri gizlemektir."], [2106.1, "Ancak bu gizlemeden iki şeyi istisna ettim."], [2109.0, "Birinci husus: Şâri' bu amelin açığa vurulmasını vâcip ya da müstehap kılarsa, bu durumda Şâri' onun açığa vurulmasını meşru kıldığı sürece onu gizlemek uygun olmaz."], [2119.3, "Bu külliye ikinci husus hakkındadır:"], [2122.6, "O da maslahatın, aslen gizlenmesi meşru kılınan şeyin açığa vurulmasını gerektirmesidir;"], [2127.8, "çünkü râcih ya da hâlis maslahat onun açığa vurulmasını gerektirir."], [2133.0, "Bu durumda bu maslahat için amelin açığa vurulması müstehap olur."]]}, {"reader": false, "ar": [[2140.0, "فإخفاءُ الأعمال الصالحة ـ وإن كان خيرًا من إظهارها ـ إلا أنّ هذه الخيريّة لا يقتضي أن تكون دائمًا في كلّ زمانٍ أو مكانٍ أو حال،"], [2152.0, "فقد يقتضي بعضُ الأزمنة أو بعضُ الأمكنة أو بعضُ الأحوال أنّ الخيريّة تنقلب من الإخفاء إلى الإعلان."], [2163.0, "وذلك إذا كان في الإظهار مصلحةٌ خالصةٌ أو راجحة،"], [2171.0, "كمصلحة الاقتداء به، أو مصلحة التعليم،"], [2175.2, "أو مصلحة تنشيط النفوس وأزِّها،"], [2180.7, "وبعثِ الهمم والعزائم على أعمال الخير."]], "tr": [[2140.0, "Sâlih amelleri gizlemek, onları açığa vurmaktan daha hayırlı olsa da, bu hayırlılık her zaman, her mekânda ve her hâlde sürekli olmayı gerektirmez."], [2151.1, "Bazı zamanlar, bazı mekânlar ya da bazı hâller, hayırlılığın gizlilikten açıklığa dönmesini gerektirebilir."], [2158.7, "Bu da açığa vurmada hâlis ya da râcih bir maslahat bulunduğu zamandır:"], [2167.3, "Kendisine uyulması maslahatı, öğretim maslahatı ya da nefisleri canlandırma ve harekete geçirme, gayretleri ve azimleri hayır amellerine yöneltme maslahatı gibi."]]}, {"reader": false, "ar": [[2185.0, "ولذلك قال الإمام ابن حجر رحمه الله تعالى:"], [2190.0, "«قد يُستحبّ إظهارُ العمل الصالح ممّن يُقتدى به، ويُقدَّر ذلك بقدر الحاجة. قال ابن عبد السلام رحمه الله تعالى: يُستثنى من إخفاء العمل من يُظهره ليُقتدى به، أو ليُنتفع به ككتابة العلم، ومنه حديث: لتأتمّوا بي ولتعلّموا صلاتي»."], [2219.3, "انتهى كلامه. قلتُ: ويقصد ما في الصحيحين من حديث سهل بن سعد رضي الله عنه لمّا صلّى النبيّ صلى الله عليه وسلم على المنبر،"], [2229.0, "قال: «إنما فعلتُ ذلك لتأتمّوا بي ولتعلّموا صلاتي»."]], "tr": [[2185.0, "Bu yüzden İmam İbn Hacer —Allah ona rahmet etsin— şöyle demiştir:"], [2190.0, "\"Kendisine uyulan kimsenin sâlih ameli açığa vurması müstehap olabilir;"], [2194.8, "bu da ihtiyaç ölçüsünde takdir edilir."], [2201.0, "İbn Abdisselâm —Allah ona rahmet etsin— şöyle demiştir:"], [2205.6, "Ameli gizlemekten, ona uyulsun diye ya da ilmi yazmak gibi ondan faydalanılsın diye onu açığa vuran kimse istisna edilir."], [2216.4, "'Bana uyasınız ve namazımı öğrenesiniz diye' hadisi de bu kabildendir.\" Sözü burada bitti."], [2222.2, "Derim ki: Bununla Sahîhayn'de Sehl b."], [2223.8, "Sa'd radıyallâhu anh hadisinde geçeni kastediyor:"], [2225.4, "Peygamber sallallâhu aleyhi ve sellem minberin üzerinde namaz kıldığında şöyle buyurmuştu:"], [2229.0, "\"Bunu ancak bana uyasınız ve namazımı öğrenesiniz diye yaptım.\""]]}, {"reader": false, "ar": [[2233.0, "قال الإمام الطبريّ رحمه الله تعالى:"], [2237.0, "«كان ابن عمر وابن مسعود وجماعةٌ من السلف يتهجّدون في مساجدهم، ويتظاهرون بمحاسن أعمالهم ليُقتدى بهم. فمن كان إمامًا يُستنّ بعلمه، عالمًا بما لله عليه، قاهرًا لشيطانه، استوى ما ظهر من عمله وما خفي لصحّة قصده، وما كان بخلاف ذلك فالإخفاءُ في حقّه أفضل. وعلى ذلك جرى عملُ السلف»."]], "tr": [[2233.0, "İmam Taberî —Allah ona rahmet etsin— şöyle demiştir:"], [2237.0, "\"İbn Ömer, İbn Mes'ûd ve selefin bir topluluğu mescitlerinde teheccüd kılarlar ve kendilerine uyulsun diye amellerinin güzelliklerini açığa vururlardı."], [2246.4, "Kim ilmiyle yol tutulan bir imam olur, Allah'ın kendisi üzerindeki hakkını bilir ve şeytanına galip gelirse, kastının sıhhati sebebiyle amelinin açıkta olanı da gizli olanı da eşit olur."], [2263.0, "Bunun aksi durumda olan kimse için ise gizlemek daha faziletlidir."], [2266.5, "Selefin ameli de bunun üzerine cereyan etmiştir.\""]]}, {"reader": false, "ar": [[2270.0, "فمن الأوّل ـ أي الإظهار للاقتداء ـ في حديث أنس قال:"], [2275.4, "«سمع النبيّ صلى الله عليه وسلم رجلًا يقرأ يرفع صوتَه بالذكر، فقال: إنه أوّاب. قال: فإذا هو المقدادُ بن الأسود»."], [2287.0, "ومن الثاني ـ أي الإخفاء في نفس القضيّة ـ حديثُ أبي هريرة رضي الله عنه قال:"], [2295.7, "«قام رجلٌ يصلّي فجهر بالقراءة، فقال له النبيّ صلى الله عليه وسلم: لا تُسمعني وأسمِع ربَّك». وكلا الحديثين حسن."]], "tr": [[2270.0, "Birincisinden —yani uyulsun diye açığa vurmaktan— Enes hadisi vardır;"], [2274.4, "dedi ki: \"Peygamber sallallâhu aleyhi ve sellem bir adamın sesini zikirle yükselterek okuduğunu işitti ve 'O, (Allah'a) çokça yönelen biridir' buyurdu."], [2284.0, "(Enes) dedi ki: Bir de baktık ki o Mikdâd b."], [2288.4, "el-Esved'dir.\" İkincisinden —yani aynı meselede gizlemekten— Ebû Hüreyre radıyallâhu anh hadisi vardır;"], [2294.5, "dedi ki: \"Bir adam namaza kalktı ve kıraati sesli yaptı."], [2299.4, "Peygamber sallallâhu aleyhi ve sellem ona 'Bana duyurma, Rabbine duyur' buyurdu.\" Her iki hadis de hasendir."]]}, {"reader": false, "ar": [[2306.0, "وقال الإمام ابن كثير رحمه الله تعالى:"], [2310.0, "«قوله: <span class=\"ayah\">﴿وَإِن تُخْفُوهَا وَتُؤْتُوهَا الْفُقَرَاءَ فَهُوَ خَيْرٌ لَّكُمْ﴾<\/span> <span class=\"ref\">[البقرة: ٢٧١]<\/span> فيه دلالةٌ على أنّ إسرارَ الصدقة أفضلُ من إظهارها؛ لأنه أبعدُ عن الرياء، إلا أن يترتّب على الإظهار مصلحةٌ راجحة من اقتداء الناس به، فيكون أفضلَ من هذه الحيثيّة، كما قال النبيّ صلى الله عليه وسلم: الجاهرُ بالقرآن كالجاهر بالصدقة، والمُسِرّ بالقرآن كالمُسِرّ بالصدقة. وإن كان الأصلُ أنّ الإسرار أفضل»."], [2343.3, "انتهى كلامه رحمه الله تعالى."]], "tr": [[2306.0, "İmam İbn Kesîr —Allah ona rahmet etsin— şöyle demiştir:"], [2309.4, "\"<span class=\"ayah\">﴿Eğer onları gizler de fakirlere verirseniz, bu sizin için daha hayırlıdır.﴾<\/span> [Bakara 271] sözünde, sadakayı gizlemenin onu açığa vurmaktan daha faziletli olduğuna delâlet vardır;"], [2318.0, "çünkü (gizlemek) riyâdan daha uzaktır."], [2321.0, "Ancak açığa vurmaya, insanların ona uyması gibi râcih bir maslahat terettüp ederse, bu yönden (açığa vurmak) daha faziletli olur."], [2328.8, "Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2331.7, "'Kur'an'ı açıktan okuyan, sadakayı açıktan veren gibidir;"], [2335.2, "Kur'an'ı gizli okuyan, sadakayı gizli veren gibidir.' Ancak asıl olan, gizlemenin daha faziletli olmasıdır.\" Sözü burada bitti; Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2346.0, "قال الإمام الطِّيبيّ رحمه الله تعالى:"], [2351.0, "«جاء آثارٌ بفضيلة الجهر بالقرآن، وآثارٌ بفضيلة الإسرار به»."], [2357.0, "أُعيدها مرّةً أخرى وانتبهوا:"], [2359.0, "«جاء آثارٌ بفضيلة الجهر بالقرآن، وآثارٌ بفضيلة الإسرار به. والجمعُ بأن يقال: الإسرارُ أفضلُ لمن يخاف الرياء، والجهرُ أفضلُ لمن لا يخافه، بشرط أن لا يؤذيَ غيرَه من مصلٍّ أو نائمٍ أو غيرهما. وذلك لأنّ العمل في الجهر يتعدّى نفعُه إلى غيره، أي من استماعٍ أو تعلّمٍ أو ذوقٍ أو كونه شعارًا للدين، ولأنه يوقظ قلبَ القارئ، ويجمع همّتَه، ويطرد النومَ عنه، وينشّط غيرَه للعبادة. فمتى حضره شيءٌ من هذه النيّات فالجهرُ أفضل»."], [2401.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[2346.0, "İmam Tîbî —Allah ona rahmet etsin— şöyle demiştir:"], [2351.0, "\"Kur'an'ı açıktan okumanın faziletine dair rivayetler de, onu gizli okumanın faziletine dair rivayetler de gelmiştir.\" Bir kez daha tekrar ediyorum, dikkat edin:"], [2361.1, "\"Kur'an'ı açıktan okumanın faziletine dair rivayetler de, onu gizli okumanın faziletine dair rivayetler de gelmiştir."], [2369.1, "(Bunlar arasında) cem' şöyle denilerek yapılır:"], [2372.0, "Riyâdan korkan için gizli okumak daha faziletlidir;"], [2374.5, "ondan korkmayan için ise —namaz kılan, uyuyan ya da başka birine eziyet vermemek şartıyla— açıktan okumak daha faziletlidir."], [2381.2, "Bu şundandır: Açıktan okumada amelin faydası başkasına geçer;"], [2384.1, "yani dinleme, öğrenme, (tad alma) zevk ya da dinin bir şiarı olması yönünden."], [2389.0, "Ayrıca açıktan okumak okuyanın kalbini uyandırır, gayretini toplar, uykuyu ondan uzaklaştırır ve başkasını ibadete şevklendirir."], [2397.0, "Bu niyetlerden biri kendisinde hazır olduğunda açıktan okumak daha faziletlidir.\" Sözü burada bitti; Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2406.0, "فإن قلتَ: وهل يدخل في ذلك أن أتحدّث بالنِّعم التي أنعم الله عز وجل بها عليّ؟"], [2413.0, "فإذا أنعم الله عليّ شيئًا من النِّعم،"], [2418.0, "فهل من الجهر بها أن أتحدّث بها،"], [2421.8, "أو أنّ الأفضل أن أخفيَها وأُسِرّ؟"], [2425.0, "فأقول: الجواب: إذا كان التحدّثُ بنعمة الله عز وجل من باب نسبة الفضل ـ انتبه ـ من باب نسبة الفضل إلى الله عز وجل،"], [2436.0, "والإقرارِ بمنّته على عبده،"], [2438.3, "وأنه الجوادُ الكريم، أو حدّث بها لأنه إمامٌ يُقتدى به في فعله حتى يكون داعيةً لغيره،"], [2454.0, "فيكون له أجرُه وأجرُ من عمل بدعوته لهذا العمل المستحبّ؛"], [2460.0, "فلا جرمَ أنّ هذا لا بأس بالجهر به."]], "tr": [[2406.0, "Eğer \"Allah Azze ve Celle'nin bana verdiği nimetleri anlatmam buna girer mi?"], [2410.8, "Allah bana nimetlerden birini verdiğinde, onları açığa vurmaktan sayılarak onları anlatmam mı, yoksa onları gizleyip saklamam mı daha faziletlidir?\" dersen, derim ki:"], [2422.3, "Cevap şudur: Allah Azze ve Celle'nin nimetini anlatmak, fazlı —dikkat et— fazlı Allah Azze ve Celle'ye nispet etmek, O'nun kuluna olan lütfunu ve O'nun cömert, kerim olduğunu ikrar etmek kabilinden olursa;"], [2437.1, "ya da fiilinde kendisine uyulan bir imam olduğu için, başkasına davetçi olsun diye onu anlattıysa ve böylece hem kendi ecri hem de bu müstehap amele yaptığı davetle amel edenin ecri onun olacaksa;"], [2460.6, "şüphesiz bunu açığa vurmakta bir sakınca yoktur."]]}, {"reader": false, "ar": [[2465.0, "وأمّا إن كان يجهر بنعمة الله عز وجل من باب تزكية النفس،"], [2474.0, "أو من باب نسبة الفضل إليها،"], [2477.0, "أو من باب المراءاة وتسميع الناس بالعمل،"], [2481.0, "أو من باب كسب الجاه والمنزلة بما له من الطاعات،"], [2485.0, "ونحو ذلك، فلا جرمَ أنّ هذا أمرٌ مذمومٌ مقبوح."], [2490.0, "فمتى ما كان التحدّث بنعمة الله من باب إظهار الفضل والنعمة أو الاقتداء فلا بأس به،"], [2500.0, "وإن كان من باب التسميع والرياء فإنه لا يجوز."], [2505.0, "ولذلك قال النبيّ… ولا،"], [2506.8, "سيأتينا إن شاء الله."]], "tr": [[2465.0, "Ama Allah Azze ve Celle'nin nimetini nefsini temize çıkarmak, fazlı nefsine nispet etmek, gösteriş yapmak ve ameli insanlara duyurmak ya da sahip olduğu itaatlerle itibar ve mevki kazanmak ve benzeri amaçlarla açığa vuruyorsa, şüphesiz bu kınanmış, çirkin bir iştir."], [2487.8, "Allah'ın nimetini anlatmak fazlı ve nimeti açığa vurmak ya da kendisine uyulması kabilinden olduğunda bunda bir sakınca yoktur;"], [2499.4, "tesmî' ve riyâ kabilinden olursa caiz değildir."], [2503.3, "Bu yüzden Peygamber buyurdu ki… Hayır, (bu) inşallah ileride gelecek."]]}]}, {"ts": "41:45", "title": "9. Külliye: Kulun kastı olmadan övüldüğü amel, onun peşin müjdesidir", "paras": [{"reader": false, "ar": [[2507.3, "ومن الكلّيّات أيضًا ـ كلّيّةٌ طيّبة ـ:"], [2511.0, "<b>كلُّ عملٍ مُدح عليه العبدُ بلا قصدٍ منه فتلك عاجلُ بُشراه.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثانية:"], [2541.0, "<b>كلُّ عملٍ مُدح عليه العبدُ بلا قصدٍ منه فتلك عاجلُ بُشراه.<\/b>"]], "tr": [[2507.3, "Külliyelerden biri de —güzel bir külliye— şudur (<b>9. külliye<\/b>):"], [2511.7, "<b>Kulun, kendi kastı olmadan üzerine övüldüğü her amel, işte bu onun peşin müjdesidir.<\/b> (Tekrar ediyor.) İkinci kez tekrar ediyorum:"], [2541.5, "<b>Kulun, kendi kastı olmadan üzerine övüldüğü her amel, işte bu onun peşin müjdesidir.<\/b>"]]}, {"reader": false, "ar": [[2547.0, "أقول وبالله التوفيق: وبرهانُ هذه القاعدة ما أخرجه الإمام مسلم في صحيحه من حديث أبي ذرّ رضي الله عنه قال:"], [2558.4, "«قيل: يا رسول الله، أرأيتَ الرجلَ يعمل العملَ من الخير ويحمده الناسُ عليه؟ قال: تلك عاجلُ بُشرى المؤمن»."], [2573.0, "فإذا عمل المسلمُ عملًا فأثنى الناسُ عليه،"], [2576.0, "ثم علم من قصده وقلبه أنه لم يكن يقصد هذا المدحَ والثناء،"], [2585.0, "وإنما شيءٌ أجراه الله عز وجل في كونه من غير قصدٍ منه،"], [2590.0, "فلا ينبغي أن يرجع على نفسه بالتهمة،"], [2594.5, "أو على عمله بالإبطال،"], [2597.0, "وإنما يحمد الله عز وجل ويشكره على ذلك."]], "tr": [[2547.0, "Tevfik Allah'tandır, derim ki: Bu kaidenin delili, İmam Müslim'in Sahîh'inde Ebû Zer radıyallâhu anh hadisinden rivayet ettiği şu hadistir;"], [2556.9, "dedi ki: \"'Ey Allah'ın Resûlü!"], [2558.8, "Hayırdan bir amel işleyen ve insanların bundan dolayı kendisini övdüğü adam hakkında ne dersin?' denildi."], [2570.6, "Buyurdu ki: 'Bu, müminin peşin müjdesidir.'\" Müslüman bir amel işler, insanlar onu över, sonra o da kastından ve kalbinden bu övgüyü ve senayı kastetmediğini, bunun Allah Azze ve Celle'nin, kendi kastı olmadan kâinatında cereyan ettirdiği bir şey olduğunu bilirse;"], [2590.6, "nefsini itham etmeye ya da amelini iptal etmeye dönmemeli, aksine bundan dolayı Allah Azze ve Celle'ye hamd ve şükretmelidir."]]}, {"reader": false, "ar": [[2602.0, "فإنّ ذلك من الفضل الذي أراد الله عز وجل بإرادته الشرعيّة أن يُظهره ـ أن يُظهره للناس ـ لحكمةٍ يعلمها من عبده."], [2613.0, "حتى وإن فرح بثناء الناس بعد ذلك من باب الفرح بفضل الله،"], [2618.0, "فإنّ فرحه واستبشارَه بثناء الناس على عمله من باب شكر الله على ذلك،"], [2624.0, "فإنّ ذلك لا يُبطله ولا يضرّه،"], [2628.0, "كما قال الله عز وجل:"],
