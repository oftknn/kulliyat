<script>
const D={"no": 3, "vid": "Z_kTaKQ7mKM", "title_ar": "الدرس (٣) من شرح كليات العقيدة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 3. Ders: İtikadın Kaygan Zeminleri, İslâm ve Ümmet, Hadislerle İtikad", "sections": [{"ts": "00:00", "title": "19. Külliye: Vâcip olan inançtan her sapma, ölçüsünce ilhaddır", "paras": [{"reader": true, "ar": [[0.0, "أحسن الله إليكم. القاعدة التاسعة عشرة ـ أو الكلية التاسعة عشرة:"], [6.6, "كلُّ ميلٍ عمّا يجب اعتقادُه فإلحادٌ بحسبه."]], "tr": [[0.0, "Allah size iyilik etsin. On dokuzuncu kaide, ya da on dokuzuncu külliye:"], [5.9, "İnanılması vâcip olan şeyden her sapma, kendi ölçüsünce ilhaddır."]]}, {"reader": false, "ar": [[13.0, "الحمد لله رب العالمين،"], [14.8, "والصلاة والسلام على رسول الله الأمين،"], [17.5, "وبعد: هذه الكلية تُبيّن لك محذورًا من محاذير الاعتقاد؛"], [23.1, "فإن محاذير الاعتقاد متعدّدة،"], [25.7, "ومنها الإلحاد. فالإلحاد من جملة المحاذير التي حذّرنا الله عز وجل منها في كتابه،"], [32.0, "وحذّرنا منها نبيُّنا ﷺ وصحابتُه الكرام وسلفُنا الصالح إلى يومنا هذا،"], [42.0, "وأهل السنة لا يزالون يحذّرون من هذا المزلق العقدي الخطير المسمّى بالإلحاد."]], "tr": [[13.0, "Âlemlerin Rabbi Allah'a hamd, Allah'ın emin Resûlü'ne salât ve selâm olsun."], [18.0, "Bundan sonra: Bu külliye sana itikadın sakıncalarından birini açıklıyor."], [23.8, "İtikadın sakıncaları çoktur; bunlardan biri de ilhaddır."], [27.8, "İlhad, Allah Teâlâ'nın Kitabı'nda bizi sakındırdığı, Peygamberimiz ﷺ'in, onun değerli sahabesinin ve selef-i sâlihînimizin bugüne kadar bizi sakındırdığı sakıncalardandır."], [41.3, "Ehl-i Sünnet de ilhad denen bu tehlikeli itikadî kaygan zeminden sakındırmaya devam etmektedir."]]}, {"reader": false, "ar": [[50.0, "فإن قيل لك: وما الإلحاد لغةً؟"], [54.1, "فقل: الإلحاد لغةً هو الميل."], [61.0, "فإن قيل لك: وما الإلحاد اصطلاحًا؟"], [67.0, "فقل: هو الميل عمّا يجب اعتقاده."], [74.0, "فكلُّ من مال عمّا يجب اعتقاده فإنه يقال له: ملحد."]], "tr": [[50.0, "Sana \"İlhad sözlükte nedir?\" denirse de ki:"], [54.8, "İlhad sözlükte meyletmek, sapmaktır. Sana \"İlhad ıstılahta nedir?\" denirse de ki:"], [68.5, "İnanılması vâcip olan şeyden sapmaktır."], [74.8, "İnanılması vâcip olan şeyden sapan herkese \"mülhid\" denir."]]}, {"reader": false, "ar": [[91.0, "فإن قيل لك: وما أقسام الإلحاد؟"], [97.0, "وما أقسام الإلحاد؟ فقل:"], [100.8, "ينقسم الإلحاد إلى قسمين:"], [105.0, "إلى مطلق الإلحاد، والإلحاد المطلق."], [113.0, "فإن قيل لك: وماذا تقصد بقولك:"], [129.4, "مطلق الإلحاد؟ وماذا تقصد بقولك:"], [135.4, "مطلق الإلحاد؟ فقل: أي مطلق الميل عمّا يجب اعتقاده،"], [144.0, "أي مطلق الميل عمّا يجب اعتقاده."]], "tr": [[91.0, "Sana \"İlhadın kısımları nelerdir? İlhadın kısımları nelerdir?\" denirse de ki:"], [98.9, "İlhad iki kısma ayrılır: mutlak-ı ilhad (ilhadın herhangi bir derecesi) ve ilhad-ı mutlak (mutlak, tam ilhad)."], [114.9, "Sana \"Mutlak-ı ilhad sözünle neyi kastediyorsun?"], [130.2, "Mutlak-ı ilhad sözünle neyi kastediyorsun?\" denirse de ki:"], [139.7, "İnanılması vâcip olan şeyden herhangi bir sapmayı;"], [144.0, "inanılması vâcip olan şeyden herhangi bir sapmayı."]]}, {"reader": false, "ar": [[148.0, "فالذين يحرّفون أسماء الله عز وجل ملاحدةٌ باعتبار تحريفهم وتعطيلهم،"], [159.0, "لأنهم مالوا عمّا يجب اعتقاده في أسماء الله عز وجل."], [164.0, "والذين يعطّلون صفات الله عز وجل ملاحدةٌ في باب الصفات،"], [171.0, "لأنهم مالوا عن الاعتقاد الصحيح في باب الأسماء والصفات."], [176.0, "والذين يُلحدون في باب الإيمان،"], [184.0, "فيقولون بأن العمل خارجٌ عن دائرة الإيمان ـ كالمرجئة ـ فهم ملاحدةٌ في هذا الباب،"], [192.0, "لأنهم مالوا عن الاعتقاد الواجب فيه."]], "tr": [[148.0, "Allah Teâlâ'nın isimlerini tahrif edenler, tahrif ve ta'tilleri itibarıyla mülhidlerdir;"], [159.0, "çünkü Allah Teâlâ'nın isimleri hakkında inanılması vâcip olan şeyden saptılar."], [164.7, "Allah Teâlâ'nın sıfatlarını ta'til edenler sıfatlar babında mülhidlerdir;"], [170.3, "çünkü isim ve sıfatlar babında sahih inançtan saptılar."], [175.4, "İman babında ilhad edip, Mürcie gibi, amelin imanın dairesi dışında olduğunu söyleyenler de bu babda mülhidlerdir;"], [191.2, "çünkü bu babda vâcip olan inançtan saptılar."]]}, {"reader": false, "ar": [[197.0, "والذين يُنكرون عذابَ القبر وسؤالَه ونعيمَه ملاحدةٌ في هذا الباب."], [206.0, "والذين يقولون ـ والذين ينفون قدرةَ العبد في باب القضاء والقدر ملاحدةٌ في هذا الباب."], [216.0, "وكلُّ من مال عن شيءٍ من الاعتقاد الواجب فإنه ملحدٌ بقدر ميله؛"], [223.0, "فمن الناس من يميل ثلاثين في المئة،"], [227.0, "ومن الناس من يميل خمسين في المئة،"], [230.0, "ومن الناس من يميل سبعين في المئة أو ثمانين في المئة؛"], [236.0, "فهذا يسمّى مطلقَ الإلحاد، أي بعضه."]], "tr": [[197.0, "Kabir azabını, kabir sualini ve kabir nimetini inkâr edenler bu babda mülhidlerdir."], [208.1, "Kaza ve kader babında kulun kudretini nefyedenler de bu babda mülhidlerdir."], [216.5, "Vâcip olan inançtan herhangi bir şeyden sapan herkes, sapması ölçüsünde mülhiddir."], [223.6, "İnsanlardan kimi yüzde otuz sapar, kimi yüzde elli sapar, kimi yüzde yetmiş ya da yüzde seksen sapar."], [233.4, "İşte buna mutlak-ı ilhad, yani ilhadın bir kısmı denir."]]}, {"reader": false, "ar": [[240.0, "وأما القسم الثاني فهو الإلحاد المطلق،"], [243.9, "وهو تعطيلُ وجود الله عز وجل جملةً وتفصيلًا؛"], [249.0, "فكلُّ من عطّل هذا الكون عن خالقه ومبدعه فعنده الإلحاد المطلق،"], [256.1, "أي التامّ الكامل، فليس بعد هذا الإلحاد إلحاد."], [260.0, "فأعظمُ صورةٍ من صور الإلحاد التي تجمع كلياتِه وجزئياتِه هي إنكارُ وجود الله،"], [269.0, "فيقول: الله ليس بموجود، والعياذ بالله."]], "tr": [[240.0, "İkinci kısım ise ilhad-ı mutlaktır;"], [242.6, "bu da Allah Teâlâ'nın varlığını toptan ve ayrıntılı olarak ta'til etmektir (inkâr etmektir)."], [249.0, "Bu kâinatı yaratıcısından ve onu yoktan var edenden yoksun sayan herkeste ilhad-ı mutlak, yani tam ve kâmil ilhad vardır;"], [258.4, "bu ilhaddan sonra başka ilhad yoktur."], [260.7, "İlhadın küllî ve cüz'î yönlerini bir araya toplayan en büyük sureti, Allah'ın varlığını inkâr etmektir;"], [269.0, "kişi \"Allah mevcut değildir\" der. Allah'a sığınırız."]]}, {"reader": false, "ar": [[274.0, "فإن قلت: وفيمَ يكون الإلحاد؟"], [284.0, "وفي أيّ شيءٍ يكون الإلحاد؟"], [286.0, "فإن قلت: وفي أيّ شيءٍ يكون الإلحاد؟"], [291.0, "فنقول: يكون في آيات الله وأسمائه ـ"]], "tr": [[274.0, "\"İlhad neyde olur? İlhad hangi şeyde olur?\" dersen —\"İlhad hangi şeyde olur?\" dersen— deriz ki:"], [290.3, "Allah'ın ayetlerinde ve isimlerinde olur —"]]}]}, {"ts": "05:00", "title": "19. Külliye (devam): Şer'î ayetlerde ilhad", "paras": [{"reader": false, "ar": [[300.0, "يكون في آيات الله وأسمائه."], [304.0, "أنتم معي؟ يكون في آيات الله وأسمائه."], [309.0, "فإن قلت: وما الدليل على دخول الإلحاد في آيات الله؟"], [315.0, "فقل: قول الله عز وجل:"], [326.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ يُلْحِدُونَ فِي آيَاتِنَا لَا يَخْفَوْنَ عَلَيْنَا﴾<\/span> <span class=\"ref\">[فصلت: ٤٠]<\/span>،"], [331.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ يُلْحِدُونَ فِي آيَاتِنَا لَا يَخْفَوْنَ عَلَيْنَا﴾<\/span>."]], "tr": [[300.0, "— Allah'ın ayetlerinde ve isimlerinde olur."], [304.0, "Benimle misiniz? Allah'ın ayetlerinde ve isimlerinde olur."], [309.0, "\"İlhadın Allah'ın ayetlerine girdiğinin delili nedir?\" dersen de ki:"], [314.4, "Allah Teâlâ'nın şu sözü: <span class=\"ayah\">﴿Ayetlerimiz hakkında ilhad edenler (onları saptıranlar) bize gizli kalmaz﴾<\/span> [Fussilet 40];"], [331.7, "<span class=\"ayah\">﴿Ayetlerimiz hakkında ilhad edenler bize gizli kalmaz﴾<\/span>."]]}, {"reader": false, "ar": [[339.0, "فإن قلت: وما أقسام الإلحاد في آيات الله؟"], [346.0, "فقل: ينقسم إلى قسمين:"], [356.0, "إلحادٌ في الآيات الشرعية،"], [358.0, "وإلحادٌ في الآيات الكونية."], [364.0, "أُعيدها مرةً أخرى: إن قيل لك:"], [368.3, "ما أنواع الإلحاد في آيات الله؟"], [371.0, "فقل: ينقسم إلى نوعين:"], [374.0, "إلحادٌ في آيات الله الشرعية،"], [378.0, "وإلحادٌ في آيات الله الكونية."], [381.0, "والمقصود بالآيات الشرعية: أي القرآن والسنة،"], [386.0, "والمقصود بالآيات الكونية: أي السماوات وما فيها، والأرض وما فيها."]], "tr": [[339.0, "\"Allah'ın ayetlerindeki ilhadın kısımları nelerdir?\" dersen de ki:"], [346.0, "İki kısma ayrılır: şer'î ayetlerde ilhad ve kevnî ayetlerde ilhad."], [359.7, "Bir kez daha tekrar ediyorum:"], [367.0, "Sana \"Allah'ın ayetlerindeki ilhadın çeşitleri nelerdir?\" denirse de ki:"], [371.8, "İki çeşide ayrılır: Allah'ın şer'î ayetlerinde ilhad ve Allah'ın kevnî ayetlerinde ilhad."], [380.4, "Şer'î ayetlerden kasıt Kur'an ve Sünnet'tir;"], [384.8, "kevnî ayetlerden kasıt ise gökler ve içindekiler, yer ve içindekilerdir."]]}, {"reader": false, "ar": [[394.0, "فإن قلت: وما معنى الإلحاد في الآيات الشرعية؟"], [403.0, "وما معنى ـ ماخذين هالسؤال؟"], [406.2, "سؤالٌ صح <span class=\"q\">؟ 06:45<\/span> ـ وما معنى الإلحاد في الآيات الشرعية؟"], [410.0, "فقل: تعطيلُها؛ فكلُّ من عطّل نصًّا عن دلالته الصحيحة فهو ملحد."], [418.0, "تحريفُها؛ فكلُّ من حرّف نصًّا عن دلالته الصحيحة فهو ملحد."], [428.0, "جحودُها والتكذيبُ بها، جحودُها والتكذيبُ بها؛"], [438.0, "فكلُّ من جحد أو كذّب بشيءٍ من النصوص لفظًا أو دلالةً فهو ملحد."]], "tr": [[394.0, "\"Şer'î ayetlerde ilhadın manası nedir?\" dersen —\"manası nedir\" diye;"], [399.8, "bu soruyu aldınız mı? Doğru bir soru <span class=\"q\">؟<\/span>— \"Şer'î ayetlerde ilhadın manası nedir?\" dersen de ki:"], [411.5, "Onları ta'til etmek; bir nassı sahih delâletinden boşaltan herkes mülhiddir."], [417.4, "Onları tahrif etmek; bir nassı sahih delâletinden saptıran herkes mülhiddir."], [426.9, "Onları inkâr etmek ve yalanlamak, onları inkâr etmek ve yalanlamak;"], [438.0, "naslardan herhangi birini lafız ya da delâlet olarak inkâr eden veya yalanlayan herkes mülhiddir."]]}, {"reader": false, "ar": [[444.0, "انتبه: الاستدلالُ بها على غير ما نزلت له،"], [453.0, "والاستدلالُ بها على غير ما نزلت له؛"], [458.0, "فكلُّ من استدلّ بالآية على غير ما نزلت به فإنه ملحدٌ في الاستدلال،"], [467.0, "لأنه مائلٌ عن الحقّ الواجب فيه."], [470.0, "كالخوارج إذا استدلّوا على قتل المسلمين بقوله عز وجل:"], [475.0, "<span class=\"ayah\">﴿فَاقْتُلُوا الْمُشْرِكِينَ حَيْثُ وَجَدتُّمُوهُمْ﴾<\/span> <span class=\"ref\">[التوبة: ٥]<\/span>،"], [478.0, "فإنهم ألحدوا في الاستدلال بهذه الآية على غير من نزلت فيهم."]], "tr": [[444.0, "Dikkat et: Onları indirildikleri şeyin dışında bir şeye delil getirmek, onları indirildikleri şeyin dışında bir şeye delil getirmek."], [458.6, "Ayeti indirildiği şeyin dışında bir şeye delil getiren herkes istidlalde mülhiddir;"], [464.7, "çünkü bu konuda vâcip olan haktan sapmıştır."], [469.5, "Hâricîlerin, Müslümanları öldürmeye Allah Teâlâ'nın <span class=\"ayah\">﴿Müşrikleri bulduğunuz yerde öldürün﴾<\/span> [Tevbe 5] sözünü delil getirmeleri gibi."], [477.2, "Onlar bu ayeti, hakkında indiği kimselerin dışındakilere delil getirerek istidlalde ilhad etmişlerdir."]]}, {"reader": false, "ar": [[483.0, "وكاستدلال الممثّلة بقوله: <span class=\"ayah\">﴿وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span> على مماثلة الله بمخلوقاته،"], [494.0, "فهذا إلحادٌ في الاستدلال،"], [496.8, "لأنهم مالوا عن وجه الاستدلال الصحيح."], [504.0, "وكاستدلال المعطّلة على تعطيل الله عن صفاته بقوله:"], [511.5, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>، <span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [515.0, "<span class=\"ayah\">﴿فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ﴾<\/span> <span class=\"ref\">[النحل: ٧٤]<\/span>؛"], [517.0, "فهم يستدلّون بها على أن الله لا يوصف بالصفات،"], [521.0, "وهذا إلحادٌ في الاستدلال."]], "tr": [[483.0, "Mümessile'nin <span class=\"ayah\">﴿O işitendir, görendir﴾<\/span> [Şûrâ 11] sözünü Allah'ın mahlûkatına benzerliğine delil getirmesi de böyledir;"], [494.7, "bu istidlalde ilhaddır, çünkü doğru istidlal yönünden saptılar."], [499.6, "Muattıla'nın da Allah'ı sıfatlarından yoksun saymaya <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11], <span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4], <span class=\"ayah\">﴿Allah'a misaller getirmeyin﴾<\/span> [Nahl 74] sözlerini delil getirmesi de böyledir."], [518.8, "Bunları Allah'ın sıfatlarla nitelenmediğine delil getirirler; bu da istidlalde ilhaddır."]]}, {"reader": false, "ar": [[524.0, "فالآيات الشرعية يكون الإلحاد فيها على صور:"], [530.0, "على تعطيلها، وعلى تحريفها،"], [536.0, "وعلى جحودها أو التكذيب بها،"], [540.0, "وعلى الاستدلال بها على صورةٍ لا تدلّ عليه."], [546.0, "فهمتم هذا؟ فنعوذ بالله من الإلحاد في الآيات."]], "tr": [[524.0, "Demek ki şer'î ayetlerde ilhad birkaç surette olur:"], [530.0, "onları ta'til etmek, onları tahrif etmek, onları inkâr etmek ya da yalanlamak ve onları delâlet etmedikleri bir surette delil getirmek."], [547.0, "Bunu anladınız mı? Ayetlerde ilhaddan Allah'a sığınırız."]]}, {"reader": false, "ar": [[550.0, "فإن قلت: وما معنى الإلحاد في الآيات الكونية؟"], [554.0, "فإن قلت: وما معنى الإلحاد في الآيات الكونية؟"], [568.0, "فقل: معنى الإلحاد فيها:"], [573.0, "اعتقادُ خالقٍ لها مع الله؛"], [577.0, "فكلُّ من اعتقد أن خالقًا مع الله قد خلق شيئًا من ذرّات السماوات وما فيها،"], [587.0, "أو من ذرّات الأرض وما فيها،"], [589.0, "فهو ملحدٌ في الآيات الكونية."], [592.0, "أو اعتقادُ أن لها مدبّرًا ومتصرّفًا مع الله ـ"]], "tr": [[550.0, "\"Kevnî ayetlerde ilhadın manası nedir?\" dersen —\"Kevnî ayetlerde ilhadın manası nedir?\" dersen— de ki:"], [556.9, "Onlarda ilhadın manası, Allah ile birlikte onların başka bir yaratıcısı olduğuna inanmaktır."], [575.4, "Allah ile birlikte bir yaratıcının göklerin ve içindekilerin ya da yerin ve içindekilerin zerrelerinden bir şey yarattığına inanan herkes kevnî ayetlerde mülhiddir."], [588.3, "Ya da Allah ile birlikte onların bir müdebbiri ve onlarda tasarruf eden biri olduğuna inanmak —"]]}]}, {"ts": "10:00", "title": "19. Külliye (devam): Kevnî ayetlerde ve isimlerde ilhad", "paras": [{"reader": false, "ar": [[600.0, "فكلُّ من اعتقد التدبير أو التصريف لشيءٍ من هذه الآيات الكونية مع الله فهو ملحدٌ في آيات الله."], [615.0, "أو عبادةُ شيءٍ منها من دون الله؛"], [621.0, "فمن عبد الشمس فهو ملحدٌ في آيات الله الكونية،"], [627.0, "ومن عبد القمر فهو ملحدٌ في آيات الله الكونية،"], [632.0, "ومن عبد الكواكب والأفلاك ـ كالصابئة ـ فهو ملحدٌ في آيات الله الكونية،"], [642.0, "ومن عبد الجبال، أو عبد الملائكة،"], [647.0, "أو عبد الكهوف والمغارات والأصنام والأشجار والأحجار،"], [652.0, "فهو ملحدٌ في آيات الله الكونية."]], "tr": [[600.0, "Allah ile birlikte bu kevnî ayetlerden herhangi birini tedbir ettiğine veya onda tasarruf ettiğine (birinin) inanan herkes Allah'ın ayetlerinde mülhiddir."], [617.2, "Ya da onlardan birine Allah'tan başka ibadet etmek:"], [625.0, "Güneşe tapan Allah'ın kevnî ayetlerinde mülhiddir;"], [628.3, "aya tapan Allah'ın kevnî ayetlerinde mülhiddir;"], [631.5, "Sâbiîler gibi yıldızlara ve feleklere tapan Allah'ın kevnî ayetlerinde mülhiddir."], [641.3, "Dağlara tapan, meleklere tapan ya da mağaralara, inlere, putlara, ağaçlara ve taşlara tapan kimse Allah'ın kevnî ayetlerinde mülhiddir."]]}, {"reader": false, "ar": [[655.0, "إذ الله خلق هذا الكون بما فيه ليدلّ على أنه المستحقّ للألوهية دون ما سواه،"], [662.0, "فكيف تُعبد مفرداتُ هذا الكون التي هي دليلٌ على وحدانية الله؟"], [669.0, "فهذا إلحاد. فالله ما خلق الشمس لتُعبد،"], [674.0, "وإنما خلقها ليدلّك التفكّرُ في عظيم خلقها على أن وراءها خالقًا يستحقّ العبادة؛"], [683.0, "فعبادتُك لها ميلٌ عن الاعتقاد الصحيح الواجب فيها،"], [689.0, "كما قال الله عز وجل:"], [691.0, "<span class=\"ayah\">﴿وَهُوَ الَّذِي خَلَقَ اللَّيْلَ وَالنَّهَارَ وَالشَّمْسَ وَالْقَمَرَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٣٣]<\/span>،"], [696.0, "<span class=\"ayah\">﴿لَا تَسْجُدُوا لِلشَّمْسِ وَلَا لِلْقَمَرِ وَاسْجُدُوا لِلَّهِ الَّذِي خَلَقَهُنَّ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ﴾<\/span> <span class=\"ref\">[فصلت: ٣٧]<\/span> <span class=\"note\">(Şeyh Enbiyâ 33'ün başını Fussilet 37'nin devamına bağlıyor.)<\/span>"]], "tr": [[655.0, "Çünkü Allah bu kâinatı içindekilerle birlikte, kendisinden başkasının değil yalnız kendisinin ulûhiyyete layık olduğunu göstersin diye yaratmıştır."], [661.0, "Allah'ın birliğine delil olan bu kâinatın tek tek parçalarına nasıl ibadet edilir?"], [667.0, "Bu ilhaddır. Allah güneşi ibadet edilsin diye yaratmadı;"], [672.2, "onu, yaratılışının azameti üzerinde tefekkür etmen, onun ardında ibadete layık bir yaratıcı olduğunu sana göstersin diye yarattı."], [681.5, "Senin ona ibadet etmen, onun hakkında vâcip olan sahih inançtan sapmaktır."], [687.4, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [690.2, "<span class=\"ayah\">﴿Geceyi, gündüzü, güneşi ve ayı yaratan O'dur﴾<\/span> [Enbiyâ 33], <span class=\"ayah\">﴿Güneşe de aya da secde etmeyin; eğer yalnız O'na ibadet ediyorsanız, onları yaratan Allah'a secde edin﴾<\/span> [Fussilet 37]."]]}, {"reader": false, "ar": [[704.0, "فإن قلت: وما دليلُ تحريم الإلحاد في الأسماء؟"], [713.0, "الجواب: قول الله عز وجل:"], [717.0, "<span class=\"ayah\">﴿وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٠]<\/span>."], [721.0, "فإن قلت: وما معنى الإلحاد في أسماء الله؟"], [738.0, "فإن قلت: وما معنى الإلحاد في أسماء الله؟"], [745.0, "فقل: تعطيلُها، بمعنى: ألّا نسمّي الله عز وجل بها،"], [760.0, "أو تعطيلُ صفاتها التي تدلّ عليها؛"], [765.0, "فالعزيز يدلّ على العزّة،"], [769.0, "فإذا آمنت بالعزيز وجحدت العزّة فأنت معطّلٌ في الصفة التي يدلّ عليها ذلك الاسم."]], "tr": [[704.0, "\"İsimlerde ilhadın haram olduğunun delili nedir?\" dersen, cevap:"], [713.0, "Allah Teâlâ'nın şu sözüdür: <span class=\"ayah\">﴿O'nun isimleri hakkında ilhad edenleri bırakın﴾<\/span> [A'râf 180]."], [722.5, "\"Allah'ın isimlerinde ilhadın manası nedir?"], [726.1, "Allah'ın isimlerinde ilhadın manası nedir?\" dersen de ki:"], [743.1, "Onları ta'til etmek, yani Allah Teâlâ'yı onlarla isimlendirmemek;"], [759.0, "ya da onların delâlet ettiği sıfatları ta'til etmek."], [765.0, "el-Azîz (ismi) izzete delâlet eder."], [769.8, "el-Azîz'e iman edip izzeti inkâr edersen, o ismin delâlet ettiği sıfatta muattılsın."]]}, {"reader": false, "ar": [[777.0, "كما فعلته المعتزلة؛ فإنهم يؤمنون بأسماء الله،"], [782.0, "ويعطّلون الله عن الصفات الدالّة عليها هذه الأسماء،"], [788.0, "فيقولون: الله عزيزٌ بلا عزّة،"], [792.0, "وقديرٌ بلا قدرة، وقويٌّ بلا قوّة،"], [798.0, "وهكذا دواليك في سائر أسماء الله عز وجل عند المعتزلة."], [805.0, "فمن عطّل الاسمَ وصفتَه فهو ملحد،"], [809.0, "ومن أثبت الاسمَ وعطّل صفتَه فهو ملحد."]], "tr": [[777.0, "Mu'tezile'nin yaptığı gibi: Onlar Allah'ın isimlerine iman ederler, ama Allah'ı bu isimlerin delâlet ettiği sıfatlardan yoksun sayarlar ve \"Allah izzetsiz Azîz'dir, kudretsiz Kadîr'dir, kuvvetsiz Kavî'dir\" derler."], [796.9, "Mu'tezile'de Allah Teâlâ'nın diğer isimleri hakkında da durum böyledir."], [803.6, "İsmi de sıfatını da ta'til eden mülhiddir;"], [808.3, "ismi isbat edip sıfatını ta'til eden de mülhiddir."]]}, {"reader": false, "ar": [[814.0, "وكذلك تسميةُ الله بما لا دليل عليه فهو إلحادٌ في أسمائه؛"], [824.0, "كتسمية الله بالعقل الفعّال كما تقوله الفلاسفة،"], [834.0, "أو تسميته بالأُقنوم الثالث،"], [839.0, "أو تسميته بالعلّة الفاعلة،"], [845.0, "أو تسميته بالأب كما عند النصارى،"], [851.0, "أو وصفه بأنه ثالثُ ثلاثة كما عندهم أيضًا."], [857.0, "فكلُّ من سمّى الله بما لا دليل عليه فقد ألحد في أسماء الله عز وجل،"], [864.0, "لأن أسماءه توقيفيةٌ على النصّ،"], [867.0, "كما سيأتينا في كليات باب الأسماء إن شاء الله."]], "tr": [[814.0, "Aynı şekilde Allah'ı delili olmayan bir şeyle isimlendirmek de O'nun isimlerinde ilhaddır."], [824.0, "Filozofların dediği gibi Allah'ı \"Faal Akıl\" diye isimlendirmek, ya da \"üçüncü uknûm\" diye isimlendirmek, ya da \"fâil illet\" diye isimlendirmek, ya da Hristiyanlardaki gibi \"Baba\" diye isimlendirmek, ya da yine onlardaki gibi O'nu \"üçün üçüncüsü\" diye nitelemek gibi."], [860.0, "Allah'ı delili olmayan bir şeyle isimlendiren herkes Allah Teâlâ'nın isimlerinde ilhad etmiştir;"], [865.2, "çünkü O'nun isimleri nassa bağlıdır (tevkîfîdir)."], [867.7, "İnşallah isimler babının külliyelerinde bu konu gelecek."]]}, {"reader": false, "ar": [[870.0, "ومن صور الإلحاد في الأسماء:"], [873.0, "تسميةُ المعبودات بها، تسميةُ المعبودات بها:"], [879.3, "كاللات من اسم الله عز وجل،"], [884.8, "والعُزّى من اسم الله العزيز،"], [889.5, "ومناةَ من اسم الله المنّان."], [895.0, "فكلُّ من عبد شيئًا وأطلق عليه شيئًا من أسماء الله عز وجل فهو ملحدٌ في أسمائه تبارك وتعالى."]], "tr": [[870.0, "İsimlerdeki ilhadın suretlerinden biri de mabutları onlarla isimlendirmektir, mabutları onlarla isimlendirmektir:"], [880.8, "\"Allah\" isminden türetilen Lât, \"el-Azîz\" isminden türetilen Uzzâ ve \"el-Mennân\" isminden türetilen Menât gibi."], [895.0, "Bir şeye ibadet edip ona Allah Teâlâ'nın isimlerinden birini veren herkes, Tebâreke ve Teâlâ'nın isimlerinde mülhiddir."]]}]}, {"ts": "15:00", "title": "19. Külliye (sonu) · 20. Külliye: Nassa çarpan her görüş ve kıyas bâtıldır", "paras": [{"reader": false, "ar": [[904.0, "فصار الإلحاد في أسماء الله أنواعًا:"], [908.8, "تعطيلُها، أو تعطيلُ صفاتها،"], [917.0, "أو تسميةُ الله بما لا دليل عليه،"], [922.0, "أو إطلاقُها على بعض المعبودات من دونه."]], "tr": [[904.0, "Böylece Allah'ın isimlerinde ilhad birkaç çeşit oldu:"], [907.7, "onları ta'til etmek, ya da sıfatlarını ta'til etmek, ya da Allah'ı delili olmayan bir şeyle isimlendirmek, ya da onları O'ndan başka mabutlardan bazılarına vermek."]]}, {"reader": false, "ar": [[927.6, "فإن قيل لك ـ وهو آخر سؤال ـ:"], [933.0, "وما حكمُ الإلحاد؟ إن قيل لك:"], [937.0, "وما حكم الإلحاد؟ فتقول:"], [941.0, "يختلف حكمُه باختلاف رتبة الميل فيه؛"], [945.9, "فمنه ما يكون كفرًا إذا كان مناقضًا لأصل الإيمان،"], [952.9, "فمنه ما يكون كفرًا إذا كان مناقضًا لأصل الإيمان؛"], [960.0, "فكلُّ إلحادٍ ناقض أصلَ الإيمان فكفر،"], [964.0, "فكلُّ إلحادٍ ناقض أصلَ الإيمان فكفر."], [971.0, "ويكون كبيرةً من الكبائر إذا أنقص كمالَ الإيمان الواجب،"], [979.0, "ويكون كبيرةً من الكبائر إذا أنقص كمالَ الإيمان الواجب."], [987.0, "فإذًا هو حرام، وقد يكون كفرًا في بعض صوره. والله أعلم."]], "tr": [[927.6, "Sana —ve bu son sorudur— \"İlhadın hükmü nedir?"], [933.7, "İlhadın hükmü nedir?\" denirse şöyle dersin:"], [937.7, "Hükmü, içindeki sapmanın derecesine göre değişir."], [943.3, "Kimi, imanın aslına aykırı olduğunda küfür olur;"], [950.0, "kimi, imanın aslına aykırı olduğunda küfür olur."], [953.4, "İmanın aslına aykırı olan her ilhad küfürdür;"], [959.4, "imanın aslına aykırı olan her ilhad küfürdür."], [964.0, "Vâcip olan iman kemalini eksilttiğinde ise büyük günahlardan bir büyük günah olur;"], [974.6, "vâcip olan iman kemalini eksilttiğinde büyük günahlardan bir büyük günah olur."], [984.0, "Demek ki o haramdır, bazı suretlerinde de küfür olabilir. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[994.0, "إذًا هذا المحذورُ ـ إذًا هذا محذورٌ من محذورات العقائد،"], [1001.0, "ومزلقٌ من مزالق العقيدة،"], [1002.3, "وهو الإلحاد. طيب، ثم قال:"]], "tr": [[994.0, "Demek ki bu sakınca —demek ki bu, akîdelerin sakıncalarından bir sakınca ve akîdenin kaygan zeminlerinden bir kaygan zemindir;"], [1002.0, "o da ilhaddır. Peki, sonra (müellif) dedi ki:"]]}, {"reader": true, "ar": [[1007.0, "أحسن الله إليكم. الكلية العشرون:"], [1011.0, "كلُّ رأيٍ أو قياسٍ صادم النصَّ الصحيح الصريح فهو باطل."]], "tr": [[1007.0, "Allah size iyilik etsin. Yirminci külliye:"], [1011.0, "Sahih ve sarih nassa çarpan her görüş veya kıyas bâtıldır."]]}, {"reader": false, "ar": [[1017.0, "كلُّ قياسٍ صادم النصَّ فهو باطل."], [1021.0, "كلُّ قياسٍ أو رأيٍ صادم النصَّ فهو باطل."], [1027.7, "<span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [1032.0, "الواجبُ تقديمُ النصوص على القياس؛"], [1035.0, "فلا يجوز لك أن تقدّم على النقل الصحيح الصريح شيئًا،"], [1041.0, "لقول الله عز وجل:"], [1044.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُقَدِّمُوا بَيْنَ يَدَيِ اللَّهِ وَرَسُولِهِ﴾<\/span> <span class=\"ref\">[الحجرات: ١]<\/span>،"], [1048.6, "ولقول الله عز وجل:"], [1054.0, "<span class=\"ayah\">﴿لَا تَرْفَعُوا أَصْوَاتَكُمْ فَوْقَ صَوْتِ النَّبِيِّ﴾<\/span> <span class=\"ref\">[الحجرات: ٢]<\/span>."]], "tr": [[1017.0, "Nassa çarpan her kıyas bâtıldır."], [1019.7, "Nassa çarpan her kıyas veya görüş bâtıldır."], [1024.1, "(Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [1030.7, "Nasları kıyasa takdim etmek vâciptir."], [1033.8, "Sahih ve sarih nakilden önce hiçbir şeyi öne geçirmen caiz değildir."], [1040.0, "Çünkü Allah Teâlâ şöyle buyurmuştur:"], [1043.2, "<span class=\"ayah\">﴿Ey iman edenler! Allah'ın ve Resûlü'nün önüne geçmeyin﴾<\/span> [Hucurât 1]."], [1047.2, "Yine Allah Teâlâ şöyle buyurmuştur:"], [1051.2, "<span class=\"ayah\">﴿Seslerinizi Peygamber'in sesinin üstüne yükseltmeyin﴾<\/span> [Hucurât 2]."]]}, {"reader": false, "ar": [[1056.0, "فلا يجوز أن نقدّم على الدليل الصحيح الصريح لا عقلًا ولا قياسًا ولا رأيًا،"], [1067.0, "ولا قولَ مذهب، ولا اجتهادَ عالمٍ مهما كانت رتبته؛"], [1076.0, "لأن النصّ هو المقدَّم على كل شيء."], [1081.0, "وهذا من قواعد تعظيم النصوص،"], [1083.0, "وتفيدنا في العقائد فائدةً عظيمة،"], [1087.0, "وهي أن كثيرًا من أهل البدع يعارض النصوصَ بعقله،"], [1091.0, "أو يعارض النصوصَ برأيه،"], [1094.0, "أو يعارض النصوصَ بأقيسته؛"], [1099.0, "فتأتيك هذه القاعدة بأن الواجب هو تقديمُ النصوص على كل شيء."]], "tr": [[1056.0, "Sahih ve sarih delilin önüne ne aklı, ne kıyası, ne görüşü, ne bir mezhebin sözünü, ne de derecesi ne olursa olsun bir âlimin içtihadını geçirmemiz caiz değildir."], [1078.1, "Çünkü nas her şeyin önündedir."], [1081.4, "Bu, nasları tazim kaidelerindendir ve bize akîdelerde büyük bir fayda sağlar:"], [1087.9, "Bid'at ehlinin çoğu naslara aklıyla, ya da görüşüyle, ya da kıyaslarıyla muâraza eder."], [1095.7, "İşte bu kaide sana, vâcip olanın nasları her şeye takdim etmek olduğunu bildirir."]]}, {"reader": false, "ar": [[1106.0, "فمتى ما صحّ النصُّ وثبت فالواجبُ تقديمُه على كل شيء؛"], [1112.0, "فالنصّ هو التاج الذي يوضع على الرأس،"], [1114.0, "وهو الميزان الذي توزن به الآراءُ والأقوالُ والمذاهبُ واجتهاداتُ الرجال والعالمُ كلُّه."], [1125.0, "فالنصّ هو المقدَّم عندك ـ أيها المسلم ـ في كل شيء؛"], [1131.0, "فمتى ما ثبت النصُّ وصحّ فإياك أن تقدّم عليه شيئًا."], [1136.0, "فإذا صحّت النصوص بقضيةٍ غيبية فلا تقدّم عليها لا عقلًا ولا قياسًا،"], [1143.0, "وإذا صحّت النصوص بشيءٍ من العبادات فلا تقدّم عليها عقلًا ولا قياسًا،"], [1151.0, "وإذا صحّت النصوص بمعاملةٍ فلا تقدّم عليها لا عقلًا ولا قياسًا."]], "tr": [[1106.0, "Nas sahih ve sabit olduğu anda onu her şeye takdim etmek vâciptir."], [1112.3, "Nas başa konan taçtır; görüşlerin, sözlerin, mezheplerin, adamların içtihatlarının ve bütün dünyanın kendisiyle tartıldığı mizandır."], [1119.1, "Ey Müslüman, nas senin nazarında her şeyin önündedir."], [1127.0, "Nas sabit ve sahih olduğu anda, sakın onun önüne bir şey geçirme."], [1133.5, "Naslar gaybî bir meselede sahih olarak gelmişse onların önüne ne aklı ne kıyası geçir."], [1140.7, "Naslar ibadetlerden bir şey hakkında sahih olarak gelmişse onların önüne ne aklı ne kıyası geçir."], [1149.7, "Naslar bir muamele hakkında sahih olarak gelmişse onların önüne ne aklı ne kıyası geçir."]]}, {"reader": false, "ar": [[1158.0, "وإن معارضةَ النصّ بالقياس مدرسةٌ إبليسية يربّي عليها أتباعَه كثيرًا؛"], [1168.0, "فأولُ من عارض النصَّ الصحيح بالقياس هو إبليس،"], [1173.0, "لما قال الله عز وجل له في ملكوت السماء:"], [1178.7, "<span class=\"ayah\">﴿اسْجُدُوا لِآدَمَ﴾<\/span> <span class=\"ref\">[البقرة: ٣٤]<\/span>، وهو نصٌّ صحيحٌ صريحٌ لا يحتمل النقاش ولا المعارضة،"], [1186.0, "أبى ذلك الكافر إلا أن يعارض الله في نصّه بالقياس،"], [1192.0, "فقال: <span class=\"ayah\">﴿أَنَا خَيْرٌ مِّنْهُ ۖ خَلَقْتَنِي مِن نَّارٍ وَخَلَقْتَهُ مِن طِينٍ﴾<\/span> <span class=\"ref\">[الأعراف: ١٢]<\/span>،"], [1199.0, "فجعل أصلَه الناريَّ مقدَّمًا على أصل آدم الطيني ـ"]], "tr": [[1158.0, "Nassa kıyasla muâraza etmek, İblis'in taraftarlarını çokça üzerinde yetiştirdiği iblisçe bir mekteptir."], [1168.0, "Sahih nassa kıyasla ilk muâraza eden İblis'tir."], [1171.8, "Allah Teâlâ ona semanın melekûtunda <span class=\"ayah\">﴿Âdem'e secde edin﴾<\/span> [Bakara 34] dediğinde —ki bu, tartışmaya da muârazaya da ihtimali olmayan sahih ve sarih bir nastır— o kâfir, Allah'a nassında kıyasla muâraza etmekten başkasını kabul etmedi ve <span class=\"ayah\">﴿Ben ondan hayırlıyım; beni ateşten yarattın, onu ise çamurdan yarattın﴾<\/span> [A'râf 12] dedi."], [1198.3, "Ateşten olan aslını, Âdem'in çamurdan olan aslının önüne geçirdi —"]]}]}, {"ts": "20:00", "title": "20. Külliye (devam): Âlimlerin İblis'e üç cevabı; en büyük silah sağlam itikaddır", "paras": [{"reader": false, "ar": [[1205.0, "فالمفضولُ هو الذي يسجد للفاضل،"], [1208.7, "وليس العكس؛ ظنًّا منه أنه جاء بشيءٍ قد خفي على الله عز وجل."], [1217.0, "وكان الواجبُ عليه أن يمتثل أمرَ الله ولا يعارضه لا برأيٍ ولا بقياس."]], "tr": [[1205.0, "— (ona göre) secde eden, faziletli olana secde eden daha aşağı olandır, tersi değil."], [1213.2, "Allah Teâlâ'ya gizli kalmış bir şey getirdiğini sandı."], [1216.5, "Oysa ona düşen, Allah'ın emrine uyması ve ona ne bir görüşle ne de bir kıyasla muâraza etmemesiydi."]]}, {"reader": false, "ar": [[1225.0, "وقد ردّ العلماءُ على إبليس بثلاثة أوجه:"], [1229.0, "الوجه الأول: أن قياسك هذا صادم النصّ،"], [1233.7, "وكلُّ قياسٍ صادم النصَّ فهو باطل."], [1238.0, "الثاني: أننا لا نسلّم صحةَ قياسك هذا أصلًا؛"], [1247.0, "فمن قال لك إن النار خيرٌ من الطين؟"], [1250.0, "بل الصوابُ العكس: أن الطين خيرٌ من النار."]], "tr": [[1225.0, "Âlimler İblis'e üç yönden cevap vermişlerdir."], [1228.4, "Birinci yön: Senin bu kıyasın nassa çarpmıştır;"], [1233.7, "nassa çarpan her kıyas da bâtıldır."], [1238.0, "İkincisi: Senin bu kıyasının doğruluğunu baştan kabul etmiyoruz."], [1247.4, "Ateşin çamurdan hayırlı olduğunu sana kim söyledi?"], [1250.5, "Bilakis doğrusu tersidir: Çamur ateşten hayırlıdır."]]}, {"reader": false, "ar": [[1254.0, "فإن الطين من طبيعته الثِّقَلُ والرزانة،"], [1260.0, "والنار من طبيعتها الخفّةُ والطيش."], [1263.0, "والطين كريمُ الطبع؛ فتعطيه الحبّةَ فيُعطيكها سنبلة،"], [1272.0, "وتعطيه النواةَ فيُعطيكها نخلةً باسقةَ الفروع تأكل منها الثمر."], [1278.0, "وأما النار فإنها آلةُ التدمير والإحراق."], [1285.0, "فمن قال لك بأن النار خيرٌ من الطين؟"]], "tr": [[1254.0, "Çünkü çamurun tabiatında ağırlık ve vakar vardır;"], [1257.8, "ateşin tabiatında ise hafiflik ve savrukluk vardır."], [1262.4, "Çamur cömert tabiatlıdır: Ona bir tane verirsin, sana onu bir başak olarak geri verir;"], [1273.3, "ona bir çekirdek verirsin, sana onu dalları yükselen, meyvesinden yediğin bir hurma ağacı olarak geri verir."], [1281.2, "Ateş ise yıkım ve yakma aletidir."], [1286.0, "Ateşin çamurdan hayırlı olduğunu sana kim söyledi?"]]}, {"reader": false, "ar": [[1289.0, "والثالث: سلّمنا جدلًا أن النار خيرٌ من الطين،"], [1295.0, "فهل أنت النارُ كلُّها،"], [1298.0, "أو جزءٌ من أجزائها؟"], [1299.0, "الجواب: أنت جزءٌ من أجزائها."], [1304.0, "وشرفُ الأصل لا يستلزم شرفَ الفرع؛"], [1309.0, "فكم من أصلٍ رفيعٍ وفرعُه وضيع!"], [1317.0, "فهذا نوحٌ عليه السلام أصلُه رفيع،"], [1323.0, "ولكن ولدُه الذي كفر ولم يؤمن به فرعٌ وضيع."], [1328.0, "كما قال الشاعر: إذا افتخرتَ بآباءٍ لهم شرفٌ،"], [1333.0, "إذا افتخرتَ بآباءٍ لهم شرفٌ ..."], [1335.9, "قلنا: صدقتَ، ولكن بئس ما ولدوا."]], "tr": [[1289.0, "Üçüncüsü: Tartışma uğruna ateşin çamurdan hayırlı olduğunu kabul edelim;"], [1295.0, "peki sen ateşin tamamı mısın, yoksa parçalarından bir parça mı?"], [1299.8, "Cevap: Sen onun parçalarından bir parçasın."], [1306.0, "Aslın şerefli olması, fer'in (daldan gelenin) şerefli olmasını gerektirmez."], [1313.0, "Nice yüce asıl vardır ki fer'i düşüktür!"], [1320.8, "İşte Nûh (a.s.): Aslı yücedir, ama kâfir olup ona iman etmeyen oğlu düşük bir fer'dir."], [1330.5, "Şairin dediği gibi: \"Şerefli babalarla övündüğünde —şerefli babalarla övündüğünde— 'Doğru söyledin, ama doğurdukları ne kötü!' deriz.\""]]}, {"reader": false, "ar": [[1340.0, "فقولك بأنني خيرٌ من آدم كذبٌ ودجل،"], [1348.0, "بل آدم خيرٌ منك؛"], [1350.0, "ولا يستوي من خلقه الله بيديه بمن قال له:"], [1356.2, "كن فكان. ولا يزال إبليسُ يرى فيكم صورةَ أبيكم آدم،"], [1366.0, "ولا تزال بغضاؤه تتحرّك في قلبه كأنه رأى آدم،"], [1373.0, "ولا تزال نارُ الحقد تحرق قلبه على فروع آدم؛"], [1378.0, "فهو يتصوّر فيكم صورةَ ذلك الذي أُمر بالسجود له، دائمًا وأبدًا."]], "tr": [[1340.0, "\"Ben Âdem'den hayırlıyım\" sözün yalan ve aldatmacadır;"], [1348.0, "bilakis Âdem senden hayırlıdır. Allah'ın iki eliyle yarattığı kimse, \"Ol\" deyip de olan kimseyle bir olmaz."], [1360.7, "İblis sizde hâlâ babanız Âdem'in suretini görmektedir."], [1366.0, "Âdem'i görmüş gibi kini kalbinde hâlâ kıpırdamaktadır."], [1371.0, "Kin ateşi Âdem'in soyuna karşı kalbini hâlâ yakmaktadır."], [1376.3, "O, sizde daima ve ebediyen kendisine secde etmesi emredilen o kimsenin suretini tasavvur eder."]]}, {"reader": false, "ar": [[1386.0, "فلا تظنّوا ـ يا بني آدم ـ أن الشيطان سيرفع معكم رايةَ الصلح ولا الهدنة،"], [1394.0, "بل هو يشنّ عليكم وعلى ذرّياتكم حربًا ضروسًا دائمة،"], [1400.0, "إلى أن يرث الله الأرض ومن عليها."], [1402.0, "والوقايةُ من شرّه بسلامة الاعتقاد؛"], [1407.0, "فأعظمُ ما يقهر الشيطانَ سلامةُ الاعتقاد،"], [1411.0, "وتسويلُه وإجلابُه بخيله ورَجِله على فساد العقيدة أكثرُ بكثيرٍ من جلبته على إفساد العبادات."]], "tr": [[1386.0, "Ey Âdemoğulları! Şeytanın sizinle barış ya da ateşkes sancağı kaldıracağını sanmayın."], [1391.5, "Bilakis o, Allah yeryüzüne ve üzerindekilere vâris olana kadar size ve zürriyetlerinize karşı daimî, amansız bir savaş açmaktadır."], [1401.4, "Onun şerrinden korunmak itikadın sağlamlığıyladır."], [1403.6, "Şeytanı en çok kahreden şey itikadın sağlamlığıdır."], [1409.7, "Onun akîdeyi bozmak için süslemesi, atlılarıyla ve yayalarıyla üzerine yüklenmesi, ibadetleri bozmak için yüklenmesinden çok daha fazladır."]]}, {"reader": false, "ar": [[1423.0, "فإن العبادة إن فسدت قد لا توجب لك نارًا،"], [1427.0, "لكن العقيدة إن فسدت أوجبت لك النار."], [1430.0, "فأعظمُ سلاحٍ يمدّه الله لنا لننجو سلامةُ الاعتقاد،"], [1436.0, "وأعظمُ سلاحٍ يريد الشيطانُ قطعَه عنا سلامةُ الاعتقاد؛"], [1443.0, "فإن من مات سليمَ الاعتقاد فإنه إما أن يدخل الجنة ابتداءً أو انتقالًا،"], [1452.0, "فمآلُ صحيح العقيدة إلى الجنة،"], [1457.0, "وإن عُذّب في النار على شيءٍ من الذنوب الكبار."]], "tr": [[1423.0, "Çünkü ibadet bozulursa sana ateşi gerektirmeyebilir, ama akîde bozulursa sana ateşi gerektirir."], [1427.9, "Kurtulalım diye Allah'ın bize uzattığı en büyük silah itikadın sağlamlığıdır;"], [1433.6, "şeytanın bizden kesmek istediği en büyük silah da itikadın sağlamlığıdır."], [1441.1, "Çünkü itikadı sağlam olarak ölen kimse ya doğrudan ya da (cehennemden) geçerek cennete girer."], [1452.0, "Akîdesi sahih olanın varacağı yer, büyük günahlardan birinden dolayı ateşte azap görse bile, cennettir."]]}, {"reader": false, "ar": [[1459.0, "والشيطان لا يريد عدمَ الدخول،"], [1464.0, "ولا يريد الدخولَ الجزئي،"], [1466.0, "بل يريد من بني آدم أن يدخل معه الدخولَ الكلّي،"], [1471.0, "ليبرد غليلُ قلبه في جهنم برؤية صورة آدم في بني آدم."], [1480.0, "فنعوذ بالله منه. والله أعلم. نعم."]], "tr": [[1459.0, "Şeytan (insanın cehenneme) hiç girmemesini istemez, kısmen girmesini de istemez;"], [1466.4, "bilakis Âdemoğlunun onunla birlikte oraya tamamen girmesini ister ki cehennemde Âdemoğullarında Âdem'in suretini görerek kalbindeki kin ateşi soğusun."], [1478.7, "Ondan Allah'a sığınırız. Allah en iyisini bilir. Evet."]]}, {"reader": true, "ar": [[1487.0, "أحسن الله إليكم. الكلية الحادية والعشرون:"], [1493.0, "كلُّ من اعتمد في أمور اعتقاده على عقله المجرّد فضالٌّ منحرف."]], "tr": [[1487.0, "Allah size iyilik etsin. Yirmi birinci külliye:"], [1493.6, "İtikad işlerinde yalnızca aklına dayanan herkes sapık ve yoldan çıkmıştır."]]}]}, {"ts": "25:00", "title": "21. Külliye: Yalnız akla dayanmak · 22. Külliye: Müteşâbih muhkeme döndürülür", "paras": [{"reader": false, "ar": [[1500.0, "أحسن الله إليكم. كلُّ من اعتمد في أمور ـ كلُّ من اعتمد في أمور اعتقاده على عقله المجرّد فضالٌّ منحرف."], [1519.0, "كلُّ من اعتمد في أمور اعتقاده على عقله المجرّد فضالٌّ منحرف."]], "tr": [[1500.0, "Allah size iyilik etsin. İtikad işlerinde —itikad işlerinde yalnızca aklına dayanan herkes sapık ve yoldan çıkmıştır."], [1518.0, "İtikad işlerinde yalnızca aklına dayanan herkes sapık ve yoldan çıkmıştır."]]}, {"reader": false, "ar": [[1528.0, "أقول وبالله التوفيق: وهذه من أصول أهل السنة والجماعة:"], [1535.0, "بأننا لا نأخذ معتقداتنا ابتداءً وأصالةً إلا من الكتاب والسنة على فهم سلف الأمة؛"], [1542.0, "فلسنا نعتمد ولا نتّكئ على العقل في إثبات شيءٍ من العقائد ابتداءً وأصالةً."], [1549.0, "فلا تجد عقيدةً يقرّرها أهل السنة إلا ويقف وراءها براهينُ الكتاب والسنة،"], [1556.0, "وأتحدّاك إلى أن تقوم الساعة أن تجد عقيدةً يقرّرها أهل السنة ولا يقف وراءها إلا العقلُ المجرّد."]], "tr": [[1528.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'in usûlündendir:"], [1533.7, "Biz inançlarımızı ilk elden ve asıl olarak ancak ümmetin selefinin anlayışı üzere Kitap ve Sünnet'ten alırız."], [1541.5, "Akîdelerden herhangi birini isbat etmede ilk elden ve asıl olarak akla dayanmaz, ona yaslanmayız."], [1547.9, "Ehl-i Sünnet'in takrir ettiği hiçbir akîde bulamazsın ki arkasında Kitap ve Sünnet'in burhanları durmasın."], [1555.4, "Kıyamet kopana kadar sana meydan okuyorum:"], [1557.9, "Ehl-i Sünnet'in takrir ettiği ve arkasında yalnızca çıplak aklın durduğu bir akîde bul (bulamazsın)."]]}, {"reader": false, "ar": [[1564.0, "هذا تجده كثيرًا عند أهل البدع،"], [1567.0, "وأما أهل السنة فلا تجد عندهم شيئًا من ذلك أبدًا."], [1572.0, "فأولُ ما يعتمد عليه أهل السنة في إثبات عقائدهم إنما هو الكتاب والسنة،"], [1578.0, "وقد يُدخلون العقلَ تبعًا،"], [1580.8, "ولكن لا يُدخلونه ابتداءً استقلالًا. والله أعلم."]], "tr": [[1564.0, "Bunu bid'at ehlinde çokça bulursun;"], [1566.0, "Ehl-i Sünnet'te ise bundan hiçbir şeyi asla bulamazsın."], [1570.0, "Ehl-i Sünnet'in akîdelerini isbat etmede dayandığı ilk şey Kitap ve Sünnet'tir."], [1574.8, "Aklı da tâbi olarak işin içine katabilirler, ama onu ilk elden ve müstakil olarak katmazlar. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[1588.0, "أحسن الله إليكم. الكلية الثانية والعشرون:"], [1594.0, "كلُّ ما تشابه من الأدلة فالواجبُ ردُّه إلى المحكم منها."]], "tr": [[1588.0, "Allah size iyilik etsin. Yirmi ikinci külliye:"], [1594.0, "Delillerden müteşâbih olan her şeyi, onların muhkem olanına döndürmek vâciptir."]]}, {"reader": false, "ar": [[1604.0, "كلُّ ما تشابه من الأدلة فالواجبُ ردُّه إلى المحكم منها."], [1614.2, "<span class=\"note\">(يكررها)<\/span> نعم، أقول وبالله التوفيق:"], [1621.0, "إن من ابتلاء الله عز وجل لعباده أنه يعمد إلى شيءٍ من الأبواب العقدية أو الفقهية،"], [1629.0, "ويجعل أدلتها منقسمةً إلى قسمين:"], [1633.0, "إلى أدلةٍ قطعيةٍ يقينيةِ الدلالة،"], [1635.7, "واضحةٍ وظاهرةٍ لمن أراد الله هدايته للحقّ في هذا الباب،"], [1641.0, "ويجعل فيها شيئًا من الأدلة المتشابهة الخفية المشكلة،"], [1646.2, "التي يجعلها الله سببًا لإضلال من أراد إضلاله بإرادته الكونية."]], "tr": [[1604.0, "Delillerden müteşâbih olan her şeyi, onların muhkem olanına döndürmek vâciptir."], [1610.3, "(Tekrar ediyor.) Evet. Tevfik Allah'tandır, derim ki:"], [1621.5, "Allah Teâlâ'nın kullarını imtihan etmesindendir ki, itikadî veya fıkhî bablardan birini ele alır ve onun delillerini iki kısma ayırır:"], [1631.4, "Bu babda hakka hidayet etmeyi dilediği kimse için delâleti kesin ve yakînî, açık ve belirgin deliller;"], [1640.5, "bir de onun içine, kevnî iradesiyle saptırmayı dilediği kimseyi saptırmaya sebep kıldığı, gizli ve müşkil bazı müteşâbih deliller koyar."]]}, {"reader": false, "ar": [[1655.0, "فينقسم الناس في النظر في هذا الباب ـ باعتبار نوع أدلته ـ إلى قسمين:"], [1665.0, "إلى من أراد الله هدايته،"], [1668.5, "فيجعل ـ انتبه ـ فيجعل المتشابهَ مردودًا إلى المحكم،"], [1675.0, "ويعتمد هذه الكلية في النظر في الأدلة؛"], [1680.0, "فإذا جاء في الباب دليلٌ محكمٌ ومتشابه فدائمًا يعمل بهذه الكلية العظيمة،"], [1689.0, "فيردّ متشابهَ الأدلة إلى محكمها،"], [1692.3, "ومحتمَلَها إلى صريحها وقاطعها."]], "tr": [[1655.0, "İnsanlar bu babda —delillerinin türü itibarıyla— bakış bakımından iki kısma ayrılır:"], [1661.8, "Birincisi Allah'ın hidayet etmeyi dilediği kimsedir;"], [1667.8, "o —dikkat et— müteşâbihi muhkeme döndürür ve delillere bakarken bu külliyeye dayanır."], [1677.1, "Babda muhkem bir delil ile müteşâbih bir delil gelirse, daima bu büyük külliyeyle amel eder:"], [1687.2, "Delillerin müteşâbihini muhkemine, ihtimalli olanını sarih ve kesin olanına döndürür."]]}, {"reader": false, "ar": [[1695.0, "وأما من في قلبه زيغٌ ممن أراد الله عز وجل إضلاله بإرادته الكونية فإنه لا يُبصر قلبُه إلا المتشابهَ من الأدلة،"], [1707.9, "ويعمى عن الإحكام الوارد فيها،"], [1711.0, "كما قال الله عز وجل:"], [1713.8, "<span class=\"ayah\">﴿هُوَ الَّذِي أَنزَلَ عَلَيْكَ الْكِتَابَ مِنْهُ آيَاتٌ مُّحْكَمَاتٌ هُنَّ أُمُّ الْكِتَابِ وَأُخَرُ مُتَشَابِهَاتٌ﴾<\/span> <span class=\"ref\">[آل عمران: ٧]<\/span>."]], "tr": [[1695.0, "Allah Teâlâ'nın kevnî iradesiyle saptırmayı dilediği, kalbinde eğrilik bulunan kimseye gelince, onun kalbi delillerden yalnızca müteşâbih olanı görür, onlardaki muhkemliğe karşı kör olur."], [1708.5, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [1711.6, "<span class=\"ayah\">﴿Sana Kitab'ı indiren O'dur. Onun bazı ayetleri muhkemdir, bunlar Kitab'ın anasıdır; diğerleri de müteşâbihtir﴾<\/span> [Âl-i İmrân 7]."]]}, {"reader": false, "ar": [[1721.0, "ثم قسّم الله عز وجل التعاملَ مع هذا الإحكام والتشابه إلى قسمين:"], [1726.0, "<span class=\"ayah\">﴿فَأَمَّا الَّذِينَ فِي قُلُوبِهِمْ زَيْغٌ فَيَتَّبِعُونَ مَا تَشَابَهَ مِنْهُ ابْتِغَاءَ الْفِتْنَةِ وَابْتِغَاءَ تَأْوِيلِهِ﴾<\/span>،"], [1733.0, "بمعنى أن عيونهم تعمى عن المحكم،"], [1736.6, "ولا تُبصر إلا المتشابه،"], [1739.0, "فيكدّرون صفوَ الإحكام بعَكَر التشابه."], [1747.0, "<span class=\"ayah\">﴿وَمَا يَعْلَمُ تَأْوِيلَهُ إِلَّا اللَّهُ ۗ وَالرَّاسِخُونَ فِي الْعِلْمِ يَقُولُونَ آمَنَّا بِهِ كُلٌّ مِّنْ عِندِ رَبِّنَا﴾<\/span> <span class=\"ref\">[آل عمران: ٧]<\/span>."]], "tr": [[1721.0, "Sonra Allah Teâlâ bu muhkemlik ve müteşâbihlikle muameleyi iki kısma ayırdı:"], [1725.2, "<span class=\"ayah\">﴿Kalplerinde eğrilik olanlar, fitne çıkarmak ve onu te'vil etmek arzusuyla onun müteşâbih olanına uyarlar﴾<\/span>;"], [1731.9, "yani gözleri muhkeme karşı kör olur, yalnızca müteşâbihi görürler ve muhkemliğin berraklığını müteşâbihliğin tortusuyla bulandırırlar."], [1740.6, "<span class=\"ayah\">﴿Onun te'vilini ancak Allah bilir. İlimde derinleşenler ise \"Ona iman ettik, hepsi Rabbimizin katındandır\" derler﴾<\/span> [Âl-i İmrân 7]."]]}, {"reader": false, "ar": [[1756.0, "فطريقةُ الراسخين في العلم هي دفعُ التشابه بالإحكام،"], [1763.0, "ودفعُ الاحتمال بالصريح القاطع."], [1767.0, "فمثلًا يأتيك رجلٌ يقول في قول النبي ﷺ:"], [1776.0, "«إن الله خلق آدم على صورته» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [1779.0, "فيوجد عنده إشكالٌ بأن صفات الله كصفاتنا،"], [1783.5, "وأن صورة الله كصورنا؛"], [1786.0, "هذا فيه تشابه، وهذا من الأحاديث التي وقع التشابه فيها عند كثيرٍ من الناس."], [1796.0, "لكن يجب عليك ـ كمسلمٍ سنّي ـ أن لا تقف عند المتشابه في هذا الحديث ـ"]], "tr": [[1756.0, "İlimde derinleşenlerin yolu, müteşâbihliği muhkemlikle, ihtimali de sarih ve kesin olanla defetmektir."], [1764.7, "Mesela sana bir adam gelir ve Nebî ﷺ'in \"Allah Âdem'i kendi suretinde yarattı\" <span class=\"note\">(Buhârî, Müslim)<\/span> sözü hakkında konuşur;"], [1779.6, "kafasında, Allah'ın sıfatlarının bizim sıfatlarımız gibi, Allah'ın suretinin bizim suretlerimiz gibi olduğuna dair bir müşkil oluşur."], [1790.5, "Burada müteşâbihlik vardır; bu, birçok insan nezdinde müteşâbihliğin meydana geldiği hadislerdendir."], [1796.0, "Ama sünnî bir Müslüman olarak sana düşen, bu hadisteki müteşâbih noktada durup kalmamaktır —"]]}]}, {"ts": "30:00", "title": "22. Külliye (devam): Suret hadisi, sahabenin adaleti, cemaat namazı", "paras": [{"reader": false, "ar": [[1801.0, "لأن عندك في نفس المسألة أدلةً تقطع مماثلةَ الله بخلقه:"], [1807.0, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span>، فانقطع التشابه في «خلق آدم على صورته»."], [1812.0, "لا يمكن أن أقف عند هذا التشابه،"], [1817.0, "وأترك الإحكامَ القاطع في نفي المماثلة في قول الله عز وجل:"], [1822.0, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>، وفي قوله عز وجل:"], [1827.0, "<span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [1828.0, "وفي قوله: <span class=\"ayah\">﴿فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ﴾<\/span> <span class=\"ref\">[النحل: ٧٤]<\/span>،"], [1831.0, "وفي قوله: <span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>، أي: شبيهًا ونظيرًا."]], "tr": [[1801.0, "— çünkü aynı meselede, Allah'ın mahlûkatına benzerliğini kesip atan deliller vardır:"], [1806.4, "<span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span>."], [1809.0, "Böylece \"Âdem'i kendi suretinde yarattı\" (ifadesindeki) müteşâbihlik kesilip atıldı."], [1812.0, "Bu müteşâbihlik karşısında durup, benzerliği nefyetme konusundaki kesin muhkemliği bırakmam mümkün değildir:"], [1818.5, "Allah Teâlâ'nın <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11] sözünde, <span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4] sözünde, <span class=\"ayah\">﴿Allah'a misaller getirmeyin﴾<\/span> [Nahl 74] sözünde ve <span class=\"ayah\">﴿O'nun adaşı (benzeri) olan birini biliyor musun?﴾<\/span> [Meryem 65] sözünde;"], [1833.0, "yani bir benzer ve bir eş."]]}, {"reader": false, "ar": [[1836.0, "وأما الزائغون فيتركون هذه الدلالة،"], [1842.0, "ويعكّر صفوَ قلوبهم وعقيدتهم:"], [1845.0, "«إن الله خلق آدم على صورته»."], [1848.0, "أفهمتم هذا؟ فالتشابه في هذا الحديث يجب أن يكون مدفوعًا بالإحكام،"], [1856.0, "بالأدلة ـ بالأدلة الدالّة على نفي مماثلة الله عز وجل لخلقه."]], "tr": [[1836.0, "Eğri yoldakiler ise bu delâleti bırakırlar ve \"Allah Âdem'i kendi suretinde yarattı\" (hadisi) kalplerinin ve akîdelerinin berraklığını bulandırır."], [1851.5, "Bunu anladınız mı? Bu hadisteki müteşâbihlik muhkemlikle, delillerle —Allah Teâlâ'nın mahlûkatına benzerliğinin nefyine delâlet eden delillerle— defedilmelidir."]]}, {"reader": false, "ar": [[1861.0, "ومثالٌ آخر: تأتيك الأدلةُ الصريحة القاطعة المحكمة في عدالة الصحابة،"], [1871.0, "وأن الله <span class=\"ayah\">﴿رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ﴾<\/span> <span class=\"ref\">[التوبة: ١٠٠]<\/span>،"], [1874.0, "وتلك التزكيةُ العظيمة الربانية لهؤلاء القوم،"], [1878.0, "فيأتينا إنسانٌ يكدّر علينا صفوَها ـ صفوَها،"], [1885.0, "صفوَها ـ ببعض التصرّفات التي صدرت من الصحابة،"], [1891.0, "وتبقى تصرّفاتٍ جزئيةً تُنسب إلى بشريتهم لا إلى دينهم."]], "tr": [[1861.0, "Başka bir örnek: Sahabenin adaleti hakkında, <span class=\"ayah\">﴿Allah onlardan razı olmuş, onlar da O'ndan razı olmuşlardır﴾<\/span> [Tevbe 100] (ayeti hakkında) sarih, kesin ve muhkem deliller ve o topluluk için Rabbânî büyük tezkiye sana gelir."], [1878.0, "Sonra bir insan gelip sahabeden sâdır olan bazı davranışlarla bu berraklığı —bu berraklığı, bu berraklığı— bize bulandırır."], [1891.0, "Oysa bunlar, dinlerine değil beşerî yönlerine nispet edilen cüz'î davranışlar olarak kalır."]]}, {"reader": false, "ar": [[1897.0, "وأما السنّي فلا يمكن أن تكدّر عليه هذه التصرّفاتُ الجزئية التي صدرت من هذا الجيل الطيب المزكّى من الله عز وجل،"], [1909.0, "ويقف عند أن الصحابة كلَّهم عدولٌ ثقاتٌ أثبات،"], [1913.0, "لا كان ولا يكون مثلُهم أبدًا."], [1917.0, "لماذا؟ وقوفًا عند الأدلة المحكمة في تزكيتهم والثناء عليهم."]], "tr": [[1897.0, "Sünnî ise, Allah Teâlâ tarafından tezkiye edilmiş bu güzel nesilden sâdır olan bu cüz'î davranışların (işini) bulandırması mümkün değildir."], [1906.8, "O, sahabenin hepsinin âdil, güvenilir ve sağlam olduğu, onların bir benzerinin ne geldiği ne de geleceği noktasında durur."], [1916.3, "Neden? Onların tezkiyesi ve övülmesi hakkındaki muhkem delillerde durduğu için."]]}, {"reader": false, "ar": [[1921.0, "ولكن من حكمة الله في كل باب أن يضع أدلةً محكمةً يهتدي بها من أراد هدايته،"], [1930.0, "وأدلةً متشابهةً يضلّ بها من أراد إضلاله."], [1934.0, "<span class=\"ayah\">﴿وَمَن يَهْدِ اللَّهُ فَهُوَ الْمُهْتَدِ﴾<\/span> <span class=\"ref\">[الإسراء: ٩٧]<\/span>،"], [1938.0, "وقال الله عز وجل:"], [1941.1, "<span class=\"ayah\">﴿وَمَن يُضْلِلْ﴾<\/span> ـ <span class=\"ayah\">﴿وَمَن يُرِدِ اللَّهُ فِتْنَتَهُ فَلَن تَمْلِكَ لَهُ مِنَ اللَّهِ شَيْئًا﴾<\/span> <span class=\"ref\">[المائدة: ٤١]<\/span>."]], "tr": [[1921.0, "Ama her babda Allah'ın hikmetindendir ki, hidayet etmeyi dilediği kimsenin kendisiyle hidayet bulacağı muhkem deliller ve saptırmayı dilediği kimseyi kendisiyle saptıracağı müteşâbih deliller koyar."], [1931.1, "<span class=\"ayah\">﴿Allah kime hidayet ederse, hidayete eren odur﴾<\/span> [İsrâ 97]."], [1935.6, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿Kimi de saptırırsa…﴾<\/span> — <span class=\"ayah\">﴿Allah kimin fitneye düşmesini dilerse, sen onun için Allah'a karşı hiçbir şey yapamazsın﴾<\/span> [Mâide 41]."]]}, {"reader": false, "ar": [[1949.0, "بل وهذا حتى في الفقه؛"], [1951.0, "فإن صلاة الجماعة فيها أدلةٌ محكمةٌ قاطعةٌ من الكتاب والسنة تدلّ على فرضيتها ووجوبها،"], [1963.0, "ولكن في نفس الباب أدلةٌ تدلّ على عدم الوجوب؛"], [1968.0, "فيأتي الراسخُ في العلم فيتعامى عن التشابه،"], [1971.0, "ويقف قلبُه وبصرُ عينه عند المحكمات."], [1974.0, "ولي رسالةٌ تضرب أمثلةً كثيرةً جدًّا في قضية الإحكام والتشابه."]], "tr": [[1949.0, "Hatta bu fıkıhta bile böyledir:"], [1950.6, "Cemaatle namazın farz ve vâcip olduğuna delâlet eden, Kitap ve Sünnet'ten muhkem ve kesin deliller vardır;"], [1963.0, "ama aynı babda vâcip olmadığına delâlet eden deliller de vardır."], [1968.0, "İlimde derinleşen kişi gelir, müteşâbihe gözlerini kapar;"], [1971.0, "kalbi ve gözünün bakışı muhkemlerde durur."], [1973.5, "Muhkemlik ve müteşâbihlik meselesinde çok sayıda örnek veren bir risalem vardır."]]}, {"reader": false, "ar": [[1984.0, "فطريقةُ الراسخين في العلم ـ في العقائد والعبادات،"], [1988.0, "والأقوال والأعمال، باطنًا وظاهرًا ـ هي نسفُ التشابه بالإحكام،"], [1993.0, "وردُّ المحتمل إلى الصريح القاطع،"], [1997.0, "وأن لا تقف قلوبُنا ولا أفكارُنا ولا آراؤنا عند التشابه فنَزِلَّ في حُفَرٍ كثيرة."], [2004.0, "وهذا من جملة مزالق الاعتقاد،"], [2008.0, "وهي الوقوف عند المتشابهات وترك المحكمات؛"], [2013.0, "هذا من مزالق الاعتقاد:"], [2014.0, "الوقوف عند المتشابهات وترك المحكمات."], [2018.0, "وكأن هذه الكليات تبيّن لك شيئًا من مزالق الاعتقاد."]], "tr": [[1984.0, "İlimde derinleşenlerin —akîdelerde ve ibadetlerde, sözlerde ve amellerde, iç ve dışta— yolu, müteşâbihliği muhkemlikle kökünden sökmek, ihtimalliyi sarih ve kesin olana döndürmektir;"], [1998.5, "kalplerimizin, düşüncelerimizin ve görüşlerimizin müteşâbihte durup kalmaması ve böylece birçok çukura kaymamamızdır."], [2004.8, "Bu da itikadın kaygan zeminlerindendir:"], [2008.8, "müteşâbihlerde durup muhkemleri bırakmak. Bu, itikadın kaygan zeminlerindendir:"], [2014.0, "müteşâbihlerde durup muhkemleri bırakmak. Sanki bu külliyeler sana itikadın kaygan zeminlerinden bazılarını açıklıyor."]]}, {"reader": true, "ar": [[2023.0, "أحسن الله إليكم. القاعدة ـ الكلية الثالثة والعشرون:"], [2029.0, "كلُّ من ابتغى غير الإسلام دينًا فلن يُقبل منه."]], "tr": [[2023.0, "Allah size iyilik etsin. Kaide, yirmi üçüncü külliye:"], [2029.0, "İslâm'dan başka bir din arayan herkesin (dini) asla kabul edilmez."]]}, {"reader": false, "ar": [[2035.0, "كلُّ من ابتغى غير الإسلام دينًا فلن يُقبل منه."], [2040.0, "نعم، أقول وبالله التوفيق:"], [2047.0, "المتقرّر في القواعد أن الحقّ في الأصول والفروع عند الله عز وجل واحدٌ لا يتعدّد،"], [2054.1, "ويتخرّج على هذه القاعدة الدينُ الذي يقبله الله عز وجل؛"], [2062.0, "فالله عز وجل لا يقبل من الدين إلا ما كان مبنيًّا على ساق الكتاب والسنة،"], [2077.0, "وهو دين الإسلام، كما قال الله عز وجل:"], [2081.0, "<span class=\"ayah\">﴿إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ﴾<\/span> <span class=\"ref\">[آل عمران: ١٩]<\/span>،"], [2084.0, "وقال الله عز وجل:"], [2086.3, "<span class=\"ayah\">﴿وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ﴾<\/span> <span class=\"ref\">[آل عمران: ٨٥]<\/span>."]], "tr": [[2035.0, "İslâm'dan başka bir din arayan herkesin (dini) asla kabul edilmez."], [2039.4, "Evet. Tevfik Allah'tandır, derim ki:"], [2047.0, "Kaidelerde yerleşmiş olan şudur: Usûlde ve fürûda Allah Teâlâ katında hak birdir, çoğalmaz."], [2052.6, "Allah Teâlâ'nın kabul ettiği din de bu kaide üzerine bina edilir."], [2058.2, "Allah Teâlâ dinden ancak Kitap ve Sünnet'in gövdesi üzerine kurulmuş olanı kabul eder;"], [2067.3, "o da İslâm dinidir. Nitekim Allah Teâlâ şöyle buyurmuştur:"], [2077.3, "<span class=\"ayah\">﴿Şüphesiz Allah katında din İslâm'dır﴾<\/span> [Âl-i İmrân 19]."], [2081.0, "Allah Teâlâ yine şöyle buyurmuştur:"], [2084.0, "<span class=\"ayah\">﴿Kim İslâm'dan başka bir din ararsa, ondan asla kabul edilmez﴾<\/span> [Âl-i İmrân 85]."]]}, {"reader": false, "ar": [[2091.0, "والإسلام ينقسم إلى قسمين:"], [2093.8, "إلى إسلامٍ عامّ، وإلى إسلامٍ خاصّ."], [2099.0, "فالإسلام العامّ هو الاستسلام لله بالطاعة ـ"]], "tr": [[2091.0, "İslâm iki kısma ayrılır: umumi İslâm ve hususi İslâm."], [2097.3, "Umumi İslâm, itaatle Allah'a teslim olmaktır —"]]}]}, {"ts": "35:00", "title": "23. Külliye (devam): Umumi ve hususi İslâm · 24. Külliye: Ehl-i Sünnet dışındaki her itikadî mezhep bâtıldır", "paras": [{"reader": false, "ar": [[2104.0, "هو الاستسلامُ لله بالتوحيد،"], [2106.8, "والانقيادُ له بالطاعة، والخلوصُ من الشرك،"], [2114.0, "وهو دينُ كلّ الأنبياء على الإطلاق؛"], [2119.0, "فآدم بُعث بالإسلام العامّ المبنيّ على هذه الأركان الثلاثة،"], [2126.0, "وإدريس بُعث بهذا الإسلام العامّ،"], [2132.0, "وإبراهيم وموسى وعيسى ومن قبلهم من الأنبياء بُعثوا بهذا الإسلام العامّ."]], "tr": [[2104.0, "— o, tevhid ile Allah'a teslim olmak, itaatle O'na boyun eğmek ve şirkten arınmaktır."], [2115.5, "Bu, istisnasız bütün peygamberlerin dinidir."], [2119.0, "Âdem bu üç rükün üzerine kurulu umumi İslâm ile gönderildi;"], [2126.0, "İdrîs bu umumi İslâm ile gönderildi;"], [2132.0, "İbrâhîm, Mûsâ, Îsâ ve onlardan önceki peygamberler bu umumi İslâm ile gönderildiler."]]}, {"reader": false, "ar": [[2142.0, "ولذلك يقول الله عز وجل عن إبراهيم وبنيه من الأنبياء:"], [2147.0, "<span class=\"ayah\">﴿وَاشْهَدْ بِأَنَّا مُسْلِمُونَ﴾<\/span> <span class=\"ref\">[آل عمران: ٥٢]<\/span> <span class=\"note\">(Şeyh bu sözü İbrahim ve oğullarına nispet ediyor; Âl-i İmrân 52'de bu söz havarilere aittir. İbrahim hakkındaki benzer ifade Bakara 131–133'tedir.)<\/span>، ويقول موسى عليه الصلاة والسلام:"], [2152.6, "<span class=\"ayah\">﴿وَأَنَا أَوَّلُ الْمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٤٣]<\/span>، ويقول الله عز وجل عن نبيه ﷺ:"], [2163.0, "<span class=\"ayah\">﴿قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ ۝ لَا شَرِيكَ لَهُ ۖ وَبِذَٰلِكَ أُمِرْتُ وَأَنَا أَوَّلُ الْمُسْلِمِينَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٦٢–١٦٣]<\/span>."]], "tr": [[2142.0, "Bu yüzden Allah Teâlâ, İbrâhîm ve peygamber olan oğulları hakkında <span class=\"ayah\">﴿Şahit ol ki biz Müslümanlarız﴾<\/span> [Âl-i İmrân 52] der."], [2149.0, "Mûsâ (a.s.) <span class=\"ayah\">﴿Ben müminlerin ilkiyim﴾<\/span> [A'râf 143] der."], [2153.3, "Allah Teâlâ Peygamberi ﷺ hakkında şöyle buyurur:"], [2158.1, "<span class=\"ayah\">﴿De ki: Şüphesiz namazım, ibadetlerim (kurbanım), hayatım ve ölümüm âlemlerin Rabbi Allah içindir. O'nun hiçbir ortağı yoktur. Ben bununla emrolundum ve ben Müslümanların ilkiyim﴾<\/span> [En'âm 162–163]."]]}, {"reader": false, "ar": [[2172.0, "وأطلق إبراهيمُ على نفسه الإسلام،"], [2175.0, "وأطلق نوحٌ على نفسه الإسلام،"], [2177.0, "وأطلق عيسى على نفسه الإسلام،"], [2180.0, "وكلُّ الأنبياء إنما بُعثوا بهذا الدين،"], [2184.0, "الذي معناه الاستسلام لله بالتوحيد،"], [2188.0, "والانقياد له بالطاعة، والخلوص من الشرك."]], "tr": [[2172.0, "İbrâhîm kendisi için \"İslâm\" (Müslüman) nitelemesini kullandı;"], [2175.0, "Nûh kendisi için İslâm nitelemesini kullandı;"], [2177.0, "Îsâ kendisi için İslâm nitelemesini kullandı."], [2180.0, "Bütün peygamberler ancak bu dinle gönderildiler;"], [2183.3, "bunun manası tevhid ile Allah'a teslim olmak, itaatle O'na boyun eğmek ve şirkten arınmaktır."]]}, {"reader": false, "ar": [[2192.0, "وأما الإسلام الخاصّ فهو الإسلام الذي بُعث به محمدٌ ﷺ،"], [2201.0, "فهو الإسلام الذي بُعث به محمدٌ ﷺ،"], [2211.0, "ولا تختلف شريعتُه عن شرائع الأنبياء من قبله إلا في الأمور العملية،"], [2218.8, "لا الأمور العقدية؛ فعقائد الأنبياء واحدة،"], [2226.2, "وأما شرائعهم فإنها مختلفة."], [2230.0, "فالتوحيد الذي بُعث به أولُ الأنبياء والرسل هو عينُه التوحيد الذي خُتم به آخرُ الأنبياء والرسل."]], "tr": [[2192.0, "Hususi İslâm ise Muhammed ﷺ'in gönderildiği İslâm'dır;"], [2197.4, "Muhammed ﷺ'in gönderildiği İslâm'dır. Onun şeriatı, kendisinden önceki peygamberlerin şeriatlarından itikadî işlerde değil, ancak amelî işlerde farklıdır."], [2219.3, "Peygamberlerin akîdeleri birdir, şeriatları ise farklıdır."], [2228.5, "Peygamberlerin ve resullerin ilkinin gönderildiği tevhid, peygamberlerin ve resullerin sonuncusuyla mühürlenen tevhidin ta kendisidir."]]}, {"reader": false, "ar": [[2240.0, "وعلى ذلك قولُ الله عز وجل:"], [2242.9, "<span class=\"ayah\">﴿وَمَا أَرْسَلْنَا مِن قَبْلِكَ مِن رَّسُولٍ إِلَّا نُوحِي إِلَيْهِ أَنَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدُونِ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٥]<\/span>،"], [2250.0, "وقال الله عز وجل:"], [2251.3, "<span class=\"ayah\">﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾<\/span> <span class=\"ref\">[النحل: ٣٦]<\/span>،"], [2255.0, "ويقول النبي ﷺ: «إنا معاشرَ الأنبياء إخوةٌ لعَلّات، دينُنا واحد، وشرائعُنا مختلفة»،"], [2264.0, "وقال الله عز وجل:"], [2265.8, "<span class=\"ayah\">﴿لِكُلٍّ جَعَلْنَا مِنكُمْ شِرْعَةً وَمِنْهَاجًا﴾<\/span> <span class=\"ref\">[المائدة: ٤٨]<\/span>."], [2268.0, "فالأنبياء لا يختلفون إلا في أمور الفقه والعمل،"], [2272.0, "وأما أمور الاعتقاد والتوحيد فإنها واحدة."]], "tr": [[2240.0, "Allah Teâlâ'nın şu sözü de buna dayanır:"], [2242.4, "<span class=\"ayah\">﴿Senden önce hiçbir resul göndermedik ki ona \"Benden başka ilah yoktur; öyleyse bana ibadet edin\" diye vahyetmiş olmayalım﴾<\/span> [Enbiyâ 25]."], [2249.5, "Allah Teâlâ yine şöyle buyurmuştur:"], [2251.0, "<span class=\"ayah\">﴿Andolsun, her ümmete \"Allah'a ibadet edin ve tâğuttan kaçının\" diye bir resul gönderdik﴾<\/span> [Nahl 36]."], [2254.7, "Nebî ﷺ de şöyle buyurur:"], [2258.5, "\"Biz peygamberler topluluğu baba bir kardeşleriz (anneleri ayrı kardeşleriz);"], [2262.5, "dinimiz birdir, şeriatlarımız farklıdır.\" Allah Teâlâ şöyle buyurmuştur:"], [2265.8, "<span class=\"ayah\">﴿Her biriniz için bir şeriat ve bir yol belirledik﴾<\/span> [Mâide 48]."], [2270.0, "Peygamberler ancak fıkıh ve amel işlerinde ayrılırlar;"], [2272.8, "itikad ve tevhid işleri ise birdir."]]}, {"reader": false, "ar": [[2277.0, "فكلُّ من ابتغى دينًا غير دين الإسلام فإن الله عز وجل لا يقبله؛"], [2285.0, "فالله لا يقبل دينَ النصرانية بعد بعثة النبي ﷺ،"], [2290.0, "ولا دينَ اليهودية بعد بعثة النبي ﷺ،"], [2295.0, "ولا دينَ الصابئة بعد بعثة النبي عليه الصلاة والسلام،"], [2299.0, "ولا غيرَها من الأديان المنتشرة في الأرض."], [2303.0, "فمن جاء بدين الإسلام فالله عز وجل يكتبه من أهل النجاة والقبول،"], [2310.0, "وأما من جاء بدينٍ غيره فإنه مكتوبٌ من أهل العذاب والخسارة. والله أعلم."]], "tr": [[2277.0, "İslâm dininden başka bir din arayan herkesi Allah Teâlâ kabul etmez."], [2283.2, "Allah, Nebî ﷺ'in gönderilmesinden sonra Hristiyanlık dinini kabul etmez;"], [2287.5, "Nebî ﷺ'in gönderilmesinden sonra Yahudilik dinini kabul etmez;"], [2295.0, "Nebî (aleyhissalâtü vesselâm)'ın gönderilmesinden sonra Sâbiîlik dinini de, yeryüzünde yaygın olan diğer dinleri de kabul etmez."], [2302.4, "İslâm diniyle gelen kimseyi Allah Teâlâ kurtuluş ve kabul ehlinden yazar;"], [2308.8, "ondan başka bir dinle gelen ise azap ve hüsran ehlinden yazılmıştır. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[2319.0, "أحسن الله إليكم. الكلية الرابعة والعشرون:"], [2324.0, "كلُّ مذهبٍ عقديٍّ غير مذهب أهل السنة والجماعة والسلف الصالح فباطل."]], "tr": [[2319.0, "Allah size iyilik etsin. Yirmi dördüncü külliye:"], [2324.0, "Ehl-i Sünnet ve'l-Cemaat'in ve selef-i sâlihînin mezhebi dışındaki her itikadî mezhep bâtıldır."]]}, {"reader": false, "ar": [[2332.0, "كلُّ مذهبٍ عقديٍّ غير مذهب أهل السنة والجماعة والسلف الصالح فباطل."], [2342.5, "<span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [2349.0, "وهذا يتخرّج على قاعدتنا بأن الحقّ عند الله عز وجل واحدٌ لا يتعدّد،"], [2356.0, "وعلى قاعدة رفض التعدّدية العقدية؛"], [2360.0, "فالمتقرّر في القواعد عندنا أن التعدّدية العقدية مرفوضة،"], [2365.0, "وأما التعدّدية الفقهية فمقبولة."]], "tr": [[2332.0, "Ehl-i Sünnet ve'l-Cemaat'in ve selef-i sâlihînin mezhebi dışındaki her itikadî mezhep bâtıldır."], [2342.5, "(Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [2350.1, "Bu, Allah Teâlâ katında hakkın bir olduğu, çoğalmadığı kaidemize ve itikadî çoğulculuğun reddi kaidesine dayanır."], [2359.2, "Bizim kaidelerimizde yerleşmiş olan şudur:"], [2362.5, "İtikadî çoğulculuk reddedilir, fıkhî çoğulculuk ise kabul edilir."]]}, {"reader": false, "ar": [[2368.0, "فنحن نقبل في الفقه أن ينقسم الناس إلى حنفيٍّ وشافعيٍّ ومالكيٍّ وحنبلي؛"], [2374.0, "فالانقسام الفقهي أمرٌ قد أجمعت عليه الأمة،"], [2382.0, "وليس هو من الأمور الممنوعة عندنا مطلقًا."], [2387.0, "ولكن الانقسام العقدي هو المرفوض عندنا؛"], [2393.0, "فالحقّ عند الله عز وجل في مسائل الاعتقاد إنما هو واحدٌ لا يتعدّد ـ"]], "tr": [[2368.0, "Fıkıhta insanların Hanefî, Şâfiî, Mâlikî ve Hanbelî olarak ayrılmasını kabul ederiz."], [2374.0, "Fıkhî ayrışma, ümmetin üzerinde icmâ ettiği bir iştir ve bizce kesinlikle yasak işlerden değildir."], [2388.5, "Ama itikadî ayrışma bizce reddedilendir."], [2394.1, "İtikad meselelerinde Allah Teâlâ katında hak birdir, çoğalmaz —"]]}]}, {"ts": "40:00", "title": "24. Külliye (devam): Hak Ehl-i Sünnet ile döner · 25. Külliye: \"Ümmetim\" icâbet ümmetidir", "paras": [{"reader": false, "ar": [[2400.0, "وهذا الحقّ يدور مع أهل السنة والجماعة،"], [2404.4, "والطائفة المنصورة، والفرقة الناجية،"], [2406.9, "وأهل الحديث والأثر، حيثما داروا."], [2410.0, "فلا تجد عقيدةً من العقائد التي يقرّرونها إلا وهي موصوفةٌ بأنها الحقّ المطلق؛"], [2419.0, "فليس في مذهب أهل السنة الباطلُ المطلق ولا مطلقُ الباطل."], [2425.0, "وأما المذاهب الأخرى ففيها الحقّ وفيها الباطل،"], [2430.0, "وبعضها قد يكون حقُّها أكثرَ من باطلها،"], [2433.0, "وبعضها يكون باطلُها أكثرَ من حقّها،"], [2436.0, "ولكن لا تجد الحقّ المحض إلا عند أهل السنة والجماعة."]], "tr": [[2400.0, "Bu hak, Ehl-i Sünnet ve'l-Cemaat, Mansûr Tâife (Allah'ın yardım ettiği topluluk), Fırka-i Nâciye (kurtuluşa eren fırka) ve Ehl-i Hadis ve'l-Eser ile, onlar nereye dönerse onlarla birlikte döner."], [2415.4, "Onların takrir ettiği akîdelerden hiçbirini bulamazsın ki mutlak hak olmakla nitelenmesin."], [2422.6, "Ehl-i Sünnet'in mezhebinde ne mutlak bâtıl ne de bâtılın herhangi bir derecesi vardır."], [2430.0, "Diğer mezheplerde ise hem hak hem bâtıl vardır."], [2433.0, "Bazılarının hakkı bâtılından fazla olabilir, bazılarının bâtılı hakkından fazladır."], [2437.0, "Ama saf hakkı ancak Ehl-i Sünnet ve'l-Cemaat'te bulursun."]]}, {"reader": false, "ar": [[2441.0, "ولذلك فكلُّ مذهبٍ عقديٍّ غير مذهب أهل السنة والجماعة فهو مذهبٌ باطل،"], [2448.0, "ودليلُ بطلانه قولُ النبي ﷺ:"], [2454.0, "«وستفترق هذه الأمة على ثلاثٍ وسبعين فرقة، كلُّها في النار إلا واحدة. قالوا: مَن يا رسول الله؟ قال: ما أنا عليه وأصحابي»."], [2467.0, "فكلُّ من كان على مثل ما كان عليه النبي ﷺ وأصحابه فهو من أهل النجاة،"], [2476.0, "وأما من خالف الكتاب أو السنة،"], [2478.7, "أو خالف فهمَ سلف الأمة،"], [2481.0, "فإنه يوصف بالخسران على قدر مخالفته للحقّ."]], "tr": [[2441.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat'in mezhebi dışındaki her itikadî mezhep bâtıl bir mezheptir."], [2447.3, "Bâtıllığının delili Nebî ﷺ'in şu sözüdür:"], [2454.8, "\"Bu ümmet yetmiş üç fırkaya ayrılacak;"], [2460.0, "biri hariç hepsi ateştedir. 'Ey Allah'ın Resûlü, o kimdir?' dediler."], [2463.6, "'Benim ve ashâbımın üzerinde olduğu şey(in üzerinde olanlar)' buyurdu.\" Nebî ﷺ ve ashâbının üzerinde olduğu şeyin benzeri üzerinde olan herkes kurtuluş ehlindendir."], [2476.0, "Kitab'a veya Sünnet'e aykırı davranan ya da ümmetin selefinin anlayışına aykırı davranan kimse ise, hakka aykırılığı ölçüsünde hüsranla nitelenir."]]}, {"reader": false, "ar": [[2487.0, "وهذا ليس من حصر الحقّ في طائفةٍ دون طائفة،"], [2493.0, "ولا من باب التحكّم وإخراج الناس من النور إلى الظلمات،"], [2500.0, "وليس من باب الهوى،"], [2501.8, "وإنما من باب الحقّ الواقع."], [2504.0, "فأعطوني طائفةً تقول في كل أبواب الاعتقاد بما يوافق الكتاب والسنة وفهم الصحابة؛"], [2512.0, "فإن ذلك غيرُ موجودٍ إلا في مذهب أهل السنة والجماعة."], [2516.0, "فإذًا كلُّ الفرق موعودةٌ بالنار إلا أهل السنة والجماعة،"], [2521.0, "كلُّ الفرق موعودةٌ بالنار إلا أهل السنة والجماعة."]], "tr": [[2487.0, "Bu, hakkı bir tâifeye hasredip diğerini dışlamak değildir;"], [2491.7, "keyfî hükmetmek ve insanları nurdan karanlıklara çıkarmak kabilinden de değildir;"], [2498.6, "heva kabilinden de değildir; bilakis vâki olan hak kabilindendir."], [2503.1, "Bana itikadın bütün bablarında Kitap, Sünnet ve sahabenin anlayışına uygun olanı söyleyen bir tâife gösterin;"], [2511.5, "bu, Ehl-i Sünnet ve'l-Cemaat'in mezhebinden başkasında mevcut değildir."], [2514.8, "Demek ki Ehl-i Sünnet ve'l-Cemaat hariç bütün fırkalar ateşle tehdit edilmiştir;"], [2520.2, "Ehl-i Sünnet ve'l-Cemaat hariç bütün fırkalar ateşle tehdit edilmiştir."]]}, {"reader": false, "ar": [[2527.0, "ومذهب أهل السنة والجماعة مبنيٌّ على ثلاثة أركان،"], [2531.0, "مبنيٌّ على ثلاثة أركان؛"], [2535.0, "ومذهب أهل السنة والجماعة مبنيٌّ على ثلاثة أركان:"], [2539.0, "الأول: ألّا نأخذ معتقداتنا إلا من الكتاب والسنة،"], [2545.0, "ألّا نأخذ معتقداتنا إلا من الكتاب والسنة."], [2552.0, "ثانيًا: ألّا نفهم الكتاب والسنة إلا على فهم السلف الصالح ـ أخذنا هذه ولّا لا؟"], [2559.0, "ـ أن لا نفهم الكتاب والسنة إلا على فهم السلف الصالح."], [2563.0, "الثالث: أن لا نتخوّض بعقولنا في الغيبيات استقلالًا."]], "tr": [[2527.0, "Ehl-i Sünnet ve'l-Cemaat'in mezhebi üç rükün üzerine kuruludur, üç rükün üzerine kuruludur;"], [2535.0, "Ehl-i Sünnet ve'l-Cemaat'in mezhebi üç rükün üzerine kuruludur."], [2540.0, "Birincisi: İnançlarımızı ancak Kitap ve Sünnet'ten almak;"], [2545.0, "inançlarımızı ancak Kitap ve Sünnet'ten almak."], [2552.0, "İkincisi: Kitap ve Sünnet'i ancak selef-i sâlihînin anlayışı üzere anlamak —bunu aldık mı, almadık mı?— Kitap ve Sünnet'i ancak selef-i sâlihînin anlayışı üzere anlamak."], [2563.7, "Üçüncüsü: Aklımızla gaybîlere müstakil olarak dalmamak."]]}, {"reader": false, "ar": [[2569.0, "فكلُّ من بنى عقيدته على هذه الأركان والأصول الثلاثة فهو سنّيٌّ موعودٌ بالنجاة في الدنيا من العقائد الفاسدة،"], [2583.0, "وموعودٌ بالنجاة يوم القيامة من العذاب في النار."], [2586.0, "وأما من بنى عقيدته على عقله،"], [2590.1, "أو على مزاجه، أو على استحسانات نفسه،"], [2597.0, "أو على الرؤى والمنامات وغيرها،"], [2601.0, "أو كان يفهم أدلة الاعتقاد على غير فهم الصحابة ومن تبعهم بإحسان،"], [2606.0, "أو كان يتخوّض بعقله في باب الغيبيات استكشافًا لكيفيتها،"], [2612.0, "فإنه ليس من أهل النجاة أبدًا،"], [2613.8, "لا في هذه الدنيا ولا في الآخرة،"], [2616.0, "بشهادة النصّ. والله أعلم."]], "tr": [[2569.0, "Akîdesini bu üç rükün ve asıl üzerine kuran herkes, dünyada fâsid akîdelerden kurtuluş, kıyamet günü de ateşteki azaptan kurtuluş vaat edilmiş bir sünnîdir."], [2585.2, "Akîdesini aklı, keyfi, nefsinin beğenileri, rüyalar, düşler ve benzerleri üzerine kuran;"], [2592.8, "ya da itikad delillerini sahabenin ve onlara güzellikle tâbi olanların anlayışından başka bir anlayışla anlayan;"], [2604.3, "ya da keyfiyetini keşfetmek için aklıyla gaybîler babına dalan kimse ise, nassın şahitliğiyle, ne bu dünyada ne de âhirette asla kurtuluş ehlinden değildir. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[2619.0, "أحسن الله إليكم. الكلية الخامسة والعشرون:"], [2623.0, "كلُّ حديثٍ فيه «أمّتي» فيُراد به أمّةُ الإجابة لا أمّةُ الدعوة."]], "tr": [[2619.0, "Allah size iyilik etsin. Yirmi beşinci külliye:"], [2623.0, "İçinde \"ümmetim\" geçen her hadiste, davet ümmeti değil icâbet ümmeti kastedilir."]]}, {"reader": false, "ar": [[2636.0, "كلُّ حديثٍ فيه «أمّتي» فيُراد به أمّةُ الإجابة لا أمّةُ الدعوة."], [2644.0, "أقول وبالله التوفيق: اعلم أن الأمة التي تُضاف إلى النبي ﷺ تنقسم إلى قسمين:"], [2650.0, "إلى أمّة الإجابة، وإلى أمّة الدعوة."], [2653.0, "فإن قلت: وماذا تقصد بأمّة الدعوة؟"], [2656.7, "فأقول: هم كلُّ من جاء بعد النبي ﷺ ولم يدخل في دينه؛"], [2663.0, "كاليهود الذين جاؤوا بعد بعثته،"], [2666.3, "فهم من أمّة الدعوة،"], [2669.0, "والنصارى الذين جاؤوا من بعد بعثته ولم يؤمنوا به،"], [2674.0, "فإنهم من أمّة الدعوة."]], "tr": [[2636.0, "İçinde \"ümmetim\" geçen her hadiste, davet ümmeti değil icâbet ümmeti kastedilir."], [2642.9, "Tevfik Allah'tandır, derim ki: Bil ki Nebî ﷺ'e izafe edilen ümmet iki kısma ayrılır:"], [2649.6, "icâbet ümmeti (daveti kabul edenler) ve davet ümmeti (davetin ulaştırıldığı herkes)."], [2655.7, "\"Davet ümmeti ile neyi kastediyorsun?\" dersen, derim ki:"], [2659.1, "Onlar Nebî ﷺ'den sonra gelip onun dinine girmeyen herkestir."], [2665.0, "Mesela onun gönderilmesinden sonra gelen Yahudiler davet ümmetindendir;"], [2670.1, "onun gönderilmesinden sonra gelip ona iman etmeyen Hristiyanlar da davet ümmetindendir."]]}, {"reader": false, "ar": [[2676.0, "فكلُّ من جاء بعد بعثة النبي ﷺ،"], [2681.0, "ولكن كفر بدعوة رسول الله ﷺ ولم يدخل في الإسلام،"], [2687.0, "فإنه من أمّة الدعوة."], [2690.0, "فإن قلت: وماذا تقصد بأمّة الإجابة؟"], [2693.8, "فأقول: هم كلُّ من جاء بعده وآمن به؛"], [2699.0, "فكلُّ من آمن بالنبي ﷺ فهو من أمّة الإجابة."]], "tr": [[2676.0, "Nebî ﷺ'in gönderilmesinden sonra gelip de Resûlullah ﷺ'in davetini inkâr eden ve İslâm'a girmeyen herkes davet ümmetindendir."], [2688.5, "\"İcâbet ümmeti ile neyi kastediyorsun?\" dersen, derim ki:"], [2693.8, "Onlar ondan sonra gelip ona iman eden herkestir."], [2699.0, "Nebî ﷺ'e iman eden herkes icâbet ümmetindendir."]]}]}, {"ts": "45:00", "title": "25. Külliye (devam) · 26. Külliye: Ümmetin fırkaları ateştedir, biri hariç", "paras": [{"reader": false, "ar": [[2704.0, "ومن المعلوم أن أمّة الدعوة أكثرُ من أمّة الإجابة،"], [2711.0, "لقول النبي ﷺ: «وما أنتم في أهل الشرك إلا كالشعرة البيضاء في جلد الثور الأسود»،"], [2720.0, "أو قال: «الشعرة السوداء في جلد الثور الأحمر» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [2724.0, "وأمّة الإجابة سوف تنقسم إلى ثلاثٍ وسبعين فرقة،"], [2734.0, "وكلُّها في النار إلا فرقةً واحدة."], [2738.0, "وهذا يدلّك على أن أهل النجاة هم الأكثر أو الأقلّ؟"], [2743.0, "الجواب: هم الأقلّ في كل زمان،"], [2747.0, "لقول الله عز وجل:"], [2749.0, "<span class=\"ayah\">﴿وَقَلِيلٌ مِّنْ عِبَادِيَ الشَّكُورُ﴾<\/span> <span class=\"ref\">[سبأ: ١٣]<\/span>،"], [2751.0, "وقول الله عز وجل:"], [2753.7, "<span class=\"ayah\">﴿وَمَا آمَنَ مَعَهُ إِلَّا قَلِيلٌ﴾<\/span> <span class=\"ref\">[هود: ٤٠]<\/span>."]], "tr": [[2704.0, "Bilinen bir şeydir ki davet ümmeti, icâbet ümmetinden daha çoktur."], [2711.0, "Çünkü Nebî ﷺ şöyle buyurmuştur:"], [2715.8, "\"Siz şirk ehli içinde ancak siyah öküzün derisindeki beyaz kıl gibisiniz\" ya da \"kırmızı öküzün derisindeki siyah kıl gibisiniz\" buyurdu <span class=\"note\">(Buhârî, Müslim)<\/span>."], [2725.5, "İcâbet ümmeti de yetmiş üç fırkaya ayrılacaktır;"], [2734.7, "biri hariç hepsi ateştedir. Bu sana kurtuluş ehlinin çoğunluk mu azınlık mı olduğunu gösterir?"], [2742.0, "Cevap: Her zamanda azınlıktırlar. Çünkü Allah Teâlâ şöyle buyurmuştur:"], [2747.0, "<span class=\"ayah\">﴿Kullarımdan şükredenler azdır﴾<\/span> [Sebe' 13]."], [2749.5, "Allah Teâlâ yine şöyle buyurmuştur:"], [2751.7, "<span class=\"ayah\">﴿Onunla birlikte pek azı iman etmişti﴾<\/span> [Hûd 40]."]]}, {"reader": false, "ar": [[2757.0, "إذا علمت هذا فاعلم أن كلَّ أمّةٍ أُضيفت إلى النبي ﷺ في الأحاديث فلا يُراد بها أمّة الدعوة،"], [2770.5, "وإنما يُراد بها أمّة الإجابة؛"], [2773.0, "كقوله في الحديث السابق:"], [2775.7, "«وستفترق أمّتي»، فالمقصود بهذا الافتراق إنما هو افتراق أمّة الإجابة لا أمّة الدعوة."], [2785.0, "وكذلك في قوله: «لكلّ نبيٍّ دعوةٌ مستجابة، وإني اختبأتُ دعوتي شفاعةً لأمّتي، فهي نائلةٌ ـ يوم القيامة ـ فهي نائلةٌ إن شاء الله من مات من أمّتي لا يشرك بالله شيئًا» <span class=\"note\">(Buhârî, Müslim)<\/span>؛"], [2805.0, "والمقصود بها أمّة الإجابة لا أمّة الدعوة."]], "tr": [[2757.0, "Bunu bildiysen, bil ki hadislerde Nebî ﷺ'e izafe edilen her ümmetle davet ümmeti değil, icâbet ümmeti kastedilir."], [2770.5, "Önceki hadisteki \"Ümmetim ayrılacak\" sözü gibi;"], [2773.7, "bu ayrılıktan kasıt davet ümmetinin değil, icâbet ümmetinin ayrılmasıdır."], [2781.5, "Aynı şekilde şu sözünde de:"], [2784.5, "\"Her peygamberin kabul edilen bir duası vardır."], [2791.2, "Ben ise duamı ümmetime şefaat olarak sakladım."], [2795.8, "O —kıyamet günü— inşallah ümmetimden Allah'a hiçbir şeyi ortak koşmadan ölen kimseye ulaşacaktır.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Burada kastedilen davet ümmeti değil, icâbet ümmetidir."]]}, {"reader": false, "ar": [[2808.0, "وكقوله ﷺ: «إن أمّتي يُدعَون يوم القيامة غُرًّا محجَّلين» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [2816.4, "يقصد بها أمّة الدعوة ـ عفوًا ـ يقصد بها أمّة الإجابة لا أمّة الدعوة."], [2823.0, "أنا أخطأت في الأوائل ولّا ماشي؟"], [2826.0, "يقصد بها أمّة الإجابة لا أمّة الدعوة."], [2829.0, "وهذه كليةٌ تنفعنا كثيرًا في مسائل الاعتقاد،"], [2833.0, "لأن أمّة الدعوة غيرُ مخاطَبةٍ بقوله:"], [2837.3, "«أمّتي»؛ فهذه إضافةُ تشريفٍ وتكريم،"], [2841.0, "وأمّة الدعوة لا تستحقّ هذا التشريف ولا هذا التكريم،"], [2844.3, "لأنها لم تؤمن برسالته. والله أعلم. نعم."]], "tr": [[2808.0, "Nebî ﷺ'in şu sözü gibi:"], [2813.4, "\"Ümmetim kıyamet günü (abdest izlerinden dolayı) yüzleri ve elleri ayakları parlak olarak çağrılacaktır.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Bununla davet ümmetini kastediyor —pardon— bununla davet ümmetini değil, icâbet ümmetini kastediyor."], [2825.0, "Öncekilerde hata yaptım mı, yoksa doğru mu gidiyor?"], [2828.1, "Bununla davet ümmetini değil, icâbet ümmetini kastediyor."], [2830.7, "Bu külliye itikad meselelerinde bize çok fayda verir;"], [2834.4, "çünkü davet ümmeti \"ümmetim\" sözünün muhatabı değildir."], [2838.8, "Bu, şereflendirme ve ikram izafetidir;"], [2841.3, "davet ümmeti ise bu şereflendirmeyi ve ikramı hak etmez, çünkü onun risaletine iman etmedi."], [2845.6, "Allah en iyisini bilir. Evet."]]}, {"reader": true, "ar": [[2848.0, "أحسن الله إليكم. الكلية السادسة والعشرون:"], [2853.0, "كلُّ فِرَق الأمة في النار إلا من كان على ما كان عليه النبي ﷺ وأصحابه."]], "tr": [[2848.0, "Allah size iyilik etsin. Yirmi altıncı külliye:"], [2853.0, "Ümmetin bütün fırkaları ateştedir; Nebî ﷺ ve ashâbının üzerinde olduğu şeyin üzerinde olanlar hariç."]]}, {"reader": false, "ar": [[2862.0, "كلُّ فِرَق الأمة في النار إلا من كان على ما كان عليه النبي ﷺ وأصحابه."], [2877.2, "<span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [2885.0, "نعني بهذه الكلية أمّةَ الإجابة؛"], [2889.0, "وأما أمّة الدعوة فإنهم كفارٌ يدخلون النار من أبوابها،"], [2895.0, "كما قال الله عز وجل:"], [2897.3, "<span class=\"ayah\">﴿قِيلَ ادْخُلُوا أَبْوَابَ جَهَنَّمَ خَالِدِينَ فِيهَا﴾<\/span> <span class=\"ref\">[الزمر: ٧٢]<\/span>."], [2900.0, "وأما أمّة الإجابة فإنهم متوعَّدون بالنار التي لا توجب الخلودَ الأبديَّ المطلق كخلود الكفار."]], "tr": [[2862.0, "Ümmetin bütün fırkaları ateştedir; Nebî ﷺ ve ashâbının üzerinde olduğu şeyin üzerinde olanlar hariç."], [2868.8, "(Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [2885.0, "Bu külliyeyle icâbet ümmetini kastediyoruz."], [2888.3, "Davet ümmetine gelince, onlar ateşe kapılarından girecek kâfirlerdir."], [2893.7, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [2895.9, "<span class=\"ayah\">﴿\"Ebedî kalmak üzere cehennemin kapılarından girin\" denildi﴾<\/span> [Zümer 72]."], [2900.0, "İcâbet ümmeti ise, kâfirlerin ebedîliği gibi mutlak ve ebedî kalmayı gerektirmeyen bir ateşle tehdit edilmiştir."]]}, {"reader": false, "ar": [[2911.0, "فأمّة الإجابة إذا دخلوا النار فإنما يدخلونها مطلقَ الدخول،"], [2921.0, "ويُخلَّدون فيها مطلقَ الخلود،"], [2926.0, "لا الدخولَ المطلق أو الخلودَ المطلق،"], [2928.0, "لأنهم يموتون ومعهم أصلُ الإيمان والإسلام."], [2934.0, "والمتقرّر في القواعد ـ كما سيأتينا ـ أن كلَّ من مات ومعه أصلُ الإيمان والإسلام فمآلُه إلى الجنة،"], [2941.0, "وإن طال زمنُ عذابه في جهنم."]], "tr": [[2911.0, "İcâbet ümmeti ateşe girerse, oraya ancak mutlak-ı duhûl (bir tür giriş) ile girer ve orada mutlak-ı hulûd (bir süre uzun kalış) ile kalır;"], [2926.7, "duhûl-i mutlak (tam giriş) veya hulûd-ı mutlak (tam ebedîlik) ile değil."], [2931.1, "Çünkü onlar yanlarında imanın ve İslâm'ın aslı olduğu hâlde ölürler."], [2937.0, "Kaidelerde yerleşmiş olan —ileride geleceği üzere— şudur:"], [2938.9, "Yanında imanın ve İslâm'ın aslı olduğu hâlde ölen herkesin varacağı yer, cehennemdeki azabının süresi uzasa bile, cennettir."]]}, {"reader": false, "ar": [[2943.0, "فالأشاعرة والماتريدية والمعتزلة والخوارج،"], [2954.0, "هؤلاء متوعَّدون بقول النبي ﷺ:"], [2959.0, "«كلُّها في النار». وهذا من باب الشهادات العامة،"], [2965.0, "ويُتوسَّع في الشهادات العامة ما لا يُتوسَّع في الشهادات التعيينية الخاصة،"], [2970.0, "ويجوز عمومًا ما لا يجوز تعيينًا."], [2973.0, "فكلُّ من خالف عقيدة أهل السنة والجماعة ـ أيًّا كانت مخالفته ـ فهو مستحقٌّ للنار،"], [2980.0, "لكن قد يعفو الله عز وجل عنه،"], [2982.0, "لأنه يكون يوم القيامة من أصحاب الكبائر."]], "tr": [[2943.0, "Eş'arîler, Mâtürîdîler, Mu'tezile ve Hâricîler;"], [2954.0, "bunlar Nebî ﷺ'in \"Hepsi ateştedir\" sözüyle tehdit edilmişlerdir."], [2960.8, "Bu, umumi şahitlikler babındandır. Umumi şahitliklerde, tayin eden hususi şahitliklerde genişlik tanınmayan şeylerde genişlik tanınır;"], [2969.5, "umumi olarak caiz olan, tayin ederek caiz olmayabilir."], [2973.5, "Ehl-i Sünnet ve'l-Cemaat'in akîdesine —aykırılığı ne olursa olsun— aykırı olan herkes ateşi hak etmiştir;"], [2980.3, "ama Allah Teâlâ onu affedebilir, çünkü o kıyamet günü büyük günah sahiplerinden olacaktır."]]}, {"reader": false, "ar": [[2985.0, "وعقيدتنا في أصحاب الكبائر أنهم إما أن يغفر الله لهم ويُدخلهم الجنة ابتداءً،"], [2991.0, "أو يعذّبهم في النار بقدر كبيرتهم ثم يُخرجهم منها إلى الجنة انتقالًا."], [2997.0, "لكن بالعموم أنهم مستحقّون للعذاب؛"], [3001.0, "وقضيةُ دخولهم من عدمها،"], [3003.2, "أو طولِ بقائهم من عدمه،"], [3006.0, "هذا مردُّه إلى الله تبارك وتعالى."]], "tr": [[2985.0, "Büyük günah sahipleri hakkındaki akîdemiz şudur:"], [2987.4, "Allah ya onları bağışlar ve doğrudan cennete sokar, ya da onlara büyük günahları ölçüsünde ateşte azap eder, sonra onları oradan geçişle cennete çıkarır."], [2997.0, "Ama umumi olarak azabı hak etmişlerdir."], [3001.0, "Girip girmemeleri ya da (orada) uzun kalıp kalmamaları meselesi ise Tebâreke ve Teâlâ olan Allah'a havale edilir."]]}]}, {"ts": "50:00", "title": "26. Külliye (sonu) · 27. Külliye: Her itikadî fesadın sebebi aşırılıktır", "paras": [{"reader": false, "ar": [[3009.0, "فكلُّ الطوائف الم
