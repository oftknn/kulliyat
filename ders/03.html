إلى الكتاب والسنة فهو معصوم."], [5951.0, "فيحقّ لنا أن نقولها بملء فينا:"], [5954.0, "إن مذهب أهل السنة وعقائدَه معصومة،"], [5957.0, "لأنها مستندةٌ إلى أدلة الكتاب والسنة،"], [5960.0, "وهي معصومة. فمذهبُ الطائفة المنصورة،"], [5962.8, "وأهل الحديث والأثر، والفرقة الناجية،"], [5965.9, "أهل السنة والجماعة، يوصف بالعصمة؛"], [5969.0, "لأنه في كل كلياته وجزئياته وفروعه،"], [5973.0, "وأوائله وآخره، مستندٌ إلى الكتاب والسنة،"], [5976.9, "والمستندُ إلى المعصوم معصوم."]], "tr": [[5933.0, "Tevfik Allah'tandır, derim ki: Masum ile Kitap ve Sünnet'ten oluşan vahiy delilini kastediyorum."], [5946.5, "Akîdelerinde Kitap ve Sünnet'e dayanan her mezhep masumdur."], [5950.5, "Bu yüzden ağız dolusu şunu söylemek bizim hakkımızdır:"], [5954.0, "Ehl-i Sünnet'in mezhebi ve akîdeleri masumdur;"], [5956.5, "çünkü Kitap ve Sünnet'in delillerine dayanır, onlar da masumdur."], [5960.5, "Mansûr Tâife'nin, Ehl-i Hadis ve'l-Eser'in, Fırka-i Nâciye'nin, yani Ehl-i Sünnet ve'l-Cemaat'in mezhebi ismetle nitelenir;"], [5968.4, "çünkü bütün küllî ve cüz'î meselelerinde, dallarında, başında ve sonunda Kitap ve Sünnet'e dayanır. Masuma dayanan da masumdur."]]}, {"reader": false, "ar": [[5981.0, "وأما مذاهبُ بقية الفِرَق،"], [5982.6, "فلأنها لا تستند إلى الكتاب والسنة،"], [5985.1, "أو لا تستند إلى فهم سلف الأمة،"], [5988.0, "فإنها ليست بمعصومة؛ فما وافق الحقّ فهو معصومٌ لا لذاته،"], [5994.8, "وإنما لموافقته للمعصوم، وما وافق المعصومَ فهو معصوم. والكلام واضح."]], "tr": [[5981.0, "Diğer fırkaların mezheplerine gelince, Kitap ve Sünnet'e dayanmadıkları ya da ümmetin selefinin anlayışına dayanmadıkları için masum değildirler."], [5988.0, "(Onlarda) hakka uygun olan masumdur;"], [5991.4, "ama kendi zatı itibarıyla değil, masuma uygunluğu itibarıyla."], [5998.5, "Masuma uygun olan masumdur. Söz açıktır."]]}]}, {"ts": "1:40:00", "title": "38. Külliye (devam) · 39. Külliye: Bütün sahih deliller birbiriyle uyumludur", "paras": [{"reader": false, "ar": [[6002.0, "ولعصمته ـ أي لعصمة منهج أهل السنة ـ فإنه باقٍ،"], [6008.3, "تتعاقبه القرونُ والأجيال، ولا يختلف،"], [6011.5, "ولا يزيد ولا ينقص."], [6014.0, "ويؤلّف فيه المؤلّفون من كل الأمصار،"], [6021.0, "وكأنك إذا قرأت كتبهم كأنّ الذي ألّفها واحد:"], [6028.8, "فيؤلَّف كتابٌ في العقيدة في الأندلس،"], [6033.0, "بينما يؤلَّف في مشرق الأرض كتابٌ في نفس الاعتقاد،"], [6039.0, "فإذا قرأتهما وجدت العقيدةَ والأدلةَ وأوجهَ الاستدلال والنقولَ واحدةً لا تختلف."]], "tr": [[6002.0, "Masum oluşu sebebiyle —yani Ehl-i Sünnet'in menhecinin masum oluşu sebebiyle— o bâkidir;"], [6008.9, "asırlar ve nesiller birbiri ardınca ona gelir;"], [6012.7, "o ise değişmez, ne artar ne eksilir."], [6017.1, "Her şehirden müellifler onun hakkında eser yazarlar;"], [6023.5, "onların kitaplarını okuduğunda sanki onları yazan tek bir kişidir."], [6030.9, "Endülüs'te akîdeye dair bir kitap yazılır, yeryüzünün doğusunda da aynı itikada dair bir kitap yazılır;"], [6039.6, "ikisini okuduğunda akîdenin, delillerin, istidlal yönlerinin ve nakillerin bir olduğunu, farklılaşmadığını görürsün."]]}, {"reader": false, "ar": [[6045.0, "بينما تجد أن الخوارج بدأت واحدةً ثم توزّعت إلى فرقٍ شتّى،"], [6052.0, "فلو كان مذهبها معصومًا لما تمزّقت وتفرّقت؛"], [6056.0, "والمعتزلة كانت واحدةً ثم تفرّقت إلى فرقٍ شتّى،"], [6061.0, "والرافضة كانت واحدةً ثم تفرّقت وتمزّقت إلى فرقٍ شتّى،"], [6067.0, "وهكذا دواليك في كل أهل البدع:"], [6070.1, "فيبدؤون متّحدين، وينتهون مختلفين متطاحنين، يكفّر بعضُهم بعضًا."]], "tr": [[6045.0, "Buna karşılık Hâricîlerin tek başladığını, sonra dağınık fırkalara bölündüğünü görürsün;"], [6051.4, "mezhepleri masum olsaydı parçalanıp dağılmazdı."], [6054.3, "Mu'tezile tekti, sonra dağınık fırkalara ayrıldı."], [6058.5, "Râfıza tekti, sonra dağınık fırkalara ayrılıp parçalandı."], [6063.0, "Bütün bid'at ehlinde durum böyledir:"], [6067.0, "Birlik hâlinde başlarlar, birbirini tekfir eden, birbiriyle boğuşan ihtilaflı gruplar olarak sona ererler."]]}, {"reader": false, "ar": [[6075.0, "وأما منهج أهل السنة والجماعة فإنه واحدٌ لا يختلف،"], [6080.0, "وفرقةٌ واحدةٌ لا تتعدّد،"], [6082.0, "وعقيدةٌ واحدةٌ لا يختلف فيها القول أبدًا؛"], [6088.0, "وما ذلك إلا لأنه استند إلى معصوم،"], [6091.0, "وما استند إلى المعصوم فهو معصوم."], [6093.5, "نسأل الله أن يجعلنا وإياكم من أهل العصمة. والله أعلم."]], "tr": [[6075.0, "Ehl-i Sünnet ve'l-Cemaat'in menheci ise değişmeyen tek bir menhectir;"], [6080.0, "çoğalmayan tek bir fırkadır; hakkında sözün asla farklılaşmadığı tek bir akîdedir."], [6088.0, "Bunun sebebi ancak masuma dayanmasıdır;"], [6090.6, "masuma dayanan da masumdur. Allah'tan bizi ve sizi ismet ehlinden kılmasını dileriz. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[6098.0, "الكلية التاسعة والثلاثون: كلُّ الأدلة الصحيحة متّفقةٌ متآلفة،"], [6106.0, "ليست بمفترقةٍ ولا مختلفة."]], "tr": [[6098.0, "Otuz dokuzuncu külliye: Bütün sahih deliller birbiriyle uyumlu ve kaynaşmıştır;"], [6106.0, "ayrışmış da çelişkili de değildir."]]}, {"reader": false, "ar": [[6110.0, "كلُّ الأدلة الصحيحة متّفقةٌ متآلفة،"], [6116.0, "ليست بمفترقةٍ ولا مختلفة."], [6123.1, "<span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [6129.6, "المتقرّر في القواعد أن الحقّ لا يعارض الحقّ؛"], [6134.0, "فإذا رأيت تعارضًا حقيقيًّا فاعلم أنه إما أن يكون بين باطلين،"], [6139.9, "أو بين باطلٍ وحقّ،"], [6142.0, "لكن إذا كان ما في الطرفين حقًّا فوالله لا يعارض الحقُّ الحقَّ أبدًا."], [6150.0, "فمتى ما صحّت النصوص فإنه لا يمكن أن تتعارض مع بعضها،"], [6156.0, "وهذه قضيةٌ مسلَّمةٌ عند أهل السنة والجماعة بإجماعهم:"], [6160.0, "أنه لا يوجد بين دليلين صحيحين صريحين تعارضٌ ذاتيٌّ حقيقيٌّ أبدًا."]], "tr": [[6110.0, "Bütün sahih deliller birbiriyle uyumlu ve kaynaşmıştır;"], [6116.8, "ayrışmış da çelişkili de değildir."], [6128.0, "(Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [6131.3, "Kaidelerde yerleşmiş olan şudur: Hak hakka muâraz olmaz (çelişmez)."], [6135.6, "Hakiki bir çelişki görürsen bil ki o ya iki bâtıl arasındadır ya da bir bâtıl ile bir hak arasındadır."], [6145.1, "Ama iki taraftaki de hak ise, vallahi hak hakka asla muâraz olmaz."], [6151.6, "Naslar sahih olduğunda birbiriyle çelişmeleri mümkün değildir."], [6154.9, "Bu, Ehl-i Sünnet ve'l-Cemaat nezdinde icmâlarıyla kabul edilmiş bir meseledir:"], [6159.5, "İki sahih ve sarih delil arasında asla zâtî ve hakiki bir çelişki yoktur."]]}, {"reader": false, "ar": [[6169.0, "ولكن قد يثور في ذهن الناظر شيءٌ من التعارض النسبيّ العرضي:"], [6174.0, "النسبيّ، أي يتفاوت بين رجلٍ وآخر؛"], [6179.0, "فقد يكون متعارضًا في حقّ فهدٍ ما ليس بمتعارضٍ في حقّ وليد،"], [6184.0, "وقد يكون متعارضًا في حقّ وليدٍ ما ليس بمتعارضٍ في حقّ إبراهيم."], [6190.0, "فالتعارض إنما هو نسبيٌّ يتفاوت الناس فيه،"], [6194.0, "وعرضيٌّ يزول بمجرّد التعلّم؛"], [6198.0, "فيأتيني الطالب والتعارضُ في ذهنه،"], [6201.0, "فإذا علّمته كيفية الحلّ زال التعارض."], [6205.0, "فلو كان التعارض بين الأدلة ذاتيًّا لما زال بالتعلّم."]], "tr": [[6169.0, "Ama bakan kişinin zihninde nispî ve arızî bir çelişki baş gösterebilir."], [6174.0, "Nispî, yani bir adamdan diğerine değişir:"], [6179.0, "Fehd için çelişkili olan, Velîd için çelişkili olmayabilir;"], [6182.3, "Velîd için çelişkili olan, İbrâhîm için çelişkili olmayabilir."], [6186.0, "Çelişki ancak insanların farklılaştığı nispî bir şeydir ve sadece öğrenmekle ortadan kalkan arızî bir şeydir."], [6194.0, "Talebe zihninde bir çelişkiyle bana gelir;"], [6199.2, "ona çözümün nasıl olduğunu öğretince çelişki ortadan kalkar."], [6204.3, "Eğer deliller arasındaki çelişki zâtî olsaydı, öğrenmekle ortadan kalkmazdı."]]}, {"reader": false, "ar": [[6211.0, "والمؤلّفات من أهل السنة والجماعة في حلّ التعارض دليلٌ على ما ذكرته في وصف التعارض في الظاهر،"], [6222.0, "من أنه نسبيٌّ عرضي،"], [6224.0, "يتفاوت من شخصٍ إلى آخر،"], [6227.0, "ويزول بالتعلّم. ولكن التعارض الذي نفيناه إجماعًا هو التعارض الذاتي الحقيقي،"], [6234.0, "الذي لا يمكن لأحدٍ كشفُه،"], [6238.0, "ولا لعالمٍ رفعُه؛ هذا لا يوجد بين دليلين صحيحين أبدًا:"], [6244.0, "لا بين آيتين، ولا بين حديثين صحيحين،"], [6249.0, "ولا بين آيةٍ وحديثٍ صحيح."]], "tr": [[6211.0, "Ehl-i Sünnet ve'l-Cemaat'in çelişkiyi çözmeye dair eserleri, zahirdeki çelişkiyi nitelerken söylediğim şeyin —yani onun nispî ve arızî olduğunun, bir kişiden diğerine değiştiğinin ve öğrenmekle ortadan kalktığının— delilidir."], [6226.4, "İcmâ ile nefyettiğimiz çelişki ise, hiç kimsenin çözemeyeceği ve hiçbir âlimin gideremeyeceği zâtî ve hakiki çelişkidir."], [6236.4, "Bu, iki sahih delil arasında asla bulunmaz:"], [6241.9, "ne iki ayet arasında, ne iki sahih hadis arasında, ne de bir ayet ile sahih bir hadis arasında."]]}, {"reader": false, "ar": [[6252.0, "وكلُّ من ادّعى التعارض فإننا نتحدّاه أن يكون تعارضًا حقيقيًّا،"], [6261.0, "ولكن لقلّة العلم، أو لقلّة البحث،"], [6267.0, "أو لضعف الطلب، أو لعدم سؤال أهل العلم،"], [6271.0, "ترى أن الأمور متعارضة؛"], [6274.0, "لكن إذا طلبت الحلّ ووجدته رأيت أن الأمر كان سهلًا يسيرًا."], [6281.0, "ولذلك نفى الله عز وجل هذا التعارض بين الأدلة الصحيحة في قوله:"], [6286.0, "<span class=\"ayah\">﴿وَلَوْ كَانَ مِنْ عِندِ غَيْرِ اللَّهِ لَوَجَدُوا فِيهِ اخْتِلَافًا كَثِيرًا﴾<\/span> <span class=\"ref\">[النساء: ٨٢]<\/span>،"], [6293.0, "أي: لوجدوا فيه اضطرابًا كثيرًا،"], [6296.6, "وتناقضًا كثيرًا، وتعارضًا كثيرًا؛"], [6299.9, "ولكن كلُّ هذا منفيٌّ لأنه من عند الله."]], "tr": [[6252.0, "Çelişki iddia eden herkese, bunun hakiki bir çelişki olduğunu (ispat etmesi için) meydan okuruz."], [6262.3, "Ama ilmin azlığından, ya da araştırmanın azlığından, ya da talebin zayıflığından, ya da ilim ehline sormamaktan dolayı işleri çelişkili görürsün."], [6275.6, "Çözümü arayıp bulduğunda ise işin kolay ve basit olduğunu görürsün."], [6281.0, "Bu yüzden Allah Teâlâ sahih deliller arasındaki bu çelişkiyi şu sözünde nefyetmiştir:"], [6285.6, "<span class=\"ayah\">﴿Eğer o Allah'tan başkasının katından olsaydı, onda birçok ihtilaf bulurlardı﴾<\/span> [Nisâ 82];"], [6293.0, "yani onda birçok karışıklık, birçok tenakuz ve birçok çelişki bulurlardı."], [6299.9, "Ama bunların hepsi nefyedilmiştir, çünkü o Allah katındandır."]]}]}, {"ts": "1:45:00", "title": "39. Külliye (devam): Nisyan örneği ve çelişki iddialarına cevap veren eserler · 40. Külliye: Şüphe imanı bozar", "paras": [{"reader": false, "ar": [[6305.0, "فالقرآن نزل من عند الله،"], [6307.0, "والسنة أيضًا كانت تنزل على النبي ﷺ كما ينزل القرآن،"], [6312.8, "كما قال الله عز وجل:"], [6315.5, "<span class=\"ayah\">﴿وَأَنزَلَ اللَّهُ عَلَيْكَ الْكِتَابَ وَالْحِكْمَةَ﴾<\/span> <span class=\"ref\">[النساء: ١١٣]<\/span> <span class=\"note\">(Şeyh «وأنزلنا عليك» diye okuyor.)<\/span>،"], [6318.0, "والحكمة في مقام الإنزال إذا قُرنت بالكتاب فالمراد بها السنة."], [6323.0, "وفي الحديث يقول النبي ﷺ:"], [6327.0, "«ألا وإني أوتيت القرآن ومثلَه معه»."], [6331.0, "فإذا كان القرآن والسنة مصدرُهما واحد،"], [6335.0, "فمن أين يأتيهما التعارض؟"], [6338.0, "ومن أين يأتيهما الاضطراب؟"]], "tr": [[6305.0, "Kur'an Allah katından inmiştir; Sünnet de Kur'an'ın indiği gibi Nebî ﷺ'e inerdi."], [6309.0, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [6312.8, "<span class=\"ayah\">﴿Allah sana Kitab'ı ve hikmeti indirdi﴾<\/span> [Nisâ 113]."], [6316.2, "Hikmet, indirme bağlamında Kitap ile birlikte zikredildiğinde, ondan kastedilen Sünnet'tir."], [6321.0, "Hadiste Nebî ﷺ şöyle buyurur:"], [6323.5, "\"Dikkat edin! Bana Kur'an ve onunla birlikte onun bir benzeri verildi.\" Kur'an ile Sünnet'in kaynağı bir olduğuna göre, onlara çelişki nereden gelsin? Onlara karışıklık nereden gelsin?"]]}, {"reader": false, "ar": [[6341.0, "قالوا لنا: في قول الله عز وجل:"], [6345.0, "<span class=\"ayah\">﴿وَمَا كَانَ رَبُّكَ نَسِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٤]<\/span> ففيه نفيٌ للنسيان عن الله،"], [6349.0, "مع قوله: <span class=\"ayah\">﴿نَسُوا اللَّهَ فَنَسِيَهُمْ﴾<\/span> <span class=\"ref\">[التوبة: ٦٧]<\/span> ففيه إثباتُ النسيان لله؛"], [6358.0, "فكيف تقول بأن لا تعارض بين الأدلة،"], [6361.0, "وآيةٌ تنفي النسيان عن الله،"], [6364.0, "وآيةٌ تُثبت النسيان لله؟"], [6366.0, "فنقول: لا إشكال في ذلك؛"], [6368.0, "فهو تعارضٌ نسبيٌّ عرضي،"], [6370.0, "قد يثور كالنار المضطرمة،"], [6373.0, "وبعد كشفه ترى أنه ليس بشيء."]], "tr": [[6341.0, "Bize şöyle dediler: Allah Teâlâ'nın <span class=\"ayah\">﴿Rabbin unutkan değildir﴾<\/span> [Meryem 64] sözünde unutmanın Allah'tan nefyi vardır;"], [6347.2, "<span class=\"ayah\">﴿Onlar Allah'ı unuttular, O da onları unuttu﴾<\/span> [Tevbe 67] sözünde ise unutmanın Allah için isbatı vardır."], [6357.5, "Bir ayet unutmayı Allah'tan nefyederken, diğer ayet unutmayı Allah için isbat ederken, deliller arasında çelişki yoktur nasıl dersin?"], [6365.0, "Deriz ki: Bunda bir müşkil yoktur."], [6367.2, "Bu nispî ve arızî bir çelişkidir;"], [6369.0, "alev alev yanan ateş gibi baş gösterebilir, ama açıklandıktan sonra bir şey olmadığını görürsün."]]}, {"reader": false, "ar": [[6377.0, "فالنسيانُ المنفيّ عن الله إنما هو نسيانُ الغفلة والذهول:"], [6381.0, "<span class=\"ayah\">﴿لَّا يَضِلُّ رَبِّي وَلَا يَنسَى﴾<\/span> <span class=\"ref\">[طه: ٥٢]<\/span>،"], [6383.0, "أي: لا يغفل ولا يذهل،"], [6385.0, "<span class=\"ayah\">﴿وَمَا كَانَ رَبُّكَ نَسِيًّا﴾<\/span>،"], [6387.7, "أي: ليس يذهل ولا يغفل؛"], [6391.0, "فالنسيان بمعنى الغفلة والذهول عن الشيء نقصٌ يجب تنزيهُ الله عنه."], [6397.0, "وأما <span class=\"ayah\">﴿نَسُوا اللَّهَ فَنَسِيَهُمْ﴾<\/span> فإن معناه نسيانُ الترك عقوبةً؛"], [6404.0, "فكما أنهم نسوا الإيمان به عنادًا واستكبارًا،"], [6410.0, "فالله يتركهم يوم القيامة،"], [6412.2, "ولا ينفعهم، ولا ينصرهم،"], [6414.4, "ولا يُدخلهم الجنة؛ فهو ينساهم بمعنى يتركهم جزاءً وعقوبة."]], "tr": [[6377.0, "Allah'tan nefyedilen unutma, gaflet ve dalgınlık unutmasıdır:"], [6379.4, "<span class=\"ayah\">﴿Rabbim ne yanılır ne unutur﴾<\/span> [Tâhâ 52], yani gaflete düşmez, dalgınlığa düşmez;"], [6383.4, "<span class=\"ayah\">﴿Rabbin unutkan değildir﴾<\/span>, yani dalgınlığa düşmez, gaflete düşmez."], [6386.3, "Bir şeyden gaflet ve dalgınlık anlamındaki unutma bir noksanlıktır;"], [6391.7, "Allah'ı ondan tenzih etmek vâciptir."], [6394.3, "<span class=\"ayah\">﴿Onlar Allah'ı unuttular, O da onları unuttu﴾<\/span> ise, ceza olarak terk etme anlamındaki unutmadır."], [6399.8, "Onlar inat ve kibirle O'na imanı unuttukları gibi, Allah da kıyamet günü onları terk eder;"], [6410.5, "onlara fayda vermez, onlara yardım etmez, onları cennete sokmaz."], [6414.4, "Yani onları karşılık ve ceza olarak terk etmek anlamında unutur."]]}, {"reader": false, "ar": [[6420.0, "وكما تدين تُدان، والجزاء من جنس العمل؛"], [6424.0, "فكما نسيتموني عن علمٍ وعمدٍ فأنساكم عن علمٍ وعمد."], [6429.0, "فالنسيان المضاف إلى الله إنما هو نسيانُ الترك عن علمٍ وعمد،"], [6434.9, "جزاءً وعقوبة، وأما النسيان المنفيّ عن الله فهو النسيان بمعنى الغفلة،"], [6440.8, "الغفلة التي هي الذهول عن الشيء."], [6444.0, "فلا إشكال في ذلك."]], "tr": [[6420.0, "Ne edersen onu bulursun; ceza amelin cinsindendir."], [6423.4, "\"Siz beni bilerek ve kasten unuttuğunuz gibi, ben de sizi bilerek ve kasten unuturum.\" Allah'a izafe edilen unutma, karşılık ve ceza olarak bilerek ve kasten terk etme anlamındaki unutmadır."], [6437.7, "Allah'tan nefyedilen unutma ise gaflet —yani bir şeyden dalgınlık olan gaflet— anlamındaki unutmadır. Bunda bir müşkil yoktur."]]}, {"reader": false, "ar": [[6445.0, "ولي مؤلّفاتٌ في هذا العلم ـ وهو كشفُ التعارض فيما يظهر بين الأدلة ـ متعدّدة:"], [6454.0, "فعندي كتابٌ اسمه «الأجوبة المنيعة في الذبّ عن أدلة الشريعة»،"], [6459.0, "وعندي كتابٌ اسمه «تآلف الوحيين»،"], [6465.0, "وذكرتُ فيه أغلبَ ما يُدندن حوله الأبالسة للتشكيك في مصادر الوحي بأنها متعارضة؛"], [6475.0, "وهو أسلوبٌ استشراقي: يبحثون في الكتاب والسنة عمّا ظاهرُه التعارض،"], [6482.0, "ويعرضونه أمام المسلمين ليُشكّكوا المسلمين في أصول دينهم من الكتاب والسنة."]], "tr": [[6445.0, "Bu ilimde —yani deliller arasında zahiren görünen çelişkiyi çözme ilminde— birçok eserim vardır:"], [6453.2, "\"el-Ecvibetü'l-Menîa fi'z-Zebbi an Edilleti'ş-Şerîa\" adında bir kitabım var;"], [6457.0, "\"Teâlüfü'l-Vahyeyn\" adında bir kitabım var."], [6459.8, "Orada iblislerin, vahyin kaynaklarının çelişkili olduğu şüphesini uyandırmak için etrafında dolandıkları şeylerin çoğunu zikrettim."], [6471.5, "Bu, oryantalist bir üsluptur: Kitap ve Sünnet'te zahiren çelişkili görünen şeyleri araştırıp Müslümanları dinlerinin usûlü olan Kitap ve Sünnet hakkında şüpheye düşürmek için onları Müslümanların önüne sererler."]]}, {"reader": false, "ar": [[6490.0, "ولكن لم يدَعْهم العلماءُ في كل زمان:"], [6492.0, "فالشافعي ألّف «اختلاف الحديث» لكشف ذلك،"], [6497.0, "والطحاوي ألّف «شرح مشكل الآثار» لكشف ذلك،"], [6501.0, "وابن قتيبة «تأويل مختلف الحديث» لكشف ذلك،"], [6507.0, "والإمام الشنقيطي في «إزالة الاضطراب عن آي الكتاب» لكشف ذلك <span class=\"note\">(Eserin bilinen adı: «دفع إيهام الاضطراب عن آيات الكتاب».)<\/span>."], [6512.0, "ولا يزال أهل السنة ـ من علمائهم وطلاب العلم فيهم ـ في كل زمان ينتدبون لهؤلاء السَّفَلة المشاغبين،"], [6521.0, "فيؤدّبونهم بالعصا الحمراء، ويكسرون حججَهم على الكتاب والسنة."]], "tr": [[6490.0, "Ama âlimler her zamanda onları (kendi hâllerine) bırakmadılar:"], [6491.7, "Şâfiî bunu çözmek için \"İhtilâfü'l-Hadîs\"i yazdı;"], [6495.1, "Tahâvî bunu çözmek için \"Şerhu Müşkili'l-Âsâr\"ı yazdı;"], [6499.3, "İbn Kuteybe bunu çözmek için \"Te'vîlü Muhtelifi'l-Hadîs\"i yazdı;"], [6504.2, "İmam Şinkîtî de bunu çözmek için \"Kitab'ın ayetlerinden ıztırabı gidermek\" (adlı eserinde) (bunu yaptı)."], [6511.0, "Ehl-i Sünnet —âlimleri ve talebeleriyle— her zamanda bu kavgacı alçaklara karşı gönüllü olarak ortaya çıkmaya, onları kızıl sopayla terbiye etmeye ve Kitap ve Sünnet'e karşı hüccetlerini kırmaya devam etmektedir."]]}, {"reader": false, "ar": [[6529.0, "فالذي أريدكم الآن أن تفقهوه:"], [6531.0, "أنه ليس بين الأدلة الصحيحة شيءٌ من التعارض ولا التناقض أبدًا."], [6537.0, "والله أعلم. آخرُ قاعدةٍ في هذا الدرس فيما أظنّ، ها؟ نعم."]], "tr": [[6529.0, "Şimdi sizden kavramanızı istediğim şudur:"], [6531.0, "Sahih deliller arasında asla hiçbir çelişki ve tenakuz yoktur."], [6535.7, "Allah en iyisini bilir. Sanırım bu derste son kaide bu, değil mi? Evet."]]}, {"reader": true, "ar": [[6542.0, "أحسن الله إليكم. الكلية الأربعون:"], [6546.0, "كلُّ ما يجب الإيمانُ به فالريبُ ينقضه ويُبطله."]], "tr": [[6542.0, "Allah size iyilik etsin. Kırkıncı külliye:"], [6545.0, "İman edilmesi vâcip olan her şeyi şüphe (rayb) bozar ve iptal eder."]]}, {"reader": false, "ar": [[6551.0, "كلُّ ما يجب الإيمانُ به فالريبُ ينقضه ويُبطله."], [6559.9, "<span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [6565.0, "إن من خصائص المسائل الإيمانية أن تقرّ في قلبك على وجه القطع واليقين،"], [6571.0, "بلا تردّدٍ ولا ريبٍ ولا شكٍّ في شيءٍ منها أبدًا."], [6575.0, "فكلُّ قضيةٍ أُمرت بالإيمان بها فمن شرط صحّتها استقرارُها في قلبك استقرارًا يقينيًّا قطعيًّا،"], [6587.0, "لا يخالطه ريبٌ ولا شكّ،"], [6589.0, "كما قال الله عز وجل:"], [6591.0, "<span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا﴾<\/span> <span class=\"ref\">[الحجرات: ١٥]<\/span>، أي: لم يشكّوا."]], "tr": [[6551.0, "İman edilmesi vâcip olan her şeyi şüphe bozar ve iptal eder."], [6564.3, "(Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [6566.8, "İmanî meselelerin özelliklerinden biri, onlardan hiçbirinde asla tereddüt, rayb ve şek olmaksızın, kesinlik ve yakîn üzere kalbinde yerleşmeleridir."], [6573.8, "İman etmekle emrolunduğun her meselenin sıhhat şartı, onun kalbinde, içine hiçbir rayb ve şekkin karışmadığı yakînî ve kesin bir şekilde yerleşmesidir."], [6587.8, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [6589.8, "<span class=\"ayah\">﴿Müminler ancak Allah'a ve Resûlü'ne iman eden, sonra da şüpheye düşmeyenlerdir﴾<\/span> [Hucurât 15]; yani şek etmeyenlerdir."]]}, {"reader": false, "ar": [[6599.0, "فالإيمان بالله ـ أي الإيمان بوجوده ـ يجب أن يكون قطعيًّا لا تردّد ولا شكّ فيه،"], [6607.0, "فكلُّ من شكّ في وجود الله أو تردّد فهو كافر."], [6611.0, "الإيمانُ بالملائكة من شرط صحّته أن يكون يقينيًّا قطعيًّا راسخًا في قلبك لا شكّ ولا تردّد فيه؛"], [6619.0, "فمتى ما شكّ قلبُك في وجود الملائكة فإنك كافر،"], [6624.0, "ويسمّيه العلماء بكفر الشكّ؛"], [6629.0, "لأن التكفير إما أن يكون بسبب قولٍ قلتَه،"], [6634.3, "أو فعلٍ فعلتَه، أو شكٍّ في قلبك شككتَه."]], "tr": [[6599.0, "Allah'a iman —yani O'nun varlığına iman— tereddüt ve şek bulunmayan kesin bir iman olmalıdır."], [6607.0, "Allah'ın varlığında şüphe eden veya tereddüt eden herkes kâfirdir."], [6610.6, "Meleklere imanın sıhhat şartı, kalbinde şek ve tereddüt bulunmayan, yakînî, kesin ve sağlam bir iman olmasıdır."], [6618.1, "Kalbin meleklerin varlığında şüpheye düştüğü anda kâfir olursun;"], [6622.3, "âlimler buna \"şek küfrü\" derler."], [6625.7, "Çünkü tekfir, ya söylediğin bir söz, ya yaptığın bir fiil ya da kalbinde taşıdığın bir şüphe sebebiyledir."]]}, {"reader": false, "ar": [[6641.0, "فمن خصائص المسائل الإيمانية استقرارُها وعدمُ الشكّ فيها."], [6647.0, "ومن شكّ في رسالة رسول الله،"], [6651.2, "واستحقاقِ نبوّته واستحقاقِه للنبوّة،"], [6654.0, "أو أنه آخر الأنبياء،"], [6656.0, "فإنه كافر. ومن شكّ في قضية البعث والجزاء فإنه كافر."], [6662.0, "ومن شكّ في بعث الناس يوم القيامة،"], [6668.0, "أو شكّ في الجنة والنار،"], [6670.5, "فإنه يُعتبر كافرًا. ومن شكّ في نبوّة نبيٍّ من الأنبياء ممن ثبتت نبوّته بالدليل الصحيح فهو كافر."]], "tr": [[6641.0, "İmanî meselelerin özelliklerinden biri, yerleşik olmaları ve onlarda şek bulunmamasıdır."], [6648.4, "Resûlullah'ın risaletinde, nübüvvetine layık oluşunda ve nübüvveti hak edişinde ya da onun son peygamber oluşunda şüphe eden kâfirdir."], [6659.5, "Diriliş ve ceza meselesinde şüphe eden kâfirdir."], [6664.2, "İnsanların kıyamet günü diriltilmesinde şüphe eden ya da cennet ve cehennemde şüphe eden kâfir sayılır."], [6674.1, "Peygamberliği sahih delille sabit olan peygamberlerden birinin peygamberliğinde şüphe eden kâfirdir."]]}, {"reader": false, "ar": [[6680.0, "فقضايا الإيمان لا تقبل التشكيك،"], [6684.0, "ولا تقبل الريب، ولا تقبل الاضطراب،"], [6687.2, "ولا تقبل كلمة: يمكن أو لا يمكن؛"], [6691.0, "وإنما يجب عليك أن تجعلها مستقرّةً في قلبك استقرارًا راسخًا أعظمَ من رسوخ الجبال الرواسي في الأرض."], [6701.0, "فحاذِرْ مما ينقضها، وهو الشكّ والريب،"], [6707.0, "كما قال الله عز وجل:"], [6709.8, "<span class=\"ayah\">﴿فَهُمْ فِي رَيْبِهِمْ يَتَرَدَّدُونَ﴾<\/span> <span class=\"ref\">[التوبة: ٤٥]<\/span>؛"], [6712.0, "لم يقطعوا بمسألة الإيمان،"], [6714.1, "ولا بصحّة نبوّة النبي ﷺ،"], [6718.3, "ولا باستحقاق الله عز وجل للعبادة دون ما سواه."], [6723.0, "فكلُّ ذلك الريب مما ينقض أصلَ الإيمان في القلب."]], "tr": [[6680.0, "İman meseleleri şüpheye düşürülmeyi kabul etmez;"], [6684.0, "raybı kabul etmez; karışıklığı kabul etmez;"], [6686.7, "\"olabilir ya da olamaz\" sözünü kabul etmez."], [6689.9, "Bilakis sana düşen, onları kalbinde, yeryüzündeki sabit dağların sağlamlığından daha büyük, sağlam bir yerleşiklikle yerleştirmendir."], [6698.1, "Onları bozan şeyden, yani şek ve şüpheden sakın."], [6702.5, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [6707.6, "<span class=\"ayah\">﴿Onlar şüpheleri içinde bocalayıp dururlar﴾<\/span> [Tevbe 45]."], [6710.9, "İman meselesinde de, Nebî ﷺ'in nübüvvetinin sahihliğinde de, Allah Teâlâ'nın kendisinden başkasının değil, yalnız kendisinin ibadete layık olduğunda da kesin bir kanaate varmadılar."], [6723.6, "Bütün bu şüpheler kalpteki imanın aslını bozan şeylerdendir."]]}, {"reader": false, "ar": [[6728.0, "هذا آخرُ درسنا، وآخرُ دعوانا أن الحمد لله رب العالمين."], [6734.0, "ونحمد الله ونشكره على التيسير والتمام،"], [6737.0, "ونسأله عز وجل أن يكلّل هذا التمام بأكمل الإخلاص وبأكمل القبول،"], [6745.0, "وأن لا يجعل في قلوبنا إلا أكملَ ما يُرضيه عنا،"], [6750.0, "وأن يجعلنا ممن نفعل ما نقول،"], [6755.0, "وأن يثبّتنا على هذا الاعتقاد الصحيح حتى نلقاه."], [6760.0, "وآخرُ دعوانا أن الحمد لله رب العالمين،"], [6763.0, "وصلى الله وسلم على نبينا محمد."]], "tr": [[6728.0, "Bu, dersimizin sonudur. Son duamız, âlemlerin Rabbi Allah'a hamddir."], [6732.8, "Kolaylaştırdığı ve tamamlattığı için Allah'a hamd ve şükrederiz."], [6737.0, "Allah Teâlâ'dan bu tamamlanışı en mükemmel ihlas ve en mükemmel kabulle taçlandırmasını, kalplerimizde kendisini bizden razı edecek en mükemmel şeyden başkasını bırakmamasını, bizi söylediğini yapanlardan kılmasını ve kendisine kavuşana kadar bizi bu sahih itikad üzere sabit kılmasını dileriz."], [6760.0, "Son duamız, âlemlerin Rabbi Allah'a hamddir."], [6762.6, "Allah Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
