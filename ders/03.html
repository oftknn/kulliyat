خالفة للكتاب والسنة ولفهم سلف الأمة قد توعّدها الشارع بأنها في النار،"], [3019.0, "والمقصود بذلك النارُ التي يدخلها أصحاب الكبائر؛"], [3023.0, "فلا يُخلَّدون فيها الخلودَ المطلق،"], [3026.0, "وإنما يُعذَّبون فيها بقدر كبائرهم العقدية،"], [3030.0, "ثم يخرجون منها إلى الجنة انتقالًا،"], [3032.8, "بعد تطهيرهم وتنقيتهم وتصفيتهم من هذه الكبائر. والله أعلم."]], "tr": [[3009.0, "Kitap ve Sünnet'e ve ümmetin selefinin anlayışına aykırı olan bütün tâifeleri Şâri' ateşte olmakla tehdit etmiştir."], [3019.0, "Bundan kasıt, büyük günah sahiplerinin girdiği ateştir."], [3023.0, "Orada mutlak ebedîlikle kalmazlar; orada ancak itikadî büyük günahları ölçüsünde azap görürler, sonra bu büyük günahlardan temizlenip arındırılıp saflaştırıldıktan sonra oradan geçişle cennete çıkarlar. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[3037.0, "أحسن الله إليكم. الكلية السابعة والعشرون:"], [3043.0, "كلُّ فسادٍ عقديٍّ فسببُه الغلوّ."]], "tr": [[3037.0, "Allah size iyilik etsin. Yirmi yedinci külliye:"], [3040.9, "Her itikadî fesadın sebebi aşırılıktır (gulüv)."]]}, {"reader": false, "ar": [[3047.0, "كلُّ فسادٍ عقديٍّ فسببُه الغلوّ."], [3053.1, "<span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [3060.0, "هذا من جملة المزالق العقدية التي استغلّها الشيطان استغلالًا عظيمًا في إفساد عقائد كثيرٍ من الناس،"], [3067.0, "وهو الغلوّ، ومعناه: مجاوزةُ الحدّ المطلوب منك."], [3073.0, "فمن أعظم الأسباب التي أهلكت الناس في عقائدهم الغلوّ؛"], [3083.0, "فالغلوّ هو بوّابة الشيطان الكبرى التي بها يُضلّ الناس ويحرفهم عن عقيدتهم."]], "tr": [[3047.0, "Her itikadî fesadın sebebi aşırılıktır."], [3053.1, "(Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [3060.9, "Bu, şeytanın birçok insanın akîdesini bozmakta büyük ölçüde istismar ettiği itikadî kaygan zeminlerdendir;"], [3066.6, "o da gulüvdür. Manası: Senden istenen sınırı aşmaktır."], [3073.0, "İnsanları akîdelerinde helak eden en büyük sebeplerden biri gulüvdür."], [3083.0, "Gulüv, şeytanın insanları onunla saptırdığı ve akîdelerinden saptırdığı en büyük kapısıdır."]]}, {"reader": false, "ar": [[3091.0, "فما أشرك قومُ نوحٍ إلا بالغلوّ في الصالحين:"], [3096.1, "من ودٍّ وسُواعٍ ويغوثَ ويعوقَ ونسرٍ؛"], [3100.0, "فقد كانت أسماءَ رجالٍ صالحين من قوم نوح،"], [3105.4, "ماتوا في فترةٍ وجيزةٍ أو متعاقبة،"], [3110.0, "فجزع عليهم أُمَمُهم، فجاء الشيطان وقال:"], [3113.9, "انصبوا إلى مجالسهم التي كانوا يجلسون فيها أنصابًا،"], [3119.0, "وسمّوها بأسمائهم، ففعلوا، ولم تُعبد،"], [3121.3, "حتى إذا هلك أولئك ونُسي العلمُ عُبدت من دون الله <span class=\"note\">(Buhârî, İbn Abbâs'tan)<\/span>."]], "tr": [[3091.0, "Nûh kavmi ancak salih kişiler hakkında gulüv ederek şirke düştü:"], [3095.5, "Vedd, Suvâ', Yegûs, Ye'ûk ve Nesr."], [3098.7, "Bunlar Nûh kavminden, kısa bir süre içinde ya da art arda ölen salih adamların isimleriydi."], [3106.0, "Toplulukları onlar için feryat edip üzüldü."], [3110.0, "Şeytan geldi ve \"Oturdukları meclislerine dikili taşlar (heykeller) dikin ve onlara bunların isimlerini verin\" dedi."], [3117.7, "Böyle yaptılar; (o zaman) onlara ibadet edilmedi."], [3120.4, "Nihayet o nesil helak olup ilim unutulunca, Allah'tan başka onlara ibadet edildi <span class=\"note\">(Buhârî, İbn Abbâs'tan)<\/span>."]]}, {"reader": false, "ar": [[3126.0, "فما عُبدت القبورُ إلا بالغلوّ،"], [3129.5, "ولا طِيف بها إلا بالغلوّ،"], [3135.0, "ولا دُعي الأمواتُ إلا بالغلوّ فيهم،"], [3141.0, "ولا عُبد عيسى عليه السلام إلا بالغلوّ،"], [3146.0, "ولا عبدت اليهودُ عُزيرًا إلا بالغلوّ،"], [3149.0, "ولا بُنيت المساجدُ على القبور إلا بالغلوّ،"], [3159.0, "ولا زُخرفت القبورُ بالرخام والسُّتُر إلا بالغلوّ."]], "tr": [[3126.0, "Kabirlere ancak gulüv sebebiyle ibadet edildi;"], [3129.5, "onların etrafında ancak gulüv sebebiyle tavaf edildi;"], [3135.8, "ölülere ancak onlar hakkında gulüv sebebiyle dua edildi;"], [3142.4, "Îsâ'ya (a.s.) ancak gulüv sebebiyle ibadet edildi;"], [3146.5, "Yahudiler Üzeyr'e ancak gulüv sebebiyle ibadet ettiler;"], [3149.7, "kabirlerin üzerine ancak gulüv sebebiyle mescitler yapıldı;"], [3159.0, "kabirler ancak gulüv sebebiyle mermer ve örtülerle süslendi."]]}, {"reader": false, "ar": [[3165.0, "ولا عُطّلت أسماءُ الله إلا بالغلوّ في جانب التعطيل،"], [3172.0, "ولا مُثّلت صفاتُه بصفات خلقه إلا بالغلوّ في جانب الإثبات،"], [3179.0, "ولا أخرجت المرجئةُ ـ انتبه ـ العملَ من مسمّى الإيمان إلا بسبب الغلوّ في عدم تأثير الذنب،"], [3191.0, "ولا أخرجت الوعيديةُ مرتكبَ الكبيرة من دائرة الإسلام إلا بالغلوّ في تأثير الذنوب والمعاصي."]], "tr": [[3165.0, "Allah'ın isimleri ancak ta'til tarafında gulüv sebebiyle ta'til edildi;"], [3170.7, "O'nun sıfatları mahlûkatının sıfatlarına ancak isbat tarafında gulüv sebebiyle benzetildi."], [3177.6, "Mürcie —dikkat et— ameli iman kavramının dışına ancak günahın etkisizliği konusunda gulüv sebebiyle çıkardı."], [3189.6, "Va'îdiyye (tehditçiler) de büyük günah işleyeni İslâm dairesinin dışına ancak günahların ve isyanların etkisi konusunda gulüv sebebiyle çıkardı."]]}, {"reader": false, "ar": [[3201.0, "ولا جبرت الجبريةُ في باب القدر،"], [3208.0, "ولا قدّرت القدريةُ ـ المعتزلةُ ـ في هذا الباب إلا بسبب الغلوّ،"], [3213.0, "ولا كُفّر الحكّامُ إلا بسبب الغلوّ في باب التكفير،"], [3223.0, "ولا أُخرج كثيرٌ من العلماء عن دائرة السنة بالتبديع إلا بسبب الغلوّ في جانب الجرح والتعديل."], [3236.0, "ولا تجد فسادًا عقديًّا ـ في الأعمّ الأغلب ـ إلا ويقف وراءه ذلك الشيطانُ الأكبر والعدوُّ الأخطر، وهو الغلوّ."]], "tr": [[3201.0, "Cebriyye kader babında cebre, Kaderiyye —yani Mu'tezile— bu babda (kulun kendi fiilini) takdire ancak gulüv sebebiyle gitti."], [3213.7, "Yöneticiler ancak tekfir babında gulüv sebebiyle tekfir edildi."], [3223.0, "Birçok âlim ancak cerh ve ta'dîl tarafında gulüv sebebiyle bid'atçılıkla itham edilip Sünnet dairesinin dışına çıkarıldı."], [3236.0, "Çoğunlukla, arkasında o en büyük şeytan ve en tehlikeli düşman olan gulüvün durmadığı hiçbir itikadî fesat bulamazsın."]]}, {"reader": false, "ar": [[3249.0, "وقد أعطانا الله عز وجل حبلَ النجاة بالوسطية،"], [3256.0, "في قول الله عز وجل:"], [3259.3, "<span class=\"ayah\">﴿وَكَذَٰلِكَ جَعَلْنَاكُمْ أُمَّةً وَسَطًا﴾<\/span> <span class=\"ref\">[البقرة: ١٤٣]<\/span>."], [3262.0, "فالوسطية حزامُ أمانٍ من الانزلاق في الغلوّ بصورتيه:"], [3269.0, "سواءٌ غلوّ الإفراط أو غلوّ التفريط."], [3272.0, "فالوسطية طريقُ هدايةٍ بين ضلالتين،"], [3278.0, "وطريقُ نورٍ بين ظلمتين؛"], [3284.0, "فمن سلك طريق الوسطية فإنه في سلامةٍ وأمنٍ من هذا المزلق العقدي الخطير."]], "tr": [[3249.0, "Allah Teâlâ bize vasatlıkla kurtuluş ipini vermiştir;"], [3253.3, "Allah Teâlâ'nın şu sözünde: <span class=\"ayah\">﴿Böylece sizi vasat (orta) bir ümmet kıldık﴾<\/span> [Bakara 143]."], [3262.0, "Vasatlık, gulüvün iki suretine —ister ifrat gulüvü ister tefrit gulüvü olsun— kaymaya karşı bir emniyet kemeridir."], [3272.0, "Vasatlık iki sapıklık arasında bir hidayet yolu, iki karanlık arasında bir nur yoludur."], [3286.0, "Vasatlık yolunu tutan, bu tehlikeli itikadî kaygan zeminden selamette ve emniyettedir."]]}, {"reader": false, "ar": [[3294.0, "انتبهوا معي، إنت ماشي معي ولّا لا؟"], [3298.0, "والوسطية ستأتينا كلياتُها إن شاء الله في الدروس القادمة."]], "tr": [[3294.0, "Benimle birlikte dikkat edin; benimle birlikte geliyor musun, gelmiyor musun?"], [3300.1, "Vasatlığın külliyeleri inşallah ileriki derslerde gelecek."]]}]}, {"ts": "55:00", "title": "27. Külliye (sonu) · 28. Külliye: Bütün itikadî işler vasatlık üzerine kurulur", "paras": [{"reader": false, "ar": [[3305.0, "ولذلك قال الله عز وجل:"], [3307.9, "<span class=\"ayah\">﴿يَا أَهْلَ الْكِتَابِ لَا تَغْلُوا فِي دِينِكُمْ﴾<\/span> <span class=\"ref\">[النساء: ١٧١]<\/span>؛"], [3312.0, "فما هلك أهلُ الكتاب في دينهم إلا بسبب الغلوّ."], [3316.0, "ولما رمى النبي ﷺ الجمرات في حجة الوداع قال:"], [3322.7, "«بمثل هذه فارموا، وإياكم والغلوّ، فإنما أهلك من كان قبلكم الغلوُّ في الدين»."]], "tr": [[3305.0, "Bu yüzden Allah Teâlâ şöyle buyurmuştur:"], [3307.9, "<span class=\"ayah\">﴿Ey Kitap ehli! Dininizde aşırı gitmeyin﴾<\/span> [Nisâ 171]."], [3312.4, "Kitap ehli dinlerinde ancak gulüv sebebiyle helak oldu."], [3315.6, "Nebî ﷺ Vedâ haccında cemreleri attığında şöyle buyurdu:"], [3322.0, "\"Bunun benzeriyle (bu büyüklükteki taşlarla) atın."], [3325.3, "Aşırılıktan sakının; sizden öncekileri ancak dinde aşırılık helak etti.\""]]}, {"reader": false, "ar": [[3329.0, "ويقول الناظم: لا تَغْلُوَنْ ـ هُدِيتَ ـ في رجلٍ ولا قبرٍ،"], [3335.0, "فتلك مصائدُ الشيطانِ؛ إن الغلوّ بليّةٌ قد أهلكتْ أممًا ـ أممًا ـ مضَوا في غابر الأزمانِ."], [3345.0, "نسأل الله أن يعافينا وإياكم من الغلوّ،"], [3349.0, "وأن يسلك بنا وإياكم طريقَ الوسطية. والله أعلم. نعم."]], "tr": [[3329.0, "Nâzım (şair) şöyle der: \"Hidayete eresin, bir adam ya da bir kabir hakkında aşırı gitme;"], [3336.3, "bunlar şeytanın tuzaklarıdır. Aşırılık öyle bir beladır ki, geçmiş zamanlarda gelip geçmiş nice ümmetleri helak etmiştir.\" Allah'tan bizi ve sizi aşırılıktan korumasını ve bizi ve sizi vasatlık yoluna iletmesini dileriz."], [3351.2, "Allah en iyisini bilir. Evet."]]}, {"reader": true, "ar": [[3353.0, "أحسن الله إليكم. الكلية الثامنة والعشرون:"], [3360.0, "كلُّ الأمور العقدية تُبنى على الوسطية."]], "tr": [[3353.0, "Allah size iyilik etsin. Yirmi sekizinci külliye:"], [3360.0, "Bütün itikadî işler vasatlık üzerine kurulur."]]}, {"reader": false, "ar": [[3365.0, "كلُّ الأمور العقدية تُبنى على الوسطية."], [3369.0, "أقول وبالله التوفيق: وهذا هو طريقُ الأمان من مزالق الغلوّ،"], [3376.0, "وقد أمرنا الله عز وجل به في قوله مادحًا له مدحًا يقتضي الأمرَ به:"], [3385.0, "<span class=\"ayah\">﴿وَكَذَٰلِكَ جَعَلْنَاكُمْ أُمَّةً وَسَطًا﴾<\/span> <span class=\"ref\">[البقرة: ١٤٣]<\/span>."], [3389.0, "فأمّة الإسلام وسطٌ بين اليهودية والنصرانية،"], [3395.0, "وأهل السنة وسطٌ بين فِرَق الأمة كوسطية الأمة بين الأمم؛"], [3401.0, "فهما وسطيتان: وسطيةٌ عامة، ووسطيةٌ خاصة."]], "tr": [[3365.0, "Bütün itikadî işler vasatlık üzerine kurulur."], [3368.3, "Tevfik Allah'tandır, derim ki: Gulüvün kaygan zeminlerinden emniyet yolu budur."], [3373.9, "Allah Teâlâ, onu emretmeyi gerektiren bir övgüyle övdüğü şu sözünde bize onu emretmiştir:"], [3380.8, "<span class=\"ayah\">﴿Böylece sizi vasat bir ümmet kıldık﴾<\/span> [Bakara 143]."], [3385.0, "İslâm ümmeti Yahudilik ile Hristiyanlık arasında vasattır;"], [3390.5, "Ehl-i Sünnet de, ümmetin ümmetler arasında vasat olması gibi, ümmetin fırkaları arasında vasattır."], [3399.2, "Demek ki iki vasatlık vardır:"], [3402.1, "umumi vasatlık ve hususi vasatlık."]]}, {"reader": false, "ar": [[3408.0, "فأما الوسطية العامة فوسطيةُ الأمة بين الأمم؛"], [3413.0, "فإن اليهود يغلب عليها الغلوّ والجفاء،"], [3419.0, "والنصارى يغلب عليها الإفراطُ والتفريط والتقصير،"], [3425.0, "وأمّة الإسلام ليس في عقائدها ولا في تعبّداتها لا إفراطٌ ولا تفريط."], [3432.0, "فالنصارى عبدوا عيسى عليه الصلاة والسلام،"], [3437.0, "واليهود لعنوه وسبّوه وجعلوه ابنَ زانية،"], [3441.0, "فجاء المسلمون وتوسّطوا فقالوا:"], [3443.9, "هو عبد الله ورسوله؛"], [3447.0, "فقولهم: «عبد الله» ردٌّ على النصارى،"], [3450.3, "وقولهم: «ورسوله» ردٌّ على اليهود."]], "tr": [[3408.0, "Umumi vasatlık, ümmetin ümmetler arasındaki vasatlığıdır."], [3411.6, "Yahudilere gulüv ve cefa (kabalık, ihmal) galiptir;"], [3416.8, "Hristiyanlara ifrat, tefrit ve kusur galiptir."], [3422.1, "İslâm ümmetinin ise ne akîdelerinde ne de ibadetlerinde ifrat da tefrit de yoktur."], [3430.8, "Hristiyanlar Îsâ'ya (a.s.) ibadet ettiler;"], [3434.3, "Yahudiler ona lanet edip söverek onu zina çocuğu saydılar."], [3440.3, "Müslümanlar gelip orta yolu tuttular ve \"O, Allah'ın kulu ve resulüdür\" dediler."], [3448.1, "\"Allah'ın kulu\" sözleri Hristiyanlara, \"ve resulü\" sözleri Yahudilere reddiyedir."]]}, {"reader": false, "ar": [[3453.0, "وأفرط اليهود في مسألة الحائض حتى هجروها،"], [3457.7, "ولم يؤاكلوها ويشاربوها، ولم يجامعوها في البيوت أبدًا؛"], [3467.0, "تبقى الحائضُ معتزلةً عنهم في غرفةٍ حتى تطهر."], [3470.0, "وفرّط النصارى حتى أجازوا جماعها."], [3474.0, "فجاءت وسطيةُ الإسلام في قول النبي ﷺ:"], [3480.0, "«اصنعوا كلَّ شيءٍ إلا النكاح» <span class=\"note\">(Müslim)<\/span>؛"], [3482.0, "فقوله: «اصنعوا كلَّ شيء» ردٌّ على اليهود الذين قالوا:"], [3486.2, "لا تصنعوا معها شيئًا،"], [3488.0, "وقوله: «إلا النكاح» ـ أي الجماع ـ ردٌّ على النصارى الذين أجازوا جماعها."]], "tr": [[3453.0, "Yahudiler hayızlı kadın meselesinde ifrata gittiler;"], [3455.7, "öyle ki ondan uzaklaştılar, onunla birlikte yiyip içmediler, onunla evlerde asla bir arada bulunmadılar;"], [3467.0, "hayızlı kadın temizlenene kadar bir odada onlardan ayrı kalırdı."], [3469.6, "Hristiyanlar ise tefrite gittiler; öyle ki onunla cinsî ilişkiyi caiz gördüler."], [3475.8, "İslâm'ın vasatlığı Nebî ﷺ'in şu sözünde geldi:"], [3481.2, "\"Nikâh (cinsî ilişki) dışında her şeyi yapın.\" <span class=\"note\">(Müslim)<\/span> \"Her şeyi yapın\" sözü, \"Onunla hiçbir şey yapmayın\" diyen Yahudilere;"], [3487.5, "\"nikâh hariç\" —yani cinsî ilişki hariç— sözü de onunla cinsî ilişkiyi caiz gören Hristiyanlara reddiyedir."]]}, {"reader": false, "ar": [[3493.0, "وانبثقت من وسطية الأمة وسطيةٌ خاصةٌ بين فِرَق الأمة،"], [3501.0, "وهي وسطية أهل السنة والجماعة؛"], [3505.0, "فتجد فِرَق الأمة غالبًا تنقسم في عقائدها إلى ثلاثة أقسام:"], [3513.0, "فرقةٌ فرّطت، وفرقةٌ أفرطت،"], [3516.1, "وفرقةٌ توسّطت؛ والفرقة المتوسّطة هي أهل السنة والجماعة."], [3525.0, "فأهل السنة والجماعة وسطٌ في باب الأسماء والصفات بين الممثّلة الذين غلوا في جانب التمثيل،"], [3534.0, "والمعطّلة الذين غلوا في جانب التنزيه."]], "tr": [[3493.0, "Ümmetin vasatlığından, ümmetin fırkaları arasında hususi bir vasatlık doğmuştur;"], [3498.7, "o da Ehl-i Sünnet ve'l-Cemaat'in vasatlığıdır."], [3504.2, "Ümmetin fırkalarının akîdelerinde çoğunlukla üç kısma ayrıldığını görürsün:"], [3509.2, "tefrite giden bir fırka, ifrata giden bir fırka ve orta yolu tutan bir fırka."], [3522.3, "Orta yolu tutan fırka Ehl-i Sünnet ve'l-Cemaat'tir."], [3526.5, "Ehl-i Sünnet ve'l-Cemaat, isim ve sıfatlar babında, temsil tarafında aşırı giden Mümessile ile tenzih tarafında aşırı giden Muattıla arasında vasattır."]]}, {"reader": false, "ar": [[3538.0, "وأهل السنة والجماعة وسطٌ في باب الإيمان بين المرجئة الذين قالوا:"], [3547.2, "لا يضرّ مع الإيمان ذنب،"], [3550.0, "وبين الوعيدية الذين أخرجوا مرتكبَ الكبيرة من دائرة الإسلام."], [3556.0, "وأهل السنة والجماعة وسطٌ في باب القدر بين الجبرية الذين سلبوا العبدَ مطلقَ الإرادة والاختيار،"], [3567.0, "وبين القدرية الذين أعطوه الاختيارَ المطلق والإرادةَ المطلقة والمشيئةَ المطلقة."]], "tr": [[3538.0, "Ehl-i Sünnet ve'l-Cemaat iman babında, \"İmanla birlikte hiçbir günah zarar vermez\" diyen Mürcie ile büyük günah işleyeni İslâm dairesinin dışına çıkaran Va'îdiyye arasında vasattır."], [3555.3, "Ehl-i Sünnet ve'l-Cemaat kader babında, kuldan her türlü irade ve seçimi alan Cebriyye ile ona mutlak seçim, mutlak irade ve mutlak meşîet veren Kaderiyye arasında vasattır."]]}, {"reader": false, "ar": [[3576.0, "ونحن وسطٌ في باب أصحاب رسول الله ﷺ وآل البيت بين النواصب الذين كفّروهم،"], [3588.0, "وبين غلاة الرافضة الذين عبدوهم ـ أقصد:"], [3592.5, "عبدوا آلَ البيت. وهكذا دواليك في سائر العقائد:"], [3599.0, "فتجد أن طائفةً من فِرَق الأمة عندها غلوٌّ في جانب الإفراط ـ"]], "tr": [[3576.0, "Biz Resûlullah ﷺ'in ashâbı ve Ehl-i Beyt babında, onları tekfir eden Nâsıbîler ile onlara ibadet eden aşırı Râfıza arasında vasatız —yani Ehl-i Beyt'e ibadet edenler."], [3594.8, "Diğer akîdelerde de durum böyledir:"], [3599.5, "Ümmetin fırkalarından bir tâifenin ifrat tarafında gulüvü olduğunu görürsün —"]]}]}, {"ts": "1:00:00", "title": "28. Külliye (sonu) · 29. Külliye: Vahyin gereği dışına çağıran İblis'in askerlerindendir", "paras": [{"reader": false, "ar": [[3605.0, "والطائفة الثانية عندها غلوٌّ في جانب التفريط،"], [3610.0, "وتجد طائفةً تُمسك العصا من الوسط دائمًا في كل الأبواب العقدية،"], [3616.5, "وهم أهل السنة والجماعة."], [3619.0, "ولي رسالةٌ في بيان هذه الوسطية،"], [3623.0, "وضربِ أمثلةٍ كثيرةٍ عليها،"], [3625.4, "لمن أراد الرجوع إليها. والله أعلم."]], "tr": [[3605.0, "— ikinci tâifenin tefrit tarafında gulüvü vardır."], [3609.3, "Bir tâifenin de bütün itikadî bablarda daima sopayı ortasından tuttuğunu görürsün;"], [3614.6, "onlar Ehl-i Sünnet ve'l-Cemaat'tir. Bu vasatlığı açıklayan ve ona dair çok sayıda örnek veren bir risalem vardır;"], [3624.2, "ona başvurmak isteyen için. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[3629.0, "فأقول: فمن كان مسلمًا فهو وسطيٌّ بالوسطية العامة،"], [3637.0, "ومن كان مسلمًا سنّيًّا سلفيًّا فهو وسطيٌّ بالوسطية العامة والخاصة."], [3644.0, "فالوسطية العامة تُنجيك من العذاب المطلق في النار،"], [3650.0, "والوسطية الخاصة تُنجيك من الخلود الأبدي في النار. والله أعلم."]], "tr": [[3629.0, "Derim ki: Müslüman olan, umumi vasatlıkla vasattır;"], [3633.3, "sünnî-selefî bir Müslüman olan ise hem umumi hem hususi vasatlıkla vasattır."], [3643.3, "Umumi vasatlık seni ateşteki mutlak azaptan kurtarır;"], [3648.3, "hususi vasatlık da seni ateşte ebedî kalmaktan kurtarır. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[3659.0, "أحسن الله إليكم. الكلية التاسعة والعشرون:"], [3666.0, "كلُّ من دعا لغير مقتضى الوحي فمن جنود إبليس."]], "tr": [[3659.0, "Allah size iyilik etsin. Yirmi dokuzuncu külliye:"], [3666.6, "Vahyin gerektirdiği şeyin dışına çağıran herkes İblis'in askerlerindendir."]]}, {"reader": false, "ar": [[3671.0, "كلُّ من دعا لغير مقتضى الوحي فمن جنود إبليس."], [3677.0, "نعم، أقول وبالله التوفيق:"], [3686.0, "إن الله عز وجل قد اتّخذ جنودًا،"], [3688.0, "فقال الله عز وجل:"], [3691.0, "<span class=\"ayah\">﴿وَإِنَّ جُندَنَا لَهُمُ الْغَالِبُونَ﴾<\/span> <span class=\"ref\">[الصافات: ١٧٣]<\/span>،"], [3693.0, "وكذلك إبليس اتّخذ جنودًا،"], [3697.0, "فقال الله عز وجل:"], [3699.5, "<span class=\"ayah\">﴿فَكُبْكِبُوا فِيهَا هُمْ وَالْغَاوُونَ ۝ وَجُنُودُ إِبْلِيسَ أَجْمَعُونَ﴾<\/span> <span class=\"ref\">[الشعراء: ٩٤–٩٥]<\/span>."]], "tr": [[3671.0, "Vahyin gerektirdiği şeyin dışına çağıran herkes İblis'in askerlerindendir."], [3675.7, "Evet. Tevfik Allah'tandır, derim ki:"], [3678.7, "Allah Teâlâ askerler edinmiştir. Allah Teâlâ şöyle buyurmuştur:"], [3687.4, "<span class=\"ayah\">﴿Şüphesiz bizim ordumuz, galip gelecek olanlardır﴾<\/span> [Sâffât 173]."], [3691.5, "İblis de askerler edinmiştir. Allah Teâlâ şöyle buyurmuştur:"], [3697.0, "<span class=\"ayah\">﴿Onlar ve azgınlar oraya yüzüstü atıldılar; İblis'in bütün askerleri de﴾<\/span> [Şuarâ 94–95]."]]}, {"reader": false, "ar": [[3704.0, "فمن هم جنودُ الله،"], [3706.0, "ومن هم جنودُ إبليس؟"], [3708.0, "جنود الله ـ الجواب: جنود الله هم الذين يُمسّكون الناسَ بالوحي في أرض الله؛"], [3716.0, "فكلُّ من دعا إلى الكتاب والسنة على فهم السلف الصالح فهو جنديٌّ من جنود الله عز وجل في أرضه."], [3727.0, "وأما جنود إبليس فهم الذين يُبعدون الناس عن الكتاب والسنة وفهم السلف الصالح،"], [3738.7, "ويدعون إلى مخالفة الوحي؛"], [3741.0, "فكلُّ من دعاك إلى مخالفة الوحي فهو من جنود إبليس."]], "tr": [[3704.0, "Allah'ın askerleri kimlerdir, İblis'in askerleri kimlerdir?"], [3707.5, "Allah'ın askerleri —cevap: Allah'ın askerleri, Allah'ın yeryüzünde insanları vahye sımsıkı tutunduranlardır."], [3716.0, "Selef-i sâlihînin anlayışı üzere Kitap ve Sünnet'e çağıran herkes, Allah Teâlâ'nın yeryüzündeki askerlerinden bir askerdir."], [3726.7, "İblis'in askerleri ise insanları Kitap'tan, Sünnet'ten ve selef-i sâlihînin anlayışından uzaklaştıran ve vahye aykırılığa çağıranlardır."], [3741.6, "Seni vahye aykırılığa çağıran herkes İblis'in askerlerindendir."]]}, {"reader": false, "ar": [[3747.0, "فالشياطين من جنوده، لأنهم دعاةٌ إلى الباطل."], [3753.0, "ومن يدعوك إلى عبادة القبور هو من جنود إبليس،"], [3761.0, "لأنه يدعوك إلى الشرك والوثنية."], [3763.0, "ومن يدعوك إلى البدع،"], [3765.8, "ويحسّنها في عينك، ويزخرفها في قلبك،"], [3771.0, "فهو من جنود إبليس."], [3774.0, "فالدعاةُ إلى الشرك من جنود إبليس،"], [3778.0, "والدعاةُ إلى البدع من جنود إبليس،"], [3781.0, "وكلُّ من يدعوك إلى معصيةٍ فهو من جنود إبليس:"], [3785.0, "تعال نشرب الخمر، تعال نزني بهذه المرأة،"], [3789.0, "تعال نسرق هذا المال، تعال نتعامل بالربا."]], "tr": [[3747.0, "Şeytanlar onun askerlerindendir, çünkü bâtıla çağıranlardır."], [3751.5, "Seni kabirlere ibadete çağıran İblis'in askerlerindendir, çünkü seni şirke ve putperestliğe çağırır."], [3762.6, "Seni bid'atlere çağıran, onları gözünde güzel gösteren ve kalbinde süsleyen kimse İblis'in askerlerindendir."], [3774.0, "Şirke çağıranlar İblis'in askerlerindendir; bid'atlere çağıranlar İblis'in askerlerindendir;"], [3779.5, "seni bir masiyete çağıran herkes İblis'in askerlerindendir:"], [3782.8, "\"Gel içki içelim\", \"Gel bu kadınla zina edelim\", \"Gel bu malı çalalım\", \"Gel faizle muamele yapalım\"."]]}, {"reader": false, "ar": [[3794.0, "والجنديةُ في إبليس لها مراتب:"], [3800.0, "فأعظمُ المراتب هو من يُخرجك من دائرة الإسلام بالكلية،"], [3809.0, "ثم يعقبها من يدعوك إلى بدعة،"], [3814.0, "ثم يعقبها من يدعوك إلى كبيرة،"], [3819.0, "ثم يعقبها من يدعوك إلى صغيرة،"], [3823.0, "ثم يعقبها من ينقلك من العمل الفاضل إلى المفضول."], [3828.0, "ولا بد أن ينجح إبليس معك في واحدةٍ من هذه المراتب إن لم تستعذ منه وتعتصم بالله عز وجل."]], "tr": [[3794.0, "İblis'in askerliğinin mertebeleri vardır. Mertebelerin en büyüğü seni İslâm dairesinden tamamen çıkaran kimsedir."], [3805.7, "Onu seni bir bid'ate çağıran, onu seni bir büyük günaha çağıran, onu seni bir küçük günaha çağıran, onu da seni faziletli amelden daha aşağı olana götüren takip eder."], [3829.3, "Ondan (Allah'a) sığınmaz ve Allah Teâlâ'ya sımsıkı tutunmazsan, İblis bu mertebelerden birinde seninle mutlaka başarıya ulaşır."]]}, {"reader": false, "ar": [[3838.0, "وفي صحيح الإمام مسلم،"], [3843.0, "من حديث جابر بن عبد الله رضي الله عنهما قال:"], [3850.4, "قال النبي ﷺ: «إن إبليس يضع عرشه على الماء، ثم يبعث سراياه ـ أي جنودَه ـ يفتنون الناس، فأدناهم منه منزلةً أعظمُهم للناس فتنة؛ يجيء أحدهم فيقول: صنعت كذا وكذا، فيقول: ما صنعتَ شيئًا، حتى يجيء أحدهم فيقول: ما تركتُه حتى فرّقت بينه وبين امرأته، فيُدنيه منه ويقول: نِعْمَ أنت»."], [3878.0, "قال الأعمش: أُراه قال: «فيلتزمه» <span class=\"note\">(Müslim)<\/span>."]], "tr": [[3838.0, "İmam Müslim'in Sahîh'inde Câbir b."], [3840.6, "Abdullah'tan (r.anhümâ) gelen hadiste şöyle der:"], [3845.8, "Nebî ﷺ buyurdu: \"İblis tahtını suyun üzerine kurar, sonra seriyyelerini —yani askerlerini— insanları fitneye düşürmek için gönderir."], [3856.0, "Mertebe bakımından ona en yakın olanları, insanlar için fitnesi en büyük olanlarıdır."], [3862.3, "Onlardan biri gelir ve 'Şunu şunu yaptım' der."], [3866.0, "O da 'Hiçbir şey yapmadın' der."], [3868.5, "Nihayet onlardan biri gelir ve 'Onu, karısıyla arasını ayırana kadar bırakmadım' der."], [3873.3, "O da onu kendisine yaklaştırır ve 'Sen ne iyisin!' der.\" A'meş:"], [3877.6, "\"Sanırım 'Onu bağrına basar' dedi\" demiştir <span class=\"note\">(Müslim)<\/span>."]]}, {"reader": false, "ar": [[3880.0, "فنعوذ بالله من أن نكون في أرض الله،"], [3885.3, "ونأكل من رزق الله،"], [3888.0, "ونحن جنودٌ للشيطان! هذا ـ والله ـ من التناقض العجيب:"], [3893.0, "نأكل من خيرات الله ونحارب اللهَ عز وجل في أرضه!"], [3899.0, "فإذا قيل لك: مَن جنودُ إبليس؟"], [3902.8, "فقل: كلُّ داعيةٍ إلى الشرك الأكبر،"], [3906.6, "وكلُّ داعيةٍ إلى الشرك الأصغر،"], [3909.8, "وكلُّ داعيةٍ إلى كبائر الذنوب،"], [3913.0, "وكلُّ داعيةٍ إلى صغائرها أو اللمم،"], [3918.0, "وكلُّ من يدعوك إلى ترك العمل الفاضل إلى العمل المفضول."], [3923.0, "والجنديةُ في الشيطان لها مراتب تختلف باختلاف ما يحقّق مقصودَه في بني آدم. والله أعلم."]], "tr": [[3880.0, "Allah'ın yeryüzünde olup Allah'ın rızkından yerken şeytanın askerleri olmaktan Allah'a sığınırız!"], [3887.3, "Vallahi bu tuhaf bir çelişkidir:"], [3890.6, "Allah'ın nimetlerinden yiyoruz ve Allah Teâlâ'ya O'nun yeryüzünde savaş açıyoruz!"], [3896.6, "Sana \"İblis'in askerleri kimlerdir?\" denirse de ki:"], [3900.9, "Büyük şirke çağıran her davetçi, küçük şirke çağıran her davetçi, büyük günahlara çağıran her davetçi, küçük günahlara ya da lemem (ufak kusurlar)a çağıran her davetçi ve seni faziletli ameli bırakıp daha aşağı amele çağıran herkes."], [3923.0, "Şeytanın askerliğinin mertebeleri, onun Âdemoğullarındaki maksadını gerçekleştirmesindeki farka göre değişir. Allah en iyisini bilir."]]}]}, {"ts": "1:05:30", "title": "30. Külliye: Sapıklık yoluna giren, ölçüsünce şeytanın dostudur", "paras": [{"reader": true, "ar": [[3930.0, "أحسن الله إليكم. القاعدة ـ الكلية الثلاثون:"], [3937.0, "كلُّ من سلك طريقَ ضلالٍ وغوايةٍ فهو وليٌّ للشيطان بقدره."]], "tr": [[3930.0, "Allah size iyilik etsin. Kaide, otuzuncu külliye:"], [3935.1, "Sapıklık ve azgınlık yoluna giren herkes, (bu yola girmesi) ölçüsünce şeytanın dostudur."]]}, {"reader": false, "ar": [[3943.0, "كلُّ من سلك طريقَ ضلالةٍ وغوايةٍ فهو وليٌّ للشيطان بقدره."], [3951.1, "<span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [3963.0, "كما أن الله عز وجل قد اتّخذ أولياءَ من خلقه،"], [3967.0, "فكذلك الشيطان يتّخذ أولياءَ وأصفياءَ من أتباعه."], [3970.0, "وقد جمع الله عز وجل بين الولايتين في سورة البقرة،"], [3975.0, "في قول الله عز وجل:"], [3977.0, "<span class=\"ayah\">﴿اللَّهُ وَلِيُّ الَّذِينَ آمَنُوا يُخْرِجُهُم مِّنَ الظُّلُمَاتِ إِلَى النُّورِ ۖ وَالَّذِينَ كَفَرُوا أَوْلِيَاؤُهُمُ الطَّاغُوتُ يُخْرِجُونَهُم مِّنَ النُّورِ إِلَى الظُّلُمَاتِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٧]<\/span>."]], "tr": [[3943.0, "Sapıklık ve azgınlık yoluna giren herkes, ölçüsünce şeytanın dostudur."], [3949.3, "(Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [3963.8, "Allah Teâlâ mahlûkatından dostlar (veliler) edindiği gibi, şeytan da taraftarlarından dostlar ve seçkinler edinir."], [3969.6, "Allah Teâlâ iki velâyeti Bakara sûresinde bir araya getirmiştir;"], [3974.5, "Allah Teâlâ'nın şu sözünde: <span class=\"ayah\">﴿Allah iman edenlerin dostudur; onları karanlıklardan nura çıkarır. Kâfirlerin dostları ise tâğuttur; onları nurdan karanlıklara çıkarırlar﴾<\/span> [Bakara 257]."]]}, {"reader": false, "ar": [[3989.0, "وقال الله عز وجل عن الشيطان ـ وقال الله ـ نعم."], [3999.0, "أوقف التسجيل قليلًا. ... شغّل،"], [4002.4, "شغّل (التسجيل) <span class=\"q\">؟ 01:06:42<\/span>. فكما أن لله عز وجل أولياء،"], [4008.0, "فللشيطان أولياء، وولايةُ الشيطان تكون على حسب مخالفة دليل الشرع؛"], [4017.0, "فكلُّ من يدعوك إلى ضلالةٍ،"], [4020.0, "أو يسلك بك طريقَ غواية،"], [4023.0, "فهو وليٌّ للشيطان وحبيبٌ له وقريبٌ منه."]], "tr": [[3989.0, "Allah Teâlâ şeytan hakkında şöyle buyurmuştur —Allah buyurmuştur ki— evet."], [3999.0, "Kaydı biraz durdur. ... Aç, (kaydı) aç <span class=\"q\">؟<\/span>."], [4004.7, "Allah Teâlâ'nın dostları olduğu gibi şeytanın da dostları vardır."], [4009.7, "Şeytanın velâyeti, şer'î delile aykırılık ölçüsüne göredir."], [4014.1, "Seni bir sapıklığa çağıran ya da seni bir azgınlık yoluna götüren herkes şeytanın dostu, sevgilisi ve ona yakın olandır."]]}, {"reader": false, "ar": [[4027.0, "فالدعاةُ إلى الشرك من أولياء الشيطان،"], [4032.0, "والسحرةُ والكهّانُ من أولياء الشيطان،"], [4038.0, "وعلى ذلك قولُ الله عز وجل:"], [4042.0, "<span class=\"ayah\">﴿إِنَّمَا ذَٰلِكُمُ الشَّيْطَانُ يُخَوِّفُ أَوْلِيَاءَهُ﴾<\/span> <span class=\"ref\">[آل عمران: ١٧٥]<\/span>،"], [4045.6, "أي: يخوّفكم بأوليائه. فكلُّ من حسّن إلى الناس طريقَ الشرك والوثنية فهو من أولياء الشيطان،"], [4054.0, "وكلُّ من حسّن للناس البدعَ ودعاهم إليها وزخرفها لهم،"], [4060.0, "ووضع على الدخول فيها الجوائزَ العظيمة،"], [4063.0, "فهو من أولياء الشيطان،"], [4065.0, "وكلُّ من يزخرف لك باطلًا من معصيةٍ أو غيرها فهو من أولياء الشيطان."]], "tr": [[4027.0, "Şirke çağıranlar şeytanın dostlarındandır; sihirbazlar ve kâhinler şeytanın dostlarındandır."], [4033.6, "Allah Teâlâ'nın şu sözü de buna dayanır:"], [4040.7, "<span class=\"ayah\">﴿O şeytan ancak kendi dostlarıyla (sizi) korkutur﴾<\/span> [Âl-i İmrân 175];"], [4048.0, "yani sizi dostlarıyla korkutur. İnsanlara şirk ve putperestlik yolunu güzel gösteren herkes şeytanın dostlarındandır."], [4054.7, "İnsanlara bid'atleri güzel gösteren, onları bid'atlere çağıran, onlara bid'atleri süsleyen ve onlara girmeye büyük ödüller koyan herkes şeytanın dostlarındandır."], [4065.5, "Sana bir masiyet ya da başka bir bâtılı süsleyen herkes şeytanın dostlarındandır."]]}, {"reader": false, "ar": [[4072.0, "وأولياؤه هم رسلُه الذين يستجريهم الشيطان لإضلال الناس،"], [4079.0, "كما قال النبي ﷺ: «يا أيها الناس، قولوا بقولكم، لا يستجرينّكم الشيطان»."], [4089.0, "والاستجراء هو أن يجعلك الشيطان تجري على رجليك في تحقيق مقاصده،"], [4096.0, "فيبعثك إلى هؤلاء لتُضلّهم،"], [4101.0, "وتخرج منهم إلى الاجتماع الآخر لتُفسد عقيدتهم،"], [4105.4, "وترتّب لهم المحاضرات لتُعلن الضلالَ والغوايةَ بين ظهرانيهم،"], [4113.0, "ويحجز لك الفنادقَ والمؤتمرات حتى تتكلّم في حضورها بما يخالف شريعة الله عز وجل."], [4124.0, "وهكذا، فكلُّ من يدعو إلى غوايةٍ وضلالٍ فهو من أولياء الشيطان."]], "tr": [[4072.0, "Onun dostları, şeytanın insanları saptırmak için koşturduğu elçileridir."], [4078.2, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [4083.0, "\"Ey insanlar! Kendi sözünüzü söyleyin;"], [4086.6, "şeytan sizi (peşinden) koşturmasın.\" İsticrâ (koşturma), şeytanın seni kendi maksatlarını gerçekleştirmek için ayaklarının üzerinde koşturmasıdır:"], [4096.0, "Seni şunlara gönderir ki onları saptırasın;"], [4101.6, "onlardan çıkıp akîdelerini bozmak için başka bir toplantıya gidersin;"], [4106.8, "aralarında sapıklığı ve azgınlığı ilan etmek için onlara konferanslar düzenlersin;"], [4115.0, "Allah Teâlâ'nın şeriatına aykırı olanı onların huzurunda konuşasın diye (şeytan) sana oteller ve kongreler ayarlar."], [4126.1, "Böylece azgınlığa ve sapıklığa çağıran herkes şeytanın dostlarındandır."]]}, {"reader": false, "ar": [[4133.0, "فإن قلت: وما مصيرُ أوليائه؟"], [4136.6, "نقول: مصيرهم معه، لقول الله عز وجل:"], [4142.7, "<span class=\"ayah\">﴿وَقَالَ الشَّيْطَانُ لَمَّا قُضِيَ الْأَمْرُ إِنَّ اللَّهَ وَعَدَكُمْ وَعْدَ الْحَقِّ وَوَعَدتُّكُمْ فَأَخْلَفْتُكُمْ ۖ وَمَا كَانَ لِيَ عَلَيْكُم مِّن سُلْطَانٍ إِلَّا أَن دَعَوْتُكُمْ فَاسْتَجَبْتُمْ لِي﴾<\/span> <span class=\"ref\">[إبراهيم: ٢٢]<\/span>."], [4155.5, "وهم حزبُه، كما قال الله عز وجل:"], [4158.9, "<span class=\"ayah\">﴿أُولَٰئِكَ حِزْبُ الشَّيْطَانِ ۚ أَلَا إِنَّ حِزْبَ الشَّيْطَانِ هُمُ الْخَاسِرُونَ﴾<\/span> <span class=\"ref\">[المجادلة: ١٩]<\/span>."]], "tr": [[4133.0, "\"Onun dostlarının akıbeti nedir?\" dersen, deriz ki:"], [4135.9, "Akıbetleri onunla beraberdir. Çünkü Allah Teâlâ şöyle buyurmuştur:"], [4141.3, "<span class=\"ayah\">﴿İş bitirilince şeytan şöyle der: \"Şüphesiz Allah size gerçek bir vaatte bulundu; ben de size vaatte bulundum ama sözümden döndüm. Benim sizin üzerinizde hiçbir zorlayıcı gücüm yoktu; sadece sizi çağırdım, siz de bana uydunuz.\"﴾<\/span> [İbrâhîm 22]."], [4156.2, "Onlar onun hizbidir; nitekim Allah Teâlâ şöyle buyurmuştur:"], [4158.5, "<span class=\"ayah\">﴿Onlar şeytanın hizbidir. Bilin ki şeytanın hizbi hüsrana uğrayanların ta kendileridir﴾<\/span> [Mücâdele 19]."]]}, {"reader": true, "ar": [[4164.0, "<b>الكلية الحادية والثلاثون: كلُّ من خالف الشرعَ فهو ذليلٌ بقدر مخالفته.<\/b>"]], "tr": [[4164.0, "<b>Otuz birinci külliye: Şeriata aykırı davranan herkes, aykırılığı ölçüsünde zelildir.<\/b>"]]}, {"reader": false, "ar": [[4175.0, "كلُّ من خالف الشرعَ فهو ذليلٌ بقدر مخالفته."], [4181.0, "أقول وبالله التوفيق: يقول الله تبارك وتعالى:"], [4185.8, "<span class=\"ayah\">﴿وَلِلَّهِ الْعِزَّةُ وَلِرَسُولِهِ وَلِلْمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[المنافقون: ٨]<\/span>،"], [4195.0, "ويقول الله عز وجل:"], [4197.2, "<span class=\"ayah\">﴿أَيَبْتَغُونَ عِندَهُمُ الْعِزَّةَ فَإِنَّ الْعِزَّةَ لِلَّهِ جَمِيعًا﴾<\/span> <span class=\"ref\">[النساء: ١٣٩]<\/span>."]], "tr": [[4175.0, "Şeriata aykırı davranan herkes, aykırılığı ölçüsünde zelildir."], [4178.6, "Tevfik Allah'tandır, derim ki: Allah Tebâreke ve Teâlâ şöyle buyurur:"], [4183.8, "<span class=\"ayah\">﴿İzzet Allah'ın, Resûlü'nün ve müminlerindir﴾<\/span> [Münâfikûn 8]."], [4187.9, "Allah Teâlâ yine şöyle buyurur:"], [4196.0, "<span class=\"ayah\">﴿İzzeti onların yanında mı arıyorlar? Şüphesiz izzetin tamamı Allah'ındır﴾<\/span> [Nisâ 139]."]]}]}, {"ts": "1:10:00", "title": "31. Külliye (devam): Hakiki izzet ve tâbi izzet", "paras": [{"reader": false, "ar": [[4201.0, "ومن أسمائه عز وجل:"], [4203.8, "العزيز، ومن صفاته: العزّةُ الكاملة في ذاته،"], [4209.0, "والعزّةُ الكاملة في أسمائه،"], [4211.4, "والعزّةُ الكاملة المطلقة المتناهية في صفاته؛"], [4215.0, "فالله عز وجل له الأحقّيةُ في كل معاني العزّة على أكمل وجه."], [4221.0, "فكلّما اقترب العبدُ من الله فإنه ستصيبه من تلك العزّة،"], [4226.0, "فيكون عزيزًا في أرض الله عز وجل:"], [4228.0, "فيكون عزيزًا بأقواله، وعزيزًا في أفعاله،"], [4232.0, "وعزيزًا في الأسوة والقدوة به،"], [4235.2, "وعزيزًا في مؤلّفاته، وسيكون عزيزًا في مجتمعه."]], "tr": [[4201.0, "Allah Teâlâ'nın isimlerinden biri el-Azîz'dir;"], [4204.5, "sıfatlarından biri de zatında kâmil izzet, isimlerinde kâmil izzet ve sıfatlarında kâmil, mutlak ve son derece yüce izzettir."], [4216.0, "İzzetin bütün manalarına en mükemmel şekilde layık olan Allah Teâlâ'dır."], [4221.5, "Kul Allah'a yaklaştıkça o izzetten kendisine isabet eder ve Allah Teâlâ'nın yeryüzünde aziz olur:"], [4227.4, "Sözleriyle aziz, fiilleriyle aziz, kendisine uyulması ve örnek alınması bakımından aziz, eserleriyle aziz olur ve toplumunda da aziz olacaktır."]]}, {"reader": false, "ar": [[4241.0, "حتى وإن رموه عن قوسٍ واحدة،"], [4243.0, "فهو عزيزٌ في قلوبهم لعظم تمسّكه بمنهج الله عز وجل،"], [4248.0, "حتى يحترمه أعداؤه، ويكون عزيزًا حتى عند أعدائه."], [4253.0, "فالعزّة إنما هي في طريق الله عز وجل."], [4258.0, "وعلى النقيض من ذلك:"], [4260.0, "فكلُّ من خالف أمر الله عز وجل وابتعد عن دائرة الله تبارك وتعالى فإنه ستصيبه من الذلّة بقدر مخالفته لشريعة الله."]], "tr": [[4241.0, "Hepsi birden ona tek yaydan ok atsalar bile, Allah Teâlâ'nın yoluna sımsıkı bağlılığının büyüklüğünden dolayı onların kalplerinde azizdir;"], [4248.9, "öyle ki düşmanları bile ona saygı duyar, düşmanlarının yanında bile aziz olur."], [4256.1, "İzzet ancak Allah Teâlâ'nın yolundadır."], [4259.0, "Bunun tam tersine, Allah Teâlâ'nın emrine aykırı davranan ve Allah Tebâreke ve Teâlâ'nın dairesinden uzaklaşan herkese, Allah'ın şeriatına aykırılığı ölçüsünde zillet isabet edecektir."]]}, {"reader": false, "ar": [[4270.0, "حتى وإن كان أكثرَ الناس مالًا فهو ذليلٌ بقدر مخالفته،"], [4276.0, "حتى وإن كان من أعظم الناس مُلكًا أو سلطانًا فهو ذليلٌ بقدر مخالفته،"], [4282.0, "حتى وإن كان أجملَ الناس وجهًا وأعظمَ الناس غِبطةً وأرصدةً،"], [4289.0, "إلا أنه يحسّ ويشعر بهذه الذلّة التي تلازم قلبه ويشعر بها،"], [4296.0, "ولا يمكن أن تفارقه أبدًا إلا بطاعة الله عز وجل."]], "tr": [[4270.0, "İnsanların en zengini olsa bile aykırılığı ölçüsünde zelildir."], [4274.5, "Mülk ya da saltanat bakımından insanların en büyüklerinden olsa bile aykırılığı ölçüsünde zelildir."], [4281.0, "İnsanların yüzce en güzeli, en çok gıpta edileni ve (banka) hesapları en kabarık olanı olsa bile, kalbinden ayrılmayan bu zilleti hisseder ve duyar;"], [4296.0, "bu zillet de ancak Allah Teâlâ'ya itaatle ondan ayrılabilir."]]}, {"reader": false, "ar": [[4300.0, "فالعزّ ينقسم إلى عزٍّ حقيقي،"], [4303.6, "وإلى عزٍّ تبعي. أما العزّ الحقيقي ـ الذي عليه قِوامُ ركن العزّة الأعظم ـ فهو في طاعة الله والقرب منه."], [4313.0, "وأما العزّ التبعي فهو العزّ بالجاه،"], [4318.0, "العزّ بالمال، العزّ بالمنصب؛"], [4321.0, "لكنه عزٌّ تبعيٌّ لا ينفع إذا هُدم ركنُ العزّ الأعظم،"], [4326.0, "وهو العزّة بالله عز وجل."]], "tr": [[4300.0, "İzzet, hakiki izzet ve tâbi izzet olarak ikiye ayrılır."], [4307.0, "En büyük izzet rüknünün kıvamı üzerine olan hakiki izzet, Allah'a itaatte ve O'na yakınlıktadır."], [4312.7, "Tâbi izzet ise makamla izzet, malla izzet, mevkiyle izzettir;"], [4319.5, "ama bu, en büyük izzet rüknü —yani Allah Teâlâ ile izzet— yıkıldığında fayda vermeyen tâbi bir izzettir."]]}, {"reader": false, "ar": [[4332.0, "ولذلك كتب الله الذلّةَ والصَّغارَ على من خالف أمره،"], [4336.0, "كما قال ﷺ: «وكُتبت الذلّةُ والصَّغارُ على من خالف أمري»."], [4342.0, "وقال الله عز وجل:"], [4344.9, "<span class=\"ayah\">﴿وَضُرِبَتْ عَلَيْهِمُ الذِّلَّةُ وَالْمَسْكَنَةُ وَبَاءُوا بِغَضَبٍ مِّنَ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ٦١]<\/span>،"], [4351.0, "وفي الآية الأخرى: <span class=\"ayah\">﴿إِلَّا بِحَبْلٍ مِّنَ اللَّهِ وَحَبْلٍ مِّنَ النَّاسِ... وَضُرِبَتْ عَلَيْهِمُ الْمَسْكَنَةُ﴾<\/span> <span class=\"note\">(Şeyh ayeti kısaltarak okuyor; tamamı aşağıda: Âl-i İmrân 112)<\/span> ـ اصبر ـ <span class=\"ayah\">﴿ضُرِبَتْ عَلَيْهِمُ الذِّلَّةُ أَيْنَ مَا ثُقِفُوا إِلَّا بِحَبْلٍ مِّنَ اللَّهِ وَحَبْلٍ مِّنَ النَّاسِ وَبَاءُوا بِغَضَبٍ مِّنَ اللَّهِ وَضُرِبَتْ عَلَيْهِمُ الْمَسْكَنَةُ﴾<\/span> <span class=\"ref\">[آل عمران: ١١٢]<\/span>."], [4365.0, "والمسكنةُ هي أدنى أدنى أدنى مراتب الذلّة، والعياذ بالله."]], "tr": [[4332.0, "Bu yüzden Allah, emrine aykırı davranana zillet ve küçüklüğü yazmıştır."], [4335.6, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [4339.4, "\"Emrime aykırı davranana zillet ve küçüklük yazıldı.\" Allah Teâlâ şöyle buyurmuştur:"], [4344.2, "<span class=\"ayah\">﴿Üzerlerine zillet ve miskinlik damgası vuruldu ve Allah'ın gazabına uğradılar﴾<\/span> [Bakara 61]."], [4351.4, "Diğer ayette: <span class=\"ayah\">﴿…insanlardan bir ip olmadıkça… ve üzerlerine miskinlik damgası vuruldu﴾<\/span> —dur— <span class=\"ayah\">﴿Allah'tan bir ip ve insanlardan bir ip olmadıkça, nerede bulunurlarsa bulunsunlar üzerlerine zillet damgası vuruldu; Allah'ın gazabına uğradılar ve üzerlerine miskinlik damgası vuruldu﴾<\/span> [Âl-i İmrân 112]."], [4364.6, "Miskinlik ise zillet mertebelerinin en aşağısının da en aşağısıdır. Allah'a sığınırız."]]}, {"reader": false, "ar": [[4374.0, "فمن أراد العزّة فلن يجدها إلا في طريق الله:"], [4377.0, "في قيام الليل ـ عفوًا ـ في فعل المأمورات،"], [4381.0, "وفي ترك المحظورات، وفي تأييد فعل المحظورات بفعل ـ عفوًا ـ وفي تأييد فعل المأمورات بفعل المندوبات،"], [4391.0, "وفي تأييد ترك المحظورات بترك المكروهات."], [4394.0, "وكلّما ترقّى العبد في مدارج القرب من الله،"], [4399.0, "كلّما ترقّى في مدارج العزّة."]], "tr": [[4374.0, "İzzeti isteyen, onu ancak Allah'ın yolunda bulur:"], [4376.7, "gece namazında —pardon— emredilenleri yapmakta, yasaklananları terk etmekte, yasaklananları yapmayı… —pardon— emredilenleri yapmayı mendupları yapmakla desteklemekte ve yasaklananları terk etmeyi mekruhları terk etmekle desteklemekte."], [4394.6, "Kul Allah'a yakınlık basamaklarında yükseldikçe izzet basamaklarında da yükselir."]]}, {"reader": false, "ar": [[4401.0, "فالطائعُ في عزّ طاعته أعظمُ من الملِك في عزّ ملكه،"], [4408.0, "والمحسنُ في عزّ إحسانه أعظمُ من عزّ صاحب المال في ماله."], [4416.0, "ولا تغرّنّكم تلك العزّة التي يُرهبونكم بها،"], [4423.0, "فإنهم في بواطنهم أذلّة،"], [4425.0, "والعزيزُ هو من اعتزّ بالحقّ عز وجل. والله أعلم."]], "tr": [[4401.0, "İtaat eden, itaatinin izzetinde, hükümdarın mülkünün izzetinde olmasından daha büyüktür."], [4408.0, "İhsan sahibi de ihsanının izzetinde, mal sahibinin malındaki izzetinden daha büyüktür."], [4416.0, "Sizi korkuttukları o izzet sizi aldatmasın;"], [4420.5, "onlar içlerinde zelildirler. Aziz olan, Hak Teâlâ ile izzet bulandır. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[4431.1, "أحسن الله إليكم. الكلية الثانية والثلاثون:"], [4439.0, "كلُّ من أنكر حجّيةَ خبر الآحاد الصحيح في العقائد فمبتدع."]], "tr": [[4431.1, "Allah size iyilik etsin. Otuz ikinci külliye:"], [4439.0, "Sahih haber-i vâhidin akîdelerde hüccet oluşunu inkâr eden herkes bid'atçıdır."]]}, {"reader": false, "ar": [[4446.0, "كلُّ من أنكر حجّيةَ خبر الآحاد الصحيح في العقائد فمبتدع."], [4455.0, "نعم، أقول وبالله التوفيق:"], [4463.0, "لقد قسّم العلماءُ السنةَ ـ باعتبار وصولها إلينا ـ إلى متواترةٍ وآحاد،"], [4468.0, "وهذه الكلية ليست في الأحاديث المتواترة،"], [4471.8, "وإنما هي في الأحاديث الآحادية."], [4475.0, "ونعني بحديث الآحاد: أي الحديث الذي وصل إلينا من طريق الواحد والاثنين أو الثلاثة،"], [4487.0, "ما لم يبلغ عددَ التواتر."], [4488.0, "وقد أجمع أهل السنة والجماعة على وجوب قبول خبر الآحاد الصحيح،"], [4495.0, "بغضّ النظر عن بابه الذي ورد فيه؛"], [4497.0, "فخبر الآحاد الصحيح حجّةٌ في العقائد بالإجماع ـ"]], "tr": [[4446.0, "Sahih haber-i vâhidin akîdelerde hüccet oluşunu inkâr eden herkes bid'atçıdır."], [4455.0, "Evet. Tevfik Allah'tandır, derim ki:"], [4463.5, "Âlimler Sünnet'i, bize ulaşması itibarıyla mütevâtir ve âhâd olarak ayırmışlardır."], [4468.6, "Bu külliye mütevâtir hadislerle ilgili değil, âhâd hadislerle ilgilidir."], [4475.0, "Âhâd hadisle, bize bir, iki ya da üç kişilik yoldan ulaşan, tevâtür sayısına ulaşmayan hadisi kastediyoruz."], [4487.4, "Ehl-i Sünnet ve'l-Cemaat, sahih haber-i vâhidi, geldiği bab ne olursa olsun kabul etmenin vâcip olduğu üzerinde icmâ etmiştir."], [4496.4, "Sahih haber-i vâhid icmâ ile akîdelerde hüccettir —"]]}]}, {"ts": "1:15:00", "title": "32. Külliye (devam): Haber-i vâhidin delilleri · 33. Külliye: Tevkîfî olanın taallukları da tevkîfîdir", "paras": [{"reader": false, "ar": [[4502.0, "وخبرُ الآحاد الصحيح حجّةٌ في الشرائع في قول أهل السنة والجماعة."], [4510.0, "والمعتمد عند أهل السنة والجماعة في قبول الحديث من عدم قبوله إنما هو صحّةُ النصّ إلى رسول الله من عدم صحّته؛"], [4520.0, "فكلُّ نصٍّ ثبتت صحّته ولم يُنسخ فالواجب قبولُه،"], [4525.0, "واعتمادُ مدلوله، والعملُ به،"], [4527.0, "بغضّ النظر عن موضوعه:"], [4529.0, "أفي عقيدةٍ يُثبتها أم في شريعةٍ يُثبتها."]], "tr": [[4502.0, "— ve Ehl-i Sünnet ve'l-Cemaat'in görüşüne göre sahih haber-i vâhid şer'î hükümlerde de hüccettir."], [4510.5, "Ehl-i Sünnet ve'l-Cemaat'in bir hadisi kabul edip etmemede dayandığı şey, nassın Resûlullah'a kadar sahih olup olmamasıdır."], [4518.0, "Sahihliği sabit olan ve neshedilmemiş her nassı kabul etmek, delâletine dayanmak ve onunla amel etmek vâciptir;"], [4525.5, "konusu ne olursa olsun: İster bir akîdeyi isbat etsin, ister bir şer'î hükmü isbat etsin."]]}, {"reader": false, "ar": [[4533.0, "ولا يُعرف إنكارُ خبر الآحاد في العقائد إلا عن أهل البدع؛"], [4541.0, "فلك أن تمتحن من تشكّ في بدعيّته:"], [4545.0, "أتحتجّ في العقائد بخبر الآحاد؟"], [4548.0, "فإن قال: نعم، فهو سنّي،"], [4550.0, "وإن قال: لا، فهو من أهل البدع."], [4553.0, "فالجهمية والمعتزلة والأشاعرة والماتريدية وسائرُ أصناف الطوائف المبتدعة لا تحتجّ بخبر الآحاد في باب العقائد أبدًا."]], "tr": [[4533.0, "Akîdelerde haber-i vâhidin inkârı ancak bid'at ehlinden bilinir."], [4539.5, "Bid'atçı olduğundan şüphelendiğin kimseyi imtihan edebilirsin:"], [4543.3, "\"Akîdelerde haber-i vâhidi delil kabul eder misin?\" \"Evet\" derse sünnîdir;"], [4549.2, "\"Hayır\" derse bid'at ehlindendir. Cehmiyye, Mu'tezile, Eş'arîler, Mâtürîdîler ve bid'atçı tâifelerin diğer bütün sınıfları, akîdeler babında haber-i vâhidi asla delil kabul etmezler."]]}, {"reader": false, "ar": [[4570.0, "وأما نحن ـ معاشرَ أهل السنة ـ فإنما المعتمدُ عندنا صحّةُ النصّ وثبوتُه؛"], [4577.0, "فمتى ما صحّ النصّ في العقائد فالواجب قبولُه،"], [4582.3, "متواترًا كان أو آحادًا."], [4585.0, "بل إن أولَ من قسّم السنة إلى متواترةٍ وآحاد باعتبار القبول والردّ هم المعتزلة،"], [4595.0, "ولا يُعرف هذا التقسيمُ بهذا الاعتبار عن أحدٍ من أهل السنة أبدًا."], [4604.0, "وأما تقسيمُ أهل السنة والجماعة الأحاديثَ إلى متواترٍ وآحاد فإنما هو لمعرفة الطريق،"], [4616.3, "لا للقبول والردّ، لا للقبول والردّ؛ ففرّقوا بينهما."]], "tr": [[4570.0, "Biz Ehl-i Sünnet topluluğuna gelince, bizim dayandığımız, nassın sahihliği ve sübûtudur."], [4576.5, "Akîdelerde nas sahih olduğu anda, mütevâtir olsun âhâd olsun, onu kabul etmek vâciptir."], [4584.3, "Hatta Sünnet'i kabul ve ret itibarıyla mütevâtir ve âhâd diye ilk ayıranlar Mu'tezile'dir;"], [4592.6, "bu itibarla bu ayrım Ehl-i Sünnet'ten hiç kimseden asla bilinmez."], [4599.1, "Ehl-i Sünnet ve'l-Cemaat'in hadisleri mütevâtir ve âhâd diye ayırması ise ancak (rivayet) yolunu bilmek içindir;"], [4609.7, "kabul ve ret için değil, kabul ve ret için değil. İkisini birbirinden ayırın."]]}, {"reader": false, "ar": [[4622.0, "وقد دلّت الأدلةُ الكثيرة على وجوب قبول خبر الآحاد:"], [4632.0, "قال الله عز وجل:"], [4634.0, "<span class=\"ayah\">﴿وَأَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ﴾<\/span> <span class=\"ref\">[المائدة: ٩٢]<\/span>،"], [4636.0, "فأمرنا بطاعة الرسول متى ما جاءنا خبرُه،"], [4640.0, "بغضّ النظر عن طريقه؛"], [4642.0, "فلم يقل: وأطيعوا الرسول إن بلغكم عن طريق التواتر،"], [4646.0, "وإنما قال: <span class=\"ayah\">﴿وَأَطِيعُوا الرَّسُولَ﴾<\/span> وأطلق،"], [4649.0, "والأصل بقاءُ المطلق على إطلاقه،"], [4651.0, "فيدخل في ذلك ما صحّ عنه،"], [4652.8, "متواترًا كان أو آحادًا."]], "tr": [[4622.0, "Haber-i vâhidi kabul etmenin vâcip olduğuna birçok delil delâlet etmiştir."], [4629.5, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿Allah'a itaat edin, Resûl'e itaat edin﴾<\/span> [Mâide 92]."], [4636.6, "Bize, yolu ne olursa olsun, haberi bize geldiği anda Resûl'e itaat etmemizi emretti."], [4642.0, "\"Size tevâtür yoluyla ulaşırsa Resûl'e itaat edin\" demedi;"], [4645.1, "bilakis <span class=\"ayah\">﴿Resûl'e itaat edin﴾<\/span> dedi ve mutlak bıraktı."], [4649.0, "Asıl olan, mutlakın mutlaklığı üzere kalmasıdır."], [4651.0, "Buna, mütevâtir olsun âhâd olsun, ondan sahih olarak gelen her şey girer."]]}, {"reader": false, "ar": [[4654.0, "وقال الله عز وجل:"], [4656.6, "<span class=\"ayah\">﴿وَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ﴾<\/span> <span class=\"ref\">[الحشر: ٧]<\/span>،"], [4659.3, "ولم يقل: وما آتاكم الرسول عن طريق التواتر فخذوه؛"], [4666.0, "فأطلق هذا الإتيانَ ولم يقيّده بمتواترٍ وآحاد،"], [4672.0, "فأفاد ذلك أن كلَّ ما أتانا به رسولُ الله ﷺ فالواجبُ أخذُه وعدمُ اطّراحه إذا صحّ عنه."]], "tr": [[4654.0, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿Peygamber size ne verdiyse onu alın﴾<\/span> [Haşr 7]."], [4659.9, "\"Peygamber size tevâtür yoluyla ne verdiyse onu alın\" demedi."], [4664.5, "Bu vermeyi mutlak bıraktı, mütevâtir ve âhâd diye kayıtlamadı."], [4670.9, "Bu da şunu ifade eder:"], [4673.4, "Resûlullah ﷺ'in bize getirdiği her şeyi, ondan sahih olarak geldiğinde almak ve bir kenara atmamak vâciptir."]]}, {"reader": false, "ar": [[4681.0, "وقد كان النبي ﷺ يبعث إلى أقاليم الأمصار بالصحابيّ والصحابيَّين ليُقيم عليهم حجّةَ الله في أصول الدين."], [4693.0, "أوَلم يقل لمعاذٍ ـ في الصحيحين ـ:"], [4696.0, "«يا معاذ، إنك تَقدَم على قومٍ من أهل الكتاب ـ أي في اليمن ـ فليكن أولَ ما تدعوهم إليه شهادةُ أن لا إله إلا الله» <span class=\"note\">(Buhârî, Müslim)<\/span>؟"], [4705.0, "وهو خبرُ آحاد، ولم يردّ أهلُ اليمن خبرَ معاذٍ لأنه خبرُ آحادٍ في عقائد."], [4710.0, "وبعث إلى كسرى، وبعث إلى المقوقس،"], [4714.3, "وبعث إلى قيصر؛ كان يبعث رسلَه إلى ملوك الأمصار بالواحد والاثنين."]], "tr": [[4681.0, "Nebî ﷺ, şehirlerin bölgelerine, dinin usûlünde onlara Allah'ın hüccetini ikame etmesi için bir ya da iki sahabî gönderirdi."], [4693.6, "Sahîhayn'de (Buhârî ve Müslim'de) Muâz'a şöyle dememiş miydi:"], [4697.7, "\"Ey Muâz! Sen Kitap ehlinden bir kavme —yani Yemen'e— gidiyorsun."], [4701.4, "Onları ilk davet edeceğin şey, Allah'tan başka ilah olmadığına şahitlik olsun.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Bu bir haber-i vâhiddir;"], [4707.1, "Yemen halkı da Muâz'ın haberini, akîdelerde bir haber-i vâhid olduğu için reddetmedi."], [4712.8, "Kisrâ'ya (elçi) gönderdi, Mukavkıs'a gönderdi, Kayser'e gönderdi;"], [4718.4, "şehirlerin hükümdarlarına elçilerini birer ikişer gönderirdi."]]}, {"reader": false, "ar": [[4724.0, "فلو لم يكن خبرُ الآحاد حجّةً في العقائد لما كان النبي ﷺ قد بلّغ البلاغَ المبين لهؤلاء الملوك ومن دونهم من الأمصار."], [4738.0, "فخبرُ الآحاد حجّةٌ في العقائد إذا صحّ سندُه."], [4742.0, "ولذلك تجد أهل السنة والجماعة يُثبتون عقائدَ بأخبار الآحاد:"], [4747.0, "فنحن نُثبت الضحكَ لله على الوجه اللائق به،"], [4751.0, "وحديثُه آحاد، ونُثبت الأصابعَ لله عز وجل على الوجه اللائق به،"], [4757.0, "وحديثُه آحاد، ونُثبت الفرحَ لله عز وجل على الوجه اللائق به،"], [4765.0, "وحديثُه آحاد، ونُثبت القدمَ أو الرِّجلَ لله عز وجل على الوجه اللائق به، وحديثُه آحاد."]], "tr": [[4724.0, "Eğer haber-i vâhid akîdelerde hüccet olmasaydı, Nebî ﷺ bu hükümdarlara ve onların altındaki şehirlere apaçık tebliği yapmış olmazdı."], [4734.3, "Senedi sahih olduğunda haber-i vâhid akîdelerde hüccettir."], [4740.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat'in haber-i vâhidlerle akîdeler isbat ettiğini görürsün:"], [4746.0, "Allah için, O'na yakışır şekilde gülmeyi isbat ederiz, hadisi âhâddır;"], [4751.0, "Allah Teâlâ için, O'na yakışır şekilde parmakları isbat ederiz, hadisi âhâddır;"], [4757.0, "Allah Teâlâ için, O'na yakışır şekilde sevinmeyi isbat ederiz, hadisi âhâddır;"], [4765.0, "Allah Teâlâ için, O'na yakışır şekilde kademi ya da ayağı isbat ederiz, hadisi âhâddır."]]}, {"reader": false, "ar": [[4776.0, "فلم نجعل آحاديّتَه سببًا لردّه،"], [4783.0, "لأنه صحّ وثبت عن النبي ﷺ،"], [4788.0, "وحقُّ الحديث إذا ثبت قبولُه لا ردُّه. والله أعلم."]], "tr": [[4776.0, "Âhâd oluşunu reddine sebep kılmadık;"], [4778.4, "çünkü Nebî ﷺ'den sahih olarak sabit olmuştur."], [4785.2, "Hadis sabit olduğunda onun hakkı reddedilmesi değil, kabul edilmesidir. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[4792.0, "أحسن الله إليكم. القاعدة الثالثة والثلاثون:"], [4798.0, "كلُّ ما كان أصلُه التوقيفَ فمتعلّقاتُه أصلُها على التوقيف."]], "tr": [[4792.0, "Allah size iyilik etsin. Otuz üçüncü kaide:"], [4796.9, "Aslı tevkîf (nassa bağlılık) olan her şeyin taalluklarının aslı da tevkîf üzeredir."]]}, {"reader": false, "ar": [[4805.0, "كلُّ ما كان أصلُه التوقيفَ فمتعلّقاتُه أصلُها على التوقيف."], [4814.8, "<span class=\"note\">(يكررها)<\/span> نعم، أقول وبالله التوفيق:"], [4820.8, "لقد أشرتُ إلى شيءٍ من ذلك في كليات الغيب،"], [4825.0, "إن كنتم تذكرون. فكلُّ شيءٍ جعلنا أصلَه مبنيًّا على التوقيف فإن متعلّقاتِه التي تُنسب له لا بد أن تكون توقيفيةً أيضًا؛"], [4836.0, "لأن المتقرّر في القواعد أن التابع في الوجود تابعٌ في الحكم،"], [4842.0, "والمتقرّر في القواعد أن متعلّقات الشيء تتبع أصلَه."]], "tr": [[4805.0, "Aslı tevkîf olan her şeyin taalluklarının aslı da tevkîf üzeredir."], [4819.0, "(Tekrar ediyor.) Evet. Tevfik Allah'tandır, derim ki:"], [4822.2, "Hatırlıyorsanız, gayb külliyelerinde buna biraz işaret etmiştim."], [4825.7, "Aslını tevkîf üzerine kurduğumuz her şeyin, ona nispet edilen taalluklarının da tevkîfî olması gerekir."], [4834.2, "Çünkü kaidelerde yerleşmiş olan şudur:"], [4836.5, "Varlıkta tâbi olan, hükümde de tâbidir."], [4839.8, "Yine kaidelerde yerleşmiş olan şudur:"], [4842.5, "Bir şeyin taallukları onun aslına tâbidir."]]}, {"reader": false, "ar": [[4846.0, "فما أصلُه الحِلُّ فمتعلّقاتُه أصلُها الحِلّ،"], [4850.0, "وما أصلُه التوقيف فمتعلّقاتُه أصلُها التوقيف،"], [4855.0, "وما كان غيبيًّا فمتعلّقاتُه غيبيةٌ كذلك."], [4860.0, "فعالمُ الملائكة أصلُه غيبيٌّ توقيفي،"], [4867.0, "ففروعُه وجزئياتُه غيبيةٌ توقيفية؛"], [4872.0, "وعالمُ الجنّ عالمٌ غيبيٌّ توقيفي،"], [4876.0, "فمتعلّقاتُه وجزئياتُه وفروعُه غيبيةٌ توقيفية؛"], [4882.0, "وعالمُ البرزخ عالمٌ غيبيٌّ توقيفي،"], [4887.0, "فمتعلّقاتُه وجزئياتُه وفروعُه غيبيةٌ توقيفية."]], "tr": [[4846.0, "Aslı helal olanın taalluklarının aslı da helaldir;"], [4849.3, "aslı tevkîf olanın taalluklarının aslı da tevkîftir;"], [4853.1, "gaybî olanın taallukları da aynı şekilde gaybîdir."], [4857.3, "Melekler âleminin aslı gaybî ve tevkîfîdir;"], [4860.8, "dalları ve ayrıntıları da gaybî ve tevkîfîdir."], [4867.9, "Cinler âlemi gaybî ve tevkîfî bir âlemdir;"], [4874.4, "taallukları, ayrıntıları ve dalları da gaybî ve tevkîfîdir."], [4878.4, "Berzah âlemi gaybî ve tevkîfî bir âlemdir;"], [4885.2, "taallukları, ayrıntıları ve dalları da gaybî ve tevkîfîdir."]]}, {"reader": false, "ar": [[4894.0, "وهكذا دواليك في كل ما أصلُه التوقيف:"], [4897.0, "فما أصلُه التوقيف فمتعلّقاتُه توقيفية،"], [4902.0, "وما أصلُه الغيب فمتعلّقاتُه غيبية. والله أعلم."]], "tr": [[4894.0, "Aslı tevkîf olan her şeyde durum böyledir:"], [4896.6, "Aslı tevkîf olanın taallukları tevkîfîdir;"], [4899.4, "aslı gayb olanın taallukları gaybîdir. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[4907.0, "<b>الكلية الرابعة والثلاثون: كلُّ ما أفضى ـ إفضاءَ علمٍ أو غلبةِ ظنٍّ ـ إلى فساد الاعتقاد فمحرَّم.<\/b>"]], "tr": [[4907.0, "<b>Otuz dördüncü külliye: Kesin bilgiyle ya da ağır basan zanla itikadın bozulmasına götüren her şey haramdır.<\/b>"]]}, {"reader": false, "ar": [[4924.0, "كلُّ ما أفضى إفضاءَ علمٍ أو غلبةِ ظنٍّ إلى فساد الاعتقاد فمحرَّم."], [4937.3, "<span class=\"note\">(يكررها)<\/span> نعم، أقول وبالله التوفيق:"], [4946.0, "المتقرّر في القواعد وجوبُ سدّ الذرائع التي تُفضي إفضاءَ علمٍ أو غلبةِ ظنٍّ إلى الفساد،"], [4952.0, "وهي قاعدةُ سدّ الذرائع،"], [4957.0, "وهذا من كمالات الدين والتشريع؛"], [4962.0, "فإن كلَّ ما أفضى إلى الحرام فهو حرام،"], [4966.0, "وكلَّ ما أفضى إلى المفسدة فهو مفسدة. ـ عليكم السلام ـ"]], "tr": [[4924.0, "Kesin bilgiyle ya da ağır basan zanla itikadın bozulmasına götüren her şey haramdır."], [4943.0, "(Tekrar ediyor.) Evet. Tevfik Allah'tandır, derim ki:"], [4947.2, "Kaidelerde yerleşmiş olan, kesin bilgiyle ya da ağır basan zanla fesada götüren zerîaları (vasıtaları) kapatmanın vâcip olduğudur;"], [4957.8, "bu, sedd-i zerâi' kaidesidir. Bu, dinin ve teşriin kemalindendir."], [4964.5, "Harama götüren her şey haramdır;"], [4967.1, "mefsedete götüren her şey mefsedettir. —Aleyküm selâm.—"]]}, {"reader": false, "ar": [[4973.0, "والشريعة إذا حرّمت شيئًا فإنها تحرّم كلَّ الأبواب التي تُفضي إليه،"], [4980.0, "كما أن الشريعة إذا أمرت بشيءٍ فإنها تفتح كلَّ الأبواب التي توصل إليه."], [4986.0, "فإذا حرّمت الشريعةُ الشركَ فكلُّ طريقٍ يُفضي إلى الوقوع في الشرك فحرام؛"], [4995.0, "فوسائلُ الشرك كلُّها محرّمة:"], [4999.0, "فالبناءُ على القبور حرام لأنه وسيلةٌ له،"], [5003.0, "وبناءُ المساجد على القبور حرام لأنه وسيلةٌ له،"], [5008.0, "والعكوفُ عندها الليالي ذواتِ العدد حرام لأنها وسيلةٌ له،"], [5015.0, "والكتابةُ عليها حرام لأنها وسيلةٌ له،"], [5021.0, "وزخرفتُها ووضعُ الستور عليها حرام لأنها وسيلةٌ له."]], "tr": [[4973.0, "Şeriat bir şeyi haram kıldığında ona götüren bütün kapıları da haram kılar;"], [4980.0, "şeriat bir şeyi emrettiğinde de ona ulaştıran bütün kapıları açar."], [4984.2, "Şeriat şirki haram kıldığına göre, şirke düşmeye götüren her yol haramdır."], [4990.8, "Şirkin bütün vasıtaları haramdır: Kabirlerin üzerine bina yapmak haramdır, çünkü ona vasıtadır;"], [5000.1, "kabirlerin üzerine mescit yapmak haramdır, çünkü ona vasıtadır;"], [5004.9, "kabirlerin yanında sayılı geceler boyunca itikâfa durmak haramdır, çünkü ona vasıtadır;"], [5011.6, "kabirlerin üzerine yazı yazmak haramdır, çünkü ona vasıtadır;"], [5018.1, "onları süslemek ve üzerlerine örtüler koymak haramdır, çünkü ona vasıtadır."]]}, {"reader": false, "ar": [[5028.0, "فكلُّ ما أفضى إلى فساد الاعتقاد بالشرك فإنه لا يقع إلا حرامًا."], [5033.0, "وعلى ذلك يتخرّج نهيُ أهل السنة والجماعة عن قراءة كتب أهل البدع؛"], [5040.0, "فلا يجوز قراءةُ كتب أهل البدع إلا في حدودٍ ضيّقة تُذكر في موضعٍ آخر إن شاء الله،"], [5048.0, "لأن من مواضع فساد الاعتقاد أن يُقبل الإنسان على قراءة كتب أهل البدع يطلب الهداية منها."]], "tr": [[5028.0, "İtikadın şirkle bozulmasına götüren her şey ancak haram olarak vuku bulur."], [5033.0, "Ehl-i Sünnet ve'l-Cemaat'in bid'at ehlinin kitaplarını okumayı yasaklaması da buna dayanır."], [5040.5, "Bid'at ehlinin kitaplarını okumak, inşallah başka bir yerde zikredilecek dar sınırlar dışında caiz değildir;"], [5048.0, "çünkü itikadın bozulduğu yerlerden biri, insanın hidayeti bid'at ehlinin kitaplarında arayarak onları okumaya yönelmesidir."]]}, {"reader": false, "ar": [[5056.0, "ويتخرّج على ذلك النهيُ عن مجالسة أهل البدع؛"], [5062.0, "فقد نصّ أهل السنة على حرمة مجالستهم ومؤاخاتهم ومُوادّتهم،"], [5070.0, "واتّخاذِهم أخدانًا وأصحابًا ورفقاء؛"], [5074.0, "لأن مرافقتهم ومجالستهم من الطرق التي تُفضي إلى فساد الاعتقاد،"], [5079.0, "فإن كلَّ قرينٍ بالمقارِن يقتدي."], [5083.0, "وكما قال العامّة: الصاحب ساحب،"], [5089.0, "يسحبك ولا بد. ولذلك قال الله عز وجل:"], [5094.0, "<span class=\"ayah\">﴿وَإِذَا رَأَيْتَ الَّذِينَ يَخُوضُونَ فِي آيَاتِنَا فَأَعْرِضْ عَنْهُمْ﴾<\/span> <span class=\"ref\">[الأنعام: ٦٨]<\/span>،"], [5098.0, "أي: لا تجلس معهم <span class=\"ayah\">﴿حَتَّىٰ يَخُوضُوا فِي حَدِيثٍ غَيْرِهِ﴾<\/span>."]], "tr": [[5056.0, "Bid'at ehliyle oturmanın yasaklanması da buna dayanır."], [5059.6, "Ehl-i Sünnet, onlarla oturmanın, onlarla kardeşlik kurmanın, onlara muhabbet beslemenin ve onları dost, arkadaş ve yoldaş edinmenin haram olduğunu açıkça belirtmiştir."], [5075.0, "Çünkü onlarla arkadaşlık etmek ve oturmak, itikadın bozulmasına götüren yollardandır;"], [5079.8, "zira her arkadaş, arkadaş olduğuna uyar."], [5083.8, "Halkın dediği gibi: \"Arkadaş çekip götürendir\";"], [5089.7, "seni mutlaka çeker. Bu yüzden Allah Teâlâ şöyle buyurmuştur:"], [5094.0, "<span class=\"ayah\">﴿Ayetlerimiz hakkında (alaycı) dedikoduya dalanları gördüğünde onlardan yüz çevir﴾<\/span> [En'âm 68];"], [5098.7, "yani <span class=\"ayah\">﴿başka bir söze dalıncaya kadar﴾<\/span> onlarla oturma."]]}]}, {"ts": "1:25:00", "title": "34. Külliye (devam): Münazara ve bid'at ehlinden ilim · 35. Külliye: Dinde ilimsiz söz", "paras": [{"reader": false, "ar": [[5101.2, "ويتفرّع على ذلك النهيُ عن مناظرة أهل البدع؛"], [5107.0, "لأن أهل البدع مولَعون بمناظرة أهل السنة،"], [5110.0, "فلا ينبغي أن يناظرهم أهلُ السنة إلا مناظرةَ اضطرار ـ من العلماء الراسخين في العلم والعمل ـ لا مناظرةَ اختيار؛"], [5123.0, "لأن المناظرات وكثرتها مما يوجب فسادَ العقائد."], [5129.0, "فكم من إنسانٍ استمع إلى مناظرةٍ فلم يخرج منها بعقيدةٍ سليمة ولا بقلبٍ مطمئن!"], [5137.0, "وكم من المسلّمات التي هدمها كثيرٌ من الناس بسبب مناظرةٍ استمع إليها وهو خِلْوٌ عن أصول العقيدة الصحيحة!"]], "tr": [[5101.2, "Bid'at ehliyle münazaranın yasaklanması da buna dayanır."], [5105.4, "Çünkü bid'at ehli Ehl-i Sünnet'le münazaraya düşkündür."], [5109.1, "Ehl-i Sünnet'in onlarla ancak zaruret münazarası yapması gerekir —ki bunu da ilimde ve amelde derinleşmiş âlimler yapar—, tercih münazarası değil."], [5121.9, "Çünkü münazaralar ve onların çokluğu akîdelerin bozulmasını gerektiren şeylerdendir."], [5129.0, "Nice insan bir münazara dinlemiş de ondan ne sağlam bir akîdeyle ne de mutmain bir kalple çıkmıştır!"], [5138.4, "Nice kesin kabul edilmiş şeyi, birçok insan, sahih akîdenin usûlünden yoksunken dinlediği bir münazara yüzünden yıkmıştır!"]]}, {"reader": false, "ar": [[5150.0, "فكلُّ ما يُفضي إلى فساد الاعتقاد فالواجب سدُّه."], [5155.0, "ويتخرّج عليها النهيُ عن طلب العلم عند أهل البدع:"], [5161.0, "فلا تطلب العلم عند الأشاعرة،"], [5165.0, "ولا تطلب العلم عند الصوفية،"], [5168.0, "ولا تطلب العلم عند رجلٍ معتزلي؛"], [5171.0, "لأن طلبك للعلم بين يدي مبتدعٍ ربما يجرّك إلى بدعته وأنت لا ـ وأنت لا تشعر، وأنت لا تشعر."]], "tr": [[5150.0, "İtikadın bozulmasına götüren her şeyi kapatmak vâciptir."], [5153.8, "Bid'at ehlinin yanında ilim talep etmenin yasaklanması da buna dayanır:"], [5159.7, "Eş'arîlerin yanında ilim talep etme;"], [5163.4, "sûfîlerin yanında ilim talep etme;"], [5166.2, "Mu'tezilî bir adamın yanında ilim talep etme."], [5169.5, "Çünkü bir bid'atçının önünde ilim talep etmen, belki de sen farkında olmadan —sen farkında olmadan, sen farkında olmadan— seni onun bid'atine çeker."]]}, {"reader": false, "ar": [[5183.0, "فكلُّ طريقٍ يُفضي إلى الشرك فالواجب سدُّه،"], [5188.0, "كلُّ طريقٍ يُفضي إلى البدعة فالواجب سدُّه،"], [5191.0, "كلُّ طريقٍ يُفضي إلى زخرفة الباطل وتزيينه فالواجب سدُّه،"], [5196.0, "وكلُّ طريقٍ يُفضي إلى فساد العقائد فالواجب سدُّه؛"], [5199.0, "فهي كليةٌ تدخل تحت قاعدة سدّ الذرائع. والله أعلم."]], "tr": [[5183.0, "Şirke götüren her yolu kapatmak vâciptir;"], [5186.6, "bid'ate götüren her yolu kapatmak vâciptir;"], [5189.7, "bâtılı süslemeye ve güzel göstermeye götüren her yolu kapatmak vâciptir;"], [5194.9, "akîdelerin bozulmasına götüren her yolu kapatmak vâciptir."], [5197.9, "Bu, sedd-i zerâi' kaidesinin altına giren bir külliyedir. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[5204.1, "أحسن الله إليكم. الكلية الخامسة والثلاثون:"], [5210.0, "كلُّ من قال في الدين بلا علمٍ فقد قال على الله تعالى بلا علم."]], "tr": [[5204.1, "Allah size iyilik etsin. Otuz beşinci külliye:"], [5210.5, "Dinde ilimsiz söz söyleyen herkes, Allah Teâlâ hakkında ilimsiz söz söylemiş olur."]]}, {"reader": false, "ar": [[5217.0, "كلُّ من قال في الدين بلا علمٍ فقد قال على الله تعالى بلا علم."], [5222.8, "<span class=\"note\">(يكررها)<\/span> نعم، أقول وبالله التوفيق:"], [5232.0, "لقد أجمعت الشرائعُ على حرمة القول على الله عز وجل بلا علم،"], [5236.0, "والقول على الله عز وجل له صورٌ كثيرة،"], [5240.0, "ومن صوره: القولُ في دين الله وشريعته بلا علم؛"], [5245.0, "فإذا قرّرت شيئًا ونسبته إلى الدين بلا علمٍ فأنت ممن قال على الله عز وجل بلا علم،"], [5253.0, "وهذا محرّمٌ في كل الشرائع على الإطلاق."]], "tr": [[5217.0, "Dinde ilimsiz söz söyleyen herkes, Allah Teâlâ hakkında ilimsiz söz söylemiş olur."], [5222.1, "(Tekrar ediyor.) Evet. Tevfik Allah'tandır, derim ki:"], [5232.0, "Şeriatlar, Allah Teâlâ hakkında ilimsiz söz söylemenin haram olduğu üzerinde ittifak etmiştir."], [5236.0, "Allah Teâlâ hakkında söz söylemenin birçok sureti vardır;"], [5240.0, "bunlardan biri de Allah'ın dini ve şeriatı hakkında ilimsiz söz söylemektir."], [5246.2, "Bir şeyi takrir edip onu ilimsiz olarak dine nispet edersen, Allah Teâlâ hakkında ilimsiz söz söyleyenlerden olursun."], [5254.5, "Bu, istisnasız bütün şeriatlarda haramdır."]]}, {"reader": false, "ar": [[5260.0, "لقول الله عز وجل:"], [5261.0, "<span class=\"ayah\">﴿وَلَا تَقُولُوا لِمَا تَصِفُ أَلْسِنَتُكُمُ الْكَذِبَ هَٰذَا حَلَالٌ وَهَٰذَا حَرَامٌ لِّتَفْتَرُوا عَلَى اللَّهِ الْكَذِبَ ۚ إِنَّ الَّذِينَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ لَا يُفْلِحُونَ﴾<\/span> <span class=\"ref\">[النحل: ١١٦]<\/span>."], [5272.0, "وقال الله عز وجل:"], [5276.0, "<span class=\"ayah\">﴿مَا جَعَلَ اللَّهُ مِن بَحِيرَةٍ وَلَا سَائِبَةٍ وَلَا وَصِيلَةٍ وَلَا حَامٍ ۙ وَلَٰكِنَّ الَّذِينَ كَفَرُوا يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ ۖ وَأَكْثَرُهُمْ لَا يَعْقِلُونَ﴾<\/span> <span class=\"ref\">[المائدة: ١٠٣]<\/span>."]], "tr": [[5260.0, "Çünkü Allah Teâlâ şöyle buyurmuştur:"], [5261.0, "<span class=\"ayah\">﴿Allah'a karşı yalan uydurmak için, dillerinizin yalan yere nitelemesine dayanarak \"Bu helaldir, bu haramdır\" demeyin. Şüphesiz Allah'a karşı yalan uyduranlar kurtuluşa eremezler﴾<\/span> [Nahl 116]."], [5271.0, "Allah Teâlâ yine şöyle buyurmuştur:"], [5273.7, "<span class=\"ayah\">﴿Allah ne bahîre, ne sâibe, ne vasîle ne de hâm diye bir şey koymuştur; fakat kâfirler Allah'a karşı yalan uyduruyorlar ve çoğu akıl etmiyor﴾<\/span> [Mâide 103]."]]}, {"reader": false, "ar": [[5285.0, "وقال الله عز وجل:"], [5288.0, "<span class=\"ayah\">﴿قُلْ إِنَّمَا حَرَّمَ رَبِّيَ الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ وَالْإِثْمَ وَالْبَغْيَ بِغَيْرِ الْحَقِّ وَأَن تُشْرِكُوا بِاللَّهِ مَا لَمْ يُنَزِّلْ بِهِ سُلْطَانًا﴾<\/span>،"], [5298.0, "ثم ختمها بأعظم المحرّمات على الإطلاق في قوله:"], [5302.0, "<span class=\"ayah\">﴿وَأَن تَقُولُوا عَلَى اللَّهِ مَا لَا تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ٣٣]<\/span>."], [5304.0, "وقال الله عز وجل:"], [5306.0, "<span class=\"ayah\">﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ ۚ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا﴾<\/span> <span class=\"ref\">[الإسراء: ٣٦]<\/span>."]], "tr": [[5285.0, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿De ki: Rabbim ancak açık ve gizli hayâsızlıkları, günahı, haksız yere zulmü ve hakkında hiçbir delil indirmediği şeyi Allah'a ortak koşmanızı haram kılmıştır﴾<\/span>."], [5297.0, "Sonra onu, kesinlikle haramların en büyüğüyle bitirdi;"], [5300.5, "şu sözünde: <span class=\"ayah\">﴿…ve Allah hakkında bilmediğiniz şeyleri söylemenizi﴾<\/span> [A'râf 33]."], [5303.7, "Allah Teâlâ yine şöyle buyurmuştur:"], [5306.0, "<span class=\"ayah\">﴿Hakkında bilgin olmayan şeyin ardına düşme. Şüphesiz kulak, göz ve kalp, bunların hepsi ondan sorumludur﴾<\/span> [İsrâ 36]."]]}, {"reader": false, "ar": [[5314.0, "فكلُّ من دعاك إلى شركٍ فقد قال على الله بلا علم،"], [5320.0, "وكلُّ من زيّن لك بدعةً فقد قال على الله عز وجل بلا علم؛"], [5325.0, "إذ دين الله ليس مبنيًّا على الشرك ولا على البدعة."], [5329.0, "وكلُّ من دعاك إلى مخالفة شيءٍ من شريعة الله فقد دعاك إلى (غير) علم <span class=\"q\">؟ 01:28:49<\/span>."], [5335.0, "وما أكثرَ المتخوّضين في دين الله بلا علمٍ ولا برهان!"], [5339.0, "لا سيما في هذا الزمان الذي كثرت فيه الوسائل التي أوصلت الرويبض ـ أي التي أوصلت لنا صوتَ الرويبضة؛"], [5348.0, "فإن الرويبضة لم يكن له قولٌ ولا موقعٌ ولا منبرٌ يتكلّم مع الناس منه."]], "tr": [[5314.0, "Seni şirke çağıran herkes Allah hakkında ilimsiz söz söylemiştir;"], [5318.9, "sana bir bid'ati süsleyen herkes Allah Teâlâ hakkında ilimsiz söz söylemiştir;"], [5323.5, "çünkü Allah'ın dini ne şirk ne de bid'at üzerine kuruludur."], [5327.8, "Seni Allah'ın şeriatından bir şeye aykırılığa çağıran herkes seni (ilim olmayana) çağırmıştır <span class=\"q\">؟<\/span>."], [5334.1, "Allah'ın dinine ilimsiz ve delilsiz dalanlar ne kadar çok!"], [5337.4, "Özellikle de rüveybiza'yı —yani rüveybiza'nın sesini— bize ulaştıran vasıtaların çoğaldığı bu zamanda."], [5343.4, "Rüveybiza'nın (insanların işleri hakkında konuşan değersiz kimsenin) daha önce ne bir sözü, ne bir yeri, ne de insanlarla konuşacağı bir minberi vardı."]]}, {"reader": false, "ar": [[5359.0, "ولكن بعد وجود هذه الوسائل صار كلُّ مُرجِفٍ ومُبطِلٍ ومُضِلٍّ يجد له منبرًا يصعده،"], [5369.8, "ونافذةً يُطلّ منها، ليوصل ضلالَه وإضلالَه للناس؛"], [5378.0, "فلدعاة الشرك والوثنية مواقعُ كثيرة يزيّنون فيها الشرك،"], [5384.0, "ولدعاة البدعة مواقعُ كثيرة يزيّنون فيها البدع،"], [5388.0, "وللكهنة والسحرة والمشعوذين والعرّافين مواقعُ كثيرة يبثّون كهانتَهم وشعوذتَهم وسحرَهم من قِبَلها."], [5398.0, "والثابتُ في هذا الزمان هو من ثبّته الله عز وجل."]], "tr": [[5359.0, "Ama bu vasıtalar ortaya çıktıktan sonra, her bozguncu, her bâtıl ehli ve her saptırıcı çıkabileceği bir minber ve dışarı bakabileceği bir pencere bulur oldu;"], [5373.9, "sapıklığını ve saptırmasını insanlara ulaştırmak için."], [5380.9, "Şirk ve putperestliğe çağıranların, şirki süsledikleri birçok sitesi vardır;"], [5386.3, "bid'ate çağıranların bid'atleri süsledikleri birçok sitesi vardır;"], [5390.3, "kâhinlerin, sihirbazların, şarlatanların ve falcıların, kâhinliklerini, şarlatanlıklarını ve sihirlerini yaydıkları birçok sitesi vardır."], [5399.2, "Bu zamanda sebat eden, Allah Teâlâ'nın sebat verdiği kimsedir."]]}]}, {"ts": "1:30:00", "title": "35. Külliye (sonu) · 36. Külliye: Kâinat üzerine tefekkür ve en büyük maksadı", "paras": [{"reader": false, "ar": [[5404.0, "وإني أرى أننا إن تجاوزنا هذه المرحلة العسيرة الصعبة،"], [5409.0, "ونحن على ما نحن عليه باطنًا وظاهرًا،"], [5413.0, "فإنها كرامةٌ من الله في هذا الثبات؛"], [5415.0, "فإننا نمرّ بفتنٍ تقلع الجبلَ من أصوله ورواسيه،"], [5421.0, "وتحرق الأخضر واليابس، ونمرّ بفتنٍ هي كالأعاصير التي تقتلع الشجرةَ ذاتَ الجذور القوية في الأرض،"], [5435.0, "نحن نمرّ بفتنٍ كالزلازل التي لا يثبت عليها قدم،"], [5440.1, "ولا يقوم عليها شيءٌ قائم،"], [5443.0, "فتدمّر كلَّ شيءٍ بأمر ربها."]], "tr": [[5404.0, "Ben görüyorum ki, bu zorlu ve çetin merhaleyi, içte ve dışta üzerinde bulunduğumuz hâl üzere atlatırsak, bu sebat Allah'tan bir ikramdır."], [5414.4, "Çünkü dağı kökünden ve temellerinden söken, yaşı kuruyu yakan fitnelerden geçiyoruz."], [5421.9, "Yerdeki kökleri sağlam ağacı söküp atan kasırgalar gibi fitnelerden geçiyoruz."], [5430.5, "Üzerinde hiçbir ayağın sabit duramadığı, üzerinde ayakta duran hiçbir şeyin kalamadığı, Rabbinin emriyle her şeyi yerle bir eden depremler gibi fitnelerden geçiyoruz."]]}, {"reader": false, "ar": [[5446.0, "فإذا خرجتَ منها سالمًا معافًى ـ باطنًا في عقيدتك،"], [5450.3, "وظاهرًا في تعبّداتك وأعمالك وأقوالك ـ فأنت على كرامةٍ من الله في هذا الثبات."], [5456.0, "نسأل الله عز وجل الثبات. والله أعلم."]], "tr": [[5446.0, "Bunlardan —içte akîdende, dışta ibadetlerinde, amellerinde ve sözlerinde— salim ve afiyette çıkarsan, bu sebatta Allah'tan bir ikram üzeresin."], [5455.2, "Allah Teâlâ'dan sebat dileriz. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[5463.8, "(نعم، أحسن الله إليكم. القاعدة السادسة والثلاثون:) <b>كلُّ تفكّرٍ في الكون لا يوصل إلى اعتقاد استحقاق الله تعالى للعبودية فمعزولٌ عن مقصوده الأعظم.<\/b> <span class=\"note\">(Külliyenin numarası ve üç kez okunuşu Whisper'da yok; YouTube altyazısından alındı.)<\/span>"]], "tr": [[5463.8, "(Evet, Allah size iyilik etsin. Otuz altıncı kaide:) <b>Allah Teâlâ'nın ibadete layık olduğu inancına ulaştırmayan kâinat üzerine her tefekkür, en büyük maksadından uzaklaştırılmıştır.<\/b>"]]}, {"reader": false, "ar": [[5499.0, "نعم، أقول وبالله التوفيق:"], [5501.0, "لقد أمرنا الله عز وجل في كتابه وسنة رسوله ﷺ بالنظر في هذا الكون،"], [5507.6, "والتفكّر في هذه الآيات العلوية والسفلية؛"], [5510.0, "فأمرنا بالتفكّر في السماوات والأرض،"], [5515.0, "فقال الله عز وجل ـ ويتفكّروا ـ:"], [5517.5, "<span class=\"ayah\">﴿إِنَّ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ وَاخْتِلَافِ اللَّيْلِ وَالنَّهَارِ لَآيَاتٍ لِّأُولِي الْأَلْبَابِ ۝ الَّذِينَ يَذْكُرُونَ اللَّهَ قِيَامًا وَقُعُودًا وَعَلَىٰ جُنُوبِهِمْ وَيَتَفَكَّرُونَ فِي خَلْقِ السَّمَاوَاتِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[آل عمران: ١٩٠–١٩١]<\/span>،"], [5531.0, "الآياتِ بتمامها، والآيات في هذا المعنى كثيرة."]], "tr": [[5499.0, "Evet. Tevfik Allah'tandır, derim ki:"], [5500.5, "Allah Teâlâ, Kitabı'nda ve Resûlü ﷺ'in Sünnet'inde bize bu kâinata bakmayı ve bu yukarı ve aşağı ayetler üzerinde tefekkür etmeyi emretmiştir."], [5508.8, "Bize gökler ve yer üzerinde tefekkür etmeyi emretti."], [5512.4, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Şüphesiz göklerin ve yerin yaratılışında, gece ile gündüzün birbiri ardınca gelişinde akıl sahipleri için ayetler vardır. Onlar ayakta, otururken ve yanları üzerine yatarken Allah'ı anarlar ve göklerin ve yerin yaratılışı üzerinde tefekkür ederler﴾<\/span> [Âl-i İmrân 190–191];"], [5532.4, "ayetlerin tamamı. Bu manada ayetler çoktur."]]}, {"reader": false, "ar": [[5536.0, "فكثيرًا ما يقول الله:"], [5538.7, "<span class=\"ayah\">﴿أَفَلَا يَنظُرُونَ﴾<\/span>، <span class=\"ayah\">﴿أَفَلَا يَعْقِلُونَ﴾<\/span>،"], [5541.4, "«أفلا يتفكرون» <span class=\"note\">(bu lafızla mushafta yok; en yakını <span class=\"ayah\">﴿أَفَلَا تَتَفَكَّرُونَ﴾<\/span> <span class=\"ref\">[الأنعام: ٥٠]<\/span>)<\/span>، <span class=\"ayah\">﴿لِّقَوْمٍ يَعْقِلُونَ﴾<\/span>،"], [5544.1, "<span class=\"ayah\">﴿لِّقَوْمٍ يَتَفَكَّرُونَ﴾<\/span>؛ كلُّ ذلك دعوةٌ من الله عز وجل إلى التأمّل والتفكّر والنظر في هذا الكون المفتوح أمام عينيك،"], [5557.2, "بسماواته وأفلاكها وأجرامها الكبيرة،"], [5564.0, "وبأرضه ووِهادها وجبالها وأشجارها وأنهارها وبحارها،"], [5570.0, "وما عليها من الإنس والجنّ والحيوان والطير."]], "tr": [[5536.0, "Allah çokça şöyle buyurur: <span class=\"ayah\">﴿Bakmıyorlar mı?﴾<\/span>, <span class=\"ayah\">﴿Akıl etmiyorlar mı?﴾<\/span>, <span class=\"ayah\">﴿Tefekkür etmiyorlar mı?﴾<\/span>, <span class=\"ayah\">﴿Akıl eden bir kavim için﴾<\/span>, <span class=\"ayah\">﴿Tefekkür eden bir kavim için﴾<\/span>."], [5550.7, "Bütün bunlar, Allah Teâlâ'dan; gökleri, felekleri ve büyük gök cisimleriyle, yeri, ovaları, dağları, ağaçları, nehirleri, denizleri ve üzerindeki insanlar, cinler, hayvanlar ve kuşlarla gözlerinin önüne serilmiş bu kâinat üzerinde düşünmeye, tefekküre ve bakmaya bir davettir."]]}, {"reader": false, "ar": [[5574.0, "فأنت مأمورٌ بأن تنظر في هذا الكون،"], [5578.0, "وأن تتفكّر وتتأمّل فيه،"], [5580.0, "لكن كلُّ نظرٍ في هذا الكون لا يوصلك إلى مقصوده الأعظم فإنه عليك لا لك،"], [5587.8, "ووزرٌ لا أجر، وغُرمٌ لا غُنم."], [5596.0, "فإن قلت: ولماذا؟ نقول:"], [5598.0, "لأن الله عز وجل إنما نصب هذه الآيات ـ وهي من آيات ربوبيته ـ لنصل بها إلى استحقاقه في ألوهيته."]], "tr": [[5574.0, "Sen bu kâinata bakmakla, onun üzerinde tefekkür etmek ve düşünmekle emrolunmuşsun."], [5580.0, "Ama bu kâinata dair seni onun en büyük maksadına ulaştırmayan her bakış senin lehine değil aleyhinedir;"], [5588.5, "ecir değil vebaldir, kazanç değil ziyandır."], [5596.5, "\"Neden?\" dersen, deriz ki: Çünkü Allah Teâlâ, rubûbiyyetinin ayetlerinden olan bu ayetleri, onlarla O'nun ulûhiyyete layık oluşuna ulaşalım diye dikmiştir."]]}, {"reader": false, "ar": [[5607.0, "فتقول: إن الذي خلق هذه الشمس المضيئة ـ هذا الكوكب المحترق طيلةَ حياته،"], [5616.0, "وهو يمدّ الأرض بالطاقة ـ إن خالقها هو المستحقّ للعبادة؛"], [5625.0, "فإذا أوصلك النظر في الشمس إلى هذه النهاية فهذا نظرٌ مأمورٌ به ومأجورٌ عليه."], [5631.0, "لكن كثيرٌ من الناس ينظر إلى هذا الكون ثم يوصله النظرُ إلى تعطيل خالقه،"], [5638.0, "لعجز عقله (عن إدراك) أن الذي خلق هذا الكون واحد."]], "tr": [[5607.0, "Şöyle dersin: Bu parlak güneşi —ömrü boyunca yanan ve yeryüzüne enerji sağlayan bu yıldızı— yaratan, onun yaratıcısı, ibadete layık olandır."], [5623.2, "Güneşe bakmak seni bu sonuca ulaştırırsa, bu emredilmiş ve ecir verilen bir bakıştır."], [5630.5, "Ama insanların çoğu bu kâinata bakar, sonra bu bakış onu, aklı bu kâinatı yaratanın bir olduğunu (kavramaktan) aciz kaldığı için, onun yaratıcısını inkâra götürür."]]}, {"reader": false, "ar": [[5642.0, "ومن الناس من ينظر إلى هذا الكون بأفلاكه،"], [5648.0, "ثم يقوده هذا النظر إلى عبادته من دون الله عز وجل؛"], [5657.0, "فكم من قومٍ لما عرفوا عظيمَ منفعة الشمس لهم عبدوها من دون الله،"], [5663.0, "ولما رأوا عظيمَ منفعة البقر لهم عبدوها من دون الله؛"], [5670.0, "لم يجعلوها آيةً تدلّهم على استحقاق ربها بالعبادة،"], [5676.0, "وإنما عبدوها لما تأمّلوها وتفكّروا فيها،"], [5679.0, "وهذا غُرمٌ على العبد لا غُنم."]], "tr": [[5642.0, "İnsanlardan kimi de bu kâinata felekleriyle bakar, sonra bu bakış onu Allah Teâlâ'yı bırakıp ona ibadete götürür."], [5653.5, "Nice kavim güneşin kendileri için büyük faydasını öğrenince Allah'ı bırakıp ona taptı;"], [5661.4, "ineğin kendileri için büyük faydasını görünce Allah'ı bırakıp ona taptı."], [5668.0, "Onu, Rabbinin ibadete layık olduğunu kendilerine gösteren bir ayet kılmadılar;"], [5673.6, "bilakis onun üzerinde düşünüp tefekkür edince ona taptılar."], [5678.5, "Bu da kul için kazanç değil ziyandır."]]}, {"reader": false, "ar": [[5684.0, "فالله عز وجل أقام لنا نوعين من الآيات لنتفكّر ونتأمّل فيها:"], [5693.0, "الآيات المنظورة، والآيات المسطورة."], [5702.0, "فالآيات المسطورة هي الكتاب والسنة،"], [5707.0, "فيقودنا التأمّلُ والنظر فيها إلى أن من أنزلها وشرعها هو المستحقّ للعبادة دون ما سواه،"], [5716.0, "وأيُّ نظرٍ في الكتاب والسنة لا يوصلك إلى هذه الحقيقة فإنه عليك لا لك."]], "tr": [[5684.0, "Allah Teâlâ, üzerinde tefekkür edip düşünelim diye bize iki tür ayet kılmıştır:"], [5692.3, "görülen (kevnî) ayetler ve yazılı ayetler."], [5702.0, "Yazılı ayetler Kitap ve Sünnet'tir."], [5705.2, "Onlar üzerinde düşünmek ve bakmak bizi, onları indirenin ve şeriat kılanın, kendisinden başkasının değil, yalnız kendisinin ibadete layık olduğu (sonucuna) götürür."], [5716.8, "Kitap ve Sünnet'e dair seni bu hakikate ulaştırmayan her bakış senin lehine değil aleyhinedir."]]}, {"reader": false, "ar": [[5722.0, "ثم ترفع بصرك من الآيات المسطورة إلى الآيات المنظورة،"], [5729.0, "فيدلّك النظرُ والتفكّر فيها إلى أن وراءها خالقًا يستحقّ العبادة دون ما سواه."], [5735.0, "فإن لم يوصلك النظرُ في هذين النوعين من الآيات إلى تلك النتيجة فهو عليك لا لك. والله أعلم."]], "tr": [[5722.0, "Sonra gözünü yazılı ayetlerden görülen ayetlere kaldırırsın;"], [5726.3, "onlar üzerinde bakmak ve tefekkür etmek sana, onların ardında, kendisinden başkasının değil, yalnız kendisinin ibadete layık olduğu bir yaratıcı bulunduğunu gösterir."], [5736.0, "Bu iki tür ayete bakmak seni o sonuca ulaştırmazsa, bu senin lehine değil aleyhinedir. Allah en iyisini bilir."]]}]}, {"ts": "1:35:44", "title": "37. Külliye: Her doğan fıtrat üzere doğar · 38. Külliye: Masuma dayanan masumdur", "paras": [{"reader": true, "ar": [[5743.8, "أحسن الله إليكم. الكلية السابعة والثلاثون:"], [5749.0, "كلُّ مولودٍ فيُولد على الفطرة."]], "tr": [[5743.8, "Allah size iyilik etsin. Otuz yedinci külliye:"], [5749.0, "Her doğan fıtrat üzere doğar."]]}, {"reader": false, "ar": [[5753.0, "نعم، أقول وبالله التوفيق:"], [5763.0, "في الصحيحين من حديث أبي هريرة رضي الله عنه قال:"], [5765.4, "قال النبي ﷺ: «كلُّ مولودٍ يُولد على الفطرة، فأبواه يُهوّدانه أو يُنصّرانه أو يُمجّسانه، كما تُنتَج البهيمةُ بهيمةً جمعاء، فهل تُحسّون فيها من جدعاء؟» ثم قرأ قولَ الله عز وجل ـ أو قال:"], [5783.6, "واقرؤوا إن شئتم ـ: <span class=\"ayah\">﴿فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا ۚ لَا تَبْدِيلَ لِخَلْقِ اللَّهِ﴾<\/span> <span class=\"ref\">[الروم: ٣٠]<\/span> <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[5753.0, "Evet. Tevfik Allah'tandır, derim ki:"], [5755.6, "Sahîhayn'de Ebû Hüreyre'den (r.a.) gelen hadiste şöyle der:"], [5764.3, "Nebî ﷺ buyurdu: \"Her doğan fıtrat üzere doğar;"], [5768.0, "sonra anne babası onu Yahudi, Hristiyan ya da Mecûsî yapar."], [5772.0, "Tıpkı hayvanın, (organları) tam bir yavru doğurması gibi;"], [5775.8, "onda burnu ya da kulağı kesik bir tane görüyor musunuz?\" Sonra Allah Teâlâ'nın şu sözünü okudu —ya da \"İsterseniz şunu okuyun\" dedi—:"], [5784.5, "<span class=\"ayah\">﴿Allah'ın insanları üzerine yarattığı fıtrat; Allah'ın yaratışında değişme yoktur﴾<\/span> [Rûm 30] <span class=\"note\">(Buhârî, Müslim)<\/span>."]]}, {"reader": false, "ar": [[5788.0, "وهي فطرةُ الإقرار بوحدانية الله عز وجل؛"], [5792.0, "فلو تُرك الولدُ الصغير وفطرتَه لنشأ وهو عالمٌ باستحقاق الله عز وجل في وحدانية ربوبيته."], [5801.0, "وكما قال النبي ﷺ ـ في صحيح مسلم من حديث عياض بن حمار رضي الله تعالى عنه ـ قال:"], [5812.5, "قال الله تبارك وتعالى:"], [5814.5, "«وإني خلقتُ عبادي حنفاءَ كلَّهم، وإن الشياطين جاءتهم فاجتالتهم عن دينهم، وحرّمت عليهم ما أحللتُ لهم» <span class=\"note\">(Müslim)<\/span>."]], "tr": [[5788.0, "Bu, Allah Teâlâ'nın birliğini ikrar fıtratıdır."], [5790.9, "Küçük çocuk fıtratıyla baş başa bırakılsaydı, Allah Teâlâ'nın rubûbiyyetinin birliğinde (ibadete) layık olduğunu bilerek büyürdü."], [5799.0, "Nebî ﷺ'in —Sahîh-i Müslim'de İyâz b."], [5805.1, "Himâr'dan (r.a.) gelen hadiste— buyurduğu gibi:"], [5807.9, "Allah Tebâreke ve Teâlâ şöyle buyurdu:"], [5811.4, "\"Ben kullarımın hepsini hanîfler (tevhide yönelmiş) olarak yarattım."], [5815.0, "Şeytanlar onlara gelip onları dinlerinden saptırdı ve onlara helal kıldığım şeyleri onlara haram kıldı.\" <span class=\"note\">(Müslim)<\/span>"]]}, {"reader": false, "ar": [[5824.0, "فنحن مخلوقون على الحنيفية،"], [5826.9, "ونحن مخلوقون على الفطرة،"], [5830.0, "ولكن المشكلة في المؤثّرات الإبليسية والبيئية:"], [5836.0, "فالمؤثّرات الإبليسية: الشياطين وقرناء السوء الذين يحرفوننا عن فطرتنا وحنيفيّتنا،"], [5846.0, "والمؤثّرات البيئية: أن ينشأ الإنسان بين أبوين مجوسيين فيُمجّسانه،"], [5853.0, "أو يهوديين فيُهوّدانه، أو نصرانيين فيُنصّرانه."], [5859.0, "ولم يقل: أو يُمسلمانه،"], [5861.5, "لأنه مسلمٌ بأصالة الفطرة."]], "tr": [[5824.0, "Biz hanîflik üzere yaratılmışız, fıtrat üzere yaratılmışız."], [5826.9, "Ama sorun iblisçe ve çevresel etkilerdedir."], [5830.0, "İblisçe etkiler: bizi fıtratımızdan ve hanîfliğimizden saptıran şeytanlar ve kötü arkadaşlar."], [5836.8, "Çevresel etkiler: İnsanın Mecûsî bir anne babanın arasında büyüyüp onların onu Mecûsî yapması, ya da Yahudi (bir anne babanın arasında büyüyüp) onların onu Yahudi yapması, ya da Hristiyan (bir anne babanın arasında büyüyüp) onların onu Hristiyan yapması."], [5859.0, "\"Ya da onu Müslüman yapar\" demedi;"], [5861.5, "çünkü o, fıtratın aslı gereği Müslümandır."]]}, {"reader": false, "ar": [[5864.0, "وهذه هي الورقةُ الرابحة في يد الدعاة،"], [5868.9, "وهي ورقةُ الفطرة؛ ولذلك فإن الدعاة إلى الحقّ إذا صفّوا هذه الفطرةَ مما التصق بها من القذارة البيئية أو التسويلات الشيطانية فإنها ترجع إلى صفائها وإلى نقائها،"], [5890.0, "مُقرّةً بأن الله هو ربها وخالقها ومالكها،"], [5893.5, "والمستحقّ لأن يُعبد دون ما سواه."]], "tr": [[5864.0, "Davetçilerin elindeki kazandıran kart budur;"], [5866.8, "o da fıtrat kartıdır. Bu yüzden hakka davet edenler bu fıtratı, ona yapışan çevresel pisliklerden ya da şeytanî süslemelerden arındırırlarsa, fıtrat berraklığına ve saflığına döner;"], [5887.0, "Allah'ın, onun Rabbi, Yaratıcısı ve Mâliki olduğunu ve kendisinden başkasının değil, yalnız kendisinin ibadet edilmeye layık olduğunu ikrar eder."]]}, {"reader": false, "ar": [[5897.0, "فتقريرُ التوحيد في قلوب الناس تؤيّده الفطرة،"], [5902.0, "ولكن تقريرُ الشرك في قلوب الناس تخالفه الفطرة."], [5905.0, "ولكن في الواقع أن المشركين في الأرض أكثرُ من أهل التوحيد،"], [5911.0, "وهذا لانطماس الفطرة، وابتعادها عن مصدر عزّها،"], [5920.0, "وهو الوحي من الكتاب والسنة. والله أعلم. نعم."]], "tr": [[5897.0, "Tevhidi insanların kalplerinde yerleştirmeyi fıtrat destekler;"], [5901.3, "şirki insanların kalplerinde yerleştirmeye ise fıtrat aykırıdır."], [5904.2, "Ama gerçekte yeryüzünde müşrikler tevhid ehlinden daha çoktur."], [5908.3, "Bu da fıtratın silinmesinden ve izzetinin kaynağından —yani Kitap ve Sünnet'ten oluşan vahiyden— uzaklaşmasındandır."], [5921.2, "Allah en iyisini bilir. Evet."]]}, {"reader": true, "ar": [[5924.0, "أحسن الله إليكم. القاعدة ـ الكلية الثامنة والثلاثون:"], [5929.0, "كلُّ ما استند إلى المعصوم فمعصوم."]], "tr": [[5924.0, "Allah size iyilik etsin. Kaide, otuz sekizinci külliye:"], [5929.7, "Masuma dayanan her şey masumdur."]]}, {"reader": false, "ar": [[5933.0, "أقول وبالله التوفيق: وأقصد بالمعصوم دليلَ الوحي من الكتاب والسنة؛"], [5946.0, "فكلُّ مذهبٍ استند في عقائده
