<script>
const D={"no": 40, "vid": "L3mZhOteti4", "title_ar": "الدرس (٤٠) من شرح كليات العقيدة — من كليات توحيد الألوهية: التوكل والاستعاذة والاستعانة والخوف", "title_tr": "Şerhu Külliyyâti'l-Akîde — 40. Ders: Ulûhiyyet Tevhidi Külliyeleri (Tevekkül, Tevekkülün Rubûbiyyet Bilgisiyle Artması, Tevekkülde Sebeplere Sarılmak, İstiâze, İstiâne, Gizli Korku)", "sections": [{"ts": "00:00", "title": "1. Külliye: Kalbinin tevekkülünden bir şubeyi Allah'tan başkasına yönelten şirke düşmüştür", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.7, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.4, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [9.0, "أمّا بعد: فلا نزال في سياق الكلّيّات التي تتعلّق بتوحيد الألوهية،"], [15.4, "وعندنا في هذا الدرس جُمَلٌ من الكلّيّات العظيمة."], [20.0, "الكلّيّة الأولى: <b>كلُّ من صرف شُعبةً من توكُّل قلبه لغير الله فقد أشرك.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.7, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.2, "Bundan sonra: Hâlâ ulûhiyyet tevhidiyle ilgili külliyelerin akışı içindeyiz."], [15.4, "Bu derste elimizde birtakım büyük külliyeler var."], [20.0, "<b>1. külliye: Kalbinin tevekkülünden bir şubeyi Allah'tan başkasına yönelten herkes şirke düşmüştür.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[25.0, "أقول وبالله التوفيق: ومن المعلوم أنّ التوكُّل على الله عز وجل هو اعتمادُ القلب على الله عز وجل في تحقيق المصالح وجلبها،"], [53.0, "وفي درء المفاسد والمضارّ ودفعها،"], [57.0, "وهو عبارةٌ عن كمال تفويض الأمر لله عز وجل،"], [63.0, "والاستعانةِ به في جميع الأحوال."], [66.0, "ومن المعلوم أنّ التوكّل ليس قولًا يُقال باللسان،"], [71.0, "وإنما هو اعتقادٌ يُعتقد بالجَنان."], [74.0, "فلو قال الإنسان من هنا إلى غدٍ:"], [77.2, "«بأنني متوكّلٌ على الله»،"], [79.0, "واللهُ يعلم أنّ شُعَبَ قلبه متوكّلةٌ على غيره،"], [82.0, "فإنّ نطقَ لسانه بالتوكّل لا يُغني عن انصراف شُعَب قلبه توكُّلًا على الله عز وجل."]], "tr": [[25.0, "Tevfik Allah'tandır, derim ki: Bilindiği gibi Allah Azze ve Celle'ye tevekkül, maslahatları gerçekleştirmede ve celbetmede, mefsedetleri ve zararları savmada ve def etmede kalbin Allah Azze ve Celle'ye dayanmasıdır."], [56.2, "O, işi tamamen Allah Azze ve Celle'ye havale etmek ve bütün hâllerde O'ndan yardım istemekten ibarettir."], [66.0, "Yine bilindiği gibi tevekkül dil ile söylenen bir söz değil, kalp ile inanılan bir inançtır."], [74.0, "İnsan buradan yarına kadar \"Ben Allah'a tevekkül ediyorum\" dese, Allah da onun kalbinin şubelerinin başkasına tevekkül ettiğini bilse, dilinin tevekkülü söylemesi, kalbinin şubelerinin (başkasına) yönelmesine karşı Allah Azze ve Celle'ye tevekkül olarak bir fayda vermez."]]}, {"reader": false, "ar": [[90.0, "ولذلك قال الإمام ابنُ القيّم رحمه الله تعالى:"], [94.0, "«وسِرُّ التوكّل وحقيقتُه هو اعتمادُ القلب على الله وحده، فلا يضرُّه مباشرةُ الأسباب مع خُلُوّ القلب من الاعتماد عليها والركونِ إليها، كما لا ينفعه قولُه: توكّلتُ على الله، مع اعتماده على غيره وركونِه إليه وثقتِه به. فتوكّلُ اللسان شيء، وتوكّلُ القلب شيء، كما أنّ توبةَ اللسان مع إصرار القلب شيء، وتوبةَ القلب وإن لم ينطق اللسانُ شيء. فقولُ العبد: توكّلتُ على الله، مع اعتماد قلبه على غيره، مثلُ قوله: تُبتُ إلى الله، وهو مُصِرٌّ على معصيته مرتكِبٌ لها»."], [141.5, "انتهى كلامه رحمه الله."]], "tr": [[90.0, "Bu yüzden İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [91.0, "\"Tevekkülün sırrı ve hakikati, kalbin yalnızca Allah'a dayanmasıdır."], [92.0, "Kalp sebeplere dayanmaktan ve onlara meyletmekten boş olduğu sürece sebeplere doğrudan girişmek ona zarar vermez."], [94.0, "Nitekim başkasına dayanıp ona meylettiği ve ona güvendiği hâlde 'Allah'a tevekkül ettim' demesi de ona fayda vermez."], [113.2, "Dilin tevekkülü bir şeydir, kalbin tevekkülü başka bir şeydir."], [124.1, "Tıpkı kalbin ısrarıyla birlikte dilin tövbesinin bir şey, dil söylemese bile kalbin tövbesinin başka bir şey olması gibi."], [141.5, "Kalbi başkasına dayandığı hâlde kulun 'Allah'a tevekkül ettim' demesi, günahında ısrar edip onu işlemeye devam ederken 'Allah'a tövbe ettim' demesine benzer.\" Onun —Allah ona rahmet etsin— sözü burada bitti."]]}, {"reader": false, "ar": [[143.0, "وهذا دليلٌ على أننا نتكلّم عن شُعبةٍ من شُعَب التوحيد لها تعلُّقٌ عظيمٌ بشِغاف القلب."], [151.0, "ولذلك قال العلماء بأنّ التوكّل عبادةٌ قلبيّةٌ محضة،"], [154.4, "لا يجوز أن يُصرف شيءٌ من شُعَبه لغير الله عز وجل."], [159.0, "فلا يُقسم التوكّلُ إلى توكّلٍ طبعيٍّ وإلى توكّلٍ تعبُّديّ،"], [165.0, "كما نقوله في الخوف؛"], [167.0, "فإنّ من الخوف ما هو خوفٌ طبعيّ،"], [170.5, "ومنه ما هو خوفٌ تعبُّديّ."], [173.0, "لكنّ القلب <span class=\"q\">؟ 02:53<\/span> بكلّ شُعَبه وكلّ تفاصيله من الأمور التعبُّديّة القلبيّة المحضة."]], "tr": [[143.0, "Bu da gösteriyor ki biz, kalbin derinlikleriyle (şiğâfıyla) büyük bir ilgisi olan tevhid şubelerinden bir şubeden bahsediyoruz."], [151.0, "Bu yüzden âlimler şöyle demiştir:"], [152.7, "Tevekkül saf bir kalbî ibadettir;"], [154.4, "onun şubelerinden hiçbir şeyin Allah Azze ve Celle'den başkasına yöneltilmesi caiz değildir."], [159.0, "Dolayısıyla tevekkül, korku hakkında dediğimiz gibi tabiî tevekkül ve taabbudî tevekkül diye kısımlara ayrılmaz."], [167.0, "Çünkü korkunun bir kısmı tabiî korku, bir kısmı da taabbudî korkudur."], [173.0, "Fakat kalp <span class=\"q\">؟<\/span> bütün şubeleri ve bütün ayrıntılarıyla saf kalbî taabbudî işlerdendir."]]}, {"reader": false, "ar": [[181.0, "وممّا يؤكّد على أنّ التوكّل من أعظم العبادات هو أنّ المتقرِّر في القواعد أنّ التوكّل نصفُ الدين."], [190.0, "وبيانُ ذلك عند الإمام ابن القيّم في قوله:"], [195.4, "«التوكّل نصفُ الدين، ونصفُه الثاني الإنابة؛ فإنّ الدين استعانةٌ وعبادة، فالتوكّل هو الاستعانة، والإنابةُ هي العبادة»."], [210.0, "وعلى ذلك قولُ الله عز وجل:"], [213.0, "<span class=\"ayah\">﴿إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ﴾<\/span> <span class=\"ref\">[الفاتحة: ٥]<\/span>؛"], [215.0, "فالعبادة في <span class=\"ayah\">﴿إِيَّاكَ نَعْبُدُ﴾<\/span>،"], [217.9, "والتوكّل في <span class=\"ayah\">﴿وَإِيَّاكَ نَسْتَعِينُ﴾<\/span>."], [221.0, "وهذا يدلُّك على عظيم منزلة التوكّل."]], "tr": [[181.0, "Tevekkülün en büyük ibadetlerden olduğunu pekiştiren şeylerden biri de, kaidelerde yerleşik olduğu üzere tevekkülün dinin yarısı olmasıdır."], [187.4, "Bunun açıklaması İmam İbnü'l-Kayyim'in şu sözündedir:"], [190.0, "\"Tevekkül dinin yarısıdır, diğer yarısı da inâbedir."], [195.4, "Çünkü din, istiâne ve ibadetten ibarettir;"], [198.1, "tevekkül istiânedir, inâbe de ibadettir.\" Allah Azze ve Celle'nin şu sözü de buna dayanır:"], [210.0, "<span class=\"ayah\">﴿Yalnız Sana ibadet ederiz ve yalnız Senden yardım dileriz﴾<\/span> [Fâtiha 5]."], [213.0, "İbadet <span class=\"ayah\">﴿Yalnız Sana ibadet ederiz﴾<\/span> kısmında, tevekkül de <span class=\"ayah\">﴿ve yalnız Senden yardım dileriz﴾<\/span> kısmındadır."], [221.0, "Bu da sana tevekkülün mertebesinin ne kadar büyük olduğunu gösterir."]]}, {"reader": false, "ar": [[225.0, "والتوكّلُ على الله عز وجل من أعظم واجبات الدين،"], [230.0, "فما يُقال في الإخلاص يُقال في التوكّل تمامًا."], [237.0, "فكما أنّ الإخلاص من عبادات القلب المحضة التي لا يجوز أن تُصرف لغير الله عز وجل،"], [243.0, "فكذلك التوكّلُ على الله عز وجل من العبادات المحضة التي لا يجوز أن تُصرف لغير الله عز وجل."]], "tr": [[225.0, "Allah Azze ve Celle'ye tevekkül, dinin en büyük vaciplerindendir."], [229.4, "İhlas hakkında ne deniyorsa tevekkül hakkında da aynen o denir."], [237.0, "İhlas, Allah Azze ve Celle'den başkasına yöneltilmesi caiz olmayan saf kalp ibadetlerinden olduğu gibi, Allah Azze ve Celle'ye tevekkül de Allah Azze ve Celle'den başkasına yöneltilmesi caiz olmayan saf ibadetlerdendir."]]}, {"reader": false, "ar": [[251.0, "وعلى ذلك آياتٌ كثيرة؛"], [253.9, "كقول الله عز وجل:"], [256.0, "<span class=\"ayah\">﴿وَعَلَى اللَّهِ فَتَوَكَّلُوا إِن كُنتُم مُّؤْمِنِينَ﴾<\/span> <span class=\"ref\">[المائدة: ٢٣]<\/span>."], [259.0, "فقولُه: «وعلى الله توكّلوا» هذا من تقديم المعمول على عامله <span class=\"note\">(Şeyh «تقديم العامل على معموله» diyor)<\/span>،"], [264.0, "وهذا في قواعد اللغة العربية يفيد الحصر؛"], [268.0, "أي: لا تتوكّلوا إلا على الله عز وجل."], [272.0, "ومثلُه قولُ الله عز وجل:"], [275.3, "<span class=\"ayah\">﴿وَعَلَى اللَّهِ فَلْيَتَوَكَّلِ الْمُؤْمِنُونَ﴾<\/span> <span class=\"ref\">[آل عمران: ١٢٢]<\/span>."], [278.0, "ويقول الله عز وجل:"], [279.6, "<span class=\"ayah\">﴿وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ﴾<\/span> <span class=\"ref\">[الطلاق: ٣]<\/span>."], [282.0, "ويقول الله عز وجل:"], [284.7, "<span class=\"ayah\">﴿فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ﴾<\/span> <span class=\"ref\">[آل عمران: ١٥٩]<\/span>."], [288.0, "ويقول الله عز وجل:"], [290.5, "<span class=\"ayah\">﴿ذَٰلِكُمُ اللَّهُ رَبِّي عَلَيْهِ تَوَكَّلْتُ وَإِلَيْهِ أُنِيبُ﴾<\/span> <span class=\"ref\">[الشورى: ١٠]<\/span>."], [295.0, "وأنت ترى أنّ العامل يُقدَّم في كلّ هذه الآيات على معموله <span class=\"note\">(كذا؛ والمراد: المعمول على عامله)<\/span>،"], [301.0, "ممّا يدلّ على حصر التوكّل في الله عز وجل،"], [305.0, "حصرِ التوكّل في الله عز وجل."]], "tr": [[251.0, "Bu konuda birçok ayet vardır."], [253.9, "Allah Azze ve Celle'nin şu sözü gibi:"], [256.0, "<span class=\"ayah\">﴿Eğer mü'minler iseniz yalnız Allah'a tevekkül edin﴾<\/span> [Mâide 23]."], [259.0, "\"Ve Allah'a tevekkül edin\" sözü, ma'mûlün âmilden önce getirilmesi kabîlindendir (Şeyh \"âmilin ma'mûlden önce getirilmesi\" diyor)."], [264.0, "Bu da Arap dili kaidelerinde hasr (sınırlama) ifade eder;"], [268.0, "yani: Allah Azze ve Celle'den başkasına tevekkül etmeyin."], [272.0, "Allah Azze ve Celle'nin şu sözü de onun gibidir:"], [275.3, "<span class=\"ayah\">﴿Mü'minler yalnız Allah'a tevekkül etsinler﴾<\/span> [Âl-i İmrân 122]."], [278.0, "Allah Azze ve Celle şöyle buyurur:"], [279.6, "<span class=\"ayah\">﴿Kim Allah'a tevekkül ederse, O ona yeter﴾<\/span> [Talâk 3]."], [282.0, "Allah Azze ve Celle şöyle buyurur:"], [284.7, "<span class=\"ayah\">﴿Azmettiğin zaman da Allah'a tevekkül et﴾<\/span> [Âl-i İmrân 159]."], [288.0, "Allah Azze ve Celle şöyle buyurur:"], [290.5, "<span class=\"ayah\">﴿İşte bu, Rabbim olan Allah'tır. Yalnız O'na tevekkül ettim ve yalnız O'na yönelirim﴾<\/span> [Şûrâ 10]."], [295.0, "Görüyorsun ki bütün bu ayetlerde âmil ma'mûlünden önce getiriliyor (kastedilen: ma'mûl âmilden önce);"], [301.4, "bu da tevekkülün Allah Azze ve Celle'ye hasredildiğini, tevekkülün Allah Azze ve Celle'ye hasredildiğini gösterir."]]}]}, {"ts": "05:08", "title": "1. Külliye (devam): Tevekkülün fazileti; şeytanın iki silahına karşı iki silah", "paras": [{"reader": false, "ar": [[308.0, "ويقول الله عز وجل مبيّنًا حقيقةَ الإيمان:"], [312.0, "<span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ زَادَتْهُمْ إِيمَانًا﴾<\/span>،"], [321.0, "ثم ذكر الصفة الثالثة في قوله:"], [325.0, "<span class=\"ayah\">﴿وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ﴾<\/span> <span class=\"ref\">[الأنفال: ٢]<\/span>. فقد أمر اللهُ عز وجل عبادَه بالتوكّل عليه،"], [330.0, "واللهُ عز وجل أخبر أنه يحبّ المتوكّلين."], [334.0, "فلمّا كان التوكّل محبوبًا إلى الله عز وجل،"], [338.0, "فإنه لا جرمَ أنه داخلٌ في حيّز التعبُّدات بكلّ شُعَبه."], [343.0, "ومن جملة السبعين الذين يدخلون الجنة بغير حسابٍ ولا عذاب:"], [349.0, "هؤلاء المتوكّلون على الله،"], [351.5, "في قول النبيّ صلى الله عليه وسلم: «وعلى ربِّهم يتوكّلون»."]], "tr": [[308.0, "Allah Azze ve Celle imanın hakikatini açıklayarak şöyle buyurur:"], [312.0, "<span class=\"ayah\">﴿Mü'minler ancak o kimselerdir ki Allah anıldığı zaman kalpleri ürperir; O'nun ayetleri kendilerine okunduğu zaman imanlarını artırır﴾<\/span>."], [321.0, "Sonra üçüncü sıfatı şu sözünde zikretti:"], [325.0, "<span class=\"ayah\">﴿ve yalnız Rablerine tevekkül ederler﴾<\/span> [Enfâl 2]."], [327.0, "Allah Azze ve Celle kullarına Kendisine tevekkül etmelerini emretmiş ve Allah Azze ve Celle tevekkül edenleri sevdiğini haber vermiştir."], [334.0, "Tevekkül Allah Azze ve Celle'nin sevdiği bir şey olunca, şüphesiz o, bütün şubeleriyle taabbudlar alanına girer."], [341.0, "Cennete hesapsız ve azapsız girecek yetmiş (bin) kişi arasında da Allah'a tevekkül edenler vardır;"], [349.0, "Peygamber sallallâhu aleyhi ve sellem'in şu sözünde: \"Ve Rablerine tevekkül ederler.\""]]}, {"reader": false, "ar": [[358.0, "واعلموا ـ رحمكم الله تعالى ـ أنّ للشيطان علينا سلاحين:"], [362.0, "سلاحَ الخوف، وسلاحَ الحزن،"], [369.0, "وهما سلاحان يحاول الشيطانُ جاهدًا أن يُكدِّر حياتنا بهما."], [375.0, "ولذلك أعظمُ نعيمٍ، من أوائل النعيم الذي يُبشَّر به أهلُ الجنة:"], [382.3, "<span class=\"ayah\">﴿أَلَّا تَخَافُوا وَلَا تَحْزَنُوا﴾<\/span> <span class=\"ref\">[فصلت: ٣٠]<\/span>."], [385.0, "ويُبشِّر اللهُ عز وجل عبادَه وأولياءَه بأن <span class=\"ayah\">﴿لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ﴾<\/span> <span class=\"ref\">[يونس: ٦٢]<\/span>."], [393.0, "فكم أحزننا الشيطانُ في أمورٍ قد مضت على غير ما نريد!"], [400.0, "وكم يسعى جاهدًا في تخويفنا من الأمور المستقبليّة،"], [405.5, "ويُعسِّرها علينا، ويُخوِّفنا منها!"]], "tr": [[358.0, "Bilin ki —Allah size rahmet etsin— şeytanın bize karşı iki silahı vardır:"], [362.0, "korku silahı ve hüzün silahı."], [369.0, "Bunlar, şeytanın onlarla hayatımızı bulandırmak için var gücüyle uğraştığı iki silahtır."], [375.0, "Bu yüzden en büyük nimet, cennet ehlinin müjdelendiği ilk nimetlerden biri şudur:"], [382.3, "<span class=\"ayah\">﴿Korkmayın ve üzülmeyin﴾<\/span> [Fussılet 30]."], [385.0, "Allah Azze ve Celle kullarını ve velîlerini <span class=\"ayah\">﴿onlara hiçbir korku yoktur, onlar üzülmeyeceklerdir﴾<\/span> [Yûnus 62] diye müjdeler."], [393.0, "Şeytan, istediğimizin dışında geçip gitmiş işlerde bizi ne kadar da üzmüştür!"], [400.0, "Gelecekteki işlerden bizi korkutmak için ne kadar da uğraşır, onları bize zorlaştırır ve bizi onlardan korkutur!"]]}, {"reader": false, "ar": [[409.0, "فالحزنُ سلاحٌ يضرُّنا به الشيطان على ما مضى،"], [414.0, "والخوفُ سلاحٌ يضرُّنا به الشيطان فيما يُستقبل."], [420.0, "وقد جعل الله عز وجل لنا سلاحين ندفع بهما هذين السلاحين الشيطانيّين،"], [427.9, "وهما: التوكّلُ على الله عز وجل،"], [431.0, "والرضا بالقضاء. فأمّا الرضا بالقضاء فإنه يُذهب عن قلبك الحزنَ على ما مضى؛"], [438.0, "فإنّ كلَّ من يحزن على شيءٍ فاته إنما حزنُه دليلٌ على تسخُّطه على ربّه،"], [445.0, "أو عدمِ رضاه بما قضاه الله عز وجل وقدّره له."], [449.0, "فبالرضا بالقضاء يُقتل سلاحُ الحزن الشيطانيّ."]], "tr": [[409.0, "Hüzün, şeytanın geçmiş şeyler üzerinden bize zarar verdiği bir silahtır;"], [413.4, "korku da şeytanın gelecek şeylerde bize zarar verdiği bir silahtır."], [420.0, "Allah Azze ve Celle bize, bu iki şeytanî silahı def ettiğimiz iki silah vermiştir:"], [428.5, "Allah Azze ve Celle'ye tevekkül ve kazaya rıza."], [432.0, "Kazaya rıza, geçmiş şeyler üzerindeki hüznü kalbinden giderir."], [438.0, "Çünkü kaçırdığı bir şeye üzülen herkesin hüznü, ancak Rabbine öfkelendiğinin ya da Allah Azze ve Celle'nin kendisi için hükmettiği ve takdir ettiği şeye razı olmadığının delilidir."], [449.0, "Kazaya rıza ile şeytanın hüzün silahı öldürülür."]]}, {"reader": false, "ar": [[457.0, "وأمّا التوكّلُ على الله عز وجل فإنه يُذهب الخوفَ ممّا يُستقبل؛"], [463.0, "فإنّ كلَّ من توكّل على الله عز وجل في كلّ أموره،"], [470.3, "ومصادره وموارده، وحركاته وسكناته،"], [473.0, "وعلّق قلبَه بالله، وفوّض أمرَه جملةً وتفصيلًا لله عز وجل،"], [479.0, "فإنه لا يُصيب قلبَه شيءٌ من الخوف ممّا يُستقبل؛"], [482.0, "لأنه يعلم أنّ الله عز وجل بيده التدبير،"], [486.6, "وبيده التصريف، وبيده النفع،"], [488.9, "وبيده الضرّ. وقد وعد الله عز وجل ألّا يخذل عبدًا توجّه بقلبه إليه،"], [496.0, "كما قال: <span class=\"ayah\">﴿وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ﴾<\/span> <span class=\"ref\">[الطلاق: ٣]<\/span>."]], "tr": [[457.0, "Allah Azze ve Celle'ye tevekküle gelince, o da gelecek şeylerden korkuyu giderir."], [463.0, "Çünkü bütün işlerinde, girdiği ve çıktığı her yerde, hareketlerinde ve duruşlarında Allah Azze ve Celle'ye tevekkül eden, kalbini Allah'a bağlayan ve işini toptan ve ayrıntılı olarak Allah Azze ve Celle'ye havale eden herkesin kalbine gelecek şeylerden hiçbir korku isabet etmez."], [482.0, "Çünkü o bilir ki tedbir Allah Azze ve Celle'nin elindedir, tasarruf O'nun elindedir, fayda O'nun elindedir, zarar O'nun elindedir."], [490.0, "Allah Azze ve Celle, kalbiyle Kendisine yönelen bir kulu yardımsız bırakmayacağını vaat etmiştir;"], [495.0, "nitekim şöyle buyurmuştur: <span class=\"ayah\">﴿Kim Allah'a tevekkül ederse, O ona yeter﴾<\/span> [Talâk 3]."]]}, {"reader": false, "ar": [[500.0, "فمتى ما سلَّ الشيطانُ عليك أحدَ سلاحيه،"], [504.7, "فسُلَّ عليه ذلك السلاحَ الرحمانيّ،"], [508.0, "حتى تقتل الحزن؛ فتقتل الحزنَ بسلاح الرضا بالقضاء،"], [513.5, "وتقتل الخوفَ بسلاح التوكّل."]], "tr": [[500.0, "Şeytan sana karşı iki silahından birini ne zaman çekerse, sen de ona karşı o Rahmânî silahı çek ki hüznü öldüresin:"], [510.7, "Hüznü kazaya rıza silahıyla öldürürsün, korkuyu da tevekkül silahıyla öldürürsün."]]}, {"reader": false, "ar": [[518.0, "فإن قلتَ: وما أقسامُ التوكّل على غير الله عز وجل؟"], [523.0, "فأقول: لقد قسّم العلماءُ التوكّلَ على غير الله إلى ثلاثة أقسام:"], [530.0, "الأوّل: التوكّلُ على غير الله في الأمر الذي لا يقدر عليه إلا الله،"], [538.0, "فهذا من الشرك الأكبر."], [543.0, "فكلُّ من توكّل على غير الله في الأمور التي لا يقدر عليها إلا الله فقد وقع في الشرك الأكبر،"], [551.9, "والعياذُ بالله؛ كالذين يتوكّلون على الأموات،"], [555.4, "ويتوكّلون على الطواغيت، في حصول مطالبهم:"], [559.1, "من نصرٍ، أو حفظٍ،"], [561.6, "أو رزقٍ، أو شفاعة."], [564.0, "وهذا من أعظم أنواع الشرك الأكبر؛"], [567.3, "لأنّ حقيقتَه اعتمادٌ على غير الله عز وجل فيما لا يقدر عليه إلا الله."]], "tr": [[518.0, "Eğer \"Allah Azze ve Celle'den başkasına tevekkülün kısımları nelerdir?\" dersen, derim ki:"], [524.9, "Âlimler Allah'tan başkasına tevekkülü üç kısma ayırmışlardır."], [530.0, "Birincisi: Sadece Allah'ın gücü yettiği bir işte Allah'tan başkasına tevekkül etmek."], [543.0, "Bu büyük şirktendir. Sadece Allah'ın gücü yettiği işlerde Allah'tan başkasına tevekkül eden herkes büyük şirke düşmüştür, Allah'a sığınırız."], [553.0, "Yardım, korunma, rızık ya da şefaat gibi isteklerinin gerçekleşmesinde ölülere tevekkül edenler ve tâğutlara tevekkül edenler gibi."], [564.0, "Bu, büyük şirkin en büyük türlerindendir;"], [567.3, "çünkü hakikati, sadece Allah'ın gücü yettiği şeyde Allah Azze ve Celle'den başkasına dayanmaktır."]]}, {"reader": false, "ar": [[575.0, "وكالذين يتوكّلون على الأشجار،"], [577.7, "وعلى الأحجار، وعلى الكهوف والمغارات،"], [581.1, "وعلى الأصنام والأوثان، في جلب مصالحهم وفي دفع مضارّهم؛"], [589.0, "كلُّ ذلك من التوكّل على غير الله،"], [593.2, "التوكّلِ الشركيّ الأكبر. القسم الثاني:"], [596.5, "التوكّلُ في الأسباب الظاهرة؛"], [604.0, "فهو يتوكّل على السببيّة،"], [606.5, "ويصرف شُعبةً من قلبه إلى هذه السببيّة،"], [611.0, "مع كمال علمه بأنّ الله هو المدبِّر،"], [613.7, "وهو المتصرِّف، وهو الذي يضرّ وينفع،"], [616.0, "وهو الذي يُقدِّر الخيرَ ويُقدِّر الشرّ،"], [622.0, "ولكنْ ثَمّةَ شُعبةٌ من قلبه منصرفةٌ إلى هذه السببيّة؛ فهذا شركٌ أصغر."]], "tr": [[575.0, "Maslahatlarını celbetmede ve zararlarını def etmede ağaçlara, taşlara, mağaralara ve in'lere, putlara ve heykellere tevekkül edenler de böyledir."], [589.0, "Bunların hepsi Allah'tan başkasına tevekküldendir, büyük şirk olan tevekküldendir."], [595.0, "İkinci kısım: Zâhir sebeplerde tevekkül."], [604.0, "Kişi sebebiyete tevekkül eder ve kalbinden bir şubeyi bu sebebiyete yöneltir;"], [611.8, "bununla birlikte tedbir edenin, tasarruf edenin, zarar ve fayda verenin, hayrı ve şerri takdir edenin Allah olduğunu tam olarak bilir."], [629.0, "Ama kalbinden bir şube bu sebebiyete yönelmiştir. İşte bu küçük şirktir."]]}, {"reader": false, "ar": [[632.0, "لأنّ التوكّل من العبادات القلبيّة المحضة التي لا يجوز أن يُصرف شيءٌ من شُعَبها لغير الله عز وجل؛"], [639.0, "كمن يُعلِّق آمالَه ورجاءَه على أحدٍ من الخلق فيما أقدره الله عز وجل عليه،"], [648.0, "فهذا من الشرك الأصغر؛"], [650.0, "كمن يتوكّل على أميرٍ أو سلطانٍ فيما أقدره الله عليه،"], [655.0, "من رزقٍ أو دفعِ أذًى أو غير ذلك،"], [659.0, "فهذا نوعٌ من الشرك الأصغر؛"], [661.2, "لما فيه من ميل القلب واعتماده على غير الله عز وجل."]], "tr": [[632.0, "Çünkü tevekkül, şubelerinden hiçbir şeyin Allah Azze ve Celle'den başkasına yöneltilmesi caiz olmayan saf kalbî ibadetlerdendir."], [639.0, "Allah Azze ve Celle'nin kendisine güç verdiği bir şeyde emellerini ve ümidini mahlûkattan birine bağlayan kimse gibi;"], [650.0, "bu küçük şirktendir. Allah'ın ona güç verdiği rızık, ezayı def etme ya da başka bir şeyde bir emire veya sultana tevekkül eden kimse gibi;"], [659.0, "bu da küçük şirkin bir türüdür."], [661.2, "Çünkü bunda kalbin Allah Azze ve Celle'den başkasına meyli ve dayanması vardır."]]}, {"reader": false, "ar": [[666.0, "هذا إذا كانت سببيّةُ النفع والضرّ ظاهرة."], [670.7, "وأمّا أن يتوكّل على سببيّةٍ خفيّة،"], [675.0, "كالذي يتوكّل على ميّت،"], [676.7, "أو يتوكّل على قبر،"], [678.4, "أو يتوكّل على شجرٍ أو حجر،"], [681.0, "فإنّ هذا من التوكّل على (غير) الله في الأسباب الخفيّة الموجبة لوقوع صاحبها في الشرك، في الشرك الأكبر."]], "tr": [[666.0, "Bu, fayda ve zararın sebebiyeti zâhir olduğunda böyledir."], [671.4, "Gizli bir sebebiyete tevekkül etmesine gelince —bir ölüye tevekkül eden, bir kabre tevekkül eden ya da bir ağaca veya taşa tevekkül eden kimse gibi— bu, sahibinin şirke, büyük şirke düşmesini gerektiren gizli sebeplerde Allah'tan (başkasına) tevekküldendir."]]}, {"reader": false, "ar": [[689.0, "القسم الثالث: التوكّلُ بمعنى الوكالة؛"], [695.0, "بمعنى أن تُوكِّل غيرَك في إنهاء أمر،"], [697.5, "لكن لا ينصرف شيءٌ من شُعَب قلبك عليه أبدًا،"], [700.8, "لا في قليلٍ ولا في كثير."], [703.0, "فهذا جائزٌ لا بأس به،"], [705.5, "وهو من التعاون على الخير الذي يدخل في قول الله عز وجل:"], [711.5, "<span class=\"ayah\">﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٢]<\/span>،"], [716.0, "ويدخل في قول النبيّ صلى الله عليه وسلم:"], [719.7, "«من استطاع منكم أن ينفع أخاه فليفعل»."]], "tr": [[689.0, "Üçüncü kısım: Vekâlet anlamındaki tevekkül."], [695.0, "Yani bir işi bitirmesi için başkasını vekil kılmandır;"], [697.9, "ama kalbinin şubelerinden hiçbir şey, ne azında ne çoğunda, asla ona yönelmez."], [703.0, "Bu caizdir, bunda bir sakınca yoktur."], [706.0, "Bu, Allah Azze ve Celle'nin şu sözüne giren hayırda yardımlaşmadandır:"], [711.5, "<span class=\"ayah\">﴿İyilik ve takva üzerinde yardımlaşın; günah ve düşmanlık üzerinde yardımlaşmayın﴾<\/span> [Mâide 2]."], [716.0, "Peygamber sallallâhu aleyhi ve sellem'in şu sözüne de girer:"], [719.7, "\"Sizden kim kardeşine fayda vermeye güç yetirirse, versin.\""]]}, {"reader": false, "ar": [[723.0, "ونختم هذه الكلّيّة بنقلٍ عن الشيخ سليمان آل الشيخ رحمه الله،"], [729.2, "تعليقًا على قوله عز وجل:"], [732.0, "<span class=\"ayah\">﴿وَعَلَى اللَّهِ فَتَوَكَّلُوا إِن كُنتُم مُّؤْمِنِينَ﴾<\/span> <span class=\"ref\">[المائدة: ٢٣]<\/span>،"], [735.0, "قال: «وفي الآية دليلٌ على أنّ التوكّل على الله عبادة، وعلى أنه فرض، وإذا كان كذلك فصرفُه لغير الله شرك»."], [743.9, "انتهى كلامه. وهذا يدلّك على أنّ قولنا في الكلّيّة:"], [750.0, "«فقد أشرك» أنه يحتمل أن يكون من الشرك الأكبر إذا كان توكُّلًا على غير الله فيما لا يقدر عليه إلا الله عز وجل،"], [760.0, "ويكون شركًا أصغر إذا توكّل على السببيّة الظاهرة في الأمر المقدور عليه. والله أعلم."]], "tr": [[723.0, "Bu külliyeyi Şeyh Süleymân Âlü'ş-Şeyh'ten —Allah ona rahmet etsin— Allah Azze ve Celle'nin <span class=\"ayah\">﴿Eğer mü'minler iseniz yalnız Allah'a tevekkül edin﴾<\/span> [Mâide 23] sözüne yaptığı bir açıklamayla bitiriyoruz."], [735.4, "Şöyle demiştir: \"Ayette, Allah'a tevekkülün bir ibadet olduğuna ve farz olduğuna delil vardır."], [743.9, "Durum böyle olunca, onu Allah'tan başkasına yöneltmek şirktir.\" Sözü burada bitti."], [750.0, "Bu da sana gösterir ki külliyedeki \"şirke düşmüştür\" sözümüz, sadece Allah Azze ve Celle'nin gücü yettiği bir şeyde Allah'tan başkasına tevekkül olduğunda büyük şirk olma ihtimalini taşır;"], [760.0, "güç yetirilebilen bir işte zâhir sebebiyete tevekkül ettiğinde ise küçük şirk olur. Allah en iyisini bilir."]]}]}, {"ts": "12:50", "title": "2. Külliye: Kalbin rubûbiyyetin gereklerine dair bilgisi arttıkça Allah'a tevekkülü de artar", "paras": [{"reader": false, "ar": [[770.0, "الكلّيّة الثانية: <b>كلّما عظُمت معرفةُ القلب بمقتضيات الربوبيّة عظُم توكّلُه على الله.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [797.0, "<b>كلّما عظُمت معرفةُ القلب بمقتضيات الربوبيّة عظُم توكّلُه على الله.<\/b>"]], "tr": [[770.0, "<b>2. külliye: Kalbin rubûbiyyetin gereklerine (muktezalarına) dair bilgisi büyüdükçe Allah'a tevekkülü de büyür.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [797.0, "<b>2. külliye: Kalbin rubûbiyyetin gereklerine dair bilgisi büyüdükçe Allah'a tevekkülü de büyür.<\/b>"]]}, {"reader": false, "ar": [[803.0, "أقول وبالله التوفيق: وهذا تلازمٌ ظاهرٌ لا شكّ فيه؛"], [808.0, "فإنّ الإنسان لا يضعف توكُّلُ قلبه على الله عز وجل إلا إذا كان قلبُه غافلًا عن مقتضًى من مقتضيات ربوبيّته عز وجل."], [818.0, "لكن كلّما كان القلب أعرفَ بهذه المقتضيات:"], [822.0, "وأنّ الله عز وجل هو الخالق ولا خالقَ غيرُه،"], [826.4, "وهو النافع ولا نافعَ على الحقيقة غيرُه،"], [829.8, "وهو الضارّ ولا ضارَّ على الحقيقة غيرُه،"], [833.3, "وهو المدبِّر المتصرِّف ولا مدبِّرَ ولا متصرِّفَ على الحقيقة غيرُه،"], [838.2, "وهو المُعِزّ ولا مُعِزَّ على الحقيقة إلا هو،"], [842.1, "وهو المُذِلّ ولا مُذِلَّ على الحقيقة إلا هو،"], [846.0, "وغيرِ ذلك من مقتضيات ربوبيّة الله عز وجل،"], [851.0, "فإنّ القلب حينئذٍ سيكون متعلِّقًا بهذا الربّ أعظمَ التعلُّق."]], "tr": [[803.0, "Tevfik Allah'tandır, derim ki: Bu, hiçbir şüphe olmayan açık bir telâzümdür (birbirini gerektirmedir)."], [805.0, "Çünkü insanın kalbinin Allah Azze ve Celle'ye tevekkülü, ancak kalbi O'nun Azze ve Celle rubûbiyyetinin gereklerinden birinden gafil olduğunda zayıflar."], [808.0, "Fakat kalp bu gerekleri ne kadar çok bilirse —Allah Azze ve Celle'nin yaratıcı olduğunu ve O'ndan başka yaratıcı olmadığını;"], [814.7, "fayda veren olduğunu ve hakikatte O'ndan başka fayda veren olmadığını;"], [818.0, "zarar veren olduğunu ve hakikatte O'ndan başka zarar veren olmadığını;"], [822.0, "tedbir eden ve tasarruf eden olduğunu ve hakikatte O'ndan başka tedbir eden ve tasarruf eden olmadığını;"], [831.3, "izzet veren olduğunu ve hakikatte O'ndan başka izzet veren olmadığını;"], [837.2, "zillete düşüren olduğunu ve hakikatte O'ndan başka zillete düşüren olmadığını ve Allah Azze ve Celle'nin rubûbiyyetinin diğer gereklerini— işte o zaman kalp bu Rabbe en büyük bağlılıkla bağlanır."]]}, {"reader": false, "ar": [[857.0, "فلا يضعف قلبُ العبد في سيره في طلب مصالح دينه أو دنياه إلا إذا ضعُفت معرفتُه بهذا الربّ؛"], [866.0, "فإذا ضعُفت المعرفةُ ضعُفت شُعَبُ التوكّل،"], [870.0, "وإذا قويت المعرفةُ قويت شُعَبُ التوكّل."], [873.0, "ولله درُّ الإمام ابن القيّم رحمه الله لمّا قال عن العبد:"], [879.0, "وكيف يقوى توكّلُه؟ قال:"], [883.7, "«معرفتُه بالربّ وصفاته: من قدرته، وكفايته، وقيّوميّته، وانتهاءِ الأمور إلى علمه، وصدورِها عن مشيئته وقدرته. وهذه المعرفة أوّلُ درجةٍ يضع بها العبدُ قدمَه في مقامات التوكّل»."]], "tr": [[857.0, "Kulun kalbi, dininin ya da dünyasının maslahatlarını talep etme yolculuğunda ancak bu Rabbe dair bilgisi zayıfladığında zayıflar."], [863.5, "Bilgi zayıfladığında tevekkülün şubeleri zayıflar;"], [866.0, "bilgi güçlendiğinde tevekkülün şubeleri güçlenir."], [868.7, "İmam İbnü'l-Kayyim'e —Allah ona rahmet etsin— aferin olsun;"], [873.0, "kul hakkında \"Onun tevekkülü nasıl güçlenir?\" diye sorup şöyle demiştir:"], [879.0, "\"Rabbi ve sıfatlarını bilmesiyle: O'nun kudretini, kifâyetini (yeterliliğini), kayyûmiyyetini, işlerin O'nun ilmine varıp dayandığını ve O'nun meşîetinden ve kudretinden çıktığını bilmesiyle."], [897.3, "Bu bilgi, kulun tevekkül makamlarına ayağını bastığı ilk derecedir.\""]]}]}, {"ts": "15:03", "title": "2. Külliye (devam): Allah'ın isim ve sıfatlarını tefekkür eden kulun kalbi", "paras": [{"reader": false, "ar": [[903.0, "فإذا تأمّل العبدُ في أسماء الله عز وجل وصفاته التي يؤمن بها،"], [910.5, "ودلّ عليها دليلُ الكتاب والسنة،"], [913.0, "فإنه يتيقّن حينئذٍ أنّ هذا الربّ لن يخذله،"], [918.0, "ولن يُغلق البابَ في وجهه،"], [920.0, "ولن يُسلمه إلى عدوّه،"], [922.0, "ولن يُضعفه، ولن يردّ له دعاءً،"], [926.0, "ولن يُخيِّب له رجاءً،"], [928.0, "وسيكون معه في قليل أموره وكبيرها،"], [932.0, "وأنه الربُّ الذي لا يشغله حالُ عبدٍ عن حال عبدٍ آخر؛"], [937.0, "فهو يسمع دعاءَ عبيده بمختلف ألسنتهم ولغاتهم وأمكنتهم وأزمنتهم،"], [944.0, "كما قال الله عز وجل:"], [946.0, "<span class=\"ayah\">﴿كُلَّ يَوْمٍ هُوَ فِي شَأْنٍ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٩]<\/span>."], [948.0, "فاللهُ عز وجل لا يشغله شيءٌ عن عباده أبدًا."]], "tr": [[903.0, "Kul, inandığı ve Kitap ile Sünnet'in delilinin delâlet ettiği Allah Azze ve Celle'nin isimlerini ve sıfatlarını tefekkür ettiğinde, o zaman kesin olarak bilir ki bu Rab onu yardımsız bırakmayacak, kapıyı yüzüne kapatmayacak, onu düşmanına teslim etmeyecek, onu zayıf düşürmeyecek, duasını reddetmeyecek, ümidini boşa çıkarmayacak;"], [927.0, "işlerinin azında da büyüğünde de onunla beraber olacaktır."], [932.0, "O, bir kulun hâli kendisini başka bir kulun hâlinden alıkoymayan Rabdir."], [937.0, "Kullarının farklı dillerdeki, lisanlardaki, mekânlardaki ve zamanlardaki dualarını işitir."], [942.6, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [946.0, "<span class=\"ayah\">﴿O her an bir iştedir﴾<\/span> [Rahmân 29]."], [948.0, "Allah Azze ve Celle'yi hiçbir şey kullarından asla alıkoymaz."]]}, {"reader": false, "ar": [[953.0, "فمتى ما كان القلب يعيش هذه اللحظاتِ والنسماتِ الإيمانيّةَ مع الله عز وجل،"], [960.0, "فإنه لن يُصيبه ضعفٌ ولا خوفٌ ولا خَوَرٌ ولا جُبن،"], [963.0, "بل سيكون مُقبلًا على الله عز وجل باطنًا وظاهرًا في طلب حاجات دينه ودنياه."], [971.0, "فأسأل الله عز وجل أن يجعلني وإيّاكم ممّن عرف هذا الربَّ العظيم معرفةً قلبيّةً إيمانيّة،"], [980.2, "ليست مجرّدَ معرفةٍ ظاهريّةٍ نظريّة."]], "tr": [[953.0, "Kalp, Allah Azze ve Celle ile bu imanî anları ve esintileri yaşadığı sürece ona ne zayıflık, ne korku, ne gevşeklik, ne de korkaklık isabet eder."], [962.7, "Aksine dininin ve dünyasının ihtiyaçlarını talep etmede içiyle ve dışıyla Allah Azze ve Celle'ye yönelmiş olur."], [971.0, "Allah Azze ve Celle'den beni ve sizi bu yüce Rabbi sadece zâhirî ve nazarî bir bilgiyle değil, kalbî ve imanî bir bilgiyle tanıyanlardan kılmasını dilerim."]]}, {"reader": false, "ar": [[985.0, "فما يُصيب قلوبَنا من هذا الضعف والوهن والخوف الشديد،"], [990.0, "الذي يشغلنا عن القيام ببعض المأمورات،"], [993.0, "أو يُوقعنا في بعض المحرّمات،"], [995.0, "أو يشغلنا عن تحصيل شيءٍ من مصالح ديننا ودنيانا،"], [999.0, "إنما هو لضعف قلوبنا عن معرفة هذا الربّ العظيم."]], "tr": [[985.0, "Kalplerimize isabet eden; bizi bazı emredilenleri yerine getirmekten alıkoyan, bizi bazı haramlara düşüren ya da bizi dinimizin ve dünyamızın maslahatlarından bir şey elde etmekten alıkoyan bu zayıflık, gevşeklik ve şiddetli korku, ancak kalplerimizin bu yüce Rabbi tanımaktaki zayıflığından kaynaklanır."]]}]}, {"ts": "16:44", "title": "3. Külliye: Kalbin Allah'a tam dayanması ve sebeplere sarılması üzerine kurulmayan tevekkül fasittir", "paras": [{"reader": false, "ar": [[1004.0, "الكلّيّة الثالثة: <b>كلُّ توكّلٍ لا يقوم على كمال اعتماد القلب وفعلِ الأسباب فتوكّلٌ فاسد.<\/b> كلُّ توكّلٍ لا يقوم على كمال اعتماد القلب على الله،"], [1022.0, "<b>كلُّ توكّلٍ لا يقوم على كمال اعتماد القلب على الله وفعلِ الأسباب فتوكّلٌ فاسد.<\/b> أُعيدها مرّةً ثالثة:"], [1038.0, "<b>كلُّ توكّلٍ لا يقوم على كمال اعتماد القلب على الله وفعلِ الأسباب فتوكّلٌ فاسد.<\/b>"]], "tr": [[1004.0, "3. külliye: Kalbin tam dayanması ve sebepleri yerine getirmek üzerine kurulmayan her tevekkül fasit bir tevekküldür. Kalbin Allah'a tam dayanması üzerine kurulmayan her tevekkül… 3."], [1021.2, "külliye: Kalbin Allah'a tam dayanması ve sebepleri yerine getirmek üzerine kurulmayan her tevekkül fasit bir tevekküldür. Üçüncü kez tekrar ediyorum:"], [1038.0, "<b>3. külliye: Kalbin Allah'a tam dayanması ve sebepleri yerine getirmek üzerine kurulmayan her tevekkül fasit bir tevekküldür.<\/b>"]]}, {"reader": false, "ar": [[1043.0, "أقول وبالله التوفيق: لقد أجمع علماءُ أهل السنة والجماعة على أنّ التوكّل ليس معناه اعتمادَ القلب فقط،"], [1052.0, "ولا فعلَ الأسباب فقط،"], [1054.8, "وإنما التوكّل عبارةٌ عن مزيجٍ منهما."], [1059.0, "فحقيقةُ التوكّل تقوم على ركنين:"], [1063.0, "الركنُ الأوّل: كمالُ تفويض اعتماد القلب على الله عز وجل."], [1068.0, "والركنُ الثاني: الإقبالُ على فعل الأسباب المشروعة المتاحة شرعًا وقدرًا."], [1074.0, "فلا يظنّ الظانُّ أنه بمجرّد تفويض اعتماد قلبه على الله أنه صار متوكّلًا،"], [1082.0, "وإنما لا بدّ أن يضمّ إلى ذلك ضميمةَ فعل الأسباب."]], "tr": [[1043.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat âlimleri, tevekkülün anlamının sadece kalbin dayanması ya da sadece sebepleri yerine getirmek olmadığı, aksine tevekkülün ikisinin karışımından ibaret olduğu üzerinde icmâ etmişlerdir."], [1059.0, "Tevekkülün hakikati iki rükün üzerine kuruludur."], [1063.0, "Birinci rükün: Kalbin dayanmasını tam olarak Allah Azze ve Celle'ye havale etmek."], [1068.0, "İkinci rükün: Şer'an ve kader bakımından imkân dâhilinde olan meşru sebepleri yerine getirmeye yönelmek."], [1074.0, "Hiç kimse, sırf kalbinin dayanmasını Allah'a havale etmekle tevekkül eden biri olduğunu sanmasın;"], [1082.7, "aksine buna sebepleri yerine getirmeyi de eklemesi gerekir."]]}, {"reader": false, "ar": [[1089.0, "ولذلك فإنّ أعظمَ المتوكّلين على الله عز وجل هو النبيُّ صلى الله عليه وسلم،"], [1095.0, "ومع ذلك لم يكن توكّلُه يدفعه إلى تعطيل الأسباب؛"], [1101.0, "فكان يلبس لَأْمةَ الحرب إذا أراد الجهاد،"], [1104.0, "وكان في يوم أُحُدٍ قد ظاهر بين دِرعين،"], [1108.0, "وكان يحمل السيف، وكان إذا أراد غزوةً ورّى بغيرها،"], [1113.0, "وكان إذا جاع أكل،"], [1115.9, "وإذا عطش شرب، وكان يتزوّج طلبًا للولد،"], [1121.0, "وطلبًا لإعفاف نفسه صلى الله عليه وسلم بالزواج،"], [1125.0, "وكذلك كان يشتري ويبيع؛"], [1129.0, "كلُّ ذلك من باب طلبيّة السبب."]], "tr": [[1089.0, "Bu yüzden Allah Azze ve Celle'ye tevekkül edenlerin en büyüğü Peygamber sallallâhu aleyhi ve sellem'dir."], [1093.3, "Bununla birlikte tevekkülü onu sebepleri ta'til etmeye (askıya almaya) sevk etmezdi."], [1097.7, "Cihada çıkmak istediğinde savaş zırhını giyerdi;"], [1101.0, "Uhud gününde iki zırhı üst üste giymişti;"], [1104.5, "kılıç taşırdı; bir gazveye çıkmak istediğinde başka bir yeri kastediyormuş gibi gösterirdi (tevriye yapardı);"], [1113.7, "acıktığında yer, susadığında içerdi; çocuk talep etmek ve kendini evlilikle iffetli kılmak için evlenirdi sallallâhu aleyhi ve sellem;"], [1129.0, "aynı şekilde alım satım yapardı."], [1130.5, "Bunların hepsi sebebi talep etme babındandır."]]}, {"reader": false, "ar": [[1135.0, "ولذلك نصّ العلماء على أنّ من اعتقد أنّ توكّله يقوم على كمال التفويض دون فعل الأسباب فإنه من أهل البدع."], [1143.0, "وقد أخرج الإمامُ البخاريّ في «صحيحه» من حديث ابن عبّاس رضي الله عنهما قال:"], [1152.7, "«كان أهلُ اليمن يحجّون ولا يتزوّدون، ويقولون: نحن المتوكّلون»،"], [1160.0, "فأنزل الله عز وجل:"], [1161.8, "<span class=\"ayah\">﴿وَتَزَوَّدُوا فَإِنَّ خَيْرَ الزَّادِ التَّقْوَىٰ﴾<\/span> <span class=\"ref\">[البقرة: ١٩٧]<\/span>."]], "tr": [[1135.0, "Bu yüzden âlimler açıkça şunu ifade etmişlerdir:"], [1137.5, "Tevekkülünün sebepleri yerine getirmeksizin sadece tam havale üzerine kurulu olduğuna inanan kimse bid'at ehlindendir."], [1143.0, "İmam Buhârî Sahîh'inde İbn Abbâs radıyallâhu anhumâ'dan gelen hadiste şunu rivayet etmiştir:"], [1149.8, "\"Yemen halkı hacceder ama azık almazlardı ve 'Biz tevekkül edenleriz' derlerdi.\" Bunun üzerine Allah Azze ve Celle şunu indirdi:"], [1161.8, "<span class=\"ayah\">﴿Azık edinin; şüphesiz azığın en hayırlısı takvadır﴾<\/span> [Bakara 197]."]]}, {"reader": false, "ar": [[1164.0, "وإنّ هناك آيتين كلّما مررتُ عليهما في كتاب الله عز وجل تبيّن لي يقينًا أنّ التوكّل لا بدّ فيه من فعل الأسباب،"], [1176.0, "وإن ضاقت عليك الأمور،"], [1178.6, "وادلهمّت عليك الخطوب. الآيةُ الأولى:"], [1183.0, "ما قصّه الله عز وجل عن فرعون وموسى:"], [1187.0, "بأنه لمّا خرج فارًّا ببني إسرائيل من فرعون وقومه واجههم البحر،"], [1197.0, "والدقيقةُ الواحدة أو الثانيةُ الواحدة قد تكون سببًا لنجاتهم أو عطبهم."], [1204.0, "فلمّا قال أصحابُ موسى:"], [1206.7, "<span class=\"ayah\">﴿إِنَّا لَمُدْرَكُونَ﴾<\/span>، <span class=\"ayah\">﴿قَالَ كَلَّا ۖ إِنَّ مَعِيَ رَبِّي سَيَهْدِينِ﴾<\/span> <span class=\"ref\">[الشعراء: ٦١–٦٢]<\/span>،"], [1211.0, "فيأتيه الأمرُ من الله عز وجل:"], [1213.5, "يا موسى، <span class=\"ayah\">﴿أَنِ اضْرِب بِّعَصَاكَ الْبَحْرَ﴾<\/span> <span class=\"ref\">[الشعراء: ٦٣]<\/span>."]], "tr": [[1164.0, "Allah Azze ve Celle'nin Kitabı'nda iki ayet var ki ne zaman onlara uğrasam, işler sana daralsa ve musibetler üzerine kararsa bile tevekkülde sebepleri yerine getirmenin mutlaka gerekli olduğu bana kesin olarak açıkça görünür."], [1182.0, "Birinci ayet: Allah Azze ve Celle'nin Firavun ve Mûsâ hakkında anlattığı kıssadır."], [1187.0, "Mûsâ, İsrâiloğulları'yla birlikte Firavun'dan ve kavminden kaçarak çıktığında karşılarına deniz çıktı."], [1192.3, "Tek bir dakika ya da tek bir saniye, onların kurtuluşlarına ya da helâk olmalarına sebep olabilirdi."], [1204.0, "Mûsâ'nın ashabı <span class=\"ayah\">﴿Kesinlikle yakalandık﴾<\/span> deyince, <span class=\"ayah\">﴿Mûsâ dedi ki: Hayır! Şüphesiz Rabbim benimledir; bana yol gösterecektir﴾<\/span> [Şuarâ 61–62]."], [1210.5, "Bunun üzerine Allah Azze ve Celle'den ona emir gelir:"], [1213.5, "Ey Mûsâ, <span class=\"ayah\">﴿Asânı denize vur﴾<\/span> [Şuarâ 63]."]]}, {"reader": false, "ar": [[1216.0, "واللهُ عز وجل قادرٌ القدرةَ التامّة على أن يقول للبحر:"], [1222.7, "انفلقْ، فينفلق، ولكن هو يريد تربيةَ عباده على عدم إهمال الأسباب،"], [1228.8, "حتى وإن ضاقت الظروف <span class=\"q\">؟ 20:24<\/span>،"], [1231.0, "مع أنّ ضربةَ العصا قد تكون مؤخِّرةً لهم،"], [1235.0, "ولكنه اهتمامُ الشارع بفعل الأسباب."], [1241.0, "مع أنّ الوقت ضيّق،"], [1244.0, "إلا أنّ ضيقَ الوقت لا يمنعنّك من فعل الأسباب."], [1249.0, "فهذا دليلٌ عظيمٌ على وجوب الأخذ بالأسباب،"], [1253.0, "وعدمِ الاعتماد على مجرّد تفويض القلب واعتماده على الله عز وجل."]], "tr": [[1216.0, "Allah Azze ve Celle denize \"Yarıl!\" deyip onun yarılmasına tam bir kudretle kadirdir."], [1222.7, "Fakat O, kullarını, şartlar daralsa bile <span class=\"q\">؟<\/span> sebepleri ihmal etmemek üzere terbiye etmek ister."], [1230.5, "Hâlbuki asâ ile vurmak onları geciktirebilirdi;"], [1233.5, "ama bu, Şâri'in sebepleri yerine getirmeye verdiği önemdir."], [1241.0, "Vakit dar olsa da vaktin darlığı seni sebepleri yerine getirmekten alıkoymasın."], [1247.5, "Bu, sebeplere sarılmanın vacip olduğuna ve sadece kalbin (işi) havale etmesine ve Allah Azze ve Celle'ye dayanmasına güvenilmeyeceğine dair büyük bir delildir."]]}, {"reader": false, "ar": [[1259.0, "والآيةُ الثانية: ما قصّه الله عز وجل في سورة مريم؛"], [1266.0, "لأنها امرأةٌ قد أنجبت ولدًا بلا زوج،"], [1269.0, "قدرًا من الله عز وجل وحكمة،"], [1272.0, "ثم يأتيها الأمرُ من الله عز وجل:"], [1276.5, "<span class=\"ayah\">﴿وَهُزِّي إِلَيْكِ بِجِذْعِ النَّخْلَةِ﴾<\/span> <span class=\"ref\">[مريم: ٢٥]<\/span>،"], [1279.0, "مع أنّ الله قادرٌ القدرةَ التامّة على أن يتساقط التمرُ جنيًّا عندها من غير هذه الهزّة."], [1287.0, "ثم تهزّه وهي في هذه الظروف التي يكتنفها الخوفُ ممّا يُستقبل،"], [1294.0, "وما سيقوله الناسُ لها،"], [1296.5, "ومن تلك الاتّهامات التي سيستغلّها أعداؤها في انتهاك عِرضها، واتّهامِها في سمعتها."]], "tr": [[1259.0, "İkinci ayet: Allah Azze ve Celle'nin Meryem sûresinde anlattığı kıssadır."], [1266.0, "Çünkü o, Allah Azze ve Celle'den bir takdir ve hikmet olarak kocası olmadan çocuk doğurmuş bir kadındır."], [1272.0, "Sonra Allah Azze ve Celle'den ona şu emir gelir:"], [1276.5, "<span class=\"ayah\">﴿Hurma dalını kendine doğru silkele﴾<\/span> [Meryem 25]."], [1280.0, "Hâlbuki Allah, bu silkeleme olmadan da hurmanın taze olarak yanına dökülmesine tam bir kudretle kadirdir."], [1287.0, "Sonra o, geleceğe dair korkunun, insanların ona söyleyeceklerinin ve düşmanlarının onun namusunu çiğnemek ve itibarını zedelemek için kullanacakları o ithamların kuşattığı bu şartlar içindeyken onu silkeler."]]}, {"reader": false, "ar": [[1305.0, "فهي تمرّ بظروفٍ ضيّقة،"], [1307.7, "إلا أنّ ضيقَ الظروف لا يمنعنّ من اتّخاذ الأسباب."], [1315.0, "ثم يأتيها الأمرُ بهزّ جذعِ نخلة،"], [1318.2, "ولو اجتمع فِئامٌ من الرجال الأقوياء وهزّوا فلربّما لا تسقط تمرة،"], [1324.1, "وإن تساقطت فربّما تتساقط من ها هنا وها هنا،"], [1328.4, "لا يكون جنيًّا قريبًا منها."], [1331.0, "فما إن وضعت وهزّت إلا وتساقط الرُّطَب؛"], [1335.0, "ممّا يدلّ على أهمّيّة أخذ الأسباب،"], [1339.0, "وأنّ السببيّة مطلوبةٌ في مسألة التوكّل،"], [1343.0, "ولا ينبغي للإنسان أبدًا أن يُعطِّل السببيّة، أبدًا أبدًا."]], "tr": [[1305.0, "O dar şartlardan geçmektedir; ama şartların darlığı sebeplere sarılmaya engel değildir."], [1315.0, "Sonra ona hurma gövdesini silkelemesi emri gelir."], [1318.2, "Hâlbuki güçlü erkeklerden bir topluluk bir araya gelip silkeleseler belki tek bir hurma bile düşmez;"], [1325.7, "düşse bile belki oradan buradan dökülür, onun yakınına taze olarak düşmez."], [1331.0, "(Elini) koyup silkeler silkelemez taze hurmalar döküldü."], [1335.0, "Bu da sebeplere sarılmanın önemine ve tevekkül meselesinde sebebiyetin istendiğine delâlet eder."], [1343.0, "İnsanın sebebiyeti asla ta'til etmemesi gerekir, asla, asla."]]}, {"reader": false, "ar": [[1349.0, "ويؤكّد ذلك ما في «الصحيحين» من حديث عليّ بن أبي طالب رضي الله عنه قال:"], [1354.5, "قال النبيّ صلى الله عليه وسلم:"], [1357.2, "«ما منكم من أحدٍ إلا وقد كُتب مقعدُه من النار ومقعدُه من الجنة»،"], [1363.0, "قالوا: يا رسول الله،"], [1365.4, "أفلا نتّكل على كتابنا وندعُ العمل؟"], [1369.0, "ـ يعني: بما أنه أمرٌ قد فُرغ منه،"], [1372.1, "فلماذا نفعل السببيّة التي تُوجب لنا الجنة أو النار؟"], [1376.0, "ـ فقال النبيّ صلى الله عليه وسلم،"], [1379.7, "منبِّهًا لهم بأنه لا يجوز لهم أن يعتمدوا على تلك الكتابة القدريّة التي تحملهم على ترك العمل،"], [1390.0, "فقال: «اعملوا، فكلٌّ ميسَّرٌ لما خُلق له»."]], "tr": [[1349.0, "Bunu, Sahîhayn'de Ali b. Ebî Tâlib radıyallâhu anh'ın hadisinde geçen şey de pekiştirir:"], [1354.5, "Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [1357.2, "\"Sizden hiç kimse yoktur ki cehennemdeki yeri de cennetteki yeri de yazılmış olmasın.\" (Sahabe) \"Ey Allah'ın Resûlü, yazılmış olana güvenip ameli bırakmayalım mı?\" dediler."], [1369.0, "Yani: Madem ki bu, bitirilmiş bir iştir, öyleyse bize cenneti ya da cehennemi gerektiren sebebiyeti niçin yapalım?"], [1376.0, "Bunun üzerine Peygamber sallallâhu aleyhi ve sellem, onları ameli terk etmeye sevk eden o kaderî yazıya güvenmelerinin caiz olmadığına dikkat çekerek şöyle buyurdu:"], [1390.4, "\"Amel edin; herkes ne için yaratıldıysa ona kolaylaştırılmıştır.\""]]}, {"reader": false, "ar": [[1393.0, "فلا ينبغي للإنسان أن يتوكّل على الكتابة القدريّة،"], [1397.0, "وأنه إن كان من أهل الجنة فسيدخلها وإن لم يأتِ بالسببيّة،"], [1403.0, "وإن كان من أهل النار فلن يدخلها <span class=\"note\">(كذا؛ والمراد: فسيدخلها)<\/span> وإن لم يأتِ بالسببيّة؛"], [1408.0, "فإنّ ذلك ـ والله ـ من الفهم الفاسد،"], [1411.3, "ومن تسويل الشيطان، ومن تسويل الشيطان."]], "tr": [[1393.0, "İnsanın kaderî yazıya tevekkül etmesi;"], [1395.5, "cennet ehlindense sebebiyeti yerine getirmese de oraya gireceğine, cehennem ehlindense sebebiyeti yerine getirmese de oraya girmeyeceğine (kastedilen: gireceğine) güvenmesi doğru değildir."], [1408.0, "Çünkü bu —vallahi— fasit anlayıştandır ve şeytanın süslemesindendir, şeytanın süslemesindendir."]]}, {"reader": false, "ar": [[1415.0, "قال الإمامُ الغزاليّ رحمه الله تعالى:"], [1422.0, "«قد يُظنّ أنّ معنى التوكّل تركُ الكسب بالبدن، وتركُ التدبير بالقلب، وهذا ظنُّ الجُهّال؛ فإنّ ذلك حرامٌ في الشرع. فلو لم تزرع الأرض، وطمعتَ في أن يخلق الله عز وجل نباتًا من غير بذر، أو تلد زوجتُك من غير وِقاع، فكلُّ ذلك جنون. والنبيُّ صلى الله عليه وسلم وصف المتوكّلين، فلم يصفهم بأنهم لا يكتسبون، ولا يسكنون الأمصار، ولا يأخذون من أحدٍ شيئًا، بل وصفهم بأنهم يتعاطون هذه الأسباب». انتهى كلامه."]], "tr": [[1415.0, "İmam Gazzâlî —Allah ona rahmet etsin— şöyle demiştir:"], [1415.8, "\"Tevekkülün anlamının beden ile kazancı terk etmek ve kalp ile tedbiri terk etmek olduğu zannedilebilir."], [1418.1, "Bu, cahillerin zannıdır; çünkü bu, şeriatta haramdır."], [1422.0, "Toprağı ekmeden Allah Azze ve Celle'nin tohumsuz bir bitki yaratmasını umsan, ya da hanımının cinsel birleşme olmadan doğurmasını umsan, bunların hepsi deliliktir."], [1443.0, "Peygamber sallallâhu aleyhi ve sellem tevekkül edenleri vasfetmiştir;"], [1450.6, "onları kazanç elde etmeyen, şehirlerde oturmayan ve kimseden bir şey almayan kimseler olarak vasfetmemiş, aksine bu sebeplere başvuran kimseler olarak vasfetmiştir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1471.0, "قال شيخُ الإسلام ابنُ تيميّة رحمه الله تعالى:"], [1476.0, "«قال طائفةٌ من العلماء: الالتفاتُ إلى الأسباب» ـ أي انصرافُ شُعبةٍ من القلب إلى السببيّة،"], [1487.0, "كما قرّرتُه لكم في الكلّيّة السابقة ـ «شركٌ في التوحيد، ومحوُ الأسباب أن تكون أسبابًا» ـ كما تقوله الأشاعرة طبعًا ـ «نقصٌ في العقل، والإعراضُ عن الأسباب» ـ هذا هو الذي يخصّنا ـ «والإعراضُ عن الأسباب بالكلّيّة قدحٌ في الشريعة، وإنما التوكّلُ المأمور به ما اجتمع فيه مقتضى التوحيد والعقل والشرع»."], [1514.9, "وهو كمالُ اعتماد القلب مع فعل الأسباب."]], "tr": [[1471.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1474.1, "\"Âlimlerden bir grup şöyle demiştir:"], [1476.0, "Sebeplere iltifat etmek (yönelmek)\" —yani size bir önceki külliyede takrir ettiğim gibi kalbin bir şubesinin sebebiyete yönelmesi— \"tevhidde şirktir."], [1492.4, "Sebeplerin sebep olmasını silmek\" —tabii Eş'arîlerin dediği gibi— \"akılda noksanlıktır."], [1502.6, "Sebeplerden yüz çevirmek\" —bizi ilgilendiren budur— \"sebeplerden tamamen yüz çevirmek şeriata bir dil uzatmaktır."], [1514.9, "Emredilen tevekkül ise tevhidin, aklın ve şeriatın gereğinin bir araya geldiği tevekküldür.\" O da sebepleri yerine getirmekle birlikte kalbin tam dayanmasıdır."]]}]}, {"ts": "25:19", "title": "3. Külliye (devam): İbnü'l-Kayyim ve Sa'dî'den nakiller; tevekkül ile acz arasındaki fark", "paras": [{"reader": false, "ar": [[1519.0, "قال العلّامةُ الإمامُ ابنُ القيّم رحمه الله تعالى:"], [1524.0, "«التوكّل لا يُنافي القيامَ بالأسباب، بل لا يصحّ التوكّلُ إلا مع القيام بها، وإلّا فهو» ـ أي دعواه أنه متوكّلٌ مع غير الأسباب ـ «وإلّا فهو بِطالةٌ وتوكّلٌ فاسد. ونُفاةُ الأسباب لا يستقيم لهم توكّلٌ ألبتّة»."], [1546.0, "انتهى كلامه رحمه الله."]], "tr": [[1519.0, "Allâme İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [1524.0, "\"Tevekkül sebepleri yerine getirmeye aykırı değildir;"], [1527.5, "aksine tevekkül ancak onları yerine getirmekle birlikte sahih olur."], [1533.0, "Aksi takdirde o\" —yani sebepler olmaksızın tevekkül ettiğini iddia etmesi— \"aksi takdirde o tembellik ve fasit bir tevekküldür."], [1546.0, "Sebepleri inkâr edenlerin tevekkülü asla doğru olmaz.\" Onun —Allah ona rahmet etsin— sözü burada bitti."]]}, {"reader": false, "ar": [[1548.0, "ونختمها بقول الإمام السعديّ رحمه الله تعالى:"], [1553.0, "«التوكّل الذي لا يصحبه جِدٌّ واجتهادٌ ليس بتوكّل، وإنما هو إخلادٌ إلى الكسل، وتقاعدٌ عن الأمور النافعة. كما أنّ العمل بالأسباب من دون اعتمادٍ وتوكّلٍ على مسبِّبها واستعانةٍ به مآلُه الخسارة، والزهوُ والإعجابُ بالنفس، والخِذلان. فالجمعُ بين التوكّل على الله وبين الاجتهاد في فعل الأسباب هو الذي حثّ عليه الدين، وهو الذي كان عليه سيّدُ المرسلين، وبهما يتحقّق الإيمان، وتقوى دعائمُ الدين، وبهما تقوى معنويّةُ المسلمين؛ حيث اعتمدوا على ربّ العالمين، وأدّوا ما في مقدورهم من جِدٍّ واجتهاد»."], [1603.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[1548.0, "Bunu İmam Sa'dî'nin —Allah ona rahmet etsin— şu sözüyle bitiriyoruz:"], [1549.4, "\"Ciddiyet ve gayretin eşlik etmediği tevekkül, tevekkül değildir;"], [1550.9, "o ancak tembelliğe meyletmek ve faydalı işlerden geri durmaktır."], [1553.0, "Nitekim sebeplerin Yaratıcısına dayanmadan, O'na tevekkül etmeden ve O'ndan yardım istemeden sebeplerle amel etmenin sonu da hüsran, böbürlenme, kendini beğenme ve yardımsız kalmaktır."], [1571.8, "Allah'a tevekkül ile sebepleri yerine getirmede gayreti bir araya getirmek, dinin teşvik ettiği ve Peygamberlerin efendisinin üzerinde olduğu şeydir."], [1588.0, "İman bu ikisiyle gerçekleşir, dinin direkleri bu ikisiyle güçlenir, Müslümanların manevî gücü de bu ikisiyle güçlenir;"], [1603.0, "çünkü onlar âlemlerin Rabbine dayanmışlar ve güçlerinin yettiği ciddiyeti ve gayreti ortaya koymuşlardır.\" Onun —Allah ona rahmet etsin— sözü burada bitti."]]}, {"reader": false, "ar": [[1607.0, "لكن مع قولنا بأنّ الأسباب جزءٌ من التوكّل،"], [1610.0, "إلا أنّ الذي نخاف منه <span class=\"q\">؟ 26:50<\/span> أن تنصرف شُعبةٌ من شُعَب القلب وتلتفت إلى السببيّة؛"], [1619.0, "وإنما السببيّة تبقى شيئًا ظاهرًا قد أُمرتَ بفعله،"], [1622.0, "وأمّا شُعبةُ قلبك فإنها لا تنصرف إلا لله عز وجل."]], "tr": [[1607.0, "Ancak sebeplerin tevekkülün bir parçası olduğunu söylememizle birlikte, korktuğumuz şey <span class=\"q\">؟<\/span> kalbin şubelerinden bir şubenin (sebebiyete) yönelmesi ve sebebiyete iltifat etmesidir."], [1619.0, "Sebebiyet, yapmakla emrolunduğun zâhir bir şey olarak kalır;"], [1622.0, "kalbinin şubesi ise ancak Allah Azze ve Celle'ye yönelir."]]}, {"reader": false, "ar": [[1628.0, "إن قال قائل: ما الفرقُ بين التوكّل والعجز؟"], [1634.0, "ما الفرقُ بين التوكّل والعجز؟"], [1637.0, "الجوابُ في كلام الإمام ابن القيّم رحمه الله،"], [1640.0, "قال: «الفرق بين التوكّل والعجز: أنّ التوكّل عملُ القلب وعبوديّتُه، اعتمادًا على الله، وثقةً به، والتجاءً إليه، وتفويضًا إليه، ورضًا بما يقضيه؛ لعلمه بكفايته سبحانه، وحُسنِ اختياره لعبده إذا فوّض إليه» ـ هذه وحدَها ـ «مع قيامه بالأسباب المأمور بها، واجتهادِه في تحصيلها»."], [1665.1, "إذًا هذا هو التوكّل."]], "tr": [[1628.0, "Biri \"Tevekkül ile acz arasındaki fark nedir?"], [1630.2, "Tevekkül ile acz arasındaki fark nedir?\" derse, cevap İmam İbnü'l-Kayyim'in —Allah ona rahmet etsin— sözündedir."], [1637.0, "Şöyle demiştir: \"Tevekkül ile acz arasındaki fark şudur:"], [1638.9, "Tevekkül, kalbin ameli ve kulluğudur;"], [1640.6, "Allah'a dayanmak, O'na güvenmek, O'na sığınmak, (işi) O'na havale etmek ve O'nun hükmettiğine razı olmaktır."], [1647.7, "Çünkü kul, O'nun —Sübhânehû— yeterliliğini ve işini kendisine havale ettiğinde kulu için en güzelini seçtiğini bilir.\" —Bu tek başına (yetmez)— \"Bununla birlikte emredilen sebepleri yerine getirir ve onları elde etmek için gayret eder.\" Demek ki tevekkül budur."]]}, {"reader": false, "ar": [[1669.0, "طيّب، والعجز يا ابنَ القيّم؟"], [1670.0, "قال: «أمّا العجز فهو تعطيلُ الأمرين، أو تعطيلُ أحدهما: فإمّا أن يُعطِّل السببَ عجزًا منه، ويزعم أنّ ذلك توكّل، ولَعَمْرُ الله إنه لَعجزٌ وتفريط. وإمّا أن يقوم بالسبب ناظرًا إليه، معتمدًا عليه، غافلًا عن المسبِّب، معرضًا عنه، وإن خطر بباله لم يثبت معه ذلك الخاطر، ولم يُعلِّق قلبَه به تعلُّقًا تامًّا بحيث يكون قلبُه مع الله وبدنُه مع السبب؛ فهذا توكّلُه عجز، وعجزُه توكّل»."], [1711.0, "انتهى كلامه رحمه الله."]], "tr": [[1669.0, "Peki, ya acz nedir, ey İbnü'l-Kayyim?"], [1669.6, "Şöyle demiştir: \"Acz ise iki şeyi birden ya da birini ta'til etmektir."], [1670.0, "Ya aczinden dolayı sebebi ta'til eder ve bunun tevekkül olduğunu iddia eder —Allah'ın hayatına yemin olsun ki bu bir acz ve kusurdur—."], [1685.7, "Ya da sebebe bakarak, ona dayanarak, sebeplerin Yaratıcısından gafil ve O'ndan yüz çevirmiş olarak sebebi yerine getirir;"], [1698.3, "(Allah) aklına gelse bile o düşünce onunla birlikte kalmaz, kalbini O'na, kalbi Allah ile, bedeni sebeple beraber olacak şekilde tam bir bağlılıkla bağlamaz."], [1711.0, "İşte bunun tevekkülü acz, aczi de tevekküldür.\" Onun —Allah ona rahmet etsin— sözü burada bitti."]]}]}, {"ts": "28:33", "title": "4. Külliye: Bir ölüye sığınan herkes büyük şirkle müşriktir", "paras": [{"reader": false, "ar": [[1713.0, "ومن الكلّيّات أيضًا: <b>كلُّ من استعاذ بميّتٍ فمشركٌ شركًا أكبر.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1713.0, "Külliyelerden biri de şudur: 4."], [1718.0, "külliye: Bir ölüye sığınan (istiâze eden) herkes büyük şirkle müşriktir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1733.0, "أقول: والاستعاذةُ هي طلبُ الأمن من الأمر المَخُوف؛"], [1738.0, "فإذا خاف الإنسان من شيءٍ فإنّ فطرته وجِبِلّته تدعوه إلى أن يبحث عن شيءٍ يُؤمِّنه من خوفه."], [1746.0, "فالاستعاذةُ هي طلبُ الأمن من الأمر المخوف."], [1754.0, "وإنّ من الناس من إذا نزل به أمرٌ مخوفٌ إنما يطرق أبوابَ الموتى،"], [1762.6, "وأبوابَ القبور والمشاهد والمزارات،"], [1766.6, "يستعيذ بهم في نجاته من هذا الأمر المخوف."]], "tr": [[1733.0, "Derim ki: İstiâze, korkulan şeyden emniyet istemektir."], [1738.0, "İnsan bir şeyden korktuğunda fıtratı ve yaratılışı onu, kendisini korkusundan emin kılacak bir şey aramaya çağırır."], [1746.0, "İstiâze, korkulan şeyden emniyet istemektir."], [1754.0, "İnsanlardan öyleleri vardır ki başına korkulan bir şey geldiğinde ölülerin kapılarını, kabirlerin, meşhedlerin (türbelerin) ve ziyaretgâhların kapılarını çalar;"], [1768.6, "bu korkulan şeyden kurtulmak için onlara sığınır."]]}, {"reader": false, "ar": [[1773.0, "فما إن ينزل به شيءٌ من مصائب الدنيا،"], [1776.7, "أو داهيةٌ من دواهي الدهر،"], [1779.0, "إلا ويستغيث بعليّ بن أبي طالب،"], [1781.6, "أو يستغيث بالحسن أو الحسين،"], [1783.7, "أو السيّد البدويّ، ويبدأ يبكي عند قبورهم ويصرخ ليُعيذوه من هذا الأمر المخوف."], [1792.0, "فإذا أصابتهم الحروب، أو أصابتهم الزلازل،"], [1795.4, "أو حلّ عليهم شيءٌ من الأمور الدنيويّة المخوفة،"], [1800.0, "فإنهم يلجؤون إلى عتبات قبور الأموات."]], "tr": [[1773.0, "Başına dünya musibetlerinden bir şey ya da zamanın belalarından bir bela gelir gelmez Ali b."], [1778.5, "Ebî Tâlib'den medet umar, ya da Hasan'dan veya Hüseyin'den ya da Seyyid Bedevî'den medet umar."], [1784.1, "Kabirlerinin yanında ağlamaya ve kendisini bu korkulan şeyden korumaları için feryat etmeye başlar."], [1792.0, "Onlara savaşlar isabet ettiğinde, depremler isabet ettiğinde ya da korkulan dünyevî işlerden bir şey başlarına geldiğinde ölülerin kabirlerinin eşiklerine sığınırlar."]]}, {"reader": false, "ar": [[1804.0, "فإنهم لم يفعلوا ذلك إلا لأنهم يعتقدون أنّ لهؤلاء الأموات تصرُّفًا خفيًّا في الكون،"], [1812.0, "وأنهم يملكون مع الله عز وجل النفعَ والضرّ،"], [1816.0, "وهذا هو حقيقةُ الشرك الأكبر."], [1818.0, "وقد أجمع علماءُ الإسلام ـ ولله الحمد ـ على أنّ من استعاذ بميّتٍ من الأموات في دفع مصيبةٍ من المصائب،"], [1826.5, "أو تفريجِ كربةٍ من الكُرَب،"], [1828.0, "فإنه مشركٌ الشركَ الأكبر. والله أعلم."]], "tr": [[1804.0, "Onlar bunu ancak bu ölülerin kâinatta gizli bir tasarrufu olduğuna ve Allah Azze ve Celle ile birlikte fayda ve zarara sahip olduklarına inandıkları için yaparlar."], [1816.0, "İşte büyük şirkin hakikati budur."], [1818.0, "İslâm âlimleri —hamd Allah'a— bir musibeti def etmekte ya da bir sıkıntıyı gidermekte ölülerden bir ölüye sığınan kimsenin büyük şirkle müşrik olduğu üzerinde icmâ etmişlerdir. Allah en iyisini bilir."]]}]}, {"ts": "30:32", "title": "5. Külliye: Gâib bir diriye ya da âciz bir hazıra sığınmak büyük şirktir", "paras": [{"reader": false, "ar": [[1832.0, "الكلّيّة الخامسة: <b>كلُّ استعاذةٍ بحيٍّ غائبٍ أو بحاضرٍ عاجزٍ فشركٌ أكبر.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1832.0, "<b>5. külliye: Gâib (uzakta olan) bir diriye ya da âciz bir hazıra (yanında bulunana) yapılan her istiâze büyük şirktir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1843.0, "فالاستعاذةُ عبادةٌ لا يجوز صرفُها لغير الله في الأمر الذي لا يقدر عليه إلا الله عز وجل."], [1866.0, "ولذلك أمرنا الله عز وجل بتوحيده بالاستعاذة في أمورٍ كثيرة،"], [1871.4, "في آياتٍ كثيرة؛ كقول الله عز وجل:"], [1875.2, "<span class=\"ayah\">﴿وَإِمَّا يَنزَغَنَّكَ مِنَ الشَّيْطَانِ نَزْغٌ فَاسْتَعِذْ بِاللَّهِ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٠٠]<\/span>."], [1879.0, "وقال الله عز وجل:"], [1881.0, "<span class=\"ayah\">﴿فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ﴾<\/span> <span class=\"ref\">[النحل: ٩٨]<\/span>."], [1885.0, "وقال الله عز وجل:"], [1887.1, "<span class=\"ayah\">﴿إِنِّي عُذْتُ بِرَبِّي وَرَبِّكُم مِّن كُلِّ مُتَكَبِّرٍ لَّا يُؤْمِنُ بِيَوْمِ الْحِسَابِ﴾<\/span> <span class=\"ref\">[غافر: ٢٧]<\/span>."], [1893.0, "وقال الله عز وجل في أفضل سورتين نزلتا:"], [1897.0, "<span class=\"ayah\">﴿قُلْ أَعُوذُ بِرَبِّ النَّاسِ﴾<\/span> <span class=\"ref\">[الناس: ١]<\/span>،"], [1899.7, "و<span class=\"ayah\">﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ﴾<\/span> <span class=\"ref\">[الفلق: ١]<\/span>."], [1903.1, "وقال الله عز وجل عن مريم رضي الله عنها لمّا تبدّى لها الملَك،"], [1908.4, "قالت: <span class=\"ayah\">﴿إِنِّي أَعُوذُ بِالرَّحْمَٰنِ مِنكَ إِن كُنتَ تَقِيًّا﴾<\/span> <span class=\"ref\">[مريم: ١٨]<\/span>."]], "tr": [[1843.0, "İstiâze, sadece Allah Azze ve Celle'nin gücü yettiği bir işte Allah'tan başkasına yöneltilmesi caiz olmayan bir ibadettir."], [1866.0, "Bu yüzden Allah Azze ve Celle birçok işte, birçok ayette bize istiâzede O'nu birlememizi emretmiştir."], [1873.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1875.2, "<span class=\"ayah\">﴿Eğer şeytandan bir kışkırtma seni dürterse, hemen Allah'a sığın﴾<\/span> [A'râf 200]."], [1879.0, "Allah Azze ve Celle şöyle buyurdu:"], [1881.0, "<span class=\"ayah\">﴿Kur'an okuyacağın zaman kovulmuş şeytandan Allah'a sığın﴾<\/span> [Nahl 98]."], [1885.0, "Allah Azze ve Celle şöyle buyurdu:"], [1887.1, "<span class=\"ayah\">﴿Ben, hesap gününe inanmayan her kibirliden benim de Rabbim, sizin de Rabbiniz olan (Allah'a) sığındım﴾<\/span> [Mü'min 27]."], [1893.0, "Allah Azze ve Celle inen en faziletli iki sûrede şöyle buyurdu:"], [1897.0, "<span class=\"ayah\">﴿De ki: İnsanların Rabbine sığınırım﴾<\/span> [Nâs 1] ve <span class=\"ayah\">﴿De ki: Sabahın Rabbine sığınırım﴾<\/span> [Felak 1]."], [1903.1, "Allah Azze ve Celle, melek kendisine göründüğünde Meryem —Allah ondan razı olsun— hakkında şöyle buyurdu;"], [1906.6, "(Meryem) dedi ki: <span class=\"ayah\">﴿Senden Rahmân'a sığınırım; eğer takva sahibi isen (bana dokunma)﴾<\/span> [Meryem 18]."]]}, {"reader": false, "ar": [[1913.0, "وبما أنّ الاستعاذة بهذه المنزلة التوحيديّة في الشرع،"], [1919.0, "فإنّ العلماء مُجمِعون على أنّ كلَّ من استعاذ بغائبٍ عنه فإنه مشركٌ الشركَ الأكبر؛"], [1926.5, "لأنه لم يستعذ به ـ مع غيابه عنه،"], [1930.9, "وبُعدِ المسافات الشاسعة عنه ـ إلا لأنه يعتقد أنّ له تصرُّفًا خفيًّا في الكون،"], [1937.0, "وأنّ له قدرةً تدبيريّةً تصريفيّةً استقلاليّةً مع الله عز وجل."]], "tr": [[1913.0, "İstiâze şeriatta bu tevhidî mertebede olduğuna göre, âlimler kendisinden uzakta (gâib) olan birine sığınan herkesin büyük şirkle müşrik olduğu üzerinde icmâ etmişlerdir."], [1924.6, "Çünkü o, kendisinden uzakta olmasına ve aralarındaki geniş mesafelere rağmen ona ancak onun kâinatta gizli bir tasarrufu olduğuna ve Allah Azze ve Celle ile birlikte müstakil bir tedbir ve tasarruf kudretine sahip olduğuna inandığı için sığınmıştır."]]}, {"reader": false, "ar": [[1943.0, "وكذلك أجمعوا على أنّ كلَّ من استعاذ بحاضرٍ عنده،"], [1950.0, "لكن في الأمر الذي لا يقدر عليه إلا الله عز وجل،"], [1954.0, "بأنه مشركٌ الشركَ الأكبر؛"], [1957.0, "لأنه لم يفعل ذلك إلا لاعتقاده بأنّ له تدبيرًا خفيًّا في الكون."], [1965.0, "فإذا قيل لك: ما الاستعاذةُ الشركيّة؟"], [1968.0, "فقل: الاستعاذةُ الشركيّة هي الاستعاذةُ بالأموات مطلقًا،"], [1973.0, "أو الاستعاذةُ بالغائب مطلقًا،"], [1977.0, "أو الاستعاذةُ بالحيّ الحاضر في الأمر الذي لا يقدر عليه إلا الله عز وجل. والله أعلم."]], "tr": [[1943.0, "Aynı şekilde, yanında hazır olan birine, ama sadece Allah Azze ve Celle'nin gücü yettiği bir işte sığınan herkesin büyük şirkle müşrik olduğu üzerinde de icmâ etmişlerdir."], [1957.0, "Çünkü o bunu ancak onun kâinatta gizli bir tedbiri olduğuna inandığı için yapmıştır."], [1965.0, "Sana \"Şirk olan istiâze nedir?\" denirse de ki:"], [1968.0, "Şirk olan istiâze; mutlak olarak ölülere sığınmak, mutlak olarak gâib olana sığınmak ya da sadece Allah Azze ve Celle'nin gücü yettiği bir işte hazır olan diriye sığınmaktır. Allah en iyisini bilir."]]}]}, {"ts": "33:05", "title": "6. Külliye: Güç yetirilebilen bir şeyde bir mahlûka sığınmak caizdir", "paras": [{"reader": false, "ar": [[1985.0, "ومن الكلّيّات أيضًا: <b>كلُّ استعاذةٍ بمخلوقٍ في مقدورٍ عليه فجائزة.<\/b> كلُّ استعاذةٍ بمخلوقٍ في أمرٍ ـ أو في مقدورٍ عليه ـ فجائزة."], [2003.0, "<b>كلُّ استعاذةٍ بمخلوقٍ في مقدورٍ عليه فجائزة.<\/b>"]], "tr": [[1985.0, "Külliyelerden biri de şudur: 6."], [1988.0, "külliye: Güç yetirilebilen bir şeyde bir mahlûka yapılan her istiâze caizdir. Bir işte —ya da güç yetirilebilen bir şeyde— bir mahlûka yapılan her istiâze caizdir."], [1997.3, "<b>6. külliye: Güç yetirilebilen bir şeyde bir mahlûka yapılan her istiâze caizdir.<\/b>"]]}, {"reader": false, "ar": [[2008.0, "أقول: أي لا تُعتبر شركًا،"], [2011.0, "بل هي نوعٌ من أنواع الاستعانة،"], [2013.3, "أو طلبِ العون من القادر الحيّ الحاضر."], [2016.0, "والدليلُ على ذلك قصّةُ المرأة التي استعاذت بأمّ سلمة رضي الله تعالى عنها؛"], [2026.0, "فقد روى الإمام مسلمٌ في «صحيحه» من حديث جابرٍ رضي الله عنه:"], [2031.0, "أنّ امرأةً من بني مخزوم سرقت،"], [2035.0, "فأُتي بها النبيُّ صلى الله عليه وسلم،"], [2039.0, "فعاذت بأمّ سلمة ـ أي التجأت إليها ـ فقال النبيّ صلى الله عليه وسلم:"], [2049.0, "«واللهِ، لو كانت فاطمةُ لقطعتُ يدَها»."], [2052.0, "ولم يُنكر عليها النبيُّ صلى الله عليه وسلم استعاذتَها بأمّ سلمة؛"], [2058.0, "لأنها استعاذةٌ بمخلوقٍ حاضرٍ في أمرٍ مقدورٍ عليه."]], "tr": [[2008.0, "Derim ki: Yani şirk sayılmaz;"], [2010.4, "aksine istiâne türlerinden bir türdür ya da güç yetiren, hazır olan diriden yardım istemektir."], [2016.0, "Bunun delili, Ümmü Seleme'ye —Allah ondan razı olsun— sığınan kadının kıssasıdır."], [2026.0, "İmam Müslim Sahîh'inde Câbir radıyallâhu anh'ın hadisinden rivayet etmiştir:"], [2031.0, "Benî Mahzûm'dan bir kadın hırsızlık yaptı ve Peygamber sallallâhu aleyhi ve sellem'e getirildi."], [2037.9, "Kadın Ümmü Seleme'ye sığındı —yani ona iltica etti—."], [2044.3, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2049.0, "\"Vallahi, Fâtıma olsaydı onun da elini keserdim.\" Peygamber sallallâhu aleyhi ve sellem onun Ümmü Seleme'ye sığınmasını reddetmedi;"], [2058.0, "çünkü bu, güç yetirilebilen bir işte hazır olan bir mahlûka sığınmaktır."]]}, {"reader": false, "ar": [[2063.0, "وكذلك قصّةُ الغلام التي رواها الإمام مسلمٌ في «صحيحه» من حديث أبي مسعودٍ الأنصاريّ رضي الله عنه:"], [2073.0, "من أنه كان يضرب غلامًا له،"], [2075.0, "فجعل الغلامُ يقول: أعوذ بالله،"], [2077.9, "أعوذ بالله، وابنُ مسعود ـ وأبو مسعود ـ لا ينتهي."], [2084.0, "قال: فقال الغلام: أعوذ برسول الله،"], [2087.0, "فتركه. فقال رسول الله صلى الله عليه وسلم له ـ أي لأبي مسعود ـ:"], [2094.0, "«واللهِ، لَلّهُ أقدرُ عليك منك على هذا الغلام». فأعتقه."]], "tr": [[2063.0, "Kölenin kıssası da böyledir; onu İmam Müslim Sahîh'inde Ebû Mes'ûd el-Ensârî radıyallâhu anh'ın hadisinden rivayet etmiştir:"], [2073.0, "Ebû Mes'ûd kölesini dövüyordu. Köle \"Allah'a sığınırım, Allah'a sığınırım\" demeye başladı;"], [2076.7, "İbn Mes'ûd —Ebû Mes'ûd— ise durmuyordu."], [2084.0, "(Ebû Mes'ûd) dedi ki: Köle \"Allah'ın Resûlü'ne sığınırım\" deyince onu bıraktı."], [2089.0, "Bunun üzerine Resûlullah sallallâhu aleyhi ve sellem ona —yani Ebû Mes'ûd'a— şöyle buyurdu:"], [2094.0, "\"Vallahi, senin bu köleye gücünün yetmesinden daha çok Allah'ın sana gücü yeter.\" Bunun üzerine onu âzat etti."]]}, {"reader": false, "ar": [[2098.0, "قال القاضي عياضٌ رحمه الله تعالى في «إكمال المُعلِم»:"], [2104.0, "«لعلّه» ـ أي أبو مسعود ـ «لعلّه لم يسمع استعاذتَه الأولى لشدّة غضبه، كما لم يسمع نداءَ النبيّ صلى الله عليه وسلم له، كما جاء في الحديث، أو يكون لمّا استعاذ برسول الله صلى الله عليه وسلم تنبّه لمكانه»."], [2123.8, "انتهى. وهذا من باب الاعتذار لأبي مسعود؛"], [2127.0, "إذ كيف يضرب غلامَه وهو يستعيذ بالله،"], [2130.0, "فلمّا استعاذ برسول الله تركه؟!"], [2132.0, "قال: لعلّه من شدّة غضبه لم يفهم،"], [2134.5, "أو لم يسمع استغاثةَ ـ استعاذةَ ـ الغلام بالله عز وجل."]], "tr": [[2098.0, "Kâdî İyâz —Allah ona rahmet etsin— İkmâlü'l-Mu'lim'de şöyle demiştir:"], [2104.0, "\"Belki o\" —yani Ebû Mes'ûd— \"belki öfkesinin şiddetinden dolayı (kölenin) ilk istiâzesini işitmemiştir;"], [2113.0, "nitekim hadiste geldiği gibi Peygamber sallallâhu aleyhi ve sellem'in kendisine seslenişini de işitmemiştir."], [2117.3, "Ya da Resûlullah sallallâhu aleyhi ve sellem'e sığınınca onun orada bulunduğunu fark etmiştir.\" Sözü bitti."], [2123.8, "Bu, Ebû Mes'ûd için özür bulma babındandır."], [2127.0, "Çünkü köle Allah'a sığınırken onu nasıl döver de Resûlullah'a sığınınca bırakır?!"], [2130.8, "(Kâdî İyâz) diyor ki: Belki öfkesinin şiddetinden dolayı kölenin Allah Azze ve Celle'den medet istemesini —Allah'a sığınmasını— anlamamış ya da işitmemiştir."]]}, {"reader": false, "ar": [[2141.0, "ويدلّ على ذلك أيضًا ما رواه الإمام أحمد في «مسنده» من حديث عائشة رضي الله تعالى عنها قالت:"], [2148.5, "«بعثت صفيّةُ إلى رسول الله صلى الله عليه وسلم بطعامٍ صنعته له وهو عندي، فلمّا رأيتُ الجاريةَ أخذتني رِعدة، فضربتُ القَصعةَ فرميتُ بها. قالت: فنظر إليّ رسولُ الله صلى الله عليه وسلم فعرفتُ الغضبَ في وجهه، فقلت: أعوذ برسول الله أن يلعنني اليوم»."], [2173.0, "فعاذت بالنبيّ صلى الله عليه وسلم ألّا يلعنها؛"], [2178.0, "بسبب ما فعلته من كسر هذه الصَّحْفة."]], "tr": [[2141.0, "Buna, İmam Ahmed'in Müsned'inde Âişe'den —Allah ondan razı olsun— rivayet ettiği hadis de delâlet eder."], [2148.5, "(Âişe) dedi ki: \"Safiyye, Resûlullah sallallâhu aleyhi ve sellem'e onun için yaptığı bir yemeği gönderdi;"], [2162.6, "o sırada (Resûlullah) benim yanımdaydı."], [2167.5, "Cariyeyi görünce beni bir titreme aldı;"], [2173.0, "kâseye vurup onu fırlattım. Resûlullah sallallâhu aleyhi ve sellem bana baktı, yüzündeki öfkeyi anladım ve 'Bugün beni lanetlemesinden Allah'ın Resûlü'ne sığınırım' dedim.\" O, bu kâseyi kırmasından dolayı kendisini lanetlememesi için Peygamber sallallâhu aleyhi ve sellem'e sığınmıştır."]]}, {"reader": false, "ar": [[2182.0, "وفي «صحيح الإمام مسلم» لمّا ذكر النبيّ صلى الله عليه وسلم الفتن قال:"], [2187.7, "«فمن وجد مَعاذًا أو ملجأً فليَعُذْ به»."], [2193.0, "والخلاصةُ من هذه الكلّيّة:"], [2195.7, "أنّ الإنسان إذا استعاذ بمخلوقٍ قادرٍ على إعاذته فيما استعاذه فيه،"], [2204.0, "فإنّ ذلك لا تعلُّقَ له بالشرك،"], [2206.3, "ولا بشيءٍ من التوحيد أو مخالفة التوحيد."]], "tr": [[2182.0, "İmam Müslim'in Sahîh'inde, Peygamber sallallâhu aleyhi ve sellem fitneleri zikrettiğinde şöyle buyurmuştur:"], [2187.7, "\"Kim bir sığınak ya da bir barınak bulursa ona sığınsın.\" Bu külliyeden çıkan sonuç şudur:"], [2195.7, "İnsan, sığındığı şeyde kendisini korumaya gücü yeten bir mahlûka sığınırsa, bunun şirkle, tevhidle ya da tevhide aykırılıkla hiçbir ilgisi yoktur."]]}]}, {"ts": "36:49", "title": "7. Külliye: Allah'ın her sıfatıyla istiâze etmek caizdir", "paras": [{"reader": false, "ar": [[2209.0, "الكلّيّة السابعة: كلُّ صفات الله تعالى تجوز الاستعاذةُ بها؛"], [2214.0, "كلُّ صفةٍ لله جلّ وعلا فيجوز الاستعاذةُ بها. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2209.0, "7. külliye: Allah Teâlâ'nın bütün sıfatlarıyla istiâze etmek caizdir;"], [2213.4, "Allah'ın —Celle ve Alâ— her sıfatıyla istiâze etmek caizdir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2219.0, "وذلك لأنّ المتقرِّر في القواعد جوازُ الاستعاذة بالمعظَّم،"], [2234.0, "وصفاتُ الله عز وجل عظيمة،"], [2238.0, "وقد دلّت الأدلّة على ذلك."], [2240.0, "ففي الحديث عن عائشة رضي الله عنها قالت:"], [2244.0, "«فقدتُ رسولَ الله صلى الله عليه وسلم ليلةً من الفراش» ـ إيش بلاكم؟"], [2248.0, "ـ «ليلةً من الفراش، فالتمستُه، فوقعت يدي على قدميه وهما منصوبتان وهو ساجد، وهو يقول: اللهمّ إني أعوذ برضاك من سخطك، وبمعافاتك من عقوبتك، وبك منك، لا أُحصي ثناءً عليك»."]], "tr": [[2219.0, "Bu şundandır: Kaidelerde yerleşik olan, tazim edilen (yüce) şeyle istiâzenin caiz olmasıdır;"], [2234.8, "Allah Azze ve Celle'nin sıfatları da yücedir."], [2238.4, "Deliller de buna delâlet etmiştir."], [2240.0, "Hadiste Âişe'den —Allah ondan razı olsun— şöyle dediği rivayet edilir:"], [2244.0, "\"Bir gece Resûlullah sallallâhu aleyhi ve sellem'i yatağında bulamadım\" —ne oldu size?— \"bir gece yatağında (bulamadım)."], [2248.0, "Onu aradım; elim onun ayaklarına dokundu."], [2254.1, "Ayakları dikili hâldeydi, secdedeydi ve şöyle diyordu:"], [2259.2, "Allah'ım! Rızana sığınarak gazabından, affına sığınarak cezandan, Sana sığınarak Senden (sığınırım). Sana olan övgüyü sayamam.\""]]}, {"reader": false, "ar": [[2271.0, "فهنا قد استعاذ النبيُّ صلى الله عليه وسلم بجُمَلٍ من صفات الله عز وجل."], [2276.0, "ومنها أيضًا قولُه صلى الله عليه وسلم:"], [2279.8, "«أعوذ بكلمات الله التامّات من شرّ ما خلق»،"], [2284.2, "وكلماتُ الله صفةٌ من صفاته."], [2287.0, "وكذلك أيضًا قولُه عز وجل ـ عفوًا ـ قولُ النبيّ صلى الله عليه وسلم في الحديث المعروف:"], [2295.6, "«وأعوذ بعظمتك أن أُغتال من تحتي»."], [2299.0, "وقولُه صلى الله عليه وسلم في دعاء الألم:"], [2303.0, "«أعوذ بعزّة الله وقدرته من شرّ ما أجد وأُحاذر»."]], "tr": [[2271.0, "İşte burada Peygamber sallallâhu aleyhi ve sellem Allah Azze ve Celle'nin birçok sıfatıyla istiâze etmiştir."], [2276.0, "Bunlardan biri de Peygamber sallallâhu aleyhi ve sellem'in şu sözüdür:"], [2280.4, "\"Yarattığı şeylerin şerrinden Allah'ın tam kelimelerine sığınırım.\" Allah'ın kelimeleri O'nun sıfatlarından bir sıfattır."], [2287.0, "Aynı şekilde Allah Azze ve Celle'nin —pardon— Peygamber sallallâhu aleyhi ve sellem'in bilinen hadisteki şu sözü:"], [2295.6, "\"Altımdan ansızın helâk edilmekten Senin azametine sığınırım.\" Peygamber sallallâhu aleyhi ve sellem'in ağrı duasındaki şu sözü:"], [2303.0, "\"Hissettiğim ve endişe ettiğim şeyin şerrinden Allah'ın izzetine ve kudretine sığınırım.\""]]}, {"reader": false, "ar": [[2308.0, "وقولُه صلى الله عليه وسلم لمّا نزل عليه قولُ الله عز وجل:"], [2314.0, "<span class=\"ayah\">﴿قُلْ هُوَ الْقَادِرُ عَلَىٰ أَن يَبْعَثَ عَلَيْكُمْ عَذَابًا مِّن فَوْقِكُمْ﴾<\/span>،"], [2317.0, "قال: «أعوذ بوجهك»، <span class=\"ayah\">﴿أَوْ مِن تَحْتِ أَرْجُلِكُمْ﴾<\/span>،"], [2321.3, "قال: «أعوذ بوجهك»، <span class=\"ayah\">﴿أَوْ يَلْبِسَكُمْ شِيَعًا وَيُذِيقَ بَعْضَكُم بَأْسَ بَعْضٍ﴾<\/span> <span class=\"ref\">[الأنعام: ٦٥]<\/span>،"], [2326.0, "قال: «هذه أهونُ» أو «أسهل»."], [2328.0, "والكلّيّة واضحة إن شاء الله."]], "tr": [[2308.0, "Allah Azze ve Celle'nin şu sözü kendisine indiğinde Peygamber sallallâhu aleyhi ve sellem'in sözü de böyledir:"], [2314.0, "<span class=\"ayah\">﴿De ki: O, size üstünüzden bir azap göndermeye kadirdir﴾<\/span> dedi ki:"], [2317.7, "\"Senin vechine sığınırım.\" <span class=\"ayah\">﴿ya da ayaklarınızın altından﴾<\/span> dedi ki:"], [2321.9, "\"Senin vechine sığınırım.\" <span class=\"ayah\">﴿ya da sizi fırkalara ayırıp birbirinizin şiddetini birbirinize tattırmaya (kadirdir)﴾<\/span> [En'âm 65] dedi ki:"], [2328.0, "\"Bu daha hafiftir\" ya da \"daha kolaydır.\" Külliye inşallah açıktır."]]}]}, {"ts": "38:51", "title": "8. Külliye: Korkulan her şeyin yanında istiâze meşrudur", "paras": [{"reader": false, "ar": [[2331.0, "ومن الكلّيّات أيضًا: <b>كلُّ أمرٍ مخوفٍ فتُشرع الاستعاذةُ عنده.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2331.0, "Külliyelerden biri de şudur: 8."], [2332.7, "külliye: Korkulan her şeyin yanında istiâze meşrudur. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2336.0, "وهذه الكلّيّة العامّة أخذناها من جُمَلٍ من الأدلّة؛"], [2356.0, "فمن ذلك: الاستعاذةُ بالله عند قراءة القرآن؛"], [2359.7, "لخوف وسوسة الشيطان، أو تسويله،"], [2362.4, "أو صرفِ القلب عن تدبُّر كلام الله عز وجل،"], [2366.0, "فقال الله عز وجل:"], [2368.0, "<span class=\"ayah\">﴿فَإِذَا قَرَأْتَ الْقُرْآنَ فَاسْتَعِذْ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ﴾<\/span> <span class=\"ref\">[النحل: ٩٨]<\/span>."], [2373.0, "ومنها أيضًا: عند حصول شيءٍ من نزغات الشيطان؛"], [2378.0, "فإذا نزغك الشيطانُ ببعض نزغاته ـ إمّا نزغاتِ الشهوات أو نزغاتِ الشبهات ـ فإنه أمرٌ مخوفٌ منه على الدين والدنيا،"], [2390.2, "فتُشرع عنده الاستعاذة، كما قال الله عز وجل:"], [2394.5, "<span class=\"ayah\">﴿وَإِمَّا يَنزَغَنَّكَ مِنَ الشَّيْطَانِ نَزْغٌ فَاسْتَعِذْ بِاللَّهِ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٠٠]<\/span>،"], [2398.0, "وقولُ الله عز وجل:"], [2400.0, "<span class=\"ayah\">﴿وَقُل رَّبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ ۝ وَأَعُوذُ بِكَ رَبِّ أَن يَحْضُرُونِ﴾<\/span> <span class=\"ref\">[المؤمنون: ٩٧–٩٨]<\/span>."]], "tr": [[2336.0, "Bu genel külliyeyi birçok delilden aldık."], [2356.0, "Bunlardan biri: Şeytanın vesvesesinden, süslemesinden ya da kalbi Allah Azze ve Celle'nin kelâmını tedebbür etmekten alıkoymasından korkulduğu için Kur'an okurken Allah'a sığınmak."], [2365.5, "Allah Azze ve Celle şöyle buyurdu:"], [2368.0, "<span class=\"ayah\">﴿Kur'an okuyacağın zaman kovulmuş şeytandan Allah'a sığın﴾<\/span> [Nahl 98]."], [2373.0, "Bunlardan biri de şeytanın dürtmelerinden bir şey meydana geldiğindedir."], [2378.0, "Şeytan seni dürtmelerinden biriyle —ya şehvet dürtmeleriyle ya da şüphe dürtmeleriyle— dürterse, bu, din ve dünya için kendisinden korkulan bir şeydir;"], [2389.0, "dolayısıyla onun yanında istiâze meşru olur."], [2391.4, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2394.5, "<span class=\"ayah\">﴿Eğer şeytandan bir kışkırtma seni dürterse, hemen Allah'a sığın﴾<\/span> [A'râf 200]."], [2397.5, "Allah Azze ve Celle'nin şu sözü de:"], [2400.0, "<span class=\"ayah\">﴿De ki: Rabbim! Şeytanların kışkırtmalarından Sana sığınırım. Rabbim! Onların yanımda bulunmalarından da Sana sığınırım﴾<\/span> [Mü'minûn 97–98]."]]}, {"reader": false, "ar": [[2406.0, "ومنها أيضًا: الاستعاذةُ بالله عز وجل من الشيطان إذا وسوس في قلبك وسوسةً تخصّ اللهَ عز وجل ووجودَه،"], [2418.7, "وأسماءَه وصفاتِه، وقدرتَه وقضاءَه وقدرَه؛"], [2422.0, "فإنّ ذلك من الشيطان."], [2424.0, "وقد ندبنا النبيُّ صلى الله عليه وسلم عند الإحساس بشيءٍ من ذلك بالاستعاذة؛"], [2431.0, "ففي «الصحيحين» من حديث أبي هريرة رضي الله عنه قال:"], [2435.3, "قال النبيّ صلى الله عليه وسلم:"], [2437.0, "«يأتي الشيطانُ أحدَكم فيقول: من خلق كذا؟ من خلق كذا؟ حتى يقول: من خلق ربَّك؟ فإذا بلغه فليستعذ بالله ولْينتهِ»."]], "tr": [[2406.0, "Bunlardan biri de: Şeytan kalbine Allah Azze ve Celle ile, O'nun varlığıyla, isimleri ve sıfatlarıyla, kudreti, kazası ve kaderiyle ilgili bir vesvese verdiğinde şeytandan Allah Azze ve Celle'ye sığınmaktır."], [2424.0, "Çünkü bu şeytandandır. Peygamber sallallâhu aleyhi ve sellem böyle bir şey hissedildiğinde bizi istiâzeye teşvik etmiştir."], [2431.0, "Sahîhayn'de Ebû Hüreyre radıyallâhu anh'ın hadisinde şöyle dedi:"], [2435.3, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [2437.0, "\"Şeytan sizden birine gelir ve 'Şunu kim yarattı?"], [2438.7, "Şunu kim yarattı?' der; sonunda 'Rabbini kim yarattı?' der."], [2442.8, "Oraya varınca Allah'a sığınsın ve (bu düşünceyi) bıraksın.\""]]}, {"reader": false, "ar": [[2451.0, "وأخرج الإمام أحمد في «مسنده» بإسنادٍ صحيحٍ لغيره من حديث ابن مسعودٍ رضي الله عنه قال:"], [2460.3, "قال النبيّ صلى الله عليه وسلم:"], [2462.3, "«إنّ للشيطان لَمّةً بابن آدم، وإنّ للملَك لَمّة؛ فأمّا لَمّةُ الشيطان فإيعادٌ بالشرّ وتكذيبٌ بالحقّ، وأمّا لَمّةُ الملَك فإيعادٌ بالخير وتصديقٌ بالحقّ. فمن وجد ذلك» ـ أي لَمّةَ الملَك ـ «فليعلم أنها من الله فليحمد الله، ومن وجد الأخرى» ـ أي لَمّةَ الشيطان ـ «فليستعذ بالله من الشيطان الرجيم»."], [2483.0, "ثم تلا: <span class=\"ayah\">﴿الشَّيْطَانُ يَعِدُكُمُ الْفَقْرَ وَيَأْمُرُكُم بِالْفَحْشَاءِ﴾<\/span> ـ وهذه لَمّةُ الشيطان ـ <span class=\"ayah\">﴿وَاللَّهُ يَعِدُكُم مَّغْفِرَةً مِّنْهُ وَفَضْلًا ۗ وَاللَّهُ وَاسِعٌ عَلِيمٌ﴾<\/span> <span class=\"ref\">[البقرة: ٢٦٨]<\/span>."]], "tr": [[2451.0, "İmam Ahmed Müsned'inde, başka rivayetlerle sahih olan (sahîh li-gayrihî) bir isnadla İbn Mes'ûd radıyallâhu anh'ın hadisini rivayet etmiştir."], [2457.6, "Dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [2460.3, "\"Şüphesiz şeytanın Âdemoğluna bir dokunuşu (lemmesi), meleğin de bir dokunuşu vardır."], [2461.3, "Şeytanın dokunuşu, kötülükle tehdit etmek ve hakkı yalanlamaktır."], [2462.3, "Meleğin dokunuşu ise hayır vaat etmek ve hakkı tasdik etmektir."], [2466.7, "Kim bunu\" —yani meleğin dokunuşunu— \"bulursa, onun Allah'tan olduğunu bilsin ve Allah'a hamd etsin."], [2474.7, "Kim de diğerini\" —yani şeytanın dokunuşunu— \"bulursa, kovulmuş şeytandan Allah'a sığınsın.\" Sonra şu ayeti okudu:"], [2483.0, "<span class=\"ayah\">﴿Şeytan sizi fakirlikle korkutur ve size çirkinliği emreder﴾<\/span> —işte bu şeytanın dokunuşudur— <span class=\"ayah\">﴿Allah ise size Kendisinden bir mağfiret ve lütuf vaat eder. Allah geniştir, her şeyi bilendir﴾<\/span> [Bakara 268]."]]}, {"reader": false, "ar": [[2496.0, "ومنها أيضًا: الاستعاذةُ بالله عند تلبُّس الشيطان؛"], [2502.0, "فمتى ما أصابك الشيطانُ بشيءٍ من الوجع أو التلبُّس فاستعذ بالله عز وجل منه،"], [2511.0, "كما أخرجه الإمام مسلمٌ في «صحيحه» من حديث… كما أخرجه الإمام مسلمٌ في «صحيحه»:"], [2524.0, "أنّ رجلًا من أصحاب النبيّ صلى الله… نعم،"], [2528.0, "من حديث عثمان بن أبي العاص رضي الله تعالى عنه قال:"], [2531.5, "قلتُ: يا رسول الله،"], [2533.5, "إني أجد وجعًا في جسدي،"], [2536.0, "فقال صلى الله عليه وسلم:"], [2538.1, "«ضع يدك على الذي تألّم من جسدك، وقل: بسم الله، أعوذ بعزّة الله وقدرته من شرّ ما أجد وأُحاذر، سبعَ مرّات»."], [2552.0, "قال: ففعلتُه، فأذهب الله عز وجل ما كان بي."]], "tr": [[2496.0, "Bunlardan biri de: Şeytanın (insana) girmesi (telebbüsü) hâlinde Allah'a sığınmaktır."], [2502.0, "Şeytan sana bir ağrı ya da telebbüsle isabet ettiğinde ondan Allah Azze ve Celle'ye sığın."], [2509.8, "Nitekim İmam Müslim Sahîh'inde şu kişinin hadisinden rivayet etmiştir… İmam Müslim Sahîh'inde rivayet etmiştir ki Peygamber'in ashabından bir adam… Evet, Osmân b."], [2524.0, "Ebi'l-Âs radıyallâhu anh'ın hadisinden. Dedi ki:"], [2528.0, "\"Ey Allah'ın Resûlü, bedenimde bir ağrı hissediyorum\" dedim."], [2531.5, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2538.1, "\"Elini bedeninin ağrıyan yerine koy ve 'Bismillâh, hissettiğim ve endişe ettiğim şeyin şerrinden Allah'ın izzetine ve kudretine sığınırım' de;"], [2547.0, "yedi defa.\" (Osmân) dedi ki:"], [2552.0, "Bunu yaptım, Allah Azze ve Celle bende olanı giderdi."]]}, {"reader": false, "ar": [[2557.0, "ومنها أيضًا: عند الغضب،"], [2559.7, "وهو أمرٌ مخوفٌ على أن يُدمِّر الإنسانُ بسبب غضبه دينَه ودنياه؛"], [2570.0, "فكم من بيوتٍ تدمّرت بسبب الغضب!"], [2573.0, "وكم من إنسانٍ حُكم بكفره بسبب قولةٍ كفريّةٍ قالها في وقت غضبه!"], [2580.0, "فبما أنه أمرٌ مخوفٌ عليه في أمر الدين والدنيا،"], [2584.0, "فتُشرع عنده الاستعاذة. والدليلُ على ذلك حديثُ سليمان بن صُرَد رضي الله عنه قال:"], [2591.3, "«استبّ رجلان عند النبيّ صلى الله عليه وسلم، فغضب أحدُهما حتى احمرّ وجهُه، فقال النبيّ صلى الله عليه وسلم: إني لأعلم كلمةً لو قالها لذهب عنه ما يجد: أعوذ بالله من الشيطان الرجيم. فقالوا للرجل: ألا تسمع ما قال النبيّ صلى الله عليه وسلم؟ فقال: إني لستُ بمجنون»، من شدّة غضبه."]
