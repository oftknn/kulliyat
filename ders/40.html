], "tr": [[2557.0, "Bunlardan biri de öfke anıdır."], [2559.7, "Öfke, insanın onun yüzünden dinini ve dünyasını mahvetmesinden korkulan bir şeydir."], [2570.0, "Öfke yüzünden nice evler yıkılmıştır!"], [2570.5, "Nice insan, öfkesi anında söylediği küfür içeren bir söz yüzünden küfrüne hükmedilmiştir!"], [2573.0, "Din ve dünya işinde (kişi için) korkulan bir şey olduğuna göre, onun yanında istiâze meşru olur."], [2580.0, "Bunun delili Süleymân b. Surad radıyallâhu anh'ın hadisidir."], [2581.8, "Dedi ki: \"Peygamber sallallâhu aleyhi ve sellem'in yanında iki adam birbirine sövdü."], [2586.0, "Biri öyle öfkelendi ki yüzü kızardı."], [2588.5, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2591.3, "'Ben bir söz biliyorum ki onu söylese, hissettiği şey ondan gider:"], [2599.7, "Kovulmuş şeytandan Allah'a sığınırım.' Adama 'Peygamber sallallâhu aleyhi ve sellem'in ne dediğini işitmiyor musun?' dediler."], [2609.3, "O da 'Ben deli değilim' dedi.\" (Bunu) öfkesinin şiddetinden (söyledi)."]]}, {"reader": false, "ar": [[2616.0, "ومنها أيضًا: عندما يرى رؤيا تُخيفه؛"], [2620.0, "فإنّ المشروع عندها أن يستعيذ،"], [2623.0, "كما قال النبيّ صلى الله عليه وسلم:"], [2626.0, "«الرؤيا من الله، والحُلُم من الشيطان، فإذا رأى أحدُكم شيئًا يكرهه فلينفث عن يساره ثلاثًا، ويتعوّذ بالله من شرّها، فإنها لا تضرّه»."]], "tr": [[2616.0, "Bunlardan biri de kişinin kendisini korkutan bir rüya gördüğü zamandır."], [2620.0, "O zaman meşru olan istiâze etmesidir."], [2623.0, "Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2626.0, "\"(Güzel) rüya Allah'tandır, (kötü) düş şeytandandır."], [2627.3, "Sizden biri hoşlanmadığı bir şey görürse sol tarafına üç kez hafifçe tükürsün ve onun şerrinden Allah'a sığınsın;"], [2634.0, "o zaman ona zarar vermez.\""]]}, {"reader": false, "ar": [[2636.0, "ومنها أيضًا: عند دخول المسجد؛"], [2639.3, "فإنّ الشيطان له خصوصيّةٌ بمن يدخل المسجد ليُفسد عليه مقصودَه الذي جاء من أجله."], [2649.0, "ففي «الصحيحين» من حديث أبي هريرة رضي الله عنه قال:"], [2652.8, "قال النبيّ صلى الله عليه وسلم:"], [2655.0, "«إذا نُودي للصلاة أدبر الشيطانُ وله ضُراطٌ حتى لا يسمع التأذين، فإذا قُضي التأذين أقبل» ـ أي للمسجد ـ «فإذا ثُوِّب بالصلاة أدبر، فإذا قُضي التثويب أقبل، حتى يخطر بين المرء وقلبه، يقول: اذكر كذا، واذكر كذا، لِما لم يكن يذكر، حتى يظلّ الرجل لا يدري كم صلّى»."]], "tr": [[2636.0, "Bunlardan biri de mescide girerkendir."], [2639.3, "Çünkü şeytanın, mescide giren kimseyle, onun geldiği maksadı bozmak için özel bir ilgisi vardır."], [2649.0, "Sahîhayn'de Ebû Hüreyre radıyallâhu anh'ın hadisinde şöyle dedi:"], [2650.9, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [2652.8, "\"Namaz için ezan okunduğunda şeytan, ezanı işitmemek için yellenerek arkasını döner kaçar."], [2655.0, "Ezan bitince geri gelir\" —yani mescide— \"Kamet getirilince arkasını döner kaçar."], [2661.0, "Kamet bitince geri gelir; kişi ile kalbi arasına girer ve 'Şunu hatırla, şunu hatırla' der, daha önce hatırlamadığı şeyleri."], [2672.3, "Sonunda adam kaç rekât kıldığını bilemez hâle gelir.\""]]}, {"reader": false, "ar": [[2675.0, "فبما أنه موضعٌ يُخاف عنده من الشيطان،"], [2681.0, "فيُشرع لك إذا دخلتَ المسجد أن تستعيذ بالله من الشيطان الرجيم."], [2685.0, "ودليلُها ما أخرجه الإمام أبو داود في «سننه» بإسنادٍ صحيح من حديث عبد الله بن عمرو بن العاص رضي الله عنهما قال:"], [2694.4, "«كان النبيّ صلى الله عليه وسلم إذا دخل المسجد قال: أعوذ بالله العظيم، وبوجهه الكريم، وسلطانه القديم، من الشيطان الرجيم. قال: فإذا قال ذلك قال الشيطان: عُصم منّي سائرَ اليوم»."]], "tr": [[2675.0, "Orası şeytandan korkulan bir yer olduğuna göre, mescide girdiğinde kovulmuş şeytandan Allah'a sığınman meşrudur."], [2685.0, "Bunun delili, İmam Ebû Dâvûd'un Sünen'inde sahih bir isnadla Abdullah b."], [2689.7, "Amr b. el-Âs radıyallâhu anhumâ'dan rivayet ettiği hadistir."], [2694.4, "Dedi ki: \"Peygamber sallallâhu aleyhi ve sellem mescide girdiğinde şöyle derdi:"], [2699.6, "Kovulmuş şeytandan, azîm olan Allah'a, O'nun kerîm vechine ve kadîm saltanatına sığınırım."], [2706.0, "(Peygamber) dedi ki: Bunu söylediğinde şeytan 'Bütün gün benden korundu' der.\""]]}]}, {"ts": "45:12", "title": "8. Külliye (devam): İstiâzenin meşru olduğu diğer yerler", "paras": [{"reader": false, "ar": [[2712.0, "ومنها كذلك: عند سماع نهيق الحمار أو نُباح الكلاب،"], [2717.3, "كما أمرنا بذلك النبيّ صلى الله عليه وسلم."], [2722.0, "وكذلك إذا نزل الإنسانُ منزلًا فيُستحبّ له أن يقول:"], [2725.7, "«أعوذ بكلمات الله التامّات من شرّ ما خلق»؛"], [2729.0, "فإنّ من قالها لم يضرّه شيءٌ حتى يرتحل عن منزله ذلك."]], "tr": [[2712.0, "Bunlardan biri de eşeğin anırmasını ya da köpeklerin havlamasını işitince (istiâze etmektir);"], [2717.9, "Peygamber sallallâhu aleyhi ve sellem bize bunu emretmiştir."], [2722.0, "Aynı şekilde insan bir yere konakladığında \"Yarattığı şeylerin şerrinden Allah'ın tam kelimelerine sığınırım\" demesi müstehaptır."], [2729.0, "Çünkü bunu söyleyene, o konaklama yerinden ayrılıncaya kadar hiçbir şey zarar vermez."]]}, {"reader": false, "ar": [[2733.0, "وعند إقبال المساء أو إدباره؛"], [2736.5, "فمتى ما عسعس الليلُ إقبالًا وإدبارًا فإنه يُشرع للإنسان أن يستعيذ بالله عز وجل،"], [2748.0, "كما قال النبيّ صلى الله عليه وسلم في حديث أبي بكر،"], [2753.0, "قال: علّمني رسولُ الله صلى الله عليه وسلم كلماتٍ أقولهنّ إذا أصبحتُ وإذا أمسيت:"], [2759.0, "«اللهمّ فاطرَ السماوات والأرض، عالمَ الغيب والشهادة، ربَّ كلّ شيءٍ ومليكَه، أشهد أن لا إله إلا أنت، أعوذ بك من شرّ نفسي، وشرّ الشيطان وشِرْكِه»،"], [2770.0, "قال: «قُلها إذا أصبحت، وإذا أمسيت، وإذا أخذتَ مضجعك». وبعضهم يقول: «وشَرَكِه»."]], "tr": [[2733.0, "Akşamın gelişinde ya da gidişinde de böyledir."], [2736.5, "Gece ne zaman gelerek ve giderek kararırsa, insanın Allah Azze ve Celle'ye sığınması meşrudur."], [2748.0, "Nitekim Peygamber sallallâhu aleyhi ve sellem Ebû Bekir'in hadisinde (bunu bildirmiştir)."], [2753.4, "(Ebû Bekir) dedi ki: Resûlullah sallallâhu aleyhi ve sellem bana sabahladığımda ve akşamladığımda söyleyeceğim kelimeler öğretti:"], [2759.0, "\"Allah'ım! Ey göklerin ve yerin yaratıcısı, gaybı ve şehâdeti bilen, her şeyin Rabbi ve sahibi!"], [2764.2, "Senden başka ilâh olmadığına şahitlik ederim."], [2765.7, "Nefsimin şerrinden, şeytanın şerrinden ve onun şirkinden Sana sığınırım.\" (Peygamber) dedi ki:"], [2770.7, "\"Bunu sabahladığında, akşamladığında ve yatağına girdiğinde söyle.\" Bazıları da \"ve onun tuzağından (şerekihî)\" der."]]}, {"reader": false, "ar": [[2778.0, "وكذلك عند الفزع من النوم،"], [2782.0, "كما قال النبيّ صلى الله عليه وسلم:"], [2785.0, "«إذا فزِع أحدُكم من النوم فليقل: أعوذ بكلمات الله التامّة من غضبه وشرّ عباده، ومن همزات الشياطين وأن يحضرون»."], [2794.0, "وكما أنه يُشرع للمسلم إذا خاف على أولاده أن يُعوِّذهم أيضًا،"], [2802.0, "كما كان النبيّ صلى الله عليه وسلم يُعوِّذ الحسنَ والحسين بقوله:"], [2806.0, "«أُعيذكما بكلمات الله التامّة من كلّ شيطانٍ وهامّة، ومن كلّ عينٍ لامّة»."], [2812.0, "والجامعُ في ذلك أنه يُشرع الاستعاذةُ عند كلّ أمرٍ مخوف."]], "tr": [[2778.0, "Uykudan korkuyla uyanınca da böyledir."], [2780.4, "Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2782.9, "\"Sizden biri uykudan korkuyla uyanırsa şöyle desin:"], [2785.0, "Allah'ın gazabından, kullarının şerrinden, şeytanların kışkırtmalarından ve onların yanımda bulunmalarından Allah'ın tam kelimelerine sığınırım.\" Aynı şekilde Müslüman çocukları için korktuğunda onlara da istiâze okuması (onları Allah'a sığındırması) meşrudur."], [2800.2, "Nitekim Peygamber sallallâhu aleyhi ve sellem Hasan'ı ve Hüseyin'i şu sözüyle Allah'a sığındırırdı:"], [2806.0, "\"Her şeytandan ve zehirli hayvandan ve her kem gözden sizi Allah'ın tam kelimelerine sığındırırım.\" Bunlarda ortak olan şudur:"], [2814.0, "Korkulan her şeyin yanında istiâze meşrudur."]]}]}, {"ts": "46:57", "title": "9. Külliye: Sadece Allah'ın gücü yettiği şeyde bir hazırdan ya da bir ölüden veya gâibden yardım isteyen büyük şirke düşmüştür", "paras": [{"reader": false, "ar": [[2817.0, "الكلّيّة التاسعة: <b>كلُّ من استعان بحاضرٍ<\/b> ـ كلُّ من استعان،"], [2824.0, "وهي بسيطةٌ إن شاء الله ـ بحاضرٍ فيما لا يقدر عليه إلا الله،"], [2829.0, "أو استعان بميّتٍ أو غائبٍ،"], [2832.0, "فقد وقع في الشرك الأكبر. جمعناها لكم في كلّيّةٍ واحدة:"], [2837.0, "كلُّ من استعان بحاضرٍ فيما لا يقدر عليه إلا الله ـ هنا فصّلنا ـ أو استعان بميّتٍ أو غائبٍ،"], [2847.5, "فقد وقع في الشرك الأكبر. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2817.0, "<b>9. külliye: Bir hazırdan<\/b> —yardım isteyen herkes;"], [2821.0, "bu inşallah basittir— <b>sadece Allah'ın gücü yettiği bir şeyde bir hazırdan yardım isteyen ya da bir ölüden veya gâibden yardım isteyen herkes büyük şirke düşmüştür.<\/b> Bunu sizin için tek bir külliyede topladık:"], [2837.0, "<b>Sadece Allah'ın gücü yettiği bir şeyde bir hazırdan yardım isteyen<\/b> —burada tafsilat yaptık— <b>ya da bir ölüden veya gâibden yardım isteyen herkes büyük şirke düşmüştür.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2862.0, "وهذه كلّيّةُ الاستعانة، والاستعانةُ طلبُ العون."], [2866.0, "ومن المعلوم أنّ الاستعانة إنما تكون بمن بيده تدبيرُ كلّ شيء،"], [2871.1, "وهو الله عز وجل؛"], [2873.0, "ولذلك نحن نقول في كلّ صلاة:"], [2876.6, "<span class=\"ayah\">﴿إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ﴾<\/span> <span class=\"ref\">[الفاتحة: ٥]<\/span>؛"], [2879.0, "فكما أننا لا نعبد إلا إيّاك فلا نستعين إلا بك."], [2884.0, "وقولُ الله عز وجل:"], [2885.8, "<span class=\"ayah\">﴿وَاللَّهُ الْمُسْتَعَانُ عَلَىٰ مَا تَصِفُونَ﴾<\/span> <span class=\"ref\">[يوسف: ١٨]<\/span>."], [2888.0, "وفي الحديث يقول النبيّ صلى الله عليه وسلم:"], [2892.0, "«وإذا استعنتَ فاستعن بالله»."], [2896.0, "وقال النبيّ صلى الله عليه وسلم:"], [2899.0, "«احرص على ما ينفعك، واستعن بالله، ولا تعجز»، الحديثَ بتمامه."]], "tr": [[2862.0, "Bu, istiâne külliyesidir. İstiâne, yardım istemektir."], [2866.0, "Bilindiği gibi istiâne ancak her şeyin tedbiri elinde olandan yapılır;"], [2868.8, "o da Allah Azze ve Celle'dir."], [2870.7, "Bu yüzden her namazda şöyle deriz:"], [2873.0, "<span class=\"ayah\">﴿Yalnız Sana ibadet ederiz ve yalnız Senden yardım dileriz﴾<\/span> [Fâtiha 5]."], [2879.0, "Yani nasıl ki Senden başkasına ibadet etmiyorsak, Senden başkasından da yardım istemeyiz."], [2884.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [2885.8, "<span class=\"ayah\">﴿Sizin anlattıklarınıza karşı yardımına sığınılacak olan Allah'tır﴾<\/span> [Yûsuf 18]."], [2888.5, "Hadiste Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [2892.0, "\"Yardım istediğinde Allah'tan yardım iste.\" Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2899.0, "\"Sana fayda verecek şeye karşı hırslı ol, Allah'tan yardım iste ve acze düşme.\" Hadisin tamamı (bilinmektedir)."]]}, {"reader": false, "ar": [[2906.0, "ومن جملة ما علّمه النبيُّ صلى الله عليه وسلم معاذًا أنه قال له:"], [2912.2, "«يا معاذ، لا تدَعنّ دُبُرَ كلّ صلاةٍ أن تقول: اللهمّ أعنّي على ذكرك، وشكرك، وحُسن عبادتك»."], [2922.0, "وقد قسّم علماءُ التوحيد الاستعانةَ إلى جُمَلٍ من الأقسام:"], [2927.0, "القسمُ الأوّل: الاستعانةُ بالله عز وجل المتضمّنةُ كمالَ الافتقار إليه تبارك وتعالى،"], [2936.0, "فإنّ هذه لُبُّ التوحيد،"], [2938.8, "والتي دلّت عليها الأدلّةُ الكثيرة."]], "tr": [[2906.0, "Peygamber sallallâhu aleyhi ve sellem'in Muâz'a öğrettiği şeylerden biri de ona şöyle demesidir:"], [2912.2, "\"Ey Muâz, her namazın arkasından şunu söylemeyi asla bırakma:"], [2915.6, "Allah'ım! Seni zikretmeye, Sana şükretmeye ve Sana güzelce ibadet etmeye bana yardım et.\" Tevhid âlimleri istiâneyi birkaç kısma ayırmışlardır."], [2927.0, "Birinci kısım: O'na —Tebâreke ve Teâlâ— tam bir muhtaçlığı içeren, Allah Azze ve Celle'den yardım istemek."], [2936.7, "Bu, tevhidin özüdür; birçok delil de buna delâlet etmiştir."]]}, {"reader": false, "ar": [[2943.0, "القسمُ الثاني: الاستعانةُ بالحيّ الحاضر فيما لا يقدر عليه إلا الله عز وجل،"], [2956.0, "فيما لا يقدر عليه إلا الله عز وجل؛"], [2960.0, "كالاستعانة بالأولياء الحاضرين في مغفرة الذنوب،"], [2969.0, "وسترِ العيوب، ودخولِ الجنة،"], [2972.0, "والنصرِ على الأعداء، والوقايةِ من جهنم،"], [2975.5, "وغيرِها من الأمور التي لا يقدر عليها إلا الله عز وجل."], [2981.0, "فهذه هي الاستعانةُ الشركيّة؛"], [2983.0, "فإذا استعان الإنسانُ بمخلوقٍ حاضرٍ في أمرٍ لا يقدر عليه إلا الله فإنه يُعتبر مشركًا الشركَ الأكبر."]], "tr": [[2943.0, "İkinci kısım: Sadece Allah Azze ve Celle'nin gücü yettiği bir şeyde, sadece Allah Azze ve Celle'nin gücü yettiği bir şeyde hazır olan diriden yardım istemek."], [2961.9, "Günahların bağışlanmasında, ayıpların örtülmesinde, cennete girmekte, düşmanlara karşı zaferde, cehennemden korunmada ve sadece Allah Azze ve Celle'nin gücü yettiği diğer işlerde hazır olan velîlerden yardım istemek gibi."], [2981.0, "İşte şirk olan istiâne budur."], [2983.0, "İnsan, sadece Allah'ın gücü yettiği bir işte hazır olan bir mahlûktan yardım isterse büyük şirkle müşrik sayılır."]]}, {"reader": false, "ar": [[2994.0, "القسمُ الثالث: الاستعانةُ بالغائبين؛"], [2996.8, "وهو يناديهم ويطلب منهم المدد والمعونة،"], [3003.0, "وبينه وبينهم مسافاتٌ شاسعة،"], [3005.7, "وليس ثَمّةَ وسيلةٌ حسّيّةٌ معلومةٌ يسمعون استعانتَه عن طريقها؛"], [3013.0, "فهذه شركٌ أكبر؛ لأنه لم يفعل ذلك إلا لاعتقاده أنّ لهم تصرُّفًا خفيًّا في الكون."]], "tr": [[2994.0, "Üçüncü kısım: Gâib olanlardan yardım istemek."], [2996.8, "Kişi onlara seslenir, onlardan medet ve yardım ister;"], [3003.0, "hâlbuki onunla onlar arasında geniş mesafeler vardır ve onların, onun yardım isteyişini işitmelerini sağlayacak bilinen hissî bir vasıta da yoktur."], [3014.6, "Bu büyük şirktir; çünkü o, bunu ancak onların kâinatta gizli bir tasarrufu olduğuna inandığı için yapmıştır."]]}, {"reader": false, "ar": [[3021.0, "الاستعانةُ الرابعة ـ أو الثالثة؟"], [3024.2, "الرابعة ـ: الاستعانةُ بالأموات؛ فيأتي إلى قبور الأولياء والصالحين فيستعين بهم،"], [3033.0, "ويطلب منهم المدد والغوثَ والرزقَ والنصر."], [3041.0, "وهذا من جملة الشرك الأكبر المُخرِج عن الملّة بالكلّيّة."]], "tr": [[3021.0, "Dördüncü istiâne —yoksa üçüncü mü?"], [3024.2, "Dördüncü—: Ölülerden yardım istemek. Kişi velîlerin ve sâlihlerin kabirlerine gelir, onlardan yardım ister;"], [3032.0, "onlardan medet, imdat, rızık ve zafer talep eder."], [3041.0, "Bu, kişiyi milletten tamamen çıkaran büyük şirk cümlesindendir."]]}, {"reader": false, "ar": [[3048.0, "الاستعانةُ الأخيرة: الاستعانةُ بالحيّ الحاضر في الأمر المقدور عليه،"], [3055.0, "وهذه تُعتبر وسيلةً تختلف باختلاف الأمر المستعان فيه:"], [3060.0, "فإن كنتَ استعنتَ بغيرك في أمرٍ جائزٍ لا بأس به فاستعانةٌ جائزة،"], [3065.0, "وإن كانت في أمرٍ واجبٍ فتكون واجبة،"], [3069.0, "وإن كانت في أمرٍ مندوبٍ فتكون مندوبة،"], [3072.0, "وإن كانت في أمرٍ محرّمٍ فتكون محرّمة؛"], [3075.0, "لأنّ المتقرِّر في القواعد أنّ الوسائل لها أحكامُ المقاصد."], [3079.0, "وتدخل في قول الله عز وجل:"], [3081.0, "<span class=\"ayah\">﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٢]<\/span>."]], "tr": [[3048.0, "Son istiâne: Güç yetirilebilen bir işte hazır olan diriden yardım istemek."], [3053.7, "Bu bir vesile sayılır; hükmü, yardım istenen işin farklılığına göre değişir."], [3060.0, "Eğer başkasından caiz, sakıncasız bir işte yardım istediysen bu caiz bir istiânedir;"], [3067.3, "vacip bir işte olursa vacip olur;"], [3071.1, "mendup bir işte olursa mendup olur;"], [3075.0, "haram bir işte olursa haram olur."], [3076.8, "Çünkü kaidelerde yerleşik olan şudur:"], [3079.0, "Vesileler, maksatların hükmünü alır. Bu da Allah Azze ve Celle'nin şu sözüne girer:"], [3081.0, "<span class=\"ayah\">﴿İyilik ve takva üzerinde yardımlaşın; günah ve düşmanlık üzerinde yardımlaşmayın﴾<\/span> [Mâide 2]."]]}]}, {"ts": "51:29", "title": "10. Külliye: Sebebiyeti gizli olan ve korkulana tazimin eşlik ettiği, Allah'tan başkasından duyulan her korku büyük şirktir", "paras": [{"reader": false, "ar": [[3089.0, "ومن الكلّيّات أيضًا ـ وهي الأخيرة ـ:"], [3091.0, "كلُّ خوفٍ من غير الله سببيّتُه خفيّة،"], [3095.7, "صاحَبَه تعظيمٌ للمخوف منه،"], [3098.4, "فشركٌ أكبر. كلُّ خوفٍ من غير الله عز وجل سببيّتُه خفيّة ـ هذا أوّلُ شيء ـ صاحَبَه تعظيمٌ للمخوف منه،"], [3113.7, "فشركٌ أكبر. كلُّ خوفٍ من غير الله عز وجل سببيّتُه خفيّة،"], [3120.4, "صاحَبَه تعظيمٌ للمخوف منه، فشركٌ أكبر."]], "tr": [[3089.0, "Külliyelerden biri de —ve bu sonuncusudur— şudur:"], [3091.0, "<b>10. külliye: Sebebiyeti gizli olan ve kendisine, korkulan şeye karşı bir tazimin eşlik ettiği, Allah'tan başkasından duyulan her korku büyük şirktir.<\/b> Sebebiyeti gizli olan —bu birinci şey— ve kendisine korkulana karşı tazimin eşlik ettiği, Allah Azze ve Celle'den başkasından duyulan her korku büyük şirktir."], [3115.0, "<b>10. külliye: Sebebiyeti gizli olan ve kendisine korkulana karşı tazimin eşlik ettiği, Allah Azze ve Celle'den başkasından duyulan her korku büyük şirktir.<\/b>"]]}, {"reader": false, "ar": [[3126.0, "أقول وبالله التوفيق: وهذا الذي يُعبِّر عنه علماءُ الاعتقاد بقولهم:"], [3131.0, "«خوفُ السرّ»؛ أي خوفٌ سببيّتُه خفيّةٌ غيرُ مُدرَكةٍ بالحواسّ؛"], [3138.0, "فليس ثَمّةَ سببيّةٌ ظاهرةٌ سوف يصل إليك الأمرُ المخوف منه ممّن خفتَه،"], [3146.0, "ومع خفاء سببيّته فإنّ قلبك قد عُمِر بتعظيم من تخاف منه."], [3155.0, "فهذا الخوف هو خوفُ السرّ،"], [3158.5, "الموجبُ للخروج من الملّة بالكلّيّة."]], "tr": [[3126.0, "Tevfik Allah'tandır, derim ki: Bu, akîde âlimlerinin \"gizli korku\" (havfü's-sır) sözüyle ifade ettikleri şeydir;"], [3131.0, "yani sebebiyeti gizli olan, duyularla idrak edilemeyen bir korku."], [3138.0, "Korktuğun kimseden korkulan şeyin sana ulaşacağı zâhir bir sebebiyet yoktur;"], [3146.0, "sebebiyetinin gizli olmasına rağmen kalbin, korktuğun kimseye tazimle dolmuştur."], [3155.0, "İşte bu korku, kişinin milletten tamamen çıkmasını gerektiren gizli korkudur."]]}, {"reader": false, "ar": [[3162.0, "فمتى ما خاف العبدُ من غير الله عز وجل أن يُصيبه بمكروهٍ بمشيئة هذا العبد وقدرته فهذا شركٌ أكبر؛"], [3175.0, "لأنه نابعٌ عن اعتقاد النفع والضرّ الاستقلاليّ في غير الله عز وجل."], [3180.0, "وعلى ذلك قولُه عز وجل:"], [3183.3, "<span class=\"ayah\">﴿فَلَا تَخْشَوُا النَّاسَ وَاخْشَوْنِ﴾<\/span> <span class=\"ref\">[المائدة: ٤٤]<\/span>،"], [3186.0, "وقولُ الله عز وجل:"], [3188.7, "<span class=\"ayah\">﴿فَإِيَّايَ فَارْهَبُونِ﴾<\/span> <span class=\"ref\">[النحل: ٥١]<\/span> ـ والرهبةُ هي الخوف ـ وقال الله عز وجل:"], [3194.8, "<span class=\"ayah\">﴿فَلَا تَخَافُوهُمْ وَخَافُونِ إِن كُنتُم مُّؤْمِنِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ١٧٥]<\/span>."]], "tr": [[3162.0, "Kul, Allah Azze ve Celle'den başkasının, o kulun (o varlığın) meşîeti ve kudretiyle kendisine bir kötülük isabet ettirmesinden ne zaman korkarsa, bu büyük şirktir."], [3175.0, "Çünkü o, Allah Azze ve Celle'den başkasında müstakil fayda ve zarar (gücü) olduğu inancından kaynaklanır."], [3180.0, "Allah Azze ve Celle'nin şu sözü buna dayanır:"], [3183.3, "<span class=\"ayah\">﴿İnsanlardan korkmayın, Benden korkun﴾<\/span> [Mâide 44]."], [3185.3, "Allah Azze ve Celle'nin şu sözü de:"], [3188.7, "<span class=\"ayah\">﴿Yalnız Benden korkun﴾<\/span> [Nahl 51] —rehbet korku demektir—."], [3192.0, "Allah Azze ve Celle şöyle buyurdu:"], [3194.8, "<span class=\"ayah\">﴿Eğer mü'minler iseniz onlardan korkmayın, Benden korkun﴾<\/span> [Âl-i İmrân 175]."]]}, {"reader": false, "ar": [[3199.0, "وهو المسمّى بخوف العبادة؛"], [3203.0, "وهو الخوف الذي يكون معه تعظيمٌ وإجلالٌ وخشيةٌ ورجاءٌ للمخوف منه."], [3213.0, "هذا هو خوفُ العبادة،"], [3215.5, "وهو المسمّى بخوف السرّ."], [3218.0, "وتلاحظ أنّ هذا الخوف مبنيٌّ على ركنين ليكون شركًا أكبر:"], [3224.0, "أوّلًا: أنه يكون مبنيًّا على أمرٍ سببيّتُه خفيّة."], [3231.0, "الأمرُ الثاني: أن يكون قد قام في قلب الخائف من المخوف منه تعظيمٌ ورجاءٌ وخشيةٌ وإجلال."]], "tr": [[3199.0, "Buna ibadet korkusu denir. O, korkulana karşı tazim, hürmet, haşyet ve ümidin eşlik ettiği korkudur."], [3213.0, "İbadet korkusu budur ve buna gizli korku denir."], [3218.0, "Görüyorsun ki bu korkunun büyük şirk olması için iki rükün üzerine kurulması gerekir."], [3224.0, "Birincisi: Sebebiyeti gizli olan bir şey üzerine kurulu olması."], [3231.0, "İkinci şey: Korkanın kalbinde korkulana karşı tazim, ümit, haşyet ve hürmetin yer etmiş olması."]]}, {"reader": false, "ar": [[3242.0, "كأن يخاف منه أن يقطع رزقَه بلا سببيّةٍ ظاهرة،"], [3249.0, "أو يخاف أن يُمرضه بلا سببيّةٍ ظاهرة،"], [3254.0, "أو يخاف أن يُسلِّط عليه أعداءه بلا سببيّةٍ ظاهرة،"], [3261.0, "أو يحرمَه من دخول الجنة إذا لم يُقدِّم له هذا الأمر،"], [3266.0, "أو أن يُدخله النارَ إذا لم يُقدِّم له هذا الشيء،"], [3272.0, "ويكون مع خوفه إجلالٌ وتعظيمٌ وخشيةٌ ورجاءٌ له."], [3275.0, "فهذا الخوفُ هو الذي تكون أسبابُه خفيّة؛"], [3281.0, "فهو لا يخاف لأنّ أمامه سببًا يُخاف منه،"], [3285.0, "بل يخاف لأنه يعتقد أنّ لهذا المخوف منه تدبيرًا خفيًّا،"], [3290.6, "وقدرةً قويّة، وسِرًّا يستطيع به أن يغفر ذنبه،"], [3298.0, "أو يُسلِّط عليه عدوّه،"], [3300.0, "أو يقطع عليه رزقه،"], [3302.0, "أو يُميت أولاده، أو يحرمه من دخول الجنة، والعياذُ بالله."]], "tr": [[3242.0, "Zâhir bir sebebiyet olmaksızın rızkını kesmesinden korkması, zâhir bir sebebiyet olmaksızın onu hasta etmesinden korkması, zâhir bir sebebiyet olmaksızın düşmanlarını ona musallat etmesinden korkması, ya da ona şu şeyi sunmazsa onu cennete girmekten mahrum etmesinden veya ona bu şeyi sunmazsa onu cehenneme sokmasından korkması ve korkusuyla birlikte ona karşı hürmet, tazim, haşyet ve ümit taşıması gibi."], [3275.0, "İşte sebepleri gizli olan korku budur."], [3281.0, "O, önünde kendisinden korkulan bir sebep bulunduğu için korkmaz;"], [3285.0, "aksine bu korkulan varlığın gizli bir tedbiri, güçlü bir kudreti ve bir sırrı olduğuna inandığı için korkar;"], [3297.2, "onunla günahını bağışlayabileceğine, düşmanını ona musallat edebileceğine, rızkını kesebileceğine, çocuklarını öldürebileceğine ya da onu cennete girmekten mahrum edebileceğine (inanır). Allah'a sığınırız."]]}, {"reader": false, "ar": [[3307.0, "كما كان قومُ عادٍ يخافون من آلهتهم،"], [3311.0, "في قول الله عز وجل:"], [3313.0, "<span class=\"ayah\">﴿إِن نَّقُولُ إِلَّا اعْتَرَاكَ بَعْضُ آلِهَتِنَا بِسُوءٍ﴾<\/span> <span class=\"ref\">[هود: ٥٤]<\/span>."], [3318.0, "فإذا خفتَ من المخلوق بهذا النوع من الخوف،"], [3323.0, "أو خفتَ من الجنّ بهذا النوع من الخوف،"], [3327.0, "أو خفتَ من الملائكة بهذا النوع من الخوف،"], [3331.0, "أو خفتَ من الأولياء والصالحين بهذا النوع من الخوف،"], [3336.0, "أو خفتَ من الأموات والقبور وغيرهم من المخلوقات بهذا النوع من الخوف،"], [3344.0, "فلا جرمَ أنّ هذا ـ والله ـ من أعظم الشرك الأكبر."], [3348.0, "وكذلك الخوفُ من الجمادات والأموات وغيرهم؛"], [3354.0, "كلُّ ذلك من الخوف الذي يُسمّيه العلماءُ بخوف السرّ."], [3358.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[3307.0, "Âd kavminin ilâhlarından korkması gibi;"], [3309.9, "Allah Azze ve Celle'nin şu sözünde:"], [3313.0, "<span class=\"ayah\">﴿Biz ancak, ilâhlarımızdan birinin seni kötü bir şeye çarptırdığını söylüyoruz﴾<\/span> [Hûd 54]."], [3318.0, "Mahlûktan bu tür bir korkuyla korkarsan, cinlerden bu tür bir korkuyla korkarsan, meleklerden bu tür bir korkuyla korkarsan, velîlerden ve sâlihlerden bu tür bir korkuyla korkarsan ya da ölülerden, kabirlerden ve diğer mahlûkattan bu tür bir korkuyla korkarsan, şüphesiz bu —vallahi— büyük şirkin en büyüklerindendir."], [3344.0, "Cansız varlıklardan, ölülerden ve diğerlerinden korkmak da böyledir."], [3348.0, "Bunların hepsi, âlimlerin gizli korku diye adlandırdığı korkudandır."], [3354.0, "Allah en yüce olan ve en iyi bilendir."], [3358.0, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}, {"reader": false, "ar": [[3361.0, "اكتبوها بس: <b>كلُّ من خاف من غير الله في أمرٍ جِبِلّيٍّ طبعيٍّ أسبابُه ظاهرة فجائز.<\/b> والله أعلم."]], "tr": [[3361.0, "Sadece şunu yazın: 11. külliye:"], [3362.1, "Sebepleri zâhir olan, yaratılıştan gelen tabiî bir işte Allah'tan başkasından korkan herkes(in korkusu) caizdir. Allah en iyisini bilir."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
