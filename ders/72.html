 في «كتاب التوحيد» إنما يذكر الترجمة،"], [2845.9, "ويشرح الترجمة بآيةٍ أو حديث."], [2849.0, "وكذلك ابن تيميّة في بداية «العقيدة الواسطيّة»؛"], [2854.0, "فإنه يذكر الآيات التي تدلّ على الوجه،"], [2858.0, "ولا يقول: أهل السنة يُثبتون لله وجهًا،"], [2861.0, "ويذكر الآيات التي تدلّ على صفة اليدين،"], [2865.0, "ولا يقول بأنّ لله يدين ذاتيّتين،"], [2868.0, "ويذكر الآيات التي تدلّ على غيرها من الصفات بنصوصها الواردة في الكتاب والسنة،"], [2874.5, "من غير أن يتعرّض لها بأيّ كلمةٍ من عنده."], [2879.0, "وهذا من الرسوخ العلميّ،"], [2881.0, "هذا من الرسوخ العلميّ."]], "tr": [[2833.0, "Bu yüzden Kitâbü't-Tevhîd ve el-Akîdetü'l-Vâsıtiyye bu iki özellikle temayüz etmiştir."], [2840.0, "Şeyh Muhammed b. Abdilvehhâb Kitâbü't-Tevhîd'de sadece bab başlığını (terceme) zikreder ve başlığı bir ayet veya hadisle açıklar."], [2849.0, "İbn Teymiyye de el-Akîdetü'l-Vâsıtiyye'nin başında böyledir:"], [2854.0, "Vech (yüz) sıfatına delâlet eden ayetleri zikreder, \"Ehl-i Sünnet Allah için bir vech isbat eder\" demez;"], [2858.9, "iki el sıfatına delâlet eden ayetleri zikreder, \"Allah'ın iki zâtî eli vardır\" demez;"], [2866.5, "diğer sıfatlara delâlet eden ayetleri de Kitap ve Sünnet'te gelen nas lafızlarıyla zikreder, kendinden tek bir kelimeyle onlara müdahale etmez."], [2879.0, "Bu ilmî rusûhtandır, bu ilmî rusûhtandır."]]}, {"reader": false, "ar": [[2885.0, "وقد جرى على ذلك أئمّةُ الحديث:"], [2888.0, "فهذا الإمام البخاريّ يعبّر عن المعنى الشرعيّ في ترجمته بآيةٍ أو حديث،"], [2894.0, "وهذا الإمام مسلمٌ رحمه الله إنما يذكر في صحيحه آيةً أو حديثًا،"], [2901.0, "وهذا الإمام أبو داود وغيرُهم ممّن ألّف في الحديث،"], [2905.0, "إنما يترجمون بترجمةٍ أو يبوّبون ببابٍ من عندهم،"], [2911.0, "ثم يشرحونه بماذا؟ بألفاظ النصوص،"], [2915.0, "من غير أن يتكلّم أحدٌ منهم بشيءٍ يخصّه."], [2919.0, "وهذا من أعظم ما يوصف به العالمُ أنه راسخ."]], "tr": [[2885.0, "Hadis imamları da bu yol üzere gitmiştir:"], [2888.0, "İşte İmam Buhârî, bab başlığında şer'î manayı bir ayet veya hadisle ifade eder."], [2895.8, "İşte İmam Müslim —Allah ona rahmet etsin— Sahîh'inde sadece bir ayet veya hadis zikreder."], [2904.2, "İşte İmam Ebû Dâvûd ve hadis alanında eser telif eden diğerleri;"], [2914.0, "kendilerinden bir başlık koyar veya bir bab açarlar, sonra onu neyle açıklarlar?"], [2919.0, "Nasların lafızlarıyla; içlerinden hiçbiri kendine ait bir şey söylemez."], [2921.7, "Bu, âlimin \"râsih\" olarak vasıflandırılmasını sağlayan en büyük şeylerdendir."]]}, {"reader": false, "ar": [[2925.0, "أسأل الله أن يوفّقنا وإيّاكم لكلّ خير،"], [2930.0, "ولعلّ ذلك كافٍ إن شاء الله،"], [2931.3, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[2925.0, "Allah'tan bizi ve sizi her hayra muvaffak kılmasını dilerim."], [2930.0, "İnşallah bu kadarı yeterlidir. Allah daha yüce ve daha iyi bilendir."], [2932.0, "Allah Peygamberimiz Muhammed'e salât ve selâm etsin."]]}, {"reader": false, "ar": [[2935.0, "اكتبوا رأسَ القاعدة: <b>كلُّ صفات الله مقرونةٌ باسمه السلام.<\/b> وهذه شرحُها مفيدٌ جدًّا جدًّا،"], [2942.0, "لكن أتركها ـ لأهمّيّتها ـ للدرس القادم إن شاء الله."], [2946.0, "<b>كلُّ صفات الله تعالى مقرونةٌ باسمه السلام.<\/b> والله أعلم."]], "tr": [[2935.0, "Kaidenin başlığını yazın: 7. külliye:"], [2936.0, "Allah'ın bütün sıfatları O'nun es-Selâm ismiyle birliktedir. Bunun şerhi çok çok faydalıdır;"], [2941.4, "fakat önemi sebebiyle onu inşallah bir sonraki derse bırakıyorum."], [2946.0, "<b>7. külliye: Allah Teâlâ'nın bütün sıfatları O'nun es-Selâm ismiyle birliktedir.<\/b> Allah en iyisini bilir."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
