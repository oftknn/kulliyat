<script>
const D={"no": 72, "vid": "JS2pGw4AKlA", "title_ar": "الدرس (٧٢) من شرح كليات العقيدة — كليات في باب الصفات: عبودية الصفات، وموافقتها للفطرة والعقل، والإشارة عند ذكر الصفات، ومتعلقات الصفة، والتعبير بألفاظ النصوص", "title_tr": "Şerhu Külliyyâti'l-Akîde — 72. Ders: Sıfatlar Babının Külliyeleri (Her Sıfatın Kendine Has Ubûdiyyeti, Sıfatların Selim Fıtrata ve Akla Uygunluğu, Sıfatları Anarken İşaret Etmek, Nassın İsbat Etmediği Taalluklarda Tevakkuf, Nasların Lafızlarının Yerine Başka İfade Koymamak)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Allah'ın sıfatlarından her sıfatın kendine has bir ubûdiyyeti vardır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.4, "والصلاةُ والسلامُ على رسول الله الأمين،"], [6.0, "وعلى آله وأصحابه الطيبين الطاهرين،"], [9.0, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [12.6, "أما بعد: اللهمّ علِّمنا ما ينفعنا،"], [16.2, "وانفعنا بما علّمتنا، وارزقنا الإخلاصَ في التعليم والعمل."], [21.0, "لا نزال في سياق كلّيّات صفات الله عز وجل،"], [26.0, "وعندنا في هذا اليوم جُمَلٌ من الكلّيّات."], [30.0, "الكلّيّة الأولى: <b>كلُّ صفةٍ من صفات الله تعالى فلها عبوديّةٌ خاصّة.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [45.5, "<b>كلُّ صفةٍ من صفات الله تعالى فلها عبوديّةٌ خاصّة.<\/b>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.8, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.6, "Bundan sonra: Allah'ım! Bize faydalı olanı öğret, bize öğrettiklerinle bizi faydalandır, öğretimde ve amelde bize ihlâs nasip et."], [21.0, "Hâlâ Allah Azze ve Celle'nin sıfatlarının külliyeleri bağlamındayız;"], [26.0, "bugün elimizde birtakım külliyeler var."], [30.0, "<b>1. külliye: Allah Teâlâ'nın sıfatlarından her sıfatın kendine has bir ubûdiyyeti (kulluğu) vardır.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [45.5, "<b>1. külliye: Allah Teâlâ'nın sıfatlarından her sıfatın kendine has bir ubûdiyyeti vardır.<\/b>"]]}, {"reader": false, "ar": [[50.0, "أقول وبالله التوفيق: كما ذكرنا في أسماء الله عز وجل أنّ لكلّ اسمٍ من أسماء الله عز وجل عبوديّةً خاصّةً ينبغي للقلب أن يلتفت لها،"], [60.6, "وأن يتعبّد لله عز وجل بها،"], [63.0, "فكذلك أيضًا صفاته عز وجل،"], [66.1, "سواءٌ أكانت من الصفات التي تضمّنتها أسماؤه أو من الصفات الأخرى؛"], [73.0, "فإنّ لكلّ صفةٍ من صفات الله عز وجل عبوديّةً خاصّةً ينبغي أن ينتبه القلبُ لها،"], [79.4, "وأن تتعبّد لله عز وجل بها."], [82.0, "وهذه الكلّيّة تدلّك على أنّ المقصود الأعظم في صفات الله عز وجل ليس هو مجرّدَ الإيمان بها نظريًّا،"], [91.0, "وإنما المقصود الأعظم هو أن تتعبّد لله عز وجل في أرضه بمقتضيات أسمائه وصفاته."]], "tr": [[50.0, "Tevfik Allah'tandır, derim ki: Allah Azze ve Celle'nin isimleri hakkında, Allah Azze ve Celle'nin isimlerinden her ismin kalbin yönelmesi ve onunla Allah Azze ve Celle'ye kulluk etmesi gereken kendine has bir ubûdiyyeti olduğunu zikrettiğimiz gibi, O'nun sıfatları da —ister isimlerinin içerdiği sıfatlardan olsun ister diğer sıfatlardan— aynı şekildedir."], [73.0, "Allah Azze ve Celle'nin sıfatlarından her sıfatın, kalbin ona dikkat etmesi ve senin onunla Allah Azze ve Celle'ye kulluk etmen gereken kendine has bir ubûdiyyeti vardır."], [82.0, "Bu külliye sana gösterir ki Allah Azze ve Celle'nin sıfatlarındaki en büyük maksat, onlara sadece nazarî olarak iman etmek değildir;"], [91.0, "en büyük maksat, O'nun yeryüzünde, isim ve sıfatlarının gerektirdikleriyle Allah Azze ve Celle'ye kulluk etmendir."]]}, {"reader": false, "ar": [[98.0, "وهذا من أعظم الأدلّة الدالّة على إيمان القلوب بهذه الصفة الإيمانَ الكامل."], [107.0, "فإنّ من الناس من يكون مؤمنًا بأنّ الله عز وجل موصوفٌ بكذا وكذا،"], [114.0, "ولكن لا تجد شيئًا من التطبيقات على جوارحه،"], [119.0, "وهذا دليلٌ على ضعف بصيرة القلب في مقتضيات هذه الصفة."], [127.0, "وبناءً على ذلك: فعلمُ الله عز وجل من صفاته،"], [132.0, "وهذا يُثمر لنا ألّا نكون في المكان الذي يُغضبه،"], [139.0, "ولا أن نتصرّف التصرّفَ الذي يُغضبه،"], [142.0, "ولا أن نقول القولَ الذي يُغضبه،"], [144.0, "وأن نعلم أنّنا وإن اختفينا عن أعين الناس فإنّ الله عز وجل مطّلعٌ علينا."]], "tr": [[98.0, "Bu, kalplerin bu sıfata kâmil bir imanla iman ettiğini gösteren en büyük delillerdendir."], [107.0, "Çünkü insanlardan öyleleri vardır ki Allah Azze ve Celle'nin şöyle şöyle vasıflandığına iman eder;"], [114.0, "fakat onun azalarında bunun hiçbir uygulamasını göremezsin."], [118.4, "Bu da kalbin, bu sıfatın gerektirdikleri hususunda basiretinin zayıf olduğunun delilidir."], [127.0, "Buna göre: Allah Azze ve Celle'nin ilmi O'nun sıfatlarındandır."], [128.7, "Bu (sıfat) bize şu meyveyi verir:"], [132.7, "O'nu gazaplandıran yerde bulunmayız, O'nu gazaplandıran şekilde davranmayız, O'nu gazaplandıran sözü söylemeyiz ve insanların gözlerinden gizlensek bile Allah Azze ve Celle'nin bize muttali olduğunu biliriz."]]}, {"reader": false, "ar": [[151.0, "وكذلك أيضًا من صفاته:"], [153.9, "الخلقُ والرزقُ والإحياءُ والإماتة،"], [157.0, "وهذا كلُّه ممّا يُثمر للقلب التوكّلَ عليه عز وجل باطنًا وظاهرًا،"], [164.0, "والاعتمادَ عليه في كلّ الأمور،"], [167.7, "صغيرِها وكبيرِها. وإذا آمنتَ بأنّ الله قديرٌ ذو قدرةٍ كاملة،"], [176.0, "وأنّ الله قويٌّ ذو قوّةٍ كاملة،"], [178.0, "فحينئذٍ تصغُر عندك الموانعُ والعقبات التي تعترض طريقك في تحصيل شيءٍ من مصالح دينك أو دنياك؛"], [187.0, "لأنك تعلم أنّ هذا الربَّ العظيم قادرٌ على أن يتجاوز بك كلَّ هذه المتاعب والمصاعب والعقبات،"], [198.0, "فإنّ قدرته وقوّته عز وجل لا تفتقر إلى أسباب."]], "tr": [[151.0, "Aynı şekilde yaratmak, rızık vermek, diriltmek ve öldürmek de O'nun sıfatlarındandır."], [157.0, "Bunların hepsi kalbe, içte ve dışta O'na Azze ve Celle tevekkülü ve küçük büyük bütün işlerde O'na dayanmayı meyve olarak verir."], [170.0, "Allah'ın kâmil bir kudret sahibi olan Kadîr olduğuna, Allah'ın kâmil bir kuvvet sahibi olan Kaviyy olduğuna iman ettiğinde, dininin veya dünyanın maslahatlarından bir şeyi elde etme yolunda önüne çıkan engeller ve zorluklar gözünde küçülür."], [187.0, "Çünkü bu azîm Rabb'in seni bütün bu sıkıntıların, güçlüklerin ve engellerin ötesine geçirmeye kâdir olduğunu bilirsin;"], [195.6, "zira O'nun Azze ve Celle kudreti ve kuvveti sebeplere muhtaç değildir."]]}, {"reader": false, "ar": [[202.0, "ومن أجمل ما يُذكر هنا:"], [205.5, "ما أخرجه الإمام الترمذيّ في جامعه،"], [210.0, "وأبو داود في سننه،"], [211.8, "بإسنادٍ صحيحٍ لغيره، من حديث عليّ بن أبي طالب رضي الله عنه:"], [217.0, "أنه أُتي بدابّةٍ ليركبها،"], [221.0, "فلمّا وضع رجله على الرِّكاب قال:"], [223.0, "«بسم الله»، فلمّا استوى على ظهرها قال:"], [225.3, "«الحمد لله»، ثم قال:"], [226.8, "<span class=\"ayah\">﴿سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ ۝ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنقَلِبُونَ﴾<\/span> <span class=\"ref\">[الزخرف: ١٣–١٤]<\/span>،"], [232.0, "ثم قال: «الحمد لله» ثلاثًا،"], [233.8, "و«الله أكبر» ثلاثًا،"], [235.0, "ثم قال ـ وهو الشاهد ـ:"], [236.1, "«اللهمّ سبحانك، إنّي ظلمتُ نفسي فاغفر لي، إنّه لا يغفر الذنوبَ إلا أنت»."], [242.0, "فتوسّل إلى الله عز وجل في مغفرة ذنوبه بصفةٍ من صفاته."]], "tr": [[202.0, "Burada zikredilecek en güzel şeylerden biri, İmam Tirmizî'nin el-Câmi'inde ve Ebû Dâvûd'un Sünen'inde, Ali b."], [211.3, "Ebî Tâlib'in —Allah ondan razı olsun— hadisinden \"sahîh li-gayrihî\" bir isnadla rivayet ettikleridir:"], [217.0, "Ona binmesi için bir binek getirildi."], [221.3, "Ayağını üzengiye koyunca \"Bismillâh\" dedi;"], [223.0, "sırtına yerleşince \"Elhamdülillâh\" dedi. Sonra <span class=\"ayah\">﴿Bunu bizim hizmetimize veren (Allah) her türlü noksandan uzaktır; yoksa biz buna güç yetiremezdik. Şüphesiz biz Rabbimize döneceğiz﴾<\/span> [Zuhruf 13–14] dedi."], [232.8, "Sonra üç kez \"Elhamdülillâh\", üç kez \"Allâhu ekber\" dedi."], [234.6, "Sonra —delil olan kısım budur— \"Allah'ım!"], [236.1, "Sen her türlü noksandan uzaksın;"], [237.7, "ben nefsime zulmettim, beni bağışla;"], [239.5, "çünkü günahları ancak Sen bağışlarsın\" dedi."], [242.0, "Böylece günahlarının bağışlanması için Allah Azze ve Celle'ye O'nun sıfatlarından bir sıfatla tevessül etti."]]}, {"reader": false, "ar": [[247.0, "قال: ثم ضحك. فقلنا:"], [248.5, "من أيّ شيءٍ تضحك يا أمير المؤمنين؟"], [252.0, "قال: صنع رسولُ الله صلى الله عليه وسلم كما صنعتُ،"], [257.0, "ثم ضحك، فقلنا: من أيّ شيءٍ تضحك يا رسول الله؟"], [262.0, "فقال: «إنّ ربّك ليعجبُ من عبده إذا قال: ربِّ اغفر لي ذنوبي، يعلم أنه لا يغفر الذنوبَ غيرُه»."], [269.0, "فلمّا تعبّد العبدُ بمقتضى صفةٍ من صفات الله عز وجل ـ وهي مغفرته لذنوب عباده ـ أعجب ذلك اللهَ تبارك وتعالى."]], "tr": [[247.0, "(Râvi) dedi ki: Sonra güldü."], [249.0, "\"Ey Mü'minlerin Emîri, neye gülüyorsun?\" dedik."], [252.0, "Dedi ki: Resûlullah sallallâhu aleyhi ve sellem de benim yaptığım gibi yaptı, sonra güldü."], [258.5, "Biz de \"Ey Allah'ın Resûlü, neye gülüyorsun?\" dedik."], [262.0, "Buyurdu ki: \"Şüphesiz Rabbin, kulu 'Rabbim, günahlarımı bağışla' dediğinde, günahları O'ndan başkasının bağışlamadığını bildiği için ondan hoşnut olup taaccüp eder.\" Kul, Allah Azze ve Celle'nin sıfatlarından birinin —ki o, kullarının günahlarını bağışlamasıdır— gereğiyle kulluk edince, bu, Allah Tebâreke ve Teâlâ'nın hoşuna gitti."]]}, {"reader": false, "ar": [[282.0, "وأخرج الإمام الترمذيّ في جامعه أيضًا،"], [284.7, "بإسنادٍ صحيحٍ لغيره، من حديث عقبة بن عامر رضي الله عنه قال:"], [290.3, "قال النبيّ صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل:"], [294.0, "«من علم أنّي ذو مغفرةٍ للذنوب غفرتُ له ذنوبه ولا أُبالي، ما لم يأتِ بشرك» ـ أو قال:"], [303.7, "«ما لم يقع في شرك» ـ أو كما قال صلى الله عليه وسلم."], [308.0, "فالله عز وجل يحبّ من عباده أن يتعبّدوا بمقتضيات صفاته تبارك وتعالى."]], "tr": [[282.0, "İmam Tirmizî yine el-Câmi'inde, \"sahîh li-gayrihî\" bir isnadla, Ukbe b."], [286.5, "Âmir'in —Allah ondan razı olsun— hadisinden rivayet etmiştir;"], [290.3, "dedi ki: Peygamber sallallâhu aleyhi ve sellem, Rabbi Azze ve Celle'den rivayet ettiği (hadiste) buyurdu ki:"], [294.0, "\"Kim benim günahları bağışlama sahibi olduğumu bilirse, şirk getirmedikçe —veya 'şirke düşmedikçe' buyurdu— onun günahlarını bağışlarım ve aldırmam.\" Yahut sallallâhu aleyhi ve sellem'in buyurduğu gibi."], [308.0, "Demek ki Allah Azze ve Celle, kullarının O'nun Tebâreke ve Teâlâ sıfatlarının gerektirdikleriyle kulluk etmelerini sever."]]}]}, {"ts": "05:03", "title": "1. Külliye (devam): Mağfiret sıfatıyla taabbüd; sıfatların kalpteki meyveleri", "paras": [{"reader": false, "ar": [[314.0, "وفي الصحيحين من حديث أبي هريرة رضي الله عنه قال:"], [317.4, "قال النبيّ صلى الله عليه وسلم:"], [319.8, "«أذنب عبدٌ ذنبًا فقال: اللهمّ أذنبتُ فاغفر لي، فقال الله عز وجل له: أعلِمَ عبدي أنّ له ربًّا يغفر الذنبَ ويأخذ به؟» ـ وهذه صفتُه ـ «قد غفرتُ لعبدي. ثم مكث ما شاء الله، ثم أذنب ذنبًا فقال: أيْ ربِّ أذنبتُ فاغفر لي، فقال: أعلِمَ عبدي أنّ له ربًّا يغفر الذنبَ ويأخذ به؟ قد غفرتُ لعبدي. ثم مكث ما شاء الله أن يمكث، ثم أذنب ذنبًا فقال: اللهمّ أذنبتُ فاغفر لي، فقال له ربُّه: أعلِمَ عبدي أنّ له ربًّا يغفر الذنبَ ويأخذ به؟ قد غفرتُ لعبدي، فليعملْ ما شاء»."]], "tr": [[314.0, "Sahîhayn'de Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde (şöyle geçer);"], [315.0, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [316.0, "\"Bir kul bir günah işledi ve 'Allah'ım, günah işledim, beni bağışla' dedi."], [317.4, "Allah Azze ve Celle ona:"], [318.0, "'Kulum, günahı bağışlayan ve onunla hesaba çeken bir Rabbi olduğunu bildi mi?' dedi\" —bu O'nun sıfatıdır— \"'Kulumu bağışladım.' Sonra Allah'ın dilediği kadar kaldı, sonra yine bir günah işledi ve 'Rabbim, günah işledim, beni bağışla' dedi."], [319.0, "(Allah): 'Kulum, günahı bağışlayan ve onunla hesaba çeken bir Rabbi olduğunu bildi mi?"], [319.8, "Kulumu bağışladım' dedi. Sonra Allah'ın kalmasını dilediği kadar kaldı, sonra yine bir günah işledi ve 'Allah'ım, günah işledim, beni bağışla' dedi."], [338.2, "Rabbi ona: 'Kulum, günahı bağışlayan ve onunla hesaba çeken bir Rabbi olduğunu bildi mi?"], [350.9, "Kulumu bağışladım; artık dilediğini yapsın' dedi.\""]]}, {"reader": false, "ar": [[357.0, "يعني: بما أنّ هذا هو هِجِّيراه وديدنُه،"], [360.3, "أنه كلّما وقع في شيءٍ من الذنوب والمعاصي بادر بالتوبة،"], [364.9, "لأنّي أنا من يغفر الذنوب ـ مؤمنًا بأنّي أنا من يغفر الذنوب ـ فحينئذٍ لو جاءني بملء الأرض خطايا،"], [371.8, "ثم لقيني لا يُشرك بي شيئًا،"], [374.8, "لأتيتُه بمثلها ـ أو قال: بقُرابها ـ مغفرةً."]], "tr": [[357.0, "Yani: Madem ki bu onun âdeti ve huyudur;"], [359.8, "günah ve isyanlardan bir şeye her düştüğünde tövbeye koşar, çünkü günahları bağışlayan benim —günahları bağışlayanın ben olduğuna iman ederek— o hâlde bana yeryüzü dolusu hatayla gelse, sonra bana hiçbir şeyi şirk koşmadan kavuşsa, ben de ona onun mislince —veya \"yeryüzü dolusu kadar\" buyurdu— mağfiretle gelirim."]]}, {"reader": false, "ar": [[378.0, "وفي الصحيحين من حديث أبي بكرٍ رضي الله عنه قال:"], [382.5, "قلتُ: يا رسول الله،"], [384.5, "علِّمني شيئًا أقوله في صلاتي،"], [387.0, "فقال: «قل: اللهمّ إنّي ظلمتُ نفسي ظلمًا كثيرًا» ـ ثم توسّل إلى الله عز وجل بصفةٍ من صفاته تعبُّدًا ـ قال:"], [395.7, "«ولا يغفر الذنوبَ إلا أنت، فاغفر لي مغفرةً من عندك، وارحمني، إنّك أنت الغفور الرحيم»."], [405.0, "فقوله: «فاغفر لي» حكمٌ مقرونٌ بالفاء عَقيبَ وصف؛"], [409.0, "أي: لأنك من يغفر الذنوب،"], [411.5, "ولأنّ من صفاتك مغفرةَ الذنوب،"], [414.0, "فاغفر لي. فهذا من أحبّ ما يُتوسَّل إلى الله عز وجل به."]], "tr": [[378.0, "Sahîhayn'de Ebû Bekir'in —Allah ondan razı olsun— hadisinde (şöyle geçer);"], [382.5, "dedi ki: \"Ey Allah'ın Resûlü, bana namazımda söyleyeceğim bir şey öğret\" dedim."], [387.6, "Buyurdu ki: \"De ki: Allah'ım, ben nefsime çokça zulmettim\" —sonra kulluk olarak Allah Azze ve Celle'ye O'nun sıfatlarından bir sıfatla tevessül etti— buyurdu ki:"], [395.7, "\"Günahları ancak Sen bağışlarsın. Beni katından bir mağfiretle bağışla ve bana merhamet et;"], [401.4, "şüphesiz Sen Gafûr'sun, Rahîm'sin.\" Onun \"beni bağışla\" sözü, bir vasfın hemen ardından \"fâ\" ile bağlanmış bir hükümdür;"], [409.0, "yani: Günahları bağışlayan Sen olduğun için ve günahları bağışlamak Senin sıfatlarından olduğu için beni bağışla."], [415.0, "İşte bu, Allah Azze ve Celle'ye tevessül edilen şeylerin en sevimlilerindendir."]]}, {"reader": false, "ar": [[420.0, "وفي صحيح الإمام مسلم من حديث أبي ذرٍّ رضي الله عنه،"], [424.8, "فيما يرويه عن ربّه عز وجل في الحديث القدسيّ الذي نحفظه جميعًا،"], [430.0, "قال: «يا عبادي، إنّكم تُخطئون بالليل والنهار» ـ ثم دلّنا على التعبّد بصفةٍ من صفاته ـ قال:"], [440.6, "«وأنا أغفر الذنوبَ جميعًا» ـ وهذه صفةٌ من صفاته،"], [445.0, "ثم رتّب عليها أثرًا من آثار تعبّدنا له في أرضه ـ قال: «فاستغفروني أغفرْ لكم»."]], "tr": [[420.0, "İmam Müslim'in Sahîh'inde, Ebû Zer'in —Allah ondan razı olsun— hadisinde, hepimizin ezberlediği kudsî hadiste, (Peygamber'in) Rabbi Azze ve Celle'den rivayet ettiği (sözlerde) şöyle buyurur:"], [430.7, "\"Ey kullarım! Sizler gece gündüz hata ediyorsunuz\" —sonra bizi O'nun sıfatlarından bir sıfatla kulluğa yöneltti— buyurdu ki:"], [440.6, "\"Ben de bütün günahları bağışlarım\" —bu O'nun sıfatlarından bir sıfattır;"], [445.5, "sonra buna, yeryüzünde O'na kulluğumuzun eserlerinden bir eseri bağladı— buyurdu ki:"], [450.8, "\"O hâlde benden mağfiret dileyin, sizi bağışlayayım.\""]]}, {"reader": false, "ar": [[453.0, "فإذا علم العبدُ أنّ من صفات ربّه الرقابة،"], [461.0, "فحينئذٍ سيكون خائفًا مراقبًا لله عز وجل في السرّ والعلانية."], [465.0, "وإذا علم أنّ ربّه موصوفٌ بالجلال والعظمة والكبرياء والعزّة،"], [474.0, "فإنّ ذلك يُثمر له الخوفَ والخشية من هذا الربّ العظيم."], [478.0, "وإذا علم أنّ ربّه موصوفٌ بصفات الجمال والكمال والرحمة والمغفرة والعفو والتوبة،"], [485.0, "فإنّ ذلك يُثمر له رجاءَ هذا الربّ العظيم،"], [489.0, "ومحبّةَ هذا الربّ العظيم."], [491.0, "وهكذا دواليك في كلّ صفات الله تبارك وتعالى."]], "tr": [[453.0, "Kul, Rabbinin sıfatlarından birinin murâkabe (gözetleme) olduğunu bilirse, o zaman gizlide ve açıkta Allah Azze ve Celle'den korkan ve O'nu murâkabe eden biri olur."], [466.4, "Rabbinin celâl, azamet, kibriyâ ve izzetle vasıflandığını bilirse, bu ona bu azîm Rabb'den korku ve haşyeti meyve olarak verir."], [478.0, "Rabbinin cemâl, kemâl, rahmet, mağfiret, af ve tövbe(yi kabul) sıfatlarıyla vasıflandığını bilirse, bu ona bu azîm Rabb'i ümit etmeyi ve bu azîm Rabb'i sevmeyi meyve olarak verir."], [491.0, "Allah Tebâreke ve Teâlâ'nın bütün sıfatlarında da böyle devam eder."]]}, {"reader": false, "ar": [[496.0, "فالمطلوب منّا في هذه الصفات:"], [497.8, "أن نُثبتها صفةً لله عز وجل،"], [500.0, "وأن نعتقد أنّ الله لا يماثله شيءٌ فيها،"], [504.0, "وأن نتعبّد لله عز وجل بمقتضياتها وآثارها في أرضه تبارك وتعالى. والله أعلم."]], "tr": [[496.0, "Bu sıfatlarda bizden istenen şudur:"], [497.5, "Onları Allah Azze ve Celle'ye sıfat olarak isbat etmemiz, onlarda Allah'a hiçbir şeyin benzemediğine inanmamız ve O'nun Tebâreke ve Teâlâ yeryüzünde, onların gerektirdikleri ve eserleriyle Allah Azze ve Celle'ye kulluk etmemiz. Allah en iyisini bilir."]]}]}, {"ts": "08:32", "title": "2. Külliye: Allah'ın bütün sıfatları selim fıtratın şahitliğiyle uyumludur", "paras": [{"reader": false, "ar": [[512.0, "الكلّيّة الثانية: <b>كلُّ صفات الله عز وجل متّفقةٌ مع شاهد الفطرة السليمة.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها ثالثةً:"], [530.2, "<b>كلُّ صفات الله عز وجل متّفقةٌ مع شاهد الفطرة السليمة.<\/b>"]], "tr": [[512.0, "<b>2. külliye: Allah Azze ve Celle'nin bütün sıfatları, selim fıtratın şahitliğiyle uyumludur.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [530.2, "<b>2. külliye: Allah Azze ve Celle'nin bütün sıfatları, selim fıtratın şahitliğiyle uyumludur.<\/b>"]]}, {"reader": false, "ar": [[536.0, "أقول وبالله التوفيق: وهذا بإجماع أهل العلم؛"], [541.0, "فلقد أودع الله عز وجل في فطرة كلّ عبدٍ هذا الإيمانَ العظيم بصفاته وكماله ووحدانيّته تبارك وتعالى،"], [554.0, "إلا تلك الفطرةَ التي تنجّست بشيءٍ من التعطيل أو الجحود أو العقائد الفاسدة."], [560.0, "فمن مقتضيات ما خلق الله عز وجل في فطرتنا:"], [564.5, "الإيمانُ الكامل التامّ بأنّ الله عز وجل موصوفٌ بكلّ كمال،"], [569.2, "ومنزَّهٌ عن كلّ عيب."], [571.0, "وهذا هو الذي نقصده بقولنا في الكلّيّة:"], [575.7, "«شاهد الفطرة»؛ هذا هو الشاهد من دلالة الفطرة على إثبات صفات الله عز وجل."]], "tr": [[536.0, "Tevfik Allah'tandır, derim ki: Bu, ilim ehlinin icmâıyladır."], [541.0, "Allah Azze ve Celle, her kulun fıtratına, kendi Tebâreke ve Teâlâ sıfatlarına, kemâline ve vahdâniyyetine dair bu büyük imanı yerleştirmiştir;"], [555.4, "ta'til, inkâr veya fâsid akîdelerden bir şeyle kirlenmiş fıtrat hariç."], [560.0, "Allah Azze ve Celle'nin fıtratımızda yarattığı şeyin gerektirdiklerinden biri, Allah Azze ve Celle'nin her kemâlle vasıflandığına ve her ayıptan münezzeh olduğuna kâmil ve tam bir imandır."], [571.0, "Külliyede \"fıtratın şahitliği\" sözümüzle kastettiğimiz budur;"], [575.7, "fıtratın, Allah Azze ve Celle'nin sıfatlarını isbata delâletinden kastedilen şahitlik budur."]]}, {"reader": false, "ar": [[584.0, "فإنّ كلَّ ذي فطرةٍ سليمةٍ يؤمن بأنّ إلهَه الذي يعبده لا بدّ أن يكون موجودًا،"], [591.6, "وكاملًا في ذاته، وكاملًا في صفاته،"], [595.5, "وكاملًا في أسمائه، وكاملًا الكمالَ المطلق في أفعاله،"], [599.0, "وأنه لا يجوز أبدًا أن يعتري ذاتَه أو أسماءه أو صفاته أو شيئًا من أفعاله شيءٌ من النقص في وجهٍ من الوجوه."]], "tr": [[584.0, "Çünkü selim fıtrat sahibi herkes, ibadet ettiği ilâhının mutlaka var olması, zâtında kâmil, sıfatlarında kâmil, isimlerinde kâmil ve fiillerinde mutlak kemâlle kâmil olması gerektiğine ve O'nun zâtına, isimlerine, sıfatlarına veya fiillerinden herhangi birine hiçbir yönden hiçbir noksanlığın ârız olmasının asla caiz olmadığına iman eder."]]}]}, {"ts": "10:06", "title": "2. Külliye (devam): Fıtrat hadisleri ve fıtratın ayetlerdeki şahitliği", "paras": [{"reader": false, "ar": [[615.0, "فكلُّ صاحب فطرةٍ سليمةٍ لم تتلوّث بشيءٍ من الملوّثات البيئيّة الخارجيّة فإنه ينشأ وهو مُقِرٌّ بذلك."], [624.0, "فقد دلّ على استحقاق الله عز وجل لصفات الكمال دليلُ النقل والفطرة والعقل،"], [635.3, "كما سيأتي في كلّيّةٍ خاصّةٍ إن شاء الله."], [640.0, "وتلك هي الفطرة التي أرادها النبيّ صلى الله عليه وسلم في الصحيحين من حديث أبي هريرة رضي الله عنه،"], [649.0, "قال: قال النبيّ صلى الله عليه وسلم:"], [653.0, "«ما من مولودٍ إلا ويولد على الفطرة» ـ هي فطرة الإقرار بوجود الله عز وجل،"], [660.0, "وأنه كاملٌ من كلّ وجه،"], [663.0, "وأنه منزَّهٌ عن النقص من كلّ وجه ـ «فأبواه يُهوِّدانه أو يُنصِّرانه أو يُمجِّسانه»."]], "tr": [[615.0, "Dışarıdan gelen çevresel kirleticilerden hiçbir şeyle kirlenmemiş selim fıtrat sahibi herkes, bunu ikrar ederek yetişir."], [624.0, "Allah Azze ve Celle'nin kemâl sıfatlarına layık olduğuna nakil, fıtrat ve akıl delili delâlet etmiştir;"], [635.9, "inşallah ileride özel bir külliyede geleceği gibi."], [640.0, "Peygamber sallallâhu aleyhi ve sellem'in kastettiği fıtrat işte budur;"], [647.0, "Sahîhayn'de Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde (geçer);"], [649.6, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [653.0, "\"Doğan her çocuk mutlaka fıtrat üzere doğar\" —bu, Allah Azze ve Celle'nin varlığını, O'nun her yönden kâmil olduğunu ve her yönden noksanlıktan münezzeh olduğunu ikrar fıtratıdır— \"sonra anne babası onu Yahudi, Hristiyan veya Mecûsî yapar.\""]]}, {"reader": false, "ar": [[672.0, "وفي صحيح الإمام مسلم من حديث عياض بن حمارٍ رضي الله عنه قال:"], [679.5, "قال النبيّ صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل:"], [686.0, "«وإنّي خلقتُ عبادي حنفاء، وإنّ الشياطين جاءتهم فاجتالتهم عن دينهم، وأمرتهم أن يُشركوا بي ما لم أُنزل به سلطانًا، وحرّمت عليهم ما أحللتُه لهم»."], [699.0, "وذلك معنى قوله عز وجل:"], [701.6, "<span class=\"ayah\">﴿فَأَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفًا فِطْرَتَ اللَّهِ الَّتِي فَطَرَ النَّاسَ عَلَيْهَا لَا تَبْدِيلَ لِخَلْقِ اللَّهِ﴾<\/span> <span class=\"ref\">[الروم: ٣٠]<\/span>."]], "tr": [[672.0, "İmam Müslim'in Sahîh'inde İyâz b."], [674.9, "Himâr'ın —Allah ondan razı olsun— hadisinde (şöyle geçer);"], [679.5, "dedi ki: Peygamber sallallâhu aleyhi ve sellem, Rabbi Azze ve Celle'den rivayet ettiği (hadiste) buyurdu ki:"], [686.0, "\"Ben kullarımı hanîfler olarak yarattım."], [688.2, "Şeytanlar onlara geldi, onları dinlerinden saptırdı, hakkında hiçbir delil indirmediğim şeyleri bana ortak koşmalarını emretti ve onlara helal kıldığım şeyleri onlara haram kıldı.\" Allah Azze ve Celle'nin şu sözünün anlamı budur:"], [701.6, "<span class=\"ayah\">﴿Sen yüzünü hanîf olarak dine çevir; Allah'ın, insanları üzerinde yarattığı fıtratına (sarıl). Allah'ın yaratışında değişiklik yoktur﴾<\/span> [Rûm 30]."]]}, {"reader": false, "ar": [[709.0, "حتى وإن تأثّرت فطرتُه بشيءٍ من الملوّثات العقديّة الفاسدة،"], [715.0, "فإنه متى ما زالت هذه الملوّثات رجعت الفطرةُ إلى الله عز وجل،"], [722.0, "كما قال الله عز وجل:"], [724.1, "<span class=\"ayah\">﴿فَإِذَا رَكِبُوا فِي الْفُلْكِ دَعَوُا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ فَلَمَّا نَجَّاهُمْ إِلَى الْبَرِّ إِذَا هُمْ يُشْرِكُونَ﴾<\/span> <span class=\"ref\">[العنكبوت: ٦٥]<\/span> <span class=\"note\">(Şeyh «وإذا ركبوا» diye okuyor)<\/span>."], [733.0, "وقال الله عز وجل:"], [735.3, "<span class=\"ayah\">﴿وَإِذَا غَشِيَهُم مَّوْجٌ كَالظُّلَلِ دَعَوُا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ فَلَمَّا نَجَّاهُمْ إِلَى الْبَرِّ فَمِنْهُم مُّقْتَصِدٌ وَمَا يَجْحَدُ بِآيَاتِنَا إِلَّا كُلُّ خَتَّارٍ كَفُورٍ﴾<\/span> <span class=\"ref\">[لقمان: ٣٢]<\/span>."]], "tr": [[709.0, "Fıtratı fâsid akîdevî kirleticilerden bir şeyle etkilenmiş olsa bile, bu kirleticiler ne zaman kalkarsa fıtrat Allah Azze ve Celle'ye döner."], [720.8, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [724.1, "<span class=\"ayah\">﴿Gemiye bindiklerinde dini yalnız O'na has kılarak Allah'a dua ederler. Fakat onları kurtarıp karaya çıkarınca bir de bakarsın ki şirk koşuyorlar﴾<\/span> [Ankebût 65]."], [733.0, "Allah Azze ve Celle şöyle de buyurmuştur:"], [735.3, "<span class=\"ayah\">﴿Onları gölgeler gibi bir dalga kapladığında dini yalnız O'na has kılarak Allah'a dua ederler. Onları kurtarıp karaya çıkarınca içlerinden bir kısmı orta yolu tutar. Bizim ayetlerimizi ancak çok hain, çok nankör olanlar inkâr eder﴾<\/span> [Lokmân 32]."]]}, {"reader": false, "ar": [[749.0, "وكما قال الله عز وجل:"], [752.0, "<span class=\"ayah\">﴿وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ لَيَقُولُنَّ اللَّهُ﴾<\/span> <span class=\"ref\">[العنكبوت: ٦١]<\/span>."], [758.0, "هذا هو إقرار الفطرة الذي يشهد عليه نطقُ لسانه <span class=\"q\">؟ 12:40<\/span>،"], [762.0, "وهذا لا يمكن لأحدٍ إنكارُه."], [766.0, "ولذلك ترون كثيرًا ممّن يُنكر علوَّ الله عز وجل متى ما جاء ذكرُ الله فإنه إمّا أن يُشير بعينه إلى السماء،"], [775.0, "أو يُشير بيده إلى السماء،"], [777.0, "وهذا هو داعي الفطرة."]], "tr": [[749.0, "Allah Azze ve Celle'nin buyurduğu gibi:"], [752.0, "<span class=\"ayah\">﴿Andolsun, onlara gökleri ve yeri kim yarattı, güneşi ve ayı kim emre amade kıldı diye sorsan, elbette \"Allah\" derler﴾<\/span> [Ankebût 61]."], [758.0, "İşte bu, dilinin söylemesinin <span class=\"q\">؟<\/span> şahitlik ettiği fıtrat ikrarıdır ve bunu hiç kimsenin inkâr etmesi mümkün değildir."], [766.0, "Bu yüzden Allah Azze ve Celle'nin uluvvünü inkâr edenlerin çoğunun, Allah anıldığında ya gözüyle semaya işaret ettiğini ya da eliyle semaya işaret ettiğini görürsünüz. İşte bu, fıtratın çağrısıdır."]]}, {"reader": false, "ar": [[781.0, "وكما قال الله عز وجل:"], [784.0, "<span class=\"ayah\">﴿وَإِذَا مَسَّ الْإِنسَانَ الضُّرُّ دَعَانَا لِجَنبِهِ أَوْ قَاعِدًا أَوْ قَائِمًا﴾<\/span> <span class=\"ref\">[يونس: ١٢]<\/span>."], [792.0, "فمتى ما تخلّصت الفطرةُ من هذه المؤثّرات الخارجيّة فإنها ترجع إلى الله عز وجل."], [801.0, "فعلوُّ الله عز وجل قد دلّ عليه النقلُ والفطرة،"], [804.0, "وحياةُ الله عز وجل قد دلّ عليها النقلُ والفطرة،"], [808.0, "وكمالُه في كافّة صفاته الذاتيّة والفعليّة قد دلّ عليه النقلُ والفطرة."], [816.0, "فمتى ما أردتم تقريرَ شيءٍ من هذه الصفات فلا بدّ أن تذكروا دليلَ الفطرة."]], "tr": [[781.0, "Allah Azze ve Celle'nin buyurduğu gibi:"], [784.0, "<span class=\"ayah\">﴿İnsana bir zarar dokunduğunda, yan yatarken, otururken veya ayaktayken bize dua eder﴾<\/span> [Yûnus 12]."], [793.3, "Fıtrat bu dış etkilerden ne zaman kurtulursa Allah Azze ve Celle'ye döner."], [801.0, "Allah Azze ve Celle'nin uluvvüne nakil ve fıtrat delâlet etmiştir;"], [804.0, "Allah Azze ve Celle'nin hayatına nakil ve fıtrat delâlet etmiştir;"], [808.0, "O'nun zâtî ve fiilî bütün sıfatlarındaki kemâline nakil ve fıtrat delâlet etmiştir."], [816.0, "Bu sıfatlardan bir şeyi takrir etmek istediğinizde, mutlaka fıtrat delilini zikretmelisiniz."]]}, {"reader": false, "ar": [[824.0, "ولذلك لا تجد عقيدةً من عقائد أهل السنة والجماعة إلا وهي متوائمةٌ مع ثلاثة أشياء:"], [835.0, "متوائمةٌ مع النقل، فلا تجد عقيدةً تخالف نقلًا؛"], [838.0, "ومتوائمةٌ مع العقل، فلا تجد عقيدةً تخالف عقلًا؛"], [843.0, "ومتوائمةٌ مع الفطرة السليمة،"], [845.8, "فلا تجد عقيدةً تخالف فطرةً سليمة. والله أعلم."]], "tr": [[824.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat'in akîdelerinden, üç şeyle uyumlu olmayan hiçbir akîde bulamazsın:"], [835.0, "Nakille uyumludur, nakle aykırı bir akîde bulamazsın;"], [838.0, "akılla uyumludur, akla aykırı bir akîde bulamazsın;"], [843.0, "selim fıtratla uyumludur, selim fıtrata aykırı bir akîde bulamazsın. Allah en iyisini bilir."]]}]}, {"ts": "14:12", "title": "3. Külliye: Allah'ın bütün sıfatları aklın şahitliğiyle uyumludur", "paras": [{"reader": false, "ar": [[852.0, "الكلّيّة الثالثة: <b>كلُّ صفات الله تعالى متّفقةٌ مع شاهد العقل.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ صفات الله عز وجل متّفقةٌ مع شاهد العقل.<\/b>"]], "tr": [[852.0, "3. külliye: Allah Teâlâ'nın bütün sıfatları, aklın şahitliğiyle uyumludur. (Tekrar ediyor.) 3."], [864.2, "külliye: Allah Azze ve Celle'nin bütün sıfatları, aklın şahitliğiyle uyumludur."]]}, {"reader": false, "ar": [[877.0, "أقول وبالله التوفيق: وأقصد به العقلَ السليم الصريح الذي لم يتلوّث بشيءٍ من عَفَن العقائد الفاسدة،"], [886.3, "والقواعد المنطقيّة الفلسفيّة التالفة،"], [888.7, "المناقضة للمنقول والمناهضة للمعقول."], [891.0, "فإنّ العقل السليم يفرض أنّ هذا الربّ العظيم له الكمالُ المطلق في كلّ ما يُضاف له."], [902.0, "فالعقل يفرض فرضًا جازمًا بأنّ الله له الكمالُ المطلق في ذاته،"], [908.0, "وله الكمالُ المطلق في أسمائه،"], [910.0, "وله الكمالُ المطلق في صفاته،"], [913.0, "وله الكمالُ المطلق في أفعاله."]], "tr": [[877.0, "Tevfik Allah'tandır, derim ki: (Akıl derken) fâsid akîdelerin çürüklüğünden, nakle aykırı ve akla karşı çıkan bozuk mantıkî-felsefî kaidelerden hiçbir şeyle kirlenmemiş selim ve sarih aklı kastediyorum."], [891.0, "Çünkü selim akıl, bu azîm Rabb'in kendisine izafe edilen her şeyde mutlak kemâle sahip olmasını gerekli kılar."], [902.0, "Akıl kesin bir şekilde gerekli kılar ki Allah'ın zâtında mutlak kemâl, isimlerinde mutlak kemâl, sıfatlarında mutlak kemâl ve fiillerinde mutlak kemâl vardır."]]}, {"reader": false, "ar": [[915.0, "فالعقل يُقرّ بأنّ هذا الربّ هو الأوّل الذي ليس قبله شيء،"], [922.0, "وهو الكامل في ذاته."], [924.0, "فإنّ كلّ صفةٍ أثبتها الله عز وجل في القرآن فلا بدّ أن يدلّ عليها شاهدٌ ـ شاهدُ العقل،"], [931.0, "شاهدُ العقل. فصفةُ العلم يدلّ عليها العقل،"], [936.0, "والقدرةُ والحياةُ يدلّ عليها العقل،"], [941.0, "والعلوُّ يدلّ عليه العقل،"], [945.0, "والرحمةُ يدلّ عليها العقل،"], [948.0, "والغضبُ يدلّ عليه العقل،"], [950.0, "وغيرُ ذلك من سائر الصفات كلُّها ممّا يدلّ عليها العقل."]], "tr": [[915.0, "Akıl, bu Rabb'in kendisinden önce hiçbir şey bulunmayan Evvel olduğunu ve zâtında kâmil olduğunu ikrar eder."], [924.0, "Allah Azze ve Celle'nin Kur'an'da isbat ettiği her sıfata mutlaka bir şahit delâlet eder:"], [928.7, "aklın şahitliği, aklın şahitliği. İlim sıfatına akıl delâlet eder;"], [934.0, "kudret ve hayata akıl delâlet eder;"], [936.8, "uluvve akıl delâlet eder; rahmete akıl delâlet eder;"], [945.8, "gazaba akıl delâlet eder. Bunların dışındaki diğer bütün sıfatların hepsi de aklın delâlet ettiği şeylerdendir."]]}, {"reader": false, "ar": [[956.0, "وكذلك يقتضي العقلُ نفيَ النقص والتشبيه عنه عز وجل؛"], [962.0, "فالعقل السليم يُنزّه الله عز وجل عن صفات النقص والمماثلة للمخلوقين."], [968.0, "فالعجزُ ينفيه النقلُ والعقل،"], [973.0, "والموتُ ينفيه النقلُ والعقل،"], [978.0, "والجهلُ ينفيه النقلُ والعقل،"], [982.0, "والتعبُ والإعياءُ والحلولُ في الأماكن،"], [986.0, "كلُّ ذلك ممّا ينفيه النقلُ والعقل."], [991.0, "وفي نفس الوقت يؤمن بحقيقة الصفات الثابتة دون تكييفٍ ولا تعطيلٍ ولا تمثيلٍ ولا تحريف."]], "tr": [[956.0, "Aynı şekilde akıl, O'ndan Azze ve Celle noksanlığın ve teşbihin nefyedilmesini gerektirir."], [962.0, "Selim akıl, Allah Azze ve Celle'yi noksanlık sıfatlarından ve mahlûklara benzemekten tenzih eder."], [965.8, "Âcizliği nakil de akıl da nefyeder;"], [968.0, "ölümü nakil de akıl da nefyeder;"], [973.9, "cehli nakil de akıl da nefyeder;"], [980.5, "yorgunluk, bitkinlik ve mekânlara hulûl etmek, bunların hepsi nakil ile aklın nefyettiği şeylerdendir."], [991.0, "Aynı zamanda (selim akıl) sabit sıfatların hakikatine tekyîf, ta'til, temsil ve tahrif olmaksızın iman eder."]]}]}, {"ts": "16:40", "title": "3. Külliye (devam): İbn Teymiyye ve İbnü'l-Kayyim'den nakiller; nakle aykırı her akıl hevâdır", "paras": [{"reader": false, "ar": [[1000.0, "ويؤكّد هذا الإمامُ ابن تيميّة رحمه الله تعالى في نقلٍ جميلٍ عنه،"], [1005.0, "قال: «كلُّ ما يدلّ عليه الكتاب والسنة فإنه موافقٌ لصريح المعقول، وأنّ العقل الصريح لا يخالف النقلَ الصحيح، ولكنّ كثيرًا من الناس يغلطون إمّا في هذا ـ أي في النقل ـ وإمّا في هذا ـ أي في العقل ـ؛ فمن عرف قولَ الرسول صلى الله عليه وسلم ومرادَه به كان عارفًا بالأدلّة الشرعيّة، وليس في المعقول ما يخالف المنقول». انتهى كلامه."]], "tr": [[1000.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— kendisinden yapılan güzel bir nakilde bunu te'kid eder;"], [1002.1, "der ki: \"Kitap ve Sünnet'in delâlet ettiği her şey sarih akla uygundur;"], [1004.2, "sarih akıl sahih nakle aykırı düşmez."], [1005.6, "Fakat insanların çoğu ya bunda —yani nakilde— ya da bunda —yani akılda— hata eder."], [1019.7, "Resûl sallallâhu aleyhi ve sellem'in sözünü ve onunla neyi kastettiğini bilen kimse şer'î delilleri bilen kimse olur;"], [1030.5, "akılda nakle aykırı bir şey yoktur.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1037.0, "وقال أيضًا رحمه الله تعالى:"], [1041.0, "«من ادّعى أنّ العقل يعارض السمعَ ويخالفه فدعواه باطلة؛ لأنّ العقل الصريح لا يُتصوَّر أن يخالف النقلَ الصحيح، وإنما المخالفون للكتاب والسنة والإجماع، والمدّعون حصولَ القواطع العقليّة، إنما معهم شُبَهُ المعقولات لا حقائقُها». انتهى كلامه."]], "tr": [[1037.0, "Yine —Allah ona rahmet etsin— şöyle demiştir:"], [1041.0, "\"Kim aklın sem'e (nakle) muâraza ettiğini ve ona aykırı düştüğünü iddia ederse iddiası bâtıldır."], [1047.6, "Çünkü sarih aklın sahih nakle aykırı düşmesi düşünülemez."], [1051.4, "Kitap'a, Sünnet'e ve icmâya muhalefet edenlerle kesin aklî delillere sahip olduklarını iddia edenlerin elinde ancak akliyatın şüpheleri vardır, hakikatleri değil.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1066.0, "ولذلك فالمتقرّر بالإجماع في قواعد أهل السنة والجماعة ـ واحفظوها،"], [1072.8, "وستأتينا في كلّيّةٍ إن شاء الله ـ:"], [1076.0, "أنّ كلَّ عقلٍ خالف نقلًا فهو هوًى،"], [1079.0, "فهو هوًى؛ يعني أنه من جملة الأهواء،"], [1085.0, "لكنهم يُخرجون أهواءهم في صورة ـ في صورة معقولات،"], [1090.0, "وإلّا فلو كانت معقولاتٍ حقيقيّةً لما تُصُوِّر أبدًا أنها تخالف شيئًا من المنقولات الصحيحة."]], "tr": [[1066.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde icmâ ile sabit olan şudur —bunu ezberleyin, inşallah bir külliyede gelecek—:"], [1076.9, "Nakle aykırı düşen her akıl hevâdır, hevâdır."], [1082.0, "Yani hevâlar cümlesindendir; fakat onlar hevâlarını akliyat suretinde, akliyat kılığında ortaya koyarlar."], [1089.3, "Yoksa gerçek akliyat olsalardı, sahih nakillerden herhangi bir şeye aykırı düşmeleri asla düşünülemezdi."]]}, {"reader": false, "ar": [[1103.0, "ويؤكّد ذلك الإمامُ ابن القيّم رحمه الله تعالى في قوله:"], [1107.0, "«ثبت بالعقل الصريح والنقل الصحيح ثبوتُ صفات الكمال للربّ سبحانه، وأنه أحقُّ بالكمال من كلّ ما سواه، وأنه يجب أن تكون القوّةُ كلُّها له، والعزّةُ كلُّها له، والعلمُ كلُّه له، والقدرةُ كلُّها له، والجمالُ كلُّه له، وكذلك سائرُ صفات الكمال»."], [1142.7, "انتهى كلامه. والقاعدةُ والكلّيّةُ واضحةٌ إن شاء الله، والله أعلم."]], "tr": [[1103.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şu sözüyle bunu te'kid eder:"], [1107.0, "\"Sarih akıl ve sahih nakille, kemâl sıfatlarının Rabb Sübhânehû için sabit olduğu, O'nun kemâle kendisinden başka her şeyden daha layık olduğu ve kuvvetin tamamının O'na, izzetin tamamının O'na, ilmin tamamının O'na, kudretin tamamının O'na, cemâlin tamamının O'na ait olmasının vacip olduğu sabit olmuştur;"], [1137.0, "diğer kemâl sıfatları da böyledir.\" Sözü burada bitti."], [1142.7, "Kaide ve külliye inşallah açıktır. Allah en iyisini bilir."]]}]}, {"ts": "19:09", "title": "4. Külliye: Sıfatları anarken yapılan işaret: isbatı te'kid için ise caiz, temsil için ise haram", "paras": [{"reader": false, "ar": [[1149.0, "ومن الكلّيّات أيضًا: «كلُّ إشارة» ـ وهذه طويلة شويّ ـ:"], [1154.0, "كلُّ إشارةٍ عند ذكر شيءٍ من صفات الله تعالى،"], [1183.0, "إن أُريد بها تأكيدُ الإثبات ونفيُ المجاز فجائزة،"], [1193.0, "وإن أُريد بها المماثلةُ فمحرّمة. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1149.0, "Külliyelerden biri de şudur: \"Her işaret…\" —bu biraz uzunca—:"], [1154.0, "4. külliye: Allah Teâlâ'nın sıfatlarından bir şey anılırken yapılan her işaret, onunla isbatı te'kid etmek ve mecazı nefyetmek kastediliyorsa caizdir;"], [1193.0, "onunla benzerlik (mümâselet) kastediliyorsa haramdır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1202.0, "أقول وبالله التوفيق: لقد روى الإمام مسلمٌ في صحيحه من حديث عُبيد الله بن مِقسَم <span class=\"q\">؟ 20:04<\/span> أنه نظر إلى عبد الله بن عمر رضي الله عنهما كيف يحكي رسولَ الله صلى الله عليه وسلم ـ يعني:"], [1219.6, "ينقل هذا الحديث عن النبيّ صلى الله عليه وسلم ـ قال:"], [1225.6, "«يأخذ الله عز وجل سماواتِه وأرضَه بيديه، فيقول: أنا الله ـ ويقبض أصابعه ويبسطها ـ أنا الملك»."], [1238.0, "حتى نظرتُ إلى المنبر يتحرّك من أسفلِ شيءٍ منه،"], [1242.0, "حتى إنّي لأقول: أساقطٌ هو برسول الله صلى الله عليه وسلم؟"]], "tr": [[1202.0, "Tevfik Allah'tandır, derim ki: İmam Müslim Sahîh'inde Ubeydullah b."], [1204.0, "Miksem'in <span class=\"q\">؟<\/span> hadisinden rivayet etmiştir:"], [1206.5, "O, Abdullah b. Ömer'e —Allah ikisinden de razı olsun— Resûlullah sallallâhu aleyhi ve sellem'i nasıl anlattığına —yani bu hadisi Peygamber sallallâhu aleyhi ve sellem'den nasıl naklettiğine— baktı."], [1219.6, "(İbn Ömer) dedi ki: \"Allah Azze ve Celle göklerini ve yerini iki eliyle tutar ve 'Ben Allah'ım' der —(Resûlullah) parmaklarını kapayıp açıyordu— 'Ben Melik'im.'\" Öyle ki minbere baktım, en alt kısmından sallanıyordu;"], [1244.4, "hatta \"Resûlullah sallallâhu aleyhi ve sellem'le birlikte düşecek mi?\" diyordum."]]}, {"reader": false, "ar": [[1249.0, "وروى الإمام أحمد من حديث ابن عمر رضي الله عنهما أنّ رسول الله صلى الله عليه وسلم قرأ هذه الآية ذاتَ يومٍ على المنبر:"], [1261.0, "<span class=\"ayah\">﴿وَمَا قَدَرُوا اللَّهَ حَقَّ قَدْرِهِ وَالْأَرْضُ جَمِيعًا قَبْضَتُهُ يَوْمَ الْقِيَامَةِ وَالسَّمَاوَاتُ مَطْوِيَّاتٌ بِيَمِينِهِ سُبْحَانَهُ وَتَعَالَىٰ عَمَّا يُشْرِكُونَ﴾<\/span> <span class=\"ref\">[الزمر: ٦٧]<\/span>،"], [1272.0, "ورسولُ الله صلى الله عليه وسلم يقول بيده هكذا،"], [1278.0, "ويحرّكها يُقبِل ويُدبِر: «يُمجِّد الربُّ نفسَه: أنا الجبّار، أنا المتكبّر، أنا الملك، أنا العزيز، أنا الكريم»،"], [1291.0, "فرجف برسول الله صلى الله عليه وسلم المنبرُ حتى قلنا:"], [1296.4, "ليَخِرَّنَّ به. وهذا حديثٌ صحّحه الإمام الألبانيّ رحمه الله تعالى."]], "tr": [[1249.0, "İmam Ahmed, İbn Ömer'in —Allah ikisinden de razı olsun— hadisinden rivayet etmiştir:"], [1255.0, "Resûlullah sallallâhu aleyhi ve sellem bir gün minberde şu ayeti okudu:"], [1261.0, "<span class=\"ayah\">﴿Onlar Allah'ı gereği gibi takdir edemediler. Kıyamet günü yeryüzü bütünüyle O'nun avucundadır; gökler de O'nun sağ eliyle dürülmüştür. O, onların ortak koştuklarından münezzeh ve yücedir﴾<\/span> [Zümer 67]."], [1273.3, "Resûlullah sallallâhu aleyhi ve sellem eliyle böyle yapıyor, onu ileri geri hareket ettiriyordu:"], [1280.0, "\"Rabb kendini yüceltir: Ben Cebbâr'ım, ben Mütekebbir'im, ben Melik'im, ben Azîz'im, ben Kerîm'im.\" Minber Resûlullah sallallâhu aleyhi ve sellem'le öyle sarsıldı ki \"Onunla birlikte mutlaka yıkılacak\" dedik."], [1296.4, "Bu, İmam Elbânî'nin —Allah ona rahmet etsin— sahih dediği bir hadistir."]]}, {"reader": false, "ar": [[1303.0, "وأيضًا في السنن من حديث أبي هريرة رضي الله عنه:"], [1309.0, "لمّا قرأ النبيّ صلى الله عليه وسلم قولَه ـ إنّ الله ـ قولَه تعالى:"], [1315.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا وَإِذَا حَكَمْتُم بَيْنَ النَّاسِ أَن تَحْكُمُوا بِالْعَدْلِ إِنَّ اللَّهَ نِعِمَّا يَعِظُكُم بِهِ إِنَّ اللَّهَ كَانَ سَمِيعًا بَصِيرًا﴾<\/span> <span class=\"ref\">[النساء: ٥٨]<\/span>،"], [1329.0, "قال: رأيتُ رسول الله صلى الله عليه وسلم يضع إبهامه على أذنه،"], [1336.0, "وسبّابتَه على عينه. قال أبو هريرة:"], [1342.8, "رأيتُ رسول الله صلى الله عليه وسلم يقرؤها ويضع إصبعيه."], [1349.0, "قال المقرئ ـ وهو أحد رواة الحديث ـ:"], [1354.0, "يعني أنّ الله سميعٌ بصير؛"], [1357.0, "يعني أنّ لله سمعًا وبصرًا."], [1360.0, "أي: من باب تأكيد الإثبات ونفي المجاز."]], "tr": [[1303.0, "Yine Sünen'de Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde (şöyle geçer):"], [1309.0, "Peygamber sallallâhu aleyhi ve sellem şu sözü —\"Şüphesiz Allah…\"— Allah Teâlâ'nın şu sözünü okuduğunda:"], [1315.0, "<span class=\"ayah\">﴿Şüphesiz Allah size emanetleri ehline vermenizi ve insanlar arasında hükmettiğinizde adaletle hükmetmenizi emreder. Allah size ne güzel öğüt veriyor! Şüphesiz Allah her şeyi işitendir, görendir﴾<\/span> [Nisâ 58], (Ebû Hüreyre) dedi ki:"], [1329.6, "Resûlullah sallallâhu aleyhi ve sellem'i başparmağını kulağının üzerine, şehadet parmağını gözünün üzerine koyarken gördüm."], [1341.0, "Ebû Hüreyre dedi ki: Resûlullah sallallâhu aleyhi ve sellem'i bunu okurken ve iki parmağını koyarken gördüm."], [1349.0, "Hadisin râvilerinden biri olan el-Mukri' dedi ki:"], [1354.0, "Yani Allah Semî' ve Basîr'dir;"], [1357.0, "yani Allah'ın işitmesi ve görmesi vardır."], [1360.0, "Yani isbatı te'kid ve mecazı nefyetmek kabîlindendir."]]}, {"reader": false, "ar": [[1364.0, "وهذا الحديث قال فيه أبو داود رحمه الله تعالى:"], [1370.0, "«وهذا ردٌّ على الجهميّة» <span class=\"q\">؟ 22:50<\/span>،"], [1371.7, "وهو حديثٌ صحيح، وقد صحّحه الإمام الألبانيّ رحمه الله تعالى."], [1376.0, "فأنتم ترون في هذه النقول المذكورة أنّ النبيّ صلى الله عليه وسلم قد أشار بشيءٍ ممّا يخصّ صفتَه عند ذكر شيءٍ ممّا يخصّ صفاتِ الله عز وجل،"], [1390.0, "وهي من باب إشارة تأكيد الإثبات ونفي المجاز وإرادة الحقيقة،"], [1396.0, "ولكن ليست بإشارة التمثيل."], [1401.0, "يعني: كما أنّ هذا الهزَّ <span class=\"q\">؟ 23:21<\/span> يوصَف به الإنسانُ حقيقةً من غير نفيٍ ولا مجاز،"], [1409.0, "فأنا أريد حقيقةَ الهزّ الذي يوصَف الله عز وجل به،"], [1413.0, "من غير تكييفٍ ولا تمثيل."]], "tr": [[1364.0, "Ebû Dâvûd —Allah ona rahmet etsin— bu hadis hakkında \"Bu, Cehmiyye'ye bir reddiyedir\" <span class=\"q\">؟<\/span> demiştir."], [1370.0, "Bu sahih bir hadistir; İmam Elbânî —Allah ona rahmet etsin— onu sahih saymıştır."], [1376.0, "Zikredilen bu nakillerde görüyorsunuz ki Peygamber sallallâhu aleyhi ve sellem, Allah Azze ve Celle'nin sıfatlarına ait bir şeyi anarken kendi sıfatına ait bir şeyle işaret etmiştir."], [1389.4, "Bu, isbatı te'kid, mecazı nefy ve hakikati kastetme işareti kabîlindendir;"], [1395.4, "fakat temsil işareti değildir. Yani:"], [1401.0, "Bu sallama/hareket <span class=\"q\">؟<\/span> insanın hakikaten, nefy ve mecaz olmaksızın vasıflandığı bir şey olduğu gibi, ben de Allah Azze ve Celle'nin vasıflandığı (fiilin) hakikatini, tekyîf ve temsil olmaksızın kastediyorum."]]}]}, {"ts": "23:35", "title": "4. Külliye (devam): Beyhakî'nin açıklaması; sedd-i zerâi' için işaretten kaçınmak", "paras": [{"reader": false, "ar": [[1415.0, "وقد روى الإمام البيهقيّ في «الأسماء والصفات» حديثًا:"], [1420.2, "أنّ النبيّ صلى الله عليه وسلم وضع إبهامه على أذنه وسبّابتَه على عينه،"], [1432.0, "فقال رحمه الله: «والمرادُ بالإشارة المرويّة في هذا الخبر تحقيقُ الوصف لله عز وجل بالسمع والبصر، فأشار إلى محلَّي السمع والبصر منّا لإثبات صفة السمع والبصر لله عز وجل، كما يقال: قبض فلانٌ على مال فلان، ويُشار باليد، على معنى أنه حائزٌ له. وأفاد هذا الخبرُ أنه سميعٌ بصير، له سمعٌ وبصر، لا على معنى أنه عليم»."], [1476.0, "انتهى كلامه، انتهى كلامه رحمه الله."]], "tr": [[1415.0, "İmam Beyhakî el-Esmâ ve's-Sıfât'ta, Peygamber sallallâhu aleyhi ve sellem'in başparmağını kulağının üzerine, şehadet parmağını gözünün üzerine koyduğuna dair bir hadis rivayet etmiş ve —Allah ona rahmet etsin— şöyle demiştir:"], [1424.7, "\"Bu haberde rivayet edilen işaretten maksat, Allah Azze ve Celle'nin işitme ve görmeyle vasıflandığını tahkik etmektir."], [1434.0, "Allah Azze ve Celle için işitme ve görme sıfatını isbat etmek üzere bizdeki işitme ve görme mahalline işaret etmiştir."], [1458.0, "Nitekim 'Falan, filanın malını kabzetti' denir ve el ile işaret edilir;"], [1469.3, "yani onu ele geçirmiştir, anlamında."], [1476.0, "Bu haber, O'nun Semî' ve Basîr olduğunu, işitmesi ve görmesi bulunduğunu ifade eder;"], [1477.0, "(bu isimlerin sadece) 'Alîm' anlamında olduğunu değil.\" Sözü burada bitti;"], [1478.5, "sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[1480.0, "وهذا دليلٌ على جواز هذه الإشارة إن كنتَ تعلم من نفسك أنك لا تريد بها إلا تأكيدَ الإثبات وإرادةَ الحقيقة ونفيَ المجاز عنها."], [1493.0, "وإلّا فإذا كنتَ بين ظَهرانَي أناسٍ لا يعلمون هذا التقسيم،"], [1500.2, "وربّما يتطرّق إلى أذهانهم شيءٌ ممّا لا يجوز،"], [1505.0, "فلا جرمَ أنّ سدَّ الذرائع هو المطلوب في هذه الحالة."], [1513.0, "فمتى ما كان الإنسان يخاف على السامعين من أن يفهموا من إشارته المماثلة،"], [1523.0, "لا جرمَ أنّ الكفَّ عن مثل ذلك هو الأولى والأسلم."], [1529.0, "والكلّيّة واضحةٌ إن شاء الله، والله أعلم."]], "tr": [[1480.0, "Bu, eğer kendinden bununla sadece isbatı te'kid etmeyi, hakikati kastetmeyi ve ondan mecazı nefyetmeyi kastettiğini biliyorsan, bu işaretin caiz olduğuna delildir."], [1493.0, "Aksi hâlde, bu taksimi bilmeyen ve zihinlerine caiz olmayan bir şeyin gelebileceği insanların arasındaysan, şüphesiz bu durumda istenen sedd-i zerâi'dir (kötülüğe giden yolu kapatmaktır)."], [1513.0, "İnsan, dinleyenlerin onun işaretinden benzerlik (mümâselet) anlamasından korktuğunda, şüphesiz böyle bir şeyden kaçınmak daha evlâ ve daha selâmetlidir."], [1529.0, "Külliye inşallah açıktır. Allah en iyisini bilir."]]}]}, {"ts": "25:33", "title": "5. Külliye: Sahih nassın isbat etmediği taalluklarda isbat da nefy de caiz değildir, tevakkuf edilir", "paras": [{"reader": false, "ar": [[1533.0, "ومن الكلّيّات أيضًا: كلُّ ما لم يُثبته النصُّ الصحيح من متعلّقات الصفة فلا يجوز إثباتُه ولا نفيُه،"], [1542.1, "وإنما التوقّفُ فيه. <span class=\"note\">(يكررها)<\/span> وهذه قاعدةٌ مفيدةٌ جدًّا:"], [1561.0, "<b>كلُّ ما لم يُثبته النصُّ الصحيح من متعلّقات الصفة فلا يجوز إثباتُه ولا نفيُه، وإنما التوقّفُ فيه.<\/b>"]], "tr": [[1533.0, "Külliyelerden biri de şudur: 5."], [1534.5, "külliye: Sıfatın taalluklarından sahih nassın isbat etmediği her şeyin isbatı da nefyi de caiz değildir;"], [1540.9, "onda ancak tevakkuf edilir. (Tekrar ediyor.) Bu çok faydalı bir kaidedir:"], [1561.0, "<b>5. külliye: Sıfatın taalluklarından sahih nassın isbat etmediği her şeyin isbatı da nefyi de caiz değildir; onda ancak tevakkuf edilir.<\/b>"]]}, {"reader": false, "ar": [[1573.0, "أقول وبالله التوفيق: وهذه الكلّيّة ردٌّ على من عطّل شيئًا من صفات الله عز وجل؛"], [1582.0, "فإنه لم يصل إلى مرتبة التعطيل إلا بعد أن جعل صفةَ الله ـ إلا بعد أن جعل لوازمَ صفة المخلوق تلزم على صفة الخالق."], [1596.0, "فمتى ما وقع الإنسان في هذه اللوازم ـ في بؤرة هذه اللوازم ـ فإنه لا بدّ وأن يعطّل أو أن يمثّل."], [1612.0, "فالله عز وجل مختصٌّ بصفاته،"], [1615.6, "والعبدُ مختصٌّ بصفاته، فليس كلُّ ما يلزم على صفة المخلوق لا بدّ وأن يلزم على صفة الخالق."]], "tr": [[1573.0, "Tevfik Allah'tandır, derim ki: Bu külliye, Allah Azze ve Celle'nin sıfatlarından bir şeyi ta'til edene bir reddiyedir."], [1582.0, "Çünkü o, ta'til mertebesine ancak Allah'ın sıfatını… ancak mahlûkun sıfatının lâzımlarını Hâlık'ın sıfatına da lâzım kıldıktan sonra ulaşmıştır."], [1596.0, "İnsan bu lâzımlara —bu lâzımların girdabına— düştüğünde, mutlaka ya ta'til eder ya da temsil eder."], [1612.0, "Allah Azze ve Celle kendi sıfatlarıyla hususîdir, kul da kendi sıfatlarıyla hususîdir."], [1619.4, "Mahlûkun sıfatına lâzım olan her şeyin Hâlık'ın sıfatına da lâzım olması gerekmez."]]}, {"reader": false, "ar": [[1624.0, "فما أثبته النصُّ الصريح من متعلّقات الصفة أثبتناه،"], [1629.0, "وما نفاه النصُّ الصحيح من متعلّقات الصفة نفيناه،"], [1634.0, "وما لم يأتِ النصُّ الصحيح الصريح بإثباته ولا نفيه فإنّ الواجب التوقّفُ فيه،"], [1640.0, "فلا نُثبته ولا ننفيه."], [1644.0, "وأضرب لكم أمثلةً فأقول:"]], "tr": [[1624.0, "Sıfatın taalluklarından sarih nassın isbat ettiğini isbat ederiz;"], [1629.6, "sıfatın taalluklarından sahih nassın nefyettiğini nefyederiz."], [1633.4, "Sahih ve sarih nassın ne isbatını ne de nefyini getirdiği şeyde ise vacip olan tevakkuftur;"], [1644.0, "onu ne isbat ederiz ne de nefyederiz."], [1645.7, "Size örnekler vereyim, diyorum ki:"]]}]}, {"ts": "27:30", "title": "5. Külliye (devam): Örnekler: ityân ve intikal, mecî ve hareket", "paras": [{"reader": false, "ar": [[1650.0, "منها: قولُ الإمام البيهقيّ رحمه الله تعالى ـ وغفر له هذه الزلّة ـ قال:"], [1657.1, "«إنّ إتيانه» ـ أي إتيانَ الله عز وجل ـ «ليس بإتيانٍ من مكانٍ إلى مكان»."], [1668.0, "قلتُ: وهذا النفيُ خطأ؛"], [1671.0, "فإنّ الواجب علينا أن نُثبت أنّ من صفات الله عز وجل الإتيان،"], [1676.0, "ونسكتَ عن متعلّقات ولوازم هذه الصفة،"], [1679.0, "إلا إذا أثبتها الدليل أو نفاها."], [1683.0, "فلا ينبغي أن نجعل من لوازم إتيانه الانتقالَ من مكانٍ إلى مكان،"], [1692.0, "ولا أن ننفي الانتقالَ من مكانٍ إلى مكان،"], [1695.0, "لأنه لم يأتِ إثباتُه ولا نفيُه في النصّ."], [1698.0, "فإنّ الانتقال من لوازم الإتيان الذي يوصَف به المخلوق،"], [1706.0, "وأمّا إذا كنّا نتكلّم عن صفة الخالق فإنّنا نوقف متعلّقاتها على إثبات النصّ أو نفيه. فهمتم هذا؟"]], "tr": [[1650.0, "Bunlardan biri, İmam Beyhakî'nin —Allah Teâlâ ona rahmet etsin ve bu sürçmesini bağışlasın— sözüdür."], [1657.1, "Dedi ki: \"O'nun gelişi —yani Allah Azze ve Celle'nin gelişi (ityân)— bir mekândan bir mekâna geliş değildir.\" Derim ki:"], [1671.0, "Bu nefy hatadır. Çünkü bize vacip olan, Allah Azze ve Celle'nin sıfatlarından birinin geliş (ityân) olduğunu isbat etmek ve delil isbat etmedikçe veya nefyetmedikçe bu sıfatın taalluklarından ve lâzımlarından sükût etmektir."], [1689.6, "O'nun gelişinin lâzımlarından bir mekândan bir mekâna intikali saymamız da, bir mekândan bir mekâna intikali nefyetmemiz de uygun değildir;"], [1698.0, "çünkü nasta onun ne isbatı ne de nefyi gelmiştir."], [1703.7, "İntikal, mahlûkun vasıflandığı gelişin lâzımlarındandır;"], [1707.3, "Hâlık'ın sıfatından bahsettiğimizde ise onun taalluklarını nassın isbatına veya nefyine bağlı tutarız. Bunu anladınız mı?"]]}, {"reader": false, "ar": [[1716.0, "ومنها: قولُ بعض الناس:"], [1719.0, "«إنّ مجيء الله عز وجل ليس بحركة»."], [1725.0, "ونقول: هذا النفيُ خطأ؛"], [1730.0, "وذلك لأنّ الواجب عليك أن تُثبت أنّ لله عز وجل مجيئًا لائقًا بجلاله وعظمته،"], [1736.0, "من غير أن تُثبت أنه مجيءٌ بحركةٍ أو بغير حركة؛"], [1741.0, "فإنّ الحركة ـ نفيًا وإثباتًا ـ لم يأتِ في النصّ إثباتُها."], [1745.0, "ولو كان تفصيلُها ممّا يتعلّق به صحّةُ الإيمان لحرص النبيّ صلى الله عليه وسلم على ذكرها وبيانها،"], [1754.0, "ولحرص الصحابة بعد سماع النصّ على السؤال عنه."], [1758.0, "فشيءٌ سكت عنه الله عز وجل في كتابه،"], [1762.0, "وسكت عنه نبيُّه صلى الله عليه وسلم عند بلاغه،"], [1766.0, "وسكت عنه أفضلُ المتعلّمين ـ رضي الله تعالى عنهم وأرضاهم ـ عند تلقّيه،"], [1772.0, "فلا ينبغي الخوضُ فيه لا بإثباتٍ ولا بنفي. كلّيّةٌ مهمّةٌ جدًّا."]], "tr": [[1716.0, "Bunlardan biri de bazı insanların \"Allah Azze ve Celle'nin gelişi (mecî) hareketle değildir\" sözüdür."], [1725.0, "Deriz ki: Bu nefy hatadır."], [1730.0, "Çünkü sana vacip olan, Allah Azze ve Celle'nin celâline ve azametine layık bir gelişi olduğunu, bunun hareketle veya hareketsiz bir geliş olduğunu isbat etmeksizin isbat etmendir."], [1741.0, "Zira hareketin —nefy ve isbat yönüyle— isbatı nasta gelmemiştir."], [1745.0, "Eğer onun tafsilatı imanın sıhhatinin bağlı olduğu şeylerden olsaydı, Peygamber sallallâhu aleyhi ve sellem onu zikretmeye ve açıklamaya özen gösterirdi;"], [1754.0, "sahâbe de nassı duyduktan sonra onu sormaya özen gösterirdi."], [1758.0, "Allah Azze ve Celle'nin Kitabında sükût ettiği, Peygamberi sallallâhu aleyhi ve sellem'in tebliğ ederken sükût ettiği, öğrenenlerin en faziletlileri —Allah Teâlâ onlardan razı olsun ve onları razı etsin— onu alırken sükût ettiği bir şeye ne isbatla ne de nefyle dalmak uygun değildir. Çok önemli bir külliye."]]}]}, {"ts": "29:38", "title": "5. Külliye (devam): Nüzul ve nukle, cisim lafzı", "paras": [{"reader": false, "ar": [[1778.0, "ومنها أيضًا: قال بعض الناس:"], [1781.5, "إنّنا ننفي نزولَ الله عز وجل لأنّ نزول الله من لوازمه النُّقلة ـ يعني الانتقالَ من مكانٍ إلى مكان."], [1791.0, "فنقول: إنّ النُّقلة لا نُثبتها لعدم وجود ما يُثبتها،"], [1801.0, "ولا ننفيها لعدم وجود ما ينفيها،"], [1805.0, "وإن كانت النُّقلةُ من لوازم نزول المخلوق،"], [1808.0, "لكنّنا نتكلّم الآن عن نزول الخالق."], [1812.0, "وليس كلُّ شيءٍ لزم على صفة المخلوق لا بدّ وأن يلزم على صفة الخالق؛"], [1818.0, "لأنّ الله عز وجل <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>،"], [1820.7, "لا في مجيئه، ولا في إتيانه،"], [1823.1, "ولا في نزوله عز وجل."], [1825.0, "فجميعُ متعلّقات الصفة لا حقَّ لك أن تُثبتها بلا دليل،"], [1830.3, "ولا أن تنفيها بلا دليل؛"], [1833.0, "لأنه أمرٌ غيبيّ، والمتقرّر في القواعد أنّ ما كان غيبيًّا فيكون توقيفيًّا."]], "tr": [[1778.0, "Bunlardan biri de şudur: Bazı insanlar şöyle dedi:"], [1781.5, "Biz Allah Azze ve Celle'nin nüzulünü nefyediyoruz;"], [1786.0, "çünkü Allah'ın nüzulünün lâzımlarından biri nukledir (yer değiştirmedir), yani bir mekândan bir mekâna intikaldir."], [1791.0, "Deriz ki: Nukleyi, onu isbat eden bir şey bulunmadığı için isbat etmeyiz;"], [1801.7, "onu nefyeden bir şey bulunmadığı için nefyetmeyiz de."], [1806.3, "Nukle mahlûkun nüzulünün lâzımlarından olsa bile, biz şimdi Hâlık'ın nüzulünden bahsediyoruz."], [1812.0, "Mahlûkun sıfatına lâzım olan her şeyin Hâlık'ın sıfatına da lâzım olması gerekmez."], [1818.0, "Çünkü Allah Azze ve Celle <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11];"], [1821.9, "ne gelişinde (mecî), ne gelişinde (ityân), ne de nüzulünde."], [1825.0, "Sıfatın bütün taalluklarını delilsiz isbat etmeye de, delilsiz nefyetmeye de hakkın yoktur;"], [1833.0, "çünkü bu gaybî bir iştir ve kaidelerde sabit olan şudur:"], [1837.7, "Gaybî olan şey tevkîfîdir (nassa bağlıdır)."]]}, {"reader": false, "ar": [[1841.0, "ومنها: قولُ بعضهم بأنّنا لا بدّ أن نؤوّل صفاتِ الذات لأنّ إثباتها يقتضي التجسيم ـ كما قاله المعتزلة ـ."], [1859.0, "فنقول: إنّ إثبات التجسيم أو نفيَه من الخطأ العظيم؛"], [1871.0, "وذلك لأنّ الله عز وجل ونبيَّه صلى الله عليه وسلم قد أثبت هذه الصفات،"], [1878.0, "ولم يُثبت وجودَ جسمٍ ولا انتفاءَ جسم."], [1886.0, "فمسألةُ الجسميّة ـ إثباتًا أو نفيًا ـ لا حقَّ لك أن تتكلّم فيها أبدًا،"], [1893.0, "وقد ذكرتُ لكم سابقًا بأنّ هذا من الألفاظ المجملة التي تحتمل الحقَّ والباطل."]], "tr": [[1841.0, "Bunlardan biri de bazılarının —Mu'tezile'nin dediği gibi— \"Zâtî sıfatları mutlaka te'vil etmeliyiz;"], [1847.7, "çünkü onları isbat etmek tecsîmi gerektirir\" sözüdür."], [1859.0, "Deriz ki: Tecsîmi isbat etmek de nefyetmek de büyük hatadandır."], [1871.0, "Çünkü Allah Azze ve Celle ve Peygamberi sallallâhu aleyhi ve sellem bu sıfatları isbat etmiş, fakat bir cismin varlığını da yokluğunu da isbat etmemiştir."], [1886.0, "Cisimlik meselesinde —isbat veya nefy yönüyle— asla konuşmaya hakkın yoktur."], [1891.8, "Daha önce size bunun hakkı da bâtılı da ihtimal taşıyan mücmel lafızlardan olduğunu zikretmiştim."]]}, {"reader": false, "ar": [[1898.0, "ولو رأيتم السببَ في نفي كثيرٍ من صفات الله عز وجل لوجدتموه أنّ النافيَ قد تكلّم في شيءٍ من متعلّقاتها ممّا لم يَرِد به النصّ،"], [1913.0, "فلمّا خاض فيما لا يجوز لعقله الخوضُ فيه،"], [1917.9, "وزاغ قلبُه، أزاغه الله عز وجل عن الاعتقاد الحقّ."]], "tr": [[1898.0, "Allah Azze ve Celle'nin sıfatlarından birçoğunun nefyedilmesinin sebebine baksaydınız, nefyedenin onların taalluklarından nassın gelmediği bir şey hakkında konuştuğunu görürdünüz."], [1911.8, "Aklının dalması caiz olmayan şeye dalıp kalbi kayınca, Allah Azze ve Celle de onu hak itikattan kaydırdı."]]}]}, {"ts": "32:04", "title": "5. Külliye (devam): Yed ve \"câriha\", ayn ve \"hadeka\", sem' ve \"kulak\"", "paras": [{"reader": false, "ar": [[1924.0, "ومنها أيضًا: قولُهم بأنّ يد الله عز وجل لا تستلزم أن تكون جارحة."], [1939.0, "فنقول: إنّ إطلاق الجوارح على الله عز وجل أو على شيءٍ من صفات الله عز وجل هذا إطلاقٌ لم يأتِ الدليل بإثباته،"], [1948.6, "ولم يأتِ الدليل بنفيه،"], [1951.0, "حتى وإن كان الوصفُ بالجارحة من لوازم صفات المخلوق."], [1957.0, "إلّا أنّنا الآن نتكلّم عن يد الله،"], [1960.7, "وعين الله، ورِجل الله،"], [1962.9, "وقدم الله، وساق الله؛"], [1965.0, "فهذه صفاتٌ أثبتها الله عز وجل لنفسه،"], [1968.8, "يجب علينا أن نُثبتها كما أثبتها،"], [1972.4, "وأن نسكت عن متعلّقاتها التي لم يأتِ الدليلُ بإثباتها ولا بنفيها."], [1980.0, "فلا ندخل في هذا الباب متأوّلين بآرائنا،"], [1984.9, "ولا متوهّمين بأهوائنا؛ لأنّ الأمر غيبٌ فيجب فيه التوقيف."], [1991.0, "ووالله لا سلامةَ للعقل ولا للقلب ولا للاعتقاد ما دمتَ تسمح لعقلك أن يتخوّض في متعلّقات الصفة بلا نصٍّ ولا برهان."]], "tr": [[1924.0, "Bunlardan biri de onların \"Allah Azze ve Celle'nin eli (yed) câriha (uzuv) olmayı gerektirmez\" sözüdür."], [1939.0, "Deriz ki: \"Cevârih\" (uzuvlar) lafzını Allah Azze ve Celle'ye veya Allah Azze ve Celle'nin sıfatlarından birine nispet etmek, delilin ne isbatını ne de nefyini getirdiği bir ıtlaktır;"], [1951.7, "câriha ile vasıflanmak mahlûkun sıfatlarının lâzımlarından olsa bile."], [1957.0, "Ancak biz şimdi Allah'ın elinden, Allah'ın gözünden, Allah'ın ayağından (ricl), Allah'ın kademinden ve Allah'ın incik (sâk) sıfatından bahsediyoruz."], [1965.0, "Bunlar Allah Azze ve Celle'nin kendisi için isbat ettiği sıfatlardır;"], [1969.4, "onları O'nun isbat ettiği gibi isbat etmemiz ve delilin ne isbatını ne de nefyini getirdiği taalluklarından sükût etmemiz vaciptir."], [1980.0, "Bu kapıya ne görüşlerimizle te'vil ederek ne de hevâlarımızla vehme kapılarak gireriz;"], [1987.0, "çünkü bu iş gaybdır, onda tevkîf (nassa bağlı kalmak) vaciptir."], [1991.0, "Vallahi, aklının nas ve burhan olmaksızın sıfatın taalluklarına dalmasına izin verdiğin sürece ne akıl için, ne kalp için, ne de itikat için selâmet vardır."]]}, {"reader": false, "ar": [[2003.0, "ومنها أيضًا: قولُهم بأنّ عين الله لا تستلزم الحدقة."], [2012.0, "فنقول: إنّ إثبات الحدقة لعين الله عز وجل أو نفيَها من الأمور التي سكت عنها النصّ؛"], [2024.0, "فإنّ الحدقة وإن كانت من لوازم عين المخلوق،"], [2028.0, "إلا أنه ليس كلُّ لازمٍ على صفة المخلوق لا بدّ أن يلزم على صفة الخالق."], [2035.0, "فعينُ الله عز وجل لائقةٌ بجلاله وعظمته،"], [2040.0, "لا تماثل أعينَ المخلوقين،"], [2043.0, "فلا يجوز لنا أن نُثبت شيئًا من متعلّقات هذه العين ولا شيئًا من لوازمها،"], [2050.0, "إلا إذا كان قائدَنا في هذا الإثبات النصُّ الصحيح."], [2055.0, "وإلّا ـ والله ـ فإنّ السكوت أسلم؛"], [2058.0, "فنحن سكتنا فسلِمنا، وهم تخوّضوا فضلّوا."]], "tr": [[2003.0, "Bunlardan biri de onların \"Allah'ın gözü (ayn) hadekayı (göz bebeğini) gerektirmez\" sözüdür."], [2012.0, "Deriz ki: Allah Azze ve Celle'nin gözü için hadekayı isbat etmek de nefyetmek de nassın sükût ettiği işlerdendir."], [2024.0, "Hadeka mahlûkun gözünün lâzımlarından olsa bile, mahlûkun sıfatına lâzım olan her şeyin Hâlık'ın sıfatına da lâzım olması gerekmez."], [2035.0, "Allah Azze ve Celle'nin gözü O'nun celâline ve azametine layıktır, mahlûkların gözlerine benzemez."], [2044.0, "Bu isbatta bize önderlik eden sahih nas olmadıkça, bu gözün taalluklarından ve lâzımlarından herhangi bir şeyi isbat etmemiz caiz değildir."], [2055.0, "Aksi hâlde —vallahi— sükût daha selâmetlidir:"], [2058.0, "Biz sükût ettik ve selâmette kaldık; onlar daldılar ve saptılar."]]}, {"reader": false, "ar": [[2066.0, "ومن ذلك أيضًا ـ أنا طوّلتُ فيها؛"], [2069.0, "الكلّيّة مفيدةٌ جدًّا ـ ومنها أيضًا:"], [2073.0, "ذهب بعض الناس إلى أنه إذا أثبت سمعَ الله فإنه يتكلّف نفيَ الأذن والصِّماخ،"], [2081.0, "فيقول: يسمع بلا أذنٍ ولا صِماخ."], [2086.0, "وهذا نفيٌ باطل، كما أنّ إثباته باطل؛"], [2094.0, "فلا يجوز لنا أن نتكلّم في شيءٍ من متعلّقات سمع الله عز وجل إلا ببرهان."], [2102.0, "ويكفينا أن نؤمن بأنّ لله عز وجل سمعًا لائقًا بجلاله وعظمته،"], [2111.0, "لا يلزم عليه ما يلزم على صفة سمع المخلوقين؛"], [2116.0, "فإنّ الله عز وجل كاملٌ الكمالَ المطلق في ذاته وفي صفاته وأفعاله عز وجل."]], "tr": [[2066.0, "Bundan biri de şudur —bunda uzattım;"], [2069.0, "külliye çok faydalıdır—: Bazı insanlar, Allah'ın işitmesini (sem') isbat ettiğinde kulağı ve kulak deliğini (sımâh) nefyetmeye zorlanır ve \"Kulaksız ve kulak deliksiz işitir\" der."], [2081.8, "Bu bâtıl bir nefydir; nitekim onu isbat etmek de bâtıldır."], [2094.0, "Allah Azze ve Celle'nin işitmesinin taalluklarından herhangi bir şey hakkında burhan olmadan konuşmamız caiz değildir."], [2102.0, "Allah Azze ve Celle'nin, celâline ve azametine layık, mahlûkların işitme sıfatına lâzım olan şeylerin kendisine lâzım gelmediği bir işitmesi olduğuna iman etmemiz bize yeter."], [2117.3, "Çünkü Allah Azze ve Celle zâtında, sıfatlarında ve fiillerinde mutlak kemâlle kâmildir."]]}]}, {"ts": "35:25", "title": "5. Külliye (devam): Beyhakî'nin bu taallukları nefyetmesi selefin menheci değildir", "paras": [{"reader": false, "ar": [[2125.0, "ولذلك فلا أزال أقول:"], [2127.9, "رحم الله الإمامَ البيهقيّ لمّا أثبت الصفات ونفى شيئًا من متعلّقاتها من غير دليل،"], [2140.0, "فقال رحمه الله: «وأنّ إتيانه ليس بإتيانٍ من مكانٍ إلى مكان، وأنّ مجيئه ليس بحركة، وأنّ نزوله ليس بنُقلة، وأنّ نفسه ليس بجسم، وأنّ وجهه ليس بصورة، وأنّ يده ليست بجارحة، وأنّ عينه ليست بحدقة»."], [2158.0, "انتهى كلامه. فيا ليته أثبت ولم ينفِ هذه المتعلّقات؛"], [2166.0, "لأنه لم يأتِ بدليلٍ على نفيها،"], [2171.0, "فأسأل الله أن يغفر له هذا النفيَ الذي لم يدلّ عليه دليل، ولم يؤيّده برهان."]], "tr": [[2125.0, "Bu yüzden hep şöyle derim:"], [2127.9, "Allah, sıfatları isbat edip onların taalluklarından bir kısmını delilsiz nefyettiğinde İmam Beyhakî'ye rahmet etsin."], [2136.9, "—Allah ona rahmet etsin— şöyle demiştir:"], [2141.4, "\"O'nun gelişi (ityân) bir mekândan bir mekâna geliş değildir;"], [2147.5, "gelişi (mecî) hareketle değildir; nüzulü nukle değildir;"], [2152.5, "nefsi cisim değildir; yüzü suret değildir;"], [2158.0, "eli câriha değildir; gözü hadeka değildir.\" Sözü burada bitti."], [2161.6, "Keşke isbat etseydi de bu taallukları nefyetmeseydi;"], [2166.0, "çünkü onları nefyetmeye dair bir delil getirmedi."], [2171.3, "Allah'tan, ona hiçbir delilin delâlet etmediği ve hiçbir burhanın desteklemediği bu nefyini bağışlamasını dilerim."]]}, {"reader": false, "ar": [[2178.0, "فهذه الطريقة التي سلكها الإمام رحمه الله تعالى ـ في الإثبات مع نفي تلك المتعلّقات ـ ليست منهجًا للسلف،"], [2188.0, "ولا تمتّ أبدًا بوجهٍ من الوجوه إلى ما قرّره أهلُ السنة والجماعة،"], [2197.0, "بل هي إلى منهج أهل البدع أقرب."], [2201.0, "والسلف يُثبتون هذه الصفات مع نفي التشبيه والتمثيل والتكييف والتحريف،"], [2208.0, "ولا يدخلون في التفاصيل في النفي والإثبات لشيءٍ من تلك المتعلّقات إلا إذا دلّ عليها الدليلُ الصحيح الصريح."], [2221.0, "والكلّيّة واضحةٌ إن شاء الله، والله أعلم."]], "tr": [[2178.0, "İmamın —Allah Teâlâ ona rahmet etsin— tuttuğu bu yol, yani isbatla birlikte o taallukları nefyetmek, selefin menheci değildir ve hiçbir yönden Ehl-i Sünnet ve'l-Cemaat'in takrir ettiği şeyle asla bir ilgisi yoktur;"], [2197.6, "bilakis bid'at ehlinin menhecine daha yakındır."], [2201.0, "Selef bu sıfatları teşbih, temsil, tekyîf ve tahrifi nefyederek isbat eder;"], [2208.8, "o taalluklardan herhangi birinin nefy ve isbatında, sahih ve sarih delil delâlet etmedikçe tafsilata girmez."], [2221.0, "Külliye inşallah açıktır. Allah en iyisini bilir."]]}]}, {"ts": "37:03", "title": "6. Külliye: Nasların lafızlarıyla gelen şeyin yerine başka bir ifade konmamalıdır", "paras": [{"reader": false, "ar": [[2223.0, "طيّب، ومن الكلّيّات أيضًا:"], [2227.0, "<b>كلُّ ما وردت به ألفاظُ النصوص فلا ينبغي الاستعاضةُ عنه بغيره.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2223.0, "Peki. Külliyelerden biri de şudur:"], [2227.0, "<b>6. külliye: Nasların lafızlarıyla gelen her şeyin yerine başkasını koymak uygun değildir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2245.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرّر في قواعد أهل العلم أنّ التعبير عن المعاني الشرعيّة بألفاظ النصوص أَولى."], [2254.0, "فإن قلتَ: ولماذا يُفضَّل الالتزامُ بألفاظ النصوص؟"], [2260.0, "ـ وهو سؤالٌ مشروعٌ على هذه الكلّيّة ـ فأقول:"], [2264.7, "لعدّة أمور. الأمر الأول:"], [2268.0, "أنه التعبير الذي لا يمكن أن يعارضه أهلُ البدع؛"], [2274.0, "فإنك مهما عبّرتَ عن هذا المعنى الشرعيّ بشيءٍ من تعبيرك فإنه مؤهَّلٌ لمعارضة أهل البدع لأنه يُنسب لك،"], [2283.0, "لكن إذا عبّرتَ عن هذا المعنى الشرعيّ بألفاظ الكتاب والسنة فإنّ ذلك أبعدُ أن يعارضك أهلُ البدع؛"], [2293.7, "لأنّ معارضتهم ستكون معارضةً للنصّ،"], [2297.0, "وأهلُ البدع لا يجرؤون على التصريح بذلك."]], "tr": [[2245.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [2247.6, "İlim ehlinin kaidelerinde sabit olan, şer'î manaları nasların lafızlarıyla ifade etmenin daha evlâ olduğudur."], [2254.0, "Eğer \"Nasların lafızlarına bağlı kalmak neden tercih edilir?\" dersen —ki bu, bu külliyeye yöneltilebilecek meşru bir sorudur— birkaç sebepten dolayı, derim."], [2268.0, "Birinci sebep: Bu, bid'at ehlinin itiraz edemeyeceği ifadedir."], [2274.0, "Çünkü bu şer'î manayı kendi ifadenden bir şeyle ne kadar ifade edersen et, o ifade sana nispet edildiği için bid'at ehlinin itirazına açıktır."], [2283.6, "Fakat bu şer'î manayı Kitap ve Sünnet'in lafızlarıyla ifade edersen, bid'at ehlinin sana itiraz etmesi daha uzak bir ihtimaldir;"], [2293.7, "çünkü onların itirazı nassa itiraz olur ve bid'at ehli bunu açıkça söylemeye cesaret edemez."]]}, {"reader": false, "ar": [[2299.0, "ومن الأوجه أيضًا: أنه أسلمُ من دخول ما لا يريده الشارعُ في هذا المعنى الشرعيّ؛"], [2310.0, "فإنّ العبد مهما بلغت فصاحتُه وبلاغتُه فإنه قد يُدخِلُ تعبيرُه عن هذا المعنى الشرعيّ شيئًا ليس منه،"], [2321.0, "أو يَخرج منه شيءٌ منه."], [2326.0, "فحتى يكون تعبيرُك عن هذا المعنى الشرعيّ جامعًا لكلّ أفراده،"], [2333.0, "ومانعًا من دخول غيرها،"], [2336.0, "فتلتزم حينئذٍ بالتعبير الشرعيّ."]], "tr": [[2299.0, "Sebeplerden biri de şudur: Bu, Şâri'in murad etmediği bir şeyin bu şer'î manaya girmesinden daha selâmetlidir."], [2310.0, "Çünkü kulun fesâhati ve belâgati ne kadar ileri olursa olsun, bu şer'î manayı ifadesi, ona ondan olmayan bir şeyi sokabilir veya ondan olan bir şey dışarıda kalabilir."], [2326.0, "Bu şer'î manayı ifaden onun bütün fertlerini kapsayıcı (câmi') ve başkasının girmesine engel (mâni') olsun diye, o zaman şer'î ifadeye bağlı kalırsın."]]}]}, {"ts": "39:01", "title": "6. Külliye (devam): Nasların lafızları Allah'ın sevdiği ve daha dakik ifadedir", "paras": [{"reader": false, "ar": [[2341.0, "ومنها أيضًا: أنّ التعبير عن المعنى الشرعيّ بألفاظ النصوص هو المحبوب لله عز وجل؛"], [2351.0, "فنحن جزمنا بأنّ الله لم يتخيّر تلك الألفاظ للتعبير عن هذا المعنى الشرعيّ إلا وهو يحبّ التعبير عنه بهذا اللفظ."], [2361.0, "وأمّا التعبير عنه بألفاظك الخاصّة فإنّنا لا ندري عن الله في سمائه:"], [2367.2, "أرضِيَ عن هذا التعبير أو لم يرضَه؟"], [2370.0, "أيحبّ التعبير عن هذا المعنى الشرعيّ بتلك الألفاظ أو لم يحبّ؟"], [2376.0, "فلماذا ننتقل عن المجزوم به إلى ما هو مشكوكٌ فيه؟ فهمتم هذا؟"]], "tr": [[2341.0, "Sebeplerden biri de şudur: Şer'î manayı nasların lafızlarıyla ifade etmek, Allah Azze ve Celle'nin sevdiği şeydir."], [2351.0, "Biz kesin olarak biliyoruz ki Allah bu şer'î manayı ifade etmek için o lafızları ancak onu bu lafızla ifade etmeyi sevdiği için seçmiştir."], [2361.0, "Onu kendi özel lafızlarınla ifade etmene gelince, semasında olan Allah'ın bu ifadeden razı olup olmadığını, bu şer'î manayı o lafızlarla ifade etmeyi sevip sevmediğini bilemeyiz."], [2376.0, "O hâlde neden kesin olandan şüpheli olana geçelim? Bunu anladınız mı?"]]}, {"reader": false, "ar": [[2385.0, "ومنها أيضًا: أنه أدقّ في التعبير؛"], [2388.0, "أنّ ألفاظ النصوص أدقّ في التعبير عن المعنى الشرعيّ،"], [2397.0, "فإنها إنما وُضِعت لتؤدّي المعنى بدقّة،"], [2405.0, "وتغييرُها قد يؤدّي إلى نقص المعنى أو الزيادة فيه."]], "tr": [[2385.0, "Sebeplerden biri de şudur: Bu, ifadede daha dakiktir;"], [2388.0, "yani nasların lafızları şer'î manayı ifadede daha dakiktir."], [2393.0, "Çünkü onlar manayı dakik bir şekilde edâ etmek için konulmuştur;"], [2405.4, "onları değiştirmek, manada eksilmeye veya ziyadeye yol açabilir."]]}, {"reader": false, "ar": [[2409.0, "وبناءً على ذلك: فالمحافظة على الاصطلاح الشرعيّ ـ انتبهوا لما أقول ـ رمزٌ على قوّة الأمّة ووحدتها،"], [2422.0, "ودليلٌ على الوعي والثبات،"], [2426.0, "وهو من أعظم علامات الرسوخ في العلم."], [2429.0, "فليس الرسوخ في العلم تشقيقَ العبارات وترتيبَ المفردات،"], [2435.0, "وإنما الرسوخ العلميّ أن تجزم بافتقارك العظيم لنصّ الشارع للتعبير عن هذا المعنى الشرعيّ،"], [2443.0, "وكلّما عظم افتقارُ قلب العالم استشعارًا للنصّ الشرعيّ كلّما عظم رسوخُه في العلم."]], "tr": [[2409.0, "Buna göre: Şer'î ıstılahı korumak —söylediğime dikkat edin— ümmetin kuvvetinin ve birliğinin sembolü, şuurun ve sebatın delilidir;"], [2426.0, "ilimde rusûhun (derinleşmenin) en büyük alametlerindendir."], [2429.0, "İlimde rusûh, ibareleri dallandırıp budaklandırmak ve kelimeleri dizmek değildir."], [2434.1, "İlmî rusûh, bu şer'î manayı ifade etmek için Şâri'in nassına büyük ihtiyacını kesin olarak bilmendir."], [2442.5, "Âlimin kalbinin şer'î nassı hissederek ona ihtiyacı ne kadar büyürse, ilimdeki rusûhu da o kadar büyür."]]}, {"reader": false, "ar": [[2451.0, "فلا ينبغي أبدًا أن تستسهل بالنصّ الشرعيّ والتعبير الشرعيّ،"], [2459.0, "بناءً على أنك ستستعيض عنه بعباراتك الجميلة،"], [2463.9, "وتراكيب مفرداتك الحلوة، وسجعك الطريّ الذي يأخذ بالألباب."], [2472.0, "فمتى ما استشعرتَ أنّ تعبيرك أفضل،"], [2475.0, "أو أدخلُ في تحقيق المقصود الشرعيّ،"], [2480.0, "فإنّ ذلك لنقص فهمك،"], [2482.8, "ونقص علمك، ونقص رسوخك في العلم."]], "tr": [[2451.0, "Güzel ibarelerinle, tatlı kelime terkiplerinle ve akılları baştan alan taze secilerinle onun yerini dolduracağın düşüncesiyle şer'î nassı ve şer'î ifadeyi asla hafife almaman gerekir."], [2472.0, "Ne zaman kendi ifadenin daha üstün veya şer'î maksadı gerçekleştirmeye daha elverişli olduğunu hissedersen, bu, anlayışının eksikliğinden, ilminin eksikliğinden ve ilimdeki rusûhunun eksikliğindendir."]]}]}, {"ts": "41:28", "title": "6. Külliye (devam): Sedd-i zerâi' ve \"ıstılah istilası\"", "paras": [{"reader": false, "ar": [[2488.0, "ومن المعلوم أنّ سدَّ الذرائع من واجبات الشرع؛"], [2497.0, "فحتى نربّي الناس على عدم الخروج عن الشرع نربّيهم ألّا يخرجوا عن نصوص الشرع،"], [2505.0, "لأنّنا متى ما ربّيناهم على التعبيرات التي لا توافق النصَّ فإنّ ذلك قد يربّيهم على التلاعب بهذه الأسماء وتحميلِها ما لم تحتمل."], [2518.0, "فإنّ العبث بالأسماء الشرعيّة بات في هذا العصر صورةً من صور العدوان على الأدلّة،"], [2527.0, "وهذا ما يسمّيه أهل العلم بـ«غزو المصطلحات»."]], "tr": [[2488.0, "Bilinen bir şeydir ki sedd-i zerâi' şeriatın vaciplerindendir."], [2497.0, "İnsanları şeriatın dışına çıkmamak üzere terbiye etmek için, onları şeriatın naslarının dışına çıkmamak üzere terbiye ederiz."], [2506.4, "Çünkü onları nassa uymayan ifadelerle terbiye ettiğimizde, bu onları bu isimlerle oynamaya ve onlara taşıyamayacakları anlamlar yüklemeye alıştırabilir."], [2518.0, "Şer'î isimlerle oynamak bu çağda delillere saldırının suretlerinden biri hâline gelmiştir;"], [2525.7, "ilim ehlinin \"ıstılah istilası\" (gazvü'l-mustalahât) dediği şey budur."]]}, {"reader": false, "ar": [[2533.0, "حتى سمَّوا الخمرَ بأمّ الأرواح <span class=\"q\">؟ 42:13<\/span>،"], [2537.0, "وسمَّوا اختلاطَ الرجال بالنساء تقدّمًا وحضارةً ورُقيًّا وانفتاحًا،"], [2543.0, "وسمَّوا الكافرَ بمسمّى «الآخر»،"], [2547.0, "وسمَّوا النفاقَ بالحداثة والليبراليّة والحرّيّة."], [2554.0, "بل وسمّى المعتزلةُ نفيَ صفات الله عز وجل توحيدًا،"], [2562.0, "وسمَّوا الخروجَ على الحكّام أمرًا بالمعروف ونهيًا عن المنكر،"], [2569.0, "وسمَّوا تخليدَ مرتكب الكبيرة بالعدل؛"], [2578.0, "فالعدلُ عندهم تخليدُ مرتكب الكبيرة في النار."]], "tr": [[2533.0, "Öyle ki içkiye \"ruhların anası\" <span class=\"q\">؟<\/span> dediler;"], [2537.0, "kadın erkek karışıklığına ilerleme, medeniyet, yükseliş ve açılım dediler;"], [2543.0, "kâfire \"öteki\" adını verdiler; nifaka modernizm, liberalizm ve hürriyet dediler."], [2554.0, "Hatta Mu'tezile Allah Azze ve Celle'nin sıfatlarını nefyetmeye \"tevhid\" dedi;"], [2559.7, "yöneticilere karşı ayaklanmaya \"emr-i bi'l-ma'rûf ve nehy-i ani'l-münker\" dediler;"], [2567.0, "büyük günah işleyenin (cehennemde) ebedî kalmasına \"adalet\" dediler."], [2578.0, "Onlara göre adalet, büyük günah işleyenin ateşte ebedî kalmasıdır."]]}, {"reader": false, "ar": [[2584.0, "ولذلك لا ينبغي للعاقل أن يربّي الناس على الخروج عن مصطلحات الشرع؛"], [2594.0, "فإنّ الخروج عن المصطلحات درجةٌ للخروج عن معانيها ـ صوّرتموها؟"], [2604.0, "ـ فإنّ الخروج عن مصطلحات الشرع درجةٌ في الخروج عن معانيها،"], [2612.0, "فإذا كنّا نمنع الدرجة الأولى فلن يصل الناس إلى ما وراءها."], [2618.1, "كالتمثيل درجةٌ للتعطيل، وكذلك تعطيلُ المصطلحات الشرعيّة والتعبيرُ عن المعاني الشرعيّة بغيرها درجةٌ لولوج الناس إلى تغيير معانيها."]], "tr": [[2584.0, "Bu yüzden akıllı kimsenin insanları şeriatın ıstılahlarının dışına çıkmaya alıştırması uygun değildir."], [2594.0, "Çünkü ıstılahların dışına çıkmak, onların manalarının dışına çıkmak için bir basamaktır —tasavvur ettiniz mi?— Şeriatın ıstılahlarının dışına çıkmak, onların manalarının dışına çıkmada bir basamaktır;"], [2613.6, "biz ilk basamağı engellersek insanlar onun ötesine ulaşamaz."], [2618.1, "Temsilin ta'tile bir basamak olması gibi, şer'î ıstılahları işlevsiz bırakmak ve şer'î manaları başka ifadelerle ifade etmek de insanların o manaları değiştirmeye girişmesi için bir basamaktır."]]}, {"reader": false, "ar": [[2631.0, "ألا ترى أنّ القبوريّين يسمّون السجودَ للقبور والركوعَ لها،"], [2638.0, "ودعاءَها من دون الله،"], [2641.3, "والطوافَ بها، والاستغاثةَ بها،"], [2644.0, "تعظيمًا لأقدار الأولياء والصالحين؟"], [2647.0, "أليس كذلك؟ ألا ترون أنّ المعطّلة يسمّون تحريفَ الصفات ونفيَها تنزيهًا لله عز وجل عمّا لا يليق؟"], [2659.0, "فالتلاعب بالمصطلحات الشرعيّة يُفضي ـ ولو بعد حين ـ للتلاعب بمعانيها،"], [2670.0, "فسدًّا لذريعة الولوج إلى التلاعب بالمعنى لا بدّ أن نسدّها بمنع التلاعب في المصطلحات."]], "tr": [[2631.0, "Görmüyor musun ki kabirciler kabirlere secde etmeye, onlara rükû etmeye, Allah'ı bırakıp onlara dua etmeye, onları tavaf etmeye ve onlardan medet istemeye \"evliyanın ve salihlerin kadrini tazim\" diyorlar?"], [2647.0, "Öyle değil mi? Görmüyor musunuz ki Muattıla sıfatları tahrif etmeye ve nefyetmeye \"Allah Azze ve Celle'yi layık olmayandan tenzih\" diyor?"], [2659.0, "Şer'î ıstılahlarla oynamak, bir süre sonra da olsa, onların manalarıyla oynamaya götürür."], [2671.3, "Manayla oynamaya girişmenin yolunu kapatmak için, bu yolu ıstılahlarla oynamayı engelleyerek kapatmamız şarttır."]]}, {"reader": false, "ar": [[2679.0, "ولذلك قال الإمام ابن القيّم مقرّرًا لهذه الكلّيّة،"], [2685.0, "قال: «فحدودُ ما أنزل الله هو الوقوفُ عند حدّ الاسم الذي يُعلَّق عليه الحِلُّ والحرمة، فإنه هو المنزَّل على رسول الله صلى الله عليه وسلم». انتهى كلامه."]], "tr": [[2679.0, "Bu yüzden İmam İbnü'l-Kayyim bu külliyeyi takrir ederek şöyle demiştir:"], [2685.7, "\"Allah'ın indirdiğinin sınırları, helal ve haramın kendisine bağlandığı ismin sınırında durmaktır;"], [2695.2, "çünkü Resûlullah sallallâhu aleyhi ve sellem'e indirilen odur.\" Sözü burada bitti."]]}]}, {"ts": "45:02", "title": "6. Külliye (devam): \"Te'vil\" yerine \"tahrif\", \"hudûs gerektiren sıfatlar\" yerine \"fiilî / ihtiyârî sıfatlar\"", "paras": [{"reader": false, "ar": [[2702.0, "فهذا يدلّنا على أنه لا ينبغي لطالب العلم أن يعوّد نفسه على أن يخرج عن شيءٍ من المصطلحات الشرعيّة."], [2712.0, "وبناءً على ذلك: فتسميةُ ما يفعله المعطّلة في صفات الله عز وجل تحريفًا أَولى من تسميته بالتأويل؛"], [2726.0, "لأنّ التحريف هو الذي أثبته الله عز وجل لذلك،"], [2730.0, "كما قال عز وجل:"], [2732.0, "<span class=\"ayah\">﴿يُحَرِّفُونَ الْكَلِمَ عَن مَّوَاضِعِهِ﴾<\/span> <span class=\"ref\">[النساء: ٤٦]<\/span>،"], [2734.0, "وفي آيةٍ أخرى قال:"], [2736.2, "<span class=\"ayah\">﴿يُحَرِّفُونَ الْكَلِمَ مِن بَعْدِ مَوَاضِعِهِ﴾<\/span> <span class=\"ref\">[المائدة: ٤١]<\/span>."], [2739.0, "فما يفعله أهلُ التعطيل في صفات الله حقيقتُه تحريفٌ، وليس تأويلًا."]], "tr": [[2702.0, "Bu bize gösterir ki ilim talebesinin kendini şer'î ıstılahlardan herhangi birinin dışına çıkmaya alıştırması uygun değildir."], [2712.0, "Buna göre: Muattıla'nın Allah Azze ve Celle'nin sıfatlarında yaptığına \"tahrif\" demek, ona \"te'vil\" demekten daha evlâdır."], [2726.0, "Çünkü Allah Azze ve Celle'nin bunun için isbat ettiği (isim) tahriftir."], [2729.6, "Nitekim Azze ve Celle şöyle buyurmuştur:"], [2732.0, "<span class=\"ayah\">﴿Kelimeleri yerlerinden kaydırırlar﴾<\/span> [Nisâ 46];"], [2733.5, "başka bir ayette de şöyle buyurmuştur:"], [2736.2, "<span class=\"ayah\">﴿Kelimeleri yerlerine konduktan sonra kaydırırlar﴾<\/span> [Mâide 41]."], [2739.9, "Ta'til ehlinin Allah'ın sıfatlarında yaptığının hakikati tahriftir, te'vil değildir."]]}, {"reader": false, "ar": [[2746.0, "ونقول أيضًا: قولُهم بأنّ الصفات التي ـ قولُهم:"], [2752.8, "«الصفات التي تقتضي حدوثًا» ـ وهذا تعبيرٌ محدَث."], [2760.0, "والحقّ أن نصف الله عز وجل بالصفات الفعليّة،"], [2764.0, "فنقول: <span class=\"ayah\">﴿فَعَّالٌ لِّمَا يُرِيدُ﴾<\/span> <span class=\"ref\">[البروج: ١٦]<\/span>،"], [2767.0, "أو نصفَه بالصفات الاختياريّة،"], [2770.0, "في قول الله عز وجل:"], [2772.0, "<span class=\"ayah\">﴿وَرَبُّكَ يَخْلُقُ مَا يَشَاءُ وَيَخْتَارُ﴾<\/span> <span class=\"ref\">[القصص: ٦٨]<\/span> <span class=\"note\">(يكررها)<\/span>،"], [2777.0, "فأثبت لنفسه الفعلَ والاختيار."], [2780.0, "فتسميةُ الجهميّة لهذه الصفات بأنها «صفاتٌ تقتضي الحدوث» هذه تسميةٌ محدَثة وتعبيرٌ باطل."]], "tr": [[2746.0, "Şunu da söyleriz: Onların \"…olan sıfatlar\" sözü —onların \"hudûs (sonradan olmayı) gerektiren sıfatlar\" sözü— sonradan uydurulmuş bir ifadedir."], [2760.0, "Hak olan, Allah Azze ve Celle'yi fiilî sıfatlarla vasıflandırmamızdır;"], [2762.5, "<span class=\"ayah\">﴿Dilediğini yapandır﴾<\/span> [Burûc 16] deriz."], [2764.8, "Yahut O'nu ihtiyârî sıfatlarla vasıflandırırız;"], [2767.8, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [2772.0, "<span class=\"ayah\">﴿Rabbin dilediğini yaratır ve seçer﴾<\/span> [Kasas 68] (tekrar ediyor)."], [2775.3, "(Allah) kendisi için fiili ve seçmeyi (ihtiyâr) isbat etmiştir."], [2780.0, "Cehmiyye'nin bu sıfatlara \"hudûsu gerektiren sıfatlar\" demesi sonradan uydurulmuş bir adlandırma ve bâtıl bir ifadedir."]]}, {"reader": false, "ar": [[2791.0, "بل حتى في القواعد الفقهيّة:"], [2794.0, "فلا ينبغي لنا أن نعبّر بـ«الأمور بمقاصدها»،"], [2799.0, "وإنما نعبّر بـ«الأعمال بنيّاتها»؛"], [2802.0, "لأنه اللفظ الذي ورد به النصّ،"], [2804.0, "مع أنّ اللفظ الذي ذكره الفقهاء حقٌّ لا باطلَ فيه،"], [2808.0, "لكنّ التعبير عن المعاني الشرعيّة بألفاظ النصوص أَولى."], [2812.0, "وكذلك قولُ الفقهاء: «الضررُ يُزال»،"], [2818.0, "فالأفضل أن نعبّر عنها بـ«لا ضررَ ولا ضِرار»؛"], [2822.0, "لأنه اللفظ الموافق للشرع."]], "tr": [[2791.0, "Hatta fıkhî kaidelerde bile \"İşler maksatlarına göredir\" (el-umûru bi-makâsıdihâ) diye ifade etmememiz, \"Ameller niyetlerine göredir\" diye ifade etmemiz gerekir;"], [2799.8, "çünkü nassın getirdiği lafız budur."], [2802.0, "Fakihlerin zikrettiği lafız, içinde bâtıl olmayan bir hak olsa da şer'î manaları nasların lafızlarıyla ifade etmek daha evlâdır."], [2808.0, "Aynı şekilde fakihlerin \"Zarar giderilir\" (ed-dararu yuzâl) sözü de;"], [2812.0, "onu \"Zarar vermek de zarara zararla karşılık vermek de yoktur\" (lâ darara ve lâ dırâr) diye ifade etmemiz daha faziletlidir;"], [2822.0, "çünkü şeriata uygun lafız budur."]]}, {"reader": false, "ar": [[2824.0, "وهذه وصيّةٌ لكم في حياتي وبعد مماتي:"], [2827.0, "أن نعبّر عن المعاني الشرعيّة بألفاظ النصوص ما استطعنا إلى ذلك سبيلًا."]], "tr": [[2824.0, "Bu, hayatımda ve ölümümden sonra size bir vasiyettir:"], [2828.1, "Gücümüz yettiğince şer'î manaları nasların lafızlarıyla ifade edelim."]]}]}, {"ts": "47:13", "title": "6. Külliye (devam): Kitâbü't-Tevhîd, el-Akîdetü'l-Vâsıtiyye ve hadis imamlarının usulü · Kapanış · 7. Külliye'nin metni", "paras": [{"reader": false, "ar": [[2833.0, "ولذلك تميّز «كتابُ التوحيد» و«العقيدةُ الواسطيّة» بهاتين الميزتين؛"], [2840.0, "فإنّ الشيخ محمد بن عبد الوهّاب
