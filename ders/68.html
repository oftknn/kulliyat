z değildir."]]}, {"reader": false, "ar": [[2525.0, "وأمّا القياس الثالث فهو القياس الأولويّ الذي تدلّ عليه هذه الكلّيّة بجزأيها،"], [2535.8, "واللذَين سنذكرهما في كلّيّتين."], [2546.0, "الآن معنى الكلّيّة في جزئيّتها الأولى،"], [2551.0, "وهي قولنا: كلُّ كمالٍ في المخلوق لا نقصَ فيه فالله عز وجل أحقُّ أن يُوصَف به."], [2560.0, "وقد أجمع أهلُ السنة والجماعة على جواز استعمال القياس الأولويّ في حقّ الله عز وجل؛"], [2570.1, "لقول الله عز وجل:"], [2572.8, "<span class=\"ayah\">﴿وَلِلَّهِ الْمَثَلُ الْأَعْلَىٰ﴾<\/span> <span class=\"ref\">[النحل: ٦٠]<\/span> ـ وهو القياس الأولويّ ـ،"], [2579.0, "وقال الله عز وجل:"], [2581.4, "<span class=\"ayah\">﴿وَلَهُ الْمَثَلُ الْأَعْلَىٰ﴾<\/span> <span class=\"ref\">[الروم: ٢٧]<\/span>، أي: القياس الأولويّ."]], "tr": [[2525.0, "Üçüncü kıyasa gelince, o da bu külliyenin iki parçasıyla delâlet ettiği kıyâs-ı evlâdır;"], [2531.8, "bu iki parçayı iki külliye hâlinde zikredeceğiz."], [2546.0, "Şimdi külliyenin birinci parçasının manası;"], [2552.3, "o da \"Mahlûkta bulunan ve içinde noksanlık olmayan her kemalle vasıflanmaya Allah Azze ve Celle daha layıktır\" sözümüzdür."], [2560.0, "Ehl-i Sünnet ve'l-Cemaat, kıyâs-ı evlânın Allah Azze ve Celle hakkında kullanılmasının caiz olduğu üzerinde icmâ etmiştir."], [2570.1, "Çünkü Allah Azze ve Celle <span class=\"ayah\">﴿En yüce sıfat (el-meselü'l-a'lâ) Allah'ındır﴾<\/span> [Nahl 60] buyurmuştur —bu kıyâs-ı evlâdır—;"], [2581.4, "Allah Azze ve Celle <span class=\"ayah\">﴿En yüce sıfat O'nundur﴾<\/span> [Rûm 27] buyurmuştur; yani kıyâs-ı evlâ."]]}]}, {"ts": "43:05", "title": "6. Külliye (devam): İbn Teymiyye ve İbnü'l-Kayyim'den kıyâs-ı evlâ hakkında nakiller", "paras": [{"reader": false, "ar": [[2585.0, "قال ابن تيمية رحمه الله تعالى:"], [2590.0, "«بل لله المثلُ الأعلى، وذلك هو قياسُ الأَولى والأحرى؛ فكلُّ ما ثبت للمخلوق من صفات الكمال فالخالقُ أحقُّ بها، وأولى وأحرى بها منه؛ لأنه أكملُ منه، ولأنه هو الذي أعطاه ذلك الكمال، فالمُعطي الكمالَ لغيره أولى بأن يكون هو موصوفًا به. وكذلك ما كان منتفيًا عن المخلوق لكونه نقصًا وعيبًا، فالخالقُ هو أحقُّ بأن يُنزَّه عن ذلك». انتهى كلامه."]], "tr": [[2585.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2590.0, "\"Bilakis en yüce sıfat (el-meselü'l-a'lâ) Allah'ındır;"], [2593.3, "bu da kıyâs-ı evlâ ve ahrâdır (daha layık ve daha uygun olanın kıyası)."], [2599.4, "Mahlûk için kemal sıfatlarından sabit olan her şeye Yaratıcı daha layıktır;"], [2605.9, "onlara ondan daha evlâ ve daha uygundur."], [2611.7, "Çünkü O, ondan daha kâmildir ve o kemali ona veren O'dur;"], [2619.3, "kemali başkasına veren, onunla vasıflanmaya daha evlâdır."], [2624.3, "Aynı şekilde noksanlık ve kusur olduğu için mahlûktan nefyedilen şeyden tenzih edilmeye Yaratıcı daha layıktır.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[2634.0, "وقال أيضًا: «قياسُ الأَولى، وهو الذي جاء به الكتابُ والسنّة؛ فإنّ الله لا يُماثل غيرَه في شيءٍ من الأشياء حتى يتساويا في حكم القياس، بل هو سبحانه أحقُّ بكلّ حمد، وأبعدُ عن كلّ ذمّ <span class=\"q\">؟ 44:11<\/span>؛ فما كان من صفات الكمال المحضة التي لا نقصَ فيها بوجهٍ من الوجوه فهو أحقُّ به من كلّ ما سواه، وما كان من صفات النقص فهو أحقُّ بتنزيهه عنه من كلّ ما سواه». انتهى كلامه."]], "tr": [[2634.0, "Yine şöyle demiştir: \"Kıyâs-ı evlâ;"], [2637.5, "Kitap ve Sünnet'in getirdiği budur."], [2643.6, "Çünkü Allah, kıyasın hükmünde eşit olacakları şekilde hiçbir şeyde başkasına benzemez;"], [2650.4, "bilakis O Sübhânehû her hamde daha layık ve her yergiden <span class=\"q\">؟<\/span> daha uzaktır."], [2660.4, "Hiçbir şekilde noksanlık bulunmayan saf kemal sıfatlarına O, kendisinden başka her şeyden daha layıktır;"], [2667.6, "noksanlık sıfatlarından tenzih edilmeye de kendisinden başka her şeyden daha layıktır.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[2677.0, "وقال الإمامُ ابن القيّم أيضًا:"], [2679.0, "«وأمّا قياسُ الأَولى فهو غيرُ مستحيلٍ في حقّه، بل هو واجبٌ له، وهو مستعمَلٌ في حقّه عقلًا ونقلًا؛ أمّا العقل فكاستدلالنا على أنّ مُعطي الكمال أحقُّ بالكمال؛ فمن جعل غيره سميعًا بصيرًا عالمًا متكلّمًا حيًّا حكيمًا قادرًا مريدًا رحيمًا محسنًا، فهو أولى بذلك وأحقُّ منه، ويثبت له من هذه الصفات أكملُها وأتمُّها»."]], "tr": [[2677.0, "İmam İbnü'l-Kayyim de şöyle demiştir:"], [2677.4, "\"Kıyâs-ı evlâya gelince, o O'nun hakkında muhal değildir;"], [2677.8, "bilakis O'nun için vâciptir ve O'nun hakkında akıl ve nakil yoluyla kullanılır."], [2679.0, "Akla gelince, kemali verenin kemale daha layık olduğuna dair istidlalimiz gibi:"], [2687.7, "Başkasını işiten, gören, bilen, konuşan, diri, hikmet sahibi, kâdir, irade eden, merhametli ve ihsan eden kılan, buna ondan daha evlâ ve daha layıktır;"], [2707.0, "bu sıfatların en kâmili ve en tamı O'nun için sabittir.\""]]}, {"reader": false, "ar": [[2716.0, "وقال الإمامُ ابن القيّم أيضًا:"], [2719.3, "«كلُّ كمالٍ ثبت للمخلوق غيرِ مستلزمٍ للنقص، فخالقُه ومُعطيه إيّاه أحقُّ بالاتّصاف به، وكلُّ نقصٍ في المخلوق فالخالقُ أحقُّ بالتنزّه عنه»."], [2735.0, "انتهى كلامه رحمه الله تعالى."], [2737.0, "فجميعُ الصفات التي مُدح بها المخلوقُ ممّا لا نقصَ فيه،"], [2745.0, "فالله عز وجل أحقُّ أن يُمدَح بها."]], "tr": [[2716.0, "İmam İbnü'l-Kayyim yine şöyle demiştir:"], [2719.3, "\"Mahlûk için sabit olan ve noksanlığı gerektirmeyen her kemalle vasıflanmaya, onu yaratan ve ona bunu veren daha layıktır."], [2731.2, "Mahlûktaki her noksandan uzak olmaya da Yaratıcı daha layıktır.\" —Sözü burada bitti;"], [2737.0, "Allah ona rahmet etsin. Mahlûkun kendisiyle övüldüğü, içinde noksanlık olmayan bütün sıfatlarla övülmeye Allah Azze ve Celle daha layıktır."]]}]}, {"ts": "45:49", "title": "6. Külliye (devam): «Noksanlık bulunmayan» kaydı niçin? Birinci misal: uyku", "paras": [{"reader": false, "ar": [[2749.0, "فإن قلتَ: ولماذا قيّدتَ هذا الكمال بقولك:"], [2754.1, "«لا نقصَ فيه»؟ فأقول:"], [2756.7, "لأنّ هناك من الكمالات ما ليس كمالًا مطلقًا،"], [2762.0, "وإنما هو كمالٌ في المخلوق من وجه،"], [2766.1, "وليس كمالًا فيه من وجه."], [2769.0, "وأضربُ لكم مثالين: الأوّل:"], [2772.7, "النوم؛ فإنّ النوم كمالٌ في المخلوق،"], [2777.0, "ولذلك من تأخّر نومُه فإنه يحتاج إلى تدخّلٍ طبّيّ،"], [2783.0, "فمن لا ينام أنقصُ في الخِلقة ممّن ينام؛"], [2789.0, "فالنومُ كمالٌ في المخلوق من هذا الوجه."]], "tr": [[2749.0, "Eğer \"Bu kemali niçin 'içinde noksanlık olmayan' sözünle kayıtladın?\" dersen, derim ki:"], [2756.0, "Çünkü kemallerden öylesi vardır ki mutlak kemal değildir;"], [2761.3, "bilakis mahlûkta bir yönden kemal, bir yönden kemal olmayan bir şeydir."], [2769.0, "Size iki misal vereyim. Birincisi:"], [2772.0, "Uyku. Uyku mahlûkta bir kemaldir;"], [2776.3, "bu yüzden uykusu geciken kimse tıbbî müdahaleye ihtiyaç duyar."], [2783.0, "Uyumayan, yaratılış bakımından uyuyandan daha noksandır."], [2789.0, "Bu yönden uyku mahlûkta bir kemaldir."]]}, {"reader": false, "ar": [[2794.0, "لكنّ سببيّةَ النوم تجعله نقصًا في المخلوق؛"], [2799.0, "فإنه إنما يحتاج للنوم لتجديد قوّته وطاقته التي تُعينه على تحصيل مصالح دينه ودنياه،"], [2813.0, "فلو لم ينم لاضطربت عليه أمورُه في الدين والدنيا."], [2820.0, "فالنومُ ليس كمالًا مطلقًا،"], [2823.0, "ولا نقصًا مطلقًا، بل هو كمالٌ من وجهٍ دون وجه،"], [2828.0, "فلا يدخل تحت كلّيّتنا هذه؛"], [2830.0, "لأننا نقول فيها: «كلُّ كمالٍ لا نقصَ فيه»."]], "tr": [[2794.0, "Fakat uykunun sebebi, onu mahlûkta bir noksanlık kılar."], [2799.0, "Çünkü o, dininin ve dünyasının maslahatlarını elde etmesine yardım eden kuvvetini ve enerjisini yenilemek için uykuya muhtaçtır;"], [2814.9, "uyumasa din ve dünya işleri altüst olurdu."], [2820.0, "Uyku ne mutlak kemaldir ne de mutlak noksanlık;"], [2825.0, "bilakis bir yönden kemal, bir yönden değildir."], [2827.6, "Bu yüzden bu külliyemizin altına girmez;"], [2830.0, "çünkü onda \"içinde noksanlık olmayan her kemal\" diyoruz."]]}]}, {"ts": "47:15", "title": "6. Külliye (devam): İkinci misal: çocuk sahibi olmak", "paras": [{"reader": false, "ar": [[2835.0, "والمثالُ الثاني: الإنجابُ والولادة؛"], [2842.0, "فإنّ من يُولَد له أكملُ ممّن لا يُولَد له،"], [2848.0, "ولذلك فإنّ الذي يُولَد له لا يذهب للعلاج ولا للتطبيب؛"], [2855.0, "لأنه جارٍ على العادة البشريّة الإنسانيّة،"], [2859.0, "وأمّا الذي لا يُولَد له فإنه يستعين بالله عز وجل،"], [2865.0, "ثمّ بالأطبّاء على معرفة السببيّة في ذلك."], [2871.0, "فالولادةُ كمالٌ من وجه،"], [2874.0, "ولكنها نقصٌ من وجهٍ آخر."]], "tr": [[2835.0, "İkinci misal: Çocuk sahibi olmak ve doğum."], [2842.0, "Çocuğu olan, çocuğu olmayandan daha kâmildir."], [2846.8, "Bu yüzden çocuğu olan kimse tedaviye ve doktora gitmez;"], [2855.0, "çünkü beşerî, insanî âdet üzere gitmektedir."], [2859.0, "Çocuğu olmayan ise Allah Azze ve Celle'den, sonra da doktorlardan bunun sebebini öğrenmek için yardım ister."], [2871.0, "Çocuk sahibi olmak bir yönden kemaldir, fakat başka bir yönden noksanlıktır."]]}, {"reader": false, "ar": [[2877.0, "وهي أنّ الإنسان بمفرده في هذه الحياة ربّما لا يستطيع أن يقوم بشؤون نفسه ولا بشؤون غيره،"], [2886.0, "فهو محتاجٌ لولدٍ يسعى معه،"], [2889.0, "كما قال الله عز وجل عن إبراهيم ـ عن إسماعيل ـ:"], [2893.0, "<span class=\"ayah\">﴿فَلَمَّا بَلَغَ مَعَهُ السَّعْيَ﴾<\/span> <span class=\"ref\">[الصافات: ١٠٢]<\/span>."], [2896.0, "ولذلك دعا أنبياءُ الله عز وجل بالولد،"], [2903.0, "كما دعا زكريّا وإبراهيمُ عليهم الصلاة والسلام بالولد."], [2911.0, "فلا تدخل الولادةُ معنا في هذه الكلّيّة؛"], [2917.0, "لأننا قلنا: «كلُّ كمالٍ لا نقصَ فيه»؛"], [2921.0, "فالنومُ وإن كان كمالًا لكن فيه نقص،"], [2924.0, "والولادةُ وإن كانت كمالًا لكن فيها نقص."]], "tr": [[2877.0, "O da şudur: İnsan bu hayatta tek başına belki ne kendi işlerini ne de başkasının işlerini yürütebilir;"], [2884.5, "bu yüzden kendisiyle birlikte koşturacak bir çocuğa muhtaçtır."], [2888.4, "Nitekim Allah Azze ve Celle İbrâhim hakkında —İsmâil hakkında— şöyle buyurmuştur:"], [2893.0, "<span class=\"ayah\">﴿Çocuk, onunla birlikte koşup yürüyecek çağa erişince﴾<\/span> [Sâffât 102]."], [2896.0, "Bu sebeple Allah'ın peygamberleri çocuk için dua etmişlerdir;"], [2899.7, "Zekeriyyâ ve İbrâhim —onlara salât ve selâm olsun— çocuk için dua ettikleri gibi."], [2911.0, "Bu yüzden çocuk sahibi olmak bu külliyede bizimle birlikte (kapsamına) girmez;"], [2917.0, "çünkü \"içinde noksanlık olmayan her kemal\" dedik."], [2921.0, "Uyku kemal olsa da onda noksanlık vardır;"], [2923.1, "çocuk sahibi olmak da kemal olsa da onda noksanlık vardır."]]}]}, {"ts": "48:51", "title": "6. Külliye (devam): Noksanlık içermeyen kemal örnekleri · 7. Külliye: Mahlûkta bulunan, kemal içermeyen her noksandan tenzih edilmeye Allah daha layıktır", "paras": [{"reader": false, "ar": [[2931.0, "فالحياةُ كمالٌ في المخلوق لا نقصَ فيها،"], [2935.0, "فالله أحقُّ أن يُوصَف بالحياة."], [2937.0, "والقدرةُ كمالٌ في المخلوق لا نقصَ فيها،"], [2943.0, "فالله أحقُّ أن يُوصَف بالقدرة."], [2945.0, "والعلمُ كمالٌ في المخلوق لا نقصَ فيه،"], [2949.0, "فالله أحقُّ أن يُوصَف بالعلم."], [2952.0, "والسمعُ والبصرُ كمالان في المخلوق لا نقصَ فيهما،"], [2957.0, "فالله أحقُّ أن يُوصَف بالسمع والبصر."], [2960.0, "والرحمةُ كمالٌ في المخلوق لا نقصَ فيها،"], [2963.0, "فالله أحقُّ أن يُوصَف بالرحمة."], [2966.0, "والعزّةُ والحكمةُ كمالان في المخلوق لا نقصَ فيهما،"], [2971.0, "فالله أحقُّ أن يُوصَف بهما."], [2974.0, "وهكذا دواليك في كلّ صفاتِ كمالٍ في المخلوق لا نقصَ فيها بوجهٍ من الوجوه،"], [2981.0, "فالله عز وجل أحقُّ أن يُوصَف بها؛"], [2984.0, "لأنه مُعطي الكمال، ومُعطي الكمال أولى بالكمال."]], "tr": [[2931.0, "Hayat, mahlûkta içinde noksanlık olmayan bir kemaldir;"], [2935.0, "Allah hayatla vasıflanmaya daha layıktır."], [2937.0, "Kudret, mahlûkta içinde noksanlık olmayan bir kemaldir;"], [2943.0, "Allah kudretle vasıflanmaya daha layıktır."], [2945.0, "İlim, mahlûkta içinde noksanlık olmayan bir kemaldir;"], [2949.0, "Allah ilimle vasıflanmaya daha layıktır."], [2952.0, "İşitme ve görme, mahlûkta içlerinde noksanlık olmayan iki kemaldir;"], [2956.4, "Allah işitme ve görmeyle vasıflanmaya daha layıktır."], [2960.0, "Rahmet, mahlûkta içinde noksanlık olmayan bir kemaldir;"], [2963.0, "Allah rahmetle vasıflanmaya daha layıktır."], [2966.0, "İzzet ve hikmet, mahlûkta içlerinde noksanlık olmayan iki kemaldir;"], [2970.4, "Allah bu ikisiyle vasıflanmaya daha layıktır."], [2974.0, "Mahlûkta bulunan ve hiçbir şekilde noksanlık içermeyen bütün kemal sıfatlarında da böyle devam eder;"], [2980.5, "Allah Azze ve Celle onlarla vasıflanmaya daha layıktır."], [2984.0, "Çünkü O, kemali verendir; kemali veren de kemale daha evlâdır."]]}, {"reader": false, "ar": [[2989.7, "طيّب، اكتبوا رأسَ القاعدة:"], [2994.0, "<b>كلُّ نقصٍ في المخلوق لا كمالَ فيه فاللهُ أحقُّ أن يُنزَّه عنه.<\/b>"]], "tr": [[2989.7, "Peki, kaidenin başlığını (metnini) yazın:"], [2994.0, "<b>7. külliye: Mahlûkta bulunan ve içinde kemal olmayan her noksandan tenzih edilmeye Allah daha layıktır.<\/b>"]]}, {"reader": false, "ar": [[2999.0, "خلاص، نكتفي <span class=\"q\">؟ 50:00<\/span> بهذا القدر إن شاء الله، والله أعلم."]], "tr": [[2999.0, "Tamam, inşallah bu kadarıyla yetiniyoruz <span class=\"q\">؟<\/span>. Allah en iyisini bilir."]]}]}]};

function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
