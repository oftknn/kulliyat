<script>
const D={"no": 68, "vid": "5fCgmlXrKe4", "title_ar": "الدرس (٦٨) من شرح كليات العقيدة — كليات في باب الصفات: الكمال المطلق، والواجبات الثلاثة في نصوص الصفات، وأجوبة التحريف، واختلاف الكيفية باختلاف الإضافة، وقياس الأولى", "title_tr": "Şerhu Külliyyâti'l-Akîde — 68. Ders: Sıfatlar Babının Külliyeleri (Sıfatlarda Mutlak Kemal, Sıfat Naslarında Üç Vâcip, Her Tahrife Üç Cevap, İzafetin Farklılığıyla Keyfiyetin Farklılaşması, İsimde Ortaklığın Keyfiyette Ortaklığı Gerektirmemesi, Kıyâs-ı Evlâ)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Allah için isbat ettiğimiz her sıfatta O'nun için mutlak kemal vardır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.6, "والصلاةُ والسلامُ على رسول الله الأمين،"], [3.9, "وعلى آله وأصحابه الطيبين الطاهرين،"], [5.9, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [8.2, "أمّا بعد: فلا نزال ـ ولله الحمدُ والمنّة ـ في سياق الكلّيّات المتعلّقة بباب صفات الله عز وجل،"], [16.3, "وعندنا في هذا الدرس جُمَلٌ من الكلّيّات."], [20.0, "الكلّيّة الأولى: <b>كلُّ صفةٍ نُثبتها لله فله فيها الكمالُ المطلق.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ صفةٍ نُثبتها لله عز وجل فله فيها الكمالُ المطلق.<\/b>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.2, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [8.2, "Bundan sonra: Hamd ve minnet Allah'a, hâlâ Allah Azze ve Celle'nin sıfatları babıyla ilgili külliyeler bağlamındayız."], [16.3, "Bu derste elimizde birtakım külliyeler var."], [20.0, "1. külliye: Allah için isbat ettiğimiz her sıfatta O'nun için mutlak kemal vardır. (Tekrar ediyor.) 1."], [24.0, "külliye: Allah Azze ve Celle için isbat ettiğimiz her sıfatta O'nun için mutlak kemal vardır."]]}, {"reader": false, "ar": [[39.0, "أقول وبالله التوفيق: والكلّيّة واضحةٌ ولله الحمد والمنّة."], [44.0, "ودليلُها قولُ الله عز وجل:"], [46.5, "<span class=\"ayah\">﴿وَلَهُ الْمَثَلُ الْأَعْلَىٰ﴾<\/span> <span class=\"ref\">[الروم: ٢٧]<\/span>، <span class=\"ayah\">﴿وَلِلَّهِ الْمَثَلُ الْأَعْلَىٰ﴾<\/span> <span class=\"ref\">[النحل: ٦٠]<\/span>،"], [51.4, "وقولُه عز وجل: <span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [55.0, "وقولُ الله عز وجل:"], [57.0, "<span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>."], [59.0, "فجميعُ الصفات التي دلّ على إثباتها الكتابُ والسنّة،"], [66.0, "فإنّ الواجب علينا أن نعتقد أنّ الله عز وجل متّصفٌ بكمالها المطلق،"], [71.0, "بمعنى أنها لا يعتريها نقصٌ بوجهٍ من الوجوه."]], "tr": [[39.0, "Tevfik Allah'tandır, derim ki: Külliye açıktır;"], [40.9, "hamd ve minnet Allah'adır. Delili, Allah Azze ve Celle'nin şu sözüdür:"], [46.5, "<span class=\"ayah\">﴿En yüce sıfat (el-meselü'l-a'lâ) O'nundur﴾<\/span> [Rûm 27], <span class=\"ayah\">﴿En yüce sıfat Allah'ındır﴾<\/span> [Nahl 60];"], [52.8, "ve O Azze ve Celle'nin şu sözü:"], [54.6, "<span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4];"], [57.0, "ve Allah Azze ve Celle'nin şu sözü:"], [59.0, "<span class=\"ayah\">﴿O'nun adaşı (benzeri) olan birini biliyor musun?﴾<\/span> [Meryem 65]."], [64.1, "Kitap ve Sünnet'in isbatına delâlet ettiği bütün sıfatlarda, Allah Azze ve Celle'nin onların mutlak kemaliyle vasıflandığına inanmamız vâciptir;"], [71.7, "yani bu sıfatlara hiçbir şekilde hiçbir noksanlık ârız olmaz."]]}, {"reader": false, "ar": [[78.0, "فاللهُ عز وجل له العلوُّ المطلق،"], [80.5, "وله السمعُ المطلق، وله البصرُ المطلق،"], [83.0, "وله القدرةُ المطلقة، وله القوّةُ المطلقة،"], [85.3, "وهكذا في سائر صفات الله عز وجل."], [88.0, "لا يجوز أن ينقدح في ذهنك أنّ شيئًا من النقص أو الضعف أو العجز يعتري شيئًا من صفات الله عز وجل، ولو بمقدارٍ يسير."]], "tr": [[78.0, "Allah Azze ve Celle'nin mutlak uluvvü (yüceliği) vardır, mutlak işitmesi vardır, mutlak görmesi vardır, mutlak kudreti vardır, mutlak kuvveti vardır;"], [84.9, "Allah Azze ve Celle'nin diğer sıfatlarında da durum böyledir."], [88.0, "Allah Azze ve Celle'nin sıfatlarından herhangi birine, az bir miktar da olsa, noksanlıktan, zayıflıktan veya acizlikten bir şeyin ârız olduğunun zihninde belirmesi caiz değildir."]]}, {"reader": false, "ar": [[98.0, "قال الإمام ابن تيمية رحمه الله تعالى:"], [102.0, "«الكمالُ ثابتٌ لله، بل الثابتُ له هو أقصى ما يمكن من الأكمليّة، بحيث لا يكون وجودُ كمالٍ لا نقصَ فيه إلا وهو ثابتٌ للربّ تعالى، يستحقّه بنفسه المقدّسة، وثبوتُ ذلك مستلزمٌ نفيَ نقيضه»."], [123.0, "انتهى كلامه. وقال ابن بطّال رحمه الله تعالى:"], [127.2, "«صفاتُ الله عز وجل لا نقصَ فيها». انتهى كلامه."]], "tr": [[98.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [102.0, "\"Kemal Allah için sabittir; hatta O'nun için sabit olan, mümkün olan en ileri kemaldir."], [110.5, "Öyle ki noksanlık bulunmayan hiçbir kemalin varlığı yoktur ki o, Rabb Teâlâ için sabit olmasın;"], [118.5, "O, bunu mukaddes nefsiyle hak eder."], [123.0, "Bunun sübûtu da onun nakîzinin nefyini gerektirir.\" —Sözü burada bitti."], [127.2, "İbn Battâl —Allah ona rahmet etsin— şöyle demiştir:"], [129.4, "\"Allah Azze ve Celle'nin sıfatlarında noksanlık yoktur.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[132.0, "وقال ابن القيّم رحمه الله تعالى:"], [135.0, "«ذاتُه تعالى منزَّهةٌ عن كلّ شرّ، وصفاتُه كذلك؛ إذ كلُّها صفاتُ كمالٍ ونعوتُ جلال، لا نقصَ فيها بوجهٍ من الوجوه، وأسماؤه كلُّها حُسنى، ليس فيها اسمُ ذمٍّ ولا عيب»."], [151.0, "انتهى كلامه. وقال الإمام الزُّرقانيّ رحمه الله تعالى:"], [155.0, "«أسماءُ الله وصفاتُه وكلامُه لا نقصَ فيها»."], [160.0, "انتهى كلامه. وعلى هذا أجمع أهلُ السنة والجماعة."]], "tr": [[132.0, "İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [135.0, "\"O Teâlâ'nın zâtı her türlü şerden münezzehtir;"], [140.5, "sıfatları da öyledir. Çünkü hepsi kemal sıfatları ve celâl vasıflarıdır;"], [147.3, "onlarda hiçbir şekilde noksanlık yoktur."], [151.0, "İsimlerinin hepsi de güzeldir (hüsnâ);"], [152.0, "onlarda yerme veya kusur bildiren bir isim yoktur.\" —Sözü burada bitti."], [155.0, "İmam Zürkânî —Allah ona rahmet etsin— şöyle demiştir:"], [160.0, "\"Allah'ın isimlerinde, sıfatlarında ve kelâmında noksanlık yoktur.\" —Sözü burada bitti."], [161.7, "Ehl-i Sünnet ve'l-Cemaat bunun üzerinde icmâ etmiştir."]]}, {"reader": false, "ar": [[163.0, "وهذا من جملة ما يُفرَّق به بين صفات الله عز وجل وصفات المخلوق:"], [169.0, "فإنّ الله عز وجل له العلوُّ المطلق،"], [173.2, "وللمخلوق مطلقُ العلوّ؛ والله عز وجل له البصرُ المطلق،"], [178.3, "وللمخلوق مطلقُ البصر؛ والله عز وجل له السمعُ المطلق،"], [182.7, "وللمخلوق مطلقُ السمع؛ والله عز وجل له القدرةُ المطلقة،"], [188.0, "وللمخلوق مطلقُ القدرة؛ والله عز وجل له القوّةُ المطلقة،"], [193.3, "وللمخلوق مطلقُ القوّة؛ والله عز وجل له الحياةُ المطلقة،"], [198.3, "وللمخلوق مطلقُ الحياة. والكلّيّة واضحة، والله أعلم."]], "tr": [[163.0, "Bu, Allah Azze ve Celle'nin sıfatlarıyla mahlûkun sıfatları arasını ayıran şeylerdendir:"], [167.4, "Allah Azze ve Celle'nin mutlak uluvvü vardır, mahlûkun ise uluvvün mutlakı (bir miktar yücelik) vardır."], [175.0, "Allah Azze ve Celle'nin mutlak görmesi vardır, mahlûkun ise görmenin mutlakı vardır."], [180.0, "Allah Azze ve Celle'nin mutlak işitmesi vardır, mahlûkun ise işitmenin mutlakı vardır."], [184.0, "Allah Azze ve Celle'nin mutlak kudreti vardır, mahlûkun ise kudretin mutlakı vardır."], [190.0, "Allah Azze ve Celle'nin mutlak kuvveti vardır, mahlûkun ise kuvvetin mutlakı vardır."], [195.0, "Allah Azze ve Celle'nin mutlak hayatı vardır, mahlûkun ise hayatın mutlakı vardır."], [200.0, "Külliye açıktır; Allah en iyisini bilir."]]}]}, {"ts": "03:23", "title": "2. Külliye: Her sıfat nassında üç şey vâciptir — sıfatı isbat, mahlûkların sıfatlarına benzerliğini nefy, keyfiyetini bilme tamahını kesmek", "paras": [{"reader": false, "ar": [[203.0, "الكلّيّة الثانية: كلُّ نصٍّ من نصوص الصفات فالواجبُ فيه إثباتُ الصفة،"], [221.5, "ونفيُ مماثلتها بصفات المخلوقات،"], [232.0, "وقطعُ الطمع في التعرّف على كيفيّتها. أُعيدها مرّةً ثانية:"], [239.2, "كلُّ نصٍّ من نصوص الصفات فالواجبُ فيه إثباتُ الصفة،"], [246.0, "ونفيُ مماثلتها بصفات المخلوقات،"], [249.0, "وقطعُ الطمع في التعرّف على كيفيّتها. أُعيدها مرّةً ثالثة:"], [256.0, "كلُّ نصٍّ من نصوص الصفات فالواجبُ فيه إثباتُ الصفة،"], [260.0, "ونفيُ مماثلتها بصفات المخلوقات،"], [263.0, "وقطعُ الطمع في التعرّف على كيفيّتها."]], "tr": [[203.0, "2. külliye: Sıfat naslarından her nasta vâcip olan;"], [208.7, "sıfatı isbat etmek, onun mahlûkların sıfatlarına benzerliğini nefyetmek ve keyfiyetini bilme tamahını kesmektir. İkinci kez tekrar ediyorum:"], [239.2, "2. külliye: Sıfat naslarından her nasta vâcip olan;"], [244.5, "sıfatı isbat etmek, onun mahlûkların sıfatlarına benzerliğini nefyetmek ve keyfiyetini bilme tamahını kesmektir. Üçüncü kez tekrar ediyorum:"], [256.0, "2. külliye: Sıfat naslarından her nasta vâcip olan;"], [259.0, "sıfatı isbat etmek, onun mahlûkların sıfatlarına benzerliğini nefyetmek ve keyfiyetini bilme tamahını kesmektir."]]}, {"reader": false, "ar": [[266.0, "أقول وبالله التوفيق: وهذه الكلّيّة تُبيّن لك ما يجب عليك لتكون من أهل السنة والجماعة في نصوص الصفات كتابًا وسنّة."], [278.0, "فمتى ما مرّ عليك شيءٌ من نصوص الصفات في كتاب الله عز وجل أو سنّة نبيّه صلى الله عليه وسلم،"], [289.0, "فلن تكون من أهل السنة والجماعة في هذا النصّ إلا إذا حقّقتَ ثلاثةَ واجبات،"], [296.0, "إذا اختلّ واحدٌ منها فإنك تخرج عن دائرة أهل السنة."]], "tr": [[266.0, "Tevfik Allah'tandır, derim ki: Bu külliye, Kitap ve Sünnet'teki sıfat naslarında Ehl-i Sünnet ve'l-Cemaat'ten olman için sana neyin vâcip olduğunu açıklar."], [278.0, "Allah Azze ve Celle'nin Kitabı'nda veya Peygamberi sallallâhu aleyhi ve sellem'in sünnetinde sıfat naslarından bir şey önüne geldiğinde, ancak üç vâcibi gerçekleştirirsen o nas hususunda Ehl-i Sünnet ve'l-Cemaat'ten olursun."], [296.6, "Bunlardan biri bozulursa Ehl-i Sünnet dairesinden çıkarsın."]]}]}, {"ts": "05:02", "title": "2. Külliye (devam): Birinci vâcip — sıfatı isbat; ikinci vâcip — benzerliği nefy", "paras": [{"reader": false, "ar": [[301.8, "فلا بدّ من تحقيق هذه الواجبات الثلاثة مجتمعةً."], [307.0, "الواجبُ الأول: إثباتُ الصفة التي يدور حولها النصّ؛"], [312.0, "فإن كان النصّ يُثبت صفةَ اليدين فالواجب عليك إثباتُ صفة اليدين،"], [318.0, "أو كان يُثبت صفةَ الوجه فالواجب عليك إثباتُ صفة الوجه."], [323.0, "وبرهانُ هذا الواجب: هو أنّ نصوص الصفات خبرٌ عن الله عز وجل،"], [333.0, "والله عز وجل لا يدخل في أخباره الكذبُ أبدًا."], [337.0, "فلا يجوز لك أن يُخبرك الله عز وجل عن شيءٍ من صفاته،"], [342.0, "وتقولَ بأنه لا يجوز اتّصافُ الله عز وجل بهذه الصفة،"], [347.0, "أو: لا أُصدّق أنّ الله عز وجل متّصفٌ بهذه الصفة،"], [351.0, "أو: أنّ عقلي يمنع أن يتّصف الله عز وجل بهذه الصفة."]], "tr": [[301.8, "Bu üç vâcibin bir arada gerçekleştirilmesi zorunludur."], [307.0, "Birinci vâcip: Nassın etrafında döndüğü sıfatı isbat etmektir."], [312.0, "Nas iki el sıfatını isbat ediyorsa, iki el sıfatını isbat etmek sana vâciptir;"], [318.0, "yüz sıfatını isbat ediyorsa, yüz sıfatını isbat etmek sana vâciptir."], [323.0, "Bu vâcibin delili şudur: Sıfat nasları Allah Azze ve Celle hakkında bir haberdir;"], [333.0, "Allah Azze ve Celle'nin haberlerine ise asla yalan girmez."], [337.0, "Allah Azze ve Celle sana sıfatlarından bir şeyi haber verdiği hâlde senin \"Allah Azze ve Celle'nin bu sıfatla vasıflanması caiz değildir\" veya \"Allah Azze ve Celle'nin bu sıfatla vasıflandığını tasdik etmiyorum\" veya \"Aklım Allah Azze ve Celle'nin bu sıfatla vasıflanmasına engel oluyor\" demen caiz değildir."]]}, {"reader": false, "ar": [[357.0, "فلستَ بأعلمَ من الله عز وجل بنفسه،"], [360.8, "ولا بأعلمَ منه من رسوله صلى الله عليه وسلم."], [365.0, "فمتى ما أخبرك الله عز وجل في كتابه،"], [368.3, "أو أخبرك رسولُه صلى الله عليه وسلم في صحيح سنّته عن شيءٍ من صفاته،"], [374.0, "فإنّ الواجب عليك أن تقول:"], [377.7, "آمنّا وصدّقنا. وهذا يُقال في الخبريّات،"], [382.7, "وإن كان أمرًا أو نهيًا فتقول:"], [386.8, "سمعنا وأطعنا. فلا يجوز مخاصمةُ الله عز وجل في أخباره مطلقًا."]], "tr": [[357.0, "Sen Allah Azze ve Celle'den, O'nun kendisini daha iyi bilen değilsin;"], [361.2, "Resûlü sallallâhu aleyhi ve sellem'den de daha iyi bilen değilsin."], [365.0, "Allah Azze ve Celle Kitabı'nda veya Resûlü sallallâhu aleyhi ve sellem sahih sünnetinde sana O'nun sıfatlarından bir şeyi haber verdiğinde, \"İman ettik ve tasdik ettik\" demen vâciptir."], [377.7, "Bu, haberler hakkında söylenir; emir veya nehiy ise \"İşittik ve itaat ettik\" dersin."], [386.8, "Allah Azze ve Celle'yle haberleri hususunda çekişmek kesinlikle caiz değildir."]]}, {"reader": false, "ar": [[395.0, "ولذلك نصّ أهلُ العلم رحمهم الله تعالى على أنّ كلَّ من كذّب أو جحد بشيءٍ من أخبار الكتاب والسنّة ـ في شيءٍ من متعلّقات الأسماء أو الصفات،"], [410.5, "أو حقائق اليوم الآخر،"], [413.0, "أو ما يقصّه الله عز وجل في كتابه من أخبار الأمم الماضية وأنبيائها ـ فإنه كافرٌ،"], [421.2, "خالعٌ رِبقةَ الإسلام من عنقه بالكلّيّة."]], "tr": [[395.0, "Bu sebeple ilim ehli —Allah onlara rahmet etsin— şunu açıkça belirtmişlerdir:"], [400.8, "Kitap ve Sünnet'in haberlerinden bir şeyi —isimlerin veya sıfatların taalluklarından bir şeyde, ya da âhiret gününün hakikatlerinde, ya da Allah Azze ve Celle'nin Kitabı'nda anlattığı geçmiş ümmetlerin ve peygamberlerinin haberlerinde— yalanlayan veya inkâr eden herkes kâfirdir;"], [421.2, "İslâm bağını boynundan tamamen çıkarıp atmıştır."]]}, {"reader": false, "ar": [[425.0, "ولذلك قال الله عز وجل:"], [428.5, "<span class=\"ayah\">﴿وَمَنْ أَصْدَقُ مِنَ اللَّهِ حَدِيثًا﴾<\/span> <span class=\"ref\">[النساء: ٨٧]<\/span>،"], [432.0, "وقال الله عز وجل:"], [433.8, "<span class=\"ayah\">﴿وَمَنْ أَصْدَقُ مِنَ اللَّهِ قِيلًا﴾<\/span> <span class=\"ref\">[النساء: ١٢٢]<\/span>،"], [436.0, "وقال الله عز وجل:"], [438.3, "<span class=\"ayah\">﴿قُلْ صَدَقَ اللَّهُ ۗ فَاتَّبِعُوا مِلَّةَ إِبْرَاهِيمَ حَنِيفًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ٩٥]<\/span>."], [445.0, "فأيُّ خبرٍ في إثبات صفةٍ فالواجب عليك إثباتُ هذه الصفة التي يدور حولها النصّ."]], "tr": [[425.0, "Bu yüzden Allah Azze ve Celle şöyle buyurmuştur:"], [428.5, "<span class=\"ayah\">﴿Söz bakımından Allah'tan daha doğru kim olabilir?﴾<\/span> [Nisâ 87]."], [432.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [433.8, "<span class=\"ayah\">﴿Söyleyiş bakımından Allah'tan daha doğru kim olabilir?﴾<\/span> [Nisâ 122]."], [436.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [438.3, "<span class=\"ayah\">﴿De ki: Allah doğru söyledi. Öyleyse hanîf olarak İbrâhim'in dinine uyun; o müşriklerden değildi.﴾<\/span> [Âl-i İmrân 95]."], [445.0, "Bir sıfatın isbatına dair herhangi bir haberde, nassın etrafında döndüğü bu sıfatı isbat etmen vâciptir."]]}, {"reader": false, "ar": [[455.0, "فإن قلتَ: وهل هذا الواجب يكفيني؟"], [458.8, "الجواب: لا؛ وذلك لأنّ أهل التمثيل يُثبتون لله عز وجل الصفات."], [467.0, "بل لا بدّ أن تنتقل من هذا الواجب إلى الواجب الثاني مباشرةً،"], [472.1, "وهو أن تعتقد أنّ الله عز وجل لا يُماثله في هذه الصفة شيءٌ من صفات المخلوقات."]], "tr": [[455.0, "Eğer \"Bu vâcip bana yeter mi?\" dersen, cevap:"], [458.8, "Hayır. Çünkü temsil ehli de Allah Azze ve Celle için sıfatları isbat eder."], [467.0, "Bilakis bu vâcipten doğrudan ikinci vâcibe geçmen gerekir:"], [471.2, "O da bu sıfatta mahlûkların sıfatlarından hiçbir şeyin Allah Azze ve Celle'ye benzemediğine inanmandır."]]}, {"reader": false, "ar": [[483.0, "لقول الله عز وجل:"], [484.5, "<span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>،"], [486.0, "ولقول الله عز وجل:"], [487.8, "<span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [490.0, "ولقول الله عز وجل:"], [492.3, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>، ولقوله عز وجل:"], [496.1, "<span class=\"ayah\">﴿فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ﴾<\/span> <span class=\"ref\">[النحل: ٧٤]<\/span>،"], [499.0, "ولقوله عز وجل: <span class=\"ayah\">﴿فَلَا تَجْعَلُوا لِلَّهِ أَندَادًا﴾<\/span> <span class=\"ref\">[البقرة: ٢٢]<\/span>."], [502.0, "فليس كمثل الله عز وجل شيءٌ في هذه الصفة التي أثبتها هذا النصّ،"], [512.0, "حتى وإن اتّفقت مع أسماء صفات المخلوقات؛"], [517.0, "فإنّ المتقرِّر في القواعد أنّ الاتّفاق في الأسماء لا يستلزم الاتّفاقَ في الصفات."]], "tr": [[483.0, "Çünkü Allah Azze ve Celle şöyle buyurmuştur:"], [484.5, "<span class=\"ayah\">﴿O'nun adaşı olan birini biliyor musun?﴾<\/span> [Meryem 65]."], [486.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [487.8, "<span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4]."], [489.6, "Allah Azze ve Celle şöyle buyurmuştur:"], [492.3, "<span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11]."], [496.1, "O Azze ve Celle şöyle buyurmuştur:"], [500.3, "<span class=\"ayah\">﴿Allah'a misaller getirmeyin﴾<\/span> [Nahl 74]."], [502.0, "O Azze ve Celle şöyle buyurmuştur:"], [504.7, "<span class=\"ayah\">﴿Allah'a denkler koşmayın﴾<\/span> [Bakara 22]."], [507.4, "Bu nassın isbat ettiği bu sıfatta Allah Azze ve Celle'nin benzeri hiçbir şey yoktur;"], [517.0, "isim olarak mahlûkların sıfatlarının isimleriyle örtüşse bile."], [519.7, "Çünkü kaidelerde yerleşik olan şudur:"], [521.8, "İsimlerde ortaklık, sıfatlarda ortaklığı gerektirmez."]]}, {"reader": false, "ar": [[524.0, "فإن قلتَ: وهل يكفيني هذا الواجب الثاني؟"], [528.7, "فنقول: لا، بل الواجب عليك أن تنتقل أيضًا إلى تحقيق الواجب الثالث،"], [535.0, "وهو قطعُ طمع العقل في التعرّف على كيفيّة هذه الصفة؛"], [540.0, "بمعنى أنه لا يجوز أن تسمح لعقلك أبدًا أن يتفكّر أو يتأمّل شيئًا من كيفيّة هذه الصفة التي أثبتها الله عز وجل لنفسه في هذا النصّ."]], "tr": [[524.0, "Eğer \"Bu ikinci vâcip bana yeter mi?\" dersen, deriz ki:"], [528.7, "Hayır; bilakis üçüncü vâcibi gerçekleştirmeye de geçmen vâciptir."], [534.0, "O da aklın bu sıfatın keyfiyetini bilme tamahını kesmektir."], [540.0, "Yani Allah Azze ve Celle'nin bu nasta kendisi için isbat ettiği bu sıfatın keyfiyetinden herhangi bir şeyi düşünmesine veya üzerinde tefekkür etmesine aklına asla izin vermen caiz değildir."]]}, {"reader": false, "ar": [[554.0, "وذلك لأنّ كيفيّة الشيء لا تُعرَف إلا برؤيته ـ وهذا منقطع ـ،"], [560.0, "أو رؤية نظيره ـ وهذا منقطع ـ،"], [564.0, "أو بإخبار الصادق صلى الله عليه وسلم عنه ـ وهذا منقطع."], [570.0, "فالنبيّ صلى الله عليه وسلم أخبرنا بأنّ لربّنا استواءً،"], [574.2, "ولم يُخبرنا عن كيفيّة هذا الاستواء،"], [577.0, "وأخبرنا أنّ لربّنا يدًا،"], [579.0, "ولم يُخبرنا عن كيفيّة هذه اليد،"], [582.0, "وهكذا نقوله في سائر الصفات."], [585.0, "فلا يجوز للإنسان أن يتخوّض بعقله في شيءٍ من هذا الباب طلبًا لكيفيّة شيءٍ منه؛"], [593.0, "لأنه بابٌ غيبيّ، والمتقرِّر في القواعد أنّ ما كان غيبيًّا فيكون توقيفيًّا،"], [601.0, "والمتقرِّر في القواعد أن لا مدخلَ للعقل استقلالًا في الغيبيّات."]], "tr": [[554.0, "Çünkü bir şeyin keyfiyeti ancak onu görmekle bilinir —bu ise kesiktir (imkânsızdır)—, ya da benzerini görmekle —bu da kesiktir—, ya da sâdık (doğru sözlü) olan sallallâhu aleyhi ve sellem'in onu haber vermesiyle —bu da kesiktir."], [570.0, "Peygamber sallallâhu aleyhi ve sellem bize Rabbimizin bir istivâsı olduğunu haber verdi, fakat bu istivânın keyfiyetini haber vermedi."], [577.0, "Rabbimizin bir eli olduğunu haber verdi, fakat bu elin keyfiyetini haber vermedi."], [582.0, "Diğer sıfatlarda da böyle söyleriz."], [585.0, "İnsanın, bu babdan bir şeyin keyfiyetini arayarak aklıyla bu babın içine dalması caiz değildir."], [590.9, "Çünkü bu gaybî bir babdır;"], [593.0, "kaidelerde yerleşik olan şudur: Gaybî olan şey tevkîfîdir (nassa bağlıdır)."], [599.0, "Yine kaidelerde yerleşik olan şudur:"], [601.7, "Gaybî konularda aklın bağımsız olarak hiçbir giriş yolu yoktur."]]}]}, {"ts": "10:09", "title": "2. Külliye (devam): Üç vâcibin örnekleri — istivâ, iki el, rahmet, nüzul, parmaklar, gelme, ayak", "paras": [{"reader": false, "ar": [[609.0, "فمتى ما حقّقتَ هذه الواجبات الثلاثة في نصوص الصفات،"], [614.0, "فإنك حينئذٍ تكون من أهل السنة والجماعة في هذا النصّ."], [619.0, "ومثالُ ذلك قولُ الله عز وجل:"], [622.6, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span>؛"], [625.0, "فهذا من نصوص الصفات،"], [627.2, "فالواجب عليّ فيه ثلاثةُ أشياء:"], [630.0, "أن أُثبت لله صفةَ الاستواء ـ وهذا الواجب الأول ـ،"], [635.0, "وأن أعتقد أنه ليس كاستواء المخلوقين ـ وهذا الواجب الثاني ـ،"], [641.0, "وأن أقطع طمعَ العقل في التعرّف على كيفيّة هذا الاستواء."]], "tr": [[609.0, "Sıfat naslarında bu üç vâcibi gerçekleştirdiğinde, o zaman o nas hususunda Ehl-i Sünnet ve'l-Cemaat'ten olursun."], [617.5, "Bunun örneği Allah Azze ve Celle'nin şu sözüdür:"], [622.6, "<span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5]."], [625.0, "Bu, sıfat naslarındandır; bu nasta bana üç şey vâciptir:"], [630.0, "Allah için istivâ sıfatını isbat etmem —bu birinci vâciptir—, onun mahlûkların istivâsı gibi olmadığına inanmam —bu ikinci vâciptir— ve aklın bu istivânın keyfiyetini bilme tamahını kesmem."]]}, {"reader": false, "ar": [[645.0, "ومثالٌ آخر: في قول الله عز وجل:"], [651.0, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span>، وهذا من نصوص الصفات بالإجماع."], [656.0, "فالواجب عليّ أن أُثبت فيه صفةَ اليدين لله عز وجل ـ وهذا الواجب الأول ـ،"], [663.0, "وأن أعتقد أنها لا تُماثل يدَ المخلوقين ـ وهذا الواجب الثاني ـ،"], [669.0, "وأن أقطع طمعَ العقل في التعرّف على شيءٍ من كيفيّة هاتين اليدين."]], "tr": [[645.0, "Başka bir örnek: Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bilakis O'nun iki eli açıktır﴾<\/span> [Mâide 64] sözünde."], [656.0, "Bu, icmâ ile sıfat naslarındandır."], [658.0, "Bu nasta Allah Azze ve Celle için iki el sıfatını isbat etmem —bu birinci vâciptir—, onların mahlûkların eline benzemediğine inanmam —bu ikinci vâciptir— ve aklın bu iki elin keyfiyetinden herhangi bir şeyi bilme tamahını kesmem bana vâciptir."]]}, {"reader": false, "ar": [[674.0, "ومثالٌ ثالث: في قول الله عز وجل:"], [678.5, "<span class=\"ayah\">﴿وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ﴾<\/span> <span class=\"ref\">[الأعراف: ١٥٦]<\/span>،"], [681.0, "وهذا من نصوص الصفات؛"], [683.0, "فأقول فيه: بأنّ لله رحمةً لائقةً بجلاله وعظمته،"], [688.3, "لا تُماثل رحمةَ المخلوقين،"], [691.0, "وأقطع طمعَ عقلي في التعرّف على شيءٍ من كيفيّة هذه الرحمة."]], "tr": [[674.0, "Üçüncü bir örnek: Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rahmetim her şeyi kuşatmıştır﴾<\/span> [A'râf 156] sözünde."], [683.0, "Bu, sıfat naslarındandır. Bu nas hakkında şöyle derim:"], [687.0, "Allah'ın, celâline ve azametine yakışan, mahlûkların rahmetine benzemeyen bir rahmeti vardır."], [691.9, "Aklımın bu rahmetin keyfiyetinden herhangi bir şeyi bilme tamahını da keserim."]]}, {"reader": false, "ar": [[696.0, "ومثالٌ آخر: في قول النبيّ صلى الله عليه وسلم:"], [700.0, "«ينزل ربُّنا إلى السماء الدنيا»،"], [703.0, "وهذا من نصوص الصفات بالإجماع."], [706.0, "فأقول فيه: أُؤمن بأنّ الله متّصفٌ بصفة النزول،"], [712.0, "وأُؤمن بأنّ الله ليس كمثله شيءٌ في هذه الصفة،"], [717.0, "وأقطع طمعَ العقل في التعرّف على كيفيّة هذا النزول."]], "tr": [[696.0, "Başka bir örnek: Peygamber sallallâhu aleyhi ve sellem'in \"Rabbimiz dünya semasına iner\" sözünde."], [702.4, "Bu, icmâ ile sıfat naslarındandır."], [706.0, "Bu nas hakkında şöyle derim:"], [708.9, "Allah'ın nüzul sıfatıyla vasıflandığına iman ederim;"], [713.1, "bu sıfatta Allah'ın benzeri hiçbir şey olmadığına iman ederim ve aklın bu nüzulün keyfiyetini bilme tamahını keserim."]]}, {"reader": false, "ar": [[721.0, "ومثالٌ آخر: في قول النبيّ صلى الله عليه وسلم:"], [726.0, "«بين إصبعين من أصابع الرحمن»؛"], [730.0, "فأقول فيه: بأنّ الله عز وجل له أصابعُ ليست كأصابع المخلوقين،"], [738.0, "وأقطع طمعَ العقل في التعرّف على كيفيّة هذه الأصابع."]], "tr": [[721.0, "Başka bir örnek: Peygamber sallallâhu aleyhi ve sellem'in \"Rahmân'ın parmaklarından iki parmak arasında\" sözünde."], [730.0, "Bu nas hakkında şöyle derim:"], [732.8, "Allah Azze ve Celle'nin, mahlûkların parmakları gibi olmayan parmakları vardır."], [739.1, "Aklın bu parmakların keyfiyetini bilme tamahını da keserim."]]}, {"reader": false, "ar": [[743.0, "ومثالٌ آخر: في قول الله عز وجل:"], [747.4, "<span class=\"ayah\">﴿وَجَاءَ رَبُّكَ﴾<\/span> <span class=\"ref\">[الفجر: ٢٢]<\/span>، وفي قوله عز وجل:"], [751.2, "<span class=\"ayah\">﴿هَلْ يَنظُرُونَ إِلَّا أَن يَأْتِيَهُمُ اللَّهُ﴾<\/span> <span class=\"ref\">[البقرة: ٢١٠]<\/span>؛"], [755.0, "فأُؤمن بأنّ من صفاته المجيءَ والإتيانَ يوم القيامة،"], [759.8, "وليس كمجيء أو إتيان أحدٍ من المخلوقين،"], [764.0, "وأقطع طمعَ العقل في التعرّف على كيفيّة شيءٍ من هذا المجيء أو الإتيان."]], "tr": [[743.0, "Başka bir örnek: Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rabbin geldi﴾<\/span> [Fecr 22] sözünde ve O Azze ve Celle'nin <span class=\"ayah\">﴿Onlar, Allah'ın kendilerine gelmesinden başka bir şey mi bekliyorlar?﴾<\/span> [Bakara 210] sözünde."], [755.0, "Kıyamet günü gelmenin (mecî) ve gelişin (ityân) O'nun sıfatlarından olduğuna, bunun mahlûklardan herhangi birinin gelmesi veya gelişi gibi olmadığına iman ederim."], [764.9, "Aklın bu gelmenin veya gelişin keyfiyetinden herhangi bir şeyi bilme tamahını da keserim."]]}, {"reader": false, "ar": [[770.0, "ومثالٌ آخر: في قول النبيّ صلى الله عليه وسلم:"], [775.0, "«حتى يضعَ ربُّ العزّة عليها رِجلَه»،"], [778.0, "وفي روايةٍ: «قدمَه»؛ فأُؤمن بهذه الصفة لله عز وجل،"], [783.0, "وأقول فيها: ليست كأرجل أو أقدام المخلوقين،"], [788.0, "وأقطع طمعَ العقل في التعرّف على كيفيّة هذه الصفة."]], "tr": [[770.0, "Başka bir örnek: Peygamber sallallâhu aleyhi ve sellem'in \"Nihayet İzzet'in Rabbi onun (cehennemin) üzerine ayağını (ricl) koyar\" sözünde;"], [777.0, "bir rivayette de \"kademini\" (denilmiştir)."], [779.3, "Allah Azze ve Celle için bu sıfata iman ederim ve onun hakkında şöyle derim:"], [786.6, "Mahlûkların ayakları gibi değildir. Aklın bu sıfatın keyfiyetini bilme tamahını da keserim."]]}, {"reader": false, "ar": [[792.0, "وهكذا تقوله في سائر نصوص الصفات كتابًا وسنّة:"], [797.0, "أن تُؤمن بالصفة التي يدور حولها النصّ،"], [800.0, "وأن تعتقد أنها لا تُماثل شيئًا من صفات المخلوقين،"], [805.0, "وأن تقطع طمعَ العقل في التعرّف على كيفيّة شيءٍ من هذه الصفات. والله أعلم."]], "tr": [[792.0, "Kitap ve Sünnet'teki diğer bütün sıfat naslarında da böyle söylersin:"], [797.9, "Nassın etrafında döndüğü sıfata iman edersin, onun mahlûkların sıfatlarından hiçbir şeye benzemediğine inanırsın ve aklın bu sıfatlardan herhangi birinin keyfiyetini bilme tamahını kesersin. Allah en iyisini bilir."]]}]}, {"ts": "13:31", "title": "3. Külliye: Her tahrife, onun selefin anlayışına ve dile aykırı olduğu ve üzerinde delil bulunmadığı ile cevap verilir", "paras": [{"reader": false, "ar": [[811.0, "الكلّيّة الثالثة: كلُّ تحريفٍ لصفةٍ من صفات الله فيُجاب عنه ـ كلُّ تحريفٍ لصفةٍ من صفات الله عز وجل فيُجاب عنه بأنه خلافُ فهم السلف،"], [831.1, "وخلافُ اللغة، وليس عليه دليل. أُعيدها مرّةً ثانية:"], [840.0, "كلُّ تحريفٍ لصفةٍ من صفات الله عز وجل فيُجاب عنه بأنه خلافُ فهم السلف،"], [848.1, "وخلافُ اللغة، وليس عليه دليل. أُعيدها لمن تتأخّر كتابتُه مرّةً ثالثة:"], [859.4, "كلُّ تحريفٍ لصفةٍ من صفات الله فيُجاب عنه بأنه خلافُ فهم السلف،"], [864.8, "وخلافُ اللغة، وليس عليه دليل."]], "tr": [[811.0, "3. külliye: Allah'ın sıfatlarından bir sıfata yapılan her tahrife cevap verilir — 3."], [819.1, "külliye: Allah Azze ve Celle'nin sıfatlarından bir sıfata yapılan her tahrife, onun selefin anlayışına aykırı olduğu, dile aykırı olduğu ve üzerinde delil bulunmadığı ile cevap verilir. İkinci kez tekrar ediyorum:"], [840.0, "<b>3. külliye: Allah Azze ve Celle'nin sıfatlarından bir sıfata yapılan her tahrife, onun selefin anlayışına aykırı olduğu, dile aykırı olduğu ve üzerinde delil bulunmadığı ile cevap verilir.<\/b> Yazması geciken için üçüncü kez tekrar ediyorum:"], [859.4, "<b>3. külliye: Allah'ın sıfatlarından bir sıfata yapılan her tahrife, onun selefin anlayışına aykırı olduğu, dile aykırı olduğu ve üzerinde delil bulunmadığı ile cevap verilir.<\/b>"]]}, {"reader": false, "ar": [[867.0, "أقول وبالله تعالى التوفيق:"], [869.4, "وهذه الأجوبة الثلاثة لا بدّ أن تبدأ بها في الإجابة عن كلّ تحريفِ محرِّفٍ لأيّ شيءٍ من صفات الله عز وجل."], [882.0, "فمتى ما جاءك الجهميُّ أو المعتزليُّ أو الأشعريُّ أو الماتريديُّ أو غيرُهم من أهل البدع،"], [896.0, "يُحرّف شيئًا من صفات الله عز وجل،"], [898.0, "فأجِبه بهذه الأجوبة الثلاثة؛"], [902.0, "فإنها أجوبةٌ تستمرّ معك في كلّ تحريف،"], [907.0, "بمعنى أنها تصلح للإجابة عن كلّ تحريف."]], "tr": [[867.0, "Tevfik Allah'tandır, derim ki: Bir tahrifçinin Allah Azze ve Celle'nin sıfatlarından herhangi bir şeye yaptığı her tahrife cevap verirken mutlaka bu üç cevapla başlamalısın."], [882.0, "Cehmî, Mu'tezilî, Eş'arî, Mâtürîdî veya onların dışındaki bid'at ehlinden biri Allah Azze ve Celle'nin sıfatlarından bir şeyi tahrif ederek sana geldiğinde, ona bu üç cevapla cevap ver."], [902.0, "Çünkü bunlar her tahrifte seninle birlikte devam eden cevaplardır;"], [907.7, "yani her tahrife cevap vermeye elverişlidirler."]]}]}, {"ts": "15:12", "title": "3. Külliye (devam): Üç cevap ilk başlanacak cevaplardır · Birinci cevap: selefin anlayışına aykırılık · İkinci cevap: Arap diline aykırılık", "paras": [{"reader": false, "ar": [[912.0, "ولا أقصد بأنها كلُّ ما يُجاب المبتدعُ به،"], [917.2, "وإنما أقصد بأنها أوّلُ ما يُبتدأ [به] في الإجابة عن تحريفه،"], [925.0, "وإلا فهناك جُمَلٌ من التحريفات يُجاب عنها بأكثر من ذلك،"], [930.9, "لكن أجوبةٌ تخصّ هذا التحريفَ بعينه وخصوصه."], [935.0, "وأمّا الأجوبة التي تصلح للإجابة عن كلّ تحريفٍ فإنها مذكورةٌ في هذه الكلّيّة."]], "tr": [[912.0, "Bunların, bid'atçiye verilecek cevapların hepsi olduğunu kastetmiyorum;"], [917.9, "bilakis onun tahrifine cevap verirken ilk başlanacak şey olduğunu kastediyorum."], [927.4, "Yoksa tahriflerden bir kısmına bundan daha fazlasıyla cevap verilir;"], [935.0, "fakat bunlar, o tahrifin kendisine ve hususiyetine has cevaplardır."], [938.4, "Her tahrife cevap vermeye elverişli olan cevaplara gelince, onlar bu külliyede zikredilmiştir."]]}, {"reader": false, "ar": [[944.0, "وهي قوله: «خلافُ فهم السلف»؛"], [951.0, "بمعنى أن تقول: إنّ تحريفك هذا خلافُ فهم السلف،"], [955.0, "والمتقرِّر في القواعد أنّ كلّ فهمٍ في مسائل الاعتقاد والعمل خالف فهمَ السلف فإنه فهمٌ باطل."]], "tr": [[944.0, "Bunlar (külliyedeki) \"selefin anlayışına aykırıdır\" sözüdür;"], [951.0, "yani şöyle dersin: \"Senin bu tahrifin selefin anlayışına aykırıdır.\" Kaidelerde yerleşik olan şudur:"], [956.5, "İtikat ve amel meselelerinde selefin anlayışına aykırı olan her anlayış bâtıl bir anlayıştır."]]}, {"reader": false, "ar": [[963.0, "الجوابُ الثاني: أنّ تحريفك هذا خلافُ مقتضى لغة العرب،"], [970.0, "والمتقرِّر في القواعد أنّ كلّ تحريفٍ خالف مقتضى لغة العرب ـ في ألفاظها وفي معاني دلالاتها ـ فإنه يكون باطلًا؛"], [983.5, "لأنه مخالفٌ لأصل تنزُّل القرآن،"], [986.0, "فإنّ القرآن نزل <span class=\"ayah\">﴿بِلِسَانٍ عَرَبِيٍّ مُّبِينٍ﴾<\/span> <span class=\"ref\">[الشعراء: ١٩٥]<\/span>."], [991.0, "فأيُّ إنسانٍ أراد منّا أن نحمل لفظةً من ألفاظه على غير مقتضى ذلك السياق العربيّ المبين فإنه قائلٌ بالباطل."]], "tr": [[963.0, "İkinci cevap: Senin bu tahrifin Arap dilinin gereğine aykırıdır."], [970.0, "Kaidelerde yerleşik olan şudur: Arap dilinin gereğine —lafızlarında ve delâletlerinin manalarında— aykırı olan her tahrif bâtıldır."], [983.5, "Çünkü Kur'an'ın inişinin aslına aykırıdır;"], [985.0, "zira Kur'an <span class=\"ayah\">﴿apaçık Arapça bir dille﴾<\/span> [Şuarâ 195] inmiştir."], [991.0, "Kur'an'ın lafızlarından bir lafzı, o apaçık Arapça siyakın gereğinden başka bir manaya hamletmemizi isteyen her insan bâtılı söyleyen biridir."]]}, {"reader": false, "ar": [[1000.0, "والقرآنُ عربيُّ الألفاظ، وعربيُّ الاستعمال أيضًا؛"], [1005.0, "فأيُّ إنسانٍ أراد منّا أن نحمل معنى لفظةٍ في سياقٍ خاصّ على معنًى آخر لا تعرفه العرب ـ لا تعرفه العرب من استعمالات لسانها العربيّ ـ فإنه قائلٌ بالباطل."], [1024.0, "فاللغةُ العربية لها دورُها الكبير في فهم دلالات الكلام: إفرادًا، واستعمالًا، وسياقًا."]], "tr": [[1000.0, "Kur'an lafızları bakımından Arapçadır, kullanımı bakımından da Arapçadır."], [1006.3, "Belirli bir siyaktaki bir lafzın manasını Arapların bilmediği —Arapların kendi Arapça dillerinin kullanımlarından bilmediği— başka bir manaya hamletmemizi isteyen her insan bâtılı söyleyen biridir."], [1024.0, "Arap dilinin, sözün delâletlerini anlamada —tek tek kelimeler, kullanım ve siyak bakımından— büyük bir rolü vardır."]]}, {"reader": false, "ar": [[1048.0, "كقول الذي يُحرّف قولَ الله عز وجل:"], [1051.5, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span> <span class=\"note\">(Şeyh burada «مبسوطة» diyor)<\/span> إلى قوله:"], [1054.3, "المرادُ بها النعمةُ والقوّة؛"], [1057.0, "فنقول: إنّ العرب لا تستخدم النعمةَ والقوّةَ بالتثنية،"], [1062.0, "فأنتَ حرّفتَ تحريفًا مخالفًا للغة العرب، فيكون تحريفُك باطلًا."]], "tr": [[1048.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bilakis O'nun iki eli açıktır﴾<\/span> [Mâide 64] sözünü, \"Bundan maksat nimet ve kuvvettir\" diyerek tahrif edenin sözü gibi."], [1057.0, "Deriz ki: Araplar nimet ve kuvveti ikil (tesniye) olarak kullanmaz."], [1062.0, "Sen Arap diline aykırı bir tahrif yaptın; dolayısıyla tahrifin bâtıldır."]]}]}, {"ts": "17:48", "title": "3. Külliye (devam): Üçüncü cevap — üzerinde delil yoktur", "paras": [{"reader": false, "ar": [[1068.0, "الجوابُ الثالث: في قوله:"], [1070.9, "«وليس عليه دليل»؛ بمعنى أنّ الأصل هو البقاءُ على الظاهر،"], [1076.0, "ولا يجوز الانتقالُ عن ظاهر الكلام إلى معنًى آخر إلا إذا دلّ الدليلُ على هذا الانتقال."], [1083.0, "والأصلُ هو البقاءُ على حقيقة الكلام،"], [1086.2, "ولا يجوز الانتقالُ من الحقيقة إلى المجاز إلا وعلى ذلك الانتقال دليل."], [1093.0, "فأين الدليلُ الدالُّ على أنّ صفة كذا يُراد بها كذا؟"]], "tr": [[1068.0, "Üçüncü cevap, (külliyedeki) \"üzerinde delil yoktur\" sözündedir."], [1073.0, "Yani asıl olan zahir üzere kalmaktır;"], [1076.0, "delil bu geçişe delâlet etmedikçe sözün zahirinden başka bir manaya geçmek caiz değildir."], [1083.0, "Asıl olan sözün hakikati üzere kalmaktır;"], [1086.2, "o geçiş üzerinde bir delil bulunmadıkça hakikatten mecaza geçmek caiz değildir."], [1093.0, "Şu sıfattan şunun kastedildiğine delâlet eden delil nerede?"]]}, {"reader": false, "ar": [[1099.0, "فإنك تريد منّي أن أفهم خلافَ الظاهر،"], [1103.0, "وأنا لا أنتقل عن الظاهر إلى المؤوَّل إلا بدليل،"], [1108.0, "ولا أنصرف عن الحقيقة إلى المجاز إلا بدليل."], [1113.0, "فتحريفُك هذا ليس عليه دليلٌ يقضي منّي ـ أو يقتضي ـ أن أنتقل إلى معنًى آخر."], [1123.0, "وكلُّ انتقالٍ من ظاهر النصّ إلى معنًى آخر بلا دليلٍ ولا قرينةٍ فهو تحريف؛"], [1135.0, "بمعنى أنه داخلٌ في قول الله عز وجل:"], [1139.7, "<span class=\"ayah\">﴿يُحَرِّفُونَ الْكَلِمَ عَن مَّوَاضِعِهِ﴾<\/span> <span class=\"ref\">[النساء: ٤٦]<\/span>،"], [1142.0, "وفي قوله عز وجل:"], [1144.7, "<span class=\"ayah\">﴿يُحَرِّفُونَ الْكَلِمَ مِن بَعْدِ مَوَاضِعِهِ﴾<\/span> <span class=\"ref\">[المائدة: ٤١]<\/span>."]], "tr": [[1099.0, "Sen benden zahire aykırı olanı anlamamı istiyorsun;"], [1103.6, "ben ise ancak bir delille zahirden müevvele geçerim, ancak bir delille hakikatten mecaza dönerim."], [1113.0, "Senin bu tahrifin üzerinde, benim başka bir manaya geçmemi hükmeden —veya gerektiren— bir delil yoktur."], [1123.0, "Nassın zahirinden delilsiz ve karinesiz başka bir manaya yapılan her geçiş tahriftir;"], [1135.0, "yani Allah Azze ve Celle'nin <span class=\"ayah\">﴿Kelimeleri yerlerinden değiştirirler﴾<\/span> [Nisâ 46] sözüne ve O Azze ve Celle'nin <span class=\"ayah\">﴿Kelimeleri yerlerine konulduktan sonra değiştirirler﴾<\/span> [Mâide 41] sözüne dahildir."]]}]}, {"ts": "19:08", "title": "3. Külliye (devam): Üç cevabın örnekleri — yüz, iki el, istivâ, gelme, nüzul, ayak", "paras": [{"reader": false, "ar": [[1148.0, "فهذه الأجوبةُ الثلاثة تصلح لكلّ تحريف،"], [1152.3, "وأضربُ لكم أمثلة: إذا قال المحرِّفُ بأنّ المراد من قول الله عز وجل:"], [1159.7, "<span class=\"ayah\">﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٧]<\/span> أنّ المراد به الذات،"], [1163.0, "فقل: إنّ تحريفك هذا خلافُ فهم السلف،"], [1167.3, "وخلافُ لغة العرب، وليس عليه دليل."], [1171.0, "وإذا قال لك المحرِّفُ في قول الله عز وجل:"], [1175.5, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span> أنّ المراد بها النعمةُ أو القوّة،"], [1179.0, "فقل: إنّ تحريفك هذا خلافُ فهم السلف،"], [1183.1, "وخلافُ اللغة، وليس عليه دليل."]], "tr": [[1148.0, "Bu üç cevap her tahrife elverişlidir."], [1155.0, "Size örnekler vereyim: Tahrifçi, Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rabbinin yüzü bâkî kalır﴾<\/span> [Rahmân 27] sözünden maksadın zât olduğunu söylerse, de ki:"], [1163.6, "\"Senin bu tahrifin selefin anlayışına aykırıdır, Arap diline aykırıdır ve üzerinde delil yoktur.\" Tahrifçi sana Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bilakis O'nun iki eli açıktır﴾<\/span> [Mâide 64] sözü hakkında bundan maksadın nimet veya kuvvet olduğunu söylerse, de ki:"], [1179.6, "\"Senin bu tahrifin selefin anlayışına aykırıdır, dile aykırıdır ve üzerinde delil yoktur.\""]]}, {"reader": false, "ar": [[1186.0, "وإذا قال لك المحرِّفُ بأنّ المراد من قول الله عز وجل:"], [1194.0, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span>،"], [1196.0, "أي: استولى، فقل له:"], [1198.1, "إنّ تحريفك هذا مخالفٌ لفهم السلف في هذه الآية،"], [1203.0, "ومخالفٌ للغة العرب، وليس عليه دليل."], [1208.0, "وإذا قال لك المحرِّفُ في قول الله عز وجل:"], [1212.0, "<span class=\"ayah\">﴿وَجَاءَ رَبُّكَ﴾<\/span> <span class=\"ref\">[الفجر: ٢٢]<\/span>، أي: جاء أمرُه أو رحمتُه،"], [1216.0, "فقل: إنّ تحريفك هذا خلافُ فهم السلف،"], [1220.2, "وخلافُ لغة العرب، وليس عليه دليل."]], "tr": [[1186.0, "Tahrifçi sana Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5] sözünden maksadın \"istilâ etti (hâkim oldu)\" olduğunu söylerse, ona de ki:"], [1198.1, "\"Senin bu tahrifin bu ayet hakkında selefin anlayışına aykırıdır, Arap diline aykırıdır ve üzerinde delil yoktur.\" Tahrifçi sana Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rabbin geldi﴾<\/span> [Fecr 22] sözü hakkında \"yani O'nun emri veya rahmeti geldi\" derse, de ki:"], [1213.7, "\"Senin bu tahrifin selefin anlayışına aykırıdır, Arap diline aykırıdır ve üzerinde delil yoktur.\""]]}, {"reader": false, "ar": [[1224.0, "وإذا قال لك المحرِّفُ بأنّ المراد من قول النبيّ صلى الله عليه وسلم:"], [1230.5, "«ينزل ربُّنا»، أي: نزولُ الملَك،"], [1233.0, "أو الأمر، أو الرحمة،"], [1235.0, "فقل: إنّ تحريفك هذا خلافُ فهم السلف في هذا النصّ،"], [1240.0, "وخلافُ لغة العرب، وليس عليه دليل."], [1243.0, "وإذا قال لك المحرِّفُ في قول النبيّ صلى الله عليه وسلم:"], [1249.5, "«حتى يضعَ ربُّ العزّة عليها رِجلَه»،"], [1253.0, "أنّ المراد بالرِّجل طائفةٌ من الناس،"], [1256.0, "فقل: إنّ تحريفك هذا خلافُ فهم السلف في هذا النصّ،"], [1262.0, "وخلافُ اللغة، وليس عليه دليل."]], "tr": [[1224.0, "Tahrifçi sana Peygamber sallallâhu aleyhi ve sellem'in \"Rabbimiz iner\" sözünden maksadın meleğin, emrin veya rahmetin inmesi olduğunu söylerse, de ki:"], [1235.5, "\"Senin bu tahrifin bu nas hakkında selefin anlayışına aykırıdır, Arap diline aykırıdır ve üzerinde delil yoktur.\" Tahrifçi sana Peygamber sallallâhu aleyhi ve sellem'in \"Nihayet İzzet'in Rabbi onun üzerine ayağını (ricl) koyar\" sözü hakkında, \"ricl\"den maksadın insanlardan bir topluluk olduğunu söylerse, de ki:"], [1256.6, "\"Senin bu tahrifin bu nas hakkında selefin anlayışına aykırıdır, dile aykırıdır ve üzerinde delil yoktur.\""]]}, {"reader": false, "ar": [[1265.0, "مع أنّ كثيرًا من التحريفات تحتمل أجوبةً أكثر،"], [1269.0, "ولكنّ هذه الأجوبة الثلاثة يصلح أن تبدأ بها في الإجابة عن كلّ تحريف،"], [1278.0, "وهي كافيةٌ في الحقيقة لمن أراد الحقّ. والله أعلم."]], "tr": [[1265.0, "Bununla birlikte tahriflerin çoğu daha fazla cevaba ihtimal verir;"], [1269.8, "fakat bu üç cevap, her tahrife cevap verirken onlarla başlamana elverişlidir."], [1277.3, "Hakikatte hakkı isteyen için bunlar yeterlidir. Allah en iyisini bilir."]]}]}, {"ts": "21:23", "title": "4. Külliye: İzafeti farklı olan her sıfatın keyfiyeti de farklıdır", "paras": [{"reader": false, "ar": [[1283.0, "ومن الكلّيّات أيضًا: <b>كلُّ صفةٍ اختلفت إضافتُها فتختلف كيفيّتُها.<\/b> <b>كلُّ صفةٍ اختلفت إضافتُها فتختلف كيفيّتُها.<\/b>"]], "tr": [[1283.0, "Külliyelerden biri de şudur: 4."], [1285.1, "külliye: İzafeti (nispet edildiği zât) farklı olan her sıfatın keyfiyeti de farklı olur.<b> <\/b>4."], [1291.8, "külliye: İzafeti farklı olan her sıfatın keyfiyeti de farklı olur."]]}, {"reader": false, "ar": [[1299.0, "أقول وبالله تعالى التوفيق:"], [1312.0, "وهذه من القواعد العقليّة التي يُردّ بها على أهل البدع في تمثيل صفات الله عز وجل بصفات خلقه،"], [1322.0, "أو تعطيلِ الله عز وجل عن صفاته الواردة في الكتاب والسنّة خوفًا من تمثيلها بصفات مخلوقاته."], [1332.0, "فيُقال لهم: بأنّ المتقرِّر عقلًا أنه متى ما اختلفت الإضافاتُ اختلفت الصفات."]], "tr": [[1299.0, "Tevfik Allah'tandır, derim ki: Bu, bid'at ehline —Allah Azze ve Celle'nin sıfatlarını mahlûklarının sıfatlarına benzetmeleri (temsil) veya mahlûklarının sıfatlarına benzetme korkusuyla Allah Azze ve Celle'yi Kitap ve Sünnet'te gelen sıfatlarından soyutlamaları (ta'til) hususunda— reddiye olarak kullanılan aklî kaidelerdendir."], [1332.0, "Onlara şöyle denir: Akılda yerleşik olan şudur:"], [1337.2, "İzafetler farklılaştığında sıfatlar da farklılaşır."]]}, {"reader": false, "ar": [[1340.0, "فإذا قلنا: وجهُ الله،"], [1341.8, "فإنّ الوجه مضافٌ إلى الله،"], [1344.0, "وإذا قلنا: وجهُ المخلوق،"], [1346.7, "فإنه وجهٌ مضافٌ إلى المخلوق."], [1350.0, "فهل اتّفقت الإضافاتُ أو اختلفت؟"], [1353.0, "الجواب: بل اختلفت. ومع اختلاف الإضافات فلا بدّ أن تختلف الصفة؛"], [1359.0, "فلا يمكن أبدًا أن يكون وجهُ الله كوجه المخلوق مع اختلاف الإضافات."]], "tr": [[1340.0, "\"Allah'ın yüzü\" dediğimizde yüz Allah'a izafe edilmiştir;"], [1343.1, "\"mahlûkun yüzü\" dediğimizde ise mahlûka izafe edilmiş bir yüzdür."], [1350.0, "İzafetler aynı mı oldu, farklı mı?"], [1353.0, "Cevap: Bilakis farklı oldu. İzafetler farklı olunca sıfatın da farklı olması zorunludur."], [1359.0, "İzafetler farklıyken Allah'ın yüzünün mahlûkun yüzü gibi olması asla mümkün değildir."]]}, {"reader": false, "ar": [[1366.0, "وكقول الله عز وجل:"], [1369.0, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span>،"], [1372.0, "وقولِه عز وجل: <span class=\"ayah\">﴿لِتَسْتَوُوا عَلَىٰ ظُهُورِهِ﴾<\/span> <span class=\"ref\">[الزخرف: ١٣]<\/span>؛"], [1377.0, "فإنّ الاستواء الأوّل مضافٌ إلى مَن؟"], [1380.0, "إلى الله، والاستواءُ الثاني مضافٌ إلى المخلوق،"], [1383.8, "على ظهور الدوابّ والفُلك."], [1386.0, "فهل اتّفقت الإضافاتُ أو اختلفت؟"], [1389.0, "الجواب: بل اختلفت. ومع اختلاف الإضافات فلا يمكن أبدًا أن يكون الاستواءُ الأوّل كالاستواء الثاني،"], [1398.0, "إلا عند من لا يعقل،"], [1400.2, "أو لا يُفكّر بعقله."]], "tr": [[1366.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5] sözü ile O Azze ve Celle'nin <span class=\"ayah\">﴿Onların sırtlarına yerleşesiniz (istivâ edesiniz) diye﴾<\/span> [Zuhruf 13] sözü gibi."], [1377.0, "Birinci istivâ kime izafe edilmiştir?"], [1380.0, "Allah'a. İkinci istivâ ise hayvanların ve gemilerin sırtları üzerinde mahlûka izafe edilmiştir."], [1386.0, "İzafetler aynı mı oldu, farklı mı?"], [1389.0, "Cevap: Bilakis farklı oldu. İzafetler farklıyken birinci istivânın ikinci istivâ gibi olması asla mümkün değildir;"], [1397.4, "ancak aklını kullanmayan veya aklıyla düşünmeyen birinin nezdinde (böyle olabilir)."]]}, {"reader": false, "ar": [[1402.0, "وكذلك أيضًا لو قلنا:"], [1404.9, "يدُ الله ويدُ المخلوق،"], [1409.0, "فإنّ اليد الأولى أُضيفت إلى الله،"], [1411.7, "واليد الثانية أُضيفت إلى المخلوق."], [1414.0, "فهل اتّفقت الإضافاتُ أو اختلفت؟"], [1417.0, "الجواب: بل اختلفت. ومع اختلاف الإضافات فلا بدّ أن تختلف الصفات،"], [1422.0, "ولا يمكن أن تتّفق في كيفيّتها أبدًا."], [1426.0, "أضربُ أمثلةً لأنه سينتشر في العالم الإسلاميّ،"], [1432.0, "فلا بدّ أن يفهم الجميع."]], "tr": [[1402.0, "Aynı şekilde \"Allah'ın eli\" ve \"mahlûkun eli\" desek, birinci el Allah'a, ikinci el mahlûka izafe edilmiştir."], [1414.0, "İzafetler aynı mı oldu, farklı mı?"], [1419.0, "Cevap: Bilakis farklı oldu. İzafetler farklı olunca sıfatların da farklı olması zorunludur;"], [1424.3, "keyfiyetlerinde asla aynı olamazlar. Örnekler veriyorum, çünkü bu (ders) İslâm âleminde yayılacak; herkesin anlaması gerekir."]]}, {"reader": false, "ar": [[1433.0, "وكذلك إذا قلنا: عينُ الله وعينُ المخلوق،"], [1439.0, "فإنّ العين الأولى أُضيفت إلى الله عز وجل،"], [1443.9, "والعين الثانية أُضيفت إلى المخلوق."], [1447.0, "فهل اتّفقت الإضافاتُ أو اختلفت؟"], [1450.0, "الجواب: بل اختلفت. ومع اختلاف الإضافة فلا يمكن أن تكون العينُ الأولى كالعين الثانية."]], "tr": [[1433.0, "Aynı şekilde \"Allah'ın gözü\" ve \"mahlûkun gözü\" dediğimizde, birinci göz Allah Azze ve Celle'ye, ikinci göz mahlûka izafe edilmiştir."], [1447.0, "İzafetler aynı mı oldu, farklı mı?"], [1450.0, "Cevap: Bilakis farklı oldu. İzafet farklıyken birinci gözün ikinci göz gibi olması mümkün değildir."]]}, {"reader": false, "ar": [[1456.0, "وكذلك لو قلنا: علوُّ الله وعلوُّ المخلوق،"], [1461.0, "فإنّ العلوّ الأوّل أُضيف إلى الله عز وجل،"], [1464.7, "والعلوّ الثاني أُضيف إلى المخلوق."], [1467.0, "فهل اتّفقت الإضافاتُ أو اختلفت؟"], [1471.0, "الجواب: بل اختلفت، ومع اختلاف الإضافات فلا بدّ أن تختلف الصفة."], [1476.0, "وكذلك لو قلنا: سمعُ الخالق وبصرُ الخالق،"], [1480.8, "وسمعُ المخلوق وبصرُ المخلوق،"], [1489.0, "فإنّ السمع والبصر في الأوّل أُضيف إلى الله عز وجل،"], [1493.0, "وفي الثاني أُضيف إلى المخلوق."], [1496.0, "فهل اتّفقت الإضافاتُ أو اختلفت؟"], [1499.0, "الجواب: بل اختلفت، ومع اختلاف الإضافات فلا بدّ أن تختلف الصفة."]], "tr": [[1456.0, "Aynı şekilde \"Allah'ın uluvvü\" ve \"mahlûkun uluvvü\" desek, birinci uluv Allah Azze ve Celle'ye, ikinci uluv mahlûka izafe edilmiştir."], [1467.0, "İzafetler aynı mı oldu, farklı mı?"], [1471.0, "Cevap: Bilakis farklı oldu; izafetler farklı olunca sıfatın da farklı olması zorunludur."], [1476.0, "Aynı şekilde \"Yaratıcının işitmesi ve Yaratıcının görmesi\" ile \"mahlûkun işitmesi ve mahlûkun görmesi\" desek, birincisinde işitme ve görme Allah Azze ve Celle'ye, ikincisinde mahlûka izafe edilmiştir."], [1496.0, "İzafetler aynı mı oldu, farklı mı?"], [1499.0, "Cevap: Bilakis farklı oldu; izafetler farklı olunca sıfatın da farklı olması zorunludur."]]}]}, {"ts": "25:03", "title": "4. Külliye (devam): Bid'at ehli sarih akla muhalefet etti", "paras": [{"reader": false, "ar": [[1503.0, "وهذا يدلّك على أنّ أهل البدع قد خالفوا المعقولَ الصريح في تمثيل صفات الله عز وجل بصفات خلقه،"], [1514.7, "متعامين على أنّ الصفة في الحالتين قد اختلفت إضافتُها."], [1527.0, "ففي قول الله عز وجل مثلًا:"], [1531.2, "<span class=\"ayah\">﴿يَدُ اللَّهِ فَوْقَ أَيْدِيهِمْ﴾<\/span> <span class=\"ref\">[الفتح: ١٠]<\/span>،"], [1534.0, "فاليدُ الأولى أُضيفت إلى الله عز وجل،"], [1537.0, "واليدُ الثانية أُضيفت إلى المخلوق،"], [1540.0, "ومع اختلاف الإضافات فلا بدّ أن تختلف الصفات،"], [1543.3, "ولا شكّ في ذلك."]], "tr": [[1503.0, "Bu sana gösterir ki bid'at ehli, Allah Azze ve Celle'nin sıfatlarını mahlûklarının sıfatlarına benzetmekte sarih akla muhalefet etmişlerdir;"], [1514.7, "iki durumda sıfatın izafetinin farklı olduğuna karşı körlük etmişlerdir."], [1527.0, "Mesela Allah Azze ve Celle'nin <span class=\"ayah\">﴿Allah'ın eli onların ellerinin üstündedir﴾<\/span> [Fetih 10] sözünde birinci el Allah Azze ve Celle'ye, ikinci el mahlûka izafe edilmiştir."], [1540.4, "İzafetler farklı olunca sıfatların da farklı olması zorunludur; bunda şüphe yoktur."]]}, {"reader": false, "ar": [[1545.0, "فهذه قاعدةٌ عقليّةٌ يُجاب بها عن كلّ من عطّل صفةً من صفات الله خوفًا من مماثلة الخالق بالمخلوق؛"], [1561.0, "فيُقال له: إنّ الصفة الأولى أُضيفت إلى الله،"], [1564.0, "والصفة الثانية أُضيفت إلى المخلوق،"], [1567.0, "ومع اختلاف الإضافات فتختلف الصفات."], [1571.0, "ولعلّها واضحة، والله أعلم."]], "tr": [[1545.0, "Bu, Yaratıcıyı mahlûka benzetme korkusuyla Allah'ın sıfatlarından bir sıfatı ta'til eden herkese cevap olarak kullanılan aklî bir kaidedir."], [1561.0, "Ona denir ki: Birinci sıfat Allah'a, ikinci sıfat mahlûka izafe edilmiştir;"], [1565.8, "izafetler farklı olunca sıfatlar da farklı olur."], [1571.0, "Umarım açıktır. Allah en iyisini bilir."]]}]}, {"ts": "26:13", "title": "5. Külliye: Allah'ın bütün sıfatları, mahlûkların sıfatlarının isimleriyle örtüşse bile, keyfiyet bakımından O'na hastır", "paras": [{"reader": false, "ar": [[1573.0, "ومن الكلّيّات أيضًا: كلُّ صفات الله تخصُّه كيفيّةً،"], [1584.0, "وإن اتّفقت مع أسماء صفات المخلوقات.<b> <\/b>كلُّ صفات الله عز وجل تخصُّه كيفيّةً،"], [1592.3, "وإن اتّفقت مع أسماء صفات المخلوقات."]], "tr": [[1573.0, "Külliyelerden biri de şudur: 5."], [1581.0, "külliye: Allah'ın bütün sıfatları, mahlûkların sıfatlarının isimleriyle örtüşse bile, keyfiyet bakımından O'na hastır.<b> <\/b>5."], [1588.0, "külliye: Allah Azze ve Celle'nin bütün sıfatları, mahlûkların sıfatlarının isimleriyle örtüşse bile, keyfiyet bakımından O'na hastır."]]}, {"reader": false, "ar": [[1596.0, "أقول وبالله التوفيق: وهذه القاعدة هي التي نقول فيها دائمًا:"], [1601.8, "إنّ الاتّفاق في الأسماء لا يستلزم الاتّفاقَ في الصفات؛"], [1607.0, "بمعنى أنه ليس كلُّ شيئين اتّفقا في اسمهما فلا بدّ أن يتّفقا في مسمّاهما،"], [1617.0, "أو كيفيّتهما، أو صفاتهما."], [1621.0, "وهذه القاعدة يدلّ عليها دليلُ النقل، والعقل، والحسّ."]], "tr": [[1596.0, "Tevfik Allah'tandır, derim ki: Bu kaide, hakkında daima \"İsimlerde ortaklık, sıfatlarda ortaklığı gerektirmez\" dediğimiz kaidedir."], [1607.0, "Yani isimlerinde ortak olan her iki şeyin, müsemmalarında (isimlendirilen hakikatlerinde), keyfiyetlerinde veya sıfatlarında da ortak olması gerekmez."], [1621.0, "Bu kaideye nakil delili, akıl delili ve his delili delâlet eder."]]}]}, {"ts": "27:09", "title": "5. Külliye (devam): Nakil delili — ilim, meşîet, irade, muhabbet, rıza, makt, amel", "paras": [{"reader": false, "ar": [[1629.0, "فأمّا دليلُ النقل: فلأننا نجد الله عز وجل في كتابه يصف نفسه بصفاتٍ يصف بها عباده،"], [1640.0, "وليس الموصوفُ كالموصوف. فقد وصف الله عز وجل نفسه بالعلم في قوله:"], [1649.0, "<span class=\"ayah\">﴿وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>،"], [1652.0, "ووصف عبادَه بالعلم في قوله:"], [1655.5, "<span class=\"ayah\">﴿وَفَوْقَ كُلِّ ذِي عِلْمٍ عَلِيمٌ﴾<\/span> <span class=\"ref\">[يوسف: ٧٦]<\/span>،"], [1660.0, "وليس العلمُ المضافُ إلى الله عز وجل كالعلم المضاف إلى المخلوق،"], [1663.8, "وإن اتّفقا في اسم العلم."]], "tr": [[1629.0, "Nakil delili şudur: Allah Azze ve Celle'nin Kitabı'nda kendisini, kullarını da vasıflandırdığı sıfatlarla vasıflandırdığını görürüz;"], [1639.3, "fakat vasıflanan, vasıflanan gibi değildir."], [1642.0, "Allah Azze ve Celle kendisini <span class=\"ayah\">﴿Onlar, O'nun ilminden, dilediği dışında hiçbir şeyi kuşatamazlar﴾<\/span> [Bakara 255] sözünde ilimle vasıflandırmış;"], [1649.0, "kullarını da <span class=\"ayah\">﴿Her ilim sahibinin üstünde daha iyi bilen biri vardır﴾<\/span> [Yûsuf 76] sözünde ilimle vasıflandırmıştır."], [1655.5, "İlim ismi bakımından örtüşseler de Allah Azze ve Celle'ye izafe edilen ilim, mahlûka izafe edilen ilim gibi değildir."]]}, {"reader": false, "ar": [[1666.0, "وكذلك أيضًا نجد الله عز وجل يصف نفسه بالمشيئة،"], [1672.7, "ويصف عبادَه بنفس الصفة،"], [1675.0, "فقال: <span class=\"ayah\">﴿وَمَا تَشَاءُونَ إِلَّا أَن يَشَاءَ اللَّهُ﴾<\/span> <span class=\"ref\">[الإنسان: ٣٠]<\/span>،"], [1679.5, "وليست المشيئةُ المضافةُ إلى المخلوق كالمشيئة المضافة إلى الله،"], [1685.3, "وإن اتّفقا في الاسم. وسأُكثر الأمثلة."]], "tr": [[1666.0, "Aynı şekilde Allah Azze ve Celle'nin kendisini meşîetle (dilemekle) vasıflandırdığını, kullarını da aynı sıfatla vasıflandırdığını görürüz."], [1675.6, "Şöyle buyurmuştur: <span class=\"ayah\">﴿Allah dilemedikçe siz dileyemezsiniz﴾<\/span> [İnsân 30]."], [1680.2, "İsim bakımından örtüşseler de mahlûka izafe edilen meşîet, Allah'a izafe edilen meşîet gibi değildir. Örnekleri çoğaltacağım."]]}, {"reader": false, "ar": [[1691.0, "وكذلك أيضًا نجد الله عز وجل يصف نفسه بالإرادة،"], [1696.5, "ويصف عبادَه بنفس الصفة،"], [1699.0, "فقال الله عز وجل:"], [1701.5, "<span class=\"ayah\">﴿تُرِيدُونَ عَرَضَ الدُّنْيَا وَاللَّهُ يُرِيدُ الْآخِرَةَ﴾<\/span> <span class=\"ref\">[الأنفال: ٦٧]<\/span>،"], [1705.2, "وليس المريدُ كالمريد. وكذلك يصف نفسه بالمحبّة،"], [1709.9, "ويصف عبادَه بنفس الصفة،"], [1714.0, "فقال الله عز وجل:"], [1716.4, "<span class=\"ayah\">﴿فَسَوْفَ يَأْتِي اللَّهُ بِقَوْمٍ يُحِبُّهُمْ وَيُحِبُّونَهُ﴾<\/span> <span class=\"ref\">[المائدة: ٥٤]<\/span>،"], [1720.0, "وليست المحبّةُ كالمحبّة، وهذا متّفقٌ عليه بين أهل السنة والجماعة."]], "tr": [[1691.0, "Aynı şekilde Allah Azze ve Celle'nin kendisini irade ile vasıflandırdığını, kullarını da aynı sıfatla vasıflandırdığını görürüz."], [1698.4, "Allah Azze ve Celle şöyle buyurmuştur:"], [1701.5, "<span class=\"ayah\">﴿Siz dünyanın geçici malını istiyorsunuz; Allah ise âhireti istiyor﴾<\/span> [Enfâl 67]."], [1704.5, "İrade eden, irade eden gibi değildir."], [1707.0, "Aynı şekilde kendisini muhabbetle (sevmekle) vasıflandırır, kullarını da aynı sıfatla vasıflandırır."], [1712.1, "Allah Azze ve Celle şöyle buyurmuştur:"], [1716.4, "<span class=\"ayah\">﴿Allah, kendilerini sevdiği ve kendisini seven bir kavim getirecektir﴾<\/span> [Mâide 54]."], [1720.9, "Muhabbet, muhabbet gibi değildir; bu, Ehl-i Sünnet ve'l-Cemaat arasında ittifakla kabul edilmiştir."]]}, {"reader": false, "ar": [[1729.0, "وكذلك يصف نفسه بالرضا،"], [1732.0, "ويصف عبادَه بالرضا، فقال الله عز وجل:"], [1737.2, "<span class=\"ayah\">﴿رَّضِيَ اللَّهُ عَنْهُمْ وَرَضُوا عَنْهُ﴾<\/span> <span class=\"ref\">[المائدة: ١١٩]<\/span>،"], [1740.0, "وليس الرضا المضافُ إلى الله عز وجل كالرضا المضاف إلى المخلوق؛"], [1746.0, "لأنّ الاتّفاق في الأسماء لا يستلزم الاتّفاقَ في الصفات."]], "tr": [[1729.0, "Aynı şekilde kendisini rızayla vasıflandırır, kullarını da rızayla vasıflandırır."], [1733.5, "Allah Azze ve Celle şöyle buyurmuştur:"], [1737.2, "<span class=\"ayah\">﴿Allah onlardan razı olmuştur, onlar da O'ndan razı olmuşlardır﴾<\/span> [Mâide 119]."], [1741.1, "Allah Azze ve Celle'ye izafe edilen rıza, mahlûka izafe edilen rıza gibi değildir;"], [1746.0, "çünkü isimlerde ortaklık, sıfatlarda ortaklığı gerektirmez."]]}, {"reader": false, "ar": [[1751.0, "وكذلك أيضًا يصف نفسه بالمقت،"], [1756.0, "ويصف في نفس الآية عبادَه بالمقت،"], [1760.0, "كما قال الله عز وجل:"], [1763.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ كَفَرُوا يُنَادَوْنَ لَمَقْتُ اللَّهِ أَكْبَرُ مِن مَّقْتِكُمْ أَنفُسَكُمْ إِذْ تُدْعَوْنَ إِلَى الْإِيمَانِ فَتَكْفُرُونَ﴾<\/span> <span class=\"ref\">[غافر: ١٠]<\/span>،"], [1773.0, "وليس المقتُ المضافُ إلى الله كالمقت المضاف إلى المخلوق،"], [1778.5, "وإن اتّفقا في الاسم."]], "tr": [[1751.0, "Aynı şekilde kendisini makt (şiddetli buğz) ile vasıflandırır ve aynı ayette kullarını da makt ile vasıflandırır."], [1760.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1763.0, "<span class=\"ayah\">﴿Kâfirlere şöyle seslenilir: Allah'ın buğzu, sizin kendinize olan buğzunuzdan daha büyüktür; çünkü siz imana çağrılıyordunuz da inkâr ediyordunuz﴾<\/span> [Mü'min (Ğâfir) 10]."], [1773.6, "İsim bakımından örtüşseler de Allah'a izafe edilen makt, mahlûka izafe edilen makt gibi değildir."]]}, {"reader": false, "ar": [[1781.0, "وكذلك أيضًا يصف نفسه بالعمل،"], [1786.0, "فقال الله عز وجل:"], [1788.2, "<span class=\"ayah\">﴿أَوَلَمْ يَرَوْا أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَا﴾<\/span> <span class=\"ref\">[يس: ٧١]<\/span>،"], [1793.0, "وقلتُ لكم بأنّ الفعل إذا أُضيف إلى الآلة فإنّ المراد به نفسُ العامل."], [1799.0, "ووصف عبادَه بالعمل في قوله:"], [1802.6, "<span class=\"ayah\">﴿جَزَاءً بِمَا كَانُوا يَعْمَلُونَ﴾<\/span> <span class=\"ref\">[الواقعة: ٢٤]<\/span>،"], [1807.0, "وليس العملُ المضافُ إلى الله كالعمل المضاف إلى المخلوق،"], [1811.2, "وإن اتّفقا في الاسم."]], "tr": [[1781.0, "Aynı şekilde kendisini amel (yapmak) ile vasıflandırır."], [1784.2, "Allah Azze ve Celle şöyle buyurmuştur:"], [1788.2, "<span class=\"ayah\">﴿Görmediler mi ki ellerimizin yaptığı şeylerden onlar için (hayvanlar) yarattık?﴾<\/span> [Yâsîn 71]."], [1793.9, "Size söylemiştim: Fiil âlete (ele) izafe edildiğinde, ondan maksat fiili yapanın kendisidir."], [1799.0, "Kullarını da <span class=\"ayah\">﴿Yapmakta olduklarına karşılık olarak﴾<\/span> [Vâkıa 24] sözünde amel ile vasıflandırmıştır."], [1807.5, "İsim bakımından örtüşseler de Allah'a izafe edilen amel, mahlûka izafe edilen amel gibi değildir."]]}]}, {"ts": "30:13", "title": "5. Külliye (devam): Nakil delili — münâcât, nidâ ve teklîm", "paras": [{"reader": false, "ar": [[1813.0, "ووصف نفسه بالمناجاة والمناداة،"], [1818.0, "فقال: <span class=\"ayah\">﴿وَنَادَيْنَاهُ مِن جَانِبِ الطُّورِ الْأَيْمَنِ وَقَرَّبْنَاهُ نَجِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٥٢]<\/span>،"], [1825.0, "وقال الله عز وجل:"], [1827.0, "<span class=\"ayah\">﴿وَيَوْمَ يُنَادِيهِمْ﴾<\/span> <span class=\"ref\">[القصص: ٦٢]<\/span>، وقال الله عز وجل: <span class=\"ayah\">﴿وَنَادَاهُمَا رَبُّهُمَا﴾<\/span> <span class=\"ref\">[الأعراف: ٢٢]<\/span>."]], "tr": [[1813.0, "Kendisini münâcât (gizlice konuşma) ve nidâ (seslenme) ile vasıflandırmış, şöyle buyurmuştur:"], [1818.7, "<span class=\"ayah\">﴿Ona Tûr'un sağ yanından seslendik ve onu, kendisiyle gizlice konuşmak üzere yaklaştırdık﴾<\/span> [Meryem 52]."], [1825.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1827.0, "<span class=\"ayah\">﴿O gün (Allah) onlara seslenir﴾<\/span> [Kasas 62]."], [1828.5, "Allah Azze ve Celle şöyle buyurmuştur:"], [1829.5, "<span class=\"ayah\">﴿Rableri onlara seslendi﴾<\/span> [A'râf 22]."]]}, {"reader": false, "ar": [[1831.0, "ووصف عبادَه أيضًا بالمناداة والمناجاة في قوله عز وجل:"], [1836.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ يُنَادُونَكَ مِن وَرَاءِ الْحُجُرَاتِ أَكْثَرُهُمْ لَا يَعْقِلُونَ﴾<\/span> <span class=\"ref\">[الحجرات: ٤]<\/span>،"], [1843.0, "وقال الله عز وجل:"], [1844.5, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا تَنَاجَيْتُمْ فَلَا تَتَنَاجَوْا بِالْإِثْمِ وَالْعُدْوَانِ﴾<\/span> <span class=\"ref\">[المجادلة: ٩]<\/span>،"], [1850.0, "وقال الله عز وجل:"], [1852.0, "<span class=\"ayah\">﴿إِذَا نَاجَيْتُمُ الرَّسُولَ فَقَدِّمُوا بَيْنَ يَدَيْ نَجْوَاكُمْ صَدَقَةً﴾<\/span> <span class=\"ref\">[المجادلة: ١٢]<\/span>."], [1856.0, "وليس النداءُ كالنداء، ولا المناجاةُ كالمناجاة،"], [1860.2, "وإن اتّفقا في الاسم."]], "tr": [[1831.0, "Kullarını da nidâ ve münâcât ile vasıflandırmıştır."], [1833.2, "O Azze ve Celle şöyle buyurmuştur:"], [1836.0, "<span class=\"ayah\">﴿Sana odaların arkasından seslenenlerin çoğu akıl etmezler﴾<\/span> [Hucurât 4]."], [1841.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1844.5, "<span class=\"ayah\">﴿Ey iman edenler! Gizlice konuştuğunuz zaman günah ve düşmanlık hakkında gizlice konuşmayın﴾<\/span> [Mücâdele 9]."], [1849.3, "Allah Azze ve Celle şöyle buyurmuştur:"], [1852.0, "<span class=\"ayah\">﴿Resûl ile gizlice konuşacağınız zaman, gizli konuşmanızdan önce bir sadaka verin﴾<\/span> [Mücâdele 12]."], [1856.0, "İsim bakımından örtüşseler de nidâ, nidâ gibi değildir;"], [1860.2, "münâcât da münâcât gibi değildir."]]}, {"reader": false, "ar": [[1863.0, "ووصف نفسه بالتكليم، فقال الله عز وجل:"], [1867.8, "<span class=\"ayah\">﴿وَكَلَّمَ اللَّهُ مُوسَىٰ تَكْلِيمًا﴾<\/span> <span class=\"ref\">[النساء: ١٦٤]<\/span>،"], [1872.0, "وقال الله عز وجل:"], [1874.4, "<span class=\"ayah\">﴿وَلَمَّا جَاءَ مُوسَىٰ لِمِيقَاتِنَا وَكَلَّمَهُ رَبُّهُ﴾<\/span> <span class=\"ref\">[الأعراف: ١٤٣]<\/span>،"], [1878.0, "وقال الله عز وجل:"], [1880.0, "<span class=\"ayah\">﴿تِلْكَ الرُّسُلُ فَضَّلْنَا بَعْضَهُمْ عَلَىٰ بَعْضٍ ۘ مِّنْهُم مَّن كَلَّمَ اللَّهُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٣]<\/span>."], [1885.0, "ووصف عبادَه بنفس الصفة،"], [1887.5, "فقال: <span class=\"ayah\">﴿وَقَالَ الْمَلِكُ ائْتُونِي بِهِ أَسْتَخْلِصْهُ لِنَفْسِي ۖ فَلَمَّا كَلَّمَهُ قَالَ إِنَّكَ الْيَوْمَ لَدَيْنَا مَكِينٌ أَمِينٌ﴾<\/span> <span class=\"ref\">[يوسف: ٥٤]<\/span>."]], "tr": [[1863.0, "Kendisini teklîm (konuşma) ile vasıflandırmıştır."], [1865.1, "Allah Azze ve Celle şöyle buyurmuştur:"], [1867.8, "<span class=\"ayah\">﴿Allah Mûsâ ile gerçekten konuştu﴾<\/span> [Nisâ 164]."], [1872.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1874.4, "<span class=\"ayah\">﴿Mûsâ tayin ettiğimiz vakitte gelince Rabbi onunla konuştu﴾<\/span> [A'râf 143]."], [1878.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1880.0, "<span class=\"ayah\">﴿İşte o peygamberler; onların bir kısmını bir kısmına üstün kıldık. İçlerinden Allah'ın konuştukları vardır﴾<\/span> [Bakara 253]."], [1885.0, "Kullarını da aynı sıfatla vasıflandırmış, şöyle buyurmuştur:"], [1888.2, "<span class=\"ayah\">﴿Hükümdar dedi ki: Onu bana getirin, onu kendime has kılayım. Onunla konuşunca da: Sen bugün yanımızda itibarlı ve güvenilir birisin, dedi﴾<\/span> [Yûsuf 54]."]]}, {"reader": false, "ar": [[1897.0, "وليس التكليمُ المضافُ إلى الله عز وجل كالتكليم المضاف إلى المخلوق،"], [1902.9, "وإن اتّفقا في الاسم."], [1905.0, "وهكذا في نصوصٍ كثيرة نجد أنّ الله عز وجل يصف نفسه بصفاتٍ يصف بها عباده،"], [1913.0, "ولكن ليس الموصوفُ كالموصوف؛"], [1915.8, "لأنّ الله يقول: <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>،"], [1921.0, "ويقول: <span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>."], [1924.0, "فهذا بالنسبة لدليل النقل."]], "tr": [[1897.0, "İsim bakımından örtüşseler de Allah Azze ve Celle'ye izafe edilen teklîm, mahlûka izafe edilen teklîm gibi değildir."], [1905.0, "Böylece birçok nasta Allah Azze ve Celle'nin kendisini, kullarını da vasıflandırdığı sıfatlarla vasıflandırdığını görürüz;"], [1912.5, "fakat vasıflanan, vasıflanan gibi değildir."], [1915.8, "Çünkü Allah <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11] buyuruyor ve <span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4] buyuruyor."], [1924.0, "Nakil delili bakımından durum budur."]]}]}, {"ts": "32:07", "title": "5. Külliye (devam): Akıl delili ve his delili", "paras": [{"reader": false, "ar": [[1927.0, "وأمّا دليلُ العقل: فلأنّ المتقرِّر في العقل أنّ الصفة تختلف باختلاف من أُضيفت إليه ـ كما قلتُ في الكلّيّة التي قبلها ـ؛"], [1939.0, "فإذا أُضيفت الصفةُ إلى الله عز وجل فتكون لائقةً بجلاله وكماله وعظمته،"], [1946.0, "وإذا أُضيفت الصفةُ إلى المخلوق فإنها تكون مناسبةً لحاله وضعفه وعجزه."], [1954.0, "وهذا مقرَّرٌ عقليّ، وقاطعٌ عقليّ،"], [1957.5, "لا يمكن أن يُنكره أحدٌ إلا من طمس الله عز وجل على عقله."]], "tr": [[1927.0, "Akıl delili şudur: Akılda yerleşik olan, sıfatın kendisine izafe edildiği zâtın farklılığıyla farklılaştığıdır —önceki külliyede söylediğim gibi."], [1939.0, "Sıfat Allah Azze ve Celle'ye izafe edildiğinde O'nun celâline, kemaline ve azametine layık olur;"], [1946.0, "mahlûka izafe edildiğinde ise onun hâline, zayıflığına ve acizliğine uygun olur."], [1954.0, "Bu aklî olarak yerleşik bir husus ve kesin bir aklî delildir;"], [1958.9, "Allah Azze ve Celle'nin aklını silip kararttığı kimse dışında hiç kimse onu inkâr edemez."]]}, {"reader": false, "ar": [[1966.0, "وأمّا الحسّ: فلأننا نرى في المحسوسات أشياءَ قد اتّفقت في أسمائها،"], [1974.0, "ولكنها تختلف في صفاتها،"], [1976.0, "مع أنها يجمعها وصفُ المخلوق."], [1980.0, "فإذا كان الاتّفاق في الأسماء لا يستلزم الاتّفاقَ في الصفات مع الاجتماع في الوصف العامّ ـ وهو الخلق ـ،"], [1989.0, "فكيف يكون ذلك لازمًا فيما بين الخالق الكامل من كلّ وجه،"], [1994.8, "والمخلوق الضعيف العاجز من كلّ وجه؟!"], [1998.0, "<span class=\"ayah\">﴿سُبْحَانَكَ هَٰذَا بُهْتَانٌ عَظِيمٌ﴾<\/span> <span class=\"ref\">[النور: ١٦]<\/span>."]], "tr": [[1966.0, "His delili şudur: Duyularla algılanan şeylerde isimlerinde ortak olduğu hâlde sıfatlarında farklı olan şeyler görürüz;"], [1975.0, "üstelik onları mahlûk olma vasfı bir araya getirir."], [1980.0, "Genel vasıfta —yani yaratılmışlıkta— birleşmelerine rağmen isimlerde ortaklık sıfatlarda ortaklığı gerektirmiyorsa, her yönden kâmil olan Yaratıcı ile her yönden zayıf ve âciz olan mahlûk arasında bu nasıl gerekli olur?!"], [1995.4, "<span class=\"ayah\">﴿Seni tenzih ederiz; bu büyük bir iftiradır﴾<\/span> [Nûr 16]."]]}, {"reader": false, "ar": [[2002.0, "فنجد أنّ الشمس تُوصَف بالإضاءة،"], [2005.1, "والشمعةَ تُوصَف بالإضاءة؛ فاتّفقت الشمسُ والشمعةُ أنّ كلًّا منهما مضيء،"], [2010.0, "ولكنّ الإضاءة ليست كالإضاءة؛"], [2013.1, "لاختلاف الإضافتين. وكذلك نجد أنّ للفيل وجهًا،"], [2018.7, "وللبعوض وجهًا؛ فاتّفق الفيلُ والبعوضُ أنّ لكلٍّ منهما وجهًا،"], [2026.0, "ولكن ليس الوجهُ المضافُ إلى الفيل كالوجه المضاف إلى البعوض."], [2029.0, "ونجد أنّ للصقر جناحًا،"], [2032.1, "وللذباب جناحًا، ولكن ليس الجناحُ المضافُ إلى الصقر كالجناح المضاف إلى الذباب."], [2041.0, "فإذا كان الاتّفاق في الأسماء لا يستلزم الاتّفاقَ في المسمّيات والصفات فيما بين المخلوقات،"], [2048.4, "فلَأَن لا يكون لازمًا فيما بين الخالق والمخلوق من باب أولى."]], "tr": [[2002.0, "Güneşin aydınlatmakla vasıflandığını, mumun da aydınlatmakla vasıflandığını görürüz."], [2007.0, "Güneş ve mum, her birinin aydınlatıcı olmasında ortaktır;"], [2009.1, "fakat iki izafetin farklılığı sebebiyle aydınlatma, aydınlatma gibi değildir."], [2013.1, "Aynı şekilde filin bir yüzü, sivrisineğin de bir yüzü olduğunu görürüz;"], [2022.0, "fil ve sivrisinek her birinin bir yüzü olmasında ortaktır, fakat file izafe edilen yüz sivrisineğe izafe edilen yüz gibi değildir."], [2029.0, "Şahinin bir kanadı, sineğin de bir kanadı olduğunu görürüz;"], [2041.0, "fakat şahine izafe edilen kanat sineğe izafe edilen kanat gibi değildir."], [2045.9, "Mahlûklar arasında isimlerde ortaklık müsemmalarda ve sıfatlarda ortaklığı gerektirmiyorsa, Yaratıcı ile mahlûk arasında bunun gerekli olmaması evleviyetle sabittir."]]}]}, {"ts": "34:14", "title": "5. Külliye (devam): İbn Teymiyye'nin iki misali — (1) Cennet nimetleri ile dünya nimetleri", "paras": [{"reader": false, "ar": [[2054.0, "وابنُ تيمية رحمه الله تعالى قد ضرب على هذا الأصل مثالين عظيمين:"], [2062.0, "المثالُ الأوّل: نعيمُ الجنّة مع نعيم الدنيا؛"], [2068.0, "فإنّ الله عز وجل قد أخبرنا أنّ الجنّة فيها من أنواع المطاعم والملابس وغيرها من النعيم ما هو متّفقٌ في الاسم مع نعيم دنيانا."]], "tr": [[2054.0, "İbn Teymiyye —Allah ona rahmet etsin— bu asıl hakkında iki büyük misal vermiştir."], [2062.0, "Birinci misal: Cennet nimetleri ile dünya nimetleri."], [2068.0, "Allah Azze ve Celle bize, cennette yiyecek, giyecek ve diğer nimet çeşitlerinden, isim bakımından dünyamızın nimetleriyle örtüşen şeyler bulunduğunu haber vermiştir."]]}, {"reader": false, "ar": [[2083.0, "فأخبرنا أنّ في الجنّة لبنًا،"], [2086.5, "وفي الدنيا لبن، وليس اللبنُ كاللبن."], [2093.0, "وأخبرنا أنّ في الجنّة عسلًا،"], [2096.2, "وفي الدنيا عسل، وليس العسلُ كالعسل."], [2100.0, "وأخبرنا أنّ في الجنّة خمرًا،"], [2103.2, "وماءً، ولحمًا، وحريرًا، وذهبًا،"], [2105.8, "وفضّةً، ونساءً، وفاكهةً، وحُورًا،"], [2108.4, "وقصورًا، وكلُّ ذلك ممّا نجد أسماءه في الدنيا،"], [2117.0, "ولكن ليس النعيمُ المضافُ إلى الجنّة كالنعيم المضاف إلى الدنيا."]], "tr": [[2083.0, "Bize cennette süt olduğunu haber verdi;"], [2085.8, "dünyada da süt vardır, fakat süt, süt gibi değildir."], [2093.0, "Bize cennette bal olduğunu haber verdi;"], [2095.6, "dünyada da bal vardır, fakat bal, bal gibi değildir."], [2100.0, "Bize cennette şarap, su, et, ipek, altın, gümüş, kadınlar, meyveler, hûriler ve köşkler olduğunu haber verdi."], [2113.6, "Bunların hepsi isimlerini dünyada bulduğumuz şeylerdendir;"], [2116.4, "fakat cennete izafe edilen nimet, dünyaya izafe edilen nimet gibi değildir."]]}, {"reader": false, "ar": [[2122.0, "بدليل قوله عز وجل:"], [2124.0, "<span class=\"ayah\">﴿فَلَا تَعْلَمُ نَفْسٌ مَّا أُخْفِيَ لَهُم مِّن قُرَّةِ أَعْيُنٍ جَزَاءً بِمَا كَانُوا يَعْمَلُونَ﴾<\/span> <span class=\"ref\">[السجدة: ١٧]<\/span>،"], [2132.0, "[و]في قول النبيّ صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل أنه قال:"], [2139.2, "«أعددتُ لعبادي الصالحين ما لا عينٌ رأت، ولا أذنٌ سمعت، ولا خطر على قلب بشر» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [2148.0, "مع أنّ هذه الأسماء نجد أنها من النعيم في الدنيا،"], [2154.5, "وقد رأتها أعينُنا، وسمعتها آذانُنا، واستوعبتها قلوبُنا."]], "tr": [[2122.0, "Bunun delili O Azze ve Celle'nin şu sözüdür:"], [2124.0, "<span class=\"ayah\">﴿Yaptıklarına karşılık olarak onlar için saklanan göz aydınlığını hiçbir nefis bilmez﴾<\/span> [Secde 17];"], [2132.0, "ve Peygamber sallallâhu aleyhi ve sellem'in Rabbi Azze ve Celle'den rivayet ettiği şu sözüdür:"], [2139.2, "\"Sâlih kullarım için hiçbir gözün görmediği, hiçbir kulağın işitmediği ve hiçbir beşerin kalbinden geçmeyen şeyler hazırladım.\" Hâlbuki bu isimlerin dünyadaki nimetlerden olduğunu görürüz;"], [2153.2, "gözlerimiz onları görmüş, kulaklarımız onları işitmiş, kalplerimiz onları kavramıştır."]]}, {"reader": false, "ar": [[2159.0, "فلبنُ الجنّة لم يخطر لك على بال ـ لا يخطر لك نعيمُه،"], [2164.5, "لا يخطر لك على بال ـ،"], [2167.0, "وكيفيّتُه لم تطرأ لك على تفكير،"], [2170.0, "ولم تُبصره لك عين،"], [2172.0, "ولم تسمع به أذن."], [2174.0, "فهل الاتّفاق في الأسماء فيما بين نعيم الجنّة ونعيم الدنيا يلزم منه الاتّفاقُ في المسمّيات والكيفيّات؟"], [2184.0, "الجواب: لا. فإذا كان ذلك فيما بين المخلوقات نفسها،"], [2190.0, "أفيكون ذلك لازمًا فيما بين الخالق الكامل من كلّ وجه،"], [2194.0, "والمخلوق الضعيف العاجز من كلّ وجه؟!"], [2196.0, "الجواب: <span class=\"ayah\">﴿سُبْحَانَكَ هَٰذَا بُهْتَانٌ عَظِيمٌ﴾<\/span> <span class=\"ref\">[النور: ١٦]<\/span>."]], "tr": [[2159.0, "Cennetin sütü senin aklına gelmemiştir —onun nimeti aklına gelmez, hatırına gelmez—;"], [2167.0, "keyfiyeti düşüncene gelmemiş, gözün onu görmemiş, kulağın onu işitmemiştir."], [2174.0, "Cennet nimetleri ile dünya nimetleri arasındaki isim ortaklığından müsemmalarda ve keyfiyetlerde ortaklık gerekir mi?"], [2184.0, "Cevap: Hayır. Mahlûkların kendi aralarında durum böyleyse, her yönden kâmil olan Yaratıcı ile her yönden zayıf ve âciz olan mahlûk arasında bu gerekli olur mu?!"], [2196.0, "Cevap: <span class=\"ayah\">﴿Seni tenzih ederiz; bu büyük bir iftiradır﴾<\/span> [Nûr 16]."]]}, {"reader": false, "ar": [[2202.0, "ولذلك يُروى عن ابن عبّاس رضي الله عنهما أنه قال:"], [2207.0, "«ليس في الدنيا شيءٌ ممّا في الجنّة إلا الأسماء»، إلا الأسماء."]], "tr": [[2202.0, "Bu sebeple İbn Abbâs'tan —Allah ikisinden de razı olsun— şöyle dediği rivayet edilir:"], [2207.7, "\"Cennette olan şeylerden dünyada isimlerden başka bir şey yoktur\" —isimlerden başka."]]}]}, {"ts": "36:55", "title": "5. Külliye (devam): İkinci misal — iki yanın arasındaki ruh", "paras": [{"reader": false, "ar": [[2215.0, "المثالُ الثاني: الروحُ التي بين جنبيك يا ابنَ آدم <span class=\"note\">(يكررها)<\/span>،"], [2221.0, "فإنها قد وُصفت في الأدلّة بصفاتٍ ثبوتيّةٍ وسلبيّة."], [2232.0, "فقد أخبرت النصوصُ أنها تَعرُج،"], [2235.0, "وأنها تصعد من سماءٍ إلى سماء،"], [2240.0, "وأنها تُلَفّ، وأنها تُكفَّن،"], [2243.0, "وأنها تُقبَض من البدن،"], [2246.0, "وأنها تُسَلّ منه كما تُسَلّ الشعرةُ من العجين،"], [2251.0, "كما صحّت بذلك الآثارُ ـ النصوصُ ـ عن النبيّ صلى الله عليه وسلم."]], "tr": [[2215.0, "İkinci misal: Ey Âdemoğlu, iki yanının arasındaki ruh (tekrar ediyor)."], [2220.8, "O, delillerde sübûtî (isbat edici) ve selbî (nefyedici) sıfatlarla vasıflandırılmıştır."], [2232.0, "Naslar onun yükseldiğini (urûc), gökten göğe çıktığını, sarıldığını, kefenlendiğini, bedenden kabzedildiğini (alındığını) ve hamurdan kıl çekilir gibi ondan çekilip çıkarıldığını haber vermiştir;"], [2248.5, "nitekim Peygamber sallallâhu aleyhi ve sellem'den gelen eserler —naslar— bununla sahih olarak gelmiştir."]]}, {"reader": false, "ar": [[2256.0, "ولكن أتحدّاك أن تُبيّن لنا شيئًا من كيفيّات هذا القبض،"], [2262.0, "وكيفيّات هذا السلّ، وكيفيّات هذا التكفين،"], [2266.3, "وكيفيّات هذا العروج <span class=\"q\">؟ 37:42<\/span>، مع أنها بين جنبيك،"], [2273.8, "ووُصفت بصفاتٍ متّفقةٍ مع ما تراه عينُك،"], [2279.0, "لكنك لا تعلم كيفيّة شيءٍ من ذلك."], [2282.0, "فإذا كنتَ يا ابنَ آدم لا تعرف كيفيّة شيءٍ بين جنبيك،"], [2287.0, "أفيطمع عقلُك أن يتعرّف على كيفيّة صفات الله عز وجل؟!"], [2294.0, "أو أن تقول: إنّ صفات الله عز وجل كصفاتي؟!"], [2298.0, "أو أن يتجرّأ لسانُك على أن تتكلّم في شيءٍ من صفات الباري عز وجل؟!"], [2305.0, "<span class=\"ayah\">﴿سُبْحَانَكَ هَٰذَا بُهْتَانٌ عَظِيمٌ﴾<\/span> <span class=\"ref\">[النور: ١٦]<\/span>."]], "tr": [[2256.0, "Fakat sana meydan okuyorum: Bu kabzın keyfiyetlerinden, bu çekip çıkarmanın keyfiyetlerinden, bu kefenlemenin keyfiyetlerinden ve bu yükselişin <span class=\"q\">؟<\/span> keyfiyetlerinden bir şeyi bize açıkla!"], [2271.0, "Hâlbuki o, iki yanının arasındadır ve gözünün gördüğü şeylerle (isim olarak) örtüşen sıfatlarla vasıflandırılmıştır;"], [2279.4, "fakat sen bunlardan hiçbirinin keyfiyetini bilmiyorsun."], [2282.0, "Ey Âdemoğlu, iki yanının arasındaki bir şeyin keyfiyetini bilmiyorsan, aklın Allah Azze ve Celle'nin sıfatlarının keyfiyetini bilmeye mi tamah eder?!"], [2294.0, "Ya da \"Allah Azze ve Celle'nin sıfatları benim sıfatlarım gibidir\" mi dersin?!"], [2298.0, "Ya da dilin, Bârî Azze ve Celle'nin sıfatlarından bir şey hakkında konuşmaya mı cüret eder?!"], [2305.0, "<span class=\"ayah\">﴿Seni tenzih ederiz; bu büyük bir iftiradır﴾<\/span> [Nûr 16]."]]}, {"reader": false, "ar": [[2308.0, "ولكنّ كلّ ذلك يدخل تحت قول الله عز وجل:"], [2311.0, "<span class=\"ayah\">﴿وَمَا قَدَرُوا اللَّهَ حَقَّ قَدْرِهِ﴾<\/span> <span class=\"ref\">[الزمر: ٦٧]<\/span>."], [2315.0, "فإذا كنتَ لا تعلم كيفيّة شيءٍ بين جنبيك،"], [2320.0, "لا يُفارقك أبدًا إلا حالَ قبض روحك من جسدك،"], [2327.0, "فكيف تطمع يا ابنَ آدم أن تتعرّف على شيءٍ من صفات ـ شيءٍ من كيفيّات صفات ـ ربّك عز وجل؟!"], [2337.0, "وكلُّ ذلك يدلّ على أهمّيّة هذا الأصل الكبير عند أهل السنة والجماعة،"], [2346.0, "والمعنون عنه بهذه الكلّيّة:"], [2348.2, "من أنّ الاتّفاق في الأسماء لا يستلزم الاتّفاقَ في الصفات. والله أعلم."]], "tr": [[2308.0, "Fakat bunların hepsi Allah Azze ve Celle'nin şu sözünün altına girer:"], [2311.0, "<span class=\"ayah\">﴿Onlar Allah'ı hakkıyla takdir edemediler﴾<\/span> [Zümer 67]."], [2316.2, "Ruhunun bedeninden kabzedildiği hâl dışında senden asla ayrılmayan, iki yanının arasındaki bir şeyin keyfiyetini bilmiyorsan, ey Âdemoğlu, Rabbin Azze ve Celle'nin sıfatlarından —sıfatlarının keyfiyetlerinden— bir şeyi bilmeye nasıl tamah edersin?!"], [2337.0, "Bütün bunlar, Ehl-i Sünnet ve'l-Cemaat nezdinde bu büyük aslın —bu külliyeyle ifade edilen \"isimlerde ortaklık sıfatlarda ortaklığı gerektirmez\" aslının— önemine delâlet eder. Allah en iyisini bilir."]]}]}, {"ts": "39:15", "title": "6. Külliye: Mahlûkta bulunan, noksanlık içermeyen her kemalle vasıflanmaya Allah daha layıktır · Kıyas çeşitleri: temsil kıyası", "paras": [{"reader": false, "ar": [[2355.0, "ومن الكلّيّات أيضًا: <b>كلُّ كمالٍ في المخلوق لا نقصَ فيه فاللهُ أحقُّ أن يُوصَف به.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ كمالٍ في المخلوق لا نقصَ فيه فاللهُ أحقُّ أن يُوصَف به.<\/b>"]], "tr": [[2355.0, "Külliyelerden biri de şudur: 6."], [2356.4, "külliye: Mahlûkta bulunan ve içinde noksanlık olmayan her kemalle vasıflanmaya Allah daha layıktır.<b> (Tekrar ediyor.) <\/b>6."], [2357.0, "külliye: Mahlûkta bulunan ve içinde noksanlık olmayan her kemalle vasıflanmaya Allah daha layıktır."]]}, {"reader": false, "ar": [[2393.0, "أقول وبالله التوفيق: وهذا بإجماع أهل السنة والجماعة،"], [2397.3, "وهو الذي يُسمّيه أهلُ السنة بالقياس الأَولويّ؛"], [2401.0, "لأنّ أنواع القياس ثلاثة:"], [2403.6, "قياسُ تمثيل، وقد أجمع أهلُ السنة والجماعة على حرمة استعماله في حقّ الله عز وجل؛"], [2415.0, "لأنّ الله <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>."], [2418.0, "ونعني بقياس التمثيل: ذلك القياسَ الأصوليّ الذي يُستعمَل في الفقهيّات،"], [2426.0, "وهي قولهم: إلحاقُ فرعٍ بأصلٍ في حكمٍ لعلّةٍ جامعة."]], "tr": [[2393.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır;"], [2396.7, "Ehl-i Sünnet'in kıyâs-ı evlâ (evleviyet kıyası) dediği şey budur."], [2401.0, "Çünkü kıyasın çeşitleri üçtür: Temsil kıyası;"], [2403.6, "Ehl-i Sünnet ve'l-Cemaat onun Allah Azze ve Celle hakkında kullanılmasının haram olduğu üzerinde icmâ etmiştir;"], [2415.0, "çünkü Allah'ın <span class=\"ayah\">﴿benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11]."], [2420.1, "Temsil kıyasından kastımız, fıkhî konularda kullanılan usûlî kıyastır;"], [2423.6, "onu şöyle tanımlarlar: Bir fer'i, birleştirici bir illet sebebiyle bir hükümde bir asla katmak."]]}, {"reader": false, "ar": [[2436.0, "والله عز وجل لا يمكن أن يُماثله شيءٌ في علّةٍ حتى نُلحقه به؛"], [2443.0, "فقياسُ التمثيل لا يجوز استعماله في حقّ الله عز وجل بالإجماع؛"], [2450.0, "لأنه مخالفٌ للنصوص الدالّة على أنّ الله <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>،"], [2457.0, "<span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>."]], "tr": [[2436.0, "Allah Azze ve Celle'ye bir illette hiçbir şeyin benzemesi mümkün değildir ki O'nu ona katalım."], [2443.0, "Temsil kıyasının Allah Azze ve Celle hakkında kullanılması icmâ ile caiz değildir;"], [2448.7, "çünkü Allah'ın <span class=\"ayah\">﴿benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11] ve <span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4] diye delâlet eden naslara aykırıdır."]]}]}, {"ts": "40:59", "title": "6. Külliye (devam): Şümûl kıyası ve kıyâs-ı evlâ", "paras": [{"reader": false, "ar": [[2459.0, "القياسُ الثاني: قياسُ الشمول،"], [2465.0, "وهو القياس المنطقيّ المكوَّن من مقدّمتين ونتيجة،"], [2472.0, "ومن طبيعة هذا القياس استواءُ مقدّماته في معنًى يشملها جميعًا؛"], [2483.0, "كقولي: أنا حيّ، وكلُّ حيٍّ فمتحرّك،"], [2487.3, "إذن الحيُّ متحرّك. ـ أنتم معي ولّا لا؟"], [2493.0, "ـ فهذا يُسمّيه العلماءُ بقياس الشمول،"], [2496.6, "وبناؤه على استواء المقدّمتين."], [2504.0, "والله عز وجل لا يُساويه شيءٌ،"], [2507.4, "لا في ذاته، ولا في صفاته،"], [2510.9, "ولا في أفعاله، حتى نجعله في موضع أحد المقدّمتين؛"], [2516.0, "فقياسُ الشمول لا يجوز استعماله في حقّ الله عز وجل بالإجماع."]], "tr": [[2459.0, "İkinci kıyas: Şümûl kıyası. Bu, iki öncül ve bir sonuçtan oluşan mantıkî kıyastır."], [2472.0, "Bu kıyasın tabiatı gereği öncülleri, hepsini kapsayan bir manada eşittir."], [2483.0, "\"Ben canlıyım; her canlı hareket edendir;"], [2485.8, "o hâlde canlı hareket edendir\" sözüm gibi."], [2489.6, "—Benimle misiniz, değil misiniz?— İşte âlimler buna şümûl kıyası der;"], [2495.8, "bina edildiği şey iki öncülün eşitliğidir."], [2504.0, "Allah Azze ve Celle'ye ise ne zâtında, ne sıfatlarında, ne de fiillerinde hiçbir şey eşit değildir ki O'nu iki öncülden birinin yerine koyalım."], [2516.0, "Şümûl kıyasının Allah Azze ve Celle hakkında kullanılması icmâ ile cai
