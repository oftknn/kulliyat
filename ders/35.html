<script>
const D={"no": 35, "vid": "DtWM8ed1mHg", "title_ar": "الدرس (٣٥) من شرح كليات العقيدة — من كليات التكفير: العذر بالجهل", "title_tr": "Şerhu Külliyyâti'l-Akîde — 35. Ders: Tekfir Külliyeleri (Cehaletle Mazeret, Tevâtür Yoluyla Bilinen Zahir Küfürde Mazeretin Olmaması)", "sections": [{"ts": "00:00", "title": "1. Külliye: Giderilmesi imkânsız bir cehaletle küfrü gerektiren bir şeye düşen kâfir olmaz", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.9, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.8, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.2, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [10.0, "أمّا بعد: فقبل أن نبدأ في الكلّيّات أحبُّ أن أقول بأنّ أكثرَ ما ستسمعونه إنما هي النُّقولُ عن أهل العلم رحمهم الله تعالى."], [20.0, "عندنا في هذا الدرس جُمَلٌ من الكلّيّات."], [24.0, "الكلّيّة الأولى: <b>كلُّ من وقع في مكفِّرٍ جاهلًا بجهلٍ معجوزٍ عن رفعه فلا يَكفُرُ به.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً أخرى:"], [58.0, "<b>كلُّ من وقع في مكفِّرٍ جاهلًا بجهلٍ معجوزٍ عن رفعه فلا يَكفُرُ به.<\/b>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [0.0, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [7.2, "Bundan sonra: Külliyelere başlamadan önce şunu söylemek isterim:"], [10.0, "Dinleyeceklerinizin çoğu, ehl-i ilimden —Allah onlara rahmet etsin— yapılan nakillerdir."], [10.0, "Bu derste birtakım külliyelerimiz var."], [10.0, "<b>1. külliye: Giderilmesi kendisi için imkânsız olan bir cehaletle, cahil olarak küfrü gerektiren (mükeffir) bir şeye düşen herkes, onunla kâfir olmaz.<\/b> (Tekrar ediyor.) Bir kez daha tekrar ediyorum:"], [24.0, "<b>Giderilmesi kendisi için imkânsız olan bir cehaletle, cahil olarak küfrü gerektiren bir şeye düşen herkes, onunla kâfir olmaz.<\/b>"]]}, {"reader": false, "ar": [[63.0, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أنّ من وقع في الكفر جاهلًا لا يخلو من أحد شخصين:"], [72.0, "الأوّل: من كان كافرًا أصالةً،"], [76.0, "فهو يقع في هذه الكفريّات وهو جاهلٌ بأنها كفر،"], [81.0, "ولكنه أصلًا هو كافرٌ باعتبار الأصالة؛"], [84.0, "كالنصرانيّ الذي يقع في جُمَلٍ من المكفِّرات جاهلًا،"], [89.0, "أو اليهوديّ الذي يقع في جُمَلٍ من المكفِّرات جاهلًا،"], [92.0, "أو المجوسيّ الذي يقع في جُمَلٍ من المكفِّرات جاهلًا؛"], [97.0, "فهذا يُحكم عليه بأنه كافرٌ كفرَ أصالة،"], [100.0, "ولا يدخل معنا في هذه الكلّيّة بإجماع أهل السنة والجماعة."]], "tr": [[63.0, "Tevfik Allah'tandır, derim ki: Bil —Allah sana rahmet etsin— cahil olarak küfre düşen kimse iki kişiden biri olmaktan hâlî değildir."], [72.0, "Birincisi: Aslen kâfir olan kimse."], [76.0, "O bu küfürlere, onların küfür olduğunu bilmeden düşer;"], [81.0, "fakat zaten asıl itibarıyla kâfirdir."], [84.0, "Mesela cahil olarak birtakım mükeffir şeylere düşen Hristiyan, ya da cahil olarak birtakım mükeffir şeylere düşen Yahudi, ya da cahil olarak birtakım mükeffir şeylere düşen Mecûsî gibi."], [92.0, "Bunun hakkında asli küfürle kâfir olduğuna hükmedilir;"], [100.0, "Ehl-i Sünnet ve'l-Cemaat'in icmâıyla o, bizim bu külliyemize girmez."]]}, {"reader": false, "ar": [[106.0, "فالكلام في هذه الكلّيّة ليس عن هذا الرجل الذي هو كافرٌ كفرَ أصالة،"], [112.0, "وإنما الكلام عن الشخص الثاني:"], [115.0, "وهو من كان مسلمًا ومحكومًا بإسلامه،"], [118.0, "إلا أنه وقع في شيءٍ ممّا يوجب خروجَه عن الإسلام؛"], [123.0, "فحينئذٍ ننظر في حاله:"], [125.7, "إذا كان قد وقع في هذا المكفِّر بجهلٍ معجوزٍ عن رفعه،"], [133.0, "فإنّ أهل السنة يقولون بأنه لا يُحكم عليه بمقتضاه."]], "tr": [[106.0, "Bu külliyedeki söz, asli küfürle kâfir olan bu adam hakkında değildir."], [106.0, "Söz ancak ikinci kişi hakkındadır:"], [112.0, "O da Müslüman olan ve Müslümanlığına hükmedilen, fakat İslam'dan çıkmasını gerektiren bir şeye düşen kimsedir."], [118.0, "Bu durumda onun hâline bakarız:"], [123.0, "Eğer bu mükeffir şeye giderilmesi imkânsız bir cehaletle düşmüşse, Ehl-i Sünnet onun hakkında bunun gereğiyle hükmedilmeyeceğini söyler."]]}, {"reader": false, "ar": [[139.0, "وذلك لأنّ المتقرّر في القواعد أنّ الجهل رافعٌ للتكليف؛"], [144.0, "فمن وقع في تفويت مأمورٍ جاهلًا بجهلٍ يُعذر فيه،"], [151.0, "أو وقع في محظورٍ جاهلًا بجهلٍ يُعذر فيه،"], [155.0, "فإنّ الشريعة لا تُؤاخذه بشيءٍ من العقوبات أبدًا."], [163.0, "وقد دلّت على ذلك الأدلّةُ الكثيرة،"], [165.7, "ولله الحمدُ والمنّة. فمن الأدلّة قولُ الله عز وجل:"], [170.0, "<span class=\"ayah\">﴿وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولًا﴾<\/span> <span class=\"ref\">[الإسراء: ١٥]<\/span>."]], "tr": [[139.0, "Bu şundandır: Kaidelerde yerleşik olan şudur:"], [139.0, "Cehalet teklifi kaldırır. Kim mazur sayıldığı bir cehaletle, cahil olarak emredilen bir şeyi kaçırmaya düşerse, ya da mazur sayıldığı bir cehaletle, cahil olarak yasak bir şeye düşerse, şeriat onu hiçbir cezayla asla sorumlu tutmaz."], [163.0, "Buna pek çok delil delâlet etmiştir;"], [165.7, "hamd ve minnet Allah'adır. Delillerden biri Allah Azze ve Celle'nin şu sözüdür:"], [170.0, "<span class=\"ayah\">﴿Biz bir resul göndermedikçe azap edici değiliz﴾<\/span> [İsrâ 15]."]]}, {"reader": false, "ar": [[173.0, "فأفادت هذه الآية أنّ الله عز وجل قد أوقف عذابَه في الآخرة على بعثة الرسول."], [180.0, "وليس المقصود ببعثة الرسول مجرّدَ بعثته،"], [186.0, "وإنما لأنّ ببعثته ينتشر العلم،"], [190.0, "ويعرف الناسُ أحكامَ الله عز وجل."], [193.0, "وأفادت هذه الآية بمفهوم مخالفتها أنّ الله عز وجل لا يعذّب أحدًا لم تقم عليه الحجّةُ الرساليّة التي يُعذَّب من خالفها."]], "tr": [[173.0, "Bu ayet, Allah Azze ve Celle'nin ahiretteki azabını resulün gönderilmesine bağladığını ifade etti."], [173.0, "Resulün gönderilmesinden kastedilen, sırf gönderilmesi değildir;"], [180.0, "bilakis onun gönderilmesiyle ilim yayılır ve insanlar Allah Azze ve Celle'nin hükümlerini bilirler (bu yüzden ona bağlanmıştır)."], [193.0, "Bu ayet mefhûm-ı muhalefetiyle de şunu ifade etti:"], [193.0, "Allah Azze ve Celle, muhalefet edenin azap gördüğü risâlet hücceti kendisine ikame edilmemiş hiç kimseye azap etmez."]]}, {"reader": false, "ar": [[207.0, "ومن الأدلّة أيضًا قولُ الله عز وجل:"], [211.5, "<span class=\"ayah\">﴿وَلَوْلَا أَن تُصِيبَهُم مُّصِيبَةٌ بِمَا قَدَّمَتْ أَيْدِيهِمْ فَيَقُولُوا رَبَّنَا لَوْلَا أَرْسَلْتَ إِلَيْنَا رَسُولًا فَنَتَّبِعَ آيَاتِكَ وَنَكُونَ مِنَ الْمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[القصص: ٤٧]<\/span>."], [225.0, "فأفادت هذه الآية أنّ ممّا يتعلّق به الكفّار يوم القيامة أنهم يحتجّون بأنّ الله عز وجل لم يرسل لهم رسولًا،"], [236.0, "ولكنّ الحقيقة أنّ الله أرسل لهم رسولًا،"], [239.5, "وهم كاذبون في هذه الدعوى."]], "tr": [[207.0, "Delillerden biri de Allah Azze ve Celle'nin şu sözüdür:"], [211.5, "<span class=\"ayah\">﴿Elleriyle işledikleri yüzünden başlarına bir musibet geldiğinde, \"Rabbimiz! Bize bir resul gönderseydin de âyetlerine uysaydık ve müminlerden olsaydık\" demeleri olmasaydı﴾<\/span> [Kasas 47]."], [211.5, "Bu ayet şunu ifade etti:"], [211.5, "Kâfirlerin kıyamet günü tutundukları şeylerden biri, Allah Azze ve Celle'nin kendilerine bir resul göndermediğini delil getirmeleridir."], [225.0, "Fakat hakikat şudur ki Allah onlara bir resul göndermiştir; onlar bu iddialarında yalancıdırlar."]]}, {"reader": false, "ar": [[242.0, "ولكنّ الله عز وجل لم يذكرها على لسانهم إلا لأنها من الحجج النافعة فيما لو وافقت واقعًا؛"], [251.0, "فإنها لو وافقت واقعًا،"], [253.1, "فإنّ الله عز وجل لا يعذّب من لم يُرسل له رسولًا؛"], [259.0, "لأنّ آيات الله عز وجل توقيفيّةٌ على بعثة الرسل."], [262.0, "فلو كانت حجّتهم قد وافقت واقعًا لما كانوا مستحقّين،"], [267.0, "لما كانوا مستحقّين للعذاب."]], "tr": [[242.0, "Fakat Allah Azze ve Celle bunu onların dilinden ancak, gerçeğe uyması hâlinde fayda veren hüccetlerden olduğu için zikretmiştir."], [251.0, "Çünkü eğer gerçeğe uysaydı, Allah Azze ve Celle kendisine resul gönderilmemiş kimseye azap etmez."], [253.1, "Zira Allah Azze ve Celle'nin âyetleri, resullerin gönderilmesine bağlıdır (tevkîfîdir)."], [262.0, "Eğer onların hücceti gerçeğe uysaydı, (azaba) müstahak olmazlardı, azaba müstahak olmazlardı."]]}, {"reader": false, "ar": [[270.0, "ومن الأدلّة أيضًا قولُ الله عز وجل:"], [273.5, "<span class=\"ayah\">﴿رُّسُلًا مُّبَشِّرِينَ وَمُنذِرِينَ لِئَلَّا يَكُونَ لِلنَّاسِ عَلَى اللَّهِ حُجَّةٌ بَعْدَ الرُّسُلِ﴾<\/span> <span class=\"ref\">[النساء: ١٦٥]<\/span>."], [281.0, "فهذا دليلٌ على أنّ حجّة الله عز وجل إنما تقوم بإرسال الرسل وإنزال الكتب،"], [288.0, "والمقصود بإرسال الرسل وإنزال الكتب:"], [291.0, "أي انتشار العلم ومعرفة الناس بأحكام الله عز وجل."], [295.0, "فهذه الآيات تنصّ على أنّ الله لا يعذّب الناس إلا بعد أن يبيّن لهم،"], [303.0, "وبعد أن يعلّمهم طريقَ الحقّ من طريق الضلال."]], "tr": [[270.0, "Delillerden biri de Allah Azze ve Celle'nin şu sözüdür:"], [273.5, "<span class=\"ayah\">﴿Resullerden sonra insanların Allah'a karşı bir hücceti olmasın diye müjdeleyici ve uyarıcı resuller (gönderdik)﴾<\/span> [Nisâ 165]."], [273.5, "Bu, Allah Azze ve Celle'nin hüccetinin ancak resullerin gönderilmesi ve kitapların indirilmesiyle ikame olduğuna delildir."], [281.0, "Resullerin gönderilmesi ve kitapların indirilmesinden kastedilen de ilmin yayılması ve insanların Allah Azze ve Celle'nin hükümlerini bilmesidir."], [291.0, "Bu ayetler, Allah'ın insanlara ancak (hakkı) onlara açıkladıktan ve hak yolunu dalâlet yolundan (ayırarak) onlara öğrettikten sonra azap edeceğini açıkça bildirir."]]}, {"reader": false, "ar": [[307.0, "وهي دليلٌ على ما قرّره أهلُ السنة والجماعة:"], [311.0, "أنّ المؤاخذة مقرونةٌ بالعلم،"], [313.0, "أنّ المؤاخذة مقرونةٌ بالعلم."], [316.0, "فإذا وقع الإنسان في شيءٍ موجبٍ للعقوبة جاهلًا بجهلٍ معذورٍ فيه،"], [322.0, "فإنّ الله عز وجل لا يؤاخذه،"], [324.0, "فإنّ الله عز وجل لا يؤاخذه."]], "tr": [[307.0, "Bu ayetler, Ehl-i Sünnet ve'l-Cemaat'in takrir ettiği şeye delildir:"], [311.0, "Sorumlu tutulma ilme bağlıdır, sorumlu tutulma ilme bağlıdır."], [313.0, "İnsan, mazur olduğu bir cehaletle, cahil olarak cezayı gerektiren bir şeye düşerse, Allah Azze ve Celle onu sorumlu tutmaz, Allah Azze ve Celle onu sorumlu tutmaz."]]}]}, {"ts": "05:27", "title": "Deliller (devam): Havârîler, Nisâ 115, hata ve unutma", "paras": [{"reader": false, "ar": [[327.0, "ومنها أيضًا قولُ الله عز وجل ـ ولعلّكم تتأمّلونها معي ـ:"], [333.0, "<span class=\"ayah\">﴿إِذْ قَالَ الْحَوَارِيُّونَ يَا عِيسَى ابْنَ مَرْيَمَ هَلْ يَسْتَطِيعُ رَبُّكَ أَن يُنَزِّلَ عَلَيْنَا مَائِدَةً مِّنَ السَّمَاءِ ۖ قَالَ اتَّقُوا اللَّهَ إِن كُنتُم مُّؤْمِنِينَ﴾<\/span> <span class=\"ref\">[المائدة: ١١٢]<\/span> <span class=\"ayah\">﴿قَالُوا نُرِيدُ أَن نَّأْكُلَ مِنْهَا وَتَطْمَئِنَّ قُلُوبُنَا وَنَعْلَمَ أَن قَدْ صَدَقْتَنَا وَنَكُونَ عَلَيْهَا مِنَ الشَّاهِدِينَ﴾<\/span> <span class=\"ref\">[المائدة: ١١٣]<\/span>."]], "tr": [[327.0, "Delillerden biri de Allah Azze ve Celle'nin şu sözüdür —belki benimle birlikte onu düşünürsünüz—:"], [333.0, "<span class=\"ayah\">﴿Hani Havârîler, \"Ey Meryem oğlu Îsâ! Rabbin bize gökten bir sofra indirebilir mi?\" demişlerdi. (Îsâ da) \"Eğer müminlerseniz Allah'tan korkun\" demişti.﴾<\/span> [Mâide 112] <span class=\"ayah\">﴿Dediler ki: \"Ondan yemek, kalplerimizin mutmain olmasını, bize doğru söylediğini bilmek ve ona şahitlik edenlerden olmak istiyoruz.\"﴾<\/span> [Mâide 113]"]]}, {"reader": false, "ar": [[351.0, "ووجهُ الدلالة يبيّنه الإمامُ ابن حزم رحمه الله تعالى في قوله:"], [356.0, "«فهؤلاء الحواريّون الذين أثنى الله عز وجل عليهم قد قالوا بالجهل لعيسى ابن مريم عليه السلام: <span class=\"ayah\">﴿هَلْ يَسْتَطِيعُ رَبُّكَ أَن يُنَزِّلَ عَلَيْنَا مَائِدَةً مِّنَ السَّمَاءِ﴾<\/span> <span class=\"ref\">[المائدة: ١١٢]<\/span>، ولم يبطل بذلك إيمانُهم، وهذا ما لا مَخلَصَ منه، وإنما كانوا يكفرون لو قالوا ذلك بعد قيام الحجّة وتبيينها لهم». انتهى كلامه."]], "tr": [[351.0, "Delâlet vechini İmam İbn Hazm —Allah ona rahmet etsin— şu sözüyle açıklar:"], [356.0, "\"Allah Azze ve Celle'nin övdüğü bu Havârîler, cehaletle Meryem oğlu Îsâ'ya —aleyhisselâm— <span class=\"ayah\">﴿Rabbin bize gökten bir sofra indirebilir mi?﴾<\/span> [Mâide 112] dediler;"], [356.0, "bununla imanları bâtıl olmadı. Bundan kurtuluş yoktur."], [356.0, "Onlar ancak bunu hüccet ikame edilip kendilerine açıklandıktan sonra söyleselerdi kâfir olurlardı.\" Sözü bitti."]]}, {"reader": false, "ar": [[382.0, "ولا جَرَمَ أنّ من جملة المكفِّرات الشكَّ في كمال قدرة الله عز وجل؛"], [387.0, "فكونُهم يسألون نبيَّهم: هل يستطيع ربُّك أن ينزّل علينا هذه المائدة؟"], [392.0, "فهذا سؤالُ شكّ، ولكن لم يجعل عيسى عليه الصلاة والسلام سؤالَهم هذا مبطِلًا لإيمانهم؛"], [398.0, "لأنه كان يَنِمُّ عن جهل قلوبهم بحقيقة الأمر."]], "tr": [[382.0, "Şüphesiz mükeffir şeylerden biri de Allah Azze ve Celle'nin kudretinin kemalinden şüphe etmektir."], [387.0, "Onların peygamberlerine \"Rabbin bize bu sofrayı indirebilir mi?\" diye sormaları bir şüphe sorusudur."], [392.0, "Fakat Îsâ —aleyhissalâtu vesselâm— onların bu sorusunu imanlarını bâtıl kılan bir şey saymadı;"], [392.0, "çünkü bu soru, kalplerinin işin hakikatini bilmediğini gösteriyordu."]]}, {"reader": false, "ar": [[402.0, "ومن الأدلّة أيضًا قولُ الله عز وجل:"], [406.0, "<span class=\"ayah\">﴿وَمَن يُشَاقِقِ الرَّسُولَ مِن بَعْدِ مَا تَبَيَّنَ لَهُ الْهُدَىٰ وَيَتَّبِعْ غَيْرَ سَبِيلِ الْمُؤْمِنِينَ نُوَلِّهِ مَا تَوَلَّىٰ وَنُصْلِهِ جَهَنَّمَ ۖ وَسَاءَتْ مَصِيرًا﴾<\/span> <span class=\"ref\">[النساء: ١١٥]<\/span>."], [418.0, "يوضّح وجهَ الاستدلال منها الإمامُ ابن كثير رحمه الله تعالى في قوله:"], [424.0, "«قوله تعالى: <span class=\"ayah\">﴿وَمَن يُشَاقِقِ الرَّسُولَ مِن بَعْدِ مَا تَبَيَّنَ لَهُ الْهُدَىٰ﴾<\/span> <span class=\"ref\">[النساء: ١١٥]<\/span>، أي: ومن سلك غيرَ طريق الشريعة التي جاء بها الرسول صلى الله عليه وسلم، فصار في شِقٍّ والشرعُ في شِقّ، وذلك عن عمدٍ منه بعدما ظهر له الحقُّ وتبيّن له واتّضح له». انتهى كلامه."]], "tr": [[402.0, "Delillerden biri de Allah Azze ve Celle'nin şu sözüdür:"], [406.0, "<span class=\"ayah\">﴿Kim kendisine hidayet apaçık belli olduktan sonra Resûl'e muhalefet eder ve müminlerin yolundan başkasına uyarsa, onu döndüğü yönde bırakırız ve cehenneme sokarız. Orası ne kötü bir varış yeridir!﴾<\/span> [Nisâ 115]."], [406.0, "Ondan istidlal vechini İmam İbn Kesîr —Allah ona rahmet etsin— şu sözüyle açıklar:"], [418.0, "\"Allah Teâlâ'nın <span class=\"ayah\">﴿Kim kendisine hidayet apaçık belli olduktan sonra Resûl'e muhalefet ederse﴾<\/span> [Nisâ 115] sözü şu demektir:"], [424.0, "Kim Resûl ﷺ'in getirdiği şeriatin yolundan başka bir yola girer de kendisi bir tarafta, şeriat bir tarafta olursa;"], [424.0, "ve bu, hak kendisine zahir olduktan, belli olduktan ve açıklık kazandıktan sonra kasten olursa.\" Sözü bitti."]]}, {"reader": false, "ar": [[448.0, "فالله عز وجل إنما اشترط العذابَ في قوله:"], [451.7, "<span class=\"ayah\">﴿نُوَلِّهِ مَا تَوَلَّىٰ وَنُصْلِهِ جَهَنَّمَ﴾<\/span> <span class=\"ref\">[النساء: ١١٥]<\/span> مشروطًا بقوله:"], [455.2, "<span class=\"ayah\">﴿مِن بَعْدِ مَا تَبَيَّنَ لَهُ الْهُدَىٰ﴾<\/span> <span class=\"ref\">[النساء: ١١٥]<\/span>."], [459.0, "ويُفهم من هذا أنّ من لم يتبيّن له الهدى،"], [463.8, "وكان بابُ الهدى مُقفَلًا أمام وجهه،"], [467.0, "وليس له طريقٌ في معرفته،"], [469.0, "فإنه لا يستحقّ شيئًا من هذا العذاب."]], "tr": [[448.0, "Allah Azze ve Celle, <span class=\"ayah\">﴿onu döndüğü yönde bırakırız ve cehenneme sokarız﴾<\/span> [Nisâ 115] sözündeki azabı ancak <span class=\"ayah\">﴿kendisine hidayet apaçık belli olduktan sonra﴾<\/span> [Nisâ 115] sözüyle şarta bağlamıştır."], [455.2, "Bundan şu anlaşılır: Kendisine hidayet belli olmayan, hidayet kapısı yüzüne kapalı olan ve onu bilmeye hiçbir yolu bulunmayan kimse bu azaptan hiçbir şeye müstahak olmaz."]]}, {"reader": false, "ar": [[473.0, "ومن الأدلّة أيضًا: الأدلّةُ التي تدلّ على أنّ الله عز وجل لا يؤاخذ المخطئ،"], [481.0, "فإنها دليلٌ على عدم مؤاخذة الجاهل؛"], [484.0, "إذ الجهلُ من الخطأ؛"], [488.0, "كقول الله عز وجل:"], [490.2, "<span class=\"ayah\">﴿رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا﴾<\/span> <span class=\"ref\">[البقرة: ٢٨٦]<\/span>،"], [494.0, "وقولِ الله عز وجل:"], [496.7, "<span class=\"ayah\">﴿وَلَيْسَ عَلَيْكُمْ جُنَاحٌ فِيمَا أَخْطَأْتُم بِهِ وَلَٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْ﴾<\/span> <span class=\"ref\">[الأحزاب: ٥]<\/span>."], [504.0, "فبما أنّ الجهل فرعٌ عن الخطأ،"], [507.0, "فلا يُؤاخَذ الإنسان بترك مأمورٍ أو فعلِ شيءٍ من المحظورات جاهلًا بجهلٍ يُعذر فيه."]], "tr": [[473.0, "Delillerden biri de Allah Azze ve Celle'nin hata edeni sorumlu tutmadığına delâlet eden delillerdir."], [473.0, "Bunlar cahilin sorumlu tutulmadığına da delildir;"], [481.0, "çünkü cehalet hatadandır. Allah Azze ve Celle'nin şu sözü gibi:"], [490.2, "<span class=\"ayah\">﴿Rabbimiz! Unutur ya da hata edersek bizi sorumlu tutma﴾<\/span> [Bakara 286]."], [490.2, "Ve Allah Azze ve Celle'nin şu sözü:"], [494.0, "<span class=\"ayah\">﴿Hata ederek yaptığınız şeyde size bir günah yoktur; fakat kalplerinizin kasten yöneldiği şey(de günah vardır)﴾<\/span> [Ahzâb 5]."], [496.7, "Cehalet hatanın bir fer'i olduğuna göre, insan mazur sayıldığı bir cehaletle, cahil olarak emredilen bir şeyi terk etmekten ya da yasaklardan bir şeyi yapmaktan dolayı sorumlu tutulmaz."]]}, {"reader": false, "ar": [[514.0, "ومن الأدلّة أيضًا قولُ النبيّ صلى الله عليه وسلم:"], [521.0, "«إنّ الله تجاوز عن أمّتي الخطأَ والنسيانَ وما استُكرهوا عليه»،"], [529.0, "أخرجه الإمام ابن ماجه في سننه بإسنادٍ حسنٍ لغيره."], [535.0, "فهذا دليلٌ على أنّ المخطئ غيرُ مؤاخَذ، غيرُ مؤاخَذ."]], "tr": [[514.0, "Delillerden biri de Nebî ﷺ'in şu sözüdür:"], [514.0, "\"Şüphesiz Allah ümmetimin hatasını, unutmasını ve zorlandıkları şeyi bağışlamıştır.\" Bunu İmam İbn Mâce Sünen'inde hasen li-gayrihî bir isnadla rivayet etmiştir."], [529.0, "Bu, hata edenin sorumlu tutulmadığına delildir, sorumlu tutulmadığına."]]}, {"reader": false, "ar": [[539.0, "قال شيخ الإسلام ابن تيمية رحمه الله تعالى:"], [544.0, "«وقولُ الله عز وجل في القرآن: <span class=\"ayah\">﴿رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا﴾<\/span> <span class=\"ref\">[البقرة: ٢٨٦]<\/span>، قال الله عز وجل: قد فعلتُ. ولم يفرّق بين الخطأ القطعيّ في مسألةٍ قطعيّةٍ أو ظنّيّة. فمن قال: إنّ المخطئ في مسألةٍ قطعيّةٍ أو ظنّيّةٍ يأثم، فقد خالف الكتابَ والسنةَ والإجماعَ القديم»."], [565.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[539.0, "Şeyhulislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [544.0, "\"Allah Azze ve Celle'nin Kur'an'daki <span class=\"ayah\">﴿Rabbimiz! Unutur ya da hata edersek bizi sorumlu tutma﴾<\/span> [Bakara 286] sözüne (karşılık) Allah Azze ve Celle 'Yaptım' buyurmuştur."], [544.0, "(Burada) kat'î bir meseledeki kat'î hata ile zannî (bir meseledeki hata) arasında ayırım yapmamıştır."], [544.0, "Kim kat'î ya da zannî bir meselede hata edenin günahkâr olduğunu söylerse, Kitab'a, Sünnet'e ve eski icmâya muhalefet etmiş olur.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[569.0, "وقال رحمه الله: «وهذا مع أنّي دائمًا ـ ومن جالسني يعلم ذلك منّي ـ أنّي من أعظم الناس نهيًا عن أن يُنسَب معيَّنٌ إلى تكفيرٍ وتفسيقٍ ومعصية، إلا إذا عُلم أنه قد قامت عليه الحجّةُ الرساليّة التي من خالفها كان كافرًا تارةً، وفاسقًا أخرى، وعاصيًا أخرى. وإنّي أقرّر أنّ الله عز وجل قد غفر لهذه الأمّة خطأها، وذلك يعمّ الخطأ في المسائل الخبريّة القوليّة» ـ قلتُ:"], [606.7, "أي العقائد ـ ثم قال:"], [609.5, "«والمسائل العمليّة»، أي: المسائل الفقهيّة."], [612.3, "انتهى كلامه رحمه الله."]], "tr": [[569.0, "Yine o —Allah ona rahmet etsin— şöyle dedi:"], [569.0, "\"Bununla beraber ben daima —benimle oturan bunu benden bilir— belirli bir kişinin tekfire, tefsike ve masiyete nispet edilmesini en çok yasaklayan insanlardanım."], [569.0, "Ancak kendisine, muhalefet edenin bazen kâfir, bazen fâsık, bazen de âsi olduğu risâlet hüccetinin ikame edildiği bilinirse (o başka)."], [569.0, "Ben şunu takrir ediyorum: Allah Azze ve Celle bu ümmetin hatasını bağışlamıştır."], [569.0, "Bu, haberî ve kavlî meselelerdeki hatayı da kapsar\" —derim ki:"], [569.0, "yani akideleri— sonra şöyle dedi:"], [606.7, "\"ve amelî meselelerdeki (hatayı da)\", yani fıkhî meseleleri."], [609.5, "Sözü bitti, Allah ona rahmet etsin."]]}]}, {"ts": "10:14", "title": "Âlimlerin nakilleri: İbnü'l-Arabî, İbnü'l-Kayyim, İbn Teymiyye", "paras": [{"reader": false, "ar": [[614.0, "وقال الإمامُ ابن العربيّ رحمه الله تعالى:"], [619.0, "«فالجاهلُ والمخطئ من هذه الأمّة» ـ فالجاهل والمخطئ من هذه الأمّة ـ «ولو عمل من الكفر والشرك ما يكون صاحبُه مشركًا أو كافرًا، فإنه يُعذَر بالجهل والخطأ، حتى تتبيّن له الحجّةُ التي يكفر تاركُها بيانًا واضحًا ما يلتبس على مثله»."], [645.0, "انتهى كلامه رحمه الله."]], "tr": [[614.0, "İmam İbnü'l-Arabî —Allah ona rahmet etsin— şöyle dedi:"], [614.0, "\"Bu ümmetten cahil olan ve hata eden kimse\" —bu ümmetten cahil olan ve hata eden kimse— \"sahibinin müşrik ya da kâfir olacağı bir küfür ve şirk işlese bile, terk edenin kâfir olduğu hüccet kendisine, onun gibisine karışık gelmeyecek açık bir beyanla belli oluncaya kadar cehalet ve hata sebebiyle mazur görülür.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[647.0, "وقال الإمام ابن القيّم رحمه الله كلامًا بديعًا،"], [651.0, "قال: «الأحكام إنما تثبت في حقّ العبد بعد بلوغه هو وبلوغها هي»."], [659.0, "الأحكام تثبت في حقّ… «إنما تثبت في حقّ العبد بعد بلوغه هو»،"], [666.0, "أي: ظهور علامةٍ من علامات البلوغ،"], [670.0, "ثم قال: «وبلوغها إليه؛ فكما لا يترتّب في حقّه قبل بلوغه هو، كذلك لا يترتّب في حقّه قبل بلوغها إليه»."], [681.0, "انتهى من «بدائع الفوائد»."], [683.0, "رحم الله الأئمّة رحمةً واسعة."]], "tr": [[647.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— güzel bir söz söyledi:"], [647.0, "\"Hükümler kulun hakkında ancak onun bulûğa ermesinden ve onların (hükümlerin) ona ulaşmasından sonra sabit olur.\" Hükümler hakkında sabit olur… \"Kulun hakkında ancak onun bulûğa ermesinden sonra sabit olur\", yani bulûğ alametlerinden birinin ortaya çıkmasından sonra."], [666.0, "Sonra şöyle dedi: \"ve onların ona ulaşmasından (sonra)."], [670.0, "Kendisi bulûğa ermeden önce onun hakkında (hüküm) terettüp etmediği gibi, onlar ona ulaşmadan önce de onun hakkında terettüp etmez.\" Bedâiu'l-Fevâid'den (alıntı) bitti."], [683.0, "Allah imamlara geniş rahmetiyle rahmet etsin."]]}, {"reader": false, "ar": [[686.0, "وقال الإمام شيخ الإسلام ابن تيمية أيضًا في «الردّ على الأخنائيّ» الأشعريّ الجهميّ،"], [690.0, "قال: «كذلك من دعا غيرَ الله» ـ وتأمّل ـ «كذلك من دعا غيرَ الله وحجّ إلى غير الله، هو أيضًا مشرك، والذي فعله كفر، لكن قد لا يكون عالمًا بأنّ هذا شركٌ محرّم، كما أنّ كثيرًا من الناس دخلوا في الإسلام من التتار وغيرهم، وعندهم أصنامٌ لهم صغارٌ من لِبْدٍ وغيره، وهم يتقرّبون إليها ويعظّمونها، ولا يعلمون أنّ ذلك محرّمٌ في دين الإسلام، ويتقرّبون إلى النار أيضًا، ولا يعلمون أنّ ذلك محرّم."]], "tr": [[686.0, "İmam Şeyhulislâm İbn Teymiyye de Eş'arî Cehmî el-Ahnâî'ye reddiyesinde şöyle dedi:"], [686.0, "\"Aynı şekilde Allah'tan başkasına dua eden\" —dikkat et— \"aynı şekilde Allah'tan başkasına dua eden ve Allah'tan başkası için hacceden kimse de müşriktir;"], [690.0, "yaptığı şey küfürdür. Fakat bunun haram bir şirk olduğunu bilmiyor olabilir."], [690.0, "Nitekim Tatarlardan ve başkalarından insanların birçoğu İslam'a girdi;"], [690.0, "yanlarında keçeden ve başka şeylerden yapılmış küçük putları vardı;"], [690.0, "onlara yakınlaşmaya çalışıyor ve onları tazim ediyorlardı;"], [690.0, "bunun İslam dininde haram olduğunu bilmiyorlardı."], [690.0, "Ateşe de yakınlaşmaya çalışıyorlardı ve bunun haram olduğunu bilmiyorlardı."]]}, {"reader": false, "ar": [[732.0, "فكثيرٌ من أنواع الشرك قد تخفى على بعض من دخل في الإسلام،"], [740.0, "ولا يعلم بأنها شرك؛"], [742.0, "فهذا ضالّ، وعملُه الذي أشرك فيه باطل،"], [746.0, "لكن لا يستحقّ العقوبة حتى تقوم عليه الحجّة،"], [750.0, "كما قال تعالى: <span class=\"ayah\">﴿فَلَا تَجْعَلُوا لِلَّهِ أَندَادًا وَأَنتُمْ تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[البقرة: ٢٢]<\/span>»،"], [754.0, "إلى آخر ما قال أبو العبّاس رحمه الله تعالى."]], "tr": [[732.0, "Şirkin birçok türü İslam'a giren bazı kimselere gizli kalabilir ve onların şirk olduğunu bilmez."], [740.0, "Bu kimse sapmıştır ve içinde şirk koştuğu ameli bâtıldır;"], [746.0, "fakat kendisine hüccet ikame edilinceye kadar cezaya müstahak olmaz."], [750.0, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [750.0, "<span class=\"ayah\">﴿Bile bile Allah'a eşler koşmayın﴾<\/span> [Bakara 22].\" Ebü'l-Abbâs'ın —Allah ona rahmet etsin— söylediklerinin sonuna kadar."]]}]}, {"ts": "12:38", "title": "Kendisini yakmalarını vasiyet eden adam hadisi ve âlimlerin yorumları", "paras": [{"reader": false, "ar": [[758.0, "ومن الأدلّة أيضًا على أصل القاعدة:"], [761.4, "النصوصُ التي فيها إعذارُ من وقع في الشرك أو الكفر،"], [767.0, "كما في الصحيحين في قصّة الرجل التي ذكرتُها لكم آنفًا عدّةَ مرّات،"], [773.0, "في قول النبيّ صلى الله عليه وسلم:"], [776.0, "«كان رجلٌ يُسرف على نفسه بالذنوب والمعاصي، فقال لبنيه: إذا أنا مِتُّ فأحرقوني، ثم ذَرُّوني في يوم ريحٍ، نصفي في البرّ ونصفي في البحر، حتى لا يقدرَ عليّ ربّي فيعذّبَني. فلمّا مات فعل به بنوه ذلك، فأمر الله عز وجل البحرَ فجمع ما فيه، والبرَّ فجمع ما فيه، فقال: لِمَ فعلتَ هذا؟ فقال: من خشيتك يا ربّي، وأنت أعلم. فقال: قد غفرتُ لك». والحديث متّفقٌ عليه."]], "tr": [[758.0, "Kaidenin aslına delillerden biri de şirke ya da küfre düşen kimsenin mazur görüldüğü nasslardır."], [761.4, "Nitekim Sahîhayn'de, size az önce birkaç kez zikrettiğim adamın kıssasında, Nebî ﷺ'in şu sözü vardır:"], [767.0, "\"Günahlar ve masiyetlerle kendi nefsine karşı haddi aşan bir adam vardı."], [776.0, "Oğullarına dedi ki: 'Ben öldüğümde beni yakın, sonra rüzgârlı bir günde külümü savurun;"], [776.0, "yarısı karaya, yarısı denize. Ta ki Rabbim bana güç yetiremesin de bana azap etmesin.' Ölünce oğulları ona bunu yaptılar."], [776.0, "Allah Azze ve Celle denize emretti, o da içindekini topladı;"], [776.0, "karaya emretti, o da içindekini topladı."], [776.0, "(Allah) 'Bunu niçin yaptın?' dedi."], [776.0, "O da 'Senin korkundan, ey Rabbim;"], [776.0, "Sen daha iyi bilirsin' dedi."], [776.0, "(Allah) 'Seni bağışladım' buyurdu.\" Hadis müttefekun aleyhtir."]]}, {"reader": false, "ar": [[807.0, "فالقول الذي صدر من هذا الرجل كفرٌ أكبرُ مخرجٌ من الملّة؛"], [813.0, "لتضمّنه إنكارَ كمال قدرة الله على جمعه بعد الموت."], [818.0, "وصفةُ القدرة من أظهر الصفات الإلهيّة وأبينها،"], [823.0, "وهي من لوازم ربوبيّة الله عز وجل وألوهيّته،"], [827.0, "بل هي من أخصّ أوصاف الربّ."], [830.0, "ولكن لم يكفر؛ لأنه كان معذورًا بجهله."]], "tr": [[807.0, "Bu adamdan sâdır olan söz, milletten çıkaran büyük küfürdür;"], [807.0, "çünkü Allah'ın ölümden sonra onu toplamaya olan kudretinin kemalini inkârı içermektedir."], [813.0, "Kudret sıfatı ilâhî sıfatların en zahiri ve en açık olanlarındandır;"], [818.0, "Allah Azze ve Celle'nin rubûbiyyetinin ve ulûhiyyetinin lâzımlarındandır;"], [823.0, "hatta Rabbin en hususi vasıflarındandır."], [827.0, "Fakat (adam) kâfir olmadı; çünkü cehaletinden dolayı mazurdu."]]}, {"reader": false, "ar": [[834.0, "قال الإمام ابن عبد البرّ رحمه الله تعالى:"], [839.0, "«اختلف الفقهاءُ في معناه» ـ أي:"], [841.5, "في هذا الحديث ـ «فقال منهم قائلون: هذا رجلٌ جهل بعضَ صفات الله عز وجل وهي القدرة، فلم يعلم أنّ الله على كلّ شيءٍ قدير. قالوا: ومن جهل صفةً من صفات الله عز وجل، وآمن بسائر صفاته وعرفها، لم يكن بجهله بعضَ صفات الله كافرًا. قالوا: وإنما الكافر من عاند الحقَّ لا من جهله. وهذا قولُ المتقدّمين من العلماء، ومن سلك سبيلَهم من المتأخّرين»."], [877.0, "انتهى كلامه رحمه الله."]], "tr": [[834.0, "İmam İbn Abdilberr —Allah ona rahmet etsin— şöyle dedi:"], [834.0, "\"Fakihler onun anlamında\" —yani bu hadisin (anlamında)— \"ihtilaf ettiler."], [841.5, "Onlardan bazıları dedi ki: Bu, Allah Azze ve Celle'nin sıfatlarından birini, yani kudreti bilmeyen bir adamdır;"], [841.5, "Allah'ın her şeye kadir olduğunu bilmedi."], [841.5, "Dediler ki: Allah Azze ve Celle'nin sıfatlarından birini bilmeyen, ama diğer sıfatlarına iman eden ve onları bilen kimse, Allah'ın sıfatlarından bir kısmını bilmemesi sebebiyle kâfir olmaz."], [841.5, "Dediler ki: Kâfir ancak hakka inat edendir, onu bilmeyen değil."], [841.5, "Bu, âlimlerden mütekaddimînin ve onların yolunu tutan müteahhirînin görüşüdür.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[879.0, "وقال الإمام أبو العبّاس ابن تيمية عن هذا الحديث:"], [882.0, "«فهذا رجلٌ شكّ في قدرة الله عز وجل وفي إعادته إذا ذُرِّيَ، بل اعتقد أنه لا يُعاد، وهذا كفرٌ باتّفاق المسلمين، لكن كان جاهلًا لا يعلم ذلك، وكان مؤمنًا يخاف الله أن يعاقبه، فغفر الله له ذلك»."], [903.0, "انتهى كلامه رحمه الله."]], "tr": [[879.0, "İmam Ebü'l-Abbâs İbn Teymiyye bu hadis hakkında şöyle dedi:"], [879.0, "\"Bu, Allah Azze ve Celle'nin kudretinden ve savrulduğunda kendisini tekrar diriltmesinden şüphe eden bir adamdır;"], [882.0, "hatta tekrar diriltilmeyeceğine inanmıştır. Bu, Müslümanların ittifakıyla küfürdür."], [882.0, "Fakat o cahildi, bunu bilmiyordu;"], [882.0, "Allah'ın kendisini cezalandırmasından korkan bir mümindi;"], [882.0, "Allah da onu bunun için bağışladı.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[904.8, "وقال أيضًا في موضعٍ آخر:"], [907.0, "«فهذا الرجل اعتقد أنّ الله لا يقدر على جمعه إذا فعل ذلك، أو شكّ، وأنه لا يبعثه، وكلٌّ من هذين الاعتقادين كفرٌ يكفر من قامت عليه الحجّة، لكنه كان يجهل ذلك، ولم يبلغه العلمُ بما يردّه عن جهله، وكان عنده إيمانٌ بالله وبأمره ونهيه ووعده ووعيده، فخاف من عقابه، فغفر الله له بخشيته."]], "tr": [[904.8, "Yine başka bir yerde şöyle dedi:"], [904.8, "\"Bu adam, bunu yaptığında Allah'ın onu toplamaya güç yetiremeyeceğine inandı ya da şüphe etti;"], [907.0, "ve onu diriltmeyeceğine (inandı). Bu iki inançtan her biri, kendisine hüccet ikame edilen kimsenin kâfir olduğu bir küfürdür."], [907.0, "Fakat o bunu bilmiyordu; onu cehaletinden döndürecek ilim de ona ulaşmamıştı."], [907.0, "Onda Allah'a, O'nun emrine, nehyine, va'dine ve vaîdine iman vardı;"], [907.0, "O'nun cezasından korktu, Allah da korkusu sebebiyle onu bağışladı."]]}, {"reader": false, "ar": [[935.0, "فمن أخطأ في بعض مسائل الاعتقاد من أهل الإيمان بالله وبرسوله وباليوم الآخر والعمل الصالح،"], [942.8, "لم يكن أسوأ حالًا من هذا الرجل،"], [946.0, "فيغفر الله له خطأه،"], [947.8, "أو يعذّبه إن كان منه تفريطٌ في اتّباع الحقّ على قدر دينه."], [953.0, "وأمّا تكفيرُ شخصٍ عُلم إيمانُه بمجرّد الغلط في ذلك فعظيم»،"], [961.0, "يعني: تكفيرُه شيءٌ عظيم."], [963.0, "انتهى كلامه رحمه الله."]], "tr": [[935.0, "Allah'a, Resûlü'ne, ahiret gününe iman eden ve salih amel işleyenlerden, itikad meselelerinin bazısında hata eden kimse bu adamdan daha kötü hâlde değildir."], [942.8, "Allah onun hatasını bağışlar; ya da hakka uymada ondan bir kusur varsa, dini ölçüsünde ona azap eder."], [947.8, "İmanı bilinen bir şahsı sırf bu konudaki bir yanlış sebebiyle tekfir etmeye gelince, bu büyük bir iştir.\" Yani onu tekfir etmek büyük bir şeydir."], [961.0, "Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[965.0, "وقال الإمام الشافعيّ رحمه الله تعالى:"], [968.5, "«لله أسماءٌ وصفاتٌ جاء بها كتابُه، وأخبر بها نبيُّه صلى الله عليه وسلم أمّتَه، لا يسع أحدًا قامت عليه الحجّةُ ردُّها؛ لأنّ القرآن نزل بها، وصحّ عن رسول الله صلى الله عليه وسلم القولُ بها. فإن خالف ذلك بعد ثبوت الحجّة عليه فهو كافر، فأمّا قبل ثبوت الحجّة فمعذورٌ بالجهل؛ لأنّ علم ذلك لا يُدرَك بالعقل ولا بالرَّوِيّة والفكر، ولا نكفّر بالجهل بها أحدًا إلا بعد انتهاء الخبر إليه بها»."], [1008.0, "انتهى كلامه رحمه الله."], [1009.6, "ما أدري، كلامي واضح؟"]], "tr": [[965.0, "İmam Şâfiî —Allah ona rahmet etsin— şöyle dedi:"], [965.0, "\"Allah'ın, Kitabı'nın getirdiği ve Peygamberi ﷺ'in ümmetine haber verdiği isimleri ve sıfatları vardır."], [968.5, "Kendisine hüccet ikame edilen hiç kimsenin onları reddetmesine imkân yoktur;"], [968.5, "çünkü Kur'an onlarla inmiştir ve Resûlullah ﷺ'den onları söylediği sahih olarak gelmiştir."], [968.5, "Eğer hüccet kendisine sabit olduktan sonra buna muhalefet ederse kâfirdir."], [968.5, "Hüccet sabit olmadan önce ise cehalet sebebiyle mazurdur."], [968.5, "Çünkü bunun bilgisi akılla, düşünüp taşınmakla ve fikirle idrak edilmez."], [968.5, "Haber kendisine ulaşmadıkça onları bilmemesi sebebiyle hiç kimseyi tekfir etmeyiz.\" Sözü bitti, Allah ona rahmet etsin. Bilmiyorum, sözüm açık mı?"]]}, {"reader": false, "ar": [[1010.0, "وقال الإمام ابن بطّال رحمه الله:"], [1013.0, "«وقال آخرون: بل غُفر له» ـ أي:"], [1016.0, "لهذا الرجل ـ «وإن كان كفرًا من قوله؛ من أجل أنه قاله على جهلٍ منه بخطئه، فظنّ أنّ ذلك صواب. قالوا: وغيرُ جائزٍ في عدل الله وحكمته أن يسوّي بين من أخطأ وهو يقصد الصواب، وبين من تعمّد الخطأ والعنادَ للحقّ، في العقاب»."], [1041.0, "وهذا ظاهرٌ إن شاء الله."]], "tr": [[1010.0, "İmam İbn Battâl —Allah ona rahmet etsin— şöyle dedi:"], [1013.0, "\"Diğerleri de dediler ki: Bilakis, o\" —yani bu adam— \"sözü küfür olsa bile bağışlandı."], [1016.0, "Çünkü onu, hatasını bilmeyerek söyledi ve onun doğru olduğunu zannetti."], [1016.0, "Dediler ki: Allah'ın adaletinde ve hikmetinde, doğruyu kastederek hata eden ile hatayı ve hakka inadı kasteden kimseyi cezada eşit tutması caiz değildir.\" Bu, inşallah açıktır."]]}, {"reader": false, "ar": [[1044.0, "وقال الإمام ابن حزم رحمه الله تعالى عنه:"], [1048.0, "«فهذا إنسانٌ جهل ـ إلى أن مات ـ أنّ الله عز وجل يقدر على جمع رماده وإحيائه، وقد غُفر له لإقراره وخوفه وجهله». انتهى كلامه."]], "tr": [[1044.0, "İmam İbn Hazm —Allah ona rahmet etsin— onun hakkında şöyle dedi:"], [1048.0, "\"Bu, ölünceye kadar Allah Azze ve Celle'nin onun külünü toplayıp onu diriltmeye kadir olduğunu bilmeyen bir insandır;"], [1048.0, "ikrarı, korkusu ve cehaleti sebebiyle bağışlanmıştır.\" Sözü bitti."]]}]}, {"ts": "17:41", "title": "Benî İsrâil'in Mûsâ'dan ilah istemesi ve Zâtu Envât hadisi", "paras": [{"reader": false, "ar": [[1061.0, "ومن الأدلّة على أصل الكلّيّة أيضًا:"], [1065.0, "قصّةُ بني إسرائيل مع موسى عليه الصلاة والسلام؛"], [1068.0, "قال الله عز وجل:"], [1070.0, "<span class=\"ayah\">﴿وَجَاوَزْنَا بِبَنِي إِسْرَائِيلَ الْبَحْرَ فَأَتَوْا عَلَىٰ قَوْمٍ يَعْكُفُونَ عَلَىٰ أَصْنَامٍ لَّهُمْ ۚ قَالُوا يَا مُوسَى اجْعَل لَّنَا إِلَٰهًا كَمَا لَهُمْ آلِهَةٌ ۚ قَالَ إِنَّكُمْ قَوْمٌ تَجْهَلُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٣٨]<\/span> <span class=\"ayah\">﴿إِنَّ هَٰؤُلَاءِ مُتَبَّرٌ مَّا هُمْ فِيهِ وَبَاطِلٌ مَّا كَانُوا يَعْمَلُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٣٩]<\/span>."]], "tr": [[1061.0, "Külliyenin aslına delillerden biri de Benî İsrâil'in Mûsâ —aleyhissalâtu vesselâm— ile olan kıssasıdır."], [1068.0, "Allah Azze ve Celle şöyle buyurdu:"], [1070.0, "<span class=\"ayah\">﴿İsrâiloğullarını denizden geçirdik. Kendilerine ait putlara tapan bir kavme vardılar. \"Ey Mûsâ! Onların ilahları olduğu gibi bize de bir ilah yap\" dediler. (Mûsâ) \"Siz gerçekten cahillik eden bir kavimsiniz\" dedi.﴾<\/span> [A'râf 138] <span class=\"ayah\">﴿Şüphesiz bunların içinde bulundukları şey yok olacaktır; yapmakta oldukları da bâtıldır.﴾<\/span> [A'râf 139]"]]}, {"reader": false, "ar": [[1091.0, "فانظر ـ يا رعاك الله ـ كيف طلبوا من موسى عليه الصلاة والسلام أن يجعل لهم صنمًا يتقرّبون بعبادته إلى الله،"], [1100.0, "كما اتّخذ هؤلاء المشركون أصنامًا يعبدونها."], [1105.0, "قال الإمام ابن الجوزيّ رحمه الله تعالى:"], [1108.2, "«وهذا إخبارٌ عن عظيم جهلهم؛ حيث توهّموا جوازَ عبادة غير الله بعدما رأوا من الآيات العظيمة»."], [1116.0, "انتهى كلامه رحمه الله."]], "tr": [[1091.0, "Bak —Allah seni korusun— Mûsâ'dan —aleyhissalâtu vesselâm—, bu müşriklerin ibadet ettikleri putlar edindikleri gibi, kendilerine ibadetiyle Allah'a yakınlaşacakları bir put yapmasını nasıl istediler!"], [1100.0, "İmam İbnü'l-Cevzî —Allah ona rahmet etsin— şöyle dedi:"], [1105.0, "\"Bu, onların cehaletlerinin büyüklüğünü haber vermektir;"], [1108.2, "çünkü gördükleri büyük âyetlerden sonra Allah'tan başkasına ibadetin caiz olduğunu vehmettiler.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[1117.8, "وقال الشيخ عبد الرحمن المعلّميّ ـ وهو ممّن أُوصي بقراءة كتبه كثيرًا،"], [1122.7, "ففيها خيرٌ عظيم ـ قال رحمه الله:"], [1125.9, "«يظهر من جواب موسى عليه الصلاة والسلام أنه وإن أنكر عليهم جهلَهم لم يجعل طلبَهم ارتدادًا عن الدين، ويشهد لذلك أنهم لم يُؤاخَذوا هنا كما أُوخذوا به عند اتّخاذهم العجل، فكأنهم هنا ـ والله أعلم ـ عُذروا بقرب عهدهم»،"], [1149.0, "أي: بالإسلام. انتهى كلامه رحمه الله."]], "tr": [[1117.8, "Şeyh Abdurrahman el-Muallimî —ki kitaplarının çokça okunmasını tavsiye ettiğim kimselerdendir;"], [1117.8, "onlarda büyük hayır vardır— şöyle dedi, Allah ona rahmet etsin:"], [1122.7, "\"Mûsâ'nın —aleyhissalâtu vesselâm— cevabından anlaşılıyor ki, onların cehaletini reddetmekle birlikte, isteklerini dinden dönme saymamıştır."], [1125.9, "Buna şu da şahitlik eder:"], [1125.9, "Buzağıyı edindiklerinde sorumlu tutuldukları gibi burada sorumlu tutulmamışlardır."], [1125.9, "Sanki burada —Allah en iyisini bilir— (dine) yeni girmiş olmaları sebebiyle mazur görülmüşlerdir\", yani İslam'a."], [1149.0, "Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[1153.0, "ومن الأدلّة على ذلك أيضًا:"], [1155.3, "حديثُ ذات أنواط، الذي أخرجه الإمام الترمذيّ في جامعه بإسنادٍ جيّد،"], [1160.3, "من حديث أبي واقدٍ الليثيّ رضي الله عنه قال:"], [1164.6, "«خرجنا مع رسول الله صلى الله عليه وسلم قِبَلَ حُنين، فمررنا بسِدرة، فقلنا: يا نبيّ الله، اجعل لنا ذاتَ أنواطٍ كما لهم ذاتُ أنواط ـ وكان الكفّار يَنوطون بها أسلحتهم، ويعكفون حولها ـ فقال النبيّ صلى الله عليه وسلم: الله أكبر! إنها السُّنَن، هذا كما قالت بنو إسرائيل لموسى: <span class=\"ayah\">﴿اجْعَل لَّنَا إِلَٰهًا كَمَا لَهُمْ آلِهَةٌ﴾<\/span> <span class=\"ref\">[الأعراف: ١٣٨]<\/span>، لتركبُنّ سَنَنَ من كان قبلكم»،"], [1196.1, "أو كما قال صلى الله عليه وسلم."]], "tr": [[1153.0, "Buna delillerden biri de İmam Tirmizî'nin Câmi'inde ceyyid bir isnadla Ebû Vâkıd el-Leysî'den —Allah ondan razı olsun— rivayet ettiği Zâtu Envât hadisidir."], [1160.3, "Dedi ki: \"Resûlullah ﷺ ile birlikte Huneyn tarafına çıktık."], [1164.6, "Bir sidre ağacının yanından geçtik ve 'Ey Allah'ın Nebîsi!"], [1164.6, "Onların Zâtu Envât'ı olduğu gibi bize de bir Zâtu Envât yap' dedik."], [1164.6, "—Kâfirler silahlarını ona asarlar ve etrafında ibadete kapanırlardı.— Nebî ﷺ şöyle buyurdu:"], [1164.6, "'Allahu ekber! Bunlar (önceki ümmetlerin) yollarıdır."], [1164.6, "Bu, İsrâiloğullarının Mûsâ'ya <span class=\"ayah\">﴿Onların ilahları olduğu gibi bize de bir ilah yap﴾<\/span> [A'râf 138] demesi gibidir."], [1164.6, "Sizden öncekilerin yollarına mutlaka bineceksiniz.'\" Ya da ﷺ nasıl buyurduysa."]]}, {"reader": false, "ar": [[1199.0, "فقد طلبوا من النبيّ صلى الله عليه وسلم فعلَ ما هو شركٌ أكبر،"], [1205.0, "وهو أن يشرّع لهم التعلّقَ بالشجر كما كان يفعل المشركون؛"], [1211.0, "ولهذا جعل النبيّ صلى الله عليه وسلم قولَهم هذا مثلَ قول بني إسرائيل لموسى."], [1218.0, "ولكنّ النبيّ صلى الله عليه وسلم عذرهم بقوله:"], [1223.5, "«ونحن حُدثاءُ عهدٍ بكفر» <span class=\"note\">(Bu ifade, hadiste sahâbî Ebû Vâkıd'ın sözüdür; bk. notlar)<\/span>،"], [1227.0, "أي: لم تتّضح لهم هذه القضيّة الكفريّة،"], [1230.5, "ولم يأمرهم بتجديد إسلامهم؛"], [1232.5, "لأنه قد عذرهم بهذا الجهل."]], "tr": [[1199.0, "Onlar Nebî ﷺ'den büyük şirk olan bir şeyi yapmasını istediler;"], [1199.0, "o da müşriklerin yaptığı gibi kendilerine ağaçlara bağlanmayı (teallukı) meşru kılmasıdır."], [1211.0, "Bu yüzden Nebî ﷺ onların bu sözünü İsrâiloğullarının Mûsâ'ya söylediği söz gibi saydı."], [1218.0, "Fakat Nebî ﷺ onları —(hadisteki) \"Biz küfürden yeni çıkmıştık\" sözü sebebiyle— mazur gördü."], [1223.5, "Yani bu küfür meselesi onlara açık değildi;"], [1227.0, "(Nebî ﷺ) onlara İslam'larını yenilemelerini emretmedi;"], [1230.5, "çünkü onları bu cehaletle mazur görmüştü."]]}]}, {"ts": "20:35", "title": "Huzeyfe hadisi; İbn Teymiyye ve İbn Kudâme'nin nakilleri", "paras": [{"reader": false, "ar": [[1235.0, "ومن الأدلّة أيضًا: حديثُ حذيفة رضي الله تعالى عنه،"], [1240.6, "وهو حديثٌ أخرجه الإمام ابن ماجه،"], [1244.3, "وصحّحه الإمام البوصيريّ، وحسّنه غيرُه،"], [1247.4, "في قول النبيّ صلى الله عليه وسلم:"], [1251.8, "«يَدرُس» ـ أي: يتلاشى ـ «يَدرُس الإسلامُ كما يدرُس وَشْيُ الثوب» ـ أي:"], [1258.0, "زخارف الثوب؛ فإنه مع طول اللُّبس والغسيل يبدأ يضعف لمعانُها ـ «يدرُس الإسلام كما يدرُس وَشْيُ الثوب، حتى لا يُدرى ما صيامٌ ولا صلاةٌ ولا نُسُكٌ ولا صدقة، ولَيُسرى على كتاب الله في ليلةٍ فلا يبقى منه في الأرض آية، وتبقى طوائفُ من الناس: الشيخُ الكبير والعجوز، يقولون: أدركنا آباءنا على لا إله إلا الله، فنحن نقولها»."], [1294.0, "فقال له صِلَةُ ـ وهو أحد الرواة ـ:"], [1296.8, "«وما تُغني عنهم لا إله إلا الله؟» فكرّرها ثلاثًا،"], [1301.4, "فقال: «يا صِلَة، تُنجيهم من النار»، قالها ثلاثًا."]], "tr": [[1235.0, "Delillerden biri de Huzeyfe'nin —Allah ondan razı olsun— hadisidir."], [1240.6, "Bu hadisi İmam İbn Mâce rivayet etmiş, İmam Bûsîrî sahih, başkaları da hasen saymıştır."], [1244.3, "Nebî ﷺ şöyle buyurur: \"Silinir\" —yani yok olup gider— \"İslam, elbisenin nakışı silindiği gibi silinir\" —yani elbisenin süsleri;"], [1251.8, "çünkü uzun süre giyilip yıkanmakla parlaklıkları zayıflamaya başlar— \"İslam, elbisenin nakışı silindiği gibi silinir;"], [1258.0, "öyle ki oruç nedir, namaz nedir, kurban (nüsük) nedir, sadaka nedir bilinmez."], [1258.0, "Allah'ın Kitabı bir gecede (göğe) kaldırılır, yeryüzünde ondan tek bir ayet kalmaz."], [1258.0, "İnsanlardan bazı topluluklar kalır: yaşlı adam ve yaşlı kadın;"], [1258.0, "'Babalarımızı lâ ilâhe illallah (kelimesi) üzere bulduk, biz de onu söylüyoruz' derler.\" Râvîlerden biri olan Sıla ona dedi ki:"], [1294.0, "\"Lâ ilâhe illallah onlara ne fayda verir?\" Bunu üç kez tekrarladı."], [1296.8, "(Huzeyfe) dedi ki: \"Ey Sıla!"], [1301.4, "Onları ateşten kurtarır.\" Bunu üç kez söyledi."]]}, {"reader": false, "ar": [[1307.0, "فهذا الحديث يدلّ على أنّ أولئك القوم ليس عندهم إلا إيمانٌ مُجمَلٌ وإقرارٌ مجملٌ بالتوحيد،"], [1317.0, "ولا يعرفون عن الإسلام شيئًا إلا مجرّدَ الإقرار الذي وجدوا عليه آباءهم."]], "tr": [[1307.0, "Bu hadis, o kavmin yanında tevhide dair sadece mücmel bir iman ve mücmel bir ikrar bulunduğuna, İslam hakkında babalarını üzerinde buldukları sırf ikrardan başka bir şey bilmediklerine delâlet eder."]]}, {"reader": false, "ar": [[1328.0, "قال الإمام ابن تيمية رحمه الله تعالى:"], [1331.0, "«وكثيرٌ من الناس قد ينشأ في الأمكنة والأزمنة التي يندرس فيها كثيرٌ من علوم النبوّات، حتى لا يبقى من يبلّغ ما بعث الله به رسولَه صلى الله عليه وسلم من الكتاب والحكمة، فلا يعلم كثيرًا ممّا بعث الله به رسولَه صلى الله عليه وسلم، ولا يكون هناك من يبلّغه ذلك، ومثلُ هذا لا يكفر. ولهذا اتّفق الأئمّة على أنّ من نشأ ببادية بعيدةٍ عن أهل العلم والإيمان، وكان حديثَ العهد بالإسلام، فأنكر شيئًا من هذه الأحكام الظاهرة المتواترة، فإنه لا يُحكم بكفره حتى يُعرَّف ما جاء به الرسول صلى الله عليه وسلم». انتهى كلامه."]], "tr": [[1328.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [1331.0, "\"İnsanların birçoğu, nübüvvet ilimlerinin birçoğunun silinip gittiği mekânlarda ve zamanlarda yetişebilir."], [1331.0, "Öyle ki Allah'ın Resûlü ﷺ'i kendisiyle gönderdiği Kitab'ı ve hikmeti tebliğ edecek kimse kalmaz."], [1331.0, "(Böyle biri) Allah'ın Resûlü ﷺ'i kendisiyle gönderdiği şeylerin birçoğunu bilmez;"], [1331.0, "orada ona bunu tebliğ edecek kimse de olmaz."], [1331.0, "Böyle biri kâfir olmaz. Bu yüzden imamlar şu hususta ittifak etmişlerdir:"], [1331.0, "İlim ve iman ehlinden uzak bir çölde yetişen ve İslam'a yeni girmiş olan kimse, bu zahir ve mütevâtir hükümlerden bir şeyi inkâr ederse, Resûl ﷺ'in getirdiği şey kendisine öğretilinceye kadar kâfir olduğuna hükmedilmez.\" Sözü bitti."]]}, {"reader": false, "ar": [[1384.9, "وقال أبو محمد ابن قدامة المقدسيّ رحمه الله تعالى عن جاحد الصلاة،"], [1389.1, "جاحدِ الصلاة: «فإن كان ممّن لا يعرف الوجوب، كحديث الإسلام، والناشئ بغير دار الإسلام، أو باديةٍ بعيدةٍ عن الأمصار وأهل العلم، لم يُحكم بكفره، وعُرِّف ذلك، وتُثبَت له أدلّةُ وجوبها، فإن جحد بعد ذلك كفر. وأمّا إذا كان الجاحد لها ناشئًا في الأمصار بين أهل العلم، فإنه يكفر بمجرّد جحدها، وكذلك الحكم في مباني الإسلام كلّها». انتهى كلامه."]], "tr": [[1384.9, "Ebû Muhammed İbn Kudâme el-Makdisî —Allah ona rahmet etsin— namazı inkâr eden, namazı inkâr eden kimse hakkında şöyle dedi:"], [1389.1, "\"Eğer o, İslam'a yeni girmiş olan, İslam diyarından başka bir yerde ya da şehirlerden ve ilim ehlinden uzak bir çölde yetişen kimse gibi (namazın) farz olduğunu bilmeyenlerdense, kâfir olduğuna hükmedilmez;"], [1389.1, "bu ona öğretilir ve farz oluşunun delilleri ona isbat edilir."], [1389.1, "Bundan sonra inkâr ederse kâfir olur."], [1389.1, "Fakat onu inkâr eden kimse şehirlerde, ilim ehlinin arasında yetişmişse, sırf onu inkâr etmesiyle kâfir olur."], [1389.1, "İslam'ın bütün temel rükünlerinde (mebânî) hüküm de böyledir.\" Sözü bitti."]]}, {"reader": false, "ar": [[1423.0, "قال الإمام ابن تيمية رحمه الله تعالى… طوّلتُ عليكم فيها،"], [1426.0, "لكنها مهمّة والله؛ لكثرة الخلاف فيها."], [1429.0, "وقال الإمام ابن تيمية رحمه الله تعالى:"], [1433.0, "«لا يكفّر العلماءُ، لا يكفّر العلماء من استحلّ شيئًا من المحرّمات لقرب عهده بالإسلام، أو لنشأته ببادية بعيدة؛ فإنّ حكم الكفر لا يكون إلا بعد بلوغ الرسالة، وكثيرٌ من هؤلاء قد لا يكون قد بلغته النصوصُ المخالفة لما يراه، ولا يعلم أنّ الرسول بُعث به»."], [1458.0, "انتهى كلامه رحمه الله."]], "tr": [[1423.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi… Bu konuda sizi uzun tuttum;"], [1426.0, "fakat vallahi önemlidir, çünkü bu konuda ihtilaf çoktur."], [1429.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [1433.0, "\"Âlimler, İslam'a yeni girmiş olması ya da uzak bir çölde yetişmiş olması sebebiyle haramlardan bir şeyi helal sayan kimseyi tekfir etmezler, tekfir etmezler."], [1433.0, "Çünkü küfür hükmü ancak risâletin ulaşmasından sonra olur."], [1433.0, "Bunların birçoğuna, görüşüne aykırı olan nasslar ulaşmamış olabilir;"], [1433.0, "Resûl'ün onunla gönderildiğini de bilmez.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[1461.0, "وقال أيضًا في موضعٍ آخر:"], [1463.0, "«هؤلاء الأجناس وإن كانوا قد كثروا في هذا الزمان، فلقلّة دعاة العلم والإيمان، وفتور آثار الرسالة في أكثر البلدان، وأكثرُ هؤلاء ليس عندهم من آثار الرسالة وميراث النبوّة ما يعرفون به الهدى، وكثيرٌ منهم لم يبلغهم ذلك. وفي أوقات الفترات وأمكنة الفترات يُثاب الرجل على ما معه من الإيمان القليل، ويغفر الله له ما لم تقم عليه به الحجّة ما لا يغفر الله به لمن قامت عليه الحجّة»."], [1504.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[1461.0, "Yine başka bir yerde şöyle dedi:"], [1463.0, "\"Bu sınıflar bu zamanda çoğalmışlarsa, bu, ilim ve iman davetçilerinin azlığından ve beldelerin çoğunda risâlet eserlerinin zayıflamasındandır."], [1463.0, "Bunların çoğunun yanında, kendisiyle hidayeti bilecekleri risâlet eserlerinden ve nübüvvet mirasından bir şey yoktur;"], [1463.0, "birçoğuna da bu ulaşmamıştır. Fetret vakitlerinde ve fetret mekânlarında kişi yanındaki az imandan dolayı sevap alır;"], [1463.0, "Allah, kendisine hüccet ikame edilmeyen şeyi ona bağışlar;"], [1463.0, "kendisine hüccet ikame edilen kimseye ise onu bağışlamaz.\" Sözü bitti, Allah ona rahmet etsin."]]}]}, {"ts": "25:07", "title": "Hulâsa: Mazeret sayılan cehalet, giderilmesi imkânsız olandır", "paras": [{"reader": false, "ar": [[1507.0, "والحاصل ـ وفّقكم الله ـ أنّ الجهل الذي يُعذَر به صاحبه،"], [1511.2, "والذي نصّ عليه أئمّةُ الإسلام في النقول السابقة،"], [1515.0, "والذي دلّت عليه الأدلّة من الكتاب والسنة،"], [1518.5, "ووقع عليه إجماعُ أهل العلم،"], [1521.0, "إنما هو ذلك الجهل الذي يعجز الإنسان عن رفعه؛"], [1526.0, "بمعنى أنه يريد أن يرفعه عن نفسه،"], [1530.0, "ولكن ليس ثَمّةَ بابٌ مفتوح؛"], [1533.0, "فليس قريبًا من أهل العلم،"], [1534.7, "ولا هم بقريبين منه،"], [1536.0, "وليست عنده وسيلةٌ من وسائل التواصل معهم،"], [1540.0, "فهو لا يستطيع أن يرفع الجهل عن نفسه."]], "tr": [[1507.0, "Sonuç olarak —Allah sizi muvaffak kılsın— sahibinin kendisiyle mazur görüldüğü, İslam imamlarının önceki nakillerde açıkça belirttiği, Kitap ve Sünnet'ten delillerin delâlet ettiği ve ehl-i ilmin üzerinde icmâ ettiği cehalet, ancak insanın gidermekten âciz olduğu cehalettir."], [1526.0, "Yani onu kendisinden gidermek ister, fakat açık bir kapı yoktur:"], [1530.0, "Ne kendisi ilim ehline yakındır ne de onlar ona yakındır;"], [1534.7, "yanında onlarla iletişim vasıtalarından hiçbiri de yoktur. Dolayısıyla cehaleti kendisinden gideremez."]]}, {"reader": false, "ar": [[1543.0, "وأزيد الأمر إيضاحًا فأقول:"], [1545.6, "إنّ المتقرّر عند العلماء أنّ الأمر الشرعيّ مقرونٌ بالقدرة على العلم والعمل،"], [1553.4, "فلا واجبَ مع العجز إجماعًا."], [1557.0, "ومن المعلوم أنّ الشريعة أمرت المكلَّف بأن يرفع الجهل عنه،"], [1563.4, "فالأمر برفع الجهل لا يعدو أن يكون أمرًا شرعيًّا،"], [1569.2, "فيكون مقرونًا بالقدرة والاستطاعة."], [1572.0, "فإذا كان الإنسان مأمورًا برفع الجهل،"], [1575.0, "وهو غيرُ قادرٍ على تنفيذ هذا الأمر لانقطاع وسائل رفعه،"], [1580.0, "فحينئذٍ لا يؤاخذه، لا يؤاخذه الله عز وجل."]], "tr": [[1543.0, "İşi daha da açıklığa kavuşturup diyorum ki:"], [1545.6, "Âlimler nezdinde yerleşik olan şudur:"], [1545.6, "Şer'î emir, bilmeye ve amel etmeye güç yetirmeye bağlıdır;"], [1553.4, "icmâ ile aczle birlikte vâcip yoktur."], [1557.0, "Bilinen şudur ki şeriat mükellefe cehaleti kendisinden gidermesini emretmiştir."], [1563.4, "Cehaleti giderme emri de şer'î bir emir olmaktan öteye geçmez;"], [1563.4, "dolayısıyla güç ve takate bağlıdır."], [1569.2, "İnsan cehaleti gidermekle emrolunduğu hâlde, onu giderme vasıtaları kesildiği için bu emri yerine getirmeye gücü yetmiyorsa, bu durumda Allah Azze ve Celle onu sorumlu tutmaz, sorumlu tutmaz."]]}, {"reader": false, "ar": [[1585.0, "وكلامُنا هذا كلُّه فيمن كان أصله مسلمًا ووقع في شيءٍ من المكفِّرات."], [1596.0, "وأمّا إن كان لا ينتسب إلى المسلمين أصالةً،"], [1600.0, "فإنّ حكمه حكمُ أهل الدين الذين ينتسب إليهم في الدنيا،"], [1605.0, "وأمرُه في الآخرة إلى الله تبارك وتعالى. والله أعلم."]], "tr": [[1585.0, "Bu sözümüzün hepsi, aslı Müslüman olup mükeffir şeylerden birine düşen kimse hakkındadır."], [1596.0, "Eğer aslen Müslümanlara nispet edilmiyorsa, dünyada onun hükmü, nispet edildiği din ehlinin hükmüdür;"], [1600.0, "ahiretteki işi ise Allah Tebâreke ve Teâlâ'ya kalmıştır. Allah en iyisini bilir."]]}]}, {"ts": "26:49", "title": "2. Külliye: Küfür olduğu tevâtürle bilinen zahir bir küfre düşen cehaletle mazur görülmez", "paras": [{"reader": false, "ar": [[1609.0, "ومن الكلّيّات أيضًا ـ وهي كلّيّةٌ تقيّد الكلّيّة السابقة ـ:"], [1624.0, "كلُّ من وقع في كفرٍ تواتر العلمُ بكونه كفرًا،"], [1635.9, "وكان الكفرُ به من الأمور الظاهرة،"], [1639.8, "فلا يُعذَر بالجهل فيه. <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [1669.0, "كلُّ من وقع في كفرٍ تواتر العلمُ بكونه كفرًا،"], [1676.0, "وكان الكفرُ به من الأمور الظاهرة،"], [1680.0, "فلا يُعذَر بالجهل فيه."]], "tr": [[1609.0, "Külliyelerden biri de —ki bu, önceki külliyeyi kayıtlayan bir külliyedir— şudur:"], [1609.0, "<b>2. külliye: Küfür olduğu bilgisi tevâtür hâlinde bulunan ve onunla küfrün zahir işlerden olduğu bir küfre düşen herkes, onda cehaletle mazur görülmez.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [1669.0, "<b>Küfür olduğu bilgisi tevâtür hâlinde bulunan ve onunla küfrün zahir işlerden olduğu bir küfre düşen herkes, onda cehaletle mazur görülmez.<\/b>"]]}, {"reader": false, "ar": [[1682.0, "أقول وبالله التوفيق: وجهُ الجمع بين هذه الكلّيّة والكلّيّة التي قبلها هو في مجال تطبيقها؛"], [1692.0, "فالكلّيّة الأولى كلّيّةٌ عامّةٌ في كلّ البلاد،"], [1698.0, "أي: في بلاد الكفر وفي بلاد الإسلام،"], [1701.0, "ولكنّ هذه الكلّيّة إنما هي خاصّةٌ في البلاد التي انتشر فيها العلم،"], [1707.0, "ولا تزال فيها أنوارُ النبوّة والشريعة ظاهرة."], [1710.9, "فلا بدّ أن تفرّق بين الكلّيّتين:"], [1715.0, "فالكلّيّة الأولى في عموم المسلمين على وجه الأرض،"], [1720.0, "سواءٌ أكانوا في بلادٍ قد ظهر العلم فيها أو لم يظهر،"], [1726.0, "وأمّا هذه الكلّيّة ففي خصوص البلاد التي لا يزال العلم فيها ظاهرًا،"], [1735.0, "وأنوارُ النبوّة لا تزال مُشِعّةً ومُشرِقة."]], "tr": [[1682.0, "Tevfik Allah'tandır, derim ki: Bu külliye ile ondan önceki külliyeyi bağdaştırmanın yolu, uygulama alanlarındadır."], [1692.0, "Birinci külliye bütün beldelerde, yani küfür beldelerinde de İslam beldelerinde de umumi bir külliyedir."], [1701.0, "Bu külliye ise ancak ilmin yayıldığı ve nübüvvet ve şeriat nurlarının hâlâ zahir olduğu beldelere hastır."], [1710.9, "İki külliye arasında mutlaka ayırım yapmalısın:"], [1715.0, "Birinci külliye, ilmin zahir olduğu ya da olmadığı beldelerde bulunsunlar, yeryüzündeki Müslümanların umumu hakkındadır."], [1726.0, "Bu külliye ise ilmin hâlâ zahir olduğu ve nübüvvet nurlarının hâlâ ışık saçıp parladığı beldelere mahsustur."]]}, {"reader": false, "ar": [[1739.0, "وهي كلّيّةٌ مبنيّةٌ على العدل والإنصاف في باب التكفير،"], [1746.0, "وأصلُها وجوبُ التفريق في باب التكفير بين المسائل الخفيّة الدقيقة،"], [1756.0, "التي قد لا يكاد يعرفها إلا خواصُّ أهل العلم ومن له مشاركةٌ في طلب العلم،"], [1765.0, "وبين المسائل الظاهرة الجليّة،"], [1767.7, "التي يتّفق المسلمون في البلاد الإسلاميّة على معرفتها،"], [1773.0, "وصار العلم بها ممّا يُعلم من الدين بالضرورة،"], [1778.0, "وتواتر العلم بها. فهذه لها حكم،"], [1783.2, "وتلك لها حكمٌ آخر؛"], [1787.0, "فلا ينبغي التسوية بين المسألتين لاختلاف متعلَّقهما،"], [1793.0, "وإذا اختلفت المتعلَّقات اختلفت الأحكام،"], [1798.0, "من باب عدل الله عز وجل."]], "tr": [[1739.0, "Bu, tekfir babında adalet ve insaf üzerine bina edilmiş bir külliyedir."], [1739.0, "Aslı, tekfir babında şu ikisi arasında ayırım yapmanın vâcip olmasıdır:"], [1746.0, "Ehl-i ilmin havâssı ve ilim talebinde payı olan kimselerden başkasının neredeyse bilmediği gizli ve ince meseleler ile İslam beldelerindeki Müslümanların bilmekte ittifak ettiği, bilgisi dinden zarûrî olarak bilinen şeylerden olmuş ve bilgisi tevâtür hâline gelmiş zahir ve açık meseleler."], [1773.0, "Bunların bir hükmü, ötekilerin başka bir hükmü vardır."], [1783.2, "Taalluk ettikleri şey farklı olduğu için iki meseleyi eşit tutmak uygun değildir."], [1787.0, "Taalluklar farklı olunca hükümler de farklı olur;"], [1793.0, "bu, Allah Azze ve Celle'nin adaleti kabilindendir."]]}]}, {"ts": "30:00", "title": "Gizli ve zahir meseleler arasındaki fark; \"zuhûr\"dan kastedilen", "paras": [{"reader": false, "ar": [[1800.0, "وهذه الكلّيّة يريد الوعيديّةُ من الخوارج والمعتزلة أن يدفعوها؛"], [1807.0, "لمحبّتهم العظيمة للتكفير، لكنها تدفع تكفيرَهم وتردّه عليهم إذا وقع هذا الكفر في بلاد الإسلام في مسألةٍ خفيّةٍ دقيقة،"], [1824.0, "قد يجهلها أكثرُ الناس ولو في البلاد الإسلاميّة."], [1829.0, "فإذا كان الكفر أو الشرك الأكبر الذي ارتكبه الجاهل من المسائل الخفيّة التي يجهلها مثلُه،"], [1845.0, "فلا يكفر بها حتى تُقام عليه الحجّة."], [1851.0, "أمّا إذا كان الكفر الذي وقع فيه جاهلًا من المسائل الظاهرة في البلد الذي هو فيه،"], [1860.0, "ولا يخفى على مثله،"], [1862.0, "فلا يُعتبر هذا الجهلُ برافعٍ عنه حكمَ التكفير."]], "tr": [[1800.0, "Vaîdiyye'den olan Hâricîler ve Mu'tezile, tekfiri çok sevdikleri için bu külliyeyi defetmek isterler."], [1807.0, "Fakat bu küfür İslam beldelerinde, İslam beldelerinde bile insanların çoğunun bilmeyebileceği gizli ve ince bir meselede vuku bulursa, bu külliye onların tekfirini defeder ve onu kendilerine geri çevirir."], [1829.0, "Cahilin işlediği küfür ya da büyük şirk, onun gibisinin bilmediği gizli meselelerdense, kendisine hüccet ikame edilinceye kadar onunla kâfir olmaz."], [1851.0, "Fakat cahil olarak düştüğü küfür, içinde bulunduğu beldede zahir olan ve onun gibisine gizli kalmayan meselelerdense, bu cehalet ondan tekfir hükmünü kaldıran bir şey sayılmaz."]]}, {"reader": false, "ar": [[1868.0, "والمقصود بالظهور في الكلّيّة ليس ظهورَ الأدلّة ووضوحَها فقط،"], [1878.0, "وإنما المقصود بذلك ظهورُ العلم بها،"], [1882.0, "وانتشارُه بين الناس، واستفاضتُه بينهم؛"], [1887.0, "كظهور وجوب الصلاة الذي لا يكاد يخفى على أحدٍ من أهل الإسلام،"], [1892.0, "ووجوبِ الزكاة، وحرمةِ الزنا،"], [1895.0, "والذي يسمّيه أهل العلم:"], [1897.9, "المعلومَ من الدين بالضرورة."]], "tr": [[1868.0, "Külliyedeki \"zuhûr\"dan (zahir olmaktan) kastedilen sadece delillerin zahir ve açık olması değildir;"], [1878.0, "bundan kastedilen, onların bilgisinin zahir olması, insanlar arasında yayılması ve aralarında yaygınlaşmasıdır."], [1887.0, "İslam ehlinden hiç kimseye neredeyse gizli kalmayan namazın farziyetinin, zekâtın farziyetinin ve zinanın haramlığının zahir olması gibi."], [1895.0, "Ehl-i ilim buna \"dinden zarûrî olarak bilinen\" der."]]}]}, {"ts": "31:41", "title": "İmamların nakilleri: İbn Teymiyye", "paras": [{"reader": false, "ar": [[1901.0, "وقد نصّ الأئمّة على هذه الكلّيّة؛"], [1905.0, "قال الإمام ابن تيمية رحمه الله تعالى:"], [1909.0, "«ولهذا يكفر جاحدُ الأحكام الظاهرة المجمَع عليها وإن كان عامّيًّا، دون الخفيّة»."], [1917.0, "انتهى كلامه رحمه الله."], [1920.8, "وأُعيدها مرّةً أخرى: «ولهذا يكفر جاحد الأحكام الظاهرة المجمع عليها وإن كان عامّيًّا، دون الخفيّة»."], [1931.8, "انتهى كلامه رحمه الله."]], "tr": [[1901.0, "İmamlar bu külliyeyi açıkça belirtmişlerdir."], [1901.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [1905.0, "\"Bu yüzden üzerinde icmâ edilmiş zahir hükümleri inkâr eden, avamdan olsa bile kâfir olur;"], [1909.0, "gizli olanları (inkâr eden) değil.\" Sözü bitti, Allah ona rahmet etsin."], [1917.0, "Bir kez daha tekrar ediyorum:"], [1920.8, "\"Bu yüzden üzerinde icmâ edilmiş zahir hükümleri inkâr eden, avamdan olsa bile kâfir olur;"], [1920.8, "gizli olanları (inkâr eden) değil.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[1938.0, "وقال أيضًا في موضعٍ آخر:"], [1942.0, "«وذلك يقتضي وجودَ الردّة فيهم» ـ يعني:"], [1946.4, "طوائفَ من أهل الكلام ـ «كما يوجد النفاق فيهم كثيرًا. وهذا إذا كان في المقالات الخفيّة، قد يقال: إنه فيها مخطئٌ ضالّ لم تقم عليه الحجّة التي يكفر صاحبها، لكنّ ذلك يقع في طوائف منهم في الأمور الظاهرة التي تعلم العامّة والخاصّة من المسلمين أنها من دين المسلمين، بل اليهودُ والنصارى يعلمون أنّ محمدًا صلى الله عليه وسلم بُعث بها، وكفّر مخالفها؛ مثل أمره بعبادة الله عز وجل وحده لا شريك له» ـ هذا من الأمور الظاهرة ـ «ونهيِه عن عبادة أحدٍ سوى الله من الملائكة والنبيّين والشمس والقمر والكواكب والأصنام وغير ذلك؛ فإنّ هذا أظهرُ شرائع الإسلام."]], "tr": [[1938.0, "Yine başka bir yerde şöyle dedi:"], [1938.0, "\"Bu, onlarda\" —yani kelâm ehlinden bazı gruplarda— \"irtidadın bulunmasını gerektirir;"], [1946.4, "nitekim onlarda nifak da çokça bulunur."], [1946.4, "Bu, gizli görüşlerde olursa, onun bunlarda kendisine, sahibinin kâfir olduğu hüccet ikame edilmemiş, hata eden ve sapmış biri olduğu söylenebilir."], [1946.4, "Fakat bu, onlardan bazı gruplarda, Müslümanların avamının ve havâssının Müslümanların dininden olduğunu bildiği zahir işlerde vuku bulmaktadır;"], [1946.4, "hatta Yahudiler ve Hristiyanlar bile Muhammed ﷺ'in onlarla gönderildiğini ve onlara muhalefet edeni tekfir ettiğini bilirler."], [1946.4, "Mesela onun, ortağı olmayan tek Allah'a ibadeti emretmesi\" —bu zahir işlerdendir— \"ve meleklerden, peygamberlerden, güneşten, aydan, yıldızlardan, putlardan ve başka şeylerden, Allah'tan başka hiçbir kimseye ibadeti yasaklaması gibi."], [1946.4, "Çünkü bu, İslam'ın şeriatlerinin en zahir olanıdır."]]}, {"reader": false, "ar": [[2005.0, "ومثل أمره بالصلوات الخمس،"], [2007.0, "وإيجابِه لها، وتعظيمِ شأنها،"], [2009.0, "ومثل معاداته لليهود والنصارى والمشركين والصابئين والمجوس،"], [2014.0, "ومثل تحريم الفواحش والربا والخمر والميسر،"], [2018.0, "ونحو ذلك». انتهى كلامه؛"], [2020.0, "أي: المسائل الظاهرة؛ فإنه لا عذرَ لأحدٍ نشأ في بلاد المسلمين في أن نرفع عنه كفرًا وقع فيه،"], [2031.1, "إذا كانت المسألة ظاهرة،"], [2033.2, "والكفرُ بها والتكفيرُ بها ممّا يُعلم من الدين بالضرورة."]], "tr": [[2005.0, "Yine onun beş vakit namazı emretmesi, onu farz kılması ve şanını yüceltmesi;"], [2009.0, "Yahudilere, Hristiyanlara, müşriklere, Sâbiîlere ve Mecûsîlere düşmanlığı;"], [2009.0, "fuhşu, ribâyı, şarabı ve kumarı haram kılması ve benzerleri gibi.\" Sözü bitti."], [2018.0, "Yani zahir meseleler. Çünkü mesele zahir olduğunda, onunla küfür ve onunla tekfir dinden zarûrî olarak bilinen şeylerden olduğunda, Müslümanların beldelerinde yetişen hiç kimsenin, düştüğü bir küfrü ondan kaldırmamız için bir mazereti yoktur."]]}, {"reader": false, "ar": [[2038.0, "وقال ابن تيمية رحمه الله تعالى:"], [2042.0, "«ومن جحد وجوبَ بعض الواجبات الظاهرة المتواترة، كالصلوات الخمس، وصيام شهر رمضان، وحجّ البيت العتيق، أو جحد تحريمَ بعض المحرّمات الظاهرة المتواترة، كالفواحش والظلم والخمر والميسر والزنا وغير ذلك، أو جحد حِلَّ بعض المباحات الظاهرة المتواترة، كالخبز واللحم والنكاح، فهو كافرٌ مرتدّ، يُستتاب، فإن تاب وإلا قُتل. وإن أضمر ذلك كان زنديقًا منافقًا، لا يُستتاب عند أكثر العلماء، بل يُقتل بلا استتابةٍ إذا ظهر ذلك منه». انتهى كلامه."]], "tr": [[2038.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [2042.0, "\"Kim beş vakit namaz, Ramazan ayının orucu ve Beyt-i Atîk'in haccı gibi zahir ve mütevâtir vâciplerin bazısının vücubunu inkâr ederse;"], [2042.0, "ya da fuhşiyat, zulüm, şarap, kumar, zina ve benzerleri gibi zahir ve mütevâtir haramların bazısının haramlığını inkâr ederse;"], [2042.0, "ya da ekmek, et ve nikâh gibi zahir ve mütevâtir mubahların bazısının helalliğini inkâr ederse, o kâfir ve mürteddir;"], [2042.0, "tövbeye davet edilir; tövbe ederse (ne âlâ), yoksa öldürülür."], [2042.0, "Eğer bunu gizlerse zındık ve münafık olur;"], [2042.0, "âlimlerin çoğuna göre tövbeye davet edilmez;"], [2042.0, "bilakis bu kendisinden ortaya çıktığında tövbeye davet edilmeden öldürülür.\" Sözü bitti."]]}, {"reader": false, "ar": [[2088.0, "ووجهُ الشاهد منه: أنّ تقييده هذا التكفيرَ في الواجبات بقوله:"], [2093.4, "«الواجبات الظاهرة المتواترة»، وفي المحرّمات بقوله:"], [2096.5, "«المحرّمات الظاهرة المتواترة»، وفي المباحات بقوله:"], [2100.0, "«المباحات الظاهرة المتواترة»، دليلٌ على أنّ ما كان من ذلك خفيًّا دقيقًا فإنه لا يصحّ أن يُكفَّر به مسلم."]], "tr": [[2088.0, "Bundaki delil yönü şudur: Onun bu tekfiri vâciplerde \"zahir ve mütevâtir vâcipler\", haramlarda \"zahir ve mütevâtir haramlar\", mubahlarda da \"zahir ve mütevâtir mubahlar\" sözüyle kayıtlaması, bunlardan gizli ve ince olanla bir Müslüman'ın tekfir edilmesinin sahih olmadığına delildir."]]}]}, {"ts": "35:10", "title": "Şâfiî, Nevevî, Hattâbî ve Muhammed b. Abdilvehhâb'ın nakilleri", "paras": [{"reader": false, "ar": [[2110.0, "قال الإمام الشافعيّ رحمه الله ـ وانتبهوا لهذا النقل ـ:"], [2115.1, "«العلم علمان: علمُ عامّةٍ لا يسع بالغًا غيرَ مغلوبٍ على عقله جهلُه، مثل الصلوات الخمس، وأنّ لله على الناس صومَ شهر رمضان، وحجَّ البيت إذا استطاعوه، وزكاةً في أموالهم، وأنه حرّم عليهم الزنا والقتل والسرقة، وما كان في معنى هذا». انتهى كلامه."]], "tr": [[2110.0, "İmam Şâfiî —Allah ona rahmet etsin— şöyle dedi —bu nakle dikkat edin—:"], [2110.0, "\"İlim iki türlüdür: (Birincisi) avamın ilmidir;"], [2115.1, "aklı mağlup olmayan hiçbir bâliğin onu bilmemesine imkân yoktur."], [2115.1, "Beş vakit namaz, Allah'ın insanlar üzerinde Ramazan ayının orucu, güç yetirdiklerinde Beyt'in haccı ve mallarında zekât (hakkının) bulunması, onlara zinayı, adam öldürmeyi ve hırsızlığı haram kılması ve bu anlamda olan şeyler gibi.\" Sözü bitti."]]}, {"reader": false, "ar": [[2145.0, "وقال النوويّ رحمه الله تعالى عن المرتدّ،"], [2147.8, "قال: «وكذلك الأمر في كلّ من أنكر شيئًا ممّا أجمعت الأمّة عليه من أمور الدين إذا كان علمُه منتشرًا، كالصلوات الخمس، وصوم شهر رمضان، والاغتسال من الجنابة، وتحريم الزنا والخمر، ونكاح ذوات المحارم، ونحوها من الأحكام، إلا أن يكون رجلًا حديثَ عهدٍ بالإسلام»،"], [2169.0, "إلا أن يكون حديث عهدٍ بالإسلام؛"], [2173.0, "لأنه حينئذٍ جهلُه معجوزٌ عن رفعه."]], "tr": [[2145.0, "Nevevî —Allah ona rahmet etsin— mürted hakkında şöyle dedi:"], [2147.8, "\"Ümmetin üzerinde icmâ ettiği din işlerinden bir şeyi, bilgisi yaygın olduğu hâlde inkâr eden herkes hakkında da hüküm böyledir."], [2147.8, "Beş vakit namaz, Ramazan ayının orucu, cünüplükten dolayı gusül, zinanın ve şarabın haramlığı, mahrem kadınlarla evlenme(nin haramlığı) ve benzeri hükümler gibi."], [2147.8, "Ancak İslam'a yeni girmiş bir adam olması müstesna.\" Ancak İslam'a yeni girmiş olması müstesna;"], [2169.0, "çünkü bu durumda onun cehaletini gidermesi imkânsızdır."]]}, {"reader": false, "ar": [[2175.0, "وقال الإمام الخطّابيّ رحمه الله:"], [2178.0, "«من أنكر فرضَ الزكاة في هذا الزمان كان كافرًا بإجماع المسلمين، وكذلك الأمر في كلّ من أنكر شيئًا ممّا أجمعت الأمّة عليه من أمور الدين إذا كان علمُه منتشرًا، كالصلوات الخمس، وصوم شهر رمضان»،"], [2193.5, "إلى آخر كلامه رحمه الله."]], "tr": [[2175.0, "İmam Hattâbî —Allah ona rahmet etsin— şöyle dedi:"], [2178.0, "\"Bu zamanda zekâtın farziyetini inkâr eden kimse, Müslümanların icmâıyla kâfir olur."], [2178.0, "Ümmetin üzerinde icmâ ettiği din işlerinden bir şeyi, bilgisi yaygın olduğu hâlde inkâr eden herkes hakkında da hüküm böyledir;"], [2178.0, "beş vakit namaz ve Ramazan ayının orucu gibi.\" Sözünün sonuna kadar, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2196.0, "وقال الإمام محمد بن عبد الوهّاب رحمه الله تعالى:"], [2200.0, "«الشخص المعيَّن، الشخص المعيَّن، إذا قال ما يوجب الكفر، فإنه لا يُحكم بكفره حتى تقوم عليه الحجّة التي يكفر تاركها، وهذا في المسائل الخفيّة التي قد يخفى دليلُها على بعض الناس، وأمّا ما يقع منهم في المسائل الظاهرة الجليّة، أو ما يُعلم من الدين بالضرورة، فهذا لا يُتوقَّف في كفر قائله»."], [2232.0, "واضح ولّا مو واضح؟"], [2233.0, "انتهى كلامه رحمه الله."]], "tr": [[2196.0, "İmam Muhammed b. Abdilvehhâb —Allah ona rahmet etsin— şöyle dedi:"], [2196.0, "\"Belirli şahıs, belirli şahıs, küfrü gerektiren bir şey söylediğinde, terk edenin kâfir olduğu hüccet kendisine ikame edilinceye kadar kâfir olduğuna hükmedilmez."], [2200.0, "Bu, delili bazı insanlara gizli kalabilen gizli meselelerdedir."], [2200.0, "Onlardan zahir ve açık meselelerde ya da dinden zarûrî olarak bilinen şeylerde vuku bulana gelince, bunu söyleyenin küfründe tevakkuf edilmez (duraksanmaz).\" Açık mı, açık değil mi?"], [2232.0, "Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2235.0, "وقال رحمه الله تعالى أيضًا:"], [2238.0, "«إنّ الذي لم تقم عليه الحجّة هو الذي حديثُ عهدٍ بالإسلام، والذي نشأ ببادية بعيدة، أو يكون ذلك في مسألةٍ خفيّة مثل الصَّرف والعَطف، فلا يكفر حتى يُعرَّف. وأمّا أصول الدين التي أوضحها الله وأحكمها في كتابه، فإنّ حجّة الله هو القرآن، فمن بلغه القرآن فقد بلغته الحجّة». انتهى كلامه."]], "tr": [[2235.0, "Yine o —Allah ona rahmet etsin— şöyle dedi:"], [2238.0, "\"Kendisine hüccet ikame edilmemiş olan kimse, İslam'a yeni girmiş olan ve uzak bir çölde yetişmiş olan kimsedir;"], [2238.0, "ya da bu, sarf ve atf (sihir türleri) gibi gizli bir meselede olur."], [2238.0, "Böylesi kendisine bildirilinceye kadar kâfir olmaz."], [2238.0, "Allah'ın Kitabı'nda açıkladığı ve muhkem kıldığı dinin esaslarına gelince, Allah'ın hücceti Kur'an'dır;"], [2238.0, "kime Kur'an ulaşmışsa ona hüccet ulaşmıştır.\" Sözü bitti."]]}]}, {"ts": "37:48", "title": "Lecne-i Dâime ve İbn Bâz'ın fetvaları", "paras": [{"reader": false, "ar": [[2268.0, "وقال العلماء في «فتاوى اللجنة الدائمة» في المملكة العربيّة السعوديّة،"], [2273.0, "لمّا سُئلوا عن مثل هذه المسائل،"], [2277.0, "قالوا: «يختلف الحكم على الإنسان بأنه يُعذر بالجهل في المسائل الدينيّة أو لا يُعذر، باختلاف البلاغ وعدمه، وباختلاف المسألة نفسها وضوحًا وخفاءً، وتفاوتِ مدارك الناس قوّةً وضعفًا»."], [2294.0, "انتهى كلامهم رحمهم الله."]], "tr": [[2268.0, "Âlimler, Suudi Arabistan Krallığı'ndaki \"Lecne-i Dâime Fetvaları\"nda, bu gibi meseleler kendilerine sorulduğunda şöyle dediler:"], [2273.0, "\"İnsanın dinî meselelerde cehaletle mazur görüldüğü ya da görülmediği hükmü;"], [2277.0, "tebliğin bulunup bulunmamasına, meselenin kendisinin açıklık ve gizlilik bakımından farklılığına ve insanların idrak güçlerinin kuvvet ve zayıflık bakımından farklılığına göre değişir.\" Sözleri bitti, Allah onlara rahmet etsin."]]}, {"reader": false, "ar": [[2297.0, "ونختم هذه الكلّيّة بنقلٍ عظيمٍ عن الشيخ ابن باز رحمه الله تعالى،"], [2302.0, "قال: «الجهل يكون عذرًا فيما يمكن خفاؤه، وأمّا الأمور الظاهرة من الدين فلا يُعذر فيها الجاهل، كأمور التوحيد وأمور الصلاة. أمّا الذي يمكن جهلُه مثل بعض الصفات، صفات الله التي خفيت عليه، أو ما درى» ـ كذا نصُّه ـ «أو ما درى أنها من صفات الله فأنكرها، ثم عَلِم وبُيِّن له، ما يكفر بذلك؛ لأنّ مثل هذا قد يجهل بعض الصفات."]], "tr": [[2297.0, "Bu külliyeyi Şeyh İbn Bâz'dan —Allah ona rahmet etsin— büyük bir nakille bitiriyoruz."], [2297.0, "Şöyle dedi: \"Cehalet, gizli kalması mümkün olan şeylerde mazerettir."], [2302.0, "Dinin zahir işlerine gelince, tevhid işleri ve namaz işleri gibi, bunlarda cahil mazur görülmez."], [2302.0, "Bilinmemesi mümkün olana gelince, mesela bazı sıfatlar, kendisine gizli kalmış olan Allah'ın sıfatları;"], [2302.0, "ya da bilmedi\" —metni böyledir— \"ya da onların Allah'ın sıfatlarından olduğunu bilmedi ve onları inkâr etti, sonra öğrendi ve kendisine açıklandı;"], [2302.0, "bununla kâfir olmaz. Çünkü bunun gibisi bazı sıfatları bilmeyebilir."]]}, {"reader": false, "ar": [[2341.0, "أو مثل بعض حقوق النبيّ صلى الله عليه وسلم إذا جهلها،"], [2345.0, "ما درى عن بعض الحقوق التي تخفى على العامّة،"], [2348.0, "أو ما أشبه ذلك،"], [2350.0, "أو إنسانٌ في أطراف أمريكا،"], [2352.0, "أو أطراف أفريقيا، في بعض المحلّات البعيدة عن الإسلام،"], [2356.0, "مثلُ هذا كأهل الفترة،"], [2359.0, "يُبيَّن له، ولا يكفر حتى يُبيَّن له ويُعلَّم،"], [2363.0, "فإذا ما أصرّ على ذلك،"], [2366.0, "فإذا ما أصرّ على الكفر،"], [2368.0, "فإنه يُقتل». انتهى كلامه رحمه الله."]], "tr": [[2341.0, "Ya da Nebî ﷺ'in bazı haklarını bilmemesi gibi;"], [2341.0, "avama gizli kalan bazı hakları bilmedi;"], [2345.0, "ya da buna benzer şeyler."], [2345.0, "Ya da Amerika'nın uç bölgelerinde veya Afrika'nın uç bölgelerinde, İslam'dan uzak bazı yerlerde bulunan bir insan."], [2352.0, "Bunun gibisi fetret ehli gibidir;"], [2356.0, "ona açıklanır; kendisine açıklanıp öğretilinceye kadar kâfir olmaz."], [2363.0, "Eğer bunda ısrar ederse, küfürde ısrar ederse öldürülür.\" Sözü bitti, Allah ona rahmet etsin."]]}]}, {"ts": "39:31", "title": "Tembih: Zuhûr ve hafâ nispîdir; gelecek dersin külliyesi", "paras": [{"reader": false, "ar": [[2371.0, "وقبل أن أختم هذه الكلّيّة أريد أن أنبّه على تنبيهٍ لطيف:"], [2375.0, "وهي أنّ مسألة الظهور والخفاء مسألةٌ نسبيّة،"], [2378.2, "تتفاوت باعتبار الأشخاص، واعتبار قدراتهم العقليّة وفهمهم وملكاتهم الفرديّة."], [2385.0, "وتختلف كذلك باختلاف المكان؛"], [2387.0, "فمن الأمكنة ما يكون بعضُ العلم فيها من العلوم المتواترة،"], [2392.0, "بينما نفسُ هذا العلم يكون في أماكن أخرى من الأمور الخفيّة الدقيقة التي قد لا يعلم بها إلا خواصُّ أهل هذه البلاد."]], "tr": [[2371.0, "Bu külliyeyi bitirmeden önce ince bir hususa dikkat çekmek istiyorum:"], [2371.0, "Zuhûr (zahir olma) ve hafâ (gizli olma) meselesi nispî bir meseledir;"], [2378.2, "kişilere, onların akıl kapasitelerine, anlayışlarına ve ferdî melekelerine göre farklılık gösterir."], [2385.0, "Aynı şekilde mekânın farklılığıyla da değişir:"], [2387.0, "Öyle mekânlar vardır ki bazı ilimler oralarda mütevâtir ilimlerdendir;"], [2392.0, "oysa aynı ilim başka yerlerde, o beldelerin havâssından başkasının bilmeyebileceği gizli ve ince işlerdendir."]]}, {"reader": false, "ar": [[2401.0, "ويختلف كذلك باختلاف الزمن؛"], [2404.0, "فالزمن الذي
