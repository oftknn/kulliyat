<script>
const D={"no": 13, "vid": "_7y_bxc1D4Y", "title_ar": "الدرس (١٣) من شرح كليات العقيدة — تابع: كليات في توحيد الربوبية", "title_tr": "Şerhu Külliyyâti'l-Akîde — 13. Ders: Rubûbiyyet Tevhidine Dair Külliyeler (Kevnî Fiillere Sövmek, İstiâze, Dehre Sövmek)", "sections": [{"ts": "00:00", "title": "1. Külliye: Allah'ın salt kevnî fiilinden olan hiçbir şeye sövmek caiz değildir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.1, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.2, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.9, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [11.0, "أمّا بعد: فلا نزال ـ ولله الحمد ـ في سياق شرح كلّيّات باب الربوبية،"], [17.3, "وعندنا اليوم ستُّ كلّيّاتٍ تتعلّق بهذا الباب."], [21.0, "الكلّيّة الأولى: <b>كلُّ ما كان من فعل الله الكونيِّ المحض فلا يجوز سبُّه.<\/b> كلُّ ما كان من قبيل فعل الله الكوني المحض فلا يجوز سبُّه. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.1, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.1, "Bundan sonra: Allah'a hamd olsun, hâlâ rubûbiyyet babının külliyelerinin şerhi bağlamındayız."], [17.3, "Bugün bu babla ilgili altı külliyemiz var."], [21.0, "Birinci külliye: <b>1. külliye: Allah'ın salt kevnî fiilinden olan hiçbir şeye sövmek caiz değildir.<\/b> Allah'ın salt kevnî fiili kabilinden olan hiçbir şeye sövmek caiz değildir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[46.0, "أقول وبالله التوفيق: وذلك لأنّ سبَّه سبٌّ لله عز وجل؛"], [53.0, "لأنّ المتقرِّر في القواعد أنّ سبَّ الصنعة سبٌّ لصانعها،"], [60.0, "والله عز وجل هو الذي خلق هذه الأمور الكونية القدرية التي تجري على عباده في أرضه،"], [67.0, "فلا يجوز للإنسان أبدًا أن يسبّ شيئًا منها بأيّ نوعٍ من أنواع السبّ."], [73.0, "ولأنّ سبَّه لها سبٌّ لمن لا يستحقّ أن يُسبّ،"], [82.0, "والمتقرِّر في القواعد أنّ كلَّ من سبّ من لا يستحقّ السبَّ فسبُّه يرجع عليه."]], "tr": [[46.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, ona sövmenin Allah Azze ve Celle'ye sövmek olmasıdır."], [50.9, "Çünkü kaidelerde yerleşik olan şudur:"], [53.0, "Sanata sövmek, onun sanatkârına sövmektir."], [56.6, "Allah Azze ve Celle, yeryüzünde kullarının üzerinde cereyan eden bu kevnî ve kaderî işleri yaratandır;"], [65.7, "bu yüzden insanın bunlardan herhangi birine, sövme türlerinden herhangi biriyle asla sövmesi caiz değildir."], [73.0, "Bir de onlara sövmesi, sövülmeyi hak etmeyen bir şeye sövmektir;"], [82.5, "kaidelerde yerleşik olan şudur: Sövülmeyi hak etmeyene söven herkesin sövgüsü kendisine döner."]]}, {"reader": false, "ar": [[89.0, "ولأنه في الأعمّ الأغلب إنما سبّ هذا الأمرَ الكونيَّ المحض معتقدًا أنّ لهذا الأمر الكوني تدبيرًا أو تصريفًا،"], [100.0, "إمّا استقلالًا أو سببيّة،"], [104.0, "وكلُّ ذلك مما يُفضي بالعبد إلى مهاوي الردى وفساد الاعتقاد."], [110.0, "فلا يجوز للإنسان أن يعمِد إلى سبّ شيءٍ من الأمور الكونية المحضة أبدًا."]], "tr": [[89.0, "Bir de (insan) çoğunlukla bu salt kevnî işe, bu kevnî işin bir tedbiri (idaresi) veya tasarrufu olduğuna —ya bağımsız olarak ya da sebep olarak— inanarak söver."], [104.6, "Bütün bunlar kulu helâk uçurumlarına ve itikadın bozulmasına götürür."], [110.0, "Dolayısıyla insanın salt kevnî işlerden herhangi birine sövmeye asla yeltenmesi caiz değildir."]]}, {"reader": false, "ar": [[117.0, "وبرهانُ هذه الكلّيّة عدّةُ أمور:"], [122.0, "منها ما ورد في السنة الصحيحة من النهي عن سبّ الدهر؛"], [127.0, "فإنّ الدهر ـ وهو مجموع الأيام والليالي والسنوات والشهور ـ إنما هو من فعل الله عز وجل المحض،"], [136.0, "وذلك لأنّ الله عز وجل هو الذي يقلّب الليل والنهار،"], [141.0, "ويدبّر ما فيهما من الشؤون والأحوال."], [144.0, "فلا يجوز للإنسان أن يسبّ الدهر بأيّ لفظةٍ من ألفاظ السبّ،"], [148.9, "كما سيأتينا في كلّيّةٍ خاصّةٍ إن شاء الله تعالى."], [153.0, "وفي الصحيحين من حديث أبي هريرة رضي الله عنه قال:"], [158.6, "قال النبي صلى الله عليه وسلم:"], [162.5, "«لا تسبّوا الدهر؛ فإنّ الله هو الدهر»."]], "tr": [[117.0, "Bu külliyenin delili birkaç şeydir."], [122.0, "Bunlardan biri, sahih sünnette dehre (zamana) sövmenin yasaklanmasıyla ilgili gelen rivayettir."], [127.0, "Çünkü dehr —ki günlerin, gecelerin, yılların ve ayların toplamıdır— ancak Allah Azze ve Celle'nin salt fiilindendir."], [135.2, "Bunun sebebi, geceyi ve gündüzü evirip çeviren ve ikisinde bulunan işleri ve hâlleri idare edenin Allah Azze ve Celle olmasıdır."], [144.0, "Dolayısıyla insanın, sövme lafızlarından herhangi biriyle dehre sövmesi caiz değildir;"], [148.9, "inşallah buna dair müstakil bir külliye gelecek."], [153.0, "Sahîhayn'da Ebû Hüreyre (radıyallahu anh) hadisinde şöyle der:"], [158.6, "Nebî ﷺ buyurdu: «Dehre sövmeyin; çünkü dehr Allah'tır.»"]]}, {"reader": false, "ar": [[167.0, "فإن قلتَ: ولماذا نهانا عن سبّه؟"], [170.7, "فنقول: لأنّ جريان الأيام والأسابيع والشهور والأعوام إنما هي من أمر الله الكوني المحض الذي لا تدخُّلَ لأحدٍ من المخلوقين فيه،"], [181.0, "فسبُّ الدهر يرجع إلى سبّ الله عز وجل."], [184.0, "وفي الصحيح يقول النبي صلى الله عليه وسلم فيما يرويه عن ربه عز وجل:"], [192.1, "«يؤذيني ابنُ آدم، يسبّ الدهر وأنا الدهر، بيدي الأمر، أقلّب الليل والنهار»."]], "tr": [[167.0, "\"Neden bizi ona sövmekten nehyetti?\" dersen, deriz ki:"], [170.7, "Çünkü günlerin, haftaların, ayların ve yılların akışı, mahlûklardan hiçbirinin müdahalesinin olmadığı, Allah'ın salt kevnî emrindendir."], [179.7, "Dolayısıyla dehre sövmek, Allah Azze ve Celle'ye sövmeye varır."], [184.0, "Sahîh'te Nebî ﷺ, Rabbi Azze ve Celle'den rivayet ettiği (kudsî hadiste) şöyle buyurur:"], [189.7, "«Âdemoğlu bana eziyet ediyor; dehre sövüyor. Hâlbuki dehr benim; iş benim elimdedir, geceyi ve gündüzü ben evirip çeviririm.»"]]}, {"reader": false, "ar": [[201.0, "ومن جملة ما يُستدلّ به على هذه الكلّيّة:"], [205.6, "الأحاديثُ التي تنهى عن سبّ الريح؛"], [209.0, "فإنّ الريح من أمر الله الكوني المحض،"], [213.0, "فلا يجوز أن تُسبّ الريح مهما كانت عاتيةً أو صرصرًا أو مدمِّرة،"], [221.0, "فإنها إنما أُرسلت بأمر الله عز وجل."], [225.0, "وفي الحديث عن أبي هريرة رضي الله عنه قال:"], [229.4, "قال النبي صلى الله عليه وسلم:"], [232.0, "«الريح من رَوْح الله، فإذا رأيتم فلا تسبّوها، وسلوا الله خيرها، واستعيذوا به من شرّها»."]], "tr": [[201.0, "Bu külliyeye delil getirilen şeylerden biri de rüzgâra sövmeyi yasaklayan hadislerdir."], [205.6, "Çünkü rüzgâr Allah'ın salt kevnî emrindendir;"], [209.0, "ne kadar şiddetli, dondurucu ya da yıkıcı olursa olsun rüzgâra sövmek caiz değildir."], [218.5, "Çünkü o ancak Allah Azze ve Celle'nin emriyle gönderilmiştir."], [225.0, "Ebû Hüreyre (radıyallahu anh) hadisinde şöyle der:"], [229.4, "Nebî ﷺ buyurdu: «Rüzgâr Allah'ın rahmetindendir. (Onu) gördüğünüzde ona sövmeyin; Allah'tan onun hayrını isteyin ve onun şerrinden O'na sığının.»"]]}, {"reader": false, "ar": [[244.0, "وفي حديث أُبيّ بن كعب رضي الله عنه قال:"], [248.5, "قال النبي صلى الله عليه وسلم:"], [251.5, "«لا تسبّوا الريح، فإذا رأيتم ما تكرهون فقولوا: اللهم إنا نسألك خيرَ هذه الريح، وخيرَ ما فيها، وخيرَ ما أُرسلت به، ونعوذ بك من شرّ هذه الريح، ومن شرّ ما فيها، ومن شرّ ما أُرسلت به»."], [270.0, "فنهى الشارع عن سبّ الريح لأنّ الريح من أمر الله الكوني المحض،"], [277.0, "فأخذنا من ذلك هذه الكلّيّة."]], "tr": [[244.0, "Übey b. Ka'b (radıyallahu anh) hadisinde şöyle der:"], [248.5, "Nebî ﷺ buyurdu: «Rüzgâra sövmeyin. Hoşlanmadığınız bir şey gördüğünüzde şöyle deyin: Allah'ım! Senden bu rüzgârın hayrını, içindekinin hayrını ve onunla gönderilen şeyin hayrını isteriz; bu rüzgârın şerrinden, içindekinin şerrinden ve onunla gönderilen şeyin şerrinden de sana sığınırız.» Şâri' rüzgâra sövmeyi yasakladı;"], [270.0, "çünkü rüzgâr Allah'ın salt kevnî emrindendir."], [274.7, "Biz de bu külliyeyi buradan aldık."]]}, {"reader": false, "ar": [[281.0, "ومما يُستدلّ به عليها أيضًا:"], [284.0, "النهيُ عن سبّ الوباء والأمراض؛"], [287.0, "فقد ثبت عن النبي صلى الله عليه وسلم أنه نهى عن سبّ الحُمّى،"], [293.0, "لا لأنها حُمّى، وإنما لأنها من أمر الله الكوني المحض."]], "tr": [[281.0, "Buna delil getirilen şeylerden biri de salgına ve hastalıklara sövmenin yasaklanmasıdır."], [287.0, "Nebî ﷺ'den sabit olmuştur ki o, sıtmaya (ateşli hastalığa) sövmeyi yasaklamıştır;"], [292.1, "sıtma olduğu için değil, ancak Allah'ın salt kevnî emrinden olduğu için."]]}]}, {"ts": "05:02", "title": "1. Külliye (devam): Sıtma hadisleri; afetlere ve hastalıklara sövmek", "paras": [{"reader": false, "ar": [[302.0, "فيدخل في ذلك كلُّ مرضٍ،"], [304.5, "فلا يجوز سبُّه. ففي صحيح الإمام مسلمٍ من حديث جابرٍ رضي الله عنه قال:"], [311.5, "دخل النبي صلى الله عليه وسلم على أمّ السائب فقال:"], [316.7, "«يا أمَّ السائب، ما لكِ تُزَفْزِفين؟» قالت:"], [321.5, "الحُمّى، لا بارك الله فيها."], [324.0, "فقال: «لا تسبّي الحمّى؛ فإنها تُذهب خطايا بني آدم كما يُذهب الكيرُ خبثَ الحديد»."]], "tr": [[302.0, "Her hastalık buna girer; ona sövmek caiz değildir."], [306.0, "İmam Müslim'in Sahîh'inde Câbir (radıyallahu anh) hadisinde şöyle der:"], [310.5, "Nebî ﷺ Ümmü's-Sâib'in yanına girdi ve «Ey Ümmü's-Sâib! Neyin var, titriyorsun?» dedi."], [316.7, "O da: \"Sıtma; Allah onu bereketsiz kılsın!\" dedi."], [321.5, "Bunun üzerine Nebî ﷺ: «Sıtmaya sövme; çünkü o, körüğün demirin pasını gidermesi gibi Âdemoğullarının hatalarını giderir» buyurdu."]]}, {"reader": false, "ar": [[333.0, "وكذلك أيضًا في السنن أنّ النبي صلى الله عليه وسلم قال..."], [340.4, "«لُعِنت الحمّى» ـ قال: ذُكرت الحمّى عند رسول الله صلى الله عليه وسلم فسبّها رجل،"], [350.0, "فقال النبي صلى الله عليه وسلم:"], [353.9, "«لا تسبّها؛ فإنها تُذهب الخطايا كما تُذهب النارُ خبثَ الحديد» أو كما قال صلى الله عليه وسلم."], [367.0, "فأخذنا من ذلك أنّ كلَّ ما كان من أمر الله الكوني المحض فإنه لا يجوز أبدًا سبُّه."]], "tr": [[333.0, "Aynı şekilde Sünen'lerde de Nebî ﷺ'in şöyle dediği..."], [340.4, "«Sıtma lanetlendi» —(ravi) dedi ki:"], [345.3, "Resûlullah ﷺ'in yanında sıtma anıldı, bir adam ona sövdü."], [353.9, "Nebî ﷺ de: «Ona sövme; çünkü o, ateşin demirin pasını gidermesi gibi hataları giderir» buyurdu;"], [367.0, "ya da Nebî ﷺ'in dediği gibi."], [369.6, "Buradan şunu aldık: Allah'ın salt kevnî emrinden olan hiçbir şeye asla sövmek caiz değildir."]]}, {"reader": false, "ar": [[376.0, "وبناءً على ذلك: فلا يجوز سبُّ البرد الشديد لأنه من فعل الله الكوني المحض،"], [384.0, "ولا يجوز سبُّ الحرّ الشديد لأنه من فعل الله الكوني المحض،"], [390.0, "ولا يجوز سبُّ الأعاصير المدمِّرة لأنها من فعل الله الكوني المحض،"], [396.0, "ولا يجوز سبُّ البراكين المُحرِقة للحرث والنسل لأنها من أمر الله الكوني المحض،"], [405.0, "ولا يجوز سبُّ الفيضانات المُغرِقة المُهلِكة لأنها من فعل الله الكوني المحض،"], [412.0, "ولا يجوز سبُّ الزلازل لأنها من فعل الله الكوني المحض."]], "tr": [[376.0, "Buna göre: Şiddetli soğuğa sövmek caiz değildir, çünkü o Allah'ın salt kevnî fiilindendir."], [376.6, "Şiddetli sıcağa sövmek caiz değildir, çünkü o Allah'ın salt kevnî fiilindendir."], [377.1, "Yıkıcı kasırgalara sövmek caiz değildir, çünkü onlar Allah'ın salt kevnî fiilindendir."], [377.7, "Ekini ve nesli yakan yanardağlara sövmek caiz değildir, çünkü onlar Allah'ın salt kevnî emrindendir."], [391.1, "Boğan ve helâk eden su baskınlarına sövmek caiz değildir, çünkü onlar Allah'ın salt kevnî fiilindendir."], [407.7, "Depremlere sövmek caiz değildir, çünkü onlar Allah'ın salt kevnî fiilindendir."]]}, {"reader": false, "ar": [[418.0, "ولا يجوز كذلك سبُّ المطر وإن كان مدمِّرًا مُغرِقًا مُهلِكًا شديدًا،"], [424.0, "لأنه من فعل الله الكوني المحض،"], [428.0, "ولا سبُّ السيول التي تدمّر المنازل وتُهلك النفوس،"], [433.0, "لأنها من أمر الله الكوني المحض،"], [436.0, "ولا سبُّ الأوبئة والأمراض وإن هلك بها ملايينُ من البشر،"], [442.0, "لأنها من أمر الله الكوني المحض."], [447.0, "ولعلّ الكلّيّة واضحةٌ ولا إشكال فيها إن شاء الله، والله أعلم."]], "tr": [[418.0, "Aynı şekilde yağmura —yıkıcı, boğucu, helâk edici ve şiddetli olsa bile— sövmek caiz değildir, çünkü o Allah'ın salt kevnî fiilindendir."], [427.3, "Evleri yıkan ve canları helâk eden sellere de (sövmek caiz değildir), çünkü onlar Allah'ın salt kevnî emrindendir."], [436.0, "Salgınlara ve hastalıklara da —onlarla milyonlarca insan helâk olsa bile— (sövmek caiz değildir), çünkü onlar Allah'ın salt kevnî emrindendir."], [447.0, "Umarım külliye açıktır ve inşallah onda bir müşkil yoktur. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[452.0, "فإن قلتَ: وما حكم وصف بعض الأمراض بأنه خبيث؟"], [457.0, "الجواب: لا يجوز هذا،"], [460.0, "لأنه من سبّ هذا المرض،"], [463.0, "والمرض إنما ينزل قدرًا كونيًّا من الله على العبد لا باختياره؛"], [469.0, "فالأمراض من أمر الله الكوني المحض،"], [472.3, "فلا يجوز وصفها بأنها خبيثة."], [475.0, "فما يجري على ألسنة كثيرٍ من الناس بوصف السرطان بأنه «المرض الخبيث» هذا لا يجوز،"], [484.7, "وإنما يقال: المهلك، الخطير،"], [487.0, "ونحو ذلك من الألفاظ التي لا توجب سبَّه. والله أعلم."]], "tr": [[452.0, "\"Bazı hastalıkları 'habis (kötü)' diye nitelemenin hükmü nedir?\" dersen, cevap:"], [457.0, "Bu caiz değildir; çünkü bu, o hastalığa sövmektir."], [462.4, "Hastalık, kulun seçimiyle değil, Allah'tan kula kevnî bir kader olarak iner."], [469.0, "Hastalıklar Allah'ın salt kevnî emrindendir;"], [471.7, "onları habis diye nitelemek caiz değildir."], [475.0, "Birçok insanın dilinde dolaşan, kanseri \"habis hastalık\" diye nitelemek caiz değildir."], [482.3, "Bunun yerine \"helâk edici\", \"tehlikeli\" ve ona sövmeyi gerektirmeyen benzeri lafızlar söylenir. Allah en iyisini bilir."]]}]}, {"ts": "08:12", "title": "2. Külliye: Zararından korkulan her kevnî işten istiâze meşrudur", "paras": [{"reader": false, "ar": [[492.0, "ومن الكلّيّات أيضًا: <b>كلُّ أمرٍ كونيٍّ مَخُوفٍ ضررُه فتُشرع الاستعاذةُ منه.<\/b> هذا هو المَخرج."], [494.1, "كلُّ أمرٍ كونيٍّ مخوفٍ ضررُه فتُشرع الاستعاذة منه."], [503.0, "أقول وبالله التوفيق: وذلك لأنّ الاستعاذة من هذا الأمر الكوني المخوف هي التي أمر بها الشارع عند وجود شيءٍ منه،"], [533.0, "والاستعاذةُ منه لا تتنافى مع كمال إيماننا بأنه جرى علينا بكمال قضاء الله ـ بمحض قضاء الله وقدره ـ؛"], [542.0, "فالذي خلقه وأجراه في كونه هو الذي أمرنا بأن نستعيذ منه."]], "tr": [[492.0, "Külliyelerden biri de şudur: 2."], [493.4, "külliye: Zararından korkulan her kevnî işten (Allah'a) sığınmak (istiâze) meşrudur. Çıkış yolu budur."], [495.5, "(Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [503.0, "Bunun sebebi, bu korkulan kevnî işten istiâzenin, ondan bir şey meydana geldiğinde Şâri'in emrettiği şey olmasıdır."], [531.2, "Ondan istiâze etmek, onun Allah'ın kazasının kemaliyle —Allah'ın salt kaza ve kaderiyle— başımıza geldiğine olan imanımızın kemaline aykırı değildir."], [542.0, "Onu yaratan ve kâinatında cereyan ettiren, bize ondan sığınmamızı emredendir."]]}, {"reader": false, "ar": [[549.0, "كالاستعاذة من الريح المخوف ضررها،"], [553.0, "لقول النبي صلى الله عليه وسلم:"], [556.0, "«فإذا رأيتم منها ما تكرهون فسلوا الله خيرها واستعيذوا به من شرّها»."], [565.0, "وكالسحاب إذا أقبل على البلد وكان هائلًا مَخُوفًا،"], [571.0, "فإنه لا بأس للعبد أن يستعيذ بالله من شرّه وضرره،"], [576.0, "كما في حديث عائشة رضي الله عنها قالت:"], [579.0, "كان النبي صلى الله عليه وسلم إذا رأى عارضًا ـ تعني سحابًا ـ ترك ما في يده وأقبل عليه وقال:"], [588.0, "«اللهم إني أعوذ بك من هذا»،"], [591.0, "فإن أمطر حمد الله،"], [593.8, "وإن صرفه الله حمد الله."], [597.4, "رضي الله تعالى عنها."]], "tr": [[549.0, "Zararından korkulan rüzgârdan istiâze gibi;"], [553.0, "çünkü Nebî ﷺ şöyle buyurmuştur:"], [556.0, "«Ondan hoşlanmadığınız bir şey gördüğünüzde Allah'tan onun hayrını isteyin ve onun şerrinden O'na sığının.» Ve beldeye yönelen, korkunç ve korkutucu olan bulut gibi;"], [574.0, "kulun onun şerrinden ve zararından Allah'a sığınmasında bir sakınca yoktur."], [579.0, "Nitekim Âişe (radıyallahu anhâ) hadisinde şöyle der:"], [581.7, "Nebî ﷺ bir \"ârız\" —bulutu kastediyor— gördüğünde elindekini bırakır, ona yönelir ve «Allah'ım! Bunun (şerrinden) sana sığınırım» derdi."], [588.0, "Yağmur yağdırırsa Allah'a hamd ederdi;"], [590.5, "Allah onu (başka yere) çevirirse yine Allah'a hamd ederdi. Allah ondan razı olsun."]]}]}, {"ts": "10:00", "title": "2. Külliye (devam): Hastalıktan, nimetin zevalinden, ihtiyarlıktan ve mahlûkatın şerrinden istiâze", "paras": [{"reader": false, "ar": [[600.0, "وكالاستعاذة من الأمراض والأوبئة وسيّئ الأسقام،"], [610.0, "كما في الحديث عن النبي صلى الله عليه وسلم أنه كان يقول:"], [616.0, "«اللهم إني أعوذ بك من البَرَص، والجنون، والجُذام، وسيّئ الأسقام»."], [627.0, "فهذا هو المشروع للمسلم."], [629.0, "فهذه الكلّيّة إنما تبيّن لك المشروعَ لك عند وجود هذا الأمر الكوني الذي هو من فعل الله إذا كان مَخُوفًا،"], [639.0, "وأمّا سبُّه وشتمه والتسخّط عليه فإنّ ذلك عليك لا لك،"], [645.0, "فهذا مما يُسخط اللهَ عز وجل عليك."]], "tr": [[600.0, "Hastalıklardan, salgınlardan ve kötü illetlerden istiâze gibi."], [611.1, "Nitekim Nebî ﷺ'den gelen hadiste o şöyle derdi:"], [616.0, "«Allah'ım! Alacalıktan, delilikten, cüzzamdan ve kötü hastalıklardan sana sığınırım.» Müslüman için meşru olan budur."], [629.0, "Bu külliye, Allah'ın fiilinden olan bu kevnî iş —korkutucu ise— meydana geldiğinde senin için meşru olanı açıklar."], [637.6, "Ona sövmek, onu kötülemek ve ona öfkelenmek ise senin lehine değil aleyhinedir;"], [644.4, "bu, Allah Azze ve Celle'yi sana öfkelendiren şeylerdendir."]]}, {"reader": false, "ar": [[648.0, "وكذلك في حديث عثمان بن أبي العاص قال:"], [653.6, "قلتُ: يا رسول الله،"], [656.0, "إني أجد وجعًا في جسدي،"], [659.0, "فقال: «ضع يدك على الذي تألّم من جسدك، وقل: بسم الله ثلاثًا، ثم قل سبع مرات: أعوذ بعزّة الله وقدرته من شرّ ما أجد وأُحاذر»."], [674.0, "فهذا استعاذةٌ من أمرٍ كونيٍّ مخوفٍ ضررُه."]], "tr": [[648.0, "Aynı şekilde Osman b. Ebi'l-Âs hadisinde şöyle der:"], [653.6, "\"Ey Allah'ın Resûlü! Bedenimde bir ağrı hissediyorum\" dedim."], [659.6, "Buyurdu ki: «Elini bedeninin ağrıyan yerine koy ve üç kere 'Bismillâh' de; sonra yedi kere 'Hissettiğim ve çekindiğim şeyin şerrinden Allah'ın izzetine ve kudretine sığınırım' de.» Bu, zararından korkulan kevnî bir işten istiâzedir."]]}, {"reader": false, "ar": [[680.0, "وكالاستعاذة من زوال النعمة ـ وزوالُها أمرٌ كونيٌّ قدري ـ،"], [686.0, "والاستعاذة بالله من تحوُّل العافية ـ وتحوُّلها أمرٌ كونيٌّ قدري ـ،"], [694.0, "والاستعاذة بالله من فُجاءة النقمة ـ وهو أمرٌ كونيٌّ قدري ـ."], [701.0, "ففي حديث ابن عمر قال:"], [703.9, "كان النبي صلى الله عليه وسلم يقول:"], [708.0, "«اللهم إني أعوذ بك من زوال نعمتك، وتحوُّل عافيتك، وفُجاءة نقمتك، وجميع سخطك»."], [719.0, "ومن ذلك التعوّذ من الفقر والعجز والكسل،"], [723.8, "وكلُّها من الأمور الكونية القدرية."]], "tr": [[680.0, "Nimetin zevalinden istiâze gibi —onun zevali kevnî ve kaderî bir iştir—;"], [688.8, "âfiyetin değişmesinden Allah'a sığınmak gibi —onun değişmesi kevnî ve kaderî bir iştir—;"], [701.0, "azabın ansızın gelmesinden Allah'a sığınmak gibi —bu da kevnî ve kaderî bir iştir—."], [705.7, "İbn Ömer hadisinde şöyle der:"], [708.0, "Nebî ﷺ şöyle derdi: «Allah'ım! Nimetinin zevalinden, âfiyetinin değişmesinden, azabının ansızın gelmesinden ve bütün öfkenden sana sığınırım.» Fakirlikten, acizlikten ve tembellikten istiâze de bundandır;"], [723.8, "bunların hepsi kevnî ve kaderî işlerdendir."]]}, {"reader": false, "ar": [[730.0, "بل ويُشرع الاستعاذة من الهَرَم،"], [733.0, "وهو كِبَرُ السنّ كِبَرًا يُخرج الإنسان عن دائرة التكليف والعقل،"], [739.0, "كما قال الله عز وجل:"], [741.5, "<span class=\"ayah\">﴿وَمِنكُم مَّن يُرَدُّ إِلَىٰ أَرْذَلِ الْعُمُرِ لِكَيْلَا يَعْلَمَ مِن بَعْدِ عِلْمٍ شَيْئًا﴾<\/span> <span class=\"ref\">[الحج: ٥]<\/span>."], [748.0, "فممّا حُفظ عن النبي صلى الله عليه وسلم أنه كان يستعيذ من الهرم حتى لا يبلغ هذه السنّ،"], [756.0, "وتُوفّي صلى الله عليه وسلم وعمره ثلاثٌ وستون سنة،"], [762.0, "أي قبل سنّ الهرم،"], [764.0, "مع أنّ الهرم أمرٌ كونيٌّ،"], [767.5, "لكنه مَخُوفٌ ضررُه في الدين والدنيا."], [772.0, "فكلُّ ذلك مما يُشرع الاستعاذة منه."]], "tr": [[730.0, "Hatta ihtiyarlıktan (heremden) istiâze etmek de meşrudur."], [733.6, "Herem; insanı teklif ve akıl dairesinin dışına çıkaran yaşlılıktır."], [737.8, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [741.5, "<span class=\"ayah\">﴿Kiminiz de bildikten sonra hiçbir şey bilmez hâle gelsin diye ömrün en düşkün çağına döndürülür﴾<\/span> [Hac 5]."], [748.0, "Nebî ﷺ'den korunan (rivayetlerden) biri, bu yaşa ulaşmamak için heremden istiâze etmesidir."], [754.2, "Nebî ﷺ altmış üç yaşında, yani herem yaşından önce vefat etti."], [761.3, "Herem kevnî bir iş olmakla birlikte, dinde ve dünyada zararından korkulan bir şeydir."], [772.0, "Bütün bunlar istiâzenin meşru olduğu şeylerdendir."]]}, {"reader": false, "ar": [[777.0, "بل إنه يُشرع الاستعاذة من شرّ المخلوقات على وجه العموم والإجمال،"], [782.0, "أيًّا كانت، سواءً من شرّ المخلوقات العُلوية أو السُّفلية،"], [787.9, "أو القريبة أو البعيدة،"], [790.6, "أو الناطقة أو البهيمة؛"], [795.0, "كلُّ ذلك مما يُشرع الاستعاذة منه،"], [798.0, "كما قال الله عز وجل:"], [800.7, "<span class=\"ayah\">﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِن شَرِّ مَا خَلَقَ﴾<\/span> <span class=\"ref\">[الفلق: ١–٢]<\/span>."]], "tr": [[777.0, "Hatta genel ve toptan olarak mahlûkatın şerrinden —hangisi olursa olsun— istiâze etmek meşrudur;"], [782.0, "ister yüce ister aşağı âlemdeki mahlûkatın, ister yakın ister uzak olanların, ister konuşan ister hayvan olanların şerrinden olsun."], [795.0, "Bunların hepsi istiâzenin meşru olduğu şeylerdendir."], [797.5, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [800.7, "<span class=\"ayah\">﴿De ki: Sabahın Rabbine sığınırım, yarattığı şeylerin şerrinden﴾<\/span> [Felak 1–2]."]]}, {"reader": false, "ar": [[805.0, "والخلاصة من هذه الكلّيّة:"], [807.0, "أنها تُبصِّر المسلمَ العاقل ما الذي يجب عليه عند ورود شيءٍ من هذه الأمور الكونية المخوف ضررُها؛"], [816.0, "فلا ينبغي أن يشتغل بما ليس..."], [819.3, "بما هو حرامٌ من السبّ والشتم والتقبيح واللعن،"], [825.0, "وإنما يشتغل بالمشروع، وهو الاستعاذة بالله منها."]], "tr": [[805.0, "Bu külliyenin özeti şudur: O, akıllı Müslümana, zararından korkulan bu kevnî işlerden biri geldiğinde kendisine düşenin ne olduğunu gösterir."], [816.0, "(Müslüman) olmayan... haram olan sövme, kötüleme, çirkin gösterme ve lanet etme ile uğraşmamalı;"], [824.2, "ancak meşru olanla, yani onlardan Allah'a sığınmakla uğraşmalıdır."]]}]}, {"ts": "13:51", "title": "3. Külliye: Dehre sövmeyi içeren her lafız haramdır", "paras": [{"reader": false, "ar": [[831.0, "ومن الكلّيّات أيضًا: <b>كلُّ لفظةٍ تتضمّن سبَّ الدهر فمحرَّمة.<\/b> كلُّ لفظةٍ تتضمّن سبَّ الدهر فمحرَّمة."], [852.9, "<span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [858.0, "إن قلتَ: ما علاقة هذه القاعدة بتوحيد الربوبية؟"], [864.0, "فأقول: لأنّ الله هو الذي يدبّر ويصرّف الدهر،"], [871.0, "ويُجري ما فيه من الأقدار،"], [874.0, "والتدبيرُ والتصريف فعلان لله عز وجل؛"], [880.0, "فإذا سبّ الإنسانُ الدهرَ فكأنه إنما سبّ اللهَ عز وجل وآذاه."], [887.0, "فبما أنّ الدهر يتعلّق بشيءٍ من فعل الله،"], [891.8, "فلا بدّ أن يُذكر تحت دائرة توحيد الربوبية."], [897.0, "فلا يجوز للإنسان أبدًا أن يتلفّظ بكلمةٍ تتضمّن سبَّ الدهر."]], "tr": [[831.0, "Külliyelerden biri de şudur: 3."], [832.0, "külliye: Dehre sövmeyi içeren her lafız haramdır. (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [852.9, "\"Bu kaidenin rubûbiyyet tevhidiyle ne ilgisi var?\" dersen, derim ki:"], [858.0, "Çünkü dehri idare eden ve evirip çeviren ve içindeki kaderleri cereyan ettiren Allah'tır;"], [867.6, "tedbir ve tasrif (idare etmek ve evirip çevirmek) Allah Azze ve Celle'nin iki fiilidir."], [880.0, "İnsan dehre sövdüğünde sanki Allah Azze ve Celle'ye sövmüş ve O'na eziyet etmiş olur."], [889.5, "Dehr Allah'ın fiiliyle ilgili olduğuna göre, rubûbiyyet tevhidi dairesinde zikredilmesi gerekir."], [897.0, "İnsanın dehre sövmeyi içeren bir kelimeyi telaffuz etmesi asla caiz değildir."]]}]}, {"ts": "15:05", "title": "3. Külliye (devam): Sövmenin ölçüsü örftür; dehre sövmenin kısımları", "paras": [{"reader": false, "ar": [[905.0, "وهذا السبُّ مردُّه العُرف؛"], [910.0, "فكلُّ لفظةٍ تتضمّن سبًّا في عُرفك فلا يجوز توجيهُها للدهر،"], [916.0, "وقد لا تكون سبًّا في العُرف الثاني،"], [921.0, "فيُعامَل كلُّ إنسانٍ بما هو معهودٌ من السبّ في عُرفه،"], [928.0, "لأنّ المتقرِّر في القواعد أنّ العادة مُحكَّمة."], [933.0, "والدليل على ذلك ما ذكرتُه في الكلّيّة الأولى من قول النبي صلى الله عليه وسلم فيما يرويه عن ربه عز وجل:"], [945.1, "«يؤذيني ابنُ آدم، يسبّ الدهر وأنا الدهر، بيدي الأمر، أقلّب الليل والنهار»."], [951.0, "وكلُّ فعلٍ يتضمّن إيذاءَ الله عز وجل فإنه لا يكون إلا حرامًا وكبيرةً من كبائر الذنوب."]], "tr": [[905.0, "Bu sövmenin ölçüsü örftür. Senin örfünde sövme içeren her lafzı dehre yöneltmek caiz değildir;"], [910.0, "(aynı lafız) başka bir örfte sövme olmayabilir."], [916.0, "Her insana, kendi örfünde sövme olarak bilinen şeye göre muamele edilir;"], [927.3, "çünkü kaidelerde yerleşik olan şudur:"], [933.0, "Âdet hakemdir (örfe göre hüküm verilir)."], [937.4, "Bunun delili, birinci külliyede zikrettiğim, Nebî ﷺ'in Rabbi Azze ve Celle'den rivayet ettiği şu sözüdür:"], [945.1, "«Âdemoğlu bana eziyet ediyor; dehre sövüyor. Hâlbuki dehr benim; iş benim elimdedir, geceyi ve gündüzü ben evirip çeviririm.» Allah Azze ve Celle'ye eziyet etmeyi içeren her fiil ancak haramdır ve büyük günahlardan bir büyük günahtır."]]}, {"reader": false, "ar": [[961.0, "وفي الحديث يقول النبي صلى الله عليه وسلم:"], [966.3, "«لا تسبّوا الدهر؛ فإنّ الله هو الدهر»،"], [971.0, "وهذا نهيٌ، والمتقرِّر في القواعد أنّ النهي المتجرِّد عن القرينة يفيد التحريم."], [977.0, "فإن قلتَ: وما أقسام سبّ الدهر؟"], [986.0, "فأقول: لقد قسّم أهلُ السنة ـ رحمهم الله تعالى ـ سبَّ الدهر إلى ثلاثة أقسام:"]], "tr": [[961.0, "Hadiste Nebî ﷺ şöyle buyurur:"], [966.3, "«Dehre sövmeyin; çünkü dehr Allah'tır.» Bu bir nehiydir;"], [971.5, "kaidelerde yerleşik olan şudur: Karineden soyut nehiy haramlık ifade eder."], [977.0, "\"Dehre sövmenin kısımları nelerdir?\" dersen, derim ki:"], [986.0, "Ehl-i Sünnet —Allah onlara rahmet etsin— dehre sövmeyi üç kısma ayırmıştır:"]]}, {"reader": false, "ar": [[999.0, "القسم الأول: من سبّه معتقدًا أنه خالقُ الأمر المضرّ وفاعلٌ له بذاته؛"], [1013.7, "فمتى ما كان السبُّ يتضمّن اعتقادَ أنّ الدهر هو الخالق المدبّر المقدِّر لهذا الضرر،"], [1022.9, "فإنّ هذا من السبّ المُفضي إلى الشرك الأكبر والخروج من ملّة الإسلام بالكلّيّة."]], "tr": [[999.0, "Birinci kısım: Onun zararlı işin yaratıcısı ve bizzat faili olduğuna inanarak ona sövendir."], [1013.7, "Sövme, dehrin bu zararın yaratıcısı, idarecisi ve takdir edicisi olduğu inancını içerdiği zaman, bu;"], [1024.2, "büyük şirke ve İslam milletinden tamamen çıkmaya götüren sövmedendir."]]}, {"reader": false, "ar": [[1031.5, "القسم الثاني: من يسبّه لا معتقدًا أنه الفاعل،"], [1041.4, "ولكن يعتقد أنه سببٌ لهذا الضرر؛"], [1045.5, "فهو إنما يعتقد السببيّةَ لا الخالقيّةَ أو الفاعليّة،"], [1053.0, "فهذا شركٌ أصغر؛ لأنه اعتقد سببًا ما ليس بسببٍ لا شرعًا ولا قدرًا،"], [1065.0, "ولأنه وسيلةٌ للشرك الأكبر."]], "tr": [[1031.5, "İkinci kısım: Onun fail olduğuna inanmadan, fakat bu zararın sebebi olduğuna inanarak ona sövendir."], [1045.5, "O yalnızca sebepliğe inanır, yaratıcılığa veya failliğe değil."], [1052.0, "Bu küçük şirktir; çünkü ne şer'an ne de kaderen sebep olmayan bir şeyi sebep olarak inanmıştır ve çünkü bu, büyük şirke bir vesiledir."]]}, {"reader": false, "ar": [[1068.0, "القسم الثالث: أن يسبّه لا معتقدًا أنه الفاعل ولا أنه سببٌ للضرر،"], [1079.0, "ولكنه يسبّه على أنه محلٌّ للضرر؛"], [1084.0, "فهذا محرَّمٌ وكبيرةٌ من كبائر الذنوب،"], [1089.0, "لكنه لا يوقع صاحبَه في شيءٍ من الشرك،"], [1093.0, "لا الأكبر ولا الأصغر."], [1095.0, "فمن سبّ الدهر معتقدًا أنه الفاعل فشركٌ أكبر،"], [1101.0, "ومن سبّه معتقدًا أنه سببٌ فشركٌ أصغر،"], [1106.0, "ومن سبّه معتقدًا أنه محلٌّ للحوادث فهذا محرَّمٌ وكبيرةٌ من كبائر الذنوب."]], "tr": [[1068.0, "Üçüncü kısım: Onun ne fail ne de zararın sebebi olduğuna inanarak, fakat zararın mahalli (meydana geldiği yer/zaman) olduğu için ona sövmesidir."], [1084.0, "Bu haramdır ve büyük günahlardan bir büyük günahtır;"], [1089.5, "fakat sahibini ne büyük ne de küçük şirkten herhangi bir şeye düşürmez."], [1095.0, "Kim dehrin fail olduğuna inanarak ona söverse (bu) büyük şirktir;"], [1100.5, "kim onun sebep olduğuna inanarak ona söverse (bu) küçük şirktir;"], [1106.0, "kim onun olayların mahalli olduğuna inanarak ona söverse bu haramdır ve büyük günahlardan bir büyük günahtır."]]}, {"reader": false, "ar": [[1113.0, "فإن قلتَ: وما علّةُ النهي عن سبّ الدهر؟"], [1119.0, "فنقول: عدّةُ عِلَل: منها أنه سبٌّ لمن لا يستحقّ السبّ،"], [1136.0, "والمتقرِّر في القواعد أنّ كلَّ من سبّ من لا يستحقّ السبَّ فسبُّه راجعٌ ـ يرجع ـ عليه."], [1147.0, "فالدهر مخلوقٌ مربوبٌ مدبَّرٌ مصنوع،"], [1150.3, "لا يملك لا نفعًا ولا ضرًّا،"], [1154.3, "لا لنفسه ولا لغيره،"], [1159.0, "ولم يصدر منه أيُّ جريمةٍ تستوجب أن نقابله بالسبّ واللعن والتقبيح والشتم."]], "tr": [[1113.0, "\"Dehre sövmenin yasaklanmasının illeti nedir?\" dersen, deriz ki:"], [1119.0, "Birkaç illeti vardır. Bunlardan biri, bunun sövülmeyi hak etmeyene sövmek olmasıdır."], [1131.0, "Kaidelerde yerleşik olan şudur: Sövülmeyi hak etmeyene söven herkesin sövgüsü kendisine döner."], [1138.5, "Dehr; yaratılmış, terbiye edilen (rubûbiyyete tâbi), idare edilen ve yapılmış bir şeydir;"], [1147.0, "ne kendisi ne de başkası için bir fayda ya da zarara sahip değildir."], [1155.7, "Ondan, onu sövme, lanet, kötüleme ve hakaretle karşılamamızı gerektiren hiçbir suç sâdır olmamıştır."]]}, {"reader": false, "ar": [[1168.0, "العلّة الثانية: أنه سبٌّ يتضمّن في أكثره اعتقاداتٍ باطلة:"], [1177.0, "إمّا اعتقادَ أنه الفاعل،"], [1179.8, "أو اعتقادَ أنه سببٌ للضرر،"], [1185.7, "وكلاهما اعتقادان فاسدان. ومنها:"], [1190.7, "أنه لم يباشره بالسبّ إلا لاعتقاده أنه دهرٌ ظالم؛"]], "tr": [[1168.0, "İkinci illet: Bu sövme çoğunlukla bâtıl inançlar içerir:"], [1177.0, "Ya onun fail olduğu inancını ya da zararın sebebi olduğu inancını."], [1182.7, "Her ikisi de bozuk inançlardır."], [1190.0, "Bunlardan biri de şudur: (İnsan) ona ancak onun zalim bir dehr olduğuna inandığı için sövmeye girişir."]]}]}, {"ts": "20:02", "title": "3. Külliye (devam): \"Zalim zaman\" inancı; sövme örnekleri; Lût'un \"çetin gün\" sözü", "paras": [{"reader": false, "ar": [[1202.0, "فهو يصفه بالظلم؛ لأنه يعتقد أنّ هذا الدهر يعطي من لا يستحقّ،"], [1210.1, "ويمنع من يستحقّ، ويُغني من لا يستحقّ،"], [1217.0, "ويُفقر من يستحقّ، ويوجِد من لا يستحقّ،"], [1223.0, "ويُعدِم من لا يستحقّ،"], [1225.0, "ويقرّب للخيرات من لا يستحقّ،"], [1229.0, "ويمنعها ويُبعدها عمّن يستحقّ،"], [1236.0, "ويخفض من لا يستحقّ،"], [1241.0, "ويرفع من يستحقّ، ويُدِرّ النِّعَم على من لا يستحقّ، ويحجبها عمّن يستحقّ."]], "tr": [[1202.0, "O, dehri zulümle niteler; çünkü bu dehrin hak etmeyene verdiğine, hak edenden esirgediğine;"], [1202.7, "hak etmeyeni zengin, hak edeni fakir ettiğine;"], [1203.4, "hak etmeyeni var, hak etmeyeni yok ettiğine;"], [1204.0, "hak etmeyeni hayırlara yaklaştırdığına, hak edenden onları esirgeyip uzaklaştırdığına;"], [1217.9, "hak etmeyeni alçalttığına, hak edeni yükselttiğine;"], [1225.8, "nimetleri hak etmeyenin üzerine bolca yağdırdığına ve onları hak edenden perdelediğine inanır."]]}, {"reader": false, "ar": [[1253.0, "ولا يخلو سابُّه من هذا في الأعمّ الأغلب؛"], [1259.0, "لأنه لم يتوجّه للزمان بالسبّ إلا لاعتقاده أنّ الزمن ظالم،"], [1266.0, "وأنّ الحياة ظالمة، وأنه ليس فيها عدل،"], [1271.0, "بل ليس فيها إلا الظلمُ والجَور والقهر والإهانة والتنغيص والهمّ والغمّ في مجريات أيامها وشهورها وأعوامها."], [1288.0, "ولو لم يقم هذا المعنى في قلبه لما اضطُرّ إلى سبّه."]], "tr": [[1253.0, "Ona sövenler çoğunlukla bundan hâlî değildir."], [1257.3, "Çünkü (insan) zamana ancak zamanın zalim olduğuna, hayatın zalim olduğuna, onda adalet olmadığına, hatta günlerinin, aylarının ve yıllarının akışında zulüm, haksızlık, baskı, aşağılanma, huzursuzluk, keder ve tasadan başka bir şey olmadığına inandığı için sövmeye yönelir."], [1288.0, "Bu anlam kalbinde yer etmeseydi ona sövmeye mecbur kalmazdı."]]}, {"reader": false, "ar": [[1295.0, "ومنها أيضًا: أنّ السبَّ في الحقيقة يرجع إلى من دبّر وقدّر وخلق وصنع،"], [1309.0, "وهو الله عز وجل؛"], [1311.0, "لأنّ المتقرِّر في القواعد أنّ سبَّ الصنعة سبٌّ لصانعها،"], [1317.0, "وأنّ سبَّ المخلوق سبٌّ لخالقه،"], [1321.0, "وأنّ سبَّ المقدور سبٌّ لمن قدّره وأوجده على هذه الصورة."]], "tr": [[1295.0, "Bunlardan biri de şudur: Sövme hakikatte, idare eden, takdir eden, yaratan ve yapan Allah Azze ve Celle'ye döner."], [1311.0, "Çünkü kaidelerde yerleşik olan şudur:"], [1313.7, "Sanata sövmek sanatkârına sövmektir; mahlûka sövmek yaratıcısına sövmektir;"], [1319.4, "takdir edilen şeye sövmek, onu takdir edip bu surette var edene sövmektir."]]}, {"reader": false, "ar": [[1329.0, "فإن قلتَ: هلّا ضربتَ لنا أمثلةً على هذا السبّ؟"], [1337.0, "فأقول: كما تقرّر سابقًا بأنّ السبَّ أمرٌ يُعرف من جهة العُرف،"], [1344.0, "وقد كثُر سبُّ الدهر في أشعار أهل الجاهلية،"], [1350.0, "معتقدين بأنّ الدهر ظالم،"], [1353.0, "وأنه هو الذي أصابهم بهذه الأضرار والخسارات والمصائب،"], [1361.0, "فكثُر سبُّه في أشعارهم."], [1365.0, "فمثالُ ذلك أن يقول:"], [1368.1, "بؤسًا للدهر، أو: تبًّا لهذا الدهر،"], [1373.0, "أو: قبّح الله هذا الزمان، أو: أهلكنا الدهر."]], "tr": [[1329.0, "\"Bize bu sövmeye örnekler verseydin ya!\" dersen, derim ki:"], [1337.0, "Daha önce yerleştiği gibi sövme, örf cihetinden bilinen bir iştir."], [1344.0, "Cahiliye ehlinin şiirlerinde dehre sövmek çoktu;"], [1349.1, "dehrin zalim olduğuna ve onlara bu zararları, kayıpları ve musibetleri isabet ettirenin o olduğuna inanıyorlardı."], [1365.0, "Bu yüzden şiirlerinde ona sövmek çoğaldı."], [1368.1, "Bunun örneği şöyle demesidir: \"Yazıklar olsun dehre!\", \"Kahrolsun bu dehr!\", \"Allah bu zamanı kahretsin!\" ya da \"Dehr bizi helâk etti.\""]]}, {"reader": false, "ar": [[1380.0, "كما حكاه الله عز وجل عن الدهريّين في قولهم:"], [1385.0, "<span class=\"ayah\">﴿وَقَالُوا مَا هِيَ إِلَّا حَيَاتُنَا الدُّنْيَا نَمُوتُ وَنَحْيَا وَمَا يُهْلِكُنَا إِلَّا الدَّهْرُ﴾<\/span> <span class=\"ref\">[الجاثية: ٢٤]<\/span> <span class=\"note\">(Şeyh başını «إنما إن هي» diye okuyor)<\/span>،"], [1396.0, "وقولُ من قال: الدهر ظالم،"], [1401.0, "وقولُ بعضهم: قبّح الله هذا الزمان،"], [1405.0, "ووصفُ الزمان باليوم الأسود؛"], [1411.0, "كلُّ ذلك من باب سبّ الدهر."]], "tr": [[1380.0, "Nitekim Allah Azze ve Celle bunu Dehriyyûn'dan, onların şu sözünde nakletmiştir:"], [1385.0, "<span class=\"ayah\">﴿Dediler ki: Hayat ancak dünya hayatımızdır; ölürüz ve yaşarız. Bizi ancak dehr (zaman) helâk eder﴾<\/span> [Câsiye 24]."], [1398.4, "\"Dehr zalimdir\" diyenin sözü, bazılarının \"Allah bu zamanı kahretsin\" sözü ve zamanı \"kara gün\" diye nitelemek;"], [1411.0, "bütün bunlar dehre sövme babındandır."]]}, {"reader": false, "ar": [[1417.0, "فإن قلتَ: وكيف نجمع بين النهي عن سبّ الدهر مع قول لوط:"], [1429.3, "<span class=\"ayah\">﴿هَٰذَا يَوْمٌ عَصِيبٌ﴾<\/span> <span class=\"ref\">[هود: ٧٧]<\/span>؟ أوَليس وصفُ اليوم بأنه عصيبٌ من سبّ الدهر؟"], [1440.0, "الجواب: لا بدّ أن نفرّق في السبّ بين أمرين:"], [1446.0, "بين الإخبار عن حقيقةٍ واقعة،"], [1452.0, "وبين إنشاء سبٍّ جديد."]], "tr": [[1417.0, "\"Dehre sövme yasağı ile Lût'un <span class=\"ayah\">﴿Bu, çetin bir gündür﴾<\/span> [Hûd 77] sözünü nasıl bağdaştırırız?"], [1433.0, "Günü 'çetin' diye nitelemek dehre sövmek değil midir?\" dersen, cevap:"], [1440.0, "Sövme konusunda iki şeyi ayırmamız gerekir:"], [1444.0, "Gerçekleşmiş bir hakikati haber vermek ile yeni bir sövme inşa etmek."]]}, {"reader": false, "ar": [[1455.0, "فلوطٌ عليه الصلاة والسلام إنما يُخبر عن أمرٍ وقع له في هذا اليوم من مراودة الضِّيفان <span class=\"q\">؟ 24:21<\/span>،"], [1468.0, "فهو يومٌ عصيبٌ يمرّ عليه؛"], [1472.0, "فهو لم يُنشئ سبًّا لهذا اليوم،"], [1476.0, "وإنما يُخبر عن أمرٍ وقع له في هذا اليوم جعله يومًا عصيبًا بالنسبة له."], [1484.0, "كقولك: هذا يومٌ حارّ،"], [1488.0, "لا من باب إنشاء السبّ،"], [1491.0, "وإنما من باب الإخبار عن شيءٍ واقع،"], [1494.0, "أو: ما أصعبَ هذا اليوم!"], [1497.1, "لكثرة ما أصابك فيه من الشغل والصوارف والتعب،"]], "tr": [[1455.0, "Lût (aleyhissalâtu vesselâm), o gün başına gelen misafirler (hakkındaki) kötü talep <span class=\"q\">؟<\/span> meselesini haber veriyordu;"], [1466.8, "o gün, üzerinden geçen çetin bir gündü."], [1472.0, "O, bu güne yeni bir sövme inşa etmedi;"], [1476.0, "ancak o gün başına gelen ve o günü kendisi için çetin bir gün kılan bir işi haber verdi."], [1484.0, "Tıpkı \"Bu sıcak bir gün\" demen gibi;"], [1489.2, "bu, sövme inşa etmek babından değil, gerçekleşmiş bir şeyi haber vermek babındandır."], [1494.6, "Ya da o gün sana isabet eden meşguliyet, engeller ve yorgunluğun çokluğundan dolayı \"Bu gün ne kadar zor!\" demen gibi;"]]}]}, {"ts": "25:02", "title": "3. Külliye (devam): Haber ile inşa farkı; \"Dünya mel'undur\" hadisi", "paras": [{"reader": false, "ar": [[1502.0, "لا تقصد إنشاءَ سبٍّ وإنما تقصد إخبارًا."], [1507.0, "والنهيُ عن سبّ الدهر لا مدخل له في الأخبار،"], [1513.0, "وإنما لا يدخل فيه إلا الإنشاء؛"], [1518.0, "فالنهي عن سبّ الدهر إنما يَحرُم إن كان إنشاءً لا إخبارًا."], [1526.0, "ولا تزال العرب إلى يومنا هذا وهي تصف بعض الأيام بما وقع فيها،"], [1535.0, "إمّا من سعدٍ وخير،"], [1537.8, "وإمّا من موتٍ أو قحطٍ وغير ذلك،"], [1542.9, "كعامِ مجاعةٍ وعامِ حزن؛"], [1548.0, "فهو ليس من باب إنشاء السبّ له،"], [1552.2, "وإنما من باب الإخبار بحقيقةٍ واقعةٍ فيه،"], [1555.9, "فلا إشكال في هذا ولله الحمد."]], "tr": [[1502.0, "(Bununla) sövme inşa etmeyi değil, haber vermeyi kastedersin."], [1507.0, "Dehre sövme yasağının haberlerle bir ilgisi yoktur;"], [1511.7, "ona ancak inşa girer. Dehre sövme yasağı, ancak (söz) haber değil de inşa ise haram olur."], [1526.0, "Araplar bugüne kadar bazı günleri, onlarda meydana gelen mutluluk ve hayır ya da ölüm, kıtlık ve benzeri şeylerle nitelemeye devam ederler;"], [1541.2, "\"kıtlık yılı\", \"hüzün yılı\" gibi."], [1548.0, "Bu, ona sövme inşa etmek babından değil, onda gerçekleşmiş bir hakikati haber vermek babındandır."], [1555.3, "Allah'a hamd olsun, bunda bir müşkil yoktur."]]}, {"reader": false, "ar": [[1559.0, "وعلى ذلك قولُ الله عز وجل في اليوم الذي أهلك فيه عادًا:"], [1567.0, "<span class=\"ayah\">﴿فِي يَوْمِ نَحْسٍ مُّسْتَمِرٍّ﴾<\/span> <span class=\"ref\">[القمر: ١٩]<\/span>،"], [1570.0, "مع أنه ربُّ الأيام وله أن يلعن منها ما شاء،"], [1578.0, "ولكنّ هذا من باب الإخبار عمّا أصاب القومَ في هذا اليوم."]], "tr": [[1559.0, "Allah Azze ve Celle'nin Âd kavmini helâk ettiği gün hakkındaki şu sözü de buna göredir:"], [1567.0, "<span class=\"ayah\">﴿Uğursuzluğu sürekli bir günde﴾<\/span> [Kamer 19]."], [1570.7, "Hâlbuki O, günlerin Rabbidir ve onlardan dilediğini lanetleme hakkına sahiptir."], [1578.0, "Fakat bu, o gün kavme isabet eden şeyi haber verme babındandır."]]}, {"reader": false, "ar": [[1588.0, "فإن قلتَ: وكيف نجمع بين النهي عن سبّ الدهر مع الحديث ـ الذي قد يكون حسنًا ـ:"], [1597.0, "«الدنيا ملعونةٌ، ملعونٌ ما فيها، إلا ذكرَ الله وما والاه، وعالمٌ ومتعلّم»،"], [1610.0, "أوَليس هذا من سبّ الدهر؟ الجواب من وجهين:"]], "tr": [[1588.0, "\"Dehre sövme yasağı ile —hasen olabilecek— şu hadisi nasıl bağdaştırırız:"], [1597.0, "«Dünya mel'undur; içindekiler de mel'undur. Ancak Allah'ın zikri ve ona yakın olanlar, âlim ve öğrenci müstesna.» Bu, dehre sövmek değil midir?\" dersen, cevap iki yöndendir:"]]}, {"reader": false, "ar": [[1619.0, "الوجه الأول: أنّ قول النبي صلى الله عليه وسلم:"], [1624.0, "«الدنيا ملعونةٌ، ملعونٌ ما فيها» ليس من باب إنشاء اللعن،"], [1629.0, "وإنما من باب الإخبار عنه؛"], [1632.0, "فقد أوحى الله عز وجل إلى نبيّه بأنّ هذه الدنيا ملعونة،"], [1639.0, "فصار يخبرنا بأنها ملعونة."], [1642.0, "فالنبي صلى الله عليه وسلم لم يُنشئ لها سبًّا،"], [1646.0, "وإنما أخبرنا عن حقيقةٍ من حقائق هذه الدنيا."]], "tr": [[1619.0, "Birinci yön: Nebî ﷺ'in «Dünya mel'undur; içindekiler de mel'undur» sözü lanet inşa etmek babından değil, onu haber vermek babındandır."], [1632.0, "Allah Azze ve Celle, Peygamberine bu dünyanın mel'un olduğunu vahyetti;"], [1636.0, "o da bize onun mel'un olduğunu haber verdi."], [1642.0, "Nebî ﷺ ona bir sövme inşa etmedi;"], [1645.1, "ancak bize bu dünyanın hakikatlerinden bir hakikati haber verdi."]]}, {"reader": false, "ar": [[1650.0, "فإن لم يُقنعك هذا الجواب فدونك الجوابَ الثاني:"], [1656.0, "وهي أنّ النهي عن سبّ الدهر لا مدخل له في سبّ الأعيان،"], [1661.0, "وإنما هو مقصورٌ على سبّ اليوم،"], [1665.0, "أو الأسبوع، أو الشهر،"], [1670.0, "أو السنة؛ فهو نهيٌ عن سبّ الأيام والشهور والأسابيع والأعوام."], [1678.0, "وأمّا «الدنيا ملعونةٌ ملعونٌ ما فيها» فهو لا يريد سبَّ أيامها،"], [1683.7, "وإنما يريد سبَّ الأعيان المخلوقة فيها،"]], "tr": [[1650.0, "Bu cevap seni ikna etmezse, al sana ikinci cevap:"], [1656.0, "Dehre sövme yasağının ayn'lara (somut varlıklara) sövmekle bir ilgisi yoktur;"], [1661.0, "o yalnızca güne, haftaya, aya veya yıla sövmekle sınırlıdır."], [1671.0, "Yani o, günlere, aylara, haftalara ve yıllara sövmenin yasaklanmasıdır."], [1678.0, "\"Dünya mel'undur; içindekiler de mel'undur\" sözüne gelince, (Nebî ﷺ) onun günlerine sövmeyi değil, onda yaratılmış ayn'lara sövmeyi kastetmektedir."]]}, {"reader": false, "ar": [[1687.0, "كقولنا: لعن الله الكفر والكافر؛"], [1695.0, "فإنّ الكفر والكافر ليست أيامًا وإنما أعيانٌ وُجدت."], [1699.8, "و«لعن الله السارق، يسرق البيضة فتُقطع يده، ويسرق الحبل فتُقطع يده» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [1707.1, "وهذا ليس أيامًا وإنما أعيانٌ في هذه الدنيا."], [1712.2, "<span class=\"ayah\">﴿أُولَٰئِكَ يَلْعَنُهُمُ اللَّهُ وَيَلْعَنُهُمُ اللَّاعِنُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٥٩]<\/span>،"], [1719.0, "إنما هو لعنُ أعيان."], [1721.0, "«لُعنت الخمرةُ على عشرة أوجه»،"], [1724.0, "إنما هو لعنُ أعيان."], [1728.0, "أنتم معي في هذا ولّا لا؟"]], "tr": [[1687.0, "\"Allah küfre ve kâfire lanet etsin\" sözümüz gibi;"], [1695.6, "küfür ve kâfir günler değil, var olmuş ayn'lardır."], [1699.8, "«Allah hırsıza lanet etsin; yumurta çalar da eli kesilir, ip çalar da eli kesilir» <span class=\"note\">(Buhârî, Müslim)<\/span>;"], [1707.7, "bunlar da günler değil, bu dünyadaki ayn'lardır."], [1712.2, "<span class=\"ayah\">﴿İşte onlara Allah lanet eder, lanet edenler de lanet eder﴾<\/span> [Bakara 159];"], [1721.0, "bu da ancak ayn'lara lanettir."], [1722.8, "«İçki on yönden lanetlendi»; bu da ancak ayn'lara lanettir."], [1728.0, "Bu konuda benimle misiniz, değil misiniz?"]]}, {"reader": false, "ar": [[1731.0, "والأدلة التي يُثبت فيها النبي صلى الله عليه وسلم لعنَ أعيانٍ كثيرةٍ وُجدت في هذه الدنيا كثيرةٌ جدًّا،"], [1743.0, "لا تكاد تُحصر إلا بكُلفة."], [1745.0, "فالنهي عن سبّ الدهر إنما هو نهيٌ عن سبّ الزمان،"], [1749.9, "و«الدنيا ملعونة» إنما هو إخبارٌ عن سبّ الأعيان؛"], [1757.0, "بدليل أنه استثنى من هذه الأعيان ما كان مقرِّبًا إلى الله عز وجل:"], [1764.0, "«إلا ذكرَ الله وما والاه، وعالمٌ ومتعلّم»،"], [1770.0, "وهذه العدديّة <span class=\"q\">؟ 29:30<\/span> علّتُها واحدة."]], "tr": [[1731.0, "Nebî ﷺ'in bu dünyada var olan birçok ayn'a lanet ettiğini gösteren deliller pek çoktur;"], [1745.0, "ancak zahmetle sayılabilir. Dehre sövme yasağı ancak zamana sövmenin yasaklanmasıdır;"], [1749.9, "\"Dünya mel'undur\" ise ancak ayn'lara sövmeyi haber vermektir."], [1757.0, "Bunun delili, (Nebî ﷺ'in) bu ayn'lardan Allah Azze ve Celle'ye yaklaştıran şeyleri istisna etmesidir:"], [1764.0, "«Ancak Allah'ın zikri ve ona yakın olanlar, âlim ve öğrenci müstesna.» Bu sayılanların <span class=\"q\">؟<\/span> illeti birdir."]]}, {"reader": false, "ar": [[1774.0, "فنخرج من ذلك أنّ كلَّ ما يُبعد عن الله من الأعيان في هذه الدنيا فهو ملعون،"], [1782.0, "وكلُّ ما يقرّب إلى الله عز وجل من الأعيان في هذه الدنيا فخارجٌ عن دائرة اللعنة."], [1791.0, "وبهذين الوجهين يزول الإشكالُ الذي يَفرِضه بعضُ الناس على هذا الحديث."]], "tr": [[1774.0, "Buradan şu sonuca varırız: Bu dünyadaki ayn'lardan Allah'tan uzaklaştıran her şey mel'undur;"], [1781.0, "bu dünyadaki ayn'lardan Allah Azze ve Celle'ye yaklaştıran her şey ise lanet dairesinin dışındadır."], [1791.0, "Bu iki yönle, bazı insanların bu hadise yönelttiği müşkil ortadan kalkar."]]}]}, {"ts": "30:01", "title": "3. Külliye (devam): Eziyet ile zarar farkı; dehre sövmenin kefareti; \"Dehr\" Allah'ın ismi mi?", "paras": [{"reader": false, "ar": [[1801.0, "فإن قلتَ: وهل اللهُ على جلالته يُؤذى من عباده؟"], [1811.0, "الجواب: لا بدّ أن تفرّق بين الأذى والضرر؛"], [1817.0, "فالله يُؤذى ولكن لا يُضَرّ."], [1822.0, "فالله يُؤذى إذا ارتكب العبدُ شيئًا مما يوجب سخطَه،"], [1831.0, "فهذا مما يؤذي اللهَ عز وجل."], [1835.0, "والإخبارُ بالإيذاء عن الله عز وجل إنما هو إخبارٌ عن شيءٍ ثبت به الشرع،"], [1843.0, "وإلا فحقيقةُ هذا الإيذاء وكيفيّتُه إنما نردّها ـ كيفيّةً ـ إلى الله تبارك وتعالى."]], "tr": [[1801.0, "\"Allah, celâline rağmen kullarından eziyet görür mü?\" dersen, cevap:"], [1811.0, "Eziyet ile zararı ayırman gerekir."], [1814.6, "Allah'a eziyet edilir, fakat O zarar görmez."], [1822.0, "Kul, O'nun öfkesini gerektiren bir şey işlediğinde Allah'a eziyet edilmiş olur;"], [1827.7, "bu, Allah Azze ve Celle'ye eziyet veren şeylerdendir."], [1835.0, "Allah Azze ve Celle hakkında eziyetin haber verilmesi, şeriatın sabit kıldığı bir şeyin haber verilmesidir."], [1842.6, "Yoksa bu eziyetin hakikatini ve keyfiyetini —keyfiyet olarak— Allah Tebâreke ve Teâlâ'ya havale ederiz."]]}, {"reader": false, "ar": [[1856.0, "ولكنّ المنفيَّ عن الله إنما هو الضرر؛"], [1863.0, "لقوله: «إنكم لن تبلغوا ضرّي فتضرّوني، ولن تبلغوا نفعي فتنفعوني» <span class=\"note\">(Müslim)<\/span>."], [1873.0, "والحديثُ إنما أثبت الأذى،"], [1875.7, "ولا مدخل له في الضرر؛"], [1879.0, "فالله يُؤذى ولكن لا يصيبه الضرر."]], "tr": [[1856.0, "Fakat Allah'tan nefyedilen ancak zarardır;"], [1858.2, "çünkü (kudsî hadiste) şöyle buyurur:"], [1863.0, "«Siz bana zarar vermeye asla güç yetiremezsiniz ki bana zarar veresiniz; bana fayda vermeye de asla güç yetiremezsiniz ki bana fayda veresiniz» <span class=\"note\">(Müslim)<\/span>."], [1875.7, "(Dehr) hadisi ise ancak eziyeti isbat etmiştir;"], [1879.0, "onun zararla bir ilgisi yoktur."], [1880.5, "Allah'a eziyet edilir, fakat O'na zarar isabet etmez."]]}, {"reader": false, "ar": [[1885.0, "فإن قلتَ: وما الفرق بينهما؟"], [1888.0, "الجواب: إذا قلنا: إيذاءٌ وضرر،"], [1891.6, "فيكون الإيذاء من خارج،"], [1898.0, "والضررُ هو الشيء الملامس."], [1902.0, "فقد يؤذيك إنسانٌ في مكالمةٍ هاتفية وهو بعيدٌ عنك،"], [1908.0, "لكن لا يستطيع أن يضربك ولا أن يضرّ جسدك."], [1911.0, "فإذا ذُكر الضررُ وحده دخل معه الأذى،"], [1916.0, "وإذا ذُكر الأذى وحده دخل معه الضرر،"], [1919.0, "لكن إذا قيل: «الأذى والضرر» في نصٍّ أو في نصوص،"], [1924.0, "فإنما يُراد بالأذى ما كان منفصلًا،"], [1927.0, "والضررِ ما كان متّصلًا."]], "tr": [[1885.0, "\"İkisinin arasındaki fark nedir?\" dersen, cevap:"], [1888.0, "\"Eziyet ve zarar\" dediğimizde eziyet dışarıdan olur, zarar ise temas eden şeydir."], [1902.0, "Bir insan senden uzakta iken bir telefon görüşmesinde sana eziyet edebilir;"], [1908.7, "fakat seni dövemez ve bedenine zarar veremez."], [1911.0, "Zarar tek başına zikredildiğinde eziyet de ona dâhil olur;"], [1916.4, "eziyet tek başına zikredildiğinde zarar da ona dâhil olur."], [1920.5, "Fakat bir nasta veya nasslarda \"eziyet ve zarar\" (birlikte) söylendiğinde, eziyetten kastedilen ayrı olan, zarardan kastedilen ise bitişik (temas eden) olandır."]]}, {"reader": false, "ar": [[1931.0, "فإن قلتَ: وهل سبُّ الدهر ـ فيما لو وقع من العبد ـ فيه كفّارة؟"], [1943.0, "الجواب: لا كفّارة فيه إلا صدقُ التوبة."], [1949.0, "فما يعتقده بعضُ الناس من أنه يُكفِّر كفّارةَ يمين،"], [1956.6, "هذا لا شأن له؛"], [1959.0, "فلا كفّارة فيما كان حرامًا أصالةً،"], [1967.0, "وإنما الكفّارة لا تدخل إلا في الأمر المباح أصالةً ومنعُه عارض،"], [1975.0, "فما كان من الحرام الأصلي فإنه لا تدخله الكفّارة أبدًا."]], "tr": [[1931.0, "\"Dehre sövmek kuldan sâdır olursa, onun bir kefareti var mıdır?\" dersen, cevap:"], [1943.0, "Samimi tevbeden başka bir kefareti yoktur."], [1949.0, "Bazı insanların yemin kefareti ödeyeceğine inanması asılsızdır."], [1954.1, "Aslen haram olan şeyde kefaret yoktur;"], [1959.0, "kefaret ancak aslen mubah olup yasaklığı ârız olan (sonradan gelen) işe girer."], [1973.9, "Aslen haram olan şeye ise kefaret asla girmez."]]}, {"reader": false, "ar": [[1983.0, "وبما أنّ سبَّ الدهر مما حُرّم تحريمَ أصالة،"], [1987.0, "فليس فيه إطعامُ عشرة مساكين،"], [1989.9, "وليس فيه صدقاتٌ ولا كفّاراتٌ ولا صيام،"], [1994.0, "وإنما ليس فيه إلا صدقُ التوبة؛"], [1999.0, "فيتوب السابُّ لله عز وجل التوبةَ المستجمِعةَ لشروطها وأركانها."]], "tr": [[1983.0, "Dehre sövmek aslen haram kılınan şeylerden olduğuna göre, onda on fakiri doyurmak yoktur;"], [1990.5, "sadakalar, kefaretler ve oruç da yoktur."], [1994.0, "Onda ancak samimi tevbe vardır."], [1999.0, "Söven kişi, şartlarını ve rükünlerini toplayan bir tevbeyle Allah Azze ve Celle'ye tevbe eder."]]}, {"reader": false, "ar": [[2006.0, "فإن قلتَ: في قوله صلى الله عليه وسلم:"], [2010.7, "«فإنّ الله هو الدهر»،"], [2013.3, "أفيُستنبط من هذا أنّ الدهر من جملة أسمائه؟"], [2018.0, "الجواب: المتقرِّر في القواعد أنّ الأخبار أوسعُ من باب الصفات،"], [2024.0, "وأنّ الصفات أوسعُ من باب الأسماء؛"], [2027.0, "فيجوز خبرًا ما لا يجوز صفةً،"], [2032.0, "ويجوز صفةً ما لا يجوز اسمًا."], [2037.0, "وبناءً على ذلك فلا بأس من إطلاق الدهر على الله عز وجل،"], [2043.0, "ولكن إطلاقَ أخبار؛ فالله هو الدهر خبرًا،"], [2050.0, "ولكن ليس صفةً ولا اسمًا،"], [2055.0, "ويُتوسَّع في باب الأخبار ما لا يُتوسَّع في باب الصفات."]], "tr": [[2006.0, "\"Nebî ﷺ'in «Çünkü dehr Allah'tır» sözünden, dehrin O'nun isimlerinden olduğu istinbat edilir mi?\" dersen, cevap:"], [2010.7, "Kaidelerde yerleşik olan şudur: Haberler (ihbar) babı sıfatlar babından daha geniştir;"], [2018.0, "sıfatlar babı da isimler babından daha geniştir."], [2022.2, "Sıfat olarak caiz olmayan şey haber olarak caiz olabilir;"], [2027.0, "isim olarak caiz olmayan şey sıfat olarak caiz olabilir."], [2037.0, "Buna göre \"dehr\" lafzını Allah Azze ve Celle için kullanmakta bir sakınca yoktur;"], [2042.0, "fakat haber olarak kullanmak (şartıyla)."], [2046.0, "Allah haber olarak dehrdir; fakat (bu) ne sıfattır ne de isimdir."], [2056.5, "Haberler babında, sıfatlar babında genişletilmeyen şekilde genişletilir."]]}]}, {"ts": "34:21", "title": "4. Külliye: Allah'ın zâtından bir şeyin mahlûkun zâtına hulûl ettiğine (ya da tersine) inanan kâfir olur", "paras": [{"reader": false, "ar": [[2061.0, "ومن الكلّيّات أيضًا: كلُّ من اعتقد حلولَ شيءٍ من ذات الله في شيءٍ من ذوات خلقه،"], [2084.0, "أو العكس، فقد كفر. كلُّ من اعتقد حلولَ شيءٍ من ذات الله في ذوات خلقه أو العكس فقد كفر. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2061.0, "Külliyelerden biri de şudur: 4."], [2065.2, "külliye: Allah'ın zâtından bir şeyin O'nun mahlûklarının zâtlarından birine hulûl ettiğine (girdiğine) —ya da bunun tersine— inanan herkes kâfir olur. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2104.0, "أقول وبالله التوفيق: وأقصد بذلك عقيدةَ الحلوليّة والاتحاد،"], [2113.0, "من الذين أجمع أهلُ العلم على كفرهم،"], [2118.0, "لا سيّما كفرَ الغُلاة منهم."], [2123.0, "ويجب على المسلم أن يعتقد الاعتقادَ الجازم بأنّ الله عز وجل فوق سماواته،"], [2133.0, "منفصلٌ عن خلقه، مستوٍ على عرشه،"], [2139.0, "ليس في ذاته شيءٌ من ذوات خلقه،"], [2144.0, "وليس في ذاتهم شيءٌ من ذاته."], [2149.0, "فمن اعتقد اختلاطَ الذاتين ـ حلولًا أو اتحادًا،"], [2156.0, "كلّيًّا أو جزئيًّا ـ فقد كفر."]], "tr": [[2104.0, "Tevfik Allah'tandır, derim ki: Bununla, ehl-i ilmin küfürleri üzerinde icmâ ettiği Hulûliyye ve İttihâd (ehlinin) akîdesini kastediyorum;"], [2123.0, "özellikle onların aşırılarının küfrünü. Müslümanın kesin bir inançla şuna inanması vâciptir:"], [2129.5, "Allah Azze ve Celle göklerinin üstündedir, mahlûkatından ayrıdır, Arşı'na istivâ etmiştir;"], [2139.0, "O'nun zâtında mahlûklarının zâtlarından hiçbir şey yoktur, onların zâtında da O'nun zâtından hiçbir şey yoktur."], [2149.0, "Kim iki zâtın —hulûl veya ittihad yoluyla, küllî veya cüz'î olarak— karıştığına inanırsa kâfir olur."]]}, {"reader": false, "ar": [[2160.0, "وذلك لأنّ الحلول ينقسم إلى:"], [2163.7, "الحلول العام، وهو اعتقادُ أنّ الله عز وجل قد حلّت ذاتُه في كلّ ذوات المخلوقات،"], [2173.0, "من غير تفريقٍ بين حقيرها وجليلها،"], [2177.1, "وصغيرها وكبيرها، وطاهرها ونجسها،"], [2182.8, "وحميدها وقذرها <span class=\"q\">؟ 36:13<\/span>؛ كلُّ ذلك مما لا فرقان فيه عند أصحاب الحلول العام،"], [2195.0, "وهم طائفةٌ من الجهمية الغُلاة،"], [2199.0, "يزعمون بأنّ ذات الله عز وجل قد حلّت في ذوات خلقه."]], "tr": [[2160.0, "Çünkü hulûl şu kısımlara ayrılır:"], [2163.7, "Umumi hulûl; Allah Azze ve Celle'nin zâtının, mahlûkatın hakiri ile yücesi, küçüğü ile büyüğü, temizi ile necisi, övülmüşü ile pisi <span class=\"q\">؟<\/span> arasında ayrım yapmaksızın bütün mahlûkatın zâtlarına hulûl ettiğine inanmaktır."], [2190.0, "Umumi hulûl ehline göre bunların hiçbirinde bir fark yoktur."], [2194.5, "Bunlar aşırı Cehmiyye'den bir taifedir;"], [2198.2, "Allah Azze ve Celle'nin zâtının mahlûklarının zâtlarına hulûl ettiğini iddia ederler."]]}, {"reader": false, "ar": [[2205.0, "وهناك حلولٌ جزئي: وهو اعتقادُ أنّ الله عز وجل إنما حلّ في الذوات المكرَّمة الطاهرة،"], [2215.0, "كحلوله في بعض الأنبياء،"], [2217.0, "وحلوله في بعض الحكّام،"], [2221.0, "وحلوله في بعض الأمراء أو الأولياء أو العلماء؛"], [2227.0, "فهذا أيضًا يُحكم على معتقده بأنه كافر."]], "tr": [[2205.0, "Bir de cüz'î hulûl vardır:"], [2208.0, "Allah Azze ve Celle'nin yalnızca ikram edilmiş ve temiz zâtlara hulûl ettiğine inanmaktır;"], [2216.0, "bazı peygamberlere, bazı hükümdarlara, bazı emîrlere, velilere veya âlimlere hulûl ettiği gibi."], [2227.0, "Buna inananın da kâfir olduğuna hükmedilir."]]}, {"reader": false, "ar": [[2233.0, "وكذلك أصحاب وحدة الوجود؛"], [2239.0, "فإنّ الاتحاد بين ذات الخالق والمخلوق ينقسم إلى قسمين على حسب عقيدة الوجوديّين:"], [2252.0, "هناك اتحادٌ كلّي، بمعنى أنّ الله هو عينُ هذا العالم،"], [2261.0, "وأنّ هذا العالم هو عينُ الله عز وجل،"], [2266.0, "كما كان يعتقده ابنُ عربي،"], [2268.0, "وابنُ الفارض، والتِّلِمْساني، وغيرهم من هؤلاء الفلاسفة؛"], [2275.0, "فيعتقدون أن لا فرقانَ بين عبدٍ ومعبود،"], [2280.0, "ولا خالقٍ ومخلوق، وأنّ كلَّ شيءٍ تراه الأبصار ـ وإن اختلفت أعيانُه ـ فهو عينُ ذات الله عز وجل."]], "tr": [[2233.0, "Vahdet-i vücûd ehli de böyledir."], [2239.0, "Vücûdîlerin (vahdet-i vücûdcuların) akîdesine göre Hâlık'ın zâtı ile mahlûk arasındaki ittihad iki kısma ayrılır:"], [2252.0, "Küllî ittihad vardır; yani Allah'ın bu âlemin ta kendisi olduğu ve bu âlemin Allah Azze ve Celle'nin ta kendisi olduğu inancı."], [2266.8, "İbn Arabî, İbnü'l-Fâriz, Tilimsânî ve bu filozoflardan diğerlerinin inandığı gibi."], [2275.0, "Onlar kul ile ma'bud, Hâlık ile mahlûk arasında hiçbir fark olmadığına ve gözlerin gördüğü her şeyin —ayn'ları farklı olsa da— Allah Azze ve Celle'nin zâtının ta kendisi olduğuna inanırlar."]]}, {"reader": false, "ar": [[2290.0, "ومن مذهب هؤلاء تصحيحُ عبادات أصحاب الأوثان،"], [2299.0, "لأنهم إنما عبدوا اللهَ الذي اتّحد شيءٌ من ذاته بذات الوثن،"], [2306.0, "ويصحّحون قولَ فرعون: <span class=\"ayah\">﴿أَنَا رَبُّكُمُ الْأَعْلَىٰ﴾<\/span> <span class=\"ref\">[النازعات: ٢٤]<\/span>،"], [2312.0, "ويعتقدون أنّ فرعون قد مات على الإيمان،"], [2316.0, "لأنه قد اتّحدت ذاتُ الله عز وجل في ذاته."], [2324.0, "وهؤلاء أكفرُ من اليهود والنصارى،"], [2329.0, "بل إنّ من شكّ في كفرهم بعد بيان مذهبهم له حقيقةً فإنه كافر."]], "tr": [[2290.0, "Bunların mezhebinden biri de putperestlerin ibadetlerini doğru saymaktır;"], [2299.0, "çünkü (onlara göre) putperestler, zâtından bir şey putun zâtıyla ittihad etmiş olan Allah'a ibadet etmişlerdir."], [2308.3, "Firavun'un <span class=\"ayah\">﴿Ben sizin en yüce Rabbinizim﴾<\/span> [Nâziât 24] sözünü de doğru sayarlar ve Firavun'un iman üzere öldüğüne inanırlar;"], [2316.7, "çünkü (onlara göre) Allah Azze ve Celle'nin zâtı onun zâtında ittihad etmiştir."], [2324.0, "Bunlar Yahudilerden ve Hristiyanlardan daha kâfirdir."], [2329.7, "Hatta mezhepleri kendisine hakikatiyle açıklandıktan sonra onların küfründen şüphe eden de kâfirdir."]]}, {"reader": false, "ar": [[2339.0, "ومنهم من يعتقد اتحادَ ذات الخالق بشيءٍ من ذوات خلقه،"], [2348.0, "كاعتقاد الدروز اتحادَ ذات الله عز وجل في ذات الحاكم بأمر الله،"], [2355.0, "أبي منصورٍ الرافضي الباطني الإسماعيلي النُّصيري،"], [2361.0, "الذي كان يزعم أنه الله،"], [2363.9, "وقد حصل في عهده ـ على مدار ثلاثٍ وعشرين سنة ـ أعظمُ النكبات على العالم الإسلامي."], [2372.0, "وكبعض الصوفية الغُلاة الذين يعتقدون اتحادَ ذات الله عز وجل في ذوات الأولياء،"], [2381.7, "كالحلّاج وغيره؛ فإنه كان إذا دخل المسجد واهتزّت جبّته قال:"], [2389.0, "إنما هو <span class=\"q\">؟ 39:45<\/span>، وليس في الجبّة إلا هو."], [2395.0, "وكان يبول في المسجد ويتبرّكون ببوله."]], "tr": [[2339.0, "Onlardan bazıları da Hâlık'ın zâtının mahlûklarının zâtlarından biriyle ittihad ettiğine inanır."], [2351.5, "Dürzîlerin, Allah Azze ve Celle'nin zâtının Hâkim bi-Emrillâh'ın zâtında ittihad ettiğine inanmaları gibi."], [2365.6, "O, Râfızî, Bâtınî, İsmâilî, Nusayrî Ebû Mansûr'dur;"], [2372.0, "kendisinin Allah olduğunu iddia ederdi."], [2374.8, "Onun döneminde, yirmi üç yıl boyunca İslam âleminin başına en büyük felaketler geldi."], [2385.0, "Velilerin zâtlarında Allah Azze ve Celle'nin zâtının ittihad ettiğine inanan bazı aşırı sûfîler de böyledir;"], [2389.0, "Hallâc ve diğerleri gibi. O, mescide girip cübbesi sallandığında \"O ancak O'dur <span class=\"q\">؟<\/span>;"], [2391.6, "cübbenin içinde O'ndan başkası yoktur\" derdi."], [2395.0, "Mescide idrarını yapardı, onlar da onun idrarıyla teberrük ederlerdi."]]}]}, {"ts": "40:01", "title": "4. Külliye (devam): Hulûl ile ittihad farkı; Hristiyanlar, Râfıza, Yahudiler, Cehmiyye", "paras": [{"reader": false, "ar": [[2401.0, "وكالرافضة الغُلاة الذين يزعمون اتحادَ ذات الخالق بذات عليّ بن أبي طالب رضي الله عنه وأرضاه،"], [2411.4, "وحاشاه عن هذا الاعتقاد؛"], [2414.0, "فهذا من باب اعتقاد الاتحاد الجزئي."], [2419.0, "فعلمنا بذلك أنّ الحلول والاتحاد كلاهما ينقسم إلى حلولٍ واتحادٍ جزئي،"], [2429.0, "وإلى حلولٍ واتحادٍ كلّي."]], "tr": [[2401.0, "Hâlık'ın zâtının Ali b. Ebî Tâlib'in —Allah ondan razı olsun ve onu razı etsin— zâtıyla ittihad ettiğini iddia eden aşırı Râfıza da böyledir;"], [2414.0, "hâşâ, o bu inançtan uzaktır."], [2416.3, "Bu, cüz'î ittihad inancı babındandır."], [2419.0, "Bununla öğrendik ki hulûl ve ittihadın her biri cüz'î hulûl ve ittihad ile küllî hulûl ve ittihad kısımlarına ayrılır."]]}, {"reader": false, "ar": [[2434.0, "فإن قلتَ: وما الفرقان بين الحلول والاتحاد أصلًا؟"], [2439.0, "الجواب: تعرفه بضرب مثال:"], [2443.0, "لو وضعتَ سكّرًا في ماءٍ ولم تحرّكه،"], [2447.0, "فنقول: إنّ السكّر حلّ في الماء،"], [2449.7, "ولكن لم يتّحد به بعد،"], [2452.0, "لأنّ الذاتين لا تزالان منفصلتين."], [2456.0, "فإذا حرّكتَ السكّر فإنّ ذات السكّر تتّحد بالماء."], [2461.3, "بحيث إنّ الحلول قد تنفصل فيه الذاتان،"], [2468.0, "وأمّا الاتحاد فلا يمكن أبدًا أن تنفصل الذاتان."], [2476.0, "أنتم معي في هذا؟"]], "tr": [[2434.0, "\"Hulûl ile ittihad arasındaki fark esasen nedir?\" dersen, cevap:"], [2439.0, "Bunu bir örnekle öğrenirsin. Suya şeker koysan ve karıştırmasan, deriz ki:"], [2447.5, "Şeker suya hulûl etti (girdi), fakat henüz onunla ittihad etmedi (birleşmedi);"], [2452.0, "çünkü iki zât hâlâ ayrıdır."], [2456.0, "Şekeri karıştırdığında ise şekerin zâtı suyla ittihad eder."], [2461.3, "Yani hulûlde iki zât ayrılabilir;"], [2464.7, "ittihadda ise iki zâtın ayrılması asla mümkün değildir. Bu konuda benimle misiniz?"]]}, {"reader": false, "ar": [[2478.0, "فإن قلتَ: وأيّهما أعظمُ كفرًا؟"], [2484.0, "ـ كلّكم مُقِرّون؟ ها؟ ـ الجواب:"], [2485.7, "لا جَرَم أنّ الاتحاد بنوعيه ـ جزئيًّا وكلّيًّا ـ أعظمُ كفرًا وشركًا ووثنيّةً ولعنةً وسخطًا من الحلول <span class=\"q\">؟ 41:33<\/span> بنوعيه: الكلّي والجزئي."]], "tr": [[2478.0, "\"Hangisi küfür bakımından daha büyüktür?\" dersen —hepiniz kabul ediyor musunuz?"], [2485.0, "Ha?— cevap: Şüphesiz ki ittihad, iki türüyle —cüz'î ve küllî—, küllî ve cüz'î iki türüyle hulûlden <span class=\"q\">؟<\/span> küfür, şirk, putperestlik, lanet ve (ilahî) öfke bakımından daha büyüktür."]]}, {"reader": false, "ar": [[2504.3, "ويتفرّع على ذلك اعتقادُ النصارى في عيسى عليه الصلاة والسلام؛"], [2512.0, "فإنهم يعتقدون أنه اللهُ اتحادًا وحلولًا،"], [2518.0, "أو ابنُ الله اتحادًا أو حلولًا،"], [2523.0, "أو أنه ثالثُ ثلاثة؛"], [2526.0, "فيزعمون أنّ في ذات الله شيئًا من ذات عيسى،"], [2530.0, "وأنّ في ذات عيسى شيئًا من ذات الله عز وجل،"], [2535.0, "ويعبّرون عنها بحلول اللاهوت في الناسوت."], [2541.0, "وقد ورِثها عنهم العُبيدية الباطنية القرامطة الملاحدة."]], "tr": [[2504.3, "Hristiyanların Îsâ (aleyhissalâtu vesselâm) hakkındaki inancı da buna dayanır."], [2509.9, "Onlar onun ittihad ve hulûl yoluyla Allah olduğuna, ya da ittihad veya hulûl yoluyla Allah'ın oğlu olduğuna, ya da üçün üçüncüsü olduğuna inanırlar."], [2526.0, "Allah'ın zâtında Îsâ'nın zâtından bir şey, Îsâ'nın zâtında da Allah Azze ve Celle'nin zâtından bir şey bulunduğunu iddia ederler ve bunu \"lâhûtun (ilahî tabiatın) nâsûta (insanî tabiata) hulûlü\" diye ifade ederler."], [2541.0, "Bunu onlardan Ubeydiyye, Bâtıniyye, Karâmita mülhidleri miras almıştır."]]}, {"reader": false, "ar": [[2549.0, "وكاعتقاد غُلاة الرافضة في أنّ الله عز وجل قد حلّ في عليّ بن أبي طالب وفي آل البيت،"], [2560.0, "وكاعتقاد اليهود في أنّ شيئًا من ذات الله حلّت في عُزير،"], [2565.9, "كما قال الله عز وجل:"], [2568.6, "<span class=\"ayah\">﴿وَقَالَتِ الْيَهُودُ عُزَيْرٌ ابْنُ اللَّهِ وَقَالَتِ النَّصَارَى الْمَسِيحُ ابْنُ اللَّهِ﴾<\/span> <span class=\"ref\">[التوبة: ٣٠]<\/span>،"], [2574.0, "وكاعتقاد غُلاة الجهمية في حلول الله عز وجل في مخلوقاته،"], [2580.8, "وغير ذلك. فكلُّ من اعتقد حلولًا أو اتحادَ شيءٍ من ذات الله في شيءٍ من ذوات خلقه ـ كُلًّا أو جزءًا ـ فإنه كافر."]], "tr": [[2549.0, "Aşırı Râfıza'nın, Allah Azze ve Celle'nin Ali b."], [2553.9, "Ebî Tâlib'e ve Ehl-i Beyt'e hulûl ettiğine dair inancı da böyledir."], [2561.1, "Yahudilerin, Allah'ın zâtından bir şeyin Üzeyr'e hulûl ettiğine dair inancı da böyledir;"], [2568.6, "nitekim Allah Azze ve Celle şöyle buyurur:"], [2572.4, "<span class=\"ayah\">﴿Yahudiler \"Üzeyr Allah'ın oğludur\" dediler, Hristiyanlar da \"Mesih Allah'ın oğludur\" dediler﴾<\/span> [Tevbe 30]."], [2584.0, "Aşırı Cehmiyye'nin, Allah Azze ve Celle'nin mahlûklarına hulûl ettiğine dair inancı ve benzerleri de böyledir."], [2588.9, "Allah'ın zâtından bir şeyin —tamamen veya kısmen— O'nun mahlûklarının zâtlarından birine hulûl veya ittihad ettiğine inanan herkes kâfirdir."]]}, {"reader": false, "ar": [[2595.0, "وذلك لأنه ينبغي أن تعلموا قاعدةً عظيمةً جدًّا،"], [2600.3, "وهي: أنّ الربوبية المحضة توجب الانفصالَ بين الخالق والمخلوق؛"], [2611.0, "فكلُّ من زعم أنّ في الخالق شيئًا من المخلوق فقد زعم ترابطًا،"], [2617.4, "فربوبيّتُه ليست بمحضة، وكلُّ من زعم أنّ في المخلوق شيئًا من الخالق فقد اختلطت ربوبيّته."], [2626.0, "فالربوبية المحضة تقتضي مباينةَ الربّ للعالم كلّه بالذات،"], [2635.0, "فلا يحلّ فيه شيءٌ من هذا العالم،"], [2639.2, "ولا يحلّ في العالم شيءٌ منه عز وجل."]], "tr": [[2595.0, "Çünkü çok büyük bir kaideyi bilmeniz gerekir:"], [2600.9, "Halis rubûbiyyet, Hâlık ile mahlûk arasında ayrılığı gerektirir."], [2611.0, "Hâlık'ta mahlûktan bir şey bulunduğunu iddia eden, bir bağlantı iddia etmiş olur;"], [2616.9, "(böylece) onun rubûbiyyeti halis olmaz."], [2619.0, "Mahlûkta Hâlık'tan bir şey bulunduğunu iddia edenin rubûbiyyet (anlayışı) da karışmış olur."], [2626.0, "Halis rubûbiyyet, Rabbin bütün âlemden zâtıyla ayrı (mübâyin) olmasını gerektirir."], [2635.6, "O'na bu âlemden hiçbir şey hulûl etmez, âleme de O'ndan hiçbir şey hulûl etmez."]]}]}, {"ts": "44:04", "title": "5. Külliye: Allah'ın ilmini tamamen veya kısmen ta'n eden kâfir olur", "paras": [{"reader": false, "ar": [[2644.0, "ومن الكلّيّات أيضًا: <b>كلُّ من طعن في علم الله ـ كُلًّا أو جزءًا ـ فقد كفر.<\/b> كلُّ من طعن في علم الله عز وجل كُلًّا أو جزءًا فقد كفر."], [2666.7, "ماشي؟ <span class=\"note\">(يكررها)<\/span> وهذا من قواعد الربوبية ولا شكّ؛"], [2680.0, "لأنّ علم الله عز وجل يتعلّق بأفعال ربوبيته تبارك وتعالى."], [2687.0, "وقد فرض <span class=\"q\">؟ 44:47<\/span> الدليلُ المتواتر بأنّ الله بكلّ شيءٍ عليم،"], [2692.0, "وأنّ الله لا يخفى عليه شيءٌ في الأرض ولا في السماء."]], "tr": [[2644.0, "Külliyelerden biri de şudur: 5."], [2646.0, "külliye: Allah'ın ilmini —tamamen veya kısmen— ta'n eden (ona dil uzatan) herkes kâfir olur. Tamam mı?"], [2662.1, "(Tekrar ediyor.) Bu, şüphesiz rubûbiyyetin kaidelerindendir;"], [2666.7, "çünkü Allah Azze ve Celle'nin ilmi, Tebâreke ve Teâlâ'nın rubûbiyyet fiilleriyle ilgilidir."], [2687.0, "Mütevâtir delil <span class=\"q\">؟<\/span>, Allah'ın her şeyi bildiğini ve yerde de gökte de Allah'a hiçbir şeyin gizli kalmadığını ortaya koymuştur."]]}, {"reader": false, "ar": [[2698.0, "فقال الله عز وجل:"], [2699.6, "<span class=\"ayah\">﴿أَلَمْ تَرَ أَنَّ اللَّهَ يَعْلَمُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۖ مَا يَكُونُ مِن نَّجْوَىٰ ثَلَاثَةٍ إِلَّا هُوَ رَابِعُهُمْ وَلَا خَمْسَةٍ إِلَّا هُوَ سَادِسُهُمْ وَلَا أَدْنَىٰ مِن ذَٰلِكَ وَلَا أَكْثَرَ إِلَّا هُوَ مَعَهُمْ أَيْنَ مَا كَانُوا ۖ ثُمَّ يُنَبِّئُهُم بِمَا عَمِلُوا يَوْمَ الْقِيَامَةِ ۚ إِنَّ اللَّهَ بِكُلِّ شَيْءٍ عَلِيمٌ﴾<\/span> <span class=\"ref\">[المجادلة: ٧]<\/span>."]], "tr": [[2698.0, "Allah Azze ve Celle şöyle buyurdu:"], [2699.6, "<span class=\"ayah\">﴿Allah'ın göklerde olanı da yerde olanı da bildiğini görmedin mi? Üç kişinin gizli konuşması olmaz ki dördüncüleri O olmasın; beş kişinin de olmaz ki altıncıları O olmasın. Bundan az da olsa çok da olsa, nerede olurlarsa olsunlar mutlaka O onlarla beraberdir. Sonra kıyamet günü onlara yaptıklarını haber verecektir. Şüphesiz Allah her şeyi bilendir﴾<\/span> [Mücâdele 7]."]]}]}, {"ts": "45:23", "title": "5. Külliye (devam): Allah'ın cüz'iyyâtı ve olmayanı bilmesine dair deliller", "paras": [{"reader": false, "ar": [[2723.0, "وقال الله عز وجل:"], [2725.3, "<span class=\"ayah\">﴿وَعِندَهُ مَفَاتِحُ الْغَيْبِ لَا يَعْلَمُهَا إِلَّا هُوَ﴾<\/span> ـ انتبهوا ـ <span class=\"ayah\">﴿وَيَعْلَمُ مَا فِي الْبَرِّ وَالْبَحْرِ﴾<\/span> ـ أي الجزئيات ـ <span class=\"ayah\">﴿وَمَا تَسْقُطُ مِن وَرَقَةٍ إِلَّا يَعْلَمُهَا﴾<\/span> ـ وهذا العلم الجزئي ـ <span class=\"ayah\">﴿وَلَا حَبَّةٍ فِي ظُلُمَاتِ الْأَرْضِ وَلَا رَطْبٍ وَلَا يَابِسٍ إِلَّا فِي كِتَابٍ مُّبِينٍ﴾<\/span> <span class=\"ref\">[الأنعام: ٥٩]<\/span>."], [2747.0, "وقال الله عز وجل:"], [2748.8, "<span class=\"ayah\">﴿إِنَّ اللَّهَ عِندَهُ عِلْمُ السَّاعَةِ وَيُنَزِّلُ الْغَيْثَ وَيَعْلَمُ مَا فِي الْأَرْحَامِ ۖ وَمَا تَدْرِي نَفْسٌ مَّاذَا تَكْسِبُ غَدًا ۖ وَمَا تَدْرِي نَفْسٌ بِأَيِّ أَرْضٍ تَمُوتُ ۚ إِنَّ اللَّهَ عَلِيمٌ خَبِيرٌ﴾<\/span> <span class=\"ref\">[لقمان: ٣٤]<\/span>."]], "tr": [[2723.0, "Allah Azze ve Celle şöyle buyurdu:"], [2725.3, "<span class=\"ayah\">﴿Gaybın anahtarları O'nun katındadır; onları O'ndan başkası bilmez﴾<\/span> —dikkat edin— <span class=\"ayah\">﴿Karada ve denizde olanı bilir﴾<\/span> —yani cüz'iyyâtı— <span class=\"ayah\">﴿Hiçbir yaprak düşmez ki onu bilmesin﴾<\/span> —bu, cüz'î ilimdir— <span class=\"ayah\">﴿Yerin karanlıklarındaki hiçbir tane, hiçbir yaş ve kuru yoktur ki apaçık bir kitapta olmasın﴾<\/span> [En'âm 59]."], [2747.0, "Allah Azze ve Celle şöyle buyurdu:"], [2748.8, "<span class=\"ayah\">﴿Kıyamet saatinin bilgisi şüphesiz Allah katındadır. Yağmuru O indirir; rahimlerde olanı O bilir. Hiç kimse yarın ne kazanacağını bilemez; hiç kimse hangi yerde öleceğini bilemez. Şüphesiz Allah her şeyi bilendir, her şeyden haberdardır﴾<\/span> [Lokmân 34]."]]}, {"reader": false, "ar": [[2761.0, "ويقول الله عز وجل:"], [2763.3, "<span class=\"ayah\">﴿قَدْ عَلِمْنَا مَا تَنقُصُ الْأَرْضُ مِنْهُمْ﴾<\/span> <span class=\"ref\">[ق: ٤]<\/span>،"], [2766.9, "وهذا العلمُ بالجزئيات ـ وربما تستغربون منّي التنبيهَ على الجزئيات،"], [2772.1, "لأنني سأذكر الحكمة بعد قليلٍ إن شاء الله عز وجل ـ <span class=\"ayah\">﴿قَدْ عَلِمْنَا مَا تَنقُصُ الْأَرْضُ مِنْهُمْ﴾<\/span>."], [2781.0, "وقال الله عز وجل:"], [2783.8, "«ويعلم» <span class=\"ayah\">﴿وَمَا تَغِيضُ الْأَرْحَامُ وَمَا تَزْدَادُ﴾<\/span> <span class=\"ref\">[الرعد: ٨]<\/span>."]], "tr": [[2761.0, "Allah Azze ve Celle şöyle buyurur:"], [2763.3, "<span class=\"ayah\">﴿Toprağın onlardan neyi eksilttiğini elbette biliyoruz﴾<\/span> [Kâf 4]."], [2767.4, "Bu, cüz'iyyâtı bilmektir. —Belki cüz'iyyâta dikkat çekmemi garip karşılıyorsunuz;"], [2772.1, "çünkü birazdan inşallah bunun hikmetini zikredeceğim.— <span class=\"ayah\">﴿Toprağın onlardan neyi eksilttiğini elbette biliyoruz.﴾<\/span> Allah Azze ve Celle şöyle buyurdu:"], [2781.0, "\"(O) bilir\" <span class=\"ayah\">﴿rahimlerin neyi eksik bıraktığını ve neyi artırdığını﴾<\/span> [Ra'd 8]."]]}, {"reader": false, "ar": [[2788.0, "فيجب علينا أن نؤمن بأنّ الله عز وجل هو العالم العليم بكلّ شيء،"], [2797.0, "وأنّ «العليم» اسمُه، وأنّ العلم الكامل المطلق صفتُه الذاتية التي لا تنفكّ عنه لا أزلًا ولا أبدًا،"], [2807.0, "وأنه يعلم الكلّيّات على ما هي عليه،"], [2813.0, "والجزئيات على ما هي عليه،"], [2816.0, "وأنه يعلم ما كان،"], [2818.9, "وما يكون، وما سيكون،"], [2823.0, "وما لم يكن أن لو كان كيف يكون،"], [2829.0, "كما قال الله عز وجل:"], [2831.0, "<span class=\"ayah\">﴿وَلَوْ رُدُّوا لَعَادُوا﴾<\/span> <span class=\"ref\">[الأنعام: ٢٨]<\/span>، مع أنهم لم يُرَدّوا ولن يُرَدّوا،"], [2838.0, "ولكنّ الله عز وجل قد علم أحوالهم."]], "tr": [[2788.0, "Allah Azze ve Celle'nin her şeyi bilen Âlim ve Alîm olduğuna, \"Alîm\"in O'nun ismi olduğuna, kâmil ve mutlak ilmin ezelde de ebedde de O'ndan ayrılmayan zâtî sıfatı olduğuna iman etmemiz vâciptir."], [2805.2, "Yine O'nun küllî meseleleri oldukları gibi, cüz'î meseleleri de oldukları gibi bildiğine;"], [2813.6, "olmuş olanı, olmakta olanı, olacak olanı ve olmamış olanın, olsaydı nasıl olacağını bildiğine (iman etmemiz vâciptir)."], [2824.9, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2829.0, "<span class=\"ayah\">﴿Geri döndürülseler, yine (yasaklandıkları şeye) dönerlerdi﴾<\/span> [En'âm 28]."], [2832.9, "Hâlbuki onlar geri döndürülmediler ve döndürülmeyecekler de;"], [2837.3, "fakat Allah Azze ve Celle onların hâllerini bilmiştir."]]}, {"reader": false, "ar": [[2842.0, "وكما في الصحيحين من حديث أبي هريرة رضي الله عنه،"], [2847.0, "لمّا سُئل النبي صلى الله عليه وسلم عن أطفال المشركين الذين يموتون وهم صغار،"], [2853.0, "ماذا قال؟ «اللهُ أعلمُ بما كانوا عاملين»،"], [2858.0, "مع أنهم لم يعملوا،"], [2860.0, "لكن لو قُدّر أنهم بقُوا وكُلّفوا فإنّ الله عليمٌ بما سيعملونه من خيرٍ أو شرّ،"], [2868.0, "فيكون حسابُهم عليه في الآخرة بناءً على معلومه فيهم؛"], [2877.0, "لأنه يعلم ما لم يكن أن لو كان كيف يكون."]], "tr": [[2842.0, "Sahîhayn'da Ebû Hüreyre (radıyallahu anh) hadisinde olduğu gibi:"], [2845.5, "Nebî ﷺ'e küçükken ölen müşrik çocukları soruldu;"], [2848.3, "ne dedi? «Allah, onların ne yapacaklarını daha iyi bilir.» Hâlbuki onlar (bir şey) yapmadılar;"], [2854.4, "fakat hayatta kalıp mükellef oldukları farz edilse, Allah onların hayır veya şerden ne yapacaklarını bilendir."], [2865.8, "Onların âhiretteki hesabı, O'nun onlar hakkındaki bilgisine göre olur;"], [2877.0, "çünkü O, olmamış olanın, olsaydı nasıl olacağını bilir."]]}, {"reader": false, "ar": [[2882.0, "فإن قلتَ: إننا نمرّ على بعض الآيات تُشكل علينا في مسألة علم الله عز وجل،"], [2892.0, "كقوله: <span class=\"ayah\">﴿وَمَا جَعَلْنَا الْقِبْلَةَ الَّتِي كُنتَ عَلَيْهَا إِلَّا لِنَعْلَمَ﴾<\/span> <span class=\"ref\">[البقرة: ١٤٣]<\/span>،"], [2899.0, "وفي الآية الثانية: «ليعلم الله»."], [2904.0, "فإذا مررتَ في القرآن على لفظة «ليعلم» أو «لنعلم» منسوبةً إلى الله،"], [2912.0, "فإنّ هذا قد يُوهم بأنه لم يكن يعلم،"], [2917.0, "ثم يتجدّد له العلم بعد وقوع الشيء."], [2921.0, "فأقول: هذا من ظنّ الشيطان،"], [2924.2, "ومن ظنّ السوء في الله عز وجل،"], [2928.7, "وهذا لا يجوز اعتقاده."]], "tr": [[2882.0, "\"Allah Azze ve Celle'nin ilmi meselesinde bize müşkil gelen bazı ayetlerle karşılaşıyoruz;"], [2890.0, "<span class=\"ayah\">﴿Senin (önceden) üzerinde bulunduğun kıbleyi ancak bilelim diye kıble yaptık﴾<\/span> [Bakara 143] sözü gibi."], [2901.4, "Başka bir ayette de 'Allah bilsin diye' (buyurur)."], [2906.3, "Kur'an'da Allah'a nispet edilmiş 'bilsin diye' ya da 'bilelim diye' lafzıyla karşılaştığında bu, O'nun (önceden) bilmediği, sonra şeyin meydana gelmesinden sonra O'nun için ilmin yenilendiği vehmini verebilir\" dersen, derim ki:"], [2921.0, "Bu, şeytanın zannındandır ve Allah Azze ve Celle hakkında kötü zandandır; buna inanmak caiz değildir."]]}, {"reader": false, "ar": [[2931.3, "فإن قلتَ: وما الجواب على ذلك؟"], [2937.0, "فأقول: اعلم ـ رحمك الله تعالى ـ أنّ المقصود بمثل هذا التركيب هو ظهورُ المعلوم من الخفاء إلى العلن؛"], [2948.0, "فإنّ المعلوم ينقسم إلى قسمين:"], [2952.0, "معلومٌ قبل وقوعه، وهذا مما اختصّ الله عز وجل بعلمه،"], [2958.0, "ولكنّ الله عز وجل يريد أن يُظهر معلومه إلى الوجود؛"], [2965.0, "فمعلومٌ قبل وجوده، ومعلومٌ بعد وجوده."], [2970.0, "فقوله: «ليعلم الله» أي:"], [2973.0, "ليُظهر معلومَه لكم، فتتبيّن الحقائق ويراها الجميع،"], [2981.0, "ويعلم من اتّبع ممن لم يتّبع،"], [2985.0, "مع أنّ الله عالمٌ بمن يتّبع ومن لم يتّبع،"], [2990.0, "لكن أراد ظهورَ هذا المعلوم فيكم."]], "tr": [[2931.3, "\"Bunun cevabı nedir?\" dersen, derim ki:"], [2937.0, "Bil —Allah Teâlâ sana rahmet etsin— ki bu tür bir terkiple kastedilen, bilinen şeyin gizlilikten açıklığa çıkmasıdır."], [2948.0, "Çünkü bilinen şey iki kısma ayrılır:"], [2952.0, "Meydana gelmeden önce bilinen; bu, Allah Azze ve Celle'nin bilgisine has olan şeylerdendir."], [2958.0, "Fakat Allah Azze ve Celle bildiği şeyi varlık âlemine çıkarmak ister."], [2965.0, "Yani varlığından önce bilinen ve varlığından sonra bilinen."], [2970.0, "O'nun \"Allah bilsin diye\" sözü, \"size bildiğini ortaya çıkarsın diye\" demektir;"], [2973.0, "böylece hakikatler açığa çıkar, herkes onları görür, tâbi olanı tâbi olmayandan ayırt eder."], [2984.3, "Hâlbuki Allah kimin tâbi olacağını ve kimin tâbi olmayacağını bilendir;"], [2989.4, "fakat bu bilineni sizde ortaya çıkarmak istemiştir."]]}, {"reader": false, "ar": [[2992.0, "ويتّضح بمثالٍ بسيط: لو كنتَ تعلم الغدرَ والخيانة من أحد أولادك بقرائنَ أو بأمورٍ أنت تعلمها منه،"], [3003.0, "ولكنه يحاول إخفاء ذلك،"], [3006.0, "فابتليتَه ابتلاءً ليظهر معلومُك فيه لإخوانه،"], [3013.0, "فأعطيتَه مالًا فخانك فيه وسرق مالَك،"], [3023.0, "فتقول له: إنما فعلتُ ذلك لنعلم خيانتك،"], [3029.0, "أي: ليظهر معلومُنا من حيّز الخفاء إلى حيّز العلن ليراه الجميع."]], "tr": [[2992.0, "Bu basit bir örnekle açıklığa kavuşur:"], [2995.0, "Çocuklarından birinin vefasızlığını ve hainliğini birtakım karinelerle ya da ondan bildiğin bazı şeylerle biliyor olsan, fakat o bunu gizlemeye çalışsa;"], [3002.5, "sen de onun hakkında bildiğin şey kardeşlerine görünsün diye onu bir imtihanla denesen:"], [3009.1, "Ona bir mal versen, o da bu malda sana ihanet edip malını çalsa."], [3024.5, "Ona şöyle dersin: \"Bunu ancak hainliğini bilelim diye yaptım.\" Yani bildiğimiz şey herkes görsün diye gizlilik alanından açıklık alanına çıksın diye."]]}]}, {"ts": "50:40", "title": "5. Külliye (devam): Selefin ifadeleri; filozoflar, ilk Kaderiyye, Râfıza'nın bedâ inancı; Âişe'nin sorusu", "paras": [{"reader": false, "ar": [[3040.0, "وعلى ذلك تدور عباراتُ السلف:"], [3043.2, "فمنهم من قال: لنرى معلومَنا،"], [3046.3, "ومنهم من قال: ليتميّز الشيء،"], [3049.5, "ومنهم من قال: لنعلمه موجودًا وواقعًا،"], [3053.3, "ومنهم من قال: ليظهر معلومُه من الخفاء إلى العلن."], [3063.0, "فكلُّ ذلك مما يدلّ على أنه ليس ثمّةَ شيءٌ من العلم يتجدّد لله عز وجل تجدُّدَ ابتداء،"], [3073.8, "وإنما هو ليُظهر معلومَه الذي كان مختصًّا بعلمه،"], [3078.8, "ليعلمه عبادُه ويرونه حقيقةً واقعة."]], "tr": [[3040.0, "Selefin ifadeleri de bunun etrafında döner:"], [3045.1, "Kimisi \"bildiğimizi görelim diye\", kimisi \"şey (diğerinden) ayrılsın diye\", kimisi \"onu var ve gerçekleşmiş olarak bilelim diye\", kimisi de \"bildiği şeyi gizlilikten açıklığa çıkarsın diye\" demiştir."], [3055.2, "Bunların hepsi, Allah Azze ve Celle için ilimden hiçbir şeyin ilk defa (yeni baştan) yenilenmediğine delildir."], [3068.1, "Bu ancak, kendi bilgisine has olan bildiği şeyi, kulları da onu bilsin ve onu gerçekleşmiş bir hakikat olarak görsünler diye ortaya çıkarmak içindir."]]}, {"reader": false, "ar": [[3085.0, "واعلموا أنّ الله لا يحاسب عبدًا على معلومه فيه،"], [3091.0, "وإنما يحاسبه على ظهور معلومه فيه؛"], [3096.0, "ولذلك لا يحاسبك الله على كفرٍ لم يزل في الخفاء،"], [3103.0, "لكن إذا كفرتَ وظهر حاسبك الله."], [3106.0, "فالله لا يحاسب على العلم قبل وجوده،"], [3110.0, "وإنما يحاسب على المعلوم بعد وقوعه."]], "tr": [[3085.0, "Bilin ki Allah bir kulu, onun hakkındaki bilgisine göre hesaba çekmez;"], [3090.3, "ancak onun hakkındaki bilgisinin ortaya çıkmasına göre hesaba çeker."], [3096.0, "Bu yüzden Allah seni, hâlâ gizlilikte kalan bir küfürden dolayı hesaba çekmez;"], [3101.6, "fakat küfredersen ve (küfrün) ortaya çıkarsa Allah seni hesaba çeker."], [3106.0, "Allah, (bilinen şey) var olmadan önceki ilme göre hesaba çekmez;"], [3109.4, "ancak meydana geldikten sonra bilinen şeye göre hesaba çeker."]]}, {"reader": false, "ar": [[3115.0, "فإذا عُلم هذا فليُعلم أنّ كلَّ من زعم أنّ الله إنما يعلم الكلّيّات ولكن لا يعلم الجزئيات ـ كاعتقاد الفلاسفة،"], [3127.0, "والذين منهم ابنُ سينا،"], [3129.5, "وهذه واحدةٌ مما كفّر العلماءُ به ابنَ سينا،"], [3139.0, "لأنه يعتقد أنّ الله إنما يعلم الكلّيّات لا الجزئيات ـ فهذا طعنٌ في علم الله عز وجل."], [3149.0, "ولذلك ما تلوتُه عليكم من الآيات فيها علمُ الله عز وجل بالجزئيات."]], "tr": [[3115.0, "Bu bilindiğine göre şu da bilinsin:"], [3120.1, "Allah'ın yalnızca küllî şeyleri bildiğini, cüz'î şeyleri ise bilmediğini iddia eden herkes —filozofların inancı gibi;"], [3133.3, "İbn Sînâ da onlardandır ve bu, âlimlerin İbn Sînâ'yı tekfir ettiği şeylerden biridir;"], [3149.0, "çünkü o, Allah'ın cüz'îleri değil yalnızca küllîleri bildiğine inanır— (bu iddia) Allah Azze ve Celle'nin ilmine bir ta'ndır."], [3153.7, "Bu yüzden size okuduğum ayetlerde Allah Azze ve Celle'nin cüz'îleri bildiği (anlatılmaktadır)."]]}, {"reader": false, "ar": [[3157.0, "ويدخل فيه كفرُ القدرية الأوائل الذين يزعمون أن لا قدَر،"], [3165.6, "وأنّ الأمر أُنُف، وأنّ الله لا يعلم الشيء إلا بعد وقوعه؛"], [3174.0, "فهذا طعنٌ في علم الله عز وجل،"], [3177.9, "وهذا كفر. ويدخل فيه ما يعتقده الرافضة من عقيدة البَداء على الله عز وجل؛"], [3188.0, "بمعنى أنهم كلّما وعدوا أتباعَهم بخروج المهدي في زمانٍ <span class=\"q\">؟ 53:08<\/span> وتخلّف خروجُه عنه،"], [3197.0, "فإنهم يقولون: قد بدا لله ما لم يَبْدُ له من العلم،"], [3203.0, "فأخّر خروجَه. وهذا طعنٌ في علم الله عز وجل."]], "tr": [[3157.0, "Kader diye bir şey olmadığını, işin yeni başladığını ve Allah'ın bir şeyi ancak meydana geldikten sonra bildiğini iddia eden ilk Kaderiyye'nin küfrü de buna girer."], [3174.0, "Bu, Allah Azze ve Celle'nin ilmine bir ta'ndır ve bu küfürdür."], [3179.0, "Râfıza'nın Allah Azze ve Celle hakkında inandığı bedâ akîdesi de buna girer."], [3188.0, "Yani onlar ne zaman taraftarlarına Mehdî'nin belli bir zamanda <span class=\"q\">؟<\/span> çıkacağını vaat etseler ve onun çıkışı o zamandan geri kalsa, \"Allah'a daha önce kendisine görünmeyen bir bilgi göründü de onun çıkışını erteledi\" derler."], [3205.0, "Bu, Allah Azze ve Celle'nin ilmine bir ta'ndır."]]}, {"reader": false, "ar": [[3210.0, "فإن قلتَ: وماذا تفعل بقول عائشة رضي الله تعالى عنها ـ لمّا أخبرها النبي صلى الله عليه وسلم بأنّ ا
