<script>
const D={"no": 15, "vid": "PkHPtJefgPI", "title_ar": "الدرس (١٥) من شرح كليات العقيدة — تابع: كليات القضاء والقدر (الكلمات والإرادة الكونية والشرعية)", "title_tr": "Şerhu Külliyyâti'l-Akîde — 15. Ders: Kaza ve Kadere Dair Külliyeler (Kevnî ve Şer'î Kelimeler, İrade, Meşîet, Muhabbet; Kevnî Murad Şer'î Murada Vesiledir)", "sections": [{"ts": "00:00", "title": "Giriş: Kaza ve kader külliyelerine devam", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.7, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.5, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [9.1, "أمّا بعد: من باب الاحتياط:"], [11.2, "أحدٌ يسجّل؟ ـ إيه. ـ لا نزال في قَيد شرح الكلّيّات التي تتعلّق بتوحيد الربوبية،"], [19.4, "والتي تتكلّم أيضًا عن فرعٍ من فروع ربوبية الله عز وجل،"], [26.5, "وهي قضاؤه وقدره. وذكرنا جُمَلًا من الكلّيّات المتعلّقة بالقضاء والقدر،"], [38.0, "ونُكمل شيئًا منها هذه الليلة إن شاء الله."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.7, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.1, "Bundan sonra: İhtiyaten soruyorum, kayıt yapan var mı?"], [11.2, "— Evet. — Hâlâ rubûbiyyet tevhidiyle ilgili olan ve Allah Azze ve Celle'nin rubûbiyyetinin fer'lerinden biri olan kaza ve kaderinden de bahseden külliyelerin şerhindeyiz."], [26.5, "Kaza ve kaderle ilgili birkaç külliye zikretmiştik;"], [38.0, "inşallah bu gece onlardan bir kısmını tamamlıyoruz."]]}]}, {"ts": "00:42", "title": "1. Külliye: Rubûbiyyetin tedbiriyle ilgili her kelime kevnîdir", "paras": [{"reader": false, "ar": [[42.0, "من الكلّيّات في هذا الدرس:"], [47.0, "<b>كلُّ كلماتٍ تتعلّق بتدبير ربوبيته فكونيّة.<\/b> كلُّ كلامٍ لله يتعلّق بتدبير ربوبيته فكونيّ،"], [57.0, "أو تقول: كلُّ كلماتٍ تتعلّق بتدبير ربوبيته فكونيّة،"], [65.0, "كلا التعبيرين صحيح. فالكلام الذي يصدر من الله عز وجل ينقسم إلى قسمين:"], [73.0, "إلى كلامٍ كونيّ، وإلى كلامٍ شرعيّ."], [77.0, "وهذه القاعدة في القسم الأول،"], [80.1, "وهي الكلمات الكونية، وعلامتها أنها تتعلّق بشيءٍ من التدبير الكوني."]], "tr": [[42.0, "Bu dersteki külliyelerden biri şudur:"], [47.0, "<b>1. külliye: (Allah'ın) rubûbiyyetinin tedbiriyle ilgili her kelime kevnîdir.<\/b> Allah'ın rubûbiyyetinin tedbiriyle ilgili her kelamı kevnîdir;"], [57.0, "ya da \"Rubûbiyyetinin tedbiriyle ilgili her kelime kevnîdir\" dersin;"], [65.0, "iki ifade de doğrudur. Allah Azze ve Celle'den sâdır olan kelam iki kısma ayrılır:"], [73.0, "kevnî kelam ve şer'î kelam."], [77.0, "Bu kaide birinci kısım, yani kevnî kelimeler hakkındadır."], [80.1, "Alameti, kevnî tedbirden bir şeyle ilgili olmasıdır."]]}, {"reader": false, "ar": [[86.0, "فكلُّ كلامٍ يصدر من الله عز وجل يتعلّق بتدبيره في كونه فإنه يسمّى كلامًا كونيًّا،"], [94.0, "كقول الله عز وجل:"], [96.0, "<span class=\"ayah\">﴿لَا تَبْدِيلَ لِكَلِمَاتِ اللَّهِ﴾<\/span> <span class=\"ref\">[يونس: ٦٤]<\/span>،"], [98.0, "أي الكونية. وكلُّ كلماتٍ نفت الأدلةُ تبديلَها فيُراد بها الكلمات الكونية."], [107.0, "وكقول الله عز وجل:"], [109.3, "<span class=\"ayah\">﴿إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن فَيَكُونُ﴾<\/span> <span class=\"ref\">[يس: ٨٢]<\/span>؛"], [115.0, "فأيُّ آيةٍ فيها «كن» فإنه يتعلّق بالكلام الكوني."], [122.0, "وكقول الله عز وجل:"], [124.7, "<span class=\"ayah\">﴿وَتَمَّتْ كَلِمَتُ رَبِّكَ صِدْقًا وَعَدْلًا﴾<\/span> <span class=\"ref\">[الأنعام: ١١٥]<\/span>،"], [128.0, "أي صدقًا في الأخبار وعدلًا في الأحكام."]], "tr": [[86.0, "Allah Azze ve Celle'den sâdır olup O'nun kâinatındaki tedbiriyle ilgili olan her kelam, kevnî kelam diye adlandırılır."], [94.0, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [96.0, "<span class=\"ayah\">﴿Allah'ın kelimeleri için hiçbir değişiklik yoktur﴾<\/span> [Yûnus 64];"], [98.0, "yani kevnî (kelimeleri). Delillerin değiştirilmesini nefyettiği her kelimeden kevnî kelimeler kastedilir."], [107.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [109.3, "<span class=\"ayah\">﴿Bir şeyi dilediğinde O'nun emri sadece ona \"Ol!\" demektir; o da hemen oluverir﴾<\/span> [Yâsîn 82]."], [115.0, "İçinde \"Ol\" (kün) geçen her ayet kevnî kelamla ilgilidir."], [115.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [124.7, "<span class=\"ayah\">﴿Rabbinin kelimesi doğruluk ve adalet bakımından tamamlanmıştır﴾<\/span> [En'âm 115];"], [128.0, "yani haberlerde doğruluk, hükümlerde adalet bakımından."]]}, {"reader": false, "ar": [[133.0, "وقولُ الله عز وجل ـ بل وقولُه ـ وقولُ الله عز وجل:"], [142.0, "<span class=\"ayah\">﴿وَجَعَلَ كَلِمَةَ الَّذِينَ كَفَرُوا السُّفْلَىٰ ۗ وَكَلِمَةُ اللَّهِ هِيَ الْعُلْيَا﴾<\/span> <span class=\"ref\">[التوبة: ٤٠]<\/span>،"], [148.0, "أي الكلمة الكونية في قول الله عز وجل:"], [151.0, "<span class=\"ayah\">﴿لَأَغْلِبَنَّ أَنَا وَرُسُلِي﴾<\/span> <span class=\"ref\">[المجادلة: ٢١]<\/span>، ولا بدّ من تحقيق مقتضاها."], [156.0, "وكقول الله عز وجل:"], [159.0, "<span class=\"ayah\">﴿وَلَا مُبَدِّلَ لِكَلِمَاتِ اللَّهِ ۚ وَلَقَدْ جَاءَكَ مِن نَّبَإِ الْمُرْسَلِينَ﴾<\/span> <span class=\"ref\">[الأنعام: ٣٤]<\/span>."], [164.0, "وقولُ الله عز وجل:"], [166.0, "<span class=\"ayah\">﴿وَلَوْ أَنَّمَا فِي الْأَرْضِ مِن شَجَرَةٍ أَقْلَامٌ وَالْبَحْرُ يَمُدُّهُ مِن بَعْدِهِ سَبْعَةُ أَبْحُرٍ مَّا نَفِدَتْ كَلِمَاتُ اللَّهِ﴾<\/span> <span class=\"ref\">[لقمان: ٢٧]<\/span>، أي الكلمات الكونية."]], "tr": [[133.0, "Allah Azze ve Celle'nin şu sözü —hatta şu sözü— Allah Azze ve Celle'nin şu sözü:"], [142.0, "<span class=\"ayah\">﴿Kâfirlerin kelimesini alçak kıldı; Allah'ın kelimesi ise en yücedir﴾<\/span> [Tevbe 40];"], [142.0, "yani Allah Azze ve Celle'nin <span class=\"ayah\">﴿Ben ve peygamberlerim mutlaka galip geleceğiz﴾<\/span> [Mücâdele 21] sözündeki kevnî kelime;"], [151.0, "onun gereğinin gerçekleşmesi kaçınılmazdır. Allah Azze ve Celle'nin şu sözü de böyledir:"], [159.0, "<span class=\"ayah\">﴿Allah'ın kelimelerini değiştirebilecek hiç kimse yoktur. Andolsun, gönderilmiş peygamberlerin haberlerinden bir kısmı sana gelmiştir﴾<\/span> [En'âm 34]."], [166.0, "Allah Azze ve Celle'nin şu sözü de:"], [166.0, "<span class=\"ayah\">﴿Yeryüzündeki bütün ağaçlar kalem olsa, deniz de (mürekkep olsa), arkasından yedi deniz daha ona katılsa, Allah'ın kelimeleri yine de tükenmezdi﴾<\/span> [Lokmân 27]; yani kevnî kelimeler."]]}, {"reader": false, "ar": [[180.0, "وقولُ النبي صلى الله عليه وسلم:"], [184.0, "«أعوذ بكلمات الله التامّات من شرّ ما خلق» <span class=\"note\">(Müslim)<\/span>،"], [190.0, "أي الكلمات الكونية. وأيضًا يدلّ عليها قولُ الله عز وجل:"], [195.0, "<span class=\"ayah\">﴿قُل لَّوْ كَانَ الْبَحْرُ مِدَادًا لِّكَلِمَاتِ رَبِّي لَنَفِدَ الْبَحْرُ قَبْلَ أَن تَنفَدَ كَلِمَاتُ رَبِّي وَلَوْ جِئْنَا بِمِثْلِهِ مَدَدًا﴾<\/span> <span class=\"ref\">[الكهف: ١٠٩]<\/span>."], [204.0, "ومن شأن هذه الكلمات أنها تتضمّن أمرًا كونيًّا لا شرعيًّا،"], [212.0, "ومن شأنها لزومُ وقوع مقتضاها؛"], [220.0, "فأيُّ كلمةٍ كونيةٍ فلا بدّ أن يكون لها مقتضًى،"], [224.9, "وهذا المقتضى من شأنه الوقوع،"], [228.0, "ولكنها لا تستلزم أن تكون في الأمر الذي يحبّه ـ يحبّه الله تبارك وتعالى."]], "tr": [[180.0, "Nebî ﷺ'in şu sözü de böyledir:"], [180.0, "«Yarattığı şeylerin şerrinden Allah'ın tam kelimelerine sığınırım» <span class=\"note\">(Müslim)<\/span>;"], [190.0, "yani kevnî kelimeler. Allah Azze ve Celle'nin şu sözü de buna delildir:"], [195.0, "<span class=\"ayah\">﴿De ki: Rabbimin kelimeleri için deniz mürekkep olsa, bir o kadarını daha yardıma getirsek bile, Rabbimin kelimeleri tükenmeden önce deniz tükenirdi﴾<\/span> [Kehf 109]."], [195.0, "Bu kelimelerin özelliği, şer'î değil kevnî bir emri içermeleridir."], [204.0, "Bir diğer özelliği de gereğinin mutlaka meydana gelmesidir."], [212.0, "Her kevnî kelimenin mutlaka bir gereği (muktezâsı) vardır ve bu gereğin şanı meydana gelmektir."], [224.9, "Fakat bu kelimelerin, O'nun —Allah Tebâreke ve Teâlâ'nın— sevdiği bir işte olması gerekmez."]]}]}, {"ts": "03:56", "title": "2. Külliye: Ulûhiyyetin gerekleriyle ilgili her kelam şer'îdir", "paras": [{"reader": false, "ar": [[236.0, "ويوضّح ذلك الكلّيّة التي بعدها:"], [239.0, "<b>كلُّ كلامٍ يتعلّق بمقتضيات ألوهيته فشرعيّ.<\/b> كلُّ كلامٍ يتعلّق بمقتضيات ألوهيته فشرعيّ."], [250.0, "وهي تلك الكلمات التي قد يقع مقتضاها وقد لا يقع،"], [260.0, "ولا تكون إلا في الأمر المحبوب لله عز وجل،"], [264.0, "وتكون مرادةً لذاتها. كالقرآن؛"], [267.8, "فإنّ القرآن كلامُ الله الشرعي،"], [272.0, "كما قال الله عز وجل:"], [274.0, "<span class=\"ayah\">﴿وَإِنْ أَحَدٌ مِّنَ الْمُشْرِكِينَ اسْتَجَارَكَ فَأَجِرْهُ حَتَّىٰ يَسْمَعَ كَلَامَ اللَّهِ﴾<\/span> <span class=\"ref\">[التوبة: ٦]<\/span>."]], "tr": [[236.0, "Bunu, ondan sonraki külliye açıklar:"], [236.0, "<b>2. külliye: (Allah'ın) ulûhiyyetinin gerekleriyle ilgili her kelam şer'îdir.<\/b> (Tekrar ediyor.) Bunlar, gereği bazen meydana gelen bazen gelmeyen kelimelerdir;"], [250.0, "ancak Allah Azze ve Celle'nin sevdiği işte olurlar ve bizzat kendileri için murad edilirler."], [264.0, "Kur'an gibi; çünkü Kur'an, Allah'ın şer'î kelamıdır."], [272.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [274.0, "<span class=\"ayah\">﴿Müşriklerden biri senden eman isterse, Allah'ın kelamını dinleyinceye kadar ona eman ver﴾<\/span> [Tevbe 6]."]]}, {"reader": false, "ar": [[280.0, "ولا يزال أهل السنة يقولون:"], [282.9, "إنّ القرآن كلامُ الله،"], [285.1, "منزَّلٌ غيرُ مخلوق، منه بدأ وإليه يعود."], [289.0, "وكذلك الأحاديث المنسوبة إلى الله عز وجل،"], [293.2, "والمسمّاة بالأحاديث القدسية، فإنها من كلام الله عز وجل الشرعي."]], "tr": [[280.0, "Ehl-i Sünnet öteden beri şöyle der:"], [280.0, "Kur'an Allah'ın kelamıdır; indirilmiştir, mahlûk değildir;"], [285.1, "O'ndan başlamıştır ve O'na dönecektir."], [289.0, "Aynı şekilde Allah Azze ve Celle'ye nispet edilen ve kudsî hadisler diye adlandırılan hadisler de Allah Azze ve Celle'nin şer'î kelamındandır."]]}]}, {"ts": "05:00", "title": "3. Külliye: Rubûbiyyetin tedbiriyle ilgili her murad kevnîdir (kevnî irade)", "paras": [{"reader": false, "ar": [[300.0, "ومن الكلّيّات أيضًا: <b>كلُّ مرادٍ يتعلّق بتدبير ربوبيته فكونيّ.<\/b> ـ لا نزال في (هذه) الأقسام المهمّة ـ كلُّ مرادٍ يتعلّق بتدبير ربوبيته فكونيّ،"], [319.0, "وهي التي يسمّيها أهل السنة بالإرادة الكونية،"], [331.0, "وهي المتعلّقة بـ«كن فيكون»."], [336.0, "ومن شأنها أنه ليس للعبد فيها إرادةٌ ولا اختيار؛"], [343.0, "فما أراده الله عز وجل كونًا فإنّ العبد لا يستطيع أن يغيّره ولا أن يبدّل شيئًا منه."]], "tr": [[300.0, "Külliyelerden biri de şudur: 3."], [300.0, "külliye: (Allah'ın) rubûbiyyetinin tedbiriyle ilgili her murad kevnîdir. —Hâlâ (bu) önemli taksimlerdeyiz.— (Tekrar ediyor.) Bu, Ehl-i Sünnet'in kevnî irade diye adlandırdığı iradedir;"], [319.0, "\"Ol, o da oluverir\" ile ilgili olandır."], [331.0, "Özelliği, kulun onda ne iradesinin ne de ihtiyarının bulunmasıdır."], [336.0, "Allah Azze ve Celle'nin kevnen murad ettiği şeyi kul ne değiştirebilir ne de ondan bir şeyi başkalaştırabilir."]]}, {"reader": false, "ar": [[353.0, "ومرادُها لازمُ الوقوع، ولكن لا يستلزم أن يكون محبوبًا لله عز وجل،"], [361.0, "وليست مرادةً لذاتها، وإنما مرادةٌ لما يترتّب عليها من الحِكَم والمصالح الشرعية،"], [371.0, "كما ستأتينا في كلّيّاتٍ خاصّة إن شاء الله عز وجل."], [374.0, "كما قال الله عز وجل:"], [377.4, "<span class=\"ayah\">﴿إِن كَانَ اللَّهُ يُرِيدُ أَن يُغْوِيَكُمْ﴾<\/span> <span class=\"ref\">[هود: ٣٤]<\/span>، أي بإرادته الكونية."]], "tr": [[353.0, "Onun murad ettiği şeyin meydana gelmesi kaçınılmazdır;"], [353.0, "fakat bunun Allah Azze ve Celle tarafından sevilen bir şey olması gerekmez."], [361.0, "Bizzat kendisi için murad edilmez;"], [361.0, "ancak üzerine terettüp eden şer'î hikmetler ve maslahatlar için murad edilir."], [371.0, "İnşallah Allah Azze ve Celle'nin izniyle bu, özel külliyelerde karşımıza gelecektir."], [374.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [377.4, "<span class=\"ayah\">﴿Eğer Allah sizi azdırmak istiyorsa﴾<\/span> [Hûd 34]; yani kevnî iradesiyle."]]}, {"reader": false, "ar": [[384.0, "وكقوله عز وجل: <span class=\"ayah\">﴿فَمَن يُرِدِ اللَّهُ أَن يَهْدِيَهُ يَشْرَحْ صَدْرَهُ لِلْإِسْلَامِ ۖ وَمَن يُرِدْ أَن يُضِلَّهُ يَجْعَلْ صَدْرَهُ ضَيِّقًا حَرَجًا كَأَنَّمَا يَصَّعَّدُ فِي السَّمَاءِ﴾<\/span> <span class=\"ref\">[الأنعام: ١٢٥]<\/span>،"], [397.0, "وكلا الإرادتين في الآية يُراد بها الإرادة الكونية."], [401.0, "وكقوله عز وجل: <span class=\"ayah\">﴿يُرِيدُ اللَّهُ أَلَّا يَجْعَلَ لَهُمْ حَظًّا فِي الْآخِرَةِ﴾<\/span> <span class=\"ref\">[آل عمران: ١٧٦]<\/span>،"], [409.0, "أي بإرادته الكونية. وقولُ الله عز وجل:"], [413.4, "<span class=\"ayah\">﴿وَلَوْ شَاءَ اللَّهُ مَا اقْتَتَلُوا وَلَٰكِنَّ اللَّهَ يَفْعَلُ مَا يُرِيدُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٣]<\/span>، بإرادته الكونية."]], "tr": [[384.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [384.0, "<span class=\"ayah\">﴿Allah kimi hidayete erdirmek isterse onun göğsünü İslâm'a açar; kimi de saptırmak isterse, göğe çıkıyormuş gibi göğsünü dar ve sıkıntılı kılar﴾<\/span> [En'âm 125]."], [384.0, "Ayetteki her iki iradeden de kevnî irade kastedilir."], [397.0, "Allah Azze ve Celle'nin şu sözü de:"], [401.0, "<span class=\"ayah\">﴿Allah onlara âhirette bir pay vermemeyi istiyor﴾<\/span> [Âl-i İmrân 176];"], [401.0, "yani kevnî iradesiyle. Allah Azze ve Celle'nin şu sözü de:"], [413.4, "<span class=\"ayah\">﴿Allah dileseydi birbirleriyle savaşmazlardı; fakat Allah dilediğini yapar﴾<\/span> [Bakara 253]; kevnî iradesiyle."]]}, {"reader": false, "ar": [[420.0, "وكقوله عز وجل: <span class=\"ayah\">﴿فَعَّالٌ لِّمَا يُرِيدُ﴾<\/span> <span class=\"ref\">[البروج: ١٦]<\/span>،"], [423.9, "أي بإرادته الكونية التي لا معقِّبَ لحكمه فيها،"], [429.2, "ولا غالبَ لأمره فيها."], [433.0, "وكقوله عز وجل: <span class=\"ayah\">﴿فَإِن تَوَلَّوْا فَاعْلَمْ أَنَّمَا يُرِيدُ اللَّهُ أَن يُصِيبَهُم بِبَعْضِ ذُنُوبِهِمْ﴾<\/span> <span class=\"ref\">[المائدة: ٤٩]<\/span>،"], [442.1, "أي بإرادته الكونية. وكقوله عز وجل:"], [446.0, "<span class=\"ayah\">﴿فَلَا تُعْجِبْكَ أَمْوَالُهُمْ وَلَا أَوْلَادُهُمْ ۚ إِنَّمَا يُرِيدُ اللَّهُ لِيُعَذِّبَهُم بِهَا فِي الْحَيَاةِ الدُّنْيَا﴾<\/span> <span class=\"ref\">[التوبة: ٥٥]<\/span>، يعني بإرادته الكونية."]], "tr": [[420.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [420.0, "<span class=\"ayah\">﴿Dilediğini yapandır﴾<\/span> [Bürûc 16]; yani hükmünü bozacak kimsenin bulunmadığı ve emrine galip gelecek kimsenin olmadığı kevnî iradesiyle."], [433.0, "Allah Azze ve Celle'nin şu sözü de:"], [433.0, "<span class=\"ayah\">﴿Eğer yüz çevirirlerse bil ki Allah, bazı günahları sebebiyle onları musibete uğratmak istiyor﴾<\/span> [Mâide 49];"], [442.1, "yani kevnî iradesiyle. Allah Azze ve Celle'nin şu sözü de:"], [446.0, "<span class=\"ayah\">﴿Onların malları ve evlatları seni imrendirmesin. Allah bunlarla onlara ancak dünya hayatında azap etmek istiyor﴾<\/span> [Tevbe 55]; yani kevnî iradesiyle."]]}]}, {"ts": "07:36", "title": "4. Külliye: Ulûhiyyetin gerekleriyle ilgili her murad şer'î ve dînîdir (şer'î irade)", "paras": [{"reader": false, "ar": [[458.0, "ويوضّح ذلك الكلّيّة التي بعدها،"], [461.3, "وهي: <b>كلُّ مرادٍ متعلّقٍ بمقتضيات ألوهيته فشرعيٌّ دينيّ.<\/b> كلُّ مرادٍ متعلّقٍ بمقتضيات ألوهيته فشرعيٌّ دينيّ."], [475.0, "وهي التي يسمّيها أهل السنة بالإرادة الشرعية،"], [488.0, "وعلامتها أنها لا تكون إلا في محبوبات الله عز وجل،"], [495.0, "وأنها قد تقع وقد لا تقع،"], [499.0, "وأنها مرادةٌ لذاتها، وأنّ للعبد فيها اختيارًا وقُدرةً."]], "tr": [[458.0, "Bunu, ondan sonraki külliye açıklar;"], [458.0, "o da şudur: 4. külliye:"], [461.3, "(Allah'ın) ulûhiyyetinin gerekleriyle ilgili her murad şer'î ve dînîdir. (Tekrar ediyor.) Bu, Ehl-i Sünnet'in şer'î irade diye adlandırdığı iradedir."], [475.0, "Alameti şudur: Ancak Allah Azze ve Celle'nin sevdiği şeylerde olur;"], [488.0, "bazen meydana gelir, bazen gelmez;"], [495.0, "bizzat kendisi için murad edilir;"], [499.0, "kulun onda ihtiyarı ve kudreti vardır."]]}, {"reader": false, "ar": [[508.0, "كقول الله عز وجل:"], [510.7, "<span class=\"ayah\">﴿يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ﴾<\/span> <span class=\"ref\">[البقرة: ١٨٥]<\/span>،"], [516.0, "أي بإرادته الشرعية. وقولُ الله عز وجل:"], [519.7, "<span class=\"ayah\">﴿يُرِيدُ اللَّهُ أَن يُخَفِّفَ عَنكُمْ﴾<\/span> <span class=\"ref\">[النساء: ٢٨]<\/span>،"], [521.8, "أي بإرادته الشرعية. وقولُ الله عز وجل:"], [525.5, "<span class=\"ayah\">﴿يُرِيدُ اللَّهُ لِيُبَيِّنَ لَكُمْ وَيَهْدِيَكُمْ سُنَنَ الَّذِينَ مِن قَبْلِكُمْ﴾<\/span> <span class=\"ref\">[النساء: ٢٦]<\/span>،"], [531.1, "أي بإرادته الشرعية. وقولُ الله عز وجل:"], [535.2, "<span class=\"ayah\">﴿وَاللَّهُ يُرِيدُ أَن يَتُوبَ عَلَيْكُمْ﴾<\/span> <span class=\"ref\">[النساء: ٢٧]<\/span>، بإرادته الشرعية."]], "tr": [[508.0, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [510.7, "<span class=\"ayah\">﴿Allah sizin için kolaylık ister, zorluk istemez﴾<\/span> [Bakara 185];"], [516.0, "yani şer'î iradesiyle. Allah Azze ve Celle'nin şu sözü:"], [519.7, "<span class=\"ayah\">﴿Allah sizden (yükü) hafifletmek ister﴾<\/span> [Nisâ 28];"], [521.8, "yani şer'î iradesiyle. Allah Azze ve Celle'nin şu sözü:"], [525.5, "<span class=\"ayah\">﴿Allah size açıklamak ve sizi sizden öncekilerin yollarına iletmek ister﴾<\/span> [Nisâ 26];"], [525.5, "yani şer'î iradesiyle. Allah Azze ve Celle'nin şu sözü:"], [535.2, "<span class=\"ayah\">﴿Allah sizin tevbenizi kabul etmek ister﴾<\/span> [Nisâ 27]; şer'î iradesiyle."]]}, {"reader": false, "ar": [[539.0, "وقولُ الله عز وجل:"], [540.5, "«ما يريد» ـ وهي إرادةٌ منفيّةٌ هنا ـ:"], [543.0, "<span class=\"ayah\">﴿مَا يُرِيدُ اللَّهُ لِيَجْعَلَ عَلَيْكُم مِّنْ حَرَجٍ﴾<\/span> <span class=\"ref\">[المائدة: ٦]<\/span>،"], [547.2, "أي بإرادته الشرعية. وقولُ الله عز وجل:"], [551.6, "<span class=\"ayah\">﴿إِنَّمَا يُرِيدُ اللَّهُ لِيُذْهِبَ عَنكُمُ الرِّجْسَ أَهْلَ الْبَيْتِ وَيُطَهِّرَكُمْ تَطْهِيرًا﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٣]<\/span>،"], [558.1, "أي بإرادته الشرعية. فأيُّ إرادةٍ متعلّقةٍ بأمرٍ كونيٍّ فكونيّة،"], [563.7, "وأيُّ إرادةٍ شرعيةٍ متعلّقةٍ بأمرٍ شرعيٍّ فشرعيّة."]], "tr": [[539.0, "Allah Azze ve Celle'nin \"istemez\" sözü —burada nefyedilmiş bir iradedir—:"], [543.0, "<span class=\"ayah\">﴿Allah size hiçbir güçlük çıkarmak istemez﴾<\/span> [Mâide 6];"], [547.2, "yani şer'î iradesiyle. Allah Azze ve Celle'nin şu sözü:"], [551.6, "<span class=\"ayah\">﴿Ey ehl-i beyt! Allah sizden ancak kiri gidermek ve sizi tertemiz yapmak ister﴾<\/span> [Ahzâb 33];"], [551.6, "yani şer'î iradesiyle. Kevnî bir işle ilgili her irade kevnîdir;"], [558.1, "şer'î bir işle ilgili her şer'î irade de şer'îdir."]]}]}, {"ts": "09:28", "title": "5. Külliye: Kur'an'da Allah'a nispet edilen her meşîet kevnî iradedir", "paras": [{"reader": false, "ar": [[568.0, "ويوضّح ذلك الكلّيّة التي بعدها:"], [571.0, "<b>كلُّ مشيئةٍ في القرآن ـ كلُّ مشيئةٍ لله في القرآن ـ فإرادةٌ كونيّة.<\/b> كلُّ مشيئةٍ لله في القرآن فهي الإرادة الكونية."], [585.0, "كلُّ مشيئةٍ لله في القرآن فهي الإرادة الكونية."], [591.0, "فمتى ما رأيتَ الله في كتابه الكريم ينسب المشيئةَ له في قوله:"], [597.5, "«شاء الله» أو «شئنا» أو «شاء ربك» ونحو ذلك،"], [602.1, "فاعلم أنه الآن يريد أن يتكلّم عن الإرادة الكونية."]], "tr": [[568.0, "Bunu, ondan sonraki külliye açıklar:"], [571.0, "<b>5. külliye: Kur'an'daki her meşîet —Kur'an'da Allah'a ait her meşîet (dileme)— kevnî iradedir.<\/b> (İki kez tekrar ediyor.) Allah'ın, Kerîm Kitabı'nda \"Allah dileseydi\", \"Biz dileseydik\", \"Rabbin dileseydi\" ve benzeri sözlerle meşîeti kendisine nispet ettiğini gördüğün her yerde bil ki, O şimdi kevnî iradeden bahsetmek istiyor."]]}, {"reader": false, "ar": [[607.0, "كقول الله عز وجل:"], [609.0, "<span class=\"ayah\">﴿وَلَوْ شَاءَ رَبُّكَ﴾<\/span> ـ أي بإرادته الكونية ـ <span class=\"ayah\">﴿لَآمَنَ مَن فِي الْأَرْضِ كُلُّهُمْ جَمِيعًا﴾<\/span> <span class=\"ref\">[يونس: ٩٩]<\/span>."], [615.0, "وقولُ الله عز وجل:"], [616.9, "<span class=\"ayah\">﴿وَلَوْ شَاءَ﴾<\/span> ـ أي بإرادته الكونية ـ <span class=\"ayah\">﴿مَا اقْتَتَلُوا وَلَٰكِنَّ اللَّهَ يَفْعَلُ مَا يُرِيدُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٣]<\/span>."], [622.0, "وقولُ الله عز وجل:"], [624.5, "<span class=\"ayah\">﴿وَلَوْ شِئْنَا﴾<\/span> ـ أي بإرادتنا الكونية ـ <span class=\"ayah\">﴿لَآتَيْنَا كُلَّ نَفْسٍ هُدَاهَا﴾<\/span> <span class=\"ref\">[السجدة: ١٣]<\/span>."], [630.0, "وقولُ الله عز وجل:"], [632.7, "<span class=\"ayah\">﴿وَلَوْ شَاءَ اللَّهُ﴾<\/span> ـ أي بإرادته الكونية ـ <span class=\"ayah\">﴿لَذَهَبَ بِسَمْعِهِمْ وَأَبْصَارِهِمْ﴾<\/span> <span class=\"ref\">[البقرة: ٢٠]<\/span>."]], "tr": [[607.0, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [609.0, "<span class=\"ayah\">﴿Rabbin dileseydi﴾<\/span> —yani kevnî iradesiyle— <span class=\"ayah\">﴿yeryüzündekilerin hepsi topyekûn iman ederdi﴾<\/span> [Yûnus 99]."], [615.0, "Allah Azze ve Celle'nin şu sözü:"], [616.9, "<span class=\"ayah\">﴿(Allah) dileseydi﴾<\/span> —yani kevnî iradesiyle— <span class=\"ayah\">﴿birbirleriyle savaşmazlardı; fakat Allah dilediğini yapar﴾<\/span> [Bakara 253]."], [622.0, "Allah Azze ve Celle'nin şu sözü:"], [624.5, "<span class=\"ayah\">﴿Dileseydik﴾<\/span> —yani kevnî irademizle— <span class=\"ayah\">﴿her nefse hidayetini verirdik﴾<\/span> [Secde 13]."], [630.0, "Allah Azze ve Celle'nin şu sözü:"], [632.7, "<span class=\"ayah\">﴿Allah dileseydi﴾<\/span> —yani kevnî iradesiyle— <span class=\"ayah\">﴿onların işitmelerini ve görmelerini giderirdi﴾<\/span> [Bakara 20]."]]}, {"reader": false, "ar": [[640.0, "وقولُ الله عز وجل:"], [642.7, "<span class=\"ayah\">﴿وَلَوْ شَاءَ اللَّهُ﴾<\/span> ـ أي بإرادته الكونية ـ <span class=\"ayah\">﴿لَأَعْنَتَكُمْ﴾<\/span> <span class=\"ref\">[البقرة: ٢٢٠]<\/span>،"], [647.4, "أي لضيّق عليكم. وقال الله عز وجل:"], [654.6, "<span class=\"ayah\">﴿وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ إِلَّا بِمَا شَاءَ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>،"], [659.8, "أي بما شاء أن يحيطوا به بإرادته الكونية."], [665.0, "وقال الله عز وجل:"], [667.5, "<span class=\"ayah\">﴿وَلَوْ شَاءَ اللَّهُ لَجَمَعَهُمْ عَلَى الْهُدَىٰ﴾<\/span> <span class=\"ref\">[الأنعام: ٣٥]<\/span>، أي بإرادته الكونية."]], "tr": [[640.0, "Allah Azze ve Celle'nin şu sözü:"], [642.7, "<span class=\"ayah\">﴿Allah dileseydi﴾<\/span> —yani kevnî iradesiyle— <span class=\"ayah\">﴿sizi sıkıntıya sokardı﴾<\/span> [Bakara 220];"], [642.7, "yani size darlık verirdi. Allah Azze ve Celle şöyle buyurmuştur:"], [654.6, "<span class=\"ayah\">﴿Onlar O'nun ilminden, dilediği kadarı dışında hiçbir şeyi kavrayamazlar﴾<\/span> [Bakara 255];"], [659.8, "yani kevnî iradesiyle kavramalarını dilediği kadarı."], [665.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [667.5, "<span class=\"ayah\">﴿Allah dileseydi onları hidayet üzerinde toplardı﴾<\/span> [En'âm 35]; yani kevnî iradesiyle."]]}, {"reader": false, "ar": [[673.0, "وقال الله عز وجل:"], [675.0, "<span class=\"ayah\">﴿وَلَوْ شَاءَ اللَّهُ مَا أَشْرَكُوا﴾<\/span> <span class=\"ref\">[الأنعام: ١٠٧]<\/span>،"], [677.5, "أي ما وقع الشرك إلا بمشيئته،"], [680.5, "أي بإرادته الكونية التي لا تستلزم المحبة ولا الرضا."], [685.0, "وقولُ الله عز وجل:"], [687.5, "<span class=\"ayah\">﴿وَلَوْ شَاءَ اللَّهُ﴾<\/span> ـ أي بإرادته الكونية ـ <span class=\"ayah\">﴿لَجَعَلَكُمْ أُمَّةً وَاحِدَةً﴾<\/span> <span class=\"ref\">[المائدة: ٤٨]<\/span>."], [693.0, "وقال الله عز وجل:"], [695.6, "<span class=\"ayah\">﴿يُوحِي بَعْضُهُمْ إِلَىٰ بَعْضٍ زُخْرُفَ الْقَوْلِ غُرُورًا ۚ وَلَوْ شَاءَ رَبُّكَ مَا فَعَلُوهُ﴾<\/span> <span class=\"ref\">[الأنعام: ١١٢]<\/span> <span class=\"note\">(Şeyh ayete «ولو يوحي» diye başlıyor.)<\/span>،"], [702.0, "فلو شاء الله بإرادته الكونية ألّا يكون شيءٌ من ذلك لما كان."], [710.0, "وهي التي نقول فيها:"], [711.5, "ما شاء الله كان،"], [713.0, "وما لم يشأ لم يكن."]], "tr": [[673.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [675.0, "<span class=\"ayah\">﴿Allah dileseydi şirk koşmazlardı﴾<\/span> [En'âm 107];"], [677.5, "yani şirk ancak O'nun meşîetiyle, yani sevgiyi ve rızayı gerektirmeyen kevnî iradesiyle meydana geldi."], [687.5, "Allah Azze ve Celle'nin şu sözü:"], [687.5, "<span class=\"ayah\">﴿Allah dileseydi﴾<\/span> —yani kevnî iradesiyle— <span class=\"ayah\">﴿sizi tek bir ümmet yapardı﴾<\/span> [Mâide 48]."], [695.6, "Allah Azze ve Celle şöyle buyurmuştur:"], [695.6, "<span class=\"ayah\">﴿Aldatmak için birbirlerine yaldızlı sözler fısıldarlar. Rabbin dileseydi bunu yapmazlardı﴾<\/span> [En'âm 112]."], [695.6, "Allah kevnî iradesiyle bunlardan hiçbir şeyin olmamasını dileseydi, o şey olmazdı."], [702.0, "\"Allah'ın dilediği olur, dilemediği olmaz\" dediğimiz irade budur."]]}, {"reader": false, "ar": [[716.0, "وكقول الله عز وجل:"], [718.2, "<span class=\"ayah\">﴿وَلَوْ شِئْنَا لَرَفَعْنَاهُ بِهَا وَلَٰكِنَّهُ أَخْلَدَ إِلَى الْأَرْضِ وَاتَّبَعَ هَوَاهُ﴾<\/span> <span class=\"ref\">[الأعراف: ١٧٦]<\/span>."], [724.0, "وقولُ الله عز وجل:"], [726.5, "<span class=\"ayah\">﴿وَلَوْ شَاءَ لَهَدَاكُمْ أَجْمَعِينَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٤٩]<\/span>."], [729.0, "وقولُ الله عز وجل:"], [731.0, "<span class=\"ayah\">﴿وَلَوْ شِئْنَا لَبَعَثْنَا فِي كُلِّ قَرْيَةٍ نَّذِيرًا﴾<\/span> <span class=\"ref\">[الفرقان: ٥١]<\/span>."], [735.0, "وقولُ الله عز وجل:"], [737.0, "<span class=\"ayah\">﴿وَلَوْ شِئْنَا لَآتَيْنَا كُلَّ نَفْسٍ هُدَاهَا﴾<\/span> <span class=\"ref\">[السجدة: ١٣]<\/span>."]], "tr": [[716.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [718.2, "<span class=\"ayah\">﴿Dileseydik onu o (ayetler) sayesinde yüceltirdik; fakat o yere (dünyaya) meyletti ve hevesine uydu﴾<\/span> [A'râf 176]."], [724.0, "Allah Azze ve Celle'nin şu sözü:"], [726.5, "<span class=\"ayah\">﴿Dileseydi hepinizi hidayete erdirirdi﴾<\/span> [En'âm 149]."], [729.0, "Allah Azze ve Celle'nin şu sözü:"], [731.0, "<span class=\"ayah\">﴿Dileseydik her şehre bir uyarıcı gönderirdik﴾<\/span> [Furkân 51]."], [735.0, "Allah Azze ve Celle'nin şu sözü:"], [737.0, "<span class=\"ayah\">﴿Dileseydik her nefse hidayetini verirdik﴾<\/span> [Secde 13]."]]}, {"reader": false, "ar": [[740.0, "فمتى ما رأيتَ المشيئة منسوبةً إلى الله عز وجل فاعلم أنه لا يريد بها إلا إرادته الكونية."], [748.0, "فإيّاك ـ يا طالب العلم ـ أن تقسّم مشيئة الله إلى كونيةٍ وشرعية!"], [755.0, "لا، بل المشيئة المضافة إلى الله إنما يُراد بها الكونية فقط."]], "tr": [[740.0, "Meşîetin Allah Azze ve Celle'ye nispet edildiğini gördüğün her yerde bil ki, O bununla ancak kevnî iradesini kastediyor."], [748.0, "Ey ilim talebesi! Sakın Allah'ın meşîetini kevnî ve şer'î diye ikiye ayırma!"], [755.0, "Hayır, Allah'a izafe edilen meşîetten sadece kevnî irade kastedilir."]]}]}, {"ts": "12:41", "title": "6. Külliye: Kur'an'da Allah'a ait her muhabbet ve rıza şer'î iradedir", "paras": [{"reader": false, "ar": [[761.0, "ويوضّح ذلك الكلّيّة التي بعدها:"], [764.0, "<b>كلُّ محبّةٍ ورضًا لله تعالى في القرآن فهي الإرادة الشرعية.<\/b> كلُّ محبّةٍ ورضًا لله عز وجل في القرآن فهي الإرادة الشرعية."], [785.0, "كقول الله عز وجل:"], [787.8, "<span class=\"ayah\">﴿وَلَا يَرْضَىٰ﴾<\/span> ـ أي شرعًا ـ <span class=\"ayah\">﴿لِعِبَادِهِ الْكُفْرَ﴾<\/span> <span class=\"ref\">[الزمر: ٧]<\/span>."], [797.0, "وقولُ الله عز وجل:"], [798.5, "<span class=\"ayah\">﴿إِنَّ اللَّهَ يُحِبُّ الْمُحْسِنِينَ﴾<\/span> <span class=\"ref\">[البقرة: ١٩٥]<\/span>،"], [800.0, "أي يريد الإحسانَ بإرادته الشرعية."]], "tr": [[761.0, "Bunu, ondan sonraki külliye açıklar:"], [764.0, "<b>6. külliye: Kur'an'da Allah Teâlâ'ya ait her muhabbet (sevgi) ve rıza şer'î iradedir.<\/b> (Tekrar ediyor.) Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [787.8, "<span class=\"ayah\">﴿Kullarının küfrüne﴾<\/span> —yani şer'an— <span class=\"ayah\">﴿razı olmaz﴾<\/span> [Zümer 7]."], [787.8, "Allah Azze ve Celle'nin şu sözü:"], [798.5, "<span class=\"ayah\">﴿Şüphesiz Allah ihsan edenleri sever﴾<\/span> [Bakara 195];"], [800.0, "yani ihsanı şer'î iradesiyle ister."]]}, {"reader": false, "ar": [[804.0, "<span class=\"ayah\">﴿يُحِبُّ الصَّابِرِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ١٤٦]<\/span>، أي يحبّ من عباده الصبرَ بإرادته الشرعية."], [810.0, "<span class=\"ayah\">﴿يُحِبُّ الْمُتَّقِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ٧٦]<\/span>، أي يحبّ التقوى من عباده بإرادته الشرعية."], [815.0, "<span class=\"ayah\">﴿يُحِبُّ الْمُتَوَكِّلِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ١٥٩]<\/span>، أي بإرادته الشرعية."], [819.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ﴾<\/span> <span class=\"ref\">[البقرة: ٢٢٢]<\/span>،"], [822.0, "أي يحبّ من عباده أن يتوبوا بإرادته الشرعية."], [826.0, "<span class=\"ayah\">﴿لَا يُحِبُّ الظَّالِمِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ٥٧]<\/span>، أي لا يحبّ الظلمَ ولا وقوعَه من عباده بإرادته الشرعية."], [833.0, "ومثلُها: <span class=\"ayah\">﴿لَا يُحِبُّ الْخَائِنِينَ﴾<\/span> <span class=\"ref\">[الأنفال: ٥٨]<\/span>."]], "tr": [[804.0, "<span class=\"ayah\">﴿Sabredenleri sever﴾<\/span> [Âl-i İmrân 146];"], [804.0, "yani şer'î iradesiyle kullarından sabrı sever."], [804.0, "<span class=\"ayah\">﴿Takvâ sahiplerini sever﴾<\/span> [Âl-i İmrân 76];"], [810.0, "yani şer'î iradesiyle kullarından takvâyı sever."], [815.0, "<span class=\"ayah\">﴿Tevekkül edenleri sever﴾<\/span> [Âl-i İmrân 159];"], [815.0, "yani şer'î iradesiyle. <span class=\"ayah\">﴿Şüphesiz Allah çok tevbe edenleri sever﴾<\/span> [Bakara 222];"], [822.0, "yani şer'î iradesiyle kullarının tevbe etmesini sever."], [826.0, "<span class=\"ayah\">﴿Zalimleri sevmez﴾<\/span> [Âl-i İmrân 57];"], [826.0, "yani şer'î iradesiyle zulmü ve onun kullarından sâdır olmasını sevmez."], [833.0, "Bunun benzeri: <span class=\"ayah\">﴿Hainleri sevmez﴾<\/span> [Enfâl 58]."]]}, {"reader": false, "ar": [[836.0, "وقولُ الله عز وجل:"], [839.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ لَا يُحِبُّ مَن كَانَ مُخْتَالًا فَخُورًا﴾<\/span> <span class=\"ref\">[النساء: ٣٦]<\/span>،"], [843.0, "أي لا يحبّ الاختيالَ والفخرَ بإرادته الشرعية."], [847.0, "وكقوله عز وجل: <span class=\"ayah\">﴿لَّا يُحِبُّ اللَّهُ الْجَهْرَ بِالسُّوءِ مِنَ الْقَوْلِ إِلَّا مَن ظُلِمَ﴾<\/span> <span class=\"ref\">[النساء: ١٤٨]<\/span>،"], [854.0, "أي لا يحبّ من عباده أن يصدر منهم شيءٌ من ذلك."], [858.0, "فمتى ما رأيتَ الرضا والمحبّة منسوبةً إلى الله عز وجل فاعلم أنه يريد به إرادته الشرعية،"], [869.0, "التي قد تقع وقد لا تقع،"], [871.7, "ولا تكون إلا في محبوباته."]], "tr": [[836.0, "Allah Azze ve Celle'nin şu sözü:"], [839.0, "<span class=\"ayah\">﴿Şüphesiz Allah kibirlenen ve böbürlenen kimseyi sevmez﴾<\/span> [Nisâ 36];"], [839.0, "yani şer'î iradesiyle kibirlenmeyi ve böbürlenmeyi sevmez."], [843.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [847.0, "<span class=\"ayah\">﴿Allah, zulme uğrayan müstesna, kötü sözün açıkça söylenmesini sevmez﴾<\/span> [Nisâ 148];"], [847.0, "yani kullarından böyle bir şeyin sâdır olmasını sevmez."], [854.0, "Rızanın ve muhabbetin Allah Azze ve Celle'ye nispet edildiğini gördüğün her yerde bil ki, O bununla bazen meydana gelen bazen gelmeyen ve ancak sevdiği şeylerde olan şer'î iradesini kastediyor."]]}]}, {"ts": "14:34", "title": "7. Külliye: Meydana gelen ve (Allah'ın) sevdiği her şey iki iradeyle de murad edilmiştir", "paras": [{"reader": false, "ar": [[874.0, "ويوضّح ذلك الكلّيّة التي بعدها:"], [878.0, "<b>كلُّ واقعٍ محبوبٍ فمرادٌ بالإرادتين.<\/b> كلُّ واقعٍ محبوبٍ فمرادٌ بالإرادتين؛"], [885.2, "كإيمان أبي بكرٍ وعمرَ وعثمانَ وعليٍّ والمهاجرين والأنصار،"], [890.5, "وإيمانِ من تحقّق إيمانه من أهل الإسلام."], [901.0, "فلأنه وقع في الكون صار مرادًا كونيًّا،"], [905.5, "ولأنه يحبّه الله ويرضاه صار مرادًا شرعيًّا."], [910.0, "وكأعمال البرّ والطاعات التي يفعلها العبد في أرض الله عز وجل:"], [916.0, "فلوقوعها فهي كونية، ولأنه يحبّها فشرعية."]], "tr": [[874.0, "Bunu, ondan sonraki külliye açıklar:"], [874.0, "<b>7. külliye: Meydana gelen ve (Allah'ın) sevdiği her şey iki iradeyle de murad edilmiştir.<\/b> (Tekrar ediyor.) Ebû Bekir'in, Ömer'in, Osman'ın, Ali'nin, Muhâcirlerin ve Ensâr'ın imanı ve Müslümanlardan imanı gerçekleşmiş olan herkesin imanı gibi."], [890.5, "Kâinatta meydana geldiği için kevnî murad olmuş;"], [901.0, "Allah onu sevdiği ve ondan razı olduğu için de şer'î murad olmuştur."], [905.5, "Kulun Allah Azze ve Celle'nin yeryüzünde yaptığı iyilikler ve taatler de böyledir:"], [910.0, "Meydana geldikleri için kevnîdirler; Allah onları sevdiği için de şer'îdirler."]]}]}, {"ts": "15:21", "title": "8. Külliye: Kâinatta meydana gelen ve Allah'ın sevmediği her şey sadece kevnî iradeyle murad edilmiştir", "paras": [{"reader": false, "ar": [[921.0, "ويوضّح ذلك الكلّيّة التي بعدها:"], [926.0, "<b>كلُّ واقعٍ في الكون ممّا لا يحبّه الله ولا يرضاه فمرادٌ بالإرادة الكونية.<\/b> كلُّ واقعٍ في الكون ممّا لا يحبّه الله ولا يرضاه فمرادٌ بإرادته الكونية."], [943.0, "كخلق إبليس وكفره، فمرادٌ بالإرادة الكونية فقط."], [953.0, "ووقوعُ الكفر في أرض الله مرادٌ بإرادته الكونية فقط."], [958.0, "ووقوعُ البدع والمعاصي والآثام والفواحش ما ظهر منها وما بطن،"], [967.0, "ووقوعُ الظلم والخيانة والكذب والسرقة وغيرها،"], [973.0, "كلُّ ذلك واقعٌ في كون الله،"], [976.2, "ولكنه ممّا لا يحبّه الله ولا يرضاه."]], "tr": [[921.0, "Bunu, ondan sonraki külliye açıklar:"], [921.0, "<b>8. külliye: Kâinatta meydana gelip de Allah'ın sevmediği ve razı olmadığı her şey kevnî iradeyle murad edilmiştir.<\/b> (Tekrar ediyor.) İblis'in yaratılması ve küfrü gibi;"], [926.0, "bu sadece kevnî iradeyle murad edilmiştir."], [926.0, "Allah'ın yeryüzünde küfrün meydana gelmesi sadece O'nun kevnî iradesiyle murad edilmiştir."], [953.0, "Bid'atların, isyanların, günahların, açığı ve gizlisiyle hayâsızlıkların meydana gelmesi;"], [958.0, "zulmün, hıyanetin, yalanın, hırsızlığın ve benzerlerinin meydana gelmesi;"], [967.0, "bunların hepsi Allah'ın kâinatında meydana gelmektedir, fakat Allah'ın sevmediği ve razı olmadığı şeylerdendir."]]}, {"reader": false, "ar": [[980.0, "فإذا رأيتَ شيئًا في كون الله وقد وقع،"], [984.0, "ولكن لا يحبّه الله،"], [986.0, "فاعلم أنه إنما وقع بإرادته الكونية."], [989.0, "وهو الذي أعيا الجبريةَ والقدريةَ أن يفهموه؛"], [993.0, "لأنّ القدرية يجعلون من لوازم الإرادة الكونية المحبّة،"], [999.0, "فلا يريد الله كونًا إلا ما يحبّه شرعًا."], [1003.0, "والقدرية لا يفهمون من وقوع الشيء إلا أنّ الله يحبّه؛"], [1010.0, "فلمّا رأوا الذنوب والمعاصي تصدر من العباد وقد وقعت في الكون ـ وقد كانوا يقرّرون أن لا واقعَ إلا أن يكون محبوبًا ـ فقالوا:"], [1023.7, "إذن العبد هو الذي يخلقها،"], [1027.0, "والله لم يقدّرها، والله لم يقدّرها."]], "tr": [[980.0, "Allah'ın kâinatında meydana gelmiş ama Allah'ın sevmediği bir şey gördüğünde bil ki, o ancak O'nun kevnî iradesiyle meydana gelmiştir."], [989.0, "Cebriyye'yi ve Kaderiyye'yi anlamaktan aciz bırakan şey budur."], [993.0, "Çünkü Kaderiyye sevgiyi kevnî iradenin lâzımlarından sayar;"], [993.0, "(onlara göre) Allah kevnen ancak şer'an sevdiği şeyi murad eder."], [999.0, "Kaderiyye bir şeyin meydana gelmesinden, Allah'ın onu sevdiğinden başka bir şey anlamaz."], [1010.0, "Günahların ve isyanların kullardan sâdır olup kâinatta meydana geldiğini görünce —ki onlar sevilen şeyden başka hiçbir şeyin meydana gelmeyeceğini takrir ediyorlardı— \"O hâlde onları yaratan kuldur;"], [1023.7, "Allah onları takdir etmemiştir\" dediler. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1031.0, "وهذه الكلّيّة تُجيبك عن السؤال الذي أعيا الجبريةَ والقدريةَ أن يُجيبوا عليه:"], [1038.0, "هل الله يريد المعصية؟"], [1040.0, "فإيّاك أن تقول: لا يريدها مطلقًا،"], [1043.0, "أو تقول: يريدها مطلقًا،"], [1046.0, "وإنما لا بدّ من التفصيل بين الإرادتين؛"], [1049.0, "فتقول: الله يريد ذلك بإرادته الكونية،"], [1053.0, "ولكن لا يريده بإرادته الشرعية."], [1056.0, "كما قال الله عز وجل:"], [1058.0, "<span class=\"ayah\">﴿إِن تَكْفُرُوا﴾<\/span> ـ أي كونًا ـ <span class=\"ayah\">﴿فَإِنَّ اللَّهَ غَنِيٌّ عَنكُمْ ۖ وَلَا يَرْضَىٰ﴾<\/span> ـ أي شرعًا ـ <span class=\"ayah\">﴿لِعِبَادِهِ الْكُفْرَ﴾<\/span> <span class=\"ref\">[الزمر: ٧]<\/span>."]], "tr": [[1031.0, "Bu külliye, Cebriyye'yi ve Kaderiyye'yi cevap vermekten aciz bırakan şu soruya sana cevap verir:"], [1038.0, "Allah isyanı murad eder mi?"], [1040.0, "Sakın \"Onu hiçbir şekilde murad etmez\" ya da \"Onu mutlak olarak murad eder\" deme."], [1046.0, "İki irade arasında ayrım yapmak şarttır."], [1049.0, "Şöyle dersin: Allah bunu kevnî iradesiyle murad eder, fakat şer'î iradesiyle murad etmez."], [1056.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1058.0, "<span class=\"ayah\">﴿Eğer inkâr ederseniz﴾<\/span> —yani kevnen— <span class=\"ayah\">﴿bilin ki Allah sizden müstağnidir; kullarının küfrüne﴾<\/span> —yani şer'an— <span class=\"ayah\">﴿razı olmaz﴾<\/span> [Zümer 7]."]]}, {"reader": false, "ar": [[1064.0, "فالذي لا يفرّق بين هاتين الإرادتين فسيقع في إشكالاتٍ عظيمة؛"], [1070.0, "فقد ينسب إلى الله شيئًا لا يجوز نسبته له،"], [1075.0, "أو يسلب من خلقه عنه ما لا يجوز إخراجه عنه."]], "tr": [[1064.0, "Bu iki irade arasında ayrım yapmayan kimse büyük müşkillere düşer:"], [1064.0, "Ya Allah'a, O'na nispet edilmesi caiz olmayan bir şeyi nispet eder ya da O'nun yaratmasının dışına çıkarılması caiz olmayan bir şeyi O'nun yaratmasından nefyeder."]]}]}, {"ts": "18:00", "title": "9. Külliye: Sevilen her şey bizzat kendisi için, mekruh olan her şey başkası için murad edilir", "paras": [{"reader": false, "ar": [[1080.0, "ويوضّح ذلك الكلّيّة التي بعدها:"], [1084.0, "كلُّ محبوبٍ فمرادٌ لذاته،"], [1087.0, "وكلُّ مكروهٍ فمرادٌ لغيره. كلُّ محبوبٍ فمرادٌ لذاته،"], [1095.0, "وكلُّ مكروهٍ فمرادٌ لغيره."], [1099.0, "وإن شئتم أن تجعلوها كلّيّتين منفصلتين فلكم ذلك،"], [1103.0, "وإن شئتم أن تجمعوها فلكم ذلك."], [1106.0, "وهذا من الفرقان بين الإرادتين."]], "tr": [[1080.0, "Bunu, ondan sonraki külliye açıklar:"], [1080.0, "9. külliye: Sevilen her şey bizzat kendisi için murad edilir;"], [1087.0, "mekruh (hoş görülmeyen) her şey ise başkası için murad edilir. (Tekrar ediyor.) İsterseniz bunu iki ayrı külliye yapın, bu size kalmış;"], [1099.0, "isterseniz birleştirin, bu da size kalmış."], [1103.0, "Bu, iki irade arasındaki farklardandır."]]}, {"reader": false, "ar": [[1110.0, "فالله عز وجل لا يريد الشيء شرعًا إلا وهو يحبّه ويرضاه،"], [1116.0, "لأنّ الشرعية مرادفةٌ للمحبّة والرضا،"], [1118.0, "ولكن لا يستلزم ـ ليس ذلك بلازمٍ في الإرادة الكونية؛"], [1124.0, "فقد يريد الله عز وجل كونًا ما لا يرضاه ولا يحبّه شرعًا."], [1130.0, "ولكن متى ما رأيتَ الشيءَ لا يريده الله بإرادته الشرعية،"], [1137.0, "ولكنه وقع في كونه،"], [1139.0, "فاعلم أنه لا يريده لذاته،"], [1141.5, "وإنما يريده لغيره، كما سيأتينا في كلّيّةٍ خاصّة."]], "tr": [[1110.0, "Allah Azze ve Celle bir şeyi şer'an murad ediyorsa, mutlaka onu sever ve ondan razı olur;"], [1116.0, "çünkü şer'î irade, sevgi ve rıza ile eş anlamlıdır."], [1118.0, "Fakat bu gerekmez —kevnî iradede bu lâzım değildir—;"], [1118.0, "Allah Azze ve Celle, şer'an razı olmadığı ve sevmediği bir şeyi kevnen murad edebilir."], [1124.0, "Fakat Allah'ın şer'î iradesiyle murad etmediği bir şeyin O'nun kâinatında meydana geldiğini gördüğün her yerde bil ki, O onu bizzat kendisi için değil, başkası için murad eder;"], [1141.5, "özel bir külliyede karşımıza geleceği gibi."]]}]}, {"ts": "19:06", "title": "9. Külliye (devam): İrade ile sevgi arasında telâzum yoktur; acı ilaç ve ameliyat örnekleri", "paras": [{"reader": false, "ar": [[1146.0, "فإن قلتَ: وكيف يريده وهو لا يحبّه؟"], [1150.0, "وهذا سؤالٌ أعيا الجبريةَ والقدريةَ الإجابةُ عنه."], [1155.0, "ولكن لأنّ أهل السنة يفرّقون بين الإرادتين ومقتضاهما ولوازمهما،"], [1164.0, "فحينئذٍ صار الجواب عليهم سهلًا،"], [1167.0, "وهو أنه لا تلازمَ بين الإرادة والمحبّة؛"], [1171.0, "فقد يريد الإنسان الشيءَ وهو لا يحبّه،"], [1174.0, "لكن يريده لما يترتّب عليه من الحِكَم والمصالح التي لا تترتّب إلا على وجوده،"], [1180.0, "فهو يريده لغيره ولا يريده لذاته."]], "tr": [[1146.0, "\"Sevmediği bir şeyi nasıl murad eder?\" dersen —ki bu, Cebriyye'yi ve Kaderiyye'yi cevap vermekten aciz bırakan bir sorudur—:"], [1155.0, "Ehl-i Sünnet iki irade, onların gerekleri ve lâzımları arasında ayrım yaptığı için, o zaman onlara göre cevap kolaylaştı."], [1164.0, "Cevap şudur: İrade ile sevgi arasında telâzum (birbirini gerektirme) yoktur."], [1171.0, "İnsan bir şeyi sevmediği hâlde murad edebilir;"], [1171.0, "fakat onu, ancak onun varlığına bağlı olarak ortaya çıkan hikmetler ve maslahatlar için murad eder."], [1174.0, "Onu başkası için murad eder, bizzat kendisi için murad etmez."]]}, {"reader": false, "ar": [[1184.0, "كمن يستعمل الدواءَ المرَّ العلقمَ الذي لا يُطاق،"], [1190.0, "لأنه يعلم أن لا شفاءَ إلا عن طريق تناوله،"], [1194.0, "فهو يريد استعمال الدواء المرّ لغيره لا لذاته."], [1198.0, "وكالذي يقدّم رِجله المصابة بالآكلة للطبيب ليقطعها،"], [1206.0, "فإنّ ذلك وإن كان يريده إلا أنه يريده لغيره لا لذاته،"], [1212.6, "لعلمه بأنّ بقاءها في جسده سوف يوجب عطبَ جسده كاملًا،"], [1218.6, "أو قد تسبّب وفاته."]], "tr": [[1184.0, "Dayanılmaz derecede acı, zakkum gibi bir ilacı kullanan kimse gibi;"], [1184.0, "çünkü şifanın ancak onu almakla olacağını bilir."], [1190.0, "O, acı ilacı kullanmayı bizzat kendisi için değil, başkası için murad eder."], [1194.0, "Kangrene yakalanmış ayağını kestirmek için doktora uzatan kimse gibi;"], [1198.0, "bunu murad etse de, onu bizzat kendisi için değil başkası için murad eder."], [1206.0, "Çünkü o ayağın bedeninde kalmasının bütün bedeninin çürümesine yol açacağını veya ölümüne sebep olabileceğini bilir."]]}, {"reader": false, "ar": [[1221.0, "بل إنّ الإنسان قد يقدّم ولدَه المحبوب إلى الطبيب ليفتح بطنه في عمليةٍ،"], [1229.5, "وهو لا يحبّ ذلك ولا يرضاه،"], [1237.0, "ولكن لعلمه بأنّ ما يريده من المحبوبات لا يترتّب إلا على وجود ذلك الشيء."], [1246.0, "وقد يقطع العبدُ الفيافيَ والقِفارَ والمسافاتِ الطويلة لزيارة محبوبه،"], [1253.0, "فهو لا يحبّ أن يخاطر بنفسه في هذه الصحاري لذات المخاطرة،"], [1262.0, "وإنما لما يترتّب عليها من الحِكَم والمصالح."]], "tr": [[1221.0, "Hatta insan, sevdiği çocuğunu bir ameliyatta karnını açması için doktora götürebilir;"], [1221.0, "bunu sevmez ve bundan razı olmaz."], [1229.5, "Fakat istediği sevilen şeylerin ancak o şeyin varlığına bağlı olarak ortaya çıkacağını bilir."], [1237.0, "Kul, sevdiğini ziyaret etmek için çölleri, ıssız yerleri ve uzun mesafeleri aşabilir."], [1246.0, "Bu çöllerde kendini tehlikeye atmayı, bizzat tehlikenin kendisi için sevmez;"], [1253.0, "ancak üzerine terettüp eden hikmetler ve maslahatlar için (yapar)."]]}, {"reader": false, "ar": [[1266.0, "فإذا كنتَ تتصوّر ذلك منك،"], [1268.5, "فهذا هو عينُ ما يريده أهل السنة بقولهم:"], [1272.7, "إنّ المراد الكوني ليس مرادًا لذاته، وإنما مرادٌ لغيره."]], "tr": [[1266.0, "Bunu kendinden tasavvur edebiliyorsan, işte Ehl-i Sünnet'in \"Kevnî murad bizzat kendisi için murad edilmez, ancak başkası için murad edilir\" sözüyle kastettiği şeyin ta kendisi budur."]]}]}, {"ts": "21:20", "title": "10. Külliye: Her kevnî murad, şer'î bir murada vesiledir", "paras": [{"reader": false, "ar": [[1280.0, "ويوضّح ذلك الكلّيّة التي بعدها،"], [1283.7, "ولعلّها الأخيرة. كم رقمها؟"], [1287.8, "ـ (أحد الحضور:) العاشرة <span class=\"q\">؟ 21:28<\/span>. ـ <b>كلُّ مرادٍ كونيٍّ فوسيلةٌ لمرادٍ شرعيّ.<\/b> وأنا تُعجبني هذه الكلّيّة كثيرًا:"], [1299.0, "كلُّ مرادٍ كونيٍّ فوسيلةٌ لمرادٍ شرعيّ."], [1305.0, "فالله عز وجل لا يريد الشيء كونًا لذاته،"], [1310.5, "وإنما يريده لغيره. فإن قلتَ:"], [1315.2, "وما هذا الغيرُ الذي يريده الله به؟"], [1319.5, "فأقول: هو الإرادة الشرعية."]], "tr": [[1280.0, "Bunu, ondan sonraki külliye açıklar;"], [1280.0, "belki de sonuncusudur. Numarası kaç?"], [1283.7, "— (Dinleyicilerden biri:) Onuncu <span class=\"q\">؟<\/span>."], [1287.8, "— <b>10. külliye: Her kevnî murad, şer'î bir murada vesiledir.<\/b> Bu külliye çok hoşuma gider:"], [1287.8, "Her kevnî murad, şer'î bir murada vesiledir."], [1299.0, "Allah Azze ve Celle bir şeyi kevnen bizzat kendisi için murad etmez, ancak başkası için murad eder."], [1310.5, "\"Allah'ın onu kendisi için murad ettiği bu 'başka şey' nedir?\" dersen, derim ki: O, şer'î iradedir."]]}, {"reader": false, "ar": [[1322.0, "فالله عز وجل إنما يريد في كونه شيئًا لا يحبّه ولا يرضاه لذاته،"], [1329.0, "لأنه يريد ما يترتّب على وجوده ممّا لا يمكن وجوده إلا به."], [1338.0, "كقول الله عز وجل:"], [1340.5, "<span class=\"ayah\">﴿ظَهَرَ الْفَسَادُ فِي الْبَرِّ وَالْبَحْرِ بِمَا كَسَبَتْ أَيْدِي النَّاسِ﴾<\/span>،"], [1346.0, "وهذا الظهور إنما هو إرادةٌ كونية،"], [1350.0, "معلِّلًا هذا الظهور بقوله:"], [1352.8, "<span class=\"ayah\">﴿لِيُذِيقَهُم بَعْضَ الَّذِي عَمِلُوا لَعَلَّهُمْ يَرْجِعُونَ﴾<\/span> <span class=\"ref\">[الروم: ٤١]<\/span>،"], [1358.0, "أي لعلّهم يتوبون ويؤوبون."]], "tr": [[1322.0, "Allah Azze ve Celle kâinatında, bizzat kendisi için sevmediği ve razı olmadığı bir şeyi murad ediyorsa, bunu, onun varlığına bağlı olarak ortaya çıkan ve ancak onunla var olabilen şeyi murad ettiği için yapar."], [1340.5, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [1340.5, "<span class=\"ayah\">﴿İnsanların kendi elleriyle kazandıkları yüzünden karada ve denizde fesat ortaya çıktı﴾<\/span>."], [1346.0, "Bu ortaya çıkış kevnî bir iradedir."], [1350.0, "(Allah) bu ortaya çıkışın illetini şu sözüyle açıklıyor:"], [1352.8, "<span class=\"ayah\">﴿Allah, yaptıklarının bir kısmını onlara tattırsın diye; belki dönerler﴾<\/span> [Rûm 41];"], [1352.8, "yani belki tevbe eder ve (Allah'a) yönelirler."]]}, {"reader": false, "ar": [[1362.0, "فتلك المصائب والآلام التي يُجريها الله عز وجل على العباد ـ من الأمراض والأوبئة،"], [1368.1, "والفيضانات المُغرِقة، والأعاصير المدمِّرة،"], [1371.0, "والبراكين والزلازل ـ لا يريدها الله في كونه لذاتها،"], [1378.0, "وإنما يريدها لما يترتّب عليها من الحِكَم والمصالح."]], "tr": [[1362.0, "Allah Azze ve Celle'nin kullar üzerinde cereyan ettirdiği o musibetler ve acılar —hastalıklar, salgınlar, boğan seller, yıkıcı kasırgalar, yanardağlar ve depremler— Allah onları kâinatında bizzat kendileri için murad etmez;"], [1371.0, "ancak onlara terettüp eden hikmetler ve maslahatlar için murad eder."]]}]}, {"ts": "23:02", "title": "10. Külliye (devam): Cehennemin yaratılmasındaki hikmetler", "paras": [{"reader": false, "ar": [[1382.0, "بل إنّ خلقَ النار لا يريده الله لذاته؛"], [1386.0, "فالله لم يخلق النار لأنه يريد أن يعذّب عباده إرادةً محبوبة،"], [1395.0, "وإنما لتكون حجابًا لهم عن مواقعة ما يُغضبه عليهم."], [1403.0, "فإذا لم يتوعّدهم بالنار العظيمة فلربّما يُسيئون الأدب،"], [1409.0, "لأنّ من أمِن العقوبة أساء الأدب."], [1412.0, "وكم من إنسانٍ لم يزجره إيمانه بالله عن وقوع المعصية،"], [1420.0, "لكن إذا مرّ على آيات الوعيد،"], [1422.5, "وما أعدّه الله من العذاب الأليم والجحيم العظيم في الآخرة لمن فعل هذا الشيء،"], [1431.0, "فيكون زاجرًا له عن مواقعته."]], "tr": [[1382.0, "Hatta Allah cehennemin yaratılmasını bizzat kendisi için murad etmez."], [1386.0, "Allah cehennemi, kullarına sevdiği bir iradeyle azap etmek istediği için yaratmamıştır;"], [1395.0, "ancak onları, kendilerine gazap etmesine sebep olacak şeylere düşmekten alıkoyan bir perde olsun diye yaratmıştır."], [1403.0, "Onları büyük bir ateşle tehdit etmeseydi belki edepsizlik ederlerdi;"], [1409.0, "çünkü cezadan emin olan edebi bozar."], [1412.0, "Nice insan vardır ki Allah'a imanı onu isyana düşmekten alıkoymaz;"], [1420.0, "fakat tehdit ayetlerine ve Allah'ın bu şeyi yapan kimse için âhirette hazırladığı elem verici azaba ve büyük cehenneme uğradığında, bu onu o günaha düşmekten alıkoyar."]]}, {"reader": false, "ar": [[1433.0, "بل إنّ من طبقات النار ما يسمّى بطبقة أصحاب الكبائر ـ من دركاتها ما يسمّى بدركة أصحاب الكبائر ـ فالله خلق هذا الجزء من النار ليكون كفّارةً لمن دخلها من أصحاب الكبائر."]], "tr": [[1433.0, "Hatta cehennemin tabakalarından biri, büyük günah sahiplerinin tabakası diye adlandırılır —derekelerinden biri, büyük günah sahiplerinin derekesi diye adlandırılır—."], [1433.0, "Allah cehennemin bu kısmını, ona giren büyük günah sahipleri için bir keffâret olsun diye yaratmıştır."]]}, {"reader": false, "ar": [[1452.0, "بل إنّ الله عز وجل ـ من حكمة خلق النار ـ أن يُريَ المظلومَ الظالمَ يُعذَّب فيها ليشفيَ صدره،"], [1461.0, "وهذا مرادٌ لله عز وجل شرعًا،"], [1464.0, "كما قال الله عز وجل:"], [1466.8, "<span class=\"ayah\">﴿وَيَشْفِ صُدُورَ قَوْمٍ مُّؤْمِنِينَ﴾<\/span> <span class=\"ref\">[التوبة: ١٤]<\/span> <span class=\"note\">(Şeyh «ويشفي» diyor.)<\/span>."], [1469.0, "فإن كان هذا الشفاء لم يُعجَّل لهم في الدنيا،"], [1473.0, "فإنهم سيطالعونه بأمّ أعينهم فيمن ظلمهم وأكل أموالهم وبخس حقوقهم في الآخرة."]], "tr": [[1452.0, "Hatta cehennemin yaratılmasındaki hikmetlerden biri de Allah Azze ve Celle'nin, mazluma zalimin orada azap gördüğünü göstererek onun göğsüne şifa vermesidir."], [1461.0, "Bu, Allah Azze ve Celle'nin şer'an murad ettiği bir şeydir."], [1466.8, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1466.8, "<span class=\"ayah\">﴿Mümin bir topluluğun göğüslerine şifa versin﴾<\/span> [Tevbe 14]."], [1469.0, "Bu şifa onlara dünyada peşin verilmediyse, âhirette kendilerine zulmeden, mallarını yiyen ve haklarını eksik veren kimselerde onu kendi gözleriyle göreceklerdir."]]}, {"reader": false, "ar": [[1483.0, "كما قال الله عز وجل:"], [1485.1, "<span class=\"ayah\">﴿وَنَادَىٰ أَصْحَابُ النَّارِ أَصْحَابَ الْجَنَّةِ أَنْ أَفِيضُوا عَلَيْنَا مِنَ الْمَاءِ أَوْ مِمَّا رَزَقَكُمُ اللَّهُ ۚ قَالُوا إِنَّ اللَّهَ حَرَّمَهُمَا عَلَى الْكَافِرِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ٥٠]<\/span>."], [1497.0, "فكم ستطيب نفسُ المظلوم إذا رأى ظالمه يُعذَّب،"], [1501.0, "ونفسُ المقهور إذا رأى من قهره يُعذَّب!"]], "tr": [[1483.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1485.1, "<span class=\"ayah\">﴿Cehennemlikler cennetliklere: \"Suyunuzdan ya da Allah'ın size verdiği rızıktan bize biraz akıtın\" diye seslenirler. Onlar da: \"Allah bunları kâfirlere haram kılmıştır\" derler﴾<\/span> [A'râf 50]."], [1485.1, "Mazlumun nefsi, zalimini azap görürken gördüğünde ve ezilenin nefsi, kendisini ezeni azap görürken gördüğünde ne kadar da ferahlayacaktır!"]]}, {"reader": false, "ar": [[1508.0, "فلا تظننّ أنّ الله يريد الشيء في كونه وهو لا يحبّه هكذا عبثًا؛"], [1514.0, "فالله لم يخلق هذه الأمور عبثًا،"], [1517.0, "كما قال عز وجل:"], [1519.5, "<span class=\"ayah\">﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا﴾<\/span> <span class=\"ref\">[المؤمنون: ١١٥]<\/span>،"], [1522.0, "<span class=\"ayah\">﴿أَيَحْسَبُ الْإِنسَانُ أَن يُتْرَكَ سُدًى﴾<\/span> <span class=\"ref\">[القيامة: ٣٦]<\/span>."], [1525.0, "فالعبثيّة لا يجوز أن يوصف الله عز وجل بها،"], [1530.0, "لا ذاتًا، ولا اسمًا،"], [1531.3, "ولا صفةً، ولا فعلًا،"], [1532.7, "ولا أمرًا، ولا حُكمًا. هذا مثال."]], "tr": [[1508.0, "Allah'ın sevmediği bir şeyi kâinatında böyle boş yere murad ettiğini sakın zannetme."], [1514.0, "Allah bu işleri boş yere yaratmamıştır."], [1517.0, "Nitekim Azze ve Celle şöyle buyurmuştur:"], [1519.5, "<span class=\"ayah\">﴿Sizi boş yere yarattığımızı mı sandınız?﴾<\/span> [Mü'minûn 115], <span class=\"ayah\">﴿İnsan başıboş bırakılacağını mı sanır?﴾<\/span> [Kıyâme 36]."], [1522.0, "Allah Azze ve Celle'nin abesiyetle (boş iş yapmakla) nitelenmesi caiz değildir;"], [1525.0, "ne zâtında, ne isminde, ne sıfatında, ne fiilinde, ne emrinde ne de hükmünde. Bu bir örnektir."]]}]}, {"ts": "25:38", "title": "10. Külliye (devam): İblis'in yaratılmasındaki hikmetler", "paras": [{"reader": false, "ar": [[1538.0, "مثالٌ آخر: لماذا خلق الله إبليس وهو داعيةُ الكفر والضلال؟"], [1544.0, "فلو أنّ الله خلّص البشرية من إبليس لكانت البشرية على توحيدها وإيمانها،"], [1551.5, "وهو الذي يحبّه الله منها،"], [1555.0, "فلماذا خلق إبليس؟ وهو سؤالٌ يردّده الملاحدة."], [1560.0, "فنقول: إنّ هناك من الحِكَم الشرعية والمصالح المحبوبة لله والأمور المرعيّة ممّا لا يتحقّق إلا إذا خُلق إبليس وجُعل داعيةً للكفر والضلال."], [1571.0, "فكيف يُعرف المؤمن من الكافر لو لم يكن ثَمّةَ إبليس يدعو إلى كفر؟"]], "tr": [[1538.0, "Başka bir örnek: Allah, küfrün ve dalâletin davetçisi olan İblis'i neden yarattı?"], [1544.0, "Allah insanlığı İblis'ten kurtarsaydı, insanlık tevhidi ve imanı üzere olurdu;"], [1544.0, "Allah'ın ondan sevdiği de budur."], [1551.5, "O hâlde İblis'i neden yarattı?"], [1555.0, "Bu, ateistlerin tekrar edip durduğu bir sorudur."], [1560.0, "Deriz ki: Ancak İblis yaratılıp küfür ve dalâlete davetçi kılındığında gerçekleşebilecek şer'î hikmetler, Allah'ın sevdiği maslahatlar ve gözetilen işler vardır."], [1571.0, "Küfre çağıran bir İblis olmasaydı mümin kâfirden nasıl ayırt edilirdi?"]]}, {"reader": false, "ar": [[1580.0, "بل كيف تظهر آثارُ أسماء الله عز وجل الترهيبية ـ كالمنتقم والجبّار وسريع الحساب وشديد العقاب ـ لو لم يكن ثَمّةَ ما يوجب ذلك؟"], [1598.5, "والذي يوجب ذلك إنما يدعو له إبليس."], [1602.0, "بل ذكر العلماء أنّ أسماء الله الترغيبية،"], [1609.0, "الدالّة على توبته ومغفرته ورحمته ورأفته وتوبته على عباده:"], [1615.0, "لو لم يكن ثَمّةَ ذنبٌ،"], [1617.9, "فكيف يظهر أثرُ اسمه الغفّار أو الغفور،"], [1622.0, "أو التوّاب أو الودود،"], [1624.5, "أو الرحيم أو الرؤوف؟"]], "tr": [[1580.0, "Hatta Allah Azze ve Celle'nin korkutucu isimlerinin —el-Müntakim (intikam alan), el-Cebbâr, Serîu'l-hisâb (hesabı çabuk gören) ve Şedîdu'l-ikâb (cezası çetin olan) gibi— eserleri, bunu gerektiren bir şey olmasaydı nasıl ortaya çıkardı?"], [1598.5, "Bunu gerektiren şeye ise ancak İblis çağırır."], [1602.0, "Hatta âlimler şunu zikretmişlerdir: Allah'ın tevbeyi kabulüne, mağfiretine, rahmetine, re'fetine ve kullarının tevbesini kabul etmesine delâlet eden teşvik edici isimleri..."], [1617.9, "Hiç günah olmasaydı, el-Gaffâr veya el-Gafûr, et-Tevvâb veya el-Vedûd, er-Rahîm veya er-Raûf isminin eseri nasıl ortaya çıkardı?"]]}, {"reader": false, "ar": [[1627.0, "فالله لم يخلق إبليس لذاته،"], [1630.7, "وإنما خلقه لأنّ هناك من الحِكَم والمصالح ما لا يترتّب إلا على وجوده."], [1641.0, "بل إنّ العلماء ذكروا بأنّ من حكمة خلق إبليس تنوّعَ العبادات في الأرض؛"], [1652.0, "فهذا يُوقعه إبليس فيما يوجب له التوبة،"], [1659.0, "وهؤلاء يُوقعهم إبليس في الكفر فيحاربون المؤمنين،"], [1661.7, "فيقوم عَلَمُ الجهاد، وهو عبادةٌ أخرى."], [1664.0, "وفي الجهاد يموت الناس شهداء،"], [1667.3, "واتخاذُ بعض المؤمنين شهداءَ مرادٌ شرعيٌّ لله عز وجل،"], [1673.1, "كما قال: <span class=\"ayah\">﴿وَيَتَّخِذَ مِنكُمْ شُهَدَاءَ﴾<\/span> <span class=\"ref\">[آل عمران: ١٤٠]<\/span>."], [1679.0, "فكيف يتحقّق ذلك إذا لم يكن ثَمّةَ كافرٌ يقاتل مسلمًا؟"]], "tr": [[1627.0, "Allah İblis'i bizzat kendisi için yaratmadı;"], [1630.7, "ancak onun varlığına bağlı olarak ortaya çıkan hikmetler ve maslahatlar olduğu için yarattı."], [1641.0, "Hatta âlimler, İblis'in yaratılmasındaki hikmetlerden birinin yeryüzünde ibadetlerin çeşitlenmesi olduğunu zikretmişlerdir:"], [1652.0, "İblis birini tevbeyi gerektiren bir şeye düşürür;"], [1659.0, "başkalarını küfre düşürür, onlar da müminlerle savaşır ve cihad sancağı dikilir;"], [1661.7, "bu da ayrı bir ibadettir."], [1664.0, "Cihadda insanlar şehit olarak ölür;"], [1667.3, "bazı müminlerin şehit edinilmesi de Allah Azze ve Celle'nin şer'î bir muradıdır."], [1673.1, "Nitekim şöyle buyurmuştur: <span class=\"ayah\">﴿Ve içinizden şehitler edinsin﴾<\/span> [Âl-i İmrân 140]."], [1679.0, "Bir Müslümanla savaşan bir kâfir olmasaydı bu nasıl gerçekleşirdi?"]]}, {"reader": false, "ar": [[1685.0, "وإنّ من أعظم ما يحبّه الله:"], [1688.0, "الحبُّ في الله والبغضُ في الله؛"], [1691.0, "فإذا لم يكن ثَمّةَ ما يوجب البغض،"], [1694.9, "فكيف يُعبَد (الله) بالولاء والبراء والحبّ والبغض؟"], [1699.0, "بل من العبادات المحبوبة لله:"], [1702.6, "الأمرُ بالمعروف؛ فلو لم يكن ثَمّةَ إبليس يدعو إلى ترك المعروف،"], [1708.0, "فكيف تقوم شعيرةُ الأمر بالمعروف؟"], [1711.0, "وشعيرةُ النهي عن المنكر:"], [1713.0, "فلو لم يكن ثَمّةَ إبليس يدعو إلى منكر،"], [1716.0, "فكيف يُعبَد الله في أرضه بعبادة النهي عن المنكر؟"]], "tr": [[1685.0, "Allah'ın en çok sevdiği şeylerden biri, Allah için sevmek ve Allah için buğzetmektir."], [1691.0, "Buğzu gerektiren bir şey olmasaydı, (Allah'a) velâ ve berâ, sevgi ve buğz ile nasıl ibadet edilirdi?"], [1699.0, "Hatta Allah'ın sevdiği ibadetlerden biri de iyiliği emretmektir."], [1702.6, "İyiliği terk etmeye çağıran bir İblis olmasaydı, iyiliği emretme şiarı nasıl ayakta dururdu?"], [1708.0, "Kötülükten sakındırma şiarı da öyle:"], [1713.0, "Kötülüğe çağıran bir İblis olmasaydı, Allah'a yeryüzünde kötülükten sakındırma ibadetiyle nasıl ibadet edilirdi?"]]}, {"reader": false, "ar": [[1722.0, "وعبوديةُ التوبة المحبوبة لله عز وجل:"], [1725.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ﴾<\/span> <span class=\"ref\">[البقرة: ٢٢٢]<\/span>؛"], [1729.0, "فإذا لم يكن ثَمّةَ ما يُتاب منه،"], [1732.0, "فكيف يظهر ذلك؟ وكيف يُعبَد الله به في أرضه؟"]], "tr": [[1722.0, "Allah Azze ve Celle'nin sevdiği tevbe kulluğu da böyledir:"], [1725.0, "<span class=\"ayah\">﴿Şüphesiz Allah çok tevbe edenleri sever﴾<\/span> [Bakara 222]."], [1725.0, "Tevbe edilecek bir şey olmasaydı bu nasıl ortaya çıkardı ve Allah'a yeryüzünde onunla nasıl ibadet edilirdi?"]]}]}, {"ts": "28:56", "title": "10. Külliye (devam): Ölüm ve hayat, gece ve gündüz, hilaller ve haram aylar", "paras": [{"reader": false, "ar": [[1736.0, "فخذوها منّي قاعدةً: كلُّ مرادٍ ممّا لا يحبّه الله ولا يرضاه فلا بدّ وأن يكون وسيلةً إلى ما يحبّه الله ويرضاه."], [1749.0, "وهذا هو معنى قولنا:"], [1751.0, "إنّ الإرادة الكونية ليست مرادةً لذاتها،"], [1756.0, "وإنما مرادةٌ لغيرها، أي لما يترتّب عليها من الحِكَم والمصالح."], [1762.0, "وكقول الله عز وجل:"], [1766.0, "<span class=\"ayah\">﴿الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ﴾<\/span> ـ كونًا،"], [1769.0, "فهي إرادةٌ كونية، لكن رتّب عليها شيئًا شرعيًّا ـ <span class=\"ayah\">﴿لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا﴾<\/span> <span class=\"ref\">[الملك: ٢]<\/span>؛"], [1777.0, "فجعل المراد الكونيَّ وسيلةً إلى مرادٍ شرعي."]], "tr": [[1736.0, "Bunu benden bir kaide olarak alın:"], [1736.0, "Allah'ın sevmediği ve razı olmadığı şeylerden murad edilen her şey, mutlaka Allah'ın sevdiği ve razı olduğu şeye bir vesiledir."], [1749.0, "\"Kevnî irade bizzat kendisi için murad edilmez, ancak başkası için, yani üzerine terettüp eden hikmetler ve maslahatlar için murad edilir\" sözümüzün anlamı budur."], [1762.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [1766.0, "<span class=\"ayah\">﴿O ki ölümü ve hayatı yarattı﴾<\/span> —kevnen;"], [1769.0, "bu kevnî bir iradedir, fakat (Allah) onun üzerine şer'î bir şey terettüp ettirdi— <span class=\"ayah\">﴿hanginizin daha güzel amel yapacağını sınamak için﴾<\/span> [Mülk 2]."], [1777.0, "Kevnî muradı şer'î bir murada vesile kıldı."]]}, {"reader": false, "ar": [[1783.0, "بل حتى في الكونيات المحضة،"], [1785.9, "كاختلاف الليل والنهار، وهما أمران كونيّان محضان،"], [1790.0, "انظر ماذا قال الله عز وجل في الحكمة من خلقها كونًا:"], [1796.1, "<span class=\"ayah\">﴿وَهُوَ الَّذِي جَعَلَ اللَّيْلَ وَالنَّهَارَ خِلْفَةً﴾<\/span> ـ طيب،"], [1802.7, "هذا كونًا ـ <span class=\"ayah\">﴿لِّمَنْ أَرَادَ أَن يَذَّكَّرَ أَوْ أَرَادَ شُكُورًا﴾<\/span> <span class=\"ref\">[الفرقان: ٦٢]<\/span>، أو لا؟"]], "tr": [[1783.0, "Hatta gece ile gündüzün birbirini takip etmesi gibi katıksız kevnî işlerde bile —ki bunlar katıksız iki kevnî iştir— Allah Azze ve Celle'nin onları kevnen yaratmasındaki hikmet hakkında ne buyurduğuna bak:"], [1796.1, "<span class=\"ayah\">﴿O, geceyle gündüzü birbiri ardınca getirendir﴾<\/span> —peki, bu kevnen— <span class=\"ayah\">﴿öğüt almak isteyen veya şükretmek isteyen için﴾<\/span> [Furkân 62]. Öyle değil mi?"]]}, {"reader": false, "ar": [[1809.0, "يقول الله عز وجل:"], [1811.9, "<span class=\"ayah\">﴿يَسْأَلُونَكَ عَنِ الْأَهِلَّةِ﴾<\/span>. ووجودُ الأهلّة على هذه الصورة ـ أن تبدأ خفيفةً،"], [1819.2, "ثم تكون بدرًا، ثم ترجع كالعرجون القديم ـ هذا أمرٌ كوني،"], [1824.0, "وكان سؤالهم عن سببيّة وجودها على الصورة الكونية،"], [1829.0, "لكنّ القرآن نقلهم إلى الجواب الشرعي؛"], [1834.0, "أي: لا حقّ لكم أن تسألوا عن مقصودنا الكوني فيها،"], [1838.0, "لأنّ الجواب لا ينفعكم،"], [1840.0, "إذ لا اختيارَ ولا قدرةَ لكم في تدبيرٍ كوني،"], [1844.0, "لكن اسألوني: لماذا أوجدتُها على هذه الصورة الكونية؟"]], "tr": [[1809.0, "Allah Azze ve Celle şöyle buyurur:"], [1811.9, "<span class=\"ayah\">﴿Sana hilalleri soruyorlar﴾<\/span>. Hilallerin bu surette var olması —ince başlayıp sonra dolunay olması, sonra kurumuş hurma dalı gibi geri dönmesi— kevnî bir iştir."], [1819.2, "Onların sorusu, hilallerin bu kevnî surette var oluşunun sebebi hakkındaydı."], [1829.0, "Fakat Kur'an onları şer'î cevaba yöneltti."], [1829.0, "Yani: Bunlardaki kevnî maksadımızı sormaya hakkınız yok;"], [1834.0, "çünkü cevap size fayda vermez;"], [1838.0, "zira kevnî bir tedbirde sizin ne ihtiyarınız ne de gücünüz vardır."], [1844.0, "Fakat bana şunu sorun: Onları neden bu kevnî surette var ettim?"]]}, {"reader": false, "ar": [[1849.0, "فكان الجواب: إنما أوجدتُها على تلك الصورة الكونية لتكون وسيلةً لمرادَين شرعيَّين."], [1858.0, "فقال الله عز وجل:"], [1860.9, "<span class=\"ayah\">﴿يَسْأَلُونَكَ عَنِ الْأَهِلَّةِ ۖ قُلْ هِيَ﴾<\/span> ـ أي شرعًا ـ <span class=\"ayah\">﴿مَوَاقِيتُ لِلنَّاسِ وَالْحَجِّ﴾<\/span> <span class=\"ref\">[البقرة: ١٨٩]<\/span>."], [1868.0, "وكذلك تعاقُبُ الأشهر؛ فإنّ تعاقب الأشهر أمرٌ كوني،"], [1874.0, "لكن انظر ماذا قال الله فيه:"], [1877.0, "<span class=\"ayah\">﴿يَسْأَلُونَكَ عَنِ الشَّهْرِ الْحَرَامِ﴾<\/span> «قل قتالٌ فيه كبير»،"], [1881.7, "إيش؟ <span class=\"ayah\">﴿يَسْأَلُونَكَ عَنِ الشَّهْرِ الْحَرَامِ قِتَالٍ فِيهِ ۖ قُلْ قِتَالٌ فِيهِ كَبِيرٌ﴾<\/span> <span class=\"ref\">[البقرة: ٢١٧]<\/span>."]], "tr": [[1849.0, "Cevap şu oldu: Onları o kevnî surette ancak iki şer'î murada vesile olsun diye var ettim."], [1849.0, "Allah Azze ve Celle şöyle buyurdu:"], [1860.9, "<span class=\"ayah\">﴿Sana hilalleri soruyorlar. De ki: Onlar﴾<\/span> —yani şer'an— <span class=\"ayah\">﴿insanlar ve hac için vakit ölçüleridir﴾<\/span> [Bakara 189]."], [1860.9, "Ayların birbirini takip etmesi de böyledir;"], [1868.0, "ayların birbirini takip etmesi kevnî bir iştir."], [1874.0, "Fakat Allah'ın bu konuda ne buyurduğuna bak:"], [1877.0, "<span class=\"ayah\">﴿Sana haram ayı soruyorlar﴾<\/span> \"De ki:"], [1877.0, "Onda savaşmak büyük (günah)tır.\" Nasıldı?"], [1881.7, "<span class=\"ayah\">﴿Sana haram ayda savaşmayı soruyorlar. De ki: O ayda savaşmak büyük (günah)tır﴾<\/span> [Bakara 217]."]]}, {"reader": false, "ar": [[1887.0, "فتعبّدنا بترك القتال في هذا الشهر عبادةً شرعيةً لم تكن لو لم يُرِد الله عز وجل ـ إيش؟"], [1896.3, "ـ وجودَ هذا الشهر. وهكذا في أمورٍ كثيرة."]], "tr": [[1887.0, "Bizi bu ayda savaşmayı terk etmekle, Allah Azze ve Celle —neyi?— bu ayın varlığını murad etmeseydi olmayacak olan şer'î bir ibadetle mükellef kıldı."], [1896.3, "Pek çok işte durum böyledir."]]}]}, {"ts": "31:40", "title": "Ateistin sorusuna cevap ve kapanış", "paras": [{"reader": false, "ar": [[1900.0, "فإيّاك أن يأتيك الملحد ويُورد عليك هذا السؤال،"], [1905.0, "الذي يريد إفرادَ الكونية بمعزلٍ عن الشرعية."], [1911.0, "فلو أنهم علموا بأنّ كلَّ مرادٍ كونيٍّ لا بدّ وأن يترتّب عليه مرادٌ شرعي،"], [1918.0, "لأجابوا أنفسهم ـ أو لأجابتهم ـ عن كثيرٍ من الأسئلة،"], [1925.0, "كقولهم: لماذا خلق الله إبليس إذا لم يُرِد الكفر؟"], [1930.0, "فيحصرونك في السؤال الكوني."], [1933.0, "لماذا خلق الله النار وهو أرحم الراحمين؟ ليُلزِموك."]], "tr": [[1900.0, "Sakın ateist sana gelip, kevnî olanı şer'î olandan ayrı tutmak isteyen bu soruyu yöneltmesin (de sen cevapsız kalmayasın)."], [1905.0, "Onlar her kevnî muradın üzerine mutlaka şer'î bir muradın terettüp ettiğini bilselerdi, pek çok soruya kendileri cevap verirlerdi —ya da (bu bilgi) onlara cevap verirdi—."], [1918.0, "Mesela \"Küfrü murad etmiyorsa Allah İblis'i neden yarattı?\" sözleri gibi;"], [1925.0, "seni kevnî soruya hapsederler. \"Allah merhametlilerin en merhametlisi iken cehennemi neden yarattı?\" (derler) ki seni (bir sonuca) mecbur bıraksınlar."]]}, {"reader": false, "ar": [[1941.0, "فمتى ما فصلتَ بين المرادَين حصلت عندك هذه الإشكاليات،"], [1948.0, "لكن إن جعلتَ المرادَ الكونيَّ يترتّب عليه المرادُ الشرعي،"], [1954.0, "حينئذٍ سوف يزول عنك كلُّ ذلك بإذن الله عز وجل."], [1959.0, "ولعلّنا نكتفي بهذا القدر،"], [1962.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[1941.0, "İki muradı birbirinden ayırdığın anda bu müşkiller sende ortaya çıkar."], [1941.0, "Fakat kevnî muradın üzerine şer'î muradın terettüp ettiğini kabul edersen, Allah Azze ve Celle'nin izniyle o zaman bütün bunlar senden kalkar."], [1954.0, "Bu kadarıyla yetinelim. Allah en yüce olandır ve en iyisini bilendir."], [1962.0, "Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a>+' · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];

  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';

  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
