<script>
const D={"no": 50, "vid": "G8QQrbsWT1U", "title_ar": "الدرس (٥٠) من شرح كليات العقيدة — من كليات باب الدعاء (الاعتداء في الدعاء وآدابه)", "title_tr": "Şerhu Külliyyâti'l-Akîde — 50. Ders: Dua Babı Külliyeleri (Duada Haddi Aşma, Namazın Dübüründeki Dua ve Zikir, Ellerin Kaldırılması, Zaman/Mekân/Hey'et Bid'atleri, Lahn, Zamirlerin Değiştirilmesi)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Kevnî bir sünnete aykırılık içeren her dua haddi aşmaktır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.9, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.7, "وعلى آله وأصحابه أفضلُ الصلاةِ وأزكى التسليم،"], [8.1, "أمّا بعد: فمن كلّيّات هذا الدرس:"], [11.6, "<b>كلُّ دعاءٍ يتضمّن مخالفةَ سنّةٍ كونيّةٍ فاعتداء.<\/b> كلُّ دعاءٍ يتضمّن مخالفةَ سنّةٍ كونيّةٍ فاعتداء."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.9, "Salât ve selâm, Allah'ın emin Resûlü'ne, âline ve ashâbına olsun;"], [5.7, "salâtın en faziletlisi ve teslimin en temizi (onlara olsun)."], [9.1, "Bundan sonra: Bu dersin külliyelerinden biri şudur:"], [12.9, "<b>1. külliye: Kevnî bir sünnete aykırılık içeren her dua, haddi aşmaktır (i'tidâdır).<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[21.0, "أقول وبالله التوفيق: وذلك لأنّ الله تعالى له سننٌ في كونه لا تتغيّر ولا تتبدّل أبدًا،"], [29.3, "يُجريها الله عز وجل على خلقه جميعًا،"], [33.0, "مَن سبق منهم ومَن لحق،"], [35.0, "كما قال الله عز وجل:"], [38.0, "<span class=\"ayah\">﴿سُنَّةَ اللَّهِ فِي الَّذِينَ خَلَوْا مِن قَبْلُ ۖ وَلَن تَجِدَ لِسُنَّةِ اللَّهِ تَبْدِيلًا﴾<\/span> <span class=\"ref\">[الأحزاب: ٦٢]<\/span>،"], [44.0, "وفي الآية الأخرى: <span class=\"ayah\">﴿وَلَن تَجِدَ لِسُنَّتِ اللَّهِ تَحْوِيلًا﴾<\/span> <span class=\"ref\">[فاطر: ٤٣]<\/span>."]], "tr": [[21.0, "Tevfik Allah'tandır, derim ki: Bu böyledir;"], [23.1, "çünkü Allah Teâlâ'nın kâinatında asla değişmeyen ve başkalaşmayan sünnetleri (kanunları) vardır."], [27.8, "Allah Azze ve Celle onları, önce gelen ve sonra gelen bütün mahlûkatı üzerinde işletir."], [33.8, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [36.2, "<span class=\"ayah\">﴿Bu, daha önce gelip geçenler hakkında Allah'ın sünnetidir. Allah'ın sünnetinde asla bir değişiklik bulamazsın﴾<\/span> [Ahzâb 62]."], [43.5, "Diğer ayette de: <span class=\"ayah\">﴿Allah'ın sünnetinde asla bir sapma bulamazsın﴾<\/span> [Fâtır 43]."]]}, {"reader": false, "ar": [[48.0, "وبناءً على ذلك فلا يجوز أن يتضمّن دعاؤك بين يدي الله عز وجل سنّةً تخالف ـ شيئًا يخالف هذه السننَ الكونيّة."], [58.0, "فكلُّ دعاءٍ جرى على خلاف شيءٍ من السنن الكونيّة المقرَّرة في الكتاب والسنّة فإننا نقول بأنه اعتداءٌ لا يجوز."], [69.0, "فالدعاء بخلاف ما أجرى الله تعالى عليه سننَه في هذا الكون لا يجوز،"], [75.0, "كدعاء الإنسان أن يكون له جناحان؛"], [80.0, "فإنّ ذلك ممّا هو مخالفٌ لسنّة الله في خلق البشر،"], [84.0, "وإن كان داخلًا فيما يقدر عليه الربُّ عز وجل."]], "tr": [[48.0, "Buna binaen, Allah Azze ve Celle'nin huzurundaki duanın, bu kevnî sünnetlere aykırı bir şey içermesi caiz değildir."], [54.8, "Kitap ve Sünnet'te takrir edilmiş kevnî sünnetlerden herhangi birine aykırı olarak yapılan her dua hakkında, onun caiz olmayan bir haddi aşma olduğunu söyleriz."], [68.4, "Allah Teâlâ'nın bu kâinatta sünnetlerini işlettiği şeye aykırı dua etmek caiz değildir;"], [74.1, "insanın kendisinin iki kanadı olması için dua etmesi gibi."], [80.0, "Çünkü bu, Rab Azze ve Celle'nin gücünün yettiği şeylere dâhil olsa da Allah'ın insanları yaratmadaki sünnetine aykırı olan şeylerdendir."]]}, {"reader": false, "ar": [[90.0, "إلا أنه ليس كونُه قادرًا عليه يسوِّغ لنا أن ندعوه بمثل ذلك."], [96.0, "فلا يزال الدعاء بمثل ذلك يُسمّى اعتداءً حتى وإن كان داخلًا في مقدور الله عز وجل؛"], [103.0, "لأنّ الله لا يُعجزه شيءٌ في الأرض ولا في السماء."], [106.0, "أو كقوله: «اللهمّ اجعلني من الجنّ» وهو من البشر،"], [111.0, "فهذا أيضًا مخالفٌ لسنّة الله الكونيّة."], [115.0, "أو يقول: «اللهمّ أرجِعْ لي الزمانَ لأفعل فيه كذا وكذا ممّا فاتني»،"], [122.0, "فأيضًا هذا مخالفٌ لسنّة الله الكونيّة،"], [125.0, "فإنّ الأيام لا ترجع."]], "tr": [[90.0, "Ancak O'nun buna kâdir olması, O'na bu şekilde dua etmemizi mubah kılmaz."], [95.5, "Böyle bir dua, Allah Azze ve Celle'nin kudreti dâhilinde olsa bile haddi aşma diye adlandırılmaya devam eder;"], [102.6, "çünkü yerde ve gökte hiçbir şey Allah'ı âciz bırakamaz."], [105.4, "Ya da insan iken \"Allah'ım, beni cinlerden kıl\" demesi gibi;"], [110.4, "bu da Allah'ın kevnî sünnetine aykırıdır."], [113.7, "Ya da \"Allah'ım, kaçırdığım şu şu şeyleri yapmam için zamanı bana geri döndür\" demesi;"], [122.0, "bu da Allah'ın kevnî sünnetine aykırıdır, çünkü günler geri dönmez."]]}, {"reader": false, "ar": [[127.0, "وكقوله: «اللهمّ اجعلني من ملائكتك»،"], [131.0, "وكقوله: «اللهمّ أحيِ لنا ميّتَنا»،"], [137.0, "وكقوله: «اللهمّ ارفع عنّي لوازمَ البشريّة» ـ أي من الطعام والشراب والغائط والنوم ـ."], [147.0, "بل ومن الاعتداء أن يقول ـ وانتبهوا ـ:"], [152.0, "«اللهمّ ارزقنا سرورًا لا يشوبه حزن، وسعادةً لا يعكّرها شقاء، وعافيةً لا تزول»،"], [162.0, "وهو يطلب ذلك في الدنيا؛"], [165.0, "فإنّ ذلك مخالفٌ لسنّة الله الكونيّة."]], "tr": [[127.0, "\"Allah'ım, beni meleklerinden kıl\" demesi;"], [130.2, "\"Allah'ım, ölümüzü bize dirilt\" demesi;"], [133.4, "\"Allah'ım, beşeriyetin gereklerini —yani yemeyi, içmeyi, def-i hâceti ve uykuyu— benden kaldır\" demesi gibi."], [146.5, "Hatta —dikkat edin— şunu söylemesi de haddi aşmadandır:"], [152.0, "\"Allah'ım, bize hiçbir hüznün karışmadığı bir sevinç, hiçbir bedbahtlığın bulandırmadığı bir mutluluk ve hiç zâil olmayan bir âfiyet ver.\" Bunu dünyada istiyorsa, bu Allah'ın kevnî sünnetine aykırıdır."]]}, {"reader": false, "ar": [[168.0, "فإنّ المتقرّر في القواعد أنّ التعبُّد لا يمنع المصائب؛"], [172.0, "فإنّ أعظمَ المتعبّدين صلى الله عليه وسلم لا تزال المصائب تُصيبه."], [180.0, "فلا يظنّنّ الإنسان أنه إذا اجتهد في عبادة الله عز وجل أنّ الله سيَقيه تلك المصائبَ التي تجري بها سنّتُه الكونيّة،"], [191.0, "أو أنه سيكون في مأمنٍ من نوائب الدهر."], [196.0, "فلا تزال المصائب تُصيب الإنسان حتى وإن كان من المتعبّدين،"], [202.0, "بل إنّ الإنسان كلّما عظُم اقترابًا من الله عز وجل بحسن التعبُّد كلّما عظُم بلاؤه،"], [209.0, "كما قال النبيّ صلى الله عليه وسلم لمّا سُئل:"], [212.5, "أيُّ الناس أشدُّ بلاءً؟"], [214.0, "قال: «الأنبياء، الأمثلُ فالأمثل»."]], "tr": [[168.0, "Çünkü kaidelerde yerleşik olan şudur:"], [169.8, "Kulluk (taabbüd) musibetlere engel olmaz."], [172.0, "Nitekim kulluk edenlerin en büyüğü olan sallallâhu aleyhi ve sellem'e musibetler isabet etmeye devam ederdi."], [180.7, "İnsan, Allah Azze ve Celle'ye ibadette gayret ederse Allah'ın onu, kevnî sünnetinin gereği olarak meydana gelen o musibetlerden koruyacağını veya zamanın felaketlerinden emin olacağını sanmasın."], [193.5, "İbadet edenlerden olsa bile musibetler insana isabet etmeye devam eder."], [199.0, "Hatta insan güzel kulluğuyla Allah Azze ve Celle'ye yakınlıkta büyüdükçe belası da büyür."], [204.9, "Nitekim Peygamber sallallâhu aleyhi ve sellem'e \"İnsanların belası en şiddetli olanı kimdir?\" diye sorulduğunda \"Peygamberler, sonra (faziletçe) onlara en yakın olanlar, sonra onlara en yakın olanlar\" buyurmuştur."]]}, {"reader": false, "ar": [[217.0, "فمثلُ هذا الدعاء إذا كان يُقصَد به في الدنيا ـ بأن يرزقه الله سرورًا في الدنيا لا يحزن بعده أبدًا،"], [225.0, "وصحّةً لا يمرض بعدها أبدًا ـ فإنّ ذلك من الاعتداء؛"], [230.2, "لأنه جرى على خلاف سنّة الله عز وجل الكونيّة في جريان أقداره على العبد في هذه الحياة:"], [237.0, "بين مصيبةٍ وغيرها، وبين حزنٍ وفرح،"], [241.3, "وبين ضيقٍ وسعة، وبين صحّةٍ ومرض."]], "tr": [[217.0, "Böyle bir duayla dünyada (bir şey) kastediliyorsa —Allah'ın ona dünyada, ardından asla hüzünlenmeyeceği bir sevinç ve ardından asla hastalanmayacağı bir sağlık vermesi— bu haddi aşmadandır."], [229.3, "Çünkü bu, Allah Azze ve Celle'nin bu hayatta kul üzerinde kaderlerini işletmesindeki kevnî sünnetine aykırı olarak yapılmıştır:"], [235.5, "musibet ile başkası, hüzün ile sevinç, darlık ile genişlik, sağlık ile hastalık arasında (gidip gelmesi)."]]}, {"reader": false, "ar": [[247.0, "وهنا إشكال ـ أو هنا مجموعةُ إشكالاتٍ قد تُشكِل على هذه الكلّيّة ـ:"], [257.0, "الإشكال الأوّل: إننا نرى زكريّا عليه الصلاة والسلام قد دعا اللهَ عز وجل أن يرزقه الولدَ على الكِبَر،"], [268.0, "ومن المعلوم أنّ سنّة الله جرت أنّ الإنسان إنما يمكن أن يُولَد له إذا كان في زمن الإمكان."], [277.0, "ولكن إذا كان الرجل قد بلغ به الكِبَرُ عِتِيًّا،"], [282.0, "واشتعل رأسُه شيبًا، وامرأتُه كبيرةٌ في السنّ،"], [288.0, "فكونُ الإنسان يدعو الله بالولد في هذه الحالة فكأنه دعاءٌ يخالف سنّة الله الكونيّة."]], "tr": [[247.0, "Burada bir problem var —ya da bu külliyeye itiraz olarak getirilebilecek bir grup problem var—:"], [261.3, "Birinci problem: Zekeriyyâ aleyhisselâmın, yaşlılığında kendisine çocuk vermesi için Allah Azze ve Celle'ye dua ettiğini görüyoruz."], [270.3, "Bilinen şudur ki Allah'ın sünneti, insanın ancak imkân çağında olduğunda çocuğunun olabileceği şeklinde cereyan etmiştir."], [278.7, "Fakat adam iyice yaşlanmış, başı ağarmış ve karısı da yaşlı ise, insanın bu durumda Allah'tan çocuk dilemesi, Allah'ın kevnî sünnetine aykırı bir dua gibidir."]]}]}, {"ts": "04:57", "title": "1. Külliye (devam): İtirazlara cevaplar — Zekeriyyâ'nın duası, ümmetin kendi arasındaki savaş", "paras": [{"reader": false, "ar": [[297.0, "وهذا ليس بصحيح؛ فإنه ليس من سنّة الله الكونيّة ألّا يُولَد لكبير السنّ،"], [309.0, "ولكنّه شيءٌ نادر، لكن ليس بممتنعٍ في ذاته."], [314.0, "فهو وإن كان نادرًا إلا أنه ليس بممتنعٍ في ذاته."], [320.0, "فيكون زكريّا عليه الصلاة والسلام لم يسأل ربَّه شيئًا ممتنعًا أو مستحيلًا لذاته،"], [327.0, "وإنما دعا ربَّه بشيءٍ نادرٍ قد لا يتحقّق إلا في أحد الناس."], [336.0, "فلا يكون ذلك الإشكال بمعارضٍ لما قرّرناه في هذه الكلّيّة."]], "tr": [[297.0, "Bu doğru değildir. Çünkü yaşlı kimsenin çocuğunun olmaması Allah'ın kevnî sünnetinden değildir;"], [308.5, "bu nadir bir şeydir ama zâtı itibarıyla imkânsız değildir."], [314.6, "Nadir olsa da zâtı itibarıyla imkânsız değildir."], [319.4, "Dolayısıyla Zekeriyyâ aleyhisselâm Rabbinden zâtı itibarıyla imkânsız veya muhal bir şey istememiş, ancak insanlardan yalnızca birinde gerçekleşebilecek nadir bir şeyi Rabbinden dilemiştir."], [333.8, "Bu problem, bu külliyede takrir ettiğimiz şeye muâraza (itiraz) teşkil etmez."]]}, {"reader": false, "ar": [[342.0, "وقالوا أيضًا: إننا نرى أنّ النبيّ صلى الله عليه وسلم سأل ربَّه ألّا يجعل بأسَ أمّته بينهم،"], [354.0, "مع أنّ هذا مخالفٌ لسنّة الله الكونيّة؛"], [359.0, "لقول النبيّ صلى الله عليه وسلم في الحديث:"], [363.0, "«وإنّي سألتُ ربّي ألّا يجعل بأسهم بينهم، فقال: يا محمّد، إنّي إذا قضيتُ قضاءً فإنه لا يُرَدّ» الحديثَ بتمامه."], [372.0, "فأفاد هذا الحديث أنّ بأس الأمّة سيكون بينها،"], [378.0, "وأنّ بعضها سيُهلك بعضًا،"], [380.9, "ويقتل بعضُها بعضًا. فبما أنه جرى في سنّة الله الكونيّة أنه سيكون في الأمّة ذلك،"], [388.0, "وأنّ هلاك الأمّة سيكون في ذلك،"], [391.0, "فلماذا دعا النبيّ صلى الله عليه وسلم بشيءٍ يخالف سنّة الله الكونيّة؟"]], "tr": [[342.0, "Şunu da söylediler: Peygamber sallallâhu aleyhi ve sellem'in, ümmetinin şiddetini (savaşını) kendi aralarında kılmaması için Rabbine dua ettiğini görüyoruz;"], [354.7, "oysa bu, Allah'ın kevnî sünnetine aykırıdır."], [358.3, "Çünkü Peygamber sallallâhu aleyhi ve sellem hadiste şöyle buyurmuştur:"], [363.0, "\"Rabbimden onların şiddetini kendi aralarında kılmamasını istedim."], [366.5, "(Rabbim) buyurdu ki: Ey Muhammed!"], [368.7, "Ben bir hüküm verdiğimde o geri çevrilmez.\" Hadisin tamamı (bilinmektedir)."], [373.4, "Bu hadis, ümmetin şiddetinin kendi arasında olacağını, bir kısmının diğerini helâk edeceğini ve birbirini öldüreceğini ifade etmiştir."], [384.2, "Ümmette bunun olacağı ve ümmetin helâkinin bunda olacağı Allah'ın kevnî sünnetinde cereyan ettiğine göre, Peygamber sallallâhu aleyhi ve sellem neden Allah'ın kevnî sünnetine aykırı bir şeyle dua etti?"]]}, {"reader": false, "ar": [[397.0, "الجواب: لا إشكال في ذلك؛"], [399.2, "لأنه جرى قبل العلم."], [401.0, "لا إشكال في ذلك؛"], [403.5, "لأنه جرى قبل العلم."], [406.0, "ولذلك أعلمه الله عز وجل ـ بعد أن دعا بهذه الدعوة ـ بقوله:"], [412.7, "«وإنّي أعطيتُك لأمّتك ألّا أُهلكهم بسنةٍ بعامّة، وألّا أُسلّط عليهم عدوًّا من سوى أنفسهم فيستبيحَ بيضتهم»،"], [424.0, "ولكنّ الثالثة ـ وش هي؟"], [426.4, "إيه ـ قال: «إنّي إذا قضيتُ قضاءً فإنه لا يُرَدّ... حتى يُهلك بعضُهم بعضًا، ويسبي بعضُهم بعضًا»."], [436.0, "وبعدها لم يدعُ النبيّ صلى الله عليه وسلم بشيءٍ من ذلك أبدًا."], [441.0, "ومن المعلوم أنّ التكاليف الشرعيّة إنما تلزم الإنسان بعد العلم بها،"], [448.0, "فلا تكليفَ إلا بعلم،"], [449.8, "ولا عقوبةَ إلا بعد إنذار."]], "tr": [[397.0, "Cevap: Bunda bir problem yoktur;"], [398.8, "çünkü bu, bilgiden önce olmuştur."], [400.6, "(Tekrar ediyor.) Bu yüzden Allah Azze ve Celle, o bu duayı ettikten sonra ona şu sözüyle bildirdi:"], [410.2, "\"Ümmetin için sana, onları umumi bir kıtlıkla helâk etmememi ve üzerlerine kendilerinden olmayan bir düşmanı musallat edip de onların kökünü kazımasına izin vermememi verdim.\" Ama üçüncüsü —neydi?"], [426.4, "Evet— (Allah) buyurdu: \"Ben bir hüküm verdiğimde o geri çevrilmez… ta ki bir kısmı diğerini helâk etsin ve bir kısmı diğerini esir alsın.\" Bundan sonra Peygamber sallallâhu aleyhi ve sellem bu konuda asla dua etmedi."], [442.9, "Bilinen şudur ki şer'î yükümlülükler insana ancak onları bildikten sonra lâzım olur."], [448.9, "Bilgi olmadan teklîf, uyarıdan önce ceza yoktur."]]}, {"reader": false, "ar": [[452.0, "وذكروا لنا إشكالًا ثالثًا أيضًا:"], [458.0, "وهي أنه ورد في الصحيح أنّ والد جابرٍ،"], [462.3, "عبدَ الله بن حرامٍ رضي الله عنه ـ وهو من شهداء أُحُد ـ أنّ الله عز وجل بعثه بين يديه وقال له:"], [471.6, "تمنَّ، فسأل ربَّه أن يردّه إلى الدنيا ليُقتَل فيه."], [476.0, "والحديث معروف، فيه يقول النبيّ صلى الله عليه وسلم لجابرٍ ـ يريد أن يُطيِّب خاطره،"], [484.7, "لأنه كان حزينًا على فقد أبيه وتركِ تلك البُنيّات له ـ فقال:"], [489.5, "«ما كلّم اللهُ أحدًا قطُّ إلا من وراء حجاب، وأحيا أباك فكلّمه كِفاحًا، فقال: يا عبدي، تمنَّ عليَّ أُعطِك. قال: يا ربّ، تُحييني فأُقتَلُ فيك ثانيةً. فقال الله عز وجل: إنه قد سبق منّي أنهم إليها لا يرجعون. قال: وأُنزلت هذه الآية: <span class=\"ayah\">﴿وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا ۚ بَلْ أَحْيَاءٌ عِندَ رَبِّهِمْ يُرْزَقُونَ﴾<\/span> <span class=\"ref\">[آل عمران: ١٦٩]<\/span>»."]], "tr": [[452.0, "Bize üçüncü bir problem de zikrettiler:"], [458.0, "Sahîh'te şöyle geldiği: Câbir'in babası Abdullah b."], [460.7, "Harâm —Allah ondan razı olsun— ki o Uhud şehitlerindendir;"], [464.9, "Allah Azze ve Celle onu huzuruna diriltti ve ona \"Dile (temenni et)\" dedi."], [470.0, "O da Rabbinden, O'nun yolunda (tekrar) öldürülmek için kendisini dünyaya geri döndürmesini istedi."], [475.0, "Hadis meşhurdur. Onda Peygamber sallallâhu aleyhi ve sellem Câbir'e —babasını kaybetmesine ve o küçük kızları ona bırakmasına üzüldüğü için gönlünü hoş etmek isteyerek— şöyle buyurur:"], [486.9, "\"Allah hiç kimseyle perde arkasından başka (bir şekilde) konuşmadı;"], [490.0, "babanı ise diriltip onunla yüz yüze konuştu ve 'Ey kulum!"], [494.0, "Benden dile, sana vereyim' buyurdu."], [497.5, "O 'Ey Rabbim! Beni dirilt de senin yolunda ikinci kez öldürüleyim' dedi."], [504.7, "Allah Azze ve Celle buyurdu ki:"], [511.1, "'Onların oraya geri dönmeyecekleri hükmü benden sâdır olmuştur.' (Câbir) dedi ki:"], [518.0, "Bunun üzerine şu ayet indirildi:"], [520.0, "<span class=\"ayah\">﴿Allah yolunda öldürülenleri sakın ölüler sanma; bilakis onlar diridirler, Rableri katında rızıklandırılırlar﴾<\/span> [Âl-i İmrân 169].\""]]}, {"reader": false, "ar": [[527.0, "فكيف يسأل عبدُ الله بن حرامٍ رضي الله عنه هذا السؤالَ الذي هو ممتنعٌ في سنّة الله الكونيّة؟"], [539.0, "الجواب: هذا سؤالُ استلذاذ،"], [541.8, "وليس سؤالًا يُراد به حقيقتُه."], [546.0, "ولذلك قال النبيّ صلى الله عليه وسلم في الحديث الصحيح:"], [553.2, "«ولَوَدِدتُ أنّي أُقتَل في سبيل الله ثم أُحيا، ثم أُقتَل ثم أُحيا»."], [564.0, "فهذا إنما يُقال على سبيل الاستلذاذ بمثل هذه المَنِيّة المحبوبة لله عز وجل،"], [571.0, "والتي رتّبت عليها الشريعة تلك الأجورَ العظيمة،"], [574.2, "ولا يُراد بها حقيقتُها."]], "tr": [[527.0, "Abdullah b. Harâm —Allah ondan razı olsun— Allah'ın kevnî sünnetinde imkânsız olan bu isteği nasıl ister?"], [537.0, "Cevap: Bu, lezzet alma (istilzâz) kabilinden bir istektir;"], [542.6, "hakikati kastedilen bir istek değildir."], [546.7, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem sahih hadiste şöyle buyurmuştur:"], [554.1, "\"Allah yolunda öldürülmeyi, sonra diriltilmeyi, sonra öldürülmeyi, sonra diriltilmeyi ne kadar isterdim!\" Bu, ancak Allah Azze ve Celle'nin sevdiği ve şeriatin o büyük ecirleri bağladığı bu tür bir ölümden lezzet alma kabilinden söylenir; hakikati kastedilmez."]]}, {"reader": false, "ar": [[576.0, "فإن لم يُرضَ بهذا الجواب فنقول:"], [578.8, "إنّ هذا السؤال حصل في أحكام الدنيا ولا في أحكام البرزخ؟"], [584.0, "الجواب: بل في دار البرزخ،"], [591.0, "ودارُ البرزخ لها أحكامها وخصائصها،"], [594.0, "وإنما نحن نتكلّم عن الدعاء الذي يخالف سنّة الله الكونيّة في هذه الدنيا."], [601.0, "وبهذين الجوابين يتحرّر هذا الإشكال إن شاء الله تعالى."]], "tr": [[576.0, "Bu cevaba razı olunmazsa deriz ki:"], [578.8, "Bu istek dünya hükümlerinde mi, yoksa berzah hükümlerinde mi gerçekleşti?"], [583.5, "Cevap: Bilakis berzah yurdunda. Berzah yurdunun kendine has hükümleri ve özellikleri vardır."], [594.5, "Biz ise ancak bu dünyada Allah'ın kevnî sünnetine aykırı olan duadan bahsediyoruz."], [601.0, "Bu iki cevapla, inşallah bu problem çözülmüş olur."]]}]}, {"ts": "10:08", "title": "1. Külliye (sonu): Berzah hükümleri dünya hükümlerine kıyas edilmez", "paras": [{"reader": false, "ar": [[608.0, "بل ويدلّ عليه أيضًا ما أخرجه الترمذيّ في «جامعه» بإسنادٍ حسن،"], [612.9, "من حديث أبي هريرة رضي الله عنه في قصّة سؤال الملَكين للمؤمن،"], [619.0, "قال: «ثم يُفسَح له قبرُه سبعون ذراعًا في سبعين، ويُنوَّر له فيه، ثم يُقال له: نَمْ، فيقول: أرجعُ إلى أهلي فأُخبرهم، فيُقال: نَمْ كنومة العروس الذي لا يوقظه إلا أحبُّ أهله إليه» الحديثَ بتمامه."], [640.0, "فمثلُ هذا إنما يجري مجرى أحكام البرزخ،"], [644.0, "التي لا يجوز قياسُ أحكام الدنيا عليها؛"], [646.8, "للاختلاف بين الدارين. فيجوز في دار البرزخ ما لا يجوز في هذه الدنيا. والله أعلم."]], "tr": [[608.0, "Hatta buna, Tirmizî'nin \"Câmi\"inde hasen bir isnadla Ebû Hüreyre —Allah ondan razı olsun— hadisinden, iki meleğin mü'mini sorgulaması kıssası hakkında rivayet ettiği şey de delâlet eder."], [618.4, "(Peygamber) buyurdu: \"Sonra kabri ona yetmiş zirâa yetmiş zirâ genişletilir ve orada onun için nurlandırılır."], [625.0, "Sonra ona 'Uyu' denir. O 'Aileme döneyim de onlara haber vereyim' der."], [632.4, "'Kendisini ailesinin en sevdiğinden başkasının uyandırmadığı gelin uykusu gibi uyu' denir.\" Hadisin tamamı (bilinmektedir)."], [640.6, "Bu gibi şeyler ancak, iki yurt arasındaki farklılık sebebiyle dünya hükümlerinin kendilerine kıyas edilmesi caiz olmayan berzah hükümleri cinsindendir."], [649.0, "Berzah yurdunda, bu dünyada caiz olmayan şey caiz olur. Allah en iyisini bilir."]]}]}, {"ts": "10:56", "title": "2. Külliye: Haramın elde edilmesi veya kolaylaştırılması için Allah'a dua eden herkes duada haddi aşmıştır", "paras": [{"reader": false, "ar": [[656.0, "الكلّيّة الثانية: <b>كلُّ من دعا اللهَ بالحرام تحصيلًا أو تيسيرًا فمعتدٍ في الدعاء.<\/b> كلُّ من دعا اللهَ بالحرام تحصيلًا أو تيسيرًا فمعتدٍ في الدعاء."], [676.0, "كلُّ من دعا اللهَ بالحرام تحصيلًا وتيسيرًا فمعتدٍ في الدعاء."]], "tr": [[656.0, "<b>2. külliye: Haramın elde edilmesi veya kolaylaştırılması için Allah'a dua eden herkes duada haddi aşmıştır.<\/b> (İki kez daha tekrar ediyor.)"]]}, {"reader": false, "ar": [[683.0, "أقول وبالله التوفيق: لا شكّ أنه لا يجوز للإنسان أن يطلب من الله تعالى تيسيرَ الحرام من الزنا وغيره؛"], [692.0, "لأنّ الحرام يجب بغضُه وكراهتُه وإنكارُه بالقلب في أضعف الأحوال،"], [700.0, "وطلبُه من الله عز وجل أن يُيسّره له يُنافي ذلك."], [706.0, "ولهذا كان هذا الدعاء محرّمًا بالإجماع،"], [712.0, "ومن جملة الاعتداء في الدعاء."]], "tr": [[683.0, "Tevfik Allah'tandır, derim ki: Şüphesiz insanın Allah Teâlâ'dan zina ve benzeri haramların kolaylaştırılmasını istemesi caiz değildir."], [690.4, "Çünkü harama buğzetmek, onu kerih görmek ve en zayıf hâlde kalben onu inkâr etmek vâciptir."], [700.0, "Allah Azze ve Celle'den onu kendisine kolaylaştırmasını istemek buna aykırıdır."], [705.4, "Bu yüzden bu dua icmâ ile haramdır ve duada haddi aşma (çeşitlerin)dendir."]]}, {"reader": false, "ar": [[716.0, "قال القرافيّ رحمه الله تعالى في «الفروق»:"], [721.0, "«القسم الثاني عشر من الدعاء المحرَّم» ـ وأنا أوصيكم أن تقرؤوه إذا كانت عبارته سهلة،"], [728.0, "في بعض المواضع عبارتُه سهلة،"], [730.9, "فطيّبٌ قراءتُه ـ: «القسم الثاني عشر من الدعاء المحرَّم الذي ليس بكفر: وهو ما استفاد التحريمَ من متعلَّقه، وهو المدعوُّ به، لكونه طلبًا لوقوع المحرَّمات في الوجود؛ إمّا للداعي <span class=\"q\">؟ 12:25<\/span> فكقوله: اللهمّ أمِتْه كافرًا، أو اسقِه خمرًا، أو أعِنه على المَكْس الفلانيّ» ـ وهي جبايةُ المال ظلمًا ـ «أو وطءِ الأجنبيّة الفلانيّة، أو يسِّر له الولايةَ الفلانيّة، وهي مشتملةٌ على معصية."]], "tr": [[716.0, "Karâfî —Allah Teâlâ ona rahmet etsin— \"el-Furûk\"ta şöyle demiştir:"], [721.0, "\"Haram duanın on ikinci kısmı\" —onu okumanızı tavsiye ederim, eğer ibaresi kolaysa;"], [726.0, "bazı yerlerde ibaresi kolaydır, okunması güzeldir—:"], [729.1, "\"Haram duanın, küfür olmayan on ikinci kısmı:"], [732.7, "Haramlığını taalluk ettiği şeyden, yani kendisiyle dua edilen şeyden alan duadır;"], [737.4, "çünkü haramların varlıkta meydana gelmesini istemektir."], [739.7, "Ya duacı için <span class=\"q\">؟<\/span> olur;"], [741.7, "şöyle demesi gibi: Allah'ım, onu kâfir olarak öldür;"], [746.9, "ya da ona şarap içir;"], [750.2, "ya da onu falanca mekste (haksız vergide) destekle\" —meks, malı zulmen toplamaktır— \"ya da falanca yabancı kadınla cinsî birleşmede (destekle);"], [759.2, "ya da ona, masiyet içeren falanca valiliği kolaylaştır."]]}, {"reader": false, "ar": [[763.0, "أو يطلب ذلك لغيره:"], [765.0, "إمّا لعدوّه، كقوله: اللهمّ لا تُمِت فلانًا على الإسلام،"], [770.0, "اللهمّ سلِّط عليه من يقتله أو يأخذ مالَه؛"], [773.0, "وإمّا لصديقه، فيقول: اللهمّ يسِّر له الولايةَ الفلانيّة،"], [778.5, "أو السفرَ الفلانيّ، أو صحبةَ الوزير فلان،"], [782.3, "أو الملك فلان؛ ويكون جميعُ ذلك مشتملًا على معصيةٍ من معاصي الله تعالى."], [788.0, "فجميعُ ذلك محرَّمٌ تحريمَ الوسائل،"], [791.0, "ومنزلتُه من التحريم منزلةُ متعلَّقه»."], [795.0, "انتهى كلامه رحمه الله."]], "tr": [[763.0, "Ya da bunu başkası için ister:"], [765.5, "Ya düşmanı için; 'Allah'ım, falancayı İslâm üzere öldürme;"], [769.4, "Allah'ım, onu öldürecek veya malını alacak birini ona musallat et' demesi gibi;"], [773.9, "ya da dostu için; 'Allah'ım, ona falanca valiliği, falanca yolculuğu, falan vezirin veya falan hükümdarın yakınlığını kolaylaştır' der;"], [782.9, "bütün bunlar da Allah Teâlâ'ya isyanlardan bir isyanı içerir."], [786.4, "Bütün bunlar vesileler haramlığıyla haramdır ve haramlıktaki derecesi, taalluk ettiği şeyin derecesidir.\" Sözü —Allah ona rahmet etsin— burada sona erdi."]]}, {"reader": false, "ar": [[797.0, "وقال ابن القيّم رحمه الله تعالى:"], [800.5, "«فالاعتداء بالدعاء تارةً بأن يسأل ما لا يجوز له سؤالُه من الإعانة على المحرّمات»."], [808.8, "انتهى كلامه. فلا يجوز للإنسان أن يستعين بالله عز وجل على شيءٍ يُغضب الله عز وجل ويكرهه ولا يرضاه؛"], [818.1, "فإنّ ذلك من الاعتداء في الدعاء."]], "tr": [[797.0, "İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [800.5, "\"Duada haddi aşma, bazen kişinin, haramlara yardım gibi istemesi caiz olmayan bir şeyi istemesiyle olur.\" Sözü burada sona erdi."], [810.5, "İnsanın, Allah Azze ve Celle'yi gazaplandıran, O'nun kerih gördüğü ve razı olmadığı bir şey için Allah'tan yardım dilemesi caiz değildir;"], [818.6, "çünkü bu, duada haddi aşmadandır."]]}]}, {"ts": "13:41", "title": "3. Külliye: Namazın dübüründe meşru olan şey dua ise selamdan önce, senâ ise selamdan sonradır", "paras": [{"reader": false, "ar": [[821.0, "ومن الكلّيّات أيضًا: كلُّ ما هو مشروعٌ دُبُرَ الصلاة:"], [826.9, "إن كان دعاءً فقبل السلام،"], [830.2, "وإن كان ثناءً فبعده. كلُّ ما هو مشروعٌ دُبُرَ الصلاة:"], [843.0, "إن كان دعاءً فقبل السلام،"], [846.3, "وإن كان ثناءً فبعد السلام."], [849.4, "وهذا القول في هذه الكلّيّة ـ عفوًا ـ وهذه الكلّيّة اختارها أبو العبّاس ابن تيميّة رحمه الله تعالى."]], "tr": [[821.0, "Külliyelerden biri de şudur: 3."], [824.9, "külliye: Namazın dübüründe (sonunda) meşru olan her şey, dua ise selamdan önce, senâ ise selamdan sonradır. (Tekrar ediyor.) Bu külliyedeki bu görüş —pardon— bu külliyeyi Ebü'l-Abbâs İbn Teymiyye —Allah Teâlâ ona rahmet etsin— tercih etmiştir."]]}, {"reader": false, "ar": [[865.0, "وذلك لأنّ عندنا أحاديثَ شرعها النبيّ صلى الله عليه وسلم دُبُرَ الصلاة؛"], [871.0, "فهناك مجموعةٌ من الأقوال قال فيها الشارع:"], [875.2, "افعلوها دُبُرَ الصلاة. واختلف العلماء في الدُّبُريّة هنا:"], [881.0, "فمنهم من قال بأنّ دُبُرَ كلِّ شيءٍ هو آخرُ الشيء منه،"], [890.0, "وقبل الفراغ؛ ومنهم من قال:"], [894.0, "هو آخرُ الشيء منه بعد الفراغ."]], "tr": [[865.0, "Bu böyledir; çünkü Peygamber sallallâhu aleyhi ve sellem'in namazın dübüründe meşru kıldığı hadislerimiz vardır."], [871.0, "Şâri'in \"Bunları namazın dübüründe yapın\" dediği bir grup söz vardır."], [876.4, "Âlimler buradaki \"dübür\" (kavramı) hakkında ihtilaf etmişlerdir:"], [881.0, "Kimisi, her şeyin dübürünün o şeyin son kısmı olduğunu, (yani) bitirmeden önce olduğunu söylemiştir;"], [892.0, "kimisi de onun, bitirdikten sonra o şeyin sonu olduğunu söylemiştir."]]}, {"reader": false, "ar": [[898.0, "وجاء أبو العبّاس ابن تيميّة وجمعٌ من المحقّقين من أهل العلم فقالوا بأننا لا بدّ أن نفرّق في الدُّبُريّة باعتبار متعلَّق القول:"], [910.0, "فإذا كان القول الذي شُرع دُبُرَ الصلاة دعاءً فإنّ المناسب في الأدعية أن تكون قبل السلام ـ أي قبل مفارقة المَلِك،"], [923.0, "وقبل الخروج من مجلسه ـ فإنّ هذا أدعى لاستجابته."], [930.0, "وأمّا إذا كان القول المشروع دُبُرَ الصلاة ثناءً وذكرًا فإنه يكون بعد السلام."], [939.0, "وهذا قولٌ وسط، وخيرُ الأمور أوساطها."]], "tr": [[898.0, "Ebü'l-Abbâs İbn Teymiyye ve ilim ehlinin muhakkiklerinden bir topluluk gelip şöyle dediler:"], [904.0, "Dübür meselesinde, sözün taalluk ettiği şeye göre ayrım yapmamız gerekir."], [909.4, "Namazın dübüründe meşru kılınan söz dua ise, dualarda uygun olan onların selamdan önce, yani Melik'ten (Allah'tan) ayrılmadan ve O'nun meclisinden çıkmadan önce olmasıdır;"], [923.8, "çünkü bu, icabet edilmesine daha elverişlidir."], [927.7, "Namazın dübüründe meşru olan söz senâ ve zikir ise selamdan sonra olur."], [936.8, "Bu orta bir görüştür; işlerin en hayırlısı da ortasıdır."]]}]}, {"ts": "15:43", "title": "3. Külliye (devam): İbn Teymiyye ve İbnü'l-Kayyim'den nakiller", "paras": [{"reader": false, "ar": [[943.0, "قال أبو العبّاس ابن تيميّة رحمه الله ـ في نقلٍ مطوّل،"], [948.5, "واحتملوه ـ: «وأمّا لفظ دُبُر الصلاة فقد يُراد به آخرُ جزءٍ منه، وقد يُراد به ما يلي آخرَ جزءٍ منه، كما في دُبُر الإنسان فإنه آخرُ جزءٍ منه. ومثلُه لفظ العَقِب: قد يُراد به الجزءُ المؤخَّر من الشيء كعَقِب الإنسان، وقد يُراد به ما يلي ذلك. فالدعاء المذكور في دُبُر الصلاة إمّا أن يُراد به آخرُ جزءٍ منها ليوافق بقيّة الأحاديث، أو يُراد به ما يلي آخرها، ويكون ذلك ما بعد التشهّد، كما سُمّي ذلك قضاءً للصلاة وفراغًا منها، حيث لم يبقَ إلا السلامُ المنافي للصلاة؛ أو يكون مطلقًا أو مجملًا. وبكلّ حالٍ فلا يجوز أن يُخَصّ به ما بعد السلام؛ لأنّ عامّة الأدعية المأثورة كانت قبل ذلك» ـ أي قبل السلام."]], "tr": [[943.0, "Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— uzun bir nakilde —sabredin— şöyle demiştir:"], [949.0, "\"Namazın dübürü lafzıyla bazen onun son cüz'ü kastedilir, bazen de son cüz'ünü takip eden şey kastedilir;"], [955.9, "insanın dübüründe (arkasında) olduğu gibi, o onun son cüz'üdür."], [960.2, "'Akib' (topuk / ardı) lafzı da böyledir:"], [964.0, "Bazen bir şeyin geride kalan cüz'ü kastedilir, insanın topuğu gibi;"], [970.4, "bazen de onu takip eden şey kastedilir."], [974.4, "Namazın dübüründe zikredilen dua ile ya —diğer hadislere uygun düşmesi için— namazın son cüz'ü kastedilir ya da sonunu takip eden şey kastedilir;"], [983.0, "bu da teşehhüdden sonrasıdır. Nitekim buna namazın kazası (tamamlanması) ve ondan fâriğ olmak denmiştir;"], [989.4, "çünkü geriye namaza aykırı olan selamdan başka bir şey kalmamıştır."], [993.8, "Ya da (lafız) mutlak veya mücmeldir."], [996.2, "Her hâlükârda onunla selamdan sonrasını tahsis etmek caiz değildir;"], [999.6, "çünkü me'sûr duaların geneli bundan önceydi\" —yani selamdan önce."]]}, {"reader": false, "ar": [[1006.0, "وقال ابن القيّم رحمه الله تعالى:"], [1008.0, "«ودُبُر الصلاة يحتمل قبل السلام وبعده، وكان شيخنا» ـ يعني ابن تيميّة ـ «يُرجّح أن يكون قبل السلام، فراجعتُه فيه فقال: دُبُر كلِّ شيءٍ منه، كدُبُر الحيوان»."], [1024.0, "وهذا أنسب لتعظيم الله عز وجل؛"], [1029.0, "فلا شكّ أنّ الدعاء في الصلاة أولى،"], [1032.5, "لأنه في حال مناجاة الربّ سبحانه وتعالى."]], "tr": [[1006.0, "İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1008.0, "\"Namazın dübürü, selamdan önceyi de sonrayı da ihtimal dâhilinde tutar."], [1013.0, "Şeyhimiz\" —yani İbn Teymiyye— \"onun selamdan önce olmasını tercih ederdi."], [1017.0, "Bu konuda ona müracaat ettim;"], [1019.8, "dedi ki: Her şeyin dübürü ondandır, hayvanın dübürü (arkası) gibi.\" Bu, Allah Azze ve Celle'yi tazime daha uygundur."], [1030.5, "Şüphesiz namaz içindeki dua daha evlâdır;"], [1033.0, "çünkü Rab Sübhânehû ve Teâlâ'ya münâcât hâlindedir."]]}, {"reader": false, "ar": [[1036.0, "قال شيخ الإسلام ابن تيميّة رحمه الله:"], [1039.0, "«وذلك لأنّ المصلّي يناجي ربَّه، فإذا سلّم انصرف عن مناجاته، ومعلومٌ أنّ سؤال السائل لربّه حالَ مناجاته هو الذي يناسب، دون سؤاله بعد انصرافه؛ كما أنّ من كان يخاطب مَلِكًا أو غيره فإنّ سؤاله وهو مُقبِلٌ على مخاطبته أولى من سؤاله له بعد انصرافه»."], [1064.0, "وقال في موضعٍ آخر:"], [1067.0, "«الأحاديث المعروفة في الصحاح والسنن والمساند تدلّ على أنّ النبيّ صلى الله عليه وسلم كان يدعو في دُبُر صلاته قبل الخروج منها، وكان يأمر أصحابه بذلك، ويعلّمهم ذلك». انتهى كلامه."]], "tr": [[1036.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1039.6, "\"Bu böyledir; çünkü namaz kılan Rabbine münâcât eder."], [1044.3, "Selam verince O'na münâcâttan ayrılır."], [1047.2, "Bilinmektedir ki isteyenin Rabbinden münâcâtı hâlinde istemesi uygun olandır, ayrıldıktan sonra istemesi değil."], [1054.1, "Nitekim bir hükümdarla veya başkasıyla konuşan kimsenin, onunla konuşmaya yönelmişken istemesi, ayrıldıktan sonra istemesinden daha evlâdır.\" Başka bir yerde de şöyle demiştir:"], [1067.0, "\"Sahîhlerde, Sünenlerde ve Müsnedlerde bilinen hadisler, Peygamber sallallâhu aleyhi ve sellem'in namazının dübüründe, namazdan çıkmadan önce dua ettiğine, ashâbına bunu emrettiğine ve onlara bunu öğrettiğine delâlet eder.\" Sözü burada sona erdi."]]}, {"reader": false, "ar": [[1083.0, "وأمّا إذا كان ما قيل فيه «دُبُر الصلاة» ذكرًا أو ثناءً فإنّ المشروع أن يقوله بعد السلام."], [1092.0, "وبناءً على ذلك: فحديث معاذٍ عند الإمام أبي داود والترمذيّ،"], [1096.0, "في قول النبيّ صلى الله عليه وسلم:"], [1098.1, "«أوصيك يا معاذ، لا تدَعَنّ دُبُرَ كلِّ صلاةٍ أن تقول: اللهمّ أعِنّي على ذكرك وشكرك وحسن عبادتك»،"], [1107.0, "أنّ السنّة فيه أن يقوله قبل السلام لأنه دعاء."]], "tr": [[1083.0, "Hakkında \"namazın dübüründe\" denilen şey zikir veya senâ ise, meşru olan onu selamdan sonra söylemesidir."], [1089.9, "Buna binaen İmam Ebû Dâvûd ve Tirmizî'deki Muâz hadisinde, Peygamber sallallâhu aleyhi ve sellem'in \"Ey Muâz!"], [1096.3, "Sana tavsiye ederim: Her namazın dübüründe 'Allah'ım, seni zikretmem, sana şükretmem ve sana güzelce ibadet etmem için bana yardım et' demeyi asla bırakma\" sözünde sünnet olan, onu selamdan önce söylemesidir; çünkü bu bir duadır."]]}, {"reader": false, "ar": [[1112.0, "وكذلك ما في «صحيح الإمام البخاريّ» من حديث سعد بن أبي وقّاصٍ رضي الله عنه:"], [1118.3, "أنه كان يعلّم بنيه هؤلاء الكلمات،"], [1121.0, "ويقول: إنّ النبيّ صلى الله عليه وسلم كان يتعوّذ بهنّ دُبُرَ الصلاة ـ دُبُرَ الصلاة ـ:"], [1126.0, "«اللهمّ إنّي أعوذ بك من الجبن، وأعوذ بك من البخل، وأعوذ بك من أن أُرَدّ إلى أرذل العمر، وأعوذ بك من فتنة الدنيا، وأعوذ بك من عذاب القبر»."]], "tr": [[1112.0, "Aynı şekilde İmam Buhârî'nin \"Sahîh\"inde Sa'd b."], [1114.9, "Ebî Vakkâs —Allah ondan razı olsun— hadisinde geçen:"], [1118.8, "O, oğullarına bu kelimeleri öğretir ve \"Peygamber sallallâhu aleyhi ve sellem namazın dübüründe —namazın dübüründe— bunlarla (Allah'a) sığınırdı\" derdi:"], [1126.8, "\"Allah'ım! Korkaklıktan sana sığınırım, cimrilikten sana sığınırım, ömrün en düşkün çağına döndürülmekten sana sığınırım, dünyanın fitnesinden sana sığınırım ve kabir azabından sana sığınırım.\""]]}, {"reader": false, "ar": [[1136.0, "وكذلك أيضًا حديث المغيرة:"], [1140.0, "أنّ النبيّ صلى الله عليه وسلم كان يقول في دُبُر كلّ صلاة:"], [1146.0, "«لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كلّ شيءٍ قدير» الحديثَ بتمامه؛"], [1153.0, "هذا من السنّة أن يقوله بعد السلام لأنه ذكرٌ وثناء."], [1158.0, "وكذلك حديث كعب بن عُجْرة في «صحيح الإمام مسلم»،"], [1163.0, "قال: قال النبيّ صلى الله عليه وسلم:"], [1166.0, "«مُعقِّباتٌ لا يخيب قائلُهنّ ـ أو قال: فاعلُهنّ ـ من الناس: ثلاثٌ وثلاثون تسبيحةً، وثلاثٌ وثلاثون تحميدةً، وأربعٌ وثلاثون تكبيرةً»؛"], [1176.0, "هذا من السنّة أن يقوله بعد السلام لأنه ثناء."]], "tr": [[1136.0, "Aynı şekilde Muğîre hadisi de:"], [1140.0, "Peygamber sallallâhu aleyhi ve sellem her namazın dübüründe şöyle derdi:"], [1144.5, "\"Allah'tan başka ilah yoktur; O tektir, ortağı yoktur."], [1147.4, "Mülk O'nundur, hamd O'nundur ve O her şeye kâdirdir.\" Hadisin tamamı (bilinmektedir)."], [1150.9, "Bunu selamdan sonra söylemek sünnettendir;"], [1153.0, "çünkü zikir ve senâdır. Aynı şekilde İmam Müslim'in \"Sahîh\"inde Ka'b b."], [1157.5, "Ucre hadisi: (Ka'b) dedi ki:"], [1160.2, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1163.4, "\"Ardı ardına söylenen (muakkıbât) öyle sözler vardır ki onları söyleyen —ya da 'onları yapan' buyurdu— insanlardan hiç kimse hüsrana uğramaz:"], [1172.0, "Otuz üç tesbih, otuz üç tahmîd ve otuz dört tekbir.\" Bunu selamdan sonra söylemek sünnettendir; çünkü senâdır."]]}, {"reader": false, "ar": [[1180.0, "فما كان من قبيل الدعاء فمشروعيّته تكون قبل السلام،"], [1184.0, "وما كان من قبيل الذكر والثناء فمشروعيّته تكون بعد السلام."], [1189.0, "وهذا أرجح الأقوال في هذه المسألة،"], [1192.0, "إلا إذا ورد دليلٌ بخصوصه يُصرّح بأنّ النبيّ صلى الله عليه وسلم إنما دعا بهذا النوع من الدعاء بعد السلام."]], "tr": [[1180.0, "Dua kabilinden olanın meşruiyeti selamdan önce, zikir ve senâ kabilinden olanın meşruiyeti ise selamdan sonradır."], [1187.0, "Bu meselede görüşlerin en râcihi budur."], [1190.0, "Ancak Peygamber sallallâhu aleyhi ve sellem'in bu tür bir duayı selamdan sonra ettiğini açıkça belirten, o duaya has bir delil gelirse (durum farklıdır)."]]}]}, {"ts": "20:07", "title": "3. Külliye (sonu): Selamdan sonra yapıldığı açıkça bildirilen dualar", "paras": [{"reader": false, "ar": [[1207.0, "كما في «صحيح الإمام مسلم» من حديث البراء بن عازبٍ رضي الله عنهما،"], [1211.0, "قال: «كنّا إذا صلّينا خلف النبيّ صلى الله عليه وسلم أحببنا أن نكون عن يمينه، ينصرف إلينا بوجهه، قال: فسمعته يقول: اللهمّ قِني عذابك يوم تبعث ـ أو قال: تجمع ـ عبادك»."], [1225.7, "وهذا تصريحٌ بأنه يكون بعد السلام."], [1229.0, "وفي حديث عليٍّ رضي الله عنه:"], [1231.3, "أنّ النبيّ صلى الله عليه وسلم كان يقول إذا انصرف ـ أو قال:"], [1235.9, "سلّم ـ من الصلاة: «اللهمّ اغفر لي ما قدّمتُ وما أخّرتُ، وما أسررتُ وما أعلنتُ» الحديثَ بتمامه."]], "tr": [[1207.0, "Nitekim İmam Müslim'in \"Sahîh\"inde Berâ b."], [1208.5, "Âzib —Allah ikisinden de razı olsun— hadisinde (şöyle geçer):"], [1211.0, "\"Peygamber sallallâhu aleyhi ve sellem'in arkasında namaz kıldığımızda, yüzüyle bize dönmesi için sağında olmayı severdik."], [1217.2, "(Berâ) dedi ki: Onun şöyle dediğini işittim:"], [1220.7, "Allah'ım, kullarını dirilteceğin —ya da 'toplayacağın' dedi— gün beni azabından koru.\" Bu, onun selamdan sonra olduğunun açıkça ifadesidir."], [1229.4, "Ali —Allah ondan razı olsun— hadisinde de Peygamber sallallâhu aleyhi ve sellem namazdan ayrıldığında —ya da 'selam verdiğinde' dedi— şöyle derdi:"], [1237.0, "\"Allah'ım! Önceden yaptığımı ve sonraya bıraktığımı, gizlediğimi ve açığa vurduğumu bağışla.\" Hadisin tamamı (bilinmektedir)."]]}, {"reader": false, "ar": [[1243.0, "فمتى ما صرّح الدليل بأنه كان يقوله بعد السلام فإننا نقول بمشروعيّته بعد السلام بخصوصه،"], [1252.0, "وأمّا ما لم يرد فيه تصريحٌ بخصوصه فإنّ الأصل أن يدعو به المصلّي قبل السلام."]], "tr": [[1243.0, "Delil, onun bunu selamdan sonra söylediğini açıkça ifade ettiği zaman, o duaya has olarak selamdan sonra meşru olduğunu söyleriz."], [1252.5, "Hakkında özel bir açık ifade gelmeyen duada ise asıl olan, namaz kılanın onu selamdan önce okumasıdır."]]}]}, {"ts": "20:59", "title": "4. Külliye: Bütün dualarda elleri kaldırmak meşrudur; elleri kaldırmadan dua edildiği sabit olanlar hariç", "paras": [{"reader": false, "ar": [[1259.0, "ومن الكلّيّات أيضًا: كلُّ الأدعية يُشرَع فيها رفعُ اليدين،"], [1267.0, "إلا فيما ثبت الدعاءُ فيه بلا رفع. كلُّ الأدعية يُشرَع فيها رفعُ اليدين،"], [1277.0, "إلا فيما ثبت الدعاءُ فيه بلا رفع."], [1283.0, "كلُّ الأدعية يُشرَع فيها رفعُ اليدين،"], [1287.0, "إلا فيما ثبت الدعاءُ فيه بلا رفع."]], "tr": [[1259.0, "Külliyelerden biri de şudur: 4."], [1266.3, "külliye: Bütün dualarda elleri kaldırmak meşrudur;"], [1273.3, "elleri kaldırmadan dua edildiği sabit olan yerler hariç. (İki kez daha tekrar ediyor.)"]]}, {"reader": false, "ar": [[1290.0, "أقول وبالله التوفيق: وقد جعل أهل العلم من جملة الآداب في الدعاء أن يرفع الداعي يديه؛"], [1300.0, "لِما رواه الإمام مسلمٌ في «صحيحه» من حديث أبي هريرة رضي الله عنه،"], [1307.0, "قال: قال النبيّ صلى الله عليه وسلم ـ بعد أن ذكر الرجل ـ قال:"], [1311.6, "«يُطيل السفر، أشعثَ أغبر، يمدّ يديه إلى السماء: يا ربّ، يا ربّ»."], [1319.0, "وهذا دليلٌ على أنّ هذا الرجل جاء بكلّ آداب الدعاء،"], [1323.0, "ولكن رُدّ دعاؤه لأنه يأكل الحرام."]], "tr": [[1290.0, "Tevfik Allah'tandır, derim ki: İlim ehli, duacının ellerini kaldırmasını duanın âdâbından saymıştır."], [1298.2, "Çünkü İmam Müslim \"Sahîh\"inde Ebû Hüreyre —Allah ondan razı olsun— hadisinden şunu rivayet etmiştir:"], [1305.9, "Peygamber sallallâhu aleyhi ve sellem —adamı zikrettikten sonra— şöyle buyurdu:"], [1309.9, "\"Yolculuğu uzatır, saçı başı dağınık, toz toprak içinde, ellerini semaya uzatır:"], [1316.5, "Ya Rabbi, ya Rabbi!\" Bu, bu adamın duanın bütün âdâbını yerine getirdiğine delildir;"], [1322.6, "fakat haram yediği için duası reddedilmiştir."]]}, {"reader": false, "ar": [[1327.0, "فبما أنّ من آداب الدعاء أن يرفع الداعي يديه،"], [1332.0, "وأنه أحرى لاستجابة الله له،"], [1334.0, "قال العلماء بأنّ الأصل في كلّ دعاءٍ أن يرفع الإنسان يديه."], [1339.0, "ويؤكّد ذلك ما رواه الإمام الترمذيّ في «جامعه» وأبو داود في «سننه» من حديثِ ـ من قول النبيّ صلى الله عليه وسلم ـ:"], [1349.0, "«إنّ الله حييٌّ كريم، يستحيي إذا رفع الرجلُ إليه يديه أن يردّهما صِفرًا خائبتين»."], [1358.0, "وهذا دليلٌ على أنّ من السنّة أن يرفع الإنسان يديه عند كلّ دعاء."]], "tr": [[1327.0, "Duacının ellerini kaldırması duanın âdâbından olduğuna ve Allah'ın ona icabet etmesine daha elverişli olduğuna göre, âlimler her duada asıl olanın insanın ellerini kaldırması olduğunu söylemişlerdir."], [1339.0, "Bunu, İmam Tirmizî'nin \"Câmi\"inde ve Ebû Dâvûd'un \"Sünen\"inde rivayet ettikleri, Peygamber sallallâhu aleyhi ve sellem'in şu sözü de pekiştirir:"], [1347.9, "\"Şüphesiz Allah hayâ sahibidir, kerîmdir;"], [1350.9, "adam ellerini O'na kaldırdığında onları boş ve eli boş olarak geri çevirmekten hayâ eder.\" Bu, her duada insanın ellerini kaldırmasının sünnetten olduğuna delildir."]]}, {"reader": false, "ar": [[1365.0, "ورفعُ النبيّ صلى الله عليه وسلم يديه قد ثبت في الصحيح وفي غيره في أدعيةٍ كثيرة،"], [1373.0, "ممّا يجعلنا نستنبط من هذا الرفع المتكرّر أنه هو الأصل."], [1380.0, "ولكنّ الكلّيّة تتكلّم عن ثلاث جزئيّات:"], [1385.0, "الجزئيّة الأولى: مواضعُ من الدعاء ثبت عن النبيّ صلى الله عليه وسلم أنه رفع يديه فيها،"], [1393.0, "فلا جرمَ أنّ السنّة الصريحة في هذا الموضع رفعُ اليدين،"], [1398.0, "كما ثبت عنه في دعاء الاستسقاء أنه كان يرفع يديه."]], "tr": [[1365.0, "Peygamber sallallâhu aleyhi ve sellem'in ellerini kaldırması, Sahîh'te ve başka kaynaklarda pek çok duada sabit olmuştur."], [1373.0, "Bu da bize, bu tekrar eden el kaldırmadan, asıl olanın bu olduğunu istinbat ettirir."], [1383.8, "Fakat külliye üç cüz'î meseleden bahseder:"], [1387.5, "Birinci cüz'î mesele: Peygamber sallallâhu aleyhi ve sellem'in ellerini kaldırdığı sabit olan dua yerleri."], [1395.0, "Şüphesiz bu yerde açık sünnet elleri kaldırmaktır;"], [1398.5, "nitekim yağmur duasında ellerini kaldırdığı ondan sabit olmuştur."]]}, {"reader": false, "ar": [[1403.0, "لِما في «الصحيحين» من حديث أنسٍ رضي الله عنه في الحديث الطويل،"], [1407.4, "قال: «فرفع النبيّ صلى الله عليه وسلم يديه وقال: اللهمّ أغِثنا، اللهمّ أغِثنا»."], [1414.0, "وفي «الصحيحين» من حديث عبد الله بن زيدٍ في صلاة الاستسقاء،"], [1419.0, "قال: «ثم استقبل القبلة، وحوّل رداءه، ورفع يديه يدعو»."], [1425.0, "فهذا الموضع لا إشكال فيه."]], "tr": [[1403.0, "Çünkü \"Sahîhayn\"da Enes —Allah ondan razı olsun— hadisinde, uzun hadiste (Enes) şöyle der:"], [1406.9, "\"Peygamber sallallâhu aleyhi ve sellem ellerini kaldırdı ve 'Allah'ım, bize yağmur ver!"], [1411.6, "Allah'ım, bize yağmur ver!' dedi.\" \"Sahîhayn\"da Abdullah b."], [1415.1, "Zeyd'in yağmur namazı hakkındaki hadisinde de şöyle der:"], [1418.3, "\"Sonra kıbleye yöneldi, ridâsını ters çevirdi ve ellerini kaldırıp dua etti.\" Bu yerde bir problem yoktur."]]}, {"reader": false, "ar": [[1430.0, "الموضع الثاني: مواضعُ ثبت عن النبيّ صلى الله عليه وسلم الدعاءُ فيها،"], [1438.0, "وثبت عنه أنه لم يرفع يديه فيها؛"], [1443.0, "فلا جرمَ أنّ السنّة في هذا الموضع ألّا يرفع الإنسان يديه،"], [1447.0, "كأدعية الصلاة كلِّها في أثنائها:"], [1450.0, "كدعاء الاستفتاح، فإنه لم يثبت عن النبيّ صلى الله عليه وسلم رفعُ يديه فيه؛"], [1457.0, "والدعاء في الركوع: «سبحانك اللهمّ وبحمدك، اللهمّ اغفر لي»؛"], [1463.0, "وكالدعاء في السجود، والدعاء بين السجدتين،"], [1466.0, "والدعاء الذي يُشرَع للإنسان بعد الفراغ من التشهّد وقبل السلام."], [1471.0, "فكلّ هذه المواضع مواضعُ دعاءٍ ثبتت عن النبيّ صلى الله عليه وسلم،"], [1476.0, "ولم يثبت عنه أنه رفع يديه فيها."]], "tr": [[1430.0, "İkinci yer: Peygamber sallallâhu aleyhi ve sellem'den dua ettiği ve ellerini kaldırmadığı sabit olan yerler."], [1440.1, "Şüphesiz bu yerde sünnet, insanın ellerini kaldırmamasıdır;"], [1444.1, "namaz içindeki bütün dualar gibi:"], [1445.9, "İftitah duası gibi —Peygamber sallallâhu aleyhi ve sellem'den onda ellerini kaldırdığı sabit olmamıştır—;"], [1453.0, "rükûdaki \"Sübhânekellâhümme ve bi-hamdik, Allâhümmağfirlî (Allah'ım, seni hamdinle tesbih ederim; Allah'ım, beni bağışla)\" duası;"], [1461.0, "secdedeki dua, iki secde arasındaki dua ve teşehhüdü bitirdikten sonra selamdan önce insana meşru kılınan dua gibi."], [1470.5, "Bütün bu yerler Peygamber sallallâhu aleyhi ve sellem'den sabit olan dua yerleridir ve onlarda ellerini kaldırdığı ondan sabit olmamıştır."]]}, {"reader": false, "ar": [[1479.0, "بل ذكر العلماء في ذلك كلّيّةً جميلة ـ أو قاعدةً جميلة ـ وهي:"], [1484.4, "أنّ كلّ دعاءٍ يكون ضمن عبادةٍ فليس من المشروع رفعُ اليدين فيه؛"], [1489.0, "ولكنّها أغلبيّة وليست كلّيّة."], [1494.0, "وبما أنّ دعاء الصلاة دعاءٌ في ضمن تعبُّد فلا يُشرَع رفعُ يديه فيه."], [1500.0, "وكذلك الدعاء في الطواف،"], [1502.2, "فإنه دعاءٌ ضمن تعبُّد،"], [1504.3, "فلا يُشرَع رفعُ اليدين فيه."]], "tr": [[1479.0, "Hatta âlimler bu konuda güzel bir külliye —ya da güzel bir kaide— zikretmişlerdir:"], [1484.4, "Bir ibadetin içinde olan her duada elleri kaldırmak meşru değildir."], [1487.8, "Fakat bu (kaide) ağlebîdir (çoğunlukla geçerlidir), küllî değildir."], [1494.0, "Namazdaki dua bir ibadetin içindeki dua olduğuna göre, onda elleri kaldırmak meşru değildir."], [1499.5, "Tavaftaki dua da böyledir; o da bir ibadetin içindeki duadır, dolayısıyla onda elleri kaldırmak meşru değildir."]]}]}, {"ts": "25:07", "title": "4. Külliye (devam): Minberdeki dua ve teşvik edilen dua yerleri", "paras": [{"reader": false, "ar": [[1507.0, "وكذلك الدعاء في السعي في غير الصفا والمروة ـ في غير الصعود على الصفا والمروة ـ فإنّ النبيّ صلى الله عليه وسلم ثبت عنه أنه كان يدعو في سعيه،"], [1520.0, "فبما أنه دعاءٌ في تعبُّد فلا يُشرَع رفعُ اليدين فيه."], [1529.0, "ولكن ـ كما ذكرتُ لكم ـ يُشكِل عليها أحاديثُ أو مواضعُ كثيرة،"], [1534.0, "فهي من جملة القواعد الأغلبيّة للكلّيّة."]], "tr": [[1507.0, "Sa'yde, Safâ ve Merve dışındaki —Safâ ve Merve'ye çıkma dışındaki— dua da böyledir."], [1514.3, "Peygamber sallallâhu aleyhi ve sellem'den sa'yinde dua ettiği sabit olmuştur;"], [1518.5, "ibadet içinde bir dua olduğuna göre onda elleri kaldırmak meşru değildir."], [1524.9, "Fakat size zikrettiğim gibi, ona (bu kaideye) pek çok hadis veya yer itiraz teşkil eder; dolayısıyla o, ağlebî kaidelerdendir."]]}, {"reader": false, "ar": [[1538.0, "وكذلك الدعاء على المنبر؛"], [1544.0, "فإنّ النبيّ صلى الله عليه وسلم ثبت عنه أنه كان يدعو للمسلمين والمسلمات على المنبر،"], [1550.0, "ولكن لم يثبت عنه أنه كان يرفع يديه،"], [1553.7, "وإنما كان يقول بإصبعه هكذا؛"], [1556.0, "لِما في «صحيح الإمام مسلم» من حديث عُمارة بن رُؤَيبة رضي الله عنه:"], [1562.0, "أنه دخل المسجد وبِشرُ بن مروان رافعٌ يديه على المنبر،"], [1569.0, "فقال: «قبّح الله هاتين اليدين! لقد رأيتُ رسول الله صلى الله عليه وسلم على المنبر ولا يزيد على أن يقول بيده هكذا، وأشار بإصبعه المسبِّحة»."], [1582.0, "إلا إذا دعا على المنبر في الاستسقاء،"], [1586.1, "فإنّ المشروع له رفعُ اليدين."]], "tr": [[1538.0, "Minberdeki dua da böyledir. Peygamber sallallâhu aleyhi ve sellem'den minberde Müslüman erkekler ve Müslüman kadınlar için dua ettiği sabit olmuştur;"], [1550.0, "fakat ellerini kaldırdığı sabit olmamıştır;"], [1552.3, "sadece parmağıyla böyle işaret ederdi."], [1554.6, "Çünkü İmam Müslim'in \"Sahîh\"inde Umâre b."], [1557.4, "Ruveybe —Allah ondan razı olsun— hadisinde (şöyle geçer):"], [1561.1, "Mescide girdi; Bişr b. Mervân minberde ellerini kaldırmış (dua ediyordu)."], [1567.6, "Bunun üzerine şöyle dedi: \"Allah bu iki eli çirkin etsin!"], [1573.5, "Andolsun, Resûlullah sallallâhu aleyhi ve sellem'i minberde gördüm;"], [1577.5, "eliyle şöyle yapmaktan fazlasını yapmazdı\" ve şehâdet parmağıyla işaret etti."], [1582.6, "Ancak minberde yağmur duası ederse, onun için meşru olan elleri kaldırmaktır."]]}, {"reader": false, "ar": [[1589.0, "بقينا في الموضع الثالث:"], [1591.2, "وهي مواضعُ حثّ الشارع فيها على الدعاء،"], [1595.0, "ولكن لم يثبت عنه أنه رفع أو لم يرفع؛"], [1599.0, "فهل نرفع أيدينا في مثل هذه المواضع؟"], [1604.0, "الجواب: نعم؛ لأنّ الأصل في كلّ دعاءٍ مشروعيّةُ رفع اليدين،"], [1609.0, "إلا في المواضع التي ثبت دعاءُ النبيّ صلى الله عليه وسلم فيها بلا رفع."]], "tr": [[1589.0, "Üçüncü yer kaldı: Şâri'in dua etmeye teşvik ettiği, fakat ondan ellerini kaldırdığı veya kaldırmadığı sabit olmayan yerler."], [1598.1, "Bu gibi yerlerde ellerimizi kaldırır mıyız?"], [1601.9, "Cevap: Evet. Çünkü her duada asıl olan elleri kaldırmanın meşru olmasıdır;"], [1608.5, "Peygamber sallallâhu aleyhi ve sellem'in elleri kaldırmadan dua ettiği sabit olan yerler hariç."]]}, {"reader": false, "ar": [[1615.0, "فيدخل في ذلك الدعاء بين الأذان والإقامة،"], [1619.0, "لحديث أنس بن مالكٍ رضي الله عنه،"], [1623.0, "قال: قال النبيّ صلى الله عليه وسلم:"], [1625.7, "«لا يُرَدّ الدعاء بين الأذان والإقامة»؛"], [1628.0, "والسنّة في مثل هذا الدعاء أن يرفع الداعي يديه،"], [1632.2, "جريًا على الأصل المتقرّر."], [1634.0, "ومنها أيضًا الدعاء في ساعة الجمعة،"], [1637.0, "لِما في «الصحيح» من حديث أبي هريرة:"], [1639.9, "«إنّ في الجمعة لساعةً لا يوافقها عبدٌ مسلمٌ قائمٌ يصلّي يسأل الله عز وجل شيئًا من خير الدنيا والآخرة إلا أعطاه إيّاه»؛"], [1650.0, "فالسنّة في هذا الدعاء أن يرفع الإنسان يديه."]], "tr": [[1615.0, "Buna ezan ile kamet arasındaki dua girer;"], [1618.4, "Enes b. Mâlik —Allah ondan razı olsun— hadisinden dolayı:"], [1623.0, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1625.7, "\"Ezan ile kamet arasındaki dua reddedilmez.\" Bu gibi bir duada sünnet, yerleşik asla uygun olarak duacının ellerini kaldırmasıdır."], [1632.6, "Bunlardan biri de cuma saatindeki duadır;"], [1635.5, "Sahîh'te Ebû Hüreyre hadisinde geçtiği için:"], [1637.8, "\"Cumada öyle bir saat vardır ki ayakta namaz kılan Müslüman bir kul ona denk gelip Allah Azze ve Celle'den dünya ve âhiret hayrından bir şey isterse, Allah onu mutlaka ona verir.\" Bu duada sünnet, insanın ellerini kaldırmasıdır."]]}, {"reader": false, "ar": [[1653.0, "والدعاء عند سماع الأذان أيضًا،"], [1658.0, "فإنه من الدعاء الذي لا يُرَدّ."], [1660.0, "وكذلك عند التحام الصفوف في المعركة،"], [1664.0, "فإنه من الدعاء الذي لا يُرَدّ؛"], [1666.4, "لِما أخرجه أبو داود في «سننه» بإسنادٍ صحيحٍ لغيره،"], [1670.0, "من حديث سهل بن سعدٍ الساعديّ رضي الله عنه،"], [1675.0, "قال: قال النبيّ صلى الله عليه وسلم:"], [1679.6, "«ثنتان لا تُرَدّان: الدعاء عند النداء، وعند البأس حين يُلحِم بعضُهم بعضًا»،"], [1688.0, "وفي روايةٍ: «وتحت المطر»."]], "tr": [[1653.0, "Ezanı işitirken yapılan dua da (böyledir);"], [1658.0, "çünkü o reddedilmeyen dualardandır. Savaşta safların birbirine girdiği andaki dua da böyledir;"], [1663.3, "çünkü o da reddedilmeyen dualardandır."], [1665.2, "Ebû Dâvûd'un \"Sünen\"inde sahih li-ğayrihî bir isnadla Sehl b."], [1668.4, "Sa'd es-Sâidî —Allah ondan razı olsun— hadisinden rivayet ettiği üzere:"], [1672.8, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1676.3, "\"İki şey reddedilmez: Ezan okunurken yapılan dua ve savaş anında, birbirlerine girdikleri zaman (yapılan dua).\" Bir rivayette de:"], [1686.7, "\"Ve yağmur altında (yapılan dua).\""]]}, {"reader": false, "ar": [[1690.0, "وكذلك الدعاء عند نزول الغيث،"], [1692.6, "كما في قول النبيّ صلى الله عليه وسلم:"], [1696.8, "«ثنتان لا تُرَدّان»، وذكر منها:"], [1699.4, "«والدعاء عند المطر». وكذلك الدعاء عند شرب زمزم،"], [1703.2, "لقول النبيّ صلى الله عليه وسلم:"], [1705.8, "«ماءُ زمزمَ لِما شُرِب له»."], [1708.0, "وكذلك الدعاء المشروع عند حضور الميّت أو المريض،"], [1712.0, "لِما في «صحيح مسلم» من حديث أمّ سلمة رضي الله عنها،"], [1716.6, "قالت: قال النبيّ صلى الله عليه وسلم:"], [1719.2, "«إذا حضرتم المريض أو الميّت فقولوا خيرًا، فإنّ الملائكة يؤمّنون على ما تقولون»."]], "tr": [[1690.0, "Yağmur yağarken yapılan dua da böyledir;"], [1692.6, "Peygamber sallallâhu aleyhi ve sellem'in \"İki şey reddedilmez\" sözünde olduğu gibi;"], [1697.3, "bunlardan birini \"yağmur anındaki dua\" diye zikretmiştir."], [1700.5, "Zemzem içerken yapılan dua da böyledir;"], [1702.8, "Peygamber sallallâhu aleyhi ve sellem'in \"Zemzem suyu ne için içilirse onun içindir\" sözünden dolayı."], [1708.5, "Ölünün veya hastanın yanında bulunurken meşru olan dua da böyledir;"], [1712.4, "\"Sahîh-i Müslim\"de Ümmü Seleme —Allah ondan razı olsun— hadisinde geçtiği üzere;"], [1716.6, "(Ümmü Seleme) dedi ki: Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1719.9, "\"Hastanın veya ölünün yanında bulunduğunuzda hayır söyleyin;"], [1722.2, "çünkü melekler söylediklerinize âmin derler.\""]]}, {"reader": false, "ar": [[1724.0, "وكذلك الدعاء عند وجود المصائب،"], [1729.0, "لحديث أمّ سلمة أنّ النبيّ صلى الله عليه وسلم قال:"], [1734.0, "«ما من مسلمٍ تُصيبه مصيبةٌ فيقول ما أمره الله عز وجل به: إنّا لله وإنّا إليه راجعون، اللهمّ أْجُرني في مصيبتي، وأخلِف لي خيرًا منها، إلا أخلف الله له خيرًا منها»."]], "tr": [[1724.0, "Musibetler başa geldiğinde yapılan dua da böyledir;"], [1729.0, "Ümmü Seleme'nin hadisinden dolayı: Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1733.0, "\"Kendisine bir musibet isabet edip de Allah Azze ve Celle'nin ona emrettiği şeyi —'Biz Allah'a aidiz ve O'na döneceğiz."], [1738.0, "Allah'ım, musibetimde bana ecir ver ve bana ondan daha hayırlısını ihsan et'— söyleyen hiçbir Müslüman yoktur ki Allah ona ondan daha hayırlısını ihsan etmesin.\""]]}, {"reader": false, "ar": [[1746.0, "فبالتفصيل في هذه المواضع يزول كثيرٌ من الإشكال في مسألة رفع اليدين في الدعاء:"], [1752.0, "فإن كان من المواضع التي ثبت أنه دعا فيها ولم يرفع فلا يُشرَع الرفعُ فيها،"], [1757.0, "وإن كان من المواضع التي ثبت عنه أنه دعا ورفع فالمشروعُ رفعُ اليدين فيها،"], [1764.0, "وإن كان من المواضع التي رغّب فيها في الدعاء ـ أو رغّب فيها بالدعاء ـ ولم يثبت عنه لا هذا ولا هذا،"], [1772.2, "فإننا نردّ الأمر إلى الأصل المتقرّر،"], [1774.8, "وهو ما تقتضيه هذه الكلّيّة. والله أعلم."]], "tr": [[1746.0, "Bu yerlerde (yapılan) bu tafsil ile, duada elleri kaldırma meselesindeki problemin çoğu ortadan kalkar:"], [1752.4, "Eğer (Peygamber'in) dua edip ellerini kaldırmadığı sabit olan yerlerdense orada elleri kaldırmak meşru değildir."], [1757.8, "Dua edip ellerini kaldırdığı ondan sabit olan yerlerdense orada meşru olan elleri kaldırmaktır."], [1764.8, "Duaya teşvik ettiği yerlerden olup da ondan ne bu ne de o sabit olmamışsa, meseleyi yerleşik asla, yani bu külliyenin gerektirdiği şeye döndürürüz. Allah en iyisini bilir."]]}]}, {"ts": "29:38", "title": "5. Külliye: Belli bir zamana has bir duanın faziletine inanan herkes duada haddi aşmıştır", "paras": [{"reader": false, "ar": [[1778.0, "ومن الكلّيّات أيضًا: <b>كلُّ من اعتقد فضيلةَ دعاءٍ في زمانٍ بخصوصه فمعتدٍ في الدعاء.<\/b> كلُّ من اعتقد فضيلةَ دعاءٍ في زمانٍ بخصوصه فمعتدٍ في الدعاء."]], "tr": [[1778.0, "Külliyelerden biri de şudur: 5."], [1781.0, "külliye: Belli bir zamana has bir duanın faziletine inanan herkes duada haddi aşmıştır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1791.0, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أنّ الاعتداء في الدعاء ليس في الألفاظ فقط،"], [1798.0, "بل قد يكون في الهيئة أيضًا."], [1803.0, "وهذه الكلّيّة تتكلّم عن نوعٍ من أنواع الاعتداء في هيئات الدعاء،"], [1809.8, "وهي زمانيّته. فإذا اعتقد الإنسان فضيلةَ دعاءٍ بخصوصه في زمانيّةٍ بخصوصها،"], [1817.0, "فمجرّدُ هذا الاعتقاد البدعيّ الذي لا دليل عليه هو نوعٌ من أنواع الاعتداء."]], "tr": [[1791.0, "Tevfik Allah'tandır, derim ki: Bil —Allah Teâlâ sana rahmet etsin— duada haddi aşma yalnız lafızlarda değildir;"], [1798.8, "bilakis hey'ette (biçimde) de olabilir."], [1803.0, "Bu külliye, duanın hey'etlerindeki haddi aşma çeşitlerinden birinden, yani onun zamanından bahseder."], [1811.0, "İnsan belli bir duanın belli bir zamanda faziletli olduğuna inanırsa, delili olmayan bu bid'atçi inancın kendisi bile haddi aşma çeşitlerinden biridir."]]}, {"reader": false, "ar": [[1824.0, "كاعتقاد فضيلة دعاءٍ مخصوصٍ في كلّ يومٍ من أيام الأسبوع،"], [1829.0, "وكلُّ حديثٍ يُروى في ذلك فإنه كذب ـ يرحمك الله ـ."], [1835.0, "وكتخصيص أدعيةٍ لكلّ يومٍ من أيام رمضان،"], [1839.0, "كما يفعله بعض أهل البدع،"], [1841.2, "ويَروُون <span class=\"q\">؟ 30:41<\/span> في ذلك حديثًا موضوعًا،"], [1845.0, "وكلُّ حديثٍ في ذلك فمكذوبٌ موضوع."], [1850.0, "وكتخصيص أدعيةٍ تُقال في ابتداء العام أو خاتمته،"], [1856.0, "فإنّ ذلك من الاعتداء في الدعاء،"], [1859.0, "لعدم ثبوت شيءٍ من ذلك عنه صلى الله عليه وسلم."]], "tr": [[1824.0, "Haftanın her günü için belli bir duanın faziletine inanmak gibi;"], [1828.5, "bu konuda rivayet edilen her hadis yalandır."], [1831.9, "—Yerhamükellah (Allah sana rahmet etsin).— Bazı bid'at ehlinin yaptığı gibi Ramazan'ın her günü için dualar tahsis etmek gibi;"], [1841.2, "bu konuda uydurma bir hadis rivayet ederler <span class=\"q\">؟<\/span>;"], [1846.5, "bu konudaki her hadis yalan ve uydurmadır."], [1852.2, "Yılın başında veya sonunda söylenen dualar tahsis etmek gibi;"], [1857.5, "bu, duada haddi aşmadandır; çünkü bundan hiçbir şey sallallâhu aleyhi ve sellem'den sabit olmamıştır."]]}, {"reader": false, "ar": [[1864.0, "وكتخصيص أدعيةٍ تُقال في ليلة الجمعة،"], [1868.0, "فإننا لا نعلم دليلًا صحيحًا يدلّ على شيءٍ من ذلك،"], [1872.0, "فهو من جملة الاعتداء."], [1873.0, "وكتخصيص ليلة النصف من شعبان بدعاءٍ مخصوص،"], [1878.3, "كما يفعله أهل البدع،"], [1881.0, "فيتعبّدون لله عز وجل بأدعيةٍ مخصوصةٍ في هذه الليلة بخصوصها."], [1887.0, "وهذا كلّه من المحدثات التي تدخل دخولًا صريحًا في قوله صلى الله عليه وسلم:"], [1893.0, "«من أحدث في أمرنا هذا ما ليس منه فهو ردّ»."]], "tr": [[1864.0, "Cuma gecesi söylenen dualar tahsis etmek gibi;"], [1868.0, "bundan herhangi bir şeye delâlet eden sahih bir delil bilmiyoruz;"], [1871.6, "dolayısıyla bu da haddi aşmadandır."], [1872.8, "Bid'at ehlinin yaptığı gibi Şaban'ın on beşinci gecesini belli bir duayla tahsis etmek gibi;"], [1881.6, "bu geceye has belli dualarla Allah Azze ve Celle'ye ibadet ederler."], [1887.4, "Bütün bunlar, sallallâhu aleyhi ve sellem'in \"Kim bu işimizde (dinimizde) ondan olmayan bir şey ihdas ederse o reddedilmiştir\" sözüne açıkça giren muhdesâttandır (sonradan çıkarılmış şeylerdendir)."]]}, {"reader": false, "ar": [[1897.0, "ولذلك قال ابن تيميّة رحمه الله ـ في نقلٍ مطوّل ـ:"], [1902.0, "«لا ريب أنّ الأذكار والدعوات من أفضل العبادات، والعبادات مبناها على التوقيف والاتّباع، لا على الهوى والابتداع. فالأدعية والأذكار النبويّة هي أفضل ما يتحرّاه المتحرّي من الذكر والدعاء، وسالكُها على سبيل أمانٍ وسلامة، والفوائد والنتائج التي تحصل لا يعبّر عنها لسان، ولا يحيط بها إنسان»."]], "tr": [[1897.0, "Bu yüzden İbn Teymiyye —Allah ona rahmet etsin— uzun bir nakilde şöyle demiştir:"], [1902.5, "\"Şüphesiz zikirler ve dualar ibadetlerin en faziletlilerindendir."], [1905.5, "İbadetlerin binası ise heva ve bid'at üzerine değil, tevkîf (nassa bağlılık) ve ittiba üzerinedir."], [1912.5, "Nebevî dualar ve zikirler, zikir ve dua arayan kimsenin arayabileceği şeylerin en faziletlisidir."], [1918.0, "Onları izleyen, emniyet ve selâmet yolu üzeredir."], [1921.7, "(Onlardan) elde edilen faydaları ve neticeleri hiçbir dil ifade edemez, hiçbir insan kuşatamaz.\""]]}, {"reader": false, "ar": [[1929.0, "إلى أن قال: «وليس لأحدٍ أن يسنّ للناس نوعًا من الأذكار والأدعية غير المسنون، ويجعلها عبادةً راتبةً يواظب الناس عليها كما يواظبون على الصلوات الخمس، بل هذا ابتداعُ دينٍ لم يأذن الله به؛ بخلاف ما يدعو به المرء أحيانًا من غير أن يجعله للناس سنّة، فهذا إذا لم يُعلَم أنه يتضمّن معنًى محرّمًا لم يَجُز الجزمُ بتحريمه»."], [1961.7, "انتهى كلامه. يعني: أنه يُغتفَر أحيانًا ما لا يُغتفَر دوامًا."]], "tr": [[1929.0, "(İbn Teymiyye) şunu söyleyene kadar (devam etti):"], [1932.4, "\"Hiç kimsenin, insanlar için sünnet olmayan bir tür zikir ve dua ihdas edip onu, insanların beş vakit namaza devam ettikleri gibi devam ettikleri düzenli (râtib) bir ibadet hâline getirmesi caiz değildir."], [1949.5, "Bilakis bu, Allah'ın izin vermediği bir din icat etmektir."], [1952.7, "Kişinin, insanlara sünnet hâline getirmeksizin ara sıra ettiği dua ise bundan farklıdır;"], [1956.4, "bunun haram bir mana içerdiği bilinmiyorsa haramlığına kesin hükmetmek caiz olmaz.\" Sözü burada sona erdi."], [1962.3, "Yani ara sıra (yapılana) müsamaha edilen şeye, devamlı (yapılınca) müsamaha edilmez."]]}, {"reader": false, "ar": [[1968.0, "ثم قال رحمه الله تعالى:"], [1971.0, "«وأمّا اتّخاذ وِردٍ غير شرعيّ، واستنانُ ذكرٍ غير شرعيّ، فهذا ممّا يُنهى عنه. ومع هذا ففي الأدعية الشرعيّة والأذكار الشرعيّة غايةُ المطالب الصحيحة، ونهايةُ المقاصد العليّة، ولا يَعدِل عنها إلى غيرها من الأذكار المحدثة المبتدعة إلا جاهلٌ أو مفرِّطٌ أو معتدٍ» ـ أو قال: «أو متعدٍّ»."]], "tr": [[1968.0, "Sonra —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1971.6, "\"Şer'î olmayan bir vird edinmek ve şer'î olmayan bir zikri sünnet hâline getirmek ise yasaklanan şeylerdendir."], [1979.5, "Bununla birlikte şer'î dualarda ve şer'î zikirlerde sahih taleplerin son noktası ve yüce maksatların nihayeti vardır."], [1986.0, "Onlardan, sonradan çıkarılmış bid'at zikirlere ancak bir cahil, bir ihmalkâr veya haddi aşan biri yüz çevirir\" —ya da \"veya taşkınlık eden biri\" dedi."]]}, {"reader": false, "ar": [[1995.0, "قال الإمام أبو شامة رحمه الله تعالى:"], [1999.0, "«ولا ينبغي تخصيصُ العبادات بأوقاتٍ لم يخصّصها بها الشرع، بل تكون جميعُ أفعال البرّ مُرسَلةً في جميع الأزمان، ليس لبعضها على بعضٍ فضلٌ إلا ما فضّله الشارع وخصّه بنوعٍ من العبادة». انتهى كلامه."]], "tr": [[1995.0, "İmam Ebû Şâme —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1999.5, "\"İbadetleri, şeriatin onları tahsis etmediği vakitlerle tahsis etmek uygun değildir."], [2004.4, "Bilakis bütün iyilik fiilleri bütün zamanlarda serbesttir;"], [2007.6, "Şâri'in faziletli kıldığı ve bir tür ibadetle tahsis ettiği dışında bazısının bazısına üstünlüğü yoktur.\" Sözü burada sona erdi."]]}, {"reader": false, "ar": [[2014.0, "قال الإمام الشاطبيّ رحمه الله تعالى في «الاعتصام» أثناء تعريفه للبدعة،"], [2020.0, "قال: «ومنها التزامُ الكيفيّات والهيئات المعيّنة، كالذكر بهيئة الاجتماع على صوتٍ واحد، واتّخاذ يوم ولادة النبيّ صلى الله عليه وسلم عيدًا، وما أشبه ذلك. ومنها التزامُ العبادات المعيّنة في أوقاتٍ معيّنةٍ لم يوجد لها ذلك التعيين في الشريعة». انتهى كلامه."]], "tr": [[2014.0, "İmam Şâtıbî —Allah Teâlâ ona rahmet etsin— \"el-İ'tisâm\"da bid'atı tarif ederken şöyle demiştir:"], [2020.0, "\"Bunlardan biri belirli keyfiyetlere ve hey'etlere bağlı kalmaktır;"], [2026.0, "tek ses hâlinde toplu zikir yapmak, Peygamber sallallâhu aleyhi ve sellem'in doğum gününü bayram edinmek ve buna benzer şeyler gibi."], [2033.0, "Bunlardan biri de şeriatte öyle bir tayini bulunmayan belirli vakitlerde belirli ibadetlere bağlı kalmaktır.\" Sözü burada sona erdi."]]}]}, {"ts": "34:03", "title": "6. Külliye: Belli bir mekâna has bir duanın faziletine inanan herkes duada haddi aşmıştır", "paras": [{"reader": false, "ar": [[2043.0, "ومن الكلّيّات أيضًا: <b>كلُّ من اعتقد فضيلةَ دعاءٍ في مكانٍ بخصوصه فمعتدٍ في الدعاء.<\/b> كلُّ من اعتقد فضيلةَ دعاءٍ في مكانٍ بخصوصه فمعتدٍ في الدعاء."]], "tr": [[2043.0, "Külliyelerden biri de şudur: 6."], [2047.1, "külliye: Belli bir mekâna has bir duanın faziletine inanan herkes duada haddi aşmıştır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2059.0, "وهذا من جملة الاعتداء في الهيئات؛"], [2072.0, "فالزمانيّة هيئة، والمكانيّة هيئة."], [2078.0, "فبما أنّ الاعتداء في هيئة الزمان محرّم،"], [2081.0, "فكذلك الاعتداء في هيئة الدعاء مكانًا محرّم."], [2085.0, "فلا يجوز للإنسان أن يعتقد فضيلةَ دعاءٍ بخصوصه في مكانٍ بخصوصه إلا وعلى ذلك الاعتقاد دليلٌ صحيحٌ صريح."], [2094.0, "وذلك كاعتقاد فضيلة الدعاء لنفسه عند قبور الأنبياء أو الأولياء والصالحين،"], [2100.0, "فإنّ هذا من البدع التي لا نعلم دليلًا من الوحي يؤيّدها،"], [2105.5, "ولا برهانًا يقف وراءها ويُسندها."]], "tr": [[2059.0, "Bu da hey'etlerdeki haddi aşmadandır;"], [2062.1, "zaman bir hey'ettir, mekân da bir hey'ettir."], [2078.0, "Zaman hey'etinde haddi aşmak haram olduğuna göre, duanın mekân hey'etinde haddi aşmak da haramdır."], [2084.4, "İnsanın, belli bir duanın belli bir mekânda faziletli olduğuna, o inanca dair sahih ve sarih bir delil olmadıkça inanması caiz değildir."], [2093.6, "Bu, kişinin peygamberlerin veya velilerin ve sâlihlerin kabirleri yanında kendisi için dua etmenin faziletine inanması gibidir."], [2101.0, "Bu, vahiyden onu destekleyen bir delil, arkasında durup ona dayanak olan bir burhan bilmediğimiz bid'atlerdendir."]]}]}, {"ts": "35:08", "title": "6. Külliye (devam): Kabirler, Cemre, Makâm-ı İbrâhîm ve Arafat dağı", "paras": [{"reader": false, "ar": [[2108.0, "قال أبو العبّاس ابن تيميّة:"], [2110.8, "«أن يتحرّى الدعاءَ عندها، بحيث يستشعر أنّ الدعاء هناك أجوبُ منه في غيره، فهذا النوع منهيٌّ عنه»."], [2119.0, "وقال في موضعٍ آخر:"], [2121.0, "«وما أحفظ لا عن صحابيٍّ ولا عن تابعيٍّ ولا إمامٍ معروف أنه استحبّ قصدَ شيءٍ من القبور للدعاء عنده، ولا روى أحدٌ في ذلك شيئًا، ولا رُوي في ذلك شيءٌ لا عن النبيّ صلى الله عليه وسلم، ولا عن أصحابه، ولا عن أحدٍ من الأئمّة المعروفين. وقد صنّف الناس في الدعاء وأوقاته وأمكنته، وذكروا فيه الآثار، فما ذكر أحدٌ منهم في فضل الدعاء عند شيءٍ من القبور حرفًا واحدًا فيما أعلم»."], [2152.0, "انتهى كلامه رحمه الله."]], "tr": [[2108.0, "Ebü'l-Abbâs İbn Teymiyye şöyle demiştir:"], [2110.2, "\"(Kişinin) orada duanın başka yerden daha çok icabet edileceğini hissedecek şekilde onların yanında dua etmeyi kollaması;"], [2117.0, "bu tür yasaklanmıştır.\" Başka bir yerde de şöyle demiştir:"], [2121.0, "\"Ne bir sahabiden, ne bir tâbiînden, ne de tanınmış bir imamdan, yanında dua etmek için kabirlerden herhangi birine yönelmeyi müstehap gördüğünü bilmiyorum."], [2130.0, "Bu konuda kimse bir şey rivayet etmemiştir;"], [2134.0, "ne Peygamber sallallâhu aleyhi ve sellem'den, ne ashâbından, ne de tanınmış imamlardan herhangi birinden bu konuda bir şey rivayet edilmiştir."], [2140.2, "İnsanlar dua, duanın vakitleri ve mekânları hakkında eserler yazmış ve onlarda rivayetleri zikretmişlerdir;"], [2146.3, "bildiğim kadarıyla onlardan hiçbiri kabirlerden herhangi birinin yanında dua etmenin fazileti hakkında tek bir harf zikretmemiştir.\" Sözü —Allah ona rahmet etsin— burada sona erdi."]]}, {"reader": false, "ar": [[2154.0, "ومنها أيضًا: اعتقادُ فضيلة الدعاء بعد رمي الجمرة الثالثة،"], [2165.0, "فإنّ هذا من البدع المحدثة."], [2168.0, "وكذلك اعتقادُ فضيلة الدعاء خلف مقام إبراهيم بخصوصه،"], [2174.0, "فإنّ هذا من البدع المحدثة أيضًا."], [2177.0, "وكاعتقاد فضيلة الدعاء على جبل عرفة بخصوصه دون سائر أجزاء عرفات."], [2185.0, "فكلّ ذلك ممّا لا يدلّ عليه دليل."]], "tr": [[2154.0, "Bunlardan biri de üçüncü cemreyi taşladıktan sonra dua etmenin faziletine inanmaktır;"], [2165.0, "bu, sonradan çıkarılmış bid'atlerdendir. Aynı şekilde özellikle Makâm-ı İbrâhîm'in arkasında dua etmenin faziletine inanmak;"], [2174.0, "bu da sonradan çıkarılmış bid'atlerdendir."], [2176.5, "Arafat'ın diğer kısımları değil de özellikle Arafat dağı üzerinde dua etmenin faziletine inanmak gibi."], [2185.0, "Bütün bunlar, hiçbir delilin delâlet etmediği şeylerdendir."]]}, {"reader": false, "ar": [[2190.0, "ولا بدّ أن تعلموا أنّ المتقرّر في القواعد أنّ شرف الزمان والمكان لا يستلزم اعتقادَ فضل تعبُّدٍ فيها بخصوصه إلا بدليل."], [2200.0, "يقول شيخ الإسلام ابن تيميّة رحمه الله تعالى:"], [2204.0, "«فمن قصد بقعةً يرجو الخيرَ بقصدها، ولم تستحبّ الشريعة ذلك، فهو من المنكرات، وبعضُه أشدّ من بعض، سواءٌ كانت البقعة شجرةً أو عينَ ماءٍ أو جبلًا أو مغارة، وسواءٌ كان قصدُه أن يصلّي عندها، أو ليدعوَ عندها، أو ليقرأ عندها، أو ليذكر الله سبحانه عندها»."], [2227.0, "انتهى كلامه. فكلّ ذلك من المحدثات والبدع التي ما أنزل الله بها من سلطان،"], [2233.0, "وهي من جملة الاعتداء في الدعاء."]], "tr": [[2190.0, "Bilmeniz gerekir ki kaidelerde yerleşik olan şudur:"], [2192.0, "Zamanın ve mekânın şerefli olması, ancak bir delille, onlarda belli bir ibadetin faziletine inanmayı gerektirir."], [2198.7, "Şeyhülislâm İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle der:"], [2203.5, "\"Kim, ona yönelmekle hayır umarak bir yere yönelir ve şeriat bunu müstehap görmemişse, bu münkerlerdendir;"], [2211.4, "bir kısmı diğerinden daha ağırdır."], [2213.6, "O yer ister bir ağaç, ister bir su kaynağı, ister bir dağ, ister bir mağara olsun;"], [2219.6, "ister maksadı onun yanında namaz kılmak, ister orada dua etmek, ister orada (Kur'an) okumak, ister orada Allah Sübhânehû'yu zikretmek olsun.\" Sözü burada sona erdi."], [2230.7, "Bütün bunlar, Allah'ın hakkında hiçbir delil indirmediği muhdesât ve bid'atlerdendir ve duada haddi aşmadandır."]]}]}, {"ts": "37:16", "title": "7. Külliye: Duasında delili olmayan bir hey'et veya sıfatla Allah'a ibadet eden herkes duada haddi aşmıştır", "paras": [{"reader": false, "ar": [[2236.0, "ومن الكلّيّات أيضًا: <b>كلُّ من تعبّد لله في دعائه بهيئةٍ أو صفةٍ لا دليل عليها فمعتدٍ في الدعاء.<\/b> كلُّ من تعبّد لله عز وجل في دعائه بهيئةٍ أو صفةٍ لا دليل عليها فمعتدٍ في الدعاء."]], "tr": [[2236.0, "Külliyelerden biri de şudur: 7."], [2241.6, "külliye: Duasında, delili olmayan bir hey'et veya sıfatla Allah'a ibadet eden herkes duada haddi aşmıştır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2256.0, "وهذا في الاعتداء في الصفات؛"], [2263.0, "فإنّ من الناس من يدعو الله عز وجل على صفةٍ يعتقد فضيلةَ دعائه على هذه الصفة المخصوصة،"], [2271.0, "كالاجتماع على الدعاء، فيدعون الله عز وجل جماعةً،"], [2277.8, "ويتّخذون ذلك عادةً راتبة."], [2280.0, "فلا جرمَ أنّ هذه الهيئة أو الصفة في الدعاء بدعة،"], [2284.0, "سواءٌ كانت في رمضان أو غير رمضان،"], [2287.2, "وهذا العمل لا يُشرَع؛"], [2289.0, "لأنّ هذه الصفة لم ترد في السنّة الصحيحة،"], [2293.0, "والمتقرّر في القواعد أنّ العبادات توقيفيّة،"], [2296.4, "لا يُشرَع منها إلا ما ورد الدليل به."]], "tr": [[2256.0, "Bu, sıfatlardaki haddi aşma hakkındadır."], [2259.2, "Zira insanlardan, bu belli sıfat üzere dua etmesinin faziletli olduğuna inandığı bir sıfat üzere Allah Azze ve Celle'ye dua edenler vardır;"], [2275.0, "dua için toplanmak gibi: Allah Azze ve Celle'ye toplu olarak dua ederler ve bunu düzenli bir âdet edinirler."], [2283.2, "Şüphesiz duadaki bu hey'et veya sıfat bid'attir;"], [2286.3, "ister Ramazan'da ister Ramazan dışında olsun."], [2288.5, "Bu amel meşru değildir; çünkü bu sıfat sahih sünnette gelmemiştir."], [2293.6, "Kaidelerde yerleşik olan şudur: İbadetler tevkîfîdir;"], [2297.0, "onlardan ancak hakkında delil gelen meşru olur."]]}, {"reader": false, "ar": [[2301.0, "ولذلك قال الشاطبيّ رحمه الله في بيان البدع،"], [2305.0, "قال: «الدعاء بهيئة الاجتماع دائمًا لم يكن من فعل رسول الله صلى الله عليه وسلم، كما لم يكن من قوله ولا من إقراره»."], [2316.0, "انتهى كلامه. ومنها كذلك:"], [2318.4, "التمايلُ يمينًا وشمالًا عند الدعاء،"], [2322.0, "فإنها من الهيئات والصفات التي لم يرد بتشريعها نصّ."], [2326.0, "ومنها كذلك: رفعُ الصوت والصياح عند الدعاء،"], [2331.0, "كما يفعله بعض أهل البدع،"], [2333.0, "وهذا منافٍ للأدب في الدعاء؛"], [2336.0, "فإنّ الله عز وجل يقول:"], [2337.0, "<span class=\"ayah\">﴿ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً﴾<\/span> <span class=\"ref\">[الأعراف: ٥٥]<\/span>."]], "tr": [[2301.0, "Bu yüzden Şâtıbî —Allah ona rahmet etsin— bid'atleri açıklarken şöyle demiştir:"], [2305.5, "\"Devamlı olarak toplu hâlde dua etmek, Resûlullah sallallâhu aleyhi ve sellem'in sözünden ve takririnden (onaylamasından) olmadığı gibi fiilinden de değildi.\" Sözü burada sona erdi."], [2315.5, "Bunlardan biri de dua ederken sağa sola sallanmaktır;"], [2319.9, "bu da meşru kılındığına dair nas gelmeyen hey'et ve sıfatlardandır."], [2324.7, "Bunlardan biri de bazı bid'at ehlinin yaptığı gibi dua ederken sesi yükseltmek ve bağırmaktır."], [2331.8, "Bu, duadaki edebe aykırıdır; çünkü Allah Azze ve Celle şöyle buyurur:"], [2336.4, "<span class=\"ayah\">﴿Rabbinize yalvararak ve gizlice dua edin﴾<\/span> [A'râf 55]."]]}, {"reader": false, "ar": [[2340.0, "وقال الله عز وجل عن زكريّا:"], [2343.0, "<span class=\"ayah\">﴿ذِكْرُ رَحْمَتِ رَبِّكَ عَبْدَهُ زَكَرِيَّا ۝ إِذْ نَادَىٰ رَبَّهُ نِدَاءً خَفِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٢–٣]<\/span>."], [2347.0, "وفي الحديث عن أبي موسى الأشعريّ رضي الله عنه،"], [2350.5, "قال: «كان النبيّ صلى الله عليه وسلم في غزاةٍ، فأشرفوا على وادٍ، فجعل الناس يكبّرون ويهلّلون ويرفعون أصواتهم، فقال النبيّ صلى الله عليه وسلم: أيّها الناس، ارْبَعوا على أنفسكم، إنّكم لا تدعون أصمَّ ولا غائبًا، إنّكم تدعون سميعًا قريبًا»."]], "tr": [[2340.0, "Allah Azze ve Celle Zekeriyyâ hakkında da şöyle buyurmuştur:"], [2343.0, "<span class=\"ayah\">﴿(Bu,) Rabbinin, kulu Zekeriyyâ'ya rahmetinin anılmasıdır. Hani o, Rabbine gizli bir sesle niyaz etmişti﴾<\/span> [Meryem 2–3]."], [2347.7, "Ebû Mûsâ el-Eş'arî —Allah ondan razı olsun— hadisinde de şöyle geçer:"], [2351.0, "\"Peygamber sallallâhu aleyhi ve sellem bir gazvedeydi."], [2352.8, "Bir vadiye yukarıdan baktılar; insanlar tekbir getirmeye, tehlîl etmeye ve seslerini yükseltmeye başladılar."], [2357.0, "Bunun üzerine Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2360.5, "Ey insanlar! Kendinize hâkim olun (yumuşak olun);"], [2362.7, "siz sağır olana da gaib olana da dua etmiyorsunuz;"], [2366.7, "siz işiten ve yakın olana dua ediyorsunuz.\""]]}, {"reader": false, "ar": [[2370.0, "ولذلك قال الإمام ابن جُرَيجٍ رحمه الله تعالى:"], [2373.0, "«يُكرَه رفعُ الصوت والصياح بالدعاء، ويُؤمَر بالتضرّع والاستكانة»."], [2380.0, "ومنها أيضًا: ضربُ الدفوف عند الدعاء،"], [2383.3, "كما يفعله كثيرٌ من الصوفيّة."], [2386.0, "ومنها كذلك: مسحُ البدن باليدين بعد الدعاء،"], [2390.8, "كمسح الكتفين أو الصدر،"], [2394.0, "فكلّ ذلك ممّا لم ترد به السنّة."], [2398.0, "ومنها ـ ولعلّكم رأيتموها ـ مسحُ العينين بعد الدعاء:"], [2402.4, "فإنه إذا انتهى من الدعاء نفث في إصبعيه،"], [2407.5, "وصار يمسح عينيه بهما."]], "tr": [[2370.0, "Bu yüzden İmam İbn Cüreyc —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2374.6, "\"Duada sesi yükseltmek ve bağırmak mekruhtur;"], [2380.0, "yalvarmak ve boyun eğmek emredilir.\" Bunlardan biri de sûfîlerin çoğunun yaptığı gibi dua ederken def çalmaktır."], [2388.1, "Bunlardan biri de duadan sonra bedeni ellerle meshetmektir;"], [2392.9, "omuzları veya göğsü meshetmek gibi."], [2395.7, "Bütün bunlar, sünnetin getirmediği şeylerdendir."], [2398.6, "Bunlardan biri de —belki onu görmüşsünüzdür— duadan sonra gözleri meshetmektir:"], [2404.3, "Duayı bitirince iki parmağına üfler ve onlarla gözlerini meshetmeye başlar."]]}]}, {"ts": "40:10", "title": "7. Külliye (devam): Duadan sonra yüzü meshetmek", "paras": [{"reader": false, "ar": [[2410.0, "فتلك هيئةٌ وصفةٌ يتعبّد الله عز وجل بها،"], [2413.8, "ولكن لم يرد بها دليل الشرع،"], [2416.7, "فهي نوعُ اعتداءٍ في الهيئات أو الصفات."], [2420.0, "ومنها كذلك: تقبيلُ الإبهامين أيضًا،"], [2423.5, "هذا من جملة الاعتداء في الدعاء."], [2428.0, "ومنها كذلك: التزامُ الداعي مسحَ وجهه دائمًا بعد كلّ دعاء؛"], [2439.0, "فإنّ ذلك ممّا لم يرد عن النبيّ صلى الله عليه وسلم يقينًا وجزمًا."]], "tr": [[2410.0, "Bu, kendisiyle Allah Azze ve Celle'ye ibadet ettiği bir hey'et ve sıfattır;"], [2414.8, "fakat hakkında şer'î delil gelmemiştir."], [2416.7, "Dolayısıyla hey'etlerde veya sıfatlarda bir tür haddi aşmadır."], [2420.0, "Bunlardan biri de iki başparmağı öpmektir;"], [2424.1, "bu da duada haddi aşmadandır."], [2426.9, "Bunlardan biri de duacının her duadan sonra devamlı olarak yüzünü meshetmeye bağlı kalmasıdır;"], [2439.0, "çünkü bu, kesin ve yakînî olarak Peygamber sallallâhu aleyhi ve sellem'den gelmemiş olan şeylerdendir."]]}, {"reader": false, "ar": [[2444.0, "فمع كثرة الأحاديث التي تدلّ على أنه دعا،"], [2447.3, "إلا أنها ـ مع صحّتها ـ ـ يرحمك الله ـ لم يذكر الرواة فيها أنّ النبيّ صلى الله عليه وسلم كان يمسح وجهه بيديه بعد الدعاء."], [2459.0, "مع أنه لو فعل ذلك أحيانًا لا دوامًا فإنّ ذلك جائزٌ سائغ،"], [2465.4, "لوروده عن بعض الصحابة والسلف."], [2468.0, "ولكن أن يلتزمه التزامًا دائمًا وكأنه من آداب الدعاء الدائمة المطلقة،"], [2474.0, "فإنّ ذلك لا يُعرَف عنه صلى الله عليه وسلم."], [2477.0, "فلا يُشرَع الالتزام الدائم بمسح الوجه بعد الدعاء."]], "tr": [[2444.0, "Onun dua ettiğine delâlet eden hadislerin çokluğuna rağmen, onlar sahih olmakla birlikte —Yerhamükellah— râviler onlarda Peygamber sallallâhu aleyhi ve sellem'in duadan sonra elleriyle yüzünü meshettiğini zikretmemişlerdir."], [2455.9, "Bununla birlikte (kişi) bunu devamlı değil de ara sıra yaparsa bu caiz ve geçerlidir;"], [2463.2, "çünkü bazı sahabe ve seleften gelmiştir."], [2466.4, "Fakat sanki duanın devamlı ve mutlak âdâbından imiş gibi devamlı olarak ona bağlı kalması, sallallâhu aleyhi ve sellem'den bilinen bir şey değildir."], [2476.3, "Dolayısıyla duadan sonra yüzü meshetmeye devamlı bağlı kalmak meşru değildir."]]}, {"reader": false, "ar": [[2482.0, "وكلُّ حديثٍ في أنّ النبيّ صلى الله عليه وسلم مسح وجهه بيديه بعد الدعاء فإنه ضعيفٌ لا تقوم به الحجّة،"], [2495.0, "ولا يُقوّي بعضُها بعضًا."], [2497.0, "ولذلك قال الإمام أحمد رحمه الله:"], [2500.2, "«لا يُعرَف هذا» ـ أي أنه كان يمسح وجهه بعد الدعاء ـ «إلا عن الحسن»."], [2507.0, "وقال شيخ الإسلام ابن تيميّة رحمه الله تعالى:"], [2510.6, "«وأمّا رفعُ النبيّ صلى الله عليه وسلم يديه في الدعاء فقد جاء فيه أحاديثُ كثيرةٌ صحيحة، وأمّا مسحُه وجهَه بيديه فليس عنه فيه إلا حديثٌ أو حديثان لا تقوم بهما الحجّة»."]], "tr": [[2482.0, "Peygamber sallallâhu aleyhi ve sellem'in duadan sonra elleriyle yüzünü meshettiğine dair her hadis zayıftır;"], [2490.1, "onunla hüccet kâim olmaz ve (bu hadisler) birbirini kuvvetlendirmez."], [2495.5, "Bu yüzden İmam Ahmed —Allah ona rahmet etsin— şöyle demiştir:"], [2500.2, "\"Bu\" —yani duadan sonra yüzünü meshetmesi— \"ancak Hasan (el-Basrî)'den bilinir.\" Şeyhülislâm İbn Teymiyye —Allah Teâlâ ona rahmet etsin— de şöyle demiştir:"], [2509.7, "\"Peygamber sallallâhu aleyhi ve sellem'in duada ellerini kaldırmasına gelince, bu konuda pek çok sahih hadis gelmiştir."], [2516.6, "Yüzünü elleriyle meshetmesine gelince, bu konuda ondan, kendileriyle hüccet kâim olmayan bir veya iki hadisten başka bir şey yoktur.\""]]}, {"reader": false, "ar": [[2526.0, "وقال الإمام العزّ بن عبد السلام قولًا ثقيلًا في ذلك،"], [2531.0, "قال: «ولا يمسح وجهه بيديه عَقيبَ الدعاء إلا جاهل»."], [2536.0, "فإذا لم يجز مسحُ الوجه بعد الدعاء فأولى أن يُمنَع الداعي من مسح باقي الجسم،"], [2546.0, "وأن يُقبّل عينيه، كما ذكرتُ ذلك في جملة الصفات الممنوعة في الدعاء."]], "tr": [[2526.0, "İmam İzz b. Abdisselâm bu konuda ağır bir söz söylemiştir:"], [2531.0, "\"Duanın ardından elleriyle yüzünü ancak bir cahil mesheder.\" Duadan sonra yüzü meshetmek caiz olmadığına göre, duacının bedenin geri kalanını meshetmekten ve gözlerini öpmekten men edilmesi evleviyetle (gerekir);"], [2548.7, "nitekim bunu duada yasaklanan sıfatlar arasında zikretmiştim."]]}]}, {"ts": "42:34", "title": "8. Külliye: Duasında kastı sahih olan kimseye duadaki lahn zarar vermez", "paras": [{"reader": false, "ar": [[2554.0, "ومن الكلّيّات أيضًا: <b>كلُّ من صحّ قصدُه في دعائه فلا يضرّه اللحنُ فيه.<\/b> واضحٌ الكلام."]], "tr": [[2554.0, "Külliyelerden biri de şudur: 8."], [2555.8, "külliye: Duasında kastı sahih olan kimseye, duadaki lahn (dil / i'rab hatası) zarar vermez. Söz açıktır."]]}, {"reader": false, "ar": [[2576.0, "فإنّ الخطأ في الدعاء لا أثر له أبدًا،"], [2581.0, "لا سيّما إذا كان عن غير قصد."], [2584.0, "فالعبرةُ بما في القلب من المقاصد والغايات والنوايا والبواعث،"], [2591.0, "وأمّا ما يسبق به اللسانُ من الخطأ فهو معفوٌّ عنه."], [2596.0, "ولذلك قال الله عز وجل:"], [2598.7, "<span class=\"ayah\">﴿وَلَيْسَ عَلَيْكُمْ جُنَاحٌ فِيمَا أَخْطَأْتُم بِهِ وَلَٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْ﴾<\/span> <span class=\"ref\">[الأحزاب: ٥]<\/span>."]], "tr": [[2576.0, "Çünkü duadaki hatanın asla bir etkisi yoktur;"], [2580.4, "özellikle kasıtsız olursa. İtibar, kalpteki maksatlara, gayelere, niyetlere ve saiklere göredir."], [2586.8, "Dilin sürçerek yaptığı hata ise affedilmiştir."], [2591.5, "Bu yüzden Allah Azze ve Celle şöyle buyurmuştur:"], [2596.0, "<span class=\"ayah\">﴿Hata ettiğiniz şeyde size bir günah yoktur; ancak kalplerinizin kasten yaptığı (günahtır)﴾<\/span> [Ahzâb 5]."]]}, {"reader": false, "ar": [[2604.0, "واللهُ عز وجل يعلم قصدَك ونيّتك،"], [2607.2, "ويُجيبك بحسب ما وقع في قلبك من الإرادة والقصد،"], [2611.9, "حتى وإن أخطأ لسانُك."], [2614.0, "والعبرةُ في الأدعية بما يقوم في القلوب عمومًا وإن كان لفظُ اللسان خاصًّا،"], [2622.0, "أو مطلقًا وإن كان لفظُ اللسان مقيَّدًا."], [2625.0, "فإذا أخطأ اللسانُ مع استقامة قصد القلب في الدعاء،"], [2631.0, "فإنّ مجرّد خطأ اللسان لا يُعتبَر مانعًا من الاستجابة."]], "tr": [[2604.0, "Allah Azze ve Celle senin kastını ve niyetini bilir ve dilin hata etse bile kalbine düşen irade ve kasta göre sana icabet eder."], [2615.2, "Dualarda itibar,
