 dilin lafzı hususi olsa bile kalplerde umumi olarak bulunan (manaya), ya da dilin lafzı mukayyed olsa bile (kalpte) mutlak olarak bulunan (manaya) göredir."], [2628.3, "Duada kalbin kastı doğru iken dil hata ederse, dilin sırf hatası icabete engel sayılmaz."]]}, {"reader": false, "ar": [[2636.0, "وقد سُئل شيخ الإسلام ابن تيميّة رحمه الله تعالى عن رجلٍ دعا دعاءً ملحونًا،"], [2642.0, "فقال له رجل: ما يقبل اللهُ دعاءً ملحونًا."], [2648.0, "فأجاب رحمه الله تعالى:"], [2650.4, "«من قال هذا القول فهو آثم، مخالفٌ للكتاب والسنّة ولِما كان عليه السلف. وأمّا من دعا الله مخلصًا له الدين بدعاءٍ جائز، سمعه الله وأجاب دعاءه، سواءٌ كان مُعرَبًا أو ملحونًا."]], "tr": [[2636.0, "Şeyhülislâm İbn Teymiyye'ye —Allah Teâlâ ona rahmet etsin— lahinli (i'rab hatalı) bir dua eden ve bir adamın kendisine \"Allah lahinli duayı kabul etmez\" dediği bir kişi hakkında soruldu."], [2647.1, "O —Allah Teâlâ ona rahmet etsin— şöyle cevap verdi:"], [2651.6, "\"Bu sözü söyleyen günahkârdır; Kitab'a, Sünnet'e ve selefin üzerinde bulunduğu şeye muhaliftir."], [2656.6, "Dini Allah'a has kılarak caiz bir duayla Allah'a dua edene gelince, ister i'rabı doğru ister lahinli olsun, Allah onu işitir ve duasına icabet eder."]]}, {"reader": false, "ar": [[2667.0, "والكلام المذكور لا أصلَ له،"], [2670.0, "بل ينبغي للداعي إذا لم يكن عادتُه الإعرابَ ألّا يتكلّف الإعراب."], [2675.0, "قال بعض السلف: إذا جاء الإعرابُ ذهب الخشوع."], [2680.0, "وهذا كما يُكرَه تكلُّف السجع في الدعاء،"], [2683.0, "فإذا وقع بغير تكلُّفٍ فلا بأس به."], [2686.0, "فإنّ أصل الدعاء من القلب،"], [2689.1, "واللسانُ تابعٌ له. ومن جعل همّته في الدعاء تقويمَ لسانه أضعفَ توجُّهَ قلبه؛"], [2697.0, "ولهذا يدعو المضطرُّ بقلبه دعاءً يُفتَح عليه لا يحضره قبل ذلك». انتهى كلامه."]], "tr": [[2667.0, "Zikredilen sözün aslı yoktur. Bilakis duacının, i'raba (dikkat etmek) âdeti değilse, i'rabı zorlamaması gerekir."], [2672.6, "Seleften biri şöyle demiştir: 'İ'rab gelince huşû gider.' Bu, duada seci'yi (kafiyeli söz) zorlamanın mekruh olması gibidir;"], [2681.3, "zorlama olmaksızın meydana gelirse bir sakıncası yoktur."], [2683.9, "Çünkü duanın aslı kalptendir, dil ona tâbidir."], [2686.6, "Duadaki bütün himmetini dilini düzeltmeye veren, kalbinin (Allah'a) yönelişini zayıflatmış olur."], [2692.2, "Bu yüzden çaresiz kalan kimse kalbiyle, daha önce aklına gelmeyen ve ona (o anda) açılıveren bir duayla dua eder.\" Sözü burada sona erdi."]]}, {"reader": false, "ar": [[2705.0, "وبناءً على ذلك فلا ينبغي أن نجعل رفعَ المنصوب،"], [2711.0, "أو نصبَ المكسور، أو الخلافَ في بعض علامات الإعراب في الدعاء،"], [2717.0, "سبيلًا إلى نقد الناس أو التثريب عليهم،"], [2720.0, "أو إشغالهم بمثل هذا الإعراب الذي قد يكون سببًا لاشتغال قلوبهم ومقاصد نفوسهم عن الإقبال على الدعاء. والله أعلم."]], "tr": [[2705.0, "Buna binaen, duada mansûbu merfû okumayı, meksûru mansûb okumayı veya bazı i'rab alametlerindeki farklılığı, insanları eleştirmeye ya da onları kınamaya veya onları, kalplerinin ve nefislerinin maksatlarının duaya yönelmekten (başka şeyle) meşgul olmasına sebep olabilecek bu tür bir i'rabla meşgul etmeye vesile kılmamalıyız. Allah en iyisini bilir."]]}]}, {"ts": "45:30", "title": "9. Külliye: Duacının hâline uygun olsun diye dualardaki zamirlerde yapılan her değişiklik caizdir", "paras": [{"reader": false, "ar": [[2730.0, "ومن الكلّيّات ـ ولعلّه آخرُها ـ:"], [2733.0, "<b>كلُّ تغييرٍ طرأ على الضمائر في الأدعية لمناسبة حال الداعي فجائز.<\/b> مَن يُعيدها؟"], [2740.1, "ـ ما شاء الله عليك،"], [2741.2, "ها؟ إي نعم ـ <span class=\"q\">؟ 45:38<\/span> كلُّ تغييرٍ طرأ على الضمائر في الدعاء لمناسبة حال الداعي فجائز."], [2753.0, "كلُّ تغييرٍ طرأ على الضمائر في الدعاء لمناسبة حال الداعي فجائز."]], "tr": [[2730.0, "Külliyelerden —belki de sonuncusu— şudur:"], [2734.0, "<b>9. külliye: Duacının hâline uygun olsun diye dualardaki zamirlerde meydana gelen her değişiklik caizdir.<\/b> Kim onu tekrar eder?"], [2746.1, "—Mâşallah sana. Hı? Evet, evet— <span class=\"q\">؟<\/span> (Külliye iki kez daha tekrar ediliyor.)"]]}, {"reader": false, "ar": [[2763.0, "أقول وبالله التوفيق: هذه الكلّيّة تدلّ على أنّ تغيير الضمائر في الأدعية ـ من الجمع إلى الإفراد،"], [2771.0, "أو من الإفراد إلى التثنية،"], [2773.0, "أو من التذكير إلى التأنيث،"], [2775.0, "أو من التأنيث إلى التذكير ـ مراعاةً لمقتضى حال الداعي أو المدعوِّ له،"], [2783.0, "جائزٌ لا بأس به ولا حرج فيه،"], [2786.0, "ولا يُعتبَر من تحريف الكلم عن مواضعه،"], [2789.0, "حتى وإن اختلف مع لفظ الدعاء الوارد في النصّ كتابًا وسنّة."], [2795.0, "فإنّ ذلك جائزٌ إذا كانت المناسبةُ مراعاةَ حال الداعي لنفسه أو الداعي لغيره،"], [2806.0, "كما نصّ عليه أكثرُ من واحدٍ من أهل العلم."]], "tr": [[2763.0, "Tevfik Allah'tandır, derim ki: Bu külliye şuna delâlet eder:"], [2767.8, "Dualardaki zamirleri —çoğuldan tekile, tekilden ikile, müzekkerden müennese veya müennesten müzekkere— duacının ya da kendisine dua edilenin hâlinin gereğini gözeterek değiştirmek caizdir;"], [2779.7, "bunda bir sakınca ve bir vebal yoktur."], [2784.3, "Bu, Kitap ve Sünnet'teki nasta gelen dua lafzıyla farklı düşse bile kelimeleri yerlerinden tahrif etmekten sayılmaz."], [2792.3, "Uygunluk, kendisi için dua edenin veya başkası için dua edenin hâlini gözetmek olduğunda bu caizdir;"], [2803.1, "nitekim ilim ehlinden birden fazla kişi bunu açıkça belirtmiştir."]]}, {"reader": false, "ar": [[2810.0, "فبابُ الدعاء واسعٌ في ضمائره."], [2813.0, "ولذلك في «الفتاوى» لابن تيميّة رحمه الله تعالى أنه سُئل عن امرأةٍ سمعت في الحديث:"], [2821.0, "«اللهمّ إنّي عبدُك وابنُ عبدِك، ناصيتي بيدك»،"], [2824.0, "فداومت على هذا اللفظ،"], [2827.0, "فقيل لها: قولي: «اللهمّ إنّي أمتُك بنتُ أمتِك» إلى آخره،"], [2832.0, "فأبت إلا المداومةَ على اللفظ؛"], [2834.0, "فهل هي مُصيبةٌ أو لا؟"], [2836.0, "فأجاب: «بل ينبغي لها أن تقول: اللهمّ إنّي أمتُك، بنتُ عبدِك، ابنِ أمتِك؛ فهو أولى وأحسن. وإن كان قولُها: عبدُك وابنُ عبدِك، له مَخرجٌ في العربيّة، كلفظ الزوج»."], [2857.7, "انتهى كلامه. فأجاز ابنُ تيميّة تغييرَ مثل ذلك مراعاةً لحال الداعي."]], "tr": [[2810.0, "Dua babı, zamirleri bakımından geniştir."], [2811.8, "Bu yüzden İbn Teymiyye'nin —Allah Teâlâ ona rahmet etsin— \"el-Fetâvâ\"sında şu vardır:"], [2817.3, "Kendisine, hadiste \"Allah'ım! Ben senin kulunum, kulunun oğluyum;"], [2820.1, "perçemim senin elindedir\" (duasını) işitip bu lafza devam eden bir kadın soruldu."], [2823.1, "Ona \"'Allah'ım! Ben senin kadın kulunum, kadın kulunun kızıyım' … diye söyle\" denmiş, o ise bu lafza devam etmekten başkasını kabul etmemiş."], [2831.5, "Acaba o isabetli midir, değil midir?"], [2833.2, "(İbn Teymiyye) şöyle cevap verdi:"], [2834.8, "\"Bilakis onun 'Allah'ım! Ben senin kadın kulunum, (erkek) kulunun kızıyım, kadın kulunun oğlunun (kızıyım)' demesi gerekir;"], [2841.3, "bu daha evlâ ve daha güzeldir."], [2844.1, "Bununla birlikte onun 'kulunum ve kulunun oğluyum' demesinin de —(hem erkek hem kadın için kullanılan) 'zevc' lafzı gibi— Arapçada bir çıkış yolu (tevcihi) vardır.\" Sözü burada sona erdi."], [2860.7, "İbn Teymiyye, duacının hâlini gözeterek bunun gibi bir değişikliği caiz görmüştür."]]}]}, {"ts": "47:46", "title": "9. Külliye (devam): İmamın cemaatle duası, Heytemî ve Daimi Komite'den nakiller · Kapanış", "paras": [{"reader": false, "ar": [[2866.0, "وقال شيخ الإسلام ابن تيميّة رحمه الله أيضًا:"], [2868.0, "«وإذا كان المأمومُ مؤمِّنًا على دعاء الإمام فيدعو بصيغة الجمع، كما في دعاء الفاتحة في قوله: <span class=\"ayah\">﴿اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ﴾<\/span> <span class=\"ref\">[الفاتحة: ٦]<\/span>؛ فإنّ المأموم إنما أمّن لاعتقاده أنّ الإمام يدعو لهما جميعًا، فإن لم يفعل فقد خان الإمامُ المأمومَ»."], [2888.1, "انتهى كلامه. فإذا ورد شيءٌ من الأدعية بلفظ الإفراد،"], [2891.9, "ودعا به الإمامُ في القنوت،"], [2894.0, "فإنه لا بأس بتغيير الضمير من الإفراد إلى الجمع،"], [2899.4, "حتى لا يدخل في خيانة المأمومين."]], "tr": [[2866.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şunu da söylemiştir:"], [2868.6, "\"Me'mûm imamın duasına âmin diyorsa, (imam) çoğul sîgasıyla dua eder;"], [2874.4, "Fâtiha duasında <span class=\"ayah\">﴿Bizi dosdoğru yola ilet﴾<\/span> [Fâtiha 6] sözünde olduğu gibi."], [2881.0, "Çünkü me'mûm, imamın ikisi için birlikte dua ettiğine inandığı için âmin demiştir."], [2886.3, "(İmam) bunu yapmazsa imam me'mûma ihanet etmiş olur.\" Sözü burada sona erdi."], [2891.5, "Dualardan biri tekil lafzıyla gelmişse ve imam onunla kunutta dua ediyorsa, me'mûmlara ihanete girmemek için zamiri tekilden çoğula çevirmesinde bir sakınca yoktur."]]}, {"reader": false, "ar": [[2903.0, "وقال ابن حجرٍ الهيتميّ رحمه الله:"], [2906.0, "«تقول المرأة في سيّد الاستغفار وما في معناه: وأنا أمتُك، ولو قالت: وأنا عبدُك، فله مَخرجٌ في العربيّة بتأويل شخص»."], [2916.0, "انتهى كلامه. وفي «فتاوى اللجنة الدائمة»:"], [2920.0, "«إن كان الإمام يدعو لنفسه ولغيره جهرةً حالَ القنوت، والدعاءِ في خطب الجمعة وغيرها، فلا يخصّ نفسه بالدعاء دونهم، بل يأتي بصيغة الجمع». انتهى كلامه."]], "tr": [[2903.0, "İbn Hacer el-Heytemî —Allah ona rahmet etsin— şöyle demiştir:"], [2906.0, "\"Kadın, seyyidü'l-istiğfârda ve onun manasındaki (dualarda) 've ene emetük (ben senin kadın kulunum)' der."], [2912.0, "'ve ene abdük (ben senin kulunum)' derse, 'şahıs' manasına yorumlanarak bunun da Arapçada bir çıkış yolu vardır.\" Sözü burada sona erdi."], [2919.5, "\"Daimi Komite Fetvaları\"nda da şöyle geçer:"], [2921.3, "\"İmam kunut hâlinde, cuma hutbelerindeki duada ve başka yerlerde kendisi ve başkaları için açıktan dua ediyorsa, onları bırakıp duayı kendisine tahsis etmez;"], [2928.4, "bilakis çoğul sîgasıyla getirir.\" Sözü burada sona erdi."]]}, {"reader": false, "ar": [[2932.0, "فمثلُ هذه المسائل لا ينبغي الوقوفُ عندها،"], [2935.0, "وإنما المقصود مراعاةُ أحوال الداعي."], [2939.0, "فإذا كانت مراعاةُ أحواله تقتضي تغييرَ بعض الضمائر أو تغييرَ بعض الكلمات فإنّ ذلك جائزٌ لا بأس به إن شاء الله."], [2947.0, "ولعلّنا نكتفي بهذا القدر، والله أعلى وأعلم."]], "tr": [[2932.0, "Bu gibi meselelerde takılıp kalmamak gerekir;"], [2934.6, "maksat ancak duacının hâllerini gözetmektir."], [2938.2, "Onun hâllerini gözetmek bazı zamirleri veya bazı kelimeleri değiştirmeyi gerektiriyorsa, inşallah bu caizdir, bir sakıncası yoktur."], [2945.9, "Belki bu kadarıyla yetiniriz. Allah en yücedir ve en iyisini bilir."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
