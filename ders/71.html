<script>
const D={"no": 71, "vid": "uDvX8HEr794", "title_ar": "الدرس (٧١) من شرح كليات العقيدة — كليات في باب الصفات: دعاء الصفة، والتوسل والاستعاذة والحلف بالصفات، والتفسير والمعنى والتكييف المنفي في كلام السلف، وإقحام المجاز في الصفات", "title_tr": "Şerhu Külliyyâti'l-Akîde — 71. Ders: Sıfatlar Babının Külliyeleri (Sıfata Tek Başına Dua Edilmemesi, Sıfatlarla Tevessül, İstiâze ve Yemin, Selefin Sözlerinde Nefyedilen Tefsir, Mana ve Tekyîf, Sıfatlara Mecaz Sokanın Bid'at Ehlinden Oluşu)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Sıfatlardan hiçbirine tek başına dua etmek caiz değildir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.6, "والصلاةُ والسلامُ على رسول الله الأمين،"], [3.9, "وعلى آله وأصحابه الطيبين الطاهرين،"], [5.9, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [8.2, "أمّا بعد: فلا نزال ـ ولله الحمدُ والمنّة ـ في سياق الكلّيّات المتعلّقة بباب الأسماء والصفات عند أهل السنة والجماعة."], [17.0, "وأظنّ وقفنا عند القاعدة:"], [19.0, "أنّ صفات الله عز وجل تتفاضل،"], [22.0, "أليس كذلك؟ انتهينا من شرحها؟"], [25.0, "طيّب. ومن الكلّيّات في هذا الدرس:"], [28.0, "<b>كلُّ الصفات لا يجوز دعاؤها منفردةً.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [33.1, "<b>كلُّ الصفات لا يجوز دعاؤها منفردةً.<\/b>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.6, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.0, "Bundan sonra: Hamd ve minnet Allah'a, hâlâ Ehl-i Sünnet ve'l-Cemaat nezdinde isim ve sıfatlar babıyla ilgili külliyeler bağlamındayız."], [17.0, "Zannederim \"Allah Azze ve Celle'nin sıfatları birbirinden üstün olur\" kaidesinde kalmıştık, değil mi?"], [23.2, "Onun şerhini bitirdik mi? Peki."], [25.0, "Bu dersteki külliyelerden biri: 1."], [26.5, "külliye: Sıfatların hiçbirine tek başına (zâttan ayrı olarak) dua etmek caiz değildir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [33.1, "<b>1. külliye: Sıfatların hiçbirine tek başına dua etmek caiz değildir.<\/b>"]]}, {"reader": false, "ar": [[50.0, "أقول وبالله التوفيق: اعلموا ـ رحمكم الله تعالى ـ أنّ عندنا في هذه الكلّيّة قسمين ـ أمرين ـ لا بدّ من فهمهما."], [58.0, "الأمر الأول: من يدعو صفاتِ الله عز وجل مستشعرًا انفصالَ الصفة عن موصوفها؛"], [66.0, "فهو يقول: يا رحمةَ الله،"], [69.0, "مستشعرًا انفصالَ الرحمة عن الراحم،"], [72.0, "أو يقول: يا وجهَ الله،"], [74.3, "مستشعرًا انفصالَ الوجه عن الموصوف به،"], [77.0, "أو يقول: يا عزّةَ الله،"], [80.0, "مستشعرًا انفصالَ العزّة عن موصوفها،"], [83.0, "أو يقول: يا قوّةَ الله،"], [85.5, "مستشعرًا انفصالَ القوّة عن موصوفها،"], [88.0, "أو يقول: يا قدرةَ الله،"], [91.5, "مستشعرًا انفصالَ القدرة عن موصوفها."], [95.0, "وهذا هو الذي نصّ العلماء على أنه من الكفر،"], [100.0, "كما حكى الإجماعَ على ذلك أبو العبّاس ابن تيمية،"], [103.9, "كما سيأتي نقلُه إن شاء الله."]], "tr": [[50.0, "Tevfik Allah'tandır, derim ki: Bilin —Allah size rahmet etsin— bu külliyede elimizde iki kısım —iki husus— var ki bunları anlamak zorunludur."], [58.0, "Birinci husus: Allah Azze ve Celle'nin sıfatlarına, sıfatın mevsufundan (sıfatın sahibinden) ayrı olduğunu hissederek dua eden kimse."], [66.0, "Bu kişi \"Ey Allah'ın rahmeti!\" der ve rahmetin Râhim'den ayrı olduğunu hisseder;"], [72.9, "veya \"Ey Allah'ın vechi!\" der ve vechin onunla vasıflanandan ayrı olduğunu hisseder;"], [78.2, "veya \"Ey Allah'ın izzeti!\" der ve izzetin sahibinden ayrı olduğunu hisseder;"], [84.0, "veya \"Ey Allah'ın kuvveti!\" der ve kuvvetin sahibinden ayrı olduğunu hisseder;"], [89.4, "veya \"Ey Allah'ın kudreti!\" der ve kudretin sahibinden ayrı olduğunu hisseder."], [95.0, "İşte âlimlerin küfür olduğunu açıkça belirttiği budur;"], [99.4, "inşallah nakli gelecek olduğu üzere Ebü'l-Abbâs İbn Teymiyye de bunun üzerine icmâ nakletmiştir."]]}, {"reader": false, "ar": [[106.0, "وهو الذي تنصّ عليه هذه القاعدة،"], [110.1, "والتي يدلّ عليها فيها قولُنا:"], [113.5, "«منفردةً»؛ يعني: أن يكون حالَ دعائه لهذه الصفة مستشعرًا انفصالَ الصفة عن موصوفها،"], [123.0, "كما تعتقده الجهميّة من انفصال الصفات عن ذات الربّ عز وجل."], [130.0, "وهذا الذي ينبغي حملُ كلام أهل العلم عليه في تكفير من يدعو الصفات،"], [136.0, "حذرًا من تكفير أصحاب القسم الثاني."]], "tr": [[106.0, "Bu kaidenin açıkça ifade ettiği ve bu kaidedeki \"tek başına\" sözümüzün delâlet ettiği şey de budur."], [116.3, "Yani kişinin bu sıfata dua ettiği esnada, Cehmiyye'nin sıfatların Rabb Azze ve Celle'nin zâtından ayrı olduğuna inandığı gibi, sıfatın mevsufundan ayrı olduğunu hissetmesidir."], [130.0, "Sıfatlara dua edeni tekfir hususunda ilim ehlinin sözünün hamledilmesi gereken mana budur;"], [135.5, "ikinci kısmın sahiplerini tekfir etmekten sakınmak için."]]}, {"reader": false, "ar": [[140.6, "وهم من يدعو الصفةَ مريدًا بها موصوفَها؛"], [144.1, "فهو يقول: يا رحمةَ الله،"], [146.7, "يدعو بها ذاتَ الله عز وجل،"], [150.0, "أو يقول: يا قدرةَ الله،"], [153.1, "يدعو بها القادر، أو يقول:"], [156.0, "يا وجهَ الله، وهو يدعو الموصوفَ بهذا الوجه."], [160.0, "فنحن نجزم بأنّ قولتَه خطأٌ ومحرّمةٌ ولا تجوز،"], [166.0, "ولكن لا يصل بنا ذلك التحريم إلى إخراجه عن دائرة الإسلام؛"], [172.0, "لأنّ حقيقته أنه إنما دعا اللهَ عز وجل،"], [177.0, "ولكنه أخطأ في صفة لفظ دعائه،"], [180.0, "فصار دعاؤه منصبًّا على الصفة،"], [184.0, "وفي حقيقة مراده أنه لا يريد إلا الموصوف."]], "tr": [[140.6, "Onlar, sıfata dua edip bununla sıfatın sahibini kastedenlerdir."], [144.1, "Bu kişi \"Ey Allah'ın rahmeti!\" der ve bununla Allah Azze ve Celle'nin zâtına dua eder;"], [151.2, "veya \"Ey Allah'ın kudreti!\" der ve bununla Kâdir olana dua eder;"], [156.0, "veya \"Ey Allah'ın vechi!\" der ve bu vecihle vasıflanana dua eder."], [160.0, "Biz bunun sözünün hata, haram ve caiz olmadığını kesin olarak söyleriz;"], [164.3, "fakat bu haramlık bizi onu İslâm dairesinden çıkarmaya götürmez."], [167.6, "Çünkü işin hakikati, onun ancak Allah Azze ve Celle'ye dua etmiş olmasıdır;"], [172.0, "fakat duasının lafzının şeklinde hata etmiştir."], [177.5, "Böylece duası sıfata yönelmiş olmuştur;"], [181.6, "hakiki maksadında ise sıfatın sahibinden başkasını kastetmemektedir."]]}, {"reader": false, "ar": [[189.0, "فمتى ما سمعتم أحدًا من أهل العلم يقول:"], [193.0, "بأنّ دعاء الصفة كفر،"], [195.7, "فإنما تحملونه على القسم الأول."], [199.0, "وأمّا القسم الثاني فإنه يكفي فيه الزجرُ والتنبيهُ والتغليظُ على ألّا يعود لمثل ذلك اللفظ،"], [207.0, "ولكن لا يصل بنا الحالُ إلى إخراجه عن دائرة الإسلام."], [211.0, "فالمراد من دعاء الصفة:"], [213.5, "أن تكون الصفةُ المدعوُّ بها تقتضي شيئًا منفصلًا ومستقلًّا عن الذات الإلهيّة،"], [221.0, "فهو يُنزِلها منزلةَ الله عز وجل،"], [226.0, "كأنّ الصفة عينَها تسمع دعاءه،"], [231.0, "وعندها القدرةُ في الإجابة،"], [236.0, "وأنها تملك عينَ ما دعاه بها، ونحو ذلك."]], "tr": [[189.0, "İlim ehlinden birinin \"sıfata dua etmek küfürdür\" dediğini ne zaman işitirseniz, onu ancak birinci kısma hamledersiniz."], [199.0, "İkinci kısma gelince, onda böyle bir lafza bir daha dönmemesi için men etmek, uyarmak ve sert davranmak yeterlidir;"], [207.8, "fakat durum bizi onu İslâm dairesinden çıkarmaya götürmez."], [211.0, "Sıfata dua etmekten maksat şudur:"], [213.5, "Kendisine dua edilen sıfatın, ilâhî zâttan ayrı ve bağımsız bir şey olmayı gerektirmesi;"], [219.8, "kişi onu Allah Azze ve Celle'nin yerine koyar;"], [224.8, "sanki sıfatın bizzat kendisi onun duasını işitir, icabet etmeye onun kudreti vardır ve onunla dua ettiği şeyin bizzat kendisine sahiptir ve benzeri."]]}, {"reader": false, "ar": [[240.0, "مثل أن يقول الإنسان:"], [242.5, "يا رحمةَ الله ارحميني،"], [244.9, "مستشعرًا انفصالَ الرحمة عن الموصوف،"], [248.0, "أو يقول: يا عزّةَ الله أعزّيني،"], [251.5, "مستشعرًا انفصالَها عن العزيز عز وجل."], [255.0, "فمن اعتقد أنّ الصفة المنفصلة عن الموصوف تغفر وترحم وتُغني وتُقوّي،"], [265.0, "فقد جعل الصفةَ إلهًا معبودًا،"], [269.0, "فقد جعل الصفةَ إلهًا معبودًا."], [271.0, "وهذا كفرٌ باتّفاق العلماء؛"], [273.3, "ذلك لأنّ صفات الله عز وجل ملازمةٌ لذاته،"], [278.0, "لا تنفكّ عنه سبحانه لا أزلًا ولا أبدًا."]], "tr": [[240.0, "Meselâ insanın, rahmetin sahibinden ayrı olduğunu hissederek \"Ey Allah'ın rahmeti, bana rahmet et!\" demesi veya izzetin Azîz olan Azze ve Celle'den ayrı olduğunu hissederek \"Ey Allah'ın izzeti, beni aziz kıl!\" demesi gibi."], [255.0, "Kim sahibinden ayrı olan sıfatın bağışladığına, rahmet ettiğine, zengin kıldığına ve güçlendirdiğine inanırsa, sıfatı ibadet edilen bir ilâh edinmiş olur;"], [269.8, "sıfatı ibadet edilen bir ilâh edinmiş olur."], [273.3, "Bu, âlimlerin ittifakıyla küfürdür. Çünkü Allah Azze ve Celle'nin sıfatları zâtından ayrılmaz;"], [279.2, "ne ezelde ne ebedde O Sübhânehû'dan ayrılır."]]}, {"reader": false, "ar": [[283.0, "ويؤكّد ذلك أنّ ابن تيمية رحمه الله تعالى حكى إجماعَ العلماء من أهل السنة والجماعة على كفر من دعا الصفة،"], [293.0, "وهو يردّ على النصارى بالنسبة لكلمة الله عز وجل،"], [299.1, "والتي يجعلونها عيسى؛ فيجعلون جزءًا من الله عز وجل قد انفصل وتكوّن به عيسى."], [308.0, "ولذلك يجعلون عيسى إلهًا؛"], [310.0, "لأنه جزءٌ من كلمة الله منفصلةً عن الله عز وجل."], [315.0, "فتراهم يدعونه ويستغيثون به ويستنصرونه ويستقوون به من دون الله عز وجل،"], [322.0, "بناءً على ما حلّ فيه من اللاهوت."]], "tr": [[283.0, "Bunu te'kid eden şudur: İbn Teymiyye —Allah ona rahmet etsin— Ehl-i Sünnet ve'l-Cemaat âlimlerinin sıfata dua edenin küfrü üzerindeki icmâını, Hristiyanlara Allah Azze ve Celle'nin kelimesi meselesinde —ki onu İsa yaparlar— reddiye yaparken nakletmiştir."], [302.0, "Onlar Allah Azze ve Celle'den bir parçanın ayrıldığını ve İsa'nın onunla oluştuğunu iddia ederler."], [308.0, "Bu yüzden İsa'yı ilâh edinirler;"], [310.0, "çünkü (onlara göre) o, Allah Azze ve Celle'den ayrılmış olan Allah'ın kelimesinden bir parçadır."], [315.0, "Bu sebeple, ona hulûl ettiğini iddia ettikleri lâhûta (ilâhî tabiata) binaen, Allah Azze ve Celle'yi bırakıp ona dua ettiklerini, ondan imdat istediklerini, ondan yardım dilediklerini ve onunla güç aradıklarını görürsün."]]}]}, {"ts": "05:24", "title": "1. Külliye (devam): İbn Teymiyye ve İbn Batta'nın sözleri", "paras": [{"reader": false, "ar": [[324.0, "فقال ابن تيمية: إنّ دعاء الصفة كفرٌ،"], [328.9, "أي بهذا المعنى؛ أي:"], [331.5, "من استشعر دعاءَ الصفة منفصلةً عن موصوفها."], [335.0, "ولذلك نقل ابن تيمية رحمه الله تعالى اتّفاقَ العلماء على أنّ دعاء صفاته وكلماته كفر،"], [343.7, "حيث قال رحمه الله:"], [346.0, "«وأمّا دعاءُ صفاته وكلماته فكفرٌ باتّفاق المسلمين؛ فهل يقول مسلمٌ: يا كلامَ الله، اغفر لي وارحمني وأغثني أو أعنّي؟ أو: يا علمَ الله، أو: يا قدرةَ الله، أو: يا عزّةَ الله، أو: يا عظمةَ الله، ونحو ذلك؟ أو سُمع من مسلمٍ أو كافرٍ أنه دعا ذلك من صفات الله وصفات غيره، أو يُطلب من الصفة جلبُ منفعةٍ أو دفعُ مضرّةٍ أو إعانةٌ أو نصرٌ أو إغاثةٌ أو غيرُ ذلك؟»."], [383.0, "انتهى كلامه رحمه الله."]], "tr": [[324.0, "İbn Teymiyye \"sıfata dua etmek küfürdür\" demiştir;"], [326.1, "yani bu manada; yani sıfata, sahibinden ayrı olduğunu hissederek dua eden kimse."], [331.0, "Bu sebeple İbn Teymiyye —Allah ona rahmet etsin— O'nun sıfatlarına ve kelimelerine dua etmenin küfür olduğuna dair âlimlerin ittifakını nakletmiştir."], [335.0, "Şöyle demiştir —Allah ona rahmet etsin—:"], [338.5, "\"O'nun sıfatlarına ve kelimelerine dua etmeye gelince, bu, Müslümanların ittifakıyla küfürdür."], [346.0, "Hiçbir Müslüman 'Ey Allah'ın kelâmı, beni bağışla, bana rahmet et, bana imdat et veya bana yardım et!' der mi?"], [360.0, "Veya 'Ey Allah'ın ilmi!', 'Ey Allah'ın kudreti!', 'Ey Allah'ın izzeti!', 'Ey Allah'ın azameti!' ve benzerini der mi?"], [371.0, "Veya bir Müslümandan ya da kâfirden, Allah'ın sıfatlarından veya başkasının sıfatlarından böyle bir şeye dua ettiği;"], [383.0, "ya da sıfattan bir menfaat getirmesinin, bir zararı defetmesinin, yardımın, zaferin, imdadın veya başka bir şeyin istendiği işitilmiş midir?\" —Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[385.0, "فأنتم ترون أنه يتكلّم عمّا يعتقده النصارى في عيسى عليه الصلاة والسلام."], [391.0, "ولو رجعتم إلى أصل ما نُقل منه هذا الكلام لتبيّن لكم أنّ ابن تيمية إنما يتكلّم عن دعاء الصفة مستشعرًا داعيها انفصالَها عن الذات."], [409.0, "وأمّا إذا دعا الإنسانُ الصفةَ مستشعرًا موصوفَها لا عينَها ولا ذاتَها،"], [415.0, "وهو يعلم أنّ رحمة الله بعينها لا تملك استجابته،"], [420.0, "وأنّ عزّة الله لا تملك عزّته،"], [422.0, "وإنما الذي يملكه ذلك هو من؟"], [424.7, "هو العزيز الرحيم؛ فحينئذٍ لا جرم أننا نُخطّئه في دعائه للصفة،"], [431.3, "ونحرّم عليه هذا اللفظ،"], [434.0, "وننبّهه ونبيّن له ألّا يعود لمثله مرّةً أخرى."]], "tr": [[385.0, "Görüyorsunuz ki o, Hristiyanların İsa —aleyhissalâtü vesselâm— hakkındaki inançlarından bahsediyor."], [391.0, "Bu sözün nakledildiği asıl yere dönerseniz, İbn Teymiyye'nin ancak dua edenin sıfatın zâttan ayrı olduğunu hissederek sıfata dua etmesinden bahsettiği size açıkça görünür."], [409.0, "İnsan ise sıfata, onun bizzat kendisini ve zâtını değil de sahibini düşünerek dua ederse;"], [415.6, "Allah'ın rahmetinin bizzat kendisinin onun duasına icabet etmeye sahip olmadığını, Allah'ın izzetinin onun izzetine sahip olmadığını, buna sahip olanın kim olduğunu —Azîz ve Rahîm olanın— bilirse;"], [426.0, "işte o zaman şüphesiz onu sıfata duasında hatalı buluruz, bu lafzı ona haram kılarız, onu uyarır ve benzerine bir daha dönmemesini ona açıklarız."]]}, {"reader": false, "ar": [[438.0, "ولكن لا يجوز لنا أن نُخرجه عن دائرة الإسلام؛"], [441.9, "لأنه وإن كان ظاهرُ كلامه دعاءَ الصفة،"], [445.0, "إلا أنه يريد به دعاءَ الموصوف."], [448.0, "لعلّكم فرّقتم بين الأمرين."], [450.0, "وقال الإمام ابن بطّة رحمه الله تعالى:"], [454.0, "«ولا يقال: إنّ عزّة الله هي الله، ولو جاز ذلك لكانت رغبةُ الراغبين ومسألةُ السائلين أن يقولوا: يا عزّةَ الله عافينا، ويا عزّةَ الله أغنينا. ولا يقال: عزّةُ الله غيرُ الله، ولكن يقال: عزّةُ الله صفةٌ لله، لم يزل ولا يزال اللهُ بصفاته واحدًا. وكذلك علمُ الله، وحكمةُ الله، وقدرةُ الله، وجميعُ صفات الله تعالى، وكذلك كلامُ الله عز وجل. فتفهّموا رحمكم الله؛ فإنّ الله لم يزل بصفاته العليا وأسمائه الحسنى عزيزًا قديرًا عليمًا حكيمًا ملِكًا متكلّمًا قويًّا جبّارًا»."], [499.0, "انتهى كلامه رحمه الله."]], "tr": [[438.0, "Fakat onu İslâm dairesinden çıkarmamız caiz değildir."], [439.3, "Çünkü sözünün zahiri sıfata dua etmek olsa da onunla sıfatın sahibine dua etmeyi kastetmektedir."], [441.9, "Umarım iki hususun arasını ayırt etmişsinizdir."], [443.2, "İmam İbn Batta —Allah ona rahmet etsin— şöyle demiştir:"], [446.0, "\"'Allah'ın izzeti Allah'ın kendisidir' denmez."], [448.0, "Eğer bu caiz olsaydı, rağbet edenlerin rağbeti ve isteyenlerin isteği 'Ey Allah'ın izzeti, bize afiyet ver;"], [449.0, "ey Allah'ın izzeti, bizi zengin kıl!' demek olurdu."], [450.0, "'Allah'ın izzeti Allah'tan başkadır' da denmez."], [451.7, "Fakat 'Allah'ın izzeti Allah'ın bir sıfatıdır' denir."], [454.0, "Allah, sıfatlarıyla birlikte bir olarak ezelden beri vardır ve ebediyen öyle kalacaktır."], [471.0, "Allah'ın ilmi, Allah'ın hikmeti, Allah'ın kudreti ve Allah Teâlâ'nın bütün sıfatları da böyledir;"], [485.9, "Allah Azze ve Celle'nin kelâmı da böyledir."], [499.0, "Bunu iyi anlayın —Allah size rahmet etsin—;"], [499.6, "çünkü Allah yüce sıfatları ve güzel isimleriyle ezelden beri Azîz, Kadîr, Alîm, Hakîm, Melik, Mütekellim, Kavî ve Cebbâr'dır.\" —Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[501.0, "والخلاصة منه: أنه حرّم دعاءَ الصفة،"], [506.0, "وبيّن هذا التحريم أنه منصبٌّ على ما إذا اعتقد الإنسانُ أنّ عزّة الله غيرُ الله."], [515.0, "فمتى ما دعا الإنسانُ شيئًا من صفات الله عز وجل مستشعرًا انفصالَها عن الموصوف بها،"], [524.0, "فإنّ هذا هو الذي تصدق عليه هذه الكلّيّة."], [528.0, "والخلاصة من ذلك: أنّ الداعي إذا دعا هذه الصفةَ على أنها هي نفسُها من يتوجّه إليها قلبُه،"], [536.0, "مستشعرًا انفصالَها عن موصوفها،"], [539.0, "كأن يقول: يا لطفَ الله،"], [542.0, "مستشعرًا انفصالَ اللطف عن اللطيف،"], [544.0, "أو يقول: يا رحمةَ الله،"], [547.0, "مستشعرًا انفصالَ الرحمة عن الرحيم،"], [549.0, "ونحو هذا؛ فهذا هو الذي يسمّيه العلماءُ بدعاء الصفة،"], [553.7, "وهو الذي يحكم عليه العلماءُ بأنه من الشرك الأكبر،"], [558.0, "أو الكفر الأكبر المُخرِج عن الملّة بالكلّيّة."], [561.0, "والله أعلم. فهمتم هذا إن شاء الله؟"]], "tr": [[501.0, "Bundan çıkan sonuç şudur: O, sıfata dua etmeyi haram kılmış ve bu haramlığın, insanın Allah'ın izzetinin Allah'tan başka olduğuna inanması hâline yönelik olduğunu açıklamıştır."], [515.0, "İnsan ne zaman Allah Azze ve Celle'nin sıfatlarından birine, onun sahibinden ayrı olduğunu hissederek dua ederse, işte bu külliyenin doğru olarak tatbik edildiği hâl budur."], [529.4, "Bundan çıkan sonuç şudur: Dua eden, bu sıfata, kalbinin yöneldiği şeyin bizzat o sıfat olduğu düşüncesiyle, sıfatın sahibinden ayrı olduğunu hissederek dua ederse —meselâ lutfun Latîf'ten ayrı olduğunu hissederek \"Ey Allah'ın lutfu!\" demesi veya rahmetin Rahîm'den ayrı olduğunu hissederek \"Ey Allah'ın rahmeti!\" demesi ve benzeri gibi—, işte âlimlerin \"sıfata dua\" diye isimlendirdiği budur;"], [551.0, "âlimlerin şirk-i ekber veya insanı dinden tamamen çıkaran küfr-i ekber olduğuna hükmettiği de budur."], [561.0, "Allah en iyisini bilir. Bunu anladınız inşallah?"]]}]}, {"ts": "09:24", "title": "2. Külliye: Bütün sıfatlarla tevessül edilir · 3. Külliye: Bütün sıfatlarla istiâze edilir", "paras": [{"reader": false, "ar": [[564.0, "الكلّيّة الثانية: <b>كلُّ الصفات فيُتوسَّل بها.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ الصفات فيُتوسَّل بها.<\/b> وهذا بإجماع أهل السنة والجماعة؛"], [584.0, "فإنّ من جملة ما أجاز أهلُ السنة والجماعة التوسّلَ إلى الله عز وجل به:"], [590.2, "أن يُتوسَّل إليه بصفاته."], [592.0, "وهذا الجواز عامٌّ في كلّ صفاته،"], [596.0, "سواءٌ أكانت ذاتيّةً أو فعليّةً،"], [599.3, "أو كانت من صفات المعاني."], [605.0, "فكلُّ ما ثبت به الدليلُ على أنه صفةٌ من صفات الباري عز وجل فإنه يجوز أن يُتوسَّل إلى الله عز وجل بها."]], "tr": [[564.0, "2. külliye: Bütün sıfatlarla tevessül edilir. (Tekrar ediyor.) 2."], [572.0, "külliye: Bütün sıfatlarla tevessül edilir. Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır."], [584.0, "Çünkü Ehl-i Sünnet ve'l-Cemaat'in, onunla Allah Azze ve Celle'ye tevessül etmeyi caiz gördüğü şeylerden biri de O'na sıfatlarıyla tevessül edilmesidir."], [592.0, "Bu cevaz, ister zâtî ister fiilî olsun, ister meânî sıfatlarından olsun, O'nun bütün sıfatlarında geneldir."], [605.0, "Bâri' Azze ve Celle'nin sıfatlarından bir sıfat olduğuna delil sabit olan her şeyle Allah Azze ve Celle'ye tevessül etmek caizdir."]]}, {"reader": false, "ar": [[613.0, "كما في «صحيح» الإمام البخاريّ من حديث جابر بن عبد الله رضي الله عنهما في دعاء الاستخارة،"], [624.0, "قال: كان النبيّ صلى الله عليه وسلم يُعلّمنا الاستخارةَ في الأمور كلّها،"], [630.0, "فكان يقول: «إذا همّ أحدُكم بالأمر فليركع ركعتين من غير الفريضة، ثم ليقل: اللهمّ إني أستخيرك بعلمك، وأستقدرك بقدرتك، وأسألك من فضلك العظيم، فإنك تعلم ولا أعلم، وتقدر ولا أقدر» الحديثَ بتمامه."], [650.0, "وهذا توسّلٌ إلى الله عز وجل بصفاته."], [653.1, "ومنه الحديث المشهور: «برحمتك أستغيث»،"], [656.4, "وهذا توسّلٌ إلى الله عز وجل بصفة الرحمة."], [662.0, "والأدلّة على ذلك كثيرة،"], [664.2, "وأظنّ أنني ذكرتُها بأدلّتها في قواعد ـ أو كلّيّات ـ باب التوسّل عند أهل السنة والجماعة."]], "tr": [[613.0, "Nitekim İmam Buhârî'nin \"Sahîh\"inde Câbir b."], [616.9, "Abdullah'ın —Allah ikisinden de razı olsun— istihare duası hakkındaki hadisinde şöyle geçer:"], [624.5, "\"Peygamber sallallâhu aleyhi ve sellem bize bütün işlerde istihareyi öğretirdi ve şöyle derdi:"], [630.9, "'Biriniz bir işe niyetlendiğinde farz dışında iki rekât kılsın, sonra şöyle desin:"], [636.7, "Allah'ım! İlminle Senden hayır istiyorum, kudretinle Senden güç istiyorum, büyük lütfundan Senden istiyorum."], [647.2, "Çünkü Sen bilirsin, ben bilmem;"], [650.0, "Sen güç yetirirsin, ben güç yetiremem.'\" —hadisin tamamı."], [653.1, "Bu, Allah Azze ve Celle'ye sıfatlarıyla tevessüldür."], [657.1, "Meşhur \"Rahmetinle imdat dilerim\" hadisi de bundandır;"], [662.0, "bu, Allah Azze ve Celle'ye rahmet sıfatıyla tevessüldür."], [664.8, "Bunun delilleri çoktur; zannederim bunları delilleriyle birlikte Ehl-i Sünnet ve'l-Cemaat nezdinde tevessül babının kaidelerinde —veya külliyelerinde— zikretmiştim."]]}, {"reader": false, "ar": [[672.0, "الكلّيّة الثالثة: <b>كلُّ الصفات يُستعاذ بها.<\/b> <b>كلُّ صفات الله عز وجل يُستعاذ بها.<\/b> <b>كلُّ صفات الله عز وجل يُستعاذ بها.<\/b> وهذا بإجماع أهل السنة والجماعة أيضًا؛"], [695.0, "فإنّ من جملة ما دلّت الأدلّةُ على جواز الاستعاذة به:"], [700.0, "الاستعاذةُ بصفاته تبارك وتعالى."], [702.0, "وعلى ذلك ما أخرجه الإمام مسلمٌ في «صحيحه» من حديث خولة بنت حكيمٍ رضي الله عنها،"], [709.0, "قالت: سمعتُ النبيّ صلى الله عليه وسلم يقول:"], [711.0, "«من نزل منزلًا فقال: أعوذ بكلمات الله التامّات من شرّ ما خلق...»."], [718.0, "فقوله: «بكلمات الله» هذا جمعٌ مضاف،"], [722.0, "والمتقرّر في القواعد أنّ الجمع المضاف يعمّ،"], [725.0, "فيدخل في ذلك الكلماتُ الكونيّةُ الصادرةُ من الله عز وجل، والكلماتُ الشرعيّة."]], "tr": [[672.0, "3. külliye: Bütün sıfatlarla istiâze edilir (sığınılır). 3."], [677.4, "külliye: Allah Azze ve Celle'nin bütün sıfatlarıyla istiâze edilir. (Tekrar ediyor.) Bu da Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır."], [695.0, "Çünkü delillerin, onunla istiâzenin caiz olduğuna delâlet ettiği şeylerden biri de O Tebâreke ve Teâlâ'nın sıfatlarıyla istiâzedir."], [700.0, "Buna delil, İmam Müslim'in \"Sahîh\"inde Havle bint Hakîm'den —Allah ondan razı olsun— rivayet ettiği hadistir."], [706.0, "Havle dedi ki: Peygamber sallallâhu aleyhi ve sellem'i şöyle derken işittim:"], [709.2, "\"Kim bir yere konaklar da 'Allah'ın tam kelimelerine, yarattığı şeylerin şerrinden sığınırım' derse...\" Onun \"Allah'ın kelimelerine\" sözü, izafet edilmiş bir cemi'dir;"], [718.0, "kaidelerde yerleşik olan şudur ki izafet edilmiş cemi' umum ifade eder."], [724.1, "Buna Allah Azze ve Celle'den sâdır olan kevnî kelimeler de şer'î kelimeler de girer."]]}, {"reader": false, "ar": [[732.0, "ويدلّ على ذلك أيضًا ما في «صحيح البخاري» من حديث ابن عبّاس رضي الله عنهما،"], [738.0, "قال: كان النبيّ صلى الله عليه وسلم يُعوِّذ الحسنَ والحسينَ رضي الله عنهما:"], [745.9, "«أُعيذكما بكلمات الله التامّة، من كلّ شيطانٍ وهامّة، ومن كلّ عينٍ لامّة»،"], [752.0, "ويقول: «إنّ أباكما إبراهيم كان يُعوِّذ بها إسماعيلَ وإسحاق»."], [757.1, "والشاهد منه: أنه استعاذ بكلمات الله التامّة."]], "tr": [[732.0, "Buna \"Sahîhu'l-Buhârî\"de İbn Abbâs'tan —Allah ikisinden de razı olsun— gelen hadis de delâlet eder."], [736.4, "İbn Abbâs dedi ki: Peygamber sallallâhu aleyhi ve sellem Hasan ile Hüseyin'i —Allah ikisinden de razı olsun— şöyle diyerek Allah'a sığındırırdı:"], [745.9, "\"Sizi Allah'ın tam kelimelerine; her şeytandan ve zehirli hayvandan ve her isabet eden gözden sığındırırım.\" Ve şöyle derdi:"], [752.6, "\"Babanız İbrâhîm de bunlarla İsmâil ve İshâk'ı sığındırırdı.\" Buradaki delil, onun Allah'ın tam kelimelerine sığınmış olmasıdır."]]}, {"reader": false, "ar": [[762.0, "وفي «الصحيح»: لمّا نزل قولُ الله عز وجل:"], [765.7, "<span class=\"ayah\">﴿قُلْ هُوَ الْقَادِرُ عَلَىٰ أَن يَبْعَثَ عَلَيْكُمْ عَذَابًا مِّن فَوْقِكُمْ﴾<\/span> <span class=\"ref\">[الأنعام: ٦٥]<\/span> قال الله ـ قال النبيّ صلى الله عليه وسلم:"], [773.1, "«أعوذ بوجهك». ثم قال تعالى:"], [775.6, "<span class=\"ayah\">﴿أَوْ مِن تَحْتِ أَرْجُلِكُمْ﴾<\/span> <span class=\"ref\">[الأنعام: ٦٥]<\/span>،"], [777.7, "فقال النبيّ صلى الله عليه وسلم:"], [780.9, "«أعوذ بوجهك» الحديثَ بتمامه."], [782.9, "والشاهد منه: أنّ النبيّ صلى الله عليه وسلم استعاذ بوجه الله،"], [787.9, "ووجهُ الله صفةٌ من صفاته الذاتيّة بالإجماع."]], "tr": [[762.0, "\"Sahîh\"te şöyle geçer: Allah Azze ve Celle'nin <span class=\"ayah\">﴿De ki: O, size üstünüzden bir azap göndermeye kâdirdir﴾<\/span> [En'âm 65] sözü indiğinde, Allah —Peygamber sallallâhu aleyhi ve sellem— \"Senin vechine sığınırım\" dedi."], [773.1, "Sonra Allah Teâlâ <span class=\"ayah\">﴿veya ayaklarınızın altından﴾<\/span> [En'âm 65] buyurdu;"], [775.6, "Peygamber sallallâhu aleyhi ve sellem yine \"Senin vechine sığınırım\" dedi —hadisin tamamı."], [782.9, "Buradaki delil, Peygamber sallallâhu aleyhi ve sellem'in Allah'ın vechine sığınmış olmasıdır;"], [787.0, "Allah'ın vechi ise icmâ ile O'nun zâtî sıfatlarından bir sıfattır."]]}, {"reader": false, "ar": [[791.0, "وكذلك أيضًا ما أخرجه الإمام مسلمٌ في «صحيحه» من حديث عثمان بن أبي العاص رضي الله عنه،"], [799.0, "قال: شكوتُ إلى النبيّ صلى الله عليه وسلم وجعًا أجده في جسدي،"], [804.0, "فقال: «ضع يدك على الذي تألّم من جسدك، وقل: بسم الله، ثلاثَ مرّات، ثم قل سبعَ مرّات: أعوذ بِـ ـ أعوذ بعزّة الله وقدرته من شرّ ما أجد وأحذر»."], [818.0, "قال: ففعلتُها، فأذهب الله عز وجل ما كان بي."], [823.0, "والأدلّة على ذلك كثيرة؛"], [825.0, "فكلُّ ما ثبت لله عز وجل من صفاتٍ ذاتيّةٍ أو فعليّةٍ فإنه يجوز أن يستعيذ العبدُ بها."]], "tr": [[791.0, "Yine İmam Müslim'in \"Sahîh\"inde Osmân b."], [794.0, "Ebi'l-Âs'tan —Allah ondan razı olsun— rivayet ettiği hadis de böyledir."], [799.4, "Osmân dedi ki: Peygamber sallallâhu aleyhi ve sellem'e bedenimde hissettiğim bir ağrıdan şikâyet ettim."], [804.4, "Bana şöyle buyurdu: \"Elini bedeninin ağrıyan yerine koy ve üç kez 'Bismillâh' de;"], [808.8, "sonra yedi kez 'Hissettiğim ve çekindiğim şeyin şerrinden Allah'ın izzetine ve kudretine sığınırım' de.\" Osmân dedi ki:"], [818.0, "Bunu yaptım, Allah Azze ve Celle bende olanı giderdi."], [823.0, "Bunun delilleri çoktur. Allah Azze ve Celle için sabit olan zâtî veya fiilî her sıfatla kulun istiâze etmesi caizdir."]]}]}, {"ts": "13:53", "title": "4. Külliye: Allah'ın bütün sıfatlarıyla yemin etmek caizdir", "paras": [{"reader": false, "ar": [[833.0, "ومن الكلّيّات أيضًا: <b>كلُّ صفات الله عز وجل يجوز الحلفُ بها.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ صفات الله عز وجل يجوز الحلفُ بها.<\/b> أقول وبالله التوفيق:"], [854.1, "وهذا بإجماع أهل السنة والجماعة أيضًا،"], [859.0, "كما دلّت على ذلك الأدلّةُ الصحيحةُ الصريحة."], [862.0, "وقد قلتُ لكم سابقًا:"], [864.0, "إنه لا يجوز الحلفُ إلا بثلاثة أشياء فقط،"], [868.0, "بثلاثة أشياء فقط: الأول:"], [870.6, "بأسماء الله عز وجل."], [873.0, "والثاني: بصفات الله تبارك وتعالى مطلقًا،"], [878.0, "سواءٌ أكانت من الصفات الذاتيّة أو الصفات الفعليّة."], [882.0, "والثالث: أن يُحلَف بالخبريّة المتمحِّضة في الدلالة على الله عز وجل؛"], [888.1, "كقولنا: «والذي نفسي بيده»،"], [890.7, "وقولهم: «ومقلّبِ القلوب»، أو «ومُجري السحاب، ومُنزلِ الكتاب، وسريعِ الحساب»؛"], [899.0, "فإنها خبريّةٌ متمحِّضةٌ في الدلالة على الله عز وجل."]], "tr": [[833.0, "Külliyelerden biri de şudur: 4."], [836.0, "külliye: Allah Azze ve Celle'nin bütün sıfatlarıyla yemin etmek caizdir.<b> (Tekrar ediyor.) <\/b>4."], [845.0, "külliye: Allah Azze ve Celle'nin bütün sıfatlarıyla yemin etmek caizdir. Tevfik Allah'tandır, derim ki:"], [854.1, "Bu da sahih ve sarih delillerin delâlet ettiği üzere Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır."], [864.0, "Size daha önce yeminin yalnızca üç şeyle caiz olduğunu söylemiştim;"], [868.0, "yalnızca üç şeyle: Birincisi, Allah Azze ve Celle'nin isimleriyle."], [873.0, "İkincisi, ister zâtî ister fiilî sıfatlardan olsun, mutlak olarak Allah Tebâreke ve Teâlâ'nın sıfatlarıyla."], [882.0, "Üçüncüsü, yalnızca Allah Azze ve Celle'ye delâlet eden haberî ifadelerle yemin edilmesidir."], [888.1, "\"Canım kudret elinde olana yemin olsun ki\" sözümüz ve \"Kalpleri evirip çevirene andolsun\" veya \"Bulutları yürütene, Kitab'ı indirene, hesabı çabuk görene andolsun\" sözleri gibi."], [899.0, "Bunlar yalnızca Allah Azze ve Celle'ye delâlet eden haberî ifadelerdir."]]}, {"reader": false, "ar": [[903.0, "وعلى ذلك قولُ الله عز وجل حاكيًا عن إبليس:"], [909.1, "<span class=\"ayah\">﴿فَبِعِزَّتِكَ لَأُغْوِيَنَّهُمْ أَجْمَعِينَ﴾<\/span> <span class=\"ref\">[ص: ٨٢]<\/span>، وحديثُ أنسٍ رضي الله عنه مرفوعًا:"], [916.7, "«أنّ النار تقول: قطِ قطِ وعزّتك»،"], [921.0, "والحديث في «الصحيح». وفي «الصحيح» أيضًا من حديث أبي هريرة في آخر من يخرج من النار،"], [929.0, "قال: «وعزّتك لا أسألك غيرها» الحديثَ بتمامه."], [936.0, "وبما أنها قاعدةٌ إجماعيّة فلا يُحتاج أن نتكلّم عليها كثيرًا."]], "tr": [[903.0, "Buna delil, Allah Azze ve Celle'nin İblîs'ten naklen buyurduğu <span class=\"ayah\">﴿Senin izzetine andolsun ki onların hepsini azdıracağım﴾<\/span> [Sâd 82] sözü ve Enes'in —Allah ondan razı olsun— merfû olarak rivayet ettiği \"Cehennem 'Yeter, yeter;"], [922.0, "izzetine andolsun' der\" hadisidir; hadis \"Sahîh\"tedir."], [924.9, "Yine \"Sahîh\"te Ebû Hüreyre'nin cehennemden en son çıkacak kişi hakkındaki hadisinde o kişi \"İzzetine andolsun ki Senden bundan başkasını istemeyeceğim\" der —hadisin tamamı."], [936.0, "Bu, icmâ ile sabit bir kaide olduğu için onun üzerinde fazla konuşmaya ihtiyaç yoktur."]]}]}, {"ts": "15:42", "title": "5. Külliye: Selefin sözlerinde sıfatlardan nefyedilen her tefsirden maksat keyfiyetin tefsiridir", "paras": [{"reader": false, "ar": [[942.0, "ومن الكلّيّات أيضًا: <b>كلُّ تفسيرٍ منفيٍّ عن صفات الله في كلام السلف فالمرادُ به تفسيرُ الكيف لا المعنى.<\/b> <span class=\"q\">؟ 15:44<\/span> <span class=\"note\">(يكررها)<\/span> <b>كلُّ تفسيرٍ منفيٍّ عن صفات الله عز وجل في كلام السلف فالمرادُ به تفسيرُ الكيف.<\/b>"]], "tr": [[942.0, "Külliyelerden biri de şudur: 5."], [944.0, "külliye: Selefin sözlerinde Allah'ın sıfatlarından nefyedilen her tefsirden maksat, manasının değil keyfiyetin tefsiridir.<b> <span class=\"q\">؟<\/span> (Tekrar ediyor.) <\/b>5."], [959.9, "külliye: Selefin sözlerinde Allah Azze ve Celle'nin sıfatlarından nefyedilen her tefsirden maksat keyfiyetin tefsiridir."]]}, {"reader": false, "ar": [[982.0, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ بأنّ التفسير في صفات الله عز وجل ينقسم إلى قسمين:"], [993.0, "إلى تفسيرٍ يخصّ بيانَ المعنى باعتبار دلالة اللغة العربيّة عليه،"], [997.0, "وإلى تفسيرٍ يخصّ الصفةَ على ما هي عليه في الواقع."], [1005.0, "فمتى ما رأيتَ أحدًا من أهل السنة والجماعة يُثبت شيئًا من تفسير صفات الله عز وجل،"], [1011.3, "فاعلم أنه لا يريد إلا تفسيرَ المعاني."], [1014.0, "وقد أجمع أهلُ السنة والجماعة على أنّ معاني صفات الله عز وجل معلومةٌ،"], [1019.9, "أي: معلومةُ المعنى؛ لأنّ الله عز وجل قد خاطبنا في هذه الآيات باللسان العربيّ المبين،"], [1028.0, "فوجب علينا حملُ معاني هذه النصوص على ما هو المتقرّر في لسان العرب."]], "tr": [[982.0, "Tevfik Allah'tandır, derim ki: Bil —Allah Teâlâ sana rahmet etsin— Allah Azze ve Celle'nin sıfatları hakkında tefsir iki kısma ayrılır:"], [993.0, "Arap dilinin ona delâleti itibarıyla mananın beyanına dair tefsir ve sıfatın hakikatte olduğu hâle (keyfiyetine) dair tefsir."], [1005.0, "Ehl-i Sünnet ve'l-Cemaat'ten birinin Allah Azze ve Celle'nin sıfatlarının tefsirinden bir şeyi isbat ettiğini ne zaman görürsen, bil ki o ancak manaların tefsirini kastetmektedir."], [1014.0, "Ehl-i Sünnet ve'l-Cemaat, Allah Azze ve Celle'nin sıfatlarının manalarının bilindiği, yani manası bilinen şeyler olduğu üzerinde icmâ etmiştir."], [1020.7, "Çünkü Allah Azze ve Celle bu ayetlerde bize apaçık Arap diliyle hitap etmiştir;"], [1027.6, "bu yüzden bu nasların manalarını Arapların dilinde yerleşik olan manaya hamletmemiz vâcip olmuştur."]]}, {"reader": false, "ar": [[1035.0, "ففي قول الله عز وجل:"], [1038.1, "<span class=\"ayah\">﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٧]<\/span>، فمعنى الوجه باعتبار اللغة العربيّة:"], [1042.8, "ما تحصل به المواجهة،"], [1045.0, "ونحو ذلك من التفسيرات؛"], [1047.0, "فهذا تفسيرٌ من نفاه عن السلف فإنه كاذبٌ في هذه النسبة."], [1054.0, "وأمّا التفسير الثاني فهو تفسير الكيفيّة؛"], [1059.0, "بمعنى أن تقول: كيفيّةُ وجه الله كذا وكذا،"], [1064.0, "أو كيفيّةُ يد الله كذا وكذا،"], [1067.0, "كما وقع فيه الجهميّةُ النُّفاةُ المعطّلة؛"], [1070.0, "فإنهم لا يفهمون من صفات الله عز وجل إلا ما يفهمونه من صفات المخلوقات،"], [1079.0, "فمثّلوا أوّلًا وعطّلوا ثانيًا."]], "tr": [[1035.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rabbinin vechi bâki kalır﴾<\/span> [Rahmân 27] sözünde, Arap dili itibarıyla vechin manası, kendisiyle yüz yüze gelmenin (muvâcehenin) hâsıl olduğu şeydir;"], [1047.0, "ve benzeri tefsirler. Bu öyle bir tefsirdir ki kim onu selefe nispet etmeyip nefyederse bu nispette yalancıdır."], [1059.0, "İkinci tefsir ise keyfiyetin tefsiridir;"], [1060.9, "yani \"Allah'ın vechinin keyfiyeti şöyle şöyledir\" veya \"Allah'ın elinin keyfiyeti şöyle şöyledir\" demendir."], [1067.5, "Nefyedici, ta'tilci Cehmiyye'nin düştüğü gibi."], [1070.0, "Çünkü onlar Allah Azze ve Celle'nin sıfatlarından ancak mahlukların sıfatlarından anladıklarını anlarlar;"], [1077.1, "böylece önce temsil ettiler, sonra ta'til ettiler."]]}, {"reader": false, "ar": [[1082.0, "فتجد أنّ كثيرًا من أهل السنة والجماعة يقولون:"], [1086.5, "نُجري صفاتِ الله عز وجل من غير تفسير؛"], [1091.0, "فهنا تفسيرٌ منفيّ. فأيُّ تفسيرٍ تراه منفيًّا في كلام أهل السنة والجماعة فيما يخصّ صفات الله عز وجل،"], [1100.0, "فاعلم أنه التفسير الثاني،"], [1104.0, "أي: تفسيرُ الكيفيّة؛ فلا جرم أنّ ذلك ممّا لا يجوز مطلقًا."], [1109.0, "وأمّا تفسير المعاني فإنّ النقول عن أهل السنة والجماعة فيه متواترةٌ ولله الحمد؛"], [1116.0, "كقول أبي العالية في قول الله عز وجل:"], [1119.4, "<span class=\"ayah\">﴿ثُمَّ اسْتَوَىٰ إِلَى السَّمَاءِ﴾<\/span>:"], [1121.0, "أي ارتفع؛ وهذا تفسيرٌ،"], [1122.8, "ولكنه تفسيرٌ للمعنى لا للكيف."], [1125.0, "وكقول مجاهدٍ رحمه الله تعالى:"], [1128.0, "«استوى»: أي علا؛ فهذا تفسيرٌ،"], [1131.0, "ولكنه تفسيرٌ للمعنى وليس للكيف،"], [1134.0, "كما نصّ على ذلك الإمام ابن القيّم رحمه الله وغيرُه."]], "tr": [[1082.0, "Ehl-i Sünnet ve'l-Cemaat'ten birçoğunun \"Allah Azze ve Celle'nin sıfatlarını tefsir etmeksizin (geldiği gibi) geçiririz\" dediğini görürsün;"], [1091.0, "burada nefyedilmiş bir tefsir var."], [1094.0, "Ehl-i Sünnet ve'l-Cemaat'in sözlerinde Allah Azze ve Celle'nin sıfatlarıyla ilgili nefyedilmiş gördüğün her tefsir, bil ki ikinci tefsirdir, yani keyfiyetin tefsiridir;"], [1104.7, "şüphesiz bu mutlak olarak caiz olmayan şeylerdendir."], [1109.0, "Manaların tefsirine gelince, bu konuda Ehl-i Sünnet ve'l-Cemaat'ten gelen nakiller —hamd Allah'a— mütevatirdir."], [1116.0, "Ebü'l-Âliye'nin Allah Azze ve Celle'nin <span class=\"ayah\">﴿Sonra semaya istivâ etti﴾<\/span> sözü hakkında \"yükseldi\" demesi gibi;"], [1121.0, "bu bir tefsirdir, fakat keyfiyetin değil mananın tefsiridir."], [1125.0, "Mücâhid'in —Allah Teâlâ ona rahmet etsin— \"istivâ etti, yani yüceldi (alâ)\" demesi gibi;"], [1129.8, "bu bir tefsirdir, fakat keyfiyetin değil mananın tefsiridir;"], [1134.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— ve başkalarının açıkça belirttiği gibi."]]}, {"reader": false, "ar": [[1140.0, "فالتفسير الذي يُثبته أهلُ السنة إنما هو تفسير المعنى،"], [1147.0, "والتفسير الذي ينفيه أهلُ السنة بكلامهم إنما هو تفسير الكيف."], [1151.0, "وقد استغلّ المفوِّضةُ هذه النصوصَ التي ينفي فيها عالمٌ من علماء أهل السنة تفسيرَ الصفات،"], [1165.0, "فيقولون: هذا يدلّ على أنهم مفوِّضةٌ في المعاني،"], [1169.7, "ولا يتكلّمون في شيءٍ من معانيها؛"], [1173.2, "لأنهم ينفون تفسيرها. فتأتي هذه الكلّيّة لتردّ عليهم بأنّ مُجمَل الكلام يُحمَل على مُبيَّنه،"], [1181.9, "ومطلقَ الكلام يُحمَل على مقيَّده."], [1185.0, "ولذلك ثبت عن أهل السنة والجماعة أنهم فسّروا المعاني ونفَوا تفسيرَ الكيفيّات."]], "tr": [[1140.0, "Ehl-i Sünnet'in isbat ettiği tefsir ancak mananın tefsiridir;"], [1145.7, "Ehl-i Sünnet'in sözleriyle nefyettiği tefsir ise ancak keyfiyetin tefsiridir."], [1151.0, "Müfevvıza, Ehl-i Sünnet âlimlerinden bir âlimin sıfatların tefsirini nefyettiği bu nasları istismar etmiştir."], [1159.7, "Şöyle derler: \"Bu, onların manalarda tefvîz ehli olduğuna ve manalarından hiçbir şey hakkında konuşmadıklarına delâlet eder;"], [1173.2, "çünkü onlar sıfatların tefsirini nefyediyorlar.\" İşte bu külliye, sözün mücmelinin mübeyyenine, mutlakının da mukayyedine hamledildiğini söyleyerek onlara reddiye olarak gelir."], [1185.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat'ten, manaları tefsir ettikleri ve keyfiyetlerin tefsirini nefyettikleri sabit olmuştur."]]}]}, {"ts": "19:57", "title": "5. Külliye (devam): Tirmizî ve Ebû Ubeyd'in sözleri", "paras": [{"reader": false, "ar": [[1197.0, "ومثالٌ على ذلك قولُ الإمام الترمذيّ رحمه الله تعالى،"], [1202.7, "قال: «فتأوّلت الجهميّةُ هذه الآيات ففسّروها» ـ انتبه ـ «ففسّروها على غير ما فسّر أهلُ العلم»."], [1211.0, "يعني: أنّ الجهميّة تكلّمت في التفسير المنهيّ عنه وهو تفسير الكيفيّات،"], [1217.5, "وفسّروا صفاتِ الله عز وجل على غير ما فسّرها أهلُ العلم،"], [1224.0, "وقالوا: إنّ الله لم يخلق آدم بيده،"], [1227.0, "وقالوا: إنّ معنى اليد ها هنا القوّة؛"], [1231.0, "وهذا تحريفٌ وليس بتأويل."], [1235.0, "فأنكر الإمام الترمذيّ تأويلاتِ الجهميّة،"], [1238.0, "وسمّاها تفسيرًا بقوله: «ففسّروها»،"], [1241.0, "كما أثبت لأهل العلم تفسيرًا يخالفهم بقوله:"], [1246.0, "«على غير ما فسّر به أهلُ العلم»."]], "tr": [[1197.0, "Bunun bir örneği İmam Tirmizî'nin —Allah Teâlâ ona rahmet etsin— şu sözüdür:"], [1203.4, "\"Cehmiyye bu ayetleri te'vil etti ve onları tefsir etti\" —dikkat et— \"onları ilim ehlinin tefsir ettiğinden başka şekilde tefsir etti.\" Yani Cehmiyye yasaklanmış tefsir hakkında, yani keyfiyetlerin tefsiri hakkında konuştu ve Allah Azze ve Celle'nin sıfatlarını ilim ehlinin tefsir ettiğinden başka şekilde tefsir etti."], [1224.4, "\"Allah Âdem'i eliyle yaratmadı\" dediler ve \"Buradaki elin manası kuvvettir\" dediler;"], [1227.6, "bu tahriftir, te'vil değildir. İmam Tirmizî Cehmiyye'nin te'villerini reddetmiş ve \"onları tefsir etti\" sözüyle bunlara tefsir adını vermiştir;"], [1240.2, "nitekim \"ilim ehlinin tefsir ettiğinden başka şekilde\" sözüyle ilim ehli için de onlara muhalif bir tefsir isbat etmiştir."]]}, {"reader": false, "ar": [[1249.0, "ومثالٌ على ذلك أيضًا قولُ أبي عُبيدٍ القاسم بن سلّام رحمه الله تعالى،"], [1257.0, "قال: «هذه الأحاديث صحاحٌ، حملها أصحابُ الحديث والفقهاءُ بعضُهم على بعض، وهي عندنا حقٌّ [لا نشكّ] فيها، ولكن إذا قيل: كيف وضع قدمه؟» ـ الآن الكلام على المعنى ولّا الكيف؟"], [1271.0, "ـ «كيف وضع قدمه؟ وكيف ضحك؟ قلنا: لا يُفسَّر هذا»."], [1277.6, "تفسيرٌ منفيٌّ في كلام أهل السنة،"], [1280.9, "أليس كذلك؟ لكنه واضحٌ في أنّ المراد به نفيُ تفسير الكيفيّة."]], "tr": [[1249.0, "Bunun bir örneği de Ebû Ubeyd el-Kâsım b."], [1254.3, "Sellâm'ın —Allah Teâlâ ona rahmet etsin— şu sözüdür:"], [1257.5, "\"Bu hadisler sahihtir; ehl-i hadis ve fakihler bunları birbirlerinden nakletmişlerdir."], [1261.9, "Bunlar bizce haktır, [onlarda şüphe etmeyiz.] Fakat 'Ayağını nasıl koydu?' denirse\" —şimdi söz manayla mı ilgili, yoksa keyfiyetle mi?— \"'Ayağını nasıl koydu?"], [1271.0, "Nasıl güldü?' (denirse), 'Bu tefsir edilmez' deriz.\" Ehl-i Sünnet'in sözünde nefyedilmiş bir tefsir, değil mi?"], [1282.0, "Fakat bundan maksadın keyfiyetin tefsirini nefyetmek olduğu açıktır."]]}, {"reader": false, "ar": [[1288.0, "فإيّاكم إذا حاجّكم أحدٌ من المفوِّضة،"], [1291.6, "فجاء بمثل هذه المطلقات في نفي التفسير،"], [1295.8, "أن يغلبكم؛ فبيّنوا له وردّوا عليه بأنّ المقصود من نفي التفسير إنما هو نفيُ تفسير الكيفيّات،"], [1303.0, "أو نفيُ تفاسير الجهميّة من أهل البدع."], [1306.0, "ففي هذا النصّ منع الإمامُ أبو عبيدٍ القاسمُ بن سلّام من تفسير هذه الصفات؛"], [1314.1, "لأنها تفسيرٌ للكيفيّات وليس للمعاني."]], "tr": [[1288.0, "Müfevvıza'dan biri sizinle tartışır da tefsirin nefyi hususunda bu gibi mutlak ifadeleri getirirse, sakın sizi yenmesin!"], [1297.0, "Ona açıklayın ve tefsirin nefyinden maksadın ancak keyfiyetlerin tefsirinin nefyi veya bid'at ehlinden Cehmiyye'nin tefsirlerinin nefyi olduğunu söyleyerek ona reddiye yapın."], [1306.0, "Bu nasta İmam Ebû Ubeyd el-Kâsım b."], [1310.1, "Sellâm bu sıfatların tefsirini men etmiştir;"], [1314.1, "çünkü bu, manaların değil keyfiyetlerin tefsiridir."]]}, {"reader": false, "ar": [[1317.0, "وقال الإمام أبو عبيدٍ أيضًا في حديث النبيّ صلى الله عليه وسلم حين سأله أبو رَزينٍ العُقيليّ:"], [1327.0, "«أين كان ربُّنا قبل أن يخلق السماوات والأرض؟ فقال: كان في عَماءٍ، تحتَه هواءٌ وفوقَه هواء»،"], [1334.8, "قال: «قوله: في عماء: في كلام العرب السحابُ الأبيض، وإنما تأوّلنا هذا الحديث على كلام العرب المعقول عندهم» ـ هذا تفسيرٌ للمعنى ولّا للكيف؟"], [1347.0, "للمعنى، الآن، ماشي ـ قال:"], [1348.7, "«ولا ندري كيف كان ذلك، فنُمِرُّه ولا نفسّره»."]], "tr": [[1317.0, "İmam Ebû Ubeyd, Ebû Rezîn el-Ukaylî'nin Peygamber sallallâhu aleyhi ve sellem'e \"Rabbimiz gökleri ve yeri yaratmadan önce neredeydi?\" diye sorduğu, onun da \"Altında hava, üstünde hava olan bir amâ' içindeydi\" buyurduğu hadis hakkında da şöyle demiştir:"], [1335.0, "\"Onun 'amâ' içinde' sözü: (amâ') Arapların dilinde beyaz buluttur."], [1338.8, "Biz bu hadisi ancak Arapların kendi aralarında makul olan dili üzere te'vil ettik\" —bu mananın tefsiri mi, yoksa keyfiyetin mi?"], [1347.0, "Mananın, şimdi; tamam— \"Bunun nasıl olduğunu bilmeyiz;"], [1350.1, "onu (geldiği gibi) geçiririz ve tefsir etmeyiz.\""]]}, {"reader": false, "ar": [[1356.0, "فأنتم ترون أنّ أبا عبيدٍ رحمه الله تعالى فسّر الحديثَ على لغة العرب،"], [1362.0, "ثم منع من تفسير النصوص."], [1365.0, "وهناك نصوصٌ [كثيرة] جدًّا نقلتُها لكم،"], [1373.0, "لكن لا أريد الإطالةَ عليه."], [1376.0, "فجميعُ التفسير المنفيّ على لسان أحدٍ من أهل السنة والجماعة فإنما المرادُ به تفسيرُ الكيف وليس تفسيرَ المعنى."]], "tr": [[1356.0, "Görüyorsunuz ki Ebû Ubeyd —Allah Teâlâ ona rahmet etsin— hadisi Arap diline göre tefsir etmiş, sonra nasların tefsirini men etmiştir."], [1365.0, "Size naklettiğim daha pek çok nas var, fakat bu konuda sözü uzatmak istemiyorum."], [1378.1, "Ehl-i Sünnet ve'l-Cemaat'ten birinin dilinde nefyedilen tefsirin tamamından maksat, mananın değil ancak keyfiyetin tefsiridir."]]}]}, {"ts": "23:11", "title": "6. Külliye: Selefin sözlerinde nefyedilen her manadan maksat bâtıl mananın veya tekyîf manasının nefyidir", "paras": [{"reader": false, "ar": [[1391.0, "ويؤكّد ذلك الكلّيّةُ التي بعدها:"], [1394.0, "كلُّ معنًى منفيٍّ في كلام السلف عن صفات الله <span class=\"note\">(يكررها)<\/span> فالمرادُ به نفيُ المعنى الباطل،"], [1416.0, "أو المعنى بمعنى التكييف.<b> <span class=\"note\">(يكررها)<\/span> <\/b>كلُّ معنًى منفيٍّ في كلام السلف عن صفات الله عز وجل فالمرادُ به نفيُ المعنى الباطل،"], [1435.0, "أو نفيُ المعنى المرادِ به التكييف."]], "tr": [[1391.0, "Bunu, ondan sonraki külliye te'kid eder:"], [1394.0, "6. külliye: Selefin sözlerinde Allah'ın sıfatlarından nefyedilen her mana (tekrar ediyor) ondan maksat, bâtıl mananın veya tekyîf manasındaki mananın nefyidir. (Tekrar ediyor.) 6."], [1424.8, "külliye: Selefin sözlerinde Allah Azze ve Celle'nin sıfatlarından nefyedilen her manadan maksat, bâtıl mananın nefyi veya kendisiyle tekyîf kastedilen mananın nefyidir."]]}, {"reader": false, "ar": [[1440.0, "أقول وبالله التوفيق: قوله:"], [1445.0, "«أو المعنى المراد به التكييف»؛"], [1448.0, "ذلك لأنّ بعض أهل السنة والجماعة يُطلق على الكيف لفظَ المعنى."], [1455.0, "وهذه الكلّيّة تدلّ على أنك متى ما مررتَ على شيءٍ من كلام سنّيٍّ من علماء أهل السنة والجماعة ينفي فيه معانيَ الصفات،"], [1478.0, "فإيّاك أن تحمله على نفي المعنى الحقّ الذي تدلّ عليه لغةُ العرب،"], [1484.0, "وإنما تحمله مباشرةً على محملين:"], [1487.0, "المحمل الأول: أنه ينفي المعنى الذي ابتكرته الجهميّةُ النُّفاةُ المعطّلة،"], [1494.0, "وجعلوه هو ظاهرَ نصوص الصفات."], [1497.0, "والمحمل الثاني: أنه ينفي المعنى بمعنى التكييف؛"], [1505.0, "لأنّ بعض علماء أهل السنة يَصِفون الكيفَ ـ أو يُسمّون الكيفَ ـ بالمعنى."]], "tr": [[1440.0, "Tevfik Allah'tandır, derim ki: \"Veya kendisiyle tekyîf kastedilen mana\" sözü şundandır:"], [1448.0, "Ehl-i Sünnet ve'l-Cemaat'ten bazıları keyfiyete \"mana\" lafzını verir."], [1455.0, "Bu külliye şuna delâlet eder:"], [1458.6, "Ehl-i Sünnet ve'l-Cemaat âlimlerinden Sünnî bir âlimin, içinde sıfatların manalarını nefyettiği bir sözüne ne zaman rastlarsan, sakın onu Arap dilinin delâlet ettiği hak mananın nefyine hamletme!"], [1482.5, "Bilakis onu doğrudan iki hamil yönünden birine hamlet:"], [1487.0, "Birinci hamil yönü: Onun, nefyedici, ta'tilci Cehmiyye'nin icat ettiği ve sıfat naslarının zahiri saydığı manayı nefyetmesidir."], [1497.0, "İkinci hamil yönü: Onun tekyîf manasındaki manayı nefyetmesidir;"], [1505.0, "çünkü Ehl-i Sünnet âlimlerinden bazıları keyfiyeti \"mana\" ile niteler —veya keyfiyete \"mana\" adını verir."]]}, {"reader": false, "ar": [[1513.0, "كقول الإمام أحمد رحمه الله تعالى:"], [1518.0, "«نؤمن بآيات الصفات، لا كيف ولا معنى»؛"], [1525.0, "فهذا معنًى منفيٌّ في كلام الإمام أحمد رحمه الله تعالى،"], [1529.9, "فلا بدّ أن نحمله على أحد المحملين."], [1533.0, "والإمام أحمد رحمه الله تعالى إنما يريد نفيَ المعنى الذي ابتكرته الجهميّةُ النُّفاةُ المعطّلة؛"], [1543.0, "فإنهم فهموا من ظواهر نصوص صفات الله عز وجل ما يفهمونه تمامًا من صفات البشر،"], [1551.0, "فقال الإمام أحمد بأنّ هذا المعنى الذي تفهمونه من ظواهر نصوص الصفات ليس هو المعنى المراد."]], "tr": [[1513.0, "İmam Ahmed'in —Allah Teâlâ ona rahmet etsin— \"Sıfat ayetlerine iman ederiz;"], [1518.0, "keyfiyet de yok, mana da yok\" sözü gibi."], [1525.0, "Bu, İmam Ahmed'in —Allah Teâlâ ona rahmet etsin— sözünde nefyedilmiş bir manadır;"], [1529.9, "onu iki hamil yönünden birine hamletmemiz gerekir."], [1533.0, "İmam Ahmed —Allah Teâlâ ona rahmet etsin— ancak nefyedici, ta'tilci Cehmiyye'nin icat ettiği manayı nefyetmeyi kastediyor."], [1543.0, "Çünkü onlar Allah Azze ve Celle'nin sıfat naslarının zahirlerinden tıpatıp insanların sıfatlarından anladıklarını anladılar."], [1551.0, "İmam Ahmed de \"Sıfat naslarının zahirlerinden anladığınız bu mana, murad edilen mana değildir\" dedi."]]}, {"reader": false, "ar": [[1558.0, "وكقول الإمام إسحاق بن راهويه رحمه الله تعالى:"], [1567.0, "«فأمّا أن يُدرك أحدٌ من بني آدم معنى تلك الصفات فلا يدركه أحد»؛"], [1577.0, "فهنا أطلق المعنى وأراد به الكيف."], [1583.0, "وأنتم ترون أنني مثّلتُ بكلام الإمام أحمد على المحمل الأول،"], [1589.0, "ومثّلتُ بكلام الإمام إسحاق على المحمل الثاني."], [1593.0, "ولو تأمّلتم كلامَ أهل السنة لوجدتم بعضَهم ينفون المعنى على ما نفاه الإمام أحمد،"], [1601.0, "أي: المعنى الذي ابتكرته الجهميّة،"], [1603.0, "وبعضُ أهل السنة ينفي المعنى على ما نفاه الإمام إسحاق،"], [1608.0, "ممّن يُسمّون الكيفَ بالمعنى."]], "tr": [[1558.0, "İmam İshâk b. Râhûye'nin —Allah Teâlâ ona rahmet etsin— şu sözü gibi:"], [1567.0, "\"Âdemoğullarından birinin o sıfatların manasını idrak etmesine gelince, onu hiç kimse idrak edemez.\" Burada \"mana\"yı mutlak olarak söylemiş ve onunla keyfiyeti kastetmiştir."], [1583.0, "Görüyorsunuz ki İmam Ahmed'in sözünü birinci hamil yönüne, İmam İshâk'ın sözünü de ikinci hamil yönüne örnek verdim."], [1593.0, "Ehl-i Sünnet'in sözlerini düşünürseniz, bazılarının manayı İmam Ahmed'in nefyettiği şekilde, yani Cehmiyye'nin icat ettiği mana olarak nefyettiğini;"], [1601.4, "Ehl-i Sünnet'ten bazılarının da —keyfiyete \"mana\" adını verenlerden olarak— manayı İmam İshâk'ın nefyettiği şekilde nefyettiğini görürsünüz."]]}]}, {"ts": "26:52", "title": "6. Külliye (devam): İbn Kudâme'nin «Lum'atü'l-İ'tikâd»daki sözü ve üç hamil yönü", "paras": [{"reader": false, "ar": [[1612.0, "وكذلك قولُ الإمام ابن قدامة رحمه الله في «لمعة الاعتقاد»،"], [1620.0, "وهو من أعظم من يتّكئ عليه المفوِّضةُ في هذا الزمان؛"], [1627.0, "لأنّ كلامه في مسألة التفويض محتملٌ لهذا ولهذا."], [1632.6, "لكن نحن ـ معاشرَ أهل السنة والجماعة ـ بهذه الكلّيّة نُغلق عليهم بابَ الاستدلال بكلام أيّ إمامٍ ينفي المعنى."], [1645.0, "قال رحمه الله تعالى في «لمعة الاعتقاد»:"], [1650.0, "«وما أشكل من ذلك وجب إثباتُه لفظًا، وتركُ التعرّض لمعناه»؛"], [1657.0, "يعني: لكيفيّته، يعني: لكيفيّته،"], [1663.3, "أو ألّا نُحمّله معنًى لا يدلّ عليه ظاهرُ اللفظ كما فعلت الجهميّةُ النُّفاة."], [1673.0, "فكلامُ الأئمّة هنا لا بدّ أن يُحمَل على أحد المحملين، لا ثالثَ لهما."]], "tr": [[1612.0, "İmam İbn Kudâme'nin —Allah ona rahmet etsin— \"Lum'atü'l-İ'tikâd\"daki sözü de böyledir."], [1620.7, "O, bu zamanda Müfevvıza'nın en çok dayandığı kişilerdendir;"], [1627.0, "çünkü onun tefvîz meselesindeki sözü hem buna hem şuna ihtimallidir."], [1632.6, "Fakat biz Ehl-i Sünnet ve'l-Cemaat topluluğu, bu külliye ile manayı nefyeden herhangi bir imamın sözüyle istidlal kapısını onlara kapatırız."], [1645.0, "O —Allah Teâlâ ona rahmet etsin— \"Lum'atü'l-İ'tikâd\"da şöyle demiştir:"], [1650.0, "\"Bunlardan müşkil olanın lafzen isbatı ve manasına dokunmamak vâcip olur.\" Yani keyfiyetine;"], [1662.7, "yani keyfiyetine; veya Cehmiyye nüfâtın yaptığı gibi ona lafzın zahirinin delâlet etmediği bir manayı yüklememek."], [1673.0, "Burada imamların sözü mutlaka iki hamil yönünden birine hamledilmelidir; üçüncüsü yoktur."]]}, {"reader": false, "ar": [[1681.0, "فمتى ما رأيتَ عالمًا من علماء أهل السنة ينفي معانيَ صفات الله عز وجل،"], [1688.0, "فإيّاك أن تحمله على نفي المعنى الذي هو أصلُ مدلول الكلمة باعتبار لغة العرب،"], [1694.0, "وإنما تحمله على أنه إنما أراد نفيَ المعنى الذي فهمه أهلُ البدع من ظواهر نصوص الصفات،"], [1703.0, "أو أنه ينفي المعنى وهو يريد نفيَ الكيفيّة."]], "tr": [[1681.0, "Ehl-i Sünnet âlimlerinden bir âlimin Allah Azze ve Celle'nin sıfatlarının manalarını nefyettiğini ne zaman görürsen, sakın onu Arap dili itibarıyla kelimenin asıl medlûlü olan mananın nefyine hamletme!"], [1695.7, "Bilakis onu, bid'at ehlinin sıfat naslarının zahirlerinden anladığı manayı nefyetmeyi kastettiğine veya manayı nefyederken keyfiyetin nefyini kastettiğine hamlet."]]}, {"reader": false, "ar": [[1709.0, "فصارت المحامل ثلاثة: محملان مقبولان،"], [1716.7, "ومحملٌ فاسد. أمّا المحمل المقبول:"], [1721.5, "فأن نحمل كلامهم في نفي المعنى على نفي الكيفيّة."], [1726.0, "والمحمل الثاني: أن نحمل كلامهم في نفي المعنى على ما قالته ـ أو كذبت به ـ الجهميّة."], [1737.0, "والثالث: أن نحمل كلامهم على نفي أصل مدلول اللغة العربيّة؛"], [1742.0, "فهذا هو المحمل الباطل الذي أبى أهلُ السنة أن يقبلوه."]], "tr": [[1709.0, "Böylece hamil yönleri üç oldu:"], [1715.0, "Kabul edilen iki hamil yönü ve bir fâsit hamil yönü."], [1721.5, "Kabul edilen hamil yönü: Onların manayı nefyetme hususundaki sözlerini keyfiyetin nefyine hamletmemizdir."], [1727.3, "İkinci hamil yönü: Onların manayı nefyetme hususundaki sözlerini Cehmiyye'nin söylediği —veya uydurduğu— manaya hamletmemizdir."], [1737.0, "Üçüncüsü: Onların sözlerini Arap dilinin asıl medlûlünün nefyine hamletmemizdir;"], [1742.0, "işte bu, Ehl-i Sünnet'in kabul etmekten kaçındığı bâtıl hamil yönüdür."]]}, {"reader": false, "ar": [[1749.5, "ومهما جاء المفوِّضةُ بكلام أيّ إمامٍ من أئمّة أهل السنة المعتبَرين في إمامتهم ينفي شيئًا من المعاني،"], [1763.0, "فإننا لا بدّ أن نحمل كلامه على ما يُصحّح مذهبيّتَه السنّيّة السلفيّة."], [1769.0, "وإذا أشكل علينا كلامُ عالمٍ في موضع،"], [1772.0, "نظرنا إلى موضعٍ من كلامه الآخر."], [1777.0, "وإذا كان من أهل السنة والجماعة في أصوله وفصوله،"], [1782.0, "وأشكل علينا جزئيّةٌ من كلامه،"], [1785.0, "فلا جرم أننا نحمل كلامه المشكلَ الجزئيَّ على ما تقرّر من أصله المحكم الكلّيّ."], [1791.0, "وهذا من العدل، وهذا من العدل والإنصاف."]], "tr": [[1749.5, "Müfevvıza, imamlığında muteber olan Ehl-i Sünnet imamlarından herhangi birinin manalardan bir şeyi nefyeden sözünü ne zaman getirirse getirsin, onun sözünü mutlaka onun Sünnî-Selefî mezhepliğini doğrulayan manaya hamletmemiz gerekir."], [1769.0, "Bir âlimin sözü bir yerde bize müşkil gelirse, onun sözünün başka bir yerine bakarız."], [1777.6, "Usûlünde ve fürûunda Ehl-i Sünnet ve'l-Cemaat'ten olup sözünün bir cüz'î kısmı bize müşkil gelirse, şüphesiz onun cüz'î müşkil sözünü yerleşik olan muhkem küllî aslına hamlederiz."], [1791.0, "Bu adalettendir; bu adalet ve insaftandır."]]}]}, {"ts": "29:57", "title": "6. Külliye (devam): İmam Ahmed'in «لا كيف ولا معنى» sözünün sıhhati (Hanbel b. İshâk'ın teferrüdü)", "paras": [{"reader": false, "ar": [[1797.0, "فإن قلتَ: وهل صحّ الأثرُ عن الإمام أحمد أصلًا في قوله:"], [1802.5, "«لا كيف ولا معنى»؟"], [1802.6, "هل صحّ الأثرُ أصلًا عن الإمام أحمد رحمه الله في قوله:"], [1804.3, "«لا كيف ولا معنى»؟"], [1809.0, "فأقول: هذه الرواية منقولةٌ عن الإمام أحمد رحمه الله تعالى من جهتين،"], [1821.0, "كلا الجهتين فيهما رجلٌ لا يحتمل العلماءُ تفرّدَه بالرواية عن الإمام أحمد،"], [1830.0, "وقد ذكرتُه لكم سابقًا،"], [1832.2, "من هو؟ حنبلٌ رحمه الله."], [1835.0, "فإنّ هذه الرواية ممّا انفرد به عن الإمام أحمد من دون سائر أصحاب الإمام أحمد،"], [1846.0, "وأنتم تعرفون أنه لا يُحتمَل تفرّدُه."]], "tr": [[1797.0, "Eğer \"İmam Ahmed'den 'keyfiyet de yok, mana da yok' sözü hakkındaki eser aslen sahih midir?\" dersen —İmam Ahmed'den —Allah ona rahmet etsin— \"keyfiyet de yok, mana da yok\" sözü hakkındaki eser aslen sahih midir?— derim ki:"], [1804.3, "Bu rivayet İmam Ahmed'den —Allah Teâlâ ona rahmet etsin— iki yoldan nakledilmiştir."], [1815.2, "Her iki yolda da âlimlerin İmam Ahmed'den rivayette teferrüdünü (tek başına rivayet etmesini) kabul etmediği bir adam vardır."], [1833.3, "Onu size daha önce zikretmiştim;"], [1835.0, "kimdir o? Hanbel'dir —Allah ona rahmet etsin."], [1837.7, "Bu rivayet, İmam Ahmed'in diğer ashâbı arasında yalnız onun İmam Ahmed'den tek başına rivayet ettiği şeylerdendir;"], [1846.8, "siz de onun teferrüdünün kabul edilmediğini bilirsiniz."]]}, {"reader": false, "ar": [[1852.0, "فلأنه يُغرب في النقل عن الإمام أحمد،"], [1856.7, "ويروي عنه رواياتٍ لا يقبلها علماءُ المذهب،"], [1862.0, "لا بعضَ الروايات المنقولة عقديّةً ولا بعضَ الروايات المنقولة فقهيّةً."], [1866.0, "فكلُّ ما تفرّد به حنبلُ بن إسحاق رحمه الله تعالى عن الإمام أحمد فالواجبُ فيه التثبّتُ والنظرُ في أقوال أصحاب الإمام أحمد:"], [1878.0, "هل نقلوه أو لم ينقلوه."], [1880.0, "ولذلك قال الإمام الحافظ الذهبيّ رحمه الله تعالى في ترجمة حنبل،"], [1886.0, "قال: «له مسائلُ كثيرةٌ عن أحمد، ويتفرّد ويُغرب». انتهى كلامه."]], "tr": [[1852.0, "Çünkü o, İmam Ahmed'den nakilde garip rivayetler getirir ve ondan mezhep âlimlerinin kabul etmediği rivayetler nakleder;"], [1862.0, "gerek akaidle ilgili nakledilen bazı rivayetlerde gerek fıkhî nakledilen bazı rivayetlerde."], [1866.0, "Hanbel b. İshâk'ın —Allah Teâlâ ona rahmet etsin— İmam Ahmed'den tek başına rivayet ettiği her şeyde, İmam Ahmed'in ashâbının sözlerine bakmak ve onu nakledip nakletmediklerini araştırarak sağlamasını yapmak vâciptir."], [1878.0, "Bu yüzden İmam Hâfız Zehebî —Allah Teâlâ ona rahmet etsin— Hanbel'in biyografisinde şöyle demiştir:"], [1883.3, "\"Onun Ahmed'den pek çok meselesi vardır;"], [1886.6, "tek başına rivayet eder ve garip rivayetler getirir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1893.0, "وقال الإمام الحافظ ابن رجب رحمه الله:"], [1895.3, "«وهو ثقةٌ، إلا أنه يَهِم أحيانًا، وقد اختلف متقدّمو الأصحاب فيما تفرّد به حنبلٌ عن أحمد: هل تثبت به روايةٌ عنه أم لا؟»."], [1908.1, "انتهى كلامه. وقال أيضًا في موضعٍ آخر:"], [1911.0, "«كان أبو بكرٍ الخلّالُ وصاحبُه لا يُثبتان ما تفرّد به حنبلُ بن إسحاق روايةً»؛"], [1921.0, "يعني: لا يعتمدون على ما تفرّد به هذا الرجلُ عن الإمام أحمد رحمه الله تعالى."]], "tr": [[1893.0, "İmam Hâfız İbn Receb —Allah ona rahmet etsin— şöyle demiştir:"], [1895.3, "\"O sikadır (güvenilirdir); ancak bazen vehmeder (yanılır)."], [1898.5, "Ashâbın mütekaddimleri, Hanbel'in Ahmed'den tek başına rivayet ettiği şeyle ondan bir rivayetin sabit olup olmayacağı hususunda ihtilaf etmişlerdir.\" Sözü burada bitti."], [1908.1, "Yine başka bir yerde şöyle demiştir:"], [1911.0, "\"Ebû Bekir el-Hallâl ve arkadaşı, Hanbel b."], [1914.6, "İshâk'ın tek başına rivayet ettiği şeyi (İmam Ahmed'den) bir rivayet olarak sabit görmezlerdi.\" Yani bu adamın İmam Ahmed'den —Allah Teâlâ ona rahmet etsin— tek başına rivayet ettiği şeye dayanmazlardı."]]}, {"reader": false, "ar": [[1928.0, "ثم إن سلّمنا جدلًا أنها من الروايات الصحيحة عن الإمام أحمد،"], [1933.0, "فإنها رُويت من وجهٍ آخر مفسَّرةً،"], [1937.0, "فإنها رُويت من وجهٍ آخر مفسَّرةً،"], [1942.0, "وهي أنّ الإمام أحمد لا يريد به أيَّ معنًى،"], [1946.5, "وإنما المعنى الباطل، ولا يريد به المعنى الذي يُقرّه الكتابُ والسنةُ والسلفُ واللغة."], [1954.0, "كما في قوله لمّا ـ قال حنبل:"], [1959.0, "سألتُ الإمام أحمد، أي:"], [1960.7, "سألتُ أبا عبد الله عن الأحاديث التي تُروى ـ انتبهوا ـ:"], [1964.5, "أنّ الله عز وجل ينزل كلَّ ليلةٍ إلى السماء الدنيا،"], [1969.0, "وأنّ الله يُرى، وأنّ الله يضع قدمه،"], [1972.1, "وما أشبهه؟ فقال أبو عبد الله ـ انتبهوا للكلام ـ:"], [1976.0, "«نؤمن بها ونصدّق بها، ولا كيف ولا معنى، ولا نردّ منها شيئًا، ونعلم أنّ ما جاء به الرسولُ حقٌّ إذا كان بأسانيد صحيحة»."]], "tr": [[1928.0, "Sonra, tartışma uğruna bunun İmam Ahmed'den gelen sahih rivayetlerden olduğunu kabul etsek bile, bu rivayet başka bir yoldan tefsirli (açıklamalı) olarak rivayet edilmiştir;"], [1942.0, "başka bir yoldan tefsirli olarak rivayet edilmiştir."], [1945.5, "O da şudur: İmam Ahmed bununla herhangi bir manayı değil, ancak bâtıl manayı kastetmektedir;"], [1954.0, "Kitab'ın, Sünnet'in, selefin ve dilin kabul ettiği manayı kastetmemektedir."], [1959.0, "Nitekim onun şu sözünde olduğu gibi —Hanbel dedi ki:"], [1960.7, "İmam Ahmed'e, yani Ebû Abdullah'a, rivayet edilen şu hadisleri sordum— dikkat edin—:"], [1964.5, "Allah Azze ve Celle'nin her gece dünya semasına indiği, Allah'ın görüleceği, Allah'ın ayağını koyacağı ve benzerleri (hakkındaki hadisler)."], [1973.0, "Ebû Abdullah —söze dikkat edin— şöyle dedi:"], [1976.0, "\"Onlara iman ederiz ve onları tasdik ederiz;"], [1980.0, "keyfiyet de yok, mana da yok."], [1983.3, "Onlardan hiçbir şeyi reddetmeyiz. Sahih senetlerle geldiğinde, Resûl'ün getirdiğinin hak olduğunu biliriz.\""]]}, {"reader": false, "ar": [[1990.0, "«ونحمل ذلك على ما وصف الله به نفسه»؛"], [1993.0, "يعني: بمعنًى على ما تقرّر في لغة العرب."], [1997.0, "وعلى ذلك قولُهم: «أمِرّوها كما جاءت»،"], [2001.1, "وهذه النصوص إنما جاءت بالمعاني،"], [2005.0, "ولم تأتِ هكذا مفوَّضةً باعتبار المعاني،"], [2010.0, "وإنما جاءت لتقرير معانٍ صحيحة."], [2014.0, "وإن سلّمنا أنّ هذا المحمل في الرواية المفسَّرة غيرُ مقبول،"], [2021.0, "فلا جرم أننا نرجع إلى كلّيّتنا في هذين المحملين."], [2025.0, "وإنّ من يتتبّع كلامَ الإمام أحمد في إثباته لكثيرٍ من معاني صفات الله عز وجل لَيعلمُ يقينًا بأنّ المعنى الذي ينفيه في هذه الرواية بخصوصها أنه المعنى الباطل الذي ابتكرته الجهميّةُ المعطّلةُ النُّفاة."]], "tr": [[1990.0, "\"Bunu Allah'ın kendisini nitelediği şeye hamlederiz.\" Yani Arapların dilinde yerleşik olan bir mana üzere."], [1997.0, "\"Onları geldiği gibi geçirin\" sözleri de bu manadadır."], [1999.1, "Bu naslar ancak manalarla gelmiştir;"], [2002.5, "manalar itibarıyla böyle tefvîz edilmiş olarak gelmemiştir, bilakis sahih manaları yerleştirmek için gelmiştir."], [2014.0, "Tefsirli rivayetteki bu hamil yönünün kabul edilmediğini teslim etsek bile, şüphesiz bu iki hamil yönü hakkındaki külliyemize döneriz."], [2025.0, "İmam Ahmed'in Allah Azze ve Celle'nin sıfatlarının manalarının çoğunu isbat etmesine dair sözlerini takip eden kişi, onun özellikle bu rivayette nefyettiği mananın, ta'tilci nefyedici Cehmiyye'nin icat ettiği bâtıl mana olduğunu kesin olarak bilir."]]}]}, {"ts": "34:05", "title": "7. Külliye: Selefin sözlerinde nefyedilen her tekyîften maksat keyfiyet bilgisinin nefyidir", "paras": [{"reader": false, "ar": [[2045.0, "ومن الكلّيّات أيضًا: <b>كلُّ تكييفٍ منفيٍّ في كلام السلف<\/b> ـ الآن قلنا:"], [2054.4, "كلُّ تفسيرٍ منفيّ، كلُّ معنًى منفيّ؛"], [2059.0, "نريد أن نسدّ على المفوِّضة أبوابها ـ <b>كلُّ تكييفٍ منفيٍّ في كلام السلف في باب الصفات فالمرادُ به نفيُ العلم بالكيفيّة<\/b> ـ كم رقمُ القاعدة عندكم؟"], [2077.0, "ـ كلُّ تكييفٍ منفيٍّ في كلام السلف عن الصفات فالمرادُ به نفيُ العلم بالكيفيّة،"], [2085.6, "لا نفيُ أصل وجودها."]], "tr": [[2045.0, "Külliyelerden biri de şudur: 7."], [2047.1, "külliye: Selefin sözlerinde nefyedilen her tekyîf —şimdi \"nefyedilen her tefsir\", \"nefyedilen her mana\" dedik;"], [2059.0, "Müfevvıza'ya kapılarını kapatmak istiyoruz— 7."], [2061.5, "külliye: Selefin sözlerinde sıfatlar babında nefyedilen her tekyîften maksat, keyfiyet bilgisinin nefyidir<b> —sizde kaidenin numarası kaç?— <\/b>7."], [2077.0, "külliye: Selefin sözlerinde sıfatlardan nefyedilen her tekyîften maksat, keyfiyetin aslen varlığının nefyi değil, keyfiyet bilgisinin nefyidir."]]}, {"reader": false, "ar": [[2100.0, "أقول وبالله التوفيق: وهذا معنى قول أهل السنة والجماعة:"], [2104.2, "نؤمن بآيات الصفات من غير تكييف؛"], [2107.0, "أي: من غير تكييفٍ يعقله البشر،"], [2111.0, "ومن غير تكييفٍ نعلمه أو نراه."], [2115.0, "وليس المرادُ من قولهم:"], [2117.5, "«من غير تكييف» أنهم ينفون الكيفَ مطلقًا؛"], [2122.0, "فإننا ـ معاشرَ أهل السنة والجماعة ـ نؤمن بأنّ لصفات الله عز وجل كيفًا،"], [2128.0, "ولكنّ هذا الكيف لا يعلمه إلا الله تبارك وتعالى؛"], [2132.0, "فلا يعلم كيفَ الله إلا اللهُ تبارك وتعالى."]], "tr": [[2100.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat'in \"Sıfat ayetlerine tekyîf etmeksizin iman ederiz\" sözünün manası budur;"], [2107.0, "yani insanların akledebileceği bir tekyîf olmaksızın, bizim bilebileceğimiz veya görebileceğimiz bir tekyîf olmaksızın."], [2115.0, "Onların \"tekyîf etmeksizin\" sözünden maksat, keyfiyeti mutlak olarak nefyetmeleri değildir."], [2122.0, "Çünkü biz Ehl-i Sünnet ve'l-Cemaat topluluğu, Allah Azze ve Celle'nin sıfatlarının bir keyfiyeti olduğuna iman ederiz;"], [2128.4, "fakat bu keyfiyeti Allah Tebâreke ve Teâlâ'dan başkası bilmez."], [2132.0, "Allah'ın keyfiyetini Allah Tebâreke ve Teâlâ'dan başkası bilmez."]]}, {"reader": false, "ar": [[2137.0, "ويوضّح ذلك أبو العبّاس ابن تيمية رحمه الله تعالى كما في «الفتوى الحمويّة»،"], [2142.0, "قال: «فقولُ ربيعة ومالك: الاستواءُ غيرُ مجهول، والكيفُ غيرُ معقول، والإيمانُ به واجب، موافقٌ لقول الباقين: أمِرّوها كما جاءت بلا كيف؛ فإنما نفَوا علمَ الكيفيّة، ولم ينفوا حقيقةَ الصفة»."], [2160.6, "انتهى كلامه. وهو عينُ هذه الكلّيّة."]], "tr": [[2137.0, "Bunu Ebü'l-Abbâs İbn Teymiyye —Allah Teâlâ ona rahmet etsin— \"el-Fetvâ el-Hameviyye\"de açıklar."], [2142.7, "Şöyle der: \"Rebîa ve Mâlik'in 'İstivâ meçhul değildir, keyfiyeti akledilemez, ona iman vâciptir' sözü, diğerlerinin 'Onları keyfiyetsiz olarak geldiği gibi geçirin' sözüne uygundur."], [2153.9, "Onlar ancak keyfiyet bilgisini nefyetmişlerdir;"], [2157.1, "sıfatın hakikatini nefyetmemişlerdir.\" Sözü burada bitti."], [2160.6, "Bu, bu külliyenin ta kendisidir."]]}, {"reader": false, "ar": [[2165.0, "وقال أبو العبّاس ابن تيمية أيضًا في «العقيدة الواسطيّة»،"], [2170.0, "قال: «ولا يُكيّفون، ولا يُمثّلون صفاتِه بصفات خلقه؛ لأنه سبحانه لا سميَّ له، ولا كُفْءَ له، ولا ندَّ له، [ولا يُقاس] بخلقه سبحانه وتعالى»."], [2183.0, "انتهى كلامه. فالمقصود من ذلك إنما هو نفيُ العلم بالكيفيّة؛"], [2188.0, "فنحن نؤمن بأنّ لوجه الله كيفًا لا يعلمه إلا الله،"], [2196.0, "وأنّ ليد الله عز وجل كيفًا لا يعلمه إلا الله،"], [2200.1, "ولاستواء الله عز وجل كيفًا لا يعلمه إلا الله."]], "tr": [[2165.0, "Ebü'l-Abbâs İbn Teymiyye \"el-Akîdetü'l-Vâsıtıyye\"de de şöyle demiştir:"], [2167.2, "\"Tekyîf etmezler ve O'nun sıfatlarını mahlukatının sıfatlarına benzetmezler."], [2170.7, "Çünkü O Sübhânehû'nun adaşı yoktur, dengi yoktur, eşi yoktur;"], [2177.0, "[O,] mahlukatına [kıyas edilmez], Sübhânehû ve Teâlâ.\" Sözü burada bitti."], [2183.0, "Bundan maksat ancak keyfiyet bilgisinin nefyidir."], [2185.5, "Biz, Allah'ın vechinin Allah'tan başkasının bilmediği bir keyfiyeti olduğuna, Allah Azze ve Celle'nin elinin Allah'tan başkasının bilmediği bir keyfiyeti olduğuna ve Allah Azze ve Celle'nin istivâsının Allah'tan başkasının bilmediği bir keyfiyeti olduğuna iman ederiz."]]}, {"reader": false, "ar": [[2205.0, "فإن قلتَ: ولماذا لا نعلم الكيفيّة؟"], [2209.0, "فأقول: لأنّ طرق العلم بالكيفيّة ثلاثةٌ لا رابعَ لها:"], [2213.0, "إمّا أن ترى الشيءَ فتعلمَ كيفيّته بالرؤية،"], [2216.9, "وهذا منقطع. وإمّا أن ترى نظيرًا له مماثلًا،"], [2222.3, "وهذا منقطع. وإمّا أن يُخبرك الصادقُ صلى الله عليه وسلم عن كيفيّة شيءٍ من ذلك،"], [2231.0, "وهذا أيضًا منقطع. فالمنقطعُ عنا إنما هو العلمُ بهذه الكيفيّات،"], [2240.0, "مع إيماننا الكامل بأنّ لها كيفًا لا يعلمه إلا الله تبارك وتعالى. والله أعلم."]], "tr": [[2205.0, "Eğer \"Peki keyfiyeti neden bilemiyoruz?\" dersen, derim ki:"], [2209.0, "Çünkü keyfiyeti bilmenin yolları üçtür, dördüncüsü yoktur:"], [2213.0, "Ya şeyi görürsün de görmekle keyfiyetini bilirsin;"], [2215.8, "bu (yol bizim için) kapalıdır."], [2218.0, "Ya da onun benzeri olan bir naziri görürsün;"], [2226.0, "bu da kapalıdır. Ya da sâdık olan sallallâhu aleyhi ve sellem sana bundan bir şeyin keyfiyetini haber verir;"], [2233.0, "bu da kapalıdır. Bize kapalı olan ancak bu keyfiyetlerin bilgisidir;"], [2240.0, "bunların Allah Tebâreke ve Teâlâ'dan başkasının bilmediği bir keyfiyeti olduğuna dair tam imanımızla birlikte. Allah en iyisini bilir."]]}]}, {"ts": "37:28", "title": "8. Külliye: Allah'ın sıfatlarından herhangi birine mecaz sokan herkes bid'at ehlindendir", "paras": [{"reader": false, "ar": [[2248.0, "الكلّيّة الثامنة ـ وخلّوها الأخيرة،"], [2250.7, "ها؟ قولوا: الأخيرة ـ: <b>كلُّ من أقحم المجازَ في شيءٍ من صفات الله تعالى فمن أهل البدع.<\/b> أقول وبالله التوفيق:"], [2259.0, "وذلك لأنّ المتقرّر في القواعد أنْ لا مجازَ في غيب؛"], [2264.0, "فما كان من قبيل الغيب فلا حقّ لك أن تتخوّض بعقلك فيه،"], [2270.0, "فتحملَه من حقائق الكلام وظاهره إلى مجازه ومؤوَّله."], [2275.9, "ولأنّ المتقرّر في القواعد أنّ الأصل في الكلام الحقيقة،"], [2283.0, "فلا يجوز الانتقالُ من الحقائق إلى المجازات إلا بقرينةٍ ناقلة."]], "tr": [[2248.0, "<b>8. külliye<\/b> —bunu sonuncu yapın, ha?"], [2251.0, "\"Sonuncu\" deyin—: <b>8. külliye: Allah Teâlâ'nın sıfatlarından herhangi birine mecaz sokan herkes bid'at ehlindendir.<\/b> Tevfik Allah'tandır, derim ki:"], [2259.0, "Bu şundandır: Kaidelerde yerleşik olan, gaybda mecaz olmadığıdır."], [2264.0, "Gayb kabîlinden olan şeye aklınla dalmaya, onu sözün hakikatlerinden ve zahirinden mecazına ve müevveline hamletmeye hakkın yoktur."], [2275.9, "Bir de kaidelerde yerleşik olan, sözde aslın hakikat olduğudur;"], [2280.8, "nakledici (anlamı başka yöne çeviren) bir karine olmadıkça hakikatlerden mecazlara geçmek caiz değildir."]]}, {"reader": false, "ar": [[2288.0, "قال الإمام عثمان بن سعيدٍ الدارميّ رحمه الله تعالى:"], [2293.0, "«ونحن قد عرفنا بحمد الله تعالى من لغات العرب هذه المجازاتِ التي اتّخذتموها» ـ يُكلِّم الجهميّين <span class=\"q\">؟ 38:20<\/span> ـ «التي اتّخذتموها دُلْسةً وأُغلوطةً على الجهّال، تنفون بها عن الله حقائقَ الصفات بعِلَل المجازات، غيرَ أنّا نقول: لا يُحكَم للأغرب من كلام العرب على الأغلب، ولكن نصرف معانيها إلى الأغلب حتى تأتوا ببرهانٍ أنه عُنِي بها الأغرب، وهذا هو المذهب الذي إلى العدل والإنصاف أقرب، لا أن تعترض على صفات الله المعلومة بمجرّد علّة المجاز». انتهى كلامه."]], "tr": [[2288.0, "İmam Osmân b. Saîd ed-Dârimî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2288.6, "\"Allah Teâlâ'ya hamd olsun, edindiğiniz bu mecazları biz de Arapların dillerinden biliriz\" —Cehmîlere hitap ediyor <span class=\"q\">؟<\/span>— \"cahillere karşı bir hile ve aldatmaca olarak edindiğiniz, onlarla mecaz gerekçeleriyle Allah'tan sıfatların hakikatlerini nefyettiğiniz (mecazları)."], [2291.3, "Ancak biz şöyle deriz: Arapların sözünde daha garip olana, daha yaygın olana karşı hüküm verilmez;"], [2293.0, "bilakis onun daha garip olanın kastedildiğine dair bir burhan getirinceye kadar manalarını daha yaygın olana çeviririz."], [2314.1, "Adalete ve insafa daha yakın olan mezhep budur;"], [2324.4, "Allah'ın bilinen sıfatlarına sırf mecaz gerekçesiyle itiraz etmen değil.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2344.0, "وهو يُبيّن أنّ كلّ من قال بجواز دخول شيءٍ من المجاز في شيءٍ من صفات الله عز وجل فإنما هو جارٍ على سَنَن أهل البدع،"], [2357.0, "لا على سَنَن أهل السنة."], [2359.0, "وقال الإمام الحافظ الذهبيّ رحمه الله تعالى معلّقًا على بعض الكلام،"], [2365.0, "قال: «ولو كانت الصفاتُ تُرَدّ إلى المجاز لبطل أن تكون صفاتٍ لله عز وجل، وإنما الصفةُ تابعةٌ للموصوف، فهو موجودٌ حقيقةً لا مجازًا، وصفاتُه ليست مجازًا، فإذا كان لا مِثلَ له ولا نظير، لزم أن تكون لا مِثلَ لها». انتهى كلامه."]], "tr": [[2344.0, "Bu, Allah Azze ve Celle'nin sıfatlarından herhangi birine mecazdan bir şeyin girmesinin caiz olduğunu söyleyen herkesin, Ehl-i Sünnet'in yolu üzerinde değil, ancak bid'at ehlinin yolu üzerinde yürüdüğünü açıklar."], [2358.2, "İmam Hâfız Zehebî —Allah Teâlâ ona rahmet etsin— bir söz üzerine ta'liken şöyle demiştir:"], [2365.6, "\"Eğer sıfatlar mecaza döndürülseydi, Allah Azze ve Celle'nin sıfatları olmaları bâtıl olurdu."], [2371.6, "Sıfat ancak mevsufa tâbidir. O, mecazen değil hakikaten mevcuttur;"], [2377.4, "sıfatları da mecaz değildir. O'nun misli ve benzeri olmadığına göre, (sıfatlarının) da misli olmaması lâzım gelir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2388.0, "وقال الإمام أبو عمر ابن عبد البرّ القرطبيّ رحمه الله تعالى:"], [2394.0, "«أهلُ السنة مجمعون على الإقرار بالصفات الواردة كلِّها في القرآن والسنة، والإيمانِ بها» ـ انتبهوا ـ «وحملِها على الحقيقة لا على المجاز، إلا أنهم لا يُكيّفون شيئًا من ذلك، ولا يَحُدّون فيه صفةً محصورة. وأمّا أهل البدع» ـ انتبهوا ـ «وأمّا أهلُ البدع والجهميّةُ والمعتزلةُ كلُّها والخوارجُ فكلُّهم يُنكرها، ولا يحمل شيئًا منها على الحقيقة». انتهى كلامه."]], "tr": [[2388.0, "İmam Ebû Ömer İbn Abdilber el-Kurtubî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2394.0, "\"Ehl-i Sünnet, Kur'an'da ve Sünnet'te varid olan sıfatların hepsini ikrar etmek, onlara iman etmek\" —dikkat edin— \"ve onları mecaza değil hakikate hamletmek üzerinde icmâ etmiştir;"], [2404.0, "ancak onlar bunlardan hiçbir şeyi tekyîf etmezler ve onda sınırlandırılmış bir sıfat (tarif) belirlemezler."], [2410.4, "Bid'at ehline gelince\" —dikkat edin— \"bid'at ehli, Cehmiyye, Mu'tezile'nin hepsi ve Hâricîler ise hepsi onları inkâr eder ve onlardan hiçbir şeyi hakikate hamletmez.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2425.0, "فجعل من صفات أهل البدع في باب الصفات أنهم لا يحملونها على حقائقها،"], [2433.2, "وإنما لا يحملونها إلا على مجازاتها."], [2437.0, "وقلتُ لكم بأنّ دخول المجاز في شيءٍ من الغيبيّات هو طاغوتٌ وإبليسُ وشيطانٌ لا بدّ من الاستعاذة بالله منه."], [2445.0, "فكلُّ من سمح لعقله أن يتخوّض بالمجاز في الغيبيّات فإنه قد آذن على عقيدته بالفساد."], [2453.0, "وإنّ من أعظم ما أفسد العقائدَ القولَ بالمجاز في باب الغيبيّات مطلقًا،"], [2459.7, "وفي باب الصفات على وجه الخصوص."]], "tr": [[2425.0, "Böylece o, sıfatlar babında bid'at ehlinin vasıflarından birinin, onları hakikatlerine hamletmemeleri, bilakis ancak mecazlarına hamletmeleri olduğunu belirtmiştir."], [2437.0, "Size, gaybî şeylerden herhangi birine mecazın girmesinin, kendisinden Allah'a sığınmak gereken bir tâğût, bir İblîs ve bir şeytan olduğunu söylemiştim."], [2445.0, "Aklının gaybî şeylere mecazla dalmasına izin veren herkes, akîdesinin bozulacağını ilan etmiş olur."], [2453.0, "Akîdeleri en çok bozan şeylerden biri, genel olarak gaybiyyât babında, özel olarak da sıfatlar babında mecazı söylemektir."]]}, {"reader": false, "ar": [[2463.0, "وقال الإمام أبو أحمد الكَرَجيّ المعروف بالقصّاب رحمه الله تعالى ـ انتبهوا ـ:"], [2469.3, "«لا يوصف اللهُ إلا بما وصف به نفسه، أو وصفه به نبيُّه صلى الله عليه وسلم، وكلُّ صفةٍ وصف بها نفسه أو وصفه بها نبيُّه فهي صفةٌ حقيقةً لا صفةُ مجاز، ولو كانت صفةَ مجازٍ لتحتّم تأويلُها، ولقيل: معنى البصر كذا، ومعنى السمع كذا، ولفُسِّرت بغير السابق إلى الأفهام. فلمّا كان مذهبُ السلف إقرارَها بلا تأويل، عُلم أنها غيرُ محمولةٍ على المجاز، وإنما هي حقٌّ بيّن». انتهى كلامه."]], "tr": [[2463.0, "Kassâb diye bilinen İmam Ebû Ahmed el-Kerecî —Allah Teâlâ ona rahmet etsin— şöyle demiştir —dikkat edin—:"], [2465.3, "\"Allah ancak kendisini nitelediği veya Peygamberi sallallâhu aleyhi ve sellem'in O'nu nitelediği şeyle nitelenir."], [2467.0, "Kendisini nitelediği veya Peygamberi'nin O'nu nitelediği her sıfat, mecaz sıfatı değil hakiki bir sıfattır."], [2469.3, "Eğer mecaz sıfatı olsaydı, onun te'vili zorunlu olurdu;"], [2476.1, "'Basarın manası şudur, sem'in manası şudur' denirdi ve zihinlere ilk gelenden başka bir şeyle tefsir edilirdi."], [2492.0, "Selefin mezhebi onları te'vil etmeksizin ikrar etmek olunca, bunların mecaza hamledilmediği, bilakis apaçık bir hak olduğu bilindi.\" Sözü burada bitti."]]}]}, {"ts": "41:51", "title": "8. Külliye (devam): Sıfat ayeti sanılıp Ehl-i Sünnet'in sıfatla tefsir etmediği naslar", "paras": [{"reader": false, "ar": [[2511.0, "فلا يجوز لك أبدًا أن تحمل شيئًا من هذه الغيبيّات في باب صفات الله عز وجل على المجاز،"], [2522.0, "إلا إذا دلّت بعضُ القرائن في بعض النصوص التي يقال إنها نصوصُ صفات،"], [2531.0, "وفي الحقيقة ـ بعد التمحيص والتدقيق ـ لم نجد أنها من نصوص الصفات؛"], [2538.0, "فنجد أنّ أهل السنة والجماعة يفسّرونها على أنها آيةٌ من جملة الآيات التي لا تتعلّق بالصفات."], [2546.0, "فيتذرّع أهلُ البدع بتفسير أهل السنة لهذه الآية التي تَظهر أنها من آيات الصفات،"], [2553.0, "فيقولون: انظروا إلى أهل السنة يحملون آياتِ الصفات على المجازات!"]], "tr": [[2511.0, "Gaybiyyâttan olan bu şeylerden herhangi birini Allah Azze ve Celle'nin sıfatları babında mecaza hamletmen asla caiz değildir."], [2522.0, "Ancak \"sıfat nasları\" denilen bazı naslarda bazı karineler delâlet ederse, —hakikatte ise inceleme ve tetkikten sonra bunların sıfat naslarından olmadığını görürüz—;"], [2538.0, "Ehl-i Sünnet ve'l-Cemaat'in bunları sıfatlarla ilgisi olmayan ayetler arasından bir ayet olarak tefsir ettiğini görürüz."], [2546.0, "Bid'at ehli de Ehl-i Sünnet'in, sıfat ayetlerinden olduğu izlenimini veren bu ayeti tefsir etmesini bahane edinir ve \"Ehl-i Sünnet'e bakın, sıfat ayetlerini mecazlara hamlediyorlar!\" derler."]]}, {"reader": false, "ar": [[2560.0, "كقول الله عز وجل:"], [2562.5, "<span class=\"ayah\">﴿أَوَلَمْ يَرَوْا أَنَّا خَلَقْنَا لَهُم مِّمَّا عَمِلَتْ أَيْدِينَا﴾<\/span> <span class=\"ref\">[يس: ٧١]<\/span> <span class=\"note\">(قرأها الشيخ: «أوَلا يروا»)<\/span>،"], [2568.0, "فقال أهلُ السنة: أي:"], [2569.6, "أنفسنا. فيأتي المبتدع ويقول:"], [2571.6, "إنّ أهل السنة انتقلوا من الحقيقة إلى المجاز."], [2576.0, "فنقول: إنّ هذه الآية ليست من آيات الصفات أصالةً."], [2580.0, "وكقول بعض أهل البدع ـ مستدلًّا بقول بعض الصحابة ومن بعدهم من السلف في قول الله عز وجل:"], [2591.0, "<span class=\"ayah\">﴿يَوْمَ يُكْشَفُ عَن سَاقٍ﴾<\/span> <span class=\"ref\">[القلم: ٤٢]<\/span>:"], [2593.0, "أي عن شدّةٍ وكرب ـ فقالوا:"], [2595.5, "انظروا إلى علماء أهل السنة كيف يخرجون عن دائرة الحقيقة إلى المجاز!"], [2602.0, "مع أنها ليست من آيات الصفات في الأصحّ."]], "tr": [[2560.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Görmediler mi ki, ellerimizin yaptığı şeylerden onlar için (hayvanlar) yarattık﴾<\/span> [Yâsîn 71] <span class=\"note\">(Şeyh «أَوَلا يروا» diye okuyor)<\/span> sözü gibi;"], [2569.2, "Ehl-i Sünnet \"yani kendimiz (yarattık)\" demiştir."], [2571.6, "Bid'atçi gelir ve \"Ehl-i Sünnet hakikatten mecaza geçti\" der."], [2576.0, "Biz de deriz ki: Bu ayet aslen sıfat ayetlerinden değildir."], [2580.0, "Bid'at ehlinden bazılarının —sahâbeden bazılarının ve onlardan sonra gelen seleften bazılarının, Allah Azze ve Celle'nin <span class=\"ayah\">﴿Baldırın açılacağı gün﴾<\/span> [Kalem 42] sözü hakkında \"yani şiddet ve sıkıntıdan (açılacağı gün)\" demesini delil getirerek— \"Ehl-i Sünnet âlimlerine bakın, hakikat dairesinden mecaza nasıl çıkıyorlar!\" demeleri gibi."], [2595.5, "Oysa bu ayet, en sahih görüşe göre sıfat ayetlerinden değildir."]]}, {"reader": false, "ar": [[2605.0, "وكقول بعضهم مستدلًّا بقول أهل السنة على قول الله عز وجل ـ انتبهوا،"], [2612.1, "انتبهوا ـ: <span class=\"ayah\">﴿فَأَيْنَمَا تُوَلُّوا فَثَمَّ وَجْهُ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ١١٥]<\/span>،"], [2621.0, "فقال كثيرٌ من أهل السنة:"], [2623.5, "أي جهةُ الله التي إذا استقبلتموها صحّت تعبّداتُكم،"], [2630.0, "مع أنّ بعض أهل السنة قال:"], [2633.2, "إنها من الأدلّة على إثبات صفة الوجه؛"], [2637.0, "لأننا نقول بأنّ هذه الآية ليست من آيات الصفات أصالةً،"], [2642.0, "فإنّ إثبات صفة وجه الله عز وجل قد دلّت عليه الأدلّةُ المتواترة غيرُ هذا النصّ."]], "tr": [[2605.0, "Bazılarının, Ehl-i Sünnet'in Allah Azze ve Celle'nin —dikkat edin, dikkat edin— <span class=\"ayah\">﴿Nereye dönerseniz Allah'ın vechi oradadır﴾<\/span> [Bakara 115] sözü hakkındaki görüşünü delil getirmesi gibi."], [2623.5, "Ehl-i Sünnet'ten birçoğu \"yani Allah'ın, yöneldiğinizde ibadetlerinizin sahih olduğu cihetidir (kıblesidir)\" demiştir;"], [2631.1, "Ehl-i Sünnet'ten bazıları ise bunun vech sıfatını isbat eden delillerden olduğunu söylemiştir."], [2637.0, "Çünkü biz bu ayetin aslen sıfat ayetlerinden olmadığını söyleriz;"], [2641.5, "zira Allah Azze ve Celle'nin vech sıfatının isbatına bu nassın dışında mütevatir deliller delâlet etmiştir."]]}, {"reader": false, "ar": [[2650.0, "فانتبهوا من هذا المزلق؛"], [2653.0, "فأيُّ آيةٍ من آيات الصفة التي هي من آياتها حقيقةً،"], [2659.0, "فلا تجد سنّيًّا واحدًا يحملها من حقيقتها إلى مجازاتها."], [2666.0, "ولذلك فإنني أقول لكم كلّيّةً،"], [2668.9, "وهي: أنّ كلّ صفةٍ ثبت خلافُ أهل السنة والجماعة:"], [2674.0, "أهي من نصوص الصفات أو لا <span class=\"q\">؟ 44:26<\/span>،"], [2676.0, "ففي الأعمّ الأغلب أنها لا تكون من نصوص الصفات،"], [2681.0, "كما عُرف ذلك بالاستقراء التامّ لكافّة مواضع اختلاف أهل السنة في جُمَلٍ من الآيات أو الأحاديث المتعلّقة بشيءٍ من صفات الله عز وجل."]], "tr": [[2650.0, "Bu kaygan zemine dikkat edin!"], [2653.0, "Hakikaten sıfat ayetlerinden olan herhangi bir sıfat ayetini hakikatinden mecazlarına hamleden tek bir Sünnî bile bulamazsın."], [2666.0, "Bu yüzden size bir külliye söylüyorum:"], [2669.4, "Sıfat naslarından olup olmadığında Ehl-i Sünnet ve'l-Cemaat'in ihtilafı sabit olan her sıfat (nassı) <span class=\"q\">؟<\/span>, çoğunlukla sıfat naslarından olmaz."], [2679.3, "Bu, Allah Azze ve Celle'nin sıfatlarından bir şeyle ilgili birtakım ayet veya hadislerde Ehl-i Sünnet'in ihtilaf ettiği bütün yerlerin tam istikrâsıyla (taranmasıyla) bilinmiştir."]]}, {"reader": false, "ar": [[2692.0, "ولعلّنا نكتفي بهذا، والله أعلى وأعلم،"], [2694.4, "وصلّى الله وسلّم على نبيّنا محمّد."]], "tr": [[2692.0, "Belki bununla yetiniriz. Allah en yüce olandır ve en iyi bilendir."], [2694.8, "Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;

    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
