]], "tr": [[2788.0, "İmam allâme Süleymân b. Abdillâh b."], [2792.0, "Muhammed b. Abdilvehhâb —Allah hepsine geniş rahmetiyle rahmet etsin— şöyle demiştir:"], [2798.0, "\"O'nun isimleri isimlerin en güzelidir, tıpkı sıfatlarının sıfatların en kâmili olduğu gibi."], [2804.5, "O'nun kendisini isimlendirdiği şeyden başkasına geçilmez;"], [2807.0, "tıpkı O'nun kendisini ve Resûlü sallallâhu aleyhi ve sellem'in O'nu nitelediği şeyin aşılmadığı gibi.\" Şunu söyleyinceye kadar devam etti:"], [2815.0, "\"Buradan, O'na 'es-Sâni'', 'el-Fâil', 'el-Mürebbî' ve benzeri isimleri itlak edenin hatası sana açıkça görünür."], [2825.6, "Çünkü O Sübhânehû'nun kendisi hakkında kullandığı ve kendisinden onunla haber verdiği lafız bundan daha tam, daha kâmil ve şanı daha yücedir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2839.0, "وسُئل العلّامة ابن باز رحمه الله تعالى عن إطلاق اسم «الصانع» على الله،"], [2847.0, "فأجاب رحمه الله: «يعني \"صانع العالم\" من باب الإثبات، لا باب أنّ ـ لا باب أنّ ـ لا باب ـ وليس من باب أنه موصوفٌ، يُقال: \"الصانع\". ولو قال: \"الخالق\" لكان أفضل؛ لأنّ الشريعة جاءت بـ\"الخالق\"، وجاءت بالفعل للصانع في قوله: <span class=\"ayah\">﴿صُنْعَ اللَّهِ الَّذِي أَتْقَنَ كُلَّ شَيْءٍ﴾<\/span> <span class=\"ref\">[النمل: ٨٨]<\/span>، لكن \"الصانع\" ما نعلم أنه جاء ذكرُه ـ أي في الأسماء ـ لكن عبّروا به، مثل ما يُقال: \"الموجود\" و\"الشيء\"، من باب نفي الحجّة <span class=\"q\">؟ 47:57<\/span>»."], [2886.0, "انتهى كلامه. يعني أنه يصحّ إطلاقه من باب الإخبار عن فعلٍ من أفعال الله،"], [2892.0, "ولا يصحّ إطلاقه من باب الأسماء."]], "tr": [[2839.0, "Allâme İbn Bâz'a —Allah ona rahmet etsin— \"es-Sâni'\" isminin Allah hakkında kullanılması soruldu."], [2846.5, "O da —Allah ona rahmet etsin— şöyle cevap verdi:"], [2851.7, "\"Yani 'âlemin sâni'i (yapıcısı)' (demek) isbat babındandır;"], [2855.2, "... babından değil —... babından değil— onun (bununla) nitelendiği babından değildir;"], [2861.1, "'es-Sâni'' denir. 'el-Hâlık' deseydi daha iyi olurdu;"], [2864.4, "çünkü şeriat 'el-Hâlık'ı getirmiştir, 'sâni'' için ise fiili getirmiştir:"], [2868.2, "<span class=\"ayah\">﴿Her şeyi sağlam ve kusursuz yapan Allah'ın sanatı﴾<\/span> [Neml 88] sözünde."], [2874.0, "Fakat 'es-Sâni''in —yani isimler arasında— zikredildiğini bilmiyoruz."], [2877.0, "Ama onu, 'el-Mevcûd' ve 'eş-Şey'' denildiği gibi, hücceti nefyetme (?) <span class=\"q\">؟<\/span> babından ifade etmişlerdir.\" Sözü burada bitti."], [2887.3, "Yani onun Allah'ın fiillerinden bir fiil hakkında haber verme babından kullanılması sahihtir, isimler babından kullanılması ise sahih değildir."]]}, {"reader": false, "ar": [[2895.0, "وقال العلّامة ابن عثيمين رحمه الله تعالى:"], [2899.0, "«لا يجوز أن نقول: إنّ الله \"صانع\" على أنه اسمٌ من أسمائه؛ لأنّ أسماء الله توقيفيّة، ولا يمكن أن تُسمّي الله بما لم يُسمِّ به نفسَه، لكن يجوز أن تُخبر عنه بأنه صانع»."], [2916.0, "انتهى كلامه رحمه الله."]], "tr": [[2895.0, "Allâme İbn Useymîn —Allah ona rahmet etsin— şöyle demiştir:"], [2899.0, "\"Allah'ın 'sâni'' olduğunu, O'nun isimlerinden bir isim olarak söylememiz caiz değildir;"], [2906.5, "çünkü Allah'ın isimleri tevkîfîdir (nassa bağlıdır)."], [2909.8, "Allah'ı, kendisini isimlendirmediği bir şeyle isimlendirmen mümkün değildir."], [2916.0, "Fakat O'ndan, sâni' olduğunu haber vermen caizdir.\" Sözü burada bitti; Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2918.0, "ومن ذلك أيضًا ـ أي من الأمثلة ـ:"], [2922.0, "«الطبيب»، «الطبيب»: أهو من جملة أسمائه عز وجل،"], [2929.0, "أو من جملة ما يُخبَر به عنه؟"], [2931.0, "على قولين لأهل السنّة والجماعة."], [2934.0, "وقد ورد هذا الإطلاق في حديث أبي رِمْثة رضي الله عنه أنه قال للنبيّ صلى الله عليه وسلم:"], [2942.0, "«أرِني هذا الذي بظهرك» ـ أي خاتم النبوّة ـ «أرِني هذا الذي بظهرك، فإنّي رجلٌ طبيب»."], [2951.0, "قال: «الله الطبيب» ـ «الله»،"], [2956.0, "يعني: الله الطبيب ـ فأطلق على الله عز وجل هنا «الطبيب»."], [2963.0, "ثم قال: «بل أنت رجلٌ رفيق، طبيبُها الذي خلقها»."]], "tr": [[2918.0, "Bunlardan biri de —yani örneklerden— \"et-Tabîb\"dir, \"et-Tabîb\":"], [2922.0, "O Azze ve Celle'nin isimlerinden midir, yoksa O'ndan haber verilen şeylerden mi?"], [2930.1, "Ehl-i Sünnet ve'l-Cemaat'in bu konuda iki görüşü vardır."], [2934.0, "Bu itlak Ebû Rimse'nin —Allah ondan razı olsun— hadisinde gelmiştir:"], [2938.1, "O, Peygamber sallallâhu aleyhi ve sellem'e \"Sırtındaki şu şeyi bana göster\" —yani nübüvvet mührünü— \"sırtındaki şu şeyi bana göster, çünkü ben tabip bir adamım\" dedi."], [2951.0, "Buyurdu ki: \"Tabip Allah'tır\" —\"Allah\", yani tabip Allah'tır—."], [2956.9, "Burada Allah Azze ve Celle hakkında \"et-Tabîb\" lafzı kullanıldı."], [2963.0, "Sonra şöyle buyurdu: \"Bilakis sen yumuşak davranan (refîk) bir adamsın; onun tabibi, onu yaratandır.\""]]}, {"reader": false, "ar": [[2969.0, "وفي حديث عائشة رضي الله عنها قالت:"], [2973.0, "ثم مرض رسول الله صلى الله عليه وسلم،"], [2976.0, "فوضعتُ يدي على صدره فقلت:"], [2978.2, "«أذهِبِ البأسَ ربَّ الناس، أنت الطبيبُ وأنت الشافي»."], [2984.0, "وكان رسول الله صلى الله عليه وسلم يقول:"], [2987.0, "«ألحِقني بالرفيق الأعلى، ألحِقني بالرفيق الأعلى»."], [2991.0, "يعني أنها كانت ترقيه،"], [2992.8, "وهو يدعو ربَّه أن يُلحقه بالرفيق الأعلى."], [2997.0, "فسمعها النبيّ صلى الله عليه وسلم تُطلق «الطبيب» على الله، وأقرّها."]], "tr": [[2969.0, "Âişe'nin —Allah ondan razı olsun— hadisinde ise şöyle dedi:"], [2973.0, "Sonra Resûlullah sallallâhu aleyhi ve sellem hastalandı;"], [2974.9, "ben elimi göğsünün üzerine koydum ve \"Sıkıntıyı gider ey insanların Rabbi!"], [2978.2, "Tabip sensin, şifa veren sensin\" dedim."], [2984.0, "Resûlullah sallallâhu aleyhi ve sellem ise \"Beni Refîk-i A'lâ'ya kavuştur, beni Refîk-i A'lâ'ya kavuştur\" diyordu."], [2991.0, "Yani Âişe ona rukye yapıyordu, o da Rabbine kendisini Refîk-i A'lâ'ya kavuşturması için dua ediyordu."], [2997.0, "Peygamber sallallâhu aleyhi ve sellem onun Allah hakkında \"et-Tabîb\" lafzını kullandığını işitti ve bunu onayladı."]]}, {"reader": false, "ar": [[3003.0, "فلا جرمَ في صحّة هذا الإطلاق على الله عز وجل لثبوت الدليل به."], [3009.0, "ولكن أنُطلقه على الله عز وجل إطلاقَ أسماءٍ أو إطلاقَ أخبار؟"], [3015.0, "الجواب: إطلاقُ أخبارٍ في الأصحّ؛"], [3019.0, "وذلك لأنّ من شرط إطلاق الأسماء أن يتضمّن هذا الإطلاقُ معنًى كماليًّا مطلقًا من كلّ وجه،"], [3026.8, "و«الطبيب» يتضمّن صفةَ الطبّ أو التطبيب،"], [3030.2, "وليس ذلك من جملة ما يدلّ على الكمال المطلق."]], "tr": [[3003.0, "Delil sabit olduğu için bu itlakın Allah Azze ve Celle hakkında sahih olduğunda şüphe yoktur."], [3009.0, "Fakat onu Allah Azze ve Celle hakkında isim itlakı olarak mı, yoksa haber itlakı olarak mı kullanırız?"], [3015.0, "Cevap: En sahih görüşe göre haber itlakı olarak."], [3019.0, "Çünkü isim itlakının şartı, bu itlakın her yönden mutlak bir kemal anlamı içermesidir."], [3026.0, "\"et-Tabîb\" ise tıp veya tedavi sıfatını kapsar;"], [3029.7, "bu da mutlak kemale delâlet eden şeylerden değildir."]]}, {"reader": false, "ar": [[3035.0, "ولذلك فسّر النبيّ صلى الله عليه وسلم هذا الإطلاق في قوله:"], [3040.0, "«بل أنت رجلٌ رفيق، طبيبُها» ـ أي الذي يعرف أدواءها ودواءها من كلّ وجه ـ قال:"], [3051.7, "«الذي خلقها». فالأصحّ عندي ـ إن شاء الله ـ أنّ إطلاق «الطبيب» على الله إنما هو إطلاقُ خبرٍ عن فعلٍ من أفعاله تبارك وتعالى."], [3063.0, "أفهمتم القاعدة؟ والله أعلم."]], "tr": [[3035.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem bu itlakı şu sözüyle tefsir etti:"], [3040.0, "\"Bilakis sen yumuşak davranan bir adamsın;"], [3042.4, "onun tabibi\" —yani onun hastalıklarını ve ilacını her yönden bilen— buyurdu:"], [3051.7, "\"onu yaratandır.\" İnşallah bence en sahih olan, \"et-Tabîb\"in Allah hakkında kullanılmasının, O Tebâreke ve Teâlâ'nın fiillerinden bir fiil hakkında haber itlakı olduğudur."], [3061.5, "Kaideyi anladınız mı? Allah en iyisini bilir."]]}]}, {"ts": "51:05", "title": "8. Külliye: Vahiyde birlikte gelen her iki isim, tek başlarına özel bir kemale, birlikte başka bir kemale delâlet eder", "paras": [{"reader": false, "ar": [[3065.0, "ومن الكلّيّات أيضًا: <b>كلُّ اسمين مقترنين في الوحي<\/b> ـ هذه كلّيّةٌ مفيدةٌ جدًّا يا جماعة،"], [3075.0, "اكتبوها، مفيدة يعني جدًّا ـ كلُّ اسمين مقترنين في الوحي فيدلّان بمفردهما على كمالٍ خاصّ،"], [3085.0, "وبمجموعهما على كمالٍ آخر. الله أكبر."], [3098.3, "<span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [3105.0, "كلُّ اسمين مقترنين في الوحي فيدلّان بمفردهما على كمالٍ خاصّ،"], [3112.0, "وبمجموعهما على كمالٍ آخر."]], "tr": [[3065.0, "Külliyelerden biri de şudur: <b>Vahiyde birlikte gelen her iki isim<\/b> —bu çok faydalı bir külliyedir ey cemaat, yazın onu;"], [3067.0, "gerçekten çok faydalı— 8. külliye:"], [3073.0, "Vahiyde birlikte (yan yana) gelen her iki isim, tek başlarına özel bir kemale, birlikte ise başka bir kemale delâlet eder. Allahu ekber!"], [3098.3, "(Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [3105.0, "<b>8. külliye: Vahiyde birlikte gelen her iki isim, tek başlarına özel bir kemale, birlikte ise başka bir kemale delâlet eder.<\/b>"]]}, {"reader": false, "ar": [[3117.0, "أقول وبالله التوفيق: أنتم ترون ـ بارك الله فيكم ـ أنّ الله عز وجل يقرن بين اسمين من أسمائه في كثيرٍ من مواضع وحيه،"], [3132.0, "فيقول: «السميع البصير»، و«الغفور الرحيم»،"], [3162.3, "و«الغنيّ الحميد»، و«الخبير البصير»،"], [3162.8, "و«الرؤوف الرحيم»، و«الحكيم العليم»،"], [3163.3, "و«الحميد المجيد»، و«العزيز الحكيم»،"], [3163.9, "و«العليّ العظيم»، و«الفتّاح العليم»،"], [3164.4, "و«اللطيف الخبير»، و«العفوّ الغفور»، و«الشكور الحليم»."]], "tr": [[3117.0, "Tevfik Allah'tandır, derim ki: Görüyorsunuz —Allah sizi mübarek kılsın— Allah Azze ve Celle vahyinin pek çok yerinde isimlerinden iki ismi birlikte zikreder:"], [3132.9, "\"es-Semî' el-Basîr\", \"el-Gafûr er-Rahîm\", \"el-Ganiyy el-Hamîd\", \"el-Habîr el-Basîr\", \"er-Raûf er-Rahîm\", \"el-Hakîm el-Alîm\", \"el-Hamîd el-Mecîd\", \"el-Azîz el-Hakîm\", \"el-Aliyy el-Azîm\", \"el-Fettâh el-Alîm\", \"el-Latîf el-Habîr\", \"el-Afüvv el-Gafûr\", \"eş-Şekûr el-Halîm\" der."]]}, {"reader": false, "ar": [[3167.0, "فيأتي السُّنّيّ الذي يتربّى على هذه الكلّيّة ويقول:"], [3171.7, "إنّ هذا الإطلاق فيه كمالات:"], [3175.0, "كمالٌ بالنظر إلى كلّ اسمٍ على حدة،"], [3179.0, "وكمالٌ باجتماع دلالة هذين الاسمين مع بعضهما."], [3185.0, "فإذا قلنا بأنّ الله عز وجل ـ وأضرب لكم أمثلة ـ فكثيرًا ما يأتي في القرآن:"], [3193.7, "«العزيز الحكيم»، فهذا يدلّ على كمالين:"], [3200.0, "فاسمه «العزيز» يدلّ على كماله في عزّته المطلقة،"], [3205.0, "واسمه «الحكيم» يدلّ أيضًا على كمالٍ خاصّ،"], [3210.0, "وهو كماله في حكمته المطلقة."], [3214.0, "فإذًا كلُّ اسمٍ منها يدلّ على كماليّةٍ خاصّة،"], [3217.0, "ولكن باقترانهما يُفيدان كمالًا آخر."]], "tr": [[3167.0, "Bu külliye üzerine yetişen Sünnî gelir ve der ki:"], [3171.7, "Bu itlakta (birkaç) kemal vardır:"], [3175.0, "Her isme ayrı ayrı bakıldığında bir kemal, bu iki ismin delâletinin bir araya gelmesiyle de bir kemal."], [3185.0, "Allah Azze ve Celle'nin ..."], [3188.3, "dediğimizde —size örnekler vereyim—: Kur'an'da sıkça \"el-Azîz el-Hakîm\" gelir."], [3193.7, "Bu, iki kemale delâlet eder:"], [3200.0, "\"el-Azîz\" ismi O'nun mutlak izzetindeki kemaline, \"el-Hakîm\" ismi de özel bir kemale, yani O'nun mutlak hikmetindeki kemaline delâlet eder."], [3214.0, "Demek ki bunlardan her isim özel bir kemale delâlet eder;"], [3216.6, "fakat birlikte gelmeleriyle başka bir kemal ifade ederler."]]}, {"reader": false, "ar": [[3223.0, "وذلك لأنّ عزّته تعالى مقرونةٌ بالحكمة ـ انتبه ـ فعزّته لا تقتضي ظلمًا وجَورًا وسوءَ فعل."], [3239.0, "فإنّ العزيز من المخلوقين قد تأخذه العزّة بالإثم،"], [3247.0, "فيظلم لعزّته، ويجور لعزّته،"], [3250.1, "ويتسلّط لعزّته، ويأكل أموال الناس لعزّته،"], [3258.1, "ويخالف الحقّ، ويعظم جبروتُه على المخلوقين لعزّته."], [3267.0, "ولكنّ الله عز وجل أراح قلوب عباده بأنّ عزّته المطلقة مقرونةٌ بحكمته المطلقة. أرأيتَ الكمالَ الآخر؟"]], "tr": [[3223.0, "Bunun sebebi, O Teâlâ'nın izzetinin hikmetle birlikte olmasıdır —dikkat et—."], [3231.0, "O'nun izzeti zulmü, haksızlığı ve kötü fiili gerektirmez."], [3239.0, "Çünkü mahlûklardan izzetli olanı, izzet (gurur) günaha sürükleyebilir:"], [3242.6, "İzzeti sebebiyle zulmeder, izzeti sebebiyle haksızlık eder, izzeti sebebiyle tahakküm eder, izzeti sebebiyle insanların mallarını yer, hakka muhalefet eder ve izzeti sebebiyle mahlûklar üzerindeki zorbalığı büyür."], [3267.0, "Fakat Allah Azze ve Celle, mutlak izzetinin mutlak hikmetiyle birlikte olduğunu bildirerek kullarının kalplerini rahatlattı. Diğer kemali gördün mü?"]]}, {"reader": false, "ar": [[3283.0, "وكم من إنسانٍ عنده حكمة،"], [3286.1, "ولكن ليس عنده من العزّة والقوّة ما يجعله يُنفذ في أتباعه مقتضى حكمته!"], [3294.0, "فكم من إنسانٍ حكيمٍ لكنه ضعيف!"], [3297.0, "لكن إذا قرنتَ حكمة الله عز وجل بتلك العزّة المطلقة،"], [3302.0, "فوجدتَ أنّ عزّته تحكمها الحكمة،"], [3305.5, "وأنّ حكمته يُنفذ مقتضاها العزّة."], [3310.0, "ولعلّ ذلك واضحٌ لكم."]], "tr": [[3283.0, "Nice insan vardır ki hikmeti vardır, fakat ona tâbi olanlar arasında hikmetinin gereğini yürütmesini sağlayacak izzet ve kuvvete sahip değildir!"], [3294.0, "Nice hikmet sahibi insan vardır ki zayıftır!"], [3297.0, "Fakat Allah Azze ve Celle'nin hikmetini o mutlak izzetle birlikte düşündüğünde, O'nun izzetini hikmetin yönettiğini, hikmetinin gereğini de izzetin yürüttüğünü görürsün. Umarım bu size açıktır."]]}]}, {"ts": "55:13", "title": "8. Külliye (devam): Şuarâ'da \"el-Azîz er-Rahîm\", \"el-Azîz el-Alîm\"", "paras": [{"reader": false, "ar": [[3313.0, "وتكرّر ـ ومثالٌ آخر ـ لقد تكرّر في سورة الشعراء ـ وتأمّلوا معي هذا ـ ختمُ قصص الأنبياء في أممهم بقوله:"], [3325.0, "<span class=\"ayah\">﴿وَإِنَّ رَبَّكَ لَهُوَ الْعَزِيزُ الرَّحِيمُ﴾<\/span> <span class=\"ref\">[الشعراء: ٩]<\/span>."], [3331.0, "شلون «العزيز الرحيم»؟ الله عز وجل يقرن بين هذين الاسمين في سورة الشعراء،"], [3340.0, "فيدلّان على كمالٍ مَن نظر إليهما منفردين:"], [3345.1, "فـ«العزيز» يدلّ على كماله في عزّته،"], [3348.8, "و«الرحيم» يدلّ على كمالٍ آخر يخصّه،"], [3352.0, "وهو كماله في رحمته عز وجل الخاصّة والعامّة."]], "tr": [[3313.0, "Ve tekrarlandı —başka bir örnek—:"], [3316.5, "Şuarâ sûresinde —benimle birlikte bunu düşünün— peygamberlerin ümmetleriyle kıssalarının şu sözle bitirilmesi tekrar tekrar gelmiştir:"], [3325.0, "<span class=\"ayah\">﴿Şüphesiz Rabbin, mutlak galip olan, çok merhametli olandır﴾<\/span> [Şuarâ 9]."], [3331.0, "\"el-Azîz er-Rahîm\" nasıl (oluyor)? Allah Azze ve Celle Şuarâ sûresinde bu iki ismi birlikte zikreder."], [3339.0, "Onlara ayrı ayrı bakan için (her biri) bir kemale delâlet eder:"], [3345.1, "\"el-Azîz\" O'nun izzetindeki kemaline, \"er-Rahîm\" ise ona has başka bir kemale, yani O Azze ve Celle'nin hususi ve umumi rahmetindeki kemaline delâlet eder."]]}, {"reader": false, "ar": [[3357.0, "ولكن إذا ـ باجتماعهما في سورة الشعراء يدلّ على كمالٍ آخر؛"], [3365.0, "ففيهما دلالةٌ ـ أو في اجتماعهما دلالةٌ ـ أنّ ما قدّره الله لأنبيائه من النصر ـ انتبهوا ـ والتأييد والرفعة من آثار رحمته التي اختصّهم بها."], [3381.0, "فالله عز وجل يذكر النبيَّ وقصّته،"], [3385.0, "ثم يذكر أنه نصر هذا النبيَّ على أمّته،"], [3389.0, "وأنه أعلى شأنه عليهم،"], [3393.0, "وأنه ثبّته ووفّقه، وكان معه بمعيّته الخاصّة،"], [3399.0, "وهذا يخصّه اسم «الرحيم»؛"], [3403.0, "فلأنه يرحم أنبياءه فعل بهم ذلك. انتبهوا."]], "tr": [[3357.0, "Fakat Şuarâ sûresinde birlikte gelmeleri başka bir kemale delâlet eder."], [3365.0, "Bu ikisinde —ya da birlikte gelmelerinde— şuna delâlet vardır:"], [3371.2, "Allah'ın peygamberleri için takdir ettiği zafer —dikkat edin—, destek ve yükseltilme, onlara has kıldığı rahmetinin eserlerindendir."], [3381.0, "Allah Azze ve Celle peygamberi ve kıssasını zikreder, sonra o peygamberi ümmetine karşı muzaffer kıldığını, onun şanını onların üstüne çıkardığını, onu sebat ettirip muvaffak kıldığını ve hususi beraberliğiyle onunla beraber olduğunu zikreder."], [3399.0, "Bu, \"er-Rahîm\" isminin kapsamına girer;"], [3403.0, "peygamberlerine merhamet ettiği için onlara bunu yaptı. Dikkat edin."]]}, {"reader": false, "ar": [[3408.0, "وما قدّره الله عز وجل لأعدائهم من الخذلان والحرمان والعقوبة والنكال إنما هي أثرٌ من آثار عزّته."], [3419.0, "ولذلك إذا ذكر قصص ـ قصّةَ النبيّ مع أمّته فيذكر أنه رحيمٌ باعتبار النبيّ،"], [3427.0, "وعزيزٌ باعتبار ما أصاب أمّته."], [3429.0, "فانتقامُه من أعداء أنبيائه وخذلانُهم بعزّته دليلٌ على كماله في عزّته،"], [3441.2, "ونجاةُ أنبيائه ونصرتُهم، ورفعةُ شأنهم،"], [3449.5, "وعلوُّ أمرهم، وغلبتُهم دليلٌ على رحمته بهم."]], "tr": [[3408.0, "Allah Azze ve Celle'nin onların düşmanları için takdir ettiği yardımsız bırakılma, mahrumiyet, ceza ve ibret verici azap ise ancak O'nun izzetinin eserlerinden bir eserdir."], [3421.1, "Bu yüzden peygamberin ümmetiyle kıssasını zikrettiğinde, peygamber itibarıyla Rahîm, ümmetinin başına gelen itibarıyla Azîz olduğunu zikreder."], [3429.0, "O'nun izzetiyle peygamberlerinin düşmanlarından intikam alması ve onları yardımsız bırakması, izzetindeki kemalinin delilidir;"], [3439.8, "peygamberlerinin kurtuluşu, onlara yardım edilmesi, şanlarının yükselmesi, işlerinin yüce olması ve galip gelmeleri ise onlara olan rahmetinin delilidir."]]}, {"reader": false, "ar": [[3455.0, "ومن الأمثلة أيضًا: قد تكرّر في القرآن الجمع بين «العزيز» و«العليم»؛"], [3462.0, "فالعزيز يدلّ على كمالٍ خاصّ،"], [3465.5, "والعليم يدلّ على كمالٍ خاصّ،"], [3470.0, "والكلام هنا عن الكمال الآخر،"], [3473.3, "وهو باجتماع هذين الاسمين."], [3476.0, "وذلك تجده غالبًا في القرآن ـ انتبه ـ إذا ذكر الله عز وجل الأجرامَ العلويّة وما تضمّنته من فلق الإصباح،"], [3489.4, "وجعل الليل سكنًا، وإجراء الشمس والقمر بحسبانٍ لا يعدوانه،"], [3498.0, "أو ذكر تزيين السماء الدنيا بالنجوم وحراستها،"], [3502.7, "فإنه غالبًا يذكر «العزيز العليم»."]], "tr": [[3455.0, "Örneklerden biri de şudur: Kur'an'da \"el-Azîz\" ile \"el-Alîm\"in birlikte zikredilmesi tekrar tekrar gelmiştir."], [3462.0, "el-Azîz özel bir kemale, el-Alîm de özel bir kemale delâlet eder;"], [3468.3, "burada söz, bu iki ismin bir araya gelmesiyle oluşan diğer kemal hakkındadır."], [3476.0, "Bunu Kur'an'da çoğunlukla —dikkat et— Allah Azze ve Celle yukarıdaki cisimleri ve onların kapsadığı sabahı yarmayı, geceyi dinlenme vakti kılmayı, güneşi ve ayı aşmadıkları bir hesapla yürütmeyi zikrettiğinde ya da dünya semasının yıldızlarla süslenmesini ve korunmasını zikrettiğinde bulursun; çoğunlukla \"el-Azîz el-Alîm\"i zikreder."]]}, {"reader": false, "ar": [[3506.0, "كقول الله عز وجل:"], [3508.3, "<span class=\"ayah\">﴿فَالِقُ الْإِصْبَاحِ وَجَعَلَ اللَّيْلَ سَكَنًا وَالشَّمْسَ وَالْقَمَرَ حُسْبَانًا ۚ ذَٰلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ﴾<\/span> <span class=\"ref\">[الأنعام: ٩٦]<\/span>؛"], [3515.6, "فأجراها جريانًا لا تختلف فيه لأنه عزيز،"], [3520.2, "وأحكم جريانها بنظامٍ بديعٍ لأنه عليم."], [3525.0, "وقول الله عز وجل:"], [3527.7, "<span class=\"ayah\">﴿وَالشَّمْسُ تَجْرِي لِمُسْتَقَرٍّ لَّهَا ۚ ذَٰلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ﴾<\/span> <span class=\"ref\">[يس: ٣٨]<\/span>."], [3535.0, "وقول الله عز وجل:"], [3537.7, "<span class=\"ayah\">﴿وَزَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَحِفْظًا ۚ ذَٰلِكَ تَقْدِيرُ الْعَزِيزِ الْعَلِيمِ﴾<\/span> <span class=\"ref\">[فصلت: ١٢]<\/span>."]], "tr": [[3506.0, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [3508.3, "<span class=\"ayah\">﴿O, sabahı yarandır; geceyi dinlenme vakti, güneşi ve ayı da (birer) hesap ölçüsü kılmıştır. Bu, mutlak galip olanın, her şeyi bilenin takdiridir﴾<\/span> [En'âm 96]."], [3515.6, "Onları, içinde hiç farklılık olmayan bir akışla yürüttü, çünkü Azîz'dir;"], [3518.9, "onların akışını eşsiz bir düzenle sağlamlaştırdı, çünkü Alîm'dir."], [3521.6, "Allah Azze ve Celle'nin şu sözü:"], [3525.0, "<span class=\"ayah\">﴿Güneş de kendi karar yerine doğru akıp gider. Bu, mutlak galip olanın, her şeyi bilenin takdiridir﴾<\/span> [Yâsîn 38]."], [3535.0, "Ve Allah Azze ve Celle'nin şu sözü:"], [3537.7, "<span class=\"ayah\">﴿Dünya semasını kandillerle süsledik ve (onu) koruduk. Bu, mutlak galip olanın, her şeyi bilenin takdiridir﴾<\/span> [Fussilet 12]."]]}, {"reader": false, "ar": [[3544.0, "فأفاد هذا الختمُ المشتمل على الجمع بين هذين الاسمين أنّ التقدير المحكَم المتقَن صادرٌ عن عزّة الله وعلمه،"], [3554.0, "ليس أمرًا اتّفاقيًّا لا يُمدَح به فاعلُه ولا يُثنى عليه به كسائر الأمور الاتّفاقيّة؛"], [3561.0, "فهو عزيزٌ حيث أجرى ذلك،"], [3564.1, "وعليمٌ حيث أجراه على نظامٍ لا يختلف أبدًا."]], "tr": [[3544.0, "Bu iki ismi birlikte içeren bu (ayet) sonu şunu ifade etti:"], [3549.6, "Sağlam ve kusursuz takdir, Allah'ın izzetinden ve ilminden kaynaklanır;"], [3554.0, "diğer tesadüfî işler gibi, yapanının onunla övülmediği ve onunla senâ edilmediği tesadüfî bir iş değildir."], [3561.0, "O, bunu yürüttüğü için Azîz'dir;"], [3563.5, "onu asla farklılaşmayan bir düzen üzere yürüttüğü için de Alîm'dir."]]}]}, {"ts": "59:29", "title": "8. Külliye (devam): Cin şeytanından istiaze \"es-Semî' el-Alîm\", insan şeytanından istiaze \"es-Semî' el-Basîr\" · Kapanış", "paras": [{"reader": false, "ar": [[3569.0, "ومثالٌ آخر، وهو عجيبٌ جدًّا:"], [3574.0, "الله عز وجل يختم أمرَه بالاستعاذة من الشيطان الجنّيّ بقوله:"], [3580.8, "«السميع العليم»، كما في قول الله عز وجل:"], [3588.0, "<span class=\"ayah\">﴿وَإِمَّا يَنزَغَنَّكَ مِنَ الشَّيْطَانِ نَزْغٌ فَاسْتَعِذْ بِاللَّهِ ۚ إِنَّهُ سَمِيعٌ عَلِيمٌ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٠٠]<\/span>."], [3595.0, "انتبهوا. وقول الله عز وجل:"], [3598.2, "<span class=\"ayah\">﴿وَإِمَّا يَنزَغَنَّكَ مِنَ الشَّيْطَانِ نَزْغٌ فَاسْتَعِذْ بِاللَّهِ﴾<\/span> ـ عفوًا،"], [3602.7, "قلنا إيش؟ ـ <span class=\"ayah\">﴿إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ﴾<\/span> <span class=\"ref\">[فصلت: ٣٦]<\/span>،"], [3605.6, "وفي الآية الأخرى: <span class=\"ayah\">﴿إِنَّهُ سَمِيعٌ عَلِيمٌ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٠٠]<\/span>."]], "tr": [[3569.0, "Başka bir örnek —ki çok şaşırtıcıdır—:"], [3574.0, "Allah Azze ve Celle, cin şeytanından istiaze etme (sığınma) emrini \"es-Semî' el-Alîm\" sözüyle bitirir."], [3580.8, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [3588.0, "<span class=\"ayah\">﴿Eğer şeytandan bir kışkırtma seni dürterse hemen Allah'a sığın. Şüphesiz O işitendir, bilendir﴾<\/span> [A'râf 200]."], [3595.0, "Dikkat edin. Ve Allah Azze ve Celle'nin şu sözü:"], [3598.2, "<span class=\"ayah\">﴿Eğer şeytandan bir kışkırtma seni dürterse hemen Allah'a sığın﴾<\/span> —pardon, ne demiştik?— <span class=\"ayah\">﴿Şüphesiz işiten, bilen ancak O'dur﴾<\/span> [Fussilet 36];"], [3606.8, "diğer ayette ise: <span class=\"ayah\">﴿Şüphesiz O işitendir, bilendir﴾<\/span> [A'râf 200]."]]}, {"reader": false, "ar": [[3608.0, "بينما جاء الأمر بالاستعاذة من الشيطان الإنسيّ بقول الله عز وجل:"], [3617.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ يُجَادِلُونَ فِي آيَاتِ اللَّهِ بِغَيْرِ سُلْطَانٍ أَتَاهُمْ ۙ إِن فِي صُدُورِهِمْ إِلَّا كِبْرٌ مَّا هُم بِبَالِغِيهِ ۚ فَاسْتَعِذْ بِاللَّهِ ۖ إِنَّهُ هُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[غافر: ٥٦]<\/span>."], [3628.0, "فلماذا إذا ذكر شيطنةَ الجنّ قال:"], [3631.8, "«سميعٌ عليم»، وإذا ذكر شيطنةَ الإنس قال: «سميعٌ بصير»؟"]], "tr": [[3608.0, "Oysa insan şeytanından istiaze emri Allah Azze ve Celle'nin şu sözüyle gelmiştir:"], [3617.0, "<span class=\"ayah\">﴿Kendilerine gelmiş bir delil olmaksızın Allah'ın ayetleri hakkında tartışanların göğüslerinde ancak ulaşamayacakları bir büyüklenme vardır. Sen hemen Allah'a sığın. Şüphesiz işiten, gören ancak O'dur﴾<\/span> [Mü'min 56]."], [3628.0, "Peki neden cinlerin şeytanlığını zikrettiğinde \"Semî' Alîm\", insanların şeytanlığını zikrettiğinde \"Semî' Basîr\" dedi?"]]}, {"reader": false, "ar": [[3638.0, "قال العلماء رحمهم الله تعالى:"], [3643.0, "إنّ الشيطان الجنّيّ عالَمٌ خفيٌّ لا تُبصره العيون،"], [3649.0, "فشيطنتُه يعلم بها السميعُ الذي لا يخفى عليه سماعُ شيطنتهم،"], [3655.0, "والعليمُ الذي يعلم عالَمَهم وإن كان خفيًّا عن أبصارنا."], [3660.0, "ولكنّ شيطنة الإنس فإنه سميعٌ مهما أخفَوا شيطنتهم،"], [3670.0, "مهما خلا بعضُهم إلى بعض،"], [3673.0, "لكنه بصيرٌ؛ لأنّ شيطنة الإنس يرجع إلى عالَمهم المُبصَر الذي تدركه العيون."], [3682.0, "فهو سميعٌ عليمٌ بشيطنة الجنّ لخفاء عالَمهم،"], [3687.0, "وسميعٌ بصيرٌ بشيطنة الإنس لظهور عالَمهم والقدرة على إبصاره."]], "tr": [[3638.0, "Âlimler —Allah onlara rahmet etsin— şöyle demiştir:"], [3643.0, "Cin şeytanı, gözlerin göremediği gizli bir âlemdir."], [3648.1, "Onun şeytanlığını, onların şeytanlıklarını işitmek kendisine gizli kalmayan Semî' ile, gözlerimizden gizli olsa bile onların âlemini bilen Alîm bilir."], [3660.0, "İnsanların şeytanlığına gelince: O, onlar şeytanlıklarını ne kadar gizlerlerse gizlesinler, birbirleriyle ne kadar baş başa kalırlarsa kalsınlar işitendir;"], [3674.3, "fakat aynı zamanda görendir (Basîr), çünkü insanların şeytanlığı, onların gözlerin idrak ettiği görülebilen âlemine dayanır."], [3682.0, "Dolayısıyla O, âlemleri gizli olduğu için cinlerin şeytanlığını işiten ve bilendir;"], [3687.7, "âlemleri açık ve görülebilir olduğu için insanların şeytanlığını işiten ve görendir."]]}, {"reader": false, "ar": [[3698.0, "فهمتم هذا؟ والله أعلى وأعلم،"], [3702.0, "وصلى الله وسلم على نبيّنا محمدٍ وعلى آله وصحبه."]], "tr": [[3698.0, "Bunu anladınız mı? Allah en yüce olandır ve en iyi bilendir."], [3702.8, "Allah, Peygamberimiz Muhammed'e, âline ve ashâbına salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
