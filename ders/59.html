<script>
const D={"no": 59, "vid": "Q-jhHjvTuZ8", "title_ar": "الدرس (٥٩) من شرح كليات العقيدة — من كليات أسماء الله الحسنى", "title_tr": "Şerhu Külliyyâti'l-Akîde — 59. Ders: Esmâ-i Hüsnâ Külliyeleri (İsimlerin Birbirini Gerektirmesi, İsimlerin Yaratılıştaki Eseri, Her İsmin Kendine Has Kulluğu, İsimden Sıfat Türetme, İhsâ, Zât ve Sıfat Bakımından İsimler, Mutlak Kemal İçermeyen İtlaklar, Birlikte Gelen İki İsim)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Allah'ın her ismi diğer ismin anlamını gerektirir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.0, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.1, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.7, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [10.7, "أمّا بعد: فلا نزال في سياق شرح الكلّيّات المتعلّقة بأسماء الله عز وجل،"], [17.4, "وعندنا في هذا الدرس عشرُ كلّيّات،"], [20.4, "أو قد تزيد قليلًا، على حسب التيسير."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.0, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [11.7, "Bundan sonra: Hâlâ Allah Azze ve Celle'nin isimleriyle ilgili külliyelerin şerhi bağlamındayız."], [17.9, "Bu derste on külliyemiz var;"], [20.4, "kolaylığa göre biraz daha fazla da olabilir."]]}, {"reader": false, "ar": [[24.0, "الكلّيّة الأولى: <b>كلُّ اسمٍ من أسماء الله فإنه يستلزم معنى الاسم الآخر.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [33.0, "<b>كلُّ اسمٍ من أسماء الله عز وجل فإنه يستلزم معنى الاسم الآخر.<\/b>"]], "tr": [[24.0, "<b>1. külliye: Allah'ın isimlerinden her isim, diğer ismin anlamını gerektirir (istilzam eder).<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [33.0, "<b>1. külliye: Allah Azze ve Celle'nin isimlerinden her isim, diğer ismin anlamını gerektirir.<\/b>"]]}, {"reader": false, "ar": [[45.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرِّر في القواعد عند أهل السنّة والجماعة أنّ أسماء الله عز وجل يدلّ بعضُها على بعض بدلالة التضمّن والمطابقة والتلازم،"], [60.0, "فهي ثلاثُ دلالاتٍ عند الأصوليّين."], [64.0, "فأمّا دلالة المطابقة فهي دلالة اللفظ على كلّ معناه،"], [71.0, "وأمّا دلالة التضمّن فهي دلالة اللفظ على بعض معناه،"], [76.0, "وأمّا دلالة التلازم فهي دلالة اللفظ على لازم معناه."]], "tr": [[45.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi şudur:"], [47.0, "Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşik olan, Allah Azze ve Celle'nin isimlerinin tazammun, mutâbakat ve telâzüm delâletiyle birbirine delâlet etmesidir."], [59.2, "Usûlcülere göre bunlar üç delâlettir."], [64.0, "Mutâbakat delâleti, lafzın anlamının tamamına delâletidir;"], [69.0, "tazammun delâleti, lafzın anlamının bir kısmına delâletidir;"], [74.3, "telâzüm delâleti ise lafzın, anlamının lâzımına (gerektirdiği şeye) delâletidir."]]}, {"reader": false, "ar": [[82.0, "كدلالة لفظ «البيت» على كلّ أجزائه،"], [86.0, "فهذا دلالة مطابقة. وكدلالته على السقف فقط،"], [90.0, "أو على الجدران فقط،"], [92.3, "أو على الأرضيّة فقط،"], [94.6, "أو على غرفةٍ من غرفه فقط،"], [98.0, "فهذه دلالة تضمّن؛ يعني أنّ ممّا يتضمّنه البيتُ هذا الشيء."], [106.0, "ودلالته على وجود بانٍ بناه،"], [109.1, "هذا دلالة تلازم. ودلالة لفظ البيت على وجود عَقْدٍ عَقَدَه <span class=\"q\">؟ 01:51<\/span> أيضًا دلالة تلازم."], [118.0, "ودلالة البيت على زمنيّةٍ في بنائه أيضًا دلالة تلازم."], [125.0, "فاللفظة العربيّة تدلّ على كامل معناها دلالة مطابقة،"], [131.0, "وتدلّ على جزء معناها دلالة تضمّن،"], [135.0, "وتدلّ على لوازم معناها دلالة تلازم."]], "tr": [[82.0, "Tıpkı \"ev\" lafzının bütün parçalarına delâleti gibi;"], [87.7, "bu mutâbakat delâletidir. Sadece tavana, sadece duvarlara, sadece zemine veya odalarından sadece bir odaya delâleti ise tazammun delâletidir;"], [100.1, "yani bu şey, evin kapsadığı şeylerdendir."], [106.0, "Onu inşa eden bir inşaatçının varlığına delâleti telâzüm delâletidir."], [111.0, "\"Ev\" lafzının, onu kuran bir akdin (?) <span class=\"q\">؟<\/span> varlığına delâleti de telâzüm delâletidir."], [118.0, "Evin, inşasında geçen bir zaman dilimine delâleti de telâzüm delâletidir."], [125.0, "Arapça lafız anlamının tamamına mutâbakat delâletiyle, anlamının bir parçasına tazammun delâletiyle, anlamının lâzımlarına da telâzüm delâletiyle delâlet eder."]]}, {"reader": false, "ar": [[141.0, "وكذلك في أسماء الله عز وجل؛"], [144.0, "فإنك تستطيع بالاسم الواحد تستخرج معانيَ أسماءٍ كثيرة."], [150.0, "كاسم الله الأحسن «الله»؛"], [155.0, "فإنه يدلّ على ذات الله وعلى صفة الألوهيّة دلالة مطابقة،"], [161.0, "ويدلّ على الذات وحدها أو على الألوهيّة وحدها دلالة تضمّن؛"], [169.0, "أي أنّ اسم «الله» يدلّ على الذات ويدلّ على صفة الألوهيّة،"], [177.0, "فدلالته على الوجهين مطابقة،"], [181.0, "ودلالته على واحدٍ منهما دلالة تضمّن."]], "tr": [[141.0, "Allah Azze ve Celle'nin isimlerinde de durum böyledir:"], [144.0, "Tek bir isimden pek çok ismin anlamını çıkarabilirsin."], [150.0, "Mesela Allah'ın en güzel ismi olan \"Allah\" ismi, Allah'ın zâtına ve ulûhiyyet sıfatına mutâbakat delâletiyle delâlet eder;"], [161.7, "sadece zâta veya sadece ulûhiyyete ise tazammun delâletiyle delâlet eder."], [169.0, "Yani \"Allah\" ismi zâta da ulûhiyyet sıfatına da delâlet eder;"], [175.9, "iki yöne birlikte delâleti mutâbakattır, bunlardan birine delâleti tazammun delâletidir."]]}, {"reader": false, "ar": [[184.0, "لكن هناك دلالاتٌ تلازميّة في هذا الاسم:"], [191.0, "فالله عز وجل من لوازم هذا الاسم أن يكون عليًّا،"], [197.0, "فإنّ الربّ لا يكون في أسفل."], [199.0, "ومن لوازم الربوبيّة كمالُ القدرة،"], [203.0, "فإنّ الربّ لا يكون ضعيفًا."], [205.0, "ومن لوازم هذا الاسم أن يكون سميعًا،"], [209.0, "بصيرًا، حيًّا، مُريدًا، إلى غير ذلك."], [216.0, "بل لو أنك رأيت أسماء الله عز وجل بصفاتها فإنك تجدها تدخل تحت هذا الاسم،"], [224.0, "حتى قال بعضُ أهل العلم بأنّ هذا هو اسم الله الأعظم."], [228.0, "لماذا؟ لأنه بدلالة التلازم فيه يدلّ على كلّ ما يستحقّه الله عز وجل من أسماء ألوهيّته،"], [236.9, "وأسماء ربوبيّته، وأسماء رأفته ورحمته،"], [240.3, "وأسماء عدله وحكمته، إلى غير ذلك من الأسماء التي يستحقّها الله عز وجل."]], "tr": [[184.0, "Fakat bu isimde telâzüm delâletleri de vardır:"], [191.0, "Allah Azze ve Celle'nin, bu ismin lâzımlarından biri, yüce (Aliyy) olmasıdır;"], [199.0, "çünkü Rab aşağıda olmaz. Rubûbiyyetin lâzımlarından biri kudretin kemalidir;"], [205.0, "çünkü Rab zayıf olmaz. Bu ismin lâzımlarından biri de işiten, gören, diri ve irade eden olması ve benzerleridir."], [216.0, "Hatta Allah Azze ve Celle'nin isimlerine sıfatlarıyla birlikte baksan, onların bu ismin altına girdiğini görürsün;"], [224.0, "öyle ki bazı ilim ehli bunun Allah'ın İsm-i A'zam'ı olduğunu söylemiştir."], [228.0, "Neden? Çünkü içindeki telâzüm delâletiyle, Allah Azze ve Celle'nin hak ettiği her şeye delâlet eder:"], [235.8, "ulûhiyyet isimlerine, rubûbiyyet isimlerine, re'fet ve rahmet isimlerine, adalet ve hikmet isimlerine ve Allah Azze ve Celle'nin hak ettiği diğer isimlere."]]}, {"reader": false, "ar": [[248.0, "ولو أنك أيضًا نظرت إلى اسم الله «الحيّ» لوجدتَه يدلّ على ذات الله وعلى صفة الحياة دلالة مطابقة،"], [259.0, "ولرأيتَه يدلّ على الذات وحدها أو صفة الحياة وحدها دلالة تضمّن."], [268.0, "لكنّ لوازم هذا الاسم كثيرةٌ جدًّا؛"], [272.0, "فإنّ هذا الاسم يدلّ على صفة الحياة الكاملة التي لم تُسبَق بعدمٍ ولا يلحقها زوال،"], [281.0, "ويدلّ كذلك على أنه حيٌّ سميعٌ بصيرٌ قدير،"], [289.0, "إلى غير ذلك من موجِبات صفة الحياة الكاملة."], [293.0, "فإنّنا إذا كنّا نصف الله بالحياة الكاملة فلا بدّ أن تكون حياةً فيها سمعٌ وبصرٌ وكمالٌ وقدرةٌ وعلوٌّ وقهرٌ وغَلَبٌ،"], [303.9, "وغير ذلك من الأسماء،"]], "tr": [[248.0, "Allah'ın \"el-Hayy\" (Diri) ismine de baksan, onun Allah'ın zâtına ve hayat sıfatına mutâbakat delâletiyle delâlet ettiğini, sadece zâta veya sadece hayat sıfatına tazammun delâletiyle delâlet ettiğini görürsün."], [268.0, "Fakat bu ismin lâzımları pek çoktur:"], [272.0, "Bu isim, öncesinde yokluk bulunmayan ve arkasından zeval gelmeyen kâmil hayat sıfatına delâlet eder."], [280.1, "Aynı şekilde O'nun diri, işiten, gören, kudret sahibi olduğuna ve kâmil hayat sıfatının gerektirdiği diğer şeylere delâlet eder."], [293.0, "Çünkü biz Allah'ı kâmil hayatla niteliyorsak, bu hayatın içinde işitme, görme, kemal, kudret, yücelik, kahr, galebe ve diğer isimlerin bulunması gerekir —"]]}]}, {"ts": "05:08", "title": "1. Külliye (devam): el-Hayy ve el-Kayyûm isimleri, İsm-i A'zam", "paras": [{"reader": false, "ar": [[308.0, "وغير ذلك من الصفات."], [311.0, "حتى قال أهلُ العلم بأنّ جميع الصفات الذاتيّة التي يُوصَف الله عز وجل بها كلُّها تدخل ويتضمّنها اسمُ الله «الحيّ»،"], [321.0, "فهو يدلّ عليها بدلالة التلازم؛"], [323.0, "إذ إنّ من مقتضى إثبات الحياة الكاملة لله عز وجل أن يكون موصوفًا بكلّ الصفات الذاتيّة الكاملة من كلّ وجه."]], "tr": [[308.0, "— ve diğer sıfatların. Öyle ki ilim ehli, Allah Azze ve Celle'nin nitelendiği bütün zâtî sıfatların hepsinin Allah'ın \"el-Hayy\" isminin altına girdiğini ve bu ismin onları kapsadığını söylemiştir;"], [320.3, "bu isim onlara telâzüm delâletiyle delâlet eder."], [323.0, "Zira Allah Azze ve Celle'ye kâmil hayatı isbat etmenin gereği, O'nun her yönden kâmil olan bütün zâtî sıfatlarla nitelenmiş olmasıdır."]]}, {"reader": false, "ar": [[331.0, "ومثالٌ ثالث: اسم الله عز وجل «القيّوم»؛"], [337.0, "فإنه يدلّ على الذات وعلى صفة القيّوميّة المطلقة دلالة مطابقة،"], [346.0, "ويدلّ على الذات وحدها دلالة تضمّن،"], [351.0, "ويدلّ على القيّوميّة وحدها دلالة تضمّن."], [356.0, "لكنّ دلالة التلازم ـ وهي أوسع الدلالات ـ فإنّ أهل العلم يقولون بأنّ من لوازم «القيّوم» اسمًا و«القيّوميّة» صفةً:"], [367.0, "كلَّ الصفات الفعليّة، كالرضا والنزول والرحمة والتوبة،"], [378.0, "وكذلك الغضب والكراهية والمقت،"], [380.8, "وغيرها من صفات الله الفعليّة."]], "tr": [[331.0, "Üçüncü bir örnek: Allah Azze ve Celle'nin \"el-Kayyûm\" ismi."], [337.0, "Bu isim zâta ve mutlak kayyûmiyyet sıfatına mutâbakat delâletiyle, sadece zâta tazammun delâletiyle, sadece kayyûmiyyete de tazammun delâletiyle delâlet eder."], [349.8, "Fakat telâzüm delâleti —ki delâletlerin en genişidir— (şöyledir):"], [356.0, "İlim ehli, isim olarak \"el-Kayyûm\"un ve sıfat olarak \"kayyûmiyyet\"in lâzımlarından birinin bütün fiilî sıfatlar olduğunu söyler:"], [367.0, "rıza, nüzul, rahmet ve tövbe (kabulü) gibi;"], [370.7, "aynı şekilde gazap, kerahet (hoşlanmama), makt (şiddetli buğz) ve Allah'ın diğer fiilî sıfatları."]]}, {"reader": false, "ar": [[387.0, "فأنت ترى أنّ اسم الله «الحيّ» يدخل فيه لزومًا ـ يدخل فيه تلازمًا ـ كلُّ الصفات الذاتيّة،"], [396.0, "وأنّ اسم الله «القيّوم» يدخل فيه تلازمًا كلُّ الصفات الفعليّة."], [405.0, "فلو جمعتَ بين هذه الأسماء الثلاثة:"], [408.4, "التي هي «الله» الذي يدلّ على الشيئين جميعًا،"], [413.0, "الذاتيّة والفعليّة، ورأيتَ اسم الله «الحيّ» الذي يدلّ على الذاتيّة،"], [419.0, "ورأيتَ اسم الله «القيّوم» الذي يدلّ على الفعليّة،"], [424.2, "لوجدتَ هذه الأسماء الثلاثة هي الواردة في حديث اسم الله الأعظم."]], "tr": [[387.0, "Görüyorsun ki Allah'ın \"el-Hayy\" isminin içine lüzum yoluyla —telâzüm yoluyla— bütün zâtî sıfatlar girer;"], [395.4, "Allah'ın \"el-Kayyûm\" isminin içine de telâzüm yoluyla bütün fiilî sıfatlar girer."], [405.0, "Bu üç ismi bir araya getirsen:"], [408.4, "hem zâtî hem fiilî olmak üzere iki şeye birden delâlet eden \"Allah\" ismini, zâtî sıfatlara delâlet eden Allah'ın \"el-Hayy\" ismini ve fiilî sıfatlara delâlet eden Allah'ın \"el-Kayyûm\" ismini görsen, bu üç ismin İsm-i A'zam hadisinde geçen isimler olduğunu bulursun."]]}, {"reader": false, "ar": [[430.0, "فما من شيءٍ من مقتضيات ربوبيّة الله وألوهيّته إلا ولا بدّ أن يكون داخلًا تحت اسم الله «الله»،"], [440.2, "أو تحت الاسم الأحسن «الله»."], [443.0, "وما من صفةٍ ذاتيّةٍ إلا وهي داخلةٌ تحت اسم الله «الحيّ»،"], [448.5, "وما من صفةٍ فعليّةٍ إلا وهي داخلةٌ تحت اسم الله «القيّوم»."], [454.0, "وهذا القول الصحيح عندي،"], [456.3, "وهو أنّ اسم الله الأعظم هو مجموع هذه الأسماء الثلاثة،"], [462.0, "واختاره أبو العبّاس ابن تيميّة،"], [464.1, "وتلميذُه الإمام العلّامة ابن القيّم،"], [466.3, "وغيرُهم من أهل العلم،"], [468.0, "ويدلّ عليها الأحاديث المعروفة لديكم."], [472.0, "وقد تواترت النقولُ عن أهل العلم رحمهم الله تعالى في تقرير هذه القاعدة العظيمة."]], "tr": [[430.0, "Allah'ın rubûbiyyetinin ve ulûhiyyetinin gereklerinden hiçbir şey yoktur ki \"Allah\" isminin, yani en güzel isim olan \"Allah\"ın altına girmesin."], [443.0, "Hiçbir zâtî sıfat yoktur ki Allah'ın \"el-Hayy\" isminin altına girmesin;"], [448.5, "hiçbir fiilî sıfat yoktur ki Allah'ın \"el-Kayyûm\" isminin altına girmesin."], [454.0, "Bence sahih görüş budur: Allah'ın İsm-i A'zam'ı bu üç ismin toplamıdır."], [460.3, "Bunu Ebü'l-Abbâs İbn Teymiyye, talebesi imam allâme İbnü'l-Kayyim ve diğer ilim ehli tercih etmiştir;"], [466.7, "sizin bildiğiniz hadisler de buna delâlet eder."], [472.0, "Bu büyük kaideyi takrir hususunda ilim ehlinden —Allah onlara rahmet etsin— nakiller tevâtür derecesindedir."]]}, {"reader": false, "ar": [[478.0, "ولكن من المعلوم أنّ الناس قد لا يتفاوتون في دلالة المطابقة،"], [485.0, "وقد لا يتفاوتون في دلالة التضمّن،"], [488.0, "وأمّا دلالة التلازم فهي محطُّ الشرح،"], [492.0, "وهي محطُّ فتوح الربّ عز وجل على الإنسان."], [496.0, "فقد يستنبط الإنسانُ ـ بعظيم فضل الله وفتوحاته عليه ـ من الاسم الواحد أشياءَ كثيرةً ممّا يدخل تحت دائرة التلازم."]], "tr": [[478.0, "Fakat bilinen şudur ki insanlar mutâbakat delâletinde birbirinden farklılaşmayabilir, tazammun delâletinde de farklılaşmayabilir."], [486.5, "Telâzüm delâleti ise şerhin odağıdır ve Rabb Azze ve Celle'nin insana (ilim) kapılarını açtığı yerdir."], [496.0, "İnsan, Allah'ın büyük lütfu ve ona açtığı kapılar sayesinde tek bir isimden, telâzüm dairesine giren pek çok şey istinbat edebilir."]]}, {"reader": false, "ar": [[508.0, "قال الإمام ابن تيميّة رحمه الله تعالى:"], [512.0, "«كلُّ اسمٍ من أسماء الله فإنه يستلزم معنى الآخر؛ فإنه يدلّ على الذات، والذاتُ تستلزم معنى الاسم الآخر، لكن هذا باللزوم. وأمّا دلالة كلّ اسمٍ على خاصّيّته وعلى الذات بمجموعهما فبالمطابقة، ودلالتها على أحدهما بالتضمّن». كلامٌ واضح."]], "tr": [[508.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [512.0, "\"Allah'ın isimlerinden her isim diğerinin anlamını gerektirir;"], [515.3, "çünkü zâta delâlet eder, zât da diğer ismin anlamını gerektirir."], [520.3, "Fakat bu, lüzum yoluyladır. Her ismin kendine has (anlamına) ve zâta birlikte delâleti ise mutâbakat yoluyla, bunlardan birine delâleti tazammun yoluyladır.\" Açık bir söz."]]}, {"reader": false, "ar": [[532.0, "وقال ابن القيّم رحمه الله تعالى:"], [537.0, "«الاسم من أسمائه له دلالات: دلالةٌ على الذات والصفة بالمطابقة، ودلالةٌ على أحدهما بالتضمّن، ودلالةٌ على الصفة الأخرى باللزوم». انتهى كلامه."]], "tr": [[532.0, "İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [537.0, "\"O'nun isimlerinden bir ismin (birkaç) delâleti vardır:"], [540.0, "Zâta ve sıfata mutâbakat yoluyla delâlet, bunlardan birine tazammun yoluyla delâlet ve diğer sıfata lüzum yoluyla delâlet.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[553.0, "وقال أيضًا رحمه الله:"], [557.0, "«الاسم من أسمائه تبارك وتعالى كما يدلّ على الذات والصفة التي اشتُقّ منها بالمطابقة، فإنه يدلّ دلالتين أُخريين بالتضمّن واللزوم: فيدلّ على الصفة بمفردها بالتضمّن، وكذلك على الذات المجرّدة عن الصفة، ويدلّ على الصفة الأخرى باللزوم. فإنّ اسم \"السميع\" ـ انتبهوا ـ يدلّ على ذات الربّ وسمعه بالمطابقة، وعلى الذات وحدها وعلى السمع وحده بالتضمّن، ويدلّ على اسم \"الحيّ\" وصفة الحياة بالالتزام. وكذلك سائر أسمائه وصفاته». انتهى كلامه."]], "tr": [[553.0, "Yine o —Allah ona rahmet etsin— şöyle demiştir:"], [557.6, "\"O Tebâreke ve Teâlâ'nın isimlerinden bir isim, zâta ve kendisinden türetildiği sıfata mutâbakat yoluyla delâlet ettiği gibi, tazammun ve lüzum yoluyla iki delâlet daha eder:"], [567.8, "Tek başına sıfata tazammun yoluyla delâlet eder, aynı şekilde sıfattan soyutlanmış zâta da;"], [577.0, "diğer sıfata ise lüzum yoluyla delâlet eder."], [579.8, "Mesela \"es-Semî'\" (İşiten) ismi —dikkat edin— Rabb'in zâtına ve O'nun işitmesine mutâbakat yoluyla, tek başına zâta ve tek başına işitmeye tazammun yoluyla delâlet eder;"], [590.7, "\"el-Hayy\" ismine ve hayat sıfatına ise iltizam yoluyla delâlet eder."], [597.6, "O'nun diğer isim ve sıfatları da böyledir.\" Sözü burada bitti."]]}]}, {"ts": "10:03", "title": "2. Külliye: Allah'ın her isminin yaratma ve var etmede bir eseri vardır", "paras": [{"reader": false, "ar": [[603.0, "ولو تأمّلتَ في أكثر من يشرح أسماء الله عز وجل ويُبيّن دلالاتها ومقتضياتها،"], [612.0, "لوجدتَه يشرحها بأيّ دلالة؟"], [614.0, "بدلالة التلازم. فانتبهوا لذلك."]], "tr": [[603.0, "Allah Azze ve Celle'nin isimlerini şerh eden, onların delâletlerini ve gereklerini açıklayanların çoğuna baksan, onları hangi delâletle şerh ettiğini görürsün?"], [614.0, "Telâzüm delâletiyle. Buna dikkat edin."]]}, {"reader": false, "ar": [[618.0, "ومن الكلّيّات أيضًا: <b>كلُّ اسمٍ من أسماء الله تعالى فله أثرُه في الخلق والتكوين.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [651.0, "<b>كلُّ اسمٍ من أسماء الله تعالى فله أثرُه في الخلق والتكوين.<\/b>"]], "tr": [[618.0, "Külliyelerden biri de şudur: 2."], [621.0, "külliye: Allah Teâlâ'nın isimlerinden her ismin, yaratma ve var etmede (tekvîn) kendine ait bir eseri vardır. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [651.0, "<b>2. külliye: Allah Teâlâ'nın isimlerinden her ismin, yaratma ve var etmede kendine ait bir eseri vardır.<\/b>"]]}, {"reader": false, "ar": [[656.0, "أقول وبالله التوفيق: المتقرِّر عند أهل السنّة والجماعة أنّ الواجب علينا في أسماء الله عز وجل ثلاثةُ أمور:"], [666.0, "أن نُسمّي ـ أن نُطلقها اسمًا على الله عز وجل،"], [671.0, "وأن نؤمن بالصفة التي تضمّنها ذلك الاسم،"], [677.0, "وهذان الأمران قد مضت قواعدُها أو كلّيّاتُها."], [682.0, "ولكنّ هذه الكلّيّة التي معنا والتي بعدها هي في الأمر الثالث،"], [688.0, "وهي في أن نتعبّد لله عز وجل بمقتضيات هذه الأسماء."]], "tr": [[656.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat'e göre yerleşik olan şudur:"], [660.7, "Allah Azze ve Celle'nin isimleri hakkında üzerimize vacip olan üç şey vardır:"], [666.0, "(Onlarla Allah'ı) isimlendirmemiz —yani onları Allah Azze ve Celle'ye isim olarak itlak etmemiz— ve o ismin kapsadığı sıfata iman etmemiz."], [677.7, "Bu iki hususun kaideleri veya külliyeleri geçti."], [682.0, "Fakat elimizdeki bu külliye ve ondan sonraki, üçüncü husus hakkındadır:"], [687.5, "O da bu isimlerin gerekleriyle Allah Azze ve Celle'ye kulluk etmemizdir."]]}, {"reader": false, "ar": [[695.0, "وهذه الأسماء وجهُ التعبّد بها ينقسم إلى قسمين:"], [702.0, "إلى النظر في آثارها في الخلق والتكوين؛"], [707.0, "فإنّ كلّ شيءٍ تراه أعيننا،"], [709.5, "وكلّ شيءٍ في هذا الكون،"], [712.0, "لا بدّ أن يكون راجعًا إلى شيءٍ من أسمائه عز وجل،"], [716.0, "فلأسمائه أثرٌ عظيمٌ في هذا الخلق الذي نراه،"], [720.3, "وفي هذا الكون الذي نراه،"], [723.0, "وهذا محطُّ رحال كلّيّتنا هذه."], [725.0, "وأمّا الكلّيّة التي بعدها فهي:"], [728.3, "كيف نتعبّد لله عز وجل بهذه الأسماء."], [733.0, "فإذًا لأسمائه أثرٌ في الخلق والتكوين،"], [736.0, "ولأسمائه أثرٌ في التعبّد."]], "tr": [[695.0, "Bu isimlerle kulluk etmenin yönü iki kısma ayrılır:"], [702.0, "(Birincisi) onların yaratma ve var etmedeki eserlerine bakmaktır."], [707.0, "Gözlerimizin gördüğü her şey ve bu kâinattaki her şey mutlaka O Azze ve Celle'nin isimlerinden birine dayanır."], [714.9, "O'nun isimlerinin, gördüğümüz bu yaratılışta ve gördüğümüz bu kâinatta büyük bir eseri vardır;"], [722.5, "bu külliyemizin asıl konusu budur."], [725.0, "Ondan sonraki külliye ise bu isimlerle Allah Azze ve Celle'ye nasıl kulluk edeceğimiz hakkındadır."], [733.0, "Demek ki O'nun isimlerinin yaratma ve var etmede bir eseri, kullukta da bir eseri vardır."]]}, {"reader": false, "ar": [[738.0, "وبما أنّ هذه الكلّيّة تتكلّم عن آثار أسماء الله عز وجل في الخلق والتكوين،"], [746.0, "فقد نصّ أهلُ السنّة بأنّ كلّ اسمٍ من أسمائه فلا بدّ وأن يكون له أثرٌ في هذا."], [752.0, "كاسم الله «القدير»؛ فإنك لو تأمّلتَ هذا الكون على كِبَر حجمه،"], [758.5, "وعِظَم أفلاكه في سمائه وما فيها من النجوم،"], [764.7, "وفي أرضه وما فيها من البحار والأشجار والجبال،"], [770.0, "لوجدتَ أنّ الذي خلقها لا بدّ أن يكون قديرًا قادرًا مقتدرًا."], [775.0, "فانظر كيف أثّر اسمُ الله «القدير» وصفتُه القدرة في هذا الخلق العظيم؛"], [781.0, "إذ لا يمكن أن يكون العاجزُ خالقًا."]], "tr": [[738.0, "Bu külliye Allah Azze ve Celle'nin isimlerinin yaratma ve var etmedeki eserlerinden bahsettiğine göre (şunu söyleyelim):"], [747.5, "Ehl-i Sünnet, O'nun isimlerinden her ismin mutlaka bunda bir eseri olduğunu açıkça belirtmiştir."], [753.0, "Mesela Allah'ın \"el-Kadîr\" ismi: Bu kâinatı, hacminin büyüklüğüyle, göğündeki feleklerin ve içindeki yıldızların azametiyle, yerindeki denizler, ağaçlar ve dağlarla birlikte düşünsen, onu yaratanın mutlaka kadîr, kâdir ve muktedir olması gerektiğini görürsün."], [775.0, "Bak, Allah'ın \"el-Kadîr\" ismi ve kudret sıfatı bu büyük yaratılışta nasıl eser bırakmış;"], [781.0, "zira âciz olanın yaratıcı olması mümkün değildir."]]}, {"reader": false, "ar": [[784.0, "ولو تأمّلتَ في هذا الكون في إحكامه ـ أي في إحكام خلقه ـ وفي بديع صُنعه:"], [793.0, "ملايينُ المجرّات التي تحمل ملياراتِ الكواكب والنجوم،"], [799.0, "لا يصطدم بعضُها ببعض،"], [801.0, "كلٌّ يجري في نظامٍ بديع،"], [803.5, "على نسقٍ رفيع، لا يتبدّل ولا يتغيّر،"], [807.0, "ولا يزيد ولا ينقص،"], [809.0, "حتى صار أهلُ الفلك والهيئة يستخرجون تقاويمَ مئات السنين القادمة؛"], [815.0, "لأنه كونٌ مُحكَم. فهذا كلُّه أثرٌ من آثار اسمه «الحكيم» «الخبير» «العليم»؛"], [825.0, "إذ إنّ الذي ليس بحكيمٍ ولا بعليمٍ ولا بخبيرٍ لا يمكن أن يخلق شيئًا متقنًا كهذا."]], "tr": [[784.0, "Bu kâinatın ihkâmını —yani yaratılışının sağlamlığını— ve sanatının eşsizliğini düşünsen:"], [788.5, "Milyarlarca gezegen ve yıldızı taşıyan milyonlarca galaksi birbiriyle çarpışmaz;"], [793.0, "her biri eşsiz bir düzen içinde, yüksek bir nizam üzere akar;"], [802.0, "değişmez, başkalaşmaz, artmaz ve eksilmez."], [805.0, "Öyle ki astronomi ve hey'et ilmi ehli, gelecek yüzlerce yılın takvimlerini çıkarır hâle gelmiştir;"], [815.0, "çünkü sağlam kurulmuş bir kâinattır."], [817.0, "Bütün bunlar O'nun \"el-Hakîm\", \"el-Habîr\", \"el-Alîm\" isminin eserlerinden bir eserdir."], [825.0, "Zira hakîm, alîm ve habîr olmayan, bunun gibi itkanlı (sağlam ve kusursuz) bir şey yaratamaz."]]}, {"reader": false, "ar": [[832.0, "ولذلك أمرنا الله عز وجل بأن نتفكّر في السماوات والأرض؛"], [838.0, "لأنّ التفكّر سيدلّنا على هذه الأسماء التي بمعرفتها نعرف المسمّى بها،"], [844.4, "فندين له بالعبوديّة والطاعة."], [846.0, "بل يا رجل، لو تأمّلتَ إلى المصالح العظيمة في كثيرٍ من هذه المخلوقات؛"], [853.0, "فإنّ الله عز وجل إنما نظر مصلحةَ عباده ومنافعَهم في دينهم ودنياهم."]], "tr": [[832.0, "Bu yüzden Allah Azze ve Celle bize göklerde ve yerde tefekkür etmemizi emretti;"], [838.0, "çünkü tefekkür bizi, bilinmeleriyle onlarla isimlendirileni tanıdığımız bu isimlere götürecek;"], [842.8, "biz de O'na kulluk ve itaatle bağlanacağız."], [846.0, "Hatta ey adam, bu mahlûkatın birçoğundaki büyük maslahatları düşünsen (görürsün ki) Allah Azze ve Celle kullarının dinlerinde ve dünyalarındaki maslahatlarını ve menfaatlerini gözetmiştir."]]}, {"reader": false, "ar": [[859.0, "فلو تأمّلتَ إلى حركة الشمس وارتباطها بمواقيت الصلاة ابتداءً وانتهاءً،"], [865.1, "لوجدتَ أنّ وراءها ربًّا رحيمًا لا يريد أن يُضيّع عبادَه في معرفة الأوقات."], [870.0, "ولو تأمّلتَ إلى بُعد الأرض من الشمس لوجدتَ أنّ الذي قدّر المسافة بينهما ربًّا رحيمًا رؤوفًا بعباده ودودًا،"], [881.7, "لا يريد أن تُحرقهم بقربها،"], [884.3, "ولا أن يتجمّدوا ببعدها عنهم."], [887.0, "ولو تأمّلتَ إلى خلق هذه البهائم وكونها قد سُخّرت للإنس ومنافعهم،"], [895.0, "لوجدتَ أنه يقف وراءها ربٌّ كريمٌ عظيمٌ غنيّ،"], [900.0, "يريد أن ينفع عبادَه بمثل ذلك."]], "tr": [[859.0, "Güneşin hareketini ve onun başlangıç ve bitişiyle namaz vakitlerine bağlanmasını düşünsen, arkasında kullarını vakitleri bilme konusunda şaşkın bırakmak istemeyen merhametli bir Rab olduğunu görürsün."], [870.0, "Yerin güneşe olan uzaklığını düşünsen, aradaki mesafeyi takdir edenin kullarına karşı merhametli, şefkatli ve sevgi dolu (Vedûd) bir Rab olduğunu görürsün;"], [882.2, "güneşin yakınlığıyla onları yakmasını da uzaklığıyla donmalarını da istemez."], [887.0, "Bu hayvanların yaratılışını ve onların insanlara ve menfaatlerine boyun eğdirilmiş olmasını düşünsen, arkalarında kullarına bu gibi şeylerle fayda vermek isteyen kerîm, azîm ve ganî bir Rabbin durduğunu görürsün."]]}]}, {"ts": "15:03", "title": "2. Külliye (devam): Cenin, kâinattaki her mahlûkun bir isme dayanması", "paras": [{"reader": false, "ar": [[903.0, "ولو تأمّلتَ إلى خلق الجنين،"], [906.0, "وكيفيّة تنقّله من طبقٍ إلى طبق،"], [910.0, "في حالٍ لا يجوع أبدًا ـ فالجنين لا يجوع في بطن أمّه،"], [915.0, "إنما يجوع إذا خرج من بطن أمّه ـ فلا يموت جوعًا ولا يموت عطشًا،"], [924.0, "ولا يزال يتقلّب في هذا القرار المكين،"], [927.0, "يُقلّبه الله عز وجل طبقًا عن طبق،"], [929.0, "وكلُّ ذلك من خلقه الذي يدلّ على أنه ودودٌ رؤوفٌ رحيم."]], "tr": [[903.0, "Ceninin yaratılışını ve onun hiç acıkmadığı bir hâlde bir tabakadan diğerine nasıl geçtiğini düşünsen —cenin annesinin karnında acıkmaz, ancak annesinin karnından çıkınca acıkır—;"], [917.3, "açlıktan ölmez, susuzluktan ölmez; bu sağlam yerleşim yerinde dönüp durur;"], [925.3, "Allah Azze ve Celle onu tabakadan tabakaya çevirir."], [928.4, "Bütün bunlar O'nun Vedûd, Raûf ve Rahîm olduğuna delâlet eden yaratmasındandır."]]}, {"reader": false, "ar": [[934.0, "وهكذا لو تأمّلتَ في كلّ هذا الكون،"], [938.0, "فإنّ كلّ مخلوقٍ من المخلوقات لا بدّ وأن يرجع ـ إمّا في أصل خلقه،"], [944.6, "وإمّا في إبداعه، وإمّا في إحكامه،"], [947.0, "وإمّا في عِظَم منافعه وكبير مصالحه ـ إلى شيءٍ من أسماء الله عز وجل."], [953.0, "وهذا وإن كان داخلًا تحت تفكّر الربوبيّة،"], [960.0, "إلا أنه من أعظم الوسائل التي توصلنا إلى الإقرار بالألوهيّة."]], "tr": [[934.0, "Bütün bu kâinatı düşünsen de böyledir:"], [938.0, "Mahlûkattan her mahlûk —ya yaratılışının aslında, ya eşsiz yaratılmasında, ya sağlamlığında, ya da menfaatlerinin büyüklüğünde ve maslahatlarının çokluğunda— mutlaka Allah Azze ve Celle'nin isimlerinden birine dayanır."], [953.0, "Bu, rubûbiyyet tefekkürünün altına girse de, bizi ulûhiyyeti ikrar etmeye ulaştıran en büyük vesilelerdendir."]]}, {"reader": false, "ar": [[966.0, "ولذلك أمرنا الله أن نتفكّر في السماوات،"], [969.2, "وفي الأرض، وفي الجبال،"], [971.1, "وفي البحار، وفي أنفسنا،"], [973.3, "وفي الأجنّة، وفي هذه المخلوقات العلويّة والسفليّة؛"], [978.0, "كلُّ ذلك ليستدلّ العاقلُ بهذا النظر إلى أنّ وراءه ربًّا رحيمًا،"], [985.8, "قديرًا، عفوًّا، غفورًا، ودودًا،"], [989.3, "قويًّا، قاهرًا، فيستدلّ بهذه المخلوقات على أسمائه التي تدلّه على استحقاق هذا الربّ للألوهيّة وحده لا شريك له. أفهمتم هذا؟"]], "tr": [[966.0, "Bu yüzden Allah bize göklerde, yerde, dağlarda, denizlerde, kendi nefislerimizde, ceninlerde ve bu yukarıdaki ve aşağıdaki mahlûkatta tefekkür etmemizi emretti."], [978.0, "Bütün bunlar, akıllı kişi bu bakışla arkasında merhametli, kudretli, affedici, bağışlayıcı, sevgi dolu, kuvvetli ve kahredici bir Rab olduğuna istidlal etsin diyedir."], [991.7, "Böylece bu mahlûkattan, bu Rabbin tek başına, ortağı olmaksızın ulûhiyyete layık olduğunu gösteren isimlerine istidlal eder. Bunu anladınız mı?"]]}, {"reader": false, "ar": [[1004.0, "فإذًا مجرّدُ هذا النظر عبادة؛"], [1007.0, "لأنّ كلّ مخلوقٍ لا بدّ وأن يكون مؤثِّرًا فيه ـ لا بدّ وأن يكون المؤثِّرُ فيه هو اسمٌ من أسماء الله عز وجل."], [1020.0, "وطوبى لمن يسّر الله عز وجل له أن يردّ كلّ مخلوقٍ إلى الاسم المناسب له،"], [1028.0, "إلى الاسم المناسب له. إيه، الله المستعان."]], "tr": [[1004.0, "Demek ki bu bakışın kendisi bir ibadettir;"], [1008.3, "çünkü her mahlûkta mutlaka eser bırakan —onda eser bırakan mutlaka Allah Azze ve Celle'nin isimlerinden bir isimdir."], [1020.0, "Allah Azze ve Celle'nin, her mahlûku kendisine uygun isme, kendisine uygun isme döndürmeyi kolaylaştırdığı kimseye ne mutlu! Evet, yardım Allah'tandır."]]}, {"reader": false, "ar": [[1030.0, "فالعالم كلُّه بما فيه من سماواتٍ وأرض،"], [1034.7, "وشمسٍ وقمر، وليلٍ ونهار،"], [1037.4, "وجبالٍ وبحار، وحركاتٍ وسكنات،"], [1044.0, "كلُّ ذلك من بعض آثار هذه الأسماء الحسنى ومقتضياتها،"], [1049.0, "فهي كلُّها تشير إلى الأسماء الحسنى وحقائقها،"], [1052.8, "تنادي عليها، وتدلّ عليها،"], [1055.0, "وتُخبر بها بلسان النطق والحال."], [1057.0, "والله أعلم. أفهمتم هذا؟"], [1060.0, "هذا التعبّد الأوّل، ولّا لا؟"]], "tr": [[1030.0, "Bütün âlem, içindeki gökler ve yer, güneş ve ay, gece ve gündüz, dağlar ve denizler, hareketler ve durgunluklarla birlikte, bu güzel isimlerin eserlerinden ve gereklerinden bir kısmıdır."], [1047.3, "Hepsi güzel isimlere ve onların hakikatlerine işaret eder;"], [1051.2, "onları ilan eder, onlara delâlet eder ve söz diliyle ve hâl diliyle onları haber verir."], [1057.0, "Allah en iyisini bilir. Bunu anladınız mı?"], [1060.4, "Bu birinci kulluk, değil mi?"]]}]}, {"ts": "17:42", "title": "3. Külliye: Allah'ın her isminin kendine has bir kulluğu vardır", "paras": [{"reader": false, "ar": [[1062.0, "الكلّيّة الثالثة: <b>كلُّ اسمٍ من أسماء الله فله تعبُّدٌ مختصٌّ به.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ اسمٍ من أسماء الله تعالى فله تعبُّدٌ مختصٌّ به.<\/b>"]], "tr": [[1062.0, "3. külliye: Allah'ın isimlerinden her ismin kendine has bir kulluğu (taabbüdü) vardır. (Tekrar ediyor.) 3."], [1067.0, "külliye: Allah Teâlâ'nın isimlerinden her ismin kendine has bir kulluğu vardır."]]}, {"reader": false, "ar": [[1074.0, "فلا ينبغي أن يبقى الإنسانُ متفكّرًا في عِظَم آثار هذه الأسماء على الخلق والتكوين،"], [1092.0, "بل لا بدّ أن ينتقل منها إلى أن يتعبّد لله عز وجل بمقتضى هذه الأسماء؛"], [1098.0, "فإنّ كلّ اسمٍ من أسماء الله فله عبوديّةٌ خاصّة،"], [1103.0, "لا بدّ أن تتعبّد لله عز وجل بها."], [1106.0, "بل إنّ المقصود الأعظم من خلق الإنس والجنّ إنما ليعبدوه بمقتضى أسمائه وصفاته عز وجل."]], "tr": [[1074.0, "İnsanın bu isimlerin yaratma ve var etme üzerindeki eserlerinin büyüklüğünü tefekkür etmekte kalması uygun değildir;"], [1092.4, "bilakis oradan, bu isimlerin gereğiyle Allah Azze ve Celle'ye kulluk etmeye geçmesi gerekir."], [1098.0, "Çünkü Allah'ın isimlerinden her ismin kendine has bir kulluğu vardır;"], [1103.0, "onunla Allah Azze ve Celle'ye kulluk etmen gerekir."], [1106.0, "Hatta insanların ve cinlerin yaratılmasındaki en büyük maksat, O'na, O Azze ve Celle'nin isim ve sıfatlarının gereğiyle kulluk etmeleridir."]]}, {"reader": false, "ar": [[1115.0, "فأكمل الناس عبوديّةً هو المتعبّد لله عز وجل بكافّة أسمائه وصفاته التي يطّلع عليها البشر،"], [1122.9, "والتي أخبرهم بها في كتابه أو صحيح سنّة نبيّه صلى الله عليه وسلم،"], [1129.0, "بحيث لا يحجبه التعبّدُ بالاسم الأوّل عن التعبّد بالاسم الثاني،"], [1136.0, "ولا التعبّدُ بالاسم الثاني عن التعبّد بالاسم الثالث."], [1139.0, "إذ من الناس من لا يتعبّد لله عز وجل إلا ببعضها دون بعضها،"], [1145.0, "فيدخل في قول الله عز وجل:"], [1147.7, "<span class=\"ayah\">﴿أَفَتُؤْمِنُونَ بِبَعْضِ الْكِتَابِ وَتَكْفُرُونَ بِبَعْضٍ﴾<\/span> <span class=\"ref\">[البقرة: ٨٥]<\/span>."]], "tr": [[1115.0, "İnsanların kulluk bakımından en kâmili, beşerin muttali olduğu ve Allah'ın onlara Kitabında veya Peygamberi sallallâhu aleyhi ve sellem'in sahih sünnetinde haber verdiği bütün isim ve sıfatlarıyla Allah Azze ve Celle'ye kulluk edendir;"], [1130.4, "öyle ki birinci isimle kulluk onu ikinci isimle kulluktan, ikinci isimle kulluk da üçüncü isimle kulluktan alıkoymaz."], [1139.0, "Zira insanlardan bazıları Allah Azze ve Celle'ye bu isimlerin yalnızca bir kısmıyla kulluk eder, diğerleriyle etmez;"], [1144.5, "böylece Allah Azze ve Celle'nin şu sözünün kapsamına girer:"], [1147.7, "<span class=\"ayah\">﴿Yoksa siz Kitab'ın bir kısmına inanıp bir kısmını inkâr mı ediyorsunuz?﴾<\/span> [Bakara 85]."]]}, {"reader": false, "ar": [[1150.0, "فإنّ المرجئة يعبدون الله عز وجل بأسماء الرجاء،"], [1154.0, "كالرؤوف والغفور والرحيم، لكن ينسون الأسماء الأخرى فلا يعبدون الله بها."], [1159.0, "والوعيديّة يعبدون الله عز وجل بأسماء الوعيد والعذاب الشديد والعقاب الأليم،"], [1167.0, "ولكن لا يعبدون الله عز وجل بمقتضى أسماء رجائه ومغفرته عز وجل."], [1173.0, "فالسعيد في هذه الدنيا،"], [1175.9, "وأكملُ الناس عبادةً فيها،"], [1179.0, "هو من لا يشغله التعبّدُ باسمٍ عن التعبّد لله عز وجل بالاسم الآخر؛"], [1185.0, "إذ كلُّ اسمٍ فله تعبّدٌ خاصٌّ،"], [1188.0, "ومنزلةٌ وفضلٌ عند الله عز وجل."]], "tr": [[1150.0, "Mürcie, Allah Azze ve Celle'ye Raûf, Gafûr ve Rahîm gibi recâ (ümit) isimleriyle kulluk eder;"], [1156.0, "fakat diğer isimleri unutur ve Allah'a onlarla kulluk etmez."], [1159.0, "Vaîdiyye ise Allah Azze ve Celle'ye tehdit, şiddetli azap ve elem verici ceza isimleriyle kulluk eder;"], [1167.5, "fakat Allah Azze ve Celle'ye O'nun recâ ve mağfiret isimlerinin gereğiyle kulluk etmez."], [1173.0, "Bu dünyada mutlu olan ve burada ibadet bakımından insanların en kâmili, bir isimle kulluğun kendisini diğer isimle Allah Azze ve Celle'ye kulluktan alıkoymadığı kimsedir."], [1184.1, "Zira her ismin kendine has bir kulluğu, Allah Azze ve Celle katında bir makamı ve fazileti vardır."]]}, {"reader": false, "ar": [[1191.0, "ولذلك قال الله عز وجل ـ آمرًا أن نتعبّد له بمقتضى أسمائه وصفاته ـ:"], [1198.0, "<span class=\"ayah\">﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٠]<\/span>."], [1202.0, "وقلتُ لكم: إنّ لفظة «دعا» وما تصرّف منها في القرآن يُراد بها دعاءُ المسألة،"], [1209.0, "أي سؤال الله عز وجل بأسمائه والتوسّل إليه بها،"], [1212.0, "وكذلك يُراد بها دعاءُ العبادة،"], [1216.0, "أي نعبد الله عز وجل بمقتضى هذه الأسماء والصفات."], [1219.0, "فالدعاء في هذه الآية يتناول دعاءَ المسألة،"], [1223.5, "ودعاءَ الثناء، ودعاءَ التعبّد."]], "tr": [[1191.0, "Bu yüzden Allah Azze ve Celle, isim ve sıfatlarının gereğiyle kendisine kulluk etmemizi emrederek şöyle buyurdu:"], [1198.0, "<span class=\"ayah\">﴿En güzel isimler Allah'ındır; O'na onlarla dua edin﴾<\/span> [A'râf 180]."], [1202.0, "Size söylemiştim: Kur'an'da \"dua\" lafzı ve ondan türeyenlerle hem istek duası, yani Allah Azze ve Celle'den isimleriyle istemek ve onlarla O'na tevessül etmek kastedilir;"], [1211.3, "hem de ibadet duası, yani bu isim ve sıfatların gereğiyle Allah Azze ve Celle'ye ibadet etmemiz kastedilir."], [1219.0, "Bu ayetteki dua; istek duasını, senâ duasını ve kulluk duasını kapsar."]]}, {"reader": false, "ar": [[1226.0, "فهو سبحانه وتعالى يدعو عبادَه إلى أن يعرفوه بأسمائه وصفاته،"], [1233.0, "ويُثنوا عليه بها، ويأخذوا بحظّهم من عبوديّتها."], [1236.0, "فالموفَّق من يسّر الله عز وجل له أن يعبد الله بمثل ذلك."], [1242.0, "وأضرب لكم جُمَلًا من الأمثلة على هذه الكلّيّة:"]], "tr": [[1226.0, "O Sübhânehû ve Teâlâ, kullarını kendisini isim ve sıfatlarıyla tanımaya, onlarla kendisine senâ etmeye ve onların kulluğundan paylarını almaya çağırır."], [1236.0, "Muvaffak olan, Allah Azze ve Celle'nin, Allah'a bu şekilde ibadet etmeyi kolaylaştırdığı kimsedir."], [1242.0, "Size bu külliyeye dair birkaç örnek vereyim:"]]}, {"reader": false, "ar": [[1248.0, "فمثلًا إذا كان الإنسان وحيدًا بشيءٍ من المعاصي،"], [1252.3, "أو كانت نفسُه تهمّ بشيءٍ من المعاصي،"], [1256.0, "فتأتيه عبوديّةُ اسم «الرقيب» «العليم»،"], [1260.0, "فهو يتعبّد لله عز وجل بأنّ الله عز وجل رقيبٌ عليه بالرقابة المطلقة،"], [1267.0, "وعليمٌ بأحواله وإن استخفى عن أعين الناس،"], [1271.0, "فيحمله ذلك الإيمان بأن يتعبّد لله عز وجل بالتوبة والاستغفار وترك هذه المعصية."]], "tr": [[1248.0, "Mesela insan bir günahla baş başa kaldığında veya nefsi bir günaha yöneldiğinde, ona \"er-Rakîb\" ve \"el-Alîm\" isminin kulluğu gelir:"], [1256.0, "Allah Azze ve Celle'nin kendisini mutlak bir gözetimle gözettiğine (Rakîb) ve insanların gözlerinden gizlense bile hâllerini bildiğine (Alîm) (iman ederek) Allah Azze ve Celle'ye kulluk eder."], [1269.3, "Bu iman onu tövbe, istiğfar ve bu günahı terk etmekle Allah Azze ve Celle'ye kulluk etmeye sevk eder."]]}, {"reader": false, "ar": [[1278.0, "ويتعبّد لله عز وجل باسمه «القويّ» إذا كادت له الأعداء،"], [1286.2, "ورمته عن قوسٍ واحدة،"], [1288.4, "وانقطعت أسبابُ نصرته؛ فإنه يعلم أنّ الربّ المدبِّر المتصرِّف لهذا الكون قويٌّ القوّةَ المطلقة،"], [1296.0, "فيحمله ذلك إلى التعبّد لله عز وجل بمقتضى ذلك الاسم:"], [1300.0, "بكمال الانقياد لهذا الربّ القويّ،"], [1302.2, "وكمال دعاء هذا الربّ القويّ،"], [1304.4, "وكمال التوكّل على هذا الربّ القويّ،"], [1307.0, "وهكذا. لأنه يعلم أنّ قوّة الله عز وجل لا تُقاس بقوّة المخلوقات،"], [1313.0, "وأنّ المخلوقات مهما عظمت قوّتُهم فلا تكاد أن تكون شيئًا يُذكر في جانب قوّة الله عز وجل."]], "tr": [[1278.0, "Düşmanlar ona tuzak kurduğunda, hepsi birden tek yaydan ona ok attığında ve yardım sebepleri kesildiğinde, Allah Azze ve Celle'ye \"el-Kaviyy\" ismiyle kulluk eder."], [1290.0, "Çünkü bu kâinatı idare eden ve onda tasarrufta bulunan Rabbin mutlak kuvvetle kuvvetli olduğunu bilir."], [1296.0, "Bu da onu o ismin gereğiyle Allah Azze ve Celle'ye kulluğa sevk eder:"], [1300.0, "Bu kuvvetli Rabbe tam boyun eğmekle, bu kuvvetli Rabbe tam dua etmekle, bu kuvvetli Rabbe tam tevekkül etmekle ve benzerleriyle."], [1307.5, "Çünkü Allah Azze ve Celle'nin kuvvetinin mahlûkatın kuvvetiyle kıyas edilemeyeceğini, mahlûkatın kuvveti ne kadar büyük olursa olsun Allah Azze ve Celle'nin kuvveti yanında anılmaya değer bir şey bile sayılamayacağını bilir."]]}, {"reader": false, "ar": [[1323.0, "وكذلك إذا تاب الإنسانُ من الذنوب والمعاصي،"], [1326.3, "فإنّ له عبوديّةً في اسمٍ من أسماء الله عز وجل:"], [1331.0, "«الغفور» «الودود» «التوّاب» «الرحيم»؛"], [1334.0, "فتأمُّلُه في هذه الأسماء يجعله لا يقنط من رحمة الله،"], [1340.0, "ولا ييأس من رَوح الله عز وجل،"], [1342.0, "بل يكون دافعًا له إلى أن يتوب."], [1346.0, "وهكذا دواليك في أسماءٍ كثيرة؛"], [1349.0, "فكلُّ اسمٍ من أسماء الله عز وجل له عبوديّةٌ لا بدّ أن يتعبّد لله عز وجل بها."]], "tr": [[1323.0, "Aynı şekilde insan günahlardan ve isyanlardan tövbe ettiğinde, onun Allah Azze ve Celle'nin isimlerinden \"el-Gafûr\", \"el-Vedûd\", \"et-Tevvâb\", \"er-Rahîm\" isimlerinde bir kulluğu vardır."], [1334.0, "Bu isimleri düşünmesi onu Allah'ın rahmetinden ümit kesmeyen ve Allah Azze ve Celle'nin rahmetinden (ravh) ümitsizliğe düşmeyen biri yapar;"], [1341.7, "bilakis bu, onu tövbe etmeye iten bir sebep olur."], [1346.0, "Daha pek çok isimde de durum böyledir:"], [1349.0, "Allah Azze ve Celle'nin isimlerinden her ismin bir kulluğu vardır;"], [1353.5, "(kul) onunla Allah Azze ve Celle'ye kulluk etmelidir."]]}, {"reader": false, "ar": [[1357.0, "وإذا علم العبدُ بأنّ الله سميعٌ بصيرٌ عليم،"], [1360.6, "لا يخفى عليه مثقالُ ذرّةٍ في السماوات ولا في الأرض،"], [1365.0, "وأنه يعلم السرَّ وأخفى،"], [1367.4, "ويعلم خائنةَ الأعين وما تُخفي الصدور،"], [1371.0, "وأنه تبارك وتعالى قد أحاط بكلّ شيءٍ علمًا،"], [1376.3, "وأحصى كلَّ شيءٍ عددًا؛"], [1379.0, "فمن علم باطّلاع الله عليه،"], [1380.8, "ورؤيته له، وإحاطته به،"], [1382.3, "فإنّ ذلك يُثمر له أن يحفظ لسانه عن مقالة السوء،"], [1386.0, "وأن يحفظ جَنانه عن اعتقاد السوء،"], [1389.0, "وأن يحفظ إخوانه عن الكيد والحقد والغلّ؛"], [1393.0, "لأنه يعلم أنّ الله عز وجل محيطٌ بكلّ شيء،"], [1397.8, "ولا يخفى عليه شيء."]], "tr": [[1357.0, "Kul, Allah'ın işiten, gören ve bilen olduğunu;"], [1361.9, "göklerde ve yerde zerre ağırlığınca bir şeyin O'na gizli kalmadığını;"], [1371.0, "sırrı ve ondan daha gizli olanı bildiğini;"], [1379.0, "gözlerin hainliğini ve göğüslerin gizlediğini bildiğini;"], [1380.1, "O Tebâreke ve Teâlâ'nın her şeyi ilmiyle kuşattığını ve her şeyi sayı olarak tek tek saydığını bildiğinde (durum şöyledir):"], [1384.5, "Kim Allah'ın kendisine muttali olduğunu, kendisini gördüğünü ve kendisini kuşattığını bilirse, bu ona dilini kötü sözden, kalbini kötü inançtan ve kardeşlerini tuzaktan, kinden ve nefretten korumayı kazandırır."], [1393.0, "Çünkü Allah Azze ve Celle'nin her şeyi kuşattığını ve O'na hiçbir şeyin gizli kalmadığını bilir."]]}, {"reader": false, "ar": [[1400.0, "وإذا علم العبدُ بعدل الله،"], [1402.2, "وانتقامه، وغضبه، وسخطه، وعقوبته،"], [1404.0, "فإنّ هذا يُثمر له الخشيةَ والخوفَ والحذرَ،"], [1407.5, "والبعدَ عن مساخط الربّ،"], [1409.5, "وعدمَ ظلم العباد. كلُّ شيءٍ له عبوديّة،"], [1413.0, "كلُّ شيءٍ له عبوديّة."], [1415.0, "وبهذا يُعلَم أنّ العبوديّة بجميع أنواعها راجعةٌ إلى مقتضيات أسماء الله عز وجل وصفاته."]], "tr": [[1400.0, "Kul Allah'ın adaletini, intikamını, gazabını, öfkesini ve cezasını bildiğinde, bu ona haşyet, korku, sakınma, Rabbi öfkelendiren şeylerden uzak durma ve kullara zulmetmeme meyvesini verir."], [1410.0, "Her şeyin bir kulluğu vardır, her şeyin bir kulluğu vardır."], [1415.0, "Bununla bilinir ki bütün türleriyle kulluk, Allah Azze ve Celle'nin isim ve sıfatlarının gereklerine dayanır."]]}, {"reader": false, "ar": [[1424.0, "ولهذا فإنه يتأكّد على كلّ عبدٍ مسلمٍ أن يعرف ربّه بأسمائه وصفاته معرفةً صحيحةً سليمة،"], [1431.0, "وأن يبدأ في التعبّد له عز وجل في يومه وليلته بمثل هذه المقتضيات."], [1437.0, "أسأل الله أن يُعينني وإيّاكم على ذلك."], [1440.0, "فهمتم؟ إذًا نحن نتعبّد لله عز وجل بمقتضيات أسمائه في حالتين ـ في الأمرين:"], [1448.0, "تعبُّدُ التفكّر في النظر في هذه المخلوقات،"], [1451.8, "وأنها من جملة آثار أسمائه وصفاته،"], [1455.0, "والتعبّدُ لله عز وجل بمقتضيات هذه الأسماء تعبُّدَ ألوهيّة."], [1460.0, "فالأوّل تعبّد الربوبيّة، والثاني تعبّد الألوهيّة؛"], [1465.0, "فجمعنا بين الربوبيّة والألوهيّة بالنظر في توحيد الأسماء والصفات."]], "tr": [[1424.0, "Bu yüzden her Müslüman kulun Rabbini isim ve sıfatlarıyla sahih ve sağlam bir şekilde tanıması ve gece gündüz O Azze ve Celle'ye bu gibi gereklerle kulluk etmeye başlaması kuvvetle gereklidir."], [1437.0, "Allah'tan bu hususta bana ve size yardım etmesini dilerim."], [1440.0, "Anladınız mı? Demek ki biz Allah Azze ve Celle'ye isimlerinin gerekleriyle iki hâlde —iki hususta— kulluk ederiz:"], [1448.0, "Bu mahlûkata bakıp tefekkür etme ve onların O'nun isim ve sıfatlarının eserlerinden olduğunu görme kulluğu;"], [1455.0, "ve bu isimlerin gerekleriyle Allah Azze ve Celle'ye ulûhiyyet kulluğu."], [1460.0, "Birincisi rubûbiyyet kulluğu, ikincisi ulûhiyyet kulluğudur."], [1465.0, "Böylece isim ve sıfatlar tevhidine bakarak rubûbiyyet ile ulûhiyyeti birleştirmiş olduk."]]}]}, {"ts": "24:31", "title": "4. Külliye: İsim olarak sahih olan her şeyden sıfat türetilir, tersi değil", "paras": [{"reader": false, "ar": [[1471.0, "الرابعة ـ الكلّيّة الرابعة: كلُّ ما صحّ اسمًا لله فيُشتقّ له منه صفة،"], [1479.7, "ولا عكس. <span class=\"note\">(يكررها)<\/span> كلُّ ما صحّ اسمًا لله عز وجل فيُشتقّ له منه صفة، ولا عكس."]], "tr": [[1471.0, "Dördüncü —4. külliye: Allah için isim olarak sahih olan her şeyden O'na bir sıfat türetilir;"], [1474.0, "tersi değil.<b> (Tekrar ediyor.) <\/b>4."], [1477.2, "külliye: Allah Azze ve Celle için isim olarak sahih olan her şeyden O'na bir sıfat türetilir; tersi değil."]]}, {"reader": false, "ar": [[1491.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرِّر في القواعد عند أهل السنّة والجماعة أنّ الأسماء هي التي يُشتقّ منها للصفات؛"], [1501.0, "فكلُّ اسمٍ من أسماء الله عز وجل فيصحّ لنا أن نشتقّ له منه صفة،"], [1507.0, "إذ ما من اسمٍ تسمّى الله عز وجل به إلا وهو يتضمّن صفةً من صفات كماله،"], [1513.7, "كما قرّرناه سابقًا. ولكن لا يجوز لك أن تأتي إلى الأمر بالعكس؛"], [1519.0, "فليس كلُّ صفةٍ اتّصف الله عز وجل بها يصحّ أن نشتقّ له منها اسمًا."]], "tr": [[1491.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşik olanın, sıfatların türetildiği şeyin isimler olmasıdır."], [1501.0, "Allah Azze ve Celle'nin isimlerinden her isimden O'na bir sıfat türetmemiz sahihtir;"], [1506.1, "zira daha önce takrir ettiğimiz gibi, Allah Azze ve Celle'nin kendisini isimlendirdiği her isim, O'nun kemal sıfatlarından bir sıfatı kapsar."], [1515.0, "Fakat işi tersinden ele alman caiz değildir:"], [1519.0, "Allah Azze ve Celle'nin nitelendiği her sıfattan O'na bir isim türetmemiz sahih değildir."]]}, {"reader": false, "ar": [[1526.0, "فالله عز وجل هو «الحكيم» اسمًا،"], [1529.2, "فنشتقّ له منه صفةً وهي صفة الحكمة."], [1533.0, "والله عز وجل هو «الحيّ» اسمًا،"], [1536.2, "فنشتقّ له من ذلك الاسم صفةً وهي صفة الحياة."], [1541.0, "والله عز وجل هو «العزيز» اسمًا،"], [1544.4, "وذو العزّة صفةً، و«القويّ» اسمًا،"], [1547.3, "وذو القوّة صفةً. ولكن لا حقّ لك أن تأتي إلى صفةٍ من الصفات فتشتقّ لها ـ فتشتقّ لله عز وجل منها اسمًا له."]], "tr": [[1526.0, "Allah Azze ve Celle isim olarak \"el-Hakîm\"dir;"], [1528.7, "O'na bundan bir sıfat türetiriz, o da hikmet sıfatıdır."], [1533.0, "Allah Azze ve Celle isim olarak \"el-Hayy\"dır;"], [1536.2, "O'na bu isimden bir sıfat türetiriz, o da hayat sıfatıdır."], [1541.0, "Allah Azze ve Celle isim olarak \"el-Azîz\"dir, sıfat olarak izzet sahibidir;"], [1546.0, "isim olarak \"el-Kaviyy\"dir, sıfat olarak kuvvet sahibidir."], [1549.0, "Fakat sıfatlardan bir sıfata gelip ondan —ondan Allah Azze ve Celle'ye bir isim türetmeye hakkın yoktur."]]}, {"reader": false, "ar": [[1557.0, "فالله عز وجل من صفاته الكلام،"], [1560.0, "ولكن لا يحقّ لك أن تشتقّ له منها اسمَ «المتكلّم»."], [1564.0, "والله عز وجل من صفاته المجيء،"], [1567.0, "ولكن لا حقّ لك أن تسمّيه بـ«الجائي»."], [1571.0, "والله عز وجل هو المريد،"], [1573.0, "ولكن لا حقّ لك أن تسمّيه ـ عفوًا ـ والله عز وجل موصوفٌ بالإرادة،"], [1579.0, "ولكن لا حقّ لك أن تسمّيه بـ«المريد»."], [1582.3, "والله عز وجل هو موصوفٌ بالإتيان يوم القيامة،"], [1586.0, "ولكن لا حقّ لك أن تسمّيه بـ«الآتي»."], [1589.3, "والله عز وجل ممّا يُخبَر عنه أنه يُمسك السماوات والأرض،"], [1594.0, "لكن لا حقّ لك أن تشتقّ له منها اسمَ «المُمسِك»."], [1599.3, "وهكذا دواليك في سائر الصفات."]], "tr": [[1557.0, "Allah Azze ve Celle'nin sıfatlarından biri kelâmdır;"], [1560.4, "fakat ondan O'na \"el-Mütekellim\" ismini türetmeye hakkın yoktur."], [1564.0, "Allah Azze ve Celle'nin sıfatlarından biri gelmektir (mecî');"], [1567.6, "fakat O'nu \"el-Câî\" diye isimlendirmeye hakkın yoktur."], [1571.0, "Allah Azze ve Celle irade edendir, fakat O'nu isimlendirmeye hakkın yoktur —pardon— Allah Azze ve Celle irade ile nitelenir, fakat O'nu \"el-Mürîd\" diye isimlendirmeye hakkın yoktur."], [1582.3, "Allah Azze ve Celle kıyamet günü gelmek (ityân) ile nitelenir, fakat O'nu \"el-Âtî\" diye isimlendirmeye hakkın yoktur."], [1589.3, "Allah Azze ve Celle'nin gökleri ve yeri tuttuğu haber verilir, fakat ondan O'na \"el-Mümsik\" ismini türetmeye hakkın yoktur."], [1599.3, "Diğer sıfatlarda da durum böyledir."]]}, {"reader": false, "ar": [[1602.0, "وهذا في قول عامّة أهل السنّة والجماعة،"], [1607.0, "وإن كان هناك شيءٌ من الخلاف البسيط،"], [1610.7, "إلا أنّ جماهير أهل السنّة على ما قرّرته هذه القاعدة:"], [1616.0, "من أنّ كلّ اسمٍ فإنه يصحّ اشتقاقُ صفةٍ منه،"], [1620.3, "ولكن ليس كلُّ صفةٍ يصحّ أن يُشتقّ لله منها اسم. والله أعلم."]], "tr": [[1602.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'in geneline göredir."], [1606.3, "Basit bir miktar ihtilaf bulunsa da Ehl-i Sünnet'in cumhuru bu kaidenin takrir ettiği şey üzeredir:"], [1616.0, "Her isimden bir sıfat türetmek sahihtir;"], [1618.9, "fakat her sıfattan Allah'a bir isim türetmek sahih değildir. Allah en iyisini bilir."]]}]}, {"ts": "27:06", "title": "5. Külliye: Allah'ın isim ve sıfatlarına iman edip gereğiyle kulluk eden, onları ihsâ etmiş olur", "paras": [{"reader": false, "ar": [[1626.0, "ومن الكلّيّات أيضًا: <b>كلُّ من آمن بأسماء الله وصفاتها وتعبّد بمقتضاها فقد أحصاها.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [1652.0, "<b>كلُّ من آمن بأسماء الله وصفاتها وتعبّد لله بمقتضاها فقد أحصاها.<\/b>"]], "tr": [[1626.0, "Külliyelerden biri de şudur: 5."], [1628.0, "külliye: Allah'ın isimlerine ve onların (kapsadığı) sıfatlara iman edip onların gereğiyle kulluk eden herkes, onları ihsâ etmiştir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [1652.0, "<b>5. külliye: Allah'ın isimlerine ve onların sıfatlarına iman edip onların gereğiyle Allah'a kulluk eden herkes, onları ihsâ etmiştir.<\/b>"]]}, {"reader": false, "ar": [[1661.0, "أقول وبالله التوفيق: وذلك لما في الصحيحين من حديث أبي هريرة رضي الله عنه قال:"], [1671.6, "قال النبيّ صلى الله عليه وسلم:"], [1674.9, "«إنّ لله تسعةً وتسعين اسمًا، من أحصاها دخل الجنّة» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [1680.0, "واختلف أهلُ العلم رحمهم الله تعالى في معنى الإحصاء هنا،"], [1683.0, "وأصحُّ الأقوال ما نصّ عليه الإمام ابن القيّم في كتابه العظيم «بدائع الفوائد»."]], "tr": [[1661.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, Sahîhayn'da Ebû Hüreyre'den —Allah ondan razı olsun— gelen hadistir;"], [1671.6, "dedi ki: Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1674.9, "\"Allah'ın doksan dokuz ismi vardır;"], [1676.6, "kim onları ihsâ ederse cennete girer.\" <span class=\"note\">(Buhârî, Müslim)<\/span>."], [1680.0, "İlim ehli —Allah onlara rahmet etsin— buradaki ihsânın anlamında ihtilaf etmiştir."], [1683.7, "Görüşlerin en sahihi, İmam İbnü'l-Kayyim'in büyük eseri \"Bedâiu'l-Fevâid\"de açıkça belirttiği görüştür."]]}, {"reader": false, "ar": [[1692.0, "فقد ذكر العلّامة ابن القيّم في هذا الكتاب العظيم أنّ لإحصاء أسماء الله الحسنى ثلاثَ مراتب،"], [1699.0, "بتكميلها وتحقيقها ينال العبدُ ثوابَ الله العظيم المذكور في حديث النبيّ صلى الله عليه وسلم آنفًا."], [1707.0, "المرتبة الأولى: «إحصاء ألفاظها وعددها ما استطاع»،"], [1713.0, "إحصاء ألفاظها وعددها ما استطاع ـ بمعنى الإيمان بها اسمًا،"], [1724.0, "بين قوسين: بمعنى الإيمان بها اسمًا ـ فكلُّ ما صحّ من أسماء الله عز وجل في كتابه أو في سنّة نبيّه صلى الله عليه وسلم فالواجب عليك الإيمانُ بها."]], "tr": [[1692.0, "Allâme İbnü'l-Kayyim bu büyük eserde, Allah'ın güzel isimlerini ihsâ etmenin üç mertebesi olduğunu zikretmiştir;"], [1697.7, "kul bunları tamamlamak ve gerçekleştirmekle, az önce Peygamber sallallâhu aleyhi ve sellem'in hadisinde zikredilen Allah'ın büyük sevabına nail olur."], [1707.0, "Birinci mertebe: \"Gücü yettiğince lafızlarını ve sayılarını ihsâ etmek.\" Gücü yettiğince lafızlarını ve sayılarını ihsâ etmek —yani onlara isim olarak iman etmek;"], [1726.8, "parantez içinde: onlara isim olarak iman etmek anlamında."], [1732.9, "Allah Azze ve Celle'nin Kitabında veya Peygamberi sallallâhu aleyhi ve sellem'in sünnetinde sahih olarak gelen her isme iman etmen vaciptir."]]}, {"reader": false, "ar": [[1740.0, "المرتبة الثانية: «الإيمان بمعانيها ومدلولاتها»،"], [1748.0, "أي صفةً، أي الإيمان بصفاتها."], [1752.0, "المرتبة الثالثة: «دعاء الله عز وجل بها بنوعَي الدعاء»،"], [1759.0, "دعاء الله عز وجل بها بنوعَي الدعاء،"], [1764.0, "وهذا شاملٌ لدعاء العبادة ودعاء المسألة."], [1777.0, "فإذا تمّت هذه المراتب الثلاث في الاسم الواحد فتُوصَف شرعًا بأنك أحصيتَه."]], "tr": [[1740.0, "İkinci mertebe: \"Anlamlarına ve delâlet ettiklerine iman etmek\";"], [1748.0, "yani sıfat olarak, yani sıfatlarına iman etmek."], [1752.0, "Üçüncü mertebe: \"Allah Azze ve Celle'ye onlarla iki tür dua ile dua etmek.\" Allah Azze ve Celle'ye onlarla iki tür dua ile dua etmek;"], [1764.8, "bu, ibadet duasını ve istek duasını kapsar."], [1777.0, "Bu üç mertebe tek bir isimde tamamlandığında, şer'an o ismi ihsâ ettiğinle nitelenirsin."]]}, {"reader": false, "ar": [[1786.0, "فليس إحصاؤها هو تردادَها كلَّ يومٍ ومساء،"], [1791.0, "وليس إحصاؤها حفظَ ألفاظها فقط،"], [1795.0, "بل لا بدّ من الإيمان بها اسمًا،"], [1798.0, "والإيمانِ بما تضمّنته من الصفات والدلالات والمعاني،"], [1802.0, "ثم بعد ذلك أن تتعبّد لله عز وجل بنوعَي العبادة بمقتضياتها،"], [1811.0, "وهذا يتفاوت الناسُ فيه تفاوتًا عظيمًا."]], "tr": [[1786.0, "Onları ihsâ etmek, her gün ve akşam onları tekrarlamak değildir;"], [1791.8, "onları ihsâ etmek sadece lafızlarını ezberlemek de değildir."], [1796.3, "Bilakis onlara isim olarak iman etmek, kapsadıkları sıfatlara, delâletlere ve anlamlara iman etmek, sonra da onların gerekleriyle iki tür ibadetle Allah Azze ve Celle'ye kulluk etmek gerekir."], [1811.0, "İnsanlar bunda pek büyük farklılık gösterir."]]}]}, {"ts": "30:16", "title": "5. Külliye (devam): İsimleri günlük vird edinmenin hatası", "paras": [{"reader": false, "ar": [[1816.0, "وبناءً على ذلك فنحن ـ فنعلم خطأ من يجعل هذه الأسماء وِرْدًا يوميًّا يقرؤه كلَّ صباحٍ ومساء،"], [1832.0, "أو يقرؤه أدبارَ الصلوات المكتوبة كما يفعله بعضُهم،"], [1838.0, "ظنًّا منه أنّ هذا هو المراد بإحصائها."], [1842.0, "وكلُّ هذا عملٌ مُحدَثٌ لا دليل على مشروعيّته."], [1847.0, "وقد سبق لنا أنّ الإحصاء لها يكون بالإيمان بمتعلّقاتها الثلاث:"], [1854.0, "الإيمان بكونها اسمًا، والإيمان بالصفة التي تضمّنها ذلك الاسم،"], [1859.0, "وأن تتعبّد لله عز وجل بمقتضياتها بنوعَي الدعاء. والله أعلم."]], "tr": [[1816.0, "Buna dayanarak biz —bu isimleri her sabah ve akşam okuduğu günlük bir vird hâline getiren veya bazılarının yaptığı gibi farz namazların ardından okuyan kimsenin, onları ihsâ etmekle kastedilenin bu olduğunu zannederek yaptığı şeyin hata olduğunu biliriz."], [1842.0, "Bütün bunlar, meşruluğuna delil bulunmayan sonradan çıkarılmış (muhdes) bir ameldir."], [1847.0, "Daha önce geçtiği üzere onları ihsâ etmek, üç taalluklarına iman etmekle olur:"], [1854.0, "Onların isim olduğuna iman etmek, o ismin kapsadığı sıfata iman etmek ve onların gerekleriyle iki tür dua ile Allah Azze ve Celle'ye kulluk etmen. Allah en iyisini bilir."]]}]}, {"ts": "31:06", "title": "6. Külliye: Allah'ın bütün isimleri zât bakımından müttefik, sıfat bakımından farklıdır", "paras": [{"reader": false, "ar": [[1866.0, "الكلّيّة ـ كم؟ ـ السادسة: كلُّ أسماء الله متّفقةٌ من حيث الذات،"], [1875.8, "متباينةٌ من حيث الصفات.<b> <span class=\"note\">(يكررها)<\/span> <\/b>كلُّ أسماء الله عز وجل متّفقةٌ من حيث الذات،"], [1889.2, "متباينةٌ من حيث الصفات."]], "tr": [[1866.0, "Külliye —kaçıncı?— 6. külliye: Allah'ın bütün isimleri zât bakımından birleşir (müttefiktir), sıfatlar bakımından birbirinden ayrılır (mütebâyindir). (Tekrar ediyor.) 6."], [1885.5, "külliye: Allah Azze ve Celle'nin bütün isimleri zât bakımından birleşir, sıfatlar bakımından birbirinden ayrılır."]]}, {"reader": false, "ar": [[1891.0, "أقول وبالله التوفيق: إذا نظرتَ إلى أسماء الله عز وجل لوجدتَها تدلّ على ذاتٍ وعلى صفة؛"], [1905.0, "فاسمه الأحسن «الله» يدلّ على ذات الله وعلى صفة الألوهيّة،"], [1914.0, "واسمه الأحسن «الحيّ» يدلّ على ذات الله وعلى صفة الحياة."], [1921.0, "فأنت ترى أنّ هذين الاسمين يدلّان على ذاتٍ واحدة،"], [1926.0, "ولكنّ كلّ واحدٍ منهما يدلّ على صفةٍ غير الصفة التي يدلّ عليها الاسمُ الآخر."], [1931.0, "فـ«الله» و«الحيّ» يتّفقان في أنّ كلًّا منهما يدلّ على ذاتٍ واحدة،"], [1940.0, "ولكن يختلفان في أنّ كلًّا منهما يدلّ على صفةٍ متغايرة،"], [1945.0, "أو على صفتين متغايرتين."]], "tr": [[1891.0, "Tevfik Allah'tandır, derim ki: Allah Azze ve Celle'nin isimlerine baksan, onların bir zâta ve bir sıfata delâlet ettiğini görürsün."], [1905.0, "En güzel ismi olan \"Allah\", Allah'ın zâtına ve ulûhiyyet sıfatına delâlet eder;"], [1911.3, "en güzel ismi olan \"el-Hayy\" da Allah'ın zâtına ve hayat sıfatına delâlet eder."], [1921.0, "Görüyorsun ki bu iki isim tek bir zâta delâlet eder;"], [1926.4, "fakat her biri diğer ismin delâlet ettiği sıfattan başka bir sıfata delâlet eder."], [1931.0, "\"Allah\" ve \"el-Hayy\", her birinin tek bir zâta delâlet etmesinde birleşir;"], [1937.2, "fakat her birinin farklı bir sıfata, yani birbirinden farklı iki sıfata delâlet etmesinde ayrılır."]]}, {"reader": false, "ar": [[1948.0, "وكذلك لو تأمّلتَ اسمَ «الرحمن» و«العزيز» لوجدتَ أنّ الرحمن يدلّ على ذات الله،"], [1956.0, "والعزيز يدلّ على ذات الله،"], [1958.0, "فهما متّفقان باعتبار أنّ كلًّا منهما يدلّ على ذاتٍ واحدة."], [1963.0, "لكن لو تأمّلتَ الصفة التي يتضمّنها «العزيز» لوجدتَها العزّة،"], [1968.0, "ولو تأمّلتَ الصفة التي يدلّ عليها «الرحمن» لوجدتَها الرحمة،"], [1973.0, "والرحمةُ تختلف عن العزّة."], [1975.0, "فيصحّ لنا أن نقول:"], [1977.5, "إنّ اسم الله «العزيز» و«الرحمن» يتّفقان باعتبار دلالتهما على ذاتٍ واحدة،"], [1984.3, "ويختلفان باعتبار دلالتهما على صفتين مختلفتين."]], "tr": [[1948.0, "Aynı şekilde \"er-Rahmân\" ve \"el-Azîz\" isimlerini düşünsen, er-Rahmân'ın Allah'ın zâtına, el-Azîz'in de Allah'ın zâtına delâlet ettiğini görürsün;"], [1957.6, "her birinin tek bir zâta delâlet etmesi itibarıyla birleşirler."], [1963.0, "Fakat \"el-Azîz\"in kapsadığı sıfatı düşünsen onun izzet olduğunu, \"er-Rahmân\"ın delâlet ettiği sıfatı düşünsen onun rahmet olduğunu görürsün;"], [1972.0, "rahmet ise izzetten farklıdır. O hâlde şöyle dememiz sahihtir:"], [1977.5, "Allah'ın \"el-Azîz\" ve \"er-Rahmân\" isimleri tek bir zâta delâletleri itibarıyla birleşir, iki farklı sıfata delâletleri itibarıyla ayrılır."]]}, {"reader": false, "ar": [[1988.0, "ولو تأمّلتَ اسمَي ـ اسمَ الله عز وجل «السميع» «البصير» لوجدتَ أنّ السميع والبصير يدلّان على ذاتٍ واحدة،"], [2000.0, "ولكنّ السميع يدلّ على السمع،"], [2002.7, "والبصير يدلّ على البصر،"], [2004.8, "وليس السمعُ هو البصر؛"], [2007.0, "فهما متّفقان باعتبار الذات،"], [2009.3, "ومختلفان باعتبار الصفات. ولو تأمّلتَ إلى اسم الله «الرؤوف» و«العليم» لوجدتَ أنّ كلًّا منهما يدلّ على ذاتٍ واحدة،"], [2022.0, "فهما متّفقان باعتبار دلالتهما على ذات الباري عز وجل،"], [2025.0, "ولكنّ الرؤوف يدلّ على الرأفة،"], [2027.7, "والعليم يدلّ على العلم،"], [2029.8, "وليس العلمُ هو الرأفة؛"], [2032.0, "فهما مختلفان من وجه،"], [2034.9, "ومتّفقان من وجهٍ آخر."]], "tr": [[1988.0, "Allah Azze ve Celle'nin \"es-Semî'\" ve \"el-Basîr\" isimlerini düşünsen, es-Semî' ile el-Basîr'in tek bir zâta delâlet ettiğini görürsün."], [2002.2, "Fakat es-Semî' işitmeye, el-Basîr görmeye delâlet eder;"], [2007.0, "işitme görme değildir. Dolayısıyla zât itibarıyla birleşir, sıfatlar itibarıyla ayrılırlar."], [2011.0, "Allah'ın \"er-Raûf\" ve \"el-Alîm\" isimlerini düşünsen, her birinin tek bir zâta delâlet ettiğini görürsün;"], [2022.3, "Bâri Azze ve Celle'nin zâtına delâletleri itibarıyla birleşirler."], [2026.1, "Fakat er-Raûf re'fete (şefkate), el-Alîm ilme delâlet eder;"], [2032.0, "ilim re'fet değildir. Dolayısıyla bir yönden ayrılır, başka bir yönden birleşirler."]]}, {"reader": false, "ar": [[2038.0, "فلا يجوز أن نقول ـ كما قال بعضُ المعتزلة ـ بأنّ أسماء الله متّفقةٌ مطلقًا،"], [2045.0, "ولا أن نقول ـ كما قال بعضُهم الآخر ـ بأنّ أسماء الله متباينةٌ مطلقًا،"], [2052.0, "وإنما نقول: متّفقةٌ باعتبار الذات، ومتباينةٌ باعتبار الصفات."]], "tr": [[2038.0, "Mu'tezile'nin bazılarının dediği gibi \"Allah'ın isimleri mutlak olarak müttefiktir (eş anlamlıdır)\" dememiz caiz değildir;"], [2044.5, "diğer bazılarının dediği gibi \"Allah'ın isimleri mutlak olarak mütebâyindir (birbirinden tamamen ayrıdır)\" dememiz de caiz değildir."], [2053.4, "Bilakis şöyle deriz: Zât itibarıyla müttefik, sıfatlar itibarıyla mütebâyindir."]]}, {"reader": false, "ar": [[2060.0, "وأُقرّب لكم الأمر بضرب ثلاثة أمثلة:"], [2064.0, "المثال الأوّل: أسماء يوم القيامة؛"], [2067.0, "فإنّ القرآن والسنّة قد ذكرت يوم القيامة بأسماءٍ متعدّدة،"], [2071.0, "كلُّ هذه الأسماء تدلّ على ذات يومٍ واحد،"], [2075.0, "ولكنّ كلّ اسمٍ منها يصف هذا اليوم بصفةٍ غير صفة الاسم الآخر."], [2081.9, "فـ«اليوم الآخر» يصفه بالآخريّة،"], [2085.6, "و«الصاخّة» يصفه بأنّ فيه من الأهوال ما يُصِخّ الآذان،"], [2091.9, "و«القارعة» يصفه بأنّ فيه من الأهوال ما يقرع القلوب،"], [2098.4, "و«القيامة» يصفه بأنّ الناس يقومون فيه من قبورهم لفصل القضاء."], [2106.0, "فيصحّ لنا أن نقول بأنّ أسماء يوم القيامة متّفقةٌ باعتبار الذات، ومتباينةٌ باعتبار الصفات."]], "tr": [[2060.0, "Meseleyi size üç örnek vererek yaklaştırayım."], [2064.0, "Birinci örnek: Kıyamet gününün isimleri."], [2067.0, "Kur'an ve Sünnet kıyamet gününü birçok isimle zikretmiştir;"], [2069.7, "bu isimlerin hepsi tek bir günün zâtına delâlet eder, fakat her biri bu günü diğer ismin sıfatından başka bir sıfatla niteler."], [2079.1, "\"el-Yevmü'l-Âhir\" onu sonuncu olmakla niteler;"], [2081.9, "\"es-Sâhhe\" onda kulakları sağır eden dehşetler bulunduğunu bildirerek niteler;"], [2089.8, "\"el-Kâria\" onda kalpleri döven dehşetler bulunduğunu bildirerek niteler;"], [2095.6, "\"el-Kıyâme\" ise insanların o gün hüküm verilmek için kabirlerinden kalktığını bildirerek niteler."], [2106.0, "O hâlde şöyle dememiz sahihtir:"], [2109.1, "Kıyamet gününün isimleri zât itibarıyla müttefik, sıfatlar itibarıyla mütebâyindir."]]}]}, {"ts": "35:16", "title": "6. Külliye (devam): Peygamber'in isimleri ve kılıcın isimleri", "paras": [{"reader": false, "ar": [[2116.0, "المثال الثاني: أسماء النبيّ صلى الله عليه وسلم؛"], [2121.0, "فإنّ الدليل قد سمّاه بأسماءٍ متعدّدة،"], [2124.0, "كلُّها تدلّ على ذات محمّدٍ صلى الله عليه وسلم،"], [2129.0, "ولكنّ كلّ اسمٍ منها يصف هذه الذات بصفةٍ غير صفة الاسم الآخر."], [2137.3, "فـ«محمّد» يصف هذه الذات بكثرة الحمد الصادر له،"], [2143.6, "و«أحمد» يصف هذه الذات بكثرة الحمد الصادر منها لله عز وجل،"], [2151.5, "و«الحاشر» يصف هذه الذات بأنّ الناس يُحشَرون على قدمه،"], [2157.6, "أي هو متقدّمُهم صلى الله عليه وسلم،"], [2161.8, "و«العاقب» يصف هذه الذات بأنه آخرُ الأنبياء والرسل فلا نبيّ بعده،"], [2169.5, "و«الماحي» يصف هذه الذات بأنها الذاتُ التي محا الله عز وجل بنبوّتها ورسالتها الكفرَ والشركَ من الأرض."], [2182.0, "فيصحّ لنا أن نقول بأنّ أسماء النبيّ صلى الله عليه وسلم متّفقةٌ باعتبار الذات، ومتباينةٌ باعتبار الصفات."]], "tr": [[2116.0, "İkinci örnek: Peygamber sallallâhu aleyhi ve sellem'in isimleri."], [2118.5, "Delil onu birçok isimle isimlendirmiştir;"], [2121.0, "hepsi Muhammed sallallâhu aleyhi ve sellem'in zâtına delâlet eder, fakat her biri bu zâtı diğer ismin sıfatından başka bir sıfatla niteler."], [2127.9, "\"Muhammed\" bu zâtı, ona yönelen hamdin çokluğuyla niteler;"], [2131.7, "\"Ahmed\" bu zâtı, ondan Allah Azze ve Celle'ye yönelen hamdin çokluğuyla niteler;"], [2137.3, "\"el-Hâşir\" bu zâtı, insanların onun ardından (kademi üzere) haşredilmesiyle, yani onların önünde olmasıyla niteler sallallâhu aleyhi ve sellem;"], [2153.2, "\"el-Âkıb\" bu zâtı, peygamberlerin ve resullerin sonuncusu olmasıyla, ondan sonra peygamber olmamasıyla niteler;"], [2164.1, "\"el-Mâhî\" bu zâtı, Allah Azze ve Celle'nin onun nübüvvetiyle ve risaletiyle yeryüzünden küfrü ve şirki sildiği zât olmasıyla niteler."], [2182.0, "O hâlde şöyle dememiz sahihtir:"], [2185.3, "Peygamber sallallâhu aleyhi ve sellem'in isimleri zât itibarıyla müttefik, sıfatlar itibarıyla mütebâyindir."]]}, {"reader": false, "ar": [[2194.0, "والمثال الثالث والأخير: أسماء السيف؛"], [2198.0, "فإنك ترى أنّ العرب تُسمّي السيف بأسماءٍ كثيرة."], [2204.0, "والقاعدة عند العرب أنّ تعدّد الأسماء مردُّه إلى التعظيم أو الحبّ؛"], [2212.0, "فكلُّ شيءٍ تعظّمه العرب فإنّ من باب تعظيمها له الإكثارَ من أسمائه،"], [2218.0, "أو أنّ العرب من فرط حبّها لهذا الشيء فإنها تُكثر من أسمائه."], [2225.8, "والله عز وجل تعدّدت أسماؤه للاعتبارين جميعًا؛"], [2231.0, "لأنه العظيم العظمةَ المطلقة،"], [2233.9, "وهو المستحقّ للمحبّة المطلقة."]], "tr": [[2194.0, "Üçüncü ve son örnek: Kılıcın isimleri."], [2198.0, "Görürsün ki Araplar kılıcı pek çok isimle isimlendirir."], [2204.0, "Araplara göre kaide şudur: İsimlerin çokluğu ya tazime ya da sevgiye dayanır."], [2212.0, "Arapların tazim ettiği her şeyin isimlerini çoğaltmaları onu tazim etmelerindendir;"], [2218.0, "ya da Araplar bir şeyi aşırı sevdiklerinden onun isimlerini çoğaltırlar."], [2225.8, "Allah Azze ve Celle'nin isimleri de bu iki itibarın ikisi sebebiyle çoğalmıştır;"], [2231.0, "çünkü O mutlak azametle Azîm'dir ve mutlak sevgiye layık olandır."]]}, {"reader": false, "ar": [[2237.0, "فإذا نظرتَ إلى أسماء السيف وجدتَ أنّ كلًّا منها يدلّ على ذات السيف جنسًا:"], [2246.0, "الصارم، السيف، البتّار، وغيرها من الأسماء،"], [2250.0, "لكنّ كلّ اسمٍ منها يتضمّن صفةً لهذه الذات مغايرةً للصفة التي يتضمّنها الاسمُ الآخر."], [2261.0, "فيصحّ لنا أن نقول بأنّ أسماء السيف متّفقةٌ باعتبار الذات،"], [2267.2, "ومتباينةٌ باعتبار الصفات. ولعلّ هذه الأمثلة توضّح لكم هذه القاعدة:"], [2272.2, "بأنّ جميع أسماء الله عز وجل متّفقةٌ باعتبار دلالتها على ذاتٍ واحدة،"], [2278.8, "وهي ذاتُ الباري عز وجل،"], [2282.0, "ومتباينةٌ باعتبار دلالة كلّ اسمٍ منها على صفةٍ غير صفة الاسم الآخر. والله أعلم."]], "tr": [[2237.0, "Kılıcın isimlerine baktığında, her birinin cins olarak kılıcın zâtına delâlet ettiğini görürsün:"], [2246.0, "es-Sârim, es-Seyf, el-Bettâr ve diğer isimler."], [2250.0, "Fakat her biri bu zât için, diğer ismin kapsadığı sıfattan farklı bir sıfatı kapsar."], [2261.0, "O hâlde şöyle dememiz sahihtir:"], [2264.1, "Kılıcın isimleri zât itibarıyla müttefik, sıfatlar itibarıyla mütebâyindir."], [2269.0, "Umarım bu örnekler size şu kaideyi açıklar:"], [2272.2, "Allah Azze ve Celle'nin bütün isimleri tek bir zâta, yani Bâri Azze ve Celle'nin zâtına delâletleri itibarıyla müttefik;"], [2281.4, "her birinin diğer ismin sıfatından başka bir sıfata delâleti itibarıyla mütebâyindir. Allah en iyisini bilir."]]}]}, {"ts": "38:10", "title": "7. Külliye: Delillerin Allah hakkında kullandığı ve mutlak kemal içermeyen her lafız, isim itlakı babından değildir", "paras": [{"reader": false, "ar": [[2290.0, "ومن الكلّيّات أيضًا: كلُّ ما أطلقه الدليلُ على الله ـ <b>كلُّ ما أطلقته الأدلّةُ على الله ولا يتضمّن معنى الكماليّة المطلقة فليس من إطلاق الأسماء.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [2323.0, "<b>كلُّ ما أطلقته الأدلّةُ على الله عز وجل ولا يتضمّن معنى الكماليّة المطلقة فليس من باب إطلاق الأسماء.<\/b>"]], "tr": [[2290.0, "Külliyelerden biri de şudur: Delilin Allah hakkında kullandığı her şey— 7."], [2293.5, "külliye: Delillerin Allah hakkında kullandığı (itlak ettiği) ve mutlak kemal anlamını içermeyen her lafız, isim itlakı (cinsinden) değildir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [2323.0, "<b>7. külliye: Delillerin Allah Azze ve Celle hakkında kullandığı ve mutlak kemal anlamını içermeyen her lafız, isim itlakı babından değildir.<\/b>"]]}, {"reader": false, "ar": [[2330.0, "أقول: أي لا ينبغي أن نشتقّ من هذا الإطلاق اسمًا لله عز وجل،"], [2341.0, "وإنما نجعله من باب إطلاق الأفعال،"], [2344.8, "أو من باب إطلاق الأخبار،"], [2348.0, "أو من باب إطلاق الصفات على الأقلّ إن صحّ صفةً؛"], [2353.0, "لأنّ من شرط إطلاق الأسماء على الله عز وجل أن يتضمّن هذا الذي ـ عفوًا ـ لأنّ من شرط إطلاق الأسماء على الله عز وجل أن يتضمّن الكماليّة المطلقة."]], "tr": [[2330.0, "Derim ki: Yani bu itlaktan Allah Azze ve Celle'ye bir isim türetmemiz uygun değildir."], [2341.6, "Bilakis onu fiil itlakı babından veya haber itlakı babından ya da —sıfat olarak sahihse— en azından sıfat itlakı babından sayarız."], [2353.0, "Çünkü Allah Azze ve Celle'ye isim itlak etmenin şartı, bunun —pardon— Allah Azze ve Celle'ye isim itlak etmenin şartı, mutlak kemali içermesidir."]]}, {"reader": false, "ar": [[2369.0, "ويوضّح ذلك جُمَلٌ من الأمثلة:"], [2373.0, "المثال الأوّل: في الصحيحين من حديث أبي هريرة رضي الله عنه قال:"], [2378.5, "قال النبيّ صلى الله عليه وسلم ـ فيما يرويه عن ربّه عز وجل ـ:"], [2385.1, "«يؤذيني ابنُ آدم، يسبّ الدهر، وأنا الدهر، بيدي الأمر، أقلّب الليل والنهار» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [2393.0, "فقد أطلق الله عز وجل على نفسه «الدهر»،"], [2398.0, "ولكن لو تأمّلتَ «الدهر» لما وجدتَه يدلّ على الكماليّة المطلقة؛ لأنّ معناه الزمان."]], "tr": [[2369.0, "Bunu birkaç örnek açıklar. Birinci örnek:"], [2373.0, "Sahîhayn'da Ebû Hüreyre'den —Allah ondan razı olsun— gelen hadiste, dedi ki:"], [2378.5, "Peygamber sallallâhu aleyhi ve sellem, Rabbi Azze ve Celle'den rivayet ettiği hadiste şöyle buyurdu:"], [2385.1, "\"Âdemoğlu bana eziyet ediyor; zamana söver."], [2387.0, "Hâlbuki zaman benim; iş benim elimdedir, geceyi ve gündüzü ben evirip çeviririm.\" <span class=\"note\">(Buhârî, Müslim)<\/span>."], [2393.0, "Allah Azze ve Celle kendisi hakkında \"ed-Dehr\" (zaman) lafzını kullanmıştır."], [2398.6, "Fakat \"ed-Dehr\"i düşünsen onun mutlak kemale delâlet etmediğini görürsün; çünkü anlamı zamandır."]]}, {"reader": false, "ar": [[2405.0, "وبناءً على ذلك فلا ينبغي أن نحمل هذا الإطلاق محملَ إطلاق الأسماء،"], [2412.0, "وإنما نحمله على أنه إطلاقُ أخبارٍ عن شيءٍ من فعل الله عز وجل،"], [2419.0, "وهو تقليب الليل والنهار،"], [2422.0, "بدليل آخر الحديث في قوله صلى الله عليه وسلم:"], [2426.3, "«بيدي الأمر، أقلّب الليل والنهار»."]], "tr": [[2405.0, "Buna dayanarak bu itlakı isim itlakı olarak anlamamız uygun değildir."], [2412.0, "Bilakis onu Allah Azze ve Celle'nin fiilinden bir şey hakkında haber itlakı olarak anlarız;"], [2422.0, "o da gecenin ve gündüzün evrilip çevrilmesidir."], [2426.3, "Delili, hadisin sonundaki şu sözüdür sallallâhu aleyhi ve sellem:"], [2428.0, "\"İş benim elimdedir, geceyi ve gündüzü ben evirip çeviririm.\""]]}, {"reader": false, "ar": [[2430.0, "ومن الأمثلة أيضًا: إطلاق «الفالق» على الله عز وجل في قول الله عز وجل:"], [2443.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ فَالِقُ الْحَبِّ وَالنَّوَىٰ﴾<\/span> <span class=\"ref\">[الأنعام: ٩٥]<\/span>؛"], [2446.0, "فذهب بعضُ أهل العلم ـ ولا يُوافَق على ما ذهب إليه ـ بأنّ من أسماء الله عز وجل «الفالق»،"], [2454.5, "استدلالًا بهذه الآية. ولكن لو نظرتَ إلى هذا الإطلاق لما وجدتَه يتضمّن معنى الكماليّة المطلقة من كلّ وجه."], [2466.0, "وبناءً على ذلك فلا ينبغي أن نحمل هذا الإطلاق محملَ إطلاق الأسماء،"], [2474.0, "وإنما نحمله على أنه إطلاقُ خبرٍ عن فعلٍ من أفعال الله عز وجل؛"], [2480.8, "فمن جملة أفعاله أنه يفلق الحبَّ والنوى."]], "tr": [[2430.0, "Örneklerden biri de Allah Azze ve Celle'nin şu sözünde \"el-Fâlik\" lafzının Allah Azze ve Celle hakkında kullanılmasıdır:"], [2443.0, "<span class=\"ayah\">﴿Şüphesiz Allah, tohumu ve çekirdeği yaran (Fâlik) O'dur﴾<\/span> [En'âm 95]."], [2446.0, "Bazı ilim ehli —ki vardığı görüşte ona katılınmaz— bu ayeti delil getirerek \"el-Fâlik\"in Allah Azze ve Celle'nin isimlerinden olduğunu söylemiştir."], [2458.0, "Fakat bu itlaka baksan, onun her yönden mutlak kemal anlamını içermediğini görürsün."], [2466.0, "Buna dayanarak bu itlakı isim itlakı olarak anlamamız uygun değildir;"], [2472.7, "bilakis onu Allah Azze ve Celle'nin fiillerinden bir fiil hakkında haber itlakı olarak anlarız."], [2480.8, "O'nun fiillerinden biri de tohumu ve çekirdeği yarmasıdır."]]}, {"reader": false, "ar": [[2484.0, "المثال الثالث: «المسعِّر»؛ ففي السنن من حديث أنسٍ رضي الله تعالى عنه قال:"], [2497.9, "غلا السعرُ في المدينة،"], [2503.0, "فذكر ذلك أصحابُ النبيّ ـ فذكروا ذلك للنبيّ صلى الله عليه وسلم،"], [2508.0, "وقالوا: يا رسول الله،"], [2510.0, "سعِّر لنا. قال: «إنّ الله هو المسعِّر» <span class=\"note\">(Ebû Dâvûd, Tirmizî, İbn Mâce)<\/span>،"], [2515.0, "الحديث بتمامه. فأطلق النبيّ صلى الله عليه وسلم على ربّه هنا «المسعِّر»."]], "tr": [[2484.0, "Üçüncü örnek: \"el-Müsa''ir\" (fiyatları belirleyen)."], [2491.0, "Sünen'lerde Enes'ten —Allah ondan razı olsun— gelen hadiste, dedi ki:"], [2496.7, "Medine'de fiyatlar yükseldi. Peygamber'in ashâbı bunu —bunu Peygamber sallallâhu aleyhi ve sellem'e anlattılar ve \"Ey Allah'ın Resûlü, bize fiyat koy\" dediler."], [2508.5, "Buyurdu ki: \"Şüphesiz fiyatları belirleyen (Müsa''ir) Allah'tır.\" <span class=\"note\">(Ebû Dâvûd, Tirmizî, İbn Mâce)<\/span>;"], [2517.0, "hadisin tamamı (bilinmektedir). Peygamber sallallâhu aleyhi ve sellem burada Rabbi hakkında \"el-Müsa''ir\" lafzını kullandı."]]}, {"reader": false, "ar": [[2524.0, "فاختلف أهلُ السنّة والجماعة في هذا الإطلاق:"], [2528.0, "أهو من باب إطلاق الأسماء،"], [2532.0, "أم من باب إطلاق الأخبار عن فعلٍ من أفعاله؟"], [2538.0, "وهذه الكلّيّة التي معنا ترجّح القولَ الثاني،"], [2543.0, "وإن كان الخلاف فيها محتمَلًا؛"], [2546.0, "لأنّ الخلاف فيها في مذهب أهل السنّة أنفسهم،"], [2549.2, "فليست هذه المسألة من مسائل التوحيد الكبار التي يُوالى ويُعادى عليها."], [2558.0, "فإنك لو تأمّلتَ اسم «المسعِّر» لوجدتَه يتضمّن صفةَ التسعير،"], [2563.0, "وليس هذا من المعاني التي تتضمّن الكماليّة المطلقة."]], "tr": [[2524.0, "Ehl-i Sünnet ve'l-Cemaat bu itlak hakkında ihtilaf etmiştir:"], [2528.0, "İsim itlakı babından mıdır, yoksa O'nun fiillerinden bir fiil hakkında haber itlakı babından mı?"], [2538.0, "Elimizdeki bu külliye ikinci görüşü tercih ettirir;"], [2546.0, "gerçi bu konudaki ihtilaf hoş görülebilir, çünkü ihtilaf Ehl-i Sünnet'in kendi mezhebi içindedir."], [2550.5, "Bu mesele, üzerine dostluk ve düşmanlık kurulan büyük tevhid meselelerinden değildir."], [2558.0, "Zira \"el-Müsa''ir\" ismini düşünsen, onun fiyat belirleme sıfatını kapsadığını görürsün;"], [2563.7, "bu ise mutlak kemali içeren anlamlardan değildir."]]}, {"reader": false, "ar": [[2569.0, "ومن الأمثلة أيضًا: «الخليفة»؛"], [2577.0, "فقد قال النبيّ صلى الله عليه وسلم:"], [2584.0, "«اللهمّ أنت الصاحبُ في السفر، والخليفةُ في الأهل» <span class=\"note\">(Müslim)<\/span>."], [2590.0, "وأنت تعرف أنّ هذا الإطلاق ـ أعني به إطلاق «الخليفة» ـ ليس ممّا يتضمّن المعنى الكماليّ المطلق؛"], [2601.0, "فإنّ الخليفة هو من يخلُف الشيء،"], [2605.0, "أو من يخلُف أحدًا في شيءٍ معيّن،"], [2609.0, "وهذا ليس ممّا يتضمّن ذلك المعنى الكماليّ المطلق."]], "tr": [[2569.0, "Örneklerden biri de \"el-Halîfe\"dir. Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2584.0, "\"Allah'ım! Yolculukta arkadaş (Sâhib) sensin, ailede (geride kalanlara) vekil (Halîfe) sensin.\" <span class=\"note\">(Müslim)<\/span>."], [2592.0, "Bilirsin ki bu itlak —yani \"el-Halîfe\" itlakı— mutlak kemal anlamını içeren şeylerden değildir."], [2601.0, "Çünkü halîfe, bir şeyin yerine geçen veya belirli bir hususta birinin yerine geçendir;"], [2608.4, "bu ise o mutlak kemal anlamını içeren şeylerden değildir."]]}, {"reader": false, "ar": [[2615.0, "وبناءً على ذلك فإطلاق «الخليفة» على الله لا يصحّ أن نحمله محملَ إطلاق الأسماء،"], [2622.0, "وإنما إطلاقُ خبرٍ عن فعلٍ من أفعال الله عز وجل؛"], [2626.0, "فمن جملة أفعاله أنه يخلُف العبدَ المسافرَ في أهله،"], [2629.5, "أو الغازيَ في أهله."], [2631.0, "ولذلك سُئلت اللجنة الدائمة في المملكة العربيّة السعوديّة عن هذا الاسم «الخليفة»:"], [2640.0, "هل يصحّ إطلاقه على الله عز وجل إطلاقَ أسماء؟"], [2643.0, "فقالوا: «ليس الخليفةُ ولا الصاحبُ من أسماء الله عز وجل، وقولُه صلى الله عليه وسلم: \"اللهمّ أنت الصاحب في السفر والخليفة في الأهل\" من باب الإخبار، لا من باب التسمية». انتهى كلامه."]], "tr": [[2615.0, "Buna dayanarak \"el-Halîfe\"nin Allah hakkında kullanılmasını isim itlakı olarak anlamamız sahih değildir;"], [2621.1, "bu ancak Allah Azze ve Celle'nin fiillerinden bir fiil hakkında haber itlakıdır."], [2626.0, "O'nun fiillerinden biri de yolcu kulun veya gazinin ailesinde onun yerine geçmesidir (onları korumasıdır)."], [2631.0, "Bu yüzden Suudi Arabistan Krallığı'ndaki Daimî Komite'ye (el-Lecnetü'd-Dâime) bu \"el-Halîfe\" ismi soruldu:"], [2640.0, "Allah Azze ve Celle hakkında isim olarak kullanılması sahih midir?"], [2643.0, "Şöyle dediler: \"Ne el-Halîfe ne de es-Sâhib Allah Azze ve Celle'nin isimlerinden değildir."], [2648.6, "Onun sallallâhu aleyhi ve sellem 'Allah'ım!"], [2651.9, "Yolculukta arkadaş sensin, ailede vekil sensin' sözü isimlendirme babından değil, haber verme babındandır.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2658.0, "ومن الأمثلة أيضًا: إطلاق «الصاحب»،"], [2662.0, "وأظنّكم عرفتم العلّة في ذلك."], [2667.0, "فإطلاق «الصاحب» على الله في الأصحّ إنما هو إطلاقُ خبرٍ عن فعلٍ من أفعال الله عز وجل:"], [2675.0, "أنه يصحب ـ صحبةً تليق بجلاله وعظمته ـ المسافرَ إذا استعان في سفره به عز وجل،"], [2684.0, "وقال ذلك الذكرَ المعيَّن."]], "tr": [[2658.0, "Örneklerden biri de \"es-Sâhib\" itlakıdır;"], [2660.4, "sanırım bunun illetini anladınız. En sahih görüşe göre \"es-Sâhib\"in Allah hakkında kullanılması, Allah Azze ve Celle'nin fiillerinden bir fiil hakkında haber itlakıdır:"], [2675.0, "O, yolculuğunda O Azze ve Celle'den yardım dileyen ve o belirli zikri söyleyen yolcuya, celâline ve azametine yakışır bir arkadaşlıkla arkadaşlık eder."]]}]}, {"ts": "44:48", "title": "7. Külliye (devam): es-Sâni', el-Fâil, et-Tabîb", "paras": [{"reader": false, "ar": [[2688.0, "ومنها أيضًا: إطلاق «الصانع» في قول الله عز وجل:"], [2697.0, "<span class=\"ayah\">﴿صُنْعَ اللَّهِ الَّذِي أَتْقَنَ كُلَّ شَيْءٍ﴾<\/span> <span class=\"ref\">[النمل: ٨٨]<\/span>،"], [2703.0, "أو «إنّ الله صانعُ كلِّ صانعٍ وصنعتِه»،"], [2709.0, "إن صحّ ذلك الحديث."], [2710.0, "فإطلاق «الصانع» على الله عز وجل في هذه الأدلّة:"], [2715.0, "أهو من باب إطلاق الأخبار عن فعلٍ من أفعال الله،"], [2720.0, "أو من باب إطلاق الأسماء؟"], [2721.0, "على قولين لأهل السنّة والجماعة،"], [2724.0, "والقول الصحيح أنه من باب إطلاق الأخبار؛"], [2728.0, "لأنّ «الصانع» يتضمّن صفة الصنعة أو الصنع،"], [2735.0, "وليس ذلك من الصفات التي تتضمّن معنًى كماليًّا مطلقًا."]], "tr": [[2688.0, "Bunlardan biri de Allah Azze ve Celle'nin şu sözünde \"es-Sâni'\" (yapan) lafzının kullanılmasıdır:"], [2700.8, "<span class=\"ayah\">﴿Her şeyi sağlam ve kusursuz yapan Allah'ın sanatı﴾<\/span> [Neml 88];"], [2710.0, "ya da —o hadis sahihse— \"Şüphesiz Allah her yapanı ve onun yaptığını yapandır (yaratandır).\" Bu delillerde \"es-Sâni'\"in Allah Azze ve Celle hakkında kullanılması, Allah'ın fiillerinden bir fiil hakkında haber itlakı babından mıdır, yoksa isim itlakı babından mı?"], [2721.0, "Ehl-i Sünnet ve'l-Cemaat'in bu konuda iki görüşü vardır."], [2724.6, "Sahih görüş, haber itlakı babından olduğudur;"], [2728.0, "çünkü \"es-Sâni'\" san'at veya sun' (yapma) sıfatını kapsar, bu ise mutlak bir kemal anlamını içeren sıfatlardan değildir."]]}, {"reader": false, "ar": [[2743.0, "وكذلك إطلاق «الفاعل» على الله عز وجل في قوله:"], [2750.3, "<span class=\"ayah\">﴿فَعَّالٌ لِّمَا يُرِيدُ﴾<\/span> <span class=\"ref\">[البروج: ١٦]<\/span>؛ فالصواب فيه أنه ليس من باب إطلاق الأسماء،"], [2757.0, "وإنما من باب إطلاق الأخبار عن فعلٍ من أفعال الله عز وجل."], [2761.0, "قال الإمام ابن القيّم رحمه الله تعالى:"], [2765.0, "«لفظ \"الفاعل\" ـ انتبهوا ـ و\"الصانع\" لا يُطلق عليه في أسمائه الحسنى إلا إطلاقًا مقيّدًا كما أطلقه على نفسه، كقوله تعالى: <span class=\"ayah\">﴿فَعَّالٌ لِّمَا يُرِيدُ﴾<\/span> <span class=\"ref\">[البروج: ١٦]<\/span>، وفي قوله: <span class=\"ayah\">﴿وَيَفْعَلُ اللَّهُ مَا يَشَاءُ﴾<\/span> <span class=\"ref\">[إبراهيم: ٢٧]<\/span>، وقوله: <span class=\"ayah\">﴿صُنْعَ اللَّهِ الَّذِي أَتْقَنَ كُلَّ شَيْءٍ﴾<\/span> <span class=\"ref\">[النمل: ٨٨]<\/span>». انتهى كلامه."]], "tr": [[2743.0, "Aynı şekilde O'nun şu sözünde \"el-Fâil\" (yapan) lafzının Allah Azze ve Celle hakkında kullanılması:"], [2750.3, "<span class=\"ayah\">﴿Dilediğini hakkıyla yapandır﴾<\/span> [Bürûc 16]."], [2753.0, "Bu konuda doğru olan, onun isim itlakı babından olmadığı, bilakis Allah Azze ve Celle'nin fiillerinden bir fiil hakkında haber itlakı babından olduğudur."], [2759.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [2761.0, "\"'el-Fâil' —dikkat edin— ve 'es-Sâni'' lafzı, O'nun güzel isimleri arasında O'na ancak kendisinin kendisi hakkında kullandığı gibi kayıtlı olarak itlak edilir."], [2763.9, "Tıpkı Teâlâ'nın şu sözünde olduğu gibi:"], [2765.0, "<span class=\"ayah\">﴿Dilediğini hakkıyla yapandır﴾<\/span> [Bürûc 16];"], [2769.4, "şu sözünde: <span class=\"ayah\">﴿Allah dilediğini yapar﴾<\/span> [İbrâhîm 27];"], [2775.9, "ve şu sözünde: <span class=\"ayah\">﴿Her şeyi sağlam ve kusursuz yapan Allah'ın sanatı﴾<\/span> [Neml 88].\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2788.0, "وقال الإمام العلّامة سليمان بن عبد الله بن محمد بن عبد الوهّاب ـ رحم الله الجميع رحمةً واسعة ـ:"], [2798.0, "«أسماؤه أحسن الأسماء، كما أنّ صفاته أكمل الصفات، فلا تُعدَل عمّا سمّى به نفسَه إلى غيره، كما لا يُتجاوَز ما وصف به نفسَه ووصفه به رسولُه صلى الله عليه وسلم»."], [2815.0, "إلى أن قال: «ومن هنا يتبيّن لك خطأُ من أطلق عليه اسمَ \"الصانع\" و\"الفاعل\" و\"المربّي\" ونحوها؛ لأنّ اللفظ الذي أطلقه سبحانه على نفسه وأخبر به عنها أتمُّ من هذا وأكمل وأجلّ شأنًا». انتهى كلامه."
