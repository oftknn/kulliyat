"title": "8. Külliye: \"Vesîle\" lafzının geçtiği her yerde anlamı, onu söyleyene göre değişir", "paras": [{"reader": false, "ar": [[2463.0, "الكلّيّة الأخيرة ـ لأني أظنّ أنني أطلتُ ـ:"], [2479.0, "<b>كلُّ موضعٍ ذُكر فيه لفظُ الوسيلة فيختلف معناه باختلاف المتكلّم به.<\/b> وهي قاعدةٌ مهمّة."], [2485.9, "<span class=\"note\">(يكررها)<\/span> وهذا من أعظم ما ينبغي فهمُه في باب التوسُّل؛"]], "tr": [[2463.0, "Son külliye —çünkü sanırım uzattım—:"], [2466.1, "<b>8. külliye: \"Vesîle\" lafzının zikredildiği her yerde, onun anlamı onu söyleyenin farklılığına göre değişir.<\/b> Bu önemli bir kaidedir."], [2485.9, "(Tekrar ediyor.) Bu, tevessül babında anlaşılması gereken en büyük şeylerdendir."]]}, {"reader": false, "ar": [[2513.0, "لأنّ عدم الفهم في هذه الجزئيّة أوجب خللًا عظيمًا في باب التوسُّل،"], [2521.0, "وأدخل بِدَعًا عظيمةً ومحدَثاتٍ كبيرةً في هذا الباب."], [2525.0, "وذلك لأنّ لفظ الوسيلة قد يَرِد في كلام الله أحيانًا،"], [2532.0, "فيكون المتكلّمُ بلفظ الوسيلة إنما هو اللهُ تبارك وتعالى،"], [2538.0, "فيكون معنى الوسيلة في كلام الله عز وجل:"], [2543.0, "فعلَ مقتضى الشرع، بفعل ما أمر،"], [2547.1, "وترك ما نهى عنه وزجر."]], "tr": [[2513.0, "Çünkü bu cüz'î meselenin anlaşılmaması tevessül babında büyük bir bozukluğa yol açmış, bu baba büyük bid'atler ve büyük muhdesât (sonradan çıkarılmış şeyler) sokmuştur."], [2525.0, "Bu şundandır: \"Vesîle\" lafzı bazen Allah'ın kelamında geçer;"], [2529.9, "o zaman \"vesîle\" lafzını söyleyen Allah Tebâreke ve Teâlâ'dır."], [2535.3, "Bu durumda Allah Azze ve Celle'nin kelamında vesîlenin anlamı, şeriatın gereğini yapmaktır;"], [2543.0, "emrettiğini yaparak, nehyettiğini ve men ettiğini terk ederek."]]}, {"reader": false, "ar": [[2552.0, "وقد ورد لفظُ الوسيلة في موضعين من كتاب الله عز وجل:"], [2557.0, "في قول الله عز وجل في سورة المائدة:"], [2561.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَابْتَغُوا إِلَيْهِ الْوَسِيلَةَ﴾<\/span> <span class=\"ref\">[المائدة: ٣٥]<\/span>،"], [2565.0, "أي: بفعل ما أمركم به وترك ما نهاكم عنه."], [2569.0, "وفي سورة الإسراء في قول الله عز وجل:"], [2573.1, "<span class=\"ayah\">﴿أُولَٰئِكَ الَّذِينَ يَدْعُونَ يَبْتَغُونَ إِلَىٰ رَبِّهِمُ الْوَسِيلَةَ﴾<\/span> <span class=\"ref\">[الإسراء: ٥٧]<\/span>،"], [2579.0, "أي: أنتم تعبدونهم من دوني،"], [2581.8, "وهم أصلًا عبادٌ لي،"], [2584.0, "مشتغلون بفعل ما أمرتُهم به وترك ما نهيتُهم عنه."]], "tr": [[2552.0, "\"Vesîle\" lafzı Allah Azze ve Celle'nin Kitabı'nda iki yerde geçmiştir:"], [2557.0, "Allah Azze ve Celle'nin Mâide sûresindeki şu sözünde:"], [2561.0, "<span class=\"ayah\">﴿Ey iman edenler! Allah'tan sakının ve O'na yaklaşmaya vesile arayın﴾<\/span> [Mâide 35];"], [2565.4, "yani size emrettiğini yaparak ve sizi nehyettiğini terk ederek."], [2569.0, "Ve İsrâ sûresinde Allah Azze ve Celle'nin şu sözünde:"], [2573.1, "<span class=\"ayah\">﴿Onların dua ettikleri o kimseler, Rablerine yaklaşmaya vesile ararlar﴾<\/span> [İsrâ 57];"], [2579.6, "yani: Siz onlara beni bırakıp ibadet ediyorsunuz, oysa onlar aslen benim kullarımdır;"], [2584.4, "onlara emrettiğimi yapmak ve onları nehyettiğimi terk etmekle meşguldürler."]]}, {"reader": false, "ar": [[2588.0, "فمتى ما أطلق اللهُ عز وجل لفظَ الوسيلة في كتابه فبإجماع أهل العلم من أهل السنّة والجماعة أنه يريد:"], [2600.4, "فعلَ ما أمر، وتركَ ما نهى عنه وزجر."], [2606.0, "والموضعُ الثاني: إذا كان المتكلّمُ بلفظ الوسيلة النبيَّ صلى الله عليه وسلم؛"], [2613.4, "فمتى ما ـ رأيتَ النبيّ صلى الله… ـ فمتى ما سمعتَ النبيّ صلى الله عليه وسلم يُطلق لفظَ الوسيلة فاعلم أنه يريد بها معنًى واحدًا فقط،"], [2626.0, "وهي تلك المنزلة التي في الجنّة،"], [2628.6, "والتي لا تنبغي إلا لعبدٍ من عباد الله."]], "tr": [[2588.0, "Allah Azze ve Celle Kitabı'nda \"vesîle\" lafzını ne zaman kullansa, Ehl-i Sünnet ve'l-Cemaat'ten ilim ehlinin icmâıyla, onunla emrettiğini yapmayı ve nehyettiğini ve men ettiğini terk etmeyi kasteder."], [2606.0, "İkinci yer: \"Vesîle\" lafzını söyleyen Peygamber sallallâhu aleyhi ve sellem olduğunda."], [2613.4, "Peygamber sallallâhu aleyhi ve sellem'in \"vesîle\" lafzını kullandığını ne zaman işitirsen bil ki onunla tek bir anlamı kastetmektedir;"], [2625.1, "o da cennetteki, Allah'ın kullarından yalnızca bir kula layık olan o makamdır."]]}, {"reader": false, "ar": [[2632.0, "وقد ورد لفظُ الوسيلة في جُمَلٍ من الأحاديث؛"], [2636.0, "ففي «صحيح الإمام مسلم» من حديث عبد الله بن عمرٍو رضي الله عنهما قال:"], [2641.6, "قال النبيُّ صلى الله عليه وسلم:"], [2645.0, "«إذا سمعتم المؤذّن فقولوا مثلَ ما يقول، ثم سلوا اللهَ لي الوسيلة؛ فإنها منزلةٌ في الجنّة لا تنبغي إلا لعبدٍ من عباد الله، وأرجو أن أكون أنا هو، فمن سأل لي الوسيلةَ حلّت له شفاعتي» ـ أو قال: «حلّت له الشفاعة»."]], "tr": [[2632.0, "\"Vesîle\" lafzı birçok hadiste geçmiştir."], [2633.0, "\"Sahîh-i Müslim\"de Abdullah b. Amr —Allah ikisinden de razı olsun— hadisinde şöyle der:"], [2636.0, "Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [2638.7, "\"Müezzini işittiğinizde onun dediğinin benzerini söyleyin, sonra Allah'tan benim için vesîleyi isteyin."], [2645.0, "Çünkü o, cennette Allah'ın kullarından yalnızca bir kula layık olan bir makamdır;"], [2652.4, "o kulun ben olmamı umarım."], [2655.5, "Kim benim için vesîleyi isterse ona şefaatim helal olur\" —ya da:"], [2661.4, "\"ona şefaat helal olur\" buyurdu."]]}, {"reader": false, "ar": [[2662.0, "وفي «صحيح الإمام البخاريّ» رحمه الله تعالى من حديث جابر بن عبد الله رضي الله عنهما قال:"], [2670.9, "قال النبيُّ صلى الله عليه وسلم:"], [2674.0, "«من قال حين يسمع النداء: اللهمّ ربَّ هذه الدعوة التامّة، والصلاة القائمة، آتِ محمّدًا صلى الله عليه وسلم الوسيلةَ والفضيلة» ـ وهي تلك المنزلة في الجنّة."], [2687.0, "فأنت ترى أنّ معناها في كلام رسول الله صلى الله عليه وسلم يختلف تمامًا عن المعنى في كلام الله عز وجل."]], "tr": [[2662.0, "\"Sahîh-i Buhârî\"de —Allah Teâlâ ona rahmet etsin— Câbir b."], [2666.2, "Abdullah —Allah ikisinden de razı olsun— hadisinde şöyle der:"], [2670.9, "Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [2674.0, "\"Kim ezanı işittiğinde: Allah'ım! Bu tam davetin ve kılınacak namazın Rabbi!"], [2679.2, "Muhammed'e —sallallâhu aleyhi ve sellem— vesîleyi ve fazileti ver, derse…\" —o da cennetteki o makamdır—."], [2687.0, "Görüyorsun ki onun Resûlullah sallallâhu aleyhi ve sellem'in kelamındaki anlamı, Allah Azze ve Celle'nin kelamındaki anlamdan tamamen farklıdır."]]}]}, {"ts": "44:55", "title": "8. Külliye (devam): Sahâbînin dilinde vesîle — dua talebi; Ömer'in Abbâs ile tevessülü", "paras": [{"reader": false, "ar": [[2695.0, "والمصيبةُ عند كثيرٍ من أهل البدع هو المعنى الثالث،"], [2701.0, "وهي لفظُ الوسيلة إذا ورد على لسان صحابيّ؛"], [2706.0, "فيكون معناه مختلفًا تمامًا عن المعنيَين الأوّلَيْن ـ أو الأوّلين."], [2715.0, "فمتى ما سمعتَ صحابيًّا يتكلّم بلفظ التوسُّل أو الوسيلة فاعلم أنهم لا يريدون به إلا معنًى واحدًا فقط،"], [2726.2, "وهي طلبُ الدعاء من المتوسَّل به،"], [2729.0, "طلبُ الدعاء من المتوسَّل به،"], [2731.0, "لا يريدون بها غير ذلك."]], "tr": [[2695.0, "Bid'at ehlinin birçoğundaki musibet üçüncü anlamdır;"], [2699.7, "o da \"vesîle\" lafzının bir sahâbînin dilinde geçmesidir."], [2706.0, "Bu durumda onun anlamı ilk iki anlamdan tamamen farklıdır."], [2715.0, "Bir sahâbînin \"tevessül\" veya \"vesîle\" lafzıyla konuştuğunu ne zaman işitirsen bil ki onlar bununla tek bir anlamı kastederler;"], [2725.3, "o da kendisiyle tevessül edilenden dua talep etmektir, kendisiyle tevessül edilenden dua talep etmek."], [2731.0, "Bununla başka bir şey kastetmezler."]]}, {"reader": false, "ar": [[2738.0, "فلا يقصدون بها التوسُّلَ بذات المتوسَّل به،"], [2742.7, "ولا بحقّ المتوسَّل به،"], [2745.3, "ولا بجاه المتوسَّل به،"], [2749.0, "وإنما لا يريدون به إلا طلبَ الدعاء منه؛"], [2753.0, "كما في «صحيح البخاريّ» من حديث عمر الذي ذكرتُه لكم آنفًا،"], [2760.2, "في استسقائه، في توسُّله بالعبّاس بن عبد المطّلب،"], [2768.0, "فقال: «اللهمّ إنّا كنّا نتوسّل بنبيّك» أي:"], [2772.2, "نطلب الدعاء منه، كما بيّنته الأحاديث الأخرى أنهم كانوا إذا قُحِطوا إنما يفزعون إلى النبيّ صلى الله عليه وسلم،"], [2783.0, "فيتوسّلون إلى الله بطلب الدعاء منه."]], "tr": [[2738.0, "Bununla, kendisiyle tevessül edilenin zâtıyla, hakkıyla veya câhıyla (makamıyla) tevessülü kastetmezler;"], [2747.3, "bununla ancak ondan dua talep etmeyi kastederler."], [2753.0, "Nitekim size az önce zikrettiğim, \"Sahîh-i Buhârî\"deki Ömer'in hadisinde, onun yağmur duasında, Abbâs b."], [2762.1, "Abdülmuttalib ile tevessülünde şöyle demiştir:"], [2768.6, "\"Allah'ım! Biz senin Peygamberinle tevessül ederdik\";"], [2772.2, "yani ondan dua talep ederdik."], [2774.6, "Diğer hadislerin açıkladığı gibi, onlar kuraklığa uğradıklarında Peygamber sallallâhu aleyhi ve sellem'e koşarlar ve ondan dua talep ederek Allah'a tevessül ederlerdi."]]}, {"reader": false, "ar": [[2787.0, "فالمُجمَلُ في كلام عمر تُفسِّره الأحوالُ الأخرى."], [2793.0, "فقوله: «نتوسّل بنبيّك» لا يقصدون به:"], [2797.0, "نتوسّل بجاهه أو بذاته أو بحقّه،"], [2801.0, "كما يفهمه عامّةُ أهل البدع،"], [2803.0, "وإنما لا يريدون به إلا:"], [2805.2, "نطلب الدعاء من نبيّك."], [2807.0, "«وإنّ نبيّك صلى الله عليه وسلم قد مات، وإنّا نتوسّل إليك بعمّ نبيّك»،"], [2814.0, "أي: بطلب الدعاء من العبّاس،"], [2816.0, "بدليل قوله في آخر الحديث:"], [2818.0, "«قم يا عبّاس فادعُه»."]], "tr": [[2787.0, "Ömer'in sözündeki mücmel (kapalı) ifadeyi diğer hâller tefsir eder."], [2797.0, "\"Peygamberinle tevessül ederdik\" sözüyle, bid'at ehlinin geneli gibi, onun câhıyla, zâtıyla veya hakkıyla tevessül ederdik demeyi kastetmezler;"], [2805.2, "bununla ancak \"Peygamberinden dua talep ederdik\" demeyi kastederler."], [2807.0, "\"Peygamberin sallallâhu aleyhi ve sellem ise vefat etti;"], [2810.0, "şimdi sana Peygamberinin amcasıyla tevessül ediyoruz\";"], [2814.4, "yani Abbâs'tan dua talep ederek."], [2816.0, "Delili de hadisin sonundaki şu sözüdür:"], [2818.0, "\"Kalk ey Abbâs, O'na dua et.\""]]}, {"reader": false, "ar": [[2821.0, "وهذا الموضعُ الأخير هو الذي جعل كثيرًا من أهل البدع يُجيز التوسُّلَ بماذا؟"], [2832.0, "بذوات الأنبياء، وذوات الصالحين والأولياء. ماشي معي؟ نعم."]], "tr": [[2821.0, "İşte bu son yer, bid'at ehlinin birçoğunun neyle tevessülü caiz görmesine yol açmıştır?"], [2832.0, "Nebîlerin zâtlarıyla, sâlihlerin ve velilerin zâtlarıyla."], [2835.4, "Benimle birlikte geliyor musunuz? Evet."]]}]}, {"ts": "47:16", "title": "8. Külliye (devam): A'mâ hadisi ve özet · Kapanış", "paras": [{"reader": false, "ar": [[2836.0, "ومنها أيضًا حديثُ الأعمى عند الإمام الترمذيّ وغيره ـ مع التسليم بكونه حسنًا،"], [2847.0, "وإلّا فإنّ كثيرًا من أهل العلم حكم عليه بالضعف ـ لكن مع التسليم بأنه حديثٌ حسن:"], [2855.3, "فإنّ ذلك الأعمى جاء إلى النبيّ صلى الله عليه وسلم يتوسّل به:"], [2862.0, "«اللهمّ إني أتوسّل بنبيّك»."], [2867.0, "فبما أنّ المتلفّظ بلفظ التوسُّل صحابيّ،"], [2870.9, "فنرجع إلى قاعدته، وهي أنّ معناه طلبُ الدعاء؛"], [2876.0, "بدليل: «يا محمّد، قم فادعُه»،"], [2881.0, "وبروايةِ: «إن شئتَ دعوتُ اللهَ لك، وإن شئتَ صبرتَ فهو خيرٌ لك»،"], [2891.0, "قال: «بل ادعُه»، فدعا له النبيُّ صلى الله عليه وسلم."]], "tr": [[2836.0, "Bunlardan biri de İmam Tirmizî'nin ve başkalarının rivayet ettiği a'mâ (kör adam) hadisidir —hasen olduğunu kabul etmek şartıyla;"], [2848.1, "yoksa ilim ehlinin birçoğu ona zayıf hükmü vermiştir—."], [2852.0, "Fakat hasen bir hadis olduğunu kabul edersek:"], [2855.3, "O kör adam Peygamber sallallâhu aleyhi ve sellem'e gelip onunla tevessül ediyordu:"], [2862.0, "\"Allah'ım! Senin Peygamberinle tevessül ediyorum.\" \"Tevessül\" lafzını söyleyen bir sahâbî olduğuna göre, onun kaidesine döneriz;"], [2872.1, "o da bunun anlamının dua talebi olduğudur."], [2876.0, "Delili: \"Ey Muhammed! Kalk, O'na dua et\" (sözü) ve şu rivayettir:"], [2881.7, "\"Dilersen senin için Allah'a dua ederim;"], [2884.4, "dilersen sabredersin, bu senin için daha hayırlıdır.\" (Adam) dedi ki:"], [2891.7, "\"Hayır, O'na dua et.\" Peygamber sallallâhu aleyhi ve sellem de onun için dua etti."]]}, {"reader": false, "ar": [[2898.0, "وقد أجمع أهلُ البدع على أنهم لا يفهمون من التوسُّل في حديث الأعمى إلا أنه توسُّلٌ إلى الله عز وجل بماذا؟"], [2908.0, "بجاه رسول الله صلى الله عليه وسلم،"], [2912.0, "وبذات النبيّ صلى الله عليه وسلم،"], [2915.0, "أو بحقّه. وكلُّ ذلك ممّا أُدخل في باب التوسُّل على فهمٍ خاطئ."], [2921.0, "فهذه الكلّيّة تُطلِعك على وجوب التفريق بين معاني التوسُّل الثلاثة؛"], [2928.0, "فمعناه يختلف باختلاف المتكلّم به."], [2931.0, "صدقت كلّيّتُنا إن شاء الله."]], "tr": [[2898.0, "Bid'at ehli, a'mâ hadisindeki tevessülden ancak şunu anladıkları üzerinde birleşmişlerdir:"], [2904.5, "Bu, Allah Azze ve Celle'ye neyle tevessüldür?"], [2908.0, "Resûlullah sallallâhu aleyhi ve sellem'in câhıyla, Peygamber sallallâhu aleyhi ve sellem'in zâtıyla veya hakkıyla."], [2916.0, "Bütün bunlar, yanlış bir anlayışla tevessül babına sokulmuş şeylerdendir."], [2921.0, "Bu külliye seni, tevessülün üç anlamı arasında ayırım yapmanın vâcip olduğuna muttali kılar;"], [2928.0, "onun anlamı, onu söyleyenin farklılığına göre değişir. Külliyemiz inşallah doğru çıktı."]]}, {"reader": false, "ar": [[2934.0, "فلفظُ التوسُّل إذا أطلقه الله فيريد به فعلَ الأوامر وتركَ النواهي،"], [2939.0, "أي: ملازمةَ مقتضى الشرع."], [2941.0, "وإذا أطلقه النبيُّ صلى الله عليه وسلم فإنما يريد به تلك المنزلةَ في الجنّة،"], [2947.0, "والتي لا تنبغي إلا لعبدٍ من عباد الله،"], [2950.0, "وهو النبيُّ صلى الله عليه وسلم."], [2954.0, "وإذا أطلقه الصحابة ـ وهو أهمُّها عندي ـ فإنما يريدون به طلبَ الدعاء من المتوسَّل،"], [2963.0, "طلبَ الدعاء من المتوسَّل به؛"], [2965.0, "فلا يريدون به لا التوسُّلَ بالذات ولا التوسُّلَ بالجاه."]], "tr": [[2934.0, "\"Tevessül\" lafzını Allah kullandığında onunla emirleri yapmayı ve yasakları terk etmeyi, yani şeriatın gereğine bağlı kalmayı kasteder."], [2941.0, "Peygamber sallallâhu aleyhi ve sellem kullandığında onunla cennetteki, Allah'ın kullarından yalnızca bir kula —o da Peygamber sallallâhu aleyhi ve sellem'dir— layık olan o makamı kasteder."], [2954.0, "Sahabe kullandığında —bence en önemlisi budur— onunla kendisiyle tevessül edilenden dua talep etmeyi kastederler, kendisiyle tevessül edilenden dua talebini;"], [2965.0, "bununla ne zâtla tevessülü ne de câhla tevessülü kastederler."]]}, {"reader": false, "ar": [[2969.0, "وبما أنّنا أتممنا الكلام على أنواع التوسُّل المشروعة،"], [2973.0, "ولم يبقَ عندنا إلا كلّيّاتُ التوسُّل الممنوعة،"], [2976.9, "ونُرجئها ـ إن شاء الله ـ إلى الدرس القادم بحول الله وقوّته."], [2981.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمّد."]], "tr": [[2969.0, "Meşru tevessül türleri hakkındaki sözü tamamladığımıza ve elimizde yasak tevessülün külliyelerinden başka bir şey kalmadığına göre, Allah'ın havl ve kuvvetiyle inşallah onları gelecek derse bırakıyoruz."], [2978.6, "Allah en yüce ve en iyi bilendir."], [2981.0, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
