<script>
const D={"no": 48, "vid": "iXajYmhAuWI", "title_ar": "الدرس (٤٨) من شرح كليات العقيدة — من كليات باب التوسل: التوسل المشروع", "title_tr": "Şerhu Külliyyâti'l-Akîde — 48. Ders: Tevessül Babı Külliyeleri (Tevessülün Tevkîfî Oluşu, Meşru Tevessül Çeşitleri ve \"Vesîle\" Lafzının Anlamları)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Tevessül, bütün taalluklarıyla tevkîfe dayanır", "paras": [{"reader": false, "ar": [[0.0, "بسم الله الرحمن الرحيم،"], [1.6, "الحمدُ لله ربِّ العالمين،"], [3.2, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.6, "وعلى آله وأصحابه، ومن تبعهم بإحسانٍ إلى يوم الدين،"], [9.2, "أمّا بعد: فلا نزالُ ـ ولله الحمدُ والمنّة ـ في سياق شرح قواعد توحيد الألوهيّة،"], [16.3, "وسنبدأ اليوم في بابٍ جديدٍ من أبواب توحيد الألوهيّة،"], [21.5, "وهو بابُ التوسُّل، وهو بابُ التوسُّل."], [25.0, "والكلامُ على هذا الباب في جُمَلٍ من الكلّيّات والقواعد."]], "tr": [[0.0, "Bismillâhirrahmânirrahîm. Âlemlerin Rabbi Allah'a hamd olsun."], [2.4, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.1, "Bundan sonra: Hamd ve minnet Allah'a, hâlâ ulûhiyyet tevhidi kaidelerinin şerhi bağlamındayız."], [16.9, "Bugün ulûhiyyet tevhidinin bablarından yeni bir baba başlayacağız;"], [21.5, "o da tevessül babıdır, tevessül babı."], [25.0, "Bu bab hakkındaki söz, birtakım külliyeler ve kaideler hâlinde olacaktır."]]}, {"reader": false, "ar": [[30.0, "الكلّيّة الأولى: <b>كلُّ التوسُّل بمتعلَّقاته مبنيٌّ على التوقيف.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[30.0, "<b>1. külliye: Tevessül, bütün taalluklarıyla tevkîf (nassa bağlılık) üzerine kuruludur.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[47.0, "أقول وبالله التوفيق: وهذه قاعدةٌ لا بدّ من فهمها في بداية الكلام على جزئيّات التوسُّل؛"], [54.0, "فلا يجوز للإنسان أن يتوسّل بأيّ وسيلةٍ لله عز وجل إلا إذا دلّ على جواز التوسُّل بها دليلٌ من الشرع."], [62.0, "فإنّ التوسُّل مبنيٌّ على مَحابِّ الله عز وجل،"], [68.0, "فهو بابٌ يُبنى على ما يحبّه الله عز وجل،"], [72.0, "ومحبّةُ الله عز وجل للأشياء أمرٌ غيبيٌّ لا يُطَّلَع عليها إلا بوحيٍ منه."]], "tr": [[47.0, "Tevfik Allah'tandır, derim ki: Bu, tevessülün cüz'î meseleleri hakkındaki sözün başında anlaşılması zorunlu bir kaidedir."], [54.0, "İnsanın Allah Azze ve Celle'ye herhangi bir vesileyle tevessül etmesi, ancak o vesileyle tevessülün caiz olduğuna şeriattan bir delil delâlet ederse caizdir."], [62.0, "Çünkü tevessül, Allah Azze ve Celle'nin sevdiği şeyler üzerine kuruludur;"], [67.1, "Allah Azze ve Celle'nin sevdiği şeyler üzerine bina edilen bir babdır."], [71.6, "Allah Azze ve Celle'nin eşyayı sevmesi ise ancak O'ndan gelen bir vahiyle muttali olunabilecek gaybî bir iştir."]]}, {"reader": false, "ar": [[79.0, "فإذا دلّ القرآنُ على جواز التوسُّل لله عز وجل بهذه الوسيلة فإنه يجوز أن يُتوسَّل بها،"], [87.0, "وإذا أشار النبيُّ صلى الله عليه وسلم لنا بجواز التوسُّل بشيءٍ من الوسائل فإننا نتوسّل بها."], [95.0, "وأمّا ما لم يَرِد بجواز التوسُّل به دليلٌ من الشرع،"], [99.0, "ولم يثبت به حديثٌ صحيحٌ صريح،"], [102.0, "فإنّ الواجب علينا أن نكُفَّ عن التوسُّل به."]], "tr": [[79.0, "Kur'an, Allah Azze ve Celle'ye bu vesileyle tevessülün caiz olduğuna delâlet ederse onunla tevessül edilmesi caizdir."], [86.6, "Peygamber sallallâhu aleyhi ve sellem bize vesilelerden bir şeyle tevessülün caiz olduğuna işaret ederse onunla tevessül ederiz."], [95.0, "Onunla tevessülün caiz olduğuna dair şeriattan bir delil gelmeyen ve hakkında sahih ve sarih bir hadis sabit olmayan şeye gelince, onunla tevessülden geri durmamız vâciptir."]]}, {"reader": false, "ar": [[104.0, "وأكثرُ من يخوض في هذا الباب من أهل البدع إنما يخوضون فيه بلا دليل؛"], [112.0, "لأنهم يُثبتون جوازَ التوسُّل بأمورٍ لا يقف وراء جواز التوسُّل بها شيءٌ من الأدلّة أبدًا."], [118.0, "فهذا بابٌ غيبيّ، والمتقرّر في القواعد أنّ ما كان غيبيًّا فإنه يكون توقيفيًّا."], [125.0, "فالقاعدةُ العامّة في باب التوسُّل أنه من الأبواب التوقيفيّة على النصّ."]], "tr": [[104.0, "Bid'at ehlinden bu baba dalanların çoğu, ona delilsiz dalarlar;"], [112.0, "çünkü tevessülün caiz olduğunu, arkasında hiçbir delil bulunmayan şeylerle isbat ederler."], [118.0, "Bu gaybî bir babdır; kaidelerde yerleşik olan da şudur:"], [122.3, "Gaybî olan şey tevkîfî olur."], [125.0, "Dolayısıyla tevessül babındaki genel kaide, onun nassa bağlı (tevkîfî) bablardan olduğudur."]]}, {"reader": false, "ar": [[131.0, "فليس هذا البابُ مَرَدُّه إلى الرُّؤى والأحلام،"], [136.0, "ولا إلى العقول المجرّدة عن نور الدليل،"], [141.0, "ولا إلى الاستحسانات، ولا إلى الأمزجة."], [144.0, "فليس كلُّ شيءٍ استحسنَتْه نفسُك أن تتوسّل به فإنك مباشرةً تتوسّل به،"], [151.0, "بل لا بدّ أن تعرضه على دليل الشرع."], [153.0, "وليس كلُّ رؤيا يراها الإنسان بجواز التوسُّل بشيءٍ معيّنٍ تتوسّل به،"], [161.0, "بل لا بدّ أن يُعرَض ذلك على الكتاب والسنّة."]], "tr": [[131.0, "Bu babın mercii rüyalar ve düşler değildir;"], [136.7, "delilin nurundan soyutlanmış akıllar, istihsanlar (beğeniler) ve mizaçlar da değildir."], [144.0, "Nefsinin onunla tevessül etmeyi güzel bulduğu her şeyle hemen tevessül etmezsin;"], [151.0, "bilakis onu şer'î delile arz etmen gerekir."], [153.0, "İnsanın belirli bir şeyle tevessülün caiz olduğuna dair gördüğü her rüyayla da tevessül etmezsin;"], [161.2, "bilakis bunun Kitap ve Sünnet'e arz edilmesi gerekir."]]}, {"reader": false, "ar": [[163.0, "وما دخل الإحداثُ في هذا الباب إلا بسببيّة محاولة كثيرٍ من أهل البدع ـ أي،"], [174.4, "أي ـ أن يَحُلّوا التوقيفَ عنه،"], [176.9, "ويجعلوه من الأبواب الاجتهاديّة؛"], [180.0, "فكلٌّ يتوسّل بما تُمليه عليه نفسُه،"], [183.7, "وبما يراه استحسانُه، وبما يراه في منامه."], [188.0, "فهذا البابُ بابٌ توقيفيٌّ على صحيح النصّ."], [191.0, "فإذا كنّا نُقِرُّ بهذه الكلّيّة فإنّ ما بعدها وما وراءها ـ إن شاء الله ـ سيكون سهلًا يسيرًا."]], "tr": [[163.0, "Bu baba bid'atlerin girmesi, ancak bid'at ehlinden birçoğunun —yani— ondan tevkîf (bağını) çözüp onu ictihadî bablardan yapma çabası sebebiyle olmuştur."], [176.9, "Böylece herkes nefsinin kendisine dikte ettiği şeyle, istihsanının uygun gördüğü şeyle ve rüyasında gördüğü şeyle tevessül eder."], [188.0, "Bu bab, sahih nassa bağlı tevkîfî bir babdır."], [191.0, "Bu külliyeyi kabul ediyorsak, ondan sonrası ve ötesi inşallah kolay ve rahat olacaktır."]]}]}, {"ts": "03:19", "title": "2. Külliye: Allah'ın sabit olan bütün isimleriyle tevessül caizdir", "paras": [{"reader": false, "ar": [[199.0, "الكلّيّة الثانية: <b>كلُّ ما ثبت لله عز وجل من أسماءٍ فيجوز التوسُّلُ بها.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[199.0, "<b>2. külliye: Allah Azze ve Celle için sabit olan bütün isimlerle tevessül etmek caizdir.<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[213.0, "وهذا من أعظم ما أجاز الشارعُ أن نتوسّل إليه به،"], [222.0, "وهي التوسُّلُ إلى الله عز وجل بأسمائه الحسنى الواردة في الكتاب والسنّة؛"], [228.0, "فإنّ من أعظم ما يحبّه الله عز وجل ويرضاه توسُّلًا أسماؤه،"], [233.0, "كما قال الله عز وجل:"], [235.4, "<span class=\"ayah\">﴿قُلِ ادْعُوا اللَّهَ أَوِ ادْعُوا الرَّحْمَٰنَ ۖ أَيًّا مَّا تَدْعُوا فَلَهُ الْأَسْمَاءُ الْحُسْنَىٰ﴾<\/span> <span class=\"ref\">[الإسراء: ١١٠]<\/span>،"], [240.8, "وقال الله عز وجل:"], [242.7, "<span class=\"ayah\">﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا ۖ وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٠]<\/span>."], [247.6, "فقولُه: «فادعوه بها» أي: توسَّلوا إليه بها."]], "tr": [[213.0, "Bu, Şâri'in kendisiyle O'na tevessül etmemizi caiz kıldığı şeylerin en büyüklerindendir;"], [222.0, "o da Kitap ve Sünnet'te gelen güzel isimleriyle Allah Azze ve Celle'ye tevessüldür."], [228.0, "Zira Allah Azze ve Celle'nin tevessül olarak en çok sevdiği ve razı olduğu şeylerden biri isimleridir."], [233.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [235.4, "<span class=\"ayah\">﴿De ki: İster \"Allah\" diye dua edin, ister \"Rahmân\" diye dua edin; hangisiyle dua ederseniz edin, en güzel isimler O'nundur﴾<\/span> [İsrâ 110]."], [240.8, "Allah Azze ve Celle şöyle de buyurmuştur:"], [242.7, "<span class=\"ayah\">﴿En güzel isimler Allah'ındır; O'na onlarla dua edin. O'nun isimleri hakkında ilhada sapanları bırakın﴾<\/span> [A'râf 180]."], [247.6, "\"O'na onlarla dua edin\" sözü, yani: O'na onlarla tevessül edin."]]}, {"reader": false, "ar": [[251.0, "وفي «الصحيح» من حديث ابن عبّاسٍ رضي الله عنهما قال:"], [254.8, "كان النبيُّ صلى الله عليه وسلم إذا تهجّد من الليل افتتح الصلاة ثم قال:"], [260.0, "«اللهمّ لك الحمد، أنت قيِّمُ السماوات والأرض ومن فيهنّ، ولك الحمد، أنت نورُ السماوات والأرض ومن فيهنّ، ولك الحمد، أنت ـ ربُّ ـ أنت مَلِكُ السماوات والأرض ومن فيهنّ، ولك الحمد، أنت الحقُّ، ووعدُك الحقّ» إلى آخر الحديث."], [277.0, "وكلُّ هذا الحديث مزبورٌ من أوّله إلى آخره بالتوسُّل بأسماء الله عز وجل."]], "tr": [[251.0, "\"Sahîh\"te İbn Abbâs —Allah ikisinden de razı olsun— hadisinde şöyle der:"], [254.8, "Peygamber sallallâhu aleyhi ve sellem geceleyin teheccüde kalktığında namaza başlar, sonra şöyle derdi:"], [260.0, "\"Allah'ım! Hamd sana mahsustur; göklerin, yerin ve onlarda bulunanların kayyimi (ayakta tutanı) sensin."], [266.2, "Hamd sana mahsustur; göklerin, yerin ve onlarda bulunanların nuru sensin."], [270.6, "Hamd sana mahsustur; göklerin, yerin ve onlarda bulunanların meliki (hükümdarı) sensin."], [277.0, "Hamd sana mahsustur; sen haksın, vaadin de haktır.\" Hadisin sonuna kadar."], [280.1, "Bu hadisin tamamı, başından sonuna kadar Allah Azze ve Celle'nin isimleriyle tevessülle yazılmıştır."]]}, {"reader": false, "ar": [[285.0, "ومنها أيضًا حديثُ أنسٍ رضي الله تعالى عنه،"], [288.4, "أنه كان مع النبيّ صلى الله عليه وسلم فسمع رجلًا يقول:"], [293.0, "«اللهمّ إني أسألك بأنك أنت الله، الأحدُ الصمد، الحيُّ الذي لا يموت» إلى آخره،"], [306.0, "ثم قال النبيُّ صلى الله عليه وسلم:"], [308.3, "«لقد سأل اللهَ باسمه الأعظم، الذي إذا دُعي به أجاب، وإذا سُئل به أعطى»."], [314.0, "والحديث أخرجه الإمام أبو داود والنسائيُّ والترمذيُّ وابنُ ماجه،"], [320.0, "وصحّحه الإمام الألبانيُّ رحمه الله تعالى."]], "tr": [[285.0, "Bunlardan biri de Enes —Allah Teâlâ ondan razı olsun— hadisidir:"], [288.4, "Kendisi Peygamber sallallâhu aleyhi ve sellem ile birlikteyken bir adamın şöyle dediğini işitti:"], [293.0, "\"Allah'ım! Senden, sen Allah olduğun için istiyorum;"], [297.0, "Ehad, Samed, ölmeyen Hayy olan…\" sonuna kadar."], [301.7, "Sonra Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [308.3, "\"Andolsun, Allah'tan, kendisiyle dua edildiğinde icabet ettiği, kendisiyle istendiğinde verdiği İsm-i A'zam'ıyla istedi.\" Hadisi İmam Ebû Dâvûd, Nesâî, Tirmizî ve İbn Mâce rivayet etmiş;"], [318.7, "İmam Elbânî —Allah Teâlâ ona rahmet etsin— sahih demiştir."]]}, {"reader": false, "ar": [[323.0, "ومثلُه أيضًا حديثُ بُرَيدة رضي الله تعالى عنه،"], [327.0, "أنّ النبيّ صلى الله عليه وسلم دخل المسجد فسمع رجلًا يقول:"], [331.0, "«اللهمّ إني أسألك بأني أشهد بأنك أنت الله، لا إله إلا أنت، الأحدُ الصمد، الذي لم يلد ولم يولد، ولم يكن له كفوًا أحد، المنّانُ، بديعُ السماوات والأرض، ـ ذا ـ الجلال والإكرام، أسألك…»."], [347.1, "ثم قال عليه الصلاة والسلام أيضًا:"], [349.8, "«لقد سأل اللهَ باسمه الأعظم، الذي إذا دُعي به أجاب، وإذا سُئل به أعطى»."], [357.0, "كلُّ ذلك من باب التوسُّل بأسماء الله عز وجل."]], "tr": [[323.0, "Bunun benzeri de Büreyde —Allah Teâlâ ondan razı olsun— hadisidir:"], [327.0, "Peygamber sallallâhu aleyhi ve sellem mescide girdi ve bir adamın şöyle dediğini işitti:"], [331.0, "\"Allah'ım! Senden, senin, kendisinden başka ilah olmayan Allah olduğuna şahitlik ettiğim için istiyorum;"], [336.4, "Ehad, Samed, doğurmamış ve doğurulmamış olan, hiçbir şey O'na denk olmayan, Mennân (çok ihsan eden), göklerin ve yerin Bedî'i (örneksiz yaratanı), celâl ve ikram sahibi olan;"], [347.1, "senden istiyorum…\" Sonra o —aleyhissalâtü vesselâm— yine şöyle buyurdu:"], [349.8, "\"Andolsun, Allah'tan, kendisiyle dua edildiğinde icabet ettiği, kendisiyle istendiğinde verdiği İsm-i A'zam'ıyla istedi.\" Bütün bunlar Allah Azze ve Celle'nin isimleriyle tevessül kabilindendir."]]}, {"reader": false, "ar": [[362.0, "وكذلك أيضًا ثبت عن النبيّ صلى الله عليه وسلم في تفسير قول الله عز وجل:"], [369.5, "<span class=\"ayah\">﴿هُوَ الْأَوَّلُ وَالْآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ﴾<\/span> <span class=\"ref\">[الحديد: ٣]<\/span> أنّ النبيّ صلى الله عليه وسلم قال:"], [375.2, "«اللهمّ أنت الأوّلُ فليس قبلك شيء، وأنت الآخِرُ فليس بعدك شيء، وأنت الظاهرُ فليس فوقك شيء، وأنت الباطنُ فليس دونك شيء»."], [384.0, "وكلُّ ذلك من باب التوسُّل بأسماء الله عز وجل."]], "tr": [[362.0, "Aynı şekilde Peygamber sallallâhu aleyhi ve sellem'den, Allah Azze ve Celle'nin <span class=\"ayah\">﴿O, Evvel'dir, Âhir'dir, Zâhir'dir, Bâtın'dır﴾<\/span> [Hadîd 3] sözünün tefsirinde şöyle buyurduğu sabit olmuştur:"], [375.2, "\"Allah'ım! Sen Evvel'sin, senden önce hiçbir şey yoktur;"], [378.4, "sen Âhir'sin, senden sonra hiçbir şey yoktur;"], [381.2, "sen Zâhir'sin, senin üstünde hiçbir şey yoktur;"], [384.0, "sen Bâtın'sın, senden öte (gizli) hiçbir şey yoktur.\" Bütün bunlar Allah Azze ve Celle'nin isimleriyle tevessül kabilindendir."]]}, {"reader": false, "ar": [[388.0, "والأدلّةُ على ذلك كثيرة،"], [390.4, "وقد وقع إجماعُ أهل السنّة والجماعة ـ الإجماعُ المعلوم من الدين بالضرورة عند أهل السنّة والجماعة ـ بأنّ من أعظم ما يُتوسَّل إلى الله عز وجل به أسماؤه."], [404.0, "ولكن لا بدّ من أن ننتبه لعدّة أمور:"], [407.0, "الأمرُ الأوّل: أنه لا يجوز لك أن تتوسّل بشيءٍ من الأسماء إلا بعد ثبوته بالدليل الصحيح؛"], [413.0, "لأنّ المتقرّر في القواعد أنّ أسماء الله عز وجل توقيفيّةٌ على النصّ."], [417.9, "فلا بدّ أن تنتبه لهذا الاسم الذي ستتوسّل به:"], [422.8, "هل دلّ على ثبوته دليلٌ أو لا؟"]], "tr": [[388.0, "Buna dair deliller çoktur. Ehl-i Sünnet ve'l-Cemaat'in icmâı —Ehl-i Sünnet ve'l-Cemaat nezdinde dinden zarûrî olarak bilinen icmâ— Allah Azze ve Celle'ye kendisiyle tevessül edilen şeylerin en büyüklerinden birinin O'nun isimleri olduğu üzerine gerçekleşmiştir."], [404.8, "Fakat birkaç hususa dikkat etmemiz gerekir."], [407.0, "Birinci husus: İsimlerden herhangi biriyle, ancak sahih delille sabit olduktan sonra tevessül etmen caizdir;"], [413.0, "çünkü kaidelerde yerleşik olan şudur:"], [414.7, "Allah Azze ve Celle'nin isimleri nassa bağlıdır (tevkîfîdir)."], [417.9, "Dolayısıyla kendisiyle tevessül edeceğin bu isme dikkat etmelisin:"], [422.8, "Sabit olduğuna bir delil delâlet etmiş midir, etmemiş midir?"]]}, {"reader": false, "ar": [[427.0, "الأمرُ الثاني: موافقةُ معنى الاسم للمعنى المتوسَّل به؛"], [433.0, "فيجب على الإنسان أن يختار الاسمَ الذي يناسب سؤاله."], [440.0, "فإذا كان سؤاله يقتضي الرحمةَ فيختار الأسماء التي تدلّ على ذلك،"], [447.0, "وإذا أراد أمرًا يتضمّن قوّةً وانتصارًا وشدّةً فيختار الاسمَ الذي يناسب ذلك."], [455.0, "فليس من احترام أسماء الله عز وجل أن تقول مثلًا:"], [460.0, "«اللهمّ إنك أنت شديدُ العقاب، فاغفر لي»؛"], [463.0, "فذلك يتنافى مع كمال الأدب مع الله عز وجل."]], "tr": [[427.0, "İkinci husus: İsmin anlamının, kendisiyle tevessül edilen anlama uygun olması."], [434.4, "İnsanın, isteğine uygun düşen ismi seçmesi gerekir."], [440.0, "İsteği rahmeti gerektiriyorsa buna delâlet eden isimleri seçer;"], [445.1, "kuvvet, zafer ve şiddet içeren bir şey istiyorsa ona uygun düşen ismi seçer."], [455.0, "Mesela \"Allah'ım! Sen azabı şiddetli olansın, beni bağışla\" demen, Allah Azze ve Celle'nin isimlerine saygıdan değildir;"], [463.0, "bu, Allah Azze ve Celle ile edebin kemaline aykırıdır."]]}, {"reader": false, "ar": [[469.0, "أو أن تقول: «اللهمّ إني أسألك بأنك أنت الله الغفورُ الرحيمُ الودود، انتقِمْ لي من عدوّي»؛"], [477.0, "فإنك توسّلتَ إلى الله عز وجل بأسماءٍ تقتضي ـ تقتضي ـ الرحمةَ،"], [482.0, "وتقتضي المودّة، وتقتضي المغفرة،"], [484.0, "وتقتضي العفو، وتقتضي الصفح."], [486.0, "فإذن لا بدّ أن يختار الإنسانُ الاسمَ الذي يتناسب مع مراده."]], "tr": [[469.0, "Ya da \"Allah'ım! Senden, sen Gafûr, Rahîm ve Vedûd olan Allah olduğun için istiyorum;"], [477.0, "benim için düşmanımdan intikam al\" demen (de böyledir)."], [480.0, "Çünkü Allah Azze ve Celle'ye rahmeti, sevgiyi, mağfireti, affı ve bağışlamayı gerektiren isimlerle tevessül ettin."], [486.0, "O hâlde insanın, muradına uygun düşen ismi seçmesi gerekir."]]}]}, {"ts": "08:11", "title": "3. Külliye: Allah'ın sabit olan bütün sıfatlarıyla —mutlak olarak— tevessül caizdir", "paras": [{"reader": false, "ar": [[491.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما ثبت لله عز وجل من الصفات مطلقًا فيجوز التوسُّلُ به.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[491.0, "Külliyelerden biri de şudur: 3."], [498.0, "külliye: Allah Azze ve Celle için sabit olan bütün sıfatlarla —mutlak olarak— tevessül etmek caizdir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[510.0, "أقول وبالله التوفيق: فإن قلتَ:"], [513.6, "لماذا قلتَ «مطلقًا»؟ فأقول:"], [520.5, "حتى يدخل في ذلك الصفاتُ الذاتيّة فيجوز التوسُّل بها،"], [525.0, "والصفاتُ الفعليّة الاختياريّة فيجوز أن نتوسّل إلى الله عز وجل بها."], [531.0, "وقد دلّت الأدلّة من الكتاب والسنّة على جواز ـ على مشروعيّة ـ التوسُّل بصفات الله عز وجل؛"], [539.0, "فمنها توسُّلُ الملائكة في قولهم:"], [542.4, "<span class=\"ayah\">﴿رَبَّنَا وَسِعْتَ كُلَّ شَيْءٍ رَّحْمَةً وَعِلْمًا فَاغْفِرْ لِلَّذِينَ تَابُوا وَاتَّبَعُوا سَبِيلَكَ وَقِهِمْ عَذَابَ الْجَحِيمِ﴾<\/span> <span class=\"ref\">[غافر: ٧]<\/span>."]], "tr": [[510.0, "Tevfik Allah'tandır, derim ki: \"Neden 'mutlak olarak' dedin?\" dersen, derim ki:"], [520.0, "Zâtî sıfatlar da buna girsin, onlarla tevessül caiz olsun;"], [523.5, "ihtiyârî fiilî sıfatlar da (girsin), onlarla da Allah Azze ve Celle'ye tevessül etmemiz caiz olsun diye."], [531.0, "Kitap ve Sünnet'ten deliller, Allah Azze ve Celle'nin sıfatlarıyla tevessülün caiz —meşru— olduğuna delâlet etmiştir."], [539.0, "Bunlardan biri meleklerin şu sözlerindeki tevessülüdür:"], [542.4, "<span class=\"ayah\">﴿Rabbimiz! Rahmet ve ilim bakımından her şeyi kuşattın; tövbe edip senin yoluna uyanları bağışla ve onları cehennem azabından koru﴾<\/span> [Ğâfir 7]."]]}, {"reader": false, "ar": [[553.0, "ومن الأدلّة أيضًا على هذا التوسُّل قولُ النبيّ صلى الله عليه وسلم:"], [560.0, "«اللهمّ بعلمك الغيبَ، وقدرتِك على الخلق، أحيِني ما علمتَ الحياةَ خيرًا لي، وتوفَّني إذا كانت الوفاةُ خيرًا لي»."], [575.0, "وهذا الحديث أخرجه الإمام النسائيُّ والحاكم،"], [579.0, "وصحّحه ووافقه الذهبيّ، وصحّحه الإمام الألبانيّ،"], [582.3, "رحم الله الجميع رحمةً واسعة."]], "tr": [[553.0, "Bu tevessüle delillerden biri de Peygamber sallallâhu aleyhi ve sellem'in şu sözüdür:"], [560.0, "\"Allah'ım! Gaybı bilmen ve yaratıklara gücünün yetmesi hürmetine, hayatı benim için hayırlı bildiğin sürece beni yaşat;"], [565.5, "ölüm benim için hayırlı olduğunda da beni vefat ettir.\" Bu hadisi İmam Nesâî ve Hâkim rivayet etmiş;"], [575.0, "(Hâkim) sahih demiş, Zehebî ona muvafakat etmiş, İmam Elbânî de sahih demiştir."], [581.7, "Allah hepsine geniş rahmetiyle rahmet etsin."]]}, {"reader": false, "ar": [[585.0, "ومنها ما في «صحيح الإمام البخاريّ» من حديث الاستخارة المعروف،"], [588.8, "حديثِ جابرٍ رضي الله تعالى عنه،"], [591.0, "قال: كان النبيُّ صلى الله عليه وسلم يعلّمنا الاستخارة في الأمور كلّها كما يعلّمنا السورةَ من القرآن،"], [598.0, "فكان يقول: «إذا همّ أحدُكم بالأمر فليركع ركعتين من غير الفريضة، ثم ـ يقُلْ ـ ثم ليقُل: اللهمّ إني أستخيرك بعلمك، وأستقدرك بقدرتك، وأسألك من فضلك العظيم، فإنك تقدِر ولا أقدِر، وتعلم ولا أعلم» الحديثَ بتمامه."], [616.0, "فهذا من باب التوسُّل إلى الله عز وجل بصفاته."]], "tr": [[585.0, "Bunlardan biri de \"Sahîh-i Buhârî\"de bulunan meşhur istihâre hadisi, Câbir —Allah Teâlâ ondan razı olsun— hadisidir."], [591.4, "(Câbir) dedi ki: Peygamber sallallâhu aleyhi ve sellem bize Kur'an'dan bir sûre öğretir gibi bütün işlerde istihâreyi öğretir ve şöyle derdi:"], [598.9, "\"Biriniz bir işe niyetlendiğinde farz dışında iki rekât namaz kılsın, sonra şöyle desin:"], [603.7, "Allah'ım! İlmin hürmetine senden hayır diliyorum, kudretin hürmetine senden güç diliyorum ve büyük lütfundan senden istiyorum."], [612.1, "Zira sen güç yetirirsin, ben güç yetiremem;"], [616.0, "sen bilirsin, ben bilmem.\" Hadisin tamamı."], [617.7, "Bu, sıfatlarıyla Allah Azze ve Celle'ye tevessül kabilindendir."]]}, {"reader": false, "ar": [[621.0, "ومنها أيضًا ما رواه الإمام الترمذيُّ وحسّنه الإمام الألبانيُّ من حديث أنسٍ رضي الله عنه،"], [628.0, "أنّ النبيّ صلى الله عليه وسلم كان إذا حزَبه أمرٌ يقول:"], [633.5, "«يا حيُّ يا قيّوم» ـ وهذا توسُّلٌ بماذا؟"], [637.0, "بالأسماء ـ «برحمتك أستغيث» ـ وهذا توسُّلٌ بصفة الرحمة."]], "tr": [[621.0, "Bunlardan biri de İmam Tirmizî'nin rivayet ettiği ve İmam Elbânî'nin hasen dediği Enes —Allah ondan razı olsun— hadisidir:"], [628.5, "Peygamber sallallâhu aleyhi ve sellem'i bir iş sıkıştırdığında şöyle derdi:"], [633.5, "\"Ey Hayy, ey Kayyûm!\" —Bu neyle tevessüldür?"], [637.0, "İsimlerle— \"Rahmetinle yardım diliyorum.\" —Bu da rahmet sıfatıyla tevessüldür."]]}, {"reader": false, "ar": [[646.0, "وفي حديث أمّ المؤمنين عائشة رضي الله تعالى عنها أنها سألت النبيّ صلى الله عليه وسلم،"], [653.7, "قالت: يا رسول الله،"], [655.7, "أرأيتَ إن علمتُ أيُّ ليلةٍ هي ليلةُ القدر،"], [659.5, "فما أقول فيها؟ فقال:"], [661.6, "«قولي: اللهمّ إنك عفوٌّ تحبّ العفو فاعفُ عنّي»،"], [666.0, "أو كما قال النبيُّ صلى الله عليه وسلم."], [670.5, "وهذا توسُّلٌ إلى الله عز وجل بصفة العفو."]], "tr": [[646.0, "Mü'minlerin annesi Âişe —Allah Teâlâ ondan razı olsun— hadisinde, onun Peygamber sallallâhu aleyhi ve sellem'e şöyle sorduğu geçer:"], [654.2, "\"Ey Allah'ın Resûlü! Hangi gecenin Kadir gecesi olduğunu bilirsem onda ne diyeyim, ne dersin?\" Buyurdu ki:"], [661.0, "\"De ki: Allah'ım! Sen çok affedicisin, affı seversin;"], [664.9, "beni affet.\" Ya da Peygamber sallallâhu aleyhi ve sellem'in buyurduğu gibi."], [670.5, "Bu, af sıfatıyla Allah Azze ve Celle'ye tevessüldür."]]}, {"reader": false, "ar": [[675.0, "وأيضًا ثبت عن النبيّ صلى الله عليه وسلم أنه كان يقول في سجوده:"], [680.0, "«اللهمّ إني أعوذ برضاك من سخطك، وبعفوك من عقوبتك، وبك منك، لا أُحصي ثناءً عليك»."], [688.0, "وكلُّ ذلك توسُّلٌ بصفات الله عز وجل."]], "tr": [[675.0, "Yine Peygamber sallallâhu aleyhi ve sellem'in secdesinde şöyle dediği sabit olmuştur:"], [680.0, "\"Allah'ım! Gazabından rızana, cezandan affına sığınırım;"], [683.2, "senden sana sığınırım. Sana olan senayı sayıp bitiremem.\" Bütün bunlar Allah Azze ve Celle'nin sıfatlarıyla tevessüldür."]]}, {"reader": false, "ar": [[692.0, "بل ومن السنن التي أراها قد فُقِدت عند كثيرٍ ممّن يوتر:"], [697.0, "فإنه يُشرَع أن تختم دعاءَ الوتر بمثل هذا الدعاء؛"], [701.0, "لما أخرجه الإمام أبو داود في «سننه» بإسنادٍ صحيح من حديث عليٍّ رضي الله عنه قال:"], [707.3, "كان النبيُّ صلى الله عليه وسلم يقول في آخر وتره:"], [710.0, "«اللهمّ إني أعوذ برضاك من سخطك، وبمعافاتك من عقوبتك، وبك منك، لا أُحصي ثناءً عليك، أنت كما أثنيتَ على نفسك»."]], "tr": [[692.0, "Hatta vitir kılanların birçoğunda kaybolmuş gördüğüm sünnetlerden biri de şudur:"], [697.0, "Vitir duasını bu duaya benzer bir duayla bitirmek meşrudur."], [701.0, "Çünkü İmam Ebû Dâvûd \"Sünen\"inde sahih bir isnadla Ali —Allah ondan razı olsun— hadisinden şunu rivayet etmiştir:"], [707.3, "Peygamber sallallâhu aleyhi ve sellem vitrinin sonunda şöyle derdi:"], [710.0, "\"Allah'ım! Gazabından rızana, cezandan âfiyetine sığınırım;"], [713.3, "senden sana sığınırım. Sana olan senayı sayıp bitiremem;"], [716.8, "sen kendini nasıl övdüysen öylesin.\""]]}, {"reader": false, "ar": [[719.0, "فهذه الأدلّةُ وغيرُها تدلّ دلالةً واضحةً صريحةً على مشروعيّة هذا التوسُّل وعلى استحبابه."], [726.0, "وقد وقع إجماعُ أهل السنّة والجماعة على مشروعيّة التوسُّل إلى الله عز وجل بصفاته."], [734.0, "وننبّه هنا كما نبّهنا في التوسُّل بالأسماء:"], [737.0, "وهي أنه ينبغي أن تختار الصفةَ التي تناسب مطلوبك وسُؤْلك."], [743.0, "وصفاتُ الله عز وجل تنقسم إلى صفاتٍ ترهيبيّةٍ وإلى صفاتٍ ترغيبيّة؛"], [751.0, "فإذا كنتَ في أمرِ رَغَبٍ فاختر الصفةَ التي تناسب سؤالك،"], [756.0, "وإذا كنتَ في أمرِ رَهَبٍ فاختر الصفةَ التي تناسب حالك."]], "tr": [[719.0, "Bu deliller ve başkaları, bu tevessülün meşru ve müstehap olduğuna açık ve sarih bir şekilde delâlet eder."], [726.0, "Ehl-i Sünnet ve'l-Cemaat'in icmâı, sıfatlarıyla Allah Azze ve Celle'ye tevessülün meşru olduğu üzerine gerçekleşmiştir."], [734.0, "Burada da isimlerle tevessülde dikkat çektiğimiz gibi dikkat çekiyoruz:"], [737.0, "İsteğine ve dileğine uygun düşen sıfatı seçmen gerekir."], [741.2, "Allah Azze ve Celle'nin sıfatları terhîbî (korkutucu) sıfatlar ve terğîbî (umut verici) sıfatlar olarak ikiye ayrılır."], [751.0, "Rağbet (umut) içeren bir işteysen isteğine uygun düşen sıfatı seç;"], [756.0, "korku içeren bir işteysen hâline uygun düşen sıfatı seç."]]}, {"reader": false, "ar": [[762.0, "ومن الكلّيّات أيضًا ـ بل نقول:"], [764.9, "ومن الغريب ـ ومن الغريب ـ يعني ـ أن يُعرِض أهلُ البدع عن التوسُّل بأسماء الله عز وجل وصفاته،"], [772.0, "ثم يخترعون وسائلَ لا تمُتّ إلى الأدلّة بصلة."], [777.0, "ولكنّ هذا من الخِذلان والحِرمان:"], [780.0, "أن يَشغَلهم الله عز وجل بما ليس بمشروعٍ عمّا هو مشروع. فهذا من الخِذلان."]], "tr": [[762.0, "Külliyelerden biri de —bilakis şöyle diyelim:"], [764.9, "Tuhaf olan şudur— tuhaf olan, yani bid'at ehlinin Allah Azze ve Celle'nin isimleri ve sıfatlarıyla tevessülden yüz çevirip sonra delillerle hiçbir ilgisi olmayan vesileler uydurmalarıdır."], [775.1, "Fakat bu bir hizlân (yardımsız bırakılma) ve mahrumiyettir:"], [780.0, "Allah Azze ve Celle'nin onları meşru olandan, meşru olmayanla meşgul etmesi. Bu bir hizlândır."]]}]}, {"ts": "13:06", "title": "4. Külliye: Allah'ın sabit olan bütün fiilleriyle O'na tevessül caizdir", "paras": [{"reader": false, "ar": [[786.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما ثبت لله عز وجل من أفعالٍ فيجوز أن يُتوسَّل إليه بها.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[786.0, "Külliyelerden biri de şudur: 4."], [788.0, "külliye: Allah Azze ve Celle için sabit olan bütün fiillerle O'na tevessül edilmesi caizdir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[802.0, "وذلك لأننا نُضيف إلى الله عز وجل أربعةَ أشياء:"], [807.0, "فنُضيف إليه الذات، ونُضيف إليه الأسماء،"], [811.0, "ونُضيف إليه الصفات، ونُضيف له الأفعال."], [815.0, "فالتوسُّلُ إلى الله عز وجل بأفعاله الثابتة في الكتاب والسنّة توسُّلٌ جائزٌ مشروعٌ لا غبار عليه،"], [825.0, "وقد دلّت عليه الأدلّة الكثيرة."]], "tr": [[802.0, "Bu şundandır: Biz Allah Azze ve Celle'ye dört şey izafe ederiz:"], [807.0, "O'na zâtı izafe ederiz, O'na isimleri izafe ederiz, O'na sıfatları izafe ederiz ve O'na fiilleri izafe ederiz."], [815.0, "Kitap ve Sünnet'te sabit olan fiilleriyle Allah Azze ve Celle'ye tevessül, üzerinde hiçbir toz bulunmayan (şüphesiz), caiz ve meşru bir tevessüldür;"], [825.0, "birçok delil de buna delâlet etmiştir."]]}, {"reader": false, "ar": [[828.0, "فمنها قولُ النبيّ صلى الله عليه وسلم:"], [831.0, "«اللهمّ أنت ربّي، لا إله إلا أنت، خلقتَني» ـ وهذا توسُّلٌ إلى الله بفعلٍ من أفعاله وهي الخلق،"], [840.0, "فهو فعلٌ وصفةٌ في نفس الوقت ـ «خلقتَني وأنا عبدُك، وأنا على عهدك ووعدك ما استطعتُ، أعوذ بك من شرّ ما صنعتُ، أبوءُ لك بنعمتك عليّ، وأبوءُ بذنبي، فاغفر لي، فإنه لا يغفر الذنوبَ إلا أنت»."]], "tr": [[828.0, "Bunlardan biri Peygamber sallallâhu aleyhi ve sellem'in şu sözüdür:"], [831.0, "\"Allah'ım! Sen benim Rabbimsin, senden başka ilah yoktur;"], [834.0, "beni sen yarattın\" —Bu, Allah'a fiillerinden bir fiille, yani yaratmayla tevessüldür;"], [839.4, "o, aynı zamanda hem fiil hem sıfattır— \"beni sen yarattın, ben senin kulunum;"], [843.4, "gücüm yettiğince sana verdiğim söz ve vaat üzereyim."], [845.9, "Yaptıklarımın şerrinden sana sığınırım. Bana olan nimetini ikrar ederim, günahımı da ikrar ederim;"], [849.9, "beni bağışla, çünkü günahları senden başka bağışlayan yoktur.\""]]}, {"reader": false, "ar": [[852.0, "ومنها أيضًا: «اللهمّ ربَّ السماوات وربَّ الأرض، ربَّ العرش العظيم، ربَّنا وربَّ كلِّ شيء» ـ انتبهوا ـ «فالقَ الحبِّ والنوى» ـ وهذا فعلٌ من أفعاله عز وجل ـ «ومُنزِلَ التوراة والإنجيل والفرقان» ـ وهذا فعلٌ من أفعاله أيضًا ـ «أعوذ بك من شرّ كلّ شيءٍ أنت آخذٌ بناصيته، اللهمّ أنت الأوّلُ فليس قبلك شيء» إلى آخر الحديث."], [880.0, "فهذا الحديث ـ تضمّن جواز… ـ يدلّ على جواز التوسُّل بأفعاله تبارك وتعالى."]], "tr": [[852.0, "Bunlardan biri de şudur: \"Allah'ım!"], [854.9, "Göklerin Rabbi, yerin Rabbi, büyük Arş'ın Rabbi, Rabbimiz ve her şeyin Rabbi\" —dikkat edin— \"taneyi ve çekirdeği yaran\" —bu, O'nun fiillerinden bir fiildir— \"Tevrat'ı, İncil'i ve Furkân'ı indiren\" —bu da O'nun fiillerinden bir fiildir— \"perçeminden tuttuğun her şeyin şerrinden sana sığınırım."], [876.6, "Allah'ım! Sen Evvel'sin, senden önce hiçbir şey yoktur…\" hadisin sonuna kadar."], [880.0, "Bu hadis, Tebâreke ve Teâlâ'nın fiilleriyle tevessülün caiz olduğuna delâlet eder."]]}, {"reader": false, "ar": [[889.0, "وفي حديث عبد الله بن أبي أوفى في «الصحيح» في غزوة الخندق،"], [893.0, "قال: سمعتُ النبيَّ صلى الله عليه وسلم يدعو يقول:"], [897.0, "«اللهمّ مُنزِلَ الكتاب، سريعَ الحساب، اهزِمهم وزلزِلهم»."], [908.0, "وقد رُوي هذا الحديث بجُمَلٍ من الألفاظ،"], [911.3, "كلُّها تدلّ على جواز التوسُّل بما ثبت لله عز وجل من أفعال."]], "tr": [[889.0, "\"Sahîh\"te Abdullah b. Ebî Evfâ'nın hadisinde Hendek gazvesi hakkında şöyle der:"], [893.4, "Peygamber sallallâhu aleyhi ve sellem'i dua ederken şöyle derken işittim:"], [897.0, "\"Allah'ım! Ey Kitab'ı indiren, hesabı çabuk gören!"], [908.0, "Onları hezimete uğrat ve onları sars.\" Bu hadis birtakım lafızlarla rivayet edilmiştir;"], [911.8, "hepsi Allah Azze ve Celle için sabit olan fiillerle tevessülün caiz olduğuna delâlet eder."]]}, {"reader": false, "ar": [[917.0, "وفي الحديث عن أنسٍ رضي الله تعالى عنه قال:"], [920.7, "قال رسول الله صلى الله عليه وسلم لمعاذ:"], [924.0, "«يا معاذ، ألا أعلّمك دعاءً تدعو به، لو كان عليك مثلُ أُحُدٍ دَينًا لأدّاه الله عنك؟ قال: قل: اللهمّ مالكَ الملك» ـ انتبهوا ـ «تؤتي الملكَ من تشاء» ـ وهذا فعلٌ من أفعاله ـ «وتنزع الملكَ ممّن تشاء، وتُعِزّ من تشاء، وتُذِلّ من تشاء، بيدك الخير، إنك على كلّ شيءٍ قدير، رحمنَ الدنيا والآخرة ورحيمَهما، تُعطيهما من تشاء، وتمنع منهما من تشاء، ارحمني رحمةً تُغنيني بها عن رحمة من سواك»."], [967.0, "والحديث أخرجه الإمام الطبرانيّ،"], [969.0, "وحسّنه الإمام الألبانيّ، رحم الله الجميع رحمةً واسعة."]], "tr": [[917.0, "Enes —Allah Teâlâ ondan razı olsun— hadisinde şöyle der:"], [918.6, "Resûlullah sallallâhu aleyhi ve sellem Muâz'a şöyle buyurdu:"], [920.7, "\"Ey Muâz! Sana, üzerinde Uhud dağı kadar borç olsa Allah'ın onu senin yerine ödeyeceği, kendisiyle dua edeceğin bir dua öğreteyim mi?"], [923.2, "(Sonra) buyurdu ki: De ki:"], [924.0, "Allah'ım! Ey mülkün sahibi\" —dikkat edin— \"mülkü dilediğine verirsin\" —bu, O'nun fiillerinden bir fiildir— \"mülkü dilediğinden çekip alırsın, dilediğini aziz eder, dilediğini zelil edersin."], [953.5, "Hayır senin elindedir; sen her şeye kadirsin."], [959.5, "Ey dünyanın ve âhiretin Rahmân'ı ve Rahîm'i!"], [967.0, "İkisini dilediğine verir, dilediğinden ikisini de esirgersin."], [968.0, "Bana, senden başkasının rahmetine muhtaç etmeyecek bir rahmetle merhamet et.\" Hadisi İmam Taberânî rivayet etmiş, İmam Elbânî hasen demiştir."], [971.5, "Allah hepsine geniş rahmetiyle rahmet etsin."]]}, {"reader": false, "ar": [[973.0, "وفي حديث أنسٍ عند ابن حبّان أنّ النبيّ صلى الله عليه وسلم كان يقول إذا حزَبه أمر:"], [982.0, "«اللهمّ لا سهلَ إلا ما جعلتَه سهلًا» ـ وجعلُ الله للشيء سهلًا هذا من جملة أفعاله عز وجل ـ «وأنت تجعل الحَزْنَ» ـ أي الصعب ـ «إذا شئتَ سهلًا» الحديثَ بتمامه."], [997.0, "وقد أجمع أهل السنّة والجماعة على جواز التوسُّل إلى الله عز وجل بما ثبت له من أفعال."], [1005.0, "فهذه ثلاثةُ أشياء أجمع أهل السنّة والجماعة على جواز التوسُّل بها،"], [1010.0, "وقد ثبتت بها ـ الأحاديثُ الصحيحة ـ النصوصُ الصحيحة الصريحة من الكتاب وصحيح السنّة."]], "tr": [[973.0, "İbn Hibbân'ın rivayet ettiği Enes hadisinde, Peygamber sallallâhu aleyhi ve sellem'in bir iş kendisini sıkıştırdığında şöyle dediği geçer:"], [982.0, "\"Allah'ım! Senin kolay kıldığından başka kolay yoktur\" —Allah'ın bir şeyi kolay kılması O'nun fiillerindendir— \"sen dilediğinde zor olanı\" —yani güç olanı— \"kolay kılarsın.\" Hadisin tamamı."], [997.0, "Ehl-i Sünnet ve'l-Cemaat, sabit olan fiilleriyle Allah Azze ve Celle'ye tevessülün caiz olduğu üzerinde icmâ etmiştir."], [1005.0, "İşte bunlar, Ehl-i Sünnet ve'l-Cemaat'in kendileriyle tevessülün caiz olduğu üzerinde icmâ ettiği üç şeydir;"], [1010.0, "Kitap'tan ve sahih Sünnet'ten sahih ve sarih nasslar da bunlar hakkında sabit olmuştur."]]}]}, {"ts": "16:59", "title": "5. Külliye: Kulun yaptığı her sâlih amelle tevessül caizdir", "paras": [{"reader": false, "ar": [[1019.0, "ومن الكلّيّات أيضًا: <b>كلُّ عملٍ صالحٍ فعله العبدُ فيجوز التوسُّلُ به.<\/b> <span class=\"note\">(يكررها)<\/span> وهذا واضحٌ لديكم ولله الحمد."]], "tr": [[1019.0, "Külliyelerden biri de şudur: 5."], [1022.3, "külliye: Kulun yaptığı her sâlih amelle tevessül etmek caizdir. (Tekrar ediyor.) Hamd Allah'a, bu sizce açıktır."]]}, {"reader": false, "ar": [[1042.0, "قال أبو العبّاس ابنُ تيميّة رحمه الله تعالى:"], [1046.0, "«أمّا التوسُّل والتوجُّه إلى الله عز وجل وسؤالُه بالأعمال الصالحة التي أمر بها ـ كدعاء الثلاثة الذين أوَوا إلى الغار بأعمالهم الصالحة ـ وبدعاء الأنبياء والصالحين وشفاعتهم، فهذا ممّا لا نزاعَ فيه»."], [1064.0, "فابن تيميّة رحمه الله في هذا النقل يحكي إجماعَ أهل السنّة والجماعة على جواز التوسُّل إلى الله عز وجل بما فعله من الأعمال الصالحة الموافقة للكتاب والسنّة."]], "tr": [[1042.0, "Ebü'l-Abbâs İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1046.0, "\"Allah Azze ve Celle'nin emrettiği sâlih amellerle O'na tevessül etmek, yönelmek ve O'ndan istemek —mağaraya sığınan üç kişinin sâlih amelleriyle dua etmesi gibi— ve nebîlerin ve sâlihlerin duası ve şefaatiyle (tevessül etmek), işte bunda bir ihtilaf yoktur.\" İbn Teymiyye —Allah ona rahmet etsin— bu nakilde, (kulun) yaptığı, Kitap ve Sünnet'e uygun sâlih amellerle Allah Azze ve Celle'ye tevessülün caiz olduğu üzerinde Ehl-i Sünnet ve'l-Cemaat'in icmâını nakletmektedir."]]}, {"reader": false, "ar": [[1079.0, "وقد دلّ على جواز التوسُّل به ـ غيرَ الإجماع ـ الكتابُ والسنّة."], [1083.0, "فمن القرآن قولُ الله عز وجل:"], [1085.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَابْتَغُوا إِلَيْهِ الْوَسِيلَةَ﴾<\/span> <span class=\"ref\">[المائدة: ٣٥]<\/span>."], [1090.0, "وسيأتينا قاعدةٌ بأنّ الوسيلة إذا وردت في كتاب الله عز وجل فيُراد بها متابعةُ الشرع بفعل المأمورات وترك المنهيّات،"], [1100.0, "كأنه قال: تقرّبوا إلى الله عز وجل بمتابعة الشرع،"], [1108.0, "بفعل ما أمركم به وبترك ما نهاكم عنه."], [1111.0, "وهذا توسُّلٌ إلى الله عز وجل بالأعمال الصالحة؛"], [1115.0, "فالوسيلة في القرآن إنما يُراد بها الأعمالُ الصالحة،"], [1118.0, "من فعل المأمورات ومن ترك المحظورات."]], "tr": [[1079.0, "İcmâ dışında Kitap ve Sünnet de onunla tevessülün caiz olduğuna delâlet etmiştir."], [1083.0, "Kur'an'dan (delil) Allah Azze ve Celle'nin şu sözüdür:"], [1085.0, "<span class=\"ayah\">﴿Ey iman edenler! Allah'tan sakının ve O'na yaklaşmaya vesile arayın﴾<\/span> [Mâide 35]."], [1090.0, "İleride bize bir kaide gelecek:"], [1092.1, "Vesîle (lafzı) Allah Azze ve Celle'nin Kitabı'nda geçtiğinde, onunla emredilenleri yapıp yasaklananları terk ederek şeriata uymak kastedilir."], [1101.4, "Sanki şöyle buyurmuştur: Şeriata uyarak, size emrettiğini yaparak ve sizi nehyettiğini terk ederek Allah Azze ve Celle'ye yaklaşın."], [1111.0, "Bu, sâlih amellerle Allah Azze ve Celle'ye tevessüldür."], [1115.0, "Kur'an'da vesîle ile ancak sâlih ameller, yani emredilenleri yapmak ve yasaklananları terk etmek kastedilir."]]}, {"reader": false, "ar": [[1121.0, "ويؤكّد ذلك قولُ الله عز وجل أيضًا:"], [1124.9, "<span class=\"ayah\">﴿رَّبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ﴾<\/span> فإيش؟"], [1130.5, "<span class=\"ayah\">﴿فَآمَنَّا﴾<\/span>، والإيمان بالله وبالرسول عملٌ صالح،"], [1133.9, "ثم بنَوا على هذا العمل الصالح قولَهم:"], [1137.8, "<span class=\"ayah\">﴿رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا﴾<\/span> <span class=\"ref\">[آل عمران: ١٩٣]<\/span>."], [1139.9, "فإذن دعَوا بعد أن توسّلوا إلى الله عز وجل بالإيمان به والإيمان بنبيّه صلى الله عليه وسلم."]], "tr": [[1121.0, "Allah Azze ve Celle'nin şu sözü de bunu pekiştirir:"], [1124.9, "<span class=\"ayah\">﴿Rabbimiz! Biz, \"Rabbinize iman edin\" diye imana çağıran bir davetçiyi işittik﴾<\/span> ne oldu?"], [1130.5, "<span class=\"ayah\">﴿Hemen iman ettik﴾<\/span>. Allah'a ve Resûl'e iman sâlih bir ameldir."], [1133.9, "Sonra bu sâlih amelin üzerine şu sözlerini bina ettiler:"], [1137.8, "<span class=\"ayah\">﴿Rabbimiz! Günahlarımızı bağışla﴾<\/span> [Âl-i İmrân 193]."], [1139.9, "Demek ki Allah Azze ve Celle'ye, O'na iman ve Peygamberi sallallâhu aleyhi ve sellem'e iman ile tevessül ettikten sonra dua ettiler."]]}, {"reader": false, "ar": [[1146.0, "وقد توسّل الحواريّون إلى الله عز وجل باتّباعهم لرسوله،"], [1151.1, "كما قال الله عز وجل:"], [1154.0, "<span class=\"ayah\">﴿رَبَّنَا آمَنَّا بِمَا أَنزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ٥٣]<\/span>."], [1161.0, "فدعَوا الله عز وجل وتوسّلوا إليه بالعمل الصالح،"], [1166.5, "وهو الإيمانُ به وبنبيّه،"], [1170.0, "أي عيسى عليه الصلاة والسلام."]], "tr": [[1146.0, "Havâriler de Allah Azze ve Celle'ye O'nun Resûlü'ne uymalarıyla tevessül etmişlerdir;"], [1150.6, "nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1154.0, "<span class=\"ayah\">﴿Rabbimiz! İndirdiğine iman ettik ve Resûl'e uyduk; bizi şahitlerle birlikte yaz﴾<\/span> [Âl-i İmrân 53]."], [1161.0, "Allah Azze ve Celle'ye dua ettiler ve O'na sâlih amelle, yani O'na ve O'nun peygamberine —yani Îsâ aleyhissalâtü vesselâma— imanla tevessül ettiler."]]}, {"reader": false, "ar": [[1172.0, "ويؤكّده أيضًا قولُ الله عز وجل:"], [1174.0, "<span class=\"ayah\">﴿إِنَّهُ كَانَ فَرِيقٌ مِّنْ عِبَادِي يَقُولُونَ رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنتَ خَيْرُ الرَّاحِمِينَ﴾<\/span> <span class=\"ref\">[المؤمنون: ١٠٩]<\/span>."], [1183.0, "فتوسّلوا إلى الله عز وجل أن يغفر لهم بالإيمان به وبنبيّه صلى الله عليه وسلم."], [1190.0, "وكلُّ ذلك ممّا أجمعت الأمّةُ عليه."]], "tr": [[1172.0, "Allah Azze ve Celle'nin şu sözü de bunu pekiştirir:"], [1174.0, "<span class=\"ayah\">﴿Kullarımdan bir grup, \"Rabbimiz! İman ettik; bizi bağışla, bize merhamet et; sen merhamet edenlerin en hayırlısısın\" derlerdi﴾<\/span> [Mü'minûn 109]."], [1183.5, "Kendilerini bağışlaması için Allah Azze ve Celle'ye, O'na ve Peygamberi sallallâhu aleyhi ve sellem'e imanla tevessül ettiler."], [1190.0, "Bütün bunlar, ümmetin üzerinde icmâ ettiği şeylerdendir."]]}, {"reader": false, "ar": [[1199.0, "ويدلّ عليه أيضًا ما في «الصحيحين» من حديث ابن عمر في قصّة الثلاثة الذين أوَوا إلى الغار،"], [1207.2, "وهو حديثٌ طويل، وأنّ كلَّ واحدٍ منهم إنما توسّل بشيءٍ من الأعمال الصالحة:"], [1214.0, "فالأوّل توسّل إلى الله عز وجل بعظيم برّه بوالديه،"], [1217.0, "والثاني توسّل إلى الله عز وجل بخوفه وعفّته عن الزنا ومواقعة الفواحش،"], [1226.0, "والثالث توسّل إلى الله عز وجل بعظيم أمانته ورعايته لحقّ المسكين والأجير."], [1232.0, "فأنقذهم الله عز وجل ممّا هم فيه."]], "tr": [[1199.0, "\"Sahîhayn\"da İbn Ömer'in hadisinde geçen, mağaraya sığınan üç kişinin kıssası da buna delâlet eder."], [1203.6, "Uzun bir hadistir; onlardan her biri sâlih amellerden bir şeyle tevessül etmiştir:"], [1209.5, "Birincisi Allah Azze ve Celle'ye anne-babasına olan büyük iyiliğiyle tevessül etti;"], [1214.0, "ikincisi Allah Azze ve Celle'ye (Allah) korkusuyla ve zinadan ve hayâsızlıklara düşmekten iffetiyle tevessül etti;"], [1221.1, "üçüncüsü Allah Azze ve Celle'ye büyük emanet duygusuyla ve yoksulun ve işçinin hakkını gözetmesiyle tevessül etti."], [1232.0, "Allah Azze ve Celle de onları içinde bulundukları durumdan kurtardı."]]}, {"reader": false, "ar": [[1237.0, "ولذلك قال: «إنه لن يُنجيَكم من أمر هذه الصخرة إلا أن تسألوا…» ـ وفي روايةٍ:"], [1243.0, "«إلا أن تدعوا اللهَ بصالح أعمالكم»."], [1250.0, "والنبيُّ صلى الله عليه وسلم حكاها حكايةَ إقرارٍ وتشريع،"], [1255.0, "ممّا يدلّ على جواز التوسُّل إلى الله عز وجل بالأعمال الصالحة."]], "tr": [[1237.0, "Bu yüzden (biri) dedi ki:"], [1239.7, "\"Sizi bu kayanın durumundan ancak (Allah'tan) istemeniz kurtarır…\" —bir rivayette:"], [1243.0, "\"Ancak sâlih amellerinizle Allah'a dua etmeniz (kurtarır).\" Peygamber sallallâhu aleyhi ve sellem bunu onaylama ve teşrî (hüküm koyma) kabilinden anlatmıştır;"], [1255.6, "bu da sâlih amellerle Allah Azze ve Celle'ye tevessülün caiz olduğunu gösterir."]]}, {"reader": false, "ar": [[1262.0, "فإن قلتَ: وما مثالُه؟"], [1263.8, "أقول: مثالُه أن يقول القائل:"], [1266.0, "«اللهمّ بإيماني بك، وبمحبّتي لنبيّك، وتعظيمي لكتابك، واتّباعي لرسولك صلى الله عليه وسلم، اغفر لي ـ أو: ارحمني»،"], [1277.0, "وكقول: «اللهمّ إني أسألك بحبّي لصحابة نبيّك صلى الله عليه وسلم، وبحبّي للأولياء والصالحين، أن تُفرِّج عنّي»،"], [1289.6, "ونحو ذلك. كلُّ ذلك جائزٌ لا بأس به إن شاء الله."]], "tr": [[1262.0, "\"Bunun örneği nedir?\" dersen, derim ki:"], [1263.8, "Örneği, kişinin şöyle demesidir: \"Allah'ım!"], [1266.0, "Sana imanım, peygamberine sevgim, kitabına tazimim ve resulüne —sallallâhu aleyhi ve sellem— uymam hürmetine beni bağışla\" —ya da:"], [1275.0, "\"bana merhamet et\"—. Ya da \"Allah'ım!"], [1277.6, "Peygamberinin —sallallâhu aleyhi ve sellem— ashâbına olan sevgim ve velilere ve sâlihlere olan sevgim hürmetine sıkıntımı gidermeni senden istiyorum\" demesi ve benzerleri."], [1291.7, "Bunların hepsi caizdir; inşallah bir sakıncası yoktur."]]}]}, {"ts": "21:35", "title": "5. Külliye (devam): Birinci şüphe — Sâlih amelle tevessül Allah'a minnet etmek midir?", "paras": [{"reader": false, "ar": [[1295.0, "وهنا شُبهةٌ لا بدّ من بيانها."], [1299.0, "الشُّبهةُ تقول: أوَليس التوسُّلُ إلى الله عز وجل بالأعمال الصالحة يدخل في المنّة على الله بهذا ـ أوَليس التوسُّل إلى الله عز وجل بهذا العمل الصالح ممّا يدخل في باب المنّة على الله بهذا العمل؟"], [1321.0, "والله عز وجل حرّم المنّة عليه في قوله:"], [1328.0, "<span class=\"ayah\">﴿وَلَا تَمْنُن تَسْتَكْثِرُ﴾<\/span> <span class=\"ref\">[المدثر: ٦]<\/span>، أي:"], [1331.2, "كلّما استكثرتَ من الطاعات فإيّاك أن ينقدح في قلبك استشعارُ المنّة."]], "tr": [[1295.0, "Burada açıklanması gereken bir şüphe var."], [1299.0, "Şüphe şöyle der: Sâlih amellerle Allah Azze ve Celle'ye tevessül etmek —bu sâlih amelle Allah Azze ve Celle'ye tevessül etmek— bu amelle Allah'a minnet etme (başa kakma) babına girmez mi?"], [1319.7, "Allah Azze ve Celle ise kendisine minnet etmeyi şu sözüyle haram kılmıştır:"], [1328.0, "<span class=\"ayah\">﴿Çok görerek minnet etme﴾<\/span> [Müddessir 6]."], [1331.6, "Yani: Taatleri her çoğalttığında, sakın kalbinde minnet duygusu kıvılcımlanmasın."]]}, {"reader": false, "ar": [[1336.0, "فالمنّة في مثل هذه الأعمال الصالحة إنما هي لله تبارك وتعالى؛"], [1342.0, "فالله هو الذي وفّقك لهذا العمل الصالح،"], [1345.0, "فكيف تجعل توفيقَ الله لك سببًا لذكره والسؤال به؟"], [1351.0, "فأقول: هذا إشكالٌ أورده بعضُ الناس،"], [1359.0, "ولكن في الحقيقة أنه إشكالٌ باطل،"], [1361.0, "وليس هذا يدخل في باب المنّة على الله عز وجل بشيءٍ من الأعمال الصالحة أبدًا."]], "tr": [[1336.0, "(Derler ki:) Bu tür sâlih amellerde minnet ancak Allah Tebâreke ve Teâlâ'nındır;"], [1342.0, "seni bu sâlih amele muvaffak kılan Allah'tır."], [1344.1, "O hâlde Allah'ın seni muvaffak kılmasını, onu anmaya ve onunla istemeye nasıl sebep yaparsın?"], [1351.0, "Derim ki: Bu, bazı insanların ileri sürdüğü bir müşküldür;"], [1359.7, "fakat gerçekte bâtıl bir müşküldür."], [1361.4, "Bu, sâlih amellerden herhangi bir şeyle Allah Azze ve Celle'ye minnet etme babına asla girmez."]]}, {"reader": false, "ar": [[1367.0, "بل إنه يدخل في عظيم تصديق الله عز وجل ورسولِه بهذا العمل الصالح؛"], [1374.0, "فإنه لو لم يؤمن بهذا العمل الصالح،"], [1378.0, "ولم يصدّق الشارعَ في أنه عملٌ صالح وأنّ الشارع أمر به،"], [1384.0, "لَما جعله سبيلًا للدعاء به."], [1386.0, "فالتوسُّل إلى الله عز وجل بالأعمال الصالحة هذا دليلٌ على كمال تصديق الله عز وجل،"], [1393.0, "ودليلٌ على كمال تصديق النبيّ صلى الله عليه وسلم بهذا العمل الصالح."], [1398.0, "فلو كان في قلبه شيءٌ من الرَّيب في كونه عملًا صالحًا لَما جعله طريقًا للتوسُّل،"], [1405.0, "لَما جعله طريقًا للتوسُّل."]], "tr": [[1367.0, "Bilakis bu, bu sâlih amel hususunda Allah Azze ve Celle'yi ve Resûlü'nü büyük bir tasdik içine girer."], [1374.0, "Çünkü kişi bu sâlih amele iman etmeseydi, Şâri'i onun sâlih bir amel olduğu ve Şâri'in onu emrettiği hususunda tasdik etmeseydi, onu kendisiyle dua edilecek bir yol yapmazdı."], [1386.0, "Sâlih amellerle Allah Azze ve Celle'ye tevessül etmek, bu sâlih amel hususunda Allah Azze ve Celle'yi tasdikin kemaline delildir ve Peygamber sallallâhu aleyhi ve sellem'i tasdikin kemaline delildir."], [1398.0, "Kalbinde onun sâlih bir amel olduğuna dair bir şüphe bulunsaydı onu tevessül için bir yol yapmazdı, onu tevessül için bir yol yapmazdı."]]}, {"reader": false, "ar": [[1407.0, "ولأنّ الشارع أجازه في حقّ الله عز وجل،"], [1414.0, "ولا يمكن أبدًا أن يُجيز اللهُ عز وجل في شريعته ما يُفضي إلى أمرٍ حرام."], [1421.0, "ولأنّ المنّة قد تكون في بعض الألفاظ؛"], [1426.0, "فإنّ الإنسان إذا أراد أن يتوسّل بالعمل الصالح فلا بدّ أن يُخرجه بصيغةٍ تناسب ذلك،"], [1435.8, "وبعيدةٍ عن المنّة. لا يجوز له أن يقول:"], [1441.1, "«اللهمّ كما عبدتُك بهذه العبادة فأعطِني ما أريد»؛"], [1446.0, "فهذا حقيقةُ المنّ، وليس توسُّلًا."], [1449.0, "ولكن: «يا ربّي، بعظيم توفيقك لي بالقيام بهذا العمل الصالح فاجعله سببًا ـ إيش؟ ـ لتفريج كربتي»، ونحو ذلك."]], "tr": [[1407.0, "Ayrıca Şâri' bunu Allah Azze ve Celle hakkında caiz kılmıştır;"], [1414.5, "Allah Azze ve Celle'nin şeriatinde harama götüren bir şeyi caiz kılması asla mümkün değildir."], [1421.0, "Ayrıca minnet bazı lafızlarda olabilir."], [1426.0, "İnsan sâlih amelle tevessül etmek istediğinde, onu buna uygun ve minnetten uzak bir ifadeyle ortaya koyması gerekir."], [1433.3, "\"Allah'ım! Sana bu ibadetle ibadet ettiğim gibi, sen de bana istediğimi ver\" demesi caiz değildir;"], [1441.1, "bu, minnetin (başa kakmanın) ta kendisidir, tevessül değildir."], [1446.0, "Fakat (şöyle der): \"Ya Rabbi!"], [1449.0, "Bu sâlih ameli yapmaya beni muvaffak kılmandaki büyük lütfun hürmetine, onu —ne için?— sıkıntımın giderilmesine sebep kıl\" ve benzeri."]]}, {"reader": false, "ar": [[1461.0, "ولذلك قال هؤلاء الثلاثة:"], [1463.2, "«إنه لن يُنجيَكم من أمر هذه الصخرة إلا أن تدعوا اللهَ عز وجل بصالح أعمالكم»."], [1471.0, "ولذلك كلُّ واحدٍ منهم إذا ذكر عملَه قال بعده:"], [1475.0, "«اللهمّ إن كنتَ تعلم أني فعلتُ ذلك ابتغاءَ وجهك ففرِّج عنّا ما نحن فيه»."], [1481.0, "فهل هذا من المنّة؟ الجواب: لا."]], "tr": [[1461.0, "Bu yüzden bu üç kişi şöyle dediler:"], [1463.2, "\"Sizi bu kayanın durumundan ancak sâlih amellerinizle Allah Azze ve Celle'ye dua etmeniz kurtarır.\" Bu yüzden onlardan her biri amelini andığında ardından şöyle derdi:"], [1475.0, "\"Allah'ım! Eğer bunu senin rızanı arayarak yaptığımı biliyorsan, içinde bulunduğumuz durumu bizden gider.\" Bu minnet midir? Cevap: Hayır."]]}, {"reader": false, "ar": [[1483.0, "فقد يكون التوسُّل إلى الله من المنّة إذا أخطأ الإنسانُ في الألفاظ،"], [1490.0, "لكن عليه أن يتخيّر الألفاظَ التي تُشعِر بأنّ الله هو الذي امتنّ عليه بهذا العمل الصالح،"], [1499.6, "وأنه يتوسّل إلى الله ـ إن كان قبِله منه ـ أن يجعله سببًا للفرج والمخرج."], [1507.0, "فشيءٌ أجازته الشريعة لا يمكن أبدًا أن يترتّب على فعله شيءٌ من المفاسد."]], "tr": [[1483.0, "İnsan lafızlarda hata ederse Allah'a tevessül minnetten olabilir."], [1487.7, "Fakat (kişi), bu sâlih amelle kendisine lütufta bulunanın (minnet edenin) Allah olduğunu ve —eğer onu kendisinden kabul ettiyse— onu ferahlığa ve çıkış yoluna sebep kılması için Allah'a tevessül ettiğini hissettiren lafızları seçmelidir."], [1507.0, "Şeriatın caiz kıldığı bir şeyi yapmanın üzerine herhangi bir mefsedetin terettüp etmesi asla mümkün değildir."]]}]}, {"ts": "25:15", "title": "5. Külliye (devam): İkinci ve üçüncü şüphe — Ecir eksilir mi? Dünyevî istekler için tevessül", "paras": [{"reader": false, "ar": [[1515.0, "وهناك شُبهةٌ ثانية، وهي سؤالُ بعضهم:"], [1520.0, "هل إذا توسّلتُ إلى الله عز وجل بشيءٍ من الأعمال الصالحة يتضمّن ذلك نقصانَ أجري في هذا العمل؟"], [1528.0, "أم أنّ أجري فيه يبقى على ما هو عليه وإن توسّلتُ إلى الله به؟"], [1534.1, "الجواب: المتقرّر في القواعد أنّ الجواز ينافي الضمان."], [1540.0, "فلمّا أجاز الشارعُ لك بعد هذا العمل الصالح أن تجعله وسيلةً إلى الله في تحقيق بعض مطالبك،"], [1548.0, "فلا يمكن أبدًا أن يُجيز لك الشيء ثم يُنقِص أجرَه."]], "tr": [[1515.0, "İkinci bir şüphe daha var;"], [1520.0, "o da bazılarının şu sorusudur:"], [1521.5, "Sâlih amellerden bir şeyle Allah Azze ve Celle'ye tevessül edersem, bu, o ameldeki ecrimin eksilmesini gerektirir mi?"], [1528.0, "Yoksa onunla Allah'a tevessül etsem de ecrim olduğu gibi kalır mı?"], [1531.9, "Cevap: Kaidelerde yerleşik olan şudur:"], [1534.1, "Cevaz (şer'î izin), tazmine aykırıdır."], [1540.0, "Şâri' bu sâlih amelden sonra onu bazı isteklerinin gerçekleşmesinde Allah'a vesile yapmanı sana caiz kıldığına göre, bir şeyi sana caiz kılıp sonra onun ecrini eksiltmesi asla mümkün değildir."]]}, {"reader": false, "ar": [[1552.0, "فإنك تتعامل مع الربّ الكريم عز وجل،"], [1557.0, "الذي لا يُخيِّب من طرق بابَه أو تعامل معه بصدقٍ وإخلاص."], [1561.0, "فلا يتضمّن التوسُّلُ إلى الله عز وجل بشيءٍ من الأعمال الصالحة أن ينقُص شيءٌ ـ ولا مطلقُ ـ الأجرِ والثواب من هذا العمل."], [1576.0, "فيجوز لك أن تتوسّل إلى الله عز وجل بقلبٍ واثقٍ متوكّلٍ على الله،"], [1582.0, "وعملُك على ما هو عليه من الأجر والثواب يوم القيامة."]], "tr": [[1552.0, "Çünkü sen, kapısını çalanı veya kendisiyle sıdk ve ihlasla muamele edeni eli boş çevirmeyen Kerîm Rab ile muamele ediyorsun."], [1561.0, "Sâlih amellerden bir şeyle Allah Azze ve Celle'ye tevessül etmek, o amelin ecir ve sevabından hiçbir şeyin —en küçük bir miktarının bile— eksilmesini gerektirmez."], [1576.0, "Allah'a güvenen ve tevekkül eden bir kalple Allah Azze ve Celle'ye tevessül etmen caizdir;"], [1581.5, "amelin de kıyamet gününde ecir ve sevap bakımından olduğu gibi durur."]]}, {"reader": false, "ar": [[1589.0, "وهنا شُبهةٌ أخرى أيضًا،"], [1591.0, "وهي أنه: هل يجوز أن يُتوسَّل بالعمل الصالح في شيءٍ من مطالب الدنيا،"], [1597.0, "فيُسخِّر مالَ الآخرة لتحصيل شيءٍ من مال الدنيا؟"], [1601.0, "فهمتم السؤال؟ الجواب: المتقرّر في القواعد أنّ ما ورد من الأدلّة مطلقًا فالواجب بقاؤه على إطلاقه،"], [1613.8, "ولا يجوز تقييده إلا بدليل."], [1616.0, "والأدلّة التي دلّت على جواز التوسُّل إلى الله عز وجل بالأعمال الصالحة وردت مطلقةً،"], [1623.4, "غيرَ مقيّدةٍ بمصالح الدين ولا بمصالح الدنيا."]], "tr": [[1589.0, "Burada başka bir şüphe daha var:"], [1591.9, "Dünya isteklerinden bir şey için sâlih amelle tevessül edilmesi caiz midir?"], [1596.5, "Böylece kişi âhiret malını dünya malından bir şeyi elde etmeye mi koşmuş olur?"], [1604.7, "Soruyu anladınız mı? Cevap: Kaidelerde yerleşik olan şudur:"], [1608.9, "Delillerden mutlak olarak gelen, mutlaklığı üzere bırakılmalıdır;"], [1613.3, "onu ancak bir delille kayıtlamak caizdir."], [1616.0, "Sâlih amellerle Allah Azze ve Celle'ye tevessülün caiz olduğuna delâlet eden deliller ise ne dinî maslahatlarla ne de dünyevî maslahatlarla kayıtlı olmaksızın mutlak olarak gelmiştir."]]}, {"reader": false, "ar": [[1629.0, "فيجوز للإنسان أن يتوسّل إلى الله عز وجل بالعمل الصالح حتى وإن كان يطلب به شيئًا من الدنيا،"], [1638.0, "فذلك لا ينقص أجرَه أبدًا. والله أعلم."]], "tr": [[1629.0, "Dolayısıyla insanın, onunla dünyadan bir şey istese bile, sâlih amelle Allah Azze ve Celle'ye tevessül etmesi caizdir;"], [1637.0, "bu onun ecrini asla eksiltmez. Allah en iyisini bilir."]]}]}, {"ts": "27:21", "title": "6. Külliye: Kulun bütün acı veren hâlleriyle tevessül caizdir", "paras": [{"reader": false, "ar": [[1642.6, "ومن الكلّيّات أيضًا: <b>كلُّ أحوال العبد المؤلمة فيجوز التوسُّلُ بها.<\/b> سبحان الله!"], [1655.0, "كلُّ أحوال العبد المؤلمة فيجوز التوسُّل بها."], [1663.8, "<span class=\"note\">(يكررها)<\/span> يعني: يجوز التوسُّلُ إلى الله عز وجل بذكر الحال."]], "tr": [[1642.6, "Külliyelerden biri de şudur: 6."], [1646.0, "külliye: Kulun bütün acı veren hâlleriyle tevessül etmek caizdir. Sübhânallah!"], [1655.0, "(Tekrar ediyor.) Yani: (Kişinin) hâlini arz ederek Allah Azze ve Celle'ye tevessül etmesi caizdir."]]}, {"reader": false, "ar": [[1670.8, "وقد أجمع علماءُ أهل السنّة والجماعة على جواز التوسُّل إلى الله عز وجل بهذا ـ بهذا ـ النوع من التوسُّلات،"], [1678.5, "بل إنه من أعظم ما يُتوسَّل إلى الله عز وجل به بعد التوسُّل إلى الله بأسمائه وصفاته وأفعاله."], [1687.0, "وذلك لأنه يتضمّن عظيمَ الافتقار إلى الله عز وجل بذكر حالك،"], [1693.0, "وبيانِ ضعفك، وأن تذكر لله عز وجل ما يمرّ بك من المضائق والآلام والأوجاع."]], "tr": [[1670.8, "Ehl-i Sünnet ve'l-Cemaat âlimleri, bu tür tevessüllerle Allah Azze ve Celle'ye tevessülün caiz olduğu üzerinde icmâ etmişlerdir."], [1678.0, "Hatta bu, Allah'a isimleri, sıfatları ve fiilleriyle tevessülden sonra Allah Azze ve Celle'ye kendisiyle tevessül edilen şeylerin en büyüklerindendir."], [1687.0, "Bu şundandır: Hâlini arz etmen, zayıflığını açıklaman ve başından geçen sıkıntıları, acıları ve ağrıları Allah Azze ve Celle'ye anlatmanla, Allah Azze ve Celle'ye büyük bir muhtaçlık (iftikar) içerir."]]}, {"reader": false, "ar": [[1702.0, "فلأنها حالةٌ تتضمّن عظيمَ الافتقار والاستكانة واللَّجَأ والتضرّع لله عز وجل،"], [1711.3, "فهي أكثرُ توسُّلات الأنبياء في القرآن؛"], [1714.0, "كما توسّل آدمُ وحوّاءُ عليهما السلام إلى الله عز وجل لمّا أكلا من الشجرة:"], [1725.0, "<span class=\"ayah\">﴿قَالَا رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٣]<\/span>."]], "tr": [[1702.0, "Allah Azze ve Celle'ye büyük bir iftikar, boyun eğiş, sığınma ve yalvarış içeren bir hâl olduğu için, Kur'an'da nebîlerin tevessüllerinin çoğu budur."], [1714.0, "Nitekim Âdem ile Havvâ —ikisine de selâm olsun— ağaçtan yediklerinde Allah Azze ve Celle'ye şöyle tevessül ettiler:"], [1723.5, "<span class=\"ayah\">﴿İkisi dediler ki: Rabbimiz! Biz kendimize zulmettik; eğer bizi bağışlamaz ve bize merhamet etmezsen mutlaka hüsrana uğrayanlardan oluruz﴾<\/span> [A'râf 23]."]]}, {"reader": false, "ar": [[1735.0, "وكذلك أيّوبُ عليه الصلاة والسلام،"], [1737.0, "لمّا قال ـ «وأيّوب…» ـ: <span class=\"ayah\">﴿وَاذْكُرْ عَبْدَنَا أَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الشَّيْطَانُ بِنُصْبٍ وَعَذَابٍ﴾<\/span> <span class=\"ref\">[ص: ٤١]<\/span>،"], [1747.0, "ثم جاءته الاستجابة: <span class=\"ayah\">﴿ارْكُضْ بِرِجْلِكَ ۖ هَٰذَا مُغْتَسَلٌ بَارِدٌ وَشَرَابٌ﴾<\/span> <span class=\"ref\">[ص: ٤٢]<\/span>."]], "tr": [[1735.0, "Aynı şekilde Eyyûb aleyhissalâtü vesselâm da (böyledir);"], [1736.2, "(Allah) şöyle buyurduğunda —\"Ve Eyyûb…\" (diye başlayıp düzeltiyor)—:"], [1739.0, "<span class=\"ayah\">﴿Kulumuz Eyyûb'u da an. Hani o Rabbine, \"Şeytan bana yorgunluk ve azap dokundurdu\" diye seslenmişti﴾<\/span> [Sâd 41]."], [1745.9, "Sonra ona icabet geldi: <span class=\"ayah\">﴿Ayağını yere vur; işte yıkanacak ve içilecek soğuk bir su﴾<\/span> [Sâd 42]."]]}, {"reader": false, "ar": [[1752.0, "فإذا مرّت على الإنسان حالةٌ مؤلمة ـ من فقرٍ،"], [1755.2, "أو حاجةٍ، أو كثرة ديون،"], [1757.5, "أو مرضٍ، أو قهر رجال،"], [1760.0, "أو غلبة طاغية، أو تهديدٍ مخيف ـ فليعرضه،"], [1767.8, "ويبسطه على فراش الافتقار بين يدي الله عز وجل، وليُبشِر بالخير."]], "tr": [[1752.0, "İnsanın başından fakirlik, ihtiyaç, borç çokluğu, hastalık, adamların kahrı, bir tâğûtun galebesi veya korkutucu bir tehdit gibi acı veren bir hâl geçerse, onu Allah Azze ve Celle'nin huzurunda iftikar döşeğine sersin, arz etsin ve hayırla müjdelensin."]]}, {"reader": false, "ar": [[1774.0, "وقال الله عز وجل أيضًا عن أيّوب:"], [1778.0, "<span class=\"ayah\">﴿وَأَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ ۝ فَاسْتَجَبْنَا لَهُ فَكَشَفْنَا مَا بِهِ مِن ضُرٍّ﴾<\/span> <span class=\"ref\">[الأنبياء: ٨٣–٨٤]<\/span>."], [1788.0, "هذا توسُّلٌ إلى الله بذكر الحال المؤلمة."]], "tr": [[1774.0, "Allah Azze ve Celle Eyyûb hakkında şöyle de buyurmuştur:"], [1778.0, "<span class=\"ayah\">﴿Eyyûb'u da (an). Hani o Rabbine, \"Bana bu dert dokundu; sen ise merhamet edenlerin en merhametlisisin\" diye seslenmişti. Biz de onun duasına icabet ettik ve ondaki derdi giderdik﴾<\/span> [Enbiyâ 83–84]."], [1788.6, "Bu, acı veren hâli arz ederek Allah'a tevessüldür."]]}, {"reader": false, "ar": [[1792.0, "وأيضًا هذا يونسُ عليه الصلاة والسلام:"], [1795.0, "<span class=\"ayah\">﴿إِذ ذَّهَبَ مُغَاضِبًا فَظَنَّ أَن لَّن نَّقْدِرَ عَلَيْهِ فَنَادَىٰ فِي الظُّلُمَاتِ أَن لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٨٧]<\/span>."], [1807.0, "هذا توسُّلٌ إلى الله عز وجل في الحال المؤلمة."]], "tr": [[1792.0, "Yine işte Yûnus aleyhissalâtü vesselâm:"], [1793.5, "<span class=\"ayah\">﴿Hani o öfkeli bir hâlde gitmiş ve onu asla sıkıştırmayacağımızı sanmıştı. Sonra karanlıklar içinde, \"Senden başka ilah yoktur; seni tenzih ederim, ben gerçekten zalimlerden oldum\" diye seslenmişti﴾<\/span> [Enbiyâ 87]."], [1807.0, "Bu, acı veren hâlde Allah Azze ve Celle'ye tevessüldür."]]}]}, {"ts": "30:12", "title": "6. Külliye (devam): Nûh, Mûsâ, Zekeriyyâ ve Peygamber'in (s.a.v.) hâl arz eden duaları", "paras": [{"reader": false, "ar": [[1812.0, "وكذلك نوحٌ عليه الصلاة والسلام قال:"], [1814.0, "<span class=\"ayah\">﴿رَبِّ إِنَّ قَوْمِي كَذَّبُونِ ۝ فَافْتَحْ بَيْنِي وَبَيْنَهُمْ فَتْحًا﴾<\/span> <span class=\"ref\">[الشعراء: ١١٧–١١٨]<\/span>."], [1819.0, "ويقول الله ـ وكذلك قال عنه ـ:"], [1822.5, "<span class=\"ayah\">﴿فَدَعَا رَبَّهُ أَنِّي مَغْلُوبٌ فَانتَصِرْ﴾<\/span> <span class=\"ref\">[القمر: ١٠]<\/span>."]], "tr": [[1812.0, "Aynı şekilde Nûh aleyhissalâtü vesselâm şöyle dedi:"], [1814.0, "<span class=\"ayah\">﴿Rabbim! Kavmim beni yalanladı. Artık benimle onlar arasında sen hükmünü ver﴾<\/span> [Şuarâ 117–118]."], [1819.0, "Allah onun hakkında şöyle de buyurmuştur:"], [1820.4, "<span class=\"ayah\">﴿O da Rabbine, \"Ben yenik düştüm, artık sen yardım et\" diye dua etti﴾<\/span> [Kamer 10]."]]}, {"reader": false, "ar": [[1826.0, "وكذلك موسى عليه الصلاة والسلام في قول الله عز وجل:"], [1830.7, "<span class=\"ayah\">﴿رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ﴾<\/span> <span class=\"ref\">[القصص: ٢٤]<\/span>،"], [1837.0, "فمباشرةً: <span class=\"ayah\">﴿فَجَاءَتْهُ إِحْدَاهُمَا﴾<\/span> <span class=\"ref\">[القصص: ٢٥]<\/span>؛ حلّ الفرجُ لمّا توسّل إلى الله عز وجل بعظيم فقره إليه."]], "tr": [[1826.0, "Aynı şekilde Mûsâ aleyhissalâtü vesselâm da Allah Azze ve Celle'nin şu sözünde (böyledir):"], [1830.7, "<span class=\"ayah\">﴿Rabbim! Bana indireceğin her hayra muhtacım﴾<\/span> [Kasas 24]."], [1837.9, "Hemen ardından: <span class=\"ayah\">﴿(Kızlardan) biri ona geldi﴾<\/span> [Kasas 25]."], [1841.9, "Allah Azze ve Celle'ye O'na olan büyük muhtaçlığıyla tevessül edince ferahlık geldi."]]}, {"reader": false, "ar": [[1847.0, "وقال عنه أيضًا: <span class=\"ayah\">﴿قَالَ رَبِّ إِنِّي لَا أَمْلِكُ إِلَّا نَفْسِي وَأَخِي﴾<\/span>،"], [1852.0, "أي: لا أستطيع مقاومةَ هذا الباطل الذي أطبقت عليه كلمةُ بني إسرائيل،"], [1857.0, "إنما أملك نفسي وأخي."], [1859.2, "وهذه حالةٌ مؤلمةٌ مرّت عليه،"], [1861.9, "فشكا ضعفَه إلى الله عز وجل،"], [1864.7, "وتسلُّطَ هؤلاء في اتّخاذهم العجل."], [1867.0, "فجاءه الجواب من الله عز وجل:"], [1870.0, "<span class=\"ayah\">﴿قَالَ رَبِّ إِنِّي لَا أَمْلِكُ إِلَّا نَفْسِي وَأَخِي ۖ فَافْرُقْ بَيْنَنَا وَبَيْنَ الْقَوْمِ الْفَاسِقِينَ﴾<\/span> <span class=\"ref\">[المائدة: ٢٥]<\/span>،"], [1875.0, "<span class=\"ayah\">﴿قَالَ فَإِنَّهَا مُحَرَّمَةٌ عَلَيْهِمْ ۛ أَرْبَعِينَ سَنَةً﴾<\/span> <span class=\"ref\">[المائدة: ٢٦]<\/span>."]], "tr": [[1847.0, "(Allah) onun hakkında şöyle de buyurmuştur:"], [1848.8, "<span class=\"ayah\">﴿Dedi ki: Rabbim! Ben kendimden ve kardeşimden başkasına söz geçiremiyorum﴾<\/span>."], [1852.4, "Yani: İsrâiloğulları'nın üzerinde söz birliği ettiği bu bâtıla karşı koyamıyorum;"], [1856.2, "ancak kendime ve kardeşime söz geçirebiliyorum."], [1859.2, "Bu, başından geçen acı veren bir hâldi;"], [1861.9, "zayıflığını ve bunların buzağıyı (ilah) edinmedeki tahakkümlerini Allah Azze ve Celle'ye şikâyet etti."], [1867.0, "Bunun üzerine Allah Azze ve Celle'den cevap geldi:"], [1870.0, "<span class=\"ayah\">﴿Dedi ki: Rabbim! Ben kendimden ve kardeşimden başkasına söz geçiremiyorum; artık bizimle o fâsık kavmin arasını ayır﴾<\/span> [Mâide 25]."], [1874.6, "<span class=\"ayah\">﴿(Allah) buyurdu ki: Orası onlara kırk yıl haram kılınmıştır﴾<\/span> [Mâide 26]."]]}, {"reader": false, "ar": [[1880.0, "وكذلك أيضًا لمّا قتل تلك النفسَ التي لم يُؤمَر بقتلها:"], [1884.0, "<span class=\"ayah\">﴿قَالَ رَبِّ إِنِّي ظَلَمْتُ نَفْسِي فَاغْفِرْ لِي فَغَفَرَ لَهُ ۚ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ﴾<\/span> <span class=\"ref\">[القصص: ١٦]<\/span>. «ظلمتُ نفسي»."]], "tr": [[1880.0, "Aynı şekilde, öldürülmesi kendisine emredilmemiş olan o canı öldürdüğünde de:"], [1882.8, "<span class=\"ayah\">﴿Dedi ki: Rabbim! Ben kendime zulmettim, beni bağışla. (Allah) da onu bağışladı. Şüphesiz O, çok bağışlayandır, çok merhamet edendir﴾<\/span> [Kasas 16]. \"Kendime zulmettim.\""]]}, {"reader": false, "ar": [[1892.0, "وهذا زكريّا عليه الصلاة والسلام يقول:"], [1896.1, "<span class=\"ayah\">﴿رَبِّ إِنِّي وَهَنَ الْعَظْمُ مِنِّي وَاشْتَعَلَ الرَّأْسُ شَيْبًا﴾<\/span> <span class=\"ref\">[مريم: ٤]<\/span>؛"], [1903.1, "يشكو ضعفَه، وكِبَرَ سنّه،"], [1906.0, "وشدّةَ حاجته للولد، فاستجاب الله عز وجل له ورزقه الولد."], [1913.0, "وقال في آيةٍ أخرى:"], [1914.8, "<span class=\"ayah\">﴿رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنتَ خَيْرُ الْوَارِثِينَ ۝ فَاسْتَجَبْنَا لَهُ وَوَهَبْنَا لَهُ يَحْيَىٰ﴾<\/span> <span class=\"ref\">[الأنبياء: ٨٩–٩٠]<\/span> <span class=\"note\">(Şeyh «وأنت خير الوالدين» diyor; mushaf lafzı «خير الوارثين»)<\/span>."]], "tr": [[1892.0, "İşte Zekeriyyâ aleyhissalâtü vesselâm şöyle diyor:"], [1896.1, "<span class=\"ayah\">﴿Rabbim! Kemiklerim zayıfladı, saçım sakalım ağardı﴾<\/span> [Meryem 4]."], [1903.1, "Zayıflığını, yaşının ilerlemesini ve çocuğa olan şiddetli ihtiyacını şikâyet ediyor."], [1907.9, "Allah Azze ve Celle de ona icabet etti ve ona çocuk verdi."], [1913.0, "Başka bir ayette şöyle buyurdu:"], [1914.8, "<span class=\"ayah\">﴿Rabbim! Beni yalnız bırakma; sen vârislerin en hayırlısısın. Biz de onun duasını kabul ettik ve ona Yahyâ'yı bağışladık﴾<\/span> [Enbiyâ 89–90]."]]}, {"reader": false, "ar": [[1921.0, "وكان من دعاء النبيّ صلى الله عليه وسلم أنه كان يقول:"], [1926.5, "«اللهمّ رحمتَك أرجو، فلا تكِلْني إلى نفسي طرفةَ عين، وأصلِح لي شأني كلَّه، لا إله إلا أنت»."], [1934.0, "وهذا توسُّلٌ إلى الله عز وجل بالضعف وشدّة الافتقار والحاجة في الهداية والعناية والكلاءة <span class=\"q\">؟ 32:17<\/span> إلى الله عز وجل."]], "tr": [[1921.0, "Peygamber sallallâhu aleyhi ve sellem'in dualarından biri de şöyle demesiydi:"], [1926.5, "\"Allah'ım! Rahmetini umuyorum; beni göz açıp kapayıncaya kadar bile nefsime bırakma, bütün işimi ıslah et;"], [1932.9, "senden başka ilah yoktur.\" Bu, zayıflık ve hidayette, inayette ve korunmada <span class=\"q\">؟<\/span> Allah Azze ve Celle'ye şiddetli muhtaçlık ve ihtiyaçla O'na tevessüldür."]]}, {"reader": false, "ar": [[1945.0, "ولمّا قال أبو بكرٍ:"], [1946.5, "يا رسول الله، علّمني دعاءً أدعو به في صلاتي،"], [1950.0, "قال: «قل: اللهمّ إني ظلمتُ نفسي ظلمًا كثيرًا» ـ وهذه الحالُ المؤلمة ـ «فاغفر لي مغفرةً ـ ولا يغفر الذنوبَ إلا أنت ـ فاغفر لي مغفرةً من عندك، وارحمني، إنك أنت الغفور الرحيم»."]], "tr": [[1945.0, "Ebû Bekir, \"Ey Allah'ın Resûlü!"], [1946.5, "Bana namazımda kendisiyle dua edeceğim bir dua öğret\" deyince şöyle buyurdu:"], [1950.5, "\"De ki: Allah'ım! Ben kendime çokça zulmettim\" —işte bu acı veren hâldir— \"beni bağışla —günahları senden başka bağışlayan yoktur—, beni katından bir mağfiretle bağışla ve bana merhamet et."], [1962.0, "Şüphesiz sen çok bağışlayan, çok merhamet edensin.\""]]}, {"reader": false, "ar": [[1965.0, "هذا الحديث توسّل أبو بكرٍ إلى الله عز وجل بثلاثة أنواعٍ من التوسُّل:"], [1971.0, "التوسُّلُ إلى الله بذكر الحال:"], [1973.0, "«ظلمتُ نفسي ظلمًا كثيرًا»،"], [1975.0, "التوسُّلُ إلى الله بصفاته:"], [1976.8, "«ولا يغفر الذنوب إلا أنت»،"], [1979.0, "التوسُّلُ إلى الله بأسمائه:"], [1980.2, "«إنك أنت الغفور الرحيم» في آخره."], [1982.0, "وكلّما استكثر العبدُ من أنواع التوسُّل في السؤال ـ في المطلوب الواحد ـ كلّما كان أدعى لاستجابة الله عز وجل له."], [1991.0, "وقد أجمع أهل العلم على جواز التوسُّل بذكر الحال."]], "tr": [[1965.0, "Bu hadiste Ebû Bekir, Allah Azze ve Celle'ye üç tür tevessülle tevessül etmiştir:"], [1971.0, "Hâlini arz ederek Allah'a tevessül:"], [1973.0, "\"Kendime çokça zulmettim\"; sıfatlarıyla Allah'a tevessül:"], [1975.0, "\"Günahları senden başka bağışlayan yoktur\";"], [1976.8, "sonunda isimleriyle Allah'a tevessül: \"Şüphesiz sen Gafûr'sun, Rahîm'sin.\" Kul, istekte —tek bir istek için— tevessül türlerini ne kadar çoğaltırsa, Allah Azze ve Celle'nin ona icabet etmesine o kadar daha çok vesile olur."], [1991.0, "İlim ehli, hâli arz ederek tevessülün caiz olduğu üzerinde icmâ etmiştir."]]}, {"reader": false, "ar": [[1997.0, "والله عز وجل في مثل هذه التوسُّلات لا يرقُب منك تصحيحَ اللغة ولا تصحيحَ النحو."], [2005.0, "ولذلك المتقرّر في القواعد أنّ الدعاء مبنيٌّ على قصد القلوب وإن أخطأ اللسان؛"], [2012.0, "فقد يقوم في قلب الداعي من المعاني ما لا يستطيع لسانُه أن يعبّر عنه،"], [2021.0, "فتأتي الاستجابةُ عامّةً <span class=\"q\">؟ 33:41<\/span>. فالله عز وجل في الدعاء لا ينظر إلى صواب اللسان أو خطئه،"], [2028.0, "وإنما ينظر إلى المقصود الذي يقوم في القلب،"], [2032.0, "وشدّةِ الافتقار واللَّجَأ الذي يقوم في قلب الداعي."]], "tr": [[1997.0, "Allah Azze ve Celle bu tür tevessüllerde senden dili ve nahvi düzeltmeni gözetmez."], [2005.0, "Bu yüzden kaidelerde yerleşik olan şudur:"], [2007.7, "Dil hata etse de dua, kalplerin kastı üzerine kuruludur."], [2012.0, "Bazen dua edenin kalbinde, dilinin ifade edemeyeceği manalar bulunur;"], [2018.4, "icabet de kapsamlı olarak <span class=\"q\">؟<\/span> gelir."], [2024.0, "Allah Azze ve Celle duada dilin doğruluğuna veya yanlışlığına bakmaz;"], [2028.0, "ancak kalpte bulunan maksada ve dua edenin kalbindeki şiddetli muhtaçlık ve sığınmaya bakar."]]}]}, {"ts": "33:56", "title": "7. Külliye: Hayatta, hazır ve sâlih olan herkesin duasıyla tevessül caizdir", "paras": [{"reader": false, "ar": [[2036.0, "ومن الكلّيّات أيضًا: <b>كلُّ حيٍّ حاضرٍ صالحٍ فيجوز التوسُّلُ بدعائه.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[2036.0, "Külliyelerden biri de şudur: 7."], [2038.1, "külliye: Hayatta, hazır ve sâlih olan herkesin duasıyla tevessül etmek caizdir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[2064.0, "وهذا من التوسُّل المشروع بإجماع أهل السنّة والجماعة:"], [2068.0, "أن يُتوسَّل إلى الله عز وجل بطلب الدعاء من ـ الرجل ـ من الحيّ الحاضر القادر الصالح."], [2075.0, "كأن يكون المسلم مثلًا في ضيقٍ شديد،"], [2078.0, "أو تحُلّ به شيءٌ من المصائب الكبيرة،"], [2081.0, "ويعلم من نفسه شيئًا من التفريط في حقّ الله عز وجل،"], [2085.0, "فيذهب إلى رجلٍ يعتقد فيه الصلاحَ والتقوى،"], [2088.5, "أو الفضلَ والعلمَ بالكتاب والسنّة،"], [2091.0, "فيطلب منه أن يدعوَ الله عز وجل له ليُفرِّج عنه كربتَه ويُنفِّس عنه همَّه."], [2097.0, "وقد دلّت الأدلّة ـ ولله الحمد والمنّة ـ على جواز ذلك."]], "tr": [[2064.0, "Ehl-i Sünnet ve'l-Cemaat'in icmâıyla bu meşru tevessüldendir:"], [2067.0, "Hayatta, hazır, (dua etmeye) gücü yeten ve sâlih olan kimseden dua talep ederek Allah Azze ve Celle'ye tevessül edilmesi."], [2075.0, "Mesela Müslüman şiddetli bir sıkıntı içindeyken veya başına büyük musibetlerden biri gelmişken ve kendisinde Allah Azze ve Celle'nin hakkında bir miktar kusur bildiği hâlde, salâh ve takvâ ya da fazilet ve Kitap ve Sünnet ilmi sahibi olduğuna inandığı bir adama gider ve sıkıntısını gidermesi ve kederini hafifletmesi için Allah Azze ve Celle'ye kendisi için dua etmesini ondan ister."], [2097.0, "Hamd ve minnet Allah'a, deliller bunun caiz olduğuna delâlet etmiştir."]]}, {"reader": false, "ar": [[2103.0, "ففي «الصحيحين» من حديث أنسٍ رضي الله تعالى عنه أنّ رجلًا دخل المسجد والنبيُّ صلى الله عليه وسلم قائمٌ يخطب،"], [2111.0, "فقال: يا رسول الله،"], [2113.5, "هلكت الأموال، وجاع العيال،"], [2115.9, "وانقطعت السُّبُل، فادعُ اللهَ يُغيثنا."], [2119.0, "يقول أنسٌ رضي الله تعالى عنه:"], [2121.0, "فلا واللهِ ما في السماء من سحابٍ ولا قَزَعة."], [2124.0, "فرفع النبيُّ صلى الله عليه وسلم يديه فقال:"], [2128.4, "«اللهمّ أغِثْنا» ثلاثًا. فخرجت سحابةٌ سوداء من وراء سَلْع ـ وهو الجبل الذي يأتي منه السحاب بالنسبة للمدينة ـ فلمّا توسّطت السماءَ انتشرت،"], [2142.1, "فأبرقت وأرعدت، ثم أمطرت."], [2144.2, "فلا واللهِ ما رأينا الشمسَ سَبْتًا كاملًا ـ أسبوعًا كاملًا."]], "tr": [[2103.0, "\"Sahîhayn\"da Enes —Allah Teâlâ ondan razı olsun— hadisinde şöyle geçer:"], [2106.6, "Peygamber sallallâhu aleyhi ve sellem ayakta hutbe okurken bir adam mescide girdi ve dedi ki:"], [2111.6, "\"Ey Allah'ın Resûlü! Mallar helak oldu, çoluk çocuk acıktı, yollar kesildi;"], [2115.9, "Allah'a dua et de bize yağmur versin.\" Enes —Allah Teâlâ ondan razı olsun— diyor ki:"], [2121.0, "Vallahi gökte ne bir bulut ne de bir bulut parçası vardı."], [2124.0, "Peygamber sallallâhu aleyhi ve sellem ellerini kaldırdı ve üç kez \"Allah'ım!"], [2130.0, "Bize yağmur ver\" dedi. Bunun üzerine Sel'in —Medine'ye göre bulutların geldiği dağdır— arkasından kara bir bulut çıktı."], [2138.7, "Göğün ortasına gelince yayıldı, şimşek çaktı, gürledi, sonra yağmur yağdı."], [2144.2, "Vallahi tam bir sebt —tam bir hafta— güneşi görmedik."]]}, {"reader": false, "ar": [[2149.0, "ثم جاء هو أو غيرُه في الجمعة الأخرى وقال:"], [2152.7, "يا رسول الله، انقطعت السُّبُل وهلك المال،"], [2156.0, "فادعُ اللهَ أن يرفعها عنّا."], [2158.0, "فتبسّم النبيُّ صلى الله عليه وسلم ثم قال:"], [2162.2, "«اللهمّ حوالَينا ولا علينا»،"], [2164.2, "ويُشير بيده. فيقول أنس:"], [2166.3, "فما يُشير بيده إلى ناحيةٍ إلا يتمزّق عنها السحاب."], [2171.0, "قال: ثم خرجنا نمشي في الشمس."], [2175.0, "فهذا دليلٌ على جواز التوسُّل بدعاء الرجل الحيّ الحاضر."]], "tr": [[2149.0, "Sonra o ya da başkası bir sonraki cuma geldi ve dedi ki:"], [2152.7, "\"Ey Allah'ın Resûlü! Yollar kesildi, mal helak oldu;"], [2155.5, "Allah'a dua et de onu (yağmuru) bizden kaldırsın.\" Peygamber sallallâhu aleyhi ve sellem tebessüm etti, sonra \"Allah'ım!"], [2162.2, "Etrafımıza, üzerimize değil\" dedi ve eliyle işaret ediyordu."], [2165.3, "Enes diyor ki: Eliyle hangi tarafa işaret ettiyse bulutlar oradan dağılıyordu."], [2171.0, "(Enes) dedi ki: Sonra güneşte yürüyerek çıktık."], [2175.0, "Bu, hayatta ve hazır olan adamın duasıyla tevessülün caiz olduğuna delildir."]]}, {"reader": false, "ar": [[2181.0, "ومنها أيضًا حديثُ أبي هريرة رضي الله تعالى عنه في قصّة السبعين ألفًا الذين يدخلون الجنّة بلا حسابٍ ولا عذاب،"], [2191.0, "وهم الذين لا يسترقون،"], [2193.2, "ولا يكتوون، ولا يتطيّرون،"], [2195.4, "وعلى ربّهم يتوكّلون. في آخر الحديث:"], [2198.3, "فقام عُكّاشةُ بنُ مِحصَن فقال:"], [2200.5, "يا رسول الله، ادعُ اللهَ أن يجعلني منهم،"], [2204.0, "فقال: «أنت منهم». فقام رجلٌ آخر وقال:"], [2207.3, "يا رسول الله، ادعُ اللهَ أن يجعلني منهم،"], [2211.0, "فقال: «سبقك بها عُكّاشة»،"], [2213.2, "يعني: حتى يُغلِق هذا الباب."], [2216.0, "فهذا دليلٌ على جواز التوسُّل بدعاء الرجل الحيّ الحاضر."]], "tr": [[2181.0, "Bunlardan biri de Ebû Hüreyre —Allah Teâlâ ondan razı olsun— hadisidir;"], [2186.0, "hesapsız ve azapsız cennete girecek yetmiş bin kişinin kıssası hakkındadır."], [2191.0, "Onlar rukye istemeyen, dağlanmayan, uğursuzluğa inanmayan ve Rablerine tevekkül eden kimselerdir."], [2197.0, "Hadisin sonunda: Ukkâşe b. Mihsan kalkıp dedi ki:"], [2200.5, "\"Ey Allah'ın Resûlü! Beni onlardan kılması için Allah'a dua et.\" (Peygamber) buyurdu ki:"], [2204.5, "\"Sen onlardansın.\" Başka bir adam kalkıp dedi ki:"], [2207.3, "\"Ey Allah'ın Resûlü! Beni onlardan kılması için Allah'a dua et.\" Buyurdu ki:"], [2211.6, "\"Ukkâşe bunda seni geçti.\" Yani bu kapıyı kapatmak için."], [2216.0, "Bu, hayatta ve hazır olan adamın duasıyla tevessülün caiz olduğuna delildir."]]}, {"reader": false, "ar": [[2222.0, "وكذلك أيضًا ثبت في «صحيح الإمام البخاريّ» من حديث أنسٍ رضي الله تعالى عنه قال:"], [2229.6, "كانوا في عهد عمر إذا قُحِطوا في المدينة يستسقي عمرُ بالعبّاس بن عبد المطّلب رضي الله تعالى عنه،"], [2240.0, "فيقول: «اللهمّ إنّا كنّا نتوسّل إليك بنبيّنا فتسقينا، وإنّا نتوسّل إليك بعمّ نبيّنا، قم يا عبّاس فادعُه»،"], [2250.4, "فيُسقَون. وكذلك توسّل معاويةُ رضي الله تعالى عنه وأهلُ الشام بيزيد بن الأسود رحمه الله تعالى."], [2264.0, "فكلُّ هذا يدلّ على جواز التوسُّل بطلب الدعاء من الرجل الحيّ الحاضر القادر."]], "tr": [[2222.0, "Aynı şekilde \"Sahîh-i Buhârî\"de Enes —Allah Teâlâ ondan razı olsun— hadisinde şöyle sabit olmuştur:"], [2226.5, "Ömer döneminde Medine'de kuraklık olduğunda Ömer, Abbâs b."], [2229.6, "Abdülmuttalib —Allah Teâlâ ondan razı olsun— ile yağmur duası eder ve şöyle derdi:"], [2235.4, "\"Allah'ım! Biz sana Peygamberimizle tevessül ederdik, sen de bize yağmur verirdin."], [2240.6, "Şimdi de sana Peygamberimizin amcasıyla tevessül ediyoruz."], [2244.9, "Kalk ey Abbâs, O'na dua et.\" Ve onlara yağmur verilirdi."], [2251.0, "Aynı şekilde Muâviye —Allah Teâlâ ondan razı olsun— ve Şam ehli de Yezîd b."], [2257.0, "el-Esved —Allah Teâlâ ona rahmet etsin— ile tevessül ettiler."], [2264.0, "Bütün bunlar, hayatta, hazır ve (dua etmeye) gücü yeten adamdan dua talep ederek tevessülün caiz olduğuna delâlet eder."]]}, {"reader": false, "ar": [[2273.0, "ولذلك أمرنا نبيُّنا صلى الله عليه وسلم إذا رأينا ـ أمر الصحابةَ إذا رأَوا أُويسًا القَرَنيّ ـ أي:"], [2283.2, "أن يطلبوا منه أن يستغفر لهم. سبحان الله!"]], "tr": [[2273.0, "Bu yüzden Peygamberimiz sallallâhu aleyhi ve sellem bize, gördüğümüzde —sahabeye, Üveys el-Karenî'yi gördüklerinde— yani ondan kendileri için istiğfar etmesini istemelerini emretti. Sübhânallah!"]]}, {"reader": false, "ar": [[2288.0, "وفي حديث سعد بن أبي وقّاصٍ رضي الله عنه ـ كما في «صحيح البخاريّ» وغيره ـ أنّ النبيّ صلى الله عليه وسلم قال:"], [2298.0, "«هل تُنصَرون وتُرزَقون إلا بضعفائكم؟»،"], [2303.0, "أي: بدعائهم. وقد بوّب الإمام البخاريُّ رحمه الله تعالى على هذا الحديث بقوله:"], [2309.5, "«بابُ من استعان بالضعفاء والصالحين في الحرب»،"], [2313.0, "يعني: بدعائهم؛ يطلب من هؤلاء المساكين أن يدعوا بالنصر."]], "tr": [[2288.0, "\"Sahîh-i Buhârî\"de ve başkalarında geçtiği üzere Sa'd b."], [2291.9, "Ebî Vakkâs —Allah ondan razı olsun— hadisinde Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2298.0, "\"Siz ancak zayıflarınız sayesinde yardım görür ve rızıklandırılırsınız, değil mi?\" Yani onların duasıyla."], [2304.0, "İmam Buhârî —Allah Teâlâ ona rahmet etsin— bu hadise \"Savaşta zayıflardan ve sâlihlerden yardım isteyenin babı\" diye bab başlığı koymuştur;"], [2314.0, "yani onların duasıyla. Bu yoksullardan zafer için dua etmelerini ister."]]}, {"reader": false, "ar": [[2322.0, "وأخرج الإمام أبو داود في «سننه» بإسنادٍ حسن من حديث عائشة رضي الله تعالى عنها قالت:"], [2329.1, "شكا الناسُ إلى النبيّ صلى الله عليه وسلم قُحوطَ المطر،"], [2335.0, "فأمر بمنبرٍ فوُضع له بالمصلّى،"], [2339.0, "ووعد الناسَ يومًا يخرجون فيه."], [2345.0, "فلمّا بدا حاجبُ الشمس خرج رسولُ الله صلى الله عليه وسلم فقعد على المنبر،"], [2350.6, "فحمد الله وأثنى عليه،"], [2352.2, "ثم قال: «أيها الناس، إنكم شكوتم جَدْبَ دياركم، واستئخارَ المطر عن إبّان زمانه منكم، وقد أمركم الله عز وجل أن تدعوه، ووعدكم أن يستجيب لكم»."], [2363.0, "ثم قال: «الحمد لله ربّ العالمين، الرحمن الرحيم، مالك يوم الدين، لا إله إلا أنت…» إلى آخر الحديث المعروف لديكم."]], "tr": [[2322.0, "İmam Ebû Dâvûd \"Sünen\"inde hasen bir isnadla Âişe —Allah Teâlâ ondan razı olsun— hadisinden şunu rivayet etmiştir:"], [2329.1, "İnsanlar Peygamber sallallâhu aleyhi ve sellem'e yağmurun kesildiğini şikâyet ettiler."], [2333.2, "Bir minber getirilmesini emretti, musallada onun için konuldu ve insanlara (namazgâha) çıkacakları bir gün vaat etti."], [2345.0, "Güneşin kenarı görününce Resûlullah sallallâhu aleyhi ve sellem çıktı, minbere oturdu, Allah'a hamd ve sena etti, sonra şöyle buyurdu:"], [2353.0, "\"Ey insanlar! Siz diyarınızın kuraklığını ve yağmurun mevsiminden gecikmesini şikâyet ettiniz."], [2356.5, "Allah Azze ve Celle size kendisine dua etmenizi emretmiş ve size icabet edeceğini vaat etmiştir.\" Sonra şöyle dedi:"], [2363.0, "\"Hamd, âlemlerin Rabbi, Rahmân, Rahîm, din gününün sahibi Allah'adır."], [2368.0, "Senden başka ilah yoktur…\" sizce bilinen hadisin sonuna kadar."]]}, {"reader": false, "ar": [[2373.0, "فما وصل مسجدَه إلا وقد سالت السيول،"], [2381.0, "فلمّا رأى سرعتهم إلى الكِنّ ـ يعني الاختباء من المطر ـ تبسّم النبيُّ صلى الله عليه وسلم حتى بدت نواجذُه،"], [2388.0, "وقال: «أشهد أنّ الله على كلّ شيءٍ قدير، وأشهد أني عبد الله»."]], "tr": [[2373.0, "(Peygamber) mescidine varmadan seller akmıştı."], [2376.0, "Onların sığınağa koşuşturmalarını —yani yağmurdan saklanmaya koşmalarını— görünce Peygamber sallallâhu aleyhi ve sellem azı dişleri görünecek kadar tebessüm etti ve şöyle dedi:"], [2388.3, "\"Allah'ın her şeye kadir olduğuna şahitlik ederim ve benim Allah'ın kulu olduğuma şahitlik ederim.\""]]}]}, {"ts": "39:52", "title": "7. Külliye (devam): Önemli bir kayıt — Sâlih kişi hakkında fitneden korkulmaması", "paras": [{"reader": false, "ar": [[2392.0, "ولكن ينبغي أن يُقيَّد هذا بقيدٍ مهمّ:"], [2399.0, "وهو إذا لم نخشَ الفتنةَ على هذا الرجل الصالح؛"], [2405.0, "ولذلك كثيرٌ من الصالحين لا يحبّ أن يُطلَب ـ أمام العامّة ـ أن يدعوَ له."], [2415.0, "فإذا علمنا أو غلب على ظنّنا أنّ أخانا إذا طلبنا منه أن يدعوَ لنا أنه سيقع في شيءٍ من الرياء أو العُجب بالنفس،"], [2425.0, "فحينئذٍ لا جَرَمَ أنّ سدَّ هذا الباب هو الواجب."]], "tr": [[2392.0, "Fakat bunun önemli bir kayıtla kayıtlanması gerekir:"], [2399.0, "O da bu sâlih adam hakkında fitneden korkmadığımız takdirdedir."], [2405.0, "Bu yüzden sâlihlerin birçoğu, kendisinden —halkın önünde— dua etmesinin istenmesini sevmez."], [2415.0, "Kardeşimizden bizim için dua etmesini istediğimizde onun bir miktar riyaya veya kendini beğenmeye düşeceğini bilirsek ya da zannımıza galip gelirse, o zaman şüphesiz bu kapıyı kapatmak vâciptir."]]}, {"reader": false, "ar": [[2432.0, "ولكن إذا علمنا أو غلب على ظنّنا أنه بتقواه وصلاحه لا يلتفت إلى هذه الأمور،"], [2437.0, "وأنه عظيمُ المحبّة لنفع إخوانه،"], [2440.0, "ولا يمكن أن يفكّر في قضيّة الرياء والعُجب،"], [2443.0, "وإنما نفسُه متمحِّضةٌ في النظر إلى ما ينفع إخوانه فقط،"], [2451.0, "فحينئذٍ لا بأس أن يُطلَب منه."], [2453.0, "فإذا كنّا نخاف على هذا الرجل أن يُفتَن في نفسه فحينئذٍ لا ينبغي أن يُطلَب منه شيءٌ من ذلك. والله أعلم."]], "tr": [[2432.0, "Fakat takvâsı ve salâhı sebebiyle bu şeylere iltifat etmediğini, kardeşlerine fayda vermeyi çok sevdiğini, riya ve ucub meselesini düşünmesinin mümkün olmadığını, nefsinin sadece kardeşlerine fayda verecek şeye bakmaya hasredilmiş olduğunu bilirsek ya da zannımıza galip gelirse, o zaman ondan (dua) istenmesinde bir sakınca yoktur."], [2454.2, "Bu adamın nefsinde fitneye düşmesinden korkuyorsak, o zaman ondan böyle bir şey istenmemelidir. Allah en iyisini bilir."]]}]}, {"ts": "41:03",
