masıdır."], [3219.0, "Şer'î delile aykırı olan şey, yapanı güzel ya da sağlam bir kasıt sahibi olsa bile haram olarak kalır."], [3229.3, "Bu konuda benimle misiniz, değil misiniz?"]]}, {"reader": false, "ar": [[3231.0, "فلا يجوز للإنسان أن يعلّل نفسه،"], [3234.0, "أو يبرّر لنفسه في فعل بدعته بأنه ذو قصدٍ سليم؛"], [3241.0, "فإنّ سلامة القصد شيء،"], [3245.0, "والوقوع في المخالفة شيءٌ آخر."], [3247.0, "ولذلك فإنك تجد كثيرًا من أهل البدع يجعلون من جملة الاستدلال على بدعتهم حسنَ نيّتهم وسلامةَ مقاصدهم؛"], [3261.0, "فيحتفلون بمولد النبيّ صلى الله عليه وسلم مثلًا،"], [3267.0, "فإذا أنكرنا عليهم ذلك قالوا:"], [3269.8, "إنما أردنا محبّته، ونشرَ سيرته،"], [3274.0, "وتعظيمَه وتعزيرَه وتوقيرَه ورفعَ شأنه،"], [3278.0, "فإنه الرسول الخاتم. فنقول:"], [3280.5, "أمّا قصدكم فسليم، ولكنّ سلامة المقاصد لا تسوّغ الوقوع في البدع والمخالفات."]], "tr": [[3231.0, "İnsanın, bid'atini yapmasında sağlam bir kasıt sahibi olduğunu söyleyerek kendini avutması ya da kendine mazeret bulması caiz değildir."], [3241.0, "Çünkü kastın sağlamlığı bir şeydir, muhalefete düşmek başka bir şeydir."], [3247.0, "Bu yüzden bid'at ehlinin birçoğunun, bid'atleri lehine delil getirirken iyi niyetlerini ve maksatlarının sağlamlığını da (delil) saydığını görürsün."], [3260.0, "Mesela Nebî ﷺ'in mevlidini kutlarlar;"], [3263.2, "bunu onlara inkâr ettiğimizde \"Biz sadece onu sevmeyi, siretini yaymayı, ona tazim ve ta'zîr (destek), tevkîr (saygı) göstermeyi ve şanını yüceltmeyi istedik;"], [3278.0, "çünkü o son peygamberdir\" derler."], [3281.0, "Deriz ki: Kastınız sağlamdır; fakat maksatların sağlamlığı bid'atlere ve muhalefetlere düşmeyi meşrulaştırmaz."]]}, {"reader": false, "ar": [[3287.0, "وإذا رأيت الذين يطوفون حول قبور الأولياء،"], [3290.9, "أو يذبحون عند قبورهم،"], [3293.1, "أو يدعونهم من دون الله عز وجل،"], [3297.0, "فإنك تسمع منهم كثيرًا أنّ هذا من باب تعظيم الأولياء،"], [3302.6, "ومعرفة منازل الصالحين، ومن باب تقديرهم؛"], [3306.0, "فنقول: كلُّ ذلك مقصودٌ حسن،"], [3308.3, "ولكن لا يسوّغ لكم ذلك أن تقعوا في مخالفة الشرع."]], "tr": [[3287.0, "Velîlerin kabirleri etrafında tavaf eden, kabirlerinin yanında kurban kesen ya da Allah Azze ve Celle'yi bırakıp onlara dua eden kimseleri gördüğünde, onlardan çoğu zaman bunun velîleri tazim etmek, sâlihlerin mertebelerini bilmek ve onlara değer vermek kabîlinden olduğunu işitirsin."], [3306.5, "Deriz ki: Bunların hepsi güzel bir maksattır;"], [3309.7, "fakat bu, sizin şeriate muhalefete düşmenizi meşrulaştırmaz."]]}, {"reader": false, "ar": [[3313.0, "ولو رأيت إلى كثيرٍ من بدع الصلاة والصوم والأذكار،"], [3319.0, "لوجدت أنّ أصحابها يعلّلون الوقوع في بدعهم بأنهم يريدون ذكر الله وإحياءَ ذكر الله في الأرض،"], [3329.0, "وملءَ أوقاتهم بالخير والقربة والطاعة،"], [3332.5, "والاشتغالَ بمحبوبات الخالق عن المخلوق؛"], [3337.0, "فنقول: أمّا هذا فقصدٌ سليم،"], [3340.1, "ولكنّ سلامة المقاصد لا تسوّغ الوقوع في المخالفات."], [3345.0, "فلا بدّ أن نفصل بين سلامة القصد والوقوع في الخطأ."], [3351.0, "والقاعدة واضحةٌ إن شاء الله."]], "tr": [[3313.0, "Namaz, oruç ve zikirlerle ilgili bid'atlerin birçoğuna baksan, sahiplerinin bid'atlerine düşmelerini Allah'ı zikretmek, Allah'ın zikrini yeryüzünde ihya etmek, vakitlerini hayır, kurbet ve itaatle doldurmak ve mahlûk yerine Hâlık'ın sevdiği şeylerle meşgul olmak istedikleriyle gerekçelendirdiklerini görürsün."], [3338.8, "Deriz ki: Bu, sağlam bir kasıttır;"], [3342.5, "fakat maksatların sağlamlığı muhalefetlere düşmeyi meşrulaştırmaz."], [3346.8, "Kastın sağlamlığı ile hataya düşmeyi birbirinden ayırmamız gerekir. Kaide açıktır inşallah."]]}]}, {"ts": "55:54", "title": "10. Külliye: Allah'a belirli bir vesileyle şer'î delil olmadan ibadet eden bid'atçidir", "paras": [{"reader": false, "ar": [[3354.0, "ومن الكلّيّات أيضًا: كلُّ وسيلةٍ ـ <b>كلُّ من تعبّد بوسيلةٍ بعينها بلا دليل الشرع فمبتدع.<\/b> كلُّ من تعبّد بوسيلةٍ بعينها بلا دليل الشرع فمبتدع."], [3378.0, "كلُّ من تعبّد لله عز وجل بوسيلةٍ بعينها بلا دليل الشرع فمبتدع."]], "tr": [[3354.0, "Külliyelerden biri de şudur: Her vesile..."], [3357.4, "<b>10. külliye: Şer'î delil olmaksızın belirli bir vesileyle ibadet eden herkes bid'atçidir.<\/b> Şer'î delil olmaksızın belirli bir vesileyle ibadet eden herkes bid'atçidir."], [3378.0, "Şer'î delil olmaksızın belirli bir vesileyle Allah Azze ve Celle'ye ibadet eden herkes bid'atçidir."]]}, {"reader": false, "ar": [[3387.0, "فأقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أنّ من أبواب البدع ما يسمّيه أهل السنة والجماعة ببدع الوسائل،"], [3397.0, "وهي الذريعة التي تُفضي إلى مقصودٍ تعبّديّ."], [3403.0, "فهل يجوز للإنسان أن يسلك أيَّ وسيلةٍ للوصول إلى مقصودٍ تعبّديّ؟"], [3409.0, "أم أنّ هناك وسائل لا بدّ فيها من دليل؟"], [3416.0, "أم أنّ الوسائل لا بدّ لها من دليلٍ خاصّ؟"], [3419.0, "الجواب: هو أنّ أهل السنة يقسمون الوسيلة للتعبّد إلى قسمين:"], [3427.0, "إلى الوسائل التعبّديّة، وإلى الوسائل المحضة،"], [3431.0, "ولا بدّ من التفريق بين هذين القسمين حتى يتحرّر حكمُ كلّ واحدةٍ منهما."]], "tr": [[3387.0, "Tevfik Allah'tandır, derim ki: Bil —Allah Teâlâ sana rahmet etsin— ki bid'at kapılarından biri, Ehl-i Sünnet ve'l-Cemaat'in \"vesile bid'atleri\" dediği şeydir;"], [3399.2, "bu, taabbudî bir maksada götüren zarîadır (araçtır)."], [3404.6, "İnsanın taabbudî bir maksada ulaşmak için herhangi bir vesileye başvurması caiz midir?"], [3411.8, "Yoksa kendisinde delil gereken vesileler mi vardır?"], [3417.0, "Yoksa vesileler için özel bir delil mi gerekir?"], [3420.4, "Cevap şudur: Ehl-i Sünnet taabbud vesilesini iki kısma ayırır:"], [3427.7, "Taabbudî vesileler ve salt (mahz) vesileler."], [3431.6, "Her birinin hükmünün netleşmesi için bu iki kısmı birbirinden ayırmak gerekir."]]}]}, {"ts": "57:21", "title": "10. Külliye (devam): Taabbudî vesileler ve salt vesileler", "paras": [{"reader": false, "ar": [[3441.0, "فالوسائل تنقسم إلى قسمين:"], [3444.0, "إلى وسائل تعبّديّة، وإلى وسائل محضة،"], [3448.0, "والفرقانُ بينهما قصدُ التعبّد بعينها من عدم القصد."], [3454.0, "فكلُّ وسيلةٍ قصدتَ بسلوكها أن تجعلها قربةً بخصوصها،"], [3461.1, "وعبادةً بخصوصها، واعتقدتَ أنّ هذا المقصود الذي تريد الوصول إليه بهذه الوسيلة أعظمُ أجرًا وأكثرُ ثوابًا من الوصول إليه عن طريقٍ آخر،"], [3479.0, "فهذه الوسيلة ـ بهذه الاعتبارات ـ نسمّيها وسيلةً تعبّديّة."]], "tr": [[3441.0, "Vesileler iki kısma ayrılır: Taabbudî vesileler ve salt vesileler."], [3446.7, "Aralarındaki fark, bizzat onunla taabbudun kastedilip kastedilmemesidir."], [3451.6, "Ona başvurmakla onu özel olarak bir kurbet ve özel olarak bir ibadet kılmayı kastettiğin ve bu vesileyle ulaşmak istediğin maksada onunla ulaşmanın, başka bir yolla ulaşmaktan daha büyük ecirli ve daha çok sevaplı olduğuna inandığın her vesileye, bu itibarlarla \"taabbudî vesile\" deriz."]]}, {"reader": false, "ar": [[3486.0, "والأصل في الوسائل التعبّديّة التوقيف،"], [3489.6, "كما قرّرته هذه الكلّيّة؛"], [3494.0, "فلا يجوز لأحدٍ أن يسلك طريقةً معتقدًا مشروعيّتها بخصوصها وعينها،"], [3503.0, "متعبّدًا لله عز وجل بسلوكها بعينها،"], [3507.0, "إلا وعلى هذه الوسيلة دليلٌ من الشرع؛"], [3510.0, "فإن جاءنا بدليلٍ يُثبت جواز التعبّد لله عز وجل بها فإننا نقبله،"], [3520.4, "وإلا فالأصل في العبادات الحظر والتوقيف."]], "tr": [[3486.0, "Taabbudî vesilelerde asıl olan, bu külliyenin takrir ettiği gibi tevkîftir."], [3491.0, "Hiç kimsenin, bizzat ve özel olarak meşru olduğuna inanarak ve bizzat ona başvurmakla Allah Azze ve Celle'ye ibadet ederek bir yola başvurması caiz değildir;"], [3506.3, "ancak bu vesile hakkında şeriatten bir delil bulunursa (caiz olur)."], [3509.6, "Allah Azze ve Celle'ye onunla ibadet etmenin caiz olduğunu ispat eden bir delil getirirse onu kabul ederiz;"], [3520.4, "aksi hâlde ibadetlerde asıl olan yasaklık ve tevkîftir."]]}, {"reader": false, "ar": [[3526.0, "وأمّا النوع الثاني من الوسائل فإنه الوسائل المحضة،"], [3530.8, "وهي الوسيلة التي لا يُنظر إلى عينها،"], [3535.0, "ولا يُتعبّد إلى الله عز وجل بخصوصها،"], [3539.1, "وإنما نجعلها طريقًا محضًا،"], [3541.5, "وذريعةً أو وسيلةً محضةً للوصول إلى ما وراءها من المقصود الشرعيّ،"], [3548.0, "ولو وجدنا وسيلةً أخرى هي أسهل وأيسر منها لسلكناها واتّخذناها."], [3556.0, "فتلك الوسائل يسمّيها أهل السنة والجماعة بالوسائل المحضة؛"], [3564.0, "أي التي لا يُعتقد بسلوكها أنها عبادةٌ بخصوصها."]], "tr": [[3526.0, "Vesilelerin ikinci türü ise salt vesilelerdir."], [3529.0, "Bu, kendisine bizzat bakılmayan ve özel olarak onunla Allah Azze ve Celle'ye ibadet edilmeyen vesiledir;"], [3536.8, "bilakis onu, arkasındaki şer'î maksada ulaşmak için salt bir yol, bir zarîa ya da salt bir vesile kılarız."], [3546.2, "Ondan daha kolay ve daha rahat başka bir vesile bulsaydık ona başvurur ve onu edinirdik."], [3556.0, "Ehl-i Sünnet ve'l-Cemaat bu vesilelere \"salt vesileler\" der;"], [3564.0, "yani başvurulmasıyla özel olarak bir ibadet olduğuna inanılmayan vesileler."]]}]}, {"ts": "59:30", "title": "10. Külliye (devam): Tesbih ile zikir çekme meselesi", "paras": [{"reader": false, "ar": [[3570.0, "وعلى ذلك فروعٌ، أذكر واحدًا منها،"], [3574.1, "وأُرجئ البقيّة إلى الدرس القادم،"], [3579.0, "وهو فرع التسبيح بالسُّبحة،"], [3581.9, "أو بخاتم التسبيح، ونحوها؛"], [3586.0, "فإنه قد يكون وسيلةً تعبّديّةً يُطلب فيها دليل،"], [3591.0, "وقد يكون وسيلةً محضةً لا يُطلب فيها دليل،"], [3596.0, "وذلك بالنظر إلى قصد فاعله؛"], [3602.0, "لأنّ الأمور بمقاصدها، والأعمال بنيّاتها."]], "tr": [[3570.0, "Bunun üzerine bina edilen fer'î meseleler vardır;"], [3573.5, "birini zikredip geri kalanını gelecek derse erteliyorum."], [3579.0, "O da tesbihle, tesbih yüzüğüyle ve benzerleriyle zikir çekme meselesidir."], [3586.6, "Bu, kendisinde delil istenen taabbudî bir vesile de olabilir, kendisinde delil istenmeyen salt bir vesile de olabilir;"], [3595.4, "bu, yapanın kastına bakılarak belirlenir."], [3598.4, "Çünkü işler maksatlarına göredir, ameller de niyetlere göredir."]]}, {"reader": false, "ar": [[3607.0, "فإن كان يظنّ الظانّ أنّ التسبيح بالسُّبحة أفضلُ وأعظمُ أجرًا من التسبيح باليد،"], [3615.4, "فحينئذٍ هو يقصد بسلوكها التعبّد بها بعينها،"], [3622.0, "فتكون وسيلةً تعبّديّة، فلا نقبل هذه الوسيلة إلا بدليل."], [3630.0, "وأمّا إذا كان لا يقصد التعبّد لله بها بخصوصها،"], [3636.0, "وإنما أراد أن يجعلها وسيلةً محضةً لضبط العدّ فقط،"], [3642.0, "ولو وجد ما يضبط العدّ بغيره أسهلَ منها لما كانت عنده غضاضةٌ في أن ينتقل منها إلى غيرها،"], [3652.0, "فتلك تكون وسيلةً محضة،"], [3654.9, "ولا يُطلب فيها دليل."]], "tr": [[3607.0, "Eğer biri tesbihle zikir çekmenin elle zikir çekmekten daha faziletli ve daha büyük ecirli olduğunu zannediyorsa, o takdirde ona başvurmakla bizzat onunla taabbudu kastetmektedir;"], [3622.7, "bu durumda o taabbudî bir vesile olur ve bu vesileyi ancak bir delille kabul ederiz."], [3634.0, "Eğer onunla özel olarak Allah'a ibadeti kastetmiyor, sadece onu sayıyı tutmak için salt bir vesile kılmak istiyorsa ve sayıyı ondan daha kolay tutan başka bir şey bulsa ondan diğerine geçmekte bir beis görmeyecekse, bu salt bir vesile olur ve onda delil istenmez."]]}, {"reader": false, "ar": [[3659.0, "وبهذا التفصيل نجمع بين من منع التسبيح عليها وجعلها بدعة،"], [3666.0, "وبين من أجاز التسبيح بها وجعل الأصل فيها الجواز."], [3671.0, "فنقول: إنّ الذي منعها غلّب فيها جانب الوسيلة التعبّديّة،"], [3676.0, "كما يفعله الصوفيّة؛ فإنّ الوليّ عندهم كلّما عظُم منزلةً كثرت أعدادُ سبحته عددًا وحجمًا،"], [3691.0, "فيجعلون كثرة عدد السبحة وعظمَ حجمها من علامات الولاية."], [3699.0, "وأمّا من أجازها فإنه غلّب فيها محضيّتها،"], [3706.0, "بأنه لا يريد بها إلا ضبط العدّ فقط."]], "tr": [[3659.0, "Bu tafsilatla, tesbihle zikir çekmeyi yasaklayıp onu bid'at sayan ile tesbihle zikir çekmeyi caiz görüp onda aslın cevaz olduğunu söyleyeni bağdaştırırız."], [3670.4, "Deriz ki: Onu yasaklayan, onda taabbudî vesile yönünü ağır basmış saymıştır;"], [3676.0, "sûfîlerin yaptığı gibi. Çünkü onlara göre velînin mertebesi büyüdükçe tesbihinin sayısı ve hacmi artar;"], [3684.7, "tesbihin tane sayısının çokluğunu ve hacminin büyüklüğünü velâyetin alametlerinden sayarlar."], [3696.0, "Onu caiz görene gelince, o, onunla sadece sayıyı tutmayı istediği için onda salt vesile oluşunu ağır basmış saymıştır."]]}, {"reader": false, "ar": [[3711.0, "واختار أبو العباس ابن تيمية جوازَ التسبيح بالسُّبحة أو بالحصى؛"], [3717.0, "لأنها وسيلةٌ محضةٌ لمقصودٍ حسن."], [3723.0, "فانظر كيف أجازها أبو العباس لمّا كانت وسيلةً محضة!"], [3731.0, "وبهذا ينحلّ إشكالُ كثيرٍ من الوسائل التي نصل بها إلى العبادات."]], "tr": [[3711.0, "Ebü'l-Abbâs İbn Teymiyye, tesbihle ya da çakıl taşlarıyla zikir çekmenin caiz olduğunu tercih etmiştir;"], [3718.6, "çünkü o, güzel bir maksat için salt bir vesiledir."], [3726.6, "Bak, salt bir vesile olunca Ebü'l-Abbâs onu nasıl caiz gördü!"], [3733.5, "Bununla, ibadetlere ulaştığımız birçok vesilenin müşkili çözülür."]]}]}, {"ts": "1:02:18", "title": "10. Külliye (devam): Davet vesileleri", "paras": [{"reader": false, "ar": [[3738.0, "وقد عمّ خلافٌ في زمنٍ مضى في حكم وسائل الدعوة:"], [3746.0, "أهي توقيفيّةٌ تعبّديّة، أم الأصل فيها الحلّ والإباحة والجواز؟"], [3752.0, "نقول ـ على هذا التفصيل ـ:"], [3756.0, "فإن كان الداعية سيسلك طريقةً دعويّةً ليس عليها أمرُ النبيّ صلى الله عليه وسلم،"], [3766.0, "ولم يُعهد من السلف الصالح سلوكُها للدعوة،"], [3771.0, "ولكنه لا يريد بسلوكها إلا أن يجعلها وسيلةً محضةً للوصول إلى المقصود الدعويّ في نشر الدعوة،"], [3780.0, "فنقول: إنّ وسائل الدعوة اجتهاديّةٌ بهذا الاعتبار؛"], [3785.0, "فللداعية أن يتّخذ من الوسائل الدعويّة ما يضمن وصول دعوته على الوجه الأكمل،"], [3795.0, "ما لم يعتقد في وسيلةٍ أنها عبادةٌ بخصوصها."]], "tr": [[3738.0, "Geçmiş bir zamanda davet vesilelerinin hükmü hakkında yaygın bir ihtilaf olmuştu:"], [3746.0, "Onlar tevkîfî ve taabbudî midir, yoksa onlarda asıl olan helallik, mubahlık ve cevaz mıdır?"], [3756.7, "Bu tafsilata göre deriz ki:"], [3760.0, "Eğer dâî, üzerinde Nebî ﷺ'in emri bulunmayan ve selef-i sâlihînin davet için başvurduğu bilinmeyen bir davet yoluna başvuracaksa, fakat ona başvurmakla sadece onu daveti yaymadaki davet maksadına ulaşmak için salt bir vesile kılmak istiyorsa, deriz ki:"], [3782.9, "Bu itibarla davet vesileleri ictihadîdir."], [3786.5, "Dâî, bir vesilenin özel olarak bir ibadet olduğuna inanmadığı sürece, davetinin en mükemmel şekilde ulaşmasını sağlayacak davet vesilelerini edinebilir."]]}, {"reader": false, "ar": [[3800.0, "وأمّا إذا اتّخذ وسيلةً للدعوة وهو يرى أنّ الدعوة بناءً على هذه الوسيلة أفضلُ عند الله وأعظمُ أجرًا،"], [3812.0, "فإنها لم تعد وسيلةً محضة،"], [3815.0, "وإنما صارت وسيلةً تعبّديّة؛"], [3818.0, "فنحكم على هذا النوع من الوسائل ـ بهذا المقصود ـ أنه ممنوعٌ حتى يرد دليل الشرع."], [3824.0, "وبناءً على ذلك نعرف خطأ من بدّع نشر الأشرطة في زمنٍ مضى للدعوة،"], [3834.0, "وبين من منع نقل المحاضرات عن طريق ـ أو القراءةَ بالصلاة عن طريق مكبّرات الصوت؛"], [3843.0, "لأنّ الناس إنما يفعل ـ لأنّ الدعاة إنما يفعلون ذلك على أنها وسائلُ محضةٌ لإيصال الخير والدعوة فقط."]], "tr": [[3800.0, "Ama davet için bir vesile edinir ve bu vesileye dayalı davetin Allah katında daha faziletli ve daha büyük ecirli olduğunu düşünürse, o artık salt bir vesile olmaktan çıkar ve taabbudî bir vesile hâline gelir."], [3821.0, "Bu kastla bu tür vesilelerin, şer'î delil gelinceye kadar yasak olduğuna hükmederiz."], [3826.7, "Buna göre, geçmiş bir zamanda davet için kaset yaymayı bid'at sayanın ve konferansların —ya da namazdaki kıraatin— hoparlörler yoluyla aktarılmasını yasaklayanın hatasını anlarız."], [3843.0, "Çünkü insanlar bunu sadece... çünkü dâîler bunu sadece hayrı ve daveti ulaştırmak için salt vesileler olarak yaparlar."]]}]}, {"ts": "1:04:14", "title": "10. Külliye (devam): Davet vesilelerinde orta yol", "paras": [{"reader": false, "ar": [[3854.0, "وبناءً على ذلك فالقول الصحيح في وسائل الدعوة هو أن نقول:"], [3859.0, "وسائل الدعوة تعبّديّةٌ إذا قُصد التعبّد بعينها،"], [3866.0, "واجتهاديّةٌ إذا لم يُقصد التعبّد بعينها."], [3872.0, "وهذا قولٌ وسطٌ بين من ضيّق الباب وجعله كلَّه تعبّدًا،"], [3880.0, "فحرم الدعاةَ من الدعوة بهذه الوسائل الحديثة،"], [3886.0, "بينما أهل الباطل يستغلّونها في نشر باطلهم،"], [3889.0, "وبين من فتح الباب ووسّعه على مصراعيه حتى صار يدخل فيه المخالفات الشرعيّة."], [3900.0, "وخيرُ الأمور أوساطها؛ فلا نقول:"], [3905.5, "تعبّديّةٌ مطلقًا، ولا: اجتهاديّةٌ مطلقًا،"], [3910.0, "وإنما ذلك يختلف باختلاف مقصود الداعية في سلوكها،"], [3914.6, "على التفصيل الذي تقتضيه هذه الكلّيّة."], [3918.0, "والله أعلم، وصلى الله وسلم على نبيّنا."]], "tr": [[3854.0, "Buna göre davet vesileleri hakkında doğru görüş şunu söylememizdir:"], [3857.6, "Davet vesileleri, bizzat onlarla taabbud kastedilirse taabbudîdir;"], [3861.2, "bizzat onlarla taabbud kastedilmezse ictihadîdir."], [3866.8, "Bu, kapıyı daraltıp hepsini taabbud sayan —ve böylece bâtıl ehli bu modern vesileleri bâtıllarını yaymada kullanırken dâîleri bu vesilelerle davetten mahrum bırakan— kimse ile kapıyı ardına kadar açıp genişleten ve nihayet içine şer'î muhalefetler girmeye başlayan kimse arasında orta bir görüştür."], [3897.3, "İşlerin en hayırlısı ortalarıdır. \"Mutlak olarak taabbudîdir\" de demeyiz, \"mutlak olarak ictihadîdir\" de demeyiz;"], [3907.9, "bilakis bu, bu külliyenin gerektirdiği tafsilat üzere, dâînin onlara başvurmadaki maksadının farklılığına göre farklılaşır."], [3916.3, "Allah en iyisini bilir. Allah Nebîmiz'e salât ve selâm eylesin."]]}]}]};
