<script>
const D={"no": 28, "vid": "pDHveXaXpaw", "title_ar": "الدرس (٢٨) من شرح كليات العقيدة — من كليات البدع", "title_tr": "Şerhu Külliyyâti'l-Akîde — 28. Ders: Bid'at Külliyeleri (Bid'atçinin Öldürülmesi, Tevbesi, Hecr, Muayyen Kişiye Hüküm, Sağlam Çıkış Noktaları, Vaîd, Yardım, Düşmanlık, İyi Niyet, Vesileler)", "sections": [{"ts": "00:00", "title": "1. Külliye: Ağır bid'atinin şerri ancak öldürülmesiyle def edilebilen kişi öldürülür", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.4, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.9, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.9, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [12.4, "أمّا بعد: فنبدأ مستعينين بالله عز وجل في كلّيّات هذا الدرس."], [19.0, "الكلّيّة الأولى: <b>كلُّ من لا يندفع شرُّ بدعته المغلَّظة إلا بقتله فيُقتَل.<\/b> كلُّ من لا يندفع شرُّ بدعته المغلَّظة إلا بقتله فيُقتَل."], [32.0, "أُعيدها مرةً ثالثة: كلُّ من لا يندفع شرُّ بدعته المغلَّظة إلا بقتله فيُقتَل."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.4, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [14.8, "Bundan sonra: Allah Azze ve Celle'den yardım dileyerek bu dersin külliyelerine başlıyoruz."], [21.3, "<b>1. külliye: Ağır (mugallaz) bid'atinin şerri ancak öldürülmesiyle def edilebilen herkes öldürülür.<\/b> Ağır bid'atinin şerri ancak öldürülmesiyle def edilebilen herkes öldürülür."], [32.7, "Üçüncü kez tekrarlıyorum: Ağır bid'atinin şerri ancak öldürülmesiyle def edilebilen herkes öldürülür."]]}, {"reader": false, "ar": [[45.0, "أقول وبالله التوفيق: وذلك لأنّ من مقاصد الشريعة حفظَ الدين،"], [53.0, "فكلُّ ما من شأنه إتلافُ الدين فإنّ الواجب علينا سدُّ أبوابه بأيّ طريقٍ يوجب سدَّه."], [60.0, "فإذا لم ينسدَّ شرُّ هذا المبتدع عن الدين والتخبّطِ فيه إلا بقتله،"], [68.0, "فإنه لا بأس بقتله حينئذٍ بأمرٍ من وليّ الأمر تعزيرًا."], [75.0, "فإقامةُ هذا التعزير على صاحب البدعة المغلَّظة ـ إذا لم يندفع شرُّه إلا بقتله ـ هو من خصائص وليّ الأمر،"], [86.0, "وليس لأحدٍ من الناس فيه مدخل."]], "tr": [[45.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [50.7, "Şeriatin maksatlarından biri dini korumaktır."], [53.5, "Dini yok etme niteliğindeki her şeyin kapılarını, kapanmasını gerektiren her yolla kapatmamız vaciptir."], [60.0, "Bu bid'atçinin dine yönelik şerri ve dinde karıştırıp durması ancak öldürülmesiyle kapanacaksa, o takdirde veliyyü'l-emrin emriyle ta'zir olarak öldürülmesinde bir sakınca yoktur."], [75.6, "Ağır bid'at sahibine —şerri ancak öldürülmesiyle def edilebiliyorsa— bu ta'zirin uygulanması veliyyü'l-emre has işlerdendir;"], [84.8, "insanlardan hiç kimsenin bunda bir payı yoktur."]]}, {"reader": false, "ar": [[89.0, "ولذلك وردت الأدلة المتواترة في الأمر بقتال الخوارج؛"], [97.0, "فإنّ النبيّ صلى الله عليه وسلم لمّا أمر بقتل الخوارج وقتالهم لم يكن ذلك لكفرهم،"], [105.7, "وإنما لدفع عاديتهم وشرّهم وضررهم عن الإسلام والمسلمين."], [112.0, "ففي حديث أبي سعيدٍ الخدريّ رضي الله تعالى عنه قال:"], [116.5, "قال النبيّ صلى الله عليه وسلم:"], [119.5, "«لئن أدركتُهم ـ أي الخوارج ـ لأقتلنّهم قتلَ عاد». متّفقٌ عليه."]], "tr": [[89.0, "Bu yüzden Hâricîlerle savaşmayı emreden mütevâtir deliller gelmiştir."], [94.1, "Nebî ﷺ Hâricîlerin öldürülmesini ve onlarla savaşılmasını emrettiğinde bu, onların küfrü sebebiyle değildi;"], [103.0, "sadece saldırganlıklarını, şerlerini ve zararlarını İslam'dan ve Müslümanlardan def etmek içindi."], [110.5, "Ebû Saîd el-Hudrî'nin —Allah Teâlâ ondan razı olsun— hadisinde şöyle dedi:"], [116.0, "Nebî ﷺ buyurdu ki: \"Onlara —yani Hâricîlere— yetişirsem, onları Âd kavminin öldürülüşü gibi öldüreceğim.\" Müttefekun aleyh."]]}, {"reader": false, "ar": [[124.0, "وفي حديث ابن مسعودٍ رضي الله تعالى عنه قال:"], [130.5, "قال النبيّ صلى الله عليه وسلم:"], [133.5, "«فمن لقيهم فليقتلهم، فإنّ في قتلهم أجرًا عند الله عز وجل لمن قتلهم»."], [140.0, "أخرجه الإمام أحمد في مسنده،"], [142.5, "والترمذيّ في جامعه، وابن ماجه في سننه."], [146.0, "وفي حديث سعيد بن جُمْهان رحمه الله تعالى عن أبي أمامة رضي الله تعالى عنه قال:"], [153.7, "قال النبيّ صلى الله عليه وسلم:"], [157.8, "«طوبى لمن قتلهم أو قتلوه»."], [162.0, "وقال النبيّ صلى الله عليه وسلم في وصفهم:"], [166.3, "«شرُّ قتلى تحت أديم السماء»."]], "tr": [[124.0, "İbn Mes'ûd'un —Allah Teâlâ ondan razı olsun— hadisinde şöyle dedi:"], [130.5, "Nebî ﷺ buyurdu ki: \"Onlarla karşılaşan onları öldürsün;"], [134.0, "çünkü onları öldürmekte, öldüren için Allah Azze ve Celle katında ecir vardır.\" Bunu İmam Ahmed Müsned'inde, Tirmizî Câmi'inde ve İbn Mâce Sünen'inde rivayet etmiştir."], [145.0, "Saîd b. Cumhân'ın —Allah Teâlâ ona rahmet etsin— Ebû Ümâme'den —Allah Teâlâ ondan razı olsun— rivayet ettiği hadiste şöyle dedi:"], [153.7, "Nebî ﷺ buyurdu ki: \"Onları öldürene ya da onların öldürdüğü kimseye ne mutlu!\" Nebî ﷺ onları nitelerken şöyle buyurdu:"], [165.2, "\"(Onlar) gök kubbenin altındaki en kötü ölülerdir.\""]]}, {"reader": false, "ar": [[169.0, "وفي حديث أبي بكرة رضي الله تعالى عنه قال:"], [173.7, "قال النبيّ صلى الله عليه وسلم:"], [177.7, "«ثمّ إذا لقيتموهم فاقتلوهم، فإنه يُؤجَر قاتلُهم»."], [183.0, "أخرجه الإمام أحمد في مسنده، والحاكم في مستدركه."]], "tr": [[169.0, "Ebû Bekre'nin —Allah Teâlâ ondan razı olsun— hadisinde şöyle dedi:"], [173.7, "Nebî ﷺ buyurdu ki: \"Sonra onlarla karşılaştığınızda onları öldürün;"], [179.0, "çünkü onları öldürene ecir verilir.\" Bunu İmam Ahmed Müsned'inde, Hâkim de Müstedrek'inde rivayet etmiştir."]]}, {"reader": false, "ar": [[187.0, "وقد ثبت عن عليٍّ رضي الله تعالى عنه قتلُ السبئيّة أتباعِ عبد الله بن سبأ اليهوديّ،"], [197.0, "لمّا قالوا: إنك أنت هو،"], [200.2, "قال: ومن هو؟ قالوا:"], [202.8, "أنت اللهُ الذي لا إله إلا هو؛"], [207.4, "فخدّ الأخاديد وحرّقهم بالنار."], [210.0, "ولمّا بلغ ذلك ـ أي صفةُ قتلهم ـ ابنَ عباسٍ رضي الله تعالى عنهما قال:"], [218.2, "«لئن كان ذلك لي لأقتلنّهم بالسيف؛ فإنّ النبيّ صلى الله عليه وسلم قال: لا يُحرِّق بالنار إلا ربُّها»،"], [227.7, "أو كما قال صلى الله عليه وسلم."]], "tr": [[187.0, "Ali'nin —Allah Teâlâ ondan razı olsun— Yahudi Abdullah b."], [192.0, "Sebe'in tâbileri olan Sebeiyye'yi öldürdüğü sabit olmuştur."], [196.4, "Ona \"Sen O'sun\" dediklerinde \"O kim?\" dedi;"], [200.9, "\"Sen, kendisinden başka ilâh olmayan Allah'sın\" dediler."], [205.4, "Bunun üzerine hendekler kazdırdı ve onları ateşle yaktı."], [210.6, "Bu —yani onların öldürülüş şekli— İbn Abbâs'a —Allah Teâlâ ikisinden razı olsun— ulaşınca şöyle dedi:"], [220.1, "\"Bu iş bana kalsaydı onları kılıçla öldürürdüm;"], [223.9, "çünkü Nebî ﷺ 'Ateşle ancak onun Rabbi azap eder' buyurmuştur.\" Ya da ﷺ nasıl buyurduysa."]]}, {"reader": false, "ar": [[231.0, "ولم يختلف الصحابة رضي الله تعالى عنهم في وجوب قتل السبئيّة،"], [238.0, "بل جعلوا ذلك من جملة مناقب عليٍّ رضي الله تعالى عنه."]], "tr": [[231.0, "Sahâbe —Allah Teâlâ onlardan razı olsun— Sebeiyye'nin öldürülmesinin vacip olduğunda ihtilaf etmedi;"], [238.0, "bilakis bunu Ali'nin —Allah Teâlâ ondan razı olsun— menkıbeleri arasında saydılar."]]}]}, {"ts": "04:03", "title": "1. Külliye (devam): Ca'd b. Dirhem ve Cehm b. Safvân'ın öldürülmesi", "paras": [{"reader": false, "ar": [[243.0, "ولمّا اشتدّت بدعةُ الجعد بن درهم،"], [246.8, "ولم يندفع شرُّه ولا شرُّ بدعته عن المسلمين إلا بقتله،"], [253.1, "أفتى قضاةُ زمانه بقتله،"], [259.0, "فقتله خالدٌ القسريّ في يوم النحر."], [264.0, "وقال الإمام ابن القيّم رحمه الله تعالى مسطِّرًا هذا الحدث ـ إن لم أكن أخطأتُ في الأبيات ـ:"], [273.0, "«من أجل ذا ضحّى بجعدٍ خالدٌ الـ ... قسريُّ يومَ ذبائحِ القربانِ ... إذ قال: إبراهيمُ ليس خليلَه ... كلّا، ولا موسى الكليمَ الداني ... شكرَ الضحيّةَ كلُّ صاحبِ سنّةٍ ... للهِ درُّك من أخي قربانِ»."]], "tr": [[243.0, "Ca'd b. Dirhem'in bid'ati şiddetlenip onun şerri ve bid'atinin şerri Müslümanlardan ancak öldürülmesiyle def edilebilir hâle gelince, zamanının kadıları onun öldürülmesine fetva verdi ve Hâlid el-Kasrî onu kurban bayramı günü öldürdü."], [264.0, "İmam İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— bu hadiseyi kaleme alarak şöyle demiştir —beyitlerde hata etmediysem—:"], [272.3, "\"Bunun içindir ki Hâlid el-Kasrî, kurbanların kesildiği gün Ca'd'ı kurban etti."], [275.7, "Çünkü o, 'İbrâhîm (Allah'ın) dostu değildir, hayır, (Allah'a) yakın olan Kelîm Mûsâ da (O'nunla konuşmamıştır)' demişti."], [284.9, "Her sünnet ehli bu kurbana şükretti;"], [287.5, "ne güzel kurban kardeşisin sen!\""]]}, {"reader": false, "ar": [[290.0, "وقد ورث الجهمُ بن صفوان مقالةَ التعطيل عن الجعد،"], [297.0, "ونشرها، ونُسبت إليه، وقتله صاحبُ الشرطة سَلْمُ بن أحوز بإفتاء قضاة أهل زمانه."], [311.0, "وكلُّ ذلك من باب دفع عادية هذه البدعة وشرّها،"], [317.0, "من باب المحافظة على مقصود الدين،"], [321.0, "أو مقصود المحافظة على الدين."]], "tr": [[290.0, "Cehm b. Safvân ta'til görüşünü Ca'd'dan miras aldı, onu yaydı ve (bu görüş) ona nispet edildi."], [302.5, "Onu da zabıta âmiri Selm b."], [309.5, "Ahvez, zamanının kadılarının fetvasıyla öldürdü."], [312.3, "Bunların hepsi bu bid'atin saldırganlığını ve şerrini def etmek kabîlindendir;"], [318.3, "dinin maksadını koruma —ya da dini koruma maksadı— kabîlindendir."]]}]}, {"ts": "05:23", "title": "1. Külliye (devam): Bu külliyenin üç zâbıtı", "paras": [{"reader": false, "ar": [[323.0, "إلا أنه لا بدّ من التنبيه على أنّ هذا ليس لأفراد الأمة ولا لآحاد الشعب،"], [330.0, "وإنما لا بدّ أن يكون بحكم القضاء وأمر وليّ الأمر."], [337.0, "وننبّه تنبيهًا ثانيًا: أنه لا يكون على كلّ بدعة،"], [343.0, "وإنما لا يكون إلا على البدعة المغلَّظة التي تنقض أصل الدين وتوجب الكفر؛"], [354.0, "ولذلك قلتُ في الكلّيّة:"], [359.2, "«المغلَّظة». وأمّا البدع المفسِّقة فإنها لا توجب تطبيق تعزير القتل على صاحبها."]], "tr": [[323.0, "Ancak şuna dikkat çekmek gerekir:"], [325.3, "Bu, ümmetin fertlerine ya da halkın tek tek kişilerine ait değildir;"], [330.7, "mutlaka kadı hükmüyle ve veliyyü'l-emrin emriyle olmalıdır."], [336.3, "İkinci olarak şuna dikkat çekeriz:"], [339.7, "Bu her bid'atte olmaz; sadece dinin aslını bozan ve küfrü gerektiren ağır bid'atte olur."], [350.3, "Bu yüzden külliyede \"ağır (mugallaz)\" dedim."], [356.4, "Tefsik edici (fâsıklığa götüren) bid'atlere gelince, bunlar sahibine öldürme ta'ziri uygulanmasını gerektirmez."]]}, {"reader": false, "ar": [[372.0, "وتنبيهٌ ثالث، وهو: أنه لا بدّ أن يكون ممّن ظهر شرُّه في الدعوة إلى هذه البدعة المغلَّظة."], [381.0, "فأمّا إذا كان من أهل البدع ـ عليكم السلام ورحمة الله ـ وأمّا إذا كان من أهل البدع المغلَّظة ولا يدعو لها فإنه لا يجوز قتله."]], "tr": [[372.0, "Üçüncü bir dikkat çekme de şudur:"], [375.2, "(O kişi,) bu ağır bid'ate davet etmekte şerri ortaya çıkmış kimselerden olmalıdır."], [382.3, "Eğer bid'at ehlinden olup —ve aleykümüsselâm ve rahmetullah— ağır bid'at ehlinden olup ona davet etmiyorsa, onu öldürmek caiz değildir."]]}, {"reader": false, "ar": [[396.0, "وبناءً على ذلك فلا بدّ أن تُضبط هذه القاعدة بهذه الضوابط الثلاثة:"], [402.0, "الأوّل: أن تكون بدعته مغلَّظة،"], [404.5, "ومتى ما أطلقنا البدعة المغلَّظة فنعني بها البدعة المكفِّرة."], [409.0, "الثاني: أن يكون من الدعاة إليها،"], [413.0, "وبناءً على ذلك فإن لم يكن داعيةً إليها فلا يجوز التعرّض لقتله."], [418.1, "الثالث: أن يكون ذلك بحكم القضاء وأمر وليّ الأمر،"], [424.0, "وبناءً على ذلك فليس ذلك لآحاد الرعيّة ولا لأفرادهم. والله أعلم."]], "tr": [[396.0, "Buna göre bu kaidenin şu üç zâbıtla sınırlandırılması gerekir:"], [400.5, "Birincisi: Bid'atinin ağır olması. \"Ağır bid'at\" dediğimizde tekfir edici bid'ati kastediyoruz."], [406.0, "İkincisi: Ona davet edenlerden olması."], [409.0, "Buna göre ona davet eden biri değilse, onu öldürmeye kalkışmak caiz değildir."], [415.5, "Üçüncüsü: Bunun kadı hükmüyle ve veliyyü'l-emrin emriyle olması."], [420.0, "Buna göre bu, raiyyetin (halkın) tek tek kişilerine ve fertlerine ait değildir. Allah en iyisini bilir."]]}]}, {"ts": "07:12", "title": "2. Külliye: Bid'at ehlinden sâdık bir tevbeyle tevbe edenin tevbesi makbuldür", "paras": [{"reader": false, "ar": [[432.0, "ومن الكلّيّات أيضًا: <b>كلُّ من تاب من أهل البدع توبةً صادقةً فمقبولة.<\/b> كلُّ من تاب من أهل البدع توبةً صادقةً فمقبولة؛ أي: فتوبتُه مقبولة."]], "tr": [[432.0, "Külliyelerden biri de şudur: 2."], [434.1, "külliye: Bid'at ehlinden sâdık bir tevbeyle tevbe eden herkes(in tevbesi) makbuldür. Bid'at ehlinden sâdık bir tevbeyle tevbe eden herkes(in tevbesi) makbuldür;"], [446.7, "yani onun tevbesi kabul edilir."]]}, {"reader": false, "ar": [[453.0, "أقول وبالله التوفيق: وقد اختلف أهل السنة والجماعة رحمهم الله تعالى في حكم توبة المبتدع:"], [461.0, "هل هي مقبولةٌ أو لا؟"], [463.0, "على قولين لأهل العلم:"], [465.0, "فقال بعض أهل العلم بأنّ المبتدع ليس له توبة،"], [469.0, "وقد اختاره من أصحابنا أبو إسحاق بن شاقْلا والشاطبيّ،"], [474.0, "وهو مذهب الربيع بن نافع."], [478.0, "بينما ذهب جماهير أهل السنة والجماعة إلى أنه متى ما استوفت توبةُ المبتدع شروطَها وانتفت موانعُها فإنها توبةٌ مقبولة،"], [491.0, "وهذا هو الحقّ في هذه المسألة،"], [493.2, "والذي لا ينبغي القولُ بغيره."]], "tr": [[453.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat —Allah Teâlâ onlara rahmet etsin— bid'atçinin tevbesinin hükmünde, yani kabul edilip edilmediğinde ilim ehlinin iki görüşü üzere ihtilaf etmiştir."], [465.4, "İlim ehlinin bir kısmı bid'atçinin tevbesi olmadığını söylemiştir;"], [468.6, "bunu bizim (Hanbelî) ashâbımızdan Ebû İshâk b."], [472.3, "Şâkıllâ ve Şâtıbî tercih etmiştir;"], [475.7, "bu, Rebî' b. Nâfi'in de mezhebidir."], [479.9, "Ehl-i Sünnet ve'l-Cemaat'in cumhuru ise bid'atçinin tevbesi şartlarını tamamladığında ve engelleri ortadan kalktığında makbul bir tevbe olduğu görüşüne gitmiştir."], [491.7, "Bu meselede hak budur; başka bir şey söylemek yakışmaz."]]}, {"reader": false, "ar": [[495.0, "وذلك لعموم الأدلة من الكتاب والسنة،"], [504.0, "والتي تدلّ على قبول التوبة إذا توفّرت شروطها وانتفت موانعها؛"], [510.0, "كقول الله عز وجل:"], [511.8, "<span class=\"ayah\">﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ ۚ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا﴾<\/span> <span class=\"ref\">[الزمر: ٥٣]<\/span>،"], [520.4, "وهذا عمومٌ يدخل فيه المبتدع وذنبُ البدعة."], [526.0, "وقال الله عز وجل:"], [528.1, "<span class=\"ayah\">﴿وَإِنِّي لَغَفَّارٌ لِّمَن تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ﴾<\/span> <span class=\"ref\">[طه: ٨٢]<\/span>،"], [532.8, "وهذا عمومٌ يدخل فيه أهل البدع."], [536.0, "وقال الله عز وجل:"], [538.2, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا تُوبُوا إِلَى اللَّهِ تَوْبَةً نَّصُوحًا﴾<\/span> <span class=\"ref\">[التحريم: ٨]<\/span>."], [543.0, "وقال الله عز وجل:"], [544.9, "<span class=\"ayah\">﴿وَإِنَّ رَبَّكَ لَذُو مَغْفِرَةٍ لِّلنَّاسِ عَلَىٰ ظُلْمِهِمْ﴾<\/span> <span class=\"ref\">[الرعد: ٦]<\/span>،"], [548.1, "ويدخل في عموم الظلم ظلمُ البدعة."]], "tr": [[495.0, "Bu, Kitap ve Sünnet'teki delillerin umumu sebebiyledir;"], [498.8, "bu deliller şartları bulunduğunda ve engelleri ortadan kalktığında tevbenin kabul edileceğine delâlet eder."], [508.8, "Allah Azze ve Celle'nin şu sözü gibi:"], [511.3, "<span class=\"ayah\">﴿De ki: Ey kendi nefislerine karşı aşırı giden kullarım! Allah'ın rahmetinden ümidinizi kesmeyin. Şüphesiz Allah bütün günahları bağışlar﴾<\/span> [Zümer 53]."], [518.4, "Bu, bid'atçinin ve bid'at günahının girdiği bir umumdur."], [522.5, "Allah Azze ve Celle şöyle buyurdu:"], [526.0, "<span class=\"ayah\">﴿Şüphesiz ben, tevbe eden, iman eden, salih amel işleyen, sonra doğru yolda devam eden kimseyi çokça bağışlayanım﴾<\/span> [Tâhâ 82]."], [533.4, "Bu, bid'at ehlinin girdiği bir umumdur."], [535.5, "Allah Azze ve Celle şöyle buyurdu:"], [538.2, "<span class=\"ayah\">﴿Ey iman edenler! Allah'a nasûh (samimi) bir tevbe ile tevbe edin﴾<\/span> [Tahrîm 8]."], [543.0, "Allah Azze ve Celle şöyle buyurdu:"], [545.3, "<span class=\"ayah\">﴿Şüphesiz Rabbin, zulümlerine rağmen insanlara karşı mağfiret sahibidir﴾<\/span> [Ra'd 6]."], [548.6, "Zulmün umumuna bid'at zulmü de girer."]]}, {"reader": false, "ar": [[552.0, "وقال النبيّ صلى الله عليه وسلم:"], [555.2, "«من تاب قبل أن تطلع الشمس من مغربها تاب الله عليه»،"], [561.0, "وهذا عمومٌ يدخل فيه أهل البدع."], [563.0, "وقال النبيّ صلى الله عليه وسلم:"], [566.0, "«إنّ الله تبارك وتعالى يبسط يده بالليل ليتوب مسيءُ النهار، ويبسط يده بالنهار ليتوب مسيءُ الليل، حتى تطلع الشمس من مغربها»،"], [576.2, "وهذا عمومٌ يدخل فيه أهل البدع."], [579.0, "وكلُّ من أخرج أهل البدع من جملة أفراد هذه العمومات فإنه مطالَبٌ بالدليل الدالّ على هذا الإخراج والتخصيص؛"], [592.0, "لأنّ المتقرّر في القواعد أنّ الواجب في اللفظ العامّ بقاؤه على عمومه،"], [599.0, "ولا يجوز تخصيصه إلا بدليل."]], "tr": [[552.0, "Nebî ﷺ şöyle buyurdu: \"Güneş batıdan doğmadan önce tevbe edenin tevbesini Allah kabul eder.\" Bu, bid'at ehlinin girdiği bir umumdur."], [561.7, "Nebî ﷺ şöyle buyurdu: \"Allah Tebâreke ve Teâlâ, gündüz kötülük edenin tevbe etmesi için gece elini açar;"], [569.0, "gece kötülük edenin tevbe etmesi için gündüz elini açar;"], [573.4, "güneş batıdan doğuncaya kadar (bu böyle devam eder).\" Bu, bid'at ehlinin girdiği bir umumdur."], [580.3, "Bid'at ehlini bu umumların fertleri arasından çıkaran herkesten, bu çıkarmaya ve tahsise delâlet eden delili getirmesi istenir."], [592.0, "Çünkü kaidelerde yerleşik olan şudur:"], [594.9, "Âm lafızda vacip olan, umumu üzere kalmasıdır;"], [599.0, "ancak bir delille tahsis edilebilir."]]}]}, {"ts": "10:01", "title": "2. Külliye (devam): Bid'atçinin tevbesinin şartı", "paras": [{"reader": false, "ar": [[601.0, "ولأنّ الله عز وجل أخبر عن قبول توبة الكفّار،"], [608.0, "وليس ذنبُ المبتدع بأعظمَ من كفر الكافر؛"], [615.0, "فإذا كان الله يقبل توبة الكافر إذا تاب من كفره ـ وهو أغلظ الذنوب على الإطلاق ـ فلَأنْ يقبلَ توبةَ من تاب من أهل الذنوب ممّا هو أدنى منه من باب أولى."]], "tr": [[601.0, "Ayrıca Allah Azze ve Celle kâfirlerin tevbesini kabul ettiğini haber vermiştir;"], [608.0, "bid'atçinin günahı da kâfirin küfründen daha büyük değildir."], [615.0, "Allah, kâfir küfründen tevbe ettiğinde —ki o, mutlak olarak günahların en ağırıdır— onun tevbesini kabul ediyorsa, günah ehlinden ondan daha aşağı olan bir şeyden tevbe edenin tevbesini kabul etmesi evleviyetle (haydi haydi) söz konusudur."]]}, {"reader": false, "ar": [[631.0, "إلا أنّ توبته لا بدّ أن تكون مشروطةً بشرطٍ عظيم،"], [636.0, "وهي البراءة من بدعته وبيانُ خطئه فيها؛"], [640.0, "وذلك لأنه قد أضلّ كثيرًا ببدعته،"], [644.0, "فلا بدّ أن يظهر أمام الناس ويقول:"], [647.1, "إنّ ما كنتُ أقول به من كذا وكذا ليس هو السنة،"], [652.0, "وإنما هو بدعة، وإني تبتُ إلى الله عز وجل منه،"], [657.0, "وأدعو كلَّ من تأثّر بي فيه أن يتوب منه؛"], [664.0, "حتى تبرأ ذمّتُه أمام الله عز وجل من إضلال غيره بهذه البدعة،"], [672.0, "لا سيّما إذا كان من الدعاة لها."]], "tr": [[631.0, "Ancak onun tevbesi büyük bir şarta bağlı olmalıdır:"], [635.0, "O da bid'atinden beri olması ve onda hata ettiğini açıklamasıdır."], [640.7, "Çünkü o, bid'atiyle birçok kişiyi saptırmıştır."], [644.4, "Bu yüzden insanların önüne çıkıp şöyle demelidir:"], [647.6, "\"Şu şu konuda söylediğim şey sünnet değildir;"], [650.7, "bilakis bid'attir. Ben ondan Allah Azze ve Celle'ye tevbe ettim ve bu konuda benden etkilenen herkesi ondan tevbe etmeye çağırıyorum.\" Ta ki başkalarını bu bid'atle saptırmaktan dolayı zimmeti Allah Azze ve Celle huzurunda temize çıksın;"], [672.7, "özellikle de ona davet edenlerdense."]]}, {"reader": false, "ar": [[678.0, "وأمّا إذا لم يكن من الدعاة لها،"], [680.5, "وإنما ممّن يفعلها فقط،"], [682.0, "فحينئذٍ يكفي فيه أن يُقلع عنها فورًا،"], [686.0, "وأن يندم على ما مضى من عمره فيها،"], [690.0, "وأن يعزم على عدم العودة إليها مطلقًا،"], [695.3, "مع كمال النيّة الخالصة في هذه التوبة."], [700.0, "والخلاصة من هذه الكلّيّة:"], [702.0, "أنّ القول الصحيح والرأي الراجح المليح هو قبولُ توبة المبتدع متى ما توفّرت شروطها وانتفت موانعها."]], "tr": [[678.0, "Ona davet edenlerden değil de sadece onu yapanlardansa, o takdirde ondan derhal vazgeçmesi, ömrünün onda geçen kısmına pişman olması ve ona asla geri dönmemeye azmetmesi, bu tevbede halis niyetin kemâliyle birlikte, yeterlidir."], [697.3, "Bu külliyeden çıkan sonuç şudur:"], [700.5, "Doğru görüş ve güzel, râcih kanaat, bid'atçinin tevbesinin şartları bulunduğunda ve engelleri ortadan kalktığında kabul edilmesidir."]]}]}, {"ts": "11:51", "title": "2. Külliye (devam): «Allah her bid'at sahibinden tevbeyi perdelemiştir» hadisine cevap", "paras": [{"reader": false, "ar": [[711.0, "فإن قلت: فإن قلت:"], [713.2, "وما الإجابة عن قول النبيّ صلى الله عليه وسلم:"], [718.0, "«إنّ الله تعالى حجب التوبة عن كلّ صاحب بدعة»؟"], [726.0, "فأقول: إنّ الحديث فيه ضعف."], [731.0, "ونقول كذلك: بأنه مطلقٌ في مكان،"], [735.1, "ومقيّدٌ في روايةٍ أخرى ـ على ضعف الروايتين ـ؛"], [745.0, "فقد قُيِّد هذا الإطلاق بقوله:"], [748.1, "«ما لم ينزع». ونقول ثالثًا:"], [751.3, "بأنّ هذا الحديث ـ لو سلّمنا صحّته ـ فإنه يُساق مساقَ التغليظ من البدعة فقط."]], "tr": [[711.0, "Şayet —şayet— \"Nebî ﷺ'in 'Allah Teâlâ her bid'at sahibinden tevbeyi perdelemiştir' sözüne cevap nedir?\" dersen, derim ki:"], [720.8, "Bu hadiste zayıflık vardır. Ayrıca deriz ki:"], [727.6, "O bir yerde mutlak, başka bir rivayette mukayyeddir —her iki rivayetin de zayıf olmasıyla birlikte—;"], [739.1, "bu mutlaklık \"(bid'atinden) vazgeçmedikçe\" sözüyle kayıtlanmıştır."], [748.1, "Üçüncü olarak deriz ki: Bu hadisin sahih olduğunu kabul etsek bile, o sadece bid'atten sakındırmayı ağırlaştırma bağlamında zikredilir."]]}, {"reader": false, "ar": [[767.0, "وذلك لأنّ البدعة أحبُّ إلى إبليس من المعصية،"], [772.0, "وأوّلُ مراتب التوبة منها استشعارُ قبحها؛"], [779.0, "فإنّ توبة من يعصي الله عز وجل أيسرُ من توبة المبتدع؛"], [784.0, "إذ الإنسان قد يعصي وهو مستشعرٌ قبحَ معصيته،"], [788.0, "ولكنّ الذي يدفعه إليها شهوتُه."], [792.0, "وأمّا المبتدع فإنه يُقبل على بدعته وهو مستشعرٌ حسنَها،"], [800.0, "وأوّلُ مراتب توبته استشعارُ قبحها."], [804.0, "ومن المعلوم أنّ الذنب إذا كان يقف وراءه شبهةٌ فإنّ النزع منه أعسرُ من الذنب الذي يقف وراءه شهوة،"], [816.0, "كما تقرّر عند أهل السنة والجماعة. والله أعلم."]], "tr": [[767.0, "Bu şundandır: Bid'at İblis'e masiyetten daha sevimlidir;"], [771.4, "ondan tevbenin ilk mertebesi onun çirkinliğini hissetmektir."], [779.0, "Allah Azze ve Celle'ye isyan edenin tevbesi bid'atçinin tevbesinden daha kolaydır."], [784.0, "Çünkü insan bazen masiyetinin çirkinliğini hissederek isyan eder;"], [788.0, "fakat onu buna iten şehvetidir."], [792.0, "Bid'atçi ise bid'atinin güzelliğini hissederek ona yönelir;"], [797.0, "onun tevbesinin ilk mertebesi onun çirkinliğini hissetmektir."], [804.0, "Bilindiği üzere arkasında bir şüphe duran günahtan vazgeçmek, arkasında bir şehvet duran günahtan vazgeçmekten daha zordur;"], [812.9, "Ehl-i Sünnet ve'l-Cemaat nezdinde yerleşik olduğu gibi. Allah en iyisini bilir."]]}]}, {"ts": "13:42", "title": "3. Külliye: Hecr bid'atini terk etmesinde kendisi için daha caydırıcı olan, ölçüsünce terk edilir", "paras": [{"reader": false, "ar": [[822.0, "ومن الكلّيّات أيضًا: <b>كلُّ من كان الهجرُ أزجرَ له في ترك بدعته المفسِّقة فيُهجَر بقدره.<\/b> كلُّ من كان الهجرُ أزجرَ له في ترك بدعته المفسِّقة فيُهجَر بقدره."], [846.0, "أُعيدها مرةً ثالثة: كلُّ من كان الهجرُ أزجرَ له في ترك بدعته المفسِّقة فيُهجَر بقدره."]], "tr": [[822.0, "Külliyelerden biri de şudur: 3."], [824.0, "külliye: Tefsik edici bid'atini terk etmesi için hecrin (onunla ilişkiyi kesmenin) kendisini daha çok caydırdığı herkes, (bu caydırma) ölçüsünce hecr edilir. Tefsik edici bid'atini terk etmesi için hecrin kendisini daha çok caydırdığı herkes, ölçüsünce hecr edilir."], [847.9, "Üçüncü kez tekrarlıyorum: Tefsik edici bid'atini terk etmesi için hecrin kendisini daha çok caydırdığı herkes, ölçüsünce hecr edilir."]]}, {"reader": false, "ar": [[856.0, "أقول وبالله التوفيق: وذلك لأنّ الأصل حرمةُ التهاجر بين المسلمين،"], [862.0, "إلا أنّ هذه الحرمة لا بدّ أن تُقيَّد بقيد،"], [867.0, "وهي قولنا: إلا إذا كان الهجر يدعو له ضرورةٌ،"], [871.2, "أو حاجةٌ ملحّة، أو مصلحةٌ راجحة."], [874.0, "فلا يُطلب من كلّ مسلمٍ أن يهجر أهل البدع المفسِّقة؛"], [879.0, "لأنهم لا يزالون على حكم الإسلام."], [886.0, "إلا أنّ من كان في هجره لهذا المبتدع مصلحةٌ راجحة،"], [892.0, "فإننا نأمره هو بعينه وخصوصه أن يهجره؛"], [895.0, "فليس هجرُ المبتدع مطلوبًا من كلّ أحد،"], [900.0, "وإنما نطلبه ممّن يكون في هجره تحقيقُ مصلحة النزع من هذه البدعة،"], [907.0, "أو دفعُ مفسدة هذه البدعة."]], "tr": [[856.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [859.9, "Asıl olan, Müslümanlar arasında birbirini terk etmenin (tehâcür) haram olmasıdır."], [864.8, "Ancak bu haramlığın bir kayıtla sınırlandırılması gerekir;"], [868.4, "o da şu sözümüzdür: Hecre bir zaruret, acil bir ihtiyaç ya da râcih bir maslahat çağırıyorsa müstesnadır."], [876.0, "Her Müslümandan tefsik edici bid'at ehlini hecr etmesi istenmez;"], [881.3, "çünkü onlar hâlâ İslam hükmü üzeredirler."], [887.8, "Ancak bu bid'atçiyi hecr etmesinde râcih bir maslahat bulunan kimseye, bizzat ve özel olarak onu hecr etmesini emrederiz."], [897.1, "Bid'atçiyi hecr etmek herkesten istenmez;"], [900.6, "sadece hecrinde bu bid'atten vazgeçirme maslahatının gerçekleşeceği ya da bu bid'atin mefsedetinin def edileceği kimseden isteriz."]]}]}, {"ts": "15:10", "title": "3. Külliye (devam): Hecrin delilleri ve selefin sözleri", "paras": [{"reader": false, "ar": [[910.0, "ويدلّ على ذلك ما في الصحيح من حديث عبد الله بن مغفَّلٍ رضي الله تعالى عنه:"], [917.0, "أنه رأى قريبًا له يخذف،"], [920.0, "فحدّثه بحديث النهي عن الخذف،"], [925.0, "قال: ثمّ رآه يخذف،"], [927.0, "فقال: «أحدّثك عن رسول الله صلى الله عليه وسلم وأراك تخذف؟! فلا أكلّمك أبدًا»."], [934.0, "فإذا كان الهجر من باب الزجر يجوز في مسألة المعاصي،"], [940.8, "فلَأنْ يكون في باب البدع المفسِّقة من باب أولى."], [947.0, "ولذلك استنبط الإمام النوويّ رحمه الله تعالى من هذا الحديث تلك الفائدة،"], [952.0, "فقال: «فيه هجرانُ أهل البدع والفسوق». انتهى كلامه."]], "tr": [[910.0, "Buna Sahîh'teki Abdullah b. Mugaffel'in —Allah Teâlâ ondan razı olsun— hadisi delâlet eder:"], [914.8, "O, akrabasından birinin hazf yaptığını (parmaklarıyla taş fırlattığını) gördü ve ona hazf yasağına dair hadisi anlattı."], [923.2, "Dedi ki: Sonra onu yine hazf yaparken gördü ve şöyle dedi:"], [929.0, "\"Sana Resûlullah ﷺ'den hadis anlatıyorum, sen ise hâlâ hazf yapıyorsun!"], [933.5, "Seninle ebediyen konuşmayacağım.\" Caydırma kabîlinden hecr masiyetler meselesinde caiz olduğuna göre, tefsik edici bid'atler babında evleviyetle caizdir."], [943.1, "Bu yüzden İmam Nevevî —Allah Teâlâ ona rahmet etsin— bu hadisten şu faydayı çıkarmış ve şöyle demiştir:"], [950.8, "\"Bu hadiste bid'at ve fısk ehlini hecr etmek vardır.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[964.0, "وقال الإمام أحمد رحمه الله تعالى:"], [967.9, "«ويجب هجرُ من كفر أو فسق ببدعته، أو دعا إلى بدعةٍ مضلّةٍ أو مفسِّقة، على من عجز عن الردّ عليه، أو خاف الاغترار به والتأذّي، دون غيره»."], [983.0, "انتهى كلامه. وسُئل الإمام أحمد رحمه الله تعالى عن رجلٍ له جارٌ رافضيّ:"], [991.1, "أيُسلِّم عليه؟ فقال: «لا، وإن سلّم جارُه عليه فلا يردّ». انتهى كلامه."]], "tr": [[964.0, "İmam Ahmed —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [967.9, "\"Bid'atiyle küfre ya da fıska düşeni veya saptırıcı ya da tefsik edici bir bid'ate davet edeni hecr etmek, ona reddiye vermekten âciz olan ya da ona aldanmaktan ve (ondan) eziyet görmekten korkan kimseye vaciptir;"], [982.2, "başkasına değil.\" Sözü burada bitti."], [984.0, "İmam Ahmed'e —Allah Teâlâ ona rahmet etsin— Râfızî bir komşusu olan adam soruldu:"], [990.4, "Ona selam verir mi? Dedi ki:"], [993.0, "\"Hayır; komşusu ona selam verse de (selamını) almaz.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1001.0, "فإن قلت: وكيف نحمل الأدلة الدالّة على حرمة هجر المسلم للمسلم فوق ثلاث ليال؟"], [1013.0, "فنقول: اعلم أنّ دواعي الهجر تنقسم إلى قسمين:"], [1019.0, "إمّا أن يكون لداعٍ دنيويٍّ محض،"], [1023.0, "وإمّا أن يكون لداعٍ دينيٍّ محض."], [1029.0, "فكلُّ حديثٍ ينهى عن هجر المسلم للمسلم فمحمولٌ على الدواعي الدنيويّة المحضة،"], [1038.0, "وأمّا الأدلة الدالّة على جواز هجر المسلم للمسلم فإنها محمولةٌ على ما إذا كان سبب الهجر أمرًا دينيًّا محضًا."], [1055.0, "وهجرُ المبتدع لا شأن له بالدنيا،"], [1058.0, "وإنما له شأنٌ بالدين."], [1060.0, "فإذا كان الهجر لحظوظ النفس في أمرٍ دنيويٍّ فهو محرّمٌ فوق ثلاث،"], [1066.0, "وأمّا إذا كان الهجر لأمرٍ دينيٍّ فإنه جائز."]], "tr": [[1001.0, "Şayet \"Müslümanın Müslümanı üç geceden fazla terk etmesinin haram olduğuna delâlet eden delilleri neye hamledeceğiz?\" dersen, deriz ki:"], [1015.2, "Bil ki hecrin sebepleri iki kısma ayrılır:"], [1020.3, "Ya salt dünyevî bir sebep içindir ya da salt dinî bir sebep içindir."], [1030.7, "Müslümanın Müslümanı terk etmesini yasaklayan her hadis salt dünyevî sebeplere hamledilir."], [1038.7, "Müslümanın Müslümanı terk etmesinin caiz olduğuna delâlet eden deliller ise hecrin sebebinin salt dinî bir iş olduğu duruma hamledilir."], [1055.5, "Bid'atçiyi hecr etmenin dünyayla bir ilgisi yoktur;"], [1059.0, "onun ilgisi dinledir. Hecr, dünyevî bir işte nefsin payları için olursa üç günden fazlası haramdır;"], [1066.6, "hecr dinî bir iş için olursa caizdir."]]}, {"reader": false, "ar": [[1071.0, "فإن قلت: وما حدُّ الهجر؟"], [1074.1, "فأقول: قد بيّنّاه في آخر الكلّيّة بقولنا:"], [1078.4, "«بقدره»؛ فإنّ الهجر للسبب الدينيّ لا يُحَدّ بيومٍ ولا بيومين،"], [1084.5, "ولا بأقلّ ولا بأكثر،"], [1087.0, "وإنما يُحَدّ بما يوجب تحقيق المصالح الخالصة أو الراجحة،"], [1094.0, "أو يوجب اندفاع المفاسد الخالصة أو الراجحة؛"], [1098.0, "كما هجر النبيّ صلى الله عليه وسلم الثلاثةَ الذين خُلِّفوا خمسين ليلة."], [1106.0, "وهذا لا يُطلب من كلّ أحد،"], [1110.0, "وإنما يُطلب ممّن في هجره تحقيقُ مصلحةٍ خالصةٍ أو راجحة،"], [1117.0, "أو اندفاعُ مفسدةٍ خالصةٍ أو راجحة."]], "tr": [[1071.0, "Şayet \"Hecrin sınırı nedir?\" dersen, derim ki:"], [1074.7, "Bunu külliyenin sonunda \"ölçüsünce\" sözümüzle açıkladık."], [1078.4, "Dinî sebeple yapılan hecr bir günle, iki günle, daha az ya da daha fazlasıyla sınırlanmaz;"], [1086.4, "ancak halis ya da râcih maslahatların gerçekleşmesini veya halis ya da râcih mefsedetlerin def olmasını gerektiren şeyle sınırlanır."], [1098.0, "Nebî ﷺ'in (Tebük'ten) geri kalan üç kişiyi elli gece hecr etmesi gibi."], [1105.3, "Bu herkesten istenmez; sadece hecrinde halis ya da râcih bir maslahatın gerçekleşmesi veya halis ya da râcih bir mefsedetin def olması bulunan kimseden istenir."]]}, {"reader": false, "ar": [[1120.0, "فإن قلت: وبماذا يُهجَر؟"], [1124.0, "الجواب: يُهجَر في عدّة أمور:"], [1126.0, "يُهجَر بترك زيارته، ويُهجَر بترك عيادته إذا مرض،"], [1133.0, "ويُهجَر بترك السلام عليه ابتداءً وردًّا،"], [1140.0, "ويُهجَر بترك إجابة دعوته على وليمته،"], [1146.0, "ويُهجَر بترك إعانته في ظروفه الدنيويّة،"], [1152.0, "ويُهجَر في جنازته أيضًا إذا كان الهجر أزجرَ للغير عن اقتراف فعله،"], [1162.0, "ونحوها من أنواع الهجر المؤثّرة."], [1167.0, "وكلّما كان نوع الهجر أزجرَ،"], [1172.0, "وأدخلَ في تحقيق المطلوب الشرعيّ،"], [1177.0, "كان هو المطلوب، كان هو المطلوب. والله أعلم."]], "tr": [[1120.0, "Şayet \"Ne ile hecr edilir?\" dersen, cevap:"], [1124.4, "Birkaç şeyle hecr edilir: Onu ziyaret etmeyi terk ederek hecr edilir;"], [1128.2, "hastalandığında onu ziyaret etmeyi terk ederek hecr edilir;"], [1133.8, "ona selamı hem ilk olarak vermeyi hem de almayı terk ederek hecr edilir;"], [1143.1, "düğün yemeğine davetine icabet etmeyi terk ederek hecr edilir;"], [1149.8, "dünyevî durumlarında ona yardım etmeyi terk ederek hecr edilir;"], [1155.4, "hecr başkalarını onun yaptığını yapmaktan daha çok caydıracaksa cenazesinde de hecr edilir;"], [1163.6, "ve bunlara benzer etkili hecr türleriyle."], [1167.8, "Hecr türü ne kadar caydırıcı ve şer'î matlubun gerçekleşmesine ne kadar elverişli olursa, istenen o olur;"], [1181.0, "istenen o olur. Allah en iyisini bilir."]]}]}, {"ts": "19:43", "title": "4. Külliye: Bid'atin genel hükümlerine muayyen kişi ancak şartlar sabit olup engeller kalktıktan sonra girer", "paras": [{"reader": false, "ar": [[1183.0, "ومن الكلّيّات أيضًا: <b>كلُّ أحكام البدعة العامّة لا يدخل فيها المعيَّن إلا بعد ثبوت الشروط وانتفاء الموانع.<\/b> كلُّ أحكام البدعة العامّة لا يدخل فيها المعيَّن إلا بعد ثبوت الشروط وانتفاء الموانع."], [1219.0, "أُعيده مرةً أخرى: كلُّ أحكام البدعة العامّة لا يدخل فيها المعيَّن إلا بعد ثبوت الشروط وانتفاء الموانع."]], "tr": [[1183.0, "Külliyelerden biri de şudur: 4."], [1186.5, "külliye: Bid'atin bütün genel hükümlerine muayyen (belirli) kişi ancak şartlar sabit olup engeller ortadan kalktıktan sonra girer. Bid'atin bütün genel hükümlerine muayyen kişi ancak şartlar sabit olup engeller ortadan kalktıktan sonra girer."], [1219.0, "Bir kez daha tekrarlıyorum: Bid'atin bütün genel hükümlerine muayyen kişi ancak şartlar sabit olup engeller ortadan kalktıktan sonra girer."]]}, {"reader": false, "ar": [[1231.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرّر في القواعد عند أهل السنة والجماعة أنّ التبديع بالوصف العامّ لا يستلزم تبديعَ المعيَّن إلا بعد ثبوت الشروط وانتفاء الموانع،"], [1248.0, "كما أنّ التكفير بالوصف العامّ لا يستلزم تكفيرَ المعيَّن إلا بعد ثبوت الشروط وانتفاء الموانع،"], [1256.0, "كما أنّ التفسيق والتضليل بالوصف العامّ لا يستلزم تفسيقَ وتضليلَ المعيَّن إلا بعد ثبوت الشروط وانتفاء الموانع؛"], [1269.1, "لضرورة الفصل بين الحكم على الفعل والفاعل."]], "tr": [[1231.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [1235.2, "Ehl-i Sünnet ve'l-Cemaat'e göre kaidelerde yerleşik olan şudur:"], [1238.9, "Genel vasıfla bid'atçi saymak (tebdî'), şartlar sabit olup engeller ortadan kalkmadıkça muayyen kişiyi bid'atçi saymayı gerektirmez."], [1247.4, "Tıpkı genel vasıfla tekfirin, şartlar sabit olup engeller ortadan kalkmadıkça muayyen kişiyi tekfiri gerektirmemesi gibi."], [1253.9, "Tıpkı genel vasıfla tefsik ve tadlîlin (fâsık ve sapık saymanın), şartlar sabit olup engeller ortadan kalkmadıkça muayyen kişiyi tefsik ve tadlîli gerektirmemesi gibi."], [1268.4, "Bu, fiile hüküm ile fâile hükmü birbirinden ayırmanın zaruretindendir."]]}, {"reader": false, "ar": [[1275.0, "فأهل السنة والجماعة لا يعتقدون تلازمًا ذاتيًّا بين الحكم على الفعل والحكم على الفاعل؛"], [1284.0, "فليس كلُّ من وقع في البدعة بُدِّع،"], [1289.0, "وليس كلُّ من وقع في الكفر كُفِّر،"], [1294.0, "وليس كلُّ من وقع في الفسق والضلال فُسِّق أو ضُلِّل؛"], [1302.0, "بل نُعطي الفعلَ حكمًا على ما يتناسب مع دلالة الدليل،"], [1308.0, "وننتظر بالحكم على الفاعل حتى نتأكّد من ثبوت الشروط وانتفاء الموانع."]], "tr": [[1275.0, "Ehl-i Sünnet ve'l-Cemaat, fiile hüküm ile fâile hüküm arasında zâtî bir telâzum (birbirini zorunlu kılma) olduğuna inanmaz."], [1285.4, "Bid'ate düşen herkes bid'atçi sayılmaz;"], [1289.0, "küfre düşen herkes tekfir edilmez;"], [1292.6, "fıska ve dalâlete düşen herkes fâsık ya da sapık sayılmaz."], [1299.6, "Bilakis fiile, delilin delâletine uygun düşen hükmü veririz;"], [1305.6, "fâile hüküm vermeyi ise şartların sabit olduğundan ve engellerin ortadan kalktığından emin oluncaya kadar bekletiriz."]]}]}, {"ts": "21:55", "title": "4. Külliye (devam): Şartlar ve engeller", "paras": [{"reader": false, "ar": [[1315.0, "والتي أوّلها العقل؛ فإنه شرط،"], [1318.6, "وضدّه الجنون فإنه مانع."], [1328.0, "وبناءً على اشتراط العقل:"], [1330.3, "فإذا كان الذي وقع في البدعة ـ قولًا أو عملًا ـ مجنونًا،"], [1336.0, "فإننا لا نحكم عليه بمقتضى بدعته؛"], [1340.1, "لفوات شرط العقل ووجود مانع الجنون."], [1347.0, "ومنها البلوغ؛ فإنه شرط،"], [1349.9, "وضدّه الصغر فإنه مانع."], [1358.0, "وبناءً على اشتراط هذا الشرط:"], [1362.0, "فإذا كان الذي وقع في البدعة ـ قولًا أو عملًا ـ صغيرًا لم يبلغ بعد،"], [1368.0, "فإننا لا نحكم عليه بمقتضى بدعته."]], "tr": [[1315.0, "Bunların ilki akıldır: O bir şarttır;"], [1318.6, "zıddı olan delilik ise bir engeldir."], [1328.6, "Aklın şart koşulmasına göre: Sözle ya da amelle bid'ate düşen kişi deli ise, akıl şartı bulunmadığı ve delilik engeli var olduğu için onun hakkında bid'atinin gereğiyle hüküm vermeyiz."], [1343.5, "Bunlardan biri de bulûğdur: O bir şarttır;"], [1350.6, "zıddı olan küçüklük ise bir engeldir."], [1360.4, "Bu şartın şart koşulmasına göre:"], [1362.9, "Sözle ya da amelle bid'ate düşen kişi henüz bulûğa ermemiş küçük biri ise, onun hakkında bid'atinin gereğiyle hüküm vermeyiz."]]}, {"reader": false, "ar": [[1374.0, "ومنها العلم؛ فإنه شرط،"], [1376.9, "وضدّه الجهل وهو مانع."], [1384.0, "وبناءً على اشتراط العلم:"], [1386.7, "فإذا كان الذي وقع في البدعة جاهلًا ومثلُه يجهل،"], [1393.0, "فلا نحكم عليه بمقتضى بدعته."], [1397.0, "ومنها الاختيار؛ فإنه شرط،"], [1399.9, "وضدّه الإكراه وهو مانع."], [1407.0, "وبناءً على اشتراط هذا الشرط:"], [1410.2, "فإذا كان الذي وقع في البدعة وقع فيها مُكرَهًا،"], [1415.9, "غيرَ مريدٍ لها ولا مختارٍ لفعلها،"], [1419.8, "فإننا لا نحكم عليه بمقتضى بدعته."]], "tr": [[1374.0, "Bunlardan biri de ilimdir: O bir şarttır;"], [1377.6, "zıddı olan cehalet ise bir engeldir."], [1385.4, "İlmin şart koşulmasına göre: Bid'ate düşen kişi cahilse ve onun gibisi (bunu) bilmeyebilecek biriyse, onun hakkında bid'atinin gereğiyle hüküm vermeyiz."], [1397.7, "Bunlardan biri de ihtiyardır (kendi seçimiyle yapmak):"], [1402.1, "O bir şarttır; zıddı olan ikrah (zorlama) ise bir engeldir."], [1411.5, "Bu şartın şart koşulmasına göre:"], [1414.0, "Bid'ate düşen kişi ona zorlanarak, onu istemeden ve yapmayı seçmeden düştüyse, onun hakkında bid'atinin gereğiyle hüküm vermeyiz."]]}, {"reader": false, "ar": [[1424.0, "ومنها القصد، وضدّه الخطأ؛"], [1430.0, "فالقصد شرط، والخطأ مانع."], [1436.0, "وبناءً على اشتراط القصد:"], [1439.0, "فإذا كان الذي وقع في البدعة وقع فيها مخطئًا غيرَ قاصدٍ للوقوع فيها،"], [1447.0, "فإننا لا نحكم عليه بمقتضى بدعته."]], "tr": [[1424.0, "Bunlardan biri de kasıttır; zıddı hatadır."], [1430.8, "Kasıt bir şart, hata ise bir engeldir."], [1439.0, "Kastın şart koşulmasına göre: Bid'ate düşen kişi ona hata ederek, ona düşmeyi kastetmeden düştüyse, onun hakkında bid'atinin gereğiyle hüküm vermeyiz."]]}, {"reader": false, "ar": [[1452.0, "ومنها ـ وهو أوسعها، والحمد لله على أن قرّره أهل السنة؛"], [1461.0, "لأنّ العذر أحبُّ إلينا من الحكم على المعيَّن ـ وهو:"], [1467.8, "عدمُ الشبهة والتأويل؛ فإنه شرط،"], [1472.5, "وضدّه وجودُ الشبهة والتأويل."], [1478.0, "وبناءً على اشتراطها: فإذا كان الذي وقع في البدعة متأوِّلًا،"], [1486.0, "أو وقع فيها بناءً على شبهةٍ عرضت له،"], [1490.0, "فإننا نتوقّف عن تبديعه حتى تُكشف شبهتُه وينكسر تأويلُه،"], [1504.0, "فإن عرف وأصرّ حُكم عليه بمقتضى بدعته."], [1511.0, "وهذا أوسعُ عذرٍ ـ أو أوسعُ شرطٍ ـ عند أهل السنة والجماعة، يعذرون فيه مخالفيهم."]], "tr": [[1452.0, "Bunlardan biri de —ki en genişi budur;"], [1457.4, "Ehl-i Sünnet'in bunu takrir etmesinden dolayı Allah'a hamd olsun;"], [1462.5, "çünkü mazur görmek bize muayyen kişi hakkında hüküm vermekten daha sevimlidir— şüphe ve te'vilin bulunmamasıdır."], [1471.8, "O bir şarttır; zıddı şüphe ve te'vilin bulunmasıdır."], [1478.9, "Bunun şart koşulmasına göre: Bid'ate düşen kişi te'vil eden biriyse ya da kendisine arız olan bir şüpheye dayanarak ona düştüyse, şüphesi giderilip te'vili kırılıncaya kadar onu bid'atçi saymaktan kaçınırız."], [1493.6, "Eğer (hakkı) öğrenir ve (yine de) ısrar ederse, hakkında bid'atinin gereğiyle hüküm verilir."], [1508.5, "Bu, Ehl-i Sünnet ve'l-Cemaat nezdinde en geniş mazeret —ya da en geniş şart— olup onunla muhaliflerini mazur görürler."]]}]}, {"ts": "25:21", "title": "4. Külliye (devam): Genel vasfı muayyen kişiye uygulamaktan sakınmak", "paras": [{"reader": false, "ar": [[1521.0, "فمتى ما رأيت أهل السنة يكفّرون صاحب بدعةٍ بالوصف العامّ،"], [1528.0, "فإيّاك أن تأتي بهذا الوصف العامّ ثمّ تنزّله على المعيَّن،"], [1536.0, "إلا بعد أن تتأكّد بيقينٍ بأنّ هذا المعيَّن قد توفّرت فيه شروطُ تبديع العين،"], [1544.0, "وانتفت موانعه؛ فإن تأكّدتَ فتوكّل على الله،"], [1551.0, "وإن حصل لك شيءٌ من الريب أو الشكّ أو التردّد،"], [1557.0, "فإننا نُبقي المعيَّن على الأصل المتقرّر فيه، وهو الإسلام والسنة."]], "tr": [[1521.0, "Ehl-i Sünnet'in bir bid'at sahibini genel vasıfla tekfir ettiğini gördüğünde, sakın bu genel vasfı alıp muayyen kişiye uygulama;"], [1532.9, "ancak bu muayyen kişide kişiyi bid'atçi saymanın şartlarının bulunduğundan ve engellerinin ortadan kalktığından kesin olarak emin olduktan sonra (uygulayabilirsin)."], [1545.1, "Emin olduysan Allah'a tevekkül et."], [1550.2, "Sende bir kuşku, şüphe ya da tereddüt meydana gelirse, muayyen kişiyi onda yerleşik olan asıl üzere, yani İslam ve sünnet üzere bırakırız."]]}, {"reader": false, "ar": [[1563.0, "فكلُّ من ثبت إسلامه بيقينٍ فلا يجوز إخراجه عن دائرة الإسلام إلا بيقين،"], [1572.0, "وكلُّ من ثبت اتّباعه للسنة بيقينٍ فلا يجوز إخراجه من دائرة السنة إلى دائرة البدعة إلا بيقين."], [1583.0, "ونتعامل مع هذا الصنف بردّ خطئه وتأويله،"], [1587.8, "وبالسكوت عن شخصه وعينه."], [1592.0, "ولا أريد أن أضرب أمثلةً للعلم بها."]], "tr": [[1563.0, "İslam'ı kesin olarak sabit olan herkesi, ancak kesin bir şeyle İslam dairesinden çıkarmak caiz olur."], [1572.0, "Sünnete tâbi olduğu kesin olarak sabit olan herkesi, ancak kesin bir şeyle sünnet dairesinden bid'at dairesine çıkarmak caiz olur."], [1583.0, "Bu sınıfa, hatasını ve te'vilini reddederek ve şahsı ve kendisi hakkında susarak muamele ederiz."], [1592.7, "(Bunlar) bilindiği için örnek vermek istemiyorum."]]}, {"reader": false, "ar": [[1598.0, "فإذا رأيت أهل السنة يقولون:"], [1600.7, "«من قال بخلق القرآن فقد كفر»،"], [1604.0, "فإيّاك أن تُدخل أحدًا بعينه في هذا العموم إلا بعد أن تتأكّد من ثبوت الشروط وانتفاء الموانع."], [1616.0, "وإذا سمعت أهل السنة يقولون:"], [1619.4, "«من حرّف صفةً من صفات الله فهو جهميّ»،"], [1625.0, "فإيّاك أن تُدخل من حرّف شيئًا بعينه في هذا الوصف العامّ إلا بعد أن تتأكّد من ثبوت الشروط وانتفاء الموانع."], [1635.0, "وإذا رأيت أهل السنة يقولون:"], [1638.4, "«من عطّل الله عن شيءٍ من صفاته فمبتدع»،"], [1645.0, "فإيّاك أن تُدخل معطِّلًا بعينه في هذا العموم إلا بعد أن تتأكّد من ثبوت الشروط في حقّه وانتفاء الموانع."]], "tr": [[1598.0, "Ehl-i Sünnet'in \"Kur'an'ın mahlûk olduğunu söyleyen kâfir olur\" dediğini gördüğünde, şartların sabit olduğundan ve engellerin ortadan kalktığından emin olmadıkça sakın belirli bir kişiyi bu umuma dahil etme."], [1614.5, "Ehl-i Sünnet'in \"Allah'ın sıfatlarından bir sıfatı tahrif eden Cehmî'dir\" dediğini işittiğinde, şartların sabit olduğundan ve engellerin ortadan kalktığından emin olmadıkça sakın (bir sıfattan) bir şeyi tahrif eden belirli bir kişiyi bu genel vasfa dahil etme."], [1635.7, "Ehl-i Sünnet'in \"Allah'ı sıfatlarından bir şeyden ta'til eden bid'atçidir\" dediğini gördüğünde, onun hakkında şartların sabit olduğundan ve engellerin ortadan kalktığından emin olmadıkça sakın belirli bir muattılı bu umuma dahil etme."]]}, {"reader": false, "ar": [[1655.0, "وإلا فيكفيك أن تردّ تعطيله وبدعته،"], [1659.0, "ولا تتعرّض لعينه بتبديعٍ،"], [1661.6, "ولا بتكفيرٍ، ولا بتفسيقٍ،"], [1664.3, "ولا بتضليل؛ لأنك لم تتأكّد من ثبوت الشروط في حقّه ومن انتفاء الموانع."]], "tr": [[1655.0, "Aksi takdirde onun ta'tilini ve bid'atini reddetmen sana yeter;"], [1659.6, "kendisine ne bid'atçi, ne kâfir, ne fâsık ne de sapık diyerek ilişme."], [1672.6, "Çünkü onun hakkında şartların sabit olduğundan ve engellerin ortadan kalktığından emin olmadın."]]}]}, {"ts": "27:59", "title": "4. Külliye (devam): Selefin genel sözlerini muayyen kişilere uygulama hatası ve talebeye tavsiye", "paras": [{"reader": false, "ar": [[1679.0, "وإنّ من أعظم الخطأ في فهم كلام السلف الأوائل:"], [1684.0, "أن يأتي طالب العلم الذي لم يتأصّل على كتب السلف المتأخّرين،"], [1692.0, "فيحمل قول السلف الأوائل العامّ،"], [1698.0, "ثمّ يبدأ يلتفت يمينًا وشمالًا باحثًا عن الأعيان،"], [1703.0, "ليطبّق عليهم هذا القول العامّ،"], [1706.5, "غيرَ مراعٍ في هذا التطبيق ثبوتَ الشروط وانتفاءَ الموانع."], [1713.0, "وإنّ ما نسمعه في وسائل التواصل من تبديع كثيرٍ من أهل العلم ـ ممّن لا يُعرف تبديعُهم عن أحدٍ من أهل السنة من معاصريهم،"], [1725.0, "ولا ممّن جاء بعدهم ـ (ما هو) إلا وسببُه تنزيلُ كلام السلف العامّ في التكفير والتبديع والتضليل والتفسيق على المعيَّن."]], "tr": [[1679.0, "İlk selefin sözünü anlamadaki en büyük hatalardan biri şudur:"], [1684.0, "Müteahhir selefin kitapları üzerinde usûl edinmemiş bir talebe gelir, ilk selefin genel sözünü alır, sonra o genel sözü uygulamak için sağa sola bakıp şahıslar aramaya başlar;"], [1704.4, "bu uygulamada şartların sabit olmasını ve engellerin ortadan kalkmasını gözetmez."], [1712.3, "Sosyal medyada işittiğimiz, birçok ilim ehlinin —ki ne çağdaşı olan ne de onlardan sonra gelen Ehl-i Sünnet'ten hiç kimseden onları bid'atçi saydığı bilinmeyen kimselerin— bid'atçi sayılması(nın) sebebi, selefin tekfir, tebdî', tadlîl ve tefsik konusundaki genel sözlerini muayyen kişiye uygulamaktan başka bir şey değildir."]]}, {"reader": false, "ar": [[1738.0, "ولذلك فإنّ وصيّتي لطلّاب العلم ـ في كلّ زمانٍ،"], [1742.8, "وفي أيّ مكانٍ، في حياتي وبعد موتي ـ ألّا يدخل المبتدئ في كتب السلف المنقولة بالإسناد أوّلًا،"], [1754.0, "بل لا بدّ وأن يتربّى على قواعد السلفيّة عند المتأخّرين،"], [1760.0, "ليطبّق تلك القواعد على كلام السلف المتقدّمين،"], [1765.0, "والتي من أهمّها: وجوبُ التفريق بين الحكم على الوصف والحكم على العين."], [1776.0, "فأعظمُ الظلم في حقّ المعيَّن الخلطُ بين الوصف العامّ والوصف الخاصّ."]], "tr": [[1738.0, "Bu yüzden ilim talebelerine —her zamanda, her mekânda, hayatımda ve ölümümden sonra— tavsiyem şudur:"], [1746.4, "Yeni başlayan, isnadla nakledilmiş selef kitaplarına ilk önce girmesin."], [1753.3, "Bilakis müteahhirîn nezdindeki selefî kaidelerle yetişmeli ki o kaideleri mütekaddim selefin sözlerine uygulayabilsin."], [1761.4, "Bu kaidelerin en önemlilerinden biri, vasfa hüküm ile şahsa hükmü birbirinden ayırmanın vacip olmasıdır."], [1771.2, "Muayyen kişi hakkındaki en büyük zulüm, genel vasıf ile özel vasfı birbirine karıştırmaktır."]]}, {"reader": false, "ar": [[1784.0, "ولذلك ينبغي للطالب أن يتمرّس أوّلًا على فهم كلام السلف بالمرقاة الأولى،"], [1793.0, "وهي كلام السلف المتأخّرين؛"], [1799.0, "كالإمام ابن تيمية رحمه الله،"], [1801.1, "فإنّ له أصولًا وقواعد في فهم كلام السلف المتقدّمين،"], [1805.0, "وكالإمام ابن القيّم رحمه الله،"], [1808.5, "وكالإمام الذهبيّ، وكالإمام ابن كثير،"], [1812.0, "وكأئمّة الدعوة، وغيرهم كثيرٌ ممّن جاؤوا قبلهم،"], [1815.7, "وممّن جاؤوا ـ ممّن كانوا قبلهم وممّن جاؤوا بعدهم."]], "tr": [[1784.0, "Bu yüzden talebenin önce selefin sözünü anlamada ilk basamakla, yani müteahhir selefin sözüyle pişmesi gerekir."], [1793.8, "İmam İbn Teymiyye —Allah ona rahmet etsin— gibi;"], [1800.7, "onun mütekaddim selefin sözünü anlamada usûlleri ve kaideleri vardır."], [1804.1, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin—, İmam Zehebî, İmam İbn Kesîr ve Davet imamları gibi;"], [1813.1, "ve onlardan önce gelenlerden, onlardan önce olanlardan ve onlardan sonra gelenlerden daha birçokları gibi."]]}]}, {"ts": "30:20", "title": "4. Külliye (devam): Selef kitaplarına doğrudan atlamanın hatası", "paras": [{"reader": false, "ar": [[1820.0, "ولا سيّما بأنّ كثيرًا من إطلاقات التبديع والتكفير عند السلف إنما هي محمولةٌ على من بدعتُه بدعةُ أصالةٍ ومنهج،"], [1837.0, "لا بدعةُ خطأٍ عارض."], [1838.9, "ولا سيّما وأنّ كثيرًا من كلام السلف يوجد في بعضه تناقض؛"], [1848.0, "فإذا لم تتمرّس على القواعد التي بها تجمع بين ما ظاهره التعارض من كلام السلف،"], [1856.0, "فإنّ ذلك سوف يوقعك في إيش؟"], [1859.0, "في اتّهام السلف بالتناقض في الأحكام."]], "tr": [[1820.0, "Özellikle de selef nezdindeki tebdî' ve tekfir ifadelerinin birçoğu, bid'ati asıl ve menhec bid'ati olan kimseye hamledilir;"], [1837.0, "arızî bir hata bid'ati olana değil."], [1840.4, "Özellikle de selefin sözlerinin birçoğunun bir kısmında (görünüşte) çelişki bulunur."], [1850.5, "Selefin sözlerinden zahiren birbirine aykırı görüneni bağdaştırdığın kaidelerle pişmezsen, bu seni neye düşürür?"], [1858.0, "Selefi hükümlerde çelişkiye düşmekle itham etmeye."]]}, {"reader": false, "ar": [[1861.0, "فمن الغلط الواضح أن يبدأ طالب العلم في دراسة العقيدة بالقفز إلى كتب السلف،"], [1875.0, "فيقرأ في أوّل ما يقرأ:"], [1878.3, "اعتقادَ ـ مثلًا ـ كتابَ «السنة» للإمام عبد الله بن الإمام أحمد رحمه الله،"], [1886.0, "أو يقرأ كتاب «السنة» للخلّال،"], [1888.5, "أو يقرأ كتاب «السنة» لابن أبي عاصم،"], [1892.0, "أو يقرأ كتاب اللالكائيّ؛"], [1895.0, "فهذا من الغلط. لماذا؟"], [1897.7, "لأنك سوف تمرّ على أقوالٍ عامّة،"], [1902.0, "أو يُراد بها جهاتٌ خاصّة،"], [1905.0, "وستمرّ على كلامٍ فيه شيءٌ ممّا يحتاج إلى التوفيق والجمع."], [1911.0, "فلا بدّ أن تتمرّس على كتب السلف المتأخّرين قبل أن تقفز هذه القفزة العظيمة."], [1919.0, "وإنّ الربّانيَّ من العلماء هو الذي يربّي الناس على صغار العلم قبل كباره. والله أعلم."]], "tr": [[1861.0, "Talebenin akîde tahsiline selefin kitaplarına atlayarak başlaması apaçık bir hatadır:"], [1868.4, "İlk okuduğu şey olarak mesela İmam Ahmed'in oğlu İmam Abdullah'ın —Allah ona rahmet etsin— \"es-Sünne\" kitabındaki itikadı okur;"], [1886.5, "ya da Hallâl'in \"es-Sünne\"sini, İbn Ebî Âsım'ın \"es-Sünne\"sini ya da Lâlekâî'nin kitabını okur."], [1895.7, "Bu hatadır. Neden? Çünkü genel sözlerle ya da özel kesimlerin kastedildiği sözlerle karşılaşacaksın;"], [1905.6, "uzlaştırma ve bağdaştırma gerektiren bir şey içeren sözlerle karşılaşacaksın."], [1911.5, "Bu büyük sıçramayı yapmadan önce müteahhir selefin kitaplarıyla pişmen gerekir."], [1918.3, "Âlimlerden rabbânî olan, insanları ilmin büyüklerinden önce küçükleriyle yetiştirendir. Allah en iyisini bilir."]]}]}, {"ts": "32:11", "title": "5. Külliye: Çıkış noktaları sağlam olan kişiye arızî bir ictihad hatası sebebiyle şahsen hüküm verilmez", "paras": [{"reader": false, "ar": [[1931.0, "ومن الكلّيّات أيضًا: <b>كلُّ من كانت منطلقاته صحيحةً فلا يُحكم على عينه بخطأٍ عارضٍ اجتهادًا.<\/b> كلُّ من كانت منطلقاته صحيحةً فلا يُحكم على عينه بخطأٍ عارضٍ اجتهادًا."], [1960.0, "كلُّ من كانت منطلقاته صحيحةً فلا يُحكم على عينه بخطأٍ عارضٍ اجتهادًا. واضحٌ كلامي؟"]], "tr": [[1931.0, "Külliyelerden biri de şudur: 5."], [1933.2, "külliye: Çıkış noktaları (menhec ve usûlü) sağlam olan herkese, ictihad yoluyla (düştüğü) arızî bir hata sebebiyle şahsen hüküm verilmez. Çıkış noktaları sağlam olan herkese, ictihad yoluyla arızî bir hata sebebiyle şahsen hüküm verilmez."], [1960.8, "Çıkış noktaları sağlam olan herkese, ictihad yoluyla arızî bir hata sebebiyle şahsen hüküm verilmez. Sözüm açık mı?"]]}, {"reader": false, "ar": [[1978.0, "أقول وبالله التوفيق: وذلك لأنّ الإنسان ـ وذلك لأنّ العدل يقضي أنّ الحكم على آنِيَّة الشخص فرعٌ عن النظر في منطلقاته وأصوله وقواعده ومنهجه؛"], [1995.0, "ففرقانٌ بين من يكون خطؤه عارضًا عن منطلقٍ صحيح،"], [2003.0, "وبين من يكون خطؤه أصيلًا عن منطلقٍ فاسد،"], [2009.0, "والتسويةُ بينهما تسويةٌ بين مختلفين،"], [2014.0, "والمتقرّر في القواعد أنّ الشريعة جاءت بالتفريق بين المختلفات، وبالجمع بين المتماثلات."]], "tr": [[1978.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [1982.7, "İnsan... Bu şundandır: Adalet şunu gerektirir:"], [1986.5, "Kişinin şahsına hüküm vermek, onun çıkış noktalarına, usûllerine, kaidelerine ve menhecine bakmanın bir fer'idir."], [1992.8, "Hatası sağlam bir çıkış noktasından kaynaklanan arızî bir hata olan ile hatası bozuk bir çıkış noktasından kaynaklanan köklü bir hata olan arasında büyük fark vardır."], [2007.3, "İkisini eşit tutmak, birbirinden farklı iki şeyi eşit tutmaktır."], [2014.0, "Kaidelerde yerleşik olan şudur: Şeriat, birbirinden farklı olanları ayırmak ve birbirine benzeyenleri birleştirmek üzere gelmiştir."]]}, {"reader": false, "ar": [[2023.0, "ولذلك قال الله عز وجل لنبيّه صلى الله عليه وسلم:"], [2031.0, "<span class=\"ayah\">﴿فَإِن رَّجَعَكَ اللَّهُ إِلَىٰ طَائِفَةٍ مِّنْهُمْ فَاسْتَأْذَنُوكَ لِلْخُرُوجِ فَقُل لَّن تَخْرُجُوا مَعِيَ أَبَدًا وَلَن تُقَاتِلُوا مَعِيَ عَدُوًّا ۖ إِنَّكُمْ رَضِيتُم بِالْقُعُودِ أَوَّلَ مَرَّةٍ﴾<\/span> <span class=\"ref\">[التوبة: ٨٣]<\/span> <span class=\"note\">(Şeyh «لِلْخُرُوجِ» yerine «بالخروج» diyor)<\/span>،"], [2044.0, "فحكم على آنِيَّتهم بحرمانهم من الخروج للجهاد،"], [2049.0, "معلِّلًا ذلك بفساد منطلقاتهم، بفساد منطلقاتهم."]], "tr": [[2023.0, "Bu yüzden Allah Azze ve Celle Nebîsi ﷺ'e şöyle buyurdu:"], [2027.2, "<span class=\"ayah\">﴿Eğer Allah seni onlardan bir topluluğun yanına döndürür de (başka bir savaşa) çıkmak için senden izin isterlerse de ki: Benimle birlikte asla çıkmayacaksınız ve benimle birlikte hiçbir düşmanla savaşmayacaksınız. Çünkü siz ilk defasında oturmaya razı oldunuz﴾<\/span> [Tevbe 83]."], [2044.0, "Böylece onların şahıslarına cihada çıkmaktan mahrum kalma hükmü verdi ve bunu çıkış noktalarının bozukluğuyla gerekçelendirdi; çıkış noktalarının bozukluğuyla."]]}, {"reader": false, "ar": [[2056.0, "وكان رجلٌ يُضحك رسولَ الله صلى الله عليه وسلم،"], [2062.0, "وكان كثيرًا ما يُؤتى به شاربًا للخمر فيُجلَد،"], [2067.0, "وفي بعض المرّات سبّه رجلٌ من الصحابة،"], [2073.0, "فقال النبيّ صلى الله عليه وسلم:"], [2076.0, "«لا تلعنه، فإني لا أعلم إلا أنه يحبّ الله ورسوله»."], [2082.0, "فلمّا كان خطؤه خطأً عارضًا عن دينٍ وإيمانٍ صحيح،"], [2088.0, "نهى النبيّ صلى الله عليه وسلم أن يُجعل ذلك الخطأ سببًا للعنه وسبّه وكثرة التثريب عليه،"], [2099.0, "وإنما يُكتفى بإقامة حدّ الله عز وجل عليه،"], [2102.1, "بلا زيادة لعنٍ ولا سبّ."]], "tr": [[2056.0, "Resûlullah ﷺ'i güldüren bir adam vardı;"], [2060.0, "çoğu zaman içki içmiş olarak getirilir ve celde vurulurdu."], [2065.8, "Bir seferinde sahâbeden bir adam ona sövdü."], [2070.7, "Nebî ﷺ şöyle buyurdu: \"Ona lanet etme;"], [2075.5, "çünkü ben onun ancak Allah'ı ve Resûlü'nü sevdiğini biliyorum.\" Onun hatası sahih bir din ve imandan kaynaklanan arızî bir hata olunca, Nebî ﷺ bu hatanın ona lanet etmeye, sövmeye ve onu çokça kınamaya sebep kılınmasını yasakladı;"], [2099.0, "ona lanet ve sövme eklenmeksizin sadece Allah Azze ve Celle'nin haddinin uygulanmasıyla yetinilir."]]}]}, {"ts": "35:04", "title": "5. Külliye (devam): Hâlid b. Velîd ve Üsâme b. Zeyd örnekleri", "paras": [{"reader": false, "ar": [[2104.1, "فنفى النبيّ صلى الله عليه وسلم السبَّ عن الآنِيَّة <span class=\"q\">؟ 35:04<\/span> لسلامة منطلقات هذا الرجل،"], [2115.0, "في قوله: «إني لا أعلم إلا أنه يحبّ الله ورسوله»."], [2120.0, "فمن العدل أن يُعامَل صاحب الخطأ العارض والمنطلق السليم محاسبةً خاصّة."]], "tr": [[2104.1, "Nebî ﷺ, bu adamın çıkış noktalarının sağlam olması sebebiyle \"Ben onun ancak Allah'ı ve Resûlü'nü sevdiğini biliyorum\" sözüyle şahsına sövmeyi nefyetti <span class=\"q\">؟<\/span>."], [2118.5, "Arızî hata ve sağlam çıkış noktası sahibine özel bir hesaba çekme ile muamele edilmesi adalettendir."]]}, {"reader": false, "ar": [[2130.0, "ولمّا حصل من خالد بن الوليد ما حصل مع بني جَذيمة،"], [2136.0, "وأنهم أرادوا أن يقولوا:"], [2138.8, "أسلمنا، فأخطؤوا فقالوا: صبأنا،"], [2141.7, "فقتلهم؛ فلمّا بلغ الخبر إلى النبيّ صلى الله عليه وسلم قال:"], [2148.7, "«اللهمّ إني أبرأ إليك ممّا فعل خالد»."], [2154.0, "ولكنّ النبيّ صلى الله عليه وسلم لم يجعل خطأ خالدٍ العارض سببًا لتغريمه الدية،"], [2162.2, "ولا لعزله عن رئاسة الجند؛"], [2167.0, "ممّا يدلّ على أنّ صاحب المنطلقات السليمة لا بدّ أن تُعامَل أخطاؤه بمعاملةٍ خاصّة."]], "tr": [[2130.0, "Hâlid b. Velîd'den Benî Cezîme ile ilgili olarak olan şey olduğunda —onlar \"Müslüman olduk (eslemnâ)\" demek istemiş, fakat hata edip \"Dinimizi değiştirdik (sabe'nâ)\" demişlerdi;"], [2145.3, "o da onları öldürmüştü— haber Nebî ﷺ'e ulaşınca şöyle buyurdu:"], [2150.9, "\"Allah'ım! Hâlid'in yaptığından sana beri olurum.\" Fakat Nebî ﷺ Hâlid'in arızî hatasını, ona diyet ödetmeye ya da onu ordu komutanlığından azletmeye sebep kılmadı."], [2167.0, "Bu da çıkış noktaları sağlam olan kimsenin hatalarına özel bir muamele yapılması gerektiğini gösterir."]]}, {"reader": false, "ar": [[2178.0, "ولمّا قتل أسامة بن زيدٍ ذلك الرجل بعد أن قال:"], [2183.7, "لا إله إلا الله،"], [2186.0, "أنكر عليه النبيّ صلى الله عليه وسلم إنكارًا مغلَّظًا بقوله:"], [2191.0, "«كيف تصنع بلا إله إلا الله إذا جاءت يوم القيامة؟»،"], [2196.0, "ولكنّه عقد له لواءَ آخرِ جيشٍ في حياة النبيّ صلى الله عليه وسلم،"], [2202.0, "وخلفه كبارُ الصحابة. والأمثلة على ذلك كثيرة."]], "tr": [[2178.0, "Üsâme b. Zeyd o adamı \"Lâ ilâhe illallah\" dedikten sonra öldürünce, Nebî ﷺ \"Kıyamet günü Lâ ilâhe illallah geldiğinde ona ne yapacaksın?\" sözüyle ona sert bir şekilde karşı çıktı."], [2196.0, "Fakat Nebî ﷺ'in hayatındaki son ordunun sancağını ona bağladı;"], [2200.6, "sahâbenin büyükleri de onun arkasındaydı. Bunun örnekleri çoktur."]]}, {"reader": false, "ar": [[2211.0, "فلا يجوز لإنسانٍ أن يعمد إلى عالمٍ من العلماء منطلقاته صحيحة،"], [2218.0, "ولكن وقع في شيءٍ من الأخطاء العارضة وقوعَ شبهةٍ وتأويلٍ واجتهاد،"], [2224.0, "ثمّ يُثرّب عليه تثريبَ من وقع في الخطأ عن منطلقٍ فاسد؛"], [2230.0, "فهذا ـ والله ـ من الجور وعدم العدل،"], [2235.0, "ومن سوء التأصيل في نقد الأشخاص."]], "tr": [[2211.0, "Bir insanın, çıkış noktaları sağlam olan, fakat şüphe, te'vil ve ictihad yoluyla bazı arızî hatalara düşmüş âlimlerden birine yönelip onu, bozuk bir çıkış noktasından hataya düşen kimsenin kınandığı gibi kınaması caiz değildir."], [2230.0, "Bu —vallahi— zulüm ve adaletsizliktendir;"], [2233.8, "şahısları eleştirmede kötü bir usûl edinmektendir."]]}, {"reader": false, "ar": [[2239.0, "فمن أراد منّا أن نحاكم أخطاء النوويّ رحمه الله كما نحاكم أخطاء الجهم بن صفوان،"], [2248.8, "فإنّ هذا يدعونا إلى الظلم في النقد."], [2252.0, "ومن أراد منّا أن نحاسب أخطاء ابن حجرٍ رحمه الله كأخطاء واصل بن عطاء،"], [2259.8, "فإنه يدعونا إلى الظلم وإلى الجور."], [2265.0, "ومن أراد منّا أن نعامل أخطاء ابن الجوزيّ ـ مثلًا ـ أو السيوطيّ ـ رحم الله الجميع رحمةً واسعة ـ كما نعامل أخطاء بشرٍ المريسيّ والجعد بن درهم،"], [2281.0, "فإنه يدعونا في هذه الحالة إلى الظلم والعدوان."]], "tr": [[2239.0, "Bizden Nevevî'nin —Allah ona rahmet etsin— hatalarını Cehm b."], [2246.0, "Safvân'ın hatalarını yargıladığımız gibi yargılamamızı isteyen, bizi eleştiride zulme çağırmaktadır."], [2250.6, "Bizden İbn Hacer'in —Allah ona rahmet etsin— hatalarını Vâsıl b."], [2255.5, "Atâ'nın hataları gibi hesaba çekmemizi isteyen, bizi zulme ve haksızlığa çağırmaktadır."], [2262.6, "Bizden mesela İbnü'l-Cevzî'nin ya da Suyûtî'nin —Allah hepsine geniş rahmetiyle rahmet etsin— hatalarına, Bişr el-Merîsî'nin ve Ca'd b."], [2276.0, "Dirhem'in hatalarına muamele ettiğimiz gibi muamele etmemizi isteyen, bu durumda bizi zulme ve düşmanlığa çağırmaktadır."]]}, {"reader": false, "ar": [[2286.0, "ولذلك لا نعلم عالمًا جاء بعد هؤلاء العلماء،"], [2291.1, "أو عاصرهم، أنه كفّرهم بسبب أخطائهم العارضة،"], [2295.5, "أو فسّقهم، أو ضلّلهم،"], [2298.1, "أو أثّمهم، أو أخرجهم عن دائرة السنة بمثل هذه الأخطاء؛"], [2309.0, "حتى جاء الصبيانُ لا يعرفون قواعد العلم،"], [2313.6, "ولا أصول النقد، ولا العدل عند أهل السنة والجماعة،"], [2320.0, "ووقعوا في هؤلاء الأئمة الأجلّاء تبديعًا وتكفيرًا وتفسيقًا وتضليلًا."]], "tr": [[2286.0, "Bu yüzden bu âlimlerden sonra gelen ya da onlarla çağdaş olan hiçbir âlimin, onları arızî hataları sebebiyle tekfir ettiğini, fâsık, sapık ya da günahkâr saydığını veya bu tür hatalarla onları sünnet dairesinden çıkardığını bilmiyoruz."], [2309.7, "Ta ki ilmin kaidelerini, eleştirinin usûllerini ve Ehl-i Sünnet ve'l-Cemaat nezdindeki adaleti bilmeyen çocuklar gelip bu yüce imamlara bid'atçi, kâfir, fâsık ve sapık diyerek dil uzatıncaya kadar."]]}, {"reader": false, "ar": [[2326.0, "وإلا فأهل السنة متّفقون على أنّ صاحب المنطلق الصحيح والخطأ العارض لا يُعامَل ـ لا يُعامَل معاملةَ صاحب المنطلق الفاسد ذي الأخطاء الدائمة الأصيلة."], [2346.0, "وإنّ أغلب النصوص العامّة عند أهل السنة والجماعة من السلف الأوائل،"], [2355.0, "التي تتضمّن تبديعًا على بدعة،"], [2358.4, "أو تفسيقًا على فسق،"], [2361.1, "أو تكفيرًا على كفر،"], [2364.0, "إنما يُراد بها من كانت منطلقاته بدعيّةً فاسدة؛"], [2369.0, "فهذا هو الذي يُغلَّظ عليه."]], "tr": [[2326.0, "Yoksa Ehl-i Sünnet, sağlam çıkış noktası ve arızî hata sahibine, sürekli ve köklü hataları olan bozuk çıkış noktası sahibine muamele edildiği gibi muamele edilmeyeceğinde ittifak etmiştir."], [2346.7, "Ehl-i Sünnet ve'l-Cemaat nezdinde ilk seleften gelen, bir bid'at sebebiyle tebdî', bir fısk sebebiyle tefsik ya da bir küfür sebebiyle tekfir içeren genel nasların çoğuyla, ancak çıkış noktaları bid'atçi ve bozuk olan kimse kastedilir."], [2369.0, "Kendisine sert davranılan işte budur."]]}]}, {"ts": "39:32", "title": "5. Külliye (devam): İki tür hata sahibinin ortak ve farklı yönleri", "paras": [{"reader": false, "ar": [[2372.0, "ولذلك فأقول من باب تلخيص ما ذكرت:"], [2376.0, "بأنّ صاحب المنطلقات السليمة والمنطلقات الفاسدة يتّفقون في شيءٍ ويختلفون في شيء:"], [2388.0, "فيتّفقان في أنّ كلًّا منهما خطؤه مردود؛"], [2393.0, "لأنّ المتقرّر في القواعد أنّ الباطل يُردّ ممّن جاء به،"], [2400.0, "وإن جاء به أصدقُ الناس."], [2402.0, "ولكن يختلفان في أنّ صاحب المنطلقات الفاسدة يُحذَّر من عينه ويُحكم على شخصه،"], [2413.0, "وأمّا صاحب المنطلقات السليمة فلا يُحذَّر من عينه ولا يُحكم على شخصه،"], [2423.0, "وإنما نُبقيه على الأصل المتقرّر فيه إسلامًا وسنة."]], "tr": [[2372.0, "Bu yüzden zikrettiklerimi özetlemek kabîlinden derim ki:"], [2375.4, "Sağlam çıkış noktaları sahibi ile bozuk çıkış noktaları sahibi bir şeyde birleşir, bir şeyde ayrılırlar."], [2388.0, "Her birinin hatasının reddedilmesinde birleşirler;"], [2391.6, "çünkü kaidelerde yerleşik olan şudur:"], [2394.4, "Bâtıl, onu getiren insanların en doğru sözlüsü olsa bile, kim getirirse getirsin reddedilir."], [2401.6, "Fakat şunda ayrılırlar: Bozuk çıkış noktaları sahibinin kendisinden sakındırılır ve şahsı hakkında hüküm verilir."], [2412.0, "Sağlam çıkış noktaları sahibinin ise kendisinden sakındırılmaz ve şahsı hakkında hüküm verilmez;"], [2421.1, "bilakis onu, İslam ve sünnet bakımından onda yerleşik olan asıl üzere bırakırız."]]}, {"reader": false, "ar": [[2428.0, "وهذا الذي ندين الله عز وجل به في التعامل مع أخطاء كثيرٍ من أهل العلم ممّن يُقال لهم:"], [2439.7, "الأشعريّة الأثريّة، كالبيهقيّ رحمه الله،"], [2446.0, "وابن الجوزيّ رحمه الله،"], [2448.7, "والنوويّ رحمه الله، وابن حجرٍ رحمه الله."], [2454.0, "بل إنك لو تأمّلت أصول هؤلاء لوجدتهم في تعظيم النصّ كأهل السنة،"], [2462.0, "وفي الدفاع عن الوحي كأهل السنة،"], [2467.0, "وفي اعتماد الدليل كأهل السنة."]], "tr": [[2428.0, "\"Eserî Eş'arîler\" denilen birçok ilim ehlinin —Beyhakî, İbnü'l-Cevzî, Nevevî ve İbn Hacer gibi;"], [2436.4, "Allah hepsine rahmet etsin— hatalarına muamele etmede Allah Azze ve Celle'ye karşı din edindiğimiz (benimsediğimiz) şey budur."], [2452.1, "Hatta bunların usûllerini düşünsen, onları nassı tazim etmede Ehl-i Sünnet gibi, vahyi savunmada Ehl-i Sünnet gibi ve delile dayanmada Ehl-i Sünnet gibi bulursun."]]}, {"reader": false, "ar": [[2471.0, "بل إننا نجد أنّ بعضهم ـ كابن حجر ـ حارب وردّ على الأشاعرة في أوّل واجبٍ على المكلَّف؛"], [2480.0, "فإنّ الأشاعرة يقولون: إنّ أوّل واجبٍ على المكلَّف هو النظر،"], [2485.6, "أو القصد إلى النظر،"], [2487.9, "أو الشكّ، وردّ عليهم الحافظ بأنّ أوّل واجبٍ النطقُ بالشهادتين."], [2494.0, "وردّ الحافظ ابن حجرٍ على الأشاعرة عدمَ استدلالهم بأحاديث الآحاد في العقائد."], [2503.0, "وردّ الإمام النوويّ رحمه الله تعالى على كثيرٍ من تخوّضات أهل البدع بالأدلة الصحيحة الصريحة من السنة."]], "tr": [[2471.0, "Hatta bazılarının —İbn Hacer gibi— mükellefe ilk vacip konusunda Eş'arîlerle mücadele ettiğini ve onlara reddiye verdiğini görürüz."], [2479.4, "Eş'arîler mükellefe ilk vacibin nazar (akıl yürütme), nazara yönelme ya da şek olduğunu söyler;"], [2486.8, "Hâfız (İbn Hacer) ise ilk vacibin kelime-i şehâdeti söylemek olduğunu belirterek onlara reddiye vermiştir."], [2494.0, "Hâfız İbn Hacer, Eş'arîlerin akîdelerde âhâd hadislerle delil getirmemelerini de reddetmiştir."], [2500.8, "İmam Nevevî —Allah Teâlâ ona rahmet etsin— de bid'at ehlinin birçok (bâtıla) dalışına sünnetten sahih ve sarih delillerle reddiye vermiştir."]]}, {"reader": false, "ar": [[2517.0, "فمنطلقاتهم من تعظيم الوحي،"], [2520.1, "وتعظيم السلف، والاستدلال بها ـ انتبه ـ والاستدلال بأحاديث الآحاد في العقيدة،"], [2530.0, "وبتقديم النقل على العقل،"], [2538.0, "ممّا يعرفه كلُّ ناظرٍ في كتب هؤلاء الأئمة؛"], [2544.0, "فمنطلقاتهم في الأعمّ الأغلب سليمةٌ ومتّفقةٌ مع أهل السنة والجماعة."], [2551.0, "ولكنّ الكمال المطلق لله عز وجل،"], [2555.0, "وإنما للعالم مطلقُ الكمال."]], "tr": [[2517.0, "Onların vahyi tazim etme, selefi tazim etme ve onlarla delil getirme —dikkat et— ve akîdede âhâd hadislerle delil getirme ve nakli akla takdim etme şeklindeki çıkış noktaları, bu imamların kitaplarına bakan herkesin bildiği şeylerdendir."], [2543.1, "Onların çıkış noktaları çoğunlukla sağlamdır ve Ehl-i Sünnet ve'l-Cemaat ile uyumludur."], [2549.8, "Fakat mutlak kemâl Allah Azze ve Celle'ye aittir;"], [2553.0, "âlime ait olan ise sadece kemâlin bir kısmıdır (mutlaku'l-kemâl)."]]}, {"reader": false, "ar": [[2559.0, "فيجب أن نفرّق بين المخطئين بناءً على المنطلقين:"], [2566.0, "فمن كانت منطلقاته سليمةً وأخطاؤه عارضة،"], [2571.0, "فيُردّ خطؤه، ولا يُحكم على شخصه وعينه."], [2575.0, "ومن كانت أخطاؤه أصيلةً وبناها على منطلقاتٍ فاسدة،"], [2582.0, "فيُردّ خطؤه، ويُحكم على عينه،"], [2585.6, "ويُحذَّر من شخصه. هذا الذي ندين الله عز وجل به في هذه المسألة التي فُتن بها كثيرٌ من طلّاب العلم في هذا الزمان."]], "tr": [[2559.0, "Hata edenler arasında iki çıkış noktasına göre ayrım yapmamız vaciptir:"], [2566.8, "Çıkış noktaları sağlam, hataları arızî olanın hatası reddedilir;"], [2572.1, "şahsı ve kendisi hakkında hüküm verilmez."], [2575.0, "Hataları köklü olan ve onları bozuk çıkış noktaları üzerine bina edenin ise hatası reddedilir, kendisi hakkında hüküm verilir ve şahsından sakındırılır."], [2589.5, "Bu zamanda birçok ilim talebesinin fitneye düştüğü bu meselede Allah Azze ve Celle'ye karşı din edindiğimiz şey budur."]]}]}, {"ts": "43:18", "title": "Ara not: Kendisinden ilim alınmaması gereken üç âlim", "paras": [{"reader": false, "ar": [[2598.0, "وبالمناسبة: فإني أحذّرك من طلب العلم على يد ثلاثة علماء:"], [2611.0, "العالم الأوّل: من يُزيّن لك المخالفة الشرعيّة ـ شركًا أو بدعةً أو معصيةً ـ فيزخرف لك القول،"], [2623.0, "حتى يُخرج الشرك في صورة توحيد،"], [2627.0, "ويُخرج البدعة في صورة سنة،"], [2631.0, "ويُخرج المعصية في لبوس الراحة والطمأنينة؛"], [2637.0, "فأيُّ عالمٍ يدعوك إلى شيءٍ من ذلك ويزخرف لك القول فيه،"], [2642.0, "فإنه من علماء السوء وأتباع الشيطان، فاحذره."]], "tr": [[2598.0, "Yeri gelmişken: Seni üç âlimin elinde ilim talep etmekten sakındırırım."], [2604.3, "Birinci âlim: Şer'î muhalefeti —şirk, bid'at ya da masiyet— sana süsleyip gösteren ve sana sözü yaldızlayan kimsedir;"], [2623.7, "öyle ki şirki tevhid suretinde, bid'ati sünnet suretinde, masiyeti de rahatlık ve huzur kisvesinde ortaya çıkarır."], [2634.8, "Seni bunlardan birine çağıran ve bu konuda sana sözü yaldızlayan her âlim, kötü âlimlerden ve şeytanın tâbilerindendir; ondan sakın."]]}, {"reader": false, "ar": [[2646.0, "الثاني: من يُجرّئك على مقامات العلماء،"], [2653.0, "ويُصغّر منزلة العلماء في قلبك،"], [2659.0, "حتى يربّيك على الطعن فيهم غيرَ آبهٍ لجُرمك العظيم الفادح؛"], [2666.0, "فإنّ هذا من علماء إبليس ومن رسل الشيطان."], [2674.0, "فإنّ أوّل مكسبٍ وأعظم مكسبٍ نكسبه في طريق التعلّم:"], [2680.2, "احترامُ العلماء. فإذا رأيت من نفسك أنك كلّما ازددت علمًا عند هذا الرجل ازددت قلّةَ أدبٍ على العلماء،"], [2691.0, "فتقع فيهم قدحًا بلا برهان،"], [2694.6, "وتثريبًا بلا برهان، تفسيقًا وتكفيرًا وتبديعًا واتّهامًا بلا علمٍ ولا برهان،"], [2705.0, "فاحذر من هذا العالم الذي يربّيك على هذا الأمر."]], "tr": [[2646.0, "İkincisi: Seni âlimlerin makamlarına karşı cüretkâr kılan ve kalbinde âlimlerin değerini küçülten kimsedir;"], [2659.7, "öyle ki senin büyük ve ağır suçuna aldırmadan seni onlara dil uzatmak üzere yetiştirir."], [2668.9, "Bu, İblis'in âlimlerinden ve şeytanın elçilerindendir."], [2675.4, "Çünkü öğrenme yolunda kazandığımız ilk ve en büyük kazanç âlimlere saygıdır."], [2682.5, "Eğer kendinde şunu görürsen: Bu adamın yanında ilmin arttıkça âlimlere karşı edepsizliğin artıyor;"], [2689.8, "onlara delilsiz yere dil uzatıyor, delilsiz yere onları kınıyor, ilimsiz ve delilsiz olarak fâsık, kâfir, bid'atçi diyor ve itham ediyorsan, seni bu şey üzerine yetiştiren bu âlimden sakın."]]}, {"reader": false, "ar": [[2709.0, "الثالث: من لا يربّيك على تعظيم الوحي،"], [2715.0, "وإنما يربّيك على تعظيم قول فلانٍ وعلّان،"], [2723.0, "ويجعل مخالفته أعظمَ من مخالفة دليل الوحي؛"], [2728.0, "فإنه يربّيك على التعصّب المقيت الذي يضرّك ولا ينفعك."], [2734.0, "فكلُّ عالمٍ لا يربّيك على التوحيد ـ لا يربّيك إلا على المخالفات الشرعيّة ـ فاحذره،"], [2741.0, "وكلُّ عالمٍ لا يربّيك إلا على الطعن والتنقّص في العلماء فاحذره،"], [2748.0, "وكلُّ عالمٍ لا يربّيك إلا على تعظيم أقوال الرجال فاحذره. والله أعلم."]], "tr": [[2709.0, "Üçüncüsü: Seni vahyi tazim etmek üzere değil, falanın ve filanın sözünü tazim etmek üzere yetiştiren ve ona muhalefet etmeyi vahyin delile muhalefet etmekten daha büyük sayan kimsedir."], [2728.0, "Çünkü o seni, sana zarar veren ve fayda vermeyen iğrenç bir taassup üzere yetiştirir."], [2735.0, "Seni tevhid üzere yetiştirmeyen —seni ancak şer'î muhalefetler üzere yetiştiren— her âlimden sakın."], [2741.0, "Seni ancak âlimlere dil uzatmak ve onları küçümsemek üzere yetiştiren her âlimden sakın."], [2747.4, "Seni ancak adamların sözlerini tazim etmek üzere yetiştiren her âlimden sakın. Allah en iyisini bilir."]]}]}, {"ts": "45:55", "title": "6. Külliye: Her bid'atçi vaîde (azap tehdidine) müstahaktır", "paras": [{"reader": false, "ar": [[2755.0, "ومن الكلّيّات أيضًا: <b>كلُّ مبتدعٍ فمَحَلُّ وعيدٍ ـ كلُّ مبتدعٍ فمستحقٌّ للوعيد.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2755.0, "Külliyelerden biri de şudur: 6."], [2757.2, "külliye: Her bid'atçi vaîdin muhatabıdır —her bid'atçi vaîde (azap tehdidine) müstahaktır."]]}, {"reader": false, "ar": [[2779.0, "أقول وبالله التوفيق: وذلك لأنّ البدعة لها حكمان:"], [2785.0, "حكمٌ على صاحبها في هذه الدنيا،"], [2788.3, "وحكمٌ في الآخرة. فأمّا الحكم على صاحبها في الدنيا:"], [2793.6, "فإنه مؤمنٌ ناقص الإيمان إن لم تكن بدعته مكفِّرة؛"], [2799.0, "لأنه ببدعته المفسِّقة قد نقص مؤشّرُ إيمانه وتوحيده."], [2806.0, "وأمّا في الآخرة: فإنه يُعتبر تحت المشيئة؛"], [2814.0, "فإن شاء الله غفر له جرمَ بدعته وأدخله الجنة ابتداءً،"], [2821.0, "وإن شاء عذّبه في النار بقدر جرم بدعته،"], [2829.0, "ثمّ يُخرجه منها إلى الجنة انتقالًا،"], [2834.0, "إن لم تكن بدعته مكفِّرة."]], "tr": [[2779.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [2783.3, "Bid'atin iki hükmü vardır: Bu dünyada sahibi hakkındaki hüküm ve âhiretteki hüküm."], [2790.6, "Sahibi hakkında dünyadaki hükme gelince:"], [2793.6, "Bid'ati tekfir edici değilse, o imanı eksik bir mü'mindir;"], [2799.0, "çünkü tefsik edici bid'atiyle iman ve tevhid göstergesi azalmıştır."], [2807.9, "Âhirette ise meşîet (Allah'ın dilemesi) altında sayılır:"], [2815.1, "Allah dilerse bid'atinin suçunu bağışlar ve onu doğrudan cennete koyar;"], [2822.4, "dilerse bid'atinin suçu ölçüsünce onu ateşte azaplandırır, sonra oradan çıkarıp cennete geçirir; bid'ati tekfir edici değilse."]]}, {"reader": false, "ar": [[2838.0, "وأمّا إن كانت بدعته مكفِّرة،"], [2842.0, "فإننا نسلبه مطلقَ الإيمان والإسلام،"], [2847.0, "ونحكم عليه بالكفر والردّة في هذه الدنيا،"], [2851.0, "وفي الآخرة ـ إن مات مصرًّا على بدعته ـ فإنه مستحقٌّ للخلود الأبديّ الدائم دهرَ الدهارير في جهنّم،"], [2863.2, "كإخوانه من الكفرة الأصليّين."], [2866.6, "فكلا المبتدعَين يستحقّان العقاب:"], [2873.0, "فالمبتدع الفاسق مستحقٌّ للعقاب الذي يُحكم به على صاحب الكبيرة،"], [2883.0, "والمبتدع الكافر مستحقٌّ للعقاب الذي يُحكم به على الكافر الأصليّ. والله أعلم."]], "tr": [[2838.0, "Bid'ati tekfir edici ise, ondan iman ve İslam'ın aslını (mutlakını) selbederiz ve bu dünyada onun küfrüne ve irtidadına hükmederiz."], [2851.7, "Âhirette ise —bid'atinde ısrar ederek ölürse— asıl kâfirlerden olan kardeşleri gibi cehennemde ebedî, kalıcı, zamanlar boyu süren bir ebediliğe müstahaktır."], [2867.8, "Her iki bid'atçi de cezaya müstahaktır:"], [2875.1, "Fâsık bid'atçi, büyük günah sahibine hükmedilen cezaya;"], [2883.0, "kâfir bid'atçi ise asıl kâfire hükmedilen cezaya müstahaktır. Allah en iyisini bilir."]]}]}, {"ts": "48:12", "title": "7. Külliye: Bid'atçiye bid'atinde yardımı içeren her yol haramdır", "paras": [{"reader": false, "ar": [[2892.0, "ومن الكلّيّات أيضًا: <b>كلُّ طريقٍ يتضمّن إعانةَ المبتدع على بدعته فمحرَّم.<\/b> كلُّ طريقٍ يتضمّن إعانةَ المبتدع على بدعته فمحرَّم."], [2909.1, "(خلاص؟ نوقف؟ كم خذينا؟ كم الآن؟ سابع) <span class=\"q\">؟ 48:22<\/span> كلُّ طريقٍ يتضمّن إعانةَ المبتدع على بدعته فمحرَّم."]], "tr": [[2892.0, "Külliyelerden biri de şudur: 7."], [2895.7, "külliye: Bid'atçiye bid'atinde yardım etmeyi içeren her yol haramdır. Bid'atçiye bid'atinde yardım etmeyi içeren her yol haramdır."], [2907.1, "(Tamam mı? Duralım mı? Kaç tane aldık? Şimdi kaçıncı? Yedinci.) <span class=\"q\">؟<\/span> Bid'atçiye bid'atinde yardım etmeyi içeren her yol haramdır."]]}, {"reader": false, "ar": [[2931.0, "أقول وبالله التوفيق: لأنّ المتقرّر حرمةُ التعاون على الإثم والعدوان؛"], [2936.7, "لقول الله عز وجل:"], [2938.9, "<span class=\"ayah\">﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ ۖ وَلَا تَعَاوَنُوا عَلَى الْإِثْمِ وَالْعُدْوَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٢]<\/span>."], [2944.0, "ولأنّ الله عز وجل حرّم إمداد الغير بما يوجب مخالفة الشرع،"], [2953.0, "فقال الله عز وجل:"], [2955.8, "<span class=\"ayah\">﴿وَإِخْوَانُهُمْ يَمُدُّونَهُمْ فِي الْغَيِّ ثُمَّ لَا يُقْصِرُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٠٢]<\/span>."], [2961.0, "ولأنّ المتقرّر في القواعد أنّ الوسائل لها أحكام المقاصد،"], [2968.0, "ولأنّ المتقرّر في القواعد أنّ كلَّ وسيلةٍ تُفضي إلى حرامٍ فإنها حرام،"], [2975.0, "وكلُّ وسيلةٍ ـ أو: كلُّ ما لا يتمّ تركُ الحرام إلا به فتركُه من الواجبات الشرعيّة."]], "tr": [[2931.0, "Tevfik Allah'tandır, derim ki: Çünkü yerleşik olan, günah ve düşmanlıkta yardımlaşmanın haram olmasıdır."], [2936.7, "Allah Azze ve Celle'nin şu sözü sebebiyle:"], [2940.0, "<span class=\"ayah\">﴿İyilik ve takvada yardımlaşın; günah ve düşmanlıkta yardımlaşmayın﴾<\/span> [Mâide 2]."], [2944.7, "Ayrıca Allah Azze ve Celle, şeriate muhalefeti gerektiren bir şeyle başkasına destek vermeyi haram kılmış ve şöyle buyurmuştur:"], [2956.5, "<span class=\"ayah\">﴿Onların (şeytanların) kardeşleri ise onları azgınlığa sürükler, sonra da (bundan) geri durmazlar﴾<\/span> [A'râf 202]."], [2965.3, "Ayrıca kaidelerde yerleşik olan şudur:"], [2968.6, "Vesileler maksatların hükmünü alır. Yine kaidelerde yerleşik olan şudur:"], [2972.7, "Harama götüren her vesile haramdır;"], [2975.0, "her vesile —ya da: haramı terk etmek ancak kendisiyle tamamlanan her şey— onu terk etmek şer'î vaciplerdendir."]]}, {"reader": false, "ar": [[2984.0, "وبناءً على هذه الأدلة والأصول:"], [2987.3, "فلا يجوز للإنسان أن يقف معينًا للمبتدع على ما يخصّ بدعته؛"], [2995.0, "لا ببيعٍ يُعين المبتدع على بدعته،"], [3000.0, "ولا بشراءٍ يُعين المبتدع عليها،"], [3006.0, "ولا بابتسامةٍ تُعينه على البقاء عليها،"], [3012.0, "ولا بإعجابٍ في وسائل التواصل الاجتماعيّ،"], [3016.0, "ولا بدلالةٍ على موقع البدعة،"], [3021.0, "ولا بمجالسةٍ تتضمّن موادّتَه،"], [3027.0, "ولا باستماع كلامه، ولا بإغاثته بالمال؛"], [3041.0, "وكلُّ ما من شأنه أن يكون عونًا على بدعته فإنه لا يجوز."]], "tr": [[2984.0, "Bu delillere ve asıllara göre insanın, bid'atçinin bid'atine ait konularda ona yardımcı olarak durması caiz değildir:"], [2993.3, "Ne bid'atçiye bid'atinde yardım eden bir satışla, ne bid'atçiye onda yardım eden bir alışla, ne onda kalmasına yardım eden bir tebessümle, ne sosyal medyada bir beğeniyle, ne bid'atin yerini göstermekle, ne ona muhabbet beslemeyi içeren bir beraber oturmayla, ne onun sözünü dinlemekle, ne de ona malla yardım etmekle."], [3043.7, "Bid'atine yardım olma niteliğindeki her şey caiz değildir."]]}]}, {"ts": "50:53", "title": "8. Külliye: Her bid'atçiye bid'ati ölçüsünde düşmanlık edilir", "paras": [{"reader": false, "ar": [[3053.0, "ومن الكلّيّات أيضًا: <b>كلُّ مبتدعٍ فيُعادى على قدر بدعته.<\/b> كلُّ مبتدعٍ فيُعادى على قدر بدعته."], [3072.0, "وذلك لأنّ الأصل عند أهل السنة والجماعة أنّ الولاء والبراء تتبعّض بتبعّض مقتضياتها ـ أنّ الولاء والبراء يتبعّض بتبعّض مقتضياته."], [3091.0, "فمن ليست عنده مخالفةٌ فإننا نواليه الموالاةَ المطلقة،"], [3098.0, "ومن ليس عنده ولا مطلقُ الطاعة والإسلام فإننا نعاديه المعاداةَ المطلقة."]], "tr": [[3053.0, "Külliyelerden biri de şudur: 8."], [3055.8, "külliye: Her bid'atçiye bid'ati ölçüsünde düşmanlık edilir. Her bid'atçiye bid'ati ölçüsünde düşmanlık edilir."], [3073.4, "Bu şundandır: Ehl-i Sünnet ve'l-Cemaat nezdinde asıl olan, velâ ve berâ'nın (dostluk ve uzaklaşmanın), gerektiren sebeplerinin kısımlara ayrılmasıyla kısımlara ayrılmasıdır."], [3091.7, "Hiçbir muhalefeti olmayana mutlak dostlukla dost oluruz."], [3098.0, "Kendisinde itaatin ve İslam'ın aslı bile bulunmayana mutlak düşmanlıkla düşmanlık ederiz."]]}, {"reader": false, "ar": [[3108.0, "وأمّا من كان عنده شيءٌ من الدين والإيمان،"], [3112.7, "فإننا نحبّه ونواليه بقدر ما معه من الدين والإيمان،"], [3118.0, "ونبغضه ونصارمه ونعاديه بقدر ما معه من الجرم والطغيان والابتداع والعصيان."], [3125.0, "فمعاداة أهل البدع ليست على رتبةٍ واحدة،"], [3129.7, "وإنما تختلف باختلاف نوع بدعتهم:"], [3133.0, "فصاحب البدعة المكفِّرة نعاديه المعاداةَ المطلقة،"], [3140.0, "ونصارمه المصارمةَ المطلقة، ونتبرّأ منه البراءةَ المطلقة."], [3147.0, "وأمّا صاحب البدعة المفسِّقة فإننا نعاديه بمطلق المعاداة،"], [3155.0, "ونصارمه بمطلق المصارمة، ونتبرّأ منه بمطلق البراءة."], [3164.0, "وهذا جارٍ على عقيدة أهل السنة والجماعة في تبعّض مقتضيات الولاء والبراء. والله أعلم."]], "tr": [[3108.0, "Kendisinde dinden ve imandan bir şey bulunana gelince:"], [3111.5, "Onu, yanındaki din ve iman ölçüsünde sever ve dost ediniriz;"], [3115.6, "yanındaki suç, azgınlık, bid'at ve isyan ölçüsünde de ona buğzeder, ondan kopar ve ona düşmanlık ederiz."], [3123.7, "Bid'at ehline düşmanlık tek bir derecede değildir;"], [3127.0, "bid'atlerinin türünün farklılığına göre farklılaşır."], [3129.7, "Tekfir edici bid'at sahibine mutlak düşmanlıkla düşmanlık eder, ondan mutlak bir kopuşla koparız ve ondan mutlak bir berâetle beri oluruz."], [3143.0, "Tefsik edici bid'at sahibine ise düşmanlığın bir kısmıyla (mutlaku'l-muâdât) düşmanlık eder, kopuşun bir kısmıyla ondan koparız ve berâetin bir kısmıyla ondan beri oluruz."], [3164.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'in velâ ve berâ'yı gerektiren sebeplerin kısımlara ayrılması hakkındaki akîdesine uygundur. Allah en iyisini bilir."]]}]}, {"ts": "52:53", "title": "9. Külliye: Bid'atini niyetinin sağlamlığıyla meşrulaştıran bâtıl üzeredir", "paras": [{"reader": false, "ar": [[3173.0, "ومن الكلّيّات أيضًا: <b>كلُّ من سوّغ بدعته بسلامة قصده فمُبطِل.<\/b> <span class=\"note\">(يكررها)<\/span> وذلك لأنّ المتقرّر عند أهل السنة والجماعة أنّ سلامة المقاصد لا تسوّغ الوقوع في المخالفات،"], [3211.0, "وأنّ معرفة الحرام ليس مردُّها إلى سلامة المقاصد من عدم سلامتها،"], [3217.7, "وإنما بموافقة الدليل من مخالفته؛"], [3221.0, "فما خالف دليلَ الشرع فإنه يبقى حرامًا،"], [3225.0, "وإن كان فاعله ذا قصدٍ حسنٍ أو سليم."], [3229.3, "أنتم معي في هذا ولّا لا؟"]], "tr": [[3173.0, "Külliyelerden biri de şudur: 9."], [3175.7, "külliye: Bid'atini kastının (niyetinin) sağlamlığıyla meşrulaştıran herkes bâtıl üzeredir. Bu şundandır:"], [3183.7, "Ehl-i Sünnet ve'l-Cemaat nezdinde yerleşik olan şudur:"], [3188.3, "Maksatların sağlamlığı muhalefetlere düşmeyi meşrulaştırmaz."], [3211.5, "Haramın bilinmesinin mercii, maksatların sağlam olup olmaması değildir;"], [3215.4, "bilakis delile uygun olup olma
