<script>
const D={"no": 61, "vid": "giN-ngoVaqs", "title_ar": "الدرس (٦١) من شرح كليات العقيدة — من كليات باب الأسماء", "title_tr": "Şerhu Külliyyâti'l-Akîde — 61. Ders: İsimler Babının Külliyeleri (İsim–Haber–Sıfat Farkları, Ta'bîd ve Nidâ Ölçüsü, Elif-Lâm ve Mutlak Kemal, Fiil ve Hükümlerin İsimlerle Ta'lîli, İsimlerin Gerekleriyle Kulluk, Ta'tilin Kulluğun Hakikatinden Mahrum Bırakması)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: İsim olarak geçerli olan her şeyden haber türetilebilir; haber olarak geçerli olan her şeyden isim türetilemez", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.8, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.6, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.9, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [9.6, "أمّا بعد: فلا نزال في شرح باب الأسماء والصفات،"], [13.8, "وذكرنا جُمَلًا من كلّيّات باب الأسماء عند أهل السنّة والجماعة،"], [18.4, "وها نحن نُكمل في هذا الدرس ما تبقّى منها بإذن الله عز وجل،"], [24.3, "وذلك في عشر كلّيّاتٍ إن تيسّر لنا ذلك."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.8, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.6, "Bundan sonra: Hâlâ isim ve sıfatlar babının şerhindeyiz."], [14.2, "Ehl-i Sünnet ve'l-Cemaat nezdinde isimler babının külliyelerinden bir kısmını zikrettik."], [19.3, "İşte bu derste, Allah Azze ve Celle'nin izniyle, kolay gelirse on külliye hâlinde bunlardan geri kalanını tamamlıyoruz."]]}, {"reader": false, "ar": [[28.0, "الكلّيّة الأولى: كلُّ ما صحَّ اسمًا صحَّ اشتقاقُ الخبريّة منه،"], [34.5, "وليس كلُّ ما صحَّ خبرًا صحَّ اشتقاقُ الاسميّة منه. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[28.0, "1. külliye: 1. külliye: İsim olarak geçerli olan her şeyden haber türetmek geçerlidir;"], [34.5, "fakat haber olarak geçerli olan her şeyden isim türetmek geçerli değildir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[73.0, "أقول وبالله التوفيق: وذلك لأنّ ما يُطلق على الله عز وجل لا يخرج عن ثلاثة أقسام:"], [81.0, "إمّا أن يُطلق على الله عز وجل إطلاقَ أسماء،"], [84.5, "وإمّا أن يُطلق على الله عز وجل إطلاقَ صفات،"], [88.0, "وإمّا أن يُطلق على الله عز وجل إطلاقَ أخبارٍ عن أفعال."], [92.0, "فإذا رأينا ـ وفّقكم الله ـ أنّ الله عز وجل أطلق على نفسه اسمًا،"], [100.0, "فإنه يصحّ لنا أن نشتقّ له من هذا الاسم صفةً،"], [103.2, "وأن نشتقّ له أيضًا خبرًا عن فعلٍ من أفعاله."]], "tr": [[73.0, "Tevfik Allah'tandır, derim ki: Bu böyledir;"], [74.5, "çünkü Allah Azze ve Celle hakkında kullanılan şeyler üç kısmın dışına çıkmaz:"], [81.0, "Ya Allah Azze ve Celle hakkında isim olarak kullanılır, ya Allah Azze ve Celle hakkında sıfat olarak kullanılır, ya da Allah Azze ve Celle hakkında fiillerden haber olarak kullanılır."], [92.0, "Allah sizi muvaffak kılsın, Allah Azze ve Celle'nin kendisi için bir isim kullandığını gördüğümüzde, bu isimden O'nun için bir sıfat türetmemiz ve yine O'nun fiillerinden bir fiile dair haber türetmemiz geçerlidir."]]}, {"reader": false, "ar": [[106.0, "كالسميع مثلًا، فإنه يصحّ أن نشتقّ منها صفةَ السمع،"], [112.0, "ويصحّ أن نُخبر عن الله عز وجل بأنه قد سمع،"], [116.0, "كقول الله عز وجل:"], [117.7, "<span class=\"ayah\">﴿قَدْ سَمِعَ اللَّهُ قَوْلَ الَّتِي تُجَادِلُكَ فِي زَوْجِهَا﴾<\/span>،"], [121.0, "<span class=\"ayah\">﴿وَاللَّهُ يَسْمَعُ تَحَاوُرَكُمَا﴾<\/span> <span class=\"ref\">[المجادلة: ١]<\/span> أيضًا."], [128.0, "فبما أنه اسمٌ فيصحّ أن نشتقّ منه الأمرين جميعًا:"], [132.0, "أن نشتقّ منه صفةً،"], [133.4, "وأن نشتقّ منه خبرًا عن فعلٍ من أفعاله عز وجل."]], "tr": [[106.0, "Meselâ es-Semî' (işiten) ismi gibi:"], [109.3, "Ondan \"işitme\" (sem') sıfatını türetmemiz geçerlidir;"], [113.2, "Allah Azze ve Celle'nin işittiğini haber vermemiz de geçerlidir."], [117.7, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [118.9, "<span class=\"ayah\">﴿Allah, kocası hakkında seninle tartışan kadının sözünü işitti﴾<\/span>, yine <span class=\"ayah\">﴿Allah ikinizin konuşmasını işitiyordu﴾<\/span> [Mücâdele 1]."], [128.0, "Bu bir isim olduğuna göre, ondan her iki şeyi birden türetmemiz geçerlidir:"], [132.0, "ondan bir sıfat türetmemiz ve ondan O'nun —Azze ve Celle— fiillerinden bir fiile dair haber türetmemiz."]]}, {"reader": false, "ar": [[137.0, "ولكن ليس كلُّ ما صحَّ خبرًا عن الله عز وجل يجوز لنا أن نشتقّ منه صفةً أو نشتقّ منه اسمًا."], [148.0, "وإنّ من أخطر الأشياء التي ينبغي سدُّها في باب أسماء الله عز وجل:"], [153.0, "سدَّ اشتقاق الاسميّة من الخبريّة،"], [156.0, "كما نصّ العلماء على ذلك."], [160.0, "فهذا الإمام ابن القيّم رحمه الله تعالى يقول:"], [163.0, "«وكذلك باب الإخبار عنه بالاسم أوسعُ من تسميته به؛ فإنه يُخبَر عنه بأنه شيءٌ، وموجودٌ، ومذكورٌ، ومعلومٌ، ومُرادٌ، ولا يُسمّى بشيءٍ من ذلك». انتهى كلامه."]], "tr": [[137.0, "Fakat Allah Azze ve Celle hakkında haber olarak geçerli olan her şeyden bir sıfat veya bir isim türetmemiz caiz değildir."], [148.0, "Allah Azze ve Celle'nin isimleri babında kapatılması gereken en tehlikeli şeylerden biri, haber yoluyla kullanılandan isim türetme kapısını kapatmaktır;"], [156.0, "nitekim âlimler bunu açıkça belirtmişlerdir."], [160.0, "İşte İmam İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— şöyle der:"], [163.0, "\"Aynı şekilde O'nun hakkında bir isimle haber verme babı, O'nu o isimle adlandırmaktan daha geniştir."], [170.7, "Zira O'nun hakkında 'şey', 'mevcut', 'zikredilen', 'bilinen' ve 'murad edilen' olduğu haber verilir;"], [177.4, "fakat O, bunlardan hiçbiriyle isimlendirilmez.\" Sözü bitti."]]}, {"reader": false, "ar": [[181.0, "فبيَّن لنا الإمامُ ابن القيّم رحمه الله تعالى أنّ هناك أخبارًا يصحّ إطلاقُها على الله عز وجل،"], [189.0, "لكن لا يجوز لنا أن نشتقّ له منها أسماءً."], [193.0, "وقال الإمام ابن القيّم رحمه الله تعالى أيضًا:"], [198.0, "«ويجب أن تعلم هنا أمورًا: أحدها: أنّ ما يدخل في باب الإخبار عنه أوسعُ ممّا يدخل في باب أسمائه وصفاته، كالشيء والموجود والقائم بنفسه؛ فإنه يُخبَر به عنه، ولا يدخل في أسمائه الحسنى وصفاته العُلى». انتهى كلامه."]], "tr": [[181.0, "İmam İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— bize, Allah Azze ve Celle hakkında kullanılması geçerli olan bazı haberlerin bulunduğunu, fakat bunlardan O'nun için isimler türetmemizin caiz olmadığını açıkladı."], [190.0, "İmam İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— şunu da söyledi:"], [193.0, "\"Burada birkaç şeyi bilmen gerekir."], [193.6, "Bunlardan biri: O'nun hakkında haber verme babına giren şeyler, O'nun isim ve sıfatları babına giren şeylerden daha geniştir;"], [198.0, "'şey', 'mevcut' ve 'kendi zâtıyla kâim' gibi."], [204.9, "Bunlarla O'nun hakkında haber verilir;"], [209.9, "fakat bunlar O'nun güzel isimlerine ve yüce sıfatlarına girmez.\" Sözü bitti."]]}, {"reader": false, "ar": [[223.0, "وقال رحمه الله تعالى أيضًا مبيِّنًا أنّ ما أُطلق عليه اسمًا فيجوز أن يُشتقّ له منه صفةٌ وخبرٌ،"], [234.0, "فقال رحمه الله تعالى:"], [236.3, "«الاسم إذا أُطلق عليه جاز أن يُشتقّ منه المصدرُ والفعل، فيُخبَر به عنه فعلًا ومصدرًا، نحو: السميع والبصير والقدير، يُطلق عليه منه السمعُ والبصرُ والقدرة» ـ أي:"], [252.0, "إطلاقَ صفات ـ قال: «ويُخبَر عنه بالأفعال من ذلك، نحو قوله: <span class=\"ayah\">﴿قَدْ سَمِعَ اللَّهُ﴾<\/span> <span class=\"ref\">[المجادلة: ١]<\/span>، وقوله: <span class=\"ayah\">﴿فَقَدَرْنَا فَنِعْمَ الْقَادِرُونَ﴾<\/span> <span class=\"ref\">[المرسلات: ٢٣]<\/span>»."]], "tr": [[223.0, "Yine —Allah Teâlâ ona rahmet etsin— O'nun hakkında isim olarak kullanılan şeyden O'nun için bir sıfat ve bir haber türetilmesinin caiz olduğunu açıklayarak şöyle dedi:"], [231.6, "\"Bir isim O'nun hakkında kullanıldığında, ondan mastar ve fiil türetmek caiz olur;"], [236.3, "böylece onunla fiil ve mastar olarak O'nun hakkında haber verilir."], [240.9, "es-Semî', el-Basîr ve el-Kadîr gibi:"], [243.1, "Bunlardan O'nun hakkında işitme, görme ve kudret kullanılır\" —yani sıfat olarak kullanılır— (İbnü'l-Kayyim devamla) dedi ki:"], [252.0, "\"Ve bunlardan fiillerle O'nun hakkında haber verilir;"], [254.7, "şu kavli gibi: <span class=\"ayah\">﴿Allah işitti﴾<\/span> [Mücâdele 1] ve şu kavli gibi:"], [259.3, "<span class=\"ayah\">﴿Biz takdir ettik; ne güzel takdir edicileriz﴾<\/span> [Mürselât 23].\""]]}, {"reader": false, "ar": [[264.0, "وقال الإمام ابن القيّم رحمه الله تعالى أيضًا مؤكِّدًا هذه الكلّيّة وصحّتَها:"], [269.0, "«لا يلزم من الإخبار عنه بالفعل مقيَّدًا أن يُشتقّ له منه اسمٌ مطلق، كما غلط فيه بعضُ المتأخّرين، فجعل من أسمائه الحسنى: المُضلَّ، الفاتنَ، الماكرَ، تعالى الله عن قوله؛ فإنّ هذه الأسماء لم تُطلق عليه سبحانه منها إلا أفعالٌ مخصوصةٌ معيَّنة، فلا يجوز أن يُسمّى الله عز وجل بأسمائها». انتهى كلامه."]], "tr": [[264.0, "İmam İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— bu külliyeyi ve sıhhatini te'kid ederek şunu da söyledi:"], [266.5, "\"O'nun hakkında mukayyet (kayıtlı) bir fiille haber verilmesinden, ondan O'na mutlak bir isim türetilmesi lâzım gelmez."], [269.0, "Nitekim bazı müteahhirler bu konuda hataya düşmüş ve O'nun güzel isimlerinden 'el-Mudill' (saptıran), 'el-Fâtin' (fitneye düşüren), 'el-Mâkir' (tuzak kuran) isimlerini saymıştır;"], [282.0, "Allah onun sözünden yücedir. Zira bu isimlerden O'nun —Sübhânehû— hakkında ancak belirli, özel fiiller kullanılmıştır;"], [292.9, "dolayısıyla Allah Azze ve Celle'nin bunların isimleriyle isimlendirilmesi caiz değildir.\" Sözü bitti."]]}]}, {"ts": "05:01", "title": "1. Külliye (devam): Muhammed b. İbrâhîm'in fetvası · Haber yoluyla kullanılıp isim yapılmayan lafızlar", "paras": [{"reader": false, "ar": [[301.0, "ولذلك لمّا سُئل الشيخ محمد بن إبراهيم،"], [304.9, "مفتي السعوديّة، عن قول الله عز وجل:"], [308.0, "<span class=\"ayah\">﴿يَسْتَفْتُونَكَ قُلِ اللَّهُ يُفْتِيكُمْ﴾<\/span> <span class=\"ref\">[النساء: ١٧٦]<\/span>،"], [312.0, "فأطلق على نفسه عز وجل تلك الخبريّة،"], [316.0, "فقال رحمه الله تعالى:"], [318.0, "«إسنادُ الإفتاء بصيغة الفعل المقيَّد إلى الله تعالى في القرآن لا يستلزم تسميةَ الله عز وجل باسم المُفتي؛ فإنّ باب الأفعال أوسعُ من باب الأسماء». وأظنّ الكلّيّة واضحة."]], "tr": [[301.0, "Bu sebeple Suudi Arabistan müftüsü Şeyh Muhammed b."], [303.8, "İbrâhîm'e, Allah Azze ve Celle'nin <span class=\"ayah\">﴿Senden fetva istiyorlar. De ki: Allah size fetva veriyor﴾<\/span> [Nisâ 176] kavli —ki (Allah) Azze ve Celle kendisi hakkında o haberi kullanmıştır— sorulduğunda, —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [318.0, "\"Kur'an'da fetva vermenin mukayyet fiil sîgasıyla Allah Teâlâ'ya isnad edilmesi, Allah Azze ve Celle'nin 'el-Müftî' ismiyle isimlendirilmesini gerektirmez."], [328.0, "Zira fiiller babı isimler babından daha geniştir.\" Zannederim külliye açıktır."]]}, {"reader": false, "ar": [[337.0, "وبناءً على ذلك: فـ«القديم» يصحّ إطلاقُها على الله عز وجل من باب الخبريّة،"], [345.0, "لا من باب الصفة والتسمية."], [347.0, "وكذلك «الدهر» يصحّ إطلاقُها على الله عز وجل من باب إطلاق الخبريّة،"], [355.0, "لا من باب إطلاق الوصفيّة والاسميّة."], [359.0, "وكذلك إطلاقُ «الشيء» فيصحّ إطلاقُه خبريّةً،"], [365.0, "لكن لا يجوز أن نُسمّي الله عز وجل بهذا الاسم."], [368.0, "وكذلك لفظُ «المقصود» فيصحّ إطلاقُه على الله عز وجل من باب الخبريّة،"], [375.3, "ولا يصحّ من باب الوصفيّة والاسميّة."], [379.0, "وكذلك «الموجود» فيصحّ إطلاقُه على الله عز وجل من باب الخبريّة،"], [384.5, "لا من باب الوصفيّة والاسميّة."]], "tr": [[337.0, "Buna binaen: \"el-Kadîm\" (ezelî) lafzının Allah Azze ve Celle hakkında kullanılması, haber yoluyla geçerlidir;"], [345.0, "sıfat ve isim olarak değil."], [347.0, "Aynı şekilde \"ed-Dehr\" (zaman) lafzının Allah Azze ve Celle hakkında kullanılması haber yoluyla geçerlidir;"], [355.7, "sıfat ve isim olarak değil."], [359.0, "Aynı şekilde \"şey\" lafzının kullanılması da haber olarak geçerlidir;"], [365.3, "fakat Allah Azze ve Celle'yi bu isimle isimlendirmemiz caiz değildir."], [368.0, "Aynı şekilde \"el-Maksûd\" (kastedilen) lafzının Allah Azze ve Celle hakkında kullanılması haber yoluyla geçerlidir;"], [375.3, "sıfat ve isim olarak geçerli değildir."], [379.0, "Aynı şekilde \"el-Mevcûd\" lafzının Allah Azze ve Celle hakkında kullanılması haber yoluyla geçerlidir;"], [384.5, "sıfat ve isim olarak değil."]]}, {"reader": false, "ar": [[387.0, "وكذلك «الدائم» فيصحّ إطلاقُه على الله عز وجل من باب الخبريّة،"], [394.3, "لا من باب الاسميّة."], [397.0, "وكذلك «الباقي» فيصحّ إطلاقُه على الله عز وجل من باب الخبريّة،"], [403.6, "لا من باب الاسميّة."], [406.0, "وكذلك «المُسعِّر» فيصحّ إطلاقُه على الله عز وجل من باب الخبريّة عن فعلٍ من أفعاله وهو التسعير،"], [415.0, "ولكن لا يصحّ من باب إطلاق الوصفيّة ولا الاسميّة."], [419.0, "وكذلك «الساتر» يصحّ إطلاقُه على الله عز وجل من باب الخبريّة عن فعلٍ من أفعاله؛"], [426.8, "فـ«من ستر مؤمنًا ستره الله عز وجل في الدنيا والآخرة»،"], [431.0, "ولكن لا يصحّ إطلاقُه على الله عز وجل من باب الاسميّة."]], "tr": [[387.0, "Aynı şekilde \"ed-Dâim\" (daimî olan) lafzının Allah Azze ve Celle hakkında kullanılması haber yoluyla geçerlidir;"], [397.0, "isim olarak değil. Aynı şekilde \"el-Bâkî\" (bâki olan) lafzının Allah Azze ve Celle hakkında kullanılması haber yoluyla geçerlidir;"], [406.0, "isim olarak değil. Aynı şekilde \"el-Müsa''ir\" (fiyat belirleyen) lafzının Allah Azze ve Celle hakkında kullanılması, O'nun fiillerinden bir fiil olan fiyat belirlemeye (tes'îr) dair haber yoluyla geçerlidir;"], [416.3, "fakat sıfat veya isim olarak kullanılması geçerli değildir."], [419.0, "Aynı şekilde \"es-Sâtir\" (örten) lafzının Allah Azze ve Celle hakkında kullanılması, O'nun fiillerinden bir fiile dair haber yoluyla geçerlidir:"], [426.8, "\"Kim bir mü'mini örterse, Allah Azze ve Celle de onu dünyada ve âhirette örter.\" Fakat Allah Azze ve Celle hakkında isim olarak kullanılması geçerli değildir."]]}, {"reader": false, "ar": [[435.0, "وكذلك «المُعين» فيصحّ إطلاقُه على الله عز وجل من باب الخبريّة،"], [440.8, "لا من باب الوصفيّة أو الاسميّة."], [444.0, "وكذلك قولُهم: «واجبُ الوجود» فيصحّ إطلاقُه على الله عز وجل من باب الخبريّة،"], [451.6, "لا من باب الوصفيّة أو الاسميّة."], [454.0, "وكذلك قولُهم: «الأزليّ الأبديّ» فيصحّ إطلاقُهما على الله عز وجل من باب إطلاق الخبريّة،"], [463.1, "لا من باب إطلاق الوصفيّة أو الاسميّة."]], "tr": [[435.0, "Aynı şekilde \"el-Mu'în\" (yardım eden) lafzının Allah Azze ve Celle hakkında kullanılması haber yoluyla geçerlidir;"], [441.4, "sıfat veya isim olarak değil."], [444.0, "Aynı şekilde onların \"Vâcibü'l-vücûd\" (varlığı zorunlu olan) sözlerinin Allah Azze ve Celle hakkında kullanılması haber yoluyla geçerlidir;"], [452.0, "sıfat veya isim olarak değil."], [454.0, "Aynı şekilde onların \"el-Ezelî el-Ebedî\" sözlerinin her ikisinin Allah Azze ve Celle hakkında kullanılması haber yoluyla geçerlidir;"], [464.4, "sıfat veya isim olarak değil."]]}, {"reader": false, "ar": [[469.0, "وكذلك «الزارع» فيصحّ إطلاقُها على الله عز وجل من باب إطلاق الخبريّة عن فعلٍ من أفعاله،"], [478.0, "كما قال الله عز وجل:"], [480.0, "<span class=\"ayah\">﴿أَأَنتُمْ تَزْرَعُونَهُ أَمْ نَحْنُ الزَّارِعُونَ﴾<\/span> <span class=\"ref\">[الواقعة: ٦٤]<\/span>،"], [482.0, "ولكن لا يصحّ إطلاقُه من باب الوصفيّة ولا من باب الاسميّة."], [487.0, "وكذلك قولُهم: إنّ الله هو «القائم بنفسه» فيصحّ إطلاقُه على الله عز وجل من باب إطلاق الخبريّة،"], [498.0, "لا من باب إطلاق الوصفيّة ولا الاسميّة."]], "tr": [[469.0, "Aynı şekilde \"ez-Zâri'\" (ekip bitiren) lafzının Allah Azze ve Celle hakkında kullanılması, O'nun fiillerinden bir fiile dair haber yoluyla geçerlidir."], [477.4, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [480.0, "<span class=\"ayah\">﴿Onu siz mi bitiriyorsunuz, yoksa bitiren biz miyiz?﴾<\/span> [Vâkıa 64]."], [483.4, "Fakat sıfat veya isim olarak kullanılması geçerli değildir."], [487.0, "Aynı şekilde onların \"Allah, kendi zâtıyla kâim olandır (el-Kâim bi-nefsihî)\" sözlerinin Allah Azze ve Celle hakkında kullanılması haber yoluyla geçerlidir;"], [498.9, "sıfat ve isim olarak değil."]]}, {"reader": false, "ar": [[501.0, "وكذلك قولُهم: «المُدبِّر»، «المُتصرِّف»،"], [507.0, "كلُّها يصحّ إطلاقُها على الله من باب إطلاق الخبريّة عن فعلٍ من أفعاله،"], [513.0, "ولكن لا يجوز أن يُشتقّ له منها أسماء."], [517.0, "وكذلك: المُؤتي، والفرد، والمعبود،"], [519.8, "والباعث، والمُحصي، والمُميت، والمُعِزّ،"], [522.6, "والمُذِلّ، والصانع، والآمر، والناهي،"], [538.9, "ونحوها؛ فكلُّها يصحّ إطلاقُها على الله عز وجل،"], [546.0, "ولكن من باب إطلاق الخبريّة عن فعلٍ من أفعاله،"], [550.0, "ولكن لا يجوز أن يُشتقّ له منها أسماء."]], "tr": [[501.0, "Aynı şekilde onların \"el-Müdebbir\" (idare eden), \"el-Mütasarrıf\" (tasarruf eden) sözleri;"], [508.8, "bunların hepsinin Allah hakkında kullanılması, O'nun fiillerinden bir fiile dair haber yoluyla geçerlidir;"], [513.5, "fakat bunlardan O'nun için isimler türetilmesi caiz değildir."], [517.0, "Aynı şekilde el-Mü'tî (veren), el-Ferd (tek), el-Ma'bûd (ibadet edilen), el-Bâis (dirilten), el-Muhsî (sayan), el-Mümît (öldüren), el-Muizz (izzet veren), el-Müzill (zillete düşüren), es-Sâni' (yapan), el-Âmir (emreden), en-Nâhî (yasaklayan) ve benzerleri:"], [542.0, "Bunların hepsinin Allah Azze ve Celle hakkında kullanılması geçerlidir;"], [546.4, "fakat O'nun fiillerinden bir fiile dair haber yoluyla;"], [550.0, "bunlardan O'nun için isimler türetilmesi ise caiz değildir."]]}, {"reader": false, "ar": [[553.0, "والخلاصةُ من ذلك: أنه لا يلزم من الإخبار عنه بالفعل مقيَّدًا أن يُشتقّ له منه اسمٌ مطلق،"], [561.0, "كما غلط فيه بعضُ المتأخّرين،"], [564.0, "فجعل من أسمائه ما لم يأتِ به دليلٌ لا من الكتاب ولا من السنّة."], [570.0, "فالواجبُ الانتباهُ لذلك. والله أعلم."]], "tr": [[553.0, "Bunun özeti şudur: O'nun hakkında mukayyet bir fiille haber verilmesinden, ondan O'na mutlak bir isim türetilmesi lâzım gelmez."], [561.0, "Nitekim bazı müteahhirler bu konuda hataya düşmüş ve ne Kitap'tan ne de Sünnet'ten hakkında delil gelmeyen şeyleri O'nun isimlerinden saymıştır."], [570.0, "Buna dikkat etmek vâciptir. Allah en iyisini bilir."]]}]}, {"ts": "09:34", "title": "2. Külliye: Allah'ın zâtına delalet eden her şey isimdir; zâtıyla kâim bir manaya delalet eden ise sıfattır", "paras": [{"reader": false, "ar": [[574.0, "الكلّيّة الثانية: كلُّ ما دلّ على ذات الله فهو اسم،"], [580.3, "وما دلّ على معنًى قائمٍ بذاته فصفة. <span class=\"note\">(يكررها ثلاثًا)<\/span> إيش عندكم؟ هذا… <span class=\"q\">؟ 10:07<\/span>"]], "tr": [[574.0, "2. külliye: 2. külliye: Allah'ın zâtına delalet eden her şey isimdir;"], [579.2, "O'nun zâtıyla kâim bir manaya delalet eden ise sıfattır. (Üç kez tekrar ediyor.) Sizde ne var? Bu… <span class=\"q\">؟<\/span>"]]}, {"reader": false, "ar": [[618.0, "أقول وبالله التوفيق: وهذه الكلّيّة ممّا يجعلها أهلُ السنّة فُرقانًا بين ما يُطلق إطلاقَ أسماء وما يُطلق إطلاقَ صفات."], [634.0, "فمن الفروق: أنّ الأسماء هي كلُّ ما دلّ على ذات الله عز وجل مع صفات كماله القائمة به؛"], [641.1, "مثل «الحكيم»، فإنه يدلّ على ذات الله عز وجل،"], [645.0, "وأمّا «الحكمة» فإنها تدلّ على معنًى قام بهذه الذات."], [648.9, "وكـ«العليم»، فإنه يدلّ على ذات الله عز وجل،"], [654.0, "وأمّا «العلم» فإنه معنًى قائمٌ بهذه الذات."], [657.8, "وكـ«السميع»، فإنه يدلّ على ذات الله عز وجل،"], [663.0, "وأمّا «السمع» فإنه يدلّ على معنًى قام بهذه الذات."]], "tr": [[618.0, "Tevfik Allah'tandır, derim ki: Bu külliye, Ehl-i Sünnet'in, isim olarak kullanılan ile sıfat olarak kullanılan arasında bir ayırt edici ölçü (furkan) yaptığı şeylerdendir."], [634.0, "Farklardan biri şudur: İsimler, Allah Azze ve Celle'nin zâtına, O'nunla kâim olan kemal sıfatlarıyla birlikte delalet eden her şeydir."], [641.1, "\"el-Hakîm\" gibi: O, Allah Azze ve Celle'nin zâtına delalet eder;"], [645.0, "\"hikmet\" ise bu zâtla kâim olan bir manaya delalet eder."], [648.9, "\"el-Alîm\" gibi: O, Allah Azze ve Celle'nin zâtına delalet eder;"], [654.0, "\"ilim\" ise bu zâtla kâim bir manadır."], [657.8, "\"es-Semî'\" gibi: O, Allah Azze ve Celle'nin zâtına delalet eder;"], [663.0, "\"işitme\" ise bu zâtla kâim olan bir manaya delalet eder."]]}, {"reader": false, "ar": [[667.8, "وكـ«القويّ»، فإنه يدلّ على ذات الله عز وجل،"], [672.0, "وأمّا «القوّة» فإنها معنًى قام بهذه الذات."], [677.2, "وكـ«الحيّ»، فإنه يدلّ على ذات الله عز وجل،"], [684.0, "وأمّا «الحياة» التي يتضمّنها ذلك الاسم فإنها تدلّ على معنًى قام بهذه الذات."], [690.0, "فكلُّ إطلاقٍ يدلّ على ذات الله عز وجل فإنه إطلاقُ أسماء،"], [696.0, "وكلُّ إطلاقٍ يدلّ على معنًى قام بهذه الذات فإنه إطلاقُ صفات."], [704.0, "وهذا من أوضح الفروق بين ما يُطلق اسمًا وما يُطلق صفةً."]], "tr": [[667.8, "\"el-Kavî\" gibi: O, Allah Azze ve Celle'nin zâtına delalet eder;"], [671.5, "\"kuvvet\" ise bu zâtla kâim olan bir manadır."], [677.2, "\"el-Hayy\" gibi: O, Allah Azze ve Celle'nin zâtına delalet eder;"], [684.0, "o ismin içerdiği \"hayat\" ise bu zâtla kâim olan bir manaya delalet eder."], [690.0, "Allah Azze ve Celle'nin zâtına delalet eden her kullanım isim olarak kullanmadır;"], [695.5, "bu zâtla kâim olan bir manaya delalet eden her kullanım ise sıfat olarak kullanmadır."], [704.0, "Bu, isim olarak kullanılan ile sıfat olarak kullanılan arasındaki en açık farklardandır."]]}, {"reader": false, "ar": [[710.0, "وبناءً على ذلك: فالاسمُ يدلّ على أمرين:"], [713.0, "يدلّ على الذات وعلى الصفة،"], [716.0, "وأمّا الصفة فإنها لا تدلّ إلا على شيءٍ واحد،"], [721.0, "وهي دلالتُها على ذلك المعنى الذي قام بذاته عز وجل."], [725.0, "ويؤكّد هذه الكلّيّة أبو العبّاس ابن تيميّة رحمه الله تعالى بقوله:"], [731.0, "«فأسماؤه كلُّها متّفقةٌ في الدلالة على نفسه المقدّسة» ـ أي أنّ ما دلّ على ذات الله عز وجل فإنه اسم ـ «ثم كلُّ اسمٍ منها يدلّ على معنًى من صفاته ليس هو المعنى الذي دلّ عليه الاسمُ الآخر؛ فالعزيز يدلّ على نفسه مع عزّته، والخالق يدلّ على نفسه مع خلقه، والرحيم يدلّ على نفسه مع رحمته، ونفسُه تستلزم جميعَ صفاته، فصار كلُّ اسمٍ يدلّ على ذاته والصفةِ المختصّة به بطريق المطابقة»."], [773.0, "انتهى كلامه رحمه الله."]], "tr": [[710.0, "Buna binaen isim iki şeye delalet eder:"], [713.0, "zâta ve sıfata delalet eder."], [715.4, "Sıfat ise yalnızca tek bir şeye delalet eder;"], [719.9, "bu da onun, O'nun —Azze ve Celle— zâtıyla kâim olan o manaya delaletidir."], [725.0, "Ebü'l-Abbâs İbn Teymiyye —Allah Teâlâ ona rahmet etsin— bu külliyeyi şu sözüyle te'kid eder:"], [731.0, "\"O'nun isimlerinin hepsi O'nun mukaddes zâtına delalet etmekte müttefiktir\" —yani Allah Azze ve Celle'nin zâtına delalet eden şey isimdir— \"sonra bunlardan her isim, O'nun sıfatlarından, diğer ismin delalet ettiği mana olmayan bir manaya delalet eder."], [759.0, "el-Azîz, O'nun zâtına izzetiyle birlikte;"], [763.9, "el-Hâlık, zâtına yaratmasıyla birlikte; er-Rahîm, zâtına rahmetiyle birlikte delalet eder."], [773.0, "O'nun zâtı ise bütün sıfatlarını gerektirir."], [773.6, "Böylece her isim, mutâbakat (tam örtüşme) yoluyla O'nun zâtına ve o isme has sıfata delalet eder hâle gelmiştir.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[775.0, "ولمّا سُئلت اللجنةُ الدائمة في المملكة العربيّة السعوديّة ـ رحم الله أمواتَهم وثبّت أحياءَهم ـ عن الفرقان بين الاسم والصفة قالوا:"], [786.7, "«أسماءُ الله: كلُّ ما دلّ على ذات الله مع صفات الكمال القائمة به، مثل: القادر، العليم، الحكيم، السميع، البصير؛ فإنّ هذه الأسماء دلّت على ذات الله وعلى ما قام بها من العلم والحكمة والسمع والبصر»."], [809.0, "انتهى كلامهم رحمهم الله. وأظنّ الأمر واضحًا."]], "tr": [[775.0, "Suudi Arabistan'daki Daimî Komite'ye (el-Lecnetü'd-Dâime) —Allah ölmüşlerine rahmet etsin, hayatta olanlarını sebatlı kılsın— isim ile sıfat arasındaki fark sorulduğunda şöyle dediler:"], [786.7, "\"Allah'ın isimleri, Allah'ın zâtına, O'nunla kâim olan kemal sıfatlarıyla birlikte delalet eden her şeydir:"], [803.5, "el-Kâdir, el-Alîm, el-Hakîm, es-Semî', el-Basîr gibi."], [809.0, "Bu isimler Allah'ın zâtına ve onunla kâim olan ilim, hikmet, işitme ve görmeye delalet etmiştir.\" Sözleri bitti, Allah onlara rahmet etsin. Zannederim mesele açıktır."]]}, {"reader": false, "ar": [[812.0, "بل إنّ الواحد منّا في أسمائه أيضًا كذلك؛"], [816.0, "فإنّ الإنسان يُفرّق بين ما يُطلق عليه اسمٌ وبين ما يُطلق عليه صفة:"], [823.0, "فكلُّ شيءٍ يُعرِّف بذاتك فإنه تعريفُ أسماء،"], [827.0, "وكلُّ شيءٍ يصف هذه الذات فإنه تعريفُ أوصاف. والله أعلم."]], "tr": [[812.0, "Hatta bizden biri de kendi isimlerinde böyledir."], [816.0, "İnsan, kendisine isim olarak verilen ile sıfat olarak verilen arasında ayrım yapar:"], [823.0, "Senin zâtını tanıtan her şey isimlerle tanıtmadır;"], [826.4, "bu zâtı niteleyen her şey ise vasıflarla tanıtmadır. Allah en iyisini bilir."]]}]}, {"ts": "13:53", "title": "3. Külliye: Her isimden bir sıfat türetilir; bunun tersi olmaz", "paras": [{"reader": false, "ar": [[833.0, "الكلّيّة الثالثة: كلُّ اسمٍ فيُشتقّ منه صفة،"], [837.7, "ولا عكس. <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[833.0, "3. külliye: 3. külliye: Her isimden bir sıfat türetilir;"], [837.0, "bunun tersi olmaz. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[852.0, "أقول وبالله التوفيق: وهذه الكلّيّة أيضًا من باب الفروق بين الأسماء والصفات؛"], [859.0, "فإنّ أهل السنّة قرّروا أنّ كلَّ اسمٍ من أسماء الله عز وجل فإنه لا بدّ أن يتضمّن صفةً من صفات كماله:"], [867.0, "فالكريمُ اسمُه والكرمُ صفتُه،"], [870.0, "والحكيمُ اسمُه والحكمةُ صفتُه،"], [873.0, "والحيُّ اسمُه والحياةُ صفتُه،"], [876.0, "والسميعُ والبصيرُ اسمُه والسمعُ والبصرُ صفتُه."], [880.4, "وهذا أمرٌ متّفقٌ عليه بين أهل السنّة والجماعة."]], "tr": [[852.0, "Tevfik Allah'tandır, derim ki: Bu külliye de isimler ile sıfatlar arasındaki farklar babındandır."], [859.0, "Zira Ehl-i Sünnet şunu takrir etmiştir:"], [860.7, "Allah Azze ve Celle'nin isimlerinden her isim, mutlaka O'nun kemal sıfatlarından bir sıfatı içerir."], [865.3, "el-Kerîm O'nun ismi, kerem O'nun sıfatıdır;"], [867.0, "el-Hakîm O'nun ismi, hikmet O'nun sıfatıdır;"], [870.0, "el-Hayy O'nun ismi, hayat O'nun sıfatıdır;"], [873.8, "es-Semî' ve el-Basîr O'nun ismi, işitme ve görme O'nun sıfatıdır."], [880.4, "Bu, Ehl-i Sünnet ve'l-Cemaat arasında üzerinde ittifak edilmiş bir husustur."]]}, {"reader": false, "ar": [[884.0, "ولكن ليس كلُّ ما أُطلق عليه صفةً يُشتقّ له منها اسم؛"], [890.0, "فقد وصف الله عز وجل ذاتَه بأنه مستوٍ على العرش،"], [897.0, "ولكن لا نقول بأنّ من أسمائه «المستوي»."], [900.0, "ووصف ذاتَه أيضًا بأنه يجيء ويأتي يوم القيامة،"], [904.0, "ولكن لا يجوز أن نشتقّ له منها اسمَ «الجائي» و«الآتي»."], [910.0, "وقد أخبر الله عز وجل عن نفسه أنه يمكر بمن مكر،"], [915.0, "ويكيد من كاد، ويسخر بمن سخر،"], [919.3, "ويستهزئ بمن استهزأ، ولكن كلُّ ذلك إطلاقُ صفاتٍ مقيَّدة،"], [926.0, "أو أخبارٌ عن فعلٍ من أفعاله،"], [929.0, "فلا يجوز لنا أن نشتقّ له منها أسماء."]], "tr": [[884.0, "Fakat O'nun hakkında sıfat olarak kullanılan her şeyden O'nun için bir isim türetilmez."], [890.0, "Allah Azze ve Celle zâtını Arş'a istivâ etmiş olmakla nitelemiştir;"], [897.0, "fakat O'nun isimlerinden \"el-Müstevî\" vardır demeyiz."], [900.0, "Yine zâtını kıyamet günü geleceği (yecîü ve ye'tî) ile nitelemiştir;"], [904.6, "fakat bunlardan O'nun için \"el-Câî\" ve \"el-Âtî\" ismini türetmemiz caiz değildir."], [910.0, "Allah Azze ve Celle kendisi hakkında, tuzak kurana tuzak kurduğunu, hile yapana hile yaptığını, alay edenle alay ettiğini, istihza edenle istihza ettiğini haber vermiştir;"], [923.5, "fakat bunların hepsi mukayyet sıfatların kullanılması veya O'nun fiillerinden bir fiile dair haberlerdir."], [929.0, "Dolayısıyla bunlardan O'nun için isimler türetmemiz caiz değildir."]]}, {"reader": false, "ar": [[934.0, "وهذا من جملة الفروق بين الأسماء والصفات؛"], [938.0, "فالكلّيّة التي قبلها جعلت كلَّ ما دلّ على الذات فهو اسم،"], [942.0, "وكلَّ ما دلّ على معنًى في هذه الذات فصفة،"], [945.0, "وهذه الكلّيّة تنصّ على أنّ الاسم يُشتقّ منه صفة،"], [951.0, "ولكن لا يجوز أن يُشتقّ من الصفة اسم."]], "tr": [[934.0, "Bu, isimler ile sıfatlar arasındaki farklar cümlesindendir."], [938.0, "Ondan önceki külliye, zâta delalet eden her şeyi isim, bu zâttaki bir manaya delalet eden her şeyi sıfat saydı."], [945.7, "Bu külliye ise isimden sıfat türetildiğini, fakat sıfattan isim türetilmesinin caiz olmadığını açıkça belirtir."]]}]}, {"ts": "15:55", "title": "4. Külliye: Ta'bîd (Abd- izafeti) geçerli olan her şey O'nun isimlerindendir; geçerli olmayan ise sıfatlarından veya fiillerindendir", "paras": [{"reader": false, "ar": [[955.0, "ومن الكلّيّات أيضًا: كلُّ ما صحَّ التعبيدُ به فمن أسمائه،"], [961.0, "وما لا يصحّ التعبيدُ به فمن صفاته أو أفعاله. <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [987.6, "كلُّ ما صحَّ التعبيدُ به فمن أسمائه،"], [991.7, "وكلُّ ما لا يصحّ التعبيدُ به فمن صفاته أو أفعاله."]], "tr": [[955.0, "Külliyelerden biri de şudur: 4."], [959.0, "külliye: Ta'bîdi (Abd- kelimesine izafeyle kulluk isnadı) geçerli olan her şey O'nun isimlerindendir;"], [962.5, "ta'bîdi geçerli olmayan ise O'nun sıfatlarından veya fiillerindendir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [987.6, "4. külliye: Ta'bîdi geçerli olan her şey O'nun isimlerindendir;"], [992.4, "ta'bîdi geçerli olmayan her şey ise O'nun sıfatlarından veya fiillerindendir."]]}, {"reader": false, "ar": [[998.4, "أقول وبالله التوفيق: وهذا الفرقانُ الثالث أيضًا بين الأسماء والصفات:"], [1006.1, "فكلُّ ما صحّ أن يأتي بعد كلمة «عبد» فإنه يُعتبر اسمًا من أسماء الله عز وجل،"], [1014.1, "إذا دلّ على التسمية به دليلُ الوحي،"], [1017.0, "وكلُّ ما لا يصحّ أن يأتي بعد كلمة «عبد» فإنه لا يُعتبر من جملة أسمائه."], [1025.0, "فيصحّ أن نقول: «عبد العليم»،"], [1027.3, "ولكن لا يصحّ أن نقول:"], [1029.6, "«عبد علم الله»، ويصحّ أن نقول:"], [1032.8, "«عبد العظيم»، ولكن لا يصحّ أن نقول:"], [1037.2, "«عبد عظمة الله»، ويصحّ أن نقول:"], [1040.6, "«عبد السميع»، ولكن لا يصحّ أن نقول:"], [1044.4, "«عبد سمع الله»، ويصحّ أن نقول:"], [1048.0, "«عبد البصير»، ولكن لا يصحّ أن نقول: «عبد بصر الله»."]], "tr": [[998.4, "Tevfik Allah'tandır, derim ki: Bu da isimler ile sıfatlar arasındaki üçüncü ayırt edici ölçüdür:"], [1006.1, "\"Abd\" (kul) kelimesinden sonra gelmesi geçerli olan her şey, —vahyin delili onunla isimlendirmeye delalet ettiğinde— Allah Azze ve Celle'nin isimlerinden bir isim sayılır."], [1018.6, "\"Abd\" kelimesinden sonra gelmesi geçerli olmayan her şey ise O'nun isimleri cümlesinden sayılmaz."], [1026.4, "\"Abdülalîm\" dememiz geçerlidir; fakat \"Abdü ilmillâh\" (Allah'ın ilminin kulu) dememiz geçerli değildir."], [1032.8, "\"Abdülazîm\" dememiz geçerlidir; fakat \"Abdü azametillâh\" dememiz geçerli değildir."], [1040.6, "\"Abdüssemî'\" dememiz geçerlidir; fakat \"Abdü sem'illâh\" dememiz geçerli değildir."], [1048.0, "\"Abdülbasîr\" dememiz geçerlidir; fakat \"Abdü basarillâh\" dememiz geçerli değildir."]]}, {"reader": false, "ar": [[1054.5, "الأمثلةُ طيّبةٌ ترى، حتى لأنّ الكتاب سيقرؤه فيما بعدُ أحد،"], [1059.8, "ويسمعه فيما… يعني ربّما لا يفهمون من ثلاثة أمثلة <span class=\"q\">؟ 17:35<\/span>."], [1065.0, "ويصحّ أن نقول: «عبد القويّ»،"], [1067.0, "ولكن لا يصحّ أن نقول:"], [1070.1, "«عبد قوّة الله»، ويصحّ أن نقول:"], [1074.4, "«عبد الحيّ»، ولكن لا يصحّ أن نقول:"], [1078.7, "«عبد حياة الله»، وهكذا."]], "tr": [[1054.5, "Örnekler güzeldir, bilesiniz; çünkü kitabı daha sonra birisi okuyacak, dinleyecek… Yani belki üç örnekten anlamazlar <span class=\"q\">؟<\/span>."], [1065.0, "\"Abdülkavî\" dememiz geçerlidir; fakat \"Abdü kuvvetillâh\" dememiz geçerli değildir."], [1070.1, "\"Abdülhayy\" dememiz geçerlidir; fakat \"Abdü hayâtillâh\" dememiz geçerli değildir;"], [1078.7, "ve bu böyle devam eder."]]}, {"reader": false, "ar": [[1080.0, "فكلُّ ما صحّ التعبيدُ به فهو اسمٌ إن ورد في الكتاب أو السنّة،"], [1087.0, "وكلُّ ما لا يصحّ التعبيدُ به فإنه لا يُعتبر اسمًا؛"], [1092.0, "فإنّ الصفة لا يصحّ أن يُتعبَّد لها،"], [1098.0, "وإنما نحن نتعبّد لله عز وجل بأسمائه."]], "tr": [[1080.0, "Ta'bîdi geçerli olan her şey, Kitap'ta veya Sünnet'te varid olmuşsa isimdir;"], [1087.0, "ta'bîdi geçerli olmayan her şey ise isim sayılmaz."], [1092.0, "Zira sıfata kulluk edilmesi geçerli değildir;"], [1095.7, "biz ancak Allah Azze ve Celle'ye O'nun isimleriyle kulluk ederiz."]]}]}, {"ts": "18:22", "title": "5. Külliye: Nidâ «yâ»sıyla kendisine dua edilmesi geçerli olan her şey O'nun isimlerindendir", "paras": [{"reader": false, "ar": [[1102.0, "ومن الكلّيّات أيضًا ـ هذه ترى كلّيّاتُ الفروق بين الأسماء والصفات،"], [1107.8, "ها؟ ـ: <b>كلُّ ما صحَّ دعاؤه بياء النداء فمن أسمائه.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[1102.0, "Külliyelerden biri de şudur —bilesiniz, bunlar isimler ile sıfatlar arasındaki farkların külliyeleridir, tamam mı?—:"], [1107.6, "<b>5. külliye: Nidâ (seslenme) \"yâ\"sıyla kendisine dua edilmesi geçerli olan her şey O'nun isimlerindendir.<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1113.4, "أقول وبالله التوفيق: وهذه الكلّيّة أيضًا من جملة الكلّيّات التي تُفرّق بين الصفات والأسماء."], [1140.0, "فإذا كان ما تريد أن تُخاطب الله عز وجل به يصحّ أن يأتي بعد ياء النداء ـ أي:"], [1149.1, "ياء الدعاء ـ فاعلم أنه من جملة أسمائه،"], [1153.0, "إن ورد به دليلُ الوحي،"], [1156.0, "وأمّا ما لا يصحّ وقوعُه مخاطَبًا لله عز وجل بعد ياء النداء فلا يُعتبر من جملة أسمائه؛"], [1165.0, "فالله عز وجل إنما يُدعى بأسمائه."]], "tr": [[1113.4, "Tevfik Allah'tandır, derim ki: Bu külliye de sıfatlar ile isimleri birbirinden ayıran külliyeler cümlesindendir."], [1140.0, "Allah Azze ve Celle'ye kendisiyle hitap etmek istediğin şeyin nidâ \"yâ\"sından —yani dua \"yâ\"sından— sonra gelmesi geçerliyse, bil ki o, —hakkında vahyin delili varid olmuşsa— O'nun isimleri cümlesindendir."], [1155.4, "Nidâ \"yâ\"sından sonra Allah Azze ve Celle'ye hitap olarak gelmesi geçerli olmayan şey ise O'nun isimleri cümlesinden sayılmaz."], [1165.0, "Zira Allah Azze ve Celle'ye ancak isimleriyle dua edilir."]]}, {"reader": false, "ar": [[1169.0, "فنقول: «يا رحيم»، ولكن لا يجوز أن نقول:"], [1173.9, "«يا رحمةَ الله»، ونقول:"], [1175.9, "«يا كريم»، ولكن لا يصحّ أن نقول:"], [1181.5, "«يا كرمَ الله»، ونقول:"], [1183.9, "«يا لطيف»، ولكن لا يصحّ أن نقول:"], [1188.5, "«يا لطفَ الله»، ويصحّ أن نقول:"], [1192.4, "«يا قويّ، يا قدير»،"], [1196.0, "ولكن لا يصحّ أن نقول:"], [1198.9, "«يا قدرةَ الله» أو «يا قوّةَ الله»،"], [1203.0, "ويصحّ أن نقول: «يا سميع، يا بصير»،"], [1211.0, "ولكن لا يصحّ أن نقول:"], [1213.3, "«يا سمعَ الله، يا بصرَ الله»."]], "tr": [[1169.0, "\"Yâ Rahîm\" deriz; fakat \"Yâ rahmetallâh\" (ey Allah'ın rahmeti) dememiz caiz değildir."], [1175.9, "\"Yâ Kerîm\" deriz; fakat \"Yâ keremallâh\" dememiz geçerli değildir."], [1183.9, "\"Yâ Latîf\" deriz; fakat \"Yâ lutfallâh\" dememiz geçerli değildir."], [1192.4, "\"Yâ Kavî, yâ Kadîr\" dememiz geçerlidir;"], [1198.9, "fakat \"Yâ kudretallâh\" veya \"Yâ kuvvetallâh\" dememiz geçerli değildir."], [1205.2, "\"Yâ Semî', yâ Basîr\" dememiz geçerlidir;"], [1211.9, "fakat \"Yâ sem'allâh, yâ basarallâh\" dememiz geçerli değildir."]]}, {"reader": false, "ar": [[1216.0, "وسوف يأتينا في كلّيّات الصفات أنّ أهل السنّة والجماعة قد اتّفقوا على أنّ دعاء الصفة كفرٌ مُخرجٌ عن الملّة؛"], [1229.0, "فالله عز وجل إنما يُدعى بأسمائه،"], [1234.0, "فلا يجوز أن ينصبّ دعاؤك وافتقارُ قلبك لصفةٍ من صفات الله،"], [1241.0, "وإنما ينصبّ دعاؤك وافتقارُ قلبك لله عز وجل."], [1248.0, "فالرحمةُ ليست هي الله،"], [1250.0, "بل هي صفةٌ من صفاته،"], [1252.5, "وكذلك العزّةُ ليست هي الله،"], [1255.0, "بل معنًى قائمٌ في ذاته؛"], [1257.0, "فهذه صفاتٌ لله وليست هي الله. والله أعلم."]], "tr": [[1216.0, "Sıfatlar külliyelerinde gelecek ki Ehl-i Sünnet ve'l-Cemaat, sıfata dua etmenin dinden çıkaran bir küfür olduğunda ittifak etmiştir."], [1229.0, "Allah Azze ve Celle'ye ancak isimleriyle dua edilir."], [1234.0, "Duanın ve kalbinin muhtaçlığının Allah'ın sıfatlarından bir sıfata yönelmesi caiz değildir;"], [1240.4, "duan ve kalbinin muhtaçlığı ancak Allah Azze ve Celle'ye yönelir."], [1248.0, "Rahmet Allah'ın kendisi değildir; bilakis O'nun sıfatlarından bir sıfattır."], [1251.5, "Aynı şekilde izzet de Allah'ın kendisi değildir;"], [1254.5, "bilakis O'nun zâtında kâim bir manadır."], [1257.0, "Bunlar Allah'ın sıfatlarıdır, Allah'ın kendisi değildir. Allah en iyisini bilir."]]}]}, {"ts": "21:03", "title": "6. Külliye: Allah hakkında elif-lâm ile marife olarak, mutlak kemali içerecek şekilde kullanılan her şey O'nun isimlerindendir", "paras": [{"reader": false, "ar": [[1263.0, "ومن الكلّيّات أيضًا: كلُّ ما أُطلق على الله معرَّفًا بالألف واللام،"], [1270.0, "متضمِّنًا للكماليّة المطلقة، فمن أسمائه. <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[1263.0, "Külliyelerden biri de şudur: 6."], [1264.0, "külliye: Allah hakkında elif-lâm ile marife (belirli) olarak ve mutlak kemali içerecek şekilde kullanılan her şey O'nun isimlerindendir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1303.0, "وهذا أيضًا من جملة ما يُفرَّق فيه بين الأسماء والصفات؛"], [1308.0, "فإنّ الأسماء إنما يُطلقها الله عز وجل على نفسه ـ في الأعمّ الأغلب ـ معرَّفةً بالألف واللام،"], [1318.0, "وإن كان هناك بعضُ الأسماء أطلقها الله عليه غيرَ معرَّفة،"], [1322.0, "لكن هذه لها كلّيّةٌ أخرى."], [1325.0, "لكن من جملة ما يُعرف إطلاقُ التسمية به:"], [1329.0, "أن يُطلق الله عز وجل على نفسه هذا الشيءَ معرَّفًا بالألف واللام،"], [1334.0, "كقول الله عز وجل:"], [1336.2, "<span class=\"ayah\">﴿إِنَّ اللَّهَ هُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[غافر: ٢٠]<\/span>؛"], [1339.0, "فالسميعُ اسمُه، والبصيرُ اسمُه؛"], [1341.0, "لأنه شيءٌ أضافه الله إليه معرَّفًا بالألف واللام."]], "tr": [[1303.0, "Bu da isimler ile sıfatlar arasında ayrım yapılan şeyler cümlesindendir."], [1308.0, "Zira Allah Azze ve Celle isimleri kendisi hakkında —çoğunlukla— elif-lâm ile marife olarak kullanır."], [1315.9, "Allah'ın kendisi hakkında marife olmaksızın kullandığı bazı isimler bulunsa da, onların başka bir külliyesi vardır."], [1325.0, "Fakat isim olarak kullanmanın kendisiyle bilindiği şeyler cümlesinden biri, Allah Azze ve Celle'nin bu şeyi kendisi hakkında elif-lâm ile marife olarak kullanmasıdır."], [1333.2, "Allah Azze ve Celle'nin şu kavli gibi:"], [1336.2, "<span class=\"ayah\">﴿Şüphesiz Allah, işitendir, görendir﴾<\/span> [Mü'min 20]."], [1339.0, "es-Semî' O'nun ismidir, el-Basîr O'nun ismidir;"], [1341.0, "çünkü bu, Allah'ın elif-lâm ile marife olarak kendisine izafe ettiği bir şeydir."]]}, {"reader": false, "ar": [[1345.0, "وكذلك في آخر سورة الحشر،"], [1348.0, "في قول الله عز وجل:"], [1349.4, "<span class=\"ayah\">﴿هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ ۖ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ ۖ هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾<\/span> <span class=\"ref\">[الحشر: ٢٢]<\/span>،"], [1358.0, "فهما اسمان من أسماء الله؛"], [1360.5, "لأنّ الله أضافهما إليه معرَّفَين بالألف واللام."], [1364.0, "ثم قال الله عز وجل:"], [1366.3, "<span class=\"ayah\">﴿هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْمَلِكُ﴾<\/span> <span class=\"ref\">[الحشر: ٢٣]<\/span> فهو من أسمائه،"], [1372.1, "«الْقُدُّوسُ» فهو من أسمائه،"], [1374.8, "«السَّلَامُ» فهو من أسمائه،"], [1380.0, "«الْمُؤْمِنُ» فهو من أسمائه،"], [1383.0, "«الْمُهَيْمِنُ» فهو من أسمائه،"], [1386.0, "«الْعَزِيزُ» فهو من أسمائه،"], [1389.0, "«الْجَبَّارُ» فهو من أسمائه،"], [1392.0, "«الْمُتَكَبِّرُ» فهو من أسمائه."]], "tr": [[1345.0, "Aynı şekilde Haşr sûresinin sonunda, Allah Azze ve Celle'nin şu kavlinde:"], [1349.4, "<span class=\"ayah\">﴿O, kendisinden başka hiçbir ilâh olmayan Allah'tır; gaybı da görüneni de bilendir. O, Rahmân'dır, Rahîm'dir﴾<\/span> [Haşr 22]."], [1358.0, "Bu ikisi Allah'ın isimlerinden iki isimdir;"], [1360.5, "çünkü Allah onları elif-lâm ile marife olarak kendisine izafe etmiştir."], [1364.0, "Sonra Allah Azze ve Celle şöyle buyurdu:"], [1364.5, "<span class=\"ayah\">﴿O, kendisinden başka hiçbir ilâh olmayan Allah'tır; Melik'tir﴾<\/span> [Haşr 23] —bu O'nun isimlerindendir—;"], [1366.3, "\"el-Kuddûs\" —bu O'nun isimlerindendir—; \"es-Selâm\" —O'nun isimlerindendir—;"], [1372.8, "\"el-Mü'min\" —O'nun isimlerindendir—; \"el-Müheymin\" —O'nun isimlerindendir—;"], [1383.0, "\"el-Azîz\" —O'nun isimlerindendir—; \"el-Cebbâr\" —O'nun isimlerindendir—; \"el-Mütekebbir\" —O'nun isimlerindendir."]]}, {"reader": false, "ar": [[1395.0, "وهكذا دواليك في كتاب الله عز وجل وفي سنّة نبيّه صلى الله عليه وسلم؛"], [1402.0, "فكلُّ ما عرّف الله عز وجل نفسَه به لعباده معرَّفًا بالألف واللام فإنّ الأصل فيه أنه إطلاقُ أسماء."], [1414.0, "فإن قلتَ: ولماذا قلتَ في الكلّيّة:"], [1418.3, "«متضمِّنًا للكماليّة المطلقة»؟ فأقول:"], [1423.5, "حتى نُخرج ما كان معرَّفًا بالألف واللام لكن لا يتضمّن الكماليّة المطلقة؛"], [1429.8, "فإنّ ما عُرِّف بالألف واللام غيرَ متضمِّنٍ للكماليّة المطلقة فإذا أطلقه الله على نفسه فإنما هو إطلاقُ أخبارٍ عن أفعال."]], "tr": [[1395.0, "Allah Azze ve Celle'nin Kitabı'nda ve Peygamberi sallallâhu aleyhi ve sellem'in sünnetinde bu böyle devam eder."], [1402.0, "Allah Azze ve Celle'nin kendisini kullarına elif-lâm ile marife olarak tanıttığı her şeyde asıl olan, bunun isim olarak kullanma olmasıdır."], [1414.0, "Eğer \"Külliyede niçin 'mutlak kemali içerecek şekilde' dedin?\" dersen, derim ki:"], [1423.0, "Elif-lâm ile marife olup da mutlak kemali içermeyen şeyi (kapsam) dışına çıkarmak için."], [1429.8, "Zira elif-lâm ile marife olup mutlak kemali içermeyen şeyi Allah kendisi hakkında kullandığında, bu ancak fiillerden haber olarak kullanmadır."]]}, {"reader": false, "ar": [[1438.8, "كقول الله ـ كقول النبيّ صلى الله عليه وسلم:"], [1443.0, "«إنّ اللهَ هو المُسعِّر»،"], [1446.0, "فأطلقها على الله عز وجل معرَّفةً بالألف واللام،"], [1453.0, "لكنها لا تتضمّن الكماليّة المطلقة."], [1456.0, "وكقوله صلى الله عليه وسلم:"], [1459.0, "«لا تسبّوا الدهرَ؛ فإنّ اللهَ هو الدهر»،"], [1464.0, "وفي قوله صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل:"], [1469.0, "«يُؤذيني ابنُ آدم؛ يسبّ الدهرَ، وأنا الدهرُ، بيدي الأمرُ، أُقلّب الليلَ والنهار»."], [1476.0, "فإنّ هنا «الدهر» قد أُضيف إلى الله عز وجل معرَّفًا بالألف واللام،"], [1481.0, "لكن هو في ذاته لا يتضمّن الكماليّة المطلقة."]], "tr": [[1438.8, "Allah'ın kavli gibi —(düzeltiyor) Peygamber sallallâhu aleyhi ve sellem'in şu sözü gibi:"], [1443.0, "\"Şüphesiz fiyatı belirleyen (el-Müsa''ir) Allah'tır.\" Bunu Allah Azze ve Celle hakkında elif-lâm ile marife olarak kullandı;"], [1453.0, "fakat bu mutlak kemali içermez."], [1456.0, "Yine sallallâhu aleyhi ve sellem'in şu sözü gibi:"], [1460.4, "\"Dehre (zamana) sövmeyin; çünkü Dehr Allah'tır.\" Ve sallallâhu aleyhi ve sellem'in, Rabbi Azze ve Celle'den rivayet ettiği şu sözünde:"], [1469.0, "\"Âdemoğlu bana eziyet ediyor; dehre sövüyor."], [1472.5, "Hâlbuki Dehr benim; iş benim elimdedir;"], [1476.0, "geceyi ve gündüzü ben evirip çeviririm.\" Burada \"ed-Dehr\" Allah Azze ve Celle'ye elif-lâm ile marife olarak izafe edilmiştir;"], [1482.0, "fakat o, kendi zâtında mutlak kemali içermez."]]}, {"reader": false, "ar": [[1485.0, "فحينئذٍ لا بدّ أن تُقيَّد هذه الكلّيّة بهذا القيد:"], [1492.0, "فما أُطلق على الله معرَّفًا بالألف واللام،"], [1496.0, "فإن كان متضمِّنًا للكماليّة المطلقة فهو من باب إطلاق الأسماء،"], [1501.0, "وإن كان غيرَ متضمِّنٍ للكماليّة المطلقة فهو من باب إطلاق الأخبار."], [1508.0, "إلا أنّ هذه الكلّيّة أغلبيّةٌ،"], [1511.6, "وليست كلّيّةً في الأصحّ،"], [1516.0, "لكنها كلّيّةٌ أغلبيّة. وأنتم تعرفون أنّ القاعدة أو الأصل أو الكلّيّة يصحّ إطلاقُ الكلّيّة والقاعدة والأصل عليها إذا كانت أغلبيّةً ولا يشذّ عنها إلا شيءٌ يسير. والله أعلم."]], "tr": [[1485.0, "O hâlde bu külliyenin şu kayıtla kayıtlanması gerekir:"], [1492.0, "Allah hakkında elif-lâm ile marife olarak kullanılan şey, mutlak kemali içeriyorsa isim olarak kullanma babındandır;"], [1500.0, "mutlak kemali içermiyorsa haber olarak kullanma babındandır."], [1504.2, "Ancak bu külliye ağlebîdir (çoğunlukla geçerlidir);"], [1508.0, "en sahih görüşe göre (istisnasız) külliye değildir, fakat ağlebî bir külliyedir."], [1520.0, "Bilirsiniz ki kaide, asıl veya külliye;"], [1522.5, "ağlebî olduğunda ve ondan ancak az bir şey istisna kaldığında, ona külliye, kaide ve asıl denmesi geçerlidir. Allah en iyisini bilir."]]}]}, {"ts": "25:35", "title": "7. Külliye: Allah'ın bütün fiilleri ve hükümleri O'nun isimleriyle ta'lîl edilmiştir", "paras": [{"reader": false, "ar": [[1535.0, "ومن الكلّيّات أيضًا: <b>كلُّ أفعال الله وأحكامِه معلَّلةٌ بأسمائه.<\/b> ما أجملَ هذه القاعدة!"], [1553.0, "<b>كلُّ أفعال الله عز وجل وأحكامِه معلَّلةٌ بأسمائه.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1535.0, "Külliyelerden biri de şudur: 7."], [1537.1, "külliye: Allah'ın bütün fiilleri ve hükümleri O'nun isimleriyle ta'lîl edilmiştir (gerekçelendirilmiştir). Bu kaide ne güzeldir!"], [1552.0, "<b>7. külliye: Allah Azze ve Celle'nin bütün fiilleri ve hükümleri O'nun isimleriyle ta'lîl edilmiştir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1565.0, "أقول وبالله التوفيق: وقد نصّ على هذه الكلّيّة الإمامُ ابن القيّم رحمه الله تعالى،"], [1573.0, "فقال: «إنه تعالى يُعلّل أحكامَه وأفعالَه بأسمائه»."], [1583.0, "انتهى كلامه. فكثيرٌ في القرآن تجد أنّ الله عز وجل يذكر أفعالًا أو يذكر أحكامًا،"], [1594.0, "ويُعلّل هذه الأحكامَ والأفعالَ بشيءٍ من أسمائه عز وجل،"], [1598.0, "كقول الله عز وجل:"], [1600.0, "<span class=\"ayah\">﴿يَا أَيُّهَا النَّبِيُّ اتَّقِ اللَّهَ وَلَا تُطِعِ الْكَافِرِينَ وَالْمُنَافِقِينَ﴾<\/span>،"], [1606.0, "ثم علّل هذا النهيَ لنبيّه بأنه <span class=\"ayah\">﴿إِنَّ اللَّهَ كَانَ عَلِيمًا حَكِيمًا﴾<\/span> <span class=\"ref\">[الأحزاب: ١]<\/span>."]], "tr": [[1565.0, "Tevfik Allah'tandır, derim ki: Bu külliyeyi İmam İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— açıkça belirtmiş ve şöyle demiştir:"], [1573.7, "\"O —Teâlâ— hükümlerini ve fiillerini isimleriyle ta'lîl eder.\" Sözü bitti."], [1583.0, "Kur'an'da çokça görürsün ki Allah Azze ve Celle fiiller veya hükümler zikreder ve bu hükümleri ve fiilleri kendi —Azze ve Celle— isimlerinden bir şeyle ta'lîl eder."], [1597.1, "Allah Azze ve Celle'nin şu kavli gibi:"], [1600.0, "<span class=\"ayah\">﴿Ey Peygamber! Allah'tan kork; kâfirlere ve münafıklara itaat etme﴾<\/span>."], [1603.8, "Sonra Peygamberine yönelik bu yasağı şununla ta'lîl etti:"], [1607.2, "<span class=\"ayah\">﴿Şüphesiz Allah her şeyi bilendir, hüküm ve hikmet sahibidir﴾<\/span> [Ahzâb 1]."]]}, {"reader": false, "ar": [[1613.0, "والمعنى: أنّ الله عز وجل لو علم أنّ ميلك إليهم فيه منفعةٌ لما نهاك عنه،"], [1621.0, "لأنه حكيم، ولكن لأنه يعلم أنّ ميلك لهم لا يُوجب إلا المفسدةَ الخالصة أو الراجحة ـ وإن قدّرتَه شيئًا نافعًا ـ لكن لأنّني أنا العليمُ الحكيم أنهاك عن ذلك؛"], [1635.0, "لأنّني أعلمُ وأحكمُ بهؤلاء،"], [1639.0, "وأنه لا ينفع، وأنّ ميلك لهم لا يزيدهم إلا غرورًا وبطرًا وأشرًا وكِبرًا."], [1648.0, "فانظر كيف علّل هذا النهيَ بشيءٍ من أسمائه."]], "tr": [[1613.0, "Mana şudur: Allah Azze ve Celle, onlara meyletmende bir fayda olduğunu bilseydi, hikmet sahibi olduğu için seni bundan nehyetmezdi."], [1621.0, "Fakat onlara meyletmenin, —sen onu faydalı bir şey sansan bile— ancak halis veya ağır basan bir mefsedeti gerektirdiğini bildiği için (nehyetti):"], [1630.5, "\"Ben her şeyi bilen, hikmet sahibi olduğum için seni bundan nehyediyorum;"], [1635.0, "çünkü bunları ben daha iyi bilirim ve onlar hakkında daha hikmetli hüküm veririm;"], [1641.7, "bu fayda vermez ve onlara meyletmen onların ancak gururunu, şımarıklığını, azgınlığını ve kibrini artırır.\" Bak, bu yasağı kendi isimlerinden bir şeyle nasıl ta'lîl etti."]]}, {"reader": false, "ar": [[1654.0, "وهكذا في سائر كتاب الله عز وجل،"], [1657.2, "وهي قاعدةٌ عظيمةٌ من قواعد التفسير:"], [1660.0, "أنّ الله عز وجل إذا ختم الآيةَ باسمين أو أكثر،"], [1664.0, "فإنه ختمُ تعليلٍ لما ذُكر في هذه الآية من الأحكام أو الأفعال."], [1670.0, "وكذلك قولُ الله عز وجل:"], [1673.6, "<span class=\"ayah\">﴿وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا جَزَاءً بِمَا كَسَبَا نَكَالًا مِّنَ اللَّهِ﴾<\/span> <span class=\"ref\">[المائدة: ٣٨]<\/span>،"], [1682.0, "وهذا حكمٌ شرعيّ، ثم علّل الله عز وجل هذا الحكمَ باسمين من أسمائه بقوله:"], [1687.7, "<span class=\"ayah\">﴿وَاللَّهُ عَزِيزٌ حَكِيمٌ﴾<\/span> <span class=\"ref\">[المائدة: ٣٨]<\/span>؛ أي:"], [1689.7, "فلأنه عزيزٌ حكيمٌ أمر بقطع يد السارق."]], "tr": [[1654.0, "Allah Azze ve Celle'nin Kitabı'nın tamamında bu böyledir."], [1657.2, "Bu, tefsir kaidelerinden büyük bir kaidedir:"], [1660.0, "Allah Azze ve Celle bir ayeti iki veya daha fazla isimle bitirdiğinde, bu, o ayette zikredilen hükümler veya fiiller için bir ta'lîl ile bitirmedir."], [1667.0, "Allah Azze ve Celle'nin şu kavli de böyledir:"], [1670.0, "<span class=\"ayah\">﴿Hırsızlık eden erkek ve hırsızlık eden kadının, yaptıklarına karşılık ve Allah'tan ibret verici bir ceza olarak ellerini kesin﴾<\/span> [Mâide 38]."], [1682.0, "Bu şer'î bir hükümdür. Sonra Allah Azze ve Celle bu hükmü kendi isimlerinden iki isimle ta'lîl etti:"], [1687.7, "<span class=\"ayah\">﴿Allah azîzdir, hakîmdir﴾<\/span> [Mâide 38]."], [1689.0, "Yani: Azîz ve hakîm olduğu için hırsızın elinin kesilmesini emretti."]]}, {"reader": false, "ar": [[1695.0, "ثم قال بعدها: <span class=\"ayah\">﴿فَمَن تَابَ مِن بَعْدِ ظُلْمِهِ وَأَصْلَحَ فَإِنَّ اللَّهَ يَتُوبُ عَلَيْهِ﴾<\/span> <span class=\"ref\">[المائدة: ٣٩]<\/span>،"], [1702.3, "وهذا حكمٌ شرعيّ، وقولُه:"], [1704.7, "<span class=\"ayah\">﴿يَتُوبُ عَلَيْهِ﴾<\/span> فعلٌ من أفعاله،"], [1708.0, "ثم علّل هذا الحكمَ الشرعيَّ والفعلَ بقوله:"], [1712.5, "<span class=\"ayah\">﴿إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ﴾<\/span> <span class=\"ref\">[المائدة: ٣٩]<\/span>؛"], [1715.0, "أي: لأنه غفورٌ رحيمٌ تاب على السارق إذا صدقت توبتُه."]], "tr": [[1695.0, "Sonra ardından şöyle buyurdu: <span class=\"ayah\">﴿Kim yaptığı zulümden sonra tövbe eder ve (hâlini) düzeltirse, şüphesiz Allah onun tövbesini kabul eder﴾<\/span> [Mâide 39]."], [1704.7, "Bu şer'î bir hükümdür; <span class=\"ayah\">﴿tövbesini kabul eder﴾<\/span> kavli ise O'nun fiillerinden bir fiildir."], [1708.6, "Sonra bu şer'î hükmü ve fiili şu kavliyle ta'lîl etti:"], [1712.5, "<span class=\"ayah\">﴿Şüphesiz Allah çok bağışlayandır, çok merhamet edendir﴾<\/span> [Mâide 39]."], [1715.6, "Yani: Gafûr ve Rahîm olduğu için, tövbesi samimi olduğunda hırsızın tövbesini kabul etti."]]}, {"reader": false, "ar": [[1721.0, "فكلُّ أسماء الله عز وجل التي يختم بها كثيرًا من آيات كتابه الكريم إنما يُجريها مجرى التعليل لما ذُكر في هذه الآية،"], [1732.0, "سواءٌ من الأحكام الشرعيّة التي قرّرها أمرًا أو نهيًا،"], [1736.0, "أو من الأفعال التي فعلها."], [1739.0, "وكقول الله عز وجل:"], [1741.9, "<span class=\"ayah\">﴿وَلَا تَقْتُلُوا أَنفُسَكُمْ﴾<\/span>، فعلّل ذلك بقوله:"], [1746.2, "<span class=\"ayah\">﴿إِنَّ اللَّهَ كَانَ بِكُمْ رَحِيمًا﴾<\/span> <span class=\"ref\">[النساء: ٢٩]<\/span>؛"], [1750.0, "فلك أن تقول: أي فلأنه رحيمٌ بكم نهاكم عن قتل أنفسكم."], [1755.0, "وهكذا دواليك في كتاب الله."]], "tr": [[1721.0, "Allah Azze ve Celle'nin, kerim Kitabı'nın ayetlerinin çoğunu kendileriyle bitirdiği bütün isimlerini, o ayette zikredilen şeyler için —ister emir ister nehiy olarak takrir ettiği şer'î hükümlerden, ister yaptığı fiillerden olsun— ta'lîl yerine koyar."], [1737.2, "Allah Azze ve Celle'nin şu kavli gibi:"], [1741.9, "<span class=\"ayah\">﴿Kendinizi öldürmeyin﴾<\/span>. Bunu şu kavliyle ta'lîl etti:"], [1746.2, "<span class=\"ayah\">﴿Şüphesiz Allah size karşı çok merhametlidir﴾<\/span> [Nisâ 29]."], [1750.0, "Şöyle diyebilirsin: Yani size karşı merhametli olduğu için sizi kendinizi öldürmekten nehyetti."], [1755.0, "Allah'ın Kitabı'nda bu böyle devam eder."]]}, {"reader": false, "ar": [[1757.0, "وكذلك قولُه عز وجل:"], [1759.7, "<span class=\"ayah\">﴿وَاسْتَغْفِرُوا اللَّهَ ۖ إِنَّ اللَّهَ غَفُورٌ رَّحِيمٌ﴾<\/span> <span class=\"ref\">[المزمل: ٢٠]<\/span>؛"], [1763.0, "فلك أن تقول: فلأنه غفورٌ رحيمٌ أمركم بالاستغفار ليغفرَ،"], [1768.0, "ليغفرَ لكم. والله أعلم."]], "tr": [[1757.0, "Aynı şekilde O'nun —Azze ve Celle— şu kavli:"], [1759.7, "<span class=\"ayah\">﴿Allah'tan bağışlanma dileyin; şüphesiz Allah çok bağışlayandır, çok merhamet edendir﴾<\/span> [Müzzemmil 20]."], [1763.0, "Şöyle diyebilirsin: Gafûr ve Rahîm olduğu için sizi bağışlamak üzere, sizi bağışlamak üzere istiğfarla emretti. Allah en iyisini bilir."]]}]}, {"ts": "29:32", "title": "8. Külliye: Allah'ın her ismi, O'nun mutlak kemalini kapsar", "paras": [{"reader": false, "ar": [[1772.0, "ومن الكلّيّات أيضًا: <b>كلُّ اسمٍ لله فمستغرِقٌ لكماليّته المطلقة.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span> <b>كلُّ اسمٍ لله عز وجل فمستغرِقٌ لكماليّته المطلقة.<\/b>"]], "tr": [[1772.0, "Külliyelerden biri de şudur: 8."], [1774.0, "külliye: Allah'ın her ismi, O'nun mutlak kemalini kapsar.<b> (Üç kez tekrar ediyor.) <\/b>8."], [1798.0, "külliye: Allah Azze ve Celle'nin her ismi, O'nun mutlak kemalini kapsar."]]}, {"reader": false, "ar": [[1804.0, "أقول وبالله التوفيق: وأظنّ القاعدة واضحة؛"], [1807.0, "فأيُّ اسمٍ نُطلقه لله ـ على الله عز وجل ـ ممّا ثبت إطلاقُه في الكتاب وصحيح السنّة،"], [1814.0, "فالواجبُ علينا (أن نعتقد) أنّ الله عز وجل لم يتسمَّ به إلا لأنه مستغرِقٌ لجميع معانيه."], [1823.0, "ولذلك فإنّ الألف واللام الداخلةَ على أسماء الله عز وجل هي الألفُ واللامُ الاستغراقيّة:"], [1834.0, "فمن أسمائه «العزيز»: المستغرِق لجميع أنواع العزّة،"], [1839.0, "ومن أسمائه «السميع»: الذي له السمعُ المطلق،"], [1844.0, "ومن أسمائه «القدير»: المستغرِق ـ أي المتّصف ـ بجميع أنواع القدرة."]], "tr": [[1804.0, "Tevfik Allah'tandır, derim ki: Zannederim kaide açıktır."], [1807.0, "Allah hakkında —Allah Azze ve Celle hakkında— kullandığımız, kullanılması Kitap'ta ve sahih Sünnet'te sabit olmuş herhangi bir isim için bize vâcip olan şudur:"], [1815.5, "Allah Azze ve Celle'nin o isimle ancak o ismin bütün manalarını kapsadığı için isimlendiğine (inanmak)."], [1823.0, "Bu sebeple Allah Azze ve Celle'nin isimlerine giren elif-lâm, istiğrak (kapsama) elif-lâmıdır."], [1830.0, "O'nun isimlerinden \"el-Azîz\": izzetin bütün türlerini kapsayandır."], [1836.1, "O'nun isimlerinden \"es-Semî'\": mutlak işitme kendisine ait olandır."], [1841.1, "O'nun isimlerinden \"el-Kadîr\": kudretin bütün türlerini kapsayan —yani onlarla muttasıf olan— dır."]]}, {"reader": false, "ar": [[1851.0, "ومن أسمائه «الحيّ»: أي ذو الحياة الكاملة التامّة،"], [1858.0, "التي لا يعتريها نقصٌ بوجهٍ من الوجوه،"], [1861.0, "والتي لم تُسبق بعدمٍ ولا يلحقها زوال."], [1864.0, "ومن أسمائه «القويّ»: المستغرِق لجميع معاني القوّة."], [1870.0, "ومن أسمائه «القيّوم»: المستغرِق لجميع أنواع القيّوميّة،"], [1876.6, "فهو القائم بنفسه، والقائم بكلّ مصالح غيره."], [1883.0, "وهكذا في كلّ أسماء الله عز وجل؛"], [1887.0, "لأنّ الألف واللام الداخلة على أسماء الله عز وجل إنما هي الألفُ واللامُ الاستغراقيّة."], [1896.0, "أنتم فهمتم هذا؟ وهذا واضح."]], "tr": [[1851.0, "O'nun isimlerinden \"el-Hayy\": yani hiçbir yönden eksiklik arız olmayan, öncesinde yokluk bulunmayan ve ardından zeval gelmeyen kâmil ve tam hayat sahibidir."], [1864.0, "O'nun isimlerinden \"el-Kavî\": kuvvetin bütün manalarını kapsayandır."], [1866.2, "O'nun isimlerinden \"el-Kayyûm\": kayyûmiyyetin bütün türlerini kapsayandır;"], [1872.2, "O, kendi zâtıyla kâim olan ve başkasının bütün maslahatlarını ayakta tutandır."], [1883.0, "Allah Azze ve Celle'nin bütün isimlerinde bu böyledir;"], [1887.0, "çünkü Allah Azze ve Celle'nin isimlerine giren elif-lâm ancak istiğrak elif-lâmıdır."], [1896.0, "Bunu anladınız mı? Bu açıktır."]]}]}, {"ts": "31:38", "title": "9. Külliye: Allah'ın bütün isimlerinin gerekleri ve eserleriyle (O'na) kulluk edilir", "paras": [{"reader": false, "ar": [[1898.0, "ومن الكلّيّات أيضًا: <b>كلُّ أسماء الله عز وجل فمتعبَّدٌ بمقتضياتها وآثارها.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[1898.0, "Külliyelerden biri de şudur: 9."], [1900.0, "külliye: Allah Azze ve Celle'nin bütün isimlerinin gerekleri ve eserleriyle (O'na) kulluk edilir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1929.0, "أقول وبالله التوفيق: وهذه الكلّيّة تستغرق حياتنا كلَّها؛"], [1935.0, "فإنّ الله عز وجل إنما خلقنا في أرضه لنتعبّد له بمقتضى أسمائه وصفاته عز وجل."], [1944.0, "فالتعبّدُ لله عز وجل بمقتضيات وآثار أسمائه وصفاته هو موضوعُ حياتنا الذي لا ينقضي،"], [1953.0, "وهو مَوئلُ عزّنا الذي لا يمكن أن ينقضي."], [1956.0, "ولا يمكن للإنسان أبدًا أن يكون ناجيًا في الدارين إلا إذا كان متعبّدًا لله عز وجل بهذه المقتضيات."]], "tr": [[1929.0, "Tevfik Allah'tandır, derim ki: Bu külliye bütün hayatımızı kapsar."], [1935.0, "Zira Allah Azze ve Celle bizi yeryüzünde ancak isim ve sıfatlarının gereğiyle O'na —Azze ve Celle— kulluk edelim diye yarattı."], [1945.9, "Allah Azze ve Celle'ye isim ve sıfatlarının gerekleri ve eserleriyle kulluk etmek, hayatımızın bitmeyen konusudur ve izzetimizin, bitmesi mümkün olmayan sığınağıdır."], [1956.0, "İnsanın, Allah Azze ve Celle'ye bu gereklerle kulluk eden biri olmadıkça iki dünyada kurtuluşa ermesi asla mümkün değildir."]]}, {"reader": false, "ar": [[1968.0, "ولذلك الإمامُ ابن القيّم نبّه على ذلك بقوله:"], [1973.3, "«فرجعت العبوديّةُ كلُّها ـ انتبهوا ـ إلى مقتضى الأسماء والصفات، وارتبطت بها ارتباطَ الخلق بها؛ فخلقُه سبحانه وأمرُه هو موجَبُ أسمائه وصفاته» ـ أي:"], [1992.6, "أنه ما خلق ذلك الخلقَ إلا ليُظهر مقتضياتِ وآثارَ هذه الأسماء والصفات ـ «وصفاتِه في العالم وآثارِها ومقتضياتِها؛ لأنه لا يتزيّن من عباده بطاعتهم، ولا تَشينه معصيتُهم»."], [2011.0, "أي: أنه لم يخلق الخلقَ لمجرّد التعريف به فقط،"], [2015.0, "وإنما خلق هذا الخلقَ ليعبدوه بمقتضى أسمائه وصفاته."]], "tr": [[1968.0, "Bu sebeple İmam İbnü'l-Kayyim şu sözüyle buna dikkat çekmiştir:"], [1973.3, "\"Böylece kulluğun tamamı —dikkat edin— isim ve sıfatların gereğine döndü ve onlara, yaratılışın onlara bağlanması gibi bağlandı."], [1992.6, "O'nun —Sübhânehû— yaratması ve emri, isim ve sıfatlarının gereğidir\" —yani O, bu mahlûkatı ancak bu isim ve sıfatların gereklerini ve eserlerini ortaya çıkarmak için yarattı— \"…ve sıfatlarının âlemdeki (gereği), eserleri ve gerekleridir."], [2011.0, "Çünkü O, kullarının taatiyle süslenmez, onların isyanı da O'nu lekelemez.\" Yani O, mahlûkatı sadece kendisini tanıtmak için yaratmadı;"], [2015.7, "bilakis bu mahlûkatı, isim ve sıfatlarının gereğiyle kendisine ibadet etsinler diye yarattı."]]}, {"reader": false, "ar": [[2023.0, "وبناءً على ذلك: فإذا علم العبدُ بأنّ ربَّه هو «العليم» اسمًا،"], [2031.0, "وذو العلم صفةً، فإنّ ذلك يُثمر له توحيدَه في… ـ عفوًا ـ فإنّ ذلك يُثمر له مراقبةَ الله عز وجل في السرّ والعلانية،"], [2043.0, "وأنّ الله عز وجل لا يخفى على علمه مثقالُ ذرّةٍ في السماوات ولا في الأرض،"], [2050.0, "وأنه يعلم ما في الصدور،"], [2053.4, "و<span class=\"ayah\">﴿يَعْلَمُ السِّرَّ وَأَخْفَى﴾<\/span> <span class=\"ref\">[طه: ٧]<\/span>،"], [2055.7, "و<span class=\"ayah\">﴿يَعْلَمُ خَائِنَةَ الْأَعْيُنِ﴾<\/span> <span class=\"ref\">[غافر: ١٩]<\/span>."]], "tr": [[2023.0, "Buna binaen kul, Rabbinin isim olarak \"el-Alîm\", sıfat olarak da ilim sahibi olduğunu bildiğinde, bu ona O'nun tevhidini… —affedersiniz— bu ona gizlide ve açıkta Allah Azze ve Celle'yi murakabe etmeyi kazandırır."], [2037.7, "(Ayrıca) göklerde ve yerde zerre ağırlığınca bir şeyin Allah Azze ve Celle'nin ilminden gizli kalmadığını, O'nun göğüslerde olanı bildiğini, <span class=\"ayah\">﴿gizliyi ve daha gizlisini bildiğini﴾<\/span> [Tâhâ 7] ve <span class=\"ayah\">﴿gözlerin hain bakışını bildiğini﴾<\/span> [Mü'min 19] (bilmeyi kazandırır)."]]}, {"reader": false, "ar": [[2059.0, "وهذا يُثمر له جهةً تعبّديّةً أيضًا،"], [2064.0, "وهي: أنه يحفظ لسانَه وجوارحَه وخطراتِ قلبه عن كلّ ما لا يُرضي الله تعالى،"], [2071.0, "وأن يجعل تعلّقَ هذه الأعضاء بما يحبّه الله ويرضاه؛"], [2076.0, "فيُثمر له ذلك الحياءَ باطنًا وظاهرًا،"], [2081.0, "ويُثمر له اجتنابَ المحرّمات والقبائح."], [2085.0, "وهذه كلُّها تعبّداتٌ من ثمرات اسمه العليم والسميع والبصير."]], "tr": [[2059.0, "Bu ona bir kulluk yönü de kazandırır:"], [2064.5, "Dilini, azalarını ve kalbinin düşüncelerini Allah Teâlâ'yı razı etmeyen her şeyden korur ve bu azaların ilgisini Allah'ın sevdiği ve razı olduğu şeylere yöneltir."], [2076.0, "Bu da ona içte ve dışta hayâ kazandırır;"], [2081.0, "haramlardan ve çirkin şeylerden kaçınmayı kazandırır."], [2085.0, "Bunların hepsi O'nun el-Alîm, es-Semî' ve el-Basîr isminin meyvelerinden olan kulluklardır."]]}]}, {"ts": "34:52", "title": "9. Külliye (devam): Allah, er-Rakîb, el-Gafûr, el-Kavî, el-Kayyûm ve el-Kadîr isimlerinin kulluktaki meyveleri", "paras": [{"reader": false, "ar": [[2092.0, "وإذا علمتَ أنّ من أسماء ربّك «الله» ـ أي:"], [2098.8, "ذو الألوهيّة الكاملة ـ فإنّ ذلك يُثمر لك توحيدَه في أنواع التوحيد،"], [2106.0, "ويُثمر لك نبذَ كلّ معبودٍ دونه،"], [2110.0, "ويُثمر لك أنّ كلَّ ما عُبد من دون الإله عز وجل فإنما عُبد بالتزوير والباطل والكذب والعناد والبهتان والإفك."], [2124.0, "وكلُّ ذلك ممّا يُثمره إيمانُك بأنّ الله عز وجل هو «الله»،"], [2130.0, "أي: المستحقّ للعبادة دون ما سواه."], [2133.0, "فنحن نركع له لأنه الله،"], [2135.8, "ونسجد له لأنه الله،"], [2138.0, "ونخصّه بالدعاء لأنه الله،"], [2140.7, "ونخصّه بالاستغاثة وغيرها من أنواع التعبّدات لأنه الله."]], "tr": [[2092.0, "Rabbinin isimlerinden birinin \"Allah\" —yani kâmil ulûhiyyet sahibi— olduğunu bildiğinde, bu sana tevhidin türlerinde O'nu birlemeyi kazandırır;"], [2098.8, "O'ndan başka her ma'budu atmayı kazandırır;"], [2101.6, "Allah Azze ve Celle'den başka ibadet edilen her şeyin ancak sahtekârlık, bâtıl, yalan, inat, bühtan ve iftirayla ibadet edildiğini (bilmeyi) kazandırır."], [2112.5, "Bunların hepsi, Allah Azze ve Celle'nin \"Allah\" —yani O'ndan başkası değil, ibadete layık olan— olduğuna imanının kazandırdığı şeylerdendir."], [2124.0, "Biz O'na rükû ederiz, çünkü O Allah'tır;"], [2130.5, "O'na secde ederiz, çünkü O Allah'tır;"], [2133.0, "duayı O'na tahsis ederiz, çünkü O Allah'tır;"], [2136.9, "istiğâseyi (yardım dilemeyi) ve diğer kulluk türlerini O'na tahsis ederiz, çünkü O Allah'tır."]]}, {"reader": false, "ar": [[2146.0, "وإذا آمنتَ بأنّ الله من أسمائه «الرقيب» فإنّ ذلك يُثمر لك أن تبتعد عن معصية السرّ."], [2155.0, "وإذا آمنتَ بأنّ الله هو «الغفور الرحيم الغفّار» فإنّ ذلك يُثمر لك ألّا تقنط من رحمة هذا الغفور،"], [2168.1, "وألّا تيأس من رَوحه."], [2170.0, "وإذا آمنتَ بأنّ الله هو «القويّ» اسمًا،"], [2173.0, "فإنّ ذلك يُثمر لك قوّةَ الاعتماد على هذا الربّ القويّ،"], [2178.0, "وأنّ كلّ قوّةٍ في هذا العالم تضمحلّ أمام هذه القوّة المطلقة."], [2185.0, "فهذا المشهدُ الذي نراه لا يُدبّره هؤلاء الطغاة،"], [2190.0, "وإنما وراء هذا المشهد الذي تُطالعه أعيننا ربٌّ عظيمٌ قادرٌ قويٌّ،"], [2196.0, "هو الذي يُدبّر بأمره،"], [2197.9, "<span class=\"ayah\">﴿لَا مُعَقِّبَ لِحُكْمِهِ﴾<\/span> <span class=\"ref\">[الرعد: ٤١]<\/span> عز وجل."]], "tr": [[2146.0, "Allah'ın isimlerinden birinin \"er-Rakîb\" (gözetleyen) olduğuna iman ettiğinde, bu sana gizli günahtan uzak durmayı kazandırır."], [2155.0, "Allah'ın \"el-Gafûr, er-Rahîm, el-Gaffâr\" olduğuna iman ettiğinde, bu sana bu çok bağışlayanın rahmetinden ümit kesmemeyi ve O'nun rahmetinden (ravh) ümitsiz olmamayı kazandırır."], [2170.0, "Allah'ın isim olarak \"el-Kavî\" olduğuna iman ettiğinde, bu sana bu kuvvetli Rabbe güçlü bir dayanmayı ve bu âlemdeki her kuvvetin bu mutlak kuvvet karşısında yok olup gittiğini (bilmeyi) kazandırır."], [2185.0, "Gördüğümüz bu manzarayı bu tâğutlar (zorbalar) idare etmiyor;"], [2188.8, "bilakis gözlerimizin seyrettiği bu manzaranın ardında büyük, kâdir, kavî bir Rab vardır;"], [2194.5, "emriyle idare eden O'dur. <span class=\"ayah\">﴿O'nun hükmünü geri çevirecek yoktur﴾<\/span> [Ra'd 41], Azze ve Celle."]]}, {"reader": false, "ar": [[2200.0, "وإذا آمنتَ بأنّ ربّك هو «القيّوم» فإنّ ذلك يُثمر لك حسنَ التوكّل عليه في طلب أرزاقك،"], [2207.0, "وأنّ الله عز وجل بيده كلُّ شيء،"], [2211.0, "وهو الذي يقوم بأرزاقك،"], [2212.7, "وهو الذي يهديك، وهو الذي يفتح لك سُبلَ أبواب الرزق."], [2218.0, "وإذا آمنتَ بأنّ ربّك هو «القدير» فإنّ ذلك يُثمر لك أن تسأله كلَّ ما يتعلّق بمصالح دينك ودنياك،"], [2226.0, "وأنت مؤمنٌ بأنه لا يُعجزه شيءٌ في السماوات ولا في الأرض."]], "tr": [[2200.0, "Rabbinin \"el-Kayyûm\" olduğuna iman ettiğinde, bu sana rızıklarını talep etmede O'na güzelce tevekkül etmeyi kazandırır;"], [2206.1, "Allah Azze ve Celle'nin elinde her şeyin bulunduğunu, rızıklarını üstlenenin O olduğunu, sana yol gösterenin O olduğunu ve sana rızık kapılarının yollarını açanın O olduğunu (bilmeyi kazandırır)."], [2218.0, "Rabbinin \"el-Kadîr\" olduğuna iman ettiğinde, bu sana dininin ve dünyanın maslahatlarıyla ilgili her şeyi O'ndan istemeyi kazandırır;"], [2225.0, "hem de göklerde ve yerde hiçbir şeyin O'nu âciz bırakamayacağına iman etmiş olarak."]]}, {"reader": false, "ar": [[2231.0, "وهذه القاعدة لا بدّ أن نُطيل عندها كثيرًا،"], [2235.0, "ولكنّني أدلّكم على الكتب التي تشرح أسماء الله عز وجل."], [2240.0, "فإنّنا إذا آمنّا بأسماء الله تنظيرًا فلا بدّ أن نعرف ما يدخل تحتها من المقتضيات والآثار،"], [2248.0, "حتى نجعلها موضوعَ تعبّدنا في حياتنا."], [2251.0, "فالمطلوبُ من أسماء الله عز وجل ليس هو الإيمانَ بها فقط،"], [2255.0, "وليس الإيمانَ بصفاتها فقط،"], [2258.0, "بل مطلوبٌ منّا أيضًا أمرٌ ثالث،"], [2260.0, "وهو أن نتعبّد لله عز وجل بمقتضياتها وآثارها. والله أعلم."]], "tr": [[2231.0, "Bu kaidenin yanında çokça durmamız gerekir;"], [2234.0, "fakat size Allah Azze ve Celle'nin isimlerini şerh eden kitapları gösteriyorum."], [2240.0, "Allah'ın isimlerine nazarî olarak iman ettiğimizde, onların altına giren gerekleri ve eserleri de bilmemiz gerekir;"], [2245.6, "ta ki onları hayatımızda kulluğumuzun konusu yapalım."], [2247.2, "Allah Azze ve Celle'nin isimlerinden istenen sadece onlara iman etmek değildir;"], [2251.0, "sadece onların sıfatlarına iman etmek de değildir."], [2253.5, "Bilakis bizden üçüncü bir şey de istenir:"], [2257.2, "O da Allah Azze ve Celle'ye onların gerekleri ve eserleriyle kulluk etmemizdir. Allah en iyisini bilir."]]}]}, {"ts": "37:45", "title": "10. Külliye: Allah'ı, O'na vâcip olan isim ve sıfatlardan bir şeyden ta'til eden herkes, O'na ibadetin hakikatine ulaşmaktan mahrumdur", "paras": [{"reader": false, "ar": [[2265.0, "ومن الكلّيّات أيضًا ـ وهي الكلّيّة العاشرة ـ:"], [2272.0, "<b>كلُّ من عطّل اللهَ عن شيءٍ ممّا يجب له من الأسماء والصفات فمحرومٌ من الوصول لحقيقة عبادته.<\/b> <span class=\"note\">(يكررها)<\/span> فمحرومٌ من الوصول لحقيقة التعبّد،"], [2305.0, "أو لحقيقة عبادته، كلا الأمرين صحيح."], [2309.0, "أُعيده مرّةً ثالثة: <b>كلُّ من عطّل اللهَ عن شيءٍ ممّا يجب له من الأسماء والصفات فمحرومٌ من الوصول لحقيقة عبادته.<\/b>"]], "tr": [[2265.0, "Külliyelerden biri de —ki bu 10."], [2272.0, "külliyedir— şudur: <b>10. külliye: Allah'ı, O'na vâcip olan isim ve sıfatlardan herhangi bir şeyden ta'til eden herkes, O'na ibadetin hakikatine ulaşmaktan mahrumdur.<\/b> (Tekrar ediyor.) Kulluğun hakikatine veya O'na ibadetin hakikatine ulaşmaktan mahrumdur;"], [2306.3, "her ikisi de doğrudur. Üçüncü kez tekrar ediyorum:"], [2310.0, "<b>10. külliye: Allah'ı, O'na vâcip olan isim ve sıfatlardan herhangi bir şeyden ta'til eden herkes, O'na ibadetin hakikatine ulaşmaktan mahrumdur.<\/b>"]]}, {"reader": false, "ar": [[2319.0, "أقول وبالله التوفيق: فلا يُحسّ الإنسانُ بلذّة التعبّد لربّه عز وجل إلا إذا أثبت له ما أثبته لنفسه من الأسماء والصفات،"], [2330.1, "أو أثبته له نبيُّه صلى الله عليه وسلم."], [2333.0, "ومتى ما انتقص العبدُ شيئًا من ذلك،"], [2335.2, "فلم يؤمن به، أو حرّفه،"], [2336.8, "أو عطّله، أو أنكره،"], [2338.0, "فإنه سيُحرم من حقيقة التعبّد بقدر ما خرج من هذا الإيمان الواجب عليه."]], "tr": [[2319.0, "Tevfik Allah'tandır, derim ki: İnsan, Rabbine —Azze ve Celle— kulluk etmenin lezzetini ancak O'nun kendisi için isbat ettiği veya Peygamberi sallallâhu aleyhi ve sellem'in O'nun için isbat ettiği isim ve sıfatları O'nun için isbat ettiğinde hisseder."], [2333.0, "Kul bunlardan bir şeyi eksiltip ona iman etmediğinde, onu tahrif ettiğinde, ta'til ettiğinde veya inkâr ettiğinde, üzerine vâcip olan bu imandan çıktığı ölçüde kulluğun hakikatinden mahrum kalacaktır."]]}, {"reader": false, "ar": [[2345.0, "قال الإمام الدارميّ رحمه الله في ردّه على بشرٍ المريسيّ،"], [2350.0, "قال: «ولن يدخل الإيمانُ قلبَ رجلٍ حتى يعلم أنّ الله لم يزل إلهًا واحدًا بجميع أسمائه وجميع صفاته، لم يحدث له منها شيء، كما لم تزل وحدانيّتُه»."], [2366.0, "انتهى كلامه. وكلامُه واضحٌ في ربط حقيقة التعبّد بالإيمان بأسماء الله وصفاته."]], "tr": [[2345.0, "İmam ed-Dârimî —Allah ona rahmet etsin— Bişr el-Merîsî'ye reddiyesinde şöyle dedi:"], [2350.5, "\"Bir adam, Allah'ın bütün isimleri ve bütün sıfatlarıyla ezelden beri tek bir ilâh olduğunu, bunlardan hiçbirinin O'nun için sonradan meydana gelmediğini, tıpkı vahdâniyyetinin ezelden beri olduğu gibi (olduğunu) bilmedikçe, iman onun kalbine asla girmez.\" Sözü bitti."], [2367.0, "Onun sözü, kulluğun hakikatini Allah'ın isim ve sıfatlarına imana bağlama konusunda açıktır."]]}, {"reader": false, "ar": [[2373.0, "ويُوضّح ذلك أكثرَ نقلٌ عن الإمام ابن القيّم رحمه الله تعالى في بيان الحُجُب التي تحجب القلبَ عن الله ـ وهو موضوعٌ عظيمٌ أنصحكم أن ترجعوا له في «مدارج السالكين» ـ قال رحمه الله:"], [2389.8, "«والحُجُب عشرة: حجابُ التعطيل ونفي حقائق الأسماء والصفات، وهو أغلظُها؛ فلا يتهيّأ لصاحب هذا الحجاب أن يعرف الله ولا يصل إليه البتّة، إلا كما يتهيّأ للحجر أن يصعد إلى السماء». انتهى كلامه."]], "tr": [[2373.0, "Bunu daha da açıklayan, İmam İbnü'l-Kayyim'den —Allah Teâlâ ona rahmet etsin— kalbi Allah'tan perdeleyen perdeleri açıkladığı yerdeki bir nakildir —bu büyük bir konudur;"], [2384.4, "size onu \"Medâricü's-sâlikîn\"de incelemenizi tavsiye ederim—."], [2386.4, "(İbnü'l-Kayyim) —Allah ona rahmet etsin— şöyle dedi:"], [2389.8, "\"Perdeler ondur: (Birincisi) ta'til ve isim ve sıfatların hakikatlerini nefyetme perdesidir."], [2401.1, "Bu, onların en kalınıdır. Bu perdenin sahibinin Allah'ı tanıması ve O'na ulaşması, ancak taşın göğe yükselmesinin mümkün olduğu kadar mümkündür (yani asla mümkün değildir).\" Sözü bitti."]]}]}, {"ts": "40:16", "title": "10. Külliye (devam): Muattılın kulluğun hakikatinden mahrumiyeti — İbnü'l-Kayyim'den nakiller ve kapanış", "paras": [{"reader": false, "ar": [[2416.0, "فكما أنّ الحجر لا يمكن أن يصعد إلى السماء،"], [2419.0, "فكذلك القلبُ الذي عطّل اللهَ عز وجل عن شيءٍ من أسمائه وصفاته،"], [2425.0, "فإنه لا يمكن أن يطير إلى الله،"], [2427.0, "ولا يمكن أن يعرف حقيقةَ التعبّد أبدًا."]], "tr": [[2416.0, "Taşın göğe yükselmesi nasıl mümkün değilse, Allah Azze ve Celle'yi isim ve sıfatlarından bir şeyden ta'til eden kalbin de Allah'a uçması mümkün değildir ve kulluğun hakikatini asla tanıyamaz."]]}, {"reader": false, "ar": [[2429.0, "ويُوضّح ذلك الإمامُ ابن القيّم أيضًا في قوله:"], [2434.0, "«وإنّ من رام الحقّ لَيُقرّ بأنّ حقيقة التعبّد» ـ انتبهوا ـ والذي من ثماره المحبّةُ والإنابةُ والتوكّلُ ومقامُ الإحسان،"], [2446.0, "هذا حقيقةٌ ممتنعةٌ على المعطّل."], [2450.0, "المعطّل ممتنعٌ عليه هذا؛"], [2453.0, "حقيقةُ التعبّد ممتنعةٌ على المعطّل."], [2455.0, "كيف يعبد اللهَ وهو يُعطّله عن سمعه،"], [2459.0, "ويُعطّله عن بصره، ويُعطّله عن استوائه،"], [2464.0, "ويُعطّله عن قوّته وقدرته،"], [2467.0, "ويقول: الله لا يُسمّى باسمٍ إلا مجازًا،"], [2471.0, "ولا يُوصف بصفةٍ إلا مجازًا؟!"], [2473.0, "فكيف تريد من قلب هذا المعطّل أن يطير إلى الله،"], [2477.0, "أو أن يستلذّ بعبادة الله عز وجل،"], [2480.0, "وهو قد عطّله عن أسمائه وصفاته؟!"], [2482.0, "هذا لا يمكن أبدًا،"], [2485.0, "ولا يُطلب من الشوك العنب <span class=\"q\">؟ 41:25<\/span>."]], "tr": [[2429.0, "İmam İbnü'l-Kayyim bunu şu sözüyle de açıklar:"], [2434.0, "\"Hakkı isteyen kimse şunu mutlaka ikrar eder ki kulluğun hakikati\" —dikkat edin— ki meyvelerinden muhabbet, inâbe, tevekkül ve ihsan makamıdır;"], [2445.5, "bu, muattıl için imkânsız bir hakikattir."], [2450.0, "Muattıl için bu imkânsızdır; kulluğun hakikati muattıl için imkânsızdır."], [2455.0, "O'nu işitmesinden ta'til ederken, görmesinden ta'til ederken, istivâsından ta'til ederken, kuvvetinden ve kudretinden ta'til ederken ve \"Allah ancak mecazen bir isimle isimlendirilir, ancak mecazen bir sıfatla nitelenir\" derken Allah'a nasıl ibadet eder?!"], [2473.0, "O hâlde, O'nu isim ve sıfatlarından ta'til etmişken, bu muattılın kalbinin Allah'a uçmasını veya Allah Azze ve Celle'ye ibadetten lezzet almasını nasıl istersin?!"], [2482.0, "Bu asla mümkün değildir; dikenden üzüm istenmez <span class=\"q\">؟<\/span>."]]}, {"reader": false, "ar": [[2487.0, "يقول ابن القيّم رحمه الله مرّةً أخرى:"], [2491.7, "«وإنّ من رام الحقّ لَيُقرّ بأنّ حقيقة التعبّد ممتنعةٌ على المعطّل؛ إذ كيف تصعد القلوبُ إلى من ليس داخلَ العالم ولا خارجَه، ولا متّصلًا به ولا منفصلًا عنه» ـ وهو يحكي عقيدتَه ـ «وكيف تألَهُ القلوبُ من لا يسمع كلامَها، ولا يرى مكانَها، ولا يُحِبّ ولا يُحَبّ، ولا يقوم به فعلٌ مطلقًا، ولا يتكلّم ولا يُكلِّم، ولا يقرب منه شيءٌ ولا يقرب من شيء، ولا يقوم به رأفةٌ ولا رحمةٌ ولا حنان، ولا له حكمةٌ ولا غايةٌ يفعل ويأمر لأجلها» ـ وهو يحكي عقائدَه."]], "tr": [[2487.0, "İbnü'l-Kayyim —Allah ona rahmet etsin— bir kez daha şöyle der:"], [2491.7, "\"Hakkı isteyen kimse, kulluğun hakikatinin muattıl için imkânsız olduğunu mutlaka ikrar eder."], [2497.5, "Zira kalpler, ne âlemin içinde ne dışında, ne ona bitişik ne ondan ayrı olana nasıl yükselir?\" —(burada) onun akîdesini hikâye ediyor— \"Kalpler;"], [2508.3, "onların sözünü işitmeyen, yerlerini görmeyen, sevmeyen ve sevilmeyen, kendisiyle hiçbir şekilde bir fiil kâim olmayan, konuşmayan ve konuşturmayan, kendisine hiçbir şey yaklaşmayan ve kendisi de hiçbir şeye yaklaşmayan, kendisiyle şefkat, rahmet ve merhamet kâim olmayan, uğruna iş yaptığı ve emrettiği bir hikmeti ve gayesi bulunmayan birine nasıl ilâh olarak bağlanır?\" —(burada) onların akîdelerini hikâye ediyor."]]}, {"reader": false, "ar": [[2543.0, "كيف تريدون أيّها المعطّلة من قلوبكم أن تستلذّ بعبادة الله،"], [2547.5, "وأن تقفز طائرةً إلى الله عز وجل،"], [2550.0, "مستلذّةً بعبادته والقربِ منه،"], [2553.0, "وأنتم تُنكرون ذلك وتُعطّلونه؟!"], [2555.0, "«بل كيف تألَهُ القلوبُ من لا يرضى» ـ ينفون صفةَ الرضا عنه ـ «ولا يغضب، ولا يفرح، ولا يضحك؟! فسبحان من حال بين المعطّلة وبين محبّته ومعرفته، والسرورِ والفرحِ به، والشوقِ إلى لقائه، وانتظارِ لذّة النظر إلى وجهه الكريم، والتمتّعِ بخطابه في محلّ كرامته ودار ثوابه»."]], "tr": [[2543.0, "Ey muattıla! Siz bunu inkâr edip ta'til ederken, kalplerinizin Allah'a ibadetten lezzet almasını, ibadetinden ve O'na yakınlıktan lezzet alarak Allah Azze ve Celle'ye doğru uçarcasına sıçramasını nasıl istersiniz?!"], [2555.0, "\"Bilakis kalpler, razı olmayan\" —O'ndan rıza sıfatını nefyediyorlar— \"gazap etmeyen, sevinmeyen, gülmeyen birine nasıl ilâh olarak bağlanır?!"], [2566.3, "Muattıla ile O'nun muhabbeti, O'nu tanıma, O'nunla sevinç ve ferah duyma, O'na kavuşmayı özleme, kerim yüzüne bakmanın lezzetini bekleme ve ikram mahallinde ve sevap yurdunda O'nun hitabından zevk alma arasına giren (Allah) münezzehtir.\""]]}, {"reader": false, "ar": [[2588.0, "«فلو رآها» ـ أي: لو رأى اللهُ هذه القلوب ـ يقول:"], [2593.5, "«فلو رآها أهلًا لذلك لمنّ عليها به وأكرمها به؛ إذ ذاك أعظمُ كرامةٍ يُكرم اللهُ بها عبدَه» ـ يعني:"], [2603.4, "أن يفتح فيما بينك وبينه الحُجُب،"], [2606.0, "هذه أعظمُ كرامة ـ «إذ ذاك» ـ أي:"], [2609.9, "فتحُ الحجاب فيما بينك وبينه بمعرفة أسمائه وصفاته ـ «إذ ذاك أعظمُ كرامةٍ يُكرم بها عبدَه، والله أعلمُ حيث يجعل كرامتَه ويضع نعمتَه». انتهى كلامه."]], "tr": [[2588.0, "\"Eğer onları görseydi\" —yani Allah bu kalpleri görseydi— diyor ki:"], [2589.9, "\"Eğer onları buna ehil görseydi, bunu onlara lütfeder ve onlara bununla ikram ederdi."], [2596.0, "Zira bu, Allah'ın kuluna ikram ettiği en büyük kerâmettir\" —yani seninle O'nun arasındaki perdeleri açması;"], [2603.4, "bu en büyük kerâmettir— \"Zira bu\" —yani isim ve sıfatlarını tanımakla seninle O'nun arasındaki perdenin açılması— \"kuluna ikram ettiği en büyük kerâmettir."], [2615.1, "Allah, kerâmetini nereye koyacağını ve nimetini nereye vereceğini daha iyi bilir.\" Sözü bitti."]]}, {"reader": false, "ar": [[2623.0, "ولذلك من أعرض عن الإيمان بهذا الباب،"], [2627.0, "ولم يعرف ربَّه عز وجل بمقتضى أسمائه وصفاته،"], [2632.0, "فإنّ قلبه محجوبٌ عن حقيقة عبادته،"], [2635.1, "مطرودٌ عن رحمته، لم يرَه الله عز وجل مستحقًّا لهذا الفضل العظيم."]], "tr": [[2623.0, "Bu sebeple kim bu babdaki imandan yüz çevirir ve Rabbini —Azze ve Celle— isim ve sıfatlarının gereğiyle tanımazsa, onun kalbi O'na ibadetin hakikatinden perdelenmiş, O'nun rahmetinden kovulmuştur;"], [2637.0, "Allah Azze ve Celle onu bu büyük fazla layık görmemiştir."]]}, {"reader": false, "ar": [[2642.0, "قال ابن القيّم رحمه الله تعالى في نقلٍ أختم به:"], [2646.0, "«الجُهّالُ بالله وأسمائه وصفاته، المعطّلون لحقائقها، يُبغّضون اللهَ إلى خلقه، ويقطعون عليهم طريقَ محبّته والتودّدِ إليه بطاعته، من حيث لا يعلمون»."], [2662.0, "فكم علّم هؤلاء ـ علماءُ السوء ـ العامّةَ هذا التعطيلَ!"], [2666.0, "وكم نشروه فيما بينهم!"], [2668.0, "فحقيقةُ تعليم المعطّل: تعطيلُه لغيره،"], [2671.0, "وحقيقةُ تعليم المحرّف: تحريفُه لغيره،"], [2675.0, "إنما ليحجب قلوبَ أتباعه عن الوصول لله عز وجل."]], "tr": [[2642.0, "İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— kendisiyle bitireceğim bir nakilde şöyle der:"], [2646.0, "\"Allah'ı, isimlerini ve sıfatlarını bilmeyen, onların hakikatlerini ta'til edenler, farkında olmadan Allah'ı mahlûkatına sevimsiz gösterir ve O'nun muhabbetinin ve taatiyle O'na sevgi göstermenin yolunu onlara keserler.\" Bu kötü âlimler halka bu ta'tili ne çok öğrettiler!"], [2666.0, "Onu kendi aralarında ne çok yaydılar!"], [2668.0, "Muattılın öğretmesinin hakikati, başkasına ta'tilini (aktarması)dır;"], [2669.8, "muharrifin öğretmesinin hakikati, başkasına tahrifini (aktarması)dır;"], [2673.4, "(bu da) ancak tâbilerinin kalplerini Allah Azze ve Celle'ye ulaşmaktan perdelemek içindir."]]}, {"reader": false, "ar": [[2679.0, "فنسأل الله عز وجل أن يشرح صدورَنا وصدورَكم للحقّ،"], [2683.1, "وألّا يحرمنا هذه النعمةَ العظيمة،"], [2685.0, "وهي معرفتُه بمقتضى أسمائه وصفاته."], [2688.0, "وآخرُ دعوانا أنِ الحمدُ لله ربِّ العالمين،"], [2690.0, "وصلّى الله وسلّم على نبيّنا محمّدٍ وعلى آله وصحبه أجمعين."]], "tr": [[2679.0, "Allah Azze ve Celle'den bizim ve sizin göğüslerinizi hakka açmasını ve bizi bu büyük nimetten —ki o, isim ve sıfatlarının gereğiyle O'nu tanımaktır— mahrum etmemesini dileriz."], [2688.0, "Son duamız, âlemlerin Rabbi Allah'a hamd olsun (demektir)."], [2690.0, "Allah Peygamberimiz Muhammed'e, âline ve ashâbının hepsine salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
