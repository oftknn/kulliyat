<script>
const D={"no": 81, "vid": "XkbkL3OEQDc", "title_ar": "الدرس (٨١) من شرح كليات العقيدة — كليات باب الإيمان: الرد على أدلة المرجئة في إخراج العمل عن الإيمان", "title_tr": "Şerhu Külliyyâti'l-Akîde — 81. Ders: İman Babının Külliyeleri (Mürcie'nin Ameli İmandan Çıkarma Delillerine Cevaplar)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Azaların amelini imanın hakikatinden çıkaran herkes Mürcie'dendir", "paras": [{"reader": false, "ar": [[0.0, "بسم الله الرحمن الرحيم،"], [1.4, "الحمدُ لله ربِّ العالمين،"], [2.9, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.0, "وعلى آله وأصحابه ومن تبعهم بإحسانٍ إلى يوم الدين،"], [8.3, "أمّا بعد: نُكمِّل ـ إن شاء الله ـ ما تبقّى من كلّيّات الإيمان."], [14.8, "الكلّيّة الأولى: كلُّ من أخرج أعمالًا،"], [18.6, "<b>كلُّ من أخرج عملَ الجوارح عن حقيقة الإيمان فمن المرجئة.<\/b> <span class=\"note\">(يكررها مرتين)<\/span>"]], "tr": [[0.0, "Rahmân ve Rahîm olan Allah'ın adıyla."], [1.8, "Âlemlerin Rabbi Allah'a hamd olsun."], [3.2, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.0, "Bundan sonra: İnşallah iman külliyelerinden geri kalanları tamamlıyoruz."], [14.8, "<b>1. külliye:<\/b> Amelleri çıkaran herkes, <b>azaların amelini imanın hakikatinden çıkaran herkes Mürcie'dendir.<\/b> (İki kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[44.0, "أقول وبالله التوفيق: وهذه هي الصفةُ التي تجمع المرجئةَ جميعًا،"], [51.0, "وهي أنّ المرجئة متّفقون على أنّ العمل ليس داخلًا في حقيقة الإيمان،"], [55.5, "ولا ركنًا من أركانه."], [57.0, "وبناءً على ذلك فالجهميّة ـ أتباعُ الجهم بن صفوان ـ من المرجئة؛"], [66.0, "لأنهم يُخرجون العملَ عن دائرة الإيمان،"], [68.5, "ويجعلون الإيمانَ مطلقَ المعرفة كما قدّمنا."], [71.0, "وكذلك الأشاعرة ـ أتباعُ أبي الحسن الأشعريّ رحمه الله تعالى ـ أيضًا من المرجئة؛"], [80.0, "لأنهم يُخرجون العملَ عن دائرة الإيمان،"], [83.3, "ويجعلون الإيمانَ عبارةً عن التصديق."], [86.0, "وهذا قولُ أغلب الأشاعرة،"], [89.0, "وإن كان المعروفُ عن أبي الحسن رحمه الله تعالى في آخر حياته أنه قال بأنّ الإيمان قولٌ وعمل،"], [98.8, "اعتقادٌ وعمل؛ ولكنّ أغلبَ الأشاعرة على أنّ الإيمان مجرّدُ التصديق،"], [104.0, "كما قاله محقّقوهم في ذلك."]], "tr": [[44.0, "Tevfik Allah'tandır, derim ki: Bu, Mürcie'nin hepsini bir araya getiren vasıftır;"], [51.0, "o da Mürcie'nin, amelin imanın hakikatine dahil olmadığında ve onun rükünlerinden bir rükün olmadığında ittifak etmeleridir."], [57.0, "Buna binaen Cehmiyye —Cehm b."], [59.8, "Safvân'ın takipçileri— Mürcie'dendir; çünkü onlar ameli iman dairesinden çıkarırlar ve daha önce belirttiğimiz gibi imanı mutlak ma'rifet sayarlar."], [71.0, "Aynı şekilde Eş'arîler —Ebü'l-Hasen el-Eş'arî'nin, Allah Teâlâ ona rahmet etsin, takipçileri— de Mürcie'dendir;"], [80.0, "çünkü onlar ameli iman dairesinden çıkarırlar ve imanı tasdikten ibaret sayarlar."], [86.0, "Bu, Eş'arîlerin çoğunun görüşüdür; her ne kadar Ebü'l-Hasen'den —Allah Teâlâ ona rahmet etsin— hayatının sonunda imanın söz ve amel, itikad ve amel olduğunu söylediği bilinse de."], [100.0, "Fakat Eş'arîlerin çoğu, muhakkiklerinin bu konuda söylediği gibi, imanın sadece tasdik olduğu görüşündedir."]]}, {"reader": false, "ar": [[108.0, "فإذا وصفنا الأشاعرةَ بأنهم من المرجئة فإنه يُعتبر وصفًا صحيحًا؛"], [113.6, "لأنهم يُخرجون العملَ عن دائرة الإيمان."], [117.0, "وكذلك يصحّ لنا أن نقول بأنّ الماتريديّة أيضًا من المرجئة؛"], [123.0, "لأنهم يُخرجون العملَ عن دائرة الإيمان كالأشاعرة."], [128.0, "ويصحّ لنا أيضًا أن نقول بأنّ الكرّاميّة من المرجئة؛"], [135.0, "لأنّ الكرّاميّة يُخرجون العملَ عن دائرة الإيمان."], [141.0, "ويصحّ لنا أيضًا أن نقول بأنّ مرجئةَ الفقهاء ـ رحمهم الله تعالى ـ من المرجئة؛"], [151.4, "لأنهم يُخرجون العملَ عن دائرة الإيمان."], [156.0, "فكلُّ من أخرج العملَ عن دائرة الإيمان فإنه يوصف بأنه من المرجئة."]], "tr": [[108.0, "Eş'arîleri Mürcie'den olmakla vasıflandırdığımızda bu doğru bir vasıflandırma sayılır;"], [113.6, "çünkü onlar ameli iman dairesinden çıkarırlar."], [117.0, "Aynı şekilde Mâtürîdîlerin de Mürcie'den olduğunu söylememiz doğrudur;"], [123.0, "çünkü onlar da Eş'arîler gibi ameli iman dairesinden çıkarırlar."], [129.4, "Kerrâmiyye'nin Mürcie'den olduğunu söylememiz de doğrudur;"], [135.0, "çünkü Kerrâmiyye ameli iman dairesinden çıkarır."], [141.0, "Fukahâ Mürcie'sinin —Allah Teâlâ onlara rahmet etsin— Mürcie'den olduğunu söylememiz de doğrudur;"], [151.4, "çünkü onlar da ameli iman dairesinden çıkarırlar."], [156.0, "O hâlde ameli iman dairesinden çıkaran herkes Mürcie'den olmakla vasıflandırılır."]]}, {"reader": false, "ar": [[164.0, "وقد عرّف العلماءُ الإرجاءَ بأنه التأخير،"], [168.0, "والمقصودُ به اصطلاحًا: إخراجُ العمل عن دائرة الإيمان؛"], [176.0, "فيقولون بأنّ الأعمال الصالحة ـ من الصلاة والزكاة والحجّ والعمرة وغيرها من المأمورات ـ وكذلك أيضًا تركَ المحظورات،"], [185.8, "كلُّ ذلك لا يدخل في مسمّى الإيمان؛"], [191.0, "فالمأموراتُ فعلًا، والمنهيّاتُ تركًا،"], [193.7, "كلُّها لا تؤثّر في الإيمان،"], [197.1, "ولا تدخل في حقيقته."], [200.0, "وقد دلّ كلامُ السلف الصالح على صحّة هذه الكلّيّة:"], [206.0, "قال ابن عُيينة رحمه الله تعالى:"], [209.8, "«فأمّا المرجئةُ اليوم فهم قومٌ يقولون: الإيمانُ قولٌ بلا عمل»."]], "tr": [[164.0, "Âlimler irca'yı \"tehir etmek (geriye bırakmak)\" diye tarif etmişlerdir;"], [170.0, "ıstılahta bununla kastedilen, ameli iman dairesinden çıkarmaktır."], [176.0, "Şöyle derler: Namaz, zekât, hac, umre ve diğer emredilenler gibi salih ameller, aynı şekilde yasakları terk etmek;"], [186.5, "bunların hepsi iman adlandırmasına dahil olmaz."], [191.0, "Emredilenleri yapmak da, yasaklananları terk etmek de, hepsi imana etki etmez ve onun hakikatine dahil olmaz."], [200.0, "Selef-i sâlihînin sözü bu külliyenin doğruluğuna delâlet etmiştir."], [204.7, "İbn Uyeyne —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [209.8, "\"Bugünkü Mürcie'ye gelince, onlar 'İman amelsiz sözdür' diyen bir topluluktur.\""]]}, {"reader": false, "ar": [[216.0, "وقال الإمام الطبريّ رحمه الله تعالى:"], [220.0, "«ومُؤخِّرُ العمل والطاعة عن الإيمان مُرجِئُهما عنه، فهو مُرجِئ»."], [229.0, "فجعل الإمامُ الطبريّ رحمه الله تعالى علامةَ المرجئة إخراجَ العمل عن الإيمان."], [236.0, "وقال الإمام وكيعٌ رحمه الله تعالى:"], [240.1, "«المرجئةُ الذين يقولون: الإقرارُ يُجزئ عن العمل؛ ومن قال هذا فقد هلك. ومن قال: النيّةُ تُجزئ عن العمل، فهو كفر، وهو قولُ جهم»."], [256.0, "قلتُ: وقد قدّمنا كلّيّةً بأنّ من قال بأنّ الإيمان مطلقُ المعرفة فقد كفر."]], "tr": [[216.0, "İmam Taberî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [220.0, "\"Ameli ve taati imandan geriye bırakan, onları imandan tehir etmiş olur;"], [229.0, "o hâlde o bir mürcidir.\" Böylece İmam Taberî —Allah Teâlâ ona rahmet etsin— Mürcie'nin alâmetini, ameli imandan çıkarmak olarak belirlemiştir."], [240.1, "İmam Vekî' —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [246.0, "\"Mürcie, 'İkrar amelin yerini tutar' diyenlerdir;"], [248.0, "bunu söyleyen helak olmuştur. Kim de 'Niyet amelin yerini tutar' derse bu küfürdür;"], [256.0, "bu Cehm'in sözüdür.\" Derim ki:"], [257.6, "İmanın mutlak ma'rifet olduğunu söyleyenin kâfir olduğuna dair bir külliyeyi daha önce geçmiştik."]]}, {"reader": false, "ar": [[264.0, "وقال الفُضيل بن عِياضٍ رحمه الله تعالى:"], [268.0, "«إنّ أهل الإرجاء يقولون: إنّ الإيمان قولٌ بلا عمل، ويقول الجهميّة: الإيمانُ المعرفةُ بلا قولٍ ولا عمل، ويقول أهل السنة: الإيمانُ المعرفةُ والقولُ والعمل»."], [284.7, "انتهى كلامه. وقد نالت فرقةُ المرجئة النصيبَ الأوفرَ من كلام أهل العلم في التحذير من هذه البدعة الخطيرة؛"], [296.0, "فإنّ من أعظم البدع الخطيرة في الإسلام بدعةَ الإرجاء،"]], "tr": [[264.0, "Fudayl b. Iyâz —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [268.0, "\"İrca ehli 'İman amelsiz sözdür' der;"], [270.8, "Cehmiyye 'İman sözsüz ve amelsiz ma'rifettir' der;"], [275.2, "Ehl-i Sünnet ise 'İman ma'rifet, söz ve ameldir' der.\" Sözü burada bitti."], [284.7, "Mürcie fırkası, bu tehlikeli bid'atten sakındırma konusunda ilim ehlinin sözlerinden en büyük payı almıştır."], [296.0, "Çünkü İslâm'daki en büyük tehlikeli bid'atlerden biri irca bid'atidir;"]]}]}, {"ts": "05:01", "title": "1. Külliye (devam): Selefin irca'dan sakındırması; Mürcie'nin delillerine giriş", "paras": [{"reader": false, "ar": [[301.0, "لِما سيأتينا في الكلّيّات القادمة إن شاء الله عز وجل."], [306.0, "ولذلك قال الإمام الزُّهريّ رحمه الله تعالى:"], [310.0, "«ما ابتُدِعت في الإسلام بدعةٌ هي أضرُّ على أهله من هذه» ـ يعني الإرجاء."], [316.0, "وقال الأوزاعيّ رحمه الله تعالى:"], [320.0, "«كان يحيى وقتادةُ يقولان: ليس من أهل الأهواء شيءٌ أخوفَ عندهم على الأمّة من الإرجاء»."], [327.0, "وقال إبراهيم النَّخَعيّ رحمه الله تعالى ـ عفوًا ـ قال:"], [332.7, "«المرجئةُ أخوفُ على هذه الأمّة من فتنة الأزارقة» ـ يعني الخوارج."], [340.0, "انتهى كلامُهم رحمهم الله."]], "tr": [[301.0, "(Bunun sebebini) inşallah Azze ve Celle, gelecek külliyelerde göreceğiz."], [304.5, "Bu yüzden İmam Zührî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [310.0, "\"İslâm'da, ehline bundan daha zararlı bir bid'at icat edilmedi\" —yani irca."], [314.5, "Evzâî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [320.0, "\"Yahyâ ve Katâde şöyle derlerdi:"], [322.0, "Hevâ ehlinden hiçbir şey onlara göre ümmet için irca'dan daha korkutucu değildir.\" İbrâhîm en-Nehaî —Allah Teâlâ ona rahmet etsin— —pardon— şöyle dedi:"], [332.7, "\"Mürcie bu ümmet için Ezârika fitnesinden daha korkutucudur\" —yani Hâricîler."], [340.0, "Sözleri burada bitti, Allah onlara rahmet etsin."]]}, {"reader": false, "ar": [[343.0, "ثم اعلم ـ وفّقنا الله وإيّاك ـ أنّ المرجئة لم يُخرجوا العملَ اعتباطًا،"], [350.0, "وإنما أخرجوه لأدلّةٍ يستدلّون بها من الكتاب والسنة ومن أدلّة اللغة،"], [360.0, "وهي الكلّيّات التي ستأتينا بعد قليل إن شاء الله عز وجل."], [367.0, "فالكلّيّات التي سأشرحها إلى آخر الدرس عبارةٌ عن ردودٍ على استدلال المرجئة بشيءٍ من أدلّة الكتاب والسنة واللغة على قولهم بأنّ العمل ليس من الإيمان؛"], [384.0, "فانتبهوا لذلك. والله أعلم."]], "tr": [[343.0, "Sonra bil ki —Allah bizi de seni de muvaffak kılsın— Mürcie ameli gelişigüzel (imandan) çıkarmadılar;"], [351.6, "bilakis Kitap'tan, Sünnet'ten ve dil delillerinden delil getirdikleri birtakım delillerden dolayı çıkardılar."], [360.8, "Bunlar biraz sonra inşallah Azze ve Celle karşımıza çıkacak olan külliyelerdir."], [367.0, "Dersin sonuna kadar şerh edeceğim külliyeler, Mürcie'nin amelin imandan olmadığı görüşlerine Kitap, Sünnet ve dil delillerinden bir kısmıyla delil getirmelerine verilen cevaplardan ibarettir."], [382.7, "Buna dikkat edin. Allah en iyisini bilir."]]}]}, {"ts": "06:26", "title": "2. Külliye: Cennete girmeyi tevhid kelimesine bağlayan her hadiste genel giriş kastedilir veya diğer delillerdeki kayıtlarla kayıtlanır", "paras": [{"reader": false, "ar": [[386.0, "الكلّيّة الثانية: كلُّ حديثٍ يُعلِّق دخولَ الجنّة على كلمة التوحيد فيُراد به الدخولُ العامّ،"], [409.0, "أو يُقيَّد بما ورد من القيود في الأدلّة الأخرى. <span class=\"note\">(يكررها)<\/span> هذه الكلّيّة كلُّها أُعيدها مرّةً أخرى:"], [421.0, "كلُّ حديثٍ يُعلِّق دخولَ الجنّة على كلمة التوحيد فيُراد به الدخولُ العامّ،"], [432.0, "أو يُقيَّد بالقيود في الأدلّة الأخرى."]], "tr": [[386.0, "<b>2. külliye: Cennete girmeyi tevhid kelimesine bağlayan her hadiste genel giriş kastedilir veya (o hadis) diğer delillerde gelen kayıtlarla kayıtlanır.<\/b> (Tekrar ediyor.) Bu külliyenin tamamını bir kez daha tekrar ediyorum:"], [422.4, "<b>Cennete girmeyi tevhid kelimesine bağlayan her hadiste genel giriş kastedilir veya diğer delillerdeki kayıtlarla kayıtlanır.<\/b>"]]}, {"reader": false, "ar": [[437.0, "أقول وبالله التوفيق: وهذه الكلّيّة تردّ على من استدلّ بهذه الأحاديث الصحيحة في أنّ كلَّ من قال كلمةَ التوحيد فإنّ مآلَه إلى الجنّة،"], [450.0, "كما في الصحيحين من حديث أبي ذرٍّ رضي الله عنه قال:"], [454.4, "«أتيتُ النبيَّ صلى الله عليه وسلم وهو نائمٌ وعليه ثوبٌ أبيض، ثم أتيتُه وقد استيقظ، فقعدتُ إليه، فقال: ما من عبدٍ قال: لا إله إلا الله، ثم مات على ذلك إلا دخل الجنّة. قلتُ: وإن زنى وإن سرق؟ قال: وإن زنى وإن سرق» <span class=\"note\">(يكررها ثلاثًا)<\/span> «على رَغم أنف أبي ذرّ»."]], "tr": [[437.0, "Tevfik Allah'tandır, derim ki: Bu külliye, bu sahih hadislerle tevhid kelimesini söyleyen herkesin varacağı yerin cennet olduğuna delil getirene reddiyedir."], [437.7, "Nitekim Sahîhayn'de Ebû Zer'in —Allah ondan razı olsun— hadisinde şöyle der:"], [439.0, "\"Peygamber sallallâhu aleyhi ve sellem'in yanına geldim;"], [445.0, "üzerinde beyaz bir elbise vardı ve uyuyordu."], [449.5, "Sonra uyanmışken tekrar yanına geldim ve yanına oturdum."], [454.4, "Buyurdu ki: 'Lâ ilâhe illallah deyip de sonra bunun üzerine ölen hiçbir kul yoktur ki cennete girmesin.' Dedim ki:"], [464.3, "'Zina etse de, hırsızlık yapsa da mı?' Buyurdu ki:"], [469.3, "'Zina etse de, hırsızlık yapsa da.'\" (Üç kez tekrar ediyor.) \"Ebû Zer'in burnu sürtülse de (hoşuna gitmese de).\""]]}, {"reader": false, "ar": [[475.0, "وكما في حديث عُبادة بن الصامت رضي الله عنهما قال:"], [489.4, "قال النبيّ صلى الله عليه وسلم:"], [491.5, "«من شهد أن لا إله إلا الله وأنّ محمدًا رسولُ الله حرّم اللهُ عليه النار»،"], [498.0, "وفي روايةٍ: «دخل الجنّة»."], [501.0, "وكما في صحيح الإمام مسلمٍ من حديث عثمان رضي الله عنه قال:"], [506.4, "قال النبيّ صلى الله عليه وسلم:"], [509.0, "«من مات وهو يعلم أن لا إله إلا الله دخل الجنّة»."], [512.0, "وفي حديث معاذٍ رضي الله عنه قال:"], [515.4, "قال النبيّ صلى الله عليه وسلم:"], [518.0, "«من كان آخرُ كلامه من الدنيا لا إله إلا الله دخل الجنّة»."]], "tr": [[475.0, "Ve Ubâde b. Sâmit'in —Allah ondan razı olsun— hadisinde olduğu gibi;"], [489.4, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [491.5, "\"Kim Allah'tan başka ilâh olmadığına ve Muhammed'in Allah'ın Resûlü olduğuna şahitlik ederse Allah ona ateşi haram kılar.\" Bir rivayette:"], [499.5, "\"Cennete girer.\" Ve İmam Müslim'in Sahîh'inde Osman'ın —Allah ondan razı olsun— hadisinde olduğu gibi;"], [506.4, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [509.0, "\"Kim Allah'tan başka ilâh olmadığını bilerek ölürse cennete girer.\" Muâz'ın —Allah ondan razı olsun— hadisinde de;"], [515.4, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [518.0, "\"Kimin dünyadaki son sözü Lâ ilâhe illallah olursa cennete girer.\""]]}, {"reader": false, "ar": [[524.0, "والأحاديثُ في هذا المعنى كثيرة،"], [527.0, "يُعلِّق فيها الشارعُ دخولَ الجنّة على النطق بكلمة التوحيد."], [533.0, "فاستدلّ المرجئةُ بهذه الأدلّة على أنّ كلَّ من نطق بكلمة التوحيد ـ وإن لم يُقارنه عمل ـ فإنه مستحقٌّ لدخول الجنّة."], [545.0, "وهذه الكلّيّة تردّ عليهم بجوابين:"], [550.0, "الجوابُ الأوّل: هو أنّ لفظة «الدخول» الواردةَ في هذه الأحاديث لا ينبغي حملُها على الدخول الابتدائيّ،"], [560.0, "وإنما تُحمَل على الدخول العامّ الذي يدخل فيه الدخولُ الابتدائيّ والدخولُ الانتقاليّ."]], "tr": [[524.0, "Bu anlamdaki hadisler pek çoktur;"], [527.0, "Şâri' bunlarda cennete girmeyi tevhid kelimesini söylemeye bağlar."], [533.0, "Mürcie bu delillerle, tevhid kelimesini söyleyen herkesin —beraberinde amel bulunmasa bile— cennete girmeyi hak ettiğine delil getirdi."], [543.5, "Bu külliye onlara iki cevapla reddiye verir."], [550.0, "Birinci cevap: Bu hadislerde geçen \"girme\" lafzını ilk baştan girmeye hamletmek uygun değildir;"], [558.5, "bilakis o, ilk baştan girmeyi ve (ateşten) geçişle girmeyi içine alan genel girmeye hamledilir."]]}, {"reader": false, "ar": [[569.0, "ونعني بالدخول الابتدائيّ: أن تكون الجنّةُ أوّلَ منازله،"], [577.0, "ونعني بالدخول الانتقاليّ: أن تكون الجنّةُ هي ثانيَ منازله،"], [584.0, "وكلاهما يصدق عليه أنه دخل الجنّة."], [590.0, "ولذلك لم يجعل النبيّ صلى الله عليه وسلم في حديث أبي ذرٍّ ارتكابَ الزنا والسرقة بمانعٍ من دخول الجنّة؛"], [599.0, "لأنّ المتقرّرَ بالإجماع عند أهل السنة"]], "tr": [[569.0, "İlk baştan girme ile kastettiğimiz, cennetin onun ilk durağı olmasıdır;"], [579.1, "geçişle girme ile kastettiğimiz ise cennetin onun ikinci durağı olmasıdır."], [584.8, "Her ikisine de \"cennete girdi\" denmesi doğrudur."], [590.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem, Ebû Zer hadisinde zina ve hırsızlık işlemeyi cennete girmeye engel kılmamıştır."], [597.3, "Çünkü Ehl-i Sünnet'e göre icmâ ile sabit olan şudur:"]]}]}, {"ts": "10:02", "title": "2. Külliye (devam): Genel giriş; mutlakın mukayyede hamledilmesi", "paras": [{"reader": false, "ar": [[602.0, "أنّ كلَّ من مات على «لا إله إلا الله» دخل الجنّة،"], [606.0, "وإن دخل النارَ قبل ذلك بسبب شيءٍ من الكبائر."], [610.0, "فكأنّ النبيّ صلى الله عليه وسلم يقول لأبي ذرّ:"], [615.0, "نعم، سيدخل الجنّة وإن زنى وإن سرق؛"], [619.0, "لأنّ الزنا والسرقة لا تُوجب الخلودَ الأبديَّ في النار،"], [622.0, "فهو سيدخل الجنّة في يومٍ من الأيّام،"], [625.0, "وإن أصابه في النار قبل ذلك ما أصابه."]], "tr": [[602.0, "\"Lâ ilâhe illallah\" üzerine ölen herkes cennete girer;"], [604.9, "bundan önce büyük günahlardan bir şey sebebiyle cehenneme girse bile."], [610.0, "Sanki Peygamber sallallâhu aleyhi ve sellem Ebû Zer'e şöyle diyor:"], [615.0, "Evet, zina etse de hırsızlık yapsa da cennete girecektir;"], [619.0, "çünkü zina ve hırsızlık cehennemde ebedî kalmayı gerektirmez."], [621.7, "O hâlde o, bundan önce cehennemde başına ne gelirse gelsin, günlerden bir gün cennete girecektir."]]}, {"reader": false, "ar": [[629.0, "فمشكلةُ المرجئة في هذه الأحاديث أنهم لا يفهمون من معنى قوله:"], [637.0, "«دخل الجنّة» إلا معنًى واحدًا،"], [640.0, "وهو الدخولُ الابتدائيّ؛ وهذا غلطٌ تردّه هذه الكلّيّة."], [647.0, "فكلُّ حديثٍ فيه «دخل الجنّة» فلا بدّ أن يُحمَل على أحد مَحمِلَين،"], [654.0, "وهذا أحدُها: وهو أن نحمل الدخولَ على المعنى العامّ."], [660.0, "فلو مات إنسانٌ على شيءٍ من الكبائر فهو بين أمرين:"], [666.0, "إمّا أن تُغفَر له كبيرتُه ويدخلَ الجنّة ابتداءً،"], [670.0, "فيصدق عليه أنه دخل الجنّة؛"], [672.0, "وإمّا أن يُعذَّب في النار بقدر كبيرته ثم يخرجَ منها إلى الجنّة،"], [679.0, "فيصدق عليه أنه دخل الجنّة."]], "tr": [[629.0, "Mürcie'nin bu hadislerdeki sorunu, \"cennete girer\" sözünün anlamından tek bir mana anlamalarıdır;"], [637.0, "o da ilk baştan girmektir."], [643.0, "Bu, bu külliyenin reddettiği bir hatadır."], [647.0, "İçinde \"cennete girer\" geçen her hadis mutlaka iki hamletme yolundan birine hamledilmelidir;"], [655.3, "bu, onlardan biridir: girmeyi genel anlama hamletmemiz."], [660.0, "Bir insan büyük günahlardan bir şey üzerine ölürse iki durumdan biridir:"], [666.0, "Ya büyük günahı bağışlanır ve ilk baştan cennete girer;"], [670.0, "ona \"cennete girdi\" denmesi doğrudur."], [672.0, "Ya da büyük günahı kadar cehennemde azap görür, sonra oradan çıkıp cennete gider;"], [678.4, "ona da \"cennete girdi\" denmesi doğrudur."]]}, {"reader": false, "ar": [[682.0, "فلا يكون في هذه الأحاديث أيُّ إشكالٍ أبدًا إذا حملنا الدخولَ فيها على المعنى العامّ."], [691.0, "وهذا الجوابُ الأوّل. والجوابُ الثاني في قوله:"], [696.0, "«أو يُقيَّد بالقيود في الأدلّة الأخرى»؛"], [701.0, "وذلك لأنّ المتقرّرَ في القواعد أنّ المطلق لا بدّ وأن يُبنى على المقيَّد إذا اتّفقا في الحكم والسبب،"], [708.6, "إجماعًا. فهذه الأدلّة وردت على نوعين:"], [714.0, "وردت مطلقةً بأنّ مجرّدَ قولها يدخل به صاحبُها الجنّة،"], [720.0, "ووردت مقيَّدةً بجُملٍ كثيرةٍ من الشروط،"], [724.1, "والسببُ والحكمُ واحدٌ ـ أو واحدة ـ <span class=\"q\">؟ 12:00<\/span>،"], [729.0, "فيجب فيها بناءُ المطلق على المقيَّد."]], "tr": [[682.0, "Girmeyi genel anlama hamlettiğimizde bu hadislerde asla hiçbir problem kalmaz."], [691.0, "Bu birinci cevaptır. İkinci cevap ise (külliyedeki) \"veya diğer delillerdeki kayıtlarla kayıtlanır\" sözündedir."], [701.0, "Çünkü kaidelerde sabit olan şudur:"], [703.1, "Mutlak, hüküm ve sebepte (mukayyed ile) birleştiğinde, icmâ ile mutlaka mukayyede bina edilmelidir."], [709.0, "Bu deliller iki türlü gelmiştir:"], [714.0, "Sadece onu söylemekle sahibinin cennete gireceği şeklinde mutlak olarak gelmiştir;"], [719.3, "bir de birçok şartla kayıtlı olarak gelmiştir —sebep ve hüküm ise birdir <span class=\"q\">؟<\/span>—."], [726.9, "Dolayısıyla bunlarda mutlakı mukayyede bina etmek vaciptir."]]}, {"reader": false, "ar": [[732.8, "فلا بدّ أن تُقيَّد باليقين؛"], [738.0, "لأنّ النبيّ صلى الله عليه وسلم قال:"], [741.0, "«من قال: لا إله إلا الله مُستيقِنًا بها قلبُه دخل الجنّة»."], [746.9, "ولا بدّ أن تُقيَّد بالصدق؛"], [751.0, "لأنه صلى الله عليه وسلم قال:"], [754.0, "«من شهد أن لا إله إلا الله وأنّ محمدًا رسولُ الله صدقًا من قلبه دخل الجنّة»."], [761.0, "ولا بدّ أن تُقيَّد بالعلم؛"], [764.0, "لأنه صلى الله عليه وسلم قال:"], [767.0, "«من مات وهو يعلم أن لا إله إلا الله دخل الجنّة»."], [772.0, "ولا بدّ أن تُقيَّد بالإخلاص؛"], [776.0, "لأنه صلى الله عليه وسلم قال:"], [779.0, "«أسعدُ الناس بشفاعتي من قال: لا إله إلا الله مخلصًا بها قلبُه»،"], [785.0, "أو كما قال صلى الله عليه وسلم."]], "tr": [[732.8, "(Bu hadis) mutlaka yakînle kayıtlanmalıdır;"], [738.0, "çünkü Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [741.0, "\"Kim kalbi ona kesin olarak inanarak Lâ ilâhe illallah derse cennete girer.\" Mutlaka sıdk (samimiyet) ile kayıtlanmalıdır;"], [751.0, "çünkü sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [754.0, "\"Kim kalbinden doğrulayarak Allah'tan başka ilâh olmadığına ve Muhammed'in Allah'ın Resûlü olduğuna şahitlik ederse cennete girer.\" Mutlaka ilimle kayıtlanmalıdır;"], [764.0, "çünkü sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [767.0, "\"Kim Allah'tan başka ilâh olmadığını bilerek ölürse cennete girer.\" Mutlaka ihlâsla kayıtlanmalıdır;"], [772.0, "çünkü sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [776.0, "\"Şefaatimle insanların en mutlu olanı, kalbi ona ihlâs ile bağlanarak Lâ ilâhe illallah diyendir\" —ya da sallallâhu aleyhi ve sellem'in dediği gibi."]]}, {"reader": false, "ar": [[788.0, "ولا بدّ أن تُقيَّد بالكفر بالطاغوت؛"], [792.0, "لأنه صلى الله عليه وسلم قال:"], [795.0, "«من قال: لا إله إلا الله، وكفر بما يُعبَد من دون الله، حرُم مالُه ودمُه إلا بحقّه، وحسابُه على الله»."], [804.0, "فأنت ترى أنّ الأدلّة وردت مطلقةً تارةً ومقيَّدةً تارة،"], [810.3, "فلا بدّ أن نحمل مطلقَها على مقيَّدها؛"], [815.0, "لتكون النتيجةُ متّفقةً مع مراد الله عز وجل فيها."], [821.0, "وبناءً على ذلك فمشكلةُ المرجئة في هذه الأحاديث أنهم حملوها على إطلاقها، وتغافلوا عن مقيِّداتها."]], "tr": [[788.0, "Mutlaka tâğûtu inkârla kayıtlanmalıdır; çünkü sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [795.0, "\"Kim Lâ ilâhe illallah der ve Allah'tan başka ibadet edilen şeyleri inkâr ederse, malı ve kanı haram olur —hakkı olan müstesna—;"], [804.0, "hesabı da Allah'a kalmıştır.\" Görüyorsun ki deliller bazen mutlak, bazen mukayyed olarak gelmiştir."], [811.0, "O hâlde, sonuç Allah Azze ve Celle'nin onlardaki muradıyla uyumlu olsun diye, onların mutlakını mukayyedine hamletmemiz gerekir."], [821.0, "Buna binaen Mürcie'nin bu hadislerdeki sorunu, onları mutlaklıkları üzere almaları ve onları kayıtlayan delillere göz yummalarıdır."]]}, {"reader": false, "ar": [[834.0, "وبهذين الجوابين يتحرّر لك الإشكالُ في هذه الكلّيّة."], [839.0, "فالكلّيّة تنصّ على أنّ كلَّ مُرجئٍ يستدلّ بشيءٍ من ذلك فإنه يُصفَع في وجهه بأحد هذين الجوابين أو كليهما؛"], [850.0, "فتقول له: إنّ الدخول الواردَ فيها يُحمَل على الدخول العامّ،"], [858.0, "أو تقول بأنّ الإطلاق فيها مبنيٌّ على القيود المذكورة في الأدلّة الأخرى."], [866.0, "وبهذه الكلّيّة ينتهي استدلالُهم الأوّلُ بأدلّة الشرع على مذهبهم البدعيّ في إخراج العمل عن دائرة الإيمان."], [877.1, "والله أعلم. أدري كلامي واضح؟"]], "tr": [[834.0, "Bu iki cevapla bu külliyedeki problem senin için çözülür."], [839.0, "Külliye şunu açıkça belirtir: Bundan bir şeyle delil getiren her mürciin yüzüne bu iki cevaptan biri veya ikisi birden çarpılır."], [850.0, "Ona dersin ki: Bunlarda geçen girme, genel girmeye hamledilir;"], [856.3, "ya da dersin ki: Bunlardaki mutlaklık, diğer delillerde zikredilen kayıtlara bina edilir."], [866.0, "Bu külliyeyle, onların ameli iman dairesinden çıkarma konusundaki bid'atçi mezheplerine şer'î delillerle getirdikleri ilk delil son bulur."], [877.1, "Allah en iyisini bilir. Sözüm açık, değil mi?"]]}]}, {"ts": "14:40", "title": "3. Külliye: İçinde \"hiç hayır işlemedi\" geçen her hadiste İslâm'ın aslını sahih kılandan fazlası kastedilir", "paras": [{"reader": false, "ar": [[880.0, "الكلّيّة الثالثة: <b>كلُّ حديثٍ فيه «لم يعمل خيرًا قطّ» فالمرادُ به ما زاد على ما يُصحِّح أصلَ الإسلام.<\/b> <span class=\"note\">(يكررها مرارًا)<\/span> <b>كلُّ حديثٍ فيه «لم يعمل خيرًا قطّ» فالمرادُ به ما زاد على ما يُصحِّح أصلَ الإسلام.<\/b>"]], "tr": [[880.0, "<b>3. külliye: İçinde \"hiç hayır işlemedi\" geçen her hadiste, İslâm'ın aslını sahih kılan şeyin üzerindeki (fazla) ameller kastedilir.<\/b> (Birkaç kez tekrar ediyor.) <b>İçinde \"hiç hayır işlemedi\" geçen her hadiste, İslâm'ın aslını sahih kılan şeyin üzerindeki ameller kastedilir.<\/b>"]]}, {"reader": false, "ar": [[915.7, "أقول وبالله التوفيق: من أدلّة المرجئة تلك الأحاديثُ الكثيرة الواردة عن النبيّ صلى الله عليه وسلم في أناسٍ دخلوا الجنّة،"], [942.3, "ومن وصفهم الشرعيّ أنهم لم يعملوا خيرًا قطّ."], [947.0, "ووجهُ استدلال المرجئة بهذه النصوص أنّ النبيّ صلى الله عليه وسلم ذكر استحقاقَهم لدخول الجنّة مع كونهم لم يعملوا خيرًا قطّ."], [963.0, "فقال المرجئة: إنّ قوله صلى الله عليه وسلم:"], [968.6, "«لم يعمل» هذا نفي،"], [972.0, "وقولَه: «خيرًا» هذا نكرة،"], [977.0, "والمتقرّرُ في القواعد أنّ النكرة في سياق النفي تعُمّ،"], [983.0, "فيدخل في ذلك أعمالُ الجوارح."], [986.0, "ولكنّ تلك الكلّيّة تردّ عليهم."]], "tr": [[915.7, "Tevfik Allah'tandır, derim ki: Mürcie'nin delillerinden biri, Peygamber sallallâhu aleyhi ve sellem'den gelen, cennete giren ve şer'î vasıfları hiç hayır işlememiş olmaları olan insanlar hakkındaki o pek çok hadistir."], [947.0, "Mürcie'nin bu naslarla delil getirme yönü şudur:"], [951.7, "Peygamber sallallâhu aleyhi ve sellem, hiç hayır işlememiş olmalarına rağmen cennete girmeyi hak ettiklerini zikretmiştir."], [963.0, "Mürcie dedi ki: Sallallâhu aleyhi ve sellem'in \"işlemedi\" sözü nefydir;"], [968.6, "\"hayır\" sözü ise nekredir. Kaidelerde sabit olan şudur:"], [973.1, "Nefy siyakındaki nekre umum ifade eder;"], [979.7, "dolayısıyla buna azaların amelleri de dahil olur."], [986.0, "Fakat o külliye onlara reddiye verir."]]}, {"reader": false, "ar": [[991.0, "فإن قلت: اذكر لنا بعضَ الأحاديث الواردة في هذا الشأن،"], [998.0, "فأقول: هي كثيرة؛ منها مثلًا حديثُ أبي هريرة رضي الله عنه قال:"], [1004.6, "قال النبيّ صلى الله عليه وسلم:"], [1008.0, "«كان رجلٌ يُداين الناس، لم يعمل خيرًا قطّ» ـ الحديثَ بتمامه ـ وفيه أنّ الله عز وجل أدخله الجنّة."], [1020.0, "وفي حديثٍ آخر يقول النبيّ صلى الله عليه وسلم:"], [1026.0, "«كان فيمن كان قبلكم رجلٌ لم يعمل خيرًا قطّ، قال لأهله: إذا أنا متُّ فأحرِقوني، ثم ذُرُّوني في يوم ريحٍ» ـ الحديثَ بتمامه ـ وفيه شهادةُ الشارع بأنه دخل الجنّة."]], "tr": [[991.0, "Eğer \"Bu konuda gelen hadislerden bazılarını bize zikret\" dersen, derim ki:"], [998.9, "Bunlar çoktur. Mesela bunlardan biri Ebû Hüreyre'nin —Allah ondan razı olsun— hadisidir;"], [1004.6, "dedi ki: Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1008.0, "\"İnsanlara borç veren bir adam vardı;"], [1011.1, "hiç hayır işlememişti\" —hadisin tamamı—;"], [1013.7, "hadiste Allah Azze ve Celle'nin onu cennete koyduğu geçer."], [1020.0, "Başka bir hadiste Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [1026.0, "\"Sizden öncekiler arasında hiç hayır işlememiş bir adam vardı."], [1031.6, "Ailesine dedi ki: Ben öldüğümde beni yakın, sonra rüzgârlı bir günde (külümü) savurun\" —hadisin tamamı—;"], [1039.4, "hadiste Şâri'in onun cennete girdiğine dair şahitliği vardır."]]}, {"reader": false, "ar": [[1045.0, "وفي حديث الشفاعة الصحيح أثبت النبيّ صلى الله عليه وسلم أنّ طوائفَ من بني آدم يُخرجهم الله عز وجل من الجنّة <span class=\"note\">(كذا في الكلام؛ والمراد: من النار)<\/span>،"], [1058.7, "وصفهم الشارعُ بأنهم لم يعملوا خيرًا قطّ."], [1063.0, "ومنها حديثُ البطاقة المعروف،"], [1065.8, "حديثُ عبد الله بن عمرو بن العاص،"], [1071.0, "وفيه أنّ رجلًا نُودي به على رؤوس الخلائق،"], [1077.0, "فنُشِر له تسعةٌ وتسعون سِجِلًّا،"], [1081.0, "كلُّ سجلٍّ منها مدُّ البصر،"], [1084.0, "ثم أُخرِج له بطاقة،"], [1086.9, "فغلبت تلك البطاقةُ وطاشت بتلك السجلّات. والحديثُ حسن."]], "tr": [[1045.0, "Sahih şefaat hadisinde Peygamber sallallâhu aleyhi ve sellem, Âdemoğullarından bazı toplulukları Allah Azze ve Celle'nin cennetten <span class=\"note\">(böyle söylüyor; kastedilen: cehennemden)<\/span> çıkaracağını sabit kılmıştır;"], [1057.5, "Şâri' onları hiç hayır işlememiş olmakla vasıflandırmıştır."], [1061.2, "Bunlardan biri de meşhur bitâka (kart) hadisidir;"], [1065.1, "Abdullah b. Amr b. Âs'ın hadisi."], [1068.5, "Hadiste şu geçer: Bir adam bütün yaratılmışların önünde çağrılır;"], [1073.9, "onun için her biri göz alabildiğine uzanan doksan dokuz defter açılır."], [1081.6, "Sonra onun için bir kart çıkarılır;"], [1084.8, "o kart ağır basar ve o defterler hafif gelip havaya kalkar. Hadis hasendir."]]}, {"reader": false, "ar": [[1091.0, "ونحوُ هذه الأحاديث؛ فالمرجئة يقولون بأنها من الأدلّة الدالّة على أنّ العمل ليس شرطًا في صحّة الإيمان،"], [1103.6, "ولا بركنٍ فيه، وأنّ العبد بمجرّد النطق بالشهادتين يستحقّ دخولَ الجنّة."], [1110.0, "ولكنّ هذه الكلّيّة تردّ عليهم بأنّ كلَّ حديثٍ فيه «لم يعمل خيرًا قطّ» فإنه لا بدّ وأن يُفهم أنه في كمالات الأعمال،"], [1124.0, "لا في أصول ما يُصحِّح الإسلام؛"], [1127.0, "بدليل جُملٍ كثيرةٍ من الأحاديث. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1091.0, "Bu hadislere benzer hadisler de vardır."], [1095.0, "Mürcie bunların, amelin imanın sıhhatinde şart olmadığına ve onda bir rükün olmadığına, kulun sadece iki şehadeti söylemekle cennete girmeyi hak ettiğine delâlet eden delillerden olduğunu söyler."], [1110.0, "Fakat bu külliye onlara şöyle reddiye verir:"], [1114.8, "İçinde \"hiç hayır işlemedi\" geçen her hadisin, İslâm'ı sahih kılan şeyin asıllarıyla ilgili değil, amellerin kemâlleriyle ilgili olduğu mutlaka anlaşılmalıdır;"], [1127.0, "bunun delili pek çok hadistir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1135.0, "فمثلًا حديثُ أبي هريرة رضي الله عنه قال:"], [1139.3, "«كان رجلٌ يُداين الناس، لم يعمل خيرًا قطّ»؛"], [1142.0, "فهنا نفى عملَه للخير،"], [1144.0, "ومع ذلك في نفس الحديث يقول:"], [1147.0, "«فكان يقول لغلمانه: إذا رأيتم مُعسِرًا فتجاوزوا عنه، لعلّ الله أن يتجاوز عنّا»."], [1155.0, "أوَليس إسقاطُ الدَّين عن المُعسِر من جملة الأعمال؟"], [1159.0, "الجواب: نعم. فهذا دليلٌ على أنّ المراد بقوله:"], [1162.4, "«لم يعمل خيرًا قطّ» ليس أصلَ الأعمال، وإنما كمالاتُها."]], "tr": [[1135.0, "Mesela Ebû Hüreyre'nin —Allah ondan razı olsun— hadisi;"], [1139.3, "dedi ki: \"İnsanlara borç veren bir adam vardı;"], [1142.0, "hiç hayır işlememişti.\" Burada onun hayır işlemesini nefyetmiştir."], [1144.5, "Buna rağmen aynı hadiste şöyle der:"], [1147.0, "\"Hizmetçilerine şöyle derdi: Darda kalmış birini gördüğünüzde ondan (alacağınızı) bağışlayın;"], [1153.0, "umulur ki Allah da bizi bağışlar.\" Darda kalmış kimseden borcu düşürmek amellerden değil midir?"], [1159.0, "Cevap: Evet. Bu da \"hiç hayır işlemedi\" sözüyle kastedilenin amellerin aslı değil, kemâlleri olduğuna delildir."]]}, {"reader": false, "ar": [[1168.0, "ولأنّ العلماء مُجمِعون على أنّ من ليس معه أصلُ الإسلام والإيمان فإنه لا حظَّ له في دخول الجنّة؛"], [1182.0, "فالمقصودُ نفيُ الأعمال الزائدة على أصل الإيمان،"], [1186.0, "وعلى أصل التوحيد، وعلى أصل ما يُصحِّح الإسلام."], [1190.0, "وهناك من أهل العلم من حملها ـ انتبه ـ على أنهم لم يعملوا خيرًا قطّ في مقابل سيّئاتهم الكثيرة؛"]], "tr": [[1168.0, "Bir de âlimler, yanında İslâm'ın ve imanın aslı bulunmayan kimsenin cennete girmekten hiçbir payı olmadığında icmâ etmişlerdir."], [1180.9, "O hâlde kastedilen, imanın aslının, tevhidin aslının ve İslâm'ı sahih kılan şeyin aslının üzerindeki fazla amelleri nefyetmektir."], [1190.0, "İlim ehlinden bunu —dikkat et!— onların çok sayıdaki kötülüklerine karşılık hiç hayır işlememiş olmaları şeklinde anlayanlar da vardır."]]}]}, {"ts": "20:02", "title": "3. Külliye (devam): Kemâlin nefyi; İbn Huzeyme ve İbn Abdilber'in sözleri", "paras": [{"reader": false, "ar": [[1202.0, "فإنّ الميزانين إذا كان أحدُهما قليلًا جدًّا والآخرُ كثيرًا جدًّا،"], [1213.0, "فإنّ لك أن تقول:"], [1214.8, "هذا الميزانُ ليس فيه شيء."], [1217.0, "كما في الصحيحين من حديث أنسٍ رضي الله عنه قال:"], [1220.4, "«خرجنا مع رسول الله صلى الله عليه وسلم في يومٍ حارّ، فمِنّا الصائم ومِنّا المفطر، فنزلنا منزلًا في يومٍ حارّ، فسقط الصُّوّام، وقام المفطرون فضربوا الأبنية وسقَوا الرِّكاب، فقال صلى الله عليه وسلم: ذهب المفطرون اليومَ بالأجر»."], [1244.0, "فلا يُفهَم من هذا أنْ ليس للصائمين ولا مطلقُ الأجر،"], [1250.0, "ولكنّ مقارنةَ أجر الصائمين مع أجر المفطرين في هذه الظروف كأنه ليس بشيء."]], "tr": [[1202.0, "Çünkü iki kefeden biri çok az, diğeri çok fazla olduğunda \"Bu kefede hiçbir şey yok\" diyebilirsin."], [1214.8, "Nitekim Sahîhayn'de Enes'in —Allah ondan razı olsun— hadisinde şöyle der:"], [1217.0, "\"Sıcak bir günde Resûlullah sallallâhu aleyhi ve sellem ile birlikte yola çıktık."], [1220.4, "Kimimiz oruçlu, kimimiz oruçsuzdu. Sıcak bir günde bir konak yerine indik;"], [1227.2, "oruçlular yere yığıldı, oruçsuzlar ise kalkıp çadırları kurdular ve binekleri suladılar."], [1238.6, "Bunun üzerine sallallâhu aleyhi ve sellem:"], [1244.0, "'Bugün oruçsuzlar ecri alıp götürdü' buyurdu.\" Bundan oruçlular için en ufak bir ecir bile olmadığı anlaşılmaz;"], [1252.1, "fakat bu şartlarda oruçluların ecri oruçsuzların ecriyle karşılaştırıldığında sanki hiçbir şey değildir."]]}, {"reader": false, "ar": [[1261.0, "ولذلك قال الإمام ابن خُزيمة رحمه الله:"], [1264.0, "«هذه اللفظة» ـ أي: «لم يعمل خيرًا قطّ» ـ «من الجنس الذي تقوله العرب: بنفي الاسم عن الشيء لنقصه عن الكمال والتمام؛ فمعنى هذه اللفظة على هذا الأصل: لم يعملوا خيرًا قطّ على التمام والكمال، لا على ما أُوجب عليه أو أُمر به»."], [1290.0, "يعني أنّ عندهم أعمالًا ولكنهم لم يعملوها على وجه التمام والكمال،"], [1296.0, "أو عندهم أعمالٌ ولكنها قليلةٌ جدًّا مقارنةً بتلك السيّئات العظيمة، كحديث البطاقة وغيره."]], "tr": [[1261.0, "Bu yüzden İmam İbn Huzeyme —Allah ona rahmet etsin— şöyle dedi:"], [1264.0, "\"Bu lafız\" —yani \"hiç hayır işlemedi\"— \"Arapların söylediği türdendir:"], [1265.7, "Bir şey kemâl ve tamamlıktan eksik olduğu için ondan ismi nefyetmek."], [1275.4, "Bu esasa göre bu lafzın anlamı şudur:"], [1282.9, "Hiçbir hayrı tam ve kâmil olarak işlemediler;"], [1290.0, "yoksa kendisine vacip kılınan veya emredilen şeyi (hiç) işlemedi demek değildir.\" Yani onların amelleri vardır, fakat onları tam ve kâmil şekilde işlememişlerdir;"], [1297.4, "ya da amelleri vardır, fakat bitâka hadisi ve benzerlerinde olduğu gibi o büyük kötülüklere kıyasla çok azdır."]]}, {"reader": false, "ar": [[1305.0, "فهذه الأحاديث لا تخرج عن هذا الفهم،"], [1310.0, "ومتى ما خرجت عن هذا الفهم فإنّ ذلك سيكون مُسوِّغًا لترك الأعمال،"], [1318.1, "ودافعًا إليه. ثم أضِفْ إلى هذا ـ وفّقك الله ـ بأنّ هذه أحاديثُ آحاد،"], [1328.0, "وأنتم ـ أيّها المرجئة ـ تشترطون في الاستدلال على المسألة الشرعيّة أن تكون متواترة؛"], [1339.0, "فكيف تستنبطون من هذه الأحاديث الآحاديّة عقيدةً تعتقدونها في إخراج العمل عن دائرة الإيمان؟!"], [1350.0, "وهذا من باب الجواب المُلزِم لهم."]], "tr": [[1305.0, "Bu hadisler bu anlayışın dışına çıkmaz."], [1308.6, "Bu anlayışın dışına çıktıkları zaman ise bu, amelleri terk etmeye bir mazeret ve buna bir teşvik olur."], [1322.0, "Sonra buna —Allah seni muvaffak kılsın— şunu da ekle:"], [1326.2, "Bunlar âhâd hadislerdir; siz ise ey Mürcie, şer'î bir meselede delil getirirken (delilin) mütevâtir olmasını şart koşuyorsunuz."], [1339.0, "O hâlde bu âhâd hadislerden, ameli iman dairesinden çıkarma konusunda inandığınız bir akîdeyi nasıl çıkarıyorsunuz?!"], [1350.0, "Bu, onları (kendi usûlleriyle) bağlayan cevap türündendir."]]}, {"reader": false, "ar": [[1353.0, "والخلاصة: أنّ الصواب أن يُحمل النفيُ في قوله:"], [1356.7, "«لم يعملوا خيرًا قطّ» على نفي الكمال الواجب؛"], [1360.5, "لورود ما يدلّ على أنهم عملوا خيرًا في بعض الروايات."], [1366.0, "فهؤلاء الموصوفون في الحديث ليسوا من الكفّار،"], [1370.8, "بل هم من المؤمنين الموحّدين،"], [1375.0, "ولكنهم فرّطوا في جنب الله،"], [1377.7, "وأسرفوا على أنفسهم، حتى تركوا أكثرَ العبادات والطاعات،"], [1382.0, "ولم يبقَ لهم ما يُدخلهم الجنّة إلا الشفاعة."]], "tr": [[1353.0, "Özet şudur: Doğru olan, \"hiç hayır işlemediler\" sözündeki nefyin vacip kemâlin nefyine hamledilmesidir;"], [1360.5, "çünkü bazı rivayetlerde onların hayır işlediklerine delâlet eden ifadeler gelmiştir."], [1366.0, "Hadiste vasıflandırılan bu kimseler kâfirlerden değildir;"], [1369.4, "bilakis muvahhid müminlerdendir. Fakat Allah'ın hakkında kusur etmişler ve kendilerine karşı aşırı gitmişlerdir;"], [1377.7, "öyle ki ibadetlerin ve taatlerin çoğunu terk etmişler ve onları cennete sokacak şefaatten başka bir şey kalmamıştır."]]}, {"reader": false, "ar": [[1386.0, "قال ابن عبد البرّ رحمه الله تعالى:"], [1390.3, "«وهذه اللفظة» ـ انتبه، وهي لفظةٌ في حديث الشفاعة،"], [1400.0, "وهي قوله: «لم يعملوا خيرًا قطّ إلا التوحيد» ـ قال ابن عبد البرّ:"], [1407.2, "«وهذه اللفظة» ـ يعني «إلا التوحيد» ـ «إن صحّت رفعت الإشكالَ في إيمان هذا الرجل، وإن لم تصحّ من جهة النقل فهي صحيحةٌ من جهة المعنى، والأصولُ كلُّها تعضُدها، والنظرُ يُوجبها» ـ انتبهوا ـ «لأنه محالٌ غيرُ جائزٍ أن يُغفَر للذين يموتون وهم كفّار؛ لأنّ الله عز وجل قد أخبر أنه <span class=\"ayah\">﴿لَا يَغْفِرُ أَن يُشْرَكَ بِهِ﴾<\/span> <span class=\"ref\">[النساء: ٤٨]<\/span> لمن مات كافرًا، وهذا ما لا مَدفعَ له، ولا خلافَ فيه بين أهل القبلة."]], "tr": [[1386.0, "İbn Abdilber —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1390.3, "\"Bu lafız\" —dikkat et, bu şefaat hadisindeki bir lafızdır;"], [1394.5, "o da \"Tevhid dışında hiç hayır işlemediler\" sözüdür— İbn Abdilber dedi ki:"], [1401.2, "\"Bu lafız\" —yani \"tevhid dışında\"— \"sahih ise bu adamın imanı hakkındaki problemi ortadan kaldırır."], [1405.0, "Nakil yönünden sahih olmasa bile mana yönünden sahihtir;"], [1407.2, "bütün asıllar onu destekler ve akıl yürütme onu gerektirir\" —dikkat edin!— \"Çünkü kâfir olarak ölenlerin bağışlanması muhaldir, caiz değildir."], [1420.6, "Zira Allah Azze ve Celle, kâfir olarak ölen kimse için <span class=\"ayah\">﴿kendisine şirk koşulmasını bağışlamayacağını﴾<\/span> [Nisâ 48] haber vermiştir."], [1435.0, "Bu, reddedilemeyecek bir şeydir ve kıble ehli arasında bunda ihtilaf yoktur."]]}, {"reader": false, "ar": [[1442.0, "وفي هذا الأصل (ما) يدلّك على أنّ قوله في هذا الحديث:"], [1447.0, "لم يعمل حسنةً قطّ،"], [1448.3, "أو لم يعمل خيرًا قطّ،"], [1450.0, "لم يُعذِّبه <span class=\"q\">؟ 24:10<\/span> إلا ما عدا التوحيدَ من الحسنات والخير."], [1454.0, "وهذا سائغٌ في لسان العرب،"], [1456.0, "جائزٌ في لغتها: أن يُؤتى بلفظ الكلّ والمرادُ به البعض»."], [1460.0, "بمعنى أنّ قوله: «لم يعمل خيرًا قطّ» ليس نفيًا لأصله،"], [1465.5, "وإنما نفيٌ لبعضه؛ «لم يعمل حسنةً قطّ» ليس المرادُ به نفيَ مطلق الحسنة،"], [1472.0, "وإنما كمالِها. وبهذا الفهم يتحرّر أنّ استدلال المرجئة بهذه الأحاديث على إخراج العمل عن الإيمان استدلالٌ ليس بصحيح. والله أعلم."]], "tr": [[1442.0, "Bu asılda, bu hadisteki 'hiç iyilik işlemedi' veya 'hiç hayır işlemedi' sözünün —(kastedilenin)— <span class=\"q\">؟<\/span> tevhid dışındaki iyilik ve hayırlar olduğunu sana gösteren (bir delil) vardır."], [1454.0, "Bu, Arap dilinde yaygındır, lügatlerinde caizdir:"], [1457.2, "Bütün lafzı getirilip bununla bir kısmı kastedilir.\" Yani \"hiç hayır işlemedi\" sözü onun aslının nefyi değil, bir kısmının nefyidir;"], [1467.0, "\"hiç iyilik işlemedi\" sözüyle kastedilen, iyiliğin en alt düzeyinin nefyi değil, kemâlinin nefyidir."], [1473.0, "Bu anlayışla, Mürcie'nin bu hadislerle ameli imandan çıkarmaya delil getirmesinin sahih olmayan bir istidlal olduğu ortaya çıkar. Allah en iyisini bilir."]]}]}, {"ts": "24:43", "title": "4. Külliye: Naslarda imana atfedilen her salih amel, hâssın âmma atfı kabilindendir", "paras": [{"reader": false, "ar": [[1483.0, "الكلّيّة الرابعة: <b>كلُّ عملٍ صالحٍ معطوفٍ على الإيمان في النصوص فمن عطف الخاصّ على العامّ.<\/b> <span class=\"note\">(يكررها)<\/span> هذه من أعظم حُججهم،"], [1501.9, "ترى يا جماعة، انتبهوا لها:"], [1504.0, "<b>كلُّ عملٍ صالحٍ معطوفٍ على الإيمان في النصوص فمن عطف الخاصّ على العامّ.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1483.0, "<b>4. külliye: Naslarda imana atfedilen her salih amel, hâssın (özelin) âmma (genele) atfı kabilindendir.<\/b> (Tekrar ediyor.) Bu, onların en büyük delillerindendir, bakın ey cemaat, buna dikkat edin:"], [1505.5, "<b>Naslarda imana atfedilen her salih amel, hâssın âmma atfı kabilindendir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1515.0, "أقول وبالله التوفيق: وهذه الكلّيّة تردّ على جزءٍ من استدلالات المرجئة في إخراجهم العملَ عن الإيمان؛"], [1528.0, "فقد استدلّ المرجئة على قولهم بإخراج العمل عن مسمّى الإيمان بأنّ عطفَ الأعمال الصالحة على الإيمان يقتضي المغايرة،"], [1539.0, "وهذه قاعدةٌ من قواعد اللغة العربيّة؛"], [1543.0, "وبناءً عليه عندهم فلا يكون العملُ داخلًا في مسمّى الإيمان."], [1550.0, "فقولُ الله عز وجل:"], [1554.0, "<span class=\"ayah\">﴿وَالْعَصْرِ ۝ إِنَّ الْإِنسَانَ لَفِي خُسْرٍ ۝ إِلَّا الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ﴾<\/span> <span class=\"ref\">[العصر: ١–٣]<\/span>،"], [1561.0, "وهذا دليلٌ على أنّ عملَ الصالحات ليس هو الإيمان،"], [1566.0, "وإنما هو شيءٌ آخر."]], "tr": [[1515.0, "Tevfik Allah'tandır, derim ki: Bu külliye, Mürcie'nin ameli imandan çıkarma konusundaki delillerinin bir kısmına reddiyedir."], [1528.0, "Mürcie, ameli iman adlandırmasından çıkarma görüşlerine şununla delil getirdiler:"], [1532.5, "Salih amellerin imana atfedilmesi farklılık (mugâyeret) gerektirir;"], [1538.1, "bu, Arap dilinin kaidelerinden bir kaidedir."], [1543.0, "Buna binaen onlara göre amel iman adlandırmasına dahil olmaz."], [1546.5, "Mesela Allah Azze ve Celle'nin şu sözü:"], [1550.0, "<span class=\"ayah\">﴿Asra yemin olsun ki, insan gerçekten ziyandadır; ancak iman edip salih ameller işleyenler müstesna﴾<\/span> [Asr 1–3]."], [1561.0, "(Onlara göre) bu, salih amel işlemenin iman olmadığına, bilakis başka bir şey olduğuna delildir."]]}, {"reader": false, "ar": [[1568.0, "وكقول الله عز وجل:"], [1571.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ كَانَتْ لَهُمْ جَنَّاتُ الْفِرْدَوْسِ نُزُلًا﴾<\/span> <span class=\"ref\">[الكهف: ١٠٧]<\/span>،"], [1576.0, "وقولِ الله عز وجل:"], [1578.0, "<span class=\"ayah\">﴿إِلَّا مَن تَابَ وَآمَنَ وَعَمِلَ صَالِحًا﴾<\/span> <span class=\"ref\">[مريم: ٦٠]<\/span>،"], [1581.0, "وهذا في القرآن كثير."], [1582.0, "فيجعلون عطفَ العمل الصالح على الإيمان دليلًا على تغايرهما؛"], [1590.0, "كقولك: دخل زيدٌ وخالد؛"], [1594.0, "فإذًا ذاتُ زيدٍ غيرُ ذات خالد."], [1597.0, "وكقول الله عز وجل:"], [1599.7, "<span class=\"note\">(قل)<\/span> <span class=\"ayah\">﴿مَن كَانَ عَدُوًّا لِّلَّهِ وَمَلَائِكَتِهِ وَرُسُلِهِ وَجِبْرِيلَ وَمِيكَالَ﴾<\/span> <span class=\"ref\">[البقرة: ٩٨]<\/span>؛"], [1606.0, "فهذا العطف يقتضي تغايرَ الذوات في هذه المعطوفات."], [1611.0, "والمتقرّرُ في قواعد العربيّة أنّ العطف يقتضي المغايرة."]], "tr": [[1568.0, "Ve Allah Azze ve Celle'nin şu sözü gibi:"], [1571.0, "<span class=\"ayah\">﴿Şüphesiz iman edip salih ameller işleyenler için konak olarak Firdevs cennetleri vardır﴾<\/span> [Kehf 107]."], [1575.6, "Ve Allah Azze ve Celle'nin şu sözü:"], [1578.0, "<span class=\"ayah\">﴿Ancak tövbe eden, iman eden ve salih amel işleyen müstesna﴾<\/span> [Meryem 60]."], [1582.0, "Bu, Kur'an'da çoktur. Onlar salih amelin imana atfedilmesini ikisinin farklı olduğuna delil sayarlar;"], [1590.0, "senin \"Zeyd ve Hâlid girdi\" demen gibi;"], [1594.0, "o hâlde Zeyd'in zatı Hâlid'in zatından başkadır."], [1597.0, "Ve Allah Azze ve Celle'nin şu sözü gibi:"], [1599.7, "<span class=\"note\">(De ki:)<\/span> <span class=\"ayah\">﴿Kim Allah'a, meleklerine, peygamberlerine, Cebrâil'e ve Mîkâil'e düşman olursa﴾<\/span> [Bakara 98]."], [1606.0, "Bu atıf, bu atfedilenlerde zatların farklılığını gerektirir."], [1611.0, "Arapçanın kaidelerinde sabit olan, atfın farklılık gerektirdiğidir."]]}, {"reader": false, "ar": [[1616.0, "ولكنّ تلك الكلّيّة تردّ عليهم،"], [1621.0, "وهي أن نقول: سلّمنا أنّ العطف يقتضي المغايرة،"], [1626.0, "ولكنّكم ـ يا أهل البدع ـ لا تفهمون من المغايرة إلا مغايرةَ الذوات فقط."], [1633.0, "وفي الحقيقة أنّ المغايرة التي تقتضيها واوُ العطف مغايرتان،"], [1640.8, "وليست مغايرةً واحدة: فتأتي واوُ العطف وتفيد تغايرَ الذوات،"], [1652.0, "ولكن تأتي واوُ العطف أيضًا وتفيد تغايرَ الصفات."], [1658.0, "فالمغايرة عند العرب إمّا أن تفيد تغايرَ الذوات تارةً،"], [1667.0, "وإمّا أن تفيد تغايرَ الصفات تارةً."]], "tr": [[1616.0, "Fakat o külliye onlara reddiye verir;"], [1622.9, "şöyle deriz: Atfın farklılık gerektirdiğini kabul ettik;"], [1627.0, "fakat siz ey bid'at ehli, farklılıktan sadece zatların farklılığını anlıyorsunuz."], [1633.0, "Hakikatte ise atıf vâvının gerektirdiği farklılık iki farklılıktır, tek bir farklılık değildir:"], [1646.0, "Atıf vâvı gelir ve zatların farklılığını ifade eder;"], [1652.0, "fakat atıf vâvı gelir ve sıfatların farklılığını da ifade eder."], [1658.0, "Araplara göre farklılık ya bazen zatların farklılığını, ya da bazen sıfatların farklılığını ifade eder."]]}, {"reader": false, "ar": [[1670.0, "فقولُ الله عز وجل:"], [1673.1, "<span class=\"ayah\">﴿وَجِبْرِيلَ وَمِيكَالَ﴾<\/span> <span class=\"ref\">[البقرة: ٩٨]<\/span> هذا عطفٌ يقتضي المغايرةَ في الذوات."], [1678.0, "فالمغايرة أحيانًا تكون للذوات،"], [1680.9, "وأحيانًا تكون للصفات. فالواو التي تُغاير بين العمل الصالح وبين الإيمان ليست من مغايرة الذوات،"], [1691.0, "وإنما من مغايرة الصفات."], [1693.0, "ومغايرةُ الصفات أنواع: فأحيانًا تكون من باب عطف الجزء على الكلّ ـ عطف الجزء على الكلّ ـ،"], [1707.0, "وأحيانًا تكون من باب عطف الخاصّ على العامّ."], [1713.0, "فالمغايرة بين الإيمان والعمل الصالح لا تقتضي المغايرةَ المطلقة،"], [1721.0, "وإنما تقتضي مطلقَ المغايرة."]], "tr": [[1670.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Cebrâil'e ve Mîkâil'e﴾<\/span> [Bakara 98] sözü, zatlarda farklılık gerektiren bir atıftır."], [1683.0, "Farklılık bazen zatlar için, bazen sıfatlar için olur."], [1687.7, "Salih amel ile iman arasında farklılık bildiren vâv, zatların farklılığından değil, sıfatların farklılığındandır."], [1696.0, "Sıfatların farklılığı ise çeşitlidir: Bazen cüzün külle atfı —cüzün külle atfı— kabilinden, bazen de hâssın âmma atfı kabilinden olur."], [1713.0, "O hâlde iman ile salih amel arasındaki farklılık mutlak (tam) farklılığı gerektirmez;"], [1718.7, "bilakis en alt düzeyde bir farklılığı gerektirir."]]}, {"reader": false, "ar": [[1725.0, "فقولُ الله عز وجل مثلًا:"], [1728.5, "<span class=\"ayah\">﴿حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ﴾<\/span> <span class=\"ref\">[البقرة: ٢٣٨]<\/span>؛"], [1734.0, "فهل الصلاةُ الوسطى عطفُها عطفُ مغايرةِ ذواتٍ على الصلوات؟"], [1742.0, "الجواب: لا، بل الصلاةُ الوسطى كانت داخلةً في قوله:"], [1745.8, "<span class=\"ayah\">﴿حَافِظُوا عَلَى الصَّلَوَاتِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٣٨]<\/span>، ولكنه عطفها من باب عطف الجزء على الكلّ،"], [1753.0, "من باب التنبيه على أهمّيّتها."], [1756.0, "وكذلك قولُ الله عز وجل:"], [1763.0, "<span class=\"ayah\">﴿وَإِذْ أَخَذْنَا مِنَ النَّبِيِّينَ مِيثَاقَهُمْ وَمِنكَ وَمِن نُّوحٍ وَإِبْرَاهِيمَ وَمُوسَىٰ وَعِيسَى ابْنِ مَرْيَمَ﴾<\/span> <span class=\"ref\">[الأحزاب: ٧]<\/span>،"], [1770.0, "هذا من باب عطف تغاير الذوات."]], "tr": [[1725.0, "Mesela Allah Azze ve Celle'nin şu sözü:"], [1728.5, "<span class=\"ayah\">﴿Namazlara ve orta namaza devam edin﴾<\/span> [Bakara 238]."], [1734.0, "Orta namazın namazlara atfı, zatların farklılığı atfı mıdır?"], [1739.0, "Cevap: Hayır; bilakis orta namaz <span class=\"ayah\">﴿Namazlara devam edin﴾<\/span> [Bakara 238] sözüne dahildi;"], [1745.8, "fakat önemine dikkat çekmek için onu cüzün külle atfı kabilinden atfetmiştir."], [1753.6, "Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [1763.0, "<span class=\"ayah\">﴿Hani biz peygamberlerden, senden, Nûh'tan, İbrâhîm'den, Mûsâ'dan ve Meryem oğlu Îsâ'dan söz almıştık﴾<\/span> [Ahzâb 7];"], [1770.5, "bu, zatların farklılığı atfı kabilindendir."]]}, {"reader": false, "ar": [[1773.0, "فلا حقَّ للمرجئة أن يستدلّوا بواو العطف بين الإيمان والعمل الصالح على أنّ العمل ليس من الإيمان؛"], [1786.0, "لأنّنا نقول: إنّ العطف هنا وإن كان يقتضي المغايرة،"], [1791.0, "إلا أنه من باب المغايرة الجزئيّة،"], [1793.7, "لا من باب المغايرة الكلّيّة."], [1796.0, "وإلا فالعملُ داخلٌ في قول الله عز وجل: <span class=\"ayah\">﴿إِلَّا الَّذِينَ آمَنُوا﴾<\/span> <span class=\"ref\">[العصر: ٣]<\/span>؛"]], "tr": [[1773.0, "O hâlde Mürcie'nin, iman ile salih amel arasındaki atıf vâvıyla amelin imandan olmadığına delil getirme hakkı yoktur."], [1786.0, "Çünkü deriz ki: Buradaki atıf farklılık gerektirse de, bu küllî farklılık kabilinden değil, cüz'î farklılık kabilindendir."], [1796.0, "Yoksa amel, Allah Azze ve Celle'nin <span class=\"ayah\">﴿ancak iman edenler﴾<\/span> [Asr 3] sözüne dahildir."]]}]}, {"ts": "30:01", "title": "4. Külliye (devam): Sıfatların farklılığı; \"Günahı bağışlayan ve tövbeyi kabul eden\"", "paras": [{"reader": false, "ar": [[1801.0, "فلو أنه لم يقل:"], [1802.3, "<span class=\"ayah\">﴿وَعَمِلُوا الصَّالِحَاتِ﴾<\/span> <span class=\"ref\">[العصر: ٣]<\/span> لفهمنا بأنّ العمل داخلٌ في لفظة «آمنوا»،"], [1809.0, "ولكن من باب أهمّيّته أفرده الله عز وجل؛"], [1814.0, "فهو من باب عطف الخاصّ على العامّ،"], [1818.0, "أو من باب عطف الجزء على الكلّ."], [1822.0, "وكقول القائل: جاء المشايخُ وابنُ باز؛"], [1826.0, "فهذا من باب عطف الجزء على الكلّ،"], [1831.0, "أو من باب عطف الخاصّ على العامّ،"], [1834.0, "وكلُّهم يجمعهم وصفُ العلماء."]], "tr": [[1801.0, "Eğer <span class=\"ayah\">﴿ve salih ameller işleyenler﴾<\/span> [Asr 3] dememiş olsaydı, amelin \"iman edenler\" lafzına dahil olduğunu anlardık."], [1807.9, "Fakat önemi sebebiyle Allah Azze ve Celle onu ayrıca zikretmiştir."], [1814.0, "O hâlde bu, hâssın âmma atfı veya cüzün külle atfı kabilindendir."], [1820.3, "Bir kimsenin \"Meşâyih ve İbn Bâz geldi\" demesi gibi;"], [1826.0, "bu da cüzün külle atfı veya hâssın âmma atfı kabilindendir;"], [1832.7, "hepsini âlimler vasfı bir araya getirir."]]}, {"reader": false, "ar": [[1837.0, "ثم تأمّلْ معي قولَ الله عز وجل في الآية التي نسيتُها،"], [1842.0, "قال الله عز وجل:"], [1844.9, "<span class=\"ayah\">﴿غَافِرِ الذَّنبِ وَقَابِلِ التَّوْبِ﴾<\/span> <span class=\"ref\">[غافر: ٣]<\/span>؛"], [1849.0, "فهل نجعل التغايرَ هنا التغايرَ المطلق،"], [1853.3, "تغايرَ الذوات، فتكون الذاتُ التي يدلّ عليها <span class=\"ayah\">﴿غَافِرِ الذَّنبِ﴾<\/span> غيرَ الذات التي يدلّ عليها <span class=\"ayah\">﴿وَقَابِلِ التَّوْبِ﴾<\/span>؟"], [1862.0, "الجواب: لا، وإنما هذا من باب تغاير الصفات؛"], [1867.0, "فهما متعاطفان، ولكنّ الذاتَ واحدة،"], [1872.0, "وذاتُ الله عز وجل واحدة،"], [1875.3, "ولكنها موصوفةٌ بصفاتٍ مختلفة."], [1878.0, "أنتم معي في هذا ولّا لا؟ <span class=\"q\">؟ 31:18<\/span>"]], "tr": [[1837.0, "Sonra benimle birlikte Allah Azze ve Celle'nin, unuttuğum ayetteki sözünü düşün."], [1841.5, "Allah Azze ve Celle buyurdu:"], [1844.9, "<span class=\"ayah\">﴿Günahı bağışlayan ve tövbeyi kabul eden﴾<\/span> [Mü'min (Ğâfir) 3]."], [1849.0, "Buradaki farklılığı mutlak farklılık, yani zatların farklılığı mı sayacağız da <span class=\"ayah\">﴿günahı bağışlayan﴾<\/span> sözünün delâlet ettiği zat, <span class=\"ayah\">﴿tövbeyi kabul eden﴾<\/span> sözünün delâlet ettiği zattan başka mı olacak?"], [1862.0, "Cevap: Hayır; bilakis bu, sıfatların farklılığı kabilindendir."], [1867.0, "Bu ikisi birbirine atfedilmiştir, fakat zat birdir."], [1872.0, "Allah Azze ve Celle'nin zatı birdir, fakat farklı sıfatlarla vasıflanmıştır."], [1878.0, "Bu konuda benimle misiniz, değil misiniz? <span class=\"q\">؟<\/span>"]]}, {"reader": false, "ar": [[1880.0, "فمشكلةُ المرجئة في هذه الآيات أنهم لا يفهمون من عطف العمل الصالح على الإيمان إلا المغايرةَ المطلقة التي نُسمّيها بمغايرة الذوات،"], [1893.0, "وفي الحقيقة أنها مطلقُ المغايرة،"], [1895.5, "أي: مغايرةُ الصفات. فعطفُ العمل على الإيمان إنما هو من باب عطف الخاصّ على العامّ. والله أعلم."]], "tr": [[1880.0, "Mürcie'nin bu ayetlerdeki sorunu, salih amelin imana atfından sadece zatların farklılığı dediğimiz mutlak farklılığı anlamalarıdır."], [1888.7, "Hakikatte ise bu, en alt düzeyde bir farklılıktır, yani sıfatların farklılığıdır."], [1896.0, "Amelin imana atfı ancak hâssın âmma atfı kabilindendir. Allah en iyisini bilir."]]}]}, {"ts": "31:45", "title": "5. Külliye: Muteber bir özür sebebiyle şeriata uyamayanın imanı etkilenmez · Ebû Tâlib kıssası", "paras": [{"reader": false, "ar": [[1905.0, "ومن الكلّيّات أيضًا: <b>كلُّ من تعذّر عليه امتثالُ الشرع لعذرٍ معتبرٍ فلا يؤثّر ذلك في إيمانه.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ من تعذّر عليه امتثالُ الشرع لعذرٍ معتبرٍ فلا يؤثّر في إيمانه.<\/b> كلّيّاتٌ واضحة."]], "tr": [[1905.0, "Külliyelerden biri de şudur: 5."], [1907.2, "külliye: Muteber bir özür sebebiyle şeriata uyması imkânsız olan herkesin bu durumu imanına etki etmez. (Tekrar ediyor.) Muteber bir özür sebebiyle şeriata uyması imkânsız olan herkesin (bu durumu) imanına etki etmez. Açık külliyeler."]]}, {"reader": false, "ar": [[1943.0, "أقول وبالله التوفيق ـ وانتبهوا لي ـ:"], [1945.0, "وهذه الكلّيّة تردّ على جزءٍ آخرَ أيضًا من أدلّة المرجئة،"], [1950.0, "وهي أنّ هناك أدلّةً دلّت على أنّ هناك أناسًا اكتفَوا من الإسلام بـ«لا إله إلا الله»،"], [1960.0, "وقُيِّد اكتفاؤهم هذا بدخول الجنّة؛"], [1964.0, "كما في الصحيحين من حديث أبي هريرة رضي الله عنه في قصّة عمّه أبي طالب لمّا جاءه وهو يُحتضَر،"], [1975.0, "فقال: «يا عمّ» ـ انتبه ـ «قل: لا إله إلا الله، كلمةً أشهدُ لك بها عند الله»."], [1982.0, "فقال المرجئة: فهذا النبيّ صلى الله عليه وسلم يأمر عمَّه بالنطق بهذه الكلمة ليُحاجَّ ربَّه عن عمّه بالنطق بها؛"], [1995.0, "فهذا دليلٌ على أنّ مجرّدَ النطق بها كافٍ في دخول الجنّة."]], "tr": [[1943.0, "Tevfik Allah'tandır, derim ki —bana dikkat edin—:"], [1945.0, "Bu külliye de Mürcie'nin delillerinin başka bir kısmına reddiyedir."], [1949.5, "O da şudur: Bazı insanların İslâm'dan \"Lâ ilâhe illallah\" ile yetindiklerine ve onların bu yetinmelerinin cennete girmekle kayıtlandığına delâlet eden deliller vardır."], [1964.0, "Nitekim Sahîhayn'de Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde, (Peygamber'in) amcası Ebû Tâlib'in kıssasında, o can çekişirken yanına geldiğinde şöyle buyurdu:"], [1975.5, "\"Amcacığım\" —dikkat et— \"Lâ ilâhe illallah de;"], [1977.9, "Allah katında onunla senin lehine şahitlik edeceğim bir kelime.\" Mürcie dedi ki:"], [1982.0, "İşte Peygamber sallallâhu aleyhi ve sellem amcasına bu kelimeyi söylemesini emrediyor ki onu söylemesi sebebiyle amcası adına Rabbine karşı hüccet getirsin."], [1995.0, "Bu da onu sadece söylemenin cennete girmek için yeterli olduğuna delildir."]]}, {"reader": false, "ar": [[2001.0, "وأجاب العلماءُ عن ذلك بأنّ أبا طالبٍ كان في آخر حياته،"], [2006.0, "ولا يُتصوَّر منه قصدُ العمل ولا امتثالُه؛"], [2009.0, "لأنه إنما دخل عليه النبيّ صلى الله عليه وسلم في سكرات الموت."], [2015.0, "فلو أنه نطق بها لكان من أهل الجنّة وإن لم يعمل؛"], [2020.7, "لأنّ تركَه للعمل في هذه الحالة ليس تركَ اختيار،"], [2025.4, "وإنما تركُ اضطرار؛ بمعنى أنه قام به العذرُ الشرعيّ الذي لا يجعله ملومًا عند الله عز وجل فيما لو ترك شيئًا من العمل."], [2037.0, "فأراد النبيّ صلى الله عليه وسلم أن يستخرج منه هذه الكلمة في تلك السكرات؛"], [2044.4, "لتكون حجّةً له عند الله عز وجل في دخول الجنّة."]], "tr": [[2001.0, "Âlimler buna şöyle cevap verdiler:"], [2003.3, "Ebû Tâlib hayatının sonundaydı; ondan amele niyet etmesi ve ona uyması düşünülemezdi."], [2009.0, "Çünkü Peygamber sallallâhu aleyhi ve sellem onun yanına ancak ölüm sekeratında girmişti."], [2015.0, "Eğer onu söyleseydi, amel etmese bile cennet ehlinden olurdu;"], [2020.7, "çünkü bu hâlde ameli terk etmesi ihtiyarî bir terk değil, zarurî bir terktir."], [2027.0, "Yani onda, amelden bir şey terk etmesi durumunda onu Allah Azze ve Celle katında kınanacak kılmayan şer'î özür bulunmaktadır."], [2037.0, "Peygamber sallallâhu aleyhi ve sellem, o sekerat anında ondan bu kelimeyi çıkarmak istedi ki cennete girmesi hususunda Allah Azze ve Celle katında onun lehine bir hüccet olsun."]]}, {"reader": false, "ar": [[2049.0, "لكن لا حقَّ للمرجئة أن يستدلّوا به على جواز ترك العمل اختيارًا؛"], [2055.0, "فنحن لا نتكلّم فيمن قال:"], [2057.1, "لا إله إلا الله،"], [2058.5, "وكان قادرًا على العمل،"], [2059.9, "وترك جنسَ العمل، وإنما نتكلّم عن رجلٍ في السكرات غيرِ قادرٍ على العمل،"], [2067.0, "فأراد النبيّ صلى الله عليه وسلم منه أن ينطق بهذه الكلمة فقط."], [2072.0, "ولذلك فإنّ المقرَّر شرعًا أنه لا تكليفَ إلا بمقدور،"], [2078.0, "والواجباتُ تسقط بالعجز، والتكاليفُ الشرعيّة منوطةٌ بالقدرة على العلم والعمل؛"], [2087.0, "ومن كان حالُه هكذا فإنه عاجزٌ عن العمل،"], [2092.0, "فهو غيرُ مكلَّفٍ به."]], "tr": [[2049.0, "Fakat Mürcie'nin bununla ameli ihtiyarî olarak terk etmenin caiz olduğuna delil getirme hakkı yoktur."], [2057.1, "Çünkü biz \"Lâ ilâhe illallah\" deyip amele gücü yettiği hâlde amel cinsini terk eden kimse hakkında konuşmuyoruz;"], [2063.4, "bilakis sekerattaki, amele gücü yetmeyen bir adam hakkında konuşuyoruz;"], [2067.8, "Peygamber sallallâhu aleyhi ve sellem ondan sadece bu kelimeyi söylemesini istedi."], [2072.0, "Bu yüzden şer'an sabit olan şudur:"], [2074.7, "Güç yetirilebilen şey dışında teklif yoktur;"], [2078.0, "vacipler acizlikle düşer; şer'î teklifler ilme ve amele güç yetirmeye bağlıdır."], [2087.0, "Hâli böyle olan kimse amelden acizdir; dolayısıyla onunla mükellef değildir."]]}, {"reader": false, "ar": [[2094.0, "فمن قال: لا إله إلا الله من الكفّار،"], [2098.0, "وعاجلته المنيّةُ، لم يتمكّن من العمل،"], [2103.0, "دخل الجنّة؛ لا لأنه ترك العمل،"], [2106.0, "ولا لأنّ العمل ليس ركنًا في الإيمان،"], [2109.0, "وإنما لأنه لم يكن قادرًا على العمل،"], [2114.0, "وليس بمكلَّفٍ به بسبب عجزه."]], "tr": [[2094.0, "Kâfirlerden kim \"Lâ ilâhe illallah\" der de ölüm ona yetişip amel etme imkânı bulamazsa cennete girer;"], [2104.0, "ameli terk ettiği için değil, amel imanda bir rükün olmadığı için de değil;"], [2109.7, "ancak amele gücü yetmediği ve acizliği sebebiyle onunla mükellef olmadığı için."]]}]}, {"ts": "35:17", "title": "5. Külliye (devam): İbnü'l-Kayyim'in sözü; Huzeyfe hadisi", "paras": [{"reader": false, "ar": [[2117.0, "ولذلك يقول الإمام ابن القيّم رحمه الله:"], [2121.0, "«ولا يُجزئ باطنٌ لا ظاهرَ له، إلا إذا تعذّر بعجزٍ أو إكراهٍ أو خوفِ هلاك»."], [2130.7, "انتهى كلامه. فالخلافُ في تخلُّف العمل الظاهر مع القدرة التامّة وعدم المانع،"], [2138.0, "وليس في حال العجز عن العمل أو عدم القدرة عليه."]], "tr": [[2117.0, "Bu yüzden İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle der:"], [2121.0, "\"Zâhiri olmayan bâtın yeterli olmaz;"], [2123.0, "ancak (zâhir) acizlik, ikrah veya helak korkusuyla imkânsız hâle gelirse (müstesna).\" Sözü burada bitti."], [2130.7, "O hâlde ihtilaf, tam güç bulunduğu ve engel olmadığı hâlde zâhirî amelin geri kalması hakkındadır;"], [2138.5, "amelden aciz olma veya ona güç yetirememe hâli hakkında değildir."]]}, {"reader": false, "ar": [[2143.0, "ومثلُه أيضًا حديثُ حُذيفة في قول النبيّ صلى الله عليه وسلم:"], [2149.0, "«يَدرُسُ الإسلامُ» ـ أن يتلاشى وينتهي ـ «كما يَدرُسُ وَشْيُ الثوب» ـ الزَّرِيّ <span class=\"q\">؟ 35:55<\/span>؛"], [2165.0, "أوّلَ ما يُخاط يصير يلمع،"], [2168.0, "ولكن مع الغسيل والشمس واستعمال الثوب يبدأ بريقُه ولمعانُه يتلاشى، أليس كذلك؟ ـ"]], "tr": [[2143.0, "Bunun bir benzeri de Peygamber sallallâhu aleyhi ve sellem'in şu sözündeki Huzeyfe hadisidir:"], [2149.0, "\"İslâm silinip gidecek\" —yani yok olup bitecek— \"elbisenin nakışının silinip gittiği gibi\" —sırma işlemeli (elbise) <span class=\"q\">؟<\/span>;"], [2166.2, "ilk dikildiğinde parlar, fakat yıkanma, güneş ve elbisenin kullanılmasıyla parlaklığı ve ışıltısı yok olmaya başlar; öyle değil mi?—"]]}, {"reader": false, "ar": [[2175.7, "فقال صلى الله عليه وسلم:"], [2177.0, "«يَدرُسُ الإسلامُ كما يَدرُسُ وَشْيُ الثوب، حتى لا يُدرى ما صيامٌ ولا صدقةٌ ولا نُسُك، ولَيُسرى على كتاب الله في ليلةٍ فلا يبقى في الأرض منه آية، ويبقى طوائفُ من الناس: الشيخُ الكبير والعجوز، يقولون: أدركنا آباءنا على لا إله إلا الله، فنحن نقولها»."], [2201.0, "قال صِلةُ لحذيفة: وما تُغنيهم لا إله إلا الله؟"], [2207.0, "فما أجابه حتى ردّها ثلاثًا،"], [2210.0, "فأقبل عليه وقال: «يا صِلةُ، تُنجيهم من النار»."]], "tr": [[2175.7, "Buyurdu ki: \"İslâm, elbisenin nakışının silinip gittiği gibi silinip gidecek;"], [2177.0, "öyle ki oruç nedir, sadaka nedir, kurban (ibadet) nedir bilinmeyecek."], [2182.7, "Allah'ın Kitabı bir gecede (yerinden) kaldırılacak da yeryüzünde ondan tek bir ayet kalmayacak."], [2188.5, "İnsanlardan bazı topluluklar kalacak; yaşlı adam ve yaşlı kadın, 'Atalarımızı Lâ ilâhe illallah üzere bulduk, biz de onu söylüyoruz' diyecekler.\" Sıla, Huzeyfe'ye dedi ki:"], [2201.0, "\"Lâ ilâhe illallah onlara ne fayda verir?\" (Huzeyfe) ona cevap vermedi;"], [2207.0, "nihayet (Sıla) bunu üç kez tekrarladı."], [2209.4, "Bunun üzerine ona yönelip dedi ki:"], [2211.9, "\"Ey Sıla! Onları ateşten kurtarır.\""]]}, {"reader": false, "ar": [[2215.0, "ففرح المرجئةُ بهذا الحديث الذي يدلّ على أنّ من قال:"], [2221.4, "لا إله إلا الله فإنه يدخل الجنّة وإن لم يُصلِّ،"], [2226.0, "وإن لم يُزكِّ، وإن لم يحُجّ،"], [2230.0, "وإن لم يعمل من الإسلام شيئًا."], [2232.0, "ولكن لو تأمّلتم هذا الحديث لوجدتموه فيمن ترك العمل ـ إيش يا جماعة؟"], [2240.0, "ـ عن عذرٍ شرعيّ، وعن عجزٍ عن العمل،"], [2245.0, "وعن عدم قدرةٍ على أداء الواجب شرعًا؛"], [2249.0, "وذلك بسبب الجهل الذي يُطبِق على أهل الأرض،"], [2253.0, "ويموت فيه العلماء، ويُرفَع فيه كتابُ الله عز وجل،"], [2259.0, "ولا يبقى في الأرض من يقرأ قرآنًا ولا يدرس حديثًا،"], [2263.0, "وينتشر الجهل؛ فلا يدري الناسُ كيف يُصلّون،"], [2269.1, "ولا كيف يصومون، ولا كيف يحجّون أو يعتمرون."]], "tr": [[2215.0, "Mürcie bu hadise sevindi; (onlara göre) bu hadis, \"Lâ ilâhe illallah\" diyen kimsenin namaz kılmasa, zekât vermese, hac yapmasa ve İslâm'dan hiçbir amel işlemese bile cennete gireceğine delâlet ediyor."], [2232.0, "Fakat bu hadisi iyice düşünseydiniz, onun ameli —ne sebeple, ey cemaat?— şer'î bir özür sebebiyle, amelden acizlik sebebiyle ve vacibi şer'an eda etmeye güç yetirememe sebebiyle terk eden kimse hakkında olduğunu görürdünüz."], [2249.0, "Bu da yeryüzü ehlini kaplayan cehalet sebebiyledir;"], [2252.5, "o (dönemde) âlimler ölür, Allah Azze ve Celle'nin Kitabı kaldırılır, yeryüzünde Kur'an okuyan ve hadis okutan kimse kalmaz ve cehalet yayılır."], [2266.0, "İnsanlar nasıl namaz kılacaklarını, nasıl oruç tutacaklarını, nasıl hac veya umre yapacaklarını bilmezler."]]}, {"reader": false, "ar": [[2273.0, "فتركُهم للعمل ليس تركَ اختيار،"], [2278.0, "وإنما كان تركًا عن عذر."], [2280.0, "والكلّيّة تدلّ على أنّ كلَّ من ترك العمل عن عذرٍ فلا يؤثّر ذلك في إيمانه."], [2287.0, "ولذلك ينبغي لكم أن تعلموا أنّ أحوال الناس في اقتران كلمة التوحيد بالعمل لا تخرج عن عدّة أقسام:"], [2300.0, "القسمُ الأوّل: من مات بعد قوله:"], [2305.0, "لا إله إلا الله،"], [2307.9, "ولم يُمهَل ليعمل؛ فهذا بإجماع أهل العلم معذور،"], [2313.0, "وتركُه للعمل إنما كان تركَ اضطرارٍ لا تركَ اختيار،"], [2319.0, "وتركَ عذرٍ لا تركَ اعتباطٍ أو كسل."]], "tr": [[2273.0, "Onların ameli terk etmesi ihtiyarî bir terk değildir;"], [2278.4, "bilakis özür sebebiyle bir terktir."], [2280.0, "Külliye de, ameli bir özür sebebiyle terk eden herkesin bu durumunun imanına etki etmediğine delâlet eder."], [2287.0, "Bu yüzden şunu bilmeniz gerekir:"], [2290.6, "İnsanların, tevhid kelimesinin amelle birlikte bulunması hususundaki hâlleri birkaç kısmın dışına çıkmaz."], [2300.0, "Birinci kısım: \"Lâ ilâhe illallah\" dedikten sonra ölen ve amel etmesi için kendisine mühlet verilmeyen kimse."], [2310.0, "Bu kimse ilim ehlinin icmâıyla mazurdur;"], [2313.0, "onun ameli terk etmesi ihtiyarî değil zarurî bir terktir;"], [2318.3, "gelişigüzellik veya tembellikten değil, özürden kaynaklanan bir terktir."]]}, {"reader": false, "ar": [[2324.0, "الثاني: من قال: لا إله إلا الله،"], [2328.8, "وجاء بجنس الأعمال معها؛"], [2333.0, "فهذا من يصدق عليه وصفُ المؤمن عند أهل السنة والجماعة،"], [2339.0, "وعند عامّة الطوائف. الثالث:"], [2341.7, "من قال: لا إله إلا الله،"], [2345.7, "ولا يعرف من الدين ـ مثلًا ـ إلا هي <span class=\"q\">؟ 39:01<\/span>؛"], [2351.0, "كأن يكون في ناحيةٍ من الأرض يعُمّها الجهل،"], [2355.6, "وليس فيها من يتعلّم على يديه؛"], [2359.0, "فهذه الحالة أيضًا صاحبُها معذور."], [2365.0, "وتلك الحالةُ الثالثة هي التي دلّلنا عليها،"], [2367.0, "هي التي يدلّ عليها سياقُ حديث حذيفة رضي الله عنه."]], "tr": [[2324.0, "İkincisi: \"Lâ ilâhe illallah\" diyen ve onunla birlikte amel cinsini getiren kimse."], [2333.0, "Ehl-i Sünnet ve'l-Cemaat'e göre ve fırkaların geneline göre mümin vasfı bu kimseye uyar."], [2341.0, "Üçüncüsü: \"Lâ ilâhe illallah\" diyen ve dinden —mesela— ondan başka bir şey bilmeyen kimse <span class=\"q\">؟<\/span>;"], [2351.0, "cehaletin kapladığı ve elinde ilim öğrenilecek kimsenin bulunmadığı yeryüzünün bir köşesinde bulunması gibi."], [2359.0, "Bu hâlin sahibi de mazurdur."], [2365.0, "O üçüncü hâl, delil getirdiğimiz, Huzeyfe —Allah ondan razı olsun— hadisinin siyakının delâlet ettiği hâldir."]]}, {"reader": false, "ar": [[2375.0, "ومن المعلوم أنّ الأزمنة التي يندرس فيها العلم ويظهر فيها الجهل كثيرةٌ متكرّرة حتى تقوم الساعة."], [2384.0, "والخلاصةُ من ذلك أنّ هذه الأحاديث ليس فيها أدنى حجّةٍ لمن زعم أنّ تركَ العمل بالكلّيّة مع القدرة أنّ صاحبَه معذورٌ عند الله عز وجل؛"]], "tr": [[2375.0, "Bilindiği üzere ilmin silinip gittiği ve cehaletin ortaya çıktığı zamanlar kıyamet kopuncaya kadar çok ve tekrar edip durandır."], [2384.0, "Bunun özeti şudur: Bu hadislerde, güç yettiği hâlde ameli tamamen terk edenin Allah Azze ve Celle katında mazur olduğunu iddia eden kimse için en ufak bir delil yoktur."]]}]}, {"ts": "39:59", "title": "5. Külliye (devam): Ehl-i Sünnet'e göre amel cinsi olmadan iman sahih olmaz", "paras": [{"reader": false, "ar": [[2399.0, "فإنّ أهل السنة يقولون بأنه لا يصحّ إيمانُ العبد إلا إذا نطق بالشهادتين وجاء بجنس العمل."], [2410.0, "فلا يجوز أن نشهد بالإيمان لرجلٍ يكتفي من الإسلام بالنطق بالشهادتين،"], [2417.0, "ولا يؤيّدها ولو بجنس الأعمال؛"], [2420.0, "فلا يُصلّي، ولا يصوم،"], [2422.0, "ولا يحجّ، ولا يُزكّي،"], [2424.0, "ولا يتصدّق، بل عاش دهرَه كلَّه لا يسجد لله سجدةً،"], [2428.0, "ولا يصوم يومًا من رمضان،"], [2430.3, "ولا يؤدّي لله شيئًا من الزكوات،"], [2433.0, "ولا يحجّ إلى بيت الله؛"], [2435.0, "فهذا لا يمكن أبدًا أن يصدق عليه وصفُ الإيمان."], [2439.0, "والخلاصةُ من ذلك أنّ هذه الأحاديث لا يجوز أن تُفهَم إلا على مقتضى هذه الكلّيّة. والله أعلم."]], "tr": [[2399.0, "Çünkü Ehl-i Sünnet şöyle der:"], [2404.0, "Kulun imanı, ancak iki şehadeti söyler ve amel cinsini getirirse sahih olur."], [2410.0, "İslâm'dan iki şehadeti söylemekle yetinen ve onu —amel cinsiyle bile olsa— desteklemeyen bir adamın imanına şahitlik etmemiz caiz değildir:"], [2420.0, "Namaz kılmaz, oruç tutmaz, hac yapmaz, zekât vermez, sadaka vermez;"], [2424.5, "bilakis bütün ömrünü Allah için tek bir secde etmeden, Ramazan'dan tek bir gün oruç tutmadan, Allah için zekâtlardan hiçbir şey eda etmeden ve Allah'ın Evi'ni haccetmeden geçirmiştir."], [2435.0, "Böyle birine iman vasfının uyması asla mümkün değildir."], [2439.0, "Bunun özeti şudur: Bu hadislerin ancak bu külliyenin gereğine göre anlaşılması caizdir. Allah en iyisini bilir."]]}]}, {"ts": "40:46", "title": "6. Külliye: Sadece iki şehadeti söylemekle İslâm hükmü veren her nasta dünya hükümleri kastedilir", "paras": [{"reader": false, "ar": [[2446.0, "ومن الكلّيّات أيضًا: <b>كلُّ نصٍّ فيه الحكمُ بالإسلام بمجرّد النطق بالشهادتين فالمرادُ به في أحكام الدنيا.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2446.0, "Külliyelerden biri de şudur: 6."], [2448.8, "külliye: Sadece iki şehadeti söylemekle İslâm hükmü verilen her nasta, dünya hükümleri kastedilir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2471.0, "أقول وبالله تعالى التوفيق:"], [2474.0, "وهذا أيضًا قسمٌ من أقسام استدلال المرجئة على إخراج العمل عن الإيمان؛"], [2480.0, "وهي أنّ عندنا جُملًا من الأدلّة تدلّ على أنّنا نتعامل بحكم الإسلام مع من نطق بالشهادتين."], [2489.0, "بل إنّ النبيّ صلى الله عليه وسلم حكم على الجارية التي قالت:"], [2495.7, "في السماء ـ عفوًا ـ بل إنّ النبيّ صلى الله عليه وسلم لمّا سأل الجارية:"], [2502.3, "«أين الله؟» قالت: «في السماء»،"], [2506.0, "فقال صلى الله عليه وسلم:"], [2508.5, "«أعتِقْها فإنها مؤمنة»؛ فشهد لها بالإيمان بمجرّد الإقرار،"], [2514.0, "ولم يسأل: هل هي عملت أو لم تعمل؟"]], "tr": [[2471.0, "Tevfik Allah Teâlâ'dandır, derim ki:"], [2474.0, "Bu da Mürcie'nin ameli imandan çıkarmaya delil getirme kısımlarından bir kısımdır."], [2480.0, "O da şudur: Elimizde, iki şehadeti söyleyen kimseye İslâm hükmüyle muamele ettiğimize delâlet eden birçok delil vardır."], [2489.0, "Hatta Peygamber sallallâhu aleyhi ve sellem \"gökte\" diyen câriye hakkında hüküm verdi —pardon— hatta Peygamber sallallâhu aleyhi ve sellem câriyeye \"Allah nerede?\" diye sorduğunda \"Gökte\" dedi;"], [2502.3, "bunun üzerine sallallâhu aleyhi ve sellem:"], [2503.9, "\"Onu âzat et, çünkü o mümindir\" buyurdu."], [2508.5, "Böylece sadece ikrar ile onun imanına şahitlik etti ve \"Amel etti mi, etmedi mi?\" diye sormadı."]]}, {"reader": false, "ar": [[2519.0, "وكذلك أيضًا في الصحيح من حديث أبي هريرة رضي الله عنه في قوله صلى الله عليه وسلم:"], [2527.0, "«أُمرتُ أن أقاتل الناس حتى يقولوا: لا إله إلا الله، فمن قالها عصم منّي نفسَه ومالَه إلا بحقّه» ـ الحديثَ بتمامه ـ؛"], [2539.0, "فهنا رتّب أحكامَ الإسلام على مجرّد النطق."], [2545.0, "فقال المرجئة بأنّ هذه النصوص تدلّ على أنّ من نطق بالشهادتين فإنه محكومٌ بإسلامه وإيمانه ولو لم يُقارنه عمل."]], "tr": [[2519.0, "Aynı şekilde Sahîh'te Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde, sallallâhu aleyhi ve sellem'in şu sözünde de böyledir:"], [2527.0, "\"İnsanlarla, Lâ ilâhe illallah deyinceye kadar savaşmakla emrolundum."], [2529.8, "Kim onu söylerse, hakkı olan müstesna, canını ve malını benden korumuş olur\" —hadisin tamamı—."], [2539.0, "Burada İslâm hükümlerini sadece söylemeye bağlamıştır."], [2545.0, "Mürcie dedi ki: Bu naslar, iki şehadeti söyleyen kimsenin, beraberinde amel bulunmasa bile İslâm'ına ve imanına hükmedileceğine delâlet eder."]]}, {"reader": false, "ar": [[2557.0, "والجوابُ عن هذا الاستدلال هو هذه الكلّيّة؛"], [2565.0, "وهي أنّ الأحكام تنقسم إلى قسمين:"], [2569.0, "أحكامٌ على الشخص في الدنيا فيما بيننا وبينه،"], [2573.0, "وأحكامٌ على العبد في باطنه فيما بينه وبين الله عز وجل."], [2580.0, "فصاحبُ هذه الشبهة لم يفرّق بين أحكام الدنيا وأحكام الآخرة."], [2588.0, "ولذلك فإنّ المنافقين كانوا ينطقون بالشهادتين بين يدي النبيّ صلى الله عليه وسلم مع كفر قلوبهم،"], [2597.7, "وكان يقبل منهم ويعاملهم معاملةَ المسلمين."], [2601.0, "فالأحكامُ في هذه الدنيا على الظواهر،"], [2605.3, "والسرائرُ تبعٌ لها؛ وأمّا الأحكام فيما بين العبد وبين ربّه،"], [2611.8, "أو في الآخرة، فإنها على السرائر، والظواهرُ تبعٌ لها."]], "tr": [[2557.0, "Bu istidlalin cevabı bu külliyedir."], [2565.0, "O da şudur: Hükümler iki kısma ayrılır:"], [2569.0, "Dünyada, bizimle kişi arasındaki (ilişkide) kişi hakkındaki hükümler;"], [2573.0, "ve kulun bâtını hakkında, kendisiyle Allah Azze ve Celle arasındaki hükümler."], [2580.0, "Bu şüpheyi ileri süren kimse dünya hükümleriyle âhiret hükümleri arasını ayırmamıştır."], [2588.0, "Bu yüzden münafıklar, kalpleri kâfir olduğu hâlde Peygamber sallallâhu aleyhi ve sellem'in huzurunda iki şehadeti söylerlerdi;"], [2596.0, "o da onlardan kabul eder ve onlara Müslümanlar muamelesi yapardı."], [2601.0, "O hâlde bu dünyadaki hükümler zâhirlere göredir, gizli şeyler (sarâir) onlara tâbidir."], [2609.8, "Kul ile Rabbi arasındaki veya âhiretteki hükümler ise gizli şeylere göredir, zâhirler onlara tâbidir."]]}, {"reader": false, "ar": [[2617.0, "فأحكامُ الناس في هذه الدنيا على قسمين:"], [2623.0, "إمّا أن نعاملهم معاملةَ المسلمين إذا أظهروا الإسلامَ بالنطق بالشهادتين؛"], [2629.0, "فكلُّ من نطق بالشهادتين فقد جاء بالشرط الذي يُوجب على إخوانه أن يعاملوه معاملةَ المسلمين."], [2638.0, "وهناك من نعاملهم معاملةَ الكفرة،"], [2641.5, "وهم الذين لم ينطقوا بالشهادتين."], [2647.0, "فكلُّ من جاء بالشهادتين فإنّنا نحكم له بالإسلام فيما بيننا وبينه،"], [2653.5, "ونَكِل أمرَه إلى الله عز وجل."]], "tr": [[2617.0, "İnsanların bu dünyadaki hükümleri iki kısımdır:"], [2623.0, "Ya iki şehadeti söyleyerek İslâm'ı izhar ettiklerinde onlara Müslümanlar muamelesi yaparız;"], [2629.0, "iki şehadeti söyleyen herkes, kardeşlerinin ona Müslümanlar muamelesi yapmasını gerektiren şartı getirmiş olur."], [2638.0, "Bir de kâfirler muamelesi yaptığımız kimseler vardır;"], [2641.5, "onlar da iki şehadeti söylemeyenlerdir."], [2647.0, "İki şehadeti getiren herkese, bizimle onun arasında İslâm hükmü veririz ve işini Allah Azze ve Celle'ye havale ederiz."]]}, {"reader": false, "ar": [[2657.0, "وقد اتّفق العلماء على أنّ اسمَ المسلمين في الظاهر يجري على المنافقين مع كفر قلوبهم؛"], [2666.0, "لأنهم استسلموا ظاهرًا، وأتَوا بما أتَوا به من الأعمال الظاهرة:"], [2670.0, "بالصلاة الظاهرة، والزكاة الظاهرة،"], [2672.5, "والحجّ الظاهر، والجهاد الظاهر."], [2675.0, "وكان النبيّ صلى الله عليه وسلم يقبل منهم العلانيةَ،"], [2679.8, "ويَذَر سرائرَهم إلى الله عز وجل،"], [2683.0, "مع أنّ الله قال:"], [2684.8, "<span class=\"ayah\">﴿إِنَّ الْمُنَافِقِينَ فِي الدَّرْكِ الْأَسْفَلِ مِنَ النَّارِ﴾<\/span> <span class=\"ref\">[النساء: ١٤٥]<\/span>."], [2688.0, "فلا حقَّ لأحدٍ أن يستدلّ بهذه الأدلّة التي فيها إجراءُ أحكام الإسلام على مجرّد النطق بالشهادتين،"], [2697.5, "لا حقَّ له أن يستدلّ بها على إخراج العمل."]], "tr": [[2657.0, "Âlimler, kalplerinin küfrüne rağmen zâhirde Müslümanlar isminin münafıklara da cârî olduğunda ittifak etmişlerdir;"], [2666.0, "çünkü onlar zâhiren teslim olmuşlar ve zâhirî amellerden getirdiklerini getirmişlerdir:"], [2670.0, "zâhirî namaz, zâhirî zekât, zâhirî hac ve zâhirî cihad."], [2675.0, "Peygamber sallallâhu aleyhi ve sellem onlardan açıkta olanı kabul eder, gizli yönlerini Allah Azze ve Celle'ye bırakırdı."], [2684.8, "Hâlbuki Allah şöyle buyurmuştur: <span class=\"ayah\">﴿Şüphesiz münafıklar ateşin en alt tabakasındadır﴾<\/span> [Nisâ 145]."], [2690.3, "O hâlde hiç kimsenin, sadece iki şehadeti söylemeye İslâm hükümlerinin uygulanmasını içeren bu delillerle, ameli (imandan) çıkarmaya delil getirme hakkı yoktur."]]}]}, {"ts": "45:03", "title": "6. Külliye (devam): Zâhir ve bâtın hükümleri; Üsâme hadisi", "paras": [{"reader": false, "ar": [[2703.0, "لماذا؟ لأنها تدلّ على وجوب معاملة من نطق بالشهادتين معاملةَ المسلمين في الظاهر،"], [2712.0, "وأمّا وصفُ الإيمان فيما بينه وبين الله فإنّ ذلك أمرُه ومردُّه إلى الله عز وجل."], [2720.0, "ولذلك فقولُه صلى الله عليه وسلم لهذه الجارية ـ لمّا قالت عن ربّها:"], [2726.0, "في السماء ـ: «أعتِقْها فإنها مؤمنة» لا يريد به إثباتَ الإيمان الباطنيّ الذي تحصل به النجاةُ فيما بينها وبين الله عز وجل،"], [2736.0, "وإنما يريد إجراءَ أحكام الإسلام ظاهرًا عليها."]], "tr": [[2703.0, "Niçin? Çünkü bu deliller, iki şehadeti söyleyen kimseye zâhirde Müslümanlar muamelesi yapmanın vacip olduğuna delâlet eder."], [2712.5, "Kendisiyle Allah arasındaki iman vasfına gelince, onun işi ve dönüşü Allah Azze ve Celle'yedir."], [2720.0, "Bu yüzden sallallâhu aleyhi ve sellem'in, Rabbi hakkında \"gökte\" dediğinde bu câriye için \"Onu âzat et, çünkü o mümindir\" sözüyle, kendisiyle Allah Azze ve Celle arasında kurtuluşun onunla gerçekleştiği bâtınî imanı isbat etmeyi kastetmez;"], [2735.6, "ancak onun hakkında zâhiren İslâm hükümlerinin uygulanmasını kasteder."]]}, {"reader": false, "ar": [[2742.0, "والواجباتُ الإيمانيّة منها ما هو واجبُ الظاهر،"], [2746.0, "ومنها ما هو واجبُ الباطن؛"], [2748.0, "فالأحكامُ بيننا وبين الناس إنما تكون على ما يُظهرونه،"], [2754.0, "لا ما يُخفونه. فلله تعالى حكمان:"], [2757.9, "حكمٌ في الدنيا على الشرائع الظاهرة وأعمال الجوارح،"], [2763.0, "وحكمٌ في الآخرة على الظواهر والبواطن."], [2767.0, "ولهذا كان النبيّ صلى الله عليه وسلم يكتفي في وصف الشخص بأنه مسلمٌ بمجرّد النطق بالشهادتين."]], "tr": [[2742.0, "İmanî vaciplerin bir kısmı zâhirin vacibi, bir kısmı bâtının vacibidir."], [2748.0, "Bizimle insanlar arasındaki hükümler ancak onların gizlediklerine göre değil, açığa vurduklarına göre olur."], [2756.0, "Allah Teâlâ'nın iki hükmü vardır:"], [2757.9, "Dünyada zâhirî şeriatlere ve azaların amellerine göre bir hüküm;"], [2762.4, "âhirette ise zâhirlere ve bâtınlara göre bir hüküm."], [2767.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem, bir kişiyi Müslüman olarak vasıflandırmada sadece iki şehadeti söylemesiyle yetinirdi."]]}, {"reader": false, "ar": [[2777.0, "ولذلك في الصحيحين من حديث أسامة رضي الله عنه أنّ النبيّ صلى الله عليه وسلم بعثه في سريّة،"], [2784.9, "قال: «فصبّحنا الحُرَقاتِ من جُهينة، فأدركتُ رجلًا، فلمّا رأى شعاعَ السيف قال: أسلمتُ لله» ـ وفي روايةٍ:"], [2792.9, "قال: لا إله إلا الله ـ «قال: فعلوتُه بالسيف حتى برد، فجاء الخبرُ إلى النبيّ صلى الله عليه وسلم، فدعاني وقال: يا أسامة» ـ انتبه ـ «أقتلتَه بعد أن قال: لا إله إلا الله؟ قال: قلتُ: يا رسول الله، إنما كان متعوِّذًا. قال: أفلا شققتَ عن قلبه حتى تعلم أقالها أم لا؟»."]], "tr": [[2777.0, "Bu yüzden Sahîhayn'de Üsâme'nin —Allah ondan razı olsun— hadisinde, Peygamber sallallâhu aleyhi ve sellem'in onu bir seriyyede gönderdiği (rivayet edilir)."], [2781.0, "Dedi ki: \"Cüheyne'den Hurakât'a sabah baskını yaptık."], [2782.7, "Bir adama yetiştim; kılıcın parıltısını görünce 'Allah'a teslim oldum' dedi\" —bir rivayette:"], [2785.3, "'Lâ ilâhe illallah' dedi— \"Dedi ki:"], [2787.0, "Onu kılıçla vurdum, nihayet soğudu (öldü)."], [2789.8, "Haber Peygamber sallallâhu aleyhi ve sellem'e ulaştı."], [2792.9, "Beni çağırıp 'Ey Üsâme!' dedi\" —dikkat et— \"'Lâ ilâhe illallah dedikten sonra onu öldürdün mü?' Dedi ki:"], [2804.2, "Dedim ki: 'Ey Allah'ın Resûlü, o sadece (ölümden) sığınmak için söyledi.' Buyurdu ki:"], [2810.2, "'Onu söyleyip söylemediğini bilmek için kalbini yarıp baktın mı?'\""]]}, {"reader": false, "ar": [[2815.0, "فإذًا أنت لا شأنَ لك بإيمان الباطن،"], [2819.0, "وإنما الشأنُ فيما يُظهره الإنسان."], [2823.0, "وإلا فمن المعلوم أنّ رجلًا يؤخّر النطقَ بالشهادتين،"], [2827.0, "ويجاهد مع الكفّار، ولا ينطق بكلمة التوحيد إلا بعد القدرة عليه؛"], [2834.0, "فهذه قرينةٌ ظاهرة أنه لم ينطق بها إلا تعوُّذًا من القتل."], [2840.0, "ومع ذلك نهاه النبيّ صلى الله عليه وسلم أن يتجاوز الظاهر،"], [2846.4, "فقال له: «أفلا شققتَ عن قلبه حتى تعلم أقالها أم لا؟»،"], [2851.0, "«كيف تصنع بلا إله إلا الله إذا جاءت يوم القيامة؟»."]], "tr": [[2815.0, "Demek ki senin bâtındaki imanla bir işin yoktur;"], [2819.0, "iş, insanın açığa vurduğu şeydedir."], [2823.0, "Yoksa bilinen bir şeydir ki iki şehadeti söylemeyi geciktiren, kâfirlerle birlikte savaşan ve tevhid kelimesini ancak kendisine güç yetirildikten sonra söyleyen bir adam (hakkında), bu, onu ancak öldürülmekten sığınmak için söylediğine dair açık bir karinedir."], [2840.0, "Buna rağmen Peygamber sallallâhu aleyhi ve sellem onu zâhiri aşmaktan nehyetti ve ona şöyle buyurdu:"], [2847.3, "\"Onu söyleyip söylemediğini bilmek için kalbini yarıp baktın mı?\" \"Kıyamet günü Lâ ilâhe illallah geldiğinde ne yapacaksın?\""]]}, {"reader": false, "ar": [[2855.0, "ولهذا كان النبيّ صلى الله عليه وسلم يقبل علانيةَ المنافقين،"], [2860.0, "ويَكِل سرائرَهم إلى الله،"], [2862.0, "فيتناكحون فيما بينهم، ويتوارثون فيما بينهم،"], [2867.0, "ويدخلون عليه المسجد، ويخرجون معه للجهاد،"], [2871.1, "ويعطيهم حقوقَ الإسلام من الفيء والغنائم."], [2876.0, "فلا حقَّ للمرجئة أبدًا أن يستدلّوا بهذه النصوص التي تُثبت الإيمانَ أو الإسلام بمجرّد النطق؛"], [2885.0, "لأنها تدلّ على ثبوت أحكام الإسلام في الظاهر،"], [2888.5, "والكلامُ فيما بيننا وبينهم على الإيمان في الباطن."]], "tr": [[2855.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem münafıkların açıkta olanını kabul eder, gizli yönlerini Allah'a havale ederdi."], [2861.5, "(Müslümanlarla) birbirleriyle evlenirler, birbirlerine mirasçı olurlar, mescidde onun yanına girerler, onunla birlikte cihada çıkarlardı;"], [2869.7, "o da onlara fey ve ganimetlerden İslâm'ın haklarını verirdi."], [2876.0, "O hâlde Mürcie'nin, imanı veya İslâm'ı sadece söylemekle sabit kılan bu naslarla delil getirme hakkı asla yoktur."], [2885.0, "Çünkü bu naslar zâhirde İslâm hükümlerinin sabit olduğuna delâlet eder;"], [2888.5, "bizimle onlar arasındaki tartışma ise bâtındaki iman hakkındadır."]]}, {"reader": false, "ar": [[2892.0, "أسأل الله عز وجل أن يجعلنا وإيّاكم من الموفّقين."], [2895.9, "هذا اللي أقدر عليه، سامحوني."]], "tr": [[2892.0, "Allah Azze ve Celle'den, bizi de sizi de muvaffak olanlardan kılmasını dilerim."], [2895.9, "Gücümün yettiği bu kadar, beni bağışlayın."]]}, {"reader": false, "ar": [[2898.0, "والله أعلى وأعلم، وصلى الله وسلم على نبيّنا محمد."]], "tr": [[2898.0, "Allah en yüce olan ve en iyi bilendir."], [2899.6, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");

function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
