ükrederseniz...\" <span class=\"ayah\">﴿Eğer inkâr ederseniz, şüphesiz Allah sizden müstağnidir; ama kullarının inkâr etmesinden razı olmaz﴾<\/span> [Zümer 7] —yani makdûr olarak;"], [2796.4, "yani kullarının makdûr olarak küfrüne razı olmaz—."]]}, {"reader": false, "ar": [[2803.0, "وكذلك أيضًا يقول الله عز وجل:"], [2807.1, "<span class=\"ayah\">﴿إِذْ يُبَيِّتُونَ مَا لَا يَرْضَىٰ مِنَ الْقَوْلِ﴾<\/span> <span class=\"ref\">[النساء: ١٠٨]<\/span>،"], [2812.0, "ويقول الله عز وجل في آياتٍ كثيرة:"], [2816.6, "<span class=\"ayah\">﴿لَا يُحِبُّ الظَّالِمِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ٥٧]<\/span>، <span class=\"ayah\">﴿لَا يُحِبُّ الْخَائِنِينَ﴾<\/span> <span class=\"ref\">[الأنفال: ٥٨]<\/span>،"], [2820.6, "<span class=\"ayah\">﴿لَا يُحِبُّ الْفَسَادَ﴾<\/span> <span class=\"ref\">[البقرة: ٢٠٥]<\/span>، أليس كذلك؟"], [2824.2, "وأخبرنا بالعقوبات المغلّظة على من مات كافرًا،"], [2828.3, "أو على من زنى،"], [2830.7, "أو على من سرق،"], [2833.0, "أو على من شرب الخمر؛"], [2836.0, "وتلك العقوبات دليلٌ على عدم رضاه عن هذا الكفر،"], [2840.2, "أو هذه الذنوب والمعاصي."]], "tr": [[2803.0, "Aynı şekilde Allah Azze ve Celle şöyle buyurur:"], [2807.1, "<span class=\"ayah\">﴿Hani geceleyin, O'nun razı olmadığı sözü (gizlice) kurarlar﴾<\/span> [Nisâ 108]."], [2812.0, "Allah Azze ve Celle birçok ayette şöyle buyurur:"], [2816.6, "<span class=\"ayah\">﴿Zalimleri sevmez﴾<\/span> [Âl-i İmrân 57], <span class=\"ayah\">﴿Hainleri sevmez﴾<\/span> [Enfâl 58], <span class=\"ayah\">﴿Bozgunculuğu sevmez﴾<\/span> [Bakara 205];"], [2824.2, "öyle değil mi? Bize kâfir olarak ölene, zina edene, hırsızlık yapana veya içki içene ağır cezalar olduğunu haber vermiştir."], [2836.0, "Bu cezalar, O'nun bu küfürden veya bu günah ve masiyetlerden razı olmadığının delilidir."]]}, {"reader": false, "ar": [[2842.0, "فإن قال لك قائل:"], [2844.3, "هل نرضى بالمخالفات الشرعية إذا وُجدت في الكون،"], [2849.0, "لأنها مما قضاه الله وقدّره،"], [2852.0, "والواجب على المسلم أن يرضى بقضاء الله وقدره؟"], [2856.0, "فهو يريد أن يُلزمك بهذا الإلزام:"], [2859.0, "فبما أنّ الكفر لا يكون إلا بقدر الله،"], [2863.0, "وأنّ البدعة لا تكون إلا بقدر الله،"], [2866.0, "وأنّ الظلم والفواحش والآثام لا تكون إلا بقدر الله،"], [2872.0, "والواجب على المسلم بالدليل الرضا بقدر الله،"], [2876.0, "فلماذا لا ترضون عن وجود هذه الأشياء في أرض الله؟"]], "tr": [[2842.0, "Biri sana şöyle derse: \"Şer'î muhalefetler kâinatta var olduklarında onlara razı olur muyuz?"], [2850.8, "Çünkü onlar Allah'ın hükmettiği ve takdir ettiği şeylerdendir;"], [2856.0, "Müslüman'a düşen de Allah'ın kaza ve kaderine razı olmaktır.\" O, seni şu ilzamla bağlamak ister:"], [2859.0, "Madem küfür ancak Allah'ın kaderiyle olur, bid'at ancak Allah'ın kaderiyle olur, zulüm, çirkin işler ve günahlar ancak Allah'ın kaderiyle olur ve delile göre Müslüman'a düşen Allah'ın kaderine razı olmaktır;"], [2874.9, "o hâlde niçin bu şeylerin Allah'ın arzında var olmasına razı olmuyorsunuz?"]]}, {"reader": false, "ar": [[2880.0, "فنقول: الجوابُ على ذلك هو بالتفريق بين كونها قدرًا وبين كونها مقدورة؛"], [2888.0, "فنحن نرضى بها باعتبار كونها قدرًا ـ أي فعلًا لله عز وجل ـ،"], [2893.0, "ولا نرضى بها باعتبار كونها مقدورةً ـ أي فعلًا للعبد ـ."], [2900.0, "ولذلك لم تظهر آثارُها القبيحة إذ كانت قدرًا،"], [2905.0, "لكن ظهرت آثارُها القبيحة إذ كانت مقدورة."]], "tr": [[2880.0, "Deriz ki: Bunun cevabı, onların kader olması ile makdûr olması arasında ayrım yapmaktır."], [2888.0, "Biz onlara kader —yani Allah Azze ve Celle'nin fiili— olmaları itibarıyla razı oluruz;"], [2893.8, "makdûr —yani kulun fiili— olmaları itibarıyla razı olmayız."], [2900.0, "Bu yüzden kader oldukları zaman çirkin eserleri ortaya çıkmadı;"], [2904.4, "fakat makdûr oldukları zaman çirkin eserleri ortaya çıktı."]]}, {"reader": false, "ar": [[2910.0, "فالكفرُ لم تظهر آثارُه إذ كان قدرًا مكتوبًا في لوح الله،"], [2914.0, "لكن لمّا كفر العبدُ ظهرت آثارُ الكفر."], [2917.0, "ولم تظهر آثارُ الزنا إذ كان مكتوبًا في اللوح المحفوظ،"], [2922.0, "لكن لمّا واقع الزنا من العبد ظهرت آثارُ الزنا."], [2926.0, "فالشرُّ في مفعولات الله لا في فعله،"], [2931.0, "وفي مقدورات الله لا في قدره،"], [2935.0, "وفي مقضيّات الله لا في قضائه."]], "tr": [[2910.0, "Küfür, Allah'ın levhinde yazılı bir kader iken eserleri ortaya çıkmadı;"], [2913.6, "fakat kul küfredince küfrün eserleri ortaya çıktı."], [2917.0, "Zina, Levh-i Mahfûz'da yazılı iken zinanın eserleri ortaya çıkmadı;"], [2921.5, "fakat zina kuldan vâki olunca zinanın eserleri ortaya çıktı."], [2926.0, "Şer, Allah'ın fiilinde değil mef'ûllerinde (yaptığı şeylerde);"], [2933.0, "kaderinde değil makdûrlarında; kazasında değil makdîlerindedir."]]}, {"reader": false, "ar": [[2939.0, "وأجد أنّ هذا الكلام لا يتناقض مع فهمكم بعد تفريقكم بين القدر والمقدور."], [2946.0, "فإذا قيل لك: هل يُنسب الشرّ إلى فعل الله؟"], [2950.0, "قل: الشرُّ في مفعولاته لا في فعله."], [2954.0, "هل يُنسب الشرّ إلى قدر الله؟"], [2956.0, "قل: الشرُّ في مقدوراته لا في قدره."], [2959.0, "هل يُنسب الشرّ إلى قضاء الله؟"], [2961.0, "قل: الشرُّ في مقضيّاته لا في قضائه."]], "tr": [[2939.0, "Görüyorum ki bu söz, kader ile makdûr arasında ayrım yapmanızdan sonra anlayışınızla çelişmiyor."], [2946.0, "Sana \"Şer Allah'ın fiiline nispet edilir mi?\" denirse de ki:"], [2950.0, "\"Şer O'nun fiilinde değil, mef'ûllerindedir.\" \"Şer Allah'ın kaderine nispet edilir mi?\" (denirse) de ki:"], [2956.0, "\"Şer O'nun kaderinde değil, makdûrlarındadır.\" \"Şer Allah'ın kazasına nispet edilir mi?\" (denirse) de ki:"], [2961.0, "\"Şer O'nun kazasında değil, makdîlerindedir.\""]]}, {"reader": false, "ar": [[2966.0, "فإذا تصوّرتم ذلك زالت إشكالاتٌ كثيرة،"], [2969.0, "وعُصمتم من اعتقاداتٍ فاسدة عجزت عنها الجبريةُ والقدرية،"], [2974.0, "وتاه فيها أكثرُ العالم."], [2976.0, "وأنا ألخّصها لكم برسمٍ بيانيٍّ بسيط لعلكم ترسمونه في دفاتركم:"], [2985.0, "وهي القضاء والقدر ينقسم إلى قسمين:"], [2990.0, "إلى قضاءٍ دينيّ، وإلى قضاءٍ كونيّ."], [2995.0, "فتأتي تحت القضاء الديني وتقول:"], [2998.5, "يجب الرضا به قدرًا ومقدورًا."]], "tr": [[2966.0, "Bunu kavradığınızda pek çok problem ortadan kalkar ve Cebriyye'nin ve Kaderiyye'nin (içinden çıkmaktan) aciz kaldığı, dünyanın çoğunun içinde yolunu kaybettiği bozuk inançlardan korunmuş olursunuz."], [2976.8, "Bunu size, belki defterlerinize çizersiniz diye basit bir şemayla özetliyorum:"], [2985.0, "Kaza ve kader iki kısma ayrılır:"], [2990.0, "dinî kaza ve kevnî kaza."], [2995.0, "Dinî kazanın altına gelip şöyle dersin:"], [2998.5, "Ona kader ve makdûr olarak razı olmak vaciptir."]]}]}, {"ts": "50:08", "title": "Özet şema ve dersin kapanışı", "paras": [{"reader": false, "ar": [[3008.0, "أرسمُها لكم: يجب الرضا به قدرًا ومقدورًا."], [3012.0, "ثم تأتي تحت القضاء الكوني وتُخرج منه ثلاثة أسهم:"], [3017.0, "الأول: القدر الملائم، يجب الرضا به قدرًا وشكرُه مقدورًا."], [3029.0, "القدر المؤلم ـ ها، من يكمّل؟"], [3031.8, "من يكمّل؟ ـ يجب الرضا به قدرًا،"], [3035.0, "ويُستحبّ الرضا به مقدورًا."], [3038.8, "الثالث: القدر الذي يُسخط الربّ،"], [3045.0, "يجب الرضا به قدرًا،"], [3049.0, "وبغضُه ومقتُه وكراهيتُه مقدورًا."], [3052.0, "والله أعلى وأعلم، وصلى الله وسلم على نبينا محمد."]], "tr": [[3008.0, "Onu size çiziyorum: Ona kader ve makdûr olarak razı olmak vaciptir."], [3012.0, "Sonra kevnî kazanın altına gelirsin ve ondan üç ok çıkarırsın:"], [3017.0, "Birincisi: Uygun gelen kader; ona kader olarak razı olmak, makdûr olarak da ona şükretmek vaciptir."], [3029.0, "Acı veren kader —hadi, kim tamamlar?"], [3031.8, "Kim tamamlar?— ona kader olarak razı olmak vacip, makdûr olarak razı olmak müstehaptır."], [3038.8, "Üçüncüsü: Rabbin öfkelendiği kader; ona kader olarak razı olmak, makdûr olarak da ona buğzetmek, ondan nefret etmek ve onu hoş görmemek vaciptir."], [3052.0, "Allah en yüce olandır ve en iyisini bilendir."], [3054.4, "Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';

  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);

    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
