<script>
const D={"no": 19, "vid": "JgFZrHgN9G8", "title_ar": "الدرس (١٩) من شرح كليات العقيدة — تابع: كليات في القضاء والقدر", "title_tr": "Şerhu Külliyyâti'l-Akîde — 19. Ders: Kaza ve Kadere Dair Külliyeler (Kaderle Alay, Allah'a Zulüm Nispeti, İsabet Eden ve Etmeyen, Kevnî Meşîetin Nispeti, Sebebe İzafe, Kadere Rıza)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Kaza ve kaderle alay içeren her söz haramdır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.1, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.3, "وعلى آله وأصحابه أفضلُ الصلاة وأزكى التسليم."], [9.0, "أمّا بعد: فلا نزال في قواعد توحيد الربوبية متمثِّلةً في قواعد القضاء والقدر،"], [15.8, "وقد أطلنا فيها، ولكن فيها خيرٌ عظيم بإذن الله عز وجل؛"], [21.6, "لأنّ هذه الكلّيّات تحلُّ إشكالاتٍ قدريّةً كثيرة،"], [25.3, "قد زلّت فيها أقدام،"], [27.4, "وضلّت فيها أفهام. فنقول مستعينين بالله عز وجل:"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.6, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun âline ve ashâbına olsun;"], [5.8, "salâtın en faziletlisi ve selâmın en temizi."], [9.0, "Bundan sonra: Hâlâ kaza ve kader kaideleri şeklinde temsil edilen rubûbiyyet tevhidi kaidelerindeyiz."], [15.3, "Bunlarda uzun durduk; fakat Allah Azze ve Celle'nin izniyle bunlarda büyük hayır vardır."], [21.6, "Çünkü bu külliyeler, pek çok ayağın kaydığı ve pek çok anlayışın saptığı birçok kader problemini çözer."], [29.0, "Allah Azze ve Celle'den yardım dileyerek diyoruz ki:"]]}, {"reader": false, "ar": [[32.0, "الكلّيّة الأولى: <b>كلُّ لفظةٍ تتضمّن السخريةَ بالقضاء والقدر فمحرّمة.<\/b> كلُّ لفظةٍ تتضمّن السخريةَ بالقضاء فمحرّمة."], [35.0, "كلُّ لفظةٍ تتضمّن السخريةَ بالقضاء والقدر فمحرّمة."]], "tr": [[32.0, "Birinci külliye: <b>1. külliye: Kaza ve kaderle alay (sehriyye) içeren her söz haramdır.<\/b> Kazayla alay içeren her söz haramdır."], [35.0, "Kaza ve kaderle alay içeren her söz haramdır."]]}, {"reader": false, "ar": [[41.0, "أقول وبالله التوفيق: وذلك لأنّ القدر فعلُ الله عز وجل،"], [60.0, "وهو سرُّ الله الذي لا يجوز أن يوصف بشيءٍ من السوء أبدًا؛"], [64.0, "فإنّ الواجب على المسلم تجاه أفعال الله عز وجل أن يحملها على أكمل التعظيم وأعظم الإجلال."], [72.0, "فأيُّ لفظةٍ تتضمّن السخريةَ بفعل الله عز وجل،"], [76.7, "أو بقضائه، أو بقدره،"], [79.0, "فلا جرمَ أنها تكون محرّمة،"], [80.9, "وقد تكون في كثيرٍ من صورها من الكفر المخرج من الملّة، والعياذ بالله."]], "tr": [[41.0, "Tevfik Allah'tandır, derim ki: Bu, kaderin Allah Azze ve Celle'nin fiili olmasındandır."], [60.3, "O, Allah'ın sırrıdır ve asla herhangi bir kötülükle nitelenmesi caiz değildir."], [64.0, "Çünkü Müslüman'a, Allah Azze ve Celle'nin fiillerine karşı düşen, onları en mükemmel tazim ve en büyük hürmet üzere anlamaktır."], [72.0, "Allah Azze ve Celle'nin fiiliyle, kazasıyla veya kaderiyle alay içeren her söz, şüphesiz haramdır;"], [81.3, "hatta birçok şeklinde, Allah korusun, dinden çıkaran küfürden olabilir."]]}, {"reader": false, "ar": [[86.0, "وقد كثرت في عبارات من يسمّون أنفسهم بأهل البلاغة والأدب كثيرٌ من هذه العبارات،"], [95.4, "وهي عندنا في ميزان العقيدة الصحيحة ـ وهي عندنا في ميزان العقيدة الصحيحة ـ محرّمة."], [103.0, "فمن ذلك قولهم: «هذا من سخرية القدر»،"], [107.8, "فهذا محرّمٌ ولا شك."], [111.0, "وكقولهم: «هذا من سذاجة القدر»."], [114.5, "وقولِ بعضهم: «هذا سوءُ تقدير»،"], [120.0, "فإذا نزل عليه شيءٌ من القضاء والقدر الذي لا يتلاءم معه وصفه بأنه من السوء."]], "tr": [[86.0, "Kendilerine belâgat ve edebiyat ehli diyenlerin ifadelerinde bu sözlerin birçoğu çoğalmıştır."], [94.2, "Bunlar, doğru akîde ölçüsünde bize göre —doğru akîde ölçüsünde bize göre— haramdır."], [103.0, "Bunlardan biri \"Bu, kaderin alayıdır (kaderin cilvesi)\" sözleridir;"], [111.0, "bu, şüphesiz haramdır. \"Bu, kaderin saflığındandır\" sözleri gibi."], [114.5, "Bazılarının \"Bu, kötü bir takdirdir\" sözü;"], [120.6, "yani başına kendisine uymayan bir kaza ve kader indiğinde onu kötülükle niteler."]]}, {"reader": false, "ar": [[131.0, "وقولِ بعضهم: «هذا من رعونة القدر»،"], [134.0, "أي: من قسوته وشدّته."], [136.0, "وقولِ بعضهم ـ وهي كلمةٌ عظيمة ـ:"], [141.0, "«هذا القدر مجنون»، أو:"], [143.9, "«هذا من جنون القدر»."], [147.0, "وكقولهم: «والقدرُ يستهزئ بنا»."], [150.0, "وكقولهم: «هذا من تلاعب قدر الله بنا»."], [155.0, "وكقولهم: «هذا مما عبثت فيه يدُ القدر»."], [162.0, "وكقولهم: «هذا من قبح التقدير»."]], "tr": [[131.0, "Bazılarının \"Bu, kaderin hoyratlığındandır\" sözü;"], [133.5, "yani onun katılığından ve şiddetinden."], [136.0, "Bazılarının —ki bu çok ağır bir sözdür— \"Bu kader delidir\" ya da \"Bu, kaderin deliliğindendir\" sözü."], [147.0, "\"Kader bizimle istihza ediyor\" sözleri gibi."], [150.0, "\"Bu, Allah'ın kaderinin bizimle oynamasındandır\" sözleri gibi."], [155.0, "\"Bu, kaderin elinin oynadığı şeylerdendir\" sözleri gibi."], [162.0, "\"Bu, takdirin çirkinliğindendir\" sözleri gibi."]]}, {"reader": false, "ar": [[170.0, "ونحوِ هذه العبارات التي تتضمّن نسبةَ السخرية،"], [174.8, "أو الاستهزاء، أو التلاعب لقضاء الله عز وجل وقدره."], [184.0, "بل إنه إن قصد بها عينَ فعل الله عز وجل فإنه يكفر كفرًا أكبر يُخرجه من ملّة الإسلام بالكلّيّة."], [196.0, "فالواجب الحذرُ والتحذيرُ من ذلك."]], "tr": [[170.0, "Ve Allah Azze ve Celle'nin kazasına ve kaderine alay, istihza veya oyun nispet etmeyi içeren benzeri ifadeler."], [184.5, "Hatta bunlarla bizzat Allah Azze ve Celle'nin fiilini kastederse, onu İslâm milletinden tamamen çıkaran büyük küfürle kâfir olur."], [196.0, "Bundan sakınmak ve sakındırmak gerekir."]]}]}, {"ts": "03:19", "title": "2. Külliye: Kaderlerinden herhangi birinde Allah'ı zulümle niteleyen kâfirdir", "paras": [{"reader": false, "ar": [[199.0, "ومن الكلّيّات أيضًا: <b>كلُّ من وصف اللهَ بالظلم في شيءٍ من أقداره فكافر.<\/b> كلُّ من وصف اللهَ عز وجل بالظلم في شيءٍ من أقداره فكافر."], [216.0, "كلُّ من وصف اللهَ عز وجل بشيءٍ من الظلم في شيءٍ من أقداره فهو كافر."]], "tr": [[199.0, "Külliyelerden biri de şudur: 2."], [204.0, "külliye: Kaderlerinden herhangi birinde Allah'ı zulümle niteleyen herkes kâfirdir. Kaderlerinden herhangi birinde Allah Azze ve Celle'yi zulümle niteleyen herkes kâfirdir."], [216.0, "Kaderlerinden herhangi birinde Allah Azze ve Celle'yi herhangi bir zulümle niteleyen herkes kâfirdir."]]}, {"reader": false, "ar": [[230.0, "وذلك لأنه وصف اللهَ عز وجل بما تواترت الأدلةُ على تنزيه الله عز وجل عنه؛"], [237.0, "فقد قال الله عز وجل:"], [239.8, "<span class=\"ayah\">﴿وَلَا يَظْلِمُ رَبُّكَ أَحَدًا﴾<\/span> <span class=\"ref\">[الكهف: ٤٩]<\/span>،"], [242.0, "وقال الله عز وجل:"], [244.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ لَا يَظْلِمُ مِثْقَالَ ذَرَّةٍ﴾<\/span> <span class=\"ref\">[النساء: ٤٠]<\/span>،"], [247.0, "وقال الله عز وجل:"], [249.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ لَا يَظْلِمُ النَّاسَ شَيْئًا﴾<\/span> <span class=\"ref\">[يونس: ٤٤]<\/span>،"], [252.0, "وقال الله عز وجل:"], [254.5, "<span class=\"ayah\">﴿وَمَا رَبُّكَ بِظَلَّامٍ لِّلْعَبِيدِ﴾<\/span> <span class=\"ref\">[فصلت: ٤٦]<\/span>."]], "tr": [[230.0, "Çünkü o, Allah Azze ve Celle'yi, delillerin Allah Azze ve Celle'yi ondan tenzih etmekte tevâtür derecesine ulaştığı bir şeyle nitelemiştir."], [237.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [239.8, "<span class=\"ayah\">﴿Rabbin hiç kimseye zulmetmez﴾<\/span> [Kehf 49]."], [242.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [244.0, "<span class=\"ayah\">﴿Şüphesiz Allah zerre ağırlığınca zulmetmez﴾<\/span> [Nisâ 40]."], [246.5, "Allah Azze ve Celle şöyle buyurmuştur:"], [249.0, "<span class=\"ayah\">﴿Şüphesiz Allah insanlara hiçbir şekilde zulmetmez﴾<\/span> [Yûnus 44]."], [251.5, "Allah Azze ve Celle şöyle buyurmuştur:"], [254.5, "<span class=\"ayah\">﴿Rabbin kullara asla zulmedici değildir﴾<\/span> [Fussılet 46]."]]}, {"reader": false, "ar": [[257.0, "وفي الحديث القدسي يقول النبي صلى الله عليه وسلم فيما يرويه عن ربه عز وجل:"], [264.0, "«يا عبادي، إني حرّمتُ الظلمَ على نفسي، وجعلتُه بينكم محرّمًا، فلا تظالموا» <span class=\"note\">(Müslim)<\/span>."], [272.0, "ونسبةُ الله عز وجل في شيءٍ من أقداره للظلم داخلةٌ في سبّ الله عز وجل،"], [279.0, "والتسخّطِ عليه وعلى حكمته وعدله؛"], [283.0, "فهو من سبّ الله تعالى وانتقاصِه،"], [286.3, "والطعنِ في حكمته وعدله سبحانه،"], [289.2, "والطعنِ في قضائه وقدره."]], "tr": [[257.0, "Kudsî hadiste Nebî ﷺ Rabbi Azze ve Celle'den rivayet ettiği şeyde şöyle buyurur:"], [262.6, "«Ey kullarım! Ben zulmü kendime haram kıldım ve onu aranızda da haram kıldım; birbirinize zulmetmeyin.» <span class=\"note\">(Müslim)<\/span>."], [272.0, "Kaderlerinden herhangi birinde Allah Azze ve Celle'yi zulme nispet etmek, Allah Azze ve Celle'ye sövmeye, O'na, hikmetine ve adaletine öfkelenmeye (tesahhut) girer."], [283.0, "Bu, Allah Teâlâ'ya sövmek, O'nu eksiklikle nitelemek, Sübhânehû'nun hikmetine ve adaletine dil uzatmak, kazasına ve kaderine dil uzatmaktır."]]}, {"reader": false, "ar": [[292.1, "وذلك لأنّ القضاء والقدر مبنيٌّ على العدل والفضل؛"], [297.0, "فإذا طعن الإنسانُ في شيءٍ من هذا فإنه يطعن في حكمة الله عز وجل، وعدله، ورحمته، وعلمه."]], "tr": [[292.1, "Çünkü kaza ve kader adalet ve fazl (lütuf) üzerine kuruludur."], [297.0, "İnsan bunlardan herhangi birine dil uzatırsa, Allah Azze ve Celle'nin hikmetine, adaletine, rahmetine ve ilmine dil uzatmış olur."]]}]}, {"ts": "05:05", "title": "2. Külliye (devam): Zulmün tanımı; dünyada imtihan kaçınılmazdır", "paras": [{"reader": false, "ar": [[305.3, "ومما ينبغي أن يُعلم أنّ الظلم هو وضعُ الشيء في غير موضعه،"], [312.2, "وكلُّ العباد مِلكٌ لله عز وجل،"], [315.0, "والله له الأحقّيّةُ المطلقة أن يتصرّف في ملكوته وفي عبيده بما يشاء،"], [322.0, "على حسب علمه وخبرته في عباده."], [326.0, "فليس لأحدٍ أن يعترض على الله عز وجل فيما يصيبه من المصائب،"], [332.0, "أو ينزل عليه من الآلام؛"], [334.0, "لأنّ الله عز وجل إنما خلقنا في أرضه ليبلونا بالخير والشر،"], [341.0, "كما قال الله عز وجل:"], [343.0, "<span class=\"ayah\">﴿وَلَنَبْلُوَنَّكُمْ حَتَّىٰ نَعْلَمَ الْمُجَاهِدِينَ مِنكُمْ وَالصَّابِرِينَ وَنَبْلُوَ أَخْبَارَكُمْ﴾<\/span> <span class=\"ref\">[محمد: ٣١]<\/span>."], [349.0, "فلا يجوز أن يُنسب اللهُ عز وجل في شيءٍ من أقداره إلى أنه ظالم."]], "tr": [[305.3, "Bilinmesi gereken şeylerden biri de şudur:"], [311.5, "Zulüm, bir şeyi yerinin dışına koymaktır."], [317.3, "Bütün kullar Allah Azze ve Celle'nin mülküdür."], [326.0, "Allah'ın, melekûtunda ve kullarında, kullarına dair ilmine ve habîrliğine göre dilediği gibi tasarruf etmeye mutlak hakkı vardır."], [330.0, "Kimsenin, kendisine isabet eden musibetler veya başına inen acılar konusunda Allah Azze ve Celle'ye itiraz etmeye hakkı yoktur."], [334.0, "Çünkü Allah Azze ve Celle bizi yeryüzünde ancak bizi hayır ve şerle imtihan etmek için yaratmıştır."], [341.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [343.0, "<span class=\"ayah\">﴿Andolsun, içinizden cihad edenleri ve sabredenleri belirleyinceye ve haberlerinizi ortaya koyuncaya kadar sizi imtihan edeceğiz﴾<\/span> [Muhammed 31]."], [350.7, "Kaderlerinden herhangi birinde Allah Azze ve Celle'nin zalim olduğu nispet edilmesi caiz değildir."]]}, {"reader": false, "ar": [[355.0, "يقول الله عز وجل:"], [358.0, "<span class=\"ayah\">﴿وَلَنَبْلُوَنَّكُم بِشَيْءٍ مِّنَ الْخَوْفِ وَالْجُوعِ وَنَقْصٍ مِّنَ الْأَمْوَالِ وَالْأَنفُسِ وَالثَّمَرَاتِ ۗ وَبَشِّرِ الصَّابِرِينَ﴾<\/span> <span class=\"ref\">[البقرة: ١٥٥]<\/span>،"], [368.0, "ويقول الله عز وجل:"], [369.0, "<span class=\"ayah\">﴿وَنَبْلُوكُم بِالشَّرِّ وَالْخَيْرِ فِتْنَةً﴾<\/span> <span class=\"ref\">[الأنبياء: ٣٥]<\/span>،"], [372.0, "ويقول الله عز وجل:"], [374.0, "<span class=\"ayah\">﴿أَحَسِبَ النَّاسُ أَن يُتْرَكُوا أَن يَقُولُوا آمَنَّا وَهُمْ لَا يُفْتَنُونَ﴾<\/span> <span class=\"ref\">[العنكبوت: ٢]<\/span>."], [379.0, "فإذًا لا بد في هذه الدنيا من البلاء والابتلاء بما يوافق أو ينافر."], [386.0, "فإذا ابتلاك الله عز وجل بشيءٍ مما لا تريده،"], [391.0, "فإيّاك أن تصف ربك بشيءٍ مما يطعن في قضائه وقدره؛"], [395.0, "لأنّ ذلك يُخرجك عن دائرة الإسلام إلى دائرة الكفر، والعياذ بالله."]], "tr": [[355.0, "Allah Azze ve Celle şöyle buyurur:"], [358.0, "<span class=\"ayah\">﴿Andolsun, sizi biraz korku, açlık, mallardan, canlardan ve ürünlerden biraz eksiltme ile imtihan edeceğiz. Sabredenleri müjdele﴾<\/span> [Bakara 155]."], [368.0, "Allah Azze ve Celle şöyle buyurur:"], [369.0, "<span class=\"ayah\">﴿Sizi bir imtihan olarak şerle de hayırla da deneriz﴾<\/span> [Enbiyâ 35]."], [374.0, "Allah Azze ve Celle şöyle buyurur:"], [375.5, "<span class=\"ayah\">﴿İnsanlar, \"İman ettik\" demeleriyle, imtihan edilmeden bırakılacaklarını mı sandılar?﴾<\/span> [Ankebût 2]."], [379.0, "Demek ki bu dünyada, (insana) uygun gelen ya da ters düşen şeylerle bela ve imtihan kaçınılmazdır."], [386.0, "Allah Azze ve Celle seni istemediğin bir şeyle imtihan ederse, sakın Rabbini kazasına ve kaderine dil uzatan bir şeyle niteleme."], [395.0, "Çünkü bu, Allah korusun, seni İslâm dairesinden küfür dairesine çıkarır."]]}]}, {"ts": "06:41", "title": "3. ve 4. Külliye: Sana isabet etmeyen sana isabet edecek değildi; sana isabet eden seni ıskalayacak değildi", "paras": [{"reader": false, "ar": [[401.0, "ومن الكلّيّات أيضًا: كلُّ ما أخطأك لم يكن ليُصيبك،"], [408.0, "وكلُّ ما أصابك لم يكن ليُخطئك. «كلُّ ما أخطأك» ـ والهمزة على الألف ـ «لم يكن ليصيبك»،"], [421.0, "«وكلُّ ما أصابك لم يكن ليُخطئك» ـ والهمزة على نبرة ـ."], [429.0, "كلُّ ما أخطأك لم يكن ليصيبك،"], [436.0, "وكلُّ ما أصابك لم يكن ليخطئك."], [439.0, "وهما كلّيّتان عليهما يدور بابُ القضاء والقدر."]], "tr": [[401.0, "Külliyelerden biri de şudur: 3."], [404.0, "külliye: Seni ıskalayan (sana isabet etmeyen) her şey sana isabet edecek değildi; 4. külliye: sana isabet eden her şey de seni ıskalayacak değildi. \"Seni ıskalayan her şey\" —hemze elif üzerinde (أخطأك)— \"sana isabet edecek değildi\"; \"sana isabet eden her şey de seni ıskalayacak değildi\" —hemze nebre (dişli harf) üzerinde (ليخطئك)—. Seni ıskalayan her şey sana isabet edecek değildi; sana isabet eden her şey de seni ıskalayacak değildi. Bunlar, kaza ve kader babının etrafında döndüğü iki külliyedir."]]}, {"reader": false, "ar": [[443.0, "وأصلُ هذه الكلّيّة حديثُ أبي الدرداء رضي الله عنه قال:"], [448.4, "قال النبي صلى الله عليه وسلم:"], [451.0, "«إنّ العبد لا يبلغ حقيقةَ الإيمان حتى يعلم أنّ ما أصابه لم يكن ليخطئه، وأنّ ما أخطأه لم يكن ليصيبه»."]], "tr": [[443.0, "Bu külliyenin aslı, Ebu'd-Derdâ'nın —Allah ondan razı olsun— hadisidir."], [448.4, "Dedi ki: Nebî ﷺ şöyle buyurdu:"], [451.0, "«Kul, kendisine isabet edenin onu ıskalayacak olmadığını ve kendisini ıskalayanın ona isabet edecek olmadığını bilmedikçe imanın hakikatine ulaşamaz.»"]]}, {"reader": false, "ar": [[462.0, "وفي «جامع الإمام الترمذي» بإسنادٍ صحيح من حديث ابن الديلمي رحمه الله تعالى قال:"], [469.4, "«وقع في قلبي شيءٌ من القدر، فخفتُ أن يُفسد عليّ ديني، فأتيتُ أُبيَّ بنَ كعب فسألته، فقال: لو أنّ الله عذّب أهلَ السماوات والأرض لعذّبهم وهو غيرُ ظالمٍ لهم، ولو رحمهم كانت رحمتُه خيرًا لهم، ولو كان لك مثلُ أُحُدٍ ذهبًا فأنفقتَه ما قبله الله منك حتى تؤمن بالقدر، وتعلم أنّ ما أصابك لم يكن ليخطئك، وما أخطأك لم يكن ليصيبك، ولو متَّ على غير هذا لكنتَ من أهل النار."]], "tr": [[462.0, "İmam Tirmizî'nin \"Câmi\"inde sahih bir isnadla İbnü'd-Deylemî'nin —Allah Teâlâ ona rahmet etsin— hadisinden (şöyle rivayet edilir):"], [469.4, "\"Kalbime kader hakkında bir şey düştü;"], [471.6, "dinimi bozmasından korktum. Übey b."], [473.8, "Ka'b'a gelip ona sordum. Şöyle dedi:"], [477.0, "Allah göklerin ve yerin ehline azap etseydi, onlara zalim olmaksızın azap ederdi."], [483.8, "Onlara merhamet etseydi, rahmeti onlar için (amellerinden) daha hayırlı olurdu."], [490.3, "Uhud dağı kadar altının olsa da onu infak etsen, kadere iman edip sana isabet edenin seni ıskalayacak olmadığını ve seni ıskalayanın sana isabet edecek olmadığını bilmedikçe Allah onu senden kabul etmez."], [505.3, "Bundan başka bir inanç üzere ölürsen cehennem ehlinden olursun."]]}, {"reader": false, "ar": [[508.0, "قال: ثم أتيتُ عبدَ الله بنَ مسعود فحدّثني مثلَ ذلك،"], [512.0, "ثم أتيتُ حذيفةَ بنَ اليمان فحدّثني مثلَ ذلك،"], [515.0, "ثم أتيتُ زيدَ بنَ ثابت فحدّثني عن رسول الله صلى الله عليه وسلم مثلَ ذلك»."], [523.0, "فجميعُ ما يصيبك من الخير أو الشر اعلم أنه مقدَّرٌ ومكتوبٌ لك،"], [529.2, "ليس مكتوبًا لغيرك ثم انتقل إليك."], [533.0, "وما قُدِّر على غيرك من الخير والشر فاعلم أنه لن يأتيك شيءٌ منه،"], [540.2, "ولا يمكن أن ينتقل من غيرك لك."]], "tr": [[508.0, "Dedi ki: Sonra Abdullah b."], [511.1, "Mes'ûd'a geldim, bana onun benzerini anlattı."], [515.0, "Sonra Huzeyfe b. el-Yemân'a geldim, bana onun benzerini anlattı."], [523.0, "Sonra Zeyd b. Sâbit'e geldim, bana Resûlullah ﷺ'den onun benzerini anlattı.\" Sana isabet eden hayır ya da şer her şeyin senin için takdir edilmiş ve yazılmış olduğunu bil;"], [533.0, "başkası için yazılıp sonra sana geçmiş değildir."], [535.9, "Başkası için takdir edilen hayır ve şerden de hiçbir şeyin sana gelmeyeceğini ve başkasından sana geçmesinin mümkün olmadığını bil."]]}, {"reader": false, "ar": [[544.0, "فلا ينبغي للإنسان أن يطالع القضاءَ والقدر الذي ينزل عليه أو على غيره،"], [550.0, "وإنما عليه أن يطالع الواجبَ عليه في هذا القضاء والقدر."], [554.0, "فإذا نزل شيءٌ من الآلام على غيرك فاجعل نزولَه عبرةً وعظةً لك في اتّقاء أسبابه حتى لا تُصاب بما أُصيب."], [564.0, "وإذا منّ الله عز وجل عليك أو على غيرك بشيءٍ من الخير فعليك حمدُ الله عز وجل وشكرُه."]], "tr": [[544.0, "İnsanın, kendisine veya başkasına inen kaza ve kadere (kendisine) bakması uygun değildir;"], [549.5, "ona düşen, bu kaza ve kaderde kendisine vacip olana bakmaktır."], [554.0, "Başkasına bir acı inerse, onun inişini, onun başına geleni başına gelmesin diye onun sebeplerinden sakınman konusunda kendin için bir ibret ve öğüt kıl."], [564.0, "Allah Azze ve Celle sana veya başkasına bir hayır lütfederse, sana düşen Allah Azze ve Celle'ye hamd ve şükretmektir."]]}, {"reader": false, "ar": [[572.0, "فلا ينبغي للإنسان أن يوقع نفسه فيما هو حرامٌ شرعًا في مثل ذلك؛"], [578.0, "فإنّ الحسود لا يؤمن بهذه الكلّيّة أبدًا،"], [583.0, "فإنّ جميع النعم التي تنزل على غيره إنما يتمنّاها له ولا يتمنّاها لغيره."], [589.0, "وكذلك المتسخّط على قضاء الله وقدره لا يؤمن بهذه الكلّيّة؛"], [595.0, "لأنه لا يعامل قضاءَ الله وقدرَه المؤلمَ إذا نزل عليه إلا بالتسخّط والتضجّر."]], "tr": [[572.0, "İnsanın bu gibi durumlarda kendini şer'an haram olan şeye düşürmesi uygun değildir."], [578.0, "Çünkü hasetçi bu külliyeye asla iman etmez;"], [583.5, "başkasına inen bütün nimetleri kendisi için ister, başkası için istemez."], [589.0, "Aynı şekilde Allah'ın kaza ve kaderine öfkelenen (mütesahhit) de bu külliyeye iman etmez;"], [595.0, "çünkü Allah'ın acı veren kaza ve kaderi başına indiğinde ona ancak öfke ve hoşnutsuzlukla muamele eder."]]}]}, {"ts": "10:04", "title": "3. ve 4. Külliye (sonu) · 5. Külliye: Kevnî meşîet ancak Allah'a nispet edilir, fiiline ve sıfatına değil", "paras": [{"reader": false, "ar": [[604.0, "فالأمراضُ والآلامُ والمصائبُ والخساراتُ وغيرُها،"], [610.0, "وكذلك النعمُ والصحةُ والغنائمُ والأموالُ وغيرُها،"], [617.0, "كلُّ ذلك مما كتبه الله عز وجل وقضاه وقدّره؛"], [620.0, "فما كان لغيرك فليس لك،"], [622.7, "وما كان لك فلن يأخذه غيرك."], [626.0, "«فاتّقِ الله وأجمِلْ في الطلب»."], [628.0, "وعلى ذلك قولُ النبي صلى الله عليه وسلم لابن عباس:"], [632.1, "«واعلم أنّ الأمة لو اجتمعت على أن ينفعوك بشيءٍ لم ينفعوك إلا بشيءٍ كتبه الله لك، ولو اجتمعت على أن يضرّوك بشيءٍ لم يضرّوك إلا بشيءٍ كتبه الله عليك». والله أعلم."]], "tr": [[604.0, "Hastalıklar, acılar, musibetler, kayıplar ve benzerleri;"], [607.2, "aynı şekilde nimetler, sağlık, ganimetler, mallar ve benzerleri;"], [613.8, "bunların hepsi Allah Azze ve Celle'nin yazdığı, hükmettiği ve takdir ettiği şeylerdendir."], [620.0, "Başkasının olan senin değildir; senin olanı da başkası asla alamaz."], [626.0, "«Allah'tan kork ve (rızık) talebinde ölçülü ol.» Nebî ﷺ'in İbn Abbâs'a şu sözü de bu türdendir:"], [632.1, "«Bil ki ümmet sana bir şeyle fayda vermek için bir araya gelse, sana ancak Allah'ın senin için yazdığı bir şeyle fayda verebilir. Sana bir şeyle zarar vermek için bir araya gelse, sana ancak Allah'ın senin aleyhine yazdığı bir şeyle zarar verebilir.» Allah en iyisini bilir."]]}, {"reader": false, "ar": [[652.0, "ومن الكلّيّات أيضًا: كلُّ ما كان من المشيئة الكونية فلا يُنسب إلا إلى الله،"], [658.0, "لا إلى أفعاله وصفاته. كلُّ ما كان من المشيئة الكونية فلا يُنسب إلا إلى الله،"], [668.0, "لا إلى فعله وصفته."], [670.0, "كلُّ ما كان من المشيئة الكونية فلا يُنسب إلا إلى الله،"], [678.0, "لا إلى فعله ومشيئته."]], "tr": [[652.0, "Külliyelerden biri de şudur: 5."], [654.0, "külliye: Kevnî meşîetten olan her şey ancak Allah'a nispet edilir;"], [659.5, "fiillerine ve sıfatlarına değil. Kevnî meşîetten olan her şey ancak Allah'a nispet edilir;"], [670.0, "fiiline ve sıfatına değil. Kevnî meşîetten olan her şey ancak Allah'a nispet edilir; fiiline ve meşîetine değil."]]}, {"reader": false, "ar": [[681.0, "وذلك لأنّ المشيئة إنما تُنسب إلى من شاءها حقيقةً،"], [688.0, "وكذلك القدر إنما يُنسب إلى من قدّره حقيقةً،"], [695.0, "والذي شاء وقدّر إنما هو الله تبارك وتعالى."], [700.0, "فما كان من قبيل المشيئة الكونية فإيّاك أن تنسبها إلى شيءٍ من أقدار الله ـ لأنّ القدر فعلُه ـ،"], [707.5, "أو تنسبها إلى شيءٍ من صفات الله عز وجل؛"], [712.0, "لأنّ الصفة لا تملك شيئًا،"], [714.8, "وإنما الذي يملك المشيئة <span class=\"q\">؟ 11:52<\/span> هو من يتّصف بهذه الأفعال،"], [719.8, "ومن يتّصف بهذه الصفات."]], "tr": [[681.0, "Çünkü meşîet, ancak onu gerçekten dileyene nispet edilir;"], [686.0, "kader de ancak onu gerçekten takdir edene nispet edilir."], [692.4, "Dileyen ve takdir eden ise ancak Allah Tebâreke ve Teâlâ'dır."], [700.0, "Kevnî meşîet kabilinden olan şeyi sakın Allah'ın kaderlerinden birine —çünkü kader O'nun fiilidir— ya da Allah Azze ve Celle'nin sıfatlarından birine nispet etme."], [712.0, "Çünkü sıfat hiçbir şeye mâlik değildir;"], [715.3, "meşîete <span class=\"q\">؟<\/span> mâlik olan, bu fiillerle nitelenen ve bu sıfatlarla nitelenendir."]]}, {"reader": false, "ar": [[722.0, "فلا ينبغي أن يُنسب شيءٌ من المشيئة القدرية لا إلى صفة الله ولا إلى فعله."], [729.0, "وبناءً على ذلك فلا يجوز للإنسان أن يقول:"], [733.8, "«شاءت الأقدار»، فينسب المشيئةَ الكونية إلى القدر ـ لأنّ القدر فعلُه ـ،"], [739.0, "وإنما يقال: شاء الله في قضائه وقدره."], [744.0, "ولا يجوز أن نقول:"], [747.0, "«شاءت يدُ القدر»، «شاءت يدُ القدرة الإلهية»؛"], [756.0, "لأنّ القدرة صفةٌ من صفات الله عز وجل،"], [760.0, "والمشيئة الكونية لا يجوز نسبتُها إلى الفعل ولا إلى الصفة."]], "tr": [[722.0, "Kaderî meşîetten hiçbir şey ne Allah'ın sıfatına ne de fiiline nispet edilmemelidir."], [729.0, "Buna binaen insanın \"Kaderler diledi\" demesi caiz değildir;"], [733.8, "(bununla) kevnî meşîeti kadere nispet etmiş olur, oysa kader O'nun fiilidir."], [740.4, "Bilakis \"Allah, kaza ve kaderinde diledi\" denir."], [744.0, "\"Kaderin eli diledi\", \"İlâhî kudretin eli diledi\" dememiz de caiz değildir."], [756.0, "Çünkü kudret Allah Azze ve Celle'nin sıfatlarından bir sıfattır;"], [760.0, "kevnî meşîeti ise ne fiile ne de sıfata nispet etmek caizdir."]]}, {"reader": false, "ar": [[765.0, "وكذلك قولُهم: «شاءت الظروف»؛"], [768.0, "فإنّ الظروف محلٌّ لقضاء الله عز وجل وقدره،"], [773.0, "وليس لها مشيئةٌ ولا اختيار،"], [775.0, "وإنما خالقُ الظرف هو الذي يشاء سبحانه وتعالى."], [783.0, "وكذلك لا يجوز أن نقول:"], [784.9, "«شاءت حكمةُ الله»، فننسب المشيئةَ الكونية إلى صفة الحكمة؛"], [790.0, "فإنّ الحكمة لا تشاء،"], [792.0, "وإنما الحكيمُ هو الذي يشاء."]], "tr": [[765.0, "Aynı şekilde \"Şartlar diledi\" sözleri de (caiz değildir)."], [768.0, "Çünkü şartlar (zarflar), Allah Azze ve Celle'nin kaza ve kaderinin mahallidir;"], [773.4, "onların ne meşîeti ne de ihtiyarı vardır."], [776.5, "Dileyen, ancak şartların yaratıcısıdır; Sübhânehû ve Teâlâ."], [783.0, "Aynı şekilde \"Allah'ın hikmeti diledi\" deyip kevnî meşîeti hikmet sıfatına nispet etmemiz de caiz değildir."], [790.0, "Çünkü hikmet dilemez; dileyen ancak Hakîm olandır."]]}, {"reader": false, "ar": [[794.0, "وكذلك قولُ بعضهم: «شاءت إرادةُ الله»،"], [801.0, "فينسب المشيئةَ الكونية إلى الإرادة،"], [804.0, "والإرادةُ صفة، والصفةُ معنى،"], [806.0, "والمعنى لا مشيئةَ له،"], [808.0, "وإنما الذي شاء هو المريدُ حقيقةً لا إرادتُه."], [812.0, "فكلُّ ذلك مما يُطلق على خلاف العقيدة الصحيحة."], [821.0, "فكلُّ ما كان من قبيل المشيئة الكونية فلا يجوز أن ننسبه إلا إلى الله عز وجل."]], "tr": [[794.0, "Aynı şekilde bazılarının \"Allah'ın iradesi diledi\" sözü de böyledir;"], [796.3, "kevnî meşîeti iradeye nispet eder."], [802.2, "Oysa irade bir sıfattır, sıfat bir mânâdır, mânânın ise meşîeti yoktur."], [808.0, "Dileyen, iradesi değil, gerçekte irade edendir (Mürîd)."], [812.0, "Bütün bunlar, doğru akîdeye aykırı olarak kullanılan sözlerdendir."], [821.0, "Kevnî meşîet kabilinden olan her şeyi ancak Allah Azze ve Celle'ye nispet etmemiz caizdir."]]}, {"reader": false, "ar": [[829.0, "وأيضًا نعلم خطأَ قول من يقول:"], [833.1, "«حكمُ القضاء» أو «حكمُ القدر»؛"], [838.0, "فإنّ الذي يحكم إنما هو من يقضي ومن يقدّر."], [844.0, "ونعرف خطأَ قول بعضهم:"], [846.8, "«هذا ما فعلته بنا الأيام»،"], [851.0, "فينسب الفعلَ إلى الأيام،"], [853.3, "والأيامُ ظروفٌ للحوادث، وليس للظرف لا قدرةٌ ولا إرادةٌ ولا مشيئة،"], [859.0, "وإنما شاء خالقُ الأيام هذا الشيء."], [863.0, "فالأيام ليست تفعل، إنما الذي يفعل على الحقيقة هو الله عز وجل."]], "tr": [[829.0, "Ayrıca \"Kazanın hükmü\" veya \"Kaderin hükmü\" diyenin sözünün hatalı olduğunu da biliriz."], [838.0, "Çünkü hükmeden, ancak kaza eden ve takdir edendir."], [841.3, "Bazılarının \"Bu, günlerin bize yaptığıdır\" sözünün hatalı olduğunu da biliriz;"], [846.8, "fiili günlere nispet eder. Oysa günler, olayların zarflarıdır (zaman kaplarıdır);"], [853.9, "zarfın ne kudreti, ne iradesi, ne de meşîeti vardır."], [859.0, "Bu şeyi dileyen, günlerin yaratıcısıdır."], [863.0, "Günler (bir şey) yapmaz; gerçekte yapan ancak Allah Azze ve Celle'dir."]]}, {"reader": false, "ar": [[870.0, "فإن قلتَ: وما حكمُ قولي:"], [872.0, "«اقتضت إرادةُ الله»، «اقتضت حكمةُ الله»؟"], [876.0, "فنقول: المقتضى جاء... هذا في المقتضي أو المقتضى <span class=\"q\">؟ 14:36<\/span>،"], [881.0, "وهذا لا بأس به ولا حرج؛"], [883.0, "لأنّ المقتضى ليس مشيئةً كونية،"], [885.6, "وإنما (معناه): من لوازم هذا الشيء كذا وكذا؛"], [890.0, "فمن لوازم حكمة الله هذا الفعل،"], [894.0, "من لوازم إرادة الله هذا الفعل،"], [897.0, "من لوازم علم الله هذا الفعل."], [899.0, "فـ«اقتضت» أي: نُثبت شيئًا من اللوازم."]], "tr": [[870.0, "\"Allah'ın iradesi iktiza etti (gerektirdi)\", \"Allah'ın hikmeti iktiza etti\" sözümün hükmü nedir?\" dersen, deriz ki:"], [878.0, "Muktezâ (gerektirilen) geldi... Bu, muktezî (gerektiren) veya muktezâ (gerektirilen) hakkındadır <span class=\"q\">؟<\/span>."], [883.0, "Bunda bir sakınca ve beis yoktur."], [886.2, "Çünkü muktezâ kevnî meşîet değildir;"], [890.0, "(anlamı) \"Bu şeyin lâzımlarındandır ki şöyle şöyle\" demektir:"], [895.0, "Bu fiil Allah'ın hikmetinin lâzımlarındandır;"], [897.3, "bu fiil Allah'ın iradesinin lâzımlarındandır;"], [899.0, "bu fiil Allah'ın ilminin lâzımlarındandır."], [900.5, "\"İktiza etti\" demek, lâzımlardan bir şeyi isbat ederiz demektir."]]}, {"reader": false, "ar": [[904.0, "فإذا كان ذلك اللازمُ مما يُقرّه الشرع ويُثبته الدليل،"], [909.0, "فإنه لا بأس أن نقول:"], [911.5, "«اقتضت حكمةُ الله»، «اقتضت إرادةُ الله»،"], [915.0, "«اقتضى علمُ الله»؛ لأنّ الاقتضاء ليس مشيئةً كونية،"], [921.0, "وإنما الكلّيّة تتكلّم على ما كان من قبيل المشيئة الكونية."], [926.7, "فلا بد من التفريق بين الأمرين،"], [929.1, "والله أعلم. واضحٌ كلامي؟"]], "tr": [[904.0, "O lâzım, şeriatın onayladığı ve delilin isbat ettiği bir şey ise \"Allah'ın hikmeti iktiza etti\", \"Allah'ın iradesi iktiza etti\", \"Allah'ın ilmi iktiza etti\" dememizde bir sakınca yoktur."], [917.0, "Çünkü iktiza kevnî meşîet değildir;"], [921.0, "külliye ise kevnî meşîet kabilinden olan şeyden bahsetmektedir."], [926.7, "İki şey arasında ayrım yapmak gerekir."], [928.3, "Allah en iyisini bilir. Sözüm açık mı?"]]}]}, {"ts": "15:33", "title": "6. Külliye: Bir olayı şer'an ve kaderen sahih olan sebebine izafe eden için beis yoktur", "paras": [{"reader": false, "ar": [[933.0, "ومن الكلّيّات أيضًا: <b>كلُّ من أضاف حدثًا لسببيّته الصحيحة شرعًا وقدرًا فجائز.<\/b> كلُّ من أضاف حدثًا لسببيّته الصحيحة شرعًا وقدرًا فجائز."], [953.0, "كلُّ من أضاف حدثًا لسببيّته الصحيحة شرعًا وقدرًا فلا بأس عليه، أو نقول: فجائز."]], "tr": [[933.0, "Külliyelerden biri de şudur: 6."], [935.0, "külliye: Bir olayı şer'an ve kaderen sahih olan sebebine izafe eden herkes (için bu) caizdir. Bir olayı şer'an ve kaderen sahih olan sebebine izafe eden herkes (için bu) caizdir."], [953.7, "Bir olayı şer'an ve kaderen sahih olan sebebine izafe eden herkes için bir beis yoktur; ya da \"caizdir\" deriz."]]}, {"reader": false, "ar": [[964.0, "وهذه الكلّيّة مهمّةٌ جدًّا؛"], [966.7, "لأنّ الخلل فيها قد يُخرج الإنسان من التوحيد،"], [979.0, "أو يوقعه في الشرك الأصغر،"], [981.0, "ولذلك لا بد أن نفهمها فهمًا صحيحًا."], [990.0, "فأقول وبالله التوفيق: اعلم أنّ إضافة الشيء إلى سببه لا تخلو من ثلاثة أقسام ـ أنّ إضافة الشيء إلى سببه لا تخلو من ثلاثة أقسام ـ:"]], "tr": [[964.0, "Bu külliye çok önemlidir; çünkü bundaki bir bozukluk insanı tevhidden çıkarabilir veya onu küçük şirke düşürebilir."], [980.6, "Bu yüzden onu doğru şekilde anlamamız gerekir."], [990.0, "Tevfik Allah'tandır, derim ki: Bil ki bir şeyi sebebine izafe etmek üç kısımdan hâli değildir —bir şeyi sebebine izafe etmek üç kısımdan hâli değildir—:"]]}, {"reader": false, "ar": [[1004.0, "الأول: أن يُضاف إلى السبب الخفيّ الذي لا تأثيرَ له على وجه الحقيقة؛"], [1013.0, "أي: يُضاف إلى السبب الخفيّ الذي لا تأثيرَ له أصلًا على وجه الحقيقة،"], [1021.0, "وإنما السببية جاءت من اختراع من أضافها فقط،"], [1026.0, "وإلا فليس لها تأثيرٌ حقيقةً لا شرعًا ولا قدرًا."], [1033.0, "فهذه الإضافة من الشرك الأكبر المخرج عن الملّة بالكلّيّة،"], [1037.0, "كأن يقول: «لولا الوليُّ الفلاني ما نجونا من كربة كذا»،"], [1048.0, "أو «ما حصلت لنا النعمةُ الفلانية»."]], "tr": [[1004.0, "Birincisi: Gerçekte hiçbir tesiri olmayan gizli sebebe izafe edilmesidir;"], [1013.0, "yani gerçekte aslen hiçbir tesiri olmayan gizli sebebe izafe edilmesi."], [1019.2, "Sebeplik, sadece onu izafe edenin uydurmasından gelmiştir;"], [1024.1, "yoksa onun ne şer'an ne de kaderen gerçek bir tesiri yoktur."], [1033.0, "Bu izafe, dinden tamamen çıkaran büyük şirktendir."], [1036.1, "\"Falanca veli olmasaydı şu sıkıntıdan kurtulamazdık\" ya da \"Bize şu nimet hâsıl olmazdı\" demesi gibi."]]}, {"reader": false, "ar": [[1052.0, "فهذا من الشرك الأكبر؛"], [1054.2, "لأنه يعتقد أنّ لهذا الوليّ تصرّفًا خفيًّا في الكون مع أنه ميت."], [1061.0, "فكلُّ من أضاف شيئًا إلى سببيّةٍ خفيّةٍ لا تأثيرَ لها مطلقًا فإنه يكون بذلك قد وقع في الشرك الأكبر؛"], [1076.0, "لأنه لم يُضفها إلا لأنه يعتقد أنّ للمضاف إليه تصرّفًا خفيًّا استقلاليًّا في هذا الكون،"], [1090.0, "وهذا حقيقة الشرك الأكبر."]], "tr": [[1052.0, "Bu, büyük şirktendir; çünkü o, bu velinin ölü olduğu hâlde kâinatta gizli bir tasarrufu olduğuna inanır."], [1061.0, "Bir şeyi hiçbir şekilde tesiri olmayan gizli bir sebebe izafe eden herkes, bununla büyük şirke düşmüş olur."], [1074.8, "Çünkü onu, ancak kendisine izafe edilenin bu kâinatta bağımsız, gizli bir tasarrufu olduğuna inandığı için izafe etmiştir. Büyük şirkin hakikati budur."]]}, {"reader": false, "ar": [[1092.0, "وعلى ذلك قولُ قوم هودٍ له:"], [1096.1, "<span class=\"ayah\">﴿إِن نَّقُولُ إِلَّا اعْتَرَاكَ بَعْضُ آلِهَتِنَا بِسُوءٍ﴾<\/span> <span class=\"ref\">[هود: ٥٤]<\/span>؛"], [1104.0, "فنسبوا ذلك السوءَ المدّعى في هودٍ أنه من آلهتهم،"], [1111.0, "وتلك النسبة نسبةٌ خفيّة؛"], [1112.8, "إذ ليس ثَمّة أسبابٌ ظاهرةٌ تربط بين السوء الذي أصابه ـ على ما يدّعونه ـ وبين تلك الآلهة،"], [1120.0, "مع أنها آلهةٌ لا تضرّ ولا تنفع،"], [1124.5, "ولا تُصِحّ ولا تُمرِض،"], [1127.2, "ولا توجِد ولا تُعدِم،"], [1129.8, "ولا تُغني عن عابدها شيئًا."], [1133.0, "فهم أضافوا هذا السوءَ إلى هذه الآلهة إضافةً خفيّة،"], [1138.9, "معتقدين أنّ لهذه الآلهة تصرّفًا خفيًّا في الكون."]], "tr": [[1092.0, "Hûd kavminin ona şu sözü de bu türdendir:"], [1096.1, "<span class=\"ayah\">﴿Biz ancak, ilâhlarımızdan birinin seni fena çarptığını söylüyoruz﴾<\/span> [Hûd 54]."], [1104.0, "Hûd'da olduğunu iddia ettikleri o kötülüğü ilâhlarından olarak nispet ettiler."], [1109.7, "Bu nispet gizli bir nispettir;"], [1112.8, "çünkü onların iddiasına göre ona isabet eden kötülük ile o ilâhlar arasında bağ kuran görünür sebepler yoktur."], [1118.7, "Üstelik bunlar ne zarar ne fayda veren, ne sağlık ne hastalık veren, ne var eden ne yok eden, ne de kendisine ibadet edene hiçbir fayda sağlayan ilâhlardır."], [1133.0, "Onlar bu kötülüğü, bu ilâhların kâinatta gizli bir tasarrufu olduğuna inanarak bu ilâhlara gizli bir şekilde izafe ettiler."]]}, {"reader": false, "ar": [[1145.0, "وأكثرُ شرك العالم يدخل تحت هذا النوع؛"], [1150.0, "وهي أنه ما عُبد من دون الله من شيءٍ إلا ولا بد أن يُضيف عابدُه عليه ـ إلا ولا بد أن يُضفي عابدُه عليه ـ شيئًا من التصرّفات أو التدبيرات <span class=\"q\">؟ 19:26<\/span> الكونية."], [1169.0, "فما عُبدت الأشجار إلا لمّا أُضفي عليها هذه السببية،"], [1176.0, "وما عُبدت الشمس والقمر إلا لمّا أُضفي عليها هذه السببية ـ جزاك الله (خيرًا) ـ،"], [1183.0, "وما عُبدت الكهوف والمغارات والإنس والجن والملائكة والأولياء والصالحون إلا لمّا أُضفي عليهم شيءٌ من هذه السببية الخفية."], [1199.0, "فأصلُ شرك العالم هذه السببيةُ الخفية."]], "tr": [[1145.0, "Dünyadaki şirkin çoğu bu türün altına girer."], [1150.0, "Şöyle ki Allah'tan başka ibadet edilen hiçbir şey yoktur ki ona ibadet eden, ona —ona ibadet eden, ona— kevnî tasarruflardan veya tedbirlerden <span class=\"q\">؟<\/span> bir şey yakıştırmış olmasın."], [1169.0, "Ağaçlara, ancak onlara bu sebeplik yakıştırıldığı için ibadet edildi."], [1174.7, "Güneşe ve aya, ancak onlara bu sebeplik yakıştırıldığı için ibadet edildi —Allah seni mükâfatlandırsın—."], [1182.8, "Mağaralara, inlere, insanlara, cinlere, meleklere, velilere ve salihlere, ancak onlara bu gizli sebeplikten bir şey yakıştırıldığı için ibadet edildi."], [1199.0, "Dünyadaki şirkin aslı bu gizli sebepliktir."]]}]}, {"ts": "20:03", "title": "6. Külliye (devam): Gizli sebeplik, görünür ama delilsiz sebeplik, sahih sebeplik", "paras": [{"reader": false, "ar": [[1203.0, "وهي أن يعتقد أنّ هذا المعبودَ من دون الله عز وجل له من التصرّفات الكونية الاستقلالية ما تكون أسبابُها خفيّة،"], [1215.0, "مع أنها أحجارٌ لا تضرّ ولا تنفع،"], [1218.0, "أو أمواتٌ لا ينفعون ولا يضرّون،"], [1221.0, "أو أحياءٌ عاجزون عن مثل هذه التصرّفات،"], [1226.0, "كما أخبر الله عز وجل بعجزهم عن مراد عابديهم في قوله:"], [1230.0, "<span class=\"ayah\">﴿لَا يَسْتَطِيعُونَ نَصْرَهُمْ وَهُمْ لَهُمْ جُندٌ مُّحْضَرُونَ﴾<\/span> <span class=\"ref\">[يس: ٧٥]<\/span>."]], "tr": [[1203.0, "Bu (gizli sebeplik), Allah Azze ve Celle'den başka ibadet edilen bu şeyin, sebepleri gizli olan bağımsız kevnî tasarruflara sahip olduğuna inanmaktır."], [1212.8, "Oysa bunlar ya ne zarar ne fayda veren taşlardır, ya ne fayda ne zarar veren ölülerdir, ya da bu tür tasarruflardan aciz dirilerdir."], [1223.1, "Nitekim Allah Azze ve Celle onların, kendilerine ibadet edenlerin isteğini yerine getirmekten aciz olduklarını şu sözünde haber vermiştir:"], [1230.0, "<span class=\"ayah\">﴿Onlar bunlara yardım edemezler; (aksine) kendileri onlar için hazır bekleyen askerlerdir﴾<\/span> [Yâsîn 75]."]]}, {"reader": false, "ar": [[1236.0, "وفي قوله: <span class=\"ayah\">﴿يَا أَيُّهَا النَّاسُ ضُرِبَ مَثَلٌ فَاسْتَمِعُوا لَهُ ۚ إِنَّ الَّذِينَ تَدْعُونَ﴾<\/span> ـ أي:"], [1241.5, "تعبدون ـ <span class=\"ayah\">﴿مِن دُونِ اللَّهِ لَن يَخْلُقُوا ذُبَابًا وَلَوِ اجْتَمَعُوا لَهُ ۖ وَإِن يَسْلُبْهُمُ الذُّبَابُ شَيْئًا لَّا يَسْتَنقِذُوهُ مِنْهُ ۚ ضَعُفَ الطَّالِبُ وَالْمَطْلُوبُ﴾<\/span> <span class=\"ref\">[الحج: ٧٣]<\/span>؛"], [1252.8, "فهم عاجزون. وكما قال الله عز وجل:"], [1256.0, "<span class=\"ayah\">﴿وَالَّذِينَ تَدْعُونَ مِن دُونِهِ مَا يَمْلِكُونَ مِن قِطْمِيرٍ ۝ إِن تَدْعُوهُمْ لَا يَسْمَعُوا دُعَاءَكُمْ وَلَوْ سَمِعُوا مَا اسْتَجَابُوا لَكُمْ ۖ وَيَوْمَ الْقِيَامَةِ يَكْفُرُونَ بِشِرْكِكُمْ﴾<\/span> <span class=\"ref\">[فاطر: ١٣–١٤]<\/span>."]], "tr": [[1236.0, "Ve şu sözünde: <span class=\"ayah\">﴿Ey insanlar! Bir misal verildi, onu dinleyin: Allah'ı bırakıp da taptıklarınız﴾<\/span> —yani ibadet ettikleriniz— <span class=\"ayah\">﴿hepsi bir araya gelse bir sinek bile yaratamazlar. Sinek onlardan bir şey kapsa, onu ondan kurtaramazlar. İsteyen de istenen de âciz﴾<\/span> [Hac 73]."], [1252.8, "Demek ki onlar acizdir. Allah Azze ve Celle'nin şu sözü gibi:"], [1256.0, "<span class=\"ayah\">﴿O'nu bırakıp da taptıklarınız bir çekirdek zarına bile sahip değillerdir. Onlara dua etseniz duanızı işitmezler; işitseler bile size cevap veremezler. Kıyamet günü de sizin şirkinizi inkâr ederler﴾<\/span> [Fâtır 13–14]."]]}, {"reader": false, "ar": [[1267.0, "فكلُّ من وقع في هذه السببية الخفية التي لا تأثيرَ لها أصلًا لا في شرعٍ ولا قدرٍ فقد وقع في الشرك الأكبر."], [1277.0, "الإضافة الثانية: أن يُضيف الشيءَ إلى سببيّةٍ ظاهرة،"], [1288.1, "لكن لم يدلّ على سببيّتها الشرعُ ولا القدر ـ أن يُضيف الشيءَ إلى السببية الظاهرة،"], [1301.0, "لكن لم يدلّ على سببيّتها الشرعُ ولا القدر ـ؛"], [1305.0, "فهذه السببية تُعتبر من الشرك الأصغر،"], [1310.0, "كإضافة سببيّة دفع البلاء للتمائم،"], [1316.0, "أو وقوعِ الضرر بالطِّيَرة."], [1320.0, "فهذه السببية وإن أُضيفت إلى شيءٍ ظاهر،"], [1327.0, "إلا أنه لم يدلّ على سببيّتها لا شرعٌ ولا قدر."]], "tr": [[1267.0, "Aslen ne şeriatta ne de kaderde hiçbir tesiri olmayan bu gizli sebepliğe düşen herkes büyük şirke düşmüştür."], [1273.4, "İkinci izafe: Bir şeyi görünür bir sebepliğe izafe etmesidir;"], [1277.0, "fakat onun sebepliğine ne şeriat ne de kader delâlet etmiştir —bir şeyi görünür sebepliğe izafe etmesi, fakat onun sebepliğine ne şeriat ne de kaderin delâlet etmemesi—."], [1302.5, "Bu sebeplik küçük şirkten sayılır."], [1305.0, "Belayı def etme sebepliğini muskalara izafe etmek veya zararın meydana gelmesini uğursuzluğa (tıyera) izafe etmek gibi."], [1320.0, "Bu sebeplik görünür bir şeye izafe edilmiş olsa da onun sebepliğine ne şeriat ne de kader delâlet etmiştir."]]}, {"reader": false, "ar": [[1331.0, "السببية الثالثة ـ وهي التي تتكلّم عنها كلّيّتُنا ـ:"], [1344.0, "وهي إضافة الشيء إلى سببيّته الظاهرة التي دلّ على سببيّتها دليلُ الشرع أو القدر ـ وحيثما قلتُ «القدر» فأقصد به التجاربَ والحسّ ـ."], [1359.0, "فمن أضاف الشيءَ إلى سببيّته الظاهرة التي دلّ على سببيّتها دليلُ الشرع أو القدر،"], [1368.0, "فهذه النسبة جائزةٌ ولا بأس بها،"], [1371.0, "ولا تُعتبر من الشرك الأول ولا من الشرك الثاني."]], "tr": [[1331.0, "Üçüncü sebeplik —külliyemizin bahsettiği budur—:"], [1344.0, "Bir şeyi, sebepliğine şeriatın veya kaderin delilinin delâlet ettiği görünür sebebine izafe etmektir —\"kader\" dediğim her yerde tecrübeleri ve duyuyu kastediyorum—."], [1359.0, "Kim bir şeyi, sebepliğine şeriatın veya kaderin delilinin delâlet ettiği görünür sebebine izafe ederse, bu nispet caizdir ve bunda bir beis yoktur."], [1371.5, "Ne birinci şirkten ne de ikinci şirkten sayılır."]]}, {"reader": false, "ar": [[1377.0, "كقول بعضهم: «أشبعني طعامُك»،"], [1385.0, "فنسب الإشباعَ إلى الطعام؛"], [1387.0, "لأنّ الأكل منه سببيّةٌ ظاهرةٌ قد دلّ دليلُ القدر على أنها صحيحة."], [1394.0, "«وأرواني ماؤك»، «وشفاني علاجُك»،"], [1400.0, "«وأنقذتني شهامتُك»، «وأحياني إنقاذُك لي» مثلًا من الغرق،"], [1416.0, "«وجبرني كرمُك»، «وأفرحني عطاؤك»،"], [1425.0, "«وأنت من هداني للحق» ـ وهو يتكلّم مع داعيةٍ كان سببًا صحيحًا ـ لماذا؟"], [1435.0, "ـ لهدايته ـ، ونحو هذه النسبة."]], "tr": [[1377.0, "Bazılarının \"Yemeğin beni doyurdu\" sözü gibi;"], [1387.0, "doyurmayı yemeğe nispet etmiştir. Çünkü ondan yemek, kaderin delilinin sahih olduğuna delâlet ettiği görünür bir sebepliktir."], [1394.0, "\"Suyun beni kandırdı\", \"Tedavin bana şifa verdi\", \"Yiğitliğin beni kurtardı\", \"Beni mesela boğulmaktan kurtarman beni hayata döndürdü\", \"Cömertliğin yaramı sardı\", \"Bağışın beni sevindirdi\", \"Beni hakka hidayet eden sensin\" —sahih bir sebep olmuş bir davetçiyle konuşurken;"], [1435.0, "neyin (sebebi)? kendi hidayetinin— ve bunun gibi nispetler."]]}, {"reader": false, "ar": [[1440.0, "فهذا جائزٌ لا بأس به ولا حرج،"], [1442.0, "شريطةَ أن يعتقد أنّ الذي شفاه حقيقةً،"], [1446.7, "وأرواه حقيقةً، وأشبعه حقيقةً،"], [1449.4, "وهداه حقيقةً إنما هو الله عز وجل،"], [1455.5, "وإنما لا يقصد بهذه الإضافة إلا إضافةَ الشيء إلى سببه فقط."]], "tr": [[1440.0, "Bu caizdir; bunda bir beis ve sakınca yoktur."], [1442.0, "Şu şartla ki ona gerçekte şifa verenin, gerçekte kandıranın, gerçekte doyuranın ve gerçekte hidayet edenin ancak Allah Azze ve Celle olduğuna inansın ve bu izafeyle sadece bir şeyi sebebine izafe etmeyi kastetsin."]]}, {"reader": false, "ar": [[1461.0, "وعلى ذلك قولُ النبي صلى الله عليه وسلم لمّا سُئل عن عمّه أبي طالب،"], [1471.0, "قال: «هو في ضَحْضاحٍ من نار، ولولا أنا لكان في الدَّرْك الأسفل من النار» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [1479.0, "فهل هذه نسبةٌ لسببيّةٍ صحيحة؟"], [1482.7, "الجواب: نعم؛ لأنّ الله عز وجل قد أمكن نبيَّه صلى الله عليه وسلم في أن يشفع في عمّه أبي طالب."], [1492.0, "فقوله: «ولولا أنا» هذا من باب الإضافة إلى النسبة ـ أو إلى السببية ـ الصحيحة"]], "tr": [[1461.0, "Nebî ﷺ'in amcası Ebû Tâlib hakkında sorulduğunda söylediği şu söz de bu türdendir:"], [1471.6, "«O, ateşten sığ bir yerdedir. Ben olmasaydım, ateşin en alt tabakasında olurdu.» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [1479.0, "Bu, sahih bir sebepliğe nispet midir?"], [1483.5, "Cevap: Evet. Çünkü Allah Azze ve Celle, Nebî'sine ﷺ amcası Ebû Tâlib hakkında şefaat etme imkânı vermiştir."], [1492.0, "\"Ben olmasaydım\" sözü, sahih nispete —ya da sahih sebepliğe— izafe kabilindendir —"]]}]}, {"ts": "25:00", "title": "6. Külliye (sonu) · 7. Külliye: Her dinî-şer'î kadere hem kader hem makdûr olarak rıza vaciptir", "paras": [{"reader": false, "ar": [[1500.0, "التي دلّ عليها دليلُ الشرع؛"], [1504.0, "فإنّ الله قد جعل النبيَّ صلى الله عليه وسلم شافعًا مشفَّعًا مستجابَ الشفاعة."], [1513.0, "وبناءً على ذلك: فمن اعتقد سببيّةً خفيّةً تدبيريّة فهذا من الشرك الأكبر،"], [1523.0, "ومن نسب الشيءَ إلى سببيّةٍ ظاهرة لكن لم يدلّ على سببيّتها شرعٌ ولا قدر فهذا شركٌ أصغر،"], [1531.0, "ومن نسب الشيءَ إلى سببيّته الظاهرة التي دلّ على صوابها وسببيّتها دليلُ الشرع أو القدر فهذه نسبةٌ صحيحة،"], [1541.2, "ولا تعلّقَ لها بالشرك،"], [1546.0, "وليس فيها شيءٌ من المخالفة الشرعية."]], "tr": [[1500.0, "— şeriatın delilinin delâlet ettiği (sebepliğe)."], [1504.0, "Çünkü Allah, Nebî ﷺ'i şefaat eden, şefaati kabul edilen ve şefaatine icabet edilen biri kılmıştır."], [1513.0, "Buna binaen: Kim gizli, tedbir edici bir sebepliğe inanırsa bu büyük şirktendir."], [1515.2, "Kim bir şeyi görünür bir sebepliğe nispet eder, fakat onun sebepliğine ne şeriat ne de kader delâlet etmemişse bu küçük şirktir."], [1528.2, "Kim de bir şeyi, doğruluğuna ve sebepliğine şeriatın veya kaderin delilinin delâlet ettiği görünür sebebine nispet ederse bu sahih bir nispettir;"], [1539.7, "şirkle bir ilgisi yoktur ve onda şer'î bir muhalefet de yoktur."]]}, {"reader": false, "ar": [[1549.0, "كم رقمُ الكلّيّة عندكم؟"], [1554.0, "... الكلّيّة الثامنة أو السابعة؟"], [1556.0, "... الكلّيّة السابعة: <b>كلُّ قدرٍ دينيٍّ فيجب الرضا به قدرًا ومقدورًا.<\/b> بالمناسبة:"], [1566.7, "الكلّيّات التي ستأتينا الآن من أعظم مسائل القضاء والقدر،"], [1575.0, "والتي ضلّت فيها القدريةُ والجبرية في مسألة:"], [1577.5, "هل نرضى بقضاء الله ولّا ما نرضى؟"], [1580.0, "فصّلتُها لكم في أربع كلّيّات ـ أو في ثلاث كلّيّات ـ إن شاء الله تفصيلًا،"], [1586.9, "إن شاء الله إني أحسب أنه يوضّح المسألة،"], [1589.9, "والله على كل شيءٍ قدير <span class=\"q\">؟ 26:28<\/span>."]], "tr": [[1549.0, "Sizde külliyenin numarası kaç? ..."], [1554.0, "Sekizinci mi yedinci mi? ..."], [1556.0, "Yedinci külliye: <b>7. külliye: Her dinî kadere hem kader hem de makdûr olarak rıza göstermek vaciptir.<\/b> Bu arada:"], [1571.6, "Şimdi gelecek külliyeler, kaza ve kader meselelerinin en büyüklerindendir;"], [1577.5, "Kaderiyye'nin ve Cebriyye'nin \"Allah'ın kazasına razı olur muyuz, olmaz mıyız?\" meselesinde saptıkları (külliyelerdir)."], [1580.0, "Bunu size inşallah dört —ya da üç— külliyede ayrıntılı olarak açıkladım."], [1586.9, "İnşallah bunun meseleyi açıklayacağını umuyorum."], [1588.6, "Allah her şeye kadirdir <span class=\"q\">؟<\/span>."]]}, {"reader": false, "ar": [[1593.0, "<b>كلُّ قدرٍ دينيٍّ شرعيٍّ فيجب الرضا به قدرًا ومقدورًا.<\/b> كلُّ قدرٍ دينيٍّ شرعيٍّ فيجب الرضا به قدرًا ومقدورًا."], [1609.0, "طيب، ضعوا الأقلام قليلًا."], [1613.0, "أقول وبالله التوفيق: هذه الكلّيّة والكلّيّات التي بعدها تتكلّم عن جزئيات الرضا بالقضاء والقدر،"], [1623.0, "وحتى نفهم هذه الكلّيّة وما يعقبها من الكلّيّات لا بد أن نفرّق بين أمرين عليهما قوامُ فهم هذه الكلّيّات،"], [1637.0, "وقد شرحتُه لكم سابقًا:"]], "tr": [[1593.0, "<b>7. külliye: Her dinî-şer'î kadere hem kader hem de makdûr olarak rıza göstermek vaciptir.<\/b> Her dinî-şer'î kadere hem kader hem de makdûr olarak rıza göstermek vaciptir."], [1609.0, "Peki, kalemleri biraz bırakın. Tevfik Allah'tandır, derim ki:"], [1616.0, "Bu külliye ve ondan sonraki külliyeler, kaza ve kadere rızanın ayrıntılarından bahseder."], [1623.0, "Bu külliyeyi ve onu takip eden külliyeleri anlamamız için, bu külliyeleri anlamanın dayandığı iki şey arasında ayrım yapmamız gerekir;"], [1635.2, "bunu size daha önce de açıklamıştım:"]]}, {"reader": false, "ar": [[1640.0, "وهو وجوبُ التفريق بين فعل الله المسمّى بالقدر،"], [1644.0, "وبين فعل العبد المسمّى بالمقدور،"], [1648.0, "وبين فعل الله المسمّى بالقضاء،"], [1652.0, "وفعلِ العبد المسمّى بالمقضيّ."], [1656.0, "فالذي لا يفرّق بين القضاء والمقضيّ فلن يستطيع أن يجيب بالإجابة السليمة الصحيحة المستوفية لشروطها على منهج أهل السنة والجماعة فيما لو سُئل:"], [1666.9, "هل نرضى بالقضاء والقدر أو لا نرضى؟"]], "tr": [[1640.0, "O da, kader diye isimlendirilen Allah'ın fiili ile makdûr diye isimlendirilen kulun fiili arasında;"], [1645.6, "kazâ diye isimlendirilen Allah'ın fiili ile makdî diye isimlendirilen kulun fiili arasında ayrım yapmanın vacip olmasıdır."], [1656.0, "Kazâ ile makdî arasında ayrım yapmayan kişi, \"Kaza ve kadere razı olur muyuz, olmaz mıyız?\" diye sorulduğunda, Ehl-i Sünnet ve'l-Cemaat menhecine göre şartlarını tamamlamış, sağlam ve doğru bir cevap veremez."]]}, {"reader": false, "ar": [[1669.0, "فكلُّ جوابٍ لا ينبثق من التفريق <span class=\"q\">؟ 27:49<\/span> بين القدر والمقدور،"], [1676.0, "وبين القضاء والمقضيّ، فإنه سيكون جوابًا ناقصًا أو خاطئًا ـ عفوًا:"], [1682.8, "ناقصًا أو خطأً، ناقصًا أو خطأً ـ."], [1686.8, "إيش الفرقُ بين الخطأ والخاطئ؟"], [1689.2, "الخاطئ هو الآثم <span class=\"q\">؟ 28:09<\/span>. خاطئًا وخطأً وباطلًا."]], "tr": [[1669.0, "Kader ile makdûr ve kazâ ile makdî arasındaki ayrımdan <span class=\"q\">؟<\/span> doğmayan her cevap, eksik ya da hâtı' (günahkâr) bir cevap olur —pardon:"], [1682.8, "eksik ya da hatalı; eksik ya da hatalı—."], [1686.8, "Hata (hata') ile hâtı' arasındaki fark nedir?"], [1689.2, "Hâtı', günahkâr olandır <span class=\"q\">؟<\/span>. (Cevap) hâtı', hatalı ve bâtıl (olur)."]]}, {"reader": false, "ar": [[1695.0, "وبناءً على ذلك فأقدارُ الله عز وجل ننظر لها باعتبارين:"], [1702.0, "باعتبار كونها فعلًا من أفعاله،"], [1705.6, "وفعلُه صفةٌ من صفاته؛"], [1709.0, "فمتى ما أُضيف القضاءُ والقدر إلى الله عز وجل فالواجب على العباد أن يرضوا به فعلًا،"], [1718.0, "ولا يحلّ لأحدٍ أن يتخيّر بين الرضا وعدم الرضا فيما يُنسب إلى الله من القضاء والقدر باعتبار كونه فعلًا له،"], [1731.0, "بغضّ النظر عن نوع هذا القضاء:"], [1734.6, "أطاعةً أو معصية، إيمانًا أو كفرًا، بدعةً أو سنّة."]], "tr": [[1695.0, "Buna binaen Allah Azze ve Celle'nin kaderlerine iki itibarla bakarız:"], [1702.0, "(Birincisi) O'nun fiillerinden bir fiil olması itibarıyla;"], [1709.0, "O'nun fiili de sıfatlarından bir sıfattır."], [1711.8, "Kaza ve kader Allah Azze ve Celle'ye izafe edildiği zaman, kullara düşen ona fiil olarak razı olmaktır."], [1721.2, "Allah'a nispet edilen kaza ve kaderde, O'nun fiili olması itibarıyla, razı olmak ile razı olmamak arasında seçim yapmak hiç kimseye helal değildir."], [1734.6, "Bu kazanın türüne bakılmaksızın: ister taat ister masiyet, ister iman ister küfür, ister bid'at ister sünnet olsun."]]}, {"reader": false, "ar": [[1740.0, "فجميعُ القدر إذا نُسب إلى الله عز وجل فإنّ الواجب على العباد أن يرضوا به؛"], [1748.0, "فإنّ الرضا عن أفعاله فرعٌ عن الرضا عن ربوبيته وألوهيته،"], [1755.0, "وفرعٌ عن الإقرار بحكمته وعدله في خلقه."], [1759.0, "فلا يجوز لأحدٍ أن يعطّل اللهَ عن أقداره،"], [1765.0, "ولا يجوز لأحدٍ أن يتسخّط على القدر لأنه فعلُ الله،"], [1771.0, "أو يتضجّر من القدر لأنه فعلُ الله."]], "tr": [[1740.0, "Kaderin tamamı Allah Azze ve Celle'ye nispet edildiğinde, kullara düşen ona razı olmaktır."], [1748.0, "Çünkü O'nun fiillerinden razı olmak, rubûbiyyetinden ve ulûhiyyetinden razı olmanın bir fer'idir;"], [1754.3, "mahlûkatındaki hikmetini ve adaletini ikrar etmenin de bir fer'idir."], [1759.0, "Hiç kimsenin Allah'ı kaderlerinden mahrum bırakması (ta'til) caiz değildir."], [1765.0, "Hiç kimsenin, Allah'ın fiili olduğu için kadere öfkelenmesi veya Allah'ın fiili olduğu için kaderden hoşnutsuzluk duyması caiz değildir."]]}, {"reader": false, "ar": [[1776.0, "فمسألةُ الرضا لا بد أن نفرّق في مسارها:"], [1781.0, "أهي تسير إلى ما يخصّ الله،"], [1783.0, "ولّا تسير إلى ما يصدر من العبد؟"], [1787.0, "فإن كانت فيما يسير إلى الله من فعله،"], [1792.0, "فإنّ الواجب على العبد أن يرضى رضاءً مطلقًا بما يقسمه الله عز وجل ويقدّره في كونه،"], [1798.0, "سواءٌ قدّر طاعةً أو معصية،"]], "tr": [[1776.0, "Rıza meselesinde, onun yönü konusunda ayrım yapmamız gerekir:"], [1781.0, "Allah'a ait olana mı yöneliyor, yoksa kuldan sadır olana mı yöneliyor?"], [1787.0, "Eğer Allah'a, O'nun fiiline yönelen hususta ise kula düşen, Allah Azze ve Celle'nin kâinatında taksim ettiği ve takdir ettiği şeye mutlak bir rızayla razı olmaktır;"], [1796.9, "ister taat ister masiyet takdir etmiş olsun —"]]}]}, {"ts": "30:01", "title": "7. Külliye (devam): Rızadaki taksim kaderde değil makdûrdadır", "paras": [{"reader": false, "ar": [[1801.0, "فنرضى بهما على وجه السواء؛"], [1803.2, "لأنه هو الذي قدّرها،"], [1805.0, "والقدرُ فعلٌ من أفعاله،"], [1807.0, "والشرُّ لا يُنسب إلى الله عز وجل أبدًا."], [1811.0, "وإذا كان ما قضاه وقدّره كفرًا وإيمانًا فنرضى بهما على أنهما فعلٌ من أفعاله،"], [1819.6, "أي: قدرٌ من أقداره."], [1822.0, "فمتى ما اتّجه الرضا إلى فعل الله عز وجل فإيّاك أن تقسّم بين الأمرين،"], [1828.0, "تقول: قدرٌ نرضى به،"], [1829.5, "وقدرٌ لا نرضى به."]], "tr": [[1801.0, "— ikisine de eşit şekilde razı oluruz."], [1803.2, "Çünkü onu takdir eden O'dur;"], [1805.0, "kader de O'nun fiillerinden bir fiildir."], [1807.0, "Şer ise asla Allah Azze ve Celle'ye nispet edilmez."], [1811.0, "O'nun hükmettiği ve takdir ettiği şey küfür ve iman ise, ikisine de O'nun fiillerinden bir fiil, yani kaderlerinden bir kader olarak razı oluruz."], [1822.0, "Rıza Allah Azze ve Celle'nin fiiline yöneldiğinde, sakın iki şey arasında taksim yapıp \"Razı olduğumuz bir kader ve razı olmadığımız bir kader\" deme."]]}, {"reader": false, "ar": [[1831.0, "فما يُنسب إلى الله عز وجل من القضاء والقدر على أنه فعلُه فالواجب الرضا به؛"], [1837.5, "لأنّ الرضا به من كمال إيمانك بأنه ربُّك،"], [1841.5, "وأنه إلهُك، وأنه الحَكَمُ العدل العليم الخبير."], [1845.0, "فأيُّ طعنٍ في هذا الجزء ـ أو في هذه الشائبة ـ فهي طعنٌ في ربوبيته،"], [1851.7, "وطعنٌ في ألوهيته، وطعنٌ في حكمته،"], [1854.8, "وطعنٌ في علمه، وطعنٌ في خبرته،"], [1857.9, "وطعنٌ في قضائه وقدره."]], "tr": [[1831.0, "Allah Azze ve Celle'ye O'nun fiili olarak nispet edilen kaza ve kadere razı olmak vaciptir."], [1837.5, "Çünkü ona razı olmak, O'nun senin Rabbin, İlâhın, adaletli Hakem, her şeyi bilen ve her şeyden haberdar olan olduğuna imanının kemalindendir."], [1848.6, "Bu kısma —ya da bu yöne— yönelik her dil uzatma, O'nun rubûbiyyetine, ulûhiyyetine, hikmetine, ilmine, habîrliğine, kazasına ve kaderine dil uzatmaktır."]]}, {"reader": false, "ar": [[1860.0, "فمسألةُ الرضا والقضاء إذا لم يُفرَّق فيها بين القدر والمقدور،"], [1865.8, "والقضاء والمقضيّ، حصل الإيهامُ والإجمال الذي قد يوجب الاعتقاداتِ الفاسدة والخطأ والباطل."], [1872.0, "فهذه الكلّيّة التي معنا الآن ليست فيما يرجع إلى الله،"], [1880.0, "وإنما فيما يفعله العبد في أرض الله."], [1884.0, "وما يفعله العباد في أرض الله ينقسم إلى ما يُرضي الله،"], [1889.8, "أو ما يُسخط الله."]], "tr": [[1860.0, "Rıza ve kaza meselesinde kader ile makdûr, kazâ ile makdî arasında ayrım yapılmazsa, bozuk inançları, hatayı ve bâtılı gerektirebilecek bir belirsizlik ve kapalılık meydana gelir."], [1872.0, "Şu an elimizdeki bu külliye, Allah'a dönen şeyle ilgili değil;"], [1880.0, "kulun Allah'ın arzında yaptığı şeyle ilgilidir."], [1884.0, "Kulların Allah'ın arzında yaptıkları ise Allah'ı razı eden veya Allah'ı öfkelendiren şeyler olarak ikiye ayrılır."]]}, {"reader": false, "ar": [[1892.0, "فهذا محلُّ التقسيم فيما يجب به الرضا،"], [1896.1, "أو يُستحبّ به الرضا،"], [1898.4, "أو يُكره فيه الرضا،"], [1900.8, "أو يحرم فيه الرضا،"], [1903.1, "أو يكون الرضا به كفرًا."], [1906.0, "فهذا التقسيم إنما يأتي في المقدور لا في القدر،"], [1911.5, "ويأتي في المقضيّ لا في القضاء، وأظنّ الأمر واضحًا."]], "tr": [[1892.0, "İşte rızanın vacip olduğu, rızanın müstehap olduğu, rızanın mekruh olduğu, rızanın haram olduğu veya ona rızanın küfür olduğu şeylerdeki taksimin yeri burasıdır."], [1907.2, "Bu taksim kaderde değil makdûrda, kazâda değil makdîde söz konusudur. Sanırım mesele açıktır."]]}, {"reader": false, "ar": [[1917.0, "فهذه الكلّيّة هي أولُ ما ينبغي أن نتكلّم عنه،"], [1922.3, "وهي أنّ ما يقضيه الله عز وجل من أقداره الشرعية ـ وهو القضاء الشرعي ـ كلُّه يجب الرضا به ـ انتبه ـ قدرًا ومقدورًا."], [1934.1, "قدرًا: على أنه فعلُ الله؛"], [1939.0, "فنحن نرضى عن الله عز وجل أن يقدّر بفعله الصلاة،"], [1943.6, "أن يقدّر بفعله الزكاة،"], [1945.4, "أن يقدّر بفعله الجهاد،"], [1947.2, "أن يقدّر بفعله الصدقة،"], [1949.1, "برَّ الوالدين. نحن نرضى من الله عز وجل أن يقدّر بفعله تحريمَ الكفر،"], [1955.9, "تحريمَ الزنا، تحريمَ السرقة."]], "tr": [[1917.0, "Bu külliye, hakkında konuşmamız gereken ilk şeydir."], [1920.0, "O da şudur: Allah Azze ve Celle'nin şer'î kaderlerinden hükmettiği şeyin —ki o şer'î kazadır— tamamına —dikkat et— hem kader hem de makdûr olarak razı olmak vaciptir."], [1934.1, "Kader olarak, yani Allah'ın fiili olarak:"], [1939.0, "Allah Azze ve Celle'nin fiiliyle namazı takdir etmesinden, fiiliyle zekâtı takdir etmesinden, fiiliyle cihadı takdir etmesinden, fiiliyle sadakayı, anne-babaya iyiliği takdir etmesinden razıyız."], [1950.0, "Allah Azze ve Celle'nin fiiliyle küfrün haram kılınmasını, zinanın haram kılınmasını, hırsızlığın haram kılınmasını takdir etmesinden razıyız."]]}, {"reader": false, "ar": [[1958.0, "فجميعُ المأمورات الشرعية نحن نرضى بالأمر بها على أنها فعلٌ من أفعاله،"], [1965.5, "وأفعالُه يجب الرضا بها."], [1968.0, "وبعد صدورها من العبد نرضى بها مقدورةً؛"], [1972.0, "فإذا أوقع العبدُ الصلاةَ أحببنا صلاته،"], [1976.0, "إذا أوقع الزكاةَ رضينا بصلاته،"], [1979.0, "إذا أوقع الصدقةَ أعجبتنا صدقتُه."], [1983.0, "لا نتسخّطها، ولا نتضجّر منها،"], [1986.3, "ولا نبغضها، ولا نأباها."]], "tr": [[1958.0, "Bütün şer'î emirlerin emredilmesine, O'nun fiillerinden bir fiil olarak razı oluruz;"], [1964.9, "O'nun fiillerine razı olmak vaciptir."], [1968.0, "Kuldan sadır olduktan sonra da onlara makdûr olarak razı oluruz:"], [1972.0, "Kul namazı eda ettiğinde namazını severiz;"], [1975.3, "zekâtı eda ettiğinde namazından (zekâtından) razı oluruz;"], [1979.0, "sadakayı verdiğinde sadakası hoşumuza gider."], [1983.0, "Ona öfkelenmeyiz, ondan hoşnutsuzluk duymayız, ona buğzetmeyiz ve onu reddetmeyiz."]]}, {"reader": false, "ar": [[1989.0, "بل كلُّ عبادةٍ تصدر من العبد مقدورةً فإنها توجب من موالاتنا له بقدرها؛"], [2000.0, "فإنّ الموالاة لا تكون إلا على حسب الصفات الشرعية صدورًا من العبد،"], [2006.6, "أليس كذلك؟ فإذًا كلُّ قضاءٍ شرعيٍّ فيجب الرضا به قدرًا ـ أي فعلًا لله ـ ومقدورًا ـ أي بعد صدوره من العبد ـ."], [2020.0, "بل إنّ هذا الرضا من لوازم الإسلام،"], [2024.0, "ومن لوازم صحّة الاعتقاد."]], "tr": [[1989.0, "Bilakis kuldan makdûr olarak sadır olan her ibadet, onun miktarınca bizim ona velâyetimizi (dostluğumuzu) gerektirir."], [2000.0, "Çünkü velâyet, ancak şer'î sıfatların kuldan sadır olmasına göre olur;"], [2005.6, "öyle değil mi? Demek ki her şer'î kazaya kader olarak —yani Allah'ın fiili olarak— ve makdûr olarak —yani kuldan sadır olduktan sonra— razı olmak vaciptir."], [2020.0, "Hatta bu rıza, İslâm'ın ve akîdenin sıhhatinin lâzımlarındandır."]]}, {"reader": false, "ar": [[2027.0, "فالذي لا يرضى بشريعة الله في أرضه هذا ليس بمسلم،"], [2031.0, "الذي يكره الصلاةَ ليس بمسلم،"], [2034.0, "الذي يكره إقامةَ الحدود ليس بمسلم،"], [2037.0, "الذي يبغض حجابَ المرأة ـ على أنه قدرٌ أو على أنه مقدور ـ هذا لا حظَّ له في الإسلام أبدًا."], [2046.0, "ولذلك يقول الله عز وجل مقرِّرًا هذه الكلّيّة ـ ما أدري ارتفع صوتي،"], [2049.9, "بس معليش ـ، ولذلك يقول الله عز وجل مقرِّرًا هذه الكلّيّة:"]], "tr": [[2027.0, "Allah'ın şeriatına O'nun arzında razı olmayan Müslüman değildir."], [2030.7, "Namazdan hoşlanmayan Müslüman değildir. Hadlerin uygulanmasından hoşlanmayan Müslüman değildir."], [2036.5, "Kadının örtüsüne —kader olarak ya da makdûr olarak— buğzeden kimsenin İslâm'dan asla bir nasibi yoktur."], [2046.0, "Bu yüzden Allah Azze ve Celle bu külliyeyi takrir ederek şöyle buyurur —bilmiyorum, sesim yükseldi mi;"], [2049.8, "ama olsun—, bu yüzden Allah Azze ve Celle bu külliyeyi takrir ederek şöyle buyurur:"]]}, {"reader": false, "ar": [[2055.0, "<span class=\"ayah\">﴿فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّىٰ يُحَكِّمُوكَ﴾<\/span> ـ قدرًا ومقدورًا ـ <span class=\"ayah\">﴿فِيمَا شَجَرَ بَيْنَهُمْ﴾<\/span> ـ طيب،"], [2064.0, "قدرًا ـ <span class=\"ayah\">﴿ثُمَّ لَا يَجِدُوا فِي أَنفُسِهِمْ حَرَجًا مِّمَّا قَضَيْتَ﴾<\/span> ـ أي:"], [2070.5, "بعد صدوره، مقدورًا ـ <span class=\"ayah\">﴿وَيُسَلِّمُوا تَسْلِيمًا﴾<\/span> <span class=\"ref\">[النساء: ٦٥]<\/span>."], [2074.0, "ويقول الله عز وجل:"], [2075.3, "<span class=\"ayah\">﴿وَمَا كَانَ لِمُؤْمِنٍ وَلَا مُؤْمِنَةٍ إِذَا قَضَى اللَّهُ﴾<\/span> ـ أي:"], [2081.0, "قضاءً شرعيًّا ـ <span class=\"ayah\">﴿إِذَا قَضَى اللَّهُ وَرَسُولُهُ أَمْرًا أَن يَكُونَ لَهُمُ الْخِيَرَةُ مِنْ أَمْرِهِمْ﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٦]<\/span>."], [2086.0, "ارضَوا بقضاء الله عز وجل الكوني الشرعي وأحبّوه؛"], [2090.0, "فإنّ بُغض شيءٍ مما جاء به النبي ـ فإنّ بُغض شيءٍ مما جاء به النبي صلى الله عليه وسلم ـ هذا من الكفر الأكبر، ومن النفاق الأكبر،"]], "tr": [[2055.0, "<span class=\"ayah\">﴿Hayır, Rabbine andolsun ki onlar, seni hakem kılmadıkça﴾<\/span> —kader ve makdûr olarak— <span class=\"ayah\">﴿aralarında çekiştikleri şeylerde﴾<\/span> —peki, kader olarak— <span class=\"ayah\">﴿sonra da verdiğin hükümden içlerinde hiçbir sıkıntı duymadıkça﴾<\/span> —yani sadır olduktan sonra, makdûr olarak— <span class=\"ayah\">﴿ve tam bir teslimiyetle teslim olmadıkça iman etmiş olmazlar﴾<\/span> [Nisâ 65]."], [2075.3, "Allah Azze ve Celle şöyle buyurur:"], [2081.0, "<span class=\"ayah\">﴿Allah bir işe hükmettiğinde﴾<\/span> —yani şer'î bir hükümle— <span class=\"ayah\">﴿Allah ve Resûlü bir işe hükmettiğinde, inanmış bir erkek ve kadına o işi kendi isteklerine göre seçme hakkı yoktur﴾<\/span> [Ahzâb 36]."], [2090.0, "Allah Azze ve Celle'nin kevnî şer'î kazasına razı olun ve onu sevin."], [2094.1, "Çünkü Nebî'nin getirdiği bir şeye buğzetmek —Nebî ﷺ'in getirdiği bir şeye buğzetmek— büyük küfürden ve büyük nifaktandır —"]]}]}, {"ts": "35:01", "title": "7. Külliye (sonu) · 8. Külliye: Rabbin öfkelenmediği acı veren kevnî kadere kader olarak rıza vacip, makdûr olarak müstehaptır", "paras": [{"reader": false, "ar": [[2101.0, "الذي يُخرج صاحبه من الدين بالكلّيّة."], [2103.0, "فالقدرُ الدينيّ يجب الرضا به،"], [2107.0, "وهو من لوازم الإسلام؛"], [2109.0, "فالواجب على العبد أن يرضى بهذا القدر،"], [2113.2, "وألّا يختار في هذا النوع إلا ما اختاره له سيّدُه وربُّه وإلهُه عز وجل."], [2119.0, "ويوضّحها الكلّيّةُ التي بعدها."], [2125.0, "وانتبهوا لكلمة «قدرًا ومقدورًا» عشان نفهم الكلّيّات اللي بعدها."]], "tr": [[2101.0, "— ki sahibini dinden tamamen çıkarır."], [2103.0, "Dinî kadere razı olmak vaciptir ve bu, İslâm'ın lâzımlarındandır."], [2109.0, "Kula düşen bu kadere razı olması ve bu türde, Efendisi, Rabbi ve İlâhı Azze ve Celle'nin kendisi için seçtiğinden başkasını seçmemesidir."], [2119.0, "Bunu, ondan sonraki külliye açıklar."], [2125.0, "Sonraki külliyeleri anlayabilmemiz için \"kader ve makdûr olarak\" ifadesine dikkat edin."]]}, {"reader": false, "ar": [[2130.0, "الكلّيّة التي بعدها: كلُّ قدرٍ كونيٍّ مؤلمٍ لا يُسخطه الربّ،"], [2139.2, "فالرضا به قدرًا واجب،"], [2140.4, "ومقدورًا مستحبّ. كلُّ قدرٍ كونيٍّ مؤلمٍ لا يُسخطه الربّ..."], [2153.4, "واضحة؟ كلُّ قدرٍ كونيٍّ مؤلمٍ لا يُسخطه الربّ،"], [2168.1, "فالرضا به قدرًا واجب، ومقدورًا مستحبّ."]], "tr": [[2130.0, "Ondan sonraki külliye: 8. külliye:"], [2134.0, "Rabbin öfkelenmediği acı veren her kevnî kadere kader olarak razı olmak vacip, makdûr olarak razı olmak müstehaptır. Rabbin öfkelenmediği acı veren her kevnî kader..."], [2153.4, "Açık mı? Rabbin öfkelenmediği acı veren her kevnî kadere kader olarak razı olmak vacip, makdûr olarak razı olmak müstehaptır."]]}, {"reader": false, "ar": [[2177.0, "ونعني بذلك المصائبَ والآلامَ والأمراضَ والأحزانَ والحسراتِ والخساراتِ التي تصيب العبدَ في أرض الله عز وجل؛"], [2189.0, "فإنها من أقدار الله الكونية التي يُجريها الله عز وجل في كونه على من شاء من عباده،"], [2195.6, "ليبتليهم في صحّة إيمانهم وما يقابلونها به."]], "tr": [[2177.0, "Bununla, kula Allah Azze ve Celle'nin arzında isabet eden musibetleri, acıları, hastalıkları, hüzünleri, hasretleri ve kayıpları kastediyoruz."], [2189.4, "Çünkü bunlar, Allah Azze ve Celle'nin, imanlarının sıhhatinde ve onları neyle karşıladıklarında imtihan etmek için kâinatında kullarından dilediklerinin üzerinde cereyan ettirdiği kevnî kaderlerdendir."]]}, {"reader": false, "ar": [[2200.0, "فمتى ما نزل عليك شيءٌ من هذه الأقدار الكونية المؤلمة ـ وقولُنا «المؤلمة» يعني:"], [2206.7, "التي لا تحبّها النفوس،"], [2209.0, "وتتنافر معها الفطرة ولا تريدها؛"], [2212.0, "فليس أحدٌ يريد أن تنزل المصيبةُ عليه،"], [2216.0, "ولا أن يصيبه المرض،"], [2218.0, "ولا أن تصيبه الآلام،"], [2220.0, "ولذلك فإنّ كثيرًا من استعداداتنا الدينية والدنيوية إنما لنتّقي بها هذه المصائبَ والأحزانَ والآلام،"], [2230.0, "أليس كذلك؟ الجواب: بلى ـ."]], "tr": [[2200.0, "Bu acı veren kevnî kaderlerden biri başına indiğinde —\"acı veren\" sözümüz, nefislerin sevmediği, fıtratın ters düştüğü ve istemediği (şeyler) demektir."], [2212.0, "Hiç kimse başına musibet inmesini, hastalık isabet etmesini ya da acılar isabet etmesini istemez."], [2219.0, "Bu yüzden dinî ve dünyevî hazırlıklarımızın çoğu, ancak bunlarla bu musibetlerden, hüzünlerden ve acılardan korunmak içindir;"], [2229.3, "öyle değil mi? Cevap: Evet—."]]}, {"reader": false, "ar": [[2232.0, "لكن إذا قدّر الله شيئًا منها عليك فتكون داخلةً تحت هذه الكلّيّة،"], [2238.0, "فلك فيها متعلَّقان: رضًا واجب،"], [2241.0, "ورضًا مستحبّ ـ رضًا واجب،"], [2243.7, "ورضًا مستحبّ ـ. أمّا الرضا الواجب فباعتبار كونها قدرًا،"], [2250.0, "أي: فعلًا من الله عز وجل،"], [2251.0, "والذي يكون تركُه تسخّطًا على قضاء الله عز وجل وقدره."]], "tr": [[2232.0, "Fakat Allah bunlardan birini senin üzerine takdir ederse, bu külliyenin altına girer ve senin onda iki taalluk vardır:"], [2239.9, "vacip bir rıza ve müstehap bir rıza —vacip bir rıza ve müstehap bir rıza—."], [2247.0, "Vacip rıza, onun kader, yani Allah Azze ve Celle'den bir fiil olması itibarıyladır;"], [2250.8, "bunu terk etmek, Allah Azze ve Celle'nin kaza ve kaderine öfkelenmek olur."]]}, {"reader": false, "ar": [[2257.0, "فالذين ينتفون شعورَهم وقتَ المصائب إنما يتسخّطون على فعل الله عز وجل بهم فيها،"], [2265.0, "والذين يضربون وجوهَهم، ويشقّون جيوبَهم،"], [2269.0, "ويدعون بالويل والثبور، وينوحون النياحةَ العظيمة على المصيبة،"], [2276.0, "إنما يُظهرون تسخّطَهم على قدر الله عز وجل الذي هو فعلُه."]], "tr": [[2257.0, "Musibet anında saçlarını yolanlar, ancak Allah Azze ve Celle'nin o musibette kendilerine yaptığı fiile öfkelenmektedirler."], [2264.6, "Yüzlerine vuranlar, yakalarını yırtanlar, \"Vay başıma!"], [2268.2, "Mahvoldum!\" diye bağıranlar ve musibet üzerine büyük bir feryatla ağıt yakanlar, ancak Allah Azze ve Celle'nin fiili olan kaderine öfkelerini açığa vurmaktadırlar."]]}, {"reader": false, "ar": [[2282.0, "فمتى ما نزلت عليك مصيبةٌ فاعلم أنك إن نسبتَها إلى الله،"], [2292.0, "وأنها فعلٌ من أفعاله،"], [2294.9, "وأنها قدرٌ <span class=\"q\">؟ 38:12<\/span> منه عليك،"], [2298.0, "فالواجب عليك أن ترضى،"], [2300.3, "وأن تسلّم، وألّا تتسخّط،"], [2302.9, "وألّا تتضجّر، وأن تُذعن إلى ربك،"], [2306.7, "وأن تعلم أنّ ما أصابك لم يكن ليخطئك،"], [2310.0, "وأنّ ما أخطأك لم يكن ليصيبك،"], [2312.0, "وأن تبتعد عن كلّ عبارةٍ تسخّطية،"], [2316.2, "أو استشعارٍ قلبيٍّ تسخّطي،"], [2321.0, "أو عملٍ جوارحيٍّ تسخّطي."]], "tr": [[2282.0, "Başına bir musibet indiğinde bil ki, onu Allah'a, O'nun fiillerinden bir fiil ve senin üzerine O'ndan bir kader <span class=\"q\">؟<\/span> olarak nispet edersen, sana düşen razı olman, teslim olman, öfkelenmemen, hoşnutsuzluk göstermemen, Rabbine boyun eğmen;"], [2305.8, "sana isabet edenin seni ıskalayacak olmadığını ve seni ıskalayanın sana isabet edecek olmadığını bilmen;"], [2311.3, "öfke içeren her sözden, öfke içeren her kalbî duygudan ve öfke içeren her uzuv amelinden uzak durmandır."]]}, {"reader": false, "ar": [[2324.0, "فلا يجوز لك أن تتسخّط على شيءٍ من أفعال الله،"], [2328.0, "لا تسخّطًا قلبيًّا باطنيًّا،"], [2330.0, "ولا قوليًّا لسانيًّا، ولا عمليًّا ظاهريًّا."], [2333.0, "ولكن باعتبار كونها وقعت عليك،"], [2340.0, "هذه لا يجب عليك الرضا بها في الأصحّ،"], [2344.0, "بل يُشرع لك أن تدافعها بالمقدور عليه شرعًا ودينًا ـ شرعًا وقدرًا ـ."]], "tr": [[2324.0, "Allah'ın fiillerinden hiçbirine öfkelenmen caiz değildir;"], [2326.8, "ne kalbî-bâtınî bir öfkeyle, ne sözlü-lisânî, ne de amelî-zahirî bir öfkeyle."], [2333.0, "Fakat senin üzerine vâki olması itibarıyla ise, en sahih görüşe göre ona razı olman vacip değildir."], [2343.5, "Bilakis onu, şer'an ve dinen —şer'an ve kaderen— gücünün yettiği şeylerle def etmen meşrudur."]]}, {"reader": false, "ar": [[2351.0, "فآلامُ الأمراض لا يحملنّك الرضا بفعل الله ألّا تدافعها مقدورةً،"], [2360.0, "والمصائبُ والآلام لا يحملنّك ـ على كونها ـ على أنها فعلٌ من الله ألّا تدافعها بالسببية التي ترفع عنك آثارَها مقدورةً."], [2376.0, "فلا ينبغي أن تتعامل مع هذه المصائب ـ إيش؟"], [2379.0, "ـ باجتناب ما يرفعها عنك رضاءً بقضاء الله عز وجل."]], "tr": [[2351.0, "Hastalıkların acıları: Allah'ın fiiline razı olmak, seni onları makdûr olarak def etmemeye sevk etmesin."], [2360.8, "Musibetler ve acılar: Onların Allah'tan bir fiil olması, seni onları, makdûr olarak eserlerini senden kaldıran sebeplerle def etmemeye sevk etmesin."], [2376.0, "Bu musibetlere —ne ile?— Allah Azze ve Celle'nin kazasına rıza gerekçesiyle onları senden kaldıracak şeylerden kaçınarak muamele etmen uygun değildir."]]}, {"reader": false, "ar": [[2386.0, "نقول: فإنّ أعظمَ الراضين بقضاء الله وقدره ـ وهو النبي صلى الله عليه وسلم ـ كان يستدفع هذه الأقدار بالمقدور عليه شرعًا ودينًا ـ شرعًا وقدرًا ـ من الأسباب."]], "tr": [[2386.0, "Deriz ki: Allah'ın kaza ve kaderine razı olanların en büyüğü —ki o Nebî ﷺ'dir— bu kaderleri, şer'an ve dinen —şer'an ve kaderen— gücü yeten sebeplerle def etmeye çalışırdı."]]}]}, {"ts": "40:01", "title": "8. Külliye (sonu) · 9. Külliye: Uygun gelen kevnî kadere kader olarak rıza, makdûr olarak şükür vaciptir", "paras": [{"reader": false, "ar": [[2401.0, "وقد اختلف العلماء في حكم الرضا بها مقدورةً لا قدرًا ـ الظاهر واضح ـ،"], [2411.0, "مقدورةً لا قدرًا، على قولين لأهل العلم."], [2417.0, "والقول الصحيح الذي جرينا عليه أنّ الرضا بها مقدورةً من الأمور المستحبّة الكمالية،"], [2423.0, "لكن ليست من الأمور الواجبة؛"], [2425.9, "وإنما هي من الأمور الواجبة باعتبار كونها قدرًا،"], [2430.0, "ومن الأمور المستحبّة باعتبار كونها مقدورة."]], "tr": [[2401.0, "Âlimler, ona kader olarak değil makdûr olarak razı olmanın hükmünde —galiba açık—, kader olarak değil makdûr olarak (razı olmanın hükmünde) iki görüş üzere ihtilaf etmişlerdir."], [2417.0, "Bizim üzerinde yürüdüğümüz sahih görüş şudur:"], [2420.2, "Ona makdûr olarak razı olmak, kemal kabilinden müstehap işlerdendir;"], [2425.9, "fakat vacip işlerden değildir. Bilakis o, kader olması itibarıyla vacip işlerden, makdûr olması itibarıyla müstehap işlerdendir."]]}, {"reader": false, "ar": [[2433.0, "فلو لم تفصّل هذا التفصيل،"], [2436.2, "فإنّ إطلاق كوننا نرضى بالمصائب فيحتمل الرضا بها قدرًا،"], [2442.1, "والرضا بها مقدورةً، أو التسخّط عليها قدرًا،"], [2446.9, "أو التسخّط عليها مقدورةً."], [2450.0, "ويوضّح ذلك التي بعدها ـ كم رقمها؟ ـ:"]], "tr": [[2433.0, "Bu ayrıntıyı yapmazsan, \"Musibetlere razı oluruz\" diye mutlak söylemek;"], [2437.5, "onlara kader olarak razı olmaya, makdûr olarak razı olmaya, ya da kader olarak öfkelenmeye veya makdûr olarak öfkelenmeye ihtimalli olur."], [2450.0, "Bunu, ondan sonraki (külliye) açıklar —numarası kaç?—:"]]}, {"reader": false, "ar": [[2459.0, "كلُّ قدرٍ كونيٍّ ملائمٍ فيجب الرضا به قدرًا،"], [2469.1, "وشكرُه مقدورًا. كلُّ قدرٍ كونيٍّ ملائمٍ فيجب الرضا به قدرًا،"], [2480.1, "وشكرُه مقدورًا. كلُّ قدرٍ كونيٍّ ملائمٍ فيجب الرضا به قدرًا، وشكرُه مقدورًا."]], "tr": [[2459.0, "<b>9. külliye: (İnsana) uygun gelen her kevnî kadere kader olarak razı olmak, makdûr olarak da ona şükretmek vaciptir.<\/b> (İki kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[2495.0, "ونعني بالقدر الكونيّ الملائم:"], [2497.0, "أي ما يطلبه الإنسان أصالةً؛"], [2500.0, "من الصحة ـ فالصحة قدر ـ،"], [2502.0, "ومن المال ـ فالمال قدر ـ،"], [2504.0, "ومن الزواج، ورغد العيش،"], [2506.0, "وسعة الرزق، والأولاد، والزوجة،"], [2510.0, "والوظيفة المرموقة، والصحبة الصالحة،"], [2513.9, "وغيرها مما يطلبه العبد أصالةً."]], "tr": [[2495.0, "Uygun gelen kevnî kaderden kastımız, insanın aslen talep ettiği şeylerdir:"], [2500.0, "Sağlık —sağlık bir kaderdir—, mal —mal bir kaderdir—, evlilik, bolluk içinde yaşamak, rızkın genişliği, çocuklar, eş, itibarlı bir iş, salih arkadaşlık ve kulun aslen talep ettiği diğer şeyler."]]}, {"reader": false, "ar": [[2517.0, "فإذا قدّر الله عز وجل عليك شيئًا من هذه الأقدار،"], [2521.0, "فلك فيها متعلَّقٌ يرجع إلى الله،"], [2525.2, "وهو وجوبُ الرضا بها؛"], [2529.0, "أنك ترضى بها رضًا يجعلك تستغلّها وتستخدمها فيما يقرّبك إليه عز وجل."], [2536.0, "وأمّا باعتبار كونها مقدورةً خصّك الله عز وجل بها،"], [2543.0, "فإنها توجب عليك الشكر."]], "tr": [[2517.0, "Allah Azze ve Celle bu kaderlerden birini senin için takdir ederse, senin onda Allah'a dönen bir taalluk vardır;"], [2523.8, "o da ona razı olmanın vacip olmasıdır:"], [2529.0, "Ona, onu seni Allah Azze ve Celle'ye yaklaştıran şeylerde değerlendirip kullanmanı sağlayacak bir rızayla razı olursun."], [2536.0, "Allah Azze ve Celle'nin seni onunla hususileştirdiği bir makdûr olması itibarıyla ise, o sana şükrü vacip kılar."]]}, {"reader": false, "ar": [[2545.0, "والقول الصحيح أنّ شكرَ المنعم واجبٌ وفرضٌ عقلًا ونقلًا وفطرةً واعتبارًا صحيحًا."], [2557.0, "وهي مسألةٌ اختلف فيها الأصوليون:"], [2560.0, "هل شكرُ المنعم واجبٌ عقلًا أم نقلًا؟"], [2566.0, "الجواب: واجبٌ بالاعتبارين عند أهل السنة والجماعة،"], [2570.0, "بل ونضيف إليها وجوبَ الشكر فطرةً،"], [2574.1, "ووجوبَ الشكر بالاعتبار الصحيح، أي: بالقياس الصريح."]], "tr": [[2545.0, "Sahih görüş şudur: Nimet verene şükretmek;"], [2547.7, "akıl, nakil, fıtrat ve sahih itibar (kıyas) yönünden vacip ve farzdır."], [2557.0, "Bu, usûlcülerin ihtilaf ettiği bir meseledir:"], [2560.0, "Nimet verene şükretmek akılla mı vaciptir, nakille mi?"], [2566.0, "Cevap: Ehl-i Sünnet ve'l-Cemaat'e göre her iki itibarla da vaciptir."], [2570.0, "Hatta buna şükrün fıtraten vacip olmasını ve sahih itibarla, yani açık kıyasla vacip olmasını da ekleriz."]]}, {"reader": false, "ar": [[2579.0, "ولذلك الله عز وجل دائمًا في القرآن يأمرنا عند ذكر النعم بالشكر،"], [2586.0, "حتى يبيّن لنا الواجبَ علينا تجاه هذه النعم مقدورةً،"], [2593.0, "كما قال الله عز وجل:"], [2596.6, "<span class=\"ayah\">﴿وَاشْكُرُوا لِي﴾<\/span> ـ واشكر لي،"], [2597.6, "عفوًا ـ <span class=\"ayah\">﴿وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ﴾<\/span> <span class=\"ref\">[البقرة: ١٥٢]<\/span>،"], [2601.0, "ويقول الله عز وجل:"], [2603.2, "<span class=\"ayah\">﴿فَابْتَغُوا عِندَ اللَّهِ الرِّزْقَ وَاعْبُدُوهُ وَاشْكُرُوا لَهُ﴾<\/span> <span class=\"ref\">[العنكبوت: ١٧]<\/span>،"], [2607.0, "ويقول الله عز وجل:"], [2609.0, "<span class=\"ayah\">﴿وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ﴾<\/span> <span class=\"ref\">[إبراهيم: ٧]<\/span>."]], "tr": [[2579.0, "Bu yüzden Allah Azze ve Celle Kur'an'da nimetleri zikrederken bize daima şükretmeyi emreder ki makdûr olarak bu nimetlere karşı bize düşeni açıklasın."], [2591.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2596.6, "<span class=\"ayah\">﴿Bana şükredin﴾<\/span> —\"Bana şükret\", pardon— <span class=\"ayah\">﴿Bana şükredin, sakın nankörlük etmeyin﴾<\/span> [Bakara 152]."], [2598.7, "Allah Azze ve Celle şöyle buyurur:"], [2603.2, "<span class=\"ayah\">﴿Rızkı Allah katında arayın, O'na ibadet edin ve O'na şükredin﴾<\/span> [Ankebût 17]."], [2607.0, "Allah Azze ve Celle şöyle buyurur:"], [2609.0, "<span class=\"ayah\">﴿Hani Rabbiniz şöyle bildirmişti: Andolsun, şükrederseniz elbette size (nimetimi) artırırım﴾<\/span> [İbrâhîm 7]."]]}, {"reader": false, "ar": [[2612.0, "ويقول الله عز وجل:"], [2614.0, "<span class=\"ayah\">﴿وَاشْكُرُوا لِلَّهِ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٧٢]<\/span> <span class=\"note\">(Şeyh «واشكروا الله» diyor)<\/span>،"], [2617.0, "ويقول الله عز وجل:"], [2619.0, "<span class=\"ayah\">﴿وَلَعَلَّكُمْ تَشْكُرُونَ﴾<\/span>، ويقول الله عز وجل:"], [2621.8, "<span class=\"ayah\">﴿مَّا يَفْعَلُ اللَّهُ بِعَذَابِكُمْ إِن شَكَرْتُمْ وَآمَنتُمْ﴾<\/span> <span class=\"ref\">[النساء: ١٤٧]<\/span>."], [2625.0, "وهكذا في القرآن من أوله إلى آخره،"], [2627.9, "حتى يبيّن الله عز وجل الواجبَ علينا تجاه هذا القدر الملائم؛"], [2635.0, "فباعتبار كونه قدرًا نرضاه،"], [2639.0, "وباعتبار كونه مقدورًا نشكر الله عز وجل ونحمده عليه."]], "tr": [[2612.0, "Allah Azze ve Celle şöyle buyurur:"], [2614.0, "<span class=\"ayah\">﴿Eğer yalnız O'na kulluk ediyorsanız Allah'a şükredin﴾<\/span> [Bakara 172]."], [2617.0, "Allah Azze ve Celle şöyle buyurur:"], [2619.0, "<span class=\"ayah\">﴿Umulur ki şükredersiniz﴾<\/span>. Allah Azze ve Celle şöyle buyurur:"], [2621.8, "<span class=\"ayah\">﴿Siz şükreder ve iman ederseniz Allah size niye azap etsin?﴾<\/span> [Nisâ 147]."], [2625.0, "Kur'an'da baştan sona böyledir; ta ki Allah Azze ve Celle bu uygun gelen kadere karşı bize düşeni açıklasın:"], [2630.8, "Kader olması itibarıyla ona razı oluruz;"], [2635.0, "makdûr olması itibarıyla da onun için Allah Azze ve Celle'ye şükreder ve hamd ederiz."]]}, {"reader": false, "ar": [[2644.0, "ويوضّحها الكلّيّةُ الأخيرة في هذا الدرس،"], [2646.2, "والتي لا أدري عن رقمها ـ طيب،"], [2648.9, "الكلّيّة العاشرة ـ: كلُّ قدرٍ كونيٍّ يُسخطه الربّ،"], [2654.0, "فيجب الرضا به قدرًا،"], [2656.7, "وبغضُه مقدورًا. كلُّ قدرٍ كونيٍّ يُسخطه الربّ،"], [2666.0, "فيجب الرضا به قدرًا، وبغضُه مقدورًا."]], "tr": [[2644.0, "Bunu, bu dersteki son külliye açıklar;"], [2646.5, "numarasını bilmiyorum —peki, onuncu külliye—:"], [2651.0, "<b>10. külliye: Rabbin öfkelendiği her kevnî kadere kader olarak razı olmak, makdûr olarak da ona buğzetmek vaciptir.<\/b> Rabbin öfkelendiği her kevnî kadere kader olarak razı olmak, makdûr olarak da ona buğzetmek vaciptir."]]}, {"reader": false, "ar": [[2672.0, "أقول وبالله التوفيق: وأظنّ هذه الكلّيّة قد اتّضحت باتّضاح ما قبلها،"], [2681.0, "وبالتفريق بين القدر والمقدور."], [2684.0, "وهذه الكلّيّة يدخل تحتها جميعُ ما نهى الله عز وجل عنه من الكفر وما دونه."], [2696.0, "فهذه الأمور ننظر لها باعتبارين:"]], "tr": [[2672.0, "Tevfik Allah'tandır, derim ki: Sanırım bu külliye, ondan öncekilerin açıklığa kavuşmasıyla ve kader ile makdûr arasındaki ayrımla açıklığa kavuşmuştur."], [2684.0, "Bu külliyenin altına, Allah Azze ve Celle'nin yasakladığı küfür ve ondan aşağı her şey girer."], [2696.0, "Bu işlere iki itibarla bakarız:"]]}]}, {"ts": "45:00", "title": "10. Külliye: Rabbin öfkelendiği kevnî kadere kader olarak rıza, makdûr olarak buğz · Şer, Allah'ın fiilinde değil mef'ûllerindedir", "paras": [{"reader": false, "ar": [[2700.0, "باعتبار كونها قدرًا من الله عز وجل،"], [2704.0, "وباعتبار كونها مقدورًا صدر من العبد."], [2708.0, "فباعتبار كونها قدرًا ـ أي فعلًا من الله عز وجل ـ فالواجب علينا الرضا بها؛"], [2717.0, "لأننا نؤمن إيمانًا جازمًا ـ وذكرناه في كلّيّةٍ سابقة ـ أنه ما من قدرٍ كونيٍّ يُسخط اللهَ إلا ولله فيه الحكمةُ التي تترتّب عليه،"], [2733.0, "كما بيّنّاه في خلق إبليس،"], [2736.0, "وفي وجود الكفر والمعاصي وغيرها."]], "tr": [[2700.0, "Allah Azze ve Celle'den bir kader olmaları itibarıyla ve kuldan sadır olan bir makdûr olmaları itibarıyla."], [2708.0, "Kader —yani Allah Azze ve Celle'den bir fiil— olmaları itibarıyla onlara razı olmamız vaciptir."], [2717.0, "Çünkü kesin bir imanla inanırız —ve bunu önceki bir külliyede zikrettik— ki Allah'ı öfkelendiren hiçbir kevnî kader yoktur ki Allah'ın onda, ona bağlı bir hikmeti bulunmasın."], [2733.6, "Nitekim bunu İblîs'in yaratılmasında, küfrün, masiyetlerin ve benzerlerinin varlığında açıklamıştık."]]}, {"reader": false, "ar": [[2739.0, "فإننا ذكرنا فيها أنّ الله لا يريدها لذاتها،"], [2744.1, "وإنما يريدها في كونه لما يترتّب عليها من الحِكَم المحمودة،"], [2750.4, "والغايات والمصالح التي تُظهر لنا كمالَ ربوبيته،"], [2754.8, "وعظيمَ ألوهيته، وتدبيرَه في خلقه عز وجل."], [2760.0, "فنحن نرضاها من الله عز وجل على أنها فعلٌ من أفعاله وقدرٌ من أقداره."]], "tr": [[2739.0, "Orada zikretmiştik ki Allah onları zatları için irade etmez;"], [2744.1, "onları kâinatında, onlara bağlı olan övülmüş hikmetler, gayeler ve maslahatlar için irade eder;"], [2752.3, "bunlar bize O'nun rubûbiyyetinin kemalini, ulûhiyyetinin büyüklüğünü ve mahlûkatındaki tedbirini gösterir."], [2760.0, "Biz onlara, Allah Azze ve Celle'den, O'nun fiillerinden bir fiil ve kaderlerinden bir kader olarak razı oluruz."]]}, {"reader": false, "ar": [[2767.0, "لكن باعتبارها مقدورةً ـ أي باعتبار صدورها من العبد ـ فنحن نبغضها ونمقتها وننكرها،"], [2774.9, "وننهى عنها ونحذّر منها،"], [2778.0, "ولا نُقرّها أبدًا في أرض الله عز وجل،"], [2781.0, "كما أخبرنا الله عز وجل بذلك في كتابه،"], [2786.0, "كما قال الله عز وجل:"], [2788.9, "«إن تشكروا...» <span class=\"ayah\">﴿إِن تَكْفُرُوا فَإِنَّ اللَّهَ غَنِيٌّ عَنكُمْ ۖ وَلَا يَرْضَىٰ لِعِبَادِهِ الْكُفْرَ﴾<\/span> <span class=\"ref\">[الزمر: ٧]<\/span> ـ أي:"], [2796.4, "مقدورًا؛ أي: لا يرضى لعباده الكفرَ مقدورًا ـ."]], "tr": [[2767.0, "Fakat makdûr olmaları —yani kuldan sadır olmaları— itibarıyla onlara buğzeder, onlardan nefret eder, onları inkâr eder (reddederiz);"], [2777.1, "onlardan nehyeder, onlardan sakındırırız ve onları Allah Azze ve Celle'nin arzında asla onaylamayız."], [2782.9, "Nitekim Allah Azze ve Celle bize bunu kitabında haber vermiştir."], [2788.9, "Allah Azze ve Celle'nin şu sözü gibi:"], [2790.6, "\"Ş
