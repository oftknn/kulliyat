<script>
const D={"no": 26, "vid": "yAYl15KPzuo", "title_ar": "الدرس (٢٦) من شرح كليات العقيدة — من كليات البدع", "title_tr": "Şerhu Külliyyâti'l-Akîde — 26. Ders: Bid'at Külliyeleri (Zaman ve Mekân İhyası, Bid'atlerin Dereceleri, İstihsan, Rüya, Akıl, İmtihan, Zikirler, İhtilaflı Meseleler)", "sections": [{"ts": "00:00", "title": "1. Külliye: Şer'î delilin göstermediği bir zamanı ihya eden bid'atçidir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.4, "والصلاةُ والسلامُ على رسول الله الأمين،"], [6.1, "وعلى آله وأصحابه الطيبين الطاهرين،"], [9.1, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [12.7, "لا نزال في سياق كلّيّات البدع،"], [16.4, "وعندنا في هذا الدرس جُملٌ منها."], [20.0, "الكلّيّة الأولى: <b>كلُّ من أحيا زمانًا لم يدلَّ على إحيائه دليلُ الشرع فمبتدع.<\/b> <span class=\"note\">(يكررها)<\/span> أي:"], [31.7, "فإنّ إحياءه لهذا الزمان من البدع والمحدثات في دين الله عز وجل."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.8, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.7, "Hâlâ bid'at külliyeleri bağlamındayız; bu derste bunlardan bir kısmını ele alacağız."], [20.0, "<b>1. külliye: Şer'î delilin ihyasına delâlet etmediği bir zamanı ihya eden herkes bid'atçidir.<\/b> Yani onun bu zamanı ihya etmesi, Allah Azze ve Celle'nin dininde bid'atlerden ve sonradan çıkarılmış şeylerdendir."]]}, {"reader": false, "ar": [[56.0, "وذلك لأنّ تعظيم الزمانيّة لا نقبله ـ معاشرَ أهل السنة والجماعة ـ إلا بدليل الشرع الصحيح الصريح؛"], [64.0, "لأنّ المتقرّر في القواعد أنّ الأصل استواءُ أجزاء الزمان في الفضل والتعبّد."], [72.0, "فمن خصّ زمانًا بشيءٍ تعبّديٍّ دون الأزمنة الأخرى فهو مطالَبٌ بالدليل الدالّ على هذا التخصيص."], [81.0, "ولأنّ المتقرّر في القواعد أنّ التخصيص التعبّديّ مبنيٌّ على التوقيف؛"], [86.0, "فلا يجوز لنا أن نعمد إلى زمانٍ معيّنٍ فنخصّه باحتفالٍ،"], [92.0, "أو باجتماعٍ، أو بتوسيع نفقةٍ،"], [95.0, "أو بفرحٍ زائد، أو بإطعام طعامٍ،"], [98.6, "أو صدقةٍ، أو قيامٍ،"], [101.0, "دون سائر الأزمنة إلا بدليل."]], "tr": [[56.0, "Bu şundandır: Biz Ehl-i Sünnet ve'l-Cemaat topluluğu, zamanın (bir zaman oluşu itibarıyla) tazim edilmesini ancak sahih ve sarih şer'î delille kabul ederiz."], [64.0, "Çünkü kaidelerde yerleşik olan şudur:"], [66.7, "Asıl olan, zaman parçalarının fazilet ve taabbud bakımından eşit olmasıdır."], [72.0, "Kim bir zamanı diğer zamanlar arasından taabbudî bir şeyle tahsis ederse, bu tahsise delâlet eden delili getirmesi istenir."], [81.0, "Ayrıca kaidelerde yerleşik olan şudur:"], [83.5, "Taabbudî tahsis tevkîfe (nassa) dayanır."], [86.0, "Bu yüzden belirli bir zamanı diğer bütün zamanlar arasından bir kutlama, bir toplantı, nafakayı genişletme, fazladan bir sevinç, yemek yedirme, sadaka ya da gece namazı ile tahsis etmemiz ancak bir delille caiz olur."]]}, {"reader": false, "ar": [[104.0, "وبناءً على ذلك: فالاحتفال برأس السنة من البدع؛"], [111.0, "لعدم وجود الدليل على إحياء هذه الزمانيّة."], [115.0, "والاحتفال بيوم عاشوراء بغير الصيام أيضًا من البدع التي لم يدلّ عليها دليل الشرع،"], [125.0, "وإنما دلّ دليلُ الشرع على سنّيّة صيام هذا اليوم فقط."], [130.0, "وكذلك الاحتفال بمولد نبيٍّ من الأنبياء،"], [136.0, "فيخصّون زمانيّة ولادته بشيءٍ من الاحتفال أو الاجتماع أو الفرح والسرور،"], [143.0, "وهذا كلّه ممّا لم يرد به دليلُ الشرع."]], "tr": [[104.0, "Buna göre yılbaşını kutlamak bid'atlerdendir;"], [111.0, "çünkü bu zamanın ihyasına dair bir delil yoktur."], [115.0, "Âşûrâ gününü oruçtan başka bir şeyle kutlamak da şer'î delilin göstermediği bid'atlerdendir;"], [124.5, "şer'î delil sadece bu günün orucunun sünnet olduğunu göstermiştir."], [130.0, "Peygamberlerden birinin doğumunu (mevlidini) kutlamak da böyledir:"], [136.0, "Onun doğum zamanını bir kutlama, toplantı ya da sevinç ve neşe ile tahsis ederler."], [143.5, "Bunların hepsi, hakkında şer'î delil gelmemiş şeylerdendir."]]}, {"reader": false, "ar": [[147.0, "وكما يفعله الرافضة في الاحتفال بمولد عليّ بن أبي طالب،"], [151.3, "أو الحسن، أو الحسين،"], [153.0, "أو مولد فاطمة الزهراء رضي الله عنهم وأرضاهم؛"], [159.0, "كلُّ ذلك ممّا لم يرد به دليل الشرع،"], [162.0, "فإحياؤه يُعتبر من البدع المحدثة المستنكَرة في شريعة رسول الله ـ في شريعة الله تعالى."], [169.0, "وكذلك إحياء أوّل ليلةٍ من رجب،"], [173.0, "أو إحياء ليلة الإسراء والمعراج،"], [178.0, "أو إحياء ليلة النصف من شعبان؛"], [182.0, "فكلُّ ذلك ممّا لم يرد به دليل الشرع."]], "tr": [[147.0, "Râfıza'nın Ali b. Ebû Tâlib'in, Hasan'ın, Hüseyin'in ya da Fâtıma ez-Zehrâ'nın —Allah onlardan razı olsun ve onları razı etsin— doğumunu kutlamakta yaptıkları da böyledir."], [159.0, "Bunların hepsi hakkında şer'î delil gelmemiş şeylerdendir;"], [161.2, "bu yüzden onları ihya etmek Resûlullah'ın şeriatinde —(yani) Allah Teâlâ'nın şeriatinde— sonradan çıkarılmış, münker bid'atlerden sayılır."], [169.0, "Recep ayının ilk gecesini ihya etmek, İsrâ ve Mi'râc gecesini ihya etmek ya da Şaban ayının yarısı gecesini ihya etmek de böyledir;"], [182.4, "bunların hepsi hakkında şer'î delil gelmemiş şeylerdendir."]]}, {"reader": false, "ar": [[185.0, "ويدخل فيها أيضًا ما يسمّى بأعياد الميلاد،"], [190.0, "وهي أن يخصّ كلُّ إنسانٍ يومَ مولده بشيءٍ من الاحتفال واجتماع الأقارب والأصحاب،"], [196.0, "ويتكرّر هذا الاجتماع في كلّ سنة؛"], [201.0, "فذلك من التخصيص المنهيّ عنه شرعًا."], [205.0, "وأيضًا ما يسمّونه بالاحتفال بيوم غدير خُمّ،"], [211.0, "وهذا عند الرافضة، أو ما يسمّونه بالاحتفال برأس القرن."]], "tr": [[185.0, "\"Doğum günleri\" denen şeyler de buna girer:"], [189.3, "Her insanın kendi doğum gününü bir kutlama, akrabaların ve arkadaşların toplanması ile tahsis etmesi ve bu toplantının her yıl tekrarlanmasıdır."], [201.0, "Bu, şer'an yasaklanmış tahsistendir. Yine \"Gadîr-i Hum günü kutlaması\" dedikleri şey —ki bu Râfıza'dadır— ya da \"yüzyılbaşı kutlaması\" dedikleri şey de (buna girer)."]]}, {"reader": false, "ar": [[216.0, "والخلاصة من ذلك: أنّ كلَّ من خصّ زمانيّةً بشيءٍ من الاحتفال أو الإحياء أو التعبّد أو الأذكار،"], [226.0, "فإننا نطالبه بالدليل الدالّ على ذلك؛"], [231.0, "فإن جاء به صحيحًا صريحًا قبلنا ذلك الإحياء،"], [234.0, "وتعبّدنا لله عز وجل به،"], [237.0, "وإن لم يأتِ به فإننا نصف هذا الإحياء بأنه من البدع،"], [242.0, "وأنّ فاعله مبتدع. والله أعلم."]], "tr": [[216.0, "Bundan çıkan sonuç şudur: Bir zamanı kutlama, ihya, taabbud ya da zikirlerden bir şeyle tahsis eden herkesten, buna delâlet eden delili getirmesini isteriz."], [231.0, "Onu sahih ve sarih olarak getirirse o ihyayı kabul eder ve onunla Allah Azze ve Celle'ye ibadet ederiz."], [237.8, "Getiremezse bu ihyayı bid'atlerden, yapanını da bid'atçi olarak niteleriz. Allah en iyisini bilir."]]}]}, {"ts": "04:05", "title": "2. Külliye: Şer'î delilin göstermediği bir mekânı ihya eden bid'atçidir", "paras": [{"reader": false, "ar": [[245.0, "الكلّيّة الثانية: <b>كلُّ من أحيا مكانًا لم يدلَّ على إحيائه دليلُ الشرع فمبتدع.<\/b> كلُّ من أحيا مكانًا،"], [258.9, "كلُّ من أحيا مكانًا لم يدلّ على إحيائه دليل الشرع فمبتدع."], [259.9, "كلُّ من أحيا مكانًا لم يدلّ عليه دليل الشرع فمبتدع."], [268.0, "وذلك لأنّ تعظيم المكانيّة لا نقبله ـ معاشرَ أهل السنة والجماعة ـ إلا بدليل الشرع؛"], [278.0, "لأنّ المتقرّر في القواعد أنّ الأصل استواءُ أجزاء الزمان في الفضل والتعبّد،"], [284.0, "إلا ما خصّه الدليل الشرعيّ الصحيح الصريح بشيءٍ خاصٍّ أو تعبّدٍ خاصّ."], [291.0, "والمتقرّر في القواعد أنّ التعبّدات بكلّ متعلَّقاتها (مبناها على) التوقيف،"], [299.0, "ومن جملة متعلَّقاتها: مكانُ التعبّد."]], "tr": [[245.0, "<b>2. külliye: Şer'î delilin ihyasına delâlet etmediği bir mekânı ihya eden herkes bid'atçidir.<\/b> Bir mekânı ihya eden herkes, şer'î delilin ihyasına delâlet etmediği bir mekânı ihya eden herkes bid'atçidir."], [259.3, "Şer'î delilin göstermediği bir mekânı ihya eden herkes bid'atçidir."], [259.9, "Bu şundandır: Biz Ehl-i Sünnet ve'l-Cemaat topluluğu, mekânın (bir mekân oluşu itibarıyla) tazim edilmesini ancak şer'î delille kabul ederiz."], [273.4, "Çünkü kaidelerde yerleşik olan şudur:"], [278.0, "Asıl olan, zaman (burada mekân kastediliyor olmalı) parçalarının fazilet ve taabbud bakımından eşit olmasıdır;"], [283.0, "ancak sahih ve sarih şer'î delilin özel bir şeyle ya da özel bir taabbudla tahsis ettiği müstesnadır."], [291.0, "Kaidelerde yerleşik olan şudur: Taabbudlar bütün taalluklarıyla tevkîfe dayanır;"], [296.1, "taabbudun mekânı da onun taalluklarındandır."]]}, {"reader": false, "ar": [[303.0, "فلا يجوز للإنسان أن يعمد إلى مكانٍ من أمكنة الأرض فيفرض عليه قدسيّةً،"], [309.5, "أو يحييه بشيءٍ من الاحتفال،"], [312.0, "أو الاجتماع، أو اللقاء،"], [314.0, "أو الصدقة، أو الذبح،"], [316.7, "أو الاعتكاف، إلا بدليلٍ يدلّ على ذلك."], [321.0, "وهذا من أوجه ما تُغلق به البدع."]], "tr": [[303.0, "Bu yüzden insanın, yeryüzündeki mekânlardan birine yönelip ona bir kutsiyet yüklemesi ya da onu bir kutlama, toplantı, buluşma, sadaka, kurban kesme veya itikâf ile ihya etmesi, buna delâlet eden bir delil olmadıkça caiz değildir."], [321.6, "Bu, bid'atlerin önünün kapatıldığı yollardandır."]]}, {"reader": false, "ar": [[325.0, "وبناءً على ذلك: فإحياء المكان الذي يزعم ـ أو يزعم الزاعم ـ أنه مكانٌ وُلد فيه النبيّ صلى الله عليه وسلم،"], [339.0, "فيخصّونه بشيءٍ من الأذكار أو الصلاة،"], [343.0, "هذا من البدع. وكذلك الصعود لغار حراء تعبّدًا لله عز وجل بهذا الصعود،"], [350.4, "أو الصلاة، أو الذكر في هذا المكان،"], [353.7, "أيضًا هذا من البدع."], [356.0, "وإننا لا نعلم بعد بعثة النبيّ صلى الله عليه وسلم أنه كان يصعد لهذا الجبل ويخصّه بشيءٍ من التعبّد،"], [364.0, "لا هو ولا أحدٌ من أصحابه،"], [367.3, "ولا نعلمه ثابتًا أيضًا عمّن يُقبل قوله ويُقتدى بأمره من سلف الأمة وأئمتها."]], "tr": [[325.0, "Buna göre: Nebî ﷺ'in doğduğu yer olduğu iddia edilen —ya da iddia edenin iddia ettiği— mekânı ihya etmek ve onu zikirlerden ya da namazdan bir şeyle tahsis etmek bid'atlerdendir."], [345.0, "Aynı şekilde bu çıkışla ya da o mekânda kılınan namaz veya yapılan zikirle Allah Azze ve Celle'ye ibadet etmek amacıyla Hira mağarasına çıkmak da bid'atlerdendir."], [356.0, "Nebî ﷺ'in, peygamber olarak gönderilmesinden sonra bu dağa çıktığını ve onu bir taabbudla tahsis ettiğini bilmiyoruz;"], [361.9, "ne onun ne de ashâbından herhangi birinin (bunu yaptığını biliyoruz)."], [366.8, "Sözü kabul edilen ve emrine uyulan ümmetin selefinden ve imamlarından da bunun sabit olduğunu bilmiyoruz."]]}, {"reader": false, "ar": [[375.0, "وكذلك إحياء غار ثور،"], [377.2, "وهو المكان الذي اختفى فيه النبيّ صلى الله عليه وسلم عن المشركين؛"], [384.0, "فإنّ من الناس من يعمد إلى الذهاب إلى هذا المكان ويخصّه بشيءٍ من الصلاة أو الذكر،"], [390.0, "أو أخذ شيءٍ من ترابه،"], [391.9, "وكلُّ ذلك من البدع التي ما أنزل الله بها من سلطان."]], "tr": [[375.0, "Sevr mağarasını ihya etmek de böyledir;"], [379.5, "orası Nebî ﷺ'in müşriklerden gizlendiği yerdir."], [384.0, "İnsanlardan bazıları bu mekâna gitmeye yönelir ve onu namazdan ya da zikirden bir şeyle veya toprağından bir şey almakla tahsis eder."], [392.6, "Bunların hepsi, Allah'ın hakkında hiçbir delil indirmediği bid'atlerdendir."]]}, {"reader": false, "ar": [[396.0, "وكذلك إحياء الأمكنة التي ثبت نزولُ النبيّ صلى الله عليه وسلم فيها في أسفاره أو غزواته،"], [406.0, "فيقال: هذا مكانٌ نام فيه رسول الله صلى الله عليه وسلم،"], [410.0, "وهذا مكانٌ صلّى فيه رسول الله صلى الله عليه وسلم،"], [415.0, "ويعمد كثيرٌ من الناس إلى هذه الأمكنة فيحييها بشيءٍ من التعبّدات؛"], [420.0, "وكلُّ ذلك من إحياء الأمكنة التي لم يدلّ على مشروعيّة إحيائها دليلٌ، دليلُ الشرع."]], "tr": [[396.0, "Nebî ﷺ'in yolculuklarında ya da gazvelerinde konakladığı sabit olan mekânları ihya etmek de böyledir."], [406.4, "\"Burası Resûlullah ﷺ'in uyuduğu yerdir, burası Resûlullah ﷺ'in namaz kıldığı yerdir\" denir ve insanların birçoğu bu mekânlara yönelip onları birtakım taabbudlarla ihya eder."], [418.6, "Bunların hepsi, ihyasının meşruluğuna bir delilin —şer'î delilin— delâlet etmediği mekânları ihya etmektendir."]]}, {"reader": false, "ar": [[427.0, "وكذلك الأمكنة التي نزل فيها الأنبياء،"], [431.3, "أو الأولياء والصالحون، فيخصّونها بشيءٍ من التعبّد،"], [436.3, "أو يبنون عليها شيئًا من المساجد أو المشاهد؛"], [441.0, "وكلُّ ذلك من البدع."], [443.0, "وكذلك أيضًا لا يُشرع شدُّ الرحال إلى جبل الطور للتعبّد عليه،"], [450.0, "زعمًا أنه مكانٌ يُشرع فيه شيءٌ من التعبّدات،"], [457.0, "وذلك لا نعلمه ثابتًا بدليل الشرع."]], "tr": [[427.0, "Peygamberlerin ya da velîlerin ve sâlihlerin konakladığı mekânlar da böyledir:"], [432.7, "Onları bir taabbudla tahsis ederler ya da üzerlerine mescitler veya meşhedler (türbeler) inşa ederler;"], [441.0, "bunların hepsi bid'atlerdendir. Yine aynı şekilde, içinde bir taabbudun meşru olduğu bir mekân olduğunu iddia ederek üzerinde ibadet etmek için Tûr dağına yolculuk etmek meşru değildir;"], [457.0, "bunun şer'î delille sabit olduğunu bilmiyoruz."]]}]}, {"ts": "07:40", "title": "2. Külliye (devam): Mekân bid'ati zaman bid'atinden daha tehlikelidir", "paras": [{"reader": false, "ar": [[460.0, "وأنت ترى في هاتين الكلّيّتين أننا نسدّ بابين عظيمين من أبواب البدع،"], [469.0, "وهي إحياء الأزمنة والأمكنة."], [471.0, "فإن قلت: وأيّهما أشدُّ خطرًا:"], [473.9, "بدعيّة إحياء الزمان ولّا بدعيّة إحياء المكان؟"], [478.0, "فنقول: أشدُّ خطرًا إحياءُ الأمكنة."], [482.0, "ويلخّص ذلك الإمام ابن تيمية رحمه الله تعالى في قوله:"], [488.0, "«تعظيمُ مكانٍ لم يعظّمه الشرع شرٌّ من تعظيم زمانٍ لم يعظّمه الشرع»."]], "tr": [[460.0, "Bu iki külliyede bid'at kapılarından iki büyük kapıyı, yani zamanların ve mekânların ihyasını kapattığımızı görüyorsun."], [471.0, "Şayet \"Hangisi daha tehlikelidir: zamanı ihya etmenin bid'at oluşu mu, yoksa mekânı ihya etmenin bid'at oluşu mu?\" dersen, deriz ki:"], [478.0, "Daha tehlikelisi mekânları ihya etmektir."], [482.0, "İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— bunu şu sözüyle özetler:"], [488.0, "\"Şeriatin tazim etmediği bir mekânı tazim etmek, şeriatin tazim etmediği bir zamanı tazim etmekten daha kötüdür.\""]]}, {"reader": false, "ar": [[498.0, "ثم علّل ذلك بقوله:"], [500.8, "«فإنّ تعظيم الأجسام ـ والمكانُ من الأجسام ـ فإنّ تعظيم الأجسام بالعبادة عندها أقربُ إلى عبادة الأوثان من تعظيم الزمان»."], [512.0, "فإنّ الزمانيّة عبارةٌ عن معنًى لا يُشَمّ ولا يُذاق ولا يُرى،"], [520.0, "فلا تتعلّق القلوب بتلك الزمانيّة تعلُّقَها بالشيء المرئيّ أو المحسوس؛"], [526.0, "فتعظيم الأمكنة يحصل عنده من البدع والطوامّ العقديّة ما لا يحصل في بدع الزمان."], [534.0, "وكلا الأمرين لا بدّ من سدّهما وإحكام إغلاقهما بهاتين الكلّيّتين. والله أعلم."]], "tr": [[498.0, "Sonra bunun gerekçesini şu sözüyle açıkladı:"], [500.8, "\"Çünkü cisimleri tazim etmek —mekân da cisimlerdendir—, cisimleri yanlarında ibadet ederek tazim etmek, putlara ibadete zamanı tazim etmekten daha yakındır.\" Çünkü zaman, koklanmayan, tadılmayan ve görülmeyen bir mânâdan ibarettir;"], [518.2, "kalpler o zamana, görülen ya da duyularla algılanan şeye bağlandıkları gibi bağlanmaz."], [526.0, "Mekânları tazim etmenin yanında, zaman bid'atlerinde meydana gelmeyen bid'atler ve akîdevî felaketler meydana gelir."], [532.3, "Her iki şeyin de bu iki külliye ile kapatılması ve sıkıca kilitlenmesi gerekir. Allah en iyisini bilir."]]}]}, {"ts": "09:01", "title": "3. Külliye: Bid'atin şerri büyüdükçe günahı ve cezası da büyür", "paras": [{"reader": false, "ar": [[541.0, "ومن الكلّيّات أيضًا: <b>كلّما عظُم شرُّ البدعة عظُمت حرمتُها ـ عظُم إثمُها وعقوبتُها.<\/b> كلّما عظُم شرُّ البدعة عظُم إثمُها وعقوباتُها."], [562.0, "أُعيدها مرةً أخرى: كلّما عظُم شرُّ البدعة عظُم إثمُها وعقوباتُها."], [572.0, "وهذه الكلّيّة تجيب عن سؤال:"], [575.6, "هل البدع تتفاوت؟ الجواب:"], [579.8, "نعم، تتفاوت بتفاوت شرّها ومفسدتها؛"], [585.0, "فكلّما عظُم شرُّ البدعة وعظُمت مفسدتُها صارت أشدَّ تحريمًا،"], [590.8, "وأعظمَ، وأدخلَ في باب العقوبات."]], "tr": [[541.0, "Külliyelerden biri de şudur: 3."], [543.0, "külliye: Bid'atin şerri büyüdükçe haramlığı —(yani) günahı ve cezası— büyür. Bid'atin şerri büyüdükçe günahı ve cezaları büyür."], [562.0, "Bir kez daha tekrarlıyorum: Bid'atin şerri büyüdükçe günahı ve cezaları büyür."], [572.0, "Bu külliye \"Bid'atler birbirinden farklı derecede midir?\" sorusuna cevap verir."], [579.0, "Cevap: Evet, şerlerinin ve mefsedetlerinin farklılığı ölçüsünde farklılaşırlar."], [585.0, "Bid'atin şerri büyüdükçe ve mefsedeti arttıkça haramlığı daha şiddetli, daha büyük ve cezalar babına daha çok giren bir hâl alır."]]}]}, {"ts": "09:54", "title": "3. Külliye (devam): Bid'atlerin şer bakımından farklılaşma yönleri", "paras": [{"reader": false, "ar": [[594.0, "فإن قلت: وما أوجهُ تفاوت البدع في الشرّ؟"], [600.0, "فأقول: ذلك يرجع إلى أشياء كثيرة:"], [604.0, "فيرجع إلى كونها مكفِّرةً أو مفسِّقة؛"], [608.0, "فإنّ شرَّ البدعة المكفِّرة أعظم،"], [610.5, "وعقوبتَها أطمّ، من البدعة المفسِّقة."], [613.0, "ويرجع ذلك إلى كونها في مسائل الاعتقاد والتوحيد،"], [618.4, "أو في مسائل التعبّدات والأعمال؛"], [624.0, "فإنّ بدع العقائد والتوحيد أعظمُ شرًّا،"], [628.1, "وأعظمُ عقوبةً ومفسدةً، من بدع التعبّدات والأعمال."]], "tr": [[594.0, "Şayet \"Bid'atlerin şer bakımından farklılaşma yönleri nelerdir?\" dersen, derim ki:"], [600.0, "Bu pek çok şeye döner."], [602.0, "Onun tekfir edici ya da tefsik edici (fâsıklığa götüren) olmasına döner;"], [608.0, "tekfir edici bid'atin şerri, tefsik edici bid'atten daha büyük, cezası daha ağırdır."], [613.0, "Onun itikad ve tevhid meselelerinde mi, yoksa taabbudlar ve ameller meselelerinde mi olduğuna döner;"], [620.4, "akîde ve tevhid bid'atleri, taabbudlar ve ameller bid'atlerinden şer bakımından daha büyük, ceza ve mefsedet bakımından daha büyüktür."]]}, {"reader": false, "ar": [[634.0, "ويرجع ذلك أيضًا إلى كونها بدعًا حقيقيّةً ذاتيّة،"], [638.7, "أو بدعًا وصفيّةً إضافيّة؛"], [641.0, "فإنّ البدع الذاتيّة الحقيقيّة الأصليّة أعظمُ شرًّا من البدع التي أصلها مشروعٌ ولكنّ وصفها ممنوع."], [653.0, "وقد ذكرتُ لكم سابقًا بأنّ البدع تنقسم إلى بدعٍ أصليّةٍ وإلى بدعٍ إضافيّة،"], [661.0, "فالبدع الأصليّة أشرُّ وأطمُّ وأعظمُ مفسدةً من البدع الإضافيّة."]], "tr": [[634.0, "Bu, onların hakikî-zâtî bid'atler mi, yoksa vasfî-izâfî bid'atler mi olduğuna da döner."], [641.0, "Zâtî, hakikî ve aslî bid'atler, aslı meşru olup vasfı yasak olan bid'atlerden şer bakımından daha büyüktür."], [653.0, "Daha önce size bid'atlerin aslî bid'atler ve izâfî bid'atler olarak ikiye ayrıldığını zikretmiştim;"], [659.8, "aslî bid'atler izâfî bid'atlerden daha şerli, daha ağır ve mefsedet bakımından daha büyüktür."]]}, {"reader": false, "ar": [[668.0, "ويرجع ذلك أيضًا إلى كون فاعلها:"], [673.0, "هل يدعو إليها أو مستترًا بها؛"], [677.0, "فإن كان من الدعاة إليها فلا جرم أنّ البدعة التي يُدعى الناس إليها أشرُّ وأعظمُ مفسدةً من البدع التي يستتر بها صاحبها ولا يدعو إليها."], [689.0, "ويرجع ذلك أيضًا إلى قضيّة الإصرار من عدمه؛"], [695.0, "فلا جرم أنّ البدعة التي يُصرّ عليها صاحبها أعظمُ شرًّا وأعظمُ مفسدةً من البدعة التي لا يُصرّ عليها صاحبها."]], "tr": [[668.0, "Bu, onu yapanın ona davet edip etmediğine ya da onu gizleyip gizlemediğine de döner."], [677.0, "Eğer ona davet edenlerdense, şüphesiz insanların davet edildiği bid'at, sahibinin gizlediği ve davet etmediği bid'atlerden daha şerli ve mefsedet bakımından daha büyüktür."], [689.0, "Bu, ısrar edilip edilmemesi meselesine de döner;"], [695.0, "şüphesiz sahibinin ısrar ettiği bid'at, sahibinin ısrar etmediği bid'atten şer bakımından daha büyük ve mefsedet bakımından daha büyüktür."]]}, {"reader": false, "ar": [[706.0, "ويرجع ذلك أيضًا إلى اتّضاح الدليل في كونها بدعة؛"], [711.0, "فإنّ من البدع ما بدعيّتُه بيّنةٌ قطعيّةٌ واضحة،"], [717.0, "متّفقٌ عليها بين أهل العلم،"], [721.0, "وهناك من البدع ما بدعيّتُه مختلفٌ فيها؛"], [726.0, "فهناك بدعةٌ بيّنة، وهناك بدعةٌ مشكلةٌ أو متشابهة."], [733.0, "فلا جرم أنّ البدعة البيّنة الواضحة في بدعيّتها أعظمُ شرًّا،"], [739.2, "وأكبرُ خطرًا، وأشدُّ مفسدةً من البدعة التي وقع فيها شيءٌ من خلاف أهل العلم."]], "tr": [[706.0, "Bu, onun bid'at olduğuna dair delilin açıklığına da döner."], [711.0, "Bid'atlerin bir kısmının bid'at oluşu apaçık, kesin ve nettir;"], [717.0, "ilim ehli arasında üzerinde ittifak edilmiştir."], [721.0, "Bid'atlerin bir kısmının bid'at oluşu ise ihtilaflıdır."], [726.0, "Apaçık bid'at vardır, müşkil ya da müteşâbih bid'at vardır."], [733.0, "Şüphesiz bid'at oluşu apaçık ve net olan bid'at, hakkında ilim ehlinin bir miktar ihtilafı bulunan bid'atten şer bakımından daha büyük, tehlike bakımından daha büyük ve mefsedet bakımından daha şiddetlidir."]]}, {"reader": false, "ar": [[748.0, "ويرجع ذلك إلى كونها في واجبٍ أو مندوب؛"], [753.0, "فإنّ إفساد الواجبات بالبدع أعظمُ من دخول البدع على المندوبات."], [760.0, "فإنّ دخول البدعة على التعبّد يُفسده؛"], [764.0, "فإذا دخلت على واجبٍ أفسدت شيئًا يتعلّق به العقوبة،"], [770.0, "وأمّا إذا دخلت على مندوبٍ فإنها وإن أفسدته،"], [775.0, "لكنها أفسدت شيئًا لا يتعلّق به العقوبة باعتبار كونه مندوبًا."], [781.0, "فالبدع التي تدخل على الواجبات أعظمُ خطرًا وأشدُّ مفسدةً من البدع التي تدخل على الأمر المندوب."]], "tr": [[748.0, "Bu, onun bir vacipte mi, yoksa bir mendupta mı olduğuna da döner."], [754.4, "Vacipleri bid'atlerle bozmak, bid'atlerin menduplara girmesinden daha büyüktür."], [760.0, "Çünkü bid'atin bir taabbuda girmesi onu bozar."], [764.0, "Bir vacibe girdiğinde, kendisiyle cezanın taalluk ettiği bir şeyi bozmuş olur."], [770.6, "Bir mendupa girdiğinde ise onu bozsa da mendup oluşu itibarıyla kendisiyle cezanın taalluk etmediği bir şeyi bozmuş olur."], [781.0, "Vaciplere giren bid'atler, mendup olan işe giren bid'atlerden tehlike bakımından daha büyük ve mefsedet bakımından daha şiddetlidir."]]}, {"reader": false, "ar": [[792.0, "وكذلك كونها بدعةً زمانيّةً أو مكانيّة؛"], [797.0, "فإنّ البدعة المكانيّة أشدُّ خطرًا وإثمًا ومفسدةً من البدع الزمانيّة."], [809.0, "وأيضًا يتفاوت شرُّها باعتبار كون فاعلها مجتهدًا أو مقلِّدًا؛"], [817.0, "فلا جرم أنّ البدعة إذا تولّاها المجتهد الذي يُقتدى به،"], [822.0, "فإنها أعظمُ انتشارًا من البدعة التي يتولّاها المقلِّد،"], [827.8, "ممّن ليس من شأنه أن يُقتدى به."]], "tr": [[792.0, "Onun zamana ya da mekâna dair bir bid'at olması da böyledir;"], [797.0, "mekân bid'ati, zaman bid'atlerinden tehlike, günah ve mefsedet bakımından daha şiddetlidir."], [809.0, "Yine bid'atin şerri, onu yapanın müctehid ya da mukallid olması itibarıyla farklılaşır."], [818.5, "Şüphesiz bir bid'ati kendisine uyulan bir müctehid üstlendiğinde, kendisine uyulması âdet olmayan bir mukallidin üstlendiği bid'atten çok daha fazla yayılır."]]}, {"reader": false, "ar": [[832.0, "ولذلك زلّةُ العالم ممّا يهدم الدين،"], [836.0, "ومن الزلّة لبعض العلماء المجتهدين وقوعُه في شيءٍ من هذه البدع،"], [842.0, "نسأل الله السلامة والعافية؛"], [843.0, "فإنّ مجرّد فعل العالم لها يُجعل دليلًا على مشروعيّتها،"], [851.0, "ويُحتجّ بها على من أنكرها،"], [856.0, "أو يُحتجّ بفعله على من أنكرها،"], [859.0, "فيقول الناس: لو كانت بدعةً لما فعلها العالم الفلانيّ، أو العالم الفلانيّ."]], "tr": [[832.0, "Bu yüzden âlimin zellesi (sürçmesi) dini yıkan şeylerdendir."], [836.5, "Bazı müctehid âlimlerin zellelerinden biri de bu bid'atlerden birine düşmesidir;"], [841.5, "Allah'tan selamet ve âfiyet dileriz."], [843.0, "Çünkü âlimin sırf onu yapması, onun meşruluğuna delil kılınır ve onu inkâr edene karşı onunla —ya da onun fiiliyle— delil getirilir."], [858.5, "İnsanlar \"Eğer bid'at olsaydı falanca âlim ya da falanca âlim onu yapmazdı\" derler."]]}, {"reader": false, "ar": [[867.0, "وهكذا دواليك، بارك الله فيكم."], [869.0, "فالبدعة ليست على مستوًى واحد،"], [875.0, "وإنما تتفاوت في شرّها،"], [879.0, "وتتفاوت في خطرها، وتتفاوت في مفسدتها،"], [882.0, "على حسب هذا الذي ذكرتُ لك تفصيله. والله أعلم."]], "tr": [[867.0, "Bu böyle devam eder; Allah sizi mübarek kılsın."], [869.0, "Bid'at tek bir seviyede değildir;"], [875.0, "bilakis sana tafsilatını zikrettiğim bu hususlara göre şerrinde farklılaşır, tehlikesinde farklılaşır ve mefsedetinde farklılaşır. Allah en iyisini bilir."]]}]}, {"ts": "14:47", "title": "4. Külliye: Şer'î delilden soyutlanmış istihsana dayanan her taabbud bid'attir", "paras": [{"reader": false, "ar": [[887.0, "ومن الكلّيّات أيضًا: <b>كلُّ تعبّدٍ بُني على استحسانٍ مجرّدٍ عن دليل الشرع فبدعة.<\/b> كلُّ تعبّدٍ بُني على استحسانٍ مجرّدٍ عن دليل الشرع فبدعة."], [906.9, "أُعيدها مرةً ثالثة: كلُّ تعبّدٍ بُني على استحسانٍ مجرّدٍ عن دليل الشرع فبدعة."]], "tr": [[887.0, "Külliyelerden biri de şudur: 4."], [889.0, "külliye: Şer'î delilden soyutlanmış bir istihsan (güzel görme) üzerine bina edilen her taabbud bid'attir. Şer'î delilden soyutlanmış bir istihsan üzerine bina edilen her taabbud bid'attir."], [906.9, "Üçüncü kez tekrarlıyorum: Şer'î delilden soyutlanmış bir istihsan üzerine bina edilen her taabbud bid'attir."]]}, {"reader": false, "ar": [[923.0, "وذلك لأنّ المتقرّر في قواعد أهل السنة والجماعة:"], [928.0, "ألّا مدخلَ للاستحسان استقلالًا في باب التشريع،"], [932.0, "ولا يُعتبر الاستحسان من جملة أدلة الشرع التي يركن المجتهد إليها في تقرير الأحكام ابتداءً."], [940.0, "وانتبهوا لما أقول: «في تقرير الأحكام ابتداءً»."], [947.0, "ولكننا نقبل ـ معاشرَ الأصوليّين ـ الاستحسانَ فيما أصلُه مشروعٌ ما لم يخالف دليل الشرع،"], [958.0, "ولكننا نتكلّم عن أهل البدع واستحساناتهم."]], "tr": [[923.0, "Bu şundandır: Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşik olan şudur:"], [928.0, "İstihsanın teşrî babında müstakil olarak bir yeri yoktur."], [933.7, "İstihsan, müctehidin hükümleri ilk baştan (ibtidâen) belirlemede dayandığı şer'î deliller arasında sayılmaz."], [942.2, "Söylediğime dikkat edin: \"Hükümleri ilk baştan belirlemede.\" Fakat biz usûlcüler topluluğu, aslı meşru olan şeylerde, şer'î delile aykırı olmadığı sürece istihsanı kabul ederiz."], [958.0, "Fakat biz bid'at ehlinden ve onların istihsanlarından bahsediyoruz."]]}, {"reader": false, "ar": [[963.0, "فإنه ما وقع مبتدعٌ في بدعةٍ إلا ولا بدّ أن يكون سببُ وقوعه فيها الاستحسان."], [971.0, "فهم يستحسنون إحياء بعض الليالي فيحيونها بمجرّد استحسانهم،"], [977.0, "ويستحسنون بعض الألفاظ في الصلاة على النبيّ صلى الله عليه وسلم ممّا قد يدخله عظيمُ الغلوّ في ذاته أو صفاته،"], [988.0, "ولكن لمجرّد استحسان قلوبهم لتلك الألفاظ،"], [992.2, "وجريانها على هوى نفوسهم،"], [996.0, "جعلوها مشروعةً وحاربوا من ينكرها عليهم."]], "tr": [[963.0, "Çünkü hiçbir bid'atçi bir bid'ate düşmemiştir ki düşmesinin sebebi istihsan olmasın."], [971.0, "Onlar bazı geceleri ihya etmeyi güzel görürler ve sırf güzel gördükleri için onları ihya ederler."], [979.2, "Nebî ﷺ'e salavatta, onun zâtı ya da sıfatları hakkında büyük bir aşırılık girebilen bazı lafızları güzel görürler;"], [986.9, "fakat sırf kalpleri o lafızları güzel gördüğü ve nefislerinin arzusuna uygun düştüğü için onları meşru kılarlar ve onları inkâr edene savaş açarlar."]]}, {"reader": false, "ar": [[1001.0, "وكذلك تعظيمُ بعض الأمكنة إنما مبدؤه استحسانُ النفوس لهذا التعظيم،"], [1009.0, "أو كثيرٌ من البدع التي يفعلها أهلها من صلاةٍ في مكانٍ أو زمان،"], [1017.0, "أو صيامٍ في مكانٍ أو زمان،"], [1020.0, "أو صدقةٍ في مكانٍ أو زمان،"], [1023.0, "يعتقدون فضيلةَ هذه التعبّدات فيه بخصوصه؛"], [1027.0, "إنما يرجع ذلك إلى الاستحسان."]], "tr": [[1001.0, "Aynı şekilde bazı mekânları tazim etmenin başlangıcı da nefislerin bu tazimi güzel görmesidir."], [1009.0, "Ya da ehlinin yaptığı birçok bid'at —bir mekânda ya da zamanda namaz, bir mekânda ya da zamanda oruç, bir mekânda ya da zamanda sadaka gibi—, ki bu taabbudların özellikle o (mekân veya zaman)da faziletli olduğuna inanırlar;"], [1027.0, "bu da ancak istihsana döner."]]}, {"reader": false, "ar": [[1031.0, "ولذلك لله درُّ الشافعيّ رحمه الله تعالى لمّا قال:"], [1036.0, "«من استحسن فقد شرّع»،"], [1038.0, "«من استحسن فقد شرّع»؛"], [1042.0, "ويقصد ذلك الاستحسانَ الذي لا يستند إلى دليلٍ،"], [1046.0, "إلى دليل الشرع. وأمّا الاستحسان الذي يستند إلى دليل الشرع وإلى مقاصد التشريع،"], [1054.4, "فإنّ ذلك استحسانٌ يتكلّم عنه الفقهاء والأصوليّون،"], [1058.9, "ويضبطونه بضوابط معروفةٍ في كتب الأصول."]], "tr": [[1031.0, "Bu yüzden Şâfiî'ye —Allah Teâlâ ona rahmet etsin— aferin olsun!"], [1036.0, "Şöyle demiştir: \"İstihsan eden, şeriat koymuş olur.\" \"İstihsan eden, şeriat koymuş olur.\" Bununla bir delile, şer'î delile dayanmayan istihsanı kastediyor."], [1048.0, "Şer'î delile ve teşrîin maksatlarına dayanan istihsana gelince, bu, fakihlerin ve usûlcülerin hakkında konuştuğu ve usûl kitaplarında bilinen zâbıtlarla sınırlarını çizdiği bir istihsandır."]]}, {"reader": false, "ar": [[1065.0, "ولكننا نتكلّم عن ذلك الاستحسان الذي يجعله صاحبه دليلًا مستقلًّا،"], [1071.6, "وعمدةً في إيجاب ما ليس بواجب،"], [1078.0, "أو ندبِ ما ليس بمندوب،"], [1081.5, "أو تحريمِ ما ليس بمحرّم؛"], [1085.0, "فهذا الاستحسان بهذا الاعتبار من البدع."], [1088.0, "ولو سددنا باب الاستحسان على أهل البدع لتساقطت بدعُهم كلُّها."]], "tr": [[1065.0, "Fakat biz, sahibinin müstakil bir delil yaptığı;"], [1069.6, "vacip olmayanı vacip, mendup olmayanı mendup ya da haram olmayanı haram kılmada dayanak edindiği o istihsandan bahsediyoruz."], [1085.0, "Bu itibarla bu istihsan bid'atlerdendir."], [1088.0, "Bid'at ehline istihsan kapısını kapatsaydık, bid'atlerinin hepsi dökülüp giderdi."]]}]}, {"ts": "18:17", "title": "4. Külliye (devam): İsim ve sıfatlarda istihsanla tahrif", "paras": [{"reader": false, "ar": [[1097.0, "بل إنّ كثيرًا من أهل البدع في باب صفات الله عز وجل وأسمائه إنما يحرّفونها استحسانًا؛"], [1105.0, "لأنّ نفوسهم لا تستحسن وصفَ الله عز وجل بما هو جارحة،"], [1111.0, "أو لا يصفون الله عز وجل بما لا تستحسنه نفوسهم،"], [1119.0, "بأنه يدخل في حلول الحوادث في ذات الله عز وجل."], [1124.0, "فهم يستحسنون الشيء ويجعلونه أصلًا،"], [1127.0, "ثم يفرّعون عليه أدلة الشرع؛"], [1130.0, "فما وافق استحسانَهم قبلوه،"], [1134.0, "وما خالف استحسانَهم ردّوه واتّهموه،"], [1137.1, "أو حرّفوه وعطّلوه، وأخرجوه عن دلالاته الصحيحة."], [1142.0, "فهذا هو الذي يرفضه أهل السنة والجماعة."]], "tr": [[1097.0, "Hatta Allah Azze ve Celle'nin sıfatları ve isimleri babında bid'at ehlinin birçoğu onları ancak istihsan yoluyla tahrif eder."], [1105.0, "Çünkü nefisleri Allah Azze ve Celle'yi uzuv (câriha) olan bir şeyle nitelemeyi güzel görmez;"], [1111.0, "ya da nefislerinin güzel görmediği bir şeyi, Allah Azze ve Celle'nin zâtında havâdisin hulûlüne gireceğini (öne sürerek) Allah Azze ve Celle'ye nispet etmezler."], [1124.0, "Onlar bir şeyi güzel görüp onu asıl yaparlar, sonra şer'î delilleri onun üzerine bina ederler."], [1130.0, "İstihsanlarına uyanı kabul ederler; istihsanlarına aykırı olanı ise reddeder ve itham ederler, ya da tahrif ve ta'til ederler ve onu sahih delâletlerinin dışına çıkarırlar."], [1143.4, "İşte Ehl-i Sünnet ve'l-Cemaat'in reddettiği budur."]]}, {"reader": false, "ar": [[1147.0, "فلو أنك سألت كثيرًا من (أهل) البدع عن كثيرٍ من بدعهم التي يفعلونها،"], [1152.0, "لكان أعظمُ كلامهم يرجع إلى دائرة الاستحسان:"], [1157.0, "وأنه أمرٌ طيّب، وأنه تعظيمٌ لرسول الله صلى الله عليه وسلم،"], [1162.0, "وأنه تقرّبٌ وتعبّدٌ لله عز وجل،"], [1165.0, "وأنه ملءُ وقتٍ وفراغٍ بما يعود على الإنسان نفعُه؛"], [1170.0, "وكلُّ ذلك من باب الاستحسان الذي ليس مبنيًّا على دليل الشرع."], [1176.0, "فلو أننا سددنا باب الاستحسان المجرّد عن دليل الشرع لتساقط كثيرٌ من البدع التي ما أنزل الله بها من سلطان."]], "tr": [[1147.0, "Bid'at ehlinin birçoğuna yaptıkları bid'atlerin birçoğunu sorsan, sözlerinin çoğu istihsan dairesine döner:"], [1157.0, "\"Bu güzel bir şeydir, Resûlullah ﷺ'e tazimdir, Allah Azze ve Celle'ye yakınlaşma ve ibadettir, vakti ve boşluğu insana faydası dönen bir şeyle doldurmaktır.\" Bunların hepsi şer'î delile dayanmayan istihsan kabîlindendir."], [1176.0, "Şer'î delilden soyutlanmış istihsan kapısını kapatsaydık, Allah'ın hakkında hiçbir delil indirmediği bid'atlerin birçoğu dökülüp giderdi."]]}]}, {"ts": "19:46", "title": "5. Külliye: Rüya ve düşlere dayanan her taabbud bid'attir", "paras": [{"reader": false, "ar": [[1186.0, "ومن الكلّيّات أيضًا: <b>كلُّ تعبّدٍ بُني على الرؤى والأحلام فبدعة.<\/b> <span class=\"note\">(يكررها)<\/span> وذلك لأنّ المتقرّر في قواعد أهل السنة والجماعة أنه لا مدخلَ للرؤى والأحلام في باب التشريع؛"], [1225.0, "فالرؤى لا تُحِلّ حرامًا بالإجماع،"], [1230.0, "ولا تحرّم حلالًا بالإجماع،"], [1232.0, "ولا تشرّع ما ليس بشرعٍ إجماعًا،"], [1237.0, "ولا تنقض ما هو مشروعٌ إجماعًا،"], [1241.0, "ولا تغيّر شيئًا من الدين البتّة؛"], [1244.0, "فلا تُدخل في الدين ما ليس منه،"], [1248.0, "ولا تُخرج منه ما هو منه."], [1253.0, "ولا نعلم في ذلك خلافًا بين أهل العلم رحمهم الله تعالى."]], "tr": [[1186.0, "Külliyelerden biri de şudur: 5."], [1188.1, "külliye: Rüyalar ve düşler üzerine bina edilen her taabbud bid'attir. Bu şundandır:"], [1199.5, "Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşik olan şudur:"], [1221.0, "Rüyaların ve düşlerin teşrî babında hiçbir yeri yoktur."], [1225.0, "Rüyalar icmâen bir haramı helal kılmaz, icmâen bir helali haram kılmaz, icmâen şeriat olmayanı şeriat kılmaz, icmâen meşru olanı bozmaz ve dinden hiçbir şeyi asla değiştirmez;"], [1244.0, "dinde ondan olmayanı dine sokmaz, dinden olanı da dinden çıkarmaz."], [1253.0, "Bu hususta ilim ehli —Allah onlara rahmet etsin— arasında bir ihtilaf bilmiyoruz."]]}, {"reader": false, "ar": [[1257.0, "فإن قلت: وهل أنت تتكلّم في هذه الكلّيّة على كلّ الرؤى؟"], [1262.0, "الجواب: نتكلّم على جميع الرؤى إلا رؤى الأنبياء؛"], [1269.0, "فإنّ رؤيا الأنبياء يؤخذ منها تشريعٌ إذا أقرّها النبيّ."]], "tr": [[1257.0, "Şayet \"Bu külliyede bütün rüyalardan mı bahsediyorsun?\" dersen, cevap:"], [1262.0, "Peygamberlerin rüyaları dışındaki bütün rüyalardan bahsediyoruz."], [1266.3, "Çünkü peygamberlerin rüyasından, peygamber onu onayladığında teşrî (hüküm) alınır."]]}, {"reader": false, "ar": [[1278.0, "قال الإمام ابن تيمية رحمه الله تعالى:"], [1285.0, "«الإسرائيليّات والمنامات لا يجوز أن يثبت بها حكمٌ شرعيّ، لا استحبابٌ ولا غيره»."], [1297.0, "انتهى كلامه. وقال الإمام الشاطبيّ رحمه الله تعالى:"], [1305.0, "«وأضعفُ هؤلاء احتجاجًا قومٌ استندوا في أخذ الأعمال والعبادات من المنامات، وأقبلوا وأعرضوا بسببها» ـ أي:"], [1322.3, "يُقبلون على الشيء بسبب منام،"], [1324.0, "أو يُعرضون عن الشيء بسبب منام ـ «فيقولون: رأينا فلانًا الرجلَ الصالح، فقال لنا: اتركوا كذا، واعملوا كذا."]], "tr": [[1278.0, "İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1280.2, "\"İsrâiliyyât ve rüyalarla şer'î bir hüküm sabit olması caiz değildir;"], [1285.0, "ne müstehaplık ne de başka bir hüküm.\" Sözü burada bitti."], [1289.1, "İmam Şâtıbî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1297.0, "\"Bunların delil getirme bakımından en zayıfı, amelleri ve ibadetleri almada rüyalara dayanan ve onlar sebebiyle (bir şeye) yönelip (bir şeyden) yüz çeviren bir topluluktur.\" —Yani bir rüya sebebiyle bir şeye yönelirler ya da bir rüya sebebiyle bir şeyden yüz çevirirler.— \"Derler ki:"], [1322.3, "'Sâlih adam falancayı (rüyamızda) gördük, bize:"], [1330.8, "Şunu bırakın, şunu yapın, dedi.'"]]}, {"reader": false, "ar": [[1339.0, "ويتّفق مثلُ هذا كثيرًا للمترسّمين برسم التصوّف،"], [1346.0, "وربما قال بعضهم: رأيتُ النبيّ صلى الله عليه وسلم في النوم فقال لي:"], [1355.7, "افعل كذا، وأمرني بكذا»."], [1358.0, "إلى أن قال الشاطبيّ رحمه الله:"], [1361.5, "«وهو خطأ؛ لأنّ الرؤيا من غير الأنبياء لا يُحكم بها شرعًا على حال، إلا أن تُعرض على ما عندنا من الأحكام الشرعية؛ فإن سوّغتها عُمل بمقتضاها، وإلا وجب تركُها والإعراضُ عنها»."], [1380.1, "انتهى كلامه رحمه الله تعالى."]], "tr": [[1339.0, "Bunun benzeri, tasavvuf kisvesine bürünenlerin başına çokça gelir."], [1342.7, "Bazen içlerinden biri 'Nebî ﷺ'i uykuda gördüm;"], [1350.0, "bana şunu yap dedi ve bana şunu emretti' der.\" Şâtıbî —Allah ona rahmet etsin— sözünü şöyle sürdürür:"], [1355.7, "\"Bu bir hatadır; çünkü peygamberler dışındakilerin rüyasıyla hiçbir durumda şer'an hüküm verilmez;"], [1361.5, "ancak bizdeki şer'î hükümlere arz edilir."], [1364.9, "Eğer onlar ona cevaz verirse gereğiyle amel edilir;"], [1370.3, "aksi hâlde onu terk etmek ve ondan yüz çevirmek vacip olur.\" Sözü burada bitti;"], [1380.1, "Allah Teâlâ ona rahmet etsin."]]}, {"reader": false, "ar": [[1383.0, "وهذا يكثر في الصوفيّة كما قرّره الشاطبيّ رحمه الله:"], [1389.0, "فيرى أحدُهم وليًّا أتاه في المنام فقال:"], [1392.5, "إنه دُفن في هذه البقعة نبيٌّ من الأنبياء،"], [1396.5, "فيصبح يُخبر الناس، ويضعون مشهدًا،"], [1399.0, "ويطوفون عنده، ويدعونه، ويستغيثون به من دون الله عز وجل."]], "tr": [[1383.0, "Şâtıbî'nin —Allah ona rahmet etsin— takrir ettiği gibi bu, sûfîlerde çokça görülür:"], [1389.0, "İçlerinden biri rüyasında kendisine bir velînin geldiğini ve \"Bu yere peygamberlerden bir peygamber defnedildi\" dediğini görür."], [1392.5, "Sabah olunca insanlara haber verir;"], [1394.5, "onlar da (oraya) bir meşhed kurarlar, onun etrafında tavaf ederler, Allah Azze ve Celle'yi bırakıp ona dua ederler ve ondan yardım dilerler."]]}, {"reader": false, "ar": [[1407.0, "فإن قلت: أوَلم يُثبت الدليلُ الشرعيّ أنّ الرؤى جزءٌ من ستٍّ وأربعين جزءًا من النبوّة؟"], [1417.0, "فنقول: بلى، ولكن ليس في تقرير الأحكام وإثباتها،"], [1422.5, "وإنما للاستئناس بها. فالرؤى يُستأنس بها ولا يُستند إليها؛"], [1430.3, "ففرقٌ بين الاستئناس والاستناد والاعتماد."], [1436.0, "ولذلك فقد اتّفق أهل العلم رحمهم الله تعالى على أنّ الرؤى لا تصلح في باب الحجج،"], [1446.0, "وإنما هي تبشيرٌ وتنبيه،"], [1448.8, "وتصلح للاستئناس بها. والله أعلم."]], "tr": [[1407.0, "Şayet \"Şer'î delil, rüyaların nübüvvetin kırk altı cüzünden bir cüz olduğunu ispat etmemiş midir?\" dersen, deriz ki:"], [1417.0, "Evet, (ispat etmiştir); fakat hükümleri belirlemede ve ispatta değil, sadece onlarla gönül ünsiyeti (destek) bulmak için."], [1425.0, "Rüyalarla ünsiyet bulunur, onlara dayanılmaz."], [1427.3, "Ünsiyet bulmak ile dayanmak ve itimat etmek arasında fark vardır."], [1436.0, "Bu yüzden ilim ehli —Allah onlara rahmet etsin— rüyaların deliller babında geçerli olmadığında ittifak etmiştir;"], [1444.1, "onlar sadece müjde ve uyarıdır, onlarla ünsiyet bulmaya elverişlidir. Allah en iyisini bilir."]]}]}, {"ts": "24:16", "title": "6. Külliye: Şer'î delilden soyutlanmış akla dayanan her taabbud bid'attir", "paras": [{"reader": false, "ar": [[1456.0, "ومن الكلّيّات أيضًا: <b>كلُّ تعبّدٍ بُني على العقل المجرّد عن دليل الشرع فبدعة.<\/b> كلُّ تعبّدٍ بُني على العقل المجرّد عن دليل الشرع فبدعة."], [1474.2, "<span class=\"note\">(يكررها)<\/span> وهذه الكلّيّة قد تكلّمنا عليها كثيرًا إذ تكلّمنا عن العلاقة بين العقل والتشريع،"], [1489.0, "وهي من الكلّيّات المتّفق عليها بين أهل الإسلام،"], [1494.0, "حتى المعتزلة الذين يؤلّهون العقل ويجعلونه حاكمًا؛"], [1501.0, "فإنّ حقيقة مذهبهم أنّ العقل كاشفٌ لا منشئ،"], [1507.0, "بمعنى أنّ عنده الغريزةَ لاكتشاف الحكم الشرعيّ،"], [1515.0, "ولكنهم يتّفقون معنا على أنه لا حقَّ له في إنشاء الأحكام الشرعية."], [1523.0, "فالعقل ليس من مصادر التشريع بالإجماع."]], "tr": [[1456.0, "Külliyelerden biri de şudur: 6."], [1457.6, "külliye: Şer'î delilden soyutlanmış akıl üzerine bina edilen her taabbud bid'attir. Şer'î delilden soyutlanmış akıl üzerine bina edilen her taabbud bid'attir."], [1465.1, "Bu külliye hakkında, akıl ile teşrî arasındaki ilişkiden bahsettiğimizde çokça konuştuk."], [1474.2, "Bu, İslam ehli arasında üzerinde ittifak edilen külliyelerdendir;"], [1485.1, "aklı ilâhlaştıran ve onu hâkim kılan Mu'tezile bile (buna katılır)."], [1494.0, "Çünkü onların mezhebinin hakikati şudur:"], [1501.0, "Akıl (hükmü) ortaya çıkarandır, inşa eden değildir;"], [1506.1, "yani onda şer'î hükmü keşfetmeye yönelik bir yeti vardır."], [1515.7, "Fakat şer'î hükümleri inşa etmeye hakkı olmadığı konusunda bizimle ittifak ederler."], [1523.0, "Akıl, icmâ ile teşrîin kaynaklarından değildir."]]}, {"reader": false, "ar": [[1528.0, "وأنت ترى أنّ كثيرًا من الفلاسفة وأتباعهم من الجهميّة،"], [1534.0, "والمعتزلة، والأشاعرة، والكُلّابيّة، والماتريديّة،"], [1537.3, "وغيرهم، ممّن سار على منهج الفلاسفة في تقرير التوحيد والربوبيّات والألوهيّات والعقائد،"], [1552.0, "فإنّ عمدة تعبّداتهم إنما هي على العقول؛"], [1557.0, "فما قرّرته عقولهم أخذوا به وإن كان على خلاف دليل الشرع،"], [1562.0, "وما تنافر مع عقولهم ردّوه،"], [1565.5, "وحرّفوه، وأخرجوه عن دلالاته الصحيحة،"], [1570.0, "وإن كان متّفقًا مع دليل الشرع."]], "tr": [[1528.0, "Filozofların ve onlara uyanlardan Cehmiyye, Mu'tezile, Eş'arîler, Küllâbiyye, Mâtürîdîler ve diğerlerinden, tevhidi, rubûbiyyet ve ulûhiyyet meselelerini ve akîdeleri belirlemede filozofların metodunu izleyenlerin birçoğunun taabbudlarının dayanağının sadece akıllar olduğunu görürsün."], [1557.0, "Akıllarının belirlediğini, şer'î delile aykırı olsa bile alırlar;"], [1561.1, "akıllarıyla çatışanı ise şer'î delille uyumlu olsa bile reddeder, tahrif eder ve sahih delâletlerinin dışına çıkarırlar."]]}]}, {"ts": "26:13", "title": "6. Külliye (devam): Aklî tahsîn ve takbîh meselesi", "paras": [{"reader": false, "ar": [[1573.0, "فإن قلت: وما القول الراجح في مسألة التحسين والتقبيح العقليّ؟"], [1583.0, "فأقول: أجمع أهل السنة والجماعة على أنّ العقل يُدرك حُسنَ الأشياء وقبحَها،"], [1592.0, "ولكن لا حقَّ له في تشريعها وإنشائها."], [1595.0, "فالله عز وجل خلق العقل وجعل له غريزةً وطاقةً في معرفة أنّ هذا الشيء حسن،"], [1604.0, "وأنّ هذا الشيء قبيح؛"], [1608.0, "ولكن لمجرّد رؤيته بعضَ الأشياء حسنةً فإنه لا حقَّ له أن يأمر بها استقلالًا عن دليل الشرع،"], [1617.0, "وإذا كان في غريزته رؤيةُ قبح بعض الأشياء فإنه لا حقَّ له في أن يمنعها أو يحرّمها بلا دليل الشرع."]], "tr": [[1573.0, "Şayet \"Aklî tahsîn ve takbîh (iyiyi ve kötüyü akılla belirleme) meselesinde râcih görüş nedir?\" dersen, derim ki:"], [1583.0, "Ehl-i Sünnet ve'l-Cemaat, aklın şeylerin güzelliğini ve çirkinliğini idrak ettiğinde, fakat onları teşrî ve inşa etmeye hakkı olmadığında icmâ etmiştir."], [1595.0, "Allah Azze ve Celle aklı yarattı ve ona şu şeyin güzel, şu şeyin çirkin olduğunu bilmede bir yeti ve güç verdi."], [1608.0, "Fakat sırf bazı şeyleri güzel görmesi sebebiyle, şer'î delilden bağımsız olarak onları emretmeye hakkı yoktur."], [1616.5, "Yetisi bazı şeylerin çirkinliğini görmeyi içeriyorsa da şer'î delil olmadan onları yasaklamaya ya da haram kılmaya hakkı yoktur."]]}, {"reader": false, "ar": [[1630.0, "فالعقل يُدرك حسنَ الأشياء وقبحها،"], [1633.2, "ولكن ليس مصدرًا من مصادر التشريع؛"], [1637.0, "خلافًا للأشاعرة الذين عطّلوه عن إدراك الحسن والقبح،"], [1644.0, "وبين المعتزلة الذين رفعوه إلى دائرة التشريع،"], [1648.8, "بمعنى اكتشاف الحكم الشرعيّ وإن لم يرد في خصوصه دليل."], [1655.0, "فعندنا ـ معاشرَ أهل السنة والجماعة ـ لا يجوز أن نبني تعبّدًا ولا عقيدةً على عقلٍ مجرّدٍ عن دليل الشرع."]], "tr": [[1630.0, "Akıl şeylerin güzelliğini ve çirkinliğini idrak eder;"], [1633.2, "fakat teşrîin kaynaklarından bir kaynak değildir."], [1637.0, "(Bu görüş,) aklı güzellik ve çirkinliği idrak etmekten ta'til eden Eş'arîlerin ve onu —hakkında özel bir delil gelmemiş olsa bile şer'î hükmü keşfetmek anlamında— teşrî dairesine yükselten Mu'tezile'nin aksinedir."], [1655.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğuna göre, şer'î delilden soyutlanmış bir akıl üzerine ne bir taabbud ne de bir akîde bina etmemiz caiz değildir."]]}]}, {"ts": "27:45", "title": "7. Külliye: Zaruret ya da ihtiyaç olmadan Müslümanları dinlerinde imtihan eden bid'atçidir", "paras": [{"reader": false, "ar": [[1665.0, "ومن الكلّيّات أيضًا: <b>كلُّ من امتحن أهل الإسلام في دينهم بلا حاجةٍ فمبتدع.<\/b> كلُّ من امتحن أهل الإسلام في دينهم بلا ضرورةٍ أو حاجةٍ فمبتدع."], [1685.0, "أُعيدها مرةً ثالثة: <b>كلُّ من امتحن أهل الإسلام في دينهم بلا ضرورةٍ أو حاجةٍ فمبتدع.<\/b>"]], "tr": [[1665.0, "Külliyelerden biri de şudur: 7."], [1667.5, "külliye: İhtiyaç olmadan İslam ehlini dinlerinde imtihan eden herkes bid'atçidir. Zaruret ya da ihtiyaç olmadan İslam ehlini dinlerinde imtihan eden herkes bid'atçidir."], [1685.0, "Üçüncü kez tekrarlıyorum: <b>Zaruret ya da ihtiyaç olmadan İslam ehlini dinlerinde imtihan eden herkes bid'atçidir.<\/b>"]]}, {"reader": false, "ar": [[1695.0, "وذلك لأنّ المتقرّر في القواعد عند أهل السنة والجماعة أنّ لنا الظاهرَ،"], [1701.0, "وأنّ الله يتولّى السرائر،"], [1703.0, "وأنّ كلَّ من دخل في دائرة الإسلام فإنّ الأصل فيه التزامُه بأحكامه من غير امتحان."], [1710.0, "وعلى ذلك قولُ الله عز وجل:"], [1713.4, "<span class=\"ayah\">﴿إِذَا ضَرَبْتُمْ فِي سَبِيلِ اللَّهِ فَتَبَيَّنُوا وَلَا تَقُولُوا لِمَنْ أَلْقَىٰ إِلَيْكُمُ السَّلَامَ لَسْتَ مُؤْمِنًا تَبْتَغُونَ عَرَضَ الْحَيَاةِ الدُّنْيَا﴾<\/span> <span class=\"ref\">[النساء: ٩٤]<\/span>،"], [1723.8, "الآية بتمامها. وأيضًا يقول النبيّ صلى الله عليه وسلم ـ في صحيح البخاري ـ:"], [1730.4, "«من صلّى صلاتنا، واستقبل قبلتنا، وأكل ذبيحتنا، فذلك المسلمُ الذي له ذمّةُ الله وذمّةُ رسوله، فلا تُخفِروا اللهَ في ذمّته»."]], "tr": [[1695.0, "Bu şundandır: Ehl-i Sünnet ve'l-Cemaat'e göre kaidelerde yerleşik olan şudur:"], [1700.0, "Zahir bize aittir, gizli şeyleri ise Allah üstlenir."], [1703.9, "İslam dairesine giren herkes hakkında asıl olan, imtihan edilmeksizin onun hükümlerine bağlı olmasıdır."], [1710.0, "Allah Azze ve Celle'nin şu sözü buna delildir:"], [1713.4, "<span class=\"ayah\">﴿Allah yolunda sefere çıktığınız zaman (durumu) iyice araştırın; dünya hayatının geçici menfaatini arayarak size selam veren kimseye \"Sen mü'min değilsin\" demeyin﴾<\/span> [Nisâ 94] —ayetin tamamı."], [1726.6, "Yine Nebî ﷺ, Buhârî'nin Sahîh'inde şöyle buyurur:"], [1730.4, "\"Kim bizim namazımızı kılar, kıblemize yönelir ve kestiğimizi yerse, işte o, Allah'ın ve Resûlü'nün güvencesi (zimmeti) kendisi için olan Müslümandır. Allah'ın güvencesini bozmayın.\""]]}, {"reader": false, "ar": [[1742.0, "ولأنّ النبيّ صلى الله عليه وسلم كان يقبل إسلام من يأتيه من الوفود من غير،"], [1750.0, "من غير امتحانٍ لهم بعد ذلك،"], [1753.3, "ويَكِلُهم إلى النطق بكلمة الإسلام،"], [1756.1, "ويعاملهم في الظاهر بما يقتضيه حكم الشرع،"], [1760.0, "من غير أن يستفسر عن باطن أحد."]], "tr": [[1742.0, "Ayrıca Nebî ﷺ kendisine gelen heyetlerden (Müslüman olanların) İslam'ını, bundan sonra onları imtihan etmeksizin kabul ederdi."], [1751.1, "Onları İslam kelimesini söylemelerine havale eder ve hiç kimsenin bâtınını sorup araştırmaksızın zahirde onlara şer'î hükmün gerektirdiği şekilde muamele ederdi."]]}]}, {"ts": "29:24", "title": "7. Külliye (devam): Üsâme b. Zeyd hadisi", "paras": [{"reader": false, "ar": [[1764.0, "وفي الصحيحين من حديث أسامة بن زيدٍ رضي الله عنه قال:"], [1770.4, "«بعثنا رسول الله صلى الله عليه وسلم في سريّةٍ، فصبّحنا الحُرَقاتِ من جُهينة، فأدركتُ أنا وصاحبي الأنصاريُّ رجلًا منهم، فلمّا رأى شعاعَ السيف قال: لا إله إلا الله، فكفّ الأنصاريُّ عنه، وعلوتُه بالسيف حتى برد. فجاء الخبر إلى النبيّ صلى الله عليه وسلم، فدعاه ثم قال: يا أسامة، أقتلتَه بعد أن قال: لا إله إلا الله؟ قال: قلتُ: يا رسول الله، إنما كان متعوّذًا» ـ وهذا امتحانٌ للمسلم ـ."]], "tr": [[1764.0, "Sahîhayn'da Üsâme b. Zeyd'den —Allah ondan razı olsun— gelen hadiste şöyle dedi:"], [1770.0, "\"Resûlullah ﷺ bizi bir seriyye (askerî birlik) içinde gönderdi."], [1773.4, "Cüheyne'nin Hurakât (kolu)na sabah baskını yaptık."], [1775.6, "Ben ve Ensâr'dan arkadaşım onlardan bir adama yetiştik."], [1778.8, "Kılıcın parıltısını görünce 'Lâ ilâhe illallah' dedi."], [1781.6, "Ensârî ondan elini çekti, ben ise kılıçla üzerine çullandım, nihayet (öldü ve) soğudu."], [1789.0, "Haber Nebî ﷺ'e ulaştı. Onu çağırdı, sonra dedi ki:"], [1792.9, "'Ey Üsâme! Lâ ilâhe illallah dedikten sonra onu öldürdün mü?' Dedim ki:"], [1797.5, "'Ey Allah'ın Resûlü! O sadece (ölümden) sığınmak için (söyledi).'\" —Bu, Müslüman'ı imtihan etmektir.—"]]}, {"reader": false, "ar": [[1803.0, "فأنكر عليه النبيّ صلى الله عليه وسلم ذلك وقال:"], [1807.8, "«كيف تصنع بلا إله إلا الله إذا جاءت يوم القيامة؟»؛"], [1812.8, "بمعنى: أنّ الواجب عليك قبولُ ظاهره،"], [1815.4, "ولا شأنَ لك بما يُخفيه باطنُه."], [1818.0, "وأكّد ذلك بقوله صلى الله عليه وسلم:"], [1822.0, "«أفلا شققتَ عن قلبه حتى تعلمَ أقالها أو لا؟»."], [1828.0, "فلا يجوز للإنسان أن يمتحن الناس في دينهم."]], "tr": [[1803.0, "Nebî ﷺ bunu ona reddetti ve şöyle buyurdu:"], [1807.8, "\"Kıyamet günü Lâ ilâhe illallah geldiğinde ona ne yapacaksın?\" Yani:"], [1812.8, "Sana vacip olan onun zahirini kabul etmektir;"], [1815.4, "bâtınının gizlediği şeyle bir işin yoktur."], [1818.0, "Bunu ﷺ şu sözüyle pekiştirdi:"], [1822.0, "\"Onu söyleyip söylemediğini bilmek için kalbini yarıp baksaydın ya!\" İnsanın insanları dinlerinde imtihan etmesi caiz değildir."]]}, {"reader": false, "ar": [[1833.0, "فإننا نرى أنّ الناس قد يقرّرون أصلًا أو قاعدةً ثم يمتحنون الناس عليها،"], [1841.0, "فيصنّفون السنّيَّ من المبتدع،"], [1843.7, "والمقبولَ من المردود، والراجحَ من المرجوح،"], [1847.8, "والصالحَ من الطالح، بناءً على هذا الأمر؛"], [1854.4, "وهذا لا أصل له في الشرع."]], "tr": [[1833.0, "Görüyoruz ki insanlar bazen bir asıl ya da kaide belirleyip sonra insanları onunla imtihan ediyorlar."], [1842.4, "Bu şeye dayanarak Sünnî'yi bid'atçiden, makbulü merduttan, râcihi mercûhtan, sâlihi tâlihten (iyiyi kötüden) ayırıp sınıflandırıyorlar."], [1854.4, "Bunun şeriatte hiçbir aslı yoktur."]]}]}, {"ts": "30:58", "title": "7. Külliye (devam): İstisna — zaruret, ihtiyaç ve râcih maslahat", "paras": [{"reader": false, "ar": [[1858.0, "إلا أنّ هذه الكلّيّة دخلها استثناء،"], [1862.1, "وهي قوله: «بلا ضرورةٍ أو حاجة»،"], [1867.0, "ويجمع الأمرين قولُنا: المصلحة الراجحة."], [1874.0, "فإذا دعت المصلحة الراجحة للامتحان فلا بأس به؛"], [1878.0, "لقول الله عز وجل:"], [1880.7, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا جَاءَكُمُ الْمُؤْمِنَاتُ مُهَاجِرَاتٍ فَامْتَحِنُوهُنَّ﴾<\/span> <span class=\"ref\">[الممتحنة: ١٠]<\/span> <span class=\"note\">(Şeyh «إن جاءكم» diyor)<\/span>؛"], [1889.0, "وذلك لوجود الضرورة أو الحاجة أو المصلحة الراجحة لهذا الامتحان."]], "tr": [[1858.0, "Ancak bu külliyeye bir istisna girmiştir;"], [1860.0, "o da \"zaruret ya da ihtiyaç olmadan\" sözüdür."], [1863.5, "Bu iki şeyi \"râcih maslahat\" sözümüz bir araya getirir."], [1869.4, "Râcih maslahat imtihanı gerektirirse bunda bir sakınca yoktur."], [1875.5, "Çünkü Allah Azze ve Celle şöyle buyurmuştur:"], [1878.0, "<span class=\"ayah\">﴿Ey iman edenler! Mü'min kadınlar hicret ederek size geldiklerinde onları imtihan edin﴾<\/span> [Mümtehine 10]."], [1889.0, "Bu, o imtihan için zaruretin, ihtiyacın ya da râcih maslahatın bulunmasından dolayıdır."]]}, {"reader": false, "ar": [[1895.0, "وهذا هو وجه الجمع بين قبول الإسلام بلا امتحان،"], [1900.5, "وبين قبول الإسلام بالامتحان:"], [1904.0, "فإننا نحمل قبولَ الإسلام بلا امتحانٍ إذا لم يكن ثَمّةَ ضرورةٌ ولا حاجةٌ أو مصلحةٌ راجحةٌ له،"], [1913.0, "ونحمل الأدلة الدالّة على تجويزه فيما إذا دعا إليه داعي الضرورة،"], [1920.2, "أو الحاجةِ الملحّة، أو المصلحةِ الراجحة."], [1926.0, "ويُخرَّج على ذلك امتحانُ من آمنت ـ من جاءت مؤمنةً مهاجرةً من النساء."]], "tr": [[1895.0, "İslam'ı imtihansız kabul etmek ile İslam'ı imtihanla kabul etmek arasındaki cem' (uzlaştırma) yolu budur:"], [1904.0, "İslam'ı imtihansız kabul etmeyi, bunun için bir zaruret, ihtiyaç ya da râcih maslahat bulunmadığı duruma hamlederiz."], [1912.4, "Onun (imtihanın) cevazına delâlet eden delilleri ise zaruretin, acil ihtiyacın ya da râcih maslahatın onu gerektirdiği duruma hamlederiz."], [1926.0, "İman eden —mü'min olarak hicret edip gelen— kadınların imtihanı da bunun üzerine tahriç edilir."]]}, {"reader": false, "ar": [[1933.0, "وكذلك يُخرَّج عليه قولُ النبيّ صلى الله عليه وسلم للجارية:"], [1939.8, "«أين الله؟»؛ لأنه يريد عتقها،"], [1944.0, "ولا عتقَ لكافر، وإنما يُعتق المؤمن."], [1948.0, "والنبيّ صلى الله عليه وسلم لمّا أمر معاوية بن الحكم السُّلَميّ بعتقها أراد أن يتأكّد من كونها مسلمةً،"], [1959.2, "فقال لها: «أين الله؟»."], [1962.0, "فالامتحان ينقسم إلى أصلٍ وعارض:"], [1970.0, "فأمّا أصله فإنه ممنوع،"], [1972.0, "وأمّا ما يعرض من ضرورةٍ أو حاجةٍ تقتضيه فإنه سائغٌ جائز."]], "tr": [[1933.0, "Nebî ﷺ'in câriyeye \"Allah nerede?\" demesi de bunun üzerine tahriç edilir."], [1939.8, "Çünkü onun azat edilmesini istiyordu;"], [1943.3, "kâfir için azat yoktur, ancak mü'min azat edilir."], [1948.0, "Nebî ﷺ, Muâviye b. el-Hakem es-Sülemî'ye onu azat etmesini emrettiğinde onun Müslüman olduğundan emin olmak istedi ve ona \"Allah nerede?\" dedi."], [1958.5, "İmtihan asıl ve ârız (sonradan ortaya çıkan durum) olarak ikiye ayrılır:"], [1970.0, "Aslı yasaktır; onu gerektiren bir zaruret ya da ihtiyacın ortaya çıkması durumunda ise uygun ve caizdir."]]}]}, {"ts": "32:57", "title": "8. Külliye: Zikirlerin bütün taallukları tevkîfîdir", "paras": [{"reader": false, "ar": [[1977.0, "ومن الكلّيّات أيضًا ـ ولا أدري عن رقمها عندكم ـ:"], [1982.0, "<b>كلُّ متعلَّقات الأذكار توقيفيّة.<\/b> كلُّ متعلَّقات الأذكار توقيفيّة،"], [1993.0, "كلُّ متعلَّقات الأذكار توقيفيّة."], [2003.0, "أقول وبالله التوفيق: وحتى نفهم هذه الكلّيّة فهمًا طيّبًا فلا بدّ أن نفرّق بين بابين:"], [2013.0, "باب الأذكار، وباب الأدعية."], [2016.0, "فأمّا باب الأدعية فالأصل فيه الحلّ والإباحة،"], [2021.0, "ولا يدخل معنا في قاعدتنا هذه؛"], [2023.6, "فالأدعية بكلّ ـ لا، نعم ـ فالأصل في باب الأدعية الحلّ والإباحة."], [2032.0, "وإنما كلّيّتنا تتكلّم عن الباب الثاني،"], [2036.0, "وهو باب الأذكار؛ فالأذكار بكلّ متعلَّقاتها مبنيّةٌ على التوقيف."]], "tr": [[1977.0, "Külliyelerden biri de —sizde numarası kaçtır bilmiyorum— şudur:"], [1982.0, "<b>8. külliye: Zikirlerin bütün taallukları tevkîfîdir.<\/b> Zikirlerin bütün taallukları tevkîfîdir, zikirlerin bütün taallukları tevkîfîdir."], [2003.0, "Tevfik Allah'tandır, derim ki: Bu külliyeyi güzelce anlamamız için iki babı birbirinden ayırmamız gerekir:"], [2013.0, "zikirler babı ve dualar babı."], [2016.0, "Dualar babında asıl olan helallik ve mübahlıktır;"], [2021.0, "o bu kaidemize girmez. Dualar bütün..."], [2023.6, "—hayır, evet— dualar babında asıl olan helallik ve mübahlıktır."], [2032.0, "Külliyemiz ise ikinci babdan, yani zikirler babından bahseder:"], [2038.0, "Zikirler bütün taalluklarıyla tevkîfe dayanır."]]}, {"reader": false, "ar": [[2043.0, "فلا يجوز للإنسان أن يُدخل في باب الذِّكريّة شيئًا إلا وعليه دليل الشرع."], [2050.0, "وبناءً على ذلك: فألفاظُ الذكر توقيفيّة،"], [2057.0, "وزمانُ الذكر توقيفيّ، ومكانُ الذكر توقيفيّ،"], [2066.0, "وعددُ الذكر توقيفيّ. فلا يجوز للإنسان أن يُدخل في الأذكار الشرعية ما ليس منها،"], [2075.0, "ولا أن يُخرج منها ما هو منها،"], [2078.0, "ولا أن يلفّق بين ذكرين معتقدًا فضيلةَ الجمع بينهما تلفيقًا."]], "tr": [[2043.0, "Bu yüzden insanın zikir babına, üzerinde şer'î delil bulunmayan hiçbir şeyi sokması caiz değildir."], [2052.3, "Buna göre zikrin lafızları tevkîfîdir, zikrin zamanı tevkîfîdir, zikrin mekânı tevkîfîdir, zikrin sayısı tevkîfîdir."], [2071.4, "İnsanın şer'î zikirlere onlardan olmayanı sokması, onlardan olanı çıkarması ya da iki zikri birleştirmenin faziletine inanarak ikisini telfik etmesi (birbirine eklemesi) caiz değildir."]]}]}, {"ts": "34:45", "title": "8. Külliye (devam): Berâ b. Âzib hadisi ve \"Nebiyyike'llezî erselte\" lafzının hikmeti", "paras": [{"reader": false, "ar": [[2085.0, "ويدلّ على ذلك ما في الصحيحين من حديث البراء بن عازبٍ رضي الله عنهما،"], [2092.0, "أنّ النبيّ صلى الله عليه وسلم قال:"], [2096.0, "«إذا أخذتَ مضجعك فتوضّأ وضوءك للصلاة، ثم اضطجع على شقّك الأيمن، ثم قل: اللهمّ أسلمتُ نفسي إليك، ووجّهتُ وجهي إليك» ـ إلى أن قال ـ:"], [2108.0, "«ثم أعدتُها عليه، فقلت: ورسولِك الذي أرسلت، قال: لا، ونبيِّك الذي أرسلت»."]], "tr": [[2085.0, "Buna delil, Sahîhayn'da Berâ b."], [2087.0, "Âzib'den —Allah ikisinden de razı olsun— gelen hadistir:"], [2089.8, "Nebî ﷺ şöyle buyurdu: \"Yatağına girdiğinde namaz abdesti gibi abdest al, sonra sağ tarafının üzerine yat, sonra de ki:"], [2096.0, "Allah'ım! Nefsimi sana teslim ettim, yüzümü sana yönelttim…\" —ta ki şöyle dediği yere kadar—:"], [2103.0, "\"Sonra onu kendisine tekrar ettim ve 've gönderdiğin Resûlüne' dedim."], [2108.0, "Buyurdu ki: 'Hayır, (de ki:) ve gönderdiğin Nebîne.'\""]]}, {"reader": false, "ar": [[2119.0, "فلم يرتضِ النبيّ صلى الله عليه وسلم للبراء أن يبدّل في الذِّكريّة لفظًا بدل لفظ،"], [2126.0, "مع أنه يستوي معه في أكثر جزئيّاته؛"], [2131.0, "ممّا يدلّ على أنّ الأذكار تبقى على حالها،"], [2137.0, "فلا يُزاد فيها ما ليس منها،"], [2141.1, "ولا يُنقص ما هو منها،"], [2146.0, "ولا يجوز تقييدها بزمانٍ إلا بدليل،"], [2150.0, "ولا يجوز تقييد فضيلتها بمكانٍ إلا بدليل،"], [2155.0, "ولا يجوز تقييد فضيلتها بعدديّةٍ إلا بدليل؛"], [2160.0, "لأنّ الأصل فيها التوقيف بكلّ متعلَّقاتها."]], "tr": [[2119.0, "Nebî ﷺ, Berâ'nın zikirde bir lafzın yerine başka bir lafız koymasına —(ikinci lafız) cüz'î anlamlarının çoğunda onunla eşit olmasına rağmen— razı olmadı."], [2126.7, "Bu da zikirlerin olduğu hâl üzere kalacağını gösterir:"], [2131.0, "Onlara onlardan olmayan bir şey eklenmez, onlardan olan bir şey eksiltilmez."], [2141.8, "Onları bir zamanla kayıtlamak ancak delille caiz olur;"], [2151.4, "faziletlerini bir mekânla kayıtlamak ancak delille caiz olur;"], [2160.0, "faziletlerini bir sayıyla kayıtlamak ancak delille caiz olur."], [2162.0, "Çünkü onlarda asıl olan, bütün taallukları ile tevkîftir."]]}, {"reader": false, "ar": [[2164.0, "فإن قلت: وما الحكمة من قول النبيّ صلى الله عليه وسلم:"], [2171.0, "«لا، ونبيِّك الذي أرسلت»،"], [2174.0, "ولم يرتضِ بقول البراء:"], [2176.4, "«ورسولِك»؟ فأقول: الحكمة في ذلك أنّ النبوّة أوسعُ من الرسالة؛"], [2182.0, "فكلُّ رسولٍ نبيّ، وليس كلُّ نبيٍّ رسولًا."], [2190.0, "والإنسان مأمورٌ بأن يؤمن بمن نبّأه الله عز وجل،"], [2197.0, "فلو قصر الإيمانَ بالرسالة لخرج طرفٌ من الأنبياء ليسوا برسل،"], [2205.0, "والنبيّ صلى الله عليه وسلم أراد أن يعمّ الإيمانُ جميعَ الأنبياء،"], [2212.0, "ليدخل فيه الأنبياء والرسل."], [2216.0, "هل فهمتم هذا؟ وذلك لأنّ النبوّة أوسع من الرسالة. والله أعلم."]], "tr": [[2164.0, "Şayet \"Nebî ﷺ'in 'Hayır, ve gönderdiğin Nebîne' demesinin ve Berâ'nın 've Resûlüne' sözüne razı olmamasının hikmeti nedir?\" dersen, derim ki:"], [2176.4, "Bunun hikmeti, nübüvvetin risaletten daha geniş olmasıdır."], [2182.0, "Her resul nebîdir, fakat her nebî resul değildir."], [2190.0, "İnsan, Allah Azze ve Celle'nin nebî kıldığı herkese iman etmekle emrolunmuştur."], [2197.7, "Eğer imanı risaletle sınırlasaydı, resul olmayan bir kısım peygamber (bunun) dışında kalırdı."], [2206.3, "Nebî ﷺ ise imanın bütün peygamberleri kapsamasını, nebîlerin ve resullerin ona girmesini istedi."], [2216.0, "Bunu anladınız mı? Bu, nübüvvetin risaletten daha geniş olmasındandır. Allah en iyisini bilir."]]}]}, {"ts": "37:03", "title": "9. Külliye: İhtilaflı ya da içtihadî meselelerde şahıslar bid'atçilikle itham edilmez", "paras": [{"reader": false, "ar": [[2223.0, "ومن الكلّيّات أيضًا: <b>كلُّ مسألةٍ خلافيّةٍ أو اجتهاديّةٍ فلا تبديعَ للأعيان فيها.<\/b> <span class=\"note\">(يكررها)<\/span> وذلك لأنه لا يجوز للإنسان أن يجعل مسائل الخلاف سببًا لتبديع الأعيان؛"], [2265.0, "لعظم الشبهة فيها، ولأنه لا تخلو مسألةٌ شرعيةٌ ـ في الأعمّ الأغلب ـ من وجود خلافٍ فيها،"], [2277.0, "فلو أنه بدّع بعضُنا بعضًا بوجود الخلاف في المسألة لعظُم أمرُ البدعة،"], [2284.2, "ولطَمَّ شررُها <span class=\"q\">؟ 38:02<\/span>، وكثر شرُّها."]], "tr": [[2223.0, "Külliyelerden biri de şudur: 9."], [2225.0, "külliye: İhtilaflı ya da içtihadî her meselede şahıslar (a'yân) bid'atçilikle itham edilmez. Bu şundandır:"], [2232.4, "İnsanın ihtilaf meselelerini şahısları bid'atçilikle itham etmeye sebep kılması caiz değildir;"], [2265.0, "çünkü bunlarda şüphe büyüktür. Ayrıca şer'î bir mesele —büyük çoğunlukla— içinde bir ihtilaf bulunmaktan hâlî değildir."], [2273.7, "Eğer meselede ihtilaf bulunması sebebiyle birbirimizi bid'atçilikle itham etseydik, bid'at işi büyür, kıvılcımları her yeri kaplar <span class=\"q\">؟<\/span> ve şerri çoğalırdı."]]}, {"reader": false, "ar": [[2295.0, "فأيُّ مسألةٍ ثبت خلافُ أهل العلم من أهل السنة والجماعة فيها،"], [2302.0, "فإنها ليست محلًّا للتبديع ولا للتفسيق ولا للتكفير باعتبار الأعيان."], [2309.0, "فإن قلت: ولماذا قيّدتَ هذا التبديع بقولك:"], [2314.1, "«للأعيان»؟ فأقول: لأننا نقبل في مسائل الخلاف والاجتهاد تبديعَ الأفعال والأقوال،"], [2324.0, "وإنما نرفض إنزال ذلك إلى تبديع الأعيان أو القائلين."]], "tr": [[2295.0, "Ehl-i Sünnet ve'l-Cemaat'ten ilim ehlinin hakkında ihtilafı sabit olan her mesele, şahıslar itibarıyla tebdî' (bid'atçilikle itham), tefsîk ve tekfir yeri değildir."], [2306.9, "Şayet \"Bu tebdî'i neden 'şahıslar için' sözünle kayıtladın?\" dersen, derim ki:"], [2314.1, "Çünkü biz ihtilaf ve içtihad meselelerinde fiillerin ve sözlerin bid'at olarak nitelenmesini kabul ederiz;"], [2322.3, "sadece bunun şahısların ya da (o sözü) söyleyenlerin bid'atçi ilan edilmesine indirilmesini reddederiz."]]}]}, {"ts": "38:50", "title": "9. Külliye (devam): Örnekler — kunut, tespih, tırnak kesme, nefr, Yâsîn", "paras": [{"reader": false, "ar": [[2330.0, "وبناءً على ذلك: فالقول الصحيح الذي دلّت عليه الأدلة هو أنّ القنوت في صلاة الصبح على وجه الدوام من البدع،"], [2342.6, "ولكن لا نصف فاعله بأنه مبتدعٌ بعينه؛"], [2347.0, "لأنها مسألةٌ خلافيّةٌ أو اجتهاديّة."], [2354.0, "والقول الصحيح أنّ التسبيح بالسُّبحة ـ معتقدًا فضيلةَ التسبيح بها بخصوصه ـ هذا من البدع،"], [2368.0, "ولكن لا يحلّ لنا أن نصف من أجازه بأنه مبتدعٌ بعينه؛"], [2375.1, "لوجود الخلاف في حكم التسبيح بها."]], "tr": [[2330.0, "Buna göre delillerin gösterdiği doğru görüş şudur:"], [2331.9, "Sabah namazında sürekli olarak kunut yapmak bid'atlerdendir;"], [2337.6, "fakat onu yapanı bizzat bid'atçi olarak nitelemeyiz, çünkü bu ihtilaflı ya da içtihadî bir meseledir."], [2354.0, "Doğru görüş şudur: Özellikle tespihle zikretmenin faziletli olduğuna inanarak tespihle zikretmek bid'atlerdendir;"], [2362.1, "fakat bunu caiz gören kimseyi bizzat bid'atçi olarak nitelememiz helal değildir, çünkü tespihle zikretmenin hükmünde ihtilaf vardır."]]}, {"reader": false, "ar": [[2379.0, "والقول الصحيح عدمُ مشروعيّة تقليم الأظفار على الصفة الواردة في بعض كتب الفقهاء،"], [2387.7, "وهي تقليم الأظفار على وجه المخالفة،"], [2392.0, "فإنّ حديثها موضوع. فلا جرم أنّ التعبّد لله عز وجل بتقليم الأظفار على هذا الوصف المخصوص من البدع،"], [2406.0, "ولكن من قرّره وجعله سنّةً أو مشروعًا فلا نصفه بأنه مبتدع؛ لثبوت الخلاف فيها."]], "tr": [[2379.0, "Doğru görüş şudur: Bazı fıkıh kitaplarında geçen şekilde, yani tırnakları muhâlefe (çapraz bir sıra) üzere kesmek meşru değildir;"], [2390.4, "çünkü onun hadisi mevzûdur (uydurmadır)."], [2395.0, "Şüphesiz bu özel şekilde tırnak keserek Allah Azze ve Celle'ye ibadet etmek bid'atlerdendir."], [2404.8, "Fakat bunu takrir edip sünnet ya da meşru sayan kimseyi bid'atçi olarak nitelemeyiz;"], [2412.9, "çünkü bu hususta ihtilaf sabittir."]]}, {"reader": false, "ar": [[2415.0, "والقول الصحيح أنّ نترَ الذكر بعد البول من البدع في باب الاستنجاء،"], [2426.0, "ولكن لا نصف من جعله سنّةً أو مشروعًا بأنه مبتدع؛"], [2432.7, "لثبوت الخلاف في هذه المسألة."]], "tr": [[2415.0, "Doğru görüş şudur: İstincâ babında idrardan sonra zekeri silkelemek (nefr) bid'atlerdendir."], [2423.9, "Fakat bunu sünnet ya da meşru sayanı bid'atçi olarak nitelemeyiz;"], [2432.7, "çünkü bu meselede ihtilaf sabittir."]]}, {"reader": false, "ar": [[2436.0, "والقول الصحيح أنّ قراءة سورة يس بخصوصها على المحتضَر هذا من البدع التي ما أنزل الله بها من سلطان،"], [2451.0, "وحديثُ معقلٍ فيها ضعيف؛"], [2456.0, "لأنّ فيه رجلًا يقال له:"], [2458.5, "أبو عثمان النهديّ، وليس هو المشهور،"], [2462.1, "وإنما هذا رجلٌ مجهول؛"], [2465.0, "فلم يصحّ الدليل حتى يصحّ به التعبّد."], [2469.0, "ولكن لا يجوز لنا أن نصف من قال بمشروعيّة قراءتها بأنه مبتدع؛"], [2477.1, "لثبوت الخلاف فيها بين أهل السنة والجماعة."]], "tr": [[2436.0, "Doğru görüş şudur: Ölüm döşeğindeki kimsenin başında özellikle Yâsîn sûresini okumak, Allah'ın hakkında hiçbir delil indirmediği bid'atlerdendir."], [2450.2, "Bu konudaki Ma'kıl hadisi zayıftır;"], [2456.0, "çünkü içinde kendisine Ebû Osmân en-Nehdî denen bir adam vardır;"], [2458.5, "bu, meşhur olan (Ebû Osmân en-Nehdî) değildir, bilakis meçhul bir adamdır."], [2465.0, "Delil sahih olmadı ki onunla taabbud sahih olsun."], [2469.0, "Fakat onu okumanın meşru olduğunu söyleyeni bid'atçi olarak nitelememiz caiz değildir;"], [2477.1, "çünkü bu hususta Ehl-i Sünnet ve'l-Cemaat arasında ihtilaf sabittir."]]}, {"reader": false, "ar": [[2481.0, "وهكذا دواليك في مسائل خلافيّةٍ كثيرة،"], [2486.0, "يصف أهل السنة فيها القولَ أو الفعلَ بأنه بدعة،"], [2493.0, "ولكن لا يتجرّؤون على وصف الفاعل أو القائل فيها بأنه مبتدعٌ بعينه؛"], [2499.2, "لهذه الكلّيّة الطيّبة العظيمة."]], "tr": [[2481.0, "Birçok ihtilaflı meselede de bu böyle devam eder:"], [2490.3, "Ehl-i Sünnet bunlarda sözü ya da fiili bid'at olarak niteler;"], [2499.2, "fakat bu güzel ve büyük külliye sebebiyle, onu yapanı ya da söyleyeni bizzat bid'atçi olarak nitelemeye cüret etmezler."]]}]}, {"ts": "41:43", "title": "10. Külliye: Bâtılı takrir edip ona davet edenin üzerine hem kendi günahı hem de onunla amel edenlerin günahı vardır", "paras": [{"reader": false, "ar": [[2503.0, "ومن الكلّيّات أيضًا ـ ولعلّها الأخيرة فيما أظنّ ـ:"], [2507.0, "<b>كلُّ من قرّر باطلًا ودعا إليه فعليه وزرُه ووزرُ من عمل به إلى يوم القيامة.<\/b> كلُّ من قرّر باطلًا وعمل به فعليه وزرُه ووزرُ من عمل به إلى يوم القيامة."]], "tr": [[2503.0, "Külliyelerden biri de —zannederim bu sonuncusudur— şudur:"], [2505.9, "<b>10. külliye: Bâtılı takrir edip ona davet eden herkesin üzerine, kendi günahı ve kıyamet gününe kadar onunla amel edenlerin günahı vardır.<\/b> Bâtılı takrir edip onunla amel eden herkesin üzerine, kendi günahı ve kıyamet gününe kadar onunla amel edenlerin günahı vardır."]]}, {"reader": false, "ar": [[2532.0, "لقول الله عز وجل:"], [2537.0, "<span class=\"ayah\">﴿الَّذِينَ كَفَرُوا وَصَدُّوا عَن سَبِيلِ اللَّهِ زِدْنَاهُمْ عَذَابًا فَوْقَ الْعَذَابِ بِمَا كَانُوا يُفْسِدُونَ﴾<\/span> <span class=\"ref\">[النحل: ٨٨]<\/span>؛"], [2546.0, "فعذّبهم الله عز وجل على أصل كفرهم،"], [2550.0, "وعلى صدّهم عن سبيل الله عز وجل وإضلالهم لغيرهم."], [2556.0, "وقال الله عز وجل:"], [2559.1, "<span class=\"ayah\">﴿وَلَيَحْمِلُنَّ أَثْقَالَهُمْ﴾<\/span> ـ أي: أثقال أعمالهم السيئة ـ <span class=\"ayah\">﴿وَأَثْقَالًا مَّعَ أَثْقَالِهِمْ﴾<\/span> <span class=\"ref\">[العنكبوت: ١٣]<\/span>،"], [2567.0, "وهذه الأثقال الثانية هي أثقال من أضلّوه عن سبيل الله عز وجل وصراطه."]], "tr": [[2532.0, "Çünkü Allah Azze ve Celle şöyle buyurmuştur:"], [2537.0, "<span class=\"ayah\">﴿İnkâr eden ve (insanları) Allah yolundan alıkoyanlara, bozgunculuk yapmaları sebebiyle azap üstüne azap ekleriz﴾<\/span> [Nahl 88]."], [2546.0, "Allah Azze ve Celle onlara hem küfürlerinin aslından dolayı, hem de Allah Azze ve Celle'nin yolundan alıkoymaları ve başkalarını saptırmaları sebebiyle azap etti."], [2556.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [2559.1, "<span class=\"ayah\">﴿Andolsun, onlar kendi yüklerini﴾<\/span> —yani kötü amellerinin yüklerini— <span class=\"ayah\">﴿ve kendi yükleriyle birlikte başka yükleri de taşıyacaklar﴾<\/span> [Ankebût 13]."], [2569.1, "Bu ikinci yükler, Allah Azze ve Celle'nin yolundan ve O'nun sırâtından saptırdıkları kimselerin yükleridir."]]}, {"reader": false, "ar": [[2576.0, "وفي صحيح الإمام مسلمٍ من حديث أبي هريرة رضي الله عنه قال:"], [2582.5, "قال رسول الله صلى الله عليه وسلم:"], [2586.0, "«من دعا إلى هدًى كان له من الأجر مثلُ أجور من تبعه، من غير أن ينقص من أجورهم شيئًا، ومن دعا إلى ضلالةٍ كان عليه من الإثم مثلُ آثام من تبعه، من غير أن ينقص من آثامهم شيئًا»."]], "tr": [[2576.0, "İmam Müslim'in Sahîh'inde Ebû Hüreyre'den —Allah ondan razı olsun— gelen hadiste şöyle dedi:"], [2582.5, "Resûlullah ﷺ şöyle buyurdu: \"Kim bir hidayete davet ederse, ona uyanların ecirleri kadar ecir onun olur;"], [2586.0, "bu, onların ecirlerinden hiçbir şey eksiltmez."], [2589.6, "Kim de bir dalâlete davet ederse, ona uyanların günahları kadar günah onun üzerine olur;"], [2599.8, "bu, onların günahlarından hiçbir şey eksiltmez.\""]]}, {"reader": false, "ar": [[2605.0, "وفي الصحيحين من حديث ابن مسعودٍ رضي الله عنه قال:"], [2609.6, "قال رسول الله صلى الله عليه وسلم:"], [2612.8, "«لا تُقتل نفسٌ في الأرض ظلمًا إلا كان على ابن آدم الأوّل كِفلٌ من دمها؛ لأنه أوّل من سنّ القتل»."]], "tr": [[2605.0, "Sahîhayn'da İbn Mes'ûd'dan —Allah ondan razı olsun— gelen hadiste şöyle dedi:"], [2609.6, "Resûlullah ﷺ şöyle buyurdu: \"Yeryüzünde zulmen öldürülen hiçbir can yoktur ki onun kanından bir pay Âdem'in ilk oğlunun üzerine olmasın;"], [2618.8, "çünkü öldürmeyi ilk o âdet edinmiştir.\""]]}, {"reader": false, "ar": [[2622.0, "وفي صحيح الإمام مسلمٍ من حديث جرير بن عبد الله البجليّ رضي الله عنه قال:"], [2629.0, "قال النبيّ صلى الله عليه وسلم:"], [2631.8, "«من سنّ في الإسلام سنّةً حسنةً كان له أجرُها وأجرُ من عمل بها من بعده، من غير أن ينقص من أجورهم شيء، ومن سنّ في الإسلام سنّةً سيّئةً فعليه وزرُها ووزرُ من عمل بها من بعده، من غير أن ينقص من أوزارهم شيء»."]], "tr": [[2622.0, "İmam Müslim'in Sahîh'inde Cerîr b."], [2624.3, "Abdullah el-Becelî'den —Allah ondan razı olsun— gelen hadiste şöyle dedi:"], [2629.0, "Nebî ﷺ şöyle buyurdu: \"Kim İslam'da güzel bir çığır açarsa, onun ecri ve kendisinden sonra onunla amel edenlerin ecri onundur;"], [2631.8, "onların ecirlerinden hiçbir şey eksilmez."], [2635.0, "Kim de İslam'da kötü bir çığır açarsa, onun günahı ve kendisinden sonra onunla amel edenlerin günahı onun üzerinedir;"], [2648.5, "onların günahlarından hiçbir şey eksilmez.\""]]}, {"reader": false, "ar": [[2654.0, "وهذا يفيدك أنّ الإنسان ينبغي أن يكون على خطرٍ عظيمٍ من تقرير شيءٍ مخالفٍ للدين،"], [2662.0, "ويعظُم إثمُ الأتباع بعظم ما تدعوهم إليه من مخالفة الشرع؛"], [2671.0, "فكلّما كانت المخالفة التي تدعو لها الأتباعَ أعظمَ وأطمَّ،"], [2676.0, "كان إثمُهم عليك أشدَّ وأعظمَ وأكبر."], [2682.0, "فالذي يدعو أتباعه إلى الشرك إثمُه عظيم،"], [2687.0, "والذي يدعو أتباعه إلى بدعةٍ إثمُه عظيمٌ أيضًا؛"], [2691.0, "فيجب على الإنسان أن يتّقي الله في ذلك."], [2695.0, "هذا ما تيسّر شرحه،"], [2697.3, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[2654.0, "Bu sana şunu gösterir: İnsan, dine aykırı bir şeyi takrir etme hususunda büyük bir tehlike içinde olduğunu bilmelidir."], [2662.7, "Uyanların günahı, onları davet ettiğin şeriate muhalefetin büyüklüğü ölçüsünde büyür."], [2671.0, "Uyanları davet ettiğin muhalefet ne kadar büyük ve ağır olursa, onların günahı senin üzerine o kadar şiddetli, büyük ve ağır olur."], [2682.0, "Uyanlarını şirke davet edenin günahı büyüktür;"], [2686.3, "uyanlarını bir bid'ate davet edenin günahı da büyüktür."], [2691.0, "İnsanın bu hususta Allah'tan sakınması vaciptir."], [2693.0, "Şerh etmesi kolaylaştırılan bu kadardır."], [2695.0, "Allah en yüce ve en iyi bilendir."], [2698.4, "Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
