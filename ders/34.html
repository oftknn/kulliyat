ا على أكثر أهل الأرض؛"], [3388.0, "إذ أنّ العلماء الذين عندهم الفهمُ المطلق الكامل في النصوص يُعَدّون على الأصابع في كلّ زمان. فهمتم؟"]], "tr": [[3368.0, "Çünkü önceki ve çağdaş âlimlerden, hüccetin ikamesi için bu kâmil ve tam anlayışı şart koşan hiçbir âlim bilmiyorum."], [3379.0, "Çünkü onu şart koşsaydık, yeryüzü halkının çoğuna hüccetin ikame edilmediğine hükmederdik."], [3388.0, "Zira nasslarda mutlak ve kâmil anlayışa sahip olan âlimler her zamanda parmakla sayılacak kadardır. Anladınız mı?"]]}, {"reader": false, "ar": [[3402.0, "وأمّا النوع الثاني من الفهم فهو مطلقُ الفهم،"], [3405.8, "أي بعضُه، بمعنى أنه يعرف دلالةَ اللغة العربيّة،"], [3413.0, "عنده معرفةٌ باللسان العربي؛"], [3416.0, "يعرف معنى «اعبدوني»، يعرف معنى «لا إله إلا أنا»،"], [3421.0, "يعرف معنى «لا تشركوا بي شيئًا»؛"], [3424.0, "فهذا عنده مطلقُ الفهم."], [3428.0, "وقد أجمع العلماء على أنّ مطلق الفهم شرطٌ في قيام الحجّة. فهمتم هذا؟"]], "tr": [[3402.0, "Anlamanın ikinci türüne gelince, o mutlaku'l-fehmdir (genel anlayış), yani anlamanın bir kısmı."], [3407.5, "Yani Arap dilinin delâletini bilir, Arapçaya dair bilgisi vardır:"], [3416.0, "\"Bana ibadet edin\"in anlamını bilir, \"Benden başka ilah yoktur\"un anlamını bilir, \"Bana hiçbir şeyi ortak koşmayın\"ın anlamını bilir."], [3424.0, "İşte bunda genel anlayış vardır."], [3428.0, "Âlimler, genel anlayışın hüccetin ikamesinde şart olduğu üzerinde icmâ etmişlerdir. Bunu anladınız mı?"]]}, {"reader": false, "ar": [[3438.0, "لإجماعهم بأنّ الحجّة لا تقوم على البهيمة؛"], [3442.0, "لأنه ليس عندها مطلقُ الفهم وإن سمعت النصّ،"], [3445.0, "ولا على المجنون؛ لأنه ليس عنده مطلقُ الفهم وإن بلغه النصّ،"], [3455.0, "ولا على الصبيّ؛ لأنه ليس عنده مطلقُ الفهم التكليفي وإن سمعت أذنُه النصّ،"], [3466.0, "فليس عنده كمالُ العقل الذي يوجب عليه التكليف."]], "tr": [[3438.0, "Çünkü onlar şu konularda icmâ etmişlerdir:"], [3442.0, "Hüccet hayvana ikame edilmez; çünkü nassı işitse bile onda genel anlayış yoktur."], [3447.1, "Deliye de ikame edilmez; çünkü nass kendisine ulaşsa bile onda genel anlayış yoktur."], [3457.1, "Çocuğa da ikame edilmez; çünkü kulağı nassı işitse bile onda teklife (yükümlülüğe) dair genel anlayış yoktur;"], [3467.0, "onda kendisine teklifi gerektiren aklın kemali yoktur."]]}, {"reader": false, "ar": [[3470.0, "ولإجماعهم بأنّ المصاب في عقله بآفةٍ تُنسيه اسمَه أو تُنسيه ولدَه،"], [3486.0, "فيكون مختلطًا، أنّ الحجّة لا تقوم عليه؛"], [3490.7, "لأنه ليس عنده مطلقُ فهم."], [3494.0, "ولو أنك جئتَ إلى نائمٍ تأمره بالصلاة فلم يستجب،"], [3501.0, "فإنّ الأمر بالصلاة ـ ها ـ فإنه لا يُؤاخَذ على ذلك؛"], [3507.0, "لأنّ النائم ليس عنده مطلقُ الفهم للخطاب،"], [3511.7, "أقصد التكليفي. فدلّ ذلك على أنّ العلماء يشترطون مطلقَ فهم الحجّة،"], [3521.0, "يعني بعضَ الفهم لا كلَّه."]], "tr": [[3470.0, "Yine şu konuda icmâ etmişlerdir:"], [3472.1, "Aklında, kendisine adını unutturan ya da çocuğunu unutturan bir afetle musap olup (aklı) karışmış olan kimseye hüccet ikame edilmez;"], [3490.7, "çünkü onda genel anlayış yoktur."], [3494.0, "Uyuyan birine gelip ona namaz kılmasını emretsen ve o icabet etmese —namaz emri… evet— bundan dolayı sorumlu tutulmaz;"], [3507.0, "çünkü uyuyanda hitaba, yani teklif hitabına dair genel anlayış yoktur."], [3513.0, "Bu, âlimlerin hücceti genel anlamayı, yani anlamanın tamamını değil bir kısmını şart koştuklarını gösterir."]]}, {"reader": false, "ar": [[3524.0, "فبان لنا بهذا التفصيل أنّ قيام الحجّة مرتكزٌ على ثلاثة إجماعات:"], [3533.0, "الإجماعُ الأوّل: أجمع العلماء على أنّ بلوغ الحجّة شرط."], [3542.0, "الثاني: أجمع العلماء على أنّ مطلق فهم الحجّة شرط."], [3553.0, "الثالث: أجمع العلماء على أنّ الفهم المطلق للحجّة ليس بشرط."]], "tr": [[3524.0, "Bu tafsille bize açıkça ortaya çıktı ki hüccetin ikamesi üç icmâya dayanır."], [3533.0, "Birinci icmâ: Âlimler hüccetin ulaşmasının şart olduğu üzerinde icmâ etmişlerdir."], [3542.0, "İkincisi: Âlimler hücceti genel anlamanın (mutlaku'l-fehm) şart olduğu üzerinde icmâ etmişlerdir."], [3553.0, "Üçüncüsü: Âlimler hücceti mutlak (kâmil) anlamanın (el-fehmu'l-mutlak) şart olmadığı üzerinde icmâ etmişlerdir."]]}, {"reader": false, "ar": [[3564.0, "والذي يتأمّل كلامَ ابن تيمية رحمه الله يجد أنه يقرّر ما قرّرتُه تمامًا،"], [3575.0, "والذي يتأمّل كلامَ الإمام المجدّد وأئمّةِ الدعوة من بعده يجد أنه يقرّر ما قرّرتُه تمامًا."], [3585.5, "ولولا أنني لا أريد الإطالة عليكم لأتيتُكم بنقولٍ عن الإمام محمدٍ وأبنائه وأحفاده إلى علمائنا المعاصرين،"], [3598.2, "يُثبتون بأنّ مطلق الفهم شرط،"], [3604.0, "وأنّ الفهم المطلق ليس بشرط."]], "tr": [[3564.0, "İbn Teymiyye'nin —Allah ona rahmet etsin— sözünü düşünen kimse, onun benim takrir ettiğimi aynen takrir ettiğini görür."], [3575.0, "Müceddid imamın ve ondan sonraki davet imamlarının sözünü düşünen kimse de onun benim takrir ettiğimi aynen takrir ettiğini görür."], [3585.5, "Sizi uzun tutmak istemeseydim, size İmam Muhammed'den, oğullarından ve torunlarından çağdaş âlimlerimize kadar, genel anlayışın şart olduğunu ve mutlak anlayışın şart olmadığını isbat eden nakiller getirirdim."]]}, {"reader": false, "ar": [[3606.0, "فالذين قالوا من العلماء:"], [3608.8, "إنّ الفهم ليس بشرطٍ في قيامها،"], [3614.0, "فيقصدون نفيَ الفهم المطلق لا مطلقِ الفهم."], [3620.0, "والذين قالوا بأنّ الفهم شرطٌ في قيامها،"], [3627.0, "فإنما يُثبتون مطلقَ الفهم لا الفهمَ المطلق."], [3633.0, "وكلامي واضح؟ فإن قلت:"], [3637.0, "ولماذا قيّدتَ مطلقَ الفهم في الكلّيّة بقولك:"], [3642.1, "«الصحيح»؟ أنتم معي ولّا لا؟"], [3649.0, "فإن قلت: ولماذا قيّدتَ مطلق الفهم في الكلّيّة بقولك: «الصحيح»؟"]], "tr": [[3606.0, "Âlimlerden \"Anlamak, hüccetin ikamesinde şart değildir\" diyenler, genel anlayışı değil mutlak anlayışı nefyetmeyi kastederler."], [3620.0, "\"Anlamak, hüccetin ikamesinde şarttır\" diyenler ise mutlak anlayışı değil, ancak genel anlayışı isbat ederler."], [3637.0, "Sözüm açık mı? Eğer \"Külliyede genel anlayışı neden 'sahih' sözünle kayıtladın?\" dersen —benimle misiniz, değil misiniz?— Eğer \"Külliyede genel anlayışı neden 'sahih' sözünle kayıtladın?\" dersen:"]]}, {"reader": false, "ar": [[3657.0, "الجواب: ليَخرج مطلقُ الفهم المشوَّه،"], [3660.3, "وهو الذي يتولّى إيصالَه أهلُ البدع والوثنيّة والشرك للمسلمين في أرجاء الأرض."], [3673.0, "أوَليس الصوفيّة يوصلون القرآن لأتباعهم،"], [3676.6, "لكنهم يوصلونه بفهمٍ مشوَّه،"], [3681.0, "فيستدلّون على الطواف على القبور بالقرآن،"], [3685.0, "وبالذبح لغير الله بالقرآن،"], [3688.0, "وبدعاء غير الله والاستغاثة به بالقرآن؟"], [3693.0, "أفيكون من فهم هذا الفهمَ قد قامت عليه الحجّة؟"], [3698.0, "الجواب: لا. أوَلم يفهم النصَّ بمطلق الفهم؟"], [3702.0, "الجواب: نعم، ولكنه بمطلق الفهم المشوَّه،"], [3707.0, "وليس بمطلق الفهم الصحيح."]], "tr": [[3657.0, "Cevap: Çarpıtılmış genel anlayışı dışarıda bırakmak için."], [3660.3, "Bu, yeryüzünün dört bir yanındaki Müslümanlara ulaştırılmasını bid'at, putperestlik ve şirk ehlinin üstlendiği anlayıştır."], [3673.0, "Sûfîler tâbilerine Kur'an'ı ulaştırmıyorlar mı?"], [3675.1, "Fakat onu çarpıtılmış bir anlayışla ulaştırıyorlar:"], [3678.7, "Kabirlerin etrafında tavaf etmeye Kur'an'la, Allah'tan başkası için kurban kesmeye Kur'an'la, Allah'tan başkasına dua etmeye ve ondan istiğase etmeye Kur'an'la delil getiriyorlar."], [3693.0, "Bu anlayışla anlayan kimseye hüccet ikame edilmiş olur mu?"], [3698.0, "Cevap: Hayır. Nassı genel anlayışla anlamadı mı?"], [3702.0, "Cevap: Evet, fakat çarpıtılmış genel anlayışla; sahih genel anlayışla değil."]]}, {"reader": false, "ar": [[3711.0, "أوَلا ترون أنّ الأشاعرة والماتريديّة والمعتزلة والإباضيّة والرافضة يستدلّون على عقائدهم الباطلة البدعيّة بأدلّة الكتاب والسنة؟"], [3725.4, "الجواب: بلى. إذن أتباعهم ورعاياهم في بلادهم سمعوا الآية وسمعوا الحديث،"], [3734.0, "ولكنها على صورة فهمٍ مشوَّه،"], [3737.8, "فلا بدّ أن نتوقّف بتكفيرهم حتى نعيد دفّةَ مطلق الفهم من الفهم المشوَّه إلى الفهم الصحيح."], [3749.0, "وآخرُ دعوانا أنِ الحمدُ لله ربِّ العالمين،"], [3754.0, "وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[3711.0, "Eş'arîlerin, Mâtürîdîlerin, Mu'tezile'nin, İbâdıyye'nin ve Râfıza'nın bâtıl ve bid'atçi akîdelerine Kitap ve Sünnet delilleriyle istidlal ettiklerini görmüyor musunuz?"], [3725.4, "Cevap: Evet (görüyoruz). O hâlde onların beldelerindeki tâbileri ve tebaası ayeti de işittiler, hadisi de işittiler;"], [3736.4, "fakat çarpıtılmış bir anlayış suretinde."], [3738.8, "Dolayısıyla genel anlayışın dümenini çarpıtılmış anlayıştan sahih anlayışa çevirinceye kadar onları tekfir etmekte duraksamamız gerekir."], [3749.0, "Son duamız, \"Âlemlerin Rabbi Allah'a hamd olsun\" sözüdür."], [3753.3, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';

    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}

  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
