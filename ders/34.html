<script>
const D={"no": 34, "vid": "2XoNlRi2iHo", "title_ar": "الدرس (٣٤) من شرح كليات العقيدة — من كليات التكفير", "title_tr": "Şerhu Külliyyâti'l-Akîde — 34. Ders: Tekfir Külliyeleri (İhtilaflı Haramı Helal Sayma, İstihlâlin Tanımı, İstihlâl ve Israr, Allah'ın Halis Hakkında Misilleme, Zan ve Vehimle Tekfir, Kâfiri Tekfir Etmemek, Büyük ve Küçük Küfür, Şirk ve Küfür, Hüccetin İkamesi)", "sections": [{"ts": "00:00", "title": "11. Külliye: Muteber ihtilaf bulunan haramı helal sayan tekfir edilmez", "paras": [{"reader": false, "ar": [[0.0, "بسم الله الرحمن الرحيم،"], [1.9, "الحمدُ لله ربِّ العالمين،"], [3.8, "والصلاةُ والسلامُ على رسول الله الأمين،"], [6.7, "وعلى آله وأصحابه الطيبين الطاهرين،"], [9.1, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [12.0, "أمّا بعد: لا نزال في الكلّيّات التي تتعلّق بباب التكفير عند أهل السنة والجماعة،"], [21.0, "ولا أدري عن آخر كلّيّةٍ وقفنا عليها."], [25.6, "أحسنت. إذن كتبتم رأسَها أنتم،"], [30.0, "أليس كذلك؟ طيّب، نعيد رأسها مرّةً أخرى لمن لم يكتب."], [35.0, "من كلّيّات كتاب التكفير:"], [38.0, "<b>كلُّ محرَّمٍ ثبت الخلافُ المعتبرُ في تحريمه فلا يُكفَّر باستحلاله.<\/b> <span class=\"note\">(يكررها)<\/span> كتبتموها؟"]], "tr": [[0.0, "Bismillâhirrahmânirrahîm. Âlemlerin Rabbi Allah'a hamd olsun."], [2.4, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.0, "Bundan sonra: Hâlâ Ehl-i Sünnet ve'l-Cemaat'e göre tekfir babıyla ilgili külliyelerdeyiz."], [20.4, "En son hangi külliyede kaldığımızı bilmiyorum."], [25.6, "Güzel (doğru söyledin). Demek ki başlığını yazdınız, öyle değil mi?"], [31.0, "Peki, yazmayanlar için başlığını bir kez daha tekrar edelim."], [35.0, "Tekfir kitabının külliyelerinden: 11. külliye:"], [38.0, "Haramlığında muteber ihtilaf sabit olan her haram şeyi helal saymakla tekfir edilmez. (Tekrar ediyor.) Yazdınız mı?"]]}, {"reader": false, "ar": [[56.0, "أقول وبالله التوفيق: لقد مضت لنا كلّيّةٌ مهمّةٌ في مسألة التكفير باستحلال الكبيرة،"], [67.0, "وقلنا بأنه لا يكفر الإنسان إلا إذا استحلّ محرّمًا ـ ها ـ موصوفًا بأنه من المحرّمات المجمَع عليها،"], [77.0, "ومن المحرّمات المعلومة من الدين بالضرورة،"], [81.0, "أي التي لا خلافَ فيها أبدًا بين أهل العلم."], [84.0, "وهذه الكلّيّة تؤكّد على ذلك:"], [88.0, "بأنّ كلَّ حرامٍ مختلَفٍ فيه بين العلماء خلافًا معتبرًا فلا يحلّ لنا أن نكفّر من استحلّه."]], "tr": [[56.0, "Tevfik Allah'tandır, derim ki: Daha önce, büyük günahı helal saymakla tekfir meselesinde önemli bir külliye geçmişti."], [68.1, "Demiştik ki insan ancak, üzerinde icmâ edilmiş haramlardan ve dinden zarûrî olarak bilinen haramlardan, yani ilim ehli arasında asla ihtilaf bulunmayan haramlardan olmakla nitelenen bir haramı helal sayarsa kâfir olur."], [84.0, "Bu külliye de bunu pekiştirir:"], [88.0, "Âlimler arasında muteber bir ihtilafla ihtilaf edilmiş her haramı helal sayanı tekfir etmemiz helal değildir."]]}, {"reader": false, "ar": [[95.0, "فمتى ما قال عالمٌ من العلماء في هذا المحرَّم بأنه جائزٌ لا بأس به،"], [102.0, "وكان الخلاف معتبرًا والدليل محتمِلًا،"], [105.0, "والخلافُ ثابتٌ منقولٌ في كتب الفقهاء،"], [108.0, "فإيّاك أن تكفّر من استحلّ هذا الحرام؛"], [112.0, "لأنّ العلماء مختلفون فيه."], [116.0, "وبناءً على ذلك: فلو جاءنا عالمٌ يقول بأنّ كشف وجه المرأة حلال،"], [124.0, "فإيّاك أن تقول: قد استحللتَ ما حرّم الله،"], [127.0, "وكلُّ من استحلّ ما حرّم الله فهو كافر؛"], [130.0, "فإنّ هذا من الطغيان في التكفير،"], [134.0, "ومن التكفير بالهوى والظِّنّة،"], [138.0, "وهذا محرّمٌ عند أهل السنة والجماعة؛"], [141.0, "لأنّ هناك من العلماء المعتبرين من قالوا بأنّ كشف وجه المرأة جائز."]], "tr": [[95.0, "Âlimlerden biri bu haram hakkında \"caizdir, sakıncası yoktur\" derse, ihtilaf muteber, delil de (bu anlama) ihtimalli olursa ve ihtilaf sabit olup fakihlerin kitaplarında nakledilmişse, sakın bu haramı helal sayanı tekfir etme;"], [112.0, "çünkü âlimler onda ihtilaf etmiştir."], [118.0, "Buna göre: Bir âlim bize gelip \"Kadının yüzünü açması helaldir\" derse, sakın \"Allah'ın haram kıldığını helal saydın;"], [127.0, "Allah'ın haram kıldığını helal sayan herkes kâfirdir\" deme."], [130.0, "Çünkü bu, tekfirde azgınlıktır, hevâ ve zanla tekfirdir;"], [135.7, "bu da Ehl-i Sünnet ve'l-Cemaat'e göre haramdır."], [141.0, "Çünkü muteber âlimlerden kadının yüzünü açmasının caiz olduğunu söyleyenler vardır."]]}, {"reader": false, "ar": [[146.0, "ومثالٌ آخر: لو جاءنا رجلٌ وأفتى بحِلّ الغناء،"], [153.0, "بحِلّ الغناء، فإيّاك أن تكفّره بحجّة أنه قد استحلّ ما حرّم الله؛"], [160.0, "لأنّ الغناء لا يزال العلماء يختلفون فيه."], [166.0, "أنتم معي ولّا لا؟"], [170.0, "ولو جاءنا رجلٌ وقال بأنّ الإسبال لغير خُيَلاء جائز،"], [179.0, "فإيّاك أن تكفّره محتجًّا بأنه قد استحلّ الحرام؛"], [186.0, "فإنّ هناك طائفةً من العلماء قالوا بجواز الإسبال إذا لم يكن مقرونًا بقصد الخُيَلاء."]], "tr": [[146.0, "Başka bir örnek: Bir adam bize gelip musikinin (şarkının) helal olduğuna fetva verse, sakın onu Allah'ın haram kıldığını helal saydı bahanesiyle tekfir etme;"], [160.0, "çünkü âlimler musiki hakkında hâlâ ihtilaf etmektedir."], [166.0, "Benimle misiniz, değil misiniz? Bir adam bize gelip \"Kibir olmaksızın elbiseyi (topuktan aşağı) sarkıtmak (isbâl) caizdir\" dese, sakın onu haramı helal saydığını delil göstererek tekfir etme;"], [186.0, "çünkü âlimlerden bir grup, kibir kastıyla birlikte olmadığında isbâlin caiz olduğunu söylemiştir."]]}, {"reader": false, "ar": [[198.0, "ولو جاءنا رجلٌ وقال:"], [202.8, "إنّ بنت الربيبة ـ بنت الربيبة ـ تحلّ لزوج أمّها إذا لم تتربَّ في حجره؛"], [215.0, "لأنه يرى أنّ الله عز وجل قد اشترط في تحريم الربيبة شرطين،"], [222.0, "فقال الله عز وجل:"], [225.2, "<span class=\"ayah\">﴿وَرَبَائِبُكُمُ الَّٰتِي فِي حُجُورِكُم مِّن نِّسَائِكُمُ الَّٰتِي دَخَلْتُم بِهِنَّ﴾<\/span> <span class=\"ref\">[النساء: ٢٣]<\/span>،"], [232.0, "فإيّاك أن تكفّره؛ لأنّ هناك من العلماء من اشترط في تحريم الربيبة الشرطين جميعًا،"], [245.0, "وإن كان الحقُّ أنّ مجرّد الدخول بأمّها كافٍ في تحريمها،"], [255.0, "سواءٌ تربّت في حجر زوج أمّها أو لم تتربَّ؛"], [259.0, "لأنّ ذكر قيد الحَجْر في الآية إنما هو من القيود الأغلبيّة."]], "tr": [[198.0, "Bir adam bize gelip \"Rebîbenin (üvey kızın) kızı —rebîbenin kızı— eğer annesinin kocasının himayesinde (evinde) yetişmediyse ona helaldir\" dese —çünkü o, Allah Azze ve Celle'nin rebîbenin haramlığında iki şart koştuğu görüşündedir;"], [225.2, "Allah Azze ve Celle şöyle buyurmuştur:"], [227.4, "<span class=\"ayah\">﴿…ve kendileriyle zifafa girdiğiniz hanımlarınızdan olup himayenizde bulunan üvey kızlarınız…﴾<\/span> [Nisâ 23]— sakın onu tekfir etme."], [236.0, "Çünkü âlimlerden, rebîbenin haramlığında iki şartın birlikte bulunmasını şart koşanlar vardır."], [243.5, "Gerçi doğru olan, sadece annesiyle zifafa girmenin, annesinin kocasının himayesinde yetişsin ya da yetişmesin, onun haram olması için yeterli olmasıdır;"], [259.0, "çünkü ayette himaye kaydının zikredilmesi, ancak \"çoğunlukla olanı\" ifade eden kayıtlardandır."]]}, {"reader": false, "ar": [[267.0, "ولو جاءنا رجلٌ وأجاز للناس أن يصلّوا في بيوتهم ويتركوا صلاة الجماعة،"], [276.0, "فإيّاك أن تكفّره باستحلاله لهذا الحرام؛"], [281.0, "لأنّ العلماء لا يزالون يختلفون في مسألة حكم صلاة..."], [286.0, "حكم صلاة إيش؟ حكم صلاة الجماعة."], [290.0, "وهكذا نقول في كلِّ محرَّمٍ ثبت الخلافُ فيه عن طريقٍ معتبر،"], [301.0, "بمعنى أنه لا يُعتبر من الخلاف الشاذّ،"], [305.0, "وإنما من الخلاف المعتبر الذي قال به إمامٌ معتبر."]], "tr": [[267.0, "Bir adam bize gelip insanlara evlerinde namaz kılmalarını ve cemaat namazını terk etmelerini caiz görse, sakın onu bu haramı helal sayması sebebiyle tekfir etme;"], [281.0, "çünkü âlimler … namazının hükmü meselesinde —neyin namazının hükmü?"], [286.0, "Cemaat namazının hükmü meselesinde— hâlâ ihtilaf etmektedir."], [290.0, "Muteber bir yoldan ihtilafın sabit olduğu her haram için böyle deriz;"], [301.0, "yani şâz (aykırı, tek kalmış) ihtilaftan sayılmayan, aksine muteber bir imamın söylediği muteber ihtilaftan olan."]]}, {"reader": false, "ar": [[310.0, "ويبقى التكفيرُ باستحلال الحرام محصورًا ومقصورًا في تلك المحرّمات التي أجمع العلماء إجماعًا قطعيًّا منقولًا بالتواتر،"], [326.0, "ينقله الخالفُ عن السالف،"], [328.8, "ممّا تواترت عليه الأدلّة. والله أعلم."]], "tr": [[310.0, "Haramı helal saymakla tekfir ise, âlimlerin tevâtürle nakledilmiş, sonrakilerin öncekilerden aktardığı, delillerin üzerinde tevâtür ettiği kat'î bir icmâ ile icmâ ettiği haramlarla sınırlı ve onlara münhasır kalır. Allah en iyisini bilir."]]}]}, {"ts": "05:35", "title": "12. Külliye: Bir şeyi helal olduğuna inanarak yapan müstahildir", "paras": [{"reader": false, "ar": [[335.0, "ومن الكلّيّات أيضًا: <b>كلُّ من فعل الشيءَ معتقدًا حِلَّه فمستحِلّ.<\/b> <span class=\"note\">(يكررها)<\/span> وذلك لأنني قلتُ سابقًا بأنّ الكبيرة لا يُكفَّر بها بمجرّد فعلها،"], [377.0, "بل لا بدّ أن يقترن بالفعل الاستحلال."], [380.0, "وبيّنتُ لكم أنّ الاستحلال ينقسم إلى قسمين:"], [384.0, "إلى استحلالٍ عمليٍّ ظاهري،"], [387.0, "وإلى استحلالٍ قلبيٍّ باطني."], [390.0, "والاستحلالُ الذي هو شرطٌ في التكفير بفعل الكبيرة إنما هو الاستحلال الباطني."]], "tr": [[335.0, "Külliyelerden biri de şudur: 12."], [337.1, "külliye: Bir şeyi helal olduğuna inanarak yapan herkes müstahildir (onu helal saymıştır). (Tekrar ediyor.) Bu şundandır:"], [346.8, "Daha önce, büyük günahın sırf işlenmesiyle tekfir edilmeyeceğini, aksine fiile istihlâlin (helal saymanın) eşlik etmesi gerektiğini söylemiştim."], [380.0, "Size istihlâlin iki kısma ayrıldığını açıklamıştım:"], [384.0, "Amelî, zahirî istihlâl ve kalbî, bâtınî istihlâl."], [390.0, "Büyük günahı işlemekle tekfirde şart olan istihlâl ise ancak bâtınî istihlâldir."]]}, {"reader": false, "ar": [[396.0, "فمتى يوصَف الإنسان بأنه مستحِلٌّ الاستحلالَ الموجبَ للتكفير؟"], [403.0, "الجواب: هو مقتضى هذه الكلّيّة،"], [406.4, "وهي أن يفعله معتقدًا في قرارة قلبه أنه حلال."], [415.0, "وقد عرّف العلماءُ الاستحلالَ بما ذكرته هذه الكلّيّة؛"], [421.0, "فقال ابن تيمية رحمه الله:"], [424.0, "«والاستحلال: اعتقادُ أنها حلالٌ له، وذلك تارةً يكون باعتقاد أنّ الله أحلّها، وتارةً باعتقاد أنّ الله لم يحرّمها، وتارةً بعدم اعتقاد أنّ الله حرّمها، وهذا يكون لخللٍ في الإيمان بالربوبيّة، أو لخللٍ في الإيمان بالرسالة، ويكون جحدًا محضًا غيرَ مبنيٍّ على مقدّمةٍ أصلًا». انتهى كلامه."]], "tr": [[396.0, "İnsan ne zaman tekfiri gerektiren istihlâlle müstahil olarak nitelenir?"], [403.0, "Cevap: Bu külliyenin gereğidir; yani onu, kalbinin derinliğinde helal olduğuna inanarak yapmasıdır."], [415.0, "Âlimler istihlâli bu külliyenin zikrettiği şekilde tarif etmişlerdir."], [421.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [424.0, "\"İstihlâl, onların (haramların) kendisi için helal olduğuna inanmaktır."], [427.7, "Bu bazen Allah'ın onları helal kıldığına inanmakla, bazen Allah'ın onları haram kılmadığına inanmakla, bazen de Allah'ın onları haram kıldığına inanmamakla olur."], [441.0, "Bu da ya rubûbiyyete imandaki bir bozukluktan ya da risâlete imandaki bir bozukluktan kaynaklanır ve hiçbir öncüle dayanmayan katıksız bir inkâr olur.\" Sözü bitti."]]}, {"reader": false, "ar": [[455.0, "يعني: يستحلّها من غير دليل،"], [458.0, "يقول: هي حلال، ولا تسألوني عن سببيّة التحليل."], [466.0, "ويؤكّد ذلك المعنى الإمامُ ابن القيّم رحمه الله تعالى في قوله:"], [470.0, "«المستحِلُّ للشيء هو الذي يفعله معتقدًا حِلَّه»."], [477.0, "انتهى كلامه رحمه الله."]], "tr": [[455.0, "Yani onu delilsiz helal sayar;"], [458.7, "\"O helaldir, bana helal kılmanın sebebini sormayın\" der."], [466.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— bu anlamı şu sözüyle pekiştirir:"], [470.0, "\"Bir şeyi helal sayan (müstahil), onu helal olduğuna inanarak yapan kimsedir.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[479.0, "ولكن لا بدّ أن يكون هذا الاستحلالُ غيرَ مقرونٍ بشبهةٍ ولا بتأويل؛"], [490.0, "لأنه متى ما كان استحلالًا مقرونًا بشبهةٍ أو تأويل،"], [496.0, "فإننا ننتظر بتكفيره حتى نكشف شبهتَه ونُبطل تأويلَه،"], [504.0, "فإن زالت الشبهةُ وأصرّ كفر."], [509.0, "كما في حديث قُدامة بن مظعون لمّا استحلّ الخمر في عهد عمر رضي الله تعالى عنه وأرضاه،"], [520.0, "فإنّ الصحابة سألوه عن سببيّة هذا التحليل،"], [529.0, "فأبدى لهم بأنه داخلٌ في قول الله عز وجل:"], [533.0, "<span class=\"ayah\">﴿لَيْسَ عَلَى الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ جُنَاحٌ فِيمَا طَعِمُوا إِذَا مَا اتَّقَوا وَّآمَنُوا وَعَمِلُوا الصَّالِحَاتِ ثُمَّ اتَّقَوا وَّآمَنُوا ثُمَّ اتَّقَوا وَّأَحْسَنُوا ۗ وَاللَّهُ يُحِبُّ الْمُحْسِنِينَ﴾<\/span> <span class=\"ref\">[المائدة: ٩٣]<\/span>."]], "tr": [[479.0, "Fakat bu istihlâlin bir şüpheyle ya da bir te'vil ile birlikte olmaması gerekir."], [490.0, "Çünkü şüpheyle ya da te'vil ile birlikte bir istihlâl olduğunda, şüphesini giderip te'vilini çürütünceye kadar onu tekfir etmeyi bekleriz."], [502.1, "Şüphe giderilir de ısrar ederse kâfir olur."], [509.0, "Ömer —Allah ondan razı olsun ve onu razı etsin— döneminde içkiyi helal saydığında Kudâme b."], [518.0, "Maz'ûn'un hadisinde olduğu gibi: Sahabe ona bu helal saymanın sebebini sordular;"], [523.7, "o da onlara bunun Allah Azze ve Celle'nin şu sözüne girdiğini söyledi:"], [533.0, "<span class=\"ayah\">﴿İman edip salih ameller işleyenlere, (haram kılınmadan önce) yediklerinden dolayı bir günah yoktur; yeter ki sakınsınlar, iman etsinler ve salih ameller işlesinler; sonra sakınsınlar ve iman etsinler; sonra da sakınsınlar ve iyilik etsinler. Allah iyilik edenleri sever﴾<\/span> [Mâide 93]."]]}, {"reader": false, "ar": [[545.0, "يقول: وأنا ممّن آمن واتّقى وعمل الصالحات وأحسن،"], [549.0, "فالله عز وجل يقول لي:"], [552.0, "كُلْ ما تشاء، واشربْ ما تشاء،"], [555.9, "فليس عليك جناحٌ فيما طعمتَ أو ما شربت."], [560.0, "فقال له عمر كلمتَه المشهورة:"], [563.0, "لو اتّقيتَ الله لما شربتَها."], [564.7, "فجلده الحدَّ، لكن لم يكفّره،"], [568.0, "مع أنّ تحريم الخمر من التحريم المجمَع عليه والمعلوم بالتواتر."], [575.0, "فالاستحلالُ الذي نكفّر به لا بدّ أن يكون استحلالًا ـ ها ـ غيرَ مقرونٍ لا بشبهةٍ ولا بتأويل. والله أعلم."]], "tr": [[545.0, "Diyordu ki: \"Ben de iman eden, sakınan, salih ameller işleyen ve iyilik eden kimselerdenim."], [552.0, "Dolayısıyla Allah Azze ve Celle bana diyor ki:"], [555.4, "Dilediğini ye, dilediğini iç; yediğinden ya da içtiğinden dolayı sana bir günah yoktur.\" Bunun üzerine Ömer ona meşhur sözünü söyledi:"], [563.0, "\"Allah'tan sakınsaydın onu içmezdin.\" Ona had cezası olarak celde vurdu, fakat onu tekfir etmedi."], [568.7, "Hâlbuki içkinin haramlığı, üzerinde icmâ edilmiş ve tevâtürle bilinen haramlıklardandır."], [575.0, "Dolayısıyla kendisiyle tekfir ettiğimiz istihlâlin, ne bir şüpheyle ne de bir te'vil ile birlikte olmayan bir istihlâl olması gerekir. Allah en iyisini bilir."]]}]}, {"ts": "09:51", "title": "13. Külliye: Her istihlâl ısrardır, ama her ısrar istihlâl değildir", "paras": [{"reader": false, "ar": [[591.0, "ومن الكلّيّات أيضًا: كلُّ استحلالٍ فإصرار،"], [595.2, "وليس كلُّ إصرارٍ استحلالًا. <span class=\"note\">(يكررها)<\/span> أنا أحاول أؤكّد على الاستحلال هذا لكثرة المخالفين فيه."], [619.0, "أُعيدها مرّةً ثالثة: كلُّ استحلالٍ فإصرار،"], [623.2, "وليس كلُّ إصرارٍ استحلالًا."]], "tr": [[591.0, "Külliyelerden biri de şudur: 13."], [593.1, "külliye: Her istihlâl ısrardır, fakat her ısrar istihlâl değildir. (Tekrar ediyor.) Bu istihlâl (meselesi) üzerinde, ona muhalefet edenlerin çokluğu sebebiyle ısrarla durmaya çalışıyorum."], [619.0, "Üçüncü kez tekrar ediyorum: <b>Her istihlâl ısrardır, fakat her ısrar istihlâl değildir.<\/b>"]]}, {"reader": false, "ar": [[633.0, "والمقصود بالإصرار في الكلّيّة:"], [635.7, "أي طولُ المواظبة على فعل هذه المعصية سنين عددًا،"], [644.0, "فهذا يسمّيه العلماء بالإصرار."], [646.7, "لكن ما دام قلبُه معتقدًا تحريمَ ما يفعل،"], [654.0, "فإنه لا يُعتبر كافرًا،"], [657.0, "ومجرّدُ إصراره لا يلزم منه استحلالُ قلبه."], [663.0, "ولا بدّ من التفريق بين الأمرين؛"], [667.0, "لأننا نرى أنّ من العلماء في هذا الزمان من يجعلون مجرّدَ الإصرار وطولَ مزاولة المنكر دليلًا على استحلال القلب."]], "tr": [[633.0, "Külliyedeki ısrardan kastedilen, bu masiyeti yıllarca uzun süre devamlı işlemektir;"], [646.7, "âlimler buna ısrar der. Fakat kalbi, yaptığı şeyin haram olduğuna inandığı sürece kâfir sayılmaz;"], [657.0, "sırf ısrar etmesi, kalbinin onu helal saydığını gerektirmez."], [663.0, "Bu iki şeyi birbirinden ayırmak gerekir."], [667.0, "Çünkü bu zamanda âlimlerden bazılarının, sırf ısrarı ve münkeri uzun süre işlemeyi kalbin onu helal saydığına delil yaptıklarını görüyoruz."]]}, {"reader": false, "ar": [[682.0, "فيقولون: إنّ طول المواظبة على الإصرار وعدمَ قبول النصح دليلٌ على أنّ قلبه قد استحلّها،"], [693.0, "فيجعلونها من القرائن الدالّة على استحلال القلب."], [698.0, "وهذا خطأٌ بيّنٌ ظاهر."], [702.0, "فأهلُ السنة والجماعة لا يزالون ينصّون على أنّ الاستحلال العمليّ ـ وهو طولُ المواظبة على العمل ـ ليس لوحده بمسوِّغٍ للتكفير،"], [719.0, "بل لا بدّ أن يكون هذا الإصرارُ أو هذا الفعلُ نابعًا من استحلالٍ باطنيٍّ قلبيٍّ اعتقادي."]], "tr": [[682.0, "Derler ki: \"Israrla uzun süre devam etmesi ve nasihati kabul etmemesi, kalbinin onu helal saydığına delildir.\" Böylece bunu, kalbin helal saydığına delâlet eden karinelerden sayarlar."], [698.0, "Bu, apaçık ve belirgin bir hatadır."], [702.7, "Ehl-i Sünnet ve'l-Cemaat, amelî istihlâlin —yani amele uzun süre devam etmenin— tek başına tekfiri caiz kılan bir şey olmadığını, aksine bu ısrarın ya da bu fiilin bâtınî, kalbî, itikadî bir istihlâlden kaynaklanması gerektiğini açıkça belirtmeye devam etmektedir."]]}, {"reader": false, "ar": [[729.0, "ويؤكّد ذلك أهلُ السنة؛"], [733.0, "قال ابن تيمية رحمه الله تعالى ـ وتأمّلوا ما قال ـ:"], [737.0, "«العبدُ إذا فعل الذنبَ مع اعتقاد أنّ الله حرّمه عليه، واعتقادِ انقياده لله فيما حرّمه وأوجبه، فهذا ليس بكافر»."], [751.0, "انتهى كلامه. فالإصرار على فعل كبيرةٍ نصفه بأنه كبيرةٌ من كبائر الذنوب،"], [761.0, "ولكن لا يكون استحلالًا لها ما دام الفاعلُ لها يعتقد أنها حرام؛"], [768.0, "فلا يُحكم عليه بالكفر،"], [770.8, "ولكن يُحكم عليه بالفسق وبضعف الإيمان."]], "tr": [[729.0, "Ehl-i Sünnet bunu pekiştirir. İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi —ne dediğini iyi düşünün—:"], [737.0, "\"Kul, Allah'ın onu kendisine haram kıldığına inanarak ve Allah'ın haram ve vâcip kıldığı şeylerde O'na boyun eğdiğine inanarak günahı işlerse, bu kâfir değildir.\" Sözü bitti."], [751.0, "Bir büyük günahı işlemekte ısrar etmeyi büyük günahlardan bir büyük günah olarak niteleriz;"], [761.0, "fakat onu işleyen, onun haram olduğuna inandığı sürece bu, onu helal saymak olmaz."], [768.0, "Dolayısıyla onun hakkında küfürle hükmedilmez;"], [770.8, "fakat fısk ve imanın zayıflığıyla hükmedilir."]]}, {"reader": false, "ar": [[775.0, "ونحو ذلك قال الخطيب الشربيني رحمه الله تعالى:"], [782.0, "«الكبيرة لا تصير بالمواظبة كفرًا»."], [789.0, "انتهى كلامه. وقال الشيخ ابن باز رحمه الله تعالى:"], [794.0, "«إذا أقام ـ أي: أصرّ وطال زمانُ الفعل ـ إذا أقام على المعاصي فهو تحت مشيئة الله؛ قد يغفر له، وقد يدخل النار بذنوبه التي أصرّ عليها ولم يتب، حتى إذا طَهُر ونُقّي منها أُخرج من النار إلى الجنة». انتهى كلامه."]], "tr": [[775.0, "Hatîb eş-Şirbînî —Allah ona rahmet etsin— de buna benzer şekilde şöyle dedi:"], [782.0, "\"Büyük günah, devamlı işlenmekle küfür olmaz.\" Sözü bitti."], [789.0, "Şeyh İbn Bâz —Allah ona rahmet etsin— şöyle dedi:"], [794.0, "\"Masiyetler üzerinde durursa —yani ısrar ederse ve fiilin süresi uzarsa— masiyetler üzerinde durursa Allah'ın meşîeti altındadır:"], [805.2, "Allah onu bağışlayabilir de; ısrar edip tövbe etmediği günahları sebebiyle cehenneme de girebilir, sonra onlardan temizlenip arındığında cehennemden çıkarılıp cennete götürülür.\" Sözü bitti."]]}, {"reader": false, "ar": [[820.0, "وقال الشيخ صالح الفوزان حفظه الله:"], [824.0, "«الإصرار على الكبيرة التي هي دون الشرك لا يصيّر المصرَّ عليها كافرًا؛ لأنها ما دامت دون الشرك ودون الكفر فإنه يُعتبر فاسقًا، ولا يخرج من الملّة ولو أصرّ عليها»."], [847.0, "انتهى كلامه رحمه الله."], [849.0, "وبناءً على ذلك: فمن أصرّ على الربا زمانًا طويلًا معتقدًا تحريمه فليس بكافر،"], [858.0, "ومن أصرّ على الزنا زمانًا طويلًا معتقدًا تحريمه فليس بكافر،"], [865.0, "ومن أصرّ على شهادة الزور زمانًا طويلًا معتقدًا تحريمها فليس بكافر."]], "tr": [[820.0, "Şeyh Sâlih el-Fevzân —Allah onu korusun— şöyle dedi:"], [824.0, "\"Şirkten aşağı olan büyük günahta ısrar etmek, onda ısrar edeni kâfir yapmaz."], [836.7, "Çünkü o (günah) şirkten ve küfürden aşağı olduğu sürece o kişi fâsık sayılır;"], [847.0, "onda ısrar etse bile milletten çıkmaz.\" Sözü bitti, Allah ona rahmet etsin."], [851.0, "Buna göre: Faizin haram olduğuna inanarak uzun süre faizde ısrar eden kâfir değildir."], [858.0, "Zinanın haram olduğuna inanarak uzun süre zinada ısrar eden kâfir değildir."], [865.0, "Yalancı şahitliğin haram olduğuna inanarak uzun süre yalancı şahitlikte ısrar eden kâfir değildir."]]}, {"reader": false, "ar": [[875.0, "ومن أصرّ على قذف المحصنات الغافلات المؤمنات زمانًا طويلًا ـ ما سلم أحدٌ من لسانه ـ معتقدًا حرمةَ ما يفعل،"], [886.0, "فإنه ليس بكافر. ومن أصرّ على إسبال الثياب زمانًا طويلًا معتقدًا تحريمه فليس بكافر."], [898.0, "ومن أصرّ على الكذب زمانًا طويلًا معتقدًا حرمته فليس بكافر."], [905.0, "وهكذا دواليك؛ فليس مجرّدُ الإصرار وطولِ زمان المواظبة على هذه المعصية تجعلنا نكفّره،"], [916.0, "وليس ذلك الإصرارُ بدليلٍ على استحلال..."], [920.0, "على استحلال القلب، على استحلال القلب. والله أعلم."]], "tr": [[875.0, "Yaptığının haram olduğuna inanarak uzun süre namuslu, (kötülükten) habersiz, mümin kadınlara zina iftirasında bulunmakta ısrar eden —ki dilinden kimse kurtulmamıştır— kâfir değildir."], [889.0, "Haram olduğuna inanarak uzun süre elbiseyi sarkıtmakta (isbâl) ısrar eden kâfir değildir."], [898.0, "Haram olduğuna inanarak uzun süre yalanda ısrar eden kâfir değildir."], [905.0, "Bu böyle devam eder. Sırf ısrar ve bu masiyete uzun süre devam etmek, onu tekfir etmemizi gerektirmez;"], [916.0, "bu ısrar, kalbin helal saymasına… kalbin helal saymasına, kalbin helal saymasına delil değildir. Allah en iyisini bilir."]]}]}, {"ts": "15:26", "title": "14. Külliye: Allah'ın halis hakkı olan şeyde misilleme yapılmaz", "paras": [{"reader": false, "ar": [[926.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما كان حقًّا محضًا لله...<\/b> ـ أحسنت ـ <b>فلا يُقتَصُّ فيه بالمماثلة.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [960.0, "<b>كلُّ ما كان حقًّا لله محضًا فلا يُقتَصُّ فيه بالمماثلة.<\/b>"]], "tr": [[926.0, "Külliyelerden biri de şudur: 14."], [927.0, "külliye: Allah'ın halis (yalnızca O'na ait) hakkı olan her şeyde… —güzel (doğru söyledin)— …misilleme yoluyla kısas yapılmaz. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [961.4, "<b>Allah'ın halis hakkı olan her şeyde misilleme yoluyla kısas yapılmaz.<\/b>"]]}, {"reader": false, "ar": [[967.0, "وذلك لأنّ الحقوق إمّا أن تكون من حقوق الله المحضة،"], [973.7, "والتي لا مدخلَ للمخلوق فيها،"], [980.0, "وإمّا أن تكون من حقوق المخلوقين المحضة."], [985.0, "والقصاصُ بالمماثلة المذكورُ في قول الله عز وجل:"], [990.5, "<span class=\"ayah\">﴿وَجَزَاءُ سَيِّئَةٍ سَيِّئَةٌ مِّثْلُهَا﴾<\/span> <span class=\"ref\">[الشورى: ٤٠]<\/span>،"], [998.0, "وفي قول الله عز وجل:"], [1001.3, "<span class=\"ayah\">﴿وَإِنْ عَاقَبْتُمْ فَعَاقِبُوا بِمِثْلِ مَا عُوقِبْتُم بِهِ﴾<\/span> <span class=\"ref\">[النحل: ١٢٦]<\/span>،"], [1006.0, "فإنّ تلك المماثلة إنما تكون في حقوق المخلوقين المحضة."], [1013.0, "فإذا اعتدى عليك أحدٌ في حقّك المحض،"], [1017.5, "فإنّ الشريعة تُجيز لك أن تقتصّ منه بمثل جُرمه فيك."]], "tr": [[967.0, "Bu şundandır: Haklar ya Allah'ın, mahlûkun hiçbir dahlinin olmadığı halis haklarındandır ya da mahlûkların halis haklarındandır."], [985.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bir kötülüğün karşılığı, onun gibi bir kötülüktür﴾<\/span> [Şûrâ 40] sözünde ve <span class=\"ayah\">﴿Eğer ceza verecekseniz, size yapılanın misliyle ceza verin﴾<\/span> [Nahl 126] sözünde zikredilen misilleme yoluyla kısas;"], [1013.0, "işte bu misilleme ancak mahlûkların halis haklarında olur."], [1016.2, "Biri senin halis hakkında sana saldırırsa, şeriat ona, sana karşı işlediği suçun misliyle kısas yapmana izin verir."]]}, {"reader": false, "ar": [[1024.0, "كما أنّ يهوديًّا رضّ رأسَ جاريةٍ بين حجرين،"], [1032.0, "فأُتي بها، فقيل: من فعل بكِ كذا؟"], [1038.0, "فلانٌ؟ فلانٌ؟ فلانٌ؟ حتى سمَّوا ذلك اليهوديَّ،"], [1044.0, "فأومأت برأسها، فأُتي به إلى النبيّ صلى الله عليه وسلم،"], [1051.0, "فأمر به فرُضَّ رأسُه بين حجرين."]], "tr": [[1024.0, "Nitekim bir Yahudi bir cariyenin başını iki taş arasında ezmişti."], [1028.3, "Cariye getirildi ve \"Sana bunu kim yaptı?"], [1034.2, "Falan mı? Falan mı? Falan mı?\" denildi;"], [1040.2, "nihayet o Yahudi'nin adını söylediler, o da başıyla işaret etti."], [1046.6, "Bunun üzerine Yahudi, Nebî ﷺ'e getirildi;"], [1049.8, "o da emretti ve onun başı iki taş arasında ezildi."]]}, {"reader": false, "ar": [[1057.0, "وأمّا ما كان من حقوق الله المحضة ـ يعني أنّ الله حرّمه لحقّه الخالص ـ فإنه لا يحلّ لك أن تعامل من جنى عليك به بمثله."], [1075.0, "فمن كذب عليك فلا حقَّ لك أن تكذب عليه؛"], [1080.0, "لأنّ تحريم الكذب من حقوق الله المحضة."], [1084.0, "ومن زنى بحريمك فلا حقَّ لك أن تزني بحريمه مقاصّةً ومماثلةً؛"], [1094.0, "لأنّ الزنا محرّمٌ لحقّ الله."], [1097.0, "ومن تلوّط بغلامك فلا حقَّ لك أن تتلوّط بغلامه؛"], [1102.1, "لأنّ اللواط محرّمٌ لحقّ الله."], [1105.0, "ومن قذف عِرضَك فلا حقَّ لك أن تقذف عِرضَه؛"], [1113.0, "لأنّ تحريم القذف من حقوق الله المحضة."]], "tr": [[1057.0, "Allah'ın halis haklarından olana —yani Allah'ın kendi halis hakkı için haram kıldığı şeye— gelince, sana onunla cinayet işleyene onun mislini yapman helal değildir."], [1075.0, "Sana yalan söyleyene yalan söyleme hakkın yoktur;"], [1080.0, "çünkü yalanın haram kılınması Allah'ın halis haklarındandır."], [1084.0, "Senin haremine (ailene) zina edenin haremine karşılık ve misilleme olarak zina etme hakkın yoktur;"], [1094.0, "çünkü zina Allah'ın hakkı için haram kılınmıştır."], [1097.0, "Senin oğluna livata yapanın oğluna livata yapma hakkın yoktur;"], [1102.1, "çünkü livata Allah'ın hakkı için haram kılınmıştır."], [1105.0, "Senin namusuna iftira edenin namusuna iftira etme hakkın yoktur;"], [1113.0, "çünkü iftiranın (kazf) haram kılınması Allah'ın halis haklarındandır."]]}, {"reader": false, "ar": [[1119.0, "وكذلك نقول: من كفّرك فلا حقَّ لك أن تبادله بالتكفير؛"], [1127.0, "لأنّ حرمة تكفير المسلم من حقوق الله المحضة."], [1135.0, "ومن فسّقك فلا حقَّ لك أن تحكم بفسقه؛"], [1141.0, "لأنّ تفسيق المسلم من حقوق الله المحضة."], [1145.0, "وهكذا دواليك في كلّ حكمٍ يُصدره غيرُك عليك ويكون من حقوق الله المحضة،"], [1156.0, "فإيّاك أن تعامله بالمثل؛"], [1158.7, "فما كان محرّمًا لحقّ الله فلا تدخل فيه المماثلة."]], "tr": [[1119.0, "Aynı şekilde deriz ki: Seni tekfir edene tekfirle karşılık verme hakkın yoktur;"], [1127.0, "çünkü Müslümanı tekfir etmenin haramlığı Allah'ın halis haklarındandır."], [1135.0, "Seni fısk ile itham edenin fâsık olduğuna hükmetme hakkın yoktur;"], [1141.0, "çünkü Müslümanı fâsık saymak Allah'ın halis haklarındandır."], [1145.0, "Başkasının senin hakkında verdiği ve Allah'ın halis haklarından olan her hükümde bu böyle devam eder;"], [1153.1, "sakın ona misliyle karşılık verme."], [1158.7, "Allah'ın hakkı için haram kılınmış olan şeye misilleme girmez."]]}, {"reader": false, "ar": [[1167.0, "قال الإمام ابن تيمية رحمه الله في ردّه على البكريّ الأشعريّ الجهميّ ـ تأمّلوا معي ـ:"], [1176.0, "«فلهذا كان أهلُ العلم والسنة لا يكفّرون من خالفهم وإن كان ذلك المخالف يكفّرهم؛ لأنّ الكفر حكمٌ شرعي، فليس للإنسان أن يعاقب بمثله، كمن كذب عليك وزنى بأهلك، ليس لك أن تكذب عليه وتزني بأهله؛ لأنّ الكذب والزنا حرامٌ لحقّ الله ـ ها ـ لأنّ الكذب والزنا حرامٌ لحقّ الله. وكذلك التكفير حقٌّ لله، فلا يُكفَّر إلا من كفّره الله ورسوله."]], "tr": [[1167.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— Eş'arî ve Cehmî olan el-Bekrî'ye reddiyesinde şöyle dedi —benimle birlikte düşünün—:"], [1175.5, "\"Bu yüzden ilim ve sünnet ehli, kendilerine muhalefet edeni, o muhalif kendilerini tekfir etse bile tekfir etmezlerdi."], [1184.1, "Çünkü küfür şer'î bir hükümdür;"], [1193.3, "insanın onun misliyle cezalandırma hakkı yoktur."], [1196.0, "Tıpkı sana yalan söyleyen ve ailene zina eden kimse gibi:"], [1206.0, "Senin ona yalan söyleme ve onun ailesine zina etme hakkın yoktur;"], [1211.7, "çünkü yalan ve zina Allah'ın hakkı için haramdır —evet— çünkü yalan ve zina Allah'ın hakkı için haramdır."], [1223.8, "Tekfir de böyledir; Allah'ın hakkıdır."], [1227.0, "Allah'ın ve Resûlü'nün tekfir ettiğinden başkası tekfir edilmez."]]}, {"reader": false, "ar": [[1233.0, "وأيضًا فإنّ تكفير الشخص المعيَّن وجوازَ قتله موقوفٌ على أن تبلغه الحجّةُ النبويّة التي يكفُر من خالفها،"], [1242.0, "وإلا فليس كلُّ من جهل شيئًا من الدين يكفر»."], [1245.0, "انتهى كلامه رحمه الله."], [1247.0, "والشاهد منه قوله ـ ها ـ:"], [1249.0, "«لأنّ الكذب والزنا حرامٌ لحقّ الله»."], [1255.0, "فأخذنا منها هذه الكلّيّة:"], [1257.0, "أنّ ما كان حرامًا لحقّ الله المحض فلا يُعاقَب فيه بالمثل."], [1263.0, "انتهى كلامه. والله أعلم."]], "tr": [[1233.0, "Ayrıca muayyen bir şahsın tekfiri ve onun öldürülmesinin caizliği, kendisine, ona muhalefet edenin kâfir olacağı nebevî hüccetin ulaşmasına bağlıdır."], [1241.2, "Aksi hâlde dinden bir şeyi bilmeyen herkes kâfir olmaz.\" Sözü bitti, Allah ona rahmet etsin."], [1247.0, "Bu sözden delil olan kısım —evet— şu sözüdür:"], [1249.0, "\"Çünkü yalan ve zina Allah'ın hakkı için haramdır.\" Bu külliyeyi buradan aldık:"], [1257.0, "Allah'ın halis hakkı için haram olan şeyde misliyle cezalandırılmaz."], [1263.0, "Söz bitti. Allah en iyisini bilir."]]}]}, {"ts": "21:08", "title": "15. Külliye: Zan ve vehim üzerine bina edilen her tekfir haramdır", "paras": [{"reader": false, "ar": [[1268.0, "الكلّيّة التي بعدها: <b>كلُّ تكفيرٍ بُني على ظنٍّ ووهمٍ فمحرَّم.<\/b> كلُّ تكفيرٍ مبنيٍّ على الظنون والأوهام فمحرَّم،"], [1278.9, "كلُّ تكفيرٍ مبنيٍّ على الظنون والأوهام فمحرَّم."], [1295.0, "أُعيدها مرّةً ثانية، ولّا واضحة؟ طيّب."]], "tr": [[1268.0, "Sonraki külliye: <b>15. külliye: Zan ve vehim üzerine bina edilen her tekfir haramdır.<\/b> Zanlar ve vehimler üzerine bina edilen her tekfir haramdır;"], [1278.9, "zanlar ve vehimler üzerine bina edilen her tekfir haramdır."], [1295.0, "Bir kez daha tekrar edeyim mi, yoksa açık mı? Peki."]]}, {"reader": false, "ar": [[1299.0, "يقول الإمام ابن عبد البرّ رحمه الله:"], [1303.0, "«القرآن والسنة ينهيان عن تفسيق المسلم وتكفيره ببيان... إلا ببيانٍ لا إشكالَ فيه. فالواجب في النظر ألّا يُكفَّر إلا من اتّفق الجميع على تكفيره، أو قام على تكفيره دليلٌ لا مدفعَ له من كتابٍ أو سنة»."], [1329.7, "انتهى كلامه. كلُّ ذلك من باب دفع التكفير بالأوهام ومجرّد الظنون والتخرّصات."]], "tr": [[1299.0, "İmam İbn Abdilber —Allah ona rahmet etsin— şöyle der:"], [1303.0, "\"Kur'an ve Sünnet, Müslümanı fâsık saymayı ve tekfir etmeyi … ancak hiçbir müşkil bulunmayan bir açıklık (delil) ile (olması dışında) yasaklar."], [1316.4, "Dolayısıyla bakış (ve araştırma) açısından vâcip olan, ancak herkesin tekfirinde ittifak ettiği ya da tekfirine dair Kitap'tan veya Sünnet'ten reddedilemez bir delil bulunan kimsenin tekfir edilmesidir.\" Sözü bitti."], [1329.7, "Bütün bunlar, vehimlerle, sırf zanlarla ve tahminlerle tekfiri defetmek kabilindendir."]]}, {"reader": false, "ar": [[1337.0, "يقول الإمام ابن تيمية رحمه الله تعالى:"], [1341.0, "«ليس لأحدٍ أن يكفّر أحدًا من المسلمين وإن أخطأ وغلط حتى تُقام عليه الحجّة وتُبيَّن له المحجّة، ومن ثبت إيمانُه بيقينٍ لم يَزُل ذلك عنه بالشكّ، بل لا يزول إلا بعد إقامة الحجّة وإزالة الشبهة»."], [1360.9, "انتهى كلامه. فالتكفير الذي نراه قبل إقامة الحجّة أو مع وجود الشبهة،"], [1368.0, "كلُّه من باب التكفير بالظنون والأوهام والأهواء."]], "tr": [[1337.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle der:"], [1341.0, "\"Hiç kimsenin, Müslümanlardan birini, hata etse ve yanılsa bile, ona hüccet ikame edilip doğru yol kendisine açıklanmadıkça tekfir etme hakkı yoktur."], [1351.0, "İmanı yakînen sabit olan kimseden bu (iman) şüpheyle zail olmaz;"], [1355.4, "aksine ancak hüccetin ikamesinden ve şüphenin giderilmesinden sonra zail olur.\" Sözü bitti."], [1360.9, "Hüccet ikame edilmeden önce ya da şüphe varken gördüğümüz tekfirin hepsi, zanlar, vehimler ve hevâlarla tekfir kabilindendir."]]}, {"reader": false, "ar": [[1371.0, "ويقول ابن حجر الهيتميّ رحمه الله ـ انتبهوا،"], [1375.3, "انتبهوا لهذا النقل ـ: «ينبغي للمفتي أن يحتاط في التكفير ما أمكنه؛ لعِظَم خطره، وغلبةِ عدم قصده، سيّما من العوامّ، وما زال أئمّتنا على ذلك قديمًا وحديثًا»."], [1398.0, "انتهى كلامه. فيحكي عن نفسه وعن أئمّته أنهم يحذّرون من التكفير الذي بُني على ظنونٍ وأوهامٍ وتخرّصات."]], "tr": [[1371.0, "İbn Hacer el-Heytemî —Allah ona rahmet etsin— şöyle der —dikkat edin, bu nakle dikkat edin—:"], [1376.0, "\"Müftînin, tehlikesinin büyüklüğü ve —özellikle avamdan— çoğunlukla kastedilmemiş olması sebebiyle, tekfirde mümkün olduğu kadar ihtiyatlı davranması gerekir."], [1387.6, "İmamlarımız eskiden de yeniden de bu yol üzere olmaya devam etmişlerdir.\" Sözü bitti."], [1398.0, "Kendisinden ve imamlarından, zanlar, vehimler ve tahminler üzerine bina edilmiş tekfirden sakındırdıklarını nakletmektedir."]]}, {"reader": false, "ar": [[1413.0, "وقال ابن عابدين رحمه الله من الحنفيّة:"], [1416.0, "«الكفر شيءٌ عظيم، فلا أجعل المؤمنَ كافرًا متى وجدتُ روايةً أنه لا يكفر»."], [1428.0, "انتهى كلامه. ولحلاوته سأُعيده؛"], [1433.0, "قال ابن عابدين رحمه الله:"], [1436.0, "«الكفر شيءٌ عظيم، فلا أجعل المؤمن كافرًا متى ما وجدتُ روايةً أنه لا يكفر»."]], "tr": [[1413.0, "Hanefîlerden İbn Âbidîn —Allah ona rahmet etsin— şöyle dedi:"], [1416.0, "\"Küfür büyük bir şeydir. Kâfir olmayacağına dair bir rivayet bulduğum sürece mümini kâfir saymam.\" Sözü bitti."], [1428.0, "Tatlılığından dolayı onu tekrar edeceğim."], [1433.0, "İbn Âbidîn —Allah ona rahmet etsin— şöyle dedi:"], [1436.7, "\"Küfür büyük bir şeydir. Kâfir olmayacağına dair bir rivayet bulduğum sürece mümini kâfir saymam.\""]]}, {"reader": false, "ar": [[1444.0, "وقال الشوكانيّ رحمه الله:"], [1448.0, "«اعلم أنّ الحكم على الرجل المسلم بخروجه من دين الإسلام ودخوله في الكفر لا ينبغي لمسلمٍ يؤمن بالله واليوم الآخر أن يُقدم عليه إلا ببرهانٍ أوضحَ من شمس النهار»."], [1467.0, "انتهى كلامه رحمه الله."], [1470.0, "وبه تعلم ـ وفّقك الله ـ أنّ التكفير قبل إقامة الحجّة من التكفير بالظنّ والوهم،"], [1477.0, "والتكفيرَ قبل إزالة الشبهة من التكفير بالظنّ والوهم."], [1482.0, "وكافّةُ المنقول من التكفير عن الخوارج والمعتزلة إنما هو من باب التكفير بالوهم والظنّ."]], "tr": [[1444.0, "Şevkânî —Allah ona rahmet etsin— şöyle dedi:"], [1448.0, "\"Bil ki Müslüman bir adamın İslam dininden çıktığına ve küfre girdiğine hükmetmeye, Allah'a ve âhiret gününe iman eden bir Müslümanın, gündüz güneşinden daha açık bir burhan olmadıkça girişmesi uygun değildir.\" Sözü bitti, Allah ona rahmet etsin."], [1470.0, "Bununla bilirsin ki —Allah seni muvaffak kılsın— hüccet ikame edilmeden önce tekfir, zan ve vehimle tekfirdendir;"], [1477.0, "şüphe giderilmeden önce tekfir de zan ve vehimle tekfirdendir."], [1482.0, "Hâricîlerden ve Mu'tezile'den nakledilen tekfirin tamamı da ancak vehim ve zanla tekfir kabilindendir."]]}, {"reader": false, "ar": [[1494.0, "ومجرّدُ التكفير لمضاحكة المسلم للكافر هو من باب التكفير بالظنّ."], [1502.0, "بل وإننا سمعنا من يكفّر أو يبدّع بعض المسلمين بمجرّد الجلوس في مجالس الكفر؛"], [1511.0, "فبمجرّد جلوس المسلم مع بعض الكفّار يجعلها بعضُ من لا خَلاقَ له سبيلًا إلى تكفيره أو تبديعه."], [1521.0, "بل وسمعنا أنّ مِن (الناس مَن) بدّع وأخرج عن دائرة السنة بعضَ أهل السنة لمجرّد تصويره تصويرًا فوتوغرافيًّا مع بعض أهل البدع."]], "tr": [[1494.0, "Müslümanın bir kâfirle gülüşmesi sebebiyle sırf tekfir etmek de zanla tekfir kabilindendir."], [1502.0, "Hatta bazı Müslümanları sırf küfür meclislerinde oturdukları için tekfir eden ya da bid'atçi sayan kimseleri duyduk."], [1511.0, "(Dinden) hiçbir nasibi olmayan bazıları, Müslümanın sırf bazı kâfirlerle oturmasını onu tekfir etmeye ya da bid'atçi saymaya bir yol edinir."], [1522.1, "Hatta bazılarının, Ehl-i Sünnet'ten bazı kimseleri sırf bazı bid'at ehliyle fotoğraf çektirdiği için bid'atçi saydığını ve Sünnet dairesinin dışına çıkardığını duyduk."]]}, {"reader": false, "ar": [[1533.0, "ومنهم من يحكم على المسلم بالخروج من الملّة لمجرّد شهوده بعض أعياد الكفّار أو مشاركتهم في شيءٍ من ذلك."], [1546.0, "وكلُّ هذا ـ والله ـ من باب إيش؟"], [1550.0, "من باب التكفير بالهوى والظِّنّة."], [1553.0, "وبابُ التكفير شيءٌ عظيم،"], [1556.0, "فلا أجعل المسلمَ كافرًا ما دمتُ أجد له روايةً في أنه لا يكفُر."]], "tr": [[1533.0, "Onlardan bazıları da Müslümanın, sırf kâfirlerin bazı bayramlarında bulunması ya da onlara bunlardan bir şeyde katılması sebebiyle milletten çıktığına hükmeder."], [1546.0, "Bütün bunlar —vallahi— ne kabilindendir?"], [1550.0, "Hevâ ve zanla tekfir kabilindendir."], [1553.0, "Tekfir babı büyük bir şeydir;"], [1556.8, "onun kâfir olmayacağına dair bir rivayet bulduğum sürece Müslümanı kâfir saymam."]]}, {"reader": false, "ar": [[1562.0, "بل وإننا رأينا من يكفّر غيره مستندًا في تكفيره لحديثٍ موضوعٍ أو ضعيفٍ جدًّا،"], [1575.0, "فيقول: هذا الرجل فعل هذا الفعل فهو كافر،"], [1579.0, "بدليل كذا وكذا وكذا،"], [1581.0, "ثم وجدنا أنه يروي في هذا التكفير حديثًا موضوعًا."], [1586.0, "وكلُّ هذا من باب الاستعجال بالتكفير."], [1590.0, "ويدخل فيه أيضًا التكفيرُ باللوازم ـ التكفير باللوازم ـ والمآلاتِ قبل عرضها والتزامها،"], [1602.0, "فهو من التكفير بالأهواء."], [1604.0, "وبابُ التكفير بابٌ عظيم،"], [1606.0, "لا ينبغي الولوجُ فيه إلا ببرهانٍ أوضحَ من شمس النهار،"], [1612.9, "كما قال الشوكاني. والله أعلم."]], "tr": [[1562.0, "Hatta başkasını tekfir ederken uydurma ya da çok zayıf bir hadise dayanan kimseleri gördük."], [1575.5, "\"Bu adam şu fiili yaptı, dolayısıyla kâfirdir;"], [1578.5, "delili de şu şu şudur\" der;"], [1581.0, "sonra bu tekfirde uydurma bir hadis rivayet ettiğini gördük."], [1586.0, "Bütün bunlar tekfirde acele etmek kabilindendir."], [1590.0, "Lâzımlarla —lâzımlarla— ve (sözün) varacağı sonuçlarla, onlar (sahibine) arz edilip o bunları kabullenmeden önce tekfir etmek de buna girer;"], [1604.0, "bu da hevâlarla tekfirdendir. Tekfir babı büyük bir babdır;"], [1607.3, "Şevkânî'nin dediği gibi ona ancak gündüz güneşinden daha açık bir burhanla girmek gerekir. Allah en iyisini bilir."]]}]}, {"ts": "26:56", "title": "16. Külliye: Kat'î nas veya kat'î icmâ ile küfrü sabit olanın küfründen şüphe eden kâfirdir", "paras": [{"reader": false, "ar": [[1616.0, "ومن الكلّيّات أيضًا: كلُّ من شكّ في كفر..."], [1621.0, "كلُّ من شكّ في كفر من كفرُه ثبت بالنصّ التعيينيّ القاطع،"], [1642.0, "أو بالإجماع المتواتر القطعي،"], [1648.0, "فهو كافر. أنا استعجلتُ للذين يكتبون بعجلة،"], [1655.0, "ثم أقول مرّةً أخرى:"], [1657.0, "كلُّ من شكّ في كفر من ثبت كفرُه بالنصّ التعيينيّ القاطع ـ هذه واحدة ـ أو بالإجماع المتواتر القطعي،"], [1672.0, "فهو كافر. أُعيدها مرّةً أخرى:"], [1680.0, "كلُّ من شكّ في كفر من ثبت كفرُه بالنصّ التعيينيّ القاطع،"], [1689.0, "أو الإجماع المتواتر القاطع، فهو كافر."]], "tr": [[1616.0, "Külliyelerden biri de şudur: 16."], [1619.0, "külliye: Küfrü… Küfrü, (onu) tayin eden kat'î bir nasla ya da tevâtür derecesindeki kat'î bir icmâ ile sabit olan kimsenin küfründen şüphe eden herkes kâfirdir. Hızlı yazanlar için acele ettim;"], [1653.2, "sonra bir kez daha söylüyorum:"], [1657.0, "<b>Küfrü, tayin eden kat'î bir nasla<\/b> —bu birincisi— <b>ya da tevâtür derecesindeki kat'î bir icmâ ile sabit olan kimsenin küfründen şüphe eden herkes kâfirdir.<\/b> Bir kez daha tekrar ediyorum:"], [1680.0, "<b>Küfrü, tayin eden kat'î bir nasla ya da tevâtür derecesindeki kat'î bir icmâ ile sabit olan kimsenin küfründen şüphe eden herkes kâfirdir.<\/b>"]]}, {"reader": false, "ar": [[1696.0, "وهذه قاعدةُ تكفير من لم يكفّر الكافر،"], [1701.0, "وهي من القواعد المشهورة عند العلماء،"], [1707.0, "وهي أصلٌ صحيحٌ مجمَعٌ عليه بين أهل السنة والجماعة."], [1713.0, "ولكنهم مع إجماعهم إلا أنهم لا يطبّقونها إلا في دائرتين فقط:"], [1724.0, "في دائرة من ثبت كفرُه بالنصّ التعيينيّ القاطع،"], [1730.0, "أو في دائرة من ثبت كفرُه بالإجماع المتواتر القطعي."], [1737.0, "ولا يُدخلون فيها ـ بالإجماع ـ من ثبت كفرُه باجتهادك الشخصي."]], "tr": [[1696.0, "Bu, kâfiri tekfir etmeyeni tekfir etme kaidesidir."], [1701.0, "Âlimler nezdinde meşhur kaidelerdendir ve Ehl-i Sünnet ve'l-Cemaat arasında üzerinde icmâ edilmiş sahih bir asıldır."], [1713.0, "Fakat onlar, (buna dair) icmâlarına rağmen onu sadece iki dairede uygularlar:"], [1719.2, "Küfrü, tayin eden kat'î bir nasla sabit olan kimse dairesinde ya da küfrü tevâtür derecesindeki kat'î icmâ ile sabit olan kimse dairesinde."], [1737.0, "Küfrü senin şahsî içtihadınla sabit olan kimseyi —icmâ ile— buna dahil etmezler."]]}, {"reader": false, "ar": [[1745.0, "فتكفيرُ من لم يك..."], [1747.7, "فالشكُّ في كفر من ثبت كفرُه بالنصّ التعيينيّ هذا كفر،"], [1757.0, "والشكُّ في كفر من ثبت كفرُه بالإجماع القطعيّ المتواتر هذا كفر."], [1764.0, "فدائرةُ تطبيق أهل السنة لهذه الكلّيّة ـ أو لهذا الأصل ـ محصورٌ في هاتين الجهتين المذكورتين في هذه الكلّيّة."], [1778.0, "وهي من النواقض العشر التي ذكرها الإمام المجدّد رحمه الله تعالى في رسالته «نواقض الإسلام»،"], [1788.0, "والتي يريد الخوارج أن يوسّعوا دائرتها ليُدخلوا تكفيرهم الاجتهاديَّ تحت مظلّتها."]], "tr": [[1745.0, "(Tekfir etmeyeni tekfir etmek…) Küfrü, tayin eden nasla sabit olan kimsenin küfründen şüphe etmek küfürdür;"], [1753.7, "küfrü tevâtür derecesindeki kat'î icmâ ile sabit olan kimsenin küfründen şüphe etmek küfürdür."], [1764.0, "Ehl-i Sünnet'in bu külliyeyi —ya da bu aslı— uygulama dairesi, bu külliyede zikredilen bu iki yönle sınırlıdır."], [1778.0, "Bu (asıl), müceddid imamın —Allah ona rahmet etsin— \"Nevâkızu'l-İslâm\" risalesinde zikrettiği on nâkızdan biridir."], [1786.7, "Hâricîler ise kendi içtihadî tekfirlerini onun şemsiyesi altına sokmak için onun dairesini genişletmek isterler."]]}]}, {"ts": "30:02", "title": "16. Külliye (devam): Zatların, cinslerin ve vasıfların tayini; Bâkıllânî'nin sözü", "paras": [{"reader": false, "ar": [[1802.0, "ونحن ـ معاشرَ أهل السنة والجماعة ـ نرفض دخولَه بالإجماع <span class=\"q\">؟ 30:02<\/span>؛"], [1809.0, "فلا يدخل فيها إلا من كفّره النصُّ التعيينيّ باسمه أو طائفته،"], [1818.0, "أو كُفِّر بالإجماع القطعيّ المنقول خالفًا عن سالف."], [1826.0, "سواءٌ أكان تكفيرُه بالنصّ تكفيرَ تعيين،"], [1835.0, "كالنصّ الذي يحكم على إبليس بالكفر،"], [1839.0, "وعلى فرعون بالكفر، وعلى أبي لهبٍ بالكفر،"], [1847.0, "وعلى قارون وهامان بالكفر،"], [1851.0, "وعلى امرأة نوحٍ ولوطٍ بالكفر؛"], [1856.0, "فكلُّ من شكّ في كفر من نصّ الدليلُ التعيينيّ على كفرهم بالعين فهو كافر؛"], [1864.0, "لأنه مكذِّبٌ للمتواتر من كتاب الله عز وجل وللإجماع القطعي."]], "tr": [[1802.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğu ise onun (içtihadî tekfirin) buna girmesini icmâ ile <span class=\"q\">؟<\/span> reddederiz."], [1809.0, "Buna ancak, tayin eden nassın ismiyle ya da taifesiyle tekfir ettiği ya da sonrakilerin öncekilerden naklettiği kat'î icmâ ile tekfir edilen kimse girer."], [1826.0, "Onun nasla tekfiri ister zat tayiniyle bir tekfir olsun:"], [1837.0, "İblis'in küfrüne, Firavun'un küfrüne, Ebû Leheb'in küfrüne, Kârûn ile Hâmân'ın küfrüne, Nûh'un ve Lût'un karısının küfrüne hükmeden nas gibi."], [1856.0, "Tayin eden delilin, bizzat şahısları itibarıyla küfürlerini açıkça belirttiği bu kimselerin küfründen şüphe eden herkes kâfirdir;"], [1864.0, "çünkü Allah Azze ve Celle'nin Kitabı'ndan mütevâtir olanı ve kat'î icmâyı yalanlamaktadır."]]}, {"reader": false, "ar": [[1871.0, "ثم نقول أيضًا: أو كان كفرُهم بالجنس،"], [1875.8, "ككفر المشركين واليهود والنصارى والمجوس."], [1889.0, "فلو جاءنا رجلٌ وقال:"], [1891.8, "إنّ اليهود إخوانُنا وليسوا بكفّار،"], [1895.3, "كفر. أو قال: النصارى إخوانُنا وليسوا بكفّار،"], [1901.5, "كفر. أو قال بأنّ المجوس ـ عبدةَ النار ـ إخوانُنا ولا يجوز تكفيرهم، فإننا نكفّره."]], "tr": [[1871.0, "Sonra şunu da deriz: Ya da onların küfrü cins itibarıyla olsun;"], [1875.8, "müşriklerin, Yahudilerin, Hristiyanların ve Mecûsîlerin küfrü gibi."], [1889.0, "Bir adam bize gelip \"Yahudiler kardeşlerimizdir, kâfir değillerdir\" derse kâfir olur."], [1897.0, "Ya da \"Hristiyanlar kardeşlerimizdir, kâfir değillerdir\" derse kâfir olur."], [1904.0, "Ya da \"Ateşe tapan Mecûsîler kardeşlerimizdir, onları tekfir etmek caiz değildir\" derse, onu tekfir ederiz."]]}, {"reader": false, "ar": [[1914.0, "ثم نقول: أو كان كفرَ أوصاف،"], [1921.0, "كتكفير المستهزئ بالله أو آياته."], [1926.0, "فلو جاءنا رجلٌ وقال:"], [1930.0, "إنّ من استهزأ بآيات الله ورسوله وشريعته فليس بكافر،"], [1939.0, "فإننا نقول: أنت الآن كفرت."], [1943.0, "فقولنا في الكلّيّة: «النصّ التعييني» يدخل فيه تعيينُ الذوات كما مثّلت،"], [1953.0, "وتعيينُ الأجناس كما مثّلت،"], [1957.0, "وتعيينُ الأوصاف كما مثّلتُ لكم."], [1962.0, "أنتم معي في هذا؟"]], "tr": [[1914.0, "Sonra deriz ki: Ya da vasıfların küfrü olsun;"], [1921.8, "Allah'la ya da ayetleriyle alay edenin tekfiri gibi."], [1930.0, "Bir adam bize gelip \"Allah'ın ayetleriyle, Resûlü'yle ve şeriatiyle alay eden kâfir değildir\" derse, ona \"Sen şimdi kâfir oldun\" deriz."], [1945.4, "Külliyedeki \"tayin eden nas\" sözümüze, örneklendirdiğim gibi zatların tayini, örneklendirdiğim gibi cinslerin tayini ve size örneklendirdiğim gibi vasıfların tayini girer. Bu konuda benimle misiniz?"]]}, {"reader": false, "ar": [[1966.0, "ولو جاءنا رجلٌ وقال:"], [1968.5, "إنّ النصيريّة ـ إنّ القرامطة ـ مسلمون وليسوا بكفّار،"], [1972.5, "كفّرناه إن كان يعلم حقيقةَ مذهبهم."], [1978.1, "أو قال: الإسماعيليّة مسلمـ..."], [1984.0, "أو قال: الإسماعيليّة ليسوا بكفّار،"], [1987.5, "كفّرناه إن كان يعلم حقيقة مذهبهم."], [1997.0, "أو قال بأنّ الدروز أو القاديانيّة ليسوا بكفّار،"], [2002.4, "كفّرناه إن كان يعلم حقيقة مذهبهم."], [2010.0, "فإن لم يكن يعلم حقيقة مذهبهم بيّنّا مذاهبَهم له،"], [2015.9, "فإن عرفها وأصرّ على ما قال كفر مثلَه؛"], [2025.0, "لأنّ هذه الطوائف التي ذكرتُها قد أجمع العلماء الإجماعَ القطعيَّ على كفرهم."]], "tr": [[1966.0, "Bir adam bize gelip \"Nusayrîler —Karâmita— Müslümandır, kâfir değildir\" derse, onların mezhebinin hakikatini biliyorsa onu tekfir ederiz."], [1978.1, "Ya da \"İsmâilîler Müslü…\" ya da \"İsmâilîler kâfir değildir\" derse, onların mezhebinin hakikatini biliyorsa onu tekfir ederiz."], [1997.0, "Ya da \"Dürzîler veya Kādiyânîler kâfir değildir\" derse, onların mezhebinin hakikatini biliyorsa onu tekfir ederiz."], [2010.0, "Onların mezhebinin hakikatini bilmiyorsa, mezheplerini ona açıklarız;"], [2014.0, "onları öğrenir de söylediği şeyde ısrar ederse, onun gibi kâfir olur."], [2025.0, "Çünkü zikrettiğim bu taifelerin küfrü üzerinde âlimler kat'î icmâ ile icmâ etmişlerdir."]]}, {"reader": false, "ar": [[2033.0, "قال القاضي أبو بكرٍ الباقلّانيّ رحمه الله:"], [2041.0, "«لأنّ التوقيف ـ أي الدليل ـ والإجماع اتّفقا على كفرهم، فمن وقف في ذلك فقد كذّب النصَّ والتوقيف، أو شكّ فيه، والتكذيبُ أو الشكُّ فيه لا يقع إلا من كافر»."], [2066.7, "انتهى كلامه. وقد حكى الإجماعَ على هذه الكلّيّة جمعٌ غفيرٌ من أهل العلم."], [2074.0, "وليس الشأنُ في الإيمان بها،"], [2077.4, "ولكنّ أخطرَ الخطر في هذه الكلّيّة التوسّعُ في تطبيقها."]], "tr": [[2033.0, "Kādî Ebû Bekr el-Bâkıllânî —Allah ona rahmet etsin— şöyle dedi:"], [2041.0, "\"Çünkü tevkîf —yani delil— ve icmâ onların küfrü üzerinde birleşmiştir."], [2046.1, "Bu konuda duraksayan kimse nassı ve tevkîfi yalanlamış ya da onda şüphe etmiştir;"], [2059.6, "yalanlama ya da onda şüphe etmek ise ancak bir kâfirden sadır olur.\" Sözü bitti."], [2066.7, "Bu külliye üzerindeki icmâyı ilim ehlinden kalabalık bir topluluk nakletmiştir."], [2074.0, "Mesele ona iman etmekte değildir;"], [2077.4, "bu külliyedeki tehlikelerin en tehlikelisi onu uygulamada genişliğe gitmektir."]]}, {"reader": false, "ar": [[2084.0, "ولذلك يدخل فيها أمران بالإجماع:"], [2089.0, "أوّلُهما: من ثبت كفرُه بالنصّ التعيينيّ،"], [2093.0, "تعيينَ ذواتٍ أو تعيينَ أجناسٍ أو تعيينَ أوصاف."], [2101.0, "ويدخل فيها من ثبت كفرُه بالإجماع القطعيّ المتواتر المعلوم من الدين بالضرورة."], [2111.0, "ولا يدخل فيها ـ بالإجماع ـ من ثبت كفرُه بالاجتهاد."], [2118.0, "ولا يزال أهلُ العلم رحمهم الله تعالى يختلفون فيما بينهم في مسائلَ تكفيريّة ولا يكفّر بعضُهم بعضًا. والله أعلم."]], "tr": [[2084.0, "Bu yüzden ona icmâ ile iki şey girer:"], [2089.7, "Birincisi, küfrü tayin eden nasla —zatların tayini, cinslerin tayini ya da vasıfların tayiniyle— sabit olan kimse."], [2101.0, "Küfrü, dinden zarûrî olarak bilinen, tevâtür derecesindeki kat'î icmâ ile sabit olan kimse de ona girer."], [2111.0, "Küfrü içtihatla sabit olan kimse ise —icmâ ile— ona girmez."], [2118.0, "İlim ehli —Allah onlara rahmet etsin— tekfire dair meselelerde kendi aralarında ihtilaf etmeye devam etmişlerdir;"], [2125.6, "ama birbirlerini tekfir etmezler. Allah en iyisini bilir."]]}]}, {"ts": "35:30", "title": "17. Külliye: İmanın aslını nakzeden her küfür büyük küfürdür", "paras": [{"reader": false, "ar": [[2130.0, "القاعدة التي بعدها ـ أو الكلّيّة التي بعدها ـ:"], [2134.7, "<b>كلُّ كفرٍ يناقض أصلَ الإيمان فأكبر.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [2156.0, "وذلك لأنّ أهل السنة والجماعة متّفقون على أنّ الكفر الوارد في الكتاب والسنة منقسمٌ إلى قسمين:"], [2164.0, "إلى كفرٍ أكبر، وإلى كفرٍ أصغر."]], "tr": [[2130.0, "Sonraki kaide —ya da sonraki külliye—:"], [2134.7, "<b>17. külliye: İmanın aslını nakzeden (ona aykırı olan) her küfür büyük küfürdür.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [2158.0, "Bu şundandır: Ehl-i Sünnet ve'l-Cemaat, Kitap ve Sünnet'te geçen küfrün iki kısma ayrıldığında ittifak etmişlerdir:"], [2164.0, "Büyük küfür ve küçük küfür."]]}, {"reader": false, "ar": [[2167.0, "ويقولون بأنّ الكفر الأكبر مرادفٌ للجحود المطلق،"], [2171.0, "وينافي وجودَ الإيمان في القلب،"], [2176.0, "ويُخرج صاحبَه من ملّة الإسلام،"], [2180.0, "ويوجب فيما بيننا وبينه المصارمةَ المطلقة،"], [2186.0, "والبغضاءَ المطلقة، والمعاداةَ المطلقة،"], [2189.0, "ويُحِلّ دمَه ومالَه، وإن مات مصرًّا عليه فإننا نعامله بعد موته كما نعامل سائر الكفرة."], [2203.0, "وهذا ضابطُه: أنه يناقض وجودَ الإيمان في القلب."]], "tr": [[2167.0, "Derler ki: Büyük küfür, mutlak inkâr (cuhûd) ile eş anlamlıdır;"], [2177.6, "kalpte imanın varlığına aykırıdır; sahibini İslam milletinden çıkarır;"], [2187.5, "bizimle onun arasında mutlak ilişki kesmeyi, mutlak buğzu ve mutlak düşmanlığı gerektirir;"], [2203.0, "onun kanını ve malını helal kılar."], [2203.7, "Onda ısrar ederek ölürse, ölümünden sonra ona diğer kâfirlere davrandığımız gibi davranırız."], [2206.6, "Bunun zâbıtı şudur: Kalpte imanın varlığını nakzeder."]]}, {"reader": false, "ar": [[2212.0, "كإنكار وجود الله؛ إذ كيف يؤمن قلبُك بإلهٍ ليس موجودًا؟"], [2218.0, "فتعطيلُ الله عن وجوده تعطيلٌ لما يجب على القلب الإيمانُ به."], [2224.0, "وكإنكار النبوّات والرسالة، الكفرِ بجميع الأنبياء أو بواحدٍ منهم؛"], [2236.0, "فإنّ هذا يناقض أصلَ وجود الإيمان في القلب."], [2240.0, "وكإنكار وجود الملائكة؛ فإنه إنكارٌ يتنافى مع وجود أصل الإيمان في القلب."]], "tr": [[2212.0, "Allah'ın varlığını inkâr etmek gibi;"], [2215.0, "çünkü kalbin var olmayan bir ilaha nasıl iman edebilir?"], [2218.0, "Allah'ı varlığından ta'til etmek, kalbin iman etmesi vâcip olan şeyi ta'til etmektir."], [2224.0, "Peygamberlikleri ve risâleti inkâr etmek, bütün peygamberleri ya da onlardan birini inkâr etmek de böyledir;"], [2237.5, "bu, kalpte imanın varlığının aslını nakzeder."], [2240.0, "Meleklerin varlığını inkâr etmek de böyledir;"], [2243.4, "bu, kalpte imanın aslının varlığıyla bağdaşmayan bir inkârdır."]]}, {"reader": false, "ar": [[2249.0, "وكسبّ الله عز وجل؛"], [2251.7, "إذ كيف يعظّم ويؤمن قلبُك بمن يسبّه لسانك؟"], [2258.0, "فإنّ سبّ الله يتنافى مع وجود الإيمان والتعظيم في القلب."], [2263.0, "لا يمكن أن يجتمع سبُّ الله عز وجل،"], [2266.7, "ولا سبُّ رسوله صلى الله عليه وسلم،"], [2270.0, "ولا سبُّ دينه وشريعته،"], [2272.0, "مع دعوى أنّ القلب لا يزال فيه إيمان؛"], [2276.0, "هذا لا يمكن أبدًا."], [2278.0, "فكلُّ جحودٍ يتنافى مع وجود الإيمان في القلب،"], [2286.0, "فيسمّيه أهل السنة بالجحود المطلق، أي الكفر الأكبر."]], "tr": [[2249.0, "Allah Azze ve Celle'ye sövmek de böyledir;"], [2251.7, "çünkü dilinin sövdüğü birini kalbin nasıl tazim eder ve ona nasıl iman eder?"], [2263.0, "Allah'a sövmek, kalpte imanın ve tazimin varlığıyla bağdaşmaz."], [2266.3, "Allah Azze ve Celle'ye sövmek, Resûlü ﷺ'e sövmek, dinine ve şeriatine sövmek, kalpte hâlâ iman bulunduğu iddiasıyla bir araya gelemez;"], [2276.0, "bu asla mümkün değildir. Kalpte imanın varlığıyla bağdaşmayan her inkârı Ehl-i Sünnet mutlak inkâr, yani büyük küfür diye isimlendirir."]]}]}, {"ts": "38:12", "title": "18. Külliye: Vâcip olan imanın kemaline aykırı her küfür küçük küfürdür", "paras": [{"reader": false, "ar": [[2292.0, "ويؤكّد ذلك الكلّيّةُ التي بعدها،"], [2298.0, "وهي: <b>كلُّ كفرٍ يناقض كمالَ الإيمان الواجب فأصغر.<\/b> كلُّ كفرٍ ينافي كمالَ الإيمان الواجب فأصغر."], [2305.5, "ما أدري كم رقمه عندكم."], [2307.0, "<b>كلُّ كفرٍ ينافي كمالَ الإيمان الواجب فأصغر.<\/b> بمعنى:"], [2316.8, "أنه وصفه الشارع بأنه كفر،"], [2329.0, "ولكنه لا يتعلّق به انتقاضُ أصل الإسلام والإيمان والتعظيم في القلب،"], [2337.0, "ولكنه يتنافى مع وجود الإيمان الكامل."]], "tr": [[2292.0, "Bunu sonraki külliye pekiştirir; o da şudur:"], [2298.7, "<b>18. külliye: Vâcip olan imanın kemalini nakzeden her küfür küçük küfürdür.<\/b> Vâcip olan imanın kemaline aykırı her küfür küçük küfürdür."], [2305.5, "Sizde numarası kaçtır bilmiyorum. <b>Vâcip olan imanın kemaline aykırı her küfür küçük küfürdür.<\/b> Yani:"], [2316.8, "Şâri' (Allah ve Resûlü) onu küfür olarak nitelemiştir;"], [2330.4, "fakat ona, kalpteki İslam'ın, imanın ve tazimin aslının bozulması bağlı değildir;"], [2337.8, "ama kâmil imanın varlığıyla bağdaşmaz."]]}, {"reader": false, "ar": [[2343.0, "بمعنى أنّ من وقع فيه فينقص من إيمانه الواجب بقدره،"], [2350.0, "ولا يوجب الخلودَ في النار،"], [2353.0, "ويكون صاحبُه ـ إن مات مصرًّا عليه ـ تحت مشيئة الله عز وجل؛"], [2359.0, "إن شاء عفا عنه وأدخله الجنة ابتداءً،"], [2365.0, "وإن شاء عذّبه في النار بقدر كفره هذا،"], [2369.0, "ثم يُخرجه منها إلى الجنة انتقالًا."]], "tr": [[2343.0, "Yani ona düşen kimsenin vâcip imanından onun miktarınca eksilir;"], [2349.3, "cehennemde ebedî kalmayı gerektirmez. Sahibi —onda ısrar ederek ölürse— Allah Azze ve Celle'nin meşîeti altındadır:"], [2359.0, "Dilerse onu affeder ve doğrudan cennete koyar;"], [2365.0, "dilerse onu bu küfrü miktarınca cehennemde azaplandırır, sonra oradan çıkarıp cennete nakleder."]]}, {"reader": false, "ar": [[2372.0, "ويوجب مطلقَ البغضاء لا البغضاءَ المطلقة،"], [2379.0, "ومطلقَ المعاداة لا المعاداةَ المطلقة،"], [2386.0, "ولا يُبيح ـ بالإجماع ـ دمًا ولا مالًا."], [2391.9, "وإن مات صاحبُه مصرًّا عليه فإننا نعامله بعد موته كما نعامل سائر المسلمين."]], "tr": [[2372.0, "(Bu küfür) mutlak buğzu değil, buğzun bir kısmını (mutlaku'l-buğz);"], [2379.0, "mutlak düşmanlığı değil, düşmanlığın bir kısmını gerektirir."], [2381.6, "İcmâ ile ne kanı ne de malı mubah kılar."], [2391.9, "Sahibi onda ısrar ederek ölürse, ölümünden sonra ona diğer Müslümanlara davrandığımız gibi davranırız."]]}, {"reader": false, "ar": [[2404.0, "كالطعن في الأنساب؛ فإنّ الطعن في الأنساب ليس فيه متعلَّقٌ ينقض الإيمانَ في القلب،"], [2413.0, "ولكنه يُنقص كمالَ الإيمان الواجب."], [2418.0, "والفخرِ بالأحساب؛ فإنه ليس فيه متعلَّقٌ لينتقض أصلُ الإيمان والإسلام،"], [2428.0, "ولكن يُنقص كمالَ الإيمان الواجب."], [2432.0, "وكفرار العبد من سيّده بلا مسوّغٍ شرعي،"], [2441.0, "وكما لو ادّعى إنسانٌ لغير أبيه وهو يعلم أنه غيرُ أبيه،"], [2450.0, "وكما لو التقى المسلمان بسيفيهما فقتل بعضُهما بعضًا."]], "tr": [[2404.0, "Nesepleri kötülemek gibi; nesepleri kötülemede kalpteki imanı nakzeden bir yön yoktur, fakat vâcip imanın kemalini eksiltir."], [2413.0, "Soyla (hasep) övünmek de böyledir;"], [2418.0, "onda İslam'ın ve imanın aslını bozacak bir yön yoktur, fakat vâcip imanın kemalini eksiltir."], [2432.0, "Kölenin şer'î bir gerekçe olmaksızın efendisinden kaçması, bir insanın, babası olmadığını bildiği hâlde babasından başkasına nispet iddia etmesi ve iki Müslümanın kılıçlarıyla karşılaşıp birbirlerini öldürmesi de böyledir."]]}, {"reader": false, "ar": [[2457.0, "فإنّ النبيّ صلى الله عليه وسلم ماذا قال؟"], [2461.0, "«سِبابُ المسلم فسوقٌ، وقتالُه كفر»."], [2465.0, "فإنك لو تأمّلتَ هذه الذنوب لوجدتَ أنّ الشارع يصفها بأنها كفر،"], [2475.0, "ولكن في حقيقتها ليس فيها متعلَّقٌ ينقض..."], [2479.0, "ينقض أصلَ وجود الإيمان في القلب،"], [2482.0, "ولكنها تتضمّن الاعتداءَ على الآخرين،"], [2486.0, "الاعتداءَ على الآخرين بلا سببٍ ولا مسوّغٍ شرعي؛"], [2491.0, "فهي تُنقص كمالَ الإسلام والإيمان الواجب،"], [2497.0, "ولكنها لا تنقض أصلَ وجوده في القلب."]], "tr": [[2457.0, "Nebî ﷺ ne buyurdu? \"Müslümana sövmek fısk, onunla savaşmak küfürdür.\" Bu günahları düşünürsen, Şâri'in onları küfür olarak nitelediğini görürsün;"], [2465.0, "fakat hakikatlerinde kalpte imanın varlığının aslını nakzeden… nakzeden bir yön yoktur."], [2479.0, "Ama onlar başkalarına saldırmayı, sebepsiz ve şer'î bir gerekçe olmaksızın başkalarına saldırmayı içerir."], [2489.1, "Dolayısıyla İslam'ın ve vâcip imanın kemalini eksiltirler, fakat kalpte onun varlığının aslını nakzetmezler."]]}]}, {"ts": "41:41", "title": "19. Külliye: Her şirk küfürdür, ama tersi değil", "paras": [{"reader": false, "ar": [[2501.0, "ومن الكلّيّات أيضًا: <b>كلُّ شركٍ فكفرٌ ولا عكس.<\/b> <span class=\"note\">(يكررها)<\/span> وهذه الكلّيّة تبيّن لك العلاقة بين اسم الكفر واسم الشرك،"], [2538.0, "والعلاقةُ بينهما علاقةُ عمومٍ وخصوصٍ من وجهٍ فقط."], [2545.0, "فإذا ذُكر الشرك وحده في الأدلّة فلا جرم أنّ الكفر يدخل معه تبعًا،"], [2554.0, "كقول الله عز وجل:"], [2556.2, "<span class=\"ayah\">﴿إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ﴾<\/span> <span class=\"ref\">[النساء: ٤٨]<\/span>،"], [2560.2, "أي: ولا أن يُكفَر به."]], "tr": [[2501.0, "Külliyelerden biri de şudur: 19."], [2509.0, "külliye: Her şirk küfürdür, ama tersi değil. (Tekrar ediyor.) Bu külliye sana küfür ismi ile şirk ismi arasındaki ilişkiyi açıklar."], [2538.0, "İkisi arasındaki ilişki sadece bir yönden umûm ve husus ilişkisidir."], [2545.0, "Delillerde şirk tek başına zikredildiğinde, şüphesiz küfür de ona tâbi olarak girer."], [2552.3, "Allah Azze ve Celle'nin şu sözü gibi:"], [2556.2, "<span class=\"ayah\">﴿Şüphesiz Allah, kendisine ortak koşulmasını bağışlamaz﴾<\/span> [Nisâ 48];"], [2560.8, "yani kendisinin inkâr edilmesini de (bağışlamaz)."]]}, {"reader": false, "ar": [[2563.0, "وإذا ذُكر الكفر وحده ـ وحده ـ فيدخل معه الشرك تبعًا،"], [2573.0, "كقول الله عز وجل:"], [2575.1, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ كَفَرُوا سَوَاءٌ عَلَيْهِمْ أَأَنذَرْتَهُمْ أَمْ لَمْ تُنذِرْهُمْ لَا يُؤْمِنُونَ﴾<\/span> <span class=\"ref\">[البقرة: ٦]<\/span>،"], [2581.0, "أي: والذين أشركوا. ولكن إذا ذُكرا جميعًا في نصٍّ واحد فقيل:"], [2588.6, "كفرٌ وشرك ـ انتبه، إذا قيل:"], [2593.1, "كفرٌ وشرك ـ فيكون معنى الشرك:"], [2596.5, "الذنبَ المصاحبَ للتنديد، ويكون معنى الكفر ـ ها ـ:"], [2603.3, "الذنبَ المصاحبَ للجحود. وهذا أوّلُ الفرقان بينهما."]], "tr": [[2563.0, "Küfür tek başına —tek başına— zikredildiğinde, şirk de ona tâbi olarak girer."], [2568.7, "Allah Azze ve Celle'nin şu sözü gibi:"], [2575.1, "<span class=\"ayah\">﴿Şüphesiz inkâr edenleri uyarsan da uyarmasan da onlar için birdir; iman etmezler﴾<\/span> [Bakara 6];"], [2581.7, "yani şirk koşanlar da. Fakat ikisi bir nasta birlikte zikredilip \"küfür ve şirk\" denildiğinde —dikkat et, \"küfür ve şirk\" denildiğinde— şirkin anlamı, (Allah'a) denk tutmanın (tendîd) eşlik ettiği günah;"], [2596.5, "küfrün anlamı ise —evet— inkârın (cuhûd) eşlik ettiği günah olur."], [2606.0, "Bu, ikisi arasındaki farkın birincisidir."]]}, {"reader": false, "ar": [[2609.0, "والكلّيّة تتكلّم عن شيءٍ آخر،"], [2612.0, "وهي أنّ دائرة الكفر أوسعُ من دائرة الشرك."], [2619.0, "فكلُّ ذنبٍ يوصف بأنه شرك ـ وهي الدائرة الصغيرة ـ فإنه يوصف بأنه كفر ـ وهي الدائرة الكبيرة المحيطة بدائرة الشرك ـ."], [2636.0, "فلا يمكن أن يوصف ذنبٌ بأنه شركٌ إلا ولا بدّ أن يوصف بأنه كفر؛"], [2643.0, "سواءٌ أكان من الشرك الأصغر فيوصف بأنه كفرٌ أصغر،"], [2650.0, "أو من الشرك الأكبر فيوصف بأنه كفرٌ أكبر."]], "tr": [[2609.0, "Külliye ise başka bir şeyden bahseder;"], [2612.0, "o da küfür dairesinin şirk dairesinden daha geniş olmasıdır."], [2619.0, "Şirk olarak nitelenen her günah —ki bu küçük dairedir— küfür olarak da nitelenir —ki bu, şirk dairesini kuşatan büyük dairedir—."], [2636.0, "Bir günahın şirk olarak nitelenip de mutlaka küfür olarak nitelenmemesi mümkün değildir:"], [2643.0, "İster küçük şirkten olsun, o zaman küçük küfür olarak nitelenir;"], [2648.7, "ister büyük şirkten olsun, o zaman büyük küfür olarak nitelenir."]]}, {"reader": false, "ar": [[2655.0, "ولكن هناك من الذنوب ما يوصف بأنه كفر،"], [2660.0, "ولكن لا يصدق عليه التنديد،"], [2663.0, "وإنما فيه جحودٌ فقط،"], [2665.8, "وليس فيه شيءٌ من التنديد؛"], [2670.0, "كترك الصلاة التركَ المطلقَ الدائمَ حتى يموت،"], [2677.0, "فإنّ فاعل ذلك يوصف بأنه كافرٌ وليس بمشرك."], [2684.0, "وكسبّ الله عز وجل،"], [2690.0, "أو سبّ رسوله، أو سبّ دينه،"], [2694.0, "فإنه يوصف فاعلُه بأنه كافرٌ ولكن ليس بمشرك؛"], [2700.0, "إذ ليس فيه تنديد،"], [2701.0, "وإنما فيه الجحودُ المطلق."]], "tr": [[2655.0, "Fakat günahlardan öylesi vardır ki küfür olarak nitelenir, ama ona tendîd (Allah'a denk tutma) tanımı uymaz;"], [2663.7, "onda sadece inkâr vardır, tendîdden hiçbir şey yoktur."], [2670.0, "Namazı ölünceye kadar mutlak ve devamlı bir terkle terk etmek gibi;"], [2677.7, "bunu yapan kâfir olarak nitelenir, müşrik olarak değil."], [2684.0, "Allah Azze ve Celle'ye sövmek, Resûlü'ne sövmek ya da dinine sövmek de böyledir;"], [2694.0, "bunu yapan kâfir olarak nitelenir, fakat müşrik olarak değil."], [2700.0, "Çünkü onda tendîd yoktur; onda sadece mutlak inkâr vardır."]]}, {"reader": false, "ar": [[2704.0, "وكالاستخفاف بشريعة الله، أو الاستهزاء بالمصحف؛"], [2710.0, "فهذا كفرٌ يُخرج صاحبه عن الملّة،"], [2713.5, "ولكن لا يُعدّ شركًا في الاصطلاح."], [2717.0, "وكذلك الإعراضُ المطلق عن دين الله عز وجل،"], [2722.3, "لا يتعلّمه ولا يتفقّه فيه ولا يعمل به،"], [2728.0, "فإنه كافرٌ ولكن ليس بمشرك."], [2732.0, "وكمن اعتقد قدرتَه على الخروج من شريعة الله ورسوله،"], [2743.0, "فإنه بهذا الاعتقاد كافرٌ وليس بمشرك."]], "tr": [[2704.0, "Allah'ın şeriatini hafife almak ya da Mushaf'la alay etmek de böyledir;"], [2711.8, "bu, sahibini milletten çıkaran bir küfürdür, fakat ıstılahta şirk sayılmaz."], [2717.0, "Aynı şekilde Allah Azze ve Celle'nin dininden mutlak olarak yüz çevirmek de —onu öğrenmez, onda fıkıh (anlayış) elde etmez ve onunla amel etmez— böyledir;"], [2732.0, "bu kişi kâfirdir, fakat müşrik değildir."], [2734.8, "Allah'ın ve Resûlü'nün şeriatinden çıkmaya gücü olduğuna inanan kimse de böyledir;"], [2744.5, "bu inancıyla kâfirdir, müşrik değildir."]]}, {"reader": false, "ar": [[2748.0, "وكذلك الاستكبارُ عن قبول الشرع،"], [2751.4, "أو الشكُّ في مسألةٍ إيمانيّةٍ لا يُقبل فيها الشكّ؛"], [2760.0, "فكلُّ ذلك ممّا يوصف بأنه كفر،"], [2762.7, "ولكن لا يوصف بأنه شرك."], [2765.0, "فدائرةُ الكفر أوسعُ من دائرة الشرك،"], [2769.0, "فدائرة الشرك الصغرى تحيط بها دائرة الكفر الكبرى."], [2774.0, "فكلُّ شركٍ فكفر، وليس بالضرورة أن يكون كلُّ كفرٍ شركًا."]], "tr": [[2748.0, "Aynı şekilde şeriati kabul etmekten büyüklenmek ya da kendisinde şüphenin kabul edilmediği imanî bir meselede şüphe etmek de böyledir."], [2760.9, "Bunların hepsi küfür olarak nitelenen, fakat şirk olarak nitelenmeyen şeylerdendir."], [2765.0, "Küfür dairesi şirk dairesinden daha geniştir;"], [2769.0, "küçük şirk dairesini büyük küfür dairesi kuşatır."], [2774.0, "Her şirk küfürdür; fakat her küfrün şirk olması zorunlu değildir."]]}]}, {"ts": "46:21", "title": "20. Külliye: Delil kendisine ulaşıp onu sahih bir genel anlayışla anlayana hüccet ikame edilmiştir", "paras": [{"reader": false, "ar": [[2781.0, "ومن الكلّيّات أيضًا ـ ولا أدري عن رقمها عندكم ـ:"], [2795.0, "<b>كلُّ من بلغه الدليلُ وفهمه بمطلق الفهم الصحيح فقد قامت عليه الحجّة.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً أخرى:"], [2813.0, "<b>كلُّ من بلغه الدليلُ وفهمه بمطلق الفهم الصحيح فقد قامت عليه الحجّة.<\/b>"]], "tr": [[2781.0, "Külliyelerden biri de şudur —sizde numarası kaçtır bilmiyorum—:"], [2783.2, "<b>20. külliye: Delil kendisine ulaşan ve onu sahih bir genel anlayışla (mutlaku'l-fehm) anlayan herkese hüccet ikame edilmiştir.<\/b> (Tekrar ediyor.) Bir kez daha tekrar ediyorum:"], [2813.0, "<b>Delil kendisine ulaşan ve onu sahih bir genel anlayışla anlayan herkese hüccet ikame edilmiştir.<\/b>"]]}, {"reader": false, "ar": [[2824.7, "أقول وبالله التوفيق: الكلام عليها في مسألتين خفيفتين."], [2834.7, "المسألة الأولى: أجمع أهلُ السنة والجماعة على أنّ قيام الحجّة شرطٌ في التكفير أو التبديع أو التفسيق؛"], [2847.1, "فمن لم تقم عليه الحجّةُ الرساليّة فإنه في عذرٍ من الله عز وجل،"], [2855.8, "لا يجوز الحكمُ عليه لا بالكفر،"], [2859.3, "ولا بالفسق، ولا بالبدعة،"], [2861.7, "ولا بغيرها من الأحكام."]], "tr": [[2824.7, "Tevfik Allah'tandır, derim ki: Bu külliye hakkındaki söz iki hafif mesele üzerinedir."], [2834.7, "Birinci mesele: Ehl-i Sünnet ve'l-Cemaat, hüccetin ikamesinin tekfirde, bid'atçi saymada ya da fâsık saymada şart olduğu üzerinde icmâ etmiştir."], [2847.1, "Kendisine risâlet hücceti ikame edilmeyen kimse Allah Azze ve Celle katında mazurdur;"], [2854.5, "onun hakkında ne küfürle, ne fısk ile, ne bid'atle ne de başka hükümlerle hükmetmek caiz değildir."]]}, {"reader": false, "ar": [[2864.0, "قال الإمام الشافعيّ رحمه الله،"], [2867.4, "مبيّنًا وجوبَ قيام الحجّة قبل الحكم على المعيَّن:"], [2873.0, "«لله أسماءٌ وصفاتٌ لا يسع أحدًا ردُّها، ومن خالف بعد ثبوت الحجّة عليه فقد كفر، وأمّا قبل قيام الحجّة فإنه يُعذر بالجهل»."], [2890.0, "انتهى كلامه. ويقول ابن حزمٍ رحمه الله تعالى:"], [2896.0, "«ولا خلافَ في أنّ امرأً لو أسلم ولم يعلم شرائعَ الإسلام، فاعتقد أنّ الخمر حلال، وأنْ ليس على الإنسان صلاة، وهو لم يبلغه حكمُ الله تعالى، لم يكن كافرًا بلا خلافٍ يُعتدّ به» ـ أي:"], [2919.6, "لم تقم عليه الحجّة ـ «حتى إذا قامت عليه الحجّة فتمادى، حينئذٍ بإجماع الأمّة فهو كافر»."], [2928.0, "انتهى كلامه رحمه الله."]], "tr": [[2864.0, "İmam Şâfiî —Allah ona rahmet etsin— muayyen kişi hakkında hükmetmeden önce hüccetin ikamesinin vâcip olduğunu açıklayarak şöyle dedi:"], [2870.8, "\"Allah'ın isimleri ve sıfatları vardır;"], [2873.0, "hiç kimsenin onları reddetmesine imkân yoktur."], [2876.3, "Kendisine hüccet sabit olduktan sonra muhalefet eden kâfir olur."], [2881.7, "Hüccet ikame edilmeden önce ise cehaletiyle mazur görülür.\" Sözü bitti."], [2890.0, "İbn Hazm —Allah ona rahmet etsin— şöyle der:"], [2896.0, "\"Şu konuda ihtilaf yoktur: Bir kişi Müslüman olsa ve İslam'ın hükümlerini bilmese, içkinin helal olduğuna ve insanın namaz kılma yükümlülüğü olmadığına inansa, Allah Teâlâ'nın hükmü de kendisine ulaşmamış olsa, itibar edilen hiçbir ihtilaf olmaksızın kâfir olmaz\" —yani kendisine hüccet ikame edilmemiştir— \"Nihayet kendisine hüccet ikame edilir de (inadında) devam ederse, işte o zaman ümmetin icmâı ile kâfir olur.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2930.0, "ويقول الإمام ابن تيمية في نقولٍ متعدّدة؛"], [2935.0, "قال: «والحجّة على العباد إنما تقوم بشيئين: بشرط التمكّن من العلم بما أنزل الله، والقدرةِ على العمل به» ـ كما سيأتينا إن شاء الله ـ."], [2947.0, "انتهى كلامه. قال شيخ الإسلام ابن تيمية أيضًا:"], [2952.0, "«الله سبحانه لا يعاقب شرعًا ولا قدرًا إلا بعد قيام الحجّة ومخالفة أمره»."], [2961.0, "انتهى كلامه. ويقول أيضًا رحمه الله تعالى:"], [2964.0, "«وليس لأحدٍ أن يكفّر أحدًا من المسلمين وإن أخطأ وغلط حتى تُقام عليه الحجّة وتُبيَّن له المحجّة، ومن ثبت إسلامُه بيقينٍ لم يَزُل ذلك عنه بالشكّ، بل لا يزول إلا بعد إقامة الحجّة وإزالة الشبهة»."]], "tr": [[2930.0, "İmam İbn Teymiyye birçok nakilde şöyle der:"], [2935.0, "\"Kullar üzerindeki hüccet ancak iki şeyle ikame edilir:"], [2940.6, "Allah'ın indirdiğini bilme imkânı şartıyla ve onunla amel etmeye güç yetirmekle\" —inşallah ileride geleceği üzere—."], [2947.0, "Sözü bitti. Şeyhulislam İbn Teymiyye şöyle de dedi:"], [2952.0, "\"Allah Sübhânehû, ne şer'an ne de kaderen, hüccet ikame edilip emrine muhalefet edilmedikçe cezalandırmaz.\" Sözü bitti."], [2961.0, "Yine o —Allah ona rahmet etsin— şöyle der:"], [2964.0, "\"Hiç kimsenin, Müslümanlardan birini, hata etse ve yanılsa bile, ona hüccet ikame edilip doğru yol kendisine açıklanmadıkça tekfir etme hakkı yoktur."], [2972.4, "İslam'ı yakînen sabit olan kimseden bu şüpheyle zail olmaz;"], [2976.0, "aksine ancak hüccetin ikamesinden ve şüphenin giderilmesinden sonra zail olur.\""]]}, {"reader": false, "ar": [[2981.0, "ويقول ابن تيمية أيضًا رحمه الله تعالى:"], [2984.0, "«وهكذا الأقوال التي يكفُر قائلها، قد يكون الرجل لم تبلغه النصوص الموجبة لمعرفة الحقّ، وقد تكون عنده ولم تثبت عنده، أو لم يتمكّن من فهمها، وقد يكون قد عرضت له شبهاتٌ يعذره الله عز وجل بها»."], [3003.0, "انتهى كلامه رحمه الله."], [3005.0, "وقال الإمام ابن القيّم:"], [3007.0, "«فإنّ حجّة الله على عباده قامت بإرسال الرسول، وإنزال الكتاب، وبلوغ ذلك إليه، وتمكّنه من العلم به، سواءٌ علم أم جهل؛ فكلُّ من تمكّن من معرفة ما أمر الله به ونهى عنه فقصّر عنه ولم يعرفه فقد قامت عليه الحجّة، والله سبحانه لا يعذّب أحدًا إلا بعد قيام الحجّة عليه». انتهى كلامه."]], "tr": [[2981.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle de der:"], [2984.0, "\"Söyleyeni kâfir olan sözler de böyledir."], [2989.2, "Adama hakkı bilmeyi gerektiren nasslar ulaşmamış olabilir;"], [2996.0, "ya da onun yanında bulunur ama onun nezdinde sabit olmamıştır;"], [3003.0, "ya da onları anlamaya imkân bulamamıştır;"], [3005.0, "ya da kendisine, Allah Azze ve Celle'nin onu onlarla mazur gördüğü birtakım şüpheler arız olmuştur.\" Sözü bitti, Allah ona rahmet etsin."], [3007.0, "İmam İbnü'l-Kayyim şöyle dedi: \"Allah'ın kulları üzerindeki hücceti, resulün gönderilmesi, kitabın indirilmesi, bunun kişiye ulaşması ve onun bunu bilme imkânına sahip olmasıyla ikame olmuştur;"], [3018.0, "ister bilsin ister bilmesin. Allah'ın emrettiğini ve yasakladığını bilme imkânı bulup da bunda kusur eden ve onu öğrenmeyen herkese hüccet ikame edilmiştir."], [3025.5, "Allah Sübhânehû hiç kimseyi kendisine hüccet ikame edilmedikçe azaplandırmaz.\" Sözü bitti."]]}, {"reader": false, "ar": [[3031.0, "وأنا أحببتُ بذلك أن أبيّن لكم إجماعَ العلماء على أنه لا تكفيرَ إلا بعد قيام الحجّة،"], [3039.6, "إلا بعد قيام الحجّة."], [3040.0, "والأدلّة على ذلك كثيرةٌ من الكتاب والسنة؛"], [3049.0, "فمن القرآن مثلًا قولُ الله عز وجل:"], [3052.0, "<span class=\"ayah\">﴿وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولًا﴾<\/span> <span class=\"ref\">[الإسراء: ١٥]<\/span>،"], [3056.0, "وقال تعالى: <span class=\"ayah\">﴿رُّسُلًا مُّبَشِّرِينَ وَمُنذِرِينَ لِئَلَّا يَكُونَ لِلنَّاسِ عَلَى اللَّهِ حُجَّةٌ بَعْدَ الرُّسُلِ﴾<\/span> <span class=\"ref\">[النساء: ١٦٥]<\/span>،"], [3063.0, "وقال الله عز وجل:"], [3065.5, "<span class=\"ayah\">﴿كُلَّمَا أُلْقِيَ فِيهَا فَوْجٌ سَأَلَهُمْ خَزَنَتُهَا أَلَمْ يَأْتِكُمْ نَذِيرٌ ۝ قَالُوا بَلَىٰ قَدْ جَاءَنَا نَذِيرٌ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ اللَّهُ مِن شَيْءٍ﴾<\/span> <span class=\"ref\">[الملك: ٨–٩]<\/span>، الآية بتمامها."]], "tr": [[3031.0, "Bununla size, hüccet ikame edilmeden —hüccet ikame edilmeden— tekfir olmayacağı konusundaki âlimlerin icmâını açıklamak istedim."], [3038.3, "Buna dair deliller Kitap'tan ve Sünnet'ten çoktur."], [3040.0, "Kur'an'dan mesela Allah Azze ve Celle'nin şu sözü:"], [3049.0, "<span class=\"ayah\">﴿Biz bir resul göndermedikçe azap edici değiliz﴾<\/span> [İsrâ 15]."], [3052.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Müjdeleyici ve uyarıcı resuller (gönderdik) ki resullerden sonra insanların Allah'a karşı bir delili olmasın﴾<\/span> [Nisâ 165]."], [3061.9, "Allah Azze ve Celle şöyle buyurdu:"], [3065.5, "<span class=\"ayah\">﴿Oraya her bir topluluk atıldıkça, bekçileri onlara \"Size bir uyarıcı gelmedi mi?\" diye sorar. Onlar da derler ki: \"Evet, bize bir uyarıcı geldi; fakat biz yalanladık ve Allah hiçbir şey indirmedi dedik.\"﴾<\/span> [Mülk 8–9] —ayetin tamamı—."]]}, {"reader": false, "ar": [[3079.0, "وقال تعالى: <span class=\"ayah\">﴿فَاعْتَرَفُوا﴾<\/span>، إلى قوله:"], [3082.0, "<span class=\"ayah\">﴿فَاعْتَرَفُوا بِذَنبِهِمْ فَسُحْقًا لِّأَصْحَابِ السَّعِيرِ﴾<\/span> <span class=\"ref\">[الملك: ١١]<\/span>."], [3085.0, "وقال تعالى: <span class=\"ayah\">﴿يَا مَعْشَرَ الْجِنِّ وَالْإِنسِ أَلَمْ يَأْتِكُمْ رُسُلٌ مِّنكُمْ يَقُصُّونَ عَلَيْكُمْ آيَاتِي وَيُنذِرُونَكُمْ لِقَاءَ يَوْمِكُمْ هَٰذَا ۚ قَالُوا شَهِدْنَا عَلَىٰ أَنفُسِنَا ۖ وَغَرَّتْهُمُ الْحَيَاةُ الدُّنْيَا وَشَهِدُوا عَلَىٰ أَنفُسِهِمْ أَنَّهُمْ كَانُوا كَافِرِينَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٣٠]<\/span>."], [3104.0, "وقال تعالى: <span class=\"ayah\">﴿وَمَا ظَلَمْنَاهُمْ وَلَٰكِن كَانُوا هُمُ الظَّالِمِينَ﴾<\/span> <span class=\"ref\">[الزخرف: ٧٦]<\/span>."]], "tr": [[3079.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿İtiraf ettiler…﴾<\/span> şu sözüne kadar:"], [3082.0, "<span class=\"ayah\">﴿Böylece günahlarını itiraf ettiler. Alevli ateşin halkı (Allah'ın rahmetinden) uzak olsun!﴾<\/span> [Mülk 11]."], [3086.9, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Ey cin ve insan topluluğu! İçinizden size ayetlerimi anlatan ve bu gününüze kavuşacağınız konusunda sizi uyaran resuller gelmedi mi? Dediler ki: \"Kendi aleyhimize şahitlik ederiz.\" Dünya hayatı onları aldattı ve kâfir olduklarına dair kendi aleyhlerine şahitlik ettiler﴾<\/span> [En'âm 130]."], [3104.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Biz onlara zulmetmedik; fakat zalimler bizzat onlardı﴾<\/span> [Zuhruf 76]."]]}, {"reader": false, "ar": [[3110.0, "والظالم: من عرف ما جاء به الرسول صلى الله عليه وسلم وتمكّن من معرفته،"], [3117.0, "ولكنه لم يَدِنْ له،"], [3119.7, "ولم يرفع به رأسًا،"], [3122.4, "كِبرًا وعنادًا. ولا بدّ أن نعلم ـ قبل أن ننتقل للمسألة الثانية ـ أنّ قيام الحجّة يختلف باختلاف الزمان،"], [3140.2, "واختلاف المكان، واختلاف الحال."], [3147.0, "فليس بالضرورة إذا قامت الحجّة على فردٍ أن تقوم على الأفراد الآخرين،"], [3153.0, "أو إذا قامت في بلدٍ أن تكون قد قامت في كلّ بلاد المسلمين في الأرض،"], [3163.0, "أو إذا قامت على أهل زمانٍ أن تستوفي أجزاءَ الزمان قائمةً."]], "tr": [[3110.0, "Zalim, Resûl ﷺ'in getirdiğini bilen ve onu bilme imkânı bulan, fakat ona boyun eğmeyen ve kibir ve inat sebebiyle ona hiç değer vermeyen (başını kaldırmayan) kimsedir."], [3127.0, "İkinci meseleye geçmeden önce şunu bilmemiz gerekir:"], [3132.0, "Hüccetin ikamesi zamanın farklılığı, mekânın farklılığı ve hâlin farklılığıyla farklılaşır."], [3147.0, "Hüccet bir ferde ikame edildiğinde diğer fertlere de ikame edilmesi;"], [3152.0, "bir beldede ikame edildiğinde yeryüzündeki bütün Müslüman beldelerinde ikame edilmiş olması;"], [3159.0, "ya da bir zamanın ehline ikame edildiğinde zamanın bütün parçalarını kaplayacak şekilde ikame olunmuş olması zorunlu değildir."]]}, {"reader": false, "ar": [[3171.0, "وذلك لأنّ قيام الحجّة له أسبابُه؛"], [3177.0, "فمن أسبابه: كثرةُ العلماء،"], [3179.4, "وانتشارُ أهل السنة والجماعة في الأرض،"], [3183.0, "ورغبةُ الناس في العلم والتعلّم،"], [3186.6, "وانتشارُ أنوار النبوّة، وضعفُ كلمة أهل الباطل."], [3192.0, "ومن أسباب عدم انتشارها:"], [3194.6, "قلّةُ علماء أهل السنة،"], [3197.3, "أو منعُهم من التعليم،"], [3199.9, "وانتشارُ أهل البدع في الأرض."], [3205.0, "ولذلك فإنّ الإسلام عند كثيرٍ من الناس في أطراف الأرض ـ وإن كان وصله ـ لكن وصله بصورةٍ مشوّهة،"], [3216.8, "بصورةٍ بدعيّة، بصورةٍ تحريفيّةٍ تأويليّة،"], [3223.0, "ليس هو الإسلامَ الصحيحَ الصافيَ عن كلّ شَوبٍ وكَدَر."]], "tr": [[3171.0, "Bu şundandır: Hüccetin ikamesinin sebepleri vardır."], [3177.0, "Sebeplerinden bazıları şunlardır: Âlimlerin çokluğu, Ehl-i Sünnet ve'l-Cemaat'in yeryüzünde yayılması, insanların ilme ve öğrenmeye rağbeti, nübüvvet nurlarının yayılması ve bâtıl ehlinin sözünün zayıflığı."], [3192.0, "Onun yayılmamasının sebeplerinden bazıları da şunlardır:"], [3194.6, "Ehl-i Sünnet âlimlerinin azlığı ya da öğretmekten men edilmeleri ve bid'at ehlinin yeryüzünde yayılması."], [3205.0, "Bu yüzden yeryüzünün uç bölgelerindeki birçok insan nezdinde İslam, kendilerine ulaşmış olsa bile, çarpıtılmış bir surette, bid'atçi bir surette, tahrif ve te'vil edilmiş bir surette ulaşmıştır;"], [3219.5, "her türlü karışıklıktan ve bulanıklıktan arınmış sahih ve saf İslam değildir."]]}, {"reader": false, "ar": [[3228.0, "وبناءً على ذلك ننتقل للمسألة التي بعدها،"], [3232.9, "وهي أهمُّ منها: إذا أقررنا بأنّ قيام الحجّة شرطٌ في التكفير،"], [3242.0, "فما شروطُ قيامها؟ الجواب:"], [3246.7, "أجمع العلماء على أنّ بلوغ النصّ شرطٌ في قيامها،"], [3254.0, "وبناءً على اشتراط هذا الشرط:"], [3257.3, "فكلُّ من لم تبلغه النصوص فإنه لم تقم عليه الحجّة؛"], [3269.0, "للأدلّة التي ذكرتها لكم قبل قليل."]], "tr": [[3228.0, "Buna göre bundan sonraki meseleye geçiyoruz;"], [3231.5, "o, öncekinden daha önemlidir: Hüccetin ikamesinin tekfirde şart olduğunu kabul ettiğimize göre, onun ikamesinin şartları nelerdir?"], [3246.0, "Cevap: Âlimler, nassın ulaşmasının onun ikamesinde şart olduğu üzerinde icmâ etmişlerdir."], [3257.3, "Bu şartın koşulmasına göre: Nasslar kendisine ulaşmayan herkese, az önce size zikrettiğim deliller sebebiyle hüccet ikame edilmemiştir."]]}, {"reader": false, "ar": [[3273.0, "وأمّا الشرط الثاني ففيه نوعُ خلاف،"], [3277.1, "إن حقّقناه وجدناه خلافًا لفظيًّا؛"], [3287.0, "لأنّ الخلاف المنقول في هذه المسألة لا يتوارد على موضعٍ واحد،"], [3297.0, "وإنما يتوارد على موضعين اثنين مختلفين."], [3303.0, "فمن العلماء من اشترط الفهم،"], [3306.5, "ومن العلماء من لم يشترط الفهم،"], [3312.0, "وكلا القولين صواب، ولكن لا بدّ أن نعرف حقيقةَ الفهم الذي ينفيه هذا العالم،"], [3326.0, "والفهمَ الذي يثبته هذا العالم."]], "tr": [[3273.0, "İkinci şarta gelince, onda bir tür ihtilaf vardır;"], [3276.5, "onu tahkik edersek lafzî bir ihtilaf olduğunu görürüz."], [3287.0, "Çünkü bu meselede nakledilen ihtilaf tek bir yere varid olmaz;"], [3293.9, "aksine iki farklı yere varid olur."], [3303.0, "Âlimlerden bazıları anlamayı şart koşmuştur, bazıları ise anlamayı şart koşmamıştır."], [3309.9, "Her iki görüş de doğrudur;"], [3317.7, "fakat bu âlimin nefyettiği anlamanın ve şu âlimin isbat ettiği anlamanın hakikatini bilmemiz gerekir."]]}, {"reader": false, "ar": [[3330.0, "وتحريرُ المسألة أن نقول:"], [3333.0, "إنّ الفهم ينقسم إلى قسمين:"], [3337.0, "إلى الفهم الكامل التامّ في النصّ،"], [3341.0, "فيفهم منطوقَه ومفهومَه ودلالاتِه ولوازمَه والأحكامَ المندرجةَ تحته،"], [3351.0, "كفهم أبي بكرٍ وعمر،"], [3354.0, "وكفهم الصحابة والأئمّة الأربعة،"], [3357.0, "أو كفهم أبي العبّاس ابن تيمية؛"], [3359.0, "فإنّ هذا الفهم المطلق الكامل ليس بشرطٍ في قيام الحجّة إجماعًا، إجماعًا."]], "tr": [[3330.0, "Meselenin tahriri (net ortaya konması) şöyle demektir:"], [3333.0, "Anlama iki kısma ayrılır. (Birincisi) nassı kâmil ve tam anlamaktır:"], [3337.0, "Onun mantûkunu (lafzının doğrudan ifade ettiğini), mefhûmunu, delâletlerini, lâzımlarını ve altına giren hükümleri anlar;"], [3348.9, "Ebû Bekir'in ve Ömer'in anlayışı, sahabenin ve dört imamın anlayışı ya da Ebu'l-Abbâs İbn Teymiyye'nin anlayışı gibi."], [3359.0, "Bu mutlak ve kâmil anlayış, icmâ ile —icmâ ile— hüccetin ikamesinde şart değildir."]]}, {"reader": false, "ar": [[3368.0, "فإنني لا أعلم عالمًا من المتقدّمين والمعاصرين يشترط لقيام الحجّة هذا الفهمَ الكاملَ التامّ؛"], [3379.0, "لأننا لو اشترطناه لحكمنا بعدم قيامه
