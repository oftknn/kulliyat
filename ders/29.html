<script>
const D={"no": 29, "vid": "DTa91jOcksw", "title_ar": "الدرس (٢٩) من شرح كليات العقيدة — من كليات البدع", "title_tr": "Şerhu Külliyyâti'l-Akîde — 29. Ders: Bid'at Külliyeleri (Bid'atin Yollarını Kapatmak, Bid'at Ehliyle Yardımlaşma, Şahıs ve Söz Etrafında Velâ-Berâ, Kılıç, Nisbet, Bid'atçiden İlim Almak, Akîde Kitaplarındaki Fıkhî Fer'ler, Selefin Ameli, Vesileler)", "sections": [{"ts": "00:00", "title": "1. Külliye: Bid'at ehlinin şerrinin kalplere sızdığı her yolu kapatmak vaciptir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.9, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.6, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.0, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [9.7, "لا نزال ـ ولله الحمدُ والمنّة ـ في سياق الكلام على كلّيّات البدع وأصولها وقواعدها،"], [15.8, "وعندنا في هذا اليوم قرابةُ العشر كلّيّات."], [19.0, "الكلّيّة الأولى في هذا الدرس:"], [22.1, "<b>كلُّ طريقٍ يتسلّل منه شرُّ أهل البدع إلى القلوب فالواجبُ سدُّه.<\/b> <span class=\"note\">(يكررها)<\/span> فالواجب سدُّه."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.4, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.7, "Hamd ve minnet Allah'a olsun, hâlâ bid'at külliyeleri, onların asılları ve kaideleri hakkındaki söz bağlamındayız."], [16.2, "Bugün elimizde on kadar külliye var."], [19.0, "Bu dersteki <b>1. külliye: Bid'at ehlinin şerrinin kalplere sızdığı her yolu kapatmak vaciptir.<\/b> Onu kapatmak vaciptir."]]}, {"reader": false, "ar": [[43.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرّر في القواعد وأصول الشريعة أنّ الشريعة إذا نهت عن شيءٍ فإنها تنهى عن كلّ طريقٍ يُفضي إليه."], [54.0, "ولأنّ المتقرّر في القواعد أنّ الوسائل لها أحكامُ المقاصد."], [59.0, "ولأنّ المتقرّر في القواعد أنّ كلَّ طريقٍ يُفضي إلى الحرام إفضاءَ علمٍ أو غلبةِ ظنٍّ فالواجبُ سدُّه."], [69.0, "وإنّ من أعظم ما نهى الشارعُ عنه بعد الشرك:"], [73.5, "البدع؛ فلا جرم أنّ كلَّ طريقٍ يُفضي إلى انتشار البدع فإنّ الواجبَ سدُّه."]], "tr": [[43.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [45.1, "Kaidelerde ve şeriatin asıllarında yerleşik olan şudur:"], [49.3, "Şeriat bir şeyi yasakladığında, ona götüren her yolu da yasaklar."], [52.5, "Ve kaidelerde yerleşik olan şudur:"], [54.0, "Vesileler, maksatların hükümlerini alır. Ve kaidelerde yerleşik olan şudur:"], [59.0, "Harama kesin bilgiyle ya da galip zanla götüren her yolu kapatmak vaciptir."], [69.0, "Şâri'nin şirkten sonra yasakladığı en büyük şeylerden biri bid'atlerdir."], [73.5, "Şüphesiz bid'atlerin yayılmasına götüren her yolu kapatmak vaciptir."]]}, {"reader": false, "ar": [[80.0, "وبناءً على ذلك: حرّم أهلُ السنة والجماعة مجالسةَ أهل البدع،"], [86.0, "ونصوصُهم في التحذير من مجالستهم كثيرةٌ جدًّا."], [91.0, "ويُفرَّع على ذلك: موادّةُ أهل البدع؛"], [97.0, "فلا ينبغي أن يعقد الإنسانُ فيما بينه وبين أحدٍ من أهل البدع شيئًا من الموادّة أو الصحبة."], [104.0, "وفرّعوا على ذلك أيضًا:"], [106.7, "حرمةَ استماع أطروحاتهم في أيّ وسيلةٍ من الوسائل؛"], [112.0, "فلا يجوز للإنسان أن يعمد إلى قناةٍ من قنوات أهل البدع فيستمع إلى ما فيها من الأطروحات؛"], [121.0, "لأنّ ذلك ممّا يجعل شرَّ بدعتهم يتسلّل إلى قلبه من حيث لا يشعر."], [127.0, "ولا ينبغي للإنسان أن يثق في علميّته الثقةَ التي تجعله يتخبّط في مثل هذه المزالق."]], "tr": [[80.0, "Buna göre Ehl-i Sünnet ve'l-Cemaat, bid'at ehliyle oturup kalkmayı haram kılmıştır;"], [86.0, "onlarla oturup kalkmaktan sakındıran sözleri pek çoktur."], [91.0, "Buna bid'at ehline muhabbet beslemek de bağlanır:"], [97.0, "İnsanın kendisiyle bid'at ehlinden biri arasında herhangi bir muhabbet ya da arkadaşlık bağı kurması uygun değildir."], [104.0, "Buna ayrıca onların görüşlerini herhangi bir vasıtada dinlemenin haramlığını da bağlamışlardır:"], [112.0, "İnsanın bid'at ehlinin kanallarından birine yönelip oradaki görüşleri dinlemesi caiz değildir;"], [121.0, "çünkü bu, onların bid'atinin şerrinin, o farkına varmadan kalbine sızmasına yol açan şeylerdendir."], [127.0, "İnsanın, kendi ilmine, kendisini bu tür kaygan zeminlerde bocalatacak derecede güvenmesi uygun değildir."]]}, {"reader": false, "ar": [[138.0, "ومن ذلك أيضًا: مناظرةُ أهل البدع؛"], [141.2, "فإنّ أهل السنة يحذّرون منها،"], [143.8, "إلا ما دعا له داعي الضرورة،"], [147.0, "أو الحاجةِ الملحّة، أو المصلحةِ الراجحة،"], [150.2, "إذا كان سيتولّاها العلماءُ الراسخون المتأهّلون في باب المناظرات."], [155.0, "ومن ذلك أيضًا: يحرُم على الإنسان أن يتتبّع مواقعهم على الشبكات العنكبوتيّة ـ وما أكثرَها ـ،"], [165.0, "ولا ينبغي أن يشاركهم،"], [167.0, "ولا أن يُعجَب بأطروحاتهم،"], [169.0, "ولا أن يتلمّس أقوالهم فيها،"], [172.0, "ولا أن يشاركهم في شيءٍ من هذه الوسائل بأيّ نوعٍ من أنواع المشاركة."]], "tr": [[138.0, "Bundan biri de bid'at ehliyle münazara etmektir."], [141.2, "Ehl-i Sünnet bundan sakındırır; ancak zaruret, acil ihtiyaç ya da râcih bir maslahat gerektirdiğinde ve onu münazara babında râsih ve ehil âlimler üstlenecekse müstesnadır."], [155.0, "Bundan biri de şudur: İnsanın onların internet (ağları) üzerindeki sitelerini —ki ne kadar da çoktur— takip etmesi haramdır."], [167.0, "Onlara katılması, görüşlerini beğenmesi, oradaki sözlerinin peşine düşmesi ve bu vasıtaların herhangi birinde herhangi bir katılım türüyle onlara iştirak etmesi uygun değildir."]]}, {"reader": false, "ar": [[177.0, "ومن ذلك أيضًا: أنه لا ينبغي للسنّيّ أن يُحسن الظنَّ بأحدٍ من أهل البدع؛"], [184.0, "فإنّ الأصل في أهل البدع سوءُ الظنّ،"], [188.0, "فإنّ من أحسن الظنَّ بهم فإنه يفتح قلبه لهم،"], [192.0, "ويعرّض نفسه للخطر. ومن ذلك أيضًا:"], [196.1, "فتحُ بابٍ لهم للتواصل مع العامّة؛"], [201.0, "فلا يجوز لأصحاب القنوات أن يستضيفوا علماءَ أهل البدع ليطرحوا بدعتهم أمام الناس،"], [209.0, "لا سيّما في القنوات المشهورة التي يتابعها ملايينُ الناس من العامّة؛"], [215.0, "فإنّ هذا من أعظم ما يتسلّل شرُّ البدعة إلى القلوب عن طريقه."]], "tr": [[177.0, "Bundan biri de şudur: Sünnî kimsenin bid'at ehlinden herhangi biri hakkında hüsnüzan beslemesi uygun değildir;"], [184.0, "çünkü bid'at ehli hakkında asıl olan sûizandır."], [188.0, "Onlar hakkında hüsnüzan besleyen, kalbini onlara açar ve kendini tehlikeye atar."], [194.0, "Bundan biri de onlara halkla iletişim kurmaları için bir kapı açmaktır:"], [201.0, "Kanal sahiplerinin, bid'atlerini insanların önüne sermeleri için bid'at ehlinin âlimlerini konuk etmeleri caiz değildir;"], [209.5, "özellikle de halktan milyonlarca insanın takip ettiği meşhur kanallarda."], [215.0, "Çünkü bu, bid'atin şerrinin kalplere sızdığı en büyük yollardandır."]]}, {"reader": false, "ar": [[222.0, "ومن ذلك: ما ثبت عن السلف رحمهم الله تعالى أنهم نهَوا أشدَّ النهي عن توقير أهل البدع وإظهار احترامهم؛"], [233.0, "فإنّ ذلك لا يجوز،"], [235.0, "لا سيّما أمام العامّة."], [237.0, "ولذلك قال الفُضيل بن عياض رحمه الله تعالى:"], [240.8, "«من وقّر صاحبَ بدعةٍ فقد أعان على هدم الإسلام»."], [245.0, "فمن عظّم أهلَ البدع،"], [247.7, "وزكّى مذهبهم، وأثنى على دعوتهم،"], [251.0, "فهو مبتدعٌ مثلُهم، ومشاركٌ لهم في نقض السنّة،"], [255.8, "وإبطال التوحيد، وتحريف النصوص."], [258.0, "والخلاصة من هذه القاعدة:"], [260.2, "أنّ أيَّ وسيلةٍ تتضمّن تسلُّلَ شيءٍ من البدعة،"], [264.7, "أو تحسينِها، أو زخرفتِها إلى قلبك،"], [268.0, "فالواجبُ عليك أن تسدّه،"], [271.1, "وألّا تعرّض إيمانك للخطر،"], [274.1, "ولا توحيدك للتلف. والله أعلم."]], "tr": [[222.0, "Bundan biri de selef —Allah Teâlâ onlara rahmet etsin— hakkında sabit olan şeydir:"], [227.2, "Onlar bid'at ehline saygı göstermeyi ve onlara hürmet izhar etmeyi en şiddetli şekilde yasaklamışlardır."], [233.0, "Bu caiz değildir; özellikle de halkın önünde."], [235.5, "Bu yüzden Fudayl b. Iyâd —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [240.8, "\"Bir bid'at sahibine saygı gösteren, İslam'ın yıkılmasına yardım etmiş olur.\" Bid'at ehlini yücelten, mezheplerini temize çıkaran ve davetlerini öven kimse onlar gibi bid'atçidir;"], [252.3, "sünneti bozmada, tevhidi iptal etmede ve nasları tahrif etmede onlara ortaktır."], [258.0, "Bu kaideden çıkan sonuç şudur:"], [260.2, "Bid'atten bir şeyin kalbine sızmasını, onun güzel gösterilmesini ya da süslenmesini içeren her vesileyi kapatman ve imanını tehlikeye, tevhidini de telefe maruz bırakmaman sana vaciptir. Allah en iyisini bilir."]]}]}, {"ts": "04:39", "title": "2. Külliye: Bid'at ehliyle yardımlaşmayı gerektiren zaruret ya da ihtiyaç", "paras": [{"reader": false, "ar": [[279.0, "ومن الكلّيّات أيضًا: <b>كلُّ ضرورةٍ أو حاجةٍ تدعو للتعاون مع أهل البدع فيجوز بقدره إن كانت مصالحُه أكثرَ من مفاسده.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرةً أخرى:"], [308.0, "كلُّ ضرورةٍ تدعو للتعاون مع أهل البدع فيجوز بقدره إن كانت مصالحُه أكثرَ من مفاسده."]], "tr": [[279.0, "Külliyelerden biri de şudur: 2."], [282.0, "külliye: Bid'at ehliyle yardımlaşmaya çağıran her zaruret ya da ihtiyaç (durumunda bu yardımlaşma), maslahatları mefsedetlerinden fazla ise, onun ölçüsünde caizdir. Bir kez daha tekrarlıyorum:"], [308.0, "Bid'at ehliyle yardımlaşmaya çağıran her zaruret (durumunda bu yardımlaşma), maslahatları mefsedetlerinden fazla ise, onun ölçüsünde caizdir."]]}, {"reader": false, "ar": [[324.0, "وهذه الكلّيّة تتكلّم عن حكم تعاون أهل السنة مع أهل البدع،"], [329.0, "وهي تتكلّم عن أمرٍ استثنائيّ،"], [332.1, "وإلا فالأصلُ وجوبُ مصارمة أهل البدع،"], [335.9, "ومقاطعتِهم، والبراءةِ منهم ومن بدعتهم."], [339.0, "لكن أحيانًا قد تحمل السنّيَّ الظروفُ على أن يشارك أهلَ البدع في بعض الأمور؛"], [347.0, "فهل يجوز له أن يتعاون مع أهل البدع في بعض الأمور؟"], [351.0, "فيه خلافٌ بين أهل العلم،"], [353.5, "ولكنّ القول الصحيح: جوازُه مشروطًا بهذه القيود والضوابط التي ذُكرت في هذه الكلّيّة."]], "tr": [[324.0, "Bu külliye, Ehl-i Sünnet'in bid'at ehliyle yardımlaşmasının hükmünden bahseder."], [327.2, "İstisnaî bir durumdan bahseder; yoksa asıl olan, bid'at ehlinden kesin olarak ayrılmanın, onlarla ilişkiyi kesmenin ve onlardan ve bid'atlerinden berî olmanın vacip oluşudur."], [339.0, "Fakat bazen şartlar sünnî kimseyi bazı işlerde bid'at ehline katılmaya zorlayabilir."], [347.0, "Bazı işlerde bid'at ehliyle yardımlaşması ona caiz midir?"], [351.0, "Bu konuda ilim ehli arasında ihtilaf vardır;"], [355.0, "fakat sahih görüş, bu külliyede zikredilen bu kayıt ve zâbıtlarla şartlı olarak caiz oluşudur."]]}, {"reader": false, "ar": [[360.0, "والتي منها أولًا: ألّا يكون ذلك إلا لأهل العلم المتأهّلين الراسخين؛"], [367.0, "فلا ينبغي للمبتدئين من أهل السنة أن يتعاونوا مع أهل البدع في أيّ أمر؛"], [372.0, "لأنّ تعاون المبتدئ مع أهل البدع تعاونٌ ستكون مفاسدُه أكثرَ من مصالحه."], [382.0, "والشرط الثاني: أن تدعو إليه ـ إلى هذا التعاون ـ ضرورةٌ أو حاجةٌ لا يمكن دَرْكُها إلا به؛"], [392.0, "لأنّ المتقرّر في القواعد أنه يقال في باب الضرورات والحاجيّات الملحّة ما لا يقال في باب التوسّع والاختيار."], [402.0, "وبناءً على ذلك: فإننا إذا وجدنا طريقًا آخر لتحقيق هذه المصلحة الشرعيّة بدون التعاون معهم،"], [411.5, "فإنّ الأصل باقٍ على حاله، وهو المنع."]], "tr": [[360.0, "Bunlardan birincisi: Bunun ancak ehil ve râsih ilim ehli için olmasıdır."], [367.0, "Ehl-i Sünnet'ten yeni başlayanların herhangi bir işte bid'at ehliyle yardımlaşması uygun değildir;"], [372.0, "çünkü yeni başlayanın bid'at ehliyle yardımlaşması, mefsedetleri maslahatlarından fazla olacak bir yardımlaşmadır."], [382.0, "İkinci şart: Ona —bu yardımlaşmaya— ancak onunla elde edilebilecek bir zaruret ya da ihtiyacın çağırmasıdır."], [392.0, "Çünkü kaidelerde yerleşik olan şudur:"], [395.2, "Zaruretler ve acil ihtiyaçlar babında, genişlik ve serbest tercih babında söylenmeyen şeyler söylenir."], [402.0, "Buna göre, bu şer'î maslahatı onlarla yardımlaşmadan gerçekleştirmek için başka bir yol bulursak, asıl hâli üzere kalır; o da yasaklıktır."]]}, {"reader": false, "ar": [[415.0, "الشرط الثالث: أن تكون مصالحُ هذا التعاون أكثرَ من مفاسده."], [421.0, "وهذا لا يخصّ أهل البدع،"], [423.0, "بل حتى ولو مع الكفرة الأصليّين؛"], [426.0, "فإذا كان هناك بابُ خيرٍ ستعود مصالحُه وبركاتُه على المسلمين ـ على أهل الإسلام والمسلمين ـ،"], [434.0, "ولكن لا بدّ أن نسلك هذا الطريق:"], [437.5, "إمّا أن نتعاون مع أهل البدع في تحقيقه وتحصيله،"], [442.0, "أو أن نتعاون مع الكفّار الأصليّين لتحقيقه أو تحصيله،"], [446.2, "فإنه لا بأس به إذا كانت مصالحُه أكثرَ من مفاسده،"], [451.0, "وتولّى ذلك أهلُ العلم."]], "tr": [[415.0, "Üçüncü şart: Bu yardımlaşmanın maslahatlarının mefsedetlerinden fazla olmasıdır."], [421.0, "Bu bid'at ehline mahsus değildir;"], [423.0, "hatta aslî kâfirlerle bile olsa (geçerlidir)."], [426.0, "Maslahatları ve bereketleri Müslümanlara —İslam ehline ve Müslümanlara— dönecek bir hayır kapısı varsa ve bu yola girmemiz gerekiyorsa —ya onu gerçekleştirmede ve elde etmede bid'at ehliyle yardımlaşırız ya da onu gerçekleştirmek veya elde etmek için aslî kâfirlerle yardımlaşırız—, maslahatları mefsedetlerinden fazla olduğu ve bunu ilim ehli üstlendiği takdirde bunda bir sakınca yoktur."]]}, {"reader": false, "ar": [[453.0, "والشرط الذي بعده: قوله «بقدره»؛"], [456.4, "لأنّ التعاون معهم إنما كان بسبب الضرورة أو الحاجة،"], [463.0, "والمتقرّر في القواعد أنّ الضرورات والحاجيّات تُقدَّر بقدرها."], [469.0, "فمتى ما توفّرت هذه الشروط فإنه يجوز للسنّيّ العالم المتأهّل أن يتعاون مع أهل البدع في تحصيل هذه المصلحة التي تكون مصالحُ تحصيلها أكثرَ من مفاسدها."], [482.4, "هذا هو الحقّ في ـ هذا هو الراجح في هذه المسألة إن شاء الله تعالى."], [489.0, "وقد طال حولها الكلام،"], [491.1, "لكنّ ما قرّرتُه لكم في هذه الكلّيّة هو الأقرب إن شاء الله تعالى."]], "tr": [[453.0, "Ondan sonraki şart: \"Onun ölçüsünde\" sözüdür."], [455.0, "Çünkü onlarla yardımlaşma ancak zaruret ya da ihtiyaç sebebiyle olmuştur;"], [461.1, "kaidelerde yerleşik olan şudur: Zaruretler ve ihtiyaçlar kendi ölçüleriyle takdir edilir."], [469.0, "Bu şartlar bir araya geldiğinde, ehil sünnî âlimin, elde edilmesinin maslahatları mefsedetlerinden fazla olan bu maslahatı elde etmede bid'at ehliyle yardımlaşması caizdir."], [482.4, "Bu meselede hak olan —bu meselede râcih olan— inşallah budur."], [489.0, "Bu mesele etrafında söz uzamıştır;"], [491.6, "fakat bu külliyede size takrir ettiğim, inşallah (hakka) en yakın olandır."]]}, {"reader": false, "ar": [[498.0, "لا سيّما وأنّ كثيرًا من أهل السنة في كثيرٍ من أهل البلاد إنما يُعتبرون أقلّيّةً ضعيفةً لا سلطانَ لهم،"], [505.5, "ولا يدَ تحميهم؛ فلو أننا حرّمنا عليهم ـ أو فاصلناهم،"], [512.0, "أو جعلناهم يفاصلون أهلَ البدع في بلادهم المفاصلةَ المطلقة ـ فلربما تفوت المسلمين كثيرٌ من المصالح التي لا بدّ لهم منها."], [525.0, "وبناءً على ذلك: فلا يقال هذا الأمر ـ أي جوازُ التعاون معهم بهذه الشروط ـ إلا في حال الضعف،"], [536.7, "أو في حال بلدٍ تكون الهيمنةُ والسلطةُ في يد أهل البدع. والله أعلم."]], "tr": [[498.0, "Özellikle de pek çok ülkede Ehl-i Sünnet'in birçoğu, hiçbir otoritesi ve kendisini koruyacak hiçbir gücü olmayan zayıf bir azınlık sayılır."], [505.5, "Eğer onlara (bunu) haram kılsaydık —ya da onlarla ayrışsaydık veya onları kendi ülkelerinde bid'at ehlinden mutlak bir ayrılıkla ayrılmaya zorlasaydık— belki de Müslümanlar, mutlaka ihtiyaç duydukları birçok maslahatı kaçırırdı."], [525.0, "Buna göre bu hüküm —yani bu şartlarla onlarla yardımlaşmanın caiz oluşu— ancak zayıflık hâlinde ya da hâkimiyetin ve otoritenin bid'at ehlinin elinde olduğu bir ülke hâlinde söylenir. Allah en iyisini bilir."]]}]}, {"ts": "09:06", "title": "3. Külliye: Ümmete Resûlullah ﷺ'den başka bir metbû dikip onun etrafında velâ ve berâ yapan bid'atçidir", "paras": [{"reader": false, "ar": [[546.0, "ومن الكلّيّات أيضًا: كلُّ من نصب للأمّة متبوعًا غيرَ رسول الله صلى الله عليه وسلم،"], [555.7, "ووالى وعادى على موافقته أو مخالفته،"], [561.5, "فمبتدع. أُعيدها مرةً أخرى:"], [565.9, "كلُّ من نصب للأمّة متبوعًا غيرَ الرسول صلى الله عليه وسلم،"], [573.1, "ووالى وعادى على موافقته أو مخالفته،"], [577.0, "فمبتدع. وأُعيدها مرةً ثالثة:"], [586.0, "كلُّ من نصب للأمّة متبوعًا غيرَ رسول الله صلى الله عليه وسلم،"], [594.0, "ووالى وعادى على موافقته أو مخالفته، فمبتدع."]], "tr": [[546.0, "Külliyelerden biri de şudur: 3."], [547.9, "külliye: Ümmete Resûlullah ﷺ'den başka bir metbû (uyulan önder) dikip ona uyup uymamaya göre dostluk ve düşmanlık eden herkes bid'atçidir. Bir kez daha tekrarlıyorum:"], [565.9, "Ümmete Resûl ﷺ'den başka bir metbû dikip ona uyup uymamaya göre dostluk ve düşmanlık eden herkes bid'atçidir."], [583.0, "Üçüncü kez tekrarlıyorum: Ümmete Resûlullah ﷺ'den başka bir metbû dikip ona uyup uymamaya göre dostluk ve düşmanlık eden herkes bid'atçidir."]]}, {"reader": false, "ar": [[601.0, "أقول وبالله التوفيق: وهذا شأنُ أهل البدع:"], [605.0, "أن ينصبوا لهم إمامًا معظّمًا عندهم على طريقتهم،"], [609.0, "ثم يجعلون الولاءَ والبراءَ منصبًّا على موافقته أو مخالفته؛"], [614.0, "فمن والاه ووافقه فهو من أهل السنة،"], [618.0, "ومن أهل الاتّباع، ومن أهل الحقّ والهدى،"], [622.0, "ومن خالفه في شيءٍ من أقواله،"], [625.0, "أو أطروحاته، أو اختياراته،"], [627.0, "أو منهجيّته، فإنه من أهل البدع والرَّدى والهوى."], [632.0, "فقد جعل أهلُ السنة والجماعة هذا الأمرَ من جملة (مسالك) أهل البدع."]], "tr": [[601.0, "Tevfik Allah'tandır, derim ki: Bid'at ehlinin hâli budur:"], [605.0, "Kendi yolları üzere, kendilerince yüceltilen bir imam dikerler;"], [609.0, "sonra velâ ve berâyı ona uyup uymamaya yöneltirler."], [614.0, "Kim onu dost edinir ve ona uyarsa, o Ehl-i Sünnet'tendir, ittibâ ehlindendir, hak ve hidayet ehlindendir."], [622.0, "Kim de onun sözlerinden, görüşlerinden, tercihlerinden ya da metodundan herhangi birinde ona muhalefet ederse, o bid'at, helak ve heva ehlindendir."], [632.0, "Ehl-i Sünnet ve'l-Cemaat bu durumu bid'at ehlinin (yollarından) saymıştır."]]}, {"reader": false, "ar": [[639.0, "إذ لا حقَّ لأحدٍ أبدًا أن ينصب للأمّة متبوعًا يأمرهم باتّباعه،"], [644.9, "وبأخذ أقواله، وبموافقته في كلّ منهجيّته،"], [649.8, "وبألّا يخالفوه في صَدَرٍ ولا وِرْد،"], [655.0, "إلا رسولَ الله صلى الله عليه وسلم."], [658.0, "فالنبيّ صلى الله عليه وسلم هو ذلك المتبوعُ الذي نوالي على متابعته ونعادي على مخالفته."], [666.0, "وأمّا من عداه فإنما نواليه بقدر ما معه من موافقة الكتاب والسنة وهدي السلف الصالح،"], [673.1, "ونصارمه ونخالفه ونعاديه بقدر ما معه من المخالفة للكتاب والسنة وهدي السلف الصالح."], [682.0, "هذا الذي عليه جماعةُ أهل السنة والجماعة وأهلُ الحقّ."]], "tr": [[639.0, "Çünkü hiç kimsenin, ümmete kendisine uymalarını, sözlerini almalarını, bütün metodunda ona muvafakat etmelerini ve hiçbir hususta ona muhalefet etmemelerini emredeceği bir metbû dikmeye asla hakkı yoktur;"], [656.3, "Resûlullah ﷺ müstesna. Nebî ﷺ, kendisine uymaya göre dost olduğumuz ve kendisine muhalefete göre düşman olduğumuz o metbûdur."], [666.0, "Ondan başkasına gelince, onu ancak Kitap'a, Sünnet'e ve selef-i sâlihînin yoluna uygunluğu ölçüsünde dost ediniriz;"], [671.6, "Kitap'a, Sünnet'e ve selef-i sâlihînin yoluna muhalefeti ölçüsünde de ondan ayrılır, ona muhalefet eder ve ona düşmanlık ederiz."], [682.0, "Ehl-i Sünnet ve'l-Cemaat topluluğu ve hak ehli bunun üzerindedir."]]}, {"reader": false, "ar": [[687.0, "وقد ابتُليت الأمّة في هذا الزمان بطوائف تجعل معظَّمها هو الفيصلَ في الموالاة والمعاداة؛"], [698.0, "فمن وافقه فهو صاحبُ الحقّ،"], [700.5, "ومن خالفه فهو صاحبُ الهوى."], [703.0, "فهذا مسلكُ أهل البدع."], [705.5, "قال أبو العباس ابن تيمية رحمه الله:"], [710.0, "«ومن نصب شخصًا ـ كائنًا من كان ـ فوالى وعادى على موافقته في القول والفعل، فهو <span class=\"ayah\">﴿مِنَ الَّذِينَ فَرَّقُوا دِينَهُمْ وَكَانُوا شِيَعًا﴾<\/span> <span class=\"ref\">[الروم: ٣٢]<\/span>. وإذا تفقّه الرجلُ وتأدّب بطريقة قومٍ من المؤمنين ـ مثل أتباع الأئمة والمشايخ ـ فليس له أن يجعل قدوته وأصحابه هم العِيار، فيوالي من وافقهم ويعادي من خالفهم»."]], "tr": [[687.0, "Bu zamanda ümmet, kendi yücelttiklerini dostluk ve düşmanlıkta ölçü yapan taifelerle imtihan edilmiştir:"], [698.0, "Ona uyan hak sahibidir, ona muhalefet eden heva sahibidir."], [703.0, "İşte bu, bid'at ehlinin yoludur."], [705.5, "Ebu'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [710.0, "\"Kim kim olursa olsun bir şahsı (önder) diker de sözde ve fiilde ona uyup uymamaya göre dostluk ve düşmanlık ederse, o <span class=\"ayah\">﴿dinlerini parça parça edip gruplara ayrılanlardandır﴾<\/span> [Rûm 32]."], [723.0, "Bir kimse fıkıh öğrenir ve imamlara ve şeyhlere uyanlar gibi mü'minlerden bir topluluğun yoluyla terbiye olursa, kendi örnek aldığı kişiyi ve arkadaşlarını ölçü yapıp onlara uyanı dost, onlara muhalefet edeni düşman edinmesi onun hakkı değildir.\""]]}, {"reader": false, "ar": [[740.0, "كالذي ينتسب لبعض الطوائف والأحزاب،"], [743.0, "أو الجماعات المعاصرة أو السابقة؛"], [746.0, "فكلُّ من دخل تحت حزبيّته ولواء طائفته والاه وأحبّه،"], [754.0, "وكلُّ من خالف حزبيّته ولم ينطوِ تحت شعار طائفته عاداه وأبغضه."], [761.0, "وقال أبو العباس ابن تيمية رحمه الله أيضًا:"], [764.0, "«وليس لأحدٍ أن ينتسب إلى شيخٍ يوالي على متابعته ويعادي على ذلك، بل عليه أن يوالي كلَّ من كان من أهل الإيمان ـ أهلًا للإيمان ـ، ومن عُرف منه التقوى من جميع الشيوخ وغيرهم، ولا يخصّ أحدًا بمزيد موالاةٍ إلا إذا ظهر له مزيدُ إيمانه وتقواه»."], [790.0, "قال رحمه الله: «فيقدّم من قدّمه الله ورسوله صلى الله عليه وسلم، ويفضّل من فضّله الله ورسوله»."]], "tr": [[740.0, "Bazı taifelere, hiziplere ya da çağdaş veya önceki cemaatlere nispet edilen kimse gibi:"], [746.0, "Onun hizbinin ve taifesinin sancağı altına giren herkesi dost edinir ve sever;"], [754.0, "hizbine muhalefet eden ve taifesinin şiarı altına girmeyen herkese düşmanlık eder ve ona buğzeder."], [761.0, "Ebu'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— ayrıca şöyle demiştir:"], [764.0, "\"Hiç kimsenin, kendisine uymaya göre dostluk ve buna göre düşmanlık ettiği bir şeyhe nispet edilmesi caiz değildir."], [773.0, "Bilakis ona düşen, iman ehlinden —imana ehil— olan herkesi ve bütün şeyhlerden ve başkalarından takvası bilinen herkesi dost edinmesidir."], [781.5, "Birinin imanının ve takvasının fazlalığı kendisine açıkça görünmedikçe kimseyi fazladan bir dostlukla tahsis etmez.\" (İbn Teymiyye) —Allah ona rahmet etsin— şöyle dedi:"], [790.0, "\"Allah'ın ve Resûlü'nün ﷺ öne geçirdiğini öne geçirir, Allah'ın ve Resûlü'nün üstün tuttuğunu üstün tutar.\""]]}, {"reader": false, "ar": [[798.0, "وهذا الذي ندين اللهَ عز وجل به."], [802.0, "وإننا لنرى في الساحة أنّ كثيرًا ممّا أوجب افتراقَ الأمّة هو هذا الأمر،"], [807.0, "وعدمُ عملهم بهذه القاعدة الأصيلة المتأصّلة،"], [812.0, "الراسخةِ جذورُها عند أهل السنة والجماعة. والله أعلم."]], "tr": [[798.0, "Allah Azze ve Celle'ye din olarak bağlandığımız (inandığımız) budur."], [802.0, "Sahada görüyoruz ki ümmetin ayrılığına yol açan şeylerin birçoğu bu meseledir ve onların, Ehl-i Sünnet ve'l-Cemaat nezdinde kökleri sağlam, köklü ve yerleşik olan bu kaideyle amel etmemeleridir. Allah en iyisini bilir."]]}]}, {"ts": "13:37", "title": "4. Külliye: Delilsiz bir söz uydurup insanları onunla fitneye düşüren ve cemaati bölen bid'atçidir", "paras": [{"reader": false, "ar": [[817.0, "ومن الكلّيّات أيضًا: كلُّ من اخترع مقالةً ـ الكلّيّة اللي قبلها:"], [823.5, "شخصًا، هذه: مقالة ـ كلُّ من اخترع مقالةً لا دليلَ عليها،"], [833.0, "وفتن الناسَ بها، وفرّق بها الجماعة،"], [836.2, "فهو مبتدع. ـ عليكم السلام أبو محمد ـ أُعيدها مرةً أخرى:"], [839.0, "كلُّ من اخترع مقالةً لا دليلَ عليها،"], [843.6, "وفتن الناس بها، وفرّق بها الجماعة، فهو مبتدع. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[817.0, "Külliyelerden biri de şudur: Bir söz uyduran herkes —ondan önceki külliye (bir) şahıs (hakkındaydı), bu ise (bir) söz (hakkında)— 4."], [823.5, "külliye: Hiçbir delili olmayan bir söz (mekâle) uyduran, insanları onunla fitneye düşüren ve onunla cemaati bölen herkes bid'atçidir. —Aleyküm selam Ebû Muhammed.— Bir kez daha tekrarlıyorum:"], [839.0, "Hiçbir delili olmayan bir söz uyduran, insanları onunla fitneye düşüren ve onunla cemaati bölen herkes bid'atçidir."]]}, {"reader": false, "ar": [[852.0, "أقول وبالله التوفيق: الكلّيّة التي قبل هذه في الأشخاص والموالاة والمعاداة عليهم،"], [872.0, "وهذه الكلّيّة تتكلّم عن المقالات والعقائد."], [879.0, "فبعض الناس يرى مقالةً ويظنّها صحيحةً وصوابًا،"], [882.8, "ثم يوالي ويعادي عليها؛"], [885.0, "فمن وافقه في مقالته فهو القريبُ الذي يستحقّ الموالاةَ والمحبّةَ والولاءَ والنصرة،"], [892.0, "ومن خالف مقالته فهو البغيضُ الذي يستحقّ المعاداةَ والبغضاءَ والمصارمة."], [897.6, "فهذا زيغٌ، فهذا من أهل البدع."]], "tr": [[852.0, "Tevfik Allah'tandır, derim ki: Bundan önceki külliye şahıslar ve onlara göre dostluk ve düşmanlık hakkındaydı;"], [871.3, "bu külliye ise sözler ve akîdeler hakkında konuşur."], [879.0, "Bazı insanlar bir söz benimser, onu sahih ve doğru zanneder, sonra ona göre dostluk ve düşmanlık eder."], [885.0, "Kim kendi sözünde ona uyarsa, o dostluğu, sevgiyi, velâyı ve yardımı hak eden yakın kişidir;"], [890.8, "kim de onun sözüne muhalefet ederse, o düşmanlığı, buğzu ve kesin ayrılığı hak eden sevimsiz kişidir."], [897.6, "İşte bu bir sapmadır; bu (kişi) bid'at ehlindendir."]]}, {"reader": false, "ar": [[901.6, "كمعاداة الرافضة وولائهم على قولهم:"], [905.3, "«لا ولاءَ إلا ببراء»،"], [908.0, "أي: لا ولاءَ لأهل البيت إلا بالبراءة من أبي بكرٍ وعمر؛"], [913.0, "فمن دخل تحت مقالتهم مدحوه وأثنَوا عليه،"], [917.0, "ومن خالف مقالتهم ذمّوه وحكموا عليه بالكفر أو البدعة."], [922.0, "وكقول المرجئة: «لا يضرّ مع الإيمان ذنب»؛"], [927.0, "فمن دان لهم بهذه المقالة قرّبوه،"], [930.3, "واعتمدوه، وأحبّوه، ووالَوه، ومن خالف مقالتهم أبغضوه، وأبعدوه، وصارموه."]], "tr": [[901.6, "Râfıza'nın \"Berâ olmadan velâ olmaz\" sözlerine göre düşmanlık ve dostluk etmeleri gibi;"], [905.3, "yani Ebû Bekir ve Ömer'den berî olmadan Ehl-i Beyt'e velâ olmaz."], [909.4, "Kim onların sözünün altına girerse onu över ve ona sena ederler;"], [913.0, "kim de onların sözüne muhalefet ederse onu yerer ve hakkında küfür ya da bid'at hükmü verirler."], [918.7, "Mürcie'nin \"İmanla birlikte hiçbir günah zarar vermez\" sözü gibi:"], [922.0, "Kim bu sözü onlarla birlikte din edinirse onu yakınlaştırır, ona itimat eder, onu sever ve onu dost edinirler;"], [929.8, "kim de onların sözüne muhalefet ederse ona buğzeder, onu uzaklaştırır ve ondan kesin olarak ayrılırlar."]]}, {"reader": false, "ar": [[936.0, "وكما نشأ عندنا في هذا الزمان طوائفُ تقول:"], [940.0, "«من لم يبدّع فلانًا فهو مبتدع»،"], [943.0, "فيبتلون الأمّة بهذه المقالة في تبديع فلانٍ أو تكفير فلان؛"], [950.0, "فيقول قائلهم: من لم يبدّع العالمَ الفلانيَّ فليس منّا،"], [956.0, "ومن لم يكفّر الحاكمَ الفلانيَّ فليس منّا،"], [960.0, "ومن لم يدخل تحت مقالة كذا وكذا فليس منّا،"], [971.0, "أو هو مغموزٌ على سنّيّته واتّباعه."], [975.0, "وكلُّ ذلك من مسالك أهل البدع،"], [980.0, "ومن الأبواب التي تفتح الفرقةَ والخصومةَ والنزاعَ بين المسلمين."]], "tr": [[936.0, "Bu zamanda bizde \"Falancayı bid'atçi saymayan bid'atçidir\" diyen taifelerin ortaya çıkması da böyledir."], [940.0, "Falancayı bid'atçi saymak ya da falancayı tekfir etmek hususundaki bu sözle ümmeti imtihan ederler."], [945.1, "İçlerinden biri şöyle der: \"Falanca âlimi bid'atçi saymayan bizden değildir;"], [950.0, "falanca yöneticiyi tekfir etmeyen bizden değildir;"], [954.7, "şu şu sözün altına girmeyen bizden değildir\" ya da \"o, sünnîliği ve ittibâı konusunda şüphelidir.\" Bunların hepsi bid'at ehlinin yollarındandır ve Müslümanlar arasında ayrılığa, husumete ve çekişmeye kapı açan kapılardandır."]]}, {"reader": false, "ar": [[986.0, "وتخالف قولَ الله عز وجل:"], [988.7, "<span class=\"ayah\">﴿وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا﴾<\/span> <span class=\"ref\">[آل عمران: ١٠٣]<\/span>،"], [992.0, "وتخالف قولَ الله عز وجل:"], [995.4, "<span class=\"ayah\">﴿فَتَقَطَّعُوا أَمْرَهُم بَيْنَهُمْ زُبُرًا ۖ كُلُّ حِزْبٍ بِمَا لَدَيْهِمْ فَرِحُونَ﴾<\/span> <span class=\"ref\">[المؤمنون: ٥٣]<\/span>،"], [1002.0, "وتخالف قولَ الله عز وجل:"], [1004.2, "<span class=\"ayah\">﴿وَلَا تَكُونُوا مِنَ الْمُشْرِكِينَ ۝ مِنَ الَّذِينَ فَرَّقُوا دِينَهُمْ وَكَانُوا شِيَعًا ۖ كُلُّ حِزْبٍ بِمَا لَدَيْهِمْ فَرِحُونَ﴾<\/span> <span class=\"ref\">[الروم: ٣١–٣٢]<\/span>."], [1014.0, "فمن أعظم ما يوجب الخصومةَ والنزاعَ بين أفراد الأمّة الواحدة:"], [1020.0, "أن ننصّب شخصًا نوالي ونعادي عليه،"], [1023.0, "أو ننصّب مقالةً نوالي ونعادي عليها."], [1026.0, "فاحذروا ذلك، وفّقكم الله."]], "tr": [[986.0, "(Bu yollar) Allah Azze ve Celle'nin şu sözüne aykırıdır:"], [988.7, "<span class=\"ayah\">﴿Hep birlikte Allah'ın ipine sımsıkı sarılın ve ayrılmayın﴾<\/span> [Âl-i İmrân 103]."], [995.4, "Allah Azze ve Celle'nin şu sözüne aykırıdır:"], [998.0, "<span class=\"ayah\">﴿Fakat onlar işlerini aralarında parça parça (kitaplara) böldüler; her grup kendi yanındakiyle sevinmektedir﴾<\/span> [Mü'minûn 53]."], [1004.2, "Allah Azze ve Celle'nin şu sözüne aykırıdır:"], [1006.0, "<span class=\"ayah\">﴿Müşriklerden olmayın; dinlerini parça parça edip gruplara ayrılanlardan (olmayın). Her grup kendi yanındakiyle sevinmektedir﴾<\/span> [Rûm 31–32]."], [1014.0, "Tek bir ümmetin fertleri arasında husumete ve çekişmeye yol açan en büyük şeylerden biri, etrafında dostluk ve düşmanlık ettiğimiz bir şahıs dikmemiz ya da etrafında dostluk ve düşmanlık ettiğimiz bir söz dikmemizdir."], [1026.0, "Bundan sakının; Allah sizi muvaffak kılsın."]]}]}, {"ts": "17:07", "title": "5. Külliye: Bid'at yoluna giren, kılıcı helal sayma yoluna girmiş olur", "paras": [{"reader": false, "ar": [[1027.0, "ومن الكلّيّات أيضًا: <b>كلُّ من سلك طريقَ الابتداع فقد سلك طريقَ استحلال السيف.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [1062.0, "وذلك لأنّ أهل البدع يرون السيفَ على مخالفيهم."], [1066.0, "ومتى ما أطلق أهلُ السنة قولتَهم «السيف» فإنما يقصدون بها:"], [1073.4, "استحلالَ الدماء. فالخوارج يرون السيفَ على مخالفيهم،"], [1079.0, "والمعتزلة يرون السيفَ على مخالفيهم،"], [1082.0, "والرافضة يرون السيفَ على مخالفيهم،"], [1085.0, "والجهميّة يرون السيفَ على مخالفيهم،"], [1089.0, "والمرجئة يرون السيفَ على مخالفيهم."]], "tr": [[1027.0, "Külliyelerden biri de şudur: 5."], [1033.0, "külliye: Bid'at yoluna giren herkes, kılıcı helal sayma yoluna girmiş olur. Tevfik Allah'tandır, derim ki:"], [1038.6, "Bu şundandır: Bid'at ehli, kendilerine muhalefet edenlere karşı kılıcı (caiz) görürler."], [1062.0, "Ehl-i Sünnet \"kılıç\" sözünü mutlak olarak kullandığında, bununla ancak kanları helal saymayı kastederler."], [1066.0, "Hâricîler kendilerine muhalefet edenlere karşı kılıcı (caiz) görürler;"], [1069.6, "Mu'tezile kendilerine muhalefet edenlere karşı kılıcı görürler;"], [1073.4, "Râfıza kendilerine muhalefet edenlere karşı kılıcı görürler;"], [1079.6, "Cehmiyye kendilerine muhalefet edenlere karşı kılıcı görürler;"], [1085.0, "Mürcie de kendilerine muhalefet edenlere karşı kılıcı görürler."]]}, {"reader": false, "ar": [[1092.0, "ولله درُّ الإمام أبي قِلابة رحمه الله تعالى لمّا قرّر هذه القاعدة بقوله:"], [1100.0, "«ما ابتدع قومٌ بدعةً إلا استحلّوا فيها السيف»."], [1109.0, "وهذا الأثر أخرجه الإمام الدارميّ،"], [1112.5, "والإمام الآجُرّيّ في «الشريعة» بإسنادٍ صحيح،"], [1117.0, "وكذا رواه الإمام اللالكائيّ،"], [1119.2, "وذكره الإمام الشاطبيّ في «الاعتصام»."], [1122.0, "وقال أبو قلابة أيضًا في هذا الموضوع،"], [1126.8, "في كلامٍ له طويل،"], [1130.0, "وقال في آخره: «وإنّ هؤلاء ـ أي أهل البدع ـ اختلف قولُهم ـ أي في البدعة ـ واجتمعوا في السيف، ولا أرى مصيرَهم إلا إلى النار»."]], "tr": [[1092.0, "İmam Ebû Kılâbe'ye —Allah Teâlâ ona rahmet etsin— aferin olsun!"], [1098.0, "Bu kaideyi şu sözüyle takrir etmiştir:"], [1100.0, "\"Hiçbir topluluk bir bid'at çıkarmamıştır ki onda kılıcı helal saymış olmasın.\" Bu eseri İmam Dârimî ve İmam Âcurrî eş-Şerîa'da sahih bir isnadla rivayet etmiştir;"], [1117.0, "İmam Lâlekâî de böyle rivayet etmiş, İmam Şâtıbî de el-İ'tisâm'da zikretmiştir."], [1122.0, "Ebû Kılâbe bu konuda uzun bir sözünde ayrıca şöyle demiş ve sonunda şunu söylemiştir:"], [1131.6, "\"Bunların —yani bid'at ehlinin— sözü ayrıldı —yani bid'atte—, ama kılıçta birleştiler."], [1137.6, "Onların varacağı yerin ancak ateş olduğunu görüyorum.\""]]}, {"reader": false, "ar": [[1142.0, "فالجهمُ بن صفوان خرج لقتال بني أميّة مع الثوّار،"], [1147.4, "حتى قتله سَلْمُ بن أحوز؛"], [1150.4, "لأنه يرى السيفَ على أهل السنة."], [1154.0, "وكذلك الخوارج قاتلوا أصحابَ النبيّ صلى الله عليه وسلم،"], [1159.0, "وحصل منهم شيءٌ عظيمٌ على الإسلام وأهله؛"], [1162.0, "لأنهم يرون السيفَ على أهل السنة."], [1166.0, "وكذلك الصوفيّة يرون السيفَ على مخالفيهم."], [1170.0, "وكذلك المعتزلة لمّا أفتَوا بقتل أهل السنة الذين لا يوافقونهم في القول بخلق القرآن."], [1180.0, "وكذلك الأشاعرة لمّا أفتى قضاتُهم في عهد ابن تيمية بقتل أبي العباس رحمه الله تعالى."]], "tr": [[1142.0, "Cehm b. Safvân, isyancılarla birlikte Ümeyyeoğulları ile savaşmak için çıktı;"], [1146.8, "sonunda onu Selm b. Ahvez öldürdü."], [1150.4, "Çünkü o, Ehl-i Sünnet'e karşı kılıcı (caiz) görüyordu."], [1154.0, "Hâricîler de Nebî ﷺ'in ashâbıyla savaştılar ve onlardan İslam'a ve ehline büyük (zarar veren) şeyler meydana geldi;"], [1162.0, "çünkü onlar Ehl-i Sünnet'e karşı kılıcı (caiz) görürler."], [1166.0, "Sûfîler de kendilerine muhalefet edenlere karşı kılıcı (caiz) görürler."], [1170.0, "Mu'tezile de Kur'an'ın mahluk olduğu görüşünde kendilerine muvafakat etmeyen Ehl-i Sünnet'in öldürülmesine fetva verdiklerinde (böyle yaptılar)."], [1180.0, "Eş'arîler de İbn Teymiyye döneminde kadıları Ebu'l-Abbâs'ın —Allah Teâlâ ona rahmet etsin— öldürülmesine fetva verdiğinde (böyle yaptılar)."]]}, {"reader": false, "ar": [[1189.0, "ولا يزال أهلُ البدع يرون السيفَ على أهل السنة ما كانت الكلمةُ والدولةُ لهم؛"], [1197.0, "ولذلك متى ما قدروا على أهل السنة فلن يرحموا منهم كبيرًا،"], [1203.0, "ولن يرحموا منهم صغيرًا،"], [1206.0, "ولن يُبقوا لهم على عِرضٍ ولا مال."], [1209.0, "فالحمد لله أن نشأنا في بلادٍ المقدَّمُ فيها وصاحبُ السلطة من أهل السنة."], [1218.0, "وأنتم ترون ما يفعله الرافضة في كثيرٍ من البلاد التي صارت الدولةُ لهم فيها،"], [1222.9, "والقوّةُ والسلطةُ لهم فيها؛"], [1224.5, "فإنهم لا يُبقون على أحدٍ من أهل السنة أبدًا."], [1229.0, "فقاعدةُ أهل البدع: استحلالُ دماء مخالفيهم من أهل السنة والجماعة."]], "tr": [[1189.0, "Söz ve devlet kendilerinde olduğu sürece bid'at ehli, Ehl-i Sünnet'e karşı kılıcı (caiz) görmeye devam eder."], [1197.0, "Bu yüzden Ehl-i Sünnet'e güç yetirdiklerinde onların ne büyüğüne merhamet ederler ne de küçüğüne;"], [1205.2, "onlara ne ırz bırakırlar ne de mal."], [1209.0, "Önde gelenin ve otorite sahibinin Ehl-i Sünnet'ten olduğu bir ülkede yetiştiğimiz için Allah'a hamd olsun."], [1219.4, "Râfıza'nın, devletin, gücün ve otoritenin kendilerine geçtiği birçok ülkede yaptıklarını görüyorsunuz;"], [1224.5, "Ehl-i Sünnet'ten hiç kimseyi asla sağ bırakmazlar."], [1229.0, "Bid'at ehlinin kaidesi, kendilerine muhalefet eden Ehl-i Sünnet ve'l-Cemaat'in kanlarını helal saymaktır."]]}]}, {"ts": "20:36", "title": "6. Külliye: İslam ve iman isminden başka bir isme nispet edilen bid'at ehlindendir", "paras": [{"reader": false, "ar": [[1236.0, "ومن الكلّيّات أيضًا: كلُّ من انتسب لغير اسم الإسلام والإيمان،"], [1253.0, "أو ما دلّ عليه دليلٌ أو إجماع،"], [1257.0, "فمن أهل البدع. <span class=\"note\">(يكررها)<\/span> أُعيدها مرةً أخرى:"], [1268.0, "كلُّ من انتسب لغير اسم الإسلام والإيمان،"], [1272.6, "أو ما دلّ عليه دليلٌ أو إجماع، فمن أهل البدع."]], "tr": [[1236.0, "Külliyelerden biri de şudur: 6."], [1240.0, "külliye: İslam ve iman isminden ya da hakkında bir delil veya icmâ bulunan (isimden) başkasına nispet edilen herkes bid'at ehlindendir. Bir kez daha tekrarlıyorum:"], [1268.0, "İslam ve iman isminden ya da hakkında bir delil veya icmâ bulunan (isimden) başkasına nispet edilen herkes bid'at ehlindendir."]]}, {"reader": false, "ar": [[1281.0, "أقول وبالله التوفيق: وهذه الكلّيّة تتكلّم عن شأن الانتساب والانطواء تحت مسمًّى معيّن،"], [1290.0, "فلها شأنُها عند أهل السنة والجماعة."], [1294.0, "فمن علامات أهل البدع:"], [1296.8, "أنهم لا ينتسبون إلا لمؤسّس فرقتهم؛"], [1304.0, "كالجهميّة نسبةً إلى الجهم بن صفوان،"], [1308.0, "والكُلّابيّة نسبةً إلى (ابن) كُلّاب،"], [1313.0, "والكرّاميّة نسبةً إلى (محمد) بن كرّام <span class=\"q\">؟ 21:53<\/span>،"], [1318.0, "والأشعريّة نسبةً إلى أبي الحسن الأشعريّ،"], [1322.0, "والماتريديّة نسبةً إلى أبي منصور الماتريديّ،"], [1325.0, "وهكذا دواليك في كثيرٍ من الفرق تنتسب إلى مؤسّس فرقتها."], [1332.0, "وهذا الانتساب عند أهل السنة من البدع."]], "tr": [[1281.0, "Tevfik Allah'tandır, derim ki: Bu külliye nispet etme ve belirli bir isim altına girme meselesinden bahseder;"], [1294.0, "bunun Ehl-i Sünnet ve'l-Cemaat nezdinde (özel) bir önemi vardır."], [1304.0, "Bid'at ehlinin alametlerinden biri, ancak fırkalarının kurucusuna nispet edilmeleridir:"], [1311.9, "Cehm b. Safvân'a nispetle Cehmiyye, (İbn) Küllâb'a nispetle Küllâbiyye, (Muhammed) b."], [1321.3, "Kerrâm'a <span class=\"q\">؟<\/span> nispetle Kerrâmiyye, Ebu'l-Hasen el-Eş'arî'ye nispetle Eş'ariyye, Ebû Mansûr el-Mâtürîdî'ye nispetle Mâtürîdiyye gibi."], [1332.0, "Fırkalardan birçoğu böyle devam eder;"], [1333.4, "fırkasının kurucusuna nispet edilir. Bu nispet, Ehl-i Sünnet nezdinde bid'atlerdendir."]]}, {"reader": false, "ar": [[1337.0, "ومن أهل البدع من ينتسبون إلى بدعتهم التي اشتهروا بها:"], [1344.0, "كالخوارج نسبةً إلى بدعة الخروج على الصحابة وعلى أهل الإسلام،"], [1349.0, "وكالجبريّة نسبةً إلى زعمهم بأنّ العبد مجبورٌ في باب القدر،"], [1358.0, "ولا مشيئةَ ولا اختيارَ له،"], [1360.0, "وكالقدريّة نسبةً إلى زعمهم بأن لا قدر،"], [1367.0, "وأنّ الأمر أُنُف، وأنّ العبد يخلق فعله،"], [1372.0, "وكالمرجئة الذين يؤخّرون الإيمانَ عن ـ يؤخّرون العملَ عن دائرة الإيمان،"], [1383.0, "وكالوعيديّة الذين يكفّرون أصحابَ الكبائر."], [1389.0, "وهذا الانتساب عند أهل السنة والجماعة مسلكٌ من مسالك أهل البدع."]], "tr": [[1337.0, "Bid'at ehlinden bir kısmı da meşhur oldukları bid'atlerine nispet edilir:"], [1344.0, "Sahâbeye ve İslam ehline karşı huruç bid'atine nispetle Hâricîler;"], [1350.4, "kader babında kulun mecbur olduğunu, hiçbir dileğinin ve tercihinin olmadığını iddia etmelerine nispetle Cebriyye;"], [1366.7, "kaderin olmadığını, işin yeni başladığını (önceden takdir edilmediğini) ve kulun kendi fiilini yarattığını iddia etmelerine nispetle Kaderiyye;"], [1389.0, "imanı —ameli iman dairesinden— geri bırakan Mürcie;"], [1391.8, "büyük günah sahiplerini tekfir eden Va'îdiyye gibi."], [1394.0, "Bu nispet, Ehl-i Sünnet ve'l-Cemaat nezdinde bid'at ehlinin yollarından bir yoldur."]]}, {"reader": false, "ar": [[1397.0, "وأمّا أهل السنة والجماعة فإنّ لهم خصيصةً لا يشاركهم فيها غيرُهم من أهل البدع أبدًا:"], [1405.0, "فأهل السنة لا ينتسبون إلا إلى اسم الإسلام،"], [1409.0, "كما قال الله عز وجل:"], [1411.5, "<span class=\"ayah\">﴿هُوَ سَمَّاكُمُ الْمُسْلِمِينَ﴾<\/span> <span class=\"ref\">[الحج: ٧٨]<\/span>، أو الإيمان؛"], [1415.0, "فإنّ الله عز وجل ناداهم في آياتٍ كثيرة بـ«يا أيها الذين آمنوا»،"], [1422.8, "فيدخل فيها دخولًا أوّليًّا أهلُ السنة والجماعة."], [1426.0, "أو ينتسبون لاسمٍ دلّ عليه الدليل:"], [1430.1, "كالطائفة المنصورة، والفرقة الناجية، والجماعة."]], "tr": [[1397.0, "Ehl-i Sünnet ve'l-Cemaat'e gelince, onların bid'at ehlinden hiç kimsenin kendilerine asla ortak olmadığı bir özellikleri vardır:"], [1402.7, "Ehl-i Sünnet ancak İslam ismine nispet edilir;"], [1405.0, "Allah Azze ve Celle'nin buyurduğu gibi:"], [1408.0, "<span class=\"ayah\">﴿O size Müslümanlar adını verdi﴾<\/span> [Hac 78]."], [1411.5, "Ya da iman (ismine nispet edilir);"], [1415.0, "çünkü Allah Azze ve Celle birçok ayette onlara \"Ey iman edenler!\" diye seslenmiştir;"], [1420.3, "Ehl-i Sünnet ve'l-Cemaat buna öncelikli olarak girer."], [1423.4, "Ya da delilin gösterdiği bir isme nispet edilirler:"], [1426.0, "Tâife-i Mansûre (yardım edilen grup), Fırka-i Nâciye (kurtuluşa eren fırka) ve Cemaat gibi."]]}, {"reader": false, "ar": [[1436.0, "كما في حديث الافتراق ـ في بعض رواياته ـ عند الإمام أحمد في «مسنده»،"], [1444.0, "وأبي داود في «سننه»،"], [1447.0, "من حديث معاوية رضي الله عنه قال:"], [1450.2, "قال النبيّ صلى الله عليه وسلم:"], [1453.0, "«وستفترق هذه الأمّة على ثلاثٍ وسبعين فرقة، كلّها في النار إلا واحدة، وهي الجماعة»."], [1459.0, "وهي الجماعة. وقال صلى الله عليه وسلم:"], [1465.0, "«لا تزال طائفةٌ من أمّتي على الحقّ منصورة» الحديثَ بتمامه."]], "tr": [[1436.0, "İftirak hadisinin bazı rivayetlerinde olduğu gibi;"], [1440.0, "(bu rivayet) İmam Ahmed'in Müsned'inde ve Ebû Dâvûd'un Sünen'inde Muâviye'den —Allah ondan razı olsun— gelen hadistedir."], [1450.2, "Şöyle dedi: Nebî ﷺ şöyle buyurdu:"], [1453.0, "\"Bu ümmet yetmiş üç fırkaya ayrılacak;"], [1454.7, "biri hariç hepsi ateştedir; o (kurtulan) da Cemaat'tir.\" O da Cemaat'tir."], [1459.0, "Yine Nebî ﷺ şöyle buyurdu:"], [1463.2, "\"Ümmetimden bir grup hak üzere, yardım görmüş olarak var olmaya devam edecektir\" —hadisin tamamı."]]}, {"reader": false, "ar": [[1472.0, "وينتسب أهلُ السنة أيضًا لما وقع عليه الإجماع،"], [1477.0, "وكان صفةً راسخةً فيهم:"], [1479.0, "كأهل السنة لعملهم بحديث الآحاد في العقائد،"], [1483.0, "والجماعة لأنهم ينهون عن الفرقة،"], [1488.0, "بخلاف أهل البدع عن بَكرة أبيهم؛"], [1492.0, "فإنهم يبدؤون فرقةً، ثم يتوزّعون فرقًا وأحزابًا:"], [1496.2, "متقاتلةً، متقاطعةً، متصارمةً، متباغضةً،"], [1499.1, "متعادية. أو ينتسبون إلى اسم السلف؛"], [1507.0, "لأنّ من أصول مذهبهم أنهم لا يفهمون أدلة الاعتقاد ـ كتابًا وسنّةً ـ إلا على فهم السلف الصالح."]], "tr": [[1472.0, "Ehl-i Sünnet, üzerinde icmâ bulunan ve kendilerinde yerleşik bir sıfat olan şeye de nispet edilir:"], [1479.0, "Akîdelerde âhâd hadisle amel ettikleri için \"Ehl-i Sünnet\", ayrılıktan sakındırdıkları için de \"Cemaat\" (denmesi) gibi."], [1488.0, "Bid'at ehli ise istisnasız hepsi bunun aksinedir:"], [1492.0, "Bir fırka olarak başlarlar, sonra birbirleriyle savaşan, birbirinden kopan, birbirinden ayrılan, birbirine buğzeden ve birbirine düşman olan fırkalara ve hiziplere dağılırlar."], [1507.0, "Ya da (Ehl-i Sünnet) selef ismine nispet edilir;"], [1510.5, "çünkü onların mezheplerinin asıllarından biri, Kitap ve Sünnet olarak itikad delillerini ancak selef-i sâlihînin anlayışına göre anlamalarıdır."]]}, {"reader": false, "ar": [[1518.0, "وبناءً على ذلك: فكلُّ من انتسب إلى مؤسّس فرقته فهو من أهل البدع في التسمية،"], [1524.0, "وكلُّ من انتسب إلى بدعته التي اشتهرت فرقتُه بها فإنه أيضًا من أهل البدع."], [1532.0, "فانتبهوا لذلك رحمكم الله؛"], [1534.0, "فإيّاكم أن تدخلوا تحت أيّ مسمًّى وأيّ لواءٍ ـ وإن كان جميلًا برّاقًا ـ حتى تنظروا إلى أصوله ومضمونه؛"], [1545.0, "فإنّ المتقرّر في القواعد أنّ العبرة ليست بمجرّد الأسماء والشعارات،"], [1550.0, "وإنما بالحقيقة والمضمون. والله أعلم."]], "tr": [[1518.0, "Buna göre fırkasının kurucusuna nispet edilen herkes, isimlendirmede bid'at ehlindendir;"], [1523.6, "fırkasının meşhur olduğu bid'atine nispet edilen herkes de bid'at ehlindendir."], [1532.0, "Allah size rahmet etsin, buna dikkat edin!"], [1534.0, "Sakın herhangi bir isim ve herhangi bir sancak altına —güzel ve parlak olsa bile— onun asıllarına ve muhtevasına bakmadan girmeyin."], [1545.0, "Çünkü kaidelerde yerleşik olan şudur:"], [1546.5, "İtibar, sırf isimlere ve sloganlara değil, ancak hakikate ve muhtevayadır. Allah en iyisini bilir."]]}]}, {"ts": "25:55", "title": "7. Külliye: Ancak bir bid'atçide bulunan ilim, şartlarıyla ondan alınır", "paras": [{"reader": false, "ar": [[1555.0, "ومن الكلّيّات أيضًا: كلُّ علمٍ لا يوجد إلا عند مبتدع،"], [1563.0, "كلُّ علمٍ لا يوجد إلا عند مبتدعٍ فيُؤخذ عنه إن لم يتعلّق ببدعته،"], [1580.3, "وكان الآخذُ عالمًا (بالحقّ). أُعيدها مرةً أخرى:"], [1588.0, "كلُّ علمٍ لا يوجد إلا عند مبتدعٍ فيُؤخذ عنه إن لم يتعلّق ببدعته،"], [1596.6, "وكان الآخذُ عالمًا بالحقّ."], [1604.0, "أُعيدها مرةً ثالثة: كلُّ علمٍ لا يوجد إلا عند مبتدعٍ فيُؤخذ عنه إن لم يتعلّق ببدعته،"], [1615.6, "وكان الآخذُ عالمًا بالحقّ."]], "tr": [[1555.0, "Külliyelerden biri de şudur: Ancak bir bid'atçinin yanında bulunan her ilim;"], [1561.6, "<b>7. külliye: Ancak bir bid'atçinin yanında bulunan her ilim, onun bid'atiyle ilgili değilse ve (onu) alan kişi (hakkı) bilen biriyse, ondan alınır.<\/b> Bir kez daha tekrarlıyorum:"], [1588.0, "Ancak bir bid'atçinin yanında bulunan her ilim, onun bid'atiyle ilgili değilse ve alan kişi hakkı bilen biriyse, ondan alınır."], [1604.0, "Üçüncü kez tekrarlıyorum: Ancak bir bid'atçinin yanında bulunan her ilim, onun bid'atiyle ilgili değilse ve alan kişi hakkı bilen biriyse, ondan alınır."]]}, {"reader": false, "ar": [[1620.0, "أقول وبالله التوفيق: وهذه الكلّيّة تتكلّم عن مسألةٍ طال الخلاف فيها بين أهل السنة والجماعة رحمهم الله تعالى،"], [1630.0, "وهي: ما حكمُ أخذ العلم ـ أو شيءٍ من العلم ـ من أهل البدع،"], [1634.0, "سواءٌ أُخذ مباشرةً، أو أُخذ قراءةً من كتبهم؟"], [1642.0, "فأقول: القول الصحيح في ذلك هو القول الوسط،"], [1647.0, "والذي يضمن لنا عدمَ التأثّر بشيءٍ من بدعتهم."], [1653.0, "وهذا القول الوسط مشروطٌ بشروطٍ قد ذُكرت في الكلّيّة، وهي كما يلي:"]], "tr": [[1620.0, "Tevfik Allah'tandır, derim ki: Bu külliye, Ehl-i Sünnet ve'l-Cemaat —Allah Teâlâ onlara rahmet etsin— arasında ihtilafın uzadığı bir meseleden bahseder."], [1630.3, "O da şudur: İster doğrudan alınsın ister kitaplarından okunarak alınsın, bid'at ehlinden ilim —ya da ilimden bir şey— almanın hükmü nedir?"], [1642.0, "Derim ki: Bu konuda sahih görüş, orta yol olan ve bizim için onların bid'atinden hiçbir şeyden etkilenmemeyi güvence altına alan görüştür."], [1655.0, "Bu orta görüş, külliyede zikredilen şartlara bağlıdır; bunlar şöyledir:"]]}, {"reader": false, "ar": [[1662.0, "الأول: ألّا يوجد هذا النوع من العلم إلا عند هذا المبتدع."], [1670.0, "وبناءً على ذلك: فإذا كان العلم متوفّرًا عند غيره من أهل السنة،"], [1679.0, "فيحرُم أن تطلبه عند هذا المبتدع؛"], [1682.0, "لأنّ هناك طريقًا أسلمَ وأحفظَ للقلب من التأثّر بالمبتدع وبدعته."], [1691.0, "وهو ما عنونتُه بقولي:"], [1695.8, "«كلُّ علمٍ لا يوجد إلا عند مبتدع»."], [1701.0, "وبناءً على ذلك: فمتى ما وُجد العلم عند غيره من أهل السنة فإنّ الأصل المنعُ والتحريم."]], "tr": [[1662.0, "Birincisi: Bu tür ilmin ancak bu bid'atçinin yanında bulunmasıdır."], [1670.0, "Buna göre ilim Ehl-i Sünnet'ten başkasının yanında mevcutsa, onu bu bid'atçinin yanında talep etmen haramdır;"], [1682.0, "çünkü kalbi bid'atçiden ve bid'atinden etkilenmekten daha selametli ve daha iyi koruyan bir yol vardır."], [1695.8, "Bu, \"Ancak bir bid'atçinin yanında bulunan her ilim\" sözümle başlık koyduğum şeydir."], [1702.5, "Buna göre ilim Ehl-i Sünnet'ten başkasının yanında bulunduğunda asıl olan yasaklık ve haramlıktır."]]}, {"reader": false, "ar": [[1709.0, "الشرط الثاني: قولُنا في الكلّيّة «إن لم يتعلّق ببدعته»؛"], [1716.0, "يعني: بمعنى أنه لا يجوز أن تطلب العلمَ عند مبتدعٍ وهذا العلم يتعلّق بأصل بدعته."], [1726.0, "فإيّاك أن تطلب مسائلَ الصفات عند من يحرّفها،"], [1731.0, "أو تطلبَ علمَ قضايا الإيمان عند من يُخرج العملَ عن دائرتها،"], [1739.0, "أو تطلبَ مسائلَ القضاء والقدر عند جبريٍّ أو قدريّ."], [1746.0, "فمتى ما كان العلمُ المطلوب من هذا المبتدع يتعلّق ببدعته،"], [1752.0, "فإننا نبقى على الأصل، وهو المنعُ والتحريم."]], "tr": [[1709.0, "İkinci şart: Külliyedeki \"onun bid'atiyle ilgili değilse\" sözümüzdür."], [1716.0, "Yani bu ilim onun bid'atinin aslıyla ilgiliyken bir bid'atçinin yanında ilim talep etmen caiz değildir."], [1726.0, "Sakın sıfat meselelerini onları tahrif eden birinin yanında, iman meselelerinin ilmini ameli onların dairesinden çıkaran birinin yanında ya da kaza ve kader meselelerini bir Cebrî'nin veya Kaderî'nin yanında talep etme!"], [1746.0, "Bu bid'atçiden talep edilen ilim onun bid'atiyle ilgili olduğunda asıl üzere kalırız;"], [1753.1, "o da yasaklık ve haramlıktır."]]}, {"reader": false, "ar": [[1756.0, "الشرط الثالث: ما ذكرتُه بقولي:"], [1759.6, "«وكان الآخذُ عالمًا بالحقّ»؛"], [1766.0, "يعني: بمعنى أنه لا يجوز لأفراد الطلبة أن يخاطروا بتوحيدهم وإيمانهم وعقيدتهم في طلب العلم عند أهل البدع ما لم يتضلّعوا من علوم أهل السنة والجماعة؛"], [1781.0, "سدًّا لذريعة أن يدسّ هذا العالمُ المبتدعُ شيئًا من بدعته في ثنايا كلامه وأنت لا تشعر به،"], [1794.0, "فتتأثّر بأطروحته البدعيّة وأنت لا تدري عن حالك،"], [1799.5, "وكيف دسّ عليك بدعته."]], "tr": [[1756.0, "Üçüncü şart: \"Ve alan kişi hakkı bilen biriyse\" sözümle zikrettiğim şeydir."], [1766.0, "Yani tek tek talebelerin, Ehl-i Sünnet ve'l-Cemaat'in ilimlerine iyice doymadıkça, bid'at ehlinin yanında ilim talep ederek tevhidlerini, imanlarını ve akîdelerini tehlikeye atmaları caiz değildir."], [1781.0, "(Bu,) bu bid'atçi âlimin, sen farkına varmadan sözünün arasına bid'atinden bir şey sıkıştırması, senin de kendi hâlinden ve bid'atini sana nasıl sıkıştırdığından habersizken onun bid'atçi görüşünden etkilenmen ihtimalinin önünü kapatmak içindir."]]}, {"reader": false, "ar": [[1805.0, "فمتى ما اجتمعت هذه الشروط الثلاثة فإنه حينئذٍ يجوز للسنّيّ أن يطلب هذا النوع من العلم عند هذا المبتدع:"], [1818.0, "كإجازةٍ في القرآن يطلبها السنّيّ ولا توجد إلا عند هذا المبتدع،"], [1825.0, "أو علمِ بلاغةٍ أو أنسابٍ لا يوجد إلا عند هذا المبتدع،"], [1833.0, "أو علمٍ في مسألةٍ دنيويّةٍ كصنعةٍ أو حرفةٍ لا توجد إلا عند هذا المبتدع."], [1844.0, "فمتى ما توفّر هذا الشرط ـ فمتى ما توفّرت هذه الشروط فإننا نقول بالجواز."]], "tr": [[1805.0, "Bu üç şart bir araya geldiğinde, sünnî kimsenin bu tür ilmi bu bid'atçinin yanında talep etmesi o zaman caiz olur:"], [1818.0, "Sünnî kimsenin talep ettiği ve ancak bu bid'atçinin yanında bulunan Kur'an'da bir icazet;"], [1825.0, "ya da ancak bu bid'atçinin yanında bulunan belâgat veya nesep ilmi;"], [1831.9, "ya da ancak bu bid'atçinin yanında bulunan bir sanat veya zanaat gibi dünyevî bir meseledeki ilim gibi."], [1844.0, "Bu şart —bu şartlar— bir araya geldiğinde caiz olduğunu söyleriz."]]}, {"reader": false, "ar": [[1851.0, "واشتراطُنا لهذه الشروط يدلّك على أنّ طلب العلم عند أهل البدع يجوز اضطرارًا لا اختيارًا."], [1865.3, "وأُعيدها مرةً أخرى: واشتراطُنا لهذه الشروط يدلّك على أنّ طلب العلم عند أهل البدع إنما يجوز اضطرارًا لا اختيارًا. والله أعلم."]], "tr": [[1851.0, "Bu şartları koşmamız, bid'at ehlinin yanında ilim talep etmenin serbest tercihle değil, zaruretle caiz olduğunu sana gösterir."], [1865.3, "Bir kez daha tekrarlıyorum: Bu şartları koşmamız, bid'at ehlinin yanında ilim talep etmenin ancak serbest tercihle değil, zaruretle caiz olduğunu sana gösterir. Allah en iyisini bilir."]]}]}, {"ts": "31:20", "title": "8. Külliye: İnkârı bid'at ehlinden meşhur olan her fıkhî fer' akîde kitaplarına alınır", "paras": [{"reader": false, "ar": [[1880.0, "ومن الكلّيّات أيضًا: <b>كلُّ فرعٍ فقهيٍّ اشتُهر إنكارُه عن أهل البدع فيُدرَج في كتب العقائد.<\/b> كلُّ فرعٍ فقهيٍّ اشتُهر إنكارُه عن أهل البدع فيُدرَج في كتب الاعتقاد."], [1911.0, "أُعيدها مرةً ثالثة: كلُّ فرعٍ فقهيٍّ اشتُهر إنكارُه عن أهل البدع فيُدرَج في كتب العقائد."]], "tr": [[1880.0, "Külliyelerden biri de şudur: 8."], [1882.0, "külliye: İnkârı bid'at ehlinden meşhur olan her fıkhî fer' (ayrıntı meselesi) akîde kitaplarına alınır. İnkârı bid'at ehlinden meşhur olan her fıkhî fer' itikad kitaplarına alınır."], [1911.0, "Üçüncü kez tekrarlıyorum: İnkârı bid'at ehlinden meşhur olan her fıkhî fer' akîde kitaplarına alınır."]]}, {"reader": false, "ar": [[1927.0, "أقول وبالله التوفيق: وقد جرت عادةُ أهل السنة والجماعة في تصنيفهم لكتب العقائد أن ترى في بعضها جزئيّاتٍ فقهيّةً وفروعًا عمليّة،"], [1942.0, "ويسأل السائلُ منّا: ما الحكمة في إدخال هذا الفرع الفقهيّ في كتب العقائد؟"], [1951.0, "والجواب عن هذا السؤال في هذه الكلّيّة،"], [1958.0, "وهي: أنه لمّا كان إنكارُه مشهورًا عن هذه الطائفة من أهل البدع،"], [1966.5, "جُعل من باب الفيصل فيما بيننا وبينهم الإقرارُ به."]], "tr": [[1927.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat'in akîde kitaplarını telif etmelerindeki âdetleri, bunların bazılarında fıkhî cüz'iyyâtı ve amelî fer'leri görmen şeklinde cereyan etmiştir."], [1944.0, "İçimizden soran biri şöyle sorar:"], [1947.4, "\"Bu fıkhî fer'i akîde kitaplarına sokmanın hikmeti nedir?\" Bu sorunun cevabı bu külliyededir."], [1958.7, "O da şudur: Onun inkârı bid'at ehlinden bu taifeden meşhur olunca, onu ikrar etmek bizimle onlar arasında ayırıcı ölçü (fasıl) kılınmıştır."]]}, {"reader": false, "ar": [[1971.0, "ومن أبرز المسائل الفقهيّة الواردة في كتب العقائد:"], [1982.0, "مسألةُ غسل الرجلين؛ فإنّ كثيرًا من كتب الاعتقاد عند أهل السنة تنصّ على أنّ من السنة غسلَ الرجلين."], [1992.0, "فقد كانت هذه المسألة حاضرةً في كتب العقيدة؛"], [1998.0, "لأنها أوّلًا من الأمور الفقهيّة المتّفق عليها،"], [2004.0, "لتواتر نقل الخبر النبويّ فيها على مرّ التاريخ،"], [2010.0, "ولأنّ أعظم من أنكرها هم الرافضة الاثنا عشريّة؛"], [2018.0, "فإنهم يقولون بوجوب المسح على الرجلين في الوضوء."], [2025.0, "وأنكرها كذلك المعتزلة؛ فإنّ المعتزلة يخيّرون المتوضّئ بين المسح والغسل."]], "tr": [[1971.0, "Akîde kitaplarında yer alan en belirgin fıkhî meselelerden biri ayakları yıkama meselesidir."], [1984.0, "Ehl-i Sünnet'in itikad kitaplarının birçoğu, ayakları yıkamanın sünnetten olduğunu açıkça belirtir."], [1992.0, "Bu mesele akîde kitaplarında yer almıştır;"], [1998.0, "çünkü birincisi, tarih boyunca bu konudaki nebevî haberin nakli tevâtür derecesinde olduğu için üzerinde ittifak edilen fıkhî meselelerdendir."], [2010.0, "(İkincisi,) onu en çok inkâr edenler İsnâaşeriyye Râfızîleridir;"], [2018.0, "onlar abdestte ayaklara meshetmenin vacip olduğunu söylerler."], [2025.0, "Mu'tezile de onu inkâr etmiştir;"], [2028.0, "Mu'tezile abdest alanı mesh ile yıkama arasında serbest bırakır."]]}, {"reader": false, "ar": [[2033.0, "فلمّا كان هذا الفرع الفقهيّ مستنكرًا عند هاتين الطائفتين البدعيّتين،"], [2040.0, "عمد أهلُ السنة إلى إدخاله في كتب الاعتقاد."], [2044.0, "قال شيخ الإسلام ابن تيمية رحمه الله:"], [2048.5, "«ومن مسح على الرجلين فهو مبتدعٌ مخالفٌ للسنة المتواترة وللقرآن، ولا يجوز لأحدٍ أن يعمل بذلك مع إمكان الغسل»."], [2061.8, "«وقد اعتقد كثيرٌ من أهل الضلال أنها لا تُغسل، بل فرضُها مسحُ ظاهرها عند طائفةٍ من الشيعة، والتخييرُ بينه وبين الغسل عند طائفةٍ من المعتزلة»."], [2078.0, "انتهى كلامه رحمه الله."]], "tr": [[2033.0, "Bu fıkhî fer' bu iki bid'atçi taife nezdinde inkâr edilen bir şey olunca, Ehl-i Sünnet onu itikad kitaplarına sokmaya yöneldi."], [2044.0, "Şeyhülislam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2048.5, "\"Ayaklara mesheden kimse, mütevâtir sünnete ve Kur'an'a muhalif bir bid'atçidir."], [2052.9, "Yıkama imkânı varken hiç kimsenin bununla amel etmesi caiz değildir.\" \"Sapıklık ehlinin birçoğu ayakların yıkanmayacağına inanmıştır;"], [2061.8, "bilakis Şîa'dan bir taifeye göre farzı üstünü meshetmektir, Mu'tezile'den bir taifeye göre de bununla yıkama arasında serbestlik vardır.\" Sözü burada bitti; Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2080.0, "وقال الإمام النوويّ رحمه الله تعالى:"], [2087.0, "«أجمع العلماء على وجوب غسل الوجه واليدين والرجلين، وانفردت الرافضة عن العلماء فقالوا: الواجب في الرجلين المسح، وهذا خطأٌ منهم؛ فقد تظافرت النصوص بإيجاب غسلهما». انتهى كلامه."]], "tr": [[2080.0, "İmam Nevevî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2087.0, "\"Âlimler yüzü, elleri ve ayakları yıkamanın vacip olduğunda icmâ etmiştir."], [2090.5, "Râfıza âlimlerden ayrılarak 'Ayaklarda vacip olan meshtir' demiştir;"], [2096.6, "bu onların bir hatasıdır. Çünkü naslar ayakları yıkamanın vacip olduğunu destekleyerek birbirini takviye etmiştir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2106.0, "ومن هذه المسائل أيضًا:"], [2108.3, "المسح على الخفّين، وهو مسألةٌ فقهيّةٌ محرّرةٌ في كتب الفقهاء،"], [2115.0, "وقد تواترت الأدلّة من السنة على مشروعيّته،"], [2121.0, "وأنه من جملة الرخص."], [2124.0, "ولكن لأنه اشتُهر إنكارُه عن الرافضة والخوارج المنكرين للسنة،"], [2133.0, "أدخله علماءُ الاعتقاد في كتبهم العقديّة."], [2138.0, "قال الإمام سفيان الثوريّ رحمه الله:"], [2143.0, "«من لم يمسح على الخفّين فاتّهموه على دينه»."], [2150.0, "فجعلوه فيصلًا بين السنّيّ والبدعيّ؛"], [2155.0, "وذلك لثبوته عن النبيّ صلى الله عليه وسلم وأصحابه في صحاح الأخبار التي يبلغ مجموعُها مبلغَ التواتر،"], [2164.5, "وقد انعقد الإجماع على مشروعيّته قبل ظهور أهل الهوى والبدع."]], "tr": [[2106.0, "Bu meselelerden biri de mestler üzerine meshtir."], [2108.3, "Bu, fakihlerin kitaplarında tahrir edilmiş fıkhî bir meseledir;"], [2114.3, "meşruluğuna ve ruhsatlardan olduğuna dair sünnetten deliller tevâtür derecesine ulaşmıştır."], [2124.0, "Fakat inkârı Râfıza'dan ve sünneti inkâr eden Hâricîlerden meşhur olduğu için itikad âlimleri onu akîde kitaplarına almışlardır."], [2138.0, "İmam Süfyân es-Sevrî —Allah ona rahmet etsin— şöyle demiştir:"], [2143.0, "\"Mestler üzerine meshetmeyeni dini konusunda itham edin.\" Böylece onu sünnî ile bid'atçi arasında ayırıcı ölçü yaptılar."], [2155.0, "Bu, onun Nebî ﷺ'den ve ashâbından, toplamı tevâtür derecesine ulaşan sahih haberlerle sabit olması sebebiyledir."], [2163.2, "Heva ve bid'at ehli ortaya çıkmadan önce de meşruluğu üzerine icmâ gerçekleşmişti."]]}, {"reader": false, "ar": [[2170.0, "وقال النوويّ رحمه الله تعالى ـ تلاحظون أني قلت «الإمام النوويّ» في المرة الأولى وأكّدتُ عليها،"], [2178.0, "والثانية قلت «النوويّ»؛ ليه؟"], [2180.5, "لجواز الأمرين، وأنّ الأمر واسع،"], [2185.7, "وليس فيه ولاءٌ ولا براء ـ وقال النوويّ رحمه الله تعالى:"], [2190.6, "«أجمع من يُعتدّ به في الإجماع على جواز المسح على الخفّين في السفر والحضر، سواءٌ كان لحاجةٍ أو لغيرها». انتهى كلامه."]], "tr": [[2170.0, "Nevevî —Allah Teâlâ ona rahmet etsin— şöyle demiştir —fark ediyorsunuz, ilk seferde \"İmam Nevevî\" dedim ve bunu vurguladım;"], [2179.0, "ikincisinde \"Nevevî\" dedim. Neden? Her ikisi de caiz olduğu için;"], [2185.7, "mesele geniştir, bunda velâ ve berâ yoktur.— Nevevî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2190.6, "\"İcmâda görüşü itibara alınanlar, ister ihtiyaçtan ister başka bir sebepten olsun, yolculukta ve ikamette mestler üzerine meshin caiz olduğunda icmâ etmiştir.\" Sözü burada bitti."]]}]}, {"ts": "36:43", "title": "8. Külliye (devam): Akşam namazını erken kılmak ve teravih", "paras": [{"reader": false, "ar": [[2203.0, "ومن هذه المسائل: التعجيلُ بصلاة المغرب بعد غيبوبة قرص الشمس."], [2211.0, "فمن المعلوم أنّ الصلاة وأوقاتها محلُّ البحث فيها كتبُ الفقهاء لا كتبُ العقيدة،"], [2224.0, "ولكن لمّا وُجد من أهل الهوى من اعتاد تأخيرَ وقت صلاة المغرب إلى وقت تشابك النجوم،"], [2233.0, "واعتقد أنّ هذا هو السنة،"], [2236.0, "رأى العلماء أن يكرّروا ذِكرَ مسألة وقت المغرب واستحبابِ التعجيل بها في كتب العقائد أيضًا؛"], [2245.0, "من باب المفاصلة بينهم وبين أهل البدع."]], "tr": [[2203.0, "Bu meselelerden biri de güneş kursu battıktan sonra akşam namazını erken kılmaktır."], [2211.0, "Bilindiği üzere namaz ve vakitleri, hakkında araştırma yapılan yer akîde kitapları değil fakihlerin kitaplarıdır."], [2224.0, "Fakat heva ehlinden akşam namazının vaktini yıldızların birbirine karıştığı vakte kadar geciktirmeyi âdet edinen ve bunun sünnet olduğuna inanan kimseler bulununca, âlimler akşam vakti meselesini ve onu erken kılmanın müstehap oluşunu akîde kitaplarında da tekrar zikretmeyi uygun gördüler;"], [2245.0, "(bu,) onlarla bid'at ehli arasında ayrışma kabîlindendir."]]}, {"reader": false, "ar": [[2248.0, "قال الإمام الشعبيّ رحمه الله:"], [2252.0, "«واليهود لا يصلّون المغرب حتى تشتبك النجوم، وكذلك الرافضة»."], [2258.0, "وقال النوويّ رحمه الله تعالى:"], [2261.4, "«قد ذكرنا إجماعهم على أنّ أول وقتها غروبُ الشمس، وحكى الماورديّ وغيره عن الشيعة أنهم قالوا: لا يدخل وقتُها حتى تشتبك النجوم، والشيعة لا يُعتدّ بخلافهم»."], [2277.0, "وقال ابن بطّة العُكبَريّ رحمه الله تعالى:"], [2284.0, "«ومن السنة» ـ في كتب العقائد يا جماعة ـ «ومن السنة: المبادرةُ بصلاة المغرب إذا غاب حاجبُ الشمس قبل ظهور النجوم». انتهى كلامه."]], "tr": [[2248.0, "İmam Şa'bî —Allah ona rahmet etsin— şöyle demiştir:"], [2252.0, "\"Yahudiler yıldızlar birbirine karışana kadar akşam namazını kılmazlar;"], [2255.3, "Râfıza da böyledir.\" Nevevî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2261.4, "\"Onun (akşam namazının) ilk vaktinin güneşin batması olduğunda icmâ ettiklerini zikretmiştik."], [2270.2, "Mâverdî ve başkaları Şîa'dan, 'Yıldızlar birbirine karışmadıkça vakti girmez' dediklerini nakletmiştir."], [2277.0, "Şîa'nın muhalefeti itibara alınmaz.\" İbn Batta el-Ukberî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2284.0, "\"Sünnettendir\" —ey cemaat, akîde kitaplarında (geçiyor)— \"Sünnettendir:"], [2288.3, "Güneşin kenarı kaybolduğunda, yıldızlar görünmeden önce akşam namazına koşmak.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2297.0, "ومن هذه المسائل أيضًا:"], [2299.6, "صلاةُ التراويح؛ فإنها مسألةٌ مقرّرةٌ في كتب الفقهاء،"], [2304.8, "ثم كرّرها أهلُ السنة في مصنّفاتهم العقديّة."], [2311.0, "وهي صلاةٌ مندوبةٌ مسنونة،"], [2313.8, "صلّاها النبيّ صلى الله عليه وسلم جماعةً مع أصحابه في رمضان عدّةَ ليالٍ،"], [2322.0, "ثم تركها خشيةَ أن يُفرض عليهم قيامُ الليل،"], [2326.0, "وأعادها عمرُ رضي الله تعالى عنه في صدرٍ من خلافته،"], [2332.0, "فجمع الناس على أُبيّ بن كعبٍ رضي الله تعالى عنه."], [2337.0, "ولا يزال أهلُ الإسلام يتوارثون الصلاة ـ صلاةَ التراويح ـ جماعةً في المساجد إلى يومنا،"], [2345.0, "إلى يومنا هذا، من غير نكير."]], "tr": [[2297.0, "Bu meselelerden biri de teravih namazıdır."], [2299.6, "Bu, fakihlerin kitaplarında takrir edilmiş bir meseledir;"], [2302.2, "sonra Ehl-i Sünnet onu akîdeye dair eserlerinde tekrar etmiştir."], [2306.1, "Teravih mendup ve sünnet bir namazdır;"], [2311.0, "Nebî ﷺ onu Ramazan'da birkaç gece ashâbıyla birlikte cemaatle kıldı, sonra gece namazının onlara farz kılınmasından endişe ederek onu bıraktı."], [2323.5, "Ömer —Allah Teâlâ ondan razı olsun— hilafetinin ilk döneminde onu yeniden başlattı ve insanları Übey b."], [2332.5, "Kâ'b'ın —Allah Teâlâ ondan razı olsun— arkasında topladı."], [2337.0, "İslam ehli, hiçbir itiraz olmaksızın günümüze kadar, bugünümüze kadar mescitlerde namazı —teravih namazını— cemaatle kılmayı birbirlerinden tevarüs etmeye devam etmektedir."]]}, {"reader": false, "ar": [[2348.0, "إلا أنّ الشيعة تكرهها جماعةً،"], [2352.0, "بدعوى أنها بدعةٌ في الدين أحدثها عمرُ بن الخطاب رضي الله عنه؛"], [2360.0, "فلكراهيتهم لأمير المؤمنين عمر لا يرضون بصلاتها جماعة."], [2367.0, "ولذلك قال قِوامُ السنة الأصفهانيّ رحمه الله:"], [2374.0, "«ومن السنة» ـ أي: ومن الأمور العقديّة ـ «صلاةُ التراويح في شهر رمضان في الجماعة»."], [2382.0, "ومن العجيب في هذا الزمان:"], [2385.5, "أنه يوجد طائفةٌ من الشيعة لا ترفض صلاة التراويح،"], [2392.0, "ولكنها ترى مشروعيّتها بعد صلاة المغرب مباشرةً؛ مخالفةً لعمر."]], "tr": [[2348.0, "Ancak Şîa, onun Ömer b."], [2350.4, "el-Hattâb'ın —Allah ondan razı olsun— dinde çıkardığı bir bid'at olduğunu iddia ederek onun cemaatle kılınmasını mekruh görür."], [2360.0, "Mü'minlerin emiri Ömer'e duydukları nefret yüzünden onun cemaatle kılınmasına razı olmazlar."], [2367.0, "Bu yüzden Kıvâmü's-Sünne el-Isfahânî —Allah ona rahmet etsin— şöyle demiştir:"], [2375.5, "\"Sünnettendir\" —yani akîdeye dair hususlardandır— \"Ramazan ayında teravih namazını cemaatle kılmak.\" Bu zamanın tuhaflıklarından biri de şudur:"], [2385.5, "Şîa'dan teravih namazını reddetmeyen, fakat Ömer'e muhalefet olsun diye onun akşam namazından hemen sonra kılınmasının meşru olduğunu düşünen bir taife vardır."]]}, {"reader": false, "ar": [[2399.0, "وقال أبو العباس ابن تيمية رحمه الله تعالى:"], [2405.0, "«الرافضة تكره صلاة التراويح، فإذا صلَّوا قبل العشاء الآخرة لا تكون هي صلاةَ التراويح»."], [2415.0, "«فمن صلّاها قبل العشاء فقد سلك سبيلَ المبتدعة المخالفين للسنة»."], [2422.0, "انتهى كلامه رحمه الله."]], "tr": [[2399.0, "Ebu'l-Abbâs İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2402.6, "\"Râfıza teravih namazını mekruh görür."], [2405.0, "Yatsı namazından önce kıldıklarında o, teravih namazı olmaz.\" \"Kim onu yatsıdan önce kılarsa, sünnete muhalif bid'atçilerin yoluna girmiş olur.\" Sözü burada bitti; Allah ona rahmet etsin."]]}]}, {"ts": "40:23", "title": "8. Külliye (devam): Akîde kitaplarına giren diğer fıkhî meseleler", "paras": [{"reader": false, "ar": [[2423.0, "ومن المسائل أيضًا: جوازُ الصلاة في السراويل،"], [2432.0, "خلافًا للخوارج ـ أقولها مختصرًا ـ خلافًا للخوارج."], [2437.0, "ومنها أيضًا: طهارةُ سؤر الكافر،"], [2442.0, "خلافًا للروافض. ومنها أيضًا:"], [2448.0, "انتقاضُ الوضوء بخروج المذي،"], [2452.0, "خلافًا لبعض الخوارج والروافض."], [2459.0, "ومنها: مشروعيّةُ قصر الصلاة في السفر،"], [2466.0, "كما قال الطحاويّ في «عقيدته»:"], [2471.0, "«ونرى القصر»، خلافًا لبعض الخوارج الذين لا يجيزون القصر إلا مع الخوف الشديد."]], "tr": [[2423.0, "(Bu) meselelerden biri de şalvarla (pantolonla) namaz kılmanın caiz oluşudur;"], [2433.0, "Hâricîlerin aksine —kısaca söylüyorum— Hâricîlerin aksine."], [2437.0, "Bunlardan biri de kâfirin artığının temiz oluşudur;"], [2444.0, "Râfızîlerin aksine. Bunlardan biri de mezînin çıkmasıyla abdestin bozulmasıdır;"], [2459.0, "Hâricîlerin ve Râfızîlerin bir kısmının aksine."], [2462.1, "Bunlardan biri de yolculukta namazı kısaltmanın meşru oluşudur;"], [2471.0, "Tahâvî'nin akîdesinde \"Kasrı (caiz) görürüz\" dediği gibi."], [2473.8, "(Bu,) kasrı ancak şiddetli korku ile birlikte caiz gören bazı Hâricîlerin aksinedir."]]}, {"reader": false, "ar": [[2485.0, "ومنها أيضًا: مشروعيّةُ الصلاة على من مات من أهل القبلة ـ صلاةِ الجنازة ـ،"], [2493.1, "خلافًا للخوارج. ومنها أيضًا:"], [2497.4, "تحريمُ متعة النساء إلى يوم القيامة،"], [2501.5, "خلافًا للشيعة الرافضة. ومنها أيضًا:"], [2509.4, "مشروعيّةُ رجم الزاني المحصن،"], [2512.2, "خلافًا للخوارج وبعض المعتزلة."], [2518.0, "والخلاصة من ذلك: أنه لا يُستغرب أن يوجد بعضُ الفروع الفقهيّة العمليّة في كتب العقائد،"], [2524.0, "وما ذلك إلا لأنّ المنكر له ـ أو لها ـ إنما هم أهلُ البدع. والله أعلم."]], "tr": [[2485.0, "Bunlardan biri de kıble ehlinden ölen kimseye namaz —cenaze namazı— kılmanın meşru oluşudur;"], [2496.0, "Hâricîlerin aksine. Bunlardan biri de kadınlarla mut'anın kıyamet gününe kadar haram oluşudur;"], [2508.0, "Şîa Râfıza'nın aksine. Bunlardan biri de muhsan zâniyi recmetmenin meşru oluşudur;"], [2518.0, "Hâricîlerin ve Mu'tezile'nin bir kısmının aksine."], [2519.2, "Bundan çıkan sonuç şudur: Akîde kitaplarında bazı amelî fıkhî fer'lerin bulunması yadırganmaz;"], [2523.6, "bunun sebebi ancak onu —ya da onları— inkâr edenlerin bid'at ehli olmasıdır. Allah en iyisini bilir."]]}]}, {"ts": "42:17", "title": "9. Külliye: Selefin amelinin üzerinde cereyan ettiği şey için özel bir delil istenmez", "paras": [{"reader": false, "ar": [[2537.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما جرى عليه عملُ السلف فلا يُطلب عليه دليلٌ بخصوصه.<\/b> ـ ما أدري،"], [2546.2, "كلامي واضح؟ ـ كلُّ ما جرى عليه عملُ السلف ـ كم رقم القاعدة؟"], [2548.0, "ـ كلُّ ما جرى عليه عملُ السلف فلا يُطلب عليه دليلٌ بخصوصه. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2537.0, "Külliyelerden biri de şudur: 9."], [2539.0, "külliye: Selefin amelinin üzerinde cereyan ettiği her şey için ona özel bir delil istenmez. —Bilmiyorum, sözüm açık mı?— Selefin amelinin üzerinde cereyan ettiği her şey —kaidenin numarası kaç?— Selefin amelinin üzerinde cereyan ettiği her şey için ona özel bir delil istenmez."]]}, {"reader": false, "ar": [[2560.0, "أقول وبالله التوفيق: وذلك من باب إحسان الظنّ بسلف الأمّة وأئمّتها؛"], [2577.0, "فإذا أجمعوا على عملٍ،"], [2579.7, "أو كان جماهيرُهم وأغلبُهم وعامّتُهم على عملٍ معيّن،"], [2585.0, "فإنّ الخالف يتلقّفه عن السالف من غير أن يطلب عليه دليلًا بخصوصه،"], [2592.0, "ولا ينبغي أن يكون مثارًا للخلاف أو النزاع أو الخصومة عند المتأخّرين ما دام سلفُهم الصالح قد عملوا به."]], "tr": [[2560.0, "Tevfik Allah'tandır, derim ki: Bu, ümmetin selefine ve imamlarına hüsnüzan kabîlindendir."], [2577.0, "Onlar bir amel üzerinde icmâ ettiklerinde ya da cumhurları, çoğunluğu ve geneli belirli bir amel üzerinde olduğunda, sonra gelen onu önce gelenden, ona özel bir delil istemeksizin alır."], [2593.0, "Selef-i sâlihleri onunla amel ettiği sürece (bu amel) sonrakiler nezdinde ihtilaf, çekişme ya da husumet konusu olmamalıdır."]]}, {"reader": false, "ar": [[2602.0, "ويُفرَّع على ذلك: جوازُ الجمع في المطر؛"], [2606.0, "فإنه ليس عليه دليلٌ بخصوصه،"], [2608.3, "إلا أنه لا يُعرف فيه خلافٌ عن السلف؛"], [2612.0, "فقد جرى عملُ السلف على جواز الجمع بين العشاءين في المطر."], [2620.0, "ومنها: دعاءُ الختم في رمضان في الصلاة؛"], [2626.0, "فإنه منقولٌ عن جماهير سلف الأمّة وأئمّتها."], [2630.0, "ومنها كذلك: التكبيرُ المقيّد في أيام التشريق؛"], [2637.0, "فإنّ كلَّ حديثٍ مرفوعٍ يدلّ على مشروعيّته فهو ضعيف،"], [2643.0, "ولكننا تلقّفناه عن السلف،"], [2646.0, "ولا يُعرف فيه خلافٌ عنهم؛"], [2649.0, "فلا ينبغي أن يطلب الإنسانُ فيه دليلًا بخصوصه."]], "tr": [[2602.0, "Buna yağmurda (namazları) cem etmenin caiz oluşu bağlanır."], [2606.0, "Bunun için özel bir delil yoktur;"], [2608.8, "ancak bu konuda seleften bir ihtilaf bilinmez."], [2612.0, "Selefin ameli, yağmurda akşam ile yatsıyı cem etmenin caiz oluşu üzerine cereyan etmiştir."], [2620.0, "Bunlardan biri de Ramazan'da namazda (yapılan) hatim duasıdır;"], [2626.0, "bu, ümmetin selefinin ve imamlarının cumhurundan nakledilmiştir."], [2630.0, "Bunlardan biri de teşrik günlerindeki mukayyed tekbirdir."], [2637.0, "Meşruluğuna delâlet eden her merfû hadis zayıftır;"], [2641.0, "fakat biz onu seleften aldık ve bu konuda onlardan bir ihtilaf bilinmez."], [2649.0, "Bu yüzden insanın bu konuda özel bir delil istemesi uygun değildir."]]}, {"reader": false, "ar": [[2654.0, "ومنها كذلك: مشروعيّةُ تصويم الصبيان؛"], [2660.0, "فإنه ليس عليه دليلٌ بخصوصه،"], [2662.8, "لكنه من عمل السلف."], [2665.0, "ومنه كذلك: قراءةُ القرآن في إناءٍ أو ماء،"], [2669.0, "ثم رشُّه على المريض،"], [2670.6, "أو شربُه منه، أو وضوؤه منه؛"], [2673.0, "فإنه ليس عليه دليلٌ بخصوصه،"], [2676.0, "ولكن جرى عليه عملُ السلف."], [2679.0, "ومنه كذلك: صلاةُ التراويح جماعةً؛"], [2683.0, "فإنها من عمل السلف المُجمَع عليه خالفًا عن سالف،"], [2690.0, "ولا يُعرف إنكارُه إلا عن أهل البدع."]], "tr": [[2654.0, "Bunlardan biri de çocuklara oruç tutturmanın meşru oluşudur;"], [2660.6, "bunun için özel bir delil yoktur, fakat selefin amelindendir."], [2665.0, "Bundan biri de bir kaba ya da suya Kur'an okumak, sonra onu hastanın üzerine serpmek, ondan içmek ya da onunla abdest almaktır;"], [2673.0, "bunun için özel bir delil yoktur, fakat selefin ameli bunun üzerine cereyan etmiştir."], [2679.0, "Bundan biri de teravih namazını cemaatle kılmaktır;"], [2683.0, "bu, sonra gelenin önce gelenden (aldığı), üzerinde icmâ edilen selef amelindendir;"], [2691.1, "inkârı ancak bid'at ehlinden bilinir."]]}, {"reader": false, "ar": [[2694.0, "ومنها كذلك: الأذانُ الأوّل للجمعة؛"], [2698.0, "فإنّ أوّل من ابتدأه عثمانُ رضي الله تعالى عنه ـ مع أنّ له سنّةً متّبعة ـ،"], [2705.0, "إلا أنّ السلف من بعده قد توارثوه عنه،"], [2709.0, "ولا يزال يعمل به الخالفُ عن السالف إلى يومنا هذا؛"], [2713.6, "فلا ينبغي أن يُطلب على هذا الأذان دليلٌ بخصوصه."], [2719.0, "وهذا عندنا ـ معاشرَ أهل السنة والجماعة ـ ممّا يُعظَّم به السلف. والله أعلم."]], "tr": [[2694.0, "Bunlardan biri de cuma için ilk ezandır."], [2698.0, "Onu ilk başlatan Osman'dır —Allah Teâlâ ondan razı olsun—;"], [2701.1, "(zaten) onun uyulan bir sünneti vardır."], [2703.8, "Bununla birlikte ondan sonraki selef onu ondan tevarüs etmiştir ve sonra gelen önce gelenden (alarak) bugünümüze kadar onunla amel etmeye devam etmektedir."], [2713.6, "Bu yüzden bu ezan için özel bir delil istenmesi uygun değildir."], [2719.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğuna göre bu, selefin kendisiyle yüceltildiği şeylerdendir. Allah en iyisini bilir."]]}]}, {"ts": "45:27", "title": "10. Külliye: Bid'ate götüren her vesile haramdır", "paras": [{"reader": false, "ar": [[2727.0, "الكلّيّة الأخيرة في هذا الدرس:"], [2730.0, "<b>كلُّ وسيلةٍ توصل إلى بدعةٍ فمحرّمة.<\/b> كلُّ وسيلةٍ توصل لبدعةٍ فمحرّمة."], [2739.6, "<span class=\"note\">(يكررها)<\/span> وذلك لأنّ المتقرّر في القواعد أنّ الوسائل لها أحكامُ المقاصد،"], [2753.0, "وأنّ ما لا يتمّ تركُ الحرام إلا به فتركُه واجب،"], [2759.0, "ولوجوب سدّ الذرائع التي تُفضي إلى الحرام إفضاءَ علمٍ أو غلبةِ ظنّ."], [2766.0, "ومن ذلك: قطعُ كلّ طريقٍ يوصل إلى شيءٍ من البدع،"], [2771.6, "أو يُعين على شيءٍ من البدع."]], "tr": [[2727.0, "Bu dersteki son külliye: 10."], [2730.0, "külliye: Bid'ate götüren her vesile haramdır. Bir bid'ate götüren her vesile haramdır."], [2739.6, "Bu şundandır: Kaidelerde yerleşik olan şudur:"], [2745.5, "Vesileler, maksatların hükümlerini alır. Haramın terki ancak kendisiyle tamamlanan şeyin terki vaciptir."], [2757.2, "Ve harama kesin bilgiyle ya da galip zanla götüren zerîalari (vasıtaları) kapatmak vacip olduğu içindir."], [2766.0, "Bundan biri de bid'atlerden bir şeye götüren ya da bid'atlerden bir şeye yardım eden her yolu kesmektir."]]}, {"reader": false, "ar": [[2775.0, "كبناء زوايا للصوفيّة؛ فإنّ هذا لا يجوز؛"], [2779.8, "لأنه وسيلةٌ من وسائل البدع."], [2787.0, "وكشراء الطِّيب للقبور؛ فإنّ هذا الشراء محرّم؛"], [2791.9, "لأنه وسيلةٌ لبدعة. وكشراء الستور التي تُغطّى بها القبورُ المعظّمة عند أصحابها؛"], [2804.0, "فإنّ هذا الشراء محرّم؛"], [2806.8, "لأنه وسيلةٌ تُفضي إلى بدعة."], [2811.0, "وكتوفير آلة البناء التي يُرمَّم بها شيءٌ من معابد أهل البدع، أو حسينيّات الرافضة."]], "tr": [[2775.0, "Sûfîler için zaviyeler inşa etmek gibi;"], [2779.8, "bu caiz değildir, çünkü bid'atlerin vesilelerinden bir vesiledir."], [2787.0, "Kabirler için güzel koku satın almak gibi;"], [2789.1, "bu satın alma haramdır, çünkü bir bid'ate vesiledir."], [2797.0, "Sahiplerince yüceltilen kabirlerin üstünün örtüldüğü örtüleri satın almak gibi;"], [2804.0, "bu satın alma haramdır, çünkü bir bid'ate götüren vesiledir."], [2811.0, "Bid'at ehlinin mabetlerinden birinin ya da Râfıza'nın hüseyniyyelerinin onarıldığı inşaat malzemesini temin etmek gibi."]]}, {"reader": false, "ar": [[2826.0, "وكشدّ الرحل للتعبّد عند قبور الأولياء والصالحين؛"], [2832.0, "فإنّ الرحال لا تُشدّ إلا إلى ثلاثة مساجد،"], [2836.0, "كما تواترت بذلك السنة عن النبيّ صلى الله عليه وسلم."], [2840.0, "وكاستضافة علماء أهل البدع في أيّ وسيلةٍ إعلاميّة؛"], [2847.0, "فإنه من الوسائل التي تُفضي إلى انتشار البدع."], [2851.0, "وهكذا دواليك؛ فكلُّ وسيلةٍ توصل الإنسانَ إلى بدعةٍ فإننا نحكم عليها ـ معاشرَ أهل السنة والجماعة ـ بأنها محرّمةٌ لا تجوز."], [2864.0, "وآخرُ دعوانا أنِ الحمدُ لله ربِّ العالمين،"], [2866.8, "وصلّى الله وسلّم على نبيّنا محمدٍ،"], [2869.2, "وعلى آله وصحبه أجمعين."]], "tr": [[2826.0, "Velîlerin ve sâlihlerin kabirleri yanında ibadet etmek için yolculuk etmek gibi;"], [2834.0, "çünkü Nebî ﷺ'den sünnetin tevâtür derecesinde bildirdiği üzere yolculuk ancak üç mescide yapılır."], [2840.0, "Bid'at ehlinin âlimlerini herhangi bir medya vasıtasında konuk etmek gibi;"], [2847.0, "çünkü bu, bid'atlerin yayılmasına götüren vesilelerdendir."], [2849.5, "Bu böyle devam eder. İnsanı bir bid'ate götüren her vesile hakkında biz Ehl-i Sünnet ve'l-Cemaat topluluğu, onun haram olduğuna ve caiz olmadığına hükmederiz."], [2864.0, "Son duamız, âlemlerin Rabbi Allah'a hamd olsun (demektir)."], [2866.8, "Allah, Peygamberimiz Muhammed'e, âline ve ashâbının hepsine salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
