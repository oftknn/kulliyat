 şeye düşerse onu tekfir etmeyiz;"], [2781.0, "ya da zorlanarak fıskı gerektiren bir şeye düşerse onu tefsik etmeyiz —anladınız mı?— ya da zorlanarak günahı gerektiren bir şeye düşerse onu günahkâr saymayız;"], [2798.4, "bu böyle devam eder. Teklif ehliyetinin ârızalarından bir şeyi kaybeden herkesi, ceza gerektiren bu şer'î vasıflardan herhangi birinin altına sokmaktan sakın."]]}, {"reader": false, "ar": [[2810.0, "ومنها: النائم؛ فإنّ قلم التكليف مرفوعٌ عنه؛"], [2815.0, "فإذا فعل النائم في نومه شيئًا ممّا يوجب تكفيره،"], [2820.2, "فنطق بكلمة الكفر، أو شيئًا ممّا يوجب تأثيمه،"], [2826.0, "فإنه لا يجوز لنا أن ندخله تحت دائرة شيءٍ من هذه الأوصاف؛"], [2833.0, "لأنه فقد وصفًا من أوصاف أهليّته،"], [2836.3, "وهي كمال العقل وفهم الخطاب."], [2839.0, "ومنها: المغمى عليه؛ فإنه لا يجوز أن نحكم عليه بشيءٍ من هذه الأوصاف."]], "tr": [[2810.0, "Bunlardan biri de uyuyandır; teklif kalemi ondan kaldırılmıştır."], [2810.0, "Uyuyan kişi uykusunda tekfirini gerektiren bir şey yapsa, mesela küfür kelimesini söylese, ya da günahkâr sayılmasını gerektiren bir şey yapsa, onu bu vasıflardan herhangi birinin dairesine sokmamız caiz değildir."], [2826.0, "Çünkü o, ehliyet vasıflarından bir vasfı, yani aklın tamlığını ve hitabı anlamayı kaybetmiştir."], [2836.3, "Bunlardan biri de baygın olandır;"], [2839.0, "onun hakkında bu vasıflardan herhangi biriyle hüküm vermemiz caiz değildir."]]}, {"reader": false, "ar": [[2846.0, "ومنها: الناسي؛ فإذا وقع الإنسان في شيءٍ ممّا يوجب شيئًا من هذه الأوصاف ناسيًا ـ ناسيًا ـ فإنّ قلم التكليف مرفوعٌ عنه،"], [2857.0, "كما قال الله عز وجل:"], [2858.7, "<span class=\"ayah\">﴿رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا﴾<\/span> <span class=\"ref\">[البقرة: ٢٨٦]<\/span>،"], [2861.0, "وقال النبيّ صلى الله عليه وسلم:"], [2863.8, "«من نسي وهو صائمٌ فأكل أو شرب فليُتمّ صومه، فإنما أطعمه الله وسقاه»."], [2871.0, "وفي الحديث الذي اشتهر عند الأصوليّين:"], [2875.0, "«إنّ الله تجاوز عن أمّتي الخطأَ والنسيانَ وما استُكرهوا عليه»."]], "tr": [[2846.0, "Bunlardan biri de unutandır. İnsan bu vasıflardan birini gerektiren bir şeye unutarak —unutarak— düşerse, teklif kalemi ondan kaldırılmıştır."], [2846.0, "Allah Azze ve Celle'nin buyurduğu gibi:"], [2858.7, "<span class=\"ayah\">﴿Rabbimiz! Unutur ya da yanılırsak bizi sorumlu tutma﴾<\/span> [Bakara 286]."], [2858.7, "Nebî ﷺ de şöyle buyurmuştur:"], [2861.0, "\"Kim oruçluyken unutup yer ya da içerse orucunu tamamlasın;"], [2863.8, "çünkü onu ancak Allah yedirmiş ve içirmiştir.\" Usûlcüler arasında meşhur olan hadiste de şöyledir:"], [2875.0, "\"Allah ümmetimden hatayı, unutmayı ve zorlandıkları şeyi bağışlamıştır.\""]]}, {"reader": false, "ar": [[2880.0, "ومنها: الغافل؛ فإذا وقع الإنسان الغافل في شيءٍ من هذه الأمور فلا يجوز أن ندخله تحت دائرة شيءٍ من هذه الأوصاف."], [2890.0, "ومنها: الجاهل جهلًا يُعذر به صاحبه؛"], [2895.0, "فإنّ الجهل من جملة ما يعرض للأهليّة فيرفع عن صاحبه التكليف."], [2900.0, "ومنها أيضًا: المعتوه، وهو من أُصيب بخللٍ في عقله فلم يعُد عنده التركيز المطلوب،"], [2910.0, "كالمصاب بالزهايمر مثلًا. فإنّ هؤلاء قد عرض لأهليّة تكليفهم ما يوجب علينا أن نرفع عنهم كلَّ وصفٍ يوجب عقوبة. والله أعلم."]], "tr": [[2880.0, "Bunlardan biri de gafildir. Gafil insan bu işlerden birine düşerse, onu bu vasıflardan herhangi birinin dairesine sokmamız caiz değildir."], [2880.0, "Bunlardan biri de sahibinin mazur görüleceği bir cehaletle câhil olandır;"], [2895.0, "çünkü cehalet, ehliyete ârız olup sahibinden teklifi kaldıran şeylerdendir."], [2895.0, "Bunlardan biri de ma'tûhtur (bunak);"], [2900.0, "o, aklında bir bozukluk meydana gelen ve artık gereken dikkati kalmayan kimsedir;"], [2910.0, "mesela Alzheimer hastası gibi. Bunların teklif ehliyetine, kendilerinden ceza gerektiren her vasfı kaldırmamızı gerektiren bir şey ârız olmuştur. Allah en iyisini bilir."]]}]}, {"ts": "48:46", "title": "8. Külliye: Zorlanarak küfre düşen kimsenin üzerine küfür vâki olmaz", "paras": [{"reader": false, "ar": [[2926.0, "ومن الكلّيّات أيضًا: <b>كلُّ من وقع في الكفر مكرَهًا فلا يقع الكفر عليه.<\/b> <span class=\"note\">(يكررها)<\/span> أقول:"], [2944.7, "وهذا لقول الله عز وجل:"], [2948.1, "<span class=\"ayah\">﴿مَن كَفَرَ بِاللَّهِ مِن بَعْدِ إِيمَانِهِ إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُ مُطْمَئِنٌّ بِالْإِيمَانِ وَلَٰكِن مَّن شَرَحَ بِالْكُفْرِ صَدْرًا فَعَلَيْهِمْ غَضَبٌ مِّنَ اللَّهِ وَلَهُمْ عَذَابٌ عَظِيمٌ﴾<\/span> <span class=\"ref\">[النحل: ١٠٦]<\/span>."]], "tr": [[2926.0, "Külliyelerden biri de şudur: 8."], [2926.0, "külliye: Zorlanarak küfre düşen kimsenin üzerine küfür vâki olmaz. Derim ki:"], [2944.7, "Bu, Allah Azze ve Celle'nin şu sözünden dolayıdır:"], [2948.1, "<span class=\"ayah\">﴿Kim imanından sonra Allah'ı inkâr ederse —kalbi imanla mutmain olduğu hâlde zorlanan müstesna— fakat kim göğsünü küfre açarsa, Allah'ın gazabı onların üzerinedir; onlar için büyük bir azap vardır﴾<\/span> [Nahl 106]."]]}, {"reader": false, "ar": [[2965.0, "قال ابن العربيّ رحمه الله تعالى:"], [2968.0, "«لمّا سمح الله تعالى في الكفر به، وهو أصل الشريعة» ـ الآن يُبيّن لك القياسَ المنطقيّ،"], [2977.0, "وهي أنه إذا جاز أعظمُ المحرّمات بسبب الإكراه فما دونه من باب أولى،"], [2986.2, "يعني: من باب التبسيط <span class=\"q\">؟ 49:44<\/span> ـ قال ابن العربيّ رحمه الله:"], [2990.0, "«لمّا سمح الله تعالى في الكفر به ـ وهو أصل الشريعة ـ عند الإكراه، ولم يؤاخذ به، حمل العلماءُ عليه فروعَ الشريعة؛ فإذا وقع الإكراه عليها لم يؤاخذ بها»."]], "tr": [[2965.0, "İbnü'l-Arabî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2968.0, "\"Allah Teâlâ, şeriatin aslı olan kendisini inkâr etme hususunda müsamaha gösterince\" —şimdi sana mantıkî kıyası açıklıyor;"], [2977.0, "o da şudur: Haramların en büyüğü ikrah sebebiyle caiz olursa, ondan aşağısı evleviyetle (caiz olur)."], [2986.2, "Yani basitleştirme <span class=\"q\">؟<\/span> kabîlinden— İbnü'l-Arabî —Allah ona rahmet etsin— şöyle demiştir:"], [2986.2, "\"Allah Teâlâ, şeriatin aslı olan kendisini inkâr etme hususunda ikrah anında müsamaha gösterip onunla muaheze etmeyince, âlimler şeriatin fürûunu da ona hamlettiler (kıyas ettiler);"], [2990.0, "bunlarda ikrah vâki olursa onlarla muaheze edilmez.\""]]}]}, {"ts": "50:03", "title": "8. Külliye (devam): İkrah hakkında icmâ nakilleri", "paras": [{"reader": false, "ar": [[3003.0, "قال أبو بكرٍ الجصّاص الحنفيّ رحمه الله تعالى:"], [3008.0, "«هذا أصلٌ في جواز إظهار كلمة الكفر في حال الإكراه»."], [3012.0, "وقال الإمام البغويّ رحمه الله:"], [3016.0, "«أجمع العلماء» ـ يعني: كلّيّةٌ إجماعيّة ـ «أجمع العلماء على أنّ من أُكره على كلمة الكفر يجوز له أن يقول بلسانه، وإذا قال بلسانه غيرَ معتقدٍ لا يكون كافرًا، وإن أبى أن يقوله حتى يُقتل كان أفضل»."], [3038.0, "يعني: هو أعطاها الأفضليّة وأعطاها الجواز،"], [3044.0, "ونحن نبحث في مرتبة الجواز لا في مرتبة الأفضل."]], "tr": [[3003.0, "Ebû Bekir el-Cessâs el-Hanefî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [3008.0, "\"Bu, ikrah hâlinde küfür kelimesini izhar etmenin caiz olduğuna dair bir asıldır.\" İmam Beğavî —Allah ona rahmet etsin— şöyle demiştir:"], [3016.0, "\"Âlimler icmâ etmiştir\" —yani icmâya dayalı bir külliyedir— \"Âlimler icmâ etmiştir ki küfür kelimesini söylemeye zorlanan kimsenin onu diliyle söylemesi caizdir."], [3016.0, "İnanmadığı hâlde diliyle söylerse kâfir olmaz."], [3016.0, "Söylemeyi reddedip öldürülürse daha faziletlidir.\" Yani o, (reddetmeye) faziletli olmayı, (söylemeye) de cevazı vermiştir."], [3044.0, "Biz ise fazilet mertebesini değil, cevaz mertebesini araştırıyoruz."]]}, {"reader": false, "ar": [[3047.9, "أُعيد كلام الإمام البغويّ رحمه الله:"], [3050.0, "«أجمع العلماء على أنّ من أُكره على كلمة الكفر يجوز له أن يقولها بلسانه، وإذا قال بلسانه غيرَ معتقدٍ لا يكون كفرًا، وإن أبى أن يقولها حتى يُقتل كان أفضل»."], [3068.0, "وقال الإمام ابن قدامة رحمه الله:"], [3071.0, "«من أُكره على الكفر فأتى بكلمة الكفر لم يصر كافرًا»."]], "tr": [[3047.9, "İmam Beğavî'nin —Allah ona rahmet etsin— sözünü tekrarlıyorum:"], [3050.0, "\"Âlimler icmâ etmiştir ki küfür kelimesini söylemeye zorlanan kimsenin onu diliyle söylemesi caizdir."], [3050.0, "İnanmadığı hâlde diliyle söylerse (bu) küfür olmaz."], [3050.0, "Onu söylemeyi reddedip öldürülürse daha faziletlidir.\" İmam İbn Kudâme —Allah ona rahmet etsin— şöyle demiştir:"], [3071.0, "\"Küfre zorlanıp küfür kelimesini söyleyen kimse kâfir olmaz.\""]]}, {"reader": false, "ar": [[3077.0, "وقال ابن تيمية رحمه الله تعالى في مسألة السجود للمخلوق،"], [3082.0, "قال: «إذا أُكره الرجل على ذلك» ـ يعني على أن يسجد لبعض المخلوقين ـ «إذا أُكره الرجل على ذلك، بحيث لو لم يفعله لأفضى إلى ضربه، أو حبسه، أو أخذ ماله، أو قطع رزقه الذي يستحقّه من بيت المال، ونحو ذلك من الضرر، فإنه يجوز له ذلك عند أكثر العلماء؛ فإنّ الإكراه عند أكثرهم يبيح الفعل المحرّم، كشرب الخمر ونحوه، وهو المشهور عن أحمد وغيره."]], "tr": [[3077.0, "İbn Teymiyye —Allah Teâlâ ona rahmet etsin— mahlûka secde etme meselesinde şöyle demiştir:"], [3082.0, "\"Kişi buna zorlanırsa\" —yani bazı mahlûklara secde etmeye— \"kişi buna, yapmadığı takdirde dövülmesine, hapsedilmesine, malının alınmasına ya da beytülmalden hak ettiği rızkının kesilmesine ve benzeri zararlara yol açacak şekilde zorlanırsa, âlimlerin çoğuna göre bu ona caizdir."], [3082.0, "Çünkü onların çoğuna göre ikrah, şarap içmek ve benzeri gibi haram fiili mubah kılar."], [3082.0, "Ahmed'den ve başkasından meşhur olan da budur."]]}, {"reader": false, "ar": [[3115.0, "ولكن عليه مع ذلك أن يكرهه بقلبه،"], [3118.2, "ويحرص على الامتناع منه بحسب الإمكان،"], [3121.0, "ومن علم الله منه الصدقَ أعانه الله على ذلك،"], [3127.0, "وقد يُعافى ببركة صدقه من الأمر كلّه»."]], "tr": [[3115.0, "Fakat bununla birlikte onu kalbiyle kerih görmesi ve imkân ölçüsünde ondan kaçınmaya gayret etmesi gerekir."], [3121.0, "Allah kimden sıdk (samimiyet) bilirse ona bu hususta yardım eder;"], [3121.0, "sıdkının bereketiyle bu işin tamamından da kurtarılabilir.\""]]}, {"reader": false, "ar": [[3135.0, "قال ابن بطّال رحمه الله تعالى:"], [3137.0, "«أجمع العلماء» ـ إذن كم نقلُ الإجماع الآن؟"], [3141.6, "إي نعم ـ قال ابن بطّال:"], [3143.1, "«أجمع العلماء على أنّ من أُكره على الكفر حتى خشي على نفسه القتل أنه لا إثم عليه إن كفر وقلبه مطمئنٌّ بالإيمان، ولا تبين منه زوجته، ولا يُحكم عليه بشيءٍ من أحكام الكفر»."]], "tr": [[3135.0, "İbn Battâl —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [3137.0, "\"Âlimler icmâ etmiştir\" —peki şimdi kaç tane icmâ nakli oldu?"], [3141.6, "Evet— İbn Battâl şöyle demiştir:"], [3143.1, "\"Âlimler icmâ etmiştir ki canından korkacak derecede küfre zorlanan kimse, kalbi imanla mutmain olduğu hâlde küfrederse ona günah yoktur;"], [3143.1, "hanımı ondan boş düşmez ve onun hakkında küfür hükümlerinden hiçbiriyle hükmedilmez.\""]]}, {"reader": false, "ar": [[3157.0, "وقال ابن العربيّ رحمه الله تعالى:"], [3160.4, "«أمّا الكفر بالله فذلك جائزٌ له» ـ أي المكرَه ـ «بغير خلاف» ـ هذا حكايةٌ للإجماع:"], [3168.4, "بغير خلاف ـ «على شرط أن يلفظ وقلبه منشرحٌ بالإيمان، فإن ساعد قلبُه في الكفر لسانَه» ـ يعني:"], [3181.5, "صار الكفر من وين الحين؟"], [3184.0, "ـ «فإن ساعد قلبُه في الكفر لسانَه كان آثمًا كافرًا؛ لأنّ الإكراه لا سلطان له على الباطن، وإنما سلطانه على الظاهر»."], [3198.0, "انتهى كلامه رحمه الله."]], "tr": [[3157.0, "İbnü'l-Arabî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [3160.4, "\"Allah'ı inkâr etmeye gelince, bu ona\" —yani zorlanana— \"ihtilafsız caizdir\" —bu, icmânın naklidir:"], [3160.4, "\"ihtilafsız\"— \"Şu şartla ki kalbi imanla geniş olduğu hâlde (küfrü) telaffuz etsin."], [3168.4, "Eğer kalbi küfürde diline yardım ederse\" —yani küfür şimdi nereden oldu?— \"eğer kalbi küfürde diline yardım ederse günahkâr ve kâfir olur."], [3184.0, "Çünkü ikrahın bâtın üzerinde bir hâkimiyeti yoktur;"], [3184.0, "onun hâkimiyeti ancak zâhir üzerindedir.\" Sözü burada bitti; Allah ona rahmet etsin."]]}]}, {"ts": "53:20", "title": "8. Külliye (sonu): Günah büyüdükçe ikrahın sureti de büyümelidir", "paras": [{"reader": false, "ar": [[3200.0, "وأزيد ذلك إيضاحًا وأقول:"], [3204.0, "اعلموا ـ رحمكم الله تعالى ـ أنّ العلماء وإن اتّفقوا على أصل الإعذار بالإكراه ورفع التكليف به،"], [3212.0, "إلا أنهم يختلفون في نوع الإكراه فقط."], [3216.0, "ولذلك عندنا قاعدةٌ بأنه كلّما عظُمت صورةُ الذنب لا بدّ وأن تعظُم صورةُ الإكراه؛"], [3225.0, "بمعنى أنّ الإنسان لا ينبغي من أوائل الإكراه على كلمة الكفر أن يكفر،"], [3232.0, "بل لا بدّ أن تكون صورةُ الإكراه عظيمةً حتى يجوز له ذلك الذنب."]], "tr": [[3200.0, "Bunu daha da açıklayarak derim ki:"], [3204.0, "Bilin —Allah Teâlâ size rahmet etsin— âlimler ikrah ile mazur saymanın ve onunla teklifin kalkmasının aslında ittifak etmiş olsalar da sadece ikrahın türünde ihtilaf ederler."], [3216.0, "Bu yüzden elimizde şöyle bir kaide vardır:"], [3216.0, "Günahın sureti büyüdükçe ikrahın suretinin de büyümesi gerekir."], [3225.0, "Yani insanın küfür kelimesine zorlanmanın ilk aşamalarında küfretmesi uygun değildir;"], [3225.0, "bilakis o günahın kendisine caiz olması için ikrahın suretinin büyük olması gerekir."]]}, {"reader": false, "ar": [[3240.0, "ولكن لو أنّ الإنسان أُكره على طلاق زوجته،"], [3243.0, "فإنه وإن نطق بكلمة الطلاق قبل أن يُحبس،"], [3247.0, "وقبل أن يُضرب، وقبل أن يُنتف شعره،"], [3249.0, "وقبل أن تُضرب السياط ظهره،"], [3254.0, "فإنّ ذلك جائز. ولذلك خذوها منّي قاعدةً تجمع لكم كلام أهل العلم:"], [3260.0, "أنه كلّما عظُم الذنب ـ ها؟"], [3262.0, "ـ عظُمت صورة الإكراه، لا بدّ وأن تعظُم صورة الإكراه."]], "tr": [[3240.0, "Fakat insan hanımını boşamaya zorlanırsa, hapsedilmeden, dövülmeden, saçı yolunmadan ve sırtına kamçılar vurulmadan önce boşama kelimesini söylese bile bu caizdir."], [3254.0, "Bu yüzden âlimlerin sözünü sizin için bir araya getiren şu kaideyi benden alın:"], [3260.0, "Günah büyüdükçe —ha?— ikrahın sureti büyür;"], [3262.0, "ikrahın suretinin de büyümesi gerekir."]]}, {"reader": false, "ar": [[3269.0, "فلا نسوّي في تجويز الذنب بالإكراه على كلمة الطلاق كما نقوله في مسألة تجويز كلمة الكفر بسبب الإكراه؛"], [3282.0, "فلا بدّ أن تتفاوت الصورتان لتفاوت الذنبين."], [3286.0, "ولعلّ هذا واضحٌ إن شاء الله."]], "tr": [[3269.0, "Bu yüzden boşama kelimesine zorlanma ile günahın caiz olmasını, ikrah sebebiyle küfür kelimesinin caiz olması meselesinde söylediğimizle bir tutmayız;"], [3282.0, "iki günahın farklı olması sebebiyle iki suretin de farklı olması gerekir. Umarım bu inşallah açıktır."]]}]}, {"ts": "54:49", "title": "9. Külliye: Zaruri olarak bilinmeyen bir meselede geçerli bir te'vil ile küfre düşenin üzerine küfür vâki olmaz", "paras": [{"reader": false, "ar": [[3289.0, "ومن الكلّيّات أيضًا ـ ولا أدري عنها عندكم ـ تبونها ولّا؟"], [3293.5, "كم جلسنا؟ ـ خمسٍ وخمسين ـ:"], [3294.6, "<b>كلُّ من وقع في الكفر متأوِّلًا بتأويلٍ سائغٍ في غير معلومٍ من الدين بالضرورة فلا يقع الكفر عليه.<\/b>"]], "tr": [[3289.0, "Külliyelerden biri de şudur —sizdeki (numarasını) bilmiyorum— istiyor musunuz, yoksa?"], [3293.5, "Ne kadar oturduk? —Elli beş (dakika)—:"], [3294.6, "<b>9. külliye: Dinden zaruri olarak bilinmeyen bir meselede geçerli bir te'vil ile te'vil ederek küfre düşen kimsenin üzerine küfür vâki olmaz.<\/b>"]]}, {"reader": false, "ar": [[3296.6, "يلّا، بقي ضابطٌ ثاني <span class=\"q\">؟ 55:20<\/span>."], [3297.0, "كلُّ من وقع في الكفر متأوِّلًا بتأويلٍ سائغٍ في غير معلومٍ من الدين بالضرورة فلا يقع الكفر عليه."], [3308.0, "كلُّ من وقع في الكفر ـ في غير ـ انتبهوا لهالقيود ذي ـ في غير معلومٍ من الدين بالضرورة ـ فلا يقع الكفر عليه."]], "tr": [[3296.6, "Haydi, ikinci bir zâbıt kaldı <span class=\"q\">؟<\/span>."], [3296.6, "Dinden zaruri olarak bilinmeyen bir meselede geçerli bir te'vil ile te'vil ederek küfre düşen kimsenin üzerine küfür vâki olmaz."], [3297.0, "Küfre düşen kimse —bilinmeyen bir…— şu kayıtlara dikkat edin— dinden zaruri olarak bilinmeyen bir meselede (küfre düşen kimsenin) üzerine küfür vâki olmaz."]]}, {"reader": false, "ar": [[3351.0, "أقول وبالله التوفيق: ولا سيّما إذا كان قصدُه إصابةَ الحقّ ولكن أخطأه."], [3362.0, "وهذه من الكلّيّات المتّفق عليها بين أهل السنة والجماعة؛"], [3368.0, "فقد اتّفق أهل السنة والجماعة على أنّ التأويل السائغ الذي له وجهٌ في العلم واللغة العربية يُعتبر من موانع التكفير،"], [3379.0, "إذا كان سببُه القصورَ في فهم الأدلّة،"], [3383.0, "أو الاستنادَ إلى الشُّبه التي تصرف عن اتّباع الحقّ،"], [3388.0, "دون أن يتعمّد المخالفة أو يعاند بعد بيان الحقّ واتّضاحه."]], "tr": [[3351.0, "Tevfik Allah'tandır, derim ki: Özellikle de maksadı hakka isabet etmek olup ondan şaşmışsa."], [3362.0, "Bu, Ehl-i Sünnet ve'l-Cemaat arasında üzerinde ittifak edilen külliyelerdendir."], [3368.0, "Ehl-i Sünnet ve'l-Cemaat, ilimde ve Arap dilinde bir vechi bulunan geçerli te'vilin —sebebi delilleri anlamadaki eksiklik ya da hakka uymaktan alıkoyan şüphelere dayanmak olduğunda, kişi kasten muhalefet etmeden ya da hak açıklanıp belirginleştikten sonra inat etmeden— tekfir mânilerinden sayıldığında ittifak etmiştir."]]}, {"reader": false, "ar": [[3393.0, "ولذلك قال شيخ الإسلام ابن تيمية رحمه الله تعالى:"], [3402.0, "«وهكذا الأقوال التي يُكفَّر قائلها، قد يكون الرجل» ـ عدّوا الأعذار،"], [3409.5, "عدّوا الأعذار ـ «قد يكون الرجل لم تبلغه النصوص الموجبة لمعرفة الحقّ» ـ أي:"], [3415.2, "جاهل، ولّا لا؟ ـ «وقد تكون عنده ولم تثبت عنده، أو لم يتمكّن من فهمها، وقد يكون» ـ وهذا اللي يخصّنا ـ «وقد يكون قد عرضت له شبهاتٌ يعذره الله عز وجل بها."]], "tr": [[3393.0, "Bu yüzden Şeyhülislam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [3402.0, "\"Söyleyeni tekfir edilen sözler de böyledir."], [3402.0, "Kişi\" —mazeretleri sayın, mazeretleri sayın— \"kişiye hakkı bilmeyi gerektiren nasslar ulaşmamış olabilir\" —yani câhil, değil mi?— \"Ya da nasslar onda bulunur ama onun nezdinde sabit olmamıştır ya da onları anlama imkânı bulamamıştır."], [3415.2, "Ya da\" —bizi ilgilendiren de budur— \"ya da ona, Allah Azze ve Celle'nin kendisini onlarla mazur göreceği şüpheler ârız olmuştur."]]}, {"reader": false, "ar": [[3438.0, "فمن كان من المؤمنين مجتهدًا في طلب الحقّ وأخطأ فإنّ الله يغفر له خطأه كائنًا ما كان،"], [3448.0, "سواءٌ أكان في المسائل النظريّة» ـ العمليّة،"], [3451.8, "أي الفقهيّة ـ «أو في المسائل العلميّة» ـ العلميّة يعني العقائد ـ «هذا الذي عليه أصحاب النبيّ صلى الله عليه وسلم وجماهير أئمّة الإسلام»."]], "tr": [[3438.0, "Mü'minlerden kim hakkı aramada içtihat edip hata ederse, Allah onun hatasını —ne olursa olsun— bağışlar;"], [3448.0, "ister nazarî\" —amelî, yani fıkhî— \"meselelerde olsun, ister ilmî meselelerde\" —ilmî, yani akîdeler— \"Nebî ﷺ'in ashâbının ve İslam imamlarının cumhurunun üzerinde olduğu (görüş) budur.\""]]}, {"reader": false, "ar": [[3468.0, "قال شيخ الإسلام ابن تيمية رحمه الله تعالى أيضًا:"], [3474.0, "«إنّ المتأوِّل الذي قصد متابعة الرسول صلى الله عليه وسلم لا يُكفَّر، بل ولا يُفسَّق إذا اجتهد فأخطأ، وهذا مشهورٌ عند الناس في المسائل العمليّة» ـ هنا فاصلٌ شوي ـ «وأمّا مسائل العقائد فكثيرٌ من الناس كفّر المخطئين فيها» ـ وهذا القول،"], [3501.1, "أي تكفيره في المسائل العقديّة،"], [3504.0, "أي تكفير المتأوِّل في المسائل العقديّة،"], [3506.4, "يقول ابن تيمية عنه:"], [3508.0, "ـ «وهذا القول لا يُعرف عن أحدٍ من الصحابة والتابعين لهم بإحسان، ولا عن أحدٍ من أئمّة المسلمين، وإنما هو في الأصل من أقوال أهل البدع»."]], "tr": [[3468.0, "Şeyhülislam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— yine şöyle demiştir:"], [3474.0, "\"Resûl ﷺ'e uymayı kastetmiş olan müteevvil, içtihat edip hata ettiğinde tekfir edilmez, hatta tefsik bile edilmez."], [3474.0, "Bu, amelî meselelerde insanlar arasında meşhurdur.\" —Burada biraz ara (veriyorum)— \"Akîde meselelerine gelince, insanların çoğu onlarda hata edenleri tekfir etmiştir.\" —Bu söz, yani akîdevî meselelerde tekfir etmesi, yani akîdevî meselelerde müteevvili tekfir etmesi hakkında İbn Teymiyye şöyle diyor:— \"Bu söz ne sahâbeden ve onlara güzellikle tâbi olan tâbiîlerden birinden ne de Müslümanların imamlarından birinden bilinmektedir."], [3508.0, "Bu ancak aslında bid'at ehlinin sözlerindendir.\""]]}, {"reader": false, "ar": [[3520.0, "يا سلام على ابن تيمية!"], [3522.0, "انتهى كلامه. أنتم معي ولّا؟"], [3523.8, "أنتم تستشعرون هذه اللذّة ولّا؟"], [3525.7, "ها؟ والله إنها يطرب لها الواحد."], [3533.0, "أُعيدها مرةً أخرى: قال شيخ الإسلام ابن تيمية رحمه الله:"], [3538.0, "«إنّ المتأوِّل الذي قصد متابعة الرسول صلى الله عليه وسلم لا يُكفَّر، بل ولا يُفسَّق إذا اجتهد فأخطأ، وهذا مشهورٌ عند الناس في المسائل العمليّة»."]], "tr": [[3520.0, "Yâ selâm İbn Teymiyye'ye! Sözü burada bitti."], [3522.0, "Benimle misiniz, değil misiniz? Bu lezzeti hissediyor musunuz, yoksa?"], [3525.7, "Ha? Vallahi insan onunla coşar."], [3533.0, "Bir kez daha tekrarlıyorum: Şeyhülislam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [3538.0, "\"Resûl ﷺ'e uymayı kastetmiş olan müteevvil, içtihat edip hata ettiğinde tekfir edilmez, hatta tefsik bile edilmez."], [3538.0, "Bu, amelî meselelerde insanlar arasında meşhurdur.\""]]}, {"reader": false, "ar": [[3550.0, "ترى هذه طريقتي في قراءة أبي العبّاس ابن تيمية:"], [3555.0, "من لم يُكثر الفواصل والإشارة باليد عند كلام شيخ الإسلام ربما تمشي عليه المعلومات،"], [3560.8, "وهو ما يدري أنّ هذه أوّلها ولّا هذه آخرها."], [3565.0, "فأكثِر الفواصل، أكثِر الفواصل،"], [3567.7, "أكثِر الفواصل، وأشِر بيدك تقول:"], [3569.0, "وهم قسمان، الأوّل… <span class=\"q\">؟ 59:29<\/span> ـ لغة الإشارة."], [3577.0, "قال: «وأمّا مسائل العقائد فكثيرٌ من الناس كفّر المخطئين فيها، وهذا القول لا يُعرف عن أحدٍ من الصحابة والتابعين لهم بإحسان، ولا عن أحدٍ من أئمّة المسلمين، وإنما هو في الأصل من أقوال أهل البدع». انتهى كلامه."]], "tr": [[3550.0, "Bakın, bu benim Ebü'l-Abbâs İbn Teymiyye'yi okuma yöntemimdir:"], [3550.0, "Şeyhülislam'ın sözünü okurken araları ve elle işaret etmeyi çoğaltmayan kimsenin üzerinden bilgiler geçip gider de bunun başı mı sonu mu olduğunu bilmez."], [3560.8, "Bu yüzden araları çoğalt, araları çoğalt, araları çoğalt;"], [3567.7, "eline işaret ederek \"Onlar iki kısımdır:"], [3567.7, "Birincisi…\" de <span class=\"q\">؟<\/span> —işaret dili."], [3569.0, "(İbn Teymiyye) şöyle demiştir: \"Akîde meselelerine gelince, insanların çoğu onlarda hata edenleri tekfir etmiştir."], [3577.0, "Bu söz ne sahâbeden ve onlara güzellikle tâbi olan tâbiîlerden birinden ne de Müslümanların imamlarından birinden bilinmektedir."], [3577.0, "Bu ancak aslında bid'at ehlinin sözlerindendir.\" Sözü burada bitti."]]}]}, {"ts": "59:53", "title": "9. Külliye (devam): İbn Hacer, Aynî ve İbn Hazm'ın sözleri", "paras": [{"reader": false, "ar": [[3593.8, "وقال الإمام الحافظ ابن حجر رحمه الله تعالى:"], [3597.0, "«قال العلماء: كلُّ متأوِّلٍ يُعذر بتأويله، ليس بآثمٍ إذا كان تأويله سائغًا في لغة العرب، وكان له وجهٌ في العلم»."], [3610.0, "انتهى كلامه. وقال الإمام العينيّ رحمه الله تعالى:"], [3614.0, "«لا خلاف بين العلماء أنّ كلَّ متأوِّلٍ معذورٌ بتأويله، غيرُ ملومٍ فيه، إذا كان تأويله سائغًا في لسان العرب، أو كان له وجهٌ في العلم»."]], "tr": [[3593.8, "İmam Hâfız İbn Hacer —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [3597.0, "\"Âlimler şöyle demiştir: Her müteevvil te'viliyle mazur görülür;"], [3597.0, "te'vili Arap dilinde geçerli olduğunda ve ilimde bir vechi bulunduğunda günahkâr değildir.\" Sözü burada bitti."], [3610.0, "İmam Aynî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [3614.0, "\"Âlimler arasında şu hususta ihtilaf yoktur:"], [3614.0, "Her müteevvil, te'vili Arap dilinde geçerli olduğunda ya da ilimde bir vechi bulunduğunda te'viliyle mazurdur, onda kınanmaz.\""]]}, {"reader": false, "ar": [[3632.0, "وقال الإمام ابن حزم رحمه الله تعالى:"], [3636.0, "«من بلغه الأمر عن رسول الله صلى الله عليه وسلم من طريقٍ ثابتة، وهو مسلم، فتأوّل في خلافه إيّاه، أو ردّ ما بلغه بنصٍّ آخر» ـ يعني رأى أنه يعارضه نصٌّ آخر فردّ النصّ الأوّل ـ «فما لم تقم عليه الحجّة في خطئه في ترك ما ترك، وفي الأخذ بما أخذ، فهو مأجورٌ» ـ الحمد لله ـ «فهو مأجورٌ معذور، لقصده إلى الحقّ وجهله به. وإن قامت عليه الحجّة في ذلك فعاند فلا تأويل بعد قيام الحجّة»."]], "tr": [[3632.0, "İmam İbn Hazm —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [3636.0, "\"Resûlullah ﷺ'den bir emir kendisine sabit bir yolla ulaşan Müslüman kimse, ona muhalefetinde te'vile giderse ya da kendisine ulaşanı başka bir nasla reddederse\" —yani başka bir nassın onunla çeliştiğini düşünüp ilk nassı reddederse— \"terk ettiğini terk etmesindeki ve aldığını almasındaki hatası hakkında kendisine hüccet ikame edilmedikçe o, ecir alır\" —elhamdülillah— \"ecir alır ve mazurdur;"], [3636.0, "çünkü hakkı kastetmiş ve onu bilmemiştir."], [3636.0, "Eğer bu hususta kendisine hüccet ikame edilir de inat ederse, hüccet ikame edildikten sonra te'vil (mazereti) yoktur.\""]]}]}, {"ts": "1:01:14", "title": "9. Külliye (devam): Delil olarak iftirak hadisi ve Hâtıb kıssası", "paras": [{"reader": false, "ar": [[3674.0, "وممّا يُستدلّ به ـ بعد الإجماع ـ على هذه القاعدة:"], [3679.6, "حديثُ الافتراق، الذي هو حديثٌ صحيحٌ لغيره بمجموع طرقه؛"], [3685.9, "فإنّ جميع تلك الفرق التي حكم عليها النبيّ صلى الله عليه وسلم بأنها في النار لا تزال موصوفةً بأنها من أمّته،"], [3697.0, "أي أمّة الإجابة، ومع ذلك استحقّوا النار."], [3701.3, "فدخولهم للنار ليس دليلًا على أنهم كفّار،"], [3705.2, "وإنما هم متأوِّلون، ونحن إنما نريد استدفاع الكفر عنهم بالتأويل الذي وقعوا فيه."]], "tr": [[3674.0, "İcmâdan sonra bu kaideye delil getirilen şeylerden biri de iftirak (ayrılık) hadisidir;"], [3679.6, "o, yollarının toplamıyla sahîh li-ğayrihî bir hadistir."], [3685.9, "Nebî ﷺ'in ateşte olduklarına hükmettiği o fırkaların hepsi hâlâ onun ümmetinden, yani icâbet ümmetinden olmakla nitelenmektedir;"], [3697.0, "bununla birlikte ateşi hak etmişlerdir."], [3697.0, "Onların ateşe girmesi kâfir olduklarına delil değildir;"], [3705.2, "bilakis onlar müteevvildir. Biz de düştükleri te'vil sebebiyle küfrü onlardan savmak istiyoruz."]]}, {"reader": false, "ar": [[3712.1, "فوصفُ هذه الفرق ـ ولذلك قال صلى الله عليه وسلم:"], [3718.2, "«وستفترق أمّتي على ثلاثٍ وسبعين فرقة، كلُّها في النار» ـ كلُّها في النار لا لأنها كافرة،"], [3724.8, "وإنما لأنّ معها ما يوجب لها الوعيد،"], [3728.0, "لكنّ الذي نريد دفعه ـ استدفاعه ـ عنها هو الوصف بأنها كافرةٌ بتأويلها."], [3735.0, "وكلُّ تلك الفرق عندها شيءٌ من التأويل في العقائد بمختلف أبوابها،"], [3741.0, "فلمّا كان تأويلُهم لهذه العقائد ـ واعتقادُهم خلافَ الحقّ بسبب التأويل ـ لم يكن مخرجًا لهم عن الملّة بالكلّيّة،"], [3752.0, "دلّ ذلك على أنّ التأويل السائغ مانعٌ من موانع التكفير."]], "tr": [[3712.1, "Bu fırkaların nitelenmesi —bu yüzden Nebî ﷺ şöyle buyurmuştur:"], [3718.2, "\"Ümmetim yetmiş üç fırkaya ayrılacak;"], [3718.2, "hepsi ateştedir.\"— Hepsi ateştedir; kâfir oldukları için değil, kendilerinde va'îdi gerektiren bir şey bulunduğu için."], [3728.0, "Fakat onlardan savmak —savuşturmak— istediğimiz şey, te'villeri sebebiyle kâfir olarak nitelenmeleridir."], [3735.0, "O fırkaların hepsinde akîdelerin çeşitli bablarında bir miktar te'vil vardır."], [3741.0, "Bu akîdeleri te'vil etmeleri —ve te'vil sebebiyle hakkın aksine inanmaları— onları milletten tamamen çıkarmayınca, bu, geçerli te'vilin tekfir mânilerinden bir mâni olduğunu gösterdi."]]}, {"reader": false, "ar": [[3757.0, "ويدلّ عليه بخصوصه أيضًا:"], [3759.0, "حديث حاطب بن أبي بلتعة رضي الله عنه؛"], [3763.0, "فإنه ارتكب ذنبًا عظيمًا،"], [3765.8, "حكم عليه كثيرٌ من الفقهاء بالقتل،"], [3770.0, "فإنهم يقرّرون أنّ الجاسوس حكمه أن يُقتل."], [3775.0, "ولذلك لم يُنكر النبيّ صلى الله عليه وسلم على عمر لمّا قال:"], [3779.9, "«دعني أضرب عنق هذا المنافق»،"], [3782.0, "ولكن بيّن له ما يمنع من تطبيق هذا الحكم،"], [3787.0, "وهو قوله: «لعلّ الله اطّلع على أهل بدرٍ فقال: اعملوا ما شئتم فقد غفرتُ لكم»."]], "tr": [[3757.0, "Ona özel olarak Hâtıb b."], [3757.0, "Ebî Belta'a'nın —Allah ondan razı olsun— hadisi de delâlet eder."], [3763.0, "O büyük bir günah işledi;"], [3763.0, "fakihlerin birçoğu bu (günah) hakkında ölüm hükmü vermiştir;"], [3770.0, "çünkü casusun hükmünün öldürülmek olduğunu takrir ederler."], [3775.0, "Bu yüzden Nebî ﷺ, Ömer \"Bırak da şu münafığın boynunu vurayım\" dediğinde onu reddetmedi;"], [3779.9, "fakat ona bu hükmün uygulanmasına mâni olan şeyi açıkladı."], [3782.0, "O da şu sözüdür: \"Umulur ki Allah Bedir ehline muttali olup 'Dilediğinizi yapın, sizi bağışladım' demiştir.\""]]}, {"reader": false, "ar": [[3794.0, "فحاطبٌ إنما وقع فيما وقع فيه من هذا الذنب العظيم متأوِّلًا،"], [3799.0, "فلم يتعرّض له النبيّ صلى الله عليه وسلم بشيءٍ من ذلك،"], [3804.5, "وعذره. بل وأوضح من ذلك:"], [3807.8, "حديث الذي قال: «أحرقوني»،"], [3810.5, "وهو المذكور آنفًا؛ فإنه إنما فعل ما فعل متأوِّلًا بأنه بمثل هذه الصورة سيُعجز قدرةَ الله عز وجل عن جمعه وبعثه مرةً أخرى."]], "tr": [[3794.0, "Hâtıb bu büyük günahtan düştüğü şeye ancak te'vil ederek düşmüştü;"], [3794.0, "Nebî ﷺ de ona bunlardan hiçbir şeyle ilişmedi ve onu mazur gördü."], [3799.0, "Hatta bundan daha açığı, az önce zikredilen \"Beni yakın\" diyen adamın hadisidir."], [3810.5, "O yaptığını ancak, bu şekilde Allah Azze ve Celle'nin kudretini kendisini toplamaktan ve tekrar diriltmekten âciz bırakacağını te'vil ederek yapmıştı."]]}]}, {"ts": "1:03:45", "title": "9. Külliye (devam): Muâz'ın secdesi ve Kudâme b. Maz'ûn'un te'vili", "paras": [{"reader": false, "ar": [[3825.0, "بل وأوضح من ذلك أيضًا:"], [3826.5, "أنّ معاذًا رضي الله عنه ـ في الحديث الحسن ـ لمّا قدم من الشام سجد للنبيّ صلى الله عليه وسلم،"], [3835.0, "فقال: «ما هذا يا معاذ؟» قال:"], [3837.7, "أتيتُ الشام فوافقتُهم يسجدون لأساقفتهم وبطارقتهم،"], [3842.0, "فوددتُ في نفسي أن نفعل ذلك بك."], [3845.0, "فقال صلى الله عليه وسلم:"], [3848.6, "«فلا تفعلوا؛ فإني لو كنتُ آمرًا أحدًا أن يسجد لغير الله لأمرتُ المرأة أن تسجد لزوجها»."]], "tr": [[3825.0, "Hatta bundan da açığı şudur:"], [3825.0, "Muâz —Allah ondan razı olsun—, hasen hadiste (geldiğine göre), Şam'dan dönünce Nebî ﷺ'e secde etti."], [3826.5, "(Nebî ﷺ) \"Bu nedir ey Muâz?\" dedi."], [3835.0, "\"Şam'a gittim; onları piskoposlarına ve patriklerine secde ederken buldum."], [3837.7, "İçimden bunu sana yapmayı arzu ettim\" dedi."], [3842.0, "Bunun üzerine Nebî ﷺ şöyle buyurdu:"], [3845.0, "\"Böyle yapmayın; çünkü ben birine Allah'tan başkasına secde etmesini emredecek olsaydım, kadına kocasına secde etmesini emrederdim.\""]]}, {"reader": false, "ar": [[3857.0, "بل ويدلّ على ذلك أيضًا:"], [3860.2, "حديثُ استحلال قدامة بن مظعون للخمر؛"], [3864.0, "فإنه لمّا بلغ عمرَ أنّ قدامة قد شرب الخمر دعاه فقال:"], [3868.8, "لِمَ شربتَها وأنت من أصحاب محمّدٍ صلى الله عليه وسلم؟"], [3873.0, "قال: تأوّلتُ فيها قول الله عز وجل:"], [3876.2, "<span class=\"ayah\">﴿لَيْسَ عَلَى الَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ جُنَاحٌ فِيمَا طَعِمُوا إِذَا مَا اتَّقَوا وَّآمَنُوا وَعَمِلُوا الصَّالِحَاتِ ثُمَّ اتَّقَوا وَّآمَنُوا ثُمَّ اتَّقَوا وَّأَحْسَنُوا﴾<\/span> <span class=\"ref\">[المائدة: ٩٣]<\/span> <span class=\"note\">(Şeyh «إذا ما اتقوا وآمنوا» sonrasına «وأحسنوا ثم اتقوا» ekleyerek okuyor; mushaf lafzı yazıldı)<\/span>."], [3890.0, "فيقول: أنا من جملة المتّقين والمحسنين،"], [3892.6, "وممّن يعملون الصالحات، فلا جناح عليّ إذا طعمتُه."], [3896.0, "فأقام عليه الحدّ، لكنّ الشأن هنا أنه لم يكفّره بهذا الاستحلال."]], "tr": [[3857.0, "Hatta buna Kudâme b. Maz'ûn'un şarabı helal saymasına dair hadis de delâlet eder."], [3864.0, "Ömer'e Kudâme'nin şarap içtiği haberi ulaşınca onu çağırıp \"Muhammed ﷺ'in ashâbından olduğun hâlde onu niçin içtin?\" dedi."], [3873.0, "(Kudâme) dedi ki: \"Bu hususta Allah Azze ve Celle'nin şu sözünü te'vil ettim:"], [3876.2, "<span class=\"ayah\">﴿İman edip salih ameller işleyenlere, sakındıkları, iman ettikleri ve salih ameller işledikleri, sonra sakınıp iman ettikleri, sonra da sakınıp iyilik ettikleri takdirde, (önceden) yediklerinden dolayı bir günah yoktur﴾<\/span> [Mâide 93].\" Yani:"], [3876.2, "\"Ben muttakîlerden, muhsinlerden ve salih amel işleyenlerdenim;"], [3890.0, "bu yüzden onu yediğimde (içtiğimde) bana bir günah yoktur\" diyor."], [3892.6, "(Ömer) ona haddi uyguladı; fakat buradaki mesele şudur:"], [3896.0, "Onu bu helal sayma sebebiyle tekfir etmedi."]]}, {"reader": false, "ar": [[3901.0, "لأنه إنما استحلّها ـ إيش؟"], [3902.8, "ـ متأوِّلًا لا معاندًا، متأوِّلًا لا معاندًا."], [3906.0, "وقد نقل شيخ الإسلام ابن تيمية رحمه الله تعالى اتّفاقَ علماء الصحابة في عهد عمر على عدم تكفير قدامة رضي الله عنه،"], [3917.0, "ولا نعلم أحدًا من الأئمّة الأربعة خالفهم في ذلك."], [3922.0, "بل إنّ الإمام ابن قدامة رحمه الله في «المغني» احتجّ بقصّة قدامة المذكورة،"], [3928.0, "ولم يذكر خلافًا بين الأئمّة في عدم تكفير المتأوِّل الذي لم تقم عليه الحجّة."]], "tr": [[3901.0, "Çünkü o, onu ancak —ne olarak?— inat ederek değil te'vil ederek, inat ederek değil te'vil ederek helal saymıştı."], [3906.0, "Şeyhülislam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— Ömer döneminde sahâbe âlimlerinin Kudâme'yi —Allah ondan razı olsun— tekfir etmeme hususundaki ittifakını nakletmiştir."], [3917.0, "Dört imamdan hiçbirinin bu hususta onlara muhalefet ettiğini bilmiyoruz."], [3922.0, "Hatta İmam İbn Kudâme —Allah ona rahmet etsin— \"el-Muğnî\"de zikredilen Kudâme kıssasıyla delil getirmiş ve kendisine hüccet ikame edilmemiş müteevvili tekfir etmeme hususunda imamlar arasında bir ihtilaf zikretmemiştir."]]}]}, {"ts": "1:05:35", "title": "9. Külliye (devam): Hâricîler, Eş'arîler, Mâtürîdîler ve Küllâbiyye'nin tekfir edilmemesi", "paras": [{"reader": false, "ar": [[3935.0, "وبناءً على ذلك: فالقول الصحيح عدمُ تكفير الخوارج؛"], [3938.0, "لأنهم إنما فعلوا ما فعلوه من استحلال دماء المسلمين وأموالهم بماذا؟"], [3945.0, "بالتأويل. فالراجح الذي عليه جمهور أهل العلم أنّ الخوارج ليسوا كفّارًا،"], [3951.4, "مع ما فيهم من بدعةٍ شديدةٍ وضلالةٍ بعيدة."], [3955.0, "وأمّا أمرُ النبيّ صلى الله عليه وسلم بقتلهم فليس لكفرهم،"], [3959.5, "وإنما لدفع بغيهم وعاديتهم وضررهم وشرّهم عن الإسلام وأهله فقط."]], "tr": [[3935.0, "Buna göre doğru görüş Hâricîleri tekfir etmemektir."], [3935.0, "Çünkü onlar, Müslümanların kanlarını ve mallarını helal saymaktan yaptıklarını ne ile yaptılar?"], [3938.0, "Te'vil ile. İlim ehlinin cumhurunun üzerinde olduğu râcih görüş şudur:"], [3945.0, "Hâricîler —kendilerinde şiddetli bir bid'at ve derin bir sapıklık bulunmakla birlikte— kâfir değildir."], [3951.4, "Nebî ﷺ'in onları öldürmeyi emretmesine gelince;"], [3955.0, "bu, küfürlerinden dolayı değil, sadece onların azgınlığını, saldırganlığını, zararını ve şerrini İslam'dan ve ehlinden savmak içindir."]]}, {"reader": false, "ar": [[3964.0, "بل ونقول أيضًا: إنّ الأشاعرة والماتريديّة والكُلّابيّة كلّهم ـ وإن كانوا أهلَ بدعةٍ وضلال ـ إلا أنهم لا يخرجون إلى دائرة الكفر؛"], [3979.0, "لأنهم إنما وقعوا فيما وقعوا فيه متأوِّلين."], [3982.0, "فلذلك الأشاعرة ونحوُهم ممّن يسمّيهم أهل السنة والجماعة بالصفاتيّة،"], [3992.0, "لأنهم يُثبتون بعض الصفات؛"], [3994.1, "فالأشاعرة صفاتيّةٌ لأنهم يُثبتون سبعًا،"], [3997.9, "والماتريديّة صفاتيّة، والكلّابيّة صفاتيّة."], [4001.0, "فإذا قال ابن تيمية:"], [4002.5, "«وقال الصفاتيّة» يقصد بها هذه الفرق الثلاث."], [4005.0, "وذلك لأنهم إنما كانوا متأوِّلين."]], "tr": [[3964.0, "Hatta şunu da söyleriz: Eş'arîler, Mâtürîdîler ve Küllâbiyye'nin hepsi —bid'at ve sapıklık ehli olsalar da— küfür dairesine çıkmazlar;"], [3964.0, "çünkü düştükleri şeye ancak te'vil ederek düşmüşlerdir."], [3979.0, "Bu yüzden Eş'arîler ve benzerleri, Ehl-i Sünnet ve'l-Cemaat'in \"Sıfâtiyye\" diye adlandırdığı kimselerdendir;"], [3982.0, "çünkü bazı sıfatları isbat ederler."], [3992.0, "Eş'arîler Sıfâtiyye'dir, çünkü yedi (sıfat) isbat ederler;"], [3997.9, "Mâtürîdîler Sıfâtiyye'dir; Küllâbiyye Sıfâtiyye'dir. İbn Teymiyye \"Sıfâtiyye dedi ki\" dediğinde bununla bu üç fırkayı kasteder."], [4002.5, "Bu, onların ancak müteevvil olmaları sebebiyledir."]]}]}, {"ts": "1:06:52", "title": "9. Külliye (devam): Her te'vil mazeret midir? İki zâbıt", "paras": [{"reader": false, "ar": [[4012.0, "بقينا في مسألةٍ خطيرة،"], [4014.8, "وهي: هل كلُّ تأويلٍ يُعتبر عذرًا؟"], [4026.0, "الجواب: لقد ذكرتُ لك في الكلّيّة ضابطين عظيمين؛"], [4030.0, "فلا يُعتبر التأويل ـ بإجماع أهل السنة ـ عذرًا يرفع عن صاحبه التكفير إلا إذا توفّر فيه أمران:"], [4040.0, "الأمر الأوّل: أن يكون من التأويل الذي تسوّغه اللغة وتحتمله القرينة اللغويّة."]], "tr": [[4012.0, "Tehlikeli bir mesele kaldı: Her te'vil mazeret sayılır mı?"], [4014.8, "Cevap: Sana külliyede iki büyük zâbıt zikrettim."], [4026.0, "Te'vil —Ehl-i Sünnet'in icmâıyla— ancak onda iki şey bulunduğunda sahibinden tekfiri kaldıran bir mazeret sayılır:"], [4030.0, "Birinci şart: Dilin geçerli saydığı ve dilsel karinenin ihtimal verdiği te'vilden olmasıdır."]]}, {"reader": false, "ar": [[4050.0, "وأمّا إذا جاءنا الإنسان بتأويل شيءٍ من النصوص بما هو غريبٌ ـ الغرابةَ المطلقة ـ عن لغة العرب ولسانهم،"], [4061.1, "فإنّ هذا كافر؛ كما لو قال في قول الله عز وجل:"], [4066.8, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span>، قال:"], [4068.2, "ليس لله يدان، وإنما المراد بهما السماوات والأرض؛"], [4071.0, "فإنّ هذا تأويلٌ مرادفٌ للجحود والتكذيب والإنكار؛"], [4077.0, "لأنه لا يُعرف عن العرب أنها استعملت اليد في معنى السماوات والأرض."]], "tr": [[4050.0, "İnsan bize nasslardan birini Arap dilinden ve lisanından —mutlak bir yabancılıkla— yabancı olan bir şeyle te'vil ederek gelirse, bu kâfirdir."], [4061.1, "Mesela Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bilakis O'nun iki eli de açıktır﴾<\/span> [Mâide 64] sözü hakkında \"Allah'ın iki eli yoktur;"], [4068.2, "onlarla kastedilen gökler ve yerdir\" derse."], [4071.0, "Bu, inkâr, yalanlama ve reddin eş anlamlısı olan bir te'vildir;"], [4077.0, "çünkü Arapların eli gökler ve yer anlamında kullandığı bilinmemektedir."]]}, {"reader": false, "ar": [[4084.0, "لكن لو جاء وقال:"], [4085.7, "ليس لله يد، وإنما يُراد بها النعمة والقدرة،"], [4089.0, "فهنا أوّل بتأويلٍ سائغٍ في لغة العرب،"], [4094.0, "ولكونه تأويلًا سائغًا في لغة العرب فنعتبره شبهةً تدفع عنه التكفير؛"], [4101.2, "إذ لا تكفير مع وجود الشبهة،"], [4105.0, "فلا بدّ أن ندفع عنه حتى تُقام عليه الحجّة."]], "tr": [[4084.0, "Fakat gelip \"Allah'ın eli yoktur;"], [4085.7, "onunla nimet ve kudret kastedilir\" derse, burada Arap dilinde geçerli bir te'vil ile te'vil etmiştir."], [4089.0, "Arap dilinde geçerli bir te'vil olduğu için onu, ondan tekfiri savan bir şüphe sayarız;"], [4094.0, "çünkü şüphe varken tekfir yoktur."], [4101.2, "Bu yüzden kendisine hüccet ikame edilinceye kadar (tekfiri) ondan savmamız gerekir."]]}, {"reader": false, "ar": [[4109.0, "الثاني: ألّا يكون في معلومٍ من الدين بالضرورة،"], [4116.0, "ممّا كثرت أدلّته وتواترت،"], [4118.8, "وتوارثه أهل الإسلام خالفًا عن سالف؛"], [4123.0, "كما لو جاءنا أحدٌ يتأوّل الأدلّة المثبتة لوجود الله،"], [4128.0, "لا نقبل منه هذا التأويل،"], [4129.0, "أو يتأوّل الأدلّة المثبتة لوجود عالم الملائكة،"], [4133.0, "فإنّ هذا لا نقبل منه التأويل،"], [4135.0, "أو يتأوّل الصلاة بأنها ليست الصلاة الحركيّة،"], [4139.0, "وإنما معناها معرفة الأسرار،"], [4144.0, "كما تقوله القرامطة من الباطنيّة والإسماعيليّة؛"], [4149.0, "فهل هذا من التأويل الذي يُقبل؟ الجواب: لا."]], "tr": [[4109.0, "İkinci şart: Delilleri çok ve mütevatir olan, İslam ehlinin halef selef miras aldığı, dinden zaruri olarak bilinen bir şeyde olmamasıdır."], [4123.0, "Mesela biri gelip Allah'ın varlığını isbat eden delilleri te'vil etse, ondan bu te'vili kabul etmeyiz;"], [4129.0, "ya da melekler âleminin varlığını isbat eden delilleri te'vil etse, ondan bu te'vili kabul etmeyiz;"], [4135.0, "ya da namazı, hareketli namaz değil de anlamı sırları bilmektir diye te'vil etse —Bâtıniyye ve İsmâiliyye'den Karâmita'nın dediği gibi—."], [4149.0, "Bu kabul edilen te'vilden midir? Cevap: Hayır."]]}, {"reader": false, "ar": [[4152.0, "وكما تأوّلت الباطنيّة الإسماعيليّة القرمطيّة الصومَ بأنه كتمُ هذه الأسرار،"], [4161.0, "وكما تأوّلوا آيات الحجّ بأنها الحجّ إلى المشاهد والقبور التي يعظّمونها من دون الله عز وجل،"], [4171.0, "حتى قال قائلهم: إنّ حجّةً إلى قبر فلانٍ ـ ممّن يعظّمونه ـ أعظمُ عند الله من ألف حجّةٍ إلى بيت الله الحرام."]], "tr": [[4152.0, "Bâtınî, İsmâilî, Karmatî (fırkanın) orucu bu sırları gizlemek diye te'vil etmesi ve hac ayetlerini, Allah Azze ve Celle'yi bırakıp tazim ettikleri meşhedlere ve kabirlere hac diye te'vil etmeleri de böyledir."], [4161.0, "Hatta içlerinden biri şöyle demiştir:"], [4171.0, "\"Tazim ettikleri falancanın kabrine bir hac, Allah katında Beytullah'ı Haram'a bin hacdan daha büyüktür.\""]]}, {"reader": false, "ar": [[4178.0, "فالتأويلات المنقولة عن الباطنيّة ـ الذين يجعلون للنصوص ظاهرًا يفهمه الجميع،"], [4186.0, "وباطنًا لا يفهمه إلا خواصُّ خواصّهم ـ هذا لا يدخل في التأويل الذي معنا؛"], [4193.0, "لأنّ تأويلاتهم تقع على ماذا؟"], [4197.0, "على معلومٍ من الدين بالضرورة وصفُه ورسمُه."]], "tr": [[4178.0, "Nasslara herkesin anladığı bir zâhir ve ancak havâssının havâssının anladığı bir bâtın kılan Bâtıniyye'den nakledilen te'viller, bizim (bahsettiğimiz) te'vile girmez."], [4186.0, "Çünkü onların te'villeri neye yönelir?"], [4197.0, "Vasfı ve şekli dinden zaruri olarak bilinen şeye."]]}]}, {"ts": "1:10:02", "title": "9. Külliye (sonu) · 10. Külliye: Kasıtsız olarak küfre düşenin üzerine küfür vâki olmaz", "paras": [{"reader": false, "ar": [[4202.0, "فمتى ما توفّر في التأويل هذان الأمران ـ فكان تأويلًا ممّا يحتمله لسان العرب،"], [4208.0, "وكان في غير معلومٍ من الدين بالضرورة ممّا تواترت أدلّته واشترك الناس في العلم به ـ فإنه من التأويل الذي ينبغي أن ندفع التكفير به."]], "tr": [[4202.0, "Te'vilde bu iki şey bulunduğunda —Arap dilinin ihtimal verdiği bir te'vil olur ve delilleri mütevatir olup insanların bilgisinde ortak olduğu, dinden zaruri olarak bilinen şeylerden olmayan bir şeyde olursa— o, kendisiyle tekfiri savmamız gereken te'vildendir."]]}, {"reader": false, "ar": [[4220.0, "الكلّيّة العاشرة ـ إن سمحتمو لي ـ:"], [4224.0, "<b>كلُّ من وقع في الكفر عن غير قصدٍ فلا يقع الكفر عليه.<\/b> ترى هذه ضوابط التكفير المعيّن،"], [4229.7, "ليس كذلك؟ أنتم معي؟"], [4230.8, "ـ إيه ـ كلُّ من وقع في الكفر عن غير قصدٍ فلا يقع الكفر عليه."], [4239.0, "نأخذها بسرعة: كلُّ من وقع في الكفر عن غير قصدٍ فلا يقع الكفر عليه."]], "tr": [[4220.0, "<b>10. külliye<\/b> —izin verirseniz—: <b>Kasıtsız olarak küfre düşen kimsenin üzerine küfür vâki olmaz.<\/b> Bakın, bunlar muayyen tekfirinin zâbıtlarıdır, öyle değil mi?"], [4229.7, "Benimle misiniz? —Evet— Kasıtsız olarak küfre düşen kimsenin üzerine küfür vâki olmaz."], [4230.8, "Bunu hızlıca ele alalım: Kasıtsız olarak küfre düşen kimsenin üzerine küfür vâki olmaz."]]}, {"reader": false, "ar": [[4247.0, "أوّلًا: لا بدّ أن نفرّق بين عدم القصد في الوقوع في الكفر،"], [4255.0, "وعدم القصد إلى الوصول إلى الكفر مع الوقوع فيما يُكفِّر؛"], [4261.0, "فنحن نقصد الأوّلَ لا الثاني."], [4266.0, "بمعنى: أنّ الإنسان إذا أقدم على الفعل إقدامَ ـ انتبه ـ إقدامَ راغبٍ فيه،"], [4274.0, "إقدامَ مجوِّزٍ له، ولكن هو لا يدري أنه كفر،"], [4280.0, "فهذا نكفّره به إذا قامت عليه الحجّة."]], "tr": [[4247.0, "Önce: Küfre düşmede kastın olmaması ile tekfir eden şeye düştüğü hâlde küfre ulaşmayı kastetmemesi arasında ayrım yapmamız gerekir."], [4255.0, "Biz birinciyi kastediyoruz, ikinciyi değil."], [4261.0, "Yani insan bir fiile —dikkat et— ona istekli olan, onu caiz gören birinin girişmesi gibi girişirse, fakat onun küfür olduğunu bilmezse;"], [4274.0, "kendisine hüccet ikame edildiğinde bu kişiyi onunla tekfir ederiz."]]}, {"reader": false, "ar": [[4285.0, "لكن لو أنّ الإنسان أراد أن ينطق بكلمةٍ هي صوابٌ في ذاتها،"], [4292.0, "فسبق لسانُه وقال كلمة الكفر،"], [4295.0, "فهل يُعتبر قاصدًا لكلمة الكفر،"], [4299.0, "أو وقع فيها عن غير قصد؟"], [4301.0, "فهذا هو الذي نعنيه في هذه الكلّيّة."], [4305.0, "وإلا فإننا لا نعلم عن أحدٍ من أهل الإسلام أنه يقع في الكفر لإرادة الكفر."]], "tr": [[4285.0, "Fakat insan kendi zâtında doğru olan bir kelimeyi söylemek istese de dili sürçüp küfür kelimesini söylese, küfür kelimesini kastetmiş mi sayılır, yoksa ona kasıtsız mı düşmüştür?"], [4301.0, "İşte bu külliyede kastettiğimiz budur."], [4305.0, "Yoksa İslam ehlinden hiç kimsenin küfrü isteyerek küfre düştüğünü bilmiyoruz."]]}, {"reader": false, "ar": [[4313.0, "فلم يقع الخوارج ـ عفوًا ـ فلم يقع الباطنيّة فيما وقعوا فيه لإرادة الكفر،"], [4325.0, "وإنما ظنّوا أنه ليس بكفر."], [4328.0, "ولم يقع من وقع من الكفّار فيما هو كفرٌ في ذاته لإرادة كونه ـ لمحبّة الكفر في ذاته،"], [4339.0, "وإنما ظنّوا أنه طريقٌ لا يوصلهم إلى الكفر."]], "tr": [[4313.0, "Hâricîler —pardon— Bâtıniyye düştükleri şeye küfrü istedikleri için düşmediler;"], [4313.0, "bilakis onun küfür olmadığını zannettiler."], [4325.0, "Kâfirlerden (küfre) düşenler de zâtında küfür olan şeye, onun (küfür) olmasını istedikleri için —küfrü zâtı itibarıyla sevdikleri için— düşmediler;"], [4328.0, "bilakis onun kendilerini küfre ulaştırmayan bir yol olduğunu zannettiler."]]}, {"reader": false, "ar": [[4343.0, "فإذا قال أهل السنة والجماعة:"], [4345.7, "إنّ من شروط التكفير القصد،"], [4348.4, "ومن موانعه الخطأ، فلا يقصدون إلا من وقع في الكفر غيرَ قاصدٍ أن يقع فيه أصلًا،"], [4357.0, "باعتبار أصل الفعل. وأمّا من أقدم على الأمر بكامل اختياره،"], [4362.3, "لكن هو لا يظنّ أنه يوصله إلى الكفر،"], [4366.0, "فهذا نكفّره به، ولا كرامة له."]], "tr": [[4343.0, "Ehl-i Sünnet ve'l-Cemaat \"Tekfirin şartlarından biri kasıt, mânilerinden biri de hatadır\" dediğinde, bununla ancak fiilin aslı itibarıyla küfre hiç düşmeyi kastetmeden düşen kimseyi kastederler."], [4357.0, "İşe tam iradesiyle girişen, fakat onun kendisini küfre ulaştıracağını zannetmeyen kimseye gelince;"], [4362.3, "bu kişiyi onunla tekfir ederiz, onun için hiçbir itibar yoktur."]]}, {"reader": false, "ar": [[4369.0, "إذا علمتم هذا فاعلموا أنّ أهل السنة والجماعة قد أجمعوا على أنه يُشترط في القول المكفِّر أن يقصده القائل؛"], [4381.0, "بمعنى ألّا يكون ـ عفوًا ـ بمعنى ألّا يكون غافلًا أو جاهلًا أو ـ عفوًا ـ ألّا يكون غافلًا أو ناسيًا أو نائمًا،"], [4395.0, "فوقع في الأمر الموجب للتكفير عن غير قصده،"], [4401.0, "فإذا انتبه قال: أعوذ بالله،"], [4403.5, "والله ما قصدتُ هذا، وإنما قصدتُ هذا."]], "tr": [[4369.0, "Bunu bildiyseniz şunu da bilin:"], [4369.0, "Ehl-i Sünnet ve'l-Cemaat, tekfir eden sözde söyleyenin onu kastetmesinin şart olduğunda icmâ etmiştir."], [4381.0, "Yani —pardon— yani gafil ya da câhil ya da —pardon— gafil ya da unutan ya da uyuyan olup tekfiri gerektiren şeye kasıtsız düşmüş olmaması;"], [4395.0, "(böyle biri) uyanınca \"Allah'a sığınırım, vallahi bunu kastetmedim, şunu kastettim\" der."]]}, {"reader": false, "ar": [[4407.0, "قال الإمام أبو محمد ابن حزم رحمه الله في «الفصل»:"], [4413.0, "«كلُّ من نطق بالكلام الذي يُحكم لقائله بحكم الكفر عن غير قصدٍ فلا يُحكم عليه بمقتضاه»."], [4429.0, "انتهى. وقد بيّن شيخ الإسلام ابن تيمية في «الصارم المسلول» أنّ القصد المعتبر شرعًا في التكفير هو قصدُ الفعل المكفِّر،"], [4440.0, "لا قصدُ الكفر به،"], [4441.0, "فقال رحمه الله ـ انتبهوا ـ:"], [4444.0, "«فمن قال أو فعل ما هو كفرٌ كفر بذلك، وإن لم يقصد أن يكون كافرًا به؛ إذ لا يكاد يقصد الكفرَ أحدٌ إلا ما شاء الله». انتهى كلامه."]], "tr": [[4407.0, "İmam Ebû Muhammed İbn Hazm —Allah ona rahmet etsin— \"el-Fasl\"da şöyle demiştir:"], [4413.0, "\"Söyleyeni hakkında küfür hükmü verilen sözü kasıtsız olarak söyleyen herkes hakkında, onun gereğiyle hüküm verilmez.\" (Sözü) burada bitti."], [4429.0, "Şeyhülislam İbn Teymiyye \"es-Sârimü'l-Meslûl\"de, tekfirde şer'an itibar edilen kastın, tekfir eden fiili kastetmek olduğunu, onunla küfrü kastetmek olmadığını açıklamış ve —Allah ona rahmet etsin— —dikkat edin— şöyle demiştir:"], [4441.0, "\"Kim küfür olan bir şeyi söyler ya da yaparsa, onunla kâfir olmayı kastetmese bile onunla kâfir olur."], [4444.0, "Çünkü Allah'ın dilediği müstesna, neredeyse hiç kimse küfrü kastetmez.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[4462.0, "قلتُ: وأمّا من لم يقصد لفظ الكفر فلا يكفر؛"], [4466.0, "كمن سبق على لسانه بكلمة السبّ بدون قصدٍ لها،"], [4470.0, "لأنه لم يقصد السبّ،"], [4472.0, "أو وقع على لسانه كلمةُ الطلاق مثلًا وهو لا يقصد ـ وهو لا يقصد الطلاق ـ ونحو ذلك."], [4482.0, "وهذا واضح. فإن قلت:"], [4483.3, "وما دليلك؟ أقول: الدليل على ذلك:"], [4485.6, "الكتاب، والسنة، والإجماع. أمّا الإجماع فقد تقدّمت حكايته."]], "tr": [[4462.0, "Derim ki: Küfür lafzını kastetmeyen kimseye gelince;"], [4462.0, "o kâfir olmaz. Dili kasıtsız olarak sövme kelimesine sürçen kimse gibi;"], [4470.0, "çünkü o sövmeyi kastetmemiştir. Ya da mesela kastetmediği hâlde —boşamayı kastetmediği hâlde— diline boşama kelimesi gelen kimse ve benzerleri gibi."], [4482.0, "Bu açıktır. Şayet \"Delilin nedir?\" dersen, derim ki:"], [4485.6, "Bunun delili Kitap, Sünnet ve icmâdır."], [4485.6, "İcmâya gelince, onun nakli geçti."]]}, {"reader": false, "ar": [[4490.0, "وأمّا القرآن فقول الله عز وجل:"], [4493.0, "<span class=\"ayah\">﴿وَلَيْسَ عَلَيْكُمْ جُنَاحٌ فِيمَا أَخْطَأْتُم بِهِ وَلَٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْ﴾<\/span> <span class=\"ref\">[الأحزاب: ٥]<\/span>،"], [4499.0, "ويقول الله عز وجل:"], [4501.0, "<span class=\"ayah\">﴿لَا يُؤَاخِذُكُمُ اللَّهُ بِاللَّغْوِ فِي أَيْمَانِكُمْ وَلَٰكِن يُؤَاخِذُكُم بِمَا عَقَّدتُّمُ الْأَيْمَانَ﴾<\/span> <span class=\"ref\">[المائدة: ٨٩]<\/span>،"], [4508.0, "ويمينُ اللغو هي اليمين التي ـ إيش؟"], [4510.7, "ـ تجري على اللسان بلا قصد الجَنان."]], "tr": [[4490.0, "Kur'an'a gelince, Allah Azze ve Celle'nin şu sözüdür:"], [4493.0, "<span class=\"ayah\">﴿Yanıldığınız şeyde size bir günah yoktur; fakat kalplerinizin kastettiği (şeyde günah vardır)﴾<\/span> [Ahzâb 5]."], [4499.0, "Allah Azze ve Celle şöyle buyurur:"], [4501.0, "<span class=\"ayah\">﴿Allah sizi yeminlerinizdeki lağv (kasıtsız söz) sebebiyle sorumlu tutmaz; fakat bağladığınız yeminler sebebiyle sizi sorumlu tutar﴾<\/span> [Mâide 89]."], [4508.0, "Lağv yemini, —nedir?— kalbin kastı olmadan dilde akıp giden yemindir."]]}, {"reader": false, "ar": [[4514.0, "ويقول الله عز وجل:"], [4516.0, "<span class=\"ayah\">﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا﴾<\/span> <span class=\"ref\">[البقرة: ٢٨٦]<\/span>،"], [4525.0, "والخطأ هو الشيء الذي لا يكون مقصودًا في ذاته."], [4531.0, "ويدلّ عليها أيضًا ما في الصحيحين من حديث أنسٍ المذكور آنفًا،"], [4535.0, "في قصّة الرجل الذي قال:"], [4537.5, "«اللهمّ أنت عبدي وأنا ربّك»،"], [4540.0, "قال: «أخطأ من شدّة الفرح»."]], "tr": [[4514.0, "Allah Azze ve Celle şöyle buyurur:"], [4516.0, "<span class=\"ayah\">﴿Allah hiçbir nefse gücünün yeteceğinden fazlasını yüklemez. Kazandığı (hayır) onun lehine, kazandığı (şer) onun aleyhinedir. Rabbimiz! Unutur ya da yanılırsak bizi sorumlu tutma﴾<\/span> [Bakara 286]."], [4516.0, "Hata, zâtında kastedilmemiş olan şeydir."], [4525.0, "Buna, Sahîhayn'da az önce zikredilen Enes hadisi de delâlet eder:"], [4531.0, "\"Allah'ım! Sen benim kulumsun, ben de senin Rabbinim\" diyen adamın kıssasında (Nebî ﷺ) \"Sevincinin şiddetinden yanıldı\" buyurmuştur."]]}]}, {"ts": "1:15:43", "title": "Dersin kapanışı", "paras": [{"reader": false, "ar": [[4543.0, "لعلّنا نكتفي بهذا القدر،"], [4544.7, "ونكمل إن شاء الله بقيّة الضوابط الدرسَ القادم."], [4548.0, "والله أعلى وأعلم، وصلى الله وسلم على نبيّنا محمّدٍ وعلى آله وصحبه أجمعين."]], "tr": [[4543.0, "Belki bu kadarıyla yetiniriz; inşallah zâbıtların geri kalanını gelecek derste tamamlarız."], [4544.7, "Allah en yüce olandır ve en iyisini bilendir."], [4548.0, "Allah, Peygamberimiz Muhammed'e, âline ve ashâbının tamamına salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
