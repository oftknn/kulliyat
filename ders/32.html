<script>
const D={"no": 32, "vid": "BTV-NUL3B2Y", "title_ar": "الدرس (٣٢) من شرح كليات العقيدة — ختام كليات البدع وبداية كليات التكفير", "title_tr": "Şerhu Külliyyâti'l-Akîde — 32. Ders: Bid'at Külliyelerinin Sonu ve Tekfir Külliyeleri (Bid'at Ehline Tazim, Bid'atin Sünneti Öldürmesi, Yakînen Sabit İslam, Nassın Küfür Saymadığı Günah, Küçük ve Büyük Vasıflar, Muayyenin Tekfiri, Ehliyet, İkrah, Te'vil, Kasıt)", "sections": [{"ts": "00:00", "title": "1. Külliye: Bid'at ehline, menşelerinin aslı itibarıyla tazim göstermenin her türlüsü yasaktır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.3, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.7, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.6, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [12.0, "عندنا في هذا الدرس عشرُ كلّيّات."], [15.9, "الكلّيّة الأولى: <b>كلُّ مظهرٍ من مظاهر توقير أهل البدع في أصل منطلقاتهم فممنوعٌ شرعًا.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرةً ثالثة:"], [33.8, "كلُّ مظهرٍ من مظاهر توقير أهل البدع في أصل منطلقاتهم فممنوعٌ شرعًا."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [0.0, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [8.6, "Bu derste on külliyemiz var."], [12.0, "<b>1. külliye: Bid'at ehline, (bid'atleri) menşelerinin aslından kaynaklanması itibarıyla tevkîr (saygı ve tazim) göstermenin her türlü tezahürü şer'an yasaktır.<\/b> Üçüncü kez tekrarlıyorum:"], [15.9, "Bid'at ehline, menşelerinin aslı itibarıyla tevkîr göstermenin her türlü tezahürü şer'an yasaktır."]]}, {"reader": false, "ar": [[41.0, "ومن المعلوم ـ أيها الأحبّة ـ أنّ السلف متّفقون على حرمة توقير أهل البدع،"], [49.0, "وعلى أنه يجب على الإنسان ألّا يظهر منه شيءٌ من الأفعال التي تُنبئ عن تعظيمهم،"], [58.1, "أو إجلالهم، أو رفع منزلتهم،"], [61.0, "أو أيِّ شيءٍ يُنبئ عن توقيرهم؛"], [64.0, "فإنّ التوقير معناه: التعظيم والإجلال والاحترام."], [67.0, "فأهل السنة ـ رحمهم الله تعالى ـ جعلوا توقير أهل البدع من الأمور المحرّمة،"], [73.0, "وهذا باتّفاق أهل السنة والجماعة."]], "tr": [[41.0, "Ey sevgili kardeşler, bilinen bir husustur ki selef, bid'at ehline tevkîr göstermenin haram olduğunda ve insandan onlara tazim, hürmet, onların mertebesini yükseltme ya da onlara tevkîr gösterdiğini haber veren herhangi bir fiilin zâhir olmaması gerektiğinde ittifak etmiştir."], [64.0, "Çünkü tevkîr; tazim, hürmet ve saygı demektir."], [64.0, "Ehl-i Sünnet —Allah Teâlâ onlara rahmet etsin— bid'at ehline tevkîr göstermeyi haram işlerden saymıştır;"], [67.0, "bu, Ehl-i Sünnet ve'l-Cemaat'in ittifakıyladır."]]}, {"reader": false, "ar": [[77.0, "حتى قال الإمام الفُضيل بن عياض رحمه الله تعالى:"], [81.1, "«من وقّر صاحبَ بدعةٍ فقد أعان على هدم الإسلام»."], [86.0, "فمن وقّر أهل البدع،"], [88.7, "وعظّمهم، ورفع منزلتهم، وزكّى مذهبهم،"], [92.2, "وأثنى على دعوتهم، فهو مبتدعٌ مثلُهم،"], [99.0, "ومشاركٌ لهم في نقض السنة وإبطال التوحيد وتحريف الأدلة،"], [106.0, "بل إننا نخشى عليه أن يكون في منزلتهم في الآخرة إذا لم يتب ويرجع عن هذا الأمر."]], "tr": [[77.0, "Hatta İmam Fudayl b. Iyâd —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [81.1, "\"Bir bid'at sahibine tevkîr gösteren, İslam'ın yıkılmasına yardım etmiş olur.\" Bid'at ehline tevkîr gösteren, onları tazim eden, mertebelerini yükselten, mezheplerini tezkiye eden ve davetlerini öven kimse onlar gibi bid'atçidir;"], [99.0, "sünneti bozmada, tevhidi iptal etmede ve delilleri tahrif etmede onlara ortaktır."], [106.0, "Hatta bu işten tövbe edip dönmezse ahirette onların mertebesinde olmasından korkarız."]]}, {"reader": false, "ar": [[115.0, "إلا أنه لا بدّ من الانتباه في كلمةٍ في الكلّيّة حتى تُخرج بعضَ من يُنسب إلى البدع،"], [126.0, "وهي قولنا: «في أصل منطلقاتهم»."], [130.0, "وذلك أنّ المبتدع قد يكون مبتدعًا في أصل منطلقاته وتفاصيل منهجيّته،"], [137.0, "وهذا هو الذي يعنيه أهل السنة والجماعة في حرمة توقيره."], [143.0, "فمتى ما قال أهل السنة:"], [145.0, "لا يجوز توقير أهل البدع،"], [147.0, "فإنما يقصدون بهم أهلَ البدع الذين هم من أهلها باعتبار فساد منهجهم،"], [154.3, "وفساد أصولهم وقواعدهم، كالجهم بن صفوان،"], [158.9, "أو بشرٍ المريسيّ، أو واصل بن عطاء،"], [163.4, "أو غيرهم من رؤوس أهل البدع الذين بدعتُهم إنما نشأت عن فساد أصولهم وفساد منطلقاتهم."]], "tr": [[115.0, "Ancak külliyedeki bir kelimeye dikkat etmek gerekir;"], [115.0, "(bu kelime) bid'ate nispet edilen bazı kimseleri (hükmün) dışında bırakır."], [126.0, "O da \"menşelerinin aslında\" sözümüzdür."], [130.0, "Şöyle ki: Bid'atçi, menşelerinin aslında ve metodunun ayrıntılarında bid'atçi olabilir;"], [137.0, "Ehl-i Sünnet ve'l-Cemaat'in, kendisine tevkîr göstermenin haram olduğunu söylerken kastettiği kişi budur."], [145.0, "Ehl-i Sünnet \"Bid'at ehline tevkîr göstermek caiz değildir\" dediğinde, bununla ancak metotlarının, usûllerinin ve kaidelerinin bozukluğu itibarıyla bid'at ehlinden olan kimseleri kastederler."], [158.9, "Cehm b. Safvân, Bişr el-Merîsî, Vâsıl b."], [163.4, "Atâ ya da bid'atleri ancak usûllerinin ve menşelerinin bozukluğundan doğmuş diğer bid'at elebaşları gibi."]]}, {"reader": false, "ar": [[173.0, "وأمّا من كانت منطلقاته حديثيّةً وسنّيّةً وسلفيّة،"], [177.2, "ولكن وقع في شيءٍ من البدع في طريقه،"], [182.0, "لا عن منهجيّةٍ فاسدة،"], [184.4, "ولا عن منطلقاتٍ مخالفةٍ للكتاب والسنة،"], [188.0, "فإنّ هذا يُوقَّر بما معه من سلامة المنطلقات،"], [192.4, "ويُطلب له المعاذير، ولا يُتكلَّم عن ذاته،"], [195.5, "مع وجوب ردِّ ما جاء به من المخالفات الشرعية."]], "tr": [[173.0, "Menşeleri hadise, sünnete ve selefe dayanan, fakat yolunda —bozuk bir metottan ya da Kitap ve Sünnet'e aykırı menşelerden dolayı değil de— bir bid'ate düşen kimseye gelince;"], [184.4, "bu kişiye, sahip olduğu menşe sağlamlığı ölçüsünde tevkîr gösterilir, onun için mazeretler aranır ve şahsı hakkında konuşulmaz;"], [192.4, "bununla birlikte getirdiği şer'î aykırılıkları reddetmek vaciptir."]]}, {"reader": false, "ar": [[199.0, "وبناءً على ذلك: فلا يجوز لنا أن يصدُر منّا أيُّ فعلٍ يتضمّن الثناء على أهل البدع،"], [208.0, "أو يتضمّن تزكيتهم، أو الدلالةَ على مصنّفاتهم؛"], [215.0, "فإنّ ذلك من الغشّ للمسلمين."], [218.0, "ولقد كان الإمام الشافعيّ رحمه الله تعالى شديدًا على أهل الإلحاد وأهل البدع،"], [226.0, "وكان مجاهرًا ببغضهم وهجرهم."], [229.0, "وقال الإمام أحمد رحمه الله تعالى:"], [232.2, "«إذا سلّم الرجل على المبتدع فهو يحبّه»."], [236.0, "فيدلّ كلامه على أنه لا يجوز موادّةُ أهل البدع،"], [242.0, "ولا إظهارُ فضلهم، ولا الثناءُ عليهم."]], "tr": [[199.0, "Buna göre bizden bid'at ehlini övmeyi, onları tezkiye etmeyi ya da eserlerini tavsiye etmeyi içeren herhangi bir fiilin sâdır olması caiz değildir;"], [208.0, "çünkü bu, Müslümanları aldatmaktır. İmam Şâfiî —Allah Teâlâ ona rahmet etsin— ilhad ehline ve bid'at ehline karşı çok sertti;"], [218.0, "onlara buğzunu ve onlardan uzak durduğunu açıkça ortaya koyardı."], [226.0, "İmam Ahmed —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [229.0, "\"Kişi bid'atçiye selam verirse, onu seviyor demektir.\" Onun sözü, bid'at ehline muhabbet beslemenin, faziletlerini ortaya koymanın ve onları övmenin caiz olmadığını gösterir."]]}, {"reader": false, "ar": [[247.0, "وقال الإمام ابن المبارك رحمه الله تعالى:"], [251.0, "«اللهمّ لا تجعل لصاحب بدعةٍ عندي يدًا فيحبَّه قلبي»،"], [257.0, "كما رواه الإمام اللالكائيّ في «شرح أصول اعتقاد أهل السنة»."], [264.0, "وقال الإمام أحمد رحمه الله تعالى:"], [267.0, "«أهل البدع لا ينبغي لأحدٍ أن يجالسهم، ولا يخالطهم، ولا يأنس بهم»."], [275.0, "وقال أيضًا رحمه الله تعالى:"], [278.0, "«ولا تشاور صاحبَ بدعةٍ في دينك، ولا ترافقه في سفرك»."]], "tr": [[247.0, "İmam İbnü'l-Mübârek —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [251.0, "\"Allah'ım! Bir bid'at sahibinin üzerimde bir iyiliği olmasın ki kalbim onu sevmesin.\" Bunu İmam Lâlekâî \"Şerhu Usûli İ'tikâdi Ehli's-Sünne\"de rivayet etmiştir."], [257.0, "İmam Ahmed —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [264.0, "\"Bid'at ehli; kimsenin onlarla oturması, onlarla karışması ve onlarla ünsiyet kurması uygun değildir.\" Yine —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [278.0, "\"Dininde bir bid'at sahibine danışma, yolculuğunda ona arkadaşlık etme.\""]]}, {"reader": false, "ar": [[283.0, "وقال الإمام سفيان الثوريّ رحمه الله تعالى:"], [288.0, "«من جالس صاحبَ بدعةٍ لم يسلم من إحدى ثلاث: إمّا أن يكون فتنةً لغيره» ـ فإنّ الناس إذا رأوه يجلس مع صاحب البدعة فإنّ ذلك ممّا يُعين على نشر مذهب صاحب البدعة ـ «وإمّا أن يقع في قلبه شيءٌ فيزلَّ به فيُدخلَه الله النار به، وإمّا أن يقول: والله ما أُبالي ما تكلّموا، وإني واثقٌ بنفسي؛ فمن أمِن اللهَ على دينه طرفةَ عينٍ سلبه إيّاه»."], [331.0, "بمعنى: أنّ الإنسان متى ما جلس مع صاحب البدعة فإنه لا بدّ وأن يُصاب بشيءٍ من ـ واحدةٍ من هذه العِلَل."]], "tr": [[283.0, "İmam Süfyân es-Sevrî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [288.0, "\"Bir bid'at sahibiyle oturan kimse üç şeyden birinden kurtulamaz:"], [288.0, "Ya başkası için fitne olur\" —çünkü insanlar onu bid'at sahibiyle otururken gördüklerinde bu, bid'at sahibinin mezhebinin yayılmasına yardım eden şeylerdendir— \"ya kalbine bir şey düşer de onunla kayar ve Allah onu bu yüzden ateşe sokar;"], [288.0, "ya da 'Vallahi onların ne konuştuklarına aldırmam, ben kendime güveniyorum' der."], [288.0, "Kim dini hususunda göz açıp kapayıncaya kadar bile Allah'tan emin olursa, (Allah) onu ondan alır.\" Yani insan bid'at sahibiyle oturduğunda bu illetlerden birine mutlaka uğrar."]]}]}, {"ts": "05:39", "title": "1. Külliye (devam): Selefin bid'at ehlinden sakındırması ve Şâtıbî'nin zikrettiği iki mefsedet", "paras": [{"reader": false, "ar": [[339.0, "وقال الإمام ابن قدامة رحمه الله تعالى:"], [342.9, "«وكان السلف ينهون عن مجالسة أهل البدع، والنظر في كتبهم، والاستماع لكلامهم»."], [350.0, "كلُّ ذلك من باب قطع توقير أهل البدع."], [354.0, "ويوضّح الإمام عالمُ المقاصد والأصول،"], [357.5, "الإمام الشاطبيّ رحمه الله تعالى،"], [362.0, "شيئًا من مفاسد توقير رؤوس البدعة ـ وانتبهوا لكلمة «رؤوس البدعة» ـ فيقول رحمه الله تعالى:"], [372.0, "«فإنّ توقير صاحب البدعة مظنّةٌ لمفسدتين تعودان بالهدم على الإسلام: الأولى: التفاتُ الجهّال والعامّة إلى ذلك التوقير»."]], "tr": [[339.0, "İmam İbn Kudâme —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [342.9, "\"Selef, bid'at ehliyle oturmayı, kitaplarına bakmayı ve sözlerini dinlemeyi yasaklardı.\" Bütün bunlar bid'at ehline tevkîri kesip atma kabîlindendir."], [354.0, "Makâsıd ve usûl âlimi İmam Şâtıbî —Allah Teâlâ ona rahmet etsin— bid'at elebaşlarına tevkîr göstermenin mefsedetlerinden bir kısmını açıklar —\"bid'at elebaşları\" kelimesine dikkat edin— ve —Allah Teâlâ ona rahmet etsin— şöyle der:"], [372.0, "\"Bid'at sahibine tevkîr göstermek, İslam'ı yıkmaya varan iki mefsedetin muhtemel kaynağıdır:"], [372.0, "Birincisi: Cahillerin ve avamın o tevkîre yönelmesidir.\""]]}, {"reader": false, "ar": [[385.0, "فإذا رآك الناس موقِّرًا لصاحب البدعة فإنك تلفت قلوب الناس إليه."], [394.0, "وإنّ ممّا ضلّ به بعضُ تلامذة الإمام الدارقطنيّ أنه لمّا رأى الباقلّانيَّ داخلًا قام وقبّل رأسه،"], [407.0, "فصار فتنةً لكثيرٍ من طلابه أن جلسوا عند الباقلّانيّ،"], [415.0, "وصار سببًا لضلالهم في عقيدتهم."]], "tr": [[385.0, "İnsanlar seni bid'at sahibine tevkîr gösterirken gördüklerinde, insanların kalplerini ona çevirirsin."], [394.0, "İmam Dârekutnî'nin bazı talebelerinin sapmasına sebep olan şeylerden biri şudur:"], [394.0, "O, Bâkıllânî'nin içeri girdiğini görünce ayağa kalkıp başını öptü."], [394.0, "Bu, talebelerinin birçoğu için Bâkıllânî'nin yanında oturmalarına yol açan bir fitne oldu ve akîdelerinde sapmalarına sebep oldu."]]}, {"reader": false, "ar": [[417.0, "قال: «أحدهما: التفات الجهّال والعامّة إلى ذلك التوقير، فيعتقدون في المبتدع أنه أفضلُ الناس، وأنّ ما هو عليه خيرٌ ممّا عليه غيره، فيؤدّي ذلك إلى اتّباعه على بدعته دون اتّباع أهل السنة على سنّتهم. والثانية: أنه إذا وُقِّر من أجل بدعته صار ذلك كالحادي المحرِّض له على إنشاء بدعةٍ ثانية»، وبهذا ينهدم الإسلام."]], "tr": [[417.0, "(Şâtıbî) şöyle demiştir: \"Bunlardan biri:"], [417.0, "Cahillerin ve avamın o tevkîre yönelmesidir."], [417.0, "Böylece bid'atçinin insanların en faziletlisi olduğuna ve onun üzerinde bulunduğu şeyin başkalarının üzerinde bulunduğundan daha hayırlı olduğuna inanırlar."], [417.0, "Bu da Ehl-i Sünnet'e sünnetleri üzere uyulması yerine ona bid'ati üzere uyulmasına götürür."], [417.0, "İkincisi: Bid'ati sebebiyle ona tevkîr gösterildiğinde bu, onu ikinci bir bid'at çıkarmaya teşvik eden bir hudâcı (deveyi sürmek için türkü söyleyen) gibi olur.\" İşte bununla İslam yıkılır."]]}, {"reader": false, "ar": [[460.0, "والخلاصة من هذه الكلّيّة:"], [461.8, "أنه لا يجوز لأهل السنة أن يصدر منهم أيُّ فعلٍ يتضمّن توقير أهل البدع:"], [468.0, "لا مجالستُهم، ولا مضاحكتُهم،"], [470.7, "ولا محبّتُهم، ولا موادّتُهم،"], [473.3, "ولا شراءُ مؤلّفاتهم، ولا الدلالةُ على مؤلّفاتهم،"], [478.0, "ولا القيامُ لهم في المجالس،"], [481.3, "ولا إجلاسُهم في رؤوسها،"], [484.0, "ولا بداءتُهم بالسلام. ولكن لا بدّ وأن يكون ذلك مخصوصًا بمن منطلقاتُه أصلًا بدعيّة."], [492.4, "ولعلّكم فهمتم الفرقان بين هؤلاء وهؤلاء. والله أعلم."]], "tr": [[460.0, "Bu külliyeden çıkan sonuç şudur:"], [460.0, "Ehl-i Sünnet'ten bid'at ehline tevkîr göstermeyi içeren herhangi bir fiilin sâdır olması caiz değildir:"], [461.8, "Ne onlarla oturmak, ne onlarla şakalaşıp gülüşmek, ne onları sevmek, ne onlara muhabbet beslemek, ne eserlerini satın almak, ne eserlerini tavsiye etmek, ne meclislerde onlar için ayağa kalkmak, ne onları meclislerin başköşesine oturtmak, ne de onlara selamla başlamak."], [484.0, "Fakat bunun, menşeleri aslen bid'atî olan kimseye mahsus olması gerekir."], [484.0, "Umarım bu iki grup arasındaki farkı anlamışsınızdır. Allah en iyisini bilir."]]}]}, {"ts": "08:17", "title": "2. Külliye: Bir bid'ati ihya etmeye çalışan, bir sünneti öldürmeye çalışmaktadır", "paras": [{"reader": false, "ar": [[497.0, "الكلّيّة الثانية: <b>كلُّ من يسعى في إحياء بدعةٍ فهو ساعٍ في إماتة سنّة.<\/b> كلُّ من يسعى في إحياء بدعةٍ فساعٍ في إماتة سنّة."], [517.0, "أقول وبالله التوفيق: وهذا يقتضي أنّ السنن تموت إذا أُحييت البدع؛"], [526.0, "فهما ضدّان لا يجتمعان:"], [528.0, "فإذا أحييتَ السننَ أمتَّ البدع،"], [532.0, "وإذا أحييتَ البدعَ أمتَّ السنن."], [536.0, "وعلى ذلك دلّ النقل عن السلف رحمهم الله تعالى."]], "tr": [[497.0, "<b>2. külliye: Bir bid'ati ihya etmeye çalışan herkes, bir sünneti öldürmeye çalışmaktadır.<\/b> Bir bid'ati ihya etmeye çalışan herkes, bir sünneti öldürmeye çalışmaktadır."], [497.0, "Tevfik Allah'tandır, derim ki: Bu, bid'atler ihya edildiğinde sünnetlerin öleceğini gerektirir."], [517.0, "Bunlar bir araya gelmeyen iki zıttır:"], [526.0, "Sünnetleri ihya edersen bid'atleri öldürürsün;"], [528.0, "bid'atleri ihya edersen sünnetleri öldürürsün."], [532.0, "Selefin —Allah Teâlâ onlara rahmet etsin— nakilleri de buna delâlet eder."]]}, {"reader": false, "ar": [[542.0, "وذلك لأنّ من لوازم العمل بالباطل تركَ العمل بالحق،"], [547.0, "ومتى ما تشرّب القلبُ محبّةَ البدع فإنّ الله يُخرج منه محبّةَ السنة."], [554.0, "ولذلك جاء عن حذيفة رضي الله تعالى عنه أنه ضرب لأصحابه مثالًا على موت السنن إذا أُحييت البدع؛"], [566.0, "فثبت عنه أنه أخذ يومًا من الأيام أمام أصحابه حجرين،"], [571.0, "فوضع أحدهما على الآخر،"], [573.7, "ثم قال لأصحابه: «أترون نورًا بينهما؟» ـ بين الحجرين ـ يعني:"], [579.4, "هل ينفذ النور بين هذين الحجرين؟"], [582.0, "فقالوا: لا نرى شيئًا من النور بينهما."]], "tr": [[542.0, "Bu şundandır: Bâtılla amel etmenin lâzımlarından biri hakla ameli terk etmektir."], [547.0, "Kalp bid'atlerin sevgisini içine çektiğinde Allah ondan sünnet sevgisini çıkarır."], [547.0, "Bu yüzden Huzeyfe'den —Allah Teâlâ ondan razı olsun— rivayet edilmiştir ki o, ashâbına bid'atler ihya edildiğinde sünnetlerin ölmesine dair bir misal vermiştir."], [566.0, "Ondan sabit olduğuna göre, bir gün ashâbının önünde iki taş aldı, birini diğerinin üzerine koydu, sonra ashâbına \"Bu ikisinin arasında bir ışık görüyor musunuz?\" dedi —yani iki taşın arasında."], [573.7, "Yani: Bu iki taşın arasından ışık geçiyor mu?"], [579.4, "Onlar da \"İkisinin arasında hiçbir ışık görmüyoruz\" dediler."]]}, {"reader": false, "ar": [[587.0, "فقال رحمه الله تعالى:"], [589.8, "«والذي نفسي بيده لتظهرنّ البدع حتى لا يُرى من الحق إلا بقدر ما يُرى من النور بين هذين الحجرين. والله لتفشُوَنّ البدع حتى إذا تُرك منها شيءٌ قالوا: تُركت السنة»."]], "tr": [[587.0, "(Huzeyfe) —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [589.8, "\"Nefsim elinde olana yemin olsun ki bid'atler öyle ortaya çıkacak ki haktan ancak bu iki taşın arasından görünen ışık kadarı görünecek."], [589.8, "Vallahi bid'atler öyle yayılacak ki onlardan bir şey terk edildiğinde 'Sünnet terk edildi' diyecekler.\""]]}, {"reader": false, "ar": [[609.0, "وعن أبي إدريس الخولانيّ رحمه الله تعالى أنه كان يقول:"], [620.0, "«ما أحدثت أمّةٌ في دينها بدعةً إلا رفع الله بها عنهم سنّة»."], [629.0, "وعن حسّان بن عطيّة رحمه الله تعالى ـ كما عند الدارميّ وغيره ـ قال:"], [634.6, "«ما أحدث قومٌ بدعةً في دينهم إلا رفع الله من سنّتهم مثلَها، ثم لا يردّها عليهم إلى يوم القيامة»."], [646.0, "وعن بعض السلف رحمه الله تعالى أنه قال:"], [651.1, "«لا يُحدث رجلٌ في الإسلام بدعةً إلا ترك من السنة ما هو خيرٌ منها»."]], "tr": [[609.0, "Ebû İdrîs el-Havlânî'den —Allah Teâlâ ona rahmet etsin— rivayet edildiğine göre şöyle derdi:"], [620.0, "\"Hiçbir ümmet dininde bir bid'at çıkarmamıştır ki Allah onun sebebiyle onlardan bir sünneti kaldırmış olmasın.\" Hassân b."], [629.0, "Atıyye'den —Allah Teâlâ ona rahmet etsin—, Dârimî'de ve başkasında olduğu gibi, şöyle dediği rivayet edilmiştir:"], [634.6, "\"Bir kavim dininde bir bid'at çıkarmamıştır ki Allah onların sünnetinden onun benzerini kaldırmış olmasın;"], [634.6, "sonra onu kıyamet gününe kadar onlara geri vermez.\" Seleften birinden —Allah ona rahmet etsin— şöyle dediği rivayet edilmiştir:"], [651.1, "\"Bir adam İslam'da bir bid'at çıkarmaz ki sünnetten ondan daha hayırlı olanı terk etmiş olmasın.\""]]}, {"reader": false, "ar": [[660.0, "وعن ابن عبّاسٍ رضي الله عنهما ـ وأنا أخّرتُه لوجود ضعفٍ فيه ـ وعن ابن عبّاسٍ رضي الله عنهما قال:"], [667.9, "«ما يأتي على الناس من عامٍ إلا أحدثوا فيه بدعةً، وأماتوا فيه سنّةً، حتى تحيا البدع وتموت السنن»."], [678.0, "وقال الإمام شيخ الإسلام ابن تيمية رحمه الله تعالى:"], [683.0, "«فلا تجد قطُّ مبتدعًا إلا وهو يحبّ كتمان النصوص التي تخالفه، ويُبغض إظهارها وروايتها والتحديث بها، ويُبغض من يفعل ذلك، كما قال بعض السلف: ما ابتدع أحدٌ بدعةً إلا نُزعت حلاوة الحديث من قلبه»."], [708.0, "انتهى كلامه رحمه الله."]], "tr": [[660.0, "İbn Abbâs'tan —Allah ikisinden razı olsun— —bunu içinde bir zayıflık bulunduğu için sona bıraktım— İbn Abbâs'tan —Allah ikisinden razı olsun— şöyle dediği rivayet edilmiştir:"], [667.9, "\"İnsanlara bir yıl gelmez ki o yılda bir bid'at çıkarmış ve bir sünneti öldürmüş olmasınlar;"], [667.9, "sonunda bid'atler dirilir ve sünnetler ölür.\" İmam Şeyhülislam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [678.0, "\"Kendisine muhalif olan nassların gizlenmesini sevmeyen, onların ortaya konmasından, rivayet edilmesinden ve nakledilmesinden nefret etmeyen ve bunu yapandan nefret etmeyen hiçbir bid'atçi asla bulamazsın."], [683.0, "Seleften birinin dediği gibi: 'Hiç kimse bir bid'at çıkarmamıştır ki hadisin tadı kalbinden sökülüp alınmış olmasın.'\" Sözü burada bitti; Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[710.0, "وللسلف رحمهم الله تعالى في ذلك كلامٌ كثيرٌ جدًّا."], [714.0, "ولذلك طوبى لمن وفّقه الله عز وجل إلى إحياء السنن وإماتة البدع."]], "tr": [[710.0, "Selefin —Allah Teâlâ onlara rahmet etsin— bu hususta pek çok sözü vardır."], [710.0, "Bu yüzden Allah Azze ve Celle'nin sünnetleri ihya etmeye ve bid'atleri öldürmeye muvaffak kıldığı kimseye ne mutlu!"]]}]}, {"ts": "12:02", "title": "3. Külliye: Yakînen Müslüman olduğu sabit olanı İslam dairesinden ancak yakînle çıkarırız", "paras": [{"reader": false, "ar": [[722.0, "ومن الكلّيّات أيضًا ـ وبالمناسبة:"], [727.7, "هذه الكلّيّة التي سبق شرحها هي ختامُ كلّيّات البدع،"], [735.0, "ثم نبدأ بعدها إن شاء الله عز وجل في كلّيّات التكفير،"], [740.0, "في كلّيّات التكفير ـ الكلّيّة الثالثة:"], [744.5, "<b>كلُّ من ثبت إسلامه بيقينٍ فلا نُخرجه عن دائرته إلا بيقين.<\/b> كلُّ من ثبت إسلامه بيقينٍ فلا نُخرجه عن دائرته إلا بيقين."]], "tr": [[722.0, "Külliyelerden biri de şudur —bu arada:"], [722.0, "Şerhi geçen bu külliye, bid'at külliyelerinin sonuncusudur."], [727.7, "Ondan sonra inşallah tekfir külliyelerine, tekfir külliyelerine başlıyoruz—:"], [740.0, "<b>3. külliye: İslam'ı yakînen sabit olan herkesi, onun dairesinden ancak yakînle çıkarırız.<\/b> İslam'ı yakînen sabit olan herkesi, onun dairesinden ancak yakînle çıkarırız."]]}, {"reader": false, "ar": [[764.0, "أنا قلت لكم: أغلبُ درسنا اليوم نُقول."], [766.0, "وذلك لأنّ المتقرّر في القواعد أنّ الأصل بقاءُ ما كان على ما كان؛"], [777.0, "فمن ثبت إسلامه فيما كان،"], [781.0, "ثم شككنا في انتقاضه الآن،"], [783.0, "فالأصل بقاءُ الحالة السابقة في الحالة الراهنة."], [787.0, "ولأنّ المتقرّر في القواعد أنّ الأصل هو البقاء على الأصل حتى يرد الناقل."], [793.0, "ولأنّ المتقرّر في القواعد أنّ اليقين لا يزول بالشكوك والأوهام والخيالات."]], "tr": [[764.0, "Size söyledim: Bugünkü dersimizin çoğu nakillerdir."], [764.0, "(Bu külliye) şundandır: Kaidelerde yerleşik olan şudur:"], [766.0, "Asıl olan, olanın olduğu hâl üzere kalmasıdır."], [777.0, "Geçmişte İslam'ı sabit olan, sonra şimdi onun bozulduğundan şüphe ettiğimiz kimse hakkında asıl olan, önceki hâlin şimdiki hâlde de devam etmesidir."], [787.0, "Kaidelerde yerleşik olan şudur: Asıl olan, (hükmü) değiştiren (delil) gelinceye kadar asıl üzere kalmaktır."], [793.0, "Kaidelerde yerleşik olan şudur: Yakîn, şüphelerle, vehimlerle ve hayallerle zâil olmaz."]]}, {"reader": false, "ar": [[799.0, "فلا ينبغي أن نُخرج الإنسان المسلم يقينًا من دائرة الإسلام بمجرّد الظِّنّة والتخمين والأهواء،"], [806.0, "بل لا بدّ أن نُخرجه ببرهانٍ واضحٍ ساطعٍ كسطوع الشمس في رابعة النهار."], [814.0, "وهذا بإجماع أهل العلم؛"], [817.0, "فتلك الكلّيّة ممّا اتّفق عليها أهل السنة والجماعة."], [821.0, "والمعروف من تصرّفات أهل السنة:"], [825.0, "تيسيرُ شروط الإدخال في الإسلام،"], [829.0, "والتعسيرُ والتضييقُ فيما يُخرج؛"], [833.0, "فإذا رأيتهم في الحكم على أحدٍ بالإسلام فإنهم ييسّرون في ذلك تيسيرًا عظيمًا،"], [840.0, "ولكن بعد دخوله في دائرة الإسلام فإنهم يغلّظون ويشدّدون في مسألة إخراجه."]], "tr": [[799.0, "Yakînen Müslüman olan bir insanı sırf zan, tahmin ve heveslerle İslam dairesinden çıkarmamız uygun değildir;"], [799.0, "bilakis onu, güneşin gün ortasında parlaması gibi açık ve parlak bir burhanla çıkarmamız gerekir."], [806.0, "Bu, ilim ehlinin icmâıyladır; bu külliye Ehl-i Sünnet ve'l-Cemaat'in üzerinde ittifak ettiği külliyelerdendir."], [817.0, "Ehl-i Sünnet'in tasarruflarında bilinen şudur:"], [821.0, "İslam'a dahil etmenin şartlarını kolaylaştırmak, (İslam'dan) çıkaran şeylerde ise zorlaştırmak ve daraltmak."], [833.0, "Onları birinin Müslüman olduğuna hükmederken görürsen, bu hususta büyük bir kolaylık gösterirler;"], [840.0, "fakat o kişi İslam dairesine girdikten sonra onu çıkarma meselesinde sertleşir ve sıkı davranırlar."]]}, {"reader": false, "ar": [[847.0, "ولذلك يجوز إدخال كافرٍ في الإسلام بمجرّد الظِّنّة والتخمين،"], [853.0, "كمن صلّى مع المسلمين ولا يريد الإسلام؛"], [856.5, "فإننا نحكم عليه بصلاته أنه قد أسلم."], [860.0, "أو من سمع مؤذّنًا من أهل الإسلام يؤذّن،"], [863.4, "ثم صار يردّد وراءه ونطق بالشهادتين،"], [866.0, "فنحكم له بالإسلام. ولا يخفى على شريف علمكم ذلك الرجلُ الذي لمّا رأى شعاعَ سيف أسامة قال:"], [875.5, "أسلمتُ لله، ومع ذلك حكم النبيّ صلى الله عليه وسلم بإسلامه."]], "tr": [[847.0, "Bu yüzden bir kâfiri sırf zan ve tahminle İslam'a dahil etmek caizdir."], [847.0, "Müslümanlarla birlikte namaz kılan, fakat İslam'ı kastetmeyen kimse gibi;"], [853.0, "onun namazından dolayı Müslüman olduğuna hükmederiz."], [856.5, "Ya da İslam ehlinden bir müezzinin ezan okuduğunu işitip arkasından tekrarlamaya başlayan ve kelime-i şehâdeti söyleyen kimse gibi;"], [866.0, "onun Müslüman olduğuna hükmederiz. Üsâme'nin kılıcının parıltısını görünce \"Allah'a teslim oldum (Müslüman oldum)\" diyen o adam yüce ilminizce malumdur;"], [875.5, "buna rağmen Nebî ﷺ onun Müslüman olduğuna hükmetmiştir."]]}, {"reader": false, "ar": [[881.0, "فلا ينبغي التشديد في الأمر الذي يُدخل الناسَ الإسلام؛"], [885.0, "فلعلّه يدخل في أوائله كرهًا،"], [887.3, "لكن إذا خالطت بشاشةُ الإسلام قلبَه حسُن إسلامه،"], [891.5, "كما يُروى في الحديث:"], [895.0, "«عجبتُ لقومٍ يدخلون إلى الجنة بالسلاسل»،"], [898.0, "وهم الذين يُكرَهون على الإسلام إكراهًا،"], [902.1, "ثم تطمئنّ له قلوبهم فيما بعد ذلك."]], "tr": [[881.0, "İnsanları İslam'a sokan işte sıkı davranmak uygun değildir."], [881.0, "Belki kişi başlangıçta istemeyerek girer;"], [887.3, "fakat İslam'ın neşesi kalbine karıştığında İslam'ı güzelleşir."], [891.5, "Hadiste rivayet edildiği gibi: \"Zincirlerle cennete giren bir kavme hayret ettim.\" Bunlar İslam'a zorla sokulan, sonra kalpleri ona mutmain olan kimselerdir."]]}]}, {"ts": "15:07", "title": "3. Külliye (devam): Âlimlerin sözleri ve tekfirden sakındıran hadisler", "paras": [{"reader": false, "ar": [[907.0, "ولذلك قال الإمام ابن عبد البرّ رحمه الله تعالى:"], [910.8, "«كلُّ من ثبت له عقدُ الإسلام في وقتٍ بإجماعٍ من المسلمين، ثم أذنب ذنبًا أو تأوّل تأويلًا، فاختلفوا بعدُ في خروجه من الإسلام، لم يكن لاختلافهم بعد إجماعهم معنًى يوجب حجّة، ولا يخرج من الإسلام المتّفق عليه إلا باتّفاقٍ آخر أو سنّةٍ ثابتةٍ لا معارض لها»."]], "tr": [[907.0, "Bu yüzden İmam İbn Abdilber —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [907.0, "\"Bir vakitte Müslümanların icmâıyla İslam akdi kendisi için sabit olan, sonra bir günah işleyen ya da bir te'vilde bulunan ve bunun ardından (âlimlerin) onun İslam'dan çıkıp çıkmadığında ihtilaf ettiği herkes için, onların icmâlarından sonraki ihtilaflarının hüccet gerektiren bir anlamı yoktur."], [910.8, "Üzerinde ittifak edilen İslam'dan ancak başka bir ittifakla ya da muarızı olmayan sabit bir sünnetle çıkar.\""]]}, {"reader": false, "ar": [[941.0, "وقال الإمام ابن تيمية رحمه الله تعالى:"], [945.5, "«من ثبت إسلامه بيقينٍ لم يزل عنه ذلك بالشكّ، بل لا يزول إلا بعد إقامة الحجّة وإزالة الشبهة»."], [956.0, "وقال الإمام ابن عثيمين رحمه الله تعالى:"], [963.0, "«الأصل فيمن ينتسب للإسلام بقاءُ إسلامه حتى يتحقّق زوالُ ذلك عنه بمقتضى الدليل الشرعيّ، ولا يجوز التساهل في تكفيره»."]], "tr": [[941.0, "İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [945.5, "\"İslam'ı yakînen sabit olan kimseden bu, şüpheyle zâil olmaz;"], [945.5, "bilakis ancak hüccet ikame edildikten ve şüphe giderildikten sonra zâil olur.\" İmam İbn Useymîn —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [956.0, "\"İslam'a nispet edilen kimse hakkında asıl olan, şer'î delilin gereğiyle İslam'ının zâil olduğu kesinleşinceye kadar İslam'ının devam etmesidir."], [963.0, "Onu tekfir etmede gevşek davranmak caiz değildir.\""]]}, {"reader": false, "ar": [[978.0, "وقد دلّت على صحّة هذه القاعدة أدلّةٌ كثيرة؛"], [983.0, "منها مثلًا: حديث أبي ذرٍّ رضي الله تعالى عنه أنه سمع النبيّ صلى الله عليه وسلم قال:"], [992.2, "«لا يرمي رجلٌ رجلًا بالفسق، أو يرميه بالكفر، إلا ارتدّت عليه»."], [998.0, "فلا يجوز لأحدٍ أن يكفّر أحدًا إلا ببرهان،"], [1001.4, "وإلا ارتدّ عليه تكفيرُه أو تفسيقُه."], [1004.0, "وفي لفظ: «ومن دعا رجلًا بالكفر، أو قال: عدوَّ الله، إلا حار عليه»."], [1013.0, "قال الإمام ابن هُبيرة رحمه الله تعالى:"], [1016.9, "«فيه شدّة الخطر على من رمى أخاه المسلم بالكفر». انتهى كلامه."]], "tr": [[978.0, "Bu kaidenin doğruluğuna pek çok delil delâlet etmiştir."], [978.0, "Bunlardan biri, mesela Ebû Zer'in —Allah Teâlâ ondan razı olsun— hadisidir:"], [983.0, "O, Nebî ﷺ'in şöyle buyurduğunu işitmiştir:"], [983.0, "\"Bir adam bir adamı fâsıklıkla itham etmez ya da onu küfürle itham etmez ki (bu söz) kendisine geri dönmesin.\" Bu yüzden hiç kimsenin bir burhan olmadan birini tekfir etmesi caiz değildir;"], [998.0, "aksi hâlde tekfiri ya da tefsiki kendisine geri döner."], [1001.4, "Bir lafızda da şöyledir: \"Kim bir adamı küfürle çağırırsa ya da (ona) 'Allah düşmanı' derse, (bu söz) kendisine döner.\" İmam İbn Hübeyre —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1016.9, "\"Bunda, Müslüman kardeşini küfürle itham eden için büyük bir tehlike vardır.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1023.0, "وفي حديث ابن عمر رضي الله عنهما قال:"], [1027.1, "قال رسول الله صلى الله عليه وسلم:"], [1030.7, "«أيُّما امرئٍ مسلمٍ قال لأخيه: يا كافر، فقد باء بها أحدُهما؛ إن كان كما قال، وإلا رجعت ـ وإلا رجعت عليه»."], [1041.0, "هذا يدلّ على أنه لا يجوز لأحدٍ أن يُخرج مسلمًا من دائرة الإسلام إلا بالبرهان الساطع القاطع الواضح."]], "tr": [[1023.0, "İbn Ömer'in —Allah ikisinden razı olsun— hadisinde şöyle der:"], [1027.1, "Resûlullah ﷺ şöyle buyurdu: \"Hangi Müslüman kişi kardeşine 'Ey kâfir!' derse, bu (söz) ikisinden birine döner:"], [1030.7, "Eğer (o kişi) dediği gibiyse (ona);"], [1030.7, "değilse, (söz) kendisine döner.\" Bu, hiç kimsenin bir Müslümanı İslam dairesinden ancak parlak, kesin ve açık bir burhanla çıkarabileceğini gösterir."]]}, {"reader": false, "ar": [[1048.0, "قال الإمام ابن عبد البرّ رحمه الله تعالى في شرح هذا الحديث:"], [1054.0, "«المعنى فيه عند أهل الفقه والأثر من أهل السنة والجماعة: النهيُ أن يكفّر المسلمُ أخاه المسلمَ بذنبٍ أو بتأويلٍ لا يُخرجه من الإسلام عند الجميع»."], [1071.0, "انتهى كلامه رحمه الله."], [1073.0, "وفي حديث ثابتٍ رضي الله تعالى عنه قال:"], [1077.3, "قال النبيّ صلى الله عليه وسلم:"], [1079.3, "«ومن رمى مؤمنًا بكفرٍ فهو كقتله»."], [1084.0, "وقال الإمام ابن القيّم رحمه الله تعالى:"], [1088.0, "«من الكبائر ـ من الكبائر ـ تكفيرُ من لم يكفّره الله ورسوله»."]], "tr": [[1048.0, "İmam İbn Abdilber —Allah Teâlâ ona rahmet etsin— bu hadisin şerhinde şöyle demiştir:"], [1048.0, "\"Ehl-i Sünnet ve'l-Cemaat'ten olan fıkıh ve eser ehline göre bunun anlamı şudur:"], [1054.0, "Müslümanın, Müslüman kardeşini bir günahla ya da herkese göre onu İslam'dan çıkarmayan bir te'vil ile tekfir etmesinin yasaklanmasıdır.\" Sözü burada bitti;"], [1071.0, "Allah ona rahmet etsin. Sâbit'in —Allah Teâlâ ondan razı olsun— hadisinde şöyle der:"], [1073.0, "Nebî ﷺ şöyle buyurdu: \"Kim bir mü'mini küfürle itham ederse, bu onu öldürmesi gibidir.\" İmam İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1084.0, "\"Büyük günahlardan —büyük günahlardan— biri de Allah'ın ve Resûlü'nün tekfir etmediği kimseyi tekfir etmektir.\""]]}, {"reader": false, "ar": [[1094.0, "وفي الصحيحين من حديث أسامة قال:"], [1098.4, "«بعثنا رسول الله صلى الله عليه وسلم في سريّة، فصبّحنا الحُرَقاتِ من جُهينة، فأدركتُ رجلًا منهم، فلمّا رأى شعاعَ السيف قال: أسلمتُ لله» ـ وفي رواية:"], [1109.6, "«قال: لا إله إلا الله» ـ «فقتلتُه، فبلغ ذلك النبيَّ صلى الله عليه وسلم، فدعاني فقال: يا أسامة، أقتلتَه بعد أن قال: لا إله إلا الله؟ قلت: يا رسول الله، إنما كان متعوّذًا. قال: أفلا شققتَ عن قلبه حتى تعلم أقالها أو لا؟"]], "tr": [[1094.0, "Sahîhayn'da Üsâme'nin hadisinde şöyle der:"], [1098.4, "\"Resûlullah ﷺ bizi bir seriyyede gönderdi."], [1098.4, "Cüheyne'nin Hurakât (koluna) sabah baskını yaptık."], [1098.4, "Onlardan bir adama yetiştim. Kılıcın parıltısını görünce 'Allah'a teslim oldum' dedi\" —bir rivayette:"], [1098.4, "\"'Lâ ilâhe illallah' dedi\"— \"Onu öldürdüm."], [1109.6, "Bu, Nebî ﷺ'e ulaştı; beni çağırıp 'Ey Üsâme!"], [1109.6, "Lâ ilâhe illallah dedikten sonra mı onu öldürdün?' dedi."], [1109.6, "'Ey Allah'ın Resûlü! O sadece (kılıçtan) korunmak için (söylemişti)' dedim."], [1109.6, "'Onu söyleyip söylemediğini bilmek için kalbini yarsaydın ya!' buyurdu."]]}, {"reader": false, "ar": [[1131.0, "كيف تصنع ـ أو قال:"], [1132.4, "كيف تفعل ـ بلا إله إلا الله إذا جاءت يوم القيامة؟"], [1136.0, "قال: قلت: يا رسول الله،"], [1138.3, "استغفر لي. قال: فجعل لا يزيده على أن يقول:"], [1142.4, "كيف تصنع بلا إله إلا الله إذا جاءت يوم القيامة؟»."]], "tr": [[1131.0, "Lâ ilâhe illallah kıyamet günü geldiğinde onunla ne yapacaksın?\" —ya da:"], [1132.4, "\"ne edeceksin?\" dedi—. (Üsâme) dedi ki:"], [1136.0, "\"Ey Allah'ın Resûlü! Benim için istiğfar et\" dedim."], [1138.3, "(Râvi) dedi ki: \"Bunun üzerine 'Lâ ilâhe illallah kıyamet günü geldiğinde onunla ne yapacaksın?' demekten başka bir şey eklemiyordu.\""]]}, {"reader": false, "ar": [[1147.0, "وفي الصحيحين من حديث المقداد رضي الله عنه قال:"], [1151.3, "«قلت: يا رسول الله، أرأيتَ إن لقيتُ رجلًا من الكفّار فقاتلني، فضرب إحدى يديّ بالسيف فقطعها، ثم لاذ منّي بشجرةٍ فقال: أسلمتُ لله، أفأقتله يا رسول الله بعد أن قالها؟ فقال: لا تقتله. قال: قلت: يا رسول الله، إنه قطع يدي، ثم قال ذلك بعد أن قطعها، أفأقتله؟ فقال: لا تقتله؛ فإنك إن قتلتَه فإنه بمنزلتك قبل أن تقتله، وأنت بمنزلته قبل أن يقول كلمته التي قال»."]], "tr": [[1147.0, "Sahîhayn'da Mikdâd'ın —Allah ondan razı olsun— hadisinde şöyle der:"], [1147.0, "\"Dedim ki: Ey Allah'ın Resûlü!"], [1151.3, "Ne dersin, kâfirlerden bir adamla karşılaşsam, benimle savaşsa, kılıçla ellerimden birine vurup onu kesse, sonra benden bir ağaca sığınıp 'Allah'a teslim oldum' dese, bunu söyledikten sonra onu öldüreyim mi ey Allah'ın Resûlü?"], [1151.3, "'Onu öldürme' buyurdu. Dedim ki:"], [1151.3, "Ey Allah'ın Resûlü! O benim elimi kesti, sonra onu kestikten sonra bunu söyledi;"], [1151.3, "onu öldüreyim mi? 'Onu öldürme;"], [1151.3, "çünkü eğer onu öldürürsen o, sen onu öldürmeden önceki senin konumunda olur, sen de o söylediği kelimeyi söylemeden önceki onun konumunda olursun' buyurdu.\""]]}, {"reader": false, "ar": [[1186.0, "فتكفير المسلمين بلا علمٍ ولا برهانٍ من أعظم الذنوب عند الله عز وجل."], [1193.0, "وقال الإمام محمد بن عبد الوهّاب رحمه الله تعالى:"], [1197.0, "«لا نكفّر من لا يُعرف عنه الكفر بسبب ناقضٍ ذُكر عنه ونحن لم نتحقّقه منه»."]], "tr": [[1186.0, "Müslümanları ilim ve burhan olmadan tekfir etmek, Allah Azze ve Celle katında günahların en büyüklerindendir."], [1186.0, "İmam Muhammed b. Abdilvehhâb —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1193.0, "\"Kendisinden küfür bilinmeyen kimseyi, onun hakkında zikredilen ve bizim ondan (sâdır olduğunu) kesinleştirmediğimiz bir nâkız (İslam'ı bozan şey) sebebiyle tekfir etmeyiz.\""]]}]}, {"ts": "20:07", "title": "3. Külliye (sonu): Haksız tekfirin tövbesi", "paras": [{"reader": false, "ar": [[1207.0, "فإن قلت: وإذا وقع أحدٌ في شيءٍ من ذلك فما توبته؟"], [1213.0, "الجواب: إنّ تكفير المسلم يتعلّق به حقّان:"], [1218.0, "حقٌّ لله عز وجل،"], [1219.1, "وحقٌّ لهذا المسلم. أمّا حقّ الله عز وجل فإنه يزول عنك بالتوبة الصادقة النصوح المستجمعة لشروطها:"], [1228.0, "ألّا تعود لمثل هذا التخوّض في دين الناس يا أخي؛"], [1232.0, "فإنّ هذا من المحرّمات العظيمة."]], "tr": [[1207.0, "Şayet \"Biri bunlardan birine düşerse tövbesi nedir?\" dersen, cevap:"], [1213.0, "Müslümanı tekfir etmeye iki hak taalluk eder:"], [1213.0, "Allah Azze ve Celle'nin hakkı ve bu Müslümanın hakkı."], [1219.1, "Allah Azze ve Celle'nin hakkına gelince;"], [1219.1, "o, şartlarını bir araya getiren samimi, nasûh bir tövbe ile senden düşer:"], [1228.0, "Kardeşim, insanların dini hakkında böyle bir dalmaya bir daha dönmemendir; çünkü bu, büyük haramlardandır."]]}, {"reader": false, "ar": [[1234.0, "وأمّا حقّه فلا بدّ فيه من التحلّل،"], [1238.0, "إن علمتَ أو غلب على ظنّك أنّ ذلك لا يزيد الخصومة والفرقة بينكما،"], [1242.0, "وإلا فلا أقلَّ من أن تُكثر من الدعاء والاستغفار له،"], [1248.0, "وإعلانِ إسلامه وإيمانه في المجالس التي ثبت تكفيرُه فيها."], [1255.0, "وبذلك يزول عنك ـ إن شاء الله ـ متعلَّقاتُ شؤم هذا الذنب العظيم."]], "tr": [[1234.0, "Onun hakkına gelince; bunun ikinizin arasındaki husumeti ve ayrılığı artırmayacağını bilirsen ya da buna zannın galip gelirse, onda helalleşmek gerekir."], [1242.0, "Aksi hâlde en azından ona çokça dua ve istiğfar etmen ve onu tekfir ettiğin meclislerde onun Müslüman ve mü'min olduğunu ilan etmen gerekir."], [1255.0, "Bununla inşallah bu büyük günahın uğursuzluğuna taalluk eden şeyler senden zâil olur."]]}]}, {"ts": "21:05", "title": "4. Külliye: Nassın küfür olduğuna şahitlik etmediği bir günahla tekfir helal değildir", "paras": [{"reader": false, "ar": [[1265.0, "ومن الكلّيّات أيضًا: <b>كلُّ ذنبٍ لم يشهد له النصّ بأنه كفرٌ فلا يحلّ التكفير به.<\/b> كلُّ ذنبٍ لم يشهد له النصّ بأنه كفرٌ فلا يحلّ التكفير به."], [1286.0, "أُعيدها مرةً ثالثة: كلُّ ذنبٍ لم يشهد له النصّ بأنه كفرٌ فلا يحلّ التكفير به."]], "tr": [[1265.0, "Külliyelerden biri de şudur: 4."], [1265.0, "külliye: Nassın küfür olduğuna şahitlik etmediği her günahla tekfir etmek helal değildir. Nassın küfür olduğuna şahitlik etmediği her günahla tekfir etmek helal değildir."], [1286.0, "Üçüncü kez tekrarlıyorum: Nassın küfür olduğuna şahitlik etmediği her günahla tekfir etmek helal değildir."]]}, {"reader": false, "ar": [[1297.0, "أقول: فيكون التكفير به من الباطل،"], [1301.2, "ولا شكّ في ذلك."], [1304.0, "وذلك لأنّ تكفير شخصٍ إنما هو إثباتُ حكمٍ شرعيّ،"], [1310.0, "والمتقرّر في القواعد أنّ الأحكام الشرعية وقفٌ على الشارع؛"], [1315.0, "فلا يجوز للإنسان أن يحكم بكفرٍ على أحدٍ لذنبٍ وقع فيه إلا إذا شهد الدليل الواضح الصريح بأنّ هذا ممّا يوجب التكفير به."]], "tr": [[1297.0, "Derim ki: (Böyle bir günahla) tekfir etmek bâtıldır;"], [1301.2, "bunda şüphe yoktur. Bu şundandır:"], [1304.0, "Bir şahsı tekfir etmek, şer'î bir hükmü ispat etmektir."], [1310.0, "Kaidelerde yerleşik olan şudur: Şer'î hükümler Şâri'e bağlıdır (tevkîfîdir)."], [1310.0, "Bu yüzden insanın, birini düştüğü bir günahtan dolayı küfürle hükmetmesi, açık ve sarih delil bunun tekfiri gerektiren şeylerden olduğuna şahitlik etmedikçe caiz değildir."]]}, {"reader": false, "ar": [[1328.0, "فالتكفير حقٌّ لله عز وجل ولرسوله صلى الله عليه وسلم،"], [1333.0, "لا مدخلَ فيه للتشفّي،"], [1335.5, "ولا للانتقام، ولا للمعاملة بالمثل،"], [1338.6, "ولا لإطفاء نار الغضب،"], [1341.1, "ولا لغير ذلك؛ فلا يجوز أن نكفّر إلا من كفّره الله عز وجل ورسوله."], [1348.0, "فالتكفير حكمٌ من أحكام الشرع،"], [1351.5, "له أسبابه وضوابطه وشروطه وموانعه وآثاره،"], [1356.0, "شأنُه في ذلك شأنُ سائر الأحكام الشرعية."], [1360.0, "وقد أجمع علماء أهل السنة والجماعة على تقرير هذه الكلّيّة."]], "tr": [[1328.0, "Tekfir, Allah Azze ve Celle'nin ve Resûlü ﷺ'in hakkıdır;"], [1328.0, "onda içini soğutmanın, intikamın, misliyle karşılık vermenin, öfke ateşini söndürmenin ya da başka bir şeyin yeri yoktur."], [1338.6, "Bu yüzden ancak Allah Azze ve Celle'nin ve Resûlü'nün tekfir ettiğini tekfir etmemiz caizdir."], [1341.1, "Tekfir şer'î hükümlerden bir hükümdür;"], [1348.0, "sebepleri, zâbıtları, şartları, mânileri ve sonuçları vardır;"], [1356.0, "bu hususta durumu diğer bütün şer'î hükümlerin durumu gibidir."], [1360.0, "Ehl-i Sünnet ve'l-Cemaat âlimleri bu külliyenin takririnde icmâ etmiştir."]]}, {"reader": false, "ar": [[1364.0, "قال شيخ الإسلام ابن تيمية رحمه الله تعالى:"], [1368.0, "«لأنّ الكفر حكمٌ شرعيّ، وإنما يثبت بالأدلّة الشرعية»."], [1374.0, "انتهى كلامه. وقال رحمه الله تعالى في ردّه على البكريّ:"], [1379.0, "«فلهذا كان أهل العلم والسنة لا يكفّرون من خالفهم، وإن كان ذلك المخالف يكفّرهم؛ لأنّ الكفر حكمٌ شرعيّ، فليس للإنسان أن يعاقب بمثله، كمن كذب عليك وزنى بأهلك، ليس لك أن تكذب عليه أو تزني بأهله؛ لأنّ الكذب والزنا حرامٌ لحقّ الله عز وجل. وكذلك التكفير حقٌّ لله عز وجل، فلا يُكفَّر إلا من كفّره الله ورسوله."]], "tr": [[1364.0, "Şeyhülislam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1368.0, "\"Çünkü küfür şer'î bir hükümdür ve ancak şer'î delillerle sabit olur.\" Sözü burada bitti."], [1374.0, "—Allah Teâlâ ona rahmet etsin— Bekrî'ye reddiyesinde de şöyle demiştir:"], [1374.0, "\"Bu yüzden ilim ve sünnet ehli, kendilerine muhalefet edeni —o muhalif onları tekfir etse bile— tekfir etmezdi."], [1379.0, "Çünkü küfür şer'î bir hükümdür;"], [1379.0, "insanın (onu) misliyle cezalandırması (hakkı) yoktur."], [1379.0, "Sana yalan söyleyen ve ehline zina eden kimse gibi:"], [1379.0, "Senin ona yalan söylemen ya da onun ehline zina etmen (hakkın) yoktur;"], [1379.0, "çünkü yalan ve zina Allah Azze ve Celle'nin hakkı sebebiyle haramdır."], [1379.0, "Tekfir de böyledir; Allah Azze ve Celle'nin hakkıdır."], [1379.0, "Bu yüzden ancak Allah'ın ve Resûlü'nün tekfir ettiği kimse tekfir edilir."]]}, {"reader": false, "ar": [[1415.0, "وأيضًا فإنّ تكفير الشخص المعيّن وجوازَ قتله موقوفٌ على أن تبلغه الحجّة النبويّة التي يكفر من خالفها،"], [1425.0, "وإلا فليس كلُّ من جهل شيئًا من الدين يكفر به»."], [1429.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[1415.0, "Ayrıca muayyen (belirli) şahsı tekfir etmek ve onu öldürmenin caiz oluşu, ona, kendisine muhalefet edenin kâfir olacağı nebevî hüccetin ulaşmasına bağlıdır."], [1425.0, "Aksi hâlde dinden bir şeyi bilmeyen herkes onunla kâfir olmaz.\" Sözü burada bitti;"], [1429.0, "Allah Teâlâ ona rahmet etsin."]]}, {"reader": false, "ar": [[1431.0, "ونستنتج من هذه القاعدة وكلام الأئمّة عليها عدّة أمور:"], [1439.0, "منها: أنه لا يثبت التكفير على قولٍ إلا بدليلٍ شرعيّ؛"], [1443.0, "لأنّ الكافر هو من كفّره الله ورسوله."], [1447.0, "ومنها: أنه لا يحكم في مسائل التكفير إلا العلماءُ المتأهّلون؛"], [1460.0, "فليس الباب بابًا يخوض فيه المبتدئون،"], [1463.0, "أو يخوض فيه عوامّ أهل السنة،"], [1466.0, "أو أنصافُ طلبة العلم."]], "tr": [[1431.0, "Bu kaideden ve imamların onunla ilgili sözlerinden birkaç sonuç çıkarırız:"], [1439.0, "Bunlardan biri: Bir söz hakkında tekfir ancak şer'î bir delille sabit olur;"], [1443.0, "çünkü kâfir, Allah'ın ve Resûlü'nün tekfir ettiği kimsedir."], [1447.0, "Bunlardan biri: Tekfir meselelerinde ancak ehliyetli âlimler hüküm verir."], [1460.0, "Bu bab, yeni başlayanların, Ehl-i Sünnet'in avamının ya da yarım talebelerin dalacağı bir bab değildir."]]}, {"reader": false, "ar": [[1468.0, "وإني لأعجب من إنسانٍ أوّلَ ما يُدرّس طلابه يدرّسهم قواعد التكفير،"], [1476.0, "قبل أن يتضلّعوا من القواعد في باب الألوهية،"], [1480.2, "وباب الربوبية، وباب الأسماء والصفات،"], [1482.9, "وغيرها من مسائل الاعتقاد؛"], [1485.0, "فإنّ أبواب التكفير إنما تُدرَّس في أواخر الدروس،"], [1490.0, "بعد أن يتضلّع الطلاب،"], [1492.1, "وتكون عندهم الأهليّة لفهمها حقَّ فهمها،"], [1495.2, "وإنزالِها في واقع الناس حقَّ إنزالها،"], [1498.4, "بلا مفسدةٍ خالصةٍ أو راجحة."]], "tr": [[1468.0, "Talebelerine ilk iş olarak tekfir kaidelerini okutan, onlar ulûhiyyet babındaki, rubûbiyyet babındaki, isim ve sıfatlar babındaki ve diğer itikad meselelerindeki kaidelere kanmadan (onları iyice öğrenmeden) bunu yapan bir insana gerçekten şaşarım."], [1485.0, "Çünkü tekfir babları ancak derslerin sonlarında okutulur;"], [1490.0, "talebeler (ilme) kandıktan, onları hakkıyla anlamaya ve —halis ya da râcih bir mefsedet olmaksızın— insanların vakıasına hakkıyla uygulamaya ehliyetleri olduktan sonra."]]}]}, {"ts": "25:01", "title": "4. Külliye (devam): Tekfir kaidelerini Ehl-i Sünnet metoduna göre öğrenmek", "paras": [{"reader": false, "ar": [[1501.0, "فلا ينبغي لأيّ أحدٍ أن يدخل في هذا الباب ما دام في سلامةٍ من الدخول فيه،"], [1509.4, "وفيه من العلماء من يكفيه."], [1512.0, "ولو رأينا بنظرةٍ بسيطةٍ في واقعنا المعاصر الآن لوجدتَ أنّ من لم يتضلّع من شيءٍ من العلم صار يكفّر كبارَ العلماء وطلابَ العلم بمجرّد المخالفة."]], "tr": [[1501.0, "Bu yüzden hiç kimsenin, ona girmekten selamette olduğu ve onda kendisine yetecek âlimler bulunduğu sürece bu baba girmesi uygun değildir."], [1512.0, "Günümüz vakıasına basit bir bakışla baksak, ilimden hiçbir şeye kanmamış kimsenin büyük âlimleri ve ilim talebelerini sırf muhalefet sebebiyle tekfir eder hâle geldiğini görürsün."]]}, {"reader": false, "ar": [[1529.5, "ومنها أيضًا: أنه لا بدّ من أن يتعلّم الإنسان قواعد التكفير على منهج أهل السنة والجماعة؛"], [1538.0, "وذلك لأنّ المعروف عن كافّة الطوائف أنّ تكفيرها ليس موزونًا بميزان الدليل:"], [1548.0, "فالمعتزلة يكفّرون بلا ميزان الدليل،"], [1551.5, "والأشاعرة يكفّرون بلا ميزان الدليل،"], [1556.0, "وكذلك غيرهم من سائر الطوائف إنما يكفّرون بالأهواء والظِّنّة."]], "tr": [[1529.5, "Bunlardan biri de şudur: İnsanın tekfir kaidelerini Ehl-i Sünnet ve'l-Cemaat'in metoduna göre öğrenmesi gerekir."], [1529.5, "Çünkü bütün fırkalar hakkında bilinen şudur:"], [1538.0, "Onların tekfiri delil terazisiyle tartılmış değildir."], [1548.0, "Mu'tezile delil terazisi olmadan tekfir eder, Eş'arîler delil terazisi olmadan tekfir eder;"], [1556.0, "diğer bütün fırkalar da böyledir, ancak heveslerle ve zanla tekfir ederler."]]}, {"reader": false, "ar": [[1562.0, "فمتى ما دخل الإنسان في باب التكفير غيرَ مؤصَّلٍ على قواعد أهل السنة والجماعة،"], [1571.0, "فلا جرم أنّ نتائج تكفيره للآخرين ستكون مفاسدها أكثرَ من مصالحها."], [1577.0, "فلا بدّ أن يتعلّم،"], [1579.4, "وأن يتفقّه أبوابَ التكفير،"], [1581.8, "وقواعدَ التكفير، وجزئيّاتِ التكفير،"], [1584.3, "ومتعلَّقاتِ وتفاصيلَ هذا الباب على منهج أهل السنة والجماعة."]], "tr": [[1562.0, "İnsan Ehl-i Sünnet ve'l-Cemaat'in kaidelerine göre te'sîs edilmemiş (usûl kazanmamış) olarak tekfir babına girdiğinde, şüphesiz başkalarını tekfirinin sonuçlarının mefsedetleri maslahatlarından fazla olacaktır."], [1571.0, "Bu yüzden tekfir bablarını, tekfir kaidelerini, tekfirin cüz'î meselelerini ve bu babın taalluklarını ve ayrıntılarını Ehl-i Sünnet ve'l-Cemaat'in metoduna göre öğrenmesi ve onlarda fıkıh sahibi olması gerekir."]]}, {"reader": false, "ar": [[1590.0, "لأنّ أهل السنة وسطٌ في باب التكفير بين طائفتين ضالّتين:"], [1595.0, "بين طائفة الوعيديّة من الخوارج والمعتزلة،"], [1598.0, "الذين ملؤوا الدنيا تكفيرًا بلا علمٍ ولا برهان،"], [1603.0, "وبين طائفة المرجئة الذين أطفؤوا جذوةَ التكفير إلا في حدود من خالفهم أو عاند مذهبهم فقط."]], "tr": [[1590.0, "Çünkü Ehl-i Sünnet tekfir babında iki sapık fırka arasında orta yoldadır:"], [1590.0, "Dünyayı ilim ve burhan olmadan tekfirle dolduran Hâricîler ve Mu'tezile'den Va'îdiyye fırkası ile, sadece kendilerine muhalefet eden ya da mezheplerine inat eden kimseler sınırında kalmak dışında tekfir ateşini söndüren Mürcie fırkası arasında."]]}, {"reader": false, "ar": [[1611.0, "وبناءً على ذلك ـ أيها الأحبّة الكرام ـ فالحكم بالتكفير والتفسيق على أحدٍ من الناس ليس مردُّه إلا إلى الدليل؛"], [1627.0, "فإذا ثبت الدليل فأهلًا وسهلًا،"], [1628.7, "وإذا لم يثبت الدليل فلا حقَّ لأحدٍ أن يكفّر أحدًا."]], "tr": [[1611.0, "Buna göre, ey değerli kardeşler, insanlardan biri hakkında tekfir ve tefsik hükmü vermenin dönüş yeri ancak delildir."], [1611.0, "Delil sabit olursa başüstüne; delil sabit olmazsa kimsenin bir başkasını tekfir etme hakkı yoktur."]]}]}, {"ts": "27:12", "title": "5. Külliye: Ceza gerektiren şer'î vasıfların hepsi küçük ve büyük diye ikiye ayrılır", "paras": [{"reader": false, "ar": [[1632.0, "ومن الكلّيّات أيضًا: <b>كلُّ الأوصاف الشرعية الموجبة للعقوبات فمنقسمةٌ إلى أصغرَ وأكبر.<\/b> كلُّ الأوصاف الشرعية الموجبة للعقوبات فمنقسمةٌ إلى أصغر وأكبر."], [1660.2, "أُعيدها مرةً ثالثة: كلُّ الأوصاف الموجبة للعقوبات فمنقسمةٌ إلى أصغر وأكبر."], [1671.0, "وهذا بإجماع أهل السنة والجماعة."]], "tr": [[1632.0, "Külliyelerden biri de şudur: 5."], [1632.0, "külliye: Cezaları gerektiren şer'î vasıfların hepsi küçük ve büyük diye ikiye ayrılır. Cezaları gerektiren şer'î vasıfların hepsi küçük ve büyük diye ikiye ayrılır."], [1632.0, "Üçüncü kez tekrarlıyorum: Cezaları gerektiren vasıfların hepsi küçük ve büyük diye ikiye ayrılır."], [1660.2, "Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır."]]}, {"reader": false, "ar": [[1675.0, "ونعني بالأوصاف الموجبة للعقوبة:"], [1677.3, "كوصف الشرك مثلًا؛ فإنه منقسمٌ عند أهل السنة والجماعة إلى أصغر وأكبر."], [1682.9, "فلا بدّ أن نتعامل مع الأدلّة الواردة في مسألة الشرك في الكتاب والسنة على هذين القسمين؛"], [1691.1, "فلا نرى أنها تفيد الأصغرَ مطلقًا،"], [1696.0, "ولا تفيد الأكبرَ مطلقًا،"], [1697.0, "كما قالته طوائف الضلال."]], "tr": [[1675.0, "Ceza gerektiren vasıflarla, mesela şirk vasfı gibi şeyleri kastediyoruz."], [1677.3, "O, Ehl-i Sünnet ve'l-Cemaat'e göre küçük ve büyük diye ikiye ayrılır."], [1682.9, "Bu yüzden Kitap ve Sünnet'te şirk meselesinde gelen delillere bu iki kısım üzere muamele etmemiz gerekir."], [1682.9, "Sapık fırkaların dediği gibi onların mutlak olarak küçük (şirki) ya da mutlak olarak büyük (şirki) ifade ettiğini düşünmeyiz."]]}, {"reader": false, "ar": [[1700.0, "ومن الأوصاف الموجبة للعقوبة:"], [1702.7, "وصفُ الكفر؛ فإنه منقسمٌ بإجماع أهل السنة إلى أصغر وأكبر."], [1709.0, "فينبغي أن نتعامل مع الأدلّة الواردة في التكفير على قولٍ أو عملٍ بناءً على أنه منقسمٌ إلى أصغر وأكبر،"], [1720.0, "خلافًا للخوارج الذين لا يقسّمون الشرك ولا الكفر،"], [1724.0, "وإنما الشرك والكفر عندهم أكبرُ فقط."]], "tr": [[1700.0, "Ceza gerektiren vasıflardan biri de küfür vasfıdır."], [1702.7, "O, Ehl-i Sünnet'in icmâıyla küçük ve büyük diye ikiye ayrılır."], [1702.7, "Bu yüzden bir söz ya da amel hakkında tekfir konusunda gelen delillere, onun küçük ve büyük diye ikiye ayrıldığı esasına göre muamele etmemiz gerekir."], [1720.0, "Bu, şirki de küfrü de kısımlara ayırmayan Hâricîlerin aksinedir;"], [1724.0, "onlara göre şirk ve küfür sadece büyüktür."]]}, {"reader": false, "ar": [[1728.0, "ومن تلك الأوصاف أيضًا:"], [1730.7, "وصفُ النفاق؛ فإنّ الأدلّة دلّت على أنّ من النفاق ما هو أصغر وأكبر."], [1736.8, "فلا بدّ أن نتعامل مع الأدلّة الواردة بالحكم على النفاق على أحدٍ بناءً على هذين القسمين،"], [1745.0, "حتى نضع النقاط على حروفها من غير إفراطٍ ولا تفريط."]], "tr": [[1728.0, "Bu vasıflardan biri de nifak vasfıdır."], [1730.7, "Deliller nifakın küçüğünün ve büyüğünün olduğunu göstermiştir."], [1730.7, "Bu yüzden biri hakkında nifak hükmü vermeye dair gelen delillere bu iki kısım esasına göre muamele etmemiz gerekir ki ifrat ve tefrit olmaksızın noktaları harflerin üzerine koyalım."]]}, {"reader": false, "ar": [[1751.0, "ومن تلك الأوصاف أيضًا:"], [1753.7, "وصفُ الظلم؛ فإنّ الأدلّة وردت بوصف الظلم في جزئيّتين:"], [1759.6, "في مطلق الظلم، أي الظلم الأصغر،"], [1763.6, "وفي الظلم المطلق، كما قال النبيّ صلى الله عليه وسلم ـ كما ثبتت الأدلّة في ذلك."], [1774.0, "وكلُّها ستأتينا إن شاء الله ـ كلُّها ستأتينا بإذن الله عز وجل ـ في كلّيّاتها."]], "tr": [[1751.0, "Bu vasıflardan biri de zulüm vasfıdır."], [1753.7, "Deliller zulüm vasfını iki cüz'î (kısım) hâlinde zikretmiştir:"], [1759.6, "Mutlak (sıradan) zulüm, yani küçük zulüm;"], [1763.6, "ve zulm-i mutlak (tam zulüm)."], [1763.6, "Nebî ﷺ'in buyurduğu gibi —delillerin bu hususta sabit olduğu gibi."], [1763.6, "Bunların hepsi inşallah —hepsi Allah Azze ve Celle'nin izniyle— kendi külliyelerinde karşımıza gelecek."]]}, {"reader": false, "ar": [[1780.0, "ومنها أيضًا: وصفُ الفسق؛"], [1782.7, "فإنّ أهل السنة متّفقون على انقسامه إلى فسقٍ أصغر وفسقٍ أكبر."], [1790.0, "ومنها: وصفُ الفجور الوارد في الأدلّة؛"], [1793.9, "فإنه قد يُراد به مطلقُ الفجور،"], [1797.8, "أي الأصغر، أو الفجورُ المطلق، أي الأكبر."]], "tr": [[1780.0, "Bunlardan biri de fısk vasfıdır."], [1780.0, "Ehl-i Sünnet onun küçük fısk ve büyük fısk diye ikiye ayrıldığında ittifak etmiştir."], [1782.7, "Bunlardan biri de delillerde geçen fücûr vasfıdır."], [1790.0, "Onunla mutlak (sıradan) fücûr, yani küçüğü ya da fücûr-i mutlak (tam fücûr), yani büyüğü kastedilebilir."]]}]}, {"ts": "30:03", "title": "5. Külliye (sonu): Günah vasfı; Mürcie ile Hâricîler arasında", "paras": [{"reader": false, "ar": [[1803.0, "ومنها كذلك: الوصفُ بالإثم؛"], [1805.7, "فإنه قد يُراد به مطلقُ الإثم،"], [1809.7, "أي الأصغر، وقد يُراد به الإثمُ المطلق،"], [1814.7, "وهو الأكبر. وهكذا في سائر الأوصاف الشرعية التي توجب عقوبةً عند الله عز وجل؛"], [1826.0, "فلا بدّ أن نقسّمها إلى هذين القسمين،"], [1830.8, "خروجًا من مذهب المرجئة والخوارج."]], "tr": [[1803.0, "Bunlardan biri de günah (ism) ile nitelemektir."], [1805.7, "Onunla mutlak (sıradan) günah, yani küçüğü kastedilebilir;"], [1809.7, "günah-ı mutlak (tam günah), yani büyüğü de kastedilebilir."], [1814.7, "Allah Azze ve Celle katında ceza gerektiren diğer bütün şer'î vasıflarda da durum böyledir."], [1826.0, "Mürcie'nin ve Hâricîlerin mezhebinden çıkmak için onları bu iki kısma ayırmamız gerekir."]]}]}, {"ts": "30:35", "title": "6. Külliye: Vasıflara dair tekfir, şartlar sabit olup mâniler kalkmadan muayyene uygulanamaz", "paras": [{"reader": false, "ar": [[1835.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما كان من تكفير الأوصاف فلا يجوز إنزاله على المعيّن إلا بعد ثبوت الشروط وانتفاء الموانع.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرةً ثانية ـ طيّب ـ:"], [1864.0, "كلُّ ما كان من تكفير الأوصاف فلا يجوز إنزاله على المعيّن إلا بعد ثبوت الشروط وانتفاء الموانع."]], "tr": [[1835.0, "Külliyelerden biri de şudur: 6."], [1835.0, "külliye: Vasıflara yönelik tekfir kabîlinden olan her şeyi, şartlar sabit olup mâniler ortadan kalkmadıkça muayyen (belirli) kişiye uygulamak caiz değildir. İkinci kez tekrarlıyorum —peki—:"], [1835.0, "Vasıflara yönelik tekfir kabîlinden olan her şeyi, şartlar sabit olup mâniler ortadan kalkmadıkça muayyen kişiye uygulamak caiz değildir."]]}, {"reader": false, "ar": [[1877.0, "أقول وبالله التوفيق: وهذه الكلّيّة من أعظم ما ينبغي دراسته في باب التكفير،"], [1898.0, "وأرى أنّ من أخلّ بها فإنه سيقع في تكفير من لا يجوز تكفيره من أهل الإسلام."], [1905.0, "وإنّ أعظم طائفةٍ خالفت أهل السنة في هذه الكلّيّة هم الوعيديّة من الخوارج والمعتزلة،"], [1914.0, "ممّن يعتقدون التلازمَ الذاتيَّ بين الحكم على الوصف والحكم على الموصوف،"], [1920.8, "أي المعيّن؛ فكلُّ من وقع في الكفر عند الوعيديّة فإنه يُكفَّر مباشرةً من غير فصلٍ أبدًا."]], "tr": [[1877.0, "Tevfik Allah'tandır, derim ki: Bu külliye, tekfir babında okunması gereken en büyük şeylerdendir."], [1877.0, "Görüşüm şudur ki onu ihlal eden kimse, İslam ehlinden tekfiri caiz olmayan kimseleri tekfir etmeye düşecektir."], [1905.0, "Bu külliyede Ehl-i Sünnet'e muhalefet eden en büyük fırka, vasıf hakkındaki hüküm ile mevsûf, yani muayyen hakkındaki hüküm arasında zâtî bir telâzüm (birbirini gerektirme) olduğuna inanan Hâricîler ve Mu'tezile'den Va'îdiyye'dir."], [1920.8, "Va'îdiyye'ye göre küfre düşen herkes, hiçbir ayrım yapılmadan doğrudan tekfir edilir."]]}, {"reader": false, "ar": [[1932.0, "وهذا خطأٌ بإجماع أهل السنة والجماعة؛"], [1936.0, "فإنّ الأدلّة الكثيرة قد دلّت على وجوب التفريق بين الحكم على الفعل والحكم على الفاعل؛"], [1942.0, "فقد يكون الفعل كفرًا،"], [1944.3, "ولكن ليس كلُّ من وقع في الكفر وقع الكفر عليه،"], [1950.0, "إلا بعد التأكّد من ثبوت الشروط وانتفاء الموانع."]], "tr": [[1932.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyla hatadır."], [1936.0, "Çünkü pek çok delil, fiil hakkındaki hüküm ile fâil hakkındaki hüküm arasında ayrım yapmanın vacip olduğunu göstermiştir."], [1942.0, "Fiil küfür olabilir; fakat küfre düşen herkesin üzerine, şartların sabit olduğu ve mânilerin ortadan kalktığı kesinleşmedikçe küfür vâki olmaz."]]}, {"reader": false, "ar": [[1954.0, "وقد يعبّر أهل السنة عن هذه القاعدة بقولهم:"], [1959.5, "التكفير بالوصف العامّ، وبعضهم يعبّر عنها بقوله:"], [1964.7, "التكفير المطلق. فمهما اختلفت عباراتهم فإنهم يقصدون وجوب التفريق بين الكفر الذي ينطلق على القول أو الفعل أو الوصف،"], [1976.0, "والتكفير الذي ينصبّ على المعيّن ذاته وشخصه."], [1981.0, "وهذا بإجماع أهل السنة والجماعة."]], "tr": [[1954.0, "Ehl-i Sünnet bu kaideyi bazen \"genel vasıfla tekfir\" sözüyle ifade eder;"], [1959.5, "bazıları da onu \"mutlak tekfir\" sözüyle ifade eder."], [1964.7, "İbareleri ne kadar farklı olursa olsun, söze, fiile ya da vasfa yönelen küfür ile bizzat muayyen kişinin zâtına ve şahsına yönelen tekfir arasında ayrım yapmanın vacip olduğunu kastederler."], [1976.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır."]]}, {"reader": false, "ar": [[1986.0, "قال الإمام ابن تيمية رحمه الله تعالى:"], [1989.0, "«فليس لأحدٍ أن يكفّر أحدًا من المسلمين وإن أخطأ وغلط حتى تُقام عليه الحجّة وتُبيَّن له المحجّة، ومن ثبت إيمانه بيقينٍ لم يزل ذلك عنه بالشكّ، بل لا يزول إلا بعد إقامة الحجّة وإزالة الشبهة». انتهى كلامه."]], "tr": [[1986.0, "İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1989.0, "\"Hiç kimsenin Müslümanlardan birini —hata etse ve yanılsa bile— kendisine hüccet ikame edilip doğru yol açıklanmadıkça tekfir etme hakkı yoktur."], [1989.0, "İmanı yakînen sabit olan kimseden bu, şüpheyle zâil olmaz;"], [1989.0, "bilakis ancak hüccet ikame edildikten ve şüphe giderildikten sonra zâil olur.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2011.0, "وقال رحمه الله تعالى:"], [2013.8, "«لكنّ التكفير المطلق لا يستلزم تكفيرَ المعيّن؛ فإنّ بعض العلماء قد يتكلّم في مسألةٍ باجتهاده فيخطئ فيها فلا يُكفَّر، وإن كان قد يُكفَّر من قال ذلك القول إذا قامت عليه الحجّة الموجبة لتكفيره»."], [2033.0, "يعني: هما شخصان تكلّما في مسألةٍ واحدة:"], [2036.0, "أحدهما نحكم عليه بأنه كافرٌ لثبوت الشروط وانتفاء الموانع في حقّه،"], [2042.0, "وأحدهما لا نحكم عليه بأنه كافرٌ لعدم ثبوت الشروط وانتفاء الموانع في حقّه."]], "tr": [[2011.0, "—Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2013.8, "\"Fakat mutlak tekfir, muayyenin tekfirini gerektirmez."], [2013.8, "Çünkü âlimlerden biri bir meselede içtihadıyla konuşup onda hata edebilir ve tekfir edilmez;"], [2013.8, "her ne kadar o sözü söyleyen kimse, kendisine tekfirini gerektiren hüccet ikame edildiğinde tekfir edilebilse de.\" Yani:"], [2033.0, "Bunlar aynı bir meselede konuşmuş iki kişidir."], [2033.0, "Birinin kâfir olduğuna, hakkında şartlar sabit olup mâniler ortadan kalktığı için hükmederiz;"], [2036.0, "diğerinin kâfir olduğuna ise hakkında şartların sabit olup mânilerin ortadan kalkması gerçekleşmediği için hükmetmeyiz."]]}, {"reader": false, "ar": [[2050.0, "وقال رحمه الله تعالى:"], [2052.9, "«وكنتُ أُبيّن لهم» ـ يعني من يناقشه من الجهميّة وأهل البدع ـ يقول:"], [2058.5, "«وكنتُ أُبيّن لهم أنّ ما نُقل لهم عن السلف والأئمّة من إطلاق القول بتكفير من يقول كذا وكذا فهو أيضًا حقّ، لكن يجب التفريق بين الإطلاق والتعيين، وهذه أوّل مسألةٍ تنازعت فيها الأمّة من مسائل الأصول الكبار، وهي مسألة الوعيد»."]], "tr": [[2050.0, "—Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2052.9, "\"Onlara açıklıyordum\" —yani kendisiyle münakaşa eden Cehmiyye ve bid'at ehline—."], [2052.9, "Diyor ki: \"Onlara açıklıyordum ki seleften ve imamlardan kendilerine nakledilen 'Şöyle şöyle diyen kâfirdir' şeklindeki mutlak söz de haktır;"], [2058.5, "fakat mutlak (söylemek) ile tayin (belirli kişiye uygulamak) arasında ayrım yapmak vaciptir."], [2058.5, "Bu, ümmetin büyük usûl meselelerinden ihtilaf ettiği ilk meseledir;"], [2058.5, "o da va'îd (tehdit) meselesidir.\""]]}, {"reader": false, "ar": [[2081.0, "فلا بدّ من اعتقاد التفريق بين التكفير المطلق وتكفير المعيّن؛"], [2087.0, "فإسقاط الكفر على المعيّن ـ مع وقوعه فيما هو كفرٌ شرعًا ـ ليس بلازمٍ دائمًا،"], [2095.0, "لِما يعرض له من موانعَ تجعله لا يؤاخَذ بذلك،"], [2100.0, "وإن تلبّس به قولًا أو عملًا."], [2102.3, "عينُ العدل <span class=\"q\">؟ 35:02<\/span>، هذا هو العدل."], [2106.0, "انتهى كلامه رحمه الله."]], "tr": [[2081.0, "Bu yüzden mutlak tekfir ile muayyenin tekfiri arasında ayrım yapmaya inanmak gerekir."], [2081.0, "Muayyen kişiye —şer'an küfür olan bir şeye düşmüş olsa bile— küfür hükmünü indirmek her zaman lâzım değildir;"], [2087.0, "çünkü ona, söz ya da amel olarak ona bulaşmış olsa bile, bununla muaheze edilmemesini sağlayan mâniler ârız olabilir."], [2102.3, "Adaletin ta kendisi <span class=\"q\">؟<\/span>; işte adalet budur."], [2102.3, "Sözü burada bitti; Allah ona rahmet etsin."]]}]}, {"ts": "35:07", "title": "6. Külliye (devam): Ehliyet ârızaları ve \"genel tekfir genel va'îd gibidir\" aslı", "paras": [{"reader": false, "ar": [[2107.0, "قلتُ: وهذا ما يسمّى عند الأصوليّين بعوارض الأهليّة؛"], [2111.0, "يعني أنّ الله عز وجل خلقنا وجعل فينا أهليّةً،"], [2119.0, "متى ما ثبتت صفاتُها وجب التكليف،"], [2122.0, "ومتى ما انعدم شيءٌ من صفاتها سقط عنّا التكليف."], [2126.0, "فينبغي للإنسان إذا أراد أن يُصدر الحكم على أحدٍ بالكفر عينًا أن يتأكّد أوّلًا:"], [2134.5, "هل أهليّة التكليف فيه ثابتةٌ ولّا؟"], [2138.2, "ثم (هل) ثَمّ عارضٌ <span class=\"q\">؟ 35:37<\/span> يرفع عنه حكم التكفير؟"]], "tr": [[2107.0, "Derim ki: Bu, usûlcülerin \"ehliyet ârızaları\" dediği şeydir."], [2107.0, "Yani Allah Azze ve Celle bizi yarattı ve bizde bir ehliyet kıldı;"], [2111.0, "sıfatları sabit olduğunda teklif vacip olur, sıfatlarından bir şey yok olduğunda teklif bizden düşer."], [2122.0, "Bu yüzden insan birinin bizzat (şahsen) kâfir olduğuna hüküm vermek istediğinde önce şunu kesinleştirmelidir:"], [2134.5, "Onda teklif ehliyeti sabit mi, değil mi?"], [2138.2, "Sonra onun üzerinden tekfir hükmünü kaldıran bir ârıza <span class=\"q\">؟<\/span> var mı?"]]}, {"reader": false, "ar": [[2142.0, "ويقول شيخ الإسلام ابن تيمية رحمه الله:"], [2145.0, "«التكفير له شروطٌ وموانعُ قد تنتفي في حقّ المعيّن، والتكفير المطلق لا يستلزم تكفيرَ المعيّن إلا إذا وُجدت الشروط وانتفت الموانع. والدليل على هذا الأصل: الكتاب، والسنة، والإجماع، والاعتبار»."], [2162.8, "انتهى كلامه رحمه الله تعالى."]], "tr": [[2142.0, "Şeyhülislam İbn Teymiyye —Allah ona rahmet etsin— şöyle der:"], [2145.0, "\"Tekfirin şartları ve mânileri vardır;"], [2145.0, "bunlar muayyen kişi hakkında bulunmayabilir."], [2145.0, "Mutlak tekfir, şartlar bulunup mâniler ortadan kalkmadıkça muayyenin tekfirini gerektirmez."], [2145.0, "Bu aslın delili Kitap, Sünnet, icmâ ve itibardır (kıyas ve ibret).\" Sözü burada bitti;"], [2162.8, "Allah Teâlâ ona rahmet etsin."]]}, {"reader": false, "ar": [[2169.0, "وهذه القاعدة الأصيلة مبنيّةٌ على أصلٍ شرعيٍّ قائمٍ بذاته،"], [2173.0, "وهو قول أهل السنة:"], [2175.8, "إنّ التكفير العامّ كالوعيد العامّ؛"], [2180.0, "فكما أنّ الوعيد العامّ لا يستحقّه إلا من ثبتت فيه الشروط وانتفت الموانع،"], [2186.0, "فكذلك التكفير العامّ لا يجوز إنزاله على المعيّن إلا إذا ثبتت في حقّه الشروط وانتفت الموانع."]], "tr": [[2169.0, "Bu köklü kaide, kendi başına ayakta duran şer'î bir asla dayanır."], [2169.0, "O da Ehl-i Sünnet'in şu sözüdür:"], [2173.0, "Genel tekfir, genel va'îd (tehdit) gibidir."], [2175.8, "Genel va'îde ancak hakkında şartlar sabit olan ve mâniler ortadan kalkan kimse müstahak olduğu gibi, genel tekfiri de ancak hakkında şartlar sabit olup mâniler ortadan kalktığında muayyen kişiye uygulamak caizdir."]]}]}, {"ts": "36:35", "title": "6. Külliye (devam): Deliller — \"Himâr\" lakaplı sahâbî ve kendini yaktıran adam", "paras": [{"reader": false, "ar": [[2195.0, "فإن قلت: وما برهانك على هذه الكلّيّة؟"], [2199.0, "أقول ـ كما قال ابن تيمية ـ:"], [2202.6, "الكتاب، والسنة، والإجماع، والاعتبار."], [2206.0, "فمنها: ما جاء في الصحيح من حديث عمر رضي الله عنه أنّ رجلًا كان على عهد النبيّ صلى الله عليه وسلم اسمه عبد الله،"], [2218.0, "وكان يُلقَّب حمارًا، وكان كثيرًا ما يُؤتى به فيُجلد في شرب الخمر،"], [2223.0, "فسبّه رجل، فقال النبيّ صلى الله عليه وسلم:"], [2229.3, "«لا تلعنه، فوالله ما علمتُ إلا أنه يحبّ الله ورسوله»."]], "tr": [[2195.0, "Şayet \"Bu külliyeye burhanın nedir?\" dersen, derim ki —İbn Teymiyye'nin dediği gibi—:"], [2202.6, "Kitap, Sünnet, icmâ ve itibar."], [2202.6, "Bunlardan biri, Sahîh'te Ömer'in —Allah ondan razı olsun— hadisinde gelendir:"], [2206.0, "Nebî ﷺ'in zamanında Abdullah adında bir adam vardı;"], [2206.0, "\"Himâr\" diye lakaplandırılırdı. Çoğu zaman getirilir ve şarap içmekten dolayı celde vurulurdu."], [2218.0, "Bir adam ona sövdü. Bunun üzerine Nebî ﷺ şöyle buyurdu:"], [2223.0, "\"Ona lanet etme; vallahi ben onun hakkında ancak Allah'ı ve Resûlü'nü sevdiğini biliyorum.\""]]}, {"reader": false, "ar": [[2236.0, "مع أنّ النبيّ صلى الله عليه وسلم هو الذي قال:"], [2241.0, "«لُعنت الخمرةُ على عشرة أوجه»،"], [2244.6, "وذكر منها: «وشاربُها»، فشاربُها ملعون،"], [2248.0, "لكنه ملعونٌ باللعن العامّ."], [2250.0, "فلمّا انتقلت اللعنة من الوصف العامّ إلى المعيّن رفض ذلك رسول الله صلى الله عليه وسلم،"], [2257.0, "معلِّلًا ذلك بأنه لا يعلم عنه إلا أنه يحبّ الله ورسوله."]], "tr": [[2236.0, "Halbuki \"Şarap on yönden lanetlendi\" buyuran da Nebî ﷺ'dir ve bunlardan \"onu içeni\" de zikretmiştir."], [2244.6, "Onu içen lanetlidir; fakat genel lanetle lanetlidir."], [2248.0, "Lanet genel vasıftan muayyen kişiye geçince, Resûlullah ﷺ bunu reddetti ve bunun gerekçesini, onun hakkında ancak Allah'ı ve Resûlü'nü sevdiğini bilmesi olarak açıkladı."]]}, {"reader": false, "ar": [[2263.0, "قال أبو العبّاس ابن تيمية رحمه الله تعالى:"], [2267.0, "«فنهى عن لعنه مع إصراره على الشرب، لكونه يحبّ الله ورسوله صلى الله عليه وسلم، مع أنه لعن في الخمر عشرة. ولعنُ المطلق لا يستلزم لعنَ المعيّن الذي قام به ما يمنع لحوقَ اللعنة به، وكذلك التكفير المطلق والوعيد المطلق»."], [2291.0, "انتهى كلامه رحمه الله."]], "tr": [[2263.0, "Ebü'l-Abbâs İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2267.0, "\"İçkiye ısrar etmesine rağmen, Allah'ı ve Resûlü'nü ﷺ sevdiği için ona lanet etmeyi yasakladı;"], [2267.0, "halbuki şarap hususunda on kişiye lanet etmişti."], [2267.0, "Mutlak (genel) olana lanet etmek, kendisinde lanetin ona ulaşmasını engelleyen bir şey bulunan muayyene lanet etmeyi gerektirmez."], [2267.0, "Mutlak tekfir ve mutlak va'îd de böyledir.\" Sözü burada bitti; Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2293.0, "ومن الأدلّة على ذلك:"], [2294.7, "ما في الصحيح من حديث أبي هريرة رضي الله عنه في قصّة الرجل الذي قال لبنيه:"], [2301.0, "«إن أنا متُّ فأحرقوني، ثم ذرُّوني في يوم ريحٍ، نصفي في البرّ ونصفي في البحر، حتى لا يقدر عليّ ربي فيعذّبني» ـ وفي رواية:"], [2315.4, "«فوالله لئن قدر عليّ ليعذّبنّي عذابًا لم يعذّبه أحدًا من العالمين» ـ «فلمّا مات فعل به بنوه ذلك."]], "tr": [[2293.0, "Bunun delillerinden biri de Sahîh'te Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde, oğullarına şöyle diyen adamın kıssasıdır:"], [2294.7, "\"Ben ölürsem beni yakın, sonra rüzgârlı bir günde külümü savurun;"], [2301.0, "yarısı karaya, yarısı denize. Ta ki Rabbim bana güç yetirip beni azaplandırmasın.\" —Bir rivayette:"], [2301.0, "\"Vallahi eğer Rabbim bana güç yetirirse, beni âlemlerden hiç kimseye etmediği bir azapla azaplandıracaktır.\"— \"O ölünce oğulları ona bunu yaptılar."]]}, {"reader": false, "ar": [[2327.0, "فأمر الله عز وجل البحرَ فجمع ما فيه،"], [2330.0, "والبرَّ فجمع ما فيه،"], [2332.0, "فمثَل بين يدي الله عز وجل،"], [2335.0, "فقال: لِمَ فعلتَ هذا؟"], [2336.0, "قال: من خشيتك يا ربّي،"], [2338.9, "وأنت أعلم. قال: قد غفرتُ لك»."]], "tr": [[2327.0, "Allah Azze ve Celle denize emretti, o da içindekini topladı;"], [2327.0, "karaya emretti, o da içindekini topladı."], [2332.0, "(Adam) Allah Azze ve Celle'nin huzurunda dikildi."], [2335.0, "(Allah) 'Bunu niçin yaptın?' dedi."], [2335.0, "'Senin korkundan ey Rabbim; Sen daha iyi bilirsin' dedi. (Allah) 'Seni bağışladım' buyurdu.\""]]}, {"reader": false, "ar": [[2344.0, "وهذا الرجل وقع في عدّة مكفِّرات:"], [2347.0, "أوّلًا: أنّ عنده شكًّا في بعض جزئيّات القدرة،"], [2351.9, "وشكًّا في مسألة المعاد،"], [2354.0, "لا في أصله، ولكن في بعض متعلَّقاته؛"], [2358.0, "إذ لو كان لا يُثبت المعاد أصالةً لما فعل بنفسه ذلك؛"], [2363.0, "لأنّ من يكفر بالمعاد أصالةً فإنه ـ سواءٌ دُفن كاملًا أو مقطَّعًا ـ فإنه يعتقد أنه لن يُبعث أصلًا."]], "tr": [[2344.0, "Bu adam birkaç tekfir edici şeye düşmüştür:"], [2344.0, "Birincisi: Kudretin bazı cüz'î meselelerinde şüphesi vardır;"], [2347.0, "ahirete dönüş (meâd) meselesinde de —onun aslında değil, fakat bazı taalluklarında— şüphesi vardır."], [2358.0, "Çünkü eğer meâdı aslen kabul etmeseydi kendine bunu yapmazdı."], [2363.0, "Zira meâdı aslen inkâr eden kimse —ister bütün olarak ister parçalanmış olarak defnedilsin— hiç diriltilmeyeceğine inanır."]]}, {"reader": false, "ar": [[2373.0, "لكن لمّا كان مؤمنًا بأصل المعاد أراد أن يفعل بنفسه ـ أي بجثّته بعد موته ـ فعلًا يُعجز اللهَ أن يعيده لذلك اليوم."], [2384.0, "وهذا من الكفر، لكنه لم يقع عليه حكمُ فعله،"], [2389.3, "بدليل أنّ الله عز وجل قد غفر له؛"], [2394.0, "فلو مات كافرًا لما كان داخلًا في حيّز المغفرة."]], "tr": [[2373.0, "Fakat meâdın aslına iman ettiği için kendine —yani ölümünden sonra cesedine— Allah'ın onu o güne iade etmesini imkânsız kılacak (sandığı) bir şey yaptırmak istedi."], [2373.0, "Bu küfürdendir; fakat fiilinin hükmü onun üzerine vâki olmadı."], [2384.0, "Bunun delili, Allah Azze ve Celle'nin onu bağışlamış olmasıdır;"], [2394.0, "eğer kâfir olarak ölseydi mağfiret alanına girmezdi."]]}]}, {"ts": "40:01", "title": "6. Külliye (devam): İbn Teymiyye'nin açıklaması ve sevinçten yanılan adam", "paras": [{"reader": false, "ar": [[2401.0, "قال الإمام ابن تيمية رحمه الله تعالى تعليقًا على هذا الحديث:"], [2410.0, "«فإنّ التكفير المطلق ـ مثل الوعيد المطلق ـ لا يستلزم تكفيرَ المعيّن حتى تقوم عليه الحجّة التي يكفر تاركها. فهذا الرجل اعتقد أنّ الله لا يقدر على جمعه إذا فعل به ذلك، أو شكّ، وأنه لا يبعثه، وكلٌّ من هذين الاعتقادين كفرٌ يكفر به من قامت عليه الحجّة."]], "tr": [[2401.0, "İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— bu hadise yorum olarak şöyle demiştir:"], [2401.0, "\"Mutlak tekfir —mutlak va'îd gibi— terk edenin kâfir olacağı hüccet kendisine ikame edilmedikçe muayyenin tekfirini gerektirmez."], [2410.0, "Bu adam, kendisine bu yapılırsa Allah'ın onu toplamaya güç yetiremeyeceğine inandı ya da şüphe etti ve (Allah'ın) onu diriltmeyeceğine (inandı)."], [2410.0, "Bu iki inançtan her biri, kendisine hüccet ikame edilen kimsenin onunla kâfir olacağı bir küfürdür."]]}, {"reader": false, "ar": [[2443.0, "لكنّه» ـ أي هذا الرجل ـ «لكنّه كان يجهل ذلك، ولم يبلغه العلم بما يردّه عن فعله أو جهله، وكان عنده إيمانٌ بالله وبأمره ونهيه ووعده ووعيده، فخاف من عقابه، فغفر الله عز وجل له بخشيته»."], [2463.0, "انتهى كلامه رحمه الله."]], "tr": [[2443.0, "Fakat o\" —yani bu adam— \"fakat o bunu bilmiyordu;"], [2443.0, "onu fiilinden ya da cehaletinden döndürecek ilim ona ulaşmamıştı."], [2443.0, "Onda Allah'a, O'nun emrine, nehyine, vaadine ve tehdidine iman vardı;"], [2443.0, "O'nun cezasından korktu, Allah Azze ve Celle de bu korkusu sebebiyle onu bağışladı.\" Sözü burada bitti; Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2466.0, "وقال أبو العبّاس ابن تيمية رحمه الله تعالى:"], [2470.0, "«فقد يكون الفعلُ أو المقالةُ كفرًا، ويُطلق القول بتكفير من قال تلك المقالة، أو من فعل ذلك فهو كافر، لكنّ الشخص المعيّن الذي قال ذلك القول أو فعل ذلك الفعل لا يُحكم بكفره حتى تقوم عليه الحجّة التي يكفر تاركها. وهذا الأمر مطّردٌ في نصوص الوعيد عند أهل السنة والجماعة». انتهى كلامه."]], "tr": [[2466.0, "Ebü'l-Abbâs İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2470.0, "\"Fiil ya da söz küfür olabilir ve o sözü söyleyenin tekfir edildiği mutlak olarak söylenir ya da 'Bunu yapan kâfirdir' denir."], [2470.0, "Fakat o sözü söyleyen ya da o fiili yapan muayyen şahsın, terk edenin kâfir olacağı hüccet kendisine ikame edilmedikçe kâfir olduğuna hükmedilmez."], [2470.0, "Bu husus, Ehl-i Sünnet ve'l-Cemaat'e göre va'îd nasslarında istikrarlı (genel geçer) bir kaidedir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2494.0, "ومن الأدلّة أيضًا: حديث أنسٍ رضي الله عنه في قصّة الرجل الذي انفلتت منه دابّته،"], [2502.3, "فبحث عنها، فلمّا أيس من وجودها اضطجع في ظلّ شجرةٍ ينتظر الموت،"], [2508.9, "فبينا هو كذلك إذا بها قائمةٌ عنده،"], [2512.9, "وعليها طعامه وشرابه، فأخذ بخطامها وقال من شدّة الفرح:"], [2518.8, "«اللهمّ أنت عبدي وأنا ربّك»."]], "tr": [[2494.0, "Delillerden biri de Enes'in —Allah ondan razı olsun— hadisinde, hayvanı elinden kaçan adamın kıssasıdır:"], [2494.0, "Onu aradı; bulmaktan ümidini kesince bir ağacın gölgesine uzanıp ölümü beklemeye başladı."], [2502.3, "O bu hâldeyken bir de baktı ki (hayvan) yanında duruyor, üzerinde de yiyeceği ve içeceği var."], [2512.9, "Yularından tuttu ve sevincinin şiddetinden \"Allah'ım!"], [2512.9, "Sen benim kulumsun, ben de senin Rabbinim\" dedi."]]}, {"reader": false, "ar": [[2525.0, "وهذه الكلمة إذا نظرنا إليها مجرّدةً عن قائلها وما قام به من الموانع فإنها كلمةُ كفرٍ بالإجماع،"], [2534.0, "لكنّ النبيّ صلى الله عليه وسلم لم يحكم على قائلها بمقتضى حكمه على هذه الكلمة،"], [2543.0, "لوجود مانعٍ من موانع التكفير،"], [2545.1, "وهي قوله: «أخطأ من شدّة الفرح»."], [2547.7, "ومن شروط التكفير: القصدُ إلى قول الكفر أو فعله،"], [2553.0, "كما سيأتينا في كلّيّات ضوابط تكفير المعيّن إن شاء الله تعالى. ولعلّكم فهمتم هذا."]], "tr": [[2525.0, "Bu kelimeye, söyleyeninden ve onda bulunan mânilerden soyutlanmış olarak baktığımızda icmâen bir küfür kelimesidir."], [2525.0, "Fakat Nebî ﷺ, tekfir mânilerinden bir mâninin bulunması sebebiyle bu kelime hakkındaki hükmünün gereğince onu söyleyen hakkında hüküm vermedi;"], [2543.0, "o mâni de \"Sevincinin şiddetinden yanıldı\" sözüdür."], [2545.1, "Tekfirin şartlarından biri de küfür sözünü ya da fiilini kastetmektir;"], [2553.0, "inşallah muayyen tekfirinin zâbıtları külliyelerinde karşımıza gelecek. Umarım bunu anlamışsınızdır."]]}, {"reader": false, "ar": [[2562.0, "ولذلك إذا سمعتَ أهل السنة يقولون:"], [2566.0, "«من جحد ما وصف الله به نفسه كفر»،"], [2569.0, "فلا يستلزم ذلك انطباقَ هذا التكفير على كلّ جاحدٍ بعينه حتى تتأكّد من ثبوت الشروط وانتفاء الموانع."], [2577.0, "وإذا سمعتَ أهل السنة والجماعة يقولون:"], [2581.0, "«من قال بخلق القرآن فقد كفر»،"], [2584.0, "فإيّاك أن تطبّقه على كلّ معيّنٍ ممّن قال بخلق القرآن حتى تتأكّد من ثبوت الشروط وانتفاء الموانع."]], "tr": [[2562.0, "Bu yüzden Ehl-i Sünnet'in \"Allah'ın kendisini nitelediği şeyi inkâr eden kâfir olur\" dediğini işittiğinde, bu, şartların sabit olduğunu ve mânilerin ortadan kalktığını kesinleştirmedikçe bu tekfirin her bir inkârcıya şahsen uygulanmasını gerektirmez."], [2569.0, "Ehl-i Sünnet ve'l-Cemaat'in \"Kur'an'ın mahlûk olduğunu söyleyen kâfir olur\" dediğini işittiğinde, şartların sabit olduğunu ve mânilerin ortadan kalktığını kesinleştirmedikçe bunu Kur'an'ın mahlûk olduğunu söyleyenlerden her bir muayyen kişiye uygulamaktan sakın."]]}, {"reader": false, "ar": [[2592.0, "وإذا سمعتَ أهل السنة يقولون:"], [2595.5, "«من شبّه الله بخلقه فقد كفر»،"], [2601.0, "فإيّاك أن تُنزله على كلّ معيّنٍ قال بهذا الباطل إلا بعد أن تتأكّد من ثبوت الشروط وانتفاء الموانع."], [2610.0, "وهكذا في كلّ مسائل التكفير."], [2614.0, "ولذلك قلت لكم بأنّ هذه القاعدة من أعظم قواعد التكفير،"], [2619.0, "ومن أعظم وسائل النجاة من الوقوع في تكفير من لا يجوز تكفيره."]], "tr": [[2592.0, "Ehl-i Sünnet'in \"Allah'ı mahlûkatına benzeten kâfir olur\" dediğini işittiğinde, şartların sabit olduğunu ve mânilerin ortadan kalktığını kesinleştirmedikçe bunu bu bâtılı söyleyen her bir muayyen kişiye uygulamaktan sakın."], [2610.0, "Bütün tekfir meselelerinde de böyledir."], [2614.0, "Bu yüzden size bu kaidenin tekfirin en büyük kaidelerinden ve tekfiri caiz olmayanı tekfir etmeye düşmekten kurtuluşun en büyük vasıtalarından olduğunu söyledim."]]}, {"reader": false, "ar": [[2624.0, "فأوصيكم بها: أن تدرسوها،"], [2626.2, "وأن تقرؤوا كلام أهل العلم عنها كثيرًا،"], [2630.0, "حتى تكون منهجًا وهِجِّيرى لكم في تطبيق أحكام التكفير."], [2634.0, "وأمّا تلاعبُ الصبيان الذي نراه الآن،"], [2638.0, "فإنه ـ والله ـ لا يمتّ إلى الدين،"], [2640.1, "ولا إلى الشريعة، ولا إلى أصول الملّة بصلة."]], "tr": [[2624.0, "Size onu tavsiye ederim: Onu okuyun ve âlimlerin onun hakkındaki sözlerini çokça okuyun ki tekfir hükümlerini uygulamada sizin için bir metot ve dilinizden düşmeyen bir şiar olsun."], [2634.0, "Şimdi gördüğümüz çocukların oyuncağına gelince;"], [2638.0, "vallahi onun dinle, şeriatle ve milletin (İslam'ın) usûlüyle hiçbir ilgisi yoktur."]]}]}, {"ts": "44:03", "title": "7. Külliye: Teklif ehliyetinin vasıflarından birini kaybedene ceza gerektiren vasıflarla hükmedilmez", "paras": [{"reader": false, "ar": [[2643.0, "ومن الكلّيّات أيضًا: كلُّ من فقد وصفًا من أوصاف الأهليّة ـ الآن ضوابط التكفير المعيّن ـ <b>كلُّ من فقد وصفًا من أوصاف أهليّة تكليفه فلا يُحكم عليه بالأوصاف الموجبة للعقوبات.<\/b> <span class=\"note\">(يكررها)<\/span> وهذا لا نعلم فيه نزاعًا بين أهل السنة والجماعة،"], [2675.0, "لا في مسائل التكفير ولا في غيرها."]], "tr": [[2643.0, "Külliyelerden biri de şudur: Ehliyet vasıflarından bir vasfı kaybeden herkes —şimdi muayyen tekfirinin zâbıtları (başlıyor)— 7."], [2643.0, "külliye: Teklif ehliyetinin vasıflarından bir vasfı kaybeden herkes hakkında, cezaları gerektiren vasıflarla hüküm verilmez. Bunda Ehl-i Sünnet ve'l-Cemaat arasında, ne tekfir meselelerinde ne de başka meselelerde bir anlaşmazlık bilmiyoruz."]]}, {"reader": false, "ar": [[2679.0, "فإنه لا يجوز أن نحكم بشيءٍ من الأوصاف الموجبة للعقوبة ـ كالكفر،"], [2683.5, "أو الشرك، أو النفاق،"], [2685.3, "أو الإثم، أو الظلم،"], [2687.2, "أو الجور، أو الفجور ـ إلا على من كمُلت أهليّة تكليفه؛"], [2692.0, "فمتى ما فقد الإنسان شيئًا ـ ولو واحدًا ـ من أهليّة تكليفه فإننا لا نحكم عليه بشيءٍ من هذه الأوصاف."]], "tr": [[2679.0, "Çünkü ceza gerektiren vasıflardan herhangi birini —küfür, şirk, nifak, günah, zulüm, haksızlık ya da fücûr gibi— ancak teklif ehliyeti tam olan kimse hakkında hüküm olarak vermemiz caizdir."], [2687.2, "İnsan teklif ehliyetinden bir şeyi —tek bir şey bile olsa— kaybettiğinde, onun hakkında bu vasıflardan hiçbiriyle hüküm vermeyiz."]]}]}, {"ts": "45:04", "title": "7. Külliye (devam): Deli, çocuk, mükreh, uyuyan, baygın, unutan, gafil, câhil ve bunak", "paras": [{"reader": false, "ar": [[2704.0, "فيدخل في ذلك: المجنون؛"], [2706.0, "فإنه لا يجوز الحكم على المجنون بشيءٍ من الأوصاف الموجبة للعقوبات مطلقًا؛"], [2713.0, "لأنّ قلم التكليف مرفوعٌ عنه إجماعًا،"], [2716.0, "لقول النبيّ صلى الله عليه وسلم:"], [2719.0, "«رُفع القلم عن ثلاثة: عن المجنون حتى يعقل، وعن النائم حتى يستيقظ، وعن الصبيّ حتى يبلغ» ـ أو قال: «حتى يحتلم»."]], "tr": [[2704.0, "Buna şunlar girer: Deli; deli hakkında ceza gerektiren vasıflardan herhangi biriyle hiçbir şekilde hüküm vermek caiz değildir."], [2706.0, "Çünkü teklif kalemi icmâen ondan kaldırılmıştır."], [2713.0, "Nebî ﷺ'in şu sözünden dolayı:"], [2716.0, "\"Kalem üç kişiden kaldırılmıştır: Akıllanıncaya kadar deliden, uyanıncaya kadar uyuyandan ve bülûğa erinceye kadar çocuktan\" —ya da \"ihtilam oluncaya kadar\" buyurdu."]]}, {"reader": false, "ar": [[2728.0, "ومنها أيضًا: من لم يبلغ؛"], [2733.0, "فإنه لا يجوز أن ندخله تحت شيءٍ من هذه الأوصاف الموجبة للعقوبات أبدًا،"], [2742.0, "للحديث السابق. فلو صدرت كلمةُ الفسق من الصبيّ لا نفسّقه،"], [2749.0, "أو كلمةُ الكفر من الصبيّ لا نكفّره،"], [2752.0, "أو موجِبُ الظلم من الصبيّ لا نصفه بأنه ظالمٌ ظلمًا يستوجب العقوبات من الله عز وجل."], [2761.0, "وأمّا الظلم العرفيّ فهذا أمرٌ لا شأن لنا به،"], [2764.0, "لكنّنا نتكلّم عن الأوصاف الشرعية التي توجب العقوبات في الآخرة."]], "tr": [[2728.0, "Bunlardan biri de bülûğa ermemiş olandır."], [2733.0, "Önceki hadis sebebiyle onu ceza gerektiren bu vasıflardan herhangi birinin altına asla sokmamız caiz değildir."], [2742.0, "Çocuktan fısk kelimesi sâdır olsa onu tefsik etmeyiz;"], [2742.0, "çocuktan küfür kelimesi sâdır olsa onu tekfir etmeyiz;"], [2752.0, "ya da çocuktan zulmü gerektiren bir şey sâdır olsa onu, Allah Azze ve Celle'den cezaları gerektiren bir zulümle zâlim olarak nitelemeyiz."], [2761.0, "Örfî zulme gelince, bu bizi ilgilendiren bir husus değildir;"], [2764.0, "biz ahirette cezaları gerektiren şer'î vasıflardan bahsediyoruz."]]}, {"reader": false, "ar": [[2769.0, "ومنها: المكرَه ـ وستأتينا كلّيّته بعد قليلٍ إن شاء الله ـ فإنّ الإكراه من جملة عوارض الأهليّة التي ترفع التكليف؛"], [2781.0, "فإذا وقع الإنسان في موجب الكفر مكرَهًا فلا نكفّره،"], [2788.0, "أو في موجب الفسق مكرَهًا فلا نفسّقه ـ فهمتم؟"], [2794.0, "ـ أو في موجب الإثم مكرَهًا فلا نؤثّمه،"], [2798.4, "وهكذا. فكلُّ من فقد شيئًا من عوارض أهليّة تكليفه فإيّاك أن تُدخله تحت شيءٍ من هذه الأوصاف الشرعية الموجبة للعقوبة."]], "tr": [[2769.0, "Bunlardan biri de mükreh (zorlanan) kişidir —inşallah birazdan onun külliyesi karşımıza gelecek—."], [2769.0, "Çünkü ikrah, teklifi kaldıran ehliyet ârızalarındandır."], [2769.0, "İnsan zorlanarak küfrü gerektiren bir
