"], [2401.0, "فمنهجُ أهل الاتّباع هو الاستدلالُ بالربوبيّة على الألوهيّة،"], [2408.0, "وهذا أعظمُ طريقٍ يصلح أن يُستدَلّ به على إفراد الله عز وجل بالعبادة. والله أعلم."]], "tr": [[2369.0, "Şeyh Abdüllatîf b. Abdirrahmân b."], [2370.2, "Hasen —Allah hepsine rahmet etsin— şöyle demiştir:"], [2372.0, "\"Rubûbiyyet tevhidi ulûhiyyet tevhidini gerektirir."], [2374.0, "Çünkü rubûbiyyet tevhidi; ilâhiyyet, ibadet ve kasıt (yöneliş) tevhidine bir delil ve onun için bir vesiledir.\" İmam Şinkîtî —Allah ona rahmet etsin— şöyle demiştir:"], [2388.0, "\"Allah Teâlâ Kur'ân-ı Azîm'de, kâfirlerin O'nun —Celle ve Alâ— rubûbiyyetini itiraf etmeleriyle, ibadette O'nu tevhid etmenin vâcib olduğuna karşı onlara çokça delil getirir.\" Öyleyse ittibâ ehlinin metodu, rubûbiyyet ile ulûhiyyete delil getirmektir."], [2407.2, "Bu, ibadette Allah Azze ve Celle'yi birlemeye delil getirmek için elverişli olan en büyük yoldur. Allah en iyisini bilir."]]}]}, {"ts": "40:16", "title": "6. Külliye: Ulûhiyyeti ikrar eden herkes zımnen rubûbiyyeti de ikrar etmiştir", "paras": [{"reader": false, "ar": [[2416.0, "ومن الكلّيّات أيضًا: <b>كلُّ من أقرّ بالألوهيّة فمُقِرٌّ ضمنًا بالربوبيّة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2416.0, "Külliyelerden biri de şudur: 6."], [2418.0, "külliye: Ulûhiyyeti ikrar eden herkes, zımnen rubûbiyyeti de ikrar etmiştir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2427.0, "أقول وبالله التوفيق: لا بدّ أن نذكر جُمَلًا من الفروق الجوهريّة بين توحيد الربوبيّة وتوحيد الألوهيّة،"], [2440.0, "وسيدخل في بيان الفروق شرحُ هذه الكلّيّة إن شاء الله تعالى."], [2446.0, "فأقول: اعلم أنّ أهل السنة والجماعة قد فرّقوا بين التوحيدين بجُمَلٍ من المتعلّقات."]], "tr": [[2427.0, "Tevfik Allah'tandır, derim ki: Rubûbiyyet tevhidi ile ulûhiyyet tevhidi arasındaki esaslı farklardan bir kısmını mutlaka zikretmemiz gerekir;"], [2440.5, "inşallah bu külliyenin şerhi de farkların açıklanmasına dahil olacaktır."], [2446.0, "Derim ki: Bil ki Ehl-i Sünnet ve'l-Cemaat iki tevhid arasını bir dizi taallukla (yönle) ayırmışlardır."]]}, {"reader": false, "ar": [[2454.0, "المتعلَّقُ الأوّل: من جهة الاشتقاق؛"], [2458.0, "فالربوبيّةُ مشتقّةٌ من اسم الربّ،"], [2463.0, "كما قال صاحبُ «الصحاح»:"], [2467.0, "«ربُّ كلّ شيءٍ: مالكُه»؛"], [2472.0, "فالربوبيّة مشتقّةٌ من الملك والخلق والتدبير."], [2477.0, "وأمّا الألوهيّة فإنها مشتقّةٌ من:"], [2480.6, "أَلَهَ يَأْلَهُ إِلاهةً وتألُّهًا؛"], [2489.0, "أي: عَبَدَ، كما قال الراجز:"], [2493.0, "«للهِ دَرُّ الغانياتِ المُدَّهِ ... سَبَّحْنَ واسترجَعْنَ من تألُّهي»؛"], [2502.0, "أي: من تعبُّدي. ففرقانٌ بين توحيد الربوبيّة والألوهيّة في أصل الاشتقاق؛"], [2508.0, "فالأوّل يرجع إلى الملك والتدبير،"], [2511.6, "والثاني يرجع إلى العبادة."]], "tr": [[2454.0, "Birinci taalluk: İştikak (kelimenin türeyişi) yönünden."], [2458.0, "Rubûbiyyet, \"Rab\" isminden türemiştir. Nitekim es-Sıhâh'ın sahibi şöyle demiştir:"], [2467.0, "\"Her şeyin Rabbi, onun mâlikidir (sahibidir).\" Rubûbiyyet, mülk, yaratma ve idareden türemiştir."], [2477.0, "Ulûhiyyet ise \"elehe ye'lehu ilâheten ve teellühen\" kökünden türemiştir;"], [2480.6, "yani \"ibadet etti\" demektir. Nitekim recez şairi şöyle demiştir:"], [2489.0, "\"Allah'a andolsun, ne güzeldir o övgüye değer güzel kadınlar;"], [2493.0, "benim teellühümü (ibadetimi) görünce tesbih ettiler ve istircâ ettiler.\" Yani ibadetimden."], [2502.0, "İşte rubûbiyyet tevhidi ile ulûhiyyet tevhidi arasında iştikakın aslında fark vardır:"], [2508.0, "Birincisi mülke ve idareye, ikincisi ibadete döner."]]}]}, {"ts": "41:57", "title": "İki tevhid arasındaki farklar: Taalluk ve ikrar yönünden", "paras": [{"reader": false, "ar": [[2517.0, "ومن الفروق أيضًا: من جهة المتعلَّق؛"], [2526.0, "فإنّ توحيد الربوبيّة يتعلّق بأفعال الله عز وجل،"], [2533.0, "فإذا تكلّمنا عن توحيد الربوبيّة فإنما نذكر في ضمنه شيئًا من أفعال الله تبارك وتعالى؛"], [2541.6, "كالملك والخلق والتدبير والتصريف والنفع والضرّ والإحياء والإماتة؛"], [2550.0, "فتوحيد الربوبيّة يرجع متعلَّقُه إلى فعل الله تبارك وتعالى."], [2555.0, "وأمّا توحيد الألوهيّة فإنّ متعلَّقه أفعالُ العباد التي تصدر منهم؛"], [2563.0, "فإذا تكلّمنا عن توحيد الألوهيّة فإنما نتكلّم عن ركوع العباد،"], [2569.0, "وذبح العباد، ورجاء العباد،"], [2571.8, "وسجود العباد، ودعاء العباد،"], [2574.5, "واستغاثة العباد ونحوها. ففرقانٌ بين التوحيدين باعتبار المتعلَّق أيضًا."]], "tr": [[2517.0, "Farklardan biri de taalluk yönündendir."], [2526.0, "Rubûbiyyet tevhidi Allah Azze ve Celle'nin fiilleriyle ilgilidir."], [2533.0, "Rubûbiyyet tevhidinden bahsettiğimizde, onun içinde Allah Tebâreke ve Teâlâ'nın fiillerinden bir kısmını zikrederiz:"], [2541.6, "Mülk, yaratma, idare, tasarruf, fayda, zarar, diriltme ve öldürme gibi."], [2550.0, "Rubûbiyyet tevhidinin taalluku Allah Tebâreke ve Teâlâ'nın fiiline döner."], [2555.0, "Ulûhiyyet tevhidinin taalluku ise kullardan sâdır olan fiilleridir."], [2563.0, "Ulûhiyyet tevhidinden bahsettiğimizde kulların rükûundan, kulların kurban kesmesinden, kulların ümidinden, kulların secdesinden, kulların duasından, kulların istiğasesinden ve benzerlerinden bahsederiz."], [2577.0, "İşte iki tevhid arasında taalluk itibarıyla da fark vardır."]]}, {"reader": false, "ar": [[2581.0, "وكذلك نقول: يختلفان من جهة الإقرار وما يترتّب عليه،"], [2589.0, "وهو شرحُ كلّيّتنا؛ فإنّ توحيد الربوبيّة أقرّ به عامّةُ المشركين وأهلِ الكفر،"], [2600.0, "ولم يشذّ منهم إلا النَّزْرُ اليسير من أهل الإلحاد."], [2605.0, "وهذا الإقرار إقرارٌ إجماليّ،"], [2607.8, "وإن كان في بعض تفاصيله مخالفةٌ من بعض المشركين والكفرة،"], [2615.0, "إلا أنهم بإقرارهم به لم يُحكَم لهم بالإسلام."], [2625.0, "فمن أقرّ بمقتضيات توحيد الربوبيّة فقط ولم ينطق بكلمة التوحيد فإنه لا يزال على كفره مهما كان إقرارُه؛"], [2636.0, "فإنّ المشركين كانوا يُقرّون به،"], [2639.1, "ومع ذلك حكم الشارعُ عليهم بأنهم كفّارٌ ومشركون."]], "tr": [[2581.0, "Aynı şekilde deriz ki: İkisi, ikrar ve ona terettüp eden (sonuç) yönünden farklıdır;"], [2594.0, "bu da külliyemizin şerhidir. Rubûbiyyet tevhidini müşriklerin ve küfür ehlinin geneli ikrar etmiştir;"], [2600.0, "onlardan ilhad (inkârcılık) ehlinden pek az bir kısım dışında kimse ayrı düşmemiştir."], [2605.0, "Bu ikrar icmâlî (genel) bir ikrardır;"], [2608.5, "bazı ayrıntılarında bazı müşrik ve kâfirlerin muhalefeti olsa da."], [2614.2, "Ancak onlar bunu ikrar etmekle Müslüman oldukları hükmüne varılmamıştır."], [2625.0, "Sadece rubûbiyyet tevhidinin gereklerini ikrar edip kelime-i tevhidi telaffuz etmeyen kimse, ikrarı ne olursa olsun küfrü üzerinde kalmaya devam eder."], [2636.0, "Çünkü müşrikler onu ikrar ediyorlardı;"], [2638.5, "buna rağmen Şâri' onların kâfir ve müşrik olduklarına hükmetti."]]}, {"reader": false, "ar": [[2644.0, "وأمّا توحيد الألوهيّة فإنّ من أقرّ به فإنه يكون معصومَ الدم والمال،"], [2652.4, "محكومًا له بالإسلام، محكومًا له بالإسلام."], [2658.0, "وهذا فيه ردٌّ على المتكلّمين النُّظّار الذين يجعلون أعظمَ ما ينبغي فناءُ العباد فيه هو توحيدُ الربوبيّة والنظرُ في الملكوت فقط."]], "tr": [[2644.0, "Ulûhiyyet tevhidine gelince, onu ikrar eden kimsenin kanı ve malı korunmuş olur;"], [2652.4, "Müslüman olduğuna hükmedilir, Müslüman olduğuna hükmedilir."], [2658.0, "Bunda, kulların kendini içinde fâni kılması (tamamen vermesi) gereken en büyük şeyi sadece rubûbiyyet tevhidi ve melekûta bakmak (nazar) olarak gören nazar ehli kelâmcılara bir reddiye vardır."]]}]}, {"ts": "44:40", "title": "Delil ve medlûl, kan ve malın korunması, delâlet yönünden farklar", "paras": [{"reader": false, "ar": [[2680.0, "ومن الفروق بينهما: باعتبار الوسيـ..."], [2681.4, "التفريقُ بينهما باعتبار الدليل والمدلول؛"], [2688.0, "فإنّ توحيد الربوبيّة عبارةٌ عن دليل؛"], [2693.0, "أي: أنه وسيلةٌ للوصول إلى غيره،"], [2696.0, "وليس مقصودًا في ذاته."], [2698.0, "وأمّا توحيد الألوهيّة فإنه مدلولُ الدليل وما يلزم منه،"], [2705.1, "وهو مقصودٌ في ذاته؛"], [2708.0, "ففرقانٌ بين الوسيلة والمقصود."], [2711.0, "فالله عز وجل إذا قرّر شيئًا من مقتضيات ربوبيّته فإنه لا يقرّرها تقريرَ أصالة،"], [2719.0, "وإنما يقرّرها على أنها دليلٌ ووسيلةٌ للوصول إلى ما وراءها من توحيد الألوهيّة."]], "tr": [[2680.0, "İkisi arasındaki farklardan biri de vesi… (düzelterek:) ikisi arasında delil ve medlûl (delil gösterilen şey) itibarıyla ayırımdır."], [2693.0, "Rubûbiyyet tevhidi bir delilden ibarettir;"], [2694.5, "yani başkasına ulaşmak için bir vesiledir, bizzat kendisi maksat değildir."], [2698.0, "Ulûhiyyet tevhidi ise delilin medlûlü ve ondan lâzım gelen şeydir;"], [2704.4, "o bizzat maksattır. Vesile ile maksat arasında fark vardır."], [2711.0, "Allah Azze ve Celle rubûbiyyetinin gereklerinden bir şeyi yerleştirdiğinde onu asıl olarak yerleştirmez;"], [2718.4, "ancak onun ötesindeki ulûhiyyet tevhidine ulaşmak için bir delil ve vesile olarak yerleştirir."]]}, {"reader": false, "ar": [[2726.0, "وبناءً على ذلك: فالذين يتكلّمون في آيات إعجاز الكون وما يتعلّق بذلك،"], [2733.0, "إن كان هذا الكلام لا يوصلهم إلى توحيد الألوهيّة فإنهم قد أعرَوا الدليلَ عن مدلوله،"], [2741.2, "وأخلَوا الوسيلةَ عن مقصودها."], [2744.0, "وكلُّ آيةٍ فيها الأمرُ بالتفكّر في خلق السماوات والأرض فإنما يُراد به التفكّرُ الذي يكون دليلًا على ما وراءه من الإقرار بتوحيد الألوهيّة. أظنّ الكلامَ واضحًا."]], "tr": [[2726.0, "Buna göre: Kâinattaki i'câz ayetleri ve bununla ilgili konular hakkında konuşanlar, eğer bu konuşma onları ulûhiyyet tevhidine ulaştırmıyorsa, delili medlûlünden soyutlamış, vesileyi maksadından boşaltmış olurlar."], [2744.0, "Göklerin ve yerin yaratılışı hakkında tefekkür emri bulunan her ayette kastedilen, onun ötesindeki ulûhiyyet tevhidini ikrara delil olan tefekkürdür. Sanırım söz açıktır."]]}, {"reader": false, "ar": [[2760.0, "ومنها أيضًا، ومنها أيضًا:"], [2765.4, "التفريقُ بينهما باعتبار عصمة الدم والمال؛"], [2771.0, "فإنّ من أقرّ بتوحيد الربوبيّة فقط فإنّ إقراره به لا يعصم دمَه ومالَه إجماعًا،"], [2779.0, "وأمّا من أقرّ بتوحيد الألوهيّة فإنّ إقراره به يعصم دمَه ومالَه إلا بحقّه،"], [2790.0, "كما قال النبيّ ﷺ: «فإذا قالوها عصموا منّي دماءَهم وأموالَهم إلا بحقّ الإسلام، وحسابُهم على الله»."]], "tr": [[2760.0, "Farklardan biri de, farklardan biri de:"], [2765.4, "İkisi arasında kanın ve malın korunması itibarıyla ayırımdır."], [2771.0, "Sadece rubûbiyyet tevhidini ikrar eden kimsenin bu ikrarı icmâen onun kanını ve malını korumaz."], [2777.9, "Ulûhiyyet tevhidini ikrar edenin ise bu ikrarı, hakkı (gereği) hariç, onun kanını ve malını korur."], [2786.4, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [2793.0, "\"Onu söyledikleri zaman, İslam'ın hakkı hariç, kanlarını ve mallarını benden korumuş olurlar; hesapları ise Allah'a kalmıştır.\""]]}, {"reader": false, "ar": [[2802.0, "ومن الفروق أيضًا: التفريقُ بينهما باعتبار الدلالة؛"], [2810.0, "فإنّ دلالة توحيد الربوبيّة دلالةٌ علميّة؛"], [2815.0, "أي: أنّ الله يريد منك أن تعلم أنّ من ربوبيّته كذا وكذا،"], [2819.0, "ولذلك يسمّيه العلماءُ بتوحيد المعرفة والإثبات؛"], [2826.0, "فمقتضيات توحيد الربوبيّة علميّة."], [2830.0, "وأمّا توحيد الألوهيّة فمقتضياته عمليّة؛"], [2834.0, "فالله يريد منّا في ألوهيّته أن يصدر منّا عملٌ،"], [2838.0, "وهو العبادةُ وإفرادُه عز وجل بها وحده لا شريك له فيها."], [2845.0, "فمدلولُ توحيد الربوبيّة علميّ،"], [2852.0, "ومدلولُ توحيد الإلهيّة عمليّ."]], "tr": [[2802.0, "Farklardan biri de ikisi arasında delâlet itibarıyla ayırımdır."], [2810.0, "Rubûbiyyet tevhidinin delâleti ilmî bir delâlettir;"], [2815.0, "yani Allah senden, rubûbiyyetinden şunun ve şunun olduğunu bilmeni ister."], [2818.0, "Bu yüzden âlimler onu \"marifet ve isbat tevhidi\" diye isimlendirirler."], [2826.0, "Rubûbiyyet tevhidinin gerekleri ilmîdir. Ulûhiyyet tevhidinin gerekleri ise amelîdir;"], [2834.0, "Allah ulûhiyyetinde bizden bir amel sâdır olmasını ister:"], [2837.1, "O da ibadet ve ibadette ortağı olmaksızın yalnız O'nu —Azze ve Celle— birlemektir."], [2845.0, "Rubûbiyyet tevhidinin medlûlü ilmî, ilâhiyyet tevhidinin medlûlü amelîdir."]]}, {"reader": false, "ar": [[2856.0, "وبناءً على ذلك صدق قولُنا في الكلّيّة:"], [2859.0, "بأنّ من أقرّ بتوحيد الألوهيّة فإنّ الإقرار به يدخل فيه ضمنًا إيمانُه بالربوبيّة؛"], [2867.0, "إذ إنه لم يوحّد اللهَ في عبادته إلا لأنه الربُّ المستحقّ في ربوبيّته. والله أعلى وأعلم."]], "tr": [[2856.0, "Buna göre külliyedeki sözümüz doğru çıktı:"], [2859.0, "Ulûhiyyet tevhidini ikrar eden kimsenin bu ikrarına, zımnen rubûbiyyete imanı da dahildir."], [2867.0, "Zira o, Allah'ı ibadetinde ancak rubûbiyyetinde (ibadete) müstahak Rab olduğu için tevhid etmiştir."], [2871.3, "Allah en yüce olandır ve en iyi bilendir."]]}, {"reader": false, "ar": [[2876.0, "وصلّى الله وسلّم على نبيّنا."]], "tr": [[2876.0, "Allah Peygamberimize salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);

});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
