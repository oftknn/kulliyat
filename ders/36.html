<script>
const D={"no": 36, "vid": "m6lwcqZAddw", "title_ar": "الدرس (٣٦) من شرح كليات العقيدة — اتخاذ الوسائط ومن كليات توحيد الألوهية", "title_tr": "Şerhu Külliyyâti'l-Akîde — 36. Ders: Vasıtalar Edinmek ve Ulûhiyyet Tevhidi Külliyeleri (İbadetin Allah'ın Hâlis Hakkı Oluşu, Kelime-i Tevhidin Tefsiri, Resullerin Daveti, Rubûbiyyetin Ulûhiyyeti Gerektirmesi, İki Tevhid Arasındaki Farklar)", "sections": [{"ts": "00:00", "title": "1. Külliye: Allah ile kendisi arasında vasıtalar edinen icmâen kâfir olur", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.4, "والصلاةُ والسلامُ على رسول الله الأمين،"], [3.5, "وعلى آله وأصحابه الطيبين الطاهرين،"], [5.2, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [7.3, "أمّا بعد: أظنُّ وقفنا عند الكلّيّة التي تقول:"], [11.8, "<b>كلُّ من جعل بينه وبين الله وسائطَ يدعوهم ويسألهم ويتوكّل عليهم كفر إجماعًا.<\/b> وكتبتموها فيما أظنّ، والله أعلم."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.4, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [8.0, "Bundan sonra: Sanırım şu külliyede kalmıştık:"], [10.6, "<b>1. külliye: Allah ile kendisi arasında, kendilerine dua ettiği, kendilerinden istediği ve kendilerine tevekkül ettiği vasıtalar edinen herkes icmâen kâfir olur.<\/b> Sanırım onu yazmıştınız. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[24.0, "أقول وبالله التوفيق: وهذا أصلُ دين المشركين."], [29.0, "فإذا قيل لك: ما أصلُ الدين؟"], [31.0, "ما أصلُ الشرك؟ فقل:"], [33.4, "هو اتّخاذُ الوسائط فيما بين العبد وبين ربّه عز وجل."], [37.0, "فقد كان المشركون يعتقدون أنّ معبوداتِهم التي أشركوا بها مع الله عز وجل تملك بعضَ التصرّف في الكون،"], [45.0, "وكانوا بسببيّة ذلك يصرفون لها كثيرًا من التعبّدات التي لا يجوز صرفُها إلا لله عز وجل."]], "tr": [[24.0, "Tevfik Allah'tandır, derim ki: Bu, müşriklerin dininin aslıdır."], [29.0, "Sana \"Dinin aslı nedir? Şirkin aslı nedir?\" denilirse de ki:"], [33.0, "O, kul ile Rabbi Azze ve Celle arasında vasıtalar edinmektir."], [37.0, "Müşrikler, Allah Azze ve Celle'ye ortak koştukları mabudlarının kâinatta bir kısım tasarrufa sahip olduğuna inanırlardı."], [44.8, "Bu sebeple onlara, Allah Azze ve Celle'den başkasına yöneltilmesi caiz olmayan birçok taabbudu yöneltirlerdi."]]}, {"reader": false, "ar": [[52.0, "وقد كان الناسُ على التوحيد فيما بين آدمَ ونوحٍ عشرةَ قرون،"], [61.0, "كما نصّ على ذلك ابنُ عبّاسٍ وغيرُه في تفسير قول الله عز وجل:"], [68.0, "<span class=\"ayah\">﴿وَقَالُوا لَا تَذَرُنَّ آلِهَتَكُمْ وَلَا تَذَرُنَّ وَدًّا وَلَا سُوَاعًا وَلَا يَغُوثَ وَيَعُوقَ وَنَسْرًا﴾<\/span> <span class=\"ref\">[نوح: ٢٣]<\/span>."], [74.0, "فلمّا هلك أولئك جاء الشيطانُ وقال لأقوامهم ـ وقد جزعوا عليهم ـ:"], [81.4, "انصِبوا إلى مجالسهم التي كانوا يجلسون فيها أنصابًا،"], [85.0, "وسمُّوها بأسمائهم؛ ففعلوها ولم تُعبَد،"], [87.0, "ثم لمّا هلك أولئك ونُسي العلمُ عُبِدت من دون الله عز وجل."], [93.0, "فأصلُ دين المشركين هو اتّخاذُ هذه الوسائط فيما بينهم وبين الله عز وجل."]], "tr": [[52.0, "İnsanlar Âdem ile Nûh arasında on asır tevhid üzere idiler."], [58.8, "Nitekim İbn Abbâs ve başkaları, Allah Azze ve Celle'nin şu sözünün tefsirinde bunu açıkça belirtmişlerdir:"], [68.0, "<span class=\"ayah\">﴿Dediler ki: Sakın ilahlarınızı bırakmayın; Vedd'i, Suvâ'ı, Yeğûs'u, Ye'ûk'u ve Nesr'i de bırakmayın﴾<\/span> [Nûh 23]."], [74.0, "O (salih) kimseler ölünce şeytan, onlar için derin bir üzüntüye kapılmış olan kavimlerine gelip dedi ki:"], [81.4, "\"Onların oturdukları meclislere dikili taşlar (heykeller) dikin ve onlara onların isimlerini verin.\" Onlar da bunu yaptılar, fakat (o heykellere) ibadet edilmedi."], [87.5, "Sonra o (nesil) de ölüp ilim unutulunca, Allah Azze ve Celle'yi bırakıp onlara ibadet edildi."], [93.0, "O hâlde müşriklerin dininin aslı, kendileriyle Allah Azze ve Celle arasında bu vasıtaları edinmektir."]]}, {"reader": false, "ar": [[99.0, "ومن المعلوم بإجماع أهل السنة والجماعة أنّ المشركين لم يكن الدافعُ لعبادة هذه الأصنام والأوثان أنهم كانوا يعتقدون فيها أنها تخلُق ولا خالقَ إلا هي،"], [112.0, "أو أنها ترزُق ولا رازقَ إلا هي،"], [115.0, "أو أنها تملِك ولا مالكَ إلا هي،"], [118.0, "أو أنها تدبّر وتتصرّف في الكون ولا مدبّرَ ولا متصرّفَ في الكون إلا هي؛"], [123.0, "فإنّ هذا لم يكن هو الحاملَ لهم،"], [127.0, "وإنما كان الحاملُ لهم هو جعلَها وسائطَ بينهم وبين الله عز وجل."], [132.0, "فقد كان الواحدُ منهم لا يرفع دعاءه إلى الله عز وجل،"], [137.0, "وإنما يعتقد وجوبَ اتّخاذ هذه الواسطة التي توصل أمرَه ودعاءه إلى الله تبارك وتعالى."]], "tr": [[99.0, "Ehl-i Sünnet ve'l-Cemaat'in icmâıyla bilinmektedir ki müşrikleri bu putlara ve heykellere ibadete sevk eden şey, onların yarattığına ve onlardan başka yaratıcı olmadığına, rızık verdiğine ve onlardan başka rızık veren olmadığına, mülke sahip olduğuna ve onlardan başka mâlik olmadığına ya da kâinatı idare edip onda tasarruf ettiğine ve onlardan başka kâinatı idare eden ve onda tasarruf eden olmadığına inanmaları değildi."], [123.0, "Onları buna sevk eden bu değildi;"], [126.4, "onları buna sevk eden, onları kendileriyle Allah Azze ve Celle arasında vasıtalar kılmalarıydı."], [132.0, "Onlardan biri duasını (doğrudan) Allah Azze ve Celle'ye yükseltmezdi;"], [136.1, "aksine işini ve duasını Allah Tebâreke ve Teâlâ'ya ulaştıracak bu vasıtayı edinmenin gerekli olduğuna inanırdı."]]}, {"reader": false, "ar": [[144.0, "وقد كانوا يعتقدون في أوثانهم أنّ لها منزلةً عند الله عز وجل،"], [149.1, "وأنها تقرّبهم إليه زُلفى،"], [151.7, "وأنها تشفع، وأنها تشفع لهم عنده،"], [156.0, "كما قال الله عز وجل مبيّنًا أصلَ سببيّة الشرك في قوله عز وجل:"], [162.0, "<span class=\"ayah\">﴿وَالَّذِينَ اتَّخَذُوا مِن دُونِهِ أَوْلِيَاءَ مَا نَعْبُدُهُمْ إِلَّا لِيُقَرِّبُونَا إِلَى اللَّهِ زُلْفَىٰ﴾<\/span> <span class=\"ref\">[الزمر: ٣]<\/span>،"], [171.0, "ويقول الله عز وجل:"], [172.0, "<span class=\"ayah\">﴿وَيَعْبُدُونَ مِن دُونِ اللَّهِ مَا لَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ وَيَقُولُونَ هَٰؤُلَاءِ شُفَعَاؤُنَا عِندَ اللَّهِ﴾<\/span> <span class=\"ref\">[يونس: ١٨]<\/span>."]], "tr": [[144.0, "Putlarının Allah Azze ve Celle katında bir mertebesi olduğuna, kendilerini O'na iyice yaklaştırdığına, şefaat ettiğine, O'nun katında kendilerine şefaat ettiğine inanırlardı."], [156.0, "Nitekim Allah Azze ve Celle şirkin sebebinin aslını açıklayarak şöyle buyurur:"], [162.0, "<span class=\"ayah\">﴿O'nu bırakıp velîler edinenler (derler ki): Biz onlara, bizi Allah'a iyice yaklaştırsınlar diye ibadet ediyoruz﴾<\/span> [Zümer 3]."], [170.2, "Allah Azze ve Celle şöyle buyurur:"], [172.0, "<span class=\"ayah\">﴿Allah'ı bırakıp kendilerine ne zarar ne de fayda veremeyen şeylere ibadet ediyorlar ve \"Bunlar Allah katında bizim şefaatçilerimizdir\" diyorlar﴾<\/span> [Yûnus 18]."]]}, {"reader": false, "ar": [[181.0, "مع أنّ المشركين كانوا يُقرّون بتوحيد الربوبيّة وبكثيرٍ من متعلّقاته،"], [187.0, "إلا أنهم كانوا يرون وجوبَ اتّخاذ هذه الواسطة،"], [191.0, "وأنه لا حقَّ لهم أن يصلوا إلى الله عز وجل بدون هذه الواسطة؛"], [197.0, "بمنزلة الملِك الذي له حُجّابٌ عند بابه،"], [202.0, "فلا يستطيع من هو خارجَ القصر أن يدخل على الملك إلا بوساطة هؤلاء الحُجّاب،"], [210.0, "وعلى قدر تقرّبك لهؤلاء الحُجّاب على قدر إيصالهم ما تريد لهذا الملك."], [219.0, "فقد شُبِّه اللهُ عز وجل بالبشر في الدخول عليه."]], "tr": [[181.0, "Müşrikler rubûbiyyet tevhidini ve onun taalluklarının birçoğunu ikrar etmelerine rağmen, bu vasıtayı edinmenin gerekli olduğunu ve bu vasıta olmadan Allah Azze ve Celle'ye ulaşmaya haklarının olmadığını düşünüyorlardı."], [197.0, "Bu, kapısında perdedarları (kapıcıları) bulunan bir hükümdar gibidir:"], [203.1, "Sarayın dışındaki kimse ancak bu perdedarların aracılığıyla hükümdarın huzuruna girebilir;"], [209.4, "bu perdedarlara ne kadar yakınlaşırsan, istediğini bu hükümdara o kadar ulaştırırlar."], [219.0, "Böylece huzuruna girme hususunda Allah Azze ve Celle beşere benzetilmiş oldu."]]}, {"reader": false, "ar": [[224.0, "وهذا الناقضُ ـ وللأسف ـ هو الذي يقع فيه كثيرٌ ممّن ينتسب إلى الإسلام في هذا الزمان؛"], [235.0, "فجعلوا بينهم وبين الله وسائطَ كما فعل كفّارُ قريشٍ ومن بعدهم،"], [241.0, "فعظّموا الأضرحةَ والمزاراتِ وتقرّبوا إليها بالذبح،"], [248.0, "وسألوها قضاءَ الحوائج لتشفع لهم عند الله عز وجل،"], [253.0, "زاعمين أنّ هذه الأضرحة والقبور والأموات والمزارات من جملة الوسائط فيما بينهم وبين الله عز وجل."]], "tr": [[224.0, "Ne yazık ki bu nâkız (İslam'ı bozan şey), bu zamanda İslam'a nispet edilen birçok kimsenin düştüğü şeydir."], [235.0, "Kureyş kâfirlerinin ve onlardan sonrakilerin yaptığı gibi kendileriyle Allah arasında vasıtalar edindiler."], [239.9, "Türbeleri ve ziyaretgâhları tazim ettiler, kurban keserek onlara yaklaştılar ve Allah Azze ve Celle katında kendilerine şefaat etsinler diye onlardan ihtiyaçlarının giderilmesini istediler."], [254.5, "Bu türbelerin, kabirlerin, ölülerin ve ziyaretgâhların, kendileriyle Allah Azze ve Celle arasındaki vasıtalardan olduğunu iddia ettiler."]]}, {"reader": false, "ar": [[263.0, "يقول الله عز وجل:"], [265.8, "<span class=\"ayah\">﴿قُلِ ادْعُوا الَّذِينَ زَعَمْتُم مِّن دُونِ اللَّهِ ۖ لَا يَمْلِكُونَ مِثْقَالَ ذَرَّةٍ فِي السَّمَاوَاتِ وَلَا فِي الْأَرْضِ وَمَا لَهُمْ فِيهِمَا مِن شِرْكٍ وَمَا لَهُ مِنْهُم مِّن ظَهِيرٍ﴾<\/span> <span class=\"ref\">[سبأ: ٢٢]<\/span>،"], [277.0, "وبقي أمرٌ واحد فأبطله الله عز وجل بقوله:"], [281.0, "<span class=\"ayah\">﴿وَلَا تَنفَعُ الشَّفَاعَةُ عِندَهُ إِلَّا لِمَنْ أَذِنَ لَهُ﴾<\/span> <span class=\"ref\">[سبأ: ٢٣]<\/span>."], [284.0, "فكثيرٌ من شرك أهل هذا الزمان إنما هو باتّخاذ هذه الواسطة فيما بينهم وبين الله عز وجل."]], "tr": [[263.0, "Allah Azze ve Celle şöyle buyurur:"], [265.8, "<span class=\"ayah\">﴿De ki: Allah'ı bırakıp (ilah) zannettiklerinizi çağırın! Onlar ne göklerde ne de yerde zerre ağırlığınca bir şeye sahip değillerdir; ikisinde de hiçbir ortaklıkları yoktur; O'nun onlardan bir yardımcısı da yoktur﴾<\/span> [Sebe' 22]."], [278.5, "Geriye tek bir şey kaldı;"], [281.0, "Allah Azze ve Celle onu da şu sözüyle iptal etti:"], [284.0, "<span class=\"ayah\">﴿O'nun katında, izin verdiği kimseden başkasının şefaati fayda vermez﴾<\/span> [Sebe' 23]."], [288.8, "Bu zamanın insanlarının şirkinin çoğu, kendileriyle Allah Azze ve Celle arasında bu vasıtayı edinmekle olmaktadır."]]}, {"reader": false, "ar": [[294.0, "يقول الله عز وجل:"], [297.0, "<span class=\"ayah\">﴿وَمَنْ أَضَلُّ مِمَّن يَدْعُو مِن دُونِ اللَّهِ مَن لَّا يَسْتَجِيبُ لَهُ إِلَىٰ يَوْمِ الْقِيَامَةِ وَهُمْ عَن دُعَائِهِمْ غَافِلُونَ وَإِذَا حُشِرَ النَّاسُ كَانُوا لَهُمْ أَعْدَاءً وَكَانُوا بِعِبَادَتِهِمْ كَافِرِينَ﴾<\/span> <span class=\"ref\">[الأحقاف: ٥-٦]<\/span>."], [309.0, "هذا هو شركُ اتّخاذ الوسائط،"], [310.5, "هذا شركُ اتّخاذ الوسائط."]], "tr": [[294.0, "Allah Azze ve Celle şöyle buyurur:"], [297.0, "<span class=\"ayah\">﴿Allah'ı bırakıp da kıyamet gününe kadar kendisine cevap veremeyecek olanlara dua edenden daha sapık kim vardır? Onlar bunların dualarından habersizdirler. İnsanlar (mahşerde) toplandığı zaman onlar bunlara düşman olurlar ve onların ibadetlerini inkâr ederler﴾<\/span> [Ahkâf 5-6]."], [309.4, "İşte vasıtalar edinme şirki budur, vasıtalar edinme şirki budur."]]}]}, {"ts": "05:11", "title": "1. Külliyenin şerhi (devam): Vasıtaların ve şefaat iddiasının reddi", "paras": [{"reader": false, "ar": [[311.0, "ويقول الله عز وجل:"], [314.0, "<span class=\"ayah\">﴿لَهُ دَعْوَةُ الْحَقِّ ۖ وَالَّذِينَ يَدْعُونَ مِن دُونِهِ﴾<\/span> ـ أي:"], [318.8, "يتّخذونهم واسطةً فيما بينهم وبين الله ـ <span class=\"ayah\">﴿لَا يَسْتَجِيبُونَ لَهُم بِشَيْءٍ إِلَّا كَبَاسِطِ كَفَّيْهِ إِلَى الْمَاءِ لِيَبْلُغَ فَاهُ وَمَا هُوَ بِبَالِغِهِ ۚ وَمَا دُعَاءُ الْكَافِرِينَ إِلَّا فِي ضَلَالٍ﴾<\/span> <span class=\"ref\">[الرعد: ١٤]<\/span>."], [333.0, "ويقول الله عز وجل:"], [334.8, "<span class=\"ayah\">﴿وَالَّذِينَ تَدْعُونَ مِن دُونِهِ﴾<\/span> ـ أي:"], [336.9, "تتّخذونهم وسائطَ في الدعاء فيما بيني وبينكم ـ <span class=\"ayah\">﴿مَا يَمْلِكُونَ مِن قِطْمِيرٍ إِن تَدْعُوهُمْ لَا يَسْمَعُوا دُعَاءَكُمْ وَلَوْ سَمِعُوا مَا اسْتَجَابُوا لَكُمْ ۖ وَيَوْمَ الْقِيَامَةِ يَكْفُرُونَ بِشِرْكِكُمْ ۚ وَلَا يُنَبِّئُكَ مِثْلُ خَبِيرٍ﴾<\/span> <span class=\"ref\">[فاطر: ١٣-١٤]<\/span>."]], "tr": [[311.0, "Allah Azze ve Celle şöyle buyurur:"], [314.0, "<span class=\"ayah\">﴿Hak olan dua yalnız O'na yapılandır. O'nu bırakıp da dua ettikleri﴾<\/span> —yani kendileriyle Allah arasında vasıta edindikleri— <span class=\"ayah\">﴿onlara hiçbir şeyle cevap veremezler. (Onların durumu,) ağzına ulaşsın diye avuçlarını suya uzatan, oysa (suyun) ona ulaşmayacağı kimsenin durumu gibidir. Kâfirlerin duası ancak boşa gider﴾<\/span> [Ra'd 14]."], [333.0, "Allah Azze ve Celle şöyle buyurur:"], [334.8, "<span class=\"ayah\">﴿O'nu bırakıp dua ettikleriniz﴾<\/span> —yani benimle sizin aranızda duada vasıta edindikleriniz— <span class=\"ayah\">﴿bir çekirdek zarına bile sahip değillerdir. Onlara dua etseniz duanızı işitmezler; işitseler bile size cevap veremezler. Kıyamet günü de sizin şirkinizi inkâr ederler. Hakkıyla haberdar olan (Allah) gibi sana kimse haber veremez﴾<\/span> [Fâtır 13-14]."]]}, {"reader": false, "ar": [[354.0, "وقد قطع الله عز وجل مسألةَ الشفاعة عن الخلق إلا بإذنه ورضاه،"], [359.3, "عن الملائكة ومن دونهم من الخلق،"], [362.0, "فقال الله عز وجل:"], [364.0, "<span class=\"ayah\">﴿وَكَم مِّن مَّلَكٍ فِي السَّمَاوَاتِ لَا تُغْنِي شَفَاعَتُهُمْ شَيْئًا إِلَّا مِن بَعْدِ أَن يَأْذَنَ اللَّهُ لِمَن يَشَاءُ وَيَرْضَىٰ﴾<\/span> <span class=\"ref\">[النجم: ٢٦]<\/span>."], [373.0, "ويقول الله عز وجل:"], [375.0, "<span class=\"ayah\">﴿وَقَالُوا اتَّخَذَ الرَّحْمَٰنُ وَلَدًا ۗ سُبْحَانَهُ ۚ بَلْ عِبَادٌ مُّكْرَمُونَ﴾<\/span> ـ الكلامُ على الملائكة ـ <span class=\"ayah\">﴿لَا يَسْبِقُونَهُ بِالْقَوْلِ وَهُم بِأَمْرِهِ يَعْمَلُونَ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ وَلَا يَشْفَعُونَ إِلَّا لِمَنِ ارْتَضَىٰ وَهُم مِّنْ خَشْيَتِهِ مُشْفِقُونَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٦-٢٨]<\/span> <span class=\"note\">(Şeyh «يعلم» yerine «ومن يعلم» diyor)<\/span>، الآياتِ بتمامها."]], "tr": [[354.0, "Allah Azze ve Celle, meleklerden ve onlardan aşağıdaki mahlukattan, kendi izni ve rızası olmadıkça şefaat meselesini yaratılmışlardan kesip atmıştır."], [361.1, "Allah Azze ve Celle şöyle buyurmuştur:"], [364.0, "<span class=\"ayah\">﴿Göklerde nice melek vardır ki Allah dilediği ve razı olduğu kimseye izin vermedikçe onların şefaati hiçbir fayda vermez﴾<\/span> [Necm 26]."], [370.5, "Allah Azze ve Celle şöyle buyurur:"], [373.0, "<span class=\"ayah\">﴿\"Rahmân çocuk edindi\" dediler. O bundan münezzehtir. Bilakis onlar ikram edilmiş kullardır﴾<\/span> —söz meleklerle ilgilidir— <span class=\"ayah\">﴿Onlar O'ndan önce söz söylemezler; onlar yalnızca O'nun emriyle iş görürler. O, onların önlerindekini ve arkalarındakini bilir. Onlar, O'nun razı olduğu kimseden başkasına şefaat etmezler ve O'nun haşyetinden titrerler﴾<\/span> [Enbiyâ 26-28]; ayetlerin tamamı."]]}, {"reader": false, "ar": [[394.0, "فإذا كان الملائكةُ ـ على عِظَم خَلقهم وكبير منزلتهم عند الله عز وجل ـ لا يصلح أن يكونوا وسطاءَ فيما بيننا وبين الله في طلب الشفاعة،"], [406.0, "فمَن دونهم من الأنبياء..."], [407.8, "فمَن دونهم من الأولياء من باب أولى،"], [409.0, "من باب أولى. ويقول الله عز وجل مبطِلًا شركَ النصارى في اتّخاذ عيسى واسطةً فيما بينهم وبين الله:"], [421.2, "<span class=\"ayah\">﴿لَّن يَسْتَنكِفَ الْمَسِيحُ أَن يَكُونَ عَبْدًا لِّلَّهِ وَلَا الْمَلَائِكَةُ الْمُقَرَّبُونَ﴾<\/span> <span class=\"ref\">[النساء: ١٧٢]<\/span> <span class=\"note\">(Şeyh ayetten önce «وقالوا» diyor)<\/span>."]], "tr": [[394.0, "Melekler, yaratılışlarının büyüklüğüne ve Allah Azze ve Celle katındaki yüksek mertebelerine rağmen şefaat talebinde bizimle Allah arasında vasıta olmaya elverişli değillerse, onlardan aşağıdaki peygamberler… (düzelterek:) onlardan aşağıdaki velîler haydi haydi (elverişli değildir), haydi haydi."], [414.0, "Allah Azze ve Celle, Hristiyanların Îsâ'yı kendileriyle Allah arasında vasıta edinme şirkini iptal ederek şöyle buyurur:"], [421.2, "<span class=\"ayah\">﴿Mesih de, (Allah'a) yakın melekler de Allah'a kul olmaktan asla çekinmezler﴾<\/span> [Nisâ 172]."]]}, {"reader": false, "ar": [[427.0, "وقال الله عز وجل عن الملائكة الذين يدعو..."], [431.2, "الذين يدعوهم بعضُ المشركين ويعتقدون أنهم سيشفعون لهم عند الله،"], [438.0, "قال: <span class=\"ayah\">﴿أُولَٰئِكَ﴾<\/span> ـ أي: الملائكة الذين تعبدونهم من دوني ـ <span class=\"ayah\">﴿أُولَٰئِكَ الَّذِينَ يَدْعُونَ﴾<\/span> ـ أي:"], [445.2, "يعبدون ـ <span class=\"ayah\">﴿يَبْتَغُونَ إِلَىٰ رَبِّهِمُ الْوَسِيلَةَ أَيُّهُمْ أَقْرَبُ وَيَرْجُونَ رَحْمَتَهُ وَيَخَافُونَ عَذَابَهُ﴾<\/span> <span class=\"ref\">[الإسراء: ٥٧]<\/span>؛"], [451.0, "أي: أنهم دائبون مشتغلون في عبادة الله عز وجل،"], [454.0, "منصرفون عن دعائكم وعن طلب الشفاعة منهم."], [457.0, "فالله عز وجل قطع كلَّ طريقٍ يتعلّق به أهلُ الشرك في أوثانهم؛"], [464.0, "فأخبر أنهم ليسوا بوسطاءَ فيما بيني وبينكم،"], [468.0, "وأخبر بأنهم لا يستطيعون أن يشفعوا لأحدٍ إلا إذا أذنتُ له ورضيت."]], "tr": [[427.0, "Allah Azze ve Celle, bazı müşriklerin dua ettiği ve Allah katında kendilerine şefaat edeceklerine inandıkları melekler hakkında şöyle buyurdu:"], [438.5, "<span class=\"ayah\">﴿İşte onlar﴾<\/span> —yani benim dışımda ibadet ettiğiniz melekler— <span class=\"ayah\">﴿işte o dua edenler﴾<\/span> —yani ibadet edenler— <span class=\"ayah\">﴿Rablerine, hangisi daha yakın olacak diye vesile ararlar; O'nun rahmetini umarlar ve azabından korkarlar﴾<\/span> [İsrâ 57]."], [451.0, "Yani onlar Allah Azze ve Celle'ye ibadetle durmadan meşguldürler;"], [454.0, "sizin dualarınızdan ve kendilerinden şefaat istenmesinden uzaktırlar."], [457.0, "Allah Azze ve Celle, şirk ehlinin putları hususunda tutunduğu her yolu kesmiştir."], [464.0, "(Allah'ın ağzından:) Onların benimle sizin aranızda vasıtalar olmadığını haber verdi;"], [468.5, "benim izin verip razı olduğum kimse dışında hiç kimseye şefaat edemeyeceklerini haber verdi."]]}, {"reader": false, "ar": [[474.0, "وقال النبيُّ صلى الله عليه وسلم ـ لمّا قال عليه الصلاة والسلام ـ:"], [479.0, "«يقول الله عز وجل: لِتتبعْ كلُّ أمّةٍ ما كانت تعبد، فيتبع من كان يعبد الشمسَ الشمسَ، ومن كان يعبد القمرَ القمرَ، ومن كان يعبد الطواغيتَ الطواغيتَ»،"], [489.8, "فيتساقطون، فيتساقطون في جهنّم."], [493.0, "كلُّ ذلك من باب تبكيتهم:"], [495.5, "بأنّ ما قطعتم فيه دنياكم،"], [498.0, "وما أفنيتم فيه أعمارَكم تتقرّبون إليهم،"], [501.0, "سيُعذَّبون معكم، سيُعذَّبون في النار معكم يوم القيامة."], [506.0, "وعلى ذلك قولُ الله عز وجل:"], [509.5, "<span class=\"ayah\">﴿إِنَّكُمْ وَمَا تَعْبُدُونَ مِن دُونِ اللَّهِ حَصَبُ جَهَنَّمَ أَنتُمْ لَهَا وَارِدُونَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٩٨]<\/span>، أنتم لها واردون."]], "tr": [[474.0, "Nebî ﷺ şöyle buyurmuştur —o (aleyhissalâtu vesselâm) şöyle buyurduğunda—:"], [479.0, "\"Allah Azze ve Celle buyurur ki:"], [481.0, "Her ümmet ibadet ettiği şeyin peşine düşsün."], [483.9, "Güneşe ibadet eden güneşin, aya ibadet eden ayın, tâğûtlara ibadet eden tâğûtların peşine düşer.\" Sonra cehenneme dökülürler, cehenneme dökülürler."], [493.0, "Bütün bunlar onları azarlamak (tebkît) kabilindendir:"], [495.5, "Uğrunda dünyanızı geçirdiğiniz ve kendilerine yaklaşmak için ömrünüzü tükettiğiniz kimseler sizinle birlikte azap görecekler;"], [501.3, "kıyamet günü sizinle birlikte ateşte azap görecekler."], [506.0, "Allah Azze ve Celle'nin şu sözü de buna delildir:"], [509.5, "<span class=\"ayah\">﴿Siz ve Allah'ı bırakıp ibadet ettikleriniz cehennem yakıtısınız; siz oraya gireceksiniz﴾<\/span> [Enbiyâ 98]; siz oraya gireceksiniz."]]}]}, {"ts": "08:36", "title": "1. Külliyenin şerhi (devam): İbn Teymiyye, Merdâvî ve el-İknâ'dan nakiller", "paras": [{"reader": false, "ar": [[516.0, "ولذلك قال الإمام ابن تيمية رحمه الله تعالى ـ اتّخاذُ الوسائط بين العبد وربّه بهدف التوكّل عليهم ودعائهم من دون الله ـ:"], [531.0, "«إن أراد بالواسطة أنه لا بدّ من واسطةٍ في جلب المنافع ودفع المضارّ، مثلَ أن يكون واسطةً في رزق العباد ونصرهم وهُداهم، يسألونه ذلك ويرجعون إليه فيه، فهذا من أعظم الشرك الذي كفّر الله عز وجل به المشركين؛ حيث اتّخذوا من دون الله أولياءَ وشفعاءَ يجتلبون بهم المنافع ويجتنبون المضارّ». انتهى كلامه."]], "tr": [[516.0, "Bu yüzden İmam İbn Teymiyye —Allah ona rahmet etsin— (kul ile Rabbi arasında, onlara tevekkül etmek ve Allah'ı bırakıp onlara dua etmek amacıyla vasıtalar edinme hakkında) şöyle demiştir:"], [531.0, "\"Eğer vasıta ile, faydaları celbetmede ve zararları defetmede mutlaka bir vasıta bulunması gerektiğini kastediyorsa —mesela kulların rızkında, onlara yardımda ve onlara hidayet vermede bir vasıta olması gibi;"], [544.6, "bunu ondan isterler ve bu hususta ona başvururlar— bu, Allah Azze ve Celle'nin müşrikleri sebebiyle tekfir ettiği en büyük şirktendir."], [553.5, "Çünkü onlar Allah'ı bırakıp, kendileri vasıtasıyla faydaları celbettikleri ve zararlardan korundukları velîler ve şefaatçiler edindiler.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[562.0, "وقال رحمه الله تعالى:"], [564.0, "«فمن جعل الملائكةَ والأنبياءَ وسائطَ يدعوهم ويتوكّل عليهم ويسألهم جلبَ المنافع ودفعَ المضارّ، مثلَ أن يسألهم غفرانَ الذنوب، وهدايةَ القلوب، وتفريجَ الكروب، وسدَّ الفاقات، فهو كافرٌ بإجماع المسلمين»."], [582.0, "انتهى كلامه رحمه الله."], [584.0, "وقال رحمه الله أيضًا:"], [586.0, "«من أثبت وسائطَ بينه وبين خلقه كالوسائط التي تكون بين الملوك والرعيّة فهو مشرك، بل هذا دينُ المشركين عُبّادِ الأوثان»."], [600.0, "انتهى كلامه. وقال رحمه الله في موضعٍ آخر:"], [603.0, "«فمن أثبت وسائطَ بينه وبين خلقه فقد كفر بإجماع المسلمين»."], [610.0, "انتهى كلامه رحمه الله."]], "tr": [[562.0, "Yine o —Allah ona rahmet etsin— şöyle demiştir:"], [564.0, "\"Kim melekleri ve peygamberleri, kendilerine dua ettiği, tevekkül ettiği ve kendilerinden faydaları celbetmeyi ve zararları defetmeyi istediği vasıtalar kılarsa —mesela onlardan günahların bağışlanmasını, kalplerin hidayetini, sıkıntıların giderilmesini ve yoklukların kapatılmasını isterse— o, Müslümanların icmâıyla kâfirdir.\" Sözü —Allah ona rahmet etsin— burada bitti."], [584.0, "Yine o —Allah ona rahmet etsin— şöyle demiştir:"], [586.0, "\"Kim O'nunla (Allah ile) yaratıkları arasında, hükümdarlarla halk arasındaki vasıtalar gibi vasıtalar ispat ederse o müşriktir;"], [594.0, "hatta bu, putlara tapan müşriklerin dinidir.\" Sözü burada bitti."], [600.0, "Başka bir yerde de —Allah ona rahmet etsin— şöyle demiştir:"], [603.0, "\"Kim O'nunla yaratıkları arasında vasıtalar ispat ederse Müslümanların icmâıyla küfre girmiş olur.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[612.0, "وقال الإمام المرداويّ رحمه الله تعالى:"], [616.0, "«وكذا الحكمُ لو جعل بينه وبين الله وسائطَ يتوكّل عليهم ويدعوهم ويسألهم، إجماعًا»؛"], [625.0, "أي: أنه كافر. وقال في «الإقناع» وشرحه:"], [628.0, "«من جعل بينه وبين الله وسائطَ يتوكّل عليهم ويدعوهم ويسألهم كفر إجماعًا؛ لأنّ ذلك فعلُ عابدِ الأصنام، قائلين: <span class=\"ayah\">﴿مَا نَعْبُدُهُمْ إِلَّا لِيُقَرِّبُونَا إِلَى اللَّهِ زُلْفَىٰ﴾<\/span> <span class=\"ref\">[الزمر: ٣]<\/span>». انتهى كلامه."]], "tr": [[612.0, "İmam Merdâvî —Allah ona rahmet etsin— şöyle demiştir:"], [616.0, "\"Allah ile kendisi arasında, kendilerine tevekkül ettiği, dua ettiği ve kendilerinden istediği vasıtalar edinirse hüküm icmâen yine böyledir\";"], [625.0, "yani o kâfirdir. el-İknâ' ve şerhinde de şöyle denmiştir:"], [628.0, "\"Kim Allah ile kendisi arasında, kendilerine tevekkül ettiği, dua ettiği ve kendilerinden istediği vasıtalar edinirse icmâen küfre girer."], [637.0, "Çünkü bu, <span class=\"ayah\">﴿Biz onlara ancak bizi Allah'a iyice yaklaştırsınlar diye ibadet ediyoruz﴾<\/span> [Zümer 3] diyen putperestlerin fiilidir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[648.0, "وبناءً على ذلك: فالذي يدعو الموتى والغائبين،"], [651.9, "ويستغيث بهم في الرخاء والشدّة،"], [654.6, "ويتوكّل عليهم ويدعوهم من دون الله عز وجل،"], [659.0, "ويستنصرهم إذا هُزم، ويسترزقهم إذا افتقر،"], [662.9, "ولا يتّجه قلبُه بتوكّله وجمعيّته إلا عليهم،"], [667.5, "فلا جرمَ أنه كافرٌ بالإجماع."]], "tr": [[648.0, "Buna göre: Ölülere ve gaiblere dua eden, bollukta ve darlıkta onlardan medet (istiğase) dileyen, Allah Azze ve Celle'yi bırakıp onlara tevekkül eden ve onlara dua eden, yenildiğinde onlardan yardım, fakir düştüğünde onlardan rızık isteyen ve kalbi tevekkülüyle ve bütün yönelişiyle (cem'iyyet) yalnızca onlara yönelen kimse, şüphesiz icmâen kâfirdir."]]}]}, {"ts": "11:13", "title": "Tenbih: Şirk olan vasıta ve meşru vasıta (tebliğ vasıtası)", "paras": [{"reader": false, "ar": [[673.0, "وهنا تنبيهٌ لا بدّ منه،"], [675.9, "وهي أنّ اتّخاذ الوسائط صار من الألفاظ المجمَلة التي تحتمل الحقَّ والباطل."], [683.0, "فاتّخاذ الوسائط بالمعنى الذي ذكرتُه في أوّل هذه الكلّيّة هذا هو المعنى الشركيّ الباطل؛"], [689.0, "يعني: أن يتّخذ هؤلاء وسائطَ فيما بينه وبين الله عز وجل في دعائهم والاستغاثة بهم واسترزاقهم واستنصارهم؛"], [698.0, "فالواسطة بهذا المعنى كفرٌ بالإجماع."]], "tr": [[673.0, "Burada mutlaka yapılması gereken bir uyarı vardır:"], [676.5, "\"Vasıtalar edinmek\" ifadesi, hakkı da batılı da ihtimal taşıyan mücmel lafızlardan olmuştur."], [683.0, "Bu külliyenin başında zikrettiğim anlamda vasıtalar edinmek, şirk olan batıl anlamdır;"], [687.3, "yani kişinin, onlara dua etmekte, onlardan istiğase etmekte, onlardan rızık ve yardım istemekte bunları kendisiyle Allah Azze ve Celle arasında vasıtalar edinmesi."], [698.0, "Bu anlamda vasıta icmâen küfürdür."]]}, {"reader": false, "ar": [[702.0, "ولكن هناك واسطةٌ يجب أن تكون بيننا وبين الله،"], [707.3, "وهي واسطةُ الدعوة والتبليغ،"], [709.6, "وهي وساطةُ الأنبياء والمرسلين؛"], [712.0, "فالأنبياءُ والمرسلون واسطةٌ فيما بيننا وبين الله،"], [716.8, "ولكن في التبليغ والدعوة والرسالة."], [721.0, "فالواسطةُ المشروعة بين الله وبين خلقه هو الذي يبلّغ من الله عز وجل شريعتَه ويوحى إليه بدينه؛"], [735.0, "فاتّخاذ هؤلاء واسطةً هو أصلُ الدين."], [741.0, "وأمّا أن نتّخذ وسائطَ فيما بيننا وبين الله،"], [744.7, "ندعوهم ونستغيث بهم ونتوكّل عليهم،"], [747.0, "فهذا هو الكفرُ الصريح. والله أعلم."]], "tr": [[702.0, "Fakat bizimle Allah arasında bulunması vâcib olan bir vasıta vardır:"], [707.9, "O da davet ve tebliğ vasıtasıdır;"], [712.0, "peygamberlerin ve resullerin vasıtalığıdır. Peygamberler ve resuller bizimle Allah arasında vasıtadır;"], [717.5, "fakat tebliğde, davette ve risalette."], [721.0, "Allah ile yaratıkları arasındaki meşru vasıta, Allah Azze ve Celle'den O'nun şeriatini tebliğ eden ve kendisine O'nun dini vahyedilen kimsedir."], [735.0, "Bunları vasıta edinmek dinin aslıdır."], [741.0, "Bizimle Allah arasında, kendilerine dua ettiğimiz, kendilerinden istiğase ettiğimiz ve kendilerine tevekkül ettiğimiz vasıtalar edinmemize gelince, bu apaçık küfürdür. Allah en iyisini bilir."]]}]}, {"ts": "12:29", "title": "2. Külliye: İbadetin tamamı Allah'ın hâlis hakkıdır, hiçbir şeyinde O'nun ortağı yoktur", "paras": [{"reader": false, "ar": [[749.0, "ومن الكلّيّات أيضًا: كلُّ العبادة حقٌّ صِرْفٌ لله تعالى،"], [758.1, "لا شريكَ له في شيءٍ منها. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[749.0, "Külliyelerden biri de şudur: 2."], [751.1, "külliye: İbadetin tamamı Allah Teâlâ'nın hâlis (katışıksız) hakkıdır;"], [758.1, "onun hiçbir şeyinde O'nun ortağı yoktur. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[783.0, "أقول وبالله التوفيق: وهذا هو توحيدُ الألوهيّة."], [789.0, "وتوحيدُ الألوهيّة في الشرع هو إفرادُ الله تعالى بأفعال العباد،"], [794.0, "كما قال الشيخ محمد بن عبد الوهّاب رحمه الله تعالى:"], [799.0, "«التوحيدُ هو إفرادُ الله بالعبادة»،"], [803.0, "وقال الشيخ عبد الرحمن بن حسن رحمه الله تعالى:"], [808.4, "«هو إفرادُ الله بالعبادة الباطنة والظاهرة»."], [812.0, "وهذا النوعُ من التوحيد هو دعوةُ الرسل عليهم الصلاة والسلام من أوّلهم إلى آخرهم."]], "tr": [[783.0, "Tevfik Allah'tandır, derim ki: Bu, ulûhiyyet tevhididir."], [789.0, "Şeriatte ulûhiyyet tevhidi, kulların fiillerinde Allah Teâlâ'yı birlemektir (tek kılmaktır)."], [793.5, "Nitekim Şeyh Muhammed b. Abdilvehhâb —Allah ona rahmet etsin— şöyle demiştir:"], [799.0, "\"Tevhid, ibadette Allah'ı birlemektir.\" Şeyh Abdurrahmân b."], [803.6, "Hasen —Allah ona rahmet etsin— de şöyle demiştir:"], [808.4, "\"O, bâtın ve zâhir ibadette Allah'ı birlemektir.\" Bu tevhid türü, ilkinden sonuncusuna kadar resullerin —onlara salât ve selâm olsun— davetidir."]]}, {"reader": false, "ar": [[820.0, "فالله تعالى هو وحده المعبودُ بالحقّ،"], [823.0, "لا شريكَ له في هذه العبادة،"], [826.0, "وما سواه من المعبودات فإنها عُبِدت بالباطل والزيف والعناد والكفر والجهل والضلال والبهتان،"], [837.0, "كما قال الله عز وجل:"], [839.4, "<span class=\"ayah\">﴿ذَٰلِكَ بِأَنَّ اللَّهَ هُوَ الْحَقُّ وَأَنَّ مَا يَدْعُونَ مِن دُونِهِ هُوَ الْبَاطِلُ﴾<\/span> <span class=\"ref\">[الحج: ٦٢]<\/span>،"], [845.0, "في آياتٍ متعدّدة. وقال الله عز وجل:"], [849.0, "<span class=\"ayah\">﴿يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ الَّذِي خَلَقَكُمْ وَالَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ﴾<\/span> <span class=\"ref\">[البقرة: ٢١]<\/span>،"], [855.0, "الآياتِ بتمامها. بل هو أصلُ وجودنا في هذه الحياة،"], [860.0, "كما قال الله عز وجل:"], [862.0, "<span class=\"ayah\">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾<\/span> <span class=\"ref\">[الذاريات: ٥٦]<\/span>."]], "tr": [[820.0, "Allah Teâlâ, hak olarak ibadet edilen yegâne mabuddur;"], [824.0, "bu ibadette O'nun ortağı yoktur."], [826.7, "O'ndan başka mabudlara ise batıl, sahtelik, inat, küfür, cehalet, dalâlet ve bühtan ile ibadet edilmiştir."], [839.4, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [841.2, "<span class=\"ayah\">﴿Bu, Allah'ın hakkın ta kendisi olması ve O'nu bırakıp dua ettikleri şeylerin batılın ta kendisi olması sebebiyledir﴾<\/span> [Hac 62];"], [847.0, "bu, birçok ayette geçer. Allah Azze ve Celle şöyle buyurmuştur:"], [850.5, "<span class=\"ayah\">﴿Ey insanlar! Sizi ve sizden öncekileri yaratan Rabbinize ibadet edin ki korunasınız﴾<\/span> [Bakara 21];"], [856.0, "ayetlerin tamamı. Hatta bu (ibadet), bu hayatta var oluşumuzun aslıdır."], [860.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [862.0, "<span class=\"ayah\">﴿Ben cinleri ve insanları ancak bana ibadet etsinler diye yarattım﴾<\/span> [Zâriyât 56]."]]}, {"reader": false, "ar": [[865.0, "وقال الله عز وجل:"], [866.6, "<span class=\"ayah\">﴿أَلَمْ أَعْهَدْ إِلَيْكُمْ يَا بَنِي آدَمَ أَن لَّا تَعْبُدُوا الشَّيْطَانَ ۖ إِنَّهُ لَكُمْ عَدُوٌّ مُّبِينٌ وَأَنِ اعْبُدُونِي ۚ هَٰذَا صِرَاطٌ مُّسْتَقِيمٌ﴾<\/span> <span class=\"ref\">[يس: ٦٠-٦١]<\/span>."], [876.0, "ويقول الله عز وجل:"], [878.0, "<span class=\"ayah\">﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾<\/span> <span class=\"ref\">[النحل: ٣٦]<\/span>."], [884.0, "ويقول الله عز وجل:"], [885.9, "<span class=\"ayah\">﴿وَمَا أَرْسَلْنَا مِن قَبْلِكَ مِن رَّسُولٍ إِلَّا نُوحِي إِلَيْهِ أَنَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدُونِ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٥]<\/span>."]], "tr": [[865.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [866.6, "<span class=\"ayah\">﴿Ey Âdemoğulları! Size şeytana kulluk etmeyin, çünkü o sizin için apaçık bir düşmandır; ve bana kulluk edin, bu dosdoğru yoldur diye emretmedim mi?﴾<\/span> [Yâsîn 60-61]."], [876.0, "Allah Azze ve Celle şöyle buyurur:"], [878.0, "<span class=\"ayah\">﴿Andolsun ki biz her ümmete \"Allah'a ibadet edin ve tâğûttan kaçının\" diye bir resul gönderdik﴾<\/span> [Nahl 36]."], [884.0, "Allah Azze ve Celle şöyle buyurur:"], [885.9, "<span class=\"ayah\">﴿Senden önce gönderdiğimiz her resule mutlaka \"Benden başka ilah yoktur; öyleyse bana ibadet edin\" diye vahyettik﴾<\/span> [Enbiyâ 25]."]]}, {"reader": false, "ar": [[893.0, "وقال الله عز وجل:"], [895.0, "<span class=\"ayah\">﴿فَلَا تَجْعَلُوا لِلَّهِ أَندَادًا وَأَنتُمْ تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[البقرة: ٢٢]<\/span>."], [898.0, "وقال الله عز وجل:"], [900.3, "<span class=\"ayah\">﴿مَا تَعْبُدُونَ مِن دُونِهِ إِلَّا أَسْمَاءً سَمَّيْتُمُوهَا أَنتُمْ وَآبَاؤُكُم مَّا أَنزَلَ اللَّهُ بِهَا مِن سُلْطَانٍ ۚ إِنِ الْحُكْمُ إِلَّا لِلَّهِ ۚ أَمَرَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ ۚ ذَٰلِكَ الدِّينُ الْقَيِّمُ وَلَٰكِنَّ أَكْثَرَ النَّاسِ لَا يَعْلَمُونَ﴾<\/span> <span class=\"ref\">[يوسف: ٤٠]<\/span>."], [918.0, "ويقول الله عز وجل:"], [919.5, "<span class=\"ayah\">﴿لَا إِكْرَاهَ فِي الدِّينِ ۖ قَد تَّبَيَّنَ الرُّشْدُ مِنَ الْغَيِّ ۚ فَمَن يَكْفُرْ بِالطَّاغُوتِ وَيُؤْمِن بِاللَّهِ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٦]<\/span>."], [929.0, "وقال الله عز وجل في آياتٍ متعدّدة:"], [933.8, "<span class=\"ayah\">﴿لَا إِلَٰهَ إِلَّا هُوَ﴾<\/span>؛"], [937.0, "فكلُّ آيةٍ فيها كلمةُ التوحيد فإنها دليلٌ على هذه الكلّيّة."]], "tr": [[893.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [895.0, "<span class=\"ayah\">﴿Bile bile Allah'a eşler koşmayın﴾<\/span> [Bakara 22]."], [898.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [900.3, "<span class=\"ayah\">﴿O'nu bırakıp ibadet ettikleriniz, sizin ve atalarınızın koyduğu, Allah'ın haklarında hiçbir delil indirmediği isimlerden başka bir şey değildir. Hüküm yalnızca Allah'ındır. O, kendisinden başkasına ibadet etmemenizi emretmiştir. Dosdoğru din budur; fakat insanların çoğu bilmez﴾<\/span> [Yûsuf 40]."], [918.0, "Allah Azze ve Celle şöyle buyurur:"], [919.5, "<span class=\"ayah\">﴿Dinde zorlama yoktur. Doğruluk sapıklıktan apaçık ayrılmıştır. Kim tâğûtu inkâr edip Allah'a iman ederse, kopması olmayan en sağlam kulpa yapışmıştır﴾<\/span> [Bakara 256]."], [929.0, "Allah Azze ve Celle birçok ayette <span class=\"ayah\">﴿O'ndan başka ilah yoktur﴾<\/span> buyurmuştur."], [937.0, "Kelime-i tevhidin geçtiği her ayet bu külliyeye delildir."]]}, {"reader": false, "ar": [[943.0, "قال الإمامُ الطبريّ رحمه الله تعالى في قول الله عز وجل:"], [948.0, "<span class=\"ayah\">﴿هُوَ الْحَيُّ لَا إِلَٰهَ إِلَّا هُوَ﴾<\/span> <span class=\"ref\">[غافر: ٦٥]<\/span>،"], [951.0, "يقول: «لا معبودَ بحقٍّ تجوز عبادتُه وتصلح الألوهيّةُ له إلا اللهُ عز وجل الذي هذه الصفاتُ صفتُه، فادعوا اللهَ مخلصين له الدين»."], [965.0, "يقول: «فاعبدوا الإلهَ الذي هذه الصفاتُ صفاتُه أيها الناس، مخلصين له الطاعة، مفردين له الألوهيّة، لا تُشركوا في عبادته شيئًا سواه من وثنٍ وصنم، ولا تجعلوا له أندادًا ولا عِدلًا»."], [980.0, "انتهى كلامه رحمه الله."]], "tr": [[943.0, "İmam Taberî —Allah ona rahmet etsin— Allah Azze ve Celle'nin <span class=\"ayah\">﴿O, diridir; O'ndan başka ilah yoktur﴾<\/span> [Mü'min 65] sözü hakkında şöyle der:"], [951.7, "\"Yani bu sıfatlar kendi sıfatı olan Allah Azze ve Celle'den başka, kendisine ibadet edilmesi caiz olan ve ulûhiyyet kendisine yaraşan hak bir mabud yoktur."], [961.9, "Öyleyse dini O'na hâlis kılarak Allah'a dua edin.\" Şöyle der:"], [965.0, "\"Ey insanlar! Bu sıfatlar kendi sıfatları olan ilaha, itaati O'na hâlis kılarak, ulûhiyyeti yalnız O'na ait kılarak ibadet edin;"], [973.0, "O'na ibadette putlardan ve heykellerden hiçbir şeyi ortak koşmayın, O'na eşler ve denkler edinmeyin.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[982.0, "ويقول الله عز وجل:"], [984.3, "<span class=\"ayah\">﴿قُلْ إِنَّ صَلَاتِي وَنُسُكِي وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ لَا شَرِيكَ لَهُ ۖ وَبِذَٰلِكَ أُمِرْتُ وَأَنَا أَوَّلُ الْمُسْلِمِينَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٦٢-١٦٣]<\/span>."], [994.0, "وهذا حقُّ الله على العباد،"], [995.9, "كما في قول النبيّ ﷺ:"], [999.0, "«أتدري ما حقُّ الله على العباد، وحقُّ العباد على الله؟» قلتُ:"], [1002.9, "الله ورسوله أعلم. قال:"], [1004.5, "«فإنّ حقَّ الله على العباد أن يعبدوه ولا يُشركوا به شيئًا، وحقَّ العباد على الله ألّا يعذّب من لا يُشرك به شيئًا» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[982.0, "Allah Azze ve Celle şöyle buyurur:"], [984.3, "<span class=\"ayah\">﴿De ki: Şüphesiz benim namazım, kurbanım (ibadetlerim), hayatım ve ölümüm âlemlerin Rabbi Allah içindir. O'nun hiçbir ortağı yoktur. Bana bu emredildi ve ben Müslümanların ilkiyim﴾<\/span> [En'âm 162-163]."], [994.0, "Bu, Allah'ın kullar üzerindeki hakkıdır."], [995.5, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [999.0, "\"Allah'ın kullar üzerindeki hakkı ve kulların Allah üzerindeki hakkı nedir, bilir misin?\" (Muâz der ki:) \"Allah ve Resûlü daha iyi bilir\" dedim."], [1004.0, "Buyurdu ki: \"Allah'ın kullar üzerindeki hakkı, O'na ibadet etmeleri ve O'na hiçbir şeyi ortak koşmamalarıdır."], [1010.0, "Kulların Allah üzerindeki hakkı ise O'na hiçbir şeyi ortak koşmayana azap etmemesidir.\""]]}]}, {"ts": "16:57", "title": "2. Külliyenin şerhi (devam): İbadet türleri ve teşrî hakkı", "paras": [{"reader": false, "ar": [[1017.0, "وبناءً على ذلك: فالسجودُ حقٌّ لله عز وجل لا يُسجَد لغيره،"], [1023.0, "والركوعُ حقٌّ لله عز وجل لا يُركَع لغيره،"], [1027.0, "ودعاءُ العبادة حقٌّ لله عز وجل لا يُصرَف لغيره،"], [1031.0, "ودعاءُ المسألة في الأمر الذي لا يقدر عليه إلا الله عز وجل حقٌّ محضٌ صِرْفٌ لله عز وجل لا يُصرَف لغيره."], [1042.0, "والاستغاثةُ حقٌّ لله عز وجل،"], [1046.0, "والاستعاذةُ حقٌّ لله عز وجل،"], [1049.0, "والاستعانةُ حقٌّ لله عز وجل في الأمر الذي لا يقدر عليه في ذلك إلا الله عز وجل."], [1056.0, "والخوفُ حقٌّ لله عز وجل،"], [1060.0, "فلا يجوز الخوفُ إلا منه تبارك وتعالى."], [1063.0, "والخشيةُ والرجاءُ والرهبةُ والرغبةُ كلُّها من العبادات التي لا يجوز صرفُها لغير الله تبارك وتعالى،"], [1073.0, "بشروطٍ وتفاصيلَ سيأتي ذكرُها في الكلّيّات القادمة إن شاء الله تعالى."]], "tr": [[1017.0, "Buna göre: Secde Allah Azze ve Celle'nin hakkıdır, O'ndan başkasına secde edilmez."], [1018.0, "Rükû Allah Azze ve Celle'nin hakkıdır, O'ndan başkası için rükû edilmez."], [1025.5, "İbadet duası Allah Azze ve Celle'nin hakkıdır, O'ndan başkasına yöneltilmez."], [1031.0, "Allah Azze ve Celle'den başkasının güç yetiremediği işte istek duası, Allah Azze ve Celle'nin katıksız, hâlis hakkıdır;"], [1042.0, "O'ndan başkasına yöneltilmez. İstiğase (medet dileme) Allah Azze ve Celle'nin hakkıdır, istiâze (sığınma) Allah Azze ve Celle'nin hakkıdır, istiâne (yardım dileme) de bu hususta Allah Azze ve Celle'den başkasının güç yetiremediği işte Allah Azze ve Celle'nin hakkıdır."], [1056.0, "Korku Allah Azze ve Celle'nin hakkıdır;"], [1060.0, "Tebâreke ve Teâlâ'dan başkasından korkmak caiz değildir."], [1063.0, "Haşyet, recâ (ümit), rehbet (ürperti) ve rağbet;"], [1068.9, "bunların hepsi, Allah Tebâreke ve Teâlâ'dan başkasına yöneltilmesi caiz olmayan ibadetlerdendir."], [1074.3, "Bunun, gelecek külliyelerde inşallah zikredilecek şartları ve ayrıntıları vardır."]]}, {"reader": false, "ar": [[1080.0, "ويدخل في ذلك أيضًا حقُّ التشريع؛"], [1083.0, "فإنّ حقَّ التشريع من حقوقه عز وجل،"], [1086.0, "فلا حقَّ لأحدٍ أن يشرّع في دين الله إلا بدليل؛"], [1091.0, "فالأحكامُ الشرعيّة تفتقر في ثبوتها للأدلّة الصحيحة الصريحة،"], [1095.0, "كما قال الله عز وجل:"], [1096.8, "<span class=\"ayah\">﴿أَمْ لَهُمْ شُرَكَاءُ شَرَعُوا لَهُم مِّنَ الدِّينِ مَا لَمْ يَأْذَن بِهِ اللَّهُ﴾<\/span> <span class=\"ref\">[الشورى: ٢١]<\/span>."], [1101.0, "والخلاصةُ من ذلك: أنّ كلَّ ما يدخل في وصف العبادة فإنه من حقوق الله المحضة التي لا يجوز صرفُها لا لملَكٍ مقرَّب،"], [1112.0, "ولا لنبيٍّ مرسَل، ولا لوليٍّ صالح."], [1114.0, "فالملائكةُ ـ على جلالة قدرهم ـ لا يصلح أن يُصرَف لهم شيءٌ من أنواع العبادة أبدًا،"], [1120.0, "والأنبياءُ والرسلُ والأولياءُ ومن دونهم ـ على جلالة قدرهم ـ لا يجوز أن يُصرَف لهم شيءٌ من أنواع العبادة أبدًا. والله أعلم."]], "tr": [[1080.0, "Teşrî (şeriat koyma) hakkı da buna dahildir."], [1083.0, "Çünkü teşrî hakkı O'nun Azze ve Celle'nin haklarındandır;"], [1086.0, "hiç kimsenin delil olmaksızın Allah'ın dininde şeriat koymaya hakkı yoktur."], [1091.0, "Şer'î hükümler sübutlarında sahih ve sarih delillere muhtaçtır."], [1094.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1096.8, "<span class=\"ayah\">﴿Yoksa onların, Allah'ın izin vermediği şeyleri dinden kendileri için şeriat kılan ortakları mı var?﴾<\/span> [Şûrâ 21]."], [1102.8, "Bundan çıkan özet şudur: İbadet vasfına giren her şey, Allah'ın katıksız haklarındandır;"], [1108.2, "ne mukarreb bir meleğe, ne gönderilmiş bir peygambere, ne de salih bir velîye yöneltilmesi caiz değildir."], [1114.0, "Melekler, kadirlerinin yüceliğine rağmen, ibadet türlerinden hiçbir şeyin onlara yöneltilmesi asla uygun değildir."], [1119.1, "Peygamberler, resuller, velîler ve onlardan aşağıdakiler de kadirlerinin yüceliğine rağmen, ibadet türlerinden hiçbir şeyin onlara yöneltilmesi asla caiz değildir. Allah en iyisini bilir."]]}]}, {"ts": "18:50", "title": "3. Külliye: Kelime-i tevhidi rubûbiyyetin gereklerinden bir şeyle tefsir eden sapmış ve bid'ate düşmüştür", "paras": [{"reader": false, "ar": [[1130.0, "الكلّيّة الثالثة: <b>كلُّ من فسّر كلمةَ التوحيد بشيءٍ من مقتضيات الربوبيّة فقد ضلّ وابتدع.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1130.0, "<b>3. külliye: Kelime-i tevhidi rubûbiyyetin gereklerinden (muktezâlarından) bir şeyle tefsir eden herkes sapmış ve bid'ate düşmüştür.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1166.0, "أقول وبالله التوفيق: ونعني بكلمة التوحيد:"], [1170.2, "«لا إله إلا الله»،"], [1173.0, "ومعناها الحقُّ الذي اتّفق عليه أهلُ السنة والجماعة:"], [1177.0, "أنه لا معبودَ حقٌّ إلا الله،"], [1180.0, "كما قال الله عز وجل:"], [1182.0, "<span class=\"ayah\">﴿ذَٰلِكَ بِأَنَّ اللَّهَ هُوَ الْحَقُّ وَأَنَّ مَا يَدْعُونَ مِن دُونِهِ هُوَ الْبَاطِلُ﴾<\/span> <span class=\"ref\">[الحج: ٦٢]<\/span>."], [1188.0, "ولكننا نجد أنّ طوائف أهل البدع قد ضلّت ـ على مختلف أصنافها ـ في تفسير كلمة التوحيد على أربعة أقوال؛"], [1201.0, "فقد ضلّ في تفسير كلمة التوحيد أربعُ طوائف."]], "tr": [[1166.0, "Tevfik Allah'tandır, derim ki: Kelime-i tevhid ile \"Lâ ilâhe illallah\"ı kastediyoruz."], [1170.2, "Ehl-i Sünnet ve'l-Cemaat'in üzerinde ittifak ettiği hak anlamı şudur:"], [1177.0, "Allah'tan başka hak mabud yoktur."], [1179.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1182.0, "<span class=\"ayah\">﴿Bu, Allah'ın hakkın ta kendisi olması ve O'nu bırakıp dua ettikleri şeylerin batılın ta kendisi olması sebebiyledir﴾<\/span> [Hac 62]."], [1190.7, "Fakat görüyoruz ki bid'at ehlinin fırkaları, çeşitli sınıflarıyla, kelime-i tevhidin tefsirinde dört görüşe ayrılarak sapmışlardır."], [1201.0, "Kelime-i tevhidin tefsirinde dört fırka sapmıştır."]]}]}, {"ts": "20:05", "title": "Birinci fırka: Vahdet-i vücûd ehli", "paras": [{"reader": false, "ar": [[1205.0, "الطائفةُ الأولى: أهلُ وحدة الوجود،"], [1212.0, "أتباعُ ابن عربي، أتباعُ ابن عربي وابن سبعين و(ابن) الفارض والحلّاج ومن هم على شاكلتهم؛"], [1222.0, "فإنهم يفسّرون كلمة التوحيد بأنه لا موجودَ إلا الله؛"], [1226.0, "لأنهم يعتقدون أنّ الله هو عينُ هذا الوجود."], [1231.0, "فما تراه عينُك ـ وإن اختلفت صورتُه ـ فإنما ترى اللهَ تبارك وتعالى؛"], [1238.0, "فإذا رأيت السماء فإنك رأيتَ الله،"], [1240.5, "وإذا رأيت الأرض فإنك رأيتَ الله،"], [1243.0, "وإذا رأيت الأصنامَ والأوثانَ والأشجارَ والجبالَ والإنسَ والجنَّ فإنما ترى اللهَ عز وجل."], [1253.0, "ولا يعتقدون بأنّ الله قد حلّ في خلقه،"], [1258.4, "بل اتّحدت ذاتُه بذوات خلقه،"], [1263.0, "فصارت الذاتان ذاتًا واحدة."]], "tr": [[1205.0, "Birinci fırka: Vahdet-i vücûd ehli;"], [1212.0, "İbn Arabî'nin tâbileri; İbn Arabî'nin, İbn Seb'în'in, İbnü'l-Fârız'ın, Hallâc'ın ve onların kılığında olanların tâbileri."], [1222.0, "Bunlar kelime-i tevhidi \"Allah'tan başka mevcut yoktur\" diye tefsir ederler."], [1226.0, "Çünkü Allah'ın bu varlığın ta kendisi olduğuna inanırlar."], [1231.0, "Gözünün gördüğü şey, sureti farklı olsa da, aslında Allah Tebâreke ve Teâlâ'yı görmektir."], [1238.0, "Göğü gördüğünde Allah'ı görmüş olursun, yeri gördüğünde Allah'ı görmüş olursun;"], [1241.3, "putları, heykelleri, ağaçları, dağları, insanları ve cinleri gördüğünde aslında Allah Azze ve Celle'yi görürsün."], [1248.4, "Allah'ın yarattıklarına hulûl ettiğine (girdiğine) inanmazlar;"], [1253.0, "aksine O'nun zatının yarattıklarının zatlarıyla ittihat ettiğine (birleştiğine) ve iki zatın tek bir zat hâline geldiğine inanırlar."]]}, {"reader": false, "ar": [[1267.0, "وهؤلاء هم أكفرُ خلق الله في أرض الله عز وجل،"], [1276.0, "وقد أجمع المسلمون على كفرهم،"], [1279.0, "قد أجمع العلماءُ على كفرهم،"], [1281.0, "بل إنّ من لم يكفّرهم مع معرفته بحقيقة مذهبهم فإنه كافر."], [1287.0, "بل إنّ كفرَ هؤلاء أعظمُ من كفر اليهود والنصارى؛"], [1291.0, "فإنّ النصارى خصّوا حلولَ اللاهوت بعيسى عليه الصلاة والسلام،"], [1299.0, "وأمّا هؤلاء فإنهم يقولون:"], [1301.4, "إنّ الذات الإلهيّة قد اتّحدت بكلّ جزئيّةٍ من جزئيّات هذا العالم،"], [1308.0, "غيرَ منزّهين ذاتَ ربّهم عن الحُشوش وفروج النساء وبطون الكلاب وأجواف البالوعات."], [1316.0, "فيقولون: قد حلّ... قد اتّحدت ذاتُه عز وجل بذوات خلقه."]], "tr": [[1267.0, "Bunlar, Allah Azze ve Celle'nin yeryüzünde Allah'ın yarattıklarının en kâfir olanlarıdır."], [1278.4, "Müslümanlar onların küfrü üzerinde icmâ etmiştir;"], [1282.1, "âlimler onların küfrü üzerinde icmâ etmiştir."], [1287.0, "Hatta mezheplerinin hakikatini bildiği hâlde onları tekfir etmeyen kimse de kâfirdir."], [1291.0, "Hatta bunların küfrü, Yahudilerin ve Hristiyanların küfründen daha büyüktür."], [1295.3, "Çünkü Hristiyanlar lâhûtun (ilahlığın) hulûlünü Îsâ'ya —aleyhissalâtu vesselâm— tahsis ettiler."], [1301.4, "Bunlar ise ilahî zatın bu âlemin cüzlerinden her bir cüzle ittihat ettiğini söylerler;"], [1308.0, "Rablerinin zatını helâlardan, kadınların fercinden, köpeklerin karınlarından ve lağım çukurlarının içinden tenzih etmezler."], [1316.0, "Derler ki: \"O'nun zatı —Azze ve Celle— hulûl etti… (düzelterek:) yarattıklarının zatlarıyla ittihat etti.\""]]}, {"reader": false, "ar": [[1323.0, "ولذلك هم يصحّحون عباداتِ أهل الأوثان،"], [1327.0, "ويصحّحون قولَ فرعون لمّا قال:"], [1329.3, "<span class=\"ayah\">﴿مَا عَلِمْتُ لَكُم مِّنْ إِلَٰهٍ غَيْرِي﴾<\/span> <span class=\"ref\">[القصص: ٣٨]<\/span>،"], [1332.0, "ويصحّحون قوله: <span class=\"ayah\">﴿أَنَا رَبُّكُمُ الْأَعْلَىٰ﴾<\/span> <span class=\"ref\">[النازعات: ٢٤]<\/span>؛"], [1334.5, "لأنّ ذاتَ الله قد حلّت في ذاته،"], [1338.0, "أو قد اتّحدت في ذاته."], [1341.0, "والأوثانُ الذين يعبدون الشمس،"], [1343.9, "أو يعبدون القمر، أو يعبدون الكهوفَ والجبالَ والأبقارَ والمغاراتِ والأوثانَ والأصنامَ والحجارة،"], [1351.0, "هذه الطائفةُ تصحّح تعبّداتهم؛"], [1356.0, "لأنهم إنما سجدوا لذات الله تبارك وتعالى."], [1362.0, "فهذه أوّلُ طائفةٍ ضلّت في تفسير كلمة التوحيد."]], "tr": [[1323.0, "Bu yüzden putperestlerin ibadetlerini doğru sayarlar."], [1326.3, "Firavun'un <span class=\"ayah\">﴿Sizin için benden başka bir ilah bilmiyorum﴾<\/span> [Kasas 38] dediğinde söylediği sözü de doğru sayarlar;"], [1333.0, "<span class=\"ayah\">﴿Ben sizin en yüce Rabbinizim﴾<\/span> [Nâziât 24] sözünü de doğru sayarlar."], [1334.5, "Çünkü (onlara göre) Allah'ın zatı onun zatına hulûl etmiştir ya da onun zatında ittihat etmiştir."], [1341.0, "Güneşe, aya, mağaralara, dağlara, ineklere, inlere, putlara, heykellere ve taşlara tapan putperestlerin taabbudlarını da bu fırka doğru sayar;"], [1351.0, "çünkü (onlara göre) bunlar ancak Allah Tebâreke ve Teâlâ'nın zatına secde etmişlerdir."], [1362.0, "İşte bu, kelime-i tevhidin tefsirinde sapan ilk fırkadır."]]}]}, {"ts": "22:48", "title": "İkinci fırka: Kelâmcılar ve onların yolundaki filozoflar", "paras": [{"reader": false, "ar": [[1368.0, "الطائفةُ الثانية: طائفةُ المتكلّمين ومن نحا نحوَهم من الفلاسفة؛"], [1374.0, "فيفسّرون كلمة التوحيد بشيءٍ من مقتضيات الربوبيّة."], [1379.0, "فيقول بعضهم: لا ربَّ إلا الله،"], [1382.0, "وهذه الكلمة وإن كانت صحيحةً في ذاتها إلا أنها ليست هي المعنى لكلمة التوحيد."], [1389.0, "وبعضهم يقول: لا خالقَ إلا الله،"], [1392.9, "وهذه الكلمة وإن كانت صحيحةً في ذاتها لكنها ليست المعنى الصحيح لكلمة التوحيد."], [1402.0, "وبعضهم يقول: لا قادرَ على الاختراع إلا الله،"], [1408.0, "وهذه الكلمة وإن كانت صحيحةً في ذاتها لكنها ليست هي المعنى الصحيح لكلمة التوحيد."], [1415.0, "وبعضهم يقول: لا مدبّرَ ولا متصرّفَ إلا الله،"], [1420.0, "وهذه وإن كانت صحيحةً في ذاتها لكنها ليست الكلمةَ الصحيحة..."], [1425.3, "ليست المعنى الصحيح لكلمة التوحيد."]], "tr": [[1368.0, "İkinci fırka: Kelâmcılar ve onların yolunu tutan filozoflar."], [1374.0, "Bunlar kelime-i tevhidi rubûbiyyetin gereklerinden bir şeyle tefsir ederler."], [1379.0, "Bazıları \"Allah'tan başka Rab yoktur\" der;"], [1382.5, "bu söz kendi başına doğru olsa da kelime-i tevhidin anlamı değildir."], [1389.0, "Bazıları \"Allah'tan başka yaratıcı yoktur\" der;"], [1392.9, "bu söz kendi başına doğru olsa da kelime-i tevhidin doğru anlamı değildir."], [1402.0, "Bazıları \"Allah'tan başka icada (yoktan var etmeye) kâdir yoktur\" der;"], [1409.0, "bu söz kendi başına doğru olsa da kelime-i tevhidin doğru anlamı değildir."], [1415.0, "Bazıları \"Allah'tan başka idare eden ve tasarruf eden yoktur\" der;"], [1420.0, "bu da kendi başına doğru olsa da doğru söz değildir… (düzelterek:) kelime-i tevhidin doğru anlamı değildir."]]}, {"reader": false, "ar": [[1429.0, "فأنت ترى أنّ هذه الطوائف ضلّت في كلمة التوحيد؛"], [1435.0, "لأنها تفسّر توحيدَ الألوهيّة بتوحيد الربوبيّة،"], [1439.0, "وتجعل توحيدَ الربوبيّة هو أعظمَ أنواع التوحيد الذي نزلت به الكتبُ وأُرسلت لتقريره الرسل."]], "tr": [[1429.0, "Görüyorsun ki bu fırkalar kelime-i tevhid hususunda sapmışlardır;"], [1433.7, "çünkü ulûhiyyet tevhidini rubûbiyyet tevhidiyle tefsir ederler ve rubûbiyyet tevhidini, kitapların onunla indiği ve resullerin onu yerleştirmek için gönderildiği en büyük tevhid türü sayarlar."]]}]}, {"ts": "24:06", "title": "Üçüncü fırka (Cehmiyye ve Mu'tezile) ve dördüncü fırka (hâkimiyyet)", "paras": [{"reader": false, "ar": [[1446.0, "الطائفةُ الثالثة: الجهميّةُ من أتباع الجهم،"], [1452.0, "الذين يجعلون حقيقةَ التوحيد نفيَ أسماء الله وصفاته،"], [1458.0, "وتابعهم على ذلك المعتزلةُ الذين يجعلون حقيقةَ التوحيد نفيَ الصفات،"], [1466.0, "يجعلون حقيقةَ التوحيد نفيَ الصفات."], [1471.0, "فأخصُّ خصائص التوحيد عند الجهميّة والمعتزلة هي نفيُ أسماء الله عز وجل وصفاته؛"], [1480.0, "فما وحّد اللهَ حقَّ توحيده من يُثبت لله الأسماءَ والصفاتِ عند الجهميّة،"], [1488.0, "أو من يُثبت لله الصفاتِ عند المعتزلة."]], "tr": [[1446.0, "Üçüncü fırka: Cehm'in tâbilerinden olan Cehmiyye."], [1452.7, "Bunlar tevhidin hakikatini Allah'ın isimlerini ve sıfatlarını nefyetmek olarak görürler."], [1462.2, "Bu hususta onlara Mu'tezile de tâbi olmuştur;"], [1471.0, "onlar da tevhidin hakikatini sıfatları nefyetmek olarak görürler, tevhidin hakikatini sıfatları nefyetmek olarak görürler."], [1475.1, "Cehmiyye ve Mu'tezile'ye göre tevhidin en has özelliği, Allah Azze ve Celle'nin isimlerini ve sıfatlarını nefyetmektir."], [1480.0, "Cehmiyye'ye göre Allah için isim ve sıfatları ispat eden, Mu'tezile'ye göre de Allah için sıfatları ispat eden kimse Allah'ı hakkıyla tevhid etmemiştir."]]}, {"reader": false, "ar": [[1493.0, "الطائفةُ الرابعة: بعضُ الأحزاب المعاصرة في هذا الزمان،"], [1500.0, "الذين يجعلون غايةَ التوحيد وأعظمَ المطالب في التوحيد هو توحيدُ الحاكميّة،"], [1507.0, "فيقولون: لا حاكمَ إلا الله؛"], [1511.0, "فيفسّرون «لا إله إلا الله» بقولهم:"], [1514.0, "«لا حاكمَ إلا الله»."], [1516.0, "وهذا ليس هو المعنى الصحيح لكلمة التوحيد."], [1521.0, "وبناءً على ذلك فإنهم يسعون إلى الوصول إلى الحكم ليُصلحوا الحكم ويجعلوه متمحّضًا في تطبيق شريعة الله عز وجل،"], [1534.0, "ويبذلون في ذلك الغاليَ والنفيس،"], [1538.0, "كما هو قولُ جماعة الإخوان المسلمين وغيرِهم من الجماعات؛"], [1546.0, "فإنهم إنما يفسّرون توحيدَ الألوهيّة بتوحيد الحاكميّة."]], "tr": [[1493.0, "Dördüncü fırka: Bu zamandaki bazı çağdaş hizipler."], [1497.3, "Bunlar tevhidin gayesini ve tevhiddeki en büyük talebi hâkimiyyet tevhidi olarak görürler ve \"Allah'tan başka hâkim yoktur\" derler."], [1511.0, "\"Lâ ilâhe illallah\"ı \"Allah'tan başka hâkim yoktur\" sözüyle tefsir ederler."], [1516.0, "Bu, kelime-i tevhidin doğru anlamı değildir."], [1518.1, "Buna dayanarak iktidara ulaşmaya çalışırlar;"], [1521.0, "yönetimi ıslah edip onu yalnızca Allah Azze ve Celle'nin şeriatini uygulamaya tahsis etmek için."], [1529.5, "Bu uğurda pahalı ve değerli ne varsa feda ederler."], [1537.2, "Nitekim İhvân-ı Müslimîn cemaatinin ve diğer cemaatlerin görüşü budur;"], [1546.0, "onlar ulûhiyyet tevhidini hâkimiyyet tevhidiyle tefsir ederler."]]}]}, {"ts": "25:53", "title": "Ehl-i Sünnet'in tefsiri ve İbn Teymiyye'den nakiller", "paras": [{"reader": false, "ar": [[1553.0, "وأمّا أهلُ السنة والجماعة فإنهم يُرجعون معناها إلى توحيد الألوهيّة؛"], [1559.6, "أي: إلى إفراد الله عز وجل بالعبادة؛"], [1565.0, "أي: يجعلون معناها: لا معبودَ بحقٍّ إلا الله عز وجل،"], [1571.0, "كما ذكر هذا الإمامُ ابنُ جريرٍ في تفسيره،"], [1574.2, "وذكره الإمامُ أبو المظفّر السمعانيّ في تفسيره،"], [1577.0, "وغيرُ واحدٍ من أهل العلم."]], "tr": [[1553.0, "Ehl-i Sünnet ve'l-Cemaat ise onun anlamını ulûhiyyet tevhidine, yani ibadette Allah Azze ve Celle'yi birlemeye döndürürler;"], [1566.8, "yani onun anlamını \"Allah Azze ve Celle'den başka hak olarak ibadet edilen yoktur\" diye açıklarlar."], [1573.0, "Nitekim İmam İbn Cerîr tefsirinde bunu zikretmiş, İmam Ebu'l-Muzaffer es-Sem'ânî de tefsirinde zikretmiştir;"], [1577.0, "ilim ehlinden birçokları da (zikretmiştir)."]]}, {"reader": false, "ar": [[1579.0, "قال الإمام ابن تيمية رحمه الله تعالى:"], [1582.0, "«وليس المرادُ بالإله هو القادرَ على الاختراع، كما ظنّه من ظنّه من أئمّة المتكلّمين، حيث ظنّوا أنّ الألوهيّة هي القدرةُ على الاختراع دون غيره، وأنّ من أقرّ بأنّ الله هو القادرُ على الاختراع دون غيره فقد شهد أن لا إله إلا الله؛ فإنّ المشركين كانوا يُقرّون بهذا وهم مشركون، كما تقدّم بيانُه. بل الإلهُ الحقُّ هو الذي يستحقّ بأن يُعبَد؛ فهو إلهٌ بمعنى مألوه، لا إلهٌ بمعنى آلِه»."]], "tr": [[1579.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1582.7, "\"İlah ile kastedilen, icada kâdir olan değildir."], [1590.6, "Kelâmcıların imamlarından bunu zanneden zannetmiştir;"], [1592.9, "ulûhiyyetin, başkası değil (yalnız O'nun) icada kudreti olduğunu ve Allah'ın, başkası değil (yalnız O'nun) icada kâdir olduğunu ikrar edenin 'Lâ ilâhe illallah' diye şehadet etmiş olduğunu zannettiler."], [1606.2, "Oysa müşrikler bunu ikrar ediyorlardı ve müşrik idiler;"], [1610.1, "bunun açıklaması geçti. Bilakis hak ilah, ibadet edilmeyi hak edendir."], [1618.5, "O, 'me'lûh' (kendisine ibadet edilen) anlamında ilahtır;"], [1624.7, "'âlih' (ibadet eden/kâdir olan) anlamında ilah değildir.\""]]}, {"reader": false, "ar": [[1634.0, "لا بدّ أن تفرّقوا بين الإله والآلِه؛"], [1640.0, "فأهلُ الكلام من الفلاسفة ومن نحا نحوَهم يفسّرون توحيدَ الألوهيّة بالآلِه،"], [1647.0, "وأمّا أهلُ السنة فإنهم يفسّرون التوحيد بالألوهيّة."], [1652.0, "ثم قال رحمه الله:"], [1654.3, "«والتوحيدُ أن يُعبَد اللهُ وحده لا شريك له، والإشراكُ أن يَجعلَ مع الله إلهًا آخر»."], [1663.0, "انتهى كلامه رحمه الله."]], "tr": [[1634.0, "İlah ile âlih arasını mutlaka ayırmalısınız."], [1640.0, "Filozoflardan olan kelâm ehli ve onların yolunu tutanlar ulûhiyyet tevhidini \"âlih\" ile tefsir ederler;"], [1647.0, "Ehl-i Sünnet ise tevhidi ulûhiyyet ile tefsir eder."], [1652.0, "Sonra o —Allah ona rahmet etsin— şöyle demiştir:"], [1654.3, "\"Tevhid, ortağı olmaksızın yalnız Allah'a ibadet edilmesidir;"], [1657.2, "şirk ise Allah ile beraber başka bir ilah edinmektir.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[1665.0, "وقال في موضعٍ آخر:"], [1667.0, "«وإذا تبيّن أنّ غايةَ ما يقرّره هؤلاء النُّظّار ـ أهلُ الإثبات للقدر المنتسبون إلى السنة ـ إنما هو توحيدُ الربوبيّة، إنما هو توحيدُ الربوبيّة، وأنّ الله ربُّ كلّ شيء، ومع هذا فالمشركون كانوا مُقرّين بذلك مع أنهم مشركون»."], [1689.0, "انتهى كلامه رحمه الله."]], "tr": [[1665.0, "Başka bir yerde de şöyle demiştir:"], [1667.0, "\"Kaderi ispat eden ve Sünnet'e nispet edilen bu nazar ehlinin (kelâmcıların) yerleştirdiği şeyin en son noktasının ancak rubûbiyyet tevhidi olduğu —ancak rubûbiyyet tevhidi olduğu— ve Allah'ın her şeyin Rabbi olduğu (hususu) anlaşıldığında;"], [1683.6, "bununla beraber müşrikler de, müşrik oldukları hâlde bunu ikrar ediyorlardı.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[1691.0, "وقال في موضعٍ آخر:"], [1693.0, "«والإلهُ هو المستحقُّ للعبادة، فأمّا من اعتقد في الله أنه ربُّ كلّ شيءٍ وخالقُه وهو مع هذا يعبد غيرَه، فإنه مشركٌ بربّه، متّخذٌ من دونه إلهًا آخر. فليست الألوهيّةُ هي الخلقَ، أو القدرةَ على الخلق، أو القِدَمَ، كما يفسّرها هؤلاء المبتدعون في التوحيد من أهل الكلام؛ إذ المشركون الذين شهد اللهُ ورسولُه بأنهم مشركون من العرب وغيرهم لم يكونوا يشكّون في أنّ الله خالقُ كلّ شيءٍ وربُّه»."], [1731.0, "انتهى كلامه رحمه الله."]], "tr": [[1691.0, "Başka bir yerde de şöyle demiştir:"], [1693.0, "\"İlah, ibadete müstahak olandır. Allah hakkında O'nun her şeyin Rabbi ve yaratıcısı olduğuna inanıp bununla beraber O'ndan başkasına ibadet eden ise Rabbine şirk koşan, O'nu bırakıp başka bir ilah edinen kimsedir."], [1716.4, "Ulûhiyyet; tevhid hususunda bid'at çıkaran şu kelâm ehlinin tefsir ettiği gibi yaratmak, yaratmaya kudret ya da kıdem (ezelîlik) değildir."], [1731.0, "Zira Allah'ın ve Resûlü'nün müşrik olduklarına şahitlik ettiği Araplar ve diğerlerinden müşrikler, Allah'ın her şeyin yaratıcısı ve Rabbi olduğundan şüphe etmiyorlardı.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[1733.0, "أي: أنّ الكفّار المشركين الأوائل يقولون:"], [1739.4, "لا خالقَ إلا الله،"], [1741.0, "كما قال الله عز وجل:"], [1744.0, "<span class=\"ayah\">﴿وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَهُمْ لَيَقُولُنَّ اللَّهُ﴾<\/span> <span class=\"ref\">[الزخرف: ٨٧]<\/span>،"], [1748.0, "<span class=\"ayah\">﴿وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ لَيَقُولُنَّ اللَّهُ﴾<\/span> <span class=\"ref\">[العنكبوت: ٦١]<\/span>؛"], [1755.0, "فهم مُقرّون بهذا. فإذًا ليس معنى كلمة التوحيد:"], [1758.2, "لا خالقَ إلا الله،"], [1760.0, "لا قادرَ على الاختراع إلا الله،"], [1762.0, "لا ربَّ إلا الله؛"], [1763.0, "فإنّ ذلك لا يُغني عن الدخول في الإسلام..."], [1765.6, "فإنّ ذلك لا يُغني صاحبَه في تحقيق التوحيد الذي بُعثت به الرسلُ ونزلت به الكتب."]], "tr": [[1733.0, "Yani ilk kâfir müşrikler \"Allah'tan başka yaratıcı yoktur\" diyorlardı."], [1740.2, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1744.0, "<span class=\"ayah\">﴿Andolsun, onlara kendilerini kimin yarattığını sorsan, elbette \"Allah\" derler﴾<\/span> [Zuhruf 87];"], [1748.4, "<span class=\"ayah\">﴿Andolsun, onlara gökleri ve yeri kimin yarattığını, güneşi ve ayı kimin boyun eğdirdiğini sorsan, elbette \"Allah\" derler﴾<\/span> [Ankebût 61]."], [1756.0, "Onlar bunu ikrar ediyorlardı. O hâlde kelime-i tevhidin anlamı \"Allah'tan başka yaratıcı yoktur\", \"Allah'tan başka icada kâdir yoktur\", \"Allah'tan başka Rab yoktur\" değildir."], [1763.0, "Çünkü bu, İslam'a girmekten müstağni kılmaz… (düzelterek:) bu, sahibine, resullerin onunla gönderildiği ve kitapların onunla indiği tevhidi gerçekleştirmede bir fayda sağlamaz."]]}]}, {"ts": "29:36", "title": "4. Külliye: Bütün resuller ulûhiyyet tevhidini yerleştirmek için gönderilmiştir", "paras": [{"reader": false, "ar": [[1776.0, "ومن الكلّيّات أيضًا: <b>كلُّ الرسل بُعثوا لتقرير توحيد الألوهيّة.<\/b> اليومَ قواعدُنا واضحة،"], [1789.5, "ولكن من باب التذكير والتأكيد:"], [1792.0, "كلُّ الرسل بُعثوا لتقرير توحيد الألوهيّة."]], "tr": [[1776.0, "Külliyelerden biri de şudur: 4."], [1780.0, "külliye: Bütün resuller ulûhiyyet tevhidini yerleştirmek (takrir etmek) için gönderilmiştir. Bugün kaidelerimiz açık;"], [1789.5, "fakat hatırlatmak ve pekiştirmek için (tekrar ediyorum):"], [1792.0, "Bütün resuller ulûhiyyet tevhidini yerleştirmek için gönderilmiştir."]]}, {"reader": false, "ar": [[1797.0, "أقول وبالله التوفيق: وهذا بإجماع أهل السنة والجماعة؛"], [1805.0, "فإنّ الرسل وإن ذكروا في رسالتهم توحيدَ الربوبيّة فإنهم لا يذكرونه تقريرًا،"], [1814.0, "وإنما يذكرونه استدلالًا به على المطلوب الأعظم،"], [1818.9, "وهو توحيدُ الألوهيّة، كما قال الله عز وجل:"], [1825.0, "<span class=\"ayah\">﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ ۖ فَمِنْهُم مَّنْ هَدَى اللَّهُ وَمِنْهُم مَّنْ حَقَّتْ عَلَيْهِ الضَّلَالَةُ﴾<\/span> <span class=\"ref\">[النحل: ٣٦]<\/span>."], [1833.0, "ويقول الله عز وجل:"], [1835.0, "<span class=\"ayah\">﴿وَمَا أَرْسَلْنَا مِن قَبْلِكَ مِن رَّسُولٍ إِلَّا نُوحِي إِلَيْهِ أَنَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدُونِ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٥]<\/span>."], [1843.0, "ويقول الله عز وجل:"], [1845.0, "<span class=\"ayah\">﴿وَاسْأَلْ مَنْ أَرْسَلْنَا مِن قَبْلِكَ مِن رُّسُلِنَا أَجَعَلْنَا مِن دُونِ الرَّحْمَٰنِ آلِهَةً يُعْبَدُونَ﴾<\/span> <span class=\"ref\">[الزخرف: ٤٥]<\/span>."]], "tr": [[1797.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır."], [1805.0, "Resuller risaletlerinde rubûbiyyet tevhidini zikretmiş olsalar da onu (asıl maksat olarak) yerleştirmek için zikretmezler;"], [1813.2, "ancak en büyük matlûba, yani ulûhiyyet tevhidine onunla delil getirmek için zikrederler."], [1820.3, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1825.0, "<span class=\"ayah\">﴿Andolsun ki biz her ümmete \"Allah'a ibadet edin ve tâğûttan kaçının\" diye bir resul gönderdik. Allah onlardan kimine hidayet etti, kimine de sapıklık hak oldu﴾<\/span> [Nahl 36]."], [1833.0, "Allah Azze ve Celle şöyle buyurur:"], [1835.0, "<span class=\"ayah\">﴿Senden önce gönderdiğimiz her resule mutlaka \"Benden başka ilah yoktur; öyleyse bana ibadet edin\" diye vahyettik﴾<\/span> [Enbiyâ 25]."], [1843.0, "Allah Azze ve Celle şöyle buyurur:"], [1845.0, "<span class=\"ayah\">﴿Senden önce gönderdiğimiz resullerimize sor: Rahmân'dan başka ibadet edilecek ilahlar kılmış mıyız?﴾<\/span> [Zuhruf 45]."]]}, {"reader": false, "ar": [[1852.0, "وقال الله عز وجل:"], [1854.0, "<span class=\"ayah\">﴿يُنَزِّلُ الْمَلَائِكَةَ بِالرُّوحِ مِنْ أَمْرِهِ عَلَىٰ مَن يَشَاءُ مِنْ عِبَادِهِ﴾<\/span> ـ ما وظيفتُهم؟"], [1861.0, "ـ <span class=\"ayah\">﴿أَنْ أَنذِرُوا أَنَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاتَّقُونِ﴾<\/span> <span class=\"ref\">[النحل: ٢]<\/span>."], [1865.2, "هذه وظيفةُ الرسل، هذه وظيفةُ الرسل."], [1870.0, "ولذلك فإنه ما من رسولٍ إلا ودعا قومَه إلى توحيد الألوهيّة."], [1875.0, "فهذا خليلُ الرحمن إبراهيمُ عليه الصلاة والسلام يدعو قومَه إلى هذا التوحيد الخالص،"], [1883.0, "فيقول الله عز وجل عنه:"], [1885.8, "<span class=\"ayah\">﴿وَإِبْرَاهِيمَ إِذْ قَالَ لِقَوْمِهِ اعْبُدُوا اللَّهَ وَاتَّقُوهُ ۖ ذَٰلِكُمْ خَيْرٌ لَّكُمْ إِن كُنتُمْ تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[العنكبوت: ١٦]<\/span>."]], "tr": [[1852.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1854.0, "<span class=\"ayah\">﴿O, melekleri kendi emrinden olan vahiyle kullarından dilediğine indirir﴾<\/span> —onların (resullerin) görevi nedir?— <span class=\"ayah\">﴿(der ki:) \"Benden başka ilah olmadığını haber verip uyarın; öyleyse benden sakının\"﴾<\/span> [Nahl 2]."], [1865.2, "Resullerin görevi budur, resullerin görevi budur."], [1870.0, "Bu yüzden kavmini ulûhiyyet tevhidine çağırmamış hiçbir resul yoktur."], [1875.0, "İşte Rahmân'ın dostu İbrâhîm —aleyhissalâtu vesselâm— kavmini bu hâlis tevhide çağırıyor."], [1881.5, "Allah Azze ve Celle onun hakkında şöyle buyurur:"], [1885.8, "<span class=\"ayah\">﴿İbrâhîm'i de (gönderdik). Hani kavmine şöyle demişti: \"Allah'a ibadet edin ve O'ndan sakının. Eğer bilirseniz bu sizin için daha hayırlıdır\"﴾<\/span> [Ankebût 16]."]]}, {"reader": false, "ar": [[1893.0, "وكذلك نبيُّ الله شعيب،"], [1894.8, "في قول الله عز وجل:"], [1897.2, "<span class=\"ayah\">﴿وَإِلَىٰ مَدْيَنَ أَخَاهُمْ شُعَيْبًا فَقَالَ يَا قَوْمِ اعْبُدُوا اللَّهَ وَارْجُوا الْيَوْمَ الْآخِرَ وَلَا تَعْثَوْا فِي الْأَرْضِ مُفْسِدِينَ﴾<\/span> <span class=\"ref\">[العنكبوت: ٣٦]<\/span>."], [1905.0, "وكذلك نبيُّ الله صالح،"], [1907.0, "كما قال الله عز وجل:"], [1909.0, "<span class=\"ayah\">﴿وَلَقَدْ أَرْسَلْنَا إِلَىٰ ثَمُودَ أَخَاهُمْ صَالِحًا أَنِ اعْبُدُوا اللَّهَ فَإِذَا هُمْ فَرِيقَانِ يَخْتَصِمُونَ﴾<\/span> <span class=\"ref\">[النمل: ٤٥]<\/span>."], [1915.0, "وكذلك نبيُّ الله نوح،"], [1918.0, "فإنه قال لقومه: <span class=\"ayah\">﴿اعْبُدُوا اللَّهَ مَا لَكُم مِّنْ إِلَٰهٍ غَيْرُهُ ۚ أَفَلَا تَتَّقُونَ﴾<\/span> <span class=\"ref\">[المؤمنون: ٢٣]<\/span>."]], "tr": [[1893.0, "Allah'ın peygamberi Şuayb da böyledir;"], [1894.8, "Allah Azze ve Celle'nin şu sözünde:"], [1897.2, "<span class=\"ayah\">﴿Medyen'e de kardeşleri Şuayb'ı (gönderdik). Dedi ki: \"Ey kavmim! Allah'a ibadet edin, ahiret gününü umun ve yeryüzünde bozguncular olarak fesat çıkarmayın\"﴾<\/span> [Ankebût 36]."], [1905.0, "Allah'ın peygamberi Sâlih de böyledir."], [1906.5, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1909.0, "<span class=\"ayah\">﴿Andolsun, Semûd'a da \"Allah'a ibadet edin\" diye kardeşleri Sâlih'i gönderdik. Bir de baktık ki onlar birbiriyle çekişen iki grup oluvermişler﴾<\/span> [Neml 45]."], [1915.0, "Allah'ın peygamberi Nûh da böyledir;"], [1917.2, "kavmine şöyle demiştir: <span class=\"ayah\">﴿Allah'a ibadet edin; sizin O'ndan başka hiçbir ilahınız yoktur. Hâlâ sakınmayacak mısınız?﴾<\/span> [Mü'minûn 23]."]]}, {"reader": false, "ar": [[1925.0, "بل وجميعُ الأنبياء والرسل دعوا قومَهم إلى عبادة الله وحده،"], [1930.9, "قائلين لأقوامهم: «قولوا: لا إله إلا الله تُفلحوا»."], [1936.0, "وعيسى عليه الصلاة والسلام قال لقومه:"], [1939.4, "<span class=\"ayah\">﴿إِنَّ اللَّهَ رَبِّي وَرَبُّكُمْ فَاعْبُدُوهُ ۗ هَٰذَا صِرَاطٌ مُّسْتَقِيمٌ﴾<\/span> <span class=\"ref\">[آل عمران: ٥١]<\/span>،"], [1944.0, "وقال لقومه: <span class=\"ayah\">﴿إِنَّهُ مَن يُشْرِكْ بِاللَّهِ فَقَدْ حَرَّمَ اللَّهُ عَلَيْهِ الْجَنَّةَ وَمَأْوَاهُ النَّارُ ۖ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ﴾<\/span> <span class=\"ref\">[المائدة: ٧٢]<\/span>،"], [1954.0, "وما للظالمين من أنصار."]], "tr": [[1925.0, "Hatta bütün peygamberler ve resuller, kavimlerine \"Lâ ilâhe illallah deyin ki kurtuluşa eresiniz\" diyerek onları yalnız Allah'a ibadete çağırmışlardır."], [1932.8, "Îsâ —aleyhissalâtu vesselâm— kavmine şöyle demiştir:"], [1936.0, "<span class=\"ayah\">﴿Şüphesiz Allah benim de Rabbim, sizin de Rabbinizdir; öyleyse O'na ibadet edin. Dosdoğru yol budur﴾<\/span> [Âl-i İmrân 51]."], [1945.2, "Kavmine şöyle de demiştir: <span class=\"ayah\">﴿Kim Allah'a ortak koşarsa, şüphesiz Allah ona cenneti haram kılmıştır; onun varacağı yer ateştir. Zalimlerin hiçbir yardımcısı yoktur﴾<\/span> [Mâide 72]; zalimlerin hiçbir yardımcısı yoktur."]]}, {"reader": false, "ar": [[1957.0, "وكذلك أيضًا كفّارُ قريش؛"], [1959.0, "فإنّ النبيّ ﷺ دعاهم إلى كلمة التوحيد،"], [1963.0, "كما قال الله عز وجل:"], [1965.1, "<span class=\"ayah\">﴿إِنَّهُمْ كَانُوا إِذَا قِيلَ لَهُمْ لَا إِلَٰهَ إِلَّا اللَّهُ يَسْتَكْبِرُونَ وَيَقُولُونَ أَئِنَّا لَتَارِكُو آلِهَتِنَا لِشَاعِرٍ مَّجْنُونٍ﴾<\/span> <span class=\"ref\">[الصافات: ٣٥-٣٦]<\/span>."], [1976.0, "وهذه الكلّيّة تبيّن سببًا عظيمًا من أسباب الخلاف فيما بيننا وبين طوائف أهل البدع؛"], [1985.0, "فإنّ أهل البدع متّفقون على أنّ التوحيد الذي نزلت به الرسلُ ـ عفوًا:"], [1989.6, "الكتبُ، وأُرسلت به الرسلُ ـ إنما هو توحيدُ الربوبيّة،"], [1994.0, "وأمّا أهلُ السنة والجماعة فإنهم يقولون بأنه توحيدُ الألوهيّة."]], "tr": [[1957.0, "Kureyş kâfirleri de böyledir. Nebî ﷺ onları kelime-i tevhide çağırmıştır."], [1962.2, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1965.1, "<span class=\"ayah\">﴿Onlara \"Allah'tan başka ilah yoktur\" denildiğinde büyüklük taslarlar ve \"Deli bir şair için ilahlarımızı mı bırakacağız?\" derlerdi﴾<\/span> [Sâffât 35-36]."], [1976.7, "Bu külliye, bizimle bid'at ehlinin fırkaları arasındaki ihtilafın büyük bir sebebini ortaya koyar."], [1985.0, "Çünkü bid'at ehli, resullerin onunla indiği —pardon:"], [1989.6, "kitapların onunla indiği ve resullerin onunla gönderildiği— tevhidin ancak rubûbiyyet tevhidi olduğu üzerinde ittifak etmişlerdir."], [1995.0, "Ehl-i Sünnet ve'l-Cemaat ise onun ulûhiyyet tevhidi olduğunu söyler."]]}]}, {"ts": "33:21", "title": "4. Külliyenin şerhi (devam): Muâz hadisi ve İbn Teymiyye'den nakil", "paras": [{"reader": false, "ar": [[2001.0, "وفي «الصحيحين» من حديث ابن عبّاسٍ رضي الله عنهما قال:"], [2005.4, "لمّا بعث النبيُّ ﷺ معاذًا إلى اليمن قال:"], [2009.4, "«إنّك تَقدَم على قومٍ من أهل الكتاب، فليكن أوّلَ ما تدعوهم إليه شهادةُ أن لا إله إلا الله»."], [2017.0, "ويقول النبيُّ ﷺ: «أُمرتُ أن أقاتل الناس حتى يشهدوا أن لا إله إلا الله وأنّ محمدًا رسول الله» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[2001.0, "Sahîhayn'de İbn Abbâs'tan —Allah ikisinden de razı olsun— rivayet edilen hadiste şöyle der:"], [2005.4, "Nebî ﷺ Muâz'ı Yemen'e gönderdiğinde buyurdu ki:"], [2009.4, "\"Sen Ehl-i Kitap'tan bir kavme gidiyorsun."], [2010.8, "Onları ilk davet edeceğin şey, Allah'tan başka ilah olmadığına şehadet olsun.\" Nebî ﷺ de şöyle buyurur:"], [2017.0, "\"Allah'tan başka ilah olmadığına ve Muhammed'in Allah'ın Resûlü olduğuna şehadet edinceye kadar insanlarla savaşmakla emrolundum.\""]]}, {"reader": false, "ar": [[2026.0, "قال الإمام ابن تيمية رحمه الله تعالى:"], [2029.0, "«فإنّ الرسل جميعَهم أُمروا بالتوحيد» ـ عفوًا ـ «فإنّ الرسل جميعَهم أُمروا بالتوحيد وأَمَروا به؛ قال الله عز وجل: <span class=\"ayah\">﴿وَمَا أَرْسَلْنَا مِن قَبْلِكَ مِن رَّسُولٍ إِلَّا نُوحِي إِلَيْهِ أَنَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدُونِ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٥]<\/span>، فبيّن أنه لا بدّ أن يوحيَ بالتوحيد إلى كلّ رسول، كما قال الله عز وجل: <span class=\"ayah\">﴿وَاسْأَلْ مَنْ أَرْسَلْنَا مِن قَبْلِكَ مِن رُّسُلِنَا أَجَعَلْنَا مِن دُونِ الرَّحْمَٰنِ آلِهَةً يُعْبَدُونَ﴾<\/span> <span class=\"ref\">[الزخرف: ٤٥]<\/span>» <span class=\"note\">(Şeyh burada «من دون الله» diyor)<\/span>."], [2060.0, "انتهى كلامه رحمه الله تعالى، والكلّيّة واضحة."]], "tr": [[2026.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2029.0, "\"Resullerin hepsi tevhidle emrolundu\" —pardon— \"Resullerin hepsi tevhidle emrolundu ve onu emretti."], [2043.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [2046.3, "<span class=\"ayah\">﴿Senden önce gönderdiğimiz her resule mutlaka \"Benden başka ilah yoktur; öyleyse bana ibadet edin\" diye vahyettik﴾<\/span> [Enbiyâ 25]."], [2060.0, "(Böylece) her resule mutlaka tevhidin vahyedilmesi gerektiğini açıkladı."], [2060.6, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2061.1, "<span class=\"ayah\">﴿Senden önce gönderdiğimiz resullerimize sor: Rahmân'dan başka ibadet edilecek ilahlar kılmış mıyız?﴾<\/span> [Zuhruf 45].\" Sözü —Allah ona rahmet etsin— burada bitti. Külliye açıktır."]]}]}, {"ts": "34:24", "title": "5. Külliye: Rubûbiyyetin gereklerinden birine delâlet eden her nas, ulûhiyyette vahdâniyete delâleti gerektirir", "paras": [{"reader": false, "ar": [[2064.0, "ومن الكلّيّات أيضًا: <b>كلُّ نصٍّ يدلّ على شيءٍ من مقتضيات الربوبيّة فمستلزِمٌ للدلالة على الوحدانيّة في الألوهيّة.<\/b> <span class=\"note\">(يكررها، وقال في إعادتها: «فمستلزمٌ للدلالة على وجوب الوحدانيّة في الألوهيّة»)<\/span> واضحٌ هذا؟"]], "tr": [[2064.0, "Külliyelerden biri de şudur: 5."], [2067.5, "külliye: Rubûbiyyetin gereklerinden bir şeye delâlet eden her nas, ulûhiyyette vahdâniyete (birliğe) delâleti gerektirir. (Tekrar ediyor; tekrarında \"ulûhiyyette vahdâniyetin vücûbuna delâleti gerektirir\" diyor.) Bu açık mı?"]]}, {"reader": false, "ar": [[2114.0, "وهذه الكلّيّة تبيّن لك أعظمَ برهانٍ وأعظمَ دليلٍ يطرقه القرآنُ كثيرًا في الدلالة على توحيد الألوهيّة،"], [2123.0, "وهو تقريرُ توحيد الربوبيّة بمقتضياته؛"], [2127.6, "فحيثما رأيتَ آيةً تدلّ على شيءٍ من مقتضيات ما يجب للربّ،"], [2134.0, "فاعلم أنها تستلزم القيامَ بالواجب من حقوق الإله عز وجل،"], [2141.0, "كما قال الله عز وجل:"], [2143.0, "<span class=\"ayah\">﴿قُلْ مَن يَرْزُقُكُم مِّنَ السَّمَاءِ وَالْأَرْضِ أَمَّن يَمْلِكُ السَّمْعَ وَالْأَبْصَارَ وَمَن يُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَيُخْرِجُ الْمَيِّتَ مِنَ الْحَيِّ وَمَن يُدَبِّرُ الْأَمْرَ ۚ فَسَيَقُولُونَ اللَّهُ﴾<\/span> <span class=\"ref\">[يونس: ٣١]<\/span>."], [2158.0, "وهذا كلُّه تقريرٌ لشيءٍ من مقتضيات الربوبيّة،"], [2163.0, "ثم ختمه بقوله: <span class=\"ayah\">﴿فَذَٰلِكُمُ اللَّهُ رَبُّكُمُ الْحَقُّ ۖ فَمَاذَا بَعْدَ الْحَقِّ إِلَّا الضَّلَالُ ۖ فَأَنَّىٰ تُصْرَفُونَ﴾<\/span> <span class=\"ref\">[يونس: ٣٢]<\/span>؛"], [2171.0, "فجعل طريقَ إثبات الألوهيّة تقريرَ الربوبيّة."]], "tr": [[2114.0, "Bu külliye sana, Kur'an'ın ulûhiyyet tevhidine delâlet hususunda sıkça başvurduğu en büyük burhanı ve en büyük delili gösterir:"], [2122.4, "O da rubûbiyyet tevhidini gerekleriyle birlikte yerleştirmektir."], [2127.6, "Rabbe vâcib olan şeylerin gereklerinden bir şeye delâlet eden bir ayet gördüğün her yerde bil ki o, İlah Azze ve Celle'nin haklarından vâcib olanı yerine getirmeyi gerektirir."], [2140.3, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2143.0, "<span class=\"ayah\">﴿De ki: Size gökten ve yerden kim rızık veriyor? Ya da kulaklara ve gözlere kim sahip? Ölüden diriyi kim çıkarıyor, diriden ölüyü kim çıkarıyor? İşleri kim idare ediyor? \"Allah\" diyecekler﴾<\/span> [Yûnus 31]."], [2158.0, "Bunların hepsi rubûbiyyetin gereklerinden bir şeyi yerleştirmektir."], [2161.6, "Sonra (ayeti) şu sözüyle bitirdi:"], [2164.0, "<span class=\"ayah\">﴿İşte O, sizin hak Rabbiniz Allah'tır. Haktan sonra sapıklıktan başka ne var? O hâlde nasıl (haktan) çevriliyorsunuz?﴾<\/span> [Yûnus 32]."], [2171.0, "Böylece ulûhiyyeti ispatın yolunu rubûbiyyeti yerleştirmek kıldı."]]}, {"reader": false, "ar": [[2177.0, "ويقول الله عز وجل:"], [2179.0, "<span class=\"ayah\">﴿يَا أَيُّهَا النَّاسُ اعْبُدُوا رَبَّكُمُ﴾<\/span> <span class=\"ref\">[البقرة: ٢١]<\/span> ـ وهذا ألوهيّة ـ ثم استدلّ عليها بشيءٍ من مقتضيات الربوبيّة،"], [2186.0, "فقال: <span class=\"ayah\">﴿الَّذِي خَلَقَكُمْ وَالَّذِينَ مِن قَبْلِكُمْ لَعَلَّكُمْ تَتَّقُونَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ فِرَاشًا وَالسَّمَاءَ بِنَاءً وَأَنزَلَ مِنَ السَّمَاءِ مَاءً فَأَخْرَجَ بِهِ مِنَ الثَّمَرَاتِ رِزْقًا لَّكُمْ ۖ فَلَا تَجْعَلُوا لِلَّهِ أَندَادًا وَأَنتُمْ تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[البقرة: ٢١-٢٢]<\/span> <span class=\"note\">(Şeyh «وأنزل لكم من السماء» diyor)<\/span>؛"], [2206.0, "فجعل تقريرَ الربوبيّة مستلزِمًا للاعتراف بتوحيد الألوهيّة."]], "tr": [[2177.0, "Allah Azze ve Celle şöyle buyurur:"], [2179.0, "<span class=\"ayah\">﴿Ey insanlar! Rabbinize ibadet edin﴾<\/span> [Bakara 21] —bu ulûhiyyettir— sonra buna rubûbiyyetin gereklerinden bir şeyle delil getirerek şöyle buyurdu:"], [2186.7, "<span class=\"ayah\">﴿O ki sizi ve sizden öncekileri yarattı; umulur ki korunursunuz. O ki yeri sizin için bir döşek, göğü bir bina yaptı; gökten su indirip onunla size rızık olarak çeşitli meyveler çıkardı. Öyleyse bile bile Allah'a eşler koşmayın﴾<\/span> [Bakara 21-22]."], [2206.0, "Böylece rubûbiyyeti yerleştirmeyi, ulûhiyyet tevhidini kabul etmeyi gerektiren bir şey kıldı."]]}, {"reader": false, "ar": [[2214.0, "ولذلك قال الإمام ابن كثير رحمه الله تعالى:"], [2218.0, "«شرع تبارك وتعالى في بيان وحدانيّة ألوهيّته، بأنه تعالى هو المنعمُ على عبيده بإخراجهم من العدم إلى الوجود، وإسباغِه عليهم النعمَ الظاهرةَ والباطنة، ومضمونُه أنه الخالقُ الرازقُ، مالكُ الدار وساكنيها ورازقُهم، فبهذا يستحقّ أن يُعبَد وحده لا شريك له دون غيره»."], [2252.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[2214.0, "Bu yüzden İmam İbn Kesîr —Allah ona rahmet etsin— şöyle demiştir:"], [2218.0, "\"(Allah) Tebâreke ve Teâlâ, ulûhiyyetinin birliğini açıklamaya başladı:"], [2225.5, "Kullarını yokluktan varlığa çıkararak ve onlara zâhir ve bâtın nimetleri bolca vererek onlara nimet veren O'dur."], [2235.7, "Bunun özü şudur: O, yaratan, rızık veren, yurdun ve yurtta oturanların sahibi ve onlara rızık verendir."], [2252.0, "İşte bu sebeple, başkası değil, ortağı olmaksızın yalnız O'na ibadet edilmeyi hak eder.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}]}, {"ts": "37:34", "title": "5. Külliyenin şerhi (devam): İbnü'l-Kayyim, Abdüllatîf b. Abdurrahmân ve Şinkîtî'den nakiller", "paras": [{"reader": false, "ar": [[2254.0, "وأنا أستأذنكم في نقلٍ طويلٍ عن الإمام ابن القيّم رحمه الله تعالى،"], [2261.0, "فاستمعوه بقلوبكم. قال الإمام ابن القيّم:"], [2264.0, "«إذا تُيُقِّن...» ـ إذا تُيُقِّن أنّ الضرَّ والنفعَ..."], [2271.0, "كلُّ هذه مقتضياتٌ إلهيّة <span class=\"q\">؟ 37:51<\/span> ـ «إذا تُيُقِّن أنّ الضرّ والنفع، والعطاء والمنع، والهدى والضلال، والسعادة والشقاء، كلُّ ذلك بيد الله لا بيد غيره، وأنه الذي يقلّب القلوبَ ويصرّفها كيف يشاء، وأنه لا موفَّقَ إلا من وفّقه وأعانه، ولا مخذولَ إلا من خذله وأهانه وتخلّى عنه، وأنّ أصحَّ القلوب وأسلمَها وأقومَها وأرقَّها وأصفاها وأشدَّها وألينَها من اتّخذه وحده إلهًا ومعبودًا، فكان أحبَّ إليه من كلّ ما سواه، وأخوفَ عنده من كلّ ما سواه، وأرجى له من كلّ ما سواه،"]], "tr": [[2254.0, "Uzun bir nakil için İmam İbnü'l-Kayyim'den —Allah ona rahmet etsin— izninizi istiyorum;"], [2258.7, "onu kalplerinizle dinleyin. İmam İbnü'l-Kayyim şöyle demiştir:"], [2262.0, "\"Kesin olarak bilindiğinde…\" —zararın ve faydanın… bunların hepsi ilahî gereklerdir <span class=\"q\">؟<\/span>— \"Zararın ve faydanın, vermenin ve engellemenin, hidayetin ve dalâletin, saadetin ve bedbahtlığın hepsinin başkasının değil Allah'ın elinde olduğu;"], [2264.0, "kalpleri dilediği gibi çeviren ve evirenin O olduğu;"], [2271.0, "O'nun muvaffak kıldığı ve yardım ettiği kimseden başka muvaffak olan bulunmadığı, O'nun yardımsız bıraktığı, horladığı ve terk ettiği kimseden başka yardımsız kalan bulunmadığı;"], [2287.0, "kalplerin en sağlamının, en selimının, en dosdoğrusunun, en yumuşağının, en sâfisinin, en güçlüsünün ve en yumuşak huylusunun, yalnız O'nu ilah ve mabud edinen (kalp) olduğu kesin olarak bilindiğinde;"], [2307.0, "(o kimse için Allah) kendisine O'ndan başka her şeyden daha sevimli, katında O'ndan başka her şeyden daha korkulan ve O'ndan başka her şeyden daha çok umulan olur."]]}, {"reader": false, "ar": [[2322.0, "فتتقدّم محبّتُه في قلبه جميعَ المحابّ،"], [2327.0, "فتنساق المحابُّ تبعًا لها كما ينساق الجيشُ تبعًا للسلطان،"], [2334.0, "ويتقدّم خوفُه في قلبه جميعَ المخوفات،"], [2338.0, "فتنساق المخاوفُ كلُّها تبعًا لخوفه،"], [2342.0, "ويتقدّم رجاؤه في قلبه جميعَ الرجاء،"], [2347.0, "فينساق كلُّ رجاءٍ تبعًا لرجائه."], [2351.0, "فهذا علامةُ توحيد ألوهيّته،"], [2354.0, "فهذا علامةُ توحيد الإلهيّة في هذا القلب،"], [2361.0, "والبابُ الذي دخل إليه منه هو توحيدُ الربوبيّة»."], [2367.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[2322.0, "Böylece O'nun sevgisi kalbinde bütün sevilenlerin önüne geçer;"], [2329.8, "ordunun sultana tâbi olarak sevk edilmesi gibi sevilenler de ona tâbi olarak sevk edilir."], [2343.5, "O'ndan korkusu kalbinde bütün korkulanların önüne geçer;"], [2351.0, "bütün korkular O'ndan korkusuna tâbi olarak sevk edilir."], [2355.5, "O'na ümidi kalbinde bütün ümitlerin önüne geçer;"], [2361.0, "her ümit O'na olan ümidine tâbi olarak sevk edilir."], [2367.0, "İşte bu, O'nun ulûhiyyetini tevhidin alametidir;"], [2367.4, "bu, o kalpteki ilâhiyyet tevhidinin alametidir."], [2367.8, "Ona girilen kapı ise rubûbiyyet tevhididir.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[2369.0, "وقال الشيخ عبد اللطيف بن عبد الرحمن بن حسن رحمهم الله تعالى:"], [2374.0, "«توحيدُ الربوبيّة يستلزم توحيدَ الألوهيّة؛ لأنّ توحيد الربوبيّة دليلٌ على توحيد الإلهيّة والعبادة والقصد، ووسيلةٌ له»."], [2386.0, "وقال الإمام الشنقيطيّ رحمه الله:"], [2388.0, "«يُكثر اللهُ تعالى في القرآن العظيم الاستدلالَ على الكفار باعترافهم بربوبيّته جلّ وعلا على وجوب توحيده في عبادته».
