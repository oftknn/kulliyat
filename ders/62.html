<script>
const D={"no": 62, "vid": "txrzfurw_WQ", "title_ar": "الدرس (٦٢) من شرح كليات العقيدة — خاتمة كليات باب الأسماء", "title_tr": "Şerhu Külliyyâti'l-Akîde — 62. Ders: İsimler Babının Son Külliyeleri (İsimlerin Gerektirdikleriyle Vasıflanmak, Şirk Vehmi Veren İsimler, İsimlerin Zâta Ezelen ve Ebeden Mülâzemeti, Duada İsmin Talebe Uygunluğu, İsimleri Ta'tilin Rubûbiyyet ve Ulûhiyyete Etkisi, Gafletten Doğan Muhalefetler, İsimleri Ta'til Edenin Tekfiri)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Allah'ın isimlerinin gerektirdiklerinden bir şeyle vasıflanan herkes O'nun sevdiğidir; meğer ki o, Allah'a has özelliklerden olsun", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.7, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.4, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [9.0, "أظنّ هذا الدرسَ هو آخرَ الدروس في كلّيّات باب الأسماء،"], [13.8, "ثم ننتقل بعدها ـ إن شاء الله ـ إلى البحر الخِضَمّ الكبير،"], [18.7, "وهو كلّيّات ـ أو قواعد ـ باب الصفات إن شاء الله."], [23.0, "وعندنا سبعُ كلّيّات أو ستُّ كلّيّات، على حسب التيسير."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.3, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.0, "Zannediyorum bu ders, isimler babının külliyelerindeki derslerin sonuncusudur."], [13.8, "Ardından inşallah o büyük, engin denize, yani sıfatlar babının külliyelerine —veya kaidelerine— geçeceğiz inşallah."], [23.0, "Elimizde, kolaylığına göre yedi veya altı külliye var."]]}, {"reader": false, "ar": [[30.0, "الكلّيّة الأولى: كلُّ متّصفٍ بشيءٍ من موجَبات أسماء الله عز وجل فمحبوبٌ له،"], [44.0, "ما لم تكن من خصائصه. <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [59.0, "كلُّ متّصفٍ بشيءٍ من موجَبات أسماء الله عز وجل فمحبوبٌ له،"], [64.5, "ما لم تكن من خصائصه."]], "tr": [[30.0, "1. külliye: Allah Azze ve Celle'nin isimlerinin gerektirdiklerinden (mûcebâtından) bir şeyle vasıflanan herkes, O'nun sevdiğidir;"], [39.2, "meğer ki o, Allah'a has özelliklerden olsun. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [59.0, "1. külliye: Allah Azze ve Celle'nin isimlerinin gerektirdiklerinden bir şeyle vasıflanan herkes, O'nun sevdiğidir;"], [64.0, "meğer ki o, Allah'a has özelliklerden olsun."]]}, {"reader": false, "ar": [[67.0, "أقول وبالله التوفيق: لقد عرفنا سابقًا في الكلّيّات بأنّ الواجب علينا في أسماء الله عز وجل ثلاثةُ أمور:"], [77.0, "أن نُثبتها اسمًا لله عز وجل،"], [79.8, "وأن نُثبت الصفةَ التي تضمّنها ذلك الاسم،"], [83.0, "وأن نتعبّد لله عز وجل بمقتضيات وآثار هذه الأسماء."], [88.0, "وهذه الكلّيّة تتكلّم عن الأمر الثالث."], [91.0, "فإنّ من صور التعبّد لله عز وجل بأسمائه وصفاته:"], [101.0, "أن يحرص المسلمُ على أن يتّصف بشيءٍ من موجَبات هذه الأسماء والصفات ما استطاع إلى ذلك سبيلًا،"], [108.0, "إلا أنّ هذا مشروطٌ بما في آخر الكلّيّة من قوله:"], [113.0, "«ما لم تكن من خصائصه»،"], [114.7, "وسيأتي شرحُها بعد قليلٍ إن شاء الله."]], "tr": [[67.0, "Tevfik Allah'tandır, derim ki: Daha önce külliyelerde öğrendik ki Allah Azze ve Celle'nin isimleri hakkında üzerimize vâcip olan üç şey vardır:"], [77.0, "Onları Allah Azze ve Celle'ye isim olarak isbat etmek, o ismin içerdiği sıfatı isbat etmek ve bu isimlerin muktezâları ve eserleriyle Allah Azze ve Celle'ye kulluk etmek."], [88.0, "Bu külliye üçüncü husustan bahseder."], [91.0, "Allah Azze ve Celle'ye isim ve sıfatlarıyla kulluk etmenin suretlerinden biri, Müslüman'ın gücü yettiğince bu isim ve sıfatların gerektirdiklerinden bir şeyle vasıflanmaya özen göstermesidir."], [106.8, "Ancak bu, külliyenin sonundaki \"meğer ki Allah'a has özelliklerden olsun\" sözündeki şarta bağlıdır;"], [113.0, "inşallah az sonra bunun şerhi gelecek."]]}, {"reader": false, "ar": [[117.0, "وقد نصّ على هذه الكلّيّة جمعٌ من أهل العلم رحمهم الله تعالى."], [123.0, "قال ابن تيميّة رحمه الله:"], [126.1, "«والله تعالى يحبّ من العباد أمورًا اتّصف بها، كما قال النبيّ صلى الله عليه وسلم: إنّ الله وِترٌ يحبّ الوتر، وقال: إنّه جميلٌ يحبّ الجمال»."], [145.0, "انتهى كلامُه رحمه الله."]], "tr": [[117.0, "İlim ehlinden bir topluluk —Allah onlara rahmet etsin— bu külliyeyi açıkça ifade etmiştir."], [122.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [126.1, "\"Allah Teâlâ, kendisinin vasıflandığı bazı şeyleri kullarında da sever."], [131.0, "Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [135.8, "'Şüphesiz Allah tektir (vitirdir), teki (vitri) sever.' Yine şöyle buyurmuştur:"], [145.0, "'O cemîldir (güzeldir), güzelliği sever.'\" —Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[147.0, "وقال الإمام ابن القيّم رحمه الله تعالى:"], [151.5, "«وهو سبحانه يحبّ موجَبَ أسمائه وصفاته؛ فهو عليمٌ يحبّ كلَّ عليم، جوادٌ يحبّ كلَّ جواد، وِترٌ يحبّ الوتر، جميلٌ يحبّ الجمال، عفوٌّ يحبّ العفوَ وأهلَه، حَيِيٌّ يحبّ الحياءَ وأهلَه، بَرٌّ يحبّ الأبرار، شكورٌ يحبّ الشاكرين، صبورٌ يحبّ الصابرين، حليمٌ يحبّ أهلَ الحِلم»."], [198.0, "انتهى كلامُه رحمه الله تعالى."]], "tr": [[147.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [148.3, "\"O, münezzehtir, isim ve sıfatlarının gerektirdiğini sever."], [150.2, "O alîmdir, her âlimi sever;"], [151.5, "cömerttir, her cömerdi sever; tektir, teki sever;"], [159.3, "güzeldir, güzelliği sever; affedicidir, affı ve af ehlini sever;"], [174.2, "hayâ sahibidir, hayâyı ve hayâ ehlini sever;"], [198.0, "iyilik sahibidir (berr), iyileri sever;"], [198.4, "şükrün karşılığını verendir (şekûr), şükredenleri sever;"], [198.8, "sabûrdur, sabredenleri sever; halîmdir, hilim ehlini sever.\" —Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[200.0, "وقال الشيخ عبد العزيز بن باز رحمه الله تعالى أيضًا:"], [206.0, "«وإنما المقصود الصفاتُ التي يحبّ الله من عباده أن يتّصفوا بمقتضاها، كالعلم والقوّة في الحقّ، والرحمة والحِلم والكرم والجود والعفو وأشباه ذلك. فهو سبحانه عليمٌ يحبّ العلماء، قويٌّ يحبّ المؤمنَ القويَّ أكثرَ من حبّه للمؤمن الضعيف، كريمٌ يحبّ الكرماء، رحيمٌ يحبّ الرحماء، عفوٌّ يحبّ العفو»."], [242.0, "انتهى كلامُه. وأظنّ الكلامَ في ذلك واضحًا إن شاء الله."]], "tr": [[200.0, "Şeyh Abdülazîz b. Bâz —Allah ona rahmet etsin— de şöyle demiştir:"], [203.6, "\"Kastedilen, Allah'ın kullarının muktezâlarıyla vasıflanmasını sevdiği sıfatlardır:"], [206.0, "İlim, hakta kuvvet, rahmet, hilim, kerem, cömertlik, af ve benzerleri gibi."], [218.7, "O, münezzehtir, alîmdir, âlimleri sever;"], [228.6, "kavîdir, güçlü mü'mini zayıf mü'minden daha çok sever;"], [242.0, "kerîmdir, kerem sahiplerini sever; rahîmdir, merhametlileri sever;"], [244.2, "affedicidir, affı sever.\" —Sözü burada bitti."], [245.0, "Zannederim bu konudaki söz inşallah açıktır."]]}, {"reader": false, "ar": [[246.0, "فإن قلت: وماذا تقصد بقولك:"], [248.5, "«ما لم تكن من خصائصه»؟"], [251.0, "أقول: أي أنّ الاتّصاف بموجَب أسماء الله عز وجل مقيّدٌ بشرطٍ مهمٍّ جدًّا،"], [257.0, "وهو أنّ بعض أسماء الله عز وجل تتضمّن حقيقةً لا يجوز اتّصافُ غير الله عز وجل بها."], [265.0, "فكلُّ اسمٍ يتضمّن خصيصةً من خصائص الله تبارك وتعالى فلا يجوز للعبد أن يتعرّض للاتّصاف بشيءٍ من ذلك أبدًا؛"], [279.0, "فإنها وإن كانت كمالًا في حقّه سبحانه وتعالى،"], [283.0, "ولكنها نقصٌ وذمٌّ ومحرّمٌ في حقّ المخلوق."], [288.0, "فمثلُ ذلك لا يجوز الاتّصافُ بموجَبه،"], [291.6, "اسمًا كان أو صفة."], [294.0, "فهذا شرطٌ مهمٌّ في هذه الكلّيّة،"], [299.0, "حتى لا يُشكِل عليك جُمَلٌ من الأسماء"]], "tr": [[246.0, "Eğer \"'Meğer ki Allah'a has özelliklerden olsun' sözünle neyi kastediyorsun?\" dersen, derim ki:"], [251.0, "Yani Allah Azze ve Celle'nin isimlerinin gerektirdiğiyle vasıflanmak çok önemli bir şartla kayıtlıdır:"], [257.0, "Allah Azze ve Celle'nin bazı isimleri, Allah Azze ve Celle'den başkasının vasıflanması caiz olmayan bir hakikati içerir."], [265.0, "Allah Tebâreke ve Teâlâ'nın has özelliklerinden birini içeren her isim (böyledir);"], [273.6, "kulun bundan bir şeyle vasıflanmaya kalkışması asla caiz değildir."], [279.0, "Çünkü bunlar, O münezzeh ve yüce olanın hakkında kemal olsa da mahlûkun hakkında noksanlık, kusur ve haramdır."], [288.0, "Bunun gibi bir şeyin —isim olsun sıfat olsun— gerektirdiğiyle vasıflanmak caiz değildir."], [294.0, "Bu, bu külliyede önemli bir şarttır;"], [299.6, "ta ki sana birtakım isimler"]]}]}, {"ts": "05:03", "title": "1. Külliye (devam): Allah'a has isimler; \"Allah'ın ahlâkıyla ahlâklanmak\" ifadesi", "paras": [{"reader": false, "ar": [[303.0, "والصفات التي قلنا بأنها تتضمّن حقيقةً لا يجوز اتّصافُ غير الله عز وجل بها مُشكِلة."], [310.0, "وذلك كاسمه «الله»، فإنه يتضمّن:"], [313.7, "ذو الألوهيّة، ومن المعلوم أنّ كلَّ من ادّعى الألوهيّة فإنه مشركٌ وكافر."], [321.0, "وكاسمه «الجبّار»، فلا يجوز أن يتّصف العبدُ بموجَبه،"], [329.0, "لأنّ العبد مأمورٌ أن لا يكون جبّارًا على عباد الله عز وجل في أرضه،"], [335.0, "وغير ذلك. ولذلك قال الإمام ابن القيّم رحمه الله تعالى:"], [341.6, "«وأمّا المخلوق فاتّصافُه بالجبّار ذمٌّ ونقص، كما قال تعالى: <span class=\"ayah\">﴿كَذَٰلِكَ يَطْبَعُ اللَّهُ عَلَىٰ كُلِّ قَلْبِ مُتَكَبِّرٍ جَبَّارٍ﴾<\/span> <span class=\"ref\">[غافر: ٣٥]<\/span>، وقال تعالى لرسوله صلى الله عليه وسلم: <span class=\"ayah\">﴿وَمَا أَنتَ عَلَيْهِم بِجَبَّارٍ﴾<\/span> <span class=\"ref\">[ق: ٤٥]<\/span>»."]], "tr": [[303.0, "ve —Allah Azze ve Celle'den başkasının vasıflanması caiz olmayan bir hakikati içerdiğini söylediğimiz— sıfatlar karışık gelmesin."], [308.5, "Bu, O'nun \"Allah\" ismi gibidir;"], [310.0, "bu isim \"ulûhiyyet sahibi\" anlamını içerir."], [313.7, "Bilindiği gibi ulûhiyyet iddia eden herkes müşrik ve kâfirdir."], [318.0, "\"Cebbâr\" ismi gibi; kulun bunun gerektirdiğiyle vasıflanması caiz değildir."], [321.0, "Çünkü kul, Allah Azze ve Celle'nin yeryüzünde O'nun kullarına karşı zorba (cebbâr) olmamakla emrolunmuştur;"], [330.7, "bunun dışındakiler de böyledir. Bu sebeple İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [336.3, "\"Mahlûka gelince, onun cebbâr ile vasıflanması kusur ve noksanlıktır."], [339.6, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [341.6, "<span class=\"ayah\">﴿Allah, kibirli ve zorba olan her kalbi işte böyle mühürler﴾<\/span> [Mü'min 35]."], [355.5, "Allah Teâlâ Resûlü sallallâhu aleyhi ve sellem'e de şöyle buyurmuştur:"], [360.0, "<span class=\"ayah\">﴿Sen onların üzerinde bir zorba değilsin﴾<\/span> [Kâf 45].\""]]}, {"reader": false, "ar": [[364.0, "وقد ذكرتُ لكم في كلّيّةٍ سابقة تلك الأسماءَ الخاصّةَ بالله عز وجل،"], [373.0, "لأنها تتضمّن خصيصةً لا يجوز اتّصافُ غير الله عز وجل بها، فلعلّكم تراجعونها."]], "tr": [[364.0, "Size daha önceki bir külliyede, Allah Azze ve Celle'ye has olan o isimleri zikretmiştim;"], [370.8, "çünkü onlar, Allah Azze ve Celle'den başkasının vasıflanması caiz olmayan bir özelliği içerir."], [376.3, "Belki onları tekrar gözden geçirirsiniz."]]}, {"reader": false, "ar": [[378.0, "فإن قلت: وماذا تقول في العبارة المشتهرة عند كثيرٍ من الصوفيّة:"], [388.0, "«فلنتخلّق بأخلاق الله»؟ وهذه عبارةٌ تمتلئ كتبُ الصوفيّة بها،"], [398.0, "حتى إنّ بعضهم عرّف التصوّفَ بذلك،"], [405.0, "كما وردت في عبارة أبي الحسين النوريّ لمّا قال:"], [410.4, "«التصوّف ليس بعلومٍ ولا رسوم، ولكنّه أخلاق، كما قال النبيّ صلى الله عليه وسلم: تخلّقوا بأخلاق الله»."], [420.0, "انتهى كلامُه. بل إنّ بعضهم لا يُدخل أحدًا في مسمّى الصوفيّ إلا إذا كان متخلّقًا بأخلاق الله عز وجل،"], [430.0, "كما قال أبو الحسين الشاذليّ <span class=\"q\">؟ 07:10<\/span>:"], [433.6, "«للصوفيّ أربعُ صفات»، ذكر منها التخلّقَ بأخلاق الله."], [439.0, "فهل يجوز هذا الإطلاق؟"]], "tr": [[378.0, "Eğer \"Sûfîlerin çoğu nezdinde meşhur olan 'Allah'ın ahlâkıyla ahlâklanalım' ifadesi hakkında ne dersin?\" dersen:"], [391.0, "Bu, sûfîlerin kitaplarının dolup taştığı bir ifadedir;"], [398.8, "hatta bazıları tasavvufu bununla tarif etmiştir."], [406.1, "Nitekim Ebü'l-Hüseyin en-Nûrî'nin ifadesinde şöyle geçer:"], [410.4, "\"Tasavvuf ne ilimlerdir ne de şekiller (merasimler);"], [414.0, "o ahlâktır. Nitekim Peygamber sallallâhu aleyhi ve sellem 'Allah'ın ahlâkıyla ahlâklanın' buyurmuştur.\" —Sözü burada bitti."], [420.0, "Hatta bazıları, Allah Azze ve Celle'nin ahlâkıyla ahlâklanmış olmadıkça hiç kimseyi \"sûfî\" adının kapsamına sokmaz."], [428.5, "Nitekim Ebü'l-Hüseyin eş-Şâzelî <span class=\"q\">؟<\/span> \"Sûfînin dört sıfatı vardır\" demiş ve bunlardan birinin Allah'ın ahlâkıyla ahlâklanmak olduğunu zikretmiştir."], [439.0, "Peki, bu ifadeyi kullanmak caiz midir?"]]}, {"reader": false, "ar": [[445.0, "الجواب: لا يجوز عند أهل السنّة والجماعة،"], [448.1, "لعدّة أمور: الأمر الأول:"], [450.1, "أنّ المتقرِّر في القواعد أنّ ما يُطلق على الله عز وجل اسمًا وصفةً مبنيٌّ على التوقيف؛"], [459.0, "فلا يجوز أن نسمّي الله عز وجل إلا بما سمّى به نفسَه في كتابه،"], [465.0, "أو سمّاه به نبيُّه صلى الله عليه وسلم في صحيح سنّته،"], [470.0, "وكذلك صفاته نقول فيها ما قلناه في أسمائه سواءً بسواء."], [475.0, "ولا نعلم دليلًا صحيحًا من كتاب الله عز وجل أو سنّة رسوله صلى الله عليه وسلم تدلّ على صحّة ذلك الإطلاق."], [485.0, "وحيث لم يدلّ دليلٌ على جواز إطلاق الأخلاق على صفات الله عز وجل فلا يجوز إطلاقُها."]], "tr": [[445.0, "Cevap: Ehl-i Sünnet ve'l-Cemaat nezdinde birkaç sebepten dolayı caiz değildir."], [449.0, "Birinci sebep: Kaidelerde yerleşik olan şudur:"], [451.7, "Allah Azze ve Celle'ye isim ve sıfat olarak nispet edilen şey tevkîfe (nassa) dayanır."], [459.0, "Allah Azze ve Celle'yi ancak Kitabı'nda kendisini isimlendirdiği veya Peygamberi sallallâhu aleyhi ve sellem'in sahih sünnetinde O'nu isimlendirdiği isimlerle isimlendirebiliriz."], [470.0, "Sıfatları hakkında da isimleri hakkında söylediğimizin aynısını söyleriz."], [475.0, "Allah Azze ve Celle'nin Kitabı'ndan veya Resûlü sallallâhu aleyhi ve sellem'in sünnetinden bu ifadenin doğruluğuna delalet eden sahih bir delil bilmiyoruz."], [485.0, "Allah Azze ve Celle'nin sıfatlarına \"ahlâk\" denmesinin caizliğine hiçbir delil delalet etmediğine göre, bu ifadeyi kullanmak caiz değildir."]]}, {"reader": false, "ar": [[493.0, "وأمّا ثانيًا: فلأنّ المتقرِّر في القواعد أنّ التعبير عن المعاني الشرعيّة بألفاظ النصوص أَولى."], [502.0, "والشريعةُ إنما سمّت هذا البابَ «بابَ الصفات»،"], [507.0, "ولم تُسمِّه «بابَ الأخلاق»،"], [510.0, "ولم تُسمِّه «بابَ الأخلاق»."], [514.0, "وبناءً على ذلك فلا يجوز أن نُطلق الأخلاقَ على صفات الله عز وجل،"], [522.0, "وإنما نسمّيه باسمه الذي ورد في السنّة الصحيحة،"], [527.5, "وهي صفاتُ الله تبارك وتعالى،"], [529.5, "وعليه إجماعُ أهل العلم."]], "tr": [[493.0, "İkinci sebep: Kaidelerde yerleşik olan şudur:"], [495.4, "Şer'î manaları nasların lafızlarıyla ifade etmek evlâdır."], [498.4, "Şeriat bu babı \"sıfatlar babı\" diye adlandırmıştır;"], [502.0, "onu \"ahlâk babı\" diye adlandırmamıştır, \"ahlâk babı\" diye adlandırmamıştır."], [506.3, "Buna binaen Allah Azze ve Celle'nin sıfatlarına \"ahlâk\" adını vermemiz caiz değildir."], [514.0, "Bilakis onu sahih sünnette varid olan adıyla adlandırırız;"], [520.8, "o da \"Allah Tebâreke ve Teâlâ'nın sıfatları\"dır."], [527.5, "İlim ehlinin icmâı da bunun üzerinedir."]]}, {"reader": false, "ar": [[531.0, "فإن قلت: وما قولك في العبارة التي يقولها الفلاسفةُ كثيرًا في كتبهم:"], [543.0, "«التشبّهُ بالإله على قدر الطاقة»،"], [548.0, "«التشبّهُ بالإله على قدر الطاقة»،"], [554.0, "كما يقوله إخوانُ الصفا في رسائلهم،"], [557.0, "وهم من الباطنيّة، ونقل مثلَ ذلك الفخرُ الرازيُّ في «المطالب العالية»،"], [562.0, "وردّ عليه أبو العبّاس ابن تيميّة رحمه الله تعالى ردًّا مفصّلًا في هذا الكتاب على كلّ جزئيّاته،"], [571.0, "ومن جزئيّاته التي ردّ عليها هذه العبارة؟"], [575.0, "فنقول فيها أيضًا: هذا من الأمور التي لا تجوز؛"], [580.0, "فلا يجوز أن يُقرَن الخالقُ مع المخلوق في لفظ التشبيه أو التمثيل أبدًا."], [585.0, "وإنما نقول كما قلناه في هذه الكلّيّة التي درج على قولها أهلُ السنّة والجماعة،"], [594.0, "وهي أنّنا نتّصف بالمقدور عليه من صفات الله عز وجل."]], "tr": [[531.0, "Eğer \"Filozofların kitaplarında çokça söyledikleri 'Güç yettiğince ilaha benzemek', 'Güç yettiğince ilaha benzemek' ifadesi hakkında ne dersin?\" dersen —ki bunu Bâtınîlerden olan İhvânü's-Safâ risalelerinde söyler;"], [543.0, "Fahreddin er-Râzî de \"el-Metâlibü'l-âliye\"de benzerini nakletmiştir;"], [551.2, "Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— bu kitaba bütün ayrıntılarıyla mufassal bir reddiye yazmıştır ve reddettiği ayrıntılardan biri de bu ifadedir—, onun hakkında da şöyle deriz:"], [576.7, "Bu caiz olmayan şeylerdendir. Yaratanı mahlûkla teşbih veya temsil lafzında asla bir araya getirmek caiz değildir."], [585.0, "Bilakis Ehl-i Sünnet ve'l-Cemaat'in söyleyegeldiği bu külliyede söylediğimiz gibi deriz:"], [593.4, "Allah Azze ve Celle'nin sıfatlarından gücümüzün yettiğiyle vasıflanırız."]]}]}, {"ts": "10:00", "title": "1. Külliye (devam): \"Ahlâk\"ı Allah'a izafe eden rivayetler", "paras": [{"reader": false, "ar": [[600.0, "فهاتان العبارتان قد نصّ كثيرٌ من أهل السنّة والجماعة على منعهما."], [606.0, "فإن قلت: أوَلم تُروَ بعضُ الأحاديث عن النبيّ صلى الله عليه وسلم في إضافة الأخلاق إلى الله؟"], [617.0, "فأقول: بلى، قد رُويت،"], [619.0, "ولكن كلُّ حديثٍ في إضافة الأخلاق ـ كلُّ حديثٍ في إضافة الأخلاق إلى الله عز وجل ـ فإنه حديثٌ باطلٌ لا أصل له،"], [630.0, "لم يُروَ في شيءٍ من كتب السنّة،"], [634.0, "كما حرّر ذلك الإمامُ ابن القيّم رحمه الله تعالى."]], "tr": [[600.0, "Bu iki ifadenin yasak olduğunu Ehl-i Sünnet ve'l-Cemaat'ten pek çoğu açıkça belirtmiştir."], [606.0, "Eğer \"Peygamber sallallâhu aleyhi ve sellem'den ahlâkın Allah'a izafe edildiği bazı hadisler rivayet edilmedi mi?\" dersen, derim ki:"], [617.0, "Evet, rivayet edildi. Fakat ahlâkın —ahlâkın Allah Azze ve Celle'ye— izafe edildiği her hadis, aslı olmayan bâtıl bir hadistir;"], [629.0, "sünnet kitaplarının hiçbirinde rivayet edilmemiştir."], [631.7, "Nitekim İmam İbnü'l-Kayyim —Allah ona rahmet etsin— bunu tahkik etmiştir."]]}, {"reader": false, "ar": [[638.0, "فمن ذلك ما يروونه عن النبيّ صلى الله عليه وسلم أنه قال:"], [645.1, "«تخلّقوا بأخلاق الله تعالى»،"], [647.5, "وهو حديثٌ باطلٌ لا أصل له في شيءٍ من كتب السنّة."], [654.0, "ومن ذلك أيضًا حديث:"], [656.7, "«السخاءُ خُلُقُ الله الأعظم»،"], [659.4, "وهو حديثٌ لا يصحّ بوجه."], [669.0, "ومن ذلك أيضًا: «إنّ لله تعالى مئةَ خُلُقٍ وسبعةَ عشرَ، من أتاه بخُلُقٍ منها دخل الجنّة»،"], [679.4, "وهو حديثٌ ضعيفٌ جدًّا أيضًا،"], [690.0, "بل حكم عليه جمعٌ من أهل العلم بأنه موضوع."], [696.3, "وحديث: «ألا وإنّ حُسنَ الخُلُق من أخلاق الله»،"], [702.0, "وهو حديثٌ باطلٌ موضوع."]], "tr": [[638.0, "Bunlardan biri, Peygamber sallallâhu aleyhi ve sellem'den \"Allah Teâlâ'nın ahlâkıyla ahlâklanın\" buyurduğunu rivayet ettikleri şeydir;"], [645.1, "bu, sünnet kitaplarının hiçbirinde aslı olmayan bâtıl bir hadistir."], [649.3, "Bunlardan biri de \"Cömertlik Allah'ın en büyük ahlâkıdır\" hadisidir;"], [654.0, "bu hadis hiçbir şekilde sahih değildir."], [656.7, "Bunlardan biri de \"Allah Teâlâ'nın yüz on yedi ahlâkı vardır;"], [670.9, "kim O'na bunlardan biriyle gelirse cennete girer\" rivayetidir."], [676.8, "Bu da çok zayıf bir hadistir;"], [680.7, "hatta ilim ehlinden bir topluluk onun mevzu (uydurma) olduğuna hükmetmiştir."], [696.3, "Bir de \"Dikkat edin, güzel ahlâk Allah'ın ahlâkındandır\" hadisi vardır;"], [701.3, "bu da bâtıl, mevzu bir hadistir."]]}, {"reader": false, "ar": [[709.0, "وبالجملة فإنه لم يثبت حديثٌ واحدٌ في إضافة الخُلُق إلى الله تبارك وتعالى،"], [717.0, "وكلُّ ما ورد في ذلك فهو باطلٌ منكرٌ لا أصل له. والله أعلم."]], "tr": [[709.0, "Özetle, ahlâkın Allah Tebâreke ve Teâlâ'ya izafe edilmesi hakkında tek bir hadis bile sabit olmamıştır;"], [716.4, "bu konuda varid olan her şey bâtıl, münker ve aslı olmayan şeylerdir. Allah en iyisini bilir."]]}]}, {"ts": "12:03", "title": "2. Külliye: Mahlûku, yalnız Allah'ın hak ettiği bir şeyde Yaratana ortak kılmayı vehmettiren her isim haramdır", "paras": [{"reader": false, "ar": [[724.6, "ومن الكلّيّات أيضًا: <b>كلُّ اسمٍ يُوهِم تشريكَ المخلوق بالخالق فيما لا يستحقّه إلا الله فمحرّم.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها ثالثةً كالعادة:"], [767.0, "<b>كلُّ اسمٍ يُوهِم تشريكَ المخلوق بالخالق فيما لا يستحقّه إلا الله فمحرّم.<\/b>"]], "tr": [[724.6, "Külliyelerden biri de şudur: 2."], [730.0, "külliye: Mahlûku, ancak Allah'ın hak ettiği bir şeyde Yaratana ortak kılmayı vehmettiren her isim haramdır. (Tekrar ediyor.) Her zamanki gibi üçüncü kez tekrar ediyorum:"], [767.0, "<b>2. külliye: Mahlûku, ancak Allah'ın hak ettiği bir şeyde Yaratana ortak kılmayı vehmettiren her isim haramdır.<\/b>"]]}, {"reader": false, "ar": [[774.0, "أقول وبالله التوفيق: أي أن يتضمّن ذلك الاسمُ حقيقةً لا يجوز نسبتُها إلا لله عز وجل."], [784.0, "ودليلُ هذه الكلّيّة ما في «الصحيحين» من حديث أبي هريرة رضي الله عنه قال:"], [791.6, "قال النبيّ صلى الله عليه وسلم:"], [795.5, "«إنّ أخنعَ اسمٍ عند الله رجلٌ تسمّى ملكَ الأملاك، لا مالكَ إلا الله»."], [808.0, "وفي روايةٍ: «أغيظُ رجلٍ على الله يوم القيامة وأخبثُه رجلٌ تسمّى ملكَ الأملاك» الحديث."], [821.0, "وعند الطبرانيّ: «اشتدّ غضبُ الله على من زعم أنه ملكُ الأملاك»."]], "tr": [[774.0, "Tevfik Allah'tandır, derim ki: Yani o isim, ancak Allah Azze ve Celle'ye nispet edilmesi caiz olan bir hakikati içerirse (haramdır)."], [784.0, "Bu külliyenin delili, \"Sahîhayn\"da Ebû Hüreyre'den —Allah ondan razı olsun— rivayet edilen hadistir."], [791.6, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [795.5, "\"Allah katında en alçak isim, 'meliklerin meliki' (melikü'l-emlâk) diye isimlenen adamdır."], [800.1, "Allah'tan başka mâlik yoktur.\" Bir rivayette de:"], [808.0, "\"Kıyamet günü Allah'ın en çok öfkelendiği ve en habis adam, 'meliklerin meliki' diye isimlenen adamdır\" (diye geçer) —hadisin devamıyla."], [821.0, "Taberânî'nin rivayetinde de: \"Kendisinin 'meliklerin meliki' olduğunu iddia edene Allah'ın gazabı şiddetlendi.\""]]}, {"reader": false, "ar": [[830.0, "فهذه الأحاديث تدلّ دلالةً صريحةً على أنّ مثل هذه الإطلاقات لا تجوز إلا على الله عز وجل."], [841.0, "فهذا الإطلاق الوارد في الحديث ـ وأعني به «ملكَ الأملاك» أو ما كان في معناه ـ فإنه من جملة الإطلاقات التي لا يجوز إطلاقُها على أحدٍ من المخلوقات،"], [855.1, "مهما عظمت منزلتُه ورتبتُه في المناصب الدينيّة أو الدنيويّة."], [862.0, "فالحديث صريحٌ في تحريم التسمّي بملك الأملاك."]], "tr": [[830.0, "Bu hadisler, bu tür ifadelerin ancak Allah Azze ve Celle için kullanılabileceğine açıkça delalet eder."], [841.0, "Hadiste geçen bu ifade —yani \"meliklerin meliki\" veya onun anlamındaki şey—, dinî veya dünyevî makamlardaki mertebesi ve derecesi ne kadar yüce olursa olsun, mahlûkattan hiç kimse için kullanılması caiz olmayan ifadeler cümlesindendir."], [859.3, "Hadis, \"meliklerin meliki\" diye isimlenmenin haram olduğunu açıkça ifade etmektedir."]]}, {"reader": false, "ar": [[867.0, "وهل يدخل في هذا قياسُ غيره عليه؟"], [872.0, "الجواب: نعم. ولذلك يُروى عن سفيان رضي الله تعالى عنه أنه قال:"], [880.6, "مثل «شاهان شاه»، وهو «ملك الأملاك» باللغة الفارسيّة."], [887.0, "أي: سواءٌ عبّرتَ بهذا الاسم الذي لا يجوز إطلاقُه إلا على الله عز وجل باللغة العربيّة أو بغير اللغة العربيّة،"], [898.0, "فإنه يبقى معناه محرّمًا إطلاقُه على هذا المخلوق،"]], "tr": [[867.0, "Peki, başkasının buna kıyas edilmesi bunun kapsamına girer mi?"], [872.0, "Cevap: Evet. Bu sebeple Süfyân'dan —Allah ondan razı olsun— şöyle dediği rivayet edilir:"], [880.6, "\"'Şâhân şâh' gibi.\" Bu, Farsça \"meliklerin meliki\"dir."], [887.0, "Yani ancak Allah Azze ve Celle için kullanılması caiz olan bu ismi ister Arapça ister Arapçadan başka bir dille ifade et, onun anlamı bu mahlûk için kullanılması haram olarak kalır;"]]}]}, {"ts": "15:04", "title": "2. Külliye (devam): \"Kâdı'l-kudât\" ve benzeri isimler; âlimlerin sözleri", "paras": [{"reader": false, "ar": [[904.0, "لِما يتضمّنه من الحقيقة التي لا يستحقّها إلا الله تبارك وتعالى،"], [913.0, "ولأنّ المتقرِّر في القواعد أنّ العبرة في الألفاظ بمقاصدها ومعانيها،"], [919.7, "لا بمجرّد ألفاظها ومبانيها."], [924.0, "وبناءً على ذلك قال الإمام ابن القيّم رحمه الله تعالى:"], [930.0, "«لمّا كان المُلك لله وحده، لا مَلِكَ على الحقيقة سواه، كان أخنعَ اسمٍ» ـ أخنع يعني أذلّ ـ «كان أخنعَ اسمٍ وأوضعَه عنده وأبغضَه له اسمُ \"شاهان شاه\"، أي: ملك الملوك وسلطان السلاطين؛ فإنّ ذلك ليس لأحدٍ غير الله تعالى، فتسميةُ غيره بهذا من أبطل الباطل، والله لا يحبّ الباطل»."]], "tr": [[904.0, "çünkü o, ancak Allah Tebâreke ve Teâlâ'nın hak ettiği bir hakikati içerir."], [910.9, "Bir de kaidelerde yerleşik olan şudur:"], [916.4, "Lafızlarda itibar, sadece lafızlarına ve kalıplarına değil, maksatlarına ve manalarınadır."], [924.0, "Buna binaen İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [930.0, "\"Mülk yalnız Allah'a ait olduğundan ve hakikatte O'ndan başka melik bulunmadığından, en alçak isim\" —\"ahna'\" en zelil demektir— \"O'nun katında en alçak, en aşağılık ve en sevimsiz isim 'şâhân şâh', yani 'meliklerin meliki' ve 'sultanların sultanı' oldu."], [953.0, "Çünkü bu, Allah Teâlâ'dan başka hiç kimseye ait değildir."], [958.0, "O'ndan başkasını bununla isimlendirmek bâtılın en bâtılıdır; Allah ise bâtılı sevmez.\""]]}, {"reader": false, "ar": [[965.0, "وقد ألحق أهلُ العلم بهذا الاسم جُمَلًا من الأسماء،"], [975.0, "كقاضي القضاة؛ لأنّ هذا الاسم لا يجوز ـ لأنّ هذا الوصف والإطلاق لا يجوز إلا على الله عز وجل."], [989.0, "فليس قاضي القضاة إلا من يقضي بالحقّ في كلّ قضائه ـ وهو خير ـ وذلك هو الله عز وجل،"], [998.6, "فإنه خيرُ الفاصلين، كما قال الله عز وجل:"], [1004.1, "<span class=\"ayah\">﴿وَاللَّهُ يَقْضِي بِالْحَقِّ﴾<\/span> <span class=\"ref\">[غافر: ٢٠]<\/span>، والذي إذا قضى رضي كلُّ القضاة بقضائه."]], "tr": [[965.0, "İlim ehli bu isme birtakım isimleri de katmıştır;"], [977.0, "\"kâdı'l-kudât\" (kadıların kadısı) gibi. Çünkü bu isim caiz değildir —çünkü bu vasıf ve ifade ancak Allah Azze ve Celle için caizdir."], [989.0, "Kadıların kadısı ancak bütün hükümlerinde hak ile hükmedendir —O hayırlıdır—;"], [994.8, "o da Allah Azze ve Celle'dir."], [999.4, "Çünkü O, hüküm verenlerin en hayırlısıdır."], [1004.1, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1005.4, "<span class=\"ayah\">﴿Allah hak ile hükmeder﴾<\/span> [Mü'min 20]."], [1007.5, "(Kadıların kadısı) o kimsedir ki hükmettiğinde bütün kadılar O'nun hükmüne razı olur."]]}, {"reader": false, "ar": [[1013.0, "قال الإمام ابن أبي جمرة رحمه الله تعالى:"], [1018.4, "«يلتحق بملك الأملاك قاضي القضاة، وإن كان قد اشتهر في بلاد المشرق من قديم الزمان إطلاقُ ذلك على كبير القضاة، وقد سلم أهلُ المغرب من هذا، فاسمُ كبير القضاة عندهم قاضي الجماعة». انتهى كلامُه."]], "tr": [[1013.0, "İmam İbn Ebî Cemre —Allah ona rahmet etsin— şöyle demiştir:"], [1018.4, "\"'Meliklerin meliki'ne 'kadıların kadısı' da katılır."], [1024.0, "Her ne kadar Doğu diyarlarında eski zamandan beri bunun baş kadı için kullanılması meşhur olmuşsa da Mağrib ehli bundan kurtulmuştur;"], [1036.4, "onların nezdinde baş kadının adı 'kâdi'l-cemâa'dır.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[1044.0, "فإن قلت: وما علّةُ هذا النهي؟"], [1046.0, "فأقول: لقد بيّن الإمام ابن سعديّ رحمه الله تعالى في بيان مقاصد التوحيد هذا المعنى في قوله:"], [1055.0, "«وكلُّ هذا حفظٌ للتوحيد ولأسماء الله وصفاته، ودفعٌ لوسائل الشرك، حتى في الألفاظ التي يُخشى أن يُتدرَّج منها إلى أن يُظَنّ مشاركةُ أحدٍ لله عز وجل في شيءٍ من خصائصه وحقوقه»."], [1078.0, "انتهى كلامُه رحمه الله."]], "tr": [[1044.0, "Eğer \"Bu yasağın illeti nedir?\" dersen, derim ki:"], [1046.0, "İmam İbn Sa'dî —Allah ona rahmet etsin— tevhidin maksatlarını açıklarken bu manayı şu sözüyle beyan etmiştir:"], [1055.0, "\"Bütün bunlar tevhidi, Allah'ın isim ve sıfatlarını korumak ve şirkin vasıtalarını engellemektir;"], [1065.0, "hatta kendilerinden, birinin Allah Azze ve Celle'ye has özelliklerinden ve haklarından bir şeyde ortak olduğunun zannedilmesine doğru adım adım gidilmesinden korkulan lafızlarda bile.\" —Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[1080.0, "قال الخطّابيّ رحمه الله تعالى:"], [1083.0, "«وأمّا أخنع فمعناها أوضعُ وأذلّ»."], [1091.0, "انتهى كلامُه. وقال الإمام ابن الملقِّن رحمه الله:"], [1096.0, "«وإنما كان ملكُ الأملاك أبغضَ إلى الله تعالى وأكرهَ إليه أن يُسمّى به مخلوقٌ لأنه صفةٌ لله، ولا تليق بمخلوقٍ صفاتُ الله ولا أسماؤه، ولا ينبغي أن يتسمّى أحدٌ بشيءٍ من ذلك؛ لأنّ العباد لا يوصفون إلا بالذلّ والخضوع والعبوديّة». انتهى كلامُه."]], "tr": [[1080.0, "El-Hattâbî —Allah ona rahmet etsin— şöyle demiştir:"], [1083.0, "\"'Ahna'' ise 'en aşağı ve en zelil' anlamındadır.\" —Sözü burada bitti."], [1091.0, "İmam İbnü'l-Mulakkın —Allah ona rahmet etsin— şöyle demiştir:"], [1093.0, "\"'Meliklerin meliki' isminin bir mahlûka verilmesinin Allah Teâlâ'ya en sevimsiz ve en hoş olmayan şey olmasının sebebi, bunun Allah'ın sıfatı olmasıdır."], [1096.0, "Allah'ın sıfatları ve isimleri hiçbir mahlûka yakışmaz;"], [1101.0, "hiç kimsenin bunlardan bir şeyle isimlenmesi uygun değildir."], [1108.9, "Çünkü kullar ancak zillet, boyun eğme ve kullukla vasıflanır.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[1122.0, "وقال في «كشّاف القناع»:"], [1124.7, "«ويحرم التسميةُ بملك الأملاك ونحوه ممّا يوازي أسماءَ الله، كسلطان السلاطين وشاهان شاه؛ لِما روى أحمد: اشتدّ غضبُ الله على رجلٍ تسمّى ملكَ الأملاك، لا مَلِكَ إلا الله»."], [1146.0, "وبناءً على ذلك فيدخل تحت هذا النهي قولُهم:"], [1151.6, "«ملك الملوك»، ويدخل فيها قولُهم:"], [1157.4, "«حاكم الحكّام»، ويدخل فيها قولُهم:"], [1162.4, "«أحكم الحكماء»، ويدخل فيها قولُهم:"], [1167.4, "«سيّد السادات»، ويدخل فيها قولُهم:"], [1173.4, "«عظيم العظماء»، ويدخل فيها قولُهم:"], [1180.4, "«أعلم العلماء»، ويدخل فيها غيرُ ذلك ممّا يوازيه في معناه،"], [1188.5, "لثبوت العلّة فيه. والمتقرِّر في القواعد أنّ الحكم يدور مع علّته وجودًا وعدمًا،"], [1197.0, "والمتقرِّر في القواعد أنه إذا اتّفقت العللُ اتّفقت الأحكام،"]], "tr": [[1122.0, "\"Keşşâfü'l-kınâ'\"da şöyle denmiştir: \"'Meliklerin meliki' ve Allah'ın isimlerine denk düşen benzeri isimlerle —'sultanların sultanı' ve 'şâhân şâh' gibi— isimlendirmek haramdır."], [1140.4, "Çünkü Ahmed'in rivayetine göre: 'Meliklerin meliki diye isimlenen adama Allah'ın gazabı şiddetlendi;"], [1146.0, "Allah'tan başka melik yoktur.'\" Buna binaen bu yasağın kapsamına \"meliklerin meliki\" sözleri girer;"], [1157.4, "\"hâkimlerin hâkimi\" sözleri girer; \"hikmet sahiplerinin en hikmetlisi\" sözleri girer;"], [1167.4, "\"efendilerin efendisi\" sözleri girer; \"büyüklerin büyüğü\" sözleri girer;"], [1173.4, "\"âlimlerin en âlimi\" sözleri girer;"], [1180.4, "illet onlarda da bulunduğu için anlamca buna denk olan başka şeyler de girer."], [1191.0, "Kaidelerde yerleşik olan şudur: Hüküm, varlık ve yokluk bakımından illetiyle birlikte döner."], [1196.4, "Yine kaidelerde yerleşik olan şudur:"], [1199.1, "İlletler aynı olunca hükümler de aynı olur;"]]}]}, {"ts": "20:06", "title": "2. Külliye (devam): Kayıtlı kullanım ve başkasının bu isimle çağırması", "paras": [{"reader": false, "ar": [[1206.0, "وإذا اختلفت العللُ اختلفت الأحكام."], [1209.0, "فإن قلت: وما الحكم لو أطلقناه مقيّدًا بزمانٍ أو مكانٍ أو طائفةٍ أو حال،"], [1224.0, "كقولنا: «قاضي قضاة الخَرْج»،"], [1226.7, "أو «قاضي قضاة القصيم»،"], [1229.4, "أو «أحكم الحكماء في البلد الفلانيّ»،"], [1240.0, "فأطلقناها مقيّدةً لا مطلقة؟"], [1242.6, "الجواب: متى ما قُيّدت جاز إطلاقُها،"], [1246.9, "والأَولى تركُه تواضعًا لله عز وجل،"], [1254.0, "وذُلًّا وخضوعًا له تبارك وتعالى."]], "tr": [[1206.0, "İlletler farklı olunca hükümler de farklı olur."], [1209.0, "Eğer \"Bunu bir zamanla, bir mekânla, bir toplulukla veya bir hâlle kayıtlı olarak kullansak —'Harc'ın kadılar kadısı', 'Kasîm'in kadılar kadısı' veya 'falan beldenin en hikmetlisi' demek gibi— ve mutlak değil kayıtlı olarak kullansak hüküm nedir?\" dersen, cevap şudur:"], [1242.6, "Kayıtlandığı zaman kullanılması caizdir; fakat Allah Azze ve Celle'ye tevazu, O Tebâreke ve Teâlâ'ya zillet ve boyun eğme olarak terk edilmesi evlâdır."]]}, {"reader": false, "ar": [[1258.0, "فإنّ هذه الأسماء لا تدخل في حيّز النهي المؤكَّد الذي يدخل في هذا الذمّ العظيم الوارد في هذه الأحاديث الصحيحة،"], [1268.0, "إلا إذا اكتسبت صفةَ العموم والإطلاق بالألف واللام المقتضية للاستغراق."], [1276.0, "فإنك إذا قلت: «قاضي القضاة»،"], [1279.0, "فإنّ «القضاة» دخلت عليها الألفُ واللامُ المقتضيةُ لكلّ قاضٍ،"], [1283.0, "وإذا قلت: «أعظم العظماء»،"], [1285.0, "فإنّ «العظماء» دخلت عليها الألفُ واللامُ المستغرِقةُ لكلّ عظيم."], [1291.0, "وهي بهذا الإطلاق والعموم من الإطلاقات التي لا يجوز نسبتُها لأحدٍ من المخلوقين أبدًا،"], [1302.0, "لأنّ المخلوق مهما عظُم فإنه لا يكون بهذه المنزلة والمرتبة والمثابة."]], "tr": [[1258.0, "Çünkü bu isimler, ancak istiğrak (bütün fertleri kapsama) gerektiren elif-lâm ile umum ve mutlaklık vasfı kazandıklarında, bu sahih hadislerde varid olan büyük kınamanın kapsamına giren te'kidli yasağın alanına girerler."], [1276.0, "\"Kâdı'l-kudât\" dediğinde, \"el-kudât\" kelimesine her kadıyı kapsamayı gerektiren elif-lâm girmiştir."], [1280.3, "\"A'zamü'l-uzamâ\" dediğinde, \"el-uzamâ\" kelimesine her büyüğü kapsayan elif-lâm girmiştir."], [1284.0, "Bu mutlaklık ve umum ile bunlar, mahlûklardan hiç kimseye asla nispet edilmesi caiz olmayan ifadelerdendir."], [1295.7, "Çünkü mahlûk ne kadar büyük olursa olsun, bu menzilede, bu mertebede ve bu konumda olamaz."]]}, {"reader": false, "ar": [[1309.0, "ولكن إذا قُيّدت وزال عمومُها وإطلاقُها فإنّ ذلك ـ لا ـ فإنّ ذلك يكسر تحريمَها في الأصحّ،"], [1318.0, "إلا أنّنا نبقى في مرتبة الأفضليّة،"], [1320.6, "وهي أنّ الأفضل أن لا تُطلق على غير الله عز وجل حتى وإن كانت مقيّدة."]], "tr": [[1309.0, "Fakat kayıtlandığında ve umumu ve mutlaklığı ortadan kalktığında, bu —hayır— bu, en sahih görüşe göre onun haramlığını kırar."], [1319.7, "Ancak efdaliyyet mertebesinde kalırız: Efdal olan, kayıtlı olsa bile Allah Azze ve Celle'den başkası için kullanılmamasıdır."]]}, {"reader": false, "ar": [[1327.0, "فإن قلت: وما الحكم فيما لو سمّاه غيرُه بذلك ولم يُطلقه هو على نفسه،"], [1337.7, "لأنّ الحديث قال فيه:"], [1341.9, "«رجلٌ تسمّى ملكَ الأملاك»؟"], [1346.0, "الجواب: إذا علم بأنّ أحدًا أطلقها عليه فلا يخلو من حالتين:"], [1353.0, "إمّا أن يرفضها، ويعلم الله عز وجل من قلبه كراهيةَ ذلك الإطلاق،"], [1359.0, "فحينئذٍ لا بأس عليه،"], [1361.2, "وإنما يبوء مُطلِقُها بهذا الإثم إن كان عالمًا بحقيقة التحريم بهذا الإطلاق."], [1368.0, "وأمّا إذا سمعها مطلقةً عليه فرضيها،"], [1371.8, "وفرح بها، وانشرح لها صدرُه،"], [1374.9, "واستأنس بها خاطرُه، واسترسل معها،"], [1378.1, "فإنه داخلٌ في ذلك الإثم،"], [1381.2, "لأنه مُقِرٌّ لمن أطلقها عليه،"], [1384.4, "والمُقِرُّ باطنًا للحرام مشاركٌ فيه. والله أعلم."]], "tr": [[1327.0, "Eğer \"Hadiste 'meliklerin meliki diye isimlenen adam' dendiğine göre, kendisi bunu kendisi için kullanmadığı hâlde başkası onu bu isimle isimlendirirse hüküm nedir?\" dersen, cevap şudur:"], [1341.9, "Birinin bunu kendisi için kullandığını öğrendiğinde iki hâlden biri söz konusudur:"], [1346.0, "Ya onu reddeder ve Allah Azze ve Celle onun kalbinde bu ifadeden hoşlanmadığını bilir;"], [1350.5, "bu durumda ona bir sakınca yoktur."], [1353.0, "Bu günahı, eğer bu ifadenin haramlığının hakikatini biliyorsa, onu kullanan yüklenir."], [1357.5, "Ya da bunun kendisi için kullanıldığını işitir, ona razı olur, onunla sevinir, göğsü ona açılır, gönlü onunla hoşnut olur ve onunla akıp gider;"], [1368.0, "bu durumda o günaha dahildir."], [1372.4, "Çünkü onu kendisi için kullanana onay vermiştir;"], [1378.7, "harama içten onay veren de ona ortaktır. Allah en iyisini bilir."]]}]}, {"ts": "23:14", "title": "3. Külliye: Allah'ın bütün isimleri ezelen ve ebeden zâtına mülâzımdır", "paras": [{"reader": false, "ar": [[1394.0, "ومن الكلّيّات أيضًا: <b>كلُّ أسماء الله فملازمةٌ لذاته أزلًا وأبدًا.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1394.0, "Külliyelerden biri de şudur: 3."], [1396.1, "külliye: Allah'ın bütün isimleri ezelen ve ebeden zâtına mülâzımdır (O'ndan ayrılmaz). (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1418.0, "أقول وبالله التوفيق: وهي قاعدةٌ واضحة،"], [1421.9, "وهي أنّ الله عز وجل قد تسمّى بهذه الأسماء <span class=\"q\">؟ 23:38<\/span> بلا أوّلٍ ولا آخر."], [1436.0, "فكما أنه الأوّل في ذاته وصفاته،"], [1440.1, "فكذلك هو الأوّل في أسمائه،"], [1444.0, "وكما أنه الآخر في ذاته وصفاته،"], [1448.1, "فكذلك هو الآخر في أسمائه."], [1452.0, "وكما قال الإمام الطحاويّ رحمه الله تعالى:"], [1457.0, "«ليس قبل الخلق استفاد اسم... ـ ليس بعد الخلق استفاد اسمَ \"الخالق\"، ولا بإحداث البريّة استفاد اسمَ \"الباري\"»."], [1465.0, "فهو الخالق ولا مخلوق،"], [1467.8, "وهو البارئ قبل أن يوجد من يبرؤه."]], "tr": [[1418.0, "Tevfik Allah'tandır, derim ki: Bu açık bir kaidedir:"], [1422.5, "Allah Azze ve Celle bu isimlerle <span class=\"q\">؟<\/span> evveli ve âhiri olmaksızın isimlenmiştir."], [1436.0, "Zâtında ve sıfatlarında Evvel olduğu gibi isimlerinde de Evvel'dir;"], [1440.8, "zâtında ve sıfatlarında Âhir olduğu gibi isimlerinde de Âhir'dir."], [1446.1, "Nitekim İmam Tahâvî —Allah ona rahmet etsin— şöyle demiştir:"], [1452.0, "\"Yaratmadan önce bir isim kazanmış..."], [1457.0, "—Yaratmadan sonra 'Hâlık' ismini kazanmış değildir;"], [1459.8, "yaratılmışları var etmekle de 'Bârî' ismini kazanmış değildir.\" O, hiçbir mahlûk yokken Hâlık'tır;"], [1465.0, "var edeceği kimse var olmadan önce de Bârî'dir."]]}, {"reader": false, "ar": [[1473.0, "وهذه قد شرحتُها مفصّلةً في «تسلسل الحوادث» في شرحنا على «العقيدة الطحاويّة»،"], [1480.0, "ولكنّ المقصود من النقل عن الإمام الطحاويّ شرحُ هذه القاعدة وإثباتُها،"], [1485.0, "أو إثباتُ سُنّيّتها وسلفيّتها عند أهل العلم رحمهم الله تعالى."], [1491.0, "فهو «الله» أزلًا وأبدًا،"], [1493.7, "و«الحيّ» أزلًا وأبدًا،"], [1496.6, "و«القيّوم» أزلًا وأبدًا،"], [1500.5, "و«القويّ» أزلًا وأبدًا،"], [1502.8, "و«الرحمن الرحيم» أزلًا وأبدًا،"], [1505.6, "و«السميع البصير» ـ أبدًا ـ أزلًا وأبدًا."], [1508.0, "«أزلًا» أي فيما لا أوّل له،"], [1511.8, "و«أبدًا» أي فيما لا نهاية له."], [1516.0, "والكلّيّة واضحة إن شاء الله، والله أعلم."]], "tr": [[1473.0, "Bunu \"Teselsülü'l-havâdis\" (hâdiselerin ezelî zinciri) meselesinde, \"el-Akîdetü't-Tahâviyye\" şerhimizde ayrıntılı olarak şerh etmiştim."], [1478.8, "Fakat İmam Tahâvî'den nakilden maksat, bu kaideyi açıklamak ve isbat etmek, ya da ilim ehli —Allah onlara rahmet etsin— nezdinde sünnete ve selefe uygun olduğunu isbat etmektir."], [1491.0, "O, ezelen ve ebeden \"Allah\"tır;"], [1494.2, "ezelen ve ebeden \"Hayy\"dır; ezelen ve ebeden \"Kayyûm\"dur;"], [1502.3, "ezelen ve ebeden \"Kavî\"dir; ezelen ve ebeden \"Rahmân\" ve \"Rahîm\"dir;"], [1508.0, "—ebeden— ezelen ve ebeden \"Semî'\" ve \"Basîr\"dir."], [1511.3, "\"Ezelen\", yani evveli olmayan zamanda;"], [1513.3, "\"ebeden\", yani sonu olmayan zamanda."], [1516.0, "Külliye inşallah açıktır. Allah en iyisini bilir."]]}]}, {"ts": "25:19", "title": "4. Külliye: Duada kendisiyle tevessül edilen her ismin, dua edenin talebine uygun olması müstehaptır", "paras": [{"reader": false, "ar": [[1519.0, "ومن الكلّيّات أيضًا: <b>كلُّ اسمٍ يُتوسَّل به في دعاءٍ فيُستحبّ مناسبتُه لمطلوب الداعي.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[1519.0, "Külliyelerden biri de şudur: 4."], [1522.0, "külliye: Duada kendisiyle tevessül edilen her ismin, dua edenin talebine uygun olması müstehaptır. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1546.0, "أقول وبالله التوفيق: وهذا واضحٌ أيضًا،"], [1549.0, "لقول الله عز وجل:"], [1551.2, "<span class=\"ayah\">﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٠]<\/span>،"], [1554.0, "وقول الله عز وجل:"], [1557.0, "<span class=\"ayah\">﴿فَلَهُ الْأَسْمَاءُ الْحُسْنَىٰ﴾<\/span>، <span class=\"ayah\">﴿أَيًّا مَّا تَدْعُوا فَلَهُ الْأَسْمَاءُ الْحُسْنَىٰ﴾<\/span> <span class=\"ref\">[الإسراء: ١١٠]<\/span>."], [1564.0, "وقد قرّرنا سابقًا بأنّ دعاء الله عز وجل بأسمائه معناه التوسّلُ إليه بها،"], [1571.0, "وأنّ التوسّل بأسماء الله عز وجل منقسمٌ إلى التوسّل العامّ،"], [1576.0, "وإلى التوسّل المعيَّن الخاصّ."], [1578.0, "وهذه الكلّيّة في النوع الثاني من أنواع التوسّل بأسماء الله عز وجل."]], "tr": [[1546.0, "Tevfik Allah'tandır, derim ki: Bu da açıktır;"], [1548.5, "Allah Azze ve Celle'nin şu sözünden dolayı:"], [1551.2, "<span class=\"ayah\">﴿En güzel isimler Allah'ındır; O'na onlarla dua edin﴾<\/span> [A'râf 180]."], [1554.0, "Ve Allah Azze ve Celle'nin şu sözünden dolayı:"], [1557.0, "<span class=\"ayah\">﴿En güzel isimler O'nundur﴾<\/span>, <span class=\"ayah\">﴿Hangisiyle dua ederseniz edin, en güzel isimler O'nundur﴾<\/span> [İsrâ 110]."], [1564.0, "Daha önce takrir ettik ki Allah Azze ve Celle'ye isimleriyle dua etmek, O'na bu isimlerle tevessül etmek demektir;"], [1571.5, "Allah Azze ve Celle'nin isimleriyle tevessül de genel tevessül ve belirli, özel tevessül diye ikiye ayrılır."], [1578.0, "Bu külliye, Allah Azze ve Celle'nin isimleriyle tevessül türlerinden ikinci tür hakkındadır."]]}, {"reader": false, "ar": [[1584.0, "فينبغي أن يتخيّر الإنسانُ في توسّله المعيَّن بالاسم المناسب لدعائه ومطلوبه من الله عز وجل،"], [1595.0, "فهذا من باب احترام أسماء الله عز وجل."], [1599.0, "فالمسلم إذا أراد أن يتوسّل إلى الله عز وجل بشيءٍ من أسمائه فيُستحبّ له أن يأتي بالاسم المناسب في المقام الذي يريده."], [1609.0, "فمثلًا: إذا أراد أن يطلب من الله الرحمةَ فلا يقل:"], [1613.9, "يا عزيز، يا قويّ،"], [1615.6, "يا منتقم، يا شديد العقاب،"], [1617.7, "اغفر لي وارحمني؛ فإنّ ذلك ممّا لا يليق بأسماء الله عز وجل،"], [1622.0, "بل هذا سوءُ أدبٍ مع الله عز وجل،"], [1626.0, "لأنّ هذا لا يناسب مطلوبَ الداعي أبدًا."]], "tr": [[1584.0, "İnsanın belirli tevessülünde, duasına ve Allah Azze ve Celle'den talebine uygun ismi seçmesi gerekir;"], [1593.3, "bu, Allah Azze ve Celle'nin isimlerine saygı kabilindendir."], [1599.0, "Müslüman, Allah Azze ve Celle'ye isimlerinden biriyle tevessül etmek istediğinde, istediği makama uygun ismi getirmesi müstehaptır."], [1605.5, "Meselâ Allah'tan rahmet istemek isterse \"Ey Azîz, ey Kavî, ey Müntakim (intikam alan), ey azabı şiddetli olan!"], [1613.9, "Beni bağışla ve bana merhamet et\" demesin."], [1619.0, "Çünkü bu, Allah Azze ve Celle'nin isimlerine yakışmayan şeylerdendir;"], [1621.7, "hatta bu, Allah Azze ve Celle'ye karşı edepsizliktir."], [1625.5, "Çünkü bu, dua edenin talebine asla uygun düşmez."]]}, {"reader": false, "ar": [[1632.0, "وكذلك إذا أراد العبدُ ـ أن ـ الرزقَ من الله فلا يقل:"], [1638.7, "يا مانع، يا ضارّ،"], [1641.3, "ارزقني، وإنما يقول: يا رازق،"], [1644.9, "أو يا رزّاق، ارزقني."], [1649.0, "وإن أراد النصرَ فيكون أنسبَ ما يقول:"], [1652.8, "«إنك نعم المولى ـ مثلًا ـ ونعم النصير»."], [1656.0, "وإذا أراد الموتَ فليقل كما قال الله عز وجل:"], [1659.9, "<span class=\"ayah\">﴿أَنتَ وَلِيِّي فِي الدُّنْيَا وَالْآخِرَةِ ۖ تَوَفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ﴾<\/span> <span class=\"ref\">[يوسف: ١٠١]<\/span>."]], "tr": [[1632.0, "Aynı şekilde kul Allah'tan rızık istemek isterse \"Ey Mâni' (engelleyen), ey Dârr (zarar veren), beni rızıklandır\" demesin;"], [1643.5, "bilakis \"Ey Râzık\" veya \"Ey Rezzâk, beni rızıklandır\" desin."], [1649.0, "Zafer (yardım) isterse söyleyeceğinin en uygunu meselâ \"Sen ne güzel mevlâ ve ne güzel yardımcısın\" olur."], [1656.0, "Ölüm isterse Allah Azze ve Celle'nin buyurduğu gibi desin:"], [1658.6, "<span class=\"ayah\">﴿Dünyada ve âhirette benim velîm sensin. Beni Müslüman olarak öldür ve beni sâlihlere kat﴾<\/span> [Yûsuf 101]."]]}, {"reader": false, "ar": [[1665.0, "ولذلك علّم النبيُّ صلى الله عليه وسلم أبا بكرٍ لمّا قال له:"], [1670.2, "يا رسول الله، علّمني دعاءً أدعو به في صلاتي،"], [1674.0, "قال له: «قل: اللهمّ إنّي ظلمتُ نفسي ظلمًا كثيرًا، ولا يغفر الذنوبَ إلا أنت، فاغفر لي مغفرةً من عندك وارحمني، إنّك أنت الغفور الرحيم»."], [1684.0, "فتوسّل إلى الله عز وجل بالأسماء المناسبة لمطلوبه."]], "tr": [[1665.0, "Bu sebeple Peygamber sallallâhu aleyhi ve sellem, Ebû Bekir kendisine \"Ey Allah'ın Resûlü, bana namazımda okuyacağım bir dua öğret\" dediğinde ona şunu öğretti:"], [1674.9, "\"De ki: Allah'ım! Ben nefsime çokça zulmettim."], [1678.0, "Günahları ancak sen bağışlarsın. Katından bir mağfiretle beni bağışla ve bana merhamet et."], [1684.0, "Şüphesiz sen Gafûr'sun, Rahîm'sin.\" Böylece talebine uygun isimlerle Allah Azze ve Celle'ye tevessül etti."]]}, {"reader": false, "ar": [[1689.0, "وفي «سنن أبي داود» بإسنادٍ صحيح من حديث واثلة بن الأسقع رضي الله تعالى عنه قال:"], [1695.4, "صلّينا على جنازةٍ مع النبيّ صلى الله عليه وسلم،"], [1699.0, "فكان من دعائه: «اللهمّ إنّ فلانَ بنَ فلانٍ في ذمّتك وحبلِ جوارك، فقِه فتنةَ القبر وعذابَ النار، إنك أنت أهلُ الوفاء والحقّ، واغفر له وارحمه، إنك أنت الغفور الرحيم»."], [1713.0, "والأدلّة على ذلك كثيرة."]], "tr": [[1689.0, "\"Sünen-i Ebî Dâvûd\"da sahih bir isnadla Vâsile b."], [1692.2, "el-Eska'dan —Allah ondan razı olsun— şöyle rivayet edilir:"], [1695.4, "\"Peygamber sallallâhu aleyhi ve sellem ile birlikte bir cenaze namazı kıldık."], [1698.6, "Onun duasından biri şuydu: 'Allah'ım!"], [1700.2, "Falan oğlu falan senin zimmetinde ve himayenin ipindedir."], [1704.0, "Onu kabir fitnesinden ve ateş azabından koru."], [1708.4, "Şüphesiz sen vefa ve hak ehlisin."], [1713.0, "Onu bağışla ve ona merhamet et;"], [1713.5, "şüphesiz sen Gafûr'sun, Rahîm'sin.'\" Bunun delilleri çoktur."]]}, {"reader": false, "ar": [[1715.0, "فإذا توسّلتَ بشيءٍ من أسماء الله عز وجل فمن باب الأدب مع الله في هذا الدعاء أن تتخيّر الاسمَ المناسبَ للمطلوب،"], [1726.0, "وهذا الاتّساق والمناسبة أدعى لإجابة سؤالك."], [1730.0, "فمن كان يشكو قلّةَ المال وضيقَ الحال ناسب أن يتوسّل باسم الله «الرزّاق» أو «الغنيّ»،"], [1739.6, "ومن أسرف ـ ومن أذنب وأسرف على نفسه بالذنوب والمعاصي كان الأجدى به أن يتوسّل بـ«الغفور، الرحيم، الرحمن، الودود، اللطيف، التوّاب، العفوّ»."]], "tr": [[1715.0, "Allah Azze ve Celle'nin isimlerinden biriyle tevessül ettiğinde, bu duada Allah'a karşı edep kabilinden olan, talebe uygun ismi seçmendir."], [1722.8, "Bu uyum ve münasebet, isteğinin kabul edilmesine daha çok vesiledir."], [1730.0, "Malının azlığından ve hâlinin darlığından şikâyet eden kimsenin, Allah'ın \"Rezzâk\" veya \"Ganî\" ismiyle tevessül etmesi uygun düşer."], [1739.3, "İsraf eden —günah işleyen ve günahlar ve isyanlarla nefsine karşı haddi aşan— kimsenin ise \"Gafûr, Rahîm, Rahmân, Vedûd, Latîf, Tevvâb, Afüvv\" isimleriyle tevessül etmesi daha faydalıdır."]]}, {"reader": false, "ar": [[1758.0, "بل إنّ هذه الكلّيّة لم يدلّ عليها دليلُ الشرع فقط،"], [1763.0, "بل يدلّ عليها أيضًا دليلُ العقل؛"], [1766.0, "فإنّ ذلك من مقتضى العقل،"], [1770.0, "لأنّ من يريد حاجةً ممّن هو فوقه فإنه يذكر له من الألفاظ التي تناسب مطلوبَه وحاجتَه."], [1783.0, "وكذلك ينبغي للمتوسّل إذا أراد شيئًا من الله عز وجل أن يتخيّر من أسمائه ما يكون مناسبًا لمطلوبه. والله أعلم."]], "tr": [[1758.0, "Hatta bu külliyeye sadece şer'î delil delalet etmez;"], [1762.5, "akıl delili de ona delalet eder."], [1766.0, "Çünkü bu, aklın gereğidir: Kendisinden üstün olan birinden bir ihtiyaç isteyen kimse, ona talebine ve ihtiyacına uygun lafızları söyler."], [1778.0, "Aynı şekilde tevessül eden de Allah Azze ve Celle'den bir şey istediğinde, O'nun isimlerinden talebine uygun olanı seçmelidir. Allah en iyisini bilir."]]}]}, {"ts": "29:53", "title": "5. Külliye: Allah'ı isim ve sıfatlarından birinden ta'til eden, O'nu rubûbiyyetinin, ulûhiyyetinin ve vâcip kemalinin gereklerinden birinden ta'til etmiştir", "paras": [{"reader": false, "ar": [[1793.0, "ومن الكلّيّات أيضًا: <b>كلُّ من عطّل الله عن شيءٍ من أسمائه فقد عطّل<\/b> ـ <b>كلُّ من عطّل الله عز وجل عن شيءٍ من أسمائه وصفاته فقد عطّله عن شيءٍ من مقتضيات كمالِ ربوبيّته وألوهيّته وكمالِه الواجب له.<\/b> أُعيدها مرّةً ثالثة:"], [1823.2, "<b>كلُّ من عطّل الله عن شيءٍ من أسمائه وصفاته فقد عطّله عن شيءٍ من مقتضيات ربوبيّته وألوهيّته وكمالِه الواجب له.<\/b>"]], "tr": [[1793.0, "Külliyelerden biri de şudur: 5."], [1797.0, "külliye: Allah'ı isimlerinden birinden ta'til eden kimse ta'til etmiştir<b> — <\/b>5."], [1799.7, "külliye: Allah Azze ve Celle'yi isim ve sıfatlarından birinden ta'til eden kimse, O'nu rubûbiyyetinin ve ulûhiyyetinin kemalinin ve kendisi için vâcip olan kemalinin gereklerinden birinden ta'til etmiştir. Üçüncü kez tekrar ediyorum:"], [1823.2, "<b>5. külliye: Allah'ı isim ve sıfatlarından birinden ta'til eden kimse, O'nu rubûbiyyetinin, ulûhiyyetinin ve kendisi için vâcip olan kemalinin gereklerinden birinden ta'til etmiştir.<\/b>"]]}, {"reader": false, "ar": [[1835.0, "أقول وبالله التوفيق: قولُه:"], [1838.0, "«وكمالِه الواجب له» أي الواجب له في صفاته وأفعاله،"], [1845.0, "كما وقع فيه فرعونُ لمّا قال:"], [1849.3, "<span class=\"ayah\">﴿وَمَا رَبُّ الْعَالَمِينَ﴾<\/span> <span class=\"ref\">[الشعراء: ٢٣]<\/span>، ووقع فيه المشركون لمّا قالوا:"], [1855.4, "<span class=\"ayah\">﴿وَإِذَا قِيلَ لَهُمُ اسْجُدُوا لِلرَّحْمَٰنِ قَالُوا وَمَا الرَّحْمَٰنُ أَنَسْجُدُ لِمَا تَأْمُرُنَا وَزَادَهُمْ نُفُورًا﴾<\/span> <span class=\"ref\">[الفرقان: ٦٠]<\/span>."]], "tr": [[1835.0, "Tevfik Allah'tandır, derim ki: \"Ve kendisi için vâcip olan kemali\" sözü, yani sıfatlarında ve fiillerinde kendisi için vâcip olan (kemal)."], [1844.5, "Nitekim Firavun <span class=\"ayah\">﴿Âlemlerin Rabbi de nedir?﴾<\/span> [Şuarâ 23] dediğinde buna düştü."], [1849.3, "Müşrikler de şöyle dediklerinde buna düştüler:"], [1852.7, "<span class=\"ayah\">﴿Onlara \"Rahmân'a secde edin\" dendiğinde, \"Rahmân da nedir? Bize emrettiğin şeye mi secde edeceğiz?\" derler ve bu onların nefretini artırır﴾<\/span> [Furkân 60]."]]}, {"reader": false, "ar": [[1867.0, "ولأنّ الله عز وجل إنما يُستدَلّ على استحقاقه للألوهيّة بطريقين:"], [1874.0, "بطريق استحقاقه لمقتضيات الربوبيّة،"], [1876.7, "وبطريق استحقاقه لكمال الأسماء والصفات."], [1880.0, "فكم استدلّ الله عز وجل بأسمائه وصفاته على ربوبيّته وعلى ألوهيّته!"], [1888.0, "فإذا عمدنا إلى تعطيل شيءٍ من هذه الأسماء والصفات فإنّنا ننخر في جسد الربوبيّة والألوهيّة والكمالات الواجبة له عز وجل."]], "tr": [[1867.0, "Bir de Allah Azze ve Celle'nin ulûhiyyeti hak ettiğine ancak iki yolla istidlal edilir:"], [1874.0, "Rubûbiyyetin gereklerini hak etmesi yoluyla ve isim ve sıfatların kemalini hak etmesi yoluyla."], [1880.0, "Allah Azze ve Celle isim ve sıfatlarıyla rubûbiyyetine ve ulûhiyyetine ne çok istidlal etmiştir!"], [1888.0, "Bu isim ve sıfatlardan birini ta'til etmeye kalkıştığımızda, rubûbiyyet ve ulûhiyyetin bünyesini ve O Azze ve Celle için vâcip olan kemalleri kemirmiş oluruz."]]}, {"reader": false, "ar": [[1899.0, "ولذلك قال الله عز وجل عن إبراهيم،"], [1902.7, "مستدلًّا على بطلان ما كان يعبده أبوه وقومه:"], [1907.0, "<span class=\"ayah\">﴿يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ﴾<\/span> <span class=\"ref\">[مريم: ٤٢]<\/span>؛"], [1909.0, "فإذا عطّلتَ اسمَ الله «السميع» فإنك تعطّل شيئًا من مقتضيات استحقاقه للألوهيّة والربوبيّة."], [1916.0, "ثم قال تعالى: <span class=\"ayah\">﴿وَلَا يُبْصِرُ﴾<\/span>؛"], [1918.3, "فإذا عطّلتَ اسمَ الله «البصير»،"], [1920.6, "وعطّلتَ صفةَ البصر، فإنك تعطّل الله عز وجل عن شيءٍ من مقتضيات ربوبيّته وألوهيّته وكماله الواجب."], [1931.0, "ثم قال الله عز وجل:"], [1932.8, "<span class=\"ayah\">﴿وَلَا يُغْنِي عَنكَ شَيْئًا﴾<\/span> <span class=\"ref\">[مريم: ٤٢]<\/span>؛"], [1934.3, "فإذا عطّلتَ اسمَ الله «القدير» فقد عطّلتَه عن كلّ مقدور،"], [1938.0, "فكيف يكون ربًّا وهو غيرُ قديرٍ ولا ذو قدرة؟!"]], "tr": [[1899.0, "Bu sebeple Allah Azze ve Celle, babasının ve kavminin ibadet ettiği şeylerin bâtıl olduğuna istidlal ederken İbrâhîm'in şöyle dediğini bildirmiştir:"], [1907.0, "<span class=\"ayah\">﴿Babacığım! İşitmeyen şeye niçin ibadet ediyorsun?﴾<\/span> [Meryem 42]."], [1909.0, "Allah'ın \"Semî'\" ismini ta'til edersen, O'nun ulûhiyyeti ve rubûbiyyeti hak etmesinin gereklerinden birini ta'til etmiş olursun."], [1916.0, "Sonra Allah Teâlâ <span class=\"ayah\">﴿ve görmeyen﴾<\/span> buyurdu."], [1918.3, "Allah'ın \"Basîr\" ismini ta'til edersen ve görme sıfatını ta'til edersen, Allah Azze ve Celle'yi rubûbiyyetinin, ulûhiyyetinin ve vâcip kemalinin gereklerinden birinden ta'til etmiş olursun."], [1931.0, "Sonra Allah Azze ve Celle <span class=\"ayah\">﴿ve sana hiçbir fayda sağlamayan﴾<\/span> [Meryem 42] buyurdu."], [1934.3, "Allah'ın \"Kadîr\" ismini ta'til edersen, O'nu her güç yetirilen şeyden ta'til etmiş olursun."], [1938.4, "Kadîr olmayan ve kudret sahibi olmayan nasıl Rab olabilir?!"]]}, {"reader": false, "ar": [[1942.0, "وإذا عطّلتَه عن اسم «الحيّ» فقد عطّلتَه عن حياته الواجبة له،"], [1947.0, "فكيف يعبد الناسُ ميّتًا لا حياة له؟!"], [1951.0, "فطريقُ هدم بنيان الربوبيّة والألوهيّة هو تعطيلُ الأسماء والصفات."], [1962.0, "ولذلك اشتدّ تغليظُ أهل السنّة والجماعة رحمهم الله تعالى على كلّ من سلك هذا الطريق."], [1969.0, "بل إنّ التعطيل بابٌ عظيمٌ من أبواب الشرك،"], [1975.0, "كما قاله العلماء رحمهم الله تعالى."]], "tr": [[1942.0, "O'nu \"Hayy\" isminden ta'til edersen, O'nu kendisi için vâcip olan hayatından ta'til etmiş olursun."], [1947.0, "İnsanlar hayatı olmayan bir ölüye nasıl ibadet eder?!"], [1951.0, "Rubûbiyyet ve ulûhiyyet binasını yıkmanın yolu, isim ve sıfatları ta'til etmektir."], [1962.0, "Bu sebeple Ehl-i Sünnet ve'l-Cemaat —Allah onlara rahmet etsin— bu yola giren herkese karşı çok sert davranmıştır."], [1969.0, "Hatta âlimlerin —Allah onlara rahmet etsin— dediği gibi ta'til, şirkin büyük kapılarından biridir."]]}, {"reader": false, "ar": [[1978.0, "بل إنّ ابن القيّم قال ـ بل إنّ ابن القيّم قال ـ:"], [1982.0, "«والتعطيل شرٌّ من الشرك» ـ أعوذ بالله ـ «والتعطيل شرٌّ من الشرك»."], [1989.0, "لماذا؟ لماذا يا ابن القيّم؟"], [1990.7, "لا، بس يجيب هو <span class=\"q\">؟ 33:09<\/span>؛"], [1992.0, "يقول: «فإنّ المعطِّل جاحدٌ للذات أو لكمالها، وهو جحدٌ لحقيقة الألوهيّة»."], [2000.0, "فإذا جاءك الجهميّ مثلًا وقال:"], [2003.4, "أنا أؤمن بأنّ الله لا..."], [2004.5, "ـ أنا أؤمن بربٍّ لا يوصف بصفةٍ ولا يسمّى باسم،"], [2012.0, "إذن هو يعبد عدمًا،"], [2013.8, "فهو جاحدٌ لذات الله عز وجل وكماله."]], "tr": [[1978.0, "Hatta İbnü'l-Kayyim —hatta İbnü'l-Kayyim— şöyle demiştir:"], [1982.0, "\"Ta'til şirkten daha kötüdür\" —Allah'a sığınırım— \"ta'til şirkten daha kötüdür.\" Neden?"], [1989.0, "Neden, ey İbnü'l-Kayyim? Hayır, bunu kendisi cevaplasın <span class=\"q\">؟<\/span>."], [1992.0, "Şöyle diyor: \"Çünkü muattıl, zâtı veya onun kemalini inkâr edendir;"], [1998.0, "bu ise ulûhiyyetin hakikatini inkârdır.\" Meselâ Cehmî sana gelip \"Ben Allah'ın ..."], [2003.4, "olmadığına inanıyorum —ben hiçbir sıfatla vasıflanmayan ve hiçbir isimle isimlenmeyen bir Rabbe inanıyorum\" derse, demek ki o yokluğa ibadet ediyor;"], [2012.9, "o, Allah Azze ve Celle'nin zâtını ve kemalini inkâr edendir."]]}, {"reader": false, "ar": [[2017.0, "ثم قال ابن القيّم:"], [2019.8, "«والمشرك مُقِرٌّ بالله، لكن عبد معه غيرَه» ـ انتبهوا معي يا إخوان في هذا،"], [2027.4, "ولّا لا؟ ـ «والمشرك مُقِرٌّ بالله، ولكنه عبد معه غيرَه، فهو خيرٌ من المعطِّل للذات والصفات». انتهى كلامُه."]], "tr": [[2017.0, "Sonra İbnü'l-Kayyim şöyle dedi: \"Müşrik ise Allah'ı ikrar eder, fakat O'nunla birlikte başkasına ibadet eder.\" —Bu konuda benimle beraber dikkat edin kardeşler, (anlaşıldı) mı, değil mi?— \"Müşrik Allah'ı ikrar eder, fakat O'nunla birlikte başkasına ibadet eder;"], [2028.0, "dolayısıyla zâtı ve sıfatları ta'til edenden daha hayırlıdır.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[2040.0, "والمنصوص عند أهل السنّة والجماعة أنّ الشرك والتعطيل متلازمان؛"], [2047.0, "فلم يقع المشركُ في شركه إلا بعد أن عطّل،"], [2052.0, "ولم يقع المعطِّلُ في تعطيله إلا ولا بدّ أن يقع في الشرك."], [2058.0, "فكلُّ مشركٍ فإنه معطِّل،"], [2064.0, "وكلُّ معطِّلٍ فإنه مشرك،"], [2068.0, "كما سيأتينا كلّيّاتُها في باب الصفات إن شاء الله تعالى."]], "tr": [[2040.0, "Ehl-i Sünnet ve'l-Cemaat nezdinde açıkça ifade edilen şudur:"], [2047.0, "Şirk ve ta'til birbirini gerektirir."], [2049.8, "Müşrik ancak ta'til ettikten sonra şirkine düşmüştür;"], [2053.5, "muattıl da ta'tiline düştüğünde mutlaka şirke de düşer."], [2058.0, "Her müşrik muattıldır, her muattıl da müşriktir;"], [2068.4, "inşallah bunun külliyeleri sıfatlar babında gelecek."]]}, {"reader": false, "ar": [[2072.0, "ولذلك فمن أقرّ بذات الله عز وجل وصفاته،"], [2081.0, "ولكن عبد معه غيرَه،"], [2083.0, "هذا خيرٌ ممّن يقول بأنه ليس فوق السماء ربٌّ يُعبد،"], [2088.0, "ولا فوق العرش إلهٌ يُصلّى له ويُسجد،"], [2092.0, "وخيرٌ ممّن يقول بأنّ الله لا داخلَ العالم ولا خارجَه،"], [2097.0, "ولا فوقَ ولا تحتَ،"], [2100.0, "ولا يمينَ ولا شمالَ،"], [2102.0, "ولا أمامَ ولا خلفَ،"], [2104.0, "ولا يُرى ولا يتكلّم ولا يُبصر،"], [2107.0, "وغير ذلك من أنواع التعطيل التي تُدخل اللهَ في حيّز المعدوم."]], "tr": [[2072.0, "Bu sebeple Allah Azze ve Celle'nin zâtını ve sıfatlarını ikrar edip de O'nunla birlikte başkasına ibadet eden kimse, göğün üstünde ibadet edilen bir Rab, arşın üstünde kendisine namaz kılınan ve secde edilen bir ilah olmadığını söyleyenden daha hayırlıdır."], [2094.7, "Allah'ın âlemin ne içinde ne dışında, ne üstünde ne altında, ne sağında ne solunda, ne önünde ne arkasında olduğunu, görülmediğini, konuşmadığını ve görmediğini söyleyenden ve Allah'ı yok olanın alanına sokan diğer ta'til türlerini söyleyenden de daha hayırlıdır."]]}]}, {"ts": "35:13", "title": "5. Külliye (devam): Ta'tilin üç kısmı; İbn Teymiyye'nin sözü", "paras": [{"reader": false, "ar": [[2113.0, "ولذلك المنصوصُ عن أهل العلم بأنّ المعطِّل يعبد عدمًا."], [2120.0, "وقد بيّن الإمام ابن القيّم رحمه الله تعالى أنّ التعطيل ثلاثةُ أقسام:"], [2127.0, "تعطيلُ المصنوع عن صانعه وخالقه،"], [2136.0, "كتعطيل الملاحدة هذا العالمَ عن أن يكون مخلوقًا لله عز وجل،"], [2143.0, "فيقولون: إنّ هذا الكون أوجد نفسَه بنفسه،"], [2147.9, "أو وُجد صدفةً، ليس وراء هذا العالم ربٌّ يدبّره،"], [2153.2, "ولا يخلقه، ولا يتصرّف فيه،"], [2155.9, "ولا يقدّر فيه شيئًا."], [2158.0, "فهذا من أشرّ أنواع التعطيل،"], [2160.5, "وهو تعطيلُ المصنوع عن صانعه."]], "tr": [[2113.0, "Bu sebeple ilim ehlinden açıkça nakledilen şudur:"], [2120.0, "Muattıl yokluğa ibadet eder. İmam İbnü'l-Kayyim —Allah ona rahmet etsin— ta'tilin üç kısım olduğunu açıklamıştır:"], [2127.0, "(Birincisi) yapılmış olanı yapanından ve yaratanından ta'til etmektir."], [2136.6, "Mülhidlerin bu âlemi Allah Azze ve Celle'nin yarattığı bir şey olmaktan ta'til etmeleri gibi."], [2143.7, "Şöyle derler: \"Bu kâinat kendi kendini var etti\" veya \"tesadüfen var oldu;"], [2149.3, "bu âlemin ardında onu idare eden, yaratan, onda tasarruf eden ve onda bir şey takdir eden bir Rab yoktur.\" Bu, ta'til türlerinin en kötülerindendir;"], [2158.0, "yapılmış olanı yapanından ta'til etmektir."]]}, {"reader": false, "ar": [[2163.0, "الثاني ـ وهو الذي يخصّنا ـ:"], [2165.8, "تعطيلُ الصانع سبحانه عن كماله المقدّس."], [2177.0, "وهذا يكون بأيّ شيء؟"], [2179.9, "بتعطيل أسمائه وصفاته وأفعاله."], [2184.0, "فكلُّ من عطّل شيئًا من أسماء الله أو صفات الله فإنه لا بدّ أن يكون معطِّلًا لله عز وجل عن ربوبيّته الواجبة له،"], [2195.0, "أو عن ألوهيّته الواجبة له،"], [2198.0, "أو عن كماله المقدّس الواجب له."]], "tr": [[2163.0, "İkincisi —bizi ilgilendiren budur—: Yapan (Sâni'), münezzeh olanı mukaddes kemalinden ta'til etmektir."], [2177.0, "Bu ne ile olur? İsimlerini, sıfatlarını ve fiillerini ta'til etmekle."], [2184.0, "Allah'ın isimlerinden veya Allah'ın sıfatlarından birini ta'til eden herkes, mutlaka Allah Azze ve Celle'yi kendisi için vâcip olan rubûbiyyetinden veya kendisi için vâcip olan ulûhiyyetinden ya da kendisi için vâcip olan mukaddes kemalinden ta'til etmiş olur."]]}, {"reader": false, "ar": [[2201.0, "التعطيل الثالث: وهو تعطيلُ المشركين."], [2206.0, "إذن التعطيل الأوّل: تعطيلُ الملاحدة،"], [2211.0, "التعطيل الثاني: تعطيلُ المعطِّلة،"], [2214.0, "التعطيل الثالث: تعطيلُ المشركين،"], [2218.0, "وهو تعطيلُ معاملته عمّا يجب على العبد من حقيقة توحيده."], [2225.0, "فالذي يعبد الأشجارَ والأصنام هذا معطِّلٌ لحقيقة العبوديّة،"], [2230.0, "يعني معطِّلٌ لكلمة التوحيد «لا إله إلا الله»،"], [2236.0, "فهو معطِّلٌ لألوهيّة الله."]], "tr": [[2201.0, "Üçüncü ta'til: Müşriklerin ta'tilidir. Demek ki birinci ta'til mülhidlerin ta'tili, ikinci ta'til Muattıla'nın ta'tili, üçüncü ta'til müşriklerin ta'tilidir."], [2212.5, "Bu da O'nunla muameleyi, kulun üzerine vâcip olan O'nun tevhidinin hakikatinden ta'til etmektir."], [2225.0, "Ağaçlara ve putlara ibadet eden kimse kulluğun hakikatini ta'til etmiştir;"], [2230.0, "yani tevhid kelimesi \"Lâ ilâhe illallah\"ı ta'til etmiştir;"], [2235.1, "o, Allah'ın ulûhiyyetini ta'til edendir."]]}, {"reader": false, "ar": [[2238.0, "قال العلماء رحمهم الله:"], [2244.0, "«ومن هذا شركُ طائفة أهل وحدة الوجود، الذين يقولون: ما ثَمَّ خالقٌ ومخلوق، ومنه شركُ الملاحدة القائلين بقِدَم العالم وأبديّته»."], [2256.0, "انتهى كلامُهم. ومن هذا يُعلم أنّ باب هدم الربوبيّة والألوهيّة والكمال المقدّس لله عز وجل طريقُه أن تَهدم أسماءَ الله وصفاته."], [2272.0, "وقد قدر الشيطان على سلوك هذا الطريق بكثيرٍ من عباد الله،"], [2276.0, "فأوقعهم في تعطيل الله عز وجل عن كثيرٍ من أسمائه وصفاته،"], [2284.0, "لعلم الخبيث بأنه من وقع في ذلك فإنه سيقع في هدم الربوبيّة والألوهيّة."]], "tr": [[2238.0, "Âlimler —Allah onlara rahmet etsin— şöyle demiştir:"], [2239.7, "\"Vahdet-i vücûd ehli taifesinin şirki bundandır;"], [2244.0, "onlar 'Ortada yaratan ve yaratılan (diye iki şey) yoktur' derler."], [2247.5, "Âlemin kadîm ve ebedî olduğunu söyleyen mülhidlerin şirki de bundandır.\" —Sözleri burada bitti."], [2256.0, "Buradan anlaşılır ki rubûbiyyeti, ulûhiyyeti ve Allah Azze ve Celle'nin mukaddes kemalini yıkma kapısının yolu, Allah'ın isimlerini ve sıfatlarını yıkmaktır."], [2272.0, "Şeytan, Allah'ın kullarından pek çoğunu bu yola sokmayı başarmış ve onları Allah Azze ve Celle'yi isim ve sıfatlarının çoğundan ta'til etmeye düşürmüştür."], [2284.0, "Çünkü o habis, buna düşenin rubûbiyyeti ve ulûhiyyeti yıkmaya da düşeceğini bilir."]]}, {"reader": false, "ar": [[2291.0, "قال شيخ الإسلام ابن تيميّة رحمه الله تعالى:"], [2296.0, "«التعطيلُ المحضُ للذات قليل» ـ يعني ما في أحد عطّل اللهَ عن ذاته،"], [2303.5, "والمعطِّلون لذات الله عز وجل قليل ـ «وأمّا الكثير فهو تعطيلُ صفات الكمال» ـ انتبه ـ «وهو مستلزمٌ لتعطيل الذات»."], [2323.0, "يعني بدلَ أن يأتيهم الشيطانُ من الباب الواضح جاءهم من باب التحايل والتدليس والزخارف؛"], [2333.0, "فبدلَ أن يعمِد إلى أن يقولوا:"], [2336.2, "أنكروا ذاتَ الله عز وجل وكفروا بوجوده،"], [2340.0, "سعى بهم لتعطيل الأسماء والصفات،"], [2342.7, "لعلمه بأنّ من عطّل الذاتَ عن أسمائها وصفاتها فقد عطّلها عن وجودها وذاتيّتها."]], "tr": [[2291.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2296.0, "\"Zâtın katıksız ta'tili azdır\" —yani Allah'ı zâtından ta'til eden pek kimse yoktur;"], [2302.9, "Allah Azze ve Celle'nin zâtını ta'til edenler azdır— \"çok olan ise kemal sıfatlarının ta'tilidir\" —dikkat et— \"ki bu, zâtın ta'tilini gerektirir.\" Yani şeytan onlara açık kapıdan gelmek yerine hile, aldatma ve süslemeler kapısından geldi."], [2333.0, "Onları \"Allah Azze ve Celle'nin zâtını inkâr edin ve O'nun varlığını küfredin\" dedirtmeye yönelmek yerine, onları isim ve sıfatları ta'til etmeye sevk etti."], [2342.7, "Çünkü zâtı isimlerinden ve sıfatlarından ta'til edenin, onu varlığından ve zâtiyyetinden de ta'til etmiş olacağını biliyordu."]]}, {"reader": false, "ar": [[2352.0, "أُعيد نقلَ شيخ الإسلام ابن تيميّة رحمه الله من غير تقطيع؛"], [2358.0, "قال: «التعطيلُ المحضُ للذات قليل، وأمّا الكثير فهو تعطيلُ صفات الكمال، وهو مستلزمٌ لتعطيل الذات؛ فإنهم يصفون واجبَ الوجود بما يوجب أن يكون ممتنعَ الوجود»."], [2376.0, "انتهى كلامُه رحمه الله."], [2379.0, "فهمتم هذا؟ ماشي؟ الكلّيّة واضحة؟"]], "tr": [[2352.0, "Şeyhülislâm İbn Teymiyye'nin —Allah ona rahmet etsin— naklini bölmeden tekrar ediyorum."], [2355.8, "Şöyle demiştir: \"Zâtın katıksız ta'tili azdır."], [2358.0, "Çok olan ise kemal sıfatlarının ta'tilidir ki bu, zâtın ta'tilini gerektirir."], [2366.1, "Çünkü onlar vâcibü'l-vücûdu (varlığı zorunlu olanı), varlığının imkânsız olmasını gerektiren şeylerle vasıflandırırlar.\" —Sözü burada bitti, Allah ona rahmet etsin."], [2376.0, "Bunu anladınız mı? Tamam mı? Külliye açık mı?"]]}]}, {"ts": "39:43", "title": "6. Külliye: Halkın düştüğü bütün muhalefetler, kalplerinin Allah'ın isim ve sıfatlarının gereklerinden gafletinden dolayıdır", "paras": [{"reader": false, "ar": [[2383.0, "ومن الكلّيّات أيضًا: <b>كلُّ المخالفات التي يقع فيها الخلقُ فلغفلة قلوبهم عن مقتضيات أسماء الله وصفاته.<\/b> كلُّ المخالفات ـ أي الشرعيّة طبعًا ـ التي يقع فيها الخلق فلغفلة قلوبهم عن مقتضيات أسماء الله وصفاته. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2383.0, "Külliyelerden biri de şudur: 6."], [2385.2, "külliye: Halkın düştüğü bütün muhalefetler, kalplerinin Allah'ın isim ve sıfatlarının gereklerinden gafletinden dolayıdır. Halkın düştüğü bütün muhalefetler —tabii ki şer'î olanlar— kalplerinin Allah'ın isim ve sıfatlarının gereklerinden gafletinden dolayıdır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2411.0, "أقول وبالله التوفيق: وباختصار أن نقول:"], [2414.7, "سببُه الغفلةُ عن ذكر الله عز وجل،"], [2419.0, "وإنما يُذكر الله بماذا؟"], [2421.7, "بمقتضى أسمائه الحسنى وصفاته العُلا."], [2425.0, "ولذلك نهى الله عز وجل نبيَّه صلى الله عليه وسلم عن الغفلة عن ذكره،"], [2431.0, "فقال تعالى: <span class=\"ayah\">﴿وَاذْكُر رَّبَّكَ فِي نَفْسِكَ تَضَرُّعًا وَخِيفَةً وَدُونَ الْجَهْرِ مِنَ الْقَوْلِ بِالْغُدُوِّ وَالْآصَالِ وَلَا تَكُن مِّنَ الْغَافِلِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٠٥]<\/span>."], [2441.0, "فمتى ما غفلت القلوبُ عن الله وعن مقتضيات أسمائه وصفاته فناهيك عمّا ستقع فيه من الشبهات والشهوات <span class=\"q\">؟ 40:45<\/span>!"]], "tr": [[2411.0, "Tevfik Allah'tandır, derim ki: Kısaca şöyle deriz:"], [2414.7, "Bunun sebebi Allah Azze ve Celle'yi zikirden gaflettir."], [2418.4, "Allah ne ile zikredilir? En güzel isimlerinin ve yüce sıfatlarının gereğiyle."], [2425.0, "Bu sebeple Allah Azze ve Celle Peygamberi sallallâhu aleyhi ve sellem'i kendisini zikretmekten gafil olmaktan nehyetti."], [2430.6, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Rabbini, içinden, yalvararak ve korkarak, yüksek olmayan bir sesle, sabah akşam an ve gafillerden olma﴾<\/span> [A'râf 205]."], [2441.0, "Kalpler Allah'tan ve O'nun isim ve sıfatlarının gereklerinden gafil olduğunda, düşeceği şüpheleri ve şehvetleri <span class=\"q\">؟<\/span> artık sen düşün!"]]}, {"reader": false, "ar": [[2447.0, "وقال تعالى: <span class=\"ayah\">﴿وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَاةِ وَالْعَشِيِّ يُرِيدُونَ وَجْهَهُ ۖ وَلَا تَعْدُ عَيْنَاكَ عَنْهُمْ تُرِيدُ زِينَةَ الْحَيَاةِ الدُّنْيَا ۖ وَلَا تُطِعْ مَنْ أَغْفَلْنَا قَلْبَهُ عَن ذِكْرِنَا﴾<\/span>،"], [2463.1, "فأوصلته ـ تلك الغفلةُ أوصلته ـ إلى ماذا؟"], [2467.1, "قال: <span class=\"ayah\">﴿وَاتَّبَعَ هَوَاهُ وَكَانَ أَمْرُهُ فُرُطًا﴾<\/span> <span class=\"ref\">[الكهف: ٢٨]<\/span>."]], "tr": [[2447.0, "Allah Teâlâ şöyle de buyurdu:"], [2449.0, "<span class=\"ayah\">﴿Sabah akşam Rablerinin rızasını isteyerek O'na dua edenlerle birlikte nefsini sabırla tut. Dünya hayatının süsünü isteyerek gözlerin onlardan başkasına kaymasın. Kalbini bizi anmaktan gafil kıldığımız kimseye itaat etme﴾<\/span>."], [2461.9, "O gaflet onu neye ulaştırdı —o gaflet onu neye ulaştırdı?"], [2467.1, "Buyurdu ki: <span class=\"ayah\">﴿Ve hevâsına uymuş, işi de hep aşırılık olmuştur﴾<\/span> [Kehf 28]."]]}, {"reader": false, "ar": [[2476.0, "ولذلك فإنّ أثر المعرفة في تحقيق العبوديّة يكون على حسب قوّة المعرفة وضعفها في أسماء الله عز وجل وصفاته."], [2487.0, "فكلّما كانت المعرفةُ بالله وأسمائه وصفاته قويّةً ومفصّلةً ومستحضَرةً في العقل والقلب دائمًا،"], [2495.0, "كانت العبوديّةُ بها أتمَّ،"], [2497.5, "والعبدُ عن الآثام أبعدَ."], [2500.0, "وكلّما كانت ناقصةً وضعيفةً أو اعترتها غفلةٌ،"], [2507.0, "كان صاحبُها أبعدَ عن سمة العبوديّة،"], [2510.0, "وأقربَ من الذنوب والمعاصي."]], "tr": [[2476.0, "Bu sebeple marifetin kulluğu gerçekleştirmedeki etkisi, Allah Azze ve Celle'nin isim ve sıfatlarına dair marifetin kuvvetine ve zayıflığına göredir."], [2485.2, "Allah'a, O'nun isim ve sıfatlarına dair marifet kuvvetli, ayrıntılı ve akılda ve kalpte daima hazır oldukça, onunla kulluk daha tam, kul da günahlardan daha uzak olur."], [2500.0, "Eksik ve zayıf oldukça veya ona gaflet arız oldukça, sahibi kulluk vasfından daha uzak, günahlara ve isyanlara daha yakın olur."]]}, {"reader": false, "ar": [[2512.0, "ولذلك فإنّ ذنوب السرّ مرجعُها إلى غفلة القلوب والعقول عن اسم الله «الرقيب»،"], [2518.5, "أو «السميع» أو «البصير»،"], [2519.5, "أو «الخبير» أو «العليم»."], [2521.0, "وكذلك أكلُ المال بالباطل،"], [2523.0, "أو ظلمُ الناس، أو الغيبةُ والنميمة،"], [2526.0, "أو الفواحشُ من الزنا وغيرها ممّا حرّمه الله عز وجل،"], [2532.0, "إنما يرجع ذلك في المقام الأوّل إلى غفلة القلوب والعقول عن استحضار مقتضيات هذه الأسماء والصفات."]], "tr": [[2512.0, "Bu sebeple gizli günahların kaynağı, kalplerin ve akılların Allah'ın \"Rakîb\" veya \"Semî'\" ya da \"Basîr\", veya \"Habîr\" ya da \"Alîm\" isminden gafletidir."], [2521.0, "Aynı şekilde haksız yere mal yemek, insanlara zulmetmek, gıybet ve koğuculuk ya da zina ve Allah Azze ve Celle'nin haram kıldığı diğer hayâsızlıklar;"], [2532.0, "bunlar da ilk planda kalplerin ve akılların bu isim ve sıfatların gereklerini zihinde hazır tutmaktan gafletine dayanır."]]}, {"reader": false, "ar": [[2538.4, "فمن كان يريد ـ أن يكون ـ فمن كان يريد الابتعادَ عن مثل ذلك فليكن مستحضِرًا لهذه المعرفة التي ستكون زاجرةً لقلبه،"], [2549.0, "ومانعةً لروحه، وحابسةً لجوارحه ـ بإذن الله عز وجل ـ عن الوقوع في شيءٍ من المخالفات أو الآثام."], [2557.0, "وهذا من جملة ما يُتعبَّد لله عز وجل بمقتضيات آثاره وأسمائه به."]], "tr": [[2538.4, "Kim —olmak— isterse, kim bu gibi şeylerden uzaklaşmak isterse, bu marifeti zihninde hazır tutsun."], [2546.0, "Bu marifet, Allah Azze ve Celle'nin izniyle onun kalbini men edecek, ruhunu alıkoyacak ve azalarını muhalefetlerden veya günahlardan birine düşmekten tutacaktır."], [2557.0, "Bu, Allah Azze ve Celle'ye eserlerinin ve isimlerinin gerekleriyle kulluk edilen şeyler cümlesindendir."]]}]}, {"ts": "42:44", "title": "7. Külliye: Nassın sahih olduğu ve icmâın gerçekleştiği isimlerden Allah'ı tamamen veya kısmen inkâr ve tekzîb ta'tiliyle ta'til eden kâfirdir", "paras": [{"reader": false, "ar": [[2564.0, "ومن الكلّيّات ـ وهي الكلّيّة الأخيرة ـ:"], [2568.0, "كلُّ من عطّل الله عن أسمائه كلًّا أو بعضًا..."], [2572.0, "ـ الكلّيّة طويلة شوي، معليش ـ كلُّ من عطّل الله عن أسمائه كلًّا أو بعضًا،"], [2583.0, "ممّا صحّ به النصّ وانعقد عليه الإجماع،"], [2587.0, "تعطيلَ جحودٍ وتكذيبٍ، فهو كافر. <span class=\"note\">(يكررها)<\/span> أُعيدها بسرعة:"], [2613.0, "كلُّ من عطّل الله عن أسمائه كلًّا أو بعضًا،"], [2617.5, "ممّا صحّ به النصّ وانعقد عليه الإجماع،"], [2620.5, "تعطيلَ جحودٍ وتكذيبٍ، فهو كافر. وأنا المستفيد من هذا التكرار ترى في المقام الأوّل،"], [2626.2, "حتى يتمرّس ذهني على الكلّيّة."]], "tr": [[2564.0, "Külliyelerden biri de —ki bu son külliyedir—:"], [2568.9, "Allah'ı isimlerinden tamamen veya kısmen ta'til eden..."], [2572.0, "—külliye biraz uzun, kusura bakmayın— 7."], [2574.7, "külliye: Nassın sahih olduğu ve üzerinde icmâın gerçekleştiği (isimlerden) Allah'ı tamamen veya kısmen inkâr ve tekzîb ta'tiliyle ta'til eden kâfirdir. (Tekrar ediyor.) Hızlıca tekrar ediyorum:"], [2613.0, "<b>7. külliye: Nassın sahih olduğu ve üzerinde icmâın gerçekleştiği (isimlerden) Allah'ı tamamen veya kısmen inkâr ve tekzîb ta'tiliyle ta'til eden kâfirdir.<\/b> Bilin ki bu tekrardan ilk planda faydalanan benim;"], [2625.9, "ta ki zihnim külliyeye alışsın."]]}, {"reader": false, "ar": [[2628.0, "أقول وبالله التوفيق: لقد أجمع المسلمون على أنّ من أنكر أسماءَ الله عز وجل أو صفاتِه بالكلّيّة ـ أي إنكارًا كلّيًّا ـ فيقول:"], [2639.0, "إنّ الله لا يستحقّ أن يُسمّى باسمٍ،"], [2642.5, "ولا يجوز أن يوصف بصفة،"], [2645.0, "كما تفعله الجهميّةُ الغلاة المحضة أتباعُ الجهم بن صفوان،"], [2651.0, "وكما يفعله الباطنيّةُ الإسماعيليّة النُّصيريّة القرمطيّة،"], [2658.0, "فهؤلاء بالإجماع كفّار. بل إنّ من شكّ في كفر من عطّل الله عز وجل عن كافّة أسمائه وكافّة صفاته فإنه كافرٌ مثله،"], [2677.0, "وذلك لأنه مكذِّبٌ لكتاب الله عز وجل وسنّة رسوله صلى الله عليه وسلم،"], [2684.0, "ولأنه خارقٌ لإجماع الأمّة المعلوم من الدين بالضرورة."]], "tr": [[2628.0, "Tevfik Allah'tandır, derim ki: Müslümanlar şu hususta icmâ etmiştir:"], [2629.6, "Allah Azze ve Celle'nin isimlerini veya sıfatlarını bütünüyle —yani külli bir inkârla— inkâr eden ve \"Allah bir isimle isimlendirilmeyi hak etmez, bir sıfatla vasıflanması da caiz değildir\" diyen kimse —Cehm b."], [2644.5, "Safvân'ın tâbileri olan katıksız aşırı Cehmiyye'nin yaptığı gibi ve İsmâilî, Nusayrî, Karmatî Bâtınîlerin yaptığı gibi—, işte bunlar icmâ ile kâfirdir."], [2665.0, "Hatta Allah Azze ve Celle'yi bütün isimlerinden ve bütün sıfatlarından ta'til edenin küfründen şüphe eden de onun gibi kâfirdir."], [2676.3, "Çünkü o, Allah Azze ve Celle'nin Kitabı'nı ve Resûlü sallallâhu aleyhi ve sellem'in sünnetini yalanlamaktadır ve dinden zarûrî olarak bilinen ümmetin icmâını delmektedir."]]}, {"reader": false, "ar": [[2688.0, "فهذا بالنسبة للإنكار الكلّيّ."], [2690.0, "ولكنّ الكلّيّة تعرّضت للإنكار البعضيّ الجزئيّ في قوله:"], [2698.7, "«أو بعضًا». ويقصد بقوله:"], [2703.6, "«أو بعضًا» أي: من أنكر اسمًا أو اسمين أو ثلاثةً أو أربعةً،"], [2711.2, "أو أقلَّ أو أكثر."], [2713.0, "فهل يُعتبر من أنكر إنكارًا جزئيًّا كافرًا؟"], [2717.0, "الجواب: عدّه من الكفّار،"], [2719.7, "ولكن شرط له ثلاثة شروط:"]], "tr": [[2688.0, "Bu, külli inkâr bakımındandır. Fakat külliye \"veya kısmen\" sözüyle kısmî, cüz'î inkâra da değinmiştir."], [2698.7, "\"Veya kısmen\" sözüyle kastedilen, bir, iki, üç veya dört ismi, ya da daha azını veya daha fazlasını inkâr edendir."], [2713.0, "Cüz'î inkârla inkâr eden kâfir sayılır mı?"], [2717.0, "Cevap: (Külliye) onu kâfirlerden saymıştır;"], [2719.7, "fakat bunun için üç şart koşmuştur:"]]}, {"reader": false, "ar": [[2723.0, "الشرط الأوّل: في قوله:"], [2726.0, "«صحّ به النصّ»، يعني لا بدّ أن يكون هذا الاسمُ الذي عطّله ذلك المعطِّلُ ممّا ثبت في كتاب الله عز وجل،"], [2737.5, "أو صحّت به سنّةُ رسول الله صلى الله عليه وسلم."], [2741.0, "وبناءً على اشتراط هذا الشرط،"], [2745.0, "فإذا عطّل الإنسانُ شيئًا من أسماء الله عز وجل ممّا لم يثبت به نصٌّ صحيحٌ صريح،"], [2751.4, "فإنه لا يُعتبر كافرًا."]], "tr": [[2723.0, "Birinci şart, \"nassın sahih olduğu\" sözündedir."], [2727.5, "Yani o muattılın ta'til ettiği bu ismin Allah Azze ve Celle'nin Kitabı'nda sabit olmuş veya Resûlullah sallallâhu aleyhi ve sellem'in sünnetiyle sahih olarak gelmiş olması gerekir."], [2741.0, "Bu şartın koşulmasına binaen, insan Allah Azze ve Celle'nin isimlerinden sahih ve sarih bir nassla sabit olmamış bir şeyi ta'til ederse kâfir sayılmaz."]]}, {"reader": false, "ar": [[2753.0, "الشرط الثاني: في قوله:"], [2758.0, "«وانعقد عليه الإجماع»، بمعنى أن يكون هذا الاسمُ ممّا أجمع على إثباته أهلُ السنّة والجماعة."], [2771.0, "وبناءً على اشتراط هذا الشرط،"], [2774.0, "فإذا ثبت الخلافُ في هذا الاسم ـ إثباتًا أو نفيًا ـ عن أهل السنّة والجماعة أنفسِهم،"], [2780.0, "فلا يُعتبر من مسائل التكفير التي يُكفَّر بها من خالف؛"], [2784.0, "كـ«المسعِّر»: هل هو اسمٌ من أسماء الله،"], [2789.0, "أو خبرٌ عن فعلٍ من أفعاله؟"], [2791.0, "فإنّ من اختار هذا أو اختار هذا فلا حقَّ لأحدٍ أن يكفّر أحدًا في هذه الجزئيّة."], [2797.0, "وكاسم الله «المحسن»، فإنّ من أثبته أو نفاه لا يجوز أن نحكم عليه بالكفر."]], "tr": [[2753.0, "İkinci şart, \"üzerinde icmâın gerçekleştiği\" sözündedir."], [2758.0, "Yani bu ismin, Ehl-i Sünnet ve'l-Cemaat'in isbatı üzerinde icmâ ettiği isimlerden olması gerekir."], [2771.0, "Bu şartın koşulmasına binaen, bu isim hakkında —isbat veya nefy bakımından— bizzat Ehl-i Sünnet ve'l-Cemaat'ten ihtilaf sabit olursa, bu, muhalefet edenin tekfir edildiği tekfir meselelerinden sayılmaz."], [2782.1, "\"el-Müsa'ir\" (fiyatları belirleyen) gibi: O, Allah'ın isimlerinden bir isim midir, yoksa O'nun fiillerinden bir fiil hakkında bir haber midir?"], [2791.0, "Bunu da seçen, şunu da seçen olsa, hiç kimsenin bu ayrıntıda bir başkasını tekfir etme hakkı yoktur."], [2797.0, "Allah'ın \"el-Muhsin\" ismi gibi; onu isbat edeni de nefyedeni de küfürle itham etmemiz caiz değildir."]]}, {"reader": false, "ar": [[2806.0, "وذلك لأنّ المتقرِّر في القواعد أن لا تكفيرَ في مسائل الخلاف،"], [2813.0, "فمسائلُ الخلاف لا ينبغي أن نجعلها مَناطًا لتكفير أحدٍ ممّن ثبت إسلامُه بيقين؛"], [2823.0, "وذلك لأنّ الخلاف يوجب الريبَ والشكَّ والشبهة."], [2829.0, "والمتقرِّر في القواعد أنّ من ثبت إسلامُه بيقينٍ فلا يزول عنه اسمُ الإسلام إلا بيقين،"], [2837.0, "والمتقرِّر في القواعد أن لا تكفيرَ مع قيام الشبهة أو التأويل."]], "tr": [[2806.0, "Bu böyledir; çünkü kaidelerde yerleşik olan şudur:"], [2811.7, "İhtilaf meselelerinde tekfir yoktur. İhtilaf meselelerini, Müslümanlığı kesin olarak sabit olan birinin tekfirine dayanak yapmamız uygun değildir."], [2823.0, "Çünkü ihtilaf, şüpheyi, tereddüdü ve şübheyi gerektirir."], [2829.0, "Kaidelerde yerleşik olan şudur: Müslümanlığı kesin olarak sabit olan kimseden İslâm adı ancak kesin bir şeyle kalkar."], [2837.0, "Yine kaidelerde yerleşik olan şudur:"], [2839.3, "Şübhe veya te'vil varken tekfir yoktur."]]}, {"reader": false, "ar": [[2842.0, "الشرط الثالث: في قوله:"], [2845.0, "«إنكارَ جحودٍ وتكذيب»، بمعنى أنه إذا قال:"], [2850.8, "أنا أجحد وأكذّب باسم «الله» عز وجل،"], [2856.0, "أو باسم «الرحمن»، أو باسم «الرحيم»،"], [2859.5, "أو باسم «المؤمن» أو «السلام» أو «المهيمن»،"], [2863.5, "أو غيرها ممّا تواترت به الأدلّة،"], [2867.0, "فإنه يُعتبر كافرًا. وتقييدُ هذه الكلّيّة بقولنا:"], [2873.8, "«جحود تكذيب وإنكار» يُخرج ما إذا كان تأويلًا؛"], [2879.0, "بمعنى أنه آمن بهذا الاسم،"], [2881.5, "ولكنه يُخرجه عن مقتضاه أو عن معناه تأويلًا،"], [2885.5, "لا جحدًا ولا تكذيبًا ولا إنكارًا للنصّ."]], "tr": [[2842.0, "Üçüncü şart, \"inkâr ve tekzîb (yalanlama) ile inkâr\" sözündedir."], [2850.8, "Yani \"Ben 'Allah' Azze ve Celle ismini\" veya \"'Rahmân' ismini\" veya \"'Rahîm' ismini\" veya \"'Mü'min' veya 'Selâm' veya 'Müheymin' ismini\" ya da delillerin tevâtür derecesinde geldiği diğer isimleri \"inkâr ediyor ve yalanlıyorum\" derse kâfir sayılır."], [2871.0, "Bu külliyenin \"cuhûd, tekzîb ve inkâr\" sözümüzle kayıtlanması, te'vil olduğu durumu dışarıda bırakır."], [2879.0, "Yani bu isme iman etmiştir, fakat onu inkâr, tekzîb veya nassı reddetme yoluyla değil, te'vil yoluyla gereğinden veya manasından çıkarmaktadır."]]}, {"reader": false, "ar": [[2889.0, "ومسائلُ التأويل وكلّيّاتُ التكفير بالتأويل قد ذكرناها في كلّيّات التكفير سابقًا،"], [2896.4, "ولله الحمد والمنّة. والمقصود من ذلك أنّ تعطيل الله عن أسمائه ينقسم إلى قسمين:"], [2907.4, "إلى تعطيلٍ كلّيٍّ عامّ،"], [2909.0, "فهذا لا نتوقّف في تكفيره مطلقًا،"], [2913.0, "ولا ينفع التأويلُ في مثل ذلك،"], [2917.0, "ولا ننظر إلى الشبهة التي تقوم في قلب صاحبها أبدًا؛"], [2922.0, "فإنّ الجهميّة لمّا عطّلوا أسماءَ الله عز وجل كلًّا وصـ..."], [2927.1, "ـ فإنّ الجهميّة لمّا عطّلوا أسماء الله عز وجل وصفاته كلًّا،"], [2932.0, "إنما عطّلوها من باب التأويل،"], [2934.2, "ولم يعذرهم أهلُ السنّة،"], [2936.0, "وحكموا بكفرهم وخروجهم من ملّة الإسلام بالكلّيّة."]], "tr": [[2889.0, "Te'vil meselelerini ve te'vil sebebiyle tekfirin külliyelerini daha önce tekfir külliyelerinde zikretmiştik;"], [2903.0, "hamd ve minnet Allah'adır. Bundan maksat şudur:"], [2905.0, "Allah'ı isimlerinden ta'til etmek iki kısma ayrılır:"], [2907.4, "Birincisi külli, genel ta'tildir. Bunu yapanın tekfirinde mutlak olarak tereddüt etmeyiz;"], [2915.0, "bunun gibisinde te'vil fayda vermez;"], [2918.0, "sahibinin kalbindeki şübheye de asla bakmayız."], [2922.0, "Çünkü Cehmiyye Allah Azze ve Celle'nin isimlerini tamamen ve sı..."], [2927.1, "—Cehmiyye Allah Azze ve Celle'nin isimlerini ve sıfatlarını tamamen ta'til ettiğinde, onları ancak te'vil yoluyla ta'til etmişlerdi."], [2933.8, "Ehl-i Sünnet onları mazur görmedi;"], [2936.0, "onların küfrüne ve İslâm milletinden tamamen çıktıklarına hükmetti."]]}, {"reader": false, "ar": [[2944.0, "ولكنّ هذه الشروط تأتي في القسم الثاني،"], [2947.5, "وهو التعطيل الجزئيّ؛ فلا نكفّر أحدًا عطّل شيئًا من أسماء الله عز وجل إلا إذا كان تعطيلُه لاسمٍ قد ثبت به النصّ،"], [2960.0, "وقام عليه الإجماع، وكان عن جحودٍ وتكذيب ـ وكان عن جحودٍ وتكذيب."], [2972.0, "فالجاحد حقيقةً هو من جحد وكذّب باسمٍ من أسماء الله عز وجل،"], [2979.0, "كما قال الله عز وجل:"], [2981.5, "<span class=\"ayah\">﴿وَهُمْ يَكْفُرُونَ بِالرَّحْمَٰنِ﴾<\/span> <span class=\"ref\">[الرعد: ٣٠]<\/span>. فإذا جحد اسمًا من الأسماء أو صفةً من الصفات بدون تأويلٍ فلا جرم أنه يُعتبر كافرًا."]], "tr": [[2944.0, "Fakat bu şartlar ikinci kısımda, yani cüz'î ta'tilde söz konusudur."], [2949.0, "Allah Azze ve Celle'nin isimlerinden birini ta'til eden hiç kimseyi, ancak ta'tili nassla sabit olmuş, üzerinde icmâ bulunan bir isme yönelikse ve inkâr ve tekzîb yoluyla olmuşsa —inkâr ve tekzîb yoluyla olmuşsa— tekfir ederiz."], [2972.0, "Hakiki inkârcı, Allah Azze ve Celle'nin isimlerinden bir ismi inkâr eden ve yalanlayandır."], [2978.4, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2981.5, "<span class=\"ayah\">﴿Onlar Rahmân'ı inkâr ediyorlar﴾<\/span> [Ra'd 30]."], [2983.9, "İsimlerden bir ismi veya sıfatlardan bir sıfatı te'vilsiz olarak inkâr ederse, şüphesiz kâfir sayılır."]]}, {"reader": false, "ar": [[2991.0, "ولعلّنا نكتفي بهذا القدر،"], [2996.0, "ونبدأ ـ إن شاء الله ـ في قواعد وكلّيّات صفات الله عز وجل في الدرس القادم."]], "tr": [[2991.0, "Belki bu kadarıyla yetiniriz; inşallah gelecek derste Allah Azze ve Celle'nin sıfatlarının kaidelerine ve külliyelerine başlayacağız."]]}, {"reader": false, "ar": [[3001.0, "وآخرُ دعوانا أن الحمد لله ربّ العالمين،"], [3004.0, "وصلّى الله وسلّم على نبيّنا محمّدٍ وعلى آله وصحبه أجمعين."]], "tr": [[3001.0, "Son duamız, âlemlerin Rabbi Allah'a hamd olsun."], [3003.6, "Allah, Peygamberimiz Muhammed'e, âline ve bütün ashâbına salât ve selâm eylesin."]]}]}]};
