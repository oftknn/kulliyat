<script>
const D={"no": 73, "vid": "Ei5-J23X_1g", "title_ar": "الدرس (٧٣) من شرح كليات العقيدة — كليات في باب الصفات: اقتران الصفات باسمه السلام، وإمرارها كما جاءت، وأدلة علو الذات", "title_tr": "Şerhu Külliyyâti'l-Akîde — 73. Ders: Sıfatlar Babının Külliyeleri (Sıfatların es-Selâm İsmiyle Birlikteliği, Sıfatların Geldiği Gibi Geçirilmesi, Zâtın Uluvvünün Delilleri)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Allah'ın bütün sıfatları O'nun es-Selâm ismiyle birliktedir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.3, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.7, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.5, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [11.9, "أمّا بعد: لا نزال في سرد الكلّيّات المتعلّقة بشرح باب الصفات عند أهل السنة والجماعة،"], [19.5, "وأظنّ أنّنا وقفنا عند قول أهل السنة:"], [23.0, "كلُّ صفات الله عز وجل مقرونةٌ باسمه السلام،"], [27.0, "أليس كذلك؟ هي الكلّيّة التي سنشرحها،"], [30.8, "وهي الكلّيّة الأولى في هذا الدرس:"], [35.0, "<b>كلُّ صفات الله عز وجل مقرونةٌ باسمه السلام.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.3, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [13.0, "Bundan sonra: Hâlâ Ehl-i Sünnet ve'l-Cemaat'e göre sıfatlar babının şerhiyle ilgili külliyeleri sıralamaya devam ediyoruz."], [19.5, "Sanırım Ehl-i Sünnet'in \"Allah Azze ve Celle'nin bütün sıfatları O'nun es-Selâm ismiyle birliktedir\" sözünde kalmıştık, öyle değil mi?"], [28.0, "Şerh edeceğimiz külliye budur ve bu dersteki ilk külliyedir:"], [32.9, "<b>1. külliye: Allah Azze ve Celle'nin bütün sıfatları O'nun es-Selâm ismiyle birliktedir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[46.0, "أقول وبالله التوفيق: ومن المعلوم أنّ أهل السنة مجمعون على أنّ من أسماء الله عز وجل «السلام»،"], [57.0, "كما أثبته الله عز وجل في آخر سورة الحشر،"], [60.0, "في قول الله عز وجل:"], [63.5, "<span class=\"ayah\">﴿السَّلَامُ الْمُؤْمِنُ الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ﴾<\/span> <span class=\"ref\">[الحشر: ٢٣]<\/span>."], [68.0, "فهذا الاسم ينبغي لأهل السنة أن يستحضروه عند ذكر شيءٍ من صفات الله عز وجل أو أسمائه؛"], [76.0, "وذلك لأنّ السلام معناه السلامة من كلّ ما يناقضه."], [83.0, "فإذًا جميعُ صفات الله عز وجل لا بدّ أن تكون مقرونةً بهذا الاسم العظيم وبصفته."]], "tr": [[46.0, "Tevfik Allah'tandır, derim ki: Bilindiği üzere Ehl-i Sünnet, Allah Azze ve Celle'nin isimlerinden birinin \"es-Selâm\" olduğunda icmâ etmiştir;"], [56.0, "nitekim Allah Azze ve Celle onu Haşr sûresinin sonunda, Allah Azze ve Celle'nin şu sözünde isbat etmiştir:"], [63.5, "<span class=\"ayah\">﴿es-Selâm (her türlü kusurdan sâlim), el-Mü'min (güven veren), el-Müheymin (gözetip koruyan), el-Azîz, el-Cebbâr, el-Mütekebbir﴾<\/span> [Haşr 23]."], [69.9, "Ehl-i Sünnet'in, Allah Azze ve Celle'nin sıfatlarından veya isimlerinden bir şey anarken bu ismi zihninde hazır tutması gerekir."], [76.0, "Çünkü es-Selâm'ın manası, kendisine aykırı olan her şeyden sâlim (uzak ve korunmuş) olmaktır."], [83.0, "O hâlde Allah Azze ve Celle'nin bütün sıfatlarının bu azîm isimle ve onun ifade ettiği sıfatla birlikte olması gerekir."]]}, {"reader": false, "ar": [[91.0, "فإذا نظرتَ إلى أفراد صفات الله عز وجل ـ أعني صفاتِ كماله ـ وجدتَ كلَّ صفةٍ سلامًا ممّا يضادّ كمالَها."], [101.0, "فحياته عز وجل سلامٌ من الموت ومن السِّنَة ومن النوم."], [109.0, "وكذلك قيّوميّته وقدرته سلامٌ من التعب ومن اللُّغوب."], [118.0, "وكذلك علمه عز وجل سلامٌ من عُزوب شيءٍ عنه،"], [125.0, "أو عُروض نسيانٍ، أو حاجةٍ إلى تذكّرٍ وتفكّر؛"], [130.0, "فعلمُ الله عز وجل هو العلم العامّ الشامل الكامل،"], [135.0, "لا يعتريه نسيانٌ ولا غفلة."]], "tr": [[91.0, "Allah Azze ve Celle'nin sıfatlarına —yani kemal sıfatlarına— tek tek baktığında, her sıfatın kemaline zıt olan şeyden sâlim olduğunu görürsün."], [101.0, "O'nun Azze ve Celle hayatı ölümden, uyuklamadan ve uykudan sâlimdir."], [109.0, "Aynı şekilde kayyûmiyyeti ve kudreti yorgunluktan ve bitkinlikten sâlimdir."], [118.0, "Aynı şekilde O'nun Azze ve Celle ilmi, bir şeyin O'ndan gizli kalmasından, unutkanlık arız olmasından veya hatırlamaya ve düşünmeye ihtiyaç duymaktan sâlimdir."], [130.0, "Allah Azze ve Celle'nin ilmi umumi, kuşatıcı ve kâmil ilimdir;"], [133.9, "ona ne unutkanlık ne de gaflet arız olur."]]}, {"reader": false, "ar": [[138.0, "وإرادته عز وجل أيضًا من صفاته،"], [141.7, "فهي سلامٌ عن خروجها عن مقتضى الحكمة؛"], [146.0, "فمراداته عز وجل لا بدّ أن تكون مقرونةً بالحكمة،"], [151.5, "لأنّ مراداته سلامٌ كلُّها."], [154.0, "وكلماته الكونيّة والشرعيّة سلامٌ من الكذب ومن الخُلْف ومن الظلم."], [163.0, "وكذلك غناه عز وجل سلامٌ من الحاجة أو الافتقار إلى غيره بوجهٍ ما."]], "tr": [[138.0, "O'nun Azze ve Celle iradesi de sıfatlarındandır;"], [141.7, "o da hikmetin gereğinin dışına çıkmaktan sâlimdir."], [146.0, "Allah Azze ve Celle'nin murad ettiği şeylerin hikmetle birlikte olması gerekir;"], [150.9, "çünkü O'nun muradlarının hepsi selâmettir (kusursuzdur)."], [154.0, "O'nun kevnî ve şer'î kelimeleri yalandan, sözden dönmekten ve zulümden sâlimdir."], [159.6, "Aynı şekilde O'nun Azze ve Celle ganiliği (zenginliği), herhangi bir yönden başkasına ihtiyaç duymaktan veya muhtaç olmaktan sâlimdir."]]}, {"reader": false, "ar": [[173.0, "وكذلك عذابُه ـ وهو فعلٌ من أفعاله ـ وانتقامُه ـ وهو فعلٌ من أفعاله ـ كلُّه سلامٌ من أن يكون ظلمًا أو غِلظةً أو تشفّيًا أو قسوة،"], [191.0, "بل هو محضُ حكمته وعدله ووضعِه الأشياءَ مواضعَها،"], [198.0, "وهو الذي يستحقّ عليه الحمدَ والثناء كما يستحقّه على إحسانه وثوابه ونعمه."]], "tr": [[173.0, "Aynı şekilde O'nun azabı —ki fiillerinden bir fiildir— ve intikamı —ki o da fiillerinden bir fiildir—, bunların hepsi zulüm, katılık, öfkesini teskin etmek (teşeffî) veya acımasızlık olmaktan sâlimdir."], [189.0, "Aksine o, O'nun saf hikmeti, adaleti ve her şeyi yerli yerine koymasıdır."], [194.6, "O, bundan dolayı da, ihsanı, sevabı ve nimetleri sebebiyle hamd ve senâyı hak ettiği gibi hamd ve senâyı hak eder."]]}, {"reader": false, "ar": [[208.0, "وكذلك حكمته وعزّته سلامٌ من كلّ ما يضادّها؛"], [217.0, "فهو سلامٌ ممّا يتوهّم أعداؤه والجاهلون به من خلاف حكمته وقضائه وقدره،"], [225.0, "كما يقوله أهل البدع إذا تكلّموا عن شيءٍ من هذه الصفات."], [230.0, "وأحكامه عز وجل سلامٌ من العبث ومن السُّدى ومن الجور ومن الظلم،"], [239.0, "ومن توهّم وقوع شيءٍ منها على خلاف الحكمة."], [244.0, "وقضاؤه وقدره أيضًا سلامٌ من الظلم،"], [248.3, "وسلامٌ من العبث، وسلامٌ من أن لا يكون له حكمة،"], [256.0, "وسلامٌ من التناقض والاختلاف والاضطراب."]], "tr": [[208.0, "Aynı şekilde O'nun hikmeti ve izzeti, kendisine zıt olan her şeyden sâlimdir."], [217.0, "O, düşmanlarının ve O'nu tanımayanların, hikmetine, kazasına ve kaderine aykırı olarak vehmettikleri şeylerden sâlimdir;"], [225.0, "nitekim bid'at ehli bu sıfatlardan bir şey hakkında konuştuklarında bunu söylerler."], [230.0, "O'nun Azze ve Celle hükümleri abesten, başıboşluktan, haksızlıktan ve zulümden;"], [236.8, "onlardan bir şeyin hikmete aykırı olarak meydana geldiğinin vehmedilmesinden sâlimdir."], [244.0, "O'nun kazası ve kaderi de zulümden sâlimdir, abesten sâlimdir, hikmetsiz olmaktan sâlimdir;"], [254.6, "çelişkiden, ihtilaftan ve tutarsızlıktan sâlimdir."]]}, {"reader": false, "ar": [[265.0, "وجميعُ ما قرّره الله عز وجل في شريعة أنبيائه ورسله كلُّه سلامٌ من إثبات شيءٍ على خلاف المصلحة؛"], [277.0, "فجميع التشريعات كلُّها يُراد بها جلبُ المصالح وتكميلُها،"], [282.0, "وتعطيلُ المفاسد وتقليلُها. فشريعته كلُّها حكمة،"], [287.1, "وكلُّها رحمة، وكلُّها مصلحة،"], [290.0, "وكلُّها عدل. وكذلك عطاؤه سلامٌ من كونه معاوضةً أو لحاجةٍ يرجوها الله عز وجل منه."]], "tr": [[265.0, "Allah Azze ve Celle'nin peygamberlerinin ve resullerinin şeriatında takrir ettiği her şey, maslahata aykırı bir şeyi sabit kılmaktan sâlimdir."], [277.0, "Bütün teşrîlerin hepsiyle maslahatları celbetmek ve tamamlamak, mefsedetleri ortadan kaldırmak ve azaltmak murad edilir."], [285.0, "O'nun şeriatının tamamı hikmettir, tamamı rahmettir, tamamı maslahattır, tamamı adalettir."], [290.0, "Aynı şekilde O'nun vermesi, bir karşılık (muâvaza) olmaktan veya Allah Azze ve Celle'nin ondan (kuldan) umduğu bir ihtiyaç için olmaktan sâlimdir."]]}]}, {"ts": "05:04", "title": "1. Külliye (devam): Vermesi ve men etmesi; istivâ, uluvv ve nüzulün selâmeti", "paras": [{"reader": false, "ar": [[304.0, "وكذلك منعُه عز وجل سلامٌ من البخل،"], [308.6, "وسلامٌ من خوف الإملاق أو نفادِ ما في الخزائن؛"], [315.0, "فهو لا يعطي إلا لحكمةٍ لا عن حاجة،"], [319.0, "ولا يمنع إلا لحكمةٍ لا عن بخلٍ ولا خوفٍ من النفاد."], [325.0, "كما في قوله عز وجل فيما يرويه عن ربّه عز وجل:"], [330.0, "«يا عبادي، لو أنّ أوّلكم وآخركم وإنسكم وجنّكم قاموا في صعيدٍ واحدٍ فسألوني، فأعطيتُ كلَّ إنسانٍ مسألته، ما نقص ذلك ممّا عندي إلا كما ينقص المِخْيَطُ إذا أُدخل البحر» <span class=\"note\">(Müslim)<\/span>،"], [347.0, "يعني: لا ينقص شيئًا."], [349.1, "وفي الصحيحين من حديث أبي هريرة رضي الله عنه قال:"], [354.2, "قال النبيّ صلى الله عليه وسلم:"], [357.3, "«يدُ الله ملأى لا يَغيضها نفقةٌ، سحّاءُ الليلَ والنهار»، الحديثَ بتمامه."]], "tr": [[304.0, "Aynı şekilde O'nun Azze ve Celle men etmesi (vermemesi) cimrilikten sâlimdir;"], [310.6, "fakirlik korkusundan veya hazinelerdekinin tükenmesinden sâlimdir."], [315.0, "O ancak bir hikmet için verir, ihtiyaçtan dolayı değil;"], [319.0, "ancak bir hikmet için men eder, cimrilikten veya tükenme korkusundan dolayı değil."], [325.0, "Nitekim (Peygamber'in) Rabbi Azze ve Celle'den rivayet ettiği sözde şöyle buyrulur:"], [330.0, "\"Ey kullarım! Sizin ilkiniz ve sonunuz, insiniz ve cinniniz bir düzlükte toplanıp benden isteseler, ben de her insana istediğini versem, bu benim katımdakinden ancak bir iğnenin denize daldırıldığında (denizden) eksilttiği kadar eksiltir.\" <span class=\"note\">(Müslim)<\/span> Yani hiçbir şey eksiltmez."], [349.1, "Sahîhayn'da Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinden rivayet edildiğine göre Nebî sallallâhu aleyhi ve sellem şöyle buyurdu:"], [357.3, "\"Allah'ın eli doludur; hiçbir harcama onu eksiltmez;"], [359.4, "gece gündüz bol bol akıtır.\" Hadisin tamamı (bu şekildedir)."]]}, {"reader": false, "ar": [[363.0, "فما يصفه به اليهود من أنّ يد الله مغلولة،"], [368.0, "فلا نقول لهم إلا كما قال الله عز وجل لهم:"], [372.0, "<span class=\"ayah\">﴿غُلَّتْ أَيْدِيهِمْ وَلُعِنُوا بِمَا قَالُوا﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span>."], [374.0, "وما وصفه به اليهود في قول الله عز وجل عنهم:"], [379.0, "<span class=\"ayah\">﴿لَّقَدْ سَمِعَ اللَّهُ قَوْلَ الَّذِينَ قَالُوا إِنَّ اللَّهَ فَقِيرٌ وَنَحْنُ أَغْنِيَاءُ﴾<\/span> <span class=\"ref\">[آل عمران: ١٨١]<\/span> <span class=\"note\">(Şeyh «لقد كفر الذين قالوا…» diye okuyor)<\/span>."], [383.0, "ولمّا نزل قول الله عز وجل:"], [385.8, "<span class=\"ayah\">﴿مَّن ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا﴾<\/span> <span class=\"ref\">[البقرة: ٢٤٥]<\/span> قالوا:"], [389.4, "أربُّك يستعطي ـ أو يستقرض ـ يا محمد؟"], [392.0, "فالله عز وجل في كلّ أسمائه سلام،"], [397.0, "وفي كلّ صفاته سلام،"], [399.0, "وفي كلّ أفعاله سلام."]], "tr": [[363.0, "Yahudilerin O'nu \"Allah'ın eli bağlıdır\" diye vasıflandırmalarına gelince, onlara ancak Allah Azze ve Celle'nin onlar hakkında söylediğini söyleriz:"], [370.8, "<span class=\"ayah\">﴿Onların elleri bağlansın ve söyledikleri sebebiyle lânetlensinler﴾<\/span> [Mâide 64]."], [374.0, "Yahudilerin O'nu vasıflandırdıkları şey de Allah Azze ve Celle'nin onlar hakkındaki şu sözündedir:"], [379.0, "<span class=\"ayah\">﴿Andolsun Allah, \"Allah fakirdir, biz zenginiz\" diyenlerin sözünü işitti﴾<\/span> [Âl-i İmrân 181] <span class=\"note\">(Şeyh \"Andolsun ... diyenler kâfir oldu\" diye okuyor)<\/span>."], [385.8, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Kimdir Allah'a güzel bir borç verecek olan?﴾<\/span> [Bakara 245] sözü inince, \"Ey Muhammed!"], [392.0, "Rabbin bağış mı dileniyor —veya borç mu istiyor—?\" dediler."], [395.6, "Allah Azze ve Celle bütün isimlerinde selâmdır (kusursuzdur), bütün sıfatlarında selâmdır, bütün fiillerinde selâmdır."]]}, {"reader": false, "ar": [[402.0, "وكذلك نقول: إنّ استواء الله عز وجل وعلوَّه على عرشه أيضًا سلامٌ من أن يكون محتاجًا إلى شيءٍ من ذلك؛"], [412.1, "فاستواؤه عز وجل ليس عن حاجةٍ للعرش،"], [417.0, "وحملُ الملائكة للعرش ليس عن حاجةٍ لهم،"], [423.0, "فإنه الغنيّ بذاته عن كلّ أحدٍ عز وجل،"], [428.0, "وهو الغنيّ عن العرش وعن حملة العرش وعن كلّ ما سواه."], [434.0, "فهو استواءٌ وعلوٌّ لا يشبه استواءَ وعلوَّ شيءٍ من المخلوقات أبدًا."]], "tr": [[402.0, "Aynı şekilde deriz ki: Allah Azze ve Celle'nin arşına istivâsı ve arşı üzerindeki uluvvü de bundan bir şeye muhtaç olmaktan sâlimdir."], [409.3, "O'nun Azze ve Celle istivâsı arşa ihtiyaçtan dolayı değildir;"], [412.1, "meleklerin arşı taşıması da onlara ihtiyaçtan dolayı değildir."], [419.2, "Çünkü O Azze ve Celle, zâtıyla herkesten müstağnîdir;"], [426.8, "O, arştan, arşı taşıyanlardan ve kendisinden başka her şeyden müstağnîdir."], [434.0, "Bu, mahlûkattan hiçbir şeyin istivâsına ve uluvvüne asla benzemeyen bir istivâ ve uluvdur."]]}, {"reader": false, "ar": [[443.0, "ونزولُه عز وجل في كلّ ليلةٍ إلى السماء الدنيا نقول فيه:"], [449.4, "إنه سلامٌ ممّا يضادّ علوَّه؛"], [453.0, "فإنّ نزول المخلوق وإن كان يتنافى مع علوّه،"], [458.0, "لكنّ هذا بالنسبة له لعجزه."], [460.8, "أمّا الله عز وجل فإنّ معيّته لا تتنافى مع كونه عاليًا،"], [466.0, "وعلوَّه لا يتنافى مع كونه معنا،"], [469.0, "ونزولَه لا يتنافى مع كونه مستويًا على عرشه،"], [473.0, "واستواءَه على عرشه لا يتنافى مع كونه موصوفًا بالنزول."], [478.0, "فإنّ ذلك وإن كان متعارضًا في حقّ المخلوق،"], [482.0, "فليس كلُّ شيءٍ يتعارض في حقّ المخلوق لا بدّ وأن يتعارض في حقّ الخالق."]], "tr": [[443.0, "O'nun Azze ve Celle her gece dünya semasına nüzulü hakkında da deriz ki:"], [449.4, "O, uluvvüne zıt olan şeyden sâlimdir."], [453.0, "Mahlûkun inişi her ne kadar onun yüksekte olmasıyla çelişse de bu, onun açısından acizliğinden dolayıdır."], [460.8, "Allah Azze ve Celle'ye gelince;"], [463.9, "O'nun maiyyeti (bizimle beraberliği) yüce olmasıyla çelişmez, uluvvü bizimle beraber olmasıyla çelişmez, nüzulü arşına müstevî olmasıyla çelişmez, arşına istivâsı da nüzulle vasıflanmasıyla çelişmez."], [478.0, "Bu, mahlûk hakkında birbiriyle çelişse de mahlûk hakkında birbiriyle çelişen her şeyin Hâlık hakkında da çelişmesi gerekmez."]]}, {"reader": false, "ar": [[490.0, "بل وكماله سلامٌ من كلّ ما يتوهّمه معطِّلٌ أو مشبِّه،"], [495.0, "وسلامٌ من أن يصير تحت شيءٍ أو محصورًا في شيءٍ عز وجل."], [500.0, "وبناءً على ذلك فينبغي أن نستحضر هذا الاسم العظيم في كلّ متعلَّقٍ من متعلَّقات الكلام على شيءٍ من أسماء الله أو صفاته أو أفعاله أو قضائه وقدره،"], [516.2, "وغير ذلك ممّا تقدّم شرحه."], [520.0, "وهذه الكلّيّة مستفادةٌ من كلام الإمام ابن القيّم رحمه الله تعالى، والله أعلم."]], "tr": [[490.0, "Hatta O'nun kemali, bir muattılın veya bir müşebbihin vehmettiği her şeyden sâlimdir;"], [495.0, "Azze ve Celle bir şeyin altında kalmaktan veya bir şeyin içinde sınırlanmaktan sâlimdir."], [500.0, "Buna göre, Allah'ın isimlerinden, sıfatlarından, fiillerinden, kazasından ve kaderinden ve daha önce şerhi geçen diğer konulardan bir şey hakkında konuşmanın bütün taalluklarında bu azîm ismi zihnimizde hazır tutmamız gerekir."], [517.6, "Bu külliye İmam İbnü'l-Kayyim'in —Allah ona rahmet etsin— sözünden istifade edilmiştir. Allah en iyisini bilir."]]}]}, {"ts": "08:48", "title": "2. Külliye: Allah'ın bütün sıfatları vahyin delilinde geldiği gibi geçirilir", "paras": [{"reader": false, "ar": [[528.0, "ومن الكلّيّات أيضًا: <b>كلُّ صفات الله عز وجل تُمَرُّ كما جاءت في دليل الوحي.<\/b> <span class=\"note\">(يكررها)<\/span> وهذا بإجماع أهل السنة والجماعة؛"], [553.0, "فقد تواتر عنهم النقلُ بأنهم كانوا يأمرون طلّابهم بأن يُمِرّوا صفاتِ الله عز… وآياتِ الصفات كما جاءت."]], "tr": [[528.0, "Külliyelerden biri de şudur: 2."], [529.7, "külliye: Allah Azze ve Celle'nin bütün sıfatları vahyin delilinde geldiği gibi geçirilir. (Tekrar ediyor.) Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır."], [554.5, "Onlardan, talebelerine Allah'ın sıfatlarını… ve sıfat ayetlerini geldiği gibi geçirmelerini emrettikleri tevâtür derecesinde nakledilmiştir."]]}, {"reader": false, "ar": [[564.0, "قال الترمذيّ رحمه الله تعالى عقب روايته لحديث فضل الصدقة ـ فيه ذكرُ صفة اليمين للرحمن جلّ ذكره ـ:"], [576.0, "«قال غير واحدٍ من أهل العلم في هذا الحديث وما يشبهه من الروايات من الصفات، ونزولِ الربّ تبارك وتعالى كلَّ ليلةٍ إلى السماء الدنيا، قالوا: قد ثبتت الروايات في هذا، ويُؤمَن بها، ولا يُتوهَّم، ولا يقال: كيف. هكذا رُوي عن مالك بن أنس وسفيان بن عيينة وعبد الله بن المبارك أنهم قالوا في هذه الأحاديث: أمِرّوها بلا كيف. وهكذا قول أهل العلم من أهل السنة والجماعة»."], [609.3, "انتهى كلامه رحمه الله."]], "tr": [[564.0, "Tirmizî —Allah ona rahmet etsin—, içinde Rahmân'ın —zikri yüce olsun— \"yemîn\" (sağ el) sıfatının zikredildiği sadaka fazileti hadisini rivayet ettikten sonra şöyle demiştir:"], [576.0, "\"İlim ehlinden birçoğu bu hadis ve sıfatlarla ilgili buna benzeyen rivayetler ve Rabbin Tebâreke ve Teâlâ her gece dünya semasına nüzulü hakkında şöyle demişlerdir:"], [598.3, "Bu konudaki rivayetler sabit olmuştur;"], [602.5, "onlara iman edilir, (keyfiyetleri) vehmedilmez ve 'nasıl?' denmez."], [609.3, "Mâlik b. Enes, Süfyân b."], [609.9, "Uyeyne ve Abdullah b. el-Mübârek'ten bu hadisler hakkında 'Onları keyfiyetsiz geçirin' dedikleri böyle rivayet edilmiştir."], [610.5, "Ehl-i Sünnet ve'l-Cemaat'ten olan ilim ehlinin sözü de böyledir.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[611.0, "وقال الإمام ابن عبد البرّ رحمه الله تعالى:"], [616.0, "«رُوِّينا عن مالك بن أنس والأوزاعيّ وسفيان بن سعيد وسفيان بن عيينة ومعمر بن راشد في الأحاديث في الصفات أنهم قالوا: أمِرّوها كما جاءت»."], [629.6, "انتهى كلامه. وقال الخطيب البغداديّ رحمه الله تعالى:"], [634.8, "«أمّا الكلام في الصفات فإنّ ما رُوي منها في السنن الصحاح مذهبُ السلف إثباتُها وإجراؤها على ظواهرها، ونفيُ الكيفيّة والتشبيه عنها». انتهى كلامه."]], "tr": [[611.0, "İmam İbn Abdilber —Allah ona rahmet etsin— şöyle demiştir:"], [616.0, "\"Mâlik b. Enes, Evzâî, Süfyân b."], [617.9, "Saîd (es-Sevrî), Süfyân b. Uyeyne ve Ma'mer b."], [622.4, "Râşid'den sıfatlarla ilgili hadisler hakkında 'Onları geldiği gibi geçirin' dedikleri bize rivayet edildi.\" Sözü burada bitti."], [629.6, "Hatîb el-Bağdâdî —Allah ona rahmet etsin— şöyle demiştir:"], [634.8, "\"Sıfatlar hakkındaki söze gelince; sahih sünenlerde onlardan rivayet edilenler hakkında selefin mezhebi, onları isbat etmek, zahirleri üzere cereyan ettirmek ve onlardan keyfiyeti ve teşbihi nefyetmektir.\" Sözü burada bitti."]]}]}, {"ts": "10:49", "title": "2. Külliye (devam): Süfyân b. Uyeyne ve selef imamlarının sözleri; tefvîz ehline cevap", "paras": [{"reader": false, "ar": [[649.0, "قال أحمد بن نصر:"], [651.0, "سألتُ سفيان بن عيينة،"], [654.0, "فقلت: يا أبا محمد،"], [656.0, "أريد أن أسألك. قال:"], [659.7, "لا تسأل. قلت: إذا لم أسألك فمن أسأل؟"], [664.0, "قال: فسَلْ. قلت: ما تقول في هذه الأحاديث التي رُويت،"], [669.0, "نحو: «القلوب بين إصبعين»،"], [671.7, "و«أنّ الله يضحك ـ أو يعجب ـ ممّن يذكره في الأسواق»؟"], [677.0, "فقال سفيان: «أمِرّوها كما جاءت بلا كيف». وسنده صحيح."]], "tr": [[649.0, "Ahmed b. Nasr şöyle demiştir:"], [651.0, "Süfyân b. Uyeyne'ye sordum; \"Ey Ebû Muhammed, sana bir şey sormak istiyorum\" dedim."], [661.0, "\"Sorma\" dedi. \"Sana sormazsam kime sorayım?\" dedim."], [664.0, "\"Sor öyleyse\" dedi. \"Rivayet edilen şu hadisler hakkında ne dersin:"], [669.8, "'Kalpler iki parmak arasındadır' ve 'Allah, kendisini çarşılarda zikredene güler —veya hoşnut olup taaccüp eder—' gibi?\" dedim."], [677.0, "Süfyân \"Onları keyfiyetsiz, geldiği gibi geçirin\" dedi. Bunun senedi sahihtir."]]}, {"reader": false, "ar": [[684.0, "وقال في رواية: «كلُّ شيءٍ وصف الله به نفسه في القرآن فقراءته تفسيره، لا كيف ولا مِثْل»."], [693.0, "انتهى كلامه. وفي لفظ:"], [695.2, "«كلُّ ما وصف الله به نفسه في كتابه فتفسيره تلاوته والسكوت عنه»."]], "tr": [[684.0, "Bir rivayette de şöyle demiştir:"], [685.6, "\"Allah'ın Kur'an'da kendisini vasıflandırdığı her şeyin okunması tefsiridir;"], [689.3, "ne keyfiyet vardır ne misil.\" Sözü burada bitti."], [693.0, "Bir lafızda da: \"Allah'ın Kitabı'nda kendisini vasıflandırdığı her şeyin tefsiri, onu okumak ve onun hakkında susmaktır.\""]]}, {"reader": false, "ar": [[702.0, "وقال الوليد بن مسلم رحمه الله تعالى:"], [706.4, "«سألتُ الأوزاعيَّ وسفيانَ الثوريَّ ومالكَ بن أنس والليثَ بن سعد ـ رحمهم الله تعالى ـ عن هذه الأحاديث التي فيها الصفة والرؤية والقرآن، فقالوا: أمِرّوها كما جاءت بلا كيف»."], [723.3, "انتهى كلامه. وفي رواية:"], [726.3, "«سألتُ سفيانَ ومالكَ بن أنس والأوزاعيَّ والليثَ بن سعد عن هذه الأحاديث التي في الرؤية والصفات، قال: أمِرّوها كما جاءت ولا تفسّروها»."], [742.0, "وهذا أصلٌ عظيمٌ عند أهل السنة والجماعة."]], "tr": [[702.0, "Velîd b. Müslim —Allah ona rahmet etsin— şöyle demiştir:"], [706.4, "\"Evzâî'ye, Süfyân es-Sevrî'ye, Mâlik b."], [708.9, "Enes'e ve Leys b. Sa'd'a —Allah onlara rahmet etsin— içinde sıfat, ru'yet ve Kur'an (bahsi) bulunan bu hadisleri sordum;"], [718.3, "'Onları keyfiyetsiz, geldiği gibi geçirin' dediler.\" Sözü burada bitti."], [723.3, "Bir rivayette de: \"Süfyân'a, Mâlik b."], [725.0, "Enes'e, Evzâî'ye ve Leys b."], [726.3, "Sa'd'a ru'yet ve sıfatlarla ilgili bu hadisleri sordum;"], [732.2, "'Onları geldiği gibi geçirin ve tefsir etmeyin' dedi.\" Bu, Ehl-i Sünnet ve'l-Cemaat katında büyük bir asıldır."]]}, {"reader": false, "ar": [[745.0, "فإن قلتَ: أوَليس هذا ممّا يُعين أهلَ التفويض على عدم الكلام في المعنى؟"], [757.0, "فأقول: هذا ليس بصحيح،"], [760.0, "ولا يجوز أن نفهم من كلام أهل السنة «أمِرّوها كما جاءت بلا كيف» أنهم يأمروننا بتفويض معانيها؛"], [768.0, "وذلك لأنهم قالوا: «أمِرّوها كما جاءت»،"], [773.0, "أي: كما جاءت في دليل الوحي،"], [775.0, "وهي إنما جاءت في دليل الوحي بمعاني اللغة العربيّة."], [781.0, "فهي لم تأتِ في دليل الوحي مفوَّضةً عن المعاني،"], [786.0, "وإنما الله عز وجل خاطبنا فيها باللسان العربيّ،"], [790.0, "فكان يريد منّا أن نفهم منها ذلك المعنى المتقرّر في لسان العرب."], [796.0, "فهي جاءت بمعانيها، يجب علينا أن نؤمن بها على مقتضى ما دلّت عليه هذه المعاني."], [804.0, "فليس في هذه الكلّيّة بهذا اللفظ متعلَّقٌ أبدًا لأهل التفويض ليستدلّوا بها على تفويضهم، والله أعلم."]], "tr": [[745.0, "Eğer \"Bu, tefvîz ehline mana hakkında konuşmama konusunda yardımcı olan bir şey değil midir?\" dersen, derim ki:"], [757.0, "Bu doğru değildir. Ehl-i Sünnet'in \"Onları keyfiyetsiz, geldiği gibi geçirin\" sözünden, bize manalarını tefvîz etmemizi emrettikleri anlamını çıkarmamız caiz değildir."], [768.0, "Çünkü onlar \"Onları geldiği gibi geçirin\" demişlerdir;"], [773.3, "yani vahyin delilinde geldiği gibi."], [775.0, "Onlar vahyin delilinde ancak Arap dilinin manalarıyla gelmiştir."], [781.0, "Vahyin delilinde manalardan soyutlanmış, tefvîz edilmiş olarak gelmemişlerdir;"], [785.4, "aksine Allah Azze ve Celle onlarda bize Arapça hitap etmiştir ve onlardan Arap dilinde yerleşik olan o manayı anlamamızı istemiştir."], [796.0, "Onlar manalarıyla gelmiştir; bu manaların delâlet ettiği şeyin gereği üzere onlara iman etmemiz vaciptir."], [804.0, "Dolayısıyla bu lafızdaki bu külliyede, tefvîz ehlinin kendi tefvîzlerine delil getirebilecekleri hiçbir dayanak asla yoktur. Allah en iyisini bilir."]]}]}, {"ts": "13:36", "title": "3. Külliye: Uluvvü açıkça bildiren her nas zâtın, kadrin ve kahrın uluvvünü içerir", "paras": [{"reader": false, "ar": [[816.0, "الكلّيّة الثالثة: <b>كلُّ نصٍّ يصرّح بالعلوّ فيتضمّن علوَّ الذات والقدر والقهر.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[816.0, "<b>3. külliye: Uluvvü (yüceliği) açıkça bildiren her nas, zâtın, kadrin (değer ve mertebenin) ve kahrın uluvvünü içerir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[850.0, "أقول وبالله التوفيق: هذه الكلّيّة تتكلّم عن صفةٍ عظيمةٍ من صفات الله عز وجل،"], [860.4, "وهي صفة العلوّ. وقد قسّم أهل السنة علوَّ الله عز وجل الوارد في الأدلّة إلى ثلاثة أقسام:"], [870.0, "إلى علوّ القدر، وقد أجمع أهل السنة والجماعة مع كافّة أهل القبلة على إثباته،"], [880.0, "ومعناه أنّ الله عز وجل له القدر المطلق،"], [889.0, "له القدر الأعلى المطلق؛"], [895.0, "فأسماؤه لها العلوّ المطلق قدرًا،"], [902.0, "وصفاته لها العلوّ المطلق قدرًا،"], [906.0, "وأفعاله لها العلوّ المطلق قدرًا،"], [909.0, "يعني أنّ قدرها قد بلغ الغاية والكمال."], [916.0, "وهذا النوع من العلوّ لم يخالف فيه أحدٌ من أهل القبلة."]], "tr": [[850.0, "Tevfik Allah'tandır, derim ki: Bu külliye, Allah Azze ve Celle'nin sıfatlarından azîm bir sıfattan, uluvv sıfatından bahsetmektedir."], [863.0, "Ehl-i Sünnet, delillerde gelen Allah Azze ve Celle'nin uluvvünü üç kısma ayırmıştır."], [870.0, "(Birincisi) kadrin uluvvüdür. Ehl-i Sünnet ve'l-Cemaat, bütün kıble ehliyle birlikte bunun isbatında icmâ etmiştir."], [878.7, "Manası şudur: Allah Azze ve Celle'nin mutlak kadri vardır;"], [884.4, "O'nun en yüce mutlak kadri vardır."], [895.0, "O'nun isimleri kadir bakımından mutlak uluvve sahiptir, sıfatları kadir bakımından mutlak uluvve sahiptir, fiilleri kadir bakımından mutlak uluvve sahiptir;"], [909.7, "yani bunların kadri nihayete ve kemale ulaşmıştır."], [916.0, "Uluvvün bu türüne kıble ehlinden hiç kimse muhalefet etmemiştir."]]}, {"reader": false, "ar": [[922.0, "الثاني: علوّ القهر؛ فما من قاهرٍ من المخلوقات إلا وقهرُ الله عز وجل فوقه،"], [932.0, "كما قال الله عز وجل:"], [934.8, "<span class=\"ayah\">﴿وَهُوَ الْقَاهِرُ فَوْقَ عِبَادِهِ﴾<\/span> <span class=\"ref\">[الأنعام: ١٨]<\/span>."], [937.0, "وهذا العلوّ بهذا المعنى قد أجمع أهل القبلة أيضًا على إثباته،"], [943.6, "ولم يخالف فيه أحد."], [946.0, "الثالث ـ وهو محطّ الخلاف بين أهل القبلة ـ وهو علوّ الذات:"], [952.0, "أنّ الله عز وجل بذاته في العلوّ المطلق."], [958.0, "وهذا الذي لا يُعرف عن غير أهل السنة والجماعة إثباتُه؛"], [965.0, "فإنّ عامّة أهل البدع قد أنكروا علوَّ الله عز وجل بذاته على عرشه."]], "tr": [[922.0, "İkincisi kahrın uluvvüdür. Mahlûkattan hiçbir kahredici (galip gelen) yoktur ki Allah Azze ve Celle'nin kahrı onun üstünde olmasın."], [931.4, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [934.8, "<span class=\"ayah\">﴿O, kullarının üstünde mutlak galip olandır﴾<\/span> [En'âm 18]."], [937.0, "Bu manadaki bu uluvvün isbatında da kıble ehli icmâ etmiştir;"], [943.0, "ona hiç kimse muhalefet etmemiştir."], [946.0, "Üçüncüsü —ki kıble ehli arasındaki ihtilafın odağı budur— zâtın uluvvüdür:"], [952.0, "Allah Azze ve Celle'nin zâtıyla mutlak uluvde olması."], [958.0, "Bunun isbatı Ehl-i Sünnet ve'l-Cemaat'ten başkasından bilinmez."], [965.0, "Çünkü bid'at ehlinin geneli, Allah Azze ve Celle'nin zâtıyla arşı üzerinde uluvvünü inkâr etmiştir."]]}, {"reader": false, "ar": [[974.0, "وهذه الكلّيّة تأتيك لتبيّن أنّ كلَّ نصٍّ ورد في الكتاب والسنة يُثبت صفة العلوّ لله عز وجل،"], [987.0, "فإنه يُستدلّ به على أنواع العلوّ الثلاثة،"], [991.0, "فلا يجوز قصرُ الاستدلال به على نوعٍ دون نوعٍ إلا بدليل؛"], [998.0, "لأنّ المتقرّر في القواعد أنّ العامّ يجب بقاؤه على عمومه،"], [1004.7, "ولا يجوز تخصيصه إلا بدليل."]], "tr": [[974.0, "Bu külliye sana şunu açıklamak için gelir:"], [977.3, "Kitap ve Sünnet'te gelen, Allah Azze ve Celle için uluvv sıfatını isbat eden her nas, uluvvün üç türüne de delil getirilir."], [990.4, "Ondan delil getirmeyi, bir delil olmadıkça bir türe hasredip diğerini dışarıda bırakmak caiz değildir."], [998.0, "Çünkü kaidelerde yerleşik olan şudur:"], [1000.0, "Âmm (genel) lafzın umumu üzere kalması vaciptir;"], [1004.0, "onu ancak bir delille tahsis etmek caizdir."]]}, {"reader": false, "ar": [[1008.0, "فمن ذلك قول الله عز وجل:"], [1011.0, "<span class=\"ayah\">﴿سَبِّحِ اسْمَ رَبِّكَ الْأَعْلَى﴾<\/span> <span class=\"ref\">[الأعلى: ١]<\/span>؛"], [1012.9, "فـ«الأعلى» اسمُ جنسٍ دخلت عليه الألف واللام،"], [1017.7, "فيكون الأعلى قدرًا وقهرًا وذاتًا."], [1021.0, "وكذلك قول الله عز وجل:"], [1024.6, "<span class=\"ayah\">﴿وَهُوَ الْعَلِيُّ الْعَظِيمُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>، وهذا اسمٌ دخلت عليه الألف واللام،"], [1032.0, "فيدخل فيه العليّ ذاتًا،"], [1034.7, "والعليّ قدرًا، والعليّ قهرًا."], [1039.0, "وكذلك قول الله عز وجل:"], [1042.3, "<span class=\"ayah\">﴿وَهُوَ الْعَلِيُّ الْكَبِيرُ﴾<\/span> <span class=\"ref\">[سبأ: ٢٣]<\/span>، أي:"], [1045.0, "العليّ ذاتًا، والعليّ قدرًا،"], [1047.7, "والعليّ قهرًا. وكذلك قول الله عز وجل:"], [1055.3, "«وهو» <span class=\"ayah\">﴿الْكَبِيرُ الْمُتَعَالِ﴾<\/span> <span class=\"ref\">[الرعد: ٩]<\/span> <span class=\"note\">(Şeyh «وهو» ile başlıyor; mushafta <span class=\"ayah\">﴿عَالِمُ الْغَيْبِ وَالشَّهَادَةِ الْكَبِيرُ الْمُتَعَالِ﴾<\/span>)<\/span>، أي:"], [1058.0, "المتعال بذاته، والمتعال بقدره، والمتعال بقهره."]], "tr": [[1008.0, "Bunlardan biri Allah Azze ve Celle'nin şu sözüdür:"], [1011.0, "<span class=\"ayah\">﴿En yüce olan Rabbinin ismini tesbih et﴾<\/span> [A'lâ 1]."], [1012.9, "\"el-A'lâ\", başına elif-lâm girmiş bir cins ismidir;"], [1015.7, "dolayısıyla kadir, kahr ve zât bakımından en yüce demektir."], [1021.0, "Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [1024.6, "<span class=\"ayah\">﴿O, pek yücedir, pek büyüktür﴾<\/span> [Bakara 255]."], [1028.7, "Bu, başına elif-lâm girmiş bir isimdir;"], [1031.4, "dolayısıyla zâtıyla yüce, kadriyle yüce ve kahrıyla yüce olmak onun kapsamına girer."], [1039.0, "Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [1042.3, "<span class=\"ayah\">﴿O, pek yücedir, pek büyüktür (el-Aliyyü'l-Kebîr)﴾<\/span> [Sebe' 23];"], [1045.0, "yani zâtıyla yüce, kadriyle yüce ve kahrıyla yüce."], [1052.0, "Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [1055.3, "\"O\" <span class=\"ayah\">﴿pek büyüktür, pek yücedir (el-Kebîru'l-Müteâl)﴾<\/span> [Ra'd 9] <span class=\"note\">(Şeyh \"O\" diye başlıyor)<\/span>;"], [1058.0, "yani zâtıyla yüce, kadriyle yüce ve kahrıyla yüce."]]}, {"reader": false, "ar": [[1067.0, "وكذلك قول الله عز وجل:"], [1070.6, "<span class=\"ayah\">﴿إِنَّهُ عَلِيٌّ حَكِيمٌ﴾<\/span> <span class=\"ref\">[الشورى: ٥١]<\/span>، أي:"], [1073.7, "عليٌّ ذاتًا، وعليٌّ قدرًا،"], [1076.7, "وعليٌّ قهرًا. وكذلك قول الله عز وجل:"], [1082.4, "<span class=\"ayah\">﴿إِلَّا ابْتِغَاءَ وَجْهِ رَبِّهِ الْأَعْلَىٰ ۝ وَلَسَوْفَ يَرْضَىٰ﴾<\/span> <span class=\"ref\">[الليل: ٢٠–٢١]<\/span>،"], [1090.0, "أي: الأعلى ذاتًا وقهرًا وقدرًا."], [1095.0, "والكلّيّة بذلك واضحة: أنّ كلَّ دليلٍ يصرّح بعلوّ الله عز وجل ـ تسميةً أو وصفًا ـ فيجب علينا أن نحمله على أنواع العلوّ الثلاثة،"], [1111.0, "خلافًا لكافّة أهل البدع الذين لا يحملونه إلا على نوعين من العلوّ دون الثالث،"], [1120.0, "وهذا تقييدٌ للإطلاق بلا دليل،"], [1123.6, "وتخصيصٌ للعموم بلا دليل."]], "tr": [[1067.0, "Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [1070.6, "<span class=\"ayah\">﴿Şüphesiz O, pek yücedir, hikmet sahibidir﴾<\/span> [Şûrâ 51];"], [1073.7, "yani zâtıyla yüce, kadriyle yüce ve kahrıyla yüce."], [1079.0, "Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [1082.4, "<span class=\"ayah\">﴿Ancak en yüce olan Rabbinin rızasını istemek için (verir). Elbette o da hoşnut olacaktır﴾<\/span> [Leyl 20–21];"], [1095.0, "yani zât, kahr ve kadir bakımından en yüce."], [1097.0, "Böylece külliye açıktır: Allah Azze ve Celle'nin uluvvünü —isim olarak veya vasıf olarak— açıkça bildiren her delili uluvvün üç türüne hamletmemiz vaciptir."], [1110.5, "Bu, onu üçüncüsünü dışarıda bırakarak ancak iki tür uluvve hamleden bid'at ehlinin tamamına muhalif olarak böyledir."], [1118.7, "Onların yaptığı, delilsiz olarak mutlakı takyit etmek ve delilsiz olarak umumu tahsis etmektir."]]}]}, {"ts": "18:47", "title": "3. Külliye (devam): Cihet şüphesine cevap", "paras": [{"reader": false, "ar": [[1127.0, "ويوضّح ذلك جُمَلٌ من الإجابة عن بعض الإشكالات؛"], [1134.0, "فمن ذلك قولهم في مسألة علوّ الذات:"], [1139.0, "إننا لو أثبتنا أنّ الله عز وجل عالٍ بذاته فيستلزم ذلك وصفَه بالجهة،"], [1148.0, "والجهة ممتنعةٌ على الله."], [1151.0, "وهذا من أعظم شُبَههم في إنكار علوّ الذات."], [1158.0, "وأجاب أهل السنة بقولهم:"], [1163.0, "إنّ لفظ الجهة ـ إثباتًا ونفيًا ـ لم يرد في الكتاب والسنة،"], [1168.0, "فلا يجوز لنا أن يحملنا ذلك اللفظ المجمل على تعطيل ما ورد من الأدلّة الصحيحة الصريحة في إثبات علوّ ذاته؛"], [1179.0, "لأنّ هذا اللفظ يوجب الاشتباه،"], [1183.0, "وتلك الأدلّة أدلّةٌ محكمةٌ قاطعةٌ في مدلولها ومعانيها."], [1189.0, "والمتقرّر في القواعد أنّ المتشابه ـ أجيبوني ـ يُردّ إلى المحكم،"], [1197.0, "وأنّ المحتمل يُردّ إلى الصريح."]], "tr": [[1127.0, "Bunu, bazı müşküllere verilen birtakım cevaplar açıklar."], [1134.0, "Bunlardan biri, onların zâtın uluvvü meselesindeki şu sözüdür:"], [1139.0, "\"Eğer Allah Azze ve Celle'nin zâtıyla yüce olduğunu isbat edersek bu, O'nu cihetle (yönle) vasıflandırmayı gerektirir;"], [1148.0, "cihet ise Allah hakkında imkânsızdır.\" Bu, onların zâtın uluvvünü inkârdaki en büyük şüphelerindendir."], [1158.0, "Ehl-i Sünnet şöyle cevap vermiştir:"], [1163.0, "Cihet lafzı —ne isbat ne de nefy yönünde— Kitap ve Sünnet'te gelmemiştir."], [1168.0, "Dolayısıyla bu mücmel lafzın, bizi O'nun zâtının uluvvünü isbat hususunda gelen sahih ve sarih delilleri ta'til etmeye sevk etmesi caiz değildir."], [1179.0, "Çünkü bu lafız iştibâh (karışıklık) doğurur;"], [1182.2, "o deliller ise medlûllerinde ve manalarında muhkem ve kesin delillerdir."], [1189.0, "Kaidelerde yerleşik olan şudur: Müteşâbih —cevap verin— muhkeme döndürülür;"], [1196.7, "muhtemel olan da sarih olana döndürülür."]]}, {"reader": false, "ar": [[1200.0, "فلا يجوز معارضة تلك الأدلّة الدالّة على هذه الصفة العظيمة لله عز وجل بمثل هذه التُّرَّهات والمجمَلات التافهة،"], [1213.0, "كقولهم بأنه يستلزم وصفه بالجهة."], [1218.0, "ثم نقول كذلك: بأنّ المتقرّر في القواعد أنّ ما لم يرد فيه دليلٌ بخصوصه فإننا لا نُثبت لفظه ولا ننفيه،"], [1231.0, "ونستفصل في معناه؛ فإن أُريد به الحقّ قبلناه،"], [1236.0, "وإن أُريد به الباطل رددناه."], [1238.0, "فإذا كنتم تقصدون بها جهةَ سُفلٍ فهذا ممتنعٌ على الله عز وجل،"], [1243.0, "فالجهة بهذا المعنى ممتنعة."], [1246.0, "وإن كنتم تريدون جهةَ علوٍّ محيطةً به عز وجل،"], [1252.0, "فهذه الجهة بهذا المعنى ممتنعة."], [1255.0, "وأمّا إذا كنتم تقصدون جهةَ علوٍّ غيرَ محيطةٍ به عز وجل،"], [1260.0, "على ما يليق بجلاله وعظمته،"], [1262.9, "فالجهة بهذا المعنى غير ممتنعة."]], "tr": [[1200.0, "Allah Azze ve Celle'nin bu azîm sıfatına delâlet eden o delillere, \"Bu, O'nu cihetle vasıflandırmayı gerektirir\" sözleri gibi bu tür saçmalıklarla ve değersiz mücmel sözlerle muâraza etmek caiz değildir."], [1220.0, "Sonra yine deriz ki: Kaidelerde yerleşik olan şudur:"], [1224.7, "Hakkında özel olarak delil gelmeyen şeyin lafzını ne isbat ederiz ne de nefyederiz;"], [1234.0, "manasını ise tafsil ederiz (ayrıntısını sorarız)."], [1235.2, "Onunla hak murad edilmişse kabul ederiz, bâtıl murad edilmişse reddederiz."], [1238.0, "Eğer onunla aşağı yönünü kastediyorsanız bu, Allah Azze ve Celle hakkında imkânsızdır;"], [1242.6, "bu manadaki cihet imkânsızdır. Eğer O'nu Azze ve Celle kuşatan bir yukarı yönü kastediyorsanız bu manadaki bu cihet de imkânsızdır."], [1255.0, "Fakat celâline ve azametine layık olduğu şekilde, O'nu Azze ve Celle kuşatmayan bir yukarı yönü kastediyorsanız bu manadaki cihet imkânsız değildir."]]}, {"reader": false, "ar": [[1265.0, "لكن لا يجوز لنا أن نصف هذا الحقّ بهذا اللفظ البدعيّ المحتمل للحقّ والباطل،"], [1273.0, "وإنما نسمّيه بما سمّاه به الشرع،"], [1276.0, "وهو أنّ الله في العلوّ المطلق،"], [1279.0, "كما صرّح به النصّ."], [1282.0, "فلا حقَّ لأهل البدع أبدًا أن ينكروا هذه الآيات المتواترات القطعيّات في دلالتها وفي معانيها،"], [1291.4, "لمجرّد أنه يلزم على إثباتها هذا اللفظ المجمل الذي يسمّونه بالجهة."]], "tr": [[1265.0, "Fakat bu hakkı, hakka da bâtıla da ihtimali olan bu bid'î lafızla vasıflandırmamız caiz değildir;"], [1273.0, "onu ancak şeriatın isimlendirdiği şekilde isimlendiririz:"], [1276.0, "O da Allah'ın, nassın açıkça bildirdiği gibi mutlak uluvde olmasıdır."], [1282.0, "Bid'at ehlinin, delâletlerinde ve manalarında kesin olan bu mütevâtir ayetleri, sadece onları isbat etmenin, kendilerinin \"cihet\" diye isimlendirdikleri bu mücmel lafzı gerektirdiği gerekçesiyle inkâr etmeye asla hakları yoktur."]]}]}, {"ts": "21:41", "title": "3. Külliye (devam): Hayyiz şüphesine cevap; külliyenin özeti", "paras": [{"reader": false, "ar": [[1301.0, "ومن شبهاتهم أيضًا قالوا:"], [1303.8, "بأنّ علوّ الذات يستلزم تحيّزه،"], [1314.0, "يعني أن يكون في حيّز،"], [1318.0, "والحيّز ممتنعٌ على الله،"], [1321.0, "ولا يمكننا أن ننفي الحيّز عن الله إلا إذا نفينا علوَّ ذاته."], [1331.0, "فنقول كما قلناه في الجواب السابق:"], [1336.0, "بأنّ لفظ الحيّز من الألفاظ المجملة التي تحتمل الحقّ والباطل،"], [1342.0, "فهو لفظٌ متشابه، وأمّا الأدلّة التي تُثبت علوّ الله عز وجل فإنها أدلّةٌ محكمةٌ قاطعةٌ في دلالتها ومعانيها،"], [1354.0, "والمتقرّر في القواعد أنّ المتشابهات مردودةٌ تُردّ إلى المحكمات،"], [1360.0, "وأنّ المحتملات تُردّ إلى الصريحات القاطعات."]], "tr": [[1301.0, "Onların şüphelerinden biri de şudur;"], [1301.7, "dediler ki: \"Zâtın uluvvü O'nun tahayyüzünü (bir hayyizde bulunmasını) gerektirir\";"], [1303.8, "yani bir hayyizde (sınırlı bir yerde) bulunmasını."], [1315.3, "\"Hayyiz ise Allah hakkında imkânsızdır;"], [1318.8, "hayyizi Allah'tan ancak zâtının uluvvünü nefyedersek nefyedebiliriz.\" Biz de önceki cevapta söylediğimiz gibi deriz ki:"], [1331.0, "Hayyiz lafzı, hakka da bâtıla da ihtimali olan mücmel lafızlardandır;"], [1336.0, "dolayısıyla müteşâbih bir lafızdır. Allah Azze ve Celle'nin uluvvünü isbat eden deliller ise delâletlerinde ve manalarında muhkem ve kesin delillerdir."], [1351.0, "Kaidelerde yerleşik olan şudur: Müteşâbihler reddedilir, muhkemlere döndürülür;"], [1357.3, "muhtemel olanlar da sarih ve kesin olanlara döndürülür."]]}, {"reader": false, "ar": [[1364.0, "ثم نقول كذلك: بأنّ لفظ الحيّز يحتمل الحقّ والباطل؛"], [1373.0, "فإن أردتم به ما يحوز الأشياء في ذاته،"], [1377.3, "أو تحوزه هي في ذاتها،"], [1380.0, "فالحيّز بهذا المعنى باطل،"], [1382.3, "بل هو كفر؛ لأننا ـ معاشرَ أهل السنة والجماعة ـ نعتقد الاعتقادَ الجازم ببينونة ذات الله عز وجل عن خلقه،"], [1396.0, "أليس كذلك؟ فليس في ذاته شيءٌ من ذوات خلقه،"], [1401.5, "ولا في ذوات خلقه شيءٌ من ذاته."], [1405.0, "فالحيّز بهذا المعنى ممتنعٌ على الله كلَّ الامتناع،"], [1410.0, "بل هو عقيدة أهل الحلول والاتّحاد."]], "tr": [[1364.0, "Sonra yine deriz ki: Hayyiz lafzı hakka da bâtıla da ihtimali vardır."], [1373.0, "Eğer onunla, eşyayı kendi zâtında toplayıp kuşatan veya eşyanın kendi zâtlarında onu kuşattığı şeyi kastediyorsanız, bu manadaki hayyiz bâtıldır, hatta küfürdür."], [1382.9, "Çünkü biz Ehl-i Sünnet ve'l-Cemaat topluluğu olarak, Allah Azze ve Celle'nin zâtının yaratıklarından ayrı (bâin) olduğuna kesin olarak inanırız, öyle değil mi?"], [1398.0, "O'nun zâtında yaratıklarının zâtlarından hiçbir şey yoktur;"], [1401.0, "yaratıklarının zâtlarında da O'nun zâtından hiçbir şey yoktur."], [1405.0, "Bu manadaki hayyiz Allah hakkında tamamen imkânsızdır;"], [1409.4, "hatta bu, hulûl ve ittihad ehlinin akîdesidir."]]}, {"reader": false, "ar": [[1413.0, "وأمّا إذا كنتم تقصدون بالحيّز:"], [1416.7, "أي المنحاز، أي البائن المنفصل،"], [1420.0, "فهذا معنًى ليس بممتنعٍ على الله عز وجل؛"], [1425.0, "لأننا نعتقد بأنّ الله بائنٌ من خلقه،"], [1429.2, "مستوٍ على عرشه. لكن لا نعبّر عن هذا المعنى الحقّ بهذا اللفظ الباطل البدعيّ،"], [1439.0, "وإنما نسمّيه بما سمّاه به النصّ،"], [1442.3, "وهو العلوّ المطلق. ولهم شُبَهٌ غير هاتين الشبهتين،"], [1449.0, "لكن هذا أعظم ما يُدندنون حوله."]], "tr": [[1413.0, "Fakat hayyiz ile \"munhâz\"ı, yani (yaratıklardan) ayrı ve ayrık olanı kastediyorsanız, bu, Allah Azze ve Celle hakkında imkânsız olmayan bir manadır."], [1425.0, "Çünkü biz Allah'ın yaratıklarından ayrı (bâin) ve arşına müstevî olduğuna inanırız."], [1431.0, "Fakat bu hak manayı bu bâtıl ve bid'î lafızla ifade etmeyiz;"], [1439.0, "onu ancak nassın isimlendirdiği şekilde, mutlak uluvv diye isimlendiririz."], [1444.0, "Onların bu iki şüpheden başka şüpheleri de vardır;"], [1449.7, "fakat etrafında en çok dolaştıkları bunlardır."]]}, {"reader": false, "ar": [[1453.0, "والخلاصة من هذه الكلّيّة:"], [1455.0, "أنّ كلَّ دليلٍ يُثبت أنّ الله هو العليّ،"], [1460.5, "أو الأعلى، أو المتعال،"], [1464.0, "كلُّ ذلك يجب علينا أن نُبقيه على عمومه وإطلاقه،"], [1469.0, "فيكون دليلًا على علوّ الذات،"], [1472.6, "وعلوّ القدر، وعلوّ القهر، والله أعلم."]], "tr": [[1453.0, "Bu külliyenin özeti şudur: Allah'ın el-Aliyy, el-A'lâ veya el-Müteâl olduğunu isbat eden her delili umumu ve mutlaklığı üzere bırakmamız vaciptir;"], [1466.2, "böylece o, zâtın uluvvüne, kadrin uluvvüne ve kahrın uluvvüne delil olur. Allah en iyisini bilir."]]}]}, {"ts": "24:37", "title": "4. Külliye: Allah'ın semada olduğunu isbat eden her nas zâtının uluvvüne delildir", "paras": [{"reader": false, "ar": [[1477.0, "ومن الكلّيّات أيضًا: <b>كلُّ نصٍّ يُثبت أنه في السماء فدليلٌ على علوّ ذاته.<\/b> وهذا الذي نقطع به."], [1486.0, "ولكنّ السماء الواردة في مثل هذه النصوص لا بدّ أن نفهمها على أن نحملها على محملين:"], [1498.0, "المحمل الأول: على أنّ السماء يُراد بها العلوّ المطلق؛"], [1503.0, "فإذا قال: <span class=\"ayah\">﴿أَأَمِنتُم مَّن فِي السَّمَاءِ﴾<\/span> <span class=\"ref\">[الملك: ١٦]<\/span>،"], [1507.0, "أي: أأمنتم مَن في العلوّ المطلق. وهذا أفضل المحملين."]], "tr": [[1477.0, "Külliyelerden biri de şudur: 4."], [1479.0, "külliye: O'nun (Allah'ın) semada olduğunu isbat eden her nas, zâtının uluvvüne delildir. Kesin olarak benimsediğimiz budur."], [1486.0, "Fakat bu tür naslarda geçen \"semâ\"yı, iki anlamdan birine hamlederek anlamamız gerekir."], [1493.1, "Birinci anlam: Semâdan mutlak uluvv murad edilmesidir."], [1498.0, "<span class=\"ayah\">﴿Semada olandan emin mi oldunuz?﴾<\/span> [Mülk 16] buyurduğunda, \"Mutlak uluvde olandan emin mi oldunuz?\" demektir."], [1507.5, "İki anlamın daha faziletlisi budur."]]}, {"reader": false, "ar": [[1516.0, "والمتقرّر في قواعد العربيّة أنّ كلَّ ما علاك فهو سماء."], [1523.0, "ودليل ذلك قول الله عز وجل عن المطر:"], [1528.0, "<span class=\"ayah\">﴿وَأَنزَلْنَا مِنَ السَّمَاءِ مَاءً﴾<\/span> <span class=\"ref\">[المؤمنون: ١٨]<\/span>،"], [1530.4, "مع أنّ المطر لا ينزل من السماء الزرقاء ذات الطباق السبع،"], [1537.0, "وإنما ينزل من السحاب،"], [1539.2, "فسمّى الله السحابَ سماءً لأنه في العلوّ."], [1543.0, "وكقول الله عز وجل في وصف النخلة:"], [1547.1, "<span class=\"ayah\">﴿أَصْلُهَا ثَابِتٌ وَفَرْعُهَا فِي السَّمَاءِ﴾<\/span> <span class=\"ref\">[إبراهيم: ٢٤]<\/span>،"], [1550.0, "ومن المعلوم أنّ فروع النخلة مهما طال جذعها فلن تصل إلى السماء ذات الأطباق الزرقاء،"], [1557.0, "ولكن وصف الله فروع النخلة بأنها في السماء لأنها في العلوّ."]], "tr": [[1516.0, "Arapçanın kaidelerinde yerleşik olan şudur:"], [1518.8, "Senin üstünde olan her şey semâdır."], [1523.0, "Bunun delili, Allah Azze ve Celle'nin yağmur hakkındaki şu sözüdür:"], [1528.0, "<span class=\"ayah\">﴿Gökten bir su indirdik﴾<\/span> [Mü'minûn 18]."], [1531.6, "Hâlbuki yağmur yedi tabakalı mavi gökten inmez, ancak buluttan iner;"], [1538.1, "Allah bulutu yukarıda olduğu için \"semâ\" diye isimlendirmiştir."], [1543.0, "Yine Allah Azze ve Celle'nin hurma ağacını vasfederken söylediği şu söz gibi:"], [1547.1, "<span class=\"ayah\">﴿Kökü sabit, dalları göktedir﴾<\/span> [İbrâhîm 24]."], [1550.0, "Bilindiği gibi hurma ağacının gövdesi ne kadar uzun olursa olsun dalları mavi tabakalı semaya asla ulaşmaz;"], [1557.6, "fakat Allah, hurmanın dallarını yukarıda oldukları için semada olmakla vasıflandırmıştır."]]}, {"reader": false, "ar": [[1564.0, "فإن لم يرضَ السامع بمثل هذا المحمل،"], [1569.0, "فإننا نذكر له المحمل الثاني،"], [1572.5, "وهو أنّ «في» بمعنى «على»؛"], [1576.0, "والمتقرّر في قواعد العربيّة أنّ حروف الجرّ تتعاوض <span class=\"q\">؟ 26:16<\/span>،"], [1581.4, "أي يكون بعضها مكان بعض."], [1589.0, "فقول الله عز وجل:"], [1591.5, "<span class=\"ayah\">﴿أَأَمِنتُم مَّن فِي السَّمَاءِ﴾<\/span> <span class=\"ref\">[الملك: ١٦]<\/span>،"], [1594.1, "أي: على السماء. ولكنّ المحمل الأول عندي أفضل؛"], [1601.0, "وذلك لأنّ المتقرّر في القواعد ـ أي في قواعد التفسير ـ أنّ الله عز وجل لا يذكر شيئًا في كتابه ـ حرفًا أو جملةً،"], [1613.4, "عفوًا: جملةً أو كلمةً أو حرفًا،"], [1616.0, "أو شيئًا من التراكيب والاستعمالات ـ إلا أنه لا يكمل معناه المراد له في هذا الموضع إلا بهذه التراكيب والاستعمالات والحروف والكلمات."]], "tr": [[1564.0, "Eğer dinleyen bu anlama razı olmazsa, ona ikinci anlamı zikrederiz:"], [1569.7, "O da \"fî\" (içinde) harfinin \"alâ\" (üstünde) anlamında olmasıdır."], [1576.0, "Arapçanın kaidelerinde yerleşik olan şudur:"], [1578.7, "Cer harfleri birbirinin yerine geçer <span class=\"q\">؟<\/span>;"], [1581.4, "yani bazısı bazısının yerinde kullanılır."], [1589.0, "Buna göre Allah Azze ve Celle'nin <span class=\"ayah\">﴿Semada olandan emin mi oldunuz?﴾<\/span> [Mülk 16] sözü, \"semanın üstünde olandan\" demektir."], [1601.0, "Fakat bence birinci anlam daha faziletlidir."], [1603.7, "Çünkü kaidelerde —yani tefsir kaidelerinde— yerleşik olan şudur:"], [1608.1, "Allah Azze ve Celle Kitabı'nda bir şeyi —bir harf veya bir cümle, pardon:"], [1613.6, "bir cümle, bir kelime veya bir harf ya da terkip ve kullanımlardan bir şeyi— ancak o yerde murad ettiği mana yalnızca bu terkipler, kullanımlar, harfler ve kelimelerle tamamlandığı için zikreder."]]}, {"reader": false, "ar": [[1632.0, "فلا يمكن أبدًا أن يؤدّى المعنى في قول الله عز وجل:"], [1638.6, "<span class=\"ayah\">﴿أَأَمِنتُم مَّن فِي السَّمَاءِ﴾<\/span> <span class=\"ref\">[الملك: ١٦]<\/span> إذا قلنا بأنّ «في» بمعنى «على»؛"], [1644.0, "لأنّ الأصل أنّ المعنى المراد لله عز وجل في هذه الآيات لا يكون إلا بحرف «في»،"], [1653.0, "ولذلك اختاره الله عز وجل في كلامه في هذه المواطن ولم يختر غيره،"], [1659.0, "واختياراته عز وجل في أفعاله وكلماته مبنيّةٌ على الحكمة والعلم عز وجل."], [1667.0, "لكنّه من باب التوسّع في الردّ على المخالف."]], "tr": [[1632.0, "Dolayısıyla \"fî\" harfinin \"alâ\" anlamında olduğunu söylersek, Allah Azze ve Celle'nin <span class=\"ayah\">﴿Semada olandan emin mi oldunuz?﴾<\/span> [Mülk 16] sözündeki mananın (tam olarak) ifade edilmesi asla mümkün olmaz."], [1644.0, "Çünkü asıl olan, Allah Azze ve Celle'nin bu ayetlerde murad ettiği mananın ancak \"fî\" harfiyle olmasıdır."], [1652.4, "Bu yüzden Allah Azze ve Celle sözünde bu yerlerde onu seçmiş, başkasını seçmemiştir."], [1658.5, "O'nun Azze ve Celle fiillerindeki ve kelimelerindeki seçimleri hikmet ve ilim üzerine kuruludur."], [1667.0, "Fakat (ikinci anlam), muhalife reddiyede genişlik sağlamak kabilindendir."]]}, {"reader": false, "ar": [[1672.0, "وهناك محملٌ ثالثٌ هو كفرٌ،"], [1675.4, "لا يجوز فهمه مطلقًا من هذه النصوص التي تدلّ على أنّ الله في السماء،"], [1684.0, "وهو ما يفهمه عامّة أهل البدع في مثل هذا التركيب،"], [1691.0, "وهي أنهم لا يفهمون إلا أنّ الله مظروفٌ في الأطباق الزرقاء السبع،"], [1700.0, "بأنّ بعض السماء تُظِلّه وبعض السماء تُقِلّه،"], [1707.0, "والسماء بأجزائها تحيط به."], [1711.0, "فمن فهم من هذه النصوص هذا المعنى فإنه يُعتبر كافرًا،"], [1717.0, "خالعًا رِبقةَ الإسلام من عنقه بالكلّيّة."]], "tr": [[1672.0, "Bir de üçüncü bir anlam vardır ki küfürdür;"], [1682.3, "Allah'ın semada olduğuna delâlet eden bu naslardan onu anlamak kesinlikle caiz değildir."], [1694.4, "Bu, bid'at ehlinin geneli bu tür bir terkipten anladığı şeydir:"], [1711.0, "Onlar, Allah'ın yedi mavi tabakanın içine konmuş (zarf içinde) olduğundan, semanın bir kısmının O'nu gölgelediğinden, bir kısmının O'nu taşıdığından ve semanın bütün parçalarıyla O'nu kuşattığından başka bir şey anlamazlar."], [1717.0, "Kim bu naslardan bu manayı anlarsa kâfir sayılır;"], [1719.0, "İslâm bağını boynundan tamamen çıkarıp atmış olur."]]}, {"reader": false, "ar": [[1721.0, "وقد ذكرتُ لكم في قواعد باب الربوبيّة بأنّ أعظم قاعدةٍ في توحيد الربوبيّة هو اعتقاد مباينة ذات الله عن ذات خلقه،"], [1734.0, "والسماواتُ مخلوقة، فلا يجوز لك أن تعتقد أنّ الله بذاته محصورٌ في السماء."], [1743.0, "وهو المعنى الذي لا يفهم أهلُ البدع إلا هو إذا قلنا لهم بأنّ الله في السماء،"], [1752.0, "فإنهم يُشغّبون علينا بمثل هذا التفسير الذي لا يقصده أحدٌ من أهل الحقّ أبدًا،"], [1761.0, "وإنما نقصد به أحد المحملين."]], "tr": [[1721.0, "Size rubûbiyyet babının kaidelerinde, rubûbiyyet tevhidindeki en büyük kaidenin, Allah'ın zâtının yaratıklarının zâtından ayrı olduğuna inanmak olduğunu zikretmiştim."], [1734.0, "Gökler mahlûktur; dolayısıyla Allah'ın zâtıyla semanın içinde sınırlandığına inanman caiz değildir."], [1743.0, "Onlara \"Allah semadadır\" dediğimizde bid'at ehlinin anladığı tek mana budur."], [1749.1, "Hak ehlinden hiç kimsenin asla kastetmediği bu tefsirle bize karşı yaygara koparırlar;"], [1758.5, "oysa biz bununla ancak iki anlamdan birini kastederiz."]]}, {"reader": false, "ar": [[1764.0, "فإذا قلنا بأنّ الله في السماء،"], [1767.0, "فإمّا نعني به أنّ الله في العلوّ المطلق،"], [1772.0, "أو نعني به بأنّ الله على السماء."], [1776.2, "ولكن لا يُعرف عن أحدٍ من أهل السنة أبدًا أنه يفهم من هذا التركيب أنّ الله مظروفٌ في السماء،"], [1787.6, "بمعنى أنها تحيط به؛"], [1790.0, "فإنّ ذلك من الفهم المغلوط في هذه النصوص."], [1796.0, "والخلاصة من ذلك: أنّ كلَّ نصٍّ يمرّ عليك يصرّح بأنّ الله في السماء فإنه من جملة أدلّة العلوّ الذاتيّ بخصوصه؛"], [1808.0, "لأنّ السماء في العلوّ،"], [1810.7, "ومن كان عليها فيكون في العلوّ المطلق أيضًا."]], "tr": [[1764.0, "\"Allah semadadır\" dediğimizde ya bununla Allah'ın mutlak uluvde olduğunu kastederiz ya da Allah'ın semanın üstünde olduğunu kastederiz."], [1776.2, "Ehl-i Sünnet'ten hiç kimsenin bu terkipten Allah'ın semanın içine konmuş olduğunu, yani semanın O'nu kuşattığını anladığı asla bilinmez;"], [1790.0, "çünkü bu, bu naslardaki yanlış anlayıştandır."], [1796.0, "Bunun özeti şudur: Karşına çıkan, Allah'ın semada olduğunu açıkça bildiren her nas, özellikle zâtî uluvvün delilleri arasındadır."], [1808.0, "Çünkü sema yukarıdadır; onun üstünde olan da aynı şekilde mutlak uluvdedir."]]}]}, {"ts": "30:20", "title": "4. Külliye (devam): Câriye hadisi; \"fî\" harfinin \"alâ\" anlamında gelmesi", "paras": [{"reader": false, "ar": [[1820.0, "كقول الله عز وجل:"], [1821.5, "<span class=\"ayah\">﴿وَهُوَ الَّذِي فِي السَّمَاءِ إِلَٰهٌ﴾<\/span> <span class=\"ref\">[الزخرف: ٨٤]<\/span>،"], [1823.5, "أي: في العلوّ المطلق،"], [1825.0, "أو على السماء. وكذلك أيضًا حديث الجارية الذي أخرجه الإمام مسلم في صحيحه،"], [1835.0, "والذي شَرِق به أهل البدع عن بَكرة أبيه؛"], [1843.0, "بين مضعِّفٍ، وبين واصفٍ للجارية بأنها خرساء أو عمياء،"], [1851.0, "وأرادوا أن يردّوه بكلّ طريق،"], [1858.0, "ولكن لا يزال عند أهل العلم والحديث في أعلى درجات الصحّة:"], [1865.0, "وهو أنّ النبيّ صلى الله عليه وسلم قال لجاريةٍ:"], [1869.9, "«أين الله؟» فقالت: في السماء،"], [1872.7, "قال: «أعتقها فإنها مؤمنة»."], [1875.0, "فشهد لها بالإيمان بهذا الاعتقاد."], [1879.0, "فقولها: «في السماء» أي:"], [1881.4, "في العلوّ المطلق، أو على السماء."]], "tr": [[1820.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1821.5, "<span class=\"ayah\">﴿O, gökte de ilâh olandır﴾<\/span> [Zuhruf 84];"], [1823.8, "yani mutlak uluvde veya semanın üstünde."], [1827.0, "Aynı şekilde İmam Müslim'in Sahîh'inde rivayet ettiği câriye hadisi de böyledir."], [1833.3, "Bid'at ehli istisnasız hepsi bu hadisi boğazlarına takılmış gibi bulmuştur:"], [1843.0, "Kimi onu zayıf saymış, kimi câriyenin dilsiz veya kör olduğunu söylemiş;"], [1851.0, "onu her yoldan reddetmek istemişlerdir."], [1854.2, "Fakat o, ilim ve hadis ehli katında sıhhatin en yüksek derecesinde olmaya devam etmektedir."], [1865.0, "Hadis şudur: Nebî sallallâhu aleyhi ve sellem bir câriyeye \"Allah nerededir?\" diye sordu."], [1871.6, "\"Semadadır\" dedi. \"Onu âzat et, çünkü o mü'minedir\" buyurdu."], [1875.0, "Böylece bu inancından dolayı onun imanına şahitlik etti."], [1881.4, "Onun \"semadadır\" sözü, mutlak uluvde veya semanın üstünde demektir."]]}, {"reader": false, "ar": [[1885.0, "وكذلك قوله صلى الله عليه وسلم:"], [1890.0, "«ألا تأمنوني وأنا أمينُ مَن في السماء» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [1897.0, "أي: مَن في العلوّ،"], [1899.9, "أو مَن على السماء."], [1904.0, "فإن قلتَ: وهل في اللغة العربيّة «في» تأتي بمعنى «على»؟"], [1911.0, "فأقول: نعم، كقول الله عز وجل عن فرعون أنه قال للسحرة لمّا آمنوا:"], [1918.0, "<span class=\"ayah\">﴿وَلَأُصَلِّبَنَّكُمْ فِي جُذُوعِ النَّخْلِ﴾<\/span> <span class=\"ref\">[طه: ٧١]<\/span>،"], [1921.0, "ومن المعلوم أنه لم يُرد أن يحفر لهم في باطنها،"], [1927.2, "وإنما سيشدّهم ويُعظم وَثاقهم وهم عليها."], [1931.0, "وكذلك قول الله عز وجل:"], [1934.2, "<span class=\"ayah\">﴿فَسِيحُوا فِي الْأَرْضِ﴾<\/span> <span class=\"ref\">[التوبة: ٢]<\/span>، فإنّ الله لم يأمرهم أن يحفروا أنفاقًا في الأرض،"], [1942.0, "وإنما أراد أن يُطيلوا السير متفكّرين في آلاء الله على الأرض."]], "tr": [[1885.0, "Aynı şekilde onun sallallâhu aleyhi ve sellem şu sözü:"], [1890.0, "\"Ben semada olanın emini iken bana güvenmiyor musunuz?\" <span class=\"note\">(Buhârî, Müslim)<\/span>;"], [1897.7, "yani yukarıda olanın veya semanın üstünde olanın."], [1904.0, "Eğer \"Arap dilinde 'fî' harfi 'alâ' anlamında gelir mi?\" dersen, derim ki:"], [1911.0, "Evet. Allah Azze ve Celle'nin, Firavun'un iman ettiklerinde sihirbazlara söylediğini bildiren şu sözü gibi:"], [1918.0, "<span class=\"ayah\">﴿Sizi hurma dallarına (fî cüzû'i'n-nahl) asacağım﴾<\/span> [Tâhâ 71]."], [1923.5, "Bilindiği gibi o, onlar için hurma gövdelerinin içini oymayı kastetmemiştir;"], [1931.0, "ancak onları gövdelerin üzerindeyken bağlayacak ve bağlarını sıkılaştıracaktı."], [1934.2, "Aynı şekilde Allah Azze ve Celle'nin <span class=\"ayah\">﴿Yeryüzünde (fi'l-ard) dolaşın﴾<\/span> [Tevbe 2] sözü:"], [1940.1, "Allah onlara yerin içinde tüneller kazmalarını emretmemiş, ancak yeryüzünde Allah'ın nimetlerini düşünerek uzun uzun yürümelerini murad etmiştir."]]}, {"reader": false, "ar": [[1949.0, "فإذًا كلُّ نصٍّ يصرّح بأنّ الله في السماء فهو من الأدلّة الدالّة على علوّه في ذاته، والله أعلم."]], "tr": [[1949.0, "O hâlde Allah'ın semada olduğunu açıkça bildiren her nas, O'nun zâtında yüce olduğuna delâlet eden delillerdendir. Allah en iyisini bilir."]]}]}, {"ts": "32:40", "title": "5. Külliye: Eşyanın O'ndan inişine delâlet eden her delil zâtının uluvvüne delildir", "paras": [{"reader": false, "ar": [[1960.0, "ومن الكلّيّات أيضًا: <b>كلُّ دليلٍ يدلّ على نزول الأشياء منه فدليلٌ على علوّ ذاته.<\/b> <span class=\"note\">(يكررها)<\/span> نحن الآن في علوّ الذات الذي هو أخطر شيء،"], [1985.0, "واسمحوا لي أنني ـ يعني ـ أذكر شيئًا واضحًا لكم،"], [1988.8, "لكن من باب التأكيد."], [1991.0, "فمتى ما رأيتَ أنّ الله عز وجل يصرّح بأنه ينزل،"], [1997.0, "أو أنّ الشيء ينزل منه،"], [1999.0, "فاعلم أنه يتضمّن إثبات علوّ ذاته عز وجل على كلّ أحد."]], "tr": [[1960.0, "Külliyelerden biri de şudur: 5."], [1962.0, "külliye: Eşyanın O'ndan inişine delâlet eden her delil, zâtının uluvvüne delildir. (Tekrar ediyor.) Şu an en tehlikeli (en önemli) konu olan zâtın uluvvü bahsindeyiz."], [1986.4, "İzin verin, size —yani— açık olan bir şeyi zikredeyim;"], [1991.0, "fakat te'kid için. Allah Azze ve Celle'nin indiğini veya bir şeyin O'ndan indiğini açıkça bildirdiğini gördüğün her zaman bil ki bu, O'nun Azze ve Celle zâtının herkesin üstünde yüce olduğunu isbat etmeyi içerir."]]}, {"reader": false, "ar": [[2004.0, "كقول الله عز وجل:"], [2006.2, "<span class=\"ayah\">﴿اللَّهُ الَّذِي أَنزَلَ الْكِتَابَ بِالْحَقِّ﴾<\/span> <span class=\"ref\">[الشورى: ١٧]<\/span>،"], [2009.0, "وقول الله عز وجل:"], [2010.8, "<span class=\"ayah\">﴿تَنزِيلُ الْكِتَابِ لَا رَيْبَ فِيهِ﴾<\/span> <span class=\"ref\">[السجدة: ٢]<\/span>،"], [2013.0, "وقول الله عز وجل:"], [2015.0, "<span class=\"ayah\">﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ﴾<\/span> <span class=\"ref\">[الحجر: ٩]<\/span>،"], [2017.0, "وقول الله عز وجل:"], [2019.5, "<span class=\"ayah\">﴿وَإِنَّهُ لَتَنزِيلُ رَبِّ الْعَالَمِينَ﴾<\/span> <span class=\"ref\">[الشعراء: ١٩٢]<\/span>،"], [2022.0, "وقول الله عز وجل:"], [2024.7, "<span class=\"ayah\">﴿آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٨٥]<\/span>،"], [2028.0, "وقول الله عز وجل:"], [2030.0, "<span class=\"ayah\">﴿ثُمَّ أَنزَلَ عَلَيْكُم مِّن بَعْدِ الْغَمِّ أَمَنَةً نُّعَاسًا﴾<\/span> <span class=\"ref\">[آل عمران: ١٥٤]<\/span>."], [2034.0, "والأدلّة في هذا المعنى كثيرة."]], "tr": [[2004.0, "Allah Azze ve Celle'nin şu sözleri gibi:"], [2007.3, "<span class=\"ayah\">﴿Kitabı hak ile indiren Allah'tır﴾<\/span> [Şûrâ 17];"], [2010.8, "<span class=\"ayah\">﴿Kitabın indirilişi —onda hiç şüphe yoktur—﴾<\/span> [Secde 2];"], [2015.0, "<span class=\"ayah\">﴿Şüphesiz zikri (Kur'an'ı) biz indirdik﴾<\/span> [Hicr 9];"], [2019.5, "<span class=\"ayah\">﴿Şüphesiz o (Kur'an), âlemlerin Rabbinin indirmesidir﴾<\/span> [Şuarâ 192];"], [2024.7, "<span class=\"ayah\">﴿Peygamber, kendisine indirilene iman etti﴾<\/span> [Bakara 285];"], [2030.0, "<span class=\"ayah\">﴿Sonra o kederin ardından üzerinize bir güven, bir uyuklama indirdi﴾<\/span> [Âl-i İmrân 154]. Bu manadaki deliller çoktur."]]}]}, {"ts": "34:00", "title": "6. Külliye: Allah için fevkiyyeti isbat eden her nas zâtının uluvvüne delildir", "paras": [{"reader": false, "ar": [[2040.0, "ومن الكلّيّات أيضًا: <b>كلُّ نصٍّ يُثبت الفوقيّةَ لله تعالى فدليلٌ على علوّ ذاته.<\/b> <span class=\"note\">(يكررها)<\/span> كقول الله عز وجل:"], [2054.8, "<span class=\"ayah\">﴿يَخَافُونَ رَبَّهُم مِّن فَوْقِهِمْ﴾<\/span> <span class=\"ref\">[النحل: ٥٠]<\/span>،"], [2057.6, "أي: ذاتًا. وقول الله عز وجل:"], [2071.5, "<span class=\"ayah\">﴿يَدُ اللَّهِ فَوْقَ أَيْدِيهِمْ﴾<\/span> <span class=\"ref\">[الفتح: ١٠]<\/span>،"], [2074.0, "وكقوله عز وجل: <span class=\"ayah\">﴿وَهُوَ الْقَاهِرُ فَوْقَ عِبَادِهِ﴾<\/span> <span class=\"ref\">[الأنعام: ١٨]<\/span>."], [2079.0, "وفي حديث زينب رضي الله تعالى عنها أنها كانت تقول لأمّهات المؤمنين:"], [2088.0, "«زوّجكنّ أهاليكنّ، وزوّجني الله من فوق سبع سماوات»."]], "tr": [[2040.0, "Külliyelerden biri de şudur: 6."], [2044.0, "külliye: Allah Teâlâ için fevkiyyeti (üstte olmayı) isbat eden her nas, zâtının uluvvüne delildir. (Tekrar ediyor.) Allah Azze ve Celle'nin şu sözü gibi:"], [2054.8, "<span class=\"ayah\">﴿Üstlerindeki Rablerinden korkarlar﴾<\/span> [Nahl 50];"], [2056.9, "yani zât bakımından (üstlerinde). Allah Azze ve Celle'nin şu sözü:"], [2071.5, "<span class=\"ayah\">﴿Allah'ın eli onların ellerinin üstündedir﴾<\/span> [Fetih 10]."], [2074.7, "Ve O'nun Azze ve Celle şu sözü gibi:"], [2079.0, "<span class=\"ayah\">﴿O, kullarının üstünde mutlak galip olandır﴾<\/span> [En'âm 18]."], [2081.7, "Zeyneb'in —Allah ondan razı olsun— hadisinde, onun mü'minlerin annelerine şöyle dediği geçer:"], [2088.0, "\"Sizi aileleriniz evlendirdi; beni ise Allah yedi kat semanın üstünden evlendirdi.\""]]}, {"reader": false, "ar": [[2097.0, "ولمّا حكم سعد بن معاذ رضي الله عنه بحكمه في بني قريظة،"], [2103.0, "قال النبيّ صلى الله عليه وسلم:"], [2106.2, "«لقد حكمتَ فيهم بحكم الله من فوق سبع سماوات»."], [2111.0, "وقوله: «من فوق سبع سماوات» هي زيادةٌ جيّدة،"], [2116.3, "وإن كانت مرسلةً إلا أنّ لها شواهد."], [2121.0, "وقال ابن عباس رضي الله تعالى عنه لعائشة رضي الله عنها:"], [2125.0, "«وأنزل الله براءتك من فوق سبع سماوات، جاء بها الروح الأمين»."], [2132.0, "والنصوص في هذا متعدّدة."]], "tr": [[2097.0, "Sa'd b. Muâz —Allah ondan razı olsun— Benî Kurayza hakkında hükmünü verince Nebî sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2106.2, "\"Andolsun, onlar hakkında yedi kat semanın üstünden (gelen) Allah'ın hükmüyle hükmettin.\" \"Yedi kat semanın üstünden\" sözü iyi bir ziyadedir;"], [2117.7, "mürsel olsa da şâhidleri vardır."], [2121.0, "İbn Abbâs —Allah ondan razı olsun— Âişe'ye —Allah ondan razı olsun— şöyle demiştir:"], [2125.0, "\"Allah senin beraatini yedi kat semanın üstünden indirdi;"], [2130.1, "onu Rûhu'l-Emîn getirdi.\" Bu konudaki naslar çoktur."]]}]}, {"ts": "35:35", "title": "7. Külliye: Eşyanın O'na yükseltilmesini ve yükselişini isbat eden her nas zâtının uluvvüne delildir", "paras": [{"reader": false, "ar": [[2135.0, "الكلّيّة التي بعدها: <b>كلُّ نصٍّ يُثبت رفعَ الأشياء وصعودَها إليه فدليلٌ على علوّ ذاته.<\/b> <span class=\"note\">(يكررها)<\/span> لأنّ الأشياء لا تُرفع إلى الله عز وجل إلا إذا كان موصوفًا بالعلوّ."], [2167.0, "كقول الله عز وجل عن عيسى:"], [2172.0, "<span class=\"ayah\">﴿بَل رَّفَعَهُ اللَّهُ إِلَيْهِ﴾<\/span> <span class=\"ref\">[النساء: ١٥٨]<\/span>،"], [2175.0, "وكقول الله عز وجل:"], [2177.4, "<span class=\"ayah\">﴿إِلَيْهِ يَصْعَدُ الْكَلِمُ الطَّيِّبُ وَالْعَمَلُ الصَّالِحُ يَرْفَعُهُ﴾<\/span> <span class=\"ref\">[فاطر: ١٠]<\/span>،"], [2184.0, "وكقول الله عز وجل عن عيسى:"], [2187.0, "<span class=\"ayah\">﴿إِنِّي مُتَوَفِّيكَ وَرَافِعُكَ إِلَيَّ﴾<\/span> <span class=\"ref\">[آل عمران: ٥٥]<\/span>،"], [2191.0, "وقال عن إدريس: <span class=\"ayah\">﴿وَرَفَعْنَاهُ مَكَانًا عَلِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٥٧]<\/span>."]], "tr": [[2135.0, "Ondan sonraki külliye: 7. külliye:"], [2138.0, "Eşyanın O'na yükseltilmesini ve O'na yükselişini isbat eden her nas, zâtının uluvvüne delildir. (Tekrar ediyor.) Çünkü eşya, ancak O uluvv ile vasıflanmışsa Allah Azze ve Celle'ye yükseltilir."], [2149.3, "Allah Azze ve Celle'nin Îsâ hakkındaki şu sözü gibi:"], [2167.0, "<span class=\"ayah\">﴿Bilakis Allah onu kendine yükseltti﴾<\/span> [Nisâ 158]."], [2169.3, "Allah Azze ve Celle'nin şu sözü gibi:"], [2172.0, "<span class=\"ayah\">﴿Güzel söz ancak O'na yükselir; salih ameli de O yükseltir﴾<\/span> [Fâtır 10]."], [2177.4, "Allah Azze ve Celle'nin Îsâ hakkındaki şu sözü gibi:"], [2182.0, "<span class=\"ayah\">﴿Seni vefat ettireceğim (tamamen alacağım) ve seni kendime yükselteceğim﴾<\/span> [Âl-i İmrân 55]."], [2187.0, "İdrîs hakkında da şöyle buyurmuştur:"], [2191.0, "<span class=\"ayah\">﴿Onu yüce bir mekâna yükselttik﴾<\/span> [Meryem 57]."]]}, {"reader": false, "ar": [[2195.0, "وفي صحيح الإمام مسلم من حديث أبي موسى رضي الله عنه قال:"], [2202.5, "قام فينا رسول الله صلى الله عليه وسلم بخمس كلمات:"], [2207.0, "«إنّ الله لا ينام، ولا ينبغي له أن ينام، يُرفع إليه عمل الليل قبل عمل النهار، وعمل النهار قبل عمل الليل، حجابه النور ـ وفي رواية: النار ـ لو كشفه لأحرقت سُبُحاتُ وجهه ما انتهى إليه بصرُه من خلقه»."]], "tr": [[2195.0, "İmam Müslim'in Sahîh'inde Ebû Mûsâ'nın —Allah ondan razı olsun— hadisinde şöyle geçer:"], [2202.5, "Resûlullah sallallâhu aleyhi ve sellem aramızda kalkıp beş söz söyledi:"], [2205.2, "\"Şüphesiz Allah uyumaz, uyumak O'na yakışmaz."], [2207.0, "Gecenin ameli gündüzün amelinden önce, gündüzün ameli de gecenin amelinden önce O'na yükseltilir."], [2216.0, "O'nun perdesi nurdur —bir rivayette:"], [2221.5, "ateştir—; onu açsa, yüzünün nurları (sübuhât) yaratıklarından gözünün ulaştığı her şeyi yakardı.\""]]}]}, {"ts": "37:07", "title": "8. Külliye: Allah'ın arşına istivâsını isbat eden her nas O'nun mutlak ve mukayyed uluvvüne delildir", "paras": [{"reader": false, "ar": [[2227.0, "ومن الكلّيّات ـ ولعلّها الأخيرة ـ:"], [2232.0, "كلُّ نصٍّ يُثبت استواءه على عرشه فدليلٌ على علوّه العامّ ـ أو المطلق ـ والمقيّد."], [2242.0, "كلُّ نصٍّ يُثبت استواءَ الله على عرشه فدليلٌ على علوّه المطلق والمقيّد. مَن يُعيد القاعدة؟"], [2261.0, "<b>كلُّ نصٍّ يُثبت استواءَ الله عز وجل على عرشه فدليلٌ على إثبات علوّه المطلق والمقيّد.<\/b>"]], "tr": [[2227.0, "Külliyelerden biri de —belki de sonuncusu— şudur:"], [2232.0, "8. külliye: O'nun arşına istivâsını isbat eden her nas, O'nun umumi —veya mutlak— ve mukayyed uluvvüne delildir."], [2242.0, "Allah'ın arşına istivâsını isbat eden her nas, O'nun mutlak ve mukayyed uluvvüne delildir. Kaideyi kim tekrar edecek?"], [2261.0, "<b>8. külliye: Allah Azze ve Celle'nin arşına istivâsını isbat eden her nas, O'nun mutlak ve mukayyed uluvvünün isbatına delildir.<\/b>"]]}, {"reader": false, "ar": [[2270.0, "وقد وردت سبعُ آياتٍ في كتاب الله عز وجل كلُّها تُثبت أنّ الله عز وجل مستوٍ على عرشه،"], [2279.0, "قد جمعها الناظم بقوله:"], [2281.7, "«في السجدة، الرعد، الحديد، ويونسٍ، وبطه، والأعراف، والفرقانِ»."], [2289.0, "كلُّها يُثبت فيها أنّ الله عز وجل مستوٍ على عرشه؛"], [2293.0, "فقول الله عز وجل:"], [2295.0, "<span class=\"ayah\">﴿ثُمَّ اسْتَوَىٰ عَلَى الْعَرْشِ﴾<\/span> <span class=\"ref\">[الأعراف: ٥٤]<\/span>،"], [2297.0, "وقول الله عز وجل:"], [2299.5, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span>."]], "tr": [[2270.0, "Allah Azze ve Celle'nin Kitabı'nda, hepsi Allah Azze ve Celle'nin arşına müstevî olduğunu isbat eden yedi ayet gelmiştir."], [2277.5, "Nâzım onları şu sözüyle bir araya getirmiştir:"], [2281.7, "\"Secde'de, Ra'd'da, Hadîd'de, Yûnus'ta, Tâhâ'da, A'râf'ta ve Furkân'da.\" Bunların hepsinde Allah Azze ve Celle'nin arşına müstevî olduğu isbat edilir."], [2293.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Sonra arşa istivâ etti﴾<\/span> [A'râf 54] sözü ve Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rahmân arşa istivâ etti﴾<\/span> [Tâhâ 5] sözü (bunlardandır)."]]}, {"reader": false, "ar": [[2302.0, "ومن المعلوم أنّ العرش فوق السماء السابعة وفوق البحر،"], [2308.0, "كما قال الله عز وجل:"], [2310.8, "<span class=\"ayah\">﴿وَكَانَ عَرْشُهُ عَلَى الْمَاءِ﴾<\/span> <span class=\"ref\">[هود: ٧]<\/span>."], [2313.0, "فعرش الله عز وجل فوق السماوات العُلا،"], [2317.9, "وفوق ذلك البحر الذي لا يعلم كيفيّته إلا هو عز وجل."], [2323.0, "وهذا العرش بما أنه في العلوّ،"], [2326.7, "فالمستوي عليه ـ استواءً يليق بجلاله وعظمته ـ لا بدّ أن يكون موصوفًا بالعلوّ،"], [2334.0, "وهذا وجه إثبات علوّ الله عز وجل المطلق."]], "tr": [[2302.0, "Bilindiği gibi arş yedinci semanın üstünde ve denizin üstündedir;"], [2306.7, "nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2310.8, "<span class=\"ayah\">﴿O'nun arşı su üzerinde idi﴾<\/span> [Hûd 7]."], [2313.7, "Allah Azze ve Celle'nin arşı yüce semaların üstünde ve keyfiyetini ancak O'nun Azze ve Celle bildiği o denizin üstündedir."], [2323.0, "Bu arş yukarıda olduğuna göre, onun üzerine —celâline ve azametine layık bir istivâ ile— müstevî olanın uluvv ile vasıflanmış olması gerekir."], [2334.0, "Allah Azze ve Celle'nin mutlak uluvvünü isbatın vechi budur."]]}, {"reader": false, "ar": [[2339.0, "وأمّا العلوّ المقيّد فهو علوّه على عرشه،"], [2345.0, "فهذا يسمّيه العلماء بالعلوّ المقيّد."], [2349.0, "فإنّ العرب تقول في قول الإنسان:"], [2353.1, "«استوى على» أي: علا واستقرّ،"], [2357.0, "أي: علا وارتفع واستقرّ."], [2360.0, "فمتى ما قُيّد الاستواء بـ«على» فيُفهم منه علوُّه واستقراره وارتفاعه."], [2373.0, "وإذا ورد الاستواء مقيّدًا بـ«إلى»،"], [2380.0, "كقول الله عز وجل:"], [2382.0, "<span class=\"ayah\">﴿ثُمَّ اسْتَوَىٰ إِلَى السَّمَاءِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٩]<\/span>،"], [2384.0, "فالمراد به قصدُ الشيء بالإرادة التامّة."], [2389.0, "وأمّا إذا ورد الاستواء مجرّدًا عن الحرف،"], [2393.0, "كقول الله عز وجل:"], [2395.2, "<span class=\"ayah\">﴿وَلَمَّا بَلَغَ أَشُدَّهُ وَاسْتَوَىٰ آتَيْنَاهُ﴾<\/span> <span class=\"ref\">[القصص: ١٤]<\/span>،"], [2398.0, "فالمراد به النضج والكمال."]], "tr": [[2339.0, "Mukayyed uluvve gelince, o, O'nun arşı üzerindeki uluvvüdür;"], [2345.0, "âlimler buna mukayyed uluvv derler."], [2349.0, "Çünkü Araplar insanın \"istevâ alâ\" sözü hakkında \"yükseldi ve karar kıldı\", yani \"yükseldi, irtifa etti ve karar kıldı\" derler."], [2357.8, "İstivâ \"alâ\" ile kayıtlandığında ondan yükselmesi, karar kılması ve irtifa etmesi anlaşılır."], [2373.0, "İstivâ \"ilâ\" ile kayıtlı olarak geldiğinde —Allah Azze ve Celle'nin <span class=\"ayah\">﴿Sonra semaya yöneldi (istevâ ilâ's-semâ)﴾<\/span> [Bakara 29] sözü gibi— bununla bir şeye tam bir iradeyle yönelmek murad edilir."], [2389.0, "İstivâ harften soyut olarak geldiğinde ise —Allah Azze ve Celle'nin <span class=\"ayah\">﴿Erginlik çağına ulaşıp olgunlaşınca (istevâ) ona … verdik﴾<\/span> [Kasas 14] sözü gibi— bununla olgunlaşma ve kemal murad edilir."]]}]}, {"ts": "40:01", "title": "8. Külliye (devam): İstivânın Arap dilindeki kullanımları · Kapanış", "paras": [{"reader": false, "ar": [[2401.0, "هكذا تعرفه العرب من لسانها:"], [2405.0, "فالاستواء المقرون بـ«على» يُراد به العلوّ والاستقرار والارتفاع،"], [2410.0, "والاستواء المقرون بـ«إلى» يُراد به القصد إلى الشيء بالإرادة التامّة،"], [2416.0, "والاستواء المجرّد عن الحرف يُراد به النضج والكمال،"], [2423.0, "كقولهم: استوى الطعام، بمعنى:"], [2425.7, "نضج وكمل. و<span class=\"ayah\">﴿وَلَمَّا بَلَغَ أَشُدَّهُ وَاسْتَوَىٰ﴾<\/span> <span class=\"ref\">[القصص: ١٤]<\/span>،"], [2430.0, "أي: نضج وكمل، وبلغ مبلغَ من يتحمّل المسؤوليّة."]], "tr": [[2401.0, "Araplar onu kendi dillerinden böyle bilirler:"], [2405.0, "\"Alâ\" ile birlikte gelen istivâdan yükselme, karar kılma ve irtifa murad edilir;"], [2410.6, "\"ilâ\" ile birlikte gelen istivâdan bir şeye tam bir iradeyle yönelmek murad edilir;"], [2416.7, "harften soyut istivâdan ise olgunlaşma ve kemal murad edilir."], [2423.7, "\"İstevâ't-taâm\" (yemek pişti) sözleri gibi;"], [2425.7, "yani pişti ve tamamlandı. <span class=\"ayah\">﴿Erginlik çağına ulaşıp olgunlaşınca﴾<\/span> [Kasas 14];"], [2430.7, "yani olgunlaştı, kemale erdi ve sorumluluk taşıyabilecek kişinin seviyesine ulaştı."]]}, {"reader": false, "ar": [[2438.0, "فهذا علوٌّ خاصّ غير العلوّ العامّ."], [2445.0, "فنحن نُثبت أنّ الله عز وجل عالٍ بالعلوّ المطلق على العرش،"], [2451.0, "وبالعلوّ المقيّد باستوائه على العرش."], [2456.0, "فهذه كلّيّاتٌ تدلّك على جُمَلٍ من الأوجه التي يستدلّ بها السُّنّيّ على البدعيّ في إثبات صفة علوّ الذات."], [2468.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[2438.0, "Bu (istivâdaki uluvv), umumi uluvvden başka, hususi bir uluvdür."], [2445.0, "Biz, Allah Azze ve Celle'nin arşın üzerinde mutlak uluvv ile ve arşa istivâsıyla mukayyed uluvv ile yüce olduğunu isbat ederiz."], [2456.0, "İşte bunlar, Sünnî'nin zâtın uluvv sıfatını isbat hususunda bid'atçıya karşı delil getirdiği birtakım vecihleri sana gösteren külliyelerdir."], [2462.7, "Allah daha yüce ve daha iyi bilendir."], [2468.0, "Allah Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);

    if(ka>=0){AR[ka].r.classList.add("on");
