<script>
const D={"no": 20, "vid": "MD9lLeZ1UzE", "title_ar": "الدرس (٢٠) من شرح كليات العقيدة — كليات في عطاءات الربوبية والألوهية، ومباينة الخالق للمخلوق، والشرك الأكبر والأصغر", "title_tr": "Şerhu Külliyyâti'l-Akîde — 20. Ders: Rubûbiyyet ve Ulûhiyyet Atâları, İstidrâc, Hâlık ile Mahlûkun Mübâyeneti, Büyük ve Küçük Şirk", "sections": [{"ts": "00:00", "title": "1. Külliye: Rubûbiyyet atâları açılıp ulûhiyyet atâları kapanan kişi istidrâca uğramıştır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.7, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.4, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [9.0, "لا نزال في سياق شرح كلّيّات باب الربوبية، فنقول وبالله التوفيق:"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.7, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.7, "Hâlâ rubûbiyyet babının külliyelerini şerh etme bağlamındayız. Tevfik Allah'tandır, deriz ki:"]]}, {"reader": false, "ar": [[21.0, "من كلّيّات هذا الدرس:"], [22.9, "<b>كلُّ من فُتحت عليه عطاءاتُ الربوبية وأُغلقت عنه عطاءاتُ الألوهية فمستدرَج.<\/b> كلُّ من فُتحت عليه عطاءاتُ الربوبية وأُغلقت عنه عطاءاتُ الألوهية فمستدرَج."], [41.0, "أُعيدها مرةً ثالثة: كلُّ من فُتحت عليه عطاءاتُ الربوبية وأُغلقت عنه عطاءاتُ الألوهية فمستدرَج."]], "tr": [[21.0, "Bu dersin külliyelerinden: 1. külliye:"], [22.9, "Rubûbiyyet atâları (bağışları) kendisine açılıp ulûhiyyet atâları kendisine kapatılan herkes istidrâca uğramıştır (müstedrectir). Rubûbiyyet atâları kendisine açılıp ulûhiyyet atâları kendisine kapatılan herkes istidrâca uğramıştır."], [41.0, "Üçüncü kez tekrar ediyorum: Rubûbiyyet atâları kendisine açılıp ulûhiyyet atâları kendisine kapatılan herkes istidrâca uğramıştır."]]}, {"reader": false, "ar": [[52.0, "وذلك لأنّ الله عز وجل يعطي عبادَه على جهتين:"], [59.0, "على عطاء الربوبية، وعلى عطاء الألوهية."], [61.0, "ونعني بعطاء الربوبية: هو العطاء الذي يُقيم به الإنسانُ دنياه،"], [68.0, "وعطاءُ الألوهية: هو الذي يُقيم به الإنسانُ دينَه."], [72.0, "فإذا رأيتَ الله عز وجل يفتح على أحدٍ من عطاءات الربوبية ما شاء أن يفتح عليه،"], [79.0, "ولكنه في المقابل أغلق عنه عطاءاتِ الألوهية،"]], "tr": [[52.0, "Bunun sebebi şudur: Allah Azze ve Celle kullarına iki yönden verir:"], [59.7, "rubûbiyyet atâsı ve ulûhiyyet atâsı."], [61.7, "Rubûbiyyet atâsı ile, insanın dünyasını onunla ayakta tuttuğu atâyı kastediyoruz;"], [68.5, "ulûhiyyet atâsı ise insanın dinini onunla ayakta tuttuğu atâdır."], [73.3, "Allah Azze ve Celle'nin birine rubûbiyyet atâlarından açmayı dilediği kadarını açtığını, fakat buna karşılık ulûhiyyet atâlarını ona kapattığını görürsen,"]]}, {"reader": false, "ar": [[83.0, "فهذا هو حقيقةُ الاستدراج المذكور في قول الله عز وجل:"], [87.0, "<span class=\"ayah\">﴿سَنَسْتَدْرِجُهُم مِّنْ حَيْثُ لَا يَعْلَمُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٢]<\/span>،"], [90.0, "وقولِ الله عز وجل:"], [92.0, "<span class=\"ayah\">﴿فَذَرْنِي وَمَن يُكَذِّبُ بِهَٰذَا الْحَدِيثِ ۖ سَنَسْتَدْرِجُهُم مِّنْ حَيْثُ لَا يَعْلَمُونَ﴾<\/span> <span class=\"ref\">[القلم: ٤٤]<\/span>،"], [97.0, "وقولِ الله عز وجل:"], [99.3, "<span class=\"ayah\">﴿أَيَحْسَبُونَ أَنَّمَا نُمِدُّهُم بِهِ مِن مَّالٍ وَبَنِينَ ۝ نُسَارِعُ لَهُمْ فِي الْخَيْرَاتِ ۚ بَل لَّا يَشْعُرُونَ﴾<\/span> <span class=\"ref\">[المؤمنون: ٥٥–٥٦]<\/span>."]], "tr": [[83.0, "İşte bu, Allah Azze ve Celle'nin şu sözünde zikredilen istidrâcın hakikatidir:"], [85.8, "<span class=\"ayah\">﴿Onları bilmedikleri yerden adım adım (helâke) yaklaştıracağız﴾<\/span> [A'râf 182];"], [89.4, "Allah Azze ve Celle'nin şu sözü:"], [91.5, "<span class=\"ayah\">﴿Bu sözü yalanlayanı bana bırak! Onları bilmedikleri yerden adım adım (helâke) yaklaştıracağız﴾<\/span> [Kalem 44];"], [96.5, "ve Allah Azze ve Celle'nin şu sözü:"], [99.3, "<span class=\"ayah\">﴿Onlar sanıyorlar mı ki kendilerine verdiğimiz mal ve oğullarla onlara hayırlarda koşturuyoruz? Hayır, onlar farkında değiller﴾<\/span> [Mü'minûn 55-56]."]]}, {"reader": false, "ar": [[108.0, "وقولِ الله عز وجل:"], [110.0, "<span class=\"ayah\">﴿فَلَمَّا نَسُوا مَا ذُكِّرُوا بِهِ﴾<\/span>،"], [113.0, "أي: فيما يُذكَّرون به من عطاءات الألوهية،"], [118.0, "فلم يؤمنوا، ولم يصدّقوا رسلَهم،"], [122.0, "ولم يقبلوا شريعتَهم، <span class=\"ayah\">﴿فَتَحْنَا عَلَيْهِمْ أَبْوَابَ كُلِّ شَيْءٍ﴾<\/span> أي:"], [128.5, "ربوبيةً، <span class=\"ayah\">﴿حَتَّىٰ إِذَا فَرِحُوا بِمَا أُوتُوا﴾<\/span> أي:"], [133.2, "من عطاءات الربوبية، <span class=\"ayah\">﴿أَخَذْنَاهُم بَغْتَةً فَإِذَا هُم مُّبْلِسُونَ ۝ فَقُطِعَ دَابِرُ الْقَوْمِ الَّذِينَ ظَلَمُوا ۚ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾<\/span> <span class=\"ref\">[الأنعام: ٤٤–٤٥]<\/span>."]], "tr": [[108.0, "Ve Allah Azze ve Celle'nin şu sözü:"], [111.2, "<span class=\"ayah\">﴿Kendilerine hatırlatılanı unutunca﴾<\/span>, yani kendilerine hatırlatılan ulûhiyyet atâlarını (unutunca);"], [115.9, "iman etmeyince, peygamberlerini tasdik etmeyince ve şeriatlarını kabul etmeyince, <span class=\"ayah\">﴿onlara her şeyin kapılarını açtık﴾<\/span>, yani rubûbiyyet yönünden;"], [127.4, "<span class=\"ayah\">﴿nihayet kendilerine verilenle sevinip şımardıklarında﴾<\/span>, yani rubûbiyyet atâlarıyla;"], [132.2, "<span class=\"ayah\">﴿onları ansızın yakaladık; bir de baktılar ki bütün ümitleri kesilmiş. Böylece zulmeden kavmin kökü kesildi. Hamd, âlemlerin Rabbi Allah'a mahsustur﴾<\/span> [En'âm 44-45]."]]}, {"reader": false, "ar": [[144.0, "وكقول الله عز وجل:"], [148.0, "<span class=\"ayah\">﴿إِنَّ قَارُونَ كَانَ مِن قَوْمِ مُوسَىٰ فَبَغَىٰ عَلَيْهِمْ ۖ وَآتَيْنَاهُ﴾<\/span> أي:"], [153.9, "ربوبيةً، <span class=\"ayah\">﴿مِنَ الْكُنُوزِ مَا إِنَّ مَفَاتِحَهُ لَتَنُوءُ بِالْعُصْبَةِ أُولِي الْقُوَّةِ إِذْ قَالَ لَهُ قَوْمُهُ لَا تَفْرَحْ﴾<\/span> أي:"], [164.9, "بعطاءات الربوبية، <span class=\"ayah\">﴿إِنَّ اللَّهَ لَا يُحِبُّ الْفَرِحِينَ ۝ وَابْتَغِ فِيمَا آتَاكَ اللَّهُ الدَّارَ الْآخِرَةَ﴾<\/span> <span class=\"ref\">[القصص: ٧٦–٧٧]<\/span>،"], [173.1, "فذكّروه بالواجب عليه في الألوهية."]], "tr": [[144.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [148.5, "<span class=\"ayah\">﴿Şüphesiz Kârûn, Mûsâ'nın kavmindendi; fakat onlara karşı azgınlık etti. Biz ona﴾<\/span> —yani rubûbiyyet yönünden— <span class=\"ayah\">﴿öyle hazineler vermiştik ki anahtarlarını (taşımak), güçlü bir topluluğa ağır gelirdi. Kavmi ona demişti ki: Şımarma!﴾<\/span> —yani rubûbiyyet atâlarıyla— <span class=\"ayah\">﴿Çünkü Allah şımaranları sevmez. Allah'ın sana verdiği şeyle âhiret yurdunu ara﴾<\/span> [Kasas 76-77]."], [173.1, "Böylece ona ulûhiyyet konusundaki vazifesini hatırlattılar."]]}, {"reader": false, "ar": [[177.0, "وكقول الله عز وجل:"], [179.7, "<span class=\"ayah\">﴿قَالُوا سُبْحَانَكَ مَا كَانَ يَنبَغِي لَنَا أَن نَّتَّخِذَ مِن دُونِكَ مِنْ أَوْلِيَاءَ وَلَٰكِن مَّتَّعْتَهُمْ وَآبَاءَهُمْ حَتَّىٰ نَسُوا الذِّكْرَ﴾<\/span> <span class=\"note\">(Şeyh «لنا»yı okumuyor, «الذكرى» diyor)<\/span>،"], [193.0, "أي: متّعتَهم بعطاءات ربوبيتك حتى نسُوا الواجبَ عليهم في ألوهيتك،"], [201.0, "قال الله عز وجل: <span class=\"ayah\">﴿وَكَانُوا قَوْمًا بُورًا﴾<\/span> <span class=\"ref\">[الفرقان: ١٨]<\/span>."]], "tr": [[177.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [179.7, "<span class=\"ayah\">﴿Dediler ki: Seni tenzih ederiz! Senden başka dostlar edinmek bize yakışmazdı. Fakat sen onları ve atalarını (dünya nimetleriyle) faydalandırdın; sonunda zikri (Seni anmayı) unuttular﴾<\/span>;"], [190.1, "yani onları rubûbiyyetinin atâlarıyla faydalandırdın, sonunda ulûhiyyetin konusunda üzerlerine düşen vazifeyi unuttular."], [197.2, "Allah Azze ve Celle şöyle buyurdu:"], [201.0, "<span class=\"ayah\">﴿Onlar helâki hak etmiş bir kavim oldular﴾<\/span> [Furkân 18]."]]}, {"reader": false, "ar": [[207.0, "وكذلك الله عز وجل لمّا قصّ علينا قصةَ سبأ بيّن لنا أنه فتح عليهم من عطاءات ربوبيته،"], [215.0, "ولكن أغلق عليهم عطاءات..."], [217.0, "أو أغلق عنهم عطاءاتِ الألوهية،"], [220.0, "فقال الله عز وجل:"], [222.4, "<span class=\"ayah\">﴿لَقَدْ كَانَ لِسَبَإٍ فِي مَسْكَنِهِمْ آيَةٌ ۖ جَنَّتَانِ عَن يَمِينٍ وَشِمَالٍ ۖ كُلُوا مِن رِّزْقِ رَبِّكُمْ وَاشْكُرُوا لَهُ ۚ بَلْدَةٌ طَيِّبَةٌ وَرَبٌّ غَفُورٌ﴾<\/span> <span class=\"ref\">[سبأ: ١٥]<\/span>؛"], [235.0, "وهذا، أي: عطاء... عطاءُ الربوبية."], [238.0, "فلمّا جاءت المطالبةُ بعطاء الألوهية ـ أو بمقتضى عطاء الألوهية ـ قال:"], [244.1, "<span class=\"ayah\">﴿فَأَعْرَضُوا فَأَرْسَلْنَا عَلَيْهِمْ سَيْلَ الْعَرِمِ وَبَدَّلْنَاهُم بِجَنَّتَيْهِمْ جَنَّتَيْنِ ذَوَاتَيْ أُكُلٍ خَمْطٍ وَأَثْلٍ وَشَيْءٍ مِّن سِدْرٍ قَلِيلٍ﴾<\/span> <span class=\"ref\">[سبأ: ١٦]<\/span>."]], "tr": [[207.0, "Aynı şekilde Allah Azze ve Celle bize Sebe' kıssasını anlattığında, onlara rubûbiyyetinin atâlarından açtığını, fakat onlara ulûhiyyet atâlarını kapattığını açıkladı ve şöyle buyurdu:"], [215.5, "<span class=\"ayah\">﴿Andolsun, Sebe' halkı için yurtlarında bir ibret vardı: Sağda ve solda iki bahçe. (Onlara denildi ki:) Rabbinizin rızkından yiyin ve O'na şükredin. (İşte size) güzel bir belde ve bağışlayıcı bir Rab﴾<\/span> [Sebe' 15]."], [231.4, "Bu, yani atâ... rubûbiyyet atâsıdır."], [233.8, "Ulûhiyyet atâsı —ya da ulûhiyyet atâsının gereği— talep edildiğinde ise şöyle buyurdu:"], [239.8, "<span class=\"ayah\">﴿Fakat onlar yüz çevirdiler. Biz de üzerlerine Arim selini gönderdik ve iki bahçelerini, buruk yemişli, ılgınlı ve içinde biraz da sedir ağacı bulunan iki bahçeye çevirdik﴾<\/span> [Sebe' 16]."]]}, {"reader": false, "ar": [[258.0, "وقال الله عز وجل:"], [259.8, "<span class=\"ayah\">﴿لَا يَغُرَّنَّكَ تَقَلُّبُ الَّذِينَ كَفَرُوا فِي الْبِلَادِ﴾<\/span> <span class=\"ref\">[آل عمران: ١٩٦]<\/span>،"], [263.2, "أي: يتقلّبون في عطاءات ربوبيته."], [267.0, "فتجد أنّ عند الكفار من قوة الاقتصاد،"], [270.5, "وكثرة العدد والعتاد، والأمطار الدائمة،"], [273.5, "والأنهار الجارية، والروضات الخضراء،"], [278.0, "ورغد العيش، وغير ذلك ممّا فتح الله عز وجل عليهم من عطاء ربوبيته."]], "tr": [[258.0, "Allah Azze ve Celle şöyle buyurdu:"], [259.8, "<span class=\"ayah\">﴿İnkâr edenlerin diyar diyar dolaşıp durmaları sakın seni aldatmasın﴾<\/span> [Âl-i İmrân 196];"], [265.4, "yani O'nun rubûbiyyet atâları içinde dolaşıp dururlar."], [269.0, "Kâfirlerde ekonomik güç, sayı ve teçhizat çokluğu, sürekli yağmurlar, akan nehirler, yeşil bahçeler, bolluk içinde bir hayat ve Allah Azze ve Celle'nin rubûbiyyet atâsından onlara açtığı daha başka şeyler bulunduğunu görürsün."]]}, {"reader": false, "ar": [[287.0, "فالله عز وجل ينبّهنا ألّا نغترّ بذلك:"], [291.0, "<span class=\"ayah\">﴿لَا يَغُرَّنَّكَ تَقَلُّبُ الَّذِينَ كَفَرُوا فِي الْبِلَادِ ۝ مَتَاعٌ قَلِيلٌ﴾<\/span> ـ هذا هو الاستدراج،"], [298.0, "هذا هو الاستدراج ـ <span class=\"ayah\">﴿ثُمَّ مَأْوَاهُمْ جَهَنَّمُ ۚ وَبِئْسَ الْمِهَادُ﴾<\/span> <span class=\"ref\">[آل عمران: ١٩٦–١٩٧]<\/span>."]], "tr": [[287.0, "Allah Azze ve Celle bizi bununla aldanmamamız için uyarıyor:"], [290.5, "<span class=\"ayah\">﴿İnkâr edenlerin diyar diyar dolaşıp durmaları sakın seni aldatmasın. (Bu) az bir faydalanmadır﴾<\/span> —işte istidrâc budur, işte istidrâc budur— <span class=\"ayah\">﴿sonra varacakları yer cehennemdir. O ne kötü yataktır!﴾<\/span> [Âl-i İmrân 196-197]."]]}]}, {"ts": "05:05", "title": "1. Külliye (devam): Atâlar karşısında insanların dört kısmı", "paras": [{"reader": false, "ar": [[305.0, "ولذلك يتحسّر الكافرُ يومَ القيامة على هذه العطاءات أنها لم تُقرَن بعطاءات الألوهية،"], [312.0, "كما قال الله عز وجل في سورة الحاقة:"], [315.0, "<span class=\"ayah\">﴿مَا أَغْنَىٰ عَنِّي مَالِيَهْ ۜ ۝ هَلَكَ عَنِّي سُلْطَانِيَهْ ۝ خُذُوهُ فَغُلُّوهُ﴾<\/span> <span class=\"ref\">[الحاقة: ٢٨–٣٠]<\/span>."]], "tr": [[305.0, "Bu yüzden kâfir kıyamet günü bu atâlara, ulûhiyyet atâlarıyla birlikte olmadıkları için hasret çeker."], [310.8, "Nitekim Allah Azze ve Celle Hâkka sûresinde şöyle buyurur:"], [313.2, "<span class=\"ayah\">﴿Malım bana hiçbir fayda sağlamadı. Saltanatım da yok olup gitti. (Allah buyurur:) Tutun onu, bağlayın onu!﴾<\/span> [Hâkka 28-30]."]]}, {"reader": false, "ar": [[323.0, "والناسُ بين هذه العطاءات ينقسمون إلى أربعة أقسام:"], [328.0, "منهم من فُتح عليه العطاءان،"], [333.0, "فأمدّه الله عز وجل من عطاء ربوبيته ما أمدّه به،"], [338.0, "ومع ذلك أمدّه من عطاءات ألوهيته ما أمدّه به؛"], [344.0, "كما فتح الله عز وجل العطاءين على داود وعلى ابنه سليمان عليهما الصلاة والسلام."]], "tr": [[323.0, "İnsanlar bu atâlar karşısında dört kısma ayrılır:"], [326.8, "Onlardan kimine iki atâ birden açılmıştır."], [331.2, "Allah Azze ve Celle ona rubûbiyyet atâsından dilediği kadar vermiş, bununla birlikte ulûhiyyet atâlarından da dilediği kadar vermiştir."], [342.0, "Nitekim Allah Azze ve Celle iki atâyı Dâvûd'a ve oğlu Süleymân'a —ikisine de salât ve selâm olsun— açmıştır."]]}, {"reader": false, "ar": [[355.0, "فإنّ الله عز وجل قد فتح عليهم الدنيا وأعطاهم المُلك،"], [359.0, "وسخّر لسليمان الريحَ والجنَّ،"], [361.6, "وأكثرَ جنوده، وجعله في عزٍّ عزيز،"], [365.6, "وفي مَنَعةٍ عظيمة، وفي مُلكٍ كبير؛"], [372.0, "ولكن مع ذلك هو نبيٌّ ورسولٌ خاضعٌ لأمر الله عز وجل،"], [379.2, "ممتثلٌ لمقتضيات ألوهية ربه تبارك وتعالى."]], "tr": [[355.0, "Allah Azze ve Celle onlara dünyayı açmış, onlara mülk (hükümranlık) vermiş;"], [358.2, "Süleymân'a rüzgârı ve cinleri boyun eğdirmiş, askerlerini çoğaltmış, onu çok güçlü bir izzet, büyük bir koruma ve büyük bir mülk içinde kılmıştır."], [368.9, "Fakat bununla birlikte o, Allah Azze ve Celle'nin emrine boyun eğen, Rabbi Tebâreke ve Teâlâ'nın ulûhiyyetinin gereklerine uyan bir nebî ve resûldür."]]}, {"reader": false, "ar": [[386.0, "ومن الناس ـ وهو أخسرُ الناس صفقةً ـ مَن أُغلق عليه العطاءان؛"], [392.0, "فأغلق الله عز وجل عنه عطاءاتِ ربوبيته،"], [396.8, "فتجده مريضًا ليس بصحيح،"], [400.0, "وفقيرًا ليس بغني، ومُعدَمًا ليس بواجد،"], [404.0, "ومع ذلك أغلق عنه عطاءاتِ الألوهية،"], [407.3, "فهو كافرٌ بالله العلي العظيم،"], [410.0, "أو مقيمٌ على معصية الله تبارك وتعالى."], [416.0, "وهذا من أخسر الناس صفقة."]], "tr": [[386.0, "İnsanlardan kimine de —ki alışverişi en zararlı olan odur— iki atâ birden kapatılmıştır."], [392.0, "Allah Azze ve Celle ona rubûbiyyet atâlarını kapatmıştır;"], [396.1, "onu sağlıklı değil hasta, zengin değil fakir, varlıklı değil yoksul bulursun."], [402.7, "Bununla birlikte ona ulûhiyyet atâlarını da kapatmıştır;"], [405.6, "o, Yüce ve Azîm olan Allah'ı inkâr eden bir kâfirdir ya da Allah Tebâreke ve Teâlâ'ya isyan üzere ısrar edendir."], [416.4, "Bu, alışverişi en zararlı insanlardandır."]]}, {"reader": false, "ar": [[418.0, "ومن الناس مَن فُتح عليه أحدُ العطاءين دون الآخر؛"], [424.0, "فمنهم من فُتح عليه عطاءُ الألوهية وأُغلق عنه عطاءُ الربوبية،"], [430.0, "وهذا وإن كان ناقصًا في أول أمره إلا أنّ المتقرّر في القواعد أنّ العبرة بكمال النهايات لا بنقص البدايات."], [439.0, "وعليه أوائلُ أمر النبي صلى الله عليه وسلم ونهاياتُه."]], "tr": [[418.0, "İnsanlardan kimine de iki atâdan biri açılmış, diğeri açılmamıştır."], [424.0, "Onlardan kimine ulûhiyyet atâsı açılmış, rubûbiyyet atâsı kapatılmıştır."], [429.4, "Bu kişi, işinin başında eksik olsa da, kaidelerde sabit olan şudur:"], [434.7, "İtibar, başlangıçların eksikliğine değil, sonların kemaline göredir."], [438.5, "Nebî ﷺ'in işinin başı ve sonu da buna göredir."]]}, {"reader": false, "ar": [[446.0, "فإنّ الله عز وجل قد خيّره بين أن يكون ملكًا رسولًا أو عبدًا رسولًا،"], [451.0, "فاختار العبوديةَ والرسالة تواضعًا منه إلى ربه تبارك وتعالى."], [456.0, "وقد كان يمرّ عليه الهلالُ والهلال أحيانًا ولا يُوقَد في بيته نار،"], [464.0, "وإنما كان طعامُه الأسودَين: التمرَ والماء."]], "tr": [[446.0, "Allah Azze ve Celle onu, melik (hükümdar) bir resûl ile kul bir resûl olmak arasında muhayyer bırakmış;"], [451.0, "o da Rabbi Tebâreke ve Teâlâ'ya karşı tevazu göstererek kulluğu ve risâleti seçmiştir."], [458.0, "Bazen hilal üstüne hilal geçer de evinde ateş yakılmazdı;"], [463.3, "yiyeceği ancak iki siyah şeydi: hurma ve su."]]}, {"reader": false, "ar": [[473.0, "وربما ينزل عليه الأضيافُ في بعض الأحيان ولا يجد ما يُضيّفهم،"], [480.0, "حتى يستعين بأحد أصحابه ليُضيّفوا ضيوفَ رسول الله صلى الله عليه وسلم."], [488.0, "وكان يقول صلى الله عليه وسلم:"], [491.3, "«ما لي وللدنيا؟ إنما مَثَلي والدنيا كراكبٍ استظلّ تحت شجرةٍ ثم تركها وراح»."]], "tr": [[473.0, "Bazen ona misafirler gelir, onları ağırlayacak bir şey bulamazdı;"], [478.1, "öyle ki Resûlullah ﷺ'in misafirlerini ağırlamaları için ashâbından birinden yardım isterdi."], [484.7, "Nebî ﷺ şöyle derdi: «Benim dünya ile ne işim var? Benim ve dünyanın misali, bir ağacın altında gölgelenip sonra onu bırakıp giden bir yolcu gibidir.»"]]}, {"reader": false, "ar": [[500.0, "ولمّا جاء عمرُ إلى النبي صلى الله عليه وسلم وقد نام على حصيرٍ،"], [507.2, "فرأى آثارَ الحصير على جنبه،"], [510.0, "بكى عمر، فقال: يا رسول الله،"], [512.7, "إنّ كسرى وهرقل فيما هم فيه من النعيم،"], [516.5, "وأنت رسول الله! فأخبر عمرَ رضي الله تعالى عنه بأنّ الدنيا ليست لأهل الإيمان."], [525.0, "بل إنّ النبي صلى الله عليه وسلم بيّن لنا العلّةَ في تحريم الشرب والأكل في آنية الذهب والفضة بقوله:"], [532.9, "«فإنها لهم في الدنيا ولنا في الآخرة»."]], "tr": [[500.0, "Ömer, Nebî ﷺ'in yanına geldiğinde, o bir hasırın üzerinde uyumuştu."], [505.6, "Ömer hasırın izlerini onun yanında görünce ağladı ve şöyle dedi:"], [510.9, "\"Ey Allah'ın Resûlü! Kisrâ ve Herakliyus içinde bulundukları nimetlerin içindeler;"], [515.5, "sen ise Allah'ın Resûlüsün!\" Bunun üzerine (Nebî ﷺ) Ömer'e —Allah ondan razı olsun— dünyanın iman ehli için olmadığını haber verdi."], [526.7, "Hatta Nebî ﷺ altın ve gümüş kaplarda yiyip içmenin haram kılınmasının illetini bize şu sözüyle açıklamıştır:"], [534.0, "«Çünkü onlar dünyada onlarındır, âhirette bizimdir.»"]]}, {"reader": false, "ar": [[537.7, "فلا يَعيبُ الإنسانَ أن يُقفَل عليه شيءٌ من عطاءات الربوبية إذا كان قد فُتح عليه عطاءاتُ الألوهية."], [549.0, "فلا بأس بالفقر ولكن (هو) محافظٌ على العقيدة الصحيحة،"], [557.0, "ولا بأس بالمرض ولكن عنده قيامُ الليل،"], [560.0, "وعنده من الصدقات ما الله به عليم،"], [563.0, "وعنده من البرّ بوالديه والإحسان إلى الخلق وكثرة الذكر،"], [569.0, "ولكنه قليلُ ذات اليد مثلًا."]], "tr": [[537.7, "Ulûhiyyet atâları kendisine açılmışsa, rubûbiyyet atâlarından bir şeyin kendisine kapatılması insana ayıp değildir."], [548.0, "Fakirlikte bir sakınca yoktur; yeter ki sahih akîdeyi muhafaza etsin."], [554.0, "Hastalıkta bir sakınca yoktur; yeter ki gece namazı olsun, Allah'ın bildiği sadakaları olsun, anne babasına iyiliği, mahlûkata ihsanı ve çokça zikri olsun;"], [568.3, "fakat meselâ eli dar olsun."]]}, {"reader": false, "ar": [[574.0, "فذلك لا يعيب الشخص،"], [576.0, "فإنّ أكرمَنا عند الله عز وجل أتقانا."], [580.0, "فالله عز وجل لم يجعل ميزانَ التفاضل عنده شيئًا من عطاءات الربوبية،"], [586.0, "وهي المال أو الجمال أو المناصب،"], [590.0, "وإنما جعل ميزانَ التفاضل شيئًا من عطاءات الألوهية،"], [595.6, "وهي التقوى، فقال: <span class=\"ayah\">﴿إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ﴾<\/span> <span class=\"ref\">[الحجرات: ١٣]<\/span>."]], "tr": [[574.0, "Bu, kişiye ayıp değildir; çünkü Allah Azze ve Celle katında en değerlimiz, en takvalı olanımızdır."], [580.5, "Allah Azze ve Celle kendi katındaki üstünlük ölçüsünü rubûbiyyet atâlarından biri, yani mal, güzellik veya makamlar kılmamıştır."], [588.7, "Üstünlük ölçüsünü ancak ulûhiyyet atâlarından biri olan takva kılmış ve şöyle buyurmuştur:"], [595.6, "<span class=\"ayah\">﴿Allah katında en değerliniz, en takvalı olanınızdır﴾<\/span> [Hucurât 13]."]]}]}, {"ts": "10:00", "title": "1. Külliye (sonu): Rubûbiyyet atâlarındaki üstünlük ölçülerinin iptali", "paras": [{"reader": false, "ar": [[600.0, "بل إنّ الله عز وجل قد أبطل جميعَ المقاييس التفاضلية في عطاءات الربوبية؛"], [611.0, "فهذا الميزان القاروني مثلًا،"], [613.9, "وهو التفاضل بالمال، فقصّ الله عز وجل علينا قصةَ هذا الرجل الذي أعطاه المال،"], [621.9, "وما نهايته. وكذلك أبطل الميزانَ الفرعوني،"], [626.0, "وهو المُلك والمنصب، فقصّ الله عز وجل علينا قصته وما فعله به."], [634.0, "وأبطل كذلك الميزانَ القرشي،"], [636.9, "وهو التفاخر بالأحساب والأنساب،"], [642.0, "فبيّن الله عز وجل أنه يوم القيامة <span class=\"ayah\">﴿لَا أَنسَابَ بَيْنَهُمْ ... وَلَا يَتَسَاءَلُونَ﴾<\/span> <span class=\"ref\">[المؤمنون: ١٠١]<\/span>."]], "tr": [[600.0, "Hatta Allah Azze ve Celle rubûbiyyet atâlarındaki bütün üstünlük ölçülerini iptal etmiştir."], [606.8, "Meselâ şu Kârûnî ölçü, yani malla üstünlük:"], [613.1, "Allah Azze ve Celle bize kendisine mal verdiği bu adamın kıssasını ve sonunun ne olduğunu anlattı."], [621.4, "Aynı şekilde Firavunî ölçüyü, yani mülk ve makamı iptal etti;"], [627.5, "bize onun kıssasını ve ona ne yaptığını anlattı."], [632.3, "Kureyşî ölçüyü, yani soy sop ve nesep ile övünmeyi de iptal etti ve kıyamet günü <span class=\"ayah\">﴿aralarında soy bağı kalmayacağını ... birbirlerini de soramayacaklarını﴾<\/span> açıkladı [Mü'minûn 101]."]]}, {"reader": false, "ar": [[648.0, "فجميعُ عطاءات الربوبية تُعتبر استدراجًا إن لم يقابلها شيءٌ من عطاءات الألوهية."], [660.0, "فالواجب علينا أن نتقي الله عز وجل فيما فتحه الله لنا من تلك العطاءات العظيمة،"], [667.2, "أن نستغلّها فيما يقرّبنا إلى الله عز وجل."], [671.0, "ومن الناس من فُتحت عليه عطاءاتُ الربوبية وأُغلقت عنه عطاءاتُ الألوهية،"], [678.0, "وهو محطُّ قاعدتنا، وهذا هو الاستدراج المذكور في كتاب الله عز وجل. والله أعلم."]], "tr": [[648.0, "Rubûbiyyet atâlarının hepsi, karşılarında ulûhiyyet atâlarından bir şey yoksa istidrâc sayılır."], [655.5, "Bize düşen, Allah'ın bize açtığı o büyük atâlar hususunda Allah Azze ve Celle'den sakınmak, onları bizi Allah Azze ve Celle'ye yaklaştıran şeylerde kullanmaktır."], [671.0, "İnsanlardan kimine de rubûbiyyet atâları açılmış, ulûhiyyet atâları kapatılmıştır;"], [676.8, "kaidemizin konusu budur. Allah Azze ve Celle'nin Kitabı'nda zikredilen istidrâc budur. Allah en iyisini bilir."]]}]}, {"ts": "11:28", "title": "2. Külliye: Kulu kendi muradından Rabbinin muradına çıkaran atâ nimet, Rabbinin muradından kendi muradına çıkaran atâ nikmettir", "paras": [{"reader": false, "ar": [[688.0, "ومن الكلّيّات أيضًا: كلُّ عطاءٍ يُخرج العبدَ عن مراده لمراد ربه فنعمة،"], [695.8, "وكلُّ عطاءٍ يُخرج العبدَ عن مراد ربه لمراده فنقمة. كلُّ عطاءٍ يُخرج العبدَ عن مراده لمراد ربه فنعمة،"], [717.0, "وكلُّ عطاءٍ يُخرج العبدَ عن مراد ربه لمراده فنقمة."]], "tr": [[688.0, "Külliyelerden biri de şudur: 2."], [690.6, "külliye: Kulu kendi muradından (isteğinden) Rabbinin muradına çıkaran her atâ nimettir;"], [696.4, "kulu Rabbinin muradından kendi muradına çıkaran her atâ ise nikmettir (belâdır). Kulu kendi muradından Rabbinin muradına çıkaran her atâ nimettir;"], [717.0, "kulu Rabbinin muradından kendi muradına çıkaran her atâ ise nikmettir."]]}, {"reader": false, "ar": [[728.0, "وهذا في العطاءين جميعًا:"], [731.0, "في عطاءات الربوبية، فإن أخرجَتك عن مرادك لمراد ربك فنعمة،"], [741.0, "وإن أخرجَتك عن مراد ربك لمرادك فنقمة."], [746.0, "وكذلك أيضًا يأتي في عطاءات الألوهية،"], [749.0, "كعطاءات العلم، وعطاءات التقوى،"], [755.0, "وعطاءات الخير، وعطاءات الذكر، وعطاءات الصلاح."]], "tr": [[728.0, "Bu, iki atânın ikisinde de geçerlidir:"], [731.7, "Rubûbiyyet atâlarında; eğer seni kendi muradından Rabbinin muradına çıkarırsa nimettir, Rabbinin muradından kendi muradına çıkarırsa nikmettir."], [745.3, "Aynı şekilde ulûhiyyet atâlarında da geçerlidir:"], [748.0, "ilim atâları, takva atâları, hayır atâları, zikir atâları ve salâh atâları gibi."]]}, {"reader": false, "ar": [[760.0, "فكلُّ عطاءٍ يتفضّل الله عز وجل عليك به فليس بنعمةٍ مطلقة،"], [767.0, "وليس بنقمةٍ مطلقة، وإنما ننظر إلى فعلك فيه:"], [771.0, "فإن أخرجك هذا العطاءُ ـ أيًّا كان نوعُه ـ من مراد نفسك،"], [776.0, "وشهوات روحك، وخلجات نفسك،"], [779.0, "إلى تحكيم ما يريده الله عز وجل فيه،"], [782.0, "فهذا العطاءُ نعمة. وأمّا إذا كان يُخرجك عن مراد ربك،"], [790.0, "ويُبعدك عنه إلى مراد نفسك،"], [793.0, "فتستغلّه في تحقيق شهواتك ونيل مرادك المخالف لشريعة ربك،"], [799.0, "فإنّ ذلك ـ والله ـ من أعظم النقم عليك."]], "tr": [[760.0, "Allah Azze ve Celle'nin sana lütfettiği her atâ ne mutlak bir nimettir ne de mutlak bir nikmettir;"], [769.0, "biz ancak senin onunla ne yaptığına bakarız."], [772.0, "Bu atâ —türü ne olursa olsun— seni nefsinin muradından, ruhunun şehvetlerinden ve nefsinin kıpırtılarından çıkarıp onda Allah Azze ve Celle'nin istediğini hâkim kılmaya götürüyorsa, bu atâ nimettir."], [784.0, "Ama seni Rabbinin muradından çıkarıyor, seni O'ndan uzaklaştırıp nefsinin muradına götürüyorsa, sen de onu şehvetlerini gerçekleştirmekte ve Rabbinin şeriatına aykırı muradına ulaşmakta kullanıyorsan, vallahi bu, senin aleyhine olan en büyük nikmetlerdendir."]]}, {"reader": false, "ar": [[803.0, "ولذلك يقول الله عز وجل عن موسى:"], [806.0, "<span class=\"ayah\">﴿قَالَ رَبِّ بِمَا أَنْعَمْتَ عَلَيَّ فَلَنْ أَكُونَ ظَهِيرًا لِّلْمُجْرِمِينَ﴾<\/span> <span class=\"ref\">[القصص: ١٧]<\/span>،"], [812.0, "أي: بسبب عظيم نعمتك عليّ سأسخّرها فيما يُرضيك،"], [816.8, "ولن أستغلّها في شيءٍ من الإجرام أو الإعانة على شيءٍ من ذلك."]], "tr": [[803.0, "Bu yüzden Allah Azze ve Celle Mûsâ hakkında şöyle buyurur:"], [806.0, "<span class=\"ayah\">﴿Dedi ki: Rabbim! Bana verdiğin nimete andolsun ki artık suçlulara asla arka çıkmayacağım﴾<\/span> [Kasas 17]."], [813.8, "Yani: Bana olan büyük nimetin sebebiyle onu seni razı edecek şeylere tahsis edeceğim;"], [819.8, "onu hiçbir suçta ya da suça yardımda kullanmayacağım."]]}, {"reader": false, "ar": [[824.0, "وقال الله عز وجل:"], [826.8, "<span class=\"ayah\">﴿كَلَّا إِنَّ الْإِنسَانَ لَيَطْغَىٰ ۝ أَن رَّآهُ اسْتَغْنَىٰ﴾<\/span> <span class=\"ref\">[العلق: ٦–٧]<\/span>،"], [833.0, "فلم يزده عطاءُ الاستغناء إلا طغيانًا والعياذ بالله؛"], [838.0, "فأخرجه عطاءُ الاستغناء بالصحة والمال والولد والمنصب والوظيفة عن مراد ربه إلى مراد نفسه."]], "tr": [[824.0, "Allah Azze ve Celle şöyle buyurdu:"], [826.8, "<span class=\"ayah\">﴿Hayır! Gerçekten insan, kendini müstağni (ihtiyaçsız) gördüğü için azar﴾<\/span> [Alak 6-7]."], [833.6, "Müstağni olma atâsı ona azgınlıktan başka bir şey katmadı —Allah'a sığınırız—."], [839.5, "Sağlık, mal, evlat, makam ve iş ile gelen müstağnilik atâsı onu Rabbinin muradından nefsinin muradına çıkardı."]]}, {"reader": false, "ar": [[849.0, "وكذلك الله عز وجل يقول:"], [852.0, "<span class=\"ayah\">﴿وَمِنْهُم مَّنْ عَاهَدَ اللَّهَ لَئِنْ آتَانَا مِن فَضْلِهِ لَنَصَّدَّقَنَّ وَلَنَكُونَنَّ مِنَ الصَّالِحِينَ ۝ فَلَمَّا آتَاهُم مِّن فَضْلِهِ بَخِلُوا بِهِ وَتَوَلَّوا وَّهُم مُّعْرِضُونَ﴾<\/span>،"], [871.0, "فصارت عقوبتُهم: <span class=\"ayah\">﴿فَأَعْقَبَهُمْ نِفَاقًا فِي قُلُوبِهِمْ إِلَىٰ يَوْمِ يَلْقَوْنَهُ بِمَا أَخْلَفُوا اللَّهَ مَا وَعَدُوهُ وَبِمَا كَانُوا يَكْذِبُونَ﴾<\/span> <span class=\"ref\">[التوبة: ٧٥–٧٧]<\/span>."], [884.0, "فلم يزدهم عطاءُ الله عز وجل إلا بُعدًا عن مراد الله عز وجل."]], "tr": [[849.0, "Aynı şekilde Allah Azze ve Celle şöyle buyurur:"], [852.0, "<span class=\"ayah\">﴿Onlardan kimi de: Andolsun, eğer Allah bize lütfundan verirse mutlaka sadaka vereceğiz ve mutlaka salihlerden olacağız, diye Allah'a söz verdi. Allah onlara lütfundan verince onda cimrilik ettiler ve yüz çevirerek döndüler﴾<\/span>."], [871.0, "Onların cezası da şu oldu:"], [873.8, "<span class=\"ayah\">﴿Allah'a verdikleri sözden caydıkları ve yalan söyledikleri için Allah da bunun ardından, kendisine kavuşacakları güne kadar kalplerine nifak yerleştirdi﴾<\/span> [Tevbe 75-77]."], [884.4, "Allah Azze ve Celle'nin atâsı onlara, Allah Azze ve Celle'nin muradından uzaklaşmaktan başka bir şey katmadı."]]}, {"reader": false, "ar": [[889.0, "وكذلك يقول الله عز وجل:"], [893.0, "<span class=\"ayah\">﴿وَإِن تَعُدُّوا نِعْمَتَ اللَّهِ لَا تُحْصُوهَا﴾<\/span>،"], [895.6, "ثم ختمها بشيءٍ عظيمٍ يجب أن نقف عنده:"], [899.0, "<span class=\"ayah\">﴿إِنَّ الْإِنسَانَ لَظَلُومٌ كَفَّارٌ﴾<\/span> <span class=\"ref\">[إبراهيم: ٣٤]<\/span>،"], [902.0, "وهو يتكلّم عن هؤلاء الذين لا تُعَدّ نعمُ الله عليهم،"], [907.6, "ثم لم يستغلّوها إلا في الظلم والفجور والكفر والطغيان والبعد عن منهج الله عز وجل."], [916.0, "فيا ويلَهم من الله!"]], "tr": [[889.0, "Aynı şekilde Allah Azze ve Celle şöyle buyurur:"], [893.9, "<span class=\"ayah\">﴿Allah'ın nimetini saymaya kalksanız onu sayamazsınız﴾<\/span>;"], [896.0, "sonra (ayeti) üzerinde durmamız gereken büyük bir şeyle bitirdi:"], [899.8, "<span class=\"ayah\">﴿Şüphesiz insan çok zalim, çok nankördür﴾<\/span> [İbrâhîm 34]."], [904.2, "Burada, Allah'ın nimetleri sayılamayacak kadar çok olduğu hâlde onları ancak zulümde, fücurda, küfürde, azgınlıkta ve Allah Azze ve Celle'nin yolundan uzaklaşmakta kullanan kimselerden bahsediyor. Allah'tan onlara yazıklar olsun!"]]}]}, {"ts": "15:17", "title": "2. Külliye (devam): Bel'am, emin kasaba, Firavun; \"Verdiğimiz rızıklarda azmayın\"", "paras": [{"reader": false, "ar": [[917.0, "وكذلك يقول الله عز وجل:"], [920.1, "<span class=\"ayah\">﴿وَاتْلُ عَلَيْهِمْ﴾<\/span> ـ وهذا في عطاءات الألوهية ـ <span class=\"ayah\">﴿وَاتْلُ عَلَيْهِمْ نَبَأَ الَّذِي آتَيْنَاهُ آيَاتِنَا فَانسَلَخَ مِنْهَا فَأَتْبَعَهُ الشَّيْطَانُ فَكَانَ مِنَ الْغَاوِينَ ۝ وَلَوْ شِئْنَا لَرَفَعْنَاهُ بِهَا وَلَٰكِنَّهُ أَخْلَدَ إِلَى الْأَرْضِ وَاتَّبَعَ هَوَاهُ ۚ فَمَثَلُهُ كَمَثَلِ الْكَلْبِ﴾<\/span> ـ أعوذ بالله ـ <span class=\"ayah\">﴿إِن تَحْمِلْ عَلَيْهِ يَلْهَثْ أَوْ تَتْرُكْهُ يَلْهَث﴾<\/span> <span class=\"ref\">[الأعراف: ١٧٥–١٧٦]<\/span>."]], "tr": [[917.0, "Aynı şekilde Allah Azze ve Celle şöyle buyurur:"], [920.1, "<span class=\"ayah\">﴿Onlara oku﴾<\/span> —bu, ulûhiyyet atâları hakkındadır— <span class=\"ayah\">﴿Onlara, kendisine ayetlerimizi verdiğimiz hâlde onlardan sıyrılıp çıkan, bunun üzerine şeytanın kendisini peşine taktığı ve böylece azgınlardan olan kimsenin haberini oku. Dileseydik onu o ayetlerle yükseltirdik; fakat o yere (dünyaya) saplandı ve hevâsına uydu. Onun durumu köpeğin durumu gibidir﴾<\/span> —Allah'a sığınırım— <span class=\"ayah\">﴿üzerine varsan da dilini sarkıtıp solur, kendi hâline bıraksan da dilini sarkıtıp solur﴾<\/span> [A'râf 175-176]."]]}, {"reader": false, "ar": [[949.0, "فهذا رجلٌ يقصّ الله عز وجل علينا قصتَه:"], [954.0, "أنّ الله قد فتح عليه من عطاءات ألوهيته ما شاء الله أن يفتحه عليه،"], [958.0, "ولكنه انسلخ منها، ومن مقتضاها،"], [960.5, "والواجبِ عليه فيها، وسخّرها في معصية الله عز وجل،"], [966.0, "وسخّرها فيما لا يُرضيه."]], "tr": [[949.0, "Bu, Allah Azze ve Celle'nin bize kıssasını anlattığı bir adamdır:"], [954.4, "Allah ona ulûhiyyet atâlarından açmayı dilediği kadarını açmıştı;"], [957.2, "fakat o, onlardan, onların gereğinden ve onlar hususunda üzerine düşen vazifeden sıyrıldı;"], [961.0, "onları Allah Azze ve Celle'ye isyanda ve O'nu razı etmeyen şeylerde kullandı."]]}, {"reader": false, "ar": [[969.0, "ولذلك يقول الله عز وجل:"], [975.0, "<span class=\"ayah\">﴿وَضَرَبَ اللَّهُ مَثَلًا قَرْيَةً كَانَتْ آمِنَةً مُّطْمَئِنَّةً يَأْتِيهَا رِزْقُهَا رَغَدًا مِّن كُلِّ مَكَانٍ﴾<\/span>."], [984.0, "طيب، ماذا فعلوا؟ خرجوا عن مراد ربهم إلى مراد أنفسهم بهذه العطاءات العظيمة:"], [992.0, "<span class=\"ayah\">﴿وَضَرَبَ اللَّهُ مَثَلًا قَرْيَةً كَانَتْ آمِنَةً مُّطْمَئِنَّةً يَأْتِيهَا رِزْقُهَا رَغَدًا مِّن كُلِّ مَكَانٍ فَكَفَرَتْ بِأَنْعُمِ اللَّهِ فَأَذَاقَهَا اللَّهُ لِبَاسَ الْجُوعِ وَالْخَوْفِ بِمَا كَانُوا يَصْنَعُونَ﴾<\/span> <span class=\"ref\">[النحل: ١١٢]<\/span>."]], "tr": [[969.0, "Bu yüzden Allah Azze ve Celle şöyle buyurur:"], [975.5, "<span class=\"ayah\">﴿Allah, güven ve huzur içinde olan, rızkı her yerden bol bol gelen bir kasabayı misal verdi﴾<\/span>."], [984.0, "Peki, ne yaptılar? Bu büyük atâlarla Rablerinin muradından çıkıp kendi nefislerinin muradına gittiler:"], [989.0, "<span class=\"ayah\">﴿Allah, güven ve huzur içinde olan, rızkı her yerden bol bol gelen bir kasabayı misal verdi. Fakat (halkı) Allah'ın nimetlerine nankörlük etti; Allah da yaptıkları yüzünden onlara açlık ve korku elbisesini tattırdı﴾<\/span> [Nahl 112]."]]}, {"reader": false, "ar": [[1004.0, "ولقد حكى الله عز وجل عن فرعون أنّ الله عز وجل قد آتاه مُلكَ مصر،"], [1010.0, "وأعطاه العرشَ العظيم والملكَ الكُبّار،"], [1013.0, "واغترّ بملكه، وصار سببًا لكفره بالله عز وجل،"], [1019.0, "بل تغطرس وقال: <span class=\"ayah\">﴿مَا عَلِمْتُ لَكُم مِّنْ إِلَٰهٍ غَيْرِي فَأَوْقِدْ لِي يَا هَامَانُ عَلَى الطِّينِ ... لَّعَلِّي أَطَّلِعُ إِلَىٰ إِلَٰهِ مُوسَىٰ﴾<\/span> <span class=\"ref\">[القصص: ٣٨]<\/span>، <span class=\"ayah\">﴿وَإِنِّي لَأَظُنُّهُ كَاذِبًا﴾<\/span> <span class=\"ref\">[غافر: ٣٧]<\/span> <span class=\"note\">(Şeyh Kasas 38'i «فاجعل لي صرحا» kısmını atlayarak okuyor ve Gâfir 37'nin sonuyla bitiriyor)<\/span>."]], "tr": [[1004.0, "Allah Azze ve Celle Firavun'dan şunu anlatmıştır:"], [1005.6, "Allah Azze ve Celle ona Mısır mülkünü vermiş, ona büyük bir taht ve çok büyük bir mülk vermişti."], [1011.2, "O ise mülküyle aldandı; (mülkü) onun Allah Azze ve Celle'yi inkâr etmesine sebep oldu."], [1017.4, "Hatta kibirlenip şöyle dedi: <span class=\"ayah\">﴿Sizin için benden başka bir ilah tanımıyorum. Ey Hâmân! Benim için çamur üzerinde ateş yak (tuğla pişir) ... belki Mûsâ'nın ilahına çıkarım﴾<\/span> [Kasas 38], <span class=\"ayah\">﴿Doğrusu ben onu yalancı sanıyorum﴾<\/span> [Gâfir 37]."]]}, {"reader": false, "ar": [[1030.0, "ما الذي غرّه؟ <span class=\"ayah\">﴿أَلَيْسَ لِي مُلْكُ مِصْرَ وَهَٰذِهِ الْأَنْهَارُ تَجْرِي مِن تَحْتِي ۖ أَفَلَا تُبْصِرُونَ﴾<\/span> <span class=\"ref\">[الزخرف: ٥١]<\/span>."], [1037.0, "فلم يزده عطاءُ الله عز وجل إلا كفرًا وبُعدًا عنه تبارك وتعالى."]], "tr": [[1030.0, "Onu aldatan neydi? <span class=\"ayah\">﴿Mısır mülkü benim değil mi? Şu nehirler de altımdan akıp gidiyor. Hâlâ görmüyor musunuz?﴾<\/span> [Zuhruf 51]."], [1036.4, "Allah Azze ve Celle'nin atâsı ona, küfürden ve O Tebâreke ve Teâlâ'dan uzaklaşmaktan başka bir şey katmadı."]]}, {"reader": false, "ar": [[1045.0, "واستمعوا معي قولَ الله عز وجل:"], [1047.0, "<span class=\"ayah\">﴿كُلُوا مِن طَيِّبَاتِ مَا رَزَقْنَاكُمْ﴾<\/span> ـ انتبهوا ـ <span class=\"ayah\">﴿وَلَا تَطْغَوْا فِيهِ﴾<\/span>،"], [1054.0, "أي: لا تجعلوه سببًا للطغيان."], [1057.0, "فإنّ واجبَ النعم الشكر،"], [1060.0, "أمّا أن تكون سببًا لطغيانك وبُعدك عن الله عز وجل، فيا ويلك!"]], "tr": [[1045.0, "Allah Azze ve Celle'nin şu sözünü benimle birlikte dinleyin:"], [1047.6, "<span class=\"ayah\">﴿Size verdiğimiz rızıkların temiz olanlarından yiyin﴾<\/span> —dikkat edin— <span class=\"ayah\">﴿ve bunda azgınlık etmeyin﴾<\/span>;"], [1055.2, "yani onu azgınlığa sebep kılmayın."], [1057.8, "Çünkü nimetlerin gereği şükürdür. (Nimetler) senin azgınlığına ve Allah Azze ve Celle'den uzaklaşmana sebep olursa, vay hâline!"]]}, {"reader": false, "ar": [[1067.0, "فإذا أردتَ أن تعرف الميزانَ الذي به تعرف أنّ عطاءَ الله لك أو عليك،"], [1072.0, "فانظر إلى فعلك فيه:"], [1075.0, "فإن كان عطاءً يُخرجك عن مرادك إلى مراد ربك فيه فاعلم أنه نعمة،"], [1082.0, "وإن كان من العطاء الذي يُخرجك عن مراد ربك فيه إلى مرادك أنت فيه فاعلم أنه نقمة،"], [1093.4, "والعياذ بالله. <span class=\"ayah\">﴿كُلُوا مِن طَيِّبَاتِ مَا رَزَقْنَاكُمْ وَلَا تَطْغَوْا فِيهِ فَيَحِلَّ عَلَيْكُمْ غَضَبِي ۖ وَمَن يَحْلِلْ عَلَيْهِ غَضَبِي فَقَدْ هَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٨١]<\/span>."]], "tr": [[1067.0, "Allah'ın atâsının lehine mi aleyhine mi olduğunu bileceğin ölçüyü öğrenmek istersen, onunla ne yaptığına bak:"], [1071.6, "Eğer seni kendi muradından çıkarıp onda Rabbinin muradına götüren bir atâ ise bil ki o nimettir."], [1080.0, "Eğer seni onda Rabbinin muradından çıkarıp kendi muradına götüren atâlardan ise bil ki o nikmettir —Allah'a sığınırız—."], [1090.2, "<span class=\"ayah\">﴿Size verdiğimiz rızıkların temiz olanlarından yiyin ve bunda azgınlık etmeyin; yoksa gazabım üzerinize iner. Kimin üzerine de gazabım inerse, o muhakkak helâk olmuştur﴾<\/span> [Tâhâ 81]."]]}]}, {"ts": "18:25", "title": "3. Külliye: Organlarını dinî faydalarından alıkoyan, onları kaybetmiş gibidir", "paras": [{"reader": false, "ar": [[1105.0, "ومن الكلّيّات أيضًا: <b>كلُّ من عطّل جوارحَه عن منافعها الدينية فكالفاقد لها.<\/b> ـ هذه الكلّيّات في العطاءات ـ كلُّ من عطّل جوارحه عن منافعها الدينية فكالفاقد لها،"], [1133.0, "أو: فبمنزلة الفاقد لها،"], [1135.0, "عبِّر عنها بما تشاء."], [1137.0, "كلُّ من عطّل جوارحه عن منافعها الدينية فبمنزلة الفاقد لها."]], "tr": [[1105.0, "Külliyelerden biri de şudur: 3."], [1111.7, "külliye: Organlarını dinî faydalarından alıkoyan (işlevsiz bırakan) herkes, onları kaybetmiş gibidir. —Bu külliyeler atâlar hakkındadır.— Organlarını dinî faydalarından alıkoyan herkes onları kaybetmiş gibidir;"], [1133.0, "ya da: onları kaybetmiş kimse yerindedir;"], [1135.5, "bunu dilediğin gibi ifade et."], [1137.7, "Organlarını dinî faydalarından alıkoyan herkes, onları kaybetmiş kimse yerindedir."]]}, {"reader": false, "ar": [[1149.0, "وذلك لأنّ الله عز وجل امتنّ علينا بهذه الجوارح،"], [1154.0, "وجعل لها فائدتين: فائدةً تُعيننا على تحصيل أمور دنيانا،"], [1160.0, "وفائدةً تُعيننا على تحصيل أمور ديننا."], [1163.0, "فإذا كان الإنسان لا يستغلّها إلا في أمر الدنيا فقط،"], [1169.0, "وعطّل عنها وظائفَها الدينية،"], [1173.0, "فهو بمنزلة الفاقد لها في نصوص الوحيين."]], "tr": [[1149.0, "Bunun sebebi şudur: Allah Azze ve Celle bu organları bize bir lütuf olarak vermiş ve onlara iki fayda yüklemiştir:"], [1157.3, "Dünya işlerimizi elde etmemize yardım eden bir fayda ve din işlerimizi elde etmemize yardım eden bir fayda."], [1164.8, "İnsan onları sadece dünya işinde kullanır, onların dinî vazifelerini işlevsiz bırakırsa, iki vahyin (Kitap ve Sünnet'in) nasslarında o, onları kaybetmiş kimse yerindedir."]]}, {"reader": false, "ar": [[1176.0, "كما قال الله عز وجل منكرًا على الكفار:"], [1181.1, "<span class=\"ayah\">﴿أَلَمْ نَجْعَل لَّهُ عَيْنَيْنِ ۝ وَلِسَانًا وَشَفَتَيْنِ﴾<\/span> <span class=\"ref\">[البلد: ٨–٩]<\/span>،"], [1186.0, "يعني بمعنى أنه لم يستغلّ ما أعطيناه من العينين،"], [1190.5, "ومن اللسان والشفتين، فيما يُرضي الله عز وجل."]], "tr": [[1176.0, "Nitekim Allah Azze ve Celle kâfirleri kınayarak şöyle buyurmuştur:"], [1180.4, "<span class=\"ayah\">﴿Biz ona iki göz, bir dil ve iki dudak vermedik mi?﴾<\/span> [Beled 8-9]."], [1187.5, "Yani ona verdiğimiz iki gözü, dili ve iki dudağı Allah Azze ve Celle'yi razı eden şeylerde kullanmadı."]]}, {"reader": false, "ar": [[1195.0, "وقال الله عز وجل:"], [1197.0, "<span class=\"ayah\">﴿وَاللَّهُ أَخْرَجَكُم مِّن بُطُونِ أُمَّهَاتِكُمْ لَا تَعْلَمُونَ شَيْئًا وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ ۙ لَعَلَّكُمْ تَشْكُرُونَ﴾<\/span> <span class=\"ref\">[النحل: ٧٨]<\/span>."], [1207.0, "وقال الله عز وجل:"], [1209.6, "<span class=\"ayah\">﴿إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا﴾<\/span> <span class=\"ref\">[الإسراء: ٣٦]<\/span>،"], [1215.5, "أن يُسأل عن وظائفه الدينية."]], "tr": [[1195.0, "Allah Azze ve Celle şöyle buyurdu:"], [1197.0, "<span class=\"ayah\">﴿Allah sizi annelerinizin karınlarından hiçbir şey bilmezken çıkardı; şükredesiniz diye size kulaklar, gözler ve gönüller verdi﴾<\/span> [Nahl 78]."], [1207.0, "Allah Azze ve Celle şöyle buyurdu:"], [1210.3, "<span class=\"ayah\">﴿Şüphesiz kulak, göz ve gönül, bunların hepsi ondan sorumludur﴾<\/span> [İsrâ 36]; yani dinî vazifelerinden sorulacaktır."]]}]}, {"ts": "20:20", "title": "3. Külliye (devam): Kalpleri olup anlamayanlar; sağır, dilsiz ve kör olarak haşredilmeleri", "paras": [{"reader": false, "ar": [[1220.0, "وقال الله عز وجل:"], [1222.7, "<span class=\"ayah\">﴿وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيرًا مِّنَ الْجِنِّ وَالْإِنسِ ۖ لَهُمْ قُلُوبٌ لَّا يَفْقَهُونَ بِهَا وَلَهُمْ أَعْيُنٌ لَّا يُبْصِرُونَ بِهَا وَلَهُمْ آذَانٌ لَّا يَسْمَعُونَ بِهَا ۚ أُولَٰئِكَ كَالْأَنْعَامِ بَلْ هُمْ أَضَلُّ ۚ أُولَٰئِكَ هُمُ الْغَافِلُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٧٩]<\/span>."], [1247.0, "فأنزلهم الله عز وجل بمنزلة الأنعام لمّا عطّلوا هذه الجوارحَ والنعمَ عن وظائفها... عن وظائفها الدينية."]], "tr": [[1220.0, "Allah Azze ve Celle şöyle buyurdu:"], [1223.4, "<span class=\"ayah\">﴿Andolsun, cinlerden ve insanlardan birçoğunu cehennem için yarattık. Onların kalpleri vardır, onlarla anlamazlar; gözleri vardır, onlarla görmezler; kulakları vardır, onlarla işitmezler. Onlar hayvanlar gibidir, hatta daha da şaşkındırlar. İşte onlar gafillerin ta kendileridir﴾<\/span> [A'râf 179]."], [1247.5, "Bu organları ve nimetleri vazifelerinden, dinî vazifelerinden alıkoyunca Allah Azze ve Celle onları hayvanlar yerine koydu."]]}, {"reader": false, "ar": [[1259.0, "ولذلك يحشر الله عز وجل الكفارَ يومَ القيامة..."], [1263.8, "إيش؟ أيوه <span class=\"q\">؟ 20:59<\/span>: <span class=\"ayah\">﴿عُمْيًا وَبُكْمًا وَصُمًّا﴾<\/span> <span class=\"ref\">[الإسراء: ٩٧]<\/span>،"], [1269.0, "كما قال الله عز وجل:"], [1270.0, "<span class=\"ayah\">﴿صُمٌّ بُكْمٌ عُمْيٌ فَهُمْ لَا يَرْجِعُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٨]<\/span>."]], "tr": [[1259.0, "Bu yüzden Allah Azze ve Celle kâfirleri kıyamet günü..."], [1263.0, "ne olarak? Evet <span class=\"q\">؟<\/span>: <span class=\"ayah\">﴿kör, dilsiz ve sağır olarak﴾<\/span> haşredecektir [İsrâ 97]."], [1269.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1269.8, "<span class=\"ayah\">﴿Onlar sağırdır, dilsizdir, kördür; artık onlar (hakka) dönmezler﴾<\/span> [Bakara 18]."]]}, {"reader": false, "ar": [[1275.0, "وقال الله عز وجل:"], [1277.0, "<span class=\"ayah\">﴿أَلَهُمْ أَرْجُلٌ يَمْشُونَ بِهَا ۖ أَمْ لَهُمْ أَيْدٍ يَبْطِشُونَ بِهَا ۖ أَمْ لَهُمْ أَعْيُنٌ يُبْصِرُونَ بِهَا ۖ أَمْ لَهُمْ آذَانٌ يَسْمَعُونَ بِهَا ۗ قُلِ ادْعُوا شُرَكَاءَكُمْ ثُمَّ كِيدُونِ فَلَا تُنظِرُونِ﴾<\/span> <span class=\"ref\">[الأعراف: ١٩٥]<\/span>."], [1296.0, "فعاب الله عز وجل عليهم هذه الجوارحَ لأنها لم تكن مُعينةً لهم على تحصيل مراد الله الشرعي منها."]], "tr": [[1275.0, "Allah Azze ve Celle şöyle buyurdu:"], [1277.0, "<span class=\"ayah\">﴿Onların yürüyecekleri ayakları mı var? Yoksa tutacakları elleri mi var? Yoksa görecekleri gözleri mi var? Yoksa işitecekleri kulakları mı var? De ki: Ortaklarınızı çağırın, sonra bana tuzak kurun, bana göz de açtırmayın!﴾<\/span> [A'râf 195]."], [1297.1, "Allah Azze ve Celle bu organları onlara ayıpladı;"], [1300.4, "çünkü onlar, Allah'ın onlardan istediği şer'î muradı elde etmelerinde kendilerine yardımcı olmadı."]]}, {"reader": false, "ar": [[1304.0, "ولذلك تجدون أنّ الله عز وجل يختم آياتٍ كثيرةً بقوله:"], [1310.0, "«لا يعقلون»، مع أنه يخاطب أناسًا فيهم عقل،"], [1315.0, "لكن لمّا لم يستغلّوا عقولهم في منفعتها الدينية أنزلهم منزلةَ من لا يعقل."], [1322.0, "كذلك قوله عز وجل:"], [1324.7, "«لا يسمعون»، مع أنّ الله خلق لهم آذانًا وسمعًا،"], [1329.0, "ولكن لمّا عطّلوا أسماعَهم عن وظائفها الدينية أنزلهم منزلةَ من لا يسمع."]], "tr": [[1304.0, "Bu yüzden Allah Azze ve Celle'nin birçok ayeti \"akletmezler\" sözüyle bitirdiğini görürsünüz."], [1312.0, "Oysa aklı olan insanlara hitap etmektedir;"], [1315.5, "fakat akıllarını dinî faydalarında kullanmayınca onları akletmeyen kimse yerine koymuştur."], [1320.8, "Aynı şekilde Allah Azze ve Celle'nin \"işitmezler\" sözü:"], [1326.4, "Oysa Allah onlara kulaklar ve işitme yaratmıştır;"], [1329.6, "fakat işitmelerini dinî vazifelerinden alıkoyunca onları işitmeyen kimse yerine koymuştur."]]}, {"reader": false, "ar": [[1336.0, "«لا يبصرون»، مع أنّ الله خلق لهم أعينًا وبصرًا،"], [1342.0, "لكن لمّا عطّلوا هذا السمعَ والبصرَ عن وظيفته الدينية أنزلهم الله منزلةَ من لا يُبصر،"], [1350.0, "كما قال الله عز وجل:"], [1353.3, "<span class=\"ayah\">﴿أَفَأَنتَ تُسْمِعُ الصُّمَّ أَوْ تَهْدِي الْعُمْيَ وَمَن كَانَ فِي ضَلَالٍ مُّبِينٍ﴾<\/span> <span class=\"ref\">[الزخرف: ٤٠]<\/span>،"], [1361.0, "مع أنه يخاطب أناسًا يسمعون ويبصرون،"], [1365.0, "لكن لمّا عطّلوا جوارحهم عن الواجب فيها شرعًا ـ أو عن منافعها الدينية ـ أنزلهم الله عز وجل منزلةَ من لا يسمع ولا يُبصر."]], "tr": [[1336.0, "\"Görmezler\": Oysa Allah onlara gözler ve görme yaratmıştır;"], [1340.9, "fakat bu işitmeyi ve görmeyi dinî vazifesinden alıkoyunca Allah onları görmeyen kimse yerine koymuştur."], [1347.5, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1350.7, "<span class=\"ayah\">﴿Sağırlara sen mi işittireceksin? Yahut körleri ve apaçık bir sapıklık içinde olanları sen mi doğru yola ileteceksin?﴾<\/span> [Zuhruf 40]."], [1362.3, "Oysa işiten ve gören insanlara hitap etmektedir;"], [1366.0, "fakat organlarını onlarda şer'an vacip olandan —ya da dinî faydalarından— alıkoyunca Allah Azze ve Celle onları işitmeyen ve görmeyen kimse yerine koymuştur."]]}, {"reader": false, "ar": [[1375.0, "ويقول الله عز وجل:"], [1377.9, "<span class=\"ayah\">﴿وَمِنْهُم مَّن يَسْتَمِعُونَ إِلَيْكَ ۚ أَفَأَنتَ تُسْمِعُ الصُّمَّ وَلَوْ كَانُوا لَا يَعْقِلُونَ ۝ وَمِنْهُم مَّن يَنظُرُ إِلَيْكَ ۚ أَفَأَنتَ تَهْدِي الْعُمْيَ وَلَوْ كَانُوا لَا يُبْصِرُونَ ۝ إِنَّ اللَّهَ لَا يَظْلِمُ النَّاسَ شَيْئًا وَلَٰكِنَّ النَّاسَ أَنفُسَهُمْ يَظْلِمُونَ﴾<\/span> <span class=\"ref\">[يونس: ٤٢–٤٤]<\/span>."]], "tr": [[1375.0, "Allah Azze ve Celle şöyle buyurur:"], [1378.6, "<span class=\"ayah\">﴿Onlardan seni dinleyenler vardır. Akılları ermese de sağırlara sen mi işittireceksin? Onlardan sana bakanlar da vardır. Görmeseler de körleri sen mi doğru yola ileteceksin? Şüphesiz Allah insanlara hiçbir şekilde zulmetmez; fakat insanlar kendilerine zulmederler﴾<\/span> [Yûnus 42-44]."]]}, {"reader": false, "ar": [[1398.0, "وقال الله عز وجل:"], [1401.0, "<span class=\"ayah\">﴿أَفَلَمْ يَسِيرُوا فِي الْأَرْضِ فَتَكُونَ لَهُمْ قُلُوبٌ يَعْقِلُونَ بِهَا أَوْ آذَانٌ يَسْمَعُونَ بِهَا ۖ فَإِنَّهَا لَا تَعْمَى الْأَبْصَارُ وَلَٰكِن تَعْمَى الْقُلُوبُ الَّتِي فِي الصُّدُورِ﴾<\/span> <span class=\"ref\">[الحج: ٤٦]<\/span>."]], "tr": [[1398.0, "Allah Azze ve Celle şöyle buyurdu:"], [1401.8, "<span class=\"ayah\">﴿Yeryüzünde gezip dolaşmadılar mı ki onların düşünen kalpleri, işiten kulakları olsun? Çünkü gerçekte gözler kör olmaz; fakat göğüslerdeki kalpler kör olur﴾<\/span> [Hac 46]."]]}, {"reader": false, "ar": [[1417.0, "فبما أنّ الله قد امتنّ علينا بهذه الجوارح الظاهرة والباطنة،"], [1423.0, "فالواجب علينا أن نحرص على توظيفها وعلى إشغالها بتلك الوظائف الدينية،"], [1430.0, "حتى إذا أنطقها الله يوم القيامة تكون شهادتُها لنا لا علينا؛"], [1437.0, "وإلا فإنّ الله مُستنطقُها لا محالة،"], [1440.0, "كما قال الله عز وجل:"], [1443.4, "<span class=\"ayah\">﴿يَوْمَ تَشْهَدُ عَلَيْهِمْ أَلْسِنَتُهُمْ وَأَيْدِيهِمْ وَأَرْجُلُهُم بِمَا كَانُوا يَعْمَلُونَ ۝ يَوْمَئِذٍ يُوَفِّيهِمُ اللَّهُ دِينَهُمُ الْحَقَّ وَيَعْلَمُونَ أَنَّ اللَّهَ هُوَ الْحَقُّ الْمُبِينُ﴾<\/span> <span class=\"ref\">[النور: ٢٤–٢٥]<\/span>."]], "tr": [[1417.0, "Madem ki Allah bu zahirî ve bâtınî organları bize lütfetmiştir, bize düşen onları görevlendirmeye ve o dinî vazifelerle meşgul etmeye özen göstermektir."], [1426.8, "Ta ki Allah kıyamet günü onları konuşturduğunda şahitlikleri aleyhimize değil lehimize olsun."], [1433.8, "Yoksa Allah onları mutlaka konuşturacaktır."], [1436.4, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1439.5, "<span class=\"ayah\">﴿O gün dilleri, elleri ve ayakları, yapmakta olduklarına dair aleyhlerine şahitlik edecek. O gün Allah onlara hak ettikleri cezayı tam olarak verecek ve Allah'ın apaçık hakkın ta kendisi olduğunu bilecekler﴾<\/span> [Nûr 24-25]."]]}, {"reader": false, "ar": [[1459.0, "وكلُّ آيةٍ فيها سؤالُ الجارحة فإنما هو سؤالٌ عن منفعتها الدينية لا الدنيوية؛"], [1472.0, "عن منفعتها الدينية لا الدنيوية. والله أعلم."]], "tr": [[1459.0, "Organın sorguya çekilmesinden bahseden her ayette, bu sorgu ancak onun dünyevî değil dinî faydası hakkındadır;"], [1470.1, "dünyevî değil dinî faydası hakkındadır. Allah en iyisini bilir."]]}]}, {"ts": "24:37", "title": "4. Külliye: Hâlık ile mahlûkun mübâyenetine dayanmayan her tevhid bâtıl ve fâsiddir", "paras": [{"reader": false, "ar": [[1477.0, "ومن الكلّيّات أيضًا: <b>كلُّ توحيدٍ لا يقوم على مباينة الخالق للمخلوق فباطلٌ فاسد.<\/b> كلُّ توحيدٍ لا يقوم على مباينة الخالق للمخلوق فباطلٌ فاسد."], [1503.0, "ـ واحدةٌ منها تكفي، ولكن من باب تقبيحه نزيدها ـ كلُّ توحيدٍ لا يقوم على مباينة الخالق للمخلوق فباطلٌ فاسد."], [1515.0, "أُعيدها مرةً ثالثة: كلُّ توحيدٍ لا يقوم على مباينة الخالق للمخلوق فباطلٌ فاسد."]], "tr": [[1477.0, "Külliyelerden biri de şudur: 4."], [1479.7, "külliye: Hâlık'ın mahlûktan mübâyenetine (ayrı ve farklı oluşuna) dayanmayan her tevhid bâtıl ve fâsiddir. Hâlık'ın mahlûktan mübâyenetine dayanmayan her tevhid bâtıl ve fâsiddir."], [1504.9, "—Biri yeterdi; fakat onun çirkinliğini göstermek için artırıyoruz.— Hâlık'ın mahlûktan mübâyenetine dayanmayan her tevhid bâtıl ve fâsiddir."], [1515.0, "Üçüncü kez tekrar ediyorum: Hâlık'ın mahlûktan mübâyenetine dayanmayan her tevhid bâtıl ve fâsiddir."]]}, {"reader": false, "ar": [[1525.0, "فإن قلتَ: مباينتُه في ماذا؟"], [1528.0, "فأقول: في الذات والصفات."], [1532.0, "فأصلُ أصول التوحيد هو وجوبُ مباينة الخالق للمخلوق في هذين الأمرين:"], [1539.0, "في الذات والصفات. ومن أعظم سُبل بطلان التوحيد وفساده،"], [1545.1, "وحصول الشرك في بني آدم،"], [1549.0, "هو اعتقادُ حلول شيءٍ من ذات الله في ذوات الخلق،"], [1556.0, "أو حلولِ شيءٍ من ذوات الخلق في ذاته،"], [1562.0, "أو إضفاءُ شيءٍ من خصائص أسمائه وصفاته على المخلوق،"], [1570.0, "وأنّ المخلوق مستحقٌّ هذا الشيء كاستحقاق الله عز وجل له."]], "tr": [[1525.0, "Eğer \"Neyde mübâyenet?\" dersen, derim ki:"], [1527.4, "Zatta ve sıfatlarda. Tevhidin asıllarının aslı, Hâlık'ın bu iki hususta, yani zatta ve sıfatlarda mahlûktan mübâyin (ayrı) olmasının vacip oluşudur."], [1539.7, "Tevhidin bâtıl ve fâsid olmasının ve Âdemoğullarında şirkin meydana gelmesinin en büyük yollarından biri şudur:"], [1547.9, "Allah'ın zatından bir şeyin mahlûkatın zatlarına hulûl ettiğine, ya da mahlûkatın zatlarından bir şeyin O'nun zatına hulûl ettiğine inanmak;"], [1559.6, "ya da O'nun isim ve sıfatlarının hususiyetlerinden bir şeyi mahlûka giydirmek ve mahlûkun o şeye Allah Azze ve Celle'nin hak ettiği gibi hak sahibi olduğuna inanmak."]]}, {"reader": false, "ar": [[1575.0, "فمتى ما حصل هذا الخللُ العظيم في التوحيد بطل التوحيدُ بكل أنواعه؛"], [1582.0, "فلا يستقيم توحيدُ الربوبية إلا باعتقاد هذه المباينة بين الخالق والمخلوق،"], [1589.0, "ولا يستقيم توحيدُ الألوهية إلا باعتقاد هذه المباينة بين الخالق والمخلوق،"], [1595.0, "ولا يستقيم توحيدُ الأسماء والصفات إلا باعتقاد هذه المباينة بين الخالق والمخلوق."]], "tr": [[1575.0, "Tevhidde bu büyük bozukluk meydana geldiği zaman, tevhid bütün türleriyle bâtıl olur."], [1581.2, "Rubûbiyyet tevhidi, Hâlık ile mahlûk arasındaki bu mübâyenete inanmadan dosdoğru olmaz;"], [1588.4, "ulûhiyyet tevhidi, Hâlık ile mahlûk arasındaki bu mübâyenete inanmadan dosdoğru olmaz;"], [1593.9, "isim ve sıfatlar tevhidi de Hâlık ile mahlûk arasındaki bu mübâyenete inanmadan dosdoğru olmaz."]]}, {"reader": false, "ar": [[1602.0, "ولذلك فإنّ أصلَ أصول الشرك هو الغفلةُ عن هذه المباينة،"], [1611.0, "وإنّ من أعظم ما يحرص عليه إبليس هو إزالةُ هذه المباينة بين الخالق والمخلوق."], [1618.0, "فتجد أنّ شرك النصارى مبنيٌّ ـ على إيش؟"], [1621.0, "ـ على أنّ المخلوق قد حلّ في الخالق،"], [1624.3, "أو أنّ الخالق قد حلّ في المخلوق."], [1628.0, "وكذلك شركُ اليهود في قول الله عز وجل:"], [1632.3, "<span class=\"ayah\">﴿وَقَالَتِ الْيَهُودُ عُزَيْرٌ ابْنُ اللَّهِ﴾<\/span> <span class=\"ref\">[التوبة: ٣٠]<\/span>،"], [1635.0, "أي: أنّ شيئًا من ذات الله قد حلّ في هذا المخلوق."]], "tr": [[1602.0, "Bu yüzden şirkin asıllarının aslı, bu mübâyenetten gaflettir."], [1607.6, "İblis'in en çok hırs gösterdiği şeylerden biri de Hâlık ile mahlûk arasındaki bu mübâyeneti ortadan kaldırmaktır."], [1618.0, "Hristiyanların şirkinin —neye?— mahlûkun Hâlık'a hulûl ettiği ya da Hâlık'ın mahlûka hulûl ettiği (inancına) dayandığını görürsün."], [1625.9, "Yahudilerin şirki de böyledir; Allah Azze ve Celle'nin şu sözünde:"], [1631.2, "<span class=\"ayah\">﴿Yahudiler: Üzeyr Allah'ın oğludur, dediler﴾<\/span> [Tevbe 30];"], [1635.0, "yani Allah'ın zatından bir şey bu mahlûka hulûl etmiştir, (dediler)."]]}, {"reader": false, "ar": [[1639.0, "بل وأصلُ شرك المشركين في أصنامهم وأوثانهم وأشجارهم وكهوفهم ومغاراتهم إنما (هو) بسبب تقريب ذات الله..."], [1651.8, "والتقريب بين... التمثيل بين ذات الخالق وذات المخلوق."], [1658.0, "فلا يستقيم توحيدُ أحدٍ أبدًا إذا اختلّ ميزانُ هذه المباينة."]], "tr": [[1639.0, "Hatta müşriklerin putlarında, heykellerinde, ağaçlarında, mağaralarında ve inlerindeki şirklerinin aslı da ancak Allah'ın zatını yaklaştırmak..."], [1649.6, "arasını yaklaştırmak... Hâlık'ın zatı ile mahlûkun zatı arasında temsil (benzetme) yapmak sebebiyledir."], [1658.0, "Bu mübâyenetin ölçüsü bozulursa hiç kimsenin tevhidi asla dosdoğru olmaz."]]}, {"reader": false, "ar": [[1666.0, "فيجب عليك أن تعتقد أنّ الله عز وجل مستوٍ على عرشه،"], [1671.8, "بائنٌ من خلقه؛ ليس في خلقه شيءٌ من ذاته،"], [1677.0, "وليس من ذوات خلقه شيءٌ في ذاته،"], [1684.0, "فبين الذاتين انفصالٌ تام."], [1689.0, "وأنّ المخلوق مهما عظُمت منزلتُه فلا يستحقّ شيئًا من صفات الخالق؛"], [1697.0, "فلا الملائكةُ يستحقون شيئًا من صفات الربوبية والألوهية،"], [1703.0, "ولا الأنبياءُ والرسلُ والأولياءُ والصالحون يستحقون شيئًا من صفات الألوهية أو الربوبية،"], [1711.0, "ولا شيءٌ من معبودات الدنيا إلى أن تقوم الساعة يستحقّ شيئًا من هذه الخصائص."]], "tr": [[1666.0, "Şuna inanman vaciptir: Allah Azze ve Celle Arşı üzerine istivâ etmiştir, mahlûkatından ayrıdır (bâindir)."], [1672.3, "Mahlûkatında O'nun zatından hiçbir şey yoktur;"], [1675.2, "mahlûkatının zatlarından da hiçbir şey O'nun zatında değildir."], [1680.0, "İki zat arasında tam bir ayrılık vardır."], [1686.5, "Mahlûk, derecesi ne kadar büyük olursa olsun, Hâlık'ın sıfatlarından hiçbir şeyi hak etmez."], [1695.9, "Ne melekler rubûbiyyet ve ulûhiyyet sıfatlarından bir şeyi hak eder, ne peygamberler, resûller, veliler ve salihler ulûhiyyet veya rubûbiyyet sıfatlarından bir şeyi hak eder, ne de kıyamet kopana kadar dünyada ibadet edilen şeylerden hiçbiri bu hususiyetlerden bir şeyi hak eder."]]}, {"reader": false, "ar": [[1718.0, "ولذلك تجد أنّ القرآن إذا أراد أن يُبطل شركَ المشركين أعاد هذه المباينةَ بين الخالق والمخلوق،"], [1727.0, "وأبطل ما أضفاه عابدُها عليها من صفات الخالق."], [1734.0, "فلا يستقيم التوحيدُ إلا بهذه المباينة بين الخالق والمخلوق في هذين الأمرين:"], [1740.0, "في الذات وفي الصفات. والله أعلم."]], "tr": [[1718.0, "Bu yüzden Kur'an'ın, müşriklerin şirkini iptal etmek istediğinde Hâlık ile mahlûk arasındaki bu mübâyeneti yeniden ortaya koyduğunu ve (ma'bûdlara) ibadet edenin onlara giydirdiği Hâlık sıfatlarını iptal ettiğini görürsün."], [1734.0, "Tevhid ancak Hâlık ile mahlûk arasında bu iki hususta, yani zatta ve sıfatlarda bu mübâyenetle dosdoğru olur. Allah en iyisini bilir."]]}]}, {"ts": "29:04", "title": "5. Külliye: Allah'ın hususiyetlerinden birinde başkasını Allah'a mutlak surette eşit tutan büyük şirke düşmüştür", "paras": [{"reader": false, "ar": [[1744.0, "ومن الكلّيّات أيضًا: <b>كلُّ من سوّى غيرَ الله بالله في شيءٍ من خصائصه التسويةَ المطلقة فمشركٌ الشركَ الأكبر.<\/b> أقول وبالله التوفيق:"], [1760.1, "وهذه قاعدةُ الشرك الأكبر،"], [1762.8, "أو كلّيّةُ الشرك الأكبر."], [1766.0, "وذلك لأنّ الشرك الأكبر يتّفق مع الشرك الأصغر في أنّ كلًّا منهما فيه تسويةٌ وتنديد،"], [1775.0, "إلا أنّ التنديد في الأكبر هو التنديدُ المطلق،"], [1780.0, "وأمّا التنديد في الشرك الأصغر فهو مطلقُ التنديد،"], [1784.0, "كما ستأتينا قاعدتُه إن شاء الله."]], "tr": [[1744.0, "Külliyelerden biri de şudur: 5."], [1748.6, "külliye: Allah'ın hususiyetlerinden birinde Allah'tan başkasını Allah'a mutlak bir eşitlemeyle eşit tutan herkes büyük şirkle müşriktir. Tevfik Allah'tandır, derim ki:"], [1760.8, "Bu, büyük şirkin kaidesi ya da büyük şirkin külliyesidir."], [1766.0, "Çünkü büyük şirk, her ikisinde de eşitleme ve tendîd (Allah'a denk tutma) bulunması hususunda küçük şirkle birleşir."], [1775.0, "Ancak büyük şirkteki tendîd \"mutlak tendîd\"dir (tam denk tutma);"], [1780.0, "küçük şirkteki tendîd ise \"mutlak olarak tendîd\"dir (denk tutmanın bir kısmı). İnşallah bunun kaidesi gelecek."]]}, {"reader": false, "ar": [[1787.0, "فحقيقةُ الشرك هي المساواةُ والتنديد بين الخالق والمخلوق،"], [1795.0, "فرُكنُ الشرك التنديدُ والمساواة."], [1800.0, "فكلُّ ذنبٍ فيه تنديدُ الخالق بالمخلوق،"], [1804.2, "أو مساواةُ الخالق بالمخلوق،"], [1808.0, "فهذا ذنبٌ نسمّيه شركًا،"], [1811.0, "وهو الذي يُبرز الفرقَ بينه وبين الكفر."]], "tr": [[1787.0, "Şirkin hakikati, Hâlık ile mahlûk arasında eşitlik ve tendîddir;"], [1792.1, "şirkin rüknü tendîd ve eşitliktir."], [1800.0, "Hâlık'ı mahlûka denk tutmanın ya da Hâlık'ı mahlûka eşit tutmanın bulunduğu her günaha şirk adını veririz."], [1811.0, "Onunla küfür arasındaki farkı ortaya koyan da budur."]]}, {"reader": false, "ar": [[1816.0, "فإنّ الكفر إذا ذُكر مع الشرك يكون معناه الجحودَ للتنديد والمساواة،"], [1826.0, "وإذا ذُكر الشركُ مع الكفر فيكون معناه التنديدَ والمساواة."], [1835.0, "فكلُّ مشركٍ فهو كافر،"], [1837.8, "ولكن ليس كلُّ كافرٍ يكون مشركًا؛"], [1845.0, "فإنّ الإنسان قد يكفر بترك الصلاة التركَ المطلق الدائم،"], [1849.5, "ولكن لا يوصف بأنه مشرك،"], [1852.0, "وقد يستهزئ بشيءٍ مما جاء به النبي صلى الله عليه وسلم فيوصف بأنه كافر ولكن ليس بمشرك،"], [1862.0, "مع أنّ النتيجة واحدة،"], [1864.5, "وهي الخروج من الإسلام."]], "tr": [[1816.0, "Küfür şirkle birlikte zikredildiğinde anlamı —tendîd ve eşitlemeye karşılık— inkârdır (cuhûd);"], [1826.7, "şirk küfürle birlikte zikredildiğinde ise anlamı tendîd ve eşitliktir."], [1837.1, "Her müşrik kâfirdir; fakat her kâfir müşrik değildir."], [1846.0, "İnsan namazı mutlak ve sürekli olarak terk etmekle kâfir olabilir, ama müşrik diye nitelenmez."], [1854.4, "Nebî ﷺ'in getirdiği bir şeyle alay edebilir;"], [1859.1, "kâfir diye nitelenir ama müşrik değildir."], [1863.2, "Oysa sonuç aynıdır: İslâm'dan çıkmak."]]}, {"reader": false, "ar": [[1867.0, "فإذا قيل لك: ما الفرق بين الكفر والشرك؟"], [1871.0, "فقل: إنّ الشرك هو الكفر إذا أُفرد في النص،"], [1877.0, "والكفر هو الشرك إذا أُفرد في النص."], [1882.0, "وأمّا إذا ذُكر الشركُ والكفرُ في النصّ الواحد،"], [1886.0, "فيكون الشركُ مبناه على التنديد والمساواة،"], [1891.0, "ويكون الشركُ مبناه على التكذيب والجح..."], [1895.0, "ويكون الكفرُ مبناه على الجحود والتكذيب أو التعطيل."]], "tr": [[1867.0, "Sana \"Küfür ile şirk arasındaki fark nedir?\" denirse, de ki:"], [1873.0, "Nassta tek başına zikredildiğinde şirk küfürdür, küfür de şirktir."], [1879.9, "Şirk ve küfür aynı nassta birlikte zikredildiğinde ise şirkin temeli tendîd ve eşitliktir;"], [1889.1, "şirkin temeli yalanlama ve inkâr..."], [1893.4, "(yani) küfrün temeli inkâr ve yalanlama ya da ta'tildir."]]}, {"reader": false, "ar": [[1902.0, "ولذلك قال الله عز وجل:"], [1905.3, "<span class=\"ayah\">﴿فَلَا تَجْعَلُوا لِلَّهِ أَندَادًا﴾<\/span> <span class=\"ref\">[البقرة: ٢٢]<\/span>،"], [1908.0, "فالشرك مبناه على التنديد."], [1911.0, "وقال الله عز وجل:"], [1913.7, "<span class=\"ayah\">﴿تَاللَّهِ إِن كُنَّا لَفِي ضَلَالٍ مُّبِينٍ ۝ إِذْ نُسَوِّيكُم بِرَبِّ الْعَالَمِينَ﴾<\/span> <span class=\"ref\">[الشعراء: ٩٧–٩٨]<\/span>،"], [1921.3, "فإذًا فيه تنديدٌ ومساواة."], [1926.0, "وقال الله عز وجل:"], [1928.7, "<span class=\"ayah\">﴿وَمِنَ النَّاسِ مَن يَتَّخِذُ مِن دُونِ اللَّهِ أَندَادًا يُحِبُّونَهُمْ كَحُبِّ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ١٦٥]<\/span>،"], [1936.0, "وهذا التمثيلُ يقتضي مساواةَ الحبّ بالحبّ المساواةَ المطلقة،"], [1942.0, "فهذا هو حقيقة الشرك."]], "tr": [[1902.0, "Bu yüzden Allah Azze ve Celle şöyle buyurdu:"], [1905.3, "<span class=\"ayah\">﴿Allah'a endâd (denkler) koşmayın﴾<\/span> [Bakara 22];"], [1908.0, "demek ki şirkin temeli tendîddir."], [1911.0, "Allah Azze ve Celle şöyle buyurdu:"], [1913.7, "<span class=\"ayah\">﴿Allah'a andolsun ki biz apaçık bir sapıklık içindeymişiz; çünkü sizi âlemlerin Rabbi ile bir tutuyorduk﴾<\/span> [Şuarâ 97-98];"], [1923.7, "demek ki onda tendîd ve eşitleme vardır."], [1928.0, "Allah Azze ve Celle şöyle buyurdu:"], [1930.7, "<span class=\"ayah\">﴿İnsanlardan kimi de Allah'tan başkasını (O'na) denk tutar; onları Allah'ı sever gibi severler﴾<\/span> [Bakara 165]."], [1937.5, "Bu benzetme, sevginin sevgiye mutlak bir eşitlikle eşitlenmesini gerektirir. İşte şirkin hakikati budur."]]}, {"reader": false, "ar": [[1945.0, "وقال الله عز وجل:"], [1949.0, "<span class=\"ayah\">﴿فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ﴾<\/span> <span class=\"ref\">[النحل: ٧٤]<\/span>،"], [1952.0, "أي: النظراء. وقال الله عز وجل:"], [1956.0, "<span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>،"], [1959.0, "أي: مُساميًا ومثيلًا ونظيرًا يستحقّ ما يستحقّه؟"], [1963.0, "الجوابُ بالطبع: لا. وقال الله عز وجل:"], [1967.0, "<span class=\"ayah\">﴿وَجَعَلُوا لِلَّهِ أَندَادًا لِّيُضِلُّوا عَن سَبِيلِهِ﴾<\/span> <span class=\"ref\">[إبراهيم: ٣٠]<\/span>،"], [1972.0, "والأنداد هم الأمثال والنظراء."], [1975.0, "وقال الله عز وجل:"], [1977.8, "<span class=\"ayah\">﴿وَتَجْعَلُونَ لَهُ أَندَادًا ۚ ذَٰلِكَ رَبُّ الْعَالَمِينَ﴾<\/span> <span class=\"ref\">[فصلت: ٩]<\/span>."]], "tr": [[1945.0, "Allah Azze ve Celle şöyle buyurdu:"], [1947.5, "<span class=\"ayah\">﴿Allah'a misaller (benzerler) koşmayın﴾<\/span> [Nahl 74];"], [1951.2, "yani emsaller. Allah Azze ve Celle şöyle buyurdu:"], [1955.5, "<span class=\"ayah\">﴿O'nun adaşı (benzeri) olan birini biliyor musun?﴾<\/span> [Meryem 65];"], [1959.8, "yani O'nun hak ettiğini hak eden bir adaş, misil ve emsal (biliyor musun)?"], [1964.3, "Cevap elbette: Hayır. Allah Azze ve Celle şöyle buyurdu:"], [1967.9, "<span class=\"ayah\">﴿(İnsanları) O'nun yolundan saptırmak için Allah'a endâd koştular﴾<\/span> [İbrâhîm 30];"], [1973.5, "endâd, misiller ve emsallerdir. Allah Azze ve Celle şöyle buyurdu:"], [1977.8, "<span class=\"ayah\">﴿O'na endâd koşuyorsunuz! O, âlemlerin Rabbidir﴾<\/span> [Fussilet 9]."]]}, {"reader": false, "ar": [[1983.0, "وقال الله عز وجل:"], [1984.8, "<span class=\"ayah\">﴿قُلْ هَلْ مِن شُرَكَائِكُم مَّن يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ ۚ قُلِ اللَّهُ يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ ۖ فَأَنَّىٰ تُؤْفَكُونَ﴾<\/span> <span class=\"ref\">[يونس: ٣٤]<\/span>،"], [1992.8, "(و)الآية التي بعدها."], [1996.0, "وقال الله عز وجل:"], [1998.2, "<span class=\"ayah\">﴿اللَّهُ الَّذِي خَلَقَكُمْ ثُمَّ رَزَقَكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ۖ هَلْ مِن شُرَكَائِكُم مَّن يَفْعَلُ مِن ذَٰلِكُم مِّن شَيْءٍ ۚ سُبْحَانَهُ وَتَعَالَىٰ عَمَّا يُشْرِكُونَ﴾<\/span> <span class=\"ref\">[الروم: ٤٠]<\/span>."]], "tr": [[1983.0, "Allah Azze ve Celle şöyle buyurdu:"], [1984.8, "<span class=\"ayah\">﴿De ki: Ortaklarınızdan, yaratmayı başlatıp sonra onu tekrar edecek olan var mı? De ki: Yaratmayı başlatan, sonra onu tekrar edecek olan Allah'tır. O hâlde nasıl (haktan) çevriliyorsunuz?﴾<\/span> [Yûnus 34], (ve) ondan sonraki ayet."], [1996.5, "Allah Azze ve Celle şöyle buyurdu:"], [1998.7, "<span class=\"ayah\">﴿Allah, sizi yaratan, sonra sizi rızıklandıran, sonra öldüren, sonra da dirilten O'dur. Ortaklarınızdan bunlardan herhangi birini yapabilecek olan var mı? O, onların ortak koştukları şeylerden münezzeh ve yücedir﴾<\/span> [Rûm 40]."]]}, {"reader": false, "ar": [[2011.0, "فأخبرنا الله عز وجل في هذه الآيات بأنّ الشرك الأكبر قاعدتُه هي التنديدُ المطلق والمساواةُ المطلقة."], [2023.0, "وبناءً على ذلك فنعرف حينئذٍ الفروقَ الأثرية بين الشرك الأصغر والشرك الأكبر:"], [2036.0, "بأنّ التنديد المطلق يُحبط الأعمال،"], [2039.0, "وأنّ التنديد المطلق يُبيح الدمَ والمال،"], [2045.0, "وأنّ التنديد المطلق يوجب الخلودَ الأبديَّ الدائم في النار،"], [2055.0, "وأنّ التنديد المطلق لا يدخل تحت حيّز المغفرة يوم القيامة،"], [2064.0, "لقول الله عز وجل:"], [2065.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ﴾<\/span> <span class=\"ref\">[النساء: ٤٨]<\/span>."]], "tr": [[2011.0, "Allah Azze ve Celle bu ayetlerde bize büyük şirkin kaidesinin mutlak tendîd ve mutlak eşitleme olduğunu haber verdi."], [2023.0, "Buna dayanarak, o zaman küçük şirk ile büyük şirk arasındaki sonuç (eser) farklarını biliriz:"], [2037.2, "Mutlak tendîd amelleri boşa çıkarır;"], [2039.8, "mutlak tendîd kanı ve malı helâl kılar;"], [2046.4, "mutlak tendîd cehennemde ebedî ve daimî kalmayı gerektirir;"], [2055.0, "mutlak tendîd kıyamet günü mağfiret alanına girmez."], [2059.9, "Çünkü Allah Azze ve Celle şöyle buyurur:"], [2064.8, "<span class=\"ayah\">﴿Şüphesiz Allah kendisine ortak koşulmasını bağışlamaz; bundan başkasını dilediği kimse için bağışlar﴾<\/span> [Nisâ 48]."]]}, {"reader": false, "ar": [[2072.0, "وبناءً على ذلك: فمن سوّى غيرَ الله بالله في شيءٍ من خصائص ربوبيته فمشركٌ الشركَ الأكبر،"], [2084.0, "ومن سوّى غيرَ الله بالله في شيءٍ من خصائص ألوهيته التسويةَ المطلقة فمشركٌ في ألوهيته الشركَ الأكبر،"], [2095.0, "ومن سوّى غيرَ الله بالله في شيءٍ من خصائص أسمائه وصفاته التسويةَ المطلقة فمشركٌ في باب الأسماء والصفات. والله أعلم."]], "tr": [[2072.0, "Buna göre: Rubûbiyyetinin hususiyetlerinden birinde Allah'tan başkasını Allah'a eşit tutan büyük şirkle müşriktir."], [2080.6, "Ulûhiyyetinin hususiyetlerinden birinde Allah'tan başkasını Allah'a mutlak bir eşitlemeyle eşit tutan, O'nun ulûhiyyetinde büyük şirkle müşriktir."], [2093.1, "İsim ve sıfatlarının hususiyetlerinden birinde Allah'tan başkasını Allah'a mutlak bir eşitlemeyle eşit tutan, isim ve sıfatlar babında müşriktir. Allah en iyisini bilir."]]}]}, {"ts": "35:08", "title": "6. Külliye: Allah'ın hususiyetlerinden birinde başkasını Allah'a kısmen eşit tutmak küçük şirktir", "paras": [{"reader": false, "ar": [[2108.0, "ومن الكلّيّات أيضًا: <b>كلُّ من سوّى غيرَ الله بالله في شيءٍ من خصائصه مطلقَ التسوية فشركٌ أصغر.<\/b> كلُّ من سوّى غيرَ الله بالله في شيءٍ من خصائصه مطلقَ التسوية فشركٌ أصغر."], [2140.4, "وهذه قاعدةٌ، وهذه كلّيّةٌ يُعرف بها الشركُ الأصغر."]], "tr": [[2108.0, "Külliyelerden biri de şudur: 6."], [2110.0, "külliye: Allah'ın hususiyetlerinden birinde Allah'tan başkasını Allah'a \"mutlak olarak bir eşitleme\"yle (kısmen) eşit tutan herkes(in bu fiili) küçük şirktir. Allah'ın hususiyetlerinden birinde Allah'tan başkasını Allah'a mutlak olarak bir eşitlemeyle eşit tutan herkes(in bu fiili) küçük şirktir."], [2140.4, "Bu, küçük şirkin kendisiyle bilindiği bir kaide, bir külliyedir."]]}, {"reader": false, "ar": [[2147.0, "وأُعيد التنبيهَ على أنّ الشرك الأكبر والشرك الأصغر يتّفقان في شيءٍ ويختلفان في شيء:"], [2155.0, "فيتّفقان في أنّ كلًّا منهما فيه تنديدٌ ومساواة،"], [2159.4, "وهذه حقيقة الشرك؛ ولكن يختلفان في أنّ التنديد والمساواة في الشرك الأكبر هو التنديدُ المطلق والتسويةُ المطلقة،"], [2173.0, "وأمّا التنديد والمساواة في الشرك الأصغر فهو مطلقُ التنديد ومطلقُ المساواة."]], "tr": [[2147.0, "Şunu tekrar hatırlatıyorum: Büyük şirk ile küçük şirk bir şeyde birleşir, bir şeyde ayrılır."], [2154.4, "Her ikisinde de tendîd ve eşitleme bulunması hususunda birleşirler;"], [2158.8, "şirkin hakikati budur. Fakat büyük şirkteki tendîd ve eşitlemenin mutlak tendîd ve mutlak eşitleme, küçük şirkteki tendîd ve eşitlemenin ise mutlak olarak tendîd ve mutlak olarak eşitleme olması hususunda ayrılırlar."]]}, {"reader": false, "ar": [[2183.0, "والفرقانُ بين الشيء المطلق ومطلق الشيء هو أن نقول:"], [2188.9, "إنّ الشيء المطلق هو كلُّ الشيء،"], [2192.8, "ومطلقُ الشيء بعضُه. فإذا قلتَ:"], [2199.1, "إنني أُثبت لله عز وجل العلوَّ المطلق،"], [2203.1, "أي: كلَّ ما يسمّى علوًّا؛"], [2206.0, "وإذا قلتَ: بأنني أُثبت لله عز وجل السمعَ المطلق،"], [2212.2, "أي: كلَّ السمع، والبصرَ المطلق،"], [2217.2, "أي: كلَّ البصر. وهذا مما يُعرف به الفرقانُ بين ما يوصف الله عز وجل به وما يوصف المخلوق به."]], "tr": [[2183.0, "\"Mutlak şey\" (eş-şey'ü'l-mutlak) ile \"mutlak olarak şey\" (mutlaku'ş-şey') arasındaki fark şöyle söylememizdir:"], [2189.6, "Mutlak şey, şeyin tamamıdır; mutlak olarak şey ise onun bir kısmıdır."], [2198.6, "\"Allah Azze ve Celle için mutlak uluvvü isbat ediyorum\" dediğinde, yani uluv (yücelik) diye adlandırılan her şeyi;"], [2207.4, "\"Allah Azze ve Celle için mutlak işitmeyi isbat ediyorum\" dediğinde, yani işitmenin tamamını;"], [2216.6, "mutlak görmeyi, yani görmenin tamamını (isbat etmiş olursun)."], [2220.3, "Allah Azze ve Celle'nin nitelendiği şey ile mahlûkun nitelendiği şey arasındaki fark da bununla bilinir."]]}, {"reader": false, "ar": [[2226.0, "فللّه عز وجل العلوُّ المطلق وللمخلوق مطلقُ العلو،"], [2231.0, "ولله عز وجل السمعُ المطلق وللمخلوق مطلقُ السمع،"], [2236.0, "ولله عز وجل القوةُ المطلقة وللمخلوق مطلقُ القوة،"], [2242.0, "ولله عز وجل القدرةُ المطلقة وللمخلوق مطلقُ القدرة،"], [2247.0, "ولله عز وجل التحيّاتُ المطلقة وللمخلوق مطلقُ التحيّات،"], [2254.0, "ولله عز وجل العظمةُ المطلقة وللمخلوق مطلقُ العظمة،"], [2260.0, "ولله عز وجل الجلالُ المطلق وللمخلوق مطلقُ الجلال."]], "tr": [[2226.0, "Allah Azze ve Celle'nin mutlak uluvvü vardır, mahlûkun ise mutlak olarak (bir miktar) uluvvü vardır."], [2231.0, "Allah Azze ve Celle'nin mutlak işitmesi vardır, mahlûkun ise bir miktar işitmesi vardır."], [2236.0, "Allah Azze ve Celle'nin mutlak kuvveti vardır, mahlûkun ise bir miktar kuvveti vardır."], [2241.1, "Allah Azze ve Celle'nin mutlak kudreti vardır, mahlûkun ise bir miktar kudreti vardır."], [2246.4, "Allah Azze ve Celle'ye mutlak tahiyyât (saygı ve selamlar) aittir, mahlûka ise bir miktar tahiyyât aittir."], [2254.0, "Allah Azze ve Celle'nin mutlak azameti vardır, mahlûkun ise bir miktar azameti vardır."], [2260.0, "Allah Azze ve Celle'nin mutlak celâli vardır, mahlûkun ise bir miktar celâli vardır."]]}, {"reader": false, "ar": [[2268.0, "فإذا سوّى أحدٌ غيرَ الله عز وجل بالله في شيءٍ من خصائصه فلا نحكم عليه بأنه وقع في الشرك الأكبر أو الأصغر حتى ننظر إلى نوع هذا التنديد والمساواة:"], [2282.0, "فإن كان التنديدَ والمساواةَ المطلقَين فهذا شركٌ أكبر،"], [2288.0, "وإن كان التنديد والمساواة..."], [2290.5, "وإن كان مطلقَ التنديد والمساواة فهذا هو الشرك الأصغر."], [2296.0, "وهذا يدخل فيه بابُ السببية التي لم يدلّ عليها شرعٌ ولا قدر."]], "tr": [[2268.0, "Biri Allah Azze ve Celle'den başkasını O'nun hususiyetlerinden birinde Allah'a eşit tutarsa, bu tendîd ve eşitlemenin türüne bakmadan onun büyük şirke mi küçük şirke mi düştüğüne hükmetmeyiz."], [2281.1, "Eğer mutlak tendîd ve eşitleme ise bu büyük şirktir;"], [2287.1, "eğer tendîd ve eşitleme... eğer mutlak olarak (kısmî) tendîd ve eşitleme ise bu küçük şirktir."], [2296.6, "Ne şer'in ne de kaderin delâlet ettiği sebeplilik babı buna girer."]]}, {"reader": false, "ar": [[2303.0, "فمن اعتقد أنّ للتميمة مطلقَ الدفع،"], [2307.0, "أو مطلقَ جلب الخير ودفع الشر سببيةً،"], [2311.6, "فمشركٌ شركًا أصغر. وإن اعتقد أنها تدفع الشرَّ بذاتها،"], [2322.0, "أو تجلب الخيرَ بذاتها،"], [2324.6, "فقد اعتقدتَ لها الدفعَ المطلق والجلبَ المطلق،"], [2331.0, "فحينئذٍ يكون الإنسان بهذا الاعتقاد قد وقع في الشرك الأكبر."]], "tr": [[2303.0, "Kim temîmenin (muskanın) sebep olarak bir miktar (kötülüğü) defetme ya da bir miktar hayır getirip şer defetme (gücü) olduğuna inanırsa, küçük şirkle müşriktir."], [2318.7, "Eğer onun şerri bizzat kendisi defettiğine ya da hayrı bizzat kendisi getirdiğine inanırsa, ona mutlak defetme ve mutlak getirme (gücü) nispet etmiş olursun;"], [2332.2, "bu durumda insan bu inançla büyük şirke düşmüş olur."]]}, {"reader": false, "ar": [[2337.0, "وكذلك ما يتطيّر الناس به:"], [2340.0, "فإن اعتقدتَ أنّ له مطلقَ السببية فنقول:"], [2344.9, "هذا شركٌ أصغر، وأمّا إن اعتقدتَ أنه هو نفسُه وذاتُه مَن يفعل ذلك فإنّ ذلك يُعتبر من الشرك الأكبر."], [2362.0, "وكذلك الحلفُ بغير الله عز وجل:"], [2366.0, "فكلُّ من حلف بغير الله بمطلق التعظيم فشركٌ أصغر،"], [2377.0, "وإذا حلفتَ بغير الله بالتعظيم المطلق فشركٌ أكبر."]], "tr": [[2337.0, "İnsanların uğursuz saydığı şeyler de böyledir:"], [2340.0, "Eğer onun bir miktar sebepliliği olduğuna inanırsan, \"Bu küçük şirktir\" deriz."], [2346.3, "Eğer bunu yapanın bizzat onun kendisi ve zatı olduğuna inanırsan, bu büyük şirkten sayılır."], [2357.3, "Allah Azze ve Celle'den başkası adına yemin etmek de böyledir:"], [2364.7, "Allah'tan başkası adına \"mutlak olarak bir tazim\"le yemin eden herkes(in yaptığı) küçük şirktir;"], [2377.0, "Allah'tan başkası adına mutlak tazimle yemin edersen büyük şirktir."]]}, {"reader": false, "ar": [[2383.0, "وبهذا الفرقان يتّضح لكم حقيقةُ الفرق بين ما يدخل في دائرة الشرك الأكبر وما يدخل في دائرة الشرك الأصغر."], [2394.0, "وهذا التفريقُ أوضحُ من التفريق بينهما بالأثر؛"], [2400.0, "فإنّ التفريق بين الشيئين بآثارهما فرعٌ عن معرفة الفرقان بين ذاتيهما."], [2413.0, "وبهذا التفريق تعرف ما الذي يُحبط الأعمال وما الذي (لا) يُحبطها،"], [2419.1, "ما الذي يُبيح الدمَ والمال وما الذي (لا) يُبيحه،"], [2423.0, "ما الذي يوجب الخلودَ الأبديَّ في النار وما لا يوجبه. والله أعلم."]], "tr": [[2383.0, "Bu ayırıcı ölçüyle, büyük şirk dairesine girenle küçük şirk dairesine giren arasındaki farkın hakikati size açıkça ortaya çıkar."], [2392.8, "Bu ayırım, ikisini sonuçlarıyla (eserleriyle) ayırmaktan daha açıktır;"], [2398.5, "çünkü iki şeyi sonuçlarıyla ayırmak, zatları arasındaki farkı bilmenin bir şubesidir (ondan türer)."], [2413.6, "Bu ayırımla, neyin amelleri boşa çıkardığını ve neyin çıkarmadığını, neyin kanı ve malı helâl kıldığını ve neyin kılmadığını, neyin cehennemde ebedî kalmayı gerektirdiğini ve neyin gerektirmediğini bilirsin. Allah en iyisini bilir."]]}]}, {"ts": "40:32", "title": "7. Külliye: Tendîd ve eşitlemenin büyüdüğü her küçük şirk büyük şirke dönüşür", "paras": [{"reader": false, "ar": [[2432.0, "ومن الكلّيّات أيضًا: <b>كلُّ شركٍ أصغر عظُم فيه التنديدُ والمساواة فينقلب إلى أكبر.<\/b> أعوذ بالله!"], [2442.8, "كم رقمُ القاعدة؟ كلُّ شركٍ أصغر عظُم فيه التنديدُ والمساواة فينقلب إلى أكبر."], [2456.7, "واضحة القاعدة ولّا لا؟"], [2466.0, "كلُّ شركٍ عظُم فيه التنديد..."], [2469.4, "أو: كلُّ شركٍ أصغر عظُم فيه التنديدُ والمساواة فينقلب إلى أكبر."]], "tr": [[2432.0, "Külliyelerden biri de şudur: 7."], [2438.5, "külliye: Tendîd ve eşitlemenin büyüdüğü her küçük şirk, büyük şirke dönüşür. Allah'a sığınırım!"], [2442.8, "Kaidenin numarası kaç? Tendîd ve eşitlemenin büyüdüğü her küçük şirk büyük şirke dönüşür."], [2456.7, "Kaide açık mı, değil mi?"], [2466.7, "Tendîdin büyüdüğü her şirk... ya da:"], [2470.1, "Tendîd ve eşitlemenin büyüdüğü her küçük şirk büyük şirke dönüşür."]]}, {"reader": false, "ar": [[2477.8, "أقول وبالله التوفيق: وذلك لأنّ تحريم الشرك الأصغر إنما كان تحريمَ وسائل،"], [2486.0, "وأمّا تحريمُ الشرك الأكبر فهو تحريمُ مقاصد؛"], [2490.8, "لأنّ المتقرّر في قواعد الشريعة وأصول الملّة أنّ الشارع إذا حرّم شيئًا تحريمَ مقاصد حرّم كلَّ وسيلةٍ توصل إليه."], [2507.0, "فالله عز وجل لمّا حرّم الزنا تحريمَ مقاصد حرّم كلَّ وسيلةٍ تُفضي إليه،"], [2513.0, "ولمّا حرّم شربَ الخمر تحريمَ مقاصد حرّم كلَّ وسيلةٍ تُفضي إليه."]], "tr": [[2477.8, "Tevfik Allah'tandır, derim ki: Bunun sebebi şudur:"], [2481.1, "Küçük şirkin haram kılınması ancak vesileleri haram kılma (kabilinden)dir;"], [2486.7, "büyük şirkin haram kılınması ise maksatları haram kılmadır."], [2490.8, "Çünkü şeriatın kaidelerinde ve dinin usûlünde sabit olan şudur:"], [2496.0, "Şâri' bir şeyi maksat olarak haram kıldığında, ona ulaştıran her vesileyi de haram kılar."], [2507.0, "Allah Azze ve Celle zinayı maksat olarak haram kılınca, ona götüren her vesileyi de haram kıldı."], [2513.0, "İçki içmeyi maksat olarak haram kılınca, ona götüren her vesileyi de haram kıldı."]]}, {"reader": false, "ar": [[2520.0, "ولمّا حرّم الشركَ الأكبر تحريمَ مقاصد،"], [2526.0, "فإنّ ذلك يقضي بتحريم كلِّ وسيلةٍ تُفضي إليه،"], [2532.0, "ومن الوسائل التي تُفضي إلى الشرك الأكبر هي الشركُ الأصغر."], [2540.0, "فإذا قيل لك: ما مبدأ تحريم الشرك الأصغر؟"], [2544.3, "فقل: من باب سدّ الذرائع؛"], [2547.0, "فتحريمُ الأصغر تحريمُ وسائل،"], [2549.9, "وتحريمُ الأكبر تحريمُ مقاصد."]], "tr": [[2520.0, "Büyük şirki maksat olarak haram kılınca da bu, ona götüren her vesilenin haram kılınmasını gerektirir."], [2530.3, "Büyük şirke götüren vesilelerden biri de küçük şirktir."], [2535.5, "Sana \"Küçük şirkin haram kılınmasının esası nedir?\" denirse, de ki:"], [2542.2, "Sedd-i zerâi' (kötülüğe giden yolları kapatma) babındandır."], [2544.8, "Küçüğün haram kılınması vesileleri haram kılmadır;"], [2548.4, "büyüğün haram kılınması ise maksatları haram kılmadır."]]}, {"reader": false, "ar": [[2554.0, "ولكن لا تظنّنّ أبدًا أنّ ما كان موصوفًا بأنه أصغر سيبقى أصغرَ إلى آخر الدنيا،"], [2567.0, "بل إنها خطواتٌ للشيطان؛"], [2569.5, "يوقعك في الشرك الأصغر في أوائل الأمر،"], [2574.0, "ثم لا يزال ينفخ هذا التنديد من كِيره الخبيث وفمه القبيح النتن،"], [2582.0, "فيزداد هذا التنديدُ والمساواةُ في قلبك،"], [2586.0, "حتى تنقلب من كونها مطلقَ التنديد إلى التنديد المطلق،"], [2592.0, "وتنقلب من مطلق المساواة إلى المساواة المطلقة."], [2597.0, "فأوجبت الشريعةُ أن يُسَدّ البابُ من أوله،"], [2601.5, "قطعًا لدابر الوصول إلى ما وراءه مما لا تُحمد عقباه."]], "tr": [[2554.0, "Fakat küçük diye nitelenen şeyin dünyanın sonuna kadar küçük kalacağını asla sanma."], [2562.0, "Bilakis bunlar şeytanın adımlarıdır: İşin başında seni küçük şirke düşürür, sonra habis körüğünden ve çirkin, pis kokulu ağzından bu tendîde üflemeye devam eder."], [2581.3, "Böylece bu tendîd ve eşitleme kalbinde artar;"], [2586.0, "sonunda \"mutlak olarak tendîd\" olmaktan \"mutlak tendîd\"e, \"mutlak olarak eşitleme\"den \"mutlak eşitleme\"ye dönüşür."], [2595.6, "Bu yüzden şeriat, sonu hayırlı olmayan ötesine ulaşmanın kökünü kesmek için kapının en başından kapatılmasını vacip kılmıştır."]]}, {"reader": false, "ar": [[2608.0, "فمبدأُ تحريم اعتقاد السببية في التمائم هو ألّا يُوصلك اعتقادُ السببية إلى اعتقاد أنها فاعلة."], [2619.0, "ومبدأُ تحريم الحلف بغير الله بمطلق التعظيم حتى لا يُوصلك ذلك إلى أن تحلف بغير الله بالتعظيم المطلق."], [2632.0, "ومبدأُ تحريم التطيّر سببيةً حتى لا يُوصلنّك ذلك إلى اعتقاد أنّ ما تطيّرتَ به هو مَن يفعل بذاته."], [2645.0, "ومبدأُ تحريم نسبة الخير أو الأمطار إلى الأنواء سببيةً حتى لا يُوصلنّك ذلك إلى أن تعتقد أنّ النوء هو مَن يخلق ويدبّر."]], "tr": [[2608.0, "Muskalarda sebeplilik inancının haram kılınmasının esası, sebeplilik inancının seni onların (bizzat) fâil olduğu inancına ulaştırmamasıdır."], [2617.8, "Allah'tan başkası adına mutlak olarak bir tazimle yemin etmenin haram kılınmasının esası, bunun seni Allah'tan başkası adına mutlak tazimle yemin etmeye ulaştırmaması içindir."], [2632.0, "Sebep olarak uğursuzluğa inanmanın (teşe'üm) haram kılınmasının esası, bunun seni uğursuz saydığın şeyin bizzat kendisinin (bunu) yaptığı inancına ulaştırmaması içindir."], [2645.0, "Hayrı ya da yağmurları sebep olarak yıldızlara (envâ') nispet etmenin haram kılınmasının esası, bunun seni yaratanın ve idare edenin yıldız olduğu inancına ulaştırmaması içindir."]]}, {"reader": false, "ar": [[2660.0, "وهكذا في كلّ صور الشرك الأصغر والكفر الأصغر في النصوص الشرعية؛"], [2668.0, "فإنها من باب سدّ الذرائع،"], [2671.3, "حتى لا ينفخ الشيطانُ في هذا التنديد وفي هذه المساواة،"], [2678.0, "فتنقلب في مستقبل الزمان من كونها أصغرَ إلى أكبر بسبب عِظَم التنديد والمساواة."], [2687.0, "فنسأل الله عز وجل أن يُعيذنا وإياكم من كلّ صور الشرك. والله أعلم."]], "tr": [[2660.0, "Şer'î nasslardaki küçük şirk ve küçük küfrün bütün suretleri de böyledir:"], [2668.0, "Bunlar sedd-i zerâi' babındandır; ta ki şeytan bu tendîde ve bu eşitlemeye üflemesin de gelecekte tendîd ve eşitlemenin büyümesi sebebiyle küçük olmaktan büyüğe dönüşmesin."], [2683.9, "Allah Azze ve Celle'den bizi ve sizi şirkin bütün suretlerinden korumasını dileriz. Allah en iyisini bilir."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");

}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
