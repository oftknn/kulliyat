emez."], [2920.0, "O, rukye babında asla dayanılmaması gereken bir cihazdır."]]}, {"reader": false, "ar": [[2925.0, "لكن كونُ المريض يستمع ليتفقّه،"], [2927.8, "أو ليتعلّم آياتِ الرقية فيرقيَ هو على نفسه،"], [2932.5, "فإنّ ذلك جائزٌ سائغ."], [2935.0, "فإن قلت: إنّ من الناس من إذا استمع لآيات الرقية تأثّر وربما شُفي،"], [2942.0, "فنقول: إنّ المتقرّر في القواعد أنّ وجود المقاصد لا يدلّ على سلامة الوسائل."]], "tr": [[2925.0, "Fakat hastanın, anlamak için veya rukye ayetlerini öğrenip kendi kendine rukye yapmak için dinlemesi caiz ve uygundur."], [2935.0, "\"İnsanlardan, rukye ayetlerini dinlediğinde etkilenen ve belki şifa bulan kimseler var\" dersen, deriz ki:"], [2943.1, "Kaidelerde yerleşik olan, maksatların gerçekleşmesinin vasıtaların selametine delalet etmediğidir."]]}, {"reader": false, "ar": [[2949.0, "ومن المسائل أيضًا: ما حكمُ الرقية على الحائض أو النفساء أو الجنب،"], [2954.0, "واستعمالِهم للماء أو الزيت المقروء فيه؟"], [2957.0, "نقول: لا بأس به أبدًا،"], [2960.0, "وليس كونُهم من أصحاب الحدث الأكبر بمانعٍ لهم من الرقية عليهم."], [2968.0, "فيجوز الرقيةُ على الحائض وعلى النفساء وعلى الجنب،"], [2973.0, "ويجوز للحائض أن تغتسل بالماء المقروء فيه،"], [2976.0, "ويجوز للنفساء أن تدّهن بالدهن المقروء فيه؛"], [2981.0, "كلُّ ذلك لا بأس به ولا حرج فيه."]], "tr": [[2949.0, "Meselelerden biri de şudur: Hayızlı, lohusa veya cünüp kimseye rukye yapmanın ve onların kendisine okunmuş su veya yağı kullanmalarının hükmü nedir?"], [2957.0, "Deriz ki: Bunda asla beis yoktur."], [2960.7, "Onların büyük hades sahibi olmaları, kendilerine rukye yapılmasına engel değildir."], [2968.0, "Hayızlıya, lohusaya ve cünübe rukye yapmak caizdir;"], [2972.4, "hayızlı kadının kendisine okunmuş suyla yıkanması caizdir;"], [2975.6, "lohusa kadının kendisine okunmuş yağla yağlanması caizdir."], [2981.0, "Bunların hepsinde beis ve sakınca yoktur."]]}, {"reader": false, "ar": [[2983.0, "ومن المسائل المعاصرة: هل يجوز فتحُ محلٍّ للعلاج بالرقية؟"], [2990.0, "الجواب: المتقرّر في القواعد أنّ ما جاز أصالةً جاز فرعًا إلا بدليل."], [2998.0, "فإذا كنّا نُجيز أن يرقي الإنسان أصالةً،"], [3007.0, "فإنّ من الناس من قد لا يستطيع أن يجد مكانًا صالحًا للرقية،"], [3012.0, "أو جوًّا ملائمًا للرقية،"], [3015.0, "إلا إذا افتتح مكانًا معيّنًا يرده الناس ويعرفون مكانه،"], [3020.0, "مكانَه، ويواعدهم في يومٍ يخرج لهم فيه ويأتونه فيه،"], [3024.4, "من باب ترتيب وقته وترتيب أوقاتهم،"], [3027.3, "والمحافظة على ـ يعني ـ الأمور الأخرى؛"], [3030.5, "فإنّ ذلك عندي جائزٌ سائغٌ لا بأس به،"], [3034.0, "وليس هناك دليلٌ يمنعه أبدًا."]], "tr": [[2983.0, "Çağdaş meselelerden biri de şudur:"], [2985.1, "Rukyeyle tedavi için bir yer (dükkân) açmak caiz midir?"], [2990.0, "Cevap: Kaidelerde yerleşik olan, aslen caiz olanın fer'an da caiz olduğudur;"], [2994.7, "ancak bir delil (aksini gösterirse başka)."], [2998.0, "İnsanın aslen rukye yapmasını caiz görüyorsak, insanlardan bazıları rukyeye elverişli bir yer veya rukyeye uygun bir ortam bulamayabilir;"], [3011.2, "ancak insanların gelip yerini bildikleri belirli bir yer açarsa, onlarla bir günde sözleşir, o gün onlar için çıkar, onlar da o gün ona gelir;"], [3024.0, "bu, vaktini ve onların vakitlerini düzenlemek ve —yani— diğer işleri korumak babındandır."], [3030.5, "Bence bu caiz ve uygundur, bunda beis yoktur;"], [3034.0, "onu yasaklayan hiçbir delil yoktur."]]}, {"reader": false, "ar": [[3036.1, "واتّخاذُها مهنةً لا بأس به،"], [3040.3, "لا حرج، لا بأس به."], [3042.2, "وليس هناك مانعٌ أن يُفرّغ الإنسانُ نفسَه لنفع إخوانه المسلمين ليلًا ونهارًا وفي كلّ الأيام؛"], [3049.5, "فإنّ ذلك جائزٌ سائغ."], [3051.0, "ومن منعه في الحقيقة لم يأتِ بدليلٍ مقنعٍ واضحٍ ظاهرٍ في هذا المنع،"], [3057.8, "في هذا المنع. فإذا جازت الرقية،"], [3061.3, "وجاز أخذُ الأجرة عليها،"], [3063.0, "فلا فرق بين أن يكون ذلك في البيت أو في محلٍّ مستأجَرٍ أو في دارٍ خاصّة،"], [3069.8, "دفعًا للحرج ـ دفعًا للحرج والمشقّة ـ عن أهل المنزل، كما ذكرتُ لكم."]], "tr": [[3036.1, "Onu meslek edinmekte de beis yoktur, sakınca yoktur, beis yoktur."], [3042.2, "İnsanın gece gündüz ve her gün kendini Müslüman kardeşlerine fayda vermeye adamasına bir engel yoktur;"], [3049.5, "bu caiz ve uygundur. Onu yasaklayan kimse gerçekte bu yasak hakkında ikna edici, açık ve zahir bir delil getirmemiştir, bu yasak hakkında."], [3060.0, "Rukye caiz olduğuna ve ona ücret almak caiz olduğuna göre, bunun evde, kiralanmış bir yerde veya özel bir binada olması arasında fark yoktur;"], [3069.8, "size zikrettiğim gibi ev halkından sıkıntıyı —sıkıntıyı ve meşakkati— gidermek için."]]}]}, {"ts": "51:16", "title": "Meseleler: Okunmuş yüzük · Birden fazla rukyeci · Okunmuş suyu iğneyle vermek", "paras": [{"reader": false, "ar": [[3076.0, "ومن المسائل أيضًا: انتشر عند بعض القرّاء ـ هداهم الله ـ أنهم يقرؤون في خاتمٍ معيّن،"], [3085.0, "ويأمرون المصروعَ أو الممسوسَ أو المعيونَ بلبسه."], [3091.0, "فهل هذا من صفات الرقية الصحيحة؟"], [3094.3, "الجواب: هذا من التمائم الممنوعة،"], [3096.6, "هذا من التمائم الممنوعة."], [3097.0, "فإنّ القول الصحيح عندنا،"], [3099.2, "والذي عليه جمهورُ أهل العلم،"], [3102.0, "هو أنّ التمائم من القرآن أو الأدعية أو التعاويذ ممنوعةٌ في الأصحّ؛"], [3108.7, "لعموم الأدلّة التي وردت بتحريم التمائم،"], [3112.0, "فإنها لم تفرّق بين تمائمَ من القرآن أو من غير القرآن."]], "tr": [[3076.0, "Meselelerden biri de şudur: Bazı rukyeciler —Allah onlara hidayet versin— arasında, belirli bir yüzüğe okuyup sar'alıya, cin çarpmış kişiye veya nazar değmiş kişiye onu takmasını emretmeleri yayılmıştır."], [3094.3, "Bu, sahih rukyenin şekillerinden midir?"], [3095.9, "Cevap: Bu yasak temîmelerdendir, bu yasak temîmelerdendir."], [3097.0, "Bizce sahih olan ve ilim ehlinin cumhurunun benimsediği görüş, Kur'an'dan, dualardan veya sığınma dualarından olan temîmelerin de en sahih görüşe göre yasak olduğudur."], [3108.7, "Çünkü temîmelerin haramlığı hakkında gelen deliller geneldir ve Kur'an'dan olan temîmelerle Kur'an'dan olmayanlar arasında ayrım yapmamıştır."]]}, {"reader": false, "ar": [[3118.0, "وسدًّا لذريعة امتهان كتاب الله عز وجل بالدخول به في بعض الأماكن التي تعرفونها،"], [3128.0, "وسدًّا لذريعة تعلّق قلب صاحب الخاتم بهذا الخاتم،"], [3134.0, "فيرى أنه إذا خلعه أنه سيصيبه شيء،"], [3138.0, "وأنه إذا كان قد لبسه فإنه في أمنٍ وطمأنينةٍ وأمانٍ من أن يصيبه شيء."], [3144.0, "فحينئذٍ يجري هذا الخاتمُ الذي يُصرَف عند بعض القرّاء مجرى التمائم،"], [3148.0, "والتمائمُ محرّمةٌ كلُّها، من القرآن ومن غير القرآن."]], "tr": [[3118.0, "Ayrıca bu, Allah Azze ve Celle'nin Kitabı'nın, bildiğiniz bazı yerlere onunla girilerek hor kullanılması zerîasını kapatmak ve yüzük sahibinin kalbinin bu yüzüğe bağlanması zerîasını kapatmak içindir;"], [3135.1, "(aksi hâlde) onu çıkarırsa kendisine bir şey isabet edeceğini, takmışsa bir şey isabet etmesinden emniyette, huzurda ve güvende olduğunu düşünür."], [3144.0, "O zaman bazı rukyecilerin yanında verilen bu yüzük temîmeler yerine geçer;"], [3147.6, "temîmelerin ise Kur'an'dan olanı da olmayanı da hepsi haramdır."]]}, {"reader": false, "ar": [[3154.0, "فإن قلت: وهل يجوز أن يتعدّد الرقاة على مقروءٍ عليه،"], [3159.0, "أو أن يتعدّد المقروءُ عليهم لقارئٍ واحد؟"], [3165.0, "نقول: كلا الصورتين جائزةٌ سائغةٌ لا بأس به."], [3169.0, "فلو اجتمع مجموعةٌ من الرقاة ـ يعني ـ يتعاقبون الرقيةَ على مريضٍ لشدّة حالته فلا بأس،"], [3175.0, "وإذا قرأ واحدٌ على أفرادٍ من المرضى فإنّ ذلك جائزٌ لا بأس به،"], [3182.0, "ومن منع من ذلك فهو مطالَبٌ بالدليل."]], "tr": [[3154.0, "\"Kendisine okunan bir kişiye birden fazla rukyecinin okuması veya tek bir rukyecinin birden fazla kişiye okuması caiz midir?\" dersen, deriz ki:"], [3165.0, "İki suret de caiz ve uygundur, bunda beis yoktur."], [3169.0, "Bir grup rukyeci bir araya gelip —yani— hâlinin ağırlığından dolayı bir hastaya sırayla rukye yapsalar beis yoktur."], [3176.6, "Bir kişi hastalardan birkaç kişiye okusa bu caizdir, bunda beis yoktur."], [3182.4, "Bunu yasaklayan kimseden delil istenir."]]}, {"reader": false, "ar": [[3185.0, "ومنها أيضًا ـ وهو من أعجب ما سمعتُه ـ وهي أنّ بعض الرقاة صار يعمل كما يفعل الطبيب؛"], [3193.0, "فكما أنّ الطبيب عنده حقنةٌ يحقن بها في وريد المريض أو في جسد المريض،"], [3200.0, "فإنّ هناك من الرقاة من يعمد إلى هذه التطعيمات فيحقنها بماءٍ مقروءٍ فيه،"], [3208.0, "مستدلًّا على ذلك بما في الصحيحين من حديث أنسٍ رضي الله عنه:"], [3215.0, "«إنّ الشيطان يجري من ابن آدم مجرى الدم»."], [3218.0, "ولكنّ هذا قد أوجب خللًا عظيمًا في كثيرٍ من صحّة المقروء عليه."]], "tr": [[3185.0, "Bunlardan biri de —ki işittiğim en şaşırtıcı şeylerdendir— bazı rukyecilerin doktorun yaptığı gibi davranmaya başlamasıdır."], [3193.0, "Doktorun, hastanın damarına veya bedenine enjekte ettiği bir iğnesi olduğu gibi, rukyecilerden de bu aşılara (enjektörlere) yönelip onları kendisine okunmuş suyla enjekte edenler vardır."], [3207.2, "Buna da Sahîhayn'da bulunan Enes —Allah ondan razı olsun— hadisini delil getirirler:"], [3215.0, "\"Şüphesiz şeytan, Âdemoğlunda kanın dolaştığı yerde dolaşır.\" Fakat bu, kendisine okunan kişinin sağlığında birçok yönden büyük bir bozukluğa yol açmıştır."]]}, {"reader": false, "ar": [[3224.0, "فإنّ إدخال هذه المادّة الغريبة في غير مكانها ربما يكون قاتلًا للإنسان،"], [3231.0, "وإدخالَها من غير تنقيةٍ ولا تصفيةٍ ممّا قد يشوبها من الأجواء؛"], [3237.0, "فإنّ مياه القرّاء ـ يعني ـ ربما يُنفث فيها أو يُبصق فيها،"], [3242.7, "وتكون مفتوحة، فليست من الموادّ المعقّمة التي تكون كموادّ الطبيب في المستشفيات؛"], [3250.0, "فإنّ الأطبّاء في المستشفيات تُخرج هذه المحقوناتِ في جسد المريض عندهم بعد معالجتها بأجهزتهم وتنقيتها وتصفيتها."], [3262.0, "فأرى أنّ ذلك من الأمور التي أُحدثت في صفة الرقية،"], [3266.0, "وأنها ممّا لا ينبغي فعله."]], "tr": [[3224.0, "Çünkü bu yabancı maddeyi yerinin dışında (bedene) sokmak belki insanı öldürebilir;"], [3230.4, "onu, kendisine karışabilecek havadaki (pisliklerden) arındırmadan ve süzmeden sokmak da (böyledir)."], [3237.0, "Çünkü rukyecilerin suları —yani— belki içine üflenir veya tükürülür ve açık durur;"], [3244.6, "hastanelerdeki doktorun malzemeleri gibi steril maddelerden değildir."], [3250.0, "Hastanelerdeki doktorlar bu enjekte edilecek maddeleri, cihazlarıyla işlemden geçirip arındırdıktan ve süzdükten sonra hastanın bedenine verirler."], [3262.0, "Bu yüzden bunun, rukyenin şeklinde ihdas edilmiş işlerden olduğunu ve yapılmaması gereken şeylerden olduğunu görüyorum."]]}]}, {"ts": "54:30", "title": "Son mesele: Rukyeye ücret almak", "paras": [{"reader": false, "ar": [[3270.0, "بقينا في مسألةٍ أخيرة،"], [3271.8, "وهي: ما حكمُ أخذ الأجرة على الرقية؟"], [3275.0, "ما حكمُ أخذ الأجرة على الرقية؟"], [3277.0, "أقول: لا بأس بذلك في قول جمهور أهل العلم،"], [3282.0, "لكن مع التنبيه على أمرين:"], [3286.0, "الأمرُ الأوّل: أنه كلّما كانت الرقية عن غير عوضٍ ماليّ كلّما كانت أشدَّ تأثيرًا؛"], [3294.4, "لأنها أدخلُ في باب الإخلاص وصفاءِ النيّة <span class=\"q\">؟ 54:52<\/span>."], [3298.0, "الأمرُ الثاني: أنه إن كان لا بدّ وأن تأخذ،"], [3302.0, "فإنه لا بدّ أن ترحم إخوانك،"], [3304.1, "وأن لا يكون همُّك المغالاةَ في مثل هذه الأمور،"], [3308.0, "وإنما تضع على رقيتك سعرًا متوسّطًا،"], [3311.3, "متناسبًا مع المكان الذي استأجرتَه،"], [3314.0, "متناسبًا مع الوقت الذي بذلتَه،"], [3316.1, "ونحو ذلك. لكن أمّا أصلُ أخذها فإنه جائزٌ لا بأس به ولا حرج."]], "tr": [[3270.0, "Son bir mesele kaldı: Rukyeye ücret almanın hükmü nedir?"], [3275.0, "Rukyeye ücret almanın hükmü nedir?"], [3277.0, "Derim ki: İlim ehlinin cumhurunun görüşüne göre bunda beis yoktur;"], [3281.4, "fakat iki hususa dikkat çekmek gerekir:"], [3286.0, "Birinci husus: Rukye maddî bir karşılık olmaksızın yapıldıkça daha etkili olur;"], [3294.4, "çünkü ihlas ve niyet safiyeti <span class=\"q\">؟<\/span> babına daha çok girer."], [3298.0, "İkinci husus: Eğer mutlaka alacaksan, kardeşlerine merhamet etmen ve derdinin bu gibi işlerde aşırı fiyat istemek olmaması gerekir."], [3307.1, "Bilakis rukyene, kiraladığın yere uygun, harcadığın vakte uygun ve benzeri şeylere uygun orta bir fiyat koyarsın."], [3317.0, "Fakat onu almanın aslı caizdir, bunda beis ve sakınca yoktur."]]}, {"reader": false, "ar": [[3324.0, "والدليلُ على ذلك عدّةُ أمور:"], [3327.0, "الأمرُ الأوّل: حديثُ أبي سعيدٍ رضي الله عنه،"], [3329.0, "عندما قال ـ عندما رقى سيّدَ الحيّ اللديغ ـ قال:"], [3335.4, "«والله لا أرقي حتى تأتوني بقطيعٍ من الغنم، أو تضربوا لي بسهم»."], [3341.0, "فلمّا رقاه وشفاه الله أخذوا قطيعَ الغنم،"], [3344.0, "فقالوا: والله لا نأكل منها حتى نأتيَ إلى رسول الله صلى الله عليه وسلم ونسأله."], [3352.0, "فلمّا ذهبوا إلى النبيّ صلى الله عليه وسلم وقصّوا عليه القصّة،"], [3356.0, "قال لهم مُقِرًّا لهم:"], [3357.8, "«وما أدراك أنّ الفاتحة رقية؟» ـ أو قال:"], [3360.7, "«ما أدراك أنها رقية؟» ـ وهذا أوّلُ إقرار."], [3363.8, "والإقرارُ الثاني: قال: «اضربوا لي معكم بسهم»؛"], [3368.0, "لأنه هو الذي علّمه هذه الرقية،"], [3371.6, "وهذه مبالغةٌ في التحليل،"], [3374.0, "يقول: «اضربوا لي معكم بسهم»،"], [3375.7, "يعني من باب تطمين قلوبهم بأنّ الأمر حلال."], [3379.0, "وقد ذكر جمعٌ من أهل العلم جوازَ أخذ (الأجرة على) الرقية مستدلّين بهذا الحديث."]], "tr": [[3324.0, "Bunun delili birkaç şeydir: Birincisi:"], [3327.0, "Ebû Saîd'in —Allah ondan razı olsun— hadisidir."], [3328.8, "Kabilenin akrep sokmuş efendisine rukye yaptığında şöyle dedi:"], [3335.4, "\"Vallahi bana bir sürü koyun getirmedikçe veya bana bir pay ayırmadıkça rukye yapmam.\" Ona rukye yapıp Allah da ona şifa verince koyun sürüsünü aldılar ve dediler ki:"], [3344.5, "\"Vallahi Resûlullah sallallâhu aleyhi ve sellem'e gelip ona sormadıkça bundan yemeyiz.\" Peygamber sallallâhu aleyhi ve sellem'e gidip kıssayı ona anlatınca, onları onaylayarak şöyle buyurdu:"], [3357.8, "\"Fâtiha'nın rukye olduğunu sana ne bildirdi?\" —ya da \"Onun rukye olduğunu sana ne bildirdi?\" dedi.— Bu birinci takrirdir."], [3363.8, "İkinci takrir: \"Kendinizle birlikte bana da bir pay ayırın\" buyurdu;"], [3368.0, "çünkü bu rukyeyi ona öğreten oydu."], [3371.0, "Bu, helal kılmada mübalağadır; \"Kendinizle birlikte bana da bir pay ayırın\" demesi, yani işin helal olduğu konusunda kalplerini rahatlatmak babındandır."], [3379.0, "İlim ehlinden bir topluluk bu hadisi delil getirerek rukyeye (ücret) almanın caiz olduğunu zikretmiştir."]]}, {"reader": false, "ar": [[3386.0, "ومن الأدلّة أيضًا: قولُ النبيّ صلى الله عليه وسلم لرجلٍ رقى غيرَه وأخذ أجرةً أيضًا،"], [3394.0, "قال: «لعمري، كُل» ـ أي:"], [3396.1, "كُل من أجرة الرقية ـ «فإنّ من أكل برقيةِ باطلٍ فلقد أكلتَ برقيةِ حقّ»."], [3403.0, "فسمّاه أكلًا، وقال: «لعمري كُل»،"], [3405.5, "وقد سأله: أنأكل من أجرة الرقية؟"], [3409.0, "فقال له النبيّ صلى الله عليه وسلم:"], [3410.8, "«كُل»، أي: أنها حلالٌ لك،"], [3413.7, "وأنها من الرزق الحلال الهنيء المريء الذي ليس هناك دليلٌ يمنعه."]], "tr": [[3386.0, "Delillerden biri de Peygamber sallallâhu aleyhi ve sellem'in, başkasına rukye yapıp ücret de alan bir adama söylediği sözdür:"], [3394.5, "\"Ömrüme andolsun, ye\" —yani rukyenin ücretinden ye— \"Çünkü bâtıl bir rukyeyle yiyen (yiyor);"], [3403.0, "sen ise hak bir rukyeyle yedin.\" Ona \"yemek\" adını verdi ve \"Ömrüme andolsun, ye\" dedi."], [3409.0, "Adam ona \"Rukyenin ücretinden yiyelim mi?\" diye sormuştu;"], [3410.8, "Peygamber sallallâhu aleyhi ve sellem de ona \"Ye\" buyurdu;"], [3414.3, "yani bu senin için helaldir, onu yasaklayan hiçbir delil bulunmayan, afiyetle yenen helal rızıktandır."]]}, {"reader": false, "ar": [[3421.0, "ومن الأدلّة أيضًا: حديثُ ابن عباسٍ رضي الله عنهما:"], [3427.0, "«أنّ نفرًا من أصحاب النبيّ صلى الله عليه وسلم مرّوا بماءٍ فيه لديغ» ـ إلى أن قال ـ «فجئنا إلى النبيّ صلى الله عليه وسلم فسألناه، فقال: إنّ أحقَّ ما أخذتم عليه أجرًا كتابُ الله»."], [3440.0, "والحديث رواه الإمام البخاريّ تحت «باب الشرط في الرقية بقطيعٍ من الغنم»."]], "tr": [[3421.0, "Delillerden biri de İbn Abbas'ın —Allah ikisinden razı olsun— hadisidir:"], [3427.0, "\"Peygamber sallallâhu aleyhi ve sellem'in ashâbından bir grup, içinde akrep sokmuş birinin bulunduğu bir su başından geçti.\" —Şuraya kadar ki şöyle dedi:— \"Peygamber sallallâhu aleyhi ve sellem'e geldik ve ona sorduk."], [3435.0, "Şöyle buyurdu: Üzerine ücret aldığınız şeylerin en çok hak edileni Allah'ın Kitabı'dır.\" Hadisi İmam el-Buhârî \"Bir sürü koyun karşılığında rukyede şart koşma babı\" altında rivayet etmiştir."]]}, {"reader": false, "ar": [[3446.0, "قال الإمامُ البغويّ رحمه الله تعالى:"], [3448.0, "«في الحديث دليلٌ على جواز أخذ الأجرة على تعليم القرآن وجوازِ شرطه، وإليه ذهب عطاءٌ والحكم، وبه قال مالكٌ والشافعيّ وأبو ثور. قال الحكم: ما سمعتُ فقيهًا يكرهه»."], [3462.0, "ثم قال: «وفيه دليلٌ على جواز الرقية بالقرآن وبذكر الله، وأخذِ الأجرة عليه؛ لأنّ القراءة والفقه <span class=\"q\">؟ 57:49<\/span> من الأفعال المباحة». انتهى كلامه."]], "tr": [[3446.0, "İmam el-Beğavî —Allah ona rahmet etsin— şöyle demiştir:"], [3448.0, "\"Hadiste Kur'an öğretimine ücret almanın ve bunu şart koşmanın caiz olduğuna delil vardır."], [3454.5, "Atâ ve Hakem bu görüşe gitmiş;"], [3458.0, "Mâlik, Şâfiî ve Ebû Sevr de bunu söylemiştir."], [3462.0, "Hakem şöyle demiştir: Onu mekruh gören bir fakih işitmedim.\" Sonra şöyle dedi:"], [3464.7, "\"Onda Kur'an ve Allah'ın zikriyle rukye yapmanın ve ona ücret almanın caiz olduğuna da delil vardır;"], [3469.7, "çünkü okuma ve fıkıh <span class=\"q\">؟<\/span> mübah fiillerdendir.\" Sözü bitti."]]}, {"reader": false, "ar": [[3472.0, "وقال الإمامُ ابنُ قدامة رحمه الله تعالى:"], [3475.0, "«فأمّا الأخذ على الرقية فإنّ أحمد اختار جوازه، وقال: لا بأس به»."], [3480.0, "انتهى كلامه. وقال الإمامُ ابنُ تيميّة رحمه الله تعالى:"], [3484.0, "«ولا بأس بجواز أخذ الأجرة على الرقية، ونصّ عليه الإمام أحمد»."], [3491.3, "انتهى كلامه. وقال الإمامُ ابنُ حزمٍ رحمه الله تعالى:"], [3495.0, "«والإجارة جائزةٌ على تعليم القرآن، وعلى تعليم العلم، مشاهرةً وجملةً، وكلُّ ذلك جائز، وعلى الرقى؛ لأنه لم يأتِ في النهي عن ذلك نصّ، بل قد جاءت الإباحة»،"], [3507.0, "فذكر حديثَ ابن عباسٍ الذي ذكرتُه لكم آنفًا،"], [3510.0, "وقال: «وهو قول مالكٍ والشافعيّ وأبي سليمان» ـ يعني داود الظاهريّ ـ انتهى كلامه رحمه الله."]], "tr": [[3472.0, "İmam İbn Kudâme —Allah ona rahmet etsin— şöyle demiştir:"], [3475.0, "\"Rukyeye (ücret) almaya gelince, Ahmed bunun caiz olduğunu tercih etmiş ve 'Bunda beis yoktur' demiştir.\" Sözü bitti."], [3480.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [3482.3, "\"Rukyeye ücret almanın caizliğinde beis yoktur;"], [3484.0, "İmam Ahmed de bunu açıkça belirtmiştir.\" Sözü bitti."], [3487.7, "İmam İbn Hazm —Allah ona rahmet etsin— şöyle demiştir:"], [3491.3, "\"Kur'an öğretimine ve ilim öğretimine, aylık olarak da toptan olarak da icâre (ücret sözleşmesi) caizdir;"], [3495.0, "bunların hepsi caizdir; rukyelere de (caizdir)."], [3498.8, "Çünkü bunu yasaklayan bir nas gelmemiştir;"], [3503.2, "bilakis mubahlık gelmiştir.\" Sonra size az önce zikrettiğim İbn Abbas hadisini zikretti ve dedi ki:"], [3510.5, "\"Bu, Mâlik'in, Şâfiî'nin ve Ebû Süleyman'ın\" —yani Dâvûd ez-Zâhirî'nin— \"görüşüdür.\" —Allah ona rahmet etsin— sözü bitti."]]}, {"reader": false, "ar": [[3517.0, "فكلّ ذلك جائزٌ سائغ."], [3518.7, "ولكنّ أخذ الأجرة على الرقية له صورتان،"], [3521.7, "لا تخلطوا بينهما: الصورة الأولى:"], [3524.4, "أن تكون الأجرةُ مشروطةً على مجرّد الرقية والنفع والتفرّغ،"], [3534.0, "فإنّ ذلك جائزٌ سائغٌ ولا بأس به."], [3536.0, "القسم الثاني: أن تكون أجرةً مشارطةً على الشفاء،"], [3542.0, "فهذه تسمّى جعالة. فإذا دلّ الدليل على جواز أخذ الأجرة ابتداءً،"], [3550.0, "وعلى جواز الجعالة على الشفاء أيضًا؛"], [3556.0, "فالأحاديث تدلّ على الأمرين،"], [3559.0, "وقد استقى منها العلماء جوازَ هذين الأمرين."], [3563.0, "لكن إن كانت ـ رقيتُك،"], [3564.7, "إن كانت ـ الأجرةُ على الرقية وعلى التفرّغ لها،"], [3569.0, "فهذا يستحقّه الراقي سواءٌ شُفيتَ أو لم تُشفَ،"], [3573.0, "وأمّا إذا كانت مشارطةً على الشفاء فلا يستحقّ جُعلَه إلا إذا ـ إلا إذا شُفي الإنسان."]], "tr": [[3517.0, "Bunların hepsi caiz ve uygundur."], [3518.7, "Fakat rukyeye ücret almanın iki sureti vardır, bunları birbirine karıştırmayın:"], [3523.0, "Birinci suret: Ücretin sadece rukyeye, faydaya ve (rukyeci için) vakit ayırmaya şart koşulmasıdır;"], [3534.0, "bu caiz ve uygundur, bunda beis yoktur."], [3536.0, "İkinci kısım: Ücretin şifaya bağlı olarak şart koşulmasıdır;"], [3542.0, "buna ci'âle denir. Delil hem baştan ücret almanın caizliğine hem de şifaya bağlı ci'âlenin caizliğine delalet etmiştir;"], [3556.0, "hadisler iki şeye de delalet eder ve âlimler onlardan bu iki şeyin caizliğini çıkarmışlardır."], [3563.0, "Fakat —rukyen, eğer— ücret rukyeye ve ona vakit ayırmaya karşılıksa, şifa bulsan da bulmasan da rukyeci onu hak eder."], [3573.0, "Şifaya bağlı olarak şart koşulmuşsa, ancak —ancak— insan şifa bulursa (rukyeci) ücretini hak eder."]]}]}, {"ts": "59:41", "title": "7. Külliye: Tıbb-ı nebevîde kendisiyle tedavi sabit olan her şeyin kullanımında merci ehl-i hibredir", "paras": [{"reader": false, "ar": [[3581.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما ثبت التداوي به في الطبّ النبويّ فمرجعُ استعماله لأهل الخبرة.<\/b> فهمتم القاعدة؟"], [3599.0, "مهمّةٌ جدًّا هذه: كلُّ ما ثبت التداوي به من الطبّ النبويّ فمرجعُ استعماله لقول أهل الخبرة."]], "tr": [[3581.0, "Külliyelerden biri de şudur: 7."], [3584.0, "külliye: Tıbb-ı nebevîde kendisiyle tedavi olmak sabit olan her şeyin kullanılmasında merci ehl-i hibredir (işin uzmanlarıdır). Kaideyi anladınız mı?"], [3600.0, "Bu çok önemlidir: Tıbb-ı nebevîden kendisiyle tedavi olmak sabit olan her şeyin kullanılmasında merci, ehl-i hibrenin sözüdür."]]}, {"reader": false, "ar": [[3607.0, "وذلك لأنّ كثيرًا منه يكون من الأعشاب أو غيرها،"], [3613.0, "وقد أثبت طبُّ الأعشاب الحديث بأنّ مثل هذه الأعشاب لو تناولها الإنسان على غير الوجه الذي قرّره أهلُ الخبرة فيه فلربّما يكون استعمالُه مضرًّا."], [3628.0, "وبناءً على ذلك: فقد ثبت الدليل بأنّ الحبّة السوداء شفاءٌ من كلّ داء،"], [3634.0, "لكن لا ينبغي استعمالها كيفما اتّفق،"], [3636.0, "وإنما يستعملها الإنسان على ما يقرّره أهلُ الخبرة فيه، أليس كذلك؟ طيّب."]], "tr": [[3607.0, "Çünkü onun birçoğu bitkilerden veya başka şeylerden oluşur."], [3613.6, "Modern bitkisel tıp da bu tür bitkileri insan, uzmanlarının belirlediği şeklin dışında kullanırsa, belki kullanımının zararlı olacağını isbat etmiştir."], [3629.4, "Buna binaen: Çörek otunun her derde şifa olduğuna dair delil sabit olmuştur;"], [3634.3, "fakat onu gelişigüzel kullanmak uygun değildir;"], [3636.6, "insan onu ancak uzmanlarının belirlediği şekilde kullanır. Öyle değil mi? Peki."]]}, {"reader": false, "ar": [[3643.0, "وكالعسل استشفاءً ـ استشفاءً، وكالعسل استشفاءً ـ لا طعامًا،"], [3651.0, "وإنما كالعسل استشفاءً؛ فإنّ الدليل ثبت أنه من جملة الاستشفاءات النبويّة الشرعيّة،"], [3657.0, "لكن لا ينبغي للإنسان أن يستعمله على داءٍ معيّن إلا إذا استشار أهلَ الخبرة في الطريقة وفي المقدار،"], [3665.0, "حتى لا يكون مضرًّا به."], [3668.0, "ومنها كذلك: زيتُ الزيتون إذا استُعمل للاستشفاء لا للطعام،"], [3674.0, "فإنه لا ينبغي استعماله استشفاءً هكذا كيفما اتّفق،"], [3679.0, "وإنما تستعمله على حسب ما يقرّره أهلُ الخبرة فيه."]], "tr": [[3643.0, "Şifa için —şifa için, şifa için bal gibi— yemek olarak değil;"], [3654.0, "bilakis şifa için bal gibi."], [3655.3, "Delil, onun nebevî şer'î şifa vasıtalarından olduğunu sabit kılmıştır;"], [3658.8, "fakat insanın, kendisine zararlı olmaması için yöntem ve miktar konusunda uzmanlarına danışmadıkça onu belirli bir hastalıkta kullanması uygun değildir."], [3668.0, "Bunlardan biri de zeytinyağıdır; yemek için değil de şifa için kullanıldığında, onu şifa için böyle gelişigüzel kullanmak uygun değildir;"], [3679.9, "onu ancak uzmanlarının belirlediğine göre kullanırsın."]]}]}, {"ts": "1:01:23", "title": "7. Külliye (devam): Dağlama, hacamat, fasd, sinameki ve kust · Kapanış", "paras": [{"reader": false, "ar": [[3683.0, "ومنها كذلك: الكيّ، فإنه من جملة ما دلّت الأدلّةُ على أنه من الأشفية النبويّة،"], [3692.0, "لكن لا ينبغي استعماله هكذا كيفما اتّفق،"], [3695.0, "وإنما يُقصَر استعمالُه على أهل الخبرة فيه."], [3698.0, "أنتم معي ولا لا؟"], [3700.0, "ومنها كذلك: الحجامةُ استشفاءً،"], [3703.0, "فإنه لا ينبغي استعمالها كيفما اتّفق،"], [3706.0, "وإنما يخضع الإنسان ليحجمه أصحابُ الخبرة في الحجامة."], [3712.0, "وكذلك الفصد، فإنه لا ينبغي أن تُسلّم عروقك لكلّ أحد،"], [3717.0, "وإنما يفصدك من له خبرةٌ تامّةٌ في مسألة الفصد."]], "tr": [[3683.0, "Bunlardan biri de dağlamadır (key)."], [3688.8, "Delillerin, nebevî şifa vasıtalarından olduğuna delalet ettiği şeylerdendir;"], [3693.7, "fakat onu böyle gelişigüzel kullanmak uygun değildir;"], [3698.0, "kullanımı ancak onun uzmanlarıyla sınırlandırılır."], [3700.0, "Benimle misiniz, değil misiniz? Bunlardan biri de şifa için hacamattır;"], [3704.5, "onu gelişigüzel kullanmak uygun değildir;"], [3706.7, "insan ancak hacamat uzmanlarının kendisine hacamat yapmasına teslim olur."], [3712.0, "Fasd (kan aldırma) da böyledir;"], [3714.0, "damarlarını herkese teslim etmen uygun değildir;"], [3716.5, "sana ancak fasd konusunda tam bir uzmanlığı olan kimse fasd yapar."]]}, {"reader": false, "ar": [[3722.0, "وكذلك استعمالُ السَّنا لبعض الأمراض،"], [3726.0, "كإمساك البطن ونحوه، فإنه لا ينبغي استعماله بأيّ مقدار؛"], [3732.0, "فإنه ربما يكون الزيادةُ في مقداره مضرّةً بالباطنيّة،"], [3737.0, "أو بالجهاز الهضميّ، أو بالكليتين،"], [3739.1, "أو غيرها، بل لا يستعمله الإنسان إلا على حسب ما يقرّره أهلُ الخبرة فيه."], [3745.0, "وكذلك التداوي بما يُسمّى بالقُسط أو العود الهنديّ،"], [3750.0, "أيضًا لا ينبغي التداوي به إلا بعد أن تسأل أهلَ الخبرة فيه."]], "tr": [[3722.0, "Kabızlık ve benzeri bazı hastalıklar için sinameki (senâ) kullanmak da böyledir;"], [3732.0, "onu herhangi bir miktarda kullanmak uygun değildir;"], [3735.8, "çünkü miktarındaki fazlalık belki iç organlara, sindirim sistemine, böbreklere veya başka şeylere zararlı olabilir."], [3741.7, "Bilakis insan onu ancak uzmanlarının belirlediğine göre kullanır."], [3745.0, "Kust ya da Hint ödü (ûd-i Hindî) denilen şeyle tedavi olmak da böyledir;"], [3751.2, "onunla da ancak uzmanlarına sorduktan sonra tedavi olmak uygundur."]]}, {"reader": false, "ar": [[3755.0, "وهكذا في كلّ ما ثبت من الأدوية النبويّة:"], [3759.4, "إذا كنتَ تريد نفعها والاستشفاء بها،"], [3762.6, "فلا بدّ أن يكون بالصورة والطريقة التي يقرّرها أهلُ الخبرة،"], [3767.7, "حتى تبتعد عن التخبّط باستعمالٍ قد يرجع عليك بالضرر،"], [3772.7, "أو لا يُفضي لك الشفاءَ المطلوب."], [3776.0, "ونكتفي بذلك، والله أعلى وأعلم،"], [3778.0, "وصلى الله وسلم على نبيّنا محمدٍ وعلى آله وصحبه أجمعين."]], "tr": [[3755.0, "Sabit olan bütün nebevî ilaçlarda da durum böyledir:"], [3759.4, "Onların faydasını ve onlarla şifa bulmayı istiyorsan, bunun uzmanlarının belirlediği suret ve yöntemle olması gerekir;"], [3766.1, "ta ki sana zararla geri dönebilecek ya da sana istenen şifayı sağlamayacak bir kullanımla rastgele hareket etmekten uzak durasın."], [3776.0, "Bununla yetiniyoruz. Allah en yüce ve en iyi bilendir."], [3778.4, "Allah, Peygamberimiz Muhammed'e, âline ve bütün ashâbına salât ve selâm etsin."]]}]}]};

function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
