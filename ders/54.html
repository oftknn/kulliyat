<script>
const D={"no": 54, "vid": "URxbkVt7G2k", "title_ar": "الدرس (٥٤) من شرح كليات العقيدة — من كليات باب الرقية", "title_tr": "Şerhu Külliyyâti'l-Akîde — 54. Ders: Rukye Babı Külliyeleri (Manası Bilinmeyen Rukye, Rukyede Tecrübe, Rukyecinin Vasıfları, Nazar Değen Her Şeye Rukye, Rukyede Bid'atler, Tıbb-ı Nebevî ve Ehl-i Hibre)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Manası bilinmeyen şeyle yapılan her rukye haramdır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.9, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.7, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.0, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [9.8, "لا نزال في الكلّيّات والقواعد المتعلّقة بباب الرُّقية والسحر."], [14.0, "من الكلّيّات في هذا الدرس كلّيّةٌ تقول:"], [18.5, "<b>كلُّ رُقيةٍ بما يُجهَل معناه فمحرَّمة.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.4, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.8, "Hâlâ rukye ve sihir babıyla ilgili külliyeler ve kaideler içindeyiz."], [14.0, "Bu dersteki külliyelerden biri şöyle der:"], [16.6, "<b>1. külliye: Manası bilinmeyen bir şeyle yapılan her rukye haramdır.<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[30.0, "أقول وبالله التوفيق: وذلك لأنّ ما يُجهَل معناه يُخشى أن يكون من الشرك أو من الاستغاثات الوثنيّة الإبليسيّة،"], [41.0, "إذا أُخرجت بلغةٍ لا يفهمها القارئ ولا المقروءُ عليه،"], [46.8, "أو يفهمها القارئ ولكنّ المقروءَ عليه لا يفهمها."], [52.0, "فمتى ما كان في الرقية ألفاظٌ مجهولةُ المعنى لا ندري عن دلالتها اللغويّة،"], [62.0, "فإنّ الرقية تنقلب من كونها رقيةً مشروعةً إلى رقيةٍ ممنوعة."], [67.0, "فلو كان الإنسان يرقي باللغة العربيّة،"], [71.0, "ولكنه أدخل في الرقية كلامًا لا يفهمه الحاضرون،"], [74.0, "فالرقية توصف بأنها رقيةٌ محرّمة؛"], [77.0, "لجواز أن يكون فيها شيءٌ من الشرك أو الوثنيّة،"], [80.0, "أو الاستغاثاتِ بالشياطين، أو نداءِ الشياطين بأسمائهم."]], "tr": [[30.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi şudur:"], [31.8, "Manası bilinmeyen şeyin, rukyeyi yapanın da kendisine okunanın da anlamadığı bir dille ya da rukyecinin anlayıp kendisine okunanın anlamadığı bir dille çıkarıldığında, şirkten veya putperestçe, iblisçe istiğaselerden (yardım dilemelerden) olmasından korkulur."], [52.0, "Rukyede, dildeki delâletini bilmediğimiz, manası meçhul lafızlar bulunduğunda rukye meşru bir rukye olmaktan çıkıp yasak bir rukyeye dönüşür."], [67.0, "İnsan Arapça rukye yapsa, fakat rukyeye orada bulunanların anlamadığı bir söz katsa, o rukye haram bir rukye olarak nitelenir;"], [77.0, "çünkü içinde şirkten veya putperestlikten bir şey, şeytanlardan yardım dilemeler veya şeytanları isimleriyle çağırma bulunması muhtemeldir."]]}, {"reader": false, "ar": [[86.0, "ولذلك قال الإمامُ النوويّ رحمه الله تعالى:"], [90.0, "«الرُّقى المجهولة، والتي بغير العربيّة، وما لا يُعرف معناها، مذمومة؛ لاحتمال أنّ معناها كفرٌ أو قريبٌ منه أو مكروه»."], [104.2, "انتهى كلامه. وقال شيخُ الإسلام ابنُ تيميّة رحمه الله تعالى:"], [110.0, "«وأمّا معالجةُ المصروع بالرُّقى والتعوّذات فهذا على وجهين» ـ وذكر الوجهَ الأوّل ـ ثم قال:"], [120.3, "«وأمّا إن كان في ذلك كلماتٌ محرّمة، مثل أن يكون فيها شرك، أو كانت مجهولةَ المعنى» ـ وهذا هو الشاهد ـ «أو كانت مجهولةَ المعنى يُحتمل أن يكون فيها كفر، فليس لأحدٍ أن يرقي بها ولا يعزم ولا يُقسم، وإن كان الجنّيّ قد ينصرف عن المصروع بها؛ فإنّ ما حرّمه الله ورسوله ضررُه أكبرُ من نفعه». انتهى كلامه."]], "tr": [[86.0, "Bu yüzden İmam en-Nevevî —Allah ona rahmet etsin— şöyle demiştir:"], [90.0, "\"Meçhul rukyeler, Arapçadan başka dille olanlar ve manası bilinmeyenler kınanmıştır;"], [95.6, "çünkü manalarının küfür, küfre yakın bir şey veya mekruh olması muhtemeldir.\" Sözü bitti."], [104.2, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [110.0, "\"Sar'alıyı rukyeler ve sığınma dualarıyla tedavi etmeye gelince, bu iki şekildedir.\" —Birinci şekli zikretti— Sonra şöyle dedi:"], [120.3, "\"Eğer bunda haram kelimeler varsa, mesela içinde şirk bulunursa veya manası meçhul olursa\" —delil olan yer burasıdır— \"ya da manası meçhul olup içinde küfür bulunması muhtemelse, cin onunla sar'alıdan ayrılsa bile hiç kimsenin onunla rukye yapması, azimet okuması ve yemin vermesi caiz değildir."], [145.2, "Çünkü Allah'ın ve Resûlü'nün haram kıldığı şeyin zararı faydasından büyüktür.\" Sözü bitti."]]}, {"reader": false, "ar": [[151.0, "وقد بيّن لنا في هذا النقل حُرمةَ الرقية بالألفاظ المجهولة،"], [156.0, "وأنّ الألفاظ المجهولة أو التعاويذ الشركيّة قد تكون سببًا لصرف الجنّ عن المصروع،"], [162.0, "لكنّ وجود المقاصد لا يدلّ على سلامة الوسائل."], [167.0, "وكم من مريضٍ ذهب إلى السحرة وعاد معافًى!"], [172.0, "وكم من إنسانٍ ذهب إلى كاهنٍ فشفاه الله عز وجل!"], [177.0, "ولكنّ المتقرّر في قواعد أهل السنّة والجماعة أنّ تحقّق المقاصد لا يدلّ على سلامة الوسائل،"], [184.0, "وأنّ العبد مطلوبٌ منه سلامةُ المقاصد وسلامةُ الوسائل التي سيصل بها إلى هذه المقاصد."]], "tr": [[151.0, "Bu nakilde bize, meçhul lafızlarla rukye yapmanın haram olduğunu ve meçhul lafızların veya şirk içeren sığınma dualarının cinin sar'alıdan ayrılmasına sebep olabileceğini açıklamıştır."], [162.0, "Fakat maksatların gerçekleşmesi vasıtaların selametine delalet etmez."], [167.0, "Nice hasta sihirbazlara gitti ve sıhhat bulmuş olarak döndü!"], [172.0, "Nice insan bir kâhine gitti de Allah Azze ve Celle ona şifa verdi!"], [177.0, "Fakat Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşik olan şudur:"], [180.7, "Maksatların gerçekleşmesi vasıtaların selametine delalet etmez."], [184.0, "Kuldan hem maksatların selameti hem de bu maksatlara ulaşacağı vasıtaların selameti istenir."]]}, {"reader": false, "ar": [[191.0, "وقال ابنُ حجرٍ رحمه الله تعالى:"], [194.3, "قال القرطبيّ: «الرُّقى ثلاثة أقسام: أحدها: ما كان يُرقى به في الجاهليّة ممّا لا يُعقل معناه، فيجب اجتنابه لئلّا يكون فيه شرك، أو يؤدّي إلى الشرك»."], [212.0, "انتهى كلامه. وقال أبو الحسن العدويّ المالكيّ رحمه الله تعالى:"], [218.0, "«ما جُهل معناه لا تجوز الرقية به ولو جُرِّب ونفع»."], [227.0, "انتهى كلامه. والله أعلم."]], "tr": [[191.0, "İbn Hacer —Allah ona rahmet etsin— şöyle demiştir:"], [194.3, "Kurtubî dedi ki: \"Rukyeler üç kısımdır:"], [197.7, "Birincisi, cahiliyede manası anlaşılmayan şeylerle yapılan rukyelerdir."], [202.5, "İçinde şirk bulunmaması veya şirke götürmemesi için ondan kaçınmak vâciptir.\" Sözü bitti."], [212.0, "Ebu'l-Hasen el-Adevî el-Mâlikî —Allah ona rahmet etsin— şöyle demiştir:"], [218.0, "\"Manası bilinmeyen şeyle, denenip fayda verse bile rukye yapmak caiz değildir.\" Sözü bitti. Allah en iyisini bilir."]]}]}, {"ts": "03:53", "title": "2. Külliye: Tedavi aslı sabit olan her şeyde tecrübe caizdir", "paras": [{"reader": false, "ar": [[233.0, "الكلّيّة الثانية: <b>كلُّ ما ثبت أصلُ التداوي به فتجوز فيه التجارب.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[233.0, "<b>2. külliye: Onunla tedavi olmanın aslı sabit olan her şeyde tecrübeler caizdir.<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[258.0, "وهذه الكلّيّة والتي بعدها من الكلّيّات المهمّة في باب الرقية؛"], [267.0, "وذلك لأنّ مسألة دخول التجارب في باب الرُّقى انقسم الناس فيه إلى طرفين ووسط:"], [279.0, "إلى طرفٍ أقفل بابَ التجارب الإقفالَ المطلق،"], [285.0, "وقالوا: إنّ التداوي في الرقية مبناه على الغيب،"], [290.0, "والمتقرّر في القواعد أنّ ما كان غيبيًّا فيكون توقيفيًّا على النصّ،"], [295.0, "فلا حقّ للراقي أن يجتهد من عند نفسه في البحث عن علاجٍ أو دواءٍ ليداوي به سحرًا أو مسًّا شيطانيًّا أو عينًا أو حسدًا أو غير ذلك،"], [309.0, "وإنما لا يجوز له أن يسلك إلا الطريقةَ التي سلكها رسول الله صلى الله عليه وسلم،"], [316.0, "وهي الرقية بالقرآن والأدعية المباحة والتعاويذ الشرعيّة الثابتة فقط."]], "tr": [[258.0, "Bu külliye ve ondan sonraki, rukye babındaki önemli külliyelerdendir."], [260.6, "Çünkü rukyeler babına tecrübelerin girmesi meselesinde insanlar iki uç ve bir orta yola ayrılmıştır:"], [267.0, "Bir uç, tecrübe kapısını mutlak olarak kapattı ve dediler ki:"], [276.5, "Rukyede tedavinin temeli gayba dayanır;"], [279.0, "kaidelerde yerleşik olan da gaybî olanın nassa bağlı (tevkîfî) olmasıdır."], [285.6, "Dolayısıyla rukyecinin, sihri, şeytanî messi, nazarı, hasedi veya başka bir şeyi onunla tedavi etmek için bir ilaç ya da deva aramada kendiliğinden içtihat etmeye hakkı yoktur."], [305.3, "Ona ancak Resûlullah sallallâhu aleyhi ve sellem'in tuttuğu yolu tutmak caizdir;"], [312.1, "o da yalnızca Kur'an, mübah dualar ve sabit şer'î sığınma dualarıyla rukyedir."]]}, {"reader": false, "ar": [[322.0, "بينما قابلهم فريقٌ آخر،"], [324.8, "وفتحوا بابَ التجارب في الرُّقى على مصراعيه،"], [333.0, "وقالوا: إنّ كلّ شيءٍ أحدثه الراقي إذا أُثبت نفعُه للمرقيّ عليه فإننا نقبله،"], [341.0, "ويقولون كلمتهم المشهورة: «جُرِّب ونفع»."], [347.0, "ولكنّ هذه الكلّيّة التي بين أيديكم تتضمّن القولَ الوسط بين هؤلاء وهؤلاء؛"], [356.0, "فلا نقبل أن يُقفَل بابُ التجارب في باب الرُّقى مطلقًا،"], [362.0, "ولا نقبل أن يُفتح على مصراعيه مطلقًا،"], [367.0, "وإنما ننظر إلى نوع العلاج الذي سيتعاطاه الراقي."]], "tr": [[322.0, "Buna karşılık başka bir grup onların karşısına çıktı ve rukyelerde tecrübe kapısını sonuna kadar açtı."], [333.6, "Dediler ki: Rukyecinin ihdas ettiği her şey, kendisine okunan kişiye faydası isbat edilirse onu kabul ederiz."], [343.4, "Meşhur sözlerini de söylerler: \"Denendi ve fayda verdi.\" Fakat elinizdeki bu külliye, bunlarla şunlar arasındaki orta görüşü içerir:"], [356.0, "Rukyeler babında tecrübe kapısının mutlak olarak kapatılmasını kabul etmeyiz, sonuna kadar mutlak olarak açılmasını da kabul etmeyiz."], [367.7, "Bilakis rukyecinin kullanacağı tedavinin türüne bakarız."]]}, {"reader": false, "ar": [[373.0, "فإن كان أصلُ التداوي به ثبت في النصّ فيجوز أن يُجتهَد في أجزائه،"], [382.0, "كالقرآن الكريم؛ فإنّ الأدلّة دلّت على أنه ممّا يُتداوى به وأنه شفاء،"], [392.0, "كما قال الله عز وجل:"], [394.0, "<span class=\"ayah\">﴿وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[الإسراء: ٨٢]<\/span>،"], [399.0, "وقال الله عز وجل:"], [400.2, "<span class=\"ayah\">﴿قُلْ هُوَ لِلَّذِينَ آمَنُوا هُدًى وَشِفَاءٌ﴾<\/span> <span class=\"ref\">[فصلت: ٤٤]<\/span>،"], [402.0, "وقال الله عز وجل عن القرآن:"], [405.0, "<span class=\"ayah\">﴿وَشِفَاءٌ لِّمَا فِي الصُّدُورِ﴾<\/span> <span class=\"ref\">[يونس: ٥٧]<\/span>."], [407.0, "وقد ثبت عن النبيّ صلى الله عليه وسلم أنه رقى بكتاب الله عز وجل ورُقي به."]], "tr": [[373.0, "Eğer onunla tedavinin aslı nasta sabit olmuşsa, onun cüzlerinde içtihat edilmesi caizdir;"], [386.0, "Kur'ân-ı Kerîm gibi. Çünkü deliller onun kendisiyle tedavi olunan bir şey olduğuna ve şifa olduğuna delalet etmiştir."], [392.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [394.0, "<span class=\"ayah\">﴿Biz Kur'an'dan, mü'minler için şifa ve rahmet olan şeyler indiriyoruz﴾<\/span> [İsrâ 82]."], [399.0, "Allah Azze ve Celle şöyle buyurur:"], [400.2, "<span class=\"ayah\">﴿De ki: O, iman edenler için bir hidayet ve şifadır﴾<\/span> [Fussılet 44]."], [402.5, "Allah Azze ve Celle Kur'an hakkında şöyle buyurur:"], [405.0, "<span class=\"ayah\">﴿ve göğüslerde olana şifadır﴾<\/span> [Yûnus 57]."], [407.0, "Peygamber sallallâhu aleyhi ve sellem'in Allah Azze ve Celle'nin Kitabı ile rukye yaptığı ve onunla kendisine rukye yapıldığı sabittir."]]}, {"reader": false, "ar": [[415.0, "ولكنّ القرآن آياتٌ متعدّدة،"], [422.0, "وموضوعاتُ القرآن موضوعاتٌ متعدّدة،"], [426.0, "فللراقي أن يجرّب الآيات على الحالات."], [429.0, "لماذا؟ لأنّ أصل التداوي ثبت به."], [432.0, "فإذا ثبت أصلُ التداوي بشيءٍ معيّن،"], [436.0, "وكان له أجزاءٌ وأنواعٌ وأقسام،"], [438.0, "فللراقي أن يجرّب داخل هذه الأقسام."], [442.0, "فيقول مثلًا: إنّ الآيات الواردة في سحرة فرعون أنفعُ ما يُقرأ على المسحور بالتجربة؛"], [453.0, "فأنا أقبل تجربتك. لماذا؟"], [456.6, "لأنها تجاربُ فيما ثبت أصلُ التداوي به."]], "tr": [[415.0, "Fakat Kur'an birçok ayetten oluşur ve Kur'an'ın konuları da birçok konudur."], [426.0, "Bu yüzden rukyeci ayetleri hâllere göre deneyebilir."], [429.0, "Neden? Çünkü onunla tedavinin aslı sabit olmuştur."], [432.0, "Belirli bir şeyle tedavinin aslı sabit olur ve onun cüzleri, türleri ve kısımları bulunursa, rukyeci bu kısımlar içinde tecrübe yapabilir."], [442.0, "Mesela şöyle der: Firavun'un sihirbazları hakkında gelen ayetler, tecrübeyle, sihirlenmiş kişiye okunan şeylerin en faydalısıdır."], [453.0, "Ben senin tecrübeni kabul ederim."], [456.0, "Neden? Çünkü bunlar, tedavi aslı sabit olan şeydeki tecrübelerdir."]]}, {"reader": false, "ar": [[461.0, "ولو قال إنسان: إنّ قراءة شيءٍ من آيات سورة يوسف على المعشوق من قِبَل الجنّ هذا من أنفع ما يؤذي الجانَّ الملابس،"], [474.0, "ومن أعظم ما يصرفه عن بدن الإنسان،"], [478.0, "فنقول له: من أين أتيتَ بهذا؟"], [481.0, "قال: بالتجارب. فنقول: أحسنت،"], [484.0, "نحن نقبل هذه التجارب؛"], [486.0, "لأنّ أصل التداوي بالقرآن قد ثبت."]], "tr": [[461.0, "Bir insan, \"Yûsuf sûresinin ayetlerinden bir kısmını cinin âşık olduğu kişiye okumak, (bedene) bulaşmış cine eziyet eden şeylerin en faydalılarından ve onu insanın bedeninden uzaklaştıran şeylerin en büyüklerindendir\" dese, ona \"Bunu nereden çıkardın?\" deriz."], [479.0, "\"Tecrübelerle\" der. Biz de \"Güzel yaptın\" deriz;"], [483.0, "bu tecrübeleri kabul ederiz. Çünkü Kur'an'la tedavinin aslı sabit olmuştur."]]}, {"reader": false, "ar": [[491.0, "ولو جاءنا إنسانٌ وقال:"], [493.0, "إنّ الآيات التي فيها ذِكرُ <span class=\"q\">؟ 08:13<\/span> حسدِ اليهود لأهل الإيمان من أنفع ما يُقرأ على من به عينٌ أو حسد،"], [503.0, "كقول الله عز وجل:"], [504.5, "<span class=\"ayah\">﴿أَمْ يَحْسُدُونَ النَّاسَ عَلَىٰ مَا آتَاهُمُ اللَّهُ مِن فَضْلِهِ﴾<\/span> <span class=\"ref\">[النساء: ٥٤]<\/span>،"], [508.0, "وقولِ الله عز وجل:"], [509.5, "<span class=\"ayah\">﴿حَسَدًا مِّنْ عِندِ أَنفُسِهِم﴾<\/span> <span class=\"ref\">[البقرة: ١٠٩]<\/span>،"], [511.0, "وقولِ الله عز وجل:"], [512.3, "<span class=\"ayah\">﴿وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ﴾<\/span> <span class=\"ref\">[الفلق: ٥]<\/span>،"], [514.0, "وقولِ الله عز وجل:"], [516.4, "<span class=\"ayah\">﴿وَإِن يَكَادُ الَّذِينَ كَفَرُوا لَيُزْلِقُونَكَ بِأَبْصَارِهِمْ﴾<\/span> <span class=\"ref\">[القلم: ٥١]<\/span>،"], [520.0, "فنقول: من أين أتيتَ بأنّ هذا من أنفع ما يُقرأ؟"], [524.0, "فيقول: بالتجارب. فنقول: أحسنت،"], [527.0, "هذه تجربةٌ مقبولة؛ لأنّ كلَّ ما ثبت أصلُ التداوي به فتجوز في أجزائه وأنواعه وأقسامه التجارب."]], "tr": [[491.0, "Biri bize gelip, \"Yahudilerin iman ehline hasedinin zikredildiği <span class=\"q\">؟<\/span> ayetler, kendisinde nazar veya haset bulunan kişiye okunan şeylerin en faydalılarındandır\" dese;"], [493.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Yoksa Allah'ın lütfundan insanlara verdiği şeyden dolayı onları kıskanıyorlar mı?﴾<\/span> [Nisâ 54], Allah Azze ve Celle'nin <span class=\"ayah\">﴿içlerindeki hasetten dolayı﴾<\/span> [Bakara 109], Allah Azze ve Celle'nin <span class=\"ayah\">﴿Haset ettiği zaman hasetçinin şerrinden﴾<\/span> [Felak 5] ve Allah Azze ve Celle'nin <span class=\"ayah\">﴿İnkâr edenler neredeyse seni gözleriyle devirecekler﴾<\/span> [Kalem 51] sözleri gibi;"], [512.3, "\"Bunun okunan şeylerin en faydalılarından olduğunu nereden çıkardın?\" deriz."], [516.4, "\"Tecrübelerle\" der. Biz de \"Güzel yaptın;"], [520.4, "bu makbul bir tecrübedir\" deriz."], [526.2, "Çünkü tedavi aslı sabit olan her şeyin cüzlerinde, türlerinde ve kısımlarında tecrübeler caizdir."]]}, {"reader": false, "ar": [[536.0, "وكذلك التعاويذُ الشرعيّة، فإنها تعاويذُ متعدّدة؛"], [542.0, "فإذا كانت هذه التعويذةُ الثابتة بالنصّ أنفعَ ما يُعوَّذ به المسحور،"], [549.0, "والتعويذةُ الثانية من أنفع ما يُعوَّذ به المعشوق،"], [553.0, "والتعويذةُ الثالثة من أنفع ما يُعوَّذ به المعيون،"], [557.0, "وثبتت بالتجارب، فنقول: أحسنت،"], [560.0, "فهي تجاربُ مقبولة؛ لأنّ أصل التداوي بالتعاويذ الشرعيّة قد ثبت به النصّ. فهمتم هذا؟ ماشي."]], "tr": [[536.0, "Şer'î sığınma duaları da böyledir;"], [538.3, "onlar da birçok sığınma duasıdır."], [542.0, "Nassla sabit olan şu sığınma duası, sihirlenmiş kişinin kendisiyle Allah'a sığındırıldığı şeylerin en faydalısı;"], [547.1, "ikinci sığınma duası, cinin âşık olduğu kişinin kendisiyle sığındırıldığı şeylerin en faydalılarından;"], [551.5, "üçüncü sığınma duası da nazar değmiş kişinin kendisiyle sığındırıldığı şeylerin en faydalılarından olursa ve bu tecrübelerle sabit olursa, \"Güzel yaptın\" deriz."], [559.2, "Bunlar makbul tecrübelerdir; çünkü şer'î sığınma dualarıyla tedavinin aslı hakkında nas sabit olmuştur. Bunu anladınız mı? Tamam."]]}]}, {"ts": "09:30", "title": "2. Külliye (devam): Aslı sabit olmayanda tecrübe kabul edilmez · Külliyenin özeti", "paras": [{"reader": false, "ar": [[570.0, "لكن لا حقّ لك أن تقول:"], [573.6, "«جُرِّب ونفع» فيما لم يثبت أصلُ التداوي به بالنصّ،"], [579.0, "كالتداوي بالملح. فإذا سألته:"], [584.3, "ما وجهُ استدلالك على كونه ممّا يُتعاطى في الرقية أو في طرد الجانّ؟"], [592.0, "فيقول: جُرِّب ونفع. نقول:"], [594.4, "هذه تجربةٌ لا نقبلها."], [596.0, "لماذا؟ لأنك ـ لأنك جرّبتَ فيما لم يثبت أصلُ التداوي به."], [606.0, "وهذا سيأتينا في الكلّيّة الثانية <span class=\"note\">(kastedilen bir sonraki, yani 3. külliye)<\/span> بعد قليل إن شاء الله."]], "tr": [[570.0, "Fakat tedavi aslı nasla sabit olmayan bir şeyde \"Denendi ve fayda verdi\" demeye hakkın yoktur;"], [583.0, "tuzla tedavi gibi. Ona \"Bunun rukyede veya cini kovmada kullanılan bir şey olduğuna istidlalinin yönü nedir?\" diye sorduğunda, \"Denendi ve fayda verdi\" der."], [594.0, "Biz de \"Bu, kabul etmediğimiz bir tecrübedir\" deriz."], [596.0, "Neden? Çünkü sen —çünkü sen— tedavi aslı sabit olmayan bir şeyde tecrübe yaptın."], [606.0, "Bu, inşallah biraz sonra ikinci <span class=\"note\">(yani bir sonraki, 3.)<\/span> külliyede gelecek."]]}, {"reader": false, "ar": [[610.0, "والمقصود والخلاصة من هذه الكلّيّة أنّ ـ الأدعية،"], [613.2, "إنّ ـ إنّ كتاب الله عز وجل قد ثبت أصلُ التداوي به،"], [618.0, "فلك الاجتهادُ أيها القارئ في تخصيص آياتٍ لأحوالٍ معيّنة ثبتت عندك بالتجارب الطويلة ذاتِ النتائج الصحيحة،"], [629.0, "أو الغالبة على الأقلّ."], [631.0, "ولك الحقّ في أن تختار من أدعية الشريعة الثابتة ما تراه نافعًا لحالةٍ دون حالة،"], [639.0, "ولك الحقّ أن تختار من التعاويذ الشرعيّة ما تراه مناسبًا لحالةٍ دون حالة،"], [646.0, "ما دامت التجارب ترجع إلى أمرٍ قد ثبت أصلُ التداوي به في النصّ. والله أعلم."]], "tr": [[610.0, "Bu külliyeden maksat ve özet şudur:"], [613.0, "—Dualar, şüphesiz— şüphesiz Allah Azze ve Celle'nin Kitabı ile tedavinin aslı sabit olmuştur."], [617.0, "Ey rukyeci! Doğru ya da en azından çoğunlukla doğru sonuçlar veren uzun tecrübelerle sende sabit olmuş belirli hâllere belirli ayetleri tahsis etmede içtihat hakkın vardır."], [631.0, "Sabit şer'î dualardan, bir hâle değil de başka bir hâle faydalı gördüğünü seçmeye hakkın vardır."], [638.5, "Şer'î sığınma dualarından, bir hâle değil de başka bir hâle uygun gördüğünü seçmeye de hakkın vardır;"], [646.5, "tecrübeler, tedavi aslı nasta sabit olmuş bir şeye dayandığı sürece. Allah en iyisini bilir."]]}]}, {"ts": "10:56", "title": "3. Külliye: Tedavi aslı sabit olmayan her şeyde tecrübe caiz değildir", "paras": [{"reader": false, "ar": [[656.0, "الكلّيّة الثالثة، وهي عكسُ تلك الكلّيّة:"], [660.0, "<b>كلُّ ما لم يثبت أصلُ التداوي به في الرقية فلا تجوز فيه التجارب.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[656.0, "3. külliye, o külliyenin tersidir:"], [658.7, "<b>3. külliye: Rukyede onunla tedavinin aslı sabit olmayan her şeyde tecrübeler caiz değildir.<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[694.0, "أقول وبالله التوفيق: وهذا عكسُ الكلّيّة التي قبلها؛"], [699.0, "لأنّ بعض الرُّقاة ـ هداه الله ـ يأتينا بأشياء يزعم أنها مؤثّرةٌ على الجنّ،"], [705.0, "وإذا نظرنا إلى أصلها لم نجد لأصلها ـ لأصل التداوي بها ـ دليلًا،"], [709.0, "لا من كتاب الله عز وجل،"], [711.0, "ولا من سنّة رسوله صلى الله عليه وسلم،"], [714.0, "بل ولا من فعل السلف الصالح؛"], [717.0, "كالتداوي بجلد الذئب. فإنّ بعض الرُّقاة أو بعض العامّة يزعم أنه ممّا ينفع في طرد الجانّ الملابس،"], [730.0, "فإذا سألناهم عن دليلهم قالوا كلمتهم المشهورة:"], [735.0, "«جُرِّب ونفع». فنقول: إنّ مثل هذه التجارب لا نقبلها أبدًا."], [742.0, "لماذا؟ لأنه لم يثبت أصلُ التداوي بجلد الذئب."]], "tr": [[694.0, "Tevfik Allah'tandır, derim ki: Bu, ondan önceki külliyenin tersidir."], [699.0, "Çünkü rukyecilerin bazısı —Allah ona hidayet versin— bize cinler üzerinde etkili olduğunu iddia ettiği birtakım şeyler getirir."], [706.5, "Onların aslına baktığımızda, asıllarına —onlarla tedavinin aslına— ne Allah Azze ve Celle'nin Kitabı'ndan, ne Resûlü sallallâhu aleyhi ve sellem'in sünnetinden, hatta ne de selef-i sâlihînin fiilinden bir delil buluruz;"], [717.0, "kurt derisiyle tedavi gibi. Rukyecilerin bazısı veya halkın bazısı onun (bedene) bulaşmış cini kovmada faydalı olduğunu iddia eder."], [730.7, "Onlara delillerini sorduğumuzda meşhur sözlerini söylerler:"], [735.0, "\"Denendi ve fayda verdi.\" Biz de deriz ki:"], [737.6, "Bu gibi tecrübeleri asla kabul etmeyiz."], [742.0, "Neden? Çünkü kurt derisiyle tedavinin aslı sabit olmamıştır."]]}, {"reader": false, "ar": [[747.0, "فلو أنّ الدليل من القرآن أو السنّة أثبت أنّ جلد الذئب ممّا ينفع،"], [753.0, "فحينئذٍ لك الحقّ أيها القارئ أن تتخيّر بين جلود الذئاب ومواضع الجلد:"], [758.0, "ما تراه نافعًا للعين،"], [760.0, "وما تراه نافعًا للمسّ،"], [762.0, "وما تراه نافعًا للسحر."], [764.0, "لكنك تجرّب في أمرٍ لم يثبت أصلُ التداوي به،"], [767.9, "فإنّ هذه تجربةٌ غير مقبولة؛"], [770.0, "لأنّ الأمر غيب، وسببيّةُ الإصابة والتأثير أيضًا غيب،"], [778.0, "وما كان غيبيًّا فيكون توقيفيًّا على النصّ."], [782.0, "وقد ذكرتُ لكم سابقًا بأنّ الأدواءَ الروحيّة المعنويّة دواؤها توقيفيٌّ على النصّ."]], "tr": [[747.0, "Eğer Kur'an'dan veya sünnetten bir delil kurt derisinin faydalı olduğunu isbat etseydi, o zaman ey rukyeci, kurt derileri ve derinin yerleri arasında seçim yapmaya hakkın olurdu:"], [758.0, "Nazara faydalı gördüğünü, messe faydalı gördüğünü, sihre faydalı gördüğünü (seçerdin)."], [764.0, "Fakat sen tedavi aslı sabit olmayan bir şeyde tecrübe yapıyorsun;"], [767.9, "bu makbul olmayan bir tecrübedir."], [770.0, "Çünkü mesele gaybdır; (hastalığın) isabet etmesinin ve etkinin sebebiyeti de gaybdır;"], [778.6, "gaybî olan da nassa bağlıdır (tevkîfîdir)."], [782.0, "Daha önce size, manevî ruhî hastalıkların devasının nassa bağlı olduğunu zikretmiştim."]]}, {"reader": false, "ar": [[796.0, "ولا حقّ له أن يقيس تجربته على تجربة الراقي الذي يُفصِّل بين آيات القرآن وتأثيرها؛"], [808.0, "لأنّ تلك التجربة لم يثبت أصلُ التداوي بها،"], [813.3, "والتجربة الأخرى قد ثبت أصلُ التداوي بها،"], [819.0, "فهذا قياسٌ مع الفارق،"], [821.3, "والمتقرّر في القواعد أنّ القياس مع الفارق باطل."], [826.0, "وكذلك التداوي بالملح كما بيّنتُ لكم؛"], [829.0, "فإنهم يزعمون أنّ البيت إذا عُمِّم بالماء والملح أنّ الشياطين تنفر منه."], [836.0, "فنقول: إنّ نفور الشياطين وخروجها أمرٌ غيبيّ،"], [840.0, "ولم يثبت أصلُ التداوي بالملح،"], [844.0, "فلا نقبل هذه التجربة أبدًا."]], "tr": [[796.0, "Onun, kendi tecrübesini Kur'an ayetleri ve etkileri arasında ayrım yapan rukyecinin tecrübesine kıyas etmeye hakkı yoktur."], [808.0, "Çünkü o tecrübede tedavinin aslı sabit değildir, öteki tecrübede ise tedavinin aslı sabittir."], [814.7, "Bu, farklı şeyler arasında yapılan bir kıyastır (kıyâs mea'l-fârık);"], [820.8, "kaidelerde yerleşik olan da farklı şeyler arasındaki kıyasın bâtıl olduğudur."], [826.0, "Size açıkladığım gibi tuzla tedavi de böyledir."], [829.0, "Ev su ve tuzla baştan başa serpildiğinde şeytanların ondan kaçtığını iddia ederler."], [836.0, "Biz de deriz ki: Şeytanların kaçması ve çıkması gaybî bir iştir;"], [840.8, "tuzla tedavinin aslı da sabit olmamıştır."], [844.8, "Bu tecrübeyi asla kabul etmeyiz."]]}, {"reader": false, "ar": [[849.0, "نعم، لو أنّ أصل التداوي بالملح ثبت في الكتاب أو السنّة،"], [855.0, "لقلنا بأنّ لك الحقّ أن تتخيّر بين أنواع الملح:"], [860.5, "البحريّ أو البرّيّ أو النباتيّ أو نحو ذلك،"], [864.7, "لك الحقّ في ذلك."], [866.4, "لكن لم يثبت أصلُ التداوي به،"], [869.0, "فنحن نرفض التجارب، أو دخولَ التجارب،"], [871.2, "في هذا الأمر؛ لأنّ دخول التجارب ـ أيها الأحبّة ـ والله والله والله سيفتح علينا بابًا من أبواب البدع لا مخرج لنا منه."]], "tr": [[849.0, "Evet, eğer tuzla tedavinin aslı Kitap'ta veya sünnette sabit olsaydı, tuz türleri arasında —deniz tuzu, kaya tuzu, bitki tuzu ve benzeri— seçim yapmaya hakkın olduğunu söylerdik;"], [866.4, "buna hakkın olurdu. Fakat onunla tedavinin aslı sabit olmamıştır."], [869.4, "Bu yüzden bu işte tecrübeleri, yani tecrübelerin girmesini reddediyoruz."], [872.3, "Çünkü ey kardeşler, tecrübelerin girmesi —vallahi, vallahi, vallahi— bize bid'at kapılarından, içinden çıkamayacağımız bir kapı açacaktır."]]}]}, {"ts": "14:44", "title": "3. Külliye (devam): \"Denendi ve fayda verdi\" sözü · \"Şirk olmadıkça rukyelerde beis yoktur\" hadisi", "paras": [{"reader": false, "ar": [[884.0, "لأنّ هذا سيقول: تجربةُ ملحي نافعة،"], [889.0, "جُرِّبت ونفعت، بينما يقول الآخر:"], [892.3, "تجربةُ السكّر نفعت، بينما يأتينا الثالث يقول:"], [900.6, "أنا جرّبتُ تعميمَ البيت بالرمل ونفع."], [904.0, "ولا حقّ لصاحب الملح أن يرفض تجاربَ هؤلاء مهما كانت تجاربهم؛"], [911.0, "لأنّ تجاربهم وتجربتَه تتّفقان في أنها لا أصلَ لها."], [916.0, "وأمّا مسألة «جُرِّب ونفع» فإنّ كلّ إنسانٍ يستطيع أن يحكم على تجربته بأنها تجربةٌ نافعة،"], [927.0, "والشيطان له مدخلٌ عظيمٌ في هذا النفع؛"], [932.0, "لأنه يُضعف أثرَه عن أهل البيت إذا وُجدت بدعة،"], [938.0, "ليُقنع القارئَ وأهلَ البيت بسلامة هذه التجربة."]], "tr": [[884.0, "Çünkü bu, \"Benim tuz tecrübem faydalıdır, denendi ve fayda verdi\" diyecek;"], [889.5, "öteki \"Şeker tecrübesi fayda verdi\" diyecek;"], [892.3, "üçüncüsü de bize gelip \"Ben evi baştan başa kumla serpmeyi denedim ve fayda verdi\" diyecek."], [904.0, "Tuz sahibinin, tecrübeleri ne olursa olsun, bunların tecrübelerini reddetmeye hakkı yoktur;"], [911.0, "çünkü onların tecrübeleri ile onun tecrübesi, asılsız olmakta birleşir."], [916.0, "\"Denendi ve fayda verdi\" meselesine gelince, her insan kendi tecrübesinin faydalı bir tecrübe olduğuna hükmedebilir."], [927.0, "Şeytanın bu faydada büyük bir payı vardır;"], [932.0, "çünkü bir bid'at bulunduğunda, rukyeciyi ve ev halkını bu tecrübenin doğruluğuna ikna etmek için ev halkı üzerindeki etkisini zayıflatır."]]}, {"reader": false, "ar": [[943.0, "فسدًّا لباب الإحداث والابتداع في دين الله عز وجل نقول بهاتين الكلّيّتين:"], [952.0, "إننا لا نُقفل بابَ التجارب مطلقًا كما قاله بعضهم،"], [958.0, "ولا نفتح بابَ التجارب مطلقًا كما قاله بعضهم،"], [962.0, "وإنما ننظر فيما يُتداوى به؛"], [965.0, "فإن ثبت أصلُ التداوي به في النصّ الصحيح الصريح،"], [969.0, "وله أنواعٌ وأجزاءٌ وأقسام،"], [971.0, "فلك الأحقّيّةُ الكاملة أن تتخيّر من أنواعه للحالات كما تشاء،"], [977.8, "وكما تقتضيه عليك خبرتُك ومعرفتك."], [983.0, "وأمّا إذا كان أصلُ التداوي لم يثبت بهذا الشيء،"], [988.0, "فلا حقّ لأحدٍ أبدًا أن يقول: جُرِّب ونفع."]], "tr": [[943.0, "Allah Azze ve Celle'nin dininde ihdas ve bid'at kapısını kapatmak için bu iki külliyeyle deriz ki:"], [952.0, "Bazılarının dediği gibi tecrübe kapısını mutlak olarak kapatmayız;"], [955.9, "bazılarının dediği gibi tecrübe kapısını mutlak olarak açmayız da."], [961.3, "Bilakis kendisiyle tedavi olunan şeye bakarız:"], [965.0, "Eğer onunla tedavinin aslı sahih ve sarih nasta sabit olmuşsa ve onun türleri, cüzleri ve kısımları varsa, onun türlerinden hâllere göre dilediğin gibi, tecrübe ve bilgin neyi gerektiriyorsa ona göre seçim yapmaya tam hakkın vardır."], [984.1, "Ama bu şeyle tedavinin aslı sabit olmamışsa, hiç kimsenin asla \"Denendi ve fayda verdi\" demeye hakkı yoktur."]]}, {"reader": false, "ar": [[992.0, "وأمّا ما يستدلّون به من قول النبيّ صلى الله عليه وسلم:"], [999.0, "«لا بأس بالرُّقى ما لم تكن شركًا»،"], [1003.0, "فنقول: ليس للقارئ الحقّ أن يُدخل ما أحدثه في مسمّى الرقية؛"], [1010.0, "أثبِتْ أنّ ما أحدثتَه رقية،"], [1012.3, "ثم أقول حينئذٍ: لا بأس بالرقى."], [1015.0, "أمّا أن يُحدث كلُّ راقٍ ما يشاء في باب الرقية ممّا لا دليل عليه لا أصلًا ولا وصفًا،"], [1026.0, "ثم يقول: أدخِلوا تجربتي هذه في حديث النبيّ صلى الله عليه وسلم،"], [1031.0, "وقل: لا بأس بالرقى!"], [1033.0, "هو لم يقل: لا بأس بالمحدَثات في الرقى ما لم تكن شركًا،"], [1037.0, "وإنما قال: «لا بأس بالرقى»،"], [1040.0, "أي: التي تدخل في مسمّى الرقية شرعًا،"], [1044.0, "لا بأس بها ما لم تكن شركًا."]], "tr": [[992.0, "Peygamber sallallâhu aleyhi ve sellem'in \"Şirk olmadıkça rukyelerde bir beis yoktur\" sözünü delil getirmelerine gelince, deriz ki:"], [1003.6, "Rukyecinin, ihdas ettiği şeyi rukye ismine dahil etmeye hakkı yoktur."], [1010.0, "Önce ihdas ettiğin şeyin rukye olduğunu isbat et, ondan sonra \"Rukyelerde beis yoktur\" derim."], [1015.0, "Ama her rukyecinin rukye babında, ne aslen ne vasfen delili olmayan dilediği şeyi ihdas etmesi, sonra da \"Bu tecrübemi Peygamber sallallâhu aleyhi ve sellem'in hadisine dahil edin ve 'Rukyelerde beis yoktur' de\" demesi (olmaz)!"], [1033.0, "O, \"Şirk olmadıkça rukyelerdeki muhdes şeylerde beis yoktur\" demedi;"], [1038.2, "\"Rukyelerde beis yoktur\" dedi; yani şer'an rukye ismine giren rukyelerde, şirk olmadıkça beis yoktur."]]}, {"reader": false, "ar": [[1048.0, "فهذا الإجمالُ لا بدّ أن يكون محمولًا على ما كان مستقرًّا في أدلّة الوحي،"], [1055.0, "وتصرّفات الصحابة، وعمل السلف الصالح،"], [1057.0, "وإلّا فإنّ إطلاق الباب في مثل هذا الأمر الغيبيّ سوف يكون سببًا لضلالٍ عظيم،"], [1065.3, "ومحدَثاتٍ كبيرة، وبدعٍ لا طاقةَ لنا في إغلاق أبوابها أبدًا."]], "tr": [[1048.0, "Bu mücmel ifadenin, vahyin delillerinde, sahabenin tasarruflarında ve selef-i sâlihînin amelinde yerleşik olana hamledilmesi gerekir."], [1055.8, "Aksi hâlde böyle gaybî bir işte kapıyı serbest bırakmak, büyük bir sapkınlığa, büyük muhdes şeylere ve kapılarını asla kapatmaya gücümüzün yetmeyeceği bid'atlere sebep olacaktır."]]}]}, {"ts": "17:54", "title": "3. Külliye (devam): Elektrik şokuyla tedavi", "paras": [{"reader": false, "ar": [[1074.0, "ومنها كذلك: الصعقُ بالكهرباء؛"], [1076.0, "فإننا إذا حرّمناه مع عظيم خطر دخول الشحنة الكهربائيّة في بدن المصروع،"], [1083.0, "وأنها ربما تُفضي إلى قتله أو إلى تعطّل حاسّةٍ من حواسّه،"], [1092.0, "لا سيّما وأنّ الذين يعالجون بها لا يعرفون مقدارَ ما في الجسد أصالةً من الكهرباء،"], [1100.0, "ولا يعرفون المقدارَ الذي يناسب ذلك الجسد."], [1104.0, "فالعلاج بالصدمات الكهربائيّة له طبُّه وأصوله وقواعده التي تُدرَس بالسنوات الطويلة،"], [1112.0, "ثم يأتينا جاهلٌ معه سلكٌ قد علّقه على رقبة المصروع أو رجله،"], [1121.0, "ثم يُدخل الكهرباء في جسده كما يشاء،"], [1124.0, "محتجًّا بأنّ الأطبّاء الجسديّين يعالجون ببعض الصدمات أو الشحنات الكهربائيّة!"], [1131.0, "فنقول: أين هذا من هذا؟"], [1132.0, "فإن قال: جرّبناه ونفع،"], [1137.0, "فنقول: إنّ هذه التجربة فيما لم يثبت أصلُ التداوي به."], [1146.0, "فهذه الكلّيّة والتي قبلها ـ والله ـ تسدّ عنّا أبوابًا من الشرّ،"], [1156.0, "أبوابًا من الشرّ خطيرة."]], "tr": [[1074.0, "Bunlardan biri de elektrikle şok vermektir."], [1076.0, "Biz onu, elektrik yükünün sar'alının bedenine girmesinin büyük tehlikesiyle ve bunun belki onun ölümüne veya duyularından birinin işlemez hâle gelmesine yol açabileceğiyle birlikte haram sayıyoruz."], [1087.8, "Özellikle onunla tedavi edenler, bedende aslen ne kadar elektrik bulunduğunu da, o bedene uygun miktarı da bilmezler."], [1097.3, "Elektrik şokuyla tedavinin, uzun yıllar boyunca okutulan kendine has bir tıbbı, usûlü ve kaideleri vardır."], [1104.0, "Sonra bize bir cahil gelir;"], [1108.1, "yanında sar'alının boynuna veya ayağına bağladığı bir tel vardır;"], [1116.1, "sonra bedene dilediği gibi elektrik verir ve beden doktorlarının bazı elektrik şoklarıyla veya yükleriyle tedavi ettiklerini delil getirir!"], [1131.0, "Biz de deriz ki: Bu nerede, o nerede?"], [1132.0, "Eğer \"Denedik ve fayda verdi\" derse, deriz ki:"], [1137.7, "Bu, tedavi aslı sabit olmayan bir şeydeki tecrübedir."], [1146.0, "Bu külliye ve ondan önceki —vallahi— bizden şer kapılarını, tehlikeli şer kapılarını kapatır."]]}]}, {"ts": "19:19", "title": "4. Külliye: Rukyeci şer'î vasıfları ne kadar çok toplarsa rukyesi o kadar tam ve mükemmel olur", "paras": [{"reader": false, "ar": [[1159.0, "ومن الكلّيّات أيضًا: كلّما كان الراقي أجمعَ للصفات الشرعيّة كانت رقيتُه أشدَّ أثرًا."], [1172.0, "كلّما كان الراقي أجمعَ للصفات الشرعيّة ـ أو نقول:"], [1178.0, "كانت رقيتُه أتمَّ وأكمل."], [1180.0, "كلّما كان الراقي أجمعَ للشروط ـ أو للصفات الشرعيّة ـ كانت رقيتُه أتمَّ وأكمل."], [1191.0, "أُعيدها مرةً ثالثة، طيّب:"], [1192.7, "<b>كلّما كان الراقي أجمعَ للصفات الشرعيّة كانت رقيتُه أتمَّ وأكمل.<\/b>"]], "tr": [[1159.0, "Külliyelerden biri de şudur: Rukyeci şer'î vasıfları ne kadar çok toplarsa rukyesi o kadar etkili olur."], [1172.0, "Rukyeci şer'î vasıfları ne kadar çok toplarsa —ya da şöyle diyelim— rukyesi o kadar tam ve mükemmel olur."], [1180.0, "Rukyeci şartları —ya da şer'î vasıfları— ne kadar çok toplarsa rukyesi o kadar tam ve mükemmel olur."], [1191.0, "Üçüncü kez tekrar ediyorum, peki:"], [1192.7, "<b>4. külliye: Rukyeci şer'î vasıfları ne kadar çok toplarsa rukyesi o kadar tam ve mükemmel olur.<\/b>"]]}, {"reader": false, "ar": [[1200.0, "أقول وبالله التوفيق: وهذه الشروط التي ينصّ عليها أهلُ السنّة والجماعة منها شروطُ صحّةٍ ومنها شروطُ كمال."], [1213.0, "ونعني بشروط الصحّة: تلك الشروطَ التي لا توصف رقيةُ الراقي بأنها مشروعة إلا إذا كانت متوفّرةً فيه."], [1226.0, "وأمّا شروط الكمال: فهي تلك الشروط التي تتعلّق بتمام أثر الرقية وكمال نفع الرقية،"], [1237.0, "لكن لو فقدها الراقي فإنها لا تقلب رقيتَه من رقيةٍ جائزةٍ إلى رقيةٍ ممنوعةٍ محرّمة."]], "tr": [[1200.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat'in nassan belirttiği bu şartların bir kısmı sıhhat şartları, bir kısmı kemal şartlarıdır."], [1217.0, "Sıhhat şartlarından kastımız, rukyecide bulunmadıkça rukyesinin meşru olarak nitelenemeyeceği şartlardır."], [1226.0, "Kemal şartları ise rukyenin etkisinin tamlığı ve faydasının mükemmelliğiyle ilgili şartlardır;"], [1235.7, "fakat rukyeci onları kaybederse, bu, rukyesini caiz bir rukyeden yasak, haram bir rukyeye çevirmez."]]}, {"reader": false, "ar": [[1246.0, "فمن هذه الشروط: الإسلام،"], [1249.0, "الإسلام، وسيأتينا الكلامُ على تفاصيله بعد قليل؛"], [1256.0, "لأنّ العلماء قد اختلفوا في إسلام الراقي:"], [1261.0, "أهو شرطُ صحّةٍ أم شرطُ كمال؟"], [1266.0, "ومنها كذلك: أن يكون من أهل السنّة،"], [1270.0, "وهذا من شروط الكمال؛"], [1273.0, "فلا ينبغي أن يخضع الإنسانُ للرقية عند أهل البدع،"], [1280.0, "من الرافضة والأحباش والأشاعرة وغيرهم من أهل البدع."], [1286.0, "وأن يكون سليمَ المعتقد،"], [1288.9, "وهو من شروط الكمال."]], "tr": [[1246.0, "Bu şartlardan biri İslâm'dır, İslâm."], [1250.4, "Biraz sonra ayrıntıları hakkında söz gelecek;"], [1256.0, "çünkü âlimler rukyecinin Müslüman olmasının bir sıhhat şartı mı yoksa kemal şartı mı olduğunda ihtilaf etmişlerdir."], [1266.0, "Bunlardan biri de Ehl-i Sünnet'ten olmasıdır;"], [1269.4, "bu kemal şartlarındandır. Bu yüzden insanın Râfıza, Ahbâş, Eş'arîler ve diğer bid'at ehli gibi bid'at ehlinin yanında rukyeye girmesi uygun değildir."], [1286.0, "(Bir diğeri de) akîdesinin sağlam olmasıdır; bu da kemal şartlarındandır."]]}, {"reader": false, "ar": [[1293.0, "وأن يكون تقيًّا في خاصّة نفسه،"], [1298.0, "التقوى التي تحمله على فعل مأمورات الشرع وترك منهيّاته؛"], [1309.0, "فلا يُرى عليه شيءٌ من الذنوب ولا المعاصي،"], [1314.0, "فلا يكون حالقًا للحيته،"], [1316.7, "ومُسبِلًا لثيابه، أو فاعلًا لبعض الموبقات أو المحرّمات،"], [1324.0, "ولا يكون مشهورًا بشيءٍ من الفسق،"], [1327.4, "ولا يُرى عليه شيءٌ من الآثار المُنبِئة عن فساد باطنه."], [1333.0, "وأن يكون صالحًا في خاصّة نفسه،"], [1337.1, "وأن يكون عدلًا ولو في الظاهر."]], "tr": [[1293.0, "(Bir diğeri) kendi nefsinde takva sahibi olmasıdır;"], [1296.8, "onu şeriatın emirlerini yapmaya ve yasaklarını terk etmeye sevk eden bir takva."], [1309.0, "Üzerinde günahlardan ve isyanlardan hiçbir şey görülmemelidir:"], [1312.8, "Sakalını tıraş eden, elbisesini (kibirle) yerde sürüyen veya bazı helak edici günahları ya da haramları işleyen biri olmamalı;"], [1325.1, "fısktan bir şeyle meşhur olmamalı ve üzerinde bâtınının bozukluğunu haber veren izlerden hiçbir şey görülmemelidir."], [1333.0, "(Bir diğeri) kendi nefsinde salih olması ve zahiren de olsa adil olmasıdır."]]}, {"reader": false, "ar": [[1343.0, "وأن يكون ذا قصدٍ سليمٍ في نفع إخوانه،"], [1349.0, "بأن لا يكون همُّه فقط جيوبَهم،"], [1354.0, "ولا ما يستنزفه من أموالهم،"], [1360.0, "وإنما يكون ذا قصدٍ حسن."], [1362.0, "وستأتينا كلّيّةٌ بعد قليل بأنّ التداوي بالأمر الشرعيّ يختلف أثرُه باختلاف القصد والنيّة؛"], [1377.0, "فهو ليس كالعلاج الحسّيّ الذي يتعاطاه كلُّ أحدٍ وينفع كلَّ أحد،"], [1384.0, "بل هو علاجٌ نبويّ،"], [1386.2, "والأدوية النبويّة في الأعمّ الأغلب إنما يكون تأثيرها في حقّ من يتعاطاها بتوكّلٍ وجزمٍ وحزمٍ ويقينٍ بموعود النبيّ صلى الله عليه وسلم في الشفاء بها،"], [1402.0, "وإلّا لما كان لها أثر."]], "tr": [[1343.0, "(Bir diğeri) kardeşlerine fayda vermede niyetinin sağlam olmasıdır;"], [1349.0, "derdi sadece onların cepleri ve mallarından sömürdüğü şey olmamalı, bilakis güzel bir niyet sahibi olmalıdır."], [1362.0, "Biraz sonra bize, şer'î şeyle tedavinin etkisinin niyet ve kasdın farklılığına göre değiştiğine dair bir külliye gelecek."], [1377.0, "Çünkü o, herkesin kullandığı ve herkese fayda veren hissî tedavi gibi değildir;"], [1384.0, "bilakis nebevî bir tedavidir. Nebevî ilaçların etkisi de çoğunlukla ancak onları tevekkülle, kesin bir kararlılık, azim ve Peygamber sallallâhu aleyhi ve sellem'in onlarla şifa vaadine yakîn ile kullanan kimse hakkında olur;"], [1401.6, "aksi hâlde onların bir etkisi olmazdı."]]}, {"reader": false, "ar": [[1404.0, "فعلى الراقي أن يُحسن نيّتَه،"], [1407.3, "وأن يقصد نفعَ المسلم،"], [1410.0, "ولا يجعل همَّه المالَ والأجرة؛"], [1413.0, "وذلك ليكون أقربَ إلى الانتفاع بقراءته."], [1417.0, "والخلاصة من ذلك أنك ينبغي لك أن تختار الراقيَ الذي حسُنت صفاتُه باطنًا وظاهرًا، أعني: الصفات الشرعيّة."]], "tr": [[1404.0, "Öyleyse rukyeci niyetini güzelleştirmeli, Müslümana fayda vermeyi kastetmeli, derdini mal ve ücret yapmamalıdır;"], [1413.0, "böylece okumasından faydalanılmaya daha yakın olur."], [1417.0, "Bunun özeti şudur: İç ve dış vasıfları —yani şer'î vasıfları— güzel olan rukyeciyi seçmen gerekir."]]}]}, {"ts": "23:51", "title": "4. Külliye (devam): Meseleler: Bir cinsin diğerine rukye yapması · Rukyeci ile yabancı kadın", "paras": [{"reader": false, "ar": [[1431.0, "وهنا مسائلُ على هذه الكلّيّة؛"], [1434.0, "منها: ما حكم رقية أحد الجنسين للآخر؟"], [1439.0, "الجواب: جائزٌ لا بأس به،"], [1441.0, "إلا أنّ الأفضل أن يتولّى رقيةَ النساء النساءُ ـ ماشي ولا لا؟"], [1448.0, "ـ وأن يتولّى رقيةَ الرجال الرجالُ."], [1455.0, "لكن لو أنّ امرأةً تولّت رقيةَ رجل،"], [1458.5, "أو رجلٌ تولّى رقيةَ امرأة،"], [1461.0, "فإنّ ذلك جائز، مع أخذ كافّة الاحتياطات في عدم وقوع شيءٍ من الفتنة من أحدهما بالآخر."]], "tr": [[1431.0, "Burada bu külliyeye dair meseleler var."], [1434.0, "Bunlardan biri: İki cinsten birinin diğerine rukye yapmasının hükmü nedir?"], [1439.0, "Cevap: Caizdir, bunda beis yoktur."], [1441.0, "Ancak efdal olan, kadınlara kadınların —tamam mı, değil mi?— erkeklere de erkeklerin rukye yapmasıdır."], [1455.0, "Fakat bir kadın bir erkeğe veya bir erkek bir kadına rukye yaparsa, birinin diğeri sebebiyle bir fitneye düşmemesi için bütün tedbirler alınmak şartıyla bu caizdir."]]}, {"reader": false, "ar": [[1470.0, "ولذلك فالأفضل أن ترقي المرأةُ نفسَها،"], [1473.6, "أو ترقيَها امرأةٌ مثلُها،"], [1476.0, "أو يرقيَها أحدُ محارمها."], [1479.0, "وإن كان لا بدّ من رقية الأجنبيّ فلا بأس بها،"], [1483.3, "لكن لا يحلّ لها أن تكشف له شيئًا من جسدها،"], [1488.0, "ولا أن يأمرها بشيءٍ من ذلك،"], [1490.6, "ولا يحلّ له أيضًا أن يمدّ يدَه على رأسها أو على كتفيها أو على صدرها،"], [1497.0, "كما يفعله بعض القرّاء ممّن لا يخافون الله، ولا يخلو بها <span class=\"q\">؟ 25:02<\/span>."]], "tr": [[1470.0, "Bu yüzden efdal olan, kadının kendi kendine rukye yapması, ya da kendisi gibi bir kadının veya mahremlerinden birinin ona rukye yapmasıdır."], [1475.4, "Yabancı bir erkeğin rukye yapması kaçınılmazsa bunda beis yoktur;"], [1479.0, "fakat kadının ona bedeninden bir şey açması helal değildir, onun da kadına bunlardan bir şeyi emretmesi helal değildir."], [1489.3, "Allah'tan korkmayan bazı rukyecilerin yaptığı gibi elini onun başına, omuzlarına veya göğsüne uzatması da helal değildir;"], [1498.9, "onunla baş başa da kalmaz <span class=\"q\">؟<\/span>."]]}, {"reader": false, "ar": [[1503.8, "ـ كلُّ ما حرُم ـ المسألة الثانية تحت الكلّيّة:"], [1506.0, "كلُّ ما حرُم بين الأجانب فيحرم بين القارئ والأجنبيّة عنه."], [1519.0, "فما كان محرّمًا على الرجال الأجانب والنساء الأجانب فإنه يحرم على الراقي تعاطيه:"], [1529.0, "فلا يجوز للأجنبيّ أن يمسّ امرأةً أجنبيّةً عنه،"], [1534.0, "فكذلك الراقي. ولا يجوز للأجنبيّ أن يخلو بامرأةٍ أجنبيّةٍ عنه،"], [1541.0, "فكذلك الراقي. ولا يجوز للأجنبيّ أن يسرح بالكلام العاطفيّ بعيدًا عن ضرورته أو حاجته في الحديث معها،"], [1554.0, "فكذلك الراقي. ولا يجوز للأجنبيّ أن يرى من المرأة الأجنبيّة شيئًا، فكذلك الراقي."]], "tr": [[1503.8, "—Haram olan her şey— Külliyenin altındaki ikinci mesele:"], [1506.0, "Yabancılar arasında haram olan her şey, rukyeci ile kendisine yabancı olan kadın arasında da haramdır."], [1520.5, "Yabancı erkeklere ve yabancı kadınlara haram olan şeyi yapmak rukyeciye de haramdır:"], [1529.0, "Yabancı bir erkeğin kendisine yabancı bir kadına dokunması caiz değildir;"], [1534.0, "rukyeci de böyledir. Yabancı bir erkeğin kendisine yabancı bir kadınla baş başa kalması caiz değildir;"], [1542.0, "rukyeci de böyledir. Yabancı bir erkeğin, onunla konuşmadaki zaruret veya ihtiyacının dışına çıkarak duygusal sözlere dalması caiz değildir;"], [1553.4, "rukyeci de böyledir. Yabancı bir erkeğin yabancı kadından bir şey görmesi caiz değildir; rukyeci de böyledir."]]}, {"reader": false, "ar": [[1565.0, "ولا حقّ للراقي أن يقيس نفسه على طبيب الأبدان؛"], [1570.0, "فإنّ طبّ الأبدان طبٌّ حسّيّ،"], [1572.5, "قد يضطرّ فيه الطبيبُ إلى الكشف عن شيءٍ من العورات كما هو معلوم،"], [1579.0, "فيجوز لطبيب الأبدان ما تقتضيه الضرورةُ والحاجة من ذلك الحرام."], [1585.0, "وأمّا الراقي فإنه طبيبٌ بطبٍّ غيبيٍّ أثرُه،"], [1592.0, "غيبيٍّ ـ إيش؟ ـ أثرُه، فحينئذٍ لا حقّ له أن يجعل طبَّه مبنيًّا على مسّ جسد المرأة،"], [1604.0, "أو على مسّ كتفيها،"], [1606.0, "أو على فتح صدرها،"], [1608.0, "أو على مباشرة النفث لشيءٍ من أجزاء جسدها؛"], [1613.0, "فإنّ كلّ ذلك ممّا لا أصلَ له في الشرع،"], [1616.0, "وممّا يفتح بابَ الفتنة والدعوةِ إلى الفواحش؛"], [1621.0, "فإنّ الراقي عملُه هو القراءة والنفث فقط، لا غيرُ ذلك."]], "tr": [[1565.0, "Rukyecinin kendini beden doktoruna kıyas etmeye hakkı yoktur."], [1570.0, "Çünkü beden tıbbı hissî bir tıptır;"], [1572.5, "bilindiği gibi doktor orada avret yerlerinden bir şeyi açmak zorunda kalabilir."], [1577.5, "Bu yüzden beden doktoruna, o haramdan zaruret ve ihtiyacın gerektirdiği kadarı caiz olur."], [1585.0, "Rukyeci ise etkisi gaybî olan bir tıbbın doktorudur;"], [1593.1, "etkisi —neymiş?— gaybîdir. O hâlde tıbbını kadının bedenine dokunmaya, omuzlarına dokunmaya, göğsünü açmaya veya bedeninin bir kısmına doğrudan üflemeye dayandırmaya hakkı yoktur."], [1613.0, "Çünkü bunların hepsi şeriatta aslı olmayan, fitne kapısını ve hayâsızlıklara davet kapısını açan şeylerdendir."], [1621.0, "Rukyecinin işi sadece okumak ve üflemektir, başka bir şey değil."]]}]}, {"ts": "27:08", "title": "Meseleler: Müslümanın kâfire ve kâfirin Müslümana rukye yapması", "paras": [{"reader": false, "ar": [[1628.0, "ومن المسائل أيضًا: ما حكم رقية المسلم للكافر؟"], [1634.0, "الجواب: لا خلاف بين الفقهاء في جواز رقية المسلم للكافر،"], [1642.0, "واستدلّوا على ذلك بحديث أبي سعيدٍ الذي سيتكرّر معنا كثيرًا،"], [1648.0, "في رقية الصحابيّ لذلك اللديغ،"], [1651.6, "وهو سيّد الحيّ. والحديث في الصحيح،"], [1656.4, "وسيأتينا بألفاظه بعد قليل بإذن الله عز وجل."], [1662.0, "وقد أقرّ النبيّ صلى الله عليه وسلم هذه الرقية،"], [1666.0, "والمتقرّر في القواعد أنّ إقرار النبيّ صلى الله عليه وسلم حجّةٌ على الجواز."]], "tr": [[1628.0, "Meselelerden biri de şudur: Müslümanın kâfire rukye yapmasının hükmü nedir?"], [1634.0, "Cevap: Müslümanın kâfire rukye yapmasının caiz olduğunda fakihler arasında ihtilaf yoktur."], [1640.3, "Bunun için, bizimle çok tekrarlanacak olan Ebû Saîd hadisini, sahâbînin akrep sokmuş olan o kişiye —ki o kabilenin efendisiydi— rukye yapmasını delil getirmişlerdir."], [1655.0, "Hadis Sahîh'tedir; inşallah biraz sonra lafızlarıyla birlikte gelecek."], [1662.0, "Peygamber sallallâhu aleyhi ve sellem bu rukyeyi onaylamıştır;"], [1665.6, "kaidelerde yerleşik olan da Peygamber sallallâhu aleyhi ve sellem'in takririnin caiz olmaya delil olduğudur."]]}, {"reader": false, "ar": [[1674.0, "ومن المسائل أيضًا: ما حكم رقية الكافر للمسلم؟"], [1680.0, "ما حكم رقية الكافر للمسلم؟"], [1684.0, "أقول: في ذلك خلافٌ بين أهل العلم رحمهم الله تعالى،"], [1690.0, "بين من أجازها وبين من منعها."], [1695.0, "ولكن اتّفق الجميع على أنّ رقية الكافر للمسلم متى ما كان فيها ـ فهمتم ما أقول؟"], [1706.0, "ما أقول؟ أحسن ـ متى ما كان فيها شيءٌ ممّا يخالف الشرع فإنها حرام،"], [1714.0, "سواءٌ من كافرٍ أو من مسلم."], [1719.0, "فإذا كانت الرقية إذا تضمّنت كلامًا شركيًّا،"], [1723.1, "أو استغاثةً بالشياطين، أو كلامًا مجهولًا معناه،"], [1727.2, "لا تصحّ من مسلم،"], [1729.5, "فمن كافرٍ من باب أولى."]], "tr": [[1674.0, "Meselelerden biri de şudur: Kâfirin Müslümana rukye yapmasının hükmü nedir?"], [1680.0, "Kâfirin Müslümana rukye yapmasının hükmü nedir?"], [1684.0, "Derim ki: Bunda ilim ehli —Allah onlara rahmet etsin— arasında, onu caiz görenle yasaklayan arasında ihtilaf vardır."], [1695.0, "Fakat hepsi şunda ittifak etmiştir:"], [1699.0, "Kâfirin Müslümana rukyesinde —ne dediğimi anladınız mı?"], [1706.0, "Ne diyorum? Güzel— şeriata aykırı bir şey bulunduğunda, ister kâfirden ister Müslümandan olsun, o haramdır."], [1719.0, "Rukye şirk içeren bir söz, şeytanlardan yardım dileme veya manası bilinmeyen bir söz içerdiğinde Müslümandan bile sahih olmuyorsa, kâfirden evleviyetle sahih olmaz."]]}, {"reader": false, "ar": [[1733.0, "لكنّ جزئيّة خلافهم رحمهم الله تعالى فيما إذا كانت رقيتُه معلومةَ المعنى وباللفظ الشرعيّ،"], [1746.0, "بما لم يُحرَّف من التوراة أو الإنجيل،"], [1750.7, "أو بالقرآن. والأقرب ـ إن شاء الله ـ أنه لا يجوز،"], [1761.0, "وأنه لا ينبغي أن يتطبّب مسلمٌ في رقيةٍ عند كافر."], [1768.0, "وذلك ـ أيها الأحبّة ـ لأنّ تأثير الرقية يقوى ويضعف بحسب قوّة الراقي واتّصاله بالدين،"], [1785.5, "كما بيّنتُ لكم؛ فإن كان الراقي غيرَ تقيٍّ لم تُفِد رقيتُه،"], [1791.2, "فإنّ كلام الله عز وجل إنما يستفيد منه أهلُ الإيمان وأهلُ التقوى."]], "tr": [[1733.0, "Fakat —Allah onlara rahmet etsin— ihtilaf ettikleri nokta, onun rukyesinin manası bilinen, şer'î lafızla, Tevrat'ın veya İncil'in tahrif edilmemiş kısmıyla ya da Kur'an'la olması durumudur."], [1752.0, "İnşallah en doğruya yakın olan, bunun caiz olmadığı ve bir Müslümanın bir kâfirin yanında rukyeyle tedavi olmasının uygun olmadığıdır."], [1768.0, "Ey kardeşler, bunun sebebi şudur:"], [1771.1, "Size açıkladığım gibi rukyenin etkisi, rukyecinin gücüne ve dine bağlılığına göre kuvvetlenir ve zayıflar."], [1786.0, "Rukyeci takva sahibi değilse rukyesi fayda vermez;"], [1790.5, "çünkü Allah Azze ve Celle'nin kelâmından ancak iman ehli ve takva ehli faydalanır."]]}, {"reader": false, "ar": [[1801.0, "ولذلك كان العلاجُ والتداوي بالقرآن يتفاوت أثرُه بين قارئٍ وقارئٍ من أهل الإسلام،"], [1809.2, "بتفاوت التزامهم بالصفات الشرعيّة من عدمها."], [1813.0, "فليست رقيةُ الطائع مطلقًا كرقية العاصي مطلقًا،"], [1819.0, "وليست رقيةُ من يؤمن بالله ربًّا،"], [1822.8, "وبالإسلام دينًا، وبمحمدٍ صلى الله عليه وسلم رسولًا،"], [1827.0, "كالذي لا يؤمن بشيءٍ من ذلك."], [1830.0, "وليست الرقيةُ بما هو متحقّقٌ أنه من كلام الله <span class=\"ayah\">﴿لَّا يَأْتِيهِ الْبَاطِلُ مِن بَيْنِ يَدَيْهِ وَلَا مِنْ خَلْفِهِ﴾<\/span> <span class=\"ref\">[فصلت: ٤٢]<\/span> كالرقية بالتوراة والإنجيل،"], [1844.0, "التي أثبت النصّ أنّ يد التحريف قد دخلتها،"], [1848.6, "وبدّلت فيها وغيّرت. وليست رقيةُ الفاسق كالصالح."]], "tr": [[1801.0, "Bu yüzden Kur'an'la tedavinin ve şifa aramanın etkisi, Müslümanlardan bir rukyeci ile diğeri arasında, şer'î vasıflara bağlı kalıp kalmamalarındaki farka göre farklılık gösterir."], [1813.0, "Mutlak olarak itaatkâr olanın rukyesi, mutlak olarak âsi olanın rukyesi gibi değildir."], [1820.2, "Rab olarak Allah'a, din olarak İslâm'a ve resul olarak Muhammed sallallâhu aleyhi ve sellem'e iman edenin rukyesi, bunlardan hiçbirine iman etmeyenin rukyesi gibi değildir."], [1830.0, "Allah'ın kelâmı olduğu kesin olan, <span class=\"ayah\">﴿Ona önünden de ardından da bâtıl gelemez﴾<\/span> [Fussılet 42] (kitapla) rukye, nassın tahrif elinin girdiğini, onda değiştirip başkalaştırdığını isbat ettiği Tevrat ve İncil ile rukye gibi değildir."], [1851.0, "Fâsığın rukyesi de salihinki gibi değildir."]]}, {"reader": false, "ar": [[1855.0, "فبما أنّ الرقية يقوى أثرُها ويضعف بحسب إيمان الراقي وتوحيده،"], [1862.7, "وصحّةِ توجّه قلبه وقصده ونيّته،"], [1866.0, "فلا ينبغي أبدًا ـ فلا ينبغي أبدًا ـ أن يخضع المريضُ لراقٍ من الكفّار."], [1874.0, "فإن قيل: قد جُرِّب ونفع،"], [1876.0, "فنقول: إنّ ذلك لا يُنظر له بعين الاعتبار أبدًا؛"], [1883.0, "فإنّ المتقرّر في القواعد أنّ وجود المقاصد لا يدلّ على سلامة الوسائل."]], "tr": [[1855.0, "Madem rukyenin etkisi rukyecinin imanına, tevhidine, kalbinin yönelişinin, kasdının ve niyetinin doğruluğuna göre kuvvetlenir ve zayıflar, o hâlde hastanın kâfirlerden bir rukyeciye teslim olması asla uygun değildir, asla uygun değildir."], [1874.0, "Eğer \"Denendi ve fayda verdi\" denirse, deriz ki:"], [1878.1, "Buna asla itibar gözüyle bakılmaz."], [1883.0, "Çünkü kaidelerde yerleşik olan, maksatların gerçekleşmesinin vasıtaların selametine delalet etmediğidir."]]}, {"reader": false, "ar": [[1891.0, "بل إنّ هناك أمرًا عظيمًا،"], [1894.0, "وهي أنّ المسلم إذا طال زمانُ رقيته عند أهل الإسلام ولم ينتفع،"], [1900.0, "ثم ذهب إلى أهل الكتاب من اليهود والنصارى،"], [1907.0, "وانتفع بمعونة الشيطان، فإنّ ذلك قد يكون مدخلًا لشكّه في الإسلام والقرآن."], [1916.0, "فتجويزُ الرقية عند الكافر بابٌ قد يفتح علينا الردّةَ،"], [1925.0, "أو التشكيكَ في القرآن،"], [1928.0, "أو في صحّة الرقى بالأدعية المشروعة والتعاويذ الصحيحة."], [1934.0, "وقد يكون ذلك سببًا للاقتناع بدينهم؛"], [1939.0, "فإنه لم يجد النفع في الرقية إلا عند أهل هذا الدين،"], [1945.0, "فهذا دليلٌ على صحّة دينهم!"]], "tr": [[1891.0, "Hatta burada büyük bir mesele vardır:"], [1894.0, "Müslüman, Müslümanların yanında rukye görmesi uzun sürüp de faydalanmazsa, sonra Yahudi ve Hristiyanlardan oluşan Ehl-i Kitab'a gidip şeytanın yardımıyla fayda görürse, bu onun İslâm ve Kur'an hakkında şüpheye düşmesine bir giriş kapısı olabilir."], [1916.0, "Kâfirin yanında rukyeyi caiz görmek, bize irtidat, Kur'an hakkında ya da meşru dualar ve sahih sığınma dualarıyla yapılan rukyelerin doğruluğu hakkında şüphe uyandırma kapısını açabilir."], [1934.0, "Bu, onların dinine ikna olmaya da sebep olabilir:"], [1939.0, "\"Rukyede faydayı ancak bu dinin mensuplarında buldu;"], [1943.4, "demek ki bu, onların dininin doğruluğuna delildir!\""]]}, {"reader": false, "ar": [[1948.0, "فهذا فيه تمكينُ الكافر من أخيك المسلم،"], [1952.0, "وفيه فتحٌ لباب التشكيك في كثيرٍ من العقائد،"], [1956.0, "بل وفيه فتحُ بابٍ للردّة والخروج من الإسلام."], [1961.0, "فالذي أرجّحه في هذه المسألة هو حرمةُ الاسترقاء عند الكفرة أيًّا كان دينهم."]], "tr": [[1948.0, "Bunda kâfiri Müslüman kardeşine hâkim kılmak vardır;"], [1952.0, "birçok akîde hakkında şüphe kapısını açmak vardır;"], [1955.5, "hatta irtidat ve İslâm'dan çıkış kapısını açmak vardır."], [1961.0, "Bu meselede tercih ettiğim görüş, dinleri ne olursa olsun kâfirlerin yanında rukye istemenin haram olduğudur."]]}]}, {"ts": "32:52", "title": "Mesele: Rukyeyi kâğıda yazıp silmek ve suyunu içmek", "paras": [{"reader": false, "ar": [[1972.0, "ومن المسائل أيضًا: ما حكمُ كتابة الرقية على ورقٍ ومحوِه وشربِ مائه؟"], [1981.0, "فأقول: جائزٌ لا بأس به ولا حرج فيه."], [1984.0, "فإن قلت: وما برهانُك على هذا؟"], [1987.0, "فأقول: عملُ السلف؛ فإنني لا أحفظ شيئًا مرفوعًا إلى النبيّ صلى الله عليه وسلم،"], [1994.0, "ولكن ثبت عن بعض الصحابة وكثيرٍ من السلف أنهم أجازوا ذلك،"], [1999.5, "شريطةَ أن يكون المكتوبُ عليه شيئًا تتحلّل مادّتُه في الماء؛"], [2008.0, "لا كما يفعله بعض القرّاء من نحت آياتٍ من القرآن على صحنٍ ثم يُراق عليه الماء،"], [2017.0, "ولا يتحلّل شيءٌ من تلك الآيات في الماء."], [2020.0, "بل لا بدّ أن يُكتب بمادّةٍ تتحلّل في الماء،"], [2025.1, "ثم يشرب المريضُ هذا الماء،"], [2028.0, "كأن تُكتب بالزعفران ونحوه ما دام طاهرًا،"], [2032.0, "وسواءٌ كُتبت باليد أو بآلة،"], [2035.0, "إذا خلا ذلك من الأمور المجهولة والكتابات غير المعلومة."]], "tr": [[1972.0, "Meselelerden biri de şudur: Rukyeyi bir kâğıda yazıp silmenin ve suyunu içmenin hükmü nedir?"], [1981.0, "Derim ki: Caizdir, bunda beis ve sakınca yoktur."], [1984.0, "\"Buna delilin nedir?\" dersen, derim ki:"], [1989.0, "Selefin amelidir. Çünkü Peygamber sallallâhu aleyhi ve sellem'e merfû olarak ulaşan bir şey ezberimde yok;"], [1994.4, "fakat sahabenin bazısından ve seleften birçoğundan bunu caiz gördükleri sabit olmuştur."], [1999.5, "Şartı da üzerine yazılan şeyin, maddesi suda çözünen bir şey olmasıdır."], [2008.0, "Bazı rukyecilerin yaptığı gibi, Kur'an ayetlerini bir tabağa oyup sonra üzerine su döktükleri ve o ayetlerden hiçbir şeyin suda çözünmediği şekilde değil."], [2020.0, "Bilakis suda çözünen bir maddeyle yazılması, sonra hastanın bu suyu içmesi gerekir;"], [2026.3, "temiz olduğu sürece zağferan ve benzeriyle yazılması gibi."], [2030.5, "Bu, meçhul şeylerden ve bilinmeyen yazılardan arınmış olduğu takdirde, ister elle ister bir aletle yazılmış olsun (fark etmez)."]]}, {"reader": false, "ar": [[2042.0, "ولذلك قال ابنُ القيّم رحمه الله تعالى،"], [2047.0, "قال: «ورأى جماعةٌ من السلف أن تُكتب له الآياتُ من القرآن ثم يشربها. قال مجاهد: لا بأس أن يُكتب القرآن ويُغسل ويُسقاه المريض. ومثلُه عن أبي قِلابة. ويُذكر عن ابن عباسٍ رضي الله عنهما أنه أمر أن يُكتب لامرأةٍ تعسّر عليها ولادتُها أثرٌ من القرآن، ثم يُغسل وتُسقى. وقال أيّوب رحمه الله تعالى: رأيتُ أبا قِلابة كتب كتابًا من القرآن، ثم غسله بماءٍ، وسقاه رجلًا كان به وجع»."], [2083.7, "انتهى كلامه. وقلتُ لكم سابقًا:"], [2086.0, "إنّ كلّ ما ثبت من عمل السلف فلا يُطلب عليه دليلٌ بخصوصه،"], [2095.0, "اكتفاءً وإحسانًا للظنّ بالسلف."]], "tr": [[2042.0, "Bu yüzden İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [2044.1, "\"Seleften bir topluluk, (hasta) için Kur'an'dan ayetlerin yazılıp sonra onun bunu içmesini uygun görmüştür."], [2047.5, "Mücâhid şöyle dedi: Kur'an'ın yazılıp yıkanması ve (suyunun) hastaya içirilmesinde beis yoktur."], [2058.6, "Benzeri Ebû Kılâbe'den de gelmiştir."], [2063.9, "İbn Abbas'tan —Allah ikisinden razı olsun— doğumu zorlaşan bir kadın için Kur'an'dan bir parçanın yazılmasını, sonra yıkanıp (suyunun) ona içirilmesini emrettiği zikredilir."], [2083.7, "Eyyûb —Allah ona rahmet etsin— şöyle dedi:"], [2084.3, "Ebû Kılâbe'yi Kur'an'dan bir yazı yazıp sonra onu suyla yıkadığını ve bir ağrısı olan bir adama içirdiğini gördüm.\" Sözü bitti."], [2086.0, "Daha önce size, selefin amelinden sabit olan her şey için, onunla yetinerek ve selefe hüsnüzan ederek, ayrıca özel bir delil istenmeyeceğini söylemiştim."]]}]}, {"ts": "34:57", "title": "5. Külliye: Nazarın isabet edebileceği her şeye rukye yapmakta beis yoktur", "paras": [{"reader": false, "ar": [[2097.0, "ومن الكلّيّات أيضًا: كلُّ ما أمكن العينَ إصابتُه ـ كلُّ ما أمكن العينَ أن تصيبه ـ <b>كلُّ ما أمكن العينَ أن تصيبه فلا بأس بالرقية عليه.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[2097.0, "Külliyelerden biri de şudur: Nazarın isabet etmesi mümkün olan her şey —nazarın kendisine isabet etmesi mümkün olan her şey— 5."], [2105.0, "külliye: Nazarın kendisine isabet etmesi mümkün olan her şeye rukye yapmakta beis yoktur. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[2129.0, "فيدخل في ذلك البشرُ والحيوانُ والجماد؛"], [2139.0, "لأنّ الكلّيّة نصّت على أنّ كلّ شيءٍ يمكن أن تصيبه العين فلا بأس بمباشرة الرقية عليه."], [2147.0, "فإن أصابت جسدًا فيُقرأ على الجسد،"], [2151.0, "وإن أصابت حيوانًا فيُقرأ على الحيوان،"], [2155.0, "وإن أصابت سيّارةً فيُقرأ على السيّارة،"], [2159.0, "وإن أصابت أيَّ جمادٍ فإننا نقرأ عليه."], [2164.0, "وذلك لدليلين: دليلٍ عامٍّ ودليلٍ خاصّ."]], "tr": [[2129.0, "Buna insan, hayvan ve cansız varlık dahildir."], [2139.0, "Çünkü külliye, nazarın isabet edebileceği her şeye doğrudan rukye yapmakta beis olmadığını açıkça belirtmiştir."], [2143.5, "Nazar bir bedene isabet ederse bedene okunur;"], [2147.0, "bir hayvana isabet ederse hayvana okunur;"], [2151.7, "bir arabaya isabet ederse arabaya okunur;"], [2157.0, "herhangi bir cansız şeye isabet ederse ona okuruz."], [2164.0, "Bunun iki delili vardır: Genel bir delil ve özel bir delil."]]}, {"reader": false, "ar": [[2172.0, "أمّا الدليلُ العامّ: فالأدلّة التي دلّت على أنّ القرآن والرقية شفاء،"], [2180.0, "فإنها أدلّةٌ مطلقةٌ عن محلٍّ معيّن،"], [2186.0, "والمتقرّر في القواعد أنّ ما ورد مطلقًا فالواجب بقاؤه على إطلاقه،"], [2194.0, "ولا يجوز تقييده إلا بدليل."], [2198.0, "فتلك النصوص الواردة في الاستشفاء بالقرآن الكريم،"], [2202.0, "والوقاية أو العلاج بالأدعية والتعاويذ الشرعيّة،"], [2205.0, "وردت مطلقةً غيرَ مقيّدةٍ بمحلٍّ معيّن،"], [2210.0, "لكننا نعلم علّتها، وهي الإصابة بالعين؛"], [2214.4, "فقد دلّ ذلك على أنّ كلّ محلٍّ يمكن أن تصيبه العين فيكون محلًّا صالحًا لتلك الرقية."], [2223.0, "ومن فرّق بين محلٍّ فأجاز الرقية عليه،"], [2229.0, "ومحلٍّ فلم يُجِز الرقية عليه،"], [2233.0, "فإنه فرّق بين متماثلين،"], [2237.0, "فنحن نطالبه بالدليل على هذا التفريق،"], [2239.6, "نطالبه بالدليل على هذا التفريق."]], "tr": [[2172.0, "Genel delile gelince: Kur'an'ın ve rukyenin şifa olduğuna delalet eden delillerdir."], [2174.1, "Bunlar belirli bir mahalle kayıtlanmamış, mutlak delillerdir."], [2180.0, "Kaidelerde yerleşik olan da mutlak olarak gelen şeyin mutlaklığı üzere kalmasının vâcip olduğu ve ancak bir delille kayıtlanabileceğidir."], [2198.0, "Kur'ân-ı Kerîm'le şifa aramak ve dualar ile şer'î sığınma dualarıyla korunmak veya tedavi olmak hakkında gelen o nasslar, belirli bir mahalle kayıtlanmaksızın mutlak olarak gelmiştir."], [2210.8, "Fakat biz onların illetini biliyoruz;"], [2214.4, "o da nazarın isabet etmesidir."], [2216.2, "Bu, nazarın isabet edebileceği her mahallin o rukyeye elverişli bir mahal olduğuna delalet etmiştir."], [2223.0, "Bir mahal ile diğeri arasında ayrım yapıp birine rukyeyi caiz görüp diğerine caiz görmeyen kimse, birbirinin benzeri olan iki şey arasında ayrım yapmıştır."], [2238.3, "Biz ondan bu ayrımın delilini isteriz; bu ayrımın delilini isteriz."]]}]}, {"ts": "37:21", "title": "5. Külliye (devam): Özel delil: Sühaym b. Nevfel'in kıssası ve Hanzala hadisi", "paras": [{"reader": false, "ar": [[2241.0, "ومن الأدلّة عليها أيضًا:"], [2243.6, "الدليلُ الخاصّ، الدليلُ الخاصّ الذي يدلّ على جواز القراءة على البهيمة والجماد."], [2257.0, "فمن ذلك حديثُ سُحيم بن نوفلٍ ـ رضي،"], [2260.8, "رحمه الله ـ قال: «بينما نحن عند عبد الله» ـ يعني ابن مسعودٍ رضي الله عنه ـ يطلبون عنده العلم،"], [2269.0, "«إذ جاءت وليدةٌ» ـ أي:"], [2272.2, "أَمَةٌ ـ لأحد هؤلاء الطلّاب،"], [2276.0, "وليدتُه هي. «إذ جاءت وليدةٌ» ـ عشان بس تتصوّرون معي القصّة ـ «بينما نحن عند عبد الله» ـ يعني ابن مسعود ـ «إذ جاءت وليدةٌ أعرابيّةٌ إلى سيّدها، ونحن نعرض مصحفًا، فقالت: ما يُجلسك وقد لقع» ـ أي:"], [2296.3, "أصاب ـ «فلانٌ مُهرَك بعينه» ـ تقول:"], [2301.3, "أنت قاعدٌ تطلب العلم عند ابن مسعود،"], [2303.7, "وفلانٌ أصاب مُهرك بالعين!"], [2309.0, "ـ «فتركه يتقلّب في الدار كأنه في قِدْر، فقُم فابتغِ راقيًا»."]], "tr": [[2241.0, "Buna delalet eden delillerden biri de özel delildir;"], [2244.1, "hayvana ve cansız şeye okumanın caiz olduğuna delalet eden özel delil."], [2257.0, "Bundan biri Sühaym b. Nevfel'in —radıya..., Allah ona rahmet etsin— hadisidir."], [2262.3, "Şöyle dedi: \"Biz Abdullah'ın\" —yani İbn Mes'ûd'un, Allah ondan razı olsun— yanında iken —onun yanında ilim talep ediyorlardı— \"bir velîde geldi\" —yani bir cariye— bu talebelerden birinin cariyesi, onun cariyesi."], [2278.0, "\"Bir velîde geldi\" —sadece kıssayı benimle birlikte gözünüzde canlandırasınız diye (tekrar ediyorum)— \"Biz Abdullah'ın\" —yani İbn Mes'ûd'un— \"yanında iken bedevî bir cariye efendisine geldi;"], [2291.5, "biz de bir mushafı arz ediyorduk (okuyorduk)."], [2296.3, "Dedi ki: Falan kişi taylarına gözüyle nazar değdirmişken seni burada oturtan ne?\" —Diyor ki:"], [2301.3, "Sen burada oturmuş İbn Mes'ûd'un yanında ilim talep ediyorsun, falan da tayına nazar değdirdi!— \"Onu evde, sanki bir tencerenin içindeymiş gibi kıvranır hâlde bıraktı."], [2311.6, "Kalk da bir rukyeci ara.\""]]}, {"reader": false, "ar": [[2317.0, "فقال عبد الله ـ أي:"], [2320.1, "ابن مسعود ـ: «لا تبتغِ راقيًا، وانفُث في مَنخِره الأيمن أربعًا، وفي الأيسر ثلاثًا، وقل: لا بأس، لا بأس، أذهِبِ البأسَ ربَّ الناس، اشفِ أنت الشافي، لا يكشف الضرَّ إلا أنت. قال: فذهب، ثم رجع إلينا، قال: قلتُ ما أمرتَني به، فما جئتُ حتى راث وبال وأكل <span class=\"q\">؟ 39:07<\/span>»."], [2351.0, "وهذا الحديث رواه ابنُ فُضيلٍ الضبّيّ في «الدعاء»،"], [2355.0, "وابنُ أبي شيبة في «المصنَّف»،"], [2357.0, "وقد عقد عليه ابنُ أبي شيبة بابًا قال فيه:"], [2362.0, "«في الدابّة يصيبها الشيء، بأيّ شيءٍ تُعوَّذ به»."], [2365.0, "وهو حديثٌ حسنٌ إن شاء الله تعالى."]], "tr": [[2317.0, "Abdullah —yani İbn Mes'ûd— şöyle dedi:"], [2320.1, "\"Rukyeci arama; onun sağ burun deliğine dört kez, solunaysa üç kez üfle ve de ki:"], [2334.6, "Beis yok, beis yok; sıkıntıyı gider, ey insanların Rabbi!"], [2344.6, "Şifa ver, şifa veren Sensin;"], [2351.0, "zararı ancak Sen giderirsin. (Râvi) dedi ki:"], [2352.5, "Gitti, sonra yanımıza döndü ve dedi ki:"], [2354.5, "Bana emrettiğin şeyi söyledim; daha (yanınıza) gelmeden (tay) tersledi, işedi ve yedi <span class=\"q\">؟<\/span>.\" Bu hadisi İbn Fudayl ed-Dabbî \"ed-Duâ\"da, İbn Ebî Şeybe de \"el-Musannef\"te rivayet etmiştir."], [2362.0, "İbn Ebî Şeybe bunun için \"Bir şey isabet eden hayvan hakkında:"], [2365.0, "Hangi şeyle sığındırılır?\" diye bir bab açmıştır."], [2366.7, "İnşallah bu hasen bir hadistir."]]}, {"reader": false, "ar": [[2368.0, "ومن الأدلّة أيضًا: حديثٌ طويلٌ فيه دعاءُ النبيّ صلى الله عليه وسلم لحنظلة بالبركة؛"], [2376.7, "حنظلةُ رضي الله تعالى عنه دعا له النبيّ صلى الله عليه وسلم بالبركة،"], [2383.0, "فاستجاب الله عز وجل دعاءَ نبيّه فيه،"], [2386.0, "حتى قال الراوي ـ واسمه ذَيّال ـ:"], [2390.0, "«فلقد رأيتُ حنظلة يُؤتى بالإنسان الوارمِ وجهُه، أو بالبهيمة الوارمة ـ معي ولا لا يا جماعة؟ <span class=\"q\">؟ 40:01<\/span> ـ أو بالبهيمة الوارمةِ الضَّرع، فيتفل على يده ويقول: بسم الله، ويضع يده على رأسه ويقول: على موضع كفّ رسول الله صلى الله عليه وسلم، فيمسحه عليه، فيُذهب اللهُ الورم»."], [2421.0, "وهذا حديثٌ رواه الإمام أحمد في «المسند»،"], [2425.0, "وصحّحه الشيخ الألبانيّ رحمه الله في «السلسلة الصحيحة»."], [2428.6, "ـ يرحمك الله ـ أنتم معي ولا لا يا جماعة؟"]], "tr": [[2368.0, "Delillerden biri de içinde Peygamber sallallâhu aleyhi ve sellem'in Hanzala'ya bereketle dua etmesinin bulunduğu uzun bir hadistir."], [2376.7, "Peygamber sallallâhu aleyhi ve sellem Hanzala'ya —Allah ondan razı olsun— bereketle dua etti;"], [2381.6, "Allah Azze ve Celle de Peygamberi'nin onun hakkındaki duasını kabul etti."], [2385.1, "Öyle ki adı Zeyyâl olan râvi şöyle dedi:"], [2390.0, "\"Hanzala'ya yüzü şişmiş bir insanın veya şişmiş bir hayvanın —benimle misiniz, değil misiniz arkadaşlar?"], [2404.2, "<span class=\"q\">؟<\/span>— memesi şişmiş bir hayvanın getirildiğini gördüm."], [2408.9, "Eline tükürür, 'Bismillah' der, elini başına koyar ve 'Resûlullah sallallâhu aleyhi ve sellem'in avucunun (değdiği) yer üzerine' der, sonra onu (şişen yere) sürerdi;"], [2421.0, "Allah da şişliği giderirdi.\" Bu hadisi İmam Ahmed \"el-Müsned\"de rivayet etmiş, Şeyh el-Elbânî —Allah ona rahmet etsin— \"es-Silsiletü's-Sahîha\"da sahih saymıştır."], [2428.6, "—Allah sana rahmet etsin (aksırana)— Benimle misiniz, değil misiniz arkadaşlar?"]]}]}, {"ts": "40:29", "title": "5. Külliye (devam): Cansızların ve hayvanların hissetmesi", "paras": [{"reader": false, "ar": [[2429.0, "بل ومن الأدلّة أيضًا:"], [2434.0, "إثباتُ كثيرٍ من الأدلّة بأنّ تلك الجمادات والدوابّ لها إحساسٌ وتأثّر،"], [2439.0, "لكنه إحساسٌ وتأثّرٌ لا يعلمه إلا الله،"], [2442.9, "قد يكشفه الله عز وجل لنا وقد لا يكشفه."], [2448.0, "أَوَلا ترون ذلك الجذعَ الذي كان يخطب عليه النبيّ صلى الله عليه وسلم،"], [2455.0, "فلمّا وُضع له المنبرُ واستبدله،"], [2457.0, "سُمع بكاءٌ كبكاء الطفل،"], [2459.0, "حتى نزل النبيّ صلى الله عليه وسلم والتزمه حتى سكن؟"], [2466.0, "ويقول النبيّ صلى الله عليه وسلم:"], [2470.0, "«إني لأعلم حجرًا كان يسلّم عليّ وأنا بمكّة»."]], "tr": [[2429.0, "Hatta delillerden biri de şudur:"], [2434.0, "Birçok delil, bu cansız varlıkların ve hayvanların bir hissinin ve etkilenmesinin olduğunu isbat etmektedir;"], [2439.0, "fakat bu, ancak Allah'ın bildiği bir his ve etkilenmedir;"], [2442.9, "Allah Azze ve Celle onu bize bazen açar, bazen açmaz."], [2448.0, "Peygamber sallallâhu aleyhi ve sellem'in üzerinde hutbe okuduğu o hurma kütüğünü görmüyor musunuz?"], [2453.4, "Onun için minber konulup onu (kütüğün) yerine koyunca, çocuk ağlaması gibi bir ağlama işitildi;"], [2458.5, "ta ki Peygamber sallallâhu aleyhi ve sellem inip ona sarıldı ve o sükûnet buldu."], [2466.0, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [2470.0, "\"Ben Mekke'deyken bana selam veren bir taşı bilirim.\""]]}, {"reader": false, "ar": [[2473.0, "بل وترون ـ بارك الله فيكم ـ ذلك الخيلَ الذي كان خيلَ أُسيد بن الحُضير ـ إي نعم ـ لمّا كان يقرأ سورةً من السور،"], [2488.0, "فجعلت ظُلّةٌ أو سحابةٌ تقترب منهم،"], [2491.5, "تنزل من السماء، وجعل الفرس ينفِر ـ يعني:"], [2495.5, "رآها وأحسّ بها ـ فقال النبيّ صلى الله عليه وسلم:"], [2499.7, "«تلك السكينة تنزّلت، تنزّلت بالقرآن»."], [2503.0, "فإذًا عندها إحساسٌ، وعندها قبولٌ لشيءٍ من ذلك؛"], [2508.0, "فإذًا لا غرابةَ أن تتأثّر بكتاب الله عز وجل."]], "tr": [[2473.0, "Hatta —Allah sizi mübarek kılsın— Üseyd b."], [2478.4, "Hudayr'ın atı olan o atı da görüyorsunuz —evet—:"], [2485.0, "O, sûrelerden birini okurken gölgelik gibi bir şey ya da bir bulut onlara yaklaşmaya, gökten inmeye başladı;"], [2495.5, "at da ürkmeye başladı —yani onu gördü ve hissetti—."], [2497.4, "Bunun üzerine Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2499.7, "\"O, sekînetti; indi, Kur'an'la (Kur'an için) indi.\" Demek ki onların bir hissi ve bunlardan bir şeyi kabul etmeleri vardır."], [2508.0, "O hâlde Allah Azze ve Celle'nin Kitabı'ndan etkilenmelerinde garip bir şey yoktur."]]}, {"reader": false, "ar": [[2514.0, "واسمع إلى قول الله عز وجل:"], [2516.2, "<span class=\"ayah\">﴿وَإِنَّ مِنْهَا﴾<\/span> ـ أي: من الحجارة ـ <span class=\"ayah\">﴿لَمَا يَهْبِطُ مِنْ خَشْيَةِ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ٧٤]<\/span>،"], [2522.0, "وقولِ الله عز وجل:"], [2524.0, "<span class=\"ayah\">﴿لَوْ أَنزَلْنَا هَٰذَا الْقُرْآنَ عَلَىٰ جَبَلٍ﴾<\/span> ـ وهو جماد ـ <span class=\"ayah\">﴿لَّرَأَيْتَهُ خَاشِعًا مُّتَصَدِّعًا مِّنْ خَشْيَةِ اللَّهِ﴾<\/span> <span class=\"ref\">[الحشر: ٢١]<\/span>."], [2531.0, "فإذًا لا بأس أن تقرأ على نفسك،"], [2533.6, "أو على غيرك، أو على سيّارتك،"], [2535.9, "أو على دابّتك، أو على شيءٍ من أغراضك ومتاعك،"], [2544.0, "إذا علمتَ أو غلب على ظنّك أنه إنما تلف عليك بسبب ـ بسبب العين."]], "tr": [[2514.0, "Allah Azze ve Celle'nin şu sözünü dinle:"], [2516.2, "<span class=\"ayah\">﴿Onlardan bir kısmı da﴾<\/span> —yani taşlardan— <span class=\"ayah\">﴿Allah korkusundan yuvarlanıp düşer﴾<\/span> [Bakara 74]."], [2520.4, "Allah Azze ve Celle'nin şu sözünü de:"], [2524.0, "<span class=\"ayah\">﴿Eğer biz bu Kur'an'ı bir dağa indirseydik﴾<\/span> —ki o cansızdır— <span class=\"ayah\">﴿onu, Allah korkusundan baş eğmiş, parça parça olmuş görürdün﴾<\/span> [Haşr 21]."], [2533.2, "O hâlde kendine, başkasına, arabana, binek hayvanına veya eşyandan ve malından bir şeye okumanda, onun ancak nazar sebebiyle —nazar sebebiyle— bozulduğunu bildiğin veya zannın buna galip geldiği zaman beis yoktur."]]}]}, {"ts": "42:30", "title": "6. Külliye: Rukyecilerin rukyenin şeklinde ihdas ettikleri delilsiz her şeyi terk etmek vâciptir", "paras": [{"reader": false, "ar": [[2550.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما أحدثه الرُّقاة في صفة الرقية ممّا ليس عليه دليلٌ فالواجب تركُه.<\/b> أقول وبالله التوفيق:"], [2563.4, "وذلك لوجوب سدّ الباب والإحداثِ في باب الرقية،"], [2567.0, "وأنّ الباب ليس مفتوحًا على مصراعيه ليُحدث من شاء ما شاء في باب الرقية؛"], [2574.0, "كاستعمال جلد الذئب، فإنه من البدع المحرّمة،"], [2579.0, "وكاستعمال الملح في رشّ البيت،"], [2582.0, "فإننا لا نعلم له أصلًا."]], "tr": [[2550.0, "Külliyelerden biri de şudur: 6."], [2554.0, "külliye: Rukyecilerin rukyenin şeklinde ihdas ettikleri, üzerinde delil bulunmayan her şeyi terk etmek vâciptir. Tevfik Allah'tandır, derim ki:"], [2563.4, "Bunun sebebi, rukye babında kapıyı ve ihdası kapatmanın vâcip olması ve kapının, dileyen dilediğini rukye babında ihdas etsin diye sonuna kadar açık olmamasıdır."], [2574.0, "Kurt derisini kullanmak gibi; bu haram bid'atlerdendir."], [2579.0, "Evi serpmede tuz kullanmak gibi;"], [2582.0, "biz bunun bir aslını bilmiyoruz."]]}, {"reader": false, "ar": [[2585.0, "وكما يسمّونه بالقراءة التخيّليّة أو التصويريّة:"], [2591.0, "بأن يأمر القارئُ المقروءَ بإغماض عينيه،"], [2594.0, "ثم يخبره بالصور التي تمرّ عليه،"], [2597.0, "ثم ينسب الأثرَ من عينٍ أو سحرٍ إلى تلك الصور وإلى هؤلاء الأشخاص؛"], [2605.0, "فإنّ هذا محرّمٌ ولا يجوز أبدًا،"], [2608.0, "بل هو عملٌ شيطانيّ؛"], [2610.9, "لأنه استعانةٌ بالشياطين، فهي التي تتخيّل له بصورة ذلك الإنس الذي أصابه."], [2617.0, "بل ويزداد تحريمُه أنه صار من الأسباب الخطيرة التي تقطّعت بها الأواصر،"], [2623.7, "وتفرّقت بها الأسر، وكثر بها الاتّهامُ بالباطل والعدوان."]], "tr": [[2585.0, "(Bunlardan biri de) onların \"hayalî\" veya \"tasvirî okuma\" dedikleri şeydir:"], [2591.0, "Rukyeci kendisine okunan kişiye gözlerini kapatmasını emreder, sonra ona gözünün önünden geçen suretleri haber verir, sonra nazar veya sihir etkisini o suretlere ve o kişilere nispet eder."], [2605.0, "Bu haramdır ve asla caiz değildir;"], [2607.0, "hatta şeytanî bir ameldir; çünkü şeytanlardan yardım istemektir."], [2610.9, "Ona (nazar) isabet ettiren o insanın suretinde hayal olarak görünen onlardır."], [2617.0, "Haramlığını daha da artıran şey, onun bağların koparıldığı, ailelerin dağıldığı, haksız yere itham ve düşmanlığın çoğaldığı tehlikeli sebeplerden biri hâline gelmesidir."]]}]}, {"ts": "43:50", "title": "6. Külliye (devam): Uzaktan rukye", "paras": [{"reader": false, "ar": [[2630.0, "ومنها ـ إن قلت: ما حكمُ الرقية عن بُعد؟"], [2638.0, "ما حكمُ الرقية عن بُعد؟"], [2643.0, "فأقول: هذا من المسائل المعاصرة التي لا نعلم دليلًا يُجيزها بخصوصها ولا يمنعها بخصوصها."], [2656.0, "لكن بما أنّ الأصل في صفة الرقية التوقيف،"], [2659.8, "وأنّ كلّ محدَثٍ في باب صفة الرقية فالأصلُ منعُه،"], [2664.0, "فحينئذٍ لا بدّ أن نُخرج حكمًا يتناسب مع أصول الشرع في هذه الجزئيّة،"], [2672.0, "وهي أننا دائمًا نعمد إلى القول الوسط؛"], [2675.0, "فلا نُجيزها في كلّ صورها مطلقًا كما قاله بعضهم،"], [2681.0, "ولا نمنعها في كلّ صورها مطلقًا كما قاله بعضهم،"], [2685.0, "وإنما نحن مع القول الوسط."]], "tr": [[2630.0, "Bunlardan biri de —eğer \"Uzaktan rukyenin hükmü nedir?"], [2638.0, "Uzaktan rukyenin hükmü nedir?\" dersen— derim ki:"], [2643.0, "Bu, özel olarak onu caiz kılan veya özel olarak onu yasaklayan bir delil bilmediğimiz çağdaş meselelerdendir."], [2656.0, "Fakat rukyenin şeklinde asıl tevkîf (nassa bağlılık) olduğuna ve rukyenin şekli babında ihdas edilen her şeyde aslın yasaklık olduğuna göre, bu cüz'î meselede şeriatın usûlüne uygun bir hüküm çıkarmamız gerekir."], [2671.4, "O da şudur: Biz daima orta görüşe yöneliriz."], [2675.0, "Bazılarının dediği gibi onu bütün suretlerinde mutlak olarak caiz görmeyiz;"], [2681.0, "bazılarının dediği gibi bütün suretlerinde mutlak olarak yasaklamayız da."], [2685.0, "Bilakis biz orta görüşten yanayız."]]}, {"reader": false, "ar": [[2688.0, "وهذا القولُ الوسط مبنيٌّ فهمُه ـ أو يُبنى فهمُه ـ على فهم مقدّمةٍ بسيطة،"], [2694.0, "وهي أنّ حضور المقروء عند القارئ ـ حضورَ المقروء عند القارئ ـ ينقسم إلى قسمين ـ فهمتم الاختيار؟"], [2704.0, "<span class=\"q\">؟ 45:02<\/span> ـ: إلى حضورٍ حقيقيّ، وإلى حضورٍ حكميّ."], [2709.0, "وكلٌّ منهما في حال الحضور يقصد عينَ الآخر؛"], [2713.0, "فهو جاء يقصدني وأنا جئتُ أقصده."], [2718.0, "لكن هناك نوعٌ من الحضور،"], [2721.6, "وهو الحضور الحكميّ، وهي أن يكون المقروءُ عند القارئ قد حضرا قصدًا عند بعضهما بآلةٍ من تلك الآلات التي تجعل بعضهما يرى بعضًا،"], [2737.8, "أو يسمع بعضُهما بعضًا،"], [2740.0, "فيكون في حكم الحاضر وإن لم يكن كالحاضر حقيقةً."]], "tr": [[2688.0, "Bu orta görüşün anlaşılması, basit bir mukaddimenin anlaşılmasına dayanır —ya da dayandırılır—:"], [2693.0, "Kendisine okunan kişinin rukyecinin yanında hazır bulunması —kendisine okunanın rukyecinin yanında hazır bulunması— iki kısma ayrılır —tercihi anladınız mı?"], [2704.0, "<span class=\"q\">؟<\/span>—: Hakiki hazır bulunma ve hükmî hazır bulunma."], [2704.6, "(Hakiki hazır bulunmada) her biri hazır bulunma hâlinde diğerinin bizzat kendisini kasteder;"], [2709.0, "o beni kastederek gelmiştir, ben de onu kastederek gelmişimdir."], [2713.0, "Fakat bir hazır bulunma türü daha vardır;"], [2718.0, "o da hükmî hazır bulunmadır:"], [2721.6, "Kendisine okunan ile rukyecinin, birbirlerini görmelerini veya birbirlerini işitmelerini sağlayan o aletlerden biriyle kasıtlı olarak birbirlerinin yanında hazır bulunmalarıdır."], [2737.2, "Bu durumda, gerçekten hazır bulunan gibi olmasa da hazır bulunan hükmünde olur."]]}, {"reader": false, "ar": [[2746.0, "والمتقرّر في القواعد أنّ الحضور الحكميّ كالحضور الحقيقيّ،"], [2752.0, "كما قلناه في حضور الكاهن:"], [2754.1, "فيحرم ما كان منه حقيقةً وما كان منه حكمًا."], [2758.0, "وبناءً على ذلك فالقول الأقرب عندي:"], [2761.5, "أنه إذا كان القارئ يقرأ على مقروءٍ قد قصده بوسيلةٍ توصل بعضهما ببعض،"], [2769.0, "وكان المقروءُ قد عيّن القارئ،"], [2771.8, "والقارئُ قد عيّن المقروء،"], [2774.0, "فلا جرمَ أنّ هذا كافٍ في الرقية،"], [2776.5, "وجائزٌ لا بأس به."], [2778.0, "فإذًا لا بدّ أن يقصد أحدُهما الآخر،"], [2781.0, "وتكون الوسيلة بينهما وسيلةً توصل بعضهما بأيّ نوعٍ من أنواع التواصل."]], "tr": [[2746.0, "Kaidelerde yerleşik olan, hükmî hazır bulunmanın hakiki hazır bulunma gibi olduğudur;"], [2754.1, "kâhinin yanında bulunma hakkında söylediğimiz gibi:"], [2756.7, "Onun hakiki olanı da hükmî olanı da haramdır."], [2761.5, "Buna binaen bence en doğruya yakın görüş şudur:"], [2765.5, "Rukyeci, kendisini kastetmiş olan bir kişiye, ikisini birbirine ulaştıran bir vasıtayla okuyorsa;"], [2771.8, "kendisine okunan rukyeciyi, rukyeci de kendisine okunanı belirlemişse, şüphesiz bu rukyede yeterlidir, caizdir, bunda beis yoktur."], [2778.0, "Demek ki birinin diğerini kastetmesi ve aralarındaki vasıtanın, iletişim türlerinden herhangi biriyle onları birbirine ulaştıran bir vasıta olması gerekir."]]}, {"reader": false, "ar": [[2787.0, "لكن أن يقرأ الإنسانُ في قناةٍ غيرَ قاصدٍ من أمامه،"], [2792.0, "وغيرَ عارفٍ ولا عالمٍ بمن أمامه،"], [2795.0, "فإنّ ذلك كلَّه من العبث في باب الرقية،"], [2798.5, "ومن إدخال الشيء الذي لا يستند إلى أصل."], [2802.0, "لكنّ ما قلتُه ورجّحتُه لكم يستند إلى أصلٍ شرعيّ،"], [2806.8, "وهي أنّ الحكميّ منزَّلٌ منزلةَ الحقيقيّ."], [2810.0, "فإذا قرأتَ في التلفون على رجلٍ في بلدةٍ أخرى،"], [2814.5, "وهو يسمع رقيتك، وأنت قصدتَه بهذه الرقية،"], [2818.0, "وهو قصد استماعَ رقيتك،"], [2820.2, "فلا جرمَ أنه في حكم الحاضر عندك؛"], [2824.0, "فليس اجتماعُ جسد الراقي والمرقيّ في المكان بشرطٍ في صحّة الرقية."]], "tr": [[2787.0, "Fakat insanın, karşısındakini kastetmeden, karşısındakini tanımadan ve bilmeden bir kanalda okuması;"], [2791.5, "bunların hepsi rukye babında abesle iştigaldir ve bir asla dayanmayan şeyi (rukyeye) sokmaktır."], [2797.2, "Fakat benim söylediğim ve size tercih ettiğim görüş şer'î bir asla dayanır:"], [2802.0, "O da hükmî olanın hakiki olan yerine konulmasıdır."], [2810.0, "Başka bir beldedeki bir adama telefonda okursan, o da rukyeni işitiyorsa, sen bu rukyeyle onu kastetmişsen, o da rukyeni dinlemeyi kastetmişse, şüphesiz o senin yanında hazır bulunan hükmündedir."], [2824.0, "Rukyecinin ve kendisine rukye yapılanın bedeninin aynı yerde bir araya gelmesi, rukyenin sıhhatinde şart değildir."]]}, {"reader": false, "ar": [[2830.0, "فلا أُجيز من صور الرقية عن بُعدٍ إلا ما كان ـ إيش؟"], [2836.9, "ـ مقصودًا، سواءٌ أكان المتلقّي للرقية واحدًا أو اثنين أو ثلاثة،"], [2844.1, "لكنها جماعةٌ مقصودةٌ معلومة؛"], [2848.0, "فذلك جائز، وفيه تيسيرٌ على الناس؛"], [2851.9, "إذ إنّ من الرقاة مَن يكون بعيدًا عن المرضى،"], [2859.0, "وهم يحتاجون إلى رقيته."], [2862.0, "فينبغي في مثل ذلك أن نتوسّع فيه،"], [2864.3, "لا سيّما وأننا لم نخرج عن صورة الشرع <span class=\"q\">؟ 47:42<\/span>."]], "tr": [[2830.0, "Uzaktan rukyenin suretlerinden ancak —neyi?— kastedilmiş olanı caiz görürüm;"], [2836.9, "rukyeyi alan ister bir, ister iki, ister üç kişi olsun;"], [2842.7, "yeter ki kastedilmiş, belirli bir topluluk olsun."], [2848.0, "Bu caizdir ve insanlar için bir kolaylıktır;"], [2851.9, "çünkü rukyecilerden hastalardan uzakta olanlar vardır, hastalar da onun rukyesine muhtaçtır."], [2862.0, "Böyle bir durumda genişlik tanımamız uygun olur;"], [2864.3, "özellikle de şeriatın suretinin <span class=\"q\">؟<\/span> dışına çıkmadığımız hâlde."]]}]}, {"ts": "47:47", "title": "Meseleler: Kayıttan rukye dinlemek · Hayızlı, lohusa ve cünübe rukye · Rukye yeri açmak", "paras": [{"reader": false, "ar": [[2867.0, "ومن المسائل: ما حكمُ استماع الرقية عن طريق التسجيل؟"], [2875.0, "أقول: أمّا سماعُ الآيات من فم القارئ عن طريق التسجيل فهذا لا بأس به،"], [2884.0, "ولكن لا يجوز إدخالُ هذه الصورة في مسمّى الرقية؛"], [2889.0, "لأنّ التسجيل آلةٌ لا يُتصوّر منها صدورُ امتثال أمر الله عز وجل،"], [2894.0, "ولا تمحّضُ القصد في نفع المسلمين."], [2899.0, "فهي آلةٌ لا تدخل تحت دائرة التكليف،"], [2902.0, "فليست بمأمورةٍ بالرقية لا أمرَ إيجابٍ ولا أمرَ استحباب،"], [2906.0, "ولا يصدر منها قصدُ امتثال أمر النبيّ صلى الله عليه وسلم في قوله:"], [2911.0, "«من استطاع منكم أن ينفع أخاه فليفعل»،"], [2915.0, "ولا يُتصوّر أن يصدر منها نيّةٌ حسنةٌ ولا نيّةٌ سيّئة؛"], [2920.0, "فهي جهازٌ لا ينبغي أن تُعتمد في باب الرقية أبدًا."]], "tr": [[2867.0, "Meselelerden biri de şudur: Rukyeyi kayıt yoluyla dinlemenin hükmü nedir?"], [2875.0, "Derim ki: Ayetleri rukyecinin ağzından kayıt yoluyla dinlemekte beis yoktur;"], [2882.7, "fakat bu sureti rukye ismine dahil etmek caiz değildir."], [2889.0, "Çünkü kayıt, kendisinden Allah Azze ve Celle'nin emrine uymanın ve Müslümanlara fayda vermede kasdın halis olmasının sadır olması düşünülemeyen bir alettir."], [2895.5, "O, teklif dairesine girmeyen bir alettir;"], [2899.0, "rukyeyle ne vücûb emriyle ne de istihbab emriyle emrolunmuştur."], [2902.4, "Ondan, Peygamber sallallâhu aleyhi ve sellem'in \"Sizden kim kardeşine fayda vermeye güç yetirirse bunu yapsın\" sözündeki emrine uyma kasdı sadır olmaz."], [2911.0, "Ondan ne iyi ne de kötü bir niyetin sadır olması düşünül
