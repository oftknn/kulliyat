<script>
const D={"no": 47, "vid": "WnEfflT2vYE", "title_ar": "الدرس (٤٧) من شرح كليات العقيدة — من كليات باب التبرك وأسباب البركة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 47. Ders: Teberrük Babı Külliyeleri (Yasak Teberrük ve Gulüv, Sâlihlerin Eserleriyle Teberrük, Dinî Menfaatle Teberrük, Bereketi Gideren ve Getiren Sebepler)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Velîler ve sâlihlerle yapılan her yasak teberrük, onlar hakkında gulüvve zerîadır", "paras": [{"reader": false, "ar": [[0.0, "بسم الله الرحمن الرحيم،"], [2.2, "الحمدُ لله ربِّ العالمين،"], [4.4, "والصلاةُ والسلامُ على رسول الله الأمين،"], [7.7, "وعلى آله وأصحابه الطيبين الطاهرين،"], [10.5, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [13.8, "أمّا بعد: فلا نزال في سياق شرح كلّيّات توحيد الألوهية مُمثَّلةً في باب التبرُّك."], [21.5, "وقد شرحنا جُمَلًا من كلّيّات باب التبرُّك،"], [25.4, "ونختمُه ـ إن شاء الله ـ هذا الدرس،"], [28.7, "وندخلُ في شيءٍ من كلّيّات التوسُّل <span class=\"q\">؟ 00:28<\/span>. الكلّيّة الأولى:"]], "tr": [[0.0, "Bismillâhirrahmânirrahîm. Âlemlerin Rabbi Allah'a hamd olsun."], [2.8, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [14.9, "Bundan sonra: Hâlâ teberrük babında temsil edilen ulûhiyyet tevhidi külliyelerinin şerhi bağlamındayız."], [21.5, "Teberrük babının külliyelerinden birçoğunu şerh ettik;"], [24.8, "inşallah bu derste onu bitireceğiz ve tevessül külliyelerinden bir kısmına gireceğiz <span class=\"q\">؟<\/span>. 1. külliye:"]]}, {"reader": false, "ar": [[32.0, "<b>كلُّ تبرُّكٍ ممنوعٍ بالأولياء والصالحين فذريعةٌ للغلوّ فيهم.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[32.0, "<b>1. külliye: Velîler ve sâlihlerle yapılan her yasak teberrük, onlar hakkında gulüvve (aşırılığa) zerîadır (götüren bir kapıdır).<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[52.0, "أقول وبالله التوفيق: وهذا يشهد له الواقع؛"], [57.0, "فإننا لو فتحنا بابَ التبرُّك بآثار الصالحين فإنّ هذا سوف يُفضي إلى أن يغلوَ الناسُ فيهم غلوًّا ربما يُخرِجهم عن دائرة البشريّة إلى دائرة الألوهيّة أو إلى دائرة الربوبيّة."], [72.0, "فلو أبحنا التبرُّك بآثار الصالحين فسيحدث الغلوُّ فيهم."], [77.0, "والغلوُّ في الصالحين هو أوّلُ البوّابات التي أوجبت الفسادَ العقديّ في هذه الأمّة،"]], "tr": [[52.0, "Tevfik Allah'tandır, derim ki: Buna vâkıa (fiilî durum) şahitlik etmektedir."], [57.0, "Zira sâlihlerin eserleriyle teberrük kapısını açsaydık, bu, insanların onlar hakkında, belki onları beşeriyet dairesinden ulûhiyyet dairesine veya rubûbiyyet dairesine çıkaracak bir gulüvve düşmelerine götürürdü."], [70.6, "Sâlihlerin eserleriyle teberrükü mubah kılsaydık, onlar hakkında gulüv ortaya çıkardı."], [77.0, "Sâlihler hakkında gulüv, bu ümmette itikadî bozulmayı doğuran kapıların ilkidir;"]]}, {"reader": false, "ar": [[84.0, "كما لا يخفى على شريف علمكم في قول الله عز وجل:"], [88.5, "<span class=\"ayah\">﴿وَقَالُوا لَا تَذَرُنَّ آلِهَتَكُمْ وَلَا تَذَرُنَّ وَدًّا وَلَا سُوَاعًا وَلَا يَغُوثَ وَيَعُوقَ وَنَسْرًا﴾<\/span> <span class=\"ref\">[نوح: ٢٣]<\/span>."], [94.0, "قال ابنُ عبّاسٍ رضي الله عنهما:"], [97.0, "«هذه أسماءُ أُناسٍ صالحين كانوا من قوم نوح، هلكوا ـ أي في وقتٍ متقارب ـ فجزع عليهم أُمَمُهم، فجاء الشيطانُ فقال: انصِبوا إلى مجالسهم التي كانوا يعبدون اللهَ فيها أنصابًا، وسمُّوها بأسمائهم. ففعلوا، ولم تُعبَد، حتى إذا هلك أولئك ونُسِي العلمُ عُبِدت» من دون الله عز وجل."]], "tr": [[84.0, "şerefli ilminizden gizli olmadığı üzere, Allah Azze ve Celle'nin şu sözünde:"], [85.6, "<span class=\"ayah\">﴿Dediler ki: Sakın ilahlarınızı bırakmayın; Vedd'i, Suvâ'ı, Yeğûs'u, Yeûk'u ve Nesr'i de bırakmayın﴾<\/span> [Nûh 23]."], [88.5, "İbn Abbâs —Allah ikisinden de razı olsun— şöyle demiştir:"], [91.4, "\"Bunlar Nûh kavminden sâlih kimselerin isimleridir."], [94.0, "Bunlar —yani birbirine yakın bir vakitte— ölünce ümmetleri onlar için feryat ettiler."], [97.0, "Şeytan gelip dedi ki: Allah'a ibadet ettikleri meclislerine dikili taşlar dikin ve onlara onların isimlerini verin."], [108.9, "Böyle yaptılar; ama (o taşlara) ibadet edilmedi."], [113.5, "Nihayet onlar da ölüp ilim unutulunca\" Allah Azze ve Celle'yi bırakıp onlara \"ibadet edildi.\""]]}, {"reader": false, "ar": [[121.0, "فكلُّ بابٍ يُفضي إلى الغلوّ في الصالحين فالواجبُ سدُّه."], [128.0, "ومن أعظم الأبواب أن نُجيز التبرُّكَ برِيقهم،"], [132.2, "وثيابهم، وطعامهم، وطَهورهم، وشعورهم،"], [134.8, "وأن يتمسّح الإنسانُ بهم."], [139.0, "فكلُّ ذلك ممّا يجعل هذا الوليَّ في يومٍ من الأيام ربًّا لهم من دون الله عز وجل،"], [146.0, "يعتقدون أنه ينفع بذاته،"], [148.4, "وأنه يضرّ بذاته، وأنه يرزق بذاته."]], "tr": [[121.0, "Sâlihler hakkında gulüvve götüren her kapıyı kapatmak vâciptir."], [125.3, "Bu kapıların en büyüklerinden biri, onların tükürüğüyle, elbiseleriyle, yemekleriyle, abdest suyuyla ve saçlarıyla teberrükü caiz görmemiz ve insanın onlara sürünüp (bereket umarak) el sürmesidir."], [139.0, "Bütün bunlar, bu veliyi bir gün Allah Azze ve Celle'yi bırakıp onların rabbi hâline getiren şeylerdendir;"], [145.1, "onun bizzat fayda verdiğine, bizzat zarar verdiğine ve bizzat rızık verdiğine inanırlar."]]}, {"reader": false, "ar": [[152.0, "وما هذه القبورُ المنتشرةُ في العالم الإسلاميّ والعربيّ،"], [156.2, "والتي يحصل عندها ما يحصل من صور الشرك العظيمة،"], [161.0, "إلا بسببيّة ما كان يفعله أتباعُهم معهم إذ كانوا أحياء."], [167.0, "فلمّا ماتوا عكفوا على قبورهم،"], [170.2, "لأنهم كانوا قد غلَوا فيهم قبل ذلك بمثل هذا التبرُّك الذي لا يجوز عند عامّة أهل السنّة والجماعة."]], "tr": [[152.0, "İslâm ve Arap dünyasında yayılmış olan ve yanlarında büyük şirk suretlerinden olup biten şeylerin olup bittiği bu kabirler, ancak tâbilerinin onlar hayattayken onlara yaptıkları şeylerin sebebiyle (ortaya çıkmıştır)."], [167.0, "Onlar ölünce kabirlerinin başına kapandılar;"], [170.2, "çünkü daha önce, Ehl-i Sünnet ve'l-Cemaat'in geneline göre caiz olmayan bu tür teberrükle onlar hakkında gulüvve düşmüşlerdi."]]}, {"reader": false, "ar": [[183.0, "وبناءً على ذلك: فإنّ من الناس من يعتقد في هذا الوليّ الذي يُتبرَّك به بهذا التبرُّك الممنوع أنه يتحكّم في الكون."], [194.0, "بل ومنهم من يقول:"], [195.9, "إنّ الله عز وجل قد أعطى للوليّ قوّةً لم يُعطِها لأحدٍ من الناس،"], [202.0, "لم يُعطِها ملكًا مقرّبًا ولا نبيًّا مرسلًا."], [207.0, "بل إنّ بعض الأولياء ـ بسبب كثرة التبرُّك به ـ صاروا يعتقدون أنه ينفع من دون الله،"], [215.0, "وأنه يضرّ من دون الله،"], [216.7, "وأنه يرزق من دون الله،"], [218.3, "وأنه ينصر من دون الله،"], [220.0, "وأنه يشفي الأسقامَ من دون الله،"], [223.5, "وأنه تخرج له يدُ الأموات تُسلِّم عليه إذا مرّ على قبورهم؛"]], "tr": [[183.0, "Buna binaen: İnsanlardan, bu yasak teberrükle kendisiyle teberrük edilen bu veli hakkında onun kâinatta hükmettiğine inananlar vardır."], [194.0, "Hatta onlardan \"Allah Azze ve Celle veliye, insanlardan hiç kimseye vermediği bir kuvvet verdi;"], [199.6, "onu ne mukarreb bir meleğe ne de gönderilmiş bir peygambere verdi\" diyenler vardır."], [207.0, "Hatta bazı veliler hakkında, kendileriyle çokça teberrük edilmesi sebebiyle, onun Allah'ı bırakıp fayda verdiğine, Allah'ı bırakıp zarar verdiğine, Allah'ı bırakıp rızık verdiğine, Allah'ı bırakıp yardım ettiğine, Allah'ı bırakıp hastalıklara şifa verdiğine ve kabirlerine uğradığında ölülerin elinin çıkıp ona selâm verdiğine inanır oldular;"]]}, {"reader": false, "ar": [[230.0, "كما يزعمونه في بعض أوليائهم لمّا زار قبرَ النبيّ صلى الله عليه وسلم أنّ النبيّ صلى الله عليه وسلم أخرج يدَه من قبره ليردّ عليه السلام."], [242.0, "وما ذلك إلا بعد انفتاح أبواب التبرُّك الممنوع بهؤلاء الأولياء والصالحين."]], "tr": [[230.0, "nitekim bazı velileri hakkında, Peygamber sallallâhu aleyhi ve sellem'in kabrini ziyaret ettiğinde Peygamber sallallâhu aleyhi ve sellem'in ona selâmını iade etmek için elini kabrinden çıkardığını iddia ederler."], [241.1, "Bu da ancak bu velilerle ve sâlihlerle yapılan yasak teberrük kapılarının açılmasından sonra olmuştur."]]}, {"reader": false, "ar": [[250.0, "بل ومنهم من يعتقد في هؤلاء الأولياء أنهم ـ لِعِظَم تبرُّك الناس بهم واعتقاد الناس فيهم ـ أنهم سيصلون يومًا من الأيام إلى مرتبةٍ ترتفع عنهم تكاليفُ الله عز وجل،"], [264.0, "وأنّ لهم القدرةَ الكاملة ـ إذا كانوا أقطابًا أو أبدالًا ـ أن يخرجوا عن شريعة محمّدٍ صلى الله عليه وسلم."], [273.0, "وبناءً على ذلك فهذه الكلّيّة تسُدّ عنّا هذا البابَ الذي لا نزال نرى آثارَه السيّئة في العالم الإسلاميّ والعربيّ إلى يومنا هذا. والله أعلم."]], "tr": [[250.0, "Hatta onlardan, bu veliler hakkında —insanların onlarla çokça teberrük etmesi ve onlar hakkındaki inançları sebebiyle— bir gün Allah Azze ve Celle'nin teklîflerinin (dinî yükümlülüklerinin) kendilerinden kalktığı bir mertebeye ulaşacaklarına ve —kutup veya abdâl iseler— Muhammed sallallâhu aleyhi ve sellem'in şeriatinin dışına çıkmaya tam kudretleri olduğuna inananlar vardır."], [273.0, "Buna binaen bu külliye, kötü izlerini bugüne kadar İslâm ve Arap dünyasında görmeye devam ettiğimiz bu kapıyı bize kapatmaktadır. Allah en iyisini bilir."]]}]}, {"ts": "04:47", "title": "2. Külliye: Sâlihlerin eserleriyle yapılan her teberrük bid'attir", "paras": [{"reader": false, "ar": [[287.0, "ومن الكلّيّات أيضًا: <b>كلُّ تبرُّكٍ بآثار الصالحين فبدعة.<\/b> وهي كالمتمِّمة للتي قبلها:"], [295.8, "<b>كلُّ تبرُّكٍ بآثار الصالحين فبدعة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[287.0, "Külliyelerden biri de şudur: 2."], [289.2, "külliye: Sâlihlerin eserleriyle yapılan her teberrük bid'attir. Bu, öncekini tamamlayıcı gibidir:"], [295.8, "<b>Sâlihlerin eserleriyle yapılan her teberrük bid'attir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[301.0, "ونعني بآثار الصالحين: أي تلك الآثار المتّصلة أو المنفصلة عنهم،"], [310.0, "كالتبرُّك بشعر الوليّ، أو عرق الوليّ،"], [313.7, "أو ثياب الوليّ، أو بُصاق ونُخامة الوليّ ـ أكرمكم الله ـ أو بشيءٍ من ملابسه الداخليّة أو الخارجيّة،"], [325.0, "أو بفضلة سُؤر شرابه،"], [327.8, "أو بفضلة طعامه، أو بفضلة طَهوره."], [332.0, "هذا هو الذي نقصده إذا قلنا:"], [335.3, "التبرُّك بآثار الصالحين؛ لأنه ستأتينا قاعدةٌ في حدود ما يجوز التبرُّك به من آثار الصالحين."], [344.0, "فهذه الكلّيّة تتكلّم عن التبرُّك بمثل هذه الأشياء."]], "tr": [[301.0, "Sâlihlerin eserlerinden kastımız, onlara bitişik veya onlardan ayrılmış olan şu eserlerdir:"], [310.0, "Velinin saçıyla, velinin teriyle, velinin elbisesiyle ya da velinin tükürüğü ve balgamıyla —Allah size ikram etsin— veya iç ya da dış giysilerinden bir şeyle, içeceğinin artığıyla, yemeğinin artığıyla veya abdest suyunun artığıyla teberrük gibi."], [332.0, "\"Sâlihlerin eserleriyle teberrük\" dediğimizde kastettiğimiz budur;"], [335.3, "çünkü sâlihlerin eserlerinden teberrük edilmesi caiz olanın sınırları hakkında bir kaide gelecek."], [344.0, "Bu külliye, bu tür şeylerle teberrükten bahsetmektedir."]]}]}, {"ts": "05:50", "title": "2. Külliye (devam): Muhaliflerin delilleri — Yûsuf'un gömleği ve Tâbût", "paras": [{"reader": false, "ar": [[350.0, "ومن عجائب من يُجيز التبرُّك بالأولياء والصالحين:"], [354.6, "فإنه يستدلّ على هذا بجُمَلٍ من الأدلّة من الكتاب والسنّة وفعل بعض السلف،"], [367.0, "فيقول: لقد دلّ القرآن،"], [369.6, "ودلّت السنّة، وأقوالُ العلماء وأفعالُهم على جواز التبرُّك بآثار الصالحين."], [378.0, "فقلنا: وما دليلُك على هذا؟"], [381.0, "فقال: من جملة الأدلّة قولُ الله عز وجل عن يوسف:"], [387.0, "<span class=\"ayah\">﴿اذْهَبُوا بِقَمِيصِي هَٰذَا فَأَلْقُوهُ عَلَىٰ وَجْهِ أَبِي يَأْتِ بَصِيرًا﴾<\/span> <span class=\"ref\">[يوسف: ٩٣]<\/span>."], [392.0, "فقال: هذا دليلٌ على جواز التبرُّك بآثار الأولياء والصالحين."]], "tr": [[350.0, "Velilerle ve sâlihlerle teberrükü caiz görenlerin tuhaflıklarından biri şudur:"], [354.6, "Buna Kitap'tan, Sünnet'ten ve bazı seleflerin fiilinden birtakım delillerle istidlal eder ve şöyle der:"], [367.6, "Kur'an, Sünnet, âlimlerin sözleri ve fiilleri sâlihlerin eserleriyle teberrükün caiz olduğuna delâlet etmiştir."], [378.0, "Biz dedik ki: Buna delilin nedir?"], [381.0, "Dedi ki: Delillerden biri Allah Azze ve Celle'nin Yûsuf hakkındaki şu sözüdür:"], [387.0, "<span class=\"ayah\">﴿Şu gömleğimi götürün de babamın yüzüne koyun; gözleri görür hâle gelir﴾<\/span> [Yûsuf 93]."], [392.0, "Dedi ki: Bu, velilerin ve sâlihlerin eserleriyle teberrükün caiz olduğuna delildir."]]}, {"reader": false, "ar": [[397.0, "قلنا: هذا ليس بدليل؛"], [399.2, "لأنه يتكلّم عن نبيٍّ ورسول،"], [402.0, "وقد قلنا سابقًا بأنّ بركة الأنبياء والرسل بركةٌ ذاتيّةٌ منتقلة،"], [409.0, "وهذا ممّا يُخَصّ به الأنبياءُ والرسل دون غيرهم من سائر الأولياء والصالحين."], [416.0, "وكلامُنا في هذه الكلّيّة ليس عن آثار الأنبياء والرسل،"], [421.0, "وإنما عن آثار الأولياء والصالحين."], [424.0, "فلا يجوز الاستدلالُ بمثل هذا النصّ على جواز التبرُّك بآثار الصالحين."]], "tr": [[397.0, "Dedik ki: Bu delil değildir;"], [399.2, "çünkü bir nebî ve resulden bahsetmektedir."], [401.4, "Daha önce de nebîlerin ve resullerin bereketinin zâtî ve (eşyaya) intikal eden bir bereket olduğunu söylemiştik;"], [409.6, "bu da diğer veliler ve sâlihler dışında nebîlere ve resullere has olan şeylerdendir."], [416.0, "Bu külliyedeki sözümüz nebîlerin ve resullerin eserleri hakkında değil, velilerin ve sâlihlerin eserleri hakkındadır."], [424.0, "Dolayısıyla bu tür bir nassla sâlihlerin eserleriyle teberrükün caiz olduğuna istidlal etmek caiz değildir."]]}, {"reader": false, "ar": [[432.0, "وقالوا لنا أيضًا: من جملة الأدلّة قولُ الله عز وجل في تابوت آل موسى وآل هارون:"], [443.0, "«تحمله الملائكة»، في قول الله عز وجل:"], [449.0, "<span class=\"ayah\">﴿وَقَالَ لَهُمْ نَبِيُّهُمْ إِنَّ آيَةَ مُلْكِهِ أَن يَأْتِيَكُمُ التَّابُوتُ فِيهِ سَكِينَةٌ مِّن رَّبِّكُمْ وَبَقِيَّةٌ مِّمَّا تَرَكَ آلُ مُوسَىٰ وَآلُ هَارُونَ تَحْمِلُهُ الْمَلَائِكَةُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٤٨]<\/span>."], [463.0, "وهذا دليلٌ على جواز التبرُّك بمثل هذه الآثار،"], [468.0, "فدلّ ذلك على جواز التبرُّك بآثار الأولياء والصالحين."]], "tr": [[432.0, "Bize şunu da söylediler: Delillerden biri, Allah Azze ve Celle'nin Mûsâ ailesi ile Hârûn ailesinin Tâbût'u hakkında \"onu melekler taşır\" sözüdür;"], [443.0, "Allah Azze ve Celle'nin şu sözünde:"], [449.0, "<span class=\"ayah\">﴿Peygamberleri onlara dedi ki: Onun hükümdarlığının alameti, size içinde Rabbinizden bir sükûnet ve Mûsâ ailesiyle Hârûn ailesinin bıraktıklarından bir kalıntı bulunan Tâbût'un gelmesidir; onu melekler taşır﴾<\/span> [Bakara 248]."], [463.0, "(Dediler ki:) Bu, bu tür eserlerle teberrükün caiz olduğuna delildir;"], [468.0, "bu da velilerin ve sâlihlerin eserleriyle teberrükün caiz olduğunu gösterir."]]}, {"reader": false, "ar": [[475.0, "فنقول: إنه يُجاب عن هذا كما أجبنا فيما مضى؛"], [478.9, "فإنّ ما تركه آلُ موسى وآلُ هارون ـ أي موسى وهارون ـ إنما هو من جملة آثار الأنبياء التي قرّرنا بأنّ بركتهم بركةٌ ذاتيّةٌ منتقلة."], [494.0, "ونحن إنما نتكلّم عن دليلٍ يدلّ على جواز التبرُّك بآثار الأولياء والصالحين،"], [502.0, "فلا يجوز لكم أن تأتوا بأدلّةٍ تدلّ على جواز التبرُّك بآثار الأنبياء والرسل لتجعلوها دليلًا على جواز التبرُّك بآثار الأولياء والصالحين؛"], [513.0, "لأنه قياسٌ مع الفارق،"], [515.7, "كما بيّنّا في الكلّيّات السابقة."]], "tr": [[475.0, "Deriz ki: Buna daha önce cevap verdiğimiz gibi cevap verilir."], [478.9, "Mûsâ ailesiyle Hârûn ailesinin —yani Mûsâ ile Hârûn'un— bıraktıkları, bereketlerinin zâtî ve intikal eden bir bereket olduğunu takrir ettiğimiz nebîlerin eserlerindendir."], [494.0, "Biz ise velilerin ve sâlihlerin eserleriyle teberrükün caiz olduğuna delâlet eden bir delilden bahsediyoruz."], [502.0, "Dolayısıyla nebîlerin ve resullerin eserleriyle teberrükün caiz olduğunu gösteren delilleri getirip onları velilerin ve sâlihlerin eserleriyle teberrükün caiz olduğuna delil yapmanız caiz değildir;"], [513.0, "çünkü önceki külliyelerde açıkladığımız gibi bu, farklı olan şeyler arasında yapılan bir kıyastır (kıyâs mea'l-fârık)."]]}, {"reader": false, "ar": [[519.0, "لأنّ قياس الأولياء والصالحين على النبيّ صلى الله عليه وسلم بجامع الولاية والصلاح هذا قياسٌ فاسد؛"], [526.0, "فإنما أجاز اللهُ عز وجل التبرُّك بآثار الأنبياء والرسل لأنهم أنبياء ولأنهم رسل،"], [535.0, "ومَن الذي يدخل معهم في هذه المرتبة الشرعيّة العظيمة حتى يُقاس عليهم؟"]], "tr": [[519.0, "Çünkü velileri ve sâlihleri, velâyet ve salâh ortak illetiyle Peygamber sallallâhu aleyhi ve sellem'e kıyas etmek fâsid bir kıyastır."], [526.0, "Allah Azze ve Celle nebîlerin ve resullerin eserleriyle teberrükü ancak onlar nebî oldukları ve resul oldukları için caiz kılmıştır."], [535.5, "Bu büyük şer'î mertebede onlarla birlikte kim yer alabilir ki onlara kıyas edilsin?"]]}]}, {"ts": "09:01", "title": "2. Külliye (devam): İbn Ömer'in \"metâhir\" hadisi", "paras": [{"reader": false, "ar": [[541.0, "قالوا لنا أيضًا: من الأدلّة الدالّة على ذلك حديثُ ابن عمر رضي الله عنهما،"], [551.0, "قال: قلتُ: يا رسول الله،"], [554.0, "الوضوءُ من جرٍّ جديدٍ مُخمَّرٍ أحبُّ إليك أم من المطاهر؟"], [560.0, "يعني: أن تتوضّأ من جرّةٍ جديدةٍ لم تمسّها يد،"], [565.4, "مُخمَّرة، لم تمتدّ لها يد،"], [568.0, "أم أنّ الأفضل والأحبّ إليك أن تتوضّأ من المطاهر التي تمتدّ لها أيدي المسلمين؟"], [575.0, "فقال: «لا، بل من المطاهر»."], [579.0, "وكان رسولُ الله صلى الله عليه وسلم يبعث إلى المطاهر فيُؤتى بالماء فيشربه،"], [584.2, "يرجو بركةَ أيدي المسلمين."]], "tr": [[541.0, "Bize şunu da söylediler: Buna delâlet eden delillerden biri İbn Ömer —Allah ikisinden de razı olsun— hadisidir."], [548.3, "(İbn Ömer) dedi ki: \"Ey Allah'ın Resûlü!"], [551.6, "Yeni, ağzı örtülü bir testiden abdest almak mı sana daha sevimlidir, yoksa metâhirden (herkesin kullandığı abdest kaplarından) mı?\" Yani:"], [561.2, "Hiçbir elin değmediği, ağzı örtülü, hiçbir elin uzanmadığı yeni bir testiden abdest alman mı, yoksa Müslümanların ellerinin uzandığı metâhirden abdest alman mı sana daha faziletli ve daha sevimlidir?"], [575.0, "Buyurdu ki: \"Hayır, bilakis metâhirden.\" Resûlullah sallallâhu aleyhi ve sellem metâhire (adam) gönderir, su getirilir ve Müslümanların ellerinin bereketini umarak onu içerdi."]]}, {"reader": false, "ar": [[588.0, "فهذا دليلٌ على أنّ النبيّ صلى الله عليه وسلم كان يتبرّك بآثار أيدي أصحابه،"], [598.0, "وهم من الأولياء والصالحين."], [601.0, "فإذا كان النبيّ صلى الله عليه وسلم يفعل ذلك فلماذا تمنعونه؟"]], "tr": [[588.0, "(Dediler ki:) Bu, Peygamber sallallâhu aleyhi ve sellem'in ashâbının ellerinin eserleriyle teberrük ettiğine delildir;"], [596.7, "onlar da veliler ve sâlihlerdendir."], [601.0, "Peygamber sallallâhu aleyhi ve sellem bunu yaptığına göre siz neden yasaklıyorsunuz?"]]}, {"reader": false, "ar": [[605.0, "الجواب: نقول: أثبِتِ العرشَ أوّلًا ثم انقُش."], [610.0, "فإنّ هذا الحديث من الأحاديث الضعيفة المنكرة؛"], [615.0, "فهو حديثٌ ضعيفٌ منكر،"], [617.2, "لأنّ مدارَه على رجلٍ يقال له:"], [620.4, "حسّان بن إبراهيم، وهو وإن كان صدوقًا ـ كما قاله الحافظ في «التقريب» ـ إلا أنه يُخطئ،"], [628.0, "ولا يُحتمَل تفرُّدُه، ولا يُعرَف عن أحدٍ أنه روى هذا الحديث بهذا اللفظ إلا هو."], [640.0, "وبناءً على ذلك فهو من جملة الأحاديث الضعيفة،"], [645.0, "فهو حديثٌ معلول، كما ذكر ذلك الإمامُ ابنُ عديٍّ رحمه الله تعالى."]], "tr": [[605.0, "Cevap: Deriz ki: Önce tahtı sabitle, sonra nakşet (önce rivayetin sıhhatini isbat et, sonra ondan hüküm çıkar)."], [615.0, "Çünkü bu hadis zayıf ve münker hadislerdendir."], [620.4, "Zayıf ve münker bir hadistir;"], [622.0, "çünkü (rivayetin) dayandığı nokta Hassân b."], [624.5, "İbrâhîm denen bir adamdır. O, Hâfız (İbn Hacer)'in \"et-Takrîb\"de dediği gibi sadûk olsa da hata eder ve teferrüdü (tek başına rivayeti) kabul edilmez."], [640.0, "Bu hadisi bu lafızla ondan başka rivayet eden kimse bilinmemektedir."], [644.4, "Buna binaen zayıf hadislerdendir; İmam İbn Adî —Allah ona rahmet etsin— zikrettiği üzere illetli (muallel) bir hadistir."]]}, {"reader": false, "ar": [[649.0, "بل ويقال جوابٌ آخر،"], [651.4, "وهي أنّ المتقرّر في القواعد أنّ تكثير أيدي المسلمين على شيءٍ ممّا يوجب بركتَه؛"], [660.0, "فإنّ النبيّ صلى الله عليه وسلم بيّن أنّ تكثير اليد على الطعام يوجب بركتَه."], [667.0, "يعني أنّ الاجتماع على الشيء ـ مأكولًا أو مشروبًا أو منتفَعًا به ـ ممّا يوجب بركتَه،"], [674.0, "لا لأنّ بركته من أيدي المسلمين،"], [676.0, "ولكن هكذا أراد الله عز وجل في الأمر الذي تكثر عليه الأيدي،"], [682.0, "سواءٌ أكانت مباركةً في ذاتها أو غيرَ مباركةٍ في ذاتها."]], "tr": [[649.0, "Hatta başka bir cevap da verilir:"], [652.1, "Kaidelerde yerleşik olan şudur: Müslümanların ellerinin bir şey üzerinde çoğalması onun bereketini gerektiren şeylerdendir."], [660.0, "Peygamber sallallâhu aleyhi ve sellem, yemek üzerinde ellerin çoğalmasının onun bereketini gerektirdiğini açıklamıştır."], [667.0, "Yani bir şey üzerinde —yenen, içilen veya faydalanılan bir şey olsun— toplanmak onun bereketini gerektiren şeylerdendir."], [674.3, "Bu, bereketin Müslümanların ellerinden gelmesinden dolayı değildir;"], [676.5, "fakat Allah Azze ve Celle, üzerinde ellerin çoğaldığı şey hakkında —o eller bizzat mübarek olsun veya bizzat mübarek olmasın— böyle dilemiştir."]]}, {"reader": false, "ar": [[687.0, "فالنبيّ صلى الله عليه وسلم أحبّ أن يتوضّأ من هذه المطاهر التي يكثر عليها وَقْعُ أيدي المسلمين؛"], [695.0, "لأنّ ما كثُر وَقْعُ يد المسلمين عليه حلّت فيه البركة."], [701.0, "ولكن بما أنّ الحديث ضعيفٌ أصالةً فلا نحتاج إلى هذا الجواب الثاني إلا عند من حكم عليه بأنه حسنٌ لغيره."]], "tr": [[687.0, "Peygamber sallallâhu aleyhi ve sellem, üzerine Müslümanların ellerinin çokça değdiği bu metâhirden abdest almayı sevmiştir;"], [695.0, "çünkü üzerine Müslümanların elinin çokça değdiği şeye bereket iner."], [701.0, "Fakat hadis aslen zayıf olduğu için, bu ikinci cevaba ancak onun hasen li-ğayrihî olduğuna hükmedenlere karşı ihtiyaç duyarız."]]}]}, {"ts": "11:50", "title": "2. Külliye (devam): Nâka kuyusu hadisi", "paras": [{"reader": false, "ar": [[710.0, "وممّا قالوه أيضًا من جملة أدلّتهم:"], [716.0, "حديثُ بئر الناقة، وهو حديثٌ في الصحيح،"], [720.0, "وفيه: أنّ الناس نزلوا مع رسول الله صلى الله عليه وسلم أرضَ ثمود،"], [725.0, "فاستَقَوا من بئرها واعتجنوا بها،"], [729.0, "فأمرهم رسولُ الله صلى الله عليه وسلم أن يُهريقوا ما استَقَوا،"], [735.0, "وأن يُتلِفوا ما عجنوا،"], [737.0, "وأن يَعمِدوا إلى بئر الناقة فيشربوا منها ويعتجنوا منها."], [740.8, "(قالوا:) فهذا دليلٌ على وجود البركة فيها."]], "tr": [[710.0, "Delilleri arasında söyledikleri şeylerden biri de Nâka kuyusu hadisidir;"], [716.6, "Sahîh'te bulunan bir hadistir. Onda şöyle geçer:"], [720.2, "İnsanlar Resûlullah sallallâhu aleyhi ve sellem ile birlikte Semûd diyarına kondular, onun kuyusundan su çektiler ve onunla hamur yoğurdular."], [729.0, "Resûlullah sallallâhu aleyhi ve sellem onlara, çektikleri suyu dökmelerini, yoğurdukları hamuru telef etmelerini ve Nâka (deve) kuyusuna yönelip ondan içmelerini ve onunla hamur yoğurmalarını emretti."], [740.8, "(Dediler ki:) Bu, onda bereket bulunduğuna delildir."]]}, {"reader": false, "ar": [[744.0, "فنقول: إنّ هذا من التخريج الخطأ؛"], [747.0, "بل إنّ النبيّ صلى الله عليه وسلم أمرهم أن يَعمِدوا إلى هذه البئر بخصوصها لأنها خاليةٌ من آثار العذاب الذي عُذِّب به القوم."], [757.0, "ولذلك فجميعُ جزئيّات ديار ثمود قد حلّها السخطُ والعذاب واللعنة،"], [765.0, "فيُخشى على من انتفع من شيءٍ منها أن تأتيه تلك اللعنة أو يأتيه شيءٌ من آثارها."], [772.0, "فليست المسألة في مسألة البركة من عدمها،"], [776.3, "وإنما يُراد بها سدُّ باب ضرر؛"], [780.0, "لأنّ المتقرّر في القواعد أن لا ضررَ ولا ضِرار، وأنّ الضرر يُزال."]], "tr": [[744.0, "Deriz ki: Bu yanlış bir tahrîctir (hükmü yanlış bir dayanağa bağlamaktır)."], [747.0, "Bilakis Peygamber sallallâhu aleyhi ve sellem onlara özellikle bu kuyuya yönelmelerini emretti;"], [753.0, "çünkü o, kavmin uğratıldığı azabın izlerinden uzaktır."], [757.0, "Bu yüzden Semûd diyarının bütün parçalarına gazap, azap ve lanet inmiştir;"], [763.3, "onlardan bir şeyden faydalanana o lanetin veya onun izlerinden bir şeyin gelmesinden korkulur."], [769.4, "Dolayısıyla mesele, bereketin olup olmaması meselesi değildir;"], [772.0, "bununla bir zarar kapısını kapatmak kastedilmektedir."], [776.3, "Çünkü kaidelerde yerleşik olan şudur:"], [780.0, "Zarar vermek de zarara zararla karşılık vermek de yoktur ve zarar giderilir."]]}, {"reader": false, "ar": [[785.0, "فإذا جئتَ إلى مكانٍ قد انتشرت فيه الآفة،"], [788.7, "أو انتشرت فيه الميكروبات مثلًا أو الفيروسات،"], [792.0, "وثَمّ مكانٌ قد حُصِّن من هذا كلِّه،"], [794.5, "فإنك تَعمِد إلى هذا المكان،"], [796.2, "من باب التبرُّك <span class=\"q\">؟ 13:12<\/span> أو من باب وقاية الشرّ؛"], [799.0, "من باب وقاية الشرّ وسدِّ أبواب الضرر."], [802.0, "فهذا الحديث ليس معنا أصلًا في مسألة جواز التبرُّك بآثار الصالحين."]], "tr": [[785.0, "Afetin yayıldığı veya mesela mikropların ya da virüslerin yayıldığı bir yere gelsen ve orada bütün bunlardan korunmuş bir yer bulunsa, bu yere yönelirsin;"], [795.9, "teberrük kabilinden <span class=\"q\">؟<\/span> veya şerden korunma kabilinden;"], [799.0, "(yani) şerden korunma ve zarar kapılarını kapatma kabilinden."], [802.0, "Dolayısıyla bu hadis, sâlihlerin eserleriyle teberrükün caiz olması meselesinde aslen bizimle ilgili değildir."]]}, {"reader": false, "ar": [[809.0, "ثم أضِفْ إلى هذا:"], [810.7, "أننا لو سلّمنا ـ أنهم لم يرتضوا بهذا الجواب ـ فإنّ الذي بنى هذا البئر إنما هو صالحٌ عليه الصلاة والسلام،"], [818.8, "فهو من جملة آثار الأنبياء،"], [821.0, "وقد قرّرنا سابقًا بأنّ بركة الأنبياء ذاتيّةٌ منتقلة."]], "tr": [[809.0, "Sonra buna şunu da ekle:"], [810.7, "Diyelim ki —bu cevaba razı olmadılar— (onların dediğini) kabul ettik;"], [814.4, "bu kuyuyu yapan Sâlih aleyhisselâmdır;"], [816.6, "dolayısıyla o, nebîlerin eserlerindendir. Daha önce de nebîlerin bereketinin zâtî ve intikal eden bir bereket olduğunu takrir etmiştik."]]}]}, {"ts": "13:48", "title": "2. Külliye (devam): Cüreyc hadisi ve \"geçmiş ümmetlerin şeriati\"", "paras": [{"reader": false, "ar": [[828.0, "ومن أدلّتهم أيضًا أنهم قالوا:"], [833.0, "عندنا في الصحيح حديثُ جُرَيجٍ الراهب ـ أي راهب بني إسرائيل ـ وقصّتُه معروفةٌ لديكم."], [842.0, "وبعد أن ثبتت براءتُه جاءه قومُه يعتذرون إليه،"], [848.0, "وفي الحديث: «فأقبلوا على جُرَيجٍ يُقبِّلونه ويتمسّحون به» ـ يُقبِّلونه ويتمسّحون به ـ «وقالوا: نبني لك صومعتك من ذهب» إلى آخر الحديث."], [865.0, "فقالوا: هذا دليلٌ على جواز التبرُّك والتمسُّح بآثار الأولياء والصالحين."]], "tr": [[828.0, "Delillerinden biri de şunu söylemeleridir:"], [833.0, "Sahîh'te Rahip Cüreyc'in —yani İsrâiloğulları'nın rahibinin— hadisi var;"], [836.3, "kıssası sizce bilinmektedir. Masumiyeti sabit olduktan sonra kavmi ondan özür dilemeye geldi."], [842.0, "Hadiste şöyle geçer: \"Cüreyc'e yöneldiler;"], [849.5, "onu öpüyor ve ona sürünüyorlardı\" —onu öpüyor ve ona sürünüyorlardı— \"ve dediler ki:"], [861.0, "Manastırını sana altından yapalım\" hadisin sonuna kadar."], [865.0, "Dediler ki: Bu, velilerin ve sâlihlerin eserleriyle teberrükün ve onlara sürünmenin caiz olduğuna delildir."]]}, {"reader": false, "ar": [[873.0, "فنقول جوابًا عن ذلك:"], [875.0, "أثبِتِ العرشَ ثم انقُش."], [877.0, "فإنّ الحديث وإن كان صحيحًا إلا أنه في شرع من قبلنا،"], [883.0, "وما كان من شرع من قبلنا فلا يجوز أن نستدلّ به إلا بعد ثبوت طريقين ـ أو بعد ثبوت مسألتين ـ:"], [895.0, "المسألة الأولى: أن يثبت أنه من شرع من قبلنا؛"]], "tr": [[873.0, "Buna cevap olarak deriz ki:"], [875.0, "Önce tahtı sabitle, sonra nakşet."], [877.0, "Hadis sahih olsa da bizden öncekilerin şeriatine aittir."], [882.3, "Bizden öncekilerin şeriatinden olan bir şeyle ancak iki yol —veya iki mesele— sabit olduktan sonra istidlal etmemiz caizdir."], [895.0, "Birinci mesele: Onun bizden öncekilerin şeriatinden olduğunun sabit olması;"]]}, {"reader": false, "ar": [[900.0, "فأثبِتوا لنا أنّ ما فعله هؤلاء العوامُّ من الهوامّ أنه من شريعة بني إسرائيل!"], [907.0, "فإنّ هؤلاء الظَّلَمة ظلموه واتّهموه وكادوا يقتلونه،"], [915.0, "لولا أنّ الله عز وجل أراهم آية."], [917.0, "أفيُستدَلّ بفعل مثل هؤلاء الظلمة على مثل هذه المسألة الشرعيّة؟"], [924.0, "فلو كانوا أنبياءَ وفعلوها،"], [926.5, "أو كانوا صالحين وفعلوها،"], [929.0, "أو كانوا من علماء بني إسرائيل وفعلوها،"], [932.0, "لجعلناها من جملة شريعة من قبلنا."], [935.0, "لكنّهم هَوامٌّ طَوامٌّ عَوامٌّ،"], [937.9, "لا يُؤخَذ منهم شرع."]], "tr": [[900.0, "Bu avam, bu haşarat takımının yaptığının İsrâiloğulları'nın şeriatinden olduğunu bize isbat edin!"], [905.0, "Zira bu zalimler ona zulmettiler, onu itham ettiler ve Allah Azze ve Celle onlara bir mucize göstermeseydi neredeyse onu öldüreceklerdi."], [917.0, "Böyle zalimlerin fiiliyle bu gibi şer'î bir meselede istidlal edilir mi?"], [924.0, "Eğer bunlar nebî olup bunu yapmış olsalardı veya sâlih olup bunu yapmış olsalardı ya da İsrâiloğulları'nın âlimlerinden olup bunu yapmış olsalardı, onu bizden öncekilerin şeriatinden sayardık."], [935.0, "Fakat onlar haşarat, felaket, avam takımıdır; onlardan şeriat alınmaz."]]}, {"reader": false, "ar": [[941.0, "ولذلك فعلوا ما فعلوا بجُرَيج."], [945.0, "ومن شدّة جهلهم أنهم قالوا:"], [947.8, "نبني صومعتك من ذهب!"], [950.0, "فإنّ مثل هذا الإسراف والتبذير في البناء لا يفعله مَن؟"], [954.0, "لا يفعله الأنبياءُ ولا الرسل ولا العلماء ولا الصالحون ولا الزهّاد ولا العُبّاد."], [959.0, "بل إنّ تلك الزانية اتّفقت معهم على أنها ستُضِلُّه وتُنزِله من صومعته،"], [965.5, "وأنها تُلفِّق له هذه التهمة."]], "tr": [[941.0, "Bu yüzden Cüreyc'e yaptıklarını yaptılar."], [945.0, "Cahilliklerinin şiddetindendir ki \"Manastırını altından yapalım\" dediler!"], [950.0, "Binada böyle bir israfı ve saçıp savurmayı kim yapmaz?"], [954.0, "Ne nebîler, ne resuller, ne âlimler, ne sâlihler, ne zâhidler ne de âbidler yapar."], [959.0, "Hatta o zâniye kadın, onu saptıracağı ve manastırından indireceği, ona bu iftirayı uyduracağı konusunda onlarla anlaşmıştı."]]}, {"reader": false, "ar": [[968.2, "فكونُهم يرضَون بمثل هذا الفعل في عابدٍ من عُبّادهم،"], [973.0, "ثم بعد أن ظهرت توبتُه <span class=\"q\">؟ 16:13<\/span> قهرًا عن أنوفهم بوجود آيةٍ لا تَكذِب ـ وهي نطقُ ذلك الصبيّ ـ ثم صاروا يتمسّحون به؛"], [982.4, "فيأتي مُغفَّلٌ بعد ذلك يقول:"], [985.3, "هذا دليلٌ على جواز التمسُّح بآثار الأولياء والصالحين!"], [990.0, "وهذا لا يصلح أن يُستدَلّ به أبدًا على هذه الجزئيّة."], [995.0, "لماذا؟ لأنه ليس من فعل العلماء،"], [997.1, "وليس من فعل العُبّاد،"], [998.6, "وليس من فعل الصالحين."], [1000.0, "فإذن هو لم يثبت أصالةً أنه من شرع من قبلنا."]], "tr": [[968.2, "Âbidlerinden biri hakkında böyle bir fiile razı olmaları, sonra burunları sürtülerek, yalan söylemeyen bir mucizeyle —o bebeğin konuşmasıyla— onun tövbesi <span class=\"q\">؟<\/span> (masumiyeti) ortaya çıktıktan sonra ona sürünmeye başlamaları… Sonra bir gafil çıkıp \"Bu, velilerin ve sâlihlerin eserlerine sürünmenin caiz olduğuna delildir\" diyor!"], [990.0, "Bununla bu cüz'î meselede asla istidlal edilemez."], [995.0, "Neden? Çünkü bu ne âlimlerin fiilidir, ne âbidlerin fiilidir ne de sâlihlerin fiilidir."], [1000.0, "O hâlde bunun bizden öncekilerin şeriatinden olduğu aslen sabit olmamıştır."]]}, {"reader": false, "ar": [[1005.0, "ثم سلّمنا جدلًا أنه ثبت أنه من شرع من قبلنا،"], [1009.0, "فإنّ المتقرّر في القواعد أنّ شرعَ من قبلنا شرعٌ لنا ما لم يَرِد نسخُه في شرعنا."], [1017.0, "وإنه بإجماع أصحاب النبيّ صلى الله عليه وسلم وإقرارِه لهم أنهم لم يكونوا يتمسّحون بأحد،"], [1025.2, "ولا بثيابه، ولا بعرقه،"], [1027.4, "ولا بنُخامته، ولا بفضلة سُؤر شرابه وطعامه وطَهوره،"], [1031.7, "إلا بالنبيّ صلى الله عليه وسلم."]], "tr": [[1005.0, "Sonra, tartışma uğruna, bunun bizden öncekilerin şeriatinden olduğunun sabit olduğunu kabul ettik diyelim;"], [1009.5, "kaidelerde yerleşik olan şudur: Bizden öncekilerin şeriati, şeriatimizde neshedildiğine dair (delil) gelmedikçe bizim için de şeriattir."], [1017.0, "Peygamber sallallâhu aleyhi ve sellem'in ashâbının icmâı ve onun da onları bu konuda onaylamasıyla (sabittir ki) onlar, Peygamber sallallâhu aleyhi ve sellem dışında hiç kimseye, onun elbisesine, terine, balgamına, içeceğinin, yemeğinin ve abdest suyunun artığına sürünmezlerdi."]]}, {"reader": false, "ar": [[1035.0, "فلو كان ذلك ممّا يُشرَع فما الذي يجعلهم لا يفعلونه مع أبي بكرٍ رضي الله عنه،"], [1043.0, "أو مع عمرَ رضي الله تعالى عنه،"], [1046.0, "أو مع عثمان، أو مع عليّ،"], [1048.0, "أو مع سادات المهاجرين والأنصار رضي الله عنهم وأرضاهم؟"], [1051.0, "الجواب: لأنه أصلًا لم يُشرَع."], [1054.0, "فنحن نرفض الجزئيّتين: فهو ليس من شرع من قبلنا،"], [1060.0, "ولكن إن سلّمنا جدلًا فإنّ شريعتنا قد جاءت بنسخه."], [1064.0, "فليس لهم دليلٌ أبدًا على ما يريدونه من جواز التبرُّك بآثار الصالحين."]], "tr": [[1035.0, "Eğer bu meşru kılınan şeylerden olsaydı, onların bunu Ebû Bekir —Allah ondan razı olsun— ile veya Ömer —Allah Teâlâ ondan razı olsun— ile ya da Osman ile, Ali ile veya Muhâcir ve Ensâr'ın efendileriyle —Allah onlardan razı olsun ve onları razı etsin— yapmamalarına sebep ne olabilir?"], [1051.0, "Cevap: Çünkü aslen meşru kılınmamıştır."], [1054.0, "Biz iki cüz'ü de reddediyoruz:"], [1056.0, "Bu, bizden öncekilerin şeriatinden değildir;"], [1059.3, "ama tartışma uğruna kabul etsek bile şeriatimiz onun neshiyle gelmiştir."], [1064.0, "Dolayısıyla sâlihlerin eserleriyle teberrükün caiz olması şeklinde istedikleri şeye asla delilleri yoktur."]]}]}, {"ts": "17:55", "title": "2. Külliye (devam): Kâdî Iyâd'ın Cüreyc hadisiyle istidlale reddiyesi", "paras": [{"reader": false, "ar": [[1075.0, "ثم يا عجبًا لهم!"], [1076.8, "والله ندعوهم إلى الجنّة ويدعوننا إلى النار."], [1080.0, "ولذلك قال القاضي عياضٌ رحمه الله تعالى في ردّ هذا الاستدلال بهذا الحديث،"], [1089.0, "قال: «والظاهرُ من الحديث» ـ أي حديث جُرَيج ـ «ظلمُ جميعهم له أوّلًا، وأنّ من سعى في ذلك لم يكن ممّن يتّقي الله»."], [1102.0, "يعني: يُبيّن أنّ هذا التمسُّح لم يصدر من المتّقين العلماء حتى يُستدَلّ بفعلهم."]], "tr": [[1075.0, "Sonra onlara şaşılır! Vallahi biz onları cennete çağırıyoruz, onlar ise bizi cehenneme çağırıyorlar."], [1080.0, "Bu yüzden Kâdî Iyâd —Allah Teâlâ ona rahmet etsin— bu hadisle yapılan bu istidlali reddederken şöyle demiştir:"], [1089.6, "\"Hadisten zahir olan\" —yani Cüreyc hadisinden— \"önce hepsinin ona zulmetmiş olması ve bunda çaba gösterenin Allah'tan korkanlardan olmadığıdır.\" Yani bu sürünmenin, fiilleriyle istidlal edilecek takvâ sahibi âlimlerden sadır olmadığını açıklıyor."]]}, {"reader": false, "ar": [[1109.0, "أُعيد الكلام مرّةً أخرى؛"], [1112.0, "قال القاضي عياضٌ رحمه الله:"], [1114.0, "«والظاهرُ من الحديث ظلمُ جميعهم له أوّلًا، وأنّ من سعى في ذلك لم يكن ممّن يتّقي الله، فلا حجّة فيه. ألا ترى كيف قالت لهم البغيّ: إن شئتم لأفتننّه لكم، فلم يُنكِروا عليها؟ ومثلُ هذا لا يرضاه ذو دينٍ في أحدٍ من الناس، ولا يحلّ له المساعدةُ عليه، فكيف في عابدٍ متبتّل؟»."]], "tr": [[1109.0, "Sözü bir kez daha tekrar ediyorum;"], [1109.8, "Kâdî Iyâd —Allah ona rahmet etsin— şöyle dedi:"], [1112.0, "\"Hadisten zahir olan, önce hepsinin ona zulmetmiş olması ve bunda çaba gösterenin Allah'tan korkanlardan olmadığıdır;"], [1114.0, "dolayısıyla onda delil yoktur. Görmüyor musun, o fâhişe kadın onlara 'Dilerseniz onu sizin için fitneye düşüreyim' dediğinde ona karşı çıkmadılar?"], [1125.3, "Din sahibi biri, insanlardan herhangi biri hakkında böyle bir şeye razı olmaz ve ona yardım etmesi helal olmaz;"], [1138.3, "ya kendini ibadete vermiş bir âbid hakkında nasıl olur?\""]]}, {"reader": false, "ar": [[1144.0, "يعني: أنه لو خُطِّط لأفسق الناس بمثل هذه الخطّة لما قبِلها ذو دين،"], [1151.0, "فكيف يُخطَّط لعابدٍ من عُبّادهم؟"], [1153.0, "ثم يأتينا من يُجيز التمسُّح بالأولياء والصالحين بناءً على فعل هؤلاء الظلمة!"], [1159.0, "ثم قال رحمه الله:"], [1161.4, "«فكيف في عابدٍ متبتّل؟ ألا تراهم كيف بادروا إلى تصديقها، وضربوه وآذَوه، ولم يسمعوا قوله، حتى أراهم الله الآية»."], [1173.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[1144.0, "Yani insanların en fâsıkı için böyle bir plan kurulsa din sahibi biri buna razı olmazdı;"], [1150.5, "ya onların âbidlerinden biri için nasıl kurulur?"], [1153.0, "Sonra biri çıkıp bu zalimlerin fiiline dayanarak velilere ve sâlihlere sürünmeyi caiz görüyor!"], [1158.4, "Sonra (Kâdî Iyâd) —Allah ona rahmet etsin— şöyle dedi:"], [1161.4, "\"Ya kendini ibadete vermiş bir âbid hakkında nasıl olur?"], [1164.5, "Görmüyor musun, onu tasdik etmeye nasıl koştular, onu dövdüler, ona eziyet ettiler ve Allah onlara mucizeyi gösterinceye kadar onun sözünü dinlemediler.\" Sözü —Allah Teâlâ ona rahmet etsin— burada sona erdi."]]}, {"reader": false, "ar": [[1178.0, "ومن جملة أدلّتهم أيضًا:"], [1180.3, "قياسُ الأولياء والصالحين على النبيّ صلى الله عليه وسلم في جواز التبرُّك،"], [1187.1, "بجامع الولاية والصلاح والإيمان والتقوى."], [1190.0, "وقد أجبتُ عن هذا بأنه قياسٌ مع الفارق،"], [1195.2, "ولا داعيَ لإعادته هنا،"], [1197.9, "اكتفاءً بما قرّرتُه في الكلّيّات السابقة."]], "tr": [[1178.0, "Delillerinden biri de velileri ve sâlihleri, velâyet, salâh, iman ve takvâ ortak illetiyle teberrükün caiz olmasında Peygamber sallallâhu aleyhi ve sellem'e kıyas etmeleridir."], [1190.0, "Buna, bunun farklı şeyler arasında yapılan bir kıyas olduğu şeklinde cevap verdim;"], [1195.9, "önceki külliyelerde takrir ettiklerimle yetinerek burada tekrar etmeye gerek yok."]]}]}, {"ts": "20:03", "title": "2. Külliye (sonu): Rivayet edilen hikâyeler ve âlimlerin fiilleri", "paras": [{"reader": false, "ar": [[1203.0, "ولكنّ الخلاصة: أنّ جميع ما ثبت من جواز التبرُّك بآثار النبيّ صلى الله عليه وسلم أنها ـ بإجماع أصحابه ـ من خصوصيّاته،"], [1220.0, "بإجماع أصحابه رضي الله عنهم وأرضاهم."]], "tr": [[1203.0, "Fakat özet şudur: Peygamber sallallâhu aleyhi ve sellem'in eserleriyle teberrükün caiz olduğuna dair sabit olan her şey —ashâbının icmâıyla— onun hususiyetlerindendir;"], [1214.6, "ashâbının —Allah onlardan razı olsun ve onları razı etsin— icmâıyla."]]}, {"reader": false, "ar": [[1226.0, "ومن أدلّتهم أيضًا: حكاياتٌ تُروى،"], [1229.1, "من ها هنا وها هنا،"], [1234.0, "في بعض كتب التراجم التي لا تُراعي صحّةَ إسنادٍ ولا ضعفَ إسناد:"], [1239.0, "من أنّ فلانًا كان يأتي إلى قبر العالم الفلانيّ فيتبرّك برُمّانته <span class=\"q\">؟ 20:44<\/span>،"], [1245.6, "أو يتبرّك بترابه، أو ربما دعا الله عز وجل عنده؛"], [1251.0, "وأنّ فلانًا العالمَ جاء إلى قبر فلانٍ العالم،"], [1254.0, "أو جاء إلى بيت فلانٍ العالم،"], [1256.0, "وتبرّك بمائه، أو تبرّك بطعامه،"], [1258.0, "أو تبرّك بوسادته، أو نحو ذلك."]], "tr": [[1226.0, "Delillerinden biri de, isnadın sıhhatini de zayıflığını da gözetmeyen bazı terâcim (biyografi) kitaplarında oradan buradan rivayet edilen hikâyelerdir:"], [1239.0, "Falancanın filan âlimin kabrine gelip onun rummânesiyle (kabir/minber topuzuyla) <span class=\"q\">؟<\/span> veya toprağıyla teberrük ettiği ya da belki onun yanında Allah Azze ve Celle'ye dua ettiği;"], [1251.0, "falan âlimin filan âlimin kabrine veya filan âlimin evine gelip onun suyuyla, yemeğiyle, yastığıyla veya buna benzer bir şeyle teberrük ettiği (gibi hikâyeler)."]]}, {"reader": false, "ar": [[1262.0, "وكلُّ ذلك من الأمور التي لا ينبغي أن يُبنى عليها اعتقاد،"], [1268.0, "فضلًا عن كون كثيرٍ منها لا خِطامَ له ولا زِمام."], [1274.0, "وما صحّ منه ـ انتبه ـ وما صحّ منه عن بعض من يُحتجّ بقوله،"], [1280.0, "فإننا نجيب عنه بأنّ قول النبيّ صلى الله عليه وسلم وفعلَ الصحابة مقدَّمٌ على قول كلّ أحد؛"], [1286.0, "وأنّ المتقرّر في القواعد أنّ أقوال العلماء يُستدَلّ لها لا بها،"], [1292.0, "وأنّ كلًّا يُؤخَذ من قوله ويُترَك إلا قولَ الشارع،"], [1297.0, "وأنّ أحدًا من أهل العلم لم تُكتَب له العصمة."]], "tr": [[1262.0, "Bütün bunlar, üzerine itikad bina edilmemesi gereken şeylerdendir;"], [1266.0, "üstelik birçoğunun ne yuları ne dizgini vardır (dayanaksızdır)."], [1274.0, "Bunlardan sahih olan —dikkat et— sözüyle delil getirilen bazı kimselerden sahih olarak gelen ise, ona şöyle cevap veririz:"], [1281.6, "Peygamber sallallâhu aleyhi ve sellem'in sözü ve sahabenin fiili herkesin sözünden önce gelir."], [1286.0, "Kaidelerde yerleşik olan şudur: Âlimlerin sözlerine delil getirilir, onlarla delil getirilmez;"], [1291.5, "Şâri' (Peygamber)'in sözü dışında herkesin sözünden alınır da bırakılır da;"], [1297.0, "ilim ehlinden hiç kimse için ismet (hatadan korunmuşluk) yazılmamıştır."]]}, {"reader": false, "ar": [[1302.0, "فإنّ العصمة إنما هي فيما صحّ من النصّ وما وقع عليه الإجماع."], [1309.0, "وأمّا أفعالُ آحاد أهل العلم فإنّ أحدًا لم تُكتَب له العصمة في كلّ أفعاله،"], [1316.0, "فيكون من جملة خطئه الذي وقع فيه،"], [1319.5, "ولا يُتابَع العالمُ على خطئه ـ فيما إذا سلّمنا صحّة النقل عنه ـ فلا يجوز أن يُستدَلّ بفعله على تقرير شيءٍ من ذلك."]], "tr": [[1302.0, "İsmet ancak nastan sahih olanda ve üzerinde icmâ edilende vardır."], [1304.5, "İlim ehlinden tek tek kişilerin fiillerine gelince, hiç kimse için bütün fiillerinde ismet yazılmamıştır."], [1309.0, "Bu (fiil) onun düştüğü hatalardan olur;"], [1313.8, "âlime hatasında uyulmaz —ondan nakledilenin sıhhatini kabul ettiğimiz takdirde—."], [1320.5, "Dolayısıyla onun fiiliyle böyle bir şeyi takrir etmeye istidlal etmek caiz değildir."]]}, {"reader": false, "ar": [[1332.0, "ثم أضِفْ إلى هذا شيئًا آخر:"], [1336.0, "وهي أنّ أكثر المنقولات عن مثل هؤلاء إنما هي منقولاتٌ في التبرُّك بآثار الصالحين،"], [1343.0, "أي بآثار قبور الصالحين."], [1346.0, "والتبرُّك بآثار القبور هذا له شأنٌ آخر أصلًا في مسألةٍ أخرى."], [1351.0, "وإنما الذي نتكلّم عنه هنا:"], [1353.0, "أن يتبرّك الإنسان بشيءٍ من آثار الصالح نفسه،"], [1357.0, "لا بشيءٍ من تراب قبره."], [1359.0, "وهذا الذي يُنقَل عن كثيرٍ من أهل العلم لا يصحّ أصالةً."]], "tr": [[1332.0, "Sonra buna başka bir şey daha ekle:"], [1336.0, "Bu gibi kimselerden nakledilenlerin çoğu, sâlihlerin eserleriyle —yani sâlihlerin kabirlerinin eserleriyle— teberrük hakkındaki nakillerdir."], [1343.8, "Kabirlerin eserleriyle teberrükün ise aslen başka bir meselede başka bir durumu vardır."], [1351.0, "Burada bahsettiğimiz, insanın kabrinin toprağından bir şeyle değil, sâlihin bizzat kendisinin eserlerinden bir şeyle teberrük etmesidir."], [1359.0, "İlim ehlinin birçoğundan nakledilen bu şey ise aslen sahih değildir."]]}, {"reader": false, "ar": [[1365.0, "والخلاصة ـ وفّقكم الله ـ: أنّ جميع ما نراه من الصوفيّة وأتباعهم،"], [1372.0, "ومن الرافضة وأتباعهم، ومن القاديانيّة وأتباعهم،"], [1377.0, "ومن الدروز وأتباعهم، ومن الإسماعيليّة وأتباعهم،"], [1381.0, "وغيرهم من الطوائف، من التبرُّك بآثار من يزعمون فيه الولايةَ والتقى والصلاح والعلم،"], [1388.0, "كلُّ ذلك على غير هدي محمّدٍ صلى الله عليه وسلم وأصحابه،"], [1393.0, "بل لا يكون عندنا ـ معاشرَ أهل السنّة ـ إلا موصوفًا بالبدعة."], [1399.0, "نسأل الله أن يعصمنا والمسلمين جميعًا من ذلك."]], "tr": [[1365.0, "Özet şudur —Allah sizi muvaffak kılsın—:"], [1367.1, "Sûfîlerden ve onlara tâbi olanlardan, Râfıza'dan ve onlara tâbi olanlardan, Kâdiyânîlerden ve onlara tâbi olanlardan, Dürzîlerden ve onlara tâbi olanlardan, İsmâilîlerden ve onlara tâbi olanlardan ve diğer fırkalardan gördüğümüz, velâyet, takvâ, salâh ve ilim sahibi olduğunu iddia ettikleri kimselerin eserleriyle teberrük etmenin hepsi Muhammed sallallâhu aleyhi ve sellem'in ve ashâbının yolu üzere değildir."], [1394.1, "Bilakis biz Ehl-i Sünnet topluluğunun nezdinde ancak bid'atle nitelenir."], [1399.0, "Allah'tan bizi ve bütün Müslümanları bundan korumasını dileriz."]]}]}, {"ts": "23:23", "title": "3. Külliye: Bir âlimden, veliden veya sâlihten dinî bir menfaatle teberrük eden herkese bir sakınca yoktur", "paras": [{"reader": false, "ar": [[1403.0, "ومن الكلّيّات أيضًا ـ ما أدري كلامي واضح يا جماعة؟"], [1406.0, "ـ ومن الكلّيّات أيضًا: <b>كلُّ من تبرّك بمنفعةٍ دينيّةٍ من عالمٍ أو وليٍّ أو صالحٍ فلا بأسَ عليه.<\/b> كلُّ من تبرّك بمنفعةٍ دينيّةٍ من عالمٍ أو وليٍّ أو صالحٍ فلا بأس عليه."], [1434.0, "أُعيدها مرّةً ثالثة: كلُّ من تبرّك بمنفعةٍ دينيّةٍ من عالمٍ أو وليٍّ أو صالحٍ فلا بأس عليه."]], "tr": [[1403.0, "Külliyelerden biri de —sözüm anlaşılıyor mu bilmiyorum, ey cemaat?— külliyelerden biri de şudur:"], [1414.0, "<b>3. külliye: Bir âlimden, bir veliden veya bir sâlihten dinî bir menfaatle teberrük eden herkese bir sakınca yoktur.<\/b> (İki kez daha tekrar ediyor; üçüncüsünde \"Üçüncü kez tekrar ediyorum\" diyor.)"]]}, {"reader": false, "ar": [[1448.0, "أقول وبالله التوفيق: إنّ الكلّيّة التي قبلها إنما كانت في التبرُّك بآثار الصالحين الدنيويّة البحتة،"], [1458.0, "كالتبرُّك بنُخامةٍ، أو التبرُّك بعرقٍ،"], [1460.7, "أو التبرُّك بشعرٍ، أو التبرُّك بثياب،"], [1464.0, "وهي من جملة الأمور التي لا تعلُّقَ لها بمسألة الدين."], [1469.0, "وقد بيّنّا أنّ التبرُّك بآثار الصالحين الدنيويّة البحتة أنه من جملة البدع في شريعة محمّدٍ صلى الله عليه وسلم."]], "tr": [[1448.0, "Tevfik Allah'tandır, derim ki: Önceki külliye, sâlihlerin saf dünyevî eserleriyle teberrük hakkındaydı;"], [1461.8, "balgamla, terle, saçla veya elbiseyle teberrük gibi."], [1469.0, "Bunlar din meselesiyle hiçbir ilgisi olmayan şeylerdendir."], [1472.2, "Sâlihlerin saf dünyevî eserleriyle teberrükün Muhammed sallallâhu aleyhi ve sellem'in şeriatinde bid'atlerden olduğunu açıkladık."]]}, {"reader": false, "ar": [[1479.0, "وأمّا هذه الكلّيّة فهي في الأمر الدينيّ المحض:"], [1484.0, "فإذا كان هناك عالمٌ من العلماء نستقي منه شيئًا من مصالح الدين،"], [1491.0, "أو صالحًا من الصالحين نستقي منه شيئًا من مصالح الدين،"], [1497.0, "أو وليًّا من أولياء الله عز وجل نستقي منه شيئًا من مصالح الدين،"], [1502.0, "فإنّ التبرُّك بهذه المنفعة الدينيّة البحتة جائزٌ،"], [1507.4, "لا بأس به ولا حرج فيه."]], "tr": [[1479.0, "Bu külliye ise saf dinî iş hakkındadır:"], [1484.0, "Eğer kendisinden dinin maslahatlarından bir şey aldığımız âlimlerden bir âlim veya kendisinden dinin maslahatlarından bir şey aldığımız sâlihlerden bir sâlih ya da kendisinden dinin maslahatlarından bir şey aldığımız Allah Azze ve Celle'nin velilerinden bir veli varsa, bu saf dinî menfaatle teberrük caizdir;"], [1505.8, "onda ne sakınca ne de bir beis vardır."]]}]}, {"ts": "25:10", "title": "3. Külliye (devam): Sâlihlerin varlığının ve salâhının bereketi", "paras": [{"reader": false, "ar": [[1510.0, "وهو الذي دلّت عليه الأدلّة:"], [1513.2, "فإنّ مخالطة الصالحين ومجاورتهم يحصل بها البركةُ والخير،"], [1518.5, "فيتعلّمون منهم العلمَ والعمل،"], [1521.0, "ويسترشدون بأمرهم ونهيهم. بل إنّ الله عز وجل يدفع العذابَ عن البلد بوجود صالحٍ أو مُصلحٍ فيه،"], [1535.4, "ببركة دعائهم، وببركة عبادتهم،"], [1537.8, "وببركة صلاحهم. كما حفظ الله عز وجل مالَ اليتيمين ببركة صلاح أبيهما،"], [1545.0, "كما قال الله عز وجل في قصّة موسى والخضر:"], [1550.0, "<span class=\"ayah\">﴿وَكَانَ أَبُوهُمَا صَالِحًا﴾<\/span> <span class=\"ref\">[الكهف: ٨٢]<\/span>؛ أي:"], [1555.7, "لبركة صلاح أبيهما عُصِم مالُهما وحُفِظ."]], "tr": [[1510.0, "Delillerin delâlet ettiği de budur:"], [1513.2, "Sâlihlerle kaynaşmak ve onlara komşu olmakla bereket ve hayır hâsıl olur;"], [1517.8, "onlardan ilim ve amel öğrenirler, emirleri ve yasaklarıyla yol bulurlar."], [1527.0, "Hatta Allah Azze ve Celle, bir beldede sâlih veya ıslah edici birinin bulunmasıyla —onların duasının bereketiyle, ibadetlerinin bereketiyle ve salâhlarının bereketiyle— o beldeden azabı defeder."], [1539.0, "Nitekim Allah Azze ve Celle iki yetimin malını babalarının salâhının bereketiyle korumuştur;"], [1545.0, "Allah Azze ve Celle'nin Mûsâ ile Hızır kıssasında buyurduğu gibi:"], [1550.0, "<span class=\"ayah\">﴿Babaları da sâlih bir kimseydi﴾<\/span> [Kehf 82];"], [1555.0, "yani babalarının salâhının bereketi için malları korundu ve muhafaza edildi."]]}, {"reader": false, "ar": [[1560.0, "وكذلك أيضًا في قول الله عز وجل:"], [1566.0, "<span class=\"ayah\">﴿وَمَا كَانَ رَبُّكَ لِيُهْلِكَ الْقُرَىٰ بِظُلْمٍ وَأَهْلُهَا مُصْلِحُونَ﴾<\/span> <span class=\"ref\">[هود: ١١٧]<\/span>."], [1573.0, "فوجودُ المصلحين في البلد صمّامُ أمانٍ ـ بإذن الله عز وجل ـ من نزول العذاب على أهلها."], [1583.0, "وكذلك استغفارُ الصالحين، كما قال الله عز وجل:"], [1587.0, "<span class=\"ayah\">﴿وَمَا كَانَ اللَّهُ لِيُعَذِّبَهُمْ وَأَنتَ فِيهِمْ ۚ وَمَا كَانَ اللَّهُ مُعَذِّبَهُمْ وَهُمْ يَسْتَغْفِرُونَ﴾<\/span> <span class=\"ref\">[الأنفال: ٣٣]<\/span>."], [1593.0, "فإذا كثُر الاستغفارُ من الصالحين والعلماء وأهل البلد،"], [1597.0, "فإنّ ذلك ـ إن شاء الله ـ ممّا يعصم الناس من نزول عذاب الله عز وجل بهم."]], "tr": [[1560.0, "Aynı şekilde Allah Azze ve Celle'nin şu sözünde de:"], [1566.0, "<span class=\"ayah\">﴿Halkı ıslah edici kimseler iken Rabbin memleketleri zulümle helak edecek değildir﴾<\/span> [Hûd 117]."], [1573.0, "Beldede ıslah edicilerin bulunması —Allah Azze ve Celle'nin izniyle— halkına azap inmesine karşı bir emniyet supabıdır."], [1583.0, "Sâlihlerin istiğfarı da böyledir; Allah Azze ve Celle'nin buyurduğu gibi:"], [1587.0, "<span class=\"ayah\">﴿Sen onların içindeyken Allah onlara azap edecek değildir. Onlar istiğfar ederlerken de Allah onlara azap edici değildir﴾<\/span> [Enfâl 33]."], [1595.5, "Sâlihlerden, âlimlerden ve belde halkından istiğfar çoğalınca, bu —inşallah— insanları Allah Azze ve Celle'nin azabının inmesinden koruyan şeylerdendir."]]}, {"reader": false, "ar": [[1603.0, "قال الإمامُ ابنُ رجبٍ رحمه الله تعالى:"], [1606.5, "«وقد يحفظ اللهُ العبدَ بصلاحه بعد موته في ذرّيّته»،"], [1611.0, "واستدلّ على ذلك بقول الله عز وجل:"], [1615.9, "<span class=\"ayah\">﴿وَكَانَ أَبُوهُمَا صَالِحًا﴾<\/span> <span class=\"ref\">[الكهف: ٨٢]<\/span>، ثم قال:"], [1619.2, "«إنهما حُفِظا بصلاح أبيهما»."], [1621.8, "انتهى كلامه. وقال الإمامُ ابنُ المنكدر رحمه الله تعالى:"], [1627.7, "«إنّ الله ليحفظ بالرجل الصالح ولدَه وولدَ ولدِه والدُّوَيراتِ التي حوله، فما يزالون في حفظٍ من الله وستر»."], [1643.0, "انتهى كلامه رحمه الله."]], "tr": [[1603.0, "İmam İbn Receb —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1606.5, "\"Allah, kulu öldükten sonra salâhı sebebiyle zürriyetinde korur.\" Buna Allah Azze ve Celle'nin <span class=\"ayah\">﴿Babaları da sâlih bir kimseydi﴾<\/span> [Kehf 82] sözüyle istidlal etmiş, sonra \"Onlar babalarının salâhıyla korundular\" demiştir."], [1619.2, "Sözü burada sona erdi. İmam (Muhammed) İbnü'l-Münkedir —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1627.7, "\"Allah, sâlih adam sebebiyle onun çocuğunu, çocuğunun çocuğunu ve etrafındaki evleri korur;"], [1635.4, "onlar Allah'ın koruması ve örtüsü içinde olmaya devam ederler.\" Sözü —Allah ona rahmet etsin— burada sona erdi."]]}, {"reader": false, "ar": [[1645.0, "ولمّا ضاع عِقدُ عائشة رضي الله تعالى عنها وأرضاها،"], [1649.0, "ونزل بسبب ذلك رخصةُ التيمّم،"], [1653.0, "قال أُسَيدُ بنُ حُضَير:"], [1655.0, "«ما هي بأوّل بركتكم يا آلَ أبي بكر»."], [1659.0, "والأدلّة على ذلك كثيرة،"], [1661.3, "ولله الحمد والمنّة. فالإنسان بصلاحه وولايته قد يحفظ الله عز وجل به بلدًا كاملًا،"], [1670.4, "وقبيلةً كاملة، وقد يحفظ به الأعراض،"], [1675.3, "وقد يحفظ به الأموال،"], [1676.7, "ما دام بين ظهرانَيهم."]], "tr": [[1645.0, "Âişe'nin —Allah Teâlâ ondan razı olsun ve onu razı etsin— gerdanlığı kaybolup bu sebeple teyemmüm ruhsatı inince Üseyd b."], [1655.0, "Hudayr şöyle dedi: \"Bu, sizin ilk bereketiniz değildir, ey Ebû Bekir ailesi!\" Bunun delilleri çoktur;"], [1663.0, "hamd ve minnet Allah'adır. İnsan, salâhı ve velâyeti sebebiyle, aralarında bulunduğu sürece, Allah Azze ve Celle onunla koca bir beldeyi, koca bir kabileyi koruyabilir;"], [1676.3, "onunla ırzları koruyabilir, onunla malları koruyabilir."]]}, {"reader": false, "ar": [[1678.0, "فإذا طلبنا البركةَ من وليٍّ وكانت بركةً دينيّةً محضة،"], [1684.0, "فإنّ ذلك جائزٌ لا بأس به."], [1688.0, "وبناءً على ذلك: فيجوز أن نتبرّك بطلب الدعاء من الأولياء والصالحين،"], [1695.0, "فإنّ دعاءهم منفعةٌ دينيّةٌ محضة."], [1698.0, "ويجوز أن نطلب منهم الاستغفارَ لنا،"], [1702.1, "فإنّ طلب الاستغفار منهم منفعةٌ دينيّةٌ محضة."], [1708.0, "ويجوز أن نتبرّك بالعلم الذي يُعلِّمونه،"], [1711.9, "وأن نشهد حِلَقَهم، وأن نستمع،"], [1715.2, "وأن نُقيِّد ما يقولونه،"], [1717.8, "فإنّ العلم منفعةٌ دينيّةٌ محضة."]], "tr": [[1678.0, "Bir veliden bereket talep ettiğimizde, bu saf dinî bir bereket ise, bu caizdir, sakıncası yoktur."], [1688.0, "Buna binaen: Velilerden ve sâlihlerden dua talep etmekle teberrük etmemiz caizdir;"], [1693.7, "çünkü onların duası saf dinî bir menfaattir."], [1698.0, "Onlardan bizim için istiğfar etmelerini talep etmemiz caizdir;"], [1702.1, "çünkü onlardan istiğfar talep etmek saf dinî bir menfaattir."], [1708.0, "Öğrettikleri ilimle teberrük etmemiz, halkalarına katılmamız, dinlememiz ve söylediklerini kaydetmemiz caizdir;"], [1715.8, "çünkü ilim saf dinî bir menfaattir."]]}, {"reader": false, "ar": [[1721.0, "ويجوز لنا كذلك أن نطلب الاستشفاءَ برُقيتهم لصلاحهم وتقواهم عند الله عز وجل،"], [1729.0, "فإنّ طلب الاستشفاء منفعةٌ دينيّةٌ محضة."], [1732.0, "وكذلك أيضًا نكتسب من أخلاقهم،"], [1737.0, "ونتّبع سِيَرَهم، ونتمسّك بآدابهم،"], [1742.0, "وننتفع بصحبتهم، وأن نطلب البركةَ بمشورتهم إن كانوا معروفين بالحكمة الدينيّة والدنيويّة."], [1750.0, "وكلُّ ذلك ممّا يجوز أن يُتبرَّك بالصالحين به،"], [1755.0, "لأنه منفعةٌ دينيّةٌ محضة."]], "tr": [[1721.0, "Aynı şekilde, Allah Azze ve Celle katındaki salâhları ve takvâları sebebiyle onların rukyesiyle şifa talep etmemiz de caizdir;"], [1729.0, "çünkü şifa talep etmek saf dinî bir menfaattir."], [1732.0, "Yine onların ahlâkından kazanırız, siretlerine (hayat yollarına) uyarız, âdâblarına sarılırız, sohbetlerinden faydalanırız ve —dinî ve dünyevî hikmetle tanınıyorlarsa— onlarla istişare ederek bereket talep ederiz."], [1750.0, "Bütün bunlar, sâlihlerle kendisiyle teberrük edilmesi caiz olan şeylerdendir;"], [1754.4, "çünkü saf dinî bir menfaattir."]]}, {"reader": false, "ar": [[1760.0, "وهذا الذي يدعو له أهلُ السنّة والجماعة،"], [1763.0, "وهو الذي يسير على جادّة أهل السنّة والجماعة،"], [1771.0, "وهو الذي دلّت عليه الأدلّة."], [1773.0, "ولكن يأبى أهلُ البدع إلا أن يتركوا ما هو مشروعٌ إلى ما ليس بمشروع."], [1781.0, "بل إنّ عروةَ البارقيَّ رضي الله تعالى عنه لمّا أعطاه النبيّ صلى الله عليه وسلم دينارًا ليشتري به شاةً،"], [1790.0, "اشترى به شاتين، وباع إحداهما بدينار،"], [1793.0, "فجاءه بشاةٍ ودينار، فدعا له النبيّ صلى الله عليه وسلم بالبركة؛"], [1798.0, "فكان لو اشترى ترابًا لربح فيه."]], "tr": [[1760.0, "Ehl-i Sünnet ve'l-Cemaat'in çağırdığı budur;"], [1762.1, "Ehl-i Sünnet ve'l-Cemaat'in ana yolu üzere giden budur;"], [1769.2, "delillerin delâlet ettiği de budur."], [1773.0, "Fakat bid'at ehli meşru olanı bırakıp meşru olmayana yönelmekten başkasına razı olmazlar."], [1781.0, "Hatta Urve el-Bârikî —Allah Teâlâ ondan razı olsun—, Peygamber sallallâhu aleyhi ve sellem ona bir koyun alması için bir dinar verdiğinde, onunla iki koyun aldı, birini bir dinara sattı ve ona bir koyun ve bir dinarla geldi."], [1794.3, "Peygamber sallallâhu aleyhi ve sellem de ona bereketle dua etti."], [1798.0, "Artık toprak satın alsa bile ondan kâr ederdi."]]}, {"reader": false, "ar": [[1799.8, "فكان كثيرٌ من أصحاب النبيّ صلى الله عليه وسلم يحرصون على دخول التجارات معه،"], [1804.2, "طلبًا لبركة هذه الدعوات. والله أعلم."]], "tr": [[1799.8, "Peygamber sallallâhu aleyhi ve sellem'in ashâbından birçoğu, bu duaların bereketini talep ederek onunla ticarete girmeye hırslı idiler. Allah en iyisini bilir."]]}]}, {"ts": "30:07", "title": "4. Külliye: Şeriata yapılan her muhalefet bereketin silinmesine sebeptir", "paras": [{"reader": false, "ar": [[1807.0, "ومن الكلّيّات أيضًا: <b>كلُّ مخالفةٍ للشرع فسببٌ لمحق البركة.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[1807.0, "Külliyelerden biri de şudur: 4."], [1809.1, "külliye: Şeriata yapılan her muhalefet, bereketin silinmesine sebeptir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1830.9, "أقول وبالله التوفيق: ولذلك قد يلاحظ الإنسانُ أنّ الله عز وجل يمنع عنه البركةَ في أمرٍ من أمور الدين أو أمرٍ من أمور الدنيا،"], [1847.0, "فلا يُفتَح له فيه،"], [1849.6, "إمّا من مالٍ أو ولدٍ أو دراسةٍ أو حفظِ علمٍ أو استقرارِ معلومةٍ في قلبه."], [1860.0, "فلا يجد البركةَ لا في بيته،"], [1862.4, "ولا مع زوجته وأولاده،"], [1864.0, "ولا يجد البركة في علمه،"], [1866.0, "ولا يجد البركة في ماله."], [1868.0, "فيسأل حينئذٍ: ما الأسباب التي نزعت عنّي هذه البركة؟"]], "tr": [[1830.9, "Tevfik Allah'tandır, derim ki: Bu yüzden insan, Allah Azze ve Celle'nin din işlerinden veya dünya işlerinden bir işte bereketi kendisinden alıkoyduğunu fark edebilir;"], [1847.7, "mal, çocuk, okul, ilim ezberleme veya bir bilginin kalbine yerleşmesi gibi bir konuda ona (kapı) açılmaz."], [1860.0, "Ne evinde, ne eşi ve çocuklarıyla bereket bulur;"], [1863.6, "ne ilminde bereket bulur, ne de malında bereket bulur."], [1868.0, "O zaman sorar: Bu bereketi benden söküp alan sebepler nelerdir?"]]}, {"reader": false, "ar": [[1874.0, "فينبغي للعاقل الأريب الذي يريد أن يستدِرّ بركةَ الله عز وجل في نفسه وشؤون دينه ودنياه أن يحرص على أن يجتنب الأسباب التي تمحق البركة."], [1890.0, "وقد دلّت أدلّةٌ كثيرةٌ من الكتاب والسنّة على أنّ هناك جُمَلًا تمحق البركة،"], [1896.0, "يجمعها هذه الكلّيّة، وهي أنها مخالفاتٌ للشرع."], [1900.0, "فمتى ما خالف الإنسانُ شيئًا من الشرع مُحِقت منه البركةُ في حياته،"], [1907.6, "وفهمه، وعقله، وماله، وصلاح ذرّيّته،"], [1913.5, "وبرّ أولاده، بقدر ما جناه من الذنوب والمعاصي."]], "tr": [[1874.0, "Kendisinde, din ve dünya işlerinde Allah Azze ve Celle'nin bereketini celbetmek isteyen akıllı ve zeki kimsenin, bereketi silen sebeplerden kaçınmaya özen göstermesi gerekir."], [1890.0, "Kitap ve Sünnet'ten birçok delil, bereketi silen birtakım şeylerin bulunduğuna delâlet etmiştir;"], [1896.0, "bunları bu külliye bir araya getirir:"], [1900.0, "Onlar şeriata muhalefetlerdir. İnsan şeriattan herhangi bir şeye muhalefet ettiğinde, işlediği günahlar ve masiyetler ölçüsünde hayatından, anlayışından, aklından, malından, zürriyetinin salâhından ve çocuklarının iyiliğinden bereket silinir."]]}, {"reader": false, "ar": [[1921.0, "ولذلك أعظمُ الأسباب التي تمحق البركة كثرةُ الذنوب والمعاصي؛"], [1925.0, "هذا من أعظم ما يجعل العبدَ غيرَ مبارك."], [1930.8, "فللمعصية كبيرُ الأثر في محق بركة المال والعمر والعلم والعمل،"], [1936.0, "وهي من أعظم الأسباب التي تجعل العبدَ هيّنًا على الله عز وجل،"], [1942.0, "وأن يسقط من عين الله عز وجل."]], "tr": [[1921.0, "Bu yüzden bereketi silen sebeplerin en büyüğü günahların ve masiyetlerin çokluğudur;"], [1925.7, "bu, kulu bereketsiz kılan şeylerin en büyüklerindendir."], [1930.8, "Masiyetin malın, ömrün, ilmin ve amelin bereketini silmede büyük etkisi vardır."], [1935.5, "O, kulu Allah Azze ve Celle katında değersiz kılan ve Allah Azze ve Celle'nin gözünden düşmesine yol açan sebeplerin en büyüklerindendir."]]}, {"reader": false, "ar": [[1944.0, "قال الإمامُ ابنُ القيّم رحمه الله تعالى في كتابه «الجواب الكافي لمن سأل عن الدواء الشافي» عن المعاصي،"], [1951.0, "قال: «ومن عقوباتها: أنها تمحق بركةَ العمر، وبركةَ الرزق، وبركةَ العلم، وبركةَ العمل، وبركةَ الطاعة. وبالجملة تمحق بركةَ الدين والدنيا، فلا تجد أقلَّ بركةً في عمره ودينه ودنياه ممّن عصى الله عز وجل. وما مُحِقت البركةُ من الأرض إلا بمعاصي الخلق»."]], "tr": [[1944.0, "İmam İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— \"el-Cevâbü'l-kâfî li-men seele ani'd-devâi'ş-şâfî\" adlı kitabında masiyetler hakkında şöyle demiştir:"], [1947.5, "\"Onların cezalarından biri de ömrün bereketini, rızkın bereketini, ilmin bereketini, amelin bereketini ve taatin bereketini silmeleridir."], [1951.4, "Kısacası dinin ve dünyanın bereketini silerler."], [1957.0, "Ömründe, dininde ve dünyasında Allah Azze ve Celle'ye isyan edenden daha az bereketli birini bulamazsın."], [1975.4, "Yeryüzünden bereket ancak halkın masiyetleri sebebiyle silinmiştir.\""]]}, {"reader": false, "ar": [[1989.0, "قال الله عز وجل:"], [1991.0, "<span class=\"ayah\">﴿وَلَوْ أَنَّ أَهْلَ الْقُرَىٰ آمَنُوا وَاتَّقَوْا لَفَتَحْنَا عَلَيْهِم بَرَكَاتٍ مِّنَ السَّمَاءِ وَالْأَرْضِ وَلَٰكِن كَذَّبُوا فَأَخَذْنَاهُم بِمَا كَانُوا يَكْسِبُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ٩٦]<\/span>."], [2004.0, "وقال الله عز وجل:"], [2005.7, "<span class=\"ayah\">﴿وَأَلَّوِ اسْتَقَامُوا عَلَى الطَّرِيقَةِ لَأَسْقَيْنَاهُم مَّاءً غَدَقًا﴾<\/span> <span class=\"ref\">[الجن: ١٦]<\/span>."]], "tr": [[1989.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1991.0, "<span class=\"ayah\">﴿Eğer o memleketlerin halkı iman edip takvâ sahibi olsalardı, elbette üzerlerine gökten ve yerden bereketler açardık. Fakat yalanladılar; biz de onları kazandıkları yüzünden yakalayıverdik﴾<\/span> [A'râf 96]."], [2004.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [2005.7, "<span class=\"ayah\">﴿Eğer o yolda dosdoğru gitselerdi, onlara bol su içirirdik﴾<\/span> [Cin 16]."]]}, {"reader": false, "ar": [[2012.0, "وقال الله عز وجل في ذهاب بركة العلم:"], [2016.0, "<span class=\"ayah\">﴿وَاتْلُ عَلَيْهِمْ نَبَأَ الَّذِي آتَيْنَاهُ آيَاتِنَا فَانسَلَخَ مِنْهَا﴾<\/span> ـ أي خالف مقتضاها ـ <span class=\"ayah\">﴿فَأَتْبَعَهُ الشَّيْطَانُ فَكَانَ مِنَ الْغَاوِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٧٥]<\/span>،"], [2029.0, "<span class=\"ayah\">﴿وَلَوْ شِئْنَا لَرَفَعْنَاهُ بِهَا وَلَٰكِنَّهُ أَخْلَدَ إِلَى الْأَرْضِ وَاتَّبَعَ هَوَاهُ﴾<\/span> <span class=\"ref\">[الأعراف: ١٧٦]<\/span> الآيةَ بتمامها."], [2036.0, "ولذلك يقول النبيّ صلى الله عليه وسلم:"], [2039.0, "«وإنّ العبدَ ليُحرَمُ الرزقَ بالذنب يُصيبه»،"], [2042.5, "أخرجه الإمام أحمد بإسنادٍ حسن."]], "tr": [[2012.0, "Allah Azze ve Celle ilmin bereketinin gitmesi hakkında şöyle buyurmuştur:"], [2016.0, "<span class=\"ayah\">﴿Onlara, kendisine âyetlerimizi verdiğimiz hâlde onlardan sıyrılıp çıkan kimsenin haberini oku﴾<\/span> —yani onların gereğine muhalefet etti— <span class=\"ayah\">﴿Şeytan da onu peşine taktı ve azgınlardan oldu﴾<\/span> [A'râf 175]."], [2029.0, "<span class=\"ayah\">﴿Dileseydik onu o âyetlerle yükseltirdik; fakat o yere saplanıp kaldı ve hevesine uydu﴾<\/span> [A'râf 176], ayetin tamamı."], [2036.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [2039.0, "\"Kul, işlediği günah sebebiyle rızıktan mahrum bırakılır.\" Bunu İmam Ahmed hasen bir isnadla rivayet etmiştir."]]}, {"reader": false, "ar": [[2045.0, "وممّا يمحق البركةَ أيضًا:"], [2051.0, "الغشُّ والخداع والكذب، لا سيّما في البيع والشراء،"], [2059.0, "حتى لو كان الحالفُ صادقًا."], [2062.0, "فقد نهى النبيّ صلى الله عليه وسلم عن كثرة الحلف وعن الغشّ في البيع،"], [2069.0, "فقال صلى الله عليه وسلم:"], [2072.0, "«الحَلِفُ مَنفَقةٌ للسلعة، ممحقةٌ للبركة»، أخرجه البخاريّ."]], "tr": [[2045.0, "Bereketi silen şeylerden biri de, özellikle alışverişte hile, aldatma ve yalandır;"], [2053.9, "yemin eden doğru söylese bile (çok yemin etmek bereketi siler)."], [2062.0, "Peygamber sallallâhu aleyhi ve sellem çok yemin etmeyi ve satışta hile yapmayı yasaklamış ve şöyle buyurmuştur:"], [2070.2, "\"Yemin malı sürdürür, bereketi siler.\" Bunu Buhârî rivayet etmiştir."]]}, {"reader": false, "ar": [[2081.0, "وفي حديث حكيم بن حزامٍ في «الصحيحين» قال:"], [2083.4, "قال النبيّ صلى الله عليه وسلم:"], [2086.0, "«البيِّعان بالخيار ما لم يتفرّقا» ـ أو قال:"], [2091.0, "«حتى يتفرّقا» ـ «فإن صدقا وبيّنا» ـ صدقا وبيّنا:"], [2096.2, "ما في غشٍّ ولا مخادعةٍ ولا تدليسٍ ولا كذب ـ «فإن صدقا وبيّنا بُورِك لهما في بيعهما، وإن كذبا وكتما مُحِقت بركةُ بيعهما»."]], "tr": [[2081.0, "\"Sahîhayn\"da Hakîm b. Hizâm hadisinde (Hakîm) dedi ki:"], [2083.4, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2086.0, "\"Alıcı ile satıcı, ayrılmadıkları sürece muhayyerdirler\" —veya \"ayrılıncaya kadar\" buyurdu— \"Eğer doğru söyler ve (kusuru) açıklarlarsa\" —doğru söyler ve açıklarlarsa:"], [2096.2, "yani hile, aldatma, kusur gizleme ve yalan olmazsa— \"eğer doğru söyler ve açıklarlarsa alışverişleri kendileri için bereketli kılınır;"], [2105.4, "yalan söyler ve gizlerlerse alışverişlerinin bereketi silinir.\""]]}]}, {"ts": "35:12", "title": "4. Külliye (devam): Ribâ, beddua ve dünya hırsı", "paras": [{"reader": false, "ar": [[2112.0, "ومن ذلك أيضًا: التعاملُ بالربا،"], [2117.0, "والإنسانُ يحسب أنه يزداد به مالُه،"], [2123.0, "وفي الحقيقة أنها زيادةٌ ظاهريّة،"], [2125.7, "لكنها من أعظم ما يُمحَق به بركةُ المال."], [2130.0, "كما قال الله عز وجل:"], [2133.5, "<span class=\"ayah\">﴿يَمْحَقُ اللَّهُ الرِّبَا وَيُرْبِي الصَّدَقَاتِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٧٦]<\/span>،"], [2138.0, "وكما قال الله عز وجل:"], [2139.9, "<span class=\"ayah\">﴿وَمَا آتَيْتُم مِّن رِّبًا لِّيَرْبُوَ فِي أَمْوَالِ النَّاسِ فَلَا يَرْبُو عِندَ اللَّهِ﴾<\/span> <span class=\"ref\">[الروم: ٣٩]<\/span>."], [2145.0, "فلا يزداد الإنسانُ بزيادة الربا ظاهرًا إلا عظيمَ مَحْقٍ باطنًا."]], "tr": [[2112.0, "Bunlardan biri de ribâ ile muamele etmektir."], [2114.4, "İnsan onunla malının arttığını sanır;"], [2118.5, "hakikatte ise bu zâhirî bir artıştır, fakat malın bereketinin silindiği şeylerin en büyüklerindendir."], [2126.8, "Allah Azze ve Celle'nin buyurduğu gibi:"], [2130.0, "<span class=\"ayah\">﴿Allah ribâyı tüketir, sadakaları ise artırır﴾<\/span> [Bakara 276]."], [2135.6, "Ve Allah Azze ve Celle'nin buyurduğu gibi:"], [2139.9, "<span class=\"ayah\">﴿İnsanların mallarında artsın diye verdiğiniz faiz Allah katında artmaz﴾<\/span> [Rûm 39]."], [2145.0, "İnsan ribânın zâhiren artmasıyla, bâtınen büyük bir silinmeden başka bir şey kazanmaz."]]}, {"reader": false, "ar": [[2153.0, "ومنها أيضًا ـ والعياذ بالله ـ:"], [2155.8, "الدعاءُ على النفس وعلى المال وعلى الولد؛"], [2162.0, "فإنّ ذلك ممّا يُذهِب بركةَ النفس وبركةَ المال وبركةَ الولد."], [2168.0, "كما قال النبيّ صلى الله عليه وسلم:"], [2171.3, "«لا تدعوا على أنفسكم، ولا تدعوا على أولادكم، ولا تدعوا على أموالكم، لا تُوافِقوا ساعةً يُسأل فيها عطاءٌ فيُستجابَ لكم»؛"], [2183.0, "أي استجابةً ربوبيّةً لا استجابةً ألوهيّة."]], "tr": [[2153.0, "Bunlardan biri de —Allah'a sığınırız— insanın kendisine, malına ve çocuğuna beddua etmesidir."], [2162.0, "Çünkü bu, nefsin bereketini, malın bereketini ve çocuğun bereketini götüren şeylerdendir."], [2168.0, "Peygamber sallallâhu aleyhi ve sellem'in buyurduğu gibi:"], [2171.3, "\"Kendinize beddua etmeyin, çocuklarınıza beddua etmeyin, mallarınıza beddua etmeyin;"], [2176.1, "(Allah'tan) bir şey istenip de duanızın kabul edildiği bir saate denk gelmeyesiniz.\" Yani (bu) ulûhiyyete dair bir kabul değil, rubûbiyyete dair bir kabuldür."]]}, {"reader": false, "ar": [[2185.0, "ومنها أيضًا: الحرصُ والطمعُ في طلب الدنيا،"], [2191.0, "فيكون الإنسانُ منكبًّا بكلّيّته وجمعيّته على طلب هذه الدنيا وشهواتها وملذّاتها،"], [2198.0, "فلا يجد لذّةَ الإيمان،"], [2200.4, "ولا لذّةَ المناجاة، ولا لذّةَ الطاعة،"], [2204.0, "ولا يستريح في صلاة،"], [2206.2, "ولا يجد خشوعًا في عبادة."]], "tr": [[2185.0, "Bunlardan biri de dünyayı talep etmedeki hırs ve tamahtır."], [2191.0, "İnsan bütün varlığıyla ve bütün benliğiyle bu dünyayı, onun şehvetlerini ve lezzetlerini talep etmeye kapanır;"], [2199.8, "artık ne imanın lezzetini, ne münâcâtın lezzetini, ne de taatin lezzetini bulur;"], [2205.7, "namazda huzur bulmaz, ibadette huşû bulmaz."]]}, {"reader": false, "ar": [[2209.0, "ولذلك يقول النبيّ صلى الله عليه وسلم في حديث حكيم بن حزام،"], [2217.0, "لمّا جاءه وسأله فأعطاه،"], [2220.0, "ثم سأله الثانية فأعطاه،"], [2223.0, "ثم قال: «يا حكيم، إنّ هذا المال خَضِرٌ حُلْو، فمن أخذه بسخاوة نفسٍ» ـ بسخاوة نفسٍ:"], [2235.2, "أي من غير سؤالٍ ولا تطلُّعٍ ولا شغف ـ «بُورِك له فيه، ومن أخذه بإشراف نفسٍ لم يُبارَك له فيه، وكان كالذي يأكل ولا يشبع، واليدُ العليا خيرٌ من اليد السفلى» الحديثَ بتمامه."]], "tr": [[2209.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem, Hakîm b."], [2213.7, "Hizâm hadisinde —Hakîm ona gelip istediğinde ona verdi, sonra ikinci kez istedi, yine ona verdi— sonra şöyle buyurdu:"], [2224.4, "\"Ey Hakîm! Bu mal yeşil ve tatlıdır."], [2228.7, "Kim onu gönül cömertliğiyle alırsa\" —gönül cömertliğiyle:"], [2235.2, "yani istemeden, göz dikmeden ve tutkuyla bağlanmadan— \"onda kendisine bereket verilir."], [2240.9, "Kim de onu nefsin göz dikmesiyle alırsa onda kendisine bereket verilmez ve yiyip de doymayan kimse gibi olur."], [2255.5, "Üstteki el alttaki elden hayırlıdır.\" Hadisin tamamı (bilinir)."]]}]}, {"ts": "37:39", "title": "5. Külliye: Bütün taatler bereketlerin inmesine sebeptir", "paras": [{"reader": false, "ar": [[2259.0, "ولو تأمّلتَ هذه الأمور لوجدتَ أنه يجمعها لك المخالفاتُ الشرعيّة،"], [2268.0, "فأعظمُ ما يمحق بركةَ الدين والدنيا مخالفاتُ الشرع."], [2273.0, "ويوضّح ذلك الكلّيّةُ التي بعدها:"], [2276.0, "<b>كلُّ الطاعات سببٌ لحلول البركات<\/b>،"], [2281.0, "والتي من أعظمها تقوى الله عز وجل."]], "tr": [[2259.0, "Bu şeyleri düşünürsen, onları senin için şer'î muhalefetlerin bir araya getirdiğini görürsün;"], [2265.3, "dinin ve dünyanın bereketini en çok silen şey şeriata muhalefetlerdir."], [2273.0, "Bunu sonraki külliye açıklar: 5."], [2274.8, "külliye: Bütün taatler bereketlerin inmesine sebeptir. Bunların en büyüklerinden biri Allah Azze ve Celle'den takvâ ile korkmaktır."]]}, {"reader": false, "ar": [[2298.0, "فأعظمُ ما يحصّل به العبدُ بركةَ الله أن يكون متّقيًا لله عز وجل في كلّ مصادره وموارده،"], [2306.0, "وفي أمر دينه ودنياه،"], [2308.0, "كما قال الله عز وجل:"], [2310.0, "<span class=\"ayah\">﴿وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا ۝ وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ۚ وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ﴾<\/span> <span class=\"ref\">[الطلاق: ٢–٣]<\/span>."], [2318.0, "فليس هناك أعظمُ بركةً من أن يأتيَ للإنسان رزقُه من حيث لا يحتسب ولا يتوقّع،"], [2325.0, "إلا عن طريق التقوى."], [2327.0, "أسأل الله أن يجعلني وإيّاكم منهم."]], "tr": [[2298.0, "Kulun Allah'ın bereketini elde ettiği en büyük şey, bütün giriş ve çıkışlarında, din ve dünya işinde Allah Azze ve Celle'den korkan (müttakî) biri olmasıdır."], [2307.5, "Allah Azze ve Celle'nin buyurduğu gibi:"], [2310.0, "<span class=\"ayah\">﴿Kim Allah'tan korkarsa, Allah ona bir çıkış yolu açar ve onu hiç ummadığı yerden rızıklandırır. Kim Allah'a tevekkül ederse O, ona yeter﴾<\/span> [Talâk 2–3]."], [2318.0, "İnsana rızkının hesaba katmadığı ve beklemediği yerden gelmesinden daha büyük bir bereket yoktur;"], [2324.1, "bu da ancak takvâ yoluyla olur."], [2327.0, "Allah'tan beni ve sizi onlardan kılmasını dilerim."]]}, {"reader": false, "ar": [[2329.0, "ولذلك يقول الله عز وجل:"], [2333.0, "<span class=\"ayah\">﴿وَلَوْ أَنَّ أَهْلَ الْقُرَىٰ آمَنُوا وَاتَّقَوْا لَفَتَحْنَا عَلَيْهِم بَرَكَاتٍ مِّنَ السَّمَاءِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[الأعراف: ٩٦]<\/span>."], [2342.0, "وقال الله عز وجل ـ عفوًا ـ ومنها أيضًا:"], [2345.5, "كثرةُ الاستغفار؛ فيكثُر لَهَجُ المسلم بالاستغفار في ليله ونهاره بالآلاف،"], [2354.0, "ثم ينظر بعد ذلك البركاتِ التي تنزل عليه في عمره،"], [2360.6, "وعمله، وعبادته، وعلمه، وأهل بيته، ووقته."]], "tr": [[2329.0, "Bu yüzden Allah Azze ve Celle şöyle buyurur:"], [2333.0, "<span class=\"ayah\">﴿Eğer o memleketlerin halkı iman edip takvâ sahibi olsalardı, elbette üzerlerine gökten ve yerden bereketler açardık﴾<\/span> [A'râf 96]."], [2345.5, "Allah Azze ve Celle buyurdu ki —affedersiniz— bunlardan biri de çok istiğfardır:"], [2351.3, "Müslümanın dili gecesinde ve gündüzünde binlerce kez istiğfara düşkün olur;"], [2358.0, "sonra ömründe, amelinde, ibadetinde, ilminde, ev halkında ve vaktinde kendisine inen bereketlere bakar."]]}, {"reader": false, "ar": [[2371.0, "كما قال الله عز وجل:"], [2373.5, "<span class=\"ayah\">﴿فَقُلْتُ اسْتَغْفِرُوا رَبَّكُمْ إِنَّهُ كَانَ غَفَّارًا ۝ يُرْسِلِ السَّمَاءَ عَلَيْكُم مِّدْرَارًا ۝ وَيُمْدِدْكُم بِأَمْوَالٍ وَبَنِينَ وَيَجْعَل لَّكُمْ جَنَّاتٍ وَيَجْعَل لَّكُمْ أَنْهَارًا﴾<\/span> <span class=\"ref\">[نوح: ١٠–١٢]<\/span>."], [2387.0, "كلُّ ذلك من بركات الاستغفار."], [2390.0, "وقال الله عز وجل:"], [2392.6, "<span class=\"ayah\">﴿وَأَنِ اسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ يُمَتِّعْكُم مَّتَاعًا حَسَنًا إِلَىٰ أَجَلٍ مُّسَمًّى وَيُؤْتِ كُلَّ ذِي فَضْلٍ فَضْلَهُ﴾<\/span> <span class=\"ref\">[هود: ٣]<\/span>."]], "tr": [[2371.0, "Allah Azze ve Celle'nin buyurduğu gibi:"], [2373.5, "<span class=\"ayah\">﴿Dedim ki: Rabbinizden bağışlanma dileyin; çünkü O çok bağışlayıcıdır. (Bağışlanma dileyin ki) üzerinize gökten bol bol yağmur indirsin, sizi mallarla ve oğullarla desteklesin, size bahçeler versin, size ırmaklar akıtsın﴾<\/span> [Nûh 10–12]."], [2387.0, "Bütün bunlar istiğfarın bereketlerindendir. Allah Azze ve Celle şöyle buyurmuştur:"], [2392.6, "<span class=\"ayah\">﴿Rabbinizden bağışlanma dileyin, sonra O'na tövbe edin ki sizi belirli bir vakte kadar güzel bir şekilde yaşatsın ve her fazilet sahibine faziletinin karşılığını versin﴾<\/span> [Hûd 3]."]]}]}, {"ts": "40:04", "title": "5. Külliye (devam): Sıla-i rahim, cömertlik, birlikte yemek ve evlerde ibadet", "paras": [{"reader": false, "ar": [[2404.0, "ومنها أيضًا: البرُّ والصلةُ وحسنُ المعاملة مع الخلق ـ البرّ والصلة وحسن المعاملة مع الخلق ـ ففي الحديث عن أنسٍ رضي الله عنه قال:"], [2418.4, "قال النبيّ صلى الله عليه وسلم:"], [2423.0, "«من أحبّ أن يُبسَط له في رزقه، ويُنسَأ له في أثره، فليصِلْ رحمَه»."], [2430.0, "وعن عائشة رضي الله عنها قالت:"], [2433.9, "«إنّ حسنَ الخلق، وحسنَ الجوار، وصلةَ الرحم، تَعمُر الديار، وتزيد في الأعمار»."]], "tr": [[2404.0, "Bunlardan biri de iyilik, sıla-i rahim ve halkla güzel muameledir —iyilik, sıla-i rahim ve halkla güzel muamele—."], [2413.0, "Hadiste Enes'ten —Allah ondan razı olsun— rivayet edildiğine göre Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2423.0, "\"Kim rızkının genişletilmesini ve ecelinin geciktirilmesini (ömrünün uzatılmasını) severse akrabasını gözetsin.\" Âişe'den —Allah ondan razı olsun— şöyle dediği rivayet edilir:"], [2433.9, "\"Güzel ahlâk, güzel komşuluk ve sıla-i rahim yurtları mamur eder ve ömürleri artırır.\""]]}, {"reader": false, "ar": [[2445.0, "ومنها كذلك: الجودُ والكرم ـ الجود والكرم ـ كما قال الله عز وجل:"], [2455.2, "<span class=\"ayah\">﴿وَمَا أَنفَقْتُم مِّن شَيْءٍ فَهُوَ يُخْلِفُهُ ۖ وَهُوَ خَيْرُ الرَّازِقِينَ﴾<\/span> <span class=\"ref\">[سبأ: ٣٩]<\/span>."], [2461.0, "وقال الله عز وجل في بيان بركات الكرم والإنفاق في سبيله:"], [2467.0, "<span class=\"ayah\">﴿مَّثَلُ الَّذِينَ يُنفِقُونَ أَمْوَالَهُمْ فِي سَبِيلِ اللَّهِ﴾<\/span> ـ شوفوا البركة ـ <span class=\"ayah\">﴿كَمَثَلِ حَبَّةٍ أَنبَتَتْ سَبْعَ سَنَابِلَ فِي كُلِّ سُنبُلَةٍ مِّائَةُ حَبَّةٍ﴾<\/span> <span class=\"ref\">[البقرة: ٢٦١]<\/span> الآيةَ بتمامها."]], "tr": [[2445.0, "Bunlardan biri de cömertlik ve keremdir —cömertlik ve kerem—."], [2452.0, "Allah Azze ve Celle'nin buyurduğu gibi:"], [2455.2, "<span class=\"ayah\">﴿Her ne harcarsanız O, onun yerine başkasını verir. O, rızık verenlerin en hayırlısıdır﴾<\/span> [Sebe' 39]."], [2461.0, "Allah Azze ve Celle, keremin ve kendi yolunda infakın bereketlerini açıklarken şöyle buyurmuştur:"], [2467.0, "<span class=\"ayah\">﴿Mallarını Allah yolunda harcayanların durumu﴾<\/span> —bereketi görün— <span class=\"ayah\">﴿yedi başak bitiren, her başakta yüz tane bulunan bir tanenin durumu gibidir﴾<\/span> [Bakara 261], ayetin tamamı."]]}, {"reader": false, "ar": [[2481.0, "وعن عمر بن الخطّاب رضي الله تعالى عنه قال:"], [2486.3, "قال النبيّ صلى الله عليه وسلم:"], [2488.0, "«كلوا جميعًا ولا تفرّقوا» ـ هذا من باب التكافل؛"], [2491.0, "فإنّ طعام الواحد يكفي الاثنين،"], [2493.5, "وطعام الاثنين يكفي الثلاثة والأربعة ـ «كلوا جميعًا ولا تفرّقوا، فإنّ البركة في الجماعة»."], [2500.0, "وقال صلى الله عليه وسلم:"], [2502.7, "«فاجتمِعوا على طعامكم، واذكروا اسمَ الله عليه، يُبارَكْ لكم فيه»."]], "tr": [[2481.0, "Ömer b. el-Hattâb'dan —Allah Teâlâ ondan razı olsun— rivayet edildiğine göre Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2488.0, "\"Hep birlikte yiyin, dağılmayın.\" —Bu, dayanışma kabilindendir;"], [2491.0, "çünkü bir kişinin yemeği iki kişiye, iki kişinin yemeği üç ve dört kişiye yeter.— \"Hep birlikte yiyin, dağılmayın;"], [2498.0, "çünkü bereket topluluktadır.\" Ve sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2502.7, "\"Yemeğinizin başında toplanın ve üzerine Allah'ın adını anın ki onda size bereket verilsin.\""]]}, {"reader": false, "ar": [[2508.0, "ومنها ما ذكرتُه لكم سابقًا،"], [2511.4, "لكن على نقيضه، وهي الصدقُ في البيع والشراء ـ الصدق في البيع والشراء ـ كما قال عليه الصلاة والسلام:"], [2524.3, "«فإن صدقا وبيّنا بُورِك لهما في بيعهما، وإن كذبا وكتما مُحِقت بركةُ بيعهما»."]], "tr": [[2508.0, "Bunlardan biri de size daha önce zikrettiğim şeyin zıddıdır:"], [2515.4, "Alışverişte doğruluk —alışverişte doğruluk—. Aleyhissalâtu vesselâm'ın buyurduğu gibi:"], [2524.3, "\"Eğer doğru söyler ve açıklarlarsa alışverişleri kendileri için bereketli kılınır;"], [2529.0, "yalan söyler ve gizlerlerse alışverişlerinin bereketi silinir.\""]]}, {"reader": false, "ar": [[2533.0, "ومنها كذلك: تكثيرُ الطاعات في البيوت يا أحبّتي؛"], [2539.0, "تكثيرُ الطاعة في البيوت من التسبيح،"], [2542.6, "والتهليل، والتكبير، والصلاة، وقيام الليل،"], [2545.6, "وصلاة الضحى، وقراءة القرآن."], [2548.0, "كلُّ ذلك ممّا يُنزِل الله عز وجل به البركةَ في هذا البيت،"], [2551.2, "ويحفظه من الشياطين. فإنّ النبيّ صلى الله عليه وسلم قال ـ كما في «صحيح الإمام مسلم» من حديث جابرٍ رضي الله عنه ـ:"], [2559.0, "«إذا قضى أحدُكم الصلاةَ في مسجده فليجعل في بيته نصيبًا من صلاته، فإنّ الله جاعلٌ في بيته من صلاته خيرًا»."]], "tr": [[2533.0, "Bunlardan biri de evlerde taatleri çoğaltmaktır, ey sevdiklerim:"], [2539.0, "Evlerde tesbih, tehlîl, tekbir, namaz, gece namazı, kuşluk namazı ve Kur'an okuma gibi taatleri çoğaltmak."], [2548.0, "Bütün bunlar, Allah Azze ve Celle'nin onunla o eve bereket indirdiği ve onu şeytanlardan koruduğu şeylerdendir."], [2552.0, "Zira Peygamber sallallâhu aleyhi ve sellem —İmam Müslim'in \"Sahîh\"inde Câbir'in —Allah ondan razı olsun— hadisinde olduğu gibi— şöyle buyurmuştur:"], [2559.0, "\"Biriniz namazını mescidinde kıldığında, namazından evine de bir pay ayırsın;"], [2563.0, "çünkü Allah onun namazından dolayı evinde bir hayır kılar.\""]]}, {"reader": false, "ar": [[2567.0, "وفي «الصحيحين» من حديث ابن عمر رضي الله تعالى عنهما قال:"], [2572.2, "قال النبيّ صلى الله عليه وسلم:"], [2575.0, "«اجعلوا من صلاتكم في بيوتكم، ولا تتّخذوها قبورًا»."], [2581.0, "وقال النبيّ صلى الله عليه وسلم:"], [2585.1, "«أفضلُ صلاة المرء في بيته إلا المكتوبة»."], [2590.0, "فاستكثِروا من الطاعات في بيوتكم،"], [2592.5, "وربُّوا أهليكم على كثرة الطاعات، فإنّ البركة تحِلّ."]], "tr": [[2567.0, "\"Sahîhayn\"da İbn Ömer'in —Allah Teâlâ ikisinden de razı olsun— hadisinde (İbn Ömer) dedi ki:"], [2572.2, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2575.0, "\"Namazlarınızdan bir kısmını evlerinizde kılın;"], [2577.9, "evlerinizi kabirlere çevirmeyin.\" Peygamber sallallâhu aleyhi ve sellem şöyle de buyurdu:"], [2585.1, "\"Kişinin en faziletli namazı, farz namaz dışında, evinde kıldığı namazdır.\" Evlerinizde taatleri çoğaltın ve ailenizi çok taat üzere yetiştirin;"], [2594.0, "çünkü (o zaman) bereket iner."]]}, {"reader": false, "ar": [[2596.8, "ولذلك نجد عقوقًا كثيرًا في بيوتنا من أولادنا وزوجاتنا،"], [2602.0, "وتجد أنّ الأوقات تضيع عليهم،"], [2604.4, "لم يحفظوا شيئًا، ولم يقرؤوا شيئًا،"], [2607.2, "ولم يزدادوا لا في علم دينٍ ولا دنيا،"], [2611.0, "وتجد الفشلَ الكثير في حياتهم،"], [2613.0, "وقلّةَ البركة، بسبب إيش؟"], [2613.9, "بسبب قلّة الذكر في البيوت،"], [2616.0, "وامتلاء البيوت من الشياطين التي تصرفهم عن منهج الله عز وجل،"], [2622.0, "وعن استغلال الأوقات في الطاعة والهدى والخير."]], "tr": [[2596.8, "Bu yüzden evlerimizde çocuklarımızdan ve eşlerimizden çokça isyankârlık (ukûk) görüyoruz."], [2602.5, "Vakitlerin onlar için boşa gittiğini görürsün;"], [2605.3, "ne bir şey ezberlemişler, ne bir şey okumuşlar, ne de din ya da dünya ilminde bir artış elde etmişlerdir."], [2613.9, "Hayatlarında çok başarısızlık ve bereket azlığı görürsün;"], [2616.0, "ne sebeple? Evlerde zikrin azlığı ve evlerin, onları Allah Azze ve Celle'nin yolundan ve vakitleri taat, hidayet ve hayırla değerlendirmekten alıkoyan şeytanlarla dolması sebebiyle."]]}, {"reader": false, "ar": [[2624.0, "ولذلك قال النبيّ صلى الله عليه وسلم:"], [2629.0, "«اقرؤوا في بيوتكم سورةَ البقرة، فإنّ الشيطان يفرّ من البيت الذي تُقرأ فيه سورةُ البقرة»،"], [2639.0, "أو كما قال صلى الله عليه وسلم."]], "tr": [[2624.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2630.6, "\"Evlerinizde Bakara sûresini okuyun; çünkü şeytan, içinde Bakara sûresi okunan evden kaçar.\" Ya da sallallâhu aleyhi ve sellem'in buyurduğu gibi."]]}]}, {"ts": "44:01", "title": "Kapanış", "paras": [{"reader": false, "ar": [[2641.0, "كم جلسنا؟ ولعلّنا نكتفي بهذا القدر،"], [2646.0, "وننتقل ـ إن شاء الله ـ الدرسَ القادم إلى قواعد الوسائل."], [2650.0, "أظنّ البركة أخذنا فيها شيئًا طيّبًا إن شاء الله."], [2652.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمّد،"], [2655.0, "وعلى آله وصحبه أجمعين."]], "tr": [[2641.0, "Ne kadar oturduk? Belki bu kadarla yetiniriz;"], [2646.9, "inşallah gelecek derste vesileler kaidelerine geçeceğiz."], [2650.0, "Sanırım bereket konusunda inşallah güzel bir şey aldık."], [2652.0, "Allah en yüce ve en iyi bilendir."], [2653.7, "Allah, Peygamberimiz Muhammed'e, âline ve bütün ashâbına salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
