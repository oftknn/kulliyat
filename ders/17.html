<script>
const D={"no": 17, "vid": "13wvD0hq1Ig", "title_ar": "الدرس (١٧) من شرح كليات العقيدة — كليات في القضاء والقدر", "title_tr": "Şerhu Külliyyâti'l-Akîde — 17. Ders: Kaza ve Kadere Dair Külliyeler (Sebepler, Tesahhut, Musibetler, Sabır ve Rıza, Şikâyet, Hüsn-i Zan, Kader Yazıları)", "sections": [{"ts": "00:00", "title": "1. Külliye: Kadere iman büyüdükçe sebeplere sarılma hırsı da büyür", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.8, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.4, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.6, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [9.3, "أما بعد: <span class=\"ayah\">﴿سُبْحَانَكَ لَا عِلْمَ لَنَا إِلَّا مَا عَلَّمْتَنَا ۖ إِنَّكَ أَنتَ الْعَلِيمُ الْحَكِيمُ﴾<\/span> <span class=\"ref\">[البقرة: ٣٢]<\/span>."], [15.0, "نواصل ـ إن شاء الله ـ شرحَ قواعد باب الربوبية،"], [20.4, "متمثّلةً في قواعد القضاء والقدر."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.8, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [6.6, "Bundan sonra: <span class=\"ayah\">﴿Sen münezzehsin! Bize öğrettiğinden başka bizim hiçbir bilgimiz yoktur. Şüphesiz sen her şeyi bilensin, hüküm ve hikmet sahibisin﴾<\/span> [Bakara 32]."], [15.0, "İnşallah rubûbiyyet babının kaidelerini, kaza ve kader kaideleri şeklinde şerh etmeye devam ediyoruz."]]}, {"reader": false, "ar": [[25.0, "الكلّيّة الأولى: <b>كلّما عظُم الإيمانُ بالقدر عظُم الحرصُ على تعاطي الأسباب.<\/b> <span class=\"note\">(يكررها)<\/span>."], [30.0, "أقول وبالله التوفيق: فهما أمران متلازمان؛"], [48.0, "فكلّما رأيتَ من نفسك الإهمالَ في فعل الأسباب فاعلم أنّ ذلك يرجع إلى ضعف إيمانك بالقضاء والقدر؛"], [55.0, "لأنّ من جملة ما يحمله ـ ما يتضمّنه ـ الإيمانُ بالقضاء والقدر:"], [63.0, "أن تحرص الحرصَ الكبير على فعل الأسباب،"], [65.0, "لأنّ الأسباب من جملة القضاء والقدر."]], "tr": [[25.0, "Birinci külliye: <b>1. külliye: Kadere iman büyüdükçe sebeplere sarılma hırsı da büyür.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [30.0, "Bu ikisi birbirinden ayrılmayan (mütelâzım) iki şeydir."], [48.0, "Kendinde sebepleri yerine getirmede bir ihmal gördüğün her seferde bil ki bu, kaza ve kadere olan imanının zayıflığına dayanır."], [55.0, "Çünkü kaza ve kadere imanın taşıdığı —içerdiği— şeylerden biri, sebepleri yerine getirmeye büyük bir hırsla sarılmandır;"], [65.0, "zira sebepler kaza ve kaderin bir parçasıdır."]]}, {"reader": false, "ar": [[68.0, "فالله عز وجل هو الذي قدّر بمعنى:"], [71.5, "كتب، وهو الذي قدّر بمعنى:"], [74.0, "رتّب الشيءَ على الشيء."], [76.0, "فالسببُ من قدر الله،"], [77.7, "والمسبَّبُ ـ الذي هو أثرُه ـ من قدر الله عز وجل."], [82.0, "فإذا ترك الإنسانُ تعاطيَ الأسباب المشروعة المتاحة فكأنه ترك جزءًا من أجزاء القدر،"], [90.0, "وهذا يُفضي إلى ضعف الإيمان بالقضاء والقدر."], [94.0, "فليس هناك تعارضٌ بين الإيمان بالقضاء والقدر وبين الحرص على الأسباب،"], [100.9, "لأنّ الأسباب من القدر."]], "tr": [[68.0, "Allah Azze ve Celle \"yazdı\" anlamında takdir edendir;"], [71.5, "\"bir şeyi bir şeye bağladı (sıraladı)\" anlamında takdir eden de O'dur."], [76.0, "Sebep Allah'ın kaderindendir; onun eseri olan müsebbeb de Allah Azze ve Celle'nin kaderindendir."], [82.0, "İnsan meşru ve elindeki imkân dahilindeki sebeplere sarılmayı terk ederse, sanki kaderin parçalarından birini terk etmiş gibidir."], [90.0, "Bu da kaza ve kadere imanın zayıflamasına götürür."], [94.0, "Kaza ve kadere iman ile sebeplere sarılma hırsı arasında bir çelişki yoktur; çünkü sebepler kaderdendir."]]}, {"reader": false, "ar": [[104.0, "وقد أخرج أبو داود في سننه من حديث أبي خِزامة عن أبيه،"], [109.0, "قال: قلتُ: يا رسول الله،"], [112.1, "«أرأيتَ رُقًى نسترقيها، ودواءً نتداوى به، وتُقاةً نتّقيها، هل تردّ من قدر الله شيئًا؟ فقال: هي من قدر الله»."], [125.0, "والتداوي سبب، والرقيةُ سبب،"], [127.8, "والتُّقاة من الأمر المَخُوف مجرّدُ سبب."], [132.0, "فهذا الحديث نأخذ منه كلّيّةً عامة،"], [135.0, "وهي: أنّ كلَّ ما كان في دائرة السببية فداخلٌ في قضاء الله وقدره."]], "tr": [[104.0, "Ebû Dâvûd Sünen'inde Ebû Hizâme'nin babasından rivayet ettiği hadisi nakletmiştir."], [104.0, "Şöyle dedi: \"Ey Allah'ın Resûlü!"], [109.0, "«Okunmasını istediğimiz rukyeler, kendisiyle tedavi olduğumuz ilaçlar ve kendisiyle korunduğumuz korunma yolları hakkında ne dersin; bunlar Allah'ın kaderinden bir şeyi geri çevirir mi?» Buyurdu ki:"], [125.0, "«Onlar da Allah'ın kaderindendir.»\" Tedavi olmak bir sebeptir, rukye bir sebeptir, korkulan şeyden korunmak da sadece bir sebeptir."], [132.0, "Bu hadisten genel bir külliye çıkarırız:"], [135.0, "Sebebiyet dairesinde olan her şey Allah'ın kaza ve kaderine dahildir."]]}, {"reader": false, "ar": [[140.0, "فالأقدار قد تنزل عليك مباشرةً ابتداءً من الله عز وجل،"], [145.0, "وقد يكون قدرُ الله معلّقًا على قدرٍ آخر،"], [149.0, "وهو القدر السببي. فمن باب مقتضيات الإيمان بالقضاء والقدر أن تحرص على تعاطي الأسباب."], [160.0, "وكلّما رأيت من نفسك ضعفًا في تحصيل الأسباب المعينة لك على تحصيل الخير والنجاة من الشر،"], [167.0, "فاعرف أنّ ذلك يرجع إلى ضعف إيمانك بالقضاء والقدر."]], "tr": [[140.0, "Kaderler bazen doğrudan, ilk elden Allah Azze ve Celle'den sana iner;"], [140.0, "bazen de Allah'ın kaderi başka bir kadere bağlı olur, bu da sebebe bağlı kaderdir."], [149.0, "Sebeplere sarılmaya hırslı olman, kaza ve kadere imanın gereklerindendir."], [149.0, "Hayrı elde etmek ve şerden kurtulmak için sana yardımcı olacak sebepleri elde etmede kendinde bir zayıflık gördüğün her seferde bil ki bu, kaza ve kadere olan imanının zayıflığına dayanır."]]}, {"reader": false, "ar": [[172.0, "فحقيقةُ القدر مكوَّنةٌ من الإيمان بالقدر بمراتبه وأركانه،"], [177.3, "مضمومًا إليه فعلُ الأسباب."], [180.0, "فمن زعم أنّ الله عز وجل قدّر النتائجَ والمسبَّبات من غير مقدّماتها وأسبابها فقد ذهل وغفل عن حقيقة القدر،"], [193.0, "وقد أعظم على الله عز وجل الفِرية."], [197.7, "فالأسباب مقدَّرة، ومسبَّباتُها وآثارُها مقدَّرة؛"], [201.0, "فالجميع من قدر الله عز وجل."]], "tr": [[172.0, "Kaderin hakikati, mertebeleri ve rükünleriyle kadere iman ile buna eklenen sebepleri yerine getirmeden oluşur."], [177.3, "Kim Allah Azze ve Celle'nin neticeleri ve müsebbebleri öncülleri ve sebepleri olmaksızın takdir ettiğini iddia ederse, kaderin hakikatinden gafil kalmış ve habersiz olmuştur;"], [180.0, "Allah Azze ve Celle'ye karşı da büyük bir iftira etmiştir."], [193.0, "Sebepler takdir edilmiştir; müsebbebleri ve eserleri de takdir edilmiştir."], [197.7, "Hepsi Allah Azze ve Celle'nin kaderindendir."]]}, {"reader": false, "ar": [[203.0, "ولذلك لو تأمّلتَ حياة النبي صلى الله عليه وسلم وحياة صحابته الكرام فإنك تجد أنها قائمةٌ على الأخذ بالأسباب،"], [214.2, "وسيرتُه تشهد بذلك: فقد ظاهَرَ في أُحُدٍ بين درعين،"], [219.0, "وقد كان يلبس لَأْمةَ الحرب اتّقاءً لأسباب الشر ومن باب المحافظة على الحياة،"], [226.0, "وكان إذا أراد غزوةً ورّى بغيرها،"], [230.0, "وكان يأخذ كافّة الاحتياطات في الفوز في الحرب،"], [237.0, "وكان يأكل إذا جاع ويشرب إذا عطش،"], [240.0, "وكان يبيع ويشتري ويُؤجِر ويُؤجَر ويتداوى صلى الله عليه وسلم."]], "tr": [[203.0, "Bu yüzden Nebî ﷺ'in ve değerli ashâbının hayatını düşünürsen, onun sebeplere sarılma üzerine kurulu olduğunu görürsün;"], [203.0, "siyeri de buna şahitlik eder."], [214.2, "Uhud'da iki zırhı üst üste giydi;"], [214.2, "şerrin sebeplerinden korunmak ve hayatı muhafaza etmek için savaş zırhını giyerdi."], [219.0, "Bir gazveye çıkmak istediğinde başka bir yeri kastediyormuş gibi gösterirdi (tevriye yapardı)."], [230.0, "Savaşta başarı için her türlü tedbiri alırdı."], [237.0, "Acıkınca yer, susayınca içerdi. Alışveriş yapar, kiraya verir ve kiralanır, tedavi olurdu ﷺ."]]}, {"reader": false, "ar": [[249.0, "وهكذا صحابته الكرام؛ فلم يكن النبي صلى الله عليه وسلم ولا صحابته أبدًا يتركون شيئًا من الأسباب تواكلًا على القضاء والقدر."], [263.0, "وفي صحيح الإمام البخاري من حديث ابن عباس رضي الله عنهما قال:"], [267.7, "«كان أهلُ اليمن يحجّون ولا يتزوّدون، ويقولون: نحن المتوكّلون» ـ أي المؤمنون بقضاء الله وقدره ـ «فأنزل الله عز وجل: <span class=\"ayah\">﴿وَتَزَوَّدُوا فَإِنَّ خَيْرَ الزَّادِ التَّقْوَىٰ﴾<\/span> <span class=\"ref\">[البقرة: ١٩٧]<\/span>»."]], "tr": [[249.0, "Değerli ashâbı da böyleydi. Ne Nebî ﷺ ne de ashâbı, kaza ve kadere dayanıp tembellik ederek (tevâkülle) sebeplerden hiçbir şeyi asla terk etmezlerdi."], [249.0, "İmam Buhârî'nin Sahîh'inde İbn Abbâs'tan (radıyallahu anhümâ) rivayet edilen hadiste şöyle der:"], [267.7, "«Yemen halkı hacca azık almadan gelirdi ve \"Biz tevekkül edenleriz\" derlerdi» —yani Allah'ın kaza ve kaderine iman edenleriz—."], [267.7, "«Bunun üzerine Allah Azze ve Celle şunu indirdi: <span class=\"ayah\">﴿Azık edinin; şüphesiz azığın en hayırlısı takvadır﴾<\/span> [Bakara 197].»"]]}, {"reader": false, "ar": [[282.0, "وفي الحديث: «لا يردّ القدرَ إلا الدعاء» ـ والدعاء من القدر ـ «ولا يزيد في العمر إلا البرّ»،"], [292.0, "وكلاهما من القدر. وفي الحديث يقول النبي صلى الله عليه وسلم:"], [299.2, "«الدعاء ينفع مما نزل» ـ أي ليرفعه ـ «ومما لم ينزل» ـ أي ليدفعه ـ."], [307.0, "وكلُّ ذلك ثابتٌ في أحاديث متعددة."]], "tr": [[282.0, "Hadiste şöyle geçer: «Kaderi ancak dua geri çevirir» —dua da kaderdendir— «ömrü ancak iyilik artırır.» İkisi de kaderdendir."], [292.0, "Bir hadiste de Nebî ﷺ şöyle buyurur:"], [292.0, "«Dua, inmiş olana» —yani onu kaldırmak için— «ve henüz inmemiş olana» —yani onu defetmek için— «fayda verir.» Bunların hepsi birçok hadiste sabittir."]]}]}, {"ts": "05:12", "title": "1. Külliye (devam): Kaderi kaderle defetmek; Mûsâ'nın asası ve Meryem'in hurma dalı", "paras": [{"reader": false, "ar": [[312.0, "وفي الحديث يقول النبي صلى الله عليه وسلم:"], [316.2, "«لا يُورِدُ مُمْرِضٌ على مُصِحّ»،"], [318.8, "من باب فعل الأسباب التي تقيك قدرَ المرض،"], [323.0, "فأنت تدفع القدرَ بالقدر."], [326.0, "ويقول صلى الله عليه وسلم:"], [329.2, "«فِرَّ من المجذوم فرارَك من الأسد»."], [333.0, "ويقول صلى الله عليه وسلم في الطاعون:"], [336.7, "«إذا سمعتم به في بلدٍ فلا تَقدَموا عليه، وإذا وقع بأرضٍ وأنتم بها فلا تخرجوا فرارًا منه»."]], "tr": [[312.0, "Hadiste Nebî ﷺ şöyle buyurur:"], [312.0, "«Hasta (hayvanı olan), sağlam (hayvanı olanın) yanına (hayvanlarını) götürmesin.» Bu, seni hastalık kaderinden koruyan sebepleri yerine getirme kabilindendir;"], [323.0, "sen kaderi kaderle defediyorsun. Nebî ﷺ şöyle buyurur:"], [329.2, "«Aslandan kaçtığın gibi cüzamlıdan kaç.» Tâun (veba) hakkında da şöyle buyurur:"], [333.0, "«Bir beldede olduğunu işitirseniz oraya gitmeyin; bulunduğunuz bir yerde ortaya çıkarsa da ondan kaçmak için oradan çıkmayın.»"]]}, {"reader": false, "ar": [[345.0, "ويعجبني في هذا المقام قولُ عمر رضي الله تعالى عنه،"], [350.0, "لمّا أقبل على الشام وسمع أنّ الطاعون قد نزل بها،"], [353.0, "فاستشار الصحابة فأشاروا عليه بالرجوع حتى لا يُهلك نفسه ولا يُهلك المؤمنين معه،"], [359.0, "فقال أحد الصحابة: «أوَنفرّ من قدر الله؟» فقال عمر رضي الله تعالى عنه:"], [368.0, "«إنما نفرّ من قدر الله لقدر الله»."], [373.0, "وهذا ما ندين اللهَ عز وجل به."]], "tr": [[345.0, "Bu makamda Ömer'in (radıyallahu teâlâ anh) sözü hoşuma gider:"], [345.0, "Şam'a doğru gelip tâunun oraya indiğini işitince ashâba danıştı."], [350.0, "Onlar da ne kendini ne de yanındaki müminleri helâke sürüklemesin diye geri dönmesini tavsiye ettiler."], [353.0, "Sahâbîlerden biri \"Allah'ın kaderinden mi kaçıyoruz?\" dedi."], [359.0, "Ömer (radıyallahu teâlâ anh) de şöyle dedi:"], [359.0, "\"Biz ancak Allah'ın kaderinden Allah'ın kaderi için kaçıyoruz.\" Allah Azze ve Celle'ye karşı din edindiğimiz (inandığımız) şey budur."]]}, {"reader": false, "ar": [[378.0, "وإنّ هناك موقفين في القرآن ـ أو موضعين في القرآن ـ إذا مررتَ بهما فانتبه لهما انتباهًا شديدًا."], [389.0, "الموضع الأول: أنه لمّا فرّ موسى وبنو إسرائيل من فرعون وقومه،"], [396.1, "وجاؤوا عند شاطئ البحر،"], [400.0, "وفي هذه الظروف الحالكة يأتي الأمرُ من الله عز وجل لموسى:"], [407.3, "<span class=\"ayah\">﴿أَنِ اضْرِب بِّعَصَاكَ الْبَحْرَ﴾<\/span> <span class=\"ref\">[الشعراء: ٦٣]<\/span>."], [412.0, "فإذًا لا بدّ من فعل الأسباب،"], [413.8, "ولا ينبغي للإنسان أن يتواكل على ما كُتب في القضاء والقدر."]], "tr": [[378.0, "Kur'an'da iki durum —ya da iki yer— vardır ki onlara uğradığında onlara çok dikkat et."], [378.0, "Birinci yer: Mûsâ ve İsrâiloğulları Firavun'dan ve kavminden kaçıp deniz kıyısına geldiklerinde, bu karanlık şartlarda Allah Azze ve Celle'den Mûsâ'ya şu emir gelir:"], [407.3, "<span class=\"ayah\">﴿Asanla denize vur﴾<\/span> [Şuarâ 63]."], [407.3, "Demek ki sebepleri yerine getirmek şarttır;"], [412.0, "insanın kaza ve kaderde yazılana dayanıp tembellik etmesi yakışmaz."]]}, {"reader": false, "ar": [[417.0, "ولم يقل موسى ولا أحدٌ من بني إسرائيل:"], [421.2, "لو أنّ الله قدّر أن لا يُدرَكوا فلن يُدرَكوا وإن لم يضرب موسى بالحجرِ..."], [428.0, "بعصاه البحرَ، وإن قدّر الله عز وجل أن يُدرَكوا فسيُدرَكون ولو ضرب البحرَ بعصاه ألفَ مرة."], [436.0, "فهذا من باب التربية على فعل الأسباب:"], [440.5, "<span class=\"ayah\">﴿أَنِ اضْرِب بِّعَصَاكَ الْبَحْرَ﴾<\/span>،"], [443.0, "مع كمال قدرة الله عز وجل على أن ينفلق البحرُ وتحصلَ النجاةُ من غير هذا الضرب،"], [449.0, "لكنه من باب التربية على فعل الأسباب."]], "tr": [[417.0, "Ne Mûsâ ne de İsrâiloğullarından biri şöyle demedi:"], [421.2, "\"Eğer Allah yakalanmamalarını takdir ettiyse, Mûsâ denize taşla..."], [421.2, "asasıyla vurmasa da yakalanmazlar; Allah Azze ve Celle yakalanmalarını takdir ettiyse, denize asasıyla bin kere vursa da yakalanırlar.\" <span class=\"ayah\">﴿Asanla denize vur﴾<\/span> emri, sebepleri yerine getirme terbiyesi kabilindendir."], [440.5, "Hâlbuki Allah Azze ve Celle'nin, bu vuruş olmadan denizi yarmaya ve kurtuluşu gerçekleştirmeye kudreti tamdır;"], [443.0, "fakat bu, sebepleri yerine getirme terbiyesi kabilindendir."]]}, {"reader": false, "ar": [[452.1, "فأكملُ المؤمنين المتوكّلين في زمانه موسى عليه الصلاة والسلام،"], [457.0, "لم يحمله إيمانُه بقضاء الله وقدره على أن يعطّل هذه السببية."], [463.0, "والموضع الثاني: ما حصل لمريم رضي الله تعالى عنها لمّا ولدت عيسى عليه الصلاة والسلام؛"], [472.0, "فإنها في فترةٍ عظيمةٍ وخوفٍ من المستقبل وما سيقوله قومُها فيها،"], [482.0, "يأتي الأمر من الله عز وجل:"], [486.2, "<span class=\"ayah\">﴿وَهُزِّي إِلَيْكِ بِجِذْعِ النَّخْلَةِ﴾<\/span> <span class=\"ref\">[مريم: ٢٥]<\/span>."]], "tr": [[452.1, "Zamanındaki tevekkül eden müminlerin en kâmili Mûsâ'ydı (aleyhissalâtu vesselâm);"], [452.1, "Allah'ın kaza ve kaderine imanı onu bu sebebiyeti işlemez hâle getirmeye sevk etmedi."], [463.0, "İkinci yer: Meryem'in (radıyallahu teâlâ anhâ) Îsâ'yı (aleyhissalâtu vesselâm) doğurduğu zaman başına gelenlerdir."], [463.0, "O, büyük bir dönemde, gelecekten ve kavminin onun hakkında söyleyeceklerinden korku içindeyken Allah Azze ve Celle'den şu emir gelir:"], [486.2, "<span class=\"ayah\">﴿Hurma dalını (gövdesini) kendine doğru silkele﴾<\/span> [Meryem 25]."]]}, {"reader": false, "ar": [[489.0, "فلا بدّ أن تقوم بالأسباب،"], [491.5, "وليست هناك حالةٌ تتعطّل فيها عن فعل الأسباب أبدًا،"], [496.0, "حتى وفي أضيق الظروف وأحلك المضائق؛"], [500.0, "لا بدّ أن تقوم بالأسباب المتاحة والمقدورة."], [504.0, "وإذا عجزتَ عنها العجزَ المطلق فالله عز وجل يتولّاك برحمته وعنايته وتيسيره."], [510.0, "لكن ما دمتَ قادرًا على فعل سببيةٍ واحدة في تحصيل مرادٍ مطلوب أو النجاة من أمرٍ مرهوب،"], [520.0, "فإنك لا ينبغي لك أبدًا أن تعطّل ذلك."]], "tr": [[489.0, "Sebepleri yerine getirmen şarttır; sebepleri işlemekten geri durabileceğin hiçbir hâl asla yoktur;"], [491.5, "en dar şartlarda ve en karanlık sıkıntılarda bile."], [496.0, "Elindeki imkân dahilinde ve gücünün yettiği sebepleri yerine getirmen şarttır."], [504.0, "Onlardan mutlak bir acizlikle aciz kalırsan, Allah Azze ve Celle rahmetiyle, inayetiyle ve kolaylaştırmasıyla seni üstlenir."], [510.0, "Fakat istenen bir muradı elde etmede veya korkulan bir şeyden kurtulmada tek bir sebebi işlemeye gücün yettiği sürece, onu işlemez hâle getirmen sana asla yakışmaz."]]}, {"reader": false, "ar": [[522.0, "مع كمال قدرة الله عز وجل على أن يتساقط الرُّطَبُ بجوارها من غير هذا الهزّ الذي تُؤمر به امرأةٌ في ظروفها."], [533.0, "ولم يقل: «وهزّي بفرع النخلة»،"], [536.1, "وإنما: بجذع النخلة. وأنتم تعلمون أنّ جذع النخلة لو اجتمع فِئامٌ من الرجال يهزّونه فربّما لا تسقط تمرةٌ واحدة،"], [544.0, "بل ولو سقطت تمراتٌ فربما تنتثر منها هاهنا وهاهنا،"], [548.0, "ولكنّ الله وصف التمرَ المتساقط بتلك الهزّة بأنه «جنيّ»،"], [552.0, "يعني قريبٌ منها مجتمع."], [554.0, "لكن لا بدّ من فعل الأسباب."]], "tr": [[522.0, "Hâlbuki Allah Azze ve Celle'nin, bu şartlardaki bir kadına emredilen bu silkeleme olmadan taze hurmaların yanına dökülmesine kudreti tamdır."], [533.0, "\"Hurmanın dalını silkele\" demedi; \"hurmanın gövdesini\" dedi."], [536.1, "Biliyorsunuz ki bir hurma gövdesini bir grup adam toplanıp silkelese belki tek bir hurma bile düşmez;"], [536.1, "birkaç hurma düşse de belki oraya buraya saçılır."], [544.0, "Fakat Allah, o silkelemeyle dökülen hurmayı \"cenî\" (taze toplanmış) diye nitelemiştir;"], [548.0, "yani ona yakın ve toplu hâlde."], [552.0, "Fakat sebepleri yerine getirmek şarttır."]]}, {"reader": false, "ar": [[558.0, "وهذا فيه ردٌّ على الصوفية،"], [560.1, "وعلى الذين يُخرجون الأعمالَ عن دائرة الإيمان،"], [563.0, "بأنّ الله إذا كتبنا من أهل الجنة فسنَصِلُها ولو لم نعمل،"], [569.5, "وإن كنّا من أهل النار فإننا سنُحرم من الجنة وإن عملنا واجتهدنا."], [576.0, "فكلُّ ذلك مبنيٌّ على وجود التعارض بين الإيمان بالقضاء والقدر وتعاطي الأسباب."], [584.0, "فتأتيك هذه الكلّيّة لتعالج هذا الأمر:"], [587.0, "أنه كلّما عظُم إيمانُك بقضاء الله وقدره،"], [590.0, "فمن ثمرات عِظَم الإيمان بذلك أنه يحملك على فعل الأسباب وتعاطيها،"], [597.0, "لأنك تعلم أنّ الأسباب وآثارها من جملة قضائه وقدره. والله أعلم."]], "tr": [[558.0, "Bunda Sûfîlere ve amelleri iman dairesinin dışına çıkaranlara bir reddiye vardır;"], [560.1, "onlar şöyle derler: \"Allah bizi cennet ehlinden yazdıysa, amel etmesek de oraya ulaşırız;"], [563.0, "cehennem ehlindensek amel etsek ve çabalasak da cennetten mahrum kalırız.\" Bütün bunlar, kaza ve kadere iman ile sebeplere sarılma arasında bir çelişki olduğu düşüncesine dayanır."], [576.0, "İşte bu külliye bu meseleyi tedavi etmek için gelir:"], [584.0, "Allah'ın kaza ve kaderine imanın büyüdükçe, bu imanın büyüklüğünün meyvelerinden biri de seni sebepleri yerine getirmeye ve onlara sarılmaya sevk etmesidir;"], [590.0, "çünkü sebeplerin ve eserlerinin O'nun kaza ve kaderinin bir parçası olduğunu bilirsin. Allah en iyisini bilir."]]}]}, {"ts": "10:03", "title": "2. Külliye: Kaza ve kadere tesahhutu (öfkelenmeyi) içeren her şey haramdır", "paras": [{"reader": false, "ar": [[603.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما يتضمّن التسخّطَ على القضاء والقدر فمحرَّم.<\/b> <span class=\"note\">(يكررها)<\/span>."], [609.0, "أقول وبالله التوفيق: سواءٌ أكان تسخّطًا قلبيًّا ـ وهو بغضُ هذا الشيء الذي قدّره الله عز وجل ـ،"], [635.0, "أو تسخّطًا لسانيًّا بعباراتٍ وكلماتٍ يعرفها أهلُها،"], [645.0, "أو تسخّطًا عمليًّا؛ فكلُّ ذلك من الأمور المحرّمة."], [650.0, "ولأنّ التسخّط ينافي الصبرَ الواجب عند نزول المصائب،"], [656.0, "كما سيأتينا في كلّيّةٍ خاصة إن شاء الله."]], "tr": [[603.0, "Külliyelerden biri de şudur: 2."], [603.0, "külliye: Kaza ve kadere tesahhutu (öfkelenmeyi) içeren her şey haramdır. (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [609.0, "İster kalbî bir tesahhut olsun —ki bu, Allah Azze ve Celle'nin takdir ettiği şeye buğzetmektir—, ister ehlinin bildiği ifadeler ve sözlerle dilî bir tesahhut olsun, ister amelî (fiilî) bir tesahhut olsun;"], [645.0, "bunların hepsi haram olan şeylerdendir."], [650.0, "Ayrıca tesahhut, musibetler indiğinde vâcip olan sabra aykırıdır;"], [656.0, "inşallah buna dair özel bir külliye gelecek."]]}, {"reader": false, "ar": [[659.0, "وعلى ذلك قولُ الله عز وجل:"], [661.0, "<span class=\"ayah\">﴿مَا أَصَابَ مِن مُّصِيبَةٍ إِلَّا بِإِذْنِ اللَّهِ ۗ وَمَن يُؤْمِن بِاللَّهِ يَهْدِ قَلْبَهُ﴾<\/span> <span class=\"ref\">[التغابن: ١١]<\/span>."], [665.0, "قال الأئمة رحمهم الله تعالى:"], [667.7, "«هو المؤمن تصيبه المصيبة فيعلم أنها من الله فيرضى ويسلّم»."], [673.0, "وفي الصحيح يقول النبي صلى الله عليه وسلم:"], [677.2, "«ليس منّا من ضرب الخدود، وشقّ الجيوب، ودعا بدعوى الجاهلية» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [682.4, "وهي من التسخّطات العملية والقولية؛"], [685.0, "فضربُ الخدود وشقُّ الجيوب تسخّطٌ عملي،"], [689.1, "والدعاءُ بدعوى الجاهلية هذا من التسخّط القولي."]], "tr": [[659.0, "Allah Azze ve Celle'nin şu sözü buna delildir:"], [661.0, "<span class=\"ayah\">﴿Allah'ın izni olmadan hiçbir musibet isabet etmez. Kim Allah'a iman ederse, Allah onun kalbini hidayete erdirir﴾<\/span> [Teğâbün 11]."], [661.0, "İmamlar (rahimehumullah) şöyle demiştir: \"Bu, kendisine musibet isabet eden ve onun Allah'tan olduğunu bilip razı olan ve teslim olan mümindir.\" Sahîh'te Nebî ﷺ şöyle buyurur:"], [677.2, "«Yanaklarını döven, yakalarını yırtan ve cahiliye çağrısıyla çağıran bizden değildir.» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [682.4, "Bunlar amelî ve sözlü tesahhutlardandır:"], [685.0, "Yanakları dövmek ve yakaları yırtmak amelî tesahhuttur;"], [689.1, "cahiliye çağrısıyla çağırmak ise sözlü tesahhuttandır."]]}, {"reader": false, "ar": [[694.0, "وفي الصحيح أنّ النبي صلى الله عليه وسلم بَرِئ من الصالقة ـ وهي التي ترفع صوتها عند المصيبة،"], [702.5, "وهو تسخّطٌ قولي ـ، والحالقة ـ وهي التي تحلق رأسها عند المصيبة،"], [708.9, "وهو تسخّطٌ عملي ـ، والشاقّة ـ أي التي تشقّ ثيابها وتمزّق ملابسها عند المصيبة،"], [717.0, "وهو من باب التسخّط العملي ـ <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[694.0, "Sahîh'te Nebî ﷺ'in sâlika'dan —musibet anında sesini yükselten kadın;"], [694.0, "bu sözlü tesahhuttur—, hâlika'dan —musibet anında başını tıraş eden kadın;"], [702.5, "bu amelî tesahhuttur— ve şâkka'dan —musibet anında elbisesini yırtan ve giysilerini parçalayan kadın;"], [708.9, "bu da amelî tesahhut kabilindendir— uzak olduğu (berî olduğu) geçer <span class=\"note\">(Buhârî, Müslim)<\/span>."]]}, {"reader": false, "ar": [[721.0, "ويقول النبي صلى الله عليه وسلم:"], [724.4, "«أربعٌ في أمتي من أمر الجاهلية لا يتركونهنّ»،"], [729.0, "وذكر منها: «والنياحة على الميت»،"], [732.5, "وهو رفعُ الصوت بالصراخ والبكاء العظيم،"], [737.0, "وهو من باب التسخّط القولي."], [741.0, "ويقول صلى الله عليه وسلم محذّرًا من هذا التسخّط القولي:"], [746.0, "«النائحة إذا لم تتُب فإنها تُقام يوم القيامة وعليها سِربالٌ من قَطِران ودرعٌ من جَرَب» <span class=\"note\">(Müslim)<\/span>."]], "tr": [[721.0, "Nebî ﷺ şöyle buyurur: «Ümmetimde cahiliye işlerinden dört şey vardır ki onları terk etmezler.» Bunlardan birini de şöyle zikretti:"], [729.0, "«Ölüye ağıt yakmak (niyâha).» Bu, çığlık atarak ve yüksek sesle ağlayarak sesi yükseltmektir;"], [737.0, "sözlü tesahhut kabilindendir. Nebî ﷺ bu sözlü tesahhuttan sakındırarak şöyle buyurur:"], [741.0, "«Ağıt yakan kadın (ölmeden önce) tevbe etmezse, kıyamet günü üzerinde katrandan bir gömlek ve uyuzdan bir zırh olduğu hâlde kaldırılır.» <span class=\"note\">(Müslim)<\/span>."]]}, {"reader": false, "ar": [[756.0, "ويقول صلى الله عليه وسلم ـ كما عند الترمذي وغيره ـ:"], [760.0, "«إنّ الله يقضي القضاء، فمن رضي فله الرضا، ومن سخط فله السخط»؛"], [771.0, "سواءٌ تسخّطٌ قلبيٌّ أو عمليٌّ أو قولي،"], [773.0, "فليس له مع المصيبة إلا سخطُ الله عز وجل."], [777.0, "ويقول صلى الله عليه وسلم في حديث أنس عند الترمذي وغيره:"], [782.0, "«إنّ الله إذا أحبّ قومًا ابتلاهم، فمن رضي فله الرضا، ومن سخط فله السخط»،"], [791.0, "أو كما قال صلى الله عليه وسلم."]], "tr": [[756.0, "Nebî ﷺ —Tirmizî ve başkalarının rivayet ettiği üzere— şöyle buyurur:"], [756.0, "«Allah bir hükmü verir; kim razı olursa rıza onundur, kim öfkelenirse öfke onundur.» İster kalbî, ister amelî, ister sözlü tesahhut olsun;"], [771.0, "(öfkelenen için) musibetle birlikte Allah Azze ve Celle'nin gazabından başka bir şey yoktur."], [777.0, "Nebî ﷺ, Tirmizî ve başkalarının rivayet ettiği Enes hadisinde şöyle buyurur:"], [782.0, "«Allah bir topluluğu sevdiğinde onları imtihan eder; kim razı olursa rıza onundur, kim öfkelenirse öfke onundur.» Ya da Nebî ﷺ'in buyurduğu gibi."]]}, {"reader": false, "ar": [[794.0, "وقد أجمع العلماء على حرمة التسخّط أيًّا كان نوعُه عند نزول المصائب،"], [801.0, "لأنّ الصبر واجب والتسخّطَ محرَّم."], [805.0, "فإن قلتَ: هل يمكن أن يصل التسخّطُ بصاحبه إلى الكفر؟"], [811.0, "الجواب: نعم، إذا كان مبنيًّا على بغض ما قضاه الله عز وجل وقدّره،"], [820.0, "البغضِ الذي يتضمّن الطعنَ في حكمة الله عز وجل في قضائه وقدره،"], [826.0, "والطعنَ في قدرته، أو الطعنَ في ربوبيته واستحقاقه لكلّ كمالٍ عز وجل،"], [833.0, "أو كان يتضمّن سوءَ الظنّ بالله عز وجل الإساءةَ المطلقة."]], "tr": [[794.0, "Âlimler, musibetler indiğinde türü ne olursa olsun tesahhutun haram olduğu üzerinde icmâ etmişlerdir;"], [801.0, "çünkü sabır vâciptir, tesahhut haramdır."], [805.0, "\"Tesahhut sahibini küfre kadar götürebilir mi?\" dersen, cevap:"], [811.0, "Evet; eğer Allah Azze ve Celle'nin hükmettiği ve takdir ettiği şeye buğza dayanıyorsa —Allah Azze ve Celle'nin kaza ve kaderindeki hikmetini, kudretini ya da rubûbiyyetini ve her kemale layık oluşunu kötülemeyi içeren bir buğz— veya Allah Azze ve Celle hakkında mutlak kötü zannı içeriyorsa."]]}, {"reader": false, "ar": [[841.0, "فمتى ما كان تسخّطُ العبد تسخّطًا قلبيًّا مبناه على الشكّ في حكمة الله وعلمه وعدله وقدرته،"], [849.0, "أو كان مبناه على وصف الله عز وجل بالظلم والجور وعدم الحكمة،"], [857.0, "أو كان تسخّطًا يتضمّن الاعتراضَ على ربوبية الله عز وجل وقضائه وقدره،"], [865.0, "فإنّ ذلك من التسخّط الذي يُخرج العبدَ عن دائرة الإسلام بالكلّيّة."]], "tr": [[841.0, "Kulun tesahhutu, Allah'ın hikmetinden, ilminden, adaletinden ve kudretinden şüphe etmeye dayanan kalbî bir tesahhut olduğunda;"], [849.0, "ya da Allah Azze ve Celle'yi zulüm, haksızlık ve hikmetsizlikle nitelemeye dayandığında;"], [857.0, "ya da Allah Azze ve Celle'nin rubûbiyyetine, kazasına ve kaderine itirazı içeren bir tesahhut olduğunda, bu, kulu İslâm dairesinden tamamen çıkaran tesahhuttandır."]]}, {"reader": false, "ar": [[871.0, "وكذلك التسخّطُ اللساني إذا تضمّن سبَّ الله،"], [875.7, "أو سبَّ قضائه وقدره،"], [878.3, "أو سبَّ دينه وشريعته،"], [881.0, "كما يفعله بعضُ الناس إذا نزلت عليه مصيبةٌ:"], [886.0, "لعن الشريعة، أو لعن الدين،"], [889.1, "أو لعن القرآن، أو لعن شيئًا مما يتعلّق بربوبية الله عز وجل،"], [894.0, "كما تسمعونه كثيرًا ممّن لا خَلاقَ له."]], "tr": [[871.0, "Aynı şekilde dilî tesahhut da Allah'a sövmeyi, O'nun kaza ve kaderine sövmeyi ya da dinine ve şeriatına sövmeyi içerirse (böyledir)."], [881.0, "Nitekim bazı insanlar kendilerine bir musibet indiğinde şeriata, dine, Kur'an'a ya da Allah Azze ve Celle'nin rubûbiyyetiyle ilgili bir şeye lanet ederler;"], [889.1, "(dinden) nasibi olmayan birçok kimseden bunu işittiğiniz gibi."]]}]}, {"ts": "14:57", "title": "2. Külliye (devam): Tesahhut örnekleri; ibadeti karşılık için yapmak", "paras": [{"reader": false, "ar": [[897.0, "فإن قلتَ: اضرب لنا أمثلةً على قضية التسخّط."], [902.0, "أقول: أمثلته كثيرة؛ منها:"], [904.5, "النياحةُ على الميت، وشقُّ الجيوب،"], [907.0, "ولطمُ الخدود، وقول: فلانٌ مسكين،"], [910.2, "أو: فلانٌ لا يستاهل،"], [917.0, "أو: من أين أتانا هذا البلاء؟"], [921.0, "أو: ألا يكفينا ما فينا؟"], [924.0, "أو: واللهِ حرامٌ اللي يصيبنا،"], [929.0, "أو نتفُ الشعر أو حلقُه،"], [933.0, "أو تركُ التعبّد تسخّطًا على قضاء الله."]], "tr": [[897.0, "\"Tesahhut meselesine dair bize örnekler ver\" dersen, derim ki:"], [902.0, "Örnekleri çoktur. Bunlardan bazıları: Ölüye ağıt yakmak, yakaları yırtmak, yanaklara vurmak;"], [907.0, "\"Falan zavallı\", \"Falan bunu hak etmiyor\", \"Bu bela bize nereden geldi?\", \"İçinde bulunduğumuz (dert) bize yetmiyor mu?\", \"Vallahi başımıza gelen haksızlık\" demek;"], [924.0, "saçı yolmak ya da tıraş etmek;"], [929.0, "ya da Allah'ın kazasına öfkelenerek ibadeti terk etmek."]]}, {"reader": false, "ar": [[937.0, "فإنّ من الناس من قد يترك صلاةَ الجماعة،"], [940.2, "أو صلاةَ الفريضة، أو الصيامَ في رمضان،"], [943.0, "إذا نزلت عليه مصيبةٌ؛"], [945.7, "تركَ تسخّطًا، فكأنه يجعل تعبّدَه تعبّدَ مُعاوَضة،"], [952.0, "فإذا لم يأتِ له من الله ما يريد فإنه يقطع التعبّد."], [958.0, "وأنتم تعرفون أنّ القاعدة في التعبّد:"], [961.8, "أننا نعبده لنُرضيَه لا ليُعطيَنا،"], [965.0, "أننا نعبده لنرضيه سواءٌ أعطانا أو لم يُعطِنا،"], [972.0, "سواءٌ أصابنا بالشرّ أو عصمنا منه."]], "tr": [[937.0, "Çünkü insanlardan bazıları kendisine bir musibet indiğinde cemaatle namazı, farz namazı ya da Ramazan orucunu terk edebilir;"], [943.0, "öfkelenerek terk eder. Sanki ibadetini bir karşılık (muâvaza) ibadeti yapar;"], [952.0, "Allah'tan istediği şey gelmezse ibadeti keser."], [952.0, "Bilirsiniz ki ibadetteki kaide şudur:"], [958.0, "Biz O'na, bize versin diye değil, O'nu razı etmek için ibadet ederiz."], [961.8, "Bize versin ya da vermesin, bize şer isabet ettirsin ya da bizi ondan korusun, O'nu razı etmek için ibadet ederiz."]]}, {"reader": false, "ar": [[976.0, "وممّا يدخل في مسألة التسخّط:"], [979.6, "استعمالُ كلمة «لو»، وستأتينا فيها كلّيّةٌ خاصة الدرسَ القادم إن شاء الله تعالى."], [992.0, "والخلاصة من هذه الكلّيّة:"], [994.2, "أنّ أيَّ شيءٍ يتضمّن التسخّطَ على قضاء الله وقدره فإنه موصوفٌ بأنه حرام،"], [1000.9, "وقد يصل في بعض صوره إلى الكفر كما فصّلتُ. والله أعلم."]], "tr": [[976.0, "Tesahhut meselesine giren şeylerden biri de \"keşke / eğer\" (lev) kelimesini kullanmaktır;"], [979.6, "inşallah gelecek derste buna dair özel bir külliye gelecek."], [992.0, "Bu külliyenin özeti şudur: Allah'ın kaza ve kaderine tesahhutu içeren her şey haram olmakla nitelenir;"], [994.2, "açıkladığım gibi bazı şekillerinde küfre kadar varabilir. Allah en iyisini bilir."]]}]}, {"ts": "16:46", "title": "3. Külliye: Mümin için bütün musibetler ya derece yükseltme ya da günahlara kefarettir", "paras": [{"reader": false, "ar": [[1006.0, "الكلّيّة الثالثة: <b>كلُّ المصائب على أهل الإيمان دائرةٌ بين الرِّفعة والتكفير.<\/b> كلُّ المصائب على أهل الإيمان فهي دائرةٌ بين الرفعة والتكفير."], [1026.0, "أقول وبالله التوفيق: وذلك ليس لأحدٍ إلا لأهل الإيمان فقط."], [1033.0, "فجميعُ المصائب التي يُجريها الله عز وجل على عباده المؤمنين فإنها لا تخلو من أحد أمرين:"], [1043.0, "إمّا مصائبُ يرفع الله عز وجل بها درجاتِ المصاب إلى مواضعَ ومراتبَ لا يستطيعها بعمله،"], [1052.0, "وإمّا مصائبُ ليكفّر الله عز وجل بها عن المصاب ما لم يتُب منه من الذنوب والمعاصي."]], "tr": [[1006.0, "Üçüncü külliye: <b>3. külliye: İman ehline isabet eden bütün musibetler, (derece) yükseltme ile (günahları) örtme (tekfîr) arasında döner.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [1026.0, "Bu, sadece iman ehline mahsustur."], [1026.0, "Allah Azze ve Celle'nin mümin kullarına verdiği bütün musibetler şu iki şeyden birinden hâlî değildir:"], [1033.0, "Ya Allah Azze ve Celle'nin, musibete uğrayanın derecelerini ameliyle ulaşamayacağı yerlere ve mertebelere yükselttiği musibetlerdir;"], [1043.0, "ya da Allah Azze ve Celle'nin, musibete uğrayanın tevbe etmediği günahlarını ve isyanlarını örttüğü musibetlerdir."]]}, {"reader": false, "ar": [[1061.0, "فالله عز وجل قد يريد للعبد منزلةً في الجنة لم يبلغها بعمله،"], [1067.0, "فيُجري الله عز وجل عليه من المصائب المقرونة بالصبر حتى يصل إلى هذه المنزلة،"], [1074.0, "كما قال صلى الله عليه وسلم:"], [1077.6, "«إذا سبقت للعبد منزلةٌ من الله لم يبلغها بعمله، ابتلاه الله عز وجل في نفسه، أو في ولده، أو في ماله، ثم صبّره على ذلك البلاء حتى يصل إلى ـ أو قال: حتى يرفعه إلى ـ المنزلة التي سبقت له من الله». حديثٌ صحيحٌ لغيره."]], "tr": [[1061.0, "Allah Azze ve Celle bir kul için cennette ameliyle ulaşamadığı bir makam dileyebilir;"], [1067.0, "Allah Azze ve Celle de o makama ulaşıncaya kadar ona sabırla birlikte musibetler verir."], [1067.0, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [1074.0, "«Kul için Allah katında ameliyle ulaşamadığı bir makam önceden belirlenmişse, Allah Azze ve Celle onu nefsinde, çocuğunda ya da malında imtihan eder; sonra ona o belaya sabır verir; ta ki Allah katında kendisi için önceden belirlenmiş makama ulaşıncaya —ya da: onu o makama yükseltinceye— kadar.» Sahîh li-gayrihî bir hadistir."]]}, {"reader": false, "ar": [[1100.0, "وهي تلك المصائبُ التي يُجريها الله عز وجل على الأنبياء والرسل المغفورِ لهم ما تقدّم من ذنوبهم وما تأخّر،"], [1112.0, "فإنما هي مصائبُ لرفعة الدرجات،"], [1115.0, "أو المصائبُ التي يُجريها الله عز وجل على المؤمنين الخُلَّص ممّن لا ذنوبَ لهم، فهي لرفعة الدرجات."]], "tr": [[1100.0, "(Derece yükseltme musibetleri), Allah Azze ve Celle'nin, geçmiş ve gelecek günahları bağışlanmış olan peygamberlere ve resullere verdiği musibetlerdir;"], [1112.0, "bunlar ancak dereceleri yükseltmek içindir."], [1115.0, "Ya da Allah Azze ve Celle'nin günahı olmayan hâlis müminlere verdiği musibetlerdir;"], [1115.0, "bunlar da dereceleri yükseltmek içindir."]]}, {"reader": false, "ar": [[1126.0, "ولذلك دخل ابنُ مسعود رضي الله تعالى عنه وأرضاه على النبي صلى الله عليه وسلم وهو يُوعَك،"], [1134.0, "«فقلتُ: يا رسول الله، إنك تُوعَك وَعْكًا شديدًا! قال: نعم، إني أُوعَك كما يُوعَك رجلان منكم. قلتُ: ذلك لأنّ لك الأجرَ مرّتين؟ قال: هو كذلك» ـ يا ابن مسعود ـ <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [1149.0, "أي أنّ هذا الوعك لرفعة الدرجات."]], "tr": [[1126.0, "Bu yüzden İbn Mes'ûd (radıyallahu teâlâ anh ve erdâh), Nebî ﷺ şiddetli bir ateşle hastayken yanına girdi:"], [1126.0, "«\"Ey Allah'ın Resûlü! Sen çok şiddetli bir ateşle hastalanıyorsun!\" dedim. Buyurdu ki: \"Evet, ben sizden iki adamın hastalandığı kadar hastalanırım.\" Dedim ki: \"Bu, senin için iki kat ecir olduğu için mi?\" Buyurdu ki: \"Evet, öyledir\"» —ey İbn Mes'ûd— <span class=\"note\">(Buhârî, Müslim)<\/span>."], [1134.0, "Yani bu ateşli hastalık dereceleri yükseltmek içindir."]]}, {"reader": false, "ar": [[1152.0, "ويقول النبي صلى الله عليه وسلم:"], [1158.0, "«لا يزال البلاءُ بالمؤمن والمؤمنة في نفسه وماله وولده حتى يمشيَ على الأرض ما عليه خطيئة»."], [1168.0, "حديثٌ صحيحٌ لغيره. وفي حديث سعد بن أبي وقاص يقول النبي صلى الله عليه وسلم لمّا سُئل:"], [1175.0, "أيُّ الناس أشدُّ بلاءً؟"], [1177.0, "قال: «أشدُّ الناس بلاءً الأنبياء، ثم الأمثلُ فالأمثل، يُبتلى المرءُ على قدر دينه، فإن كان في دينه صلابةٌ شُدِّد عليه، وإن كان في دينه رقّةٌ هُوِّن عليه ـ أو قال: خُفِّف عليه ـ، حتى يمشيَ على الأرض ما عليه ذنب»."]], "tr": [[1152.0, "Nebî ﷺ şöyle buyurur: «Bela, mümin erkek ve mümin kadının canında, malında ve çocuğunda, yeryüzünde üzerinde hiçbir günah olmadan yürüyünceye kadar devam eder.» Sahîh li-gayrihî bir hadistir."], [1168.0, "Sa'd b. Ebî Vakkâs hadisinde de Nebî ﷺ'e \"İnsanların hangisi belaya en çok uğrayandır?\" diye sorulduğunda şöyle buyurur:"], [1175.0, "«İnsanların belaya en çok uğrayanı peygamberlerdir, sonra (derece bakımından) onlara en yakın olanlar, sonra onlara en yakın olanlar. Kişi dini ölçüsünde imtihan edilir. Dininde sağlamlık varsa (belası) şiddetlendirilir; dininde zayıflık varsa hafifletilir —ya da: kolaylaştırılır dedi—; ta ki yeryüzünde üzerinde hiçbir günah olmadan yürüyünceye kadar.»"]]}, {"reader": false, "ar": [[1196.0, "ودخل النبي صلى الله عليه وسلم يومًا من الأيام على أمّ السائب،"], [1202.0, "فقال: «يا أمَّ السائب، ما لكِ تُزَفْزِفين؟» فقالت:"], [1206.5, "«الحُمّى، لا بارك الله فيها»،"], [1209.0, "فقال: «لا تسبّي الحمّى، فإنها تُذهِب ـ تُذهب، هذا هو الشاهد ـ تُذهِب خطايا بني آدم كما يُذهِب الكِيرُ خَبَثَ الحديد» والفضة <span class=\"note\">(Müslim)<\/span>."]], "tr": [[1196.0, "Nebî ﷺ günlerden bir gün Ümmü's-Sâib'in yanına girdi ve şöyle buyurdu:"], [1196.0, "«Ey Ümmü's-Sâib! Neyin var, niçin titriyorsun?» O da «Sıtma; Allah onu bereketsiz kılsın!» dedi."], [1206.5, "Nebî ﷺ şöyle buyurdu: «Sıtmaya sövme; çünkü o giderir —giderir; delil yeri budur— körüğün demirin pasını giderdiği gibi Âdemoğlunun günahlarını giderir.» Ve gümüşün (pasını) <span class=\"note\">(Müslim)<\/span>."]]}, {"reader": false, "ar": [[1219.0, "ودخل النبي صلى الله عليه وسلم على رجلٍ مصابٍ بالحمّى فقال له:"], [1224.1, "«أبشِر، فإنّ الله عز وجل يقول: هي ناري أسلّطها على من أشاء من عبادي، لتكون حظَّه من نار الآخرة»."], [1235.0, "ولمّا دخل النبي صلى الله عليه وسلم على أعرابيٍّ وقد مرض فقال:"], [1242.7, "«طَهورٌ إن شاء الله» ـ وهذا هو الشاهد ـ،"], [1248.0, "فقال: «لا، بل حُمّى تفور، على شيخٍ كبير، تُزيرُه القبور» ـ أو كما قال ـ،"], [1256.0, "فقال صلى الله عليه وسلم:"], [1258.9, "«فنَعَم إذًا» <span class=\"note\">(Buhârî)<\/span>؛ لأنه قال ذلك تسخّطًا على ما نزل به من الألم."]], "tr": [[1219.0, "Nebî ﷺ sıtmaya yakalanmış bir adamın yanına girdi ve ona şöyle buyurdu:"], [1219.0, "«Müjdeler olsun! Çünkü Allah Azze ve Celle şöyle buyuruyor: O benim ateşimdir; onu kullarımdan dilediğime musallat ederim ki âhiret ateşinden onun payı olsun.» Nebî ﷺ hastalanmış bir bedevînin yanına girdiğinde «İnşallah (bu hastalık) temizliktir (günahlardan arındırıcıdır)» buyurdu —delil yeri budur—."], [1242.7, "Bedevî: «Hayır, bilakis yaşlı bir adamın üzerinde kaynayan, onu kabirlere götürecek bir ateştir» dedi —ya da dediği gibi—."], [1256.0, "Bunun üzerine Nebî ﷺ «Öyleyse evet (öyle olsun)» buyurdu <span class=\"note\">(Buhârî)<\/span>."], [1258.9, "Çünkü o bunu, başına gelen acıya öfkelenerek söylemişti."]]}, {"reader": false, "ar": [[1266.0, "فلا ينبغي للإنسان أن يُسيء الظنّ بالله عز وجل،"], [1272.0, "فيجعل ما أصابه من المصائب إنما هو عذابٌ عليه في الدنيا قبل ما ينتظره من عذاب الآخرة؛"], [1279.0, "فإنّ ذلك ليس لأهل الإيمان،"], [1281.5, "ولله الحمد والمنّة. فإمّا مصابٌ تُرفع به درجاتُك،"], [1286.5, "وإمّا مصابٌ تُكفَّر به سيئاتُك."]], "tr": [[1266.0, "İnsanın Allah Azze ve Celle hakkında kötü zanda bulunması, başına gelen musibetleri, kendisini bekleyen âhiret azabından önce dünyada kendisine verilen bir azap sayması yakışmaz."], [1272.0, "Çünkü bu, iman ehli için değildir;"], [1279.0, "hamd ve minnet Allah'adır. (Mümin için) ya derecelerinin yükseltildiği bir musibet vardır ya da günahlarının örtüldüğü bir musibet."]]}, {"reader": false, "ar": [[1292.0, "ويقول النبي صلى الله عليه وسلم:"], [1295.9, "«ما لعبدي المؤمن عندي جزاءٌ إذا قبضتُ صفيَّه من الدنيا فاحتسبه إلا الجنة» <span class=\"note\">(Buhârî)<\/span> ـ رفعُ الدرجات ـ «إلا الجنة»."], [1310.0, "وقال صلى الله عليه وسلم:"], [1312.5, "«ما يصيب المؤمنَ من شوكةٍ فما فوقها إلا رفعه الله عز وجل بها درجةً، أو حطّ عنه بها خطيئة» <span class=\"note\">(Müslim)<\/span>."], [1322.0, "ويقول صلى الله عليه وسلم:"], [1324.5, "«ما يصيب المؤمنَ من نصَبٍ، ولا وصَبٍ، ولا همٍّ، ولا غمٍّ، ولا أذًى، ولا حزنٍ، حتى الشوكة يُشاكها، إلا كفّر الله بها من ذنوبه وخطاياه» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[1292.0, "Nebî ﷺ şöyle buyurur: «(Allah buyurur ki:) Dünyadan sevdiğini aldığımda sabredip ecrini (benden) bekleyen mümin kulumun katımdaki karşılığı ancak cennettir» <span class=\"note\">(Buhârî)<\/span> —derecelerin yükseltilmesi— «ancak cennettir.» Nebî ﷺ şöyle buyurdu:"], [1312.5, "«Mümine bir diken ve daha fazlası isabet etmez ki Allah Azze ve Celle onunla onu bir derece yükseltmesin ya da onunla ondan bir günahı düşürmesin.» <span class=\"note\">(Müslim)<\/span>."], [1322.0, "Nebî ﷺ şöyle buyurur: «Mümine isabet eden hiçbir yorgunluk, hastalık, tasa, keder, eziyet ve hüzün yoktur ki —batan diken bile— Allah onunla onun günahlarından ve hatalarından bir kısmını örtmesin.» <span class=\"note\">(Buhârî, Müslim)<\/span>."]]}, {"reader": false, "ar": [[1337.0, "ويقول صلى الله عليه وسلم:"], [1339.6, "«من قتله بطنُه لم يُعذَّب في قبره» ـ كفّارةً ـ «لم يُعذَّب في قبره»."], [1346.0, "ويقول صلى الله عليه وسلم ـ إذا رأى <span class=\"q\">؟ 22:26<\/span> ـ:"], [1350.7, "«يودّ أهلُ العافية من أهل الدنيا ـ حين يرون أهلَ المصاب يأخذون أجورَهم ـ لو كانت جلودُهم قُرِضت في الدنيا بالمقاريض»،"], [1364.5, "أو كما قال صلى الله عليه وسلم."], [1368.0, "فالمصائب التي يُجريها الله عز وجل على أهل الإيمان لا تخرج عن هذين الأمرين."]], "tr": [[1337.0, "Nebî ﷺ şöyle buyurur: «Karın (hastalığı) sebebiyle ölen kimse kabrinde azap görmez» —kefaret olarak— «kabrinde azap görmez.» Nebî ﷺ —gördüğünde <span class=\"q\">؟<\/span>— şöyle buyurur:"], [1346.0, "«Dünyada âfiyet içinde olanlar, musibet ehlinin ecirlerini aldığını gördüklerinde, dünyada derilerinin makaslarla kesilmiş olmasını temenni ederler.» Ya da Nebî ﷺ'in buyurduğu gibi."], [1368.0, "Allah Azze ve Celle'nin iman ehline verdiği musibetler bu iki şeyin dışına çıkmaz."]]}]}, {"ts": "22:55", "title": "4. Külliye: Kâfirlere isabet eden musibetler âhiret azabına eklenen bir azaptır", "paras": [{"reader": false, "ar": [[1375.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما يجري على الكفّار من المصائب فزيادةُ عذابٍ على عذاب الآخرة.<\/b> كلُّ ما يجري على الكفار من المصائب فزيادةُ عذابٍ على عذاب الآخرة."], [1397.0, "كما قال الله عز وجل:"], [1400.7, "<span class=\"ayah\">﴿سَنُعَذِّبُهُم مَّرَّتَيْنِ ثُمَّ يُرَدُّونَ إِلَىٰ عَذَابٍ عَظِيمٍ﴾<\/span> <span class=\"ref\">[التوبة: ١٠١]<\/span>."]], "tr": [[1375.0, "Külliyelerden biri de şudur: 4."], [1375.0, "külliye: Kâfirlerin başına gelen musibetlerin hepsi, âhiret azabının üzerine eklenen bir azaptır. (Tekrar ediyor.) Nitekim Allah Azze ve Celle şöyle buyurur:"], [1400.7, "<span class=\"ayah\">﴿Onlara iki kez azap edeceğiz; sonra büyük bir azaba döndürüleceklerdir﴾<\/span> [Tevbe 101]."]]}, {"reader": false, "ar": [[1417.0, "ويقول الله عز وجل:"], [1419.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ كَفَرُوا يُنفِقُونَ أَمْوَالَهُمْ لِيَصُدُّوا عَن سَبِيلِ اللَّهِ ۚ فَسَيُنفِقُونَهَا ثُمَّ تَكُونُ عَلَيْهِمْ حَسْرَةً﴾<\/span>،"], [1426.0, "وهذا عذابُ الدنيا وحزنُه وألمُه على ذهاب أموالهم وعدمِ وجود النتائج التي يرجونها،"], [1433.0, "<span class=\"ayah\">﴿ثُمَّ تَكُونُ عَلَيْهِمْ حَسْرَةً ثُمَّ يُغْلَبُونَ﴾<\/span>،"], [1438.0, "وهذا عذابٌ ثانٍ، <span class=\"ayah\">﴿وَالَّذِينَ كَفَرُوا إِلَىٰ جَهَنَّمَ يُحْشَرُونَ﴾<\/span> <span class=\"ref\">[الأنفال: ٣٦]<\/span>."], [1444.0, "فلم يجعل الله عز وجل تلك الحسرةَ والغَلَبَ عليهم في الدنيا من جملة المكفِّرات ولا المخفِّفات لعذاب الآخرة."]], "tr": [[1417.0, "Allah Azze ve Celle şöyle buyurur:"], [1419.0, "<span class=\"ayah\">﴿Kâfirler, mallarını Allah yolundan alıkoymak için harcarlar. Onu harcayacaklar, sonra bu onlara bir hasret (pişmanlık) olacak﴾<\/span>."], [1419.0, "Bu, dünya azabıdır; mallarının gitmesinden ve umdukları neticelerin gerçekleşmemesinden dolayı duydukları hüzün ve acıdır."], [1433.0, "<span class=\"ayah\">﴿Sonra bu onlara bir hasret olacak, sonra yenilecekler﴾<\/span>;"], [1438.0, "bu da ikinci bir azaptır."], [1438.0, "<span class=\"ayah\">﴿Kâfirler cehenneme toplanacaklardır﴾<\/span> [Enfâl 36]."], [1438.0, "Allah Azze ve Celle, dünyada onlara isabet eden o hasreti ve yenilgiyi, âhiret azabını örten ya da hafifleten şeylerden kılmamıştır."]]}, {"reader": false, "ar": [[1452.0, "وقال الله عز وجل:"], [1454.5, "<span class=\"ayah\">﴿وَلَنُذِيقَنَّهُم مِّنَ الْعَذَابِ الْأَدْنَىٰ دُونَ الْعَذَابِ الْأَكْبَرِ لَعَلَّهُمْ يَرْجِعُونَ﴾<\/span> <span class=\"ref\">[السجدة: ٢١]<\/span>."], [1460.0, "ويقول الله عز وجل:"], [1462.4, "<span class=\"ayah\">﴿الَّذِينَ كَفَرُوا وَصَدُّوا عَن سَبِيلِ اللَّهِ زِدْنَاهُمْ عَذَابًا فَوْقَ الْعَذَابِ بِمَا كَانُوا يُفْسِدُونَ﴾<\/span> <span class=\"ref\">[النحل: ٨٨]<\/span>."], [1470.0, "ويقول الله عز وجل:"], [1472.0, "<span class=\"ayah\">﴿وَإِنَّ لِلَّذِينَ ظَلَمُوا عَذَابًا دُونَ ذَٰلِكَ﴾<\/span> <span class=\"ref\">[الطور: ٤٧]<\/span>."], [1475.0, "ويقول الله عز وجل:"], [1477.9, "<span class=\"ayah\">﴿لَهُ فِي الدُّنْيَا خِزْيٌ ۖ وَنُذِيقُهُ يَوْمَ الْقِيَامَةِ عَذَابَ الْحَرِيقِ﴾<\/span> <span class=\"ref\">[الحج: ٩]<\/span>."], [1486.0, "وهذه ـ والله ـ هي الخسارةُ كلُّها."]], "tr": [[1452.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1454.5, "<span class=\"ayah\">﴿Andolsun, belki dönerler diye onlara en büyük azaptan önce yakın azaptan tattıracağız﴾<\/span> [Secde 21]."], [1454.5, "Allah Azze ve Celle şöyle buyurur:"], [1462.4, "<span class=\"ayah\">﴿İnkâr edip Allah yolundan alıkoyanlara, bozgunculuk yapmalarına karşılık azap üstüne azap ekleriz﴾<\/span> [Nahl 88]."], [1462.4, "Allah Azze ve Celle şöyle buyurur:"], [1470.0, "<span class=\"ayah\">﴿Zulmedenler için bundan başka (daha önce) bir azap vardır﴾<\/span> [Tûr 47]."], [1472.0, "Allah Azze ve Celle şöyle buyurur:"], [1477.9, "<span class=\"ayah\">﴿Ona dünyada bir rezillik vardır; kıyamet günü de ona yakıcı azabı tattıracağız﴾<\/span> [Hac 9]. Vallahi, hüsranın tamamı budur."]]}, {"reader": false, "ar": [[1489.0, "فما يصيب الكفارَ من مصيبة الموت،"], [1492.3, "والآلام، والأمراض، والأسقام، والأوبئة،"], [1494.5, "والطواعين، والزلازل، والبراكين، والهزيمة في الحروب،"], [1498.8, "والفيضانات، وكافّة المصائب، لا تُعتبر كفّارةً لأحدٍ منهم ولا رفعةً لدرجاته،"], [1507.0, "وإنما لزيادة العذاب عليه مع ما ينتظرهم من عذاب الآخرة،"], [1512.0, "إن لم يكتب الله عز وجل له الإسلامَ أو الإيمانَ قبل أن يموت. والله أعلم."]], "tr": [[1489.0, "Kâfirlere isabet eden ölüm musibeti, acılar, hastalıklar, dertler, salgınlar, vebalar, depremler, yanardağlar, savaşlardaki yenilgi, seller ve bütün musibetler;"], [1498.8, "onlardan hiçbiri için kefaret ya da derecesinin yükseltilmesi sayılmaz."], [1498.8, "Bunlar ancak, onları bekleyen âhiret azabıyla birlikte ona azabın artırılması içindir;"], [1507.0, "eğer Allah Azze ve Celle ölmeden önce onun için İslâm'ı ya da imanı yazmazsa. Allah en iyisini bilir."]]}]}, {"ts": "25:18", "title": "5. Külliye: Kaderin mümin hakkında yürüttüğü her şey tamamen hayırdır", "paras": [{"reader": false, "ar": [[1518.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما يجري به القدرُ على المؤمن فخيرٌ كلُّه.<\/b> كلُّ ما يجري به القدر على المؤمن فخيرٌ كلُّه."], [1540.0, "أقول: ودليلُها قولُ النبي صلى الله عليه وسلم:"], [1546.0, "«عجبًا لأمر المؤمن! إنّ أمره كلَّه له خير، وليس ذلك لأحدٍ إلا للمؤمن؛ فإن أصابته سرّاءُ فشكر كان خيرًا له، وإن أصابته ضرّاءُ فصبر كان خيرًا له» <span class=\"note\">(Müslim)<\/span>."]], "tr": [[1518.0, "Külliyelerden biri de şudur: 5."], [1518.0, "külliye: Kaderin mümin hakkında yürüttüğü her şey tamamen hayırdır. (Tekrar ediyor.) Derim ki:"], [1518.0, "Bunun delili Nebî ﷺ'in şu sözüdür:"], [1540.0, "«Müminin işi ne şaşılacak şeydir! Onun her işi kendisi için hayırdır. Bu, müminden başka kimseye nasip olmaz. Ona bir sevinç isabet ederse şükreder; bu onun için hayır olur. Ona bir sıkıntı isabet ederse sabreder; bu da onun için hayır olur.» <span class=\"note\">(Müslim)<\/span>."]]}, {"reader": false, "ar": [[1562.0, "فجميعُ ما يُجريه الله عز وجل على المؤمن فإنما هو خيرٌ له،"], [1567.7, "سواءٌ باعتبار بدايات المصيبة،"], [1569.4, "أو في أثنائها، أو بعد انقشاعها."], [1572.0, "فكم من مؤمنٍ كان غافلًا فانتبه بمصيبة،"], [1577.0, "أو ناسيًا فتذكّر بمصيبة،"], [1579.0, "أو عاصيًا فتاب بمصيبة،"], [1583.0, "أو معرضًا عن الله عز وجل ثم عاد <span class=\"q\">؟ 26:23<\/span> إلى قوافل التائبين إلى الله عز وجل بمصيبة."]], "tr": [[1562.0, "Allah Azze ve Celle'nin mümine verdiği her şey onun için hayırdır;"], [1562.0, "ister musibetin başlangıcı itibarıyla, ister ortasında, ister dağılıp gitmesinden sonra."], [1569.4, "Nice mümin gafilken bir musibetle uyanmış, unutmuşken bir musibetle hatırlamış, isyankârken bir musibetle tevbe etmiş ya da Allah Azze ve Celle'den yüz çevirmişken bir musibetle Allah Azze ve Celle'ye tevbe edenlerin kafilelerine dönmüştür <span class=\"q\">؟<\/span>."]]}, {"reader": false, "ar": [[1591.0, "وكم من إنسانٍ يرتفع ـ وكم من مؤمنٍ تُرفع له الدرجاتُ يوم القيامة ـ بسبب صبره على مصيبةٍ،"], [1601.0, "ما لو عُمِّر عُمُرَ نوحٍ يعمل ويعبد الله لم يصِلْها."], [1606.0, "وكما في القاعدة عند أهل السنة والجماعة:"], [1609.0, "«إنّ العبد ليبلغ من درجات الجنة بصبره على مصيبته ما لا يستطيعه بعمله»،"], [1615.0, "إنّ العبد ليبلغ من منازل الجنة العليا ومراتبها بصبره على مصيبته ما لا يستطيعه بعمله."], [1629.0, "فعلى المؤمن أن يقابل ذلك بأكمل الصبر والرضا واحتساب الأجر عند الله عز وجل."]], "tr": [[1591.0, "Nice insan yükselir —nice müminin dereceleri kıyamet günü— bir musibete sabretmesi sebebiyle, Nûh'un ömrü kadar yaşayıp amel etse ve Allah'a ibadet etse ulaşamayacağı derecelere yükseltilir."], [1601.0, "Ehl-i Sünnet ve'l-Cemaat'in şu kaidesinde olduğu gibi:"], [1606.0, "\"Kul, musibetine sabretmesiyle cennet derecelerinden ameliyle güç yetiremeyeceği yere ulaşır.\" Kul, musibetine sabretmesiyle cennetin yüksek makamlarından ve mertebelerinden ameliyle güç yetiremeyeceği yere ulaşır."], [1615.0, "Mümine düşen, bunu sabrın, rızanın ve ecri Allah Azze ve Celle katında ummanın en kâmiliyle karşılamaktır."]]}]}, {"ts": "27:16", "title": "6. Külliye: Musibetlerde sabır vâcip; hamd, rıza ve şükür mendubtur", "paras": [{"reader": false, "ar": [[1636.0, "ومن الكلّيّات أيضًا: كلُّ المصائب واجبُها الصبر،"], [1640.8, "ومندوبُها الحمدُ والرضا والشكر. <span class=\"note\">(يكررها)<\/span>."], [1656.0, "أقول وبالله التوفيق: وقد أجمع أهلُ الإسلام على وجوب الصبر عند المصائب،"], [1670.0, "حكى ذلك الإجماعَ النوويُّ وغيرُه ممّن قبله أو بعده من أهل العلم."], [1674.0, "وأمّا الرضا ففيه خلافٌ بين أهل العلم،"], [1678.8, "والأصحّ أنه من باب المندوبات المستحبّات،"], [1683.7, "وليس من باب الواجبات المتحتّمات."]], "tr": [[1636.0, "Külliyelerden biri de şudur: 6."], [1636.0, "külliye: Bütün musibetlerde vâcip olan sabırdır;"], [1640.8, "mendub olan ise hamd, rıza ve şükürdür. (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [1656.0, "İslâm ehli, musibetler anında sabrın vâcip olduğu üzerinde icmâ etmiştir."], [1670.0, "Bu icmâı Nevevî ve ondan önceki ya da sonraki başka ilim ehli nakletmiştir."], [1670.0, "Rızaya gelince, onda ilim ehli arasında ihtilaf vardır;"], [1678.8, "en doğrusu, onun mendub ve müstehap şeyler kabilinden olduğu, kesin vâcipler kabilinden olmadığıdır."]]}, {"reader": false, "ar": [[1687.0, "فإن قلتَ: وما الفرق بين الصبر والرضا؟"], [1690.0, "أقول: إذا أُطلق الصبرُ وحده دخل معه الرضا،"], [1695.0, "وإذا أُطلق الرضا وحده دخل معه الصبر،"], [1699.0, "ولكن إذا قيل: «الصبر والرضا» فيكون الصبرُ عملَ الظاهر ـ أي واجبَ الظاهر ـ،"], [1706.0, "بمعنى أن يحبس الإنسانُ جوارحَه ولسانه عن قول ما لا يليق أو فعل ما لا يليق:"], [1713.0, "من شقّ جيبٍ، أو لطم خدٍّ،"], [1715.5, "أو نتف شعرٍ، أو صراخٍ ونياحة."], [1718.0, "وهذا واجب، لأنه أمرٌ ظاهريٌّ يستطيع الإنسان أن يتحكّم فيه."]], "tr": [[1687.0, "\"Sabır ile rıza arasındaki fark nedir?\" dersen, derim ki:"], [1690.0, "Sabır tek başına mutlak olarak söylendiğinde rıza da ona dahil olur;"], [1695.0, "rıza tek başına mutlak olarak söylendiğinde sabır da ona dahil olur."], [1699.0, "Fakat \"sabır ve rıza\" denildiğinde, sabır zâhirin amelidir —yani zâhirin vâcibidir—."], [1706.0, "Bunun anlamı, insanın azalarını ve dilini yakışmayan bir söz söylemekten ya da yakışmayan bir iş yapmaktan alıkoymasıdır:"], [1713.0, "Yaka yırtmak, yanağa vurmak, saç yolmak ya da çığlık atıp ağıt yakmak gibi."], [1718.0, "Bu vâciptir; çünkü insanın kontrol edebileceği zâhirî bir iştir."]]}, {"reader": false, "ar": [[1728.0, "وأمّا الرضا فإنه عملٌ قلبي،"], [1731.2, "وأعمالُ القلوب قد لا يستطيعها الإنسان؛"], [1735.0, "فلو كان الرضا بالمصائب من الواجبات لكان ذلك من تكليف ما لا يُطاق،"], [1742.0, "إذ قد لا يستطيع الإنسانُ أن يجد في قلبه الرضا على ما نزل عليه من المصيبة،"], [1748.0, "لكنه يستطيع أن لا يتصرّف بجوارحه،"], [1751.6, "وأن لا ينطق بلسانه الشيءَ الذي يُغضب الله عز وجل أو يتنافى مع وجوب الصبر."], [1758.7, "فأعمالُ الظاهر... فالصبرُ لأنه من أعمال الظاهر صار واجبًا،"], [1763.0, "والرضا لأنه من أعمال القلوب صار مستحبًّا مندوبًا."]], "tr": [[1728.0, "Rıza ise kalbî bir ameldir;"], [1728.0, "kalplerin amellerine ise insanın gücü yetmeyebilir."], [1731.2, "Eğer musibetlere rıza vâciplerden olsaydı, bu, güç yetirilemeyecek şeyle mükellef tutmak olurdu."], [1742.0, "Çünkü insan başına gelen musibete kalbinde rıza bulamayabilir;"], [1742.0, "fakat azalarıyla (yakışmayan bir) davranışta bulunmamaya ve Allah Azze ve Celle'yi gazaplandıran ya da sabrın vâcip oluşuna aykırı olan şeyi diliyle söylememeye gücü yeter."], [1758.7, "Zâhirin amelleri... Sabır zâhirin amellerinden olduğu için vâcip oldu;"], [1758.7, "rıza da kalplerin amellerinden olduğu için müstehap ve mendub oldu."]]}, {"reader": false, "ar": [[1768.0, "وأعظمُ من الرضا أن يحمد اللهَ عز وجل وأن يشكره على ما أجراه عليه."], [1774.0, "يقول الله عز وجل:"], [1777.0, "«ولنبلونّكم حتى نعلم الصابرين منكم»،"], [1781.0, "«حتى نعلم الصابرين منكم»..."], [1783.0, "<span class=\"ayah\">﴿حَتَّىٰ نَعْلَمَ الْمُجَاهِدِينَ مِنكُمْ وَالصَّابِرِينَ وَنَبْلُوَ أَخْبَارَكُمْ﴾<\/span> <span class=\"ref\">[محمد: ٣١]<\/span> <span class=\"note\">(Şeyh önce «الصابرين منكم» diyor, sonra ayeti doğru okuyor)<\/span>."], [1789.0, "ويقول الله عز وجل:"], [1791.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا وَرَابِطُوا وَاتَّقُوا اللَّهَ لَعَلَّكُمْ تُفْلِحُونَ﴾<\/span> <span class=\"ref\">[آل عمران: ٢٠٠]<\/span>."]], "tr": [[1768.0, "Rızadan daha büyüğü, kendisine verdiği şeyden dolayı Allah Azze ve Celle'ye hamd etmesi ve O'na şükretmesidir."], [1777.0, "Allah Azze ve Celle şöyle buyurur:"], [1777.0, "\"Andolsun sizi deneyeceğiz ki içinizden sabredenleri bilelim\", \"içinizden sabredenleri bilelim\"..."], [1783.0, "<span class=\"ayah\">﴿İçinizden cihad edenleri ve sabredenleri belirleyinceye ve haberlerinizi ortaya koyuncaya kadar﴾<\/span> [Muhammed 31] <span class=\"note\">(Şeyh önce \"içinizden sabredenleri\" diyor, sonra ayeti doğru okuyor)<\/span>."], [1791.0, "Allah Azze ve Celle şöyle buyurur:"], [1791.0, "<span class=\"ayah\">﴿Ey iman edenler! Sabredin, sabırda yarışın, (nöbette) bekleşin ve Allah'tan sakının ki kurtuluşa eresiniz﴾<\/span> [Âl-i İmrân 200]."]]}, {"reader": false, "ar": [[1800.0, "<span class=\"ayah\">﴿فَاصْبِرْ كَمَا صَبَرَ أُولُو الْعَزْمِ مِنَ الرُّسُلِ﴾<\/span> <span class=\"ref\">[الأحقاف: ٣٥]<\/span>،"], [1804.1, "ويقول الله عز وجل:"], [1806.4, "<span class=\"ayah\">﴿وَلِرَبِّكَ فَاصْبِرْ﴾<\/span> <span class=\"ref\">[المدثر: ٧]<\/span>، ويقول الله تبارك وتعالى:"], [1810.0, "<span class=\"ayah\">﴿وَاصْبِرْ عَلَىٰ مَا أَصَابَكَ﴾<\/span> <span class=\"ref\">[لقمان: ١٧]<\/span>،"], [1812.3, "ويقول الله عز وجل:"], [1814.7, "<span class=\"ayah\">﴿فَاصْبِرْ ۖ إِنَّ الْعَاقِبَةَ لِلْمُتَّقِينَ﴾<\/span> <span class=\"ref\">[هود: ٤٩]<\/span>،"], [1817.0, "ويقول الله عز وجل:"], [1819.0, "<span class=\"ayah\">﴿فَاصْبِرْ عَلَىٰ مَا يَقُولُونَ﴾<\/span> <span class=\"ref\">[طه: ١٣٠]<\/span>،"], [1821.0, "ويقول الله عز وجل:"], [1823.2, "<span class=\"ayah\">﴿فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ﴾<\/span> <span class=\"ref\">[الروم: ٦٠]<\/span>،"], [1826.0, "ويقول الله عز وجل:"], [1828.3, "<span class=\"ayah\">﴿فَاصْبِرْ لِحُكْمِ رَبِّكَ﴾<\/span> <span class=\"ref\">[القلم: ٤٨]<\/span>، ويقول الله عز وجل: <span class=\"ayah\">﴿فَاصْبِرْ صَبْرًا جَمِيلًا﴾<\/span> <span class=\"ref\">[المعارج: ٥]<\/span>."]], "tr": [[1800.0, "<span class=\"ayah\">﴿Resullerden azim sahiplerinin sabrettiği gibi sabret﴾<\/span> [Ahkâf 35]."], [1800.0, "Allah Azze ve Celle şöyle buyurur:"], [1804.1, "<span class=\"ayah\">﴿Rabbin için sabret﴾<\/span> [Müddessir 7]."], [1806.4, "Allah Tebâreke ve Teâlâ şöyle buyurur:"], [1806.4, "<span class=\"ayah\">﴿Başına gelene sabret﴾<\/span> [Lokmân 17]."], [1810.0, "Allah Azze ve Celle şöyle buyurur:"], [1812.3, "<span class=\"ayah\">﴿Sabret; şüphesiz (güzel) son takva sahiplerinindir﴾<\/span> [Hûd 49]."], [1814.7, "Allah Azze ve Celle şöyle buyurur:"], [1819.0, "<span class=\"ayah\">﴿Onların söylediklerine sabret﴾<\/span> [Tâhâ 130]."], [1819.0, "Allah Azze ve Celle şöyle buyurur:"], [1823.2, "<span class=\"ayah\">﴿Sabret; şüphesiz Allah'ın vaadi haktır﴾<\/span> [Rûm 60]."], [1823.2, "Allah Azze ve Celle şöyle buyurur:"], [1828.3, "<span class=\"ayah\">﴿Rabbinin hükmüne sabret﴾<\/span> [Kalem 48]."], [1828.3, "Allah Azze ve Celle şöyle buyurur:"], [1828.3, "<span class=\"ayah\">﴿Güzel bir sabırla sabret﴾<\/span> [Meâric 5]."]]}, {"reader": false, "ar": [[1834.0, "وكلُّ هذه الأوامر تفيد أنّ الصبر من الواجبات،"], [1838.0, "لكن لا أعلم دليلًا واحدًا يدلّ على وجوب الرضا،"], [1844.0, "فيبقى الرضا من الأمور المستحبّة عند نزول المصائب."]], "tr": [[1834.0, "Bütün bu emirler sabrın vâciplerden olduğunu ifade eder."], [1834.0, "Fakat rızanın vâcip olduğunu gösteren tek bir delil bilmiyorum."], [1838.0, "Dolayısıyla rıza, musibetler indiğinde müstehap olan şeylerden olarak kalır."]]}]}, {"ts": "30:54", "title": "7. Külliye: Vâcip olan sabra aykırı olmayan her şey musibet anında caizdir", "paras": [{"reader": false, "ar": [[1854.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما لا يتنافى مع واجب الصبر فجائزٌ عند المصيبة.<\/b> كلُّ ما لا يتنافى مع واجب الصبر فلا بأس به عند المصيبة ـ أو عند المصائب ـ."], [1875.0, "أقول وبالله التوفيق: إنّ من رحمة الله عز وجل أنّ هناك أمورًا فطريةً جِبِلّيّةً طبعيّةً لا بدّ أن تصيب الإنسانَ لأنه بشر،"], [1896.0, "فجعل الله عز وجل ما يصيب الإنسانَ من الأمور الفطرية الجبلّيّة الطبعيّة من الأمور المباحة عند نزول المصائب،"], [1907.0, "ما لم يكن فيها شيءٌ من الغلوّ أو التجاوز."]], "tr": [[1854.0, "Külliyelerden biri de şudur: 7."], [1854.0, "külliye: Vâcip olan sabra aykırı olmayan her şey musibet anında caizdir. Vâcip olan sabra aykırı olmayan her şeyde musibet —ya da musibetler— anında bir sakınca yoktur."], [1854.0, "Tevfik Allah'tandır, derim ki: Allah Azze ve Celle'nin rahmetindendir ki, insan beşer olduğu için ona mutlaka isabet edecek fıtrî, yaratılıştan gelen ve tabiî bazı şeyler vardır."], [1896.0, "Allah Azze ve Celle, insana isabet eden bu fıtrî, yaratılıştan gelen ve tabiî şeyleri, içlerinde aşırılık ya da haddi aşma olmadığı sürece, musibetler indiğinde mubah olan şeylerden kılmıştır."]]}, {"reader": false, "ar": [[1912.0, "فمن ذلك دمعُ العين عند نزول المصيبة،"], [1915.2, "فإنه لا بأس به،"], [1917.0, "بل البكاءُ عند نزول المصيبة أكملُ حالًا من الضحك أو إظهار الفرح والسرور؛"], [1925.0, "لأنّ أكمل أحوال التعبّد هي حالُ النبي صلى الله عليه وسلم،"], [1929.0, "فله حالةٌ تعبّديةٌ عند نزول القدر الملائم،"], [1934.0, "وحالةٌ تعبّديةٌ عند نزول القدر المنافي لما يريده الإنسان."]], "tr": [[1912.0, "Bunlardan biri musibet indiğinde gözün yaşarmasıdır;"], [1915.2, "bunda bir sakınca yoktur. Hatta musibet indiğinde ağlamak, gülmekten ya da sevinç ve neşe göstermekten daha kâmil bir hâldir."], [1925.0, "Çünkü ibadet hâllerinin en kâmili Nebî ﷺ'in hâlidir."], [1925.0, "Onun (insanın isteğine) uygun kader indiğinde bir ibadet hâli, insanın istediğine aykırı kader indiğinde de bir ibadet hâli vardır."]]}, {"reader": false, "ar": [[1942.0, "وقد كان النبي صلى الله عليه وسلم عند نزول الأقدار والمصائب المؤلمة كان يتعامل معها بالبكاء:"], [1949.0, "لمّا رُفع له ابنُه إبراهيم ونفسُه تَقَعْقَع،"], [1953.0, "ذرفت عينُ رسول الله صلى الله عليه وسلم،"], [1957.0, "حتى سأله أحدُ الصحابة:"], [1958.5, "«وأنت يا رسول الله؟» قال:"], [1960.6, "«إنها رحمةٌ جعلها الله في قلوب عباده، وإنما يرحم الله من عباده الرحماء»."]], "tr": [[1942.0, "Nebî ﷺ acı veren kaderler ve musibetler indiğinde onlara ağlayarak karşılık verirdi."], [1942.0, "Oğlu İbrâhîm, ruhu sarsılarak çıkarken ona uzatıldığında Resûlullah ﷺ'in gözünden yaşlar aktı."], [1949.0, "Hatta sahâbîlerden biri ona \"Sen de mi (ağlıyorsun), ey Allah'ın Resûlü?\" diye sordu."], [1958.5, "Buyurdu ki: «Bu, Allah'ın kullarının kalplerine koyduğu bir rahmettir. Allah kullarından ancak merhametli olanlara merhamet eder.»"]]}, {"reader": false, "ar": [[1968.0, "ولمّا دخل على سعد بن عُبادة وجده في غَشْيةٍ فقال:"], [1973.4, "«قضى؟» قالوا: «لا»، فبكى رسول الله صلى الله عليه وسلم،"], [1978.0, "فلمّا رأى القومُ بكاءه بكَوا لبكائه،"], [1982.0, "فقال النبي صلى الله عليه وسلم:"], [1985.8, "«ألا تعلمون؟ إنّ الله لا يعذّب بدمع العين» ـ فهو أمرٌ جائز لأنه لا يتنافى مع الصبر ـ «ولا بحزن القلب» ـ فهو أمرٌ جائز لا يستطيع الإنسان أن يتخلّص منه ـ «ولكن يعذّب بهذا ـ وأشار إلى لسانه ـ أو يرحم» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[1968.0, "Sa'd b. Ubâde'nin yanına girdiğinde onu baygın hâlde buldu ve «Vefat etti mi?» dedi."], [1973.4, "«Hayır» dediler. Resûlullah ﷺ ağladı."], [1973.4, "Topluluk onun ağladığını görünce onun ağlamasına ağladılar."], [1982.0, "Nebî ﷺ şöyle buyurdu: «Bilmiyor musunuz? Allah gözün yaşı sebebiyle azap etmez» —bu caiz bir şeydir, çünkü sabra aykırı değildir— «kalbin hüznü sebebiyle de (azap etmez)» —bu caiz bir şeydir;"], [1985.8, "insan ondan kurtulamaz— «fakat şununla —ve diline işaret etti— azap eder ya da merhamet eder.» <span class=\"note\">(Buhârî, Müslim)<\/span>."]]}, {"reader": false, "ar": [[2006.0, "فالأمور التي تجري على الإنسان حالَ نزول المصيبة إذا كانت لا تتنافى مع واجب الصبر فإنها لا بأس بها:"], [2017.0, "فالبكاءُ لا بأس به،"], [2018.6, "والحزنُ لا بأس به،"], [2020.2, "وضيقُ الصدر لا بأس به،"], [2022.7, "ووجودُ الهمّ بسبب المصيبة في القلب لا بأس به."], [2027.0, "بل إنّ الشكوى لله عز وجل هي عينُ الإيمان بالقضاء والقدر؛"], [2038.0, "فالشكوى لله عز وجل أمرٌ جائز لا يتنافى مع الصبر."]], "tr": [[2006.0, "Musibet indiği sırada insanın başına gelen şeyler, vâcip olan sabra aykırı değilse onlarda bir sakınca yoktur:"], [2006.0, "Ağlamakta sakınca yoktur, hüzünde sakınca yoktur, göğüs daralmasında sakınca yoktur, musibet sebebiyle kalpte tasa bulunmasında sakınca yoktur."], [2022.7, "Hatta Allah Azze ve Celle'ye şikâyet etmek (hâlini arz etmek), kaza ve kadere imanın ta kendisidir."], [2027.0, "Allah Azze ve Celle'ye şikâyet caiz bir şeydir, sabra aykırı değildir."]]}, {"reader": false, "ar": [[2043.0, "فلمّا أُصيب يعقوبُ بفقد يوسف وأخيه قال:"], [2047.3, "<span class=\"ayah\">﴿إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ﴾<\/span> <span class=\"ref\">[يوسف: ٨٦]<\/span>."], [2051.0, "وهذا أيوبُ يشكو مرضَه إلى ربّه عز وجل:"], [2055.5, "«وأيوبَ إذ نادى ربَّه... واذكر عبدنا أيوبَ إذ نادى ربّه أني مسّني الضرّ» ـ لا لا،"], [2063.8, "هذه آيةٌ ثانية ـ <span class=\"ayah\">﴿أَنِّي مَسَّنِيَ الضُّرُّ وَأَنتَ أَرْحَمُ الرَّاحِمِينَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٨٣]<\/span> <span class=\"note\">(Şeyh Sâd 41'in başını Enbiyâ 83 ile karıştırıp düzeltiyor)<\/span>."], [2070.0, "هذا شكوى لا بأس بها."], [2071.0, "فإذًا الشكوى لله عز وجل لا تتنافى مع واجب الصبر."]], "tr": [[2043.0, "Ya'kûb, Yûsuf'u ve kardeşini kaybetmekle musibete uğradığında şöyle dedi:"], [2047.3, "<span class=\"ayah\">﴿Ben tasamı ve hüznümü ancak Allah'a şikâyet ediyorum﴾<\/span> [Yûsuf 86]."], [2051.0, "İşte Eyyûb de hastalığını Rabbine şikâyet ediyor:"], [2055.5, "\"Eyyûb'ü de (an); hani Rabbine seslenmişti..."], [2055.5, "Kulumuz Eyyûb'ü de an; hani Rabbine:"], [2055.5, "Bana sıkıntı dokundu, diye seslenmişti\" —hayır hayır, bu başka bir ayet— <span class=\"ayah\">﴿Şüphesiz bana sıkıntı dokundu; sen merhametlilerin en merhametlisisin﴾<\/span> [Enbiyâ 83] <span class=\"note\">(Şeyh Sâd 41'in başını Enbiyâ 83 ile karıştırıp düzeltiyor)<\/span>."], [2063.8, "Bu, sakıncası olmayan bir şikâyettir."], [2070.0, "Demek ki Allah Azze ve Celle'ye şikâyet, vâcip olan sabra aykırı değildir."]]}, {"reader": false, "ar": [[2076.0, "وكذلك الاجتماعُ عند أهل المصيبة ـ من باب تخفيف المصاب عليهم ـ لا يتنافى مع واجب الصبر."], [2086.0, "فإن قلتَ: وما حكمُ إغلاق الحوانيت أو تعطيل المعاش عند نزول المصائب؟"], [2099.0, "أقول: هذا من جملة الأمور التي منعها أهلُ العلم،"], [2104.0, "لأنّ ذلك ينافي واجبَ الصبر."]], "tr": [[2076.0, "Aynı şekilde musibet ehlinin yanında —onlara musibeti hafifletmek için— toplanmak da vâcip olan sabra aykırı değildir."], [2086.0, "\"Musibetler indiğinde dükkânları kapatmanın ya da geçimi (işleri) durdurmanın hükmü nedir?\" dersen, derim ki:"], [2099.0, "Bu, ilim ehlinin yasakladığı şeylerdendir;"], [2099.0, "çünkü bu, vâcip olan sabra aykırıdır."]]}, {"reader": false, "ar": [[2108.0, "فكونُ الإنسان يُغلق حانوتَه الإغلاقَ الكامل،"], [2113.0, "أو يقطع أسبابَ معيشته القطعَ الكامل،"], [2116.0, "فهذا دليلٌ على أنه متسخّطٌ على قضاء الله عز وجل وقدره."], [2123.0, "وكذلك أيضًا تخصيصُ المصائب بلباسٍ معيّن،"], [2129.0, "كلُبس السواد دائمًا عند المصيبة،"], [2133.0, "فإنّ ذلك غيرُ معروفٍ لا عن النبي صلى الله عليه وسلم،"], [2137.0, "ولا عن أحدٍ من أصحابه،"], [2141.0, "ولا عن أحدٍ من سلف الأمة وأئمّتها،"], [2143.0, "فهو أقربُ ما يكون إلى التسخّط."]], "tr": [[2108.0, "İnsanın dükkânını tamamen kapatması ya da geçim sebeplerini tamamen kesmesi, onun Allah Azze ve Celle'nin kaza ve kaderine öfkelendiğinin delilidir."], [2116.0, "Aynı şekilde musibetlere belirli bir elbiseyi tahsis etmek de —musibet anında hep siyah giymek gibi—;"], [2133.0, "bu ne Nebî ﷺ'den, ne ashâbından herhangi birinden, ne de ümmetin selefinden ve imamlarından herhangi birinden bilinir."], [2141.0, "Dolayısıyla tesahhuta en yakın olan şeydir."]]}, {"reader": false, "ar": [[2147.0, "فإن قلتَ: وما حكمُ الأنين عند المصائب؟"], [2151.0, "الجواب: اختلف العلماء في ذلك،"], [2158.0, "والقول الصحيح أنّ خلافهم خلافٌ لفظي؛"], [2161.0, "وذلك لأنّ الأنين عند المصيبة ينقسم إلى قسمين:"], [2166.0, "إلى أنين التضجّر والتسخّط،"], [2169.0, "فهذا محرّمٌ لأنه يتنافى مع الصبر؛"], [2174.0, "فإذا كان أنينُ الإنسان عند المصيبة هو أنينَ التسخّط على ما نزل والتضجّرِ من قضاء الله فإنه محرّم."], [2185.0, "وإذا كان أنينَ الاستراحة والتفريج فإنه جائزٌ لا بأس به ولا حرج فيه،"], [2194.0, "وهذا مما لا يتنافى مع الصبر في نوعه الثاني. والله أعلم."]], "tr": [[2147.0, "\"Musibetler anında inlemenin hükmü nedir?\" dersen, cevap:"], [2151.0, "Âlimler bu konuda ihtilaf etmişlerdir;"], [2158.0, "doğru olan görüş, onların ihtilafının lafzî bir ihtilaf olduğudur."], [2161.0, "Çünkü musibet anında inleme iki kısma ayrılır:"], [2166.0, "Bıkkınlık ve tesahhut inlemesi; bu haramdır, çünkü sabra aykırıdır."], [2174.0, "İnsanın musibet anındaki inlemesi, inen şeye öfkelenme ve Allah'ın kazasından bıkkınlık inlemesi ise haramdır."], [2174.0, "Eğer rahatlama ve ferahlama inlemesi ise caizdir;"], [2185.0, "onda bir sakınca ve bir vebal yoktur."], [2185.0, "İkinci türüyle bu, sabra aykırı olmayan şeylerdendir. Allah en iyisini bilir."]]}]}, {"ts": "36:38", "title": "8. Külliye: Tesahhut içermeyen ve maksadı sahih olan şikâyette sakınca yoktur", "paras": [{"reader": false, "ar": [[2198.0, "ومن الكلّيّات أيضًا: <b>كلُّ شكوى لا تتضمّن تسخّطًا وكان مقصودُها صحيحًا فلا بأس بها.<\/b> <span class=\"note\">(يكررها)<\/span>."], [2230.0, "ولذلك قال ابن تيمية رحمه الله تعالى:"], [2236.0, "«لكن ليست كلُّ شكوى إلى المخلوق محرّمة» ـ ولكن ليست كل شكوى إلى المخلوق محرّمة ـ «بل إن كانت لغرضٍ صحيح» ـ هذا الشرط الأول ـ «كالاستعانة به على زوال الضرر فلا بأس بها، وأمّا الشكوى دون حاجة» ـ أي دون غرضٍ صحيح ـ «فمكروهة، وقد تصل إلى التحريم إن اقترن بها تسخّط»."]], "tr": [[2198.0, "Külliyelerden biri de şudur: 8."], [2198.0, "külliye: Tesahhut içermeyen ve maksadı sahih olan her şikâyette bir sakınca yoktur. (Tekrar ediyor.) Bu yüzden İbn Teymiyye (rahimehullahu teâlâ) şöyle demiştir:"], [2236.0, "\"Fakat mahlûka yapılan her şikâyet haram değildir\" —fakat mahlûka yapılan her şikâyet haram değildir— \"bilakis sahih bir amaç için ise\" —bu birinci şarttır— \"zararın giderilmesi için ondan yardım istemek gibi, bunda bir sakınca yoktur."], [2236.0, "İhtiyaç olmadan yapılan şikâyet ise\" —yani sahih bir amaç olmadan— \"mekruhtur;"], [2236.0, "eğer ona tesahhut eşlik ederse haram derecesine varabilir.\""]]}, {"reader": false, "ar": [[2264.0, "فأفاد كلامُه هذا أنّ الشكوى إذا كانت لمقصودٍ صحيح،"], [2270.0, "وكانت خاليةً من عبارات التسخّط أو أفعال التضجّر،"], [2277.0, "فإنه لا بأس بها ولا حرج."], [2279.0, "ولذلك لمّا دخل النبي صلى الله عليه وسلم على عائشة وهي تشكو رأسها قال:"], [2288.2, "«بل أنا وا رأساه» <span class=\"note\">(Buhârî)<\/span>."], [2291.0, "وكثيرٌ من الصحابة كان يأتي يشكو بعضَ الأمراض التي يجدها إلى النبي صلى الله عليه وسلم،"], [2301.0, "ولم يكن ينهاهم عن ذلك."]], "tr": [[2264.0, "Onun bu sözü şunu ifade etti:"], [2264.0, "Şikâyet sahih bir maksat için olur, tesahhut ifadelerinden ya da bıkkınlık fiillerinden uzak olursa, onda bir sakınca ve bir vebal yoktur."], [2279.0, "Bu yüzden Nebî ﷺ, başının ağrısından şikâyet eden Âişe'nin yanına girdiğinde «Bilakis ben, vay başım!» buyurdu <span class=\"note\">(Buhârî)<\/span>."], [2291.0, "Sahâbîlerin birçoğu da kendilerinde bulunan bazı hastalıkları Nebî ﷺ'e şikâyet etmek için gelirdi;"], [2291.0, "o da onları bundan nehyetmezdi."]]}, {"reader": false, "ar": [[2303.0, "بل بعضُهم كان يأتي ليشكو زوجتَه أو أهلَ بيته إلى النبي صلى الله عليه وسلم،"], [2310.0, "وكان يجيبهم عن هذه الشكوى،"], [2313.0, "ولم يأمرهم بعدمها أو تركها لأنها تخالف الإيمان بالقضاء والقدر؛"], [2320.0, "لأنها شكوى لمقصودٍ صحيح،"], [2322.2, "وليس فيها تسخّطٌ ولا تضجّر."], [2325.0, "ولذلك قال النبي صلى الله عليه وسلم:"], [2329.0, "«إنّ الله لا يعذّب بدمع العين، ولا بحزن القلب، ولكن يعذّب بهذا ـ وأشار إلى لسانه ـ أو يرحم»، أي بالتسخّط."]], "tr": [[2303.0, "Hatta bazıları hanımını ya da ev halkını Nebî ﷺ'e şikâyet etmek için gelirdi."], [2303.0, "O da bu şikâyete cevap verirdi;"], [2310.0, "kaza ve kadere imana aykırı olduğu gerekçesiyle onlara şikâyet etmemelerini ya da onu terk etmelerini emretmezdi."], [2313.0, "Çünkü bu, sahih bir maksat için yapılan bir şikâyettir;"], [2322.2, "içinde tesahhut ve bıkkınlık yoktur."], [2325.0, "Bu yüzden Nebî ﷺ şöyle buyurmuştur:"], [2325.0, "«Allah gözün yaşı sebebiyle de kalbin hüznü sebebiyle de azap etmez; fakat şununla —ve diline işaret etti— azap eder ya da merhamet eder»; yani tesahhutla."]]}, {"reader": false, "ar": [[2338.0, "وبناءً على ذلك: فشكوى المريض للطبيب لا بأس بها،"], [2345.0, "وشكوى المظلوم على ظالمه لا بأس بها،"], [2348.8, "لقول الله عز وجل:"], [2351.1, "<span class=\"ayah\">﴿لَّا يُحِبُّ اللَّهُ الْجَهْرَ بِالسُّوءِ مِنَ الْقَوْلِ إِلَّا مَن ظُلِمَ﴾<\/span> <span class=\"ref\">[النساء: ١٤٨]<\/span>،"], [2356.0, "وشكوى الفقير حالتَه للغنيّ الباذل لا بأس بها."], [2362.0, "وقد جاءت خولةُ رضي الله تعالى عنها تشكو زوجها إلى النبي صلى الله عليه وسلم،"], [2373.0, "كما في الآية المعروفة."]], "tr": [[2338.0, "Buna dayanarak: Hastanın doktora şikâyeti (derdini anlatması) sakıncasızdır."], [2345.0, "Mazlumun zalimini şikâyet etmesi sakıncasızdır;"], [2348.8, "Allah Azze ve Celle'nin şu sözünden dolayı:"], [2351.1, "<span class=\"ayah\">﴿Allah, zulme uğrayanın dışında, kötü sözün açıkça söylenmesini sevmez﴾<\/span> [Nisâ 148]."], [2356.0, "Fakirin hâlini cömert zengine şikâyet etmesi sakıncasızdır."], [2362.0, "Havle (radıyallahu teâlâ anhâ) da bilinen ayette olduğu gibi kocasını Nebî ﷺ'e şikâyet etmek için gelmişti."]]}, {"reader": false, "ar": [[2376.0, "فمثلُ هذه الشكوى للمخلوق لا بأس بها،"], [2378.8, "لكن لا بدّ أن تكون عاريةً عن أمرين:"], [2382.0, "الأمر الأول: أن لا تتضمّن شيئًا من التسخّط،"], [2389.0, "والشيء الثاني: أنها لا بدّ أن تكون لمقصودٍ صحيح."]], "tr": [[2376.0, "Mahlûka yapılan bu tür bir şikâyette sakınca yoktur;"], [2378.8, "fakat iki şeyden arınmış olması şarttır."], [2382.0, "Birincisi: Tesahhuttan hiçbir şey içermemesi."], [2389.0, "İkincisi: Sahih bir maksat için olması şarttır."]]}]}, {"ts": "39:53", "title": "9. Külliye: Rabbi hakkında zannı kötü olan O'nun kaderini kötüler", "paras": [{"reader": false, "ar": [[2393.0, "ومن الكلّيّات أيضًا: <b>كلُّ من ساء ظنُّه بالله طعن في أقداره.<\/b> كلُّ من ساء ظنُّه بربّه طعن في قدره."], [2405.0, "كلُّ من ساء ظنه بربه طعن في قدره ـ أعوذ بالله ـ."], [2409.8, "أقول وبالله التوفيق: وذلك لأنّ أعظمَ من يطعن بالقضاء والقدر فإنّ ذلك لا بدّ وأن يكون مسبوقًا بسوء الظنّ بالله عز وجل؛"], [2423.0, "فلا يمكن لمن كمّل مراتبَ إحسان الظنّ بالله أن يطعن في شيءٍ من قضائه وقدره."]], "tr": [[2393.0, "Külliyelerden biri de şudur: 9."], [2393.0, "külliye: Allah hakkında zannı kötü olan herkes O'nun kaderlerini kötüler. Rabbi hakkında zannı kötü olan herkes O'nun kaderini kötüler."], [2405.0, "(Tekrar ediyor.) —Allah'a sığınırım—. Tevfik Allah'tandır, derim ki:"], [2409.8, "Çünkü kaza ve kaderi en çok kötüleyen kimse(nin bu kötülemesinden) önce mutlaka Allah Azze ve Celle hakkında kötü zan gelir."], [2409.8, "Allah hakkında hüsn-i zannın mertebelerini tamamlamış olan birinin, O'nun kaza ve kaderinden herhangi bir şeyi kötülemesi mümkün değildir."]]}, {"reader": false, "ar": [[2430.0, "فمتى ما رأيتَ الرجل طعّانًا متسخّطًا من قضاء الله وقدره،"], [2436.0, "فاعلم أنّ ذلك فرعٌ من فروع ما ينبع من هذه العين الخبيثة القذرة،"], [2442.0, "وهي سوءُ الظنّ بالله عز وجل."], [2445.0, "ولذلك قال ابن القيم رحمه الله تعالى:"], [2448.0, "«أعظمُ الذنوب عند الله إساءةُ الظنّ به»."], [2452.0, "بل عدّه الإمام الهيتمي رحمه الله تعالى من الكبائر."]], "tr": [[2430.0, "Bir adamı Allah'ın kaza ve kaderini çokça kötüleyen, ona öfkelenen biri olarak gördüğünde bil ki bu, şu pis ve kirli kaynaktan fışkıran şeylerin dallarından bir daldır:"], [2436.0, "Allah Azze ve Celle hakkında kötü zan."], [2442.0, "Bu yüzden İbnü'l-Kayyim (rahimehullahu teâlâ) şöyle demiştir:"], [2445.0, "\"Allah katında günahların en büyüğü O'nun hakkında kötü zanda bulunmaktır.\" Hatta İmam Heytemî (rahimehullahu teâlâ) bunu büyük günahlardan saymıştır."]]}, {"reader": false, "ar": [[2459.0, "كما قال الله عز وجل:"], [2460.7, "<span class=\"ayah\">﴿يَظُنُّونَ بِاللَّهِ غَيْرَ الْحَقِّ ظَنَّ الْجَاهِلِيَّةِ﴾<\/span> <span class=\"ref\">[آل عمران: ١٥٤]<\/span>،"], [2464.0, "وقال الله عز وجل:"], [2465.4, "<span class=\"ayah\">﴿الظَّانِّينَ بِاللَّهِ ظَنَّ السَّوْءِ ۚ عَلَيْهِمْ دَائِرَةُ السَّوْءِ﴾<\/span> <span class=\"ref\">[الفتح: ٦]<\/span>،"], [2470.0, "ويقول الله عز وجل:"], [2471.0, "<span class=\"ayah\">﴿وَتَظُنُّونَ بِاللَّهِ الظُّنُونَا﴾<\/span> <span class=\"ref\">[الأحزاب: ١٠]<\/span>. فسوءُ الظنّ بالله هو الذي يحمل على الطعن في القضاء والقدر."]], "tr": [[2459.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2460.7, "<span class=\"ayah\">﴿Allah hakkında haksız yere cahiliye zannı gibi zanda bulunuyorlardı﴾<\/span> [Âl-i İmrân 154]."], [2464.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [2465.4, "<span class=\"ayah\">﴿Allah hakkında kötü zanda bulunanlar... Kötülük çemberi onların başına olsun﴾<\/span> [Fetih 6]."], [2465.4, "Allah Azze ve Celle şöyle buyurur:"], [2471.0, "<span class=\"ayah\">﴿Allah hakkında türlü türlü zanlarda bulunuyordunuz﴾<\/span> [Ahzâb 10]."], [2471.0, "Kaza ve kaderi kötülemeye sevk eden şey, Allah hakkındaki kötü zandır."]]}, {"reader": false, "ar": [[2477.0, "فمن ساء ظنُّه بالله فإنه سيكون في خوفٍ دائمٍ من قضاء الله وقدره،"], [2484.0, "وفي ترقّبٍ دائمًا لنزول المصيبة."], [2488.0, "بل إنّ الشكوك في ـ قضاء..."], [2490.0, "ـ حكمة الله عز وجل من بعض الأقدار إنما تكون في قلوب من ساءت ظنونُهم بالله عز وجل؛"], [2498.0, "ويترقّب دائمًا زوالَ نعمة الله،"], [2501.0, "وأنّ الله لا يريد له الراحةَ في هذه الدنيا،"], [2504.0, "وأنه حرمه وأعطى غيرَه، إلى غير ذلك."]], "tr": [[2477.0, "Allah hakkında zannı kötü olan kimse, Allah'ın kaza ve kaderinden sürekli bir korku içinde ve musibetin inmesini sürekli bekleyiş içinde olur."], [2484.0, "Hatta bazı kaderlerden dolayı Allah Azze ve Celle'nin —kazası...— hikmeti hakkındaki şüpheler, ancak Allah Azze ve Celle hakkında zanları kötü olanların kalplerinde bulunur."], [2490.0, "(Böyle biri) Allah'ın nimetinin yok olmasını, Allah'ın bu dünyada onun rahat etmesini istemediğini, onu mahrum bırakıp başkasına verdiğini ve buna benzer şeyleri sürekli bekler."]]}, {"reader": false, "ar": [[2509.0, "وبناءً على ذلك فهناك تلازمٌ عظيمٌ بين سوء الظنّ والطعن في القضاء والقدر؛"], [2517.8, "فمن ساء ظنُّه طعن،"], [2520.4, "ومن حسُن ظنُّه بالله عز وجل فإنه أبدًا لا يمكن أن يقع في شيءٍ من ذلك."], [2526.0, "يقول النبي صلى الله عليه وسلم:"], [2528.7, "«لا يموتنّ أحدُكم إلا وهو يُحسن الظنّ بالله» <span class=\"note\">(Müslim)<\/span>؛"], [2531.0, "لأنه في اللحظات الأخيرة التي لو مات على سوء الظنّ لمات ميتةً جاهلية."]], "tr": [[2509.0, "Buna dayanarak, kötü zan ile kaza ve kaderi kötülemek arasında büyük bir mütelâzımlık (birbirinden ayrılmazlık) vardır:"], [2520.4, "Zannı kötü olan kötüler; Allah Azze ve Celle hakkında zannı güzel olan ise bunlardan hiçbirine asla düşemez."], [2526.0, "Nebî ﷺ şöyle buyurur: «Sizden biri ancak Allah hakkında güzel zanda bulunarak ölsün.» <span class=\"note\">(Müslim)<\/span>."], [2531.0, "Çünkü bunlar, kötü zan üzerine ölse cahiliye ölümüyle öleceği son anlardır."]]}, {"reader": false, "ar": [[2538.0, "ويقول النبي صلى الله عليه وسلم:"], [2540.0, "«حسنُ الظنّ بالله من حسن العبادة»،"], [2544.0, "أخرجه الإمام الترمذي. ويقول النبي صلى الله عليه وسلم:"], [2548.0, "«أنا عند ظنّ عبدي بي، وأنا معه إذا ذكرني» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [2554.2, "فسيّئُ الظنّ بالله دائمًا يعتقد أنه مبخوسُ الحقّ،"], [2561.0, "وأنه ناقصُ الحظّ، وأنه يستحقّ فوق ما أعطاه الله عز وجل:"], [2570.0, "«وأين الله من حالتي؟»،"], [2574.0, "أو: «لن يستجيب الله عز وجل لدعواتي»،"], [2579.0, "أو: «لن ينصرني على من ظلمني»،"], [2583.0, "أو: «كتب عليّ الشقاءَ في حياتي»."]], "tr": [[2538.0, "Nebî ﷺ şöyle buyurur: «Allah hakkında güzel zan, güzel ibadettendir.» Bunu İmam Tirmizî rivayet etmiştir."], [2544.0, "Nebî ﷺ şöyle buyurur: «(Allah buyurur ki:) Ben kulumun beni zannettiği gibiyim; o beni andığında onunla beraberim.» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [2548.0, "Allah hakkında zannı kötü olan kimse, hep hakkının çiğnendiğine, nasibinin eksik olduğuna ve Allah Azze ve Celle'nin kendisine verdiğinden fazlasını hak ettiğine inanır:"], [2561.0, "\"Allah benim hâlimden nerede?\", \"Allah Azze ve Celle dualarıma asla icabet etmeyecek\", \"Bana zulmedene karşı bana asla yardım etmeyecek\" ya da \"Hayatımda bana bedbahtlık yazdı\" (der)."]]}, {"reader": false, "ar": [[2587.0, "بل ومنه اليأسُ من رحمة الله،"], [2589.8, "أو القنوطُ من رَوح الله عز وجل،"], [2593.0, "وهما أمران يتضمّنان التسخّطَ على قضاء الله والطعنَ في قدره،"], [2600.0, "وسببُهما سوءُ الظنّ به عز وجل."], [2606.0, "فمن أراد أن لا يطعن فليكمّل مراتبَ حسن الظنّ بالله عز وجل."]], "tr": [[2587.0, "Hatta Allah'ın rahmetinden ümit kesmek ya da Allah Azze ve Celle'nin rahmetinden (ferahlatmasından) ümitsizliğe düşmek de bundandır."], [2593.0, "Bu ikisi, Allah'ın kazasına öfkelenmeyi ve kaderini kötülemeyi içeren iki şeydir;"], [2600.0, "sebepleri de O'nun hakkında kötü zandır."], [2600.0, "Kim (kaderi) kötülememek istiyorsa, Allah Azze ve Celle hakkında hüsn-i zannın mertebelerini tamamlasın."]]}]}, {"ts": "43:32", "title": "10. Külliye: Kıyamete kadar olacak her şey kaderin türleriyle yazılmıştır", "paras": [{"reader": false, "ar": [[2612.0, "ومن الكلّيّات أيضًا ـ ولا أدري عن رقمها،"], [2614.8, "نعم ـ: <b>كلُّ كائنٍ إلى يوم القيامة فمكتوبٌ بأنواع القدر.<\/b> <span class=\"note\">(يكررها)<\/span>."], [2624.0, "فما من كائنٍ إلى يوم القيامة إلا ولا بدّ أن يكون مكتوبًا في أنواع القدر كلّها."], [2644.0, "وقد قسّم أهلُ السنة والجماعة الكتابةَ القدرية إلى جُمَلٍ من الأقسام:"]], "tr": [[2612.0, "Külliyelerden biri de —numarasını bilmiyorum, evet—:"], [2614.8, "<b>10. külliye: Kıyamet gününe kadar olacak her şey kaderin türleriyle yazılmıştır.<\/b> (Tekrar ediyor.) Kıyamet gününe kadar olacak hiçbir şey yoktur ki kaderin bütün türlerinde mutlaka yazılmış olmasın."], [2644.0, "Ehl-i Sünnet ve'l-Cemaat kader yazısını birkaç kısma ayırmıştır:"]]}, {"reader": false, "ar": [[2650.0, "الكتابة القدرية الأولى: الكتابةُ العامة،"], [2652.9, "وهي ما كتبه الله عز وجل في اللوح المحفوظ،"], [2658.0, "كما قال الله عز وجل:"], [2661.3, "<span class=\"ayah\">﴿وَعِندَهُ مَفَاتِحُ الْغَيْبِ لَا يَعْلَمُهَا إِلَّا هُوَ ۚ وَيَعْلَمُ مَا فِي الْبَرِّ وَالْبَحْرِ ۚ وَمَا تَسْقُطُ مِن وَرَقَةٍ إِلَّا يَعْلَمُهَا وَلَا حَبَّةٍ فِي ظُلُمَاتِ الْأَرْضِ وَلَا رَطْبٍ وَلَا يَابِسٍ إِلَّا فِي كِتَابٍ مُّبِينٍ﴾<\/span> <span class=\"ref\">[الأنعام: ٥٩]<\/span>."], [2675.0, "ويقول ا
