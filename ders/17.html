لله عز وجل:"], [2677.8, "<span class=\"ayah\">﴿وَكُلَّ شَيْءٍ أَحْصَيْنَاهُ فِي إِمَامٍ مُّبِينٍ﴾<\/span> <span class=\"ref\">[يس: ١٢]<\/span>."]], "tr": [[2650.0, "Birinci kader yazısı: Genel yazı."], [2650.0, "Bu, Allah Azze ve Celle'nin Levh-i Mahfûz'a yazdığı şeydir."], [2658.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2661.3, "<span class=\"ayah\">﴿Gaybın anahtarları O'nun katındadır; onları O'ndan başkası bilmez. Karada ve denizde ne varsa bilir. Düşen hiçbir yaprak yoktur ki onu bilmesin. Yerin karanlıklarındaki tek bir tane, yaş ve kuru ne varsa hepsi apaçık bir kitaptadır﴾<\/span> [En'âm 59]."], [2661.3, "Allah Azze ve Celle şöyle buyurur:"], [2675.0, "<span class=\"ayah\">﴿Her şeyi apaçık bir kitapta (imâm-ı mübînde) sayıp kaydetmişizdir﴾<\/span> [Yâsîn 12]."]]}, {"reader": false, "ar": [[2683.0, "ويقول الله عز وجل:"], [2684.5, "<span class=\"ayah\">﴿أَلَمْ تَعْلَمْ أَنَّ اللَّهَ يَعْلَمُ مَا فِي السَّمَاءِ وَالْأَرْضِ ۗ إِنَّ ذَٰلِكَ فِي كِتَابٍ﴾<\/span> <span class=\"ref\">[الحج: ٧٠]<\/span>."], [2690.0, "ويقول الله عز وجل:"], [2691.6, "<span class=\"ayah\">﴿مَّا فَرَّطْنَا فِي الْكِتَابِ مِن شَيْءٍ﴾<\/span> <span class=\"ref\">[الأنعام: ٣٨]<\/span>."], [2694.0, "ويقول النبي صلى الله عليه وسلم:"], [2696.0, "«وكتب في الذِّكر» ـ أي في الكتاب،"], [2700.0, "أي في اللوح المحفوظ ـ «كلَّ شيء» <span class=\"note\">(Buhârî)<\/span>."]], "tr": [[2683.0, "Allah Azze ve Celle şöyle buyurur:"], [2684.5, "<span class=\"ayah\">﴿Allah'ın gökte ve yerde olanı bildiğini bilmez misin? Şüphesiz bu bir kitaptadır﴾<\/span> [Hac 70]."], [2690.0, "Allah Azze ve Celle şöyle buyurur:"], [2691.6, "<span class=\"ayah\">﴿Kitapta hiçbir şeyi eksik bırakmadık﴾<\/span> [En'âm 38]."], [2694.0, "Nebî ﷺ şöyle buyurur: «Zikre» —yani kitaba, yani Levh-i Mahfûz'a— «her şeyi yazdı.» <span class=\"note\">(Buhârî)<\/span>."]]}, {"reader": false, "ar": [[2704.0, "ويقول النبي صلى الله عليه وسلم:"], [2706.3, "«كتب الله مقاديرَ الخلائق قبل أن يخلق السماواتِ والأرضَ بخمسين ألف سنة» <span class=\"note\">(Müslim)<\/span>."], [2711.0, "ويقول النبي صلى الله عليه وسلم:"], [2713.8, "«إنّ أوّلَ ما خلق الله القلمُ، قال له: اكتب، قال: ربِّ وما أكتب؟ قال: اكتب القدر، فكتب ما كان وما يكون إلى يوم القيامة»."]], "tr": [[2704.0, "Nebî ﷺ şöyle buyurur: «Allah, mahlûkatın kaderlerini gökleri ve yeri yaratmadan elli bin yıl önce yazdı.» <span class=\"note\">(Müslim)<\/span>."], [2706.3, "Nebî ﷺ şöyle buyurur: «Allah'ın ilk yarattığı şey kalemdir. Ona \"Yaz!\" dedi. (Kalem) \"Rabbim, ne yazayım?\" dedi. \"Kaderi yaz!\" buyurdu. O da olmuş olanı ve kıyamet gününe kadar olacak olanı yazdı.»"]]}, {"reader": false, "ar": [[2724.0, "النوع الثاني: التقدير العُمُري،"], [2726.5, "وهو كتابةٌ قدريةٌ تختصّ بعمر كلّ إنسان وما سيجري فيه من شقاءٍ وسعادة،"], [2734.8, "وغنًى وفقر، وصحةٍ ومرض،"], [2737.3, "وغيرها من مجريات أحوال الإنسان في دنياه."], [2744.0, "ودليلُها ما في الصحيحين من حديث ابن مسعود رضي الله عنه قال:"], [2749.1, "حدّثنا رسول الله صلى الله عليه وسلم ـ وهو الصادق المصدوق ـ:"], [2753.6, "«إنّ أحدكم يُجمع خلقُه في بطن أمه أربعين يومًا نطفة، ثم يكون علقةً مثل ذلك، ثم يكون مضغةً مثل ذلك، ثم يُبعث إليه الملكُ فينفخ فيه الروح، ويُؤمر بكَتْب أربع كلمات: بكَتْب رزقه، وأجله، وعمله، وشقيٌّ أو سعيد»، الحديث بتمامه."]], "tr": [[2724.0, "İkinci tür: Ömürlük takdir. Bu, her insanın ömrüne ve o ömür içinde olacak bedbahtlık ve mutluluk, zenginlik ve fakirlik, sağlık ve hastalık ve insanın dünyasındaki hâllerinin diğer akışlarına mahsus bir kader yazısıdır."], [2737.3, "Delili, Sahîhayn'da İbn Mes'ûd'dan (radıyallahu anh) gelen hadistir."], [2744.0, "Şöyle dedi: Doğru sözlü ve doğruluğu tasdik edilmiş olan Resûlullah ﷺ bize anlattı:"], [2749.1, "«Sizden birinin yaratılışı annesinin karnında kırk gün nutfe olarak toplanır; sonra bir o kadar alaka olur; sonra bir o kadar mudğa olur. Sonra ona melek gönderilir, ona ruhu üfler ve dört kelimeyi yazmakla emrolunur: rızkını, ecelini, amelini ve bedbaht mı mutlu mu olduğunu yazmakla.» Hadisin tamamı (böyledir)."]]}, {"reader": false, "ar": [[2774.0, "وفي حديث أبي الدرداء رضي الله عنه قال:"], [2776.9, "قال النبي صلى الله عليه وسلم:"], [2779.0, "«إنّ الله فرغ إلى كلّ عبدٍ من خلقه من خمس: من أجله، وأثره، ورزقه، وعمله، ومضجعه»."], [2789.0, "كلُّ ذلك قد كتبه الله عز وجل."], [2792.0, "والأحاديثُ في زمنية هذه الكتابة مختلفة:"], [2798.0, "ففي بعض الأحاديث بعد مضيّ أربعين يومًا على النطفة،"], [2805.0, "وفي بعض الأحاديث بعد مرور مائةٍ وعشرين يومًا على هذه النطفة."], [2810.0, "فالأول ثابتٌ في الصحيح من حديث حذيفة،"], [2814.3, "والثاني ثابتٌ في الصحيحين من حديث ابن مسعود رضي الله عنه."]], "tr": [[2774.0, "Ebü'd-Derdâ (radıyallahu anh) hadisinde şöyle dedi:"], [2776.9, "Nebî ﷺ şöyle buyurdu: «Allah, yarattığı her kulun beş şeyini (takdir edip) bitirmiştir: ecelini, izini, rızkını, amelini ve yatacağı yeri (kabrini).» Bunların hepsini Allah Azze ve Celle yazmıştır."], [2792.0, "Bu yazının zamanı hakkındaki hadisler farklıdır:"], [2798.0, "Bazı hadislerde nutfenin üzerinden kırk gün geçtikten sonradır;"], [2805.0, "bazı hadislerde bu nutfenin üzerinden yüz yirmi gün geçtikten sonradır."], [2810.0, "Birincisi Huzeyfe hadisinden Sahîh'te sabittir;"], [2814.3, "ikincisi İbn Mes'ûd (radıyallahu anh) hadisinden Sahîhayn'da sabittir."]]}, {"reader": false, "ar": [[2821.0, "فهل هذا من باب التعارض؟"], [2823.1, "الجواب: لا. فإن قلتَ:"], [2825.2, "وما وجهُ الجمع؟ الجواب:"], [2827.6, "وجهُ الجمع من جهتين:"], [2830.1, "الجهة الأولى: كلا الكتابتين ثابتة،"], [2834.0, "فيكون التقديرُ العمري منقسمًا إلى كتابتين:"], [2837.3, "إلى كتابةٍ أوّلية بعد مرور الأربعين،"], [2840.6, "وإلى كتابةٍ نهائية بعد مرور المائة والعشرين يومًا،"], [2845.0, "وهذا في كلّ الأجنّة."], [2847.0, "فإن لم يُرضَ بهذا الجواب فننتقل إلى الجواب الثاني،"], [2851.5, "وهي أن نجمع بين الحديثين باختلاف الأجنّة،"], [2855.0, "على ما يريده الله عز وجل في كتابة كلّ جنين."]], "tr": [[2821.0, "Peki bu, çelişki (teâruz) kabilinden midir?"], [2823.1, "Cevap: Hayır. \"Cem (uzlaştırma) yolu nedir?\" dersen, cevap:"], [2827.6, "Cem iki yönden yapılır. Birinci yön:"], [2830.1, "Her iki yazı da sabittir."], [2834.0, "Buna göre ömürlük takdir iki yazıya ayrılır:"], [2837.3, "Kırk gün geçtikten sonra ilk yazı ve yüz yirmi gün geçtikten sonra nihai yazı."], [2840.6, "Bu bütün ceninlerde böyledir. Bu cevaba razı olunmazsa ikinci cevaba geçeriz:"], [2847.0, "O da iki hadisi, Allah Azze ve Celle'nin her ceninin yazısında dilediğine göre ceninlerin farklılığıyla uzlaştırmamızdır."]]}, {"reader": false, "ar": [[2860.0, "فبعضُ الأجنّة يُكتب تقديرُه العمري بعد مرور أربعين في رحم أمه،"], [2867.0, "وبعضُ الأجنّة يُكتب بعد مرور مائةٍ وعشرين يومًا في بطن أمه."], [2873.0, "ولا تعارض بين هذه الأحاديث أبدًا، ولله الحمد."]], "tr": [[2860.0, "Bazı ceninlerin ömürlük takdiri annesinin rahminde kırk (gün) geçtikten sonra yazılır;"], [2867.0, "bazı ceninlerinki de annesinin karnında yüz yirmi gün geçtikten sonra yazılır."], [2867.0, "Bu hadisler arasında asla bir çelişki yoktur; hamd Allah'adır."]]}, {"reader": false, "ar": [[2877.0, "الكتابة الثالثة: الكتابةُ الحَوْليّة،"], [2880.0, "ويدلّ عليها قولُ الله عز وجل في ليلة القدر:"], [2884.0, "<span class=\"ayah\">﴿فِيهَا يُفْرَقُ كُلُّ أَمْرٍ حَكِيمٍ﴾<\/span> <span class=\"ref\">[الدخان: ٤]<\/span>،"], [2888.0, "أي جميعُ ما يجري على الناس في هذا العام يُكتب في هذه الليلة؛"], [2895.0, "ولذلك شُرع التماسُها وإحياؤها،"], [2898.0, "لتتوافق الكتابةُ القدرية مع الاجتهاد في التعبّد."]], "tr": [[2877.0, "Üçüncü yazı: Yıllık yazı. Buna Allah Azze ve Celle'nin Kadir gecesi hakkındaki şu sözü delildir:"], [2880.0, "<span class=\"ayah\">﴿O gecede her hikmetli iş ayrılır (hükme bağlanır)﴾<\/span> [Duhân 4]."], [2884.0, "Yani o yıl içinde insanların başına gelecek her şey bu gecede yazılır."], [2888.0, "Bu yüzden onu aramak ve ihya etmek meşru kılınmıştır;"], [2898.0, "ta ki kader yazısı ibadetteki gayretle denk gelsin."]]}, {"reader": false, "ar": [[2903.0, "والكتابة الرابعة: التقديرُ اليومي،"], [2908.0, "ويدلّ عليها قولُ النبي صلى الله..."], [2910.4, "قولُ الله عز وجل:"], [2912.0, "<span class=\"ayah\">﴿كُلَّ يَوْمٍ هُوَ فِي شَأْنٍ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٩]<\/span>،"], [2914.1, "أي يُعِزّ هذا ويُذِلّ هذا،"], [2917.3, "ويُحيي هذا ويُميت هذا،"], [2919.9, "ويُعدم هذا ويُوجِد هذا،"], [2922.6, "ويُغني هذا ويُفقر هذا."], [2926.0, "هذه أنواعُ الكتابة القدرية؛"], [2930.0, "فجميعُ ما هو كائنٌ إلى يوم القيامة فلا بدّ وأن يكون مكتوبًا في هذه الكتابات الأربع القدرية الأربع."], [2938.8, "والله أعلم، وصلى الله وسلم على نبينا محمد."]], "tr": [[2903.0, "Dördüncü yazı: Günlük takdir. Buna Nebî ﷺ'in..."], [2908.0, "Allah Azze ve Celle'nin şu sözü delildir:"], [2910.4, "<span class=\"ayah\">﴿O her an (her gün) bir iştedir﴾<\/span> [Rahmân 29]."], [2912.0, "Yani birini aziz kılar, birini zelil kılar;"], [2914.1, "birini diriltir, birini öldürür; birini yok eder, birini var eder;"], [2919.9, "birini zengin eder, birini fakir eder."], [2926.0, "Kader yazısının türleri bunlardır. Kıyamet gününe kadar olacak her şey mutlaka bu dört kader yazısında yazılmıştır."], [2930.0, "Allah en iyisini bilir. Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a>+' · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
