<script>
const D={"no": 53, "vid": "cqSmTgCBqpY", "title_ar": "الدرس (٥٣) من شرح كليات العقيدة — من كليات الرقية والكهانة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 53. Ders: Rukye ve Kehânet Külliyeleri (Cinlerin Eziyetinden Korunma, Kozmik Enerjiyle Tedavi, Kâhine Gitme, Rukyenin Şartları)", "sections": [{"ts": "00:00", "title": "Giriş · 7. Külliye: Kul Allah'a ne kadar yakın olursa cinlerin eziyetinden o kadar uzak olur", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.6, "والصلاةُ والسلامُ على رسول الله الأمين،"], [3.9, "وعلى آله وأصحابه الطيبين الطاهرين،"], [5.9, "ومن تبعَهم بإحسانٍ إلى يوم الدين،"], [8.2, "أمّا بعد: فلا نزال ـ ولله الحمدُ والمنّة ـ نشرح جُمَلًا من الكلّيّات المتعلّقة بتوحيد الألوهيّة،"], [16.7, "متمثّلةً في الكلّيّات التي تتعلّق بالرُّقية والسحر وغيره من الأمراض المعنويّة الروحيّة."], [25.0, "فمن كلّيّات هذا الدرس كلّيّةٌ تقول:"], [28.8, "<b>كلّما كان العبدُ لله أقربَ كان من أذى الجنّ أبعد.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.6, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [8.6, "Bundan sonra: Allah'a hamd ve minnet olsun, ulûhiyyet tevhidiyle ilgili külliyelerden birçoğunu şerh etmeye devam ediyoruz;"], [16.7, "bunlar rukye, sihir ve diğer manevî-ruhî hastalıklarla ilgili külliyelerde temsil ediliyor."], [23.1, "Bu dersin külliyelerinden biri şöyle der:"], [26.9, "<b>7. külliye: Kul Allah'a ne kadar yakın olursa cinlerin eziyetinden o kadar uzak olur.<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[35.0, "أقول وبالله التوفيق: وذلك لأنّ الجنّيّ لا يقدر أبدًا أن يضرّك بشيءٍ إلا بإذن الله عز وجل."], [54.0, "والجنُّ أضعفُ ما يكون إذا استعان العبدُ بالله عز وجل وأكثرَ من ذكره."], [61.0, "وإنما يتسلّط الجنُّ على الإنسان بتسليطه إيّاه على نفسه،"], [67.0, "وتمكينه منه، ودخوله باختياره تحت سلطانه:"], [71.0, "إمّا بأن يغفل عن ذكر الله عز وجل،"], [75.0, "وإمّا أن يرتكب شيئًا من الذنوب والمعاصي،"], [78.0, "وإمّا أن يبتعد عن منهج الله عز وجل في العقائد أو الشرائع."]], "tr": [[35.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, cinnînin Allah Azze ve Celle'nin izni olmadıkça sana hiçbir şeyle asla zarar veremeyecek olmasıdır."], [54.0, "Cin, kul Allah Azze ve Celle'den yardım istediğinde ve O'nu çokça zikrettiğinde olabileceği en zayıf hâldedir."], [61.7, "Cin insana ancak insanın onu kendi üzerine musallat etmesiyle, ona imkân vermesiyle ve kendi tercihiyle onun hâkimiyeti altına girmesiyle musallat olur:"], [73.5, "Ya Allah Azze ve Celle'nin zikrinden gafil olarak, ya günah ve masiyetlerden birini işleyerek, ya da akîdelerde veya şeriatlerde Allah Azze ve Celle'nin yolundan uzaklaşarak."]]}, {"reader": false, "ar": [[83.0, "لكن متى ما كان العبدُ متمسّكًا بمنهج الله عز وجل وبشريعته،"], [89.9, "وممتثلًا لأمره، ومجتنبًا نهيَه،"], [92.4, "فإنّ الجنَّ لا يستطيع أن يصل له بأذًى أبدًا."], [98.0, "ولذلك فالإنسانُ هو الذي يسلّط هؤلاء الشياطين والجنَّ على نفسه بتقصيره وتفريطه،"], [102.8, "إمّا في ترك المأمورات أو في فعل المحظورات،"], [106.0, "كما قال الله عز وجل:"], [108.8, "<span class=\"ayah\">﴿وَأَنَّهُ كَانَ رِجَالٌ مِّنَ الْإِنسِ يَعُوذُونَ بِرِجَالٍ مِّنَ الْجِنِّ فَزَادُوهُمْ رَهَقًا﴾<\/span> <span class=\"ref\">[الجن: ٦]<\/span>."], [115.0, "أي أنّ الجنّ لم تتسلّط عليهم ابتداءً،"], [118.5, "ولكن لمّا استعاذ الإنسُ بالجنّ زادوهم رَهَقًا."], [121.5, "فالشيطانُ هو ـ فالإنسيُّ هو الذي يسلّط الشياطين على نفسه."]], "tr": [[83.0, "Fakat kul Allah Azze ve Celle'nin yoluna ve şeriatine sımsıkı sarıldığı, emrine uyduğu ve yasağından kaçındığı sürece cin ona asla bir eziyetle ulaşamaz."], [95.5, "Bu yüzden bu şeytanları ve cinleri kendi üzerine musallat eden, ya emredilenleri terk ederek ya da yasaklananları işleyerek gösterdiği kusur ve ihmalle insanın kendisidir."], [105.2, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [108.8, "<span class=\"ayah\">﴿Doğrusu insanlardan bazı kimseler cinlerden bazı kimselere sığınırlardı da onların azgınlığını artırırlardı﴾<\/span> [Cin 6]."], [116.0, "Yani cinler onlara baştan musallat olmadı;"], [118.5, "fakat insanlar cinlere sığınınca onların azgınlığını artırdılar."], [121.2, "Yani şeytan... yani şeytanları kendi üzerine musallat eden insanın kendisidir."]]}, {"reader": false, "ar": [[126.0, "ولذلك قال أبو العباس ابنُ تيميّة رحمه الله تعالى:"], [131.0, "«كان الإنسُ إذا نزل أحدُهم بوادٍ يخاف أهلَه قال: أعوذ بعظيم هذا الوادي من سفهائه. وكانت الإنسُ تستعيذ بالجنّ، فصار ذلك سببًا لطغيان الجنّ»."], [144.0, "انتهى كلامه. وأمّا من استعان بالله عز وجل،"], [147.3, "ولاذ به، وتوكّل عليه،"], [148.8, "وأكثر من ذكره، فإنه ـ والله العظيم ـ لا سبيلَ للجنّ عليه أبدًا،"], [153.0, "ولا تسلُّطَ عليه في صَدَرٍ ولا وِرْد."]], "tr": [[126.0, "Bu yüzden Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [131.0, "\"İnsanlardan biri, halkından korktuğu bir vadiye indiğinde 'Bu vadinin büyüğüne, onun beyinsizlerinin şerrinden sığınırım' derdi."], [137.9, "İnsanlar cinlere sığınırdı; bu da cinlerin azgınlığına sebep oldu.\" Sözü bitti."], [142.9, "Allah Azze ve Celle'den yardım isteyen, O'na sığınan, O'na tevekkül eden ve O'nu çokça zikreden kimseye gelince, —yüce Allah'a yemin olsun ki— cinlerin onun üzerinde asla bir yolu yoktur;"], [153.0, "ne gidişinde ne dönüşünde ona musallat olamazlar."]]}, {"reader": false, "ar": [[157.0, "كما قال الله عز وجل عن الشيطان:"], [160.0, "<span class=\"ayah\">﴿إِنَّهُ لَيْسَ لَهُ سُلْطَانٌ عَلَى الَّذِينَ آمَنُوا وَعَلَىٰ رَبِّهِمْ يَتَوَكَّلُونَ﴾<\/span> <span class=\"ref\">[النحل: ٩٩]<\/span>."], [167.0, "وقال الله عز وجل:"], [168.6, "<span class=\"ayah\">﴿إِنَّ عِبَادِي لَيْسَ لَكَ عَلَيْهِمْ سُلْطَانٌ﴾<\/span> <span class=\"ref\">[الحجر: ٤٢]<\/span>."], [171.0, "وإضافةُ العبوديّة لله هنا إضافةُ تشريفٍ وتكريم،"], [176.0, "يعني ـ أي ـ العبوديّةَ الخاصّة التي تقتضي امتثالَ المأمورات وتركَ المنهيّات."]], "tr": [[157.0, "Nitekim Allah Azze ve Celle şeytan hakkında şöyle buyurur:"], [159.6, "<span class=\"ayah\">﴿Gerçekten onun, iman edip Rablerine tevekkül edenler üzerinde hiçbir hâkimiyeti yoktur﴾<\/span> [Nahl 99]."], [166.3, "Allah Azze ve Celle şöyle de buyurur:"], [169.0, "<span class=\"ayah\">﴿Şüphesiz kullarım üzerinde senin hiçbir hâkimiyetin yoktur﴾<\/span> [Hicr 42]."], [172.4, "Buradaki kulluğun Allah'a izafesi, şereflendirme ve ikram izafesidir;"], [176.3, "yani emredilenlere uymayı ve yasaklananları terk etmeyi gerektiren özel kulluk kastedilmektedir."]]}, {"reader": false, "ar": [[182.0, "وقد جاء في السنّة أذكارٌ كثيرةٌ يعتصم بها الإنسانُ من أذى الشياطين،"], [189.0, "فمن أعظمها الاستعاذةُ بالله عز وجل من الجنّ،"], [193.0, "كما قال الله عز وجل:"], [195.9, "<span class=\"ayah\">﴿وَإِمَّا يَنزَغَنَّكَ مِنَ الشَّيْطَانِ نَزْغٌ فَاسْتَعِذْ بِاللَّهِ ۖ إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ﴾<\/span> <span class=\"ref\">[فصلت: ٣٦]<\/span>،"], [202.8, "وفي موضعٍ آخر: <span class=\"ayah\">﴿إِنَّهُ سَمِيعٌ عَلِيمٌ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٠٠]<\/span>."], [209.0, "وقد نصّ العلماء على أنّ أعظمَ ما يعاقب الإنسيُّ الجنّيَّ به هذه الاستعاذة."]], "tr": [[182.0, "Sünnette, insanın şeytanların eziyetinden kendisini onlarla koruduğu pek çok zikir gelmiştir."], [186.7, "Bunların en büyüklerinden biri cinlerden Allah Azze ve Celle'ye sığınmaktır."], [191.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [194.2, "<span class=\"ayah\">﴿Eğer şeytandan bir kışkırtma seni dürterse hemen Allah'a sığın. Şüphesiz O, hakkıyla işitendir, hakkıyla bilendir﴾<\/span> [Fussilet 36];"], [202.1, "başka bir yerde de: <span class=\"ayah\">﴿Şüphesiz O işitendir, bilendir﴾<\/span> [A'râf 200]."], [209.5, "Âlimler, insanın cinniyi cezalandırdığı en büyük şeyin bu istiâze (Allah'a sığınma) olduğunu açıkça belirtmişlerdir."]]}, {"reader": false, "ar": [[216.0, "وذلك لأنّ أعظمَ سلطانٍ للجنّيّ على الإنسيّ هو تخبّطُه من حيث لا يراه،"], [222.0, "فيستعين العبدُ بمن يرى ذلك الشيطانَ وهو لا يستطيع أن يراه."], [228.0, "فكما أنك تسلّطتَ عليّ ـ يعني استقويتَ عليّ ـ لأنني لا أراك،"], [237.0, "فأنا أستعيذ منك بالله الذي يراك ويطّلع عليك،"], [241.3, "وأنت لا تستطيع أن تراه."], [244.0, "ولذلك من أعظم ما يجعل الشيطانَ ضعيفًا هزيلًا مدحورًا كثرةُ الاستعاذة بالله عز وجل،"], [253.0, "وقد تقدّم لنا مشروعيّةُ الاستعاذة عند كلّ مَخُوف."]], "tr": [[216.0, "Çünkü cinnînin insan üzerindeki en büyük hâkimiyeti, onu görmediği yerden çarpmasıdır."], [220.2, "Kul da o şeytanı gören, ama kendisini o şeytanın göremediği Zât'tan yardım ister."], [225.3, "(Sanki der ki:) \"Ben seni göremediğim için sen bana musallat oldun —yani bana karşı güç kazandın—;"], [234.3, "ben de seni gören ve sana muttali olan, senin ise göremediğin Allah'a senden sığınıyorum.\" Bu yüzden şeytanı zayıf, cılız ve kovulmuş hâle getiren en büyük şeylerden biri Allah Azze ve Celle'ye çokça sığınmaktır."], [252.4, "Korkulan her şey karşısında istiâzenin meşru olduğu daha önce geçmişti."]]}, {"reader": false, "ar": [[258.0, "وعن سليمانَ بنِ صُرَدٍ رضي الله عنه:"], [261.9, "«أنّ رجلين استبّا عند النبيّ صلى الله عليه وسلم، فغضب أحدُهما غضبًا شديدًا حتى انتفخت أوداجُه واحمرّ وجهُه، فقال النبيّ صلى الله عليه وسلم: إنّي لأعلم كلمةً لو قالها لذهب عنه ما يجد: أعوذ بالله من الشيطان الرجيم. فقيل له ما قاله النبيّ صلى الله عليه وسلم، فقال: إنّي لستُ بمجنون»."], [289.0, "والحديثُ في الصحيح، وذلك من شدّة غضبه."]], "tr": [[258.0, "Süleyman b. Surad'dan —Allah ondan razı olsun— rivayet edildiğine göre:"], [262.5, "\"İki adam Peygamber sallallâhu aleyhi ve sellem'in yanında birbirine sövdü."], [267.7, "Biri öyle şiddetli öfkelendi ki şah damarları şişti ve yüzü kızardı."], [273.4, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [276.0, "Ben bir söz biliyorum ki onu söylese, içinde bulunduğu hâl ondan gider:"], [281.1, "'Kovulmuş şeytandan Allah'a sığınırım.' Ona Peygamber sallallâhu aleyhi ve sellem'in söylediği söylendi;"], [286.3, "o da 'Ben deli değilim' dedi.\" Hadis Sahîh'tedir;"], [290.1, "(bu sözü) öfkesinin şiddetinden (söyledi)."]]}]}, {"ts": "04:53", "title": "7. Külliye (devam): Muavvizeteyn, Âyetü'l-kürsî ve Bakara sûresi", "paras": [{"reader": false, "ar": [[293.0, "ومما يطرد الجانَّ أيضًا قراءةُ المعوّذتين،"], [297.1, "فما تعوّذ المتعوّذون بمثلهما أبدًا."], [303.0, "فعن أبي سعيدٍ الخدريّ رضي الله عنه قال:"], [307.8, "«كان رسول الله صلى الله عليه وسلم يتعوّذ من الجانّ ـ عفوًا ـ يتعوّذ من الجانّ وعينِ الإنسان، حتى نزلت المعوّذتان، فلمّا نزلتا أخذ بهما وترك ما سواهما». والحديثُ حسن."]], "tr": [[293.0, "Cinleri kovan şeylerden biri de Muavvizeteyn'i (Felak ve Nâs sûrelerini) okumaktır;"], [299.2, "sığınanlar asla bu ikisinin benzeriyle sığınmamışlardır."], [305.4, "Ebû Saîd el-Hudrî'den —Allah ondan razı olsun— şöyle dediği rivayet edilir:"], [310.8, "\"Resûlullah sallallâhu aleyhi ve sellem cinlerden —pardon— cinlerden ve insanın nazarından (Allah'a) sığınırdı."], [315.7, "Nihayet Muavvizeteyn indi; inince onları aldı ve onların dışındakileri bıraktı.\" Hadis hasendir."]]}, {"reader": false, "ar": [[324.0, "ومما يطرد الشيطانَ أيضًا ويقيك من سوئه وشرّه قراءةُ آية الكرسيّ."], [331.0, "ففي الحديث عن أبي هريرة رضي الله عنه:"], [334.4, "أنّ النبيّ صلى الله عليه وسلم وكّله في حفظ صدقة الفطر،"], [339.0, "وكان يتبدّى له الشيطانُ على مدار ثلاث ليالٍ،"], [345.0, "كلَّ ذلك يمسكه أبو هريرة ويتوعّد برفعه للنبيّ صلى الله عليه وسلم،"], [353.0, "ويشتكي ذلك الشيطانُ السارقُ الحالَ وكثرةَ العيال،"], [357.5, "فيرحمه أبو هريرة ويتركه."]], "tr": [[324.0, "Şeytanı kovan, seni onun kötülüğünden ve şerrinden koruyan şeylerden biri de Âyetü'l-kürsî'yi okumaktır."], [331.0, "Ebû Hüreyre'den —Allah ondan razı olsun— gelen hadiste şöyle geçer:"], [334.8, "Peygamber sallallâhu aleyhi ve sellem onu fıtır sadakasını korumakla görevlendirmişti."], [338.2, "Şeytan üç gece boyunca ona görünüyordu."], [341.2, "Her seferinde Ebû Hüreyre onu yakalıyor ve onu Peygamber sallallâhu aleyhi ve sellem'e götürmekle tehdit ediyordu;"], [351.0, "o hırsız şeytan da hâlinden ve çoluk çocuğunun çokluğundan yakınıyor, Ebû Hüreyre ona acıyıp bırakıyordu."]]}, {"reader": false, "ar": [[360.0, "ولكن في المرّة الثالثة لمّا عزم على تسليمه للنبيّ صلى الله عليه وسلم قال:"], [366.3, "«يا أبا هريرة، ألا أعلّمك كلماتٍ إذا قلتَهنّ لم يزل عليك من الله حافظ، ولا يقربك شيطانٌ حتى تصبح: <span class=\"ayah\">﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span> حتى تختمها»."], [379.0, "فلمّا جاء إلى النبيّ صلى الله عليه وسلم قال:"], [382.8, "«ما فعل أسيرُك؟» فذكر له ذلك،"], [386.2, "فقال: «صدقك وهو كذوب»."]], "tr": [[360.0, "Fakat üçüncü seferde onu Peygamber sallallâhu aleyhi ve sellem'e teslim etmeye kararlı olunca şeytan şöyle dedi:"], [365.1, "\"Ey Ebû Hüreyre! Sana bazı kelimeler öğreteyim mi?"], [367.3, "Onları söylersen, sabaha kadar Allah tarafından üzerinde bir koruyucu bulunmaya devam eder ve sana hiçbir şeytan yaklaşamaz:"], [372.1, "<span class=\"ayah\">﴿Allah, O'ndan başka ilah yoktur; diridir, kayyûmdur﴾<\/span> [Bakara 255], ayeti sonuna kadar oku.\" Ebû Hüreyre Peygamber sallallâhu aleyhi ve sellem'in yanına gelince, \"Esirin ne yaptı?\" buyurdu."], [381.9, "O da durumu anlattı. Bunun üzerine \"Kendisi çok yalancı olduğu hâlde sana doğru söylemiş\" buyurdu."]]}, {"reader": false, "ar": [[390.0, "ومنها أيضًا قراءةُ سورة البقرة؛"], [392.7, "فإنها من أعظم ما يُضعف عملَ الشيطان،"], [396.4, "ويُبطل عملَ السحرة، ويجعل البيتَ في حمايةٍ ووقايةٍ وأمانٍ بإذن الله عز وجل."], [405.0, "ففي الحديث عن أبي هريرة رضي الله عنه قال:"], [408.8, "قال النبيّ صلى الله عليه وسلم:"], [411.3, "«لا تجعلوا بيوتكم مقابر، وإنّ الشيطان يفرّ من البيت الذي تُقرأ فيه سورة البقرة»، كما عند مسلم."]], "tr": [[390.0, "Bunlardan biri de Bakara sûresini okumaktır."], [392.7, "Çünkü o, şeytanın işini zayıflatan, sihirbazların işini iptal eden ve Allah Azze ve Celle'nin izniyle evi koruma, muhafaza ve emniyet altına alan en büyük şeylerdendir."], [406.7, "Ebû Hüreyre'den —Allah ondan razı olsun— gelen hadiste Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [413.0, "\"Evlerinizi kabirlere çevirmeyin. Şeytan, içinde Bakara sûresi okunan evden kaçar.\" Bu, Müslim'in rivayetindedir."]]}, {"reader": false, "ar": [[419.0, "ومن أعظم سورة البقرة بعد آية الكرسيّ خواتمُ سورة البقرة،"], [423.9, "خواتمُ سورة البقرة. ففي الحديث عن أبي مسعودٍ الأنصاريّ البدريّ رضي الله عنهما قال:"], [432.6, "قال النبيّ صلى الله عليه وسلم:"], [435.9, "«الآيتان من آخر سورة البقرة، من قرأ بهما في ليلةٍ كفتاه»."]], "tr": [[419.0, "Bakara sûresinin Âyetü'l-kürsî'den sonra en büyük kısmı, Bakara sûresinin son ayetleridir;"], [423.9, "Bakara sûresinin son ayetleri. Ebû Mes'ûd el-Ensârî el-Bedrî'den —Allah ondan razı olsun— gelen hadiste Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [435.3, "\"Bakara sûresinin sonundaki iki ayet:"], [438.1, "Kim onları bir gecede okursa ona yeter.\""]]}, {"reader": false, "ar": [[442.0, "وفي حديث النعمان بن بشيرٍ رضي الله عنهما قال:"], [446.5, "قال النبيّ صلى الله عليه وسلم:"], [449.3, "«إنّ الله تبارك وتعالى كتب كتابًا عنده قبل أن يخلق السماوات والأرض بألفي عام، أنزل منه آيتين ختم بهما سورة البقرة، ولا تُقرآن في دارٍ (ثلاث) ليالٍ فيقربها شيطان»."], [467.0, "والحديث صحّحه الإمام الألبانيّ رحمه الله تعالى كما في «صحيح الجامع»."]], "tr": [[442.0, "Nu'mân b. Beşîr'in —Allah ikisinden razı olsun— hadisinde Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [448.4, "\"Allah Tebâreke ve Teâlâ, gökleri ve yeri yaratmadan iki bin yıl önce yanında bir kitap yazdı."], [455.0, "Ondan iki ayet indirdi ve Bakara sûresini onlarla bitirdi."], [460.7, "Bunlar bir evde (üç) gece okunursa şeytan ona yaklaşmaz.\" Hadisi İmam el-Elbânî —Allah ona rahmet etsin— Sahîhu'l-Câmi'de olduğu gibi sahih saymıştır."]]}, {"reader": false, "ar": [[473.0, "ومما يقيك من الشيطان طيلةَ يومك أيضًا قولُ:"], [476.5, "«لا إله إلا الله وحده لا شريك له، له الملك وله الحمد، وهو على كلّ شيءٍ قدير» مئةَ مرّة،"], [486.0, "كما في الصحيحين من حديث أبي هريرة رضي الله عنه،"], [490.0, "وفيه: «وكانت له حِرزًا من الشيطان يومَه ذلك حتى يُمسي، ولم يأتِ أحدٌ بأفضلَ ممّا جاء به إلا أحدٌ عمل أكثرَ من ذلك»."]], "tr": [[473.0, "Bütün gün boyunca seni şeytandan koruyan şeylerden biri de yüz kere \"Allah'tan başka ilah yoktur, tektir, ortağı yoktur."], [480.0, "Mülk O'nundur, hamd O'nundur. O her şeye kadirdir\" demektir."], [484.4, "Bu, Sahîhayn'da Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde geçer;"], [488.8, "hadiste şöyle denir: \"O gün akşama kadar bu onun için şeytandan bir koruma olur."], [497.0, "Hiç kimse onun getirdiğinden daha faziletlisini getiremez;"], [499.8, "ancak bundan daha fazlasını yapan kimse müstesna.\""]]}]}, {"ts": "08:23", "title": "7. Külliye (devam): Zikir, ezan ve Kur'an okumak", "paras": [{"reader": false, "ar": [[503.0, "ومنها كثرةُ ذكر الله عز وجل بأيّ أنواع الذكر،"], [508.0, "من التسبيح والتحميد والتهليل والتكبير والحوقلة والحسبلة وغيرها من أنواع الذكر،"], [518.0, "فلا يزال لسانُك رطبًا بذكر الله عز وجل؛"], [521.0, "فإنّ الشيطان لا يتسلّط على من أكثر من ذكر الله عز وجل."]], "tr": [[503.0, "Bunlardan biri de her türlü zikirle Allah Azze ve Celle'yi çokça zikretmektir:"], [508.7, "Tesbih, tahmîd, tehlîl, tekbir, havkale (lâ havle) ve hasbele (hasbünallah) ve diğer zikir türleri."], [519.1, "Dilin Allah Azze ve Celle'nin zikriyle hep ıslak kalsın;"], [522.5, "çünkü şeytan Allah Azze ve Celle'yi çokça zikredene musallat olamaz."]]}, {"reader": false, "ar": [[527.0, "فعن الحارث الأشعريّ أنّ النبيّ صلى الله عليه وسلم قال:"], [530.1, "«إنّ الله تعالى أمر يحيى بنَ زكريّا عليه السلام بخمس كلماتٍ أن يعمل بهنّ ويأمر بني إسرائيل أن يعملوا بهنّ»،"], [539.0, "وذكر الحديث، وفيه: «وآمركم أن تذكروا الله تعالى، فإنّ مثلَ ذلك كمثل رجلٍ خرج العدوُّ في أثره سِراعًا، حتى إذا أتى على حصنٍ حصينٍ فأحرز نفسَه منهم، كذلك العبدُ لا يُحرز نفسَه من الشيطان إلا بذكر الله تعالى»."], [565.0, "الحديث رواه الإمام الترمذيّ وقال: حديثٌ حسنٌ صحيح."]], "tr": [[527.0, "Hâris el-Eş'arî'den rivayet edildiğine göre Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [530.5, "\"Allah Teâlâ, Yahyâ b. Zekeriyyâ aleyhisselâma beş kelimeyi kendisinin uygulamasını ve İsrâiloğulları'na da onlarla amel etmelerini emretmesini emretti.\" Hadisi zikretti;"], [539.0, "hadiste şu da vardır: \"Size Allah Teâlâ'yı zikretmenizi emrediyorum."], [547.0, "Bunun misali, düşmanın hızla peşine düştüğü bir adamın misali gibidir;"], [552.8, "nihayet sağlam bir kaleye varır ve kendini onlardan korur."], [558.0, "Kul da kendini şeytandan ancak Allah Teâlâ'yı zikrederek korur.\" Hadisi İmam Tirmizî rivayet etmiş ve \"hasen sahih bir hadistir\" demiştir."]]}, {"reader": false, "ar": [[571.0, "ومنها الأذان. فعن سُهيل بن أبي صالحٍ أنه قال:"], [578.1, "«أرسلني أبي إلى بني حارثة، ومعي غلامٌ لنا ـ أو صاحبٌ لنا ـ، فناداه منادٍ من حائطٍ باسمه لا يراه، وأشرف الذي معي على الحائط فلم يرَ شيئًا. فذكرتُ ذلك لأبي فقال: لو شعرتُ أنك تلقى هذا لما أرسلتُك، ولكن إذا سمعتَ صوتًا فنادِ بالصلاة» ـ أي بالأذان ـ «فإنّي سمعتُ أبا هريرة رضي الله عنه يحدّث عن رسول الله صلى الله عليه وسلم أنه قال: إذا نُودي للصلاة أدبر الشيطانُ وله ضُراطٌ حتى لا يسمع التأذين»."]], "tr": [[571.0, "Bunlardan biri de ezandır. Süheyl b."], [576.3, "Ebî Sâlih'ten şöyle dediği rivayet edilir:"], [578.6, "\"Babam beni Hârise oğullarına gönderdi."], [580.8, "Yanımda bizim bir delikanlımız —veya bir arkadaşımız— vardı."], [584.5, "Bir bahçe duvarının içinden, görünmeyen biri ona adıyla seslendi."], [590.1, "Yanımdaki kişi duvardan baktı ama hiçbir şey göremedi."], [594.3, "Bunu babama anlattım; dedi ki:"], [596.7, "Bununla karşılaşacağını bilseydim seni göndermezdim."], [599.7, "Fakat bir ses işittiğinde namaz için seslen\" —yani ezan oku— \"çünkü Ebû Hüreyre'nin —Allah ondan razı olsun— Resûlullah sallallâhu aleyhi ve sellem'den şöyle buyurduğunu naklettiğini işittim:"], [612.0, "Namaz için ezan okunduğunda şeytan, ezanı işitmeyecek şekilde yellenerek arkasını döner kaçar.\""]]}, {"reader": false, "ar": [[619.0, "وفي روايةٍ: «وله حُصاص» ـ بضمّ الحاء المهملة ـ أي ضُراط،"], [625.6, "وقيل: العَدْوُ الشديد. وفي صحيح الإمام مسلمٍ من حديث جابرٍ رضي الله عنه قال:"], [633.3, "قال النبيّ صلى الله عليه وسلم:"], [635.0, "«إنّ الشيطان إذا سمع النداءَ بالصلاة ذهب حتى يكون مكانَ الرَّوحاء»."], [641.0, "قال الراوي: والرَّوحاءُ من المدينة على ستّةٍ وثلاثين ميلًا، ونحوه."]], "tr": [[619.0, "Bir rivayette de \"hussâs ile\" denir —hâ-i mühmele ötreli olarak—;"], [624.8, "yani yellenme; \"şiddetli koşma\" olduğu da söylenmiştir."], [629.8, "İmam Müslim'in Sahîh'inde Câbir'in —Allah ondan razı olsun— hadisinde Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [634.4, "\"Şeytan namaz için yapılan çağrıyı işittiğinde Revhâ'nın bulunduğu yere varıncaya kadar gider.\" Râvi demiştir ki:"], [641.0, "Revhâ, Medine'ye otuz altı mil kadar uzaklıktadır; ya da buna yakın."]]}, {"reader": false, "ar": [[647.0, "ومنها قراءةُ القرآن، قراءةُ القرآن؛"], [650.5, "فإنها تعصم من الشياطين."], [654.0, "قال الله عز وجل:"], [656.5, "<span class=\"ayah\">﴿وَإِذَا قَرَأْتَ الْقُرْآنَ جَعَلْنَا بَيْنَكَ وَبَيْنَ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ حِجَابًا مَّسْتُورًا﴾<\/span> <span class=\"ref\">[الإسراء: ٤٥]<\/span>."], [664.0, "ويدخل فيمن لا يؤمن بالآخرة دخولًا أوّليًّا الشياطين."]], "tr": [[647.0, "Bunlardan biri de Kur'an okumaktır, Kur'an okumak;"], [651.3, "çünkü o şeytanlardan korur. Allah Azze ve Celle şöyle buyurur:"], [657.8, "<span class=\"ayah\">﴿Sen Kur'an okuduğun zaman, seninle âhirete inanmayanlar arasına görünmez bir perde çekeriz﴾<\/span> [İsrâ 45]."], [665.7, "Âhirete inanmayanlara şeytanlar öncelikli olarak dâhildir."]]}]}, {"ts": "11:09", "title": "7. Külliye (sonu): Namaz, sabah-akşam zikirleri, konaklama duası ve masiyetlerden uzaklaşmak", "paras": [{"reader": false, "ar": [[669.0, "ومنها المحافظةُ على الصلوات في أوقاتها."], [672.0, "ومنها كذلك المحافظةُ على الأذكار والأوراد الصباحيّة والمسائيّة،"], [678.0, "وعند دخول البيت والخروج منه؛"], [682.0, "فإنّ ذلك كلَّه ممّا يقي ـ بإذن الله عز وجل ـ من الشيطان الرجيم."], [688.0, "ومنها كذلك أن تحرص على ذكر نزول المنزل،"], [695.0, "لقول النبيّ صلى الله عليه وسلم:"], [698.0, "«من نزل منزلًا فقال: أعوذ بكلمات الله التامّات من شرّ ما خلق، لم يضرّه شيءٌ حتى يرحل عن منزله ذلك»."]], "tr": [[669.0, "Bunlardan biri de namazları vakitlerinde kılmaya devam etmektir."], [672.0, "Yine bunlardan biri sabah ve akşam zikirlerine ve virdlerine, eve girerken ve evden çıkarken okunan zikirlere devam etmektir."], [683.0, "Çünkü bunların hepsi Allah Azze ve Celle'nin izniyle kovulmuş şeytandan korur."], [687.5, "Yine bunlardan biri, bir yere konaklarken okunan zikre özen göstermendir."], [695.0, "Çünkü Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [698.0, "\"Kim bir yere konaklar ve 'Yarattığı şeylerin şerrinden Allah'ın tam kelimelerine sığınırım' derse, o konak yerinden ayrılıncaya kadar ona hiçbir şey zarar vermez.\""]]}, {"reader": false, "ar": [[709.0, "ومنها البعدُ عن المعاصي؛"], [711.0, "فإنّ من أعظم ما يوجب تسليطَ الشيطان على الإنسان كثرةَ معاصيه،"], [718.0, "لا سيّما الزنا والغناء،"], [721.0, "وقبل ذلك الشرك. فالشركُ والزنا والغناءُ من أعظم ما يجلب الشياطين،"], [730.0, "نعوذ بالله من ذلك."]], "tr": [[709.0, "Bunlardan biri de masiyetlerden uzak durmaktır."], [711.6, "Çünkü şeytanın insana musallat olmasını gerektiren en büyük şeylerden biri, onun masiyetlerinin çokluğudur;"], [718.8, "özellikle zina ve şarkı-müzik, bundan da önce şirk."], [724.7, "Şirk, zina ve şarkı-müzik şeytanları celbeden en büyük şeylerdendir. Bundan Allah'a sığınırız."]]}, {"reader": false, "ar": [[733.0, "وبالجملة فإنّ هذه الكلّيّة تدلّ على أنه كلّما كان العبدُ لله أقربَ ـ بامتثال أوامره،"], [742.0, "واجتناب نواهيه، والمحافظة على الأوراد والأذكار ـ فإنه يكون من أذى الجنّ أبعد. والله أعلم."]], "tr": [[733.0, "Özetle bu külliye şuna delalet eder:"], [736.2, "Kul, Allah'ın emirlerine uyarak, yasaklarından kaçınarak ve virdlere ve zikirlere devam ederek Allah'a ne kadar yakın olursa cinlerin eziyetinden o kadar uzak olur. Allah en iyisini bilir."]]}]}, {"ts": "12:32", "title": "8. Külliye: Kozmik enerjiyle tedavi ettiğini iddia eden herkes kâhin ve deccaldir", "paras": [{"reader": false, "ar": [[752.0, "ومن الكلّيّات أيضًا: <b>كلُّ من زعم أنه يعالج بما يسمّى بالطاقة الكونيّة فكاهنٌ دجّال.<\/b> كلُّ من زعم أنه يعالج بما يسمّى بالطاقة الكونيّة فإنه كاهنٌ دجّال."], [772.0, "أُعيدها مرّةً ثالثة: كلُّ من زعم أنه يعالج بما يسمّى بالطاقة الكونيّة فإنه كاهنٌ دجّال."]], "tr": [[752.0, "Külliyelerden biri de şudur: 8."], [755.2, "külliye: Kozmik enerji denilen şeyle tedavi ettiğini iddia eden herkes kâhin ve deccaldir (sahtekârdır). Kozmik enerji denilen şeyle tedavi ettiğini iddia eden herkes kâhin ve deccaldir."], [772.9, "Üçüncü kez tekrar ediyorum: Kozmik enerji denilen şeyle tedavi ettiğini iddia eden herkes kâhin ve deccaldir."]]}, {"reader": false, "ar": [[782.0, "أقول وبالله التوفيق: وهذا ممّا ابتُلينا به في هذا الزمان،"], [787.0, "وهي ما يسمّى بحركة العصر الجديد."], [791.0, "وهو طبٌّ لا يعرفه الأطبّاء الأوائل أبدًا على مختلف أشكالهم،"], [797.0, "وإنما هو من البدع المحدَثة في هذا العصر."], [801.0, "وكلُّ من يزعم أنه يعالج بناءً على هذه الطاقة الكونيّة المكذوبة المزعومة فإنه من إخوان الكهّان والدجاجلة والسحرة، وذلك لعدّة أمور."]], "tr": [[782.0, "Tevfik Allah'tandır, derim ki: Bu, bu zamanda imtihan edildiğimiz şeylerdendir;"], [787.0, "\"Yeni Çağ (New Age) Hareketi\" denilen şeydir."], [791.6, "Bu, eski tabiplerin, çeşitli türleriyle hiçbirinin asla bilmediği bir tıptır;"], [797.5, "ancak bu çağda ortaya çıkarılmış bid'atlerdendir."], [800.5, "Bu yalan ve uydurma kozmik enerjiye dayanarak tedavi ettiğini iddia eden herkes kâhinlerin, deccalların ve sihirbazların kardeşlerindendir. Bunun birkaç sebebi vardır."]]}, {"reader": false, "ar": [[814.0, "الأمرُ الأوّل: أنّ المتقرّر في القواعد أنّ من أعظم مقاصد التوحيد إخراجَ القلوب والعقول من الأوهام إلى الحقائق،"], [824.0, "كما بيّنّاه لكم سابقًا في مناسباتٍ كثيرة."], [828.0, "والعلاجُ بالطاقة الكونيّة من أعظم ما يجعل القلبَ والعقلَ في أوهامٍ لا حقائقَ لها؛"], [837.0, "فإنهم يزعمون أمورًا كونيّةً توجب العلاج،"], [841.1, "وتوجب تقويةَ العزائم، وتوجب تقويةَ النفس،"], [846.0, "ومكابدةَ الأمور، وتيسيرَ الصعاب،"], [848.7, "وفي حقيقة الأمر أنها أوهامٌ لا حقائقَ لها."]], "tr": [[814.0, "Birinci sebep: Kaidelerde sabit olan şudur:"], [816.8, "Tevhidin en büyük maksatlarından biri kalpleri ve akılları vehimlerden hakikatlere çıkarmaktır;"], [822.9, "bunu daha önce birçok vesileyle size açıklamıştık."], [826.9, "Kozmik enerjiyle tedavi ise kalbi ve aklı hakikati olmayan vehimler içinde bırakan en büyük şeylerdendir."], [835.7, "Çünkü onlar tedaviyi sağlayan, azimleri güçlendiren, nefsi güçlendiren, işlere katlanmayı ve zorlukları kolaylaştırmayı sağlayan birtakım kozmik şeyler iddia ederler;"], [849.3, "işin hakikatinde ise bunlar hakikati olmayan vehimlerdir."]]}, {"reader": false, "ar": [[854.0, "فكلُّ تداوٍ أو علاجٍ يُبنى على هذه الأوهام فلا يجوز إقرارُه في واقع الناس أبدًا،"], [866.0, "ومهما فعل أصحابُها ليسوّقوها أو ليزخرفوها أو ليُقنعوا القلوبَ بها فإنهم لا يستطيعون؛"], [875.1, "لأنها مفضوحةٌ أمام العقلاء،"], [877.8, "وأمام أهل العلم خاصّةً."], [882.0, "فبما أنه علاجٌ مبنيٌّ على الأوهام والأكاذيب فهو دجلٌ وكهانة؛"], [890.0, "فإنّ الكهانة من خصائصها أنها تقوم على الأوهام وعلى الدجل والكذب،"], [897.0, "كما قال النبيّ صلى الله عليه وسلم في حقيقة الكهّان:"], [901.0, "«ويكذب معها مئةَ كذبة، فيُصدَّق بتلك الكلمة التي سُمعت من السماء»."]], "tr": [[854.0, "Bu vehimler üzerine kurulan her tedavi veya ilacın insanların hayatında onaylanması asla caiz değildir."], [862.0, "Sahipleri onu pazarlamak, süslemek veya kalpleri ona ikna etmek için ne yaparlarsa yapsınlar buna güç yetiremezler;"], [873.7, "çünkü akıllı kimselerin önünde, özellikle de ilim ehlinin önünde rezil olmuştur."], [879.9, "Vehimler ve yalanlar üzerine kurulmuş bir tedavi olduğuna göre, o sahtekârlık ve kehânettir."], [890.0, "Çünkü kehânetin özelliklerinden biri vehimler, sahtekârlık ve yalan üzerine kurulu olmasıdır."], [896.4, "Nitekim Peygamber sallallâhu aleyhi ve sellem kâhinlerin hakikati hakkında şöyle buyurmuştur:"], [900.2, "\"Onunla birlikte yüz yalan söyler;"], [902.5, "gökten işitilen o kelime sebebiyle de (yalanlarında) tasdik edilir.\""]]}, {"reader": false, "ar": [[907.0, "وهؤلاء يكذبون أكثرَ ممّا يكذب الكهّان في كافّة ما يتعاطونه من هذا التداوي."]], "tr": [[907.0, "Bunlar ise uğraştıkları bu tedavinin her şeyinde kâhinlerin yalan söylediğinden daha fazla yalan söylerler."]]}]}, {"ts": "15:17", "title": "8. Külliye (devam): İkinci sebep — Gaybî bir iddia ve Doğu putperest inançları", "paras": [{"reader": false, "ar": [[917.0, "الأمرُ الثاني: أنهم يزعمون أنّ هذا العلاج مبنيٌّ على وجود طاقةٍ كونيّةٍ وقوّةٍ كونيّةٍ خلقها الله عز وجل في هذا الكون."], [929.0, "وهذا كذبٌ ودجل؛ لأنّ الأمر غيب،"], [933.0, "والمتقرّر في القواعد أنّ ما كان غيبيًّا فيكون توقيفيًّا."], [938.0, "وإنّنا لا نعلم دليلًا،"], [940.0, "لا من الكتاب ولا من السنّة الصحيحة،"], [943.5, "يدلّ على وجود هذه الطاقة الكونيّة العلاجيّة."]], "tr": [[917.0, "İkinci sebep: Onlar bu tedavinin, Allah Azze ve Celle'nin bu kâinatta yarattığı kozmik bir enerjinin ve kozmik bir gücün varlığına dayandığını iddia ederler."], [929.0, "Bu yalan ve sahtekârlıktır; çünkü mesele gayba aittir."], [933.6, "Kaidelerde sabit olan şudur: Gaybî olan şey tevkîfîdir (nassa bağlıdır)."], [938.5, "Biz ne Kitap'tan ne de sahih Sünnet'ten bu tedavi edici kozmik enerjinin varlığına delalet eden bir delil bilmiyoruz."]]}, {"reader": false, "ar": [[947.0, "وإنك لو رجعتَ بالأمر قليلًا لوجدتَ أنهم يأخذون هذه العقائد من العقائد الوثنيّة الشرقيّة،"], [955.9, "من الصين والتِّبِت والهند،"], [959.0, "وحضاراتهم البوذيّة الهندوسيّة. ومبنى عقيدة هؤلاء الكفرة الوثنيّين الشرقيّين هو اعتقادُ أنّ ذات الله عز وجل قد حلّت في ذات مخلوقاته،"], [973.0, "فهم يستجلبون هذه الأجزاء الإلهيّة ـ على زعمهم ـ ليُدخلوها في الذات البشريّة،"], [982.8, "لتحلّ في الذات البشريّة القوّةُ والعزيمةُ والشفاء."]], "tr": [[947.0, "İşin aslına biraz geri gidersen, onların bu inançları Doğu'nun putperest inançlarından;"], [953.0, "Çin, Tibet ve Hindistan'dan ve onların Budist-Hindu medeniyetlerinden aldıklarını görürsün."], [960.9, "Bu Doğulu kâfir putperestlerin inancının temeli, Allah Azze ve Celle'nin zâtının mahlûkatının zâtına hulûl ettiği inancıdır."], [971.5, "Onlar —kendi iddialarına göre— bu ilâhî parçaları celbedip insan zâtına sokmaya çalışırlar ki insan zâtına güç, azim ve şifa hulûl etsin."]]}, {"reader": false, "ar": [[989.0, "ولكن لمّا أخذها هؤلاء وأرادوا أن يُؤسلِموها قالوا:"], [993.7, "ليس هذا هو من حلول ـ يعني ليس هذا من حلول الربّ بالخلق ـ وإنما هي طاقةٌ خلقها الله عز وجل في كونه."], [1005.1, "فهم يريدون أن يستروا عوراتِ هذا التداوي."], [1009.0, "ولذلك لا يزالون يقولون في مجالسهم الخاصّة بأنّ هذه الطاقة التي نريد استجلابها لإدخالها في بدن الإنسان إنما هي الذاتُ الإلهيّة."]], "tr": [[989.0, "Fakat bunlar onu alıp İslâmîleştirmek isteyince şöyle dediler:"], [993.7, "Bu, hulûl değildir —yani Rabbin yaratılmışlara hulûlü değildir—;"], [996.0, "bu sadece Allah Azze ve Celle'nin kâinatında yarattığı bir enerjidir."], [1005.1, "Onlar bu tedavinin ayıplarını örtmek istiyorlar."], [1008.4, "Bu yüzden kendi özel meclislerinde, insan bedenine sokmak için celbetmek istedikleri bu enerjinin ilâhî zâtın kendisi olduğunu söyleyip duruyorlar."]]}, {"reader": false, "ar": [[1022.0, "ولذلك منتهى العلاج بالطاقة الكونيّة هي إشعارُ الإنسان بأنه جزءٌ من ـ أنه جزءٌ من الإله."], [1030.0, "وهذا يؤكّد لنا بأنه علاجٌ كهنوتيٌّ إبليسيٌّ شيطانيّ،"], [1039.0, "قائمٌ على أسسٍ عقديّةٍ منحرفة،"], [1042.4, "ومخالفاتٍ شرعيّةٍ لا يمكن الانفكاكُ عنها أبدًا."], [1048.0, "وإن كان بعضُ ممارسي هذا النوع من العلاج يحاول إخفاءَ حقيقتها عن المتعالجين،"], [1058.0, "وبعضُهم يحاول تخليصَها ممّا يشوبها مدّعيًا أسلمتَها،"], [1062.0, "ولكنّ هذا مستحيل، ولا يستطيعون ذلك أبدًا؛"], [1067.0, "لأنّ ما يصادم العقيدةَ من التطبيقات العلاجيّة للطاقة إنما هو في أصول الإسلام،"], [1073.7, "وليس في مجرّد جزئيّاتٍ وفروعٍ فقط."]], "tr": [[1022.0, "Bu yüzden kozmik enerjiyle tedavinin son noktası, insana kendisinin —kendisinin ilahın bir parçası olduğunu hissettirmektir."], [1029.0, "Bu da bize onun kehânete dayalı, iblisçe, şeytanî bir tedavi olduğunu;"], [1039.0, "sapkın akîde temellerine ve kendisinden asla ayrılması mümkün olmayan şer'î muhalefetlere dayandığını teyit eder."], [1048.7, "Bu tür tedaviyi uygulayanların bir kısmı onun hakikatini tedavi olanlardan gizlemeye çalışsa da, bir kısmı da İslâmîleştirdiğini iddia ederek onu kendisine karışan şeylerden arındırmaya çalışsa da, bu imkânsızdır ve buna asla güç yetiremezler."], [1069.5, "Çünkü enerji tedavisi uygulamalarından akîdeyle çatışan şey İslam'ın usûlündedir;"], [1073.7, "sadece cüz'î ve fer'î meselelerde değildir."]]}, {"reader": false, "ar": [[1077.0, "ومنها أيضًا ـ أي الأمرُ الثالث ـ:"], [1080.3, "أنهم يزعمون سببيّةً لا يقف وراء سببيّتها لا دليلُ الشرع ولا دليلُ القدر."], [1089.0, "وأنتم تعرفون أنّ المتقرّر في القواعد أنّ كلَّ من زعم سببيّةً لا يقف وراء سببيّتها دليلُ الشرع ولا دليلُ القدر فإنه مشركٌ شركًا أصغر،"], [1102.2, "وإن اعتقد أنّ السبب هو الفاعلُ بذاته فشركٌ أكبر."]], "tr": [[1077.0, "Bunlardan biri de —yani üçüncü sebep—:"], [1080.3, "Sebepliğinin arkasında ne şer'î delilin ne de kaderî (tecrübî) delilin durduğu bir sebeplik iddia etmeleridir."], [1089.5, "Biliyorsunuz ki kaidelerde sabit olan şudur:"], [1092.8, "Sebepliğinin arkasında şer'î delilin de kaderî delilin de durmadığı bir sebeplik iddia eden herkes küçük şirkle müşriktir;"], [1101.6, "eğer sebebin bizzat kendisinin fâil olduğuna inanırsa bu büyük şirktir."]]}, {"reader": false, "ar": [[1106.6, "فهذا العلاج ـ فالعلاجُ بما يسمّى بالطاقة الكونيّة ينسبونه إلى سببيّةٍ لا يقف وراءها لا دليلُ الشرع ولا دليلُ القدر،"], [1121.0, "بل ولا دليلُ التجارب."], [1123.0, "ونحن لا نقبل من الأسباب إلا ما يقف وراءه أحدُ هذين الدليلين."], [1129.0, "ولذلك فالعلاجُ بمثل هذا لا يجوز أبدًا؛"], [1133.1, "لأنه يستند إلى سببيّةٍ توهّميّةٍ خياليّةٍ ليست بحقيقةٍ في أرض الواقع أبدًا."]], "tr": [[1106.6, "Bu tedavi —kozmik enerji denilen şeyle tedavi— arkasında ne şer'î delilin ne kaderî delilin, hatta ne de tecrübe delilinin durduğu bir sebepliğe nispet ediliyor."], [1122.5, "Biz ise sebeplerden ancak arkasında bu iki delilden birinin durduğunu kabul ederiz."], [1128.0, "Bu yüzden bunun gibi bir şeyle tedavi asla caiz değildir;"], [1133.1, "çünkü gerçek dünyada asla hakikati olmayan, vehme dayalı hayalî bir sebepliğe dayanmaktadır."]]}, {"reader": false, "ar": [[1140.0, "ولذلك هم يتعاملون مع مرضاهم كما يتعامل الساحرُ مع مرضاه،"], [1145.0, "أو الكاهنُ مع مرضاه؛"], [1147.0, "وهو أنّ قيام علاجهم على الأوهام،"], [1150.5, "وعلى قدرتك على إقناع المتعالج بأنّ ما تعالج به له سببيّتُه وله واقعُه."], [1158.0, "وفي الحقيقة أنه لا سببيّة،"], [1161.3, "ليس هناك سببيّةٌ تؤيّده، ولا واقعٌ يصدّقه."]], "tr": [[1140.0, "Bu yüzden onlar hastalarına, sihirbazın hastalarına veya kâhinin hastalarına davrandığı gibi davranırlar."], [1145.5, "Yani tedavilerinin dayanağı vehimler ve senin, tedavi olan kişiyi tedavi ettiğin şeyin bir sebepliği ve gerçekliği olduğuna ikna etme becerindir."], [1155.7, "Hakikatte ise ortada bir sebeplik yoktur;"], [1158.7, "onu destekleyen bir sebeplik de, onu doğrulayan bir gerçeklik de yoktur."]]}, {"reader": false, "ar": [[1166.0, "ومنها كذلك أنّ هذا العلاج قائمٌ على عقيدةٍ أجمع العلماءُ على كفر معتنقيها،"], [1179.0, "وأنها أشدُّ كفرًا من كفر اليهود والنصارى،"], [1182.8, "وهي عقيدةُ وحدة الوجود."], [1185.0, "فإنّ هؤلاء يعتقدون بأنّ ذات الله عز وجل قد حلّت في ذوات خلقه،"], [1193.9, "فهم يحاولون استجلابَ تلك الطاقة الإلهيّة ليُدخلوها فيما يسمّونه بالشَّكْرات الجسديّة،"], [1202.0, "معتقدين أنّ في جسم الإنسان فراغاتٍ لا بدّ أن تُسَدّ بمثل هذه الطاقة الإلهيّة."]], "tr": [[1166.0, "Bunlardan biri de şudur: Bu tedavi, âlimlerin onu benimseyenlerin küfrü üzerinde icmâ ettiği bir akîdeye dayanır;"], [1179.5, "bu akîde, yahudilerin ve hristiyanların küfründen daha şiddetli bir küfürdür."], [1185.0, "Bu, vahdet-i vücûd akîdesidir. Çünkü bunlar Allah Azze ve Celle'nin zâtının yaratılmışlarının zâtlarına hulûl ettiğine inanırlar."], [1194.7, "Bu yüzden o ilâhî enerjiyi celbedip \"bedensel çakralar\" dedikleri şeylere sokmaya çalışırlar;"], [1202.5, "insan vücudunda bu ilâhî enerji gibi bir şeyle doldurulması gereken boşluklar bulunduğuna inanırlar."]]}]}, {"ts": "20:09", "title": "8. Külliye (devam): Yoga, tılsımlar ve vahdet-i vücûd", "paras": [{"reader": false, "ar": [[1209.0, "ولا يزال الجسدُ في بُعدٍ عن المصائب والآلام والأوجاع ما دامت شَكْراتُه ممتلئةً وفراغاتُه ممتلئةً بمثل هذه الطاقة."], [1219.0, "ولذلك يجعلون لاستجلاب تلك الطاقة الكونيّة الإلهيّة طقوسًا ركيزتُها على إصمات العقل عن التكليف <span class=\"q\">؟ 20:19<\/span>،"], [1229.4, "بما يسمّى برياضة اليوغا؛"], [1235.0, "فإنها ليست رياضةً بريئةً من ارتباطها بهذا الإلحاد الوثنيّ،"], [1241.0, "والاعتقاد الوجوديّ الكفريّ الإبليسيّ الكهنوتيّ."]], "tr": [[1209.0, "Çakraları ve boşlukları bu enerji gibi bir şeyle dolu olduğu sürece beden musibetlerden, acılardan ve ağrılardan uzak kalmaya devam eder (derler)."], [1217.8, "Bu yüzden o kozmik ilâhî enerjiyi celbetmek için, dayanağı aklı teklife (düşünmeye?) <span class=\"q\">؟<\/span> karşı susturmak olan birtakım ayinler koyarlar;"], [1229.4, "bu, yoga sporu denilen şeydir."], [1235.0, "Bu, putperest ilhadla ve vücûdî (vahdet-i vücûdcu), küfrî, iblisçe, kehânete dayalı inançla bağlantısından masum bir spor değildir."]]}, {"reader": false, "ar": [[1247.0, "ولذلك هم يحاولون إصماتَ العقل بوضع الجوارح على وضعيّةٍ معيّنةٍ لا تتحرّك،"], [1259.0, "وبإغماض العينين، أو رفعها،"], [1261.7, "أو التشخيص بها إلى السماء،"], [1265.1, "طلبًا لدخول هذه الطاقة."], [1269.0, "وبعضُهم يستعين ببعض التعاويذ التي يُمليها عليهم المعالجُ نفسُه،"], [1275.0, "وهي تعاويذُ لا تمتّ لا إلى كتابٍ ولا إلى سنّةٍ ولا إلى شرعٍ أبدًا،"], [1281.0, "بل كلُّها تعاويذُ تتضمّن نداءَ هؤلاء الشياطين الذين يدخلون جسدَ المتعالج أيضًا."]], "tr": [[1247.0, "Bu yüzden onlar, uzuvları hareket etmeyen belirli bir pozisyona koyarak, gözleri kapatarak, ya da gözleri yukarı kaldırarak veya gözleri göğe dikerek, bu enerjinin girmesini talep etmek için aklı susturmaya çalışırlar."], [1269.0, "Bir kısmı da tedavi edenin bizzat kendisinin onlara yazdırdığı bazı tılsım ve muskalardan yardım ister."], [1276.3, "Bunlar ne bir kitapla, ne bir sünnetle, ne de bir şeriatle asla ilgisi olmayan tılsımlardır;"], [1282.4, "bilakis hepsi, tedavi olanın bedenine de giren bu şeytanlara çağrı içeren tılsımlardır."]]}, {"reader": false, "ar": [[1290.0, "ولذلك كم تسبّبوا في سحر من يرتادهم من المتعالجين!"], [1295.0, "فحقيقةُ علاجهم أنه راجعٌ إلى السحر،"], [1299.0, "كما اعترف كثيرٌ ممّن تاب منهم،"], [1302.8, "فإنهم اعترفوا بأنّ ما يتعاطونه لا يمتّ إلى الإسلام ولا إلى العقيدة الصحيحة بصلة."], [1308.0, "فقيامُ هذا التداوي على عقيدة وحدة الوجود؛"], [1314.0, "بأنّ المتعالج يخضع أمام من يعالجه ويأتمر بأمره،"], [1320.0, "استجلابًا لتلك الطاقة الكونيّة لتدخل في جسده،"], [1325.0, "وهي عقيدةُ وحدة الوجود التي أجمع العلماءُ على كفر معتقديها."]], "tr": [[1290.0, "Bu yüzden kendilerine gidip gelen hastalardan nicelerine sihir yapılmasına sebep olmuşlardır!"], [1295.0, "Tedavilerinin hakikati sihre dayanmasıdır; nitekim onlardan tövbe eden birçok kişi bunu itiraf etmiştir."], [1302.3, "Onlar, uğraştıkları şeyin İslam'la da sahih akîdeyle de hiçbir ilgisi olmadığını itiraf etmişlerdir."], [1306.9, "Bu tedavinin vahdet-i vücûd akîdesine dayanması şöyledir:"], [1310.2, "Tedavi olan kişi, o kozmik enerjiyi celbedip bedenine girmesini sağlamak için kendisini tedavi edenin önünde boyun eğer ve onun emrine uyar."], [1324.3, "Bu da âlimlerin ona inananların küfrü üzerinde icmâ ettiği vahdet-i vücûd akîdesidir."]]}, {"reader": false, "ar": [[1332.0, "فالعلاجُ بالطاقة بأنواعه المختلفة ـ سواءٌ كان بما يسمّى بالرِّيكي أو غيرها من الأسماء التي لا أريد أن أُزعجكم بها ـ كلُّها قائمةٌ على هذه المخالفات العقديّة الإلحاديّة؛"], [1347.0, "وهي اعتقادُ أنّ ذات الله عز وجل متى ما كانت حالّةً في ذات المخلوق فإنه سيكون قويًّا صلبًا،"], [1360.7, "بعيدًا عن الوقوع فيما يضرّه أو يُزعجه أو يؤلمه."]], "tr": [[1332.0, "Enerjiyle tedavi, çeşitli türleriyle —ister \"reiki\" denilen şeyle olsun, ister sizi rahatsız etmek istemediğim başka isimlerle olsun— hepsi bu ilhadî akîde muhalefetlerine dayanır."], [1342.2, "Bu da şu inançtır: Allah Azze ve Celle'nin zâtı yaratılmışın zâtına hulûl ettiğinde, o kişi güçlü ve sağlam olur;"], [1358.0, "kendisine zarar veren, onu rahatsız eden veya acı veren şeylere düşmekten uzak olur."]]}]}, {"ts": "22:48", "title": "8. Külliye (devam): Kalpleri kâinata bağlamak", "paras": [{"reader": false, "ar": [[1367.8, "وممّا يوجب تحريمَها كذلك تعليقُ القلوب بالكون؛"], [1374.0, "فلا يعلّقون قلبَ المريض بالله عز وجل،"], [1378.6, "وإنما يعلّقونه بالكون، لاعتقادهم أنّ الإله أصلًا هو الكون،"], [1385.0, "وأنه ليس هناك فوق السماوات ربٌّ يُعبد،"], [1389.0, "ولا إلهٌ يُصلّى له ويُسجد،"], [1391.7, "وإنما الإلهُ الحقيقيّ الذي يُمِدّ بهذه الطاقة،"], [1395.5, "ويُمِدّ بهذا التدبير، ويُمِدّ بهذا التصريف،"], [1398.7, "ويشفي من يشاء، ويُمرض من يشاء،"], [1402.0, "ويتّصل بمن يشاء، وينفصل عمّن يشاء،"], [1405.8, "ويستجيب لمن يشاء، إنما هو الكون."]], "tr": [[1367.8, "Onu haram kılan şeylerden biri de kalpleri kâinata bağlamaktır."], [1374.7, "Hastanın kalbini Allah Azze ve Celle'ye bağlamazlar;"], [1378.6, "onu kâinata bağlarlar. Çünkü aslında ilahın kâinat olduğuna;"], [1383.9, "göklerin üstünde ibadet edilen bir Rab, kendisi için namaz kılınan ve secde edilen bir ilah bulunmadığına inanırlar."], [1393.3, "Onlara göre bu enerjiyi veren, bu tedbiri ve bu tasarrufu sağlayan, dilediğine şifa veren, dilediğini hasta eden, dilediğiyle bağ kuran, dilediğinden ayrılan ve dilediğine icabet eden gerçek ilah ancak kâinattır."]]}, {"reader": false, "ar": [[1409.0, "ولذلك يسمّونها بالطاقة الكونيّة،"], [1411.8, "وينسبون كلَّ آثار تطبيبهم لهذا الكون."], [1418.0, "فهو علاجٌ ينبني على تعبيد القلوب لهذا الكون وتأليه هذا الكون،"], [1425.0, "حتى وإن أرادوا أن يُخفوه ببعض العبارات الشرعيّة الإسلاميّة،"], [1432.0, "إلا أنه مفضوح؛ لأنه يصادم أصلَ الإسلام."]], "tr": [[1409.0, "Bu yüzden ona \"kozmik enerji\" adını verirler ve tedavilerinin bütün etkilerini bu kâinata nispet ederler."], [1419.3, "Bu, kalpleri bu kâinata kul etmeye ve bu kâinatı ilahlaştırmaya dayanan bir tedavidir."], [1427.1, "Onu birtakım şer'î, İslâmî ifadelerle gizlemek isteseler bile o rezil olmuştur; çünkü İslam'ın aslıyla çatışmaktadır."]]}, {"reader": false, "ar": [[1436.0, "وهم يعلّقون قلبَ المريض بهذا الكون،"], [1440.0, "ويُشعرونه بأنّ الكون هو الذي سيشفيه،"], [1444.0, "وهو الذي سيعافيه، وهو الذي سيُمِدّه بهذه الطاقة وبهذه القوّة،"], [1451.0, "وهذا حقيقةُ الشرك. فإنّ كلَّ من اعتقد أنّ في ذات الخالق شيئًا من ذوات خلقه،"], [1458.0, "أو أنّ في ذوات المخلوقين شيئًا من ذات الخالق، فإنه كافر."]], "tr": [[1436.0, "Onlar hastanın kalbini bu kâinata bağlarlar ve ona, kendisine şifa verecek olanın, afiyet verecek olanın, bu enerjiyi ve bu gücü verecek olanın kâinat olduğunu hissettirirler."], [1453.0, "İşte şirkin hakikati budur. Çünkü Yaratıcı'nın zâtında yaratılmışlarının zâtlarından bir şey bulunduğuna veya yaratılmışların zâtlarında Yaratıcı'nın zâtından bir şey bulunduğuna inanan herkes kâfirdir."]]}, {"reader": false, "ar": [[1465.0, "فهذا التداوي قائمٌ على مفاهيمَ متعلّقةٍ بنظرتهم للكون والوجود والإيمان،"], [1471.0, "وأنّ كلَّ الأمر يرجع إلى هذا الكون،"], [1474.0, "وأنّ هذا الكون هو الله،"], [1476.5, "وهو المدبّر، وهو المتصرّف،"], [1478.5, "وهو المستقلّ بهذا التدبير والتصريف؛"], [1481.0, "لأنهم يأخذونها مغلّفةً ومعلّبةً من هؤلاء الوثنيّين الشرقيّين."], [1488.0, "ولذلك لا يُعطَون مثلَ هذه الإجازات العالية إلا إذا سافروا وطلبوا هذا التطبيب وهذا التداوي من كبار البوذيّين في الصين،"], [1499.3, "وكبار البوذيّين في الهند،"], [1502.0, "وكبار البوذيّين فيما يسمّى بالتِّبِت وغيرها،"], [1506.0, "وهذه هي مناطقُ البوذيّة السيخيّة الهندوسيّة."]], "tr": [[1465.0, "Bu tedavi, onların kâinata, varlığa ve imana bakışlarıyla ilgili kavramlara dayanır:"], [1470.4, "Bütün işin bu kâinata döndüğü;"], [1472.7, "bu kâinatın Allah olduğu, tedbir edenin, tasarruf edenin ve bu tedbir ve tasarrufta müstakil olanın o olduğu (inancına)."], [1480.5, "Çünkü bunları o Doğulu putperestlerden paketlenmiş ve konserve edilmiş hâlde alıyorlar."], [1488.0, "Bu yüzden bu tür yüksek icazetler (sertifikalar) onlara ancak seyahat edip bu tababeti ve bu tedaviyi Çin'deki büyük Budistlerden, Hindistan'daki büyük Budistlerden, Tibet denilen yerdeki ve başka yerlerdeki büyük Budistlerden talep ettiklerinde verilir."], [1505.7, "İşte bunlar Budist, Sih ve Hindu bölgeleridir."]]}]}, {"ts": "25:11", "title": "8. Külliye (devam): Ayetlere ve isimlere delilsiz etki isnat etmek, rakamlar", "paras": [{"reader": false, "ar": [[1511.0, "ومنها أيضًا اعتقادُهم القوّةَ التأثيريّةَ فيما لم يرد بتأثيره بعينه دليل؛"], [1526.0, "فيجعلون لكلّ آيةٍ من القرآن تأثيرًا خاصًّا وتطبيبًا خاصًّا،"], [1534.0, "ويعتقدون في كلّ اسمٍ من أسماء الله عز وجل تطبيبًا خاصًّا وأثرًا خاصًّا."], [1539.0, "فإذا كنتَ تريد السعادةَ فعليك تكرارُ اسم كذا وكذا وكذا،"], [1543.0, "وعليك أن تعيش مع هذا الاسم."], [1546.0, "وإذا كنتَ تريد الزواجَ فعليك باسم كذا."], [1549.0, "وإذا كنتَ تريد كذا فعليك باسم كذا."]], "tr": [[1511.0, "Bunlardan biri de, bizzat etkisine dair delil gelmeyen şeylerde etkileyici bir güç bulunduğuna inanmalarıdır."], [1528.1, "Kur'an'ın her ayetine özel bir etki ve özel bir tedavi biçerler;"], [1535.9, "Allah Azze ve Celle'nin isimlerinden her birinde özel bir tedavi ve özel bir etki bulunduğuna inanırlar."], [1542.2, "\"Mutluluk istiyorsan şu şu ismi tekrar etmelisin, bu isimle yaşamalısın."], [1546.9, "Evlenmek istiyorsan şu isme sarıl."], [1549.0, "Şunu istiyorsan şu isme sarıl\" (derler)."]]}, {"reader": false, "ar": [[1552.0, "فهم يربطون هذا التداوي بقوّةٍ تأثيريّةٍ في آيات القرآن،"], [1559.0, "أو بشيءٍ من أسماء الله عز وجل،"], [1563.0, "وهذا كلُّه من باب التدليس والتلبيس حتى يُؤسلِموه فقط."], [1567.0, "حتى لمّا جاؤوا يُؤسلِمونه أخطؤوا في أسلمته،"], [1573.0, "وابتدعوا في أسلمته؛ لأنّ كلَّ من زعم أنّ لكلّ اسمٍ من أسماء الله طاقةً كونيّةً تأثيريّةً فإنه مبتدعٌ ضالّ،"], [1582.0, "وكلُّ من اعتقد أنّ في كلّ آيةٍ من آيات القرآن طاقةً تأثيريّةً بخصوصها بلا دليلٍ يُثبتها فإنّ ذلك من الضلال ومن البدع."]], "tr": [[1552.0, "Onlar bu tedaviyi Kur'an ayetlerindeki veya Allah Azze ve Celle'nin isimlerinden bazılarındaki etkileyici bir güce bağlarlar."], [1561.9, "Bütün bunlar sadece onu İslâmîleştirmek için yapılan bir aldatma ve karıştırmadır."], [1566.6, "Hatta onu İslâmîleştirmeye kalkıştıklarında İslâmîleştirmede de hata ettiler ve İslâmîleştirmede de bid'at icat ettiler."], [1575.4, "Çünkü Allah'ın isimlerinden her birinin etkileyici kozmik bir enerjisi olduğunu iddia eden herkes sapık bir bid'atçidir."], [1582.0, "Kur'an ayetlerinden her birinde, onu isbat eden bir delil olmaksızın, kendine özgü etkileyici bir enerji bulunduğuna inanan herkesin bu inancı da sapıklık ve bid'attir."]]}, {"reader": false, "ar": [[1595.0, "وممّا يوجب منعَه أيضًا تعليقُ أمورٍ بالأرقام،"], [1600.0, "تعليقُ أمورٍ ببعض الأرقام؛"], [1602.0, "فيجعلون كودَ الطاقة الكونيّة أرقامًا معيّنة،"], [1606.2, "وهي: ثلاثة وستّة وتسعة،"], [1612.0, "فيجعلون هذا هو الذي يفكّ الشفرةَ الكونيّة."], [1617.0, "يعني بمعنى ـ انتبه ـ أنك إذا استطعتَ أن تفكّ الشفرةَ الكونيّة فإنك ستكون مشاركًا لله في التدبير الكونيّ؛"], [1626.0, "فتستطيع أن تشفي من شئت،"], [1628.5, "وأن تُمرض من شئت،"], [1630.5, "وأن تجلب الحبيبَ كما شئت،"], [1633.0, "وأن تقرّب من شئت،"], [1635.0, "وأن تُبعد من شئت."]], "tr": [[1595.0, "Onun yasaklanmasını gerektiren şeylerden biri de bazı işleri rakamlara, bazı işleri birtakım rakamlara bağlamaktır."], [1605.5, "Kozmik enerjinin kodunu belirli rakamlar yaparlar:"], [1613.4, "üç, altı ve dokuz. Kozmik şifreyi çözenin bu olduğunu söylerler."], [1620.7, "Yani —dikkat et— kozmik şifreyi çözebilirsen kâinatın tedbirinde Allah'a ortak olacaksın;"], [1628.0, "dilediğine şifa verebilecek, dilediğini hasta edebilecek, sevgiliyi dilediğin gibi getirebilecek, dilediğini yaklaştırıp dilediğini uzaklaştırabileceksin (derler)."]]}, {"reader": false, "ar": [[1637.0, "زعمًا منهم أنّ الله عز وجل لا يتحكّم في هذا الكون إلا بناءً على أرقامٍ معيّنة،"], [1643.0, "فهم يحاولون فكَّ هذه الشفرة الرقميّة حتى يشاركوا الله عز وجل في كونه."], [1651.0, "وكلُّ ذلك ـ والله ـ من أعظم الكفر والشرك."], [1654.0, "ولكن عجبًا لكثيرٍ من الجهّال يقبلونه أو يعتمدونه!"]], "tr": [[1637.0, "(Bunu da) Allah Azze ve Celle'nin bu kâinatı ancak belirli rakamlara dayanarak yönettiğini iddia ederek (söylerler)."], [1642.6, "Bu rakamsal şifreyi çözmeye çalışırlar ki kâinatında Allah Azze ve Celle'ye ortak olsunlar."], [1649.8, "Vallahi bütün bunlar en büyük küfür ve şirktendir."], [1653.6, "Fakat cahillerden birçoğunun bunu kabul etmesine veya benimsemesine şaşılır!"]]}]}, {"ts": "27:40", "title": "8. Külliye (devam): Resmî yasak, bu akımın davetçileri ve onlardan sakındırmak", "paras": [{"reader": false, "ar": [[1660.0, "ولذلك ـ ولله الحمدُ والمنّة ـ رُفض في كثيرٍ من بلاد الإسلام اعتمادُه،"], [1666.0, "خاصّةً في دولتنا بقرارٍ من مجلس الوزراء؛"], [1670.0, "لأنّ ما يسمّى بالتداوي بالطاقة الكونيّة غيرُ مسموحٍ مزاولتُه،"], [1676.0, "ويجب معاقبةُ مُزاوِله ـ إن ثبتت عليه مزاولتُه ـ بالعقوبة الشرعيّة المقرّرة في القانون أو في النظام السعوديّ."], [1685.0, "وهذا من نعمة الله علينا."]], "tr": [[1660.0, "Bu yüzden —Allah'a hamd ve minnet olsun— birçok İslam ülkesinde onun benimsenmesi reddedilmiştir;"], [1667.1, "özellikle bizim devletimizde Bakanlar Kurulu kararıyla."], [1670.7, "Çünkü kozmik enerjiyle tedavi denilen şeyin uygulanmasına izin verilmez;"], [1676.7, "onu uygulayan kişi, uyguladığı sabit olursa, kanunda veya Suudi nizamında belirlenmiş şer'î cezayla cezalandırılmalıdır."], [1684.1, "Bu, Allah'ın bize olan nimetlerindendir."]]}, {"reader": false, "ar": [[1687.0, "وإنّ من أعظم من يدعو له رجلٌ مصريٌّ يقال له:"], [1691.0, "أحمد عمارة، أو محمد عمارة؛"], [1693.0, "فإنه من أعظم من ينشر هذا،"], [1696.3, "ويقيم الدوراتِ الكثيرة في وسائل التواصل المتنوّعة،"], [1700.6, "وقد تخرّج على يديه كثيرٌ من هؤلاء المعالجين في كثيرٍ من الدول الإسلاميّة."], [1710.0, "والعجيبُ أنه يقول المقالاتِ الكفريّة،"], [1713.0, "الكفريّة: فيقول: إنّ الكون هو الله،"], [1718.0, "ويقول بأنّ فرعون لمّا قال بأنني ربُّكم الأعلى كان صادقًا،"], [1725.0, "ويصحّح عباداتِ أهل الأوثان؛"], [1727.7, "لأنهم يعتقدون أنّ ذات الله قد حلّت في هذه الحجارة،"], [1735.0, "فإذا عبد الناسُ تلك الحجارةَ فإنما يعبدون الله عز وجل."]], "tr": [[1687.0, "Buna davet edenlerin en büyüklerinden biri, Ahmed İmâre veya Muhammed İmâre denilen Mısırlı bir adamdır."], [1692.6, "O, bunu en çok yayanlardan biridir;"], [1695.8, "çeşitli sosyal medya araçlarında pek çok kurs düzenler."], [1700.6, "Birçok İslam ülkesinde bu tedavicilerin birçoğu onun elinden yetişmiştir."], [1706.6, "İşin şaşırtıcı yanı, o küfrî sözler, küfrî sözler söylüyor."], [1712.4, "Kâinatın Allah olduğunu söylüyor; Firavun'un \"Ben sizin en yüce Rabbinizim\" dediğinde doğru söylediğini söylüyor;"], [1722.9, "putperestlerin ibadetlerini doğru sayıyor, çünkü onlar Allah'ın zâtının bu taşlara hulûl ettiğine inanıyorlar;"], [1731.7, "insanlar o taşlara ibadet ettiklerinde aslında Allah Azze ve Celle'ye ibadet etmiş oluyorlar (diyor)."]]}, {"reader": false, "ar": [[1740.0, "ويقول بأنّ جميع الكتب السماويّة كلَّها محرّفة،"], [1743.9, "ومنها القرآن، ومنها القرآن،"], [1746.4, "ويقول غيرَ ذلك. وقد صدرت فيه الفتاوى بالحكم عليه بكفره عينًا،"], [1754.0, "ولكن لا تزال فتنتُه عظيمةً وعامّة،"], [1757.9, "فلا بدّ من الحذر والتحذير منه."]], "tr": [[1740.0, "Bütün semavî kitapların tahrif edildiğini, Kur'an'ın da bunlardan olduğunu —Kur'an'ın da— söylüyor ve bunun dışında başka şeyler de söylüyor."], [1750.4, "Onun hakkında, şahsen (aynen) küfrüne hükmeden fetvalar çıkmıştır."], [1755.4, "Fakat fitnesi hâlâ büyük ve yaygındır;"], [1758.4, "ondan sakınmak ve sakındırmak gerekir."]]}, {"reader": false, "ar": [[1762.0, "والخلاصةُ من ذلك أيّها الإخوان ـ والأمرُ طويل،"], [1766.3, "وقد أُلّف في ـ يعني ـ في ردّه المؤلّفاتُ الكثيرة،"], [1770.0, "وفُتحت فيه المواقعُ الكثيرة،"], [1771.0, "ويعجبني ـ يعني ـ كثيرًا بعضُ المواقع لبعض التائبين الذين وصلوا إلى نهايات الطريق،"], [1781.0, "وعرفوا الأمرَ على حقيقته،"], [1784.0, "ثم صاروا يحذّرون الناس،"], [1786.0, "وصاروا يستقبلون كلَّ تائبٍ من هذه المعالجات أو المزاولات."]], "tr": [[1762.0, "Ey kardeşler, bundan çıkan özet —mesele uzundur;"], [1765.7, "onu reddetmek için birçok eser telif edilmiş, bu konuda birçok site açılmıştır."], [1770.8, "Yolun sonuna kadar varmış, meseleyi hakikatiyle öğrenmiş, sonra insanları sakındırmaya başlamış ve bu tedavilerden veya uygulamalardan tövbe eden herkesi kabul etmeye başlamış bazı tövbekârların bazı siteleri doğrusu çok hoşuma gidiyor—."]]}, {"reader": false, "ar": [[1792.0, "والخلاصةُ من ذلك: أنّ المعتقِد بهذه الطاقة الكونيّة لا جرمَ أنه قد تلبّس بكثيرٍ من شُعب الشرك الأكبر والعياذ بالله،"], [1800.0, "وقد تلبّس بشُعبٍ كثيرةٍ من شُعب الباطل،"], [1805.0, "واقتفى أثرَ أهله بقدر ما أخذ منه."], [1808.0, "وهو عندنا ـ معاشرَ أهل العلم ـ أنه كاهنٌ دجّالٌ لا يجوز الإتيانُ إليه،"], [1816.0, "ولا يجوز التداوي عنده."]], "tr": [[1792.0, "Bundan çıkan özet şudur: Bu kozmik enerjiye inanan kişi, şüphesiz büyük şirkin birçok şubesine bulaşmıştır —Allah korusun—;"], [1799.0, "bâtılın birçok şubesine bulaşmış ve ondan aldığı ölçüde bâtıl ehlinin izinden gitmiştir."], [1805.9, "Biz ilim ehli topluluğuna göre o, kendisine gidilmesi caiz olmayan ve yanında tedavi olunması caiz olmayan bir kâhin ve deccaldir."]]}]}, {"ts": "30:18", "title": "8. Külliye (sonu): Kâhinlere gitmeyi yasaklayan delillere dâhil olmaları", "paras": [{"reader": false, "ar": [[1818.0, "وجميعُ الأدلّة التي تحذّر من إتيان الكهّان والدجاجلة يدخل فيها المعالجُ بالطاقة الكونيّة دخولًا أوّليًّا،"], [1826.8, "ولا شكّ في ذلك."], [1830.0, "فمن جاء متعالجًا عندهم وصدّقهم فيما يقولون:"], [1834.0, "فإن كان قد صدّقهم فيما هو من قبيل الغيب المطلق فهو كافرٌ الكفرَ الأكبر،"], [1839.0, "وإن صدّقهم فيما هو من قبيل مطلق الغيب ـ أو الغيب النسبيّ ـ فهو كافرٌ الكفرَ الأصغر."], [1845.0, "وإن جاء سائلًا غيرَ مصدِّقٍ فإنه لا تُقبل صلاتُه أربعين يومًا، أربعين يومًا."]], "tr": [[1818.0, "Kâhinlere ve deccallara gitmekten sakındıran bütün delillere, kozmik enerjiyle tedavi eden kişi öncelikli olarak dâhildir;"], [1825.5, "bunda hiç şüphe yoktur. Kim onların yanına tedavi olmak için gelir ve söylediklerinde onları tasdik ederse:"], [1834.4, "Eğer onları mutlak gayb kabilinden olan bir şeyde tasdik etmişse büyük küfürle kâfirdir;"], [1838.6, "eğer onları mutlak olmayan gayb —yani nisbî gayb— kabilinden olan bir şeyde tasdik etmişse küçük küfürle kâfirdir."], [1844.6, "Eğer tasdik etmeden soru sormak için gelmişse, onun namazı kırk gün kabul edilmez; kırk gün."]]}, {"reader": false, "ar": [[1857.0, "فهو علاجٌ مبنيٌّ على الأوهام،"], [1861.0, "وعلى الدجل، وعلى الخرافة."], [1864.0, "فلا يجوز الدخولُ في مواقعهم،"], [1867.0, "ولا قراءةُ مصنّفاتهم، ولا قبولُ كلامهم،"], [1871.0, "ولا الانصياعُ لعلاجهم، ولا دلالةُ الناس عليهم مطلقًا،"], [1875.0, "بل يجب التحذيرُ والحذرُ منهم،"], [1878.0, "وذكرُهم بأسمائهم، لا كثّرهم الله،"], [1881.0, "وأسأل الله أن يفضحهم عن بَكْرة أبيهم. والله أعلم."]], "tr": [[1857.0, "O, vehimlere, sahtekârlığa ve hurafeye dayanan bir tedavidir."], [1862.5, "Bu yüzden onların sitelerine girmek, eserlerini okumak, sözlerini kabul etmek, tedavilerine boyun eğmek ve insanlara onları göstermek hiçbir şekilde caiz değildir."], [1874.2, "Bilakis onlardan sakındırmak, sakınmak ve onları isimleriyle anmak gerekir."], [1879.2, "Allah onları çoğaltmasın; Allah'tan onları topyekûn rezil etmesini dilerim. Allah en iyisini bilir."]]}]}, {"ts": "31:27", "title": "9. Külliye: Kâhine gitme anlamına giren her şey haramdır; ancak hâlis veya râcih bir maslahat için müstesna", "paras": [{"reader": false, "ar": [[1887.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما يدخل في معنى إتيان الكاهن فمحرَّمٌ إلا لمصلحةٍ خالصةٍ أو راجحة.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span> أقول وبالله التوفيق:"]], "tr": [[1887.0, "Külliyelerden biri de şudur: 9."], [1889.0, "külliye: Kâhine gitme anlamına giren her şey haramdır;"], [1891.3, "ancak hâlis veya râcih (ağır basan) bir maslahat için olursa müstesna. (Üç kez tekrar ediyor.) Tevfik Allah'tandır, derim ki:"]]}, {"reader": false, "ar": [[1920.0, "في الحديث عن معاوية بن الحكم السُّلَميّ رضي الله تعالى عنه أنه قال:"], [1927.0, "«يا رسول الله، إنّي امرؤٌ حديثُ عهدٍ بجاهليّة، وقد جاءنا الله بالإسلام، وإنّ منّا أناسًا يأتون الكهّان. قال: فلا تأتهم. قلتُ: ومنّا رجالٌ يتطيّرون. قال: ذاك شيءٌ يجدونه في صدورهم فلا يصدّنّهم. قلتُ: فمنّا رجالٌ يخطّون. قال: كان نبيٌّ من الأنبياء يخطّ، فمن وافق خطَّه فذاك»."], [1955.1, "يعني أنّ موافقة القدر للخطّ كان معجزةً أجراها الله عز وجل على يد نبيّ، لا يستطيعها أحد."]], "tr": [[1920.0, "Muâviye b. el-Hakem es-Sülemî'den —Allah Teâlâ ondan razı olsun— gelen hadiste şöyle dediği rivayet edilir:"], [1926.0, "\"Ey Allah'ın Resûlü! Ben câhiliyeden yeni çıkmış bir adamım."], [1929.5, "Allah bize İslam'ı getirdi. Bizden bazı kimseler kâhinlere gidiyor."], [1933.2, "Buyurdu ki: Onlara gitme. Dedim ki:"], [1936.0, "Bizden bazı adamlar uğursuzluğa inanıyor."], [1939.8, "Buyurdu ki: Bu, göğüslerinde buldukları bir şeydir;"], [1944.0, "sakın bu onları (yollarından) alıkoymasın."], [1946.0, "Dedim ki: Bizden bazı adamlar (kum üzerine) çizgi çekiyor."], [1950.5, "Buyurdu ki: Peygamberlerden bir peygamber çizgi çekerdi;"], [1953.5, "kimin çizgisi onunkine uyarsa işte o (doğrudur).\" Yani kaderin çizgiyle uyuşması, Allah Azze ve Celle'nin bir peygamberin elinde yarattığı bir mucizeydi; kimse buna güç yetiremez."]]}, {"reader": false, "ar": [[1964.0, "وعن أبي مسعودٍ البدريّ رضي الله عنه:"], [1967.2, "«أنّ رسول الله صلى الله عليه وسلم نهى عن ثمن الكلب، ومهر البغيّ، وحُلوان الكاهن»،"], [1974.0, "وهو ما يدفعه من يأتيه ليتكهّن له."]], "tr": [[1964.0, "Ebû Mes'ûd el-Bedrî'den —Allah ondan razı olsun— rivayet edildiğine göre:"], [1967.6, "\"Resûlullah sallallâhu aleyhi ve sellem köpeğin parasını, fahişenin ücretini ve kâhinin hulvânını yasakladı.\" Hulvân, kâhine gelen kişinin, kendisi için kehânette bulunsun diye ona ödediği şeydir."]]}, {"reader": false, "ar": [[1978.0, "وعن عائشة رضي الله عنها قالت:"], [1982.0, "«سُئل رسول الله صلى الله عليه وسلم عن الكهّان، فقال: ليسوا بشيء. فقالوا: يا رسول الله، إنهم يحدّثون أحيانًا بشيءٍ فيكون حقًّا. فقال رسول الله صلى الله عليه وسلم: تلك الكلمة من الحقّ يخطفها الجنّيّ فيقرّها في أذن وليّه، فيخلطون معها مئةَ كذبة». والحديثُ متّفقٌ عليه."]], "tr": [[1978.0, "Âişe'den —Allah ondan razı olsun— şöyle dediği rivayet edilir:"], [1982.3, "\"Resûlullah sallallâhu aleyhi ve sellem'e kâhinler soruldu."], [1984.3, "'Onlar bir şey değildir' buyurdu."], [1986.9, "Dediler ki: Ey Allah'ın Resûlü!"], [1990.5, "Onlar bazen bir şey söylüyorlar ve o doğru çıkıyor."], [1994.0, "Resûlullah sallallâhu aleyhi ve sellem buyurdu ki:"], [1997.4, "O, haktan bir kelimedir; cinnî onu kapar ve dostunun kulağına bırakır."], [2002.0, "Onlar da onunla birlikte yüz yalan karıştırırlar.\" Hadis müttefekun aleyhtir."]]}, {"reader": false, "ar": [[2008.0, "فإن قلت: ولماذا قلتَ في الكلّيّة:"], [2011.5, "«ما يدخل في معنى إتيان الكاهن»؟"], [2015.0, "فأقول: ذلك لأنّ إتيان الكاهن ينقسم إلى قسمين:"], [2022.0, "إلى إتيانٍ حقيقيّ، وإلى إتيانٍ حكميّ."], [2027.0, "فأمّا الإتيانُ الحقيقيّ فهو أن يأتي الكاهنَ فيقابلَه بنفسه،"], [2038.0, "فيكون مجتمعًا معه تحت سقفٍ واحد،"], [2042.0, "فلا جرمَ أنّ هذا النوع من الإتيان يدخل في الحديث دخولًا أوّليًّا."]], "tr": [[2008.0, "Eğer \"Külliyede neden 'kâhine gitme anlamına giren' dedin?\" dersen, derim ki:"], [2015.0, "Çünkü kâhine gitmek iki kısma ayrılır:"], [2020.1, "Hakiki gitme ve hükmî gitme."], [2025.1, "Hakiki gitme, kişinin kâhine gidip onunla bizzat yüz yüze görüşmesi, onunla aynı çatı altında bir araya gelmesidir."], [2042.8, "Şüphesiz bu tür gitme hadise öncelikli olarak dâhildir."]]}, {"reader": false, "ar": [[2047.0, "لكن هناك إتيانٌ حكميّ،"], [2049.7, "وهو أن يتّصل بالكاهن بأيّ وسيلةٍ من الوسائل الحديثة."], [2056.0, "والمتقرّر في القواعد أنّ الإتيان الحكميّ منزّلٌ منزلةَ الإتيان الحقيقيّ."], [2063.0, "فمتى ما اتّصل الإنسانُ بأحد الكهّان أو العرّافين أو المشعوذين أو المعالجين بالطاقة الكونيّة أو السحرة بأيّ نوعٍ من أنواع التواصل،"], [2076.0, "فإنه داخلٌ في هذه العقوبات وهذا الذمّ الوارد في هذه الأحاديث التي تلوتُها عليكم."]], "tr": [[2047.0, "Fakat bir de hükmî gitme vardır:"], [2051.1, "Kişinin modern vasıtalardan herhangi biriyle kâhinle iletişime geçmesidir."], [2057.4, "Kaidelerde sabit olan şudur: Hükmî gitme, hakiki gitme yerine konur."], [2064.3, "Dolayısıyla insan kâhinlerden, arrâflardan, şarlatanlardan, kozmik enerjiyle tedavi edenlerden veya sihirbazlardan biriyle herhangi bir iletişim türüyle irtibata geçtiğinde, size okuduğum bu hadislerde gelen bu cezalara ve bu kınamaya dâhil olur."]]}, {"reader": false, "ar": [[2084.0, "فيدخل في ذلك الدخولُ في مواقعهم،"], [2088.0, "وسؤالُهم على ما يسمّى بالخاصّ في مواقعهم في وسائل التواصل،"], [2096.0, "ويدخل في ذلك أيضًا مراسلتُهم،"], [2099.5, "ويدخل في ذلك أيضًا مهاتفتُهم."], [2103.0, "فكلُّ ما يدخل في معنى إتيان الكهّان حكمًا فإنه منزّلٌ منزلةَ إتيانهم حقيقةً، وهذا واضح."]], "tr": [[2084.0, "Buna onların sitelerine girmek ve sosyal medyadaki hesaplarında \"özel mesaj\" denilen yoldan onlara soru sormak dâhildir;"], [2096.0, "onlarla yazışmak da buna dâhildir, onlarla telefonla konuşmak da buna dâhildir."], [2103.7, "Hükmen kâhinlere gitme anlamına giren her şey, onlara hakikaten gitme yerine konur. Bu açıktır."]]}]}, {"ts": "35:17", "title": "9. Külliye (devam): Kâhine gitmenin kısımları — Merakla sormak ve namazın kabul edilmemesi", "paras": [{"reader": false, "ar": [[2117.0, "فإن قلت: ولماذا قلتَ في الكلّيّة:"], [2121.1, "«إلا لمصلحةٍ خالصةٍ أو راجحة»؟"], [2129.0, "فأقول: ذلك لأنّ العلماء ـ رحمهم الله تعالى ـ قسّموا إتيانَ الكهّان إلى جُمَلٍ من الأقسام:"], [2139.0, "أوّلًا: أن يأتي إلى الكاهن فيسألَه من غير أن يصدّقه،"], [2145.7, "وإنما عنده حبُّ استطلاعٍ فقط،"], [2151.0, "فيريد أن يطّلع على كيفيّة عمل هذا الكاهن فقط."]], "tr": [[2117.0, "Eğer \"Külliyede neden 'ancak hâlis veya râcih bir maslahat için olursa müstesna' dedin?\" dersen, derim ki:"], [2132.4, "Çünkü âlimler —Allah onlara rahmet etsin— kâhinlere gitmeyi birkaç kısma ayırmışlardır."], [2141.0, "Birincisi: Kişinin kâhine gidip onu tasdik etmeden ona soru sormasıdır;"], [2147.7, "sadece merakı vardır, yalnızca bu kâhinin nasıl çalıştığını görmek ister."]]}, {"reader": false, "ar": [[2159.0, "فهذا إن فعله أحدٌ فإنّنا نقول:"], [2162.2, "إنه لا تُقبل له صلاةٌ أربعين يومًا،"], [2166.0, "لما ثبت في صحيح الإمام مسلمٍ أنّ النبيّ صلى الله عليه وسلم قال:"], [2172.4, "«من أتى عرّافًا فسأله عن شيءٍ لم تُقبل له صلاةٌ أربعين يومًا»."]], "tr": [[2159.0, "Bunu biri yaparsa deriz ki:"], [2161.7, "Onun kırk gün namazı kabul edilmez."], [2164.9, "Çünkü İmam Müslim'in Sahîh'inde Peygamber sallallâhu aleyhi ve sellem'in şöyle buyurduğu sabit olmuştur:"], [2171.5, "\"Kim bir arrâfa gidip ona bir şey sorarsa, onun kırk gün namazı kabul edilmez.\""]]}, {"reader": false, "ar": [[2177.0, "فإن قلت: وما معنى نفي القبول هنا؟"], [2184.0, "فأقول: المتقرّر في القواعد أنّ نفي القبول متى ما عُلّق بفعلٍ محظورٍ فيُراد به ذهابُ الأجر،"], [2195.0, "لا إبطالُ أصل الصحّة."], [2197.0, "وبما أنّ نفي القبول في هذا الحديث عُلّق بأمرٍ حرامٍ ـ وهو إتيانُ الكاهن ـ فيكون معناه أنّ صلاته لا أجرَ له فيها."], [2211.0, "فليس المقصود أن يعطّل أصلَ الصلاة؛"], [2214.0, "فإنه لو ترك الصلاة لكان كافرًا،"], [2218.0, "ولكن يجب عليه أن يصلّي،"], [2220.5, "إلا أنه محرومٌ في صلاته أربعين يومًا من أجرها،"], [2225.0, "فهو يصلّي لتبرأ ذمّتُه فقط،"], [2228.0, "ولكن لا أجرَ له في صلاته."]], "tr": [[2177.0, "Eğer \"Burada kabulün nefyedilmesinin anlamı nedir?\" dersen, derim ki:"], [2185.4, "Kaidelerde sabit olan şudur: Kabulün nefyi yasak bir fiile bağlandığında, bununla sevabın gitmesi kastedilir;"], [2195.5, "sıhhatin aslının iptali kastedilmez. Bu hadiste kabulün nefyi haram bir şeye —kâhine gitmeye— bağlandığına göre, bunun anlamı o kişinin namazında kendisine sevap olmadığıdır."], [2211.0, "Kastedilen namazın aslını iptal etmesi değildir;"], [2214.0, "çünkü namazı terk etse kâfir olurdu."], [2218.0, "Bilakis namaz kılması vâciptir; ancak kırk gün boyunca namazında onun sevabından mahrumdur."], [2224.5, "Sadece zimmeti borçtan kurtulsun diye kılar, fakat namazında ona sevap yoktur."]]}]}, {"ts": "37:11", "title": "9. Külliye (devam): Nisbî ve mutlak gayb hakkında sorup tasdik etmek", "paras": [{"reader": false, "ar": [[2231.0, "القسمُ الثاني: أن يأتي إلى الكاهن فيسألَه ـ انتبهوا ـ عن غيبٍ نسبيٍّ ويصدّقه،"], [2243.0, "فهذا يُعتبر كافرًا الكفرَ الأصغر؛"], [2249.0, "كأن يسأله عن مكان ضالّته التي ضلّت منه،"], [2256.0, "أو يسأله عن السارق الذي سرق مالَه،"], [2259.0, "أو نحو ذلك ممّا هو من الغيب النسبيّ الذي قد غاب عن بعضٍ ولم يغب عن بعض."], [2269.0, "فمتى ما كان السؤالُ عن الغيب النسبيّ،"], [2274.0, "وصدّقه فيما يقول ويدّعي،"], [2276.8, "فإنه يُعتبر كافرًا الكفرَ الأصغر."]], "tr": [[2231.0, "İkinci kısım: Kişinin kâhine gidip ona —dikkat edin— nisbî bir gayb hakkında sorması ve onu tasdik etmesidir."], [2246.2, "Bu kişi küçük küfürle kâfir sayılır."], [2252.6, "Meselâ ona kaybolan hayvanının yerini sorması, malını çalan hırsızı sorması veya bunun gibi, bazılarından gizli olup bazılarından gizli olmayan nisbî gayb kabilinden bir şey sorması gibi."], [2267.9, "Soru nisbî gayb hakkında olduğunda ve onu söylediği ve iddia ettiği şeyde tasdik ettiğinde, küçük küfürle kâfir sayılır."]]}, {"reader": false, "ar": [[2286.0, "الثالث: أن يأتي إلى الكاهن ـ انتبهوا معي ـ ويسألَه عن الغيب المطلق فيصدّقه،"], [2300.0, "فهذا يُعتبر كافرًا الكفرَ الأكبر؛"], [2305.0, "لأنّ المتقرّر في القواعد أنّ كلَّ من سوّى غيرَ الله بالله في شيءٍ من خصائص الله،"], [2315.0, "فالتسويةُ المطلقة ـ فكافرٌ الكفرَ الأكبر."], [2319.0, "ومن خصائص ربوبيّته عز وجل انفرادُه ووحدانيّتُه بعلم الغيب المطلق،"], [2325.0, "كما قال الله عز وجل:"], [2327.3, "<span class=\"ayah\">﴿قُل لَّا يَعْلَمُ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ الْغَيْبَ إِلَّا اللَّهُ﴾<\/span> <span class=\"ref\">[النمل: ٦٥]<\/span>."]], "tr": [[2286.0, "Üçüncüsü: Kişinin kâhine gidip —benimle birlikte dikkat edin— ona mutlak gayb hakkında sorması ve onu tasdik etmesidir."], [2300.8, "Bu kişi büyük küfürle kâfir sayılır."], [2305.0, "Çünkü kaidelerde sabit olan şudur:"], [2307.5, "Allah'ın hasâisinden (O'na özgü niteliklerinden) birinde Allah'tan başkasını Allah'a eşit tutan herkes —(bu) mutlak eşit tutmadır— büyük küfürle kâfirdir."], [2317.4, "Allah Azze ve Celle'nin rubûbiyyetinin hasâisinden biri de mutlak gayb ilminde tek ve yegâne olmasıdır."], [2324.4, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2327.3, "<span class=\"ayah\">﴿De ki: Göklerde ve yerde olanlar gaybı bilemez, ancak Allah bilir﴾<\/span> [Neml 65]."]]}, {"reader": false, "ar": [[2332.0, "فإذا كان السؤالُ عن الغيب المطلق،"], [2335.9, "وأخبرك الكاهنُ به وصدّقتَه،"], [2338.5, "فهذا التصديقُ يوجب لك الخروجَ عن ملّة الإسلام بالكلّيّة."], [2344.7, "وكلا القسمين الأخيرين يدلّ عليهما قولُ النبيّ صلى الله عليه وسلم:"], [2351.5, "«من أتى كاهنًا أو عرّافًا فسأله عن شيءٍ فصدّقه بما يقول فقد كفر بما أُنزل على محمد صلى الله عليه وسلم»."]], "tr": [[2332.0, "Soru mutlak gayb hakkında olur, kâhin sana onu haber verir ve sen de onu tasdik edersen, bu tasdik senin İslam milletinden tamamen çıkmanı gerektirir."], [2344.7, "Son iki kısmın her ikisine de Peygamber sallallâhu aleyhi ve sellem'in şu sözü delalet eder:"], [2352.1, "\"Kim bir kâhine veya arrâfa gidip ona bir şey sorar ve onu söylediği şeyde tasdik ederse, Muhammed sallallâhu aleyhi ve sellem'e indirilene küfretmiş olur.\""]]}, {"reader": false, "ar": [[2362.0, "وهذا الكفرُ قد يكون الكفرَ الأكبر تارةً،"], [2368.0, "وقد يكون الكفرَ الأصغر تارةً،"], [2371.0, "على حسب الغيب الذي تسأل الكاهنَ عنه."], [2374.0, "فإن سألتَه عن غيبٍ نسبيٍّ وصدّقتَه فيه فكفرُك هو الكفرُ الأصغر،"], [2380.0, "وإن سألتَه عن غيبٍ مطلقٍ فصدّقتَه فكفرُك هو الكفرُ الأكبر."]], "tr": [[2362.0, "Bu küfür, kâhine sorduğun gaybın türüne göre bazen büyük küfür, bazen de küçük küfür olur."], [2372.3, "Ona nisbî bir gayb sorar ve onu bunda tasdik edersen küfrün küçük küfürdür;"], [2378.9, "ona mutlak bir gayb sorar ve onu tasdik edersen küfrün büyük küfürdür."]]}]}, {"ts": "39:47", "title": "9. Külliye (sonu): Kâhinin sahteliğini ortaya çıkarmak için ona gitmek vâciptir", "paras": [{"reader": false, "ar": [[2387.0, "القسمُ الرابع ـ أو الخامس ـ القسمُ الرابع:"], [2388.4, "أن يأتيه فيسألَه ليُظهر زيفَ كهانته،"], [2401.0, "ولينكر عليه كهانتَه، وليبيّن حالَه للناس،"], [2410.0, "فهذا واجبٌ مع القدرة."], [2413.0, "وهو الذي نقصده بقولنا في الكلّيّة:"], [2416.8, "«إلا لمصلحةٍ خالصةٍ أو راجحة»."], [2420.0, "فإذا جئنا إلى مكان الكاهن وسألناه عن شيءٍ لنتبيّن حالَه ليتمّ القبضُ عليه،"], [2429.0, "أو ليتمّ كتابةُ التقرير ورفعُها إلى الجهات ـ ورفعُ أمره إلى الجهات المعنيّة الأمنيّة ـ،"], [2437.0, "أو لفضيحة كهانته وبيان زيف فعله وتطبيبه للناس،"], [2444.0, "وأنه كاهن، ولكن نريد أن نُثبت عليه كهانتَه،"], [2450.0, "فسألناه عن بعض الأشياء لنختبره،"], [2453.0, "فهذا من الأمور الواجبة؛"], [2455.7, "لأنه من أعظم إنكار المنكر."]], "tr": [[2387.0, "Dördüncü kısım —veya beşinci—, dördüncü kısım:"], [2388.2, "Kişinin kâhine gidip, kehânetinin sahteliğini ortaya çıkarmak, kehânetini ona karşı inkâr etmek ve onun hâlini insanlara açıklamak için ona soru sormasıdır."], [2412.2, "Bu, güç yetirildiğinde vâciptir. Külliyedeki \"ancak hâlis veya râcih bir maslahat için olursa müstesna\" sözümüzle kastettiğimiz budur."], [2420.7, "Kâhinin bulunduğu yere gidip, yakalanması sağlansın diye hâlini ortaya çıkarmak için ona bir şey sorarsak;"], [2429.0, "ya da rapor yazılıp ilgili mercilere —onun durumunun ilgili güvenlik mercilerine— iletilmesi için;"], [2435.2, "ya da kehânetini rezil etmek, yaptığı işin ve insanlara uyguladığı tedavinin sahteliğini ortaya koymak için;"], [2444.0, "onun kâhin olduğunu biliyoruz ama kehânetini üzerinde isbat etmek istiyoruz ve onu sınamak için ona bazı şeyler soruyoruz:"], [2453.7, "Bu, vâcip işlerdendir; çünkü münkeri inkâr etmenin en büyüklerindendir."]]}, {"reader": false, "ar": [[2459.0, "وقد قال النبيّ صلى الله عليه وسلم:"], [2462.8, "«من رأى منكم منكرًا فليغيّره بيده»،"], [2466.0, "الحديثَ بتمامه. فلا جرمَ أنّ هذه الحالة من الحالات الواجبة مع القدرة؛"], [2472.0, "لأنّ هؤلاء من أعظم من ينشرون الفساد،"], [2477.0, "ومن أعظم الدعاة للشرك والوثنيّة،"], [2480.0, "ومن أعظم من يعلّقون القلوبَ بغير الله عز وجل،"], [2486.0, "فهم من أعظم الناس فتنةً في بلاد المسلمين،"], [2489.0, "ومن أشدّ الناس فسادًا وضررًا على الإسلام وأهله."]], "tr": [[2459.0, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2462.3, "\"Sizden kim bir münker görürse onu eliyle değiştirsin\", hadisin tamamı."], [2467.5, "Şüphesiz bu durum, güç yetirildiğinde vâcip olan durumlardandır."], [2471.0, "Çünkü bunlar fesadı en çok yayanlardan, şirke ve putperestliğe en büyük davetçilerden ve kalpleri Allah Azze ve Celle'den başkasına en çok bağlayanlardandır."], [2484.7, "Onlar Müslümanların beldelerinde fitnesi en büyük olan insanlardan, İslam'a ve ehline fesadı ve zararı en şiddetli olan insanlardandır."]]}, {"reader": false, "ar": [[2494.0, "ويدلّ على ذلك بخصوصه أنّ النبيّ صلى الله عليه وسلم أتى ابنَ صيّاد،"], [2501.2, "أتى ابنَ صيّاد، لمّا عظم الشكُّ فيه وأنه الدجّال،"], [2510.0, "وأراد النبيّ صلى الله عليه وسلم أن يتبيّن أمرَه وأن يختبره،"], [2516.0, "فقال: «إنّي خبأتُ لك خبيئًا. فقال: الدُّخّ. فقال: اخسأ، فلن تعدوَ قدرَك»."], [2524.0, "فعُلم أنّ الذي يُخبره بمثل ذلك إنما هو شيطان؛"], [2530.0, "لأنّ «الدُّخّ» معناها الدخان، لكن بلغة الجنّ."]], "tr": [[2494.0, "Buna özel olarak şu da delalet eder:"], [2497.5, "Peygamber sallallâhu aleyhi ve sellem, onun Deccal olduğuna dair şüphe büyüyünce İbn Sayyâd'ın yanına gitti, İbn Sayyâd'ın yanına gitti."], [2505.3, "Peygamber sallallâhu aleyhi ve sellem onun durumunu ortaya çıkarmak ve onu sınamak istedi ve \"Senin için (içimde) bir şey sakladım\" buyurdu."], [2518.7, "O da \"Ed-dux\" dedi. Bunun üzerine \"Defol!"], [2522.0, "Haddini asla aşamazsın\" buyurdu. Böylece ona bu tür şeyleri haber verenin ancak bir şeytan olduğu anlaşıldı;"], [2530.6, "çünkü \"dux\" duman demektir, fakat cinlerin dilinde."]]}, {"reader": false, "ar": [[2535.0, "فمتى ما كان إتيانُنا للكاهن لفضحه ولبيان حاله للناس فلا جرمَ أنّ ذلك من الواجبات. والله أعلم."]], "tr": [[2535.0, "Kâhine gitmemiz onu rezil etmek ve hâlini insanlara açıklamak için olduğunda, şüphesiz bu vâciplerdendir. Allah en iyisini bilir."]]}]}, {"ts": "42:27", "title": "10. Külliye: Meşruiyet şartı bulunmayan her rukye haramdır", "paras": [{"reader": false, "ar": [[2547.0, "ومن الكلّيّات أيضًا: <b>كلُّ رقيةٍ تخلّف شرطُ مشروعيّتها فمحرّمة.<\/b> كلُّ رقيةٍ تخلّف شرطُ مشروعيّتها فمحرّمة."], [2558.0, "أقول وبالله التوفيق: لا أعلم نزاعًا بين أهل العلم في مشروعيّة الرقية متى ما توفّر شرطُها وانتفت موانعُها،"], [2575.0, "وقد دلّ على مشروعيّتها الكتابُ والسنّةُ والإجماع."]], "tr": [[2547.0, "Külliyelerden biri de şudur: 10."], [2549.8, "külliye: Meşruiyet şartı bulunmayan her rukye haramdır. Meşruiyet şartı bulunmayan her rukye haramdır."], [2558.0, "Tevfik Allah'tandır, derim ki: Şartı bulunduğu ve engelleri ortadan kalktığı sürece rukyenin meşruiyeti konusunda ilim ehli arasında bir ihtilaf bilmiyorum."], [2575.0, "Onun meşruiyetine Kitap, Sünnet ve icmâ delalet etmiştir."]]}, {"reader": false, "ar": [[2580.0, "أمّا من الكتاب فقولُ الله عز وجل:"], [2583.5, "<span class=\"ayah\">﴿وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[الإسراء: ٨٢]<\/span>،"], [2591.0, "ويقول الله عز وجل:"], [2592.6, "<span class=\"ayah\">﴿قُلْ هُوَ لِلَّذِينَ آمَنُوا هُدًى وَشِفَاءٌ﴾<\/span> <span class=\"ref\">[فصلت: ٤٤]<\/span>،"], [2595.0, "وقال الله عز وجل:"], [2597.0, "<span class=\"ayah\">﴿وَشِفَاءٌ لِّمَا فِي الصُّدُورِ﴾<\/span> <span class=\"ref\">[يونس: ٥٧]<\/span>."]], "tr": [[2580.0, "Kitap'tan (delil), Allah Azze ve Celle'nin şu sözüdür:"], [2582.0, "<span class=\"ayah\">﴿Biz Kur'an'dan, mü'minler için şifa ve rahmet olan şeyler indiriyoruz﴾<\/span> [İsrâ 82]."], [2586.6, "Allah Azze ve Celle şöyle de buyurur:"], [2591.4, "<span class=\"ayah\">﴿De ki: O, iman edenler için bir hidayet ve şifadır﴾<\/span> [Fussilet 44]."], [2594.6, "Allah Azze ve Celle şöyle de buyurmuştur:"], [2596.5, "<span class=\"ayah\">﴿ve göğüslerde olana bir şifa﴾<\/span> [Yûnus 57]."]]}, {"reader": false, "ar": [[2599.0, "وقد ثبت عن النبيّ صلى الله عليه وسلم أنه رَقى ورُقِي،"], [2606.0, "أي رقاه جبريل عليه الصلاة والسلام،"], [2610.0, "كما في صحيح الإمام مسلمٍ من حديث أبي سعيدٍ الخدريّ رضي الله عنه:"], [2618.0, "«أنّ جبريل جاء إلى النبيّ صلى الله عليه وسلم فقال: يا محمد، اشتكيتَ؟ قال: أجل. قال: بسم الله أرقيك، من كلّ شيءٍ يؤذيك، من شرّ كلّ نفسٍ أو عينِ حاسد، الله يشفيك، بسم الله أرقيك»."]], "tr": [[2599.0, "Peygamber sallallâhu aleyhi ve sellem'in rukye yaptığı ve kendisine rukye yapıldığı —yani Cebrâil aleyhisselâmın ona rukye yaptığı— sabit olmuştur."], [2609.3, "Nitekim İmam Müslim'in Sahîh'inde Ebû Saîd el-Hudrî'nin —Allah ondan razı olsun— hadisinde şöyle geçer:"], [2616.8, "\"Cebrâil Peygamber sallallâhu aleyhi ve sellem'e gelip 'Ey Muhammed!"], [2620.0, "Rahatsızlandın mı?' dedi. 'Evet' buyurdu."], [2621.5, "Cebrâil şöyle dedi: Sana eziyet veren her şeyden, her nefsin veya hasetçi gözün şerrinden Allah'ın adıyla sana rukye yaparım."], [2630.3, "Allah sana şifa versin. Allah'ın adıyla sana rukye yaparım.\""]]}, {"reader": false, "ar": [[2636.0, "وقد كان النبيّ صلى الله عليه وسلم يرقي نفسَه وغيرَه."], [2640.0, "ففي الصحيحين من حديث عائشة رضي الله تعالى عنها قالت:"], [2644.4, "«كان النبيّ صلى الله عليه وسلم إذا اشتكى أحدٌ منّا مسحه بيمينه، وقال: اللهمّ ربَّ الناس، أذهبِ البأس، اشفِ أنت الشافي، لا شفاءَ إلا شفاؤك، شفاءً لا يغادر سقمًا». متّفقٌ عليه."]], "tr": [[2636.0, "Peygamber sallallâhu aleyhi ve sellem kendisine de başkasına da rukye yapardı."], [2639.6, "Sahîhayn'da Âişe'nin —Allah Teâlâ ondan razı olsun— hadisinde şöyle dediği geçer:"], [2643.6, "\"Peygamber sallallâhu aleyhi ve sellem, bizden biri rahatsızlandığında onu sağ eliyle meshederdi ve şöyle derdi:"], [2649.7, "Allah'ım, ey insanların Rabbi! Sıkıntıyı gider, şifa ver;"], [2654.3, "şifa veren Sensin. Senin şifandan başka şifa yoktur;"], [2657.6, "hiçbir hastalık bırakmayan bir şifa (ver).\" Müttefekun aleyh."]]}, {"reader": false, "ar": [[2660.0, "وفي الصحيحين من حديثها رضي الله عنها ـ من حديث عائشة رضي الله عنها أيضًا ـ قالت:"], [2667.4, "«كان الإنسانُ إذا اشتكى الشيءَ منه، أو كانت به قرحةٌ أو جرح، قال النبيّ صلى الله عليه وسلم بإصبعه: بسم الله، ربِّنا <span class=\"q\">؟ 44:36<\/span>، تربةُ أرضنا، بريقة بعضنا، يُشفى سقيمُنا بإذن ربّنا»."]], "tr": [[2660.0, "Sahîhayn'da yine onun —Allah ondan razı olsun—, yine Âişe'nin —Allah ondan razı olsun— hadisinde şöyle dediği geçer:"], [2667.0, "\"İnsan bir yerinden rahatsızlandığında veya bir yarası ya da bir çıbanı olduğunda, Peygamber sallallâhu aleyhi ve sellem parmağıyla (işaret ederek) şöyle derdi:"], [2675.4, "Allah'ın adıyla, Rabbimiz(in) <span class=\"q\">؟<\/span>, yerimizin toprağı, birimizin tükürüğüyle hastamız Rabbimizin izniyle şifa bulur.\""]]}, {"reader": false, "ar": [[2681.0, "وفي الصحيحين من حديث عائشة رضي الله عنها قالت:"], [2686.5, "«كان النبيّ صلى الله عليه وسلم إذا اشتكى وجعًا نفث عليه ـ على نفسه ـ بالمعوّذات، ويمسح عنه بيد نفسه. فلمّا اشتكى وجعَه الذي تُوفّي فيه كنتُ أنفث عليه بالمعوّذات التي كان ينفث بها، وأمسح بيد النبيّ صلى الله عليه وسلم»."], [2705.0, "وفي صحيح الإمام مسلم:"], [2706.7, "«وكان إذا اشتكى أحدٌ من أهل بيته نفث عليه بالمعوّذات»."]], "tr": [[2681.0, "Sahîhayn'da Âişe'nin —Allah ondan razı olsun— hadisinde şöyle dediği geçer:"], [2686.5, "\"Peygamber sallallâhu aleyhi ve sellem bir ağrıdan rahatsızlandığında onun üzerine —kendi üzerine— Muavvizât'ı okuyup üflerdi ve kendi eliyle (ağrıyan yeri) meshederdi."], [2696.0, "Vefat ettiği hastalığa yakalandığında, onun okuyup üflediği Muavvizât'ı ben onun üzerine okuyup üflüyor ve Peygamber sallallâhu aleyhi ve sellem'in eliyle meshediyordum.\" İmam Müslim'in Sahîh'inde de şöyledir:"], [2707.1, "\"Ev halkından biri rahatsızlandığında onun üzerine Muavvizât'ı okuyup üflerdi.\""]]}]}, {"ts": "45:11", "title": "10. Külliye (devam): Sünnet'ten deliller ve âlimlerin icmâı", "paras": [{"reader": false, "ar": [[2711.0, "والأدلّةُ على مشروعيّة الرقية كثيرةٌ جدًّا،"], [2716.0, "بل قال فيها النبيّ صلى الله عليه وسلم:"], [2719.0, "«اعرضوا عليّ رُقاكم، لا بأسَ بالرُّقى ما لم تكن شركًا»."], [2725.0, "وقال النبيّ صلى الله عليه وسلم في شأنها:"], [2729.0, "«من استطاع منكم أن ينفع أخاه فليفعل»،"], [2732.0, "فليفعل. وقد أقرّ النبيّ صلى الله عليه وسلم ـ في حديث أبي سعيدٍ الخدريّ ـ ذلك الراقيَ الذي رقى سيّدَ الحيّ لمّا لُدغ بالفاتحة،"], [2747.0, "وطيّب خاطرَهم بقبول هذا الجُعل وبالأكل منه."]], "tr":
