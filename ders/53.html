[[2711.0, "Rukyenin meşruiyetine dair deliller çok fazladır."], [2714.8, "Hatta Peygamber sallallâhu aleyhi ve sellem onun hakkında şöyle buyurmuştur:"], [2718.6, "\"Rukyelerinizi bana arz edin. Şirk olmadıkça rukyelerde bir sakınca yoktur.\" Peygamber sallallâhu aleyhi ve sellem onun hakkında şöyle de buyurmuştur:"], [2728.5, "\"Sizden kim kardeşine fayda vermeye gücü yeterse, yapsın\", yapsın."], [2732.0, "Peygamber sallallâhu aleyhi ve sellem —Ebû Saîd el-Hudrî hadisinde— kabilenin reisi (akrep tarafından) sokulunca ona Fâtiha ile rukye yapan o kişiyi onaylamış;"], [2743.3, "bu ücreti kabul ederek ve ondan yiyerek onların gönüllerini hoş etmiştir."]]}, {"reader": false, "ar": [[2753.0, "وقد أجمع العلماءُ على ذلك ولله الحمدُ والمنّة."], [2759.0, "ولذلك قال الإمامُ ابنُ عبد البرّ رحمه الله تعالى:"], [2764.0, "«لا أعلم خلافًا بين العلماء في جواز الرقية من العين أو الحُمَة ـ وهي لدغةُ العقرب ـ وما كان مثلَها، إذا كانت الرقيةُ بأسماء الله عز وجل وممّا يجوز الرُّقى به، وكان ذلك بعد نزول الوجع والبلاء وظهور العلّة والداء»."], [2789.0, "انتهى كلامه رحمه الله."]], "tr": [[2753.0, "Allah'a hamd ve minnet olsun, âlimler bu konuda icmâ etmiştir."], [2758.1, "Bu yüzden İmam İbn Abdilber —Allah ona rahmet etsin— şöyle demiştir:"], [2763.4, "\"Nazardan veya humeden —akrep sokmasından— ve benzerlerinden dolayı rukye yapmanın caiz olduğu konusunda âlimler arasında bir ihtilaf bilmiyorum;"], [2773.8, "şu şartla ki rukye Allah Azze ve Celle'nin isimleriyle ve kendisiyle rukye yapılması caiz olan şeylerle olsun ve bu, ağrı ve bela indikten, illet ve hastalık ortaya çıktıktan sonra olsun.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2791.0, "وقال أبو الوليد الباجيّ المالكيّ رحمه الله تعالى:"], [2799.0, "«وقد أجرى الله تعالى العادةَ بأن يُبرأ من ذلك بالاسترقاء، كما أجرى العادةَ بأن يُبرأ من الأدواء المخصوصة بأدويةٍ مخصوصة، ولا خلافَ في جواز ذلك بأسماء الله تعالى وكتابه وذكره». انتهى كلامه."]], "tr": [[2791.0, "Ebü'l-Velîd el-Bâcî el-Mâlikî —Allah ona rahmet etsin— şöyle demiştir:"], [2799.7, "\"Allah Teâlâ, belirli hastalıklardan belirli ilaçlarla iyileşilmesini âdet kıldığı gibi, bundan da rukye istemekle iyileşilmesini âdet kılmıştır."], [2812.7, "Bunun Allah Teâlâ'nın isimleriyle, Kitabı'yla ve zikriyle caiz olduğunda ihtilaf yoktur.\" Sözü bitti."]]}, {"reader": false, "ar": [[2822.0, "ونقل ابنُ الحاجّ المالكيّ عن الإمام القرطبيّ رحمه الله تعالى أنه قال:"], [2830.6, "«هذا مذهبُ الجمهور من العلماء، والأئمّة من الفقهاء، في إباحة الدواء والاسترقاء وشرب الدواء»."], [2839.0, "وقال الإمامُ النوويّ رحمه الله تعالى:"], [2843.0, "«وقد نقلوا بالإجماع على جواز الرُّقى بالآيات والأذكار»."], [2854.0, "قال الإمام المازَريّ رحمه الله:"], [2856.5, "«جميعُ الرُّقى جائزةٌ إذا كانت بكتاب الله أو بذكره»."], [2861.0, "وقال ابنُ حجرٍ رحمه الله تعالى:"], [2864.0, "«وقد أجمع العلماءُ على جواز الرُّقى»."], [2867.0, "فدلّ ذلك على أنّ الرُّقى جائزةٌ بالكتاب وبالسنّة وبالإجماع."]], "tr": [[2822.0, "İbnü'l-Hâc el-Mâlikî, İmam Kurtubî'den —Allah ona rahmet etsin— şöyle dediğini nakletmiştir:"], [2828.0, "\"İlaç kullanmanın, rukye istemenin ve ilaç içmenin mubah olması konusunda âlimlerin cumhurunun ve fakih imamların mezhebi budur.\" İmam Nevevî —Allah ona rahmet etsin— şöyle demiştir:"], [2841.7, "\"Ayetler ve zikirlerle rukye yapmanın caiz olduğuna dair icmâ naklettiler.\" İmam el-Mâzerî —Allah ona rahmet etsin— şöyle demiştir:"], [2856.5, "\"Allah'ın Kitabı'yla veya O'nun zikriyle olduğu takdirde bütün rukyeler caizdir.\" İbn Hacer —Allah ona rahmet etsin— şöyle demiştir:"], [2864.0, "\"Âlimler rukyelerin caiz olduğunda icmâ etmiştir.\" Bu da rukyelerin Kitap, Sünnet ve icmâ ile caiz olduğunu gösterir."]]}]}, {"ts": "47:55", "title": "10. Külliye (devam): İbn Hacer'e göre rukyenin üç şartı", "paras": [{"reader": false, "ar": [[2875.0, "إلا أنّنا في هذه الكلّيّة نتكلّم عن أمرٍ مهمّ،"], [2880.0, "وهي أنّ الرقية لا تكون جائزةً إلا إذا توفّرت شروطُها وانتفت موانعُها."], [2889.0, "وقد نصّ العلماء على هذه الشروط وأجمعوا على اشتراطها."], [2898.0, "قال الإمامُ ابنُ حجرٍ رحمه الله تعالى:"], [2903.0, "«وقد أجمع العلماءُ على جواز الرُّقى عند اجتماع ثلاثة شروط: الأوّل: أن يكون بكلام الله تعالى أو بأسمائه وصفاته»."], [2914.0, "قلتُ: وبناءً على اشتراط هذا الشرط،"], [2919.0, "فمتى ما كانت الرقيةُ بأمورٍ غير ذلك ممّا لا يُعرف معناه،"], [2926.5, "أو كان بالألفاظ المجهولة، فإنّ ذلك محرّم."]], "tr": [[2875.0, "Ancak bu külliyede önemli bir meseleden bahsediyoruz:"], [2878.9, "Rukye ancak şartları bulunduğunda ve engelleri ortadan kalktığında caiz olur."], [2885.5, "Âlimler bu şartları açıkça belirtmiş ve bunların şart koşulduğunda icmâ etmişlerdir."], [2894.7, "İmam İbn Hacer —Allah ona rahmet etsin— şöyle demiştir:"], [2903.4, "\"Âlimler üç şart bir araya geldiğinde rukyelerin caiz olduğunda icmâ etmiştir."], [2908.4, "Birincisi: Allah Teâlâ'nın kelâmıyla veya O'nun isim ve sıfatlarıyla olması.\" Derim ki:"], [2919.0, "Bu şartın şart koşulmasına dayanarak, rukye bunun dışında, anlamı bilinmeyen şeylerle veya meçhul lafızlarla olduğunda bu haramdır."]]}, {"reader": false, "ar": [[2929.0, "ثم قال ابنُ حجرٍ رحمه الله:"], [2933.0, "«الثاني: وباللسان العربيّ، أو بما يُعرف معناه من غيره»."], [2942.0, "قلتُ: وبناءً على اشتراط هذا الشرط،"], [2947.0, "فمتى ما كانت الرقيةُ بغير اللسان العربيّ،"], [2950.8, "أو بما يُجهل معناه من غيره،"], [2954.0, "فإنها تكون محرّمةً عند عامّة أهل العلم،"], [2961.0, "وكلُّ هذا سيأتي بيانُه إن شاء الله."]], "tr": [[2929.0, "Sonra İbn Hacer —Allah ona rahmet etsin— şöyle demiştir:"], [2934.9, "\"İkincisi: Arap diliyle veya başka dillerden anlamı bilinen bir şeyle olması.\" Derim ki:"], [2945.8, "Bu şartın şart koşulmasına dayanarak, rukye Arap dilinden başka bir dille veya başka dillerden anlamı bilinmeyen bir şeyle olduğunda, ilim ehlinin geneline göre haram olur."], [2961.9, "Bütün bunların açıklaması inşallah gelecek."]]}, {"reader": false, "ar": [[2964.0, "ثم قال الإمامُ ابنُ حجر:"], [2967.0, "«الثالث: أن يعتقد أنّ الرقية لا تؤثّر بذاتها، بل بذات الله تعالى»."], [2980.0, "قلتُ: وذلك لأنها مجرّدُ سبب،"], [2986.0, "والمتقرّر في القواعد أنّ السببيّة لا تؤثّر بذاتها،"], [2992.0, "وإنما بتقدير الله عز وجل وإرادته."], [2995.0, "وبناءً على ذلك فمتى ما تخلّف شرطٌ من هذه الشروط فإنّنا نصف هذه الرقيةَ بأنها رقيةٌ محرّمة."]], "tr": [[2964.0, "Sonra İmam İbn Hacer şöyle demiştir:"], [2967.0, "\"Üçüncüsü: Rukyenin bizzat kendisinin etki etmediğine, bilakis Allah Teâlâ'nın zâtıyla (takdiriyle) etki ettiğine inanması.\" Derim ki:"], [2981.6, "Çünkü o sadece bir sebeptir."], [2987.4, "Kaidelerde sabit olan şudur: Sebeplik bizzat kendisiyle etki etmez;"], [2993.0, "ancak Allah Azze ve Celle'nin takdiri ve iradesiyle etki eder."], [2998.5, "Buna dayanarak bu şartlardan biri bulunmadığında, bu rukyeyi haram bir rukye olarak nitelendiririz."]]}, {"reader": false, "ar": [[3007.0, "وقد يكون في بعض الرُّقى ما يوجب وصفَها بأنها رقيةٌ شركيّة،"], [3014.0, "لحديث ابن مسعودٍ رضي الله عنه أنّ النبيّ صلى الله عليه وسلم قال:"], [3021.9, "«إنّ الرُّقى والتمائمَ والتِّوَلةَ شرك»."], [3025.0, "فهذا دليلٌ على أنّ الرقية إذا تضمّنت شيئًا من التعاويذ بالشياطين أو الأبالسة،"], [3039.0, "أو كانت تتضمّن شيئًا من الشرك،"], [3042.0, "فإنها تكون حرامًا أو تكون شركًا."]], "tr": [[3007.0, "Bazı rukyelerde, onların şirk rukyesi olarak nitelendirilmesini gerektiren şeyler bulunabilir."], [3012.7, "Çünkü İbn Mes'ûd'un —Allah ondan razı olsun— hadisinde Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [3021.9, "\"Rukyeler, temîmeler (muskalar) ve tiveleler (sevgi büyüleri) şirktir.\" Bu, rukyenin şeytanlara veya iblislere sığınma içeren birtakım tılsımlar içermesi ya da şirkten bir şey içermesi hâlinde haram veya şirk olacağına delildir."]]}]}, {"ts": "50:45", "title": "10. Külliye (devam): Mesele — Rukyede Arap dili şart mıdır?", "paras": [{"reader": false, "ar": [[3045.0, "وهنا مسائلُ أريد أن أبحثها معكم:"], [3050.0, "منها: هل يُشترط اللسانُ العربيّ في الرقية،"], [3054.8, "أم أنها تجوز باللسان الأعجميّ؟"], [3061.0, "فأقول وبالله التوفيق: أجمع العلماءُ على مشروعيّتها باللسان العربيّ،"], [3073.0, "ولكنهم اختلفوا فيما لو كان شيءٌ منها بلغة العجم."], [3086.0, "والقولُ الصحيح أنّ ذلك جائزٌ سائغٌ فيما عدا <span class=\"q\">؟ 51:26<\/span> الرقيةَ بالقرآن؛"], [3095.0, "لأنّ القرآنيّة مبنيّةٌ على ركنين:"], [3098.6, "على اللفظ العربيّ والمعنى."]], "tr": [[3045.0, "Burada sizinle incelemek istediğim bazı meseleler var."], [3048.8, "Bunlardan biri: Rukyede Arap dili şart mıdır, yoksa yabancı (Arapça olmayan) bir dille de caiz midir?"], [3061.0, "Tevfik Allah'tandır, derim ki: Âlimler onun Arap diliyle meşru olduğunda icmâ etmişlerdir;"], [3073.0, "fakat bir kısmının Arapça olmayan bir dille olması hâlinde ihtilaf etmişlerdir."], [3086.0, "Doğru görüş, Kur'an'la yapılan rukye dışında <span class=\"q\">؟<\/span> bunun caiz ve uygun olduğudur."], [3095.0, "Çünkü Kur'an'ın Kur'an olması iki rükne dayanır: Arapça lafız ve mana."]]}, {"reader": false, "ar": [[3107.0, "فالقرآن ليس اللفظَ فقط دون المعنى،"], [3110.8, "ولا المعنى فقط دون اللفظ،"], [3114.0, "بل القرآنُ هو اللفظُ والمعنى."], [3119.0, "والمتقرّر في قواعد الأصول أنّ القرآن اسمٌ للّفظ والمعنى،"], [3127.0, "فمتى ما سقط واحدٌ منهما خرج القرآنُ عن قرآنيّته."], [3135.0, "فلا يجوز لصاحب اللسان الأعجميّ أن يرقي بمعاني أو بترجمة القرآن،"], [3146.0, "وإنما يقرأ القرآنَ بلغته التي نزل بها؛"], [3150.0, "لأنه لا يحصل تأثيرُه في المقروء عليه إلا إذا قُرئ باللغة التي نزل بها،"], [3158.6, "والحروف التي نزل بها،"], [3161.1, "والكلمات التي نزل بها،"], [3163.5, "والترتيب الذي نزل به."]], "tr": [[3107.0, "Kur'an, mana olmaksızın sadece lafız değildir;"], [3110.8, "lafız olmaksızın sadece mana da değildir;"], [3114.8, "bilakis Kur'an lafız ve manadır."], [3119.7, "Usûl kaidelerinde sabit olan şudur:"], [3123.3, "Kur'an, lafız ve mananın ikisinin birden adıdır;"], [3129.8, "bunlardan biri düştüğünde Kur'an, Kur'an olmaktan çıkar."], [3136.4, "Bu yüzden Arapça olmayan bir dile sahip kişinin Kur'an'ın manalarıyla veya tercümesiyle rukye yapması caiz değildir;"], [3150.6, "bilakis Kur'an'ı indirildiği dille okur."], [3153.7, "Çünkü Kur'an'ın üzerine okunan kişide etkisi, ancak indirildiği dille, indirildiği harflerle, indirildiği kelimelerle ve indirildiği tertiple okunduğunda meydana gelir."]]}, {"reader": false, "ar": [[3166.0, "لكن لا بأسَ أن نتوسّع في جواز الرقية باللسان الأعجميّ في بعض التعاويذ والأدعية،"], [3174.0, "إذا كان لسانًا معلومًا ومفهومًا عند القارئ والمقروء عليه،"], [3182.0, "ولا يُكتفى أن يكون معلومًا عند القارئ فقط؛"], [3187.0, "لأنه ربما يستغلّ عدمَ معرفة المقروء عليه بهذا اللسان،"], [3193.0, "فيُدخل معه في أعجميّته شيئًا ممّا لا يجوز الرقيةُ به."], [3197.0, "وكلُّ ذلك من باب سدّ الذرائع التي توقع في شيءٍ من المخالفات الشرعيّة."]], "tr": [[3166.0, "Fakat bazı istiâzelerde ve dualarda, okuyan ve üzerine okunan kişi tarafından bilinen ve anlaşılan bir dil olduğu takdirde, Arapça olmayan dille rukyenin caizliği konusunda genişlik tanımamızda bir sakınca yoktur."], [3185.1, "Sadece okuyan tarafından bilinmesiyle yetinilmez;"], [3187.7, "çünkü okuyan, üzerine okunan kişinin bu dili bilmemesini istismar edip yabancı dildeki okumasının içine kendisiyle rukye yapılması caiz olmayan bir şey sokabilir."], [3199.5, "Bütün bunlar, birtakım şer'î muhalefetlere düşüren zerîaları kapatma kabilindendir."]]}, {"reader": false, "ar": [[3205.0, "وهذا قولٌ وسطٌ بين من أجازها مطلقًا وبين من منعها مطلقًا."], [3216.0, "ولذلك نبّه العلماء على ذلك،"], [3218.7, "وهي أنه ينبغي تغليبُ اللسان العربيّ في الرقية،"], [3223.0, "لكن إن توسّعنا في شيءٍ من الأعجميّة فيما هو من قبيل الأذكار أو التعاويذ المعلوم معناها عند القارئ والمقروء فإنه لا بأسَ به،"], [3233.0, "مع أنّ تركه هو الأولى والأفضل."]], "tr": [[3205.0, "Bu, onu mutlak olarak caiz görenlerle mutlak olarak yasaklayanlar arasında orta bir görüştür."], [3216.0, "Bu yüzden âlimler buna dikkat çekmişlerdir:"], [3219.2, "Rukyede Arap dilinin ağır bastırılması gerekir."], [3221.9, "Fakat anlamı okuyan ve üzerine okunan tarafından bilinen zikirler veya istiâzeler kabilinden olan şeylerde Arapça olmayan dile biraz genişlik tanırsak, bunda bir sakınca yoktur;"], [3231.5, "bununla birlikte onu terk etmek daha evlâ ve daha faziletlidir."]]}]}, {"ts": "53:56", "title": "10. Külliye (devam): Âlimlerin Arapça olmayan rukye hakkındaki sözleri", "paras": [{"reader": false, "ar": [[3236.0, "أقول: وقد نبّه العلماءُ على ذلك."], [3240.0, "قال ابنُ عابدين رحمه الله تعالى:"], [3243.0, "«إنما تُكره العُوذة» ـ يعني التعويذة ـ «إذا كانت بغير لسان العرب»."], [3249.0, "انتهى كلامه. وقال ابنُ الحاجّ رحمه الله تعالى:"], [3255.0, "«وقد قال مالكٌ رحمه الله تعالى في الرُّقى بغير العربيّة: وما يُدريك لعلّه كفر؟ فكلُّ ما حاك في صدر الإنسان من هذا وما أشبهه فيتعيّن تجنّبُه»."], [3270.0, "ولذلك قلتُ لكم في اشتراطي بأنها أعجميّةٌ يعرفها القارئُ والمقروء، سدًّا لهذه الذريعة."]], "tr": [[3236.0, "Derim ki: Âlimler buna dikkat çekmişlerdir."], [3238.7, "İbn Âbidîn —Allah ona rahmet etsin— şöyle demiştir:"], [3242.5, "\"Uvze\" —yani istiâze/muska— \"ancak Arap dilinden başka bir dille olduğunda mekruhtur.\" Sözü bitti."], [3249.0, "İbnü'l-Hâc —Allah ona rahmet etsin— şöyle demiştir:"], [3253.5, "\"Mâlik —Allah ona rahmet etsin— Arapça olmayan rukyeler hakkında şöyle demiştir:"], [3257.4, "Ne bilirsin, belki de küfürdür?"], [3259.8, "Bundan ve buna benzer şeylerden insanın göğsünü tırmalayan her şeyden kaçınmak gerekir.\" Bu yüzden size şart koştuğum şeyde, bu zerîayı kapatmak için onun okuyan ve üzerine okunan tarafından bilinen bir yabancı dil olmasını söyledim."]]}, {"reader": false, "ar": [[3279.0, "وقال النوويّ رحمه الله تعالى:"], [3283.0, "«قال أبو عُبيد: وأمّا الرُّقى والتمائم فالمرادُ بالنهي ما كان بغير لسان العربيّة، بما لا يُدرى ما هو»."], [3294.0, "انتهى كلامه. وقال المازَريّ رحمه الله تعالى:"], [3300.0, "«جميعُ الرُّقى جائزةٌ إذا كانت بكتاب الله أو بذكره، ومنهيٌّ عنها إذا كانت باللغة الأعجميّة أو بما لا يُدرى معناه، لجواز أن يكون فيه كفر». انتهى كلامه."]], "tr": [[3279.0, "Nevevî —Allah ona rahmet etsin— şöyle demiştir:"], [3283.7, "\"Ebû Ubeyd dedi ki: Rukyeler ve temîmelere gelince, yasakla kastedilen, Arap dilinden başka bir dille olan, ne olduğu bilinmeyen şeylerdir.\" Sözü bitti."], [3298.4, "el-Mâzerî —Allah ona rahmet etsin— şöyle demiştir:"], [3301.3, "\"Allah'ın Kitabı'yla veya O'nun zikriyle olduğu takdirde bütün rukyeler caizdir;"], [3306.1, "yabancı dille veya anlamı bilinmeyen bir şeyle olduğunda ise, içinde küfür bulunma ihtimali sebebiyle yasaklanmıştır.\" Sözü bitti."]]}, {"reader": false, "ar": [[3317.0, "وقال الحطّابُ المالكيّ رحمه الله تعالى:"], [3321.0, "«إن كان يرقيه بالرُّقى العربيّة جاز، وإن كان بالرُّقى العجميّة لم يجز، وفيه خلاف. وكان الشيخ ابنُ عرفة يقول: إن تكرّر منه النفعُ بذلك جاز»."], [3338.0, "يعني لا بأسَ أن نقرأ بالأعجميّة مع وجود النفع،"], [3342.0, "شريطةَ أن تكون أعجميّةً يعرفها القارئُ والمقروء عليه."]], "tr": [[3317.0, "el-Hattâb el-Mâlikî —Allah ona rahmet etsin— şöyle demiştir:"], [3321.0, "\"Eğer ona Arapça rukyelerle rukye yapıyorsa caizdir;"], [3323.5, "Arapça olmayan rukyelerle ise caiz değildir;"], [3327.1, "bu konuda ihtilaf vardır. Şeyh İbn Arafe şöyle derdi:"], [3332.8, "Eğer onunla tekrar tekrar fayda hâsıl oluyorsa caizdir.\" Yani fayda bulunduğu takdirde yabancı dille okumamızda bir sakınca yoktur;"], [3340.7, "şu şartla ki okuyan ve üzerine okunan kişinin bildiği bir yabancı dil olsun."]]}, {"reader": false, "ar": [[3348.0, "وقال المَرداويّ رحمه الله تعالى:"], [3353.0, "«ويُرقى من ذلك بقرآنٍ وما ورد فيه من دعاءٍ وذكر، ويُكره بغير العربيّة»."], [3362.0, "انتهى كلامه. وقال أبو الحسن الهرويّ القاري رحمه الله تعالى:"], [3367.0, "«ومن المحذور أن تشتمل على كلامٍ غير عربيّ، أو عربيٍّ لا يُفهم معناه، ولم يرد من طريقٍ صحيح، فإنه يحرم كما صرّح به جماعةٌ من أئمّة المذاهب الأربعة، لاحتمال اشتماله على كفر». انتهى كلامه."]], "tr": [[3348.0, "el-Merdâvî —Allah ona rahmet etsin— şöyle demiştir:"], [3353.0, "\"Bundan dolayı Kur'an ile ve bu konuda varid olan dua ve zikirle rukye yapılır;"], [3359.9, "Arapça olmayan dille (yapılması) mekruhtur.\" Sözü bitti."], [3364.0, "Ebü'l-Hasen el-Herevî el-Kârî —Allah ona rahmet etsin— şöyle demiştir:"], [3367.7, "\"Sakıncalı olan şeylerden biri de (rukyenin) Arapça olmayan bir söz veya anlamı anlaşılmayan ve sahih bir yoldan gelmemiş Arapça bir söz içermesidir."], [3379.0, "Böyle bir şey, küfür içerme ihtimali sebebiyle haramdır;"], [3382.5, "nitekim dört mezhebin imamlarından bir cemaat bunu açıkça belirtmiştir.\" Sözü bitti."]]}]}, {"ts": "56:33", "title": "10. Külliye (sonu): Şeyh'in tercihi ve dersin kapanışı", "paras": [{"reader": false, "ar": [[3393.0, "وأُعيد ما ترجّح عندي وأقول:"], [3395.0, "الذي يترجّح عندي في هذه المسألة هو أنّ الرقية بغير العربيّة إن كانت بدعاءٍ مفهوم المعنى عند القارئ والمقروء،"], [3407.0, "ولا يعارض ما ورد عنه صلى الله عليه وسلم،"], [3410.0, "ولم يكن فيه شيءٌ من البدع أو الشرك،"], [3414.0, "فإنّ ذلك جائزٌ لا بأسَ به."], [3416.0, "وأمّا الرقيةُ بالقرآن فإنه يُشترط فيه لفظُه ومعناه؛"], [3421.0, "لأنه يخرج عن قرآنيّته متى ما سقط أحدُ ركنَي القرآنيّة."], [3428.0, "والله أعلم. لعلّنا نكتفي بهذا القدر إن شاء الله،"], [3430.0, "والله أعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[3393.0, "Bende tercih edilen görüşü tekrar ediyor ve diyorum ki:"], [3396.5, "Bu meselede bence râcih olan şudur:"], [3398.8, "Arapça olmayan dille yapılan rukye, okuyan ve üzerine okunan tarafından anlamı anlaşılan bir duayla olursa, Peygamber sallallâhu aleyhi ve sellem'den gelenlere aykırı düşmezse ve içinde bid'at veya şirkten bir şey bulunmazsa, bu caizdir, bir sakıncası yoktur."], [3415.7, "Kur'an'la yapılan rukyeye gelince, onda lafzı ve manası şarttır;"], [3420.4, "çünkü Kur'an'ın Kur'an olmasının iki rüknünden biri düştüğünde Kur'an olmaktan çıkar."], [3425.0, "Allah en iyisini bilir. İnşallah bu kadarla yetinelim."], [3429.2, "Allah en iyisini bilir. Allah Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

let cur=0,ia=-1,it=-1,player=null;

function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
