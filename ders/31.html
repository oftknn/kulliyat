<script>
const D={"no": 31, "vid": "2AWI_XtnQFc", "title_ar": "الدرس (٣١) من شرح كليات العقيدة — من كليات البدع", "title_tr": "Şerhu Külliyyâti'l-Akîde — 31. Ders: Bid'at Külliyeleri (Selefin Ameli)", "sections": [{"ts": "00:00", "title": "1. Külliye: Selefin, aralarında ihtilaf nakledilmeksizin üzerinde amel ettiği şey için özel delil istenmez", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.8, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.6, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.9, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [9.7, "أما بعد: فلا نزال نتكلّم عن كلّيّات باب البدع،"], [13.8, "وعندنا في هذا الدرس عشرُ كلّيّات،"], [16.6, "ولعلّي لا أُطيل عليكم،"], [18.4, "وإن رأيتموني قد أطلتُ فنُكملها الدرسَ القادم إن شاء الله."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.8, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.0, "Bundan sonra: Hâlâ bid'at babının külliyelerinden bahsediyoruz."], [15.2, "Bu derste on külliyemiz var."], [17.5, "Umarım size uzun tutmam; eğer uzattığımı görürseniz, onları inşallah gelecek derste tamamlarız."]]}, {"reader": false, "ar": [[23.0, "الكلّيّة الأولى: <b>كلُّ ما جرى عليه عملُ السلف ـ من غير خلافٍ منقولٍ عنهم فيه ـ فلا يُطلب عليه دليلٌ بخصوصه.<\/b> أُعيدها مرةً أخرى:"], [62.6, "كلُّ ما جرى عليه عملُ السلف من غير خلافٍ منقولٍ عنهم فيه فلا يُطلب عليه دليلٌ بخصوصه. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[23.0, "<b>1. külliye: Selefin —aralarında nakledilmiş bir ihtilaf olmaksızın— üzerinde amel ettiği her şey için ayrıca özel bir delil istenmez.<\/b> Bir kez daha tekrarlıyorum:"], [63.1, "Selefin, aralarında nakledilmiş bir ihtilaf olmaksızın üzerinde amel ettiği her şey için ayrıca özel bir delil istenmez."]]}, {"reader": false, "ar": [[74.0, "أقول وبالله التوفيق: وهذا هو الواجب على الخلف تجاه السلف؛"], [95.0, "فإنه لا ينبغي للإنسان أن يعمد إلى مخالفة عمل السلف مطلقًا،"], [101.0, "ولا أن يبني تعبّداته ولا أعماله على وجهٍ يخالف فيه ما ثبت عن السلف رحمهم الله."], [108.0, "فمتى ما رأيتَ السلف قد استقرّوا على عملٍ أو قول،"], [112.0, "فإنّ الواجب عليك أن تمتثل عملهم،"], [117.8, "وألّا تخالفهم، وألّا تحرص على طلب دليلٍ يدلّ على صحة عملهم؛"], [125.0, "فإنّ مجرّد عملهم ـ أو عمل أغلبهم ـ من غير وجود خلافٍ منقولٍ عنهم في هذه الجزئيّة كافٍ في كونه مشروعًا."]], "tr": [[74.0, "Tevfik Allah'tandır, derim ki: Haleften selefe karşı vacip olan budur."], [80.3, "İnsanın selefin ameline mutlak olarak muhalefet etmeye yönelmesi uygun değildir;"], [99.4, "taabbudlarını ve amellerini, selef —Allah onlara rahmet etsin— hakkında sabit olana muhalefet ettiği bir şekil üzere bina etmesi de uygun değildir."], [108.0, "Selefin bir amel ya da söz üzerinde karar kıldığını gördüğün zaman, sana vacip olan onların ameline uyman, onlara muhalefet etmemen ve amellerinin doğruluğunu gösteren bir delil aramaya hırs göstermemendir."], [124.5, "Çünkü onların —ya da çoğunluğunun— sırf amel etmesi, bu cüz'î meselede onlardan nakledilmiş bir ihtilaf bulunmadığı takdirde, onun meşru olmasına yeterlidir."]]}, {"reader": false, "ar": [[136.0, "وإنّ من تنطّع بعض طلاب العلم أن يسعى جاهدًا ليبحث عن الدليل الخاص الذي يدلّ على صحة عمل السلف."], [149.0, "ولذلك فإنه لا ينبغي للإنسان أن يبحث عن الأدلة الجزئيّة التي تدلّ على صحة عمل السلف،"], [157.0, "اكتفاءً ـ اكتفاءً منه بثبوت عملهم بهذا الشيء."], [164.0, "هذا الذي ندين اللهَ عز وجل به."]], "tr": [[136.0, "Bazı ilim talebelerinin aşırılığından (tenattu') biri de selefin amelinin doğruluğunu gösteren özel delili araştırmak için var gücüyle çabalamasıdır."], [147.7, "Bu yüzden insanın selefin amelinin doğruluğunu gösteren cüz'î delilleri araştırması uygun değildir;"], [155.0, "onların bu şeyle amel ettiklerinin sabit olmasıyla yetinmelidir."], [160.0, "Allah Azze ve Celle'ye karşı din edindiğimiz (inandığımız) budur."]]}, {"reader": false, "ar": [[166.0, "ولذلك فأنا أرى من التنطّع الفقهيّ أن يستقرّ عملُ السلف على شيءٍ معيّن،"], [174.0, "ثم يسعى طالبُ العلم جاهدًا على البحث عن برهانٍ يدلّ على صحة عمل السلف؛"], [180.0, "فإنّ كونه من عمل السلف كافٍ في تصحيحه عند الخلف،"], [186.0, "وهذا من تعظيم السلف."], [188.0, "ولذلك قال الله عز وجل:"], [191.0, "<span class=\"ayah\">﴿وَمَن يُشَاقِقِ الرَّسُولَ مِن بَعْدِ مَا تَبَيَّنَ لَهُ الْهُدَىٰ وَيَتَّبِعْ غَيْرَ سَبِيلِ الْمُؤْمِنِينَ نُوَلِّهِ مَا تَوَلَّىٰ وَنُصْلِهِ جَهَنَّمَ وَسَاءَتْ مَصِيرًا﴾<\/span> <span class=\"ref\">[النساء: ١١٥]<\/span>."], [202.0, "ولمّا سُئل النبيّ صلى الله عليه وسلم عن الفرقة الناجية قال:"], [206.6, "«ما أنا عليه وأصحابي»."]], "tr": [[166.0, "Bu yüzden ben şunu fıkhî aşırılıktan sayarım:"], [169.3, "Selefin ameli belirli bir şey üzerinde karar kılmışken ilim talebesinin selefin amelinin doğruluğunu gösteren bir burhan araştırmak için var gücüyle çabalaması."], [177.9, "Çünkü onun selefin amelinden olması, halef nezdinde onu doğru kabul etmeye yeterlidir;"], [183.0, "bu da selefi tazim etmektendir."], [185.4, "Bu yüzden Allah Azze ve Celle şöyle buyurmuştur:"], [189.2, "<span class=\"ayah\">﴿Kim kendisine hidayet apaçık belli olduktan sonra Peygamber'e muhalefet eder ve mü'minlerin yolundan başka bir yola uyarsa, onu döndüğü yöne döndürürüz ve cehenneme sokarız. Orası ne kötü bir varış yeridir!﴾<\/span> [Nisâ 115]."], [203.2, "Nebî ﷺ'e kurtuluşa eren fırka sorulduğunda:"], [205.2, "\"Benim ve ashâbımın üzerinde bulunduğu şey(e uyanlar)\" buyurdu."]]}, {"reader": false, "ar": [[209.0, "ويكفي الإنسانَ أنّ الله عز وجل قد زكّى سلفَ الأمة من الصحابة رضي الله تعالى عنهم في كتابه،"], [218.3, "فزكّاهم باطنًا وظاهرًا، بل إنه اشترط لنجاة الخلف أن يتّفق إيمانُهم مع إيمان السلف،"], [229.0, "كما قال الله عز وجل:"], [231.7, "<span class=\"ayah\">﴿فَإِنْ آمَنُوا بِمِثْلِ مَا آمَنتُم بِهِ فَقَدِ اهْتَدَوا﴾<\/span> <span class=\"ref\">[البقرة: ١٣٧]<\/span>."], [236.0, "وهذا من تعظيم سلف الأمة وأئمّتها."]], "tr": [[209.0, "Allah Azze ve Celle'nin, ümmetin selefi olan sahâbeyi —Allah Teâlâ onlardan razı olsun— Kitabında tezkiye etmiş olması insana yeter;"], [216.7, "onları bâtınen ve zâhiren tezkiye etmiştir."], [219.4, "Hatta haleften kurtuluşu için imanlarının selefin imanıyla uyuşmasını şart koşmuştur."], [224.8, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [230.1, "<span class=\"ayah\">﴿Eğer onlar da sizin inandığınız gibi inanırlarsa doğru yolu bulmuş olurlar﴾<\/span> [Bakara 137]."], [236.0, "Bu, ümmetin selefini ve imamlarını tazim etmektendir."]]}]}, {"ts": "04:00", "title": "1. Külliye (devam): Selefin ameliyle sabit olan fer'î örnekler", "paras": [{"reader": false, "ar": [[240.0, "وعلى ذلك جُملٌ من الفروع كثيرة:"], [244.0, "منها: لقد جرى عملُ السلف على جواز الجمع بين العشاءين في المطر،"], [257.0, "ولا يُعرف عنهم خلافٌ في ذلك؛"], [262.0, "فأكثرُ العمل المنقول عنهم يدلّ دلالةً صريحةً على أنّ هذا من الأمور التي جرى عليها عملُ السلف."], [275.0, "فلا ينبغي للإنسان أن يتكلّف البحث عن دليلٍ يدلّ على مشروعيّة الجمع في المطر بخصوصه،"], [290.0, "اكتفاءً بما عليه السلف رحمهم الله تعالى."]], "tr": [[240.0, "Bunun üzerine pek çok fer'î mesele bina edilir."], [244.7, "Bunlardan biri: Selefin ameli, yağmurda iki yatsıyı (akşam ile yatsıyı) cem etmenin caiz olduğu yönünde cereyan etmiştir;"], [259.3, "bu hususta onlardan bir ihtilaf bilinmemektedir."], [264.2, "Onlardan nakledilen amelin çoğu, bunun selefin üzerinde amel ettiği işlerden olduğuna açıkça delâlet eder."], [273.6, "Bu yüzden insanın, selefin —Allah Teâlâ onlara rahmet etsin— üzerinde olduğu şeyle yetinip yağmurda cem etmenin meşruluğunu özel olarak gösteren bir delil araştırma zahmetine girmesi uygun değildir."]]}, {"reader": false, "ar": [[295.0, "ومن ذلك أيضًا: تركُ إقامة الحدود في أرض الحرب؛"], [304.0, "فإنّ الصحابة لم يكونوا يقيمون الحدود في أرض الحرب أبدًا."], [311.0, "فمن التنطّع الفقهيّ أن تسعى جاهدًا عن البحث عن دليلٍ خاصٍّ يدلّ على تأخير إقامة الحدّ في أرض الحرب."], [322.0, "فلم يكن أصحابُ النبيّ صلى الله عليه وسلم يقيمون شيئًا من الحدود في أرض الحرب،"], [331.0, "لا حدَّ شرب الخمر ولا حدَّ السرقة؛"], [335.1, "لأنها أرضٌ لا يصلح فيها تطبيقُ شيءٍ من هذه الحدود."], [341.0, "فإذا أخّرنا إقامة الحدّ في أرض المعركة استدلالًا بعمل السلف،"], [348.0, "فإنّ هذا جائزٌ سائغٌ من غير البحث عن دليلٍ خاصٍّ يدلّ على مشروعيّته بخصوصه."]], "tr": [[295.0, "Bunlardan biri de harp diyarında hadlerin uygulanmasının terk edilmesidir."], [304.7, "Sahâbe harp diyarında hadleri asla uygulamazdı."], [309.6, "Harp diyarında haddin uygulanmasının ertelenmesini gösteren özel bir delil araştırmak için var gücünle çabalaman fıkhî aşırılıktandır."], [320.3, "Nebî ﷺ'in ashâbı harp diyarında hadlerden hiçbirini uygulamazdı;"], [326.2, "ne içki içme haddini ne de hırsızlık haddini."], [331.6, "Çünkü orası bu hadlerden herhangi birinin uygulanmasının uygun olmadığı bir yerdir."], [339.2, "Selefin amelini delil alarak savaş meydanında haddin uygulanmasını ertelersek, bu, meşruluğunu özel olarak gösteren bir delil araştırmaksızın caiz ve kabul edilebilir bir şeydir."]]}, {"reader": false, "ar": [[356.0, "ومنها أيضًا: الصلاة في زيادات المسجد النبويّ،"], [360.9, "ومثلُه المسجد الحرام؛ فقد جرى عملُ السلف على أنهم كلّما زادوا شيئًا في المسجد النبويّ تقدّموا إلى الزيادة،"], [375.0, "وتركوا أصلَ المسجد الذي كان يصلّي فيه النبيّ صلى الله عليه وسلم،"], [380.0, "أقصد: المحراب. ولذلك لمّا زادوا في قبلة المسجد في عهد عمر تقدّم عمرُ والناس إلى الزيادة،"], [390.0, "ولمّا زادوها في عهد عثمان تقدّم عثمانُ والناس إلى هذه الزيادة،"], [396.0, "حتى صار المسجد الذي كان يصلّي فيه النبيّ صلى الله عليه وسلم من ورائهم."]], "tr": [[356.0, "Bunlardan biri de Mescid-i Nebevî'nin ilavelerinde namaz kılmaktır;"], [361.6, "Mescid-i Harâm da onun gibidir."], [367.5, "Selefin ameli şöyle cereyan etmiştir:"], [370.0, "Mescid-i Nebevî'ye bir şey ilave ettikçe ilaveye doğru öne geçerler ve Nebî ﷺ'in namaz kıldığı mescidin aslını —mihrabı kastediyorum— (geride) bırakırlardı."], [382.0, "Bu yüzden Ömer döneminde mescidin kıble tarafına ilave yaptıklarında Ömer ve insanlar ilaveye doğru öne geçti."], [390.8, "Osman döneminde de ilave yaptıklarında Osman ve insanlar bu ilaveye doğru öne geçti;"], [398.0, "öyle ki Nebî ﷺ'in namaz kıldığı mescit onların arkasında kaldı."]]}, {"reader": false, "ar": [[403.0, "فمن التنطّع ما نراه من بعض الناس ـ هداه الله ـ أنه يسعى جاهدًا ألّا تقع صلاته فريضةً في المسجد النبويّ إلا في حدود المسجد الذي كان على عهد النبيّ صلى الله عليه وسلم."], [420.0, "والمتقرّر في القواعد أنّ الزيادة لها حكمُ المزيد؛"], [426.0, "فما زِيد في المسجد الحرام فهو منه،"], [429.0, "وما زِيد في الطواف فهو منه،"], [432.0, "وما زِيد في المشاعر فهو منها،"], [436.0, "وما زِيد في السعي في المسعى فهو منه،"], [440.0, "وما زِيد في المسجد النبويّ فهو منه،"], [444.0, "وما زِيد في المسجد الأقصى فهو منه."], [447.2, "فليست صلاتُك في هذه الزيادات بمانعةٍ لك من ترتّب الأجر الوارد على الصلاة في هذه الأماكن الفاضلة."]], "tr": [[403.0, "Bazı insanlarda —Allah ona hidayet versin— gördüğümüz şey aşırılıktandır:"], [410.3, "Mescid-i Nebevî'de farz namazının, Nebî ﷺ dönemindeki mescidin sınırları dışında olmaması için var gücüyle çabalar."], [418.6, "Kaidelerde yerleşik olan şudur: İlave, ilave yapılan şeyin hükmündedir."], [426.0, "Mescid-i Harâm'a ilave edilen ondandır;"], [428.6, "tavaf (alanına) ilave edilen ondandır;"], [431.5, "meşâire ilave edilen onlardandır; mes'âda say (alanına) ilave edilen ondandır;"], [438.5, "Mescid-i Nebevî'ye ilave edilen ondandır;"], [442.3, "Mescid-i Aksâ'ya ilave edilen ondandır."], [445.3, "Bu ilavelerde namaz kılman, bu faziletli mekânlarda namaz kılmaya dair gelen ecrin sana terettüp etmesine engel değildir."]]}, {"reader": false, "ar": [[458.0, "ومنها أيضًا: زيادةُ الأذان الثالث يوم الجمعة،"], [463.0, "وأوّلُ من فعله عثمان رضي الله تعالى عنه،"], [468.0, "واستقرّ عليه أمرُ الصحابة،"], [470.4, "ولا يزال يتوارثه أهلُ السنة خلفًا،"], [474.0, "بل يتوارثه المسلمون خلفًا عن سلفٍ من غير نكيرٍ فيما بينهم."], [479.0, "فليس من السنة ولا من الشرع أن تبحث عن دليلٍ يدلّ عليه بخصوصه ما دام ثابتًا من عمل السلف."], [492.0, "ولا ينبغي تركُه حتى وإن انتفت علّتُه عند المتأخّرين؛"], [497.0, "فإننا لا نزال نواصل على ذلك الأذان إلى أن تقوم الساعة،"], [502.0, "اكتفاءً بعمل السلف به."]], "tr": [[458.0, "Bunlardan biri de cuma günü üçüncü ezanın ilave edilmesidir."], [463.6, "Bunu ilk yapan Osman'dır —Allah Teâlâ ondan razı olsun—;"], [468.6, "sahâbenin işi bunun üzerinde karar kılmıştır."], [471.6, "Ehl-i Sünnet onu halef halef tevarüs etmeye devam ediyor;"], [475.8, "hatta Müslümanlar onu, aralarında bir itiraz olmaksızın seleften halefe tevarüs ediyorlar."], [481.0, "Selefin ameliyle sabit olduğu sürece ona özel olarak delâlet eden bir delil araştırman ne sünnettendir ne de şeriattendir."], [492.6, "Sonrakiler nezdinde illeti ortadan kalkmış olsa bile onu terk etmek uygun değildir."], [498.4, "Selefin onunla amel etmesiyle yetinerek kıyamet kopuncaya kadar o ezana devam etmeyi sürdüreceğiz."]]}, {"reader": false, "ar": [[507.0, "ومنها أيضًا: لقد جرى عملُ السلف على استقبال الخطيب حالَ خطبته؛"], [515.0, "فقد ثبت ذلك عن جمعٍ من أصحاب النبيّ صلى الله عليه وسلم،"], [520.0, "وقرّره من بعدهم، حتى قال الإمام الترمذيّ:"], [525.0, "«العمل على هذا عند أهل العلم من أصحاب النبيّ صلى الله عليه وسلم وغيرهم»،"], [530.0, "بل قال الإمام ابن المنذر:"], [532.1, "«وهذا كالإجماع». مع أنك لو بحثتَ عن دليلٍ يدلّ على هذا الاستقبال بخصوصه لما وجدتَ إلا مرويّاتٍ ضعيفةً لا تقوم بها الحجّة،"], [543.0, "لكننا نستدلّ عليه بأنه من عمل السلف،"], [548.0, "وما جرى عليه عملُ السلف فلا يُطلب عليه دليلٌ بخصوصه."]], "tr": [[507.0, "Bunlardan biri de şudur: Selefin ameli, hatibe hutbe esnasında yönelmek üzerine cereyan etmiştir."], [515.4, "Bu, Nebî ﷺ'in ashâbından bir topluluktan sabit olmuş, onlardan sonrakiler de bunu takrir etmiştir."], [522.0, "Hatta İmam Tirmizî şöyle demiştir:"], [525.4, "\"Nebî ﷺ'in ashâbından ve diğerlerinden ilim ehli nezdinde amel bunun üzerinedir.\" Hatta İmam İbnü'l-Münzir:"], [530.0, "\"Bu, icmâ gibidir\" demiştir. Bununla birlikte bu yönelmeye özel olarak delâlet eden bir delil araştırsan, kendisiyle hüccet kâim olmayan zayıf rivayetlerden başka bir şey bulamazsın."], [542.1, "Fakat biz bunun selefin amelinden olmasını delil getiririz;"], [547.3, "selefin üzerinde amel ettiği şey için de özel bir delil istenmez."]]}, {"reader": false, "ar": [[551.0, "ومنها أيضًا: صلاة التراويح جماعةً؛"], [558.0, "فإنها لم تكن معروفةً على عهد النبيّ صلى الله عليه وسلم على وجه الدوام،"], [566.0, "ولا في عهد أبي بكر،"], [568.8, "وصدرًا من خلافة عمر،"], [571.0, "ثم جمع الناسَ على أُبيّ بن كعب رضي الله تعالى عنه،"], [576.0, "ولا يزال هذا الاجتماع يجري به عملُ السلف إلى يومنا هذا."], [581.0, "فمن التنطّع الفقهيّ أن تبحث عن دليلٍ يدلّ على مشروعيّة صلاة التراويح جماعةً في المسجد ما دام قد جرى عليه عملُ السلف الصالح."]], "tr": [[551.0, "Bunlardan biri de teravih namazını cemaatle kılmaktır."], [559.1, "Bu, Nebî ﷺ döneminde devamlı bir şekilde bilinmiyordu;"], [564.3, "Ebû Bekir döneminde ve Ömer'in hilafetinin ilk kısmında da (bilinmiyordu)."], [569.9, "Sonra (Ömer) insanları Übey b."], [572.8, "Kâ'b'ın —Allah Teâlâ ondan razı olsun— arkasında topladı."], [576.5, "Bu toplanma, bugüne kadar selefin ameliyle cereyan etmeye devam ediyor."], [581.6, "Selef-i sâlihînin ameli onun üzerinde cereyan ettiği sürece mescitte teravih namazını cemaatle kılmanın meşruluğunu gösteren bir delil araştırman fıkhî aşırılıktandır."]]}, {"reader": false, "ar": [[594.0, "ومنها أيضًا: مشروعيّة تصويم الصبيان الذين يطيقون الصوم؛"], [604.0, "فقد جرى عملُ أصحاب النبيّ صلى الله عليه وسلم على أنهم كانوا يصوّمون صبيانهم،"], [611.0, "فإذا جاعوا أعطوهم اللُّعَب من القطن أو العِهن يتسلّون بها حتى تغرب الشمس."], [621.0, "مع أنك لو بحثتَ عن دليلٍ يدلّ على مشروعيّة هذا بخصوصه مرفوعًا إلى النبيّ صلى الله عليه وسلم لما وجدت."], [629.0, "فإذا قيل لك: ما الدليل على ذلك؟"], [632.8, "فقل: الدليل عملُ السلف."], [635.0, "فهذا أمرٌ قد جرى عليه عملُ السلف،"], [638.2, "فلا ينبغي مخاصمتُهم فيه ولا منازعتُهم."]], "tr": [[594.0, "Bunlardan biri de oruca gücü yeten çocuklara oruç tutturmanın meşruluğudur."], [605.0, "Nebî ﷺ'in ashâbının ameli, çocuklarına oruç tutturmaları üzerine cereyan etmiştir;"], [610.5, "acıktıklarında onlara pamuktan ya da yünden oyuncaklar verirler, güneş batıncaya kadar onlarla oyalanırlardı."], [621.0, "Bununla birlikte bunun meşruluğunu özel olarak gösteren, Nebî ﷺ'e merfû bir delil araştırsan bulamazsın."], [627.0, "Sana \"Buna delil nedir?\" denirse, \"Delil selefin amelidir\" de."], [631.7, "Bu, selefin ameli üzerinde cereyan etmiş bir iştir;"], [636.4, "bu hususta onlarla husumet etmek ve çekişmek uygun değildir."]]}, {"reader": false, "ar": [[641.0, "ومنها أيضًا: أننا نقول بأنّ التوسّل بذوات الأولياء والصالحين بدعة،"], [654.0, "وأنّ التوسّل بجاه أحدٍ من المخلوقين بدعة؛"], [660.0, "فلا يجوز لك أن تتوسّل بذوات المخلوقين ولا بجاههم،"], [665.0, "وإنما لك أن تتوسّل إلى الله عز وجل بطلب الدعاء من الرجل الحيّ الحاضر القادر،"], [674.0, "وأمّا أن تتوسّل بذاته أو تتوسّل بجاهه فهذا من البدع."], [680.0, "فإن قيل: وما الدليل على أنه بدعة؟"], [683.0, "قل: عملُ السلف؛ فإنه لم يجرِ عملُ السلف على التوسّل إلى الله عز وجل لا بذات أحدٍ من المخلوقين ولا بجاهه،"], [693.0, "وإنما كانوا يتوسّلون بطلب الدعاء من الأولياء والصالحين."]], "tr": [[641.0, "Bunlardan biri de şudur: Biz velîlerin ve sâlihlerin zâtlarıyla tevessülün bid'at olduğunu, mahlûklardan herhangi birinin câhıyla (makamıyla) tevessülün bid'at olduğunu söyleriz."], [660.6, "Mahlûkların zâtlarıyla da câhlarıyla da tevessül etmen caiz değildir."], [665.0, "Sen ancak hayatta olan, hazır bulunan ve gücü yeten kişiden dua talep ederek Allah Azze ve Celle'ye tevessül edebilirsin."], [675.2, "Onun zâtıyla ya da câhıyla tevessül etmene gelince, bu bid'atlerdendir."], [680.4, "\"Bunun bid'at olduğuna delil nedir?\" denirse, de ki:"], [683.5, "Selefin ameli. Çünkü selefin ameli, Allah Azze ve Celle'ye ne mahlûklardan birinin zâtıyla ne de câhıyla tevessül etmek üzerine cereyan etmemiştir;"], [692.5, "onlar ancak velîlerden ve sâlihlerden dua talep ederek tevessül ederlerdi."]]}, {"reader": false, "ar": [[697.0, "فقد كانوا يطلبون الدعاء من النبيّ صلى الله عليه وسلم فيدعو لهم،"], [702.0, "وقد توسّل عمرُ والناسُ بالعبّاس يومَ قُحِطت المدينة،"], [709.0, "فقام العبّاس ودعا. وكذلك توسّل أهلُ الشام بأبي الأسود الدؤليّ <span class=\"q\">؟ 11:49<\/span>."], [714.0, "وأمر النبيّ صلى الله عليه وسلم من لقي أُويسًا أن يطلب منه أن يستغفر له."], [722.0, "فهذه هي حدود جواز التوسّل بالرجل الحيّ الحاضر القادر."], [729.0, "وأمّا أن تتوسّل إلى الله بذاته أو بجاهه فإنه لم يجرِ به عملُ السلف؛"], [736.0, "فلك الحقُّ الكامل أن تقول:"], [738.9, "هذا من البدع؛ لأنه لم يجرِ به عملُ السلف، وهي القاعدة الثانية."]], "tr": [[697.0, "Nebî ﷺ'den dua talep ederlerdi, o da onlara dua ederdi."], [700.8, "Medine kıtlığa uğradığı gün Ömer ve insanlar Abbas ile tevessül etti;"], [706.4, "Abbas kalkıp dua etti. Aynı şekilde Şam ehli de Ebu'l-Esved ed-Düelî <span class=\"q\">؟<\/span> ile tevessül etti."], [715.1, "Nebî ﷺ, Üveys'e rastlayan kimseye, ondan kendisi için istiğfar etmesini talep etmesini emretti."], [721.5, "İşte hayatta olan, hazır bulunan ve gücü yeten kişiyle tevessülün caiz olmasının sınırları bunlardır."], [730.0, "Allah'a onun zâtıyla ya da câhıyla tevessül etmene gelince, selefin ameli bununla cereyan etmemiştir."], [736.6, "Dolayısıyla \"Bu bid'atlerdendir\" demeye tam hakkın vardır;"], [740.1, "çünkü selefin ameli bununla cereyan etmemiştir. Bu da ikinci kaidedir."]]}, {"reader": false, "ar": [[746.0, "ومن الفروع أيضًا: مشروعيّة دعاء ختم القرآن في التراويح؛"], [759.0, "فإننا لا نعلم إنكاره عن واحدٍ من السلف،"], [764.0, "مع أنّ الإمام أحمد وسفيان بن عيينة كانا يفعلانه ويأمران به،"], [770.5, "وينقلانه عن أهل مكة وأهل البصرة،"], [774.0, "وأنت تعرف أنّ أهل مكة فيهم الصحابة والتابعون،"], [777.7, "والبصرة أيضًا فيهم الصحابة والتابعون."], [780.0, "فمن قال: أين الدليل؟"], [782.1, "فإننا نستدلّ عليه بأنه جرى عليه عملُ السلف من غير نكير."]], "tr": [[746.0, "Fer'î meselelerden biri de teravihte hatim duasının meşruluğudur."], [751.0, "Seleften herhangi birinin onu inkâr ettiğini bilmiyoruz."], [762.1, "Üstelik İmam Ahmed ve Süfyân b."], [765.8, "Uyeyne onu yapar, onu emreder ve onu Mekke ehlinden ve Basra ehlinden nakleder(ler)di."], [772.8, "Bilirsin ki Mekke ehli arasında sahâbe ve tâbiîn vardı;"], [777.2, "Basra'da da sahâbe ve tâbiîn vardı."], [780.0, "\"Delil nerede?\" diyen olursa, biz onun, itiraz edilmeksizin selefin ameli üzerinde cereyan etmesini delil getiririz."]]}, {"reader": false, "ar": [[788.0, "بل واللهِ لم تطّلع عيني على من ينكره إلا بعضَ العلماء في هذا الزمان المعاصر،"], [796.0, "وألّف فيه بعضُ المعاصرين مؤلَّفًا ينكره،"], [800.1, "ولكنّ إنكاره لا سلفَ له فيه."], [806.0, "فمسألة دعاء ختم القرآن في التراويح دائرةٌ بين أمرين:"], [812.0, "بين أنه منقولٌ من عمل السلف،"], [815.5, "أو أنه من الأمر المسكوت عنه."], [819.0, "لكنّ الأمر الثالث ـ وهو إنكاره ـ فإنه لا يُعرف عن أحدٍ من السلف أبدًا؛"], [825.0, "فهم بين ناقلٍ لفعله،"], [827.5, "وبين ساكتٍ عن إنكاره."]], "tr": [[788.0, "Hatta vallahi, onu inkâr eden kimseye —bu çağdaki bazı âlimler dışında— gözüm ilişmedi."], [794.4, "Bazı çağdaşlar onu inkâr eden bir eser de telif etti;"], [800.8, "fakat onun inkârının bu konuda bir selefi yoktur."], [807.3, "Teravihte hatim duası meselesi iki şey arasında döner:"], [812.6, "Ya selefin amelinden nakledilmiştir ya da hakkında susulmuş işlerdendir."], [817.8, "Fakat üçüncü şık —yani onu inkâr etmek— seleften hiç kimseden asla bilinmemektedir."], [823.2, "Onlar ya onun yapıldığını nakleden ya da onu inkâr etmekten susan kimselerdir."]]}, {"reader": false, "ar": [[830.0, "وإنه يبعد جدًّا أن تتوارد هذه القرون المتطاولة على فعل شيءٍ مع سكوت البقيّة إلا وأنه من العمل الذي لا إنكار فيه."], [847.0, "فلا ينبغي أن ينتدب أحدٌ في هذه القرون ـ أو في هذا القرن ـ ثم ينهى الناس عن أمرٍ قد جرى عليه عملُهم."]], "tr": [[830.0, "Bu uzun asırların, geri kalanların susmasıyla birlikte bir şeyi yapmakta birbirini izlemesi, ancak onun hakkında inkâr bulunmayan bir amel olmasıyla mümkündür;"], [844.2, "aksi çok uzak bir ihtimaldir."], [847.7, "Bu asırlarda —ya da bu asırda— birinin ortaya çıkıp insanları, amellerinin üzerinde cereyan ettiği bir işten nehyetmesi uygun değildir."]]}, {"reader": false, "ar": [[856.0, "ومنها أيضًا: القراءة في الماء وإراقتُه على المريض؛"], [867.0, "فإنك لو بحثتَ في السنة المرفوعة لما وجدتَ شيئًا يدلّ عليه بخصوصه،"], [872.0, "ولكن جرى عليه عملُ السلف من غير نكيرٍ فيما بينهم."], [877.7, "ما أدري، كلامي واضح؟"], [879.9, "ولذلك ـ يعني ـ لله درُّ الإمام الشاطبيّ لمّا قال:"], [885.0, "«الحذرَ الحذرَ ـ الحذرَ الحذرَ ـ من مخالفة الأوّلين، فلو كان ثَمّ فضلٌ لكان الأوّلون أحقَّ به»."]], "tr": [[856.0, "Bunlardan biri de suya (Kur'an) okuyup onu hastanın üzerine dökmektir."], [867.4, "Merfû sünnette araştırsan ona özel olarak delâlet eden bir şey bulamazsın;"], [871.6, "fakat selefin ameli, aralarında bir itiraz olmaksızın onun üzerine cereyan etmiştir."], [877.3, "Bilmiyorum, sözüm açık mı? Bu yüzden İmam Şâtıbî'ye aferin olsun!"], [883.1, "Şöyle demiştir: \"Sakının, sakının —sakının, sakının— öncekilere muhalefet etmekten!"], [888.2, "Eğer orada bir fazilet olsaydı, öncekiler ona daha layık olurdu.\""]]}, {"reader": false, "ar": [[901.0, "وقال رحمه الله: «فما كانوا عليه من فعلٍ أو تركٍ فهو السنّة» ـ يعني:"], [909.6, "إن ثبت عنهم التركُ فالسنّةُ التركُ،"], [913.3, "وإن ثبت عنهم الفعلُ فالسنّةُ الفعل ـ «فهو السنّة والأمر المعتبر، وهو الهدى، فليس ثَمّ» ـ أي:"], [921.7, "فليس هناك ـ «إلا صوابٌ وخطأ؛ فكلُّ من خالف السلف الأوّلين فهو على الخطأ»."], [933.0, "لأنك إن أنكرتَ عملهم فإنك تخطّئ السلف الذين بُني الدين على نقلهم،"], [941.8, "وعلى فهمهم، وعلى منهجهم؛"], [944.0, "فتخطئةُ الأقلّ من الخلف خيرٌ لنا وأحبُّ إلى قلوبنا من تخطئة السلف."]], "tr": [[901.0, "(Şâtıbî) —Allah ona rahmet etsin— şöyle demiştir:"], [905.0, "\"Onların üzerinde bulunduğu fiil ya da terk, sünnettir.\" —Yani onlardan terk sabit olursa sünnet terktir;"], [913.3, "onlardan fiil sabit olursa sünnet fiildir.— \"O, sünnet ve itibar edilen iştir;"], [919.8, "o hidayettir. Orada\" —yani burada— \"doğru ve yanlıştan başkası yoktur."], [923.9, "Önceki selefe muhalefet eden herkes yanlış üzeredir.\" Çünkü onların amelini inkâr edersen, dinin onların nakli, anlayışı ve metodu üzerine bina edildiği selefi hatalı saymış olursun."], [942.3, "Haleften (sayıca) az olanı hatalı saymak, bizim için selefi hatalı saymaktan daha hayırlı ve kalplerimize daha sevimlidir."]]}, {"reader": false, "ar": [[951.0, "وقال الإمام الشاطبيّ رحمه الله:"], [954.0, "«ينبغي للعامل أن يتحرّى العملَ على وَفق الأوّلين» ـ يعني:"], [959.5, "لا ينبغي له أن يتحرّى ما يخالف المنقول عن سلف الأمة وأئمّتها. والله أعلم."]], "tr": [[951.0, "İmam Şâtıbî —Allah ona rahmet etsin— şöyle demiştir:"], [954.6, "\"Amel eden kişinin, öncekilere uygun şekilde amel etmeyi gözetmesi gerekir.\" Yani ümmetin selefinden ve imamlarından nakledilene aykırı olanı gözetmesi uygun değildir. Allah en iyisini bilir."]]}]}, {"ts": "16:11", "title": "2. Külliye: Selefin ameli üzerinde cereyan etmeyen her şey bid'attir", "paras": [{"reader": false, "ar": [[971.0, "الكلّيّة الثانية: <b>كلُّ ما لم يجرِ عليه عملُ السلف فبدعة.<\/b> كلُّ ما لم يجرِ عليه عملُ السلف فبدعة."]], "tr": [[971.0, "<b>2. külliye: Selefin ameli üzerinde cereyan etmeyen her şey bid'attir.<\/b> Selefin ameli üzerinde cereyan etmeyen her şey bid'attir."]]}, {"reader": false, "ar": [[994.9, "كقراءة القرآن في المقبرة،"], [999.8, "المنقولِ تجويزُه عن بعض الفقهاء؛"], [1006.0, "فإننا نردّ عليه بأنّ هذا لم يجرِ عليه عملُ السلف،"], [1010.0, "فحكمنا عليه بأنه بدعة:"], [1012.7, "لأنه لا دليل عليه أوّلًا،"], [1016.0, "ولأنه لم يجرِ عليه عملُ السلف."], [1018.0, "وكالاحتفال بالمولد النبويّ؛ فإنّ النبيّ صلى الله عليه وسلم كان بين ظهرانيهم،"], [1026.0, "ولم يحتفلوا به حتى انقضى عصرُ الصحابة،"], [1029.0, "ومضى بعده عصرُ التابعين وأتباع التابعين،"], [1035.0, "ولا يُعرف عن سلفيٍّ واحدٍ أنه أجاز أو أقرّ أو أشار بمثل هذا الأمر،"], [1045.0, "الذي يجعله المتأخّرون من أعظم ما يدلّ على محبّة مَن؟"], [1051.0, "محبّة النبيّ صلى الله عليه وسلم."], [1054.0, "فلنا الحقُّ الكامل أن نقول:"], [1055.7, "هو من البدع؛ لعدم وجود الدليل بخصوصه،"], [1058.0, "ولأنه لم يجرِ عليه عملُ السلف."]], "tr": [[994.9, "Bazı fakihlerden caiz görüldüğü nakledilen kabristanda Kur'an okumak gibi."], [1002.7, "Biz buna, selefin ameli bunun üzerinde cereyan etmemiştir diye reddiye veririz ve onun bid'at olduğuna hükmederiz:"], [1012.0, "Birincisi, onun üzerine bir delil olmadığı için;"], [1016.3, "(ikincisi) selefin ameli onun üzerinde cereyan etmediği için."], [1019.9, "Mevlid-i Nebevî'yi kutlamak da böyledir."], [1023.8, "Nebî ﷺ onların arasındaydı, (yine de) sahâbe asrı geçip gidinceye kadar onu kutlamadılar;"], [1029.0, "ondan sonra tâbiîn ve tebe-i tâbiîn asrı da geçti."], [1036.3, "Seleften tek bir kişinin bile, sonrakilerin kimin sevgisine delâlet eden en büyük şeylerden saydığı —Nebî ﷺ'in sevgisine— bu işi caiz gördüğü, onayladığı ya da ona işaret ettiği bilinmemektedir."], [1052.5, "Bu yüzden onun bid'atlerden olduğunu söylemeye tam hakkımız vardır;"], [1056.0, "çünkü ona özel bir delil yoktur ve selefin ameli onun üzerinde cereyan etmemiştir."]]}, {"reader": false, "ar": [[1061.0, "وكإهداء ثواب الأعمال للنبيّ صلى الله عليه وسلم؛"], [1070.0, "فإنّ من الناس مَن فرطِ حبّه لرسول الله صلى الله عليه وسلم أنه ربما أشركه في صدقته،"], [1077.4, "أشركه في بئرٍ يحفره،"], [1080.2, "في مسجدٍ يبنيه. وإنّ إهداء الأعمال للنبيّ صلى الله عليه وسلم أمرٌ محدَث لم يجرِ عليه عملُ السلف،"], [1091.0, "ولأنه هو مَن دلّنا أصلًا وهدانا ـ هدايةَ دلالةٍ وإرشاد ـ إلى هذه الأعمال،"], [1101.0, "والمتقرّر في القواعد أنّ من دلّ على خيرٍ فله مثلُ أجر فاعله؛"], [1106.0, "فكلُّ ما تفعله الأمة من الخير فللنبيّ صلى الله عليه وسلم مثلُ أجره،"], [1112.0, "سواءٌ قصدتَ أو لم تقصد."], [1116.0, "أمّا قصدُه بعينه فإنه من المحدثات؛"], [1121.0, "لأنه لم يجرِ عليه عملُ السلف."]], "tr": [[1061.0, "Amellerin sevabını Nebî ﷺ'e hediye etmek de böyledir."], [1066.1, "İnsanlardan bazıları, Resûlullah ﷺ'e olan aşırı sevgisinden dolayı, belki onu sadakasına ortak eder;"], [1074.0, "kazdığı bir kuyuya, inşa ettiği bir mescide ortak eder."], [1079.5, "Amelleri Nebî ﷺ'e hediye etmek, selefin ameli üzerinde cereyan etmemiş, sonradan çıkarılmış bir iştir."], [1087.8, "Ayrıca bizi bu amellere aslında yönlendiren ve —delâlet ve irşad hidayetiyle— hidayet eden odur."], [1096.5, "Kaidelerde yerleşik olan şudur: Bir hayra yönlendiren kişi için, onu yapanın ecri kadar ecir vardır."], [1105.2, "Dolayısıyla ümmetin yaptığı her hayırda, sen kastetsen de kastetmesen de Nebî ﷺ için onun ecri kadar ecir vardır."], [1113.6, "Onu bizzat kastetmeye gelince, bu sonradan çıkarılmış şeylerdendir;"], [1119.8, "çünkü selefin ameli onun üzerinde cereyan etmemiştir."]]}, {"reader": false, "ar": [[1126.0, "وكالصعود إلى غار حراء تعبّدًا واتّباعًا؛"], [1130.7, "فإنّ هذا ممّا لم يجرِ عليه عملُ السلف؛"], [1136.0, "فإنّ الغار لا يزال موجودًا،"], [1139.2, "والسلف متوافرون، ومع ذلك لم يثبت عن أحدٍ منهم أنه كان يُحيي هذا الغار بكثرة الزيارة أو الإتيان إليه."]], "tr": [[1126.0, "Taabbud ve ittiba amacıyla Hira mağarasına çıkmak da böyledir."], [1132.0, "Bu, selefin ameli üzerinde cereyan etmemiş şeylerdendir."], [1136.0, "Mağara hâlâ mevcuttur, selef de çok sayıdaydı;"], [1142.0, "buna rağmen onlardan herhangi birinin bu mağarayı çokça ziyaret ederek ya da oraya gelerek ihya ettiği sabit olmamıştır."]]}, {"reader": false, "ar": [[1150.0, "وكالوصيّة لزائر المدينة أن يسلّم على النبيّ صلى الله ـ أن ينقل سلامَ الآخرين للنبيّ صلى الله عليه وسلم؛"], [1165.0, "فإننا نجد أنّ الناس إذا علموا أنّ فلانًا سيذهب إلى مسجد المدينة يقولون:"], [1171.0, "سلِّمْ لنا على رسول الله."], [1173.0, "فهذا أمرٌ محدَث لم يجرِ عليه عملُ السلف،"], [1177.2, "ولا يُعرف عن واحدٍ من أهل مكة من السلف أنهم كانوا يوصون من سيذهب إلى المدينة بذلك،"], [1186.0, "أو من السلف من أهل الشام أو العراق أنهم كانوا يوصون الذاهبَ إلى المدينة بشيءٍ من ذلك،"], [1196.0, "ولو كان ذلك من عملهم لنُقل إلينا."]], "tr": [[1150.0, "Medine'yi ziyaret edecek kişiye Nebî ﷺ'e selam vermesini —(yani) başkalarının selamını Nebî ﷺ'e iletmesini— tavsiye etmek de böyledir."], [1165.9, "İnsanların, falancanın Medine mescidine gideceğini öğrendiklerinde \"Bizden Resûlullah'a selam söyle\" dediklerini görüyoruz."], [1172.1, "Bu, selefin ameli üzerinde cereyan etmemiş, sonradan çıkarılmış bir iştir."], [1177.8, "Seleften Mekke ehlinden birinin Medine'ye gidecek kişiye bunu tavsiye ettiği bilinmemektedir;"], [1184.5, "seleften Şam ya da Irak ehlinden birinin Medine'ye gidene bundan bir şey tavsiye ettiği de (bilinmemektedir)."], [1194.9, "Eğer bu onların amelinden olsaydı bize nakledilirdi."]]}, {"reader": false, "ar": [[1200.0, "ولأنّ النبيّ صلى الله عليه وسلم كفانا مؤونةَ هذا النقل بقوله:"], [1205.7, "«ما من مسلمٍ يسلّم عليّ إلا ردّ الله عليّ روحي حتى أردَّ عليه السلام» صلى الله عليه وسلم،"], [1215.0, "ويقول صلى الله عليه وسلم:"], [1217.9, "«وصلّوا عليّ؛ فإنّ صلاتكم تبلغني حيث كنتم»."], [1222.0, "فالمسلِّم عليه بجوار قبره كالمسلِّم عليه وهو في الأندلس؛"], [1229.0, "لأنّ الملائكة تنقل سلامَ الغائبين عنه إليه،"], [1233.9, "فيردّ عليهم السلام. فليست هذه الوصيّة من عمل السلف،"], [1241.2, "فنجعلها من جملة البدع."]], "tr": [[1200.0, "Ayrıca Nebî ﷺ şu sözüyle bizi bu nakil zahmetinden kurtarmıştır:"], [1204.5, "\"Bana selam veren hiçbir Müslüman yoktur ki Allah ruhumu bana iade etmesin de ben onun selamını almayayım.\" ﷺ."], [1213.2, "Yine ﷺ şöyle buyurur: \"Bana salavat getirin;"], [1216.8, "nerede olursanız olun salavatınız bana ulaşır.\" Kabrinin yanında ona selam veren, Endülüs'te iken ona selam veren gibidir;"], [1226.3, "çünkü melekler kendisinden uzakta olanların selamını ona iletir, o da onların selamını alır."], [1235.3, "Bu tavsiye selefin amelinden değildir;"], [1239.8, "bu yüzden onu bid'atler arasında sayarız."]]}, {"reader": false, "ar": [[1246.0, "وكإعلان البراءة من الكفّار في الحجّ،"], [1250.3, "كما يفعله الرافضة؛ فإنهم يقفون في مِنى ويعلنون البراءة من الكفر والكافرين،"], [1260.0, "استدلالًا بحديث أبي بكر لمّا بعثه النبيّ صلى الله عليه وسلم إلى مكة قبل حجّة الوداع معلنًا:"], [1270.5, "«ألا لا يحجّنّ بعد العام مشرك، ولا يطوف بالبيت عُريان»،"], [1276.0, "فهذه براءةٌ من الكفر والكافرين."], [1279.0, "فسار على ذلك بعضُ الطوائف الضالّة،"], [1284.0, "فصارت تُعلن البراءة من الكفر والكافرين في كلّ موسمٍ للحجّ."], [1289.0, "وهل على هذا عملُ السلف؟"], [1292.0, "الجواب: ليس عليه عملُهم."], [1295.0, "فجعل العلماءُ إعلانَ هذه البراءة من جملة البدع والمحدثات التي ما أنزل الله بها من سلطان."]], "tr": [[1246.0, "Hacda kâfirlerden berâetin ilan edilmesi de böyledir;"], [1250.3, "Râfıza bunu yapar. Mina'da durup küfürden ve kâfirlerden berâeti ilan ederler."], [1258.0, "Delil olarak da Nebî ﷺ'in Vedâ haccından önce Ebû Bekir'i Mekke'ye gönderdiğinde (onun) \"Dikkat edin!"], [1266.2, "Bu yıldan sonra hiçbir müşrik hac yapmayacak ve Beyt'i hiç kimse çıplak tavaf etmeyecek\" diye ilan etmesi hadisini gösterirler;"], [1275.5, "(derler ki) bu, küfürden ve kâfirlerden berâettir."], [1279.0, "Bazı sapık fırkalar bu yolu izledi ve her hac mevsiminde küfürden ve kâfirlerden berâeti ilan etmeye başladı."], [1288.5, "Selefin ameli bunun üzerinde midir?"], [1290.8, "Cevap: Onların ameli bunun üzerinde değildir."], [1294.2, "Bu yüzden âlimler bu berâetin ilan edilmesini, Allah'ın hakkında hiçbir delil indirmediği bid'atler ve sonradan çıkarılmış şeyler arasında saymışlardır."]]}, {"reader": false, "ar": [[1304.0, "وكرفع الصوت بشيءٍ من الأذكار حالَ تشييع الجنائز؛"], [1313.0, "فإنّ الجنائز كانت تُشيَّع في عصر السلف،"], [1320.0, "ولم يثبت عنهم أنهم كانوا يرفعون أصواتهم بشيءٍ من القرآن ولا من الذكر."], [1325.0, "فلك الحقّ أن تقول:"], [1327.0, "إنّ هذا من البدع؛"], [1329.0, "لعدم وجود الدليل عليه،"], [1331.0, "ولأنه لم يجرِ أصلًا عليه عملُ السلف."], [1334.0, "فبأيّ العلّتين علّلتَ فتكون مصيبًا وجهَ الحقّ."]], "tr": [[1304.0, "Cenazeleri teşyi ederken zikirlerden bir şeyle sesi yükseltmek de böyledir."], [1313.7, "Selef asrında cenazeler teşyi edilirdi;"], [1317.5, "onların Kur'an'dan ya da zikirden bir şeyle seslerini yükselttikleri sabit olmamıştır."], [1323.8, "\"Bu bid'atlerdendir\" demeye hakkın vardır;"], [1325.5, "çünkü onun üzerine bir delil yoktur ve selefin ameli aslında onun üzerinde cereyan etmemiştir."], [1332.3, "Bu iki illetten hangisiyle gerekçelendirirsen gerekçelendir, hakkın yüzünü isabet ettirmiş olursun."]]}, {"reader": false, "ar": [[1338.0, "وكتغطية الميّت بخرقةٍ كُتب عليها شيءٌ من القرآن،"], [1347.0, "كما ترونه كثيرًا، ويجعلون ذلك ممّا ينفع الميّت،"], [1354.0, "وممّا يحميه ويعصمه من العذاب؛"], [1357.0, "وهذا من المحدثات والبدع؛"], [1359.8, "لأنه لم يجرِ عليها عملُ السلف."], [1365.0, "وكتسجية قبر الرجل حالَ الدفن؛"], [1370.0, "فإنّ تسجية القبر حالَ الدفن إنما هو مشروعٌ في حقّ النساء،"], [1376.0, "وأمّا في حقّ الرجال فإنه لم يجرِ عليه عملُ السلف،"], [1380.0, "فلك الحقّ أن تقول:"], [1382.2, "إنّ تسجية قبر الرجل من البدع المحدثة؛"], [1386.0, "لأنه ليس من عمل السلف. فهمتم هذا؟"]], "tr": [[1338.0, "Sıkça gördüğünüz gibi, ölüyü üzerine Kur'an'dan bir şey yazılmış bir bezle örtmek de böyledir."], [1351.6, "Bunu ölüye fayda veren, onu azaptan koruyan ve muhafaza eden bir şey sayarlar."], [1358.4, "Bu, sonradan çıkarılmış şeylerden ve bid'atlerdendir;"], [1362.6, "çünkü selefin ameli onun üzerinde cereyan etmemiştir."], [1368.2, "Defin esnasında erkeğin kabrini (bir örtüyle) örtmek de böyledir."], [1373.8, "Defin esnasında kabri örtmek ancak kadınlar hakkında meşrudur."], [1377.2, "Erkekler hakkında ise selefin ameli onun üzerinde cereyan etmemiştir."], [1380.5, "Bu yüzden \"Erkeğin kabrini örtmek sonradan çıkarılmış bid'atlerdendir\" demeye hakkın vardır;"], [1385.5, "çünkü o selefin amelinden değildir. Bunu anladınız mı?"]]}]}, {"ts": "23:12", "title": "3. Külliye: Âmm ve mutlak lafzın, selefin ameli üzerinde cereyan etmeyen sureti o lafza dahil değildir", "paras": [{"reader": false, "ar": [[1392.0, "ومن الكلّيّات أيضًا، ومن الكلّيّات أيضًا:"], [1399.0, "<b>كلُّ صورةٍ من صور العموم والإطلاق لم يجرِ عليها عملُ السلف فليست منها.<\/b> أي:"], [1418.7, "فليست من العموم ولا من الإطلاق."], [1422.9, "أُعيدها مرةً ثانية: كلُّ صورةٍ من صور العموم والإطلاق لم يجرِ عليها عملُ السلف فليست منها."]], "tr": [[1392.0, "Külliyelerden biri de —külliyelerden biri de— şudur:"], [1399.0, "<b>3. külliye: Umum ve itlak (genel ve mutlak lafız) suretlerinden, selefin ameli üzerinde cereyan etmeyen her suret onlardan değildir.<\/b> Yani ne umumdan ne de itlaktandır."], [1424.3, "İkinci kez tekrarlıyorum: Umum ve itlak suretlerinden, selefin ameli üzerinde cereyan etmeyen her suret onlardan değildir."]]}, {"reader": false, "ar": [[1435.0, "أقول وبالله التوفيق: وذلك لأنّ اللفظ العامّ يجب بقاؤه على عموم أفراده،"], [1444.0, "فمن أراد أن يُخرج فردًا من أفراد العموم فهو مطالَبٌ بالدليل الدالّ على هذا الإخراج."], [1450.0, "وكذلك المطلق، فالواجب بقاؤه على إطلاقه،"], [1455.0, "فمن أراد أن يُخرج فردًا من أفراد الإطلاق فإننا نطالبه بالدليل."], [1462.0, "لكنّ أيَّ صورةٍ تدخل تحت اللفظ العامّ،"], [1466.3, "وأيَّ صورةٍ تدخل تحت اللفظ المطلق،"], [1469.9, "لم يجرِ عليها عملُ السلف ـ بمعنى أنّ السلف لم يعملوا بهذه الصورة من صور العموم،"], [1478.0, "ولا بهذه الصورة من صور الإطلاق ـ فأخرِجْ هاتين الصورتين ـ أخرِجْ هذه الصورة ـ ولا تجعل العمومَ دالًّا عليها،"], [1487.9, "ولا تجعل المطلقَ دالًّا عليها."]], "tr": [[1435.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [1438.4, "Âmm (genel) lafzın, fertlerinin umumu üzere bâki kalması vaciptir."], [1444.8, "Umumun fertlerinden bir ferdi (onun dışına) çıkarmak isteyenden, bu çıkarmaya delâlet eden delil istenir."], [1450.8, "Mutlak da böyledir; itlakı üzere bâki kalması vaciptir."], [1456.9, "İtlakın fertlerinden bir ferdi çıkarmak isteyenden delil isteriz."], [1462.0, "Fakat âmm lafzın altına giren herhangi bir suret ve mutlak lafzın altına giren herhangi bir suret selefin ameli üzerinde cereyan etmemişse —yani selef umum suretlerinden bu suretle de itlak suretlerinden bu suretle de amel etmemişse— bu iki sureti —bu sureti— çıkar;"], [1484.8, "umumu ona delâlet eden, mutlakı da ona delâlet eden kılma."]]}, {"reader": false, "ar": [[1491.0, "وإنّ من أعظم أبواب البدع:"], [1494.4, "الاستدلالَ بالعموم على صورةٍ لم يجرِ عليها عملُ السلف،"], [1502.0, "أو الاستدلالَ بالإطلاق على صورةٍ لم يجرِ عليها عملُ السلف."], [1508.0, "فأيُّ صورةٍ من صور العموم والإطلاق لم يجرِ عليها عملُ السلف فاحذر ـ فاحذر كلَّ الحذر ـ أن تجعل العمومَ دالًّا عليها،"], [1520.3, "أو المطلقَ دالًّا عليها."]], "tr": [[1491.0, "Bid'atlerin en büyük kapılarından biri, selefin ameli üzerinde cereyan etmemiş bir surete umumu delil getirmek ya da selefin ameli üzerinde cereyan etmemiş bir surete itlakı delil getirmektir."], [1507.4, "Umum ve itlak suretlerinden selefin ameli üzerinde cereyan etmemiş herhangi bir suret (olursa), umumu ona delâlet eden ya da mutlakı ona delâlet eden kılmaktan sakın —tam anlamıyla sakın."]]}, {"reader": false, "ar": [[1523.0, "فإن قلت: اضربْ لنا أمثلةً على ذلك،"], [1527.2, "فأقول: الأمثلة كثيرة: منها مثلًا:"], [1530.0, "في قول الله عز وجل:"], [1532.5, "<span class=\"ayah\">﴿فَاقْرَءُوا مَا تَيَسَّرَ مِنَ الْقُرْآنِ﴾<\/span> <span class=\"ref\">[المزمل: ٢٠]<\/span>؛"], [1535.0, "فالله عز وجل أمر بقراءة ما تيسّر من كتاب الله أمرًا مطلقًا،"], [1540.0, "فيدخل تحت القراءة صورٌ كثيرة:"], [1544.0, "القراءة في الصلاة الفريضة،"], [1545.8, "القراءة في صلاة النافلة،"], [1547.6, "القراءة خارج الصلاة؛ تدخل تحت هذا الأمر صورٌ كثيرة."], [1553.0, "لكن إيّاك أن تُدخل فيها صورةَ القراءة الجماعيّة؛"], [1560.0, "لأنّ تلك الصورة لم يجرِ عليها عملُ السلف."]], "tr": [[1523.0, "Şayet \"Bize buna örnekler ver\" dersen, derim ki:"], [1527.2, "Örnekler çoktur. Bunlardan biri, mesela, Allah Azze ve Celle'nin şu sözündedir:"], [1532.5, "<span class=\"ayah\">﴿Kur'an'dan kolayınıza geleni okuyun﴾<\/span> [Müzzemmil 20]."], [1535.4, "Allah Azze ve Celle, Allah'ın Kitabı'ndan kolay geleni okumayı mutlak bir emirle emretmiştir."], [1540.8, "Okumanın altına pek çok suret girer:"], [1544.5, "Farz namazda okumak, nafile namazda okumak, namaz dışında okumak."], [1548.1, "Bu emrin altına pek çok suret girer."], [1552.3, "Fakat toplu (hep bir ağızdan) okuma suretini ona dahil etmekten sakın;"], [1560.6, "çünkü o surette selefin ameli cereyan etmemiştir."]]}, {"reader": false, "ar": [[1565.0, "فإنه لا يُحفظ عن السلف رحمهم الله تعالى أنهم كانوا يجتمعون في مجلسٍ واحد ويقرؤون بصوتٍ واحد،"], [1574.0, "متعبّدين لله عز وجل بهذه الصورة،"], [1578.0, "أو معتقدين فضيلةً لها بخصوصها،"], [1580.0, "كما يُفعل في كثيرٍ من البلاد."], [1582.0, "فتلك الصورة لا يدلّ عليها هذا اللفظ المطلق؛"], [1587.0, "لأنها صورةٌ لم يجرِ عليها عملُ السلف."], [1591.0, "وإنّ أكثر البدع إنما تُستنبط من عمومٍ لم يجرِ عليه العمل،"], [1599.0, "أو إطلاقٍ لم يجرِ عليه العمل؛"], [1601.0, "فإذا أنكرنا عليه استدلّ علينا باللفظ العامّ. اتّضحت المسألة؟"]], "tr": [[1565.0, "Seleften —Allah Teâlâ onlara rahmet etsin— tek bir mecliste toplanıp tek bir sesle, bu suretle Allah Azze ve Celle'ye ibadet ederek ya da ona özel bir fazilet inanarak okudukları bilinmemektedir;"], [1579.6, "pek çok beldede yapıldığı gibi."], [1581.3, "Bu mutlak lafız o surete delâlet etmez;"], [1584.5, "çünkü o, selefin ameli üzerinde cereyan etmediği bir surettir."], [1589.3, "Bid'atlerin çoğu, ancak üzerinde amel cereyan etmemiş bir umumdan ya da üzerinde amel cereyan etmemiş bir itlaktan istinbat edilir."], [1600.3, "Ona itiraz ettiğimizde bize âmm lafzı delil getirir. Mesele açıklığa kavuştu mu?"]]}, {"reader": false, "ar": [[1610.0, "ومنها: قول الله عز وجل:"], [1612.8, "<span class=\"ayah\">﴿اذْكُرُوا اللَّهَ ذِكْرًا كَثِيرًا﴾<\/span> <span class=\"ref\">[الأحزاب: ٤١]<\/span>؛"], [1615.0, "فإنّ هذا أمرٌ بالذكر،"], [1616.6, "ويدخل تحته صورٌ من الذكر كثيرة:"], [1619.0, "فنذكر الله بالقراءة، والتسبيح،"], [1622.2, "والتهليل، نذكر الله في السجود،"], [1625.0, "نذكر الله قيامًا، قعودًا،"], [1627.0, "حالَ دخول البيت، حالَ الخروج منه،"], [1630.0, "حالَ دخول المسجد، حالَ الخروج منه،"], [1633.0, "حالَ تقلّب الليالي والأيام،"], [1634.5, "حالَ الفزع، حالَ الخوف من شيءٍ معيّن؛"], [1637.0, "كلُّ هذه الصور تدخل في هذا الإطلاق."], [1641.0, "لكن احذر من أن تُدخل صورةَ الأذكار الجماعيّة فيه."], [1647.0, "لماذا؟ لأنّ تلك الصورة لم يجرِ عليها عملُ السلف."]], "tr": [[1610.0, "Bunlardan biri de Allah Azze ve Celle'nin şu sözüdür:"], [1614.4, "<span class=\"ayah\">﴿Allah'ı çokça zikredin﴾<\/span> [Ahzâb 41]."], [1616.6, "Bu, zikre dair bir emirdir;"], [1618.6, "altına zikrin pek çok sureti girer:"], [1623.0, "Allah'ı (Kur'an) okuyarak, tesbih ederek, tehlil ederek zikrederiz;"], [1627.0, "Allah'ı secdede zikrederiz; Allah'ı ayakta, otururken, eve girerken, evden çıkarken, mescide girerken, mescitten çıkarken, gecelerin ve günlerin dönüşünde, korkuya kapılma hâlinde, belirli bir şeyden korkma hâlinde zikrederiz."], [1638.7, "Bütün bu suretler bu itlaka girer."], [1642.3, "Fakat toplu zikirler suretini ona dahil etmekten sakın."], [1647.7, "Niçin? Çünkü o surette selefin ameli cereyan etmemiştir."]]}, {"reader": false, "ar": [[1653.0, "فقد كانوا أحرصَ الناس ـ ولا أقول:"], [1657.8, "من أحرص الناس، بل أقول:"], [1660.3, "كان السلف أحرصَ الناس ـ على فعل الخير،"], [1664.4, "وعلى تطبيق كلّ صور التعبّد في اللفظ العامّ،"], [1668.0, "وكلّ صور التعبّد في اللفظ المطلق."], [1671.0, "فإذا ثبت عنهم أنهم تركوا العمل بصورةٍ معيّنةٍ من عمومٍ أو إطلاق،"], [1678.0, "فنحن نعلم جزمًا بأنها ليست منه."], [1682.0, "وإنّ أوّل ما يفزع له المتعبّدون بالأذكار الجماعيّة هو الاستدلال بهذه العمومات والإطلاق."]], "tr": [[1653.0, "Onlar insanların en hırslısı idiler —\"insanların en hırslılarından\" demiyorum;"], [1658.6, "bilakis \"selef insanların en hırslısı idi\" diyorum—;"], [1663.0, "hayrı yapmaya, âmm lafızdaki bütün taabbud suretlerini ve mutlak lafızdaki bütün taabbud suretlerini uygulamaya (en hırslı onlardı)."], [1670.5, "Onlardan umum ya da itlaktan belirli bir suretle ameli terk ettikleri sabit olursa, onun ondan olmadığını kesin olarak biliriz."], [1682.0, "Toplu zikirlerle ibadet edenlerin ilk sığındığı şey, bu umumları ve itlakı delil getirmektir."]]}, {"reader": false, "ar": [[1693.0, "ومثلُها قول النبيّ صلى الله عليه وسلم:"], [1695.9, "«ما اجتمع قومٌ يذكرون الله»،"], [1698.0, "أو قال: «لا يقعد قومٌ يذكرون الله»؛"], [1702.0, "فإنها تدخل تحتها صورٌ كثيرة،"], [1705.0, "لكن احذر من أن تُدخل تحتها صورةَ الذكر الجماعيّ."], [1709.0, "لماذا؟ لأنّ تلك الصورة لم يجرِ عليها عملُ السلف،"], [1713.0, "ولأنّ تلك النصوص كان السلف يعرفون عمومها وإطلاقها ودلالاتها،"], [1721.0, "وكانوا حريصين على أن يعبدوا الله عز وجل بما يستطيعون ويطيقون؛"], [1727.0, "فلو كانت تلك الصورة ممّا يُعبد الله عز وجل به لسبقنا إليها مَن هم أحرصُ منّا على الخير والعمل."]], "tr": [[1693.0, "Nebî ﷺ'in \"Allah'ı zikreden hiçbir topluluk bir araya gelmez ki…\" ya da \"Allah'ı zikreden hiçbir topluluk oturmaz ki…\" sözü de bunun gibidir."], [1702.0, "Bunların altına pek çok suret girer;"], [1705.4, "fakat toplu zikir suretini onların altına dahil etmekten sakın."], [1709.0, "Niçin? Çünkü o surette selefin ameli cereyan etmemiştir."], [1712.1, "Ayrıca selef bu nasların umumunu, itlakını ve delâletlerini bilirdi;"], [1717.3, "güçlerinin yettiği ve takat getirdiği şeyle Allah Azze ve Celle'ye ibadet etmeye de hırslıydılar."], [1726.5, "Eğer o suret, kendisiyle Allah Azze ve Celle'ye ibadet edilen şeylerden olsaydı, hayra ve amele bizden daha hırslı olanlar onda bizi geçerdi."]]}, {"reader": false, "ar": [[1736.0, "ومنها أيضًا: لقد دلّت الأدلة الكثيرة على فضل الصدقة،"], [1744.0, "وأطلقت زمانَها ومكانها ومقدارها ونوعها،"], [1753.0, "ويدخل تحت ذلك صورٌ كثيرة."], [1758.0, "لكن احذر من أن تُدخل صورةَ الصدقة في المقبرة من جملة هذا العموم والإطلاق؛"], [1766.0, "لأنه لم يجرِ عليها عملُ السلف؛"], [1770.0, "فإنه لا يُحفظ عن السلف المحبّين للصدقة والعالمين بهذه الأدلة أنهم كانوا يتصدّقون عن موتاهم في المقابر."], [1781.0, "ولأنّ المتقرّر في القواعد أنّ الأصل فيما يُفعل في المقابر التوقيف؛"], [1787.0, "فلا يجوز لك أن تتعرّض لأيّ مقبرةٍ بشيءٍ من الأفعال التي لا دليل عليها."]], "tr": [[1736.0, "Bunlardan biri de şudur: Pek çok delil sadakanın faziletine delâlet etmiş;"], [1744.8, "zamanını, mekânını, miktarını ve türünü mutlak bırakmıştır."], [1755.4, "Bunun altına pek çok suret girer."], [1760.2, "Fakat kabristanda sadaka verme suretini bu umum ve itlakın kapsamına dahil etmekten sakın;"], [1768.0, "çünkü selefin ameli onun üzerinde cereyan etmemiştir."], [1772.8, "Sadakayı seven ve bu delilleri bilen seleften, ölüleri adına kabristanlarda sadaka verdikleri bilinmemektedir."], [1781.0, "Ayrıca kaidelerde yerleşik olan şudur:"], [1783.7, "Kabristanlarda yapılan şeylerde asıl olan tevkîftir."], [1787.0, "Bu yüzden herhangi bir kabristana, üzerine delil olmayan fiillerden bir şeyle yönelmen caiz değildir."]]}, {"reader": false, "ar": [[1796.6, "فلنا الحقُّ الكامل أن نقول:"], [1801.0, "إنّ اعتقاد فضيلة الصدقة في المقبرة من جملة البدع؛"], [1806.0, "لأنه لم يجرِ عليها عملُ السلف."], [1808.0, "ومن استدلّ بالعمومات في فضل الصدقة فنقول له:"], [1811.8, "إنّ كلّ صورةٍ لم يجرِ عليها عملُ السلف فلا يجوز إدخالها تحت اللفظ العامّ ولا تحت اللفظ المطلق."], [1818.7, "أظنّ واضح إن شاء الله."]], "tr": [[1796.6, "Kabristanda sadakanın faziletine inanmanın bid'atlerden olduğunu söylemeye tam hakkımız vardır;"], [1804.3, "çünkü selefin ameli onun üzerinde cereyan etmemiştir."], [1807.3, "Sadakanın faziletine dair umumları delil getirene deriz ki:"], [1811.4, "Selefin ameli üzerinde cereyan etmemiş her sureti âmm lafzın da mutlak lafzın da altına dahil etmek caiz değildir. Sanırım açık, inşallah."]]}, {"reader": false, "ar": [[1819.0, "ومنها أيضًا، ومنها أيضًا:"], [1825.3, "أدلّة فضل التعزية؛ فإنه لا يدخل فيها صورةُ استئجار قارئٍ للقرآن يقرؤه على المعزّين."], [1839.0, "وأدلّة جواز زيارة القبور لا يدخل فيها صورةُ شدّ الرحل لزيارة القبر،"], [1853.0, "ولا يدخل فيها ما يفعله عُبّاد القبور وكثيرٌ من الصوفيّة عند قبور من يعظّمونه:"], [1861.0, "من الطواف بها، وإلقاء عرائض الشكوى،"], [1864.9, "والسجود والركوع عندها، أو دعائها من دون الله عز وجل، أو الاستغاثة بأصحابها."]], "tr": [[1819.0, "Bunlardan biri de —bunlardan biri de— taziyenin faziletine dair delillerdir."], [1828.0, "Bunlara, taziyeye gelenlere Kur'an okusun diye ücretle bir kârî tutma sureti girmez."], [1839.0, "Kabir ziyaretinin caiz olduğuna dair delillere, kabri ziyaret için yolculuğa çıkma sureti girmez."], [1853.0, "Kabirperestlerin ve sûfîlerin birçoğunun tazim ettikleri kişilerin kabirleri yanında yaptıkları da onlara girmez:"], [1859.3, "Kabirleri tavaf etmek, şikâyet dilekçeleri bırakmak, yanlarında secde ve rükû etmek, Allah Azze ve Celle'yi bırakıp onlara dua etmek ya da sahiplerinden yardım dilemek gibi."]]}, {"reader": false, "ar": [[1875.0, "فإنك إذا أنكرتَ عليهم شيئًا من ذلك استدلّوا عليك بالأدلة المشرِّعة لزيارة الأموات؛"], [1883.0, "فتلك الصور لا تدخل تحت هذا الإطلاق ولا تحت هذا العموم؛"], [1889.7, "لأنها صورٌ لم يجرِ عليها عملُ السلف."], [1894.0, "بل لا يدخل تحتها أيضًا اعتقادُ فضيلة زيارة القبور في زمانيّةٍ معيّنة كالجمعة أو العيدين؛"], [1904.0, "لأنه لم يجرِ عملُ السلف على تخصيص الزيارة بشيءٍ من هذه الأزمنة."]], "tr": [[1875.0, "Çünkü onlara bunlardan bir şeyi inkâr ettiğinde, sana karşı ölüleri ziyareti meşru kılan delilleri delil getirirler."], [1883.0, "Bu suretler ne bu itlakın ne de bu umumun altına girer;"], [1889.1, "çünkü bunlar, selefin ameli üzerinde cereyan etmemiş suretlerdir."], [1893.4, "Hatta kabir ziyaretinin cuma ya da iki bayram gibi belirli bir zamanda faziletli olduğuna inanmak da onların altına girmez;"], [1904.0, "çünkü selefin ameli, ziyareti bu zamanlardan herhangi biriyle tahsis etmek üzerine cereyan etmemiştir."]]}, {"reader": false, "ar": [[1912.0, "وكذلك أيضًا لو استدلّ مستدلٌّ بالأدلة الدالّة على مشروعيّة السلام على من عرفتَ وعلى من لم تعرف،"], [1925.9, "و«أفشوا السلام بينكم»،"], [1927.6, "على مشروعيّة السلام بعد السلام من الصلاة دائمًا على مَن على يمينه وشماله؛"], [1934.0, "هل تلك الصورة بخصوصها تدخل في عمومات الأدلة المرغِّبة في السلام؟"], [1939.0, "الجواب: لا. لماذا لا تدخل؟"], [1942.0, "لأنه لم يجرِ عليها عملُ السلف."]], "tr": [[1912.0, "Yine aynı şekilde biri, tanıdığına ve tanımadığına selam vermenin meşruluğuna delâlet eden delilleri ve \"Aranızda selamı yayın\" (hadisini), namazdan selam verdikten sonra sağındakine ve solundakine devamlı olarak selam vermenin meşruluğuna delil getirse;"], [1933.5, "bu suret özel olarak selama teşvik eden delillerin umumuna girer mi?"], [1938.5, "Cevap: Hayır. Niçin girmez? Çünkü selefin ameli onun üzerinde cereyan etmemiştir."]]}, {"reader": false, "ar": [[1946.0, "وأنا أرى أنّ هذه الكلّيّة من الكلّيّات العظيمة التي تسدّ عنّا بابًا عظيمًا من استدلالات أهل البدع على بدعهم الجزئيّة؛"], [1957.0, "فإنّ أعظم ما يستدلّون به إنما هو عمومٌ يحمل صورةً لم يجرِ عليها عملُ السلف،"], [1966.0, "أو يستدلّون بإطلاقٍ يتضمّن صورةً لم يجرِ عليها عملُ السلف. لعلّكم <span class=\"q\">؟ 32:54<\/span> تصوّرتم هذا."]], "tr": [[1946.0, "Ben bu külliyenin, bid'at ehlinin cüz'î bid'atlerine getirdikleri delillerden büyük bir kapıyı bize kapatan büyük külliyelerden olduğu görüşündeyim."], [1954.0, "Çünkü onların delil getirdikleri şeylerin en büyüğü, selefin ameli üzerinde cereyan etmemiş bir sureti taşıyan bir umumdur;"], [1963.6, "ya da selefin ameli üzerinde cereyan etmemiş bir sureti içeren bir itlakı delil getirirler. Umarım <span class=\"q\">؟<\/span> bunu kavramışsınızdır."]]}]}, {"ts": "32:55", "title": "4. Külliye: Devamlılık olmaksızın caiz olan şey, devamlılıkla bid'at olur", "paras": [{"reader": false, "ar": [[1975.0, "ومن القواعد أيضًا: <b>كلُّ ما جاز شرعًا لا على وجه الديمومة فيكون بدعةً بها.<\/b> أُعيده مرةً ثالثة:"], [1990.0, "كلُّ ما جاز لا على وجه الديمومة فيكون بدعةً بها."]], "tr": [[1975.0, "Kaidelerden biri de şudur: 4."], [1979.8, "külliye: Şer'an devamlılık şeklinde olmaksızın caiz olan her şey, onunla (devamlılıkla) bid'at olur. Üçüncü kez tekrarlıyorum:"], [1990.5, "Devamlılık şeklinde olmaksızın caiz olan her şey, onunla bid'at olur."]]}, {"reader": false, "ar": [[1995.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرّر في القواعد أنّ السنّة فعلُ السنّة على الوجه الذي فُعلت عليه؛"], [2005.0, "فإن فُعلت على وجه كونها من السنن الرواتب إذن نفعلها راتبة،"], [2012.0, "وإن فُعلت مرةً أو مرتين لا على كونها من الرواتب،"], [2018.0, "فإنّ من البدعة أن نُخرجها من سنّةٍ غير راتبةٍ إلى سنّةٍ راتبة."], [2024.0, "ولأنّ المتقرّر في القواعد أنّ ما ليس بسنّةٍ راتبةٍ فيجوز فعله أحيانًا؛"], [2036.0, "فمتى ما حذفتَ كلمة «أحيانًا» ووضعتَ بدلها «دائمًا» فإنك تقلب الأمر من سنّةٍ إلى بدعة،"], [2045.0, "وهذا بابٌ من أبواب البدع الذي لا بدّ أن نسدّه."]], "tr": [[1995.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [2000.3, "Kaidelerde yerleşik olan şudur: Sünnet, sünneti yapıldığı şekil üzere yapmaktır."], [2004.6, "Eğer râtibe sünnetlerden olması şeklinde yapılmışsa, o hâlde onu râtibe olarak yaparız."], [2012.6, "Eğer râtibelerden olması şeklinde değil de bir ya da iki kez yapılmışsa, onu râtibe olmayan bir sünnetten râtibe bir sünnete çıkarmamız bid'attendir."], [2025.4, "Ayrıca kaidelerde yerleşik olan şudur:"], [2028.8, "Râtibe sünnet olmayan şeyi ara sıra yapmak caizdir."], [2038.0, "\"Ara sıra\" kelimesini silip yerine \"devamlı\" koyduğun zaman işi sünnetten bid'ate çevirirsin."], [2045.8, "Bu, mutlaka kapatmamız gereken bid'at kapılarından bir kapıdır."]]}, {"reader": false, "ar": [[2051.0, "وعلى ذلك فإنّ الدليل دلّ على جواز الاجتماع لصلاة الضحى،"], [2058.0, "فتُصلّى صلاةُ الضحى جماعةً أحيانًا،"], [2061.0, "كما صلّى النبيّ صلى الله عليه وسلم الضحى مع بعض الصحابة أحيانًا،"], [2067.0, "لكن لا على وجه الديمومة والاستمرار."], [2070.0, "وبناءً على ذلك فكلُّ من داوم على صلاة الضحى جماعةً فإنّ مداومته تُخرج فعلَه من جوازها الشرعيّ إلى كونها بدعةً باعتبار الوصف. فهمتم هذا؟"]], "tr": [[2051.0, "Buna göre delil, kuşluk namazı için toplanmanın caiz olduğuna delâlet etmiştir."], [2058.0, "Kuşluk namazı ara sıra cemaatle kılınır;"], [2061.5, "nitekim Nebî ﷺ de kuşluk namazını ara sıra bazı sahâbîlerle birlikte kılmıştır;"], [2067.5, "fakat devamlılık ve süreklilik şeklinde değil."], [2070.7, "Buna göre kuşluk namazını cemaatle kılmaya devam eden herkesin bu devamlılığı, fiilini şer'î cevazından çıkarıp vasıf itibarıyla bid'at olmaya götürür. Bunu anladınız mı?"]]}, {"reader": false, "ar": [[2090.0, "ومنها: جواز الاجتماع على صلاة الليل أحيانًا؛"], [2096.0, "فقد ثبت عن النبيّ صلى الله عليه وسلم أنه أحيانًا صلّى الليل جماعةً؛"], [2101.1, "فصلّاها مع ابن عبّاس تارةً،"], [2104.0, "ومع ابن مسعود تارةً،"], [2106.0, "ومع حذيفة تارةً، ومع جابرٍ وجبّارٍ تارةً،"], [2110.0, "لكنّ الهدي الراتب الغالب أنه يصلّيها فُرادى."], [2116.0, "وبناءً على ذلك فإذا اجتمعنا يومًا من الأيام على الصلاة والوتر جماعةً في بعض الليالي فهذا جائز،"], [2123.0, "لكن إن اتّخذناها على وجه الديمومة والاستمرار فإنّ ديمومتها يُخرجها عن كونها سنّةً إلى بدعة."], [2133.1, "فإذن ما جاز شرعًا لا على وجه الديمومة فيكون بدعةً بها."]], "tr": [[2090.0, "Bunlardan biri de gece namazında ara sıra toplanmanın caiz olmasıdır."], [2096.4, "Nebî ﷺ'den gece namazını ara sıra cemaatle kıldığı sabit olmuştur:"], [2099.8, "Onu bir keresinde İbn Abbâs ile, bir keresinde İbn Mes'ûd ile, bir keresinde Huzeyfe ile, bir keresinde de Câbir ve Cebbâr ile kılmıştır."], [2111.5, "Fakat onun râtib (düzenli) ve galip yolu, onu tek başına kılmasıdır."], [2117.8, "Buna göre günlerden bir gün bazı gecelerde namaz ve vitir için cemaatle toplanırsak bu caizdir."], [2123.7, "Fakat onu devamlılık ve süreklilik şeklinde edinirsek, bu devamlılık onu sünnet olmaktan çıkarıp bid'ate götürür."], [2133.1, "Demek ki şer'an devamlılık şeklinde olmaksızın caiz olan şey, onunla bid'at olur."]]}, {"reader": false, "ar": [[2139.0, "ومنها أيضًا: تسمية العشاء بالعَتَمة؛"], [2145.0, "فإنه قد ثبت عن النبيّ صلى الله عليه وسلم في بعض الأحاديث الصحيحة أنه سمّاها العتمة،"], [2154.0, "لكنه في نفس الأمر نهانا عن تسميتها بالعتمة،"], [2160.0, "كما في الصحيح ـ أي:"], [2162.7, "صحيح مسلم ـ من حديث ابن عمر رضي الله عنهما قال:"], [2169.5, "قال النبيّ صلى الله عليه وسلم:"], [2172.5, "«لا تغلبنّكم الأعرابُ على اسم صلاتكم العشاء؛ فإنها في كتاب الله العشاء، وإنها» ـ أي:"], [2179.8, "الأعراب ـ «تُعتِم بحِلاب الإبل»."], [2182.0, "فهذا دليلٌ يدلّ على النهي عن تسمية العشاء بالعتمة."]], "tr": [[2139.0, "Bunlardan biri de yatsı namazını \"atame\" diye isimlendirmektir."], [2146.1, "Nebî ﷺ'den bazı sahih hadislerde onu \"atame\" diye isimlendirdiği sabit olmuştur."], [2151.0, "Fakat aynı zamanda onu \"atame\" diye isimlendirmemizi de yasaklamıştır."], [2156.8, "Nitekim Sahîh'te —yani Sahîh-i Müslim'de— İbn Ömer'in —Allah ikisinden de razı olsun— hadisinde şöyle der:"], [2167.4, "Nebî ﷺ buyurdu: \"Bedeviler yatsı namazınızın ismi konusunda size galip gelmesin."], [2173.5, "O, Allah'ın Kitabı'nda 'işâ'dır. Onlar\" —yani bedeviler— \"develerin sütünü sağmak için geceyi geciktirirler (atame yaparlar).\" Bu, yatsıyı \"atame\" diye isimlendirmenin yasak olduğuna delâlet eden bir delildir."]]}, {"reader": false, "ar": [[2188.0, "وبناءً على ذلك فكلُّ من اعتاد لسانُه ـ على وجه الديمومة ـ أن يسمّي العشاء بالعتمة فهو من أهل البدع في هذه الجزئيّة،"], [2201.3, "خالف السنّة في هذه الجزئيّة."], [2203.0, "لكن من سمّاها بالعتمة أحيانًا لا على وجه الديمومة فإنّ ذلك جائزٌ سائغ،"], [2209.0, "ويدلّ عليه ـ من باب دلالة الإشارة الأصوليّة ـ قولُه صلى الله عليه وسلم:"], [2215.0, "«لا تغلبنّكم الأعراب»، ولا تحصل هذه الغلبة إلا إذا كان الانتقال من تسميتها بالعشاء إلى العتمة هو الانتقالَ المطلق الدائم،"], [2229.0, "وأمّا مطلقُ الانتقال فإنه جائزٌ لا بأس به، ولا يوجب غلبة."]], "tr": [[2188.0, "Buna göre dili devamlılık şeklinde yatsıyı \"atame\" diye isimlendirmeye alışan herkes, bu cüz'î meselede bid'at ehlindendir;"], [2199.3, "bu cüz'î meselede sünnete muhalefet etmiştir."], [2201.3, "Fakat onu devamlılık şeklinde olmaksızın ara sıra \"atame\" diye isimlendiren kimse için bu caiz ve kabul edilebilir bir şeydir."], [2209.0, "Usûldeki işâretü'n-nass delâleti kabîlinden buna Nebî ﷺ'in \"Bedeviler size galip gelmesin\" sözü delâlet eder."], [2216.9, "Bu galebe ancak onu \"işâ\" diye isimlendirmekten \"atame\"ye geçiş, mutlak ve devamlı bir geçiş olduğunda gerçekleşir."], [2226.8, "Mutlak (herhangi bir) geçişe gelince, bu caizdir, bunda bir sakınca yoktur ve galebeyi gerektirmez."]]}, {"reader": false, "ar": [[2235.0, "ومنها أيضًا المداومة ـ هذا ودّي،"], [2237.8, "بس عاد مو بحصّل <span class=\"q\">؟ 37:17<\/span> ـ المداومة على قراءة قصار السور في صلاة الفجر؛"], [2249.0, "فإنه قد ثبت عن النبيّ صلى الله عليه وسلم مرةً أو مرتين أنه قرأ بقصار المفصّل في صلاة الفجر،"], [2257.0, "كما في حديث معاذ الجهنيّ أنه قرأ <span class=\"ayah\">﴿إِذَا زُلْزِلَتِ الْأَرْضُ زِلْزَالَهَا﴾<\/span> <span class=\"ref\">[الزلزلة: ١]<\/span> في الركعتين،"], [2264.0, "وكما في سنن أبي داود من حديث عقبة بن عامر أنه صلّى مع النبيّ صلى الله عليه وسلم صلاة الصبح فقرأ فيها بالمعوّذتين."], [2274.0, "لكنّ الهدي الدائم هو إيش؟"], [2276.4, "أنه كان يقرأ فيها بطوال المفصّل."], [2280.0, "فإذا داوم الإنسان على القراءة في صلاة الفجر بقصار المفصّل فيكون قد خرج بهذه المداومة إلى حدّ الإحداث والبدعة."]], "tr": [[2235.0, "Bunlardan biri de devamlılıktır —bunu isterdim ama artık (vakit) yetmeyecek <span class=\"q\">؟<\/span>—:"], [2240.4, "Sabah namazında kısa sûreleri okumaya devam etmek."], [2249.8, "Nebî ﷺ'den bir ya da iki kez sabah namazında kısa mufassal sûreleri okuduğu sabit olmuştur."], [2256.6, "Nitekim Muâz el-Cühenî'nin hadisinde, iki rekâtta <span class=\"ayah\">﴿Yer o şiddetli sarsıntısıyla sarsıldığı zaman﴾<\/span> [Zilzâl 1] (sûresini) okuduğu vardır."], [2265.6, "Yine Sünen-i Ebî Dâvûd'da Ukbe b."], [2268.0, "Âmir'in hadisinde, onun Nebî ﷺ ile sabah namazını kıldığı, (Nebî'nin) onda Muavvizeteyn'i okuduğu vardır."], [2275.2, "Fakat devamlı yolu neydi? Onda uzun mufassal sûreleri okumasıydı."], [2280.0, "İnsan sabah namazında kısa mufassal sûreleri okumaya devam ederse, bu devamlılıkla bid'at ve ihdas sınırına çıkmış olur."]]}, {"reader": false, "ar": [[2294.0, "وعكسُه يقال في المغرب؛"], [2297.0, "فإنّ الهدي الغالب هو أنه كان يقرأ فيها بقصار المفصّل،"], [2304.0, "لكنه ثبت عنه أحيانًا أنه قرأ فيها بالمرسلات،"], [2308.2, "وبالطور، وبطُولى الطُّولَيين: سورة الأعراف،"], [2312.0, "لكن لا على وجه الديمومة والاستمرار."], [2315.0, "فإذا داوم الإنسان على قراءة طوال السور في صلاة المغرب فيكون مبتدعًا محدِثًا في دين الله بهذه المداومة."], [2324.0, "فما جاز شرعًا لا على وجه الديمومة فيكون بدعةً بها، أي: بهذه الديمومة."]], "tr": [[2294.0, "Akşam namazında bunun tersi söylenir."], [2297.0, "Galip yolu, onda kısa mufassal sûreleri okumasıydı."], [2301.9, "Fakat ondan ara sıra akşam namazında Mürselât'ı, Tûr'u ve iki uzunun daha uzununu —A'râf sûresini— okuduğu sabit olmuştur;"], [2312.5, "ama devamlılık ve süreklilik şeklinde değil."], [2315.5, "İnsan akşam namazında uzun sûreleri okumaya devam ederse, bu devamlılıkla Allah'ın dininde bid'atçi ve yenilik çıkaran biri olur."], [2324.0, "Şer'an devamlılık şeklinde olmaksızın caiz olan şey, onunla —yani bu devamlılıkla— bid'at olur."]]}, {"reader": false, "ar": [[2333.0, "ومنها أيضًا: المداومة على ختم القراءة في الصلاة بـ<span class=\"ayah\">﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ١]<\/span>؛"], [2343.0, "فإنه وإن أقرّه النبيّ صلى الله عليه وسلم وأجازه لذلك الرجل الذي بعثه أميرًا على سريّة،"], [2357.0, "فكان يصلّي بأصحابه فيقرأ بهم فيختم بـ<span class=\"ayah\">﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾<\/span>،"], [2363.0, "ولمّا عُرضت تلك الصفة على النبيّ صلى الله عليه وسلم قال:"], [2368.3, "«سلوه لأيّ شيءٍ يصنع ذلك؟» قال:"], [2370.4, "«لأنها صفةُ الرحمن، فأنا أحبّ أن أقرأ بها»؛"], [2374.0, "ولكنّ الهدي الدائم منه ومن أصحابه أنهم لم يكونوا يصلّون الصلاة على هذه الصفة."], [2382.0, "فلو فعلها الإنسان أحيانًا لا على وجه الديمومة والاستمرار فيكون فعلُه بذلك جائزًا،"], [2390.0, "لكن إن اتّخذها صفةً دائمةً في كلّ صلاة فإننا نقول:"], [2396.0, "قد أحدثتَ في دين الله ما ليس منه،"], [2400.8, "لا باعتبار الأصل، وإنما باعتبار الوصف الذي دخل عليها، وهو الديمومة والاستمرار."]], "tr": [[2333.0, "Bunlardan biri de namazda kıraati <span class=\"ayah\">﴿De ki: O Allah birdir﴾<\/span> [İhlâs 1] ile bitirmeye devam etmektir."], [2344.4, "Nebî ﷺ bunu, bir seriyyeye emir olarak gönderdiği o adam için onaylamış ve caiz görmüştür:"], [2357.6, "(O adam) arkadaşlarına namaz kıldırır, onlara (kıraat) okur ve <span class=\"ayah\">﴿De ki: O Allah birdir﴾<\/span> ile bitirirdi."], [2366.0, "Bu şekil Nebî ﷺ'e arz edildiğinde:"], [2368.7, "\"Ona sorun, bunu niçin yapıyor?\" buyurdu."], [2370.9, "(Adam) dedi ki: \"Çünkü o, Rahmân'ın sıfatıdır;"], [2373.6, "ben de onu okumayı seviyorum.\" Fakat onun ve ashâbının devamlı yolu, namazı bu şekilde kılmamalarıdır."], [2382.0, "İnsan bunu devamlılık ve süreklilik şeklinde olmaksızın ara sıra yaparsa, bu fiili caiz olur."], [2390.6, "Fakat onu her namazda devamlı bir şekil edinirse, deriz ki:"], [2396.6, "Allah'ın dininde ondan olmayan bir şey ihdas ettin;"], [2401.4, "asıl itibarıyla değil, ona giren vasıf —yani devamlılık ve süreklilik— itibarıyla."]]}, {"reader": false, "ar": [[2408.0, "ومنها أيضًا: جعلُ الصلاة والسلام على غير الأنبياء شعارًا،"], [2417.0, "كأبي بكرٍ «عليه السلام» ويتّخذها شعارًا عليه،"], [2425.0, "أو عمر «عليه السلام» ويتّخذها شعارًا عليه؛"], [2431.0, "فاتّخاذ الصلاة والسلام شعارًا على غير الأنبياء هذا من البدع والمحدثات."], [2440.0, "فإن قلت: أوَلم يثبت عن النبيّ صلى الله عليه وسلم أنه كان يصلّي على من يأتي بالصدقة؟"], [2449.0, "كما في الصحيحين من حديث أبي ـ عبد الله بن أبي أوفى:"], [2453.0, "«كان النبيّ صلى الله عليه وسلم إذا أتاه الناسُ بصدقاتهم صلّى عليهم، فأتاه أبي بصدقته فقال: اللهمّ صلِّ على آل أبي أوفى»."]], "tr": [[2408.0, "Bunlardan biri de salât ve selamı peygamberler dışındakiler için bir şiar edinmektir:"], [2417.7, "Ebû Bekir için \"aleyhisselâm\" (deyip) bunu onun için bir şiar edinmek ya da Ömer için \"aleyhisselâm\" (deyip) bunu onun için bir şiar edinmek gibi."], [2437.7, "Salât ve selamı peygamberler dışındakiler için şiar edinmek, bid'atlerden ve sonradan çıkarılmış şeylerdendir."], [2445.3, "Şayet \"Nebî ﷺ'in sadaka getirene salât ettiği (dua ettiği) sabit olmamış mıdır?\" dersen —nitekim Sahîhayn'da Abdullah b."], [2451.9, "Ebî Evfâ'nın hadisinde şöyle geçer:"], [2454.2, "\"Nebî ﷺ'e insanlar sadakalarını getirdiklerinde onlara salât ederdi."], [2458.2, "Babam da ona sadakasını getirdi;"], [2460.4, "bunun üzerine: Allah'ım! Ebû Evfâ ailesine salât et, dedi.\"—"]]}, {"reader": false, "ar": [[2464.0, "نقول: نعم، ولكن ليس على وجه الديمومة والاستمرار،"], [2467.0, "وإنما كانت في مناسبةٍ:"], [2469.3, "أخذ صلاته ومشى. فإذا اتّخذناها شعارًا نكون بذلك قد خرجنا عن إطار الشيء الجائز ـ أو الأمر الجائز."], [2479.0, "وبناءً على ذلك فيجوز الصلاة والسلام على غير الأنبياء ما لم تُتّخذ شعارًا عليه،"], [2490.0, "تكون مقرونةً باسمه، كلّما ذُكر صُلّي وسُلّم عليه؛"], [2496.0, "فإنّ هذا من خصائص الأنبياء."], [2500.0, "واختاره أبو العبّاس ابن تيمية رحمه الله تعالى. والله أعلم."]], "tr": [[2464.0, "deriz ki: Evet; fakat devamlılık ve süreklilik şeklinde değil."], [2466.6, "Bu, (sadaka getirme) münasebetiyle olmuştu:"], [2468.7, "(Adam) onun duasını aldı ve gitti."], [2471.6, "Onu şiar edinirsek, bununla caiz olan şeyin —ya da caiz olan işin— çerçevesinden çıkmış oluruz."], [2478.4, "Buna göre peygamberler dışındakilere salât ve selam, onun için bir şiar edinilmediği sürece caizdir;"], [2485.7, "(şiar edinmek ise) onun ismiyle birlikte anılması, her zikredildiğinde ona salât ve selam edilmesidir;"], [2495.1, "çünkü bu, peygamberlerin hususiyetlerindendir. Ebu'l-Abbâs İbn Teymiyye —Allah Teâlâ ona rahmet etsin— bunu tercih etmiştir. Allah en iyisini bilir."]]}]}, {"ts": "41:48", "title": "5. Külliye: Delil ya da selefin ameli olmaksızın kendisiyle ibadet etmek yaygınlaşan her şey bid'attir", "paras": [{"reader": false, "ar": [[2508.0, "ومن الكلّيّات أيضًا، ومن الكلّيّات أيضًا:"], [2516.0, "<b>كلُّ ما شاع التعبّدُ به بلا دليلٍ عليه أو عملِ السلف فبدعة.<\/b> بلا دليلٍ أو عمل."], [2534.9, "<span class=\"note\">(يكررها)<\/span> كلُّ ما شاع التعبّدُ به بلا دليلٍ أو عمل ـ أقصد:"], [2544.2, "عملَ السلف ـ فهو بدعة."]], "tr": [[2508.0, "Külliyelerden biri de —külliyelerden biri de— şudur:"], [2513.9, "<b>5. külliye: Üzerine bir delil ya da selefin ameli olmaksızın kendisiyle ibadet etmek yaygınlaşan her şey bid'attir.<\/b> Delil ya da amel olmaksızın."], [2536.8, "Delil ya da amel —selefin amelini kastediyorum— olmaksızın kendisiyle ibadet etmek yaygınlaşan her şey bid'attir."]]}, {"reader": false, "ar": [[2554.0, "كالأذكار الجماعيّة التي أطبقت كثيرٌ من الدول الإسلاميّة على العمل بها؛"], [2561.0, "فمجرّد شيوع الشيء لا يدلّ على مشروعيّته ما لم يكن جرى عليه عملُ السلف."], [2569.0, "وكاعتياد قراءة القرآن في العزاء،"], [2572.3, "الذي لا يُعرف عزاءٌ في كثيرٍ من البلاد الإسلاميّة إلا وتجده فيه؛"], [2582.0, "فإنّ شيوعه وكثرة وقوعه لا تدلّ على أنه مشروع."], [2588.0, "وكالاحتفال بالمولد النبويّ الذي تكاد الدول الإسلاميّة تُطبق عليه؛"], [2596.0, "فإنّ كثرة وقوعه لا يدلّ على مشروعيّته بخصوصه."]], "tr": [[2554.0, "Pek çok İslam ülkesinin üzerinde amel etmekte birleştiği toplu zikirler gibi."], [2560.4, "Bir şeyin sırf yaygınlaşması, selefin ameli onun üzerinde cereyan etmedikçe onun meşruluğuna delâlet etmez."], [2568.4, "Taziyede Kur'an okumayı âdet edinmek de böyledir;"], [2573.0, "pek çok İslam beldesinde, içinde bunu bulmadığın bir taziye bilinmez."], [2578.9, "Onun yaygınlığı ve çokça vuku bulması meşru olduğuna delâlet etmez."], [2587.3, "İslam ülkelerinin neredeyse üzerinde birleştiği Mevlid-i Nebevî kutlaması da böyledir;"], [2596.0, "çokça vuku bulması, özel olarak meşruluğuna delâlet etmez."]]}, {"reader": false, "ar": [[2601.0, "وكالعمرة الرجبيّة، التي لا تكاد تخالفني في اشتهارها بين كثيرٍ من المسلمين،"], [2608.9, "وأنّ لها فضلًا خاصًّا،"], [2612.0, "مع أنه لا يدلّ عليها شيءٌ من الأدلة الصحيحة الصريحة،"], [2618.7, "ولا يؤيّدها عملُ السلف."], [2622.0, "وكقراءة الفاتحة قبل الخطوبة؛"], [2624.7, "فإنه مع شيوعه بين المسلمين إلا أنّ شيوعه لا يدلّ على مشروعيّته."], [2635.0, "وكقراءتها أيضًا عند سماع اسم الأموات أو أسماء الأموات؛"], [2641.0, "فإنه مع كثرته لا يدلّ على مشروعيّته."]], "tr": [[2601.0, "Recep umresi de böyledir; bunun pek çok Müslüman arasında meşhur olduğu ve onun özel bir fazileti bulunduğu (inancı) konusunda bana neredeyse muhalefet etmezsin."], [2614.7, "Bununla birlikte sahih ve sarih delillerden hiçbiri ona delâlet etmez, selefin ameli de onu desteklemez."], [2624.7, "Nişandan önce Fâtiha okumak da böyledir;"], [2628.0, "Müslümanlar arasında yaygın olmasına rağmen yaygınlığı meşruluğuna delâlet etmez."], [2635.7, "Ölünün adını ya da ölülerin adlarını duyunca onu okumak da böyledir;"], [2642.5, "çokluğuna rağmen meşruluğuna delâlet etmez."]]}, {"reader": false, "ar": [[2649.0, "وهذا بابٌ من أبواب انتشار البدع،"], [2652.3, "وهو كثرةُ مزاولة المسلمين لها؛"], [2655.0, "فإنك إذا أنكرتَ عليهم هذه البدعة قالوا:"], [2659.7, "وهل أنت تتّهم هؤلاء المسلمين بأنهم على الضلال،"], [2665.0, "وأنت وطائفتك ـ أو أهلُ بلدك ـ على الحقّ؟"], [2672.0, "فيجعلون الحقَّ مقرونًا بالكثرة،"], [2677.0, "مع أننا نجد أنّ الكثرة ـ في الأعمّ الأغلب ـ في سياق الدليل مذمومةٌ لا ممدوحة،"], [2685.0, "كما قال الله عز وجل:"], [2687.0, "<span class=\"ayah\">﴿وَإِن تُطِعْ أَكْثَرَ مَن فِي الْأَرْضِ يُضِلُّوكَ عَن سَبِيلِ اللَّهِ﴾<\/span> <span class=\"ref\">[الأنعام: ١١٦]<\/span>،"], [2691.0, "وقال الله عز وجل:"], [2693.0, "<span class=\"ayah\">﴿وَلَا تَجِدُ أَكْثَرَهُمْ شَاكِرِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٧]<\/span>، والقلّةُ ممدوحة."]], "tr": [[2649.0, "Bu, bid'atlerin yayılma kapılarından bir kapıdır:"], [2651.7, "Müslümanların onu çokça yapması. Onlara bu bid'ati inkâr ettiğinde derler ki:"], [2657.3, "\"Sen bu Müslümanları sapıklık üzere olmakla, kendini ve taifeni —ya da belde halkını— hak üzere olmakla mı itham ediyorsun?\" Böylece hakkı çoklukla bağlantılı kılarlar."], [2677.0, "Oysa biz, delilin siyakında çokluğun —çoğunlukla— övülmüş değil yerilmiş olduğunu görürüz."], [2682.7, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2685.8, "<span class=\"ayah\">﴿Yeryüzündekilerin çoğuna uyarsan seni Allah'ın yolundan saptırırlar﴾<\/span> [En'âm 116]."], [2689.0, "Allah Azze ve Celle şöyle buyurur:"], [2691.0, "<span class=\"ayah\">﴿Onların çoğunu şükredenler olarak bulamayacaksın﴾<\/span> [A'râf 17]. Azlık ise övülmüştür."]]}, {"reader": false, "ar": [[2698.0, "فلا الكثرةُ تدلّ على الصحّة،"], [2701.0, "ولا القلّةُ تدلّ على الصحّة،"], [2704.0, "وإنما العبرة في ذلك ألّا نتعبّد لله عز وجل إلا بما دلّت عليه الأدلة،"], [2710.0, "أو جرى عليه عملُ السلف الصالح."], [2712.0, "وأهلُ الحقّ دائمًا في كلّ زمانٍ ومكانٍ هم الأقلّ،"], [2720.0, "كما قال النبيّ صلى الله عليه وسلم:"], [2723.0, "«وما أنتم في أهل الشرك إلا كالشعرة البيضاء في جلد الثور الأسود»،"], [2730.0, "أو قال: «كالشعرة الحمراء في جلد الثور الأسود»،"], [2733.0, "أو كما قال صلى الله عليه وسلم."]], "tr": [[2698.0, "Ne çokluk doğruluğa delâlet eder ne de azlık doğruluğa delâlet eder."], [2704.2, "Bu hususta itibar edilecek olan, Allah Azze ve Celle'ye ancak delillerin delâlet ettiği ya da selef-i sâlihînin amelinin cereyan ettiği şeyle ibadet etmemizdir."], [2714.8, "Hak ehli her zaman ve mekânda daima az olandır."], [2721.7, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [2724.2, "\"Şirk ehli arasında siz ancak siyah öküzün derisindeki beyaz kıl gibisiniz\" ya da \"siyah öküzün derisindeki kırmızı kıl gibisiniz\" buyurdu;"], [2733.6, "ya da ﷺ nasıl buyurduysa."]]}]}, {"ts": "45:35", "title": "6. Külliye: Bir taabbuddan bir şey eksilten bid'atçidir", "paras": [{"reader": false, "ar": [[2735.0, "طيّب، ومن الكلّيّات أيضًا:"], [2742.0, "<b>كلُّ من أنقص من تعبّدٍ شيئًا منه فمبتدع.<\/b> أقول وبالله التوفيق:"], [2750.0, "كما أنّ البدعة على العبادة قد تكون بالزيادة فيها،"], [2754.0, "فكذلك أيضًا تكون البدعة بالإنقاص منها؛"], [2760.0, "فلا يجوز في أمر التعبّد أن تزيد ولا أن تنقص؛"], [2764.0, "فإن زدتَ تعبّدًا فأنت مبتدعٌ بزيادتك،"], [2769.0, "وإن أنقصتَ تعبّدًا فأنت مبتدعٌ بإنقاصك."], [2774.0, "فالعبادة تبقى على صورتها بلا زيادةٍ ولا نقصان."]], "tr": [[2735.0, "Peki. Külliyelerden biri de şudur:"], [2742.0, "<b>6. külliye: Bir taabbuddan bir şey eksilten herkes bid'atçidir.<\/b> Tevfik Allah'tandır, derim ki:"], [2750.9, "İbadete (giren) bid'at, bazen ona ilave yapmakla olduğu gibi, bid'at ondan eksiltmekle de olur."], [2760.0, "Taabbud işinde ne ilave etmek ne de eksiltmek caizdir."], [2763.6, "Bir taabbudu artırırsan, artırmanla bid'atçi olursun;"], [2767.8, "bir taabbudu eksiltirsen, eksiltmenle bid'atçi olursun."], [2772.8, "İbadet, ilave ve eksiltme olmaksızın kendi sureti üzere kalır."]]}, {"reader": false, "ar": [[2781.0, "وعلى ذلك فمن آمن بأسماء الله وأنكر ما تضمّنته من الصفات فهو مبتدعٌ بهذا الإنقاص؛"], [2790.0, "فإنّ الواجب في أسماء الله عز وجل أن نؤمن بها اسمًا،"], [2796.0, "وأن نؤمن بالصفة التي تضمّنها الاسم؛"], [2801.0, "فالعليم اسمه، والعلم صفته،"], [2803.7, "فلا بدّ من الإيمان بالأمرين،"], [2807.0, "والحكيم اسمه، والحكمة صفته،"], [2809.7, "فلا بدّ من الإيمان بالأمرين."], [2813.0, "أمّا أن تؤمن بالاسم وتنكر الصفة التي تضمّنها ذلك الاسم،"], [2818.0, "فهذا الإنكار من البدع،"], [2819.8, "لكنه ليس من بدع الزيادات،"], [2822.0, "وإنما من بدع الإنقاص."]], "tr": [[2781.0, "Buna göre Allah'ın isimlerine iman edip onların içerdiği sıfatları inkâr eden, bu eksiltmeyle bid'atçidir."], [2789.0, "Allah Azze ve Celle'nin isimlerinde vacip olan, onlara isim olarak iman etmemiz ve ismin içerdiği sıfata da iman etmemizdir."], [2801.0, "el-Alîm onun ismidir, ilim onun sıfatıdır;"], [2804.6, "ikisine de iman etmek gerekir."], [2808.4, "el-Hakîm onun ismidir, hikmet onun sıfatıdır;"], [2812.1, "ikisine de iman etmek gerekir."], [2815.0, "İsme iman edip o ismin içerdiği sıfatı inkâr etmene gelince, bu inkâr bid'atlerdendir;"], [2821.1, "fakat ilave bid'atlerinden değil, eksiltme bid'atlerindendir."]]}, {"reader": false, "ar": [[2824.0, "وكالاقتصار على أقلّ من سبع حصياتٍ في رمي الجمرات؛"], [2832.0, "فإنّ ذلك من البدع التي ما أنزل الله بها من سلطان،"], [2838.0, "إلا أنها بدعةٌ بالإنقاص وليست بالزيادة."], [2846.0, "وكالاقتصار على بعض الشوط في الطواف؛"], [2850.0, "فإنك ترى أنّ من الناس من لا يبلغ الحجر ابتداءً أو انتهاءً،"], [2859.0, "فيُنقص من الطواف في ابتداء طوافه،"], [2862.3, "أو يُنقص منه في نهايته؛"], [2865.0, "فهذا من البدع المحدثة التي يجب الحذر منها."], [2869.0, "وكإنقاص الواجب في السعي؛"], [2872.0, "فتراه يرجع ناكصًا في السعية الثانية قبل أن يصل إلى ما يجب الوصول إليه من الصفا أو المروة."], [2882.0, "وكلُّ هذا من البدع،"], [2884.5, "لكنها من بدع الإنقاص."]], "tr": [[2824.0, "Cemreleri taşlamada yedi taştan azıyla yetinmek de böyledir."], [2832.0, "Bu, Allah'ın hakkında hiçbir delil indirmediği bid'atlerdendir;"], [2836.4, "ancak o, ilaveyle değil eksiltmeyle olan bir bid'attir."], [2846.0, "Tavafta şavtın bir kısmıyla yetinmek de böyledir."], [2851.4, "İnsanlardan bazılarının başlangıçta ya da bitişte Hacer'e ulaşmadığını görürsün;"], [2859.5, "tavafının başında tavaftan eksiltir ya da sonunda ondan eksiltir."], [2865.0, "Bu, sakınılması gereken sonradan çıkarılmış bid'atlerdendir."], [2868.5, "Sa'yde vacibi eksiltmek de böyledir:"], [2872.6, "Onun, ikinci sa'y (şavtın)da Safâ'dan ya da Merve'den ulaşılması gereken yere ulaşmadan geri döndüğünü görürsün."], [2882.6, "Bunların hepsi bid'atlerdendir; fakat eksiltme bid'atlerindendir."]]}, {"reader": false, "ar": [[2887.0, "والأمثلة على ذلك كثيرة:"], [2889.0, "وكالاقتصار في صلاة الفجر من يوم الجمعة على قراءة بعض «السجدة» و«الإنسان»؛"], [2899.0, "فإنّ هذه الصورة لا جرم أنها من البدع إن فعلها تعبّدًا؛"], [2904.0, "هو يريد أن يتعبّد لله بقراءة سورة السجدة والإنسان،"], [2908.0, "لكنه لا يكملها كما هي السنّة،"], [2910.8, "وإنما يقرأ بعضها متعبّدًا لله بهذه الصورة؛"], [2914.0, "فلا جرم أنّ هذا من البدع التي لا تجوز."], [2918.0, "وكالإنقاص من الصاع في زكاة الفطر؛"], [2923.0, "فإنه أيضًا من البدع."]], "tr": [[2887.0, "Bunun örnekleri çoktur: Cuma günü sabah namazında Secde ve İnsân (sûrelerinin) bir kısmını okumakla yetinmek de böyledir."], [2899.5, "Bu suret, eğer onu taabbud olarak yaparsa, şüphesiz bid'atlerdendir."], [2903.5, "O, Secde ve İnsân sûrelerini okuyarak Allah'a ibadet etmek istiyor;"], [2908.5, "fakat sünnette olduğu gibi onları tamamlamıyor, sadece bir kısmını bu suretle Allah'a ibadet ederek okuyor."], [2915.8, "Şüphesiz bu, caiz olmayan bid'atlerdendir."], [2918.0, "Fıtır zekâtında sâ'dan eksiltmek de böyledir; bu da bid'atlerdendir."]]}, {"reader": false, "ar": [[2926.0, "وكوصف الله بالنفي المحض المجرّد عن الإثبات؛"], [2937.0, "فإننا نعرف أنّ الواجب أن نتعبّد لله عز وجل ـ إذا نفينا عنه شيئًا ـ أن نُثبت له مكانه شيئًا؛"], [2947.0, "فننفي عنه السِّنة والنوم لكمال حياته وقيّوميّته،"], [2953.0, "وننفي عنه اللُّغوب والعجز والإعياء لكمال قوّته وقدرته،"], [2958.0, "وننفي عنه الولد والصاحبة لكمال صمديّته وغناه عن كلّ أحد."], [2964.0, "أليس كذلك؟ فالذي ينفي نفيًا محضًا غير معتقدٍ ثبوتًا،"], [2971.0, "هذا مبتدع، لكنه مبتدعٌ بإيش؟"], [2974.0, "بأنه أنقص من الواجب شيئًا،"], [2977.0, "بأنه أنقص من الواجب شيئًا. والله أعلم."]], "tr": [[2926.0, "Allah'ı isbattan soyutlanmış katıksız nefy ile nitelemek de böyledir."], [2937.0, "Biliyoruz ki vacip olan, Allah Azze ve Celle'ye ibadet ederken, O'ndan bir şeyi nefyettiğimizde onun yerine O'na bir şey isbat etmemizdir."], [2947.0, "Hayatının ve kayyûmiyetinin kemâli sebebiyle O'ndan uyuklamayı ve uykuyu nefyederiz."], [2953.8, "Kuvvetinin ve kudretinin kemâli sebebiyle O'ndan yorgunluğu, acizliği ve bitkinliği nefyederiz."], [2960.2, "Samediyetinin ve herkesten müstağni oluşunun kemâli sebebiyle O'ndan çocuğu ve eşi nefyederiz."], [2965.7, "Öyle değil mi? Bir isbata inanmaksızın katıksız nefy yapan kişi bid'atçidir;"], [2973.4, "fakat neyle bid'atçidir? Vacipten bir şey eksiltmesiyle, vacipten bir şey eksiltmesiyle. Allah en iyisini bilir."]]}]}, {"ts": "49:42", "title": "7. Külliye: İbadet mi bid'at mi olduğu şüpheli olan şeyle Allah'a ibadet etmek meşru değildir", "paras": [{"reader": false, "ar": [[2982.0, "ومن الكلّيّات أيضًا: كلُّ ما اشتبه أمرُه:"], [2995.0, "أهو عبادةٌ أو بدعة؟"], [3000.0, "فلا يُشرع التعبّدُ لله به. كلُّ ما اشتبه أمرُه ـ كم قعدنا يا … <span class=\"q\">؟ 49:47<\/span> ـ وأُعيدها مرةً ثانيةً أو ثالثة:"], [3017.0, "كلُّ ما اشتبه أمرُه:"], [3019.0, "أهو عبادةٌ أو بدعة؟"], [3021.0, "فلا يُشرع التعبّدُ لله به."]], "tr": [[2982.0, "Külliyelerden biri de şudur: 7."], [2983.0, "külliye: Durumu şüpheli olan —ibadet mi yoksa bid'at mi (olduğu belirsiz olan)— her şeyle Allah'a ibadet etmek meşru değildir. Durumu şüpheli olan her şey —ne kadar oturduk ey …?"], [3002.8, "<span class=\"q\">؟<\/span>— İkinci ya da üçüncü kez tekrarlıyorum:"], [3018.0, "Durumu şüpheli olan —ibadet mi yoksa bid'at mi— her şeyle Allah'a ibadet etmek meşru değildir."]]}, {"reader": false, "ar": [[3024.0, "أقول وبالله التوفيق: وذلك لأنّ الشيء لا يدخل في حيّز التعبّد إلا إذا كان قائمًا على برهانٍ يوجب القطع،"], [3032.0, "أو يوجب غلبة الظنّ."], [3034.0, "وأمّا إذا دار أمرُ التعبّد بين كونه عبادةً أو بدعةً من غير مرجِّح،"], [3041.0, "فحينئذٍ ينبغي أن تكفّ عن ال
