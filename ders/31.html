تعبّد لله عز وجل به؛"], [3045.0, "لأنه ليس متيقَّنًا، ولا بمغلوبٍ على الظنّ فيه."], [3053.0, "فلا ينبغي أن يُعبد الله عز وجل بالشكوك،"], [3057.0, "ولا بالأوهام، ولا بالخيالات، ولا بالأمور المتشابهة."]], "tr": [[3024.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [3026.8, "Bir şey, ancak kesinliği ya da zann-ı galibi gerektiren bir burhana dayanıyorsa taabbud alanına girer."], [3032.0, "Taabbud işi, bir tercih sebebi olmaksızın ibadet ya da bid'at olmak arasında dönüp duruyorsa, o zaman onunla Allah Azze ve Celle'ye ibadet etmekten geri durman gerekir;"], [3044.2, "çünkü o ne kesin olarak bilinmektedir ne de hakkında zann-ı galip vardır."], [3053.5, "Allah Azze ve Celle'ye şüphelerle, vehimlerle, hayallerle ve müteşâbih işlerle ibadet edilmesi uygun değildir."]]}, {"reader": false, "ar": [[3063.0, "عملًا بقول النبيّ صلى الله عليه وسلم:"], [3066.0, "«إنّ الحلال بيّن، وإنّ الحرام بيّن، وبينهما أمورٌ مشتبهات» ـ أي:"], [3073.7, "لم تتمحّض حلّيّتها من التحريم فنُحلّها،"], [3079.0, "ولم تتمحّض حرمتُها من التحليل فنحرّمها."], [3083.0, "فماذا نفعل فيها؟ ـ قال:"], [3086.3, "«لا يعلمهنّ كثيرٌ من الناس، فمن اتّقى الشبهات» ـ آه،"], [3090.6, "إذن أمرنا بترك هذا الأمر المتشابه ـ «فمن اتّقى الشبهات فقد استبرأ لدينه وعرضه»،"], [3099.0, "الحديث بتمامه. وعليه قوله صلى الله عليه وسلم:"], [3103.0, "«دع ما يريبك إلى ما لا يريبك»."]], "tr": [[3063.0, "(Bu,) Nebî ﷺ'in şu sözüyle amel etmek içindir:"], [3065.6, "\"Helal bellidir, haram bellidir; ikisinin arasında şüpheli işler vardır.\" —Yani helalliği haramlıktan arınmış olmayan ki onu helal sayalım;"], [3077.5, "haramlığı helallikten arınmış olmayan ki onu haram sayalım (işler)."], [3083.0, "Peki onlarda ne yapacağız?— Buyurdu ki:"], [3087.0, "\"Onları insanların çoğu bilmez. Kim şüphelerden sakınırsa…\" —Ah, demek ki bize bu şüpheli işi terk etmeyi emretti— \"Kim şüphelerden sakınırsa dinini ve ırzını korumuş olur.\" Hadisin tamamı."], [3100.5, "Nebî ﷺ'in \"Seni şüpheye düşüreni bırak, seni şüpheye düşürmeyene geç\" sözü de buna göredir."]]}, {"reader": false, "ar": [[3106.0, "ولأنّ المتقرّر في القواعد أنّ الشيء المشكوك فيه يُردّ إلى أصله."], [3112.0, "وهل الأصل التعبّد أو عدم التعبّد؟"], [3115.0, "عدمُ التعبّد. فمتى ما تيقّنّا تعبّدًا عملنا به،"], [3119.9, "ومتى ما غلب على ظنّنا تعبّدٌ عملنا به،"], [3124.0, "لكن متى ما وقع شكٌّ في تعبّدٍ فإننا نردّ الأمر المشكوك فيه إلى أصله،"], [3131.0, "وهو ألّا نتعبّد لله عز وجل به."]], "tr": [[3106.0, "Ayrıca kaidelerde yerleşik olan şudur:"], [3108.0, "Hakkında şüphe edilen şey aslına döndürülür."], [3111.3, "Asıl olan taabbud mudur, yoksa taabbudun olmaması mı?"], [3115.0, "Taabbudun olmamasıdır. Bir taabbudu kesin olarak bildiğimizde onunla amel ederiz;"], [3121.0, "bir taabbud hakkında zann-ı galibimiz olduğunda onunla amel ederiz."], [3125.1, "Fakat bir taabbud hakkında şüphe meydana geldiğinde, şüphe edilen işi aslına, yani onunla Allah Azze ve Celle'ye ibadet etmemeye döndürürüz."]]}, {"reader": false, "ar": [[3134.0, "كمسح الرقبة في الوضوء؛"], [3144.0, "فإنّ الأمر دائرٌ بين كونه عبادةً أو بدعة؛"], [3147.0, "فمع اشتباه الأمر لا تتعبّد لله عز وجل به،"], [3153.0, "مع أنّ الحقّ أنه من البدع."], [3156.0, "لكن إذا دار الأمر عندك من بعض الفتاوى،"], [3159.2, "أو شككتَ، فإنه لا ينبغي لك الإقدام على أن تعبد الله بمسح رقبتك في الوضوء إلا ببرهانٍ صحيحٍ صريح،"], [3169.3, "وما دام الأمر لا يزال مشكلًا مشتبهًا فاترك التعبّد لله به."]], "tr": [[3134.0, "Abdestte enseyi meshetmek gibi. Durum, onun ibadet ya da bid'at olması arasında dönmektedir."], [3146.6, "Durum şüpheli olduğu hâlde onunla Allah Azze ve Celle'ye ibadet etme;"], [3153.0, "gerçi doğru olan onun bid'atlerden olmasıdır."], [3156.0, "Fakat bazı fetvalardan dolayı durum senin nezdinde (ikisi arasında) dönüyorsa ya da şüpheye düştüysen, sahih ve sarih bir burhan olmadıkça abdestte enseni meshederek Allah'a ibadet etmeye kalkışman uygun değildir."], [3168.6, "Durum hâlâ müşkil ve şüpheli olduğu sürece onunla Allah'a ibadet etmeyi terk et."]]}, {"reader": false, "ar": [[3177.0, "وكغسل المآقي وداخل العينين في الوضوء؛"], [3184.4, "فإنّ الأمر دائرٌ بين كونه ـ فإنّ الأمر مشتبهٌ بين كونه عبادةً وبين كونه بدعة،"], [3192.0, "وقد حكم على بدعيّته كثيرٌ من أهل العلم،"], [3198.0, "وقال بجوازه طائفةٌ من أهل العلم."], [3201.0, "فلا يزال الأمر مشتبهًا عليك،"], [3204.1, "لم تحرّر المسألة، فإيّاك أن تعبد الله بذلك،"], [3208.0, "مع أنّ الحقّ أنه ليس من السنّة."]], "tr": [[3177.0, "Abdestte göz pınarlarını ve gözlerin içini yıkamak da böyledir."], [3185.9, "Durum, onun —durum, onun ibadet olması ile bid'at olması arasında şüphelidir."], [3191.6, "İlim ehlinin birçoğu onun bid'at olduğuna hükmetmiş, ilim ehlinden bir grup da caiz olduğunu söylemiştir."], [3200.5, "Durum hâlâ sana şüpheli geliyorsa ve meseleyi tahrir etmediysen (netleştirmediysen), bununla Allah'a ibadet etmekten sakın;"], [3208.6, "gerçi doğru olan onun sünnetten olmamasıdır."]]}, {"reader": false, "ar": [[3212.0, "وكمسح الوجه باليدين بعد كلّ دعاءٍ على وجه الديمومة والاستمرار؛"], [3224.0, "فإنّ العلماء لا يزالون يختلفون في هذه الجزئيّة اختلافًا كثيرًا،"], [3230.0, "حتى صار الإنسان في شكٍّ:"], [3232.7, "أهو من السنّة فأفعله،"], [3234.8, "أو من البدعة فأتركه؟"], [3237.0, "فإذا كنتَ لم تحرّر الأمر إلى الآن فإيّاك أن تعبد الله بأمرٍ مشكوكٍ فيه؛"], [3244.0, "فلا يُعبد الله بالشكوك،"], [3246.8, "ولا بالاحتمالات، ولا بالخيالات،"], [3249.6, "ولا بالأوهام، وإنما يُعبد الله بما ثبت يقينًا،"], [3254.0, "أو عن غلبة ظنّ."]], "tr": [[3212.0, "Devamlılık ve süreklilik şeklinde her duadan sonra elleriyle yüzü meshetmek de böyledir."], [3224.0, "Âlimler bu cüz'î meselede hâlâ çokça ihtilaf ediyorlar;"], [3228.8, "öyle ki insan \"Bu sünnetten midir ki onu yapayım, yoksa bid'atten midir ki onu terk edeyim?\" diye şüpheye düşmüştür."], [3238.0, "Eğer şu ana kadar meseleyi tahrir etmediysen, şüphe edilen bir işle Allah'a ibadet etmekten sakın."], [3244.7, "Allah'a şüphelerle, ihtimallerle, hayallerle ve vehimlerle ibadet edilmez;"], [3250.3, "Allah'a ancak kesin olarak ya da zann-ı galiple sabit olanla ibadet edilir."]]}, {"reader": false, "ar": [[3256.0, "مع أنّ القول الصحيح أنه ليس من السنّة،"], [3261.0, "وأنّ كلّ حديثٍ مرفوعٍ فيه فإنه لا يصحّ،"], [3264.0, "لكنّ وروده عن بعض السلف ـ كالصحابة ومن بعدهم ـ ورودُه عن بعض السلف يدلّ على أنه إن فُعل أحيانًا لا على وجه الديمومة فإنه جائزٌ لا بأس به."]], "tr": [[3256.0, "Bununla birlikte doğru görüş, onun sünnetten olmadığı ve bu konudaki her merfû hadisin sahih olmadığıdır."], [3263.6, "Fakat onun bazı seleften —sahâbe ve onlardan sonrakiler gibi— gelmesi, bazı seleften gelmesi, devamlılık şeklinde olmaksızın ara sıra yapılırsa caiz olduğuna ve bunda bir sakınca bulunmadığına delâlet eder."]]}, {"reader": false, "ar": [[3276.0, "وكإحياء ليلة النصف من شعبان؛"], [3282.0, "فإنّ السلف لا يزالون يختلفون فيها بين مبدِّعٍ ومجيز."], [3290.0, "فإذا كنتَ لم تحرّر الأمر،"], [3291.7, "ولم تعرف وجه الحقّ فيه إلى الآن،"], [3294.0, "ولا تزال في ريبٍ واشتباه،"], [3297.0, "فإيّاك أن تعبد الله به حتى يتحرّر لك الأمر:"], [3301.0, "بين كونه سنّةً عن غلبة ظنّ،"], [3303.8, "أو بدعةً عن علمٍ أو غلبة ظنّ."], [3307.0, "لكن ما دام الأمر لا يزال في حيّز الاشتباه عليك فإيّاك أن تعبد الله عز وجل به."]], "tr": [[3276.0, "Şaban ayının yarısı gecesini ihya etmek de böyledir."], [3283.4, "Selef bu konuda, onu bid'at sayanlar ile caiz görenler arasında ihtilaf etmeye devam etmiştir."], [3292.0, "Eğer meseleyi tahrir etmediysen, şu ana kadar onda hakkın yüzünü bilmiyorsan ve hâlâ şüphe ve tereddüt içindeysen, mesele senin için —zann-ı galiple sünnet ya da ilimle veya zann-ı galiple bid'at olması arasında— netleşinceye kadar onunla Allah'a ibadet etmekten sakın."], [3308.0, "Durum hâlâ senin için şüphe alanında olduğu sürece onunla Allah Azze ve Celle'ye ibadet etmekten sakın."]]}, {"reader": false, "ar": [[3314.0, "ومنها: التوسعة على العيال في يوم عاشوراء تعبّدًا،"], [3322.0, "وقد نصّ عليه بعض السلف،"], [3325.7, "وخُولفوا فيه ـ يعني: خالفهم بعضُهم ـ فلا يدخل أنه من عمل السلف الذي لم يخالفهم فيه أحد."], [3336.0, "وبناءً على ذلك فلا تتعبّد لله عز وجل بهذا الأمر ـ أي:"], [3343.4, "بالتوسعة على عيالك في يوم عاشوراء ـ ما دمتَ لا تزال في دائرة الشكّ،"], [3350.0, "مع أنّ الحقّ عدمُ التعبّد به؛"], [3353.3, "لعدم وجود الدليل الخاصّ به."]], "tr": [[3314.0, "Bunlardan biri de taabbud olarak Âşûrâ gününde aileye (nafakayı) genişletmektir."], [3322.7, "Bazı selef bunu açıkça belirtmiş, fakat bu konuda onlara muhalefet edilmiştir —yani bazıları onlara muhalefet etmiştir—."], [3333.7, "Dolayısıyla bu, hiç kimsenin onlara muhalefet etmediği selef ameli kapsamına girmez."], [3339.5, "Buna göre şüphe dairesinde olduğun sürece bu işle —yani Âşûrâ gününde aileni genişletmekle— Allah Azze ve Celle'ye ibadet etme;"], [3349.4, "gerçi doğru olan, ona özel bir delil bulunmadığı için onunla ibadet etmemektir."]]}, {"reader": false, "ar": [[3356.0, "وكتكرار تعميم البدن ثلاثًا في الغسل من الجنابة،"], [3368.0, "كما قاله الحنابلة قياسًا على الوضوء:"], [3374.0, "فكما أنه يُشرع التثليث في الوضوء فيُشرع التثليث في الغسل."], [3380.0, "وقال كثيرٌ من أهل العلم بأنه من البدع التي ما أنزل الله بها من سلطان؛"], [3387.0, "فإنّ جميع الواصفين لغسله من الجنابة لم يذكروا إلا أنه أفاض على جسده،"], [3395.0, "وأفاض على جلده، وأفاض على بدنه،"], [3398.0, "ثم غسل سائر جسده،"], [3400.0, "وهي مرةٌ واحدة. فإذا كنتَ لم تحرّر الأمر بين كونه عبادةً أو بدعةً فإيّاك أن تفعله من باب الاحتياط،"], [3412.0, "بل الاحتياطُ أن تتركه؛"], [3414.0, "لأنّ الأمر المشكوك فيه يُردّ إلى أصله،"], [3417.0, "مع أنّ الحقّ عدمُ مشروعيّة التثليث. والله أعلم."]], "tr": [[3356.0, "Cünüplükten yıkanırken bedenin tamamını üç kez yıkamayı tekrarlamak da böyledir."], [3369.5, "Hanbelîler bunu abdeste kıyasla söylemiştir:"], [3374.3, "Abdestte üçleme meşru olduğu gibi gusülde de üçleme meşrudur."], [3380.0, "İlim ehlinin birçoğu ise bunun, Allah'ın hakkında hiçbir delil indirmediği bid'atlerden olduğunu söylemiştir."], [3386.1, "Çünkü onun cünüplükten gusülünü tarif edenlerin hepsi, sadece onun cesedine su döktüğünü, derisine su döktüğünü, bedenine su döktüğünü, sonra bütün cesedini yıkadığını zikretmiştir;"], [3399.0, "bu da bir kezdir. Eğer meseleyi ibadet ya da bid'at olması arasında tahrir etmediysen, onu ihtiyat kabîlinden yapmaktan sakın;"], [3411.0, "bilakis ihtiyat onu terk etmendir."], [3413.5, "Çünkü şüphe edilen iş aslına döndürülür."], [3416.1, "Gerçi doğru olan üçlemenin meşru olmamasıdır. Allah en iyisini bilir."]]}]}, {"ts": "57:04", "title": "8. Külliye: Sahâbînin yapıp Nebî ﷺ'in inkâr ettiği her fiil bid'attir", "paras": [{"reader": false, "ar": [[3424.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما فعله الصحابيّ وأنكره عليه النبيّ صلى الله عليه وسلم ففعلُه بدعة.<\/b> كلُّ ما فعله الصحابيّ وأنكره عليه النبيّ صلى الله عليه وسلم فلا يُعبد الله به، يعني: فهو بدعة."]], "tr": [[3424.0, "Külliyelerden biri de şudur: 8."], [3426.6, "külliye: Sahâbînin yaptığı ve Nebî ﷺ'in ona inkâr ettiği her şey;"], [3431.5, "onun (bunu) yapması bid'attir. Sahâbînin yaptığı ve Nebî ﷺ'in ona inkâr ettiği her şeyle Allah'a ibadet edilmez; yani o bid'attir."]]}, {"reader": false, "ar": [[3448.0, "كصوم الدهر الذي أنكره النبيّ صلى الله عليه وسلم على عبد الله بن عمر <span class=\"q\">؟ 57:35<\/span> رضي الله عنهما؛"], [3460.0, "فمن تعبّد لله الآن بصوم الدهر فيكون تعبّدُه ضربًا <span class=\"q\">؟ 57:42<\/span> من البدعة."], [3467.0, "وكإنكاره على من نذر أن يصوم واقفًا في الشمس فلا يقعد،"], [3474.4, "ساكتًا فلا يتكلّم؛ فالنذر بهذه الصورة من جملة البدع؛"], [3486.7, "لأنه أدخل في النذر ما لا يجوز أن يُعبد الله به على وجه الاستقلال."], [3493.0, "ولذلك أنكر عليه النبيّ صلى الله عليه وسلم هذه الأمور،"], [3500.0, "فقال: «مُروه فليتكلّم، وليستظلّ، وليقعد، وليُتمّ صومه»."], [3509.0, "فإذا جاءنا رجلٌ الآن يريد أن يعيد هذه الصورة،"], [3513.0, "فيتعبّد لله عز وجل بالنذر على هذه الحال،"], [3518.0, "فإننا نقول: هذه بدعة."]], "tr": [[3448.0, "Nebî ﷺ'in Abdullah b. Ömer'e <span class=\"q\">؟<\/span> —Allah ikisinden de razı olsun— inkâr ettiği bütün yıl oruç tutmak gibi."], [3458.5, "Şimdi kim bütün yıl oruç tutarak Allah'a ibadet ederse, onun bu ibadeti bid'atten bir tür <span class=\"q\">؟<\/span> olur."], [3469.7, "Güneşte ayakta durup oturmamak, susup konuşmamak üzere oruç tutmayı adayan kimseye inkârı da böyledir."], [3484.9, "Bu suretteki adak bid'atlerdendir; çünkü adağa, müstakil olarak kendisiyle Allah'a ibadet edilmesi caiz olmayan şeyleri sokmuştur."], [3491.7, "Bu yüzden Nebî ﷺ ona bu işleri inkâr etti ve şöyle buyurdu:"], [3498.6, "\"Ona emredin; konuşsun, gölgelensin, otursun ve orucunu tamamlasın.\" Şimdi bize bir adam gelip bu sureti tekrarlamak ve bu hâl üzere adakla Allah Azze ve Celle'ye ibadet etmek isterse, deriz ki: Bu bid'attir."]]}, {"reader": false, "ar": [[3521.0, "ومنها أيضًا: إنكاره على الرهط الثلاثة الذين قال أحدهم:"], [3531.1, "أمّا أنا فأصلّي الليل أبدًا ولا أنام،"], [3536.0, "وقال الثاني ـ أو قال الآخر ـ:"], [3539.2, "وأنا أصوم الدهر أبدًا ولا أُفطر،"], [3543.0, "وقال الثالث: وأنا أعتزل النساء فلا أتزوّج أبدًا؛"], [3547.0, "فلم يُقرّهم النبيّ صلى الله عليه وسلم على ذلك،"], [3551.1, "وأنكر عليهم بقوله: «أمَا واللهِ إنّي لأخشاكم لله وأتقاكم له، ولكنّي أصلّي وأنام، وأصوم وأُفطر، وأتزوّج النساء؛ فمن رغب عن سنّتي فليس منّي»."], [3567.0, "فإذا جاءنا رجلٌ الآن يتعبّد لله بالصوم الدائم،"], [3572.0, "أو بتركِ ـ أو بالتبتّل عن الزواج على وجه الدوام،"], [3576.0, "أو بصلاة الليل كلّه، فنقول: قد ابتدعت."]], "tr": [[3521.0, "Bunlardan biri de üç kişilik gruba inkârıdır."], [3524.8, "İçlerinden biri: \"Ben geceyi daima namazla geçireceğim, uyumayacağım\" dedi."], [3533.2, "İkincisi —ya da diğeri—: \"Ben de ebediyen bütün yıl oruç tutacağım, iftar etmeyeceğim\" dedi."], [3540.5, "Üçüncüsü: \"Ben de kadınlardan uzak duracağım, asla evlenmeyeceğim\" dedi."], [3544.5, "Nebî ﷺ onları bunun üzerine onaylamadı ve şu sözüyle onlara inkâr etti:"], [3548.8, "\"Dikkat edin! Vallahi ben Allah'tan en çok korkanınız ve O'ndan en çok sakınanınızım."], [3554.0, "Fakat ben namaz da kılarım, uyurum da;"], [3558.7, "oruç da tutarım, iftar da ederim;"], [3561.4, "kadınlarla da evlenirim. Kim benim sünnetimden yüz çevirirse benden değildir.\" Şimdi bize bir adam gelip devamlı oruçla ya da terk etmekle —ya da devamlı şekilde evlenmeden uzak durmakla— veya bütün geceyi namazla geçirmekle Allah'a ibadet ederse, deriz ki: Bid'at çıkardın."]]}, {"reader": false, "ar": [[3582.0, "ومنها أيضًا: إنكاره صلى الله عليه وسلم على من لم يترخّص بشيءٍ من رُخص الشرع؛"], [3597.0, "فإنّ النبيّ صلى الله عليه وسلم ـ كما في الصحيحين من حديث عائشة ـ قد صنع شيئًا ورخّص فيه،"], [3605.0, "فتنزّه عنه أقوامٌ ـ أو قوم ـ فبلغ ذلك النبيَّ صلى الله عليه وسلم،"], [3611.0, "فخطب الناس، فحمد الله وأثنى عليه،"], [3614.0, "ثم قال: «أمّا بعد، فما بالُ أقوامٍ يتنزّهون عن الشيء أصنعه؟ فواللهِ إنّي لأعلمُهم بالله، وأشدُّهم له خشية»."]], "tr": [[3582.0, "Bunlardan biri de Nebî ﷺ'in, şer'î ruhsatlardan herhangi biriyle ruhsatla amel etmeyen kimseye inkârıdır."], [3594.3, "Sahîhayn'da Âişe'nin hadisinde geçtiği üzere Nebî ﷺ bir şey yaptı ve ona ruhsat verdi;"], [3601.5, "bazı topluluklar —ya da bir topluluk— ondan uzak durdu (çekindi)."], [3605.6, "Bu, Nebî ﷺ'e ulaştı; insanlara hutbe verdi, Allah'a hamd ve senada bulundu, sonra şöyle buyurdu:"], [3612.0, "\"Bundan sonra: Benim yaptığım bir şeyden uzak duran bazı toplulukların hâli nedir?"], [3617.8, "Vallahi ben Allah'ı onların en iyi bileniyim ve O'ndan en çok korkanıyım.\""]]}, {"reader": false, "ar": [[3624.0, "فالذي يأبى رخصة الله عز وجل،"], [3627.0, "ويأبى أن يوسّع على نفسه الأمرَ الذي يوجب عليه الضيق والعنت والحرج،"], [3633.0, "فإنه مبتدعٌ بهذا؛ فأمامك رخصةُ الله،"], [3637.3, "وأمامك سعةُ التشريع، فلا ينبغي أن تبقى في ضيقٍ ـ في الضيق."]], "tr": [[3624.0, "Allah Azze ve Celle'nin ruhsatını kabul etmeyen ve kendisine darlık, meşakkat ve sıkıntı gerektiren işi kendisi için genişletmeyi kabul etmeyen kişi, bununla bid'atçidir."], [3635.8, "Önünde Allah'ın ruhsatı var, önünde teşrîin genişliği var;"], [3643.1, "darlıkta —sıkıntıda— kalman uygun değildir."]]}, {"reader": false, "ar": [[3645.0, "ومنها أيضًا: إنكاره على من بالغ في قيام الليل حتى احتاج إلى أن يعتضد على حبلٍ أو سارية؛"], [3657.0, "فإنه لا ينبغي أن يبلغ بك قيامُ الليل والإشقاقُ على نفسك هذه الصورة."], [3666.0, "ولذلك دخل النبيّ صلى الله عليه وسلم يومًا من الأيام المسجد،"], [3671.0, "فرأى حبلًا ممدودًا بين ساريتين،"], [3674.0, "فقال: «ما هذا؟» قالوا:"], [3675.6, "لفلانةَ تصلّي، فإذا عجزت أمسكت به."], [3679.0, "قال: «حُلّوه، ليصلِّ أحدُكم نشاطَه، فإذا عجز أو فتر فليقعد»."]], "tr": [[3645.0, "Bunlardan biri de gece namazında aşırıya giderek bir ipe ya da direğe dayanmaya muhtaç olan kimseye inkârıdır."], [3655.7, "Gece namazının ve kendine meşakkat vermenin seni bu surete ulaştırması uygun değildir."], [3662.0, "Bu yüzden Nebî ﷺ günlerden bir gün mescide girdi ve iki direk arasına gerilmiş bir ip gördü."], [3671.0, "\"Bu nedir?\" buyurdu. \"Falanca kadının;"], [3674.0, "namaz kılıyor, yorulunca ona tutunuyor\" dediler."], [3676.7, "Buyurdu ki: \"Onu çözün. Biriniz zindeliği (yettiği) kadar namaz kılsın;"], [3682.0, "yorulduğunda ya da gevşediğinde otursun.\""]]}, {"reader": false, "ar": [[3684.0, "وقال عليه الصلاة والسلام:"], [3687.0, "«إذا نعس أحدكم وهو يصلّي فليرقد حتى يذهب عنه النوم؛ فإنّ أحدكم إذا صلّى وهو ناعسٌ لا يدري، لعلّه يذهب يستغفر فيسبّ نفسه»."], [3698.0, "فلو جاءنا رجلٌ الآن وصلّى صلاةً طويلةً أثقلت عليه حتى انهدّت قواه،"], [3707.0, "واحتاج إلى النوم، وتعب التعب الشديد،"], [3711.0, "ثم أمسك حبلًا، فنقول:"], [3713.3, "هذا من البدع، لا تفعله يا سلام."]], "tr": [[3684.0, "(Nebî) —ona salât ve selam olsun— şöyle buyurdu:"], [3688.8, "\"Biriniz namaz kılarken uyuklarsa, uykusu gidinceye kadar uyusun."], [3692.0, "Çünkü biriniz uyuklarken namaz kılarsa, bilmez;"], [3693.9, "belki istiğfar etmeye kalkışırken kendine söver.\" Şimdi bize bir adam gelse ve kendisine ağır gelen, güçlerini tüketen uzun bir namaz kılsa, uykuya muhtaç olsa ve çok yorulsa, sonra bir ipe tutunsa, deriz ki:"], [3713.3, "Bu bid'atlerdendir; bunu yapma, (ey adam,) aman!"]]}, {"reader": false, "ar": [[3718.0, "وكإنكاره على ذلك الشيخ النحيل الذي جاء يُهادى بين ابنيه؛"], [3724.6, "لأنه نذر أن يحجّ ماشيًا،"], [3731.0, "فرآه النبيّ صلى الله عليه وسلم وقال:"], [3734.1, "«مُروه فليركب»، وفي رواية:"], [3735.9, "«أيّها الشيخ، إنّ الله غنيٌّ عن تعذيبك لنفسك»،"], [3739.7, "أو كما قال صلى الله عليه وسلم."], [3743.0, "ولمّا نذرت أختُ عقبة ـ رضي الله عنهما ـ أن تحجّ ماشيةً وألّا تركب،"], [3754.0, "نهاها النبيّ صلى الله عليه وسلم عن ذلك،"], [3757.7, "وأمرها أن تركب وأن تُهدي."]], "tr": [[3718.0, "İki oğlunun arasında desteklenerek yürüyen o zayıf ihtiyara inkârı da böyledir;"], [3724.6, "çünkü o, yürüyerek hac yapmayı adamıştı."], [3731.4, "Nebî ﷺ onu gördü ve \"Ona emredin, binsin\" buyurdu."], [3735.0, "Bir rivayette de: \"Ey ihtiyar!"], [3737.4, "Allah senin kendine eziyet etmenden müstağnidir\" buyurdu;"], [3740.6, "ya da ﷺ nasıl buyurduysa."], [3743.0, "Ukbe'nin kız kardeşi —Allah ikisinden de razı olsun— yürüyerek hac yapmayı ve binmemeyi adadığında, Nebî ﷺ onu bundan nehyetti ve binmesini ve hedy (kurban) göndermesini emretti."]]}, {"reader": false, "ar": [[3760.0, "وكإنكاره التبتّلَ على عثمان بن مظعون؛"], [3769.0, "فإنه لمّا عزم على أن يترك الزواج التركَ المطلق،"], [3773.0, "بلغ ذلك النبيَّ صلى الله عليه وسلم فأنكر عليه."], [3778.0, "ولذلك في الصحيحين من حديث سعد بن أبي وقّاص رضي الله عنه قال:"], [3782.5, "«ردّ النبيّ صلى الله عليه وسلم على عثمان بن مظعون التبتّل، ولو أذن له لاختصينا»."]], "tr": [[3760.0, "Osman b. Maz'ûn'a tebettülü (evlenmeden uzak durmayı) inkâr etmesi de böyledir."], [3770.8, "O, evliliği mutlak olarak terk etmeye azmettiğinde bu Nebî ﷺ'e ulaştı ve ona inkâr etti."], [3778.0, "Bu yüzden Sahîhayn'da Sa'd b."], [3779.3, "Ebî Vakkâs'ın —Allah ondan razı olsun— hadisinde şöyle der:"], [3782.5, "\"Nebî ﷺ Osman b. Maz'ûn'un tebettülünü reddetti."], [3785.5, "Eğer ona izin verseydi, biz de kendimizi hadım ettirirdik.\""]]}, {"reader": false, "ar": [[3791.0, "وفي صحيح البخاريّ من حديث أبي هريرة رضي الله عنه قال:"], [3795.4, "أتيتُ النبيّ صلى الله عليه وسلم فقلتُ:"], [3798.6, "«يا رسول الله، إنّي رجلٌ شابّ، وإنّي أخاف على نفسي العنت» ـ أي:"], [3804.8, "الفاحشة ـ «ولا أجد ما أتزوّج به النساء» ـ كأنه يستأذنه في الاختصاء ـ قال:"], [3811.3, "«فسكت عنّي، ثم قلتُ مثلَه فسكت عنّي، ثم قلتُ مثلَه فسكت عنّي، ثم قلتُ مثلَه فقال: يا أبا هريرة، جفّ القلمُ بما أنت لاقٍ، فاختصِ على ذلك أو ذَر»."], [3823.0, "ليس هذا من باب التجويز،"], [3824.0, "وإنما من باب إيش؟"], [3825.0, "الإنكار والتغليظ عليه: هذا لا ينبغي أبدًا، لا ينبغي أبدًا."]], "tr": [[3791.0, "Sahîh-i Buhârî'de Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde şöyle der:"], [3794.6, "Nebî ﷺ'e geldim ve dedim ki:"], [3797.1, "\"Ey Allah'ın Resûlü! Ben genç bir adamım ve kendim hakkında zinaya düşmekten\" —yani hayasızlıktan— \"korkuyorum;"], [3804.4, "kadınlarla evlenecek bir şey de bulamıyorum.\" —Sanki ondan hadım olmak için izin istiyor.— Dedi ki:"], [3811.0, "\"Bana karşı sustu. Sonra aynısını söyledim, yine bana karşı sustu."], [3814.3, "Sonra aynısını söyledim, yine sustu."], [3816.0, "Sonra aynısını söyledim; bunun üzerine:"], [3818.5, "Ey Ebû Hüreyre! Karşılaşacağın şeyle kalem kurumuştur."], [3820.6, "Buna rağmen ister hadım ol ister bırak, buyurdu.\" Bu, caiz görme kabîlinden değildir;"], [3824.0, "ne kabîlindendir? İnkâr ve ona karşı sertlik kabîlindendir:"], [3827.0, "Bu asla uygun değildir, asla uygun değildir."]]}, {"reader": false, "ar": [[3833.0, "وبناءً على ذلك فإذا رأينا الصحابيّ في عهد النبيّ صلى الله عليه وسلم فعل فعلًا،"], [3839.0, "ثم رأينا الشارع صلى الله عليه وسلم أنكر عليه،"], [3843.0, "فإنّ من جملة ما يُحكم على الفعل بأنه بدعة إنكارَه عليه."], [3849.0, "ولكن لا تكمل هذه القاعدة إلا بالكلّيّة التي بعدها."]], "tr": [[3833.0, "Buna göre Nebî ﷺ döneminde bir sahâbînin bir fiil yaptığını, sonra Şâri' ﷺ'in ona inkâr ettiğini görürsek, o fiilin bid'at olduğuna hükmedilmesini sağlayan şeylerden biri de onun ona inkâr etmesidir."], [3846.0, "Fakat bu kaide ancak ondan sonraki külliye ile tamamlanır."]]}]}, {"ts": "01:04:12", "title": "9. Külliye: Sahâbînin özel delil olmaksızın yaptığı taabbud, ancak Şâri'in onayıyla meşru olur", "paras": [{"reader": false, "ar": [[3854.0, "<b>كلُّ ما تعبّد به الصحابيُّ بلا دليلٍ بخصوصه فلا يكون مشروعًا إلا بإقرار صاحب الشرع.<\/b> كلُّ ما تعبّد به الصحابيّ بلا دليلٍ بخصوصه فلا يكون مشروعًا إلا بإقرار صاحب الشرع،"], [3881.0, "يعني: إلا بإقرار النبيّ صلى الله عليه وسلم."], [3885.6, "أُعيدها مرةً أخرى: كلُّ ما تعبّد به الصحابيّ بلا دليلٍ بخصوصه فلا يكون مشروعًا إلا بإقرار صاحب الشرع،"], [3900.0, "أي: النبيّ صلى الله عليه وسلم."]], "tr": [[3854.0, "<b>9. külliye: Sahâbînin, özel bir delil olmaksızın kendisiyle ibadet ettiği her şey, ancak şeriat sahibinin onayıyla meşru olur.<\/b> Sahâbînin, özel bir delil olmaksızın kendisiyle ibadet ettiği her şey, ancak şeriat sahibinin onayıyla, yani ancak Nebî ﷺ'in onayıyla meşru olur."], [3886.7, "Bir kez daha tekrarlıyorum: Sahâbînin, özel bir delil olmaksızın kendisiyle ibadet ettiği her şey, ancak şeriat sahibinin —yani Nebî ﷺ'in— onayıyla meşru olur."]]}, {"reader": false, "ar": [[3903.0, "وذلك لأننا نجد أنّ بعض أهل البدع ـ أنّ بعض أهل البدع ـ يستدلّون على جواز الإحداث بأنّ هناك من الصحابة من تعبّد لله بدليلٍ ـ عفوًا ـ بعبادةٍ لم يعهدها من رسول الله صلى الله عليه وسلم؛"], [3925.0, "فإذا كان الصحابيّ ـ على جلالة قدره ـ أجاز لنفسه أن يتعبّد بعبادةٍ لم يأخذها مِن فِي رسول الله صلى الله عليه وسلم،"], [3936.0, "فيجوز لنا أيضًا أن نعبد الله عز وجل بما لم يرد فيه دليلٌ بخصوصه."]], "tr": [[3903.0, "Bu şundandır: Bid'at ehlinden bazılarının —bid'at ehlinden bazılarının— ihdasın (yenilik çıkarmanın) caiz olduğuna şununla delil getirdiklerini görüyoruz:"], [3916.5, "Sahâbe arasında Allah'a bir delille —pardon— Resûlullah ﷺ'den görmediği bir ibadetle ibadet eden vardır."], [3924.4, "Sahâbî, kadrinin yüceliğine rağmen, Resûlullah ﷺ'in ağzından almadığı bir ibadetle ibadet etmeyi kendisi için caiz gördüyse, bizim de hakkında özel bir delil gelmemiş bir şeyle Allah Azze ve Celle'ye ibadet etmemiz caizdir (derler)."]]}, {"reader": false, "ar": [[3943.0, "فهذه الكلّيّة تردّ على هذا الاستدلال:"], [3949.0, "بأنّ مجرّد فعل الصحابيّ لتعبّدٍ جديدٍ لا يدلّ على أنه مشروعٌ بمجرّد فعله،"], [3957.0, "وإنما لا يدخل في دائرة المشروعيّة إلا إذا عُرض على النبيّ صلى الله عليه وسلم أو بلغه ـ وإيش؟"], [3965.5, "ـ وأقرّه؛ فهنا يدخل في دائرة المشروع."], [3969.4, "فلو سلّمنا جدلًا بأنه لم يُعرض عليه ولم يُقرّه،"], [3976.0, "فلا يجوز لنا أن نتعبّد لله بهذا التعبّد المنقول عن هذا الصحابيّ."]], "tr": [[3943.0, "Bu külliye bu delillendirmeye şöyle reddiye verir:"], [3949.0, "Sahâbînin yeni bir taabbudu sırf yapması, sırf onu yapmasıyla meşru olduğuna delâlet etmez."], [3957.0, "O, ancak Nebî ﷺ'e arz edilir ya da ona ulaşır ve —ne olur?— onu onaylarsa meşruluk dairesine girer;"], [3965.5, "işte o zaman meşru dairesine girer."], [3969.4, "Farz edelim ki ona arz edilmedi ve onu onaylamadı;"], [3976.0, "bu durumda bu sahâbîden nakledilen bu taabbudla Allah'a ibadet etmemiz caiz değildir."]]}, {"reader": false, "ar": [[3982.0, "فالكلّيّة الأولى في الأفعال التي فعلها الصحابيّ وأنكرها رسول الله صلى الله عليه وسلم،"], [3992.0, "وهذه الكلّيّة في الأفعال التي فعلها الصحابيّ وأقرّها رسول الله صلى الله عليه وسلم؛"], [4001.7, "فجعلنا إنكاره في الكلّيّة السابقة دليلًا على الإحداث والبدعة،"], [4008.0, "وجعلنا إقراره في هذه الكلّيّة دليلًا على التشريع وجواز التعبّد."]], "tr": [[3982.0, "Önceki külliye, sahâbînin yapıp Resûlullah ﷺ'in inkâr ettiği fiiller hakkındadır;"], [3989.4, "bu külliye ise sahâbînin yapıp Resûlullah ﷺ'in onayladığı fiiller hakkındadır."], [3997.4, "Önceki külliyede onun inkârını ihdas ve bid'ate delil kıldık;"], [4005.3, "bu külliyede de onun onayını teşrîe ve taabbudun caiz olmasına delil kıldık."]]}, {"reader": false, "ar": [[4014.0, "وعلى ذلك: ما فعله ذلك الصحابيّ المذكور آنفًا،"], [4021.0, "من أنّ النبيّ صلى الله عليه وسلم بعثه على سريّة،"], [4025.8, "فصلّى بهم صلاةً غريبة،"], [4027.7, "كان يختم قراءتها بـ<span class=\"ayah\">﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾<\/span>؛"], [4031.0, "فهل دخلت في حيّز التشريع وما يجوز التعبّد به بمجرّد فعله؟"], [4036.9, "الجواب: لا. ولذلك لا يُعرف عمّن معه أنهم أقرّوه،"], [4043.5, "بل أنكروا عليه، لكن لأنه رئيس الجيش ـ أو السريّة ـ لم يتخلّفوا عن الصلاة خلفه،"], [4052.0, "إلا أنهم رفعوا أمره إلى النبيّ صلى الله عليه وسلم،"], [4056.0, "فقال: «سلوه لأيّ شيءٍ يصنع ذلك؟» قال:"], [4059.4, "«لأنها صفة الرحمن، وأنا أحبّ أن أقرأ بها»،"], [4063.0, "فقال: «أخبروه أنّ الله عز وجل يحبّه»."], [4066.0, "هنا دخلت هذه الصفة في حيّز ما يجوز التعبّد لله عز وجل به أحيانًا."], [4075.0, "فهمتم هذا؟ أظنّ واضح."]], "tr": [[4014.0, "Buna göre, az önce zikredilen o sahâbînin yaptığı şey:"], [4019.1, "Nebî ﷺ onu bir seriyyenin başında göndermişti;"], [4023.4, "onlara garip bir namaz kıldırdı, kıraatini <span class=\"ayah\">﴿De ki: O Allah birdir﴾<\/span> ile bitiriyordu."], [4028.6, "Bu (şekil) sırf onun yapmasıyla teşrî alanına ve kendisiyle ibadet etmenin caiz olduğu şeyler arasına girdi mi?"], [4035.8, "Cevap: Hayır. Bu yüzden yanındakilerin onu onayladıkları bilinmemektedir;"], [4040.4, "bilakis ona itiraz ettiler. Fakat o ordunun —ya da seriyyenin— komutanı olduğu için onun arkasında namaz kılmaktan geri durmadılar;"], [4050.9, "ancak onun durumunu Nebî ﷺ'e ilettiler."], [4053.2, "O da: \"Ona sorun, bunu niçin yapıyor?\" buyurdu."], [4056.0, "(Adam) \"Çünkü o Rahmân'ın sıfatıdır;"], [4058.0, "ben de onu okumayı seviyorum\" dedi."], [4060.8, "(Nebî ﷺ): \"Ona Allah Azze ve Celle'nin onu sevdiğini haber verin\" buyurdu."], [4065.1, "İşte burada bu şekil, kendisiyle ara sıra Allah Azze ve Celle'ye ibadet etmenin caiz olduğu şeyler alanına girdi."], [4074.5, "Bunu anladınız mı? Sanırım açık."]]}, {"reader": false, "ar": [[4077.0, "ومنها أيضًا: قضاء ركعتي الفجر بعد الفراغ من فريضتها مباشرةً."], [4084.0, "أمّا قضاؤها بعد طلوع الشمس فهو مرفوعٌ للنبيّ صلى الله عليه وسلم في قوله:"], [4093.8, "«من فاتته الركعتان قبل صلاة الصبح فليصلّهما إذا طلعت الشمس»."], [4099.0, "لكنّ المسألة الآن مفروضةٌ في حكم قضائهما بعد الفراغ من فريضتها،"], [4108.0, "وهو وقتُ نهي. وقد وافق أنّ رجلًا من أصحاب النبيّ صلى الله عليه وسلم يقال له:"], [4115.5, "قيس بن عمرو، صلّى الصبح مع رسول الله صلى الله عليه وسلم،"], [4121.0, "وقد فاتته ركعتا الفجر،"], [4124.0, "فلمّا سلّم رسول الله صلى الله عليه وسلم قام مقامه وصلّى ركعتين،"], [4130.0, "فلاث به الناس، فقال النبيّ صلى الله عليه وسلم:"], [4136.0, "«آلصبحَ أربعًا؟» فقال: يا رسول الله،"], [4139.4, "إنّي لم أكن صلّيتُ الركعتين اللتين قبل صلاة الصبح فصلّيتُهما الآن."], [4146.0, "فسكت النبيّ صلى الله عليه وسلم."]], "tr": [[4077.0, "Bunlardan biri de sabah namazının iki rekât (sünnetini), farzını bitirdikten hemen sonra kaza etmektir."], [4087.2, "Onu güneş doğduktan sonra kaza etmeye gelince, bu Nebî ﷺ'e merfûdur;"], [4094.1, "şu sözündedir: \"Kim sabah namazından önceki iki rekâtı kaçırırsa, güneş doğunca onları kılsın.\" Fakat mesele şimdi onları farzını bitirdikten sonra kaza etmenin hükmü hakkında farz edilmiştir;"], [4111.0, "bu da bir nehiy (kerahet) vaktidir."], [4114.0, "Nebî ﷺ'in ashâbından Kays b."], [4117.0, "Amr denilen bir adam Resûlullah ﷺ ile sabah namazını kıldı;"], [4121.8, "sabahın iki rekât (sünnetini) kaçırmıştı."], [4124.8, "Resûlullah ﷺ selam verince yerinde kalktı ve iki rekât kıldı."], [4130.0, "İnsanlar onun etrafını sardı. Nebî ﷺ:"], [4134.7, "\"Sabah namazı dört rekât mı?\" buyurdu."], [4138.2, "(Adam) dedi ki: \"Ey Allah'ın Resûlü!"], [4141.8, "Sabah namazından önceki iki rekâtı kılmamıştım;"], [4145.4, "onları şimdi kıldım.\" Nebî ﷺ sustu."]]}, {"reader": false, "ar": [[4149.0, "فبمجرّد سكوته دخل هذا الأمر في حيّز التشريع."], [4159.0, "وبناءً على ذلك فقضاء سنّة الفجر إذا فاتت بالعذر لها وقتان:"], [4164.0, "وقتُ جواز، وهو قضاؤها بعد الفراغ من فريضتها،"], [4170.0, "ووقتُ أفضليّة، وهو قضاؤها بعد طلوع الشمس لمن غلب على ظنّه أنه لن ينساها."]], "tr": [[4149.0, "Sırf onun susmasıyla bu iş teşrî alanına girdi."], [4153.4, "Buna göre sabah namazının sünneti bir özür sebebiyle kaçırıldığında onu kaza etmenin iki vakti vardır:"], [4164.0, "Cevaz vakti, ki o farzını bitirdikten sonra kaza etmektir;"], [4169.1, "efdaliyet vakti, ki o da unutmayacağı hususunda zann-ı galibi olan kimse için güneş doğduktan sonra kaza etmektir."]]}, {"reader": false, "ar": [[4179.1, "وكالتيمّم في البرد مع وجود الماء؛"], [4185.0, "فإنّ النبيّ صلى الله عليه وسلم بعث عمرو بن العاص في غزوة ذات السلاسل أميرًا على الجيش،"], [4197.0, "فأجنب في ليلةٍ باردةٍ شديدة البرد،"], [4201.0, "فخاف أن يموت إن اغتسل،"], [4203.5, "فتيمّم وهو جُنب ـ تيمّم ـ ثم صلّى بأصحابه،"], [4208.0, "وصلّوا وراءه لأنه رئيس الجيش،"], [4210.0, "ما ينبغي أن يُختلف عليه."], [4211.0, "فلمّا رجعوا ذكروا ذلك للنبيّ صلى الله عليه وسلم،"], [4215.0, "فدعاه فقال: «أصلّيتَ بأصحابك وأنت جُنب؟» قال:"], [4218.3, "يا رسول الله، ذكرتُ قول الله عز وجل ـ إذن هذا دليلٌ على أنه مجرّد اجتهاد،"], [4224.0, "ولم يأخذه عن تشريعٍ خاصّ،"], [4226.0, "وإنما اجتهد ـ ذكرتُ قول الله عز وجل:"], [4231.0, "<span class=\"ayah\">﴿وَلَا تَقْتُلُوا أَنفُسَكُمْ إِنَّ اللَّهَ كَانَ بِكُمْ رَحِيمًا﴾<\/span> <span class=\"ref\">[النساء: ٢٩]<\/span>،"], [4235.0, "فتبسّم النبيّ صلى الله عليه وسلم."]], "tr": [[4179.1, "Su bulunduğu hâlde soğukta teyemmüm etmek de böyledir."], [4185.7, "Nebî ﷺ Amr b. el-Âs'ı Zâtü's-Selâsil gazvesinde ordunun başında emir olarak gönderdi."], [4192.9, "Çok soğuk, dondurucu bir gecede cünüp oldu."], [4197.7, "Yıkanırsa öleceğinden korktu ve cünüp hâlde teyemmüm etti —teyemmüm etti—;"], [4203.0, "sonra arkadaşlarına namaz kıldırdı. Onlar da ordunun komutanı olduğu için onun arkasında namaz kıldılar;"], [4209.6, "ona muhalefet edilmesi uygun değildir."], [4210.8, "Döndüklerinde bunu Nebî ﷺ'e anlattılar."], [4212.3, "Onu çağırdı ve \"Cünüp hâlde arkadaşlarına namaz mı kıldırdın?\" buyurdu."], [4216.5, "Dedi ki: \"Ey Allah'ın Resûlü!"], [4218.7, "Allah Azze ve Celle'nin şu sözünü hatırladım\" —demek ki bu, onun sadece bir içtihad olduğuna, onu özel bir teşrîden almadığına delildir;"], [4226.0, "sadece içtihad etti— \"Allah Azze ve Celle'nin şu sözünü hatırladım:"], [4232.0, "<span class=\"ayah\">﴿Kendinizi öldürmeyin. Şüphesiz Allah size karşı çok merhametlidir﴾<\/span> [Nisâ 29].\" Nebî ﷺ gülümsedi."]]}, {"reader": false, "ar": [[4238.0, "فبمجرّد تبسّمه دخل هذا الحكم من جملة أحكام الشريعة؛"], [4244.0, "فيجوز التيمّم في البرد إذا خاف الإنسان من استعمال الماء شيئًا من الضرر."], [4250.0, "ومنها أيضًا: صحّة إمامة من لم يبلغ،"], [4256.0, "أي: إمامة الصبيّ، كما في صحيح البخاريّ من حديث عمرو بن سلمة ـ تعرفون الحديث ـ قال:"], [4265.4, "«فنظروا فلم يكن أحدٌ أكثرَ منّي قرآنًا، فقدّموني وأنا ابن ستٍّ أو سبع سنين»."]], "tr": [[4238.0, "Sırf onun gülümsemesiyle bu hüküm şeriatin hükümleri arasına girdi."], [4243.3, "Buna göre insan suyu kullanmaktan bir zarar görmekten korkarsa soğukta teyemmüm etmesi caizdir."], [4249.1, "Bunlardan biri de buluğa ermemiş kişinin, yani çocuğun imametinin sahih olmasıdır."], [4256.7, "Nitekim Sahîh-i Buhârî'de Amr b."], [4259.9, "Seleme'nin hadisinde —hadisi biliyorsunuz— şöyle der:"], [4263.7, "\"Baktılar, benden daha çok Kur'an bilen kimse yoktu;"], [4267.2, "altı ya da yedi yaşında olduğum hâlde beni öne geçirdiler.\""]]}, {"reader": false, "ar": [[4272.0, "ومثلُ هذا الفعل لا يمكن أن يخفى على رسول الله صلى الله عليه وسلم،"], [4280.0, "فإنه وإن خفي عليه لبُعد القوم،"], [4282.6, "إلا أنه لا يمكن أن يخفى على الله؛"], [4286.0, "فلو كان يتعلّق به شيءٌ من المنع لأُوحي إلى النبيّ صلى الله عليه وسلم به."], [4292.9, "فلمّا أقرّه صاحبُ الشرع ولم يُنكره،"], [4297.0, "دلّ ذلك على أنّ من الأمر الجائز شرعًا إمامةَ الصبيّ بالبالغين إذا كان يعقل أمرَ صلاته."]], "tr": [[4272.0, "Böyle bir fiilin Resûlullah ﷺ'e gizli kalması mümkün değildir."], [4278.3, "Kavmin uzaklığından dolayı ona gizli kalsa bile Allah'a gizli kalması mümkün değildir."], [4285.1, "Eğer onunla ilgili bir yasak olsaydı, bu Nebî ﷺ'e vahyedilirdi."], [4290.3, "Şeriat sahibi onu onaylayıp inkâr etmeyince, bu, namazının durumunu kavrıyorsa çocuğun bulûğa ermişlere imam olmasının şer'an caiz işlerden olduğuna delâlet etti."]]}, {"reader": false, "ar": [[4306.0, "ومنها أيضًا: إثباتُ النسب بالقافة؛"], [4313.1, "فإنه لم يكن من الطرق التي يثبت بها النسب قبل إقرار مَن؟"], [4319.0, "قبل إقرار النبيّ صلى الله عليه وسلم لِما قاله مجزّزٌ المدلجيّ؛"], [4325.0, "فإنه دخل يومًا من الأيام على زيدٍ وأسامة،"], [4330.0, "وقد التحفا بلحافٍ غطّيا به رؤوسهما،"], [4335.0, "وبدت منه أقدامُهما، فقال:"], [4337.4, "«إنّ هذه الأقدام لَبعضُها من بعض»."], [4340.0, "فدخل النبيّ صلى الله عليه وسلم على عائشة تبرق أساريرُ وجهه،"], [4346.0, "فقال: «أما سمعتِ ما قال مجزّز؟»"]], "tr": [[4306.0, "Bunlardan biri de neseb'in kıyâfe (iz ve benzerlik bilgisi) ile sabit olmasıdır."], [4316.7, "Kimin onayından önce? Nebî ﷺ'in Mücezziz el-Müdlicî'nin söylediğini onaylamasından önce bu, nesebin sabit olduğu yollardan değildi."], [4325.6, "(Mücezziz) günlerden bir gün Zeyd ile Üsâme'nin yanına girdi;"], [4332.3, "başlarını örttükleri bir yorgana bürünmüşlerdi ve ondan ayakları görünüyordu."], [4338.3, "\"Bu ayaklar birbirindendir\" dedi. Nebî ﷺ yüzünün çizgileri parlayarak Âişe'nin yanına girdi ve \"Mücezziz'in ne dediğini duymadın mı?\" buyurdu."]]}, {"reader": false, "ar": [[4348.0, "لأنّ كفّار قريشٍ كانوا يؤذونه في حِبّه وابنِ حِبّه،"], [4353.0, "ويقولون: إنّ أسامة ليس ابنًا لزيد؛"], [4355.0, "إذ كان زيدٌ أبيضَ،"], [4357.0, "وأسامةُ يميل إلى السُّمرة."], [4359.0, "فبمجرّد تبسّمه وإقراره دخلت القيافةُ في دائرة ما يثبت به النسب."], [4369.0, "والأمثلة على ذلك كثيرة."]], "tr": [[4348.0, "Çünkü Kureyş kâfirleri ona sevdiği (Zeyd) ve sevdiğinin oğlu (Üsâme) hakkında eziyet ediyor ve \"Üsâme, Zeyd'in oğlu değildir\" diyorlardı;"], [4356.0, "çünkü Zeyd beyazdı, Üsâme ise esmerliğe çalıyordu."], [4359.0, "Sırf onun gülümsemesi ve onaylamasıyla kıyâfe, nesebin kendisiyle sabit olduğu şeyler dairesine girdi. Bunun örnekleri çoktur."]]}]}, {"ts": "01:12:53", "title": "10. Külliye: Her bid'atçinin âhiretteki hükmü, bid'atine göre küfür ya da fısktır", "paras": [{"reader": false, "ar": [[4373.0, "ومن الكلّيّات أيضًا ـ خلاص،"], [4373.8, "يكفي، ما شاء الله عليك ـ كم رقم الكلّيّة الآن؟"], [4378.0, "العاشرة والأخيرة؟ طيّب، العاشرة والأخيرة."], [4380.0, "ومن الكلّيّات أيضًا: كلُّ مبتدعٍ فحكمُه في الآخرة على حسب بدعته:"], [4387.0, "كفرًا أو فسقًا. كلُّ مبتدعٍ فحكمه في الآخرة على حسب بدعته كفرًا أو فسقًا."], [4399.0, "ماشي. كلُّ مبتدعٍ فحكمه في الآخرة على حسب بدعته كفرًا أو فسقًا."]], "tr": [[4373.0, "Külliyelerden biri de —tamam, yeter, maşallah— şimdi külliyenin numarası kaç?"], [4374.9, "Onuncu ve son mu? Peki, onuncu ve son."], [4380.0, "Külliyelerden biri de şudur: 10."], [4384.0, "külliye: Her bid'atçinin âhiretteki hükmü, bid'atine göredir:"], [4387.0, "küfür ya da fısk. Her bid'atçinin âhiretteki hükmü, bid'atine göre küfür ya da fısktır."], [4400.0, "Tamam. Her bid'atçinin âhiretteki hükmü, bid'atine göre küfür ya da fısktır."]]}, {"reader": false, "ar": [[4407.9, "ما شاء الله، هذا الظاهر أطولُ درسٍ في العالم العربيّ والإسلاميّ،"], [4418.0, "معليش، أعتذر إليكم. لقد تعرّفنا في كلّيّاتٍ سابقةٍ على حكم المبتدع في الدنيا،"], [4427.0, "وهذه الكلّيّة تعرّفك على حكمه في الآخرة."], [4431.0, "ويختلف حكم المبتدع في الآخرة على حسب بدعته:"], [4435.8, "فإن مات مُصرًّا على بدعته فلا يخلو أمره من حالتين:"], [4441.0, "إمّا أن تكون من البدع المكفّرة،"], [4444.0, "فحينئذٍ يُعامل في الآخرة معاملةَ الكفرة،"], [4448.0, "فيدخل النار ابتداءً، ولا حظَّ له في شيءٍ من النعيم؛"], [4453.0, "فكما يدخلها الكافر كفرًا أصليًّا،"], [4456.5, "والمشرك شركًا أصليًّا، والمنافق نفاقًا اعتقاديًّا،"], [4462.0, "فكذلك يدخلها من ابتدع بدعةً مكفّرة؛ لأنه يموت كافرًا."]], "tr": [[4407.9, "Maşallah, görünen o ki bu, Arap ve İslam dünyasındaki en uzun ders!"], [4416.1, "Kusura bakmayın, sizden özür dilerim."], [4421.6, "Önceki külliyelerde bid'atçinin dünyadaki hükmünü öğrendik;"], [4424.6, "bu külliye de sana onun âhiretteki hükmünü öğretir."], [4429.3, "Bid'atçinin âhiretteki hükmü bid'atine göre farklılaşır."], [4432.2, "Bid'atinde ısrar ederek ölürse, durumu iki hâlden birinden boş değildir:"], [4437.1, "Ya (bid'ati) tekfir edici bid'atlerden olur;"], [4440.4, "bu durumda âhirette ona kâfirlere yapılan muamele yapılır:"], [4444.0, "Doğrudan (ilk baştan) cehenneme girer ve nimetten hiçbir payı olmaz."], [4449.5, "Aslî küfürle kâfir olan, aslî şirkle müşrik olan ve itikadî nifakla münafık olan oraya nasıl girerse, tekfir edici bir bid'at çıkaran da oraya öyle girer; çünkü kâfir olarak ölür."]]}, {"reader": false, "ar": [[4471.0, "وأمّا إذا كانت بدعتُه لا تُخرجه عن أصل الإيمان والإسلام،"], [4475.0, "فإننا نعتقد أنه يكون تحت مشيئة الله عز وجل،"], [4480.4, "كما يكون غيره من سائر العصاة؛"], [4484.0, "فإن شاء الله عز وجل غفر له بدعته وأدخله الجنة ابتداءً،"], [4491.0, "وإن شاء عذّبه في النار بقدر بدعته،"], [4499.0, "ثم يُخرجه إلى الجنة انتقالًا."], [4503.0, "فعلى حسب بدعته نحكم عليه في الآخرة:"], [4507.0, "بين مطلق العذاب أو العذاب المطلق."], [4512.0, "وآخر دعوانا أن الحمد لله ربّ العالمين،"], [4515.0, "وصلّى الله وسلّم على نبيّنا محمدٍ وعلى آله وصحبه أجمعين."]], "tr": [[4471.0, "Bid'ati onu imanın ve İslam'ın aslından çıkarmıyorsa, diğer bütün günahkârlar gibi onun da Allah Azze ve Celle'nin meşîetine (dilemesine) bağlı olduğuna inanırız."], [4481.0, "Allah Azze ve Celle dilerse onun bid'atini bağışlar ve onu doğrudan cennete sokar;"], [4489.1, "dilerse onu bid'ati ölçüsünde cehennemde azaplandırır, sonra onu (oradan) intikal yoluyla cennete çıkarır."], [4500.6, "Bid'atine göre âhirette onun hakkında, mutlak (bir miktar) azap ile tam (sonsuz) azap arasında hüküm veririz."], [4510.8, "Son duamız, âlemlerin Rabbi Allah'a hamd olsun."], [4514.6, "Allah, Peygamberimiz Muhammed'e, âline ve bütün ashâbına salât ve selam etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
