<script>
const D={"no": 22, "vid": "74xOQ346xE4", "title_ar": "الدرس (٢٢) من شرح كليات العقيدة — كليات العبادة والبدعة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 22. Ders: İbadet ve Bid'ate Dair Külliyeler (Tevhid, Tevkîf, İhdas, Taabbudî ve Örfî Tahsis)", "sections": [{"ts": "00:00", "title": "1. Külliye: Tevhidle birlikte olmayan her ibadet bâtıldır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.9, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.8, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.2, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [10.0, "أمّا بعد: سوف ننتقل في هذا الدرس ـ إن شاء الله ـ إلى الكلام على كلّيّات التعبُّد والبدعة،"], [19.3, "على كلّيّات العبادة والبدعة،"], [21.6, "بإذن الله عز وجل."], [24.0, "فنقول وبالله التوفيق، ومنه نستمدّ العونَ والفضل:"], [29.0, "<b>كلُّ عبادةٍ لا تكون مقرونةً بالتوحيد فباطلة.<\/b>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.9, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [11.0, "Bundan sonra: Bu derste Allah'ın izniyle taabbud ve bid'at külliyeleri, (yani) ibadet ve bid'at külliyeleri hakkında konuşmaya geçeceğiz, Allah Azze ve Celle'nin izniyle."], [24.0, "Tevfik Allah'tandır; yardımı ve lütfu O'ndan dileyerek deriz ki:"], [29.0, "<b>1. külliye: Tevhidle birlikte olmayan her ibadet bâtıldır.<\/b>"]]}, {"reader": false, "ar": [[36.0, "أقول وبالله التوفيق: وذلك لأنّ العبادة لا توصف بأنها عبادة إلا إذا كانت مبنيّةً على توحيدٍ صحيحٍ وإيمانٍ صحيح،"], [62.0, "كالصلاة: لا تسمّى صلاةً إلا إذا بُنيت على طهارةٍ صحيحة."], [69.0, "فكما أنّ الإنسان لو صلّى بلا طهارةٍ،"], [72.5, "أو فسدت طهارته أثناء صلاته،"], [75.3, "لوُصفت صلاته بأنها باطلة؛"], [78.0, "فكذلك العبادة إذا بُنيت على غير التوحيد فإنها تكون عبادةً باطلة."]], "tr": [[36.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [39.5, "İbadet, ancak sahih bir tevhid ve sahih bir iman üzerine bina edildiğinde ibadet diye nitelenir."], [62.7, "Tıpkı namaz gibi: Namaz ancak sahih bir taharet üzerine bina edildiğinde namaz diye adlandırılır."], [70.5, "İnsan tahâretsiz namaz kılsa ya da namaz esnasında tahâreti bozulsa, namazı bâtıl diye nitelenir;"], [78.0, "aynı şekilde ibadet de tevhidden başka bir şey üzerine bina edilirse bâtıl bir ibadet olur."]]}, {"reader": false, "ar": [[84.0, "وقد نصّ على هذه القاعدة أبو العباس ابنُ تيمية رحمه الله تعالى،"], [89.0, "فقال رحمه الله: «العبادة لا تسمّى عبادةً إلا مع التوحيد»."], [95.0, "انتهى كلامه. وبناءً على ذلك فكلُّ تعبُّدٍ يبنيه الإنسان على توحيدٍ فاسد فإنها توصف بأنها فاسدة؛"], [105.0, "وذلك لأنّ أهل السنة والجماعة ـ رحمهم الله تعالى ـ متّفقون على أنّ الله لا يقبل من العبادات إلا ما كان خالصًا لوجهه الكريم،"], [116.0, "على وَفق سنّة النبيّ الكريم صلى الله عليه وسلم."]], "tr": [[84.0, "Bu kaideyi Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— açıkça belirtmiş ve şöyle demiştir:"], [92.0, "\"İbadet ancak tevhidle birlikte ibadet diye adlandırılır.\" Sözü burada bitti."], [97.0, "Buna göre insanın fâsid bir tevhid üzerine bina ettiği her taabbud fâsid diye nitelenir."], [105.0, "Çünkü Ehl-i Sünnet ve'l-Cemaat —Allah onlara rahmet etsin— Allah'ın ibadetlerden ancak O'nun kerîm vechi için hâlis olanı ve kerîm Nebî ﷺ'in sünnetine uygun olanı kabul ettiği konusunda ittifak etmiştir."]]}, {"reader": false, "ar": [[119.0, "وعلى ذلك قولُ الله عز وجل:"], [122.0, "<span class=\"ayah\">﴿لَئِنْ أَشْرَكْتَ لَيَحْبَطَنَّ عَمَلُكَ﴾<\/span> <span class=\"ref\">[الزمر: ٦٥]<\/span>،"], [124.0, "فأحبط اللهُ عز وجل العملَ بفوات التوحيد."], [128.0, "وقال الله عز وجل:"], [130.0, "<span class=\"ayah\">﴿وَقَدِمْنَا إِلَىٰ مَا عَمِلُوا مِنْ عَمَلٍ فَجَعَلْنَاهُ هَبَاءً مَّنثُورًا﴾<\/span> <span class=\"ref\">[الفرقان: ٢٣]<\/span>،"], [134.0, "فأحبط الله عز وجل أعمالَهم لأنها لم تكن مقرونةً بالتوحيد الصحيح."], [142.0, "وقال الله عز وجل:"], [144.0, "<span class=\"ayah\">﴿وَلَوْ أَشْرَكُوا لَحَبِطَ عَنْهُم مَّا كَانُوا يَعْمَلُونَ﴾<\/span> <span class=\"ref\">[الأنعام: ٨٨]<\/span>،"], [148.0, "فأحبط أعمالَهم بسبب فوات التوحيد."]], "tr": [[119.0, "Allah Azze ve Celle'nin şu sözü buna delildir:"], [122.0, "<span class=\"ayah\">﴿Andolsun, eğer şirk koşarsan amelin boşa gider﴾<\/span> [Zümer 65]."], [124.6, "Allah Azze ve Celle, tevhidin yokluğu sebebiyle ameli boşa çıkarmıştır."], [128.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [130.0, "<span class=\"ayah\">﴿Onların yaptıkları her amele yöneldik de onu savrulmuş toz hâline getirdik﴾<\/span> [Furkân 23]."], [134.6, "Allah Azze ve Celle onların amellerini boşa çıkardı;"], [138.5, "çünkü sahih tevhidle birlikte değildi."], [142.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [144.0, "<span class=\"ayah\">﴿Eğer onlar şirk koşsalardı, yapmakta oldukları şeyler boşa giderdi﴾<\/span> [En'âm 88]."], [148.0, "Tevhidin yokluğu sebebiyle onların amellerini boşa çıkardı."]]}, {"reader": false, "ar": [[152.0, "وقال الله عز وجل:"], [154.5, "<span class=\"ayah\">﴿قُلْ هَلْ نُنَبِّئُكُم بِالْأَخْسَرِينَ أَعْمَالًا ۝ الَّذِينَ ضَلَّ سَعْيُهُمْ فِي الْحَيَاةِ الدُّنْيَا وَهُمْ يَحْسَبُونَ أَنَّهُمْ يُحْسِنُونَ صُنْعًا ۝ أُولَٰئِكَ الَّذِينَ كَفَرُوا بِآيَاتِ رَبِّهِمْ وَلِقَائِهِ فَحَبِطَتْ أَعْمَالُهُمْ فَلَا نُقِيمُ لَهُمْ يَوْمَ الْقِيَامَةِ وَزْنًا﴾<\/span> <span class=\"ref\">[الكهف: ١٠٣-١٠٥]<\/span>."], [173.3, "وقال الله عز وجل:"], [175.7, "<span class=\"ayah\">﴿وَمَن يَكْفُرْ بِالْإِيمَانِ فَقَدْ حَبِطَ عَمَلُهُ﴾<\/span> <span class=\"ref\">[المائدة: ٥]<\/span>."]], "tr": [[152.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [154.5, "<span class=\"ayah\">﴿De ki: Size amelleri bakımından en çok hüsrana uğrayanları haber vereyim mi? Onlar, iyi iş yaptıklarını sandıkları hâlde dünya hayatındaki çabaları boşa gitmiş kimselerdir. İşte onlar, Rablerinin ayetlerini ve O'na kavuşmayı inkâr eden kimselerdir. Bu yüzden amelleri boşa gitmiştir; kıyamet günü onlar için hiçbir tartı kurmayacağız﴾<\/span> [Kehf 103-105]."], [173.3, "Allah Azze ve Celle şöyle buyurmuştur:"], [175.7, "<span class=\"ayah\">﴿Kim imanı inkâr ederse, ameli boşa gider﴾<\/span> [Mâide 5]."]]}, {"reader": false, "ar": [[179.2, "وقال الله عز وجل مبيّنًا أهميةَ بناء التعبُّد على التوحيد،"], [185.1, "ومبيّنًا خسارةَ العامل بلا توحيد:"], [188.0, "<span class=\"ayah\">﴿مَّثَلُ الَّذِينَ كَفَرُوا بِرَبِّهِمْ ۖ أَعْمَالُهُمْ كَرَمَادٍ اشْتَدَّتْ بِهِ الرِّيحُ فِي يَوْمٍ عَاصِفٍ ۖ لَّا يَقْدِرُونَ مِمَّا كَسَبُوا عَلَىٰ شَيْءٍ ۚ ذَٰلِكَ هُوَ الضَّلَالُ الْبَعِيدُ﴾<\/span> <span class=\"ref\">[إبراهيم: ١٨]<\/span>."], [201.0, "ويقول الله عز وجل:"], [203.8, "<span class=\"ayah\">﴿وَالَّذِينَ كَفَرُوا أَعْمَالُهُمْ كَسَرَابٍ بِقِيعَةٍ يَحْسَبُهُ الظَّمْآنُ مَاءً حَتَّىٰ إِذَا جَاءَهُ لَمْ يَجِدْهُ شَيْئًا وَوَجَدَ اللَّهَ عِندَهُ فَوَفَّاهُ حِسَابَهُ ۗ وَاللَّهُ سَرِيعُ الْحِسَابِ﴾<\/span> <span class=\"ref\">[النور: ٣٩]<\/span>."]], "tr": [[179.2, "Allah Azze ve Celle, taabbudu tevhid üzerine bina etmenin önemini ve tevhidsiz amel edenin hüsranını açıklayarak şöyle buyurmuştur:"], [188.0, "<span class=\"ayah\">﴿Rablerini inkâr edenlerin amellerinin durumu, fırtınalı bir günde rüzgârın savurduğu küle benzer. Kazandıklarından hiçbir şeye güç yetiremezler. İşte bu, derin bir sapıklıktır﴾<\/span> [İbrâhîm 18]."], [199.0, "Allah Azze ve Celle şöyle buyurur:"], [201.0, "<span class=\"ayah\">﴿İnkâr edenlerin amelleri ise dümdüz bir arazideki serap gibidir. Susayan onu su sanır; nihayet yanına geldiğinde onu bir şey bulamaz, yanında Allah'ı bulur; O da onun hesabını tam olarak verir. Allah hesabı çabuk görendir﴾<\/span> [Nûr 39]."]]}, {"reader": false, "ar": [[217.0, "ويقول الله عز وجل:"], [220.0, "<span class=\"ayah\">﴿مَثَلُ مَا يُنفِقُونَ فِي هَٰذِهِ الْحَيَاةِ الدُّنْيَا كَمَثَلِ رِيحٍ فِيهَا صِرٌّ أَصَابَتْ حَرْثَ قَوْمٍ ظَلَمُوا أَنفُسَهُمْ فَأَهْلَكَتْهُ﴾<\/span> <span class=\"ref\">[آل عمران: ١١٧]<\/span>."], [230.0, "والآيات في هذا المعنى كثيرة."], [232.0, "فجميعُ التعبُّدات التي يبنيها الإنسان على توحيدٍ فاسد توصف بأنها فاسدة،"], [238.1, "ولا تنفع صاحبها يوم القيامة، ولا يؤجَر عليها."]], "tr": [[217.0, "Allah Azze ve Celle şöyle buyurur:"], [220.0, "<span class=\"ayah\">﴿Bu dünya hayatında harcadıklarının durumu, kendilerine zulmetmiş bir kavmin ekinine isabet edip onu helak eden, içinde dondurucu soğuk bulunan bir rüzgâra benzer﴾<\/span> [Âl-i İmrân 117]."], [232.0, "Bu anlamda ayetler çoktur. İnsanın fâsid bir tevhid üzerine bina ettiği bütün taabbudlar fâsid diye nitelenir;"], [238.1, "kıyamet günü sahibine fayda vermez ve onlardan dolayı ecir almaz."]]}]}, {"ts": "04:02", "title": "1. Külliye (devam): Kâfirin iyiliklerinin dünyadaki ve âhiretteki karşılığı", "paras": [{"reader": false, "ar": [[242.0, "فإن قلتَ: وهل هذا دليلٌ على أنّ الكافر لا يؤجَر على شيءٍ من الأعمال الصالحة؟"], [249.0, "فأقول: لا بدّ أن نفرّق بين أجره عليها في هذه الدنيا،"], [254.5, "وبين أجره عليها في الآخرة."], [257.0, "فالكافر قد يُطعَم بشيءٍ من الخير،"], [260.9, "أو من التوسعة في هذه الدنيا،"], [264.8, "على ما فعله من الحسنات؛"], [268.0, "وأمّا في الآخرة فليس له حسنة،"], [270.0, "ولا يؤجَر على شيءٍ من ذلك أبدًا؛"], [272.9, "لأنّ الله يجعلها هباءً منثورًا."]], "tr": [[242.0, "Şayet \"Bu, kâfirin sâlih amellerden hiçbirinden dolayı ecir almayacağına delil midir?\" dersen, derim ki:"], [249.0, "Onun bu amellerden dolayı bu dünyadaki ecri ile âhiretteki ecrini birbirinden ayırmamız gerekir."], [257.0, "Kâfir, yaptığı iyiliklerin karşılığında bu dünyada bir miktar hayırla ya da genişlikle rızıklandırılabilir."], [268.0, "Âhirette ise onun hiçbir iyiliği yoktur ve bunlardan hiçbiri için asla ecir almaz;"], [272.9, "çünkü Allah onları savrulmuş toz hâline getirir."]]}, {"reader": false, "ar": [[275.0, "ويدلّ على ذلك ما في صحيح الإمام مسلم من حديث أنسٍ رضي الله عنه قال:"], [282.4, "قال النبيّ صلى الله عليه وسلم:"], [284.7, "«إنّ الله لا يظلم مؤمنًا حسنةً، يُعطى بها في الدنيا ويُجزى بها في الآخرة، وأمّا الكافر فيُطعَم بحسنات ما عمل بها في الدنيا، حتى إذا أفضى إلى الآخرة لم تكن له حسنةٌ يُجزى بها»."], [303.0, "وهذا يدلّنا على أهمية التوحيد."]], "tr": [[275.0, "Buna delil, İmam Müslim'in Sahîh'inde Enes'ten —Allah ondan razı olsun— gelen hadistir;"], [284.7, "Nebî ﷺ şöyle buyurdu: \"Allah hiçbir mü'mine bir iyiliği hususunda zulmetmez;"], [291.4, "onun sebebiyle dünyada ona (nimet) verilir, âhirette de onunla mükâfatlandırılır."], [297.9, "Kâfir ise dünyada yaptığı iyilikler sebebiyle rızıklandırılır;"], [303.0, "nihayet âhirete vardığında, karşılığında mükâfatlandırılacağı bir iyiliği kalmaz.\" Bu da bize tevhidin önemini gösterir."]]}, {"reader": false, "ar": [[307.0, "فصلاةُ أهل الشرك باطلة،"], [309.5, "وزكواتُهم باطلة، وصدقاتُهم باطلة،"], [312.0, "وحجُّهم باطل، وعمرتُهم باطلة،"], [315.0, "وهكذا جميع ما فعلوه من الحسنات فإنه يوصف بأنه باطلٌ لفوات التوحيد."], [323.0, "فكلُّ عملٍ وكلُّ تعبُّدٍ لا يُبنى على التوحيد فإنه باطل."]], "tr": [[307.0, "Şirk ehlinin namazı bâtıldır, zekâtları bâtıldır, sadakaları bâtıldır, hacları bâtıldır, umreleri bâtıldır."], [315.0, "Yaptıkları bütün iyilikler de böyledir;"], [317.5, "tevhidin yokluğu sebebiyle bâtıl diye nitelenir."], [323.0, "Tevhid üzerine bina edilmeyen her amel ve her taabbud bâtıldır."]]}]}, {"ts": "05:27", "title": "2. Külliye: Bütün taabbud, aslı ve taalluklarıyla tevkîfîdir", "paras": [{"reader": false, "ar": [[327.0, "ومن الكلّيّات أيضًا: <b>كلُّ التعبُّد مبنيٌّ على التوقيف أصلًا ومتعلَّقًا.<\/b> وذلك لأنّ المتقرّر في القواعد أنّ ما كان غيبيًّا فإنه يكون توقيفيًّا،"], [349.0, "والعبادة مبناها على أمرٍ غيبيٍّ لا نطّلع عليه؛"], [355.0, "لأنّ العبادة اسمٌ جامعٌ لكلّ ما يحبّه الله عز وجل ويرضاه من الأقوال والأعمال الباطنة والظاهرة،"], [363.0, "وما يحبّه الله ويرضاه منها على وجه التفصيل غيرُ معلومٍ لعقولنا؛"], [369.0, "فاضطُرّت البشرية إلى إنزال الكتب وإلى إرسال الرسل لتعرّفهم على جزئيات هذا التعبُّد."]], "tr": [[327.0, "Külliyelerden biri de şudur: 2."], [329.0, "külliye: Bütün taabbud, aslı ve taallukları bakımından tevkîfe (nassa) dayanır. Bu şundandır:"], [340.1, "Kaidelerde yerleşik olan şudur: Gaybî olan şey tevkîfî olur."], [345.5, "İbadet de bizim muttali olamadığımız gaybî bir şeye dayanır."], [355.0, "Çünkü ibadet, Allah Azze ve Celle'nin sevdiği ve razı olduğu bâtınî ve zâhirî bütün söz ve amelleri kapsayan bir isimdir."], [363.5, "Allah'ın bunlardan tafsilatlı olarak neyi sevip neden razı olduğu akıllarımızca bilinmez."], [369.0, "Bu yüzden insanlık, bu taabbudun cüz'î meselelerini kendilerine tanıtmaları için kitapların indirilmesine ve peygamberlerin gönderilmesine muhtaç oldu."]]}, {"reader": false, "ar": [[376.0, "فبما أنّ التعبُّد مبناه على أمرٍ غيبيّ،"], [379.6, "فلا بدّ وأن يكون توقيفيًّا؛"], [381.8, "لأنّ ما كان غيبيًّا فيكون توقيفيًّا."], [385.0, "وإذا جعلنا أصلَ التعبُّد مبنيًّا على التوقيف،"], [395.0, "فإننا نجعله توقيفيًّا باعتبار متعلَّقاته كذلك؛"], [400.0, "لأنّ المتقرّر في القواعد أنّ متعلَّقات الشيء لها حكمُ أصله،"], [405.0, "فما كان أصله توقيفيًّا فإنّ متعلَّقاته تعتبر توقيفية،"], [410.0, "كما أنّ الشيء إذا كان أصله عرفيًّا فإنّ متعلَّقاته تكون عرفية."]], "tr": [[376.0, "Taabbud gaybî bir şeye dayandığına göre tevkîfî olması zorunludur;"], [379.6, "çünkü gaybî olan şey tevkîfî olur."], [381.8, "Taabbudun aslını tevkîfe dayalı kabul ettiğimizde, taallukları itibarıyla da onu tevkîfî kabul ederiz."], [395.0, "Çünkü kaidelerde yerleşik olan şudur:"], [400.0, "Bir şeyin taallukları, aslının hükmünü alır."], [403.5, "Aslı tevkîfî olanın taallukları da tevkîfî sayılır;"], [408.8, "nitekim bir şeyin aslı örfî ise taallukları da örfî olur."]]}, {"reader": false, "ar": [[417.0, "وبناءً على ذلك: فأصلُ العبادة توقيفيّ،"], [424.0, "وسببيّةُ التعبُّد توقيفية، ومقدارُ التعبُّد توقيفيّ،"], [432.0, "وزمانُ التعبُّد توقيفيّ، ومكانُ التعبُّد توقيفيّ،"], [439.0, "وواجباتُ التعبُّد توقيفية، وأركانُ التعبُّد توقيفية،"], [445.0, "وسننُ التعبُّد توقيفية، ومكروهاتُ التعبُّد توقيفية،"], [451.0, "ومبطلاتُ التعبُّد توقيفية، وعزائمُ التعبُّد ورخصُه توقيفية."], [457.7, "وجميع متعلَّقات الشيء التوقيفيّ لا بدّ أن تصفها بأنها توقيفيةٌ على النصّ."]], "tr": [[417.0, "Buna göre: İbadetin aslı tevkîfîdir, taabbudun sebebi tevkîfîdir, taabbudun miktarı tevkîfîdir, taabbudun zamanı tevkîfîdir, taabbudun mekânı tevkîfîdir, taabbudun vacipleri tevkîfîdir, taabbudun rükünleri tevkîfîdir, taabbudun sünnetleri tevkîfîdir, taabbudun mekruhları tevkîfîdir, taabbudu bozan şeyler tevkîfîdir, taabbudun azîmetleri ve ruhsatları tevkîfîdir."], [457.7, "Tevkîfî olan bir şeyin bütün taalluklarını nassa bağlı tevkîfî olarak nitelemen gerekir."]]}, {"reader": false, "ar": [[466.0, "فلا يجوز للإنسان أن يُحدث شيئًا من التعبُّدات،"], [471.1, "لا باعتبار أصلها ولا باعتبار متعلَّقها،"], [475.0, "وعلى ذلك أجمع أهل العلم رحمهم الله تعالى في الجملة."], [479.0, "وعليه قولُ الله عز وجل:"], [481.4, "<span class=\"ayah\">﴿أَمْ لَهُمْ شُرَكَاءُ شَرَعُوا لَهُم مِّنَ الدِّينِ مَا لَمْ يَأْذَن بِهِ اللَّهُ﴾<\/span> <span class=\"ref\">[الشورى: ٢١]<\/span>."], [487.0, "وقال الله عز وجل:"], [488.7, "<span class=\"ayah\">﴿قُلْ أَرَأَيْتُم مَّا أَنزَلَ اللَّهُ لَكُم مِّن رِّزْقٍ فَجَعَلْتُم مِّنْهُ حَرَامًا وَحَلَالًا قُلْ آللَّهُ أَذِنَ لَكُمْ ۖ أَمْ عَلَى اللَّهِ تَفْتَرُونَ﴾<\/span> <span class=\"ref\">[يونس: ٥٩]<\/span>،"], [500.0, "والمراد بالإذن هنا: أي الإذن الشرعي."]], "tr": [[466.0, "İnsanın, ne asılları ne de taallukları itibarıyla taabbudlardan herhangi bir şeyi ihdas etmesi caiz değildir."], [474.4, "İlim ehli —Allah onlara rahmet etsin— genel olarak bunun üzerinde icmâ etmiştir."], [479.0, "Allah Azze ve Celle'nin şu sözü buna delildir:"], [481.4, "<span class=\"ayah\">﴿Yoksa onların, Allah'ın izin vermediği şeyleri dinden kendilerine şeriat kılan ortakları mı var?﴾<\/span> [Şûrâ 21]."], [487.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [488.7, "<span class=\"ayah\">﴿De ki: Allah'ın size indirdiği rızkı gördünüz mü? Siz ondan bir kısmını haram, bir kısmını helal kıldınız. De ki: Allah mı size izin verdi, yoksa Allah'a iftira mı ediyorsunuz?﴾<\/span> [Yûnus 59]."], [502.0, "Buradaki izinden kasıt şer'î izindir."]]}, {"reader": false, "ar": [[504.0, "وعلى ذلك قولُ النبيّ صلى الله عليه وسلم:"], [509.0, "«من أحدث في أمرنا هذا ما ليس منه فهو ردّ»،"], [513.0, "وقولُ النبيّ صلى الله عليه وسلم:"], [516.0, "«من عمل عملًا ليس عليه أمرُنا فهو ردّ»،"], [520.0, "وقولُه عليه الصلاة والسلام:"], [523.0, "«وإيّاكم ومحدثاتِ الأمور، فإنّ كلَّ محدثةٍ بدعة، وكلَّ بدعةٍ ضلالة»."], [529.0, "فجميع ما يتعلّق بأمر التعبُّد لا بدّ وأن يُبنى على التوقيف،"], [534.0, "وهذا أصلُ الأصول في باب التعبُّدات."], [539.0, "هذا أصلُ الأصول في باب التعبُّدات."]], "tr": [[504.0, "Nebî ﷺ'in şu sözü de buna delildir:"], [509.0, "\"Kim bizim bu işimizde (dinimizde) ondan olmayan bir şey ihdas ederse, o reddedilmiştir.\" Nebî ﷺ'in şu sözü de:"], [516.0, "\"Kim bizim işimizin (dinimizin) üzerinde olmadığı bir amel işlerse, o reddedilmiştir.\" Ve (Nebî) aleyhissalâtu vesselâmın şu sözü:"], [523.0, "\"Sonradan çıkarılan işlerden sakının; çünkü sonradan çıkarılan her şey bid'attir ve her bid'at dalâlettir.\" Taabbudla ilgili her şeyin tevkîf üzerine bina edilmesi gerekir."], [534.8, "Bu, taabbudlar babında asılların aslıdır."], [539.0, "Bu, taabbudlar babında asılların aslıdır."]]}]}, {"ts": "09:02", "title": "3. Külliye: Dinde yapılan her ihdas reddedilmiştir", "paras": [{"reader": false, "ar": [[542.0, "ومن الكلّيّات أيضًا، ومن الكلّيّات أيضًا:"], [550.0, "<b>كلُّ إحداثٍ في الدين فهو ردّ.<\/b> ومعنى ذلك:"], [564.5, "أي مردودٌ على صاحبه غيرُ مقبول؛"], [569.0, "وذلك لأنّ الله عز وجل إنما يقبل من العبادات ما كان خالصًا صوابًا،"], [575.0, "والخالص ما كان لله،"], [576.6, "والصواب ما كان على وَفق سنّة النبيّ صلى الله عليه وسلم."]], "tr": [[542.0, "Külliyelerden biri de, külliyelerden biri de şudur:"], [550.0, "<b>3. külliye: Dinde yapılan her ihdas reddedilmiştir.<\/b> Bunun anlamı şudur:"], [565.2, "Sahibinin yüzüne çarpılır, kabul edilmez."], [569.0, "Bu şundandır: Allah Azze ve Celle ibadetlerden ancak hâlis ve doğru (savâb) olanı kabul eder."], [576.2, "Hâlis, Allah için olandır; doğru ise Nebî ﷺ'in sünnetine uygun olandır."]]}, {"reader": false, "ar": [[581.0, "فإذا اختلّ الأمران فالعبادة مردودة،"], [585.0, "وإذا وُجد الإخلاص وفُقدت المتابعة فالعبادة مردودة،"], [589.0, "وإذا وُجدت المتابعة وانتفى الإخلاص فالعبادة أيضًا مردودة."], [594.0, "فلا يقبل الله عز وجل من التعبُّدات إلا ما كان خالصًا صوابًا،"], [598.0, "والصواب ما كان على وَفق سنّة النبيّ صلى الله عليه وسلم."]], "tr": [[581.0, "İki şart birden bozulursa ibadet reddedilir."], [585.0, "İhlâs bulunur da mütâbaat (Sünnet'e uyma) bulunmazsa ibadet reddedilir."], [589.6, "Mütâbaat bulunur da ihlâs bulunmazsa ibadet yine reddedilir."], [594.0, "Allah Azze ve Celle taabbudlardan ancak hâlis ve doğru olanı kabul eder;"], [598.9, "doğru ise Nebî ﷺ'in sünnetine uygun olandır."]]}, {"reader": false, "ar": [[603.0, "ويؤكّد هذا ما في الصحيحين من حديث عائشة رضي الله عنها قالت:"], [609.0, "قال النبيّ صلى الله عليه وسلم:"], [610.9, "«من أحدث في أمرنا هذا ما ليس منه فهو ردّ»."], [614.0, "وقوله صلى الله عليه وسلم:"], [617.3, "«ما ليس»: هذه صيغةٌ من صيغ العموم،"], [622.0, "أي: الذي ليس؛ والمتقرّر في قواعد الأصول أنّ الأسماء الموصولة من صيغ العموم."], [630.0, "وهذا يدخل فيه الإحداثُ في أصل التعبُّد والإحداثُ في متعلَّقاته؛"], [635.0, "لوجوب بقاء العموم على عمومه،"], [637.5, "ولا يجوز تخصيصه إلا بدليل."]], "tr": [[603.0, "Bunu, Sahîhayn'da Âişe'den —Allah ondan razı olsun— gelen hadis teyit eder;"], [609.0, "dedi ki: Nebî ﷺ şöyle buyurdu:"], [610.9, "\"Kim bizim bu işimizde ondan olmayan bir şey ihdas ederse, o reddedilmiştir.\" Nebî ﷺ'in \"ondan olmayan (mâ leyse)\" sözü umum sîgalarından biridir;"], [622.6, "yani \"ondan olmayan şey\". Usûl kaidelerinde yerleşik olan şudur:"], [628.2, "İsm-i mevsûller umum sîgalarındandır. Taabbudun aslında ihdas da taalluklarında ihdas da buna girer;"], [635.0, "çünkü umumun umumiliği üzere kalması vaciptir ve ancak bir delille tahsis edilebilir."]]}, {"reader": false, "ar": [[640.0, "وبناءً على ذلك فيكون معنى الحديث:"], [643.7, "من أحدث في أمرنا هذا ما ليس منه باعتبار أصله،"], [650.0, "ما ليس منه باعتبار جنسه،"], [653.1, "ما ليس منه باعتبار زمانه،"], [656.2, "ما ليس منه باعتبار مكانه،"], [659.4, "وما ليس منه باعتبار مقداره،"], [662.5, "وما ليس منه باعتبار صفته،"], [666.0, "وهكذا دواليك في جميع الأمور التي ذكرتُها في شرح متعلَّقات التعبُّد."]], "tr": [[640.0, "Buna göre hadisin anlamı şöyle olur:"], [643.7, "Kim bizim bu işimizde aslı itibarıyla ondan olmayanı, cinsi itibarıyla ondan olmayanı, zamanı itibarıyla ondan olmayanı, mekânı itibarıyla ondan olmayanı, miktarı itibarıyla ondan olmayanı ve sıfatı itibarıyla ondan olmayanı ihdas ederse… Taabbudun taalluklarını şerh ederken zikrettiğim bütün hususlarda da bu böyle devam eder."]]}, {"reader": false, "ar": [[672.0, "فجميعُ من أحدث في أمر الدين ما ليس منه ـ أيًّا كان نوعُ إحداثه وموضعُه ـ سواءٌ كان أحدث تعبُّدًا جديدًا لا أصل له،"], [683.0, "أو جاء إلى تعبُّدٍ مشروعٍ باعتبار أصله وأضاف إليه أشياء من الأوصاف البدعية التي لا أصل لها في الشرع،"], [694.0, "فكلُّ ذلك موصوفٌ عندنا بأنه ردّ."], [698.0, "وبناءً على ذلك فلا مدخل للاجتهاد في إثبات التعبُّدات؛"], [703.0, "في إثبات التعبُّدات لا يجوز للإنسان أن يجتهد فيها أبدًا،"], [708.0, "وإنما مبناها على ثبوت النصّ الصحيح الصريح، فانتبهوا لهذا."]], "tr": [[672.0, "Din işinde ondan olmayan bir şeyi ihdas eden herkes —ihdasının türü ve yeri ne olursa olsun—, ister aslı olmayan yeni bir taabbud ihdas etmiş olsun, ister aslı itibarıyla meşru olan bir taabbuda gelip ona şeriatte aslı olmayan bid'at niteliklerden bazı şeyler eklemiş olsun, bunların hepsi bize göre \"reddedilmiş\" diye nitelenir."], [698.0, "Buna göre taabbudları isbat etmede içtihadın bir yeri yoktur;"], [703.0, "taabbudları isbat etmede insanın asla içtihad etmesi caiz değildir."], [707.0, "Onlar ancak sahih ve sarih nassın sübûtuna dayanır. Buna dikkat edin."]]}, {"reader": false, "ar": [[715.0, "وعلى ذلك قولُ النبيّ صلى الله عليه وسلم:"], [718.0, "«أمّا بعد، فإنّ أصدقَ الحديث كتابُ الله، وخيرَ الهدي هديُ محمدٍ صلى الله عليه وسلم، وشرَّ الأمور محدثاتُها، وكلَّ بدعةٍ ضلالة»."]], "tr": [[715.0, "Nebî ﷺ'in şu sözü de buna delildir:"], [717.6, "\"Bundan sonra: Sözlerin en doğrusu Allah'ın Kitabı'dır, yolların en hayırlısı Muhammed ﷺ'in yoludur, işlerin en kötüsü sonradan çıkarılanlardır ve her bid'at dalâlettir.\""]]}]}, {"ts": "12:12", "title": "3. Külliye (devam): İhdası yasaklayan ve Sünnet'e uymayı emreden deliller", "paras": [{"reader": false, "ar": [[732.0, "والأدلة في تحريم الإحداث كثيرةٌ جدًّا؛"], [736.0, "فالأدلة التي تنهى عن الإحداث والابتداع وتأمر بالسنّة والاتّباع كثيرةٌ جدًّا."], [744.0, "منها مثلًا: ما في صحيح البخاري من حديث ابن عباسٍ رضي الله عنهما قال:"], [752.4, "قال النبيّ صلى الله عليه وسلم:"], [754.9, "«أبغضُ الناس إلى الله ثلاثة: ملحدٌ في الحرم، ومبتغٍ في الإسلام سنّةَ الجاهلية» ـ وسنّة الجاهلية هي الإحداث في الدين ـ «ومُطَّلِبُ دمِ امرئٍ بغير حقٍّ ليُهريقَ دمَه»."]], "tr": [[732.0, "İhdasın haramlığına dair deliller pek çoktur;"], [736.0, "ihdas ve ibtidâı (bid'at çıkarmayı) yasaklayan, Sünnet'i ve ittibâı emreden deliller pek çoktur."], [744.0, "Bunlardan biri, örneğin Buhârî'nin Sahîh'inde İbn Abbâs'tan —Allah ikisinden de razı olsun— gelen hadistir;"], [752.4, "dedi ki: Nebî ﷺ şöyle buyurdu:"], [754.9, "\"İnsanların Allah'a en sevimsiz olanı üç kişidir:"], [757.0, "Harem'de ilhad eden (haktan sapan), İslam'da Câhiliye sünnetini arayan\" —Câhiliye sünneti, dinde ihdastır— \"ve kanını akıtmak için haksız yere bir kişinin kanının peşine düşen.\""]]}, {"reader": false, "ar": [[769.0, "وفي صحيح الإمام البخاري من حديث أبي هريرة رضي الله عنه قال:"], [774.4, "قال النبيّ صلى الله عليه وسلم:"], [777.0, "«كلُّ أمّتي يدخلون الجنة إلا من أبى»،"], [780.0, "قالوا: ومن يأبى يا رسول الله؟"], [783.0, "قال: «من أطاعني دخل الجنة، ومن عصاني فقد أبى»."]], "tr": [[769.0, "İmam Buhârî'nin Sahîh'inde Ebû Hüreyre'den —Allah ondan razı olsun— gelen hadiste şöyle dedi:"], [774.4, "Nebî ﷺ şöyle buyurdu: \"Ümmetimin hepsi cennete girer, ancak yüz çeviren hariç.\" \"Ey Allah'ın Resûlü, yüz çeviren kimdir?\" dediler."], [783.0, "Buyurdu ki: \"Bana itaat eden cennete girer, bana isyan eden ise yüz çevirmiştir.\""]]}, {"reader": false, "ar": [[788.0, "وفي صحيح الإمام البخاري من حديث جابرٍ رضي الله عنه قال:"], [795.5, "«جاءت ملائكةٌ إلى النبيّ صلى الله عليه وسلم وهو نائم، فقالوا: إنّ لصاحبكم هذا مثلًا فاضربوا له مثلًا، قال بعضهم: إنه نائم، وقال بعضهم: إنّ العين نائمةٌ والقلبَ يقظان. فقالوا: مثلُه كمثل رجلٍ بنى دارًا، وجعل فيها مأدبةً، وبعث داعيًا؛ فمن أجاب الداعيَ دخل الدار وأكل من المأدبة، ومن لم يُجب الداعيَ لم يدخل الدار ولم يأكل من المأدبة."]], "tr": [[788.0, "İmam Buhârî'nin Sahîh'inde Câbir'den —Allah ondan razı olsun— gelen hadiste şöyle dedi:"], [795.5, "\"Nebî ﷺ uyurken ona melekler geldi."], [798.3, "'Bu arkadaşınızın bir misali var, ona bir misal getirin' dediler."], [803.5, "Bazıları 'O uyuyor' dedi, bazıları da 'Göz uyur ama kalp uyanıktır' dedi."], [809.4, "Dediler ki: 'Onun misali, bir ev yapan, içinde bir ziyafet sofrası hazırlayan ve bir davetçi gönderen adamın misali gibidir."], [821.5, "Davetçiye icabet eden eve girer ve sofradan yer;"], [825.4, "davetçiye icabet etmeyen eve giremez ve sofradan yiyemez.'"]]}, {"reader": false, "ar": [[829.0, "فقالوا: أوِّلوها له يفقهها،"], [832.0, "قال بعضهم: إنه نائم،"], [834.0, "وقال بعضهم: إنّ العين نائمةٌ والقلبَ يقظان."], [838.0, "فقالوا: الدار الجنة، والداعي محمدٌ صلى الله عليه وسلم،"], [844.0, "فمن أطاع محمدًا فقد أطاع الله،"], [848.0, "ومن عصى محمدًا فقد عصى الله،"], [851.0, "ومحمدٌ فَرْقٌ بين الناس»."]], "tr": [[829.0, "'Onu kendisine yorumlayın ki anlasın' dediler."], [831.2, "Bazıları 'O uyuyor' dedi, bazıları da 'Göz uyur ama kalp uyanıktır' dedi."], [835.1, "Dediler ki: 'Ev cennettir, davetçi Muhammed'dir ﷺ."], [838.0, "Kim Muhammed'e itaat ederse Allah'a itaat etmiş olur;"], [843.5, "kim Muhammed'e isyan ederse Allah'a isyan etmiş olur."], [848.5, "Muhammed, insanları (iyi ile kötü diye) ayıran bir ölçüdür.'\""]]}, {"reader": false, "ar": [[854.0, "وفي الصحيحين من حديث أبي موسى الأشعريّ رضي الله عنه قال:"], [858.3, "قال النبيّ صلى الله عليه وسلم:"], [860.0, "«إنما مثلي ومثلُكم كمثل رجلٍ أتى قومًا فقال: يا قوم، إني رأيتُ الجيش بعينيّ، وأنا النذيرُ العريان؛ فأطاعه طائفةٌ من قومه فأدلجوا، فانطلقوا على مَهَلِهم فنجَوا، وكذّب طائفةٌ من قومه فأصبحوا مكانهم، فصبّحهم الجيش فأهلكهم واجتاحهم؛ فذلك مثلُ من أطاعني وصدّق ما جئتُ به، ومثلُ من عصاني وكذّب ما جئتُ به من الحق»."]], "tr": [[854.0, "Sahîhayn'da Ebû Mûsâ el-Eş'arî'den —Allah ondan razı olsun— gelen hadiste şöyle dedi:"], [856.0, "Nebî ﷺ şöyle buyurdu: \"Benim ve sizin misaliniz, bir kavme gelip 'Ey kavmim!"], [858.3, "Ben orduyu kendi gözlerimle gördüm;"], [858.9, "ben (elbisesini sallayarak uyaran) çıplak uyarıcıyım' diyen adamın misali gibidir."], [859.5, "Kavminden bir grup ona itaat etti, gece yola koyuldular, ağır ağır gidip kurtuldular."], [860.0, "Kavminden bir grup da onu yalanladı ve yerlerinde sabahladılar;"], [871.3, "ordu sabahleyin üzerlerine baskın yaptı, onları helak edip kökünü kazıdı."], [882.7, "İşte bu, bana itaat edip getirdiğimi tasdik edenin misali ile bana isyan edip getirdiğim hakkı yalanlayanın misalidir.\""]]}, {"reader": false, "ar": [[899.0, "وفي الصحيحين من حديث أبي هريرة رضي الله عنه قال:"], [903.6, "قال النبيّ صلى الله عليه وسلم:"], [907.0, "«مثلي ومثلُكم كمثل رجلٍ استوقد نارًا، فلمّا أضاءت ما حوله جعل الفَراشُ وهذه الدوابُّ التي يقعن في النار يقعن فيها، وجعل يحجزهنّ فيغلبنه فيتقحّمن فيها؛ فأنا آخذٌ بحُجَزكم عن النار: هلمّ عن النار، هلمّ عن النار، فتغلبوني تقحّمون فيها»."]], "tr": [[899.0, "Sahîhayn'da Ebû Hüreyre'den —Allah ondan razı olsun— gelen hadiste şöyle dedi:"], [900.8, "Nebî ﷺ şöyle buyurdu: \"Benim ve sizin misaliniz, ateş yakan bir adamın misali gibidir."], [903.6, "Ateş etrafını aydınlatınca pervaneler ve ateşe düşen şu böcekler içine düşmeye başladı."], [907.0, "Adam onları engellemeye çalışıyor, onlar ise ona galip gelip ateşe dalıyorlar."], [916.4, "İşte ben de sizi ateşten belinizden tutup çekiyorum:"], [921.4, "'Ateşten uzak durun, ateşten uzak durun!' Siz ise bana galip gelip içine dalıyorsunuz.\""]]}, {"reader": false, "ar": [[936.0, "وتعرفون ما في الصحيحين من حديث أنسٍ رضي الله عنه قال:"], [940.4, "«جاء ثلاثةُ رهطٍ إلى بيوت أزواج النبيّ صلى الله عليه وسلم يسألون عن عبادته، فلمّا أُخبروا بها فكأنّهم تقالّوها، فقالوا: أين نحن من رسول الله صلى الله عليه وسلم؟ فإنّ الله قد غفر له ما تقدّم من ذنبه وما تأخّر. فقال بعضهم: أمّا أنا فأصلّي الليل أبدًا ولا أنام، وقال الآخر: وأنا أصوم الدهر أبدًا ولا أفطر، وقال الثالث: وأنا أعتزل النساء أبدًا فلا أتزوّج."]], "tr": [[936.0, "Sahîhayn'da Enes'ten —Allah ondan razı olsun— gelen hadisi bilirsiniz;"], [939.6, "dedi ki: \"Üç kişilik bir grup, Nebî ﷺ'in ibadetini sormak için hanımlarının evlerine geldi."], [946.2, "Kendilerine haber verilince onu az görür gibi oldular ve 'Biz Resûlullah ﷺ'in neresindeyiz!"], [953.2, "Allah onun geçmiş ve gelecek günahlarını bağışlamıştır' dediler."], [957.2, "Biri 'Ben geceyi hep namazla geçireceğim, uyumayacağım' dedi."], [961.2, "Diğeri 'Ben de ömür boyu oruç tutacağım, hiç bozmayacağım' dedi."], [967.8, "Üçüncüsü 'Ben de kadınlardan hep uzak duracağım, evlenmeyeceğim' dedi."]]}, {"reader": false, "ar": [[974.0, "فجاء إليهم النبيّ صلى الله عليه وسلم فقال:"], [977.2, "أنتم الذين قلتم كذا وكذا؟"], [979.2, "قالوا: نعم، قال: أمَا والله إني لأخشاكم لله وأتقاكم له،"], [983.0, "ولكنّي أصلّي وأنام، وأصوم وأفطر،"], [986.7, "وأتزوّج النساء، فمن رغب عن سنّتي فليس منّي»."], [993.0, "والرغبة عن السنّة هو الإحداث فيها،"], [996.0, "والإحداث هو حقيقة الإحداث في الدين."]], "tr": [[974.0, "Nebî ﷺ yanlarına geldi ve 'Şöyle şöyle diyenler sizler misiniz?' dedi."], [977.2, "'Evet' dediler. Buyurdu ki: 'Dikkat edin!"], [979.2, "Allah'a yemin ederim ki ben Allah'tan en çok korkanınız ve O'na karşı en takvalı olanınızım."], [984.5, "Fakat ben namaz kılarım ve uyurum, oruç tutarım ve açarım, kadınlarla da evlenirim."], [993.0, "Kim benim sünnetimden yüz çevirirse benden değildir.'\" Sünnetten yüz çevirmek, onda ihdas etmektir;"], [996.3, "bu ihdas da dinde ihdasın ta kendisidir."]]}, {"reader": false, "ar": [[998.0, "وفي الصحيحين من حديث عائشة رضي الله عنها قالت:"], [1003.0, "«صنع النبيّ صلى الله عليه وسلم أمرًا فرخّص فيه، فتنزّه عنه قوم، فبلغ ذلك النبيَّ صلى الله عليه وسلم فغضب، فحمد الله وأثنى عليه ثم قال» ـ أو:"], [1017.0, "«فخطب فحمد الله وأثنى عليه ثم قال ـ: أمّا بعد، فما بالُ أقوامٍ يتنزّهون عن الشيء أصنعه؟! أمَا والله إني لأعلمُهم بالله وأشدُّهم له خشيةً»."]], "tr": [[998.0, "Sahîhayn'da Âişe'den —Allah ondan razı olsun— gelen hadiste şöyle dedi:"], [1000.2, "\"Nebî ﷺ bir şey yaptı ve ona ruhsat verdi."], [1003.0, "Bir topluluk ondan uzak durdu (onu yapmaktan kaçındı)."], [1008.0, "Bu, Nebî ﷺ'e ulaştı, öfkelendi;"], [1011.3, "Allah'a hamd ve senâ etti, sonra dedi ki\" —ya da:"], [1017.0, "\"hutbe okudu, Allah'a hamd ve senâ etti, sonra dedi ki—:"], [1019.6, "'Bundan sonra: Benim yaptığım bir şeyden uzak duran bazı kimselere ne oluyor?!"], [1024.0, "Dikkat edin! Allah'a yemin ederim ki ben onların Allah'ı en iyi bileni ve O'ndan en çok korkanıyım.'\""]]}]}, {"ts": "17:12", "title": "3. Külliye (devam): \"Koltuğuna yaslanan\" hadisleri ve bid'atten sakındıran nasslar", "paras": [{"reader": false, "ar": [[1032.0, "وأخرج أبو داود في سننه بإسنادٍ صحيحٍ لغيره من حديث أبي رافعٍ رضي الله عنه قال:"], [1040.4, "قال النبيّ صلى الله عليه وسلم:"], [1043.0, "«لا أُلفينَّ أحدَكم متّكئًا على أريكته، يأتيه الأمرُ من أمري ممّا أمرتُ به أو نهيتُ عنه، فيقول: لا ندري، ما وجدنا في كتاب الله اتّبعنا»."]], "tr": [[1032.0, "Ebû Dâvûd Sünen'inde, li-gayrihî sahih bir isnadla Ebû Râfi'den —Allah ondan razı olsun— şunu rivayet etmiştir;"], [1040.4, "dedi ki: Nebî ﷺ şöyle buyurdu:"], [1043.0, "\"Sizden birinizi koltuğuna yaslanmış hâlde, emrettiğim ya da yasakladığım işlerimden biri kendisine geldiğinde 'Bilmeyiz;"], [1051.6, "Allah'ın Kitabı'nda ne bulduysak ona uyarız' derken görmeyeyim.\""]]}, {"reader": false, "ar": [[1057.0, "وعند أبي داود بإسنادٍ صحيحٍ لغيره من حديث المقدام بن معديكرب رضي الله عنه قال:"], [1063.4, "قال النبيّ صلى الله عليه وسلم:"], [1066.0, "«ألا وإنّي أوتيتُ القرآنَ ومثلَه معه، ألا يوشك رجلٌ شبعانُ متّكئٌ على أريكته يقول: عليكم بهذا القرآن، فما وجدتم فيه من حلالٍ فأحِلّوه، وما وجدتم فيه من حرامٍ فحرِّموه؛ ألا وإنما حرّم رسولُ الله كما حرّم الله. ألا لا يحلّ لكم الحمارُ الأهليّ، ولا كلُّ ذي نابٍ من السباع، ولا اللُّقَطةُ من مال مُعاهَدٍ إلا أن يستغني عنها، ومن نزل بقومٍ فليَقْروه، فإن لم يَقْروه فله أن يُعقِبهم بقدر قِراه»."]], "tr": [[1057.0, "Yine Ebû Dâvûd'da li-gayrihî sahih bir isnadla Mikdâm b."], [1059.8, "Ma'dîkerib'den —Allah ondan razı olsun— rivayet edildi;"], [1062.6, "dedi ki: Nebî ﷺ şöyle buyurdu:"], [1064.7, "\"Dikkat edin! Bana Kur'an ve onunla birlikte onun bir benzeri verildi."], [1071.0, "Dikkat edin! Karnı tok, koltuğuna yaslanmış bir adamın şöyle demesi yakındır:"], [1078.5, "'Şu Kur'an'a sarılın; onda helal bulduğunuzu helal, haram bulduğunuzu haram sayın.' Dikkat edin!"], [1085.3, "Resûlullah'ın haram kıldığı da Allah'ın haram kıldığı gibidir."], [1089.5, "Dikkat edin! Ehlî eşek size helal değildir, yırtıcılardan azı dişi olan hiçbir hayvan da (helal değildir), ahid sahibi (zimmî) birinin malından bulunmuş eşya da —sahibi ondan müstağni olmadıkça— (helal değildir)."], [1102.0, "Kim bir kavmin yanına konuk olursa onu ağırlasınlar;"], [1106.4, "ağırlamazlarsa, ağırlanma hakkı kadarını onlardan almaya hakkı vardır.\""]]}, {"reader": false, "ar": [[1109.0, "وأخرج أبو داود في سننه بإسنادٍ حسنٍ من حديث العرباض بن سارية رضي الله عنه قال:"], [1116.3, "قال النبيّ صلى الله عليه وسلم:"], [1118.0, "«أيحسبُ أحدُكم متّكئًا على أريكته أنّ الله لم يحرّم شيئًا إلا ما في هذا القرآن؟! ألا وإنّي أمرتُ ووعظتُ ونهيتُ عن أشياء، إنها لَمثلُ القرآن بل أكثر. ألا إنّ الله لم يُحلّ لكم أن تدخلوا بيوتَ أهل الكتاب إلا بإذن، ولا ضربَ نسائهم، ولا أكلَ طعامهم، إذا أعطَوكم الذي عليهم»."]], "tr": [[1109.0, "Ebû Dâvûd Sünen'inde hasen bir isnadla İrbâd b."], [1111.3, "Sâriye'den —Allah ondan razı olsun— şunu rivayet etmiştir;"], [1114.1, "dedi ki: Nebî ﷺ şöyle buyurdu:"], [1116.3, "\"Sizden biri koltuğuna yaslanmış hâlde, Allah'ın ancak bu Kur'an'da olanı haram kıldığını mı sanıyor?!"], [1118.0, "Dikkat edin! Ben emrettim, öğüt verdim ve birtakım şeyleri yasakladım;"], [1124.1, "bunlar Kur'an kadardır, hatta daha fazladır."], [1129.0, "Dikkat edin! Allah, üzerlerine düşeni (cizyeyi) size verdikleri takdirde, Ehl-i Kitab'ın evlerine izinsiz girmenizi, kadınlarını dövmenizi ve yiyeceklerini yemenizi size helal kılmamıştır.\""]]}, {"reader": false, "ar": [[1144.0, "وأخرج الإمام أحمد في مسنده،"], [1146.1, "وأبو داود في سننه بإسنادٍ صحيحٍ من حديث العرباض قال:"], [1150.4, "«صلّى بنا رسولُ الله صلى الله عليه وسلم ذات يومٍ، فأقبل علينا بوجهه، فوعظنا موعظةً بليغةً ذرفت منها العيون ووجلت منها القلوب، فقال رجل: يا رسول الله، كأنها موعظةُ مودِّعٍ فأوصِنا، فقال: أوصيكم بتقوى الله، والسمعِ والطاعة وإن كان عبدًا حبشيًّا؛ فإنه من يعِش منكم فسيرى اختلافًا كثيرًا، فعليكم بسنّتي وسنّة الخلفاء الراشدين المهديّين، تمسّكوا بها وعَضّوا عليها بالنواجذ، وإيّاكم ومحدثاتِ الأمور، فإنّ كلَّ محدثةٍ بدعة، وكلَّ بدعةٍ ضلالة»."]], "tr": [[1144.0, "İmam Ahmed Müsned'inde, Ebû Dâvûd da Sünen'inde sahih bir isnadla İrbâd'dan şunu rivayet etmiştir;"], [1148.7, "dedi ki: \"Resûlullah ﷺ bir gün bize namaz kıldırdı, sonra yüzünü bize dönüp gözlerin yaşardığı ve kalplerin ürperdiği etkili bir öğüt verdi."], [1156.7, "Bir adam 'Ey Allah'ın Resûlü, sanki bu bir veda öğüdü;"], [1162.0, "bize tavsiyede bulun' dedi. Buyurdu ki:"], [1164.2, "'Size Allah'tan korkmayı, başınızdaki Habeşli bir köle bile olsa dinleyip itaat etmeyi tavsiye ederim."], [1172.1, "Çünkü sizden yaşayan çok ihtilaf görecektir."], [1174.8, "Benim sünnetime ve hidayete erdirilmiş râşid halifelerin sünnetine sarılın;"], [1178.9, "ona tutunun ve azı dişlerinizle sımsıkı yapışın."], [1182.7, "Sonradan çıkarılan işlerden sakının; çünkü sonradan çıkarılan her şey bid'attir ve her bid'at dalâlettir.'\""]]}, {"reader": false, "ar": [[1191.0, "وأخرج الإمام أحمد في مسنده بإسنادٍ حسنٍ من حديث ابن مسعودٍ رضي الله عنه قال:"], [1198.4, "«خطّ لنا رسولُ الله صلى الله عليه وسلم خطًّا مستقيمًا وقال: هذه سبيلُ الله، وخطّ خطوطًا عن يمينه وشماله وقال: هذه سُبُلٌ، وعلى كلّ سبيلٍ شيطانٌ يدعو إليها، ثم تلا: <span class=\"ayah\">﴿وَأَنَّ هَٰذَا صِرَاطِي مُسْتَقِيمًا فَاتَّبِعُوهُ ۖ وَلَا تَتَّبِعُوا السُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِ﴾<\/span> <span class=\"ref\">[الأنعام: ١٥٣]<\/span>»."]], "tr": [[1191.0, "İmam Ahmed Müsned'inde hasen bir isnadla İbn Mes'ûd'dan —Allah ondan razı olsun— şunu rivayet etmiştir;"], [1194.5, "dedi ki: \"Resûlullah ﷺ bize dosdoğru bir çizgi çizdi ve 'Bu Allah'ın yoludur' dedi."], [1198.4, "Sonra onun sağına ve soluna çizgiler çizdi ve 'Bunlar da (başka) yollardır;"], [1203.2, "her yolun üzerinde ona çağıran bir şeytan vardır' dedi."], [1210.3, "Sonra şu ayeti okudu: <span class=\"ayah\">﴿Şüphesiz bu, benim dosdoğru yolumdur; ona uyun. Başka yollara uymayın; yoksa sizi O'nun yolundan ayırır﴾<\/span> [En'âm 153].\""]]}, {"reader": false, "ar": [[1222.0, "وأخرج الإمام الترمذيّ في جامعه بإسنادٍ حسنٍ لغيره من حديث عبد الله بن عمرو بن العاص رضي الله عنهما قال:"], [1231.5, "قال النبيّ صلى الله عليه وسلم:"], [1234.5, "«ليأتينَّ على أمّتي ما أتى على بني إسرائيل من قبلها حذوَ النعل بالنعل، حتى لو كان منهم من يأتي أمَّه علانيةً لكان في أمّتي من يفعل ذلك. وإنّ بني إسرائيل قد تفرّقت على ثنتين وسبعين فرقة، وستفترق أمّتي على ثلاثٍ وسبعين فرقة، كلُّها في النار إلا واحدة»،"], [1261.0, "قالوا: من يا رسول الله؟"], [1263.0, "قال: «ما أنا عليه وأصحابي»."]], "tr": [[1222.0, "İmam Tirmizî Câmi'inde, li-gayrihî hasen bir isnadla Abdullah b."], [1227.4, "Amr b. el-Âs'tan —Allah ikisinden de razı olsun— şunu rivayet etmiştir;"], [1231.5, "dedi ki: Nebî ﷺ şöyle buyurdu:"], [1234.5, "\"İsrâiloğulları'nın başına gelenler, ayakkabının teki tekine denk geldiği gibi aynen ümmetimin de başına gelecektir."], [1245.8, "Hatta onlardan annesiyle açıktan zina eden biri olduysa, ümmetimde de bunu yapan olacaktır."], [1257.7, "İsrâiloğulları yetmiş iki fırkaya ayrıldı;"], [1261.4, "ümmetim de yetmiş üç fırkaya ayrılacaktır."], [1263.0, "Biri hariç hepsi ateştedir.\" \"Ey Allah'ın Resûlü, o (kurtulan) kimdir?\" dediler."], [1263.8, "Buyurdu ki: \"Benim ve ashâbımın üzerinde olduğu (yol).\""]]}, {"reader": false, "ar": [[1265.0, "وأخرجه الإمام أحمد في مسنده،"], [1268.0, "وأبو داود في سننه بإسنادٍ صحيحٍ لغيره من حديث معاوية رضي الله عنه،"], [1274.0, "وفيه: «ثنتان وسبعون في النار، وواحدةٌ في الجنة، وهي الجماعة، وإنه سيخرج في أمّتي أقوامٌ تتجارى بهم الأهواء كما يتجارى الكَلَبُ بصاحبه، لا يُبقي منه عِرقًا ولا مَفصِلًا إلا دخله»."]], "tr": [[1265.0, "Bunu İmam Ahmed Müsned'inde, Ebû Dâvûd da Sünen'inde li-gayrihî sahih bir isnadla Muâviye'den —Allah ondan razı olsun— rivayet etmiştir."], [1274.5, "Orada şöyle geçer: \"Yetmiş ikisi ateşte, biri cennettedir;"], [1278.0, "o da cemaattir. Ümmetimde öyle kavimler çıkacak ki, kuduz hastalığının sahibine yayılması gibi hevâlar onların (bedenlerine) yayılacak;"], [1288.5, "onda girmediği hiçbir damar ve eklem bırakmayacak.\""]]}, {"reader": false, "ar": [[1292.0, "والأدلة على ذلك كثيرةٌ جدًّا،"], [1294.5, "كلُّها تأمر بأمرين عظيمين متّفقٍ على الأمر بهما عند علماء الإسلام،"], [1300.0, "وهي: الأمر بالاتّباع، والنهي عن الابتداع."], [1308.0, "فإذًا: كلُّ عبادةٍ أحدثها المحدِثون فإنّ الله عز وجل لا يقبلها،"], [1316.0, "سواءٌ أكان إحداثًا باعتبار أصلها ـ وهي التي يسمّيها أهل السنة بالبدعة الأصلية ـ أو كان إحداثًا باعتبار أوصافها الإضافية ـ وهي التي يسمّيها أهل السنة بالبدعة الإضافية الوصفية ـ والله أعلم."]], "tr": [[1292.0, "Bu konudaki deliller pek çoktur;"], [1294.5, "hepsi, İslam âlimleri nezdinde emredilmesinde ittifak edilen iki büyük şeyi emreder:"], [1300.8, "İttibâı emretmek ve ibtidâı (bid'at çıkarmayı) yasaklamak."], [1308.0, "Öyleyse bid'atçilerin ihdas ettiği her ibadeti Allah Azze ve Celle kabul etmez;"], [1316.0, "ister aslı itibarıyla bir ihdas olsun —Ehl-i Sünnet'in \"aslî bid'at\" dediği budur—, ister izâfî nitelikleri itibarıyla bir ihdas olsun —Ehl-i Sünnet'in \"izâfî vasfî bid'at\" dediği budur. Allah en iyisini bilir."]]}]}, {"ts": "22:16", "title": "4. Külliye: Her taabbudî tahsis tevkîfe dayanır", "paras": [{"reader": false, "ar": [[1336.0, "ومن الكلّيّات أيضًا: <b>كلُّ تخصيصٍ تعبُّديٍّ فمبناه على التوقيف.<\/b> كلُّ تخصيصٍ تعبُّديٍّ فمبناه على التوقيف."], [1351.4, "<span class=\"note\">(يكررها)<\/span> وذلك لأنّ ركن الإحداث هو التخصيص؛"], [1370.0, "فمتى ما وُجد التخصيص البدعيّ قام سوقُ البدعة ـ أو قام ساقُ البدعة ـ ومتى ما كُسر تخصيصُها انكسر ساقُها."], [1382.0, "فلا تجد بدعةً إلا ولا بدّ أن يكون قيامها على ساق التخصيص،"], [1388.0, "ولذلك متى ما كُسر تخصيصها انكسرت بدعيّتها."]], "tr": [[1336.0, "Külliyelerden biri de şudur: 4."], [1338.1, "külliye: Her taabbudî tahsis (ibadet kastıyla yapılan özelleştirme) tevkîfe dayanır. Her taabbudî tahsis tevkîfe dayanır."], [1351.4, "(Tekrar ediyor.) Bu şundandır: İhdasın rüknü tahsistir."], [1370.0, "Bid'at olan tahsis bulunduğu zaman bid'atin pazarı kurulur —ya da bid'at ayağa kalkar—;"], [1378.0, "tahsisi kırıldığı zaman ise ayağı kırılır."], [1382.0, "Ayakta durması tahsis ayağı üzerine olmayan hiçbir bid'at bulamazsın."], [1386.5, "Bu yüzden tahsisi kırıldığı zaman bid'at oluşu da kırılır."]]}, {"reader": false, "ar": [[1394.0, "فمسألة التخصيص عند أهل السنة والجماعة لها شأنُها ومنزلتُها الكبيرة،"], [1400.0, "التي لا يجوز أبدًا أن تخفى على طالب العلم المنتدَب للردّ على أهل البدع في هذا الزمان."], [1408.0, "وبيانُ ذلك أن نقول:"], [1410.5, "إنّ التخصيص عند أهل السنة والجماعة ينقسم إلى قسمين:"], [1416.0, "إلى تخصيصٍ تعبُّديٍّ دينيّ،"], [1418.9, "وإلى تخصيصٍ عاديٍّ عرفيّ."], [1425.0, "وكلّيّتنا هذه في النوع الأول منهما،"], [1429.2, "وهو التخصيص التعبُّديّ الدينيّ."]], "tr": [[1394.0, "Ehl-i Sünnet ve'l-Cemaat nezdinde tahsis meselesinin büyük bir önemi ve yeri vardır;"], [1400.5, "bu zamanda bid'at ehline reddiye yapmaya kendini adamış ilim talebesine bunun gizli kalması asla caiz değildir."], [1408.0, "Bunun açıklaması şudur: Ehl-i Sünnet ve'l-Cemaat nezdinde tahsis iki kısma ayrılır:"], [1416.0, "Taabbudî dinî tahsis ve âdî örfî tahsis."], [1425.0, "Bu külliyemiz bunlardan birinci türle, yani taabbudî dinî tahsisle ilgilidir."]]}, {"reader": false, "ar": [[1433.0, "ووجهُ الفرقان بينهما هو مراعاةُ ذاتِ الزمانية أو المكانية أو العددية في التخصيص؛"], [1446.0, "فكلُّ من خصّ زمانًا لزمانيّته فتخصيصُه تعبُّديّ،"], [1451.0, "وكلُّ من خصّ مكانًا لمكانيّته فتخصيصه تعبُّديّ،"], [1457.0, "وكلُّ من خصّ عددًا لعدديّته فتخصيصه تعبُّديّ."], [1463.0, "وخلاصتُه أن نقول: كلُّ من خصّ الشيء لذاته فتخصيصه تعبُّديّ."]], "tr": [[1433.0, "İkisi arasındaki farkın yönü, tahsiste zamanın, mekânın ya da sayının bizzat kendisinin gözetilmesidir."], [1446.0, "Bir zamanı zaman oluşu (kendisi) için tahsis eden herkesin tahsisi taabbudîdir."], [1451.0, "Bir mekânı mekân oluşu için tahsis eden herkesin tahsisi taabbudîdir."], [1457.0, "Bir sayıyı sayı oluşu için tahsis eden herkesin tahsisi taabbudîdir."], [1463.0, "Özeti şudur: Bir şeyi zâtı (kendisi) için tahsis eden herkesin tahsisi taabbudîdir."]]}, {"reader": false, "ar": [[1472.0, "فإذا قيل لك: عرِّف لنا التخصيص التعبُّديّ،"], [1476.7, "فقل: هو تخصيص الشيء لذاته،"], [1480.0, "أي: أنّ سببيّة التخصيص هي ذاتُ ذلك الشيء؛"], [1486.0, "فإن كان زمانًا فسببُ التخصيص زمانيّته،"], [1489.0, "وإن كان مكانًا فسببُ التخصيص مكانيّته،"], [1494.0, "وإن كان عددًا فسببُ التخصيص عدديّته."], [1499.0, "فمن خصّ الشيء لذاته فتخصيصه تعبُّديّ."]], "tr": [[1472.0, "Sana \"Bize taabbudî tahsisi tarif et\" denirse, de ki:"], [1477.3, "O, bir şeyi zâtı için tahsis etmektir;"], [1480.7, "yani tahsisin sebebi o şeyin bizzat kendisidir."], [1486.0, "Zaman ise tahsisin sebebi onun zaman oluşudur;"], [1489.0, "mekân ise tahsisin sebebi onun mekân oluşudur;"], [1494.0, "sayı ise tahsisin sebebi onun sayı oluşudur."], [1499.0, "Kim bir şeyi zâtı için tahsis ederse, tahsisi taabbudîdir."]]}, {"reader": false, "ar": [[1503.0, "وقاعدتُه: أنّ الأصل في التخصيص التعبُّديّ توقيفُه على ثبوت النصّ؛"], [1510.0, "وذلك لأنّ المتقرّر في القواعد أنّ الأصل في العبادات الإطلاقُ عن المتعلَّقات،"], [1519.0, "فمن أراد أن يربط تعبُّدًا بشيءٍ من المتعلَّقات فإنه مطالَبٌ بالدليل الدالّ على صحّة هذا الربط،"], [1530.0, "بغضّ النظر عن نوع هذا المتعلَّق."]], "tr": [[1503.0, "Kaidesi şudur: Taabbudî tahsiste asıl, onun nassın sübûtuna bağlı olmasıdır."], [1510.0, "Çünkü kaidelerde yerleşik olan şudur:"], [1513.4, "İbadetlerde asıl, taalluklardan mutlak (serbest) olmalarıdır."], [1519.0, "Bir taabbudu herhangi bir taallukla irtibatlandırmak isteyen kimseden —bu taallukun türü ne olursa olsun— bu irtibatın sıhhatini gösteren delil istenir."]]}, {"reader": false, "ar": [[1533.0, "فمن أراد أن يربط تعبُّدًا بزمانيّةٍ معيّنة،"], [1538.0, "أو بمكانيّةٍ معيّنة، أو بعدديّةٍ معيّنة،"], [1543.0, "أو بهيئةٍ وصفةٍ معيّنة،"], [1546.0, "فإننا نطالبه بالدليل الدالّ على هذا الأمر؛"], [1549.0, "لأنّ المتعلَّق نوعُ تخصيص،"], [1552.0, "لأنّ المتعلَّق نوعُ تخصيص،"], [1555.2, "فلا بدّ أن يأتينا بدليلٍ يدلّ على ذلك."]], "tr": [[1533.0, "Bir taabbudu belirli bir zamanla, belirli bir mekânla, belirli bir sayıyla ya da belirli bir şekil ve sıfatla irtibatlandırmak isteyenden, bu hususu gösteren delili isteriz."], [1549.0, "Çünkü taalluk bir tür tahsistir;"], [1552.0, "çünkü taalluk bir tür tahsistir."], [1555.2, "Dolayısıyla bize bunu gösteren bir delil getirmesi gerekir."]]}]}, {"ts": "26:00", "title": "4. Külliye (devam): Eserden deliller — iki bayram ve Buvâne'de kurban adağı", "paras": [{"reader": false, "ar": [[1560.0, "فإن قلتَ: وما دليلك على أنّ التخصيص التعبُّديّ توقيفيّ؟"], [1571.0, "فأقول: الدليل على ذلك الأثرُ والنظر."], [1576.0, "أمّا من الأثر: فأخرج أبو داود في سننه بإسنادٍ صحيحٍ من حديث أنسٍ رضي الله عنه قال:"], [1585.7, "«قدم النبيّ صلى الله عليه وسلم المدينة ولهم يومان يلعبون فيهما، فقال: ما هذان اليومان؟ فقالوا: كنّا نلعب فيهما في الجاهلية، فقال: لقد أبدلكم الله بهما خيرًا منهما: يومَ الفطر، ويومَ الأضحى»."]], "tr": [[1560.0, "Şayet \"Taabbudî tahsisin tevkîfî olduğuna delilin nedir?\" dersen, derim ki:"], [1564.3, "Bunun delili eser ve nazardır."], [1571.0, "Eserden (delile gelince): Ebû Dâvûd Sünen'inde sahih bir isnadla Enes'ten —Allah ondan razı olsun— şunu rivayet etmiştir;"], [1578.0, "dedi ki: \"Nebî ﷺ Medine'ye geldiğinde onların içinde eğlendikleri iki günleri vardı."], [1582.8, "'Bu iki gün nedir?' diye sordu."], [1585.7, "'Câhiliye'de bu günlerde eğlenirdik' dediler."], [1590.3, "Buyurdu ki: 'Allah size bunların yerine onlardan daha hayırlısını verdi:"], [1601.0, "Ramazan Bayramı günü ve Kurban Bayramı günü.'\""]]}, {"reader": false, "ar": [[1606.0, "فهذا دليلٌ على أنّ مجرّد التخصيص ليس مسوِّغًا للمنع،"], [1613.0, "وإلا لمنع ولم يسأل عن سببيّته؛"], [1617.0, "فلمّا سأل عن السببية عرفنا أنّ مجرّد التخصيص ليس سببًا للمنع،"], [1624.3, "وإنما سببُ المنع سببيّتُه،"], [1629.0, "فلا بدّ أن نسأل عن سببيّة هذا التخصيص."], [1633.0, "فلمّا سأل عنها أخبروه بأنها من العادات التي توارثوها عن آبائهم وأسلافهم."]], "tr": [[1606.0, "Bu, sırf tahsisin yasaklamayı gerektiren bir sebep olmadığına delildir;"], [1611.0, "aksi hâlde (Nebî ﷺ) doğrudan yasaklar ve sebebini sormazdı."], [1617.0, "Sebebini sorduğuna göre anladık ki sırf tahsis yasaklamanın sebebi değildir;"], [1624.3, "yasaklamanın sebebi, (tahsisin) sebebidir. Dolayısıyla bu tahsisin sebebini sormamız gerekir."], [1633.0, "Nebî ﷺ bunu sorunca, onlar bunun atalarından ve seleflerinden miras aldıkları âdetlerden olduğunu haber verdiler."]]}, {"reader": false, "ar": [[1640.0, "وقد جاءت هذه العادة السيئة إلى جزيرة العرب من عبَدة الشمس؛"], [1646.0, "فإنّ عبدة الشمس يحتفلون بانتقالها من برج كذا إلى برج كذا،"], [1652.0, "ثم لا تزال تتسرّب هذه العادة حتى وصلت إلى الأوس والخزرج،"], [1657.0, "فصار أسلافهم يلعبون في هذين اليومين،"], [1661.0, "فنهاهم النبيّ صلى الله عليه وسلم عنهما؛"], [1666.0, "لأنه علم أنّ سبب التخصيص رُوعي فيه ذاتُ الزمانية."]], "tr": [[1640.0, "Bu kötü âdet Arap Yarımadası'na güneşe tapanlardan gelmiştir."], [1642.7, "Güneşe tapanlar, güneşin şu burçtan şu burca geçişini kutlarlar."], [1646.0, "Sonra bu âdet sızmaya devam ederek Evs ve Hazrec'e kadar ulaştı;"], [1653.4, "onların selefleri bu iki günde eğlenir oldu."], [1658.3, "Nebî ﷺ onları bu iki günden men etti;"], [1666.0, "çünkü tahsisin sebebinde zamanın bizzat kendisinin gözetildiğini bildi."]]}, {"reader": false, "ar": [[1671.0, "فلو كان التخصيص للزمانية جائزًا لأقرّهم على ذلك،"], [1678.2, "ولجعلها من جملة العادات والتقاليد ـ أو السُّلوم والأعراف ـ التي يُحكم عليها بالحلّ والإباحة،"], [1687.0, "لكنّه ما أقرّهم عليها ومنعهم،"], [1692.0, "ممّا يدلّ على أنّ التخصيص التعبُّديّ لا بدّ فيه من دليلٍ خاصّ."]], "tr": [[1671.0, "Eğer zamanı zaman oluşu için tahsis etmek caiz olsaydı, onları bunun üzerine bırakır (ikrar eder) ve bunu, helal ve mübah olduğuna hükmedilen âdetler ve gelenekler —ya da töreler ve örfler— arasında sayardı."], [1689.4, "Fakat onları bunun üzerine bırakmadı ve men etti."], [1694.2, "Bu da taabbudî tahsiste özel bir delilin şart olduğunu gösterir."]]}, {"reader": false, "ar": [[1698.0, "ومن الأدلة: ما أخرجه أبو داود في سننه بإسنادٍ صحيحٍ أيضًا من حديث ثابت بن الضحّاك رضي الله عنه قال:"], [1708.7, "«جاء رجلٌ إلى النبيّ صلى الله عليه وسلم فقال: يا رسول الله، إني نذرتُ أن أنحر إبلًا ببُوانة»."], [1719.0, "فعلم النبيّ صلى الله عليه وسلم أنّ الذبح قد خُصّص له مكان،"], [1725.0, "لكن لم يمنعه لمجرّد التخصيص؛"], [1730.0, "إذ التخصيص ليس سببًا للمنع لوحده،"], [1735.0, "لكن سأله عن سببيّة هذا التخصيص في قوله:"], [1739.2, "«أكان ـ هل كان ـ فيها عيدٌ من أعيادهم؟» قال:"], [1743.5, "لا، قال: «هل كان فيها وثنٌ من أوثان الجاهلية يُعبد؟» قال:"], [1748.5, "لا، قال للرجل: «فأوفِ بنذرك؛ فإنه لا وفاءَ لنذرٍ في معصية الله، ولا فيما لا يملكه ابنُ آدم»."]], "tr": [[1698.0, "Delillerden biri de yine Ebû Dâvûd'un Sünen'inde sahih bir isnadla Sâbit b."], [1705.4, "ed-Dahhâk'tan —Allah ondan razı olsun— rivayet ettiği hadistir;"], [1708.7, "dedi ki: \"Bir adam Nebî ﷺ'e gelip 'Ey Allah'ın Resûlü, Buvâne'de deve kesmeyi adadım' dedi.\" Nebî ﷺ, kurban kesmek için bir yerin tahsis edildiğini anladı;"], [1723.5, "fakat sırf tahsis sebebiyle onu men etmedi;"], [1730.0, "çünkü tahsis tek başına yasaklama sebebi değildir."], [1735.5, "Bilakis ona bu tahsisin sebebini sordu:"], [1739.2, "\"Orada onların bayramlarından bir bayram var mıydı?\" \"Hayır\" dedi."], [1743.5, "\"Orada Câhiliye putlarından tapılan bir put var mıydı?\" \"Hayır\" dedi."], [1748.5, "Adama dedi ki: \"Öyleyse adağını yerine getir."], [1750.2, "Çünkü Allah'a isyan olan bir adağı ve âdemoğlunun sahip olmadığı bir şeydeki adağı yerine getirmek yoktur.\""]]}, {"reader": false, "ar": [[1759.0, "فهنا سأله النبيّ صلى الله عليه وسلم عن سببيّة تخصيص هذا المكان بالذبح،"], [1765.0, "فلمّا تبيّن له أنه لم يخصّ المكان لمكانيّته أجاز له ذلك الذبح،"], [1774.0, "وعبّر عن هذا الجواز بقوله ـ فيما لو كان الجواب نعم ـ:"], [1781.0, "بأنه «لا وفاء لنذرٍ في معصية الله»."], [1786.0, "فدلّ ذلك على أنّ من خصّ الزمان لزمانيّته فهو عاصٍ،"], [1791.0, "وأنّ من خصّ المكان لمكانيّته بلا دليلٍ فهذا نوعُ معصية."]], "tr": [[1759.0, "Burada Nebî ﷺ ona bu mekânı kurban kesmek için tahsis etmesinin sebebini sordu."], [1763.6, "Mekânı mekân oluşu için tahsis etmediği kendisine belli olunca o kurbanı kesmesine izin verdi."], [1770.5, "Cevap \"evet\" olsaydı (olacak durumu) da \"Allah'a isyan olan bir adağı yerine getirmek yoktur\" sözüyle ifade etti."], [1781.0, "Bu da zamanı zaman oluşu için tahsis edenin âsi olduğunu, mekânı delilsiz olarak mekân oluşu için tahsis etmenin de bir tür isyan olduğunu gösterir."]]}]}, {"ts": "29:57", "title": "4. Külliye (devam): Nazar delili — tahsis mülkiyetin fer'idir", "paras": [{"reader": false, "ar": [[1796.6, "وأمّا من النظر: فلأنّ المتقرّر في القواعد أنّ تخصيص الشيء فرعٌ عن تملّكه،"], [1810.0, "أنّ تخصيص الشيء فرعٌ عن تملّكه."], [1813.0, "فإذا كنتَ تملك الشيء فلك أن تخصّص منه ما شئتَ،"], [1819.6, "بما شئتَ، كيفما شئتَ،"], [1822.9, "متى شئتَ؛ لأنك تملكه،"], [1827.3, "ومالكُ الشيء له الأحقّية المطلقة في تخصيص ماليّته أو ملكيّته بما شاء."]], "tr": [[1796.6, "Nazara (akli delile) gelince: Kaidelerde yerleşik olan şudur:"], [1797.0, "Bir şeyi tahsis etmek, ona sahip olmanın fer'idir;"], [1802.6, "bir şeyi tahsis etmek, ona sahip olmanın fer'idir."], [1813.0, "Bir şeye sahipsen, ondan dilediğini, dilediğin şeye, dilediğin şekilde, dilediğin zaman tahsis edebilirsin;"], [1822.2, "çünkü ona sahipsin. Bir şeyin sahibi, malını ya da mülkünü dilediği şeye tahsis etmede mutlak hak sahibidir."]]}, {"reader": false, "ar": [[1835.0, "فأنت جعلتَ بيتك أقسامًا وغُرفًا ومداخلَ ومخارج،"], [1842.0, "وجعلتَ هذا المكان لاستقبال الضيوف،"], [1845.3, "وهذا المكان لتقديم الطعام،"], [1848.0, "وهذا المكان للنوم؛ فلك أن تخصّص بيتك بما شئتَ وكيفما شئتَ لأنك تملكه."], [1855.0, "وكذلك ثيابك: لك أن تجعل هذا الثوب للوظيفة،"], [1860.0, "وهذا الثوب للنوم، وهذا الثوب لتلك المنفعة الثالثة."]], "tr": [[1835.0, "Sen evini bölümlere, odalara, girişlere ve çıkışlara ayırdın;"], [1842.0, "şu yeri misafir karşılamaya, şu yeri yemek sunmaya, şu yeri de uyumaya ayırdın."], [1850.0, "Evini dilediğin şeye ve dilediğin şekilde tahsis edebilirsin;"], [1852.3, "çünkü ona sahipsin. Elbiselerin de böyledir:"], [1855.0, "Şu elbiseyi iş için, şu elbiseyi uyku için, şu elbiseyi de şu üçüncü ihtiyaç için ayırabilirsin."]]}, {"reader": false, "ar": [[1866.0, "ولكن لا حقّ لك أن تتحكّم تخصيصًا في بيت جارك لأنك لا تملكه،"], [1871.0, "ولا في متاع جارك لأنك لا تملكه."], [1874.0, "فإذا تبيّن أنّ التخصيص فرعُ التملّك،"], [1878.0, "فلا يجوز للإنسان أن يخصّ زمانيّةً بشيءٍ لأنه لا يملك الزمان،"], [1883.0, "ولا يحلّ له أن يخصّص المكانيّة بشيءٍ تعبُّدًا لأنه لا يملك المكان،"], [1892.0, "ولكنّ ذلك إلى الله عز وجل."]], "tr": [[1866.0, "Fakat komşunun evinde tahsis yoluyla tasarrufta bulunmaya hakkın yoktur, çünkü ona sahip değilsin;"], [1870.2, "komşunun eşyasında da (hakkın yoktur), çünkü ona sahip değilsin."], [1874.0, "Tahsisin mülkiyetin fer'i olduğu anlaşılınca, insanın bir zamanı bir şeyle tahsis etmesi caiz değildir, çünkü zamana sahip değildir."], [1882.5, "Bir mekânı ibadet kastıyla bir şeyle tahsis etmesi de helal değildir, çünkü mekâna sahip değildir."], [1892.0, "Bu, Allah Azze ve Celle'ye aittir."]]}, {"reader": false, "ar": [[1895.0, "فلأنّ الله عز وجل هو الذي يملك الزمانيّة فله الأحقّية المطلقة أن يقول لنا:"], [1902.5, "إذا رأيتم الفجر الثاني فصلّوا ركعتي الفجر،"], [1906.0, "وإذا دلكت الشمس عن كبد السماء فصلّوا أربعَ الظهر،"], [1910.0, "وإذا غربت الشمس فصلّوا ثلاثَ المغرب،"], [1914.0, "وإذا رأيتم هلال رمضان فصوموا ثلاثين يومًا أو تسعةً وعشرين يومًا."]], "tr": [[1895.0, "Zamana sahip olan Allah Azze ve Celle olduğu için, bize şunu söylemede mutlak hak O'nundur:"], [1899.9, "İkinci fecri gördüğünüzde sabahın iki rekâtını kılın;"], [1902.5, "güneş göğün ortasından kaydığında öğlenin dört rekâtını kılın;"], [1907.3, "güneş battığında akşamın üç rekâtını kılın;"], [1910.7, "Ramazan hilalini gördüğünüzde otuz gün ya da yirmi dokuz gün oruç tutun."]]}, {"reader": false, "ar": [[1922.0, "وله الأحقّية المطلقة أن يخصّ أيَّ مكانٍ شاء من أرضه بأيّ تعبُّدٍ شاء،"], [1927.0, "كما شاء، على الصفة التي يشاء؛"], [1931.0, "لأنه يملك المكانيّة. فله الأحقّية المطلقة أن يقول:"], [1935.2, "لا تُشدّ الرحال إلى أيّ مكانٍ إلا إلى هذه الأمكنة الثلاثة،"], [1940.0, "والأحقّية المطلقة أن يقول:"], [1942.3, "في هذا اليوم بخصوصه قِفوا في هذا المكان،"], [1947.0, "ولا تخرجوا منه إلا بعد غروب الشمس،"], [1950.0, "وارموا هذه الجمرات في هذا المكان،"], [1954.0, "وعليكم البيتوتةُ في هذا إلى النهار،"], [1957.0, "والبيتوتةُ في هذا يومَي التشريق،"], [1960.0, "وعليكم أن تطوفوا بهذا المكان،"], [1963.0, "وأن تسعَوا في هذا المكان."]], "tr": [[1922.0, "Arzından dilediği herhangi bir mekânı, dilediği bir ibadetle, dilediği gibi, dilediği sıfat üzere tahsis etmede mutlak hak O'nundur;"], [1931.0, "çünkü mekâna sahiptir. \"Şu üç mekândan başka hiçbir yere (ibadet kastıyla) yolculuk yapılmaz\" demede mutlak hak O'nundur."], [1935.2, "\"Özellikle bu günde şu mekânda vakfe yapın, güneş batmadan oradan çıkmayın;"], [1942.3, "şu cemreleri şu mekânda atın;"], [1946.4, "gündüze kadar şurada gecelemeniz, teşrik günlerinde de şurada gecelemeniz gerekir;"], [1954.0, "şu mekânı tavaf etmeniz ve şu mekânda sa'y etmeniz gerekir\" demede mutlak hak O'nundur."]]}, {"reader": false, "ar": [[1966.0, "وأمّا المخلوق فإنه ليس له الحقّ في شيءٍ من ذلك؛"], [1970.0, "لأنه لا يملك الزمانيّة ليخصّ منها ما شاء بما شاء،"], [1977.0, "ولا المكانيّة ليخصّ منها ما شاء بما شاء،"], [1983.0, "وإنما ذلك تحكّمٌ في شيءٍ من أفعال الله عز وجل،"], [1987.0, "فعلى المخلوق أن يعرف قدره."], [1989.0, "فتخصيص الزمانيّة لا بدّ أن يكون فيه متابعًا للدليل،"], [1995.0, "لا منشئًا له من قِبَل نفسه."]], "tr": [[1966.0, "Mahlûkun ise bunlardan hiçbirinde hakkı yoktur."], [1970.0, "Çünkü zamandan dilediğini dilediği şeye tahsis etmek için zamana sahip değildir;"], [1977.0, "mekândan dilediğini dilediği şeye tahsis etmek için mekâna da sahip değildir."], [1984.2, "Bu, ancak Allah Azze ve Celle'nin fiillerinden bir şeyde keyfî tasarruf etmektir."], [1989.0, "Mahlûkun haddini bilmesi gerekir. Zamanın tahsisinde delile tâbi olmalı, onu kendiliğinden icat etmemelidir."]]}, {"reader": false, "ar": [[1999.0, "فأعظمُ البدع المنتشرة في العالم العربيّ والإسلاميّ إنما تجدونها تتضمّن هذا التخصيص الذي رُوعي فيه الزمانيّة،"], [2010.5, "أو رُوعي فيه المكانيّة،"], [2013.0, "أو رُوعي فيه العدديّة،"], [2015.5, "أو رُوعي فيه الوصفيّة؛"], [2018.0, "فيأتي طالب العلم من أهل السنة فيكسر هذا التخصيص،"], [2023.0, "لتعود الأمور إلى نصابها،"], [2026.0, "ولتبطل بدعيّةُ هذه الأفعال والأقوال. فساقُ البدعة التخصيص."]], "tr": [[1999.0, "Arap ve İslam dünyasında yaygın olan en büyük bid'atlerin, zamanın, mekânın, sayının ya da vasfın gözetildiği bu tahsisi içerdiğini görürsünüz."], [2011.8, "Ehl-i Sünnet'ten bir ilim talebesi gelir ve bu tahsisi kırar;"], [2018.0, "böylece işler yerli yerine döner ve bu fiil ve sözlerin bid'at oluşu bâtıl olur. Bid'atin ayağı tahsistir."]]}, {"reader": false, "ar": [[2034.0, "فهذه الكلّيّة تكسر هذه البدع الإضافية التي أحدث فيها المحدِثون صفاتٍ لا دليل عليها؛"], [2044.0, "فيخصّونها بزمانيّةٍ لا دليل عليها،"], [2047.0, "ويخصّونها بمكانيّةٍ لا دليل عليها،"], [2051.0, "أو يخصّونها بهيئةٍ لا دليل عليها،"], [2054.0, "أو يخصّونها بعدديّةٍ لا دليل عليها."]], "tr": [[2034.0, "Bu külliye, bid'atçilerin içinde delili olmayan nitelikler ihdas ettikleri bu izâfî bid'atleri kırar."], [2041.6, "Onları delili olmayan bir zamanla tahsis ederler, delili olmayan bir mekânla tahsis ederler, ya da delili olmayan bir şekille tahsis ederler, ya da delili olmayan bir sayıyla tahsis ederler."]]}]}, {"ts": "34:19", "title": "5. Külliye: Her örfî tahsiste asıl helallik ve mubahlıktır", "paras": [{"reader": false, "ar": [[2059.0, "ولكن لا يكمل فهمُ هذه الكلّيّة إلا بالكلّيّة التي بعدها،"], [2065.0, "وهي: <b>كلُّ تخصيصٍ عرفيٍّ فالأصل فيه الحلُّ والإباحة.<\/b> وهذا القسم الثاني من أنواع التخصيص عند أهل السنة والجماعة،"], [2083.0, "وهو التخصيص العرفيّ العاديّ."], [2086.0, "فإن قلتَ: عرِّفه لنا،"], [2088.8, "فأقول: هو تخصيص الشيء لا لذاته."]], "tr": [[2059.0, "Fakat bu külliyenin anlaşılması ancak ondan sonraki külliyeyle tamamlanır;"], [2063.2, "o da şudur: 5. külliye:"], [2065.7, "Her örfî tahsiste asıl, helallik ve mubahlıktır. Bu, Ehl-i Sünnet ve'l-Cemaat nezdinde tahsis türlerinin ikinci kısmıdır;"], [2081.3, "o da örfî âdî tahsistir."], [2086.0, "Şayet \"Onu bize tarif et\" dersen, derim ki:"], [2089.5, "O, bir şeyi zâtı için olmaksızın tahsis etmektir."]]}, {"reader": false, "ar": [[2094.0, "والفرقان بينه وبين التخصيص التعبُّديّ هو أنّ التخصيص التعبُّديّ تخصيصُ الشيء لذاته،"], [2105.0, "وأمّا التخصيص العرفيّ فهو تخصيص الشيء لا لذاته،"], [2111.0, "وإنما من باب اعتباراتٍ أخرى،"], [2115.0, "كاعتبار جدولة اليوم، وتنظيم الوقت،"], [2118.0, "ومراعاة الصوارف، ونحوها. فهو لا يقصد هذا الزمان لذاته ولكن حصل من باب الموافقة،"], [2128.0, "ولا يقصد المكان لذاته ولكن حصل من باب الموافقة،"], [2134.0, "ولا يقصد العدد لذاته ولكن حصل من باب الموافقة."]], "tr": [[2094.0, "Onunla taabbudî tahsis arasındaki fark şudur:"], [2097.4, "Taabbudî tahsis, bir şeyi zâtı için tahsis etmektir."], [2105.7, "Örfî tahsis ise bir şeyi zâtı için değil, başka itibarlar sebebiyle tahsis etmektir;"], [2115.6, "günü programlamak, vakti düzenlemek, meşguliyetleri gözetmek ve benzeri itibarlar gibi."], [2123.3, "Kişi bu zamanı zâtı için kastetmez, bu sadece denk gelmiş olur;"], [2129.5, "mekânı zâtı için kastetmez, sadece denk gelmiş olur;"], [2134.8, "sayıyı zâtı için kastetmez, sadece denk gelmiş olur."]]}, {"reader": false, "ar": [[2140.0, "كرجلين زارا قبرًا بعد صلاة العصر من يوم الجمعة،"], [2152.0, "وأحدهما يعتقد فضيلة الزيارة شرعًا في هذا الوقت،"], [2160.0, "والآخر إنما يفرغ من أشغاله وصوارفه في هذا الوقت؛"], [2167.0, "فنسمّي تخصيصَ الأول ـ فنجعل تخصيص الأول ـ من التخصيص التعبُّديّ لأنه نظر إلى الزمانيّة بذاتها،"], [2181.0, "ونجعل تخصيص الثاني عرفيًّا لأنه لم يراعِ الزمانيّة لذاتها."]], "tr": [[2140.0, "Cuma günü ikindi namazından sonra bir kabri ziyaret eden iki adam gibi:"], [2153.4, "Biri bu vakitte ziyaretin şer'an faziletli olduğuna inanıyor;"], [2160.7, "diğeri ise işlerinden ve meşguliyetlerinden ancak bu vakitte boşalıyor."], [2167.0, "Birincisinin tahsisini —(ya da) birincisinin tahsisini— taabbudî tahsis sayarız;"], [2171.1, "çünkü zamanın bizzat kendisine bakmıştır."], [2173.9, "İkincisinin tahsisini ise örfî sayarız;"], [2183.8, "çünkü zamanı zâtı için gözetmemiştir."]]}, {"reader": false, "ar": [[2188.0, "وكما أنّ الأصل في التخصيص التعبُّديّ التوقيف،"], [2192.7, "فكذلك الأصل في التخصيص العرفيّ الجواز."], [2198.0, "ولذلك يجوز لنا أن نخصّص يوم السبت بتدريس العقيدة مثلًا،"], [2206.0, "ويوم الأحد بتدريس الفقه،"], [2209.0, "ويوم الاثنين بتدريس التفسير مثلًا؛"], [2213.0, "لأننا لا نقصد تخصيص الزمانيّة بشرح هذه الفنون لزمانيّتها،"], [2220.0, "وإنما نقصد ذلك من باب التنظيم والترتيب،"], [2223.8, "لا أقلّ ولا أكثر."]], "tr": [[2188.0, "Taabbudî tahsiste asıl tevkîf olduğu gibi, örfî tahsiste de asıl cevazdır."], [2198.0, "Bu yüzden örneğin cumartesi gününü akîde dersine, pazar gününü fıkıh dersine, pazartesi gününü de tefsir dersine ayırmamız caizdir."], [2213.0, "Çünkü zamanı, bu ilimlerin şerhine zaman oluşu için tahsis etmeyi kastetmiyoruz;"], [2220.5, "bunu sadece tanzim ve tertip için kastediyoruz, ne eksik ne fazla."]]}]}, {"ts": "37:06", "title": "5. Külliye (devam): Fer'ler — bid'at kutlamalar ve örfî \"günler\"", "paras": [{"reader": false, "ar": [[2226.0, "ويُفرَّع على ذلك جُملٌ من الفروع:"], [2231.0, "منها أنّ تخصيص الاحتفال بليلةٍ لذات الليلة من جملة المحدَثات في الدين،"], [2239.0, "ومن جملة البدع المنكرة التي لا يجوز إقرارها."], [2245.0, "فالاحتفال بليلة رأس السنة من البدع المحدثة في الدين،"], [2252.0, "والاحتفال بليلة الإسراء والمعراج من البدع المحدثة في الدين،"], [2259.0, "والاحتفال بمولد النبيّ صلى الله عليه وسلم من البدع المحدثة في الدين،"], [2266.0, "والاحتفال بليلة النصف من شعبان ـ في الأصحّ ـ أيضًا من البدع المحدثة في الدين."]], "tr": [[2226.0, "Buna birtakım fer'î meseleler bina edilir."], [2231.0, "Bunlardan biri şudur: Bir geceyi bizzat o gece olduğu için kutlamayla tahsis etmek, dinde sonradan çıkarılan şeylerden ve ikrar edilmesi caiz olmayan münker bid'atlerdendir."], [2241.6, "Yılbaşı gecesini kutlamak dinde sonradan çıkarılmış bid'atlerdendir."], [2245.0, "İsrâ ve Mi'râc gecesini kutlamak dinde sonradan çıkarılmış bid'atlerdendir."], [2254.8, "Nebî ﷺ'in mevlidini kutlamak dinde sonradan çıkarılmış bid'atlerdendir."], [2262.5, "Şaban'ın yarısı gecesini kutlamak da —en sahih görüşe göre— dinde sonradan çıkarılmış bid'atlerdendir."]]}, {"reader": false, "ar": [[2278.0, "وكلُّ ليلةٍ خُصّت لذاتها بشيءٍ من الأمور التعبُّدية فإنّ هذا التخصيص يوصف عندنا في الشرع بأنه بدعةٌ،"], [2292.0, "وبأنه محدَثةٌ لا يجوز إقراره."], [2296.0, "ويُخرَّج عليه: من خصّ يومَ مولده هو بشيءٍ من الاحتفال،"], [2302.7, "فهذا من البدع أيضًا،"], [2308.0, "أو يومَ زواجه بشيءٍ من الذكرى والاحتفال،"], [2312.8, "فهو أيضًا من البدع."]], "tr": [[2278.0, "Zâtı için ibadet türünden bir şeyle tahsis edilen her gece —bu tahsis— bize göre şeriatte bid'at ve ikrar edilmesi caiz olmayan sonradan çıkarılmış bir şey diye nitelenir."], [2296.0, "Kendi doğum gününü bir kutlamayla tahsis eden de bunun üzerine (tahriç edilir);"], [2303.4, "bu da bid'atlerdendir. Ya da evlilik gününü bir anma ve kutlamayla (tahsis etmek) de bid'atlerdendir."]]}, {"reader": false, "ar": [[2316.0, "ويدخل في ذلك ما يسمّى بالعشرينيّة،"], [2320.3, "والأربعينيّة، والسبعينيّة، والمئويّة، وهي أيامٌ يحتفلون بها عند مرور ذكرى موت صاحبها؛"], [2332.0, "فإذا مرّ على موته كذا وكذا فإنهم يحتفلون."], [2337.0, "وكلُّ ذلك من البدع المنكرة المستهجَنة في شريعة محمدٍ صلى الله عليه وسلم،"], [2345.0, "فمتى ما كُسر تخصيصها التعبُّديّ كُسرت بدعيّتها."]], "tr": [[2316.0, "Yirminci, kırkıncı, yetmişinci ve yüzüncü (gün/yıl anması) denen şeyler de buna girer."], [2327.3, "Bunlar, sahibinin ölüm yıldönümü geçtiğinde kutladıkları günlerdir;"], [2332.0, "ölümünün üzerinden şu kadar zaman geçtiğinde kutlama yaparlar."], [2337.0, "Bunların hepsi Muhammed ﷺ'in şeriatinde münker ve çirkin görülen bid'atlerdendir."], [2343.8, "Taabbudî tahsisi kırıldığı zaman bid'at oluşu da kırılır."]]}, {"reader": false, "ar": [[2354.0, "وعلى ذلك أيضًا نقول:"], [2356.0, "القول الصحيح جوازُ ما يسمّى بيوم المرور العالميّ؛"], [2362.0, "لأنهم لا يخصّون هذا اليوم لذاته،"], [2366.1, "وإنما من باب التنظيم والترتيب."], [2370.0, "ويجوز ما يسمّى بأسبوع الشجرة؛"], [2372.0, "لأنهم لا يخصّون الزمان لزمانيّته،"], [2375.5, "وإنما من باب التنظيم والترتيب."], [2379.0, "وما يسمّى بيوم الدفاع المدنيّ،"], [2381.9, "وما يسمّى بيوم المعلّم،"], [2384.1, "وما يسمّى بيوم اللغة العربية،"], [2387.0, "وغيرُ هذا من الأيام التي يجعلونها زمانًا لبعض الاحتفالات ونحوها،"], [2397.0, "لكن لا يرجع ذلك إلى ذات الشيء، أي: ذات الزمانيّة."]], "tr": [[2354.0, "Yine buna göre deriz ki:"], [2356.0, "Doğru görüş, \"Dünya Trafik Günü\" denen şeyin caiz olmasıdır;"], [2362.0, "çünkü bu günü zâtı için tahsis etmiyorlar, sadece tanzim ve tertip için (tahsis ediyorlar)."], [2370.0, "\"Ağaç Haftası\" denen şey de caizdir;"], [2372.0, "çünkü zamanı zaman oluşu için tahsis etmiyorlar, sadece tanzim ve tertip için (tahsis ediyorlar)."], [2379.0, "\"Sivil Savunma Günü\", \"Öğretmenler Günü\", \"Arap Dili Günü\" denenler ve bazı kutlamalar ve benzerleri için zaman olarak belirledikleri diğer günler de böyledir;"], [2397.0, "fakat bu, şeyin zâtına, yani zamanın bizzat kendisine dayanmaz."]]}, {"reader": false, "ar": [[2402.8, "فلا بدّ أن نفرّق بين ما خُصّ لذاته فيكون تعبُّديًّا نطلب فيه دليلًا،"], [2410.0, "وما خُصّ لا لذاته فنجعله عرفيًّا لا نطلب فيه دليلًا بخصوصه."], [2419.0, "وأظنّ الأمر واضحًا. ولعلّنا نكتفي بهذا القدر،"], [2423.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[2402.8, "Zâtı için tahsis edilen —ki bu taabbudî olur ve onda delil isteriz— ile zâtı için olmaksızın tahsis edilen —ki onu örfî sayarız ve onda özel bir delil istemeyiz— arasını ayırmamız gerekir."], [2419.0, "Zannederim mesele açıktır. Bu kadarıyla yetinelim."], [2420.8, "Allah en yüce ve en iyi bilendir."], [2423.7, "Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
