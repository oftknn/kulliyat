tti."], [2808.1, "O hâlde insanın diline kalbinin kastı olmadan yemin gelmişse, onda kefaret yoktur;"], [2814.3, "çünkü o yemin aslâ mün'akid olmamıştır."]]}, {"reader": false, "ar": [[2816.0, "ومن الكلّيّات أيضًا: <b>كلُّ من حلف على أمرٍ يجزم به فيتبيّن أنه بخلافه فلغو.<\/b> <span class=\"note\">(يكررها)<\/span> وهذا من معاني اللغو في اليمين،"], [2829.9, "وهي أن يحلف الإنسانُ على أمرٍ يظنّه كما يعتقد،"], [2835.8, "فيكون الأمرُ بخلافه. وعلى هذا تفسيرُ أبي هريرة رضي الله تعالى عنه لقول الله عز وجل:"], [2855.1, "<span class=\"ayah\">﴿لَا يُؤَاخِذُكُمُ اللَّهُ بِاللَّغْوِ فِي أَيْمَانِكُمْ﴾<\/span> <span class=\"ref\">[البقرة: ٢٢٥]<\/span>،"], [2860.0, "قال: «هو أن يحلف الرجلُ على الشيء لا يظنّ إلا أنه إيّاه <span class=\"q\">؟ 47:40<\/span>، فإذا ليس هو ما ظنّه». ماشي يا جماعة؟"]], "tr": [[2816.0, "Külliyelerden biri de şudur: 9."], [2818.0, "külliye: Kesin olarak inandığı bir şey üzerine yemin edip de onun aksi ortaya çıkan herkesin (yemini) lağvdir. (Tekrar ediyor.) Bu, yeminde lağvin anlamlarından biridir:"], [2829.9, "İnsanın, inandığı gibi olduğunu zannettiği bir şey üzerine yemin etmesi, sonra işin onun aksine çıkmasıdır."], [2848.0, "Ebû Hüreyre radıyallâhu teâlâ anh'ın, Allah Azze ve Celle'nin <span class=\"ayah\">﴿Allah sizi yeminlerinizdeki lağv sebebiyle sorumlu tutmaz﴾<\/span> [Bakara 225] sözünü tefsiri de buna göredir."], [2860.5, "Şöyle demiştir: \"O, kişinin bir şey üzerine, onun tam da o olduğundan başka bir şey düşünmeden <span class=\"q\">؟<\/span> yemin etmesi, sonra onun zannettiği şey olmadığının ortaya çıkmasıdır.\" Tamam mı arkadaşlar?"]]}, {"reader": false, "ar": [[2872.0, "وهذا التأويلُ لمعنى اليمين منقولٌ عن ابن عبّاس رضي الله تعالى عنهما أيضًا،"], [2879.0, "وهو قولُ أبي حنيفة ومالك."], [2881.0, "قال الإمامُ مالك رحمه الله تعالى في «الموطّأ»:"], [2884.0, "«أحسنُ ما سمعتُ في هذه أنّ اللغو حلفُ الإنسان على الشيء يستيقن أنه كذلك، ثم يجد الأمرَ بخلافه، فلا كفّارةَ عليه». انتهى."]], "tr": [[2872.0, "(Lağv) yeminin anlamına dair bu te'vil İbn Abbâs radıyallâhu teâlâ anhümâ'dan da nakledilmiştir;"], [2879.0, "Ebû Hanîfe'nin ve Mâlik'in görüşüdür."], [2881.0, "İmam Mâlik —Allah ona rahmet etsin— Muvatta'da şöyle demiştir:"], [2884.0, "\"Bu konuda işittiğim en güzel söz şudur:"], [2887.2, "Lağv, insanın öyle olduğundan emin olduğu bir şey üzerine yemin etmesi, sonra işi onun aksine bulmasıdır;"], [2895.0, "ona kefaret yoktur.\" (Sözü) bitti."]]}, {"reader": false, "ar": [[2897.0, "فإن قلتَ: لقد نقلتَ لنا خلافَ أهل العلم في تفسير لغو اليمين،"], [2902.0, "فأقول: هذا من باب خلاف التنوّع لا التضادّ؛"], [2907.0, "فيكون لغوُ اليمين يُراد به أمران:"], [2910.0, "نطقُ اللسان بلا قصد الجَنان،"], [2913.0, "وأن يحلف الإنسانُ على شيءٍ يجزم بصدق نفسه فيه ثم يتبيّن له خلافُه."], [2920.0, "والمتقرّر في القواعد أنّ اللفظ إذا فُسّر بتفسيرين أو أكثر لا تنافيَ بينهما حُمل عليهما."]], "tr": [[2897.0, "Eğer \"Bize lağv yeminin tefsirinde ilim ehlinin ihtilafını naklettin\" dersen, derim ki:"], [2902.7, "Bu, tezat ihtilafı değil, çeşitlilik (tenevvü') ihtilafı babındandır."], [2907.0, "Dolayısıyla lağv yeminden iki şey kastedilir:"], [2910.0, "kalbin kastı olmadan dilin söylemesi ve insanın, doğru söylediğine kesin inandığı bir şey üzerine yemin edip sonra aksinin ortaya çıkması."], [2920.0, "Kaidelerde yerleşik olan da şudur:"], [2921.4, "Bir lafız aralarında çelişki bulunmayan iki ya da daha fazla tefsirle tefsir edilirse, hepsine hamledilir."]]}]}, {"ts": "48:48", "title": "9. Külliye (Şeyh'in numarasıyla): Yalan olduğunu kesin bildiği bir şeye yemin eden gamûs yemin etmiştir", "paras": [{"reader": false, "ar": [[2928.0, "الكلّيّة التاسعة والأخيرة في هذا الدرس:"], [2932.0, "<b>كلُّ من حلف على أمرٍ يجزم بكذب يمينه فيه فغَموس.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span> والكلامُ على هذه الكلّيّة في مسائل مختصرة:"]], "tr": [[2928.0, "Bu dersteki 9. ve son külliye:"], [2930.7, "<b>9. külliye: Yemininde yalan söylediğini kesin olarak bildiği bir şey üzerine yemin eden herkesin (yemini) gamûstur.<\/b> (Üç kez tekrar ediyor.) Bu külliye hakkındaki söz birkaç kısa meselededir:"]]}, {"reader": false, "ar": [[2963.0, "المسألة الأولى: إن قيل لك:"], [2967.0, "ما اليمينُ الغموس؟ فقل:"], [2968.6, "هي أن يحلف الإنسانُ على أمرٍ في الماضي كاذبًا،"], [2973.7, "عالمًا بكذب نفسه فيه."], [2976.0, "فمن فعل ذلك فإنه آثمٌ باتّفاق المسلمين،"], [2980.8, "ومرتكبٌ لكبيرةٍ من كبائر الذنوب،"], [2985.0, "وعليه أن يستغفر منها."], [2987.0, "والراجحُ أنه لا يُشترط في تسميتها غموسًا اقتطاعُ حقّ الغير،"], [2998.0, "وتقييدُها بذلك في بعض الأحاديث إنما هو تنصيصٌ لبيان الأعظميّة،"], [3010.0, "وليس تخصيصًا لأصل كونها غموسًا."]], "tr": [[2963.0, "Birinci mesele: Sana \"Gamûs yemin nedir?\" denirse de ki:"], [2968.0, "İnsanın geçmişteki bir şey üzerine, kendisinin yalan söylediğini bilerek yalan yere yemin etmesidir."], [2976.0, "Bunu yapan kimse Müslümanların ittifakıyla günahkârdır ve büyük günahlardan birini işlemiştir;"], [2983.5, "ondan dolayı istiğfar etmesi gerekir."], [2987.0, "Râcih olan şudur: Ona gamûs denmesi için başkasının hakkını koparıp almak şart değildir."], [2993.3, "Bazı hadislerde onun bununla kayıtlanması, (gamûsun) en büyüğünü açıklamak için yapılmış bir vurgudur;"], [3008.2, "gamûs olmasının aslını (bununla) tahsis etmek değildir."]]}, {"reader": false, "ar": [[3015.0, "فلا يُشترط في القول الراجح أن يكون المقصودُ من اليمين الغموس اقتطاعَ مال امرئٍ مسلم،"], [3022.0, "بل ذلك أعظمُها في الأصحّ،"], [3025.0, "وإنما شرطُها لتكون غموسًا عِلمُه بكذب نفسه فيها."], [3032.0, "المسألة الثانية: لماذا سُمّيت غموسًا؟"], [3035.5, "الجواب: سُمّيت اليمينُ الغموسُ بذلك لأنها تغمس صاحبَها في الإثم في الدنيا،"], [3045.5, "وتغمسه بعد ذلك في النار في الآخرة."]], "tr": [[3015.0, "Dolayısıyla râcih görüşe göre gamûs yeminden maksadın bir Müslümanın malını koparıp almak olması şart değildir;"], [3020.5, "aksine en sahih görüşe göre bu, onun en büyüğüdür."], [3025.7, "Gamûs olması için şartı, onda yalan söylediğini bilmesidir."], [3032.0, "İkinci mesele: Niçin gamûs diye isimlendirildi?"], [3035.5, "Cevap: Gamûs yemin bu şekilde isimlendirildi;"], [3041.6, "çünkü sahibini dünyada günaha daldırır (gamseder), sonra da âhirette ateşe daldırır."]]}, {"reader": false, "ar": [[3050.0, "فإن قلتَ: وما دليلُ تحريمها؟"], [3053.5, "فأقول: لقد تواترت الأدلّةُ في تحريمها؛"], [3058.0, "فمن ذلك أنّ النبيّ صلى الله عليه وسلم جعلها من الكبائر،"], [3062.8, "كما روى الإمامُ البخاريّ في «صحيحه» من حديث عبد الله بن عمر قال:"], [3068.6, "قال النبيّ صلى الله عليه وسلم:"], [3072.0, "«الكبائر: الإشراكُ بالله، وعقوقُ الوالدين، واليمينُ الغموس، وقتلُ النفس»،"], [3077.0, "أو كما قال صلى الله عليه وسلم."]], "tr": [[3050.0, "Eğer \"Onun haramlığının delili nedir?\" dersen, derim ki:"], [3053.5, "Haramlığı hakkında deliller tevâtür derecesine ulaşmıştır."], [3058.0, "Bunlardan biri, Peygamber sallallâhu aleyhi ve sellem'in onu büyük günahlardan saymasıdır."], [3063.2, "Nitekim İmam Buhârî Sahîh'inde Abdullah b."], [3065.8, "Ömer hadisinden şöyle rivayet etmiştir:"], [3068.6, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [3072.0, "\"Büyük günahlar şunlardır: Allah'a şirk koşmak, anne-babaya isyan etmek, gamûs yemin ve cana kıymak.\" Ya da sallallâhu aleyhi ve sellem'in buyurduğu gibi."]]}, {"reader": false, "ar": [[3080.9, "وروى الإمامُ البخاريّ ومسلم أيضًا من حديث ابن مسعود رضي الله عنه قال:"], [3086.4, "قال النبيّ صلى الله عليه وسلم:"], [3089.0, "«من حلف على يمينٍ يقتطع بها مالَ امرئٍ مسلمٍ هو عليها فاجرٌ» ـ يعني يعلم كذبَ نفسه فيها ـ «لقي اللهَ وهو عليه غضبان»."], [3102.3, "فأنزل الله عز وجل تصديقًا لذلك:"], [3105.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ يَشْتَرُونَ بِعَهْدِ اللَّهِ وَأَيْمَانِهِمْ ثَمَنًا قَلِيلًا﴾<\/span> <span class=\"ref\">[آل عمران: ٧٧]<\/span> الآيةَ بتمامها."]], "tr": [[3080.9, "İmam Buhârî ve Müslim de İbn Mes'ûd radıyallâhu anh hadisinden şöyle rivayet etmiştir:"], [3086.4, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [3089.0, "\"Kim fâcir (yalancı) olarak, onunla bir Müslümanın malını koparıp alacağı bir yemin ederse\" —yani onda yalan söylediğini bilerek— \"Allah ona gazaplı olduğu hâlde Allah'a kavuşur.\" Allah Azze ve Celle de bunu tasdik etmek üzere şunu indirdi:"], [3105.0, "<span class=\"ayah\">﴿Allah'a verdikleri sözü ve yeminlerini az bir bedele satanlar…﴾<\/span> [Âl-i İmrân 77] ayetin tamamı."]]}, {"reader": false, "ar": [[3110.9, "وروى الإمامُ مسلمٌ في «صحيحه» من حديث أبي أُمامة رضي الله عنه أنّ النبيّ صلى الله عليه وسلم قال:"], [3118.0, "«من اقتطع حقَّ امرئٍ مسلمٍ بيمينه فقد أوجب الله له النار، وحرّم عليه الجنّة»،"], [3125.0, "قال رجل: يا رسول الله،"], [3127.2, "وإن كان شيئًا يسيرًا؟"], [3129.0, "قال: «وإن قضيبًا من أراك»."]], "tr": [[3110.9, "İmam Müslim Sahîh'inde Ebû Ümâme radıyallâhu anh hadisinden, Peygamber sallallâhu aleyhi ve sellem'in şöyle buyurduğunu rivayet etmiştir:"], [3118.0, "\"Kim yeminiyle bir Müslümanın hakkını koparıp alırsa, Allah ona ateşi vâcip kılmış ve cenneti ona haram kılmıştır.\" Bir adam:"], [3125.9, "\"Ey Allah'ın Resûlü, az bir şey olsa bile mi?\" dedi."], [3129.0, "\"Bir misvak (erak) dalı bile olsa\" buyurdu."]]}, {"reader": false, "ar": [[3134.0, "ومن المسائل أيضًا ـ وأظنّها الثالثة ـ:"], [3138.0, "إن قلتَ: وهل اليمين الغموس فيها كفّارة؟"], [3142.0, "فأقول: اتّفق أهلُ العلم رحمهم الله تعالى أنها محرّمة،"], [3148.0, "ولكن اختلفوا في وجه كفّارتها؛"], [3154.0, "فذهب بعضُ أهل العلم ـ وهو قول الجمهور ـ بأنه لا كفّارة فيها،"], [3160.8, "وهو الأصحّ، وذلك لأمرين:"]], "tr": [[3134.0, "Meselelerden biri de —sanırım üçüncüsü—:"], [3138.0, "Eğer \"Gamûs yeminde kefaret var mıdır?\" dersen, derim ki:"], [3142.0, "İlim ehli —Allah onlara rahmet etsin— onun haram olduğunda ittifak etmişlerdir;"], [3148.0, "ama kefaretinin yönü hakkında ihtilaf etmişlerdir."], [3154.0, "İlim ehlinden bir kısmı —ki bu cumhurun görüşüdür— onda kefaret olmadığı görüşüne gitmiştir;"], [3158.9, "en sahih olan da budur."], [3160.8, "Bu da iki sebepten dolayıdır:"]]}, {"reader": false, "ar": [[3166.0, "الأمرُ الأوّل: أنّ اليمين الغموس ممّا هي حرامٌ بالأصالة،"], [3175.0, "والمتقرّر في القواعد أنّ كلّ ما كان محرّمًا تحريمَ أصالةٍ فلا مدخلَ للكفّارات فيه."], [3182.0, "فالزنا لا كفّارةَ فيه لأنه محرّمٌ تحريمَ أصالة،"], [3187.0, "والكذبُ لا كفّارةَ فيه لأنه محرّمٌ تحريمَ أصالة."], [3192.0, "ولكنّ تقليمَ الأظفار في النسك فيه كفّارة لأنه كان حلالًا بالأصالة وحُرّم لعارض،"], [3199.0, "والحِنثُ في تحريم الحلال فيه كفّارة لأنه كان حلالًا قبل أن يحلف بتحريمه."]], "tr": [[3166.0, "Birinci sebep: Gamûs yemin, aslen (bizzat) haram olan şeylerdendir."], [3175.0, "Kaidelerde yerleşik olan da şudur:"], [3177.5, "Aslen haram kılınmış olan her şeyde kefaretlerin yeri yoktur."], [3182.0, "Zinada kefaret yoktur; çünkü aslen haram kılınmıştır."], [3185.1, "Yalanda kefaret yoktur; çünkü aslen haram kılınmıştır."], [3188.2, "Fakat hac/umre ibadetinde (ihramlıyken) tırnak kesmede kefaret vardır;"], [3192.0, "çünkü aslen helaldi ve arızî bir sebeple haram kılındı."], [3196.8, "Helali haram kılmaya dair yemini bozmada da kefaret vardır;"], [3202.4, "çünkü onu haram kılmaya yemin etmeden önce helaldi."]]}, {"reader": false, "ar": [[3210.0, "فالكفّارةُ لا تدخل إلا فيما كان أصلُه الحِلّ ثم حُرّم لعارض،"], [3216.0, "فحينئذٍ يكون تحريمُه من التحريم الخفيف الذي ترفعه الكفّارة."], [3224.0, "وأمّا ما كان محرّمًا تحريمَ أصالةٍ فإنّ تحريمه يُعتبر تحريمًا ثقيلًا شديدًا،"], [3232.0, "وليس من شأن الكفّارة أن ترفع ذلك التحريم."], [3236.0, "فدخولُ الكفّارة في بعض المحرّمات دليلٌ على خفّة تحريمها،"], [3241.0, "وعدمُ دخولها في بعض المحرّمات دليلٌ على شدّة تحريمها."]], "tr": [[3210.0, "Dolayısıyla kefaret ancak aslı helal olup sonra arızî bir sebeple haram kılınan şeye girer."], [3216.7, "Bu durumda onun haramlığı, kefaretin kaldırdığı hafif haramlıktan olur."], [3224.0, "Aslen haram kılınmış olana gelince, onun haramlığı ağır ve şiddetli bir haramlık sayılır;"], [3232.5, "o haramlığı kaldırmak kefaretin işi değildir."], [3236.0, "Kefaretin bazı haramlara girmesi, onların haramlığının hafifliğine delildir;"], [3241.0, "bazı haramlara girmemesi de onların haramlığının şiddetine delildir."]]}, {"reader": false, "ar": [[3247.0, "ولذلك دخلت الكفّارةُ في قتل الخطأ،"], [3250.0, "لأنه لا يأثم صاحبُه،"], [3252.0, "إذ إنه أزهق النفسَ خطأً،"], [3255.0, "لكنّ قتلَ العمد العدوان لا تدخله الكفّارة،"], [3260.0, "فليس فيه لا عتقُ رقبةٍ ولا صيامُ شهرين متتابعين."], [3264.0, "وبما أنّ يمين الغموس ليس تحريمُها تحريمًا عارضًا،"], [3273.0, "وإنما تحريمُها تحريمُ أصالة، لا تدخلها الكفّارة."]], "tr": [[3247.0, "Bu yüzden kefaret hata ile öldürmeye girmiştir;"], [3251.5, "çünkü onu yapan günahkâr olmaz, zira canı hata ile almıştır."], [3259.3, "Fakat kasıtlı ve düşmanca öldürmeye kefaret girmez;"], [3264.0, "onda ne köle azat etmek ne de iki ay peş peşe oruç tutmak vardır."], [3271.6, "Gamûs yeminin haramlığı arızî bir haramlık olmayıp aslî bir haramlık olduğuna göre, ona kefaret girmez."]]}, {"reader": false, "ar": [[3280.0, "والعلّةُ الثانية: أنّ الكفّارة إنما تدخل في التحريم الخفيف،"], [3285.0, "وأمّا ما كان تحريمُه شديدًا مغلّظًا فإنّ الكفّارة لا تقوى على رفعه."], [3294.0, "ولذلك روى ابنُ أبي الجعد ـ روى ابنُ الجعد ـ في «مسنده» بسندٍ صحيحٍ عن ابن مسعود رضي الله عنه قال:"], [3303.0, "«كنّا نعدّ الذنبَ الذي لا كفّارةَ له: اليمينَ الغموس»،"], [3312.0, "قيل: وما اليمينُ الغموس؟"], [3315.0, "قال: «اقتطاعُ الرجل مالَ أخيه باليمين الكاذبة»."]], "tr": [[3280.0, "İkinci illet: Kefaret ancak hafif haramlığa girer;"], [3284.6, "haramlığı şiddetli ve ağır olana gelince, kefaret onu kaldırmaya güç yetiremez."], [3294.0, "Bu yüzden İbn Ebi'l-Ca'd —İbnü'l-Ca'd— Müsned'inde sahih bir senedle İbn Mes'ûd radıyallâhu anh'ın şöyle dediğini rivayet etmiştir:"], [3303.0, "\"Kefareti olmayan günahı gamûs yemin sayardık.\" \"Gamûs yemin nedir?\" denildi."], [3312.8, "\"Kişinin yalan yeminle kardeşinin malını koparıp almasıdır\" dedi."]]}, {"reader": false, "ar": [[3319.0, "فجعل ابنُ مسعود اليمينَ التي لا تدخلها الكفّارة هي اليمينَ الغموس،"], [3325.1, "وهذا قولُ صحابيٍّ ولا يُعلم له مخالفٌ من الصحابة."], [3330.0, "ولأنّ الأحاديث الواردة في تحريمها وردت مطلقةً من غير نصٍّ على كفّارةٍ فيها."], [3341.0, "فهذا هو القولُ الراجح،"], [3343.0, "وهو قولُ الجمهور كما ذكرتُ لكم."]], "tr": [[3319.0, "İbn Mes'ûd, kefaretin girmediği yemini gamûs yemin saymıştır."], [3323.4, "Bu bir sahabinin sözüdür ve sahabeden ona muhalif olan bilinmemektedir."], [3330.0, "Ayrıca onun haramlığı hakkında gelen hadisler, onda kefaret olduğuna dair bir nass olmaksızın mutlak olarak gelmiştir."], [3341.5, "İşte râcih görüş budur; size zikrettiğim gibi cumhurun görüşüdür."]]}, {"reader": false, "ar": [[3346.0, "ولذلك قال ابنُ القيّم رحمه الله كلامًا جميلًا موفّقًا،"], [3351.0, "قال: «وما كان من المعاصي محرَّمَ الجنس ـ كالظلم والفواحش ـ فإنّ الشارع لم يشرع له كفّارة؛ ولهذا لا كفّارةَ في الزنا، وشربِ الخمر، وقذفِ المحصنات، والسرقة. وطردُ ذلك» ـ أي والقياسُ على ذلك ـ «أنه لا كفّارةَ في قتل العمد، ولا في اليمين الغموس، كما يقوله أحمد وأبو حنيفة ومن وافقهما. وليس ذلك تخفيفًا عن مرتكبهما، بل لأنّ الكفّارة لا تعمل في هذا الجنس من المعاصي، وإنما عملُها فيما كان مباحًا في الأصل وحُرّم لعارض، كالوطء في الصيام والإحرام»."]], "tr": [[3346.0, "Bu yüzden İbnü'l-Kayyim —Allah ona rahmet etsin— güzel ve isabetli bir söz söylemiştir:"], [3352.4, "\"Zulüm ve hayâsızlıklar gibi cinsi itibarıyla haram olan günahlara Şâri' kefaret meşru kılmamıştır."], [3362.5, "Bu yüzden zinada, içki içmede, iffetli kadınlara zina iftirasında ve hırsızlıkta kefaret yoktur."], [3371.0, "Bunun tutarlı şekilde devamı\" —yani buna kıyas— \"kasten öldürmede ve gamûs yeminde de kefaret olmamasıdır;"], [3378.8, "Ahmed'in, Ebû Hanîfe'nin ve onlara muvafakat edenlerin dediği gibi."], [3383.9, "Bu, bu ikisini işleyene bir hafifletme değildir;"], [3388.2, "aksine kefaret bu cins günahlarda iş görmediği içindir."], [3393.2, "Kefaretin işi, ancak aslen mubah olup arızî bir sebeple haram kılınan şeylerdedir;"], [3402.0, "oruçta ve ihramda cinsel ilişki gibi.\""]]}, {"reader": false, "ar": [[3406.0, "انتهى كلامه، وهو كلامٌ واضحٌ نختم به هذه الكلّيّات."], [3410.0, "وأسأل الله أن يعلّمنا وإيّاكم العلمَ النافع،"], [3413.0, "مقرونًا بالعمل الصالح، وآخرُ دعوانا أنِ الحمدُ لله ربِّ العالمين،"], [3417.0, "وصلّى الله وسلّم على نبيّنا محمّد."]], "tr": [[3406.0, "Sözü burada bitti. Bu, bu külliyeleri kendisiyle bitirdiğimiz açık bir sözdür."], [3410.0, "Allah'tan, bize ve size sâlih amelle birlikte faydalı ilmi öğretmesini dilerim."], [3414.3, "Son duamız, âlemlerin Rabbi Allah'a hamd olsun (demektir)."], [3416.7, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};

function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
