<script>
const D={"no": 42, "vid": "3WGg885T9F4", "title_ar": "الدرس (٤٢) من شرح كليات العقيدة — من كليات توحيد الألوهية: المحبة والأيمان", "title_tr": "Şerhu Külliyyâti'l-Akîde — 42. Ders: Ulûhiyyet Tevhidi Külliyeleri (Şirk Sevgisi, Fıtrî Sevgi, Mahlûk ile Yemin, Allah'ın İsimleri, Sıfatları ve O'na Delâleti Saf Haberlerle Yemin, Allah'tan Başkasıyla Yeminin Çaresi, Lağv Yemin, Gamûs Yemin)", "sections": [{"ts": "00:02", "title": "Giriş · 1. Külliye: Allah ile birlikte mahlûka duyulan, tam zillet, boyun eğiş ve itaati gerektiren sevgi büyük şirktir", "paras": [{"reader": false, "ar": [[2.0, "الحمدُ لله ربِّ العالمين،"], [4.5, "والصلاةُ والسلامُ على رسول الله الأمين،"], [8.2, "وعلى آله وأصحابه الطيبين الطاهرين،"], [11.3, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [15.1, "أمّا بعد: فعندنا ـ بإذن الله عز وجل ـ جُمَلٌ من الكلّيّات في توحيد الألوهية،"], [23.1, "مُستكمِلين بهذه الكلّيّات العشر في هذا الدرس ما مضى من الكلّيّات السابقة."], [34.0, "(عليكم السلام.) الكلّيّة الأولى:"], [37.5, "<b>كلُّ محبّةٍ لمخلوقٍ مع الله تستلزم كمالَ الذلّ والخضوع وكمالَ الطاعة للمحبوب فشركٌ أكبر.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[2.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [4.5, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [16.3, "Bundan sonra: Allah Azze ve Celle'nin izniyle elimizde ulûhiyyet tevhidine dair birtakım külliyeler var;"], [25.0, "bu dersteki bu on külliye ile geçmiş külliyeleri tamamlıyoruz."], [34.0, "(Ve aleykümüsselâm.) <b>1. külliye: Allah ile birlikte bir mahlûka duyulan ve sevilene karşı tam bir zillet ve boyun eğişi ve tam bir itaati gerektiren her sevgi büyük şirktir.<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[85.0, "أقول وبالله التوفيق: وهذه الكلّيّة تبيّن لك الضابطَ في مسألة المحبّة الشركيّة."], [94.0, "وذلك لأنّ المحبّة تنقسم إلى جُمَلٍ من الأقسام:"], [98.0, "أعظمُها وأساسُ التوحيد فيها هي محبّةُ الله تبارك وتعالى،"], [104.0, "وعليها قِوامُ دين الإسلام."], [107.0, "فإنّ الإنسان لا يصحّ وصفُه بأنه مسلم إلا إذا كان مبدأُ دخوله في الإسلام محبّةَ الله،"], [114.0, "ومحبّةَ رسوله صلى الله عليه وسلم،"], [117.0, "ومحبّةَ شريعته. فالمحبّة في الإسلام تُعتبر أساسَ الملّة،"], [123.0, "وأصلَ الأصول، وأعظمَ الواجبات."]], "tr": [[85.0, "Tevfik Allah'tandır, derim ki: Bu külliye sana şirk sevgisi meselesindeki zâbıtı açıklar."], [94.0, "Bu şundandır: Sevgi birtakım kısımlara ayrılır."], [98.0, "Bunların en büyüğü ve içlerinde tevhidin temeli olanı, Allah Tebâreke ve Teâlâ'yı sevmektir;"], [107.0, "İslâm dininin ayakta durması da ona bağlıdır."], [109.1, "Çünkü insanın İslâm'a girişinin başlangıcı Allah sevgisi, Resûlü sallallâhu aleyhi ve sellem'in sevgisi ve O'nun şeriatinin sevgisi olmadıkça, onun Müslüman diye nitelenmesi sahih olmaz."], [118.0, "Dolayısıyla sevgi İslâm'da milletin temeli, asılların aslı ve vâciplerin en büyüğü sayılır."]]}, {"reader": false, "ar": [[126.0, "ولذلك قال النبيّ صلى الله عليه وسلم:"], [130.0, "«ثلاثٌ من كنّ فيه وجد بهنّ حلاوةَ الإيمان: أن يكون اللهُ ورسولُه أحبَّ إليه ممّا سواهما» الحديثَ بتمامه."], [140.0, "ويقول النبيّ صلى الله عليه وسلم في حديث العبّاس:"], [144.0, "«يا عمّ، ذاق طعمَ الإيمان من رضي بالله ربًّا، وبالإسلام دينًا، وبمحمّدٍ رسولًا»."], [152.0, "ويقول النبيّ صلى الله عليه وسلم:"], [154.7, "«لا يؤمن أحدُكم حتى أكونَ أحبَّ إليه من والده وولده والناس أجمعين»."]], "tr": [[126.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [130.0, "\"Üç şey vardır ki, kimde bulunursa onlarla imanın tadını bulur:"], [133.5, "Allah ve Resûlü'nün ona bunların dışındaki her şeyden daha sevgili olması…\" hadisin tamamı (bilinir)."], [140.0, "Peygamber sallallâhu aleyhi ve sellem Abbâs hadisinde şöyle buyurur:"], [144.0, "\"Ey amca! Rab olarak Allah'tan, din olarak İslâm'dan ve resul olarak Muhammed'den razı olan, imanın tadını tatmıştır.\" Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [154.7, "\"Ben birinize babasından, çocuğundan ve bütün insanlardan daha sevgili olmadıkça, (gerçek manada) iman etmiş olmaz.\""]]}, {"reader": false, "ar": [[162.0, "ويقول الله عز وجل ـ مبيّنًا خطرَ تقديم المحابّ الثمانِ الدنيويّة على محبّة الله ورسوله ـ:"], [173.0, "<span class=\"ayah\">﴿قُلْ إِن كَانَ آبَاؤُكُمْ وَأَبْنَاؤُكُمْ وَإِخْوَانُكُمْ وَأَزْوَاجُكُمْ وَعَشِيرَتُكُمْ وَأَمْوَالٌ اقْتَرَفْتُمُوهَا وَتِجَارَةٌ تَخْشَوْنَ كَسَادَهَا وَمَسَاكِنُ تَرْضَوْنَهَا أَحَبَّ إِلَيْكُم مِّنَ اللَّهِ وَرَسُولِهِ وَجِهَادٍ فِي سَبِيلِهِ فَتَرَبَّصُوا حَتَّىٰ يَأْتِيَ اللَّهُ بِأَمْرِهِ ۗ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الْفَاسِقِينَ﴾<\/span> <span class=\"ref\">[التوبة: ٢٤]<\/span>."]], "tr": [[162.0, "Allah Azze ve Celle, sekiz dünyevî sevgiliyi Allah ve Resûlü'nün sevgisinin önüne geçirmenin tehlikesini açıklayarak şöyle buyurur:"], [173.0, "<span class=\"ayah\">﴿De ki: Eğer babalarınız, oğullarınız, kardeşleriniz, eşleriniz, akrabanız, kazandığınız mallar, kesada uğramasından korktuğunuz ticaret ve hoşlandığınız meskenler size Allah'tan, Resûlü'nden ve O'nun yolunda cihad etmekten daha sevgili ise, Allah emrini getirinceye kadar bekleyin. Allah fâsıklar topluluğunu doğru yola iletmez﴾<\/span> [Tevbe 24]."]]}, {"reader": false, "ar": [[200.0, "والقسمُ الثاني: المحبّةُ في الله،"], [203.4, "وهي فرعٌ عن محبّة الله عز وجل."], [211.0, "وعليها قولُ النبيّ صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل:"], [216.2, "«وجبت محبّتي للمتحابّين فيّ، والمتباذلين فيّ، والمتجالسين فيّ، والمتزاورين فيّ»."], [228.0, "ويقول النبيّ صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل:"], [233.0, "«أين المتحابّون في جلالي؟ اليوم أُظِلُّهم في ظلّي يومَ لا ظلَّ إلا ظلّي»."], [243.0, "وهي محبّةُ الإيمان، ومحبّةُ الدين، وأُخوّةُ الشريعة."]], "tr": [[200.0, "İkinci kısım: Allah için sevgidir;"], [202.7, "bu, Allah Azze ve Celle'yi sevmenin bir dalıdır."], [211.0, "Peygamber sallallâhu aleyhi ve sellem'in Rabbi Azze ve Celle'den rivayet ettiği şu söz bunu ifade eder:"], [216.2, "\"Benim için birbirini sevenlere, benim için birbirine cömertçe harcayanlara, benim için birlikte oturanlara ve benim için birbirini ziyaret edenlere sevgim vâcip oldu.\" Peygamber sallallâhu aleyhi ve sellem Rabbi Azze ve Celle'den rivayet ettiği hadiste şöyle buyurur:"], [233.0, "\"Celâlim için birbirini sevenler nerede?"], [235.7, "Bugün, benim gölgemden başka gölgenin olmadığı günde onları gölgemde gölgelendireceğim.\" Bu, iman sevgisi, din sevgisi ve şeriat kardeşliğidir."]]}, {"reader": false, "ar": [[247.0, "القسمُ الثالث: محبّةُ ما يحبّه الله ورسوله."], [254.0, "فجميعُ الأشياء التي يحبّها الله ورسولُه صلى الله عليه وسلم يجب علينا ـ إن كنّا نحبّهما ـ أن نحبّ هذه الأشياء:"], [265.0, "فنحبّ شريعةَ الله، ونحبّ الصلاة،"], [268.6, "ونحبّ تربيةَ اللِّحى، ونحبّ تقصيرَ الثياب،"], [273.5, "ونحبّ حجابَ المرأة. وهكذا في سائر ما أمر الله عز وجل به أمرَ إيجابٍ أو استحباب،"], [281.0, "فإننا لا بدّ وأن نحبّه."], [283.0, "وأنتم ترون أنّ المحبّة في الله ومحبّةَ ما يحبّه الله هما فرعان على أصل المحبّة الأولى،"], [294.1, "وهي محبّةُ الله عز وجل."]], "tr": [[247.0, "Üçüncü kısım: Allah'ın ve Resûlü'nün sevdiği şeyleri sevmektir."], [254.0, "Allah'ın ve Resûlü sallallâhu aleyhi ve sellem'in sevdiği bütün şeyleri —eğer O ikisini seviyorsak— bizim de sevmemiz vâciptir:"], [265.0, "Allah'ın şeriatini severiz, namazı severiz, sakal bırakmayı severiz, elbiseleri kısaltmayı severiz, kadının örtünmesini severiz."], [275.0, "Allah Azze ve Celle'nin vücûb ya da istihbâb emriyle emrettiği diğer her şeyde de böyledir;"], [281.3, "onu mutlaka sevmemiz gerekir. Görüyorsunuz ki Allah için sevmek ve Allah'ın sevdiğini sevmek, ilk sevginin, yani Allah Azze ve Celle sevgisinin aslı üzerine (kurulmuş) iki daldır."]]}, {"reader": false, "ar": [[298.0, "ومحبّةُ الله لا تكون صادقةً إلا إذا كانت محبّةً مبنيّةً على كمال الذلّ لهذا المحبوب،"], [309.3, "والخضوعِ لهذا المحبوب، وكمالِ الطاعة لهذا المحبوب."], [317.0, "فمتى ما اختلّ شيءٌ من هذه الأمور الثلاثة فإنّ دعوى محبّتك لله عز وجل يختلّ صدقُها بقدر ما اختلّ من هذه الأمور."], [328.0, "وبما أننا عرفنا أنّ محبّة الله التعبّديّة مبنيّةٌ على الذلّ والخضوع والطاعة، فبناءً على ذلك:"]], "tr": [[298.0, "Allah sevgisi ancak bu sevilene karşı tam bir zillet, bu sevilene boyun eğiş ve bu sevilene tam bir itaat üzerine kurulu bir sevgi olduğunda sadık (gerçek) olur."], [318.1, "Bu üç şeyden herhangi biri bozulduğunda, Allah Azze ve Celle'yi sevdiğin iddiasının doğruluğu da bu şeylerden bozulan kadar bozulur."], [328.0, "Allah'a yönelik taabbudî sevginin zillet, boyun eğiş ve itaat üzerine kurulu olduğunu öğrendiğimize göre, buna binaen:"]]}, {"reader": false, "ar": [[339.0, "فكلُّ من أحبّ مخلوقًا مع الله عز وجل محبّةً تستلزم كمالَ الذلّ لهذا المحبوب من دون الله عز وجل،"], [350.0, "وكمالَ الخضوع لهذا المحبوب من دون الله عز وجل،"], [354.0, "وكمالَ الطاعة لهذا المحبوب من دون الله عز وجل،"], [358.0, "فلا جرمَ أنه قد جعله مساويًا لله عز وجل في المحبّة،"], [367.0, "فيكون ذلك داخلًا في قول الله عز وجل:"], [370.0, "<span class=\"ayah\">﴿وَمِنَ النَّاسِ مَن يَتَّخِذُ مِن دُونِ اللَّهِ أَندَادًا يُحِبُّونَهُمْ كَحُبِّ اللَّهِ ۖ وَالَّذِينَ آمَنُوا أَشَدُّ حُبًّا لِّلَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ١٦٥]<\/span>؛"], [384.9, "أي أشدُّ طاعةً لله،"], [387.3, "وأشدُّ خضوعًا لله، وأشدُّ ذلًّا لله تبارك وتعالى."]], "tr": [[339.0, "Allah Azze ve Celle ile birlikte bir mahlûku;"], [342.5, "Allah Azze ve Celle'yi bırakıp bu sevilene tam zillet, Allah Azze ve Celle'yi bırakıp bu sevilene tam boyun eğiş ve Allah Azze ve Celle'yi bırakıp bu sevilene tam itaat gerektiren bir sevgiyle seven herkes, şüphesiz onu sevgide Allah Azze ve Celle'ye denk kılmıştır."], [364.2, "Bu da Allah Azze ve Celle'nin şu sözünün kapsamına girer:"], [370.0, "<span class=\"ayah\">﴿İnsanlardan öyleleri vardır ki, Allah'ı bırakıp O'na birtakım denkler edinir ve onları Allah'ı sever gibi severler. İman edenlerin Allah'a sevgisi ise çok daha güçlüdür﴾<\/span> [Bakara 165];"], [384.9, "yani Allah'a itaatleri daha güçlü, Allah'a boyun eğişleri daha güçlü, Allah Tebâreke ve Teâlâ'ya karşı zilletleri daha güçlüdür."]]}, {"reader": false, "ar": [[392.0, "والمتقرّرُ في القواعد أنّ كلَّ من سوّى غيرَ الله بالله في شيءٍ من خصائص الله ـ المساواةَ المطلقة ـ فقد وقع في الشرك الأكبر."], [407.0, "وبناءً على ذلك: إذا قيل لك:"], [410.0, "ما ضابطُ المحبّة الشركيّة؟"], [412.0, "فقل: هو أن يحبّ الإنسانُ محبوبَه كمحبّة العابد لربّه."], [421.0, "فالعابدُ يحبّ ربَّه، بمعنى أنّ قلبه متعلّقٌ به ذلًّا وخضوعًا وانكسارًا وتعظيمًا وطاعةً،"], [432.0, "بما لا يشاركه فيها أحدٌ من المخلوقات."]], "tr": [[392.0, "Kaidelerde yerleşik olan şudur: Allah'ın hususiyetlerinden herhangi birinde Allah'tan başkasını Allah'a —mutlak bir denklikle— denk tutan herkes büyük şirke düşmüştür."], [407.0, "Buna binaen sana \"Şirk sevgisinin zâbıtı nedir?\" denirse de ki:"], [412.0, "İnsanın sevdiğini, âbidin (kulun) Rabbini sevmesi gibi sevmesidir."], [421.0, "Âbid Rabbini sever; yani kalbi O'na zillet, boyun eğiş, kırıklık, tazim ve itaatle bağlıdır;"], [429.1, "öyle ki mahlûkattan hiç kimse bunda O'na ortak olmaz."]]}, {"reader": false, "ar": [[439.0, "فشركُ المحبّة هو اتّخاذُ الأنداد من المخلوقين،"], [443.0, "فيحبّهم كحبّ الله عز وجل."], [445.0, "ومن لوازم هذه المحبّة أن يقدّم طاعتَهم على طاعة الله سبحانه،"], [451.0, "وهذا يناقض أصلَ التوحيد،"], [455.0, "ويناقض وجوبَ إفراد الله عز وجل بهذه المحبّة."], [462.0, "فمحبّةُ العبوديّة هي تلك المحبّةُ القائمةُ على هذه الأركان الثلاثة:"], [469.0, "أي كمال الذلّ، وكمال الخضوع، وكمال الطاعة."]], "tr": [[439.0, "Sevgi şirki, mahlûklardan denkler edinip onları Allah Azze ve Celle'yi sever gibi sevmektir."], [445.0, "Bu sevginin lâzımlarından biri, onlara itaati Allah Sübhânehû'ya itaatin önüne geçirmesidir."], [449.9, "Bu da tevhidin aslıyla ve bu sevgide Allah Azze ve Celle'yi birlemenin vâcip oluşuyla çelişir."], [462.0, "Kulluk sevgisi, işte bu üç rükün üzerine kurulu sevgidir:"], [469.0, "tam zillet, tam boyun eğiş ve tam itaat."]]}, {"reader": false, "ar": [[474.0, "يقول الله عز وجل:"], [477.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا مَن يَرْتَدَّ مِنكُمْ عَن دِينِهِ فَسَوْفَ يَأْتِي اللَّهُ بِقَوْمٍ يُحِبُّهُمْ وَيُحِبُّونَهُ﴾<\/span> <span class=\"ref\">[المائدة: ٥٤]<\/span>."], [486.0, "ويقول الله عز وجل عن قوم إبراهيم لمّا دخلوا النار،"], [494.5, "قالوا: <span class=\"ayah\">﴿تَاللَّهِ إِن كُنَّا لَفِي ضَلَالٍ مُّبِينٍ ۝ إِذْ نُسَوِّيكُم بِرَبِّ الْعَالَمِينَ﴾<\/span> <span class=\"ref\">[الشعراء: ٩٧–٩٨]<\/span>."], [500.0, "قال السلف: لم يسوّوا معبوداتِهم بالله عز وجل في الخلق والتدبير والرزق،"], [507.0, "ولكن سوَّوهم في المحبّة؛"], [510.0, "فكانوا يحبّون أندادَهم، وينصرونها،"], [512.7, "ويدافعون عنها، ويخضعون عندها،"], [515.3, "ويطوفون حولها، ويعظّمونها كتعظيم الله عز وجل."]], "tr": [[474.0, "Allah Azze ve Celle şöyle buyurur:"], [477.0, "<span class=\"ayah\">﴿Ey iman edenler! Sizden kim dininden dönerse, Allah onları seven ve onların da O'nu sevdiği bir topluluk getirecektir﴾<\/span> [Mâide 54]."], [486.0, "Allah Azze ve Celle, İbrâhim'in kavmi hakkında, ateşe girdiklerinde şöyle dediklerini bildirir:"], [493.5, "<span class=\"ayah\">﴿Allah'a yemin olsun ki biz apaçık bir sapıklık içindeymişiz. Çünkü sizi âlemlerin Rabbine denk tutuyorduk﴾<\/span> [Şuarâ 97–98]."], [500.0, "Selef şöyle demiştir: Mabutlarını yaratma, tedbir (yönetme) ve rızık vermede Allah Azze ve Celle'ye denk tutmadılar;"], [506.4, "fakat sevgide denk tuttular. Denklerini severler, onlara yardım ederler, onları savunurlar, yanlarında boyun eğerler, etraflarında tavaf ederler ve onları Allah Azze ve Celle'yi tazim eder gibi tazim ederlerdi."]]}, {"reader": false, "ar": [[523.0, "قال الإمامُ ابنُ القيّم رحمه الله تعالى في قول الله عز وجل:"], [533.0, "<span class=\"ayah\">﴿وَمِنَ النَّاسِ مَن يَتَّخِذُ مِن دُونِ اللَّهِ أَندَادًا يُحِبُّونَهُمْ كَحُبِّ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ١٦٥]<\/span>،"], [538.0, "قال: «أخبر الله تعالى أنّ من أحبّ من دون الله شيئًا كما يحبّ اللهَ تعالى فهو ممّن اتّخذ من دون الله أندادًا. فهذا نِدٌّ في المحبّة، لا في الخلق والربوبيّة؛ فإنّ أحدًا من أهل الأرض لم يُثبت هذا النِّدّ، بخلاف نِدّ المحبّة، فإنّ أكثر أهل الأرض قد اتّخذوا من دون الله أندادًا في الحبّ والتعظيم»."]], "tr": [[523.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— Allah Azze ve Celle'nin <span class=\"ayah\">﴿İnsanlardan öyleleri vardır ki, Allah'ı bırakıp O'na birtakım denkler edinir ve onları Allah'ı sever gibi severler﴾<\/span> [Bakara 165] sözü hakkında şöyle demiştir:"], [533.0, "\"Allah Teâlâ, Allah'ı bırakıp bir şeyi Allah Teâlâ'yı sever gibi seven kimsenin, Allah'ı bırakıp denkler edinenlerden olduğunu haber vermiştir."], [536.6, "Bu, yaratma ve rubûbiyyette değil, sevgide bir denktir."], [538.5, "Çünkü yeryüzü halkından hiç kimse bu (yaratma ve rubûbiyyetteki) denki ispat etmemiştir."], [551.2, "Sevgideki denk ise böyle değildir;"], [557.1, "yeryüzü halkının çoğu Allah'ı bırakıp sevgi ve tazimde denkler edinmiştir.\""]]}, {"reader": false, "ar": [[567.0, "وقال الإمامُ ابنُ القيّم رحمه الله أيضًا:"], [571.4, "«وهؤلاء المشركون يحبّون أوثانَهم وأصنامَهم وآلهتَهم مع الله كما يحبّون الله، فهذه محبّةُ تألُّهٍ وموالاة، يتبعها الخوفُ والرجاءُ والعبادةُ والدعاء، وهذه المحبّة هي محضُ الشرك الذي لا يغفره الله عز وجل»."], [594.0, "وقال الشيخ سليمانُ بنُ عبد الله بن عبد الوهّاب رحمه الله تعالى في «تيسير العزيز الحميد»:"], [601.0, "«القسم الثاني: المحبّة الخاصّة التي لا تصلح إلا لله عز وجل، ومتى أحبّ العبدُ بها غيرَه كان شركًا لا يغفره الله، وهي محبّة العبوديّة المستلزمة للذلّ والخضوع والتعظيم وكمال الطاعة وإيثاره على غيره."]], "tr": [[567.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şunu da söylemiştir:"], [571.4, "\"Bu müşrikler, vesenlerini, putlarını ve ilâhlarını Allah ile birlikte, Allah'ı sevdikleri gibi severler."], [580.8, "Bu, ilâh edinme ve velâyet sevgisidir;"], [585.2, "ardından korku, ümit, ibadet ve dua gelir."], [594.0, "Bu sevgi, Allah Azze ve Celle'nin bağışlamadığı katıksız şirktir.\" Şeyh Süleyman b."], [597.3, "Abdullah b. Abdülvehhâb —Allah ona rahmet etsin— Teysîru'l-Azîzi'l-Hamîd'de şöyle demiştir:"], [601.0, "\"İkinci kısım: Ancak Allah Azze ve Celle'ye yaraşan özel sevgidir."], [605.4, "Kul bu sevgiyle O'ndan başkasını severse bu, Allah'ın bağışlamayacağı bir şirk olur."], [611.0, "Bu, zillet, boyun eğiş, tazim, tam itaat ve O'nu başkasına tercih etmeyi gerektiren kulluk sevgisidir."]]}, {"reader": false, "ar": [[624.0, "فهذه المحبّة لا يجوز تعلّقُها بغير الله أصلًا،"], [628.0, "كما حقّقه ابنُ القيّم،"], [630.0, "وهي التي سوّى المشركون بين الله تعالى وبين آلهتهم فيها،"], [636.0, "كما قال تعالى: <span class=\"ayah\">﴿وَمِنَ النَّاسِ مَن يَتَّخِذُ مِن دُونِ اللَّهِ أَندَادًا يُحِبُّونَهُمْ كَحُبِّ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ١٦٥]<\/span>»."], [643.0, "وهنا مسألةٌ يبحثها أهلُ السنة في مسألة المحبّة:"], [649.0, "هل يُعتبر عشقُ الإنسان لغيره من محبّة التعبّد؟"], [655.0, "إذا عشق الإنسانُ غيرَه،"], [660.0, "هل يُعتبر ذلك من صرف المحبّة لغير الله؟"]], "tr": [[624.0, "Bu sevginin Allah'tan başkasına bağlanması aslâ caiz değildir;"], [627.5, "İbnü'l-Kayyim'in tahkik ettiği gibi. Müşriklerin Allah Teâlâ ile ilâhları arasında denk tuttukları sevgi de budur."], [634.8, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [637.1, "<span class=\"ayah\">﴿İnsanlardan öyleleri vardır ki, Allah'ı bırakıp O'na birtakım denkler edinir ve onları Allah'ı sever gibi severler﴾<\/span> [Bakara 165].\" Burada Ehl-i Sünnet'in sevgi meselesinde ele aldığı bir mesele var:"], [649.0, "İnsanın başkasına âşık olması taabbud sevgisinden sayılır mı?"], [655.0, "İnsan başkasına âşık olursa, bu, sevgiyi Allah'tan başkasına yöneltmekten sayılır mı?"]]}, {"reader": false, "ar": [[664.0, "أجاب عن ذلك الإمامُ شيخُ الإسلام ابنُ تيميّة رحمه الله بقوله:"], [670.0, "«إذا كان القلب محبًّا لله وحده، مخلصًا له الدين، لم يُبتلَ بحبّ غيره أصلًا، فضلًا أن يُبتلى بالعشق. وحيث ابتُلي بالعشق فلنقص محبّته لله وحده. ولهذا لمّا كان يوسف محبًّا لله مخلصًا له الدين لم يُبتلَ بذلك» ـ أي بالميل إلى امرأة العزيز ـ «بل قال تعالى: <span class=\"ayah\">﴿كَذَٰلِكَ لِنَصْرِفَ عَنْهُ السُّوءَ وَالْفَحْشَاءَ ۚ إِنَّهُ مِنْ عِبَادِنَا الْمُخْلَصِينَ﴾<\/span> <span class=\"ref\">[يوسف: ٢٤]<\/span>. وأمّا امرأة العزيز فكانت مشركةً هي وقومُها، فلهذا ابتُليت بالعشق»؛"], [716.0, "أي لخلوّ قلبها من محبّة الله عز وجل."]], "tr": [[664.0, "Bu soruya İmam Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şu sözüyle cevap vermiştir:"], [666.2, "\"Kalp yalnızca Allah'ı seven, dini O'na has kılan bir kalp olursa, aslâ başkasının sevgisiyle imtihan edilmez;"], [668.4, "aşkla imtihan edilmesi ise hiç söz konusu olmaz."], [670.0, "Aşkla imtihan edildiği yerde bu, onun yalnızca Allah'a olan sevgisinin eksikliğindendir."], [681.0, "Bu yüzden Yûsuf, Allah'ı seven ve dini O'na has kılan biri olunca, bununla imtihan edilmedi\" —yani Azîz'in karısına meyletmekle— \"aksine Allah Teâlâ şöyle buyurdu:"], [704.0, "<span class=\"ayah\">﴿İşte böylece ondan kötülüğü ve hayâsızlığı uzaklaştırdık. Şüphesiz o, ihlâsa erdirilmiş kullarımızdandı﴾<\/span> [Yûsuf 24]."], [716.0, "Azîz'in karısına gelince, o ve kavmi müşrikti;"], [716.8, "bu yüzden aşkla imtihan edildi.\" Yani kalbi Allah Azze ve Celle sevgisinden boş olduğu için."]]}, {"reader": false, "ar": [[719.0, "فأعظمُ علاجٍ للعشق هو مزاحمتُه بمحبّة الله عز وجل،"], [725.0, "وإخراجُه وطردُه وكنسُه من القلب بتجديد المحبّة فيما بين العبد وبين ربّه."], [732.0, "فإن قلتَ: وهل يُعتبر العشقُ من صرف المحبّة لغير الله؟"], [736.0, "فنقول: إذا كان عشقًا يقتضي كمالَ الذلّ للمعشوق،"], [743.0, "وكمالَ التعظيم للمعشوق، وكمالَ الطاعة للمعشوق،"], [749.0, "فلا جرمَ أنه خرج عن حدّ الاعتدال إلى حدّ العبوديّة."]], "tr": [[719.0, "Aşkın en büyük ilacı, onu Allah Azze ve Celle sevgisiyle sıkıştırmak;"], [725.0, "kul ile Rabbi arasındaki sevgiyi yenileyerek onu kalpten çıkarmak, kovmak ve süpürüp atmaktır."], [732.0, "Eğer \"Aşk, sevgiyi Allah'tan başkasına yöneltmekten sayılır mı?\" dersen, deriz ki:"], [736.0, "Eğer âşık olunana tam zillet, âşık olunana tam tazim ve âşık olunana tam itaat gerektiren bir aşksa, şüphesiz itidal sınırından çıkıp kulluk sınırına girmiştir."]]}, {"reader": false, "ar": [[754.0, "فإن قلتَ لنا… فإن قلتَ:"], [758.1, "اضربْ أمثلةً على المحبّة الشركيّة،"], [761.0, "فنقول: كمحبّة عُبّاد الأصنام لها،"], [764.0, "ومحبّةِ الرافضة لآل البيت؛"], [767.0, "فإنّ محبّتهم لآل البيت أوجبت أن يُضفوا على آل البيت خضوعًا وطاعةً وتعظيمًا وعصمةً وتأليهًا ممّا لا يخفى على شريف علمكم."], [781.0, "وكذلك محبّةُ اليهود لأحبارهم؛"], [785.0, "فإنّ الأحبار متى ما بدّلوا دين الله،"], [789.0, "وحرّفوا التوراة وغيّروها، فإنّ اليهود ـ لمحبّتهم لأحبارهم ـ يطيعونهم في تحليل ما حرّم الله،"], [797.0, "أو في تحريم ما أحلّ الله."], [800.0, "وكذلك محبّةُ النصارى لرهبانهم."]], "tr": [[754.0, "Eğer bize… Eğer \"Şirk sevgisine örnekler ver\" dersen, deriz ki:"], [761.6, "Putperestlerin putlarını sevmesi ve Râfıza'nın Ehl-i Beyt'i sevmesi gibi."], [767.0, "Onların Ehl-i Beyt'i sevmesi, Ehl-i Beyt'e —şerefli ilminizden gizli olmayan— boyun eğiş, itaat, tazim, ismet (masumiyet) ve ilâhlaştırma yüklemelerini gerektirmiştir."], [781.0, "Yahudilerin hahamlarını sevmesi de böyledir:"], [785.0, "Hahamlar Allah'ın dinini değiştirdiklerinde, Tevrat'ı tahrif edip başkalaştırdıklarında, Yahudiler hahamlarını sevdikleri için Allah'ın haram kıldığını helal saymada ya da Allah'ın helal kıldığını haram saymada onlara itaat ederler."], [800.0, "Hristiyanların rahiplerini sevmesi de böyledir."]]}, {"reader": false, "ar": [[804.0, "وعلى ذلك قولُ الله عز وجل:"], [807.0, "<span class=\"ayah\">﴿اتَّخَذُوا أَحْبَارَهُمْ وَرُهْبَانَهُمْ أَرْبَابًا مِّن دُونِ اللَّهِ﴾<\/span> <span class=\"ref\">[التوبة: ٣١]<\/span>،"], [812.0, "وليس اتّخاذُهم أربابًا أي في الخلق والرزق والتدبير،"], [819.0, "وإنما في كمال المحبّة التي أوجبت لهم كمالَ الطاعة."], [824.0, "وكذلك أتباعُ الصوفيّة بالنسبة لمن يعظّمونه من الأولياء والصالحين؛"], [835.0, "فإنهم لفَرْط محبّتهم لأقطابهم وأوليائهم تجدهم يُحلّلون من الحرام ما يُحلّه هؤلاء،"], [845.0, "ويحرّمون من الحلال ما يحرّمه هؤلاء،"], [849.0, "ولا يسألونهم عن شيءٍ أبدًا،"], [853.0, "وإنما يطيعونهم الطاعةَ المطلقةَ العمياء من غير سؤال،"], [858.0, "حتى لو أمروهم بمخالفة الدين،"], [860.7, "أو ببذل المال، أو ببذل العِرض،"], [864.0, "لبذلوها بكمال الذلّ وكمال الخضوع."]], "tr": [[804.0, "Allah Azze ve Celle'nin şu sözü bunu ifade eder:"], [807.0, "<span class=\"ayah\">﴿Onlar, Allah'ı bırakıp hahamlarını ve rahiplerini rabler edindiler﴾<\/span> [Tevbe 31]."], [814.2, "Onları rabler edinmeleri yaratma, rızık ve tedbirde değil, onlara tam itaati gerektiren tam sevgidedir."], [824.0, "Sûfîlerin müritlerinin, tazim ettikleri velîlere ve sâlihlere karşı durumu da böyledir:"], [835.0, "Kutuplarını ve velîlerini aşırı sevdikleri için, onların helal saydığı haramı helal, haram saydığı helali haram sayarlar."], [845.7, "Onlara hiçbir şey sormazlar; aksine hiç soru sormadan onlara mutlak ve kör bir itaatle itaat ederler."], [854.9, "Hatta onlara dine muhalefet etmeyi, mal harcamayı ya da namuslarını feda etmeyi emretseler, tam bir zillet ve tam bir boyun eğişle bunu feda ederler."]]}, {"reader": false, "ar": [[868.0, "فإذًا طاعةُ المريدين من الصوفيّة لأوليائهم هذا ممّا تقتضيه المحبّةُ الشركيّة."], [880.0, "والأمثلةُ على ذلك كثيرةٌ ولله الحمد."], [883.0, "والخلاصةُ من ذلك: أنّ المحبّة لا تكون شركًا إلا إذا كانت محبّةً مع الله،"], [892.0, "مستلزمةً كمالَ الذلّ وكمالَ الخضوع وكمالَ الطاعة. والله أعلم."]], "tr": [[868.0, "O hâlde sûfî müritlerin velîlerine itaati, şirk sevgisinin gerektirdiği şeylerdendir."], [880.0, "Bunun örnekleri çoktur, hamd Allah'a."], [883.0, "Bundan çıkan özet şudur: Sevgi, ancak Allah ile birlikte (duyulan), tam zillet, tam boyun eğiş ve tam itaati gerektiren bir sevgi olduğunda şirk olur. Allah en iyisini bilir."]]}]}, {"ts": "15:01", "title": "2. Külliye: Tabiî, cibillî ve fıtrî sevginin hükmü maksatlarına ve sonuçlarına göre değişir", "paras": [{"reader": false, "ar": [[901.0, "ومن الكلّيّات أيضًا: <b>كلُّ محبّةٍ طبعيّةٍ جِبِلّيّةٍ فطريّةٍ فيختلف حكمُها باختلاف مقاصدها ونتائجها.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[901.0, "Külliyelerden biri de şudur: 2."], [903.2, "külliye: Tabiî, cibillî (yaratılıştan gelen) ve fıtrî her sevginin hükmü, maksatlarının ve sonuçlarının farklılığına göre değişir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[939.0, "وهذا في نوع المحبّة الآخر؛"], [943.0, "فإنّ المحبّة تنقسم إلى قسمين:"], [946.2, "إلى محبّةٍ تعبّديّة، وإلى محبّةٍ فطريّة."], [950.0, "وكلّيّتُنا الأولى في المحبّة التعبّديّة:"], [953.2, "فإن صُرفت إلى الله فهي توحيد،"], [957.0, "وإن صُرفت لغيره فهي محضُ الشرك."], [961.0, "وأمّا هذه الكلّيّة فإنها في قسم المحبّة الثاني،"], [966.4, "وهي المحبّة الجِبِلّيّة الفطريّة الطبعيّة،"], [972.0, "فيختلف حكمُها باختلاف مقاصدها ونتائجها؛"], [975.0, "لأنّ المتقرّر في القواعد أنّ الوسائل لها أحكامُ المقاصد."], [981.0, "فمتى ما قصدتَ بهذه المحبّة شيئًا فإننا نُعطي محبّتك الفطريّة حكمَ هذا الشيء الذي قصدتَه."]], "tr": [[939.0, "Bu, sevginin diğer türü hakkındadır."], [943.0, "Çünkü sevgi iki kısma ayrılır:"], [946.2, "taabbudî sevgi ve fıtrî sevgi."], [950.0, "İlk külliyemiz taabbudî sevgi hakkındaydı:"], [953.2, "Allah'a yöneltilirse tevhiddir, O'ndan başkasına yöneltilirse katıksız şirktir."], [957.0, "Bu külliye ise sevginin ikinci kısmı hakkındadır;"], [961.0, "o da cibillî, fıtrî ve tabiî sevgidir."], [966.4, "Bunun hükmü maksatlarının ve sonuçlarının farklılığına göre değişir."], [975.0, "Çünkü kaidelerde yerleşik olan şudur:"], [978.3, "Vasıtalar maksatların hükmünü alır. Sen bu sevgiyle bir şeyi kastettiğinde, fıtrî sevgine kastettiğin o şeyin hükmünü veririz."]]}, {"reader": false, "ar": [[993.0, "كما قال الله عز وجل:"], [995.9, "<span class=\"ayah\">﴿زُيِّنَ لِلنَّاسِ حُبُّ الشَّهَوَاتِ مِنَ النِّسَاءِ وَالْبَنِينَ وَالْقَنَاطِيرِ الْمُقَنطَرَةِ مِنَ الذَّهَبِ وَالْفِضَّةِ وَالْخَيْلِ الْمُسَوَّمَةِ وَالْأَنْعَامِ وَالْحَرْثِ﴾<\/span> <span class=\"ref\">[آل عمران: ١٤]<\/span>؛"], [1009.0, "هذه غالبُ محابّ الناس الفطريّة."], [1014.0, "وكمحبّة الجائع للطعام، ومحبّة الظمآن للماء."], [1021.0, "فهذه المحبّة لا بدّ أن نقسمها إلى ثلاثة أقسام على حسب نتائجها ومقاصدها."]], "tr": [[993.0, "Allah Azze ve Celle'nin şu buyruğunda olduğu gibi:"], [995.9, "<span class=\"ayah\">﴿Kadınlara, oğullara, kantar kantar yığılmış altın ve gümüşe, salma (soylu) atlara, hayvanlara ve ekinlere karşı aşırı sevgi insanlara süslü gösterildi﴾<\/span> [Âl-i İmrân 14]."], [1014.0, "Bunlar insanların fıtrî sevgililerinin çoğudur."], [1021.0, "Açın yemeği, susuzun suyu sevmesi de böyledir."], [1024.3, "Bu sevgiyi sonuçlarına ve maksatlarına göre mutlaka üç kısma ayırmamız gerekir."]]}, {"reader": false, "ar": [[1030.0, "القسمُ الأوّل: إن أحبّها لله عز وجل،"], [1035.0, "وجعلها وسيلةً موصلةً له إلى مراد الله فيها،"], [1040.0, "فإنها تكون محبّةً تعبّديّة؛"], [1044.0, "لأنّ المتقرّر في القواعد أنّ المباحات تنقلب قُرُباتٍ وعباداتٍ بالنيّات الصالحات."], [1054.0, "فإذا أحبّ الإنسانُ زوجتَه لله عز وجل كانت محبّتُه تعبُّدًا،"], [1061.0, "وإذا أحبّ الطعامَ ليقوّي به جسدَه ليطيع اللهَ صارت عبادةً وقُربة،"], [1069.0, "وإذا أحبّ الأمرَ الحلالَ من مشربٍ أو ملبسٍ أو مركبٍ ليُعينه على طاعة الله عز وجل صار أمرًا محبوبًا محبّةً شرعيّة."]], "tr": [[1030.0, "Birinci kısım: Eğer bunları Allah Azze ve Celle için sever ve onları kendisini Allah'ın bunlardaki muradına ulaştıran bir vasıta kılarsa, bu taabbudî bir sevgi olur."], [1044.0, "Çünkü kaidelerde yerleşik olan şudur:"], [1047.0, "Mubahlar, sâlih niyetlerle kurbetlere ve ibadetlere dönüşür."], [1054.0, "İnsan eşini Allah Azze ve Celle için severse sevgisi bir taabbud olur."], [1060.3, "Yemeği, onunla bedenini güçlendirip Allah'a itaat etmek için severse (bu sevgi) bir ibadet ve kurbet olur."], [1069.0, "İçecek, giyecek ya da binek gibi helal bir şeyi, Allah Azze ve Celle'ye itaatte kendisine yardımcı olsun diye severse, şer'î bir sevgiyle sevilen bir şey olur."]]}, {"reader": false, "ar": [[1086.0, "فمتى ما أحبّ هذه الأشياء وجعلها وسيلةً إلى الله عز وجل،"], [1092.0, "واستعان بها على مرضاة الله تعالى وطاعته،"], [1097.0, "أُثيب عليها وكانت من قسم الحبّ لله؛"], [1101.0, "لأنه جعلها وسيلةً توصله إلى الله،"], [1105.2, "والوسائلُ لها أحكامُ المقاصد."], [1109.0, "وهذه هي محبّةُ النبيّ صلى الله عليه وسلم لهذه الأشياء المباحة؛"], [1117.0, "فكان عليه الصلاة والسلام يجعل محبّتَه الفطريّة الجِبِلّيّة الطبعيّة مقرّبةً له إلى الله عز وجل."]], "tr": [[1086.0, "Bu şeyleri sevip onları Allah Azze ve Celle'ye bir vasıta kıldığında ve onlarla Allah Teâlâ'nın rızasına ve O'na itaate yardım aldığında, bunlardan dolayı sevap kazanır ve bunlar Allah için sevgi kısmından olur."], [1101.0, "Çünkü onları kendisini Allah'a ulaştıran bir vasıta kılmıştır;"], [1105.2, "vasıtalar da maksatların hükmünü alır."], [1109.0, "Peygamber sallallâhu aleyhi ve sellem'in bu mubah şeyleri sevmesi de işte böyledir."], [1117.0, "O aleyhissalâtü vesselâm fıtrî, cibillî ve tabiî sevgisini kendisini Allah Azze ve Celle'ye yaklaştıran bir şey kılardı."]]}, {"reader": false, "ar": [[1127.0, "قال الإمامُ ابنُ القيّم عن هذا القسم:"], [1131.5, "«وهذه حالُ أكمل الخلق ـ عليه الصلاة والسلام ـ الذي حُبِّب إليه من الدنيا النساءُ والطيب، وكانت محبّتُه لهما عونًا له على محبّة الله وتبليغ رسالته والقيام بأمره». هذا القسمُ الأوّل."]], "tr": [[1127.0, "İmam İbnü'l-Kayyim bu kısım hakkında şöyle demiştir:"], [1131.5, "\"Bu, kendisine dünyadan kadınlar ve güzel koku sevdirilmiş olan, yaratılmışların en mükemmeli aleyhissalâtü vesselâm'ın hâlidir."], [1137.7, "O'nun bu ikisine sevgisi, Allah sevgisine, risaletini tebliğ etmeye ve O'nun emrini yerine getirmeye bir yardımcıydı.\" Bu birinci kısımdır."]]}, {"reader": false, "ar": [[1150.0, "القسمُ الثاني: إن أحبّ هذه الأشياء لموافقة طبعه وهواه وإرادته،"], [1161.0, "ولكن لم يُؤثِرها على محبّة الله عز وجل،"], [1165.0, "ولكنه استمتع بها غيرَ مستشعرٍ التعبّدَ لله عز وجل بمزاولة هذه الأشياء،"], [1176.0, "فيبقى أنها مباحةٌ لا ثوابَ له فيها ولا عقاب."], [1182.0, "فإذا لم يستشعر التعبّدَ لله بها،"], [1185.7, "ولم يقدّمها على ما يحبّ الله ورسولُه صلى الله عليه وسلم،"], [1193.0, "فإنها تبقى من قسم المباحات،"], [1196.0, "لا يُعاقَب عليها ولا يُثاب على فعلها."]], "tr": [[1150.0, "İkinci kısım: Eğer bu şeyleri tabiatına, hevâsına ve iradesine uygun düştüğü için sever, ama onları Allah Azze ve Celle sevgisine tercih etmez;"], [1165.0, "bu şeylerle uğraşırken Allah Azze ve Celle'ye taabbud ettiğini hissetmeden onlardan faydalanırsa, bunlar mubah olarak kalır;"], [1176.7, "bunlarda onun için ne sevap ne de ceza vardır."], [1182.0, "Onlarla Allah'a taabbud ettiğini hissetmez ve onları Allah'ın ve Resûlü sallallâhu aleyhi ve sellem'in sevdiği şeylerin önüne geçirmezse, bunlar mubahlar kısmında kalır;"], [1194.2, "onlardan dolayı ne cezalandırılır ne de onları yapmaktan dolayı sevap alır."]]}]}, {"ts": "20:01", "title": "2. Külliye (sonu): Üçüncü kısım; fıtrî sevgiyi Allah'ın sevdiğinin önüne geçirmek", "paras": [{"reader": false, "ar": [[1201.0, "وأمّا القسمُ الثالث: إن أفضت به هذه المحابُّ الفطريّة إلى تقديمها على محبّة ما يحبّه الله ورسولُه صلى الله عليه وسلم،"], [1218.0, "وكانت مقصودةً في ذاتها له،"], [1223.0, "وكان يسعى في تحصيلها سعيًا غيرَ مُراعٍ فيه حدودَ الله ولا محارمَ الشرع،"], [1233.0, "فإنه يكون في هذه الحالة ظالمًا لنفسه،"], [1237.7, "ومتّبعًا لهواه، وآثمًا بقدر هذه المخالفة."], [1242.0, "فإذا أمرته زوجتُه بشيءٍ يخالف ما يحبّه الله فأطاعها فيكون متّبعًا لهواه."]], "tr": [[1201.0, "Üçüncü kısma gelince: Eğer bu fıtrî sevgililer onu, bunları Allah'ın ve Resûlü sallallâhu aleyhi ve sellem'in sevdiği şeylerin sevgisinin önüne geçirmeye götürürse, bunlar onun için bizzat kendileri maksat hâline gelirse ve onları elde etmek için Allah'ın sınırlarını ve şeriatin haramlarını gözetmeden çabalarsa, bu durumda o, nefsine zulmeden, hevâsına uyan ve bu muhalefeti kadar günahkâr olan biri olur."], [1242.0, "Eşi ona Allah'ın sevdiğine aykırı bir şey emreder de ona itaat ederse, hevâsına uymuş olur."]]}, {"reader": false, "ar": [[1249.0, "ولذلك قال الله عز وجل:"], [1251.7, "<span class=\"ayah\">﴿قُلْ إِن كَانَ آبَاؤُكُمْ وَأَبْنَاؤُكُمْ﴾<\/span>،"], [1254.4, "إلى أن قال ـ بعد ذكر المحابّ الثمان ـ:"], [1258.3, "<span class=\"ayah\">﴿أَحَبَّ إِلَيْكُم مِّنَ اللَّهِ وَرَسُولِهِ وَجِهَادٍ فِي سَبِيلِهِ فَتَرَبَّصُوا حَتَّىٰ يَأْتِيَ اللَّهُ بِأَمْرِهِ﴾<\/span> <span class=\"ref\">[التوبة: ٢٤]<\/span>."], [1266.0, "ولذلك لمّا تخلّف بعضُ الصحابة عن الهجرة مع النبيّ صلى الله عليه وسلم بسبب خوفهم أو مراعاتهم لأزواجهم وأولادهم،"], [1276.0, "أنزل الله عز وجل:"], [1278.7, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِنَّ مِنْ أَزْوَاجِكُمْ وَأَوْلَادِكُمْ عَدُوًّا لَّكُمْ فَاحْذَرُوهُمْ﴾<\/span> <span class=\"ref\">[التغابن: ١٤]<\/span>."]], "tr": [[1249.0, "Bu yüzden Allah Azze ve Celle şöyle buyurmuştur:"], [1251.7, "<span class=\"ayah\">﴿De ki: Eğer babalarınız, oğullarınız…﴾<\/span> sekiz sevgiliyi zikrettikten sonra şöyle buyurdu:"], [1256.6, "<span class=\"ayah\">﴿…size Allah'tan, Resûlü'nden ve O'nun yolunda cihad etmekten daha sevgili ise, Allah emrini getirinceye kadar bekleyin﴾<\/span> [Tevbe 24]."], [1266.0, "Bu yüzden bazı sahabe, korkularından ya da eşlerini ve çocuklarını gözettiklerinden dolayı Peygamber sallallâhu aleyhi ve sellem ile birlikte hicret etmekten geri kalınca, Allah Azze ve Celle şunu indirdi:"], [1278.7, "<span class=\"ayah\">﴿Ey iman edenler! Eşlerinizden ve çocuklarınızdan size düşman olanlar vardır; onlardan sakının﴾<\/span> [Teğâbün 14]."]]}, {"reader": false, "ar": [[1286.0, "فكلُّ محبّةٍ أوجبت تقديمَها… أوجب حبُّك لها… فكلُّ محبّةٍ فطريّةٍ أوجبت لك أن تقدّمها على ما يحبّ الله ورسولُه صلى الله عليه وسلم فإنها من النوع الحرام."], [1301.0, "وبهذه الأقسام الثلاثة تنتهي كلّيّتُنا."], [1305.0, "وخلاصتُها: أنّ تلك المحابّ الفطريّة لا نُعطيها حكمًا باعتبار ذاتها،"], [1311.0, "وإنما نُعطيها حكمًا باعتبار مقاصدها ومآلاتها ونهاياتها ونتائجها؛"], [1318.0, "لأنّ الوسائل لها أحكامُ المقاصد."], [1321.0, "وبذلك نكون قد انتهينا من قواعد المحبّة. والله أعلم."]], "tr": [[1286.0, "Dolayısıyla, önüne geçirilmesini gerektiren her sevgi… onu sevmenin gerektirdiği… Yani seni, onu Allah'ın ve Resûlü sallallâhu aleyhi ve sellem'in sevdiği şeylerin önüne geçirmeye sevk eden her fıtrî sevgi haram türündendir."], [1301.0, "Bu üç kısımla külliyemiz sona eriyor."], [1305.0, "Özeti şudur: Bu fıtrî sevgililere bizzat kendileri itibarıyla değil, maksatları, varacakları yer, nihayetleri ve sonuçları itibarıyla hüküm veririz."], [1318.0, "Çünkü vasıtalar maksatların hükmünü alır."], [1321.0, "Böylece sevgi kaidelerini bitirmiş olduk. Allah en iyisini bilir."]]}]}, {"ts": "22:05", "title": "3. Külliye: Mahlûk ile yemin eden, (yemin edilen kim olursa olsun) mutlak olarak şirke düşmüştür", "paras": [{"reader": false, "ar": [[1325.0, "الكلّيّة الثالثة: <b>كلُّ من حلف بمخلوقٍ مطلقًا فقد أشرك.<\/b> بدأنا في قواعد الأيمان."], [1340.5, "<span class=\"note\">(يكررها)<\/span> وهذه قاعدةٌ من قواعد الأيمان؛"], [1352.0, "ولأنّ اليمين بغير الله عز وجل قد حكم عليها الشارع بأنها من الشرك،"], [1359.0, "فتكون قواعدُها داخلةً في سياق قواعد توحيد الألوهية."]], "tr": [[1325.0, "<b>3. külliye: Bir mahlûk ile yemin eden herkes, mutlak olarak şirke düşmüştür.<\/b> Yemin kaidelerine başladık."], [1340.5, "(Tekrar ediyor.) Bu, yemin kaidelerinden bir kaidedir."], [1352.0, "Allah Azze ve Celle'den başkası ile yeminin şirkten olduğuna Şâri' hükmettiği için, onun kaideleri de ulûhiyyet tevhidi kaidelerinin akışı içine girer."]]}, {"reader": false, "ar": [[1365.0, "وذلك كالحلف بالنبيّ أو الكعبة،"], [1370.0, "وكالحلف بالملائكة أو السماء،"], [1375.0, "وكالحلف بالآباء، والحلفِ بالحياة والروح والرأس،"], [1382.0, "وحياةِ السلطان ونعمةِ السلطان وتربةِ فلان،"], [1386.0, "وكالحلف بالأمانة؛ كلُّ ذلك من الحلف بغير الله عز وجل."], [1393.0, "فإن قلتَ: ولماذا قلتَ «مطلقًا»؟"], [1396.0, "فأقول: لأنه مهما عظُمت منزلةُ المخلوق عند الله عز وجل فلا يزال تحريمُ الحلف به قائمًا."]], "tr": [[1365.0, "Bu, Peygamber ile ya da Kâbe ile yemin etmek;"], [1371.7, "melekler ile ya da gök ile yemin etmek;"], [1379.7, "babalar ile yemin etmek; hayat, ruh ve baş üzerine yemin etmek;"], [1389.0, "sultanın hayatı, sultanın nimeti ve falanın türbesi üzerine (yemin etmek) ve emanet üzerine yemin etmek gibidir."], [1393.0, "Bunların hepsi Allah Azze ve Celle'den başkası ile yemin etmektendir."], [1396.0, "Eğer \"Neden 'mutlak olarak' dedin?\" dersen, derim ki:"], [1398.8, "Çünkü mahlûkun Allah Azze ve Celle katındaki mertebesi ne kadar büyük olursa olsun, onunla yemin etmenin haramlığı devam eder."]]}, {"reader": false, "ar": [[1409.0, "فأعظمُ المخلوقات العُلويّة عند الله هم الملائكة،"], [1414.0, "وأعظمُ المخلوقات السُّفليّة ـ أي على الأرض ـ هم الأنبياءُ والرسل."], [1420.0, "ومع ذلك لا يجوز الحلفُ لا بجبريل،"], [1423.3, "ولا بميكائيل، ولا بإسرافيل،"], [1425.2, "ولا بملائكة السماء أو ملائكة الجبال،"], [1428.0, "ولا يجوز الحلفُ لا بالأنبياء،"], [1431.3, "ولا بالرسل، ولا بالأولياء."], [1434.0, "فمهما عظُمت منزلةُ المحلوف به عند الله عز وجل فيبقى مخلوقًا لا يجوز للإنسان أن يحلف به."]], "tr": [[1409.0, "Allah katında yukarı âlemdeki mahlûkatın en büyüğü meleklerdir;"], [1413.3, "aşağı âlemdeki —yani yeryüzündeki— mahlûkatın en büyüğü de peygamberler ve resullerdir."], [1420.0, "Buna rağmen ne Cebrâil ile, ne Mîkâil ile, ne İsrâfil ile, ne göğün melekleri ile ne de dağların melekleri ile yemin etmek caiz değildir."], [1427.5, "Ne peygamberler ile, ne resuller ile ne de velîler ile yemin etmek caizdir."], [1434.0, "Kendisiyle yemin edilenin Allah Azze ve Celle katındaki mertebesi ne kadar büyük olursa olsun, o bir mahlûk olarak kalır;"], [1440.4, "insanın onunla yemin etmesi caiz değildir."]]}, {"reader": false, "ar": [[1443.0, "فإن قلتَ: وما برهانُك على هذه القاعدة؟"], [1447.0, "فأقول: قد تواترت الأدلّةُ عن النبيّ صلى الله عليه وسلم في تحريم ذلك."], [1454.0, "ففي الصحيح من حديث ابن عمر رضي الله عنهما قال:"], [1457.3, "قال النبيّ صلى الله عليه وسلم:"], [1459.0, "«إنّ الله تبارك وتعالى ينهاكم أن تحلفوا بآبائكم، من كان حالفًا فليحلف بالله أو ليصمت»."], [1468.0, "وفي روايةٍ في الصحيح:"], [1471.0, "«فمن كان حالفًا فلا يحلف إلا بالله، أو ليسكت»."]], "tr": [[1443.0, "Eğer \"Bu kaideye delilin nedir?\" dersen, derim ki:"], [1447.0, "Bunun haramlığı hakkında Peygamber sallallâhu aleyhi ve sellem'den deliller tevâtür derecesinde gelmiştir."], [1454.0, "Sahîh'te İbn Ömer radıyallâhu anhümâ hadisinde şöyle dedi:"], [1457.3, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1459.0, "\"Allah Tebâreke ve Teâlâ sizi babalarınız ile yemin etmekten nehyediyor."], [1463.4, "Kim yemin edecekse Allah ile yemin etsin ya da sussun.\" Sahîh'teki bir rivayette de:"], [1471.0, "\"Kim yemin edecekse Allah'tan başkası ile yemin etmesin ya da sussun.\""]]}, {"reader": false, "ar": [[1475.0, "وفي الحديث عن عبد الرحمن بن سَمُرة رضي الله عنه قال:"], [1478.4, "قال النبيّ صلى الله عليه وسلم:"], [1481.0, "«لا تحلفوا بآبائكم، ولا بالأنداد، ولا بالطواغي»،"], [1490.0, "أخرجه الإمامُ مسلم. وفي الحديث عن بُريدة أنّ النبيّ صلى الله عليه وسلم قال:"], [1495.0, "«من حلف بالأمانة فليس منّا»."], [1499.0, "وفي الحديث أيضًا أنّ النبيّ صلى الله عليه وسلم سمع رجلًا يقول:"], [1504.7, "لا والكعبةِ ـ عفوًا، أنّ ابنَ عمر سمع رجلًا يقول:"], [1507.2, "لا والكعبة ـ فقال: لا تحلفْ بغير الله،"], [1515.0, "فإني سمعتُ رسولَ الله صلى الله عليه وسلم يقول:"], [1519.8, "«من حلف بغير الله فقد كفر أو أشرك»."]], "tr": [[1475.0, "Abdurrahman b. Semüre radıyallâhu anh'tan gelen hadiste şöyle dedi:"], [1478.4, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1481.0, "\"Babalarınız ile, denkler (putlar) ile ve tâğûtlar ile yemin etmeyin.\" Bunu İmam Müslim rivayet etmiştir."], [1491.7, "Büreyde'den gelen hadiste Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1495.0, "\"Emanet üzerine yemin eden bizden değildir.\" Yine hadiste Peygamber sallallâhu aleyhi ve sellem'in bir adamı \"Hayır, Kâbe'ye andolsun\" derken işittiği —pardon, İbn Ömer'in bir adamı \"Hayır, Kâbe'ye andolsun\" derken işittiği— geçer."], [1507.2, "(İbn Ömer) şöyle dedi: \"Allah'tan başkası ile yemin etme;"], [1515.0, "çünkü ben Resûlullah sallallâhu aleyhi ve sellem'i şöyle buyururken işittim:"], [1519.8, "'Allah'tan başkası ile yemin eden küfre girmiş ya da şirk koşmuştur.'\""]]}, {"reader": false, "ar": [[1524.0, "وفي الحديث عن ابن عمر رضي الله عنهما قال:"], [1526.5, "قال النبيّ صلى الله عليه وسلم:"], [1529.2, "«ألا من كان حالفًا فلا يحلف إلا بالله»،"], [1533.0, "فكانت قريشٌ تحلف بآبائها،"], [1537.0, "فقال: «لا تحلفوا بآبائكم»،"], [1539.0, "والحديث في «صحيح الإمام البخاري»."], [1541.0, "وفي حديث قُتَيلة الجُهَنيّة رضي الله عنها،"], [1545.0, "وفيه أنّ يهوديًّا قال للنبيّ صلى الله عليه وسلم:"], [1549.0, "إنكم تُشركون، تقولون: ما شاء الله وشئت،"], [1554.0, "وتقولون: والكعبة؛ فنهاهم النبيّ صلى الله عليه وسلم عن الأمرين جميعًا."], [1562.0, "فهذا الحديث يبيّن أنّ النبيّ صلى الله عليه وسلم أمر أصحابه إذا أرادوا أن يحلفوا أن يقولوا:"], [1571.6, "وربِّ الكعبة، وأن يقولوا:"], [1573.9, "ما شاء الله ثم شئت."]], "tr": [[1524.0, "İbn Ömer radıyallâhu anhümâ'dan gelen hadiste şöyle dedi:"], [1526.5, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1529.2, "\"Dikkat edin! Kim yemin edecekse Allah'tan başkası ile yemin etmesin.\" Kureyş babaları ile yemin ederdi;"], [1537.5, "bunun üzerine \"Babalarınız ile yemin etmeyin\" buyurdu."], [1541.0, "Hadis İmam Buhârî'nin Sahîh'indedir. Kuteyle el-Cüheniyye radıyallâhu anhâ hadisinde de bir Yahudinin Peygamber sallallâhu aleyhi ve sellem'e şöyle dediği geçer:"], [1551.6, "\"Siz şirk koşuyorsunuz; 'Allah ve sen dilediniz' diyorsunuz ve 'Kâbe'ye andolsun' diyorsunuz.\" Peygamber sallallâhu aleyhi ve sellem de onları her iki şeyden nehyetti."], [1562.0, "Bu hadis, Peygamber sallallâhu aleyhi ve sellem'in ashâbına, yemin etmek istediklerinde \"Kâbe'nin Rabbine andolsun\" demelerini ve \"Allah diledi, sonra sen diledin\" demelerini emrettiğini açıklar."]]}, {"reader": false, "ar": [[1576.0, "قال الإمامُ ابنُ عبد البرّ رحمه الله تعالى:"], [1579.0, "«أجمع العلماء على أنّ اليمين بغير الله مكروهةٌ منهيٌّ عنها، لا يجوز الحلف بها لأحد»."], [1589.0, "انتهى كلامه. وقلتُ لكم سابقًا بأنّ السلف متى ما أطلقوا لفظ الكراهة فيُراد بها كراهةُ التحريم."], [1597.0, "وقال شيخُ الإسلام ابنُ تيميّة رحمه الله تعالى:"], [1601.0, "«فأمّا الحلف بالمخلوقات ـ كالحلف بالكعبة، أو قبر الشيخ، أو بنعمة السلطان، أو بالسيف، أو بجاه أحدٍ من المخلوقين ـ فما أعلم بين العلماء خلافًا أنّ هذه اليمين مكروهةٌ منهيٌّ عنها، وأنّ الحلف بها لا يوجب حِنثًا ولا كفّارة»."], [1625.0, "انتهى كلامه رحمه الله."]], "tr": [[1576.0, "İmam İbn Abdilber —Allah ona rahmet etsin— şöyle demiştir:"], [1579.0, "\"Âlimler, Allah'tan başkası ile yeminin mekruh ve yasaklanmış olduğunda, hiç kimsenin onunla yemin etmesinin caiz olmadığında icmâ etmişlerdir.\" Sözü burada bitti."], [1589.0, "Size daha önce de söylemiştim:"], [1591.2, "Selef \"kerâhet\" lafzını mutlak olarak kullandığında, onunla tahrîmen kerâhet (haramlık) kastedilir."], [1597.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1601.0, "\"Mahlûkat ile yemin etmeye gelince —Kâbe ile, şeyhin kabri ile, sultanın nimeti ile, kılıç ile ya da mahlûklardan birinin makamı (câhı) ile yemin etmek gibi— bu yeminin mekruh ve yasaklanmış olduğunda ve onunla yemin etmenin ne yemini bozmayı ne de kefareti gerektirdiğinde âlimler arasında bir ihtilaf bilmiyorum.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[1627.0, "وقال الإمامُ ابنُ القيّم رحمه الله:"], [1630.0, "«ومن الكبائر الحلفُ بغير الله، كما قال النبيّ صلى الله عليه وسلم: من حلف بغير الله فقد أشرك. وقد قصّر ـ انتبه ـ وقد قصّر ما شاء الله أن يقصّر مَن قال إنّ ذلك مكروه، وصاحبُ الشرع يجعله شركًا؛ فرتبتُه فوق رتبة الكبائر»."], [1656.0, "انتهى كلامه رحمه الله."]], "tr": [[1627.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [1630.0, "\"Allah'tan başkası ile yemin etmek büyük günahlardandır."], [1634.3, "Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1638.6, "'Allah'tan başkası ile yemin eden şirk koşmuştur.' Bunun mekruh olduğunu söyleyen kimse —dikkat et— Allah'ın dilediği kadar kusur etmiştir;"], [1656.0, "oysa şeriat sahibi onu şirk saymaktadır."], [1656.8, "Dolayısıyla onun mertebesi büyük günahların mertebesinin üstündedir.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[1659.0, "فإن قلتَ: ولماذا أطلقتَ في الكلّيّة قولَك «فقد أشرك» ولم تحدّد:"], [1667.4, "أهو من الشرك الأكبر أو الشرك الأصغر؟"], [1674.0, "فأقول: ليدخلَ الأمران؛ لأنّ الحالف بغير الله عز وجل إمّا أن يحلف بمطلق التعظيم فيكون من باب الشرك الأصغر،"], [1687.0, "وإمّا أن يحلف بالتعظيم المطلق فيكون ذلك من باب الشرك الأكبر."], [1696.0, "ومن المعلوم أنّ الشرك الأصغر يكون أكبرَ إذا عظُم التنديدُ والمساواةُ في القلب،"], [1703.0, "كما قلناه في مسألة التميمة:"], [1707.0, "فإذا كانت في دائرة السببيّة فشركٌ أصغر،"], [1712.0, "وإذا خرجت إلى دائرة الفاعليّة الذاتيّة فشركٌ أكبر."], [1718.0, "فالشركُ الأصغر قد ينقلب إلى أكبر إذا عظُم التنديدُ والمساواةُ في القلب."]], "tr": [[1659.0, "Eğer \"Külliyede 'şirke düşmüştür' sözünü neden mutlak bıraktın da büyük şirk mi küçük şirk mi olduğunu belirlemedin?\" dersen, derim ki:"], [1674.0, "İkisi de girsin diye. Çünkü Allah Azze ve Celle'den başkası ile yemin eden, ya (yemin ettiği şeye) bir miktar tazimle (mutlaku't-ta'zîm) yemin eder, bu küçük şirk babından olur;"], [1687.0, "ya da tam ve mutlak bir tazimle (et-ta'zîmu'l-mutlak) yemin eder, bu da büyük şirk babından olur."], [1696.0, "Bilinen bir şeydir ki küçük şirk, kalpteki denk tutma ve eşitleme büyüdüğünde büyük şirk olur;"], [1703.0, "temîme (muska) meselesinde söylediğimiz gibi:"], [1707.0, "Sebeplik dairesinde ise küçük şirktir, zâtî fâillik dairesine çıkarsa büyük şirktir."], [1718.0, "Dolayısıyla küçük şirk, kalpteki denk tutma ve eşitleme büyüdüğünde büyük şirke dönüşebilir."]]}, {"reader": false, "ar": [[1725.0, "قال الحافظُ ابنُ حجر رحمه الله تعالى:"], [1730.0, "«فإن اعتقد في المحلوف به من التعظيم ما يعتقده في الله حرُم الحلفُ به، وكان بذلك الاعتقاد كافرًا، وعليه يتنزّل الحديثُ المذكور»؛"], [1747.0, "يعني: «فقد كفر أو أشرك»."], [1750.0, "واضحٌ هذا؟ قال الشيخ محمد بن صالح العثيمين رحمه الله تعالى:"], [1756.0, "«إن اعتقد أنّ المحلوف به مساوٍ لله تعالى في التعظيم والعظمة» ـ يعني فشركٌ أكبر ـ «وإلا فهو شركٌ أصغر»."], [1767.0, "انتهى كلامه رحمه الله."]], "tr": [[1725.0, "Hâfız İbn Hacer —Allah ona rahmet etsin— şöyle demiştir:"], [1730.0, "\"Eğer kendisiyle yemin edilen hakkında Allah hakkında inandığı tazime inanırsa, onunla yemin etmesi haram olur ve bu inancıyla kâfir olur."], [1741.7, "Zikredilen hadis de buna hamledilir.\" Yani \"küfre girmiş ya da şirk koşmuştur\" hadisi."], [1750.0, "Bu açık mı? Şeyh Muhammed b."], [1752.9, "Sâlih el-Useymîn —Allah ona rahmet etsin— şöyle demiştir:"], [1756.0, "\"Eğer kendisiyle yemin edilenin tazimde ve azamette Allah Teâlâ'ya denk olduğuna inanırsa\" —yani büyük şirktir— \"aksi hâlde küçük şirktir.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[1769.0, "وجاء في «فتاوى اللجنة الدائمة»:"], [1771.0, "«الحلف بالأمانة هو حلفٌ بغير الله، والحلف بغير الله شركٌ أصغر ومن أكبر الكبائر؛ لما روى عبد الله بن عمر عن النبيّ صلى الله عليه وسلم قال: من حلف بغير الله فقد كفر أو أشرك»."], [1790.0, "قال ابنُ مسعود رضي الله عنه:"], [1793.6, "«لأن أحلفَ بالله كاذبًا أحبُّ إليّ من أن أحلفَ بغيره صادقًا»."], [1799.0, "قالوا: لأنّ سيّئة الشرك أعظمُ من سيّئة الكذب <span class=\"q\">؟ 29:59<\/span>."]], "tr": [[1769.0, "Fetâva'l-Lecneti'd-Dâime'de şöyle geçmiştir: \"Emanet üzerine yemin, Allah'tan başkası ile yemindir."], [1771.0, "Allah'tan başkası ile yemin ise küçük şirktir ve büyük günahların en büyüklerindendir."], [1778.0, "Çünkü Abdullah b. Ömer, Peygamber sallallâhu aleyhi ve sellem'den şöyle buyurduğunu rivayet etmiştir:"], [1783.0, "'Allah'tan başkası ile yemin eden küfre girmiş ya da şirk koşmuştur.'\" İbn Mes'ûd radıyallâhu anh şöyle demiştir:"], [1790.0, "\"Allah ile yalan yere yemin etmem, O'ndan başkası ile doğru olarak yemin etmemden bana daha sevimlidir.\" (Âlimler) dediler ki:"], [1799.0, "Çünkü şirkin kötülüğü yalanın kötülüğünden <span class=\"q\">؟<\/span> daha büyüktür."]]}]}, {"ts": "30:05", "title": "3. Külliye (sonu): Tövbeden sonra dili sürçerek Allah'tan başkası ile yemin eden", "paras": [{"reader": false, "ar": [[1805.0, "قال شيخُ الإسلام ابنُ تيميّة رحمه الله تعالى:"], [1814.0, "«فقد ثبت بالنصوص الصحيحة الصريحة عن النبيّ صلى الله عليه وسلم أنه لا يجوز الحلفُ بشيءٍ من المخلوقات، لا فرقَ في ذلك بين الملائكة والأنبياء والصالحين وغيرهم»."], [1827.0, "انتهى كلامه. مسألة: إن قلتَ:"], [1830.0, "إذا أقسم المسلمُ بغير الله تعالى ذاهلًا غيرَ متعمّد ـ كمن عاش زمنًا غيرَ ملتزمٍ بأحكام الشرع،"], [1843.0, "ثم تاب إلى الله عز وجل،"], [1846.3, "فقد يسبق لسانُه أحيانًا بعد توبته إلى الحلف بغير الله عز وجل ـ فما حكمُه في هذه الحالة؟"]], "tr": [[1805.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1814.0, "\"Peygamber sallallâhu aleyhi ve sellem'den gelen sahih ve açık nasslarla sabit olmuştur ki mahlûkattan hiçbir şey ile yemin etmek caiz değildir;"], [1821.7, "bunda melekler, peygamberler, sâlihler ve diğerleri arasında fark yoktur.\" Sözü burada bitti."], [1828.7, "Bir mesele: Eğer \"Müslüman, dalgınlıkla, kasıtsız olarak Allah Teâlâ'dan başkası üzerine yemin ederse —meselâ bir süre şeriatin hükümlerine bağlı olmadan yaşamış, sonra Allah Azze ve Celle'ye tövbe etmiş biri, tövbesinden sonra bazen dili sürçüp Allah Azze ve Celle'den başkası ile yemin edebilir— bu durumda onun hükmü nedir?\" dersen,"]]}, {"reader": false, "ar": [[1856.0, "فأقول: لا شيءَ عليه؛"], [1861.0, "وذلك لأنها يمينٌ بغير الله جرت على لسانه غيرَ مقصودٍ بها عَقدُ جَنانه،"], [1868.0, "فتُعتبر من اللغو؛ لأنّ الآثار التي تترتّب على الألفاظ من شرطها اقترانُها بقصد القلب."], [1878.0, "فأيُّ قولٍ نطق به لسانُك ولم يقصده جَنانُك فإنّ الشريعة لا ترتّب عليه أحكامًا."], [1886.0, "وعلى ذلك قولُ الله عز وجل:"], [1889.9, "<span class=\"ayah\">﴿لَّا يُؤَاخِذُكُمُ اللَّهُ بِاللَّغْوِ فِي أَيْمَانِكُمْ وَلَٰكِن يُؤَاخِذُكُم بِمَا كَسَبَتْ قُلُوبُكُمْ ۗ وَاللَّهُ غَفُورٌ حَلِيمٌ﴾<\/span> <span class=\"ref\">[البقرة: ٢٢٥]<\/span>."]], "tr": [[1856.0, "derim ki: Ona bir şey gerekmez."], [1861.0, "Çünkü bu, kalbinin kastı olmaksızın diline gelen, Allah'tan başkası ile bir yemindir;"], [1866.9, "dolayısıyla lağv (boş söz) sayılır."], [1871.0, "Çünkü lafızlara bağlanan sonuçların şartı, onların kalbin kastıyla birlikte olmasıdır."], [1878.0, "Dilinin söylediği ama kalbinin kastetmediği herhangi bir söze şeriat hüküm bağlamaz."], [1884.0, "Allah Azze ve Celle'nin şu sözü de bunu ifade eder:"], [1889.9, "<span class=\"ayah\">﴿Allah sizi yeminlerinizdeki lağv sebebiyle sorumlu tutmaz; fakat kalplerinizin kazandığı şeyden dolayı sorumlu tutar. Allah çok bağışlayandır, halîmdir﴾<\/span> [Bakara 225]."]]}, {"reader": false, "ar": [[1899.0, "ولأنّ مثل هذا الأمر لو أننا حاسبنا صاحبَه عليه بعد توبته واستقامته فسيشقّ ذلك عليه؛"], [1908.0, "فحِدثانُ التوبة من الأمور التي توجب عمومَ البلوى،"], [1916.0, "وعمومُ البلوى من الأمور التي يحصل معها التخفيفُ ورفعُ المشقّة والتيسيرُ ورفعُ الحرج."], [1926.0, "وعلى ذلك قولُ أبي واقدٍ الليثيّ:"], [1931.0, "«خرجنا مع رسول الله صلى الله عليه وسلم ونحن حُدَثاءُ عهدٍ بكفر، وللمشركين سِدرةٌ يعكفون عندها ويَنوطون بها أسلحتَهم»،"], [1943.0, "فقالوا ما قالوه: «اجعلْ لنا ذاتَ أنواطٍ كما لهم ذاتُ أنواط»،"], [1950.0, "فأنكر النبيّ صلى الله عليه وسلم عليهم كلمتَهم هذه،"], [1954.0, "ولكن لم يأمرهم بتجديد التوحيد. واضحٌ هذا؟"]], "tr": [[1899.0, "Ayrıca bu gibi bir şeyden dolayı, tövbesinden ve istikamete gelişinden sonra sahibini hesaba çekseydik, bu ona meşakkat verirdi."], [1908.0, "Tövbenin yeniliği, umûmu'l-belvâyı (yaygın ve kaçınılması zor durumu) gerektiren şeylerdendir;"], [1916.7, "umûmu'l-belvâ ise beraberinde hafifletme, meşakkatin kaldırılması, kolaylık ve sıkıntının giderilmesi getiren şeylerdendir."], [1926.0, "Ebû Vâkıd el-Leysî'nin şu sözü de bunu ifade eder:"], [1931.0, "\"Küfürden yeni çıkmış kimseler olarak Resûlullah sallallâhu aleyhi ve sellem ile birlikte (Huneyn'e) çıktık."], [1937.2, "Müşriklerin yanında bekledikleri ve silahlarını astıkları bir sidre ağacı vardı.\" Onlar o sözü söylediler:"], [1946.0, "\"Bize de, onların Zâtu Envât'ı olduğu gibi bir Zâtu Envât yap.\" Peygamber sallallâhu aleyhi ve sellem onların bu sözünü reddetti, ama onlara tevhidi yenilemelerini emretmedi. Bu açık mı?"]]}, {"reader": false, "ar": [[1960.0, "ممّا يدلّ على أنّ مثل هذه المسائل لا بدّ أن يُنظر لها بعين الرحمة والمغفرة،"], [1967.0, "كما قال الله عز وجل:"], [1969.0, "<span class=\"ayah\">﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ۚ لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ ۗ رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا ۚ رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِن قَبْلِنَا﴾<\/span> <span class=\"ref\">[البقرة: ٢٨٦]<\/span> إلى آخر الآية."], [1984.4, "وفي «صحيح الإمام مسلم»:"], [1986.2, "قال الله عز وجل:"], [1988.1, "«قد فعلتُ». ولعموم قول الله عز وجل:"], [1991.0, "<span class=\"ayah\">﴿وَلَيْسَ عَلَيْكُمْ جُنَاحٌ فِيمَا أَخْطَأْتُم بِهِ وَلَٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْ﴾<\/span> <span class=\"ref\">[الأحزاب: ٥]<\/span>. والله أعلم."]], "tr": [[1960.0, "Bu da gösteriyor ki bu gibi meselelere mutlaka rahmet ve mağfiret gözüyle bakılmalıdır."], [1966.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1969.0, "<span class=\"ayah\">﴿Allah hiç kimseye gücünün yeteceğinden fazlasını yüklemez. Herkesin kazandığı (hayır) kendi lehine, kazandığı (şer) de kendi aleyhinedir. Rabbimiz! Unutur ya da hata edersek bizi sorumlu tutma. Rabbimiz! Bizden öncekilere yüklediğin gibi bize de ağır yük yükleme﴾<\/span> [Bakara 286] ayetin sonuna kadar."], [1984.4, "İmam Müslim'in Sahîh'inde (geçtiğine göre) Allah Azze ve Celle \"Yaptım (kabul ettim)\" buyurmuştur."], [1988.1, "Bir de Allah Azze ve Celle'nin şu sözünün umumu sebebiyle:"], [1991.0, "<span class=\"ayah\">﴿Hata ettiğiniz şeylerde size bir günah yoktur; ancak kalplerinizin kasten yöneldiği şeyler (sorumluluk gerektirir)﴾<\/span> [Ahzâb 5]. Allah en iyisini bilir."]]}]}, {"ts": "33:21", "title": "4. Külliye: Allah için sabit olan her isimle yemin etmek caizdir", "paras": [{"reader": false, "ar": [[2001.0, "الكلّيّة الرابعة والخامسة والسادسة هي في الأشياء التي يجوز الحلف بها،"], [2008.0, "فإذًا نأخذها مختصرة. الكلّيّة الرابعة:"], [2011.9, "<b>كلُّ ما ثبت لله من الأسماء فيجوز الحلفُ به.<\/b> <span class=\"note\">(يكررها)<\/span> لحديث ابن عمر رضي الله عنهما أنه أدرك عمرَ بنَ الخطّاب في ركبٍ وهو يحلف بأبيه،"], [2033.0, "فناداهم رسولُ الله صلى الله عليه وسلم:"], [2036.0, "«ألا إنّ الله ينهاكم أن تحلفوا بآبائكم، فمن كان حالفًا فليحلف بالله أو ليصمت»."], [2043.0, "فقولُه: «فليحلف بالله» ليس المرادُ بها اسمَ «الله» بخصوصه،"], [2048.0, "بل كلُّ ما أُطلق عليه سبحانه من الأسماء فإنها داخلةٌ في ذلك."]], "tr": [[2001.0, "4., 5. ve 6. külliyeler kendisiyle yemin edilmesi caiz olan şeyler hakkındadır;"], [2006.7, "o hâlde onları kısaca alalım."], [2011.0, "<b>4. külliye: Allah için sabit olan isimlerden her biriyle yemin etmek caizdir.<\/b> (Tekrar ediyor.) İbn Ömer radıyallâhu anhümâ hadisi sebebiyle:"], [2023.8, "(Peygamber) bir kafile içinde babası üzerine yemin ederken Ömer b."], [2032.2, "el-Hattâb'a yetişti. Resûlullah sallallâhu aleyhi ve sellem onlara şöyle seslendi:"], [2036.0, "\"Dikkat edin! Allah sizi babalarınız ile yemin etmekten nehyediyor."], [2043.0, "Kim yemin edecekse Allah ile yemin etsin ya da sussun.\" \"Allah ile yemin etsin\" sözüyle özellikle \"Allah\" ismi kastedilmemiştir;"], [2051.3, "aksine O Sübhânehû'ya verilen bütün isimler buna dahildir."]]}, {"reader": false, "ar": [[2056.0, "يقول الإمامُ أبو العبّاس القرطبيّ رحمه الله تعالى:"], [2060.0, "«وقولُه صلى الله عليه وسلم: من كان حالفًا فليحلف بالله، لا يُفهم منه قصرُ اليمين الجائزة على الحلف بهذا الاسم فقط، بل حكمُ جميع أسماء الله تعالى حكمُ هذا الاسم؛ فلو قال: والعزيزِ، والعليمِ، والقادرِ، والسميعِ، والبصيرِ، لكانت يمينًا جائزة، وهذا متّفقٌ عليه»."], [2087.0, "انتهى كلامه رحمه الله."], [2088.0, "واضح يا جماعة؟ طيّب."]], "tr": [[2056.0, "İmam Ebü'l-Abbâs el-Kurtubî —Allah ona rahmet etsin— şöyle der:"], [2060.0, "\"Peygamber sallallâhu aleyhi ve sellem'in 'Kim yemin edecekse Allah ile yemin etsin' sözünden, caiz yeminin sadece bu isimle yemin etmeye hasredildiği anlaşılmaz."], [2070.0, "Aksine Allah Teâlâ'nın bütün isimlerinin hükmü bu ismin hükmüdür."], [2074.4, "Meselâ 'Azîz'e, Alîm'e, Kâdir'e, Semî'e ve Basîr'e andolsun' dese, bu caiz bir yemin olur."], [2087.0, "Bu, üzerinde ittifak edilmiş bir husustur.\" Sözü —Allah ona rahmet etsin— burada bitti. Açık mı arkadaşlar? Peki."]]}, {"reader": false, "ar": [[2091.0, "وقد دلّ على هذه الكلّيّة أيضًا الإجماع؛"], [2096.0, "فقد نقل الإجماعَ على انعقاد الحلف بأسماء الله عز وجل كلٌّ من:"], [2101.9, "ابن رشدٍ الحفيد رحمه الله،"], [2104.0, "وابن قدامة الحنبليّ رحمه الله،"], [2108.0, "والنوويّ رحمه الله، وابن تيميّة رحمه الله،"], [2113.0, "وابن حجر، وقبلَهم الإمامُ ابنُ المنذر،"], [2118.0, "والإمامُ ابنُ عبد البرّ؛"], [2120.0, "كلُّ هؤلاء ينقلون الإجماعَ على أنّ الحلف بأسماء الله عز وجل من الأيمان المنعقدة. والله أعلم."]], "tr": [[2091.0, "Bu külliyeye icmâ da delâlet etmiştir."], [2093.9, "Allah Azze ve Celle'nin isimleriyle yeminin mün'akid olduğuna (geçerli bir yemin olarak kurulduğuna) dair icmâı şunların her biri nakletmiştir:"], [2101.9, "İbn Rüşd el-Hafîd —Allah ona rahmet etsin—, İbn Kudâme el-Hanbelî —Allah ona rahmet etsin—, Nevevî —Allah ona rahmet etsin—, İbn Teymiyye —Allah ona rahmet etsin—, İbn Hacer;"], [2114.8, "onlardan önce de İmam İbnü'l-Münzir ve İmam İbn Abdilber."], [2120.0, "Bunların hepsi, Allah Azze ve Celle'nin isimleriyle yeminin mün'akid yeminlerden olduğuna dair icmâı nakletmektedir. Allah en iyisini bilir."]]}]}, {"ts": "35:27", "title": "5. Külliye: Allah Azze ve Celle için sabit olan her sıfatla yemin etmek caizdir", "paras": [{"reader": false, "ar": [[2127.0, "الكلّيّة الخامسة: <b>كلُّ صفةٍ ثبتت لله عز وجل فيجوز الحلفُ بها.<\/b> أقول وبالله التوفيق:"], [2135.5, "وقد دلّت النصوصُ النبويّة الواردةُ عن النبيّ صلى الله عليه وسلم على جواز الحلف بصفات الله تعالى،"], [2144.0, "وهي نصوصٌ صحيحةٌ في «صحيحَي» الإمام البخاريّ ومسلم،"], [2148.0, "وقد استدلّ بها العلماء على ذلك."], [2151.0, "بل بوّب الإمامُ البخاريّ رحمه الله تعالى في «صحيحه»:"], [2155.0, "«بابُ الحلف بعزّة الله وصفاته وكلماته»."]], "tr": [[2127.0, "<b>5. külliye: Allah Azze ve Celle için sabit olan her sıfatla yemin etmek caizdir.<\/b> Tevfik Allah'tandır, derim ki:"], [2135.5, "Peygamber sallallâhu aleyhi ve sellem'den gelen nebevî nasslar, Allah Teâlâ'nın sıfatlarıyla yemin etmenin caiz olduğuna delâlet etmiştir."], [2143.5, "Bunlar İmam Buhârî'nin ve Müslim'in Sahîh'lerindeki sahih nasslardır ve âlimler bu konuda onlarla istidlal etmişlerdir."], [2151.0, "Hatta İmam Buhârî —Allah ona rahmet etsin— Sahîh'inde \"Allah'ın izzeti, sıfatları ve kelimeleri ile yemin babı\" diye bir bab açmıştır."]]}, {"reader": false, "ar": [[2161.0, "وقال ابنُ عبّاس رضي الله عنهما:"], [2164.0, "كان النبيّ صلى الله عليه وسلم يحلف بقوله:"], [2167.0, "«أعوذ بعزّتك». وقال أبو هريرة رضي الله عنه… وقال أبو هريرة عن النبيّ صلى الله عليه وسلم:"], [2177.0, "«يبقى رجلٌ بين الجنّة والنار فيقول: يا ربّ، اصرفْ وجهي عن النار، لا وعزّتِك لا أسألك غيرَها»."], [2187.0, "وقال أيّوب عليه السلام:"], [2189.0, "«وعزّتِك لا غنى لي عن بركتك»."], [2192.0, "ولا لا يا جماعة <span class=\"q\">؟ 36:32<\/span>؟"]], "tr": [[2161.0, "İbn Abbâs radıyallâhu anhümâ şöyle demiştir:"], [2164.0, "Peygamber sallallâhu aleyhi ve sellem \"İzzetine sığınırım\" sözüyle yemin ederdi."], [2167.0, "Ebû Hüreyre radıyallâhu anh dedi ki… Ebû Hüreyre, Peygamber sallallâhu aleyhi ve sellem'den şöyle rivayet etmiştir:"], [2177.0, "\"Cennet ile cehennem arasında bir adam kalır ve 'Ey Rabbim!"], [2180.9, "Yüzümü ateşten çevir; hayır, izzetine andolsun ki senden bundan başkasını istemeyeceğim' der.\" Eyyûb aleyhisselâm da şöyle demiştir:"], [2189.0, "\"İzzetine andolsun ki benim senin bereketinden müstağni kalmam olmaz.\" Değil mi arkadaşlar <span class=\"q\">؟<\/span>?"]]}, {"reader": false, "ar": [[2194.0, "وقد أورد الإمامُ البيهقيّ رحمه الله أيضًا جُمَلًا من الأحاديث في «السنن الكبرى»،"], [2201.0, "وبوّب عليها بقوله: «بابُ ما جاء في الحلف بصفات الله عز وجل، كالعزّة والقدرة والجلال والكبرياء والعظمة والكلام والسمع ونحو ذلك»،"], [2214.0, "وأورد تحته أثرًا عن ابن عمر رضي الله عنهما أنه سُئل عن الخمر،"], [2222.0, "فقال: «لا وسمعِ الله عز وجل، لا يحلّ بيعُها ولا ابتياعُها»."], [2231.0, "قال الإمامُ الحافظُ ابنُ عبد البرّ رحمه الله تعالى:"], [2235.0, "«الحلف بصفات الله تعالى جائزٌ تجب فيها الكفّارة؛ لأنها» ـ أي الصفات ـ «منه تعالى ذكرُه». انتهى كلامه."]], "tr": [[2194.0, "İmam Beyhakî —Allah ona rahmet etsin— de es-Sünenü'l-Kübrâ'da birtakım hadisler zikretmiş ve bunlara \"Allah Azze ve Celle'nin izzet, kudret, celâl, kibriyâ, azamet, kelâm, işitme ve benzeri sıfatlarıyla yemin hakkında gelenler babı\" diye başlık koymuştur."], [2215.8, "Bunun altında İbn Ömer radıyallâhu anhümâ'dan bir eser zikretmiştir:"], [2222.7, "Kendisine şarap sorulmuş, o da \"Hayır, Allah Azze ve Celle'nin işitmesine andolsun ki onun satılması da satın alınması da helal değildir\" demiştir."], [2231.0, "İmam Hâfız İbn Abdilber —Allah ona rahmet etsin— şöyle demiştir:"], [2235.0, "\"Allah Teâlâ'nın sıfatlarıyla yemin caizdir ve onlarda (yemin bozulursa) kefaret vâcip olur."], [2240.4, "Çünkü onlar\" —yani sıfatlar— \"zikri yüce olan O'ndandır.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2246.1, "وقال ابنُ رشد رحمه الله:"], [2248.7, "«وأمّا من منع الحلفَ بصفات الله وبأفعاله فضعيف»."], [2253.0, "انتهى كلامه رحمه الله."], [2254.7, "قال شيخُ الإسلام ابنُ تيميّة رحمه الله تعالى:"], [2258.0, "«فمعلومٌ أنّ من حلف بصفاته كالحلف به» ـ يعني أنّ من حلف بصفاته كالحلف به ـ «كما لو قال: وعزّةِ الله تعالى، أو لَعَمْرُ الله، أو والقرآنِ العظيم، فإنه قد ثبت جوازُ الحلف بالصفات ونحوها عن النبيّ صلى الله عليه وسلم والصحابة. ولأنّ الحلف بصفاته كالاستعاذة بها، وإن كانت الاستعاذة لا تكون إلا بالله، في مثل قول النبيّ صلى الله عليه وسلم: أعوذ بوجهك، وأعوذ بكلمات الله التامّات، وأعوذ برضاك من سخطك، ونحو ذلك؛ فالصفات مثلها. وهذا أمرٌ متقرّرٌ عند العلماء»؛"], [2302.0, "يعني أنهم جعلوا الاستعاذة والحلف بالصفة بابًا واحدًا."]], "tr": [[2246.1, "İbn Rüşd —Allah ona rahmet etsin— şöyle demiştir:"], [2248.7, "\"Allah'ın sıfatlarıyla ve fiilleriyle yemin etmeyi yasaklayanın görüşü ise zayıftır.\" Sözü —Allah ona rahmet etsin— burada bitti."], [2254.7, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2258.0, "\"Bilinmektedir ki O'nun sıfatlarıyla yemin eden, O'nunla yemin eden gibidir\" —yani O'nun sıfatlarıyla yemin etmek, O'nunla yemin etmek gibidir— \"'Allah Teâlâ'nın izzetine andolsun', 'Allah'ın bekâsına andolsun' ya da 'Kur'an-ı Azîm'e andolsun' demesi gibi."], [2281.4, "Çünkü sıfatlarla ve benzerleriyle yemin etmenin caizliği Peygamber sallallâhu aleyhi ve sellem'den ve sahabeden sabit olmuştur."], [2292.0, "Bir de O'nun sıfatlarıyla yemin etmek, onlarla istiâze etmek (sığınmak) gibidir;"], [2302.0, "istiâze ancak Allah'a yapılır, Peygamber sallallâhu aleyhi ve sellem'in 'Yüzüne sığınırım', 'Allah'ın eksiksiz kelimelerine sığınırım', 'Gazabından rızana sığınırım' ve benzeri sözlerinde olduğu gibi."], [2304.5, "Sıfatlar da onun gibidir. Bu, âlimler katında yerleşik bir husustur.\" Yani onlar sıfatla istiâzeyi ve sıfatla yemini tek bir bab saymışlardır."]]}, {"reader": false, "ar": [[2307.0, "وقد نصّ الأئمّةُ من فقهاء المذاهب الأربعة على جواز الحلف بالصفات."], [2314.0, "فهذا الكاسانيّ الحنفيّ يقول:"], [2316.7, "«إذا قال: وعزّةِ الله، وعظمةِ الله، وجلالِه، وكبريائه، يكون حالفًا؛ لأنّ هذه الصفات إذا ذُكرت في العُرف والعادة لا يُراد بها إلا نفسُها، فكان مرادُ الحالف بها الحلفَ بالله تعالى». انتهى كلامه."]], "tr": [[2307.0, "Dört mezhebin fakihlerinden imamlar sıfatlarla yeminin caiz olduğunu açıkça ifade etmişlerdir."], [2314.0, "İşte Hanefî Kâsânî şöyle der:"], [2316.7, "\"'Allah'ın izzetine, Allah'ın azametine, celâline ve kibriyâsına andolsun' derse yemin etmiş olur."], [2322.9, "Çünkü bu sıfatlar örfte ve âdette zikredildiğinde onlarla ancak (Allah'ın) kendisi kastedilir;"], [2327.6, "dolayısıyla onlarla yemin edenin muradı Allah Teâlâ ile yemin etmektir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2334.0, "ويقول أبو العبّاس القرطبيّ المالكيّ رحمه الله في قول الله عز وجل:"], [2339.0, "«من كان حالفًا فليحلف بالله»،"], [2341.1, "قال: «لا يُفهم منه قصرُ اليمين الجائزة على الحلف بهذا الاسم فقط، بل جميعُ أسماء الله تعالى لها حكمُ هذا؛ فلو قال: والعزيزِ، والعليمِ، والقادرِ، والسميعِ، والبصيرِ، لكانت يمينًا جائزة، وهذا متّفقٌ عليه. وكذلك الحكم في الحلف بصفات الله تعالى، كقوله: وعزّةِ الله، وعلمِه، وقدرتِه، وما أشبه ذلك ممّا تتمحّض فيه الصفةُ لله، ولا ينبغي أن يُختلف في هذا النوع أنها أيمانٌ كالقسم الأوّل»؛"], [2376.0, "يعني كالحلف بأسماء الله عز وجل. انتهى كلامه."]], "tr": [[2334.0, "Mâlikî Ebü'l-Abbâs el-Kurtubî —Allah ona rahmet etsin— \"Kim yemin edecekse Allah ile yemin etsin\" sözü hakkında (Şeyh burada \"Allah Azze ve Celle'nin sözü\" diyor) şöyle der:"], [2337.4, "\"Bundan, caiz yeminin sadece bu isimle yemin etmeye hasredildiği anlaşılmaz;"], [2339.0, "aksine Allah Teâlâ'nın bütün isimleri bunun hükmündedir."], [2339.9, "Meselâ 'Azîz'e, Alîm'e, Kâdir'e, Semî'e ve Basîr'e andolsun' dese, bu caiz bir yemin olur;"], [2341.5, "bu, üzerinde ittifak edilmiş bir husustur."], [2347.1, "Allah Teâlâ'nın sıfatlarıyla yeminde de hüküm böyledir;"], [2355.7, "'Allah'ın izzetine, ilmine ve kudretine andolsun' demesi ve sıfatın sadece Allah'a ait olduğu benzeri şeyler gibi."], [2376.0, "Bu türün de birinci kısım gibi yemin olduğunda ihtilaf edilmemesi gerekir.\" Yani Allah Azze ve Celle'nin isimleriyle yemin gibi. Sözü burada bitti."]]}, {"reader": false, "ar": [[2380.0, "والنصوصُ في ذلك كثيرة."], [2382.0, "يقول الإمامُ ابنُ قدامة رحمه الله:"], [2384.0, "«والقسمُ بصفات الله تعالى كالقسم بأسمائه». والله أعلم."]], "tr": [[2380.0, "Bu konudaki nasslar çoktur. İmam İbn Kudâme —Allah ona rahmet etsin— şöyle der:"], [2384.0, "\"Allah Teâlâ'nın sıfatlarıyla kasem, O'nun isimleriyle kasem gibidir.\" Allah en iyisini bilir."]]}]}, {"ts": "39:51", "title": "6. Külliye: Allah'a delâleti saf olan her haber (ifade) ile yemin etmek caizdir", "paras": [{"reader": false, "ar": [[2391.0, "الكلّيّة السادسة: <b>كلُّ خبرٍ متمحِّضٍ في الدلالة على الله فيجوز الحلفُ به.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span> أقول وبالله التوفيق:"], [2415.0, "ولا بدّ من هذا القيد ـ أعني قولَنا في الكلّيّة:"], [2420.0, "«متمحّضٍ في الدلالة على الله» ـ بمعنى أنّ السامع له لا ينقدح في ذهنه إلا إرادةُ الله عز وجل."]], "tr": [[2391.0, "<b>6. külliye: Allah'a delâlette saf (sadece Allah'a delâlet eden) her haber (ifade) ile yemin etmek caizdir.<\/b> (Üç kez tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [2415.6, "Bu kayıt —yani külliyedeki \"Allah'a delâlette saf\" sözümüz— zorunludur."], [2420.0, "Bunun anlamı şudur: Onu işiten kimsenin zihnine Allah Azze ve Celle'nin kastedilmesinden başka bir şey gelmez."]]}, {"reader": false, "ar": [[2429.0, "كقول الإنسان: «والذي نفسي بيده»،"], [2431.9, "فإنها خبريّةٌ متمحّضةٌ في الدلالة على الله."], [2436.0, "وكقوله: «والذي فلق الحبّة»،"], [2438.5, "فإنه خبرٌ متمحّضٌ في الدلالة على الله."], [2443.0, "وكقوله: «والذي برأ النَّسَمة»،"], [2445.2, "فإنه خبرٌ متمحّضٌ في الدلالة على الله."], [2449.0, "وكقوله: «أُقسم بالذي أطمع أن يغفر لي خطيئتي يوم الدين»،"], [2456.0, "فإنه خبرٌ متمحّضٌ في الدلالة على الله."], [2460.0, "وكقوله: «ومقلّبِ القلوب»، فإنه خبرٌ متمحّضٌ في الدلالة على الله."]], "tr": [[2429.0, "İnsanın \"Nefsim elinde olana andolsun\" demesi gibi;"], [2432.5, "bu, Allah'a delâlette saf bir haber ifadesidir."], [2436.0, "\"Taneyi yarana andolsun\" demesi gibi;"], [2439.2, "bu, Allah'a delâlette saf bir haberdir."], [2443.0, "\"Canlıyı yaratana andolsun\" demesi gibi;"], [2445.7, "bu, Allah'a delâlette saf bir haberdir."], [2449.0, "\"Din gününde hatalarımı bağışlamasını umduğum (Zât'a) yemin ederim\" demesi gibi;"], [2456.0, "bu, Allah'a delâlette saf bir haberdir."], [2460.0, "\"Kalpleri evirip çevirene andolsun\" demesi gibi;"], [2464.9, "bu, Allah'a delâlette saf bir haberdir."]]}, {"reader": false, "ar": [[2467.0, "وكقوله: «والذي رفع السماء بلا عمد»،"], [2471.0, "«والذي أنزل القرآن وتكلّم به»."], [2475.0, "وكقوله: «أحلف بمن أحلّ القسم» <span class=\"q\">؟ 41:15<\/span>؛"], [2482.0, "والتحليلُ والتحريمُ خبرٌ متمحّضٌ في الدلالة على الله عز وجل."], [2488.0, "وكقوله: «أحلف بمن يهدي القلوبَ هدايةَ التوفيق والإلهام»،"], [2495.0, "فهو خبرٌ متمحّضٌ في الدلالة على الله، وما أشبه ذلك."]], "tr": [[2467.0, "\"Göğü direksiz yükseltene andolsun\", \"Kur'an'ı indirene ve onu konuşana andolsun\" demesi gibi."], [2473.4, "\"Kasemi helal kılana yemin ederim\" <span class=\"q\">؟<\/span> demesi gibi;"], [2482.0, "helal ve haram kılmak, Allah Azze ve Celle'ye delâlette saf bir haberdir."], [2488.0, "\"Kalplere tevfik ve ilham hidayetiyle hidayet verene yemin ederim\" demesi gibi;"], [2495.6, "bu, Allah'a delâlette saf bir haberdir. Bunlara benzeyenler de böyledir."]]}, {"reader": false, "ar": [[2501.0, "فإن قلتَ: وما برهانُك على جواز الحلف بالخبريّة المتمحّضة في الدلالة على الله؟"], [2506.0, "فأقول: قولُ النبيّ… كان النبيّ صلى الله عليه وسلم إذا حلف قال:"], [2512.1, "«والذي نفسُ محمّدٍ بيده»،"], [2515.0, "وأحيانًا يقول: «والذي نفسي بيده»،"], [2518.0, "كما أخرجه الإمامُ أحمد وابنُ ماجه من حديث رفاعة الجُهَنيّ."], [2522.0, "وفي حديث عبد الله بن عمر قال:"], [2525.5, "«كثيرًا ما كان النبيّ صلى الله عليه وسلم يحلف: لا ومقلّبِ القلوب»، أخرجه الإمامُ البخاريّ."]], "tr": [[2501.0, "Eğer \"Allah'a delâlette saf haber ifadesiyle yemin etmenin caiz olduğuna delilin nedir?\" dersen, derim ki:"], [2506.0, "Peygamber'in sözü… Peygamber sallallâhu aleyhi ve sellem yemin ettiğinde \"Muhammed'in nefsi elinde olana andolsun\" derdi;"], [2512.1, "bazen de \"Nefsim elinde olana andolsun\" derdi."], [2516.2, "Bunu İmam Ahmed ve İbn Mâce, Rifâa el-Cühenî hadisinden rivayet etmiştir."], [2522.0, "Abdullah b. Ömer hadisinde şöyle dedi:"], [2524.5, "\"Peygamber sallallâhu aleyhi ve sellem çoğu zaman 'Hayır, kalpleri evirip çevirene andolsun' diye yemin ederdi.\" Bunu İmam Buhârî rivayet etmiştir."]]}, {"reader": false, "ar": [[2534.0, "وفي حديث أبي جُحَيفة رضي الله عنه قال:"], [2537.5, "قلتُ لعليٍّ رضي الله عنه:"], [2540.0, "هل عندكم شيءٌ من الوحي إلا ما في كتاب الله؟"], [2544.0, "قال: «والذي فلق الحبّة وبرأ النَّسَمة…» الحديثَ بتمامه،"], [2552.0, "وهو عند البخاريّ. وحديثُ الأعرابيّ الذي جاء يسأل النبيّ صلى الله عليه وسلم عن الإسلام،"], [2559.0, "قال: إنّ رسولك أتانا فزعم لنا أنك تزعم أنّ الله أرسلك،"], [2565.0, "قال: «صدق»، قال: فبالذي رفع السماءَ وبسط الأرض ـ كلُّ هذه خبريّاتٌ متمحّضةٌ في الدلالة على الله ـ وبسط الأرضَ ونصب هذه الجبال،"], [2578.0, "آللهُ أرسلك؟ قال: «نعم»."]], "tr": [[2534.0, "Ebû Cuhayfe radıyallâhu anh hadisinde şöyle dedi:"], [2537.5, "Ali radıyallâhu anh'a \"Sizin yanınızda Allah'ın Kitabı'nda olanın dışında vahiyden bir şey var mı?\" dedim."], [2544.0, "Şöyle dedi: \"Taneyi yarana ve canlıyı yaratana andolsun ki…\" hadisin tamamı (bilinir);"], [2554.0, "Buhârî'dedir. Bir de Peygamber sallallâhu aleyhi ve sellem'e İslâm'ı sormaya gelen bedevinin hadisi:"], [2559.5, "\"Senin elçin bize geldi ve Allah'ın seni gönderdiğini iddia ettiğini söyledi\" dedi."], [2562.8, "(Peygamber) \"Doğru söylemiş\" buyurdu. (Bedevi) dedi ki:"], [2565.7, "\"Göğü yükseltene ve yeri döşeyene andolsun —bunların hepsi Allah'a delâlette saf haber ifadeleridir— yeri döşeyene ve bu dağları dikene andolsun, seni Allah mı gönderdi?\" (Peygamber) \"Evet\" buyurdu."]]}, {"reader": false, "ar": [[2581.0, "ثم صار يحلف بتلك الخبريّة المتمحّضة في الدلالة على الله بين يدي رسول الله صلى الله عليه وسلم،"], [2589.7, "والنبيُّ صلى الله عليه وسلم يُقرّه ويُجيبه،"], [2593.1, "وإقرارُه صلى الله عليه وسلم حجّةٌ على الجواز. واضحٌ هذا؟ طيّب."]], "tr": [[2581.0, "Sonra (bedevi) Resûlullah sallallâhu aleyhi ve sellem'in huzurunda, Allah'a delâlette saf olan bu haber ifadesiyle yemin etmeye devam etti;"], [2590.7, "Peygamber sallallâhu aleyhi ve sellem de onu onaylıyor ve ona cevap veriyordu."], [2597.0, "O sallallâhu aleyhi ve sellem'in onaylaması da caizliğe delildir. Bu açık mı? Peki."]]}]}, {"ts": "43:17", "title": "7. Külliye: Allah'tan başkası ile yapılan yeminde tövbe ve tevhid kelimesini söylemek vâciptir", "paras": [{"reader": false, "ar": [[2598.7, "ومن الكلّيّات أيضًا ـ كلّيّةٌ خفيفة ـ:"], [2601.6, "كلُّ من حلف بغير الله فالواجبُ عليه التوبةُ والنطقُ بكلمة التوحيد."], [2608.0, "كلُّ يمينٍ… كلُّ يمينٍ صُرفت لغير الله… <b>كلُّ يمينٍ صُرفت لغير الله فالواجبُ فيها التوبةُ والنطقُ بكلمة التوحيد.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2598.7, "Külliyelerden biri de —hafif bir külliye—:"], [2601.6, "Allah'tan başkası ile yemin eden herkese tövbe etmek ve tevhid kelimesini söylemek vâciptir."], [2608.0, "Her yemin… Allah'tan başkasına yöneltilen her yemin… 7."], [2611.9, "külliye: Allah'tan başkasına yöneltilen her yeminde tövbe etmek ve tevhid kelimesini söylemek vâciptir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2630.0, "أقول وبالله التوفيق: والدليلُ على ذلك أثريٌّ ونظريّ."], [2636.0, "فأمّا الأثريّ: ففي «الصحيحين» من قول النبيّ صلى الله عليه وسلم:"], [2642.0, "«من حلف فقال في حلفه: واللاتِ والعُزّى، فليقل: لا إله إلا الله»."], [2651.0, "وهذا أمرٌ، والمتقرّر في القواعد أنّ الأمر المتجرّد عن القرينة يفيد الوجوب."]], "tr": [[2630.0, "Tevfik Allah'tandır, derim ki: Bunun delili hem eserî (nakli) hem nazarîdir (aklî)."], [2636.0, "Eserî delile gelince: Sahîhayn'de Peygamber sallallâhu aleyhi ve sellem'in şu sözü vardır:"], [2640.9, "\"Kim yemin eder de yemininde 'Lât'a ve Uzzâ'ya andolsun' derse, 'Lâ ilâhe illallah' desin.\" Bu bir emirdir;"], [2651.0, "kaidelerde yerleşik olan da şudur:"], [2653.5, "Karineden soyutlanmış emir vücûb ifade eder."]]}, {"reader": false, "ar": [[2657.0, "وأمّا الدليلُ النظريّ: فلأنه لمّا حلف بغير الله فيكون قد كسر توحيدَه وجرحه،"], [2665.6, "وهو بين كسرين وجرحين:"], [2673.0, "فإمّا أن يحلف بغير الله بمطلق التعظيم،"], [2677.4, "فيكون قد جرح توحيدَه مطلقَ الجرح،"], [2681.2, "وكسره مطلقَ الكسر، وجبرُه بكلمة التوحيد؛"], [2685.0, "وإمّا أن يكون قد حلف بغير الله بالتعظيم المطلق،"], [2692.0, "فيكون قد جرح توحيدَه الجرحَ المطلق،"], [2695.0, "وكسره الكسرَ المطلق، وعلاجُه ـ ليعودَ للإسلام ـ كلمةُ التوحيد."]], "tr": [[2657.0, "Nazarî delile gelince: Allah'tan başkası ile yemin ettiğinde tevhidini kırmış ve yaralamış olur."], [2664.2, "O, iki kırık ve iki yara arasındadır:"], [2673.0, "Ya Allah'tan başkası ile bir miktar tazimle yemin eder;"], [2677.4, "bu durumda tevhidini bir miktar yaralamış ve bir miktar kırmıştır;"], [2682.5, "onun telafisi de tevhid kelimesiyledir."], [2685.0, "Ya da Allah'tan başkası ile tam ve mutlak bir tazimle yemin etmiştir;"], [2692.0, "bu durumda tevhidini tamamen yaralamış ve tamamen kırmıştır;"], [2695.7, "onun çaresi de —İslâm'a dönmesi için— tevhid kelimesidir."]]}, {"reader": false, "ar": [[2701.0, "والله أعلم. وهذا مع وجوب التوبة،"], [2706.0, "وهذا مع وجوب التوبة؛"], [2708.0, "لأنّ الحلف بغير الله لا يعدو أن يكون شركًا أو كبيرةً أو ذنبًا،"], [2713.0, "وعلاجُ ذلك كلِّه التوبة؛"], [2716.0, "لقول الله عز وجل:"], [2717.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا تُوبُوا إِلَى اللَّهِ تَوْبَةً نَّصُوحًا﴾<\/span> <span class=\"ref\">[التحريم: ٨]<\/span>،"], [2725.0, "وقولِ الله عز وجل:"], [2726.8, "<span class=\"ayah\">﴿إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا﴾<\/span> <span class=\"ref\">[الزمر: ٥٣]<\/span>."]], "tr": [[2701.0, "Allah en iyisini bilir. Bu, tövbenin vâcip oluşuyla birliktedir;"], [2706.0, "bu, tövbenin vâcip oluşuyla birliktedir."], [2708.0, "Çünkü Allah'tan başkası ile yemin etmek;"], [2709.0, "şirk, büyük günah ya da (bir) günah olmaktan öteye geçmez;"], [2712.6, "bunların hepsinin çaresi de tövbedir."], [2716.0, "Allah Azze ve Celle'nin şu sözü sebebiyle:"], [2717.0, "<span class=\"ayah\">﴿Ey iman edenler! Allah'a nasûh (samimi) bir tövbe ile tövbe edin﴾<\/span> [Tahrîm 8] ve Allah Azze ve Celle'nin şu sözü sebebiyle:"], [2726.8, "<span class=\"ayah\">﴿Şüphesiz Allah bütün günahları bağışlar﴾<\/span> [Zümer 53]."]]}]}, {"ts": "45:29", "title": "8. Külliye: Kalbin kastı olmadan dile gelen her yemin lağvdir · 9. Külliye: Kesin inandığı bir şeye yemin edip aksi ortaya çıkan", "paras": [{"reader": false, "ar": [[2729.0, "ومن الكلّيّات أيضًا ـ وهي خفيفة ـ:"], [2731.0, "كلُّ من جرت اليمينُ بالله على لسانه بلا قصد جَنانه فلغو."], [2736.0, "<b>كلُّ يمينٍ جرت على اللسان بلا قصد الجَنان فلغو.<\/b> وهي كلّيّةٌ خفيفة."]], "tr": [[2729.0, "Külliyelerden biri de —ki hafiftir—:"], [2731.0, "Kalbinin kastı olmadan diline Allah ile yemin gelen herkesin (yemini) lağvdir."], [2735.5, "<b>8. külliye: Kalbin kastı olmadan dile gelen her yemin lağvdir.<\/b> Bu hafif bir külliyedir."]]}, {"reader": false, "ar": [[2756.0, "أقول وبالله التوفيق: وبرهانُها قولُ الله عز وجل:"], [2761.1, "<span class=\"ayah\">﴿لَّا يُؤَاخِذُكُمُ اللَّهُ بِاللَّغْوِ فِي أَيْمَانِكُمْ وَلَٰكِن يُؤَاخِذُكُم بِمَا كَسَبَتْ قُلُوبُكُمْ﴾<\/span> <span class=\"ref\">[البقرة: ٢٢٥]<\/span>،"], [2768.6, "وكسبُ القلب هو قصدُه."], [2772.0, "ويقول الله عز وجل في الآية الأخرى:"], [2775.2, "<span class=\"ayah\">﴿لَا يُؤَاخِذُكُمُ اللَّهُ بِاللَّغْوِ فِي أَيْمَانِكُمْ وَلَٰكِن يُؤَاخِذُكُم بِمَا عَقَّدتُّمُ الْأَيْمَانَ﴾<\/span> <span class=\"ref\">[المائدة: ٨٩]<\/span>، وتعقيدُ الأيمان قصدُها."]], "tr": [[2756.0, "Tevfik Allah'tandır, derim ki: Bunun delili Allah Azze ve Celle'nin şu sözüdür:"], [2761.1, "<span class=\"ayah\">﴿Allah sizi yeminlerinizdeki lağv sebebiyle sorumlu tutmaz; fakat kalplerinizin kazandığı şeyden dolayı sorumlu tutar﴾<\/span> [Bakara 225]."], [2769.3, "Kalbin kazancı, onun kastıdır. Allah Azze ve Celle diğer ayette şöyle buyurur:"], [2775.2, "<span class=\"ayah\">﴿Allah sizi yeminlerinizdeki lağv sebebiyle sorumlu tutmaz; fakat bağladığınız yeminlerden dolayı sorumlu tutar﴾<\/span> [Mâide 89]. Yeminleri bağlamak, onları kastetmektir."]]}, {"reader": false, "ar": [[2783.0, "وقد روى البخاريّ رحمه الله تعالى من حديث عائشة أنها قالت في تفسير لغو اليمين:"], [2791.2, "«هي قولُ الرجل: لا والله، وبلى والله»."], [2795.0, "وهو قولُ الإمام الشافعيّ وأحمد."], [2798.0, "قال المروزيّ: «هذا معنى لغو اليمين الذي اتّفق عليه العلماء كافّة»."], [2805.0, "انتهى كلامه. فإذا كان الإنسان قد جرت اليمينُ على لسانه بلا قصد جَنانه فليس فيها كفّارة؛"], [2814.3, "لأنها لم تنعقد أصلًا."]], "tr": [[2783.0, "Buhârî —Allah ona rahmet etsin— Âişe'nin hadisinden, onun lağv yemini tefsir ederken şöyle dediğini rivayet etmiştir:"], [2791.2, "\"O, kişinin 'Hayır, vallahi' ve 'Evet, vallahi' demesidir.\" Bu, İmam Şâfiî'nin ve Ahmed'in görüşüdür."], [2798.0, "Mervezî şöyle demiştir: \"Bu, bütün âlimlerin üzerinde ittifak ettiği lağv yemin anlamıdır.\" Sözü burada bi
