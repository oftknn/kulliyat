<script>
const D={"no": 9, "vid": "Wl4kw01xnE8", "title_ar": "الدرس (٩) من شرح كليات العقيدة — التمائم والطيرة والفأل", "title_tr": "Şerhu Külliyyâti'l-Akîde — 9. Ders: Temâim (Muskalar), Tıyera (Uğursuzluk İnancı) ve Fe'l", "sections": [{"ts": "00:00", "title": "1. Külliye: Muskaya tesir itikadı", "paras": [{"reader": false, "ar": [[0.0, "بسم الله الرحمن الرحيم."], [2.1, "الحمدُ لله ربِّ العالمين،"], [4.2, "والصلاةُ والسلامُ على رسول الله الأمين،"], [7.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [9.9, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [13.0, "نواصل ـ إن شاء الله عز وجل ـ ما ابتدأنا شرحه في الدرس الماضي من كلّيّات كتاب الاعتقاد."]], "tr": [[0.0, "Rahmân ve Rahîm olan Allah'ın adıyla."], [2.6, "Âlemlerin Rabbi Allah'a hamd olsun."], [5.2, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [16.3, "Allah'ın izniyle, geçen derste şerhine başladığımız itikad kitabının külliyelerine devam ediyoruz."]]}, {"reader": false, "ar": [[27.0, "الكلية الأولى: كلُّ من اعتقد في تميمةٍ تأثيرًا ذاتيًّا فشركٌ أكبر،"], [34.3, "أو تأثيرًا سببيًّا فشركٌ أصغر. كلُّ من اعتقد في تميمةٍ تأثيرًا ذاتيًّا فشركٌ أكبر،"], [46.1, "أو سببيًّا فشركٌ أصغر."], [51.0, "أعيدها مرةً أخرى: كلُّ من اعتقد في تميمةٍ تأثيرًا ذاتيًّا فشركٌ أكبر،"], [59.0, "أو سببيًّا فشركٌ أصغر."]], "tr": [[27.0, "1. külliye: Bir muskanın (temîme) zâtî bir tesiri olduğuna inanan herkesin bu inancı büyük şirktir;"], [44.7, "sebep olarak bir tesiri olduğuna inanmak ise küçük şirktir. (İki kez daha tekrar ediyor.)"]]}, {"reader": false, "ar": [[64.0, "أقول وبالله التوفيق: وهذا متفرّعٌ على كليةٍ شرحتُها في الدروس الماضية،"], [74.0, "وهي أن كلَّ من اعتقد في شيءٍ من المخلوقات أنه يدبّر استقلالًا أو يتصرّف استقلالًا،"], [82.0, "فإن هذا من أنواع الشرك الأكبر في باب الربوبية."], [85.0, "ونقوله تمامًا في مسألة التمائم:"], [91.0, "فإذا علّق الإنسان تميمةً فقد وقع في الشرك،"], [96.0, "ولكن هذا الشرك يكون من قبيل الشرك الأكبر في باب الربوبية إذا اعتقد أن التميمة هي التي تجلب الخير بذاتها،"], [106.0, "أو تدفع الضرّ بذاتها،"], [109.0, "أو أنها تقدّر ذلك أو تخلق ذلك أو توجده بذاتها."]], "tr": [[64.0, "Tevfik Allah'tandır, derim ki: Bu, geçen derslerde şerh ettiğim bir külliyeden dallanır:"], [74.5, "Mahlûkattan herhangi bir şeyin müstakil olarak tedbir ettiğine veya müstakil olarak tasarruf ettiğine inanan herkesin bu inancı, rubûbiyyet babında büyük şirk türlerindendir."], [85.8, "Aynısını muskalar meselesinde de söyleriz:"], [91.6, "İnsan bir muska taktığında şirke düşmüş olur."], [96.0, "Ama bu şirk, eğer hayrı bizzat muskanın getirdiğine, zararı bizzat onun def ettiğine ya da bunu onun takdir ettiğine, yarattığına veya bizzat var ettiğine inanırsa, rubûbiyyet babında büyük şirk kabilinden olur."]]}, {"reader": false, "ar": [[113.0, "فمتى ما علّق التميمة معتقدًا تأثيرها تأثيرًا ذاتيًّا،"], [121.0, "فإنه يكون بذلك قد جعلها مساويةً لله عز وجل في جلب الخير أو دفع الشر استقلالًا،"], [128.0, "وهذا نوعٌ من أنواع الشرك الأكبر."], [130.0, "وأما إذا علّقها معتقدًا أن الله عز وجل هو الذي يجلب الخيرات ابتداءً أو يدفع المضرّات ابتداءً،"], [141.0, "ولكن من أسباب استجلاب الخير واستدفاع الشر تعليقُ التميمة،"], [145.0, "فإنه حينئذٍ يبقى في دائرة الشرك الأصغر،"], [149.1, "لأنه جعلها في دائرة السببية."]], "tr": [[113.0, "Muskayı, onun zâtî bir tesiri olduğuna inanarak taktığı anda, onu hayrı getirmede veya şerri def etmede müstakil olarak Allah Teâlâ'ya denk kılmış olur;"], [127.1, "bu da büyük şirk türlerinden biridir."], [129.3, "Ama hayırları baştan (ibtidâen) getirenin ve zararları baştan def edenin Allah Teâlâ olduğuna inanarak, fakat hayrı celbetmenin ve şerri def etmenin sebeplerinden birinin de muska takmak olduğunu düşünerek takarsa, o zaman küçük şirk dairesinde kalır;"], [149.1, "çünkü onu sebeplilik dairesine koymuştur."]]}, {"reader": false, "ar": [[152.0, "ومن المعلوم أن سببية جلب الخيرات بالتمائم أو دفع المضرّات بالتمائم سببيةٌ لم يدلّ عليها دليل الشرع ولا دليل التجربة والقدر،"], [166.0, "وكلُّ من اتخذ سببيةً لم يدلّ عليها شرعٌ ولا قدرٌ فشركٌ أصغر،"], [172.0, "كما شرحناه في الدرس الماضي."], [176.0, "فإذا كانت التمائم في دائرة السببية فشركٌ أصغر،"], [179.0, "وإذا أخرجها عن دائرة السببية إلى دائرة الخالقية الفاعلية الذاتية فإنها تنقلب إلى شركٍ أكبر."], [189.0, "وهذا يختلف باختلاف ما يعتقده في قلبه في هذه التميمة."]], "tr": [[152.0, "Bilindiği üzere, muskalarla hayır getirme veya muskalarla zarar def etme sebepliliği, ne şer'î delilin ne de tecrübe ve kader (kevnî) delilinin gösterdiği bir sebepliliktir."], [167.0, "Ne şeriatın ne de kaderin gösterdiği bir sebepliliği edinen herkesin bu işi küçük şirktir;"], [175.2, "geçen derste bunu şerh etmiştik."], [177.5, "Muskalar sebeplilik dairesinde olursa küçük şirktir;"], [180.4, "onları sebeplilik dairesinden çıkarıp yaratıcılık, fâillik ve zâtîlik dairesine götürürse büyük şirke dönüşür."], [189.0, "Bu, kişinin bu muska hakkında kalbinde neye inandığına göre değişir."]]}, {"reader": false, "ar": [[197.0, "والمتقرّر في القواعد أن الشرك الأصغر ينقلب إلى أكبر إذا عظُم التنديد،"], [204.0, "كما سيأتينا في قواعد توحيد الربوبية ـ كليات توحيد الألوهية ـ إن شاء الله تعالى."]], "tr": [[197.0, "Kaidelerde yerleşik olan şudur: Küçük şirk, (Allah'a) denk tutma (tendîd) büyüdüğünde büyük şirke dönüşür."], [204.7, "İnşallah tevhid-i rubûbiyyet kaidelerinde —(yani) tevhid-i ulûhiyyet külliyelerinde— buna geleceğiz."]]}]}, {"ts": "03:29", "title": "2. Külliye: Bütün muskalar aslen yasaktır", "paras": [{"reader": false, "ar": [[209.0, "<b>الكلية الثانية: كلُّ التمائم على أصل المنع.<\/b> كلُّ التمائم على أصل المنع."], [224.0, "وذلك لقول النبي صلى الله عليه وسلم:"], [232.0, "«إن الرُّقى والتمائم والتِّوَلة شرك» <span class=\"note\">(Ebû Dâvûd, İbn Mâce)<\/span>،"], [234.0, "فحكم النبي صلى الله عليه وسلم عليها بأنها شرك."], [240.0, "وفي حديث أبي بشيرٍ رضي الله عنه أن النبي صلى الله عليه وسلم بعث رسولًا:"], [247.0, "«أن لا يبقينّ في رقبة بعيرٍ قلادةٌ من وترٍ إلا قُطعت» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[209.0, "<b>2. külliye: Bütün muskalar aslen yasaktır (men' asıl üzeredir).<\/b> (Tekrar ediyor.) Bunun delili Nebî ﷺ'in şu sözüdür:"], [227.7, "\"Rukyeler, muskalar ve tivele (sevgi büyüsü) şirktir.\" <span class=\"note\">(Ebû Dâvûd, İbn Mâce)<\/span> Nebî ﷺ onların şirk olduğuna hükmetmiştir."], [240.6, "Ebû Beşîr'in (r.a.) hadisinde de Nebî ﷺ bir elçi göndererek şunu bildirmiştir:"], [246.2, "\"Hiçbir devenin boynunda kiriş (yay teli) gerdanlık bırakılmayacak, ancak kesilecek.\" <span class=\"note\">(Buhârî, Müslim)<\/span>"]]}, {"reader": false, "ar": [[251.0, "وفي حديث رُوَيفعٍ رضي الله عنه قال:"], [255.6, "قال لي النبي صلى الله عليه وسلم:"], [260.0, "«يا رويفع، لعلّ الحياة ستطول بك من بعدي، فأخبر الناس أنّ من تقلّد وترًا، أو عقد لحيته، أو استنجى برجيع دابّةٍ أو عظمٍ، فإن محمدًا صلى الله عليه وسلم بريءٌ منه» <span class=\"note\">(Ahmed, Ebû Dâvûd, Nesâî)<\/span>."], [280.0, "والشاهد منه قوله صلى الله عليه وسلم:"], [283.2, "«أنّ من تقلّد وترًا»،"], [285.0, "كعادة الجاهلية في تقلّد هذه الأوتار وعقد اللحى من باب استجلاب الخيرات أو دفع المضرّات."], [293.0, "ويقول صلى الله عليه وسلم:"], [296.3, "«من تعلّق تميمةً فلا أتمّ الله له،"]], "tr": [[251.0, "Ruveyfi'in (r.a.) hadisinde şöyle der:"], [254.3, "Nebî ﷺ bana şöyle buyurdu:"], [257.5, "\"Ey Ruveyfi'! Belki benden sonra ömrün uzun olacak."], [262.5, "İnsanlara haber ver ki kim (boynuna) kiriş takarsa, sakalını düğümlerse veya hayvan tersiyle ya da kemikle istinca ederse, Muhammed ﷺ ondan uzaktır.\" <span class=\"note\">(Ahmed, Ebû Dâvûd, Nesâî)<\/span> Buradaki delil, Nebî ﷺ'in \"kim kiriş takarsa\" sözüdür;"], [283.2, "bu, cahiliyenin hayırları celbetmek veya zararları def etmek için bu kirişleri takma ve sakalları düğümleme âdetine işarettir."], [291.9, "Nebî ﷺ şöyle de buyurur:"], [295.0, "\"Kim bir muska takarsa Allah onun işini tamamlamasın;"]]}]}, {"ts": "05:00", "title": "2. Külliye (devam): Umum delilleri ve muskaların kısımları", "paras": [{"reader": false, "ar": [[301.0, "ومن تعلّق ودَعةً فلا وَدَعَ الله له» <span class=\"note\">(Ahmed)<\/span>."], [304.0, "فإن قلت: وما القاعدة الأصولية التي تتخرّج عليها هذه الأحاديث التي استشهدتُ بها على أن الأصل في التمائم كلِّها المنع؟"], [317.0, "فأقول: المتقرّر في القواعد أن ما ورد من أدلة الوحيين عامًّا فالأصل بقاؤه على عمومه،"], [326.8, "ولا يجوز تخصيصه إلا بدليل."]], "tr": [[301.0, "kim bir deniz kabuğu (ved'a) takarsa Allah onu rahata erdirmesin.\" <span class=\"note\">(Ahmed)<\/span> \"Bütün muskalarda aslın yasaklık olduğuna delil getirdiğim bu hadislerin dayandığı usûl kaidesi nedir?\" dersen, derim ki:"], [316.3, "Kaidelerde yerleşik olan şudur: İki vahiyden (Kitap ve Sünnet'ten) umumi olarak gelen delilde asıl, umumi kalmasıdır;"], [326.8, "ancak bir delille tahsis edilebilir."]]}, {"reader": false, "ar": [[331.0, "فقول النبي صلى الله عليه وسلم:"], [333.7, "«إن الرقى والتمائم»، فقوله:"], [335.7, "«التمائم» جمعٌ دخلت عليه الألف واللام الاستغراقية،"], [343.0, "والمتقرّر في القواعد أن الألف واللام الاستغراقية إذا دخلت على المفرد أو الجمع أكسبته العموم،"], [350.0, "فيدخل في ذلك كلُّ ما يسمّى تميمة،"], [353.0, "سواءٌ أكانت من القرآن أو من غير القرآن."]], "tr": [[331.0, "Nebî ﷺ'in \"Rukyeler ve muskalar…\" sözündeki \"muskalar\" (et-temâim) kelimesi, istiğrak (kapsama) bildiren elif-lâm takısı almış bir çoğuldur."], [343.0, "Kaidelerde yerleşik olan şudur: İstiğrak elif-lâmı tekil veya çoğul bir kelimeye girdiğinde ona umum kazandırır."], [350.0, "Dolayısıyla muska diye adlandırılan her şey, ister Kur'an'dan olsun ister Kur'an'dan olmasın, buna dahildir."]]}, {"reader": false, "ar": [[356.0, "وكذلك قوله صلى الله عليه وسلم:"], [360.3, "«من تعلّق تميمة»، فقوله:"], [363.6, "«من تعلّق» هذا شرط،"], [366.0, "وقوله: «تميمة» هذا نكرة،"], [368.8, "فهو نكرةٌ في سياق الشرط،"], [374.0, "والمتقرّر في القواعد أن النكرة في سياق الشرط تعمّ،"], [378.0, "فيدخل في ذلك كلُّ ما يسمّى تميمة."], [381.0, "وبما أن الأصل في اللفظ العام بقاؤه على عمومه،"], [386.0, "فكلُّ من خصّ تميمةً بالجواز فإنه يُعتبر مخالفًا للأصل،"], [392.0, "والمتقرّر في القواعد أن الدليل يُطلب من الناقل عن الأصل لا من الثابت عليه."]], "tr": [[356.0, "Aynı şekilde Nebî ﷺ'in \"Kim bir muska takarsa\" sözünde \"kim takarsa\" şarttır, \"bir muska\" ise nekredir (belirsiz isimdir);"], [368.1, "yani şart siyakında bir nekredir."], [371.7, "Kaidelerde yerleşik olan şudur: Şart siyakındaki nekre umum ifade eder."], [378.0, "Dolayısıyla muska diye adlandırılan her şey buna dahildir."], [381.0, "Umumi lafızda asıl umumi kalması olduğuna göre, herhangi bir muskayı caizlikle tahsis eden kişi asla aykırı davranmış sayılır."], [392.0, "Kaidelerde yerleşik olan şudur: Delil, asıl üzerinde sabit kalandan değil, asıldan başkasına geçenden istenir."]]}, {"reader": false, "ar": [[397.0, "وقد قسّم العلماء التمائم إلى قسمين:"], [403.0, "إلى تمائم شركية، وإلى تمائم من القرآن."], [406.0, "وجعلوا التمائم الشركية: الأشياءَ الجامدة التي يعلّقها الإنسان كوَدَعةٍ أو غيرها،"], [416.0, "أو تلك التمائمَ التي اشتملت على تعويذاتٍ شركية أو كلماتٍ غير مفهومة المعنى،"], [425.0, "والتي يكون غالبها أسماءَ الشياطين التي يستدفع معلّقُها بهم الشر أو يجلب بهم الخير، ويسمّونهم خَدَمةَ التميمة."]], "tr": [[397.0, "Âlimler muskaları iki kısma ayırmıştır:"], [400.8, "şirkî muskalar ve Kur'an'dan muskalar."], [404.7, "Şirkî muskaları şöyle tanımlamışlardır: İnsanın taktığı deniz kabuğu ve benzeri cansız şeyler ya da şirkî sığınma sözleri (taʿvîzât) veya anlamı anlaşılmayan kelimeler içeren muskalar."], [422.8, "Bunların çoğu, muskayı takanın onlar vasıtasıyla şerri def etmeye veya hayrı celbetmeye çalıştığı şeytanların isimleridir; bunlara \"muskanın hizmetçileri\" derler."]]}, {"reader": false, "ar": [[440.0, "فهذه تمائم شركية، وقد أجمع العلماء قاطبةً على حرمتها وعلى أنها شرك؛"], [448.0, "فتكون شركًا أصغر إذا كانت في دائرة السببية،"], [453.0, "وتكون شركًا أكبر إذا خرجت إلى دائرة الخالقية الفاعلية الذاتية."]], "tr": [[440.0, "İşte bunlar şirkî muskalardır. Âlimler, bunların haram ve şirk olduğunda istisnasız icmâ etmiştir."], [449.2, "Sebeplilik dairesinde olurlarsa küçük şirk, yaratıcılık, fâillik ve zâtîlik dairesine çıkarlarsa büyük şirk olur."]]}, {"reader": false, "ar": [[460.0, "وأما التمائم من القرآن فهي محطُّ خلافٍ بين أهل العلم رحمهم الله تعالى؛"], [468.0, "فليست مسألة حكم التميمة من القرآن من مسائل الدين الكبار التي يُوالى ويُعادى عليها،"], [476.2, "أو يوصف بالبدعة من أجازها أو منعها،"], [480.0, "لأن المتقرّر في القواعد أن كلَّ مسألةٍ عقديةٍ خلافيةٍ في دائرة أهل السنة فلا يجوز أن نجعلها موئلًا لعقد الولاء والبراء،"], [491.9, "أو الحكم بالسنة أو البدعة."]], "tr": [[460.0, "Kur'an'dan muskalara gelince, bunlar ilim ehli (rahimehumullah) arasında ihtilaf konusudur."], [465.5, "Kur'an'dan muskanın hükmü meselesi, üzerine dostluk ve düşmanlık kurulan veya onu caiz görenin ya da yasaklayanın bid'atle nitelendiği büyük din meselelerinden değildir."], [477.3, "Çünkü kaidelerde yerleşik olan şudur:"], [479.5, "Ehl-i Sünnet dairesinde ihtilaflı olan her itikadî meseleyi velâ ve berâ (dostluk ve uzaklaşma) bağı kurmak ya da sünnet veya bid'at hükmü vermek için bir dayanak yapmak caiz değildir."]]}, {"reader": false, "ar": [[495.0, "فذهب جمعٌ من أهل العلم إلى جوازها،"], [500.0, "بينما ذهب جمعٌ من أهل العلم إلى منعها وتحريمها،"], [506.2, "وهم الأكثر. والذين قالوا بجوازها استدلّوا بعموم الآيات في أن القرآن شفاء،"], [519.0, "فحيثما قلّبتَه فهو شفاء،"], [521.8, "سواءٌ بالرقية أو بتعليق شيءٍ منه."], [529.0, "فيستدلّون عليها بالعمومات القرآنية،"], [531.9, "كقوله عز وجل: <span class=\"ayah\">﴿وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ﴾<\/span> <span class=\"ref\">[الإسراء: ٨٢]<\/span> على أيّ طريقةٍ اتُّخذ شفاءً،"], [540.0, "وقوله عز وجل: <span class=\"ayah\">﴿قُلْ هُوَ لِلَّذِينَ آمَنُوا هُدًى وَشِفَاءٌ﴾<\/span> <span class=\"ref\">[فصلت: ٤٤]<\/span>،"], [546.0, "وقول الله عز وجل:"], [548.5, "<span class=\"ayah\">﴿وَشِفَاءٌ لِّمَا فِي الصُّدُورِ﴾<\/span> <span class=\"ref\">[يونس: ٥٧]<\/span>."]], "tr": [[495.0, "İlim ehlinden bir grup bunların caiz olduğu görüşüne, bir grup da yasak ve haram olduğu görüşüne gitmiştir;"], [504.8, "bunlar çoğunluktur. Caiz diyenler, Kur'an'ın şifa olduğunu bildiren ayetlerin umumuyla delil getirmişlerdir:"], [512.2, "Onu nasıl çevirirsen çevir şifadır;"], [519.0, "ister rukye ile ister ondan bir şey takmakla."], [523.9, "Buna Kur'an'daki umumi ifadelerle delil getirirler;"], [530.4, "Allah Teâlâ'nın şu sözleri gibi:"], [533.3, "<span class=\"ayah\">﴿Biz Kur'an'dan şifa olan şeyler indiriyoruz﴾<\/span> [İsrâ 82] —hangi yolla şifa olarak kullanılırsa kullanılsın—;"], [540.0, "<span class=\"ayah\">﴿De ki: O, iman edenler için bir hidayet ve şifadır﴾<\/span> [Fussilet 44];"], [547.2, "<span class=\"ayah\">﴿ve göğüslerde olana bir şifa﴾<\/span> [Yûnus 57]."]]}, {"reader": false, "ar": [[551.0, "فإذا علّقنا شيئًا منه استشفاءً فتدخل تلك الصورة في العموم،"], [561.0, "كما أننا إذا قرأناه في ماءٍ واستعملناه،"], [565.2, "أو زيتٍ واستعملناه، أو كتبناه في شيءٍ من الرِّقاع وأذبناه في ماءٍ ثم شربنا منه؛"], [573.0, "فكلُّ هذه صورٌ لا تجد عليها أدلةً مرفوعةً بخصوصها،"], [579.0, "ومع ذلك أهل السنة يجيزونها ويقبلونها."], [583.0, "فيجعلون من جملة الاستشفاء بالقرآن تعليقَ شيءٍ منه على محلّ الألم مثلًا."]], "tr": [[551.0, "(Derler ki:) Ondan bir şeyi şifa niyetiyle taktığımızda bu şekil de umuma girer."], [561.6, "Tıpkı onu suya okuyup kullanmamız, zeytinyağına okuyup kullanmamız ya da bir kâğıt parçasına yazıp suda eritip ondan içmemiz gibi."], [571.0, "Bütün bu şekiller için özellikle bunlara dair merfû deliller bulamazsın;"], [575.7, "buna rağmen Ehl-i Sünnet bunları caiz görür ve kabul eder."], [581.7, "Böylece mesela ondan bir şeyi ağrıyan yere asmayı da Kur'an'la şifa aramanın bir parçası sayarlar."]]}, {"reader": false, "ar": [[593.0, "بينما أكثر أهل العلم يمنعونه،"], [596.3, "ويجعلون هذه الصورة بخصوصها من جملة التمائم التي لا تجوز،"], [605.0, "لأنها من جملة المعلّقات التي يرجو بها العبد جلبَ خيرٍ أو دفعَ شر،"], [611.5, "وأثرُها توهّميٌّ خيالي؛ ولأن صورة الاستشفاء بالقرآن لا بد أن تكون توقيفيةً أو عليها عملُ السلف المجمَعُ عليه،"], [624.0, "ولا نعلم أن هناك دليلًا يدلّ على الاستشفاء بالقرآن بتعليق شيءٍ من آياته."]], "tr": [[593.0, "Oysa ilim ehlinin çoğu bunu yasaklar ve özellikle bu şekli caiz olmayan muskalardan sayar."], [601.0, "Çünkü bu, kulun onunla hayır celbetmeyi veya şer def etmeyi umduğu takılan şeylerdendir ve tesiri vehmî ve hayalîdir."], [612.0, "Ayrıca Kur'an'la şifa aramanın şekli ya tevkîfî (nassa bağlı) olmalı ya da selefin üzerinde icmâ ettiği bir uygulamaya dayanmalıdır."], [624.0, "Kur'an'ın ayetlerinden bir şey takarak onunla şifa aramaya delâlet eden bir delil olduğunu bilmiyoruz."]]}]}, {"ts": "10:32", "title": "2. Külliye (devam): En doğru görüş: Kur'an'dan muska da yasaktır", "paras": [{"reader": false, "ar": [[632.0, "فإن الاستشفاء به لا بد أن يكون فيه سببيةٌ وأثرٌ ظاهر،"], [638.0, "كأن يُقرأ على شيءٍ ثم يدخل جسدك،"], [641.0, "أو يُنفث به على محلّ الألم،"], [646.0, "أو نحو ذلك. وأما أن يُكتب في ورقةٍ ثم يُعلَّق،"], [650.0, "فليس هناك سببيةٌ واضحةٌ في مدى هذا التأثير."], [655.0, "وهذا القول هو الأقرب إن شاء الله لعدّة أمور:"]], "tr": [[632.0, "Onunla şifa aramada açık bir sebeplilik ve görünür bir tesir bulunmalıdır:"], [638.0, "Bir şeye okunup sonra bedenine girmesi ya da ağrıyan yere okunup üflenmesi veya benzeri gibi."], [646.7, "Ama bir kâğıda yazılıp sonra asılmasına gelince, bu tesirin boyutunda açık bir sebeplilik yoktur."], [653.8, "İnşallah doğruya en yakın olan bu görüştür; birkaç sebepten dolayı:"]]}, {"reader": false, "ar": [[660.0, "الأمر الأول: لعموم الأدلة التي ذكرتُها لكم سابقًا في تحريم ما يسمّى تمائم،"], [669.0, "فيدخل فيه التمائم وإن كانت من القرآن أو التعاويذ المشروعة أو الأدعية المباحة."], [677.0, "الأمر الثاني: أنّ من المعلوم من أصول الشرع وجوبَ سدّ الذرائع التي تُفضي إلى ما وراءها من الأمور المحرّمة،"], [690.0, "فنحن نمنع تعليق التمائم من القرآن من باب سدّ الذريعة؛"], [697.0, "إذ إنه إذا كان يعلّقها ولا تزال المضرّات تصيبه،"], [704.0, "فلربما يأتيه الشيطان ويقول:"], [705.8, "إن هذا النوع من التمائم لا ينفع في جلب خيرٍ ولا في دفع شر،"], [712.0, "ثم يجرّه منها إلى ما وراءها من التمائم الشركية المجمَع على تحريمها."]], "tr": [[660.0, "Birincisi: Size daha önce zikrettiğim, muska diye adlandırılan şeylerin haramlığına dair delillerin umumu."], [669.0, "Muskalar, Kur'an'dan veya meşru sığınma dualarından ya da mubah dualardan olsa bile buna dahildir."], [678.3, "İkincisi: Şeriatın usûlünden bilindiği üzere, ötesindeki haram işlere götüren zerîalerin (vasıtaların) kapatılması vaciptir."], [687.4, "Biz Kur'an'dan muska takmayı sedd-i zerîa (vasıtayı kapatma) babından yasaklarız."], [694.9, "Çünkü kişi onu taktığı hâlde zararlar ona isabet etmeye devam ederse, belki şeytan ona gelip \"Bu tür muska ne hayır getirmeye ne de şer def etmeye yarar\" der;"], [712.0, "sonra onu bundan, ötesindeki haramlığı üzerinde icmâ edilmiş şirkî muskalara sürükler."]]}, {"reader": false, "ar": [[719.0, "فقطعًا لدابر الشر والوصول إلى مثل ذلك نقول بمنع التمائم من القرآن."], [727.0, "فبان لك بذلك أن تحريم التمائم الشركية تحريمُ مقاصد،"], [733.0, "وأن تحريم التمائم من القرآن تحريمُ وسائل."], [739.0, "ومن الأوجه أيضًا: أن المتقرّر في القواعد أن كلَّ ما يوجب انصرافَ شعبةِ توكّل القلب على غير الله فالواجب سدُّها،"], [752.0, "ومتى ما علّق الإنسان شيئًا من التمائم القرآنية على جسده فلا بد لزامًا أن تنصرف ولو شعبةٌ من قلبه معتمدةً على أثر هذه التميمة."]], "tr": [[719.0, "Şerrin ve buna benzer şeylere varmanın kökünü kesmek için Kur'an'dan muskaların yasak olduğunu söyleriz."], [728.3, "Böylece sana açıkça görünmüştür ki şirkî muskaların haramlığı maksatların (bizzat kendisinin) haramlığıdır;"], [736.7, "Kur'an'dan muskaların haramlığı ise vasıtaların haramlığıdır."], [741.6, "Gerekçelerden biri de şudur: Kaidelerde yerleşik olan şudur:"], [746.8, "Kalbin tevekkülünden bir şubenin Allah'tan başkasına yönelmesini gerektiren her şeyi kapatmak vaciptir."], [754.8, "İnsan Kur'anî muskalardan birini bedenine taktığı anda, kalbinden hiç değilse bir şubenin bu muskanın tesirine dayanarak ona yönelmesi kaçınılmazdır."]]}, {"reader": false, "ar": [[771.0, "فسدًّا لذريعة انصراف شعبة القلب لغير الله عز وجل نمنع هذا التعليق،"], [778.0, "ولذلك قال النبي صلى الله عليه وسلم:"], [782.0, "«من تعلّق شيئًا وُكِل إليه» <span class=\"note\">(Tirmizî, Ahmed)<\/span>،"], [785.0, "كما سيأتينا في كليةٍ خاصةٍ إن شاء الله."], [789.0, "ومن الأوجه أيضًا: أن الأدلة دلّت على وجوب حفظ ـ المحافظة على ـ القرآن وصيانته من كلّ ما من شأنه إهانته،"], [800.0, "ومن المعلوم أن الإنسان قد يعلّق هذه التمائم من القرآن على جسده فيدخل به دورة الخلاء ناسيًا،"], [812.0, "أو يعلّقها على بهيمته فتتمرّغ عليها أو تبول أو تروث عليها،"], [818.0, "أو يعلّقها على صبيٍّ له فيبول أو يتغوّط أو يتقيّأ عليها أو ينام عليها."]], "tr": [[771.0, "Kalpten bir şubenin Allah Teâlâ'dan başkasına yönelmesi vasıtasını kapatmak için bu takmayı yasaklarız."], [778.0, "Bu yüzden Nebî ﷺ şöyle buyurmuştur:"], [781.4, "\"Kim bir şey takarsa ona havale edilir (o şeye bırakılır).\" <span class=\"note\">(Tirmizî, Ahmed)<\/span> İnşallah buna özel bir külliyede geleceğiz."], [790.7, "Gerekçelerden biri de şudur: Deliller, Kur'an'ı korumanın ve onu ona ihanet sayılabilecek her şeyden muhafaza etmenin vacip olduğunu göstermiştir."], [801.3, "Bilindiği gibi insan Kur'an'dan bu muskaları bedenine takar da unutarak onunla helaya girer;"], [809.2, "ya da hayvanına takar, hayvan onun üzerinde yuvarlanır, üzerine idrar eder veya pisler;"], [816.9, "ya da küçük çocuğuna takar, çocuk onun üzerine idrar eder, dışkılar, kusar veya onun üzerinde uyur."]]}, {"reader": false, "ar": [[825.0, "فتعليق التمائم من القرآن يُفضي إلى شيءٍ من صور إهانته،"], [831.0, "فلا بد أن نسدّ هذا الباب سدًّا محكمًا."], [837.0, "ولذلك قال الناظم: «واحذرْ هُديتَ من التمائم مطلقًا ... حتى وإن كانت من القرآنِ / لعمومها ـ أعني النصوصَ ـ وهكذا ... ذا سدُّ الذريعة، هذه وجهانِ / وكذاك خشيتُنا دخولَك في الخلا ... فامنعْ هُديتَ قلائدَ الشيطانِ»."], [860.0, "فلهذه الأوجه نقول: القول الصحيح هو تحريم التمائم من القرآن. والله أعلم."]], "tr": [[825.0, "Kur'an'dan muska takmak, ona ihanetin bazı şekillerine götürür;"], [828.6, "bu yüzden bu kapıyı sımsıkı kapatmamız gerekir."], [833.2, "Bu yüzden nâzım şöyle demiştir:"], [836.1, "\"Hidayete eresin, muskalardan mutlak olarak sakın, Kur'an'dan olsalar bile."], [842.1, "/ (Nasların) umumu sebebiyle —yani nasları kastediyorum—, bir de sedd-i zerîa;"], [850.0, "işte iki gerekçe. / Bir de helaya (onunla) girmenden korkmamız;"], [855.4, "hidayete eresin, şeytanın gerdanlıklarını yasakla.\" Bu gerekçelerden dolayı deriz ki:"], [862.1, "Doğru görüş, Kur'an'dan muskaların haram olduğudur. Allah en iyisini bilir."]]}]}, {"ts": "14:29", "title": "3. Külliye: Hayalî ve vehmî uğursuzluk inancı", "paras": [{"reader": false, "ar": [[869.0, "ومن الكليات أيضًا: كلُّ تشاؤمٍ خياليٍّ توهّميٍّ فشركٌ أكبر إن كان في دائرة الفاعلية،"], [885.0, "وشركٌ أصغر إن كان في دائرة السببية. أعيدها مرةً ثالثة:"], [898.0, "كلُّ تشاؤمٍ خياليٍّ توهّميٍّ فشركٌ أكبر إن كان في دائرة الفاعلية،"], [905.0, "وشركٌ أصغر إن كان في دائرة السببية."]], "tr": [[869.0, "Külliyelerden biri de şudur: 3."], [881.0, "külliye: Hayalî ve vehmî her uğursuzluk inancı (teşâüm), fâillik dairesinde ise büyük şirk, sebeplilik dairesinde ise küçük şirktir. Üçüncü kez tekrar ediyorum: (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[909.0, "وهذا الباب من الأبواب العقدية العظيمة المهمة التي نريد أن نقف عندها طويلًا،"], [917.0, "لأن تفاصيلها كثيرة. فنقول وبالله التوفيق:"], [923.0, "هذا الباب هو الذي يسمّيه أهل العلم بباب التطيّر أو الطِّيَرة،"], [930.0, "ويسمّيها العرب بالعِيافة، وهي عادةٌ كانت شائعةً عند العرب في الجاهلية."], [940.0, "فإن قلت: ولماذا سُمّيت بالطيرة مع أن الأشياء المتشاءَم منها كثيرة؟"], [948.0, "فنقول: لأن غالب ما كان يتشاءم منه العربُ هو الطائر بكل أنواعه،"], [953.9, "ولا سيما بالغراب أو البوم أو العَقْعَق وغيرها من الطيور؛"], [967.0, "فلأنّ أكثر ما يتشاءم به العرب هي الطيور سُمّي بابَ التطيّر أو الطيرة."]], "tr": [[909.0, "Bu bab, uzun uzun üzerinde durmak istediğimiz büyük ve önemli itikadî bablardandır;"], [916.3, "çünkü ayrıntıları çoktur. Tevfik Allah'tandır, deriz ki:"], [921.9, "Bu bab, ilim ehlinin \"tetayyur\" ya da \"tıyera\" babı dediği babdır;"], [929.4, "Araplar buna \"ıyâfe\" derler. Cahiliye döneminde Araplar arasında yaygın bir âdetti."], [938.4, "\"Uğursuz sayılan şeyler çok olduğu hâlde neden 'tıyera' (kuşla ilgili) diye adlandırıldı?\" dersen, deriz ki:"], [949.0, "Çünkü Arapların uğursuz saydığı şeylerin çoğu, her türüyle kuşlardı;"], [953.0, "özellikle karga, baykuş, saksağan ve diğer kuşlar."], [957.1, "Arapların en çok uğursuz saydığı şey kuşlar olduğu için (bu bab) \"tetayyur\" ya da \"tıyera\" babı diye adlandırıldı."]]}, {"reader": false, "ar": [[977.0, "فقد كان أحدهم إذا خرج لمقصوده قصد عُشَّ طائرٍ قريبٍ منه ثم يُهيّجه؛"], [989.0, "فإن طار يمينًا علم أن سفره أو تجارته أو زواجه سعد ـ يعني كلّه سعد ـ ويسمّونه إذا طار يمينًا بالسانح."], [1006.0, "وأما إذا طار بعد تهييجه شمالًا فإنه يُحجم عن مقصوده الذي كان يريد،"], [1017.0, "ويسمّونه بالبارح. ولذلك يقول قائلهم:"], [1022.0, "«زعم البوارحُ أنّ رحلتنا غدًا ... وبذاك نبّأنا الغرابُ الأبقعُ» <span class=\"note\">(Şeyh'in okuduğu lafız; bkz. notlar)<\/span>."]], "tr": [[977.0, "Onlardan biri bir maksatla yola çıkacağı zaman, yakınındaki bir kuş yuvasına yönelir, sonra kuşu ürkütürdü."], [988.0, "Kuş sağa uçarsa, yolculuğunun, ticaretinin veya evliliğinin uğurlu olduğunu —yani hepsinin uğurlu olduğunu— anlardı."], [998.0, "Kuş sağa uçtuğunda buna \"sânih\" derlerdi."], [1001.6, "Ürkütüldükten sonra sola uçarsa, yapmak istediği maksattan geri dururdu;"], [1009.8, "buna da \"bârih\" derlerdi. Bu yüzden onlardan biri şöyle der:"], [1017.0, "\"Bârihler (sola uçan kuşlar) yolculuğumuzun yarın olduğunu iddia etti;"], [1024.1, "bunu bize alacalı karga da haber verdi.\""]]}, {"reader": false, "ar": [[1033.0, "وهو من باب الاستقسام بالأزلام،"], [1036.6, "فإنه نوعُ تطيّر. فجاءت الشريعة بتحريم ذلك والحكم عليه بأنه نوعٌ من أنواع الشرك."], [1050.0, "ففي حديث ابن عمر ـ في غير الصحيحين ـ أن النبي صلى الله عليه وسلم قال:"], [1058.0, "«من ردّته الطِّيَرة عن حاجةٍ فقد أشرك»."], [1062.0, "وفي حديث أبي هريرة في الصحيحين أن النبي صلى الله عليه وسلم قال:"], [1070.4, "«لا عدوى ولا طِيَرة ولا هامة ولا صَفَر» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[1033.0, "Bu, fal oklarıyla kısmet aramak (istiksâm bi'l-ezlâm) babındandır;"], [1038.1, "çünkü o da bir tetayyur türüdür."], [1044.8, "Şeriat bunu haram kılarak ve onun bir şirk türü olduğuna hükmederek geldi."], [1051.7, "İbn Ömer'in hadisinde —Sahîhayn dışında— Nebî ﷺ şöyle buyurmuştur:"], [1056.3, "\"Tıyera kimi ihtiyacından (işinden) alıkoyarsa, o kimse şirk koşmuştur.\" Ebû Hüreyre'nin Sahîhayn'deki hadisinde de Nebî ﷺ şöyle buyurmuştur:"], [1065.9, "\"Hastalık bulaşması (kendiliğinden) yoktur, tıyera yoktur, hâme (baykuş uğursuzluğu) yoktur, safer (ayı uğursuzluğu) yoktur.\" <span class=\"note\">(Buhârî, Müslim)<\/span>"]]}, {"reader": false, "ar": [[1076.0, "وكلُّ هذا من باب ما كانت العرب تتشاءم به؛"], [1082.0, "فقد كانت تتشاءم بانتقال العدوى،"], [1085.4, "وتتشاءم بالطيور، وتتشاءم بالهامة ـ أي البومة ـ وتتشاءم بشهر صفر."], [1093.0, "ولمسلمٍ في روايةٍ قال:"], [1095.9, "«ولا نَوْءَ ولا غُول»."], [1099.0, "وفي حديث ابن مسعودٍ رضي الله عنه ـ موقوفًا عليه،"], [1104.6, "ومثلُه لا يقال بالرأي فله حكم الرفع ـ:"], [1108.5, "«الطيرة شرك، الطيرة شرك، الطيرة شرك»."], [1109.0, "قال ابن مسعود: «وما منّا إلا» ـ يعني إلا وقع في شيءٍ من ذلك ـ «إلا أن الله عز وجل يُذهبه بالتوكّل» <span class=\"note\">(Ebû Dâvûd, Tirmizî)<\/span>."]], "tr": [[1076.0, "Bunların hepsi Arapların uğursuz saydığı şeyler babındandır:"], [1079.6, "Hastalığın bulaşmasını uğursuz sayarlardı, kuşları uğursuz sayarlardı, hâmeyi —yani baykuşu— uğursuz sayarlardı, safer ayını uğursuz sayarlardı."], [1090.1, "Müslim'in bir rivayetinde: \"Nev' (yıldızla yağmur beklemek) yoktur, gûl (gulyabani) yoktur\" buyurmuştur."], [1099.6, "İbn Mes'ûd'un (r.a.) hadisinde —ona mevkûf olarak;"], [1104.0, "böyle bir söz re'yle söylenemeyeceği için merfû hükmündedir—:"], [1108.4, "\"Tıyera şirktir, tıyera şirktir, tıyera şirktir.\" İbn Mes'ûd der ki:"], [1111.3, "\"Bizden her birimiz mutlaka…\" —yani bundan bir şeye düşmüştür— \"ancak Allah Teâlâ onu tevekkülle giderir.\" <span class=\"note\">(Ebû Dâvûd, Tirmizî)<\/span>"]]}, {"reader": false, "ar": [[1128.0, "وفي حديث معاوية بن الحكم السُّلَمي عند مسلم أنه قال:"], [1135.3, "يا رسول الله، وإنّ منّا رجالًا يتطيّرون ـ أي يتشاءمون ـ قال:"], [1141.6, "«ذاك شيءٌ يجدونه في صدورهم فلا يصدّنّهم» <span class=\"note\">(Müslim)<\/span>؛"], [1146.0, "أي أن آثار ما يتطيّرون به إنما هو خيالٌ ووهمٌ يعتقدونه في صدورهم ولا حقيقة له."]], "tr": [[1128.0, "Muâviye b. el-Hakem es-Sülemî'nin Müslim'deki hadisinde şöyle demiştir:"], [1133.1, "\"Ey Allah'ın Resûlü! Bizden tetayyur eden —yani uğursuzluğa inanan— adamlar var.\" Buyurdu ki:"], [1141.0, "\"Bu, göğüslerinde buldukları bir şeydir;"], [1144.1, "sakın onları (işlerinden) alıkoymasın.\" <span class=\"note\">(Müslim)<\/span> Yani onların uğursuz saydıkları şeylerin tesirleri, göğüslerinde inandıkları bir hayal ve vehimden ibarettir; hakikati yoktur."]]}, {"reader": false, "ar": [[1157.0, "وفي الحديث أن النبي صلى الله عليه وسلم سُئل عن الطيرة فقال:"], [1165.8, "«ولا تردّ مسلمًا، فإذا رأى أحدكم ما يكره فليقل: اللهم لا يأتي بالحسنات إلا أنت، ولا يدفع السيئات إلا أنت، ولا حول ولا قوة إلا بك» <span class=\"note\">(Ebû Dâvûd)<\/span>."], [1183.0, "وفي حديث السبعين ألفًا الذين يدخلون الجنة بلا حسابٍ ولا عذاب،"], [1191.0, "قال النبي صلى الله عليه وسلم:"], [1195.0, "«هم الذين لا يسترقون، ولا يكتوون، ولا يتطيّرون، وعلى ربهم يتوكّلون» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [1203.2, "أو كما قال صلى الله عليه وسلم."]], "tr": [[1157.0, "Hadiste Nebî ﷺ'e tıyera sorulduğunda şöyle buyurduğu geçer:"], [1162.5, "\"…Bir Müslümanı (işinden) geri çevirmez."], [1166.7, "Biriniz hoşlanmadığı bir şey görürse şöyle desin:"], [1172.7, "Allah'ım! İyilikleri ancak Sen getirirsin, kötülükleri ancak Sen def edersin;"], [1178.7, "güç ve kuvvet ancak Seninledir.\" <span class=\"note\">(Ebû Dâvûd)<\/span> Cennete hesapsız ve azapsız girecek yetmiş bin kişi hadisinde de Nebî ﷺ şöyle buyurmuştur:"], [1193.7, "\"Onlar rukye istemeyen, dağlanmayan, tetayyur etmeyen ve Rablerine tevekkül edenlerdir.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Ya da Nebî ﷺ'in buyurduğu gibi."]]}]}, {"ts": "20:06", "title": "3. Külliye (devam): Tıyera büyük şirk mi, küçük şirk mi?", "paras": [{"reader": false, "ar": [[1206.0, "فهذه الأدلة تدلّ على أن باب الطيرة على المنع،"], [1214.0, "بل إنه ليس على التحريم فقط،"], [1217.0, "بل وصفه الشارع بأنه شرك."], [1219.0, "فإن قلت: وهل الشرك ـ وهل التشاؤم ـ من الشرك الأكبر أو من الشرك الأصغر؟"], [1231.0, "فأقول: هذا ما تجيب عنه هذه الكلية،"], [1235.0, "وهي أن ما تطيّرتَ به إن جعلتَه في دائرة السببية فقط،"], [1240.0, "ولكنّ الله عز وجل هو الذي يخلق الخير والشر،"], [1245.0, "فإن هذا من باب الشرك الأصغر،"], [1250.0, "لأنك اعتقدتَ سببًا ما ليس بسببٍ لا شرعًا ولا قدرًا،"], [1258.0, "ولأنه وسيلةٌ للشرك الأكبر."]], "tr": [[1206.0, "Bu deliller, tıyera babının yasak üzere olduğunu gösterir;"], [1211.7, "hatta sadece haramlık üzere de değildir, Şâri' onu şirk olarak nitelemiştir."], [1218.6, "\"Şirk —yani uğursuzluk inancı— büyük şirkten midir yoksa küçük şirkten mi?\" dersen, derim ki:"], [1231.0, "Bu külliyenin cevap verdiği şey budur:"], [1234.4, "Uğursuz saydığın şeyi sadece sebeplilik dairesine koyar, ama hayrı ve şerri yaratanın Allah Teâlâ olduğuna inanırsan, bu küçük şirk babındandır."], [1244.4, "Çünkü ne şer'an ne de kader (tecrübe) bakımından sebep olmayan bir şeyin sebep olduğuna inanmışsındır ve bu, büyük şirke bir vasıtadır."]]}, {"reader": false, "ar": [[1262.0, "والمتقرّر في القواعد أن كلَّ وسيلةٍ للشرك الأكبر فشركٌ أصغر إن وصفه الشارع بأنه شرك،"], [1274.0, "ولا بد من هذا القيد الأخير."], [1279.0, "وأما إذا أخرجتَ ما تطيّرت به عن دائرة السببية إلى دائرة الفاعلية أو الخالقية ـ بمعنى أنه هو من يخلق الشر ابتداءً وليس سببًا فيه فقط،"], [1296.0, "هو من يفعل الشر بذاته ابتداءً وليس سببًا فيه فقط ـ فهنا تكون قد وقعت في شرك الربوبية الأكبر،"], [1308.0, "في شرك الربوبية الأكبر."]], "tr": [[1262.0, "Kaidelerde yerleşik olan şudur: Büyük şirke vasıta olan her şey, Şâri' onu şirk olarak nitelediyse küçük şirktir;"], [1275.5, "bu son kayıt mutlaka gereklidir."], [1279.7, "Uğursuz saydığın şeyi sebeplilik dairesinden çıkarıp fâillik veya yaratıcılık dairesine götürürsen —yani şerri baştan yaratanın o olduğuna, sadece ona sebep olmadığına;"], [1294.7, "şerri bizzat ve baştan yapanın o olduğuna, sadece ona sebep olmadığına inanırsan— işte o zaman rubûbiyyetteki büyük şirke düşmüş olursun; rubûbiyyetteki büyük şirke."]]}, {"reader": false, "ar": [[1313.0, "فكلُّ حديثٍ يدلّ على أن الطيرة شرك،"], [1320.0, "فيُحتمل أن تكون من الشرك الأصغر إذا كانت في دائرة السببية،"], [1325.0, "ويُحتمل أن تكون من الشرك الأكبر إذا كانت في دائرة الفاعلية الخالقية الذاتية. والله أعلم."]], "tr": [[1313.0, "Tıyeranın şirk olduğunu gösteren her hadis, sebeplilik dairesinde ise küçük şirk, fâillik, yaratıcılık ve zâtîlik dairesinde ise büyük şirk olma ihtimalini taşır. Allah en iyisini bilir."]]}]}, {"ts": "22:15", "title": "4. Külliye: Gerçek bir zarar kaynağından sakınmakta sakınca yoktur", "paras": [{"reader": false, "ar": [[1335.0, "<b>الكلية الرابعة: كلُّ تشاؤمٍ من مصدر ضررٍ حقيقيٍّ واقعيٍّ فلا بأس به.<\/b> كلُّ تشاؤمٍ من مصدر ضررٍ حقيقيٍّ واقعيٍّ فلا بأس به."], [1358.0, "أعيده مرةً أخرى: كلُّ تشاؤمٍ من مصدر ضررٍ حقيقيٍّ واقعيٍّ فلا بأس به."]], "tr": [[1335.0, "<b>4. külliye: Gerçek ve vâki bir zarar kaynağından dolayı duyulan her uğursuzluk hissinde (teşâüm) sakınca yoktur.<\/b> (İki kez daha tekrar ediyor.)"]]}, {"reader": false, "ar": [[1372.0, "أقول وبالله التوفيق: وهذه الكلية تدلّ على أن التشاؤم من الشيء يختلف باختلاف ترتّب آثاره عليه؛"], [1383.0, "فإن كانت آثار ما تشاءمتَ به خياليةً توهّميةً فهذا هو التشاؤم المنهيّ عنه والمحكوم عليه بأنه شرك."], [1399.0, "وأما إذا تشاءمتَ من الشيء وفررتَ منه وكانت آثاره حقيقيةً واقعيةً ملموسة،"], [1410.0, "فلا يُعتبر تشاؤمُك أو فرارُك منه من التشاؤم المحرّم شرعًا،"], [1416.0, "بل يُعتبر من باب اتقاء أسباب الضرر ومجانبة الوقوع فيها."]], "tr": [[1372.0, "Tevfik Allah'tandır, derim ki: Bu külliye, bir şeyi uğursuz saymanın, onun tesirlerinin ondan meydana gelişine göre değiştiğini gösterir."], [1383.0, "Uğursuz saydığın şeyin tesirleri hayalî ve vehmî ise, işte bu yasaklanan ve şirk olduğuna hükmedilen uğursuzluk inancıdır."], [1397.8, "Ama bir şeyi uğursuz sayıp ondan kaçar ve onun tesirleri gerçek, vâki ve somut olursa, uğursuz saymanın veya ondan kaçman şer'an haram olan uğursuzluk inancından sayılmaz;"], [1416.0, "bilakis zarar sebeplerinden sakınmak ve onlara düşmekten kaçınmak babından sayılır."]]}, {"reader": false, "ar": [[1422.0, "وعلى ذلك ما ورد في الأحاديث الصحيحة،"], [1427.0, "كما في الصحيحين من حديث ابن عمر رضي الله عنهما قال:"], [1431.6, "قال النبي صلى الله عليه وسلم:"], [1435.0, "«الشؤم في ثلاث: في المرأة والمسكن والفرس»،"], [1442.0, "وفي روايةٍ: «والدار والدابّة» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [1448.0, "وفي حديث سهل بن سعدٍ رضي الله عنه أن النبي صلى الله عليه وسلم قال:"], [1456.0, "«إن كان الشؤم في شيءٍ ففي المرأة والفرس والمسكن» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [1462.0, "وفي حديث جابرٍ رضي الله تعالى عنه أن النبي صلى الله عليه وسلم قال:"], [1469.0, "«إن كان في شيءٍ» ـ أي الشؤم ـ «ففي الرَّبْع والخادم والفرس» <span class=\"note\">(Müslim)<\/span>."]], "tr": [[1422.0, "Sahih hadislerde gelenler de buna hamledilir."], [1426.3, "Sahîhayn'de İbn Ömer'in (r.anhümâ) hadisinde Nebî ﷺ şöyle buyurmuştur:"], [1431.0, "\"Uğursuzluk üç şeydedir: kadında, meskende ve atta.\" Bir rivayette:"], [1437.2, "\"evde ve binek hayvanında.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Sehl b."], [1448.5, "Sa'd'ın (r.a.) hadisinde Nebî ﷺ şöyle buyurmuştur:"], [1452.6, "\"Eğer uğursuzluk bir şeyde olsaydı, kadında, atta ve meskende olurdu.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Câbir'in (r.a.) hadisinde de Nebî ﷺ şöyle buyurmuştur:"], [1466.9, "\"Eğer bir şeyde olsaydı\" —yani uğursuzluk— \"yurtta (arazide), hizmetçide ve atta olurdu.\" <span class=\"note\">(Müslim)<\/span>"]]}, {"reader": false, "ar": [[1480.0, "وهذه الأدلة تدلّ على أن هناك من التشاؤم ما هو جائزٌ ولا بأس به."], [1492.0, "فإن قلت: وكيف نجمع بين الأدلة التي تنهى عن التشاؤم والأدلة التي تقول بأنه لا بأس به؟"], [1503.0, "فنقول: وجه الجمع هو هذه الكلية؛"], [1506.0, "فإن كانت آثار ما تشاءمتَ به توهّميةً خيالية ـ توهّميةً خيالية ـ فهذا هو المنهيّ عنه،"], [1517.0, "وعليه نحمل أدلة المنع."], [1520.0, "وأما إذا كانت آثاره حقيقيةً واقعية فإنه لا بأس به،"], [1527.2, "كما تنصّ عليه هذه الكلية."]], "tr": [[1480.0, "Bu deliller, uğursuz saymanın caiz ve sakıncasız olan bir kısmının da bulunduğunu gösterir."], [1492.0, "\"Uğursuzluk inancını yasaklayan delillerle onda sakınca olmadığını söyleyen delilleri nasıl cem edeceğiz (uzlaştıracağız)?\" dersen, deriz ki:"], [1503.0, "Cem yolu bu külliyedir. Uğursuz saydığın şeyin tesirleri vehmî ve hayalî ise —vehmî ve hayalî— yasaklanan budur;"], [1516.5, "yasaklama delillerini buna hamlederiz. Tesirleri gerçek ve vâki ise, bu külliyenin açıkça ifade ettiği gibi bunda sakınca yoktur."]]}, {"reader": false, "ar": [[1530.0, "ويدلّ عليه حديث أنسٍ رضي الله تعالى عنه عند أبي داود وغيره:"], [1539.0, "أن رجلًا جاء إلى النبي صلى الله عليه وسلم فقال:"], [1543.5, "يا رسول الله، إنّا كنّا في دارٍ كثيرةٌ أموالُنا،"], [1548.7, "كثيرةٌ أعدادُنا، ثم تحوّلنا منها إلى دارٍ قلّت فيها أموالنا وقلّت فيها أعدادنا."], [1560.0, "فقال: «ذَرُوها ذميمةً» <span class=\"note\">(Ebû Dâvûd)<\/span>، أي مشؤومة."]], "tr": [[1530.0, "Buna Enes'in (r.a.) Ebû Dâvûd ve başkalarındaki hadisi de delâlet eder:"], [1538.0, "Bir adam Nebî ﷺ'e gelip dedi ki:"], [1541.2, "\"Ey Allah'ın Resûlü! Mallarımızın çok, sayımızın çok olduğu bir evdeydik."], [1546.0, "Sonra oradan, mallarımızın azaldığı ve sayımızın azaldığı bir eve taşındık.\" Buyurdu ki:"], [1556.7, "\"Onu kınanmış (zemîme) olarak bırakın.\" <span class=\"note\">(Ebû Dâvûd)<\/span> Yani uğursuz olarak."]]}, {"reader": false, "ar": [[1564.0, "فأمرهم النبي صلى الله عليه وسلم ـ لمّا تحقّق أن ما تشاءموا به حقيقيٌّ واقعي،"], [1574.0, "من قلّة أموالهم بعد سُكنى هذه الدار،"], [1578.0, "وفُشُوّ الموت فيهم بعد سُكنى هذه الدار؛"], [1583.0, "فآثار هذه الدار وأضرارها واقعيةٌ حقيقية ـ فأمرهم النبي صلى الله عليه وسلم أن يتركوها،"], [1593.0, "وقال: «ذَروها ذميمة، ذَروها ذميمة»."]], "tr": [[1564.0, "Nebî ﷺ onlara —uğursuz saydıkları şeyin gerçek ve vâki olduğu kesinleşince:"], [1570.9, "bu eve yerleştikten sonra mallarının azalması ve bu eve yerleştikten sonra aralarında ölümün yaygınlaşması;"], [1580.1, "yani bu evin tesirleri ve zararları vâki ve gerçekti— onu terk etmelerini emretti ve \"Onu kınanmış olarak bırakın, onu kınanmış olarak bırakın\" buyurdu."]]}, {"reader": false, "ar": [[1599.0, "وهكذا لو تزوّج الإنسان امرأةً ثم تغيّرت أحواله المالية أو النفسية أو الاجتماعية إلى الضرر،"], [1608.0, "فطلّقها اتقاءَ أضرارها، فلا يُعتبر طلاقه تشاؤمًا."], [1615.0, "وكذلك إذا اشترى دابّةً فكثرت خسائره عليها وكثرت أعطالُها <span class=\"q\">؟ 26:55<\/span>،"], [1626.0, "وصار يكرهها ويتشاءم منها بسبب تلك الأضرار الحقيقية الواقعية بعد شرائها،"], [1634.0, "فإذا باعها اتقاءَ أضرارها فلا يُعتبر بيعُها من التشاؤم المنهيّ عنه."]], "tr": [[1599.0, "Aynı şekilde insan bir kadınla evlenir, sonra maddi, psikolojik veya sosyal durumu zarar yönünde değişir de onun zararlarından sakınmak için onu boşarsa, bu boşaması uğursuzluk inancı sayılmaz."], [1612.5, "Aynı şekilde bir binek hayvanı satın alır da onun yüzünden kayıpları çoğalır ve arızaları <span class=\"q\">؟<\/span> artar, satın aldıktan sonraki bu gerçek ve vâki zararlar sebebiyle ondan hoşlanmaz ve onu uğursuz sayarsa, zararlarından sakınmak için onu satması yasaklanan uğursuzluk inancından sayılmaz."]]}, {"reader": false, "ar": [[1642.0, "وقول النبي صلى الله عليه وسلم:"], [1646.0, "«الشؤم في ثلاث»، ثم عدّ هذه الثلاث،"], [1650.0, "هذا تعديدُ تمثيلٍ لا تعديدُ حصر،"], [1656.0, "لأن التعليل في الثلاث واحد."], [1663.0, "والمتقرّر في القواعد أن العددية في الحديث إن اتفقت عللُها فعدديةُ تمثيل،"], [1672.0, "وإن اختلفت عللها فعدديةُ حصر،"], [1678.0, "وقد شرحتُها في موضعٍ آخر."]], "tr": [[1642.0, "Nebî ﷺ'in \"Uğursuzluk üç şeydedir\" deyip sonra bu üç şeyi sayması, sınırlama (hasr) için değil, örnekleme (temsil) için bir saymadır;"], [1656.0, "çünkü üçündeki illet (gerekçe) birdir."], [1659.2, "Kaidelerde yerleşik olan şudur: Hadisteki sayı bildiren ifadelerin illetleri aynıysa bu örnekleme sayısıdır, illetleri farklıysa sınırlama sayısıdır."], [1675.2, "Bunu başka bir yerde şerh ettim."]]}, {"reader": false, "ar": [[1682.0, "فجعل النبي صلى الله عليه وسلم الشؤم في المرأة لأن آثار أضرارها حقيقيةٌ واقعية،"], [1692.0, "وجعل الشؤم في الدار إذا كانت أضرارها حقيقيةً واقعية،"], [1697.0, "وجعل الشؤم في الفرس أو الدابّة إذا كانت أضرارها حقيقيةً واقعية؛"], [1703.0, "فيدخل فيها كلُّ شيءٍ رأيتَ منه،"], [1706.9, "أو من مقاربته، أو من شرائه وتملّكه،"], [1711.5, "ضررًا حقيقيًّا واقعيًّا لا توهّميًّا خياليًّا."]], "tr": [[1682.0, "Nebî ﷺ uğursuzluğu kadında zikretti, çünkü (bu durumda) zararlarının tesirleri gerçek ve vâkidir;"], [1690.8, "evde zikretti, zararları gerçek ve vâki olduğunda;"], [1694.8, "atta veya binek hayvanında zikretti, zararları gerçek ve vâki olduğunda."], [1699.7, "Kendisinden, ona yakın olmaktan ya da onu satın alıp mâlik olmaktan vehmî ve hayalî değil, gerçek ve vâki bir zarar gördüğün her şey buna girer."]]}, {"reader": false, "ar": [[1720.0, "ولا أظن عاقلًا يخلط بين ما كان وهمًا وبين ما كان حقيقةً واقعية،"], [1731.0, "كما إذا فرّ الإنسان من طريقٍ عليها لصوصٌ يترصّدون للمارّة،"], [1743.0, "ففراره من تلك الطريق وعدمُ سلوكها لا يُعتبر تشاؤمًا منهيًّا عنه."], [1749.0, "وكما إذا كره نوعًا من أنواع الطعام يستضرّ به إذا أكله،"], [1758.0, "فلا يُعتبر ابتعادُه واجتنابُه من باب التشاؤم المحرّم."]], "tr": [[1720.0, "Hiçbir akıllının vehim olanla gerçek ve vâki olanı karıştıracağını sanmıyorum."], [1725.5, "Mesela insan, üzerinde yoldan geçenleri gözetleyen hırsızların bulunduğu bir yoldan kaçarsa, o yoldan kaçması ve oradan geçmemesi yasaklanan uğursuzluk inancı sayılmaz."], [1747.9, "Yine yediğinde kendisine zarar veren bir yiyecek türünden hoşlanmazsa, ondan uzak durması ve kaçınması haram olan uğursuzluk inancı babından sayılmaz."]]}, {"reader": false, "ar": [[1765.0, "والفرقان بين هذا وهذا هو قضية الأثر؛"], [1771.0, "فإن كان تشاؤمًا توهّميًّا خياليًّا فهذا هو المنهيّ عنه،"], [1780.0, "وإن كان تشاؤمًا أو فرارًا من شيءٍ مرئيٍّ أو مسموعٍ أو مأكولٍ أو مشروبٍ أو ملبوسٍ أو غير ذلك،"], [1793.0, "إلا أن آثار ضرره حقيقيةٌ واقعية،"], [1797.0, "فلا يُعتبر ذلك من الفرار المحرّم،"], [1801.0, "بل يُعتبر من باب اتقاء الأضرار."]], "tr": [[1765.0, "Bununla şunun arasındaki fark, tesir meselesidir."], [1769.5, "Vehmî ve hayalî bir uğursuzluk inancı ise yasaklanan budur."], [1780.0, "Görülen, işitilen, yenen, içilen, giyilen veya başka bir şeyi uğursuz saymak ya da ondan kaçmak olup da zararının tesirleri gerçek ve vâki ise, bu haram olan kaçmadan sayılmaz;"], [1801.0, "bilakis zararlardan sakınmak babından sayılır."]]}, {"reader": false, "ar": [[1805.0, "وذلك لأن الله عز وجل يخلق الشيء ويخلق صفته؛"], [1809.1, "فبعض المخلوقات خلقها الله وجعل من صفاتها السَّعدَ في ذاتها ولمن قاربها،"], [1817.0, "بينما بعض المخلوقات يخلقها الله ويجعل فيها نحسًا ومحقَ بركةٍ في ذاتها ولمن حولها."], [1830.0, "فإذا رأيتَ شيئًا من ذلك وتيقّنتَه حقيقةً واقعيةً وابتعدتَ عنه،"], [1836.0, "فهذا من باب اتقاء أسباب الضرر المأمور به شرعًا،"], [1841.0, "وليس من باب التشاؤم المنهيّ عنه شرعًا. والله أعلم."]], "tr": [[1805.0, "Bunun sebebi şudur: Allah Teâlâ bir şeyi yaratır ve onun sıfatını da yaratır."], [1809.7, "Bazı mahlûkatı Allah yaratmış ve sıfatlarından birini hem kendi zâtında hem de ona yaklaşan için uğur (bereket) kılmıştır."], [1819.0, "Bazı mahlûkatı ise Allah yaratır ve onlarda hem kendi zâtında hem de etrafındakiler için bir nahset (uğursuzluk) ve bereketsizlik kılar."], [1832.4, "Bunlardan birini görür, onun gerçek ve vâki olduğundan emin olur ve ondan uzaklaşırsan, bu şer'an emredilen zarar sebeplerinden sakınma babındandır;"], [1841.6, "şer'an yasaklanan uğursuzluk inancı babından değildir. Allah en iyisini bilir."]]}]}, {"ts": "30:46", "title": "5. Külliye: Fe'l (hayra yorulan söz)", "paras": [{"reader": false, "ar": [[1846.0, "ومن الكليات أيضًا: <b>كلُّ كلمةٍ تُعين على حسن الظن بالله ففألٌ حسن.<\/b> ـ يا سلام!"], [1868.5, "ـ <b>كلُّ كلمةٍ تُعين على كمال التوكّل وحسن الظن بالله عز وجل ففألٌ حسن.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1846.0, "Külliyelerden biri de şudur: 5."], [1848.7, "külliye: Allah'a hüsn-i zanna yardım eden her söz güzel bir fe'ldir. —Ne güzel!— Tevekkülün kemaline ve Allah Teâlâ'ya hüsn-i zanna yardım eden her söz güzel bir fe'ldir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1880.0, "وهذه الكلية تتكلّم عن الفأل وحقيقته."], [1887.0, "ومن المعلوم أن النبي صلى الله عليه وسلم لما سُئل عن الطيرة قال:"], [1894.6, "«أحسنُها الفأل»، فقيل: وما الفأل؟"], [1898.3, "قال: «الكلمة الطيبة». ولا تكون الكلمة الطيبة إلا إذا كانت معينةً لك على تحصيل المصالح الخالصة والراجحة،"], [1909.0, "ومعينةً لك على حسن الظن بالله عز وجل،"], [1912.0, "ومعينةً لك في مقاصدك على تكميل مراتب التوكّل على الله عز وجل؛"], [1920.0, "فهي كلمةٌ لا يترتّب عليها إلا كلُّ خير،"], [1923.0, "فهذا هو الفأل الذي يحبّه النبي صلى الله عليه وسلم."]], "tr": [[1880.0, "Bu külliye fe'l ve onun hakikatinden bahseder."], [1888.0, "Bilindiği üzere Nebî ﷺ'e tıyera sorulduğunda \"En güzeli fe'ldir\" buyurdu."], [1894.6, "\"Fe'l nedir?\" denildi. \"Güzel sözdür\" buyurdu."], [1899.8, "Güzel söz ancak sana hâlis ve râcih (ağır basan) maslahatları elde etmede yardımcı, Allah Teâlâ'ya hüsn-i zanda yardımcı ve maksatlarında Allah Teâlâ'ya tevekkülün derecelerini tamamlamada yardımcı olursa güzel söz olur."], [1920.0, "O, kendisinden ancak her türlü hayrın doğduğu bir sözdür."], [1924.8, "İşte Nebî ﷺ'in sevdiği fe'l budur."]]}, {"reader": false, "ar": [[1929.0, "ففي الحديث عن أنسٍ رضي الله عنه قال:"], [1933.0, "قال النبي صلى الله عليه وسلم:"], [1936.0, "«لا عدوى ولا طيرة، ويعجبني الفأل»،"], [1939.0, "قالوا: يا رسول الله،"], [1941.5, "وما الفأل؟ قال: «الكلمة الطيبة»،"], [1944.7, "متفقٌ عليه. وفي حديث عروة بن عامرٍ رضي الله تعالى عنه قال:"], [1951.0, "ذُكرت الطيرة عند النبي صلى الله عليه وسلم فقال:"], [1955.7, "«أحسنُها الفأل، ولا تردّ مسلمًا» <span class=\"note\">(Ebû Dâvûd)<\/span>."]], "tr": [[1929.0, "Enes'ten (r.a.) gelen hadiste Nebî ﷺ şöyle buyurmuştur:"], [1933.0, "\"Hastalık bulaşması (kendiliğinden) yoktur, tıyera yoktur;"], [1936.0, "fe'l hoşuma gider.\" \"Ey Allah'ın Resûlü, fe'l nedir?\" dediler."], [1941.5, "\"Güzel sözdür\" buyurdu. Müttefekun aleyh."], [1944.7, "Urve b. Âmir'in (r.a.) hadisinde şöyle der:"], [1949.0, "Nebî ﷺ'in yanında tıyera anıldı."], [1951.5, "Buyurdu ki: \"En güzeli fe'ldir;"], [1954.0, "bir Müslümanı (işinden) geri çevirmez.\" <span class=\"note\">(Ebû Dâvûd)<\/span>"]]}, {"reader": false, "ar": [[1959.0, "فإن قلت: وما الفرقان بين الطيرة والفأل؟"], [1966.0, "وكأني أقول: ما الفرقان بين كلمة السوء والكلمة الطيبة؟"], [1976.0, "فأقول: اعلم ـ رحمك الله تعالى ـ أن الطيرة والفأل تتفقان في شيءٍ وتختلفان في أشياء؛"], [1988.0, "فيتفق الفأل مع الطيرة في أن كلًّا منهما يبعث النفس على شيء:"], [1997.0, "فالطيرة تدفع النفس للشيء إقدامًا أو إحجامًا،"], [2006.0, "والفأل كذلك يدفع العزيمة والهمّة على شيءٍ إقدامًا أو إحجامًا."]], "tr": [[1959.0, "\"Tıyera ile fe'l arasındaki fark nedir?\" dersen —sanki \"Kötü söz ile güzel söz arasındaki fark nedir?\" diyorum— derim ki:"], [1976.0, "Bil —Allah sana rahmet etsin— tıyera ile fe'l bir şeyde birleşir, birçok şeyde ayrılır."], [1985.7, "Fe'l ile tıyera, her birinin nefsi bir şeye sevk etmesinde birleşir:"], [1993.5, "Tıyera nefsi bir şeye girişmeye veya ondan geri durmaya iter;"], [2000.7, "fe'l de azmi ve himmeti bir şeye girişmeye veya ondan geri durmaya iter."]]}, {"reader": false, "ar": [[2016.0, "إلا أنهما يختلفان في عدّة أمور:"], [2021.0, "الأمر الأول: أن الطيرة منهيٌّ عنها شرعًا،"], [2025.8, "والفأل مأمورٌ به شرعًا،"], [2029.0, "وفرقانٌ بين ما أُمرتَ به وما نُهيتَ عنه."], [2033.0, "فإن المتقرّر في القواعد أن كلَّ منهيّات الشرع يقف وراء النهي عنها مفسدةٌ خالصةٌ أو راجحة،"], [2046.0, "فالطيرة منهيٌّ عنها لأنها تتضمّن مفسدةً إما خالصةً أو راجحة؛"], [2056.0, "وأن باب المأمورات يقف وراء الأمر به مصلحةٌ خالصةٌ أو راجحة،"], [2066.0, "فبما أن الفأل مرغَّبٌ فيه شرعًا،"], [2070.0, "فسببُ الترغيب فيه أنه لا يقف وراءه إلا المصالح الخالصة أو الراجحة."], [2077.0, "وفرقانٌ عظيمٌ بين مفسدة هذا ومصلحة ذاك."]], "tr": [[2016.0, "Ancak birkaç hususta ayrılırlar. Birincisi:"], [2019.8, "Tıyera şer'an yasaklanmıştır, fe'l ise şer'an emredilmiştir;"], [2025.1, "emrolunduğun şeyle yasaklandığın şey arasında fark vardır."], [2030.5, "Kaidelerde yerleşik olan şudur: Şeriatın yasakladığı her şeyin yasaklanmasının arkasında hâlis veya râcih bir mefsedet (kötülük) vardır."], [2041.6, "Tıyera, hâlis ya da râcih bir mefsedet içerdiği için yasaklanmıştır."], [2051.6, "Emredilenler babında da emrin arkasında hâlis veya râcih bir maslahat vardır."], [2062.9, "Fe'l şer'an teşvik edildiğine göre, teşvik edilmesinin sebebi, arkasında ancak hâlis veya râcih maslahatların bulunmasıdır."], [2075.2, "Bunun mefsedeti ile onun maslahatı arasında büyük fark vardır."]]}, {"reader": false, "ar": [[2083.0, "ومن الفروق أيضًا: أن الطيرة تحمل على سوء الظن بالله،"], [2093.0, "لأنك تتشاءم أن الله يقدّر لك الشر في هذا الطريق،"], [2101.0, "أو تتشاءم بهذا الطير أنه سببٌ سيأتيك منه قدرُ شرٍّ من الله؛"], [2106.0, "فالطيرة مقرونةٌ دائمًا بسوء الظن بالله عز وجل."], [2111.0, "ومن المعلوم أن سوء الظن بالله محرّمٌ في كل الشرائع،"], [2118.0, "كما قال الله عز وجل:"], [2119.3, "<span class=\"ayah\">﴿الظَّانِّينَ بِاللَّهِ ظَنَّ السَّوْءِ ۚ عَلَيْهِمْ دَائِرَةُ السَّوْءِ﴾<\/span> <span class=\"ref\">[الفتح: ٦]<\/span>،"], [2127.0, "ويقول الله عز وجل:"], [2129.0, "<span class=\"ayah\">﴿وَتَظُنُّونَ بِاللَّهِ الظُّنُونَا﴾<\/span> <span class=\"ref\">[الأحزاب: ١٠]<\/span>، ويقول الله تبارك وتعالى:"], [2136.0, "<span class=\"ayah\">﴿يَظُنُّونَ بِاللَّهِ غَيْرَ الْحَقِّ ظَنَّ الْجَاهِلِيَّةِ﴾<\/span> <span class=\"ref\">[آل عمران: ١٥٤]<\/span>،"], [2143.0, "وكلُّ أمرٍ منسوبٍ إلى الجاهلية فمحرّم."]], "tr": [[2083.0, "Farklardan biri de şudur: Tıyera, Allah'a sû-i zanna (kötü zanna) sevk eder."], [2089.3, "Çünkü Allah'ın sana bu yolda şer takdir ettiğini düşünerek uğursuzluğa kapılırsın ya da bu kuşun, kendisinden sana Allah'tan bir şer kaderinin geleceği bir sebep olduğunu düşünerek onu uğursuz sayarsın."], [2106.0, "Tıyera her zaman Allah Teâlâ'ya sû-i zanla birliktedir."], [2109.8, "Bilindiği üzere Allah'a sû-i zan bütün şeriatlarda haramdır."], [2113.8, "Allah Teâlâ şöyle buyurur: <span class=\"ayah\">﴿Allah hakkında kötü zanda bulunanlar; kötülük çemberi onların başına olsun﴾<\/span> [Fetih 6]."], [2120.5, "Allah Teâlâ şöyle buyurur: <span class=\"ayah\">﴿Allah hakkında türlü zanlarda bulunuyordunuz﴾<\/span> [Ahzâb 10]."], [2129.0, "Allah Tebâreke ve Teâlâ şöyle buyurur:"], [2132.8, "<span class=\"ayah\">﴿Allah hakkında hakka aykırı olarak cahiliye zannıyla zanda bulunuyorlardı﴾<\/span> [Âl-i İmrân 154]."], [2143.8, "Cahiliyeye nispet edilen her iş haramdır."]]}, {"reader": false, "ar": [[2148.0, "وأما الفأل فإنه يحمل النفوس على حسن الظن بالله عز وجل؛"], [2154.0, "فإن تلك الكلمة تبعث النفس على السرور،"], [2158.9, "والصدرَ على الانشراح، والقلبَ على كمال التوكّل وحسن الظن بالله،"], [2165.5, "أنه لن يصيبه من الله في هذا الطريق،"], [2169.2, "أو في هذا السفر،"], [2170.8, "أو في تلك التجارة،"], [2172.4, "أو في هذا الزواج إلا كلُّ خير،"], [2175.4, "بسبب تلك الكلمة التي بعثت السرور في نفسه وجعلته يُحسن الظن بربه."], [2182.0, "فمبدأ الطيرة سوءُ الظن،"], [2184.0, "ومبدأ الفأل حسنُ الظن، وفرقانٌ بينهما عظيم."]], "tr": [[2148.0, "Fe'l ise nefisleri Allah Teâlâ'ya hüsn-i zanna sevk eder."], [2152.9, "Çünkü o söz nefsi sevince, göğsü ferahlığa, kalbi de tevekkülün kemaline ve Allah'a hüsn-i zanna sevk eder:"], [2165.0, "Bu yolda, bu yolculukta, o ticarette veya bu evlilikte Allah'tan kendisine, nefsinde sevinç uyandıran ve onu Rabbine hüsn-i zanda bulunur hâle getiren o söz sebebiyle, ancak her türlü hayrın isabet edeceğine (inanır)."], [2181.2, "Tıyeranın başlangıcı sû-i zan, fe'lin başlangıcı hüsn-i zandır; aralarındaki fark büyüktür."]]}, {"reader": false, "ar": [[2188.0, "ومن الأوجه أيضًا: أن الطيرة تقتل التوكّل،"], [2197.0, "وأن الفأل يبعثه ويُحييه في القلب؛"], [2202.0, "فإنك إذا عزمتَ على شيءٍ وتشاءمتَ تشاؤمًا منهيًّا عنه،"], [2208.0, "فذلك يجعل قلبك متردّدًا ضعيفَ التوكّل والثقة بالله عز وجل،"], [2214.0, "فأيُّ قلبٍ هجمت عليه الطيرة أتلفت توكّلَه."], [2219.0, "وأما الفأل فإنه يبعث النفوس على حسن الظن بالله الموجِب للتوكّل،"], [2230.0, "كما قال النبي صلى الله عليه وسلم:"], [2233.0, "«لا يموتنّ أحدكم إلا وهو يُحسن الظن بالله عز وجل» <span class=\"note\">(Müslim)<\/span>،"], [2238.0, "ويقول الله عز وجل في الحديث القدسي:"], [2242.7, "«أنا عند ظنّ عبدي بي» <span class=\"note\">(Buhârî, Müslim)<\/span>، الحديثَ بتمامه."]], "tr": [[2188.0, "Gerekçelerden biri de şudur: Tıyera tevekkülü öldürür, fe'l ise onu kalpte uyandırır ve diriltir."], [2202.0, "Bir şeye azmettiğinde yasaklanmış bir şekilde uğursuzluğa kapılırsan, bu, kalbini tereddütlü, tevekkülü ve Allah Teâlâ'ya güveni zayıf hâle getirir."], [2214.0, "Tıyeranın hücum ettiği her kalbin tevekkülünü mahveder."], [2219.0, "Fe'l ise nefisleri, tevekkülü gerektiren Allah'a hüsn-i zanna sevk eder."], [2225.9, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [2231.7, "\"Sizden biri ancak Allah Teâlâ'ya hüsn-i zan beslerken ölsün.\" <span class=\"note\">(Müslim)<\/span> Allah Teâlâ da kudsî hadiste şöyle buyurur:"], [2240.7, "\"Ben kulumun Beni zannı üzereyim.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Hadisin tamamı (böyledir)."]]}, {"reader": false, "ar": [[2248.0, "فمبدأ الطيرة ذهابُ التوكّل،"], [2250.8, "ومبدأ الفأل إحياءُ التوكّل وبعثُه في القلب،"], [2257.0, "وفرقانٌ بينهما. ومن الفروق أيضًا:"], [2260.4, "أن الطيرة مما يُدخل الهمَّ والغمَّ والحزن على القلب،"], [2270.0, "لأنها تمنع الإنسان من إيش؟"], [2273.2, "من تحقيق مقاصده التي بها قوامُ حياته أو دينه؛"], [2279.0, "فكلما همّ بشيءٍ تطيّر وتشاءم فترك ذلك الشيء،"], [2284.2, "فيبقى متردّدًا مهمومًا مغمومًا حزينًا في فوات كثيرٍ من ماذا؟"], [2292.0, "من مصالحه الدينية والدنيوية."]], "tr": [[2248.0, "Tıyeranın başlangıcı tevekkülün gitmesi, fe'lin başlangıcı ise tevekkülün diriltilmesi ve kalpte uyandırılmasıdır;"], [2257.0, "aralarında fark vardır. Farklardan biri de şudur:"], [2261.7, "Tıyera kalbe keder, tasa ve hüzün sokan şeylerdendir."], [2270.6, "Çünkü insanı neden alıkoyar? Hayatının veya dininin ayakta durduğu maksatlarını gerçekleştirmekten."], [2277.1, "Bir şeye niyetlendikçe uğursuzluğa kapılır ve o şeyi bırakır;"], [2282.9, "böylece neyin kaybından dolayı tereddütlü, kederli, tasalı ve hüzünlü kalır?"], [2289.5, "Dinî ve dünyevî maslahatlarının çoğunun kaybından."]]}, {"reader": false, "ar": [[2294.0, "وأيُّ أمرٍ يبعث الهمَّ والحزن في قلب المؤمن فإنه محرّمٌ شرعًا،"], [2301.0, "كما حرّم الله النجوى لأنها تُحزن الذين آمنوا،"], [2311.0, "كما قال الله عز وجل:"], [2313.9, "<span class=\"ayah\">﴿إِنَّمَا النَّجْوَىٰ مِنَ الشَّيْطَانِ لِيَحْزُنَ الَّذِينَ آمَنُوا﴾<\/span> <span class=\"ref\">[المجادلة: ١٠]<\/span>."], [2318.0, "ومن كرامات الله عز وجل لأهل الجنة أنه يُذهب الحزن عن قلوبهم،"], [2324.0, "كما قال الله عز وجل عنهم أنهم قالوا:"], [2327.4, "<span class=\"ayah\">﴿الْحَمْدُ لِلَّهِ الَّذِي أَذْهَبَ عَنَّا الْحَزَنَ﴾<\/span> <span class=\"ref\">[فاطر: ٣٤]<\/span>."]], "tr": [[2294.0, "Mü'minin kalbinde keder ve hüzün uyandıran her iş şer'an haramdır."], [2300.4, "Nitekim Allah, iman edenleri hüzünlendirdiği için fısıldaşmayı haram kılmıştır."], [2311.0, "Allah Teâlâ şöyle buyurur: <span class=\"ayah\">﴿Fısıldaşma, iman edenleri hüzünlendirmek için ancak şeytandandır﴾<\/span> [Mücâdele 10]."], [2318.5, "Allah Teâlâ'nın cennet ehline ikramlarından biri de kalplerinden hüznü gidermesidir."], [2323.5, "Nitekim Allah Teâlâ onların şöyle dediklerini bildirir:"], [2326.6, "<span class=\"ayah\">﴿Bizden hüznü gideren Allah'a hamd olsun﴾<\/span> [Fâtır 34]."]]}, {"reader": false, "ar": [[2330.0, "ولا تجد الحزن مأمورًا به شرعًا أبدًا،"], [2334.0, "بل منهيٌّ عنه: <span class=\"ayah\">﴿وَلَا تَحْزَنْ عَلَيْهِمْ﴾<\/span> إلى غيره،"], [2339.0, "<span class=\"ayah\">﴿فَلَعَلَّكَ بَاخِعٌ نَّفْسَكَ عَلَىٰ آثَارِهِمْ إِن لَّمْ يُؤْمِنُوا بِهَٰذَا الْحَدِيثِ أَسَفًا﴾<\/span> <span class=\"ref\">[الكهف: ٦]<\/span>."], [2344.0, "وأما الفأل فإنه يبعث في القلب الهمّةَ والنشاط والسعادة والسرور والإقدامَ على تحصيل مصالح الدارين."], [2357.0, "فمبدأ الطيرة بعثُ الهمّ والحزن،"], [2362.0, "ومبدأ الفأل بعثُ السرور والسعادة والنشاط، وفرقانٌ بينهما."]], "tr": [[2330.0, "Hüznün şer'an emredildiğini asla bulamazsın;"], [2332.3, "bilakis ondan nehyedilmiştir: <span class=\"ayah\">﴿Onlar için hüzünlenme﴾<\/span> ve diğer (ayetler);"], [2337.7, "<span class=\"ayah\">﴿Bu söze inanmazlarsa, onların ardından üzüntüyle neredeyse kendini helak edeceksin﴾<\/span> [Kehf 6]."], [2343.7, "Fe'l ise kalpte himmet, zindelik, mutluluk, sevinç ve iki dünyanın maslahatlarını elde etmeye giriş uyandırır."], [2355.5, "Tıyeranın başlangıcı keder ve hüzün uyandırmak, fe'lin başlangıcı ise sevinç, mutluluk ve zindelik uyandırmaktır; aralarında fark vardır."]]}, {"reader": false, "ar": [[2368.0, "ومن الفروق أيضًا ما ذكره الإمام القرافي المالكي رحمه الله تعالى في كتابه العظيم «الفروق»،"], [2387.0, "قال: «الطيرة ما يُظنّ عندها الشر، والفأل أمرٌ يُظنّ عنده الخير»."], [2405.0, "الطيرة أمرٌ يُظنّ عنده الشر،"], [2411.0, "وأما الفأل فإنه أمرٌ يُظنّ عنده الخير. وفرقانٌ بينهما."]], "tr": [[2368.0, "Farklardan biri de İmam Karâfî el-Mâlikî'nin (rahimehullah) büyük kitabı \"el-Furûk\"ta zikrettiği şeydir."], [2375.3, "Şöyle der: \"Tıyera, yanında şer zannedilen şeydir;"], [2388.4, "fe'l ise yanında hayır zannedilen şeydir.\" Tıyera yanında şer zannedilen bir şeydir, fe'l ise yanında hayır zannedilen bir şeydir. Aralarında fark vardır."]]}]}, {"ts": "40:17", "title": "5. Külliye (devam): Fe'le örnekler", "paras": [{"reader": false, "ar": [[2417.0, "فإن قلت: مثّل لنا على الفأل."], [2421.0, "فأقول: كأن تريد سفرًا أو تجارةً،"], [2425.0, "فتسمع من يقول ـ بلا قصدٍ منك،"], [2428.0, "لأنك إن كنت عند السفر تتقصّد السماع فهذا ليس بفأل،"], [2435.0, "وإنما الفأل ما تسمعه فجأةً أو تراه فجأةً من غير قصد ـ فتسمع من يقول لك:"], [2446.1, "يا أفلح، أو يتلو آيةً فيها الفلاح والظفر،"], [2455.0, "أو يقابلك في سفرك رجلٌ اسمه يبعث على الخير أو صحبتُه تبعث على الخير،"], [2466.0, "فتسمع من يقول لك:"], [2468.7, "يا نجيح، أو يا مفلح، أو: أفلح وجهُك."]], "tr": [[2417.0, "\"Bize fe'le bir örnek ver\" dersen, derim ki:"], [2421.0, "Mesela bir yolculuğa veya ticarete niyet edersin de (birinin) söylediğini işitirsin —senin kastın olmadan;"], [2428.0, "çünkü yolculuk sırasında (bir şey) işitmeyi kastedersen bu fe'l değildir;"], [2434.3, "fe'l ancak kastın olmadan aniden işittiğin veya aniden gördüğün şeydir—:"], [2439.8, "Birinin sana \"Ey Eflah (kurtuluşa eren)!\" dediğini işitirsin;"], [2445.3, "ya da biri içinde kurtuluş ve zafer geçen bir ayet okur;"], [2455.7, "ya da yolculuğunda ismi hayra çağıran veya arkadaşlığı hayra çağıran bir adamla karşılaşırsın;"], [2465.2, "birinin sana \"Ey Necîh (başarılı)!\", \"Ey Müflih!\" ya da \"Yüzün ak olsun (eflaha vechuk)!\" dediğini işitirsin."]]}, {"reader": false, "ar": [[2475.0, "بل ومن الفأل الحسن الرؤيا الصالحة التي يراها المؤمن،"], [2480.0, "وهي كلماتٌ منامية يسمعها،"], [2483.0, "فهي كلمةٌ طيبة؛ والكلمات الطيبة قد يسمعها الإنسان في يقظته أو قد يسمعها في منامه."], [2491.0, "بل من الفأل الحسن تيسيرُ الأمر المطلوب والمقصود؛"], [2497.0, "فأنت تقصد أمرًا فتجد أسبابه أمامك متيسّرةً ومرتّبة،"], [2505.0, "وكأنّ داعيًا قدريًّا يقول لك:"], [2509.1, "هلمّ وأقبِل. والأمثلة على ذلك كثيرة."]], "tr": [[2475.0, "Hatta mü'minin gördüğü salih rüya da güzel fe'ldendir;"], [2478.9, "o, rüyada işittiği sözlerdir ve güzel bir sözdür."], [2483.7, "Güzel sözleri insan bazen uyanıkken, bazen de rüyasında işitir."], [2488.6, "Hatta istenen ve kastedilen işin kolaylaşması da güzel fe'ldendir:"], [2493.9, "Bir işe niyet edersin de sebeplerini önünde kolaylaşmış ve düzenlenmiş bulursun;"], [2503.1, "sanki kaderden bir davetçi sana \"Haydi, gel!\" diyor. Buna dair örnekler çoktur."]]}, {"reader": false, "ar": [[2514.0, "ولذلك لما جاء سهيل بن عمرٍو يعقد مع النبي صلى الله عليه وسلم بنود الصلح،"], [2531.0, "قال النبي صلى الله عليه وسلم متفائلًا باسمه:"], [2536.6, "«سَهُلَ أمرُكم» <span class=\"note\">(Buhârî'deki lafız: «لقد سهل لكم من أمركم»)<\/span>. أو يخرج من بيته مهمومًا من شيءٍ فيوافق نزول المطر،"], [2545.7, "أو يوافق صديقًا يسلّيه،"], [2549.2, "أو يُدعى إلى اجتماعٍ يحبّه،"], [2559.0, "فيقول: بما أنه حصل ذلك فلعلّ هذا مما سيكشف عنّي ما أهمّني أو أغمّني، أو نحو ذلك."]], "tr": [[2514.0, "Bu yüzden Süheyl b. Amr, Nebî ﷺ ile barış maddelerini akdetmeye geldiğinde, Nebî ﷺ onun isminden hayır umarak \"İşiniz kolaylaştı\" buyurdu."], [2533.8, "Ya da (kişi) bir şeyden dolayı kederli olarak evinden çıkar da yağmurun yağmasına denk gelir, ya da kendisini teselli eden bir arkadaşına rastlar veya sevdiği bir toplantıya davet edilir ve \"Bu olduğuna göre, belki bu, beni kederlendiren veya tasalandıran şeyi benden giderecek şeylerdendir\" der ve benzeri."]]}]}, {"ts": "42:49", "title": "6. Külliye: Tıyeraya götüren vasıtaları kapatmak meşrudur", "paras": [{"reader": false, "ar": [[2569.0, "ومن الكليات أيضًا: <b>كلُّ ذريعةٍ تُفضي إلى وقوع الطيرة في القلب فالمشروع سدُّها.<\/b> وأُعيدها مرةً ثالثة:"], [2581.0, "كلُّ ذريعةٍ تُفضي إلى وقوع الطيرة ـ أي التشاؤم المنهيّ عنه ـ في القلب فالمشروع سدُّها."]], "tr": [[2569.0, "Külliyelerden biri de şudur: 6."], [2571.7, "külliye: Kalpte tıyeranın meydana gelmesine götüren her vasıtayı (zerîa) kapatmak meşrudur. Üçüncü kez tekrar ediyorum:"], [2582.3, "Kalpte tıyeranın —yani yasaklanan uğursuzluk inancının— meydana gelmesine götüren her vasıtayı kapatmak meşrudur."]]}, {"reader": false, "ar": [[2604.0, "فلا ينبغي للإنسان أن يُثير على نفسه وقلبه الأمور التي تجعله يُسيء الظن بربه تشاؤمًا وتطيّرًا،"], [2614.0, "فينبغي لك أن تكون ذا همّةٍ وتوكّلٍ كامل،"], [2620.0, "وأن تتعرّف على مسائل الطيرة،"], [2623.2, "وأن تقرأ فيها الأدلة،"], [2625.7, "حتى تحمي قلبك بالعلم من الوقوع في شيءٍ من مزالقها."], [2632.0, "وقد كان النبي صلى الله عليه وسلم حريصًا على سدّ كلّ بابٍ يُفضي إلى الطيرة."]], "tr": [[2604.0, "İnsanın, kendisini uğursuzluk ve tetayyur yoluyla Rabbi hakkında kötü zanda bulunmaya sevk eden şeyleri nefsine ve kalbine karşı kışkırtması uygun değildir."], [2617.6, "Senin himmet sahibi ve tam tevekkül sahibi olman, tıyera meselelerini öğrenmen ve bu konudaki delilleri okuman gerekir ki kalbini ilimle onun kaygan zeminlerinden birine düşmekten koruyasın."], [2633.6, "Nebî ﷺ de tıyeraya götüren her kapıyı kapatmaya çok düşkündü."]]}, {"reader": false, "ar": [[2638.0, "ففي الحديث عن سمرة بن جندبٍ رضي الله عنه قال:"], [2644.5, "«نهانا رسول الله صلى الله عليه وسلم أن نسمّي رقيقنا بأربعة أسماء: أفلح، ورباح، ويسار، ونافع»،"], [2653.0, "أخرجه الإمام مسلم، والعلّة في هذا النهي ستأتي بعد قليلٍ إن شاء الله."], [2664.0, "وفي رواية الترمذي عن سمرة رضي الله عنه أن النبي صلى الله عليه وسلم قال:"], [2673.6, "«لا تسمِّ غلامك رباحًا، ولا أفلح، ولا يسارًا، ولا نجيحًا، فيقال: أثَمَّ هو؟ فيقال: لا»."]], "tr": [[2638.0, "Semure b. Cündeb'den (r.a.) gelen hadiste şöyle der:"], [2644.0, "\"Resûlullah ﷺ kölelerimize dört isim koymamızı yasakladı:"], [2648.2, "Eflah, Rabâh, Yesâr ve Nâfi'.\" Bunu İmam Müslim rivayet etmiştir."], [2659.5, "Bu yasağın illeti inşallah birazdan gelecek."], [2663.0, "Tirmizî'nin Semure'den (r.a.) rivayetinde de Nebî ﷺ şöyle buyurmuştur:"], [2669.8, "\"Oğluna (köle gence) Rabâh, Eflah, Yesâr ve Necîh adını koyma;"], [2677.4, "zira 'O burada mı?' denir, 'Hayır' denir.\""]]}, {"reader": false, "ar": [[2688.0, "بمعنى أنه إذا كان في البيت من يسمّى نافع،"], [2695.0, "فيقول: أفيكم نافع؟ فيقولون:"], [2698.2, "لا، فيقع الإنسان فيما يضيّق صدره بسبب الطيرة."], [2705.0, "أفيكم نجيح؟ فيقولون: لا."], [2709.0, "أفيكم يسار أو أفلح؟"], [2712.1, "فيقولون: لا. فلعلّ هذا النفي يوقع السامع في التشاؤم،"], [2721.0, "فسدًّا لذريعة تشاؤم القلوب نهى النبي صلى الله عليه وسلم عن هذه الأسماء."]], "tr": [[2688.0, "Yani evde Nâfi' (faydalı) adında biri varsa, (biri) \"Aranızda Nâfi' var mı?\" der, \"Hayır\" derler;"], [2698.2, "insan da tıyera sebebiyle göğsünü daraltan bir şeye düşer."], [2705.0, "\"Aranızda Necîh var mı?\" \"Hayır\" derler."], [2709.8, "\"Aranızda Yesâr veya Eflah var mı?\" \"Hayır\" derler."], [2718.1, "Belki bu olumsuzlama, dinleyeni uğursuzluk inancına düşürür."], [2722.5, "İşte kalplerin uğursuzluğa kapılması vasıtasını kapatmak için Nebî ﷺ bu isimleri yasakladı."]]}, {"reader": false, "ar": [[2727.0, "وأيُّ اسمٍ يكون في نفيه الوقوعُ في التشاؤم فالأصل منعه،"], [2741.5, "كمبارك، ومفلح، وخير، وسرور،"], [2744.5, "ونعمة، وما أشبه ذلك؛"], [2759.0, "لأن المتقرّر في القواعد أن العددية في الحديث إن اتفقت عللها فعدديةُ تمثيل،"], [2771.0, "ومن المعلوم أن النهي عن التسمية بنافع وأفلح ويسار ونجيح عللُها كلُّها واحدة،"], [2782.0, "فما كان متّفقًا معها في التعليل فيدخل معها في المنع."]], "tr": [[2727.0, "Olumsuzlanmasında uğursuzluk inancına düşme bulunan her isimde asıl, yasaklıktır:"], [2740.7, "Mübârek, Müflih, Hayr, Sürûr, Ni'me ve benzerleri gibi."], [2758.3, "Çünkü kaidelerde yerleşik olan şudur:"], [2761.6, "Hadisteki sayı bildiren ifadelerin illetleri aynıysa bu örnekleme sayısıdır."], [2771.0, "Bilindiği üzere Nâfi', Eflah, Yesâr ve Necîh isimlerinin konulmasının yasaklanmasında illetlerin hepsi birdir."], [2782.0, "İllette bunlarla birleşen her isim, yasaklıkta da bunlarla birlikte olur."]]}]}, {"ts": "46:29", "title": "6. Külliye (devam): İsimlerle ilgili nehiy tahrîmî mi, tenzîhî mi?", "paras": [{"reader": false, "ar": [[2789.0, "فإن قلت: وهل النهي في هذه الأحاديث نهيُ تحريمٍ أو كراهة؟"], [2801.0, "أقول: في ذلك خلافٌ بين العلماء رحمهم الله تعالى،"], [2807.0, "والأصحّ أنه نهيُ تنزيهٍ وكراهة،"], [2811.0, "وليس من باب نهي التحريم القاطع."], [2815.0, "فإن قلت: وما برهانك على أن النهي فيها مصروفٌ عن بابه إلى الكراهة؟"], [2827.0, "فأقول: الدليل على ذلك حديثُ أنسٍ رضي الله عنه ـ (يستدرك:) حديثُ جابرٍ رضي الله عنه عند الإمام مسلم ـ قال:"], [2839.7, "«أراد النبي صلى الله عليه وسلم أن ينهى عن أن يُسمّى بيَعلى، وببركة، وبأفلح، وبيسار، وبنافع، ثم رأيتُه سكت بعد ذلك فلم يقل شيئًا، ثم قُبض رسول الله صلى الله عليه وسلم ولم ينهَ عن ذلك»."]], "tr": [[2789.0, "\"Bu hadislerdeki nehiy tahrîm (haram kılma) nehyi midir yoksa kerâhet nehyi mi?\" dersen, derim ki:"], [2804.3, "Bu konuda âlimler (rahimehumullah) arasında ihtilaf vardır."], [2809.4, "En sahih olanı, bunun tenzîh ve kerâhet nehyi olduğu, kesin tahrîm nehyi babından olmadığıdır."], [2820.4, "\"Buradaki nehyin kendi babından (tahrîmden) kerâhete çevrildiğine dair burhanın nedir?\" dersen, derim ki:"], [2832.9, "Bunun delili Enes'in (r.a.) hadisi —(düzeltiyor:) İmam Müslim'deki Câbir'in (r.a.) hadisi—dir."], [2841.0, "Şöyle der: \"Nebî ﷺ Ya'lâ, Bereke, Eflah, Yesâr ve Nâfi' isimlerinin konulmasını yasaklamak istedi."], [2857.7, "Sonra bundan sonra sustuğunu ve bir şey söylemediğini gördüm."], [2864.9, "Sonra Resûlullah ﷺ vefat etti ve bunu yasaklamadı.\""]]}, {"reader": false, "ar": [[2870.0, "وانتبهوا لكلمة: «ولم ينهَ عن ذلك»."], [2875.0, "«ثم أراد عمر رضي الله عنه أن ينهى عنه ثم تركه»."], [2880.0, "وعند البخاري في «الأدب المفرد» من حديث جابرٍ رضي الله عنه قال:"], [2886.4, "قال النبي صلى الله عليه وسلم:"], [2889.0, "«إن عشتُ نهيتُ أمتي ـ إن شاء الله ـ أن يسمّي أحدهم بركةَ ونافعًا وأفلح؛ يقال: هاهنا بركة؟ فيقال: ليس هاهنا»."], [2910.0, "فقُبض النبي صلى الله عليه وسلم ولم ينهَ عن ذلك."]], "tr": [[2870.0, "\"Ve bunu yasaklamadı\" kelimesine dikkat edin."], [2875.5, "\"Sonra Ömer (r.a.) bunu yasaklamak istedi, sonra bundan vazgeçti.\" Buhârî'nin \"el-Edebü'l-Müfred\"inde Câbir'in (r.a.) hadisinde Nebî ﷺ şöyle buyurmuştur:"], [2886.9, "\"Eğer yaşarsam —inşallah— ümmetimden birinin Bereke, Nâfi' ve Eflah isimlerini koymasını yasaklayacağım;"], [2899.1, "'Bereke burada mı?' denir, 'Burada değil' denir.\" Nebî ﷺ vefat etti ve bunu yasaklamadı."]]}, {"reader": false, "ar": [[2916.0, "فإن قلت: وكيف يقول الراوي:"], [2918.8, "«ولم ينهَ عن ذلك»،"], [2921.0, "مع أنه في الأحاديث المذكورة سابقًا ثبت نهيه عن ذلك؟"], [2930.0, "الجواب: المتقرّر في القواعد أن الجمع بين الأدلة واجبٌ ما أمكن،"], [2936.0, "وأن إعمال الدليلين أولى من إهمال أحدهما ما أمكن،"], [2942.0, "وأن الجمع مقدَّمٌ على النسخ."], [2946.0, "وبناءً على ذلك فيُحمل النهي المنفيّ في حديث جابر ـ في قوله:"], [2953.0, "«ولم ينهَ عن ذلك»،"], [2955.0, "ثم مات ولم ينهَ عنه ـ إنما هو محمولٌ على النهي التحريمي الجازم،"], [2963.0, "وأما نهيُ الكراهة فقد نهى عنه النبي صلى الله عليه وسلم."]], "tr": [[2916.0, "\"Daha önce zikredilen hadislerde bunu yasakladığı sabit olduğu hâlde, râvi nasıl 've bunu yasaklamadı' der?\" dersen, cevap şudur:"], [2931.1, "Kaidelerde yerleşik olan şudur: Deliller arasını mümkün olduğunca cem etmek vaciptir;"], [2938.7, "iki delili mümkün olduğunca birlikte işletmek, birini ihmal etmekten evlâdır;"], [2947.3, "cem, nesihten öncedir. Buna göre Câbir'in hadisinde \"ve bunu yasaklamadı\" sözündeki —sonra vefat etti ve onu yasaklamadı— olumsuzlanan nehiy, kesin tahrîmî nehye hamledilir."], [2964.3, "Kerâhet nehyine gelince, Nebî ﷺ bunu yasaklamıştır."]]}, {"reader": false, "ar": [[2968.0, "فوجه الجمع بين هذه الأحاديث التي تُثبت النهي وتنفي النهي:"], [2975.0, "أن النهي المثبَت إنما هو نهي الكراهة التنزيهية،"], [2980.0, "وأما النهي المنفيّ فإنما هو نهي التحريم."], [2984.0, "وعلى ذلك قال الحافظ النووي رحمه الله تعالى في «شرح الإمام مسلم»،"], [2989.0, "قال: وقوله: «أراد النبي صلى الله عليه وسلم أن ينهى عن هذه الأسماء» المراد أن ينهى عنها نهيَ تحريم،"], [3000.0, "وأما نهي الكراهة فقد نهى عنه في الأحاديث الباقية."]], "tr": [[2968.0, "Nehyi isbat eden ve nehyi nefyeden bu hadisler arasındaki cem yolu şudur:"], [2978.1, "İsbat edilen nehiy tenzîhî kerâhet nehyidir, nefyedilen nehiy ise tahrîm nehyidir."], [2985.2, "Buna göre Hâfız Nevevî (rahimehullah) \"Şerhu Müslim\"de şöyle der:"], [2990.6, "\"'Nebî ﷺ bu isimleri yasaklamak istedi' sözünden maksat, onları tahrîm nehyiyle yasaklamak istemesidir."], [3000.0, "Kerâhet nehyine gelince, onu diğer hadislerde yasaklamıştır.\""]]}, {"reader": false, "ar": [[3007.0, "وقال القاضي عياض على قوله:"], [3009.5, "«ثم سكت عنها ولم ينهَ»،"], [3012.0, "قال: دليلٌ على أنه ترك النهي،"], [3017.2, "وأن نهيه أولًا إنما كان نهيَ تنزيهٍ وترغيبٍ مخافةَ سوء الفأل <span class=\"q\">؟ 50:12<\/span>."], [3023.0, "ويدلّ على ذلك أيضًا أن النبي صلى الله عليه وسلم كان له غلامٌ اسمه رباح ولم يغيّره،"], [3034.0, "وكان له مولًى اسمه يسار ولم يغيّره،"], [3043.0, "وابنُ عمر سمّى غلامه نافعًا وأقرّه الصحابة؛"], [3049.0, "مما يدلّ على أن النهي في الأحاديث الأولى ليس على باب التحريم والتحتّم،"], [3056.0, "وإنما على باب الكراهة التنزيهية."]], "tr": [[3007.0, "Kâdî Iyâz da \"Sonra onlar hakkında sustu ve yasaklamadı\" sözü hakkında şöyle der:"], [3012.5, "\"Bu, nehyi terk ettiğine ve önceki nehyinin ancak, kötü fe'l (uğursuzluk) <span class=\"q\">؟<\/span> korkusuyla tenzîh ve teşvik (tergîb) nehyi olduğuna delildir.\" Buna şu da delâlet eder:"], [3027.5, "Nebî ﷺ'in Rabâh adında bir kölesi vardı ve onun adını değiştirmedi;"], [3034.0, "Yesâr adında bir azatlısı vardı ve onun adını değiştirmedi."], [3044.5, "İbn Ömer kölesine Nâfi' adını koydu ve sahabe onu onayladı."], [3051.2, "Bu da ilk hadislerdeki nehyin tahrîm ve kesinlik babından değil, tenzîhî kerâhet babından olduğunu gösterir."]]}]}, {"ts": "51:00", "title": "6. Külliye (devam): Nebî ﷺ'in çirkin isimleri değiştirmesi", "paras": [{"reader": false, "ar": [[3060.0, "والخلاصة من ذلك ـ وفّقكم الله ـ أنه لمّا كان نفيُ هذه الأسماء يوقع في الطيرة،"], [3077.0, "سدّ النبي صلى الله عليه وسلم هذا الباب بالنهي عنها،"], [3082.0, "لأن كلَّ ما من شأنه أن يوقع الطيرة في القلب فإن المشروع سدُّه."], [3089.0, "بل إن النبي صلى الله عليه وسلم ـ من باب المحافظة على القلوب من التشاؤم المحرّم ـ كان يغيّر حتى أسماءَ الأشخاص والأماكن التي تبعث على الطيرة."]], "tr": [[3060.0, "Bunun özeti —Allah sizi muvaffak kılsın— şudur:"], [3067.8, "Bu isimlerin olumsuzlanması tıyeraya düşürdüğü için Nebî ﷺ onları yasaklayarak bu kapıyı kapattı;"], [3082.5, "çünkü kalpte tıyeraya sebep olabilecek her şeyi kapatmak meşrudur."], [3089.0, "Hatta Nebî ﷺ, kalpleri haram olan uğursuzluk inancından korumak babından, tıyeraya sevk eden kişi ve yer isimlerini bile değiştirirdi."]]}, {"reader": false, "ar": [[3100.0, "ففي صحيح الإمام البخاري من حديث ابن المسيَّب عن أبيه أنه جاء إلى النبي صلى الله عليه وسلم فقال:"], [3113.6, "«ما اسمك؟» قال: حَزْن."], [3116.0, "قال: «بل أنت سهل»."], [3117.0, "قال: لا أغيّر اسمًا سمّانيه أبي."], [3121.0, "قال سعيد بن المسيَّب:"], [3123.0, "«فلا تزال الحُزونة فينا بعدُ»، يعني فينا الشدّة."]], "tr": [[3100.0, "İmam Buhârî'nin Sahîh'inde İbnü'l-Müseyyeb'in babasından rivayet ettiği hadiste, (dedesinin) Nebî ﷺ'e geldiği anlatılır."], [3106.7, "(Nebî ﷺ) \"Adın ne?\" dedi."], [3109.6, "\"Hazn (sert, engebeli)\" dedi. \"Hayır, sen Sehl'sin (yumuşak, düz)\" buyurdu."], [3116.0, "\"Babamın bana koyduğu bir ismi değiştirmem\" dedi."], [3118.3, "Saîd b. el-Müseyyeb der ki:"], [3121.0, "\"O sertlik bundan sonra da bizde devam etti.\" Yani bizde şiddet (sertlik) vardır."]]}, {"reader": false, "ar": [[3127.0, "وفي حديث عائشة رضي الله عنها أن النبي صلى الله عليه وسلم كان يغيّر الاسم القبيح <span class=\"note\">(Tirmizî)<\/span>،"], [3135.8, "سدًّا لذريعة التشاؤم به."], [3138.0, "ومرّ صلى الله عليه وسلم على قريةٍ اسمها عَفِرة فسمّاها خَضِرة،"], [3145.2, "حتى لا يتشاءم من يمرّ عليها باسمها."], [3155.0, "وغيّر صلى الله عليه وسلم يثربَ إلى المدينة وطَيْبة وطابة،"], [3164.0, "سدًّا لذريعة هذا الاسم الذي فيه تثريب، وهو كثرة اللوم."]], "tr": [[3127.0, "Âişe'nin (r.anhâ) hadisinde Nebî ﷺ'in çirkin ismi değiştirdiği geçer <span class=\"note\">(Tirmizî)<\/span>;"], [3131.4, "bu, o isim sebebiyle uğursuzluğa kapılma vasıtasını kapatmak içindi."], [3135.8, "Nebî ﷺ Afira (kıraç) adında bir köyün yanından geçti ve onu Hadira (yeşil) diye adlandırdı;"], [3144.6, "ta ki oradan geçen kimse onun ismi yüzünden uğursuzluğa kapılmasın."], [3155.7, "Nebî ﷺ Yesrib'i Medine, Tayyibe ve Tâbe olarak değiştirdi;"], [3162.6, "içinde \"tesrîb\", yani çok kınama anlamı bulunan bu ismin vasıtasını kapatmak için."]]}, {"reader": false, "ar": [[3170.0, "وأما قول الله عز وجل في سورة الأحزاب:"], [3177.0, "<span class=\"ayah\">﴿يَا أَهْلَ يَثْرِبَ لَا مُقَامَ لَكُمْ فَارْجِعُوا﴾<\/span> <span class=\"ref\">[الأحزاب: ١٣]<\/span>،"], [3179.0, "فإنما هو قولٌ من المنافقين ليُثيروا حزازات الجاهلية في الأوس والخزرج."], [3186.0, "وغيّر النبي صلى الله عليه وسلم اسمَ عاصية إلى جميلة <span class=\"note\">(Müslim)<\/span> من باب سدّ الذريعة،"], [3198.0, "وغيّر صلى الله عليه وسلم اسمَ شهابٍ إلى هشام،"], [3204.0, "لأن الشهاب من طبعه الاحتراق والإحراق،"], [3208.0, "وغيّر النبي صلى الله عليه وسلم اسمَ أَصْرَم ـ من صَرْم الزرع ـ إلى زُرعة،"], [3216.6, "من باب سدّ الذريعة."]], "tr": [[3170.0, "Allah Teâlâ'nın Ahzâb sûresindeki <span class=\"ayah\">﴿Ey Yesrib halkı! Sizin için burada durulacak yer yok, geri dönün﴾<\/span> [Ahzâb 13] sözüne gelince, bu, Evs ve Hazrec arasında cahiliye kinlerini kışkırtmak için münafıkların söylediği bir sözdür."], [3189.4, "Nebî ﷺ Âsiye (isyankâr) ismini sedd-i zerîa babından Cemîle olarak değiştirdi <span class=\"note\">(Müslim)<\/span>."], [3199.3, "Şihâb ismini Hişâm olarak değiştirdi;"], [3202.7, "çünkü şihâbın (alev parçasının) tabiatında yanmak ve yakmak vardır."], [3208.7, "Nebî ﷺ, ekin biçmek (sarm) kökünden gelen Asram ismini de sedd-i zerîa babından Zür'a olarak değiştirdi."]]}, {"reader": false, "ar": [[3221.0, "فأخذ العلماء من ذلك هذه الكلية،"], [3224.2, "وهي أن كلَّ ما من شأنه أن يوقع الطيرة في القلب فالواجب سدُّه،"], [3231.0, "لأن المتقرّر في القواعد أن كلَّ ذريعةٍ تُفضي إلى الحرام إفضاءَ علمٍ أو غلبةِ ظنٍّ فالواجب سدُّها."]], "tr": [[3221.0, "Âlimler bundan şu külliyeyi çıkarmıştır:"], [3224.2, "Kalpte tıyeraya sebep olabilecek her şeyi kapatmak vaciptir."], [3229.4, "Çünkü kaidelerde yerleşik olan şudur:"], [3232.6, "Kesin bilgiyle veya galip zanla harama götüren her vasıtayı kapatmak vaciptir."]]}, {"reader": false, "ar": [[3240.0, "والله أعلى وأعلم، وصلى الله وسلم على نبينا محمدٍ وعلى آله وصحبه أجمعين."]], "tr": [[3240.0, "Allah en yüce ve en iyi bilendir."], [3242.0, "Allah, Peygamberimiz Muhammed'e, âline ve bütün ashâbına salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
