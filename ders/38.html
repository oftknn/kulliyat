<script>
const D={"no": 38, "vid": "o7jYjRmhhKQ", "title_ar": "الدرس (٣٨) من شرح كليات العقيدة — من كليات توحيد الألوهية: النفع والضر، والقبور، والنية، والطاغوت", "title_tr": "Şerhu Külliyyâti'l-Akîde — 38. Ders: Ulûhiyyet Tevhidi Külliyeleri (Mahlûkun Fayda-Zarar Verdiğine İnanmak, İstidrâc, Kabirlerde Yapılanların Tevkîfîliği, Ümmetlerle Peygamberleri Arasındaki Husumet, Niyet ve İhlâs, Şeytana İbadet, Tâğûtu İnkâr, Kendine İbadete Çağıran Tâğût)", "sections": [{"ts": "00:00", "title": "1. Külliye: Bir mahlûkun Allah'tan bağımsız fayda ve zarar verdiğine inanan şirke düşmüştür", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.7, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.5, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [9.1, "أمّا بعد: عندنا في هذا الدرس جُمَلٌ من الكلّيّات المتعلّقة بتوحيد الألوهية."], [15.0, "الكلّيّة الأولى، وهي سهلةٌ جدًّا:"], [17.5, "<b>كلُّ من اعتقد في مخلوقٍ أنه ينفعُ ويضرُّ من دون الله عز وجل فقد أشرك.<\/b> كلُّ من اعتقد في مخلوقٍ أنه ينفع أو يضرّ من دون الله عز وجل فقد أشرك."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.7, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.0, "Bundan sonra: Bu derste elimizde ulûhiyyet tevhidiyle ilgili birtakım külliyeler var."], [15.0, "1. külliye ki çok kolaydır:"], [17.5, "<b>1. külliye: Bir mahlûkun Allah Azze ve Celle'den bağımsız olarak fayda ve zarar verdiğine inanan herkes şirke düşmüştür.<\/b> Bir mahlûkun Allah Azze ve Celle'den bağımsız olarak fayda ya da zarar verdiğine inanan herkes şirke düşmüştür."]]}, {"reader": false, "ar": [[34.0, "أقول وبالله التوفيق: وهذا من الكفر والشرك بالله عز وجل؛"], [40.0, "وذلك لأنّ الأولياء ـ على مختلف أصنافهم وتباين أنواعهم ـ لا ينفعون ولا يضرّون إلا بإذن الله عز وجل،"], [51.0, "فلا يجلبون منافعَ ولا يدفعون مضارَّ أبدًا،"], [60.0, "لا سيّما إذا كانوا من الأموات؛"], [61.9, "فإنّ الميّت قد انقطع عملُه،"], [63.4, "وقد انقطع نفعُه لهذه الحياة."], [65.0, "وأمّا إذا كان الوليّ حيًّا فإنه كذلك نعتقد أنه لا ينفع غيرَه استقلالًا،"], [73.3, "ولا يضرّ غيرَه استقلالًا إلا بإذن الله عز وجل."]], "tr": [[34.0, "Tevfik Allah'tandır, derim ki: Bu, Allah Azze ve Celle'ye karşı küfür ve şirktendir."], [40.0, "Çünkü velîler —çeşitli sınıflarına ve farklı türlerine rağmen— Allah Azze ve Celle'nin izni olmadan ne fayda verebilirler ne de zarar."], [54.7, "Asla menfaat celbedemezler, zararları da def edemezler;"], [61.9, "hele ölülerden iseler. Çünkü ölünün ameli kesilmiş, bu hayata olan faydası da kesilmiştir."], [65.0, "Velî diri ise, onun hakkında da aynı şekilde Allah Azze ve Celle'nin izni olmadan başkasına müstakil olarak fayda veremeyeceğine ve müstakil olarak zarar veremeyeceğine inanırız."]]}, {"reader": false, "ar": [[79.0, "وذلك لأنّ الذي يجلب النفعَ على الحقيقة،"], [82.1, "ويدفع الضرَّ على الحقيقة،"], [83.8, "إنما هو الله عز وجل."], [86.0, "وقد أمر اللهُ عز وجل نبيَّه أن يصرّح بهذه الحقيقة،"], [90.0, "منبّهًا للأمّة ألّا تتّخذه ندًّا لله عز وجل يُطلب منه النفعُ والضرُّ من دون الله تبارك وتعالى،"], [100.0, "فقال الله عز وجل:"], [101.9, "<span class=\"ayah\">﴿قُل لَّا أَمْلِكُ لِنَفْسِي نَفْعًا وَلَا ضَرًّا إِلَّا مَا شَاءَ اللَّهُ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٨]<\/span>."], [107.0, "فالنافعُ والضارُّ على الحقيقة إنما هو الله تبارك وتعالى."]], "tr": [[79.0, "Bu şundandır: Hakikatte faydayı celbeden ve hakikatte zararı def eden ancak Allah Azze ve Celle'dir."], [86.0, "Allah Azze ve Celle Peygamberine bu hakikati açıkça ilan etmesini emretmiştir;"], [89.6, "ümmeti, onu Allah Tebâreke ve Teâlâ'yı bırakıp kendisinden fayda ve zarar istenen bir denk (nidd) edinmemesi için uyararak."], [98.8, "Allah Azze ve Celle şöyle buyurdu:"], [101.9, "<span class=\"ayah\">﴿De ki: Allah'ın dilediği dışında ben kendime bir fayda ya da zarar verme gücüne sahip değilim﴾<\/span> [A'râf 188]."], [107.0, "Hakikatte fayda veren ve zarar veren ancak Allah Tebâreke ve Teâlâ'dır."]]}, {"reader": false, "ar": [[116.0, "يقول الله عز وجل في ذمّ المشركين وبيان نوع شركهم،"], [119.0, "قال: <span class=\"ayah\">﴿وَيَعْبُدُونَ مِن دُونِ اللَّهِ مَا لَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ وَيَقُولُونَ هَٰؤُلَاءِ شُفَعَاؤُنَا عِندَ اللَّهِ﴾<\/span> <span class=\"ref\">[يونس: ١٨]<\/span>."], [127.0, "ويقول الله عز وجل:"], [129.7, "<span class=\"ayah\">﴿هَلْ يَسْمَعُونَكُمْ إِذْ تَدْعُونَ ۝ أَوْ يَنفَعُونَكُمْ أَوْ يَضُرُّونَ ۝ قَالُوا بَلْ وَجَدْنَا آبَاءَنَا كَذَٰلِكَ يَفْعَلُونَ﴾<\/span> <span class=\"ref\">[الشعراء: ٧٢–٧٤]<\/span>."], [139.0, "ودائمًا إذا مرّت «بل» في القرآن فاعرف أنها للإضراب؛"], [146.0, "يعني بمعنى: أننا لم نجدهم كذلك،"], [149.0, "ولكنّ الأمر كذا وكذا."], [151.0, "والأدلّة في هذا المعنى كثيرة."]], "tr": [[116.0, "Allah Azze ve Celle müşrikleri yererken ve şirklerinin türünü açıklarken şöyle buyurur:"], [119.5, "<span class=\"ayah\">﴿Allah'ı bırakıp kendilerine ne zarar ne de fayda veremeyen şeylere ibadet ediyorlar ve \"Bunlar Allah katında bizim şefaatçilerimizdir\" diyorlar﴾<\/span> [Yûnus 18]."], [127.0, "Allah Azze ve Celle şöyle buyurur:"], [129.7, "<span class=\"ayah\">﴿Dua ettiğinizde sizi işitiyorlar mı? Yahut size fayda ya da zarar veriyorlar mı? Dediler ki: Hayır, ama biz babalarımızı böyle yapar bulduk﴾<\/span> [Şuarâ 72–74]."], [139.0, "Kur'an'da «bel» (hayır, bilakis) ne zaman geçerse, onun idrâb (önceki sözden dönme) için olduğunu bil;"], [146.0, "yani şu anlamda: \"Biz onları öyle bulmadık, ama iş şöyle şöyledir.\" Bu anlamdaki deliller çoktur."]]}, {"reader": false, "ar": [[156.0, "ومنه أيضًا قولُ الله عز وجل عن إبراهيم أنه قال لأبيه:"], [159.7, "<span class=\"ayah\">﴿يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ وَلَا يُبْصِرُ وَلَا يُغْنِي عَنكَ شَيْئًا﴾<\/span> <span class=\"ref\">[مريم: ٤٢]<\/span>."], [167.0, "وبناءً على ذلك: لا يجوز دعاءُ الأولياء من دون الله عز وجل،"], [171.8, "ولا الاستغاثةُ بهم، ولا النذرُ لهم،"], [174.3, "ولا طلبُ المدد منهم."], [176.0, "ومن هذا يعلم كلُّ ذي بصيرةٍ أنّ ما يفعله كثيرٌ من الناس ـ ولا حول ولا قوّة إلا بالله ـ عند قبر من يسمّونه بالبدويّ،"], [187.0, "أو عند قبر الحسين،"], [189.0, "أو قبر عليّ بن أبي طالب،"], [190.0, "أو قبر من يسمّونه بموسى الكاظم،"], [194.0, "أو عند قبر الشيخ عبد القادر الجيلاني،"], [198.0, "أو ما أشبه ذلك،"], [199.1, "من طلب المدد والغوث والدعاء من دون الله عز وجل،"], [204.0, "كلُّ ذلك من الكفر الأكبر الناقل عن الملّة بالكلّيّة."], [208.0, "فيجب الحذرُ من ذلك،"], [210.0, "والتوبةُ منه، والتواصي بترك ذلك."]], "tr": [[156.0, "Allah Azze ve Celle'nin İbrâhim hakkında, onun babasına şöyle dediğini bildiren sözü de bundandır:"], [159.7, "<span class=\"ayah\">﴿Babacığım! İşitmeyen, görmeyen ve sana hiçbir faydası olmayan şeye niçin ibadet ediyorsun?﴾<\/span> [Meryem 42]."], [167.0, "Buna göre: Allah Azze ve Celle'yi bırakıp velîlere dua etmek, onlardan yardım dilemek (istiğase), onlara adak adamak ve onlardan medet istemek caiz değildir."], [176.0, "Buradan her basiret sahibi şunu bilir:"], [179.0, "İnsanların birçoğunun —lâ havle ve lâ kuvvete illâ billâh— Bedevî dedikleri kişinin kabri, Hüseyin'in kabri, Ali b."], [188.5, "Ebî Tâlib'in kabri, Mûsâ el-Kâzım dedikleri kişinin kabri, Şeyh Abdülkâdir Geylânî'nin kabri ya da benzerlerinin yanında, Allah Azze ve Celle'yi bırakıp medet, yardım (gavs) ve dua istemek şeklinde yaptıkları şeylerin hepsi, kişiyi milletten tamamen çıkaran büyük küfürdendir."], [208.0, "Bundan sakınmak, ondan tövbe etmek ve onu terk etmeyi birbirine tavsiye etmek vaciptir."]]}, {"reader": false, "ar": [[212.0, "يقول العلماءُ رحمهم الله تعالى:"], [217.0, "«من يعتقد في الأولياء أنهم ينفعون أو يضرّون فإنه قد وقع في الشرك الأكبر. وهكذا إذا دعاهم، واستغاث بهم، وذهب إلى قبورهم، ونذر لهم، أو ذبح لهم، أو استعان بهم، أو قال: يا أولياءَ الله، أنا في حسبكم، أنا في جواركم؛ كلُّ هذا شركٌ أكبر؛ لأنّ الميّت قد انقطع عملُه، لا ينفع ولا يضرّ أحدًا، والنافعُ والضارُّ هو الله وحده. وهكذا الحيّ لا ينفع ولا يضرّ إلا بإذن الله. فمن اعتقد أنّ أحدًا يضرّ وينفع ـ ولو حيًّا ـ دون الله عز وجل صار كفرًا أكبر»."], [258.7, "انتهى كلامهم رحمهم الله."]], "tr": [[212.0, "Âlimler —Allah onlara rahmet etsin— şöyle der:"], [212.6, "\"Velîlerin fayda veya zarar verdiğine inanan kimse büyük şirke düşmüştür."], [213.6, "Onlara dua ettiğinde, onlardan yardım dilediğinde, kabirlerine gittiğinde, onlara adak adadığında, onlar için hayvan kestiğinde, onlardan yardım istediğinde ya da 'Ey Allah'ın velîleri!"], [217.0, "Ben sizin himayenizdeyim, ben sizin korumanızdayım' dediğinde de böyledir."], [230.5, "Bunların hepsi büyük şirktir. Çünkü ölünün ameli kesilmiştir;"], [244.5, "kimseye ne fayda ne de zarar verebilir."], [258.7, "Fayda veren ve zarar veren yalnız Allah'tır."], [259.3, "Diri de böyledir; Allah'ın izni olmadan ne fayda verebilir ne zarar."], [259.9, "Kim —diri de olsa— birinin Allah Azze ve Celle'den bağımsız olarak zarar ve fayda verdiğine inanırsa, bu büyük küfür olur.\" Onların —Allah onlara rahmet etsin— sözü burada bitti."]]}, {"reader": false, "ar": [[261.0, "فهذا هو الشركُ الذي وقع فيه أكثرُ أهل الأرض:"], [268.0, "أنهم يعتقدون في المخلوق ـ حيًّا أو ميّتًا ـ أنّ له أحقّيّةَ التصرّف في شيءٍ من هذا الكون،"], [275.3, "في جلب الخيرات أو دفع شيءٍ من المضرّات،"], [279.0, "دون الله عز وجل. والله أعلم."]], "tr": [[261.0, "İşte yeryüzündekilerin çoğunun düştüğü şirk budur:"], [265.3, "Diri ya da ölü bir mahlûkun, Allah Azze ve Celle'den bağımsız olarak bu kâinatta bir şeyde, hayırları celbetmede ya da zararlardan bir şeyi def etmede tasarruf hakkı olduğuna inanırlar. Allah en iyisini bilir."]]}]}, {"ts": "04:43", "title": "2. Külliye: Maksadına meşru olmayan bir yolla ulaşan istidrâca uğramıştır", "paras": [{"reader": false, "ar": [[283.0, "ومن الكلّيّات أيضًا: <b>كلُّ من تحقّق له مقصودُه بطريقٍ غيرِ مشروعٍ فمستدرَج.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[283.0, "Külliyelerden biri de şudur: 2."], [285.0, "külliye: Maksadı meşru olmayan bir yolla gerçekleşen herkes istidrâca uğramıştır (müstedrecdir). (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[311.0, "وذلك لأنّ المتقرّر في القواعد:"], [314.4, "أنّ تحقُّقَ المقاصد لا يدلّ على سلامة الوسائل."], [320.0, "فاللهُ عز وجل يطلب منّا صحّةَ المقاصد،"], [323.9, "وسلامةَ الوسائل التي نصل إلى هذه المقاصد عن طريقها."], [329.0, "ولذلك نجد أنّ بعض الناس يصحّح الوسيلةَ إذا كانت كفيلةً بتحصيل مقصوده؛"], [339.0, "فأيُّ وسيلةٍ سلكها وتحصّل منها مقصودُه الذي يريده،"], [343.0, "فإنّ وجود المقاصد عند هذا الصنف من الناس يدلّ على سلامة الوسيلة عنده."], [349.0, "وهذا من أعظم الخطأ."]], "tr": [[311.0, "Bu şundandır: Kaidelerde yerleşmiş olan şudur:"], [314.4, "Maksatların gerçekleşmesi, vasıtaların sağlıklı (meşru) olduğuna delâlet etmez."], [320.0, "Allah Azze ve Celle bizden maksatların sahih olmasını ve bu maksatlara ulaştığımız vasıtaların sağlıklı olmasını ister."], [329.0, "Bu yüzden bazı insanların, maksadını elde etmeye yeterli olduğunda vasıtayı doğru saydığını görürüz."], [339.0, "Tuttuğu ve kendisinden istediği maksadın hâsıl olduğu her vasıta (meşrudur der);"], [343.9, "bu sınıf insanlara göre maksatların gerçekleşmesi vasıtanın sağlıklı olduğuna delâlet eder. Bu, en büyük hatalardandır."]]}, {"reader": false, "ar": [[351.0, "ولذلك تجد أنّ كثيرًا من الناس قد يدعو بدعاءٍ بدعيّ،"], [359.0, "ولكنّ الله يستجيب له؛"], [361.0, "فلا تدلّ استجابةُ الله له على مشروعيّة نوع دعائه هذا."], [366.0, "بل إننا نجد أنّ من الناس من يأتي إلى قبر الوليّ ويدعوه من دون الله عز وجل،"], [374.0, "ويتحقّق له مطلوبُه: إمّا لعِظَم ضرورته،"], [379.0, "والله عز وجل هو الذي يجيب المضطرّ؛"], [382.0, "وإمّا ابتلاءً وامتحانًا له."], [385.0, "كما حكى ذلك أهلُ العلم بأنّ عُبّاد الأصنام يأتونها ويدعونها من دون الله عز وجل،"], [394.0, "وقد تحقّق لهم الشياطينُ شيئًا ممّا يريدون،"], [397.7, "من باب الابتلاء والامتحان لهم."]], "tr": [[351.0, "Bu yüzden insanların birçoğunun bid'at bir dua ile dua ettiğini, ama Allah'ın ona icabet ettiğini görürsün."], [361.0, "Allah'ın ona icabet etmesi, onun bu dua türünün meşru olduğuna delâlet etmez."], [366.0, "Hatta insanlardan bazısının velînin kabrine gelip Allah Azze ve Celle'yi bırakıp ona dua ettiğini ve isteğinin gerçekleştiğini görürüz."], [376.0, "Bu ya zaruretinin büyüklüğündendir —darda kalana icabet eden de Allah Azze ve Celle'dir— ya da onun için bir imtihan ve denemedir."], [385.0, "Nitekim ilim ehli, putlara tapanların putlara gelip Allah Azze ve Celle'yi bırakıp onlara dua ettiklerini ve şeytanların, imtihan ve deneme babından, onlar için istedikleri şeylerden bir kısmını gerçekleştirdiğini anlatmıştır."]]}, {"reader": false, "ar": [[403.0, "بل وقد يتوسّل الإنسانُ بتوسُّلٍ بدعيٍّ لا أصلَ له في الكتاب والسنة ولا عن سلف الأمّة،"], [411.4, "ويستجيب اللهُ عز وجل دعاءه."], [414.0, "وقد يذهب المريضُ إلى الكهّان أو إلى السحرة،"], [419.1, "أو يستعمل بعضَ التعاويذ الشركيّة البدعيّة،"], [422.8, "ومع ذلك يتحقّق له الشفاء."], [426.0, "فلا يجوز لنا أن نجعل تحقُّقَ المقاصد من بعض الوسائل دليلًا على أنها صحيحةٌ وسليمة."]], "tr": [[403.0, "Hatta insan, Kitap'ta, Sünnet'te ve ümmetin selefinde hiçbir aslı olmayan bid'at bir tevessülle tevessül edebilir ve Allah Azze ve Celle onun duasına icabet edebilir."], [416.5, "Hasta kâhinlere ya da sihirbazlara gidebilir veya şirk ve bid'at içeren bazı muskaları kullanabilir;"], [426.0, "buna rağmen şifa bulabilir. Bazı vasıtalarla maksatların gerçekleşmesini, onların sahih ve sağlıklı olduğuna delil yapmamız caiz değildir."]]}, {"reader": false, "ar": [[436.0, "قال الإمامُ ابنُ تيميّة رحمه الله:"], [439.9, "«فإنّا نعلم أنّ الكفّار قد يُستجاب لهم، فيُسقَون ويُنصَرون ويُعانون ويُرزَقون، مع دعائهم أوثانَهم وتوسُّلهم بها. وقد قال الله عز وجل: <span class=\"ayah\">﴿كُلًّا نُّمِدُّ هَٰؤُلَاءِ وَهَٰؤُلَاءِ مِنْ عَطَاءِ رَبِّكَ ۚ وَمَا كَانَ عَطَاءُ رَبِّكَ مَحْظُورًا﴾<\/span> <span class=\"ref\">[الإسراء: ٢٠]<\/span>، وقال تعالى: <span class=\"ayah\">﴿وَأَنَّهُ كَانَ رِجَالٌ مِّنَ الْإِنسِ يَعُوذُونَ بِرِجَالٍ مِّنَ الْجِنِّ فَزَادُوهُمْ رَهَقًا﴾<\/span> <span class=\"ref\">[الجن: ٦]<\/span>. وأسبابُ المقدورات فيها أمورٌ يطول تعدادُها، ليس هذا موضعَ تفصيلها، وإنما على الخلق اتّباعُ ما بعث الله به المرسلين، والعلمُ بأنّ فيه خيرَ الدنيا والآخرة»."], [479.1, "انتهى كلامه رحمه الله."]], "tr": [[436.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [436.6, "\"Biliyoruz ki kâfirlere de, putlarına dua etmelerine ve onlarla tevessül etmelerine rağmen, bazen icabet edilir;"], [438.6, "yağmur verilir, yardım edilir, destek verilir ve rızıklandırılırlar."], [439.9, "Allah Azze ve Celle şöyle buyurmuştur:"], [446.3, "<span class=\"ayah\">﴿Hepsine, onlara da bunlara da Rabbinin ihsanından yardım ederiz. Rabbinin ihsanı (kimseye) yasaklanmış değildir﴾<\/span> [İsrâ 20]."], [461.2, "Yüce Allah şöyle buyurmuştur: <span class=\"ayah\">﴿Gerçek şu ki, insanlardan bazı kişiler cinlerden bazı kişilere sığınırlardı da onların azgınlığını artırırlardı﴾<\/span> [Cin 6]."], [479.1, "Kaderle takdir edilen şeylerin sebeplerinde sayılması uzun sürecek hususlar vardır;"], [479.7, "burası onları tafsil etme yeri değildir."], [480.3, "Halka düşen ancak Allah'ın peygamberleri onunla gönderdiği şeye uymak ve dünya ve âhiret hayrının onda olduğunu bilmektir.\" Onun —Allah ona rahmet etsin— sözü burada bitti."]]}, {"reader": false, "ar": [[481.0, "وقال الإمامُ ابنُ القيّم في «الداء والدواء»:"], [484.9, "«وكثيرًا ما نجد أدعيةً دعا بها قومٌ فاستُجيب لهم، فيكون قد اقترن بالدعاء ضرورةُ صاحبه وإقبالُه على الله، أو حسنةٌ تقدّمت منه جعل اللهُ عز وجل إجابةَ دعوته شكرًا لحسنته، أو صادف الدعاءُ وقتَ إجابةٍ ونحو ذلك، فأُجيبت دعوتُه، فيظنّ الظانّ أنّ السرّ في لفظ ذلك الدعاء، فيأخذه مجرّدًا عن تلك الأمور التي قارنته من ذلك الداعي. وهذا كما إذا استعمل رجلٌ دواءً نافعًا في الوقت الذي ينبغي، على الوجه الذي ينبغي، فانتفع به، فظنّ غيرُه أنّ استعمال هذا الدواء مجرّدًا كافٍ في حصول المطلوب، فيكون بذلك غالطًا. وهذا موضعٌ يغلط فيه كثيرٌ من الناس."]], "tr": [[481.0, "İmam İbnü'l-Kayyim \"ed-Dâ' ve'd-Devâ\" adlı eserinde şöyle demiştir:"], [484.3, "\"Bir topluluğun dua edip de icabet olunduğu birçok dua görürüz."], [488.7, "(Oysa) duaya, sahibinin zarureti ve Allah'a yönelişi eşlik etmiştir;"], [493.1, "ya da ondan önce geçmiş bir iyilik vardır ve Allah Azze ve Celle duasına icabet etmeyi o iyiliğe bir karşılık (şükür) kılmıştır;"], [503.3, "ya da dua bir icabet vaktine denk gelmiştir ve benzeri şeyler;"], [508.9, "böylece duasına icabet edilmiştir. Bunu zanneden kişi sırrın o duanın lafzında olduğunu sanır ve onu, o dua edende ona eşlik eden o hususlardan soyutlayarak alır."], [520.9, "Bu, şuna benzer: Bir adam faydalı bir ilacı gereken vakitte, gereken şekilde kullanır ve ondan fayda görür;"], [527.9, "başkası da bu ilacı tek başına kullanmanın istenen sonucu elde etmeye yeteceğini sanır;"], [533.2, "böylece yanılmış olur. Bu, insanların birçoğunun yanıldığı bir noktadır."]]}, {"reader": false, "ar": [[538.0, "ومن هذا: قد يتّفق دعاؤه باضطرارٍ عند قبرٍ فيُجاب،"], [544.0, "فيظنّ الجاهلُ أنّ السرّ للقبر،"], [548.0, "ولم يعلم أنّ السرّ للاضطرار وصدقِ اللَّجَأ إلى الله عز وجل."], [553.0, "فإذا حصل ذلك في بيتٍ من بيوت الله كان أفضلَ وأحبَّ»."], [557.4, "انتهى كلامه رحمه الله."], [559.0, "وقال في موضعٍ آخر:"], [560.6, "«بل المشركون الذين بُعث إليهم رسولُ الله صلى الله عليه وسلم كانوا يدعون عند أوثانهم فيُستجاب لهم أحيانًا، كما قد يُستجاب لهؤلاء أحيانًا»."]], "tr": [[538.0, "Bundandır: Kişinin zaruret içindeki duası bir kabrin yanında denk gelir ve icabet edilir;"], [544.7, "cahil de sırrın kabirde olduğunu sanır."], [548.5, "Sırrın zarurette ve Allah Azze ve Celle'ye sadakatle sığınmakta olduğunu bilmez."], [553.0, "Bu (zaruret ve sığınma) Allah'ın evlerinden birinde olsaydı daha faziletli ve daha sevimli olurdu.\" Onun —Allah ona rahmet etsin— sözü burada bitti."], [559.0, "Başka bir yerde de şöyle demiştir:"], [560.6, "\"Hatta Resûlullah sallallâhu aleyhi ve sellem'in kendilerine gönderildiği müşrikler putlarının yanında dua ederlerdi de bazen onlara icabet edilirdi;"], [568.4, "tıpkı bunlara da bazen icabet edildiği gibi.\""]]}, {"reader": false, "ar": [[576.0, "ولذلك لا يجوز لنا ـ معاشرَ أهل السنة والجماعة ـ أن نجعل من علامات صحّة الوسيلة وجودَ المقصود؛"], [584.0, "فهذا شيءٌ وهذا شيء."], [588.0, "وقال الإمامُ ابنُ تيميّة رحمه الله:"], [590.0, "«وأصلُ هذا: أنّ قول القائل: إنّ الدعاء مستجابٌ عند قبور الأنبياء والصالحين، قولٌ ليس له أصلٌ في كتاب الله، ولا سنّة رسوله صلى الله عليه وسلم، ولا قاله أحدٌ من الصحابة، ولا التابعين لهم بإحسان، ولا أحدٌ من أئمّة المسلمين المشهورين بالإمامة في الدين، كمالكٍ، والثوريّ، والأوزاعيّ، والليث بن سعد، وأبي حنيفة، والشافعيّ، وأحمد بن حنبل، وإسحاق بن راهويه، وأبي عبيدة، ولا مشايخِهم الذين يُقتدى بهم، كالفضيل بن عياض، وإبراهيم بن أدهم، وأبي سليمان الدارانيّ، وأمثالِهم."]], "tr": [[576.0, "Bu yüzden biz Ehl-i Sünnet ve'l-Cemaat topluluğunun, maksadın gerçekleşmesini vasıtanın sahih olduğunun alametlerinden saymamız caiz değildir;"], [580.3, "bu ayrı bir şeydir, o ayrı bir şey."], [584.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [584.6, "\"Bunun aslı şudur: 'Peygamberlerin ve sâlihlerin kabirleri yanında dua kabul olur' diyenin sözü, Allah'ın Kitabı'nda ve Resûlü'nün sallallâhu aleyhi ve sellem Sünneti'nde aslı olmayan bir sözdür."], [585.7, "Bunu ne sahabeden biri, ne onlara güzellikle tâbi olanlar, ne de dinde imamlığıyla meşhur Müslüman imamlardan biri söylemiştir:"], [588.0, "Mâlik, Sevrî, Evzâî, Leys b."], [588.3, "Sa'd, Ebû Hanîfe, Şâfiî, Ahmed b."], [589.0, "Hanbel, İshak b. Râhûye ve Ebû Ubeyde gibi."], [590.0, "Kendilerine uyulan şeyhlerinden de (söyleyen olmamıştır):"], [602.6, "Fudayl b. İyâz, İbrâhim b."], [613.2, "Edhem, Ebû Süleymân ed-Dârânî ve benzerleri gibi."]]}, {"reader": false, "ar": [[630.0, "ولم يكن في الصحابة والتابعين والأئمّة والمشايخ المتقدّمين من يقول:"], [635.1, "إنّ الدعاء مستجابٌ عند قبور الأنبياء والصالحين،"], [639.0, "لا مطلقًا ولا معيّنًا،"], [641.0, "ولا فيهم من قال:"], [643.0, "إنّ دعاء الإنسان عند قبور الأنبياء والصالحين أفضلُ من دعائه في غير هذه البقعة،"], [650.0, "ولا أنّ الصلاة في تلك البقعة أفضلُ من الصلاة في غيرها،"], [654.0, "ولا فيهم من كان يتحرّى الدعاءَ ولا الصلاةَ عند هذه القبور»."], [657.8, "انتهى كلامه. وكلُّ ذلك من باب الإجابة عمّن يجعلون استجابةَ بعض الدعوات عند قبور الأنبياء أو الأولياء دليلًا صالحًا على أفضليّة الدعاء عندها."], [674.0, "فالواجبُ الحذرُ من ذلك، والله أعلم."]], "tr": [[630.0, "Sahabe, tâbiîn, imamlar ve önceki şeyhler arasında 'Peygamberlerin ve sâlihlerin kabirleri yanında dua kabul olur' diyen —ne mutlak olarak ne de belirli (bir kabir) için— hiç kimse olmamıştır."], [643.0, "Onlardan hiç kimse 'İnsanın peygamberlerin ve sâlihlerin kabirleri yanındaki duası, bu bölge dışındaki duasından daha faziletlidir' dememiş;"], [649.5, "'O bölgede namaz kılmak başka yerde kılmaktan daha faziletlidir' de dememiştir."], [652.9, "Onlardan bu kabirlerin yanında duayı ya da namazı özellikle arayan kimse de yoktu.\" Sözü burada bitti."], [657.8, "Bütün bunlar, peygamberlerin ya da velîlerin kabirleri yanında bazı duaların kabul olmasını, oradaki duanın faziletli olduğuna geçerli bir delil sayanlara cevap verme babındandır."], [674.0, "Bundan sakınmak vaciptir. Allah en iyisini bilir."]]}]}, {"ts": "11:16", "title": "3. Külliye: Mezarlıklarda ve kabirlerin yanında yapılan her şey tevkîfîdir", "paras": [{"reader": false, "ar": [[676.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما يُفعل في المقابر وعند القبور فمبناه على التوقيف.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[676.0, "Külliyelerden biri de şudur: 3."], [677.8, "külliye: Mezarlıklarda ve kabirlerin yanında yapılan her şeyin dayanağı tevkîftir (nassa bağlıdır). (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[698.0, "أقول وبالله التوفيق: وهذا من الأصول السُّنّيّة السلفيّة التي يجب أن نُجمع عليها؛"], [706.0, "وذلك لأنّ أعظمَ صور الشرك التي انتشرت في الأرض إنما أوائلُها كان من المقابر والقبور."], [715.0, "فلمّا غلا الناسُ في قبور الأولياء والصالحين ـ من ودٍّ وسُواعٍ ويغوثَ ونسرٍ ويعوقَ ـ عُبدت هذه القبورُ من دون الله عز وجل."], [728.0, "ولذلك نبّه أهلُ السنة بأنه لا يجوز للإنسان أن يُحدث شيئًا من الأفعال أو التصرّفات في القبور أو المقابر إلا وعلى ذلك دليلٌ من الشرع."]], "tr": [[698.0, "Tevfik Allah'tandır, derim ki: Bu, üzerinde icmâ etmemiz gereken Sünnî ve Selefî usûldendir."], [706.0, "Çünkü yeryüzüne yayılan şirkin en büyük suretlerinin ilkleri ancak mezarlıklardan ve kabirlerden çıkmıştır."], [713.8, "İnsanlar velîlerin ve sâlihlerin —Vedd, Süvâ', Yeğûs, Nesr ve Ye'ûk'un— kabirleri hakkında aşırı gidince, bu kabirlere Allah Azze ve Celle'yi bırakıp ibadet edildi."], [728.0, "Bu yüzden Ehl-i Sünnet, insanın kabirlerde veya mezarlıklarda, üzerinde şer'î bir delil olmadıkça hiçbir fiil ya da tasarrufu ihdas etmesinin caiz olmadığına dikkat çekmiştir."]]}, {"reader": false, "ar": [[738.0, "فإننا إذا أحكمنا ذلك البابَ وأغلقناه الإغلاقَ المحكم،"], [745.0, "فإنّ كثيرًا من صور الشرك سوف تنتهي وتتلاشى،"], [749.4, "كما قال الناظم: «فإذا سددنا ذلك البابَ الذي خرجت لنا منه قبائحُ بدعةٍ، فستنتهي صورٌ من الشرك التي عمّت بها البلوى في المعمورة»."], [761.0, "فلا يجوز أبدًا أن نُحدث شيئًا في القبور أو المقابر إلا وعلى ذلك دليلٌ من الشرع."]], "tr": [[738.0, "Bu kapıyı sağlamlaştırır ve onu sıkıca kapatırsak, şirkin birçok sureti sona erecek ve yok olacaktır."], [751.0, "Nâzımın dediği gibi: \"Bid'atin çirkinliklerinin bize kendisinden çıktığı o kapıyı kapattığımızda, dünyayı belası sarmış olan şirk suretleri sona erecektir.\" Dolayısıyla üzerinde şer'î bir delil olmadıkça kabirlerde ya da mezarlıklarda bir şey ihdas etmemiz asla caiz değildir."]]}, {"reader": false, "ar": [[768.0, "فيدخل في ذلك البناءُ على القبور،"], [770.0, "فإنه وسيلةٌ من وسائل الشرك."], [773.0, "ويدخل في ذلك التبرّكُ بالقبور،"], [776.1, "فإنه محرّمٌ أيضًا. ويدخل في ذلك الدعاءُ عند القبور،"], [781.0, "فإنه محرّمٌ ووسيلةٌ من وسائل الشرك."], [784.0, "ويدخل في ذلك اعتقادُ فضيلة الذبح عند شيءٍ من القبور أو المقابر."], [789.0, "ويدخل في ذلك إسراجُ المقابر والقبور،"], [794.0, "وقد «لعن النبيُّ صلى الله عليه وسلم زوّاراتِ القبور، والمتّخذين عليها المساجدَ والسُّرُج»."]], "tr": [[768.0, "Kabirlerin üzerine bina yapmak da buna girer;"], [769.7, "çünkü o, şirk vasıtalarından bir vasıtadır."], [773.0, "Kabirlerle teberrük etmek de buna girer;"], [778.0, "o da haramdır. Kabirlerin yanında dua etmek de buna girer;"], [781.0, "o da haramdır ve şirk vasıtalarından bir vasıtadır."], [784.0, "Kabirlerden ya da mezarlıklardan bir şeyin yanında hayvan kesmenin faziletli olduğuna inanmak da buna girer."], [789.0, "Mezarlıkları ve kabirleri kandillerle aydınlatmak da buna girer."], [792.8, "Peygamber sallallâhu aleyhi ve sellem \"kabirleri çokça ziyaret eden kadınlara ve kabirlerin üzerine mescitler yapıp kandiller yakanlara lanet etmiştir.\""]]}, {"reader": false, "ar": [[802.0, "وقد نصّ العلماءُ أيضًا على تحريم تزيين القبر بأيّ نوعٍ من أنواع الزينة؛"], [810.0, "فلا يجوز أن يُفرش،"], [811.9, "ولا أن يُسجّى، ولا أن يُجصّص،"], [814.7, "ولا أن يوضع عليه شيءٌ من الرخام،"], [818.0, "ولا أن يُبنى عليه شيءٌ من المشاهد أو القباب."], [824.0, "وأعظمُ من ذلك: الركوعُ أو السجودُ للقبور،"], [828.1, "أو طلبُ الشفاعة من الأموات،"], [831.0, "أو تقديمُ القرابين للأموات،"], [833.0, "أو إقامةُ الأعياد والموالد في المقابر أو خارجها،"], [839.0, "أو زيارةُ القبور أو المقابر بقصد التبرّك وأخذِ تراب الأموات."]], "tr": [[802.0, "Âlimler, kabri herhangi bir süs türüyle süslemenin haram olduğunu da açıkça belirtmişlerdir."], [810.0, "Kabrin üzerine bir şey serilmesi, örtülmesi, kireçle sıvanması, üzerine mermerden bir şey konulması ve üzerine türbelerden ya da kubbelerden bir şey yapılması caiz değildir."], [824.0, "Bundan daha büyüğü: Kabirlere rükû ya da secde etmek, ölülerden şefaat istemek, ölülere kurbanlar sunmak, mezarlıklarda ya da dışında bayramlar ve mevlitler düzenlemek veya teberrük ve ölülerin toprağını almak kastıyla kabirleri ya da mezarlıkları ziyaret etmektir."]]}, {"reader": false, "ar": [[847.0, "أو تشجيرُ المقابر، أو رشُّ المياه على القبور القديمة،"], [853.0, "أو رشُّها بالطيب وغيره،"], [859.0, "أو تقبيلُها، أو لمسُها،"], [862.0, "أو التمسّحُ بها، أو كتابةُ الأسماء عليها،"], [870.0, "أو إلقاءُ عرائض الشكوى من شبابيكها."], [875.0, "وكلُّ هذه الممارسات كلُّها تُعتبر من البدع،"], [880.0, "وكلُّها ممّا يخالف شريعةَ محمدٍ صلى الله عليه وسلم."], [885.0, "فالواجبُ علينا أن نحذر من ذلك؛"], [887.0, "لأنه متى ما فُتح ذلك البابُ فإنه سوف ترى صورًا عظيمةً من الشرك والبدعة ممّا لا تطيقه الأمّة. والله أعلم."]], "tr": [[847.0, "Ya da mezarlıkları ağaçlandırmak, eski kabirlerin üzerine su serpmek, onlara güzel koku ve başka şeyler serpmek, onları öpmek, onlara dokunmak, onlara sürünmek (teberrük için el sürmek), üzerlerine isimler yazmak ya da pencerelerinden şikâyet dilekçeleri atmak."], [875.0, "Bu uygulamaların hepsi bid'at sayılır ve hepsi Muhammed sallallâhu aleyhi ve sellem'in şeriatine aykırı olan şeylerdendir."], [885.0, "Bundan sakınmamız vaciptir. Çünkü bu kapı ne zaman açılırsa, ümmetin taşıyamayacağı büyük şirk ve bid'at suretleri görürsün. Allah en iyisini bilir."]]}]}, {"ts": "14:59", "title": "4. Külliye: Ümmetlerle peygamberleri arasındaki bütün husumet ulûhiyyet tevhidi ve taalluklarındaydı", "paras": [{"reader": false, "ar": [[899.0, "ومن الكلّيّات أيضًا: <b>كلُّ الخصومة بين الأمم وأنبيائها كانت في توحيد الألوهية ومتعلّقاته.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[899.0, "Külliyelerden biri de şudur: 4."], [900.8, "külliye: Ümmetlerle peygamberleri arasındaki bütün husumet, ulûhiyyet tevhidi ve onun taalluklarında idi. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[928.0, "أقول وبالله التوفيق: وهذا متّفقٌ عليه بين أهل العلم رحمهم الله تعالى،"], [935.0, "أعني بهم أهلَ السنة والجماعة؛"], [937.0, "فإنّ أصل النزاع بين جميع الرسل وأقوامهم إنما كان في توحيد الألوهية،"], [943.0, "وليس في مجرّد تقرير توحيد الربوبية."], [948.0, "فالنزاعُ بين الأمم وأنبيائها إنما كان في توحيد الألوهية خاصّة،"], [953.0, "ولم تختلف الأممُ وأنبياؤها في توحيد الربوبية،"], [956.8, "بل كانوا يُقرّون به."]], "tr": [[928.0, "Tevfik Allah'tandır, derim ki: Bu, ilim ehli —Allah onlara rahmet etsin— arasında, yani Ehl-i Sünnet ve'l-Cemaat arasında üzerinde ittifak edilmiş bir husustur."], [937.0, "Çünkü bütün resullerle kavimleri arasındaki çekişmenin aslı ancak ulûhiyyet tevhidinde idi;"], [942.5, "sırf rubûbiyyet tevhidini takrir etmekte değildi."], [948.0, "Ümmetlerle peygamberleri arasındaki çekişme özellikle ulûhiyyet tevhidinde idi."], [952.0, "Ümmetler ile peygamberleri rubûbiyyet tevhidinde ihtilaf etmediler;"], [955.7, "bilakis onlar onu ikrar ediyorlardı."]]}, {"reader": false, "ar": [[959.0, "فالصراعُ الذي دام بين الأنبياء وأتباعهم،"], [964.0, "وبين الأمم الكافرة ورسلها،"], [966.2, "على مدى التاريخ البشريّ الغابر،"], [969.0, "لم يكن في إثبات وجود الله عز وجل،"], [972.0, "ولا في أنه الخالق،"], [973.7, "ولا في أنه الرازق،"], [975.3, "ولا في أنه المحيي،"], [977.0, "ولا في أنه المميت،"], [979.3, "ولا في أنه المدبّر والمتصرّف والضارّ والنافع والمالك لهذا العالم؛"], [985.0, "فكلُّ هذه المعاني في الجملة من المسلَّمات التي كانت تعتقدها هذه الأمم،"], [990.0, "كما قال الله عز وجل:"], [993.2, "<span class=\"ayah\">﴿وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَهُمْ لَيَقُولُنَّ اللَّهُ﴾<\/span> <span class=\"ref\">[الزخرف: ٨٧]<\/span>،"], [997.0, "وقال الله عز وجل:"], [998.8, "<span class=\"ayah\">﴿وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ وَسَخَّرَ الشَّمْسَ وَالْقَمَرَ لَيَقُولُنَّ اللَّهُ﴾<\/span> <span class=\"ref\">[العنكبوت: ٦١]<\/span>."], [1004.2, "والآياتُ في هذا المعنى كثيرةٌ جدًّا."]], "tr": [[959.0, "Geçmiş insanlık tarihi boyunca peygamberler ve onlara uyanlar ile kâfir ümmetler ve resulleri arasında süregelen mücadele, Allah Azze ve Celle'nin varlığını ispat etmekte değildi."], [972.0, "O'nun Yaratıcı, Rızık veren, Dirilten ve Öldüren olmasında da değildi."], [975.8, "Bu âlemi idare eden, onda tasarruf eden, zarar ve fayda veren ve onun Mâliki olmasında da değildi."], [985.0, "Bu anlamların hepsi, genel olarak bu ümmetlerin inandığı kabul edilmiş şeylerdendi."], [987.5, "Allah Azze ve Celle'nin buyurduğu gibi:"], [989.2, "<span class=\"ayah\">﴿Andolsun, onlara kendilerini kimin yarattığını sorsan, elbette \"Allah\" derler﴾<\/span> [Zuhruf 87]."], [993.2, "Allah Azze ve Celle şöyle buyurdu:"], [996.4, "<span class=\"ayah\">﴿Andolsun, onlara gökleri ve yeri kimin yarattığını, güneşi ve ayı kimin boyun eğdirdiğini sorsan, elbette \"Allah\" derler﴾<\/span> [Ankebût 61]."], [1004.2, "Bu anlamdaki ayetler pek çoktur."]]}, {"reader": false, "ar": [[1008.0, "وإنما كانوا يخالفون أممَهم في توحيد الألوهية ومتعلّقاته."], [1016.0, "فالأنبياءُ ما زالوا يدعون هذه الأممَ إلى توحيد الألوهية وإخلاص العبادة لله عز وجل،"], [1022.0, "ولا يزال أقوامُهم يخاصمونهم في ذلك،"], [1026.0, "كما قال الله عز وجل عن نبيّنا صلى الله عليه وسلم لمّا أمر قريشًا بالتوحيد:"], [1032.8, "<span class=\"ayah\">﴿أَجَعَلَ الْآلِهَةَ إِلَٰهًا وَاحِدًا ۖ إِنَّ هَٰذَا لَشَيْءٌ عُجَابٌ﴾<\/span> <span class=\"ref\">[ص: ٥]<\/span>؛"], [1038.0, "فتلك هي الخصومة. وقال الله عز وجل:"], [1041.0, "<span class=\"ayah\">﴿إِنَّهُمْ كَانُوا إِذَا قِيلَ لَهُمْ لَا إِلَٰهَ إِلَّا اللَّهُ يَسْتَكْبِرُونَ ۝ وَيَقُولُونَ أَئِنَّا لَتَارِكُو آلِهَتِنَا لِشَاعِرٍ مَّجْنُونٍ﴾<\/span> <span class=\"ref\">[الصافات: ٣٥–٣٦]<\/span>."]], "tr": [[1008.0, "(Peygamberler) ümmetlerine ancak ulûhiyyet tevhidi ve onun taalluklarında muhalefet ediyorlardı."], [1016.0, "Peygamberler bu ümmetleri ulûhiyyet tevhidine ve ibadeti Allah Azze ve Celle'ye has kılmaya davet etmeyi sürdürdüler;"], [1021.6, "kavimleri de bu konuda onlarla husumet etmeyi sürdürdü."], [1026.0, "Nitekim Allah Azze ve Celle, Peygamberimiz sallallâhu aleyhi ve sellem Kureyş'e tevhidi emrettiğinde (onların şöyle dediklerini) bildirir:"], [1032.8, "<span class=\"ayah\">﴿İlâhları tek bir ilâh mı yaptı? Bu gerçekten şaşılacak bir şey!﴾<\/span> [Sâd 5]."], [1038.0, "İşte husumet budur. Allah Azze ve Celle şöyle buyurdu:"], [1041.0, "<span class=\"ayah\">﴿Onlara \"Allah'tan başka ilâh yoktur\" denildiğinde büyüklük taslarlardı ve \"Mecnun bir şair için ilâhlarımızı mı bırakacağız?\" derlerdi﴾<\/span> [Sâffât 35–36]."]]}, {"reader": false, "ar": [[1051.0, "وأغلبُ الأمم قالت لأنبيائها:"], [1053.8, "<span class=\"ayah\">﴿قَالُوا أَجِئْتَنَا لِنَعْبُدَ اللَّهَ وَحْدَهُ﴾<\/span> <span class=\"ref\">[الأعراف: ٧٠]<\/span>،"], [1058.0, "وفي آيةٍ أخرى: <span class=\"ayah\">﴿لِتَأْفِكَنَا عَنْ آلِهَتِنَا﴾<\/span> <span class=\"ref\">[الأحقاف: ٢٢]<\/span>،"], [1061.8, "الآيةَ بتمامها. ويقول الله عز وجل عن قوم هودٍ أنهم قالوا له:"], [1067.0, "<span class=\"ayah\">﴿قَالُوا يَا هُودُ مَا جِئْتَنَا بِبَيِّنَةٍ وَمَا نَحْنُ بِتَارِكِي آلِهَتِنَا عَن قَوْلِكَ وَمَا نَحْنُ لَكَ بِمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[هود: ٥٣]<\/span>."], [1075.0, "وقال قومُ نوحٍ لنوحٍ لمّا دعاهم إلى التوحيد،"], [1081.0, "قال: <span class=\"ayah\">﴿وَمَكَرُوا مَكْرًا كُبَّارًا ۝ وَقَالُوا لَا تَذَرُنَّ آلِهَتَكُمْ وَلَا تَذَرُنَّ وَدًّا وَلَا سُوَاعًا وَلَا يَغُوثَ وَيَعُوقَ وَنَسْرًا﴾<\/span> <span class=\"ref\">[نوح: ٢٢–٢٣]<\/span>."]], "tr": [[1051.0, "Ümmetlerin çoğu peygamberlerine şöyle dedi:"], [1053.8, "<span class=\"ayah\">﴿Dediler ki: Yalnız Allah'a ibadet etmemiz için mi bize geldin?﴾<\/span> [A'râf 70]."], [1059.9, "Başka bir ayette: <span class=\"ayah\">﴿Bizi ilâhlarımızdan çevirmek için mi (geldin)?﴾<\/span> [Ahkâf 22];"], [1063.0, "ayetin tamamı. Allah Azze ve Celle Hûd'un kavmi hakkında, onların ona şöyle dediklerini bildirir:"], [1067.0, "<span class=\"ayah\">﴿Dediler ki: Ey Hûd! Sen bize açık bir delil getirmedin. Biz senin sözünle ilâhlarımızı bırakacak değiliz ve biz sana inanacak da değiliz﴾<\/span> [Hûd 53]."], [1075.0, "Nûh'un kavmi, Nûh onları tevhide davet ettiğinde (şöyle yaptı);"], [1081.8, "buyurdu ki: <span class=\"ayah\">﴿Ve büyük büyük tuzaklar kurdular. Dediler ki: Sakın ilâhlarınızı bırakmayın; Vedd'i, Süvâ'ı, Yeğûs'u, Ye'ûk'u ve Nesr'i asla bırakmayın﴾<\/span> [Nûh 22–23]."]]}, {"reader": false, "ar": [[1093.0, "وكذلك قومُ إبراهيم عليه الصلاة والسلام،"], [1098.0, "لمّا قال الله عز وجل:"], [1100.5, "<span class=\"ayah\">﴿وَلَقَدْ آتَيْنَا إِبْرَاهِيمَ رُشْدَهُ مِن قَبْلُ وَكُنَّا بِهِ عَالِمِينَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٥١]<\/span>،"], [1105.0, "الآياتُ التي بعدها كلُّها تتكلّم عن أنّ الخصومة بين إبراهيم عليه السلام وبين قومه إنما كانت في توحيد الألوهية."], [1117.0, "<span class=\"ayah\">﴿قَالُوا لَئِن لَّمْ تَنتَهِ يَا نُوحُ لَتَكُونَنَّ مِنَ الْمَرْجُومِينَ﴾<\/span> <span class=\"ref\">[الشعراء: ١١٦]<\/span>،"], [1122.0, "<span class=\"ayah\">﴿قَالُوا لَئِن لَّمْ تَنتَهِ يَا لُوطُ لَتَكُونَنَّ مِنَ الْمُخْرَجِينَ﴾<\/span> <span class=\"ref\">[الشعراء: ١٦٧]<\/span> <span class=\"note\">(Şeyh iki ayetin sonlarını yer değiştirerek okuyor: Nûh için «من المخرجين», Lût için «من المرجومين»)<\/span>؛"], [1126.0, "أي: إذا صددتَنا عمّا يعبد آباؤنا فإننا سوف نقتلك أو نُخرجك."]], "tr": [[1093.0, "İbrâhim aleyhissalâtu vesselâmın kavmi de böyledir."], [1100.5, "Allah Azze ve Celle <span class=\"ayah\">﴿Andolsun, Biz daha önce İbrâhim'e rüşdünü (doğru yolu bulma yeteneğini) vermiştik; Biz onu biliyorduk﴾<\/span> [Enbiyâ 51] buyurduğunda, ondan sonraki ayetlerin hepsi, İbrâhim aleyhisselâm ile kavmi arasındaki husumetin ancak ulûhiyyet tevhidinde olduğundan bahseder."], [1117.0, "<span class=\"ayah\">﴿Dediler ki: Ey Nûh! Eğer (bu işe) son vermezsen, mutlaka taşlanarak öldürülenlerden olacaksın﴾<\/span> [Şuarâ 116]."], [1122.0, "<span class=\"ayah\">﴿Dediler ki: Ey Lût! Eğer (bu işe) son vermezsen, mutlaka (yurdundan) çıkarılanlardan olacaksın﴾<\/span> [Şuarâ 167]."], [1126.0, "Yani: \"Bizi babalarımızın ibadet ettiği şeyden alıkoyarsan, seni öldürürüz ya da (yurdundan) çıkarırız.\""]]}, {"reader": false, "ar": [[1135.0, "وقال سبحانه عن قوم صالح:"], [1138.0, "<span class=\"ayah\">﴿قَالُوا يَا صَالِحُ قَدْ كُنتَ فِينَا مَرْجُوًّا قَبْلَ هَٰذَا ۖ أَتَنْهَانَا أَن نَّعْبُدَ مَا يَعْبُدُ آبَاؤُنَا وَإِنَّنَا لَفِي شَكٍّ مِّمَّا تَدْعُونَا إِلَيْهِ مُرِيبٍ﴾<\/span> <span class=\"ref\">[هود: ٦٢]<\/span>."], [1149.0, "وكذلك قال الله عز وجل عن قوم شعيبٍ عليه السلام:"], [1152.0, "<span class=\"ayah\">﴿قَالُوا يَا شُعَيْبُ أَصَلَاتُكَ تَأْمُرُكَ أَن نَّتْرُكَ مَا يَعْبُدُ آبَاؤُنَا أَوْ أَن نَّفْعَلَ فِي أَمْوَالِنَا مَا نَشَاءُ ۖ إِنَّكَ لَأَنتَ الْحَلِيمُ الرَّشِيدُ﴾<\/span> <span class=\"ref\">[هود: ٨٧]<\/span>."]], "tr": [[1135.0, "Allah Sübhânehû, Sâlih'in kavmi hakkında şöyle buyurdu:"], [1138.0, "<span class=\"ayah\">﴿Dediler ki: Ey Sâlih! Sen bundan önce aramızda kendisinden (hayır) umulan biriydin. Babalarımızın ibadet ettiği şeylere ibadet etmekten bizi men mi ediyorsun? Doğrusu biz, bizi davet ettiğin şeyden derin bir şüphe içindeyiz﴾<\/span> [Hûd 62]."], [1149.6, "Allah Azze ve Celle Şuayb aleyhisselâmın kavmi hakkında da şöyle buyurdu:"], [1152.0, "<span class=\"ayah\">﴿Dediler ki: Ey Şuayb! Babalarımızın ibadet ettiği şeyleri bırakmamızı yahut mallarımız hakkında dilediğimizi yapmaktan vazgeçmemizi sana namazın mı emrediyor? Hani sen yumuşak huylu ve aklı başında biriydin!﴾<\/span> [Hûd 87]."]]}, {"reader": false, "ar": [[1162.0, "وكذلك قولُ الله عز وجل:"], [1164.0, "<span class=\"ayah\">﴿وَإِذَا ذُكِرَ اللَّهُ وَحْدَهُ﴾<\/span> ـ أي ذُكر توحيدُه وإخلاصُ العبادة له ـ إيش؟"], [1168.9, "<span class=\"ayah\">﴿اشْمَأَزَّتْ قُلُوبُ الَّذِينَ لَا يُؤْمِنُونَ بِالْآخِرَةِ ۖ وَإِذَا ذُكِرَ الَّذِينَ مِن دُونِهِ﴾<\/span> ـ أي ممّا يُعبد من دونه ـ <span class=\"ayah\">﴿إِذَا هُمْ يَسْتَبْشِرُونَ﴾<\/span> <span class=\"ref\">[الزمر: ٤٥]<\/span>."], [1178.0, "وقال الله عز وجل:"], [1179.9, "<span class=\"ayah\">﴿ذَٰلِكُم بِأَنَّهُ إِذَا دُعِيَ اللَّهُ وَحْدَهُ كَفَرْتُمْ ۖ وَإِن يُشْرَكْ بِهِ تُؤْمِنُوا ۚ فَالْحُكْمُ لِلَّهِ الْعَلِيِّ الْكَبِيرِ﴾<\/span> <span class=\"ref\">[غافر: ١٢]<\/span>."], [1187.0, "وقال الله عز وجل:"], [1189.3, "<span class=\"ayah\">﴿وَإِذَا ذَكَرْتَ رَبَّكَ فِي الْقُرْآنِ وَحْدَهُ وَلَّوْا عَلَىٰ أَدْبَارِهِمْ نُفُورًا﴾<\/span> <span class=\"ref\">[الإسراء: ٤٦]<\/span>."], [1195.0, "فهذا هو حقيقةُ الخصومة بيننا وبين القوم."]], "tr": [[1162.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [1164.0, "<span class=\"ayah\">﴿Allah tek olarak anıldığında﴾<\/span> —yani O'nun tevhidi ve ibadeti O'na has kılmak anıldığında— ne olur?"], [1168.9, "<span class=\"ayah\">﴿âhirete inanmayanların kalpleri tiksinir; O'ndan başkaları anıldığında ise﴾<\/span> —yani O'nu bırakıp ibadet edilen şeyler— <span class=\"ayah\">﴿hemen sevinirler﴾<\/span> [Zümer 45]."], [1176.1, "Allah Azze ve Celle şöyle buyurdu:"], [1178.0, "<span class=\"ayah\">﴿Bu (azap) şundandır: Allah tek olarak çağrıldığında inkâr ederdiniz; O'na ortak koşulduğunda ise inanırdınız. Artık hüküm, yüce ve büyük olan Allah'ındır﴾<\/span> [Mü'min 12]."], [1187.0, "Allah Azze ve Celle şöyle buyurdu:"], [1189.3, "<span class=\"ayah\">﴿Kur'an'da Rabbini tek olarak andığında, nefretle arkalarını dönüp giderler﴾<\/span> [İsrâ 46]."], [1195.0, "İşte bizimle o topluluk arasındaki husumetin hakikati budur."]]}, {"reader": false, "ar": [[1198.0, "فإن قلتَ: ولماذا أكّدتَ على هذه الكلّيّة؟"], [1201.3, "فأقول: لأنّ عامّةَ طوائف أهل البدع ـ بلا استثناء ـ تجعل نقطةَ الخلاف بين الأمم وأنبيائها إنما هو في توحيد الربوبية."], [1218.0, "وهذا باطلٌ بأدلّة القرآن،"], [1220.0, "وصحيحِ السنة، وإجماعِ أهل العلم رحمهم الله تعالى."], [1224.0, "فانتبهوا لذلك، والله أعلم."]], "tr": [[1198.0, "Eğer \"Bu külliye üzerinde neden ısrarla durdun?\" dersen, derim ki:"], [1202.7, "Çünkü bid'at ehli fırkalarının geneli —istisnasız— ümmetlerle peygamberleri arasındaki ihtilaf noktasını ancak rubûbiyyet tevhidinde sayar."], [1218.0, "Bu, Kur'an'ın delilleriyle, sahih Sünnet'le ve ilim ehlinin —Allah onlara rahmet etsin— icmâıyla bâtıldır."], [1224.0, "Buna dikkat edin. Allah en iyisini bilir."]]}]}, {"ts": "20:26", "title": "5. Külliye: Bütün ameller, amel edenin niyetine ve kastına tâbidir", "paras": [{"reader": false, "ar": [[1226.0, "الكلّيّة الخامسة: <b>كلُّ الأعمال تابعةٌ لنيّة العامل وقصده.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1226.0, "<b>5. külliye: Bütün ameller, amel edenin niyetine ve kastına tâbidir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1232.0, "أقول وبالله التوفيق: وهذه من القواعد التي توجب على الإنسان أن يتفقّد نيّتَه وقصدَه الفَينةَ بعد الفَينة،"], [1248.9, "وألّا يغفل عنه دائمًا وأبدًا؛"], [1256.0, "فإنّ أعظمَ صور الشرك إنما كانت من فساد القصد في الباطن،"], [1262.0, "فلمّا فسدت بواطنُهم وقعوا في الشرك والبدع والمعاصي والذنوب والآثام."], [1267.0, "وهذه الكلّيّة فيها مسائل."]], "tr": [[1232.0, "Tevfik Allah'tandır, derim ki: Bu, insanın niyetini ve kastını zaman zaman yoklamasını ve ondan asla gafil olmamasını gerektiren kaidelerdendir."], [1256.0, "Çünkü şirkin en büyük suretleri ancak bâtındaki (içteki) kastın bozulmasından olmuştur."], [1262.0, "İçleri bozulunca şirke, bid'atlere, isyanlara, günahlara ve veballere düştüler."], [1267.0, "Bu külliyede birtakım meseleler vardır."]]}, {"reader": false, "ar": [[1272.0, "المسألة الأولى: اعلم ـ رحمك الله تعالى ـ أنّ القصد أو النيّة التي يتكلّم عنها أهلُ العلم تنقسم إلى قسمين:"], [1280.0, "إلى قصد العبادة، وإلى قصد المعبود."], [1285.7, "<span class=\"note\">(يكررها)<\/span> أمّا قصدُ العبادة فمعناه:"], [1290.8, "أن تنويَ إيقاعَ هذه العبادة."], [1297.0, "وقاعدةُ هذا النوع تقول:"], [1300.0, "«العبادة <span class=\"q\">؟ 21:37<\/span> تتبع العلم؛ فمن علم ما سيفعله فقد نواه»."], [1306.0, "وهي النيّة أو القصد الذي يتكلّم عليه الفقهاءُ رحمهم الله تعالى."]], "tr": [[1272.0, "Birinci mesele: Bil —Allah sana rahmet etsin— ki ilim ehlinin bahsettiği kast ya da niyet iki kısma ayrılır:"], [1280.0, "İbadet kastı ve mabud kastı."], [1285.7, "(Tekrar ediyor.) İbadet kastının anlamı, bu ibadeti yapmaya niyet etmendir."], [1297.0, "Bu türün kaidesi şöyle der:"], [1300.0, "\"İbadet <span class=\"q\">؟<\/span> ilme tâbidir; kim yapacağı şeyi bilirse ona niyet etmiş olur.\" Fakihlerin —Allah onlara rahmet etsin— üzerinde konuştuğu niyet ya da kast budur."]]}, {"reader": false, "ar": [[1314.0, "وأمّا القصدُ الثاني ـ وهو أعظمُ القصدين على الإطلاق ـ فهو قصدُ المعبود،"], [1319.8, "ومعناه: إخلاصُ العمل لله عز وجل؛"], [1323.0, "فلا يجوز لك أن تُشرك معه غيرَه في أيّ شيءٍ من التعبّدات."], [1330.8, "وهي التي يسمّيها علماءُ العقيدة:"], [1334.0, "الإخلاص، وضدُّها الرياءُ والشرك."], [1337.0, "وقاعدتُها: «من عمل عملًا أشرك معي فيه غيري تركتُه وشِركَه» <span class=\"note\">(Müslim)<\/span>."], [1348.0, "فهما نيّتان وقصدان لا بدّ من التفريق بينهما."]], "tr": [[1314.0, "İkinci kasta gelince —ki o mutlak olarak iki kastın en büyüğüdür— o, mabud kastıdır."], [1320.4, "Anlamı, ameli Allah Azze ve Celle'ye has kılmaktır."], [1323.0, "Taabbudların hiçbirinde O'nunla birlikte başkasını ortak koşman caiz değildir."], [1327.5, "Akîde âlimlerinin ihlâs dediği budur;"], [1330.8, "zıddı da riya ve şirktir."], [1334.0, "Bunun kaidesi şudur: \"Kim bir amel işler de onda Benimle birlikte başkasını ortak koşarsa, onu da şirkini de terk ederim.\" Bunlar, aralarını ayırmak zorunlu olan iki niyet ve iki kasttır."]]}, {"reader": false, "ar": [[1353.0, "المسألة الثانية: اعلم ـ رحمك الله تعالى ـ أنّ قصدَ توحيد المعبود بالعبادة أعظمُ وقعًا عند الله عز وجل من مجرّد قصد العبادة،"], [1366.0, "وذلك لعدّة أمور: الأمر الأوّل:"], [1370.4, "أنه إذا فات قصدُك للعبادة فإنّ العبادة تُعتبر باطلة،"], [1378.0, "ولكن لا يوجب لك ذلك أن تقع في شيءٍ من الشرك أو متعلّقاته."], [1383.0, "فإذا صلّى الإنسان بلا نيّة إيقاع الصلاة فصلاتُه باطلة،"], [1388.0, "وإذا صام بلا نيّة إيقاع الصوم فصومُه باطل،"], [1393.0, "لكن مع الحكم بالبطلان لا نحكم عليه بأنه مشرك."]], "tr": [[1353.0, "İkinci mesele: Bil —Allah sana rahmet etsin— ki ibadette mabudu birleme kastı, Allah Azze ve Celle katında sırf ibadet kastından daha büyük bir etkiye sahiptir."], [1369.0, "Bu da birkaç sebepten dolayıdır:"], [1371.8, "Birinci sebep: İbadete yönelik kastın kaçarsa ibadet bâtıl sayılır;"], [1378.4, "ama bu, senin şirkten ya da onun taalluklarından bir şeye düşmeni gerektirmez."], [1383.0, "İnsan namazı kılmaya niyet etmeden namaz kılarsa namazı bâtıldır;"], [1388.0, "oruç tutmaya niyet etmeden oruç tutarsa orucu bâtıldır."], [1393.0, "Ama bâtıl olduğuna hükmetmekle birlikte onun müşrik olduğuna hükmetmeyiz."]]}, {"reader": false, "ar": [[1397.0, "ولكن إذا فاتت نيّةُ أو قصدُ توحيد المعبود فإنّ العبادة باطلة،"], [1404.2, "ويُزاد على ذلك بأنك قد وقعت في الشرك."], [1412.0, "ويؤكّد ذلك: أنّ الشيطان يحرص على تغفيل قلبك عن قصد المعبود بالعبادة أكثرَ من حرصه على تغفيل قلبك عن قصد العبادة فقط؛"], [1427.0, "وذلك لأنّ حظّه في فوات الثانية أعظمُ من حظّه في فوات الأولى."]], "tr": [[1397.0, "Fakat mabudu birleme niyeti ya da kastı kaçarsa ibadet bâtıl olur;"], [1404.2, "buna ilaveten sen şirke de düşmüş olursun."], [1412.0, "Bunu şu da teyit eder:"], [1414.6, "Şeytan, kalbini ibadette mabud kastından gafil bırakmaya, sadece ibadet kastından gafil bırakmaya olan hırsından daha çok hırs gösterir."], [1427.0, "Çünkü ikincisinin kaçmasındaki payı, birincisinin kaçmasındaki payından daha büyüktür."]]}, {"reader": false, "ar": [[1434.0, "ويؤكّد ذلك الوجهُ الثالث:"], [1437.0, "وهي أنّ قصد العبادة قصدٌ لا يحتاج إلى مجاهدة،"], [1441.5, "ولا يحتاج إلى استحضارٍ أبدًا؛"], [1444.0, "لأنّ كلَّ عاقلٍ يعلم ما سيفعل فإنه حينئذٍ يقصده."], [1450.0, "فإنك إذا سمعت الأذانَ للفريضة،"], [1452.7, "ثم تركت ما في يديك وتوضّأت ثم خرجت،"], [1457.0, "فإنّ الأممَ كلَّها لو رأوك لعلموا أنك تريد الصلاة."], [1462.0, "فنيّةُ إيقاع التعبّد أمرٌ يسيرٌ لا يحتاج إلى تكلّفٍ ولا إلى مجاهدة."]], "tr": [[1434.0, "Bunu üçüncü vecih de teyit eder:"], [1437.0, "İbadet kastı, mücahedeye ihtiyaç duymayan ve asla (zihinde) hazır tutmaya ihtiyaç duymayan bir kasttır."], [1444.0, "Çünkü yapacağı şeyi bilen her akıllı kişi, o anda ona kastetmiş olur."], [1451.6, "Farz namaz için ezanı duyup elindekini bırakır, abdest alır, sonra çıkarsan, bütün ümmetler seni görse namaz kılmak istediğini bilirler."], [1462.0, "Taabbudu yapma niyeti kolay bir iştir;"], [1465.5, "zorlanmaya da mücahedeye de ihtiyaç duymaz."]]}, {"reader": false, "ar": [[1469.0, "ولكنّ نيّةَ إخلاص هذا التعبّد لله عز وجل هو الذي يحتاج إلى عظيم المجاهدة،"], [1476.0, "وعظيم التفقّد، وعظيم المحاسبة؛"], [1480.0, "لأنه لا يأتي للإنسان مباشرةً كنيّة قصد العبادة،"], [1485.0, "وإنما لا بدّ من استحضار،"], [1486.9, "ولا بدّ من تعبّد،"], [1488.5, "ولا بدّ من استعانة،"], [1490.0, "ولا بدّ من تعلّم،"], [1491.8, "ولا بدّ من حذرٍ شديدٍ من مزالق الشيطان فيه."], [1496.0, "ولذلك جاءت الأدلّة مؤكّدةً على الثاني ـ القصدِ الثاني،"], [1501.3, "وهو قصدُ المعبود بالعبادة ـ أكثرَ من حرصها على تأكيد مجرّد قصد العبادة."]], "tr": [[1469.0, "Fakat bu taabbudu Allah Azze ve Celle'ye has kılma niyeti, büyük bir mücahedeye, büyük bir yoklamaya ve büyük bir muhasebeye ihtiyaç duyan şeydir."], [1480.0, "Çünkü o, ibadet kastı niyeti gibi insana doğrudan gelmez;"], [1485.4, "mutlaka (zihinde) hazır tutmak, mutlaka taabbud, mutlaka (Allah'tan) yardım dilemek, mutlaka öğrenmek ve mutlaka bu hususta şeytanın kaydırak tuzaklarından şiddetle sakınmak gerekir."], [1496.0, "Bu yüzden deliller, sırf ibadet kastını vurgulamaya olan özeninden daha çok ikinciyi —ikinci kastı, yani ibadette mabud kastını— vurgulayarak gelmiştir."]]}, {"reader": false, "ar": [[1509.0, "وعلى ذلك قولُ الله عز وجل:"], [1515.0, "<span class=\"ayah\">﴿قُلِ اللَّهَ أَعْبُدُ مُخْلِصًا لَّهُ دِينِي ۝ فَاعْبُدُوا مَا شِئْتُم مِّن دُونِهِ﴾<\/span> <span class=\"ref\">[الزمر: ١٤–١٥]<\/span>،"], [1521.0, "ويقول الله عز وجل:"], [1522.8, "<span class=\"ayah\">﴿وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ﴾<\/span> <span class=\"ref\">[البينة: ٥]<\/span>."], [1527.0, "وكلُّ آيةٍ فيها الأمرُ بالإخلاص فإنها دليلٌ على القصد الثاني،"], [1533.8, "وهو قصدُ التعبّد. وأحيانًا يعبّر عنه الشارعُ بغير لفظ الإخلاص؛"], [1542.0, "أحيانًا يعبّر عنه بابتغاء وجه الله،"], [1545.0, "كقول الله عز وجل:"], [1548.0, "<span class=\"ayah\">﴿وَمَا تُنفِقُونَ إِلَّا ابْتِغَاءَ وَجْهِ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٧٢]<\/span>."], [1551.0, "فمتى ما مرّ عليك في آيات القرآن «وجه الله»،"], [1555.0, "«ابتغاء وجه الله»، فإنه يُقصد بذلك الإخلاص."]], "tr": [[1509.0, "Allah Azze ve Celle'nin şu sözü buna delildir:"], [1515.0, "<span class=\"ayah\">﴿De ki: Ben dinimi yalnız O'na has kılarak Allah'a ibadet ederim. Siz de O'nu bırakıp dilediğinize ibadet edin﴾<\/span> [Zümer 14–15]."], [1522.8, "Allah Azze ve Celle şöyle buyurur:"], [1527.0, "<span class=\"ayah\">﴿Hâlbuki onlar, dini yalnız O'na has kılarak, hanîfler olarak Allah'a ibadet etmekten başkasıyla emrolunmadılar﴾<\/span> [Beyyine 5]."], [1538.0, "İçinde ihlâs emri bulunan her ayet, ikinci kasta, yani taabbud kastına delildir."], [1542.0, "Şâri' bazen onu ihlâs lafzından başka bir lafızla ifade eder;"], [1544.5, "bazen onu Allah'ın vechini (rızasını) arzulamak ile ifade eder."], [1548.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1551.0, "<span class=\"ayah\">﴿Siz ancak Allah'ın vechini (rızasını) arzulayarak infak edersiniz﴾<\/span> [Bakara 272]."], [1553.7, "Kur'an ayetlerinde ne zaman \"Allah'ın vechi\", \"Allah'ın vechini arzulamak\" karşına çıkarsa, onunla ihlâs kastedilir."]]}, {"reader": false, "ar": [[1560.0, "وأحيانًا يعبّر عنه بتعبيرٍ آخر،"], [1564.0, "وهو إرادة الآخرة، كما قال الله عز وجل:"], [1569.0, "<span class=\"ayah\">﴿تُرِيدُونَ عَرَضَ الدُّنْيَا وَاللَّهُ يُرِيدُ الْآخِرَةَ﴾<\/span> <span class=\"ref\">[الأنفال: ٦٧]<\/span>،"], [1573.0, "وقال الله عز وجل:"], [1575.0, "<span class=\"ayah\">﴿مَن كَانَ يُرِيدُ حَرْثَ الْآخِرَةِ نَزِدْ لَهُ فِي حَرْثِهِ ۖ وَمَن كَانَ يُرِيدُ حَرْثَ الدُّنْيَا نُؤْتِهِ مِنْهَا وَمَا لَهُ فِي الْآخِرَةِ مِن نَّصِيبٍ﴾<\/span> <span class=\"ref\">[الشورى: ٢٠]<\/span>."], [1586.0, "وأحيانًا يعبّر عنه بغير ذلك،"], [1588.8, "ولا أريد الإطالةَ عليكم."], [1591.0, "لكنّ العجيب أنه لم يرد في القرآن بلفظ النيّة،"], [1596.0, "وإنما ورد في السنة الصحيحة،"], [1599.6, "كما في الصحيحين: «إنما الأعمالُ بالنيّات» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[1560.0, "Bazen de onu başka bir ifadeyle, âhireti istemek ile ifade eder."], [1565.0, "Allah Azze ve Celle'nin buyurduğu gibi:"], [1569.0, "<span class=\"ayah\">﴿Siz dünyanın geçici malını istiyorsunuz; Allah ise âhireti istiyor﴾<\/span> [Enfâl 67]."], [1575.0, "Allah Azze ve Celle şöyle buyurdu:"], [1577.0, "<span class=\"ayah\">﴿Kim âhiret kazancını isterse, onun kazancını artırırız. Kim de dünya kazancını isterse, ona ondan veririz; ama onun âhirette hiçbir nasibi yoktur﴾<\/span> [Şûrâ 20]."], [1586.0, "Bazen de onu bundan başka şekilde ifade eder;"], [1591.0, "size uzatmak istemiyorum. Fakat şaşılacak olan, onun Kur'an'da \"niyet\" lafzıyla gelmemiş olmasıdır."], [1596.7, "Sadece sahih Sünnet'te gelmiştir; Sahîhayn'de olduğu gibi: \"Ameller ancak niyetlere göredir.\""]]}, {"reader": false, "ar": [[1606.0, "وأحيانًا يعبّر عنه بإرادة لقاء الله،"], [1612.0, "كما قال الله عز وجل:"], [1614.5, "<span class=\"ayah\">﴿فَمَن كَانَ يَرْجُو لِقَاءَ رَبِّهِ فَلْيَعْمَلْ عَمَلًا صَالِحًا وَلَا يُشْرِكْ بِعِبَادَةِ رَبِّهِ أَحَدًا﴾<\/span> <span class=\"ref\">[الكهف: ١١٠]<\/span>."], [1625.0, "فيجب على الإنسان أن يتفقّد باطنَه دائمًا وأبدًا؛"], [1629.0, "وذلك لأنّ الغفلة عن قصد توحيد المعبود هو الذي أوقع أصحابَ الشرك في شركهم،"], [1636.1, "وأوقع أصحابَ الرياء في ريائهم."], [1639.0, "وعلى ذلك نصوصٌ كثيرةٌ من أهل العلم رحمهم الله تعالى."]], "tr": [[1606.0, "Bazen de onu Allah'a kavuşmayı istemek ile ifade eder."], [1614.5, "Allah Azze ve Celle'nin buyurduğu gibi:"], [1617.0, "<span class=\"ayah\">﴿Kim Rabbine kavuşmayı umuyorsa, salih amel işlesin ve Rabbine ibadette hiç kimseyi ortak koşmasın﴾<\/span> [Kehf 110]."], [1629.0, "İnsanın içini daima yoklaması vaciptir."], [1631.1, "Çünkü şirk ehlini şirklerine, riya ehlini riyalarına düşüren, mabudu birleme kastından gaflettir."], [1639.0, "İlim ehlinden —Allah onlara rahmet etsin— bu konuda birçok nas (ifade) vardır."]]}, {"reader": false, "ar": [[1643.0, "قال الإمامُ ابنُ حزمٍ رحمه الله،"], [1646.0, "قال: «والإخلاصُ هو القصدُ من القلب إلى ذلك» ـ أي إلى العبادة ـ «وهو النيّةُ نفسُها»."], [1654.0, "وقال الإمامُ الماورديّ رحمه الله:"], [1656.7, "«والإخلاصُ في كلام العلماء هو النيّة»."], [1660.0, "وقال الإمامُ ابنُ عبد البرّ رحمه الله تعالى:"], [1664.1, "«والإخلاصُ: النيّةُ في التقرّب إليه، والقصدُ بأداء ما افتُرض على المؤمن»."], [1670.0, "ويقول الإمامُ ابنُ قدامة رحمه الله:"], [1673.0, "«والإخلاصُ عملُ القلب، وهو النيّةُ وإرادةُ الله وحده دون غيره»."], [1680.0, "ويقول الشيخُ ابنُ سعديّ رحمه الله:"], [1683.0, "«والإخلاصُ معناه: تخليصُ القصد لله تعالى في جميع العبادات الواجبة والمستحبّة»."]], "tr": [[1643.0, "İmam İbn Hazm —Allah ona rahmet etsin— şöyle demiştir:"], [1646.6, "\"İhlâs, kalpten ona\" —yani ibadete— \"yönelen kasttır;"], [1650.0, "o, niyetin ta kendisidir.\" İmam Mâverdî —Allah ona rahmet etsin— şöyle demiştir:"], [1656.7, "\"Âlimlerin sözünde ihlâs, niyettir.\" İmam İbn Abdilber —Allah ona rahmet etsin— şöyle demiştir:"], [1664.1, "\"İhlâs, O'na yaklaşmada niyet ve mümine farz kılınanı eda etmeye kastetmektir.\" İmam İbn Kudâme —Allah ona rahmet etsin— şöyle der:"], [1673.0, "\"İhlâs kalbin amelidir; o, niyet ve başkası değil yalnız Allah'ı istemektir.\" Şeyh İbn Sa'dî —Allah ona rahmet etsin— şöyle der:"], [1683.0, "\"İhlâsın anlamı, vacip ve müstehap bütün ibadetlerde kastı Teâlâ olan Allah'a halis kılmaktır.\""]]}, {"reader": false, "ar": [[1689.0, "ويقول الإمامُ ابنُ تيميّة رحمه الله تعالى:"], [1693.0, "«والذي يجب أن يكون العملُ له هو سبحانه وحده لا شريك له؛ فإنّ هذه النيّة» ـ أي نيّة قصد المعبود ـ «فرضٌ في جميع العبادات، بل هذه النيّة أصلُ جميع الأعمال، ومنزلتُها منها منزلةُ القلب من البدن، ولا بدّ في جميع العبادات أن تكون خالصةً لله سبحانه»."], [1721.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[1689.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle der:"], [1693.0, "\"Amelin kendisi için yapılması gereken, ortağı olmayan, tek olan O Sübhân'dır."], [1704.8, "Çünkü bu niyet\" —yani mabud kastı niyeti— \"bütün ibadetlerde farzdır."], [1716.0, "Hatta bu niyet bütün amellerin aslıdır;"], [1721.0, "amellere göre konumu, kalbin bedene göre konumu gibidir."], [1721.4, "Bütün ibadetlerin Allah Sübhânehû'ya halis olması zorunludur.\" Onun —Allah ona rahmet etsin— sözü burada bitti."]]}, {"reader": false, "ar": [[1723.0, "ويقول الإمامُ ابنُ القيّم رحمه الله في نقلٍ مطوّل،"], [1729.0, "لعلّنا نستأنس بسماعه، يقول ـ ويقول أيضًا في بيان الارتباط رحمه الله ـ:"], [1735.0, "«فكما أنه يجب في العبادات إفرادُ المعبود تعالى بها لا سواه، فكذلك يجب فيها تمييزُ العبادة عن العادة، ولا يقع التمييز بين النوعين إلا بالنيّة. فعملٌ لا يصحبه إرادةُ المعبود غيرُ مقبولٍ ولا يُعتدّ به، وكذلك عملٌ لا تصحبه إرادةُ التعبّد والتقرّب أيضًا غيرُ مقبولٍ وليس بمعتدٍّ به."]], "tr": [[1723.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— uzunca bir nakilde şöyle der —belki dinlemekle ünsiyet buluruz— (iki niyet arasındaki) bağlantıyı açıklarken de şöyle der:"], [1730.3, "\"İbadetlerde mabud olan Teâlâ'yı, başkasını değil yalnız O'nu birlemek vacip olduğu gibi, ibadetlerde ibadeti âdetten ayırmak da vaciptir."], [1735.0, "İki tür arasındaki ayırım ancak niyetle olur."], [1741.3, "Mabudu istemenin eşlik etmediği amel makbul değildir ve itibar edilmez."], [1749.1, "Aynı şekilde taabbud ve yaklaşma (takarrub) isteğinin eşlik etmediği amel de makbul değildir ve itibar edilmez."]]}, {"reader": false, "ar": [[1767.0, "بل نيّةُ التقرّب والتعبّد جزءٌ من نيّة الإخلاص،"], [1772.0, "ولا قوامَ لنيّة الإخلاص للمعبود إلا بنيّة التعبّد."], [1776.0, "فإذا كانت نيّةُ التعبّد شرطًا في صحّة أداء العبادة،"], [1780.0, "فاشتراطُ نيّة التعبّد <span class=\"q\">؟ 29:40<\/span> أولى وأحرى»."], [1784.0, "وبناءً على ذلك: فكلُّ عملٍ وكلُّ عبادةٍ لا تقوم على كمال إخلاص القلب لله عز وجل،"], [1794.0, "وإرادة وجهه وحده لا شريك له،"], [1797.0, "فإنه يُعتبر عملًا باطلًا."]], "tr": [[1767.0, "Hatta yaklaşma ve taabbud niyeti ihlâs niyetinin bir parçasıdır;"], [1772.0, "mabuda yönelik ihlâs niyeti ancak taabbud niyetiyle ayakta durur."], [1776.0, "Taabbud niyeti ibadetin sahih olarak edasında şart olduğuna göre, taabbud niyetinin <span class=\"q\">؟<\/span> şart koşulması evleviyetle ve haydi haydi gerekir.\" Buna göre:"], [1785.9, "Kalbin Allah Azze ve Celle'ye tam ihlâsı ve ortağı olmayan, tek olan O'nun vechini istemek üzerine kurulmayan her amel ve her ibadet bâtıl bir amel sayılır."]]}]}, {"ts": "29:59", "title": "5. Külliye (sonu): Niyet kaidesine neden dikkat çekildi", "paras": [{"reader": false, "ar": [[1799.0, "فإن قلتَ: ولماذا نبّهتَ على هذه القاعدة؟"], [1802.0, "فأقول: لأنّ جميع مقتضيات توحيد الألوهية لا تصحّ إلا بنيّة إفراد المعبود بها؛"], [1809.0, "فأيُّ شيءٍ من مقتضيات توحيد الألوهية لم يقم على إخلاصٍ صادقٍ صحيحٍ فإنه يُعتبر باطلًا."], [1818.0, "فلو نطق الإنسانُ بالشهادتين منافقًا لا مخلصًا ما نفعته،"], [1824.0, "ولو أنّ الإنسان أقام الصلاة منافقًا لا مخلصًا ما نفعته،"], [1829.0, "والصلاةُ من مقتضيات توحيد الألوهية."], [1831.0, "بل جميعُ الأعمال الظاهرة والباطنة كلُّها من جملة مقتضيات توحيد الألوهية،"], [1839.0, "كلُّها من مقتضيات توحيد الألوهية."]], "tr": [[1799.0, "Eğer \"Bu kaideye neden dikkat çektin?\" dersen, derim ki:"], [1802.0, "Çünkü ulûhiyyet tevhidinin bütün gerekleri ancak onlarda mabudu birleme niyetiyle sahih olur."], [1809.0, "Ulûhiyyet tevhidinin gereklerinden sadık ve sahih bir ihlâs üzerine kurulmayan her şey bâtıl sayılır."], [1818.0, "İnsan kelime-i şehâdeti ihlâsla değil de münafık olarak söylese ona fayda vermez."], [1825.5, "İnsan namazı ihlâsla değil de münafık olarak kılsa ona fayda vermez;"], [1831.0, "namaz da ulûhiyyet tevhidinin gereklerindendir."], [1833.8, "Hatta zahirî ve bâtınî bütün amellerin hepsi ulûhiyyet tevhidinin gerekleri cümlesindendir; hepsi ulûhiyyet tevhidinin gereklerindendir."]]}, {"reader": false, "ar": [[1842.0, "فبما أنّ قوامَ صحّة توحيد الألوهية في الظاهر،"], [1846.0, "وجميعِ مقتضياته التي يتعب الإنسان طيلةَ حياته في القيام بها،"], [1852.0, "شرطُ صحّتها سلامةُ القصد في توحيد المعبود،"], [1858.0, "فإنه لا بدّ أن ننبّه على هذا؛"], [1862.0, "ولذلك أفردتُها في كلّيّةٍ خاصّة."]], "tr": [[1842.0, "Madem ki ulûhiyyet tevhidinin zahirdeki sıhhatinin ve insanın bütün hayatı boyunca yerine getirmek için yorulduğu bütün gereklerinin sıhhat şartı, mabudu birlemedeki kastın sağlıklı olmasıdır;"], [1858.6, "buna mutlaka dikkat çekmemiz gerekir."], [1862.0, "Bu yüzden onu ayrı bir külliye olarak verdim."]]}]}, {"ts": "31:06", "title": "6. Külliye: Allah'tan başkasına ibadet eden hakikatte şeytana ibadet etmiştir", "paras": [{"reader": false, "ar": [[1866.0, "الكلّيّة التي بعدها: <b>كلُّ من عبد غيرَ الله فقد عبد الشيطانَ حقيقةً.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1866.0, "Ondan sonraki külliye: 6. külliye:"], [1868.6, "Allah'tan başkasına ibadet eden herkes, hakikatte şeytana ibadet etmiştir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1873.0, "أقول وبالله التوفيق: فمن عبد غيرَ الله ـ كائنًا ما كان من يعبده ـ فإنما حقيقتُه إنما هو يعبد الشيطان،"], [1893.0, "حتى وإن اختلفت صورُ المعبودات في الظاهر؛"], [1898.0, "سواءٌ أكانت من المعبودات السماويّة العُلويّة،"], [1902.0, "كالشمس والقمر والأفلاك وغيرها،"], [1904.7, "والملائكة وغيرهم؛ أو كانت من صور المعبودات السُّفليّة،"], [1909.6, "كالأصنام والأشجار والكهوف والمغارات،"], [1912.0, "والبقر والأشجار والأحجار، والأولياء والأنبياء والصالحين وغيرهم؛"], [1918.0, "كلُّ ذلك إنما هو عبادةٌ للشيطان حقيقةً."]], "tr": [[1873.0, "Tevfik Allah'tandır, derim ki: Allah'tan başkasına ibadet eden kimse —ibadet ettiği kim olursa olsun— hakikatte ancak şeytana ibadet etmektedir;"], [1893.7, "mabudların suretleri zahirde farklı olsa bile."], [1898.0, "İster güneş, ay, felekler ve benzerleri ile melekler ve benzerleri gibi semâvî, yukarı âlemden mabudlardan olsun;"], [1906.0, "ister putlar, ağaçlar, kovuklar, mağaralar, inekler, ağaçlar, taşlar, velîler, peygamberler, sâlihler ve benzerleri gibi aşağı âlemden mabud suretlerinden olsun;"], [1918.0, "bunların hepsi hakikatte şeytana ibadettir."]]}, {"reader": false, "ar": [[1923.0, "ولذلك قال الله عز وجل:"], [1925.3, "<span class=\"ayah\">﴿أَلَمْ أَعْهَدْ إِلَيْكُمْ يَا بَنِي آدَمَ أَن لَّا تَعْبُدُوا الشَّيْطَانَ ۖ إِنَّهُ لَكُمْ عَدُوٌّ مُّبِينٌ ۝ وَأَنِ اعْبُدُونِي ۚ هَٰذَا صِرَاطٌ مُّسْتَقِيمٌ﴾<\/span> <span class=\"ref\">[يس: ٦٠–٦١]<\/span>."], [1936.0, "وقال عز وجل عن إبراهيم في مجادلته لأبيه:"], [1940.0, "<span class=\"ayah\">﴿يَا أَبَتِ لَا تَعْبُدِ الشَّيْطَانَ﴾<\/span> <span class=\"ref\">[مريم: ٤٤]<\/span>،"], [1943.0, "مع أنّ أباه إنما كان يعبد الأشجارَ والأصنامَ والأحجارَ فقط،"], [1949.0, "فسمّى إبراهيمُ عليه الصلاة والسلام تلك العبادةَ عبادةً للشيطان:"], [1955.0, "<span class=\"ayah\">﴿يَا أَبَتِ لَا تَعْبُدِ الشَّيْطَانَ ۖ إِنَّ الشَّيْطَانَ كَانَ لِلرَّحْمَٰنِ عَصِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٤٤]<\/span>."]], "tr": [[1923.0, "Bu yüzden Allah Azze ve Celle şöyle buyurdu:"], [1925.3, "<span class=\"ayah\">﴿Ey Âdemoğulları! Ben size şeytana ibadet etmeyin, çünkü o sizin için apaçık bir düşmandır; Bana ibadet edin, bu dosdoğru yoldur, diye ahid vermedim mi?﴾<\/span> [Yâsîn 60–61]."], [1936.0, "Azze ve Celle, İbrâhim'in babasıyla tartışması hakkında şöyle buyurdu:"], [1940.0, "<span class=\"ayah\">﴿Babacığım! Şeytana ibadet etme﴾<\/span> [Meryem 44]."], [1943.6, "Oysa babası sadece ağaçlara, putlara ve taşlara ibadet ediyordu."], [1949.0, "İbrâhim aleyhissalâtu vesselâm bu ibadeti şeytana ibadet diye isimlendirdi:"], [1955.0, "<span class=\"ayah\">﴿Babacığım! Şeytana ibadet etme; çünkü şeytan Rahmân'a âsi olmuştur﴾<\/span> [Meryem 44]."]]}, {"reader": false, "ar": [[1962.0, "ويقول الله عز وجل:"], [1964.7, "<span class=\"ayah\">﴿وَيَوْمَ يَحْشُرُهُمْ جَمِيعًا ثُمَّ يَقُولُ لِلْمَلَائِكَةِ أَهَٰؤُلَاءِ إِيَّاكُمْ كَانُوا يَعْبُدُونَ﴾<\/span> <span class=\"ref\">[سبأ: ٤٠]<\/span>،"], [1973.0, "مع أنهم في الدنيا ـ نعم ـ كانوا يعبدون الملائكة،"], [1977.2, "ويستغيثون بهم، ويدعونهم، ويجعلونهم وسائطَ فيما بينهم وبين الله عز وجل."], [1983.0, "لكن إذا حُشر الناسُ يسأل اللهُ عز وجل الملائكةَ:"], [1987.7, "<span class=\"ayah\">﴿وَيَوْمَ يَحْشُرُهُمْ جَمِيعًا ثُمَّ يَقُولُ لِلْمَلَائِكَةِ أَهَٰؤُلَاءِ إِيَّاكُمْ كَانُوا يَعْبُدُونَ ۝ قَالُوا سُبْحَانَكَ أَنتَ وَلِيُّنَا مِن دُونِهِم ۖ بَلْ كَانُوا يَعْبُدُونَ الْجِنَّ﴾<\/span> <span class=\"ref\">[سبأ: ٤٠–٤١]<\/span>."]], "tr": [[1962.0, "Allah Azze ve Celle şöyle buyurur:"], [1964.7, "<span class=\"ayah\">﴿O gün (Allah) onların hepsini toplar, sonra meleklere: \"Bunlar size mi ibadet ediyorlardı?\" der﴾<\/span> [Sebe' 40]."], [1973.5, "Oysa onlar dünyada —evet— meleklere ibadet ediyor, onlardan yardım diliyor, onlara dua ediyor ve onları kendileriyle Allah Azze ve Celle arasında aracılar ediniyorlardı."], [1983.0, "Fakat insanlar toplandığında Allah Azze ve Celle meleklere sorar:"], [1986.2, "<span class=\"ayah\">﴿O gün onların hepsini toplar, sonra meleklere: \"Bunlar size mi ibadet ediyorlardı?\" der. (Melekler) derler ki: \"Sen münezzehsin! Bizim velimiz onlar değil, Sensin. Hayır, onlar cinlere ibadet ediyorlardı.\"﴾<\/span> [Sebe' 40–41]."]]}, {"reader": false, "ar": [[1998.0, "إذن كلُّ من عبد شيئًا غيرَ الله ـ وإن اختلفت صورُ المعبودات ـ فإنّ حقيقتَه أنه يعبد الشيطان."], [2011.0, "فإذا قلنا لمن يعبد القبورَ ويستغيث بها:"], [2014.5, "إنما تعبدون الشياطين، قالوا:"], [2016.7, "حسبكم، إنما نستشفع ونتوسّل بأولياء الله الصالحين."], [2024.0, "وما يفعلونه ويسمّونه استشفاعًا وتوسُّلًا إنما هو حقيقةُ عبادة الشيطان."]], "tr": [[1998.0, "O hâlde Allah'tan başka bir şeye ibadet eden herkes —mabudların suretleri farklı olsa bile— hakikatte şeytana ibadet etmektedir."], [2011.0, "Kabirlere ibadet eden ve onlardan yardım dileyene \"Siz ancak şeytanlara ibadet ediyorsunuz\" dediğimizde, \"Yeter!"], [2016.7, "Biz sadece Allah'ın sâlih velîleriyle şefaat diliyor ve tevessül ediyoruz\" derler."], [2024.0, "Oysa yaptıkları ve şefaat dileme ve tevessül diye isimlendirdikleri şey, hakikatte şeytana ibadetin ta kendisidir."]]}, {"reader": false, "ar": [[2032.0, "ولذلك يقول الله عز وجل:"], [2034.0, "<span class=\"ayah\">﴿إِن يَدْعُونَ مِن دُونِهِ إِلَّا إِنَاثًا وَإِن يَدْعُونَ إِلَّا شَيْطَانًا مَّرِيدًا ۝ لَّعَنَهُ اللَّهُ ۘ وَقَالَ لَأَتَّخِذَنَّ مِنْ عِبَادِكَ نَصِيبًا مَّفْرُوضًا﴾<\/span> <span class=\"ref\">[النساء: ١١٧–١١٨]<\/span>."], [2048.0, "ولذلك كلُّ الأمم يوم القيامة،"], [2052.0, "إذا وقف الشيطانُ خطيبًا في جهنّم،"], [2055.0, "كلُّهم يقولون: إنما كنّا نعبدك،"], [2061.0, "فيتبرّأ من عبادتهم، كما قال الله عز وجل:"], [2068.0, "<span class=\"ayah\">﴿إِنِّي كَفَرْتُ بِمَا أَشْرَكْتُمُونِ مِن قَبْلُ﴾<\/span> <span class=\"ref\">[إبراهيم: ٢٢]<\/span>؛"], [2072.0, "يعني: أنكم لم تكونوا تعبدونني."]], "tr": [[2032.0, "Bu yüzden Allah Azze ve Celle şöyle buyurur:"], [2034.0, "<span class=\"ayah\">﴿Onlar Allah'ı bırakıp sadece birtakım dişilere dua ediyorlar ve sadece inatçı bir şeytana dua ediyorlar. Allah ona lanet etmiştir. O da şöyle demişti: \"Andolsun, kullarından belirli bir pay alacağım.\"﴾<\/span> [Nisâ 117–118]."], [2048.0, "Bu yüzden kıyamet günü şeytan cehennemde hatip olarak durduğunda bütün ümmetler, hepsi \"Biz sadece sana ibadet ediyorduk\" derler."], [2056.6, "O da onların ibadetinden teberrî eder."], [2062.3, "Allah Azze ve Celle'nin buyurduğu gibi:"], [2068.0, "<span class=\"ayah\">﴿Daha önce beni (Allah'a) ortak koşmanızı ben inkâr etmiştim﴾<\/span> [İbrâhîm 22];"], [2072.0, "yani \"Siz bana ibadet etmiyordunuz\" (der)."]]}, {"reader": false, "ar": [[2075.6, "فيتبرّأ المعبودُ ـ عفوًا ـ فيتبرّأ المعبودُ من عابده،"], [2081.0, "كما قال الله عز وجل:"], [2083.0, "<span class=\"ayah\">﴿إِذْ تَبَرَّأَ الَّذِينَ اتُّبِعُوا مِنَ الَّذِينَ اتَّبَعُوا﴾<\/span> <span class=\"ref\">[البقرة: ١٦٦]<\/span>."], [2087.0, "فكلُّ من عبد الأشجارَ أو الأحجارَ أو الأولياءَ أو الأنبياءَ فهو عابدٌ للشيطان حقيقةً،"], [2094.0, "وإن اختلفت صورُ المعبودات. فانتبهوا لذلك."]], "tr": [[2075.6, "Mabud —affedersiniz— mabud kendisine ibadet edenden teberrî eder."], [2079.6, "Allah Azze ve Celle'nin buyurduğu gibi:"], [2083.0, "<span class=\"ayah\">﴿O zaman kendilerine uyulanlar, kendilerine uyanlardan teberrî ederler﴾<\/span> [Bakara 166]."], [2087.5, "Ağaçlara, taşlara, velîlere ya da peygamberlere ibadet eden herkes, mabudların suretleri farklı olsa da hakikatte şeytana ibadet edendir. Buna dikkat edin."]]}]}, {"ts": "34:57", "title": "7. Külliye: Tâğûtu inkâr etmeyenin tevhidi bozulmuştur", "paras": [{"reader": false, "ar": [[2097.0, "ومن الكلّيّات أيضًا: <b>كلُّ من لم يكفر بالطاغوت فمنتقضٌ توحيدُه<\/b> ـ فتوحيدُه منقوض،"], [2104.2, "أو: فمنتقضٌ توحيدُه ـ. <b>كلُّ من لم يكفر بالطاغوت فمنتقضٌ توحيدُه.<\/b> وهذه سوف نُطيل عندها قليلًا."]], "tr": [[2097.0, "Külliyelerden biri de şudur: 7."], [2098.8, "külliye: Tâğûtu inkâr etmeyen herkesin tevhidi bozulmuştur —\"tevhidi bozuktur\" ya da \"tevhidi bozulmuştur\"—."], [2106.0, "<b>7. külliye: Tâğûtu inkâr etmeyen herkesin tevhidi bozulmuştur.<\/b> Bunun üzerinde biraz uzunca duracağız."]]}, {"reader": false, "ar": [[2114.0, "أقول وبالله التوفيق: لقد اختلفت عباراتُ أهل العلم في تعريف الطاغوت،"], [2120.0, "ولكن بعد التمحيص والنظر وجدنا أنها من باب اختلاف التنوّع،"], [2124.7, "لا من باب اختلاف التضادّ؛"], [2127.0, "فإنّ كثيرًا من أهل العلم يذكر مثالًا على الطاغوت،"], [2132.1, "وفرعًا من فروع الطاغوتيّة فقط."], [2135.0, "ولذلك فأقربُ الأقوال التي تجمع جميعَ ما قيل في هذه الجزئيّة هو ما رُوي عن عمر بن الخطّاب وابن عبّاسٍ رضي الله عنهم،"], [2146.0, "ومن قال بقولهم: بأنّ الطاغوت هو الشيطان،"], [2150.0, "بأنّ الطاغوت هو الشيطان."]], "tr": [[2114.0, "Tevfik Allah'tandır, derim ki: İlim ehlinin tâğûtu tarif etmedeki ifadeleri farklı olmuştur."], [2120.0, "Fakat iyice inceleyip baktıktan sonra bunların tezat ihtilafı babından değil, çeşitlilik (tenevvü') ihtilafı babından olduğunu gördük."], [2127.0, "Çünkü ilim ehlinin birçoğu sadece tâğûta bir örnek ve tâğûtluğun dallarından bir dal zikreder."], [2135.0, "Bu yüzden bu konuda söylenenlerin hepsini toplayan en yakın görüş, Ömer b."], [2141.8, "el-Hattâb ve İbn Abbâs'tan —Allah onlardan razı olsun— ve onların görüşünü söyleyenlerden rivayet edilen şudur: Tâğût şeytandır; tâğût şeytandır."]]}, {"reader": false, "ar": [[2154.0, "فيمكن إرجاعُ أقوال السلف جميعًا في بيانهم لمعنى الطاغوتيّة إلى هذا المعنى العامّ،"], [2162.7, "وهو الشيطان؛ وذلك لأنّ الشيطان هو الداعي في الأصل إلى عبادة ما عُبد من دونه،"], [2174.0, "وأنّ عبادة ما دونه إنما هي عبادةٌ له،"], [2179.0, "وأنّ الكهّان والسحرة والشياطين ـ عفوًا ـ والسحرةَ والمشعوذين إنما يستمدّون معلوماتهم من الشياطين."], [2190.0, "والداعي إلى عبادة نفسه إنما هو شيطانٌ في مِسلاخ إنسان،"], [2196.1, "أمره الشيطانُ أن يدعو الناسَ إلى عبادة نفسه،"], [2201.0, "حتى إذا عبده الناس تكون عبادتُهم للشيطان حقيقةً."]], "tr": [[2154.0, "Selefin, tâğûtluğun anlamını açıklarken söylediği sözlerin hepsini bu genel anlama, yani şeytana döndürmek mümkündür."], [2166.0, "Çünkü O'nu (Allah'ı) bırakıp ibadet edilen şeylere ibadete davet eden aslında şeytandır;"], [2172.8, "O'nu bırakıp (başkasına) ibadet etmek de ancak ona (şeytana) ibadettir."], [2179.0, "Kâhinler, sihirbazlar ve şeytanlar —affedersiniz— sihirbazlar ve hokkabazlar bilgilerini ancak şeytanlardan alırlar."], [2190.0, "Kendisine ibadete çağıran kişi de ancak insan kılığına girmiş bir şeytandır;"], [2196.1, "şeytan ona insanları kendisine ibadete çağırmasını emretmiştir ki insanlar ona ibadet ettiğinde onların ibadeti hakikatte şeytana olsun."]]}, {"reader": false, "ar": [[2206.0, "وكلُّ من يدّعي علمَ الغيب ـ وإن وصفه العلماء بأنه طاغوت ـ إلا أنّ الذي يُملي عليه هذه الغيبيّات إنما هو الشيطان."], [2220.0, "فإذًا جميعُ ما ذكره العلماءُ في معنى الطاغوتيّة ورؤوسِهم الخمسة إنما يرجع إلى الرأس الأكبر،"], [2229.2, "والشيطان الأعظم، والطاغوت الأقذر <span class=\"q\">؟ 37:06<\/span>،"], [2231.8, "وهو إبليس عليه لعنة الله؛ هذا هو الطاغوت."]], "tr": [[2206.0, "Gayb ilmini iddia eden herkes de —âlimler onu tâğût diye nitelemiş olsa da— ona bu gaybî şeyleri yazdıran ancak şeytandır."], [2220.0, "O hâlde âlimlerin tâğûtluğun anlamı ve onların beş başı hakkında zikrettiği her şey, en büyük başa, en büyük şeytana ve en pis <span class=\"q\">؟<\/span> tâğûta döner;"], [2231.1, "o da İblis'tir, Allah'ın laneti onun üzerine olsun. İşte tâğût budur."]]}, {"reader": false, "ar": [[2238.0, "فيجب علينا ـ إذا أردنا أن يكون توحيدُنا صحيحًا ـ أن نكفر بالطاغوت،"], [2245.4, "وجميعِ مظاهر الطاغوتيّة التي هو أصلُها ومرجعُها والداعي إليها."], [2252.0, "فالشيطانُ اللعين هو أصلُ كلِّ طغيانٍ في الأرض؛"], [2257.0, "فكلُّ من طغى وتجاوز حدَّه فإنما ذلك لأنّ الشيطان إمامُه وقائدُه ومعينُه."], [2266.0, "فمن الشيطان يستمدّ الكافرُ كفرَه،"], [2269.5, "والمشركُ شركَه، والمبتدعُ بدعتَه،"], [2272.2, "والطاغي طغيانَه، والضالُّ ضلالَه،"], [2277.7, "والباهتُ بهتانَه؛ فكان الشيطانُ حقيقةً هو من يمدّ كلَّ هؤلاء."], [2286.0, "فأصلُ الطاغوتيّة ـ بلا نزاع ـ مرجعُها إلى الطاغوت الأكبر، وهو الشيطان."]], "tr": [[2238.0, "Tevhidimizin sahih olmasını istiyorsak, tâğûtu ve onun aslı, dönüş yeri ve davetçisi olduğu tâğûtluğun bütün görünümlerini inkâr etmemiz vaciptir."], [2252.0, "Lanetli şeytan, yeryüzündeki her azgınlığın aslıdır."], [2255.1, "Azan ve haddini aşan herkes, ancak şeytan onun imamı, önderi ve yardımcısı olduğu için böyledir."], [2266.0, "Kâfir küfrünü, müşrik şirkini, bid'atçi bid'atini, azgın azgınlığını, sapık sapıklığını, iftiracı iftirasını şeytandan alır."], [2282.0, "Hakikatte bunların hepsine yardım eden şeytandır."], [2286.0, "Tâğûtluğun aslı —tartışmasız— en büyük tâğûta, yani şeytana döner."]]}, {"reader": false, "ar": [[2294.0, "ولذلك يقول الإمامُ ابنُ عطيّة رحمه الله تعالى،"], [2298.0, "معقّبًا على الأقوال التي قيلت في معنى الطاغوت،"], [2302.0, "قال: «وبيِّنٌ أنّ هذه أمثلةٌ في الطاغوت، لأنّ واحدًا ـ نعم ـ ولكن لأنّ واحدًا منها ترجع إليه معنى الطاغوتيّة <span class=\"q\">؟ 38:31<\/span>، صار الشيطانُ هو الطاغوت». انتهى كلامه."]], "tr": [[2294.0, "Bu yüzden İmam İbn Atıyye —Allah ona rahmet etsin— tâğûtun anlamı hakkında söylenen görüşlere yorum yaparak şöyle der:"], [2302.7, "\"Açıktır ki bunlar tâğût hakkında örneklerdir;"], [2307.6, "çünkü biri —evet— ama tâğûtluk anlamı onlardan birine döndüğü için <span class=\"q\">؟<\/span> şeytan tâğût olmuştur.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2324.0, "ويقول الإمامُ المجدّد رحمه الله تعالى:"], [2326.6, "«واعلم أنّ الإنسان ما يصير مؤمنًا» ـ هكذا عبّر ـ «واعلم أنّ الإنسان ما يصير مؤمنًا بالله عز وجل إلا إذا كفر بالطاغوت»."], [2340.0, "فإذًا لا يصحّ توحيدُ الإنسان إلا إذا كفر بالطاغوت،"], [2346.0, "وقد دلّت على ذلك الأدلّةُ الكثيرة؛"], [2349.0, "منها قولُ الله عز وجل:"], [2352.0, "<span class=\"ayah\">﴿فَمَن يَكْفُرْ بِالطَّاغُوتِ وَيُؤْمِن بِاللَّهِ فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٦]<\/span>،"], [2360.4, "ويقول الله عز وجل:"], [2362.0, "<span class=\"ayah\">﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾<\/span> <span class=\"ref\">[النحل: ٣٦]<\/span>."]], "tr": [[2324.0, "İmam el-Müceddid —Allah ona rahmet etsin— şöyle der:"], [2326.6, "\"Bil ki insan mümin olmaz\" —böyle ifade etti— \"Bil ki insan tâğûtu inkâr etmedikçe Allah Azze ve Celle'ye iman etmiş olmaz.\" O hâlde insanın tevhidi, tâğûtu inkâr etmedikçe sahih olmaz."], [2340.0, "Buna birçok delil delâlet etmiştir."], [2343.3, "Bunlardan biri Allah Azze ve Celle'nin şu sözüdür:"], [2349.0, "<span class=\"ayah\">﴿Kim tâğûtu inkâr edip Allah'a iman ederse, kopması mümkün olmayan en sağlam kulpa yapışmıştır﴾<\/span> [Bakara 256]."], [2358.7, "Allah Azze ve Celle şöyle buyurur:"], [2362.0, "<span class=\"ayah\">﴿Andolsun, Biz her ümmete \"Allah'a ibadet edin ve tâğûttan kaçının\" diye bir resul gönderdik﴾<\/span> [Nahl 36]."]]}, {"reader": false, "ar": [[2369.0, "ويقول الله عز وجل:"], [2370.0, "<span class=\"ayah\">﴿وَالَّذِينَ اجْتَنَبُوا الطَّاغُوتَ أَن يَعْبُدُوهَا وَأَنَابُوا إِلَى اللَّهِ لَهُمُ الْبُشْرَىٰ ۚ فَبَشِّرْ عِبَادِ﴾<\/span> <span class=\"ref\">[الزمر: ١٧]<\/span>؛"], [2378.0, "فالذين لم يجتنبوا الطاغوتَ وعبدوها فليست لهم البشرى،"], [2380.9, "لا في الدنيا ولا في الآخرة."], [2383.0, "ويقول الله عز وجل:"], [2384.9, "<span class=\"ayah\">﴿أَلَمْ تَرَ إِلَى الَّذِينَ أُوتُوا نَصِيبًا مِّنَ الْكِتَابِ يُؤْمِنُونَ بِالْجِبْتِ وَالطَّاغُوتِ﴾<\/span> <span class=\"ref\">[النساء: ٥١]<\/span>،"], [2390.1, "والطاغوتُ: الشيطان. وقال صلى الله عليه وسلم:"], [2394.2, "«من قال: لا إله إلا الله، وكفر بما يُعبد من دون الله، حرُم مالُه ودمُه، وحسابُه على الله» <span class=\"note\">(Müslim)<\/span> عز وجل."]], "tr": [[2369.0, "Allah Azze ve Celle şöyle buyurur:"], [2370.0, "<span class=\"ayah\">﴿Tâğûta ibadet etmekten kaçınan ve Allah'a yönelenler için müjde vardır. O hâlde kullarımı müjdele﴾<\/span> [Zümer 17]."], [2378.0, "Tâğûttan kaçınmayan ve ona ibadet edenler için ise ne dünyada ne de âhirette müjde yoktur."], [2383.0, "Allah Azze ve Celle şöyle buyurur:"], [2384.9, "<span class=\"ayah\">﴿Kendilerine Kitap'tan bir pay verilenleri görmedin mi? Cibt'e ve tâğûta inanıyorlar﴾<\/span> [Nisâ 51]."], [2390.5, "Tâğût şeytandır. Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2394.2, "\"Kim 'Lâ ilâhe illallah' der ve Allah'ı bırakıp ibadet edilen şeyleri inkâr ederse, malı ve kanı haram (dokunulmaz) olur;"], [2403.2, "hesabı da Allah Azze ve Celle'ye kalmıştır.\""]]}]}, {"ts": "40:07", "title": "7. Külliye (devam): Tâğûtu itikat, söz ve amel ile inkâr etmek", "paras": [{"reader": false, "ar": [[2407.0, "فإن قلتَ: وكيف يكون الكفرُ بالطاغوت؟"], [2408.9, "كيف يكون الكفرُ بالطاغوت؟"], [2411.1, "كيف أعرف من نفسي أنني كافرٌ بالطاغوت؟"], [2418.0, "فأقول: لقد بيّن العلماءُ أنّ كيفيّة الكفر بالطاغوت مبنيٌّ على ثلاثة أشياء:"], [2426.0, "أن تكفر بالطاغوت اعتقادًا،"], [2428.7, "وأن تكفر بالطاغوت قولًا،"], [2431.5, "وأن تكفر بالطاغوت عملًا."]], "tr": [[2407.0, "Eğer \"Tâğûtu inkâr etmek nasıl olur?"], [2408.9, "Tâğûtu inkâr etmek nasıl olur?"], [2411.1, "Tâğûtu inkâr ettiğimi kendimden nasıl bilirim?\" dersen, derim ki:"], [2418.0, "Âlimler, tâğûtu inkâr etmenin keyfiyetinin üç şeye dayandığını açıklamışlardır:"], [2423.3, "Tâğûtu itikat olarak inkâr etmen, tâğûtu söz olarak inkâr etmen ve tâğûtu amel olarak inkâr etmen."]]}, {"reader": false, "ar": [[2437.0, "وتفصيلُ ذلك أن نقول:"], [2439.0, "يجب على المكلَّف أن يعتقد بطلانَ جميع الآلهة والمعبودات من دون الله عز وجل،"], [2446.0, "وأنها لا تملك لا خيرًا ولا شرًّا،"], [2449.2, "ولا نصرًا ولا عزًّا،"], [2451.0, "وعليه أن يوقن ببطلان كلِّ عبادةٍ صُرفت لغير الله عز وجل."], [2457.0, "هذا أوّلُ معنًى من معاني الكفر بالطاغوت،"], [2461.7, "وهو الكفرُ بالمعبودات من دون الله ومن يعبدها."], [2467.0, "ويدخل في ذلك أيضًا وجوبُ البراءة من كلّ المشركين؛"], [2475.0, "فإنّ الولاءَ والبراءَ أصلُ الدين وقِوامُه وركنُه الأعظم."]], "tr": [[2437.0, "Bunun tafsilatı şöyledir: Mükellefin, Allah Azze ve Celle'yi bırakıp (tapılan) bütün ilâhların ve mabudların bâtıl olduğuna, onların ne bir hayra ne bir şerre, ne bir yardıma ne de bir izzete sahip olduğuna inanması vaciptir."], [2449.6, "Allah Azze ve Celle'den başkasına yöneltilen her ibadetin bâtıl olduğuna kesin olarak inanması da onun üzerine (vacip)tir."], [2457.0, "Bu, tâğûtu inkâr etmenin anlamlarından ilkidir;"], [2459.7, "o da Allah'ı bırakıp (ibadet edilen) mabudları ve onlara ibadet edenleri inkâr etmektir."], [2467.0, "Bütün müşriklerden berî olmanın vacip oluşu da buna girer."], [2471.3, "Çünkü velâ ve berâ, dinin aslı, ayakta durduğu şey ve en büyük rüknüdür."]]}, {"reader": false, "ar": [[2483.0, "كما قال الله عز وجل عن إبراهيم أنه قال لقومه:"], [2489.0, "<span class=\"ayah\">﴿إِنَّا بُرَآءُ مِنكُمْ وَمِمَّا تَعْبُدُونَ مِن دُونِ اللَّهِ كَفَرْنَا بِكُمْ وَبَدَا بَيْنَنَا وَبَيْنَكُمُ الْعَدَاوَةُ وَالْبَغْضَاءُ أَبَدًا حَتَّىٰ تُؤْمِنُوا بِاللَّهِ وَحْدَهُ﴾<\/span> <span class=\"ref\">[الممتحنة: ٤]<\/span>."], [2501.0, "وكذلك أيضًا لا بدّ مع الكفر بالطاغوت باطنًا أن نكفر بالطاغوت ظاهرًا؛"], [2511.0, "وذلك بأن نصرّح بألسنتنا ببطلان هذه المعبودات،"], [2519.0, "ونفيِ صحّة عبادتها نفيًا قاطعًا حاسمًا،"], [2524.0, "وأنّ هذه المعبودات ليس لها أدنى مثقالِ ذرّةٍ من الحقّ،"], [2529.0, "وأنها إنما عُبدت بالظلم والشرك والكفر والعناد والطغيان والبغي."]], "tr": [[2483.0, "Allah Azze ve Celle'nin İbrâhim hakkında, onun kavmine şöyle dediğini bildirdiği gibi:"], [2489.0, "<span class=\"ayah\">﴿Biz sizden ve Allah'ı bırakıp ibadet ettiğiniz şeylerden uzağız. Sizi inkâr ettik. Siz bir tek Allah'a iman edinceye kadar bizimle sizin aranızda ebedî bir düşmanlık ve kin baş göstermiştir﴾<\/span> [Mümtehine 4]."], [2502.4, "Aynı şekilde tâğûtu içten inkâr etmekle birlikte tâğûtu dıştan da inkâr etmemiz zorunludur."], [2511.0, "Bu da dillerimizle bu mabudların bâtıl olduğunu açıkça söylememiz, onlara ibadetin sahih olduğunu kesin ve kat'î bir şekilde reddetmemiz, bu mabudların zerre ağırlığınca bile haklılık payı olmadığını ve onlara ancak zulüm, şirk, küfür, inat, azgınlık ve haddi aşma ile ibadet edildiğini (söylememiz) ile olur."]]}, {"reader": false, "ar": [[2537.0, "لا بدّ أن نصرّح في مجالسنا،"], [2540.8, "وفي خطبنا، وأمام
