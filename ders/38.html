طلابنا وزملائنا؛"], [2544.0, "لا بدّ أن نكفر بالطاغوت بألسنتنا."], [2546.0, "فلو أنّ الإنسان كفر بالطاغوت بقلبه،"], [2549.0, "ولكن أبى أن يكفر به بلسانه،"], [2552.0, "فليس بمؤمن؛ لا بدّ من نطق اللسان،"], [2556.0, "لا سيّما مع السَّعة والاختيار وعدم الإكراه."]], "tr": [[2537.0, "Meclislerimizde, hutbelerimizde, talebelerimizin ve meslektaşlarımızın önünde açıkça söylememiz zorunludur;"], [2544.0, "tâğûtu dillerimizle inkâr etmemiz zorunludur."], [2546.0, "İnsan tâğûtu kalbiyle inkâr etse ama diliyle inkâr etmeyi reddetse mümin değildir."], [2553.0, "Dil ile söylemek zorunludur; hele imkân, serbestlik (ihtiyar) ve zorlamanın olmadığı durumda."]]}, {"reader": false, "ar": [[2562.0, "وكذلك أيضًا نكفر بالطاغوت بأعمالنا؛"], [2565.4, "فلا نعمل بجوارحنا ما يقتضي شيئًا من معاني الطاغوتيّة."], [2572.0, "نكفر بالطاغوت بجوارحنا، فلا نعمل بجوارحنا شيئًا من مقتضيات الطاغوتيّة."], [2583.0, "فنجتنب السحرَ؛ لأنّ السحر عملٌ طاغوتيّ."], [2590.0, "ونجتنب الكهانةَ؛ لأنّ الكهانة عملٌ طاغوتيّ."], [2594.0, "بل ونجتنب المجيءَ إلى السحرة والكهّان؛"], [2598.0, "لأنّ المجيء إليهم وتصديقَهم عملٌ طاغوتيّ."], [2602.0, "ونجتنب تعظيمَ الأوثان؛ لأنّ تعظيمها من أعمال الطواغيت."]], "tr": [[2562.0, "Aynı şekilde tâğûtu amellerimizle de inkâr ederiz;"], [2565.4, "azalarımızla tâğûtluğun anlamlarından bir şeyi gerektiren bir şey yapmayız."], [2572.0, "Tâğûtu azalarımızla inkâr ederiz; azalarımızla tâğûtluğun gereklerinden hiçbir şey yapmayız."], [2583.0, "Sihirden kaçınırız; çünkü sihir tâğûtî bir ameldir."], [2590.0, "Kâhinlikten kaçınırız; çünkü kâhinlik tâğûtî bir ameldir."], [2594.0, "Hatta sihirbazlara ve kâhinlere gitmekten de kaçınırız;"], [2598.0, "çünkü onlara gitmek ve onları tasdik etmek tâğûtî bir ameldir."], [2602.0, "Putları tazim etmekten kaçınırız; çünkü onları tazim etmek tâğûtların amellerindendir."]]}, {"reader": false, "ar": [[2611.0, "بل ويجب علينا ـ إذا قدرنا ـ أن نزيل هذه الأوثانَ بأيدينا،"], [2616.6, "من غير مفسدةٍ خالصةٍ أو راجحة؛"], [2620.0, "فإننا نزيلها كما أزالها النبيُّ صلى الله عليه وسلم بيديه من حول الكعبة،"], [2629.0, "وصار يضربها في رؤوسها ويقلبها على وجوهها."]], "tr": [[2611.0, "Hatta gücümüz yettiğinde, halis ya da ağır basan bir mefsedet olmaksızın bu putları ellerimizle gidermemiz de vaciptir."], [2620.0, "Peygamber sallallâhu aleyhi ve sellem'in onları Kâbe'nin çevresinden elleriyle giderdiği gibi biz de onları gideririz."], [2629.0, "O, onların başlarına vuruyor ve onları yüzüstü deviriyordu."]]}, {"reader": false, "ar": [[2636.0, "يقول الإمامُ المجدّد رحمه الله تعالى:"], [2641.0, "«فأمّا صفةُ الكفر بالطاغوت فهو أن يعتقد بطلانَ عبادة غير الله عز وجل، وأن يتركها، وأن يبغضها، وأن يكفّر أهلَها ويعاديهم»."], [2654.0, "ويقول رحمه الله تعالى:"], [2658.0, "«ومعنى الكفر بالطاغوت: أن تبرأ من كلّ ما يُعتقد فيه غيرِ الله عز وجل، من جنّيٍّ أو إنسيٍّ أو شجرٍ أو حجرٍ أو غير ذلك، وتشهدَ ـ شوف يا… انتهى من القلب <span class=\"q\">؟ 44:31<\/span> ـ قال: وتشهدَ عليه بالكفر والضلال، وتبغضَه ولو كان أنه أبوك أو أخوك»."]], "tr": [[2636.0, "İmam el-Müceddid —Allah ona rahmet etsin— şöyle der:"], [2641.0, "\"Tâğûtu inkâr etmenin sıfatına gelince, o, Allah Azze ve Celle'den başkasına ibadetin bâtıl olduğuna inanması, onu terk etmesi, ona buğzetmesi, ehlini tekfir etmesi ve onlara düşmanlık etmesidir.\" Yine —Allah ona rahmet etsin— şöyle der:"], [2658.0, "\"Tâğûtu inkâr etmenin anlamı şudur:"], [2660.0, "Cin, insan, ağaç, taş ya da başka bir şey olsun, Allah Azze ve Celle'den başka hakkında (ilâhlık) inancı beslenen her şeyden berî olman ve şahitlik etmen\" —bak ey… (bu kısım) kalple ilgili olan bitti <span class=\"q\">؟<\/span>— dedi ki:"], [2672.3, "\"onun küfür ve sapıklık üzere olduğuna şahitlik etmen ve o, baban ya da kardeşin olsa bile ona buğzetmendir.\""]]}, {"reader": false, "ar": [[2681.0, "ويقول الشيخ سليمانُ بنُ عبد الله رحمه الله تعالى:"], [2684.0, "«ومعنى الكفر بالطاغوت هو خلعُ الأنداد والآلهة التي تُدعى من دون الله من القلب، وتركُ الشرك بها رأسًا، وبغضُه وعداوتُه»."], [2694.0, "وقال رحمه الله تعالى:"], [2696.8, "«ويدخل في الكفر بالطاغوت بغضُه وكراهتُه، وعدمُ الرضا بعبادته بوجهٍ من الوجوه»."]], "tr": [[2681.0, "Şeyh Süleymân b. Abdillâh —Allah ona rahmet etsin— şöyle der:"], [2684.0, "\"Tâğûtu inkâr etmenin anlamı, Allah'ı bırakıp dua edilen denkleri ve ilâhları kalpten söküp atmak, onlarla şirki tamamen terk etmek, ona buğzetmek ve ona düşmanlık etmektir.\" Yine —Allah ona rahmet etsin— şöyle demiştir:"], [2696.8, "\"Tâğûta buğzetmek, onu çirkin görmek ve ona ibadete hiçbir şekilde razı olmamak da tâğûtu inkâra girer.\""]]}, {"reader": false, "ar": [[2706.0, "ويقول الشيخ عبدُ اللطيف بنُ عبد الرحمن بن حسن ـ رحم اللهُ الجميعَ رحمةً واسعة ـ:"], [2711.0, "«بل لا بدّ من الكفر بما عُبد من دون الله، والكفرُ فيه بغضُه وتركُه وردُّه والبراءةُ منه ومعرفةُ بطلانه، وهذا لا بدّ منه في الإسلام، كما قال الله عز وجل: <span class=\"ayah\">﴿فَمَن يَكْفُرْ بِالطَّاغُوتِ وَيُؤْمِن بِاللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٦]<\/span>»."]], "tr": [[2706.0, "Şeyh Abdüllatîf b. Abdirrahmân b."], [2707.0, "Hasan —Allah hepsine geniş rahmetiyle rahmet etsin— şöyle der:"], [2708.5, "\"Bilakis Allah'ı bırakıp ibadet edilen şeyi inkâr etmek zorunludur."], [2711.0, "Onu inkâr etmek; ona buğzetmek, onu terk etmek, onu reddetmek, ondan berî olmak ve onun bâtıl olduğunu bilmektir."], [2719.2, "Bu, İslâm'da zorunludur. Allah Azze ve Celle'nin buyurduğu gibi:"], [2724.4, "<span class=\"ayah\">﴿Kim tâğûtu inkâr edip Allah'a iman ederse﴾<\/span> [Bakara 256].\""]]}, {"reader": false, "ar": [[2728.0, "وبيّن الشيخ سليمانُ بنُ سحمان كيفيّةَ الكفر بالطاغوت في كلامٍ جميلٍ له تحت قول الله عز وجل:"], [2737.0, "<span class=\"ayah\">﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾<\/span> <span class=\"ref\">[النحل: ٣٦]<\/span>،"], [2741.0, "وتحت قوله عز وجل:"], [2742.8, "<span class=\"ayah\">﴿وَالَّذِينَ اجْتَنَبُوا الطَّاغُوتَ أَن يَعْبُدُوهَا﴾<\/span> <span class=\"ref\">[الزمر: ١٧]<\/span>،"], [2745.0, "قال: «ففي هذه الآيات من الحجج على وجوب اجتنابه وجوهٌ كثيرة، والمرادُ من اجتنابه: بغضُه، وعداوتُه بالقلب، وسبُّه وتقبيحُه باللسان، وإزالتُه باليد عند القدرة، ومفارقتُه. فمن ادّعى اجتنابَ الطاغوت ولم يفعل ذلك فما صدق»."], [2765.0, "انتهى كلامه رحمه الله تعالى، انتهى كلامه."]], "tr": [[2728.0, "Şeyh Süleymân b. Sehmân, tâğûtu inkâr etmenin keyfiyetini Allah Azze ve Celle'nin <span class=\"ayah\">﴿Andolsun, Biz her ümmete \"Allah'a ibadet edin ve tâğûttan kaçının\" diye bir resul gönderdik﴾<\/span> [Nahl 36] sözü ve Azze ve Celle'nin <span class=\"ayah\">﴿Tâğûta ibadet etmekten kaçınanlar﴾<\/span> [Zümer 17] sözü altında güzel bir ifadesinde açıklamıştır."], [2742.8, "Şöyle demiştir: \"Bu ayetlerde ondan kaçınmanın vacip olduğuna dair birçok delil yönü vardır."], [2745.4, "Ondan kaçınmaktan maksat; ona buğzetmek, kalple ona düşmanlık etmek, dil ile ona sövmek ve onu çirkin göstermek, güç yetince el ile onu gidermek ve ondan ayrılmaktır."], [2759.4, "Kim tâğûttan kaçındığını iddia eder de bunu yapmazsa doğru söylememiştir.\" Onun —Allah ona rahmet etsin— sözü burada bitti; sözü burada bitti."]]}]}, {"ts": "46:11", "title": "8. Külliye: Kendisine ibadete çağıran ya da razı olarak kendisine ibadet edilen tâğûttur", "paras": [{"reader": false, "ar": [[2771.0, "ومن الكلّيّات أيضًا، ولعلّها الأخيرة:"], [2776.0, "كلُّ من دعا لعبادة نفسه،"], [2779.5, "أو عُبد وهو راضٍ،"], [2782.3, "فطاغوت. <span class=\"note\">(يكررها)<\/span> كم رقمُها عندكم؟"]], "tr": [[2771.0, "Külliyelerden biri de şudur, belki de sonuncusudur:"], [2776.0, "<b>8. külliye: Kendisine ibadete çağıran ya da razı olduğu hâlde kendisine ibadet edilen herkes tâğûttur.<\/b> (Tekrar ediyor.) Sizde numarası kaç?"]]}, {"reader": false, "ar": [[2804.0, "وعلى هذا تقريرُ شيخ الإسلام المجدّد محمد بن عبد الوهّاب رحمه الله تعالى."], [2810.0, "فإذا كان الإنسانُ يدعو إلى عبادة نفسه من دون الله عز وجل،"], [2814.0, "أو يصف نفسه بما لا يجوز وصفُ المخلوق به،"], [2818.0, "فيجعل لنفسه ضرًّا استقلاليًّا،"], [2820.5, "ويصف نفسه بالنفع الاستقلاليّ،"], [2823.0, "ويصف نفسه بأنّ له منزلةً عند الله عز وجل عظيمةً يستجيب بها دعاءَ من دعاه واستغاثةَ من استغاثه،"], [2832.0, "أو دعا الناسَ إلى دعائه والاستغاثة به من دون الله،"], [2837.0, "فإنه لا جرمَ أنه طاغوت؛"], [2840.0, "سواءٌ قبل الناسُ دعوتَه أو لم يقبلوا دعوتَه،"], [2845.0, "سواءٌ صدّقوه أو كذّبوه."], [2847.0, "فبمجرّد أنه دعا أو ادّعى لنفسه شيئًا من ذلك فإنه يُعتبر طاغوتًا."]], "tr": [[2804.0, "Şeyhülislâm el-Müceddid Muhammed b. Abdilvehhâb'ın —Allah ona rahmet etsin— takriri de bu yöndedir."], [2810.0, "İnsan, Allah Azze ve Celle'yi bırakıp kendisine ibadete çağırıyorsa ya da kendisini bir mahlûkun nitelenmesi caiz olmayan şeyle niteliyorsa —kendisine müstakil bir zarar (verme gücü) atfediyor, kendisini müstakil fayda (verme gücü) ile niteliyor, kendisini Allah Azze ve Celle katında, kendisine dua edenin duasına ve kendisinden yardım dileyenin istiğasesine onunla icabet ettiği büyük bir konumu olduğu şeklinde niteliyorsa— ya da insanları Allah'ı bırakıp kendisine dua etmeye ve kendisinden yardım dilemeye çağırıyorsa, şüphesiz o bir tâğûttur."], [2840.0, "İnsanlar onun davetini ister kabul etsin ister etmesin;"], [2843.8, "ister onu tasdik etsinler ister yalanlasınlar."], [2847.0, "Sırf bunlardan bir şeye davet ettiği ya da kendisi için böyle bir şey iddia ettiği için tâğût sayılır."]]}, {"reader": false, "ar": [[2853.0, "وكذلك من رأى الناسَ يُقبلون على صرف العبادة له،"], [2858.0, "فرآهم يسجدون له، ويركعون له،"], [2860.2, "ويدعونه من دون الله،"], [2862.0, "وسكت ورضي، فإنه كذلك طاغوت."], [2866.0, "وقد مرّ على هذه الدنيا طواغيتُ كُثُر،"], [2869.0, "ولكنّ أعظمَهم طاغوتان بعد الشيطان ـ عفوًا ـ أعظمُهم ثلاثة،"], [2873.4, "أعظمُهم ثلاثة: الأوّل: الدجّال،"], [2875.4, "وهو آخرُ هذه الطواغيت التي ستخرج مدّعيةً للألوهية؛"], [2890.0, "فإنه يزعم أنه ربُّ السماوات والأرض،"], [2894.2, "وأنه من يحيي الموتى،"], [2897.0, "وأنه من يُوجد من العدم،"], [2899.7, "وأنه من يُغني ويُفقر ويضرّ وينفع،"], [2903.0, "ويأمر السماءَ أن تُمطر،"], [2904.7, "ويملك الجنّة والنار. وهذا من أعظم الطواغيت والعياذُ بالله،"], [2909.3, "نسأل اللهَ ألّا ندرك فتنتَه."]], "tr": [[2853.0, "Aynı şekilde insanların ibadeti kendisine yöneltmeye koştuğunu gören, onların kendisine secde ettiğini, rükû ettiğini ve Allah'ı bırakıp kendisine dua ettiğini görüp de susan ve razı olan kimse de tâğûttur."], [2866.0, "Bu dünyadan birçok tâğût gelip geçmiştir."], [2867.7, "Ama şeytandan sonra onların en büyüğü iki tâğûttur —affedersiniz— en büyükleri üçtür, en büyükleri üçtür:"], [2874.0, "Birincisi Deccâl'dir. O, ulûhiyyet iddiasıyla çıkacak olan bu tâğûtların sonuncusudur."], [2890.0, "O, göklerin ve yerin Rabbi olduğunu, ölüleri dirilttiğini, yoktan var ettiğini, zengin ettiğini, fakir düşürdüğünü, zarar ve fayda verdiğini iddia eder;"], [2901.4, "göğe yağmur yağdırmasını emreder; cennete ve cehenneme sahip olduğunu (iddia eder)."], [2906.0, "Allah'a sığınırız, bu, tâğûtların en büyüklerindendir."], [2909.3, "Allah'tan onun fitnesine yetişmememizi dileriz."]]}, {"reader": false, "ar": [[2912.0, "ومنهم فرعون؛ فإنه قال:"], [2914.8, "<span class=\"ayah\">﴿مَا عَلِمْتُ لَكُم مِّنْ إِلَٰهٍ غَيْرِي﴾<\/span> <span class=\"ref\">[القصص: ٣٨]<\/span>،"], [2920.0, "وقال أيضًا: <span class=\"ayah\">﴿أَنَا رَبُّكُمُ الْأَعْلَىٰ﴾<\/span> <span class=\"ref\">[النازعات: ٢٤]<\/span>،"], [2922.8, "ودعا الناسَ إلى عبادته."], [2925.0, "ومنهم كذلك النمرود؛ فإنه دعا الناسَ إلى عبادته من دون الله عز وجل،"], [2934.0, "ووصف نفسه بأنه يحيي ويميت،"], [2936.5, "كما قال الله عز وجل عن إبراهيم:"], [2940.0, "<span class=\"ayah\">﴿أَلَمْ تَرَ إِلَى الَّذِي حَاجَّ إِبْرَاهِيمَ فِي رَبِّهِ أَنْ آتَاهُ اللَّهُ الْمُلْكَ إِذْ قَالَ إِبْرَاهِيمُ رَبِّيَ الَّذِي يُحْيِي وَيُمِيتُ قَالَ أَنَا أُحْيِي وَأُمِيتُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٨]<\/span>."]], "tr": [[2912.0, "Onlardan biri Firavun'dur. O şöyle demiştir:"], [2914.8, "<span class=\"ayah\">﴿Sizin için benden başka bir ilâh bilmiyorum﴾<\/span> [Kasas 38]."], [2921.1, "Yine şöyle demiştir: <span class=\"ayah\">﴿Ben sizin en yüce Rabbinizim﴾<\/span> [Nâziât 24] ve insanları kendisine ibadete çağırmıştır."], [2927.0, "Onlardan biri de Nemrud'dur. O, insanları Allah Azze ve Celle'yi bırakıp kendisine ibadete çağırmış ve kendisini dirilttiği ve öldürdüğü şeklinde nitelemiştir."], [2936.5, "Allah Azze ve Celle'nin İbrâhim hakkında buyurduğu gibi:"], [2940.0, "<span class=\"ayah\">﴿Allah kendisine mülk verdi diye Rabbi hakkında İbrâhim ile tartışanı görmedin mi? Hani İbrâhim \"Benim Rabbim dirilten ve öldürendir\" demişti; o da \"Ben de diriltir ve öldürürüm\" demişti﴾<\/span> [Bakara 258]."]]}, {"reader": false, "ar": [[2952.0, "ومنهم كذلك من يُسمّى بالحاكم بأمر الله الفاطميّ؛"], [2958.0, "فإنّ حاشيتَه سوّلوا له أنه اللهُ الذي لا إله إلا هو،"], [2964.0, "فصدّق نفسه، فادّعى الربوبيةَ والألوهية،"], [2968.0, "وصار يدعو الناسَ إلى عبادته."], [2970.0, "ولا تزال الدروزُ إلى الآن تعتقد أنّ الله قد تجسّد في جسد الحاكم بأمر الله."], [2979.0, "ومنهم كذلك أقطابُ الصوفية الذين يرون مريديهم يعبدونهم من دون الله،"], [2985.3, "ويدعونهم، ويتبرّكون بهم، ويتمسّحون بعَرَقهم ونُخامتهم،"], [2989.1, "ويقبّلون أيديَهم، ويتمسّحون بهم،"], [2991.9, "ويطلبون البركةَ منهم، وهم راضون ولا يُنكرون،"], [2998.0, "بل ويركعون ويسجدون لهم؛"], [3001.0, "فهؤلاء لا جرمَ أنهم طواغيت."]], "tr": [[2952.0, "Onlardan biri de el-Hâkim bi-emrillâh el-Fâtımî diye isimlendirilen kişidir."], [2958.0, "Çevresi ona, kendisinin kendisinden başka ilâh olmayan Allah olduğunu telkin etti;"], [2962.8, "o da kendini tasdik etti, rubûbiyyet ve ulûhiyyet iddia etti ve insanları kendisine ibadete çağırmaya başladı."], [2970.0, "Dürzîler hâlâ, Allah'ın el-Hâkim bi-emrillâh'ın bedeninde cisimleştiğine inanmaktadır."], [2979.0, "Onlardan biri de, müritlerinin Allah'ı bırakıp kendilerine ibadet ettiklerini, kendilerine dua ettiklerini, kendileriyle teberrük ettiklerini, terlerine ve balgamlarına sürünüp (teberrük ettiklerini), ellerini öptüklerini, kendilerine sürünüp bereket istediklerini gören sûfî kutuplarıdır."], [2996.5, "Onlar buna razıdırlar ve karşı çıkmazlar;"], [3001.0, "hatta (müritler) onlara rükû ve secde ederler. Bunlar şüphesiz tâğûtlardır."]]}]}, {"ts": "50:04", "title": "8. Külliye (devam): el-Mukanna' örneği ve ilâhlık iddia edenin tâğût olduğuna dair deliller", "paras": [{"reader": false, "ar": [[3004.0, "ومن أعجب ما قرأتُه في التاريخ:"], [3008.0, "رجلٌ خرج في الخلافة العثمانيّة <span class=\"note\">(sic)<\/span>،"], [3013.0, "يقال له: عطاءٌ المقنَّع،"], [3017.0, "وسُمّي مقنَّعًا لأنه لا يُرى إلا بقناع،"], [3021.0, "وهو من خراسان، وهو فارسيٌّ ظهر في القرن الثاني الهجريّ،"], [3029.0, "وقد زعم أنه اللهُ الذي لا إله إلا هو،"], [3033.0, "وكان يقول بتناسخ الأرواح،"], [3037.0, "واسمُه هاشم بن حكيم."], [3039.0, "وقد أسقط عن الناس كثيرًا من التعبّدات."]], "tr": [[3004.0, "Tarihte okuduğum en şaşırtıcı şeylerden biri şudur:"], [3008.0, "Osmanlı hilafetinde <span class=\"note\">(sic)<\/span> ortaya çıkmış, kendisine Atâ el-Mukanna' denilen bir adam."], [3014.7, "Ancak bir peçe (kınâ') ile görüldüğü için \"Mukanna'\" (peçeli) diye isimlendirildi."], [3024.5, "Horasanlıdır; hicrî ikinci asırda ortaya çıkmış bir Farstır."], [3031.2, "Kendisinin, kendisinden başka ilâh olmayan Allah olduğunu iddia etti;"], [3039.0, "ruhların tenasühüne (göçüne) inanıyordu. Adı Hâşim b."], [3041.9, "Hakîm'dir. İnsanlardan birçok ibadeti kaldırmıştı."]]}, {"reader": false, "ar": [[3044.0, "وقد كان يدّعي لنفسه في أوائل خروجه أنه حارسُ الباب اللَّدُنّيّ ـ ولا أدري ما هذا المنصب ـ لكنه يدّعي أنه حارسُ الباب اللَّدُنّيّ <span class=\"q\">؟ 50:50<\/span>،"], [3060.0, "أو بمعنًى آخر: خليفةُ القائم."], [3063.0, "ثم زعم أنه هو القائمُ نفسُه،"], [3066.0, "ثم خلع على نفسه صفةَ النبوّة،"], [3070.0, "ثم خلع على نفسه بعد ذلك صفةَ الألوهية والربوبية،"], [3077.0, "زاعمًا أنّ الحقيقة الإلهيّة قد حلّت فيه وتجسّدت."]], "tr": [[3044.0, "Ortaya çıkışının başlarında kendisi için \"ledünnî kapının bekçisi\" olduğunu iddia ediyordu —bu makamın ne olduğunu bilmiyorum— ama \"ledünnî kapının bekçisi\" <span class=\"q\">؟<\/span> olduğunu iddia ediyordu;"], [3056.0, "başka bir ifadeyle, \"Kâim'in halifesi\"."], [3058.4, "Sonra Kâim'in bizzat kendisi olduğunu iddia etti."], [3061.8, "Sonra kendisine nübüvvet sıfatını giydirdi."], [3065.0, "Daha sonra da kendisine ulûhiyyet ve rubûbiyyet sıfatını giydirdi;"], [3072.8, "ilâhî hakikatin kendisine hulûl ettiğini ve onda cisimleştiğini iddia etti."]]}, {"reader": false, "ar": [[3082.0, "ولذلك دلّت الأدلّة على أنّ كلَّ من ادّعى الربوبيةَ أو الألوهيةَ لنفسه فإنه طاغوتٌ كافر،"], [3094.0, "كما قال الله عز وجل عن الملائكة:"], [3097.0, "<span class=\"ayah\">﴿وَمَن يَقُلْ مِنْهُمْ إِنِّي إِلَٰهٌ مِّن دُونِهِ فَذَٰلِكَ نَجْزِيهِ جَهَنَّمَ ۚ كَذَٰلِكَ نَجْزِي الظَّالِمِينَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٩]<\/span>،"], [3103.8, "وهم ملائكة. هذا حقُّ الله الخالص الذي لا يرضى أن يشاركه فيه أحد."], [3110.0, "وكذلك قال الله عز وجل عن عيسى:"], [3115.0, "<span class=\"ayah\">﴿وَإِذْ قَالَ اللَّهُ يَا عِيسَى ابْنَ مَرْيَمَ أَأَنتَ قُلْتَ لِلنَّاسِ اتَّخِذُونِي وَأُمِّيَ إِلَٰهَيْنِ مِن دُونِ اللَّهِ ۖ قَالَ سُبْحَانَكَ مَا يَكُونُ لِي أَنْ أَقُولَ مَا لَيْسَ لِي بِحَقٍّ﴾<\/span> <span class=\"ref\">[المائدة: ١١٦]<\/span> <span class=\"note\">(Şeyh «ابن مريم» kısmını okumuyor)<\/span>."]], "tr": [[3082.0, "Bu yüzden deliller, kendisi için rubûbiyyet ya da ulûhiyyet iddia eden herkesin kâfir bir tâğût olduğunu göstermiştir."], [3091.3, "Allah Azze ve Celle'nin melekler hakkında buyurduğu gibi:"], [3097.0, "<span class=\"ayah\">﴿Onlardan kim \"Ben O'ndan başka bir ilâhım\" derse, onu cehennemle cezalandırırız. Zalimleri işte böyle cezalandırırız﴾<\/span> [Enbiyâ 29];"], [3105.0, "oysa onlar meleklerdir. Bu, Allah'ın kimsenin kendisine ortak olmasına razı olmadığı halis hakkıdır."], [3110.0, "Allah Azze ve Celle Îsâ hakkında da şöyle buyurmuştur:"], [3115.0, "<span class=\"ayah\">﴿Allah: \"Ey Meryem oğlu Îsâ! İnsanlara, 'Allah'ı bırakıp beni ve annemi iki ilâh edinin' diye sen mi söyledin?\" dediğinde, o şöyle der: \"Sen münezzehsin! Hakkım olmayan bir şeyi söylemek bana yakışmaz.\"﴾<\/span> [Mâide 116]."]]}, {"reader": false, "ar": [[3130.0, "وإنّ من عقوبة الله عز وجل للمشركين أن جعلهم من عَبَدة الطاغوت،"], [3137.0, "كما قال الله عز وجل:"], [3138.8, "<span class=\"ayah\">﴿قُلْ هَلْ أُنَبِّئُكُم بِشَرٍّ مِّن ذَٰلِكَ مَثُوبَةً عِندَ اللَّهِ ۚ مَن لَّعَنَهُ اللَّهُ وَغَضِبَ عَلَيْهِ وَجَعَلَ مِنْهُمُ الْقِرَدَةَ وَالْخَنَازِيرَ وَعَبَدَ الطَّاغُوتَ﴾<\/span> <span class=\"ref\">[المائدة: ٦٠]<\/span>؛"], [3148.0, "أي: أنكم تعبدون أناسًا يدّعون في أنفسهم الألوهيةَ أو الربوبية."], [3155.0, "فإذن هم عبدوا الطاغوت؛"], [3157.2, "لأنّ كلَّ من دعا إلى عبادة نفسه فإنه طاغوت."]], "tr": [[3130.0, "Allah Azze ve Celle'nin müşriklere verdiği cezalardan biri de onları tâğûta tapanlardan kılmasıdır."], [3136.4, "Allah Azze ve Celle'nin buyurduğu gibi:"], [3138.8, "<span class=\"ayah\">﴿De ki: Allah katında cezası bundan daha kötü olanı size haber vereyim mi? Allah'ın lanet ettiği, gazap ettiği, içlerinden maymunlar ve domuzlar kıldığı ve tâğûta ibadet eden kimselerdir﴾<\/span> [Mâide 60]."], [3148.0, "Yani: Siz kendileri için ulûhiyyet ya da rubûbiyyet iddia eden insanlara ibadet ediyorsunuz."], [3155.0, "O hâlde onlar tâğûta ibadet etmişlerdir;"], [3157.2, "çünkü kendisine ibadete çağıran herkes tâğûttur."]]}, {"reader": false, "ar": [[3162.0, "وقد نفى اللهُ عز وجل عن أنبيائه وأوليائه هذه الدعوة،"], [3166.0, "فقال: <span class=\"ayah\">﴿مَا كَانَ لِبَشَرٍ أَن يُؤْتِيَهُ اللَّهُ الْكِتَابَ وَالْحُكْمَ وَالنُّبُوَّةَ ثُمَّ يَقُولَ لِلنَّاسِ كُونُوا عِبَادًا لِّي مِن دُونِ اللَّهِ﴾<\/span> <span class=\"ref\">[آل عمران: ٧٩]<\/span>."], [3179.0, "وقال الله عز وجل عن اليهود والنصارى:"], [3184.0, "<span class=\"ayah\">﴿اتَّخَذُوا أَحْبَارَهُمْ وَرُهْبَانَهُمْ أَرْبَابًا مِّن دُونِ اللَّهِ وَالْمَسِيحَ ابْنَ مَرْيَمَ﴾<\/span> <span class=\"ref\">[التوبة: ٣١]<\/span>."], [3191.0, "فإذًا كلُّ من دعا إلى عبادة نفسه،"], [3195.0, "أو عبده غيرُه وهو راضٍ مغتبطٌ مستبشرٌ بهذه العبادة،"], [3200.0, "فإنه من جملة الطواغيت."], [3202.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[3162.0, "Allah Azze ve Celle peygamberlerinden ve velîlerinden bu daveti nefyetmiştir (uzak tutmuştur)."], [3166.7, "Şöyle buyurmuştur: <span class=\"ayah\">﴿Allah'ın kendisine Kitap, hüküm ve peygamberlik verdiği hiçbir beşerin, sonra insanlara \"Allah'ı bırakıp bana kul olun\" demesi olacak şey değildir﴾<\/span> [Âl-i İmrân 79]."], [3179.0, "Allah Azze ve Celle yahudiler ve hristiyanlar hakkında şöyle buyurmuştur:"], [3184.0, "<span class=\"ayah\">﴿Allah'ı bırakıp hahamlarını, rahiplerini ve Meryem oğlu Mesîh'i rabler edindiler﴾<\/span> [Tevbe 31]."], [3191.0, "O hâlde kendisine ibadete çağıran ya da başkası kendisine ibadet ettiği hâlde bu ibadete razı olan, bundan memnun olan ve sevinen herkes tâğûtlar cümlesindendir."], [3202.0, "Allah en yüce ve en iyi bilendir."], [3204.4, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
