<script>
const D={"no": 2, "vid": "pmGbb5WOkZg", "title_ar": "الدرس (٢) من شرح كليات العقيدة — تابع: مقدمة في العقيدة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 2. Ders: Akîdeye Giriş (devam)", "sections": [{"ts": "00:00", "title": "9. Külliye: Gayba kıyas sokulamaz", "paras": [{"reader": true, "ar": [[0.0, "أحسن الله إليكم. القاعدة التاسعة ـ أو الكلية التاسعة:"], [4.8, "كلُّ غيبٍ فلا يجوز إقحامُ القياس فيه."]], "tr": [[0.0, "Allah size iyilik etsin. Dokuzuncu kaide, ya da dokuzuncu külliye:"], [4.8, "Hiçbir gayba kıyas sokmak caiz değildir."]]}, {"reader": false, "ar": [[9.0, "الحمد لله رب العالمين،"], [11.2, "والصلاة والسلام على رسول الله الأمين،"], [14.5, "وبعد: وهذا من الأمور التي يجب حمايةُ الغيب منها،"], [19.4, "وهي إدخالُ القياس فيه؛"], [21.6, "فلا يجوز أن نقيس غائبًا على شاهدٍ أبدًا،"], [26.0, "فإن من الأبواب التي أفسدت على كثيرٍ من أهل البدع الغيبَ إقحامَهم القياسَ في أبواب الغيبيات."], [35.0, "فلا يحلّ في باب الاعتقاد أن نقيس غائبًا على شاهد."]], "tr": [[9.0, "Âlemlerin Rabbi Allah'a hamd, Allah'ın emin Resûlü'ne salât ve selâm olsun."], [14.5, "Bundan sonra: Gaybın korunması gereken şeylerden biri de ona kıyas sokulmasıdır."], [21.6, "Görünmeyeni (gâib) görünene (şâhid) asla kıyas edemeyiz."], [26.0, "Bid'at ehlinin çoğuna gaybı bozan kapılardan biri, gaybî bablara kıyası sokmalarıdır."], [26.0, "İtikad babında görünmeyeni görünene kıyas etmek helal değildir."]]}, {"reader": false, "ar": [[41.0, "فنقول مثلًا: إن الله عز وجل قد أثبت له وجهًا،"], [46.0, "ولا نعلم من كيفية الوجه إلا هذا الوجه المشاهَد،"], [51.0, "فيكون وجهُ الله كوجوهنا؛"], [53.0, "فقِسنا غائبًا على شاهد،"], [55.0, "وهذا هو القياس الباطل في أبواب الغيب."], [59.0, "فمتى ما دخل القياس في باب الغيب أفسده؛"], [63.0, "ولأن القياس عمليةٌ عقلية،"], [66.0, "وقد قرّرنا لكم قبل قليلٍ بأن لا عقلَ استقلالًا في غيب،"], [70.0, "فنفيُ إدخال العقل في أبواب الغيب يتضمّن نفيَ القياس فيها،"], [78.0, "لأن القياس أمرٌ عقلي."]], "tr": [[41.0, "Mesela şöyle deriz: Allah Teâlâ kendisi için bir yüz (vech) isbat etmiştir;"], [46.0, "biz ise yüzün keyfiyetinden sadece bu gördüğümüz yüzü biliriz;"], [51.0, "o hâlde Allah'ın yüzü bizim yüzlerimiz gibidir."], [53.0, "İşte görünmeyeni görünene kıyas ettik."], [55.0, "Gayb bablarındaki bâtıl kıyas budur."], [59.0, "Kıyas gayb babına girdiği anda onu bozar."], [63.0, "Çünkü kıyas aklî bir işlemdir."], [63.0, "Biraz önce size gaybda aklın müstakil bir payı olmadığını takrir ettik."], [66.0, "Aklın gayb bablarına sokulmasının nefyi, kıyasın da oralara sokulmasının nefyini içerir;"], [78.0, "çünkü kıyas aklî bir iştir."]]}, {"reader": false, "ar": [[81.0, "ويقول قائلهم مثلًا: بأن نعيم المؤمن في قبره غيبي،"], [92.0, "ولكنه يُقاس على النعيم في هذه الدنيا؛"], [96.0, "فقاس غائبًا على شاهد،"], [97.7, "فوقع في الخلل. وأن عذاب الكافر في قبره غيب،"], [104.0, "ولكنه يُقاس على عذاب الكفار في الدنيا؛"], [109.0, "فهذا قاس غائبًا على شاهد،"], [111.1, "فوقع الخلل. وكقياس استواء الله عز وجل على عرشه كاستواء الملِك على سرير ملكه،"], [122.0, "فجعلوا اللوازمَ على استواء الله هي بعينها اللوازمَ على استواء الملك على سرير ملكه؛"], [138.0, "فما يلزم على استواء المخلوق هنا يلزم على استواء الخالق هناك."], [144.0, "فجعلوا الغائب مقيسًا على الشاهد،"], [146.5, "وهذا من أعظم الخلل العقدي."]], "tr": [[81.0, "Onlardan biri mesela şöyle der:"], [81.0, "Müminin kabrindeki nimet gaybîdir, ama bu dünyadaki nimete kıyas edilir."], [92.0, "Görünmeyeni görünene kıyas etti ve hataya düştü."], [97.7, "Kâfirin kabrindeki azap gaybdır, ama dünyadaki kâfirlerin azabına kıyas edilir."], [104.0, "Bu kişi de görünmeyeni görünene kıyas etti ve hata ortaya çıktı."], [111.1, "Allah Teâlâ'nın Arş'ına istivâsını, hükümdarın tahtına oturmasına kıyas etmek de böyledir."], [111.1, "Allah'ın istivâsına, hükümdarın tahtına oturmasının gerektirdiği lâzımların (sonuçların) aynısını yüklediler."], [122.0, "Burada mahlûkun istivâsına ne gerekiyorsa, orada Hâlık'ın istivâsına da o gerekir, dediler."], [144.0, "Görünmeyeni görünene kıyas ettiler; bu da en büyük itikadî hatalardandır."]]}, {"reader": false, "ar": [[149.0, "فإن قلت: وما الواجب على المسلم في هذه المسألة؟"], [155.0, "نقول: لا تُدخل القياس في الغيبيات أبدًا،"], [159.0, "وإنما الواجب عليك أن تؤمن بالغيبيات،"], [161.8, "وأن تَكِلَ كيفيتها إلى الله عز وجل،"], [165.0, "وأن لا تدخل بعقلك ولا برأيك ولا بقياسك في استكشاف شيءٍ مما وراء الغيب."]], "tr": [[149.0, "\"Bu meselede Müslümana düşen nedir?\" dersen, deriz ki:"], [155.0, "Gaybîlere asla kıyas sokma. Sana düşen, gaybîlere iman etmen, keyfiyetlerini Allah Teâlâ'ya havale etmen ve gaybın ötesindeki hiçbir şeyi aklınla, görüşünle ya da kıyasınla keşfetmeye girişmemendir."]]}, {"reader": false, "ar": [[170.0, "وما أثبته الله عز وجل من نعيم الجنة لا يجوز قياسه على النعيم الذي عندنا؛"], [182.0, "فالجنة فيها لبن، وفي الدنيا لبن،"], [185.0, "ولكن لا يُقاس اللبن الغائب على اللبن المشاهد."], [188.0, "والجنة فيها نخلٌ وخيامٌ وفاكهة،"], [195.0, "وفي الدنيا مثل ذلك،"], [197.0, "ولكن لا يجوز قياس نعيم الجنة هناك على نعيم الدنيا هنا؛"], [203.0, "فليس في الجنة مما في الدنيا إلا مجرّدُ الأسماء."], [209.0, "فمتى ما دخل الإنسان في قياس شيءٍ من نعيم أهل الجنة على شيءٍ من نعيم أهل الدنيا فإنه لا بد أن يقع عنده الخلل العقدي."]], "tr": [[170.0, "Allah Teâlâ'nın isbat ettiği cennet nimetlerini, bizdeki nimetlere kıyas etmek caiz değildir."], [170.0, "Cennette süt vardır, dünyada da süt vardır;"], [185.0, "ama görünmeyen süt görünen süte kıyas edilmez."], [185.0, "Cennette hurma ağaçları, çadırlar ve meyveler vardır, dünyada da bunların benzeri vardır;"], [197.0, "ama oradaki cennet nimetini buradaki dünya nimetine kıyas etmek caiz değildir."], [203.0, "Dünyadaki şeylerden cennette sadece isimleri vardır."], [209.0, "İnsan cennet ehlinin nimetlerinden birini dünya ehlinin nimetlerinden birine kıyas etmeye giriştiği anda, mutlaka itikadî bir hataya düşer."]]}, {"reader": false, "ar": [[219.0, "وفي النار أغلال، وفي الدنيا أغلال؛"], [226.0, "وفي النار سلاسل، وفي الدنيا سلاسل؛"], [230.0, "وفي النار زقّوم، وفي الدنيا زقّوم؛"], [234.0, "وفي النار حميمٌ وغسّاق،"], [238.0, "وفي الدنيا حميمٌ وغسّاق؛"], [240.0, "ولكن كلُّ دارٍ لها خصائصها."], [245.0, "فمن قاس عذاب أهل النار على شيءٍ من عذاب الدنيا فإنه يُعتبر قد قاس في بابٍ غيبي،"], [255.0, "وحينئذٍ لا بد أن يدخل عليه الخلل في هذا الباب."]], "tr": [[219.0, "Cehennemde bukağılar vardır, dünyada da bukağılar vardır;"], [226.0, "cehennemde zincirler vardır, dünyada da zincirler vardır;"], [230.0, "cehennemde zakkum vardır, dünyada da zakkum vardır;"], [234.0, "cehennemde kaynar su ve irin vardır, dünyada da kaynar su ve irin vardır."], [240.0, "Ama her yurdun kendine has özellikleri vardır."], [245.0, "Cehennem ehlinin azabını dünya azabından bir şeye kıyas eden, gaybî bir babda kıyas yapmış sayılır;"], [255.0, "o zaman da bu babda mutlaka hataya düşer."]]}, {"reader": false, "ar": [[259.0, "فما مثّل الممثِّلةُ صفاتِ الله عز وجل بصفات خلقه إلا لأنهم قاسوا صفاته على صفات خلقه،"], [269.0, "فوقعوا في التمثيل. وما عطّل المعطِّلةُ صفاتِ الله عز وجل إلا لأنهم ظنّوا أنها كصفات المخلوقات،"], [281.0, "فأرادوا أن ينزّهوا الله عز وجل عنها،"], [284.0, "فحرّفوها وعطّلوها وأخرجوها عن مدلولاتها الصحيحة إلى مدلولاتٍ غريبةٍ عنها."], [291.0, "وكلُّ ذلك سببه القياس في الغيبيات."], [297.0, "ولذلك هذه الكلية تُعتبر حصنًا حصينًا سُنّيًّا سلفيًّا يقي عقائدك من الفساد"]], "tr": [[259.0, "Mümessile (benzetenler) Allah Teâlâ'nın sıfatlarını mahlûkatının sıfatlarına ancak O'nun sıfatlarını mahlûkatının sıfatlarına kıyas ettikleri için benzettiler ve temsile düştüler."], [269.0, "Muattıla da Allah Teâlâ'nın sıfatlarını ancak onların mahlûkatın sıfatları gibi olduğunu sandıkları için ta'til ettiler."], [281.0, "Allah Teâlâ'yı onlardan tenzih etmek istediler;"], [284.0, "onları tahrif ve ta'til ettiler, sahih anlamlarından çıkarıp onlara yabancı anlamlara götürdüler."], [291.0, "Bütün bunların sebebi gaybîlerde kıyastır."], [297.0, "Bu yüzden bu külliye, akîdelerini fesattan koruyan sünnî ve selefî sağlam bir kaledir —"]]}]}, {"ts": "05:00", "title": "10. Külliye: Sahabenin sormadığı gayb sorusu sapıklık kapısıdır", "paras": [{"reader": false, "ar": [[306.0, "ويحميها من الخلل والضلال."], [310.0, "فيجب أن تُحمى عقائدنا بمنع دخول القياس فيها،"], [316.0, "فمتى ما دخل القياس في أمرٍ غيبي أفسده."], [319.0, "فالواجب علينا أن نحافظ على عقائدنا من القياس. والله أعلم."]], "tr": [[306.0, "— ve onları hatadan ve sapıklıktan korur."], [310.0, "Akîdelerimizin, onlara kıyasın girmesi engellenerek korunması gerekir."], [316.0, "Kıyas gaybî bir işe girdiği anda onu bozar."], [319.0, "Bize düşen, akîdelerimizi kıyastan korumaktır. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[324.0, "أحسن الله إليكم. الكلية العاشرة:"], [329.2, "كلُّ سؤالٍ في غيبٍ لم يسأله أصحابُ رسول الله ﷺ فمفتاحٌ لباب ضلالة."]], "tr": [[324.0, "Allah size iyilik etsin. Onuncu külliye:"], [324.0, "Resûlullah ﷺ'in ashâbının sormadığı, gaybe dair her soru bir sapıklık kapısının anahtarıdır."]]}, {"reader": false, "ar": [[340.0, "إي والله. تقول الكلية:"], [341.8, "كلُّ سؤالٍ في أمرٍ غيبي ـ «في» أو «عن»،"], [347.6, "كلاهما صحيح: في أمرٍ غيبي أو عن أمرٍ غيبي ـ لم يسأله أصحاب النبي ﷺ فمفتاحٌ لباب ضلالة."]], "tr": [[340.0, "Evet, vallahi. Külliye der ki:"], [341.8, "Nebî ﷺ'in ashâbının sormadığı, gaybî bir iş hakkındaki —\"hakkında\" ya da \"dair\", ikisi de doğrudur— her soru bir sapıklık kapısının anahtarıdır."]]}, {"reader": false, "ar": [[360.0, "هذه الكلية عجيبةٌ وجميلةٌ جدًّا؛"], [363.0, "وذلك لأن الأدلة الغيبية من الكتاب والسنة كانت تنزل على النبي ﷺ ويتلوها على مسامع أصحابه رضي الله عنهم،"], [376.0, "ولم يكن الصحابة يتكلّفون سؤالًا عن كيفية شيءٍ من هذه الغيبيات."], [383.0, "فكانوا يسمعون: <span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span> ولم يتكلّفوا:"], [388.6, "كيف استوى؟ وكانوا يسمعون:"], [391.3, "«ينزل ربُّنا إلى السماء الدنيا حين يبقى ثلثُ الليل الآخر» <span class=\"note\">(Buhârî, Müslim)<\/span> ولم يكونوا يتكلّفون:"], [399.5, "كيف ينزل يا رسول الله؟"], [402.0, "وكان ينزل عليهم قول الله عز وجل:"], [406.2, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span> ولم يكونوا يتكلّفون:"], [409.5, "كيف يداه يا رسول الله؟"]], "tr": [[360.0, "Bu külliye çok hayranlık verici ve güzeldir."], [363.0, "Çünkü Kitap ve Sünnet'ten gaybe dair deliller Nebî ﷺ'e iner, o da onları ashâbının (r.a.) kulaklarına okurdu."], [363.0, "Sahabe bu gaybîlerden herhangi birinin keyfiyeti hakkında soru sorma zahmetine girmezdi."], [383.0, "<span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5] ayetini işitirler, \"Nasıl istivâ etti?\" diye zorlanmazlardı."], [388.6, "\"Rabbimiz, gecenin son üçte biri kaldığında dünya semasına iner\" (hadisini) işitirler <span class=\"note\">(Buhârî, Müslim)<\/span>, \"Ey Allah'ın Resûlü, nasıl iner?\" diye zorlanmazlardı."], [399.5, "Onlara Allah Teâlâ'nın <span class=\"ayah\">﴿Bilakis O'nun iki eli de açıktır﴾<\/span> [Mâide 64] sözü inerdi, \"Ey Allah'ın Resûlü, O'nun elleri nasıldır?\" diye zorlanmazlardı."]]}, {"reader": false, "ar": [[412.0, "وكانوا يستمعون (قول الله في الحديث القدسي):"], [418.0, "«فيها ما لا عينٌ رأت، ولا أذنٌ سمعت، ولا خطر على قلب بشر» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [422.9, "و<span class=\"ayah\">﴿وَفِيهَا مَا تَشْتَهِيهِ الْأَنفُسُ وَتَلَذُّ الْأَعْيُنُ ۖ وَأَنتُمْ فِيهَا خَالِدُونَ﴾<\/span> <span class=\"ref\">[الزخرف: ٧١]<\/span>،"], [428.0, "ولم يكن الواحد منهم يتكلّف سؤالًا عن كيفية لبن الجنة،"], [435.0, "ولا عن كيفية نخل الجنة،"], [438.0, "ولا عن كيفية عسل الجنة،"], [441.0, "ولا عن كيفية الحور العين في الجنة."]], "tr": [[412.0, "(Kudsî hadiste) \"Orada hiçbir gözün görmediği, hiçbir kulağın işitmediği ve hiçbir insanın kalbine gelmeyen şeyler vardır\" <span class=\"note\">(Buhârî, Müslim)<\/span> ve <span class=\"ayah\">﴿Orada canların çektiği ve gözlerin hoşlandığı her şey vardır; siz orada ebedî kalacaksınız﴾<\/span> [Zuhruf 71] sözlerini dinlerlerdi."], [428.0, "Hiçbiri cennetin sütünün, hurmasının, balının ya da hurilerinin keyfiyeti hakkında soru sorma zahmetine girmezdi."]]}, {"reader": false, "ar": [[444.0, "وكانوا يستمعون الآيات والأحاديث التي تتكلّم عن حقائق اليوم الآخر:"], [452.0, "فآياتٌ تتكلّم عن البعث،"], [454.1, "وآياتٌ تتكلّم عن الحشر والنشر،"], [457.0, "وآياتٌ تتكلّم عن تطاير الصحف،"], [460.0, "وعن الميزان ووزن الأعمال،"], [464.0, "وعن الصراط وعن القنطرة،"], [467.0, "ولم يكن الواحد منهم يتكلّف:"], [470.0, "كيف ذلك يا رسول الله؟"], [472.0, "وهذا هو الذي جعل عقيدتهم في عصمةٍ من الخلل؛"], [479.0, "فإنه متى ما دخل سؤالُ الكيف في أمرٍ غيبي فإن الخلل لا بد وأن يحصل لصاحبه."]], "tr": [[444.0, "Âhiret gününün hakikatlerinden bahseden ayetleri ve hadisleri dinlerlerdi:"], [444.0, "dirilişten bahseden ayetler, haşir ve neşirden bahseden ayetler, amel defterlerinin uçuşmasından, mizandan ve amellerin tartılmasından, sırattan ve kantaradan bahseden ayetler."], [467.0, "Hiçbiri \"Ey Allah'ın Resûlü, bu nasıl olur?\" diye zorlanmazdı."], [472.0, "Onların akîdesini hatadan masun kılan işte budur."], [472.0, "Çünkü \"nasıl\" sorusu gaybî bir işe girdiği anda, soranın mutlaka hataya düşmesi kaçınılmazdır."]]}, {"reader": false, "ar": [[488.0, "فإذا أردنا أن نتلقّى العقيدة السنية السلفية كما تلقّاها أصحاب النبي ﷺ فلنتلقَّها بأكمل الإيمان والتسليم وعدم السؤال بـ«كيف»."], [503.0, "فكلُّ «كيف» لم يسأله أصحاب النبي ﷺ فإنه «كيفٌ» باطلٌ فاسد،"], [514.0, "بل إن السؤال عنه بدعة،"], [517.0, "بل إن تكلّفه مفتاحٌ لباب ضلالةٍ عظيمٍ لا يُطاق."]], "tr": [[488.0, "Sünnî-selefî akîdeyi Nebî ﷺ'in ashâbının aldığı gibi almak istiyorsak, onu en mükemmel iman ve teslimle ve \"nasıl\" diye sormadan alalım."], [488.0, "Nebî ﷺ'in ashâbının sormadığı her \"nasıl\" bâtıl ve fâsid bir \"nasıl\"dır."], [503.0, "Hatta onu sormak bid'attır. Hatta onun zahmetine girmek, katlanılamayacak büyük bir sapıklık kapısının anahtarıdır."]]}, {"reader": false, "ar": [[525.0, "ومتى ما سمعت أحدًا يسأل عن كيفية شيءٍ من الغيب فقل له:"], [533.2, "أأنت أحرصُ على الدين والشرع والفهم من أصحاب محمد ﷺ؟"], [541.0, "الجواب بالطبع: لا. فإذا كان الصحابة هم أكمل الناس عقولًا،"], [549.0, "وأعظم الناس علمًا، وأقلّهم تكلّفًا،"], [554.0, "وأعرفهم بمقاصد التشريع، وأعلمهم بمواقع التنزيل،"], [561.0, "ومع شدّة حرصهم على التعلّم والفهم لم يكن الواحد منهم يتكلّف سؤالَ الكيف عند نزول شيءٍ من آيات الغيب،"], [574.0, "فهل أنت أحرصُ على العلم والهدى منهم؟"]], "tr": [[525.0, "Birinin gaybe dair bir şeyin keyfiyetini sorduğunu işittiğinde ona de ki:"], [525.0, "\"Sen dine, şeriata ve anlayışa Muhammed ﷺ'in ashâbından daha mı düşkünsün?\" Cevap elbette:"], [541.0, "Hayır. Sahabe akıl bakımından insanların en kâmili, ilim bakımından en büyüğü, zorlamadan en uzağı, teşriin maksatlarını en iyi bilen ve ayetlerin iniş yerlerini en iyi tanıyan kimseler oldukları hâlde, öğrenmeye ve anlamaya bu kadar düşkün olmalarına rağmen, gaybe dair ayetlerden biri indiğinde hiçbiri \"nasıl\" sorusunun zahmetine girmezdi."], [574.0, "Sen ilme ve hidayete onlardan daha mı düşkünsün?"]]}, {"reader": false, "ar": [[577.0, "فالواجب على العبد أن يتّقي الله عز وجل عند سماع شيءٍ من الغيبيات،"], [583.0, "وأن يحفظ لسانه عن سؤال الكيف؛"], [587.0, "فالكاف والياء والفاء في باب الغيبيات بابُ ضلالةٍ عظيم."], [595.0, "ويُروى أن رجلًا جاء إلى الإمام مالكٍ رحمه الله تعالى"]], "tr": [[577.0, "Kula düşen, gaybîlerden bir şeyi işittiğinde Allah Teâlâ'dan sakınması ve dilini \"nasıl\" sorusundan korumasıdır."], [583.0, "Gaybîler babında \"keyfe\" kelimesinin kâf, yâ ve fâ harfleri büyük bir sapıklık kapısıdır."], [595.0, "Rivayet edilir ki bir adam İmam Mâlik'e (rahimehullah) geldi —"]]}]}, {"ts": "10:00", "title": "10. Külliye (devam): İmam Mâlik'in cevabı", "paras": [{"reader": false, "ar": [[600.0, "وقال: يا إمام، <span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span>،"], [605.0, "كيف استوى؟ فأطرق الإمام مالكٌ رأسه حتى علاه الرُّحَضاء ـ أي العرق ـ ثم رفع رأسه وقال:"], [617.9, "الكيف غيرُ معلوم، والمعنى غيرُ مجهول،"], [624.0, "والإيمان به واجب، والسؤال عنه بدعة،"], [630.0, "ولا أراك إلا مبتدعًا."], [632.2, "فأمر به فأُخرج من المكان."], [632.2, "<span class=\"note\">(Şeyh sözü bu lafızla aktarıyor. Meşhur rivayetin lafzı: «الاستواء غير مجهول، والكيف غير معقول…».)<\/span>"]], "tr": [[600.0, "— ve \"Ey İmam! <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span>;"], [600.0, "nasıl istivâ etti?\" dedi. İmam Mâlik başını öne eğdi, öyle ki onu ter bastı."], [605.0, "Sonra başını kaldırıp şöyle dedi:"], [617.9, "\"Keyfiyeti bilinmez, manası meçhul değildir, ona iman vaciptir, onu sormak bid'attır."], [632.2, "Seni ancak bir bid'atçı olarak görüyorum.\" Onun hakkında emir verdi ve oradan çıkarıldı."]]}, {"reader": false, "ar": [[635.0, "ولأن سؤال الكيف في أمرٍ غيبي هو من التنطّع العلمي الذي لم تُؤمر بكشفه،"], [647.0, "وليس محطًّا للحساب يوم القيامة،"], [651.0, "ولن يسألك الله عز وجل عن كيفية هذا الشيء الغيبي؛"], [657.0, "ولو كانت محطًّا للسؤال والثواب والعقاب والإيمان لبيّنها الله عز وجل ورسوله ﷺ بيانًا شافيًا كافيًا."], [669.0, "لكنك إنما أُمرت أن تؤمن بالأمر الغيبي،"], [674.0, "ولم تُؤمر باستكشافه بـ«كيف»."]], "tr": [[635.0, "Çünkü gaybî bir işte \"nasıl\" diye sormak, keşfetmekle emrolunmadığın ilmî bir aşırılıktır (tenattu')."], [647.0, "Kıyamet günü hesaba konu değildir;"], [651.0, "Allah Teâlâ sana bu gaybî şeyin keyfiyetini sormayacaktır."], [657.0, "Eğer soru, sevap, ceza ve iman konusu olsaydı, Allah Teâlâ ve Resûlü ﷺ onu şifa verici ve yeterli bir şekilde açıklardı."], [657.0, "Sen ancak gaybî işe iman etmekle emrolundun;"], [669.0, "onu \"nasıl\" diye keşfetmekle emrolunmadın."]]}, {"reader": false, "ar": [[677.0, "فهذه كلمةٌ إبليسية في أبواب الغيب،"], [682.0, "وأطروحةٌ شيطانية في أبواب ما حُجب عن العقل كشفُه،"], [688.0, "يريد الشيطان بها أن يُضلّك،"], [691.0, "وأن يوصلك إلى نهايةٍ لا جواب عنها،"], [695.0, "فيوصلك إلى تعطيلها أو التكذيب بها أو جحودها أو الإلحاد فيها؛"], [700.0, "لأن عقلك مهما أجاب عن «كيف» الأولى فستثور «كيف» الثانية،"], [708.0, "وإذا أجاب عقلك عن «كيف» الثانية فستأتيك «كيف» الثالثة."], [715.0, "فقطعُ دابر «كيف» هو قطعها من أولها،"], [718.1, "وعدمُ الدخول في ذلك الباب بأيّ سؤالٍ من الأسئلة."], [722.0, "وهكذا كان أصحاب النبي ﷺ."]], "tr": [[677.0, "Bu, gayb bablarında iblisçe bir kelime;"], [677.0, "aklın keşfetmesinin engellendiği bablarda şeytanca bir iddiadır."], [688.0, "Şeytan onunla seni saptırmak ve cevabı olmayan bir sona götürmek ister;"], [695.0, "seni onu ta'til etmeye, yalanlamaya, inkâr etmeye veya onda ilhada götürür."], [700.0, "Çünkü aklın ilk \"nasıl\"a ne kadar cevap verirse versin, ikinci \"nasıl\" baş gösterir;"], [708.0, "aklın ikinci \"nasıl\"a cevap verirse üçüncü \"nasıl\" gelir."], [715.0, "\"Nasıl\"ın kökünü kazımak, onu en başından kesmek ve o kapıya hiçbir soruyla girmemektir."], [718.1, "Nebî ﷺ'in ashâbı da böyleydi."]]}, {"reader": false, "ar": [[728.0, "ولذلك سؤالُ الكيف عدّه أهل السنة من التنطّع الذي يدخل في قوله ﷺ:"], [737.0, "«هلك المتنطّعون» <span class=\"note\">(Müslim)<\/span>. هلك المتنطّعون الذين يُنقّبون عمّا لم يُؤمروا به،"], [744.2, "ويسألون عمّا لا يتعلّق بهم لا في دينهم ولا في دنياهم،"], [753.0, "ولا ينفعهم في أُولاهم ولا في أُخراهم،"], [756.2, "ولا يتعلّق بزيادة إيمانٍ ولا نقصه."]], "tr": [[728.0, "Bu yüzden Ehl-i Sünnet \"nasıl\" sorusunu, Nebî ﷺ'in \"Aşırı gidenler helak oldu\" <span class=\"note\">(Müslim)<\/span> sözüne giren aşırılıktan saymıştır."], [737.0, "Emrolunmadıkları şeyleri eşeleyen, ne dinleriyle ne dünyalarıyla ilgisi olan, ne dünyada ne âhirette kendilerine fayda veren, ne imanın artmasıyla ne eksilmesiyle ilgisi olan şeyleri soran aşırılar helak oldu."]]}, {"reader": false, "ar": [[759.0, "والله عز وجل قد أتمّ علينا النعمة أعظمَ التمام،"], [764.1, "وأكمل لنا الدين أعظمَ الكمال،"], [767.0, "وليس مما بيّن لنا كيفيةُ الغيبيات."], [770.0, "فإياك أن تدخل في سؤالها،"], [773.0, "لأنك سوف تُقحم نفسك في شيءٍ لم تُؤمر بكشفه،"], [777.0, "وربما كشفُه وطلبُه يُفضي بك إلى عقائد فاسدة،"], [781.0, "أو إلى الإلحاد والكفر والجحود والتعطيل،"], [784.0, "كما أفضى بغيرك. والله الموفق."]], "tr": [[759.0, "Allah Teâlâ nimetini üzerimize en büyük şekilde tamamlamış, dinimizi en büyük şekilde kemale erdirmiştir;"], [764.1, "bize açıkladığı şeyler arasında gaybîlerin keyfiyeti yoktur."], [770.0, "Sakın onları sormaya girişme; çünkü kendini keşfetmekle emrolunmadığın bir şeye sokmuş olursun."], [777.0, "Belki onu keşfetmeye çalışmak ve onu istemek, başkalarını götürdüğü gibi seni de fâsid akîdelere veya ilhada, küfre, inkâra ve ta'tile götürür. Tevfik Allah'tandır."]]}]}, {"ts": "13:06", "title": "11. Külliye: Sahabenin bilmediği her akîde bâtıldır", "paras": [{"reader": true, "ar": [[786.0, "أحسن الله إليكم. الكلية الحادية عشرة:"], [791.0, "كلُّ عقيدةٍ لا يعرفها أصحاب محمد ﷺ فهي باطلة."]], "tr": [[786.0, "Allah size iyilik etsin. On birinci külliye:"], [791.0, "Muhammed ﷺ'in ashâbının bilmediği her akîde bâtıldır."]]}, {"reader": false, "ar": [[798.0, "أقول ـ أو تقول الكلية ـ:"], [802.0, "كلُّ عقيدةٍ لا يعرفها أصحاب محمد ﷺ فهي باطلة."], [807.0, "الله أكبر يا إخوة!"], [809.0, "الله أكبر! كلُّ عقيدةٍ لا يعرفها أصحاب محمد ﷺ فهي باطلة."]], "tr": [[798.0, "Derim ki —ya da külliye der ki—:"], [802.0, "Muhammed ﷺ'in ashâbının bilmediği her akîde bâtıldır."], [807.0, "Allahu ekber, kardeşler! Allahu ekber!"], [809.0, "Muhammed ﷺ'in ashâbının bilmediği her akîde bâtıldır."]]}, {"reader": false, "ar": [[816.0, "أقول وبالله التوفيق: إن بطلان الاعتقاد يُعرف من عدّة أشياء،"], [823.0, "ومن أعظم ما يُعرف به بطلانه عدمُ وروده عن أصحاب رسول الله ﷺ؛"], [830.0, "فلو كان هذا الاعتقاد من الاعتقاد الصحيح لنُقل عنهم،"], [836.0, "فلما لم يُنقل عنهم دلّ ذلك على أنه ليس من العقيدة الصحيحة في صدرٍ ولا وِرد أبدًا."]], "tr": [[816.0, "Tevfik Allah'tandır, derim ki: Bir inancın bâtıl olduğu birkaç şeyden bilinir."], [823.0, "Bâtıllığının bilindiği en büyük şeylerden biri, Resûlullah ﷺ'in ashâbından gelmemiş olmasıdır."], [830.0, "Bu inanç sahih inançtan olsaydı onlardan nakledilirdi."], [836.0, "Onlardan nakledilmeyince, bu, onun hiçbir şekilde sahih akîdeden olmadığını gösterir."]]}, {"reader": false, "ar": [[845.0, "ولا تتصوّر أنك سوف يُكشف لك من العقائد ما لا يعرفه أبو بكرٍ وعمر،"], [851.0, "والخلفاء الراشدون، والمهاجرون والأنصار،"], [853.2, "وسائر أصحاب النبي ﷺ. ولا تتخيّل أنه سيُفتح لك من أبواب التشريع والوحي ما لم يُفتح لمن هم أحرصُ منك على العلم والهدى."], [870.0, "فكلُّ من دعاك إلى عقيدةٍ ليس عليها أصحاب محمد ﷺ فقل:"], [876.5, "لو كانت خيرًا لسبقنا إليها أصحاب رسول الله ﷺ."], [883.0, "ولا نقول كما قال الكفار:"], [885.3, "<span class=\"ayah\">﴿لَوْ كَانَ خَيْرًا مَّا سَبَقُونَا إِلَيْهِ﴾<\/span> <span class=\"ref\">[الأحقاف: ١١]<\/span> <span class=\"note\">(Şeyh \"Yahudiler\" diyor; ayette bu sözü söyleyenler \"kâfirler\" olarak geçer.)<\/span>،"], [888.0, "بل لو كانت هذه من العقائد الصحيحة المؤيَّدة بدليل الشرع لسبقنا إلى اعتقادها وإلى تقريرها أصحابُ محمد ﷺ."]], "tr": [[845.0, "Ebû Bekir ve Ömer'in, Hulefâ-i Râşidîn'in, Muhacirler ve Ensar'ın ve Nebî ﷺ'in bütün ashâbının bilmediği akîdelerin sana açılacağını sanma."], [853.2, "İlme ve hidayete senden daha düşkün olanlara açılmamış teşri ve vahiy kapılarının sana açılacağını hayal etme."], [870.0, "Seni Muhammed ﷺ'in ashâbının üzerinde olmadığı bir akîdeye çağıran herkese de ki:"], [876.5, "\"Eğer hayır olsaydı, Resûlullah ﷺ'in ashâbı onda bizi geçerdi.\" Kâfirlerin dediği gibi <span class=\"ayah\">﴿Eğer hayır olsaydı, bizi ona geçemezlerdi﴾<\/span> [Ahkâf 11] demeyiz."], [885.3, "Bilakis, bu, şer'î delille desteklenen sahih akîdelerden olsaydı, ona inanmakta ve onu takrir etmekte Muhammed ﷺ'in ashâbı bizi geçerdi."]]}]}, {"ts": "15:00", "title": "11. Külliye (devam): Sonradan çıkan akîdelere örnekler", "paras": [{"reader": false, "ar": [[900.0, "فالطواف حول القبور عقيدةٌ فاسدة،"], [902.4, "لأنها عقيدةٌ لا تُعرف عن أصحاب رسول الله ﷺ."], [908.0, "ودعاء الأموات عقيدةٌ فاسدة،"], [910.6, "لأنها لا تُعرف عن أصحاب النبي ﷺ."], [917.0, "والأذكار الجماعية عقيدةٌ فاسدة،"], [918.7, "لأنها من العقائد التي لم تُنقل عن أصحاب رسول الله ﷺ."], [926.0, "والاعتقاد الوثني الشركي في الأولياء والصالحين ـ من أنهم يدبّرون التدبير الاستقلالي،"], [935.0, "وأنهم ينصرون النصر الاستقلالي،"], [937.4, "وأنهم يتصرّفون التصرّف الاستقلالي في شيءٍ من ذرّات هذا العالم العلوي أو السفلي ـ هذا من العقائد الفاسدة،"], [946.8, "لأنها من العقائد التي لا يعرفها أصحاب محمد ﷺ."]], "tr": [[900.0, "Kabirlerin etrafında tavaf etmek fâsid bir akîdedir, çünkü Resûlullah ﷺ'in ashâbından bilinmeyen bir akîdedir."], [908.0, "Ölülere dua etmek fâsid bir akîdedir, çünkü Nebî ﷺ'in ashâbından bilinmez."], [917.0, "Toplu zikirler fâsid bir akîdedir, çünkü Resûlullah ﷺ'in ashâbından nakledilmemiş akîdelerdendir."], [926.0, "Veliler ve salihler hakkındaki putperest-şirkî inanç —onların müstakil olarak tedbir ettikleri, müstakil olarak yardım ettikleri, yukarı veya aşağı âlemin zerrelerinden herhangi birinde müstakil olarak tasarruf ettikleri inancı— fâsid akîdelerdendir, çünkü Muhammed ﷺ'in ashâbının bilmediği akîdelerdendir."]]}, {"reader": false, "ar": [[952.0, "والاحتفال بمولد النبي ﷺ من العقائد الفاسدة والاحتفالات الكاسدة،"], [958.0, "لأنه لم يُؤثر عن أصحاب محمد ﷺ."], [965.0, "ولا يمكن أن يستجدّ بعد عهدهم عقائدُ جديدة؛"], [969.0, "فكلُّ عقيدةٍ استجدّت بعد عهدهم فبدعةٌ وضلالة."], [974.0, "كلُّ عقيدةٍ استجدّت وأحدثها الناس بعد أصحاب رسول الله ﷺ فهي بدعةٌ وضلالة."]], "tr": [[952.0, "Nebî ﷺ'in mevlidini kutlamak fâsid akîdelerden ve geçersiz kutlamalardandır, çünkü Muhammed ﷺ'in ashâbından nakledilmemiştir."], [958.0, "Onların devrinden sonra yeni akîdeler ortaya çıkamaz."], [965.0, "Onların devrinden sonra ortaya çıkan her akîde bid'at ve sapıklıktır."], [969.0, "Resûlullah ﷺ'in ashâbından sonra ortaya çıkan ve insanların uydurduğu her akîde bid'at ve sapıklıktır."]]}, {"reader": false, "ar": [[986.0, "ولذلك لما وقف ابن مسعودٍ رضي الله عنه على قومٍ قد تقدّمهم رجلٌ يأمرهم بالتسبيح مئةً والتهليل مئة،"], [996.0, "قال: إمّا أن تكونوا على غير هدى،"], [999.8, "أو مفتتِحو باب ضلالة <span class=\"note\">(ed-Dârimî, Mukaddime)<\/span>؛"], [1002.0, "لأن هذا لم يكن عليه أهلُ الرعيل الأول،"], [1009.0, "ولو كان هذا خيرًا لسبقنا إليه أصحاب محمد ﷺ."]], "tr": [[986.0, "Bu yüzden İbn Mes'ûd (r.a.), başlarına geçen bir adamın kendilerine yüz kere tesbih ve yüz kere tehlîl emrettiği bir topluluğun yanında durduğunda şöyle dedi:"], [996.0, "\"Ya hidayet üzere değilsiniz ya da bir sapıklık kapısını açanlarsınız.\" <span class=\"note\">(ed-Dârimî)<\/span> Çünkü ilk nesil bunun üzerinde değildi."], [1009.0, "Bu hayır olsaydı, Muhammed ﷺ'in ashâbı bizi ona geçerdi."]]}, {"reader": false, "ar": [[1016.0, "وتمثيلُ صفات الله بصفات خلقه من العقائد الفاسدة،"], [1020.0, "لأنه ليس عليها أصحاب رسول الله ﷺ."], [1024.0, "وتعطيلُ صفات الله وأسمائه من العقائد الفاسدة،"], [1028.0, "لأنها ليس عليها أصحاب رسول الله ﷺ."], [1034.0, "وهكذا دواليك في كل عقيدةٍ فاسدة،"], [1037.0, "فإنه يجمعها هذا الوصف:"], [1039.0, "أنها من العقائد المحدَثة بعد عهد أصحاب النبي ﷺ،"], [1045.0, "ليس عليها السلف الصالح."]], "tr": [[1016.0, "Allah'ın sıfatlarını mahlûkatının sıfatlarına benzetmek fâsid akîdelerdendir, çünkü Resûlullah ﷺ'in ashâbı bunun üzerinde değildi."], [1024.0, "Allah'ın sıfatlarını ve isimlerini ta'til etmek fâsid akîdelerdendir, çünkü Resûlullah ﷺ'in ashâbı bunun üzerinde değildi."], [1034.0, "Her fâsid akîdede durum böyledir."], [1037.0, "Hepsini şu vasıf birleştirir: Nebî ﷺ'in ashâbının devrinden sonra uydurulmuş akîdelerdendir, selef-i sâlihîn bunlar üzerinde değildi."]]}, {"reader": false, "ar": [[1047.0, "ولذلك إذا جاءك رجلٌ يريد منك اعتقاد عقيدة فقل له:"], [1055.9, "هل أنت تعتقد أن هذه العقيدة من الخير أو من الشر؟"], [1061.0, "فسيقول: بالطبع إنها من الخير."], [1066.0, "فقل: إذا كنت تعتقد أنها من الخير،"], [1069.7, "فهل هي من الخير الذي علمه رسول الله ﷺ وصحابته الكرام،"], [1077.4, "أو جهلوه؟ بالطبع سيقول:"], [1080.1, "من عقائد الخير التي علموها."], [1087.0, "فقل: إذا كانوا علموها،"], [1089.7, "هل عملوا بها وأمروا بها وقرّروها ونقلوها للأمة،"], [1097.0, "أم كتموها عن الأمة؟"], [1099.2, "وأَدَعُ الجوابَ له، لأنه لا يفرّ من شيءٍ إلا ويقع في شرٍّ منه،"], [1110.0, "حتى يصل إلى قوله:"], [1112.7, "لم يعلموها ونحن علمناها،"], [1116.0, "ولم يأمروا بها ونحن أمرنا بها،"], [1120.0, "ولم تُكشف لهم ونحن كُشفت لنا،"], [1124.0, "ولم يُوحَ بها إلى نبيه ﷺ ونحن قد أُوحي بها إلينا."]], "tr": [[1047.0, "Bu yüzden biri sana bir akîdeye inanmanı istemeye gelirse ona de ki:"], [1055.9, "\"Bu akîdenin hayırdan mı şerden mi olduğuna inanıyorsun?\" Elbette \"Hayırdandır\" diyecektir."], [1061.0, "De ki: \"Hayırdan olduğuna inanıyorsan, Resûlullah ﷺ'in ve değerli sahabesinin bildiği hayırdan mı, yoksa onların bilmediği bir şey mi?\" Elbette \"Onların bildiği hayır akîdelerinden\" diyecektir."], [1087.0, "De ki: \"Onlar bunu bildiyse, onunla amel ettiler mi, onu emrettiler mi, onu takrir edip ümmete naklettiler mi, yoksa ümmetten gizlediler mi?\" Cevabı ona bırakırım;"], [1099.2, "çünkü bir şeyden kaçtığı her seferde ondan daha kötüsüne düşer."], [1112.7, "Sonunda şunu söylemeye varır: \"Onlar bilmediler, biz bildik;"], [1116.0, "onlar emretmediler, biz emrettik; onlara açılmadı, bize açıldı;"], [1124.0, "Peygamberine ﷺ vahyedilmedi, bize vahyedildi.\""]]}, {"reader": false, "ar": [[1131.0, "فنقول: صدقتَ، ولكن أوحت لكم بها شياطينكم،"], [1136.0, "<span class=\"ayah\">﴿وَإِنَّ الشَّيَاطِينَ لَيُوحُونَ إِلَىٰ أَوْلِيَائِهِمْ﴾<\/span> <span class=\"ref\">[الأنعام: ١٢١]<\/span>،"], [1142.0, "وكذلك قال الله عز وجل:"], [1144.5, "<span class=\"ayah\">﴿يُوحِي بَعْضُهُمْ إِلَىٰ بَعْضٍ زُخْرُفَ الْقَوْلِ غُرُورًا﴾<\/span> <span class=\"ref\">[الأنعام: ١١٢]<\/span>."], [1148.0, "فلو كانت من العقائد الصحيحة والوحي الصريح لفعلها أصحاب النبي ﷺ. والله أعلم."]], "tr": [[1131.0, "Deriz ki: \"Doğru söyledin, ama onu size şeytanlarınız vahyetti.\" <span class=\"ayah\">﴿Şüphesiz şeytanlar kendi dostlarına vahyederler﴾<\/span> [En'âm 121]."], [1136.0, "Allah Teâlâ yine şöyle buyurmuştur:"], [1144.5, "<span class=\"ayah\">﴿Aldatmak için birbirlerine yaldızlı sözler fısıldarlar﴾<\/span> [En'âm 112]."], [1144.5, "Eğer sahih akîdelerden ve açık vahiyden olsaydı, Nebî ﷺ'in ashâbı onu yapardı. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[1158.0, "<b>الكلية الثانية عشرة: كلُّ لازمٍ باطلٍ على شيءٍ من أدلة الاعتقاد فسببُه إقحامُ العقل في كشف كيفيته.<\/b>"]], "tr": [[1158.0, "<b>On ikinci külliye: İtikad delillerinden birine yüklenen her bâtıl lâzımın (sonucun) sebebi, aklı onun keyfiyetini keşfetmeye sokmaktır.<\/b>"]]}, {"reader": false, "ar": [[1169.0, "تقول الكلية: كلُّ لازمٍ باطلٍ على شيءٍ من أدلة الاعتقاد فسببُه إقحامُ العقل في كشف كيفيته. أقول وبالله التوفيق:"]], "tr": [[1169.0, "Külliye der ki: İtikad delillerinden birine yüklenen her bâtıl lâzımın sebebi, aklı onun keyfiyetini keşfetmeye sokmaktır. Tevfik Allah'tandır, derim ki:"]]}]}, {"ts": "20:00", "title": "12. Külliye: Bâtıl lâzımların kaynağı (Nüzul ve istivâ örnekleri)", "paras": [{"reader": false, "ar": [[1205.0, "هذه من الكليات التي أنا أُقسم عليها وأُباهل عليها إلى أن أموت:"], [1209.0, "بأنه لا يعترض العقلُ على شيءٍ من الغيب إلا لأن العقل أُقحم في بيان كيفيته،"], [1217.0, "ولا تلزم اللوازمُ الباطلة على شيءٍ من نصوص الغيب إلا وسببُه أنك سمحت لعقلك أن يدخل في بيان كيفيته؛"], [1229.0, "فلما دخل عقلُك في استكشاف كيفيته لزمت عليك في هذا الأمر الغيبي تلك اللوازمُ الباطلة الفاسدة الكاسدة."]], "tr": [[1205.0, "Bu, ölene kadar üzerine yemin ettiğim ve mübâhele ettiğim külliyelerdendir:"], [1205.0, "Akıl gaybe dair bir şeye ancak onun keyfiyetini açıklamaya sokulduğu için itiraz eder."], [1209.0, "Gayb naslarından birine bâtıl lâzımlar ancak aklının onun keyfiyetini açıklamaya girmesine izin verdiğin için yüklenir."], [1217.0, "Aklın onun keyfiyetini keşfetmeye girince, bu gaybî işte o bâtıl, fâsid ve geçersiz lâzımlar senin üzerine gerekli hâle geldi."]]}, {"reader": false, "ar": [[1241.0, "وأضرب لكم أمثلة: في قول النبي ﷺ:"], [1246.7, "«ينزل ربُّنا إلى السماء الدنيا كلَّ ليلةٍ في ثلث الليل الآخر»،"], [1253.0, "والحديث متواتر. فنحن ـ معاشرَ أهل السنة والجماعة ـ لا نُقحم عقولنا في كشف كيفية النزول،"], [1262.0, "ولذلك لا يلزم علينا أيُّ لوازم باطلة،"], [1266.0, "وإنما نقول كما قال نبينا ﷺ وصحابته الكرام:"], [1271.0, "من أن لله نزولًا في هذا الوقت يليق بجلاله وعظمته،"], [1275.0, "ليس كنزول المخلوقين، لا ندخل في هذا الغيب متأوّلين بآرائنا ولا متوهّمين بأهوائنا."], [1282.0, "فهل ترون أنه يلزم علينا لوازمُ باطلة تجعلنا في شكٍّ من إثبات هذا الغيب؟"], [1289.0, "الجواب: لا. ولماذا لم يَرِد علينا شيءٌ من ذلك؟"], [1293.0, "لأننا لم نُقحم عقولنا في بيان كيفيته."]], "tr": [[1241.0, "Size örnekler vereyim: Nebî ﷺ'in \"Rabbimiz her gece, gecenin son üçte birinde dünya semasına iner\" sözü;"], [1246.7, "hadis mütevâtirdir. Biz Ehl-i Sünnet ve'l-Cemaat topluluğu, aklımızı nüzulün keyfiyetini keşfetmeye sokmayız."], [1253.0, "Bu yüzden üzerimize hiçbir bâtıl lâzım gerekmez."], [1262.0, "Peygamberimiz ﷺ ve değerli sahabesinin dediği gibi deriz:"], [1266.0, "Allah'ın bu vakitte celâline ve azametine yakışır, mahlûkatın inişi gibi olmayan bir inişi vardır."], [1275.0, "Bu gayba ne görüşlerimizle te'vil ederek ne de heveslerimizle vehme kapılarak gireriz."], [1282.0, "Sizce üzerimize, bu gaybı isbat etmekte bizi şüpheye düşürecek bâtıl lâzımlar gerekir mi?"], [1289.0, "Cevap: Hayır. Neden bunlardan hiçbiri bize gelmedi?"], [1289.0, "Çünkü aklımızı onun keyfiyetini açıklamaya sokmadık."]]}, {"reader": false, "ar": [[1297.0, "ولكن لما أدخل أهل البدع عقولهم في هذا الحديث أنكروه وعطّلوه،"], [1305.0, "وقالوا: كيف ينزل عن عرشه؟"], [1308.0, "والربُّ لا يليق به أن ينزل عن عرشه،"], [1311.0, "وإذا نزل خلا العرشُ منه،"], [1315.0, "والله عز وجل إذا نزل إلى السماء الدنيا فستكون السماوات الستّ فوقه وهي مخلوقة،"], [1323.0, "وسيكون الله حالًّا في مخلوقاته،"], [1328.0, "وحلولُ الربّ في مخلوقاته يُبطله العقل؛"], [1331.0, "إلى غير ذلك من اللوازم الباطلة التي أوصلتهم إلى تعطيل دلالة الحديث،"], [1338.0, "فقالوا: الله لا ينزل،"], [1340.7, "وإنما ينزل أمرُه أو رحمتُه أو ملَكٌ من ملائكته."]], "tr": [[1297.0, "Ama bid'at ehli akıllarını bu hadise sokunca onu inkâr ve ta'til ettiler ve dediler ki:"], [1305.0, "\"Arş'ından nasıl iner? Arş'ından inmek Rab'be yakışmaz."], [1308.0, "İnerse Arş ondan boş kalır."], [1311.0, "Allah Teâlâ dünya semasına inerse, altı gök onun üstünde kalır, oysa onlar mahlûktur;"], [1315.0, "Allah mahlûkatına hulûl etmiş olur;"], [1323.0, "Rab'bin mahlûkatına hulûlünü ise akıl iptal eder.\" Ve onları hadisin delâletini ta'til etmeye götüren buna benzer bâtıl lâzımlar."], [1331.0, "Sonunda \"Allah inmez; O'nun emri, rahmeti ya da meleklerinden bir melek iner\" dediler."]]}, {"reader": false, "ar": [[1347.0, "ما الذي جعلهم يحرّفون النصوص عن معانيها،"], [1351.0, "ويعطّلون الأدلة عن دلالتها؟"], [1356.0, "إنما لأنهم أقحموا عقولهم في كشف كيفية نزول الله عز وجل."], [1361.0, "وهذه اللوازم إنما تلزم من سمح لعقله بأن يتخوّض في شيءٍ من ذلك."]], "tr": [[1347.0, "Onları nasları manalarından tahrif etmeye ve delilleri delâletlerinden ta'til etmeye sevk eden nedir?"], [1356.0, "Sadece akıllarını Allah Teâlâ'nın inişinin keyfiyetini keşfetmeye sokmaları."], [1361.0, "Bu lâzımlar ancak aklının bu tür bir şeye dalmasına izin veren kişiye gerekli olur."]]}, {"reader": false, "ar": [[1372.0, "ومثالٌ آخر: <span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span>."], [1376.0, "فنحن ـ معاشرَ أهل السنة والجماعة ـ لا ندخل بعقولنا في كشف كيفية الاستواء،"], [1385.0, "وإنما نقول كما قال ربنا:"], [1387.7, "بأن له استواءً يليق بجلاله وعظمته،"], [1391.0, "ليس كاستواء المخلوقين على ظهور الفُلك والدواب،"], [1396.0, "ولا ندخل في هذا الباب متأوّلين بآرائنا ولا متوهّمين بأهوائنا؛"], [1403.0, "فليس كمثل استوائه شيءٌ أبدًا من استواء مخلوقاته."], [1409.0, "هل لزم علينا لوازمُ باطلة في إثبات هذه الصفة؟"], [1414.0, "أجيبوا. الجواب: لا. ولماذا لم يلزم علينا شيءٌ من ذلك؟"], [1419.0, "لأننا لم ندخل بعقولنا العاجزة في استكشاف كيفية الاستواء."]], "tr": [[1372.0, "Başka bir örnek: <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span>."], [1372.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğu, istivânın keyfiyetini keşfetmeye aklımızla girmeyiz."], [1376.0, "Rabbimizin dediği gibi deriz: O'nun celâline ve azametine yakışır, mahlûkatın gemilerin ve hayvanların sırtına binmesi gibi olmayan bir istivâsı vardır."], [1391.0, "Bu baba ne görüşlerimizle te'vil ederek ne de heveslerimizle vehme kapılarak gireriz."], [1396.0, "Mahlûkatının istivâsından hiçbir şey O'nun istivâsının benzeri değildir."], [1409.0, "Bu sıfatı isbat etmede üzerimize bâtıl lâzımlar gerekti mi?"], [1414.0, "Cevap verin. Cevap: Hayır. Neden bunlardan hiçbiri bize gerekmedi?"], [1419.0, "Çünkü aciz aklımızla istivânın keyfiyetini keşfetmeye girmedik."]]}, {"reader": false, "ar": [[1423.0, "ولكن أهل البدع لما أدخلوا عقولهم في كشف كيفية استواء الله لزم عليهم لوازمُ باطلة أوصلتهم إلى تحريف الاستواء إلى الاستيلاء،"], [1437.0, "وعطّلوا صفة الاستواء عن الله عز وجل،"], [1440.0, "فقالوا: لو كان الله مستويًا على عرشه للزم منه حاجتُه إلى العرش،"], [1448.0, "لأن المستوي محتاجٌ إلى ما يستوي عليه،"], [1453.0, "ويلزم من ذلك لو أبعدنا العرش عن الربّ لخرّ وسقط ـ تعالى الله عما يقولون علوًّا كبيرًا،"], [1463.0, "ولولا ضرورة التعليم لما قلنا هذه السخافات."]], "tr": [[1423.0, "Ama bid'at ehli akıllarını Allah'ın istivâsının keyfiyetini keşfetmeye sokunca üzerlerine bâtıl lâzımlar gerekti;"], [1423.0, "bunlar onları istivâyı \"istîlâ\"ya (ele geçirmeye) tahrif etmeye götürdü ve istivâ sıfatını Allah Teâlâ'dan ta'til ettiler."], [1440.0, "Dediler ki: \"Allah Arş'ına istivâ etmiş olsaydı, bundan Arş'a muhtaç olduğu gerekirdi;"], [1448.0, "çünkü istivâ eden, üzerine istivâ ettiği şeye muhtaçtır."], [1453.0, "Buradan şu da gerekir: Arş'ı Rab'den uzaklaştırsak düşerdi.\" Allah onların söylediklerinden çok yücedir."], [1453.0, "Öğretimin zorunluluğu olmasaydı bu saçmalıkları söylemezdik."]]}, {"reader": false, "ar": [[1466.0, "فلما صارت عقولهم تفكّر في كيفية الاستواء،"], [1472.0, "فكلما توغّلوا بعقولهم تفكيرًا توغّلت عليهم اللوازم كثرةً،"], [1479.0, "فوصل بهم الأمر في الأخير إلى تعطيل الله عز وجل عن استوائه،"], [1487.0, "وتحريفه إلى الاستيلاء، فقالوا:"], [1492.5, "لم يستوِ الله على العرش،"], [1495.0, "ولكن الله استولى على العرش."], [1498.0, "ويلزم من ذلك أن يكون العرش مملوكًا لغير الله"]], "tr": [[1466.0, "Akılları istivânın keyfiyetini düşünmeye başlayınca, akıllarıyla düşünmeye daldıkça lâzımlar da üzerlerine çoğaldı."], [1472.0, "Sonunda iş onları Allah Teâlâ'yı istivâsından ta'til etmeye ve onu istîlâya tahrif etmeye vardırdı;"], [1487.0, "\"Allah Arş'a istivâ etmedi, ama Allah Arş'ı ele geçirdi\" dediler."], [1495.0, "Bundan da Arş'ın Allah'tan başkasının mülkü olması gerekir —"]]}]}, {"ts": "25:00", "title": "12. Külliye (sonu) · 13. ve 14. Külliyeler: Naslar hakikatine ve zahirine göre anlaşılır", "paras": [{"reader": false, "ar": [[1503.0, "فغالبه الله واستولى عليه؛"], [1507.0, "إذ ما يدخل في ملكيتك أولَ مرةٍ لا يُقال:"], [1510.8, "قد استوليتَ عليه. والعرش مملوكٌ لله مذ خلقه الله،"], [1515.0, "فكيف يستولي الله على العرش ولم يكن العرش مملوكًا لغيره أصلًا؟"], [1520.0, "ففرّوا من شيءٍ ووقعوا في شرٍّ منه،"], [1529.0, "كما سيأتينا في كليات الردود على أهل البدع في الدروس القادمة إن شاء الله."]], "tr": [[1503.0, "— ve Allah onunla mücadele edip onu ele geçirmiş olsun."], [1507.0, "Çünkü ilk defa mülkiyetine giren şey için \"onu ele geçirdin\" denmez."], [1510.8, "Arş, Allah onu yarattığından beri Allah'ın mülküdür;"], [1515.0, "Arş aslında başkasının mülkü olmamışken Allah onu nasıl ele geçirir?"], [1520.0, "Bir şeyden kaçtılar ve ondan daha kötüsüne düştüler."], [1529.0, "İnşallah ileriki derslerde bid'at ehline reddiyeler külliyelerinde bu konuya geleceğiz."]]}, {"reader": false, "ar": [[1534.0, "فوصيتي لكل مسلمٍ عامّة،"], [1537.1, "وللسنّي خاصّة: أن لا يسمح لعقله بأن يدخل في كشف شيءٍ من هذه الغيبيات،"], [1545.0, "لأنه متى ما أقحم عقله في كشف شيءٍ من الغيب فأُقسم بالله ستكون نهايةُ هذا الإدخال الإلحادَ أو التعطيل أو التكذيب أو الجحود أو الإنكار؛"], [1559.0, "وإن كان فيه حياءٌ من الله فسيبقى وتلك العقيدةُ مهتزّةٌ في قلبه،"], [1565.0, "وإن لم يصرّح باهتزازها لسانُه حياءً."], [1570.0, "والسلامة لا يعدلها شيءٌ أيها الأحبّة،"], [1574.0, "وطريق السلامة في الغيبيات حجبُ العقول عن الخوض في كيفياتها."], [1578.0, "والله الموفق. كلامي واضح؟ الحمد لله."]], "tr": [[1534.0, "Genel olarak her Müslümana, özel olarak da Sünnî olana vasiyetim şudur:"], [1537.1, "Aklının bu gaybîlerden herhangi birini keşfetmeye girmesine izin vermesin."], [1545.0, "Çünkü aklını gaybdan bir şeyi keşfetmeye soktuğu anda —Allah'a yemin ederim ki— bu işin sonu ilhad, ta'til, yalanlama, inkâr ya da reddetme olur."], [1545.0, "İçinde Allah'tan bir haya varsa, dili hayasından o akîdenin sarsıldığını açıkça söylemese bile, o akîde kalbinde sarsılmış olarak kalır."], [1565.0, "Ey sevgili kardeşler, selametin dengi yoktur."], [1570.0, "Gaybîlerde selametin yolu, akılları onların keyfiyetlerine dalmaktan alıkoymaktır."], [1574.0, "Tevfik Allah'tandır. Sözüm açık mı? Elhamdülillah."]]}, {"reader": true, "ar": [[1582.0, "<b>الكلية الثالثة عشرة: كلُّ نصوص الوحي يجب حملُها على حقيقتها إلا بقرينةٍ صارفة.<\/b> والتي بعدها:"], [1593.0, "أحسن الله إليكم، الكلية الرابعة عشرة:"], [1596.0, "كلُّ نصوص الوحي يجب حملُها على ظاهرها إلا بقرينةٍ صارفة."]], "tr": [[1582.0, "<b>On üçüncü külliye: Vahiy naslarının tamamını, (başka anlama) çeviren bir karine olmadıkça hakikatine göre anlamak vaciptir.<\/b> Ve ondan sonraki:"], [1593.0, "Allah size iyilik etsin. On dördüncü külliye:"], [1593.0, "Vahiy naslarının tamamını, çeviren bir karine olmadıkça zahirine göre anlamak vaciptir."]]}, {"reader": false, "ar": [[1602.0, "أقول وبالله التوفيق: هما كلّيتان."], [1605.0, "الكلية الأولى تقول: كلُّ نصوص الوحي يجب بقاؤها على حقيقتها إلا بقرينةٍ صارفة،"], [1626.0, "أي تصرفها إلى المجاز."], [1631.0, "والكلية التي بعدها: كلُّ نصوص الوحي يجب بقاؤها على ظاهرها إلا بقرينةٍ صارفة."], [1646.0, "وأُعيدهما مختصرةً: كلُّ نصوص الوحي يجب بقاؤها على حقيقتها إلا بقرينةٍ صارفة،"], [1658.0, "وكلُّ نصوص الوحي يجب بقاؤها على ظاهرها إلا بقرينةٍ صارفة."]], "tr": [[1602.0, "Tevfik Allah'tandır, derim ki: Bunlar iki külliyedir."], [1605.0, "Birinci külliye der ki: Vahiy naslarının tamamının, çeviren bir karine olmadıkça —yani onları mecaza çeviren— hakikatleri üzere kalması vaciptir."], [1631.0, "Ondan sonraki külliye: Vahiy naslarının tamamının, çeviren bir karine olmadıkça zahirleri üzere kalması vaciptir."], [1631.0, "İkisini kısaca tekrar ediyorum: Vahiy naslarının tamamının, çeviren bir karine olmadıkça hakikatleri üzere;"], [1646.0, "ve vahiy naslarının tamamının, çeviren bir karine olmadıkça zahirleri üzere kalması vaciptir."]]}, {"reader": false, "ar": [[1664.0, "فعندنا مصطلحان: حقيقةٌ وظاهر؛"], [1667.0, "وضدُّ الحقيقة المجاز، وضدُّ الظاهر المؤوَّل."], [1671.0, "فلا يجوز أن ننتقل من حقيقة الوحي إلى مجازه إلا بدليلٍ ينقلنا إليه،"], [1682.0, "ولا أن ننتقل عن ظاهر النص المتبادر للذهن أولَ مرةٍ إلى معنًى آخر إلا بدليلٍ يدلّنا على هذا الانتقال."], [1693.0, "فالأصل في الوحي بقاءُ ألفاظه على حقيقتها،"], [1697.0, "والأصل في نصوص الوحي بقاؤها على ظاهرها المتبادر للذهن لك أولَ مرة."]], "tr": [[1664.0, "Elimizde iki ıstılah vardır: hakikat ve zahir."], [1667.0, "Hakikatin zıddı mecaz, zahirin zıddı müevveldir (te'vil edilmiş anlam)."], [1671.0, "Bizi mecaza götüren bir delil olmadıkça vahyin hakikatinden mecazına geçmemiz caiz değildir."], [1682.0, "Bu geçişe delâlet eden bir delil olmadıkça, nassın zihne ilk anda gelen zahirinden başka bir manaya geçmemiz de caiz değildir."], [1693.0, "Vahiyde asıl olan, lafızlarının hakikatleri üzere kalmasıdır."], [1697.0, "Vahiy naslarında asıl olan, zihnine ilk anda gelen zahirleri üzere kalmalarıdır."]]}, {"reader": false, "ar": [[1704.0, "فإذا قيل لك: <span class=\"ayah\">﴿وَجَاءَ رَبُّكَ﴾<\/span> <span class=\"ref\">[الفجر: ٢٢]<\/span>،"], [1708.0, "فالظاهر والحقيقة أنه إثبات المجيء لله عز وجل."], [1712.0, "فالله عز وجل إنما يريد منك هذه الحقيقة وهذا المعنى الظاهر،"], [1717.0, "ولا يريد منك تحريفًا ولا تعطيلًا،"], [1720.3, "ولا بحثًا عن دلالاتٍ أخرى،"], [1723.0, "ولا إقحامًا لمعانٍ لم يدلّ عليها دليل الشرع ولا لسان اللغة."], [1729.0, "فلم يقل الله عز وجل في كتابه <span class=\"ayah\">﴿وَجَاءَ رَبُّكَ﴾<\/span> إلا وهو يريد منا إثبات المجيء له؛"], [1737.0, "لا يمكن أن يقول <span class=\"ayah\">﴿وَجَاءَ رَبُّكَ﴾<\/span> وهو لا يريد إثبات المجيء له،"], [1742.0, "فإن هذا من التضليل والمخادعة والتلبيس والإلغاز،"], [1749.0, "وهذا يجب صيانةُ خطاب الشرع عنه."]], "tr": [[1704.0, "Sana <span class=\"ayah\">﴿Rabbin geldi﴾<\/span> [Fecr 22] denildiğinde, zahir ve hakikat, bunun Allah Teâlâ'ya gelişin isbatı olduğudur."], [1712.0, "Allah Teâlâ senden ancak bu hakikati ve bu zahir manayı ister;"], [1712.0, "senden ne tahrif ne ta'til, ne başka delâletler aramanı ne de şer'î delilin ve dilin delâlet etmediği manaları sokmanı ister."], [1723.0, "Allah Teâlâ Kitabında <span class=\"ayah\">﴿Rabbin geldi﴾<\/span> derken ancak bizden O'na gelişi isbat etmemizi istemektedir."], [1729.0, "O'na gelişi isbat etmeyi istemediği hâlde <span class=\"ayah\">﴿Rabbin geldi﴾<\/span> demesi mümkün değildir."], [1737.0, "Çünkü bu, saptırma, aldatma, karıştırma ve bilmece konuşma olur;"], [1742.0, "şer'î hitabın bundan korunması vaciptir."]]}, {"reader": false, "ar": [[1751.0, "وإذا سمعت الله في القرآن يقول:"], [1760.0, "<span class=\"ayah\">﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٧]<\/span>، فظاهر النص وحقيقته إثباتُ الوجه على الوجه اللائق بالله عز وجل."], [1768.0, "وإذا سمعت النص يقول:"], [1770.0, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span>، <span class=\"ayah\">﴿لِمَا خَلَقْتُ بِيَدَيَّ﴾<\/span> <span class=\"ref\">[ص: ٧٥]<\/span>،"], [1774.2, "<span class=\"ayah\">﴿بِيَدِهِ الْمُلْكُ﴾<\/span> <span class=\"ref\">[الملك: ١]<\/span>، «بيده الخير» <span class=\"note\">(Mushaf lafzı: <span class=\"ayah\">﴿بِيَدِكَ الْخَيْرُ﴾<\/span> [Âl-i İmrân 26])<\/span>،"], [1780.0, "كلُّ ذلك يريد الله عز وجل به إثبات صفة اليدين على الوجه اللائق به."], [1786.0, "إياك أن تسمع الله يقول:"], [1788.5, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span>، ثم تقول:"], [1790.8, "لا يُراد به حقيقة اليدين،"], [1792.9, "وإنما يُراد به النعمة والقدرة؛"], [1795.0, "فإن هذا خروجٌ عن الحقيقة إلى المجاز بلا دليل،"]], "tr": [[1751.0, "Allah'ın Kur'an'da <span class=\"ayah\">﴿Rabbinin yüzü baki kalır﴾<\/span> [Rahmân 27] dediğini işittiğinde, nassın zahiri ve hakikati, Allah Teâlâ'ya yakışır şekilde yüzün isbatıdır."], [1768.0, "Nassın <span class=\"ayah\">﴿Bilakis O'nun iki eli de açıktır﴾<\/span>, <span class=\"ayah\">﴿İki elimle yarattığıma﴾<\/span> [Sâd 75], <span class=\"ayah\">﴿Mülk O'nun elindedir﴾<\/span> [Mülk 1], \"Hayır O'nun elindedir\" dediğini işittiğinde, Allah Teâlâ bunların hepsiyle, kendisine yakışır şekilde iki el sıfatını isbat etmeyi murad eder."], [1780.0, "Sakın Allah'ın <span class=\"ayah\">﴿Bilakis O'nun iki eli de açıktır﴾<\/span> dediğini işitip de \"Bununla iki elin hakikati kastedilmez, nimet ve kudret kastedilir\" deme."], [1792.9, "Çünkü bu, delilsiz olarak hakikatten mecaza çıkmaktır —"]]}]}, {"ts": "30:00", "title": "13–14. Külliyeler (devam): Tahrifin tanımı", "paras": [{"reader": false, "ar": [[1803.0, "وانتقالٌ من الظاهر إلى المؤوَّل والتحريف بلا دليل."], [1810.0, "وهذا واجبٌ بإجماع أهل السنة والجماعة،"], [1815.3, "ولم تحقّقه أيُّ فرقةٍ من فرق الأمة إلا فرقةٌ واحدة،"], [1823.0, "وهم أهل السنة والجماعة."], [1825.0, "فكلُّ الفرق ينتقلون في أبواب الغيب من الحقائق إلى المجازات وبلا دليل،"], [1835.0, "وينتقلون من الظاهر إلى المعنى المؤوَّل وبلا دليل."], [1840.0, "فيأتون إلى قول الله عز وجل:"], [1843.0, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span>،"], [1845.0, "فيقولون: لم يستوِ، وإنما معنى الاستواء الاستيلاء."], [1849.0, "وهذا مجازٌ ليس بحقيقة، وتحريفٌ ليس بظاهر."]], "tr": [[1803.0, "— ve delilsiz olarak zahirden müevvele ve tahrife geçmektir."], [1810.0, "Bu (iki külliyeye uymak), Ehl-i Sünnet ve'l-Cemaat'in icmâıyla vaciptir."], [1815.3, "Ümmetin fırkalarından sadece bir fırka bunu gerçekleştirmiştir:"], [1825.0, "Ehl-i Sünnet ve'l-Cemaat. Bütün fırkalar gayb bablarında delilsiz olarak hakikatlerden mecazlara, yine delilsiz olarak zahirden te'vil edilmiş manaya geçerler."], [1840.0, "Allah Teâlâ'nın <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> sözüne gelip \"İstivâ etmedi;"], [1845.0, "istivânın manası istîlâdır\" derler. Bu hakikat değil mecazdır; zahir değil tahriftir."]]}, {"reader": false, "ar": [[1855.0, "ويأتون إلى قول النبي ﷺ:"], [1864.0, "«حتى يضع ربُّ العزّة فيها رِجله» ـ وفي روايةٍ:"], [1868.7, "«قدمه» ـ «فينزوي بعضها إلى بعض، وتقول: قطْ قطْ» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [1872.0, "ويقولون: لا يوصف الله بالرِّجل ولا بالقدم،"], [1876.0, "وإنما يُراد بها طائفةٌ من الناس يضعهم الله عز وجل ويُدخلهم النار."], [1882.0, "وهذا وصفٌ لله بالظلم؛"], [1886.0, "إذ كيف يملأ النار بأقوامٍ يخلقهم في يومها،"], [1893.0, "ويُدخلهم النار، ويعذّبهم بلا سبقِ جُرم؟"], [1896.0, "وأما الجنة فإن الله يُنشئ خلقًا جديدًا ويُدخلهم ما تبقّى من مساكن الجنة ونعيمها،"], [1905.0, "لأنه يُنعّم ابتداءً، ولكن لا يُعذّب ابتداءً."]], "tr": [[1855.0, "Nebî ﷺ'in \"…nihayet İzzet'in Rabbi ayağını (bir rivayette: kademini) onun (cehennemin) içine koyar;"], [1864.0, "o zaman bir kısmı diğerine büzülür ve 'Yeter, yeter!' der\" <span class=\"note\">(Buhârî, Müslim)<\/span> sözüne gelip şöyle derler:"], [1872.0, "\"Allah ayak ya da kadem ile nitelenmez."], [1872.0, "Bununla, Allah'ın koyup cehenneme soktuğu bir insan topluluğu kastedilir.\" Bu ise Allah'ı zulümle nitelemektir."], [1876.0, "Çünkü cehennemi, o gün yarattığı insanlarla nasıl doldurur, önceden hiçbir suçları olmadan onları cehenneme sokup azap eder?"], [1893.0, "Cennete gelince, Allah yeni bir mahlûkat yaratır ve onları cennetin geri kalan meskenlerine ve nimetlerine yerleştirir."], [1896.0, "Çünkü O, (hak edilmemiş) nimeti baştan verir, ama (hak edilmemiş) azabı baştan vermez."]]}, {"reader": false, "ar": [[1915.0, "واتّفقت طوائف أهل البدع على عدم الرضا بحقائق أدلة الوحيين،"], [1920.0, "ولا على الوقوف على ظاهرها،"], [1923.0, "وإنما كلُّهم ينتقلون من الحقيقة إلى المجاز بلا قرينة،"], [1928.0, "ومن الظاهر إلى التأويل بلا قرينة."], [1930.0, "وأما أهل السنة فإنهم يقرّرون هاتين الكليتين، لأنها بردُ اليقين."]], "tr": [[1915.0, "Bid'at ehlinin taifeleri, iki vahyin delillerinin hakikatlerine razı olmamakta ve zahirlerinde durmamakta ittifak ettiler."], [1923.0, "Hepsi karinesiz olarak hakikatten mecaza, karinesiz olarak zahirden te'vile geçerler."], [1928.0, "Ehl-i Sünnet ise bu iki külliyeyi takrir eder, çünkü bu yakînin serinliğidir (gönül huzurudur)."]]}, {"reader": false, "ar": [[1937.0, "فإذا سمعت الله في القرآن يقول:"], [1940.0, "<span class=\"ayah\">﴿وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ﴾<\/span> <span class=\"ref\">[الأعراف: ١٥٦]<\/span>،"], [1942.0, "لا تقل: إن الرحمة إرادةُ الثواب،"], [1944.0, "وإنما قل: هي رحمةٌ لائقةٌ بالله عز وجل."], [1948.0, "وإذا سمعت الله في القرآن يقول:"], [1950.7, "<span class=\"ayah\">﴿وَغَضِبَ اللَّهُ عَلَيْهِمْ﴾<\/span> <span class=\"ref\">[الفتح: ٦]<\/span>، فإياك أن تقول:"], [1953.5, "إن الغضب معناه إرادة الانتقام،"], [1956.0, "وإنما قل: هو غضبٌ من صفاته على الوجه اللائق به."], [1959.0, "وإذا سمعت الله في القرآن يقول:"], [1961.8, "<span class=\"ayah\">﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾<\/span>، فإياك أن تقول:"], [1964.7, "ليس لله وجه، وإنما المراد به الذات؛"], [1968.0, "بل قل: لله وجهٌ لائقٌ بجلاله وعظمته."]], "tr": [[1937.0, "Allah'ın Kur'an'da <span class=\"ayah\">﴿Rahmetim her şeyi kuşatmıştır﴾<\/span> [A'râf 156] dediğini işittiğinde, \"Rahmet sevap vermeyi dilemektir\" deme;"], [1942.0, "\"O, Allah Teâlâ'ya yakışır bir rahmettir\" de."], [1944.0, "Allah'ın Kur'an'da <span class=\"ayah\">﴿Allah onlara gazap etti﴾<\/span> [Fetih 6] dediğini işittiğinde, sakın \"Gazabın manası intikam almayı dilemektir\" deme;"], [1953.5, "\"O, kendisine yakışır şekilde O'nun sıfatlarından bir gazaptır\" de."], [1956.0, "Allah'ın Kur'an'da <span class=\"ayah\">﴿Rabbinin yüzü baki kalır﴾<\/span> dediğini işittiğinde, sakın \"Allah'ın yüzü yoktur, bununla zat kastedilir\" deme;"], [1964.7, "bilakis \"Allah'ın celâline ve azametine yakışır bir yüzü vardır\" de."]]}, {"reader": false, "ar": [[1972.0, "وإذا سمعت النبي ﷺ يقول:"], [1977.0, "«إن قلوب العباد بين إصبعين من أصابع الرحمن» <span class=\"note\">(Müslim; lafzı: «إن قلوب بني آدم كلها…»)<\/span>،"], [1982.0, "فإياك أن تقول: إن الله ليس له أصابع،"], [1986.3, "وإنما المراد بها كذا وكذا؛"], [1989.0, "وإنما قل: لله أصابعُ تليق بجلاله وعظمته،"], [1992.0, "وهي وإن اتفقت مع أصابع المخلوقين في الاسم،"], [1996.0, "ولكن الاتفاق في الأسماء لا يستلزم الاتفاق في الكيفيات والصفات،"], [2001.0, "كما سيأتينا في كليةٍ خاصةٍ إن شاء الله في باب قواعد الأسماء والصفات."]], "tr": [[1972.0, "Nebî ﷺ'in \"Kulların kalpleri Rahmân'ın parmaklarından iki parmağın arasındadır\" <span class=\"note\">(Müslim)<\/span> dediğini işittiğinde, sakın \"Allah'ın parmakları yoktur, bununla şu şu kastedilir\" deme;"], [1986.3, "\"Allah'ın celâline ve azametine yakışır parmakları vardır\" de."], [1989.0, "Bunlar isimde mahlûkatın parmaklarıyla aynı olsa da isimlerde aynı olmak, keyfiyetlerde ve sıfatlarda aynı olmayı gerektirmez."], [2001.0, "İnşallah isim ve sıfatlar kaideleri babında buna özel bir külliyede geleceğiz."]]}, {"reader": false, "ar": [[2008.0, "فما أجملَ مذهب أهل السنة والجماعة!"], [2013.0, "لا نتجاوز حقيقةً إلى مجازٍ إلا بناقل،"], [2017.0, "ولا نتجاوز ظاهرًا إلى مؤوَّلٍ إلا بناقل."], [2021.0, "ثم اعلم ـ رحمك الله ـ أن كلَّ انتقالٍ من الحقيقة إلى المجاز بلا قرينةٍ فيُسمّى تحريفًا،"], [2032.0, "وكلَّ انتقالٍ عن الظاهر إلى المؤوَّل بلا قرينةٍ فيُسمّى تحريفًا."], [2037.0, "فإذا قيل لك: عرّف التحريف،"], [2039.5, "فقل: هو الانتقال من الحقيقة إلى المجاز،"], [2043.0, "ومن الظاهر إلى المؤوَّل،"], [2045.0, "بلا دليلٍ ولا قرينة."]], "tr": [[2008.0, "Ehl-i Sünnet ve'l-Cemaat'in mezhebi ne güzeldir!"], [2013.0, "Bir nakledici (delil) olmadıkça hakikatten mecaza, bir nakledici olmadıkça zahirden müevvele geçmeyiz."], [2021.0, "Sonra bil —Allah sana rahmet etsin— karinesiz olarak hakikatten mecaza her geçiş \"tahrif\" diye adlandırılır;"], [2032.0, "karinesiz olarak zahirden müevvele her geçiş de \"tahrif\" diye adlandırılır."], [2037.0, "Sana \"Tahrifi tanımla\" denirse de ki:"], [2039.5, "\"Delil ve karine olmaksızın hakikatten mecaza ve zahirden müevvele geçmektir.\""]]}, {"reader": false, "ar": [[2047.0, "والتحريف محرّمٌ بالإجماع، كما قال الله عز وجل:"], [2056.0, "<span class=\"ayah\">﴿يُحَرِّفُونَ الْكَلِمَ مِن بَعْدِ مَوَاضِعِهِ﴾<\/span> <span class=\"ref\">[المائدة: ٤١]<\/span>،"], [2059.0, "وقال عز وجل: <span class=\"ayah\">﴿يُحَرِّفُونَ الْكَلِمَ عَن مَّوَاضِعِهِ﴾<\/span> <span class=\"ref\">[النساء: ٤٦]<\/span>."], [2065.0, "فقد وضع الوحيُ لفظًا،"], [2067.9, "فمن حرّف ألفاظه فمحرِّف،"], [2073.0, "وقد وضع الوحيُ معنًى،"], [2075.8, "فمن حرّف معناه فهو محرِّف."], [2080.0, "فنأخذ منها كليتين: كلُّ انتقالٍ من الحقيقة إلى المجاز بلا قرينةٍ فتحريف،"], [2089.0, "وكلُّ انتقالٍ من الظاهر إلى المؤوَّل بلا قرينةٍ فتحريف. والله الموفق."]], "tr": [[2047.0, "Tahrif icmâ ile haramdır. Allah Teâlâ'nın buyurduğu gibi:"], [2056.0, "<span class=\"ayah\">﴿Kelimeleri yerleri belli olduktan sonra değiştirirler﴾<\/span> [Mâide 41]."], [2056.0, "Yine şöyle buyurmuştur: <span class=\"ayah\">﴿Kelimeleri yerlerinden değiştirirler﴾<\/span> [Nisâ 46]."], [2059.0, "Vahiy bir lafız koymuştur; lafızlarını tahrif eden muharriftir."], [2067.9, "Vahiy bir mana koymuştur; manasını tahrif eden de muharriftir."], [2080.0, "Buradan iki külliye çıkarırız: Karinesiz olarak hakikatten mecaza her geçiş tahriftir;"], [2089.0, "karinesiz olarak zahirden müevvele her geçiş tahriftir. Tevfik Allah'tandır."]]}, {"reader": true, "ar": [[2095.0, "<b>الكلية الخامسة عشرة: كلُّ نصٍّ ثبتت صحّتُه فلا يتعارض مع عقلٍ ثبتت صراحتُه.<\/b>"]], "tr": [[2095.0, "<b>On beşinci külliye: Sıhhati sabit olan hiçbir nas, sarihliği (sağlamlığı) sabit olan bir akılla çelişmez.<\/b>"]]}]}, {"ts": "35:00", "title": "15. Külliye: Sahih nakil ile sağlam akıl çelişmez", "paras": [{"reader": false, "ar": [[2107.0, "تقول الكلية: كلُّ نصٍّ ثبتت صحّتُه فلا يتعارض مع عقلٍ ثبتت صراحتُه."], [2121.0, "صراحتُه: أي سلامتُه من الآفات والعلل."], [2126.0, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أن الذي أنزل النصَّ هو الذي خلق العقل ـ الذي أنزل النصَّ هو الذي خلق العقل ـ وهو أحسنُ حديثًا وأصدقُ قيلًا من خلقه،"], [2145.0, "فلا يمكن أن تكون نصوصُه التي أنزلها متعارضةً مع العقول التي خلقها."]], "tr": [[2107.0, "Külliye der ki: Sıhhati sabit olan hiçbir nas, sarihliği sabit olan bir akılla çelişmez."], [2121.0, "Sarihliği: yani afetlerden ve hastalıklardan salim olması."], [2126.0, "Tevfik Allah'tandır, derim ki: Bil —Allah sana rahmet etsin— nassı indiren, aklı yaratanın ta kendisidir."], [2126.0, "O, mahlûkatından sözce daha güzel ve söz bakımından daha doğrudur."], [2145.0, "İndirdiği nasların, yarattığı akıllarla çelişmesi mümkün değildir."]]}, {"reader": false, "ar": [[2154.0, "فمتى ما رأيت تعارضًا ثار في ذهنك بين عقلٍ ونقل،"], [2162.0, "فاعلم أنك بين إحدى آفتين:"], [2166.0, "الأولى: أن يكون النص ليس بصحيح ـ وإذا قلنا «ليس بصحيح» فنقصد به إذا لم يكن من القرآن ـ فلا بد حينئذٍ إذا كان النص من السنة وظهر تعارضُه مع العقل أن نتأكّد أولًا من صحته سندًا."], [2186.0, "فإذا تيقّنّا من صحته سندًا فننتقل إلى الآفة الثانية،"], [2195.0, "وهي سلامة العقل: ألّا يكون العقل الناظر في النص سليمًا."]], "tr": [[2154.0, "Zihninde akıl ile nakil arasında bir çelişkinin baş gösterdiğini gördüğünde bil ki iki afetten biriyle karşı karşıyasın."], [2166.0, "Birincisi: Nassın sahih olmaması —\"sahih değil\" dediğimizde, Kur'an'dan olmadığı durumu kastediyoruz—."], [2166.0, "Nas Sünnet'ten olup akılla çeliştiği ortaya çıktığında, önce senet bakımından sahih olduğundan emin olmamız gerekir."], [2186.0, "Senet bakımından sahih olduğundan emin olursak ikinci afete geçeriz:"], [2195.0, "aklın sağlamlığı; yani nassa bakan aklın sağlam olmaması."]]}, {"reader": false, "ar": [[2204.0, "فلربما يكون العقلُ الذي نظر في النص الصحيح مريضًا عليلًا طريحَ الفراش،"], [2213.0, "بسبب شهوةٍ، أو بسبب شبهةٍ عرضت له،"], [2218.0, "أو بسبب قاعدةٍ كلاميةٍ فلسفيةٍ زرعها مشايخُه في عقله وهو صغير،"], [2225.0, "فصار ينظر في نصوص الوحيين بناءً على قواعد أسلافه الفاسدة."], [2231.0, "ومتى ما فسد التأصيل فسدت النتائج ـ متى ما فسد التأصيل فسدت النتائج ـ كما أنه متى ما سلم التأصيل سلمت النتائج."]], "tr": [[2204.0, "Belki sahih nassa bakan akıl hasta, illetli, yatağa düşmüştür:"], [2204.0, "bir şehvet yüzünden, kendisine arız olan bir şüphe yüzünden ya da küçükken şeyhlerinin aklına ektiği kelâmî-felsefî bir kaide yüzünden."], [2225.0, "Böylece iki vahyin naslarına seleflerinin fâsid kaidelerine dayanarak bakar."], [2231.0, "Temel (te'sîl) bozuldu mu sonuçlar da bozulur;"], [2231.0, "temel sağlam oldu mu sonuçlar da sağlam olur."]]}, {"reader": false, "ar": [[2249.0, "فالممثِّلة نظروا إلى أدلة إثبات الصفات بعقلٍ مريض،"], [2258.0, "بقاعدةٍ ملعونةٍ تقول: إن الاتفاق في الأسماء يستلزم الاتفاق في الصفات."], [2265.0, "وتلك القاعدة الملعونة الكاذبة الفاسدة الإبليسية أفسدت عليهم النظر في الأدلة؛"], [2272.0, "فالدليل صحيح، ولكن العقل الناظر فيه ليس بصريح،"], [2276.0, "كالمريض يشرب أعذبَ ماءٍ على وجه الأرض ولكن يحسّ بمرارةٍ في حلقه؛"], [2285.0, "فالعيب ليس في الماء وإنما العيب في حلقك،"], [2289.0, "والعيب ليس في النصوص وإنما العيب في عقلك الناظر فيها."]], "tr": [[2249.0, "Mümessile, sıfatları isbat eden delillere hasta bir akılla, \"İsimlerde aynı olmak sıfatlarda aynı olmayı gerektirir\" diyen lanetli bir kaideyle baktılar."], [2265.0, "O lanetli, yalan, fâsid ve iblisçe kaide, delillere bakışlarını bozdu."], [2272.0, "Delil sahihtir, ama ona bakan akıl sağlam değildir."], [2276.0, "Tıpkı yeryüzündeki en tatlı suyu içip de boğazında acılık hisseden hasta gibi:"], [2285.0, "Kusur suda değil, boğazındadır. Kusur naslarda değil, onlara bakan aklındadır."]]}, {"reader": false, "ar": [[2295.0, "فكما أن الأجساد تعتلّ وتمرض،"], [2298.5, "فكذلك الأفكار والعقول تعتلّ وتمرض؛"], [2302.0, "فالذي يُتعب الأجسام هي الميكروبات أو الفيروسات مع ضعف المناعة،"], [2310.1, "والذي يُتلف العقولَ هي القواعد الفاسدة والأصول الكاسدة."], [2320.0, "وعقول أهل التعطيل لما نظرت في أدلة الأسماء والصفات نظرت لها بعقولٍ عليلةٍ مريضة،"], [2331.0, "فصارت نتائجها تحريفَ الأسماء والصفات."]], "tr": [[2295.0, "Bedenler nasıl illetlenip hastalanırsa, düşünceler ve akıllar da öyle illetlenip hastalanır."], [2302.0, "Bedenleri yoran, bağışıklığın zayıflamasıyla birlikte mikroplar veya virüslerdir;"], [2310.1, "akılları mahveden ise fâsid kaideler ve geçersiz esaslardır."], [2320.0, "Ta'til ehlinin akılları isim ve sıfat delillerine illetli ve hasta akıllarla baktı;"], [2320.0, "sonuçları da isim ve sıfatları tahrif etmek oldu."]]}, {"reader": false, "ar": [[2334.0, "لكن أُقسم بالله عز وجل أنه إذا توفّر الأمران ـ صحةُ النص،"], [2342.0, "وسلامةُ العقل وعافيتُه ـ فوالله لا يمكن أن يكون بينهما تعارضٌ أبدًا."], [2348.0, "ولذلك لا نعلم كلمةً واحدةً عن أهل السنة والجماعة بوجود تعارضٍ بين نقلٍ وعقل،"], [2357.0, "وإنما دعوى التعارض بينهما قد ملأ بها أفواهَهم أهلُ البدع."], [2367.0, "وقد ألّف ابنُ تيمية رحمه الله لدفع التعارض بين النقل والعقل كتابه الكبير المفيد المستصعب المسمّى «درء تعارض العقل والنقل»،"], [2386.0, "وهو يريد إثبات هذه القضية."]], "tr": [[2334.0, "Ama Allah Teâlâ'ya yemin ederim ki iki şey —nassın sıhhati ile aklın sağlamlığı ve afiyeti— bir araya geldiğinde, vallahi aralarında asla çelişki olamaz."], [2342.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat'ten nakil ile akıl arasında çelişki olduğuna dair tek bir söz bilmiyoruz."], [2348.0, "İkisi arasında çelişki iddiasıyla ağızlarını dolduranlar bid'at ehlidir."], [2357.0, "İbn Teymiyye (rahimehullah), nakil ile akıl arasındaki çelişkiyi gidermek için, bu meseleyi isbat etmek maksadıyla, büyük, faydalı ve zor anlaşılan \"Der'u Teâruzi'l-Akl ve'n-Nakl\" adlı kitabını telif etmiştir."]]}, {"reader": false, "ar": [[2388.0, "وقد شغّب علينا أهل البدع بجملٍ من الآيات والأحاديث يقولون بأنها تعارض العقول،"], [2398.0, "وقد أجاب أهل السنة والجماعة"]], "tr": [[2388.0, "Bid'at ehli, akıllarla çeliştiğini iddia ettikleri bir takım ayet ve hadislerle bize karşı gürültü kopardılar."], [2388.0, "Ehl-i Sünnet ve'l-Cemaat de cevap verdi —"]]}]}, {"ts": "40:00", "title": "15. Külliye (devam): \"Rahmân'ın nefesi\" ve \"Acıktım, beni doyurmadın\" hadisleri", "paras": [{"reader": false, "ar": [[2402.0, "بأنها ـ والله ـ لا تعارض العقول،"], [2405.0, "لأنها إما نصوصٌ ثبت ضعفها،"], [2409.0, "وإما أن يكون السببُ في العقل الناظر فيها."], [2415.0, "ولي مؤلَّفٌ ـ إذا أردتم أن تعرفوا الفروع على ذلك ـ أسميتُه:"], [2421.6, "«لا يتعارض النقل الصحيح مع العقل الصريح»."]], "tr": [[2402.0, "— ki vallahi bunlar akıllarla çelişmez;"], [2405.0, "çünkü bunlar ya zayıflığı sabit olmuş naslardır ya da sebep onlara bakan akıldadır."], [2415.0, "Bunun fer'lerini öğrenmek isterseniz, \"Sahih nakil sağlam akılla çelişmez\" adını verdiğim bir eserim var."]]}, {"reader": false, "ar": [[2426.0, "فقالوا لنا مثلًا: بأن قول النبي ﷺ:"], [2437.0, "«إني أجد نَفَسَ الرحمن من قِبَل اليمن» ـ إن صحّ ذلك الحديث ـ قالوا:"], [2444.6, "إن هذا الحديث يتعارض مع العقل،"], [2448.0, "لأنه حديثٌ يُثبت أن الرحمن يتنفّس في اليمن،"], [2454.0, "فيكون الله عز وجل قد حلّ في بعض مخلوقاته،"], [2459.0, "والعقل يفرض أن الله لا يحلّ في ذاته شيءٌ من مخلوقاته،"], [2464.0, "ولا يحلّ هو في شيءٍ من مخلوقاته؛"], [2471.0, "فهذا العقل يتعارض مع النقل."]], "tr": [[2426.0, "Mesela bize şöyle dediler: Nebî ﷺ'in \"Ben Rahmân'ın nefesini Yemen tarafından hissediyorum\" sözü —eğer bu hadis sahihse—;"], [2437.0, "dediler ki: \"Bu hadis akılla çelişir, çünkü Rahmân'ın Yemen'de nefes aldığını isbat eden bir hadistir."], [2448.0, "O zaman Allah Teâlâ mahlûkatının bir kısmına hulûl etmiş olur."], [2454.0, "Akıl ise Allah'ın zatına mahlûkatından hiçbir şeyin hulûl etmediğini, O'nun da mahlûkatından hiçbir şeye hulûl etmediğini gerektirir. İşte akıl nakille çelişiyor.\""]]}, {"reader": false, "ar": [[2474.0, "قلنا: كذبتَ، والله إنه لا يتعارض معه طرفةَ عين."], [2480.0, "لكنكم فهمتم من قول النبي ﷺ «نَفَس الرحمن» النَّفَسَ الذي هو الشهيق والزفير،"], [2490.0, "وهذا فهمٌ خاطئ؛ وإنما المقصود به تنفيسُ الرحمن عن عباده المؤمنين سيكون من قِبَل اليمن،"], [2500.0, "فهي من «نفّس يُنفّس تنفيسًا»،"], [2505.0, "وليس من النَّفَس الذي هو الشهيق والزفير."]], "tr": [[2474.0, "Dedik ki: Yalan söyledin; vallahi göz açıp kapayıncaya kadar bile onunla çelişmez."], [2480.0, "Ama siz Nebî ﷺ'in \"Rahmân'ın nefesi\" sözünden, soluk alıp vermek olan nefesi anladınız;"], [2480.0, "bu yanlış bir anlayıştır. Kastedilen, Rahmân'ın mümin kullarını ferahlatmasının (tenfîs) Yemen tarafından olacağıdır."], [2490.0, "Bu, \"neffese-yünaffisu-tenfîsen\" (ferahlatmak) kökündendir; soluk alıp vermek olan nefesten değildir."]]}, {"reader": false, "ar": [[2508.0, "وهذا حصل لما تُوفّي رسول الله ﷺ،"], [2514.0, "واستُخلف أبو بكرٍ رضي الله عنه بعده،"], [2517.0, "وكفر من كفر من العرب،"], [2520.0, "وارتدّ كثيرٌ من قبائل العرب،"], [2523.0, "وتجهّزوا لحرب الصحابة في المدينة؛"], [2528.0, "أعظمُ ما فرّج الله به عن المؤمنين في هذه الضائقة كان بأهل اليمن رضي الله عنهم وأرضاهم؛"], [2535.0, "فأهل اليمن لم يرتدّوا كما ارتدّ غيرهم،"], [2540.0, "وقد سخّروا أنفسهم وسلاحهم بين يدي أبي بكرٍ يحاربون معه أهلَ الردّة."], [2546.0, "فنفّس الله عن عباده المؤمنين بأهل اليمن."], [2550.0, "إذن «نَفَس الرحمن من قِبَل اليمن»:"], [2553.0, "أي التنفيس عن عباده."]], "tr": [[2508.0, "Bu, Resûlullah ﷺ vefat edip ondan sonra Ebû Bekir (r.a.) halife olduğunda, Araplardan küfre dönenler küfre dönüp Arap kabilelerinin çoğu irtidat edip Medine'deki sahabeyle savaşmaya hazırlandığında gerçekleşti."], [2523.0, "Allah'ın bu darlıkta müminleri ferahlattığı en büyük şey Yemen halkıyla oldu —Allah onlardan razı olsun ve onları razı etsin—."], [2528.0, "Yemen halkı başkalarının irtidat ettiği gibi irtidat etmedi;"], [2540.0, "kendilerini ve silahlarını Ebû Bekir'in emrine verip onunla birlikte mürtedlerle savaştılar."], [2540.0, "Allah mümin kullarını Yemen halkıyla ferahlattı."], [2546.0, "Demek ki \"Rahmân'ın nefesi Yemen tarafındandır\", yani kullarını ferahlatması (oradandır)."]]}, {"reader": false, "ar": [[2556.0, "ولذلك سُمّي النفاسُ نفاسًا لتنفّس رحمها من الدم الذي كان محتبسًا فيها،"], [2565.0, "فهو من التنفيس، أي التفريج."], [2568.0, "فهل بين الحديث والعقل تعارض؟"], [2574.0, "الجواب: لا. لكن لما نظرت العقول السليمة في النص الصحيح صارت النتائج سليمة."]], "tr": [[2556.0, "Bu yüzden lohusalığa (nifâs), rahmin içinde tutulan kandan ferahlaması sebebiyle \"nifâs\" denmiştir;"], [2565.0, "bu da tenfîs, yani ferahlatma kökündendir."], [2568.0, "Hadis ile akıl arasında çelişki var mı?"], [2574.0, "Cevap: Hayır. Sağlam akıllar sahih nassa bakınca sonuçlar da sağlam oldu."]]}, {"reader": false, "ar": [[2581.0, "قالوا لنا: عندنا حديثٌ يتعارض مع العقل؛"], [2591.0, "فقد روى الإمام مسلمٌ في صحيحه من حديث أبي هريرة رضي الله تعالى عنه:"], [2597.0, "أن الله عز وجل يقول للعبد يوم القيامة:"], [2601.0, "«عبدي، جعتُ فلم تُطعمني؛ عبدي، مرضتُ فلم تعُدني؛ عبدي، استسقيتك فلم تسقني» <span class=\"note\">(Müslim)<\/span>."], [2617.0, "فقالوا: إن هذا الحديث يوجب وصف الله بالمرض والجوع والظمأ،"], [2623.8, "وهي صفاتُ نقص، والعقل يفرض أن الله منزّهٌ عن كل نقص؛"], [2635.0, "فإذن هو حديثٌ يتعارض مع العقل."]], "tr": [[2581.0, "Bize dediler ki: \"Elimizde akılla çelişen bir hadis var."], [2591.0, "İmam Müslim Sahîh'inde Ebû Hüreyre'den (r.a.) rivayet etmiştir ki Allah Teâlâ kıyamet günü kula şöyle der:"], [2597.0, "'Kulum! Acıktım, beni doyurmadın. Kulum!"], [2601.0, "Hastalandım, beni ziyaret etmedin. Kulum!"], [2601.0, "Senden su istedim, bana su vermedin.' <span class=\"note\">(Müslim)<\/span> Bu hadis Allah'ı hastalık, açlık ve susuzlukla nitelemeyi gerektirir;"], [2617.0, "bunlar noksanlık sıfatlarıdır. Akıl ise Allah'ın her noksanlıktan münezzeh olmasını gerektirir."], [2635.0, "O hâlde bu hadis akılla çelişir.\""]]}, {"reader": false, "ar": [[2639.0, "قلنا: كذبتَ؛ فنُقسم بالله عز وجل أنه متوافقٌ مع العقل كلَّ الاتفاق،"], [2654.0, "ولكنكم فهمتم من نسبة الجوع والظمأ والمرض إلى الله أنها نسبةُ اتصاف،"], [2660.0, "وهذه النسبة لا يريدها رسول الله ﷺ،"], [2666.8, "وحاشاه أن يقصدها؛ فإن الله لا يمرض،"], [2671.5, "ولا يجوع، ولا يستسقي،"], [2674.0, "فهو الذي يُطعِم ولا يُطعَم،"], [2678.0, "وهو الصمد الذي لا جوف له،"], [2680.8, "فلا يحتاج إلى أكلٍ ولا إلى شرب:"], [2684.0, "<span class=\"ayah\">﴿مَا أُرِيدُ مِنْهُم مِّن رِّزْقٍ وَمَا أُرِيدُ أَن يُطْعِمُونِ ۝ إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ﴾<\/span> <span class=\"ref\">[الذاريات: ٥٧–٥٨]<\/span>."], [2692.0, "والله لا يمرض، إذ الذي يمرض لا يصلح أن يكون الله،"], [2698.1, "ولا يصلح أن يكون الربَّ،"]], "tr": [[2639.0, "Dedik ki: Yalan söyledin. Allah Teâlâ'ya yemin ederiz ki bu hadis akılla tamamen uyumludur."], [2654.0, "Ama siz açlığın, susuzluğun ve hastalığın Allah'a nispet edilmesinden bunun bir nitelenme nispeti olduğunu anladınız."], [2660.0, "Resûlullah ﷺ bu nispeti kastetmez;"], [2666.8, "onu kastetmekten münezzehtir. Çünkü Allah hastalanmaz, acıkmaz, su istemez."], [2678.0, "O, doyuran ama doyurulmayandır. O, içi boş olmayan Samed'dir;"], [2680.8, "yemeye de içmeye de ihtiyacı yoktur."], [2684.0, "<span class=\"ayah\">﴿Ben onlardan rızık istemiyorum, beni doyurmalarını da istemiyorum. Şüphesiz rızık veren, güç ve kuvvet sahibi olan ancak Allah'tır﴾<\/span> [Zâriyât 57–58]."], [2692.0, "Allah hastalanmaz; çünkü hastalanan, ilah olmaya da Rab olmaya da elverişli değildir —"]]}]}, {"ts": "45:00", "title": "15. Külliye (sonu) · 16. ve 17. Külliyeler: Hakikate ve vehme götüren akîdeler", "paras": [{"reader": false, "ar": [[2700.0, "ولا يستسقي، إذ الذي يحتاج إلى الاستسقاء إنما هو المخلوق الضعيف."], [2708.0, "فإن قلت: ولماذا الحديث ينسبها لله؟"], [2714.0, "فنقول: إن الأدلة قد نزلت على استعمالات العرب،"], [2719.0, "ومن عظيم رحمة الرجل المعظَّم أن يجعل حاجة الفقير كحاجته؛"], [2726.0, "فالرجل المعظَّم لم يحتج،"], [2728.4, "ولكن لحثّ الناس على كشف كربته جعل حاجته كحاجته."], [2735.0, "كأن يقول ملِك الدولة:"], [2737.9, "من يُطعمني هذه الليلة؟"], [2741.0, "فيقول الرعية: وهل أنت جائع؟"], [2744.0, "فيقول: لا، ولكن كلُّ من أطعم فقيرًا في بلدتي فكأنما أطعمني."], [2751.0, "هل هذا دليلٌ على أنه متّصفٌ بالجوع؟ الجواب: لا."]], "tr": [[2700.0, "— ve su istemez; çünkü su istemeye muhtaç olan ancak zayıf mahlûktur."], [2700.0, "\"O zaman hadis neden bunları Allah'a nispet ediyor?\" dersen, deriz ki:"], [2708.0, "Deliller Arapların kullanım üsluplarına göre inmiştir."], [2714.0, "Saygın bir kişinin büyük merhametindendir ki fakirin ihtiyacını kendi ihtiyacı gibi kılar."], [2719.0, "Saygın kişi muhtaç olmamıştır; ama insanları onun sıkıntısını gidermeye teşvik etmek için onun ihtiyacını kendi ihtiyacı gibi kılmıştır."], [2735.0, "Tıpkı devletin hükümdarının \"Bu gece beni kim doyurur?\" demesi gibi."], [2741.0, "Tebaa \"Aç mısın?\" der. O da \"Hayır, ama ülkemde bir fakiri doyuran herkes sanki beni doyurmuş gibidir\" der."], [2751.0, "Bu, onun açlıkla nitelendiğine delil midir? Cevap: Hayır."]]}, {"reader": false, "ar": [[2756.0, "ولكن هكذا شأنُ الملك العظيم الرحيم الرفيق الودود،"], [2762.0, "فهو يريد أن يُغاث هذا الملهوف،"], [2766.0, "فجعل لهفته كلهفته، يريد من الناس أن يُطعموا هذا الجائع،"], [2773.0, "فجعل جوعه كجوعه، كما قال الله عز وجل:"], [2777.0, "<span class=\"ayah\">﴿مَّن ذَا الَّذِي يُقْرِضُ اللَّهَ قَرْضًا حَسَنًا﴾<\/span> <span class=\"ref\">[البقرة: ٢٤٥]<\/span>."], [2782.0, "فهل الله يستقرض أو يحثّ على القرض؟"], [2785.0, "فهل الله يجوع أو يحثّ على إطعام الجائعين؟"], [2792.0, "أجيبوا. ـ يحثّ على إطعام الجائعين."], [2794.0, "ـ وهل الله يمرض أو يحثّ على عيادة المرضى؟"], [2798.0, "ـ يحثّ على عيادة المرضى."], [2801.0, "ـ وهل الله يستسقي أو يحثّ على إرواء العطشى؟ الجواب: هو الثاني."]], "tr": [[2756.0, "Ama büyük, merhametli, şefkatli ve seven hükümdarın hâli böyledir:"], [2756.0, "Bu çaresize yardım edilmesini ister, onun ızdırabını kendi ızdırabı gibi kılar."], [2766.0, "İnsanların bu açı doyurmasını ister, onun açlığını kendi açlığı gibi kılar."], [2773.0, "Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿Kim Allah'a güzel bir borç verir?﴾<\/span> [Bakara 245]."], [2777.0, "Allah borç mu istiyor, yoksa borç vermeye mi teşvik ediyor?"], [2782.0, "Allah acıkıyor mu, yoksa açları doyurmaya mı teşvik ediyor?"], [2785.0, "Cevap verin. — Açları doyurmaya teşvik ediyor."], [2792.0, "— Allah hastalanıyor mu, yoksa hastaları ziyaret etmeye mi teşvik ediyor?"], [2794.0, "— Hastaları ziyaret etmeye teşvik ediyor."], [2798.0, "— Allah su istiyor mu, yoksa susuzları suya kandırmaya mı teşvik ediyor? Cevap: İkincisi."]]}, {"reader": false, "ar": [[2809.0, "فأنتم عربٌ تفهمون الأدلة على فهم العرب،"], [2814.0, "ولكن هؤلاء أهل البدع لا يفهمون من نسبة هذه الصفات لله إلا نسبةَ اتصافٍ بها،"], [2822.0, "فأخرجوها عن مدلولها الصحيح البديع الذي يُبرز عظيمَ رحمة هذا الربّ بعباده،"], [2830.0, "وعظيمَ حرصه عز وجل على إطعام الجائعين فلا يبقى في أرضه جائع،"], [2838.0, "وعلى أن يُكسى العاري فلا يبقى في أرضه عارٍ،"], [2845.0, "وعلى أن يُعاد المريض فلا يبقى في المستشفى على سريره لا يعوده أحد."], [2853.0, "فالحديث إنما يدلّ على الترغيب في هذه الأعمال فقط."], [2860.0, "فهل الحديث مع هذا الفهم يتعارض مع العقل؟ الجواب: لا."]], "tr": [[2809.0, "Sizler Araplarsınız; delilleri Arapların anlayışına göre anlarsınız."], [2814.0, "Ama bu bid'at ehli, bu sıfatların Allah'a nispetinden ancak onlarla nitelenme nispetini anlarlar."], [2822.0, "Böylece onu sahih ve harika anlamından çıkardılar;"], [2822.0, "oysa o anlam, bu Rab'bin kullarına olan büyük rahmetini ve Allah Teâlâ'nın açları doyurmaya —yeryüzünde aç kalmasın diye—, çıplağın giydirilmesine —yeryüzünde çıplak kalmasın diye— ve hastanın ziyaret edilmesine —hastanede yatağında kimse onu ziyaret etmeden kalmasın diye— olan büyük düşkünlüğünü ortaya koyar."], [2853.0, "Hadis sadece bu amellere teşvike delâlet eder."], [2860.0, "Hadis bu anlayışla akılla çelişir mi? Cevap: Hayır."]]}, {"reader": false, "ar": [[2865.0, "ثم نقول: لو كلّفتم أنفسكم بقراءة آخر الحديث لتبيّن لكم من الذي جاع حقيقةً،"], [2873.0, "في قوله: «وكيف أُطعمك وأنت ربُّ العالمين؟ قال: أما علمتَ أن عبدي فلانًا استطعمك فلم تُطعمه؟ أما إنك لو أطعمته لوجدتَ ذلك عندي»."], [2885.0, "من الذي جاع حقيقةً:"], [2888.0, "الربّ أو العبد؟ ـ العبد."], [2890.0, "ـ «وكيف أسقيك وأنت ربُّ العالمين؟ قال: أما علمتَ أن عبدي فلانًا استسقاك فلم تسقه؟ أما إنك لو سقيته لوجدتَ ذلك عندي»."], [2902.0, "فمن الذي يستسقي حقيقةً:"], [2904.0, "الربّ أم العبد؟ ـ العبد."]], "tr": [[2865.0, "Sonra deriz ki: Hadisin sonunu okuma zahmetine girseydiniz, gerçekte kimin acıktığı size açıkça ortaya çıkardı."], [2873.0, "Şu sözünde: \"(Kul) 'Sen âlemlerin Rabbi iken seni nasıl doyurayım?' der."], [2873.0, "(Allah) buyurur: 'Bilmedin mi, falan kulum senden yemek istedi de onu doyurmadın."], [2873.0, "Bilmez misin, onu doyursaydın bunu benim katımda bulurdun.'\" Gerçekte kim acıktı:"], [2888.0, "Rab mi, kul mu? — Kul."], [2890.0, "— \"'Sen âlemlerin Rabbi iken sana nasıl su vereyim?' (Allah) buyurur:"], [2890.0, "'Bilmedin mi, falan kulum senden su istedi de ona su vermedin."], [2890.0, "Bilmez misin, ona su verseydin bunu benim katımda bulurdun.'\" Gerçekte kim su istiyor:"], [2904.0, "Rab mi, kul mu? — Kul."]]}, {"reader": false, "ar": [[2908.5, "«وكيف أعودك وأنت ربُّ العالمين؟ قال: أما علمتَ أن عبدي فلانًا مرض فلم تعُده؟ أما إنك لو عُدتَه لوجدتني عنده» ـ أي بثوابي ورحمتي،"], [2920.8, "أو بملائكتي، وجودًا يليق بجلاله وعظمته،"], [2924.0, "كما قال الله عز وجل:"], [2926.3, "<span class=\"ayah\">﴿وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ الْوَرِيدِ﴾<\/span> <span class=\"ref\">[ق: ١٦]<\/span>،"], [2929.0, "أي قُربُنا بملائكتنا. فمن الذي مرض حقيقةً:"], [2935.0, "الربّ أم العبد؟ الجواب:"], [2937.5, "العبد. هذا هو الفهم الصحيح الذي يجعل النص متّسقًا مع العقل،"], [2943.6, "ومتّفقًا معه كلَّ الموافقة."]], "tr": [[2908.5, "\"'Sen âlemlerin Rabbi iken seni nasıl ziyaret edeyim?' (Allah) buyurur:"], [2908.5, "'Bilmedin mi, falan kulum hastalandı da onu ziyaret etmedin."], [2908.5, "Bilmez misin, onu ziyaret etseydin beni onun yanında bulurdun.'\" Yani sevabımla ve rahmetimle ya da meleklerimle;"], [2924.0, "O'nun celâline ve azametine yakışır bir bulunuşla."], [2926.3, "Allah Teâlâ'nın <span class=\"ayah\">﴿Biz ona şah damarından daha yakınız﴾<\/span> [Kâf 16] buyurduğu gibi;"], [2929.0, "yani meleklerimizle olan yakınlığımız. Gerçekte kim hastalandı:"], [2937.5, "Rab mi, kul mu? Cevap:"], [2937.5, "Kul. İşte nassı akılla uyumlu ve onunla tam bir mutabakat içinde kılan sahih anlayış budur."]]}, {"reader": false, "ar": [[2946.0, "وإذا أردتم أن تعرفوا أمثلةً أكثر من هذه فراجعوا ذلك الكتاب الذي ذكرتُه لكم،"], [2953.0, "ففيه بردُ اليقين، وتتبّعٌ طويلٌ لكل ما يُدّعى من النصوص أنه متعارضٌ مع العقل،"], [2962.0, "وقد أجبتُ عنها بإذن الله عز وجل. والله أعلم."]], "tr": [[2946.0, "Bundan daha fazla örnek öğrenmek isterseniz size bahsettiğim o kitaba bakın."], [2946.0, "Onda yakînin serinliği ve akılla çeliştiği iddia edilen bütün nasların uzun bir takibi vardır."], [2953.0, "Allah Teâlâ'nın izniyle onlara cevap verdim. Allah en iyisini bilir."]]}, {"reader": true, "ar": [[2965.2, "أحسن الله إليكم. الكلية السادسة عشرة:"], [2972.0, "كلُّ عقيدةٍ توصل لحقيقةٍ فعقيدةٌ صحيحة. كلُّ عقيدةٍ توصل لحقيقةٍ فعقيدةٌ صحيحة."], [2984.0, "<b>الكلية السابعة عشرة: كلُّ عقيدةٍ توصل لخيالٍ ووهمٍ فباطلة.<\/b>"]], "tr": [[2965.2, "Allah size iyilik etsin. On altıncı külliye:"], [2972.0, "Bir hakikate götüren her akîde sahih bir akîdedir.<b> <\/b>On yedinci külliye:"], [2984.0, "Bir hayale ve vehme götüren her akîde bâtıldır."]]}, {"reader": false, "ar": [[2990.0, "الكليتان متقاربتان، وشرحُهما سيكون واحدًا:"], [2997.0, "فكلُّ عقيدةٍ توصلك إلى حقيقةٍ فعقيدةٌ صحيحة،"], [3001.0, "وكلُّ عقيدةٍ توصلك إلى خيالٍ ووهمٍ فعقيدةٌ باطلة."]], "tr": [[2990.0, "Bu iki külliye birbirine yakındır;"], [2990.0, "şerhleri tek olacak. Seni bir hakikate götüren her akîde sahih bir akîdedir;"], [3001.0, "seni bir hayale ve vehme götüren her akîde bâtıl bir akîdedir."]]}]}, {"ts": "50:00", "title": "16–17. Külliyeler (devam): Kur'an'ın vehme dayalı inançları iptali", "paras": [{"reader": false, "ar": [[3006.0, "وهذا مما يُعرف به صحةُ الاعتقاد من عدمه؛"], [3010.0, "فمعرفةُ صحة الاعتقاد من بطلانه له طرقٌ كثيرة،"], [3018.0, "ومنها نهاياتُ هذا الاعتقاد:"], [3021.0, "فإذا أوصلني هذا الاعتقاد إلى نهايةٍ حقيقيةٍ واقعية فإذن هو اعتقادٌ صحيح،"], [3028.0, "وإذا أوصلني هذا الاعتقاد إلى نهايةٍ خياليةٍ توهّمية فهو عقيدةٌ فاسدة."], [3035.0, "فكلُّ عقيدةٍ توصلك إلى حقيقةٍ واقعية فصحيحة،"], [3041.0, "وكلُّ عقيدةٍ توصلك إلى خيالٍ ووهمٍ فعقيدةٌ باطلة."]], "tr": [[3006.0, "Bu, bir inancın sahih olup olmadığının bilindiği şeylerdendir."], [3010.0, "Bir inancın sahihliğini bâtıllığından ayırt etmenin pek çok yolu vardır;"], [3018.0, "bunlardan biri de o inancın vardığı sonlardır."], [3021.0, "Bu inanç beni hakiki, gerçek bir sona ulaştırıyorsa o hâlde sahih bir inançtır."], [3028.0, "Bu inanç beni hayalî, vehmî bir sona ulaştırıyorsa fâsid bir akîdedir.
