"], [3035.0, "Seni gerçek bir hakikate ulaştıran her akîde sahihtir;"], [3035.0, "seni bir hayale ve vehme ulaştıran her akîde bâtıl bir akîdedir."]]}, {"reader": false, "ar": [[3045.0, "والله عز وجل يستدلّ في القرآن على بطلان كثيرٍ من العقائد بأنها توصل أصحابها إلى وهمٍ وخيال،"], [3055.0, "كما قال الله عز وجل:"], [3057.0, "<span class=\"ayah\">﴿وَالَّذِينَ تَدْعُونَ مِن دُونِهِ﴾<\/span>."], [3059.0, "ولماذا يدعونهم من دونه؟"], [3065.0, "لأنهم يعتقدون أنهم يملكون؛"], [3068.0, "فهم يعتقدون في معبوداتهم من دون الله أنها تملك،"], [3073.0, "وتلك العقيدة أوصلتهم إلى نهايةٍ خيالية،"], [3076.0, "لأنهم لا يملكون. قال الله عز وجل:"], [3079.0, "<span class=\"ayah\">﴿وَالَّذِينَ تَدْعُونَ مِن دُونِهِ مَا يَمْلِكُونَ مِن قِطْمِيرٍ﴾<\/span> <span class=\"ref\">[فاطر: ١٣]<\/span>؛"], [3083.0, "وكنتم تعتقدون أنهم يملكون،"], [3085.5, "فأوصلكم هذا الاعتقاد إلى خيالٍ ووهم، فهو عقيدةٌ فاسدة."]], "tr": [[3045.0, "Allah Teâlâ Kur'an'da pek çok akîdenin bâtıllığına, sahiplerini bir vehme ve hayale götürmesiyle delil getirir."], [3045.0, "Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿O'nu bırakıp da dua ettikleriniz…﴾<\/span>."], [3057.0, "Onlara neden Allah'ı bırakıp dua ediyorlar?"], [3059.0, "Çünkü onların (bir şeye) sahip olduklarına inanıyorlar."], [3068.0, "Allah'ı bırakıp taptıkları şeylerin sahip olduğuna inanıyorlar;"], [3073.0, "bu akîde onları hayalî bir sona götürdü, çünkü onlar hiçbir şeye sahip değildir."], [3076.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿O'nu bırakıp da dua ettikleriniz bir çekirdek zarına bile sahip değildir﴾<\/span> [Fâtır 13]."], [3083.0, "Onların sahip olduğuna inanıyordunuz; bu inanç sizi bir hayale ve vehme götürdü;"], [3085.5, "o hâlde fâsid bir akîdedir."]]}, {"reader": false, "ar": [[3091.0, "<span class=\"ayah\">﴿إِن تَدْعُوهُمْ لَا يَسْمَعُوا دُعَاءَكُمْ﴾<\/span>،"], [3094.5, "وقد كنتم تعتقدون أنهم يسمعون،"], [3099.0, "فأوصلكم هذا الاعتقاد إلى نهايةٍ خياليةٍ وهميةٍ لا حقيقة لها؛"], [3104.0, "الحقيقة أنهم لا يسمعون."], [3106.0, "<span class=\"ayah\">﴿وَلَوْ سَمِعُوا مَا اسْتَجَابُوا لَكُمْ﴾<\/span> <span class=\"ref\">[فاطر: ١٤]<\/span>،"], [3109.6, "وكنتم تعتقدون أنهم يسمعون،"], [3114.0, "ولهم القدرة على أن يجيبوا دعاءكم،"], [3118.0, "فأوصلكم هذا الاعتقاد فيهم إلى خيال."], [3122.0, "جلستم طولَ أعماركم تُعفّرون وجوهكم على تراب قبورهم،"], [3127.0, "وتطوفون حولهم، وهرم عليه كبيرُكم حتى شاب،"], [3133.0, "وهو لا يزال يأتي إلى القبر من ستين أو سبعين سنة،"], [3138.0, "والقبر لا يستجيب له."], [3140.0, "عاش حياته في وهم،"], [3143.0, "عاش حياته في خيال،"], [3145.0, "لأنها ليست عقيدةً صحيحة."]], "tr": [[3091.0, "<span class=\"ayah\">﴿Onlara dua etseniz duanızı işitmezler﴾<\/span>."], [3091.0, "Oysa işittiklerine inanıyordunuz; bu inanç sizi hakikati olmayan hayalî, vehmî bir sona götürdü."], [3099.0, "Hakikat şu ki onlar işitmezler."], [3104.0, "<span class=\"ayah\">﴿İşitseler bile size cevap veremezler﴾<\/span> [Fâtır 14]."], [3106.0, "Oysa işittiklerine ve duanıza cevap vermeye güçlerinin yettiğine inanıyordunuz;"], [3114.0, "onlar hakkındaki bu inanç sizi bir hayale götürdü."], [3118.0, "Bütün ömrünüz boyunca yüzlerinizi kabirlerinin toprağına sürdünüz, etraflarında tavaf ettiniz;"], [3127.0, "büyüğünüz bunun üzerine ihtiyarladı, saçı ağardı."], [3127.0, "Altmış ya da yetmiş yıldır hâlâ kabre gelir, kabir ise ona cevap vermez."], [3138.0, "Hayatını bir vehim içinde, bir hayal içinde yaşadı;"], [3143.0, "çünkü bu sahih bir akîde değildir."]]}, {"reader": false, "ar": [[3148.0, "لكن إذا اعتقدتم أني أنا المالك فعقيدتكم حق،"], [3152.0, "لأنها توصلكم إلى حق،"], [3154.0, "إذ الملكُ بيدي. وإذا اعتقدتم أني أُجيب الدعوات فهذه عقيدةٌ حق،"], [3162.0, "لأنني فعلًا أُجيب الدعوات."], [3164.0, "وإذا اعتقدتم أنني مستوٍ على العرش فهي عقيدةٌ حق،"], [3168.8, "لأنني فعلًا وحقيقةً مستوٍ على العرش."], [3172.0, "لكن كثيرٌ من الناس يعتقد عقائد توصله في النهايات إلى خيالٍ ووهمٍ لا حقيقة له."]], "tr": [[3148.0, "(Allah adeta şöyle der:) Ama benim tek sahip (Mâlik) olduğuma inanırsanız akîdeniz haktır, çünkü sizi bir hakka götürür;"], [3154.0, "zira mülk benim elimdedir. Duaları kabul edenin ben olduğuma inanırsanız bu hak bir akîdedir, çünkü gerçekten duaları ben kabul ederim."], [3164.0, "Arş'a istivâ ettiğime inanırsanız bu hak bir akîdedir, çünkü gerçekten ve hakikaten Arş'a istivâ etmişimdir."], [3172.0, "Ama insanların çoğu, sonunda onları hakikati olmayan bir hayale ve vehme götüren akîdelere inanır."]]}, {"reader": false, "ar": [[3180.0, "فمن خصائص الاعتقاد الصحيح أنه يُبنى على حقيقةٍ واقعية،"], [3188.0, "ومن علامات الاعتقاد الباطل أنه مبنيٌّ على خيالٍ ووهم؛"], [3196.0, "تعيش حياتك في خيال،"], [3198.0, "تعيش حياتك في أوهام."], [3200.0, "والله عز وجل من محبّته لعباده أرسل الرسل ليُخرجوهم من تلك العقائد الوهمية إلى العقائد الحقيقية،"], [3210.0, "لأنه لا يريد أن تُعمّر عقلَك وساوسُ الأوهام وزخارفُ الخيالات."], [3221.0, "الله ما خلق العقل لتُعشّش فيه الخيالات،"], [3225.0, "بل ليُزرع بالأمور الحقيقيات،"], [3228.0, "ولا خلق القلب ليعتقد العقائد الوهمية،"], [3232.0, "وإنما ليعتقد العقائد الحقيقية الواقعية."]], "tr": [[3180.0, "Sahih inancın özelliklerinden biri, gerçek bir hakikat üzerine kurulmasıdır."], [3188.0, "Bâtıl inancın alametlerinden biri de hayal ve vehim üzerine kurulu olmasıdır:"], [3196.0, "Hayatını bir hayal içinde, vehimler içinde yaşarsın."], [3200.0, "Allah Teâlâ kullarını sevdiği için, onları o vehmî akîdelerden hakiki akîdelere çıkarsınlar diye resuller göndermiştir."], [3210.0, "Çünkü aklının vehimlerin vesveseleri ve hayallerin süsleriyle dolmasını istemez."], [3221.0, "Allah aklı hayaller içinde yuvalansın diye değil, hakiki şeylerle ekilsin diye yarattı."], [3228.0, "Kalbi de vehmî akîdelere inansın diye değil, hakiki ve gerçek akîdelere inansın diye yarattı."]]}, {"reader": false, "ar": [[3235.0, "فأنزل الله الكتب لتُخرج الناس من العقائد التوهّمية إلى العقائد الحقيقية،"], [3242.0, "وأرسل الرسل لتُخرج الناس من العقائد التوهّمية إلى العقائد الحقيقية؛"], [3249.0, "فقال (ما معناه): لا تعبدوهم من دوني فإنهم لا يملكون لكم شيئًا،"], [3253.3, "واعبدوني فأنا المالك لكل شيء؛"], [3255.9, "فأخرجهم من وهمٍ إلى حقيقة."], [3258.0, "وأخبر على لسان رسله أن تلك المعبودات لا تنصركم ولا ترزقكم،"], [3266.0, "بل اعبدوني فأنا الرازق وأنا الناصر حقيقةً؛"], [3269.7, "اخرجوا من أوهام عقولكم إلى الحقائق."]], "tr": [[3235.0, "Allah, insanları vehmî akîdelerden hakiki akîdelere çıkarsınlar diye kitaplar indirdi;"], [3235.0, "insanları vehmî akîdelerden hakiki akîdelere çıkarsınlar diye resuller gönderdi."], [3242.0, "(Manen) şöyle buyurdu: \"Beni bırakıp onlara ibadet etmeyin, çünkü onlar size hiçbir şeye sahip olamazlar;"], [3249.0, "bana ibadet edin, çünkü her şeyin sahibi benim.\" Onları bir vehimden bir hakikate çıkardı."], [3255.9, "Resullerinin diliyle o mabudların size ne yardım ettiğini ne de rızık verdiğini haber verdi:"], [3258.0, "\"Bana ibadet edin; gerçekte rızık veren de yardım eden de benim. Akıllarınızın vehimlerinden hakikatlere çıkın.\""]]}, {"reader": false, "ar": [[3274.0, "لا تعتقدوا في البومة أنها تجلب الخير أو تدفع الشر،"], [3279.0, "هذا وهم؛ الشرُّ والخير بيد الله عز وجل،"], [3283.0, "الحسنات والسيئات هو الذي يدبّرها ويصرّفها."], [3287.0, "قال عليه الصلاة والسلام:"], [3289.7, "«لا عدوى» <span class=\"note\">(Buhârî, Müslim)<\/span>، أي أن العدوى لا تنتقل بذاتها،"], [3293.0, "وإنما تنتقل بتقدير الله،"], [3295.0, "فالأمر كلُّه بيده. «ولا طِيَرة»:"], [3298.0, "أي لا تتطيّر بمأكولٍ توهّمًا وخيالًا،"]], "tr": [[3274.0, "Baykuşun hayır getirdiğine ya da şerri defettiğine inanmayın;"], [3274.0, "bu bir vehimdir. Şer de hayır da Allah Teâlâ'nın elindedir;"], [3279.0, "iyilikleri ve kötülükleri tedbir eden ve evirip çeviren O'dur."], [3283.0, "Nebî ﷺ buyurdu: \"Bulaşma (kendiliğinden) yoktur\" <span class=\"note\">(Buhârî, Müslim)<\/span>;"], [3289.7, "yani bulaşma kendiliğinden geçmez, ancak Allah'ın takdiriyle geçer;"], [3293.0, "işin tamamı O'nun elindedir. \"Uğursuzluk (tıyara) yoktur\":"], [3295.0, "yani vehme ve hayale kapılarak bir yiyecekten uğursuzluk çıkarma —"]]}]}, {"ts": "55:00", "title": "16–17. Külliyeler (sonu) · 18. Külliye: Tahrif ve ta'til farkı", "paras": [{"reader": false, "ar": [[3303.0, "ولا بمشروبٍ توهّمًا وخيالًا،"], [3306.0, "ولا بحيوانٍ <span class=\"q\">؟ 55:06<\/span> توهّمًا وخيالًا،"], [3308.0, "ولا بمكانٍ توهّمًا وخيالًا،"], [3311.0, "ولا بمرئيٍّ أو مسموعٍ توهّمًا وخيالًا."], [3314.0, "لا تظنّوا أن الغراب يجلب لكم الخيرات أو يجلب لكم الضرر،"], [3320.0, "لا تتوهّموا أن شهر صفر يجلب الشرَّ لمن تزوّج أو تاجر أو سافر فيه."], [3330.0, "وقد كانت الجاهلية قد عُمّرت عقولها وقلوبها بتلك العقائد التوهّمية الخيالية،"], [3335.0, "فجاء الدليل ليُخرج الناس من الخيال إلى الحقائق،"], [3339.0, "ومن الوهم إلى الواقع."], [3342.0, "أنتم معي في هذا؟"]], "tr": [[3303.0, "— ne vehme ve hayale kapılarak bir içecekten, ne vehme ve hayale kapılarak bir hayvandan <span class=\"q\">؟<\/span>, ne vehme ve hayale kapılarak bir mekândan, ne de vehme ve hayale kapılarak görülen veya işitilen bir şeyden uğursuzluk çıkar."], [3314.0, "Karganın size hayırlar ya da zarar getirdiğini sanmayın."], [3320.0, "Safer ayının, o ayda evlenen, ticaret yapan veya yolculuğa çıkan kişiye şer getirdiğini vehmetmeyin."], [3330.0, "Cahiliye, akıllarını ve kalplerini bu vehmî-hayalî akîdelerle doldurmuştu."], [3335.0, "Delil, insanları hayalden hakikatlere, vehimden gerçeğe çıkarmak için geldi. Bu konuda benimle misiniz?"]]}, {"reader": false, "ar": [[3344.0, "فإذن من خصائص العقيدة الصحيحة أن نهايتها حقيقية:"], [3348.0, "أنا مؤمنٌ بأن هناك حسابًا يوم القيامة،"], [3351.0, "وفي الحقيقة في النهاية أن هناك حسابًا."], [3353.0, "أنا مؤمنٌ بأن هناك ميزانًا سيُنصب يوم القيامة يُوزن فيه العملُ والعاملُ وصحيفةُ العمل،"], [3361.0, "وهذا هو حقيقةٌ <span class=\"q\">؟ 56:01<\/span>. أنا مؤمنٌ بأن القبر فيه سؤالٌ ونعيمٌ أو عذاب،"], [3367.0, "وتلك حقيقةٌ واقعية. لكن أنت تؤمن بأن المقبور يملك لك رزقًا،"], [3375.0, "هذا خيالٌ وتوهّم؛ وأن المقبور يملك لك عافيةً وصحةً وولدًا، هذا خيالٌ وتوهّم."]], "tr": [[3344.0, "Demek ki sahih akîdenin özelliklerinden biri, sonunun hakiki olmasıdır."], [3348.0, "Kıyamet günü bir hesap olduğuna inanıyorum;"], [3351.0, "sonunda gerçekten bir hesap vardır."], [3351.0, "Kıyamet günü amelin, amel edenin ve amel defterinin tartılacağı bir mizanın kurulacağına inanıyorum;"], [3353.0, "bu bir hakikattir <span class=\"q\">؟<\/span>. Kabirde sorgu, nimet ya da azap olduğuna inanıyorum;"], [3361.0, "bu da gerçek bir hakikattir."], [3361.0, "Ama sen kabirdekinin sana rızık verebileceğine inanıyorsun;"], [3367.0, "bu bir hayal ve vehimdir."], [3375.0, "Kabirdekinin sana afiyet, sağlık ve evlat verebileceğine inanıyorsun;"], [3375.0, "bu bir hayal ve vehimdir."]]}, {"reader": false, "ar": [[3385.0, "ولذلك الله عز وجل ينفي عبادة هذه الأشياء بتصحيح <span class=\"q\">؟ 56:29<\/span> الأوهام والخيالات فيها."], [3392.0, "قال الله عز وجل:"], [3394.0, "<span class=\"ayah\">﴿وَمَنْ أَضَلُّ مِمَّن يَدْعُو مِن دُونِ اللَّهِ مَن لَّا يَسْتَجِيبُ لَهُ إِلَىٰ يَوْمِ الْقِيَامَةِ﴾<\/span> <span class=\"ref\">[الأحقاف: ٥]<\/span>،"], [3401.0, "وقد كان في الدنيا يدعوه يعتقد أنه يستجيب له."], [3405.1, "اخرجوا من هذا الخيال،"], [3408.0, "لماذا تبقون فيه؟ قال الله عز وجل عن إبراهيم:"], [3413.0, "<span class=\"ayah\">﴿يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ وَلَا يُبْصِرُ وَلَا يُغْنِي عَنكَ شَيْئًا﴾<\/span> <span class=\"ref\">[مريم: ٤٢]<\/span>."]], "tr": [[3385.0, "Bu yüzden Allah Teâlâ bu şeylere ibadeti, onlar hakkındaki vehim ve hayalleri düzelterek <span class=\"q\">؟<\/span> nefyeder."], [3392.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Allah'ı bırakıp da kıyamet gününe kadar kendisine cevap veremeyecek olanlara dua edenden daha sapık kim vardır?﴾<\/span> [Ahkâf 5]."], [3394.0, "Oysa dünyada ona dua ediyor, ona cevap verdiğine inanıyordu."], [3405.1, "Bu hayalden çıkın; neden onun içinde kalıyorsunuz?"], [3408.0, "Allah Teâlâ İbrahim hakkında şöyle buyurdu:"], [3413.0, "<span class=\"ayah\">﴿Babacığım! İşitmeyen, görmeyen ve sana hiçbir fayda sağlamayan şeylere niçin tapıyorsun?﴾<\/span> [Meryem 42]."]]}, {"reader": false, "ar": [[3419.0, "قال الله عز وجل:"], [3423.0, "<span class=\"ayah\">﴿قُلْ أَفَرَأَيْتُم مَّا تَدْعُونَ مِن دُونِ اللَّهِ إِنْ أَرَادَنِيَ اللَّهُ بِضُرٍّ هَلْ هُنَّ كَاشِفَاتُ ضُرِّهِ أَوْ أَرَادَنِي بِرَحْمَةٍ هَلْ هُنَّ مُمْسِكَاتُ رَحْمَتِهِ﴾<\/span> <span class=\"ref\">[الزمر: ٣٨]<\/span>،"], [3434.0, "وقد كانوا هم يعتقدون أنها تُمسك وترزق وتنصر وتُعطي وغير ذلك."], [3440.0, "فمقصود إرسال الرسل وإنزال الكتب هو إخراج الناس من الأوهام إلى الحقائق."]], "tr": [[3419.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿De ki: Allah'ı bırakıp da dua ettiklerinizi gördünüz mü? Allah bana bir zarar dilerse, onlar O'nun zararını giderebilirler mi? Ya da bana bir rahmet dilerse, onlar O'nun rahmetini engelleyebilirler mi?﴾<\/span> [Zümer 38]."], [3423.0, "Oysa onlar o şeylerin (rahmeti) engellediğine, rızık verdiğine, yardım ettiğine, verdiğine ve benzerine inanıyorlardı."], [3434.0, "Resullerin gönderilmesinin ve kitapların indirilmesinin maksadı, insanları vehimlerden hakikatlere çıkarmaktır."]]}, {"reader": false, "ar": [[3448.0, "ولو تأمّلتم أحوال الناس في كل مكان ـ في آسيا،"], [3451.9, "في أمريكا، في أفريقيا،"], [3453.7, "في كل مكان ـ لوجدتم كثيرًا من الناس لا يزالون رُكّعًا سُجّدًا حول القبور،"], [3458.0, "لا يزالون يعلّقون التمائم ظنًّا منهم أنها تجلب لهم الخير وتدفع عنهم الشر؛"], [3465.0, "عقائدُ وهميةٌ خيالية. يقول عليه الصلاة والسلام:"], [3469.2, "«انزِعها عنك، فإنها لا تزيدك إلا وهنًا» <span class=\"note\">(Ahmed; İbn Mâce)<\/span>،"], [3473.0, "ضعفًا في العقيدة وضعفًا في التوكّل."]], "tr": [[3448.0, "Her yerdeki —Asya'da, Amerika'da, Afrika'da, her yerdeki— insanların hâllerini düşünseniz, insanların çoğunun hâlâ kabirlerin etrafında rükû ve secde ettiğini, hayır getirip şerri defettiğini sanarak hâlâ muskalar astığını görürdünüz."], [3458.0, "Vehmî, hayalî akîdeler! Nebî ﷺ buyuruyor:"], [3465.0, "\"Onu çıkar, çünkü o sana zayıflıktan başka bir şey katmaz\" <span class=\"note\">(Ahmed; İbn Mâce)<\/span>;"], [3469.2, "akîdede zayıflık ve tevekkülde zayıflık."]]}, {"reader": false, "ar": [[3475.0, "فما قرّر الشارعُ بابَ التمائم إلا لإخراج الناس من العقائد الخيالية التوهّمية في التمائم إلى أنها لا تملك شيئًا،"], [3488.0, "وما قرّر الشارعُ بابَ الطِّيَرة والنهيَ عنها إلا لإخراج الناس من الوهم والخيالات التي عشّشت في قلوبهم بسبب الشياطين."], [3497.0, "فالله يقصد منا أن نخرج من ظلمات الأوهام والخيالات إلى نور الحقائق،"], [3507.0, "والشيطان أعظمُ مقاصده أن يُخرجنا من نور الحقيقة ويُدخلنا في ظلمة الأوهام والخيالات."]], "tr": [[3475.0, "Şâri' (şeriatı koyan), muskalar babını ancak insanları muskalar hakkındaki hayalî, vehmî akîdelerden, onların hiçbir şeye sahip olmadığı (gerçeğine) çıkarmak için takrir etmiştir."], [3488.0, "Tıyara (uğursuzluk) babını ve onun yasaklanmasını da ancak insanları, şeytanlar sebebiyle kalplerine yuvalanan vehimlerden ve hayallerden çıkarmak için takrir etmiştir."], [3497.0, "Allah bizden, vehimlerin ve hayallerin karanlıklarından hakikatlerin nuruna çıkmamızı ister."], [3507.0, "Şeytanın en büyük maksadı ise bizi hakikatin nurundan çıkarıp vehimlerin ve hayallerin karanlığına sokmaktır."]]}, {"reader": false, "ar": [[3516.0, "فهذه وظيفتنا ـ والله ـ في هذه الدنيا:"], [3520.0, "وظيفتنا في هذه الدنيا أن نحاول إخراج الناس من تلك الأشياء التوهّمية الخيالية التي بنوا عليها عقائدهم إلى نور الحق والبرهان الساطع،"], [3530.0, "وإلى الحقيقة الواضحة التي دلّت عليها الأدلة من الكتاب والسنة."], [3538.0, "والله الموفق والهادي. الله المستعان،"], [3540.7, "الله يرحمنا برحمته، ونحن مقصّرون في ذلك أشدَّ التقصير،"], [3547.0, "لكن عسى الله يرحمنا بتقصيرنا."]], "tr": [[3516.0, "Vallahi bu dünyadaki vazifemiz budur:"], [3516.0, "Bu dünyadaki vazifemiz, insanları akîdelerini üzerine kurdukları o vehmî, hayalî şeylerden hakkın nuruna ve parlak burhana, Kitap ve Sünnet'ten delillerin delâlet ettiği apaçık hakikate çıkarmaya çalışmaktır."], [3530.0, "Tevfik ve hidayet Allah'tandır. Yardım Allah'tan istenir;"], [3538.0, "Allah bize rahmetiyle merhamet etsin."], [3540.7, "Biz bu konuda son derece kusurluyuz;"], [3540.7, "ama umulur ki Allah kusurumuza rağmen bize merhamet eder."]]}, {"reader": true, "ar": [[3548.0, "أحسن الله إليكم. الكلية الثامنة عشرة:"], [3554.0, "كلُّ ما أخرج الوحيَ عن دلالته الصحيحة الصريحة فتحريف."]], "tr": [[3548.0, "Allah size iyilik etsin. On sekizinci külliye:"], [3554.0, "Vahyi sahih ve sarih delâletinden çıkaran her şey tahriftir."]]}, {"reader": false, "ar": [[3559.0, "نعم. كلُّ ما أخرج الوحيَ عن دلالته الصحيحة الصريحة فتحريف."], [3571.7, "<span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [3577.9, "هذه نتيجةٌ لكلية الحقيقة والظاهر،"], [3581.0, "أليس كذلك؟ الجواب: بلى."], [3583.0, "فإذا قيل لك: ما التحريف؟"], [3587.0, "فقل: هو إخراج الوحي عن حقيقته وعن ظاهره."], [3593.0, "فإن قيل لك: وما الفرق بين التعطيل والتحريف؟"]], "tr": [[3559.0, "Evet. Vahyi sahih ve sarih delâletinden çıkaran her şey tahriftir."], [3559.0, "(Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [3571.7, "Bu, hakikat ve zahir külliyesinin bir sonucudur, öyle değil mi?"], [3581.0, "Cevap: Evet. Sana \"Tahrif nedir?\" denirse de ki:"], [3587.0, "\"Vahyi hakikatinden ve zahirinden çıkarmaktır.\" Sana \"Ta'til ile tahrif arasındaki fark nedir?\" denirse —"]]}]}, {"ts": "1:00:00", "title": "18. Külliye (sonu)", "paras": [{"reader": false, "ar": [[3600.0, "إن قيل لك: ما الفرق بين التعطيل والتحريف؟"], [3605.0, "فقل: التعطيل هو إخراج الدلالة الصحيحة؛"], [3611.0, "فكلُّ من أخرج لفظًا عن دلالته الصحيحة فقد عطّله،"], [3617.0, "أي فرّغه عن دلالته الصحيحة."], [3625.0, "فإذا قام بعد ذلك بإدخال دلالةٍ أجنبيةٍ عن اللفظ فقد حرّف."], [3633.0, "فالتحريف هو الإدخال، والتعطيل هو التفريغ؛"], [3638.0, "فإذا فرّغتَ اللفظ عن دلالته الصحيحة فأنت معطِّل،"], [3643.0, "وإذا قمت بعد ذلك بوضع دلالةٍ غريبةٍ في اللفظ فأنت محرِّف."]], "tr": [[3600.0, "Sana \"Ta'til ile tahrif arasındaki fark nedir?\" denirse de ki:"], [3605.0, "Ta'til, sahih delâleti çıkarmaktır. Bir lafzı sahih delâletinden çıkaran herkes onu ta'til etmiş, yani onu sahih delâletinden boşaltmıştır."], [3625.0, "Sonra lafza yabancı bir delâlet sokarsa tahrif etmiş olur."], [3625.0, "Tahrif (yabancı anlamı) sokmak, ta'til boşaltmaktır."], [3633.0, "Lafzı sahih delâletinden boşaltırsan muattılsın (ta'til edensin);"], [3643.0, "sonra lafza yabancı bir delâlet koyarsan muharrifsin (tahrif edensin)."]]}, {"reader": false, "ar": [[3649.0, "فإذا قال قائل: ليس لله يدان،"], [3653.3, "فهذا تعطيل؛ وإن قال:"], [3659.4, "بل معناها النعمة والقدرة،"], [3662.3, "فهذا تحريف. التعطيل هو سلبُ الدلالة الصحيحة ـ سلبُ الدلالة الصحيحة ـ والتحريف هو إقحامُ الدلالة الباطلة."], [3680.0, "إذ هناك من الناس من يُفرّغ النص عن دلالته الصحيحة ولا يُقحم معنًى آخر،"], [3686.0, "فهو معطِّلٌ وليس بمحرِّف؛"], [3688.0, "لكن من الناس من يسلب الدلالة الصحيحة ويضع مكانها دلالةً باطلة،"], [3695.0, "فهو معطِّلٌ ومحرِّف. ونُكمل بعد الأذان إن شاء الله."]], "tr": [[3649.0, "Biri \"Allah'ın iki eli yoktur\" derse bu ta'tildir;"], [3653.3, "\"Bilakis manası nimet ve kudrettir\" derse bu tahriftir."], [3662.3, "Ta'til sahih delâleti gidermek, tahrif bâtıl delâleti sokmaktır."], [3662.3, "Çünkü insanlardan kimi nassı sahih delâletinden boşaltır ama başka bir mana sokmaz;"], [3680.0, "bu kişi muattıldır, muharrif değildir."], [3686.0, "İnsanlardan kimi de sahih delâleti giderir ve yerine bâtıl bir delâlet koyar;"], [3688.0, "bu kişi hem muattıl hem muharriftir."], [3695.0, "İnşallah ezandan sonra devam ederiz."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
