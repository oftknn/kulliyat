 edenlere yaraşır﴾<\/span> [Tevbe 113] <span class=\"ayah\">﴿İbrâhîm'in babası için mağfiret dilemesi, sadece ona verdiği bir sözden dolayı idi. Onun Allah'ın düşmanı olduğu kendisine açıkça belli olunca ondan uzaklaştı﴾<\/span> [Tevbe 114] ayetin tamamı."], [2726.0, "Ya da onların ateşte ebedî olarak kalmalarının kaldırılması için dua etmek;"], [2732.2, "çünkü bu, Allah Azze ve Celle'nin <span class=\"ayah\">﴿Orada ebedî olarak kalacaklardır﴾<\/span> [Ahzâb 65] sözüne aykırıdır."]]}, {"reader": false, "ar": [[2741.0, "أو الدعاء على مسلمٍ بالخلود الأبديّ في النار،"], [2749.0, "فإنّ ذلك مخالفٌ للسنّة الشرعيّة في أنه لا يُخلَّد في النار أحدٌ ممّن معه أصلُ الإسلام والإيمان؛"], [2756.0, "لقول النبيّ صلى الله عليه وسلم:"], [2759.0, "«من كان آخرُ كلامه من الدنيا لا إله إلا الله دخل الجنّة يومًا من الدهر، وإن أصابه قبل ذلك ما أصابه»."], [2766.0, "وقول النبيّ صلى الله عليه وسلم:"], [2768.0, "«يخرج من النار من قال: لا إله إلا الله، وفي قلبه وزنُ بُرّة» ـ أو قال:"], [2774.3, "«شعيرة» ـ وقال: «ذرّة من خير»."], [2777.0, "وهذا بإجماع أهل السنّة والجماعة:"], [2779.7, "أنه لن يُخلَّد في النار أحدٌ معه أصلُ الإيمان والإسلام."]], "tr": [[2741.0, "Ya da bir Müslümana ateşte ebedî kalmasıyla beddua etmek;"], [2749.4, "çünkü bu, aslı İslâm ve iman olan hiç kimsenin ateşte ebedî kalmayacağı hususundaki şer'î sünnete aykırıdır."], [2756.0, "Peygamber sallallâhu aleyhi ve sellem'in şu sözünden dolayı:"], [2759.0, "\"Dünyadaki son sözü Lâ ilâhe illallah olan kimse, ondan önce başına ne gelirse gelsin, zamanın bir gününde cennete girer.\" Ve Peygamber sallallâhu aleyhi ve sellem'in şu sözü:"], [2768.0, "\"Lâ ilâhe illallah diyen ve kalbinde bir buğday tanesi ağırlığınca\" —veya \"bir arpa tanesi\" dedi— ve \"zerre ağırlığınca hayır\" bulunan kimse ateşten çıkar.\" Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyla sabittir:"], [2779.7, "Aslı iman ve İslâm olan hiç kimse ateşte ebedî kalmayacaktır."]]}, {"reader": false, "ar": [[2785.0, "أو أن يسأل اللهَ العصمةَ المطلقة من كلّ ذنبٍ وخطيئة،"], [2791.0, "فإنّ ذلك مخالفٌ لقول النبيّ صلى الله عليه وسلم:"], [2795.0, "«كلُّ بني آدم خطّاء، وخيرُ الخطّائين التوّابون»."], [2799.8, "أو أن يدعوَ ـ والعياذ بالله ـ بالغواية والضلالة على أحدٍ من المسلمين،"], [2807.3, "أو يدعوَ اللهَ على مسلمٍ أن يموت على معصية،"], [2812.7, "فهذا من الاعتداء على أخيك في الدعاء،"], [2817.3, "كما قال الله عز وجل:"], [2819.5, "<span class=\"ayah\">﴿ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً ۚ إِنَّهُ لَا يُحِبُّ الْمُعْتَدِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ٥٥]<\/span>."]], "tr": [[2785.0, "Ya da Allah'tan her günahtan ve hatadan mutlak masumiyet istemesi;"], [2790.4, "çünkü bu, Peygamber sallallâhu aleyhi ve sellem'in şu sözüne aykırıdır:"], [2795.0, "\"Âdemoğlunun hepsi çok hata eder;"], [2799.8, "çok hata edenlerin en hayırlısı çok tövbe edenlerdir.\" Ya da —Allah korusun— Müslümanlardan birine azgınlık ve sapıklıkla beddua etmesi veya bir Müslümana bir günah üzere ölmesi için Allah'a beddua etmesi;"], [2814.0, "bu, duada kardeşine karşı i'tidâdır."], [2816.7, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2819.5, "<span class=\"ayah\">﴿Rabbinize yalvararak ve gizlice dua edin. Şüphesiz O, haddi aşanları sevmez﴾<\/span> [A'râf 55]."]]}, {"reader": false, "ar": [[2822.6, "قال بعض السلف في بيان المعتدين:"], [2824.8, "«هم الذين يدعون على المؤمنين فيما لا يحلّ، فيقولون: اللهمّ اخزِهم، اللهمّ العنهم»."], [2831.2, "وقال سعيد بن جبير:"], [2835.0, "«لا تدعُ على المؤمنين بالشرّ: اللهمّ اخزِه، اللهمّ اخزِه والعنه، ونحو ذلك؛ فإنّ ذلك عدوان»."], [2843.1, "وقال الحسن البصريّ رحمه الله:"], [2845.2, "«قد أُرخِص له أن يدعوَ على من ظلمه من غير أن يعتديَ عليه»."]], "tr": [[2822.6, "Seleften biri haddi aşanları açıklarken şöyle demiştir:"], [2824.8, "\"Onlar, helal olmayan hususlarda müminlere beddua eden ve 'Allah'ım onları rezil et, Allah'ım onlara lanet et' diyenlerdir.\" Saîd b."], [2835.0, "Cübeyr şöyle demiştir: \"Müminlere kötülükle beddua etme:"], [2838.0, "'Allah'ım onu rezil et, Allah'ım onu rezil et ve ona lanet et' ve benzeri;"], [2843.1, "çünkü bu düşmanlıktır.\" Hasan-ı Basrî —Allah ona rahmet etsin— şöyle demiştir:"], [2847.1, "\"Kendisine zulmedene, ona karşı haddi aşmadan beddua etmesine ruhsat verilmiştir.\""]]}, {"reader": false, "ar": [[2852.3, "وفي هذه الجزئيّة شبهتان يستدلّ بهما من قال بجواز الدعاء على أهل الإسلام."], [2864.0, "الشبهة الأولى: في قول الله عز وجل أنّ موسى دعا على فرعون وقومه،"], [2875.3, "في قوله: <span class=\"ayah\">﴿وَقَالَ مُوسَىٰ رَبَّنَا إِنَّكَ آتَيْتَ فِرْعَوْنَ وَمَلَأَهُ زِينَةً وَأَمْوَالًا فِي الْحَيَاةِ الدُّنْيَا رَبَّنَا لِيُضِلُّوا عَن سَبِيلِكَ ۖ رَبَّنَا اطْمِسْ عَلَىٰ أَمْوَالِهِمْ وَاشْدُدْ عَلَىٰ قُلُوبِهِمْ فَلَا يُؤْمِنُوا حَتَّىٰ يَرَوُا الْعَذَابَ الْأَلِيمَ﴾<\/span> <span class=\"ref\">[يونس: ٨٨]<\/span>."], [2897.0, "فكيف تُجيب عن ذلك؟"]], "tr": [[2852.3, "Bu cüz'î meselede, Müslümanlara beddua etmenin caiz olduğunu söyleyenlerin delil getirdiği iki şüphe vardır."], [2864.0, "Birinci şüphe: Allah Azze ve Celle'nin, Mûsâ'nın Firavun'a ve kavmine beddua ettiğini bildiren sözündedir:"], [2878.0, "<span class=\"ayah\">﴿Mûsâ dedi ki: Rabbimiz! Sen Firavun'a ve ileri gelenlerine dünya hayatında süs ve mallar verdin. Rabbimiz! (Bunları) senin yolundan saptırsınlar diye mi? Rabbimiz! Mallarını yok et, kalplerini sıkıca kapat ki elem verici azabı görünceye kadar iman etmesinler﴾<\/span> [Yûnus 88]. Buna nasıl cevap verirsin?"]]}, {"reader": false, "ar": [[2902.0, "الجواب: إنّ هذا دعاءٌ بعد أن أعلمه الله عز وجل بأنهم لن يؤمن منهم أحد."], [2908.0, "فموسى عليه الصلاة والسلام لم يدعُ بذلك من عند نفسه،"], [2914.0, "وإنما دعا بذلك بعد أن أعلمه الله عز وجل بوحيه أنّ قوم فرعون لا يؤمنون ولو جاءتهم كلُّ آيةٍ ومعجزة."], [2924.0, "وليس فيه الدعاءُ مطلقًا على كلّ كافرٍ أو ظالمٍ بطمس القلب واليأس من الإيمان والتوبة،"], [2931.0, "وإنما موسى عليه الصلاة والسلام لمّا أخبره الله أنه لن يؤمن منهم أحدٌ أبدًا،"], [2937.0, "ولو جاءتهم كلُّ آيةٍ حتى يروا العذاب الأليم، دعا عليهم بذلك."]], "tr": [[2902.0, "Cevap: Bu, Allah Azze ve Celle ona onlardan hiç kimsenin iman etmeyeceğini bildirdikten sonra yapılmış bir duadır."], [2908.0, "Mûsâ aleyhissalâtü vesselâm bunu kendiliğinden dua etmedi;"], [2912.2, "ancak Allah Azze ve Celle ona vahyiyle, Firavun kavminin kendilerine her ayet ve mucize gelse bile iman etmeyeceklerini bildirdikten sonra bununla dua etti."], [2924.0, "Bunda, her kâfire veya zalime mutlak olarak kalbin mühürlenmesi, iman ve tövbeden ümit kesilmesiyle beddua etmek yoktur."], [2931.0, "Mûsâ aleyhissalâtü vesselâm, Allah ona onlardan hiç kimsenin —elem verici azabı görünceye kadar kendilerine her ayet gelse bile— asla iman etmeyeceğini haber verince onlara bununla beddua etti."]]}, {"reader": false, "ar": [[2941.0, "وهناك إشكالٌ آخر، وهي في قصّةٍ أخرجها صاحبُ الصحيح من حديث سعد بن أبي وقّاص رضي الله عنه:"], [2953.0, "أنّ رجلًا قام في المسجد وشكا سعدًا لعمرَ بن الخطّاب رضي الله عنه ـ انتبهوا يا جماعة هذا الإشكال ـ فاتّهم سعدَ بن أبي وقّاص بعدّة تُهَمٍ في ولايته."], [2969.0, "فقال سعد: «أمَا واللهِ لأدعونّ عليك بثلاث: اللهمّ إن كان عبدُك هذا كاذبًا، قام رياءً وسمعة» ـ انتبه ـ «فأطِل عمرَه، وأطِل فقرَه، وعرِّضه للفتن»."], [2991.0, "دعا على مسلمٍ بمثل هذا الدعاء!"], [2995.0, "«وكان بعدُ إذا سُئل يقول: شيخٌ كبيرٌ مفتون، أصابتني دعوةُ سعد»."]], "tr": [[2941.0, "Bir başka müşkil daha var;"], [2943.6, "o da Sahîh sahibinin Sa'd b."], [2946.9, "Ebî Vakkâs —Allah ondan razı olsun— hadisinden rivayet ettiği bir kıssadadır:"], [2953.0, "Bir adam mescitte kalkıp Sa'd'ı Ömer b."], [2957.1, "el-Hattâb'a —Allah ondan razı olsun— şikâyet etti —ey cemaat, bu müşkile dikkat edin— ve Sa'd b."], [2965.9, "Ebî Vakkâs'ı valiliğinde birkaç şeyle itham etti."], [2969.0, "Bunun üzerine Sa'd şöyle dedi:"], [2970.4, "\"Dikkat edin, vallahi sana üç şeyle beddua edeceğim:"], [2974.0, "Allah'ım! Eğer bu kulun yalancıysa, gösteriş ve şöhret için kalktıysa\" —dikkat et— \"ömrünü uzat, fakirliğini uzat ve onu fitnelere maruz bırak.\" Bir Müslümana böyle bir bedduayla beddua etti!"], [2991.0, "\"(O adam) daha sonra kendisine (hâli) sorulduğunda 'Fitneye düşmüş yaşlı bir ihtiyarım;"], [2998.8, "Sa'd'ın bedduası bana dokundu' derdi.\""]]}]}, {"ts": "50:02", "title": "14. Külliye (devam): Sa'd'ın bedduasına cevap · Daraltma, meşîete bağlama ve diğer i'tidâ suretleri", "paras": [{"reader": false, "ar": [[3002.0, "قال عبد الملك ـ أحد الرواة ـ:"], [3005.0, "«فأنا رأيتُه بعدُ قد سقط حاجباه على عينيه من الكِبَر، وإنه ليتعرّض للجواري في الطرق يغمزهنّ»."]], "tr": [[3002.0, "Râvilerden biri olan Abdülmelik şöyle dedi:"], [3005.0, "\"Ben onu daha sonra, yaşlılıktan kaşları gözlerinin üzerine düşmüş hâlde gördüm;"], [3010.4, "yollarda cariyelere sataşıyor, onlara göz kırpıp çimdikliyordu.\""]]}, {"reader": false, "ar": [[3017.0, "والجواب عن هذا الإشكال:"], [3018.9, "أنّ سعدًا لم يدعُ اللهَ عز وجل أن يموت على معصية،"], [3024.0, "وإنما دعا أن يُعرّضه للفتن،"], [3027.0, "وليس ذلك من لوازمه أن يموت على هذه المعصية."], [3032.0, "فظنّ بعضُ الناس أنّ سعدًا دعا عليه بالمعصية التي سيموت عليها،"], [3038.3, "وهذا ليس بصواب. وإنما دعا بأن يُعرّضه الله عز وجل للفتن والبلايا والمحن في الدين والدنيا،"], [3046.0, "كما قال: «وعرِّضه للفتن»."], [3048.0, "والفتنة لا تعني المعصية،"], [3051.0, "ولكنها تعني الشدّة التي قد توقع في المعصية إن لم يصبر عليها، وهذا ما حصل."]], "tr": [[3017.0, "Bu müşkile cevap şudur: Sa'd, Allah Azze ve Celle'ye onun bir günah üzere ölmesi için dua etmedi;"], [3026.4, "ancak onu fitnelere maruz bırakması için dua etti."], [3032.0, "Bunun lâzımı da onun bu günah üzere ölmesi değildir."], [3035.4, "Bazı insanlar Sa'd'ın ona, üzerinde öleceği bir günahla beddua ettiğini zannetti;"], [3040.0, "bu doğru değildir. O ancak Allah Azze ve Celle'nin onu dinde ve dünyada fitnelere, belalara ve mihnetlere maruz bırakması için dua etti;"], [3047.0, "nitekim \"Onu fitnelere maruz bırak\" dedi."], [3051.0, "Fitne günah demek değildir; fakat sabredilmezse günaha düşürebilecek sıkıntı demektir. Olan da buydu."]]}, {"reader": false, "ar": [[3058.0, "ولذلك قال الحافظ ابنُ حجر رحمه الله تعالى:"], [3061.0, "«وفيه جوازُ الدعاء على الظالم المعيَّن بما يستلزم النقصَ في دينه، وليس هو من طلب وقوع المعصية، ولكن من حيث إنه يؤدّي إلى نكاية الظالم وعقوبته»."], [3073.1, "انتهى كلامه. فلا تفهم من قوله:"], [3076.0, "«وعرِّضه للفتن» أي أنه يموت على المعصية،"], [3080.1, "أو أنه يعصيك، وإنما عرّضه للأمر الذي يوجب عليه الضيق."]], "tr": [[3058.0, "Bu yüzden Hâfız İbn Hacer —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [3061.0, "\"Bunda, belirli bir zalime, dininde eksikliği gerektirecek bir şeyle beddua etmenin caiz olduğu vardır."], [3066.0, "Bu, günahın vuku bulmasını istemek kabilinden değildir;"], [3068.5, "fakat zalimin cezalandırılmasına ve ona ukubete yol açması bakımındandır.\" Sözü burada bitti."], [3073.1, "Dolayısıyla onun \"Onu fitnelere maruz bırak\" sözünden, onun günah üzere öleceğini veya sana isyan edeceğini anlama;"], [3080.8, "o ancak onu, kendisine darlık getirecek şeye maruz bırakmıştır."]]}, {"reader": false, "ar": [[3086.0, "ومن صور الاعتداء في الدعاء أيضًا:"], [3089.8, "تحجيرُ الدعاء؛ ومن ذلك قولُ من قال:"], [3092.0, "«اللهمّ ارحمني ومحمّدًا، ولا ترحم معنا أحدًا»،"], [3096.0, "فقال له النبيّ صلى الله عليه وسلم:"], [3098.0, "«لقد تحجّرتَ واسعًا». ومنها أيضًا:"], [3103.2, "تعليق الدعاء بالمشيئة؛ لأنه مخالفٌ لسنّةٍ شرعيّة،"], [3108.0, "في قول النبيّ صلى الله عليه وسلم:"], [3110.0, "«لا يقولنّ أحدُكم: اللهمّ اغفر لي إن شئت، اللهمّ ارحمني إن شئت، اللهمّ ارزقني إن شئت، وليعزم المسألة، وليُعظِم الرغبة، فإنّ الله لا مُكرِه له»."]], "tr": [[3086.0, "Duada i'tidânın suretlerinden biri de duayı daraltmaktır."], [3089.8, "Bundan biri de \"Allah'ım! Bana ve Muhammed'e merhamet et;"], [3092.0, "bizimle birlikte hiç kimseye merhamet etme\" diyen kimsenin sözüdür."], [3096.3, "Peygamber sallallâhu aleyhi ve sellem ona \"Geniş olanı daralttın\" buyurdu."], [3102.0, "Bunlardan biri de duayı meşîete (dilemeye) bağlamaktır;"], [3105.0, "çünkü bu, Peygamber sallallâhu aleyhi ve sellem'in şu sözündeki şer'î sünnete aykırıdır:"], [3110.0, "\"Sizden biri sakın 'Allah'ım dilersen beni bağışla, Allah'ım dilersen bana merhamet et, Allah'ım dilersen bana rızık ver' demesin."], [3116.0, "İsteğinde kararlı olsun ve arzusunu büyük tutsun;"], [3119.0, "çünkü Allah'ı zorlayan hiçbir kimse yoktur.\""]]}, {"reader": false, "ar": [[3122.0, "ومنها أيضًا: الدعاء على الأهل والمال والأولاد والنفس،"], [3129.0, "فإنّ ذلك مخالفٌ لسنّةٍ شرعيّة،"], [3132.0, "كما في صحيح مسلم من حديث جابرٍ رضي الله عنه قال:"], [3135.8, "قال النبيّ صلى الله عليه وسلم:"], [3138.0, "«لا تدعوا على أنفسكم، ولا تدعوا على أولادكم، ولا تدعوا على أموالكم؛ لا توافقوا من الله ساعةً يُسأل فيها عطاءٌ فيستجيبَ لكم»."]], "tr": [[3122.0, "Bunlardan biri de aileye, mala, çocuklara ve kendi nefsine beddua etmektir;"], [3129.6, "çünkü bu, şer'î bir sünnete aykırıdır."], [3132.3, "Nitekim Sahîh-i Müslim'de Câbir —Allah ondan razı olsun— hadisinde (Câbir) dedi ki:"], [3135.8, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [3138.0, "\"Kendinize beddua etmeyin, çocuklarınıza beddua etmeyin, mallarınıza beddua etmeyin;"], [3141.3, "Allah'tan bir şey istenip de verildiği bir saate denk gelirsiniz de (Allah) duanızı kabul ediverir.\""]]}, {"reader": false, "ar": [[3147.0, "ومنها أيضًا: تمنّي الموت،"], [3149.3, "فإنه من الاعتداء في الدعاء؛"], [3152.1, "لأنه مخالفٌ لسنّة الله الشرعيّة،"], [3155.0, "كما في الصحيحين من حديث أنسٍ رضي الله عنه قال:"], [3158.8, "قال النبيّ صلى الله عليه وسلم:"], [3161.0, "«لا يتمنّينّ أحدُكم الموتَ لضُرٍّ نزل به» الحديثَ بتمامه."], [3165.0, "فإن كان لا بدّ متمنّيًا فلا يجوز له أن يتمنّاه مطلقًا،"], [3170.0, "وإنما يتمنّاه معلّقًا بشرط،"], [3172.0, "كما قال صلى الله عليه وسلم:"], [3174.0, "«اللهمّ أحيِني ما كانت الحياةُ خيرًا لي، وتوفَّني ما كانت الوفاةُ خيرًا لي»."]], "tr": [[3147.0, "Bunlardan biri de ölümü temenni etmektir;"], [3152.1, "bu duada i'tidâdandır, çünkü Allah'ın şer'î sünnetine aykırıdır."], [3155.4, "Nitekim Sahîhayn'de Enes —Allah ondan razı olsun— hadisinde (Enes) dedi ki:"], [3158.8, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [3161.0, "\"Sizden biri başına gelen bir sıkıntıdan dolayı sakın ölümü temenni etmesin\" hadisin tamamı."], [3165.0, "Eğer mutlaka temenni edecekse, onu mutlak olarak temenni etmesi caiz değildir;"], [3169.0, "ancak bir şarta bağlı olarak temenni eder;"], [3172.0, "sallallâhu aleyhi ve sellem'in buyurduğu gibi:"], [3174.0, "\"Allah'ım! Hayat benim için hayırlı olduğu sürece beni yaşat;"], [3177.8, "ölüm benim için hayırlı olduğunda beni öldür.\""]]}, {"reader": false, "ar": [[3181.0, "ومنها أيضًا: الدعاء بتعجيل عقوباته في الآخرة،"], [3187.0, "فيقول: اللهمّ ما كنتَ معاقِبي به في الآخرة فعاقِبني به الآن؛"], [3193.0, "فهذا من الاعتداء في الدعاء."], [3196.0, "ولذلك في الصحيح من حديث أنسٍ رضي الله عنه:"], [3201.0, "«أنّ النبيّ صلى الله عليه وسلم عاد رجلًا من المسلمين قد خفَت فصار مثل الفرخ» ـ أي ضعُف جسدُه ـ «فقال له النبيّ صلى الله عليه وسلم: هل كنتَ تدعو اللهَ عز وجل بشيءٍ أو تسأله إيّاه؟ قال: نعم، كنتُ أقول: اللهمّ ما كنتَ معذّبي به في الآخرة فعجِّله لي في الدنيا. فقال رسول الله صلى الله عليه وسلم: سبحان الله! لا تُطيقه ـ أو لا تستطيعه ـ أفلا قلتَ: اللهمّ آتِنا في الدنيا حسنةً، وفي الآخرة حسنةً، وقِنا عذابَ النار؟ قال: فدعا اللهَ به فشفاه»."]], "tr": [[3181.0, "Bunlardan biri de âhiretteki cezalarının öne alınması için dua etmektir;"], [3184.0, "\"Allah'ım! Âhirette beni neyle cezalandıracaksan şimdi onunla cezalandır\" der."], [3188.5, "Bu duada i'tidâdandır. Bu yüzden Sahîh'te Enes —Allah ondan razı olsun— hadisinde şöyle geçer:"], [3193.0, "\"Peygamber sallallâhu aleyhi ve sellem Müslümanlardan bir adamı ziyaret etti;"], [3193.6, "adam zayıflayıp kuş yavrusu gibi olmuştu\" —yani bedeni zayıflamıştı— \"Peygamber sallallâhu aleyhi ve sellem ona 'Allah Azze ve Celle'ye bir şeyle dua ediyor veya O'ndan bir şey istiyor muydun?' dedi."], [3196.0, "Adam 'Evet, Allah'ım âhirette bana neyle azap edeceksen onu bana dünyada acele ver, diyordum' dedi."], [3199.3, "Resûlullah sallallâhu aleyhi ve sellem şöyle buyurdu:"], [3201.0, "'Sübhânallah! Ona güç yetiremezsin —veya ona dayanamazsın—."], [3207.0, "Allah'ım, bize dünyada iyilik ver, âhirette de iyilik ver ve bizi ateş azabından koru, deseydin ya!' (Enes) dedi ki:"], [3225.0, "O da Allah'a bununla dua etti ve (Allah) ona şifa verdi.\""]]}, {"reader": false, "ar": [[3237.0, "فلا يجوز للإنسان أن يدعو على نفسه بشيءٍ من العقوبات في الآخرة."], [3244.0, "ومنها أيضًا ـ والعياذ بالله ـ:"], [3247.0, "أن يصرف الدعاءَ لغير الله عز وجل،"], [3250.2, "وهذا اعتداءٌ يوجب إيش؟"], [3252.0, "يوجب الشرك؛ أو يدعو مع الله عز وجل غيرَه،"], [3257.0, "كأن يقول: يا رسول الله اكشف كربتي،"], [3259.7, "أو يا عليّ، أو يا جيلاني؛"], [3262.0, "فلا شكّ أنه كفرٌ صريحٌ ناقلٌ عن الملّة،"], [3266.0, "كما قال الله عز وجل:"], [3268.0, "<span class=\"ayah\">﴿إِن تَدْعُوهُمْ لَا يَسْمَعُوا دُعَاءَكُمْ وَلَوْ سَمِعُوا مَا اسْتَجَابُوا لَكُمْ ۖ وَيَوْمَ الْقِيَامَةِ يَكْفُرُونَ بِشِرْكِكُمْ﴾<\/span> <span class=\"ref\">[فاطر: ١٤]<\/span>،"], [3275.0, "فسمّى اللهُ عز وجل دعاءَ غيره شركًا."]], "tr": [[3237.0, "Dolayısıyla insanın âhiretteki cezalardan herhangi bir şeyle kendisine beddua etmesi caiz değildir."], [3244.0, "Bunlardan biri de —Allah korusun— duayı Allah Azze ve Celle'den başkasına yöneltmektir."], [3249.7, "Bu neyi gerektiren bir i'tidâdır?"], [3252.0, "Şirki gerektirir. Ya da Allah Azze ve Celle ile birlikte başkasına dua etmektir;"], [3257.8, "\"Ey Allah'ın Resûlü, sıkıntımı gider\", \"Ey Ali\" veya \"Ey Geylânî\" demek gibi."], [3262.0, "Şüphesiz bu, dinden çıkaran apaçık küfürdür;"], [3265.0, "nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [3268.0, "<span class=\"ayah\">﴿Onlara dua etseniz duanızı işitmezler; işitseler bile size cevap veremezler. Kıyamet günü de sizin şirkinizi inkâr ederler﴾<\/span> [Fâtır 14]."], [3274.4, "Allah Azze ve Celle başkasına dua etmeyi şirk diye adlandırmıştır."]]}, {"reader": false, "ar": [[3278.0, "ومن الاعتداء في الدعاء:"], [3280.2, "تصغيرُ أسماء الله عز وجل في الدعاء،"], [3284.0, "كقوله: يا رُبَيْبي، يا حُنَيّ،"], [3287.7, "يا رحيم <span class=\"q\">؟ 54:44<\/span>، ونحو ذلك؛"], [3292.1, "فهذا من الاعتداء وقلّة الأدب."], [3295.0, "ومنها أيضًا: دعاءُ الصفة،"], [3298.0, "فهو يدعو شيئًا من صفات الله عز وجل،"]], "tr": [[3278.0, "Duada i'tidâdan biri de duada Allah Azze ve Celle'nin isimlerini küçültme kalıbına (tasğîr) sokmaktır;"], [3284.7, "\"Ey Rabbiciğim, ey Hannâncığım, ey Rahîm\" <span class=\"q\">؟<\/span> ve benzeri şekilde söylemesi gibi."], [3292.1, "Bu, i'tidâ ve edepsizliktendir. Bunlardan biri de sıfata dua etmektir;"], [3297.2, "yani Allah Azze ve Celle'nin sıfatlarından birine dua eder."]]}]}, {"ts": "55:02", "title": "14. Külliye (sonu): Sıfata dua etmek · Özet · Kapanış ve 15. külliyenin başlığı", "paras": [{"reader": false, "ar": [[3302.0, "ومن المعلوم أنّ الصفة غيرُ الذات في مقام النداء،"], [3308.0, "ولهذا إنما يُنادى اللهُ عز وجل المتّصفُ بهذه الصفات."], [3314.0, "قال أبو العبّاس ابنُ تيميّة رحمه الله تعالى ـ وانتبهوا ـ:"], [3317.0, "«وأمّا دعاءُ صفاته وكلماته فكفرٌ باتّفاق المسلمين؛ فهل يقول مسلمٌ: يا كلامَ الله اغفر لي وارحمني وأغثني أو أعنّي، أو: يا علمَ الله، أو: يا قدرةَ الله، أو: يا عزّةَ الله، أو: يا عظمةَ الله، ونحو ذلك؟ أو سُمع من مسلمٍ أو كافرٍ أنه دعا بذلك» ـ في صفات الله عز وجل ـ «أو يطلب من الصفة جلبَ منفعةٍ أو دفعَ مضرّةٍ أو إعانةً أو نصرًا أو غير ذلك؟»."], [3357.0, "انتهى كلامه رحمه الله."]], "tr": [[3302.0, "Bilinmektedir ki nida makamında sıfat, zâttan başkadır."], [3304.7, "Bu yüzden ancak bu sıfatlarla nitelenen Allah Azze ve Celle'ye nida edilir."], [3309.3, "Ebu'l-Abbâs İbn Teymiyye —Allah Teâlâ ona rahmet etsin— —dikkat edin— şöyle demiştir:"], [3314.0, "\"O'nun sıfatlarına ve kelimelerine dua etmeye gelince, bu Müslümanların ittifakıyla küfürdür."], [3317.0, "Hiçbir Müslüman 'Ey Allah'ın kelâmı, beni bağışla, bana merhamet et, imdadıma yetiş' veya 'bana yardım et' ya da 'Ey Allah'ın ilmi', 'Ey Allah'ın kudreti', 'Ey Allah'ın izzeti', 'Ey Allah'ın azameti' ve benzeri şeyler der mi?"], [3337.5, "Ya da bir Müslümandan veya bir kâfirden onun bununla dua ettiği işitilmiş midir?\" —Allah Azze ve Celle'nin sıfatları hakkında— \"Ya da sıfattan bir fayda celbetmesini, bir zararı defetmesini, yardım etmesini, zafer vermesini veya başka bir şey istediği (işitilmiş midir)?\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[3359.0, "والخلاصة من هذه الكلّيّة:"], [3361.8, "أنّ كلّ دعاءٍ يتضمّن مخالفةَ النصّ الشرعيّ،"], [3369.0, "أو يتضمّن مخالفةَ الوحي كتابًا وسنّةً،"], [3372.0, "فلا جرمَ أنه من جملة الاعتداء في الدعاء."]], "tr": [[3359.0, "Bu külliyenin özeti şudur: Şer'î nassa aykırılık içeren veya Kitap ve Sünnet olarak vahye aykırılık içeren her dua, şüphesiz duada i'tidâ cümlesindendir."]]}, {"reader": false, "ar": [[3376.8, "ولعلّنا نقف عند هذا،"], [3378.8, "كم أخذنا؟ <span class=\"q\">؟ 56:17<\/span> لعلّنا نكتفي بذلك."], [3382.1, "لكن اكتبْ رأسَ القاعدة:"], [3385.0, "<b>كلُّ دعاءٍ يتضمّن مخالفةَ سنّةٍ كونيّةٍ فاعتداء<\/b>،"], [3389.0, "<b>كلُّ دعاءٍ يخالف سنّةً كونيّةً فاعتداء.<\/b> والله أعلى وأعلم،"], [3394.2, "وصلّى الله وسلّم على نبيّنا محمّد."]], "tr": [[3376.8, "Belki burada dururuz; ne kadar (vakit) aldık?"], [3380.1, "<span class=\"q\">؟<\/span> Belki bununla yetiniriz. Fakat kaidenin başlığını yaz:"], [3385.0, "15. külliye: Kevnî bir sünnete aykırılık içeren her dua i'tidâdır;"], [3388.4, "kevnî bir sünnete aykırı olan her dua i'tidâdır. Allah en yüce ve en iyi bilendir."], [3394.6, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
