<script>
const D={"no": 49, "vid": "Nf5JoplCf0c", "title_ar": "الدرس (٤٩) من شرح كليات العقيدة — من كليات التوسل الممنوع والإقسام على الله والاعتداء في الدعاء", "title_tr": "Şerhu Külliyyâti'l-Akîde — 49. Ders: Yasak Tevessül, Allah'a Yemin Verme (İksâm) ve Duada Haddi Aşma (İ'tidâ) Külliyeleri", "sections": [{"ts": "00:00", "title": "Giriş · 9. Külliye: Talep edilen şeyi gerektirmeyen bir sebeple yapılan tevessül bid'attir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.8, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.5, "وعلى آله وأصحابه الطيِّبين الطاهرين،"], [6.8, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [9.1, "أمّا بعد: فلا نزالُ في سياق شرح قواعد توحيد الألوهيّة مُتمثِّلةً في باب التوسُّل."], [14.8, "وقد أخذنا جُمَلًا من كلّيّات باب التوسُّل،"], [17.9, "ونختمُه ـ إن شاء الله ـ في هذا الدرس."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.8, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.8, "Bundan sonra: Hâlâ tevessül babında temsil edilen ulûhiyyet tevhidi kaidelerinin şerhi bağlamındayız."], [14.8, "Tevessül babının külliyelerinden birçoğunu aldık;"], [17.9, "inşallah bu derste onu bitireceğiz."]]}, {"reader": false, "ar": [[21.0, "من الكلّيّات في هذا الدرس كلّيّةٌ طيّبةٌ وعظيمة،"], [26.5, "وسوف أُطيل عندها قليلًا،"], [33.0, "وهي قولنا: <b>كلُّ من توسّل إلى الله بسببٍ لا يقتضي مطلوبَه فتوسُّلُه بدعيّ.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[21.0, "Bu dersteki külliyelerden biri güzel ve büyük bir külliyedir;"], [25.1, "onun üzerinde biraz uzunca duracağım."], [27.8, "O da şu sözümüzdür: 9."], [33.9, "külliye: Allah'a, talep ettiği şeyi gerektirmeyen bir sebeple tevessül eden herkesin tevessülü bid'attir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[58.0, "أقول وبالله تعالى التوفيق:"], [60.4, "وأقصد بهذه الكلّيّة: أنه ليس بينه وبين قضاء حاجته من الله عز وجل مناسبة."], [69.0, "وحتى تتّضح الكلّيّة تمامًا أضرب لكم مثالًا من واقعنا المعاصر:"], [76.0, "ما رأيك لو أنّ رجلًا جاء وقال لك:"], [81.3, "لأنّ فلانًا سيّارتُه جميلة فأعطِني ما سألتُك؟"], [87.0, "فهل بين قضاء السؤال وبين ما توسّل به سببيّةٌ لقضاء الحاجة؟"], [92.9, "الجواب: لا. أو جاءك رجلٌ وقال:"], [96.7, "إنّ فلانًا بيتُه جميل،"], [99.4, "فأتوسّل إليك ببيته أن تقضي حاجتي؛"], [104.0, "فهل بين التوسُّل بالبيت وبين قضاء الحاجة سببيّةٌ واضحة؟ الجواب: لا."]], "tr": [[58.0, "Tevfik Allah'tandır, derim ki: Bu külliyeden kastım şudur:"], [62.3, "(Vesile kılınan şey) ile kişinin ihtiyacının Allah Azze ve Celle tarafından giderilmesi arasında hiçbir münasebet yoktur."], [69.7, "Külliye tam anlaşılsın diye size günümüz hayatından bir misal vereyim:"], [76.0, "Bir adam gelip sana \"Falancanın arabası güzel olduğu için senden istediğimi bana ver\" dese ne dersin?"], [87.0, "İsteğin yerine getirilmesi ile onun vesile kıldığı şey arasında ihtiyacın giderilmesine sebep olacak bir sebeplilik var mıdır?"], [92.9, "Cevap: Hayır. Ya da bir adam sana gelip \"Falancanın evi güzeldir;"], [98.0, "ihtiyacımı gidermen için onun evini sana vesile kılıyorum\" dese;"], [104.0, "evi vesile kılmak ile ihtiyacın giderilmesi arasında açık bir sebeplilik var mıdır? Cevap: Hayır."]]}, {"reader": false, "ar": [[111.0, "فكذلك إذا أردنا أن نسأل الله عز وجل ونجعل بين يدي سؤالنا وسيلة،"], [119.5, "فلا بدّ أن تكون هذه الوسيلة فيها سببيّةٌ ظاهرةٌ لإجابة الله عز وجل."], [126.0, "فلا ينبغي أن نتوسّل إلى الله عز وجل بما لا مناسبةَ بينه وبين قضاء الحاجة."], [137.0, "فلو أتاك رجلٌ وقال:"], [139.2, "إني أتوسّل إليك بجاه فلانٍ وقبيلتِه العريقة النسيبة الحسيبة،"], [146.0, "فإنك ستقول له: وماذا أفعل بقبيلته؟"], [150.0, "وما الذي يجعلني أهتمّ بسؤالك إذا توسّلتَ إليّ بقبيلة فلانٍ أو حسبِ فلان؟"], [158.0, "فكلُّ ذلك من الوسائل التي ليس بينها وبين قضاء المطلوب أيُّ علاقة."]], "tr": [[111.0, "Aynı şekilde Allah Azze ve Celle'den bir şey istemek ve isteğimizin önüne bir vesile koymak istediğimizde, bu vesilede Allah Azze ve Celle'nin icabetine yönelik açık bir sebeplilik bulunması gerekir."], [126.0, "Allah Azze ve Celle'ye, ihtiyacın giderilmesiyle arasında hiçbir münasebet olmayan bir şeyle tevessül etmemiz uygun değildir."], [137.0, "Bir adam sana gelip \"Falancanın câhını, onun köklü, soylu ve itibarlı kabilesini sana vesile kılıyorum\" dese, ona \"Onun kabilesiyle ne yapayım?"], [150.0, "Bana falancanın kabilesini veya falancanın soyunu vesile kıldığında isteğinle ilgilenmemi gerektiren şey nedir?\" dersin."], [158.0, "Bütün bunlar, talep edilenin yerine getirilmesiyle arasında hiçbir ilişki bulunmayan vesilelerdendir."]]}, {"reader": false, "ar": [[166.0, "وكذلك في باب التوسُّل لله عز وجل؛"], [170.0, "فإننا نرى أنّ كثيرًا من أهل البدع يجعل وسيلتَه إلى الله عز وجل وسيلةً ليس بينها وبين قضاء الحاجة أيُّ أسباب."], [180.0, "فإنك لو توسّلتَ إلى الله عز وجل بصفاته فصفاتُه سببٌ لقضاء حاجتك،"], [186.0, "كأن تأتي إلى غنيٍّ وتقول:"], [188.2, "أسألك بغناك أن تُعطيَني؛"], [190.0, "فإنّ وصفَه بهذه الصفة الطيّبة العظيمة تجعله يقضي حاجتك."], [196.0, "وكذلك لو توسّلتَ إلى الله عز وجل بأسمائه فإنّ التسمية بها سببٌ صالحٌ لقضاء حاجتك."]], "tr": [[166.0, "Allah Azze ve Celle'ye tevessül babında da durum böyledir."], [170.0, "Bid'at ehlinden birçoğunun, Allah Azze ve Celle'ye vesilesini, ihtiyacın giderilmesiyle arasında hiçbir sebep bulunmayan bir vesile yaptığını görüyoruz."], [180.0, "Allah Azze ve Celle'ye sıfatlarıyla tevessül etsen, O'nun sıfatları ihtiyacının giderilmesine sebeptir;"], [185.0, "tıpkı zengin birine gelip \"Zenginliğin hakkı için bana vermeni istiyorum\" demen gibi."], [190.0, "Onu bu güzel ve büyük sıfatla nitelemen, ihtiyacını gidermesini sağlar."], [196.0, "Aynı şekilde Allah Azze ve Celle'ye isimleriyle tevessül etsen, O'nu bu isimlerle anmak ihtiyacının giderilmesine elverişli bir sebeptir."]]}, {"reader": false, "ar": [[205.0, "ولو توسّلتَ إلى الله عز وجل بدعاء الرجل الحيّ الحاضر القادر الصالح،"], [213.0, "فإنّ صلاحه وقربَه من الله عز وجل سببيّةٌ صالحةٌ لقضاء حاجتك."], [220.0, "ولو أنك توسّلتَ إلى الله عز وجل بذكر حالك،"], [225.0, "فافتقارُك وانطراحُك بين يديه عز وجل حالةٌ تجعل الله عز وجل يستجيب لك."], [233.0, "وكذلك فيما لو توسّلتَ إليه بأعمالك الصالحة امتثالًا لأمره،"], [238.0, "فإنه لم يأمرك بها إلا لأنه يحبّها ويرضاها،"], [242.0, "فهذا العمل الصالح الذي توسّلتَ به سببٌ صالحٌ لقضاء حاجتك."]], "tr": [[205.0, "Allah Azze ve Celle'ye hayatta olan, hazır bulunan, gücü yeten sâlih bir adamın duasıyla tevessül etsen, onun salâhı ve Allah Azze ve Celle'ye yakınlığı ihtiyacının giderilmesine elverişli bir sebepliliktir."], [220.0, "Allah Azze ve Celle'ye hâlini anarak tevessül etsen, O'na muhtaçlığın ve O'nun huzurunda kendini yere atman, Allah Azze ve Celle'nin sana icabet etmesini sağlayan bir hâldir."], [233.0, "Aynı şekilde, emrine uyarak yaptığın sâlih amellerinle O'na tevessül etsen;"], [237.4, "O, onları sana ancak sevdiği ve razı olduğu için emretmiştir."], [242.0, "Dolayısıyla tevessül ettiğin bu sâlih amel ihtiyacının giderilmesine elverişli bir sebeptir."]]}, {"reader": false, "ar": [[248.0, "لكن لو أنني توسّلتُ بذوات الملائكة،"], [250.9, "فإنّ كون الملائكة لهم ذوات ليس ذلك من الأسباب الصالحة التي تجعل الله يقضي حاجتي."], [258.0, "ولو توسّلتُ إلى الله عز وجل بذوات الأنبياء والرسل،"], [264.0, "فإنّ مجرّد كون النبيّ والرسول له ذات،"], [269.0, "هذا ليس من الأسباب الصالحة التي بينها وبين قضاء مطلوبي مناسبة."], [274.0, "ولو أنك توسّلتَ إلى الله بجاه النبيّ عند الله،"], [279.6, "فإنّ جاهه عند الله إنما ينفعه هو؛"], [284.0, "أو بجاه هذا الوليّ عند الله عز وجل،"], [288.4, "فإنّ توسُّلك إلى الله عز وجل بجاهه إنما ينفعه هو."], [294.0, "ولكن ليس بينه ـ أي بين وجود جاهٍ له عند الله ـ وبين مطلوبك سببيّةٌ تجعل الله عز وجل يقضي حاجتك."]], "tr": [[248.0, "Fakat meleklerin zâtlarıyla tevessül etsem, meleklerin zâtlarının olması, Allah'ın ihtiyacımı gidermesini sağlayan elverişli sebeplerden değildir."], [258.0, "Allah Azze ve Celle'ye nebîlerin ve resullerin zâtlarıyla tevessül etsem, nebînin ve resulün sadece bir zâtının olması, talebimin yerine getirilmesiyle arasında münasebet bulunan elverişli sebeplerden değildir."], [274.0, "Allah'a Peygamber'in Allah katındaki câhıyla tevessül etsen, onun Allah katındaki câhı ancak kendisine fayda verir;"], [284.0, "ya da bu velinin Allah Azze ve Celle katındaki câhıyla (tevessül etsen), onun câhıyla Allah Azze ve Celle'ye tevessülün ancak ona fayda verir."], [294.0, "Fakat onunla —yani onun Allah katında bir câhının bulunmasıyla— senin talebin arasında, Allah Azze ve Celle'nin ihtiyacını gidermesini sağlayacak bir sebeplilik yoktur."]]}]}, {"ts": "05:05", "title": "9. Külliye (devam): Ehl-i Sünnet'in anlayışı ve İbn Teymiyye'nin açıklaması", "paras": [{"reader": false, "ar": [[305.0, "فكأنك تقول: يا ربِّي،"], [307.0, "بما أنّ فلانًا يُصلّي فاقضِ حاجتي،"], [310.0, "بما أنّ فلانًا يُطيعك فاقضِ حاجتي،"], [313.0, "بما أنّ فلانًا يحجّ إلى بيتك الحرام فاقضِ حاجتي."], [319.0, "فكلُّ ذلك من الأشياء التي يجعلها بعضُ أهل البدع وسيلةً في تحقيق مطلوبهم،"], [325.0, "وفي الحقيقة أنه ليس بينها وبين مطلوبهم أيُّ مناسبة."]], "tr": [[305.0, "Sanki şöyle diyorsun: \"Rabbim! Falanca namaz kıldığına göre ihtiyacımı gider;"], [312.0, "falanca sana itaat ettiğine göre ihtiyacımı gider;"], [319.0, "falanca Beyt-i Harâm'ını haccettiğine göre ihtiyacımı gider.\" Bütün bunlar, bazı bid'at ehlinin taleplerini gerçekleştirmede vesile yaptıkları şeylerdendir;"], [325.6, "hakikatte ise bunlarla talepleri arasında hiçbir münasebet yoktur."]]}, {"reader": false, "ar": [[330.0, "ولذلك فهِم أهلُ السنّة والجماعة هذه الكلّيّة،"], [336.0, "وقالوا: إنّ التوسُّل إلى الله عز وجل بذات أحدٍ من الخلق ـ أيًّا كانت منزلتُه عند الله عز وجل ـ فإنّ ذلك من التوسُّل البدعيّ؛"], [349.7, "لأنّ مجرّد كون فلانٍ له ذات فليس ذلك من الأسباب الصالحة لجعل مطلوبك ناجزًا أو مستجابًا."], [362.0, "أليس كذلك؟ الجواب: بلى."]], "tr": [[330.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat bu külliyeyi anladı ve dedi ki:"], [337.8, "Allah Azze ve Celle'ye mahlûkattan birinin zâtıyla —Allah Azze ve Celle katındaki mertebesi ne olursa olsun— tevessül etmek bid'î tevessüldendir."], [349.7, "Çünkü falancanın sadece bir zâtının olması, talebini yerine getirilmiş veya kabul edilmiş kılmaya elverişli sebeplerden değildir."], [362.0, "Öyle değil mi? Cevap: Evet, öyledir."]]}, {"reader": false, "ar": [[364.0, "ولذلك ابنُ تيميّة رحمه الله يُبيّن هذه الجزئيّة في باب التوسُّل،"], [370.0, "حتى يُبيّن لك لِمَ جاز التوسُّل بهذه الوسيلة،"], [374.0, "ولِمَ لم يَجُز التوسُّل بهذه الوسيلة."], [377.0, "فيقول رحمه الله ـ انتبه ـ:"], [380.0, "«وإن كان سؤالًا بسببٍ يقتضي المطلوب، كالسؤال بالأعمال التي فيها طاعةٌ لله ورسوله، مثل السؤال بالإيمان بالرسول ومحبّته وموالاته ونحو ذلك، فهذا جائز»."], [392.0, "قلتُ: لأنّ السببيّة هنا واضحة."]], "tr": [[364.0, "Bu yüzden İbn Teymiyye —Allah ona rahmet etsin— tevessül babındaki bu cüz'î meseleyi açıklar;"], [370.0, "ta ki bu vesileyle tevessülün neden caiz olduğunu, şu vesileyle tevessülün neden caiz olmadığını sana açıklasın."], [377.0, "—Dikkat et— şöyle der: \"Eğer talep edileni gerektiren bir sebeple istemekse;"], [382.5, "Allah'a ve Resûlü'ne itaat bulunan amellerle istemek, mesela Resûl'e iman, onu sevmek ve ona dost olmakla istemek ve benzerleri gibi;"], [392.0, "bu caizdir.\" Derim ki: Çünkü burada sebeplilik açıktır."]]}, {"reader": false, "ar": [[397.0, "ثم قال ـ انتبه ـ: «وإن كان سؤالًا بمجرّد ذات الأنبياء والصالحين فهذا غيرُ مشروع، وقد نهى عنه غيرُ واحدٍ من العلماء وقالوا: إنه لا يجوز، ورخّص فيه بعضهم، والأوّل أرجح كما تقدّم» ـ انتبه ـ «وهو سؤالٌ بسببٍ لا يقتضي حصول المطلوب، بخلاف من كان طالبًا بالسبب المقتضي لحصول المطلوب، كالطلب منه سبحانه بدعاء الصالحين وبالأعمال الصالحة، فهذا جائز؛ لأنّ دعاء الصالحين سببٌ لحصول مطلوبنا الذي دعَوا به."]], "tr": [[397.0, "Sonra —dikkat et— şöyle dedi:"], [398.6, "\"Eğer sadece nebîlerin ve sâlihlerin zâtıyla istemekse, bu meşru değildir."], [404.0, "Âlimlerden birçoğu bunu yasaklamış ve 'caiz değildir' demiştir;"], [406.6, "bazıları ise buna ruhsat vermiştir."], [410.0, "Geçtiği üzere birincisi daha râcihtir.\" —Dikkat et— \"Bu, talep edilenin hâsıl olmasını gerektirmeyen bir sebeple istemektir."], [417.4, "Talep edilenin hâsıl olmasını gerektiren sebeple isteyen ise böyle değildir;"], [421.5, "O'ndan —Sübhânehû— sâlihlerin duasıyla ve sâlih amellerle istemek gibi."], [425.9, "Bu caizdir; çünkü sâlihlerin duası, onların dua ettikleri talebimizin hâsıl olmasına sebeptir."]]}, {"reader": false, "ar": [[432.0, "وأمّا إذا لم نتوسّل إليه سبحانه بدعائهم ولا بأعمالنا،"], [437.0, "ولكن توسّلنا بنفس ذواتهم،"], [439.3, "لم يكن نفسُ ذواتهم سببًا يقتضي إجابة دعائنا،"], [443.8, "فكنّا متوسِّلين بغير وسيلة."], [446.0, "ولهذا لم يكن هذا منقولًا عن النبيّ صلى الله عليه وسلم نقلًا صحيحًا،"], [452.1, "ولا مشهورًا عن السلف». انتهى كلامه. واضح؟"]], "tr": [[432.0, "Fakat O'na —Sübhânehû— ne onların duasıyla ne de amellerimizle tevessül etmeyip bizzat zâtlarıyla tevessül edersek, bizzat zâtları duamızın kabulünü gerektiren bir sebep olmaz;"], [443.2, "böylece vesilesiz tevessül etmiş oluruz."], [446.0, "Bu yüzden bu, Peygamber sallallâhu aleyhi ve sellem'den sahih bir nakille nakledilmemiş, selef arasında da meşhur olmamıştır.\" Sözü burada bitti. Anlaşıldı mı?"]]}, {"reader": false, "ar": [[458.0, "وقال رحمه الله تعالى:"], [461.0, "«ما بيّن اللهُ ورسولُه أنه حقٌّ للعباد على الله فهو حقّ، لكنّ الكلام في السؤال بذلك. فيقال: إن كان الحقُّ الذي سأل به سببًا لإجابة السؤال حسُن السؤالُ به، كالحقّ الذي يجب لعابديه وسائليه. وأمّا إذا قال السائل: بحقّ فلانٍ وبحقّ فلان، فأولئك وإن كان لهم عند الله حقٌّ ألّا يعذّبهم، وأن يُكرمهم بثوابه، ويرفع درجاتهم، كما وعدهم بذلك وأوجبه على نفسه، فليس في استحقاق أولئك ما استحقّوه من كرامة الله ما يكون سببًا لمطلوب هذا السائل."]], "tr": [[458.0, "(İbn Teymiyye) —Allah Teâlâ ona rahmet etsin— şöyle de dedi:"], [462.4, "\"Allah'ın ve Resûlü'nün, kulların Allah üzerindeki hakkı olduğunu açıkladığı şey haktır."], [466.6, "Fakat söz, onunla istemek hakkındadır."], [468.4, "Şöyle denir: Kişinin kendisiyle istediği hak, isteğin kabulüne sebep ise onunla istemek güzel olur;"], [473.6, "O'na ibadet edenler ve O'ndan isteyenler için vâcip olan hak gibi."], [477.0, "Fakat isteyen 'Falancanın hakkı için, falancanın hakkı için' derse;"], [481.4, "onların Allah katında, Allah'ın onlara azap etmemesi, sevabıyla onlara ikramda bulunması ve derecelerini yükseltmesi gibi —ki Allah onlara bunu vaat etmiş ve kendi üzerine vâcip kılmıştır— bir hakları olsa bile, onların Allah'ın ikramından hak ettikleri şeyi hak etmelerinde, bu isteyenin talebine sebep olacak bir şey yoktur."]]}, {"reader": false, "ar": [[500.0, "فإنّ ذلك» ـ أي المتوسَّل به ـ «فإنّ ذلك استحقّ ما استحقّه بما يسّره الله له من الإيمان والطاعة، وهذا لا يستحقّ ما استحقّه ذلك؛ فليس في إكرام الله لذلك سببٌ يقتضي إجابةَ هذا». انتهى كلامه."]], "tr": [[500.0, "Çünkü o\" —yani kendisiyle tevessül edilen— \"Allah'ın ona kolaylaştırdığı iman ve itaat sayesinde hak ettiğini hak etmiştir;"], [505.8, "bu (isteyen) ise onun hak ettiğini hak etmez."], [509.0, "Dolayısıyla Allah'ın ona ikram etmesinde, bunun (isteğine) icabeti gerektiren bir sebep yoktur.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[515.0, "وأنا أرى أنّ هذه القاعدة من أهمّ ما ينبغي فهمُه في باب التوسُّل؛"], [522.0, "لأننا إذا أنكرنا التوسُّل بذوات الأنبياء أنكر علينا هؤلاء،"], [527.2, "مستدلّين علينا بعِظَم منزلة الأنبياء."], [531.0, "فنقول: عِظَمُ منزلتهم لهم،"], [534.0, "ولكن لا ينبغي أن يُتَّخَذ ذلك سببًا في جعله وسيلةً فيما بينك وبين الله عز وجل."]], "tr": [[515.0, "Ben bu kaidenin tevessül babında anlaşılması gereken en önemli şeylerden olduğunu düşünüyorum."], [522.0, "Çünkü nebîlerin zâtlarıyla tevessülü reddettiğimizde, bunlar nebîlerin mertebesinin büyüklüğünü bize karşı delil getirerek bizi reddederler."], [531.0, "Biz de deriz ki: Mertebelerinin büyüklüğü kendileri içindir;"], [535.7, "fakat bu, onu seninle Allah Azze ve Celle arasında vesile kılmaya sebep edinilmemelidir."]]}, {"reader": false, "ar": [[543.0, "وبناءً على ذلك: فالتوسُّل إلى الله بذات الملائكة أو جاه الملائكة هذا من التوسُّل البدعيّ."], [551.0, "والتوسُّل إلى الله عز وجل بذات الأنبياء ـ انتبهوا ماذا أقول:"], [557.2, "بذات الأنبياء أو بجاه الأنبياء ـ فإنه من التوسُّل البدعيّ."], [561.0, "وكذلك التوسُّل إلى الله عز وجل بذات الصالحين أو بجاه الصالحين هو من التوسُّل البدعيّ."]], "tr": [[543.0, "Buna binaen: Allah'a meleklerin zâtıyla veya meleklerin câhıyla tevessül bid'î tevessüldendir."], [551.0, "Allah Azze ve Celle'ye nebîlerin zâtıyla —ne dediğime dikkat edin:"], [557.2, "nebîlerin zâtıyla veya nebîlerin câhıyla— tevessül bid'î tevessüldendir."], [561.0, "Aynı şekilde Allah Azze ve Celle'ye sâlihlerin zâtıyla veya sâlihlerin câhıyla tevessül bid'î tevessüldendir."]]}, {"reader": false, "ar": [[570.0, "فإذا أردتَ أن تتوسّل بنبيٍّ فتوسّل إلى الله عز وجل بالإيمان به،"], [578.0, "بمتابعة شريعته. وإذا أردتَ أن تتوسّل إلى الله عز وجل بالصالحين والأولياء فتوسّل إلى الله عز وجل بطلب الدعاء منهم."], [587.0, "وأمّا كون الله عز وجل خلق لهم ذاتًا،"], [593.0, "فإنّ مجرّد وجود الذوات لهم ليست بسببٍ صالحٍ لأن تجعله وسيلة."]], "tr": [[570.0, "Bir nebîyle tevessül etmek istersen, Allah Azze ve Celle'ye ona imanla, şeriatine uymakla tevessül et."], [580.0, "Allah Azze ve Celle'ye sâlihlerle ve velilerle tevessül etmek istersen, Allah Azze ve Celle'ye onlardan dua isteyerek tevessül et."], [587.0, "Allah Azze ve Celle'nin onlar için bir zât yaratmış olmasına gelince, onların sadece zâtlarının bulunması, onu vesile kılman için elverişli bir sebep değildir."]]}]}, {"ts": "10:01", "title": "9. Külliye (devam): İbn Bâz, Ebû Hanîfe, İmam Mâlik ve İbn Teymiyye'den nakiller", "paras": [{"reader": false, "ar": [[601.0, "قال الشيخ ابنُ باز رحمه الله تعالى:"], [604.0, "«التوسُّل بالجاه محظورٌ عند جمهور أهل العلم؛ لأنه ليس من المشروعات، ولم يأتِ عن النبيّ صلى الله عليه وسلم ولا عن أصحابه ما يدلّ على جوازه، فهو من البدع»."], [616.0, "انتهى كلامه رحمه الله."]], "tr": [[601.0, "Şeyh İbn Bâz —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [604.0, "\"Câh ile tevessül, ilim ehlinin cumhuruna göre yasaktır;"], [608.3, "çünkü meşru kılınan şeylerden değildir."], [610.0, "Peygamber sallallâhu aleyhi ve sellem'den de ashâbından da caiz olduğunu gösteren bir şey gelmemiştir;"], [616.0, "dolayısıyla bid'atlerdendir.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[619.0, "ولهذا قال الإمامُ أبو حنيفة وصاحباه رضي الله عنهم جميعًا:"], [625.3, "«يُكرَه أن يقول الداعي: أسألك بحقّ فلان، أو بحقّ أنبيائك ورسلك، أو بحقّ البيت الحرام والمشعر الحرام، ونحو ذلك»."], [638.0, "انتهى كلامهم رحمهم الله تعالى."]], "tr": [[619.0, "Bu yüzden İmam Ebû Hanîfe ve iki arkadaşı —Allah hepsinden razı olsun— şöyle demişlerdir:"], [625.3, "\"Dua edenin 'Falancanın hakkı için', 'Nebîlerinin ve resullerinin hakkı için' veya 'Beyt-i Harâm'ın ve Meş'ar-i Harâm'ın hakkı için senden istiyorum' ve benzeri şeyler söylemesi mekruhtur.\" Sözleri —Allah Teâlâ onlara rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[641.0, "وقال ابنُ تيميّة رحمه الله تعالى:"], [644.0, "«وهذا التوسُّل بالأنبياء ـ بمعنى السؤال بهم ـ وهو الذي قال أبو حنيفة وأصحابه وغيرهم رضي الله عنهم إنه لا يجوز، ليس في المعروف من مذهب مالكٍ ما يناقض ذلك، فضلًا أن يُجعَل هذا من مسائل السبّ. فمن نقل عن مذهب مالكٍ أنه جوّز التوسُّل به ـ بمعنى الإقسام به أو السؤال به ـ فليس معه في ذلك نقلٌ عن مالكٍ وأصحابه، فضلًا عن أن يقول مالك: إنّ هذا سبٌّ للرسول أو تنقُّصٌ به."]], "tr": [[641.0, "İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [641.5, "\"Nebîlerle bu tevessül —onlarla istemek anlamında—, ki Ebû Hanîfe, arkadaşları ve başkaları —Allah onlardan razı olsun— bunun caiz olmadığını söylemişlerdir;"], [643.0, "Mâlik'in mezhebinde bilinenler arasında buna aykırı bir şey yoktur;"], [644.0, "bunun sebb (Resûl'e hakaret) meselelerinden sayılması ise hiç yoktur."], [651.0, "Mâlik'in mezhebinden, onunla tevessülü —onunla yemin vermek veya onunla istemek anlamında— caiz gördüğünü nakleden kimsenin elinde bu konuda Mâlik'ten ve arkadaşlarından bir nakil yoktur;"], [667.2, "Mâlik'in 'Bu, Resûl'e hakaret veya onu küçümsemektir' demesi ise hiç yoktur."]]}, {"reader": false, "ar": [[676.0, "بل المعروف عن مالكٍ أنه كره للداعي أن يقول:"], [680.2, "يا سيّدي يا سيّدي،"], [682.0, "وقال: قل كما قالت الأنبياء:"], [684.3, "يا ربّ، يا ربّ،"], [686.1, "يا كريم. وكره أيضًا أن يقول:"], [689.5, "يا حنّان يا منّان،"], [692.0, "فإنه ليس بمأثورٍ عنه."], [693.0, "فإذا كان مالكٌ يكره مثل هذا الدعاء،"], [695.8, "إذ لم يكن مشروعًا عنده،"], [697.8, "فكيف يجوز عنده أن يُسأل اللهُ عز وجل بمخلوق،"], [701.4, "نبيًّا كان أو غيرَه؟»."], [703.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[676.0, "Bilakis Mâlik'ten bilinen şudur: Dua edenin 'Ey efendim, ey efendim' demesini mekruh görmüş ve 'Nebîlerin dediği gibi de:"], [684.3, "Ey Rabbim, ey Rabbim, ey Kerîm' demiştir."], [687.0, "'Ey Hannân, ey Mennân' demesini de mekruh görmüştür;"], [690.8, "çünkü bu ondan (Peygamber'den) nakledilmiş değildir."], [693.0, "Mâlik, kendisine göre meşru olmadığı için bu gibi bir duayı mekruh görüyorsa, nebî olsun veya başkası olsun bir mahlûk ile Allah Azze ve Celle'den istenmesi ona göre nasıl caiz olur?\" Sözü —Allah Teâlâ ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[709.0, "وقال رحمه الله في نقلٍ أخير،"], [711.8, "قال: «وأيضًا فقد تبيّن أنه سؤالٌ لله تعالى بسببٍ لا يناسب إجابة الدعاء، وأنه كالسؤال بالكعبة والطور والكرسيّ والمساجد وغير ذلك من المخلوقات. ومعلومٌ أنّ سؤال الله بالمخلوقات ليس هو مشروعًا، كما أنّ الإقسام بها ليس مشروعًا، بل هو منهيٌّ عنه. فكما أنه لا يسوغ لأحدٍ أن يحلف بمخلوق، فلا يحلف على الله بمخلوق، ولا يسأله بنفس مخلوق، وإنما يسأل بالأسباب التي تناسب إجابة الدعاء، كما تقدّم تفصيله»."]], "tr": [[709.0, "(İbn Teymiyye) —Allah ona rahmet etsin— son bir nakilde de şöyle dedi:"], [709.9, "\"Ayrıca bunun, Allah Teâlâ'dan duanın kabulüne uygun düşmeyen bir sebeple istemek olduğu ve Kâbe, Tûr, Kürsî, mescitler ve diğer mahlûkatla istemek gibi olduğu ortaya çıkmıştır."], [712.3, "Allah'tan mahlûkatla istemenin meşru olmadığı, nitekim onlarla yemin vermenin de meşru olmadığı, bilakis bunun yasaklandığı bilinmektedir."], [724.3, "Hiç kimsenin bir mahlûk ile yemin etmesi caiz olmadığı gibi, Allah'a bir mahlûk ile yemin de verilmez, O'ndan bizzat bir mahlûk ile de istenmez;"], [742.2, "ancak, ayrıntısı geçtiği üzere, duanın kabulüne uygun düşen sebeplerle istenir.\""]]}]}, {"ts": "12:30", "title": "9. Külliye (sonu): Önemli uyarı — Bu mesele içtihadî bir meseledir", "paras": [{"reader": false, "ar": [[750.0, "ثم أقول بعد ذلك تنبيهٌ مهمّ:"], [753.9, "وهي أنّ هذه المسألة العقديّة التي تُسمّى بمسألة التوسُّل بالأولياء والصالحين ـ أي بذواتهم أو بجاههم ـ هذه ليست من المسائل العقديّة الكبار التي يُوالى ويُعادى عليها،"], [771.5, "وإنما في الحقّ أننا نقول فيها بأنه محرّمٌ وليس بمشروع."], [778.0, "وإذا وصفناه بأنه بدعة فلا ينبغي تنزيلُه من الوصف العامّ إلى المعيَّن."], [786.0, "فهذه المسألة من مسائل الاجتهاد التي يسوغ فيها الخلاف."]], "tr": [[750.0, "Sonra bundan sonra önemli bir uyarı söylüyorum:"], [753.9, "Velilerle ve sâlihlerle —yani onların zâtlarıyla veya câhlarıyla— tevessül meselesi denen bu itikadî mesele, üzerine dostluk ve düşmanlık kurulan büyük itikadî meselelerden değildir."], [770.2, "Hakikatte biz bu konuda onun haram olduğunu ve meşru olmadığını söyleriz."], [778.0, "Onu bid'at diye nitelediğimizde, bu genel nitelemeyi belirli bir şahsa indirmek uygun değildir."], [786.0, "Bu mesele, ihtilafın caiz olduğu içtihad meselelerindendir."]]}, {"reader": false, "ar": [[790.0, "ولذلك قال ابنُ تيميّة رحمه الله:"], [793.0, "«وساغ النزاعُ في السؤال بالأنبياء والصالحين دون الإقسام بهم؛ لأنّ بين السؤال والإقسام فرقًا؛ فإنّ السائل متضرّعٌ ذليلٌ يسأل بسببٍ يناسب الإجابة، والمُقسِم أعلى من هذا، فإنه طالبٌ مؤكِّدٌ طلبَه بالقسم»."], [814.0, "انتهى كلامه رحمه الله."]], "tr": [[790.0, "Bu yüzden İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [791.0, "\"Nebîlerle ve sâlihlerle istemek hususunda ihtilaf caiz olmuştur;"], [792.0, "onlarla yemin vermek hususunda değil."], [793.0, "Çünkü istemek ile yemin vermek arasında fark vardır:"], [801.0, "İsteyen, yalvaran ve zelil olan, icabete uygun düşen bir sebeple isteyen kimsedir;"], [808.5, "yemin veren ise bundan daha yukarıdadır;"], [814.0, "o, talebini yeminle pekiştiren bir talepkârdır.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[816.0, "وقال الشيخ محمد بن عبد الوهّاب في بيان ذلك أيضًا:"], [820.0, "«فكونُ بعضٍ يرخّص بالتوسُّل بالصالحين، وبعضُهم يخصّه بالنبيّ صلى الله عليه وسلم، وأكثرُ العلماء ينهى عن ذلك ويكرهه، فهذه المسألة من مسائل الفقه، ولو كان الصواب عندنا قولَ الجمهور أنه مكروه، فلا نُنكر على من فعله، ولا إنكارَ في مسائل الاجتهاد»."], [838.3, "انتهى كلامه. والله أعلم."]], "tr": [[816.0, "Şeyh Muhammed b. Abdilvehhâb da bunu açıklarken şöyle demiştir:"], [820.0, "\"Bazılarının sâlihlerle tevessüle ruhsat vermesi, bazılarının onu Peygamber sallallâhu aleyhi ve sellem'e has kılması, âlimlerin çoğunun ise bunu yasaklayıp mekruh görmesi(ne gelince);"], [832.0, "bu mesele fıkıh meselelerindendir. Bize göre doğru olan, cumhurun 'mekruhtur' sözü olsa da, onu yapana karşı çıkmayız;"], [838.3, "içtihad meselelerinde inkâr (karşı çıkma) yoktur.\" Sözü burada bitti. Allah en iyisini bilir."]]}]}, {"ts": "14:05", "title": "10. Külliye: Peygamber'in câhıyla tevessüle dair her hadis uydurmadır", "paras": [{"reader": false, "ar": [[845.0, "ومن المسائل أيضًا ـ أو نقول:"], [848.6, "ومن الكلّيّات أيضًا ـ: <b>كلُّ حديثٍ في التوسُّل بجاه النبيّ صلى الله عليه وسلم فمكذوب.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[845.0, "Meselelerden biri de —ya da diyelim ki:"], [848.6, "Külliyelerden biri de— şudur: 10."], [852.0, "külliye: Peygamber sallallâhu aleyhi ve sellem'in câhıyla tevessüle dair her hadis uydurmadır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[865.0, "أقول وبالله تعالى التوفيق:"], [867.6, "وهذه الأدلّة المكذوبة الموضوعة المختلَقة المصنوعة على النبيّ صلى الله عليه وسلم هي من أعظم ما يستدلّ به من يُجوِّز التوسُّل إلى الله عز وجل بذات الأنبياء أو بذوات الصالحين."], [887.0, "ولا جرمَ أنّ جاه النبيّ صلى الله عليه وسلم أعظمُ من جاه غيره،"], [892.0, "ولا شكّ أيضًا أنّ منزلته صلى الله عليه وسلم عند الله منزلةٌ عظيمة،"], [899.0, "لا يشكّ في ذلك أحد."], [901.6, "لكن ليست العظمةُ وحدها كافيةً لمشروعيّة التوسُّل بها إلى الله عز وجل."]], "tr": [[865.0, "Tevfik Allah'tandır, derim ki: Peygamber sallallâhu aleyhi ve sellem'e karşı yalan olarak uydurulmuş, mevzu, düzmece ve imal edilmiş bu deliller, Allah Azze ve Celle'ye nebîlerin zâtıyla veya sâlihlerin zâtlarıyla tevessülü caiz görenlerin delil getirdiği en büyük şeylerdendir."], [887.0, "Şüphesiz Peygamber sallallâhu aleyhi ve sellem'in câhı başkasının câhından daha büyüktür."], [892.0, "Yine şüphe yok ki onun —sallallâhu aleyhi ve sellem— Allah katındaki mertebesi büyük bir mertebedir;"], [901.6, "bunda kimse şüphe etmez. Fakat büyüklük tek başına onunla Allah Azze ve Celle'ye tevessülün meşruiyeti için yeterli değildir."]]}]}, {"ts": "15:08", "title": "10. Külliye (devam): Uydurma câh hadisleri ve bid'at ehlinin çelişkisi", "paras": [{"reader": false, "ar": [[908.0, "فالتوسُّل عبادة، والعبادة مبناها على السنّة والاتّباع،"], [912.0, "ولم يأمر بها النبيّ صلى الله عليه وسلم،"], [915.1, "ولم يفعلها الصحابة ولا التابعون،"], [917.0, "رغم قيام المقتضي لها وعدم المانع."], [921.0, "فالواجب على المسلم الوقوفُ حيث وقفوا،"], [924.0, "والإعراضُ عمّا أعرضوا عنه،"], [926.0, "والتمسُّكُ بما تمسّكوا به."]], "tr": [[908.0, "Tevessül bir ibadettir; ibadetin temeli ise sünnete ve ittibâa dayanır."], [912.4, "Peygamber sallallâhu aleyhi ve sellem bunu emretmemiş, sahabe ve tâbiûn da —onu gerektiren sebep mevcut ve engel yokken— bunu yapmamıştır."], [921.0, "Müslümana vâcip olan, onların durduğu yerde durmak, onların yüz çevirdiğinden yüz çevirmek ve onların sarıldığına sarılmaktır."]]}, {"reader": false, "ar": [[928.0, "ومن جملة هذه الأحاديث قولُهم:"], [931.6, "«توسّلوا بجاهي، فإنّ جاهي عند الله عظيم»،"], [936.0, "فإنه مكذوبٌ على النبيّ صلى الله عليه وسلم."], [940.0, "ومنها قولهم: «إذا سألتم الله فاسألوه بجاهي، فإنّ جاهي عند الله عظيم»،"], [946.0, "فإنه كذبٌ باتّفاق أهل المعرفة بالحديث."], [951.0, "ومنها قولهم: «إذا سألتم الله فاسألوه بجاهي»."], [955.0, "ومنها قولهم: «إذا كانت لكم حاجةٌ فاسألوا اللهَ بجاهي»."]], "tr": [[928.0, "Bu hadislerden biri onların \"Benim câhımla tevessül edin;"], [931.6, "çünkü benim câhım Allah katında büyüktür\" sözüdür;"], [935.4, "bu, Peygamber sallallâhu aleyhi ve sellem'e karşı uydurulmuş bir yalandır."], [940.0, "Biri de onların \"Allah'tan bir şey istediğinizde benim câhımla isteyin;"], [943.5, "çünkü benim câhım Allah katında büyüktür\" sözüdür;"], [946.8, "bu da hadis ehlinin ittifakıyla yalandır."], [951.0, "Biri de onların \"Allah'tan bir şey istediğinizde benim câhımla isteyin\" sözüdür."], [955.0, "Biri de onların \"Bir ihtiyacınız olduğunda Allah'tan benim câhımla isteyin\" sözüdür."]]}, {"reader": false, "ar": [[960.0, "ويُبيّن ابنُ تيميّة رحمه الله حالَ هذه الأحاديث بقوله:"], [964.9, "«وروى بعض الجهّال عن النبيّ صلى الله عليه وسلم أنه قال: إذا سألتم الله فاسألوه بجاهي، فإنّ جاهي عند الله عظيم. وهذا الحديث كذب، ليس في شيءٍ من كتب المسلمين التي يعتمد عليها أهل الحديث، ولا ذكره أحدٌ من أهل العلم بالحديث». انتهى كلامه."]], "tr": [[960.0, "İbn Teymiyye —Allah ona rahmet etsin— bu hadislerin durumunu şu sözüyle açıklar:"], [962.2, "\"Bazı cahiller Peygamber sallallâhu aleyhi ve sellem'den onun şöyle dediğini rivayet ettiler:"], [964.9, "'Allah'tan bir şey istediğinizde benim câhımla isteyin;"], [968.3, "çünkü benim câhım Allah katında büyüktür.' Bu hadis yalandır;"], [973.5, "hadis ehlinin dayandığı Müslümanların kitaplarının hiçbirinde yoktur ve hadis ilmi ehlinden hiç kimse onu zikretmemiştir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[984.4, "ومن المعلوم المتقرّر أنّ باب التوسُّل بابٌ توقيفيٌّ على النصّ،"], [992.0, "فلا يجوز لنا أن نُثبت شيئًا من هذه الوسائل إلا وعلى ذلك دليلٌ من الشرع."], [1001.0, "ثم إذا رأيتَ أهلَ البدع يستدلّون بتلك الأحاديث المكذوبة الموضوعة في مسألةٍ عقديّة فإنك تعجب؛"], [1008.4, "مع أنّ الأصل عندهم أنّ أحاديث الآحاد الصحيحة التي اتّفق عليها الشيخان لا يُستدَلّ بها في مسائل الاعتقاد!"]], "tr": [[984.4, "Bilinen ve yerleşik olan şudur:"], [987.1, "Tevessül babı nassa bağlı (tevkîfî) bir babdır."], [992.6, "Dolayısıyla bu vesilelerden herhangi birini, üzerinde şeriattan bir delil olmadıkça isbat etmemiz caiz değildir."], [1001.0, "Sonra bid'at ehlinin itikadî bir meselede bu uydurma, mevzu hadislerle delil getirdiğini gördüğünde şaşarsın;"], [1007.0, "oysa onlara göre asıl olan, iki şeyhin (Buhârî ile Müslim'in) üzerinde ittifak ettiği sahih âhâd hadislerle bile itikad meselelerinde delil getirilmemesidir!"]]}, {"reader": false, "ar": [[1020.0, "ولكن لأنّ الحديث إذا جاء على هواهم وعلى ما يريدون فإنهم مباشرةً يفزعون إلى الاستدلال به،"], [1030.0, "متعامين عن كونه صحيحًا أو ضعيفًا،"], [1033.5, "ومتعامين عن كونه متواترًا أو آحادًا."], [1037.0, "وهذا يدلّك على أنهم من أصحاب الأهواء، أنهم عبيدٌ لأهوائهم."]], "tr": [[1020.0, "Fakat hadis onların hevâsına ve istediklerine uygun geldiğinde, onun sahih mi zayıf mı olduğuna göz yumarak, mütevâtir mi âhâd mı olduğuna göz yumarak hemen onunla delil getirmeye koşarlar."], [1037.0, "Bu da sana onların hevâ sahiplerinden olduğunu, hevâlarının kulları olduğunu gösterir."]]}, {"reader": false, "ar": [[1043.0, "ويُذكّرني هذا تحريفَهم لأدلّة إثبات صفة الكلام لله عز وجل في الكتاب والسنّة،"], [1053.0, "بقولٍ ـ ببيتٍ من الشعر ـ لا يُعرَف قائلُه،"], [1056.0, "لا يُعرَف قائلُه، وبعضهم ينسبه إلى رجلٍ سِكّير:"], [1060.0, "«إنّ البيانَ لفي الفؤادِ وإنّما … جُعِلَ اللسانُ على الفؤادِ دليلا»."], [1067.8, "(يكرر الشطر الثاني) وهذا دليلٌ ـ (عندهم) ـ على أنّ الكلام الذي أضافه الله عز وجل إلى نفسه في الكتاب والسنّة إنما هو الكلام النفسيّ."], [1079.0, "وهذا يدلّك على أنهم من أصحاب الأهواء والبدع."]], "tr": [[1043.0, "Bu bana, Kitap ve Sünnet'te Allah Azze ve Celle için kelâm sıfatını isbat eden delilleri, söyleyeni bilinmeyen —söyleyeni bilinmeyen— ve bazılarının bir ayyaşa nispet ettiği bir sözle, bir şiir beytiyle tahrif etmelerini hatırlatıyor:"], [1060.0, "\"Beyan kalptedir; dil ancak kalbe delil kılınmıştır.\" (İkinci mısrayı tekrar ediyor.) (Onlara göre) bu, Allah Azze ve Celle'nin Kitap ve Sünnet'te kendisine izafe ettiği kelâmın ancak kelâm-ı nefsî olduğuna delildir."], [1079.0, "Bu da sana onların hevâ ve bid'at sahiplerinden olduğunu gösterir."]]}, {"reader": false, "ar": [[1084.0, "ولأنّ أيَّ وسيلةٍ تُثبت كونَها وسيلةً يصحّ التوسُّل بها فإنك تُثبت حكمًا شرعيًّا،"], [1092.0, "والمتقرّر في القواعد أنّ الأحكام الشرعيّة تفتقر في ثبوتها للأدلّة الصحيحة الصريحة."], [1099.0, "فكلُّ حديثٍ يتضمّن هذه الأشياء من جواز التوسُّل بالذات أو الجاه فإنه من الأحاديث المكذوبة،"], [1108.0, "والأحاديث المكذوبة لا يجوز أن نجعلها محلًّا لاستنباط شيءٍ من الأحكام الشرعيّة. والله أعلم."]], "tr": [[1084.0, "Ayrıca herhangi bir vesilenin, kendisiyle tevessül edilmesi sahih bir vesile olduğunu isbat ettiğinde, şer'î bir hüküm isbat etmiş olursun."], [1092.6, "Kaidelerde yerleşik olan şudur: Şer'î hükümler sabit olmak için sahih ve sarih delillere muhtaçtır."], [1099.0, "Zâtla veya câhla tevessülün caiz olması gibi bu şeyleri içeren her hadis uydurma hadislerdendir."], [1107.0, "Uydurma hadisleri ise şer'î hükümlerden herhangi birinin istinbatına mahal yapmamız caiz değildir. Allah en iyisini bilir."]]}]}, {"ts": "18:35", "title": "11. Külliye: Tam güven, tevekkül ve hüsn-i zanna dayanan her iksâm caizdir", "paras": [{"reader": false, "ar": [[1115.0, "ومن الكلّيّات أيضًا: <b>كلُّ إقسامٍ على الله<\/b> ـ كلُّ إقسامٍ على الله ـ يقوم على..."], [1126.4, "<b>مبنيٍّ على كمال الثقة والتوكُّل وإحسان الظنّ بالله فيجوز.<\/b> <b>كلُّ إقسامٍ على الله مبنيٍّ على كمال الثقة والتوكُّل وإحسان الظنّ به عز وجل فيجوز.<\/b> نُعيدها مرّةً ثانية:"], [1155.8, "<b>كلُّ إقسامٍ على الله مبنيٍّ على كمال الثقة والتوكُّل عليه وإحسان الظنّ به فيجوز.<\/b>"]], "tr": [[1115.0, "Külliyelerden biri de şudur: 11."], [1119.0, "külliye: Allah'a yemin vermenin (iksâmın) —Allah'a yemin vermenin— dayanan… tam güven, tevekkül ve Allah'a hüsn-i zan üzerine kurulu olan her türlüsü caizdir. (İki kez daha tekrar ediyor; \"Bir kez daha tekrar ediyoruz\" diyor.)"]]}, {"reader": false, "ar": [[1164.0, "أقول وبالله تعالى التوفيق:"], [1166.2, "وهذه مسألةٌ عقديّةٌ يُسمّيها أهلُ السنّة بمسألة الإقسام على الله عز وجل،"], [1173.0, "بمعنى: أُقسم عليك يا الله أن تفعل كذا وكذا؛"], [1178.4, "فهل هذا يجوز أو لا يجوز؟"], [1182.0, "أكثرُ أهل السنّة والجماعة يُقسّمون الإقسام على الله عز وجل إلى قسمين،"], [1188.0, "وهذه الكلّيّة التي نحن بصدد شرحها تتكلّم عن القسم الأوّل:"], [1195.0, "وهي ذلك الإقسام الذي إنما يبنيه صاحبُه على كمال الثقة بموعود الله عز وجل،"]], "tr": [[1164.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet'in \"Allah Azze ve Celle'ye yemin verme meselesi\" diye adlandırdığı itikadî bir meseledir;"], [1173.6, "yani \"Ey Allah'ım, şunu şunu yapman için sana yemin ederim\" demek."], [1178.4, "Bu caiz midir, değil midir?"], [1182.0, "Ehl-i Sünnet ve'l-Cemaat'in çoğu, Allah Azze ve Celle'ye yemin vermeyi iki kısma ayırır."], [1188.6, "Şerhini yapmakta olduğumuz bu külliye birinci kısımdan bahsetmektedir:"], [1195.0, "Sahibinin, Allah Azze ve Celle'nin vaadine tam güven üzerine kurduğu yemin verme;"]]}]}, {"ts": "20:03", "title": "11. Külliye (devam): Rubeyyi' hadisi ve \"Allah'a yemin verse onu doğru çıkarır\" hadisleri", "paras": [{"reader": false, "ar": [[1203.0, "وأنّ الله لن يُخلِف ميعادَه،"], [1204.7, "مع كمال فعل الأسباب،"], [1206.0, "ويبنيه صاحبُه على كمال التوكُّل على الله عز وجل،"], [1211.0, "ويبنيه صاحبُه على إحسان الظنّ بربّه؛"], [1216.0, "فإنّ هذا الإقسام جائزٌ لا بأس به ولا حرج فيه."]], "tr": [[1203.0, "ve Allah'ın vaadinden dönmeyeceğine (güvenerek), sebepleri de tam olarak yerine getirmekle birlikte;"], [1206.0, "sahibinin onu Allah Azze ve Celle'ye tam tevekkül üzerine kurması ve sahibinin onu Rabbine hüsn-i zan üzerine kurması."], [1216.0, "İşte bu yemin verme caizdir;"], [1217.2, "bunda bir sakınca da bir vebal de yoktur."]]}, {"reader": false, "ar": [[1220.0, "وبرهانُ ذلك ما جاء في صحيح البخاريّ ومسلم من حديث أنسٍ رضي الله عنه:"], [1228.0, "أنّ الرُّبَيِّع ـ وهي ابنة النضر ـ كسرت ثنيّةَ جارية،"], [1234.0, "فطلبوا الأرْشَ ـ أي الدية ـ وطلبوا العفوَ فأبَوا،"], [1243.0, "فأتوا النبيّ صلى الله عليه وسلم فأمرهم بالقصاص."], [1247.0, "فقال أنسُ بن النضر:"], [1249.4, "أتُكسَر ثنيّةُ الرُّبَيِّع يا رسول الله؟"], [1253.0, "لا والذي بعثك بالحقّ لا تُكسَر ثنيّتُها."], [1258.0, "فقال النبيّ صلى الله عليه وسلم:"], [1261.2, "«يا أنس، كتابُ الله القصاص» ـ والسنُّ بالسنّ ـ فرضي القومُ وعفَوا."]], "tr": [[1220.0, "Bunun burhanı, Sahîh-i Buhârî ve Müslim'de Enes —Allah ondan razı olsun— hadisinde gelendir:"], [1225.0, "Nadr'ın kızı Rubeyyi' bir cariyenin ön dişini kırdı."], [1228.0, "(Rubeyyi'in ailesi) erş —yani diyet— istediler ve affetmelerini istediler;"], [1234.0, "(cariyenin ailesi) kabul etmedi. Peygamber sallallâhu aleyhi ve sellem'e geldiler;"], [1244.5, "o da onlara kısası emretti."], [1247.0, "Bunun üzerine Enes b. en-Nadr dedi ki:"], [1249.4, "\"Ey Allah'ın Resûlü! Rubeyyi'in ön dişi mi kırılacak?"], [1253.0, "Hayır! Seni hak ile gönderene yemin olsun ki onun dişi kırılmayacak.\" Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1261.2, "\"Ey Enes! Allah'ın kitabı (hükmü) kısastır\" —diş dişe— Bunun üzerine kavim razı oldu ve affetti."]]}, {"reader": false, "ar": [[1268.2, "جاؤوا فجأةً ـ بعد أن كانوا يُطالبون بالقصاص ـ إلى النبيّ صلى الله عليه وسلم،"], [1276.0, "بعد أن أقسم النضر،"], [1278.2, "جاؤوا وعفَوا عن القصاص."], [1282.0, "فقال النبيّ صلى الله عليه وسلم:"], [1285.0, "«إنّ من عباد الله من لو أقسم على الله لأبرّه»."], [1290.0, "فرضي القومُ وقبلوا الأرشَ، أي الدية."]], "tr": [[1268.2, "Kısas talep ediyorlarken, (Enes b.) en-Nadr yemin ettikten sonra ansızın Peygamber sallallâhu aleyhi ve sellem'e geldiler;"], [1275.5, "gelip kısastan vazgeçtiler. Bunun üzerine Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1282.0, "\"Allah'ın kullarından öyleleri vardır ki Allah'a yemin verse, Allah onun yeminini doğru çıkarır.\" Kavim razı oldu ve erşi, yani diyeti kabul etti."]]}, {"reader": false, "ar": [[1294.0, "ويدلّ على هذه الكلّيّة أيضًا ما رواه الإمامُ مسلمٌ في صحيحه من حديث أبي هريرة رضي الله عنه قال:"], [1304.3, "قال النبيّ صلى الله عليه وسلم:"], [1307.6, "«رُبَّ أشعثَ أغبرَ مدفوعٍ بالأبواب لو أقسم على الله لأبرّه»."], [1313.0, "ويدلّ عليها أيضًا ما رواه الإمامُ الترمذيّ في جامعه بإسنادٍ حسن من حديث أنسٍ رضي الله عنه قال:"], [1320.9, "قال رسول الله صلى الله عليه وسلم:"], [1324.0, "«كم من أشعثَ أغبرَ ذي طِمْرَين لا يُؤبَه له، لو أقسم على الله لأبرّه»."]], "tr": [[1294.0, "Bu külliyeye, İmam Müslim'in Sahîh'inde Ebû Hüreyre —Allah ondan razı olsun— hadisinden rivayet ettiği şu hadis de delâlet eder:"], [1301.6, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1304.3, "\"Nice saçı dağınık, toz toprak içinde, kapılardan itilen kimse vardır ki Allah'a yemin verse, Allah onun yeminini doğru çıkarır.\" İmam Tirmizî'nin Câmi'inde hasen bir isnadla Enes —Allah ondan razı olsun— hadisinden rivayet ettiği şu hadis de buna delâlet eder:"], [1320.9, "Resûlullah sallallâhu aleyhi ve sellem buyurdu:"], [1322.7, "\"Nice saçı dağınık, toz toprak içinde, iki eski elbiseli, kendisine aldırış edilmeyen kimse vardır ki Allah'a yemin verse, Allah onun yeminini doğru çıkarır.\""]]}, {"reader": false, "ar": [[1334.0, "قال الإمامُ النوويّ رحمه الله تعالى:"], [1337.0, "«أي لو حلف على وقوع شيءٍ أوقعه الله إكرامًا له، بإجابة سؤاله، وصيانته من الحِنث في يمينه، وهذا لعِظَم منزلته عند الله تعالى وإن كان حقيرًا عند الناس»."], [1355.0, "انتهى كلامه رحمه الله."], [1359.0, "فالإقسام على الله عز وجل جائزٌ لا بأس به بهذه الاعتبارات المذكورة في هذه الكلّيّة."]], "tr": [[1334.0, "İmam Nevevî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1337.0, "\"Yani bir şeyin olacağına yemin etse, isteğini kabul ederek ve onu yemininde hânis olmaktan (yemini bozmaktan) koruyarak ona ikram olsun diye Allah onu gerçekleştirir."], [1346.0, "Bu da, insanlar nezdinde değersiz olsa bile, onun Allah Teâlâ katındaki mertebesinin büyüklüğündendir.\" Sözü —Allah ona rahmet etsin— burada bitti."], [1359.0, "Dolayısıyla bu külliyede zikredilen bu itibarlarla Allah Azze ve Celle'ye yemin vermek caizdir, bunda bir sakınca yoktur."]]}]}, {"ts": "22:47", "title": "11. Külliye (devam): Selefin iksâm örnekleri — Berâ b. Mâlik, Nu'mân b. Kavkal, Sıla b. Eşyem", "paras": [{"reader": false, "ar": [[1367.0, "وقد حصل عن بعض السلف شيءٌ من ذلك؛"], [1371.0, "فيذكرون في كتب التاريخ أنّ من هؤلاء البراءَ بنَ مالك،"], [1377.0, "حيث لقي زحفًا من المشركين في معركة تُستَر،"], [1382.0, "فقال له المسلمون: أقسِمْ على ربّك ـ أي بالنصر ـ فقال:"], [1389.5, "«أقسمتُ عليك يا ربّي لمّا منحتَنا أكتافَهم»،"], [1393.0, "فمنحهم أكتافَهم. ثم التقَوا مرّةً أخرى،"], [1399.0, "فقالوا: أقسِمْ على ربّك،"], [1400.0, "فقال: «أقسمتُ عليك يا ربّي لمّا منحتَنا أكتافَهم وألحقتَني بنبيّك»،"], [1408.0, "فمُنِحوا أكتافَهم، وقُتل البراء."]], "tr": [[1367.0, "Seleften bazılarından da bunun bir kısmı vâki olmuştur."], [1371.0, "Tarih kitaplarında zikrederler ki bunlardan biri Berâ b."], [1375.2, "Mâlik'tir: Tüster savaşında müşriklerden bir orduyla karşılaştı."], [1378.9, "Müslümanlar ona \"Rabbine yemin ver\" —yani zafer için— dediler."], [1384.3, "O da \"Rabbim! Sana yemin ederim ki bize onların omuzlarını ver (onları bize yenik düşür)\" dedi;"], [1392.0, "(Allah) onlara düşmanın omuzlarını verdi."], [1395.0, "Sonra tekrar karşılaştılar; \"Rabbine yemin ver\" dediler."], [1399.2, "O da \"Rabbim! Sana yemin ederim ki bize onların omuzlarını ver ve beni Peygamberine kavuştur\" dedi."], [1404.4, "(Müslümanlara) onların omuzları verildi ve Berâ öldürüldü (şehit oldu)."]]}, {"reader": false, "ar": [[1414.0, "وكذلك من هؤلاء النعمانُ بنُ قَوْقَل؛"], [1418.0, "فقد روى ابنُ أبي الدنيا بإسنادٍ له أنّ النعمان قال يوم أُحُد:"], [1425.0, "«اللهمّ إني أُقسم عليك أن أُقتَل فأدخلَ الجنّة»،"], [1430.0, "فقُتل. فقال النبيّ صلى الله عليه وسلم:"], [1436.0, "«إنّ النعمان أقسم على الله فأبرّه»."], [1438.0, "وقال صلى الله عليه وسلم:"], [1441.0, "«ظنَّ بالله خيرًا فوجده عند ظنّه، فلقد رأيتُه في الجنّة يطأ في خُضَرها، ما به من عَرَج»."]], "tr": [[1414.0, "Bunlardan biri de Nu'mân b."], [1418.0, "Kavkal'dır. İbn Ebi'd-Dünyâ kendine ait bir isnadla rivayet etmiştir ki Nu'mân Uhud günü şöyle dedi:"], [1425.0, "\"Allah'ım! Sana yemin ederim ki öldürüleyim de cennete gireyim.\" Ve öldürüldü."], [1430.7, "Bunun üzerine Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1436.0, "\"Nu'mân Allah'a yemin verdi, Allah da onun yeminini doğru çıkardı.\" Yine sallallâhu aleyhi ve sellem buyurdu:"], [1441.0, "\"Allah hakkında hayır zannetti, O'nu zannının yanında buldu."], [1445.6, "Andolsun onu cennette, yeşilliklerinde yürürken gördüm; onda hiçbir topallık yoktu.\""]]}, {"reader": false, "ar": [[1452.0, "ومن ذلك أيضًا ما حصل لصِلةَ بنِ أشْيَم رحمه الله تعالى،"], [1459.3, "حيث كان في سريّة،"], [1462.0, "فذهبت بغلتُه بثِقلها ـ فرّت منه ـ وارتحل الناس،"], [1470.0, "فقام يُصلّي وقال: «اللهمّ إني أُقسم عليك أن تردّ عليّ بغلتي وثِقلها»،"], [1479.0, "فجاءت حتى قامت بين يديه. والله أعلم."]], "tr": [[1452.0, "Bundan biri de Sıla b."], [1454.0, "Eşyem'in —Allah Teâlâ ona rahmet etsin— başına gelendir:"], [1458.0, "Bir seriyyede (askerî birlikte) idi;"], [1460.7, "katırı yüküyle birlikte gitti —ondan kaçtı— ve insanlar göçüp gitti."], [1466.5, "O da kalkıp namaz kıldı ve \"Allah'ım!"], [1472.7, "Katırımı ve yükünü bana geri döndürmen için sana yemin ederim\" dedi."], [1479.0, "(Katır) gelip önünde durdu. Allah en iyisini bilir."]]}]}, {"ts": "24:44", "title": "12. Külliye: Sebebi kendini beğenme, kadere itiraz ve Allah'a sınır koyma olan her iksâm haramdır", "paras": [{"reader": false, "ar": [[1484.0, "ومن الكلّيّات أيضًا: <b>كلُّ إقسامٍ على الله سببُه الإعجابُ بالنفس ومخاصمةُ القدر والتحجيرُ على الله فمحرَّم.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1484.0, "Külliyelerden biri de şudur: 12."], [1486.0, "külliye: Sebebi kendini beğenme, kaderle çekişme ve Allah'a sınır koyma (tahcîr) olan her türlü Allah'a yemin verme haramdır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1521.0, "أقول: أي تحجيرُ ما وسّعه الله عز وجل."], [1525.0, "فالإقسام على الله عز وجل تألّيًا أو اعتراضًا على قدره ومشيئته،"], [1532.0, "بحيث ينصّب المُقسِمُ نفسَه حَكَمًا بين يدي الله عز وجل،"], [1537.0, "هذا محرّمٌ في قول عامّة أهل العلم."], [1542.0, "وهذا هو النوع ـ أو القسم ـ الثاني من أقسام الإقسام على الله عز وجل،"], [1550.0, "وهذا من الافتيات على ربّ العالمين،"], [1553.0, "وهو مَزَلّةُ قدمٍ ومَوْرِدُ هَلَكةٍ لمن وقع فيه."]], "tr": [[1521.0, "Derim ki: Yani Allah Azze ve Celle'nin geniş tuttuğunu daraltmak."], [1525.0, "Allah Azze ve Celle'ye te'allî ederek (O'nun adına kesin hüküm vererek) veya O'nun kaderine ve meşîetine itiraz ederek, yemin edenin kendisini Allah Azze ve Celle'nin huzurunda hakem tayin edeceği şekilde yemin vermek, ilim ehlinin geneline göre haramdır."], [1542.0, "Bu, Allah Azze ve Celle'ye yemin vermenin kısımlarından ikinci türdür —veya ikinci kısımdır—."], [1547.5, "Bu, Âlemlerin Rabbine karşı haddini aşıp O'nun yerine hüküm vermektir (iftiyât);"], [1552.5, "buna düşen için ayağın kaydığı bir yer ve helake götüren bir kaynaktır."]]}, {"reader": false, "ar": [[1557.0, "وبرهانُ ذلك ما أخرجه الإمامُ مسلمٌ في صحيحه من حديث جُندَبٍ ـ أو جُندُبٍ،"], [1564.8, "لغتان صحيحتان ـ رضي الله عنه:"], [1567.5, "أنّ رسول الله صلى الله عليه وسلم حدّث «أنّ رجلًا قال: واللهِ لا يغفر اللهُ لفلان، وإنّ الله تعالى قال: مَن ذا الذي يتألّى عليّ ألّا أغفرَ لفلان؟ فإني قد غفرتُ لفلان وأحبطتُ عملَك»."], [1585.0, "وهذا أقسم مخاصمًا لله عز وجل في رحمته،"], [1591.0, "ومتألّيًا على الله في تضييق ما وسّعه الله على عباده،"], [1596.0, "كما في قوله عز وجل:"], [1598.3, "<span class=\"ayah\">﴿رَبَّنَا وَسِعْتَ كُلَّ شَيْءٍ رَّحْمَةً وَعِلْمًا﴾<\/span> <span class=\"ref\">[غافر: ٧]<\/span>."]], "tr": [[1557.0, "Bunun burhanı, İmam Müslim'in Sahîh'inde Cündeb —veya Cündüb;"], [1560.0, "ikisi de sahih iki söyleyiştir— —Allah ondan razı olsun— hadisinden rivayet ettiğidir:"], [1564.8, "Resûlullah sallallâhu aleyhi ve sellem anlattı ki:"], [1567.5, "\"Bir adam 'Vallahi Allah falancayı bağışlamaz' dedi."], [1572.5, "Allah Teâlâ da şöyle buyurdu:"], [1577.8, "Benim falancayı bağışlamayacağıma dair benim adıma yemin eden de kim?"], [1585.0, "Ben falancayı bağışladım ve senin amelini boşa çıkardım.\" Bu adam, Allah Azze ve Celle ile rahmeti hususunda çekişerek ve Allah'ın kullarına geniş tuttuğunu daraltma hususunda Allah adına kesin hüküm vererek yemin etmiştir;"], [1598.3, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [1599.2, "<span class=\"ayah\">﴿Rabbimiz! Sen rahmetin ve ilminle her şeyi kuşattın﴾<\/span> [Mü'min 7]."]]}, {"reader": false, "ar": [[1601.0, "وفي سنن أبي داود بإسنادٍ صحيح من حديث أبي هريرة رضي الله عنه قال:"], [1607.6, "سمعتُ النبيّ صلى الله عليه وسلم يقول:"], [1612.0, "«كان رجلان في بني إسرائيل متواخيَين، فكان أحدُهما يُذنب، والآخرُ مجتهدٌ في العبادة، فكان لا يزال المجتهدُ يرى الآخرَ على الذنب فيقول: أقصِر. فوجده يومًا على ذنبٍ فقال له: أقصِر، فقال: خلِّني وربّي، أبُعِثتَ عليّ رقيبًا؟ فقال: واللهِ لا يغفرُ اللهُ لك ـ أو لا يُدخِلُك اللهُ الجنّة ـ."]], "tr": [[1601.0, "Ebû Dâvûd'un Sünen'inde sahih bir isnadla Ebû Hüreyre —Allah ondan razı olsun— hadisinde şöyle geçer:"], [1604.2, "Peygamber sallallâhu aleyhi ve sellem'i şöyle derken işittim:"], [1606.1, "\"İsrâiloğulları'nda kardeş edinmiş iki adam vardı."], [1607.6, "Biri günah işliyor, diğeri ibadette gayret gösteriyordu."], [1608.2, "Gayretli olan, diğerini günah üzere görmeye devam ediyor ve 'Vazgeç' diyordu."], [1610.1, "Bir gün onu bir günah üzere buldu ve ona 'Vazgeç' dedi."], [1612.0, "O da 'Beni Rabbimle baş başa bırak;"], [1619.4, "sen başıma bekçi olarak mı gönderildin?' dedi."], [1626.5, "(Gayretli olan) 'Vallahi Allah seni bağışlamaz' —veya 'Allah seni cennete sokmaz'— dedi."]]}, {"reader": false, "ar": [[1646.0, "فأرسل الله إليهما ملَكًا فقبض أرواحَهما،"], [1650.0, "فاجتمعا عند ربّ العالمين،"], [1652.6, "فقال لهذا المجتهد: أكنتَ بي عالمًا؟"], [1656.6, "أو كنتَ على ما في يدي قادرًا؟"], [1662.0, "وقال للمذنب: اذهب أنت فادخل الجنّة برحمتي،"], [1669.0, "وقال للآخر: اذهبوا به إلى النار»."], [1672.0, "قال أبو هريرة رضي الله عنه:"], [1674.0, "«والذي نفسي بيده لقد تكلّم بكلمةٍ أوبقت دنياه وآخرتَه»."]], "tr": [[1646.0, "Allah onlara bir melek gönderdi, o da ruhlarını kabzetti."], [1650.7, "Âlemlerin Rabbinin huzurunda bir araya geldiler."], [1654.6, "(Allah) bu gayretli olana 'Sen beni bilen biri miydin?"], [1662.0, "Yoksa elimde olana gücü yeten biri miydin?' dedi."], [1665.0, "Günahkâra 'Sen git, rahmetimle cennete gir' dedi."], [1670.0, "Diğeri için de 'Onu ateşe götürün' dedi.\" Ebû Hüreyre —Allah ondan razı olsun— dedi ki:"], [1674.0, "\"Canım elinde olana yemin olsun ki o, dünyasını ve âhiretini helak eden bir söz söyledi.\""]]}, {"reader": false, "ar": [[1682.0, "وهذا من باب تحجُّر الواسع،"], [1686.0, "ومن باب مخاصمة الله عز وجل في مغفرته ورحمته وسعة فضله على عباده،"], [1692.0, "وهو من باب الإعجاب بأعماله أيضًا."]], "tr": [[1682.0, "Bu, geniş olanı daraltma kabilindendir;"], [1685.2, "Allah Azze ve Celle ile mağfireti, rahmeti ve kullarına olan fazlının genişliği hususunda çekişme kabilindendir."], [1692.0, "Aynı zamanda kendi amellerini beğenme kabilindendir."]]}, {"reader": false, "ar": [[1701.0, "قال الشيخ ابنُ عثيمين رحمه الله تعالى:"], [1704.0, "«النوع الثاني من الإقسام على الله: ما كان الحاملُ عليه الغرورَ والإعجابَ بالنفس، وأنه يستحقّ على الله كذا وكذا، فهذا ـ والعياذ بالله ـ محرّم، وقد يكون مُحبِطًا للعمل؛ كأن يحلف الإنسان على ألّا يرحم الله عبادَه أو عبدًا من عباده، أو لا يغفر لعباده، أو لا يغفر لفلان بن فلان، وألّا يُدخل أحدًا منهم الجنّة»."], [1735.0, "فكلُّ ذلك ـ والله ـ من أعظم الحرام،"], [1737.1, "ومن أعظم قلّة الأدب على الله عز وجل،"], [1740.0, "«فهو من سوء الأدب؛ لأنّ معناه الحَجْرُ على الله تعالى»."], [1746.0, "ومن المعلوم أنّ الله لا مُكرِهَ له."]], "tr": [[1701.0, "Şeyh İbn Useymîn —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1702.7, "\"Allah'a yemin vermenin ikinci türü:"], [1704.0, "Buna sevk eden şeyin gurur, kendini beğenme ve Allah üzerinde şu şu hakkı olduğu (düşüncesi) olmasıdır."], [1711.0, "Bu —Allah korusun— haramdır ve ameli boşa çıkarabilir;"], [1714.5, "insanın Allah'ın kullarına veya kullarından bir kula merhamet etmeyeceğine, kullarını bağışlamayacağına veya falan oğlu falancayı bağışlamayacağına ve onlardan hiçbirini cennete sokmayacağına yemin etmesi gibi.\" Vallahi bütün bunlar en büyük haramlardan ve Allah Azze ve Celle'ye karşı en büyük edepsizliklerdendir."], [1735.0, "\"Bu edepsizliktir; çünkü anlamı Allah Teâlâ'yı kısıtlamaktır.\" Bilinmektedir ki Allah'ı zorlayan hiçbir kimse yoktur."]]}, {"reader": false, "ar": [[1751.0, "وبهاتين الكلّيّتين يتحرّر لكم حكمُ الإقسام على الله عز وجل:"], [1759.0, "فإن كان من باب كمال إحسان الظنّ والثقة والتوكُّل على الله فلا بأس به،"], [1764.0, "وإن كان من باب الإعجاب بالنفس ومخاصمة القدر والتحجير على الله عز وجل فإنه محرّمٌ وقلّةُ أدب."]], "tr": [[1751.0, "Bu iki külliyeyle Allah Azze ve Celle'ye yemin vermenin hükmü sizin için netleşir:"], [1759.0, "Eğer tam bir hüsn-i zan, güven ve Allah'a tevekkül kabilindense bunda sakınca yoktur."], [1763.6, "Eğer kendini beğenme, kaderle çekişme ve Allah Azze ve Celle'ye sınır koyma kabilindense haramdır ve edepsizliktir."]]}]}, {"ts": "29:33", "title": "13. Külliye: Allah'a bir mahlûk ile yemin veren herkes müşriktir", "paras": [{"reader": false, "ar": [[1773.0, "ومن الكلّيّات أيضًا: <b>كلُّ من أقسم على الله بمخلوقٍ فمشرك.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1773.0, "Külliyelerden biri de şudur: 13."], [1774.8, "külliye: Allah'a bir mahlûk ile yemin veren herkes müşriktir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1793.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرّر في القواعد عند أهل السنّة والجماعة أنه لا يُحلَف إلا بالله،"], [1805.9, "أو صفةٍ من صفاته،"], [1807.5, "أو خبريّةٍ متمحِّضةٍ في الدلالة على الله عز وجل."], [1811.0, "فلا يجوز أن يحلف الإنسانُ على الله ولا على مخلوقٍ آخر بمخلوقٍ آخر؛"], [1820.0, "فإنّ الإقسام بالمخلوقات من الأمور التي دلّت الأدلّة الكثيرة الصحيحة على أنها من الشرك والكفر،"], [1828.0, "كقول النبيّ صلى الله عليه وسلم:"], [1830.6, "«من حلف بغير الله فقد كفر أو أشرك»."], [1834.0, "وقال صلى الله عليه وسلم:"], [1836.7, "«لا تحلفوا بآبائكم، فمن كان حالفًا فليحلف بالله أو ليصمت»."], [1842.0, "وقد ذكرتُ جُمَلًا من الأدلّة على تحريم الحلف بغير الله عز وجل في كلّيّاتٍ سابقة."]], "tr": [[1793.0, "Tevfik Allah'tandır, derim ki: Bu böyledir;"], [1795.0, "çünkü Ehl-i Sünnet ve'l-Cemaat nezdinde kaidelerde yerleşik olan şudur:"], [1799.8, "Ancak Allah ile veya O'nun sıfatlarından bir sıfatla ya da yalnızca Allah Azze ve Celle'ye delâlet eden haberî bir ifadeyle yemin edilir."], [1811.0, "Dolayısıyla insanın ne Allah'a ne de başka bir mahlûka, başka bir mahlûk ile yemin etmesi caiz değildir."], [1820.0, "Çünkü mahlûkatla yemin etmek, birçok sahih delilin şirk ve küfürden olduğuna delâlet ettiği şeylerdendir;"], [1826.9, "Peygamber sallallâhu aleyhi ve sellem'in şu sözü gibi:"], [1830.6, "\"Allah'tan başkasıyla yemin eden küfre girmiş veya şirk koşmuştur.\" Yine sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1836.7, "\"Babalarınızla yemin etmeyin; yemin edecek olan Allah ile yemin etsin veya sussun.\" Allah Azze ve Celle'den başkasıyla yemin etmenin haram olduğuna dair delillerden birçoğunu önceki külliyelerde zikretmiştim."]]}, {"reader": false, "ar": [[1850.0, "قال ابنُ تيميّة رحمه الله تعالى:"], [1853.3, "«الذي قاله أبو حنيفة وأصحابه وغيرهم من العلماء ـ من أنه لا يجوز أن يُسأل اللهُ تعالى بمخلوق، لا بحقّ الأنبياء ولا غير ذلك ـ يتضمّن شيئين كما تقدّم: أحدهما: الإقسام على الله سبحانه وتعالى، فهذا منهيٌّ عنه عند جماهير العلماء كما تقدّم، كما يُنهى أن يُقسَم على الله بالكعبة والمشاعر باتّفاق العلماء»."]], "tr": [[1850.0, "İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1850.6, "\"Ebû Hanîfe'nin, arkadaşlarının ve diğer âlimlerin söylediği —Allah Teâlâ'dan bir mahlûk ile, ne nebîlerin hakkıyla ne de başka bir şeyle istenmesinin caiz olmadığı— söz, geçtiği üzere iki şeyi içerir:"], [1853.3, "Birincisi: Allah Sübhânehû ve Teâlâ'ya yemin vermek."], [1859.9, "Bu, geçtiği üzere âlimlerin cumhuruna göre yasaklanmıştır;"], [1867.4, "tıpkı âlimlerin ittifakıyla Allah'a Kâbe ve meş'arlar (hac mekânları) ile yemin vermenin yasaklandığı gibi.\""]]}, {"reader": false, "ar": [[1887.0, "فلا يجوز أن يقول الإنسان:"], [1890.1, "أُقسم عليك بالنبيّ صلى الله عليه وسلم،"], [1894.6, "أو أُقسم عليك بالملائكة،"], [1897.1, "أو أُقسم عليك بالكعبة،"], [1899.6, "أو أُقسم عليك بالحوض المورود والمقام المحمود،"], [1904.0, "أو أُقسم عليك بكذا وكذا من المخلوقات."], [1908.0, "فكلُّ ذلك من الشرك:"], [1909.0, "فإن كان بمطلق التعظيم فشركٌ أصغر،"], [1916.0, "وإن كان بالتعظيم المطلق فشركٌ أكبر."]], "tr": [[1887.0, "Dolayısıyla insanın \"Peygamber sallallâhu aleyhi ve sellem hakkı için sana yemin ederim\", \"Melekler hakkı için sana yemin ederim\", \"Kâbe hakkı için sana yemin ederim\", \"Varılacak Havz ve Makâm-ı Mahmûd hakkı için sana yemin ederim\" ya da \"Mahlûkattan şu şu hakkı için sana yemin ederim\" demesi caiz değildir."], [1908.0, "Bütün bunlar şirktendir: Eğer mutlak (herhangi bir derecede) tazim ile ise küçük şirktir;"], [1912.8, "eğer tam (ve mutlak) tazim ile ise büyük şirktir."]]}, {"reader": false, "ar": [[1922.0, "قال الإمامُ ابنُ تيميّة رحمه الله:"], [1925.0, "«فإنّ الله يُقسِم بما يُقسِم به من مخلوقاته لأنها آياتُه ومخلوقاته، فهي دليلٌ على ربوبيّته وألوهيّته ووحدانيّته، وعلمه وقدرته ومشيئته ورحمته وحكمته وعظمته وعزّته. فهو سبحانه يُقسِم بها لأنّ إقسامه بها تعظيمٌ له سبحانه. ونحن المخلوقون ليس لنا أن نُقسِم بها بالنصّ والإجماع» ـ ليس لنا أن نُقسِم بها بالنصّ والإجماع ـ «بل ذكر غيرُ واحدٍ الإجماعَ على أنه لا يُقسَم بشيءٍ من المخلوقات، وذكروا إجماعَ الصحابة على ذلك، بل ذلك شركٌ منهيٌّ عنه». انتهى كلامه."]], "tr": [[1922.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1925.6, "\"Allah mahlûkatından yemin ettiği şeylerle yemin eder;"], [1929.4, "çünkü onlar O'nun ayetleri ve mahlûklarıdır."], [1933.7, "Onlar O'nun rubûbiyyetine, ulûhiyyetine, birliğine, ilmine, kudretine, meşîetine, rahmetine, hikmetine, azametine ve izzetine delildir."], [1942.0, "O —Sübhânehû— onlarla yemin eder;"], [1944.4, "çünkü onlarla yemin etmesi, kendisini —Sübhânehû— tazimdir."], [1948.0, "Biz mahlûklar ise nas ve icmâ ile onlarla yemin etme hakkına sahip değiliz.\" —Nas ve icmâ ile onlarla yemin etme hakkına sahip değiliz— \"Hatta birçok kişi mahlûkattan hiçbir şeyle yemin edilmeyeceği hususunda icmâ olduğunu zikretmiş, bu konuda sahabenin icmâını zikretmişlerdir."], [1968.0, "Bilakis bu, yasaklanmış bir şirktir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1973.0, "وقال الإمامُ ابنُ أبي العزّ الحنفيّ رحمه الله تعالى في «شرح الطحاويّة»:"], [1978.0, "«إن كان مرادُه الإقسامَ على الله فذلك محذورٌ أيضًا؛ لأنّ الإقسام بالمخلوق على المخلوق لا يجوز، فكيف على الخالق؟ وقد قال صلى الله عليه وسلم: من حلف بغير الله فقد أشرك». والله أعلم."]], "tr": [[1973.0, "İmam İbn Ebi'l-İzz el-Hanefî —Allah Teâlâ ona rahmet etsin— \"Şerhu't-Tahâviyye\"de şöyle demiştir:"], [1974.7, "\"Eğer maksadı Allah'a yemin vermekse, bu da sakıncalıdır."], [1976.3, "Çünkü bir mahlûka bir mahlûk ile yemin vermek caiz değildir;"], [1978.0, "ya Yaratıcı'ya nasıl caiz olur?"], [1981.9, "Sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1988.3, "'Allah'tan başkasıyla yemin eden şirk koşmuştur.'\" Allah en iyisini bilir."]]}]}, {"ts": "33:16", "title": "14. Külliye: Şer'î bir sünnete aykırılık içeren her dua i'tidâdır (haddi aşmadır)", "paras": [{"reader": false, "ar": [[1996.0, "ومن الكلّيّات أيضًا: <b>كلُّ دعاءٍ يتضمّن مخالفةَ سنّةٍ شرعيّةٍ فاعتداء.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1996.0, "Külliyelerden biri de şudur: 14."], [1998.1, "külliye: Şer'î bir sünnete aykırılık içeren her dua i'tidâdır (haddi aşmadır). (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2014.0, "أقول وبالله التوفيق: وقد أجمع العلماء على حرمة الاعتداء في الدعاء إجماعًا معلومًا من الدين بالضرورة،"], [2025.0, "وقد كثرت نصوص أهل العلم رحمهم الله تعالى في بيان تحريم ذلك،"], [2031.0, "إلا أنهم يختلفون فيما هو اعتداءٌ وما ليس باعتداء."], [2037.0, "فخلافُ العلماء في هذه المسألة إنما هو خلافٌ في الجزئيّات والتفاصيل،"], [2043.0, "وما يدخل أو لا يدخل؛"], [2045.0, "وأمّا أصلُ المسألة فإنّ العلماء متّفقون على حرمة الاعتداء في الدعاء."]], "tr": [[2014.0, "Tevfik Allah'tandır, derim ki: Âlimler duada i'tidânın haram olduğuna, dinden zarûrî olarak bilinen bir icmâ ile icmâ etmişlerdir."], [2027.5, "İlim ehlinin —Allah Teâlâ onlara rahmet etsin— bunun haram olduğunu açıklayan sözleri çoktur."], [2037.0, "Ancak neyin i'tidâ olduğu ve neyin i'tidâ olmadığı hususunda ihtilaf ederler."], [2040.8, "Âlimlerin bu meseledeki ihtilafı ancak cüz'iyyât ve ayrıntılarda, (i'tidâya) neyin girip neyin girmediği hususundadır."], [2045.0, "Meselenin aslına gelince, âlimler duada i'tidânın haram olduğu konusunda ittifak hâlindedir."]]}, {"reader": false, "ar": [[2050.0, "وهذه الكلّيّة والكلّيّات التي بعدها تُبيّن لك القولَ الجامع فيما يكون اعتداءً في الدعاء."], [2062.0, "وهذه واحدةٌ من هذه الأنواع:"], [2065.3, "وهي أن يتضمّن دعاؤك مخالفةَ شيءٍ من سنن الله عز وجل الشرعيّة."], [2074.0, "فكلُّ دعاءٍ يتضمّن مخالفةَ سنّةٍ شرعيّةٍ فإنه اعتداء،"], [2079.0, "والاعتداءُ في الدعاء محرّم،"], [2082.0, "كما قال الله عز وجل:"], [2084.2, "<span class=\"ayah\">﴿ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً ۚ إِنَّهُ لَا يُحِبُّ الْمُعْتَدِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ٥٥]<\/span>."]], "tr": [[2050.0, "Bu külliye ve ondan sonraki külliyeler, duada neyin i'tidâ olduğu hakkında sana kapsamlı sözü açıklar."], [2062.0, "Bu, o türlerden biridir: Duanın, Allah Azze ve Celle'nin şer'î sünnetlerinden birine aykırılık içermesi."], [2068.6, "Şer'î bir sünnete aykırılık içeren her dua i'tidâdır;"], [2074.0, "duada i'tidâ ise haramdır. Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2081.2, "<span class=\"ayah\">﴿Rabbinize yalvararak ve gizlice dua edin. Şüphesiz O, haddi aşanları sevmez﴾<\/span> [A'râf 55]."]]}, {"reader": false, "ar": [[2092.0, "قال شيخ الإسلام ابنُ تيميّة رحمه الله:"], [2095.0, "«وقوله تعالى: <span class=\"ayah\">﴿إِنَّهُ لَا يُحِبُّ الْمُعْتَدِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ٥٥]<\/span>، قيل: المراد أنه لا يحبّ المعتدين في الدعاء، كالذي يسأل ما لا يليق به من منازل الأنبياء وغير ذلك». انتهى كلامه."]], "tr": [[2092.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2095.0, "\"Allah Teâlâ'nın <span class=\"ayah\">﴿Şüphesiz O, haddi aşanları sevmez﴾<\/span> [A'râf 55] sözü hakkında şöyle denmiştir:"], [2100.0, "Kastedilen, O'nun duada haddi aşanları sevmediğidir;"], [2102.9, "kendisine yakışmayan nebîlerin mertebelerini ve benzeri şeyleri isteyen kimse gibi.\" Sözü burada bitti."]]}]}, {"ts": "35:08", "title": "14. Külliye (devam): Duada i'tidânın haram oluşuna deliller ve âlimlerin açıklamaları", "paras": [{"reader": false, "ar": [[2108.0, "ومن الأدلّة على تحريمها أيضًا ما أخرجه الإمامُ النسائيّ وابنُ ماجه في سننهما بإسنادٍ صحيح من حديث عبد الله بن المغفَّل رضي الله عنه:"], [2122.0, "أنه سمع ابنًا له يقول:"], [2124.0, "«اللهمّ إني أسألك القصرَ الأبيضَ عن يمين الداخل إلى الجنّة»،"], [2129.0, "فقال: «أيْ بُنيّ، سلِ اللهَ الجنّة، وتعوّذ به من النار؛ فإني سمعتُ النبيّ صلى الله عليه وسلم يقول: سيكون في أمّتي أقوامٌ يعتدون في الطَّهور والدعاء»."]], "tr": [[2108.0, "Bunun haram olduğuna dair delillerden biri de İmam Nesâî ve İbn Mâce'nin Sünen'lerinde sahih bir isnadla Abdullah b."], [2118.7, "Muğaffel —Allah ondan razı olsun— hadisinden rivayet ettikleridir:"], [2122.0, "Oğullarından birinin \"Allah'ım! Senden cennete girenin sağ tarafındaki beyaz köşkü istiyorum\" dediğini işitti."], [2127.0, "Bunun üzerine şöyle dedi: \"Yavrum!"], [2129.4, "Allah'tan cenneti iste ve ateşten O'na sığın."], [2132.2, "Çünkü ben Peygamber sallallâhu aleyhi ve sellem'i şöyle derken işittim:"], [2138.0, "'Ümmetimde temizlikte ve duada haddi aşan kavimler olacaktır.'\""]]}, {"reader": false, "ar": [[2144.0, "قال ابنُ تيميّة رحمه الله:"], [2147.0, "«وعلى هذا فالاعتداء في الدعاء تارةً بأن يسأل ما لا يجوز له سؤاله من المعونة على المحرّمات، وتارةً يسأل ما لا يفعله الله، مثل أن يسأل تخليدَه إلى يوم القيامة، أو يسأله أن يرفع عنه لوازمَ البشريّة من الحاجة إلى الطعام والشراب، أو يسأله بأن يُطلعه على الغيب، أو يجعله من المعصومين، أو يهب له ولدًا من غير زوجة، ونحو ذلك ممّا سؤالُه اعتداءٌ لا يحبّه الله ولا يحبّ سائله»."], [2183.0, "انتهى كلامه. وكلُّ هذا سيأتينا في أمثلته وأدلّته إن شاء الله."]], "tr": [[2144.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2147.0, "\"Buna göre duada i'tidâ bazen, istemesi caiz olmayan bir şeyi, haramlara yardım gibi bir şeyi istemekle olur."], [2154.5, "Bazen de Allah'ın yapmayacağı bir şeyi ister;"], [2158.3, "kıyamet gününe kadar ebedî kılınmasını istemesi, ondan yeme ve içmeye ihtiyaç gibi beşeriyetin lâzımlarını kaldırmasını istemesi, kendisini gayba muttali kılmasını istemesi, kendisini masumlardan kılmasını ya da kendisine bir eş olmaksızın çocuk bağışlamasını istemesi ve benzeri, istenmesi Allah'ın sevmediği ve isteyenini de sevmediği bir i'tidâ olan şeyler gibi.\" Sözü burada bitti."], [2183.0, "Bütün bunlar inşallah misalleri ve delilleriyle karşımıza gelecek."]]}, {"reader": false, "ar": [[2188.0, "ومن الأدلّة أيضًا ما جاء في سنن أبي داود بإسنادٍ لا بأس به عن ابنٍ لسعدٍ ـ أي سعد بن أبي وقّاص ـ أنه سمع ابنَه يقول:"], [2203.2, "«اللهمّ إني أسألك الجنّةَ ونعيمَها وبهجتَها وكذا وكذا، وأعوذ بك من النار وسلاسلها وأغلالها وكذا وكذا»."], [2213.0, "فقال: «يا بنيّ، إني سمعتُ رسول الله صلى الله عليه وسلم يقول: سيكون قومٌ يعتدون في الدعاء، فإيّاك أن تكون منهم؛ إنك إن أُعطيتَ الجنّةَ أُعطيتَها وما فيها من الخير، وإن أُعِذتَ من النار أُعِذتَ منها وما فيها من الشرّ»."]], "tr": [[2188.0, "Delillerden biri de Ebû Dâvûd'un Sünen'inde sakıncası olmayan bir isnadla Sa'd'ın —yani Sa'd b."], [2194.7, "Ebî Vakkâs'ın— bir oğlundan gelen rivayettir:"], [2197.8, "(Sa'd) oğlunun \"Allah'ım! Senden cenneti, nimetlerini, güzelliğini ve şunu şunu istiyorum;"], [2203.2, "ateşten, zincirlerinden, boyunduruklarından ve şundan şundan sana sığınıyorum\" dediğini işitti."], [2206.9, "Bunun üzerine şöyle dedi: \"Yavrum!"], [2209.3, "Ben Resûlullah sallallâhu aleyhi ve sellem'i şöyle derken işittim:"], [2213.0, "'Duada haddi aşan bir kavim olacaktır.' Sakın onlardan olma!"], [2221.0, "Eğer sana cennet verilirse, o da içindeki hayırla birlikte verilir;"], [2230.0, "eğer ateşten korunursan, ondan da içindeki şerden de korunursun.\""]]}, {"reader": false, "ar": [[2241.0, "قال الإمامُ ابنُ القيّم رحمه الله تعالى:"], [2244.0, "«الاعتداء في الدعاء هو كلُّ سؤالٍ يناقض حكمةَ الله، ويتضمّن مناقضةَ شرعه وأمره، أو يتضمّن خلافَ ما أخبر به، فهو اعتداءٌ لا يحبّه الله ولا يحبّ سائله»."], [2262.0, "وفُسِّر الاعتداءُ برفع الصوت أيضًا في الدعاء؛"], [2267.0, "قال ابنُ جرير: «من الاعتداء رفعُ الصوت في الدعاء، والنداءُ في الدعاء، والصياح». انتهى كلامه."]], "tr": [[2241.0, "İmam İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2244.0, "\"Duada i'tidâ, Allah'ın hikmetine ters düşen, O'nun şeriatine ve emrine ters düşmeyi içeren veya O'nun haber verdiğine aykırılık içeren her istektir."], [2257.5, "Bu, Allah'ın sevmediği ve isteyenini de sevmediği bir i'tidâdır.\" İ'tidâ ayrıca duada sesi yükseltmekle de tefsir edilmiştir."], [2267.0, "İbn Cerîr şöyle demiştir: \"Duada sesi yükseltmek, duada nida etmek (bağırarak seslenmek) ve çığlık atmak i'tidâdandır.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2276.0, "وقال ابنُ الجوزيّ رحمه الله تعالى في «زاد المسير» مُبيّنًا أقوالَ العلماء فيما يدخل في الاعتداء،"], [2283.0, "قال: «إنّ الاعتداء في الدعاء فيه ثلاثة أقوال: الأوّل: أن يدعو على المؤمنين بالشرّ، كالخزي واللعنة. الثاني: أن يسأل ما لا يستحقّه من منازل الأنبياء. الثالث: أنه الجهر في الدعاء»."], [2300.5, "وعرّفه الكلبيّ وابنُ جُريج بأنه رفعُ الصوت بالدعاء والصياح."], [2307.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[2276.0, "İbnü'l-Cevzî —Allah Teâlâ ona rahmet etsin— \"Zâdü'l-Mesîr\"de âlimlerin i'tidâya nelerin girdiğine dair görüşlerini açıklarken şöyle demiştir:"], [2280.7, "\"Duada i'tidâ hakkında üç görüş vardır:"], [2283.5, "Birincisi: Müminlere rezillik ve lanet gibi kötülükle beddua etmesidir."], [2287.0, "İkincisi: Hak etmediği nebîlerin mertebelerini istemesidir."], [2289.5, "Üçüncüsü: Duada sesi yükseltmektir.\" Kelbî ve İbn Cüreyc de onu, duada sesi yükseltmek ve çığlık atmak olarak tarif etmişlerdir."], [2300.5, "Sözü —Allah Teâlâ ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[2310.3, "وهنا تنبيهٌ مهمّ: وهي أنّ الاعتداء في الدعاء تتفاوت مراتبُه بتفاوت قبحه ـ يرحمك الله <span class=\"q\">؟ 38:40<\/span> ـ فهو ليس على مرتبةٍ واحدة."], [2325.5, "فمن الاعتداء في الدعاء ما يدخل في باب الشرك ـ كما سيأتي ـ بل الشرك الأكبر،"], [2334.8, "ومنه ما هو محرّم،"], [2337.0, "ومنه ما هو مكروه."], [2339.0, "والاعتداء في الدعاء قد يكون في الألفاظ أحيانًا،"], [2343.4, "وقد يكون في المعاني أحيانًا،"], [2346.9, "وقد يكون في الهيئة والأداء أحيانًا."], [2352.0, "بل قد يكون الاعتداء في الزمان،"], [2355.0, "وقد يكون الاعتداء في المكان:"], [2358.0, "أن تدعو في المكان الذي لا ينبغي الدعاء فيه،"], [2362.0, "أو تدعو في الزمان الذي لا ينبغي الدعاء فيه."]], "tr": [[2310.3, "Burada önemli bir uyarı var:"], [2312.4, "Duada i'tidânın mertebeleri, çirkinliğinin farklılığına göre farklılaşır —Allah sana rahmet etsin <span class=\"q\">؟<\/span>— yani tek bir mertebede değildir."], [2329.2, "Duada i'tidânın bir kısmı —ileride geleceği üzere— şirk babına, hatta büyük şirke girer;"], [2339.0, "bir kısmı haramdır, bir kısmı mekruhtur."], [2342.1, "Duada i'tidâ bazen lafızlarda, bazen manalarda, bazen de şekil ve edâda olur."], [2352.0, "Hatta i'tidâ zamanda olabilir, mekânda da olabilir:"], [2358.0, "Dua edilmesi uygun olmayan bir mekânda dua etmen veya dua edilmesi uygun olmayan bir zamanda dua etmen."]]}, {"reader": false, "ar": [[2366.0, "وهنا شبهةٌ يحسُن بنا أن نقف عندها:"], [2372.0, "وهي أنّ من الناس من يقول:"], [2376.0, "ليس هناك اعتداءٌ في الدعاء."], [2379.0, "وهم طائفةٌ لا يخرقون الإجماعَ علينا أبدًا <span class=\"q\">؟ 39:39<\/span>؛"], [2385.0, "لأنها شبهةٌ تفوّه بها بعضُ أهل البدع،"], [2388.0, "فقالوا: ليس هناك ما يُسمّى بالاعتداء في الدعاء."], [2393.0, "قلنا لهم: ولماذا؟ قالوا:"], [2396.5, "لأنّ الاعتداء في الدعاء إذا توجّه سؤالُك إلى من لا يقدر على تحقيق مطلوبك،"]], "tr": [[2366.0, "Burada üzerinde durmamızın güzel olacağı bir şüphe var:"], [2372.0, "İnsanlardan bazıları \"Duada i'tidâ diye bir şey yoktur\" der."], [2379.0, "Bunlar, bize karşı icmâı asla delemeyecek bir fırkadır <span class=\"q\">؟<\/span>;"], [2385.0, "çünkü bu, bazı bid'at ehlinin ağzından çıkmış bir şüphedir."], [2388.6, "Dediler ki: \"Duada i'tidâ denen bir şey yoktur.\" Onlara \"Neden?\" dedik."], [2396.0, "Dediler ki: \"Çünkü duada i'tidâ, isteğin talebini gerçekleştirmeye gücü yetmeyen birine yöneldiğinde olur."]]}]}, {"ts": "40:03", "title": "14. Külliye (devam): \"Duada i'tidâ yoktur\" şüphesine cevap — Kevnî ve şer'î sünnetler", "paras": [{"reader": false, "ar": [[2403.0, "وبما أنك تدعو الله عز وجل،"], [2406.8, "والله على كلّ شيءٍ قدير،"], [2410.0, "ولا يُعجزه شيءٌ في السماوات ولا في الأرض،"], [2414.0, "فليس هناك ما يُعجزه حتى يكون دعاؤك به اعتداءً»."], [2422.0, "فهمتم شبهتَهم؟ ودندنوا حول ذلك كثيرًا."]], "tr": [[2403.0, "Madem ki Allah Azze ve Celle'ye dua ediyorsun ve Allah her şeye kadirdir, göklerde ve yerde hiçbir şey O'nu âciz bırakmaz;"], [2412.0, "o hâlde O'nu âciz bırakacak bir şey yoktur ki onu istemen i'tidâ olsun.\" Şüphelerini anladınız mı?"], [2422.0, "Bunun etrafında çokça dolanıp durdular."]]}, {"reader": false, "ar": [[2435.0, "والجواب عن ذلك ـ أيّها الأحبّة ـ:"], [2437.0, "أنّ الله عز وجل قادرٌ على كلّ شيء،"], [2441.7, "ولا شكّ في ذلك،"], [2444.0, "وأنه لا يُعجزه شيءٌ في الأرض ولا في السماء،"], [2448.2, "ولا شكّ في ذلك،"], [2450.0, "وأنه إذا أراد الشيءَ قال له:"], [2453.5, "كن فيكون، ولا شكّ في ذلك."], [2457.0, "ولكنه مع إخبارنا بكلّ ذلك أعطانا سُنَنًا ـ أعطانا سُنَنًا ـ منها ما هو سنّةٌ كونيّة،"], [2469.0, "ومنها ما هو سنّةٌ شرعيّة."]], "tr": [[2435.0, "Buna cevap şudur, ey dostlar:"], [2437.0, "Allah Azze ve Celle her şeye kadirdir, bunda şüphe yoktur;"], [2442.2, "yerde ve gökte hiçbir şey O'nu âciz bırakmaz, bunda şüphe yoktur;"], [2447.2, "bir şeyi dilediğinde ona \"Ol\" der, o da oluverir, bunda şüphe yoktur."], [2453.5, "Fakat bütün bunları bize haber vermekle birlikte bize sünnetler (değişmez kanunlar) vermiştir —bize sünnetler vermiştir—;"], [2466.0, "bunların bir kısmı kevnî sünnet, bir kısmı şer'î sünnettir."]]}, {"reader": false, "ar": [[2473.0, "وأخبرنا بأنّ سنّته الكونيّة لا تبديلَ لكلماته فيها،"], [2478.0, "كما قال الله عز وجل:"], [2481.0, "<span class=\"ayah\">﴿وَلَن تَجِدَ لِسُنَّةِ اللَّهِ تَبْدِيلًا﴾<\/span> <span class=\"ref\">[الأحزاب: ٦٢]<\/span> <span class=\"ayah\">﴿وَلَن تَجِدَ لِسُنَّتِ اللَّهِ تَحْوِيلًا﴾<\/span> <span class=\"ref\">[فاطر: ٤٣]<\/span>."], [2488.0, "فلا يجوز لنا أن نتجاوز ما حدّه لنا في هذه السنن،"], [2494.0, "مع كمال إيماننا بأنه لو شاء أن يخترق شيئًا من سنّته فله ذلك."], [2503.0, "لكن بالنسبة لنا لا يجوز لنا أن نتجاوز ما حدّه في سننه الكونيّة أو الشرعيّة."]], "tr": [[2473.0, "Kevnî sünnetinde kelimeleri için hiçbir değişiklik olmadığını bize haber vermiştir;"], [2477.4, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [2481.0, "<span class=\"ayah\">﴿Allah'ın sünnetinde hiçbir değişiklik bulamazsın﴾<\/span> [Ahzâb 62] <span class=\"ayah\">﴿Allah'ın sünnetinde hiçbir sapma da bulamazsın﴾<\/span> [Fâtır 43]."], [2489.6, "Dolayısıyla, dilerse sünnetinden bir şeyi delmenin O'na ait olduğuna tam olarak iman etmekle birlikte, bu sünnetlerde bizim için çizdiği sınırı aşmamız caiz değildir."], [2503.0, "Fakat bize gelince, O'nun kevnî veya şer'î sünnetlerinde çizdiği sınırı aşmamız caiz değildir."]]}, {"reader": false, "ar": [[2513.0, "وإلا فالله عز وجل قادرٌ القدرةَ الكاملة على إيجاد مخلوقٍ بلا أبوين كآدم،"], [2522.0, "وعلى إيجاد مخلوقٍ بأمٍّ بلا أبٍ كعيسى عليه الصلاة والسلام،"], [2530.0, "أو بأبٍ بلا أمٍّ كحوّاء،"], [2533.0, "فإنها موجودةٌ من أحد الطرفين دون الآخر."], [2538.0, "والله عز وجل قادرٌ على كلّ ذلك،"], [2542.0, "ولكن لا يجوز لنا ـ مع كمال إيماننا بذلك ـ أن نخترق شيئًا من سنّته الكونيّة بحجّة أنه على كلّ شيءٍ قدير،"], [2553.0, "أو أن نتجاوز شيئًا من سننه الشرعيّة بحجّة أنه على كلّ شيءٍ قدير."], [2558.0, "والأدلّة متآلفةٌ متّفقة، وليست بمختلفةٍ ولا بمضطربةٍ ولا بمفترقة. فهمتم هذا؟"]], "tr": [[2513.0, "Yoksa Allah Azze ve Celle, Âdem gibi anne-babasız bir mahlûk yaratmaya, Îsâ aleyhissalâtü vesselâm gibi babasız, anneden bir mahlûk yaratmaya veya Havvâ gibi annesiz, babadan (bir mahlûk yaratmaya) tam bir kudretle kadirdir;"], [2533.0, "çünkü o, iki taraftan yalnız birinden var edilmiştir."], [2538.0, "Allah Azze ve Celle bunların hepsine kadirdir."], [2541.4, "Fakat buna tam olarak iman etmekle birlikte, \"O her şeye kadirdir\" bahanesiyle O'nun kevnî sünnetinden bir şeyi delmemiz veya \"O her şeye kadirdir\" bahanesiyle şer'î sünnetlerinden bir şeyi aşmamız caiz değildir."], [2555.7, "Deliller birbiriyle uyumlu ve ittifak hâlindedir;"], [2558.0, "birbirinden farklı, karışık ve ayrı değildir. Bunu anladınız mı?"]]}, {"reader": false, "ar": [[2568.0, "فإن قلتَ: اضرب لنا أمثلةً على دعاءٍ يتضمّن مخالفةَ شيءٍ من سنن الله الشرعيّة،"], [2574.0, "فأقول: الأمثلة كثيرة، وقد مرّ طرفٌ منها في كلام أهل العلم."], [2579.0, "فمن ذلك: أن يدعو اللهَ عز وجل أن يراه في الدنيا؛"], [2585.0, "فإنّ ذلك مخالفٌ لسنّة الله الكونيّة والشرعيّة؛"], [2589.0, "فإنّ الله عز وجل ـ فإنّ النبيّ صلى الله عليه وسلم قال:"], [2594.0, "«وتعلّموا أنّ أحدَكم لن يرى ربَّه حتى يموت»."], [2599.0, "ولذلك لمّا سأل موسى عليه الصلاة والسلام ربَّه أن يراه في هذه الدنيا حصل له ما حصل،"], [2606.9, "من باب التنبيه على أنه من الأسئلة التي لا ينبغي سؤالُها."]], "tr": [[2568.0, "Eğer \"Allah'ın şer'î sünnetlerinden birine aykırılık içeren duaya bize misaller ver\" dersen, derim ki:"], [2574.5, "Misaller çoktur; bir kısmı ilim ehlinin sözlerinde geçti."], [2579.0, "Bunlardan biri: Allah Azze ve Celle'ye kendisini dünyada görmek için dua etmesidir."], [2585.0, "Çünkü bu, Allah'ın kevnî ve şer'î sünnetine aykırıdır."], [2589.0, "Zira Allah Azze ve Celle —(yani) Peygamber sallallâhu aleyhi ve sellem— şöyle buyurmuştur:"], [2594.0, "\"Bilin ki sizden biri ölünceye kadar Rabbini asla göremeyecektir.\" Bu yüzden Mûsâ aleyhissalâtü vesselâm bu dünyada Rabbini görmeyi istediğinde, bunun istenmesi uygun olmayan isteklerden olduğuna dikkat çekmek kabilinden başına gelen geldi."]]}, {"reader": false, "ar": [[2612.0, "ومن ذلك: أن يسأل اللهَ منازلَ الأنبياء في الآخرة،"], [2617.0, "فإنّ هذا اعتداء؛ أو يسأل أن يُجري على يديه معجزاتٍ لبعض الأنبياء،"], [2625.0, "فإنّ ذلك من الاعتداء."], [2628.0, "بل جعل أهلُ السنّة من الاعتداء أن يدعوَ اللهَ عز وجل أن يرزقه جمالًا كجمال يوسف،"], [2636.0, "فإنّ ذلك من الاعتداء؛"], [2638.0, "فإنّ الله عز وجل قد أعطى يوسفَ شطرَ الحُسن،"], [2643.0, "فكونُك تسأل اللهَ عز وجل الشطرَ الآخر فكأنّ بقيّة الأنبياء والرسل ليس لهم شيءٌ من ذلك الجمال."]], "tr": [[2612.0, "Bunlardan biri de: Allah'tan âhirette nebîlerin mertebelerini istemesidir;"], [2618.0, "bu i'tidâdır. Ya da bazı nebîlerin mucizelerini kendi eliyle gerçekleştirmesini istemesidir;"], [2625.8, "bu da i'tidâdandır. Hatta Ehl-i Sünnet, Allah Azze ve Celle'ye kendisine Yûsuf'un güzelliği gibi bir güzellik vermesi için dua etmesini de i'tidâdan saymıştır;"], [2638.0, "bu i'tidâdandır. Çünkü Allah Azze ve Celle Yûsuf'a güzelliğin yarısını vermiştir."], [2643.0, "Senin Allah Azze ve Celle'den diğer yarısını istemen, sanki diğer nebîlerin ve resullerin o güzellikten hiçbir payı yokmuş gibidir."]]}, {"reader": false, "ar": [[2651.0, "ومن الاعتداء: أن تسأل اللهَ عز وجل أن يؤتيك من الملك ما آتاه سليمانَ عليه الصلاة والسلام."], [2659.0, "ولذلك لمّا أراد النبيّ صلى الله عليه وسلم أن يربط ذلك الشيطانَ بساريةٍ من سواري المسجد قال:"], [2667.4, "«فذكرتُ دعوةَ أخي سليمان: هب لي ملكًا لا ينبغي لأحدٍ من بعدي» ـ قال ـ «فرددتُه خاسئًا»."]], "tr": [[2651.0, "İ'tidâdan biri de: Allah Azze ve Celle'den, Süleyman aleyhissalâtü vesselâm'a verdiği mülkü sana da vermesini istemendir."], [2659.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem o şeytanı mescidin direklerinden birine bağlamak istediğinde şöyle buyurdu:"], [2665.0, "\"Kardeşim Süleyman'ın şu duasını hatırladım:"], [2667.4, "'Bana, benden sonra hiç kimseye nasip olmayacak bir mülk bağışla.'\" —Buyurdu ki— \"Onu zelil olarak geri çevirdim.\""]]}, {"reader": false, "ar": [[2674.0, "ومن ذلك: أن يدعوَ اللهَ عز وجل بأن يُيسّر له شيئًا من المعاصي،"], [2681.0, "كالدعاء بتيسير شرب الخمر،"], [2682.8, "أو ألّا يجده أحد،"], [2685.0, "والدعاء بتيسير امرأةٍ للبغاء والزنا ـ والعياذ بالله ـ."], [2689.0, "ولذلك يقول النبيّ صلى الله عليه وسلم:"], [2693.0, "«يُستجاب لأحدكم ما لم يدعُ بإثمٍ أو قطيعة رحم»."], [2698.0, "ومنها أيضًا: الدعاء للكفّار بالمغفرة،"]], "tr": [[2674.0, "Bunlardan biri de: Allah Azze ve Celle'ye kendisine günahlardan bir şeyi kolaylaştırması için dua etmesidir;"], [2679.4, "içki içmeyi kolaylaştırması veya kimsenin onu (içerken) bulmaması için dua etmek ve —Allah korusun— fuhuş ve zina için bir kadını kolaylaştırması için dua etmek gibi."], [2689.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [2693.0, "\"Günah veya akrabalık bağını koparma (kat'-ı rahim) için dua etmedikçe sizden birinin duası kabul edilir.\" Bunlardan biri de kâfirler için mağfiret duası etmektir."]]}]}, {"ts": "45:03", "title": "14. Külliye (devam): Kâfirlere mağfiret, Müslümana beddua ve bu konudaki iki şüphe", "paras": [{"reader": false, "ar": [[2703.0, "وقد قال الله عز وجل:"], [2704.0, "<span class=\"ayah\">﴿مَا كَانَ لِلنَّبِيِّ وَالَّذِينَ آمَنُوا أَن يَسْتَغْفِرُوا لِلْمُشْرِكِينَ وَلَوْ كَانُوا أُولِي قُرْبَىٰ مِن بَعْدِ مَا تَبَيَّنَ لَهُمْ أَنَّهُمْ أَصْحَابُ الْجَحِيمِ﴾<\/span> <span class=\"ref\">[التوبة: ١١٣]<\/span> <span class=\"ayah\">﴿وَمَا كَانَ اسْتِغْفَارُ إِبْرَاهِيمَ لِأَبِيهِ إِلَّا عَن مَّوْعِدَةٍ وَعَدَهَا إِيَّاهُ فَلَمَّا تَبَيَّنَ لَهُ أَنَّهُ عَدُوٌّ لِّلَّهِ تَبَرَّأَ مِنْهُ﴾<\/span> <span class=\"ref\">[التوبة: ١١٤]<\/span> الآيةَ بتمامها."], [2726.0, "أو الدعاء بنفي تخليدهم في النار الخلودَ الأبديّ،"], [2734.0, "فإنّ ذلك مخالفٌ لقول الله عز وجل: <span class=\"ayah\">﴿خَالِدِينَ فِيهَا أَبَدًا﴾<\/span> <span class=\"ref\">[الأحزاب: ٦٥]<\/span>."]], "tr": [[2703.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [2704.0, "<span class=\"ayah\">﴿Cehennemlik oldukları kendilerine açıkça belli olduktan sonra, akraba bile olsalar, müşrikler için mağfiret dilemek ne Peygamber'e ne de iman
