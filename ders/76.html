<script>
const D={"no": 76, "vid": "GDbxtF89ymA", "title_ar": "الدرس (٧٦) من شرح كليات العقيدة — كليات: ردّ المجمل بالمجمل، واحتجاج المبطل بدليل الوحي، ووصف أهل الحق بالقبيح", "title_tr": "Şerhu Külliyyâti'l-Akîde — 76. Ders: Mücmel Lafzı Mücmelle Reddetmek, Bâtıl Ehlinin Vahiy Deliliyle İhticâcı, Hak Ehlini Çirkin Lakaplarla Nitelemek", "sections": [{"ts": "00:00", "title": "1. Külliye: Mücmel lafzı mücmelle reddeden, bid'atı bid'atla reddetmiştir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.8, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.6, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.9, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [9.6, "أما بعد: فلا نزال في سياق الكلام على شيءٍ من توضيح القواعد والأصول والكلّيّات العامة عند أهل السنة والجماعة في باب الأسماء والصفات،"], [20.1, "وقد قاربنا ختمَ هذا الباب،"], [22.4, "ولله الحمد والمنّة. وأظن أننا وقفنا عند كلّيّةٍ سنبدأ في شرحها،"], [27.4, "وهي: <b>أنّ كلَّ من ردَّ لفظًا مُجمَلًا بمثله في الإجمال فقد ردَّ بدعةً ببدعة.<\/b> أقول وبالله التوفيق:"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.4, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.6, "Bundan sonra: Hâlâ isim ve sıfatlar babında Ehl-i Sünnet ve'l-Cemaat'in genel kaidelerini, usûlünü ve külliyelerini bir miktar açıklama bağlamındayız;"], [17.4, "Allah'a hamd ve minnet olsun, bu babı bitirmeye yaklaştık."], [21.0, "Sanırım şerhine başlayacağımız bir külliyede kalmıştık;"], [23.8, "o da şudur: 1. külliye:"], [27.9, "Mücmel bir lafzı icmalde onun benzeri (bir lafız) ile reddeden, bid'atı bid'atla reddetmiştir. Tevfik Allah'tandır, derim ki:"]]}, {"reader": false, "ar": [[40.0, "اعلم ـ رحمك الله تعالى ـ أنّ الألفاظ باعتبار دلالاتها على الشيء لا تخرج عن ثلاثة أقسام:"], [47.0, "إمّا أن تكون ألفاظًا لا تدلّ إلا على محض الحق،"], [52.0, "فهذه نقبلها مطلقًا. وإمّا أن تكون ألفاظًا لا تدلّ إلا على محض الباطل،"], [61.0, "فهذه نردّها مطلقًا. وإمّا أن تكون ألفاظًا تحتمل الحقَّ وتحتمل الباطل."], [70.0, "وكلّيّتنا هذه ليست في القسم الأول ولا في القسم الثاني،"], [74.7, "وإنما هي في القسم الثالث،"], [77.0, "وهي تلك الألفاظ التي إن جئتَها من هاهنا وجدتَها حقًّا،"], [82.0, "وإن جئتَها من هاهنا وجدتَها باطلًا."]], "tr": [[40.0, "Bil ki —Allah Teâlâ sana rahmet etsin— lafızlar, bir şeye delâletleri itibarıyla üç kısımdan dışarı çıkmaz:"], [47.0, "Ya yalnızca katıksız hakka delâlet eden lafızlardır;"], [50.5, "bunları mutlak olarak kabul ederiz."], [54.0, "Ya yalnızca katıksız bâtıla delâlet eden lafızlardır;"], [58.9, "bunları mutlak olarak reddederiz. Ya da hakkı da bâtılı da muhtemel olan lafızlardır."], [70.0, "Bu külliyemiz ne birinci kısımdadır ne de ikinci kısımda;"], [76.1, "o, üçüncü kısımdadır. Bunlar, şuradan geldiğinde hak, buradan geldiğinde bâtıl bulduğun lafızlardır."]]}, {"reader": false, "ar": [[86.0, "فما مذهب أهل السنة والجماعة في مثل هذه الألفاظ؟"], [89.0, "الجواب: لا جرم أننا درسناه سابقًا في قواعد مستقلة:"], [94.0, "أنّ ألفاظها نتوقّف فيها،"], [96.5, "فلا نقبلها ولا ننفيها،"], [99.0, "وأمّا معانيها فنستفصل فيها؛"], [103.0, "فإن أُريد به الحقُّ قبلناه،"], [106.5, "وإن أُريد بها الباطلُ رددناه."]], "tr": [[86.0, "Ehl-i Sünnet ve'l-Cemaat'in bu gibi lafızlardaki mezhebi nedir?"], [89.0, "Cevap: Şüphesiz bunu daha önce müstakil kaidelerde işledik:"], [94.0, "Lafızlarında tevakkuf ederiz (dururuz); onları ne kabul ederiz ne nefyederiz."], [97.8, "Manalarına gelince, onlarda istifsâl ederiz (ne kastedildiğini sorarız):"], [103.0, "Hak kastedilmişse onu kabul ederiz, bâtıl kastedilmişse onu reddederiz."]]}, {"reader": false, "ar": [[111.0, "وهذه الألفاظ المجملة فيها خصلتان:"], [117.0, "الخصلة الأولى: أنها ليست من ألفاظ الوحي،"], [121.0, "ولا من الألفاظ التي جرت على لسان الصحابة والسلف الصالح،"], [126.0, "وإنما أوّلُ من أطلقها إنما هم أهل البدع."], [132.0, "فإن قيل لك: ما مصدر هذه الألفاظ المجملة المحتملة للحق والباطل؟"], [137.0, "فقل: مصدرها أهل البدع؛"], [139.0, "فلا نجد لها ذكرًا في كتاب الله عز وجل،"], [144.0, "ولا في سنة نبيه صلى الله عليه وسلم،"], [147.0, "ولا في كلام أحدٍ من أصحاب رسول الله صلى الله عليه وسلم،"], [151.0, "ولا في كلام أحدٍ من سلف الأمة وأئمتها،"], [154.0, "وإنما نجدها عند الجهمية،"], [156.7, "أو عند الخوارج، أو عند الرافضة،"], [160.8, "أو عند الفلاسفة، ومن شرب من حوضهم الكَدِر <span class=\"q\">؟ 02:43<\/span>."]], "tr": [[111.0, "Bu mücmel lafızlarda iki özellik vardır:"], [117.0, "Birinci özellik: Bunlar ne vahyin lafızlarındandır ne de sahabe ve selef-i sâlihînin dilinde dolaşan lafızlardandır;"], [126.0, "onları ilk kullananlar ancak bid'at ehlidir."], [132.0, "Sana \"Hakkı ve bâtılı muhtemel olan bu mücmel lafızların kaynağı nedir?\" denirse, \"Kaynakları bid'at ehlidir\" de."], [139.0, "Bunların ne Allah Azze ve Celle'nin Kitabı'nda, ne Peygamberi sallallâhu aleyhi ve sellem'in Sünneti'nde, ne Resûlullah sallallâhu aleyhi ve sellem'in ashâbından birinin sözünde, ne de ümmetin selefinden ve imamlarından birinin sözünde bir anılışını buluruz."], [155.4, "Onları ancak Cehmiyye'de, Hâricîlerde, Râfıza'da, filozoflarda ve onların bulanık havuzundan içenlerde <span class=\"q\">؟<\/span> buluruz."]]}, {"reader": false, "ar": [[167.0, "الثانية ـ الميزة أو الخصلة الثانية في هذه الألفاظ المجملة ـ:"], [173.2, "أنها بوّابةُ إبليس في ردّ الحق،"], [176.0, "أنها بوّابة إبليس في ردّ الحق."], [181.0, "فكثيرٌ من الطوائف ما حرّفت صفاتِ الله عز وجل إلا بسبب هذه الألفاظ المجملة،"], [191.0, "ولا أنكرت أسماءه وعطّلته عن كمالاته إلا بسبب هذه الألفاظ المجملة،"], [197.0, "ولا أُنكر الوحي، ولا حُرِّفت الآياتُ والنصوصُ الشرعية،"], [203.0, "ولا سِيمَت <span class=\"q\">؟ 03:23<\/span> تعطيلًا وتمثيلًا وإلحادًا إلا بسبب هذه الألفاظ المجملة."], [214.0, "فحقيقةُ هذه الألفاظ المجملة أنها طاغوتٌ رُدَّ به كثيرٌ من الحق."]], "tr": [[167.0, "İkinci (özellik) —bu mücmel lafızlardaki ikinci ayırıcı vasıf veya özellik—:"], [173.2, "Bunlar, hakkı reddetmede İblis'in kapısıdır;"], [181.0, "hakkı reddetmede İblis'in kapısıdır. Fırkaların çoğu Allah Azze ve Celle'nin sıfatlarını ancak bu mücmel lafızlar sebebiyle tahrif etmiştir;"], [190.6, "O'nun isimlerini ancak bu mücmel lafızlar sebebiyle inkâr etmiş ve O'nu kemâlâtından ta'til etmiştir."], [196.6, "Vahiy de ancak bu mücmel lafızlar sebebiyle inkâr edilmiş, ayetler ve şer'î nasslar ancak bunlar sebebiyle tahrif edilmiş, ta'tile, temsile ve ilhâda maruz bırakılmıştır <span class=\"q\">؟<\/span>."], [214.0, "Bu mücmel lafızların hakikati şudur:"], [216.7, "Onlar, hakkın büyük kısmının kendisiyle reddedildiği bir tâğuttur."]]}, {"reader": false, "ar": [[221.0, "ولذلك لا بدّ أن نعرف ما منهجُ أهل السنة والجماعة في مثل هذه الألفاظ المجملة إذا سمعناها؛"], [230.0, "وذلك لأنّ من أعظم الخطأ في الردّ على هذه الألفاظ المجملة أنك تردّها بما يناقضها من الإجمال."], [241.0, "فإذا قال لك أحد:"], [245.0, "«إنّ ألفاظنا بالقرآن مخلوقة»،"], [250.0, "فاحذر من أن تردّ إجمالَه بإجمالٍ آخر فتقول:"], [256.0, "«بل ألفاظنا بالقرآن غير مخلوقة»؛"], [259.0, "وذلك لأنّ قوله: «ألفاظنا بالقرآن مخلوقة» يحتمل الحقَّ ويحتمل الباطل،"], [266.0, "فكان الجوابُ الصحيح على لفظه المجمل هو التفصيل."], [271.0, "وأمّا ردُّ الإجمال بالإجمال فهذا طريق أهل البدع،"], [276.0, "فهذا طريق أهل البدع."]], "tr": [[221.0, "Bu yüzden, bu gibi mücmel lafızları işittiğimizde Ehl-i Sünnet ve'l-Cemaat'in bunlardaki metodunun ne olduğunu bilmemiz gerekir."], [230.0, "Çünkü bu mücmel lafızlara reddiye yazarken yapılan en büyük hatalardan biri, onları kendilerine zıt olan bir icmal ile reddetmendir."], [245.0, "Biri sana \"Kur'an'ı telaffuzumuz mahlûktur\" derse, onun icmalini başka bir icmalle reddedip \"Bilakis Kur'an'ı telaffuzumuz mahlûk değildir\" demekten sakın."], [259.0, "Çünkü onun \"Kur'an'ı telaffuzumuz mahlûktur\" sözü hakkı da bâtılı da muhtemeldir;"], [266.5, "dolayısıyla onun mücmel lafzına doğru cevap tafsildir."], [271.0, "İcmali icmalle reddetmek ise bid'at ehlinin yoludur, bid'at ehlinin yoludur."]]}, {"reader": false, "ar": [[280.0, "وكذلك إذا سمعتَ أحدًا من أهل البدع يقول:"], [283.0, "هل ظاهرُ النصوص مرادٌ أو غيرُ مراد؟"], [288.0, "فإيّاك أن تقول: مراد،"], [292.0, "وإيّاك أن تقول: غير مراد،"], [294.0, "فتكون قد رددتَ الإجمالَ بالإجمال،"], [297.0, "والبدعةَ ببدعة. وإنما الواجب عليك الاستفصالُ في هذا،"], [302.0, "وهي أنّ الظاهر له معنيان:"], [306.0, "هل تقصد بالظاهر ما يفهمه الصحابة والسلف الصالح والأئمة؟"], [310.0, "فهذا لا شكّ أنه مرادٌ لله عز وجل."], [313.0, "أم أنك لا تفهم من لفظ الظاهر من النصوص إلا ما يفهمه الجهمُ بن صفوان،"], [320.5, "وبشرٌ المَرِيسيّ، وواصلُ بن عطاء،"], [323.0, "وغيرُهم من أهل البدع؟"], [325.0, "فإن كنت تريد بالظاهر هذا،"], [327.3, "فإنّ هذا معنًى باطلٌ لا نقبله."]], "tr": [[280.0, "Aynı şekilde bid'at ehlinden birinin \"Nassların zahiri murad mıdır, murad değil midir?\" dediğini işitirsen, sakın \"murad\" deme ve sakın \"murad değil\" deme;"], [290.6, "yoksa icmali icmalle, bid'atı bid'atla reddetmiş olursun."], [294.6, "Sana vacip olan, burada istifsâldir;"], [298.0, "şöyle ki zahirin iki manası vardır:"], [306.0, "Zahirden, sahabenin, selef-i sâlihînin ve imamların anladığını mı kastediyorsun?"], [310.0, "Bunun Allah Azze ve Celle tarafından murad olduğunda şüphe yoktur."], [313.0, "Yoksa nassların zahiri lafzından ancak Cehm b."], [317.0, "Safvân'ın, Bişr el-Merîsî'nin, Vâsıl b."], [320.0, "Atâ'nın ve diğer bid'at ehlinin anladığını mı anlıyorsun?"], [325.0, "Zahirden bunu kastediyorsan, bu bâtıl bir manadır; onu kabul etmeyiz."]]}]}, {"ts": "05:30", "title": "1. Külliye (devam): \"Terkip\", \"hulûl-i havâdis\" ve \"sıfatlar Allah'ın gayrıdır\" örnekleri", "paras": [{"reader": false, "ar": [[330.0, "فلا ينبغي أن نُطلق القول بأنّ ظاهر النصوص مرادٌ،"], [334.9, "ولا أنّ ظاهرها غيرُ مراد؛"], [337.7, "لأنّ هذا من ردّ الإجمال بالإجمال."], [341.0, "وكذلك أيضًا لفظ «التركيب»:"], [345.0, "فإذا قيل لك: بأنه لا يجوز التركيب على الله،"], [349.0, "فإيّاك أن تقول: بل يجوز التركيب على الله؛"], [352.0, "لأنّ الأول مجملٌ والثاني مجمل،"], [355.6, "والمجملُ لا يُردّ بمجمل."], [359.0, "بل الصوابُ عليك أن تفصّل في مسألة التركيب:"], [363.0, "إن كنت تقصد بالتركيب ما هو مفتقرٌ بعضُه إلى بعض،"], [367.0, "وكان متفرّقًا فاجتمع، فهذا معنًى باطلٌ لا يجوز على الله عز وجل."], [373.0, "وإن كنت تقصد بالتركيب ما هو ذاتٌ متّصفةٌ بصفات الكمال،"], [379.0, "ومنعوتةٌ بنعوت الجمال والجلال والكبرياء والعظمة،"], [383.0, "فهذا معنًى حقّ، ولكن لا أسمّيه بهذا الاسم البدعي،"], [386.0, "وإنما أسمّيه بالذات والصفات؛"], [389.0, "فأقول: الله له ذاتٌ وصفات،"], [392.9, "ولا أقول: مركّبٌ من ذاتٍ وصفات،"], [396.0, "فأكون قد رددتُ البدعةَ ببدعة."]], "tr": [[330.0, "Dolayısıyla nassların zahirinin murad olduğunu da, zahirinin murad olmadığını da mutlak olarak söylememiz uygun değildir;"], [337.7, "çünkü bu, icmali icmalle reddetmektir."], [341.0, "Aynı şekilde \"terkip\" lafzı da böyledir:"], [346.3, "Sana \"Allah hakkında terkip caiz değildir\" denirse, sakın \"Bilakis Allah hakkında terkip caizdir\" deme;"], [352.0, "çünkü birincisi mücmeldir, ikincisi de mücmeldir ve mücmel, mücmelle reddedilmez."], [359.0, "Bilakis sana doğru olan, terkip meselesinde tafsil yapmandır:"], [363.0, "Terkipten, bir kısmı diğer kısmına muhtaç olan, dağınıkken bir araya gelmiş şeyi kastediyorsan, bu bâtıl bir manadır;"], [370.7, "Allah Azze ve Celle hakkında caiz değildir."], [373.0, "Terkipten, kemal sıfatlarıyla muttasıf, cemal, celal, kibriyâ ve azamet vasıflarıyla nitelenmiş bir zâtı kastediyorsan, bu hak bir manadır;"], [383.3, "ama ona bu bid'at ismini vermem, onu zât ve sıfatlar diye adlandırırım."], [389.0, "\"Allah'ın zâtı ve sıfatları vardır\" derim;"], [394.0, "\"zât ve sıfatlardan mürekkeptir\" demem;"], [396.0, "yoksa bid'atı bid'atla reddetmiş olurum."]]}, {"reader": false, "ar": [[399.0, "وكذلك إذا قال لك الجهميّ:"], [402.5, "بأنّ الله لا تحُلُّه الحوادث،"], [406.0, "فإيّاك أن تقول: بل تحُلُّه الحوادث،"], [409.0, "حتى وإن كان لا يقصد بالحوادث إلا المعنى الباطل،"], [415.0, "وأنت لا تقصد بالحوادث إلا المعنى الحق؛"], [418.0, "فمجرّدُ ردّ الإجمال بالإجمال مرفوضٌ عند أهل السنة والجماعة في باب الردود،"], [423.0, "الرفضَ الكاملَ المطلق. وإنما يجب علينا أن نقول:"], [428.8, "ماذا تقصد بحلول الحوادث؟"], [431.0, "هل تقصد بذلك أنّ شيئًا من المخلوقات يحلّ في ذات الخالق عز وجل؟"], [436.0, "فإن كنت تقصد ذلك فهذا معنًى باطل،"], [438.9, "بل هو كفرٌ والعياذ بالله."], [441.0, "وإن كنت تقصد بالحوادث الصفاتِ الفعليةَ الاختيارية التي تتعلّق بمشيئته عز وجل ممّا أثبتها له الوحي،"], [452.0, "فإنّ هذا معنًى حقّ،"], [454.0, "ولكن لا أسمّيه بالحوادث،"], [456.0, "وإنما أسمّيها بالصفات الفعلية،"], [458.9, "أو الصفات الاختيارية، أو الصفات المتعلّقة بالمشيئة،"], [463.2, "على التعبير الذي ارتضاه أهل السنة والجماعة."]], "tr": [[399.0, "Aynı şekilde Cehmî sana \"Allah'a havâdis hulûl etmez (O'nda hâdis şeyler vuku bulmaz)\" derse, sakın \"Bilakis O'na havâdis hulûl eder\" deme;"], [407.5, "o, havâdisten yalnızca bâtıl manayı kastetse ve sen havâdisten yalnızca hak manayı kastetsen bile."], [415.9, "Çünkü icmali icmalle reddetmek, tek başına, Ehl-i Sünnet ve'l-Cemaat'in nezdinde reddiyeler babında tam ve mutlak bir retle reddedilmiştir."], [426.0, "Bize vacip olan şunu söylememizdir:"], [428.8, "Hulûl-i havâdisten ne kastediyorsun? Bununla mahlûkattan bir şeyin Hâlık Azze ve Celle'nin zâtına hulûl ettiğini mi kastediyorsun?"], [436.0, "Bunu kastediyorsan bu bâtıl bir manadır;"], [441.0, "hatta küfürdür, Allah'a sığınırız. Havâdisten, vahyin O'na isbat ettiği, Azze ve Celle'nin meşîetine bağlı fiilî ihtiyârî sıfatları kastediyorsan, bu hak bir manadır;"], [455.0, "ama ona havâdis demem, Ehl-i Sünnet ve'l-Cemaat'in razı olduğu ifadeyle onlara fiilî sıfatlar, ihtiyârî sıfatlar veya meşîete bağlı sıfatlar derim."]]}, {"reader": false, "ar": [[467.0, "أو على الأقل أقول:"], [469.5, "الله فعّالٌ لما يريد،"], [472.0, "فهو يفعل ما يريد عز وجل."], [475.0, "ولكن لا أردّ البدعةَ بالبدعة،"], [478.6, "ولا الإجمالَ ـ ولا الإجمالَ بالإجمال."], [483.0, "وكذلك إذا قال لك المبتدع:"], [486.5, "صفاتُ الله ليست هي الله،"], [490.0, "احذر ـ أيها السنّي ـ أن تقول:"], [493.0, "بل صفاتُ الله هي الله،"], [496.0, "فتكون قد رددتَ إجمالًا بإجمال،"], [499.7, "وبدعةً ببدعة. بل الواجب عليك في مثل هذا اللفظ المجمل الذي أطلقه هذا المبتدع الخبيث أن تفصّل،"], [509.0, "فتقول: ماذا تقصد بقولك:"], [511.2, "إنّ صفات الله غير الله؟"], [514.0, "فهل تقصد بالغيرية: أي غيريةَ الانفصال،"], [517.0, "فتكون الصفةُ منفصلةً عن الذات؟"], [520.0, "فإن كنت تقصد هذا فهذا معنًى باطل؛"], [523.0, "فإنّ الصفات تابعةٌ للذات ومتّصلةٌ بها،"], [526.4, "لا يمكن أن تنفصل على هذا المعنى الباطل الذي تريده."]], "tr": [[467.0, "Ya da en azından \"Allah dilediğini yapandır (fa''âlun limâ yurîd)\" derim;"], [475.0, "O, Azze ve Celle, dilediğini yapar."], [477.9, "Ama bid'atı bid'atla, icmali —icmali icmalle— reddetmem."], [483.0, "Aynı şekilde bid'atçı sana \"Allah'ın sıfatları Allah değildir\" derse, ey Sünnî, \"Bilakis Allah'ın sıfatları Allah'tır\" demekten sakın;"], [493.0, "yoksa bir icmali bir icmalle, bir bid'atı bir bid'atla reddetmiş olursun."], [502.0, "Bilakis bu habis bid'atçının kullandığı bu gibi mücmel bir lafızda sana vacip olan tafsil yapmandır."], [509.6, "Şöyle dersin: \"Allah'ın sıfatları Allah'ın gayrıdır\" sözünle ne kastediyorsun?"], [514.0, "Gayriyyetten ayrılık gayriyyetini mi, yani sıfatın zâttan ayrı olmasını mı kastediyorsun?"], [520.0, "Bunu kastediyorsan bu bâtıl bir manadır;"], [523.0, "çünkü sıfatlar zâta tâbidir ve ona bitişiktir;"], [526.9, "kastettiğin bu bâtıl mana üzere (ondan) ayrılması mümkün değildir."]]}, {"reader": false, "ar": [[532.0, "وإن كنت تقصد أنّ الصفات ليست هي الذات،"], [539.0, "يعني أنها تفيد معنًى زائدًا على ما تفيده الذات،"], [543.0, "فهذا معنًى حقّ ولا شكّ في ذلك؛"], [546.0, "فإنّ الصفة تفيد معنًى زائدًا على الذات."], [549.0, "فإذا قلتَ: «السميع»، فهو يدلّ على ذاته وعلى صفة السمع،"], [554.0, "وإذا قلتَ: «البصير»، فهي تدلّ على ذاته وصفة البصر."], [559.0, "فإذًا الصفة تدلّ على معنًى زائدٍ على الذات."], [565.0, "لكن احذر من أن تردّ البدعة بالبدعة،"], [568.5, "أو الإجمال بالإجمال، فتقع في الفخّ البدعي،"], [573.0, "كما وقع فيه بعضُ أهل السنة والجماعة من باب الحماسة في ردّ ما يقوله أهل البدع،"], [581.0, "أو أنهم لم يستشعروا من هذا اللفظ المجمل الذي أطلقه هذا المبتدع إلا المعنى الباطل،"], [589.0, "فأرادوا باللفظ المجمل ردًّا أن يردّوا هذا الباطل، ولكن أخطؤوا <span class=\"q\">؟ 09:54<\/span>."]], "tr": [[532.0, "Sıfatların zât olmadığını, yani zâtın ifade ettiğinden fazla bir mana ifade ettiklerini kastediyorsan, bu hak bir manadır ve bunda şüphe yoktur;"], [546.0, "çünkü sıfat, zâta ilave bir mana ifade eder."], [549.0, "\"es-Semî'\" dediğinde bu, O'nun zâtına ve işitme sıfatına delâlet eder;"], [555.1, "\"el-Basîr\" dediğinde bu, O'nun zâtına ve görme sıfatına delâlet eder."], [559.0, "Demek ki sıfat, zâta ilave bir manaya delâlet eder."], [565.0, "Ama bid'atı bid'atla veya icmali icmalle reddetmekten sakın;"], [569.0, "yoksa bid'at tuzağına düşersin. Nitekim Ehl-i Sünnet ve'l-Cemaat'ten bazıları, bid'at ehlinin söylediğini reddetmedeki heyecan yüzünden ya da bu bid'atçının kullandığı bu mücmel lafızdan yalnızca bâtıl manayı sezdikleri için bu tuzağa düştüler:"], [587.0, "Bu bâtılı mücmel bir lafızla reddetmek istediler, ama hata ettiler <span class=\"q\">؟<\/span>."]]}]}, {"ts": "09:57", "title": "1. Külliye (devam): İmam Ahmed'in \"lafız\" meselesindeki sözü; İbn Teymiyye ve Zehebî'nin nakilleri", "paras": [{"reader": false, "ar": [[597.0, "وقد أخذ ـ وقد عاتب أئمّةُ أهل السنة والجماعة بعضَ أهل السنة والجماعة لمّا ردّوا على المعتزلة في قولهم:"], [610.3, "«ألفاظنا بالقرآن مخلوقة»، فاستعجل بعضُ أهل السنة وقالوا:"], [617.5, "«بل ألفاظنا بالقرآن غير مخلوقة»."], [621.0, "فلمّا عُرضت الكلمتان ـ كلمةُ أهل البدع وكلمةُ هؤلاء المنتسبين للسنة ـ على الإمام أحمد،"], [632.0, "قال كلمته المشهورة: «من قال: ألفاظُنا بالقرآن مخلوقة فهو جهميّ، ومن قال: ألفاظُنا بالقرآن غير مخلوقة فهو مبتدع»."], [641.0, "لماذا كان الثاني مبتدعًا؟"], [643.8, "لأنه ردّ اللفظَ المجمل بالمجمل،"], [648.0, "فقد ردّ بدعةً ببدعة."]], "tr": [[597.0, "Ehl-i Sünnet ve'l-Cemaat imamları, Ehl-i Sünnet ve'l-Cemaat'ten bazılarını, Mu'tezile'nin \"Kur'an'ı telaffuzumuz mahlûktur\" sözüne reddiye verdiklerinde azarlamışlardır."], [608.1, "Ehl-i Sünnet'ten bazıları acele edip \"Bilakis Kur'an'ı telaffuzumuz mahlûk değildir\" dediler."], [617.5, "İki söz —bid'at ehlinin sözü ile Sünnet'e nispet edilen bu kimselerin sözü— İmam Ahmed'e arz edilince, o meşhur sözünü söyledi:"], [633.5, "\"Kim 'Kur'an'ı telaffuzumuz mahlûktur' derse o Cehmîdir;"], [637.0, "kim 'Kur'an'ı telaffuzumuz mahlûk değildir' derse o bid'atçıdır.\" İkincisi neden bid'atçı oldu?"], [643.8, "Çünkü mücmel lafzı mücmelle reddetti;"], [646.7, "böylece bid'atı bid'atla reddetmiş oldu."]]}, {"reader": false, "ar": [[651.0, "وعلى ذلك كلامُ أهل العلم رحمهم الله تعالى."], [656.0, "قال ابن تيمية رحمه الله:"], [658.0, "«وأمّا الألفاظ التي ليست في الكتاب والسنة، ولا اتّفق السلفُ على نفيها أو إثباتها، فهذه ليس على أحدٍ أن يوافق من نفاها أو أثبتها حتى يستفسر عن مراده؛ فإن أراد به معنًى يوافق خبرَ الرسول صلى الله عليه وسلم أقرّ به، وإن أراد بها معنًى يخالف خبرَ الرسول صلى الله عليه وسلم أنكره». انتهى كلامه."]], "tr": [[651.0, "Ehl-i ilmin —Allah Teâlâ onlara rahmet etsin— sözleri de bu yöndedir."], [656.0, "İbn Teymiyye —Allah ona rahmet etsin— dedi ki:"], [656.4, "\"Kitap ve Sünnet'te bulunmayan ve selefin nefyi veya isbatı üzerinde ittifak etmediği lafızlara gelince;"], [658.0, "kimsenin, onları nefyeden veya isbat edene, muradını sormadan uyması gerekmez."], [663.5, "Eğer onunla Resûl sallallâhu aleyhi ve sellem'in haberine uyan bir mana kastetmişse onu kabul eder;"], [674.7, "Resûl sallallâhu aleyhi ve sellem'in haberine aykırı bir mana kastetmişse onu reddeder.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[685.0, "وقال أبو العباس ابن تيمية أيضًا،"], [692.0, "قال: «إنّ ما أخبر به الرسول صلى الله عليه وسلم عن ربه فإنه يجب الإيمان به، سواءٌ عرفنا معناه أو لم نعرف معناه؛ لأنه الصادق المصدوق. فما جاء في الكتاب والسنة وجب على كل مؤمنٍ الإيمانُ به وإن لم يفهم معناه، وكذلك ما ثبت باتفاق سلف الأمة وأئمتها، مع أنّ هذا الباب يوجد عامّتُه منصوصًا في الكتاب والسنة، متّفقًا عليه بين سلف الأمة»."], [722.0, "أقول: كلامُ ابن تيمية (هذا) في الكلمات التي لا تحتمل إلا محضَ الحق."]], "tr": [[685.0, "Ebü'l-Abbâs İbn Teymiyye şöyle de dedi:"], [685.8, "\"Resûl sallallâhu aleyhi ve sellem'in Rabbi hakkında haber verdiği şeye iman etmek vaciptir;"], [688.1, "manasını bilelim veya bilmeyelim. Çünkü o, doğru sözlü ve doğruluğu tasdik edilmiş olandır."], [692.3, "Kitap ve Sünnet'te gelen şeye, manasını anlamasa bile her mü'minin iman etmesi vaciptir."], [701.4, "Ümmetin selefinin ve imamlarının ittifakıyla sabit olan da böyledir."], [707.8, "Üstelik bu babın geneli Kitap ve Sünnet'te nassla bildirilmiş ve ümmetin selefi arasında üzerinde ittifak edilmiş olarak bulunur.\" Derim ki:"], [722.0, "İbn Teymiyye'nin (bu) sözü, yalnızca katıksız hakkı muhtemel olan kelimeler hakkındadır."]]}, {"reader": false, "ar": [[729.0, "ثم انتقل بعد ذلك إلى الكلمات التي أحدثها المتأخرون،"], [733.0, "فقال: «وما تنازع فيه المتأخرون نفيًا وإثباتًا، فليس على أحدٍ ـ بل ولا له ـ أن يوافق أحدًا على إثبات لفظه أو نفيه حتى يعرف مراده؛ فإن أراد حقًّا قُبل، وإن أراد باطلًا رُدّ، وإن اشتمل كلامه على حقٍّ وباطل لم يُقبل مطلقًا، ولم يُردَّ جميعُ معناه، بل يُوقَف اللفظ ويُفسَّر المعنى»."], [767.0, "والله كلامٌ واضحٌ جدًّا."]], "tr": [[729.0, "Sonra bundan, müteahhirînin ortaya çıkardığı kelimelere geçti ve şöyle dedi:"], [731.2, "\"Müteahhirînin nefy ve isbat bakımından ihtilaf ettiği şeye gelince;"], [733.7, "kimsenin —hatta kimsenin hakkı da değildir— birine, muradını bilmeden lafzını isbat etmede veya nefyetmede uyması gerekmez."], [747.4, "Eğer hakkı kastetmişse kabul edilir, bâtılı kastetmişse reddedilir."], [755.2, "Sözü hakkı ve bâtılı birlikte içeriyorsa mutlak olarak kabul edilmez, manasının tamamı da reddedilmez;"], [767.0, "bilakis lafızda durulur ve mana tefsir edilir.\" Vallahi çok açık bir söz."]]}, {"reader": false, "ar": [[769.0, "وقال أبو العباس ابن تيمية أيضًا:"], [774.0, "«أئمةُ السنة كأحمد بن حنبل وغيره كانوا إذا ذكرت لهم أهلُ البدع الألفاظَ المجملة» ـ أعيدها مرةً أخرى ـ:"], [790.8, "«أئمةُ السنة كأحمد بن حنبل وغيره كانوا إذا ذكرت لهم أهلُ البدع الألفاظَ المجملة، كلفظ الجسم والجوهر والحيّز ونحوها، لم يوافقوهم على إطلاق الإثبات، ولا على إطلاق النفي. وأهلُ البدع بالعكس: ابتدعوا ألفاظًا ومعانيَ، إمّا في النفي وإمّا في الإثبات، وجعلوها هي الأصلَ المعقولَ المحكَم الذي يجب اعتقاده والبناء عليه». انتهى كلامه."]], "tr": [[769.0, "Ebü'l-Abbâs İbn Teymiyye şöyle de dedi:"], [774.0, "\"Ahmed b. Hanbel ve başkaları gibi Sünnet imamları, bid'at ehli onlara mücmel lafızları zikrettiğinde\" —bir kez daha tekrar ediyorum—:"], [790.8, "\"Ahmed b. Hanbel ve başkaları gibi Sünnet imamları, bid'at ehli onlara cisim, cevher, hayyiz (yer kaplama) ve benzeri lafızlar gibi mücmel lafızları zikrettiğinde, onlara ne mutlak isbatta ne de mutlak nefyde uyarlardı."], [808.5, "Bid'at ehli ise bunun tersine, nefyde veya isbatta lafızlar ve manalar uydurdular ve bunları inanılması ve üzerine bina edilmesi vacip olan aklî, muhkem asıl yaptılar.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[825.0, "فهو يحكي أنّ مذهب أهل السنة إذا سمعوا هذه الألفاظ المجملة من أهل البدع:"], [830.4, "لم يوافقوهم على قبولها لأنّ فيها باطلًا،"], [833.5, "ولم يوافقوهم على ردّها لأنّ فيها حقًّا."], [837.0, "ولكنّ سِمةَ أهل البدع وعلامتهم أنهم يُحدثون ألفاظًا مجملةً ثم يحاكمون الوحيَ إليها قبولًا وإثباتًا."]], "tr": [[825.0, "(İbn Teymiyye) şunu nakletmektedir: Ehl-i Sünnet'in mezhebi, bid'at ehlinden bu mücmel lafızları işittiklerinde, içlerinde bâtıl olduğu için onları kabul etmede (bid'at ehline) uymamak, içlerinde hak olduğu için de onları reddetmede onlara uymamaktır."], [837.0, "Bid'at ehlinin alameti ve nişanı ise mücmel lafızlar uydurmaları, sonra kabul ve isbat bakımından vahyi bunlara muhakeme ettirmeleridir."]]}, {"reader": false, "ar": [[849.0, "وقال أبو العباس ابن تيمية أيضًا ـ معلش بس طوّلتُ عليكم ـ:"], [852.0, "«وما تنازع فيه الأمة من الألفاظ المجملة، كلفظ المتحيّز والجهة والجسم والجوهر والعَرَض وأمثال ذلك، فليس على أحدٍ أن يقبل مسمّى اسمٍ من هذه الأسماء، لا في النفي ولا في الإثبات، حتى يتبيّن له معناه؛ فإن كان المتكلّم بذلك أراد معنًى صحيحًا موافقًا لقول المعصوم صلى الله عليه وسلم كان ما أراده حقًّا، وإن كان أراد به معنًى مخالفًا لقول المعصوم صلى الله عليه وسلم كان ما أراده باطلًا». انتهى كلامه."]], "tr": [[849.0, "Ebü'l-Abbâs İbn Teymiyye şöyle de dedi —kusura bakmayın, sizi uzun tuttum—:"], [850.3, "\"Ümmetin ihtilaf ettiği mütehayyiz, cihet, cisim, cevher, araz ve benzeri mücmel lafızlara gelince;"], [852.0, "kimsenin, manası kendisine açıklanmadan bu isimlerden herhangi bir ismin müsemmâsını ne nefyde ne de isbatta kabul etmesi gerekmez."], [865.3, "Bunu söyleyen, Masûm sallallâhu aleyhi ve sellem'in sözüne uygun sahih bir mana kastetmişse, kastettiği haktır;"], [876.6, "Masûm sallallâhu aleyhi ve sellem'in sözüne aykırı bir mana kastetmişse, kastettiği bâtıldır.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[890.0, "وقال الإمام الذهبيّ رحمه الله:"], [892.0, "«الصوابُ الكفُّ عن إطلاق ذلك إن لم يأتِ فيه نصّ، ولو فرضنا أنّ المعنى صحيح، فليس لنا أن نتفوّه بشيءٍ لم يأذن به الله، خوفًا من أن يدخل القلبَ شيءٌ من البدعة. اللهمّ احفظ علينا إيماننا»."], [908.0, "انتهى كلامه رحمه الله."], [910.0, "وأظنّ أنّ الكلّيّة واضحةٌ إن شاء الله."]], "tr": [[890.0, "İmam Zehebî —Allah ona rahmet etsin— dedi ki:"], [892.0, "\"Doğru olan, hakkında nass gelmemişse onu mutlak olarak söylemekten kaçınmaktır."], [897.4, "Mananın sahih olduğunu farz etsek bile, kalbe bid'attan bir şey girmesi korkusuyla, Allah'ın izin vermediği bir şeyi ağzımıza almamız bize düşmez."], [908.0, "Allah'ım, imanımızı bizim için koru.\" Sözü —Allah ona rahmet etsin— burada bitti. Sanırım külliye, inşallah, açıktır."]]}]}, {"ts": "15:13", "title": "2. Külliye: Vahiy deliliyle bâtılına ihticâc eden her bâtıl ehli için, delilin kendisinde sözünü iptal eden şey vardır", "paras": [{"reader": false, "ar": [[913.0, "الكلّيّة الثانية: كلُّ مُبطِلٍ احتجّ بدليل الوحي على باطله،"], [930.0, "ففي عين الدليل ـ مع التأمّل ـ ما يُبطل قولَه. <span class=\"note\">(يكررها)<\/span> أعيدها مرةً ثالثة:"], [958.0, "كلُّ مُبطِلٍ احتجّ بدليل الوحي على باطله،"], [967.0, "ففي عين الدليل ـ مع التأمّل ـ ما يُبطل قولَه."]], "tr": [[913.0, "<b>2. külliye: Vahyin deliliyle bâtılına delil getiren her bâtıl ehli için, delilin bizzat kendisinde —tefekkür edildiğinde— onun sözünü iptal eden şey vardır.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [956.9, "<b>2. külliye: Vahyin deliliyle bâtılına delil getiren her bâtıl ehli için, delilin bizzat kendisinde —tefekkür edildiğinde— onun sözünü iptal eden şey vardır.<\/b>"]]}, {"reader": false, "ar": [[973.0, "أقول وبالله التوفيق: وهذه مأخوذةٌ من قول أبي العباس ابن تيمية رحمه الله تعالى،"], [982.0, "حيث قال في قاعدةٍ شريفة:"], [984.5, "«وهي أنّ جميع ما يحتجّ به المبطل من الأدلة الشرعية والعقلية إنما تدلّ على الحق، لا تدلّ على قول المبطل»."], [994.6, "انتهى كلامه. وقال رحمه الله:"], [997.0, "«وجميعُ ما يحتجّون به» ـ أي أهل البدع ـ «من هذه الآيات وغيرها فهو حجّةٌ عليهم لا لهم. وهكذا شأنُ جميع أهل الضلال: إذا احتجّوا بشيءٍ من كتاب الله وكلام أنبيائه، كان في نفس ما احتجّوا به ما يدلّ على فساد قولهم»."], [1025.0, "قلت: وهذا فضلُ الله يؤتيه من يشاء."]], "tr": [[973.0, "Tevfik Allah'tandır, derim ki: Bu (külliye), Ebü'l-Abbâs İbn Teymiyye'nin —Allah Teâlâ ona rahmet etsin— sözünden alınmıştır."], [981.4, "O, şerefli bir kaidede şöyle demiştir:"], [984.5, "\"Bâtıl ehlinin delil getirdiği şer'î ve aklî delillerin hepsi ancak hakka delâlet eder, bâtıl ehlinin sözüne delâlet etmez.\" Sözü burada bitti."], [994.6, "Yine —Allah ona rahmet etsin— şöyle dedi:"], [997.0, "\"Onların\" —yani bid'at ehlinin— \"bu ayetlerden ve başkalarından delil getirdikleri her şey onların lehine değil aleyhine bir delildir."], [1011.5, "Bütün dalâlet ehlinin durumu böyledir:"], [1014.3, "Allah'ın Kitabı'ndan ve peygamberlerinin sözünden bir şeyle delil getirdiklerinde, delil getirdikleri şeyin bizzat kendisinde sözlerinin fesadına delâlet eden şey bulunur.\" Derim ki:"], [1025.0, "Bu, Allah'ın dilediğine verdiği lütfudur."]]}, {"reader": false, "ar": [[1030.0, "وقال رحمه الله تعالى:"], [1033.0, "«فإنّ الرافضة» ـ انتبهوا لي ـ «فإنّ الرافضة لا يكادون يحتجّون بحجّةٍ إلا كانت عليهم لا لهم»."], [1044.6, "انتهى كلامه. وقال ابن القيم رحمه الله تعالى:"], [1050.0, "«وقد قرّر شيخنا وجهَ الاستدلال به أحسنَ تقريرٍ وألطفَه، وقال لي: أنا ألتزم» ـ وعدٌ من أبي العباس،"], [1067.0, "يقول: ـ «أنا ألتزم أنه لا يحتجّ مبطلٌ بآيةٍ أو حديثٍ صحيحٍ على باطله إلا وفي ذلك الدليل ما يدلّ على نقيض قوله». انتهى كلامه."]], "tr": [[1030.0, "Yine —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1033.0, "\"Râfıza\" —bana dikkat edin— \"Râfıza, neredeyse hiçbir delil getirmez ki o delil onların lehine değil aleyhine olmasın.\" Sözü burada bitti."], [1044.6, "İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— dedi ki:"], [1050.0, "\"Şeyhimiz bununla istidlal vechini en güzel ve en ince şekilde takrir etti ve bana şöyle dedi:"], [1059.1, "Ben taahhüt ediyorum\" —bu Ebü'l-Abbâs'tan bir vaattir, diyor ki— \"ben taahhüt ediyorum ki hiçbir bâtıl ehli, bâtılına bir ayetle veya sahih bir hadisle delil getirmez ki o delilde onun sözünün zıddına delâlet eden bir şey bulunmasın.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1083.0, "وقال الإمام ابن سعدي رحمه الله تعالى:"], [1086.0, "«وهكذا كلُّ مبطلٍ يحتجّ بآيةٍ أو حديثٍ صحيحٍ على قوله الباطل، فلا بدّ أن يكون فيما احتجّ به حجّةٌ عليه»."], [1096.0, "وأنا أضرب لكم أمثلةً على بعض هذه الاستدلالات،"], [1103.0, "ولو أنّ أحدنا فرّغ نفسه ليجمع ذلك،"], [1108.0, "ويربّي طلابَ أهل العلم على ردّ كلّ حجّةٍ يحتجّ بها أهلُ الباطل من كتاب الله أو سنة رسوله صلى الله عليه وسلم،"], [1120.0, "لكان في ذلك خيرٌ عظيم."]], "tr": [[1083.0, "İmam İbn Sa'dî —Allah Teâlâ ona rahmet etsin— dedi ki:"], [1088.2, "\"Bâtıl sözüne bir ayetle veya sahih bir hadisle delil getiren her bâtıl ehli böyledir;"], [1096.0, "delil getirdiği şeyde mutlaka onun aleyhine bir delil bulunur.\" Ben de size bu istidlallerin bazılarına örnekler vereceğim."], [1107.3, "Eğer birimiz kendini bunu toplamaya adasa ve ilim talebelerini, bâtıl ehlinin Allah'ın Kitabı'ndan veya Resûlü sallallâhu aleyhi ve sellem'in Sünneti'nden getirdiği her delili reddetmek üzere yetiştirse, bunda büyük bir hayır olurdu."]]}]}, {"ts": "18:43", "title": "2. Külliye (devam): \"Gözler O'nu idrak edemez\" ayeti ru'yeti isbat eder", "paras": [{"reader": false, "ar": [[1123.0, "فمن ذلك مثلًا: استدلالُ المعتزلة على نفي رؤية الله يوم القيامة بقول الله عز وجل:"], [1132.7, "<span class=\"ayah\">﴿لَّا تُدْرِكُهُ الْأَبْصَارُ﴾<\/span> <span class=\"ref\">[الأنعام: ١٠٣]<\/span>، فيقولون:"], [1134.7, "بأنّ نفي الإدراك هنا دليلٌ على أنه لا يُرى."], [1141.0, "ولو تأمّلتَ هذا الدليل لوجدتَ أنّ فيه ردًّا عليهم،"], [1147.0, "بل وفيه إثباتُ الرؤية؛"], [1149.0, "وذلك لأنّ الإدراك إنما يكون لِما قد رُئي،"], [1154.0, "ولكن قد ترى الشيءَ ولا تُدركه،"], [1157.0, "أي لا تحيط به."], [1159.0, "فإذا قلتُ لك: فلانٌ نظر إلى السماء ولم يُدركها،"], [1164.0, "أي لم يُحِط نظرُه بكل أجزائها،"], [1167.0, "فإذًا النفيُ للإدراك دليلٌ على أنّ الإنسان قد رأى السماء."], [1172.0, "وأقول: نظرتُ إلى الأرض فلم أُدركها،"], [1178.0, "يعني لم أُحِط بها،"], [1179.0, "فهذا دليلٌ على سبق الرؤية."]], "tr": [[1123.0, "Bunlardan biri, örneğin, Mu'tezile'nin kıyamet günü Allah'ın ru'yetini nefyetmeye Allah Azze ve Celle'nin şu sözüyle istidlal etmesidir:"], [1132.7, "<span class=\"ayah\">﴿Gözler O'nu idrak edemez﴾<\/span> [En'âm 103]."], [1134.7, "Derler ki: Burada idrâkin nefyedilmesi, O'nun görülmeyeceğine delildir."], [1141.0, "Bu delili düşünseydin, onda onlara bir reddiye, hatta ru'yetin isbatını bulurdun."], [1149.0, "Çünkü idrâk ancak görülmüş olan şey için söz konusudur;"], [1154.0, "ama bir şeyi görüp onu idrak etmeyebilirsin, yani onu kuşatmayabilirsin."], [1159.0, "Sana \"Falan gökyüzüne baktı ama onu idrak edemedi\" dersem, yani bakışı onun bütün parçalarını kuşatamadı;"], [1167.0, "demek ki idrâkin nefyi, insanın gökyüzünü görmüş olduğuna delildir."], [1172.0, "\"Yeryüzüne baktım ama onu idrak edemedim\" dersem, yani onu kuşatamadım;"], [1179.0, "bu, görmenin önceden gerçekleştiğine delildir."]]}, {"reader": false, "ar": [[1181.0, "فإذا قال الله عز وجل:"], [1182.9, "<span class=\"ayah\">﴿لَّا تُدْرِكُهُ الْأَبْصَارُ﴾<\/span>، فهذا إثباتٌ للرؤية،"], [1186.2, "لكنّه لكِبَره ولعظمة ذاته وصفاته،"], [1191.0, "فإنّ الأبصار وإن رأته لا تحيط به رؤيةً؛"], [1196.0, "فالذي لا يُحاط به علمًا لا يُحاط به رؤيةً،"], [1201.0, "كما قال الله عز وجل:"], [1203.8, "<span class=\"ayah\">﴿وَلَا يُحِيطُونَ بِهِ عِلْمًا﴾<\/span> <span class=\"ref\">[طه: ١١٠]<\/span>،"], [1206.0, "وكذلك أيضًا: <span class=\"ayah\">﴿لَّا تُدْرِكُهُ الْأَبْصَارُ﴾<\/span>."], [1209.0, "فالإدراك في الآية معناه الإحاطة،"], [1214.0, "كما جمع الله عز وجل بين الرؤية والإدراك في قوله عز وجل عن موسى وفرعون:"], [1221.0, "<span class=\"ayah\">﴿فَلَمَّا تَرَاءَى الْجَمْعَانِ﴾<\/span> ـ فإذًا أثبت الرؤية ـ <span class=\"ayah\">﴿قَالَ أَصْحَابُ مُوسَىٰ إِنَّا لَمُدْرَكُونَ﴾<\/span> <span class=\"ref\">[الشعراء: ٦١]<\/span>،"], [1232.0, "أي: إنّا لمُحاطٌ بنا."]], "tr": [[1181.0, "Allah Azze ve Celle <span class=\"ayah\">﴿Gözler O'nu idrak edemez﴾<\/span> buyurduğunda, bu ru'yetin isbatıdır;"], [1185.5, "fakat O'nun büyüklüğü, zâtının ve sıfatlarının azameti sebebiyle gözler O'nu görse de görüş olarak O'nu kuşatamaz."], [1196.0, "İlim olarak kuşatılamayan, görüş olarak da kuşatılamaz."], [1199.9, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1203.8, "<span class=\"ayah\">﴿Onlar O'nu ilim bakımından kuşatamazlar﴾<\/span> [Tâhâ 110]."], [1207.2, "Aynı şekilde <span class=\"ayah\">﴿Gözler O'nu idrak edemez﴾<\/span>."], [1210.6, "Ayetteki idrâk, kuşatma manasındadır. Nitekim Allah Azze ve Celle, Mûsâ ve Firavun hakkındaki sözünde ru'yet ile idrâki bir araya getirmiştir:"], [1221.0, "<span class=\"ayah\">﴿İki topluluk birbirini görünce﴾<\/span> —demek ki görmeyi isbat etti— <span class=\"ayah\">﴿Mûsâ'nın arkadaşları: \"Kesinlikle yakalandık (kuşatıldık)!\" dediler﴾<\/span> [Şuarâ 61]; yani \"Biz kuşatıldık.\""]]}, {"reader": false, "ar": [[1235.0, "فلمّا نفى الله عز وجل إدراكَ الأبصار ـ إدراكَ الأبصار لذاته ـ دلّ ذلك على أنها تراه؛"], [1247.0, "إذ لا يمكن أن يُنفى إدراكٌ عن شيءٍ ولم يُرَ."], [1253.0, "فأنا أرى الجبل ولكن لا أُحيط به رؤيةً،"], [1259.0, "فتبقى أجزاءٌ كثيرةٌ من الجبل لا أراها."], [1262.0, "بل ويرى الإنسان الحجرَ الكبير ولا يُحيط به رؤيةً،"], [1267.0, "ويرى البناءَ الكبير ولا يُحيط به،"], [1273.0, "ويرى الشمسَ والقمرَ والأفلاكَ ولا يُحيط بها رؤيةً."], [1277.0, "فكلُّ شيءٍ نُفي الإدراكُ عنه فهذا دليلٌ على سبق رؤيته."], [1286.0, "فانظر كيف صار الدليلُ الذي احتجّوا به حجّةً عليهم."]], "tr": [[1235.0, "Allah Azze ve Celle gözlerin idrâkini —gözlerin O'nun zâtını idrâkini— nefyedince, bu, gözlerin O'nu göreceğine delâlet etti."], [1247.0, "Çünkü görülmemiş bir şeyden idrâkin nefyedilmesi mümkün değildir."], [1253.0, "Ben dağı görürüm ama görüş olarak onu kuşatamam;"], [1259.0, "dağın birçok parçası göremediğim hâlde kalır."], [1262.0, "Hatta insan büyük taşı görür ama görüş olarak onu kuşatamaz;"], [1266.4, "büyük binayı görür ama onu kuşatamaz;"], [1270.1, "güneşi, ayı ve gök cisimlerini görür ama görüş olarak onları kuşatamaz."], [1277.0, "İdrâkin kendisinden nefyedildiği her şey, onun daha önce görülmüş olduğunun delilidir."], [1286.0, "Bak, delil getirdikleri delil nasıl onların aleyhine bir delil hâline geldi!"]]}]}, {"ts": "21:31", "title": "2. Külliye (devam): \"O'nun benzeri hiçbir şey yoktur\" ayeti isim ve sıfatları isbat eder", "paras": [{"reader": false, "ar": [[1291.0, "ومن ذلك أيضًا: أهلُ التعطيل يستدلّون على تعطيلهم بقول الله عز وجل:"], [1303.9, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>؛ فتجدهم ينفون عن الله عز وجل الأسماءَ مستدلّين بهذه الآية،"], [1312.0, "وتجد كثيرًا منهم ينفون عن الله عز وجل الصفاتِ مستدلّين بهذه الآية."], [1321.0, "ولو أنك تأمّلتَ الآية لوجدتَها تُثبت الأسماءَ والصفات؛"], [1326.0, "وذلك لأنّ نفي مماثلة الشيء دليلٌ على الاتفاق في الأصل؛"], [1332.0, "لأنّ ما لا ذاتَ له لا يقال:"], [1336.9, "ليس كمثله شيء، وما لا صفاتِ له أصلًا لا يقال:"], [1341.8, "ليس كمثله شيء. فنفيُ مماثلة الله عز وجل دليلٌ على أنّ له ذاتًا لكن ليست كالذوات،"], [1349.0, "وأنّ له صفاتٍ لكن ليست كالصفات."]], "tr": [[1291.0, "Bunlardan biri de şudur: Ta'til ehli, ta'tillerine Allah Azze ve Celle'nin şu sözüyle istidlal ederler:"], [1303.9, "<span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11]."], [1306.0, "Onların, bu ayetle istidlal ederek Allah Azze ve Celle'den isimleri nefyettiklerini görürsün;"], [1312.0, "birçoğunun da bu ayetle istidlal ederek Allah Azze ve Celle'den sıfatları nefyettiğini görürsün."], [1321.0, "Ayeti düşünseydin, onun isimleri ve sıfatları isbat ettiğini bulurdun."], [1326.0, "Çünkü bir şeyin benzerliğinin nefyedilmesi, asılda ortaklığa delildir."], [1330.2, "Zira zâtı olmayan için \"O'nun benzeri hiçbir şey yoktur\" denmez;"], [1336.9, "aslen sıfatı olmayan için de \"O'nun benzeri hiçbir şey yoktur\" denmez."], [1343.0, "Allah Azze ve Celle'nin benzerliğinin nefyedilmesi, O'nun zâtlara benzemeyen bir zâtı ve sıfatlara benzemeyen sıfatları olduğuna delildir."]]}, {"reader": false, "ar": [[1353.0, "فهل يصحّ لي كعاقلٍ أن أقول:"], [1357.2, "الممتنعُ ليس كمثله شيء؟"], [1362.0, "الجواب: لا؛ لأنّ الممتنع أصلًا ليس بشيء."], [1368.0, "وهل يصحّ لي أن أقول:"], [1370.5, "إنّ المعدوم ليس كمثله شيء؟"], [1373.0, "الجواب: لا؛ لأنّ المعدوم أصلًا ليس بشيء،"], [1377.5, "فما ليس بشيءٍ فهو ـ كما قيل ـ ليس بشيء."], [1382.6, "لكنّ الله أثبت ـ إيش؟"], [1384.5, "ـ أنه شيءٌ في قوله:"], [1387.1, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span>. فالله له ذاتٌ،"], [1393.4, "والآية تنفي مماثلة ذاته عن ذوات خلقه؛"], [1396.7, "والله له أسماء، والآية تنفي مماثلة أسمائه لصفات خلقه؛"], [1401.0, "والله له صفات، والآية تنفي مماثلة صفاته لصفات خلقه،"], [1408.0, "بدليل آخر الآية؛ قال:"], [1409.8, "<span class=\"ayah\">﴿وَهُوَ السَّمِيعُ﴾<\/span> فأثبت له سمعًا،"], [1414.0, "<span class=\"ayah\">﴿الْبَصِيرُ﴾<\/span> فأثبت له بصرًا."], [1417.0, "فالآية مع التأمّل تدلّ عليهم لا لهم."]], "tr": [[1353.0, "Akıllı biri olarak \"İmkânsız olanın (mümteni') benzeri hiçbir şey yoktur\" demem doğru olur mu?"], [1362.0, "Cevap: Hayır; çünkü mümteni' aslen bir şey değildir."], [1368.0, "\"Ma'dûmun (yok olanın) benzeri hiçbir şey yoktur\" demem doğru olur mu?"], [1373.0, "Cevap: Hayır; çünkü ma'dûm aslen bir şey değildir."], [1377.5, "Bir şey olmayan, denildiği gibi, bir şey değildir."], [1382.6, "Fakat Allah —ne?— kendisinin bir şey olduğunu <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> sözüyle isbat etti."], [1392.0, "Allah'ın zâtı vardır; ayet, O'nun zâtının mahlûkatının zâtlarına benzemesini nefyeder."], [1396.7, "Allah'ın isimleri vardır; ayet, O'nun isimlerinin mahlûkatının sıfatlarına benzemesini nefyeder."], [1401.0, "Allah'ın sıfatları vardır; ayet, O'nun sıfatlarının mahlûkatının sıfatlarına benzemesini nefyeder."], [1406.8, "Delili de ayetin sonudur: <span class=\"ayah\">﴿O, işitendir﴾<\/span> buyurarak kendisine işitmeyi isbat etti, <span class=\"ayah\">﴿görendir﴾<\/span> buyurarak kendisine görmeyi isbat etti."], [1417.0, "Demek ki ayet, tefekkür edildiğinde onların lehine değil aleyhine delâlet eder."]]}]}, {"ts": "23:43", "title": "2. Külliye (devam): \"Kim İslâm'da güzel bir çığır açarsa\" hadisi ve \"güzel bid'at\" iddiası", "paras": [{"reader": false, "ar": [[1423.0, "ومنها أيضًا: يستدلّ من قال بأنّ هناك بدعةً حسنة ـ يستدلّ من قال بأنّ في الدين بدعةً حسنة ـ بقول النبي صلى الله عليه وسلم في صحيح مسلم من حديث جرير بن عبد الله البَجَليّ:"], [1444.0, "«من سنّ في الإسلام سنّةً حسنةً كان له أجرُها وأجرُ من عمل بها من بعده، من غير أن يَنقُص من أجورهم شيء»."], [1458.0, "ولو تأمّل في الحديث حقَّ التأمّل لوجد أنّ الحديث عليه لا له؛"], [1465.0, "وذلك لأنه قال: «من سنّ في الإسلام سنّةً حسنة»،"], [1472.0, "والإسلام ليس دينًا مفتوحًا لكلّ من هبّ ودبّ يجعل فيه ما ليس منه،"], [1479.0, "فلو كان لكلّ أحدٍ أن يسنّ في الإسلام ما يريد،"], [1483.0, "لَما احتاجت البشريةُ لا لإرسال رسولٍ ولا لإنزال كتاب."]], "tr": [[1423.0, "Bunlardan biri de şudur: Güzel bir bid'atın bulunduğunu söyleyen —dinde güzel bir bid'at bulunduğunu söyleyen— kimse, Peygamber sallallâhu aleyhi ve sellem'in, Sahîh-i Müslim'de Cerîr b."], [1440.0, "Abdillâh el-Becelî'nin hadisinden gelen şu sözüyle istidlal eder:"], [1444.0, "\"Kim İslâm'da güzel bir çığır açarsa, onun ecri ve kendisinden sonra onunla amel edenlerin ecri ona aittir;"], [1458.0, "onların ecirlerinden hiçbir şey eksilmeden.\" Hadisi gereği gibi düşünseydi, hadisin onun lehine değil aleyhine olduğunu bulurdu."], [1466.0, "Çünkü \"Kim İslâm'da güzel bir çığır açarsa\" buyurdu."], [1472.5, "İslâm ise önüne gelen herkesin, ondan olmayanı içine koyabileceği açık bir din değildir."], [1479.0, "Eğer herkesin İslâm'da dilediğini ihdas etmesi mümkün olsaydı, insanlık ne bir resul gönderilmesine ne de bir kitap indirilmesine muhtaç olurdu."]]}, {"reader": false, "ar": [[1489.0, "فتقييدُ تلك السنّة بأنها في الإسلام دليلٌ على أنها ـ إيش؟"], [1494.1, "ـ ليست سنّةَ ابتداء، وإنما هي سنّةُ إحياء؛"], [1498.0, "بدليل أنه وصف هذه السنّة بأنها حسنة،"], [1502.7, "وحُسنُ الشيء شرعًا لا يُعرف إلا بالشرع."], [1510.0, "لأنه إذا ابتدع هذه البدعة فإنه يعتقد أنها من الدين،"], [1516.2, "وأنها من الإسلام، وأنها من القُربات والعبادات،"], [1521.0, "وأنها ممّا يأجُر اللهُ فاعلَه،"], [1525.0, "وأنها ممّا يُدعى إليه،"], [1528.0, "وأنها ممّا يُبغِض الطرفَ الآخر إذا أنكرها."], [1532.0, "فكلُّ هذه الأمور تدلّ على أنه يعتقد أنها من الدين،"], [1538.0, "فبما أنه يعتقد أنها من الدين فلا بدّ أن يأتينا على حُسنها بدليل الشرع."]], "tr": [[1489.0, "O çığırın \"İslâm'da\" olmakla kayıtlanması, onun —ne?— sıfırdan icat edilmiş bir çığır değil, ihya edilmiş bir sünnet olduğuna delildir."], [1498.0, "Delili de bu çığırı \"güzel\" diye nitelemesidir;"], [1502.0, "bir şeyin şer'an güzel olduğu ise ancak şeriatla bilinir."], [1510.0, "Çünkü (kişi) bu bid'atı icat ettiğinde, onun dinden, İslâm'dan, kurbet ve ibadetlerden olduğuna, Allah'ın yapanına ecir verdiği şeylerden olduğuna, kendisine davet edilen şeylerden olduğuna ve onu inkâr eden karşı tarafa buğzedilmesini gerektiren şeylerden olduğuna inanır."], [1532.0, "Bütün bu hususlar, onun bunu dinden saydığına delâlet eder."], [1537.4, "Madem onu dinden sayıyor, öyleyse onun güzelliğine dair bize şer'î bir delil getirmesi gerekir."]]}, {"reader": false, "ar": [[1546.0, "فلا يجوز أن نجعل استحسانَ نفوسنا دليلًا شرعيًّا نُدخل به في دين الله ما شئنا،"], [1554.0, "ولا استحسانَ أمزجتنا، أو استحسانَ نفوسنا،"], [1558.0, "أو ملاءمةَ القول والفعل لما طاب لنا <span class=\"q\">؟ 25:54<\/span> فنجعله من الدين."], [1566.0, "فوصفُ هذه السنّة بأنها «في الإسلام» دليلٌ على أنه لا بدّ فيها من دليل،"], [1573.0, "ووصفُها بأنها «حسنة» دليلٌ على أنه لا بدّ فيها من دليل."], [1580.0, "ويؤكّد ذلك قولُه صلى الله عليه وسلم:"], [1583.5, "«وكلُّ بدعةٍ ضلالة». ففي الدليل ما يدلّ على بطلان قوله."]], "tr": [[1546.0, "Nefislerimizin güzel bulmasını, Allah'ın dinine dilediğimizi soktuğumuz şer'î bir delil yapmamız caiz değildir;"], [1551.9, "mizaçlarımızın güzel bulmasını, nefislerimizin güzel bulmasını veya söz ve fiilin hoşumuza gidene <span class=\"q\">؟<\/span> uygun düşmesini de (delil yapıp) onu dinden saymamız caiz değildir."], [1566.0, "Bu sünnetin \"İslâm'da\" diye nitelenmesi, onda mutlaka bir delil bulunması gerektiğine delildir;"], [1572.5, "\"güzel\" diye nitelenmesi de onda mutlaka bir delil bulunması gerektiğine delildir."], [1580.0, "Bunu, onun sallallâhu aleyhi ve sellem \"Her bid'at dalâlettir\" sözü de pekiştirir."], [1585.0, "Demek ki delilde, onun sözünün bâtıl olduğuna delâlet eden şey vardır."]]}]}, {"ts": "26:29", "title": "2. Külliye (devam): Nüzul hadisi ve \"Allah her şeyin yaratıcısıdır\" ayeti", "paras": [{"reader": false, "ar": [[1589.0, "ومنها أيضًا: يقول الأشعريّ وغيره:"], [1592.3, "بأنّ الذي ينزل في ثلث الليل الآخر ليس هو الله،"], [1604.0, "وإنما أمرُه، أو رحمتُه،"], [1606.9, "أو مَلَكٌ من الملائكة."], [1610.0, "فهو يفهم من قول النبي صلى الله عليه وسلم:"], [1615.0, "«ينزل ربُّنا»: أي ينزل أمرُه،"], [1617.7, "أو مَلَكٌ من ملائكته،"], [1619.9, "أو رحمتُه. ولو أنه تأمّل الدليل لوجد فيه ما ينقض قوله؛"], [1625.0, "فإنّ المَلَك والرحمة والأمر لا يمكن أن تقول:"], [1630.3, "«من يدعوني فأستجيب له»؛"], [1633.0, "فإنّ دعاء الأمر كفر،"], [1637.0, "ودعاء الرحمة كفر، ودعاء المَلَك كفر."], [1642.0, "فالملائكة لا تُدعى، ولا تُستغفر،"], [1644.5, "ولا تُسأل، ولا يُطلب منها <span class=\"q\">؟ 27:22<\/span>."]], "tr": [[1589.0, "Bunlardan biri de şudur: Eş'arî ve başkaları, gecenin son üçte birinde inenin Allah olmadığını, O'nun emri, rahmeti veya meleklerden bir melek olduğunu söylerler."], [1610.0, "(Eş'arî) Peygamber sallallâhu aleyhi ve sellem'in \"Rabbimiz iner\" sözünden, O'nun emrinin, meleklerinden bir meleğin veya rahmetinin indiğini anlar."], [1621.0, "Delili düşünseydi, onda sözünü bozan şeyi bulurdu."], [1625.0, "Çünkü melek, rahmet ve emir \"Kim bana dua eder ki ona icabet edeyim?\" diyemez."], [1633.0, "Zira emre dua etmek küfürdür, rahmete dua etmek küfürdür, meleğe dua etmek küfürdür."], [1642.0, "Meleklere dua edilmez, onlardan mağfiret dilenmez, onlardan bir şey istenmez, onlardan talepte bulunulmaz <span class=\"q\">؟<\/span>."]]}, {"reader": false, "ar": [[1647.0, "ففي الحديث ما يدلّ على إبطال تحريفاتهم؛"], [1652.0, "فإنه لا يمكن لأحدٍ أبدًا أن يقول:"], [1655.1, "«من يدعوني» إلا إذا كان الله،"], [1658.0, "«من يسألني» إلا إذا كان الله،"], [1662.0, "«من يستغفرني» إلا إذا كان الله."], [1666.0, "فهمتم هذا؟ ففي الحديث ما يدلّ على بطلان قولهم."]], "tr": [[1647.0, "Hadiste onların tahriflerinin bâtıl olduğuna delâlet eden şey vardır."], [1652.0, "Çünkü hiç kimsenin, Allah olmadıkça \"Kim bana dua eder?\", Allah olmadıkça \"Kim benden ister?\", Allah olmadıkça \"Kim benden mağfiret diler?\" demesi asla mümkün değildir."], [1666.0, "Bunu anladınız mı? Hadiste onların sözünün bâtıl olduğuna delâlet eden şey vardır."]]}, {"reader": false, "ar": [[1671.0, "ومنها أيضًا: استدلّ المعتزليّ على أنّ القرآن مخلوقٌ بقول الله عز وجل:"], [1682.9, "<span class=\"ayah\">﴿اللَّهُ خَالِقُ كُلِّ شَيْءٍ﴾<\/span> <span class=\"ref\">[الزمر: ٦٢]<\/span>،"], [1690.0, "مع أنّ المعتزليّ يُعلنها أنّ القرآن كلامُ الله،"], [1694.0, "ولكنه مخلوق. ويستدلّ بهذه الآية،"], [1700.0, "أي بعمومها، فيقول: القرآن شيءٌ أو ليس بشيء؟"], [1706.0, "نحن نقول: نعم، هو شيء."], [1708.0, "فيكون داخلًا في عموم:"], [1710.0, "<span class=\"ayah\">﴿اللَّهُ خَالِقُ كُلِّ شَيْءٍ﴾<\/span>،"], [1714.0, "والقرآن شيء، إذن يكون مخلوقًا."], [1716.0, "ونسي بأنّ كلام الله أصلًا داخلٌ في قوله:"], [1721.5, "«الله» في أول الآية."]], "tr": [[1671.0, "Bunlardan biri de şudur: Mu'tezilî, Kur'an'ın mahlûk olduğuna Allah Azze ve Celle'nin şu sözüyle istidlal etti:"], [1682.9, "<span class=\"ayah\">﴿Allah her şeyin yaratıcısıdır﴾<\/span> [Zümer 62]."], [1690.0, "Hâlbuki Mu'tezilî, Kur'an'ın Allah'ın kelâmı olduğunu açıkça söyler, ama onun mahlûk olduğunu söyler."], [1697.0, "Bu ayetle, yani onun umumuyla istidlal eder ve şöyle der:"], [1702.7, "Kur'an bir şey midir, değil midir?"], [1706.0, "Biz deriz ki: Evet, o bir şeydir."], [1708.0, "O hâlde <span class=\"ayah\">﴿Allah her şeyin yaratıcısıdır﴾<\/span> umumuna dahil olur;"], [1712.5, "Kur'an da bir şeydir, öyleyse mahlûktur."], [1716.0, "Ama Allah'ın kelâmının, ayetin başındaki \"Allah\" sözüne zaten dahil olduğunu unuttu."]]}, {"reader": false, "ar": [[1726.0, "فإنّ «الله» لا يصدق على ذاته وحده،"], [1730.6, "ولا يصدق على صفاته وحدها،"], [1733.9, "وإنما «الله» هو الذاتُ بصفاتها،"], [1741.0, "وكلامه صفةٌ من صفاته."], [1743.7, "فإذا قال: «الله»، فيكون كلامه داخلًا في هذا الاسم العظيم،"], [1753.0, "فإذًا لا يمكن أن يدخل في قوله:"], [1756.5, "<span class=\"ayah\">﴿خَالِقُ كُلِّ شَيْءٍ﴾<\/span>؛ فإنّ الكلام وإن كان شيئًا لكنّه قائمٌ بذات الله عز وجل."], [1768.0, "فلو أنّ المعتزليّ كان يعرف ما تدلّ عليه كلمة «الله» لَما قال بأنّ كلامه مخلوق."], [1776.0, "لماذا؟ لأنّ الله ـ ذاتَه وصفاتِه ـ هو الخالق، وما سواه مخلوق."]], "tr": [[1726.0, "Çünkü \"Allah\" (ismi) yalnızca O'nun zâtına sadık olmaz (zâtını tek başına ifade etmez), yalnızca sıfatlarına da sadık olmaz;"], [1734.6, "\"Allah\", sıfatlarıyla birlikte zâttır. O'nun kelâmı da sıfatlarından bir sıfattır."], [1743.7, "\"Allah\" deyince, O'nun kelâmı bu azametli isme dahil olur;"], [1749.7, "o hâlde <span class=\"ayah\">﴿her şeyin yaratıcısıdır﴾<\/span> sözüne dahil olması mümkün değildir."], [1758.0, "Çünkü kelâm bir şey olsa da Allah Azze ve Celle'nin zâtıyla kâimdir."], [1768.0, "Mu'tezilî, \"Allah\" kelimesinin neye delâlet ettiğini bilseydi, O'nun kelâmının mahlûk olduğunu söylemezdi."], [1776.0, "Neden? Çünkü zâtı ve sıfatlarıyla Allah yaratıcıdır;"], [1779.5, "O'nun dışındaki her şey mahlûktur."]]}, {"reader": false, "ar": [[1783.0, "ثم نقول لك ـ أيها المعتزليّ ـ:"], [1786.0, "وماذا تقول في أفعال العباد؟"], [1789.4, "أَوَتدخل في «كلّ شيء» المذكورة في الآية؟"], [1797.0, "فإنه سيرفع رأسه غضبانَ علينا ويقول:"], [1800.7, "لا، بل العبد هو الذي يخلق فعله."]], "tr": [[1783.0, "Sonra sana deriz ki, ey Mu'tezilî:"], [1786.0, "Kulların fiilleri hakkında ne dersin?"], [1789.4, "Onlar ayette zikredilen \"her şey\"e dahil midir?"], [1797.0, "(Mu'tezilî) bize öfkeyle başını kaldırıp diyecek ki:"], [1801.3, "Hayır, bilakis fiilini yaratan kulun kendisidir."]]}]}, {"ts": "30:05", "title": "2. Külliye (devam): \"Kulların fiilleri\" ve \"ca'l\" (جعل) örneği", "paras": [{"reader": false, "ar": [[1805.0, "ونقول: أَوَليست أفعالُ العباد شيئًا؟"], [1808.6, "فسيقول: بلى. فنقول: ومن الذي أخرجها من عموم قوله:"], [1813.8, "<span class=\"ayah\">﴿اللَّهُ خَالِقُ كُلِّ شَيْءٍ﴾<\/span>؟"], [1816.0, "أدخلتَ في «كلّ شيء» ما هو خارجٌ منه بالإجماع،"], [1820.0, "وأخرجتَ منها ما هو داخلٌ فيه بالإجماع،"], [1823.0, "ممّا يدلّ على أنّ الدليل عليه لا له. وهكذا كلُّ مبطل."]], "tr": [[1805.0, "Deriz ki: Kulların fiilleri bir şey değil midir?"], [1810.5, "\"Evet\" diyecek. Deriz ki: Peki onları <span class=\"ayah\">﴿Allah her şeyin yaratıcısıdır﴾<\/span> sözünün umumundan kim çıkardı?"], [1816.0, "İcmâ ile ondan hariç olanı (Allah'ın kelâmını) \"her şey\"e soktun, icmâ ile ona dahil olanı (kulların fiillerini) ondan çıkardın."], [1823.0, "Bu da delilin onun lehine değil aleyhine olduğunu gösterir. Her bâtıl ehli böyledir."]]}, {"reader": false, "ar": [[1833.0, "ومنها أيضًا ـ وأنا أطلتُ عليكم ـ ومنها أيضًا:"], [1840.0, "استدلّ المعتزليّ على أنّ القرآن مخلوقٌ بقول الله عز وجل:"], [1847.0, "<span class=\"ayah\">﴿إِنَّا جَعَلْنَاهُ قُرْآنًا عَرَبِيًّا﴾<\/span> <span class=\"ref\">[الزخرف: ٣]<\/span>،"], [1850.0, "ولا يفهم المعتزليّ من «جعل» إلا «خلق»."], [1855.0, "فيأتيه السنّيّ ويقول: إذن الكفار هم الذين خلقوا الملائكة في قوله:"], [1864.4, "<span class=\"ayah\">﴿وَجَعَلُوا الْمَلَائِكَةَ الَّذِينَ هُمْ عِبَادُ الرَّحْمَٰنِ إِنَاثًا﴾<\/span> <span class=\"ref\">[الزخرف: ١٩]<\/span>؟"], [1869.8, "أَوَتفهم ـ أيها المعتزليّ ـ من «جعل» هنا:"], [1873.1, "أي خلق؟ أنتم معي ولّا يا جماعة؟ الجواب: لا."]], "tr": [[1833.0, "Bunlardan biri de —sizi uzun tuttum— bunlardan biri de şudur:"], [1847.0, "Mu'tezilî, Kur'an'ın mahlûk olduğuna Allah Azze ve Celle'nin şu sözüyle istidlal etti:"], [1864.4, "<span class=\"ayah\">﴿Biz onu Arapça bir Kur'an kıldık﴾<\/span> [Zuhruf 3]. Mu'tezilî \"ca'l\"den (جعل) yalnızca \"yaratma\"yı anlar. Sünnî ona gelip der ki: O hâlde <span class=\"ayah\">﴿Rahmân'ın kulları olan melekleri dişi kıldılar﴾<\/span> [Zuhruf 19] sözünde melekleri yaratanlar kâfirler mi oldu? Ey Mu'tezilî, buradaki \"ca'l\"den \"yarattı\" manasını mı anlıyorsun? Benimle misiniz, değil misiniz, ey cemaat? Cevap: Hayır."]]}, {"reader": false, "ar": [[1880.0, "ولذلك استدلّ عبدُ العزيز الكِنانيّ رحمه الله في كتابه العظيم «الحَيْدة» على بِشرٍ وغيره بقوله:"], [1889.7, "إنّ «جعل» في اللغة العربية إمّا أن تكون لازمة،"], [1897.0, "فتكون بمعنى «خلق»، كقول الله عز وجل:"], [1901.0, "<span class=\"ayah\">﴿وَجَعَلَ الظُّلُمَاتِ وَالنُّورَ﴾<\/span> <span class=\"ref\">[الأنعام: ١]<\/span>، أي خلق؛"], [1904.0, "لأنّ «جعل» هنا لا تتعدّى إلا إلى مفعولٍ واحد."], [1908.0, "لكن إذا كانت «جعل» تتعدّى إلى مفعولين فهي ـ بإجماع العرب ـ أنها «صيَّر»."], [1918.0, "<span class=\"ayah\">﴿وَجَعَلُوا الْمَلَائِكَةَ﴾<\/span> هذا المفعول الأول،"], [1922.0, "<span class=\"ayah\">﴿الَّذِينَ هُمْ عِبَادُ الرَّحْمَٰنِ إِنَاثًا﴾<\/span> وهذا المفعول الثاني؛"], [1926.7, "فـ«جعل» تعدّت إلى مفعولين،"], [1929.0, "أي: وصيَّروا الملائكة إناثًا."]], "tr": [[1880.0, "Bu yüzden Abdülazîz el-Kinânî —Allah ona rahmet etsin— büyük eseri el-Hayde'de Bişr'e ve başkalarına karşı şu sözüyle delil getirmiştir:"], [1889.7, "Arap dilinde \"ca'l\" ya lâzım (tek mef'ûllü) olur ve \"yarattı\" manasına gelir;"], [1897.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Karanlıkları ve aydınlığı var etti﴾<\/span> [En'âm 1] sözünde olduğu gibi, yani \"yarattı\"."], [1904.0, "Çünkü buradaki \"ca'l\" yalnızca tek bir mef'ûle geçişlidir."], [1908.0, "Ama \"ca'l\" iki mef'ûle geçişli olursa, Arapların icmâıyla \"sayyera\" (bir şeyi bir hâle getirdi) manasındadır."], [1918.0, "<span class=\"ayah\">﴿Melekleri kıldılar﴾<\/span> —bu birinci mef'ûldür— <span class=\"ayah\">﴿Rahmân'ın kulları olan… dişi﴾<\/span> —bu da ikinci mef'ûldür."], [1926.7, "\"Ca'l\" iki mef'ûle geçişli olmuştur;"], [1928.0, "yani \"melekleri dişi hâline getirdiler (dişi saydılar).\""]]}, {"reader": false, "ar": [[1932.0, "وهنا قال: <span class=\"ayah\">﴿إِنَّا جَعَلْنَاهُ قُرْآنًا عَرَبِيًّا﴾<\/span>،"], [1939.0, "فهذا مفعولٌ أول، وهذا مفعولٌ ثانٍ،"], [1944.2, "بمعنى: أنّنا صيّرناه قرآنًا عربيًّا."], [1949.0, "ولذلك عندنا قاعدتان تفسيريّتان في «جعل»،"], [1953.0, "وما أكثر ورودها في القرآن:"], [1956.0, "كلُّ «جعل» لمفعولٍ فـ«خلق»،"], [1962.0, "كلُّ «جعل» لمفعولين فـ«تصيير»."], [1967.0, "فانظر كيف صار الدليل عليهم لا لهم؛"], [1972.0, "بمعنى أنهم لو تأمّلوا في قوله:"], [1976.5, "<span class=\"ayah\">﴿جَعَلْنَاهُ﴾<\/span>، فالضمير هذا المفعول الأول،"], [1980.8, "و<span class=\"ayah\">﴿قُرْآنًا﴾<\/span> هذا المفعول الثاني؛"], [1985.0, "فإذًا «جعل» تعدّت إلى مفعولين،"], [1987.5, "وبإجماع أئمة اللغة أنها هنا بمعنى «صيَّر»."]], "tr": [[1932.0, "Burada da <span class=\"ayah\">﴿Biz onu Arapça bir Kur'an kıldık﴾<\/span> buyurdu:"], [1942.0, "Bu birinci mef'ûl, bu da ikinci mef'ûldür;"], [1949.0, "yani \"Biz onu Arapça bir Kur'an hâline getirdik.\" Bu yüzden \"ca'l\" hakkında —Kur'an'da ne kadar çok geçer!— iki tefsir kaidemiz vardır:"], [1962.0, "Tek mef'ûle geçen her \"ca'l\" \"yaratma\"dır;"], [1967.0, "iki mef'ûle geçen her \"ca'l\" \"tasyîr\"dir (bir hâle getirmektir)."], [1972.0, "Bak, delil nasıl onların lehine değil aleyhine oldu!"], [1976.5, "Yani <span class=\"ayah\">﴿onu kıldık﴾<\/span> sözünü düşünselerdi:"], [1980.5, "Zamir birinci mef'ûldür, <span class=\"ayah\">﴿Kur'an﴾<\/span> ikinci mef'ûldür."], [1985.0, "Demek ki \"ca'l\" iki mef'ûle geçişli olmuştur ve dil imamlarının icmâıyla burada \"sayyera\" manasındadır."]]}]}, {"ts": "33:12", "title": "2. Külliye (devam): \"Len terânî\" ayeti ru'yeti isbat eder", "paras": [{"reader": false, "ar": [[1992.0, "ومنها أيضًا: يستدلّ المعتزلة على نفي رؤية الله يوم القيامة بقوله:"], [1999.9, "<span class=\"ayah\">﴿لَن تَرَانِي﴾<\/span>، في قول الله عز وجل:"], [2004.0, "<span class=\"ayah\">﴿وَلَمَّا جَاءَ مُوسَىٰ لِمِيقَاتِنَا وَكَلَّمَهُ رَبُّهُ قَالَ رَبِّ أَرِنِي أَنظُرْ إِلَيْكَ ۚ قَالَ لَن تَرَانِي﴾<\/span> <span class=\"ref\">[الأعراف: ١٤٣]<\/span>."], [2015.0, "فيقول المعتزلة: هذه الآية فيها بَرْدُ اليقين في نفي رؤية الله عز وجل يوم القيامة."], [2024.0, "قال أهل السنة: خِبتُم وخسرتم،"], [2026.0, "فلو تأمّلتم الآية حقَّ تأمّلها لوجدتم أنّ فيها دليلًا على إثبات الرؤية، وذلك من وجوه:"]], "tr": [[1992.0, "Bunlardan biri de şudur: Mu'tezile, kıyamet günü Allah'ın ru'yetini nefyetmeye <span class=\"ayah\">﴿Beni asla göremezsin﴾<\/span> sözüyle istidlal eder;"], [1999.9, "Allah Azze ve Celle'nin şu sözünde:"], [2002.8, "<span class=\"ayah\">﴿Mûsâ tayin ettiğimiz vakitte gelip Rabbi onunla konuşunca: \"Rabbim! Bana (kendini) göster, sana bakayım\" dedi. (Allah) buyurdu ki: \"Beni asla göremezsin\"﴾<\/span> [A'râf 143]."], [2015.0, "Mu'tezile der ki: Bu ayette, kıyamet günü Allah Azze ve Celle'nin ru'yetinin nefyi konusunda kesin bilginin serinliği (tam tatmin) vardır."], [2025.2, "Ehl-i Sünnet dedi ki: Hüsrana uğradınız ve kaybettiniz!"], [2028.3, "Ayeti gereği gibi düşünseydiniz, onda ru'yetin isbatına delil bulunduğunu görürdünüz. Bu, birkaç vecihtendir:"]]}, {"reader": false, "ar": [[2034.0, "الأول: أنّ موسى سألها في الدنيا،"], [2039.0, "ويبعُد على كليم الله أن يعلم أنها ممتنعة ثم يسأل ربَّه شيئًا ممتنعًا؛"], [2047.0, "كما سأل نوحٌ عليه الصلاة والسلام نجاةَ ابنه،"], [2054.2, "فقال: <span class=\"ayah\">﴿إِنَّ ابْنِي مِنْ أَهْلِي وَإِنَّ وَعْدَكَ الْحَقُّ وَأَنتَ أَحْكَمُ الْحَاكِمِينَ﴾<\/span> <span class=\"ref\">[هود: ٤٥]<\/span> <span class=\"note\">(Şeyh «وأنت أرحم الراحمين» diye okuyor; mushaf lafzı yazıldı.)<\/span>،"], [2060.0, "فجاءه العتابُ من الله:"], [2062.0, "<span class=\"ayah\">﴿إِنَّهُ لَيْسَ مِنْ أَهْلِكَ ۖ إِنَّهُ عَمَلٌ غَيْرُ صَالِحٍ﴾<\/span> <span class=\"ref\">[هود: ٤٦]<\/span>."], [2066.0, "فلو أنّ ما سأله موسى ليس ممّا يصلح في حقّ الله عز وجل،"], [2072.0, "لَما كان الجواب في قوله: <span class=\"ayah\">﴿لَن تَرَانِي﴾<\/span>."]], "tr": [[2034.0, "Birincisi: Mûsâ onu (ru'yeti) dünyada istedi."], [2037.1, "Kelîmullah'ın (Allah'ın kendisiyle konuştuğu peygamberin) onun imkânsız olduğunu bilip sonra Rabbinden imkânsız bir şey istemesi uzak bir ihtimaldir."], [2047.0, "Nitekim Nûh aleyhisselâm oğlunun kurtulmasını istedi ve <span class=\"ayah\">﴿Şüphesiz oğlum benim ailemdendir. Senin vaadin elbette haktır ve sen hâkimlerin en hâkimisin﴾<\/span> [Hûd 45] dedi;"], [2059.7, "bunun üzerine Allah'tan azar geldi:"], [2062.0, "<span class=\"ayah\">﴿O senin ailenden değildir; çünkü o, salih olmayan bir ameldir (sahibidir)﴾<\/span> [Hûd 46]."], [2067.4, "Mûsâ'nın istediği şey Allah Azze ve Celle hakkında uygun olmayan bir şey olsaydı, cevap <span class=\"ayah\">﴿Beni asla göremezsin﴾<\/span> sözüyle olmazdı."]]}, {"reader": false, "ar": [[2075.0, "وأيضًا: الله عز وجل قال:"], [2078.7, "<span class=\"ayah\">﴿لَن تَرَانِي﴾<\/span>، ولم يقل:"], [2083.6, "إنّي لا أُرى، وفرقانٌ بين التعبيرين."], [2089.0, "بدليل الوجه الثالث: أنه علّل عدمَ رؤيته الآن ليس لأنها ممتنعة،"], [2099.0, "وإنما لعجزك ـ يا موسى ـ عن التحمّل؛"], [2103.2, "فقُواك في الدنيا ضعيفة."], [2106.0, "بدليل: أنني سأتجلّى للجبل،"], [2108.8, "وهو أقوى منك ذاتًا وأصلبُ منك وجودًا،"], [2115.0, "وانظر كيف سيحصل له،"], [2117.9, "وانظر كيف سيكون الجبل."], [2122.0, "<span class=\"ayah\">﴿فَلَمَّا تَجَلَّىٰ رَبُّهُ لِلْجَبَلِ جَعَلَهُ دَكًّا وَخَرَّ مُوسَىٰ صَعِقًا﴾<\/span> <span class=\"ref\">[الأعراف: ١٤٣]<\/span>."], [2128.0, "فإذا كان موسى قد خرّ صعقًا لمّا رأى ما حصل للجبل،"], [2133.0, "فكيف فيما لو رأى الله عز وجل؟"]], "tr": [[2075.0, "Ayrıca Allah Azze ve Celle <span class=\"ayah\">﴿Beni asla göremezsin﴾<\/span> buyurdu;"], [2083.6, "\"Ben görülmem\" buyurmadı. İki ifade arasında fark vardır."], [2091.1, "Bunun delili üçüncü vecihtir: (Allah) şu anda görülmemesinin sebebini, onun imkânsız olmasıyla değil, \"Ey Mûsâ, senin buna dayanmaktan aciz olmanla\" açıkladı;"], [2106.0, "dünyadaki güçlerin zayıftır. Bunun delili de şudur:"], [2110.1, "\"Zâtı bakımından senden daha güçlü, varlığı bakımından senden daha sağlam olan dağa tecellî edeceğim;"], [2122.0, "ona ne olacağına bak, dağın nasıl olacağına bak.\" <span class=\"ayah\">﴿Rabbi dağa tecellî edince onu darmadağın etti ve Mûsâ baygın düştü﴾<\/span> [A'râf 143]."], [2131.2, "Mûsâ dağa olanı görünce baygın düştüyse, Allah Azze ve Celle'yi görseydi nasıl olurdu?"]]}, {"reader": false, "ar": [[2138.0, "وأضف إلى هذا: أنّ الذي تجلّى للجبل تجلّيًا يليق بجلاله وعظمته،"], [2145.4, "وهو جماد، أفلا يتجلّى لأنبيائه ورسله،"], [2150.8, "وعباده المؤمنين، وحزبه المفلحين،"], [2153.6, "وأوليائه الصالحين، من النبيين والصدّيقين والشهداء والصالحين يوم القيامة؟"], [2163.0, "الجواب: ليس هذا ممتنعًا."], [2166.0, "فإذا تجلّى ربُّنا للجبل وهو جمادٌ غير مكلّف،"], [2171.0, "فكيف لا يتجلّى لعباد الله المؤمنين؟"]], "tr": [[2138.0, "Buna şunu da ekle: Cansız bir varlık olan dağa, celaline ve azametine yakışır bir tecellîyle tecellî eden (Allah), kıyamet günü peygamberlerine, resullerine, mü'min kullarına, felaha eren hizbine, salih velilerine, yani nebilerden, sıddîklardan, şehitlerden ve salihlerden olanlara tecellî etmez mi?"], [2163.0, "Cevap: Bu imkânsız değildir. Rabbimiz mükellef olmayan cansız bir varlık olan dağa tecellî ettiyse, Allah'ın mü'min kullarına nasıl tecellî etmez?"]]}, {"reader": false, "ar": [[2177.0, "ولذلك قد عاقب الله الكفار يوم القيامة بقوله:"], [2181.0, "<span class=\"ayah\">﴿كَلَّا إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍ لَّمَحْجُوبُونَ﴾<\/span> <span class=\"ref\">[المطففين: ١٥]<\/span>،"], [2185.0, "أي لا يرونه. فإذا كان المؤمنون لا يرونه أيضًا يوم القيامة،"], [2189.0, "فما الفرقان بيننا وبينهم؟"], [2192.0, "والخلاصة من ذلك: أنّ كلّ دليلٍ من الوحي يستدلّ به المبتدع على شيءٍ من باطله ففيه ـ مع التأمّل ـ ما ينقض قوله،"], [2207.0, "ولكنّ هذا التأمّل فضلٌ وتوفيقٌ من الله يؤتيه من يشاء."]], "tr": [[2177.0, "Bu yüzden Allah, kıyamet günü kâfirleri şu sözüyle cezalandırmıştır:"], [2181.0, "<span class=\"ayah\">﴿Hayır! Şüphesiz onlar o gün Rablerinden perdelenmiş olacaklardır﴾<\/span> [Mutaffifîn 15];"], [2186.0, "yani O'nu görmeyeceklerdir. Mü'minler de kıyamet günü O'nu görmeyecekse, bizimle onlar arasındaki fark nedir?"], [2195.0, "Bunun özeti şudur: Bid'atçının bâtılından bir şeye istidlal ettiği vahiyden her delilde, tefekkür edildiğinde, onun sözünü bozan şey vardır."], [2207.0, "Ama bu tefekkür, Allah'ın dilediğine verdiği bir lütuf ve tevfiktir."]]}]}, {"ts": "36:53", "title": "3. Külliye: Hak ehlini hakka inandıkları için çirkin bir şeyle niteleyen bid'at ehlindendir", "paras": [{"reader": false, "ar": [[2213.0, "ومن الكلّيّات أيضًا: <b>كلُّ من وصف أهلَ الحقّ بقبيحٍ لاعتقادهم الحقَّ فمن أهل البدع.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [2238.0, "وذلك لأنّ خصوم أهل السنة نادرًا ما يذكرونهم باسم أهل السنة أو أهل الحديث أو غير ذلك من الأسماء المرضيّة عند أهل السنة والجماعة،"], [2250.0, "وإنما غالبًا ما يُطلقون عليهم ألقابًا وأسماءً قبيحة،"], [2256.0, "من باب التنفير عنهم وعن الحق الذي يحملونه."]], "tr": [[2213.0, "Külliyelerden biri de şudur: 3."], [2216.0, "külliye: Hak ehlini, hakka inanmaları sebebiyle çirkin bir şeyle niteleyen herkes bid'at ehlindendir. (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [2238.0, "Bunun sebebi şudur: Ehl-i Sünnet'in hasımları onları nadiren Ehl-i Sünnet, Ehl-i Hadis veya Ehl-i Sünnet ve'l-Cemaat'in razı olduğu diğer isimlerle anarlar;"], [2249.5, "çoğunlukla onlara, onlardan ve taşıdıkları haktan insanları nefret ettirmek için çirkin lakaplar ve isimler takarlar."]]}, {"reader": false, "ar": [[2260.0, "فمتى ما رأيتَ أحدًا يصف أهلَ السنة والجماعة بشيءٍ من قبيح الألقاب،"], [2268.1, "وسيّئ الألفاظ والأسماء، بسبب الحقّ الذي يدينون اللهَ عز وجل به،"], [2276.0, "فاعلم أنه قد سلك مسلكًا من مسالك أهل البدع."], [2280.0, "كما قال إمام أهل السنة الإمام أحمد رحمه الله تعالى،"], [2287.0, "قال: «وقد أحدثت أهلُ الأهواء والبدع والخلاف أسماءً شنيعةً قبيحةً يسمّون بها أهلَ السنة، يريدون بذلك الطعنَ عليهم والإزراءَ بهم عند السفهاء والجهّال». انتهى كلامه."]], "tr": [[2260.0, "Ne zaman birinin Ehl-i Sünnet ve'l-Cemaat'i, Allah Azze ve Celle'ye din olarak bağlandıkları hak sebebiyle çirkin lakaplardan, kötü lafız ve isimlerden bir şeyle nitelediğini görürsen, bil ki o, bid'at ehlinin yollarından bir yola girmiştir."], [2280.0, "Nitekim Ehl-i Sünnet'in imamı İmam Ahmed —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2287.7, "\"Hevâ, bid'at ve muhalefet ehli, Ehl-i Sünnet'i kendileriyle adlandırdıkları çirkin ve kötü isimler ihdas ettiler;"], [2296.2, "bununla onları beyinsizlerin ve cahillerin nezdinde kötülemek ve küçük düşürmek istiyorlar.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2304.0, "قلت: حتى أصبح من أبرز علامات أهل البدع وأظهر ما يميّزهم هو الوقيعةُ في أهل السنة والأثر،"], [2314.0, "ونبزُهم بالألقاب المنفّرة المستكرَهة،"], [2318.0, "وهذه علامةُ أهل الباطل."], [2321.0, "فأهل الباطل يسمّون إثباتَ الصفات تشبيهًا وتجسيمًا وتركيبًا وتمثيلًا،"], [2336.0, "ويصفون أهلَ الحق بأنهم مشبِّهة،"], [2340.0, "وأنهم مجسِّمة، ويسمّون من أثبت الصفاتِ الذاتيةَ لله عز وجل بأنه يصف ربَّه بالتركيب،"], [2357.0, "والتركيبُ ممتنعٌ على الله عز وجل."]], "tr": [[2304.0, "Derim ki: Hatta bid'at ehlinin en belirgin alameti ve onları en açık şekilde ayırt eden şey, Ehl-i Sünnet ve'l-Eser'e dil uzatmak ve onları nefret ettirici, iğrenç lakaplarla kötülemek hâline gelmiştir."], [2313.6, "Bu, bâtıl ehlinin alametidir. Bâtıl ehli sıfatların isbatını teşbih, tecsîm, terkip ve temsil diye adlandırır;"], [2321.0, "hak ehlini Müşebbihe ve Mücessime diye niteler."], [2326.7, "Allah Azze ve Celle için zâtî sıfatları isbat edeni, Rabbini terkiple nitelemekle damgalarlar;"], [2350.5, "terkip ise Allah Azze ve Celle hakkında imkânsızdır."]]}, {"reader": false, "ar": [[2361.0, "ويسمّون استواءَ الله عز وجل على عرشه تحيُّزًا،"], [2367.3, "ومحدودًا على محدود، وتجسيمًا."], [2374.0, "ويسمّون علوَّ الذات جهةً،"], [2379.0, "ويسمّون الصفاتِ الاختياريةَ حلولَ حوادث،"], [2385.0, "ويسمّون الوجهَ واليدين أبعاضًا،"], [2390.0, "بل ويسمّون حكمةَ الله في أفعاله الدينية والدنيوية ـ أو الكونية والشرعية ـ أغراضًا لا تليق بجلاله وعظمته."]], "tr": [[2361.0, "Allah Azze ve Celle'nin arşına istivâsını tehayyüz (bir yer kaplama), \"sınırlı bir şeyin sınırlı bir şey üzerinde olması\" ve tecsîm diye adlandırırlar."], [2368.1, "Zâtın uluvvünü cihet diye adlandırırlar;"], [2374.0, "ihtiyârî sıfatları hulûl-i havâdis diye adlandırırlar;"], [2379.8, "yüzü ve iki eli eb'âz (parçalar) diye adlandırırlar."], [2386.7, "Hatta Allah'ın dinî ve dünyevî —ya da kevnî ve şer'î— fiillerindeki hikmetini, O'nun celaline ve azametine yakışmayan \"garazlar\" diye adlandırırlar."]]}]}, {"ts": "40:04", "title": "3. Külliye (devam): Fırkaların Ehl-i Sünnet'e taktığı lakaplar", "paras": [{"reader": false, "ar": [[2404.0, "والجهميةُ تسمّي أهلَ السنة بالنُّقصانية والشُّكّاك،"], [2413.0, "والمعتزلةُ يسمّوننا بالحشوية وبالنابتة وبالمُجبِرة،"], [2421.0, "والقدريةُ كذلك يسمّون أهلَ السنة بالمُجبِرة،"], [2426.0, "والرافضةُ تسمّي أهلَ السنة بالناصبة أو النواصب،"], [2433.0, "أو العامّة، أو الجمهور،"], [2436.0, "أو الحشوية، والخوارجُ كذلك تسمّي أهلَ السنة بالحشوية والنابتة أو النوابت،"], [2444.0, "والأشاعرةُ والماتريدية وعامّةُ المتكلّمين يسمّون أهلَ السنة مشبِّهةً ومجسِّمةً وحشويةً ونوابت."], [2456.0, "وهكذا في كثيرٍ من أوصافهم وتسميتهم لأهل السنة."]], "tr": [[2404.0, "Cehmiyye, Ehl-i Sünnet'i \"Nuksâniyye\" (imanın eksildiğini söyleyenler) ve \"Şükkâk\" (şüpheciler) diye adlandırır."], [2417.0, "Mu'tezile bizi \"Haşviyye\", \"Nâbite\" ve \"Mücbire\" diye adlandırır."], [2424.1, "Kaderiyye de Ehl-i Sünnet'i \"Mücbire\" diye adlandırır."], [2429.2, "Râfıza, Ehl-i Sünnet'i \"Nâsıbe\" veya \"Nevâsıb\", \"Âmme\", \"Cumhur\" ya da \"Haşviyye\" diye adlandırır."], [2437.8, "Hâricîler de Ehl-i Sünnet'i \"Haşviyye\" ve \"Nâbite\" veya \"Nevâbit\" diye adlandırır."], [2446.0, "Eş'arîler, Mâtürîdîler ve kelamcıların geneli Ehl-i Sünnet'i Müşebbihe, Mücessime, Haşviyye ve Nevâbit diye adlandırır."], [2456.7, "Onların Ehl-i Sünnet'i nitelemelerinin ve adlandırmalarının çoğu böyledir."]]}, {"reader": false, "ar": [[2464.0, "وكلُّ ذلك إنما هو من باب إظهار العداوة لنا،"], [2469.0, "ومن باب التنفير عن الحق الذي نحمله في قلوبنا."], [2474.0, "ولو تأمّلتَ هذه الأسماء وتلك الصفات القبيحة لَما وجدتَها صادقةً إلا عليهم،"], [2481.0, "ولكن كما قالوا: «رمتني بدائها وانسلّت»."], [2487.0, "فأهل السنة ليس لهم إلا اسمٌ واحد،"], [2491.0, "وهذه الأوصاف القبيحة لا تنطبق إلا على أهل البدع."]], "tr": [[2464.0, "Bütün bunlar ancak bize düşmanlıklarını göstermek ve kalplerimizde taşıdığımız haktan insanları nefret ettirmek içindir."], [2474.0, "Bu isimleri ve o çirkin vasıfları düşünseydin, onları ancak kendileri hakkında doğru bulurdun."], [2483.3, "Fakat dedikleri gibi: \"Kendi derdini bana attı ve sıvışıp gitti.\" Ehl-i Sünnet'in yalnızca tek bir ismi vardır;"], [2491.9, "bu çirkin vasıflar ise ancak bid'at ehline uyar."]]}, {"reader": false, "ar": [[2495.1, "فإن قيل لك: وهل لا يزال أهلُ الباطل يخترعون هذه الصفات لأهل السنة؟"], [2507.0, "الجواب: نعم، فلا يزال أهلُ الباطل يصفون أهلَ الحق بمثل هذه الصفات،"], [2514.0, "ويزيدون عليها ما تسمعونه بين الفَينة والأخرى من قولهم:"], [2521.4, "الوهّابية، الظلامية، الأصولية، المتطرّفة،"], [2524.1, "أو أهل التطرّف، وغير ذلك."], [2534.0, "والسببُ الرئيس لطعن هؤلاء في أهل السنة إنما هو لأنهم أهلُ الحق."]], "tr": [[2495.1, "Sana \"Bâtıl ehli Ehl-i Sünnet için bu vasıfları hâlâ uydurmaya devam ediyor mu?\" denirse, cevap:"], [2507.0, "Evet. Bâtıl ehli hak ehlini bu gibi vasıflarla nitelemeye devam ediyor ve bunlara, zaman zaman işittiğiniz \"Vehhâbîler\", \"karanlıkçılar\", \"köktenciler\", \"aşırılar\" veya \"aşırılık ehli\" ve benzeri sözlerini ekliyorlar."], [2534.0, "Bunların Ehl-i Sünnet'e dil uzatmalarının temel sebebi, onların hak ehli olmalarıdır."]]}, {"reader": false, "ar": [[2541.0, "وهذا قد ورثوه عمّن قبلهم؛"], [2543.0, "فإنّ الله حكى لنا في كتابه أنّ كثيرًا من الأمم تصف أنبياءها بأنهم كهّان،"], [2552.2, "وأنهم كذّابون، وأنهم سحرة،"], [2554.7, "و«إنما يعلّمهم بشر»،"], [2557.1, "إلى غير ذلك. والكلّيّة إن شاء الله واضحة،"], [2563.0, "ولعلنا نقف عند هذا إن شاء الله."], [2565.8, "والله أعلم، وصلى الله وسلم على نبينا محمد."]], "tr": [[2541.0, "Bunu kendilerinden öncekilerden miras aldılar."], [2543.0, "Çünkü Allah bize Kitabı'nda, birçok ümmetin peygamberlerini kâhinler, yalancılar ve sihirbazlar olarak nitelediğini ve \"Onlara ancak bir beşer öğretiyor\" dediklerini ve benzerlerini anlatmıştır."], [2559.1, "Külliye inşallah açıktır; inşallah burada duralım."], [2563.8, "Allah en iyisini bilir. Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
