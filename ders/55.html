<script>
const D={"no": 55, "vid": "N1feOmV07mM", "title_ar": "الدرس (٥٥) من شرح كليات العقيدة — من كليات باب المعجزات والكرامات", "title_tr": "Şerhu Külliyyâti'l-Akîde — 55. Ders: Mûcizeler ve Kerametler Babı Külliyeleri (Mûcizenin Tanımı, Mûcizelerin İlâhî Kudretle Bağlantısı, Mütevâtir Mûcizeyi İnkâr, Mûcizeye Akıl Terazisiyle Bakmak, Mûcizeleri Tahrif, Âdeti Aşmak ile Aklî Zaruretler, Mûcizelerin Açıklığı, Her Peygamberin Bir Âyetle Desteklenmesi)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Âdeti aşan ve peygamberlerin elinde gerçekleşen her şey mûcizedir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.3, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.7, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.6, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [12.0, "عندنا اليومَ جُمَلٌ من الكلّيّات في باب المعجزة،"], [16.6, "في باب المعجزات والكرامات،"], [18.9, "في باب المعجزات والكرامات،"], [21.2, "وهما من المباحث العقديّة التي حصل فيها كثيرٌ من الخلل عند كثيرٍ من أهل البدع،"], [29.8, "بسبب أنهم لم يأخذوها على منهج أهل السنّة والجماعة."], [35.0, "فما منهجُ أهل السنّة والجماعة في التعامل مع هذين البابين:"], [39.0, "باب المعجزات وباب الكرامات؟"], [41.0, "أقول: ذلك ملخَّصٌ في جُمَلٍ من الكلّيّات،"], [44.0, "نأخذ طرفًا منها في الدرس هذا،"], [46.1, "والدرس اللي بعده، واللي بعده إن شاء الله."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.3, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [14.3, "Bugün elimizde mûcize babında, mûcizeler ve kerametler babında, mûcizeler ve kerametler babında birçok külliye var."], [23.0, "Bunlar, bid'at ehlinden pek çoğunda çok fazla bozukluk meydana gelen akîde konularındandır;"], [29.3, "çünkü onları Ehl-i Sünnet ve'l-Cemaat'in metodu üzerine almadılar."], [33.9, "Peki Ehl-i Sünnet ve'l-Cemaat'in bu iki babla, yani mûcizeler babı ve kerametler babıyla muamelesindeki metodu nedir?"], [40.5, "Derim ki: Bu, birtakım külliyelerde özetlenmiştir."], [43.1, "Allah'ın izniyle onlardan bir kısmını bu derste, ondan sonraki derste ve onun da sonrakinde ele alacağız."]]}, {"reader": false, "ar": [[49.0, "الكلّيّة الأولى: <b>كلُّ أمرٍ خارقٍ للعادة يُجريه الله تعالى على أيدي الأنبياء والمرسلين تأييدًا لهم وتحدّيًا لأقوامهم فمعجزة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[49.0, "1. külliye: <b>1. külliye: Allah Teâlâ'nın, peygamberleri ve resulleri desteklemek ve kavimlerine meydan okumak için onların elinde gerçekleştirdiği, âdeti aşan her iş mûcizedir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[89.0, "أقول وبالله التوفيق: والأصحُّ أن نقول في الكلّيّة:"], [99.5, "«فبرهانٌ وآيةٌ على صدق نبوّتهم»."], [104.0, "والتعبيرُ عن معجزات الأنبياء بأنها الآياتُ والبراهينُ والسلطانُ أولى من التعبير عنها بقولنا:"], [114.5, "«معجزة»؛ وذلك لأنّ المتقرِّر في القواعد أنّ التعبير عن المعاني الشرعيّة بألفاظ النصوص أولى."], [124.0, "وقد وصفها القرآنُ بأنها آيةٌ أو آيات،"], [130.0, "وبرهانٌ وسلطان، ولا جرمَ أنّ وصفَ الشيء بما وصفه الشارعُ به أولى."], [144.0, "فلو أننا غيّرنا كلمةَ «المعجزة» في الكلّيّة إلى قولنا:"], [149.9, "«فبرهانٌ أو آيةٌ على صدق نبوّتهم» لكان أولى."]], "tr": [[89.0, "Tevfik Allah'tandır, derim ki: Külliyede \"(o) peygamberliklerinin doğruluğuna bir burhan ve âyettir\" dememiz daha doğrudur."], [104.7, "Peygamberlerin mûcizelerini âyetler, burhanlar ve sultan diye ifade etmek, onları \"mûcize\" sözümüzle ifade etmekten daha evlâdır."], [116.4, "Çünkü kaidelerde sabit olan şudur:"], [119.7, "Şer'î manaları nasların lafızlarıyla ifade etmek daha evlâdır."], [125.5, "Kur'an onları âyet veya âyetler, burhan ve sultan diye nitelemiştir."], [137.4, "Şüphesiz bir şeyi Şâri'in onu nitelediği şeyle nitelemek daha evlâdır."], [145.3, "Külliyedeki \"mûcize\" kelimesini \"(o) peygamberliklerinin doğruluğuna bir burhan veya âyettir\" sözümüzle değiştirseydik daha evlâ olurdu."]]}, {"reader": false, "ar": [[156.0, "وقد أجمع علماءُ أهل السنّة والجماعة على الإيمان بكلّ المعجزات التي ثبتت عن نبيٍّ من الأنبياء أو رسولٍ من الرسل بالدليل الصحيح،"], [168.0, "وجعلوا ذلك من جملة عقائدهم،"], [170.4, "ولم يخالف في ذلك إلا أهلُ البدع من المعتزلة ومن نحا منحاهم؛"], [176.0, "فإنّ لهم تشكيكًا كبيرًا في مسألة المعجزات،"], [180.0, "لأنّ مذهبهم مبنيٌّ على ما تُقرّره العقول،"], [184.8, "لا ما تقتضيه النقول."], [188.0, "وأنتم تعرفون أنّ أمرَ المعجزات والكرامات لا مدخلَ للعقول فيه،"], [194.0, "وإنما هو أمرٌ نقليٌّ محض."]], "tr": [[156.0, "Ehl-i Sünnet ve'l-Cemaat âlimleri, peygamberlerden bir peygamberden veya resullerden bir resulden sahih delille sabit olan bütün mûcizelere iman etmek üzerinde icmâ etmiş ve bunu akîdelerinin bir parçası saymışlardır."], [169.9, "Bu konuda Mu'tezile'den ve onların yolunu tutanlardan oluşan bid'at ehlinden başkası muhalefet etmemiştir."], [176.0, "Onların mûcizeler meselesinde büyük bir şüphe uyandırmaları vardır;"], [180.7, "çünkü mezhepleri nakillerin gerektirdiği şey üzerine değil, akılların kararlaştırdığı şey üzerine kuruludur."], [188.6, "Bilirsiniz ki mûcizeler ve kerametler meselesinde akılların payı yoktur;"], [194.0, "o, tamamen naklî bir meseledir."]]}, {"reader": false, "ar": [[197.0, "وقد حكى إجماعَ أهل السنّة والجماعة على الإيمان بمعجزات الأنبياء الثابتة في الكتاب والسنّة جمعٌ من أهل العلم رحمهم الله تعالى."], [209.0, "وقد دلّ على وقوعها أو جوازها دليلُ العقل ودليلُ الشرع."], [219.0, "فأمّا الدليلُ العقليّ المجوِّز للكرامات <span class=\"note\">(كذا قال، والسياق في المعجزات)<\/span>:"], [224.0, "فلا جرمَ أننا كمؤمنين نؤمن إيمانًا جازمًا بأنّ الله عز وجل على كلّ شيءٍ قدير،"], [230.0, "وأنه لا يُعجزه شيءٌ في السماوات ولا في الأرض،"], [233.0, "وأنّ أمرَه الكافُ والنون،"], [235.5, "فإذا قال للشيء: كن، فإنه يكون مباشرةً."]], "tr": [[197.0, "Ehl-i Sünnet ve'l-Cemaat'in Kitap ve Sünnet'te sabit olan peygamber mûcizelerine iman etme konusundaki icmâını ilim ehlinden —Allah onlara rahmet etsin— bir topluluk nakletmiştir."], [207.8, "Onların vukuuna veya caiz olduğuna akıl delili de şer' delili de delalet etmiştir."], [214.6, "Kerametleri <span class=\"note\">(böyle söylüyor; bağlam mûcizelerdir)<\/span> caiz gösteren aklî delile gelince:"], [224.4, "Şüphesiz biz mü'minler olarak Allah Azze ve Celle'nin her şeye kadir olduğuna, göklerde ve yerde hiçbir şeyin O'nu âciz bırakamayacağına ve O'nun emrinin kâf ve nûn (yani \"kün\") olduğuna, bir şeye \"Ol!\" dediğinde onun hemen oluverdiğine kesin bir imanla iman ederiz."]]}, {"reader": false, "ar": [[240.0, "والآياتُ التي تُثبت أنّ الله عز وجل على كلّ شيءٍ قدير كثيرةٌ جدًّا،"], [247.0, "كقول الله عز وجل:"], [248.7, "<span class=\"ayah\">﴿وَمَا كَانَ اللَّهُ لِيُعْجِزَهُ مِن شَيْءٍ فِي السَّمَاوَاتِ وَلَا فِي الْأَرْضِ إِنَّهُ كَانَ عَلِيمًا قَدِيرًا﴾<\/span> <span class=\"ref\">[فاطر: ٤٤]<\/span>."], [255.0, "وفي آياتٍ متعدّدة يقول الله عز وجل:"], [259.3, "<span class=\"ayah\">﴿إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ﴾<\/span>."], [263.0, "وقال الله عز وجل:"], [264.6, "<span class=\"ayah\">﴿وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ مُّقْتَدِرًا﴾<\/span> <span class=\"ref\">[الكهف: ٤٥]<\/span>."], [267.0, "وهذه الآياتُ تدلّ على هذه الكلّيّة؛"], [273.0, "فما من شيءٍ يُطلَق عليه «شيءٌ» إلا وهو داخلٌ تحت مقدور الله عز وجل،"], [279.0, "ومن جملتها تلك المعجزات؛"], [282.0, "فإنّ الله عز وجل قادرٌ على إيجادها،"], [286.0, "وقادرٌ على خلقها، وقادرٌ على إظهارها للناس."], [290.0, "فليس كونُها موصوفةً بأنها معجزةٌ باعتبار قدرة المخلوق تكونُ معجزةً باعتبار قدرة الخالق."]], "tr": [[240.0, "Allah Azze ve Celle'nin her şeye kadir olduğunu isbat eden ayetler pek çoktur."], [245.9, "Allah Azze ve Celle'nin şu sözü gibi:"], [248.7, "<span class=\"ayah\">﴿Göklerde ve yerde hiçbir şey Allah'ı âciz bırakamaz. Şüphesiz O, hakkıyla bilendir, her şeye gücü yetendir﴾<\/span> [Fâtır 44]."], [256.2, "Birçok ayette Allah Azze ve Celle şöyle buyurur:"], [260.5, "<span class=\"ayah\">﴿Şüphesiz Allah her şeye kadirdir﴾<\/span>."], [263.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [265.4, "<span class=\"ayah\">﴿Allah her şeye gücü yetendir﴾<\/span> [Kehf 45]."], [268.5, "Bu ayetler bu külliyeye delalet eder."], [273.4, "\"Şey\" denebilecek hiçbir şey yoktur ki Allah Azze ve Celle'nin kudreti altına girmesin;"], [278.6, "o mûcizeler de bunların arasındadır."], [282.0, "Çünkü Allah Azze ve Celle onları var etmeye, yaratmaya ve insanlara göstermeye kadirdir."], [288.3, "Onların yaratılmışın kudretine göre \"mûcize\" (âciz bırakan) diye nitelenmesi, Yaratıcı'nın kudretine göre de mûcize oldukları anlamına gelmez."]]}]}, {"ts": "05:00", "title": "1. Külliye (devam): Aklî delilin ikinci yönü ve mûcizelerin şer'î vukuu", "paras": [{"reader": false, "ar": [[300.0, "وهنا وجهٌ ثانٍ أيضًا من أوجه الدليل العقليّ،"], [306.3, "وهو أنّ المتقرِّر في القواعد أنّ الذي يقدر على الشيء العظيم القدرةَ الكاملة قادرٌ على ما دونه بالقدرة الكاملة."], [316.0, "فمَن الذي خلق السماوات على اتّساع أرجائها؟"], [320.1, "إنما هو الله عز وجل."], [323.0, "ومَن الذي خلق هذه الأفلاكَ والأبراجَ والكواكبَ العظيمةَ الهائلة؟"], [327.5, "إنما هو الله عز وجل."], [330.0, "ومَن الذي خلق هذه الأرضَ بما عليها من الجبال والأشجار والبحار والمحيطات والإنس والجنّ وغيرها من أصناف المخلوقات؟"], [339.0, "إنما هو الله تبارك وتعالى."], [341.0, "فهذا شيءٌ عظيمٌ جدًّا،"], [343.8, "لا تقف المعجزةُ بجانبه موقفًا عظيمًا."], [352.0, "فإذا كان الله قادرًا القدرةَ الكاملة على إيجاد هذه الأشياء العظيمة،"], [357.0, "فلَأَن يقدر على إجراء معجزةٍ أو آيةٍ أو برهانٍ على يد نبيٍّ أو رسولٍ من باب أولى."]], "tr": [[300.0, "Burada aklî delilin yönlerinden ikinci bir yön daha vardır:"], [307.5, "Kaidelerde sabit olan şudur ki büyük bir şeye tam bir kudretle gücü yeten, ondan aşağısına da tam bir kudretle gücü yeter."], [317.8, "Gökleri, bütün genişliğiyle kim yarattı?"], [320.7, "Ancak Allah Azze ve Celle."], [323.5, "Bu felekleri, burçları ve büyük, heybetli yıldızları kim yarattı?"], [328.0, "Ancak Allah Azze ve Celle."], [330.5, "Bu yeryüzünü üzerindeki dağlar, ağaçlar, denizler, okyanuslar, insanlar, cinler ve diğer yaratık türleriyle birlikte kim yarattı?"], [338.5, "Ancak Allah Tebâreke ve Teâlâ."], [340.6, "İşte bu çok büyük bir şeydir;"], [344.5, "mûcize onun yanında büyük bir yer tutmaz."], [352.9, "Allah bu büyük şeyleri var etmeye tam bir kudretle kadir olduğuna göre, bir peygamberin veya resulün elinde bir mûcize, âyet veya burhan gerçekleştirmeye evleviyetle kadirdir."]]}, {"reader": false, "ar": [[364.0, "ولذلك يقول الله عز وجل:"], [366.5, "<span class=\"ayah\">﴿وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ قَالَ مَن يُحْيِي الْعِظَامَ وَهِيَ رَمِيمٌ قُلْ يُحْيِيهَا الَّذِي أَنشَأَهَا أَوَّلَ مَرَّةٍ﴾<\/span> <span class=\"ref\">[يس: ٧٨–٧٩]<\/span>؛"], [375.0, "فالذي قدر على إنشائها أوّلَ مرّةٍ بلا عجزٍ قادرٌ على أن يُعيدها من باب أولى بلا عجز."], [383.0, "وكما قال الله عز وجل:"], [385.5, "<span class=\"ayah\">﴿وَهُوَ الَّذِي يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ وَهُوَ﴾<\/span> ـ أي إعادتُه ـ <span class=\"ayah\">﴿أَهْوَنُ عَلَيْهِ﴾<\/span> <span class=\"ref\">[الروم: ٢٧]<\/span>."], [391.0, "فلا ينبغي أن يُنظَر إلى المعجزات بمعزلٍ عن عظيم النظر إلى قدرة الله عز وجل على الأشياء الكبيرة."]], "tr": [[364.0, "Bu yüzden Allah Azze ve Celle şöyle buyurur:"], [367.0, "<span class=\"ayah\">﴿Kendi yaratılışını unutarak bize bir misal getirdi ve dedi ki: \"Çürümüş hâldeki kemikleri kim diriltecek?\" De ki: Onları ilk defa yaratan diriltecek﴾<\/span> [Yâsîn 78–79]."], [376.9, "Onları ilk defa hiçbir acz olmaksızın var etmeye gücü yeten, onları hiçbir acz olmaksızın yeniden yaratmaya evleviyetle kadirdir."], [384.0, "Allah Azze ve Celle'nin şu buyurduğu gibi:"], [386.5, "<span class=\"ayah\">﴿Yaratmayı başlatan, sonra onu tekrarlayacak olan O'dur. Bu﴾<\/span> —yani onu tekrarlaması— <span class=\"ayah\">﴿O'na göre daha kolaydır﴾<\/span> [Rûm 27]."], [393.8, "Öyleyse mûcizelere, Allah Azze ve Celle'nin büyük şeylere olan kudretine derinden bakmaktan ayrı olarak bakılmamalıdır."]]}, {"reader": false, "ar": [[401.0, "فبهذين الوجهين دلّ العقلُ على أنّ المعجزة ليست بالأمر الصعب على الله عز وجل أن يُوجِده."], [411.0, "فالذي جعل النارَ حارّةً في أوّل مرّةٍ قادرٌ على أن يجعلها باردةً في ثاني مرّة،"], [418.0, "والذي خلق القمرَ وجعله معلَّقًا بين السماء والأرض قادرٌ على أن يخسف به،"], [426.5, "ويُذهب نورَه، ويشقَّه إلى نصفين."], [431.0, "كلُّ ذلك لا يُعجزه؛"], [433.2, "فإذا كان هو الذي أوجده هكذا كاملًا فهو قادرٌ على أن يقسمه إلى نصفين."]], "tr": [[401.0, "Bu iki yönle akıl, mûcizenin Allah Azze ve Celle için var etmesi zor bir iş olmadığına delalet etmiştir."], [411.9, "Ateşi ilk seferde sıcak kılan, ikinci seferde onu soğuk kılmaya kadirdir."], [417.1, "Ayı yaratıp gök ile yer arasında asılı kılan, onu tutulmaya uğratmaya, ışığını gidermeye ve onu ikiye yarmaya kadirdir."], [428.5, "Bunların hiçbiri O'nu âciz bırakmaz."], [432.7, "Onu böyle bütün olarak var eden O olduğuna göre, onu ikiye bölmeye de kadirdir."]]}, {"reader": false, "ar": [[441.0, "والذي خلق السُّمَّ وخلق فيه خاصّيّةَ الموت أو الإماتة قادرٌ على أن يسلبها منه متى ما شاء."], [452.0, "والذي خلق الثعبانَ من العدم قادرٌ على خلقه من العصا؛"], [457.0, "فمَن الذي خلق الثعبانَ من العدم؟"], [459.7, "إنما هو الله، فهو قادرٌ على أن يخلقه من العصا."], [464.0, "وهكذا في بقيّة المعجزات."], [468.0, "ومن أنكر شيئًا من هذه المعجزات مستعظِمًا لها فقد أساء الظنَّ بربّه وقدرته،"], [477.2, "واعتقد ربوبيّةَ إلهٍ عاجزٍ عن إيجاد شيءٍ من ذلك الأمر اليسير على عظيم قدرته سبحانه وتعالى."]], "tr": [[441.0, "Zehri yaratan ve ona öldürme özelliği veren, dilediği zaman bu özelliği ondan çekip almaya kadirdir."], [451.1, "Yılanı yoktan yaratan, onu asadan yaratmaya da kadirdir."], [454.0, "Yılanı yoktan kim yarattı? Ancak Allah;"], [457.0, "o hâlde O, onu asadan yaratmaya da kadirdir."], [460.1, "Diğer mûcizelerde de durum böyledir."], [462.3, "Bu mûcizelerden birini büyük görerek inkâr eden kimse Rabbi ve O'nun kudreti hakkında kötü zanda bulunmuş ve —O'nun büyük kudretine göre kolay olan— bu işten bir şeyi var etmekten âciz bir ilâhın rubûbiyyetine inanmış olur. O, münezzeh ve yücedir."]]}, {"reader": false, "ar": [[488.0, "وأمّا بالنسبة لوقوعها الشرعيّ:"], [489.5, "فقد تواترت الأدلّةُ من كتاب الله عز وجل وسنّة رسوله صلى الله عليه وسلم على أنها أمرٌ واقعٌ ما له من دافع،"], [498.3, "ولا يُنكره إلا كافرٌ أو معاندٌ ومكابرٌ وجاحد."], [503.0, "وقد سمّى الله عز وجل هذه المعجزاتِ في القرآن بأسماءٍ متعدّدة؛"], [512.0, "فسمّاها بالآية كما في قوله عز وجل:"], [516.0, "<span class=\"ayah\">﴿وَأَقْسَمُوا بِاللَّهِ جَهْدَ أَيْمَانِهِمْ لَئِن جَاءَتْهُمْ آيَةٌ لَّيُؤْمِنُنَّ بِهَا قُلْ إِنَّمَا الْآيَاتُ عِندَ اللَّهِ وَمَا يُشْعِرُكُمْ أَنَّهَا إِذَا جَاءَتْ لَا يُؤْمِنُونَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٠٩]<\/span>."]], "tr": [[488.0, "Şer'î olarak vukuuna gelince: Allah Azze ve Celle'nin Kitabı'ndan ve Resûlü sallallâhu aleyhi ve sellem'in sünnetinden deliller, onların hiçbir şeyin geri çeviremeyeceği vâki bir iş olduğu hakkında tevâtür derecesine ulaşmıştır."], [496.6, "Onu ancak kâfir veya inatçı, büyüklenen ve inkârcı biri inkâr eder."], [501.8, "Allah Azze ve Celle Kur'an'da bu mûcizeleri birçok isimle adlandırmıştır."], [507.1, "Onları \"âyet\" diye adlandırmıştır; Azze ve Celle'nin şu sözünde olduğu gibi:"], [514.3, "<span class=\"ayah\">﴿Kendilerine bir âyet (mûcize) gelirse ona mutlaka inanacaklarına dair var güçleriyle Allah'a yemin ettiler. De ki: Âyetler ancak Allah katındadır. Ne bilirsiniz, belki de o geldiği zaman inanmayacaklar﴾<\/span> [En'âm 109]."]]}, {"reader": false, "ar": [[528.0, "وقال الله عز وجل على لسان صالحٍ عليه الصلاة والسلام:"], [533.0, "<span class=\"ayah\">﴿هَٰذِهِ نَاقَةُ اللَّهِ لَكُمْ آيَةً﴾<\/span> <span class=\"ref\">[الأعراف: ٧٣]<\/span>."], [535.0, "وفرعونُ يقول لموسى عليه الصلاة والسلام:"], [539.0, "<span class=\"ayah\">﴿قَالَ إِن كُنتَ جِئْتَ بِآيَةٍ فَأْتِ بِهَا إِن كُنتَ مِنَ الصَّادِقِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٠٦]<\/span>."], [544.0, "فإذًا من أسمائها: الآية."]], "tr": [[528.0, "Allah Azze ve Celle, Sâlih aleyhisselâmın dilinden şöyle buyurmuştur:"], [531.5, "<span class=\"ayah\">﴿İşte size bir âyet (mûcize) olarak Allah'ın dişi devesi﴾<\/span> [A'râf 73]."], [535.0, "Firavun da Mûsâ aleyhisselâma şöyle der:"], [538.3, "<span class=\"ayah\">﴿Dedi ki: Eğer bir âyet (mûcize) getirdiysen, doğru söyleyenlerden isen onu ortaya koy﴾<\/span> [A'râf 106]."], [544.0, "Demek ki isimlerinden biri \"âyet\"tir."]]}, {"reader": false, "ar": [[546.0, "ومن أسمائها القرآنيّة أيضًا:"], [549.2, "البيّنة، كما قال موسى عليه الصلاة والسلام لفرعون:"], [555.0, "قال: <span class=\"ayah\">﴿قَدْ جِئْتُكُم بِبَيِّنَةٍ مِّن رَّبِّكُمْ﴾<\/span> <span class=\"ref\">[الأعراف: ١٠٥]<\/span>."], [559.0, "والمرادُ بالبيّنة هذه الآياتُ التي أجراها الله عز وجل على يد نبيّه موسى،"], [565.2, "عليه وعلى نبيّنا الصلاة والسلام."], [568.0, "وقال صالحٌ عليه الصلاة والسلام لقومه:"], [571.8, "<span class=\"ayah\">﴿قَدْ جَاءَتْكُم بَيِّنَةٌ مِّن رَّبِّكُمْ هَٰذِهِ نَاقَةُ اللَّهِ لَكُمْ آيَةً﴾<\/span> <span class=\"ref\">[الأعراف: ٧٣]<\/span>."]], "tr": [[546.0, "Kur'an'daki isimlerinden biri de \"beyyine\"dir."], [549.2, "Nitekim Mûsâ aleyhisselâm Firavun'a şöyle dedi:"], [552.9, "<span class=\"ayah\">﴿Size Rabbinizden apaçık bir delil (beyyine) getirdim﴾<\/span> [A'râf 105]."], [557.7, "Beyyineden maksat, Allah Azze ve Celle'nin peygamberi Mûsâ'nın —ona ve Peygamberimize salât ve selâm olsun— elinde gerçekleştirdiği bu âyetlerdir."], [565.8, "Sâlih aleyhisselâm da kavmine şöyle dedi:"], [568.6, "<span class=\"ayah\">﴿Size Rabbinizden apaçık bir delil (beyyine) geldi. İşte size bir âyet olarak Allah'ın dişi devesi﴾<\/span> [A'râf 73]."]]}, {"reader": false, "ar": [[577.0, "ومن أسمائها في كتاب الله عز وجل:"], [580.0, "البرهان، كما قال الله عز وجل:"], [585.0, "<span class=\"ayah\">﴿يَا أَيُّهَا النَّاسُ قَدْ جَاءَكُم بُرْهَانٌ مِّن رَّبِّكُمْ وَأَنزَلْنَا إِلَيْكُمْ نُورًا مُّبِينًا﴾<\/span> <span class=\"ref\">[النساء: ١٧٤]<\/span>."], [591.0, "وقال سبحانه مخاطبًا نبيَّه موسى بعدما أمره أن يُلقي عصاه <span class=\"ayah\">﴿فَإِذَا هِيَ حَيَّةٌ تَسْعَىٰ﴾<\/span> <span class=\"ref\">[طه: ٢٠]<\/span>،"], [599.0, "وبعد أن أمره أن يُخرج يدَه من جيبه <span class=\"ayah\">﴿فَإِذَا هِيَ بَيْضَاءُ لِلنَّاظِرِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٠٨]<\/span> «من غير سوء» <span class=\"note\">(وهذه اللفظة في طه والقصص)<\/span>،"], [607.0, "قال: <span class=\"ayah\">﴿فَذَانِكَ بُرْهَانَانِ مِن رَّبِّكَ إِلَىٰ فِرْعَوْنَ وَمَلَئِهِ﴾<\/span> <span class=\"ref\">[القصص: ٣٢]<\/span>."]], "tr": [[577.0, "Allah Azze ve Celle'nin Kitabı'ndaki isimlerinden biri de \"burhan\"dır."], [579.1, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [583.2, "<span class=\"ayah\">﴿Ey insanlar! Size Rabbinizden kesin bir delil (burhan) geldi ve size apaçık bir nur indirdik﴾<\/span> [Nisâ 174]."], [589.0, "Münezzeh olan Allah, peygamberi Mûsâ'ya hitaben, ona asasını atmasını emretmesinin ardından <span class=\"ayah\">﴿bir de baktı ki o, koşan bir yılan oluvermiş﴾<\/span> [Tâhâ 20] ve elini koynundan çıkarmasını emretmesinin ardından <span class=\"ayah\">﴿bir de baktılar ki o, bakanlar için bembeyaz olmuş﴾<\/span> [A'râf 108] \"kusursuz olarak\" <span class=\"note\">(bu ifade Tâhâ ve Kasas'tadır)<\/span>, şöyle buyurdu:"], [605.9, "<span class=\"ayah\">﴿İşte bu ikisi, Firavun'a ve onun ileri gelenlerine (gönderilen) Rabbinden iki burhandır﴾<\/span> [Kasas 32]."]]}, {"reader": false, "ar": [[615.0, "ومن أسمائها أيضًا في كتاب الله عز وجل:"], [620.3, "السلطان، كما قال الكفّارُ لأنبيائهم:"], [623.6, "<span class=\"ayah\">﴿قَالُوا إِنْ أَنتُمْ إِلَّا بَشَرٌ مِّثْلُنَا تُرِيدُونَ أَن تَصُدُّونَا عَمَّا كَانَ يَعْبُدُ آبَاؤُنَا فَأْتُونَا بِسُلْطَانٍ مُّبِينٍ﴾<\/span> <span class=\"ref\">[إبراهيم: ١٠]<\/span>،"], [634.0, "أي: بمعجزةٍ ظاهرةٍ بيّنة."], [637.0, "وأجاب الرسلُ عليهم الصلاة والسلام على اقتراح قومهم بقولهم:"], [643.0, "<span class=\"ayah\">﴿وَمَا كَانَ لَنَا أَن نَّأْتِيَكُم بِسُلْطَانٍ إِلَّا بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[إبراهيم: ١١]<\/span>."], [648.0, "وقال الله عز وجل:"], [650.4, "<span class=\"ayah\">﴿ثُمَّ أَرْسَلْنَا مُوسَىٰ وَأَخَاهُ هَارُونَ بِآيَاتِنَا وَسُلْطَانٍ مُّبِينٍ إِلَىٰ فِرْعَوْنَ وَمَلَئِهِ﴾<\/span> <span class=\"ref\">[المؤمنون: ٤٥–٤٦]<\/span>."]], "tr": [[615.0, "Allah Azze ve Celle'nin Kitabı'ndaki isimlerinden biri de \"sultan\"dır."], [619.0, "Nitekim kâfirler peygamberlerine şöyle dediler:"], [621.0, "<span class=\"ayah\">﴿Dediler ki: Siz de ancak bizim gibi bir insansınız. Bizi atalarımızın tapmakta olduğu şeylerden alıkoymak istiyorsunuz. O hâlde bize apaçık bir delil (sultan) getirin﴾<\/span> [İbrâhîm 10], yani açık ve belirgin bir mûcize."], [634.8, "Resuller —onlara salât ve selâm olsun— kavimlerinin bu teklifine şu sözle cevap verdiler:"], [641.0, "<span class=\"ayah\">﴿Allah'ın izni olmadıkça size bir delil (sultan) getirmemiz bizim için mümkün değildir﴾<\/span> [İbrâhîm 11]."], [646.9, "Allah Azze ve Celle şöyle buyurmuştur:"], [649.2, "<span class=\"ayah\">﴿Sonra Mûsâ'yı ve kardeşi Hârûn'u âyetlerimizle ve apaçık bir delille (sultan) Firavun'a ve onun ileri gelenlerine gönderdik﴾<\/span> [Mü'minûn 45–46]."]]}]}, {"ts": "10:58", "title": "1. Külliye (devam): Kur'an'da geçen mûcizeler ve Peygamberimizin mûcizeleri", "paras": [{"reader": false, "ar": [[658.0, "وقد تعدّدت المعجزاتُ تعيينًا في كتاب الله عز وجل بما لا داعيَ لذكره حتى لا أُطيلَ عليكم."], [669.0, "فانقلابُ عصا موسى إلى حيّةٍ تسعى وإلى ثعبانٍ مبين،"], [674.8, "هذا من جملة الآيات والبراهين."], [678.0, "وكذلك انفلاقُ البحر له،"], [680.2, "بل في <span class=\"ayah\">﴿تِسْعَ آيَاتٍ بَيِّنَاتٍ﴾<\/span> <span class=\"ref\">[الإسراء: ١٠١]<\/span> كما عدّها الله عز وجل في قوله:"], [687.0, "<span class=\"ayah\">﴿فَأَرْسَلْنَا عَلَيْهِمُ الطُّوفَانَ وَالْجَرَادَ وَالْقُمَّلَ وَالضَّفَادِعَ وَالدَّمَ آيَاتٍ مُّفَصَّلَاتٍ فَاسْتَكْبَرُوا وَكَانُوا قَوْمًا مُّجْرِمِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٣٣]<\/span>."]], "tr": [[658.0, "Mûcizeler, Allah Azze ve Celle'nin Kitabı'nda tek tek belirtilerek çoğalmıştır;"], [663.0, "sizi yormamak için onları zikretmeye gerek yok."], [666.5, "Mûsâ'nın asasının koşan bir yılana ve apaçık bir ejderhaya dönüşmesi, âyetler ve burhanlar cümlesindendir."], [672.9, "Aynı şekilde denizin onun için yarılması da öyledir;"], [676.7, "hatta <span class=\"ayah\">﴿dokuz apaçık âyet﴾<\/span> [İsrâ 101] içindedir."], [679.7, "Nitekim Allah Azze ve Celle onları şu sözünde saymıştır:"], [683.6, "<span class=\"ayah\">﴿Biz de onlara tufan, çekirge, haşere, kurbağalar ve kanı ayrı ayrı âyetler olarak gönderdik. Yine de büyüklendiler ve suçlu bir kavim oldular﴾<\/span> [A'râf 133]."]]}, {"reader": false, "ar": [[696.0, "ومن أعظم الأنبياء الذين أجرى الله عز وجل على أيديهم المعجزاتِ نبيُّنا صلى الله عليه وسلم."], [706.0, "وأعظمُ معجزةٍ في الوجود على الإطلاق هي كتابُ الله عز وجل،"], [711.0, "الذي <span class=\"ayah\">﴿لَّا يَأْتِيهِ الْبَاطِلُ مِن بَيْنِ يَدَيْهِ وَلَا مِنْ خَلْفِهِ تَنزِيلٌ مِّنْ حَكِيمٍ حَمِيدٍ﴾<\/span> <span class=\"ref\">[فصلت: ٤٢]<\/span>."], [716.0, "فهو معجزٌ بلفظه؛ فقد أعجز به البلغاءَ والفصحاءَ والشعراءَ الذين كانت تحتكم العربُ بقبائلها إلى لغتهم،"], [727.0, "فتحدّاهم الله عز وجل أن يأتوا بمثله،"], [730.1, "أو بعشر سورٍ من مثله،"], [732.2, "أو بسورةٍ من مثله،"], [734.0, "فأعجزهم ذلك، لا لسلب القدرة عنهم،"], [738.0, "وإنما لأنّ لسانهم أصلًا ـ على فصاحته وبلاغته ـ لا يستطيع أن يُجاريَه،"], [746.0, "ولا أن يأتوا بمثله."]], "tr": [[696.0, "Allah Azze ve Celle'nin ellerinde mûcizeler gerçekleştirdiği peygamberlerin en büyüklerinden biri Peygamberimiz sallallâhu aleyhi ve sellem'dir."], [704.4, "Varlıktaki mutlak olarak en büyük mûcize, Allah Azze ve Celle'nin Kitabı'dır;"], [708.3, "o Kitap ki <span class=\"ayah\">﴿Bâtıl ona ne önünden ne de arkasından gelebilir. O, hüküm ve hikmet sahibi, övülmeye lâyık olan Allah tarafından indirilmiştir﴾<\/span> [Fussilet 42]."], [715.5, "O, lafzıyla mûcizedir. Allah onunla, Arapların kabileleriyle birlikte dilleri konusunda hakemliğine başvurdukları beliğleri, fasihleri ve şairleri âciz bıraktı."], [725.6, "Allah Azze ve Celle onlara onun bir benzerini, ya da onun benzeri on sûre, ya da onun benzeri tek bir sûre getirmeleri için meydan okudu."], [735.3, "Bu onları âciz bıraktı; kudretin onlardan alınması sebebiyle değil, bilakis dillerinin aslen —fesahat ve belâgatine rağmen— ona yetişemeyeceği ve onun benzerini getiremeyecekleri için."]]}, {"reader": false, "ar": [[748.0, "وكذلك أيضًا من معجزاته صلى الله عليه وسلم:"], [755.0, "تكثيرُ الطعام بين يديه،"], [761.0, "وكذلك بكاءُ الجذع لمّا ترك الخطبةَ عليه،"], [766.0, "فنزل النبيُّ صلى الله عليه وسلم يُسكّنه ويُهدّئه حتى سكت."], [772.0, "ومنها كذلك إخبارُه بهذه المغيَّبات العظيمة التي لا يشهد مستقبلُ الزمان إلا بصدق نبوّته فيها؛"], [784.0, "فقد أخبرنا بأشياءَ كثيرةٍ من المغيَّبات كتابًا وسنّةً،"], [789.0, "ولا يزال مستقبلُ الزمان يشهد الشهادةَ العظيمةَ اليقينيّةَ بصدق ما أخبرنا به فيه."]], "tr": [[748.0, "Yine onun sallallâhu aleyhi ve sellem mûcizelerinden biri, önünde yemeğin çoğalmasıdır."], [755.0, "Aynı şekilde, üzerinde hutbe okumayı bırakınca hurma kütüğünün ağlamasıdır;"], [763.1, "Peygamber sallallâhu aleyhi ve sellem (minberden) indi, onu yatıştırıp sakinleştirdi, sonunda sustu."], [769.6, "Bunlardan biri de bu büyük gayb haberlerini bildirmesidir;"], [773.3, "gelecek zaman, bu konuda onun peygamberliğinin doğruluğuna şahitlik etmekten başka bir şey yapmaz."], [780.7, "O bize Kitap ve Sünnet'le gayb âleminden pek çok şey haber verdi;"], [788.4, "gelecek zaman, onun bize haber verdiği şeylerin doğruluğuna büyük ve kesin bir şahitlikle şahitlik etmeye devam etmektedir."]]}, {"reader": false, "ar": [[796.0, "وكذلك أيضًا المعجزةُ العظيمة،"], [798.9, "وهي معجزةُ الإسراء والمعراج،"], [802.0, "معجزةُ تلك السفرتين: السفرةِ الأرضيّة من المسجد الحرام إلى المسجد الأقصى،"], [807.0, "والسفرةِ السماويّة إلى السماء السابعة،"], [811.0, "حتى بلغ من السماء مستوًى سمع فيه صريفَ الأقلام وتسبيحَ الملائكة الكَرُوبيّين."], [821.0, "وكذلك أيضًا انشقاقُ القمر في قول الله عز وجل:"], [827.8, "<span class=\"ayah\">﴿اقْتَرَبَتِ السَّاعَةُ وَانشَقَّ الْقَمَرُ﴾<\/span> <span class=\"ref\">[القمر: ١]<\/span>."]], "tr": [[796.0, "Yine büyük mûcize, İsrâ ve Mi'râc mûcizesidir;"], [800.4, "o iki yolculuğun mûcizesi: Mescid-i Harâm'dan Mescid-i Aksâ'ya yeryüzü yolculuğu ve yedinci kat göğe semâ yolculuğu."], [807.8, "Öyle ki gökte, kalemlerin cızırtısını ve mukarrab (kerûbî) meleklerin tesbihini işittiği bir seviyeye ulaştı."], [817.0, "Yine Allah Azze ve Celle'nin şu sözünde geçen ayın yarılması:"], [826.1, "<span class=\"ayah\">﴿Kıyamet yaklaştı ve ay yarıldı﴾<\/span> [Kamer 1]."]]}, {"reader": false, "ar": [[830.0, "وكذلك نبعُ الماء بين أصابعه صلى الله عليه وسلم حتى توضّأ الجيشُ عن آخرهم،"], [837.0, "وقد كانوا ألفًا وثمانمائة رجل،"], [840.0, "وتوضّؤوا من إناءٍ صغيرٍ كان ينبع الماءُ فيه بين أصابع النبيّ صلى الله عليه وسلم كالعيون."], [848.0, "وكذلك أيضًا تسليمُ الجمادات عليه؛"], [854.0, "فقد قال النبيّ صلى الله عليه وسلم:"], [856.8, "«إنّي لأعرفُ حجرًا كان يُسلّم عليّ وأنا بمكّة»."], [860.0, "وكذلك كان يُسمَع تسبيحُ الطعام بين يديه صلى الله عليه وسلم."]], "tr": [[830.0, "Yine parmaklarının arasından suyun fışkırmasıdır —sallallâhu aleyhi ve sellem—;"], [834.0, "öyle ki ordunun sonuncusuna kadar hepsi abdest aldı."], [837.6, "Onlar bin sekiz yüz kişiydiler ve küçük bir kaptan abdest aldılar;"], [842.5, "su o kabın içinde Peygamber sallallâhu aleyhi ve sellem'in parmaklarının arasından pınarlar gibi fışkırıyordu."], [849.6, "Yine cansız varlıkların ona selâm vermesidir."], [854.8, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [857.6, "\"Ben Mekke'deyken bana selâm veren bir taşı muhakkak biliyorum.\" Aynı şekilde önündeki yemeğin tesbihi işitilirdi, sallallâhu aleyhi ve sellem."]]}, {"reader": false, "ar": [[866.0, "وكذلك من معجزاته تلك البركةُ العظيمةُ الذاتيّة التي أحلّها الله عز وجل في جسده،"], [875.0, "حتى كانوا يستشفون بتلك الآثار من جُبّةٍ أو شعرٍ أو بُصاقٍ أو عَرَقٍ أو غير ذلك."], [886.0, "وقد ألّف العلماءُ في جمع معجزات النبيّ صلى الله عليه وسلم مؤلَّفاتٍ عديدة."], [894.0, "وإنّ من أعظم ما يُبيّن كثرةَ المعجزات التي جرت على يديه صلى الله عليه وسلم ما صرّح به الإمامُ ابنُ القيّم رحمه الله من أنّ معجزاته قد جاوزت الألف؛"], [906.0, "فمعجزاتُ النبيّ صلى الله عليه وسلم قد جاوزت الألف،"], [912.0, "كما صرّح بذلك العلّامةُ ابنُ القيّم في كتابه «إغاثة اللهفان من مصائد الشيطان» في الجزء الثاني صفحة ٦٩١ من هذه الطبعة، لمن أراد المراجعة."]], "tr": [[866.0, "Yine mûcizelerinden biri, Allah Azze ve Celle'nin onun bedenine yerleştirdiği o büyük zâtî berekettir."], [876.3, "Öyle ki cübbe, saç, tükürük, ter ve benzeri o eserlerle şifa ararlardı."], [884.9, "Âlimler Peygamber sallallâhu aleyhi ve sellem'in mûcizelerini toplamak hakkında pek çok eser telif etmişlerdir."], [894.9, "Onun elinde gerçekleşen mûcizelerin çokluğunu gösteren en büyük şeylerden biri, İmam İbnü'l-Kayyim'in —Allah ona rahmet etsin— mûcizelerinin bini aştığını açıkça söylemesidir."], [904.9, "Evet, Peygamber sallallâhu aleyhi ve sellem'in mûcizeleri bini aşmıştır."], [911.3, "Nitekim allâme İbnü'l-Kayyim bunu \"İğâsetü'l-lehfân min mesâidi'ş-şeytân\" adlı kitabında, bu baskının ikinci cildinin 691."], [920.0, "sayfasında açıkça belirtmiştir; müracaat etmek isteyenler için."]]}]}, {"ts": "15:25", "title": "1. Külliye (devam): Birinci mesele: Mûcizeler hakkında Ehl-i Sünnet ile bid'at ehli arasındaki fark", "paras": [{"reader": false, "ar": [[925.0, "وهنا مسائلُ لا بدّ أن نبحثها في مسألة المعجزات."], [934.0, "المسألةُ الأولى: ما الفرقُ بين معتقَد أهل السنّة في المعجزات وبين معتقَدات أهل البدع فيها؟"], [946.0, "الجوابُ: نحن نتكلّم عن طائفةٍ من أهل البدع أثبتت أصلَ المعجزات،"], [956.0, "كالأشاعرة والكرّاميّة والماتريديّة. فهؤلاء نقطةُ الخلاف فيما بيننا وبينهم أنهم يجعلون صدقَ النبوّة موقوفًا على وجود المعجزة،"], [971.0, "ولا يجعلون لصدق النبوّة طريقًا آخرَ أبدًا."]], "tr": [[925.0, "Burada mûcizeler meselesinde mutlaka incelememiz gereken birtakım meseleler vardır."], [930.7, "Birinci mesele: Ehl-i Sünnet'in mûcizeler hakkındaki inancı ile bid'at ehlinin bu konudaki inançları arasındaki fark nedir?"], [944.4, "Cevap: Biz bid'at ehlinden, mûcizelerin aslını isbat eden bir grup hakkında konuşuyoruz;"], [952.2, "Eş'arîler, Kerrâmiyye ve Mâtürîdîler gibi."], [961.0, "Bunlarla bizim aramızdaki ihtilaf noktası şudur:"], [964.4, "Onlar nübüvvetin doğruluğunu mûcizenin varlığına bağlı kılarlar ve nübüvvetin doğruluğu için asla başka bir yol kabul etmezler."]]}, {"reader": false, "ar": [[979.0, "ولذلك هم يُعرّفون المعجزةَ بأنها أمرٌ خارقٌ مقرونٌ بدعوى النبوّة،"], [984.0, "بمعنى أنه لا تُعرَف نبوّةُ نبيٍّ ولا رسالةُ رسولٍ إلا إذا جاء بالمعجزة."], [990.0, "ومن المعلوم أنّ هذا مخالفٌ لمنهج أهل السنّة والجماعة؛"], [995.0, "بل أهلُ السنّة والجماعة يزيدون طريقًا آخر،"], [999.8, "وهو صفاتُ النبيّ الخُلُقيّة،"], [1003.0, "كما كان كثيرٌ من العرب يأتون إلى النبيّ صلى الله عليه وسلم ويرون من حُسن أخلاقه،"], [1010.1, "وجميل صفاته، وعظيم ما وهبه الله عز وجل من هذه الأخلاق،"], [1016.0, "ما يجعلهم يُصدّقون بأنه نبيّ."]], "tr": [[979.0, "Bu yüzden onlar mûcizeyi \"peygamberlik iddiasıyla birlikte olan, âdeti aşan bir iş\" diye tarif ederler;"], [985.4, "yani bir peygamberin nübüvveti ve bir resulün risaleti, ancak mûcize getirdiğinde bilinebilir."], [990.6, "Malumdur ki bu, Ehl-i Sünnet ve'l-Cemaat'in metoduna aykırıdır."], [995.0, "Bilakis Ehl-i Sünnet ve'l-Cemaat bir yol daha ekler;"], [999.8, "o da peygamberin ahlâkî sıfatlarıdır."], [1003.0, "Nitekim Araplardan pek çoğu Peygamber sallallâhu aleyhi ve sellem'e gelir;"], [1007.2, "onun ahlâkının güzelliğinden, sıfatlarının hoşluğundan ve Allah Azze ve Celle'nin ona bahşettiği bu ahlâkın büyüklüğünden, onun bir peygamber olduğunu tasdik etmelerini sağlayacak şeyler görürlerdi."]]}, {"reader": false, "ar": [[1019.0, "بل إنّ عبدَ الله بن سلامٍ رضي الله تعالى عنه وأرضاه استدلّ برؤية وجهه وتقاسيم وجهه على أنه ليس بوجه كذّاب."], [1030.0, "فليست النبوّةُ محصورةً على وجود الأمر المعجز الخارق للعادة؛"], [1036.0, "فإنّ حصرَ صدق النبوّة على هذا الأمر منهجُ أهل البدع."], [1040.0, "فأخرج الترمذيُّ في «جامعه» بإسنادٍ صحيحٍ من حديث عبد الله بن سلامٍ رضي الله عنه قال:"], [1047.5, "«قدم النبيُّ صلى الله عليه وسلم المدينةَ فجئتُ فتبيّنتُ وجهَه، فعرفتُ أنّ وجهَه ليس بوجه كذّاب، فكان أوّلُ ما قال: يا أيها الناس، صِلُوا الأرحام، وأطعموا الطعام، وأفشوا السلام، تدخلوا الجنّة بسلام»،"], [1062.9, "أو كما قال صلى الله عليه وسلم."]], "tr": [[1019.0, "Hatta Abdullah b. Selâm —Allah ondan razı olsun ve onu razı etsin— onun yüzünü görmesinden ve yüzünün hatlarından, bunun bir yalancı yüzü olmadığına istidlal etmiştir."], [1030.7, "Dolayısıyla nübüvvet, âdeti aşan mûcize işin varlığıyla sınırlı değildir;"], [1036.4, "nübüvvetin doğruluğunu bu işle sınırlamak bid'at ehlinin metodudur."], [1039.2, "Tirmizî \"Câmi\"inde sahih bir senedle Abdullah b."], [1041.9, "Selâm'ın —Allah ondan razı olsun— hadisinden şunu rivayet etmiştir:"], [1045.6, "\"Peygamber sallallâhu aleyhi ve sellem Medine'ye geldi."], [1049.2, "Ben de gelip yüzüne dikkatle baktım ve yüzünün bir yalancı yüzü olmadığını anladım."], [1055.2, "Söylediği ilk şey şu oldu:"], [1057.0, "Ey insanlar! Akrabalık bağlarını gözetin, yemek yedirin, selâmı yayın;"], [1061.1, "selâmetle cennete girersiniz.\" Ya da onun sallallâhu aleyhi ve sellem buyurduğu gibi."]]}, {"reader": false, "ar": [[1066.0, "فصدقُ النبيّ يُعرَف بما يقترن به من القرائن،"], [1069.6, "ولا يختصّ بالمعجزة. ولذلك استدلّت خديجةُ رضي الله تعالى عنها على صدق النبيّ صلى الله عليه وسلم بمكارم أخلاقه؛"], [1078.0, "فلمّا جاءها يرجف فؤادُه وقال:"], [1081.2, "«زمّلوني، زمّلوني»، قالت: «كلّا والله، لا يُخزيك الله أبدًا؛ فإنك امرؤٌ تصل الرحم، وتحمل الكَلّ، وتَقري الضيف، وتُعين على نوائب الحقّ»."]], "tr": [[1066.0, "Peygamberin doğruluğu, onunla birlikte bulunan karinelerle bilinir;"], [1068.2, "mûcizeye has değildir. Bu yüzden Hadîce —Allah ondan razı olsun— Peygamber sallallâhu aleyhi ve sellem'in doğruluğuna onun güzel ahlâkıyla istidlal etmiştir."], [1076.2, "Kalbi titreyerek yanına gelip \"Beni örtün, beni örtün!\" deyince şöyle dedi:"], [1081.2, "\"Hayır, vallahi Allah seni asla rezil etmez."], [1085.1, "Çünkü sen akrabalık bağını gözetirsin, düşkünün yükünü taşırsın, misafiri ağırlarsın ve hak yolunda başa gelen musibetlerde yardım edersin.\""]]}, {"reader": false, "ar": [[1096.0, "بل إنّ من أعظم دلائل نبوّته عند قومه أنه كان موصوفًا في الجاهليّة بأنه الصادقُ الأمين،"], [1107.3, "الذي لا يُعرَف عنه لا خيانةُ عهدٍ،"], [1112.0, "ولا غدرٌ بوعدٍ، ولا خيانةُ أمانة."], [1116.0, "وكم دخل في الإسلام من جُمَلٍ من الكفّار بسبب حُسن أخلاق النبيّ صلى الله عليه وسلم!"], [1127.0, "فإذا قيل لك: ما دلائلُ النبوّة؟"], [1131.1, "فقل: الصفاتُ الخُلُقيّة في هذا النبيّ،"], [1139.0, "والبراهينُ والآياتُ والمعجزاتُ التي يؤيّده الله عز وجل بها."]], "tr": [[1096.0, "Hatta kavmi nezdinde nübüvvetinin en büyük delillerinden biri, cahiliyede \"es-Sâdıku'l-Emîn\" (doğru sözlü, güvenilir) diye nitelenmesiydi;"], [1106.7, "ondan ne bir ahde ihanet, ne bir sözden dönme, ne de bir emanete hıyanet bilinirdi."], [1116.7, "Peygamber sallallâhu aleyhi ve sellem'in güzel ahlâkı sebebiyle kâfirlerden nice topluluklar İslam'a girmiştir!"], [1125.3, "Sana \"Nübüvvetin delilleri nelerdir?\" denirse de ki:"], [1130.4, "Bu peygamberdeki ahlâkî sıfatlar ile Allah Azze ve Celle'nin onu desteklediği burhanlar, âyetler ve mûcizeler."]]}]}, {"ts": "19:04", "title": "1. Külliye (devam): İkinci mesele: Mûcize için meydan okuma şart mıdır?", "paras": [{"reader": false, "ar": [[1144.0, "المسألةُ الثانية: هل يُشترَط في كون الأمر الخارق للعادة معجزةً أن يُتحدّى به؟"], [1160.0, "بمعنى: لو أجرى الله أمرًا خارقًا على يد نبيٍّ ولم يتحدَّ به قومَه،"], [1166.0, "أفيدخل في حدّ المعجزة،"], [1168.0, "أم لا بدّ من أن يكون مقرونًا بالتحدّي؟"], [1171.0, "الجوابُ في قول أكثر أهل السنّة والجماعة:"], [1177.0, "أنه يُوصَف بأنه أمرٌ معجز،"], [1180.4, "وأنه آيةٌ وبرهانٌ وبيّنةٌ وسلطانٌ على صدق النبيّ،"], [1186.0, "سواءٌ أكان مقرونًا بالتحدّي أو غيرَ مقرونٍ به."]], "tr": [[1144.0, "İkinci mesele: Âdeti aşan bir işin mûcize olması için onunla meydan okunması şart mıdır?"], [1158.9, "Yani Allah bir peygamberin elinde âdeti aşan bir iş gerçekleştirse ve o peygamber onunla kavmine meydan okumasa, bu mûcizenin tanımına girer mi, yoksa meydan okumayla birlikte olması mı gerekir?"], [1170.6, "Ehl-i Sünnet ve'l-Cemaat'in çoğunluğunun görüşüne göre cevap şudur:"], [1175.5, "O, meydan okumayla birlikte olsun ya da olmasın, âciz bırakan bir iş olarak ve peygamberin doğruluğuna bir âyet, burhan, beyyine ve sultan olarak nitelenir."]]}, {"reader": false, "ar": [[1189.0, "بل إنّ اشتراطَ كونه مقرونًا بالتحدّي هو الذي عليه أغلبُ أهل البدع."], [1199.0, "وأمّا أكثرُ أهل السنّة والجماعة فإنهم متى ما رأوا الأمرَ الخارق،"], [1209.0, "متى ما ثبت عندهم الأمرُ الخارق للعادة،"], [1212.0, "فإنهم يجعلونه موصوفًا بالإعجاز،"], [1215.0, "سواءٌ أكان مقرونًا بالتحدّي أو ليس مقرونًا به."], [1220.0, "فما يُظهره الله عز وجل من خوارق العادات على يد الأنبياء ليس من شرطه التحدّي أو عدمُ الإتيان بمثله،"], [1227.0, "بل آياتُ الأنبياء دليلٌ على نبوّتهم،"], [1232.0, "وقد تخلو من شرط التحدّي وعدم المعارضة."]], "tr": [[1189.0, "Hatta meydan okumayla birlikte olmasını şart koşmak, bid'at ehlinin çoğunun görüşüdür."], [1196.5, "Ehl-i Sünnet ve'l-Cemaat'in çoğunluğuna gelince, onlar âdeti aşan işi gördüklerinde, âdeti aşan iş onlar nezdinde sabit olduğunda, meydan okumayla birlikte olsun ya da olmasın onu i'câz (âciz bırakma) ile nitelerler."], [1219.4, "Allah Azze ve Celle'nin peygamberlerin elinde ortaya çıkardığı harikulâde şeylerin şartı, meydan okuma veya benzerinin getirilememesi değildir."], [1226.2, "Bilakis peygamberlerin âyetleri onların nübüvvetine delildir;"], [1229.3, "meydan okuma ve muâraza edilmeme şartından boş da olabilir."]]}, {"reader": false, "ar": [[1235.0, "كتكثير الطعام بين يدَي النبيّ صلى الله عليه وسلم؛"], [1239.0, "فإنه معجزة، ولم يُعلَم أنه تحدّى قومَه بذلك."], [1243.0, "وكذلك كثرةُ الماء ونبعُه بين أصابع النبيّ صلى الله عليه وسلم؛"], [1251.0, "فإنه من دلائل نبوّته،"], [1253.0, "ولم يكن يُظهرها النبيّ صلى الله عليه وسلم للاستدلال بها على صدق نبوّته أو يتحدّى به قومَه،"], [1263.0, "بل لمّا احتاج المسلمون إليها أخرجها الله عز وجل على يديه."], [1268.0, "فهي معجزاتٌ وبراهينُ وآياتٌ سببُها حاجةُ المسلمين لها."]], "tr": [[1235.0, "Peygamber sallallâhu aleyhi ve sellem'in önünde yemeğin çoğalması gibi;"], [1238.1, "bu bir mûcizedir, ama onunla kavmine meydan okuduğu bilinmemektedir."], [1242.0, "Aynı şekilde suyun çoğalması ve Peygamber sallallâhu aleyhi ve sellem'in parmaklarının arasından fışkırması da onun nübüvvetinin delillerindendir;"], [1252.0, "Peygamber sallallâhu aleyhi ve sellem bunları nübüvvetinin doğruluğuna delil getirmek veya onunla kavmine meydan okumak için ortaya koymuyordu."], [1261.0, "Bilakis Müslümanlar onlara ihtiyaç duyunca Allah Azze ve Celle onları onun elinde ortaya çıkardı."], [1267.5, "Bunlar, sebebi Müslümanların onlara ihtiyacı olan mûcizeler, burhanlar ve âyetlerdir."]]}, {"reader": false, "ar": [[1273.0, "ولذلك قال أبو العبّاس ابنُ تيميّة رحمه الله تعالى:"], [1278.0, "«إنّ آياتِ الأنبياء ليس من شرطها استدلالُ النبيّ بها، ولا تحدّيه بالإتيان بمثلها، بل هي دليلٌ على نبوّته وإن خلت عن هذين القيدين»،"], [1291.0, "أي: الاستدلال بها والتحدّي. انتهى كلامه."]], "tr": [[1273.0, "Bu yüzden Ebu'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1278.0, "\"Peygamberlerin âyetlerinin şartı, peygamberin onlarla istidlal etmesi veya benzerini getirmeleri için meydan okuması değildir."], [1286.1, "Bilakis bu iki kayıttan boş olsa da onlar onun nübüvvetine delildir.\" Yani onlarla istidlal etmek ve meydan okumak. Sözü bitti."]]}]}, {"ts": "21:38", "title": "1. Külliye (devam): Üçüncü mesele: Mûcizenin, kavmin üstün olduğu alandan olması", "paras": [{"reader": false, "ar": [[1298.0, "المسألةُ الثالثة: لقد جنح جمعٌ من أهل العلم رحمهم الله تعالى إلى أنّ كلَّ نبيٍّ اختُصّ بما يُثبت دعواه من خوارق العادة على حسب ما تفوّق أو نبغ فيه قومُه."], [1317.0, "ولكنّ هذا في الأصحّ ليس بلازم؛"], [1321.0, "فقد تكون الآيةُ التي يُجريها الله عز وجل على يد النبيّ لا شأنَ لها بما نبغ فيه القوم."], [1328.0, "فلا ينبغي أن يُجعَل هذا من شروط كون الأمر معجزًا أو آيةً أو برهانًا على صدق نبوّته."]], "tr": [[1298.0, "Üçüncü mesele: İlim ehlinden —Allah onlara rahmet etsin— bir topluluk, her peygamberin, iddiasını isbat eden harikulâde şeylerden kavminin üstün olduğu veya maharet kazandığı şeye göre olanıyla hususileştirildiği görüşüne meyletmiştir."], [1316.4, "Fakat daha doğru olan görüşe göre bu lâzım (zorunlu) değildir."], [1322.4, "Allah Azze ve Celle'nin peygamberin elinde gerçekleştirdiği âyetin, kavmin maharet kazandığı şeyle hiçbir ilgisi olmayabilir."], [1328.0, "Dolayısıyla bu, bir işin mûcize veya onun nübüvvetinin doğruluğuna bir âyet ya da burhan olmasının şartlarından sayılmamalıdır."]]}, {"reader": false, "ar": [[1336.0, "وإن كان قد وقع ذلك في بعض الأنبياء،"], [1340.4, "لكن ليس لكلّهم. فإن قلنا بأنه أمرٌ أغلبيّ أو أمرٌ واقع لكنّا صادقين في ذلك ولا بأس،"], [1353.0, "لكن ليس هذا بلازمٍ في الأصحّ،"], [1355.7, "وإنما هو أغلبيٌّ لا كلّيّ."], [1358.0, "وذلك أدعى لإيمان قومه به إذا أعجزهم في الأمر الذي نبغوا فيه وتفوّقوا فيه."]], "tr": [[1336.0, "Bu, bazı peygamberlerde gerçekleşmiş olsa da hepsinde değildir."], [1339.3, "Eğer bunun çoğunlukla olan veya vâki olan bir iş olduğunu söylersek, bunda doğru söylemiş oluruz;"], [1347.4, "bir sakıncası yoktur. Fakat daha doğru olan görüşe göre bu lâzım değildir;"], [1354.8, "o, küllî değil, ağlebîdir (çoğunlukla olandır)."], [1357.1, "Peygamber, kavmini maharet kazandıkları ve üstün oldukları işte âciz bıraktığında, bu onların ona iman etmesine daha çok sevk eder."]]}, {"reader": false, "ar": [[1369.0, "كما أنّ موسى عليه الصلاة والسلام جعل الله عز وجل آياتِه ـ الآياتِ التي أجراها الله على يديه ـ من جنس ما يأتي به السحرة،"], [1381.0, "ولكن مع فرقانٍ عظيم."], [1383.0, "فانقلابُ العصا في يده ثعبانًا هو كما يفعله السحرة من أنهم ألقَوا عِصِيَّهم،"], [1394.0, "«فخُيِّل إليه من سحرهم أنها تسعى» <span class=\"note\">(لفظ الآية: <span class=\"ayah\">﴿يُخَيَّلُ إِلَيْهِ﴾<\/span>)<\/span>،"], [1397.0, "لكنْ فرقانٌ بين هذا وبين هذا."], [1401.0, "ولذلك لمّا رأى السحرةُ تلك الآيةَ العظيمة التي أجراها الله عز وجل على يد موسى آمنوا بأنها ليست من عند البشر،"], [1413.0, "وليست داخلةً تحت مقدور البشريّة أبدًا،"], [1416.0, "فآمنوا إيمانًا عظيمًا هُدِّدوا فيه بأن تُقطَّع أيديهم وأرجلُهم من خلاف،"], [1422.9, "ولم يرجعوا عن إيمانهم ذلك."]], "tr": [[1369.0, "Nitekim Allah Azze ve Celle, Mûsâ aleyhisselâmın âyetlerini —onun elinde gerçekleştirdiği âyetleri— sihirbazların getirdiği şeyler cinsinden kıldı;"], [1378.0, "fakat büyük bir farkla. Asanın onun elinde ejderhaya dönüşmesi, sihirbazların yaptığı gibidir;"], [1384.4, "onlar asalarını attılar da \"sihirlerinden dolayı ona, onların koştuğu hayal ettirildi\" <span class=\"note\">(ayetin lafzı: <span class=\"ayah\">﴿hayal ettiriliyordu﴾<\/span>)<\/span>."], [1396.0, "Fakat bununla bunun arasında bir fark vardır."], [1400.3, "Bu yüzden sihirbazlar, Allah Azze ve Celle'nin Mûsâ'nın elinde gerçekleştirdiği o büyük âyeti görünce, onun insanlardan kaynaklanmadığına ve asla beşerî gücün altına girmediğine iman ettiler."], [1414.5, "Öyle büyük bir imanla iman ettiler ki ellerinin ve ayaklarının çaprazlama kesilmesiyle tehdit edildiler, yine de o imanlarından dönmediler."]]}, {"reader": false, "ar": [[1426.0, "وكذلك أيضًا لمّا كان الغالبُ في زمن عيسى عليه الصلاة والسلام الطبَّ،"], [1435.0, "وتفوّقَ قومُه في ذلك ـ مع أنّني لا أعلم دليلًا يدلّ على هذا،"], [1441.0, "لكن يُذكَر ذلك في كتب السِّيَر والتواريخ ـ فجاءهم بما هو أعلى منه،"], [1448.6, "من إبراء الأكمه والأبرص،"], [1452.0, "بما هو خارجٌ عن قدرتهم،"], [1456.0, "بل وبما هو خارجٌ عن قدرتهم، وهو إحياءُ الأموات."]], "tr": [[1426.0, "Aynı şekilde İsâ aleyhisselâmın zamanında baskın olan şey tıp olup kavmi bu konuda üstün olunca —gerçi buna delalet eden bir delil bilmiyorum, fakat bu siyer ve tarih kitaplarında zikredilir— onlara bundan daha yüce olanı, doğuştan körü ve alacalıyı iyileştirmeyi, yani onların gücünün dışında olan şeyi getirdi;"], [1456.0, "hatta onların gücünün dışında olan şeyi, ölüleri diriltmeyi getirdi."]]}, {"reader": false, "ar": [[1461.0, "وكذلك النبيُّ صلى الله عليه وسلم؛"], [1465.0, "فإنّ الله أرسله في العرب،"], [1467.2, "وهم أهلُ الفصاحة والبلاغة،"], [1469.0, "وتأليفِ الكلام على أعلى طبقاته،"], [1472.0, "فكانت آيتُه وبرهانُه <span class=\"ayah\">﴿قُرْآنًا عَرَبِيًّا﴾<\/span> <span class=\"ref\">[يوسف: ٢]<\/span> <span class=\"ayah\">﴿بِلِسَانٍ عَرَبِيٍّ مُّبِينٍ﴾<\/span> <span class=\"ref\">[الشعراء: ١٩٥]<\/span>،"], [1483.0, "مكوَّنٌ من «ألف لام ميم»،"], [1485.3, "و«حا ميم»، و«كاف ها يا عين صاد»؛"], [1490.0, "فهو مكوَّنٌ ومركَّبٌ من حروفٍ تُتقنونها وتنظمون شعرَكم ونثرَكم بناءً عليها،"], [1498.0, "ومع هذا لم يستطيعوا أن يأتوا بمثله،"], [1501.9, "ولا بعشر سورٍ من مثله،"], [1504.8, "ولا بسورةٍ من مثله."]], "tr": [[1461.0, "Aynı şekilde Peygamber sallallâhu aleyhi ve sellem de böyledir."], [1465.4, "Allah onu, fesahat, belâgat ve sözü en yüksek derecesinde telif etme ehli olan Araplara gönderdi."], [1471.4, "Onun âyeti ve burhanı, <span class=\"ayah\">﴿Arapça bir Kur'an﴾<\/span> [Yûsuf 2] <span class=\"ayah\">﴿apaçık Arapça bir dille﴾<\/span> [Şuarâ 195] oldu;"], [1485.3, "\"Elif Lâm Mîm\", \"Hâ Mîm\" ve \"Kâf Hâ Yâ Ayn Sâd\"dan oluşuyor."], [1490.7, "Yani o, sizin iyi bildiğiniz ve şiirinizi ve nesrinizi onlara dayanarak dizdiğiniz harflerden oluşmuş ve terkip edilmiştir."], [1500.2, "Buna rağmen onun benzerini, onun benzeri on sûreyi, onun benzeri tek bir sûreyi getiremediler."]]}]}, {"ts": "25:07", "title": "2. Külliye: Nübüvvetin bütün burhanları büyük ilâhî kudretle birlikte düşünülmelidir", "paras": [{"reader": false, "ar": [[1507.0, "ولعلّ ذلك كافٍ إن شاء الله في هذه الكلّيّة."], [1514.0, "ومن الكلّيّات أيضًا: <b>كلُّ براهين النبوّة لا بدّ أن تكون مقرونةً بعظيم القدرة الإلهيّة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1507.0, "Allah'ın izniyle bu külliye hakkında bu kadarı yeterlidir."], [1512.0, "Külliyelerden biri de şudur: 2."], [1515.7, "külliye: Nübüvvetin bütün burhanları mutlaka büyük ilâhî kudretle birlikte düşünülmelidir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1530.0, "أقول وبالله التوفيق: وذلك لأنّ النبيَّ والرسولَ لا يستطيع من عند نفسه أن يأتي بشيءٍ من ذلك."], [1547.0, "وقد أعلن الأنبياءُ عدمَ قدرتهم وعجزَهم الكاملَ على الإتيان بشيءٍ من هذه الآيات والبراهين والمعجزات،"], [1555.0, "كما قال الله عز وجل عنهم:"], [1557.8, "<span class=\"ayah\">﴿وَمَا كَانَ لِرَسُولٍ أَن يَأْتِيَ بِآيَةٍ إِلَّا بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[الرعد: ٣٨]<\/span>."]], "tr": [[1530.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, peygamberin ve resulün kendiliğinden bunlardan herhangi bir şeyi getirememesidir."], [1537.9, "Peygamberler, bu âyetlerden, burhanlardan ve mûcizelerden herhangi birini getirmeye güçlerinin olmadığını ve tam bir acz içinde olduklarını ilan etmişlerdir."], [1552.9, "Nitekim Allah Azze ve Celle onlar hakkında şöyle buyurur:"], [1556.9, "<span class=\"ayah\">﴿Allah'ın izni olmadıkça hiçbir resulün bir âyet (mûcize) getirmesi mümkün değildir﴾<\/span> [Ra'd 38]."]]}, {"reader": false, "ar": [[1562.0, "وتأمّلْ معي قولَه: <span class=\"ayah\">﴿بِإِذْنِ اللَّهِ﴾<\/span>؛"], [1565.0, "وغالبُ استعمال القرآن في قوله «بالإذن» إنما هو في الأمر الذي لا مدخلَ للبشريّة فيه أبدًا،"], [1575.0, "بخلاف قوله: «إن شاء الله»،"], [1577.7, "فإنه دائمًا يُذكَر في الأمر الذي لقدرة الإنسان فيه مدخل."], [1583.0, "فلمّا علّق الآياتِ والبراهينَ والمعجزاتِ على إذنه دلّ ذلك على أنها من الأمور الخارجة الخروجَ المطلقَ عن قدرة البشريّة."]], "tr": [[1562.0, "Benimle birlikte O'nun <span class=\"ayah\">﴿Allah'ın izniyle﴾<\/span> sözü üzerinde düşün."], [1566.9, "Kur'an'ın \"izin\" ifadesini kullanması çoğunlukla, beşerin asla payı olmayan işler hakkındadır."], [1573.8, "\"İnşallah (Allah dilerse)\" sözü ise böyle değildir;"], [1577.7, "o daima insanın kudretinin payı olan işlerde zikredilir."], [1581.9, "Allah âyetleri, burhanları ve mûcizeleri kendi iznine bağlayınca, bu onların beşerî kudretin mutlak olarak dışında kalan işlerden olduğuna delalet etti."]]}, {"reader": false, "ar": [[1596.0, "وكذلك قال الله عز وجل على لسان أنبيائه ورسله:"], [1600.0, "<span class=\"ayah\">﴿وَمَا كَانَ لَنَا أَن نَّأْتِيَكُم بِسُلْطَانٍ إِلَّا بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[إبراهيم: ١١]<\/span>."], [1605.0, "ولمّا طلب المشركون من النبيّ صلى الله عليه وسلم تلك الطلباتِ التعجيزيّة باعتبار قدرته هو،"], [1612.5, "في قول الله عز وجل:"], [1615.0, "<span class=\"ayah\">﴿وَقَالُوا لَن نُّؤْمِنَ لَكَ حَتَّىٰ تَفْجُرَ لَنَا مِنَ الْأَرْضِ يَنبُوعًا﴾<\/span> <span class=\"ref\">[الإسراء: ٩٠]<\/span> إلى قوله عز وجل:"], [1621.0, "<span class=\"ayah\">﴿قُلْ سُبْحَانَ رَبِّي هَلْ كُنتُ إِلَّا بَشَرًا رَّسُولًا﴾<\/span> <span class=\"ref\">[الإسراء: ٩٣]<\/span>،"], [1625.0, "أي: باعتبار كوني بشرًا ورسولًا لا يُخوِّل لي ذلك أن آتيَكم بشيءٍ من تلك المعجزات؛"], [1632.0, "وذلك لأنها خارجةٌ عن طاقة البشريّة."]], "tr": [[1596.0, "Aynı şekilde Allah Azze ve Celle peygamberlerinin ve resullerinin dilinden şöyle buyurmuştur:"], [1600.0, "<span class=\"ayah\">﴿Allah'ın izni olmadıkça size bir delil (sultan) getirmemiz bizim için mümkün değildir﴾<\/span> [İbrâhîm 11]."], [1606.5, "Müşrikler Peygamber sallallâhu aleyhi ve sellem'den, onun kendi kudretine göre âciz bırakıcı o talepleri istediklerinde —Allah Azze ve Celle'nin şu sözünde:"], [1615.0, "<span class=\"ayah\">﴿Dediler ki: Bizim için yerden bir pınar fışkırtmadıkça sana asla inanmayacağız﴾<\/span> [İsrâ 90], Azze ve Celle'nin şu sözüne kadar:"], [1622.0, "<span class=\"ayah\">﴿De ki: Rabbimi tenzih ederim! Ben ancak resul olan bir insanım﴾<\/span> [İsrâ 93]— yani:"], [1628.0, "Bir insan ve resul olmam, size o mûcizelerden herhangi birini getirmeme imkân vermez;"], [1632.7, "çünkü onlar beşerî gücün dışındadır."]]}, {"reader": false, "ar": [[1636.0, "وإنّ هذه الكلّيّةَ تظهر أهمّيّتُها بالنظر إلى كثيرٍ ممّن أنكر هذه المعجزات؛"], [1645.0, "فكلُّ من أنكر معجزةً فإنّ سببَ إنكاره لها هو قرنُها بالقدرة البشريّة في الأعمّ الأغلب."], [1653.0, "فمتى ما قُرنت هذه المعجزاتُ بقدرة البشر فإنّ ذلك تعليقٌ سوف يؤدّي إلى التكذيب بها وجحودها والكفر بها."], [1667.0, "ولذلك لا يجوز لنا أبدًا أن نقرن بين هذه المعجزة والقدرة البشريّة،"], [1673.0, "وإنما دائمًا نقرنها بتلك القدرة الإلهيّة العظيمة التي لا يُعجزها شيءٌ في الأرض ولا في السماوات ولا في الأرض؛"], [1682.0, "فحينئذٍ يسهل على العقل تصديقُها،"], [1685.5, "وتنشرح النفسُ لقبولها والإيمان بها والإذعان، والإذعان لها."]], "tr": [[1636.0, "Bu külliyenin önemi, bu mûcizeleri inkâr edenlerin çoğuna bakıldığında ortaya çıkar."], [1643.4, "Bir mûcizeyi inkâr eden herkesin onu inkâr etmesinin sebebi, çoğunlukla onu beşerî kudretle birlikte düşünmesidir."], [1651.9, "Bu mûcizeler beşerin kudretiyle birlikte düşünüldüğünde, bu bağlantı onları yalanlamaya, inkâr etmeye ve onlara küfretmeye götürecektir."], [1663.0, "Bu yüzden bu mûcizeyi beşerî kudretle birlikte düşünmemiz asla caiz değildir;"], [1670.0, "bilakis onu daima, yerde de göklerde de hiçbir şeyin âciz bırakamayacağı o büyük ilâhî kudretle birlikte düşünürüz."], [1678.2, "İşte o zaman aklın onu tasdik etmesi kolaylaşır;"], [1681.6, "nefis onu kabul etmeye, ona iman etmeye ve boyun eğmeye, ona boyun eğmeye açılır."]]}, {"reader": false, "ar": [[1695.0, "فانقلابُ العصا حيّةً لا ينبغي أن يُنظَر فيه إلى قدرة نبيّ الله موسى،"], [1702.0, "وإنما يُقرَن بعظيم القدرة الإلهيّة."], [1705.0, "وكذلك انفلاقُ البحر له نصفين لا ينبغي أن يُنظَر إلى قدرته وإلى عصاه،"], [1712.0, "وإنما يُنظَر فيه إلى عظيم قدرة الله عز وجل."], [1715.0, "وكذلك انشقاقُ القمر لا يُنظَر فيه إلى قدرة النبيّ صلى الله عليه وسلم،"], [1721.0, "وإنما يُنظَر فيه إلى عظيم قدرة الله عز وجل."], [1725.0, "وكذلك الإسراءُ والمعراج لا ينبغي أن يُنظَر فيها إلى قدرة النبيّ صلى الله عليه وسلم،"], [1733.0, "وإنما لا يُنظَر فيها إلا إلى عظيم قدرة الله عز وجل."]], "tr": [[1695.0, "Asanın yılana dönüşmesinde Allah'ın peygamberi Mûsâ'nın kudretine bakılmamalı, bilakis o büyük ilâhî kudretle birlikte düşünülmelidir."], [1703.8, "Aynı şekilde denizin onun için ikiye yarılmasında onun kudretine ve asasına bakılmamalı, bilakis onda Allah Azze ve Celle'nin büyük kudretine bakılmalıdır."], [1715.0, "Aynı şekilde ayın yarılmasında Peygamber sallallâhu aleyhi ve sellem'in kudretine bakılmaz, bilakis onda Allah Azze ve Celle'nin büyük kudretine bakılır."], [1725.5, "Aynı şekilde İsrâ ve Mi'râc'ta Peygamber sallallâhu aleyhi ve sellem'in kudretine bakılmamalı;"], [1732.5, "bilakis onda ancak Allah Azze ve Celle'nin büyük kudretine bakılır."]]}, {"reader": false, "ar": [[1736.0, "فمتى ما قُرنت تلك المعجزاتُ بالقدرة البشريّة حصل الإنكارُ والتكذيب،"], [1742.0, "ومتى ما قُرنت بعظيم قدرة الله عز وجل حصل الإيمانُ والتسليم."], [1748.0, "أليس كذلك؟ والله أعلم."]], "tr": [[1736.0, "O mûcizeler beşerî kudretle birlikte düşünüldüğünde inkâr ve yalanlama meydana gelir;"], [1740.8, "Allah Azze ve Celle'nin büyük kudretiyle birlikte düşünüldüğünde ise iman ve teslim meydana gelir."], [1746.9, "Öyle değil mi? Allah en iyisini bilir."]]}]}, {"ts": "29:09", "title": "3. Külliye: Sahih ve mütevâtir delille sabit olan mûcizeyi inkâr eden kâfirdir", "paras": [{"reader": false, "ar": [[1749.0, "ومن الكلّيّات أيضًا: <b>كلُّ معجزةٍ لنبيٍّ ثبتت بالدليل الصحيح المتواتر فمنكرُها كافر.<\/b> <span class=\"note\">(يكررها)<\/span> فإن قلتَ:"], [1758.4, "ولماذا حكمتَ عليه بالكفر؟"], [1761.1, "فأقول: لأنه منكرٌ للمعلوم من الدين بالضرورة."]], "tr": [[1749.0, "Külliyelerden biri de şudur: 3."], [1751.0, "külliye: Bir peygambere ait olup sahih ve mütevâtir delille sabit olan her mûcizeyi inkâr eden kâfirdir. (Tekrar ediyor.) Eğer \"Neden onun küfrüne hükmettin?\" dersen, derim ki:"], [1761.1, "Çünkü o, dinden zaruri olarak bilinen bir şeyi inkâr etmektedir."]]}, {"reader": false, "ar": [[1786.0, "والمتقرِّر في القواعد أنّ كلَّ من أنكر معلومًا من الدين بالضرورة فإنه كافر."], [1791.0, "ولأنه مكذِّبٌ لهذه الأدلّة المتواترة التي تُثبت وقوعَ هذه البراهين والمعجزات على أيدي الأنبياء،"], [1801.0, "وكلُّ من كذّب بالدليل الصحيح المتواتر فإنه كافر."], [1807.0, "ولأنه مكذِّبٌ للمُخبِر بها،"], [1809.3, "وهو الله تبارك وتعالى أو نبيُّه صلى الله عليه وسلم،"], [1815.0, "وكلُّ من كذّب الشارعَ في خبره فإنه كافر."]], "tr": [[1786.0, "Kaidelerde sabit olan şudur: Dinden zaruri olarak bilinen bir şeyi inkâr eden herkes kâfirdir."], [1790.6, "Bir de o, bu burhanların ve mûcizelerin peygamberlerin elinde gerçekleştiğini isbat eden bu mütevâtir delilleri yalanlamaktadır;"], [1801.0, "sahih ve mütevâtir delili yalanlayan herkes ise kâfirdir."], [1806.1, "Bir de o, bunları haber vereni, yani Allah Tebâreke ve Teâlâ'yı veya O'nun Peygamberi sallallâhu aleyhi ve sellem'i yalanlamaktadır;"], [1816.2, "Şâri'i haberinde yalanlayan herkes de kâfirdir."]]}, {"reader": false, "ar": [[1820.0, "ذلك لأنّ هذه البراهين إنما أجراها الله عز وجل في مقام الإخبار عن أمرٍ واقع،"], [1829.0, "وواجبُ الخبر الشرعيّ: التصديقُ والإيمانُ والإذعانُ والتسليم،"], [1836.0, "وتركُ التشكيك والمماحلة والمعارضة."], [1842.0, "فلا يجوز لأحدٍ أبدًا أن يعمد إلى معجزةٍ من معجزات الأنبياء ثبتت بالدليل الصحيح المتواتر،"], [1850.0, "ثم يعمد إلى إنكارها."]], "tr": [[1820.0, "Çünkü Allah Azze ve Celle bu burhanları vâki bir işi haber verme makamında gerçekleştirmiştir."], [1826.6, "Şer'î haberin gereği ise tasdik, iman, boyun eğme ve teslimdir;"], [1832.7, "şüphe uyandırmayı, inatla tartışmayı ve muârazayı (itirazı) terk etmektir."], [1842.5, "Hiç kimsenin, peygamberlerin mûcizelerinden sahih ve mütevâtir delille sabit olan bir mûcizeye yönelip sonra da onu inkâra kalkışması asla caiz değildir."]]}, {"reader": false, "ar": [[1852.0, "فمن أنكر ما أجراه الله عز وجل على يد موسى من الآيات والبراهين المذكورة في كتابه فهو كافر،"], [1861.0, "ومن أنكر ما أجراه الله عز وجل على يد عيسى من تلك البراهين العظيمة فهو كافر،"], [1868.0, "ومن أنكر انشقاقَ القمر للنبيّ صلى الله عليه وسلم فإنه كافر،"], [1874.0, "ومن أنكر برهانَ الإسراء والمعراج بالنبيّ صلى الله عليه وسلم فلا جرمَ أنه كافر،"], [1886.0, "ونحو ذلك من المعجزات."]], "tr": [[1852.0, "Allah Azze ve Celle'nin Mûsâ'nın elinde gerçekleştirdiği ve Kitabı'nda zikredilen âyetleri ve burhanları inkâr eden kâfirdir."], [1860.5, "Allah Azze ve Celle'nin İsâ'nın elinde gerçekleştirdiği o büyük burhanları inkâr eden kâfirdir."], [1866.2, "Peygamber sallallâhu aleyhi ve sellem için ayın yarılmasını inkâr eden kâfirdir."], [1872.4, "Peygamber sallallâhu aleyhi ve sellem'in İsrâ ve Mi'râc ile götürülmesi burhanını inkâr eden şüphesiz kâfirdir. Diğer mûcizeler de böyledir."]]}]}, {"ts": "31:27", "title": "3. Külliye (devam): Zayıf ve âhâd hadislerle gelen mûcizeler", "paras": [{"reader": false, "ar": [[1887.0, "إلا أنّ هناك من المعجزات ما يُنسَب إلى النبيّ صلى الله عليه وسلم أو إلى أحدٍ من الأنبياء،"], [1894.0, "ولكنّ الحديثَ ضعيف؛ فلا يُعتبَر من أنكر معجزةً وردت في حديثٍ ضعيفٍ أو موضوعٍ أنه كافر؛"], [1903.0, "وذلك لأنّ هذه الأحاديثَ الضعيفة أو الواهية المنكرة الموضوعة لا يجوز نسبتُها إلى الشارع صلى الله عليه وسلم."]], "tr": [[1887.0, "Ancak mûcizelerden, Peygamber sallallâhu aleyhi ve sellem'e veya peygamberlerden birine nispet edilen, fakat hadisi zayıf olanlar vardır."], [1894.0, "Zayıf veya uydurma bir hadiste gelen bir mûcizeyi inkâr eden kimse kâfir sayılmaz."], [1902.5, "Çünkü bu zayıf veya vâhî, münker, uydurma hadislerin Şâri' sallallâhu aleyhi ve sellem'e nispet edilmesi caiz değildir."]]}, {"reader": false, "ar": [[1913.0, "وهناك بعضُ المعجزات أيضًا ثبتت بأحاديثَ آحاد؛"], [1919.0, "فمتى ما صحّ سندُها فالواجبُ الإقرارُ بها والإيمانُ بها،"], [1923.0, "ولكنْ من أنكرها لشبهةٍ عرضت أو لتأويلٍ عرض فينبغي أن يُنتظَر بتكفيره حتى تُقام عليه الحجّةُ الرساليّة التي يكفر من خالفها."]], "tr": [[1913.0, "Bir kısım mûcizeler de âhâd hadislerle sabit olmuştur."], [1917.5, "Senedi sahih olduğunda onları ikrar etmek ve onlara iman etmek vaciptir."], [1922.1, "Fakat onları, karşısına çıkan bir şüphe veya ortaya çıkan bir te'vil sebebiyle inkâr eden kimseyi tekfir etmek için, kendisine, muhalefet edenin kâfir olacağı risalet hücceti ikame edilinceye kadar beklenmelidir."]]}, {"reader": false, "ar": [[1936.0, "وسيأتينا كلّيّةٌ بأنّ التكذيبَ ببراهين الأنبياء مُفضٍ إلى التكذيب ـ بإيش؟"], [1946.4, "ـ بنبوّتهم ورسالتهم. فأوّلُ مراتب التكذيب بالنبوّات إنما هو التكذيبُ ببراهينهم ومعجزاتهم،"], [1957.0, "كما حكاه ابنُ تيميّة رحمه الله في كتابه ـ الذي هذه خلاصةُ مادّته في هذا الدرس ـ كتابه «النبوّات»."]], "tr": [[1936.0, "İleride, peygamberlerin burhanlarını yalanlamanın neyi —(dinleyicilere soruyor:) neyi?— onların nübüvvetini ve risaletini yalanlamaya götürdüğüne dair bir külliye gelecek."], [1951.2, "Nübüvvetleri yalanlamanın ilk mertebesi, onların burhanlarını ve mûcizelerini yalanlamaktır."], [1957.5, "Nitekim İbn Teymiyye —Allah ona rahmet etsin— bunu, bu dersteki malzemenin özetini oluşturan kitabında, \"en-Nübüvvât\" adlı kitabında nakletmiştir."]]}]}, {"ts": "32:47", "title": "4. Külliye: Mûcizeye akıl terazisiyle bakan sapmıştır", "paras": [{"reader": false, "ar": [[1967.0, "ومن الكلّيّات أيضًا: <b>كلُّ من نظر للمعجزة بميزان عقله فقد ضلّ.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[1967.0, "Külliyelerden biri de şudur: 4."], [1969.0, "külliye: Mûcizeye kendi aklının terazisiyle bakan herkes sapmıştır. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1990.0, "أقول وبالله التوفيق: وذلك لأنه لا يمكن للعقل البشريّ أن يُدرك جوهرَ المعجزة بشكلٍ كامل؛"], [1999.0, "لأنّ المعجزات لا تخضع لقوانين الطبيعة،"], [2003.0, "ولا تخضع للسببيّة التي يُدركها العقل،"], [2007.0, "فالعقلُ إنما مدارُ إدراكه على الأمور السببيّة."], [2011.0, "وبما أنّ المعجزة خارجةٌ عن قوانين الطبيعة،"], [2016.0, "وعن السنن الكونيّة، وعن قواعد السببيّة،"], [2020.0, "فإنّ العقلَ لا يستطيع إدراكَها،"], [2022.8, "ولا يعرف كيف وقوعُها،"], [2025.0, "ولا ما القوّةُ العظيمة التي تقف وراء وقوعها."]], "tr": [[1990.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, beşerî aklın mûcizenin özünü tam olarak idrak etmesinin mümkün olmamasıdır."], [1999.7, "Çünkü mûcizeler tabiat kanunlarına tâbi değildir, aklın idrak ettiği sebeplilik ilişkisine de tâbi değildir;"], [2008.7, "aklın idraki ise ancak sebebe bağlı işler etrafında döner."], [2014.6, "Mûcize tabiat kanunlarının, kevnî sünnetlerin ve sebeplilik kaidelerinin dışında olduğuna göre, akıl onu idrak edemez, nasıl gerçekleştiğini ve gerçekleşmesinin arkasındaki büyük gücün ne olduğunu bilemez."]]}, {"reader": false, "ar": [[2030.0, "فالعقلُ مصمَّمٌ لفهم العالم المادّيّ فقط،"], [2035.0, "في حين أنّ المعجزاتِ هي من صنع الله عز وجل الذي يتجاوز هذه القوانينَ المادّيّة،"], [2043.0, "ولا يستطيع العقلُ أن يُدرك شيئًا من عظيم قدرة الله عز وجل."], [2048.0, "فالعقلُ إنما مدارُ إدراكه واستدلاله في الأمور التي يراها،"], [2053.9, "أو السببيّة التي يُحسّ بآثارها، أو يفهم معناها."]], "tr": [[2030.0, "Akıl yalnızca maddî âlemi anlamak için tasarlanmıştır;"], [2035.5, "mûcizeler ise bu maddî kanunları aşan Allah Azze ve Celle'nin işidir ve akıl Allah Azze ve Celle'nin büyük kudretinden hiçbir şeyi idrak edemez."], [2046.8, "Aklın idrak ve istidlali ancak gördüğü işler veya eserlerini hissettiği ya da manasını anladığı sebebe bağlı işler etrafında döner."]]}, {"reader": false, "ar": [[2061.0, "وأمّا المعجزاتُ فإنها أوسعُ من مدركات العقل؛"], [2066.0, "فمهما بلغ الإنسانُ في ذكائه وعظيم تفكيره فإنه لن يستطيع البتّةَ أن يُدرك شيئًا من كُنه هذه المعجزات."], [2077.0, "ولكنْ للعقل مدخلٌ في الاستدلال بها ـ بعد وقوعها ـ على صدق النبوّات،"], [2083.0, "وعلى وجود الله عز وجل،"], [2089.0, "وعلى الإيمان بعظيم قدرته تبارك وتعالى،"], [2093.0, "وعلى الإيمان بعظيم تدبيره وتصريفه. أليس كذلك؟"]], "tr": [[2061.0, "Mûcizeler ise aklın idrak ettiklerinden daha geniştir."], [2065.3, "İnsan zekâsında ve düşüncesinin büyüklüğünde ne kadar ileri giderse gitsin, bu mûcizelerin künhünden (özünden) hiçbir şeyi asla idrak edemeyecektir."], [2075.8, "Fakat aklın, gerçekleştikten sonra onlarla nübüvvetlerin doğruluğuna, Allah Azze ve Celle'nin varlığına, O'nun —Tebâreke ve Teâlâ— büyük kudretine imana ve O'nun büyük tedbir ve tasarrufuna imana istidlal etmede payı vardır. Öyle değil mi?"]]}, {"reader": false, "ar": [[2100.0, "فالعقلُ مجالُه في هذه المعجزات إنما هو الاستدلالُ بها،"], [2105.1, "لا النظرُ في كيفيّة وقوعها،"], [2108.4, "أو في كُنه وقوعها،"], [2111.1, "أو في سببيّة وقوعها."], [2114.0, "فهذه المعجزاتُ للرسل عليهم الصلاة والسلام لا سلطانَ للعقل عليها؛"], [2124.0, "لأنها لا تخضع لحكمه."], [2126.0, "فالعقلُ ـ مهما أوتي صاحبُه من الذكاء والعبقريّة والدهاء ـ لا يزال ضعيفًا قاصرًا كليلًا عاجزًا عن إدراك كلّ الحقائق،"], [2141.0, "وكما قال الله عز وجل:"], [2143.3, "<span class=\"ayah\">﴿وَمَا أُوتِيتُم مِّنَ الْعِلْمِ إِلَّا قَلِيلًا﴾<\/span> <span class=\"ref\">[الإسراء: ٨٥]<\/span>."]], "tr": [[2100.0, "Aklın bu mûcizelerdeki alanı, ancak onlarla istidlal etmektir;"], [2103.9, "gerçekleşme keyfiyetine, gerçekleşmesinin künhüne veya gerçekleşmesinin sebebine bakmak değildir."], [2109.1, "Resullerin —onlara salât ve selâm olsun— bu mûcizeleri üzerinde aklın hiçbir hâkimiyeti yoktur;"], [2116.8, "çünkü onlar onun hükmüne tâbi değildir."], [2124.0, "Akıl, sahibine ne kadar zekâ, deha ve kurnazlık verilmiş olursa olsun, bütün hakikatleri idrak etmekten hâlâ zayıf, yetersiz, yorgun ve âcizdir."], [2137.2, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2141.9, "<span class=\"ayah\">﴿Size ilimden ancak az bir şey verilmiştir﴾<\/span> [İsrâ 85]."]]}]}, {"ts": "35:46", "title": "4. Külliye (devam): Külliyenin önemi: Akılcılara inkâr kapısını kapatmak", "paras": [{"reader": false, "ar": [[2146.0, "وهذه الكلّيّةُ مهمّةٌ جدًّا؛"], [2148.7, "لأنها تسدّ أمام العقلانيّين بابَ إنكار هذه المعجزات."], [2156.0, "فإنّ من الأسباب التي جعلت العقلانيّين يُنكرون المعجزاتِ:"], [2161.5, "عدمَ دخول هذه المعجزات تحت مُدرَكات عقولهم."], [2165.0, "فمتى ما دخل العقلُ في إدراك كُنهِ هذه المعجزات فإنه سوف يُفضي به إلى التعطيل والإنكار والتكذيب بها،"], [2175.5, "ولا شكّ في ذلك."]], "tr": [[2146.0, "Bu külliye çok önemlidir; çünkü akılcıların önünde bu mûcizeleri inkâr kapısını kapatır."], [2156.0, "Akılcıları mûcizeleri inkâra sevk eden sebeplerden biri, bu mûcizelerin akıllarının idrak ettikleri şeylerin altına girmemesidir."], [2165.6, "Akıl bu mûcizelerin künhünü idrak etmeye girdiğinde, bu onu ta'tile, inkâra ve onları yalanlamaya götürecektir; bunda hiç şüphe yoktur."]]}, {"reader": false, "ar": [[2178.0, "ولذلك فهذه المعجزاتُ نقرؤها نحن ـ معاشرَ أهل السنّة والجماعة ـ في كتاب الله وفي سنّة رسول الله صلى الله عليه وسلم،"], [2186.0, "وتمرّ على قلوبنا مرورَ الكرام،"], [2190.0, "بتمام الإيمان، وكمال الإذعان والتسليم،"], [2193.1, "وعدم التشكيك والمعارضة؛ لأننا لا نجعلها خاضعةً لمدركات عقولنا،"], [2199.0, "إذ لا عقلَ في إعجاز،"], [2200.0, "لا عقلَ في إعجاز."], [2203.0, "فانتبهوا لذلك، والله أعلم."]], "tr": [[2178.0, "Bu yüzden biz Ehl-i Sünnet ve'l-Cemaat topluluğu bu mûcizeleri Allah'ın Kitabı'nda ve Resûlullah sallallâhu aleyhi ve sellem'in sünnetinde okuruz;"], [2185.2, "tam bir imanla, kemal derecesinde boyun eğme ve teslimle, şüphe uyandırmadan ve itiraz etmeden kalplerimizden kerîmce geçip giderler."], [2195.0, "Çünkü onları aklımızın idrakine tâbi kılmayız;"], [2198.3, "zira i'câzda akıl (hükmü) yoktur, i'câzda akıl yoktur."], [2200.8, "Buna dikkat edin. Allah en iyisini bilir."]]}]}, {"ts": "36:45", "title": "5. Külliye: Mûcizelere yönelik her saldırı nübüvvetlere saldırıdır", "paras": [{"reader": false, "ar": [[2205.0, "ومن الكلّيّات أيضًا: <b>كلُّ طعنٍ في المعجزات فطعنٌ في النبوّات.<\/b> كلُّ طعنٍ ـ اليومَ درسُنا خفيف،"], [2215.4, "ها ـ <b>كلُّ طعنٍ في المعجزات فطعنٌ في النبوّات.<\/b>"]], "tr": [[2205.0, "Külliyelerden biri de şudur: 5."], [2207.4, "külliye: Mûcizelere yönelik her saldırı nübüvvetlere saldırıdır. Her saldırı —bugün dersimiz hafif, hı?— Mûcizelere yönelik her saldırı nübüvvetlere saldırıdır."]]}, {"reader": false, "ar": [[2221.0, "وذلك لأننا قرّرنا سابقًا بأنّ طريقَ إثبات النبوّات أمران:"], [2238.0, "إمّا صفاتُ النبيّ الخُلُقيّة،"], [2240.0, "وإمّا بما يؤيّده الله عز وجل به ويُصدّق نبوّتَه من البراهين والمعجزات."], [2246.0, "فمن طعن في أخلاق النبيّ ـ فالطعنُ في أخلاقه طعنٌ في نبوّته."]], "tr": [[2221.0, "Bunun sebebi, daha önce nübüvvetleri isbat yolunun iki şey olduğunu ortaya koymuş olmamızdır:"], [2239.0, "Ya peygamberin ahlâkî sıfatları, ya da Allah Azze ve Celle'nin onu desteklediği ve nübüvvetini tasdik ettiği burhanlar ve mûcizeler."], [2248.1, "Peygamberin ahlâkına saldıran kimse —onun ahlâkına saldırmak nübüvvetine saldırmaktır."]]}, {"reader": false, "ar": [[2254.0, "ولذلك قال النبيّ صلى الله عليه وسلم:"], [2257.7, "«لا ينبغي لنبيٍّ أن يكون له خائنةُ الأعين»."], [2262.0, "فلا ينبغي للنبيّ أن يكون كذّابًا؛"], [2266.0, "فكلُّ من وصف النبيَّ بالكذب فقد طعن في نبوّته،"], [2270.8, "كما طعن المشركون بوصفه بأنه كاذب،"], [2274.0, "وبأنه ساحر، وبأنه يقول شيئًا من أساطير الأوّلين؛"], [2281.0, "كلُّ ذلك من باب الطعن في نبوّته،"], [2285.0, "لأنهم يطعنون في أخلاقه وأمانته وصدقه صلى الله عليه وسلم."]], "tr": [[2254.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2258.3, "\"Bir peygamberin göz hâini olması (gözle gizlice işaret etmesi) yakışmaz.\" Peygamberin yalancı olması yakışmaz."], [2266.0, "Peygamberi yalancılıkla niteleyen herkes onun nübüvvetine saldırmıştır;"], [2269.7, "tıpkı müşriklerin onu yalancı, sihirbaz ve öncekilerin masallarından bir şeyler söyleyen biri diye niteleyerek saldırdıkları gibi."], [2279.1, "Bütün bunlar onun nübüvvetine saldırı kabilindendir;"], [2283.9, "çünkü onlar onun —sallallâhu aleyhi ve sellem— ahlâkına, emanetine ve doğruluğuna saldırıyorlar."]]}, {"reader": false, "ar": [[2290.0, "وهناك مطعنٌ آخرُ في النبوّات،"], [2292.8, "وهو الطعنُ في تلك البراهين والآيات التي أجراها الله عز وجل على أيديهم."], [2302.3, "فإذا كانت البراهينُ من دلائل صدق النبوّة فالطعنُ فيها طعنٌ في النبوّة؛"], [2309.0, "فكلُّ من طعن في معجزة نبيٍّ أو برهان نبيٍّ فإنما يطعن في نبوّته."]], "tr": [[2290.0, "Nübüvvetlere yönelik bir saldırı noktası daha vardır:"], [2293.9, "Allah Azze ve Celle'nin onların ellerinde gerçekleştirdiği o burhanlara ve âyetlere saldırmak."], [2302.7, "Burhanlar nübüvvetin doğruluğunun delillerinden olduğuna göre, onlara saldırmak nübüvvete saldırmaktır."], [2308.2, "Bir peygamberin mûcizesine veya bir peygamberin burhanına saldıran herkes, aslında onun nübüvvetine saldırmaktadır."]]}, {"reader": false, "ar": [[2318.0, "وبناءً على شدّة الاتّصال بين إنكار المعجزات وإنكار النبوّة،"], [2323.0, "فإننا نرى الذين يكتبون عن الأنبياء عليهم الصلاة والسلام ممّن يصفون أنفسهم بالمثقّفين أو المفكّرين،"], [2334.0, "فدائمًا لا يتعرّضون للمعجزات التي أجراها الله عز وجل على يد الأنبياء،"], [2343.0, "وإنما يذكرون أخلاقَهم وأدبَهم وثقافتَهم وعلمَهم،"], [2348.0, "ويمدحونهم بشيءٍ من ذلك أبدًا،"], [2351.5, "لكن لا يتعرّضون لشيءٍ من معجزاتهم،"], [2356.0, "وكأنّ الأنبياءَ لا يمتازون عن الناس إلا بما يمتاز به العظماءُ من الأخلاق فقط."], [2362.0, "وهذا طعنٌ في النبوّة."]], "tr": [[2318.0, "Mûcizeleri inkâr etmek ile nübüvveti inkâr etmek arasındaki bu sıkı bağlantıya binaen görüyoruz ki peygamberler —onlara salât ve selâm olsun— hakkında yazan, kendilerini aydın veya düşünür diye niteleyenler, Allah Azze ve Celle'nin peygamberlerin elinde gerçekleştirdiği mûcizelere hiçbir zaman değinmezler."], [2345.3, "Sadece onların ahlâkını, edebini, kültürünü ve ilmini zikreder, onları bunlarla övüp dururlar;"], [2354.2, "fakat mûcizelerinden hiçbirine değinmezler. Sanki peygamberler insanlardan ancak büyük adamların ahlâkça ayrıldığı şeyle ayrılırlarmış gibi. Bu ise nübüvvete saldırıdır."]]}, {"reader": false, "ar": [[2367.0, "ولذلك ممّا يُؤخَذ على بعض المؤلّفين ـ رحمه الله تعالى ـ أنه لمّا جاء يتكلّم عن النبيّ صلى الله عليه وسلم وصفه بالعبقريّ،"], [2378.0, "فقال: «عبقريّة محمّد». وهذا خطأٌ عظيمٌ عند أهل السنّة والجماعة؛"], [2384.0, "وإنما ما جاء به النبيّ صلى الله عليه وسلم من ذلك الخُلُق العظيم ومن تلك الآيات إنما هي من عند الله عز وجل؛"], [2394.0, "فشيءٌ جبله الله عز وجل عليه من الأخلاق العظيمة،"], [2398.0, "ومن جريان تلك الآيات والبراهين الدالّة على صدق نبوّته."], [2405.0, "فاحذروا من الطعن في شيءٍ من هذه البراهين والآيات الدالّة على صدق النبوّات."]], "tr": [[2367.0, "Bu yüzden bazı yazarlara —Allah ona rahmet etsin— yöneltilen eleştirilerden biri şudur:"], [2373.8, "Peygamber sallallâhu aleyhi ve sellem hakkında konuşmaya girişince onu \"dâhi\" diye nitelemiş ve \"Muhammed'in Dehası\" demiştir."], [2381.4, "Bu, Ehl-i Sünnet ve'l-Cemaat nezdinde büyük bir hatadır."], [2384.9, "Bilakis Peygamber sallallâhu aleyhi ve sellem'in getirdiği o yüce ahlâk ve o âyetler, ancak Allah Azze ve Celle katındandır:"], [2392.3, "Bir kısmı Allah Azze ve Celle'nin onu üzerinde yarattığı büyük ahlâk, bir kısmı da onun nübüvvetinin doğruluğuna delalet eden o âyetlerin ve burhanların (elinde) gerçekleşmesidir."], [2405.7, "Nübüvvetlerin doğruluğuna delalet eden bu burhanlardan ve âyetlerden herhangi birine saldırmaktan sakının."]]}]}, {"ts": "40:13", "title": "6. Külliye: Bir mûcizeyi tahrif edip lügavî anlamından çıkaran onu inkâr etmiştir", "paras": [{"reader": false, "ar": [[2413.0, "ومن الكلّيّات أيضًا: <b>كلُّ من حرّف معجزةً وأخرجها عن مدلولها اللغويّ فمنكرٌ لها.<\/b> <span class=\"note\">(يكررها، ثم يقول: أعيدها مرّةً ثالثة، ويكررها)<\/span>"]], "tr": [[2413.0, "Külliyelerden biri de şudur: 6."], [2418.0, "külliye: Bir mûcizeyi tahrif edip onu lügavî (dilsel) anlamından çıkaran herkes onu inkâr etmiş olur. (Tekrar ediyor, sonra \"Üçüncü kez tekrar ediyorum\" deyip yeniden okuyor.)"]]}, {"reader": false, "ar": [[2422.0, "أقول وبالله التوفيق: وذلك لأنّ إنكارَ المعجزة له طريقان:"], [2451.0, "الطريقُ الأوّل: أن يُكذّبوا بأصل وجودها،"], [2455.3, "كالملاحدة وغيرهم؛ فالذين يُعطّلون اللهَ عن وجوده،"], [2459.9, "ويُعطّلونه عن أسمائه وصفاته وأفعاله وتدبيره وتصريفه،"], [2464.0, "فإنهم من باب أولى يُعطّلونه عن هذه المعجزات."]], "tr": [[2422.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, mûcizeyi inkârın iki yolu olmasıdır."], [2451.0, "Birinci yol: Mülhidler ve benzerleri gibi onun varlığının aslını yalanlamaları."], [2457.6, "Allah'ı varlığından ta'til eden, O'nu isimlerinden, sıfatlarından, fiillerinden, tedbir ve tasarrufundan ta'til edenler, evleviyetle O'nu bu mûcizelerden de ta'til ederler."]]}, {"reader": false, "ar": [[2468.0, "ولكنْ هناك طريقٌ آخر،"], [2470.2, "وهو الإيمانُ بألفاظها، وإخراجُها عن مدلولاتها الصحيحة،"], [2474.0, "وإقحامُ مدلولاتٍ غريبةٍ فيها."], [2477.0, "وهذا معروفٌ عن العصرانيّين الذين يكتبون في الأدب والفكر،"], [2482.8, "ويصفون أنفسهم ـ ويصف الواحدُ منهم نفسَه ـ بأنه مفكّرٌ إسلاميّ،"], [2488.6, "ولا أريد تسميةَ بعضهم؛"], [2497.0, "فإنهم يعمدون إلى هذه الآيات والبراهين ويؤمنون بها،"], [2502.3, "ولكنهم يُخرجونها عن مدلولاتها الصحيحة،"], [2505.6, "ويُقحمون فيها مدلولاتٍ أخرى."], [2510.0, "وهذا نوعٌ من أنواع التكذيب بها والتعطيل لها."]], "tr": [[2468.0, "Fakat başka bir yol daha vardır:"], [2470.7, "Onların lafızlarına iman edip onları sahih anlamlarından çıkarmak ve onlara yabancı anlamlar sokuşturmak."], [2477.6, "Bu, edebiyat ve fikir alanında yazan, kendilerini —içlerinden her biri kendini— \"İslamcı düşünür\" diye niteleyen asrîcilerden (modernistlerden) bilinen bir şeydir;"], [2488.6, "bazılarının adını vermek istemiyorum. Onlar bu âyetlere ve burhanlara yönelir ve onlara iman ederler;"], [2502.3, "fakat onları sahih anlamlarından çıkarır ve onlara başka anlamlar sokuştururlar."], [2510.0, "Bu da onları yalanlamanın ve ta'til etmenin türlerinden biridir."]]}, {"reader": false, "ar": [[2513.0, "كتعطيلهم لقول الله عز وجل:"], [2515.8, "<span class=\"ayah\">﴿اقْتَرَبَتِ السَّاعَةُ وَانشَقَّ الْقَمَرُ﴾<\/span> <span class=\"ref\">[القمر: ١]<\/span> بأنه انشقاقٌ سيحصل يومَ القيامة،"], [2520.7, "وليس انشقاقًا حصل على عهد النبيّ صلى الله عليه وسلم."], [2526.0, "وكتحريفهم لتكثير الطعام ونبع الماء بين يدَي النبيّ صلى الله عليه وسلم بأنه زيادةُ البركة،"], [2533.7, "ولكن ليست زيادةً حسّيّةً يراها الإنسانُ بكثرة طعامٍ أو كثرة ماء،"], [2540.0, "وغير ذلك ممّا ثبت عنهم من التحريف."], [2546.0, "فإنكارُ البرهان أو المعجزة إمّا أن يكون إنكارَ تكذيبٍ بأصله،"], [2552.6, "وإمّا إقرارًا بألفاظه وتحريفًا لمدلوله أو معناه،"], [2558.6, "وكلا الطريقين ضلالٌ وانحرافٌ عن جادّة الحقّ. فانتبهوا لذلك."]], "tr": [[2513.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Kıyamet yaklaştı ve ay yarıldı﴾<\/span> [Kamer 1] sözünü, bunun Peygamber sallallâhu aleyhi ve sellem zamanında gerçekleşmiş bir yarılma değil, kıyamet günü gerçekleşecek bir yarılma olduğunu söyleyerek ta'til etmeleri gibi."], [2527.0, "Peygamber sallallâhu aleyhi ve sellem'in önünde yemeğin çoğalmasını ve suyun fışkırmasını, bunun bereketin artması olduğunu, fakat insanın yemeğin veya suyun çoğalmasıyla gördüğü hissî bir artış olmadığını söyleyerek tahrif etmeleri gibi;"], [2540.0, "ve onlardan sabit olan diğer tahrifler gibi."], [2544.5, "Demek ki burhanı veya mûcizeyi inkâr, ya aslını yalanlayarak inkâr etmek, ya da lafızlarını ikrar edip anlamını veya manasını tahrif etmektir."], [2556.5, "Her iki yol da sapıklık ve hak caddeden sapmadır. Buna dikkat edin."]]}]}, {"ts": "42:48", "title": "7. Külliye: Peygamberlerin bütün mûcizeleri âdeti aşar, aklî zaruretleri değil", "paras": [{"reader": false, "ar": [[2568.0, "ومن الكلّيّات أيضًا: <b>كلُّ معجزات الأنبياء خارقةٌ للعادة لا للضروريّات العقليّة.<\/b> <span class=\"note\">(يكررها)<\/span> أعيدها مرّةً ثالثة:"], [2593.0, "<b>كلُّ معجزات الأنبياء خارقةٌ للعادة لا للضروريّات العقليّة.<\/b>"]], "tr": [[2568.0, "Külliyelerden biri de şudur: 7."], [2570.8, "külliye: Peygamberlerin bütün mûcizeleri âdeti aşar, aklî zaruretleri aşmaz. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [2593.6, "<b>Peygamberlerin bütün mûcizeleri âdeti aşar, aklî zaruretleri aşmaz.<\/b>"]]}, {"reader": false, "ar": [[2598.0, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أنّ من أعظم الخلط عند أهل البدع،"], [2608.0, "والذي جعلهم يُنكرون شيئًا من هذه المعجزات،"], [2612.0, "أنهم خلطوا بين خرق السنّة الكونيّة وبين خرق الضرورة العقليّة؛"], [2619.0, "فلذلك هم لا يفهمون من جريان تلك المعجزات ووقوعها إلا أنها أمورٌ تضرب في ضروريّات العقل."], [2630.0, "وهذا خطأٌ عظيمٌ وجسيم،"], [2632.0, "أفضى بهم إلى تعطيل الأنبياء عن معجزاتهم وبراهينهم."]], "tr": [[2598.0, "Tevfik Allah'tandır, derim ki: Bil ki —Allah sana rahmet etsin— bid'at ehlindeki en büyük karışıklıklardan biri ve onları bu mûcizelerden bir kısmını inkâra sevk eden şey, kevnî sünneti aşmak ile aklî zarureti aşmayı birbirine karıştırmalarıdır."], [2618.3, "Bu yüzden onlar o mûcizelerin cereyanından ve vukuundan, onların aklın zaruretleriyle çatışan işler olmasından başka bir şey anlamazlar."], [2629.3, "Bu, onları peygamberleri mûcizelerinden ve burhanlarından ta'til etmeye götüren büyük ve ağır bir hatadır."]]}, {"reader": false, "ar": [[2640.0, "وأمّا أهلُ السنّة والجماعة فإنهم يقولون بأنها خارقةٌ للعادة،"], [2648.0, "أي: بمعنى أنها خارقةٌ للسنّة الكونيّة الدائمة."], [2652.0, "فالله عز وجل لمّا خلق كونَه جعله على سنّةٍ دائمةٍ جارية،"], [2660.0, "ولكنه يستثني أحيانًا فيخرق هذه السنّةَ الكونيّة،"], [2665.0, "ليجعل خرقَه لها معجزةً وبرهانًا وآيةً على صدق نبيٍّ من الأنبياء."], [2671.0, "فالمعجزاتُ جرت في كون الله على خلاف الأمر الدائم؛"], [2677.0, "فهي أمرٌ استثنائيٌّ أجراه الله عز وجل في كونه ليُظهر صدقَ نبيٍّ من أنبيائه،"], [2684.0, "أو صدقَ رسولٍ من رسله."]], "tr": [[2640.0, "Ehl-i Sünnet ve'l-Cemaat ise onların âdeti aştığını, yani daimî kevnî sünneti aştığını söyler."], [2649.7, "Allah Azze ve Celle kâinatını yarattığında onu daimî ve câri bir sünnet üzerine kıldı."], [2658.9, "Fakat bazen istisna yapar ve bu kevnî sünneti aşar;"], [2665.5, "böylece onu aşmasını, peygamberlerden birinin doğruluğuna bir mûcize, burhan ve âyet kılar."], [2671.7, "Mûcizeler Allah'ın kâinatında daimî işin hilafına cereyan etmiştir."], [2677.0, "O, Allah Azze ve Celle'nin peygamberlerinden birinin veya resullerinden birinin doğruluğunu ortaya koymak için kâinatında gerçekleştirdiği istisnaî bir iştir."]]}, {"reader": false, "ar": [[2687.0, "ولكنْ تبقى أنها لا تتعرّض للضروريّات العقليّة أبدًا؛"], [2694.0, "فلا نعلم معجزةً جرت على خلاف الضروريّات العقليّة،"], [2699.0, "وإنما المعجزاتُ كلُّها تخرق السنّةَ الكونيّة."]], "tr": [[2687.0, "Fakat şu kesin olarak kalır:"], [2689.9, "Onlar aklî zaruretlere asla dokunmaz."], [2694.6, "Aklî zaruretlerin hilafına cereyan eden hiçbir mûcize bilmiyoruz;"], [2699.0, "bilakis mûcizelerin hepsi kevnî sünneti aşar."]]}, {"reader": false, "ar": [[2703.0, "فكونُ العصا تنقلب ثعبانًا هذا ليس خرقًا للضروريّات العقليّة."], [2712.0, "لماذا؟ لأنّ العقلَ يفرض بأنّ خالقَ الثعبان أوّلَ مرّةٍ قادرٌ على أن يخلقه من مادّةٍ أخرى."], [2721.0, "وانفلاقُ البحر لموسى عليه الصلاة والسلام ليس خرقًا للضروريّات العقليّة؛"], [2727.0, "لأنّ الله قادرٌ على أن يُجفّف بقعةً خلق فيها ماءً،"], [2732.0, "فالذي خلق الماءَ فيها أوّلَ مرّةٍ قادرٌ على أن يجعلها جافّةً،"], [2737.0, "كاستثناءٍ من الأصل الع
