امّ."]], "tr": [[2703.0, "Asanın ejderhaya dönüşmesi, aklî zaruretleri aşmak değildir."], [2710.8, "Neden? Çünkü akıl, yılanı ilk defa yaratanın onu başka bir maddeden de yaratmaya kadir olduğunu gerekli görür."], [2720.4, "Denizin Mûsâ aleyhisselâm için yarılması da aklî zaruretleri aşmak değildir;"], [2727.0, "çünkü Allah, içinde su yarattığı bir yeri kurutmaya kadirdir."], [2731.5, "Oradaki suyu ilk defa yaratan, genel asıldan bir istisna olarak orayı kuru kılmaya da kadirdir."]]}, {"reader": false, "ar": [[2740.0, "فحقيقةُ المعجزات التي أجراها الله على يد الأنبياء إنما هي أمورٌ استثنائيّة،"], [2747.0, "استثنائيّة، اقتضاها إثباتُ صحّة النبوّة،"], [2754.0, "وإلّا فالأمرُ لا يتعرّض لشيءٍ من خرق الضروريّات العقليّة أبدًا."]], "tr": [[2740.0, "Allah'ın peygamberlerin elinde gerçekleştirdiği mûcizelerin hakikati, nübüvvetin sıhhatini isbat etmenin gerektirdiği istisnaî, istisnaî işlerdir."], [2750.6, "Yoksa mesele aklî zaruretleri aşmaktan hiçbir şeye asla dokunmaz."]]}]}, {"ts": "46:03", "title": "7. Külliye (devam): Aklî zaruret örnekleri", "paras": [{"reader": false, "ar": [[2763.0, "فإن قلتَ: هلّا ضربتَ لنا أمثلةً على ضرورةٍ عقليّة؟"], [2767.0, "الجوابُ: نعم، كقولك بأنّ الجزءَ بعضُ الكلّ،"], [2771.0, "وأنّ الكلَّ أكبرُ من الجزء؛"], [2774.0, "فأتحدّاك أن تأتيَني بمعجزةٍ من معجزات الأنبياء تخرق هذه الضرورةَ العقليّة."], [2780.0, "فلم يُجرِ الله عز وجل على يد نبيٍّ أو رسولٍ من رسله وأنبيائه معجزةً تقتضي بأنّ الجزءَ أكبرُ من الكلّ،"], [2788.7, "أو أنّ الكلَّ أصغرُ من الجزء."]], "tr": [[2763.0, "Eğer \"Bize bir aklî zaruret hakkında örnekler verseydin ya!\" dersen, cevap:"], [2767.5, "Evet. Parçanın bütünün bir kısmı olduğunu ve bütünün parçadan büyük olduğunu söylemen gibi."], [2774.5, "Sana meydan okuyorum: Peygamberlerin mûcizelerinden bu aklî zarureti aşan bir mûcize getir bana."], [2780.9, "Allah Azze ve Celle resullerinden ve peygamberlerinden hiçbir peygamberin veya resulün elinde, parçanın bütünden büyük ya da bütünün parçadan küçük olmasını gerektiren bir mûcize gerçekleştirmemiştir."]]}, {"reader": false, "ar": [[2791.0, "وكما أنّ الواحدَ نصفُ الاثنين،"], [2793.8, "فإنّ هذه ضرورةٌ عقليّة،"], [2796.0, "والمعجزاتُ لا يمكن أن تخرق ضروراتٍ عقليّةً أبدًا."], [2800.0, "وكاجتماع النقيضين، فإنّ الضرورةَ العقليّة تأباه،"], [2805.5, "أو رفع النقيضين، فإنّ الضرورةَ العقليّة تأباه."], [2814.0, "ولذلك ليس ثَمّةَ معجزةٌ أجراها الله على يد نبيٍّ أو رسولٍ تقتضي الجمعَ بين النقيضين،"], [2822.0, "ولا تقتضي ارتفاعَ النقيضين،"], [2826.0, "ولا جمعَ الحركة والسكون في وقتٍ واحدٍ وموضعٍ واحد. فهمتم هذا؟"]], "tr": [[2791.0, "Aynı şekilde birin ikinin yarısı olması bir aklî zarurettir;"], [2794.9, "mûcizelerin aklî zaruretleri aşması asla mümkün değildir."], [2797.5, "İki çelişiğin bir araya gelmesi gibi;"], [2800.0, "aklî zaruret onu reddeder. Ya da iki çelişiğin birlikte ortadan kalkması;"], [2809.5, "aklî zaruret onu da reddeder."], [2814.0, "Bu yüzden Allah'ın bir peygamberin veya resulün elinde gerçekleştirdiği, iki çelişiği bir araya getirmeyi, iki çelişiğin ortadan kalkmasını ya da hareket ile sükûnun aynı anda ve aynı yerde bir araya gelmesini gerektiren hiçbir mûcize yoktur. Bunu anladınız mı?"]]}, {"reader": false, "ar": [[2835.0, "فالذين يُنكرون المعجزاتِ لأنها تُعارض ـ يقول <span class=\"q\">؟ 47:20<\/span>:"], [2840.4, "بدعوى أنها تُعارض ـ العقلَ،"], [2842.0, "سببُ ذلك أنهم خلطوا بين خرق السنّة الكونيّة الدائمة استثناءً وبين خرق الضرورة العقليّة."], [2853.0, "فتأتي هذه الكلّيّةُ لتردَّ عليهم،"], [2856.5, "ولتُفرّق بين المختلفين، لتزول هذه الشبهة."], [2863.0, "فإذًا لا بدّ أن نُفرّق بين خارق العادة الممكن ـ أو نقول:"], [2868.8, "خارق سنّة الكون الممكن ـ وبين خارق العقل المستحيل."]], "tr": [[2835.0, "Mûcizeleri aklı muâraza ettiği için —(yani) <span class=\"q\">؟<\/span> aklı muâraza ettiği iddiasıyla— inkâr edenlerin bunu yapmasının sebebi, daimî kevnî sünneti istisna yoluyla aşmak ile aklî zarureti aşmayı birbirine karıştırmalarıdır."], [2848.8, "İşte bu külliye onlara reddiye olmak, birbirinden farklı iki şeyi ayırmak ve bu şüpheyi gidermek için gelir."], [2859.9, "Öyleyse mümkün olan âdeti aşan şey —ya da mümkün olan kâinat sünnetini aşan şey diyelim— ile muhal olan aklı aşan şey arasında mutlaka ayırım yapmalıyız."]]}, {"reader": false, "ar": [[2873.0, "فالمعجزاتُ لا تخرق شيئًا من ضرورات العقل أبدًا،"], [2877.9, "ولكنها تخرق السنّةَ الكونيّة الدائمة خرقَ استثناءٍ لضرورة إثبات صدق هذا النبيّ،"], [2886.0, "أو لغير ذلك من الحِكَم التي يريدها الله عز وجل،"], [2889.0, "أو يريد الله عز وجل إظهارَها على يد أنبيائه ورسله."], [2895.0, "أفهمتم هذا؟ الكلّيّةُ واضحةٌ إن شاء الله؟ جيّد."]], "tr": [[2873.0, "Mûcizeler aklın zaruretlerinden hiçbir şeyi asla aşmaz;"], [2877.3, "fakat daimî kevnî sünneti, bu peygamberin doğruluğunu isbat zaruretiyle veya Allah Azze ve Celle'nin murad ettiği ya da peygamberlerinin ve resullerinin elinde ortaya çıkarmayı murad ettiği diğer hikmetler için istisna yoluyla aşar."], [2894.4, "Bunu anladınız mı? Külliye inşallah açık mı? Güzel."]]}]}, {"ts": "48:20", "title": "7. Külliye (devam): Kevnî sünnetin devamı aklî bir zaruret değildir · Kerametler", "paras": [{"reader": false, "ar": [[2900.0, "فإن قلتَ: ولماذا لا نجعلها خارقةً للضرورة العقليّة،"], [2905.0, "إذ من ضرورات العقل بقاءُ السنّة الكونيّة على حالها؟"], [2911.0, "فنقول: هذا ليس من ضرورات العقل؛"], [2914.0, "فليس هناك ضرورةٌ عقليّةٌ تقتضي أنّ سنّةَ الله في كونه لا بدّ أن تبقى على حالها؛"], [2921.0, "لأنّ الذي سنّها قادرٌ على أن يرفعها."], [2924.0, "فالعقلُ يفرض أنّ من قدر على الشيء أوّلَ مرّةٍ قادرٌ على أن يتصرّف فيه كيفما شاء؛"], [2932.0, "فإذا كان الذي أوجدها على هذا النظام الدائم أوّلَ مرّةٍ قادرًا على أن يُوقف نظامَها ثانيَ مرّة،"]], "tr": [[2900.0, "Eğer \"Neden onları aklî zarureti aşan şeyler saymıyoruz?"], [2905.0, "Zira kevnî sünnetin olduğu hâl üzere kalması aklın zaruretlerindendir\" dersen, deriz ki:"], [2912.5, "Bu aklın zaruretlerinden değildir. Allah'ın kâinatındaki sünnetinin mutlaka olduğu hâl üzere kalmasını gerektiren hiçbir aklî zaruret yoktur;"], [2920.4, "çünkü onu koyan, onu kaldırmaya kadirdir."], [2923.1, "Akıl, bir şeye ilk defa gücü yetenin onda dilediği gibi tasarruf etmeye de kadir olduğunu gerekli görür."], [2932.0, "Onu ilk defa bu daimî düzen üzere var eden, ikinci defa düzenini durdurmaya kadir olduğuna göre,"]]}, {"reader": false, "ar": [[2941.0, "فليس هذا من خرق الضرورات العقليّة أبدًا."], [2945.5, "ولكنهم ـ أي أهلُ البدع ـ من غفلتهم يقيسون الإمكانَ والاستحالةَ بمقياس قدرة الإنسان،"], [2953.1, "وينسون كمالَ قدرة الله عز وجل وعظمتَه."], [2958.0, "وهذا من مآخذ إنكار الكرامة،"], [2963.1, "وهو دعوى أنها تُعارض الضروريّاتِ العقليّة."]], "tr": [[2941.0, "bu asla aklî zaruretleri aşmak değildir."], [2944.2, "Fakat onlar —yani bid'at ehli— gafletlerinden dolayı imkânı ve imkânsızlığı insanın kudretinin ölçüsüyle ölçerler;"], [2951.9, "Allah Azze ve Celle'nin kudretinin kemalini ve azametini unuturlar."], [2957.0, "Bu, kerameti inkârın dayanaklarından biridir;"], [2960.4, "o da kerametin aklî zaruretlere aykırı olduğu iddiasıdır."]]}, {"reader": false, "ar": [[2970.0, "فيقول السنّيّ: بأنه ليس هناك كرامةٌ تُعارض شيئًا من الضرورات العقليّة،"], [2975.0, "وإنما حقيقتُها أنها تخرق السنّةَ الكونيّة الدائمة خرقَ استثناء،"], [2981.0, "خرقَ استثناءٍ لحكمةٍ يعلمها الله عز وجل،"], [2985.9, "من تصديق النبيّ، أو إنجائه ممّن أراده بسوء، أو غير ذلك."]], "tr": [[2970.0, "Sünnî ise şöyle der: Aklî zaruretlerden herhangi birine aykırı olan hiçbir keramet yoktur."], [2974.5, "Onun hakikati, daimî kevnî sünneti istisna yoluyla aşmasıdır;"], [2979.0, "Allah Azze ve Celle'nin bildiği bir hikmet için istisna yoluyla aşmasıdır:"], [2985.9, "Peygamberi tasdik etmek, kendisine kötülük murad edenden onu kurtarmak veya başka bir hikmet."]]}, {"reader": false, "ar": [[2989.8, "فكما تكون إماتةُ الأحياء ـ انتبه ـ فكما تكون إماتةُ الأحياء من القَتَلة بإذن الله،"], [3001.0, "فيكون إحياءُ الموتى من أنبياء الله عز وجل أيضًا بإذنه،"], [3008.5, "كما كانت معجزةُ عيسى عليه الصلاة والسلام،"], [3015.0, "ولا فرقَ بين الحالين."], [3017.0, "فإنّ الذي أجرى السنّةَ على هذا النظام قادرٌ على أن يسلب هذا النظامَ سلبَ استثناءٍ لحكمةٍ يعلمها."]], "tr": [[2989.8, "Dirileri öldürmenin —dikkat et— dirileri öldürmenin katillerden Allah'ın izniyle olması gibi, ölüleri diriltmek de Allah Azze ve Celle'nin peygamberlerinden yine O'nun izniyle olur;"], [3008.5, "tıpkı İsâ aleyhisselâmın mûcizesinin olduğu gibi."], [3013.5, "İki durum arasında hiçbir fark yoktur."], [3017.5, "Sünneti bu düzen üzere cereyan ettiren, bildiği bir hikmet için bu düzeni istisna yoluyla kaldırmaya kadirdir."]]}, {"reader": false, "ar": [[3028.0, "والمقصودُ من هذه الكلّيّة هو وجوبُ التفريق بين ما كان خارقًا للسنّة الكونيّة أو العادة،"], [3035.9, "وبين ما كان خارقًا للمستحيل العقليّ."], [3040.0, "فليس هناك معجزةٌ تضرب في مستحيلٍ عقليّ،"], [3043.0, "ولكن هناك معجزةٌ تخرق العادةَ الكونيّة أو السنّةَ الكونيّة."], [3050.0, "ولعلّي استطعتُ أن أُوصلها لكم إن شاء الله."]], "tr": [[3028.0, "Bu külliyeden maksat, kevnî sünneti veya âdeti aşan şey ile aklî muhali aşan şey arasında ayırım yapmanın vacip olmasıdır."], [3040.0, "Aklî bir muhalle çatışan hiçbir mûcize yoktur;"], [3043.7, "fakat kevnî âdeti veya kevnî sünneti aşan mûcize vardır."], [3050.5, "Umarım inşallah bunu size ulaştırabilmişimdir."]]}]}, {"ts": "50:52", "title": "8. Külliye: Bir şeyi tam kudretle bir düzen üzere var eden, onu tam kudretle değiştirmeye kadirdir", "paras": [{"reader": false, "ar": [[3052.0, "ومن الكلّيّات أيضًا ـ ويوضّح هذا أيضًا الأمرَ الثاني إن شاء الله ـ نعم،"], [3058.0, "الكلّيّةُ كم؟ الثامنة: <b>كلُّ من أوجد الشيءَ على نظامٍ بالقدرة التامّة قادرٌ على تغييره بالقدرة التامّة.<\/b> لو تأمّلتم في هذه الكلّيّة لوجدتموها أجوبةً على شُبَهٍ أثارها أهلُ البدع في إنكار الكرامات،"], [3078.0, "وأنا جعلتُها ككلّيّةٍ لأهمّيّتها:"], [3082.0, "<b>كلُّ من أوجد الشيءَ على نظامٍ بالقدرة التامّة قادرٌ على تغييره بالقدرة التامّة.<\/b>"]], "tr": [[3052.0, "Külliyelerden biri de şudur —inşallah ikinci meseleyi de bu açıklar—:"], [3056.4, "Evet, külliye kaçıncıydı? Sekizinci: 8."], [3058.0, "külliye: Bir şeyi tam bir kudretle bir düzen üzere var eden herkes, onu tam bir kudretle değiştirmeye kadirdir. Bu külliye üzerinde düşünürseniz onu, bid'at ehlinin kerametleri inkâr hususunda ortaya attığı şüphelere cevaplar olarak bulursunuz."], [3076.5, "Önemi sebebiyle onu bir külliye olarak koydum:"], [3080.6, "<b>Bir şeyi tam bir kudretle bir düzen üzere var eden herkes, onu tam bir kudretle değiştirmeye kadirdir.<\/b>"]]}, {"reader": false, "ar": [[3096.0, "والكلامُ في هذه الكلّيّة إنما هو عن الله تبارك وتعالى."], [3101.0, "فالله عز وجل هو الذي أجرى أنّ الولادة تكون بين زوجين،"], [3104.0, "فهو قادرٌ على أن يُوجِدها من أبٍ بلا أمّ،"], [3109.0, "وقادرٌ على أن يُوجِدها من أمٍّ بلا أب،"], [3113.0, "وقادرٌ على أن يُوجِد ابتداءً من غير أبٍ ولا أمّ."]], "tr": [[3096.0, "Bu külliyedeki söz ancak Allah Tebâreke ve Teâlâ hakkındadır."], [3101.0, "Doğumun iki eş arasında olmasını cari kılan Allah Azze ve Celle'dir;"], [3105.1, "O, onu annesiz bir babadan var etmeye, babasız bir anneden var etmeye ve başlangıçta babasız ve annesiz olarak var etmeye kadirdir."]]}, {"reader": false, "ar": [[3121.0, "والذي أجرى في كونه أنّ ملكَ الموت يقبض أرواحَ من شاء أن يقبضَ اللهُ عز وجل روحَه،"], [3129.0, "قادرٌ على أن يأمره بإعادته في جسده مرّةً أخرى."], [3134.0, "والذي قدر القدرةَ الكاملة على أن يجعل أمواجَ البحر مستويةً،"], [3141.0, "قادرٌ القدرةَ الكاملة على أن يجعلها طوفانًا عظيمًا يُهلك الحرثَ والنسل، بأمره تبارك وتعالى."]], "tr": [[3121.0, "Kâinatında ölüm meleğinin, Allah Azze ve Celle'nin ruhunu almayı dilediği kimselerin ruhlarını almasını cari kılan, ona ruhu bedenine tekrar iade etmesini emretmeye kadirdir."], [3131.8, "Deniz dalgalarını düz kılmaya tam bir kudretle gücü yeten, onları —Tebâreke ve Teâlâ'nın emriyle— ekini ve nesli helâk eden büyük bir tufan kılmaya da tam bir kudretle kadirdir."]]}, {"reader": false, "ar": [[3153.0, "والذي قدر القدرةَ الكاملة على إمراض الجسد ببعض الأمراض،"], [3161.0, "قادرٌ إعجازًا على أن يرفعه بلا سببيّةٍ ظاهرة."], [3164.0, "فكلُّ من وضع نظامًا على أمرٍ معيّنٍ فهو قادرٌ على أن يُعطّل هذا النظام،"], [3172.0, "أو أن يُغيّره عن مساره لحكمةٍ يعلمها،"], [3175.0, "والله عز وجل هو الحكيمُ الخبيرُ ذو القدرة التامّة."]], "tr": [[3153.0, "Bedeni bazı hastalıklarla hasta etmeye tam bir kudretle gücü yeten, mûcize olarak onu görünür bir sebep olmaksızın kaldırmaya da kadirdir."], [3164.6, "Belirli bir iş üzerine bir düzen koyan herkes, bildiği bir hikmet için bu düzeni işlemez hâle getirmeye veya onu yolundan değiştirmeye kadirdir."], [3174.6, "Allah Azze ve Celle ise Hakîm'dir, Habîr'dir, tam kudret sahibidir."]]}, {"reader": false, "ar": [[3181.0, "وهذه الكلّيّةُ تُبيّن لك أنّ أمرَ المعجزات ليس أمرًا يضرب في ضرورةٍ عقليّة؛"], [3189.0, "لأنها سلبُ شيءٍ ممّن وضع الشيءَ أصالةً."], [3198.0, "أنتم معي ولّا لا؟"], [3201.0, "لأنّ حقيقتَها سلبُ شيءٍ ممّن وضع الشيءَ أصالةً؛"], [3208.0, "فالله عز وجل يضع الشيءَ أصالةً،"], [3210.8, "ثم يسلب شيئًا من خصائص هذا الشيء."]], "tr": [[3181.0, "Bu külliye sana mûcizeler meselesinin aklî bir zaruretle çatışan bir mesele olmadığını açıklar;"], [3187.2, "çünkü o, bir şeyi aslen koyanın (o şeyden) bir şeyi çekip almasıdır."], [3193.5, "Benimle misiniz, değil misiniz? Çünkü onun hakikati, bir şeyi aslen koyanın (o şeyden) bir şeyi çekip almasıdır."], [3208.0, "Allah Azze ve Celle bir şeyi aslen koyar, sonra bu şeyin özelliklerinden bir şeyi çekip alır."]]}, {"reader": false, "ar": [[3214.0, "والذي جعل النارَ محرِقةً ابتداءً قادرٌ على أن يجعلها في بعض الأحايين باردةً،"], [3221.6, "أو نقول: <span class=\"ayah\">﴿بَرْدًا وَسَلَامًا﴾<\/span> <span class=\"ref\">[الأنبياء: ٦٩]<\/span>."], [3224.0, "والذي جعل الشمسَ مضيئةً مستنيرةً،"], [3233.0, "والقمرَ مضيئًا مستنيرًا، قادرٌ على أن يخلق هذا النورَ في يد نبيٍّ من الأنبياء."], [3243.0, "ولّا لا يا جماعة؟ وهكذا، الأمرُ واضح."]], "tr": [[3214.0, "Ateşi başlangıçta yakıcı kılan, onu bazı zamanlarda soğuk kılmaya kadirdir;"], [3219.3, "ya da <span class=\"ayah\">﴿serin ve esenlik﴾<\/span> [Enbiyâ 69] diyelim."], [3224.0, "Güneşi ışık saçan ve aydınlık, ayı da ışık saçan ve aydınlık kılan, bu nuru peygamberlerden bir peygamberin elinde yaratmaya kadirdir."], [3243.0, "Değil mi arkadaşlar? Bu böyledir; mesele açıktır."]]}]}, {"ts": "54:07", "title": "9. Külliye: Bütün mûcizelerin şanı açık ve kesin olmaktır", "paras": [{"reader": false, "ar": [[3247.0, "ومن الكلّيّات أيضًا: <b>كلُّ المعجزات من شأنها الظهورُ والقطعيّة.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[3247.0, "Külliyelerden biri de şudur: 9."], [3250.0, "külliye: Bütün mûcizelerin şanı açık ve kesin olmaktır. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[3265.0, "وذلك لأنّ من حكمة الله عز وجل في إجرائها على يد أنبيائه ورسله أنها تُصدّق نبوّتَهم،"], [3274.0, "ولا يُنتفَع بالدليل إذا حصل خفيًّا لا يراه أحد."], [3280.0, "ولذلك فإنّ هذه المعجزاتِ رآها المسلمون والكفّارُ والإنسُ والجنّ؛"], [3287.0, "فالجميعُ رأوا تلك العصا قد انقلبت حيّةً،"], [3293.0, "ورأوا ذلك البحرَ قد انفلق،"], [3298.0, "فرآه موسى وبنو إسرائيل، ورآه فرعونُ وقومُه."]], "tr": [[3265.0, "Bunun sebebi, Allah Azze ve Celle'nin onları peygamberlerinin ve resullerinin elinde gerçekleştirmesindeki hikmetlerden birinin, onların nübüvvetini tasdik etmesi olmasıdır."], [3274.0, "Delil, kimsenin görmediği gizli bir şekilde meydana gelirse ondan faydalanılmaz."], [3280.0, "Bu yüzden bu mûcizeleri Müslümanlar, kâfirler, insanlar ve cinler gördü."], [3287.0, "Hepsi o asanın yılana dönüştüğünü gördü, o denizin yarıldığını gördü;"], [3294.6, "onu Mûsâ ve İsrâiloğulları da gördü, Firavun ve kavmi de gördü."]]}, {"reader": false, "ar": [[3302.0, "ورأى الناسُ كيف أجرى الله عز وجل على يد نبيّه عيسى إبراءَ الأكمه والأبرص وإحياءَ الموتى."], [3312.0, "فلم يحصل شيءٌ من المعجزات على وجه الخُفية،"], [3317.0, "وإنما كلُّ معجزات الله فمن شأنها أن تكون ظاهرةً؛"], [3321.0, "لأنها تُعتبَر دليلًا على صدق النبوّة،"], [3324.0, "والدليلُ لا ينتفع الناسُ به إذا كان من شأنه الخفاء،"], [3328.0, "بل لا بدّ أن يكون ظاهرًا قطعيًّا جليًّا يراه كلُّ أحدٍ ليتحقّق المقصودُ منه."]], "tr": [[3302.0, "İnsanlar, Allah Azze ve Celle'nin peygamberi İsâ'nın elinde doğuştan körü ve alacalıyı iyileştirmeyi ve ölüleri diriltmeyi nasıl gerçekleştirdiğini gördüler."], [3313.9, "Mûcizelerden hiçbiri gizli bir şekilde meydana gelmemiştir;"], [3317.9, "bilakis Allah'ın bütün mûcizelerinin şanı açık olmaktır."], [3321.5, "Çünkü onlar nübüvvetin doğruluğuna delil sayılır;"], [3324.4, "şanı gizlilik olan delilden ise insanlar faydalanmaz."], [3327.2, "Bilakis ondan maksadın gerçekleşmesi için onun açık, kesin, belirgin ve herkesin göreceği şekilde olması gerekir."]]}]}, {"ts": "55:37", "title": "9. Külliye (devam): Peygamberin mûcizesi ile velînin kerameti arasındaki fark", "paras": [{"reader": false, "ar": [[3337.0, "وهذا من جملة الفروق بين معجزة النبيّ وكرامة الوليّ؛"], [3342.0, "فإنّ كرامةَ الوليّ يُشرَع إخفاؤها وعدمُ إظهارها،"], [3347.0, "لا سيّما إذا كان في إظهارها شيءٌ من العُجب،"], [3351.8, "أو الوصول إلى الرياء والفخر بها."], [3355.0, "فقد يُجري الله عز وجل كرامةً على يد وليٍّ في حال خلوته،"], [3362.1, "فيُستحَبّ له إبقاؤها خفيّةً وألّا يُظهرها؛"], [3367.0, "لأنه ليس من مقاصد جريان الكرامة على يد الوليّ إثباتُ ولايته،"], [3374.0, "وإنما من باب تأييده،"], [3376.3, "أو نصرته، أو إعانته،"], [3378.6, "أو تثبيته على إيمانه، ونحو ذلك."]], "tr": [[3337.0, "Bu, peygamberin mûcizesi ile velînin kerameti arasındaki farklardan biridir."], [3341.4, "Velînin kerametini gizlemek ve açığa vurmamak meşrudur;"], [3345.6, "özellikle onu açığa vurmakta bir miktar ucub (kendini beğenme) varsa veya riyaya ve onunla övünmeye götürüyorsa."], [3353.4, "Allah Azze ve Celle bir velînin elinde, o yalnız başınayken bir keramet gerçekleştirebilir;"], [3360.2, "onun için onu gizli tutması ve açığa vurmaması müstehaptır."], [3366.3, "Çünkü kerametin velînin elinde gerçekleşmesinin maksatlarından biri onun velâyetini isbat etmek değildir;"], [3373.0, "bilakis onu desteklemek, ona yardım etmek, onu yardımlamak veya onu imanında sabit kılmak ve benzeri kabilindendir."]]}, {"reader": false, "ar": [[3382.0, "فمقاصدُ الكرامة أوسعُ من مقاصد المعجزات."], [3390.0, "ولذلك فإنّ المعجزةَ من أدلّتها الحسّ؛"], [3395.0, "لأنّ الناس رأوها وشاهدوها بأعينهم،"], [3401.0, "والرؤيةُ دليلٌ حسّيّ، ودليلُ الحسّ قطعيّ."]], "tr": [[3382.0, "Kerametin maksatları mûcizelerin maksatlarından daha geniştir."], [3385.1, "Bu yüzden mûcizenin delillerinden biri histir (duyulardır);"], [3393.1, "çünkü insanlar onu gördüler ve gözleriyle müşahede ettiler."], [3398.2, "Görmek hissî bir delildir; his delili ise kesindir."]]}, {"reader": false, "ar": [[3407.0, "ولذلك فنحن نقطع بأنّ الله عز وجل أجرى هذه المعجزاتِ على يد أنبيائه ورسله؛"], [3415.0, "لأنّ الناس رأوها وتناقلوها وسطّروها،"], [3419.0, "ونزلت بها كتبُ الله عز وجل،"], [3422.0, "وتناقلتها الأخبارُ وكتبُ التاريخ،"], [3424.0, "وتناقلها السالفُ عن الخالف،"], [3427.0, "حتى صار النقلُ بها متواترًا،"], [3430.0, "لا يسع العقلَ أن يُكذّبه،"], [3432.5, "ولا يسع لأحدٍ أن يُنكره أو يُعطّله."]], "tr": [[3407.0, "Bu yüzden biz, Allah Azze ve Celle'nin bu mûcizeleri peygamberlerinin ve resullerinin elinde gerçekleştirdiğini kesin olarak biliriz."], [3414.4, "Çünkü insanlar onları gördüler, birbirlerine naklettiler ve yazıya geçirdiler;"], [3419.5, "Allah Azze ve Celle'nin kitapları onlarla indi;"], [3422.5, "haberler ve tarih kitapları onları nakletti;"], [3425.5, "öncekiler sonrakilere naklettiler. Öyle ki onlara dair nakil mütevâtir hâle geldi;"], [3431.0, "aklın onu yalanlamasına, kimsenin onu inkâr etmesine veya ta'til etmesine imkân yoktur."]]}]}, {"ts": "57:16", "title": "10. Külliye: Her peygamber ve resul, doğruluğunu gösteren bir âyet ve burhanla desteklenmiştir", "paras": [{"reader": false, "ar": [[3436.0, "ومن الكلّيّات أيضًا: <b>كلُّ نبيٍّ ورسولٍ فمؤيَّدٌ بآيةٍ وبرهانٍ يدلّ على صدقه.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[3436.0, "Külliyelerden biri de şudur: 10."], [3438.2, "külliye: Her peygamber ve resul, doğruluğuna delalet eden bir âyet ve burhanla desteklenmiştir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[3454.0, "أقول وبالله التوفيق: وهذا أمرٌ لا بدّ أن نقطع به،"], [3459.0, "سواءٌ نُقلت لنا عن هذا النبيّ أو لم تُنقَل."], [3467.0, "لكننا نقطع بأنه ما من نبيٍّ نبّأه الله،"], [3471.3, "ولا من رسولٍ أرسله الله،"], [3474.0, "إلا ولا بدّ أن يجريَ على يديه شيءٌ من هذه المعجزات،"], [3478.7, "قلّت أو كثرت، سواءٌ نُقلت أو لم تُنقَل."]], "tr": [[3454.0, "Tevfik Allah'tandır, derim ki: Bu, kesin olarak inanmamız gereken bir iştir;"], [3459.0, "ister bu peygamberden bize nakledilsin ister nakledilmesin."], [3464.0, "Fakat biz kesin olarak biliriz ki Allah'ın peygamber kıldığı hiçbir nebi ve Allah'ın gönderdiği hiçbir resul yoktur ki az olsun çok olsun, nakledilsin ya da nakledilmesin, onun elinde bu mûcizelerden bir şey mutlaka gerçekleşmiş olmasın."]]}, {"reader": false, "ar": [[3484.0, "فإذا نُقلت لنا بعينها وجب فيها الإيمانُ المفصَّل،"], [3488.0, "وإذا لم تُنقَل لنا بعينها وجب فيها الإيمانُ المجمَل؛"], [3494.0, "كما أنّ الله عز وجل قد أرسل رسلًا ونبّأ أنبياءَ لم يقصصهم علينا. أليس كذلك؟"]], "tr": [[3484.0, "Eğer onlar bize tek tek nakledilmişse onlara tafsilatlı iman etmek vacip olur;"], [3488.7, "eğer tek tek nakledilmemişse onlara icmâlî (toplu) iman etmek vacip olur."], [3494.7, "Nitekim Allah Azze ve Celle, bize kıssalarını anlatmadığı resuller göndermiş ve peygamberler kılmıştır. Öyle değil mi?"]]}, {"reader": false, "ar": [[3504.0, "فمن قصّه الله علينا من الأنبياء وجب الإيمانُ به الإيمانَ المفصَّل،"], [3509.0, "ومن لم يُقصَص علينا من الأنبياء فيُكتفى فيه بالإيمان المجمَل."], [3514.0, "فكذلك أيضًا آياتُهم وبراهينُهم ودلائلُ صدق نبوّتهم:"], [3519.0, "إن كانت قد نُقلت لنا فنؤمن بها الإيمانَ المفصَّل،"], [3523.0, "وإن لم تُنقَل لنا فنؤمن بها الإيمانَ المجمَل."]], "tr": [[3504.0, "Peygamberlerden Allah'ın bize kıssasını anlattığı kimseye tafsilatlı imanla iman etmek vaciptir;"], [3508.5, "peygamberlerden kıssası bize anlatılmayan hakkında ise icmâlî imanla yetinilir."], [3513.0, "Aynı şekilde onların âyetleri, burhanları ve nübüvvetlerinin doğruluğunun delilleri de böyledir:"], [3519.4, "Eğer bize nakledilmişse onlara tafsilatlı imanla iman ederiz;"], [3523.0, "eğer bize nakledilmemişse onlara icmâlî imanla iman ederiz."]]}]}, {"ts": "58:48", "title": "10. Külliye (devam): Delil: \"Peygamberlerden hiçbir peygamber yoktur ki…\" hadisi · Kapanış", "paras": [{"reader": false, "ar": [[3528.0, "فإن قلتَ: وما الدليلُ على أنّ كلَّ نبيٍّ أو رسولٍ لا بدّ أن يأتيَ بآية؟"], [3534.0, "أقول: الدليلُ على ذلك قولُ النبيّ صلى الله عليه وسلم في الحديث الصحيح:"], [3542.0, "«ما من نبيٍّ من الأنبياء إلا قد أُعطي من الآيات ما مثلُه آمن عليه البشر، وإنما كان الذي أوتيتُ وحيًا أوحاه الله إليّ، فأرجو أن أكون أكثرَهم تابعًا يوم القيامة»، متّفقٌ عليه."]], "tr": [[3528.0, "Eğer \"Her peygamberin veya resulün mutlaka bir âyet getirdiğinin delili nedir?\" dersen, derim ki:"], [3533.2, "Bunun delili Peygamber sallallâhu aleyhi ve sellem'in sahih hadisteki şu sözüdür:"], [3539.5, "\"Peygamberlerden hiçbir peygamber yoktur ki ona, benzerine insanların iman ettiği âyetlerden (mûcizelerden) verilmiş olmasın."], [3548.7, "Bana verilen ise ancak Allah'ın bana vahyettiği bir vahiydir."], [3556.9, "Bu yüzden kıyamet gününde onların ümmeti en çok olanı olmayı umarım.\" Müttefekun aleyh."]]}, {"reader": false, "ar": [[3568.0, "فإن قلتَ: وما وجهُ الدلالة من هذا الحديث؟"], [3573.0, "فأقول: وجهُ الدلالة من ذلك أنّ قوله:"], [3577.7, "«ما من» هذا نفي،"], [3580.3, "وقوله: «نبيّ» هذا نكرة،"], [3585.0, "فهو نكرةٌ في سياق النفي،"], [3588.4, "والمتقرِّر في القواعد أنّ النكرة في سياق النفي تعمّ،"], [3595.0, "فيدخل في ذلك كلُّ من يُوصَف بأنه نبيٌّ أو رسول."]], "tr": [[3568.0, "Eğer \"Bu hadisten delil getirme yönü nedir?\" dersen, derim ki:"], [3573.7, "Buradaki delil yönü şudur: \"Mâ min\" (hiçbir … yoktur) sözü nefiydir;"], [3580.3, "\"nebî\" sözü ise nekredir. Yani o, nefiy bağlamında bir nekredir."], [3589.0, "Kaidelerde sabit olan şudur: Nefiy bağlamındaki nekre umum ifade eder."], [3595.6, "Dolayısıyla buna, peygamber veya resul diye nitelenen herkes girer."]]}, {"reader": false, "ar": [[3601.0, "وقد بيّن وجهَ الاستدلال هذا الإمامُ الحافظُ ابنُ حجرٍ رحمه الله تعالى في «فتح الباري» بقوله:"], [3610.5, "«ما من الأنبياء نبيٌّ إلا أُعطي»،"], [3614.0, "قال: «هذا دالٌّ على أنّ النبيَّ لا بدّ له من معجزةٍ تقتضي إيمانَ من شاهدها بصدقه، ولا يضرّه من أصرّ على المعاندة»."], [3627.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[3601.0, "Bu istidlal yönünü İmam Hâfız İbn Hacer —Allah ona rahmet etsin— \"Fethu'l-Bârî\"de açıklamıştır:"], [3607.5, "\"Peygamberlerden hiçbir peygamber yoktur ki ona verilmiş olmasın\" sözü hakkında şöyle demiştir:"], [3614.0, "\"Bu, peygamberin, onu müşahede edenin onun doğruluğuna iman etmesini gerektiren bir mûcizesi olmasının zorunlu olduğuna delalet eder;"], [3622.9, "inatta ısrar edenin (inkârı) ona zarar vermez.\" Sözü bitti; Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[3630.0, "فمسألةُ وجود معجزةٍ لكلّ نبيٍّ هو ما يدلّ عليه ظاهرُ هذا الحديث."], [3636.0, "أمّا مسألةُ ذكر معجزات بعض الأنبياء والرسل،"], [3640.4, "والسكوتِ عن ذكر معجزات أنبياءَ أو رسلٍ آخرين،"], [3644.0, "فهذا أمرٌ يتعلّق بإرادة الله عز وجل وعلمه وحكمته."]], "tr": [[3630.0, "Her peygamber için bir mûcizenin bulunması meselesi, bu hadisin zahirinin delalet ettiği şeydir."], [3636.0, "Bazı peygamberlerin ve resullerin mûcizelerinin zikredilip başka peygamberlerin veya resullerin mûcizelerinin zikredilmemesi meselesine gelince, bu, Allah Azze ve Celle'nin iradesine, ilmine ve hikmetine bağlı bir iştir."]]}, {"reader": false, "ar": [[3648.0, "فسكوتُ الشرع عن الإخبار بمعجزات بعض الأنبياء لا يُنقص من قيمتهم،"], [3654.0, "ولا يدلّ على عدم وجودها،"], [3657.0, "ولا يُضعف من مكانتهم،"], [3659.0, "ولا ينبني عليه تفويتُ حكمٍ شرعيّ."], [3662.0, "فيجب علينا أن نؤمن بهذه الكلّيّة إيمانًا جازمًا،"], [3668.0, "سواءٌ نُقلت لنا عينُ المعجزة أو لم تُنقَل."], [3672.0, "وآخرُ دعوانا أنِ الحمدُ لله ربّ العالمين،"], [3675.0, "وصلّى الله وسلّم على نبيّنا محمّد."]], "tr": [[3648.0, "Şer'in bazı peygamberlerin mûcizelerini haber vermekten sükût etmesi, onların değerinden bir şey eksiltmez, mûcizelerinin bulunmadığına delalet etmez, makamlarını zayıflatmaz ve bunun üzerine herhangi bir şer'î hükmün kaybı bina edilmez."], [3662.7, "Bu külliyeye, ister mûcizenin kendisi bize nakledilsin ister nakledilmesin, kesin bir imanla iman etmemiz vaciptir."], [3671.5, "Son duamız, âlemlerin Rabbi Allah'a hamd olsun demektir."], [3674.6, "Allah Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
