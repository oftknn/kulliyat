<script>
const D={"no": 70, "vid": "j3aMZElMJeQ", "title_ar": "الدرس (٧٠) من شرح كليات العقيدة — كليات في باب الصفات: بدعة اشتراط التواتر في العقائد، وحكم التشبيه والجحود، وجواب مالك في الكيفية، وتفاضل الصفات", "title_tr": "Şerhu Külliyyâti'l-Akîde — 70. Ders: Sıfatlar Babının Külliyeleri (Akîdede Tevâtür Şartının Bid'at Oluşu, Teşbih ve İnkârın Hükmü, İmam Mâlik'in Keyfiyet Cevabı, Sıfatlar Arasında Tafâdul)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Akîdelerin isbatını mütevâtirlere bağlayan herkes bid'at ehlindendir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.6, "والصلاةُ والسلامُ على رسول الله الأمين،"], [3.9, "وعلى آله وأصحابه الطيبين الطاهرين،"], [5.9, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [8.2, "أمّا بعد: فمن الكلّيّات في هذا الدرس:"], [12.0, "<b>كلُّ من أوقف إثباتَ العقائد على المتواترات فمن أهل البدع.<\/b>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.6, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.1, "Bundan sonra: Bu dersteki külliyelerden biri şudur:"], [12.7, "<b>1. külliye: Akîdelerin isbatını mütevâtir (delil)lere bağlayan herkes bid'at ehlindendir.<\/b>"]]}, {"reader": false, "ar": [[18.1, "أقولُ وبالله التوفيق: وهذا عليه عامّةُ أهل البدع؛"], [23.0, "فإنّ أكثر أهل البدع لا يؤمنون بأنّ هذه عقيدةٌ صحيحةٌ إلا إذا كان دليلُها متواترًا."], [31.0, "فهم لا يعتقدون الشيءَ إلا بعد أن يتأكّدوا من دليله:"], [36.0, "أهو من الأدلّة المتواترة أو الآحاديّة؟"], [39.0, "فإن كانت من الأدلّة الآحاديّة فإنهم يردّونها سندًا ومتنًا،"], [45.0, "وأمّا إذا كان من الأدلّة المتواترة فإنهم يقبلونها في الظاهر،"], [50.7, "ولا شكّ في ذلك."], [53.0, "إلا أنّ أهل السنة والجماعة قالوا:"], [56.6, "هذا منهجُ أهل البدع."]], "tr": [[18.1, "Tevfik Allah'tandır, derim ki: Bid'at ehlinin geneli bu görüştedir."], [23.0, "Çünkü bid'at ehlinin çoğu, delili mütevâtir olmadıkça bunun sahih bir akîde olduğuna iman etmez."], [31.0, "Onlar bir şeye, delilinin mütevâtir delillerden mi yoksa âhâd delillerden mi olduğundan emin olmadıkça inanmazlar."], [39.0, "Eğer âhâd delillerdense onları hem sened hem metin olarak reddederler."], [47.3, "Mütevâtir delillerden ise onları görünüşte kabul ederler;"], [53.0, "bunda şüphe yoktur. Ancak Ehl-i Sünnet ve'l-Cemaat şöyle demiştir: Bu, bid'at ehlinin metodudur."]]}, {"reader": false, "ar": [[59.0, "ووجهُ تبديعنا لصاحب هذا المسلك عدّةُ أمور:"], [66.0, "الأمر الأول: أنه جاء بشيءٍ ليس عليه سلفُ الأمة؛"], [70.0, "فقد أجمع سلفُ الأمة وأئمّتُها ـ من الصحابة والتابعين وأتباع التابعين إلى يومنا هذا ـ بأنه ليس من شرط العقائد أن تكون متواترة،"], [82.0, "ولا يزال أهلُ السنة والجماعة يُثبتون كثيرًا من العقائد بدليل الآحاد."], [91.0, "والمتقرِّر في القواعد: أنّ كلَّ من فهم في الأدلّة فهمًا مخالفًا لفهم السلف،"], [98.0, "أو جاء في الأدلّة بشيءٍ ليس عليه هَدْيُ السلف،"], [104.0, "فإنه من أهل البدع، وقائلٌ بالباطل."]], "tr": [[59.0, "Bu yolun sahibini bid'atçı saymamızın birkaç sebebi vardır:"], [66.0, "Birinci sebep: Ümmetin selefinin üzerinde olmadığı bir şey getirmiştir."], [70.0, "Ümmetin selefi ve imamları —sahabe, tâbiîn, tebeu't-tâbiîn ve günümüze kadar (gelenler)— akîdelerin mütevâtir olmasının şart olmadığında icmâ etmiştir."], [81.5, "Ehl-i Sünnet ve'l-Cemaat, akîdelerin birçoğunu hâlâ âhâd delille isbat etmektedir."], [91.0, "Kaidelerde yerleşik olan şudur: Delillerde selefin anlayışına aykırı bir anlayışla anlayan veya delillerde selefin yolunun (hedy) üzerinde olmadığı bir şey getiren herkes bid'at ehlindendir ve bâtıl bir söz söylemektedir."]]}, {"reader": false, "ar": [[109.0, "الأمر الثاني: أنه ليس عليه دليلٌ من الشرع؛"], [114.0, "فلا نعلم أنّ الله عز وجل قد نصّ في كتابه على اشتراط المتواترات في العقائد،"], [121.0, "ولا نعلم أنّ النبيّ صلى الله عليه وسلم قد اشترط المتواترات في العقائد."], [127.0, "ومن المعلوم أنّ المتقرِّر في القواعد:"], [130.7, "أنّ كلَّ تقسيمٍ يختلف به حكمُ الشرع فهو توقيفيٌّ على دليل الشرع."], [140.0, "فلا حقَّ لك أن تعمد إلى الباب الواحد ثم تقسمه إلى عدّة أقسام،"], [144.0, "وتجعل لكلّ قسمٍ حكمَه الشرعيّ،"], [148.0, "إلا وعلى ذلك التقسيم دليلٌ من الشرع."]], "tr": [[109.0, "İkinci sebep: Bunun üzerine şeriattan bir delil yoktur."], [114.0, "Allah Azze ve Celle'nin Kitabı'nda akîdelerde mütevâtirlerin şart koşulduğunu nassla bildirdiğini bilmiyoruz."], [120.5, "Peygamber sallallâhu aleyhi ve sellem'in akîdelerde mütevâtirleri şart koştuğunu da bilmiyoruz."], [127.0, "Bilindiği üzere kaidelerde yerleşik olan şudur:"], [130.7, "Şer'î hükmün kendisiyle değiştiği her taksim, şer'î delile bağlıdır (tevkîfîdir)."], [140.0, "Dolayısıyla tek bir babı alıp onu birkaç kısma ayırman ve her kısma kendi şer'î hükmünü vermen için, o taksime dair şeriattan bir delil olmadıkça hakkın yoktur."]]}, {"reader": false, "ar": [[152.0, "ونحن لا نجد دليلًا على هذا التقسيم؛"], [157.0, "فلا نعلم دليلًا من الوحي يدلّ على أنّ العقيدة إن كانت مستندةً إلى متواترٍ فاقبلوها،"], [164.0, "وإذا كانت مستندةً إلى آحادٍ فلا تقبلوها."], [168.0, "هذا ما لا يوجد لا في كتاب الله عز وجل،"], [170.0, "ولا في سنّة نبيّه صلى الله عليه وسلم،"], [173.0, "ولا في قول أحدٍ من سلف الأمة وأئمّتها أبدًا."], [175.7, "وإنما هو مأخوذٌ من أهل ـ وإنما هو شيءٌ ورثوه ممّن سلفهم من الفلاسفة وغيرهم؛"], [186.0, "فهو منهجٌ فلسفيٌّ بدعيٌّ إبليسيٌّ شيطانيّ،"], [191.0, "لا نعلم عن أحدٍ من أهل العلم ممّن يُشار له بالعلم والسنّة أنه اعتمده أو أفتى به."]], "tr": [[152.0, "Biz bu taksime bir delil bulamıyoruz."], [157.0, "Vahiyden, \"Akîde bir mütevâtire dayanıyorsa onu kabul edin, âhâda dayanıyorsa kabul etmeyin\" diye delâlet eden bir delil bilmiyoruz."], [168.0, "Bu, ne Allah Azze ve Celle'nin Kitabı'nda, ne Peygamberi sallallâhu aleyhi ve sellem'in sünnetinde, ne de ümmetin selefinden ve imamlarından herhangi birinin sözünde asla bulunmaz."], [175.7, "Bu ancak ... ehlinden alınmış —bu ancak kendilerinden önce geçen felsefecilerden ve başkalarından miras aldıkları bir şeydir."], [186.0, "Dolayısıyla bu, felsefî, bid'atçı, iblisçe ve şeytanca bir metottur."], [191.9, "İlim ve sünnetle işaret edilen ilim ehlinden herhangi birinin buna dayandığını veya bununla fetva verdiğini bilmiyoruz."]]}, {"reader": false, "ar": [[201.0, "ويؤكّد ذلك الوجهُ الثالث:"], [204.0, "أننا لا نراهم في المتواترات يُسلِّمون لها،"], [210.0, "كما ذكرتُ لكم في اللقاء الماضي؛"], [216.0, "فإننا نراهم في العقائد التي ثبتت بالأدلّة المتواترات يُحرِّفونها ويُؤوِّلونها ويُخرجونها عن مدلولاتها الصحيحة."], [227.0, "فلم نرهم أثبتوا لله وجهًا مع أنّ دليله متواتر،"], [232.0, "ولا أثبتوا لله يدًا مع أنّ دليلها متواتر،"], [235.0, "ولا أثبتوا لله كلامًا مع أنّ دليله متواتر،"], [239.0, "ولا أثبتوا لله علوًّا مع أنّ دليله متواتر،"], [244.0, "ولا أثبتوا لله استواءً مع أنّ دليله متواتر."]], "tr": [[201.0, "Bunu üçüncü sebep te'kid eder:"], [201.8, "Onların mütevâtirlere de teslim olduklarını görmüyoruz;"], [204.0, "geçen buluşmada size zikrettiğim gibi."], [206.2, "Mütevâtir delillerle sabit olan akîdeleri tahrif ettiklerini, te'vil ettiklerini ve onları sahih delâletlerinin dışına çıkardıklarını görüyoruz."], [216.0, "Delili mütevâtir olduğu hâlde onların Allah'a yüz (vech) isbat ettiklerini görmedik."], [222.0, "Delili mütevâtir olduğu hâlde Allah'a el isbat etmediler;"], [227.0, "delili mütevâtir olduğu hâlde Allah'a kelâm isbat etmediler;"], [233.5, "delili mütevâtir olduğu hâlde Allah'a uluvv (yücelik) isbat etmediler;"], [240.2, "delili mütevâtir olduğu hâlde Allah'a istivâ isbat etmediler."]]}, {"reader": false, "ar": [[248.0, "فهذا يدلّك على أنّ القوم إنما أرادوا ردَّ الأسماء والصفات فقط؛"], [259.0, "فقدروا على ردّ الآحاد سندًا ومتنًا لظنّيّته،"], [265.0, "وأمّا المتواترات فإنهم لو ردّوها سندًا لفُضِحوا،"], [270.0, "فأبقَوها على ظاهرها، ولكن سلبوا معانيَها الصحيحة وأقحموا معانيَ باطلة."], [280.0, "ويؤكّد ذلك الوجهُ الذي بعده:"], [283.0, "وهي أننا نرى القوم إذا كانوا يريدون إثبات شيءٍ متماشٍ مع عقولهم استدلّوا عليه بأحاديثَ مكذوبةٍ وموضوعة،"], [295.0, "أو استدلّوا عليه بأبياتٍ شعريّةٍ لا يُعرَف قائلُها أصلًا."]], "tr": [[248.0, "Bu sana gösterir ki bu topluluk ancak isim ve sıfatları reddetmek istemiştir."], [259.0, "Âhâdı, zannî oluşu sebebiyle sened ve metin olarak reddetmeye güçleri yetti."], [265.7, "Mütevâtirlere gelince, onları sened olarak reddetselerdi rezil olurlardı."], [269.3, "Bu yüzden onları zahirleri üzere bıraktılar, fakat sahih manalarını soyup içlerine bâtıl manalar soktular."], [280.0, "Bunu ondan sonraki sebep te'kid eder:"], [283.0, "O da şudur: Bu topluluğun, akıllarına uygun düşen bir şeyi isbat etmek istediklerinde, ona yalan ve uydurma hadislerle ya da söyleyeni hiç bilinmeyen şiir beyitleriyle delil getirdiklerini görüyoruz."]]}]}, {"ts": "05:02", "title": "1. Külliye (devam): Hevâlarına uyanı kabul etmeleri; istîlâ ve kelâm-ı nefsî beyitleri", "paras": [{"reader": false, "ar": [[302.0, "فمتى ما كانت العقائدُ على أهوائهم وأمزجتهم،"], [306.9, "ومتّفقةً مع عقولهم وقواعد أئمّتهم،"], [310.0, "فإنهم يُثبتونها ولا يقولون بأنها آحادٌ أو متواترات."], [319.0, "ألا ترى أنهم حرّفوا صفةَ الاستواء إلى الاستيلاء بقول بعضهم من الشعراء:"], [329.0, "«قد استوى بِشْرٌ على العراقِ ... من غير سيفٍ أو دمٍ مُهراقِ»؟"], [334.6, "فحرّفوا ـ صفاتِ ـ فحرّفوا الآياتِ المتواترة،"], [340.0, "وحرّفوا الأدلّةَ الصحيحة من أجل بيتٍ من الشعر!"], [343.0, "فهم يعتقدون أنّ الاستواء هو الاستيلاء؛"], [348.0, "فكيف تعتقدون أنه الاستيلاء،"], [350.5, "ولا يقف هذا الاستيلاءُ إلى دليلٍ متواتر <span class=\"q\">؟ 05:48<\/span>؟"]], "tr": [[302.0, "Akîdeler onların hevâlarına ve mizaçlarına uygun, akıllarıyla ve imamlarının kaideleriyle uyumlu olduğu zaman onları isbat ederler ve âhâd mı mütevâtir mi olduklarını söylemezler."], [319.0, "Görmüyor musun, şairlerden birinin şu sözüyle istivâ sıfatını istîlâya (ele geçirmeye) tahrif ettiler:"], [329.0, "\"Bişr Irak'a istivâ etti (hâkim oldu) / Kılıçsız ve dökülen kan olmaksızın.\" Sıfatları —mütevâtir ayetleri tahrif ettiler;"], [340.0, "bir şiir beyti uğruna sahih delilleri tahrif ettiler!"], [343.0, "Onlar istivânın istîlâ olduğuna inanıyorlar."], [348.0, "Bu istîlâ (yorumu) mütevâtir bir delile dayanmıyorken <span class=\"q\">؟<\/span> onun istîlâ olduğuna nasıl inanırsınız?"]]}, {"reader": false, "ar": [[355.0, "فهذا يُفيدك بأنّ القوم إنما هم أصحابُ أهواء؛"], [360.0, "فمتى ما كانت الأهواءُ ـ فمتى ما كان الدليلُ يُسعف عقولهم وعقائدهم قالوا به،"], [365.9, "من غير نظرٍ في صحّته أو آحاديّته أو تواتره."], [373.0, "وانظر إلى ما فعلوه في صفة الكلام المتواترة،"], [378.3, "والتي أثبتتها مئاتُ الأدلّة؛"], [381.0, "فإنهم إنما يُثبتون أنّ كلام الله هو الكلامُ النفسيّ ـ هو الكلامُ النفسيّ ـ أي ما يدور في الخاطر،"], [392.2, "من غير صوتٍ ملفوظٍ ولا مسموع،"], [396.0, "ولا حرفٍ ولا شيء."]], "tr": [[355.0, "Bu sana, bu topluluğun ancak hevâ sahipleri olduğunu bildirir."], [360.0, "Hevâlar ne zaman —delil ne zaman akıllarına ve akîdelerine yardımcı olursa, sahih olup olmadığına, âhâd mı mütevâtir mi olduğuna bakmadan onunla görüş bildirirler."], [373.0, "Mütevâtir olan ve yüzlerce delilin isbat ettiği kelâm sıfatında yaptıklarına bak:"], [381.0, "Onlar Allah'ın kelâmının ancak kelâm-ı nefsî olduğunu isbat ederler —kelâm-ı nefsî—, yani telaffuz edilen ve işitilen bir ses olmaksızın, harf olmaksızın, hiçbir şey olmaksızın zihinde dolaşan şey."]]}, {"reader": false, "ar": [[400.0, "وكلُّ هذا التحريف لهذه الأدلّة المئويّة لبيتٍ من الشعر لا يُعرَف قائلُه:"], [408.0, "«إنّ الكلامَ لفي الفؤادِ، وإنما ... جُعِلَ اللسانُ على الفؤادِ دليلا»."], [416.0, "من الذي قاله؟ لا يُعرَف."], [420.0, "وبعضهم قال: يُنسَب إلى الأخطل،"], [422.5, "السكّيرِ النصرانيّ النكير <span class=\"q\">؟ 07:00<\/span>. فيا سبحان الله!"], [424.5, "يا سبحان الله! إذا جاءت العقائدُ واضحةً آحاديّةً من سنّة النبيّ صلى الله عليه وسلم تورّع القومُ عن إثباتها،"], [437.0, "وإذا كانت تمشي مع قواعدهم ومراداتهم النفسيّة وشهواتهم وأهوائهم قالوا: لا تسألوا!"]], "tr": [[400.0, "Yüzlerce delile yapılan bütün bu tahrif, söyleyeni bilinmeyen bir şiir beyti uğrunadır:"], [408.0, "\"Kelâm ancak kalptedir; dil ise kalbe delil kılınmıştır.\" Bunu kim söyledi?"], [418.4, "Bilinmiyor. Bazıları da \"Ayyaş, Hristiyan, münker <span class=\"q\">؟<\/span> Ahtal'a nispet edilir\" dedi."], [424.5, "Sübhânallah! Sübhânallah! Akîdeler Peygamber sallallâhu aleyhi ve sellem'in sünnetinden açık fakat âhâd olarak gelince bu topluluk onları isbat etmekten çekinir."], [437.0, "Kendi kaidelerine, nefsî maksatlarına, şehvetlerine ve hevâlarına uygun düştüğünde ise \"Sormayın!\" derler."]]}, {"reader": false, "ar": [[446.0, "فهذا يدلّك على أنّ اشتراطهم للمتواترات في العقائد ليس اشتراطَ تثبُّت،"], [453.0, "وإنما هو اشتراطُ أهواءٍ وشهواتٍ فقط،"], [456.5, "أهواءٍ وشهواتٍ فقط. ثم انظر إلى هؤلاء الأشاعرة والمعتزلة والكُلّابيّة والجهميّة:"], [465.0, "في باب الأسماء والصفات قالوا:"], [467.9, "نشترط المتواترات، وتجدهم في باب السلوك صوفيّةً يقبلون الخرافات،"], [473.7, "ويقبلون الدجل، ويعتقدون أنّ هذا قبرُ وليٍّ على مجرّد رؤًى،"], [479.5, "ومجرّد أذواقٍ ومواجيد، ومكاشفاتٍ شيطانيّة، وخوارقَ إبليسيّةٍ فقط."]], "tr": [[446.0, "Bu sana gösterir ki onların akîdelerde mütevâtirleri şart koşmaları sağlam olmayı arama şartı değil, sadece hevâ ve şehvet şartıdır;"], [456.5, "sadece hevâ ve şehvet. Sonra şu Eş'arîlere, Mu'tezile'ye, Küllâbiyye'ye ve Cehmiyye'ye bak:"], [465.0, "İsim ve sıfatlar babında \"Mütevâtirleri şart koşarız\" dediler."], [467.9, "Sülûk (tasavvufî yol) babında ise onları, hurafeleri ve şarlatanlığı kabul eden sûfîler olarak bulursun."], [475.0, "Sırf rüyalara, sırf zevklere ve vecdlere, şeytanî keşiflere ve iblisçe harikulâde hâllere dayanarak \"Bu bir velinin kabridir\" diye inanırlar."]]}, {"reader": false, "ar": [[484.0, "فيا سبحان الله! [ما] الذي جعلهم يُشدِّدون في باب العقائد،"], [490.0, "ثم في باب السلوك تجدهم من أخرق الناس في الاستدلال؟"], [496.0, "وأنتم ترون أنّ أكثر الأشاعرة في العقائد صوفيّةٌ في السلوك؛"], [500.0, "فتجدهم يطوفون حول القبور ولا يطلبون دليلًا متواترًا،"], [505.0, "وتجدهم يركعون ويسجدون للقبور ولا يطلبون دليلًا متواترًا،"], [510.0, "وتراهم يرون المخالفات: من بناء المساجد على القبور،"], [514.0, "ومن تزويقها والكتابة عليها،"], [516.0, "ومن تعظيمها التعظيمَ الذي يُخرجها إلى مرتبة الوثنيّة،"], [522.0, "ومع ذلك لا يقول القوم:"], [524.3, "أين الدليلُ المتواتر على تلك العقائد التي تفعلونها؟"]], "tr": [[484.0, "Sübhânallah! Onları akîdeler babında katı davranmaya sevk eden ne ki, sülûk babında onları delil getirme konusunda insanların en beceriksizlerinden buluyorsun?"], [496.0, "Görüyorsunuz ki Eş'arîlerin çoğu akîdede (Eş'arî), sülûkta sûfîdir."], [500.0, "Onları kabirlerin etrafında tavaf ederken bulursun ve mütevâtir bir delil istemezler."], [505.6, "Onları kabirlere rükû ve secde ederken bulursun ve mütevâtir bir delil istemezler."], [511.5, "Onları muhalefetleri (caiz) görürken görürsün:"], [513.5, "Kabirler üzerine mescid bina etmek, onları süslemek ve üzerlerine yazı yazmak, onları putperestlik mertebesine çıkaran bir tazimle tazim etmek gibi."], [524.3, "Bununla birlikte bu topluluk \"Yaptığınız bu akîdelere mütevâtir delil nerede?\" demez."]]}, {"reader": false, "ar": [[528.0, "وهذا كلُّه يدلّنا على أنّ القوم أصحابُ أهواءٍ وشهواتٍ فقط،"], [535.0, "ويصدق فيهم قولُ النبيّ صلى الله عليه وسلم:"], [539.0, "«وسيخرج في أمّتي أقوامٌ تتجارى بهم الأهواءُ كما يتجارى الكَلَبُ» ـ وهو داءُ عضّة الكلب ـ «كما يتجارى الكَلَبُ بصاحبه، فلا يُبقي منه عِرقًا ولا مَفصِلًا إلا دخله»."], [554.0, "حديثٌ صحيحٌ لغيره، من حديث معاوية رضي الله تعالى عنه وأرضاه، حديثُ الافتراق، معروف. <span class=\"note\">(Ebû Dâvûd, Ahmed)<\/span>"]], "tr": [[528.0, "Bütün bunlar bize bu topluluğun sadece hevâ ve şehvet sahipleri olduğunu gösterir."], [534.3, "Onlar hakkında Peygamber sallallâhu aleyhi ve sellem'in şu sözü doğru çıkar:"], [539.0, "\"Ümmetimde, kelebin (kuduzun) kişiyi sardığı gibi hevâların kendilerini sardığı kavimler çıkacak\" —kelep, köpek ısırığından gelen hastalıktır (kuduz)—, \"kuduzun sahibini sardığı gibi;"], [549.0, "ondan hiçbir damar ve hiçbir eklem bırakmaz ki oraya girmesin.\" Muâviye'nin —Allah ondan razı olsun ve onu hoşnut etsin— rivayet ettiği, başka yollarla sahih (sahîh li-gayrihî) bir hadistir;"], [559.3, "meşhur iftirak (fırkalara ayrılma) hadisidir."]]}, {"reader": false, "ar": [[560.0, "وأمّا أهلُ السنة والجماعة فإنّ أعظم شرطٍ عندهم في إثبات العقائد والشرائع هو صحّةُ النصّ؛"], [570.0, "فمتى ما صحّ النصُّ عن المعصوم صلى الله عليه وسلم فإنهم يؤمنون بمدلوله،"], [575.8, "ويعتقدونه إن كان عقيدة،"], [578.1, "ويعملون به إن كان شريعة،"], [581.0, "بغضّ النظر عن نوع طريقه:"], [583.3, "أهو من المتواترات أو من الآحاد."], [586.0, "ونسأل الله أن يُثبّتنا على هذا المنهج."], [588.0, "والخلاصة من ذلك: أنّ كلَّ من اشترط في إثبات شيءٍ من العقائد التواترَ فإنه من أهل البدع ولا شكّ. والله أعلم."]], "tr": [[560.0, "Ehl-i Sünnet ve'l-Cemaat'e gelince, onlara göre akîdeleri ve şer'î hükümleri isbat etmedeki en büyük şart nassın sahih olmasıdır."], [570.0, "Nass Ma'sûm sallallâhu aleyhi ve sellem'den sahih olarak geldiğinde, yolunun türüne —mütevâtirlerden mi yoksa âhâddan mı olduğuna— bakmaksızın onun delâlet ettiği şeye iman ederler;"], [581.5, "akîde ise ona inanırlar, şer'î hüküm ise onunla amel ederler."], [586.0, "Allah'tan bizi bu metot üzere sabit kılmasını dileriz."], [588.0, "Bundan çıkan sonuç şudur: Akîdelerden herhangi birini isbat etmede tevâtürü şart koşan herkes, şüphesiz bid'at ehlindendir. Allah en iyisini bilir."]]}]}, {"ts": "10:00", "title": "2. Külliye: Allah'ı mahlûkuna benzeten herkes kâfir olmuştur", "paras": [{"reader": false, "ar": [[600.0, "ومن الكلّيّات أيضًا: <b>كلُّ من شبّه الله بخلقه فقد كفر.<\/b> <b>كلُّ من شبّه الله بخلقه فقد كفر.<\/b>"]], "tr": [[600.0, "Külliyelerden biri de şudur: 2."], [602.1, "külliye: Allah'ı mahlûkuna benzeten herkes kâfir olmuştur.<b> <\/b>2."], [611.0, "külliye: Allah'ı mahlûkuna benzeten herkes kâfir olmuştur."]]}, {"reader": false, "ar": [[617.0, "أقولُ وبالله التوفيق: وهذه الكلّيّة قد أجمع عليها علماءُ أهل السنة والجماعة."], [630.0, "وأوّلُ براهينها ذلك الإجماعُ الذي حكاه جمعٌ كثيرٌ ممّن ألّفوا في العقائد؛"], [640.0, "فإنهم يذكرون هذا القول وينسبونه إلى قائله نسبةَ إقرارٍ وحكايةَ إقرار."], [648.0, "ولا نعلم عن أحدٍ من أهل السنة والجماعة أنه أنكر هذه الكلّيّة،"], [653.7, "أو عارض في شيءٍ من هذا الإطلاق،"], [657.0, "ولا نظنّ أنّ أحدًا من أهل السنة إلى يوم القيامة يعارض في هذا."]], "tr": [[617.0, "Tevfik Allah'tandır, derim ki: Bu külliye üzerinde Ehl-i Sünnet ve'l-Cemaat âlimleri icmâ etmiştir."], [630.0, "Burhanlarının ilki, akîdeler hakkında eser telif edenlerden pek çoğunun naklettiği o icmâdır."], [640.0, "Onlar bu sözü zikreder ve onu, ikrar ederek nispet etme ve ikrar ederek nakletme şeklinde sahibine nispet ederler."], [648.0, "Ehl-i Sünnet ve'l-Cemaat'ten herhangi birinin bu külliyeyi inkâr ettiğini veya bu mutlak ifadenin herhangi bir kısmına itiraz ettiğini bilmiyoruz."], [657.5, "Kıyamet gününe kadar Ehl-i Sünnet'ten birinin buna itiraz edeceğini de sanmıyoruz."]]}, {"reader": false, "ar": [[663.0, "وذلك لأنّ كلَّ من شبّه الله بخلقه فيكون جاحدًا للأدلّة المتواترة التي تقطع دابرَ المماثلة بين الخالق والمخلوق."], [677.0, "وأنتم تعرفون أنّ المتقرِّر في القواعد:"], [680.4, "أنّ كلَّ من أنكر معلومًا من الدين بالضرورة فقد كفر."], [686.0, "والمتقرِّر في القواعد: أنّ من جحد خبريّةً ثبت بها دليلُ الوحي ـ أنّ من جحد خبريّةً ثبت بها دليلُ الوحي ولم يؤمن بها وكذّبها فإنه كافر."]], "tr": [[663.0, "Bunun sebebi şudur: Allah'ı mahlûkuna benzeten herkes, Yaratan ile yaratılan arasındaki benzerliğin kökünü kesen mütevâtir delilleri inkâr etmiş olur."], [677.0, "Bilirsiniz ki kaidelerde yerleşik olan şudur:"], [680.4, "Dinden zarûrî olarak bilinen bir şeyi inkâr eden herkes kâfir olmuştur."], [686.0, "Kaidelerde yerleşik olan şu da vardır:"], [687.6, "Vahiy delilinin sabit kıldığı bir haberi inkâr eden —vahiy delilinin sabit kıldığı bir haberi inkâr eden, ona iman etmeyen ve onu yalanlayan kişi kâfirdir."]]}, {"reader": false, "ar": [[701.0, "ومن خبريّات الوحي: قطعُ دابر المماثلة بين الخالق والمخلوق؛"], [707.0, "في قوله عز وجل:"], [708.7, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>، وقولِ الله عز وجل:"], [712.5, "<span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>،"], [715.0, "وقولِ الله عز وجل:"], [717.5, "<span class=\"ayah\">﴿فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ﴾<\/span> <span class=\"ref\">[النحل: ٧٤]<\/span>،"], [720.0, "وقولِ الله عز وجل:"], [722.8, "<span class=\"ayah\">﴿سُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ﴾<\/span> <span class=\"ref\">[الصافات: ١٨٠]<\/span> ـ وقد وصفوه بمقتضيات البشريّة ـ <span class=\"ayah\">﴿وَسَلَامٌ عَلَى الْمُرْسَلِينَ ۝ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾<\/span> <span class=\"ref\">[الصافات: ١٨١–١٨٢]<\/span>،"], [733.0, "وقولِ الله عز وجل:"], [734.8, "<span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [737.0, "أي: ليس له مُكافئٌ،"], [738.8, "لا في ذاته، ولا في صفاته،"], [741.4, "ولا في أسمائه، ولا في أفعاله عز وجل."]], "tr": [[701.0, "Vahyin haberlerinden biri de Yaratan ile yaratılan arasındaki benzerliğin kökünün kesilmesidir."], [707.0, "Allah Azze ve Celle'nin şu sözlerinde olduğu gibi:"], [708.7, "<span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11];"], [712.5, "<span class=\"ayah\">﴿O'na adaş (denk) birini biliyor musun?﴾<\/span> [Meryem 65];"], [717.5, "<span class=\"ayah\">﴿Allah'a misaller getirmeyin﴾<\/span> [Nahl 74];"], [720.0, "<span class=\"ayah\">﴿Senin Rabbin, izzet sahibi Rab, onların nitelendirdiklerinden münezzehtir﴾<\/span> [Sâffât 180] —onlar O'nu beşeriyetin gerekleriyle nitelendirmişlerdi—, <span class=\"ayah\">﴿Selâm gönderilen peygamberlere olsun. Hamd de âlemlerin Rabbi Allah'a mahsustur﴾<\/span> [Sâffât 181–182];"], [734.8, "<span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4];"], [737.4, "yani O'nun ne zâtında, ne sıfatlarında, ne isimlerinde, ne de fiillerinde bir dengi yoktur."]]}, {"reader": false, "ar": [[745.0, "فإذا جاءنا رجلٌ وقال:"], [747.3, "وجهُ الله كوجوهنا، فيكون مكذِّبًا وجاحدًا لهذه الأدلّة المتواترة،"], [752.5, "وجاحدًا ومكذِّبًا للمعلوم من الدين بالضرورة،"], [756.0, "ولا يكون عندنا إلا كافرًا."], [759.0, "وإذا قال: علوُّ الله كعلوّي،"], [762.0, "أو ضحكُ الله كضحكي،"], [764.0, "أو عينُ الله كعيني،"], [767.0, "أو يدُ الله كيدي،"], [769.0, "أو استواءُ الله كاستوائي،"], [771.0, "إلى آخره، فإنّ هذا لا يُحكَم عليه عندنا إلا بأنه كافر."], [778.0, "إلا أنكم تعرفون بأنّ هذا التكفير من التكفير بالوصف العام،"], [785.0, "والمتقرِّر في القواعد: أنّ التكفير بالوصف العام لا يستلزم تكفيرَ المعيَّن إلا بعد ثبوت الشروط وانتفاء الموانع."]], "tr": [[745.0, "Bize bir adam gelip \"Allah'ın yüzü bizim yüzlerimiz gibidir\" derse, bu mütevâtir delilleri yalanlayan ve inkâr eden, dinden zarûrî olarak bilineni inkâr eden ve yalanlayan biri olur;"], [756.0, "bize göre kâfirden başka bir şey değildir."], [759.0, "\"Allah'ın uluvvu benim yüceliğim gibidir\", \"Allah'ın gülmesi benim gülmem gibidir\", \"Allah'ın gözü benim gözüm gibidir\", \"Allah'ın eli benim elim gibidir\" veya \"Allah'ın istivâsı benim istivâm gibidir\" ve benzerlerini söylerse, bize göre onun hakkında kâfir olduğundan başka bir hüküm verilmez."], [778.0, "Ancak bilirsiniz ki bu tekfir, genel vasıfla tekfirdendir."], [786.2, "Kaidelerde yerleşik olan şudur: Genel vasıfla tekfir, şartlar sabit olup engeller ortadan kalkmadıkça muayyen kişinin tekfirini gerektirmez."]]}, {"reader": false, "ar": [[792.0, "ولأنّ ـ وهو الوجهُ الثالث ـ ولأنّ من شبّه الله بخلقه فقد ـ انتبه،"], [799.2, "انتبه ـ نفى عنه صفةَ استحقاقه للألوهيّة والربوبيّة؛"], [807.0, "فإنّ الله عز وجل في القرآن من أوّله إلى آخره يُبطل عبادةَ غيره بسلب صفات الربوبيّة عنهم،"], [818.0, "وبإثبات صفة البشريّة لهم،"], [824.0, "كما نفى الله عز وجل إلهيّةَ عيسى وأمّه مريم بقوله:"], [829.4, "<span class=\"ayah\">﴿كَانَا يَأْكُلَانِ الطَّعَامَ﴾<\/span> <span class=\"ref\">[المائدة: ٧٥]<\/span>. فإذًا كلُّ من شبّه الله بشيءٍ من مقتضيات صفات خلقه فإنه يُعطّل الله عن ـ إيش؟"], [839.3, "ـ عمّا يستحقّه من الربوبيّة والألوهيّة."]], "tr": [[792.0, "Ayrıca —bu üçüncü sebeptir— Allah'ı mahlûkuna benzeten kişi —dikkat et, dikkat et— O'ndan ulûhiyyete ve rubûbiyyete layık olma sıfatını nefyetmiş olur."], [807.0, "Çünkü Allah Azze ve Celle Kur'an'da baştan sona, başkalarına ibadeti, onlardan rubûbiyyet sıfatlarını soyarak ve onlara beşeriyet sıfatını isbat ederek iptal eder."], [818.7, "Nitekim Allah Azze ve Celle, Îsâ'nın ve annesi Meryem'in ilahlığını <span class=\"ayah\">﴿İkisi de yemek yerlerdi﴾<\/span> [Mâide 75] sözüyle nefyetmiştir."], [831.0, "Öyleyse Allah'ı, mahlûkunun sıfatlarının gereklerinden herhangi bir şeye benzeten herkes, Allah'ı —neyden?— layık olduğu rubûbiyyet ve ulûhiyyetten ta'til etmiş olur."]]}, {"reader": false, "ar": [[842.0, "فإذا أردنا أن نسعى في إبطال ألوهيّة وليٍّ من الأولياء قلنا بأنه تجري عليه مقتضياتُ البشريّة:"], [850.3, "فهو يجوع، فكيف يجوع الربّ؟"], [853.0, "وهو يمرض، وكيف يمرض الربّ؟"], [856.4, "وهو يتبرّز، وكيف يفعل ـ وكيف يُوصَف اللهُ بشيءٍ من ذلك؟"], [862.0, "فإذًا كلُّ من وصفناه بشيءٍ من مقتضيات الصفات البشريّة فإننا ضِمنًا نُعطّل ـ إيش؟"], [868.5, "ـ كونَه ربًّا، أو صلاحيتَه للإله."]], "tr": [[842.0, "Velilerden birinin ilahlığını iptal etmeye çalışmak istediğimizde, onun üzerinde beşeriyetin gereklerinin cereyan ettiğini söyleriz:"], [850.3, "O acıkır; Rab nasıl acıkır?"], [853.0, "O hastalanır; Rab nasıl hastalanır?"], [856.4, "O def-i hâcet yapar; nasıl yapar —Allah bunlardan herhangi biriyle nasıl nitelenir?"], [862.0, "Öyleyse beşerî sıfatların gereklerinden herhangi biriyle nitelediğimiz herkesin —neyini?— Rab oluşunu veya ilah olmaya elverişliliğini zımnen ta'til etmiş oluruz."]]}, {"reader": false, "ar": [[871.0, "فإذا قيل: وجهُ الله كوجهي،"], [873.8, "استواءُ الله كاستوائي، يدُ الله كيدي،"], [877.1, "سمعُ الله كسمعي، أو بصرُ الله كبصري،"], [881.0, "فإنك تُجري على الله عز وجل شيئًا من مقتضيات البشريّة التي تتضمّن تعطيلَه عن استحقاق الألوهيّة والربوبيّة."], [889.1, "إذًا خلاصةُ ذلك: أنّ كلَّ من شبّه الله بخلقه ـ ها ـ فقد سلب عنه استحقاقَه لأن يكون إلهًا وأن يكون ربًّا."]], "tr": [[871.0, "\"Allah'ın yüzü benim yüzüm gibidir, Allah'ın istivâsı benim istivâm gibidir, Allah'ın eli benim elim gibidir, Allah'ın işitmesi benim işitmem gibidir veya Allah'ın görmesi benim görmem gibidir\" denildiğinde, Allah Azze ve Celle'ye, O'nu ulûhiyyete ve rubûbiyyete layık olmaktan ta'til etmeyi içeren beşeriyet gereklerinden bir şey yüklemiş olursun."], [890.7, "Öyleyse bunun özeti şudur: Allah'ı mahlûkuna benzeten herkes —hı— O'ndan ilah olmaya ve Rab olmaya layık oluşunu soyup almıştır."]]}, {"reader": false, "ar": [[900.0, "انظر إلى نهاية الأمور!"], [902.0, "ولكنّنا نجزم بأنهم لا يعرفون أنّ وَغْلَ <span class=\"q\">؟ 15:02<\/span> هذا القول،"], [909.0, "لا يُدركون بأنّ وَغْلَ هذا القول سيُوصلهم إلى هذه النتيجة،"], [915.2, "وهي تعطيلُ الله عن ألوهيّته وربوبيّته."]], "tr": [[900.0, "İşlerin sonuna bak! Fakat onların, bu sözün varacağı yeri <span class=\"q\">؟<\/span> bilmediklerini kesin olarak söylüyoruz;"], [902.0, "bu sözün varacağı yerin kendilerini şu sonuca ulaştıracağını idrak etmiyorlar:"], [911.5, "O da Allah'ı ulûhiyyetinden ve rubûbiyyetinden ta'til etmektir."]]}, {"reader": false, "ar": [[919.0, "فإذا قيل لك: لماذا قال أهلُ السنة بأنّ من شبّه الله بخلقه فقد كفر؟"], [925.0, "فقل: لثلاثة أمور: لمخالفته للإجماع القطعيّ المتواتر عن علماء الإسلام،"], [932.0, "ولأنه يتضمّن جحودَ خبريّاتٍ كثيرةٍ ثبت بها القرآن،"], [939.0, "ولأنه يتضمّن تعطيلَ الربّ عن استحقاق ألوهيّته وربوبيّته."], [946.0, "وهذا كافٍ بأن نحكم على فاعل ذلك بأنه كافر."]], "tr": [[919.0, "Sana \"Ehl-i Sünnet neden Allah'ı mahlûkuna benzeten kişinin kâfir olduğunu söyledi?\" denilirse, de ki:"], [927.1, "Üç sebepten dolayı: İslâm âlimlerinden gelen kesin ve mütevâtir icmâya aykırı olduğu için;"], [933.5, "Kur'an'ın sabit kıldığı pek çok haberin inkârını içerdiği için;"], [939.0, "ve Rabb'i ulûhiyyetine ve rubûbiyyetine layık olmaktan ta'til etmeyi içerdiği için."], [946.0, "Bu, bunu yapanın kâfir olduğuna hükmetmemiz için yeterlidir."]]}, {"reader": false, "ar": [[950.0, "فإن قلت: ومن أوّلُ من قال بمماثلة الله لخلقه؟"], [955.0, "فنقول: أوّلُ من نُقل عنه القولُ بمماثلة صفات الله بخلقه رجلٌ من الرافضة يقال له:"], [965.8, "هشام بن الحكم الرافضيّ."], [968.0, "ومن المعلوم أنّ الرافضة عاشوا عصرين:"], [972.2, "فأوائلُ عصورهم كانوا ممثِّلة،"], [976.0, "ولكن لمّا اختلط علماؤهم بالمعتزلة والجهميّة انتقلوا من التمثيل إلى التعطيل."], [985.0, "فأوّلُ من قال بالتمثيل هو ذلك الرجل،"], [989.1, "والذي تُحكى عنه المقالةُ الشنيعة ـ التي لولا التعليمُ لما ذكرناها ـ وهي أنه يُثبت لله عز وجل كلَّ شيءٍ في المخلوق،"], [999.0, "ويتوقّف في اللحية والذَّكَر؛"], [1002.0, "وإلا فكلُّ ما يثبت للمخلوق فإنه يثبت للخالق من الصفات."], [1012.0, "وهذا لا جرمَ أنه كفرٌ أكبرُ مُخرِجٌ عن الملّة بالكلّيّة، والعياذ بالله."]], "tr": [[950.0, "Eğer \"Allah'ın mahlûkuna benzerliğini ilk söyleyen kimdir?\" dersen, deriz ki:"], [955.0, "Allah'ın sıfatlarının mahlûkuna benzerliği görüşü kendisinden ilk nakledilen kişi, Râfıza'dan Hişâm b."], [965.8, "el-Hakem er-Râfızî denilen bir adamdır."], [968.0, "Bilindiği üzere Râfıza iki dönem yaşamıştır:"], [972.2, "İlk dönemlerinde Mümessile idiler; fakat âlimleri Mu'tezile ve Cehmiyye ile karışınca temsilden ta'tile geçtiler."], [980.8, "Temsili ilk söyleyen o adamdır."], [985.0, "Ondan —öğretim (gereği) olmasaydı zikretmeyeceğimiz— çirkin bir söz nakledilir:"], [989.7, "O, Allah Azze ve Celle için mahlûkta olan her şeyi isbat eder, sakal ve tenasül uzvunda ise tevakkuf ederdi (durur, bir şey söylemezdi);"], [1002.0, "bunun dışında mahlûk için sabit olan her sıfat Yaratan için de sabittir (derdi)."], [1013.3, "Şüphesiz bu, kişiyi milletten tamamen çıkaran büyük küfürdür; Allah'a sığınırız."]]}, {"reader": false, "ar": [[1020.0, "فإن قلت: وما الذي يحملهم على هذا التمثيل؟"], [1027.0, "<span class=\"note\">(يكررها)<\/span> الجواب: تلك القواعدُ الإبليسيّةُ الملعونةُ الثلاث،"], [1033.0, "والتي أجبنا عنها سابقًا وحذّرنا منها:"], [1038.0, "وهي أنّ الاتفاق في الأسماء يستلزم الاتفاقَ في الصفات،"], [1044.0, "وصوّبناها بقولنا: الاتفاقُ في الأسماء لا يستلزم الاتفاقَ في الصفات."], [1050.0, "والثانية: قولُهم: الاتفاقُ في الاسم الكلّيّ المطلق يستلزم الاتفاقَ بعد الإضافة والتقييد والتخصيص،"], [1060.0, "وصوّبناها بقولنا: إنّ الاتفاق في الاسم الكلّيّ المطلق لا يستلزم الاتفاقَ بعد الإضافة والتقييد والتخصيص."], [1071.0, "والثالثة: وجوبُ قياس الغائب على الشاهد،"], [1075.0, "وقلنا: إنّ صوابها: لا قياسَ في الغيبيّات،"], [1081.0, "لا قياسَ في الغيبيّات."]], "tr": [[1020.0, "Eğer \"Onları bu temsile sevk eden nedir?\" dersen, (tekrar ediyor) cevap şudur:"], [1030.3, "Daha önce cevapladığımız ve sakındırdığımız o üç lanetli iblisçe kaide:"], [1038.0, "Birincisi, isimlerde ortaklığın sıfatlarda ortaklığı gerektirdiğidir;"], [1045.2, "biz bunu \"İsimlerde ortaklık sıfatlarda ortaklığı gerektirmez\" sözümüzle düzelttik."], [1050.0, "İkincisi, onların \"Mutlak küllî isimde ortaklık, izafet, takyid ve tahsisten sonra da ortaklığı gerektirir\" sözüdür;"], [1061.4, "biz bunu \"Mutlak küllî isimde ortaklık, izafet, takyid ve tahsisten sonra ortaklığı gerektirmez\" sözümüzle düzelttik."], [1071.0, "Üçüncüsü, gâibin şâhide kıyas edilmesinin vâcip olduğudur;"], [1075.7, "biz de doğrusunun şu olduğunu söyledik:"], [1078.7, "Gaybî konularda kıyas yoktur, gaybî konularda kıyas yoktur."]]}, {"reader": false, "ar": [[1083.0, "فمن سدّ على إبليسه ونفسه الأمّارة بالسوء هذه الأصولَ الإبليسيّةَ الثلاث،"], [1091.0, "فإنّ عقله وقلبه سيكون نظيفًا ونقيًّا من بذرة ـ إبليس،"], [1096.2, "من بذرة ـ التمثيل الإبليسيّة،"], [1101.0, "والتي لا يزال إبليسُ يُجلِب بخيله ورَجِله على زراعتها ما استطاع؛"], [1107.0, "لأنها متى ما زُرعت في عقلك وقلبك فإنّ الشرك والوثنيّة والكفر والتمثيل والتعطيل سيكون منك قريبًا جدًّا."], [1117.0, "فنسأل الله أن يعصم عقولنا وقلوبنا من هذه البذرة الخبيثة. والله أعلم."]], "tr": [[1083.0, "Kim iblisine ve kötülüğü emreden nefsine bu üç iblisçe esası kapatırsa, aklı ve kalbi iblisin tohumundan —temsilin iblisçe tohumundan— temiz ve arınmış olur."], [1097.3, "İblis, gücü yettiğince atlılarıyla ve yayalarıyla bu tohumu ekmek için hâlâ yüklenmektedir."], [1107.0, "Çünkü o, aklına ve kalbine ekildiği zaman şirk, putperestlik, küfür, temsil ve ta'til sana çok yakın olur."], [1117.0, "Allah'tan akıllarımızı ve kalplerimizi bu habis tohumdan korumasını dileriz. Allah en iyisini bilir."]]}]}, {"ts": "18:43", "title": "3. Külliye: Sahih delillerle sabit olan bir sıfatı inkâr ve tekzib yoluyla inkâr eden herkes kâfir olmuştur", "paras": [{"reader": false, "ar": [[1124.6, "الكلّيّة كم؟ ـ (الحاضرون:) الثالثة."], [1129.0, "ـ «كلُّ من أنكر...»، إحنا قلنا القاعدة اللي قبلها:"], [1133.1, "«شبّه»، ها؟ طيّب، إذًا الكلّيّة ذيك في التشبيه،"], [1136.1, "الآن في الإنكار <span class=\"q\">؟ 18:49<\/span>: <b>كلُّ من أنكر صفةً ثبتت بها الأدلّةُ الصحيحةُ إنكارَ جحودٍ وتكذيبٍ فقد كفر.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [1168.0, "<b>كلُّ من أنكر صفةً ثبتت بها الأدلّةُ الصحيحةُ إنكارَ جحودٍ وتكذيبٍ فقد كفر.<\/b>"]], "tr": [[1124.6, "Külliye kaç? —(Dinleyiciler:) Üçüncü. —\"İnkâr eden herkes...\" Bundan önceki kaide için \"benzeten\" demiştik, değil mi?"], [1133.1, "Peki, o külliye teşbih hakkındaydı, şimdiki ise inkâr hakkında <span class=\"q\">؟<\/span>:"], [1136.1, "<b>3. külliye: Sahih delillerin sabit kıldığı bir sıfatı inkâr ve tekzib (yalanlama) yoluyla inkâr eden herkes kâfir olmuştur.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [1168.0, "<b>3. külliye: Sahih delillerin sabit kıldığı bir sıfatı inkâr ve tekzib yoluyla inkâr eden herkes kâfir olmuştur.<\/b>"]]}, {"reader": false, "ar": [[1174.0, "أقولُ وبالله التوفيق: اعلم رحمك الله تعالى أنّ الكلّيّة التي قبلها إنما هي في حكم من شبّه الله بخلقه؛"], [1185.0, "فهو لم يجحد آيةً،"], [1187.7, "ولم يجحد صفةً، ولكنه فهمها فهمًا مغلوطًا مخالفًا للإجماع."], [1196.0, "وأمّا هذه الكلّيّة فإنها في حقّ من جاء إلى الصفة وعطّلها أصلًا."]], "tr": [[1174.0, "Tevfik Allah'tandır, derim ki: Bil ki —Allah sana rahmet etsin— bundan önceki külliye, Allah'ı mahlûkuna benzeten kişinin hükmü hakkındadır."], [1185.0, "O ne bir ayeti ne de bir sıfatı inkâr etmiştir;"], [1189.7, "fakat onu yanlış, icmâya aykırı bir anlayışla anlamıştır."], [1196.0, "Bu külliye ise sıfata gelip onu tamamen ta'til eden kişi hakkındadır."]]}, {"reader": false, "ar": [[1204.0, "وأنت ترى أنّ الكلّيّة فيها تقسيم،"], [1209.0, "وهي: أنّ كلَّ من أنكر شيئًا ممّا ثبتت به الأدلّة في باب الأسماء والصفات،"], [1215.0, "فلا يخلو إنكارُه هذا من حالتين:"], [1218.0, "إمّا أن يكون إنكارَ تكذيبٍ وجحودٍ وردٍّ للدليل،"], [1224.0, "وإمّا أن يكون إنكارَ تأويلٍ سائغٍ في اللغة؛"], [1232.0, "فهو لا يجحد الدليل،"], [1234.4, "ولا يكفر بالصفة التي دلّ عليها الدليل،"], [1238.5, "ولكن يفهمها فهمًا مخالفًا لفهم السلف،"], [1242.0, "والذي يحمله على ذلك شيءٌ من الشُّبَه التي وردت على عقله."]], "tr": [[1204.0, "Görüyorsun ki külliyede bir taksim vardır:"], [1209.4, "İsim ve sıfatlar babında delillerin sabit kıldığı bir şeyi inkâr eden herkesin bu inkârı iki hâlden boş değildir:"], [1218.0, "Ya tekzib, inkâr ve delili reddetme inkârıdır;"], [1223.1, "ya da dilde caiz olan bir te'vil inkârıdır."], [1232.0, "(İkincisinde) o, delili inkâr etmez, delilin delâlet ettiği sıfatı da inkâr etmez;"], [1239.1, "fakat onu selefin anlayışına aykırı bir şekilde anlar."], [1243.9, "Onu buna sevk eden, aklına gelen birtakım şüphelerdir."]]}, {"reader": false, "ar": [[1249.0, "وأمّا الأوّل فإنه يجحد كونَ هذه آيةً،"], [1252.9, "ويجحد كونَها حديثًا، ويجحد ما دلّت عليه من الصفة؛"], [1258.0, "فيقول: أنا أُكذّب بالصفة التي يدلّ عليها «وجهُ الله»:"], [1263.2, "<span class=\"ayah\">﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٧]<\/span>، ويُكذّب ويجحد بالصفة التي يدلّ عليها قولُ الله عز وجل:"], [1270.4, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span>. وأمّا الثاني فيقول:"], [1274.0, "آمنتُ بأنّ لله وجهًا يليق بجلاله،"], [1278.1, "ولكنه عندي هو الذات،"], [1281.0, "وآمنتُ بأنّ لله يدين على ما يليق بجلاله،"], [1286.3, "ولكنها عندي النعمةُ والقدرة. ففُرقانٌ بين الأمرين."]], "tr": [[1249.0, "Birincisine gelince, o bunun ayet olduğunu inkâr eder, hadis olduğunu inkâr eder ve onun delâlet ettiği sıfatı inkâr eder."], [1258.0, "Şöyle der: \"Ben 'Allah'ın yüzü'nün —<span class=\"ayah\">﴿Rabbinin yüzü bâkî kalacaktır﴾<\/span> [Rahmân 27]— delâlet ettiği sıfatı yalanlıyorum.\" Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bilakis O'nun iki eli de açıktır﴾<\/span> [Mâide 64] sözünün delâlet ettiği sıfatı yalanlar ve inkâr eder."], [1270.4, "İkincisi ise şöyle der: \"Allah'ın celâline yakışan bir yüzü olduğuna iman ettim, fakat o bana göre zâttır."], [1274.0, "Allah'ın celâline yakışır şekilde iki eli olduğuna iman ettim, fakat o bana göre nimet ve kudrettir.\" İki durum arasında büyük fark vardır."]]}, {"reader": false, "ar": [[1293.0, "فكلّيّتُنا هذه في الطرف الأوّل،"], [1296.0, "وستأتي إن شاء الله كلّيّةُ الطرف الثاني."], [1300.0, "فالكلّيّة التي معنا تحكم على أصحاب الطرف الأوّل بأنهم كفّار؛"], [1307.0, "وذلك لإجماع أهل السنة والجماعة على أنّ كلَّ من جحد ـ على أنّ كلَّ من جحد ما ثبت به الوحيُ فإنه كافر،"], [1319.0, "إن كان جحودُه جحودَ تكذيبٍ وإنكار."], [1322.0, "ولذلك جعل الشارعُ من جملة موجبات الكفر تكذيبَ خبره،"], [1326.7, "تكذيبَ خبره. فإنّ حقيقة من يجحد شيئًا ممّا ثبت به الوحيُ كأنه يقول:"], [1336.0, "لقد كذب الشارعُ في هذا النصّ."]], "tr": [[1293.0, "Bu külliyemiz birinci taraf hakkındadır;"], [1296.6, "ikinci tarafın külliyesi inşallah gelecektir."], [1300.0, "Elimizdeki külliye, birinci tarafın sahiplerinin kâfir olduğuna hükmeder."], [1307.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'in şu konudaki icmâı sebebiyledir:"], [1313.3, "Vahyin sabit kıldığı şeyi inkâr eden —vahyin sabit kıldığı şeyi inkâr eden herkes, inkârı tekzib ve inkâr şeklinde ise kâfirdir."], [1322.0, "Bu yüzden Şâri', küfrü gerektiren şeyler arasına O'nun haberini yalanlamayı koymuştur;"], [1328.0, "O'nun haberini yalanlamayı. Çünkü vahyin sabit kıldığı bir şeyi inkâr edenin hakikati, sanki \"Şâri' bu nasta yalan söyledi\" demesidir."]]}]}, {"ts": "22:19", "title": "3. Külliye (devam): Şâri'i yalanlamak imanın aslını yıkar", "paras": [{"reader": false, "ar": [[1339.0, "والمتقرِّر في القواعد: أنّ كلَّ من كذّب الشارعَ في شيءٍ من أخباره الصحيحة فإنه يكون كافرًا؛"], [1348.6, "لأنه هدم أصلَ الإيمان الذي يُبنى عليه الدين،"], [1353.0, "وهو تصديقُ الشارع. فإنه لا يمكن أبدًا أن نؤمن بربٍّ يمكن أن يدخل الكذبُ في شيءٍ من أخباره،"], [1364.0, "ولا يمكن أن نؤمن بنبوّة رسولٍ يمكن أن يدخل الكذبُ في شيءٍ من أخباره."], [1371.0, "فمن أوائل ما يجب الإقرارُ به حتى نؤمن إيمانًا صحيحًا ـ ها ـ كمالُ التصديق بخبر الله ورسوله."]], "tr": [[1339.0, "Kaidelerde yerleşik olan şudur: Şâri'i sahih haberlerinden herhangi birinde yalanlayan herkes kâfir olur."], [1348.6, "Çünkü dinin üzerine bina edildiği imanın aslını, yani Şâri'i tasdik etmeyi yıkmıştır."], [1356.0, "Haberlerinden herhangi birine yalanın girmesi mümkün olan bir Rabb'e asla iman edemeyiz;"], [1362.8, "haberlerinden herhangi birine yalanın girmesi mümkün olan bir resûlün nübüvvetine de iman edemeyiz."], [1371.0, "Sahih bir imanla iman etmemiz için ikrar edilmesi vâcip olan ilk şeylerden biri —hı— Allah'ın ve Resûlü'nün haberini tam olarak tasdik etmektir."]]}, {"reader": false, "ar": [[1381.0, "ولذلك يقول الله عز وجل:"], [1383.0, "<span class=\"ayah\">﴿وَمَنْ أَصْدَقُ مِنَ اللَّهِ حَدِيثًا﴾<\/span> <span class=\"ref\">[النساء: ٨٧]<\/span>،"], [1386.0, "<span class=\"ayah\">﴿وَمَنْ أَصْدَقُ مِنَ اللَّهِ قِيلًا﴾<\/span> <span class=\"ref\">[النساء: ١٢٢]<\/span>،"], [1389.0, "وقال عز وجل: <span class=\"ayah\">﴿قُلْ صَدَقَ اللَّهُ﴾<\/span> <span class=\"ref\">[آل عمران: ٩٥]<\/span>،"], [1391.0, "ويقول الله عز وجل:"], [1392.8, "<span class=\"ayah\">﴿وَلَوْ كَانَ﴾<\/span> ـ أي هذا الوحي ـ <span class=\"ayah\">﴿مِنْ عِندِ غَيْرِ اللَّهِ لَوَجَدُوا فِيهِ اخْتِلَافًا كَثِيرًا﴾<\/span> <span class=\"ref\">[النساء: ٨٢]<\/span>."]], "tr": [[1381.0, "Bu yüzden Allah Azze ve Celle şöyle buyurur:"], [1383.0, "<span class=\"ayah\">﴿Söz bakımından Allah'tan daha doğru kim olabilir?﴾<\/span> [Nisâ 87], <span class=\"ayah\">﴿Söyleyiş bakımından Allah'tan daha doğru kim olabilir?﴾<\/span> [Nisâ 122]."], [1390.0, "Allah Azze ve Celle (yine) buyurdu:"], [1391.0, "<span class=\"ayah\">﴿De ki: Allah doğru söyledi﴾<\/span> [Âl-i İmrân 95]."], [1392.8, "Allah Azze ve Celle şöyle buyurur:"], [1394.2, "<span class=\"ayah\">﴿Eğer o﴾<\/span> —yani bu vahiy— <span class=\"ayah\">﴿Allah'tan başkası katından olsaydı, onda birçok çelişki bulurlardı﴾<\/span> [Nisâ 82]."]]}, {"reader": false, "ar": [[1400.0, "ألا ترى ـ ألا ترى أنّ من أوائل شروط اختيار النبيّ والرسول ألّا يُعهَدَ عليه كذبةٌ ولو في وقت الجاهليّة؟"], [1412.0, "ولذلك من الصفات التي كان أهلُ الجاهليّة يصفون بها النبيّ صلى الله عليه وسلم:"], [1421.1, "أنه الصادقُ الأمين. فإذا جوّز العقلُ دخولَ شيءٍ من الكذب في أخبار الشارع،"], [1433.0, "فحينئذٍ هذا يتضمّن إبطالَ ألوهيّة الربّ عز وجل،"], [1438.1, "ونبوّةِ الأنبياء والرسل. ولقد حاول أهلُ الباطل أن يُدخلوا شيئًا من الكذب أو الخُلف في أخبار الله ورسوله،"], [1449.5, "ولكن أنّى لهم ذلك، أنّى لهم ذلك!"]], "tr": [[1400.0, "Görmüyor musun —görmüyor musun ki nebî ve resûlün seçilme şartlarının ilklerinden biri, cahiliye döneminde bile olsa ondan bir yalan bilinmemesidir?"], [1412.0, "Bu yüzden cahiliye ehlinin Peygamber sallallâhu aleyhi ve sellem'i nitelendirdiği sıfatlardan biri \"es-Sâdıku'l-Emîn\" (doğru sözlü ve güvenilir) olmasıdır."], [1423.0, "Akıl, Şâri'in haberlerine herhangi bir yalanın girmesini caiz görürse, o zaman bu, Rabb Azze ve Celle'nin ulûhiyyetini, nebîlerin ve resûllerin nübüvvetini iptal etmeyi içerir."], [1440.0, "Bâtıl ehli Allah'ın ve Resûlü'nün haberlerine bir miktar yalan veya hulf (sözden dönme) sokmaya çalıştılar;"], [1448.2, "fakat bu onlar için nerede, bu onlar için nerede!"]]}, {"reader": false, "ar": [[1452.0, "فحقيقةُ من يجحد ويُكذّب أخبارَ الوحي،"], [1455.9, "حقيقتُه أنه يُبطل ألوهيّةَ الله،"], [1459.2, "ويُبطل نبوّةَ محمّدٍ صلى الله عليه وسلم؛"], [1465.0, "فلا جرمَ أننا لا نجد له حكمًا مناسبًا إلا أن نصفه بأنه كافر،"], [1472.0, "ولا نعلم في ذلك نزاعًا بين أهل العلم رحمهم الله."]], "tr": [[1452.0, "Vahyin haberlerini inkâr eden ve yalanlayanın hakikati, onun Allah'ın ulûhiyyetini iptal etmesi ve Muhammed sallallâhu aleyhi ve sellem'in nübüvvetini iptal etmesidir."], [1465.0, "Şüphesiz onun için, onu kâfir olarak nitelendirmekten başka uygun bir hüküm bulamayız."], [1470.9, "Bu hususta ilim ehli —Allah onlara rahmet etsin— arasında bir ihtilaf bilmiyoruz."]]}, {"reader": false, "ar": [[1476.0, "وكلُّ ذلك متفرّعٌ على قولهم:"], [1478.9, "بأنّ كلَّ من أنكر معلومًا من الدين بالضرورة فقد كفر،"], [1483.0, "ومن المعلوم من الدين بالضرورة:"], [1485.1, "صدقُ الشارع، وعدمُ احتماليّة دخول الكذب في شيءٍ من أخبار الشرع."], [1492.0, "ولأنّ المتقرِّر في القواعد:"], [1494.2, "أنّ كلَّ من اعتقد احتماليّةَ دخول شيءٍ من الكذب في أخبار الشارع فإنه مُبطِلٌ لربوبيّة الربّ،"], [1503.3, "وألوهيّة الإله، ولنبوّة النبيّ صلى الله عليه وسلم،"], [1508.0, "ولا يمكن أن يُحكَم عليه إلا بذلك."], [1512.0, "ولكنّ هذا التكفيرَ من الوصف العام،"], [1516.1, "والمتقرِّر في القواعد: أنّ التكفير بالوصف العام لا يستلزم تكفيرَ المعيَّن إلا بعد ثبوت الشروط وانتفاء الموانع."]], "tr": [[1476.0, "Bütün bunlar onların şu sözünden dallanır:"], [1478.9, "Dinden zarûrî olarak bilinen bir şeyi inkâr eden herkes kâfir olmuştur."], [1483.0, "Dinden zarûrî olarak bilinenlerden biri de Şâri'in doğruluğu ve şeriatın haberlerinden herhangi birine yalanın girme ihtimalinin olmamasıdır."], [1492.0, "Ayrıca kaidelerde yerleşik olan şudur:"], [1494.2, "Şâri'in haberlerine herhangi bir yalanın girme ihtimaline inanan herkes Rabb'in rubûbiyyetini, İlah'ın ulûhiyyetini ve Peygamber sallallâhu aleyhi ve sellem'in nübüvvetini iptal etmiş olur;"], [1507.4, "onun hakkında bundan başka bir hüküm verilemez."], [1512.0, "Fakat bu tekfir genel vasıftandır (genel vasıfla tekfirdir)."], [1518.1, "Kaidelerde yerleşik olan şudur: Genel vasıfla tekfir, şartlar sabit olup engeller ortadan kalkmadıkça muayyen kişinin tekfirini gerektirmez."]]}]}, {"ts": "25:28", "title": "4. Külliye: Allah'ın bütün sıfatları için \"manası bilinir, keyfiyeti bilinmez; ona iman vâciptir, keyfiyetini sormak bid'attir\" denir", "paras": [{"reader": false, "ar": [[1528.0, "ومن الكلّيّات أيضًا: كلُّ صفات الله يقال فيها:"], [1533.3, "معلومةُ المعنى، مجهولةُ الكيف،"], [1536.0, "والإيمانُ بها واجب، والسؤالُ عن الكيفيّة بدعة. مَن يُعيدها؟"], [1542.1, "يلّا، مَن منكم البطلُ الذي يُعيدها؟"], [1547.0, "ـ إيوه ـ <span class=\"note\">(يكررها أحد الطلاب)<\/span> أُعيدها مرّةً ثالثة:"], [1561.0, "كلُّ صفات الله عز وجل يقال فيها:"], [1565.7, "معلومةُ المعنى، مجهولةُ الكيف،"], [1568.0, "والإيمانُ بها واجب، والسؤالُ عن كيفيّتها بدعة. ما شاء الله."]], "tr": [[1528.0, "Külliyelerden biri de şudur: 4."], [1530.0, "külliye: Allah'ın bütün sıfatları hakkında şöyle denir:"], [1533.3, "Manası bilinir, keyfiyeti bilinmez; ona iman vâciptir, keyfiyetini sormak bid'attir. Onu kim tekrar eder?"], [1542.1, "Haydi, içinizden onu tekrar edecek kahraman kim?"], [1547.0, "—Evet— (Talebelerden biri tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [1561.0, "4. külliye: Allah Azze ve Celle'nin bütün sıfatları hakkında şöyle denir:"], [1567.4, "Manası bilinir, keyfiyeti bilinmez; ona iman vâciptir, keyfiyetini sormak bid'attir. Mâşâallah."]]}, {"reader": false, "ar": [[1574.0, "أقولُ وبالله التوفيق: وهذا ما أجاب به الإمامُ مالكٌ رحمه الله تعالى لمن دخل عليه في حلقةٍ من حلقاته وهو في المسجد،"], [1588.0, "فقال: يا إمام، <span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span>،"], [1592.7, "كيف استوى؟ فأطرق مالكٌ رحمه الله تعالى حتى علاه الرُّحَضاء ـ يعني العرق ـ ثم رفع رأسه فقال:"], [1601.8, "«الاستواءُ غيرُ مجهول، والكيفُ غيرُ معقول، والإيمانُ به واجب، والسؤالُ عنه بدعة، ولا أراك إلا مبتدعًا»."], [1613.0, "فأمر به فأُخرج من المسجد."]], "tr": [[1574.0, "Tevfik Allah'tandır, derim ki: Bu, İmam Mâlik'in —Allah ona rahmet etsin— mescitteyken ders halkalarından birinde yanına girip şöyle diyen kişiye verdiği cevaptır:"], [1588.7, "\"Ey İmam! <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5];"], [1594.0, "nasıl istivâ etti?\" Mâlik —Allah ona rahmet etsin— başını öne eğdi, öyle ki onu rühadâ —yani ter— kapladı."], [1601.8, "Sonra başını kaldırıp şöyle dedi:"], [1604.6, "\"İstivâ meçhul değildir, keyfiyeti akılla kavranamaz;"], [1610.0, "ona iman vâciptir, onu sormak bid'attir."], [1613.0, "Seni ancak bir bid'atçı olarak görüyorum.\" Sonra onun hakkında emir verdi ve mescitten çıkarıldı."]]}, {"reader": false, "ar": [[1616.0, "ولمّا نظر الأئمّةُ إلى جواب الإمام مالكٍ عمّن سأل عن كيفيّة صفة الاستواء،"], [1624.0, "وجدوه جوابًا صالحًا لكلّ من يسألك عن شيءٍ من كيفيّات صفات الله عز وجل."], [1632.0, "فإذا قيل لك: كيف وجهُ الله؟"], [1638.0, "فقل: الوجهُ معلومٌ باعتبار المعنى في اللغة،"], [1644.0, "ولكنه مجهولٌ باعتبار كيفيّته،"], [1647.0, "والإيمانُ به واجبٌ لأنه خبرٌ أخبرنا به الشارع،"], [1653.0, "والسؤالُ عن الكيفيّة بدعةٌ لأنه سؤالٌ لم يأمرنا به الشارع،"], [1660.0, "وليس معهودًا من فعل أصحاب النبيّ صلى الله عليه وسلم،"], [1664.0, "ولا من فعل أحدٍ من سلف الأمّة وأئمّتها."]], "tr": [[1616.0, "İmamlar, İmam Mâlik'in istivâ sıfatının keyfiyetini sorana verdiği cevaba baktıklarında, onu Allah Azze ve Celle'nin sıfatlarının keyfiyetlerinden herhangi birini sana soran herkese uygun bir cevap olarak buldular."], [1632.0, "Sana \"Allah'ın yüzü nasıldır?\" denilirse, de ki:"], [1634.3, "Yüz, dildeki manası itibarıyla bilinir, fakat keyfiyeti itibarıyla bilinmez."], [1638.0, "Ona iman vâciptir; çünkü Şâri'in bize bildirdiği bir haberdir."], [1647.0, "Keyfiyetini sormak bid'attir; çünkü Şâri'in bize emretmediği bir sorudur."], [1655.1, "Ne Peygamber sallallâhu aleyhi ve sellem'in ashâbının ne de ümmetin selefinden ve imamlarından herhangi birinin yaptığı bilinen bir şey değildir."]]}, {"reader": false, "ar": [[1667.0, "فإنّ تلك الآياتِ والنصوصَ الصفاتيّة كانت تطرق مسامعَ الصحابة،"], [1675.0, "ولم يكن يتكلّف الواحدُ منهم أن يسأل عن كيفيّة شيءٍ من ذلك؛"], [1679.0, "إذًا السؤالُ عن كيفيّة شيءٍ من ذلك من البدع المحرّمة."], [1683.0, "وإذا قيل لك: <span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span>،"], [1686.6, "فكيف يداه؟ فقل: معنى اليد في اللغة العربيّة معلوم،"], [1692.0, "ولكنّ كيفيّة يد الله على ما هي عليه في الواقع مجهولة،"], [1698.0, "والإيمانُ بها واجبٌ لأنه خبرٌ من أخبار الشارع،"], [1704.0, "والسؤالُ عن كيفيّتها بدعةٌ لأنه سؤالٌ مُحدَثٌ في الإسلام."]], "tr": [[1667.0, "Çünkü o ayetler ve sıfat nasları sahabenin kulaklarına çarpıyordu;"], [1672.0, "içlerinden hiçbiri bunlardan herhangi birinin keyfiyetini sormaya kalkışmıyordu."], [1676.7, "Öyleyse bunlardan herhangi birinin keyfiyetini sormak haram bid'atlerdendir."], [1679.0, "Sana <span class=\"ayah\">﴿Bilakis O'nun iki eli de açıktır﴾<\/span> [Mâide 64] (ayeti okunup) \"O'nun iki eli nasıldır?\" denilirse, de ki:"], [1687.8, "Arap dilinde elin manası bilinir, fakat Allah'ın elinin gerçekte olduğu hâliyle keyfiyeti bilinmez."], [1696.4, "Ona iman vâciptir; çünkü Şâri'in haberlerinden bir haberdir."], [1702.3, "Keyfiyetini sormak bid'attir; çünkü İslâm'da sonradan çıkarılmış bir sorudur."]]}, {"reader": false, "ar": [[1709.0, "وإذا قيل لك: «ينزل ربُّنا» ـ ها ـ كيف نزولُه؟"], [1717.0, "فقل: معنى النزول في اللغة العربيّة معلوم،"], [1720.0, "وكيفيّةُ نزول الله عز وجل على ما هو عليه في الواقع مجهول،"], [1726.0, "والإيمانُ به واجبٌ لأنه خبرٌ عن الشارع،"], [1731.0, "والسؤالُ عن كيفيّته بدعةٌ لأنه مُحدَثٌ في الإسلام."], [1736.0, "وإذا قيل لك: «بين إصبعين من أصابع الرحمن»،"], [1740.0, "كيف أصابعُه؟ فقل: معنى الأصابع في اللغة العربيّة معلوم،"], [1746.0, "والكيفُ مجهول، والإيمانُ به واجب، والسؤالُ عنه بدعة."]], "tr": [[1709.0, "Sana \"Rabbimiz iner\" (hadisi okunup) —hı— \"O'nun inişi nasıldır?\" denilirse, de ki:"], [1711.2, "Arap dilinde nüzulün manası bilinir;"], [1717.0, "Allah Azze ve Celle'nin gerçekte olduğu hâliyle inişinin keyfiyeti ise bilinmez."], [1723.2, "Ona iman vâciptir; çünkü Şâri'den gelen bir haberdir."], [1729.6, "Keyfiyetini sormak bid'attir; çünkü İslâm'da sonradan çıkarılmıştır."], [1736.0, "Sana \"(Kalpler) Rahmân'ın parmaklarından iki parmak arasındadır\" (hadisi okunup) \"O'nun parmakları nasıldır?\" denilirse, de ki:"], [1741.3, "Arap dilinde parmakların manası bilinir;"], [1744.7, "keyfiyeti bilinmez; ona iman vâciptir; onu sormak bid'attir."]]}, {"reader": false, "ar": [[1751.0, "وصدق الناظمُ لمّا ذكر سؤالَ ـ جوابَ الإمام مالك،"], [1756.0, "قال: «فأَجْرِهِ في كلِّها تَفُوزُ ... بالعلمِ صافٍ، والهدى تَحُوزُ» <span class=\"q\">؟ 29:16<\/span>."], [1765.0, "فمتى ما سُئلتَ عن شيءٍ من كيفيّات صفات الله عز وجل،"], [1771.0, "فإنّ الواجب عليك أن تُجيب السائلَ بهذه النقاط الأربع."], [1777.0, "وقد رُوي هذا الجوابُ عن شيخه ربيعةِ الرأي،"], [1783.0, "ويُروى موقوفًا على أمّ سلمة،"], [1787.0, "بل ويُروى مرفوعًا للنبيّ صلى الله عليه وسلم،"], [1793.0, "ولكنّ كلَّ ذلك لا يصحّ،"], [1795.0, "وإنما الذي يصحّ هو أنه من أجوبة الإمام مالكٍ رحمه الله تعالى."]], "tr": [[1751.0, "Nâzım, İmam Mâlik'in sorusunu —cevabını— zikrettiğinde ne doğru söylemiştir:"], [1756.7, "\"Onu (bu cevabı) hepsinde (bütün sıfatlarda) uygula;"], [1765.0, "berrak ilimle kazanırsın ve hidayete erersin.\" <span class=\"q\">؟<\/span> Allah Azze ve Celle'nin sıfatlarının keyfiyetlerinden herhangi biri sana sorulduğunda, soran kişiye bu dört maddeyle cevap vermen vâciptir."], [1771.7, "Bu cevap onun hocası Rebîatü'r-Re'y'den de rivayet edilmiştir;"], [1774.3, "Ümmü Seleme'ye mevkuf olarak da rivayet edilir;"], [1777.0, "hatta Peygamber sallallâhu aleyhi ve sellem'e merfû olarak da rivayet edilir."], [1787.7, "Fakat bunların hepsi sahih değildir."], [1793.0, "Sahih olan ancak bunun İmam Mâlik'in —Allah ona rahmet etsin— cevaplarından olmasıdır."]]}]}, {"ts": "30:02", "title": "4. Külliye (devam): İmam Mâlik'in cevabındaki dört maddenin açıklaması", "paras": [{"reader": false, "ar": [[1802.0, "وأمّا من بعد الإمام مالك فقد أجمعوا جميعًا على أنه من الأجوبة الصالحة أن تُجرى جوابًا عن كلّ سؤالٍ يتعلّق بشيءٍ من كيفيّات صفات الله عز وجل."], [1819.0, "قولُه: «الاستواءُ معلوم» أي باعتبار اللغة العربيّة،"], [1827.0, "وقد شرحنا في ذلك كلّيّةً خاصّة."], [1831.0, "«والكيفُ مجهول» أي باعتبار الحقيقة والواقع؛"], [1837.0, "فإنه لا يعلم كيفَ صفاتِ الله إلا اللهُ عز وجل."], [1841.0, "«والإيمانُ به واجب» لأنه خبرٌ ثبت عن الشرع،"], [1845.0, "وكلُّ أخبار الشرع حقٌّ وصدق."], [1847.0, "«والسؤالُ عن الكيفيّة بدعة» لأنه سؤالٌ ليس معهودًا من فعل أصحاب النبيّ صلى الله عليه وسلم،"], [1858.0, "ولا من فعل أحدٍ من أصحاب القرون المفضّلة،"], [1861.7, "ولا نزال إلى يومنا هذا وأهلُ السنة يُقرّرون بأنّ السؤال عن شيءٍ من كيفيّات صفات الله عز وجل من جملة البدع."]], "tr": [[1802.0, "İmam Mâlik'ten sonrakilere gelince, hepsi bunun Allah Azze ve Celle'nin sıfatlarının keyfiyetlerinden herhangi biriyle ilgili her soruya cevap olarak uygulanacak uygun cevaplardan olduğunda icmâ etmişlerdir."], [1819.0, "Onun \"İstivâ bilinir\" sözü, yani Arap dili itibarıyla;"], [1823.5, "bu hususta özel bir külliye şerh etmiştik."], [1831.0, "\"Keyfiyeti bilinmez\", yani hakikat ve gerçeklik itibarıyla;"], [1837.0, "çünkü Allah'ın sıfatlarının nasıl olduğunu Allah Azze ve Celle'den başkası bilmez."], [1841.0, "\"Ona iman vâciptir\"; çünkü şeriattan sabit olmuş bir haberdir ve şeriatın bütün haberleri hak ve doğrudur."], [1847.0, "\"Keyfiyetini sormak bid'attir\"; çünkü ne Peygamber sallallâhu aleyhi ve sellem'in ashâbının ne de faziletli asırların ehlinden herhangi birinin yaptığı bilinen bir soru değildir."], [1862.2, "Günümüze kadar Ehl-i Sünnet, Allah Azze ve Celle'nin sıfatlarının keyfiyetlerinden herhangi birini sormanın bid'atlerden olduğunu hâlâ tespit etmektedir."]]}]}, {"ts": "31:12", "title": "5. Külliye: Nassın bir sıfatın diğerine üstünlüğünü sabit kıldığı her tafâdule, mefdûlün noksanlığını gerektirmeyecek şekilde iman ederiz", "paras": [{"reader": false, "ar": [[1872.0, "ومن الكلّيّات أيضًا: <b>كلُّ تفاضلٍ ثبت به النصُّ لصفةٍ على صفةٍ فنؤمن به ـ انتبه ـ على وجهٍ لا يستلزم نقصَ المفضول.<\/b> أُعيدها مرّةً ثانية:"], [1896.0, "<b>كلُّ تفاضلٍ ثبت به النصُّ لصفةٍ على صفةٍ فنؤمن به على وجهٍ لا يستلزم نقصَ المفضول.<\/b> طيّب."]], "tr": [[1872.0, "Külliyelerden biri de şudur: 5."], [1874.0, "külliye: Nassın bir sıfatın başka bir sıfata üstünlüğünü sabit kıldığı her tafâdule —dikkat et— mefdûlün (üstün tutulmayanın) noksanlığını gerektirmeyecek şekilde iman ederiz. İkinci kez tekrar ediyorum:"], [1896.0, "<b>5. külliye: Nassın bir sıfatın başka bir sıfata üstünlüğünü sabit kıldığı her tafâdule, mefdûlün noksanlığını gerektirmeyecek şekilde iman ederiz.<\/b> Peki."]]}, {"reader": false, "ar": [[1910.0, "أقولُ وبالله التوفيق: لقد بيّنتُ لكم سابقًا بأنّ كلَّ شيءٍ يُضاف إلى الله عز وجل فإنه يدخله التفاضلُ باعتبار،"], [1922.3, "ولا يدخله باعتبار. وفي كلّيّات الأسماء قلتُ:"], [1932.3, "إنّ أسماء الله تتفاضل باعتبار دلالاتها على المعاني،"], [1936.9, "ولا تتفاضل باعتبار دلالتها على ذات الربّ عز وجل؛"], [1942.0, "لأنّ أسماء الله متّفقةٌ باعتبار دلالتها على الذات،"], [1946.0, "ومتفاضلةٌ باعتبار دلالتها على الصفات."], [1951.0, "وهكذا أيضًا نقول في صفات الله عز وجل:"], [1955.0, "بأنّ بعضها أفضلُ من بعض،"], [1957.0, "لكنّ هذا التفضيل مشروطٌ بشرطين في الكلّيّة."]], "tr": [[1910.0, "Tevfik Allah'tandır, derim ki: Daha önce size, Allah Azze ve Celle'ye izafe edilen her şeye bir itibarla tafâdulün girdiğini, bir itibarla da girmediğini açıklamıştım."], [1930.0, "İsimlerin külliyelerinde de şöyle demiştim:"], [1932.3, "Allah'ın isimleri manalara delâletleri itibarıyla birbirinden üstündür;"], [1935.7, "Rabb Azze ve Celle'nin zâtına delâletleri itibarıyla ise birbirinden üstün değildir."], [1942.0, "Çünkü Allah'ın isimleri zâta delâletleri itibarıyla müttefik, sıfatlara delâletleri itibarıyla ise birbirinden üstündür."], [1951.0, "Allah Azze ve Celle'nin sıfatları hakkında da aynı şekilde, bazısının bazısından üstün olduğunu söyleriz."], [1956.6, "Fakat bu üstün tutma, külliyede (belirtilen) iki şarta bağlıdır."]]}, {"reader": false, "ar": [[1961.0, "الشرطُ الأوّل: قولُه: «ثبت به النصّ»؛"], [1966.0, "وذلك لأنّ التفاضل في الأمر الغيبيّ توقيفيٌّ على النصّ،"], [1973.0, "فلا حقَّ لك أن تُفضّل صفةً على صفةٍ إلا إذا جئتنا بالدليل الدالّ على أفضليّة هذه الصفة على تلك الصفة."], [1983.0, "الشرطُ الثاني: ألّا يتضمّن تفضيلُ إحدى الصفتين على الأخرى انتقاصَ الصفة المفضولة؛"], [1993.0, "بل لا تزال الصفةُ الفاضلة لها الأكمليّةُ المطلقة،"], [1999.0, "ولا تزال الصفةُ المفضولة لها الأكمليّةُ المطلقة،"], [2004.0, "ولكنّ التفاضل إنما يكون بالمعاني فقط،"], [2009.0, "ولكن يبقى المفضولُ له الأكمليّةُ المطلقة."]], "tr": [[1961.0, "Birinci şart: Onun \"nassın sabit kıldığı\" sözüdür."], [1966.0, "Çünkü gaybî bir konuda tafâdul nassa bağlıdır (tevkîfîdir)."], [1971.9, "Dolayısıyla, bu sıfatın şu sıfattan üstün olduğuna delâlet eden delili bize getirmedikçe bir sıfatı başka bir sıfattan üstün tutmaya hakkın yoktur."], [1983.0, "İkinci şart: İki sıfattan birini diğerinden üstün tutmanın, mefdûl sıfatın noksanlığını içermemesidir."], [1993.0, "Bilakis fâzıl (üstün) sıfat mutlak kemale sahip olmaya devam eder, mefdûl sıfat da mutlak kemale sahip olmaya devam eder."], [2004.8, "Tafâdul ancak manalarda olur; fakat mefdûl için de mutlak kemal bâki kalır."]]}, {"reader": false, "ar": [[2017.0, "كما نقول في التفضيل بين آيات القرآن وسُوَره؛"], [2024.0, "فإنّ بعض الآيات أو السور أفضلُ من بعض،"], [2028.0, "فهل هذا التفضيل يقتضي نقصَ المفضول؟"], [2032.0, "الجواب: لا، ولكنّ بعض المعاني أزيدُ من بعضها."], [2039.0, "فمتى ما توفّر هذان الشرطان في التفضيل بين صفات الله عز وجل،"], [2046.0, "فإنّ دخول التفضيل فيها قد قال به أهلُ السنة والجماعة،"], [2051.4, "كما سيأتي بيانُه. فإن قلت:"], [2054.0, "وما برهانُك على هذا؟"], [2056.0, "فأقول: لقد دلّت الأدلّةُ الصحيحةُ الصريحة على جواز دخول التفضيل بين صفات الله عز وجل بشرطه."]], "tr": [[2017.0, "Kur'an'ın ayetleri ve sûreleri arasındaki üstünlük hakkında söylediğimiz gibi:"], [2024.0, "Bazı ayetler veya sûreler bazısından üstündür."], [2027.0, "Peki bu üstün tutma mefdûlün noksanlığını gerektirir mi?"], [2032.0, "Cevap: Hayır; fakat bazı manalar bazısından daha fazladır."], [2039.0, "Allah Azze ve Celle'nin sıfatları arasında üstün tutmada bu iki şart bulunduğu zaman, onlara tafâdulün girdiğini Ehl-i Sünnet ve'l-Cemaat söylemiştir;"], [2050.8, "açıklaması gelecektir. Eğer \"Buna burhanın nedir?\" dersen, derim ki:"], [2056.0, "Sahih ve açık deliller, Allah Azze ve Celle'nin sıfatları arasına —şartıyla— tafâdulün girmesinin caiz olduğuna delâlet etmiştir."]]}]}, {"ts": "34:25", "title": "5. Külliye (devam): Rahmet sıfatının üstünlüğüne dair deliller; İsm-i A'zam", "paras": [{"reader": false, "ar": [[2065.0, "فمن ذلك ما في «الصحيحين» من حديث أبي هريرة رضي الله عنه قال:"], [2071.7, "قال النبيّ صلى الله عليه وسلم:"], [2074.8, "«لمّا قضى اللهُ الخلقَ كتب كتابًا، فهو عنده فوق العرش: إنّ رحمتي سبقت غضبي»،"], [2082.0, "وفي روايةٍ: «إنّ رحمتي غلبت غضبي»."], [2088.0, "<span class=\"note\">(Buhârî, Müslim)<\/span> فهذا دليلٌ على أفضليّة صفة الرحمة."], [2092.0, "والمتقرِّر في قواعد أهل السنة والجماعة:"], [2095.2, "أنّ كلَّ اسمٍ من أسماء الله فإنه يتضمّن صفة،"], [2100.0, "وقد قلتُ لكم سابقًا:"], [2102.9, "إنّ أسماء الله تتفاضل؛"], [2106.0, "فمن أسمائه ما يُطلق عليه بأنه الاسمُ الأعظم،"], [2110.0, "ولا جرمَ أنّ صفة الاسم الأعظم تكون أعظمَ من صفة الاسم الآخر."]], "tr": [[2065.0, "Bunlardan biri, \"Sahîhayn\"da Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde bulunandır."], [2070.2, "Dedi ki: Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2074.8, "\"Allah yaratmayı takdir edip bitirince bir yazı yazdı;"], [2077.9, "o yazı Arş'ın üstünde, O'nun katındadır:"], [2079.9, "Şüphesiz rahmetim gazabımı geçti.\" Bir rivayette de:"], [2083.5, "\"Şüphesiz rahmetim gazabıma galip geldi.\" Bu, rahmet sıfatının üstünlüğüne bir delildir."], [2092.0, "Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşik olan şudur:"], [2095.2, "Allah'ın isimlerinden her isim bir sıfatı içerir."], [2098.9, "Daha önce size Allah'ın isimlerinin birbirinden üstün olduğunu söylemiştim;"], [2106.0, "O'nun isimlerinden bazısı için \"İsm-i A'zam\" (en büyük isim) denir."], [2111.2, "Şüphesiz İsm-i A'zam'ın sıfatı diğer ismin sıfatından daha büyüktür."]]}, {"reader": false, "ar": [[2116.6, "فقولُ ـ الله ـ فقولُ النبيّ صلى الله عليه وسلم في الحديث الذي يصحّ لغيره بمجموع طرقه:"], [2126.0, "«لقد دعا اللهَ» ـ أو قال:"], [2129.0, "«لقد سأل اللهَ» ـ «باسمه الأعظم الذي إذا دُعي به أجاب، وإذا سُئل به أعطى»."], [2138.0, "وفي «الصحيحين» من حديث أبي هريرة رضي الله عنه قال:"], [2142.5, "قال النبيّ صلى الله عليه وسلم:"], [2145.2, "«إنّ لله مئةَ رحمة» ـ فهذا دليلٌ على أفضليّة صفة الرحمة على غيرها ـ «أنزل منها رحمةً واحدةً بين الجنّ والإنس والبهائم والهوامّ، فبها يتعاطفون، وبها يتراحمون، وبها ترفع الوحشُ رِجلَها عن ولدها، وأخّر اللهُ تسعًا وتسعين رحمةً يرحم بها عبادَه يوم القيامة»."]], "tr": [[2116.6, "Allah'ın —Peygamber sallallâhu aleyhi ve sellem'in, bütün yollarıyla birlikte li-gayrihî sahih olan hadisteki şu sözü (buna delildir):"], [2126.0, "\"Andolsun, Allah'a O'nun İsm-i A'zam'ıyla dua etti\" —veya \"Andolsun, Allah'tan O'nun İsm-i A'zam'ıyla istedi\" dedi— \"ki O'na onunla dua edildiğinde icabet eder, onunla istendiğinde verir.\" \"Sahîhayn\"da Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde (de şöyle geçer):"], [2142.5, "Dedi ki: Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2145.2, "\"Allah'ın yüz rahmeti vardır\" —bu, rahmet sıfatının diğerlerinden üstün olduğuna bir delildir— \"Onlardan birini cinler, insanlar, hayvanlar ve haşereler arasına indirdi."], [2155.6, "Onunla birbirlerine şefkat ederler, onunla birbirlerine merhamet ederler, onunla vahşi hayvan ayağını yavrusunun üzerinden kaldırır."], [2166.8, "Allah doksan dokuz rahmeti ise kıyamet günü kullarına onlarla merhamet etmek için ertelemiştir.\""]]}, {"reader": false, "ar": [[2176.0, "وأخرج الإمامُ مسلمٌ من حديث سلمان:"], [2179.0, "«فإذا كان يومُ القيامة أكملها بهذه الرحمة»."], [2184.0, "فهذا من رحمة الله عز وجل."], [2186.0, "فرحمتُه أفضلُ من كثيرٍ من الصفات:"], [2191.0, "فرحمتُه أفضلُ من غضبه بالنسبة لنا،"], [2194.0, "ورحمتُه أفضلُ من كراهيته بالنسبة لنا،"], [2198.0, "ورحمتُه أفضلُ من مقته بالنسبة لنا. أليس كذلك؟"]], "tr": [[2176.0, "İmam Müslim, Selmân'ın hadisinden (şunu) rivayet etmiştir:"], [2179.0, "\"Kıyamet günü olunca onu (yüzü) bu rahmetle tamamlar.\" Bu, Allah Azze ve Celle'nin rahmetindendir."], [2186.0, "O'nun rahmeti birçok sıfattan üstündür:"], [2191.0, "Bizim açımızdan O'nun rahmeti gazabından üstündür;"], [2193.5, "bizim açımızdan O'nun rahmeti kerahetinden (hoşlanmamasından) üstündür;"], [2197.3, "bizim açımızdan O'nun rahmeti buğzundan (maktından) üstündür. Öyle değil mi?"]]}, {"reader": false, "ar": [[2206.0, "وفي «الصحيح» من حديث عمر بن الخطاب رضي الله عنه قال:"], [2211.8, "قَدِم على النبيّ صلى الله عليه وسلم سَبْيٌ،"], [2216.0, "فإذا امرأةٌ من السَّبْي قد تحلّب ثديُها تسعى،"], [2220.0, "إذ وجدت صبيًّا فأخذته فألصقته ببطنها وأرضعته ثديَها،"], [2227.0, "فقال لنا النبيّ صلى الله عليه وسلم:"], [2230.0, "«أترون هذه طارحةً ولدَها في النار؟» قالوا:"], [2233.5, "لا يا رسول الله،"], [2235.7, "وهي تقدر على ألّا تطرحه."], [2239.0, "قال: «للهُ أرحمُ بعباده من هذه بولدها»."], [2244.0, "<span class=\"note\">(Buhârî, Müslim)<\/span> وكلُّها أدلّةٌ تدلّ على أفضليّة صفة الرحمة على غيرها."], [2249.0, "نسأل الله أن يرحمنا وإيّاكم برحمته."]], "tr": [[2206.0, "\"Sahîh\"te Ömer b. el-Hattâb'ın —Allah ondan razı olsun— hadisinde (şöyle geçer):"], [2211.8, "Dedi ki: Peygamber sallallâhu aleyhi ve sellem'e esirler getirildi."], [2217.0, "Esirlerden bir kadının memesinden süt akıyor, koşturuyordu."], [2222.2, "Bir çocuk bulunca onu aldı, karnına bastırdı ve onu emzirdi."], [2230.0, "Peygamber sallallâhu aleyhi ve sellem bize şöyle dedi:"], [2233.5, "\"Bu kadının çocuğunu ateşe atacağını düşünür müsünüz?\" \"Hayır, ey Allah'ın Resûlü;"], [2239.0, "o, atmamaya gücü yettiği hâlde (atmaz)\" dediler."], [2244.0, "Buyurdu ki: \"Allah kullarına, bu kadının çocuğuna olduğundan daha merhametlidir.\" Bunların hepsi rahmet sıfatının diğerlerinden üstün olduğuna delâlet eden delillerdir."], [2249.0, "Allah'tan bize ve size rahmetiyle merhamet etmesini dileriz."]]}, {"reader": false, "ar": [[2253.0, "وقد ثبت في «الصحيح» والسنن والمسانيد من غير وجهٍ أنّ النبيّ صلى الله عليه وسلم قال:"], [2268.9, "«أُعيذكما بكلمات الله التامّة، من كلّ شيطانٍ وهامّة، ومن كلّ عينٍ لامّة»."], [2275.0, "فالاستعاذةُ بكلماته دون غيرها من الصفات في هذا الموطن يدلّ على أفضليّتها في هذا الموطن."]], "tr": [[2253.0, "\"Sahîh\"te, Sünenlerde ve Müsnedlerde birçok yoldan sabit olmuştur ki Peygamber sallallâhu aleyhi ve sellem şöyle demiştir:"], [2268.9, "\"Sizi Allah'ın tam kelimelerine, her şeytandan ve zehirli haşereden ve her kem gözden sığındırırım.\" Bu yerde diğer sıfatlar değil de O'nun kelimelerine sığınılması, bu yerde onların üstün olduğuna delâlet eder."]]}]}, {"ts": "38:05", "title": "5. Külliye (devam): İbn Teymiyye'nin sözü; izzet ve kudretle istiâze; Allah'ın sağ eli", "paras": [{"reader": false, "ar": [[2285.0, "قال ابن تيمية رحمه الله تعالى:"], [2288.0, "«قولُ من قال: صفاتُ الله لا تتفاضل، ونحو ذلك، قولٌ لا دليلَ عليه، بل هو موردُ النزاع. ومن الذي جعل صفتَه التي هي الرحمة لا تفضُل على صفته التي هي الغضب؟» ـ يقول:"], [2308.0, "من جعل ذلك؟ من قال ذلك؟"], [2312.0, "ـ «وقد ثبت عن النبيّ صلى الله عليه وسلم أنه قال: إنّ الله كتب في كتابٍ موضوعٍ عنده فوق العرش: إنّ رحمتي تغلب غضبي، وفي روايةٍ: تسبق غضبي». انتهى كلامه."]], "tr": [[2285.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2288.0, "\"'Allah'ın sıfatları birbirinden üstün olmaz' diyenin sözü ve benzeri, üzerine delil olmayan bir sözdür;"], [2295.8, "bilakis o, ihtilaf konusunun ta kendisidir."], [2302.7, "Rahmet olan sıfatının gazap olan sıfatından üstün olmadığını kim söylemiş?\" —Diyor ki:"], [2308.0, "Bunu kim böyle kıldı? Bunu kim söyledi?— \"Peygamber sallallâhu aleyhi ve sellem'den sabit olmuştur ki şöyle buyurmuştur:"], [2312.0, "'Allah, katında Arş'ın üstünde konulmuş bir yazıda şunu yazdı:"], [2317.8, "Rahmetim gazabıma galip gelir.' Bir rivayette de:"], [2322.6, "'Gazabımı geçer.'\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[2326.0, "وكذلك أيضًا الاستعاذةُ بقدرة الله عز وجل وعزّته بالنسبة للمريض أفضلُ من الاستعاذة بغيرها،"], [2339.0, "كما قال النبيّ صلى الله عليه وسلم في «صحيح» الإمام مسلم من حديث عثمان بن أبي العاص قال:"], [2348.5, "شكوتُ إلى النبيّ صلى الله عليه وسلم وجعًا أجده في جسدي،"], [2354.0, "فقال: «ضع يدك على الذي تألّم من جسدك، وقل: بسم الله، ثلاثَ مرّات، ثم قل سبعَ مرّات: أعوذ بعزّة الله وقدرته من شرّ ما أجد وأُحاذر»."], [2366.0, "فالاستعاذةُ بهاتين الصفتين في هذا الموضع أفضلُ من الاستعاذة بغيرها من الصفات."]], "tr": [[2326.0, "Aynı şekilde hasta için Allah Azze ve Celle'nin kudretine ve izzetine sığınmak, başkasına sığınmaktan üstündür."], [2339.0, "Nitekim Peygamber sallallâhu aleyhi ve sellem, İmam Müslim'in \"Sahîh\"inde Osman b."], [2344.8, "Ebi'l-Âs'ın hadisinde (şöyle) buyurmuştur: (Osman) dedi ki:"], [2348.5, "Peygamber sallallâhu aleyhi ve sellem'e bedenimde hissettiğim bir ağrıdan şikâyet ettim."], [2354.5, "Buyurdu ki: \"Elini bedeninden ağrıyan yerin üzerine koy ve üç kez 'Bismillâh' de;"], [2360.0, "sonra yedi kez 'Hissettiğim ve endişe ettiğim şeyin şerrinden Allah'ın izzetine ve kudretine sığınırım' de.\" Bu yerde bu iki sıfata sığınmak, diğer sıfatlara sığınmaktan üstündür."]]}, {"reader": false, "ar": [[2373.0, "إذًا صفاتُ الله تتفاضل،"], [2375.1, "لكن لا تتفاضل باعتبار المتّصف بها؛"], [2378.3, "فإنّ المتّصف بها هو الله عز وجل،"], [2382.0, "ولكنها تتفاضل باعتبار معانيها،"], [2384.7, "أو باعتباراتٍ أخرى لا ترجع إلى المتّصف بها."], [2392.0, "بل إننا نقول: إنّ يد الله عز وجل اليمين ـ وكلتا يديه يمين ـ أفضلُ من اليد الأخرى."]], "tr": [[2373.0, "Öyleyse Allah'ın sıfatları birbirinden üstündür;"], [2375.1, "fakat onlarla vasıflanan itibarıyla birbirinden üstün değildir;"], [2378.3, "çünkü onlarla vasıflanan Allah Azze ve Celle'dir."], [2382.0, "Ancak manaları itibarıyla veya onlarla vasıflanana dönmeyen başka itibarlarla birbirinden üstündür."], [2392.0, "Hatta şunu söyleriz: Allah Azze ve Celle'nin sağ eli —ki O'nun iki eli de sağdır— diğer elden üstündür."]]}, {"reader": false, "ar": [[2404.0, "ففي «الصحيحين» من حديث أبي هريرة رضي الله عنه قال:"], [2409.4, "قال النبيّ صلى الله عليه وسلم:"], [2412.0, "«يمينُ الله ملأى، لا يَغيضُها نفقةٌ، سحّاءُ» ـ أي مِدرار،"], [2422.0, "أي مِدرار ـ «سحّاءُ الليلَ والنهار، أرأيتم ما أنفق مذ خلق السماواتِ والأرضَ؟ فإنه لم يَغِضْ» ـ أي لم ينقص ـ «ما في يمينه»."], [2437.0, "<span class=\"note\">(Buhârî, Müslim)<\/span> وقال عليه الصلاة والسلام:"], [2440.0, "«المتحابّون في جلال الله عن يمين الرحمن» ـ من باب إكرامهم ـ «وكلتا يديه يمين»."]], "tr": [[2404.0, "\"Sahîhayn\"da Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde (şöyle geçer):"], [2406.8, "Dedi ki: Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2409.4, "\"Allah'ın sağ eli doludur; hiçbir harcama onu eksiltmez."], [2412.0, "Bol bol akıtır\" —yani bereketi bol bol yağdırır, bol bol yağdırır— \"gece gündüz bol bol akıtır."], [2427.7, "Gökleri ve yeri yarattığından beri ne harcadığını görüyor musunuz?"], [2432.4, "Bu, O'nun sağ elindekini eksiltmemiştir\" —yani azaltmamıştır."], [2437.0, "Ve (Peygamber) aleyhissalâtü vesselâm şöyle buyurdu:"], [2440.0, "\"Allah'ın celâli için birbirini sevenler Rahmân'ın sağındadır\" —onlara ikram babından— \"O'nun iki eli de sağdır.\""]]}, {"reader": false, "ar": [[2449.0, "فهذا دليلٌ على أنّ صفة اليد اليمين ـ أو اليد اليمين،"], [2455.3, "وكلتا يدَي ربّي يمينٌ مباركة ـ أفضلُ من اليد الأخرى،"], [2461.0, "والتي سُمّيت في بعض الأدلّة الضعيفة بأنها شمال،"], [2466.5, "بل هي يمينٌ أيضًا."], [2472.0, "وقد أجمع العلماء على أنّ لله يدين اثنتين،"], [2477.4, "فهذا الموضع لا خلاف فيه."], [2481.0, "وأجمع العلماء على أنّ كلتا يديه يمينٌ في الخير والبركة والبذل والإنفاق،"], [2491.0, "فهذا الموضع لا خلاف فيه."], [2495.0, "وأجمع العلماء على أنّ إحدى اليدين مع أنها يمينٌ في الخير فيمينٌ في الاسم أيضًا."], [2504.0, "واختلف العلماء في اسم اليد الأخرى ـ مع الإجماع بأنها يمينٌ في الخير والبذل ـ:"], [2513.0, "أتُسمّى شمالًا أم لا؟"]], "tr": [[2449.0, "Bu, sağ el sıfatının —veya sağ elin;"], [2453.4, "Rabbimin iki eli de mübarek bir sağdır— diğer elden üstün olduğuna bir delildir."], [2463.1, "(Diğer el,) bazı zayıf delillerde \"sol\" diye isimlendirilmiştir;"], [2472.0, "bilakis o da sağdır. Âlimler Allah'ın iki eli olduğunda icmâ etmiştir;"], [2481.0, "bu noktada ihtilaf yoktur. Âlimler O'nun iki elinin de hayırda, berekette, cömertlikte ve infakta sağ olduğunda icmâ etmiştir;"], [2495.0, "bu noktada da ihtilaf yoktur."], [2496.8, "Âlimler iki elden birinin hayırda sağ olmakla birlikte isimde de sağ olduğunda icmâ etmiştir."], [2504.0, "Âlimler, hayırda ve cömertlikte sağ olduğu konusundaki icmâ ile birlikte, diğer elin ismi hakkında ihtilaf etmişlerdir:"], [2513.0, "\"Sol\" diye isimlendirilir mi, isimlendirilmez mi?"]]}, {"reader": false, "ar": [[2516.0, "وهذه المسألة ـ في تسمية اليد الأخرى فقط ـ ليست من مسائل الدين الكبار التي يُوالى ويُعادى عليها،"], [2528.7, "وموضعُ بحثها كالفروع. والأصحُّ عندي أنّ كلَّ حديثٍ يُسمّي هذه اليد بالشمال فهو حديثٌ ضعيف،"], [2540.0, "وإن كان قد روى طرفًا منه الإمامُ مسلمٌ في «صحيحه»،"], [2545.0, "إلا أنه رواه في المتابعات لا في الأصول."], [2550.9, "فإذًا يقال لها: يمين،"], [2553.8, "أو يقال لها: اليد الأخرى،"], [2560.0, "كما أطلقت الأدلّةُ عليها ذلك."]], "tr": [[2516.0, "Bu mesele —yalnızca diğer elin isimlendirilmesi hususunda— üzerine dostluk ve düşmanlık kurulan büyük din meselelerinden değildir;"], [2527.3, "araştırılma yeri fürû (meseleleri) gibidir."], [2531.0, "Bana göre en doğrusu, bu eli \"sol\" diye isimlendiren her hadisin zayıf olmasıdır;"], [2540.0, "İmam Müslim onun bir kısmını \"Sahîh\"inde rivayet etmiş olsa da, onu usûlde (asıl rivayetlerde) değil, mütâbaatlarda rivayet etmiştir."], [2550.9, "Öyleyse ona \"sağ\" denir veya delillerin onun için kullandığı gibi \"diğer el\" denir."]]}]}, {"ts": "42:42", "title": "5. Külliye (sonuç): Kelâmın tafâdulü · 6. Külliye: Sıfatlara dua etmek küfürdür", "paras": [{"reader": false, "ar": [[2562.0, "نعم، وكذلك تفاضُلُ كلامه عز وجل؛"], [2565.0, "فإنّ بعض كلامه أفضلُ من بعضٍ باعتبار المعنى،"], [2569.0, "لا باعتبار المتكلّم به."], [2571.0, "فلا نزال نقول بأنّ آية الكرسيّ أعظمُ آيات القرآن،"], [2577.0, "والقرآنُ كلامُ الله، ولا نزال نقول بأنّ سورة الإخلاص تعدل ثلثَ القرآن،"], [2584.0, "مع أنه كلامُ الله عز وجل."], [2586.0, "والشاهد من ذلك: أنّ دخول التفضيل بين صفات الله عز وجل ليس بمستنكَرٍ من القول."]], "tr": [[2562.0, "Evet, Allah Azze ve Celle'nin kelâmının tafâdulü de böyledir:"], [2565.0, "O'nun kelâmının bir kısmı, onu söyleyen itibarıyla değil, mana itibarıyla diğer kısmından üstündür."], [2571.0, "Âyetü'l-Kürsî'nin Kur'an'ın en büyük ayeti olduğunu söylemeye devam ediyoruz;"], [2575.7, "Kur'an ise Allah'ın kelâmıdır. İhlâs sûresinin Kur'an'ın üçte birine denk olduğunu söylemeye devam ediyoruz;"], [2583.4, "hâlbuki o da Allah Azze ve Celle'nin kelâmıdır."], [2586.0, "Bundan çıkan delil şudur: Allah Azze ve Celle'nin sıfatları arasına tafâdulün girmesi, yadırganacak bir söz değildir."]]}, {"reader": false, "ar": [[2595.0, "طيّب، خذوا رأسَ القاعدة:"], [2598.0, "<b>كلُّ الصفات دعاؤها كفر.<\/b> <b>كلُّ الصفات دعاؤها كفر.<\/b> <span class=\"note\">(Kayıt burada bitiyor.)<\/span>"]], "tr": [[2595.0, "Peki, kaidenin başını alın (yazın):"], [2598.0, "6. külliye: Sıfatların hepsine dua etmek küfürdür. 6."], [2599.5, "külliye: Sıfatların hepsine dua etmek küfürdür. <span class=\"note\">(Kayıt burada bitiyor.)<\/span>"]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
