<script>
const D={"no": 39, "vid": "SQjhWbnSX0E", "title_ar": "الدرس (٣٩) من شرح كليات العقيدة — من كليات توحيد الألوهية: الحكم بغير ما أنزل الله، ودعوى علم الغيب، والذبح، والنذر، والاستغاثة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 39. Ders: Ulûhiyyet Tevhidi Külliyeleri (Allah'ın İndirdiğinden Başkasıyla Hükmetmek, Gayb Bilgisi İddiası, Kurban/Kesim, Allah'tan Başkası İçin Kesilenin Yenmesi, Adak, Masiyet Adağı, İstiğâse)", "sections": [{"ts": "00:00", "title": "1. Külliye: Allah'ın indirdiğinden başkasıyla hükmetmenin büyük küfür olan sûretleri ve hüküm verenin tâğût oluşu", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.2, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.6, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.4, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [11.8, "أمّا بعد: فلا نزال في سياق كلّيّات توحيد الألوهية،"], [16.8, "وعندنا في هذا الدرس جُمَلٌ من الكلّيّات."], [20.8, "الكلّيّة الأولى: <b>كلُّ صورةٍ من صور الحكم بغير ما أنزل الله حكمنا عليها بأنها من الكفر الأكبر فالحاكمُ بها طاغوت.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.2, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [14.6, "Bundan sonra: Hâlâ ulûhiyyet tevhidi külliyelerinin akışı içindeyiz ve bu derste elimizde birtakım külliyeler var."], [23.0, "<b>1. külliye: Allah'ın indirdiğinden başkasıyla hükmetmenin büyük küfürden olduğuna hükmettiğimiz her sûreti, onunla hükmeden tâğûttur.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[57.0, "أقول وبالله التوفيق: لا شكّ أنّ المتقرّر في القواعد أنّ التشريعَ والتحليلَ والتحريمَ من خصائص الله عز وجل،"], [66.0, "فلا حاكمَ شرعًا وكونًا إلا اللهُ تبارك وتعالى،"], [69.3, "كما قال الله عز وجل:"], [71.4, "<span class=\"ayah\">﴿إِنِ الْحُكْمُ إِلَّا لِلَّهِ﴾<\/span> <span class=\"ref\">[يوسف: ٤٠]<\/span>،"], [73.0, "وقال الله عز وجل:"], [74.5, "<span class=\"ayah\">﴿لَهُ الْحُكْمُ وَإِلَيْهِ تُرْجَعُونَ﴾<\/span> <span class=\"ref\">[القصص: ٨٨]<\/span>."], [76.0, "فجميعُ الأحكام الشرعية لا بدّ أن تكون صادرةً من الله عز وجل،"], [83.0, "فلا يجوز للإنسان أن يحكم بحكمٍ مخالفٍ لحكم الله ورسوله صلى الله عليه وسلم."], [89.0, "فالحلالُ ما أحلّه الله ورسوله،"], [92.0, "والحرامُ ما حرّمه الله ورسوله،"], [95.0, "والدينُ ما شرعه الله ورسوله صلى الله عليه وسلم."]], "tr": [[57.0, "Tevfik Allah'tandır, derim ki: Şüphesiz kaidelerde yerleşmiş olan husus şudur:"], [61.0, "Teşrî (kanun koymak), helâl ve haram kılmak Allah Azze ve Celle'nin hususiyetlerindendir."], [66.4, "Şer'an ve kevnen Allah Tebâreke ve Teâlâ'dan başka hâkim yoktur."], [69.7, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [72.2, "<span class=\"ayah\">﴿Hüküm ancak Allah'ındır﴾<\/span> [Yûsuf 40]."], [74.1, "Allah Azze ve Celle şöyle de buyurmuştur:"], [76.6, "<span class=\"ayah\">﴿Hüküm O'nundur ve O'na döndürüleceksiniz﴾<\/span> [Kasas 88]."], [80.1, "Dolayısıyla bütün şer'î hükümlerin Allah Azze ve Celle'den sâdır olması zorunludur."], [85.1, "İnsanın, Allah'ın ve Resûlü'nün ﷺ hükmüne aykırı bir hükümle hükmetmesi caiz değildir."], [89.6, "Helâl, Allah'ın ve Resûlü'nün helâl kıldığıdır;"], [92.6, "haram, Allah'ın ve Resûlü'nün haram kıldığıdır;"], [95.7, "din de Allah'ın ve Resûlü'nün ﷺ şeriat kıldığıdır."]]}, {"reader": false, "ar": [[98.0, "فمن شرع من دون الله عز وجل،"], [103.0, "أو ألزم الناسَ بغير شرع الله عز وجل،"], [106.0, "فقد نازع اللهَ عز وجل في شيءٍ من خصائص ألوهيته."], [111.0, "فحينئذٍ لا يجوز للإنسان أن يعتدي على شيءٍ من أحكام الله ويعطّلها أو يعارضها بشيءٍ من القوانين الأرضية."], [120.0, "إلا أنّ أهل السنة والجماعة يقولون بأنّ الحكم بغير ما أنزل الله له صورٌ متعدّدة:"], [128.0, "فمن صور الحكم بغير ما أنزل الله ما يكون كفرًا أكبرَ وردّةً،"], [133.0, "ومن صور الحكم بغير ما أنزل الله ما يكون كبيرةً من الكبائر فقط."], [138.0, "وهذه الكلّيّة مقيّدةٌ بتلك الصور التي يكون الحكمُ فيها بغير ما أنزل الله كفرًا وردّةً،"], [147.0, "فالحاكمُ بها يُسمّى طاغوتًا."]], "tr": [[98.0, "Kim Allah Azze ve Celle'yi bırakıp şeriat koyarsa ya da insanları Allah Azze ve Celle'nin şeriatından başkasına mecbur tutarsa, Allah Azze ve Celle ile O'nun ulûhiyyetinin hususiyetlerinden bir şeyde çekişmiş olur."], [112.8, "Bu durumda insanın Allah'ın hükümlerinden herhangi birine saldırması, onu ta'til etmesi ya da yeryüzü kanunlarından bir şeyle ona muâraza etmesi caiz değildir."], [124.5, "Ancak Ehl-i Sünnet ve'l-Cemaat, Allah'ın indirdiğinden başkasıyla hükmetmenin birden çok sûreti olduğunu söyler:"], [130.5, "Allah'ın indirdiğinden başkasıyla hükmetmenin sûretlerinden bir kısmı büyük küfür ve irtidattır;"], [134.5, "bir kısmı ise sadece büyük günahlardan bir büyük günahtır."], [138.0, "Bu külliye, Allah'ın indirdiğinden başkasıyla hükmetmenin küfür ve irtidat olduğu o sûretlerle kayıtlıdır;"], [145.8, "o sûretlerle hükmeden kişiye tâğût denir."]]}, {"reader": false, "ar": [[151.0, "وقد فصّل العلماءُ ذلك في الأحوال التالية:"], [155.0, "الحالةُ الأولى: واضعُ القانون أصالةً."], [158.0, "فواضعُ القانون الذي يريد بوضعه معارضةَ شريعة الله عز وجل،"], [164.0, "هذا كافرٌ بالإجماع، ولم يخالف في هذه الصورة أحدٌ من أهل السنة والجماعة."], [170.0, "فالذي يضع تلك القوانين،"], [172.9, "ويأمر الحكّامَ بالحكم بها،"], [178.0, "ويُلزم القضاةَ بالحكم بها،"], [181.0, "فإنه يُعتبر كافرًا بمجرّد وضعه لهذا القانون."]], "tr": [[151.0, "Âlimler bunu şu hâller üzerinden tafsilatlı olarak açıklamışlardır:"], [155.0, "Birinci hâl: Kanunu asıl olarak koyan kişi."], [158.6, "Koymakla Allah Azze ve Celle'nin şeriatına muâraza etmeyi kasteden kanun koyucu, icmâ ile kâfirdir;"], [166.8, "Ehl-i Sünnet ve'l-Cemaat'ten hiç kimse bu sûrette muhalefet etmemiştir."], [170.0, "O kanunları koyan, yöneticilere onlarla hükmetmeyi emreden ve hâkimleri onlarla hükmetmeye mecbur tutan kişi, sırf bu kanunu koymasıyla kâfir sayılır."]]}, {"reader": false, "ar": [[185.0, "الحالةُ الثانية: الذي يحكم بهذا القانون الحكمَ المطلق في كلّ مصادره وموارده،"], [194.0, "ولا يحكم بشيءٍ ممّا أنزل الله عز وجل أبدًا،"], [202.0, "وإنما كافّةُ وعامّةُ أحكامه إنما تكون بهذا القانون،"], [206.0, "في كلّ أبواب التقاضي والتحاكم،"], [209.0, "إنما يحكم بين أفراد رعيّته بهذا القانون."], [214.0, "فحقيقتُه أنه مستبدلٌ شريعةَ الله بهذا القانون،"], [218.0, "فهو ناسفٌ لشريعة الله جملةً وتفصيلًا،"], [221.6, "وأحلّ محلَّها هذا القانون."], [224.0, "وهذا كافرٌ بالإجماع من غير خلافٍ بين أهل السنة والجماعة."]], "tr": [[185.0, "İkinci hâl: Bu kanunla, onun bütün kaynaklarında ve uygulama alanlarında mutlak olarak hükmeden ve Allah Azze ve Celle'nin indirdiği şeylerden hiçbiriyle asla hükmetmeyen kişi."], [199.7, "Onun bütün ve genel hükümleri yalnızca bu kanunla olur;"], [205.0, "yargılamanın ve muhakemenin bütün bablarında tebaasının fertleri arasında ancak bu kanunla hükmeder."], [211.1, "Bunun hakikati şudur: O, Allah'ın şeriatını bu kanunla değiştirmiştir."], [216.3, "O, Allah'ın şeriatını toptan ve ayrıntılarıyla yerle bir etmiş ve onun yerine bu kanunu koymuştur."], [223.4, "Bu kişi de Ehl-i Sünnet ve'l-Cemaat arasında ihtilaf olmaksızın icmâ ile kâfirdir."]]}, {"reader": false, "ar": [[232.0, "الحالةُ الثانية <span class=\"note\">(كذا قال، والمراد: الثالثة)<\/span>: إن اعتقد أنّ الحكم بما أنزل الله ليس عدلًا،"], [240.0, "وأنّ الحكم بما أنزل الله لا يصلح لهذا الزمان أصالةً،"], [247.0, "فاستبدله بقوانين وضعية، فهذه الصورة أيضًا تُعتبر من الصور الكفرية."], [255.0, "ومنها أيضًا: إن اعتقد أنّ الحكم بما أنزل الله ليس بلازم،"], [263.0, "وأنه يجوز له أن يترك الحكم بما أنزل الله وأن يحكم بغير ما أنزل الله؛"], [271.0, "فبمجرّد اعتقاده عدمَ لزوم الحكم بما أنزل الله،"], [276.0, "وبمجرّد اعتقاده جوازَ الحكم بغير ما أنزل الله،"], [281.0, "يُعتبر كافرًا الكفرَ الأكبر."]], "tr": [[232.0, "İkinci hâl <span class=\"note\">(Şeyh böyle diyor; kastı üçüncü hâl)<\/span>:"], [237.3, "Allah'ın indirdiğiyle hükmetmenin adalet olmadığına ve Allah'ın indirdiğiyle hükmetmenin aslen bu zamana uygun olmadığına inanıp onu beşerî kanunlarla değiştirirse, bu sûret de küfür sûretlerinden sayılır."], [257.1, "Bunlardan biri de şudur: Allah'ın indirdiğiyle hükmetmenin gerekli olmadığına, Allah'ın indirdiğiyle hükmetmeyi bırakıp Allah'ın indirdiğinden başkasıyla hükmetmesinin kendisine caiz olduğuna inanırsa;"], [270.7, "sırf Allah'ın indirdiğiyle hükmetmenin gerekli olmadığına inanmasıyla ve sırf Allah'ın indirdiğinden başkasıyla hükmetmenin caiz olduğuna inanmasıyla büyük küfürle kâfir sayılır."]]}, {"reader": false, "ar": [[285.0, "ومن الأحوال أيضًا: إن حكم بهذه القوانين معتقدًا أنّ الحكم بها أفضلُ من الحكم بما أنزل الله،"], [297.0, "وأنّ الحكم بما أنزل الله ليس مساويًا لها،"], [302.0, "بل الحكمُ بها أفضلُ من الحكم بما أنزل الله،"], [307.5, "فلا جَرَمَ أنّ هذا من صور الكفر الأكبر أيضًا."], [313.0, "ومنها أيضًا: إن اعتقد أنه مخيَّرٌ بين أن يحكم بما أنزل الله وأن يحكم بغير ما أنزل الله،"], [325.0, "فبمجرّد اعتقاده التخييرَ يُعتبر كافرًا."]], "tr": [[285.0, "Hâllerden biri de şudur: Bu kanunlarla, onlarla hükmetmenin Allah'ın indirdiğiyle hükmetmekten daha üstün olduğuna, Allah'ın indirdiğiyle hükmetmenin onlara denk olmadığına, aksine onlarla hükmetmenin Allah'ın indirdiğiyle hükmetmekten daha üstün olduğuna inanarak hükmederse;"], [308.1, "hiç şüphesiz bu da büyük küfür sûretlerindendir."], [313.0, "Bunlardan biri de şudur: Allah'ın indirdiğiyle hükmetmekle Allah'ın indirdiğinden başkasıyla hükmetmek arasında muhayyer olduğuna inanırsa, sırf muhayyerliğe inanmasıyla kâfir sayılır."]]}]}, {"ts": "05:31", "title": "1. Külliye (devam): «Küfrün dûnunda küfür» olan sûret; hükmün zâtî küfür olmayışı", "paras": [{"reader": false, "ar": [[331.0, "ومنها أيضًا: إذا اعتقد أنّ الحكم بما أنزل الله من الواجبات،"], [344.0, "وأنه لا يحلّ له أن يحكم في أيّ قضيّةٍ إلا بما أنزل الله،"], [352.0, "ولكنه عدل عن ذلك مع علمه بمعصيته،"], [358.0, "في حكمٍ أو حكمين أو ثلاثةٍ،"], [361.6, "أو أقلَّ أو أكثر،"], [364.0, "عالمًا بمعصيته، وإنما يحمله على ذلك رغبةٌ يريد تحصيلَها أو رهبةٌ يريد الفرارَ منها،"], [376.0, "مع كمال اعتقاد قلبه بحرمة ما فعل،"], [379.3, "وأنّ الحكم بما أنزل الله من الواجبات عليه؛"], [383.0, "فهذه الصورة هي التي قال فيها أهلُ السنة بأنها كفرٌ دون كفر،"], [391.0, "يعني أنها من جملة الكفر الأصغر الذي لا يوجب خروجَ صاحبه من الملّة."]], "tr": [[331.0, "Bunlardan biri de şudur: Allah'ın indirdiğiyle hükmetmenin vaciplerden olduğuna ve herhangi bir davada Allah'ın indirdiğinden başkasıyla hükmetmenin kendisine helâl olmadığına inanır;"], [350.2, "ama bir, iki ya da üç hükümde, daha az ya da daha çok, bunun masiyet olduğunu bilerek ondan sapar."], [363.4, "Masiyet olduğunu bilmektedir; onu buna sevk eden şey, elde etmek istediği bir arzu ya da kaçmak istediği bir korkudur."], [377.9, "Bununla birlikte kalbi, yaptığının haram olduğuna ve Allah'ın indirdiğiyle hükmetmenin kendisine vacip olduğuna tam olarak inanmaktadır."], [386.3, "İşte Ehl-i Sünnet'in hakkında «küfrün dûnunda bir küfür» dediği sûret budur;"], [393.5, "yani sahibinin dinden çıkmasını gerektirmeyen küçük küfür cümlesindendir."]]}, {"reader": false, "ar": [[399.0, "وأصلُ ذلك أنّ الحكم بغير ما أنزل الله ليس من الكفر الذاتي،"], [409.0, "كالسجود لغير الله أو الاستغاثة بغير الله،"], [416.0, "وإنما هو معصيةٌ من جملة المعاصي."], [420.0, "والمتقرّر بإجماع أهل السنة أنّ فعلَ المعصية لا يوجب كفرَ الفاعل إلا إذا صاحبه اعتقادُ الحِلّ؛"], [433.0, "فإذا زنى الزاني غيرَ معتقدٍ حِلَّ الزنا فهو كبيرة،"], [440.0, "لكن إن اعتقد حِلَّ الزنا فإنه كافرٌ وإن لم يزنِ."], [446.0, "فلا نتصوّر أنّ الحكم بغير ما أنزل الله من صور الكفر الذاتي،"], [453.0, "وإنما هو من جملة المعاصي التي لا يخرج صاحبُها من الملّة إلا إذا صاحبه اعتقاد."]], "tr": [[399.0, "Bunun aslı şudur: Allah'ın indirdiğinden başkasıyla hükmetmek, Allah'tan başkasına secde etmek veya Allah'tan başkasından istiğâse etmek gibi zâtî küfürden değildir;"], [416.0, "o ancak masiyetler cümlesinden bir masiyettir."], [420.0, "Ehl-i Sünnet'in icmâıyla yerleşmiş olan husus şudur:"], [424.9, "Masiyeti işlemek, ancak ona helâl olduğu inancı eşlik ederse failin küfrünü gerektirir."], [434.4, "Zina eden kişi zinanın helâl olduğuna inanmadan zina ederse bu bir büyük günahtır;"], [443.6, "ama zinanın helâl olduğuna inanırsa, zina etmese bile kâfirdir."], [448.9, "Dolayısıyla Allah'ın indirdiğinden başkasıyla hükmetmenin zâtî küfür sûretlerinden olduğunu düşünmeyiz;"], [455.0, "o ancak, kendisine bir inanç eşlik etmedikçe sahibini dinden çıkarmayan masiyetler cümlesindendir."]]}, {"reader": false, "ar": [[463.0, "ولذلك تجدون أنّ الصور التي حكمنا على الحاكم بغير ما أنزل الله فيها بأنه كافرٌ دائمًا تكون مصحوبةً أو مقترنةً بشيءٍ من الاعتقاد:"], [474.0, "إن حكم معتقدًا مساواةً،"], [476.7, "إن حكم معتقدًا التخييرَ،"], [479.5, "إن حكم معتقدًا الأفضلية."], [483.0, "فتقييدُنا للتكفير في هذه الصور بالاعتقاد دليلٌ على أنّ الأصل في الحكم بغير ما أنزل الله أنه مجرّدُ معصية."], [499.0, "ولذلك في الصورة الأخيرة،"], [501.0, "لمّا جزمنا بأنه مُقِرٌّ بوجوب الحكم بما أنزل الله،"], [509.0, "وإنما جعله لا يحكم في هذه القضايا رغبةٌ يريد تحصيلَها أو رهبةٌ يريد الفرارَ منها،"], [517.4, "مع كمال علمه واعتقاده بأنه مخطئ،"], [522.0, "هذه الصورة لمّا لم يصحبها اعتقادٌ قلنا بأنها كبيرةٌ من الكبائر،"], [527.8, "لكن لا توصل صاحبَها إلى الكفر."]], "tr": [[463.0, "Bu yüzden görürsünüz ki, Allah'ın indirdiğinden başkasıyla hükmeden kişinin kâfir olduğuna hükmettiğimiz sûretler, daima bir inançla beraber ya da ona bitişik olur:"], [472.8, "Denk olduğuna inanarak hükmederse, muhayyerliğe inanarak hükmederse, üstünlüğe inanarak hükmederse."], [478.8, "Bu sûretlerde tekfiri inançla kayıtlamamız, Allah'ın indirdiğinden başkasıyla hükmetmede aslın onun sadece bir masiyet olması olduğuna delildir."], [494.7, "Bu yüzden son sûrette, onun Allah'ın indirdiğiyle hükmetmenin vacip olduğunu ikrar ettiğini kesin olarak belirttiğimizde —onu bu davalarda hükmetmemeye iten şey ancak elde etmek istediği bir arzu ya da kaçmak istediği bir korkudur ve hatalı olduğunu tam olarak bilmekte ve inanmaktadır— bu sûrete bir inanç eşlik etmediği için onun büyük günahlardan bir büyük günah olduğunu, ama sahibini küfre ulaştırmadığını söyledik."]]}, {"reader": false, "ar": [[531.0, "فإذا أردتم أن تناقشوا في هذه القضية فلا بدّ أن تقرّروا في قلب من يناقشكم أولًا أنّ الحكم بغير ما أنزل الله ليس من الكفر الذاتي في كلّ صوره،"], [546.0, "وإنما هو معصيةٌ من المعاصي وكبيرةٌ من الكبائر،"], [551.0, "ولا يخرج صاحبُ هذه المعصية من الإيمان إلى دائرة الكفر إلا إذا صاحب معصيتَه اعتقادُ الحِلّ،"], [565.0, "اعتقادُ الحِلّ. وذلك لأننا نرى كثيرًا ممّن يناقش في هذه الجزئية يظنّ أنّ الحكم بغير ما أنزل الله من الكفر الذاتي، وهذا خطأ."]], "tr": [[531.0, "Bu meseleyi tartışmak istediğinizde, önce sizinle tartışan kişinin kalbinde şunu yerleştirmeniz gerekir:"], [537.1, "Allah'ın indirdiğinden başkasıyla hükmetmek bütün sûretlerinde zâtî küfürden değildir;"], [542.9, "o masiyetlerden bir masiyet ve büyük günahlardan bir büyük günahtır."], [550.4, "Bu masiyetin sahibi, masiyetine helâl olduğu inancı eşlik etmedikçe —helâl olduğu inancı— imandan küfür dairesine çıkmaz."], [567.0, "Çünkü bu cüz'î meseleyi tartışanlardan birçoğunun Allah'ın indirdiğinden başkasıyla hükmetmeyi zâtî küfürden zannettiğini görüyoruz; bu ise hatadır."]]}, {"reader": false, "ar": [[581.0, "وقد دلّت الأدلّةُ على أنّ الحكم من خصائص الله عز وجل،"], [586.0, "والمتقرّر في القواعد أنّ الأحكام الشرعية تفتقر في ثبوتها للأدلّة الصحيحة الصريحة."], [593.0, "فمن ذلك قولُ الله عز وجل:"], [597.0, "<span class=\"ayah\">﴿أَفَحُكْمَ الْجَاهِلِيَّةِ يَبْغُونَ ۚ وَمَنْ أَحْسَنُ مِنَ اللَّهِ حُكْمًا لِّقَوْمٍ يُوقِنُونَ﴾<\/span> <span class=\"ref\">[المائدة: ٥٠]<\/span>."], [603.0, "ويقول الله عز وجل في ثلاث آيات:"], [605.8, "<span class=\"ayah\">﴿وَمَن لَّمْ يَحْكُم بِمَا أَنزَلَ اللَّهُ فَأُولَٰئِكَ هُمُ الْكَافِرُونَ﴾<\/span> <span class=\"ref\">[المائدة: ٤٤]<\/span>،"], [611.0, "وفي الآية الثانية: <span class=\"ayah\">﴿فَأُولَٰئِكَ هُمُ الظَّالِمُونَ﴾<\/span> <span class=\"ref\">[المائدة: ٤٥]<\/span>،"], [615.0, "وفي الآية الثالثة: <span class=\"ayah\">﴿فَأُولَٰئِكَ هُمُ الْفَاسِقُونَ﴾<\/span> <span class=\"ref\">[المائدة: ٤٧]<\/span>."]], "tr": [[581.0, "Deliller, hükmün Allah Azze ve Celle'nin hususiyetlerinden olduğuna delâlet etmiştir."], [584.2, "Kaidelerde yerleşmiş olan husus da şudur:"], [586.0, "Şer'î hükümler sabit olmak için sahih ve açık delillere muhtaçtır."], [590.1, "Bunlardan biri Allah Azze ve Celle'nin şu sözüdür:"], [593.7, "<span class=\"ayah\">﴿Yoksa onlar cahiliye hükmünü mü arıyorlar? Kesin olarak inanan bir topluluk için hüküm bakımından Allah'tan daha güzel kim vardır?﴾<\/span> [Mâide 50]."], [603.4, "Allah Azze ve Celle üç ayette şöyle buyurur:"], [605.4, "<span class=\"ayah\">﴿Kim Allah'ın indirdiğiyle hükmetmezse, işte onlar kâfirlerin ta kendileridir﴾<\/span> [Mâide 44];"], [609.7, "ikinci ayette: <span class=\"ayah\">﴿işte onlar zalimlerin ta kendileridir﴾<\/span> [Mâide 45];"], [614.3, "üçüncü ayette: <span class=\"ayah\">﴿işte onlar fasıkların ta kendileridir﴾<\/span> [Mâide 47]."]]}, {"reader": false, "ar": [[619.0, "ويقول الله عز وجل:"], [620.7, "<span class=\"ayah\">﴿أَلَمْ تَرَ إِلَى الَّذِينَ يَزْعُمُونَ أَنَّهُمْ آمَنُوا بِمَا أُنزِلَ إِلَيْكَ وَمَا أُنزِلَ مِن قَبْلِكَ يُرِيدُونَ أَن يَتَحَاكَمُوا إِلَى الطَّاغُوتِ وَقَدْ أُمِرُوا أَن يَكْفُرُوا بِهِ﴾<\/span> <span class=\"ref\">[النساء: ٦٠]<\/span>."], [632.0, "ويقول الله عز وجل:"], [634.0, "<span class=\"ayah\">﴿أَمْ لَهُمْ شُرَكَاءُ شَرَعُوا لَهُم مِّنَ الدِّينِ مَا لَمْ يَأْذَن بِهِ اللَّهُ﴾<\/span> <span class=\"ref\">[الشورى: ٢١]<\/span>."], [640.0, "والأدلّةُ في ذلك كثيرة."], [642.0, "ومنها أيضًا قولُ الله عز وجل:"], [645.0, "<span class=\"ayah\">﴿إِنَّا أَنزَلْنَا إِلَيْكَ الْكِتَابَ بِالْحَقِّ﴾<\/span> «مُصدِّقًا لما بين…» <span class=\"note\">(Şeyh burada Mâide 48'in lafzına kayıyor ve ayeti yeniden okuyor)<\/span>،"], [649.9, "وقال الله عز وجل:"], [650.3, "<span class=\"ayah\">﴿بِالْحَقِّ لِتَحْكُمَ بَيْنَ النَّاسِ بِمَا أَرَاكَ اللَّهُ ۚ وَلَا تَكُن لِّلْخَائِنِينَ خَصِيمًا﴾<\/span> <span class=\"ref\">[النساء: ١٠٥]<\/span>."], [657.0, "وقال الله عز وجل:"], [658.9, "<span class=\"ayah\">﴿وَأَنِ احْكُم بَيْنَهُم بِمَا أَنزَلَ اللَّهُ﴾<\/span> <span class=\"ref\">[المائدة: ٤٩]<\/span>."]], "tr": [[619.0, "Allah Azze ve Celle şöyle buyurur:"], [620.7, "<span class=\"ayah\">﴿Sana indirilene ve senden önce indirilene iman ettiklerini iddia edenleri görmedin mi? Onu inkâr etmekle emrolundukları hâlde tâğûtun önünde muhakeme olmak istiyorlar﴾<\/span> [Nisâ 60]."], [628.5, "Allah Azze ve Celle şöyle buyurur:"], [631.0, "<span class=\"ayah\">﴿Yoksa onların, Allah'ın izin vermediği şeyleri dinden onlara şeriat kılan ortakları mı var?﴾<\/span> [Şûrâ 21]."], [636.5, "Bu konudaki deliller çoktur. Bunlardan biri de Allah Azze ve Celle'nin şu sözüdür:"], [641.0, "<span class=\"ayah\">﴿Şüphesiz Biz sana Kitab'ı hak ile indirdik﴾<\/span> «…arasındakini tasdik edici olarak…» <span class=\"note\">(Şeyh burada Mâide 48'in lafzına kayıyor ve ayeti yeniden okuyor)<\/span>."], [649.9, "Allah Azze ve Celle şöyle buyurmuştur:"], [650.3, "<span class=\"ayah\">﴿…hak ile; insanlar arasında Allah'ın sana gösterdiği şekilde hükmedesin diye. Hainlerin savunucusu olma﴾<\/span> [Nisâ 105]."], [657.0, "Allah Azze ve Celle şöyle de buyurmuştur:"], [659.4, "<span class=\"ayah\">﴿Aralarında Allah'ın indirdiğiyle hükmet﴾<\/span> [Mâide 49]."]]}]}, {"ts": "11:04", "title": "1. Külliye (devam): İbnü'l-Kayyim, İbn Ebi'l-İzz, İbn Hazm, İbn Teymiyye ve İbn Kesîr'den nakiller", "paras": [{"reader": false, "ar": [[664.0, "قال الإمامُ ابن القيّم رحمه الله تعالى:"], [667.0, "«إنّ الحكم بغير ما أنزل الله يتناول الكفرين: الأصغرَ والأكبر، بحسب حال الحاكم؛ فإنه إن اعتقد ـ شفت كيف؟ ـ فإنه إن اعتقد وجوبَ الحكم بما أنزل الله في هذه الواقعة، وعدل عنه عصيانًا، مع اعترافه بأنه مستحقٌّ للعقوبة، فهذا كفرٌ أصغر. وإن اعتقد أنه غيرُ واجب، وأنه مخيَّرٌ فيه، مع تيقّنه أنه حكمُ الله، فهذا كفرٌ أكبر. وإن جهله وأخطأه فهذا مخطئٌ له حكمُ المخطئين». انتهى كلامه."]], "tr": [[664.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [666.6, "«Allah'ın indirdiğinden başkasıyla hükmetmek, hükmedenin hâline göre iki küfrü, küçüğü ve büyüğü de kapsar. Şöyle ki, eğer o —gördün mü nasıl?— eğer o bu olayda Allah'ın indirdiğiyle hükmetmenin vacip olduğuna inanır, cezayı hak ettiğini itiraf etmekle birlikte isyan ederek ondan saparsa, bu küçük küfürdür. Eğer onun Allah'ın hükmü olduğunu kesin olarak bilmekle birlikte vacip olmadığına ve bunda muhayyer olduğuna inanırsa, bu büyük küfürdür. Eğer onu bilmez ve isabet edemezse, bu kişi hata edendir; hata edenlerin hükmüne tâbidir.» Sözü burada bitti."]]}, {"reader": false, "ar": [[714.0, "وقال ابنُ أبي العزّ الحنفيُّ رحمه الله في «شرح الطحاوية» نقلًا طويلًا،"], [718.3, "لكنه جميل، قال: «ها هنا أمرٌ يجب أن يُتفطَّن له، وهو أنّ الحكم بغير ما أنزل الله قد يكون كفرًا ينقل عن الملّة، وقد يكون معصيةً كبيرةً أو صغيرة، ويكون كفرًا إمّا مجازيًّا وإمّا كفرًا أصغر، على القولين المذكورين، وذلك بحسب حال الحاكم. فإنه إن اعتقد أنّ الحكم بما أنزل الله غيرُ واجب ـ هذه الأولى ـ وأنه مخيَّرٌ فيه، أو استهان به مع تيقّنه أنه حكمُ الله، فهذا كفرٌ أكبر."]], "tr": [[714.0, "İbn Ebi'l-İzz el-Hanefî —Allah ona rahmet etsin— «Şerhu't-Tahâviyye»de uzun ama güzel bir nakil yapar."], [718.3, "Şöyle der: «Burada dikkat edilmesi gereken bir husus vardır: Allah'ın indirdiğinden başkasıyla hükmetmek, bazen dinden çıkaran bir küfür olur; bazen büyük ya da küçük bir masiyet olur. Zikredilen iki görüşe göre bu ya mecazî bir küfür ya da küçük küfür olur. Bu da hükmedenin hâline göredir. Eğer Allah'ın indirdiğiyle hükmetmenin vacip olmadığına —bu birincisi— ve bunda muhayyer olduğuna inanırsa ya da onun Allah'ın hükmü olduğunu kesin olarak bilmekle birlikte onu hafife alırsa, bu büyük küfürdür."]]}, {"reader": false, "ar": [[755.0, "وإن اعتقد وجوبَ الحكم بما أنزل الله،"], [758.8, "وعلمه في هذه الواقعة،"], [761.0, "وعدل عنه مع اعترافه بأنه مستحقٌّ للعقوبة،"], [766.0, "فهذا عاصٍ، ويُسمّى كافرًا كفرًا مجازيًّا،"], [769.3, "أو كفرًا أصغر. وإن جهل حكمَ الله فيها،"], [773.5, "مع بذل جهده واستفراغ وسعه في معرفة الحكم،"], [777.5, "وأخطأه، فهذا مخطئٌ، له أجرٌ على اجتهاده،"], [781.0, "وخطؤه مغفور». انتهى كلامه."]], "tr": [[755.0, "Eğer Allah'ın indirdiğiyle hükmetmenin vacip olduğuna inanır, bu olaydaki hükmü de bilir, ama cezayı hak ettiğini itiraf etmekle birlikte ondan saparsa, bu kişi âsîdir;"], [766.0, "mecazî küfürle ya da küçük küfürle kâfir diye isimlendirilir."], [769.9, "Eğer bu olaydaki Allah'ın hükmünü bilmez, hükmü öğrenmek için gayretini sarf edip bütün gücünü tüketmekle birlikte ona isabet edemezse, bu kişi hata edendir;"], [778.5, "içtihadından dolayı ona ecir vardır, hatası da bağışlanmıştır.» Sözü burada bitti."]]}, {"reader": false, "ar": [[783.0, "وقال الإمامُ ابن حزمٍ رحمه الله تعالى:"], [786.8, "«لا خلافَ بين اثنين من المسلمين أنّ من حكم بحكم الإنجيل ممّا لم يأتِ بالنصّ عليه وحيٌ في شريعة الإسلام فإنه كافرٌ مشركٌ خارجٌ عن الإسلام»."], [801.0, "وقال الإمامُ ابن تيمية رحمه الله:"], [804.9, "«نُسخ هذه التوراة مبدَّلة، لا يجوز العملُ بما فيها، ومن عمل اليوم بشرائعها المبدَّلة والمنسوخة فهو كافر»."]], "tr": [[783.0, "İmam İbn Hazm —Allah ona rahmet etsin— şöyle demiştir:"], [786.8, "«Müslümanlardan iki kişi arasında şu konuda ihtilaf yoktur: Kim İncil'in hükmüyle, İslâm şeriatında üzerine nas olarak vahiy gelmemiş bir şeyde hükmederse, o kâfir, müşrik ve İslâm'ın dışındadır.» İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [804.2, "«Bu Tevrat nüshaları tahrif edilmiştir; içindekiyle amel etmek caiz değildir. Bugün onun tahrif edilmiş ve neshedilmiş şeriatlarıyla amel eden kâfirdir.»"]]}, {"reader": false, "ar": [[817.0, "قال الإمامُ ابن القيّم رحمه الله تعالى:"], [821.0, "«قالوا ـ أي العلماء ـ: وقد جاء القرآنُ وصحّ الإجماعُ بأنّ دين الإسلام نسخ كلَّ دينٍ كان قبله، وأنّ من التزم ما جاءت به التوراةُ والإنجيل ولم يتّبع القرآنَ فإنه كافر، وقد أبطل اللهُ كلَّ شريعةٍ كانت في التوراة والإنجيل وسائر الملل، وافترض على الجنّ والإنس شرائعَ الإسلام، فلا حرامَ إلا ما حرّمه الإسلام، ولا فرضَ إلا ما أوجبه الإسلام»."]], "tr": [[817.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [821.5, "«Dediler ki —yani âlimler—: Kur'an gelmiş ve icmâ sahih olarak sabit olmuştur ki, İslâm dini kendisinden önceki her dini neshetmiştir. Tevrat ve İncil'in getirdiğine bağlanıp Kur'an'a uymayan kâfirdir. Allah, Tevrat'ta, İncil'de ve diğer dinlerde bulunan her şeriatı iptal etmiş, cinlere ve insanlara İslâm'ın şeriatlarını farz kılmıştır. İslâm'ın haram kıldığından başka haram, İslâm'ın vacip kıldığından başka farz yoktur.»"]]}, {"reader": false, "ar": [[849.0, "وقال الإمامُ ابن كثيرٍ رحمه الله تعالى:"], [852.0, "«من ترك الشرعَ المحكَم المنزَّلَ على محمدٍ خاتمِ الأنبياء عليه الصلاة والسلام، وتحاكم إلى غيره من الشرائع المنسوخة، كفر؛ فكيف بمن تحاكم إلى الياسق ـ وهو كتابٌ يحكم به بعضُ الطوائف الكافرة ـ؟! فكيف بمن تحاكم إلى الياسق وقدّمها عليه؟! من فعل ذلك كفر بإجماع المسلمين»."]], "tr": [[849.0, "İmam İbn Kesîr —Allah ona rahmet etsin— şöyle demiştir:"], [852.6, "«Kim peygamberlerin sonuncusu Muhammed aleyhissalâtu vesselâm'a indirilmiş muhkem şeriatı bırakır da neshedilmiş başka şeriatların önünde muhakeme olursa kâfir olur. Ya Yâsık'ın —ki o, bazı kâfir taifelerin onunla hükmettiği bir kitaptır— önünde muhakeme olan ve onu ona (şeriata) takdim edene ne demeli?! Kim bunu yaparsa Müslümanların icmâıyla kâfir olur.»"]]}, {"reader": false, "ar": [[881.0, "وقال الإمامُ ابن تيمية رحمه الله تعالى:"], [885.0, "«الحكمُ بالعدل واجبٌ مطلقًا، في كلّ زمانٍ ومكان، على كلّ أحدٍ ولكلّ أحد، والحكمُ بما أنزل الله على محمدٍ صلى الله عليه وسلم هو عدلٌ خاصّ، وهو أكملُ أنواع العدل وأحسنُها، والحكمُ به واجبٌ على النبيّ صلى الله عليه وسلم وكلِّ من اتّبعه، ومن لم يلتزم حكمَ الله ورسوله فهو كافر»."], [914.0, "انتهى كلامه رحمه الله، والله أعلم."]], "tr": [[881.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [885.9, "«Adaletle hükmetmek her zaman ve mekânda, herkese karşı ve herkes için mutlak olarak vaciptir. Muhammed'e ﷺ Allah'ın indirdiğiyle hükmetmek ise özel bir adalettir; adalet türlerinin en mükemmeli ve en güzelidir. Onunla hükmetmek Peygamber'e ﷺ ve ona uyan herkese vaciptir. Allah'ın ve Resûlü'nün hükmüne bağlanmayan kâfirdir.» Sözü burada bitti, Allah ona rahmet etsin. Allah en iyisini bilir."]]}]}, {"ts": "15:17", "title": "2. Külliye: Mutlak gaybdan bir şeyi bildiğini iddia eden herkes tâğûttur", "paras": [{"reader": false, "ar": [[917.0, "الكلّيّة الثانية: <b>كلُّ من ادّعى علمَ شيءٍ من الغيب المطلق فهو طاغوت.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [925.1, "والمتقرّر في القواعد عند أهل السنة والجماعة أنّ علمَ الغيب المطلق من خصائص الله عز وجل،"], [946.9, "وهي خصلةٌ من خصال ربوبيّته،"], [949.0, "فلا يجوز أن نعتقد أنّ أحدًا من الخلق ـ كائنًا من كان ـ أنه يعلم شيئًا من هذا الغيب إلا ما أطلعه الله عز وجل بالوحي عليه."], [960.0, "ومن زعم أنّ غير الله يعلم شيئًا من هذا الغيب فإنه يكون قد جعله مساويًا لله عز وجل في خصيصة ربوبيّته، فيكون مشركًا."]], "tr": [[917.0, "<b>2. külliye: Mutlak gaybdan bir şeyi bildiğini iddia eden herkes tâğûttur.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [925.1, "Ehl-i Sünnet ve'l-Cemaat nezdinde kaidelerde yerleşmiş olan husus şudur:"], [943.4, "Mutlak gaybı bilmek Allah Azze ve Celle'nin hususiyetlerindendir;"], [946.9, "bu, O'nun rubûbiyyetinin vasıflarından bir vasıftır."], [949.5, "Dolayısıyla yaratılmışlardan herhangi birinin —kim olursa olsun— bu gaybdan bir şey bildiğine inanmamız caiz değildir;"], [955.7, "ancak Allah Azze ve Celle'nin vahiy yoluyla ona bildirdiği müstesnadır."], [960.0, "Kim Allah'tan başkasının bu gaybdan bir şey bildiğini iddia ederse, onu rubûbiyyetinin bir hususiyetinde Allah Azze ve Celle'ye denk kılmış olur; böylece müşrik olur."]]}, {"reader": false, "ar": [[973.0, "وقد دلّت الأدلّةُ الكثيرة على أنّ الله قد استأثر بعلم الغيب،"], [980.0, "فلا يعلم الغيبَ إلا الله."], [982.0, "قال الله عز وجل:"], [984.0, "<span class=\"ayah\">﴿قُل لَّا يَعْلَمُ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ الْغَيْبَ إِلَّا اللَّهُ﴾<\/span> <span class=\"ref\">[النمل: ٦٥]<\/span>."], [988.0, "وقال الله عز وجل:"], [992.7, "<span class=\"ayah\">﴿عَالِمُ الْغَيْبِ فَلَا يُظْهِرُ عَلَىٰ غَيْبِهِ أَحَدًا﴾<\/span> <span class=\"ref\">[الجن: ٢٦]<\/span>،"], [996.9, "الآيةَ بتمامها. وقال الله عز وجل مخاطبًا نبيَّه صلى الله عليه وسلم بقوله:"], [1003.0, "<span class=\"ayah\">﴿قُل لَّا أَمْلِكُ لِنَفْسِي نَفْعًا وَلَا ضَرًّا إِلَّا مَا شَاءَ اللَّهُ ۚ وَلَوْ كُنتُ أَعْلَمُ الْغَيْبَ لَاسْتَكْثَرْتُ مِنَ الْخَيْرِ وَمَا مَسَّنِيَ السُّوءُ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٨]<\/span>."]], "tr": [[973.0, "Pek çok delil, Allah'ın gayb bilgisini Kendisine has kıldığına delâlet etmiştir;"], [978.1, "gaybı Allah'tan başkası bilmez. Allah Azze ve Celle şöyle buyurmuştur:"], [982.5, "<span class=\"ayah\">﴿De ki: Göklerde ve yerde olanlar gaybı bilmez; ancak Allah bilir﴾<\/span> [Neml 65]."], [986.8, "Allah Azze ve Celle şöyle buyurmuştur:"], [989.0, "<span class=\"ayah\">﴿O gaybı bilendir; gaybını kimseye açmaz﴾<\/span> [Cin 26], ayetin tamamı."], [996.3, "Allah Azze ve Celle Peygamberi'ne ﷺ hitap ederek şöyle buyurmuştur:"], [1000.3, "<span class=\"ayah\">﴿De ki: Ben, Allah'ın dilediği dışında kendime ne bir fayda ne de bir zarar verme gücüne sahibim. Eğer gaybı bilseydim, elbette daha çok hayır yapardım ve bana hiçbir kötülük dokunmazdı﴾<\/span> [A'râf 188]."]]}, {"reader": false, "ar": [[1016.0, "ويقول الله عز وجل:"], [1018.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ عَالِمُ غَيْبِ السَّمَاوَاتِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[فاطر: ٣٨]<\/span>،"], [1021.0, "وفي الآية الأخرى: <span class=\"ayah\">﴿إِنَّ اللَّهَ يَعْلَمُ غَيْبَ السَّمَاوَاتِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[الحجرات: ١٨]<\/span>،"], [1026.0, "وقال في آيةٍ أخرى:"], [1028.5, "<span class=\"ayah\">﴿وَلِلَّهِ غَيْبُ السَّمَاوَاتِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[هود: ١٢٣]<\/span>."], [1031.0, "وقال الله عز وجل:"], [1033.3, "<span class=\"ayah\">﴿إِنَّمَا الْغَيْبُ لِلَّهِ فَانتَظِرُوا إِنِّي مَعَكُم مِّنَ الْمُنتَظِرِينَ﴾<\/span> <span class=\"ref\">[يونس: ٢٠]<\/span>."]], "tr": [[1016.0, "Allah Azze ve Celle şöyle buyurur:"], [1018.0, "<span class=\"ayah\">﴿Şüphesiz Allah göklerin ve yerin gaybını bilendir﴾<\/span> [Fâtır 38];"], [1021.0, "diğer ayette: <span class=\"ayah\">﴿Şüphesiz Allah göklerin ve yerin gaybını bilir﴾<\/span> [Hucurât 18];"], [1025.4, "başka bir ayette de şöyle buyurmuştur:"], [1027.9, "<span class=\"ayah\">﴿Göklerin ve yerin gaybı Allah'ındır﴾<\/span> [Hûd 123]."], [1031.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1033.3, "<span class=\"ayah\">﴿Gayb ancak Allah'ındır. Bekleyin, ben de sizinle birlikte bekleyenlerdenim﴾<\/span> [Yûnus 20]."]]}, {"reader": false, "ar": [[1038.0, "والملائكةُ ـ على عِظَم منزلتهم عند الله عز وجل ـ فإنهم لا يعلمون الغيب،"], [1045.0, "كما قال الله عز وجل عنهم:"], [1047.2, "<span class=\"ayah\">﴿إِنِّي جَاعِلٌ فِي الْأَرْضِ خَلِيفَةً ۖ قَالُوا أَتَجْعَلُ فِيهَا مَن يُفْسِدُ فِيهَا وَيَسْفِكُ الدِّمَاءَ وَنَحْنُ نُسَبِّحُ بِحَمْدِكَ وَنُقَدِّسُ لَكَ ۖ قَالَ إِنِّي أَعْلَمُ مَا لَا تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[البقرة: ٣٠]<\/span>."], [1058.0, "وقال الله عز وجل عن الأنبياء،"], [1062.0, "وقال الله عز وجل عن نبيّه ـ ولا أدري ذكرتُها أو لا ـ:"], [1068.0, "<span class=\"ayah\">﴿وَلَوْ كُنتُ أَعْلَمُ الْغَيْبَ لَاسْتَكْثَرْتُ مِنَ الْخَيْرِ وَمَا مَسَّنِيَ السُّوءُ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٨]<\/span>."]], "tr": [[1038.0, "Melekler de Allah Azze ve Celle katındaki büyük mertebelerine rağmen gaybı bilmezler."], [1043.2, "Nitekim Allah Azze ve Celle onlar hakkında şöyle buyurmuştur:"], [1046.5, "<span class=\"ayah\">﴿Ben yeryüzünde bir halife yaratacağım. Dediler ki: Biz Seni hamdinle tesbih ve takdis edip dururken, orada bozgunculuk yapacak ve kan dökecek birini mi yaratacaksın? Buyurdu ki: Ben sizin bilmediklerinizi bilirim﴾<\/span> [Bakara 30]."], [1057.5, "Allah Azze ve Celle peygamberler hakkında da şöyle buyurmuştur;"], [1062.0, "Allah Azze ve Celle Peygamberi hakkında —bunu zikrettim mi bilmiyorum— şöyle buyurmuştur:"], [1067.1, "<span class=\"ayah\">﴿Eğer gaybı bilseydim, elbette daha çok hayır yapardım ve bana hiçbir kötülük dokunmazdı﴾<\/span> [A'râf 188]."]]}, {"reader": false, "ar": [[1072.0, "وقال الله عز وجل عن الجنّ:"], [1074.0, "<span class=\"ayah\">﴿فَلَمَّا خَرَّ تَبَيَّنَتِ الْجِنُّ أَن لَّوْ كَانُوا يَعْلَمُونَ الْغَيْبَ مَا لَبِثُوا فِي الْعَذَابِ الْمُهِينِ﴾<\/span> <span class=\"ref\">[سبأ: ١٤]<\/span>."], [1083.0, "وقال الله عز وجل:"], [1084.6, "<span class=\"ayah\">﴿تِلْكَ مِنْ أَنبَاءِ الْغَيْبِ نُوحِيهَا إِلَيْكَ ۖ مَا كُنتَ تَعْلَمُهَا أَنتَ وَلَا قَوْمُكَ مِن قَبْلِ هَٰذَا﴾<\/span> <span class=\"ref\">[هود: ٤٩]<\/span>."], [1091.0, "ويقول الله عز وجل:"], [1093.2, "<span class=\"ayah\">﴿وَمِنْ أَهْلِ الْمَدِينَةِ ۖ مَرَدُوا عَلَى النِّفَاقِ لَا تَعْلَمُهُمْ﴾<\/span> <span class=\"ref\">[التوبة: ١٠١]<\/span>."], [1098.0, "فإذا كان الملائكةُ والأنبياءُ ـ على جلالة قدرهم ـ لا يعلمون شيئًا من الغيب،"], [1105.1, "فمن دونهم من باب أولى."]], "tr": [[1072.0, "Allah Azze ve Celle cinler hakkında şöyle buyurmuştur:"], [1074.0, "<span class=\"ayah\">﴿O (Süleyman) yere yıkılınca cinler anladılar ki, eğer gaybı bilselerdi o alçaltıcı azap içinde kalmazlardı﴾<\/span> [Sebe' 14]."], [1083.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1085.0, "<span class=\"ayah\">﴿Bunlar, sana vahyettiğimiz gayb haberlerindendir. Bundan önce bunları ne sen biliyordun ne de kavmin﴾<\/span> [Hûd 49]."], [1090.6, "Allah Azze ve Celle şöyle buyurur:"], [1093.2, "<span class=\"ayah\">﴿Medine halkından da nifakta inat edip direnenler var; sen onları bilmezsin﴾<\/span> [Tevbe 101]."], [1099.8, "Melekler ve peygamberler kadirlerinin yüceliğine rağmen gaybdan hiçbir şey bilmiyorlarsa, onlardan aşağıda olanların bilmemesi evleviyetle sabittir."]]}, {"reader": false, "ar": [[1108.0, "وفي «صحيح الإمام البخاري» من حديث الرُّبيِّع بنت مُعوِّذٍ رضي الله عنها قالت:"], [1113.5, "«دخل رسولُ الله صلى الله عليه وسلم حين بُنِيَ عليَّ، فجلس على فراشي كمجلسك مني، فجعلت جُوَيرياتٌ لنا يضربن بالدُّفّ ويندُبن من قُتل من آبائي، إذ قالت واحدةٌ ـ جاريةٌ منهنّ ـ: وفينا نبيٌّ يعلم ما في غدٍ، فقال النبيّ صلى الله عليه وسلم: دعي هذه، وقولي بالتي كنتِ تقولين» <span class=\"note\">(Buhârî)<\/span>."]], "tr": [[1108.0, "İmam Buhârî'nin «Sahîh»inde Rubeyyi' bint Muavviz'in —Allah ondan razı olsun— hadisinde şöyle der:"], [1112.6, "«Gerdeğe girdiğim zaman Resûlullah ﷺ yanıma girdi ve senin benden oturduğun yer gibi yatağımın üzerine oturdu. Bizim küçük cariyelerimiz def çalmaya ve babalarımdan öldürülenler için ağıt söylemeye başladılar. Derken onlardan biri, bir cariye: \"Aramızda yarın ne olacağını bilen bir peygamber var\" dedi. Bunun üzerine Peygamber ﷺ: \"Bunu bırak, söylemekte olduğun şeyi söyle\" buyurdu.» <span class=\"note\">(Buhârî)<\/span>"]]}, {"reader": false, "ar": [[1145.0, "وفي قول الله عز وجل:"], [1147.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ عِندَهُ عِلْمُ السَّاعَةِ وَيُنَزِّلُ الْغَيْثَ﴾<\/span> <span class=\"ref\">[لقمان: ٣٤]<\/span>،"], [1152.0, "الآيةَ بتمامها؛ روى الإمامُ ابن جرير وأبو حاتم <span class=\"note\">(كذا قال، والمعروف: ابن أبي حاتم)<\/span> عن مجاهدٍ قال:"], [1158.5, "«جاء رجلٌ من أهل البادية إلى النبيّ صلى الله عليه وسلم فقال له: يا رسول الله، إنّ امرأتي حُبلى فأخبرني ما تلد، وبلادُنا جَدْبةٌ فأخبرني متى ينزل الغيث، وقد علمتُ متى وُلدتُ فأخبرني متى أموت. فأنزل الله عز وجل هذه الآية: <span class=\"ayah\">﴿إِنَّ اللَّهَ عِندَهُ عِلْمُ السَّاعَةِ وَيُنَزِّلُ الْغَيْثَ وَيَعْلَمُ مَا فِي الْأَرْحَامِ﴾<\/span> <span class=\"ref\">[لقمان: ٣٤]<\/span>»،"], [1187.8, "إلى آخر الآية بتمامها."]], "tr": [[1145.0, "Allah Azze ve Celle'nin şu sözü hakkında:"], [1147.0, "<span class=\"ayah\">﴿Şüphesiz kıyamet saatinin bilgisi Allah katındadır; yağmuru O indirir﴾<\/span> [Lokmân 34], ayetin tamamı;"], [1155.3, "İmam İbn Cerîr ve Ebû Hâtim <span class=\"note\">(Şeyh böyle diyor; bilinen isim İbn Ebî Hâtim)<\/span> Mücâhid'den şöyle rivayet etmiştir:"], [1161.0, "«Çöl ehlinden bir adam Peygamber'e ﷺ gelip ona şöyle dedi: Ey Allah'ın Resûlü! Hanımım hamile, ne doğuracağını bana haber ver. Memleketimiz kurak, yağmurun ne zaman yağacağını bana haber ver. Ne zaman doğduğumu biliyorum, ne zaman öleceğimi bana haber ver. Bunun üzerine Allah Azze ve Celle şu ayeti indirdi: <span class=\"ayah\">﴿Şüphesiz kıyamet saatinin bilgisi Allah katındadır; yağmuru O indirir ve rahimlerde olanı O bilir﴾<\/span> [Lokmân 34].» Ayetin sonuna kadar."]]}]}, {"ts": "19:49", "title": "2. Külliye (devam): Kâhin, müneccim ve arrâfın hükmü; Sıddîk Hasan Hân'ın sözü", "paras": [{"reader": false, "ar": [[1189.0, "وقد نصّ العلماءُ على أنّ كلَّ من ادّعى شيئًا من علم الغيب فإنه طاغوت،"], [1198.0, "استدلالًا بقول الله عز وجل:"], [1200.0, "«ألم تر إلى الذين يزعمون…» <span class=\"note\">(Şeyh önce Nisâ 60'ın başını okuyup düzeltiyor)<\/span>،"], [1202.0, "<span class=\"ayah\">﴿أَلَمْ تَرَ إِلَى الَّذِينَ أُوتُوا نَصِيبًا مِّنَ الْكِتَابِ يُؤْمِنُونَ بِالْجِبْتِ وَالطَّاغُوتِ﴾<\/span> <span class=\"ref\">[النساء: ٥١]<\/span>."], [1209.0, "والجِبتُ هو السحر، والطاغوتُ:"], [1211.7, "كُهّانٌ كانت تنزل عليهم الشياطين،"], [1215.2, "في كلّ حيٍّ واحد."], [1218.0, "وهؤلاء الكُهّان إنما يتكلّمون في أمورٍ غيبيّة،"], [1222.0, "فوصف الشارعُ مَن يتكلّم في الأمور الغيبيّة المطلقة بأنه طاغوت."]], "tr": [[1189.0, "Âlimler, gayb bilgisinden bir şey iddia eden herkesin tâğût olduğunu açıkça belirtmişlerdir."], [1195.7, "Bunu Allah Azze ve Celle'nin şu sözüyle delillendirmişlerdir:"], [1199.2, "«…iddia edenleri görmedin mi…» <span class=\"note\">(Şeyh önce Nisâ 60'ın başını okuyup düzeltiyor)<\/span>, <span class=\"ayah\">﴿Kendilerine Kitap'tan bir pay verilenleri görmedin mi? Cibt'e ve tâğûta inanıyorlar﴾<\/span> [Nisâ 51]."], [1211.0, "Cibt sihirdir; tâğût ise üzerlerine şeytanların indiği kâhinlerdir;"], [1215.9, "her kabilede bir tane (vardı)."], [1219.1, "Bu kâhinler ancak gaybî işler hakkında konuşurlar."], [1222.6, "Şâri' de mutlak gaybî işler hakkında konuşanı tâğût olmakla nitelemiştir."]]}, {"reader": false, "ar": [[1229.0, "وقد أجمع العلماءُ على أنّ كلَّ من ادّعى علمَ شيءٍ من الغيب الذي استأثر الله عز وجل بعلمه فإنه كافر."], [1240.0, "وبناءً على ذلك: فالكاهنُ كافرٌ لأنه ممّن يدّعي علمَ الغيب،"], [1245.0, "والمنجّمُ كافرٌ لأنه يدّعي علمَ الغيب،"], [1250.0, "والعرّافُ كافرٌ لأنه ممّن يدّعي علمَ الغيب."], [1254.0, "ومن يضرب بالحصى استكشافًا للأمور المستقبليّة هو من جملة الكُهّان،"], [1261.0, "وكذلك الذي يخطّ في الرمل،"], [1263.5, "والمشعوذ، والذي ينظر في النجوم ويخبر بالغيب،"], [1267.0, "ومن يخبر الناسَ بما يكون لهم بناءً على برج ولادتهم؛"], [1273.0, "كلُّ ذلك ممّا يدخل في الكفر،"], [1277.5, "وأصحابُه يوصفون شرعًا بأنهم طواغيت، والله أعلم."]], "tr": [[1229.0, "Âlimler, Allah Azze ve Celle'nin bilgisini Kendisine has kıldığı gaybdan bir şeyi bildiğini iddia eden herkesin kâfir olduğu üzerinde icmâ etmişlerdir."], [1240.0, "Buna göre: Kâhin kâfirdir, çünkü gaybı bildiğini iddia edenlerdendir."], [1244.5, "Müneccim kâfirdir, çünkü gaybı bildiğini iddia eder."], [1250.0, "Arrâf kâfirdir, çünkü gaybı bildiğini iddia edenlerdendir."], [1254.0, "Gelecekteki işleri keşfetmek için çakıl taşı atan da kâhinler cümlesindendir."], [1260.3, "Kuma çizgi çizen, büyücü-hokkabaz, yıldızlara bakıp gaybdan haber veren ve insanlara doğum burçlarına dayanarak başlarına ne geleceğini haber veren de böyledir."], [1271.8, "Bunların hepsi küfre giren şeylerdendir;"], [1275.6, "sahipleri de şer'an tâğûtlar olarak nitelenir. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[1282.0, "قال صدّيق خان رحمه الله تعالى:"], [1286.0, "«فمن اعتقد في نبيٍّ، أو وليٍّ، أو جنٍّ، أو مَلَكٍ، أو إمامٍ، أو ولدِ إمامٍ، أو شيخٍ، أو شهيدٍ، أو منجّمٍ، أو رمّالٍ، أو جفّارٍ، أو فاتحِ فألٍ، أو برهما ـ وهو كُهّانٌ عندهم في الهند، والشيخُ هنديّ ـ أو راهبٍ، أو جنّيّةٍ، أو خبيثٍ، أنّ له مثلَ هذا العلم ـ أي علمَ الغيب ـ وأنه يعلم الغيبَ بعلمه، فهو مشركٌ بالله، وعقيدتُه هذه من أبطل الباطلات وأكذب المكذوبات»."], [1330.0, "انتهى كلامه رحمه الله."]], "tr": [[1282.0, "Sıddîk (Hasan) Hân —Allah ona rahmet etsin— şöyle demiştir:"], [1286.6, "«Kim bir peygamber, veli, cin, melek, imam, imam oğlu, şeyh, şehit, müneccim, remmal, cifirci, fal açıcı ya da Brahma hakkında —bu, Hindistan'da onların nezdindeki kâhinlerdir; Şeyh (Sıddîk Hân) de Hintlidir— ya da rahip, dişi cin veya habis (bir ruh) hakkında, onun bu ilme —yani gayb bilgisine— sahip olduğuna ve gaybı kendi bilgisiyle bildiğine inanırsa, o Allah'a şirk koşan bir müşriktir. Onun bu inancı bâtılların en bâtılı ve yalanların en yalanıdır.» Sözü burada bitti, Allah ona rahmet etsin."]]}]}, {"ts": "22:11", "title": "3. Külliye: Kesilen şeyin yüceltilmesi kastedilen her kesim büyük şirktir", "paras": [{"reader": false, "ar": [[1331.0, "الكلّيّة الثالثة: <b>كلُّ ذبحٍ يُقصد به تعظيمُ المذبوح له فشركٌ أكبر.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1331.0, "<b>3. külliye: Kendisi için kesilenin yüceltilmesi kastedilen her kesim büyük şirktir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1364.0, "ولقد قرّر أهلُ السنة والجماعة بأنّ الذبح أنواع:"], [1370.0, "منها ما يدخل في دائرة الاعتقاد،"], [1372.5, "ومنها ما لا يدخل فيه أصالةً."], [1375.0, "وتفصيلُه كما يلي: النوعُ الأوّل:"], [1378.6, "أن يقع عبادةً، وذلك إذا قصد تعظيمَ المذبوح له،"], [1388.2, "والتذلُّلَ له، والتقرُّبَ إليه."], [1392.0, "فهذا النوع من الذبح لا يكون إلا لله عز وجل،"], [1396.4, "على الوجه الذي شرعه الله تعالى."], [1399.0, "وقد أجمع العلماءُ في هذه الصورة على أنّ صرفها لغير الله شركٌ أكبر."]], "tr": [[1364.0, "Ehl-i Sünnet ve'l-Cemaat, kesimin türleri olduğunu takrir etmiştir:"], [1369.1, "Bir kısmı itikad dairesine girer, bir kısmı ise aslen ona girmez."], [1374.2, "Tafsilatı şöyledir: Birinci tür: Kesimin ibadet olarak vuku bulmasıdır."], [1379.3, "Bu da kendisi için kesilenin yüceltilmesi, ona boyun eğilmesi ve ona yaklaşılması kastedildiğinde olur."], [1392.9, "Bu tür kesim ancak Allah Azze ve Celle için, Allah Teâlâ'nın meşru kıldığı şekilde olur."], [1399.0, "Âlimler bu sûrette, onu Allah'tan başkasına yöneltmenin büyük şirk olduğu üzerinde icmâ etmişlerdir."]]}, {"reader": false, "ar": [[1407.0, "ودليلُه قولُ الله عز وجل:"], [1410.0, "<span class=\"ayah\">﴿قُلْ إِنَّ صَلَاتِي وَنُسُكِي﴾<\/span> ـ أي ذبحي ـ <span class=\"ayah\">﴿وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ ۝ لَا شَرِيكَ لَهُ﴾<\/span> <span class=\"ref\">[الأنعام: ١٦٢-١٦٣]<\/span>؛"], [1418.0, "فدلّ ذلك على أنّ من صرف شيئًا من الذبح على تلك الصورة لغير الله عز وجل فإنه واقعٌ في الشرك."], [1428.0, "ويقول الله عز وجل:"], [1430.8, "<span class=\"ayah\">﴿فَصَلِّ لِرَبِّكَ وَانْحَرْ﴾<\/span> <span class=\"ref\">[الكوثر: ٢]<\/span>، أي:"], [1433.6, "واذبح لربّك. فكما أنّ من صلّى لغير الله عز وجل واقعٌ في الشرك،"], [1442.0, "فكذلك من نحر تعظيمًا لغير الله عز وجل فإنه واقعٌ كذلك في الشرك."]], "tr": [[1407.0, "Delili Allah Azze ve Celle'nin şu sözüdür:"], [1410.0, "<span class=\"ayah\">﴿De ki: Şüphesiz benim namazım, kurbanım﴾<\/span> —yani kesimim— <span class=\"ayah\">﴿hayatım ve ölümüm âlemlerin Rabbi Allah içindir. O'nun hiçbir ortağı yoktur﴾<\/span> [En'âm 162–163]."], [1419.8, "Bu, kesimden bir şeyi o şekilde Allah Azze ve Celle'den başkasına yöneltenin şirke düştüğüne delâlet eder."], [1425.8, "Allah Azze ve Celle şöyle buyurur:"], [1429.4, "<span class=\"ayah\">﴿Rabbin için namaz kıl ve kurban kes﴾<\/span> [Kevser 2], yani Rabbin için kes."], [1439.1, "Allah Azze ve Celle'den başkası için namaz kılan nasıl şirke düşmüşse, Allah Azze ve Celle'den başkasını yüceltmek için kurban kesen de aynı şekilde şirke düşmüştür."]]}, {"reader": false, "ar": [[1450.0, "قال الرازيّ رحمه الله تعالى في تفسير قول الله عز وجل:"], [1457.0, "<span class=\"ayah\">﴿إِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ وَالدَّمَ وَلَحْمَ الْخِنزِيرِ وَمَا أُهِلَّ لِغَيْرِ اللَّهِ بِهِ﴾<\/span> <span class=\"ref\">[النحل: ١١٥]<\/span>:"], [1466.0, "«قال العلماء: لو أنّ مسلمًا ذبح ذبيحةً وقصد بذبحها التقرُّبَ إلى غير الله صار مرتدًّا، وذبيحتُه ذبيحةُ مرتدّ»."], [1480.0, "وعلى ذلك أيضًا قولُ الله عز وجل:"], [1484.0, "<span class=\"ayah\">﴿وَمَا ذُبِحَ عَلَى النُّصُبِ﴾<\/span> <span class=\"ref\">[المائدة: ٣]<\/span>."], [1488.0, "قال الإمامُ ابن كثيرٍ في تفسيره:"], [1491.0, "«قال مجاهدٌ وابنُ جُرَيج: كانت النُّصُب حجارةً حول الكعبة، وهي ثلاثُمائةٍ وستّون نُصُبًا،"]], "tr": [[1450.0, "Râzî —Allah ona rahmet etsin— Allah Azze ve Celle'nin şu sözünün tefsirinde:"], [1455.7, "<span class=\"ayah\">﴿O size ancak leşi, kanı, domuz etini ve Allah'tan başkası adına kesileni haram kıldı﴾<\/span> [Nahl 115] şöyle demiştir:"], [1466.7, "«Âlimler dediler ki: Bir Müslüman bir hayvan kesse ve onu kesmekle Allah'tan başkasına yaklaşmayı kastetse mürted olur; kestiği de mürtedin kestiği olur.» Allah Azze ve Celle'nin şu sözü de buna göredir:"], [1484.8, "<span class=\"ayah\">﴿…dikili taşlar üzerinde kesilen…﴾<\/span> [Mâide 3]."], [1489.0, "İmam İbn Kesîr tefsirinde şöyle der:"], [1491.0, "«Mücâhid ve İbn Cüreyc dediler ki: Nusub, Kâbe'nin etrafındaki taşlardı; üç yüz altmış dikili taştı."]]}, {"reader": false, "ar": [[1501.0, "فنهى اللهُ المؤمنين عن هذا الصنيع ـ أي الذبح لها ـ وحرّم عليهم أكلَ هذه الذبائح التي فُعلت عند النُّصُب،"], [1510.0, "حتى ولو كان يُذكر عليها اسمُ الله في الذبح عند النُّصُب،"], [1515.0, "فهو من الشرك الذي حرّمه الله عز وجل»."], [1521.0, "قال شيخُ الإسلام ابن تيمية رحمه الله:"], [1524.0, "«فالذبحُ للمعبود غايةُ الذلّ والخضوع له، ولهذا لم يَجُز الذبحُ لغير الله، ولا أن يُسمّي غيرَ الله على الذبح»."]], "tr": [[1501.0, "Allah müminleri bu yaptıklarından —yani onlar için kesmekten— nehyetmiş ve dikili taşların yanında kesilen bu hayvanları yemeyi onlara haram kılmıştır;"], [1509.6, "dikili taşların yanında keserken üzerlerine Allah'ın adı anılsa bile."], [1513.2, "Bu, Allah Azze ve Celle'nin haram kıldığı şirktendir.» Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1522.3, "«Mabud için kesmek, ona karşı zilletin ve boyun eğişin son noktasıdır. Bu yüzden Allah'tan başkası için kesmek de, kesimde Allah'tan başkasının adını anmak da caiz olmamıştır.»"]]}, {"reader": false, "ar": [[1538.0, "وفي «صحيح الإمام مسلم» من حديث عليٍّ رضي الله عنه قال:"], [1543.4, "قال النبيّ صلى الله عليه وسلم:"], [1546.0, "«لعن اللهُ من ذبح لغير الله، لعن اللهُ من لعن والديه، لعن اللهُ من آوى مُحدِثًا، لعن اللهُ من غيّر منارَ الأرض» <span class=\"note\">(Müslim)<\/span>."], [1559.0, "قال الشوكانيّ في شرح هذا الحديث:"], [1563.0, "«المرادُ به أن يذبح لغير الله، كمن ذبح للصنم، أو الصليب، أو لموسى، أو لعيسى عليهما السلام، أو للكعبة، ونحو ذلك؛ فكلُّ هذا حرام، ولا تحلّ هذه الذبيحة، سواءٌ كان الذابحُ مسلمًا أو كافرًا. فإن قصد مع ذلك ـ انتبه ـ فإن قصد مع ذلك تعظيمَ المذبوح له غيرِ الله، فإن كان الذابحُ مسلمًا قبل ذلك صار بالذبح مرتدًّا»."]], "tr": [[1538.0, "İmam Müslim'in «Sahîh»inde Ali'nin —Allah ondan razı olsun— hadisinde şöyle der:"], [1543.0, "Peygamber ﷺ buyurdu: «Allah, Allah'tan başkası için kesene lânet etsin. Allah, anne-babasına lânet edene lânet etsin. Allah, bid'atçıyı (veya suçluyu) barındırana lânet etsin. Allah, arazinin sınır işaretlerini değiştirene lânet etsin.» <span class=\"note\">(Müslim)<\/span> Şevkânî bu hadisin şerhinde şöyle demiştir:"], [1563.4, "«Bununla kastedilen, Allah'tan başkası için kesmektir; puta, haça, Mûsâ'ya veya Îsâ'ya —aleyhimesselâm— ya da Kâbe'ye ve benzerlerine kesen gibi. Bunların hepsi haramdır ve bu kesilen helâl olmaz; kesen ister Müslüman ister kâfir olsun. Eğer bununla beraber —dikkat et— eğer bununla beraber kendisi için kesilen Allah'tan başkasını yüceltmeyi kastederse, kesen daha önce Müslüman idiyse bu kesimle mürted olur.»"]]}, {"reader": false, "ar": [[1600.0, "قال الإمامُ الرافعيّ رحمه الله تعالى:"], [1603.0, "«اعلم أنّ الذبح للمعبود وباسمه نازلٌ منزلةَ السجود له، وكلُّ واحدٍ منهما نوعٌ من أنواع التعظيم والعبادة المخصوصة بالله تعالى الذي هو المستحقّ للعبادة. فمن ذبح لغيره ـ من حيوانٍ أو جمادٍ كصنمٍ ـ على وجه التعظيم والعبادة لم تحلّ ذبيحتُه، وكان ما يأتي به كفرًا، كمن سجد لغيره سجدةَ عبادة، وكذا لو ذبح له ولغيره على هذا الوجه»."]], "tr": [[1600.0, "İmam Râfiî —Allah ona rahmet etsin— şöyle demiştir:"], [1603.0, "«Bil ki mabud için ve onun adıyla kesmek, ona secde etmek yerine geçer. Bunların her biri, ibadete müstahak olan Allah Teâlâ'ya has olan tazim ve ibadet türlerinden bir türdür. Kim O'ndan başkası için —bir hayvan ya da put gibi bir cansız için— tazim ve ibadet yoluyla keserse, kestiği helâl olmaz ve yaptığı şey küfür olur; O'ndan başkasına ibadet secdesi yapan gibi. Bu şekilde hem O'nun için hem başkası için kesse de hüküm aynıdır.»"]]}, {"reader": false, "ar": [[1638.0, "وبناءً على ذلك، فهذا النوعُ الأوّل من أنواع الذبح لا يقع إلا تعبُّدًا،"], [1645.0, "فكلُّ من اعتقد بذَبْحته تعظيمَ المذبوح له فإنه يُعتبر كافرًا."], [1651.0, "فمن ذبح لغير الله فهو مشركٌ شركًا مُخرِجًا عن الملّة،"], [1655.0, "سواءٌ ذبح للملائكة، أو للأنبياء والرسل،"], [1658.9, "أو لوليٍّ من الأولياء،"], [1661.6, "أو لخليفةٍ من الخلفاء،"], [1664.2, "أو لعالمٍ من العلماء؛"], [1668.0, "فكلُّ ذلك شركٌ بالله عز وجل ومُخرِجٌ عن الملّة بالكلّيّة."], [1673.0, "والواجبُ على الإنسان أن يتّقي اللهَ عز وجل في هذه المذبوحات،"], [1677.0, "فلا يُريق دمَها إلا تعبُّدًا لله عز وجل."]], "tr": [[1638.0, "Buna göre, kesim türlerinden bu birinci tür ancak taabbud olarak vuku bulur."], [1643.9, "Kim kesimiyle kendisi için kesilenin yüceltilmesine inanırsa kâfir sayılır."], [1649.2, "Allah'tan başkası için kesen, dinden çıkaran bir şirkle müşriktir;"], [1653.0, "ister meleklere, ister peygamberlere ve resullere, ister velilerden bir veliye, ister halifelerden bir halifeye, ister âlimlerden bir âlime kessin."], [1664.2, "Bunların hepsi Allah Azze ve Celle'ye şirktir ve dinden tamamen çıkarır."], [1671.0, "İnsana vacip olan, bu kesilen hayvanlar hususunda Allah Azze ve Celle'den korkması ve onların kanını ancak Allah Azze ve Celle'ye taabbud olarak akıtmasıdır."]]}, {"reader": false, "ar": [[1683.0, "قال الحطّابُ المالكيّ في «مواهب الجليل» ـ من كتب المالكية ـ:"], [1688.0, "«وأمّا الذبحُ للأصنام فلا خلافَ في تحريمه؛ لأنه ممّا أُهِلَّ به لغير الله»."], [1695.0, "قال الإمامُ النوويّ رحمه الله تعالى:"], [1698.0, "«وأمّا الذبحُ لغير الله فالمرادُ به أن يذبح لغير اسم الله، كمن يذبح للصنم، أو للصليب، أو لعيسى، أو للكعبة، ونحو ذلك؛ فكلُّ هذا حرام، ولا تحلّ هذه الذبيحة. فإن قصد مع ذلك تعظيمَ المذبوح له غيرِ الله والعبادةَ له، كان ذلك كفرًا»."], [1720.0, "انتهى كلامه رحمه الله."]], "tr": [[1683.0, "Mâlikî mezhebinin kitaplarından «Mevâhibü'l-Celîl»de Hattâb el-Mâlikî şöyle demiştir:"], [1686.9, "«Putlar için kesmeye gelince, onun haram olduğunda ihtilaf yoktur; çünkü o, Allah'tan başkası adına kesilenlerdendir.» İmam Nevevî —Allah ona rahmet etsin— şöyle demiştir:"], [1697.5, "«Allah'tan başkası için kesmeye gelince, bununla kastedilen, Allah'ın adından başkası için kesmesidir; puta, haça, Îsâ'ya ya da Kâbe'ye ve benzerlerine kesen gibi. Bunların hepsi haramdır ve bu kesilen helâl olmaz. Eğer bununla beraber kendisi için kesilen Allah'tan başkasını yüceltmeyi ve ona ibadeti kastederse, bu küfür olur.» Sözü burada bitti, Allah ona rahmet etsin."]]}]}, {"ts": "28:42", "title": "3. Külliye (devam): İkram için kesim, tazim için kesim ile farkı; et için kesim", "paras": [{"reader": false, "ar": [[1722.0, "وأمّا النوعُ الثاني من أنواع الذبح فهو ذبحُ الإكرام،"], [1728.0, "فإنّ هذا مأمورٌ به أمرَ إيجابٍ أو أمرَ استحباب؛"], [1733.0, "لقول النبيّ صلى الله عليه وسلم لعبد الرحمن بن عوف:"], [1738.4, "«أَوْلِمْ ولو بشاة» <span class=\"note\">(Buhârî, Müslim)<\/span>، ولأنّ الذابح في هذا النوع لا يقصد تعظيمَ المذبوح له،"], [1745.6, "ولا التعبُّدَ له، ولا التقرُّبَ إليه،"], [1749.0, "وإنما يقصد بها إكرامَه فقط."]], "tr": [[1722.0, "Kesim türlerinden ikincisine gelince, o ikram için kesimdir."], [1725.9, "Bu, vücûb emri ya da müstehaplık emriyle emredilmiş bir şeydir."], [1732.4, "Çünkü Peygamber ﷺ Abdurrahman b."], [1734.6, "Avf'a: «Bir koyunla da olsa düğün yemeği ver» buyurmuştur <span class=\"note\">(Buhârî, Müslim)<\/span>."], [1740.6, "Ayrıca bu türde kesen kişi, kendisi için kesileni yüceltmeyi, ona taabbudu ve ona yaklaşmayı kastetmez;"], [1748.4, "onunla sadece ona ikram etmeyi kasteder."]]}, {"reader": false, "ar": [[1755.0, "فإن قلتَ: وما الفرقانُ بين ذبح الإكرام الذي أجزتَه في هذا النوع،"], [1762.8, "وبين ما قرّره أهلُ السنة بأنّ الذبح تحت أقدام الملوك تعظيمًا شركٌ وردّة؟"], [1772.0, "الجواب: الفرقانُ بينهما الأكلُ من عدمه؛"], [1780.0, "فإنّ ذبح الإكرام يُراد به أن يأكل من نُكرمه منها،"], [1786.0, "فهذا هو ذبحُ الإكرام؛"], [1789.0, "فأنا أذبح إكرامًا له قاصدًا أن ينتفع بهذا اللحم."], [1795.0, "وأمّا ذبحُ التعظيم والتقرُّب فهو الذبحُ الذي لا يقصد فاعلُه أن يأكل المذبوحُ له منه،"], [1804.0, "وإنما يريد فقط أن يعظّمه بتلك الذبحة،"], [1808.0, "وأن يتعبّد ويتقرّب له بتلك الذبحة."], [1813.0, "والفرقانُ بينهما واضحٌ ظاهر."]], "tr": [[1755.0, "Eğer şöyle dersen: Bu türde caiz gördüğün ikram kesimiyle, Ehl-i Sünnet'in krallar için ayaklarının altında tazim maksadıyla kesmenin şirk ve irtidat olduğunu takrir etmesi arasındaki fark nedir?"], [1772.0, "Cevap: İkisi arasındaki fark, (etinden) yenip yenmemesidir."], [1780.6, "İkram kesiminde, ikram ettiğimiz kişinin ondan yemesi kastedilir;"], [1785.4, "işte ikram kesimi budur. Ben ona ikram olsun diye, bu etten faydalanmasını kastederek keserim."], [1794.3, "Tazim ve yaklaşma kesimine gelince, o, yapanın kendisi için kesilenin ondan yemesini kastetmediği kesimdir."], [1802.4, "O sadece o kesimle onu yüceltmeyi, o kesimle ona taabbud etmeyi ve yaklaşmayı ister."], [1811.1, "İkisi arasındaki fark açık ve belirgindir."]]}, {"reader": false, "ar": [[1815.0, "النوعُ الثالث: ذبحُ الاستمتاع باللحم،"], [1820.0, "وهو من جملة المباحات؛"], [1822.0, "لقول الله عز وجل:"], [1824.0, "<span class=\"ayah\">﴿وَسَخَّرَ لَكُم مَّا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ جَمِيعًا مِّنْهُ﴾<\/span> <span class=\"ref\">[الجاثية: ١٣]<\/span>،"], [1830.0, "ومن جملة ما سخّره الله لنا تلك البهائم،"], [1834.7, "لننتفع ونستفيد من لحمها."], [1837.0, "وهو الذبحُ الذي يجري بين الناس،"], [1840.7, "فيذبحون الحيوانَ على اسم الله عز وجل،"], [1845.0, "ويجعلونه في بيوتهم ليأكلوا منه هم وأبناؤهم."]], "tr": [[1815.0, "Üçüncü tür: Etten faydalanmak için kesim."], [1819.3, "Bu da mubahlar cümlesindendir. Çünkü Allah Azze ve Celle şöyle buyurmuştur:"], [1824.0, "<span class=\"ayah\">﴿Göklerde olanları ve yerde olanları, hepsini kendinden (bir lütuf olarak) sizin hizmetinize verdi﴾<\/span> [Câsiye 13]."], [1831.2, "Allah'ın bizim hizmetimize verdiği şeylerden biri de o hayvanlardır;"], [1835.2, "onların etinden faydalanalım ve istifade edelim diye."], [1838.2, "Bu, insanlar arasında cereyan eden kesimdir:"], [1841.3, "Hayvanı Allah Azze ve Celle'nin adıyla keserler, onu evlerine koyarlar ki kendileri ve çocukları ondan yesinler."]]}]}, {"ts": "30:51", "title": "4. Külliye: Allah'tan başkası adına kesilen her şeyin yenmesi haramdır", "paras": [{"reader": false, "ar": [[1851.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما أُهِلَّ لغير الله فيحرُم أكلُه.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1851.0, "Külliyelerden biri de şudur: 4."], [1853.1, "külliye: Allah'tan başkası adına kesilen her şeyin yenmesi haramdır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1875.0, "أقول وبالله التوفيق: ودليلُ هذه الكلّيّة قولُ الله عز وجل في سياق المحرَّمات:"], [1884.0, "<span class=\"ayah\">﴿إِنَّمَا حَرَّمَ عَلَيْكُمُ الْمَيْتَةَ وَالدَّمَ وَلَحْمَ الْخِنزِيرِ وَمَا أُهِلَّ لِغَيْرِ اللَّهِ بِهِ﴾<\/span> <span class=\"ref\">[النحل: ١١٥]<\/span>."], [1890.0, "وقال الله عز وجل:"], [1893.0, "<span class=\"ayah\">﴿وَلَا تَأْكُلُوا مِمَّا لَمْ يُذْكَرِ اسْمُ اللَّهِ عَلَيْهِ وَإِنَّهُ لَفِسْقٌ ۗ وَإِنَّ الشَّيَاطِينَ لَيُوحُونَ إِلَىٰ أَوْلِيَائِهِمْ لِيُجَادِلُوكُمْ ۖ وَإِنْ أَطَعْتُمُوهُمْ إِنَّكُمْ لَمُشْرِكُونَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٢١]<\/span>."], [1906.0, "والآياتُ في هذا المعنى متعدّدة."]], "tr": [[1875.0, "Tevfik Allah'tandır, derim ki: Bu külliyenin delili, Allah Azze ve Celle'nin haram kılınanlar bağlamındaki şu sözüdür:"], [1883.0, "<span class=\"ayah\">﴿O size ancak leşi, kanı, domuz etini ve Allah'tan başkası adına kesileni haram kıldı﴾<\/span> [Nahl 115]."], [1889.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1892.2, "<span class=\"ayah\">﴿Üzerine Allah'ın adı anılmayan şeylerden yemeyin; çünkü bu kesinlikle bir fısktır. Şüphesiz şeytanlar, sizinle mücadele etsinler diye dostlarına telkinde bulunurlar. Eğer onlara itaat ederseniz, şüphesiz siz de müşrik olursunuz﴾<\/span> [En'âm 121]. Bu manadaki ayetler çoktur."]]}, {"reader": false, "ar": [[1909.0, "قال الإمامُ ابن كثيرٍ رحمه الله تعالى:"], [1912.0, "«<span class=\"ayah\">﴿مَا أُهِلَّ بِهِ لِغَيْرِ اللَّهِ﴾<\/span>: وهو ما ذُبح على غير اسمه تعالى، من الأنصاب والأنداد والأزلام، ونحو ذلك ممّا كانت الجاهليّة ينحرون له»."], [1926.0, "وقال رحمه الله في موضعٍ آخر:"], [1929.0, "«أي: ما ذُبح فذُكر عليه اسمُ غير الله عز وجل فهو حرام؛ لأنّ الله تعالى أوجب أن تُذبح مخلوقاتُه على اسمه العظيم، فمتى عُدل بها عن ذلك، وذُكر عليها اسمُ غيره من صنمٍ أو طاغوتٍ أو وثنٍ أو غير ذلك من سائر المخلوقات، فإنها حرامٌ بالإجماع»."], [1955.0, "انتهى كلامه. فأيُّ ذبيحةٍ ذُكر عليها اسمُ غير الله عز وجل ـ أيًّا كان المذكورُ اسمُه ـ فإنها حرامٌ لا يجوز أكلُها."]], "tr": [[1909.0, "İmam İbn Kesîr —Allah ona rahmet etsin— şöyle demiştir:"], [1912.0, "«<span class=\"ayah\">﴿Allah'tan başkası adına kesilen﴾<\/span>: Bu, dikili taşlar, (Allah'a koşulan) eşler, fal okları ve benzerleri gibi cahiliye ehlinin kendileri için kurban kestiği şeyler adına, Allah Teâlâ'nın adından başkası üzerine kesilendir.» Başka bir yerde de —Allah ona rahmet etsin— şöyle demiştir:"], [1932.6, "«Yani kesilip üzerine Allah Azze ve Celle'den başkasının adı anılan haramdır. Çünkü Allah Teâlâ, yarattıklarının Kendi yüce adıyla kesilmesini vacip kılmıştır. Ne zaman bundan sapılır da üzerine put, tâğût, sanem ya da diğer yaratılmışlardan biri gibi O'ndan başkasının adı anılırsa, o kesilen icmâ ile haramdır.» Sözü burada bitti."], [1958.0, "Dolayısıyla üzerine Allah Azze ve Celle'den başkasının adı anılan her kesilen —adı anılan kim olursa olsun— haramdır, yenmesi caiz değildir."]]}, {"reader": false, "ar": [[1966.0, "قال العلّامةُ الشوكانيّ رحمه الله تعالى:"], [1969.0, "«والمرادُ هنا ما ذُكر عليه اسمُ غير الله، كاللّات والعُزّى إذا كان الذابحُ وثنيًّا، والنارِ إذا كان الذابحُ مجوسيًّا، ولا خلافَ في تحريم هذا وأمثاله، فما ذُبح فذُكر عليه اسمُ غير الله فهو حرام»."], [1988.1, "انتهى كلامه رحمه الله تعالى."]], "tr": [[1966.0, "Allâme Şevkânî —Allah ona rahmet etsin— şöyle demiştir:"], [1969.6, "«Burada kastedilen, üzerine Allah'tan başkasının adı anılandır; kesen putperest ise Lât ve Uzzâ gibi, kesen Mecûsî ise ateş gibi. Bunun ve benzerlerinin haram olduğunda ihtilaf yoktur. Kesilip üzerine Allah'tan başkasının adı anılan haramdır.» Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[1991.0, "وبناءً على ذلك: فكلُّ مذبوحٍ ذُكر عليه اسمُ مَلَكٍ من الملائكة،"], [1998.0, "أو نبيٍّ من الأنبياء،"], [2000.0, "أو رسولٍ من الرسل،"], [2002.0, "أو مَلِكٍ من الملوك،"], [2004.0, "أو صنمٍ من الأصنام،"], [2006.0, "أو ذُكر عليه اسمُ اللّات أو العُزّى أو مناةَ الثالثة الأخرى،"], [2012.0, "أو ذُبح للكواكب وذُكر عليه اسمُ الزُّهَرة،"], [2016.0, "أو ذُكر عليه عند الذبح اسمُ رئيسٍ أو مقدَّمٍ في قبيلةٍ أو عالمٍ من العلماء؛"], [2024.0, "فإنّ كلَّ ذلك وشِبهَه من الإهلال لغير الله تعالى،"], [2030.0, "فيدخل في تحريم الأكل إجماعًا، والله أعلم."]], "tr": [[1991.0, "Buna göre: Üzerine meleklerden bir meleğin, peygamberlerden bir peygamberin, resullerden bir resulün, krallardan bir kralın ya da putlardan bir putun adı anılan;"], [2002.5, "üzerine Lât'ın, Uzzâ'nın ya da üçüncüleri olan öteki Menât'ın adı anılan;"], [2008.2, "yıldızlar için kesilip üzerine Zühre'nin adı anılan;"], [2012.0, "ya da kesim sırasında üzerine bir reisin, bir kabilede önde gelen birinin veya âlimlerden bir âlimin adı anılan her kesilen hayvan —bunların hepsi ve benzerleri Allah Teâlâ'dan başkası adına kesmektendir— icmâ ile yenmesi haram olanlara girer. Allah en iyisini bilir."]]}]}, {"ts": "33:54", "title": "5. Külliye: Mahluka tazim yoluyla yöneltilen her adak büyük şirktir", "paras": [{"reader": false, "ar": [[2034.0, "ومن الكلّيّات أيضًا: <b>كلُّ نذرٍ صُرف للمخلوق على وجه التعظيم فشركٌ أكبر،<\/b> <b>كلُّ نذرٍ صُرف للمخلوق على وجه التعظيم للمنذور فشركٌ أكبر.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2034.0, "Külliyelerden biri de şudur: 5."], [2036.7, "külliye: Mahluka tazim yoluyla yöneltilen her adak büyük şirktir; kendisine adak adananı tazim yoluyla mahluka yöneltilen her adak büyük şirktir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2050.0, "أقول وبالله التوفيق: وذلك لأنّ النذر من جملة العبادات،"], [2056.1, "ومن جملة دعاء العبادة،"], [2062.0, "وقد قرّرنا سابقًا بأنّ كلَّ من صرف تعبُّدًا لغير الله عز وجل فإنه يُعتبر كافرًا الكفرَ الأكبر."], [2071.0, "فإن قلتَ: وما برهانُك على أنّ النذر عبادة؟"], [2074.0, "فأقول: كتابُ الله وسنّةُ نبيّه صلى الله عليه وسلم."], [2079.0, "قال الله تبارك وتعالى:"], [2082.0, "<span class=\"ayah\">﴿وَمَا أَنفَقْتُم مِّن نَّفَقَةٍ أَوْ نَذَرْتُم مِّن نَّذْرٍ فَإِنَّ اللَّهَ يَعْلَمُهُ ۗ وَمَا لِلظَّالِمِينَ مِنْ أَنصَارٍ﴾<\/span> <span class=\"ref\">[البقرة: ٢٧٠]<\/span>،"], [2092.0, "وهذا سِيق مساقَ المدح والثناء على تلك الأفعال،"], [2097.0, "وكلُّ فعلٍ مدحه الشارع فهو تعبُّد،"], [2102.0, "وكلُّ فعلٍ مدحه الشارع فهو تعبُّد."]], "tr": [[2050.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi şudur:"], [2054.1, "Adak ibadetler cümlesindendir ve ibadet duası cümlesindendir."], [2062.0, "Biz daha önce, Allah Azze ve Celle'den başkasına bir taabbud yönelten herkesin büyük küfürle kâfir sayılacağını takrir etmiştik."], [2070.2, "Eğer şöyle dersen: Adağın ibadet olduğuna delilin nedir?"], [2073.6, "Derim ki: Allah'ın Kitabı ve Peygamberi'nin ﷺ Sünneti."], [2077.3, "Allah Tebâreke ve Teâlâ şöyle buyurmuştur:"], [2081.2, "<span class=\"ayah\">﴿Her ne harcama yaptıysanız veya her ne adak adadıysanız, şüphesiz Allah onu bilir. Zalimlerin hiçbir yardımcısı yoktur﴾<\/span> [Bakara 270]."], [2093.2, "Bu, o fiilleri övme ve sena etme üslubuyla getirilmiştir."], [2098.5, "Şâri'nin övdüğü her fiil taabbuddur;"], [2102.7, "Şâri'nin övdüğü her fiil taabbuddur."]]}, {"reader": false, "ar": [[2106.0, "ومثلُه قولُ الله عز وجل:"], [2108.0, "<span class=\"ayah\">﴿يُوفُونَ بِالنَّذْرِ وَيَخَافُونَ يَوْمًا كَانَ شَرُّهُ مُسْتَطِيرًا﴾<\/span> <span class=\"ref\">[الإنسان: ٧]<\/span>."], [2114.0, "وقد أثنى اللهُ عز وجل على امرأة عمران حين نذرت ما في بطنها خالصًا لله تعالى لخدمة بيته،"], [2122.0, "فقال سبحانه: <span class=\"ayah\">﴿إِذْ قَالَتِ امْرَأَتُ عِمْرَانَ رَبِّ إِنِّي نَذَرْتُ لَكَ مَا فِي بَطْنِي مُحَرَّرًا فَتَقَبَّلْ مِنِّي ۖ إِنَّكَ أَنتَ السَّمِيعُ الْعَلِيمُ﴾<\/span> <span class=\"ref\">[آل عمران: ٣٥]<\/span>."], [2131.0, "وإذا كان النذرُ بهذه المنزلة العظيمة من الشريعة فإنه لا يقع إلا عبادةً،"], [2138.5, "فيكون صارفُه لغير الله عز وجل كافرًا."]], "tr": [[2106.0, "Allah Azze ve Celle'nin şu sözü de onun gibidir:"], [2109.5, "<span class=\"ayah\">﴿Onlar adaklarını yerine getirirler ve kötülüğü her yeri kaplayan bir günden korkarlar﴾<\/span> [İnsân 7]."], [2115.5, "Allah Azze ve Celle, karnındakini Allah Teâlâ'ya has olarak O'nun evinin hizmetine adadığında İmrân'ın hanımını övmüş ve Sübhânehû şöyle buyurmuştur:"], [2123.5, "<span class=\"ayah\">﴿Hani İmrân'ın hanımı şöyle demişti: Rabbim! Karnımdakini her şeyden azade olarak Sana adadım; benden kabul et. Şüphesiz Sen hakkıyla işitensin, hakkıyla bilensin﴾<\/span> [Âl-i İmrân 35]."], [2132.2, "Adak şeriatta bu büyük mertebede olunca, o ancak ibadet olarak vuku bulur;"], [2138.0, "onu Allah Azze ve Celle'den başkasına yönelten de kâfir olur."]]}, {"reader": false, "ar": [[2142.0, "وفي «صحيح الإمام البخاري» من حديث عائشة رضي الله عنها قالت:"], [2147.0, "قال النبيّ صلى الله عليه وسلم:"], [2150.0, "«من نذر أن يطيع اللهَ فليُطِعه، ومن نذر أن يعصي اللهَ فلا يعصِه» <span class=\"note\">(Buhârî)<\/span>."], [2156.0, "وبناءً على ذلك: فكلُّ نذرٍ صرفه الناذرُ لغير الله عز وجل ـ فقال:"], [2162.9, "نذرٌ للملائكة، أو قال:"], [2166.6, "نذرٌ للأنبياء والرسل، أو قال:"], [2170.0, "نذرٌ لوليٍّ من الأولياء،"], [2172.0, "أو نذرٌ لآل البيت،"], [2175.0, "أو نذرٌ لصنمٍ من الأصنام،"], [2178.0, "أو غير ذلك ـ فإنه يُعتبر خالعًا رِبقةَ الإسلام من عنقه بالكلّيّة؛"], [2185.0, "وذلك لأنه إنما قصد بصرف هذا النذر تعظيمَ المنذور له،"], [2190.0, "والتعبُّدَ والتقرُّبَ له بهذا النذر."]], "tr": [[2142.0, "İmam Buhârî'nin «Sahîh»inde Âişe'nin —Allah ondan razı olsun— hadisinde şöyle der:"], [2146.5, "Peygamber ﷺ buyurdu: «Kim Allah'a itaat etmeyi adarsa O'na itaat etsin; kim Allah'a isyan etmeyi adarsa O'na isyan etmesin.» <span class=\"note\">(Buhârî)<\/span> Buna göre:"], [2156.0, "Adak adayanın Allah Azze ve Celle'den başkasına yönelttiği her adak —meleklere adak, ya da peygamberlere ve resullere adak, ya da velilerden bir veliye adak, ya da Ehl-i Beyt'e adak, ya da putlardan bir puta adak demesi veya başka bir şey— bu kişi İslâm bağını boynundan tamamen çıkarmış sayılır."], [2182.7, "Çünkü o, bu adağı yöneltmekle ancak kendisine adak adananı yüceltmeyi, bu adakla ona taabbud etmeyi ve yaklaşmayı kastetmiştir."]]}, {"reader": false, "ar": [[2192.0, "قال شيخُ الإسلام ابن تيمية رحمه الله:"], [2195.0, "«فمن نذر لغير الله فهو مشركٌ أعظمَ من شرك الحلف بغير الله، وهو ـ أي النذرُ لغير الله ـ كالسجود لغير الله»."], [2209.0, "انتهى كلامه. وقال الشيخ سليمانُ آل الشيخ رحمه الله:"], [2213.0, "«النذرُ لغير الله، كالنذر لإبراهيم الخليل، أو محمدٍ النبيّ الأمّيّ صلى الله عليه وسلم، أو ابن عباسٍ رضي الله عنهما، أو الشيخ عبد القادر، أو الخضر، أو لملَكٍ من الملائكة، أو جنّيٍّ، أو شجرةٍ؛ فلا خلافَ بين من يُعتدّ به من علماء المسلمين أنه من الشرك الاعتقاديّ» ـ أي من الشرك الأكبر ـ."]], "tr": [[2192.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2195.7, "«Kim Allah'tan başkası için adak adarsa, Allah'tan başkası adına yemin etme şirkinden daha büyük bir şirkle müşriktir. O —yani Allah'tan başkası için adak— Allah'tan başkasına secde etmek gibidir.» Sözü burada bitti."], [2213.7, "Şeyh Süleyman Âlu'ş-Şeyh —Allah ona rahmet etsin— şöyle demiştir:"], [2218.5, "«Allah'tan başkası için adak; Halîl İbrâhîm'e, ümmî peygamber Muhammed'e ﷺ, İbn Abbâs'a —Allah ikisinden razı olsun—, Şeyh Abdülkâdir'e, Hızır'a, meleklerden bir meleğe, bir cinne ya da bir ağaca adak gibi; Müslüman âlimlerden görüşüne itibar edilenler arasında bunun itikadî şirkten olduğunda ihtilaf yoktur» —yani büyük şirktendir—."]]}, {"reader": false, "ar": [[2243.0, "قال رحمه الله: «لأنّ الناذر لم ينذر هذا النذرَ الذي لغير الله إلا لاعتقاده في المنذور له أنه يضرّ وينفع، ويعطي ويمنع، إمّا بطبعه وإمّا بقوّة السببيّة فيه، وأنه يجلب الخيرَ والبركة، ويدفع الشرَّ والعُسرة»."], [2264.0, "انتهى كلامه رحمه الله."]], "tr": [[2243.0, "(Yine) o —Allah ona rahmet etsin— şöyle demiştir:"], [2245.5, "«Çünkü adak adayan, Allah'tan başkası için olan bu adağı ancak kendisine adak adanan hakkında şuna inandığı için adar: Onun zarar ve fayda verdiğine, verip engellediğine —ya tabiatıyla ya da kendisindeki sebeplilik gücüyle— ve hayrı ve bereketi getirip kötülüğü ve darlığı uzaklaştırdığına.» Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2266.0, "وقال الشيخ عبد الرحمن بن حسن رحمه الله في «فتح المجيد»:"], [2269.0, "يقول شيخُ الإسلام ابن تيمية رحمه الله:"], [2272.0, "«وأمّا ما نُذر لغير الله ـ كالنذر للأصنام والشمس والقمر والقبور وغير ذلك ـ فهو بمنزلة أن يحلف بغير الله من المخلوقات، والذي يحلف بغير الله معظِّمًا غيرَ الله سبحانه فإنه يشرك بالله سبحانه»."], [2294.0, "فإذا حلف الإنسانُ وهو يقصد تعظيمَ هذا الشيء،"], [2298.0, "كأن يحلف بالشمس والقمر أو بالأصنام،"], [2301.0, "فقد كفر الكفرَ الأكبر."], [2304.0, "انتهى كلامه رحمه الله."]], "tr": [[2266.0, "Şeyh Abdurrahman b. Hasan —Allah ona rahmet etsin— «Fethu'l-Mecîd»de şöyle der:"], [2268.5, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle der:"], [2271.1, "«Allah'tan başkası için adanana gelince —putlara, güneşe, aya, kabirlere ve başka şeylere adamak gibi— bu, yaratılmışlardan Allah'tan başka bir şey adına yemin etmesi mesabesindedir. Allah Sübhânehû'dan başkasını yücelterek Allah'tan başkası adına yemin eden kişi, Allah Sübhânehû'ya şirk koşmuş olur.» İnsan bu şeyi yüceltmeyi kastederek yemin ederse —güneş ve ay adına ya da putlar adına yemin etmesi gibi— büyük küfürle kâfir olmuştur."], [2302.5, "Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2306.0, "وقال ابنُ تيمية رحمه الله تعالى:"], [2308.0, "«اتّفق العلماءُ على أنه لا يجوز لأحدٍ أن ينذر لغير الله، لا لنبيٍّ ولا لغير نبيٍّ، وأنّ هذا نذرُ شركٍ لا يُوفى به»."], [2324.0, "انتهى كلامه رحمه الله."], [2326.0, "يقول العلّامةُ ابنُ الأمير الصنعانيّ رحمه الله تعالى:"], [2330.0, "«وأمّا النذورُ المعروفة في هذه الأزمنة على القبور والمشاهد والأموات فلا كلامَ في تحريمها؛ لأنّ الناذر يعتقد في صاحب القبر أنه ينفع ويضرّ، ويجلب الخيرَ ويدفع الشرّ، ويعافي من الألم، ويشفي من السَّقَم، وهذا هو الذي كان يفعله عُبّادُ الأوثان بعينه. فيحرُم النذرُ للقبر كما يحرُم النذرُ على الوثن، ويحرُم قبضُه؛ لأنه تقريرٌ على الشرك، ويجب النهيُ عنه»."], [2364.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[2306.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2308.0, "«Âlimler, hiç kimsenin Allah'tan başkası için —ne bir peygamber ne de peygamber olmayan biri için— adak adamasının caiz olmadığında ve bunun yerine getirilmeyecek bir şirk adağı olduğunda ittifak etmişlerdir.» Sözü burada bitti, Allah ona rahmet etsin."], [2328.4, "Allâme İbnü'l-Emîr es-San'ânî —Allah ona rahmet etsin— şöyle der:"], [2331.5, "«Bu zamanlarda kabirlere, türbelere ve ölülere adanan bilinen adaklara gelince, bunların haram olduğunda söz yoktur. Çünkü adak adayan, kabir sahibinin fayda ve zarar verdiğine, hayrı getirip şerri uzaklaştırdığına, acıdan kurtarıp hastalıktan şifa verdiğine inanır. Bu da putlara tapanların yaptığının ta kendisidir. Dolayısıyla puta adak haram olduğu gibi kabre adak da haramdır. Onu teslim almak da haramdır; çünkü bu, şirki onaylamaktır. Ondan nehyetmek vaciptir.» Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2369.0, "وجاء في كتاب «التوضيح عن توحيد الخلّاق»:"], [2373.0, "«النذرُ غيرُ الجائز قسمان، النذرُ غيرُ الجائز قسمان: أحدهما: نذرُ فعلِ معصيةٍ، كشرب خمرٍ وقتلِ معصومٍ، فيحرُم الوفاءُ به؛ لقول النبيّ صلى الله عليه وسلم: من نذر أن يعصي اللهَ فلا يعصِه. الثاني: النذرُ لغير الله، كالنذر لإبراهيم الخليل، أو محمدٍ النبيّ صلى الله عليه وسلم، أو ابن عباسٍ، أو الشيخ عبد القادر ـ إلى أن قال ـ: فلا خلافَ بين من يُعتدّ به بين علماء المسلمين أنه من الشرك الاعتقاديّ»."], [2410.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[2369.0, "«et-Tavdîh an Tevhîdi'l-Hallâk» kitabında şöyle geçer:"], [2371.9, "«Caiz olmayan adak iki kısımdır, caiz olmayan adak iki kısımdır: Birincisi: İçki içmek ve kanı korunmuş birini öldürmek gibi bir masiyeti işleme adağı; Peygamber'in ﷺ \"Kim Allah'a isyan etmeyi adarsa O'na isyan etmesin\" sözünden dolayı onu yerine getirmek haramdır. İkincisi: Allah'tan başkası için adak; Halîl İbrâhîm'e, Peygamber Muhammed'e ﷺ, İbn Abbâs'a ya da Şeyh Abdülkâdir'e adak gibi —şöyle dediği yere kadar—: Müslüman âlimlerden görüşüne itibar edilenler arasında bunun itikadî şirkten olduğunda ihtilaf yoktur.» Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2413.0, "فجميعُ تلك النذور التي نراها على القبور والأضرحة والمشاهد،"], [2417.0, "أو التي تُصرف للسيّد البدويّ،"], [2419.5, "أو للحسين، أو لعليّ بن أبي طالب،"], [2423.0, "أو للعَيدَروس، أو لحيٍّ أو ميّتٍ أو مَلَكٍ أو جنّيٍّ؛"], [2427.0, "كلُّها من النذر الذي يُخرج صاحبَه عن ملّة الإسلام بالكلّيّة،"], [2431.0, "والعياذ بالله، والله أعلم."]], "tr": [[2413.0, "Kabirlerde, türbelerde ve meşhedlerde gördüğümüz ya da Seyyid Bedevî'ye, Hüseyin'e, Ali b."], [2419.0, "Ebî Tâlib'e, Aydarûs'a veya bir diriye, ölüye, meleğe ya da cinne yöneltilen bütün o adakların hepsi, sahibini İslâm dininden tamamen çıkaran adaktandır."], [2429.8, "Allah'a sığınırız. Allah en iyisini bilir."]]}]}, {"ts": "40:33", "title": "6. Külliye: Adanan hiçbir masiyeti yerine getirmek caiz değildir", "paras": [{"reader": false, "ar": [[2433.3, "الكلّيّة السادسة: <b>كلُّ معصيةٍ نُذرت فلا يجوز الوفاءُ بها.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [2442.1, "وذلك لقول النبيّ صلى الله عليه وسلم:"], [2456.0, "«ومن نذر أن يعصي اللهَ فلا يعصِه»،"], [2459.0, "وهذا نهيٌ، والمتقرّر في القواعد أنّ النهي المتجرّد عن القرينة يقتضي التحريم."], [2464.0, "ولقوله صلى الله عليه وسلم:"], [2466.9, "«لا نذرَ في معصية، وكفّارتُه كفّارةُ يمين»."]], "tr": [[2433.3, "<b>6. külliye: Adanan hiçbir masiyeti yerine getirmek caiz değildir.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [2442.1, "Bunun sebebi Peygamber'in ﷺ şu sözüdür:"], [2445.6, "«Kim Allah'a isyan etmeyi adarsa O'na isyan etmesin.» Bu bir nehiydir;"], [2459.4, "kaidelerde yerleşmiş olan husus da şudur:"], [2461.5, "Karineden soyut olan nehiy haramlığı gerektirir."], [2463.6, "Bir de onun ﷺ şu sözünden dolayı:"], [2466.9, "«Masiyette adak yoktur; onun kefareti yemin kefaretidir.»"]]}, {"reader": false, "ar": [[2471.0, "ولقوله صلى الله عليه وسلم في حقّ الرجل الذي نذر أن ينحر إبلًا بِبُوانة،"], [2477.0, "فقال النبيّ صلى الله عليه وسلم في آخر حديثه ـ أو في آخر كلامه ـ:"], [2483.0, "«فإنه لا نذرَ في معصية، ولا فيما لا يملكه ابنُ آدم»."], [2491.0, "وفي حديث ابن عباسٍ رضي الله عنهما قال:"], [2494.4, "«بينا النبيّ صلى الله عليه وسلم يخطب إذا هو برجلٍ قائم، فسأل عنه، فقالوا: أبو إسرائيل، نذر أن يقوم ولا يقعد، ولا يستظلّ، ولا يتكلّم، ويصوم. فقال النبيّ صلى الله عليه وسلم: مُروه فليتكلّم، وليستظلّ، وليقعد، وليُتمّ صومَه» <span class=\"note\">(Buhârî)<\/span>."]], "tr": [[2471.0, "Bir de onun ﷺ, Buvâne'de deve kesmeyi adayan adam hakkındaki sözünden dolayı:"], [2476.1, "Peygamber ﷺ hadisinin sonunda —ya da sözünün sonunda— şöyle buyurmuştur:"], [2481.2, "«Çünkü masiyette ve âdemoğlunun sahip olmadığı şeyde adak yoktur.» İbn Abbâs'ın —Allah ikisinden razı olsun— hadisinde de şöyle der:"], [2492.9, "«Peygamber ﷺ hutbe okurken ayakta duran bir adam gördü ve onu sordu. \"Ebû İsrâîl'dir; ayakta durmayı, oturmamayı, gölgelenmemeyi, konuşmamayı ve oruç tutmayı adadı\" dediler. Bunun üzerine Peygamber ﷺ: \"Ona emredin; konuşsun, gölgelensin, otursun ve orucunu tamamlasın\" buyurdu.» <span class=\"note\">(Buhârî)<\/span>"]]}, {"reader": false, "ar": [[2518.0, "وقد أجمع العلماءُ على حرمة الوفاء بالنذر إذا كان معصيةً،"], [2524.0, "ولكنه مختلَفٌ: هل يخرج من هذا النذر بالكفّارة أو لا؟"], [2529.0, "على قولين لأهل العلم،"], [2531.0, "أصحُّهما وجوبُ الكفّارة، واختاره أبو العباس ابن تيمية رحمه الله تعالى؛"], [2537.0, "وذلك لحديث: «ولا نذرَ في معصية، وكفّارتُه كفّارةُ يمين»."], [2543.0, "وفي حديث عقبة بن عامرٍ رضي الله عنه قال:"], [2546.3, "قال النبيّ صلى الله عليه وسلم:"], [2548.0, "«كفّارةُ النذر كفّارةُ يمين» <span class=\"note\">(Müslim)<\/span>."]], "tr": [[2518.0, "Âlimler, masiyet olduğunda adağı yerine getirmenin haram olduğu üzerinde icmâ etmişlerdir."], [2522.8, "Ancak şurada ihtilaf edilmiştir: Kişi bu adaktan kefaretle mi çıkar, yoksa (kefaret) yok mu?"], [2528.5, "Ehl-i ilmin bu konuda iki görüşü vardır."], [2531.7, "Bunların en sahihi kefaretin vacip olmasıdır;"], [2534.5, "Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— de bunu tercih etmiştir."], [2540.1, "Bunun sebebi şu hadistir: «Masiyette adak yoktur; onun kefareti yemin kefaretidir.» Ukbe b."], [2544.9, "Âmir'in —Allah ondan razı olsun— hadisinde de şöyle der:"], [2547.1, "Peygamber ﷺ buyurdu: «Adağın kefareti yemin kefaretidir.» <span class=\"note\">(Müslim)<\/span>"]]}, {"reader": false, "ar": [[2553.0, "فإن قلتَ: هلّا ضربتَ لنا أمثلةً على نذر المعصية؟"], [2557.0, "فأقول: هي كثيرة؛ كمن نذر أن يقتل فلانًا،"], [2561.0, "أو نذر أن يشرب خمرًا،"], [2563.0, "أو نذر أن يعُقّ والديه،"], [2566.0, "أو نذر أن يقطع أرحامَه،"], [2568.0, "أو نذر أن يُسبل ثيابَه،"], [2570.0, "أو نذر أن يترك صلاةَ الجماعة،"], [2573.0, "أو نذر أن يشرب خمرًا،"], [2576.0, "أو نذر أن يسرق مالًا،"], [2578.0, "ونحو ذلك من المعاصي،"], [2580.7, "سواءٌ أكانت معصيةَ تركِ مأمورٍ أو فعلِ محظور."]], "tr": [[2553.0, "Eğer şöyle dersen: Bize masiyet adağına dair örnekler versene?"], [2556.2, "Derim ki: Bunlar çoktur. Falancayı öldürmeyi adayan, ya da içki içmeyi adayan, ya da anne-babasına âsî olmayı adayan, ya da akrabalık bağlarını koparmayı adayan, ya da elbisesini (kibirle) yerde sürümeyi adayan, ya da cemaatle namazı terk etmeyi adayan, ya da içki içmeyi adayan, ya da mal çalmayı adayan kimse gibi;"], [2577.2, "ve benzeri masiyetler. Bu masiyet ister emredileni terk etme masiyeti, ister yasaklananı işleme masiyeti olsun."]]}, {"reader": false, "ar": [[2587.0, "فإن قلتَ: وما الفرقانُ بين نذر الشرك ونذر المعصية؟"], [2591.0, "ما الفرقانُ بين نذر الشرك ونذر المعصية؟"], [2595.0, "فأقول: الفرقُ بينه وبين نذر المعصية أنّ النذر لغير الله عز وجل لم يُصرف لله أصالةً،"], [2603.0, "وإنما صُرف للمنذور له من أوّل أمره."], [2606.0, "وأمّا نذرُ المعصية فهو النذرُ المصروف إلى الله على أمرٍ محرَّم؛"], [2613.0, "بمعنى أنّ نذر المعصية منعقدٌ في أصله،"], [2617.7, "ولكن يحرُم الوفاءُ به، والله أعلم."]], "tr": [[2587.0, "Eğer şöyle dersen: Şirk adağı ile masiyet adağı arasındaki fark nedir?"], [2591.0, "Şirk adağı ile masiyet adağı arasındaki fark nedir?"], [2595.7, "Derim ki: Onunla masiyet adağı arasındaki fark şudur:"], [2599.8, "Allah Azze ve Celle'den başkası için adak, aslen Allah'a yöneltilmemiştir;"], [2603.4, "baştan itibaren kendisine adak adanana yöneltilmiştir."], [2605.6, "Masiyet adağı ise haram bir iş üzerine Allah'a yöneltilen adaktır."], [2611.1, "Yani masiyet adağı aslında mün'akittir (geçerli olarak kurulmuştur), ama onu yerine getirmek haramdır. Allah en iyisini bilir."]]}]}, {"ts": "43:44", "title": "7. Külliye: Sadece Allah'ın gücü yettiği bir şeyde mahluktan istiğâse büyük şirktir; 1. kısım: hazır ve güç yetiren diriden istiğâse", "paras": [{"reader": false, "ar": [[2624.0, "ومن الكلّيّات أيضًا: <b>كلُّ استغاثةٍ بمخلوقٍ فيما لا يقدر عليه إلا اللهُ فشركٌ أكبر،<\/b> كلُّ استغاثةٍ بمخلوقٍ في أمرٍ لا يقدر عليه إلا اللهُ فشركٌ أكبر. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2624.0, "Külliyelerden biri de şudur: 7."], [2625.5, "külliye: Sadece Allah'ın gücü yettiği bir şeyde bir mahluktan yapılan her istiğâse büyük şirktir; sadece Allah'ın gücü yettiği bir işte bir mahluktan yapılan her istiğâse büyük şirktir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2647.0, "أقول وبالله التوفيق: لقد قسّم أهلُ السنة والجماعة الاستغاثةَ إلى جُمَلٍ من الأقسام:"], [2659.0, "منها ما يدخل في حيّز التوحيد والعقائد،"], [2662.0, "ومنها ما لا شأنَ له بالتوحيد أصالةً."], [2665.0, "القسمُ الأوّل: الاستغاثةُ بالحيّ الحاضر القادر على الأمر المستغاث به فيه،"], [2679.0, "فإنّ ذلك جائزٌ لا بأسَ به،"], [2683.0, "ولا تُعتبر من مسائل العقائد،"], [2685.0, "ولا من
