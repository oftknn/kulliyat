 مسائل التوحيد،"], [2687.0, "وقد جاء جوازُها في الكتاب وفي السنة."]], "tr": [[2647.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat istiğâseyi birtakım kısımlara ayırmıştır:"], [2658.0, "Bir kısmı tevhid ve akaid alanına girer, bir kısmının ise aslen tevhidle bir ilgisi yoktur."], [2664.6, "Birinci kısım: Hazır olan ve hakkında istiğâse edilen işe gücü yeten diriden istiğâse."], [2679.7, "Bu caizdir, bunda bir sakınca yoktur;"], [2683.4, "akaid meselelerinden de tevhid meselelerinden de sayılmaz."], [2686.5, "Bunun caiz olduğu Kitap'ta ve Sünnet'te gelmiştir."]]}, {"reader": false, "ar": [[2692.0, "أمّا من الكتاب فقد قصّ اللهُ عز وجل علينا قصّةَ موسى عندما دخل المدينةَ على حين غفلةٍ من أهلها،"], [2700.0, "قال الله عز وجل:"], [2701.8, "<span class=\"ayah\">﴿فَوَجَدَ فِيهَا رَجُلَيْنِ يَقْتَتِلَانِ هَٰذَا مِن شِيعَتِهِ وَهَٰذَا مِنْ عَدُوِّهِ ۖ فَاسْتَغَاثَهُ الَّذِي مِن شِيعَتِهِ عَلَى الَّذِي مِنْ عَدُوِّهِ فَوَكَزَهُ مُوسَىٰ فَقَضَىٰ عَلَيْهِ ۖ قَالَ هَٰذَا مِنْ عَمَلِ الشَّيْطَانِ ۖ إِنَّهُ عَدُوٌّ مُّضِلٌّ مُّبِينٌ﴾<\/span> <span class=\"ref\">[القصص: ١٥]<\/span>."], [2720.0, "فهذا دليلٌ على أنّ الاستغاثة بالحيّ الحاضر القادر أنها على أصل الحِلّ والإباحة،"], [2729.0, "أنها على أصل الحِلّ والإباحة."]], "tr": [[2692.0, "Kitap'tan delile gelince: Allah Azze ve Celle bize Mûsâ'nın, şehrin halkının gaflet anında şehre girdiği zamanki kıssasını anlatmıştır."], [2697.5, "Allah Azze ve Celle şöyle buyurmuştur:"], [2700.0, "<span class=\"ayah\">﴿Orada dövüşen iki adam buldu; biri kendi tarafından, diğeri düşmanı tarafındandı. Kendi tarafından olan, düşmanı tarafından olana karşı ondan yardım istedi. Bunun üzerine Mûsâ ona bir yumruk vurdu ve işini bitirdi. Dedi ki: Bu şeytanın işindendir; şüphesiz o apaçık saptırıcı bir düşmandır﴾<\/span> [Kasas 15]."], [2720.0, "Bu, hazır olan ve gücü yeten diriden istiğâsenin helâllik ve mubahlık asli hükmü üzere olduğuna delildir;"], [2729.0, "helâllik ve mubahlık asli hükmü üzeredir."]]}, {"reader": false, "ar": [[2733.0, "ويدخل هذا النوعُ في عموم قول الله عز وجل:"], [2736.0, "<span class=\"ayah\">﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾<\/span> <span class=\"ref\">[المائدة: ٢]<\/span>؛"], [2739.0, "أي: ليستعن بعضُكم بعضًا،"], [2741.7, "أو ليُعِن بعضُكم بعضًا على ما كان من البرّ والتقوى."], [2748.0, "وفي الصحيح يقول النبيّ صلى الله عليه وسلم:"], [2751.0, "«من استطاع منكم أن ينفع أخاه فليفعل» <span class=\"note\">(Müslim)<\/span>."], [2755.0, "فمتى ما استغثتَ بمخلوقٍ حيٍّ حاضرٍ قادرٍ في أمرٍ يقدر على تحقيقه لك،"], [2763.0, "فهذه لا شأنَ لها بمسائل التوحيد والعقيدة."]], "tr": [[2733.0, "Bu tür, Allah Azze ve Celle'nin şu sözünün umumuna girer:"], [2735.7, "<span class=\"ayah\">﴿İyilik ve takva üzerinde yardımlaşın﴾<\/span> [Mâide 2]."], [2739.7, "Yani iyilik ve takvadan olan şeyler üzerinde birbirinizden yardım isteyin ya da birbirinize yardım edin."], [2748.0, "Sahîh'te Peygamber ﷺ şöyle buyurur:"], [2749.5, "«Sizden kim kardeşine fayda vermeye gücü yeterse bunu yapsın.» <span class=\"note\">(Müslim)<\/span> Dolayısıyla diri, hazır ve gücü yeten bir mahluktan, senin için gerçekleştirmeye gücü yettiği bir işte istiğâse ettiğin zaman, bunun tevhid ve akîde meseleleriyle bir ilgisi yoktur."]]}]}, {"ts": "46:08", "title": "7. Külliye (devam): 2. kısım: ölülerden istiğâse; İbn Teymiyye'den nakiller", "paras": [{"reader": false, "ar": [[2768.0, "القسمُ الثاني: الاستغاثةُ بالأموات؛"], [2773.0, "بأن يقف الإنسانُ على قبر ميّتٍ يستغيثه في تفريج الكُربات،"], [2779.8, "وتنفيس المُدلهِمّات، وكشف المصائب،"], [2784.5, "والمعونة على مصائب الدين والدنيا،"], [2791.0, "ويستنصره، ويرفع صوتَه، ويصرخ في ساحته عند قبره مستغيثًا به."], [2799.0, "فهذه الاستغاثةُ هي الاستغاثةُ الشركيّة بإجماع المسلمين،"], [2805.0, "فكلُّ من استغاث بميّتٍ فإنه يُعتبر مشركًا في قول عامّة أهل العلم."]], "tr": [[2768.0, "İkinci kısım: Ölülerden istiğâse. Bu, insanın bir ölünün kabrinin başında durup sıkıntıların giderilmesi, çetin işlerin hafifletilmesi, musibetlerin kaldırılması ve din ve dünya musibetlerine karşı yardım hususunda ondan istiğâse etmesi;"], [2791.0, "ondan yardım dilemesi, sesini yükseltmesi ve kabrinin yanında onun avlusunda ondan istiğâse ederek feryat etmesidir."], [2801.2, "İşte bu istiğâse, Müslümanların icmâıyla şirk olan istiğâsedir."], [2806.5, "Bir ölüden istiğâse eden herkes, ehl-i ilmin geneline göre müşrik sayılır."]]}, {"reader": false, "ar": [[2816.0, "وذلك لأنه لم يستغث به في هذا الأمر المُدلهِمّ الكبير ـ مع علمه بأنه ميّت ـ إلا لأنه يعتقد أنّ له تصرُّفًا خفيًّا في الكون،"], [2829.0, "وأنّ له قدرةً عظيمةً تجعله يحقّق له الأمرَ الذي لجأ إليه فيه."]], "tr": [[2816.0, "Çünkü o, ölü olduğunu bildiği hâlde, bu büyük ve çetin işte ondan ancak onun kâinatta gizli bir tasarrufu olduğuna ve sığındığı işi kendisi için gerçekleştirmesini sağlayacak büyük bir gücü olduğuna inandığı için istiğâse etmiştir."]]}, {"reader": false, "ar": [[2839.0, "وعلى ذلك قولُ أبي العباس ابن تيمية رحمه الله تعالى:"], [2844.0, "«والاستغاثةُ: طلبُ الغوث، وهو إزالةُ الشدّة، كالاستنصار: طلبِ النصر، والاستعانةُ <span class=\"q\">؟ 47:32<\/span>: طلبُ العون. والمخلوقُ يُطلب منه من هذه الأمور ما يقدر عليه منها، كما قال تعالى: <span class=\"ayah\">﴿وَإِنِ اسْتَنصَرُوكُمْ فِي الدِّينِ فَعَلَيْكُمُ النَّصْرُ﴾<\/span> <span class=\"ref\">[الأنفال: ٧٢]<\/span>، وكما قال تعالى: <span class=\"ayah\">﴿فَاسْتَغَاثَهُ الَّذِي مِن شِيعَتِهِ عَلَى الَّذِي مِنْ عَدُوِّهِ﴾<\/span> <span class=\"ref\">[القصص: ١٥]<\/span>، وكما قال تعالى: <span class=\"ayah\">﴿وَتَعَاوَنُوا عَلَى الْبِرِّ وَالتَّقْوَىٰ﴾<\/span> <span class=\"ref\">[المائدة: ٢]<\/span>. وأمّا ما لا يقدر عليه إلا الله فلا يُطلب إلا من الله». انتهى كلامه."]], "tr": [[2839.0, "Ebü'l-Abbâs İbn Teymiyye'nin —Allah ona rahmet etsin— şu sözü de buna göredir:"], [2843.0, "«İstiğâse, gavs (imdat) istemektir; o da sıkıntıyı gidermektir. Tıpkı istinsârın yardım (nusret) istemek olması gibi; istiâne de <span class=\"q\">؟<\/span> yardım (avn) istemektir. Mahluktan bu işlerden ancak gücünün yettiği şey istenir. Nitekim Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿Eğer din hususunda sizden yardım isterlerse, yardım etmek üzerinize borçtur﴾<\/span> [Enfâl 72]. Yine Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿Kendi tarafından olan, düşmanı tarafından olana karşı ondan yardım istedi﴾<\/span> [Kasas 15]. Yine Allah Teâlâ'nın buyurduğu gibi: <span class=\"ayah\">﴿İyilik ve takva üzerinde yardımlaşın﴾<\/span> [Mâide 2]. Sadece Allah'ın gücü yettiği şeye gelince, o ancak Allah'tan istenir.» Sözü burada bitti."]]}, {"reader": false, "ar": [[2887.0, "وقال في موضعٍ آخر:"], [2889.0, "«فأمّا ما لا يقدر عليه إلا اللهُ فلا يجوز أن يُطلب إلا من الله سبحانه، لا يُطلب ذلك لا من الملائكة ولا من الأنبياء ولا من غيرهم، ولا يجوز أن يُقال لغير الله: اغفر لي، واسقنا الغيث، وانصرنا على القوم الكافرين، أو اهدِ قلوبنا، ونحو ذلك. فأمّا ما يقدر عليه البشرُ فليس من هذا الباب». انتهى كلامه."]], "tr": [[2887.0, "Başka bir yerde de şöyle demiştir:"], [2889.7, "«Sadece Allah'ın gücü yettiği şeye gelince, onun Allah Sübhânehû'dan başkasından istenmesi caiz değildir. Bu ne meleklerden, ne peygamberlerden, ne de başkalarından istenir. Allah'tan başkasına \"Beni bağışla\", \"Bize yağmur ver\", \"Kâfirler topluluğuna karşı bize yardım et\" ya da \"Kalplerimize hidayet ver\" ve benzeri şeyler söylenmesi caiz değildir. İnsanların gücünün yettiği şeylere gelince, onlar bu babdan değildir.» Sözü burada bitti."]]}, {"reader": false, "ar": [[2919.0, "وقال رحمه الله تعالى في موضعٍ آخر:"], [2922.0, "«وقد مضت السنّةُ أنّ الحيّ يُطلب منه الدعاء، كما يُطلب منه سائرُ ما يقدر عليه، وأمّا المخلوقُ الغائب والميّت فلا يُطلب منه شيء»."], [2939.0, "وقال رحمه الله في موضعٍ آخر:"], [2941.0, "«الأمورُ التي لا يقدر عليها غيرُ الله لا تُطلب من غيره، مثل إنزال المطر، وإنبات النبات، وتفريج الكربات، والهدى من الضلالات، وغفران الذنوب؛ فإنه لا يقدر أحدٌ من جميع الخلق على ذلك، ولا يقدر عليه إلا الله»."]], "tr": [[2919.0, "Başka bir yerde de —Allah ona rahmet etsin— şöyle demiştir:"], [2923.0, "«Sünnet şu şekilde cârî olmuştur: Diriden dua istenir; tıpkı gücünün yettiği diğer şeylerin ondan istenmesi gibi. Gaib olan mahluka ve ölüye gelince, ondan hiçbir şey istenmez.» Başka bir yerde de —Allah ona rahmet etsin— şöyle demiştir:"], [2942.8, "«Allah'tan başkasının gücü yetmeyen işler O'ndan başkasından istenmez; yağmur indirmek, bitki bitirmek, sıkıntıları gidermek, sapıklıklardan hidayete erdirmek ve günahları bağışlamak gibi. Çünkü bütün yaratılmışlardan hiç kimsenin buna gücü yetmez; buna ancak Allah'ın gücü yeter.»"]]}, {"reader": false, "ar": [[2959.0, "وقال في موضعٍ آخر:"], [2961.0, "«لا يجوز لأحدٍ أن يستغيث بأحدٍ من المشايخ الغائبين ولا الميّتين، مثل أن يقول: يا سيّدي فلان، أغثني وانصرني وادفع عنّي، أو: أنا في حسبك، ونحو ذلك؛ بل كلُّ هذا من الشرك الذي حرّم اللهُ ورسولُه، وتحريمُه ممّا يُعلم بالاضطرار من دين الإسلام. وهؤلاء المستغيثون بالغائبين والميّتين عند قبورهم وغير قبورهم، لمّا كانوا من جنس عُبّاد الأوثان، صار الشيطانُ يُضلّهم ويُغويهم كما يُضلّ عُبّادَ الأصنام ويُغويهم»."], [3001.0, "انتهى كلامه رحمه الله تعالى."], [3004.8, "والنُّقولُ في هذا المعنى كثيرة."]], "tr": [[2959.0, "Başka bir yerde de şöyle demiştir:"], [2961.0, "«Hiç kimsenin gaib olan ya da ölmüş şeyhlerden herhangi birinden istiğâse etmesi caiz değildir; \"Ey efendim falan! Bana yetiş, bana yardım et, benden (belayı) uzaklaştır\" ya da \"Ben senin himayendeyim\" ve benzeri şeyler söylemesi gibi. Aksine bunların hepsi Allah'ın ve Resûlü'nün haram kıldığı şirktendir; bunun haram olduğu da İslâm dininden zarurî olarak bilinen şeylerdendir. Kabirlerinin yanında ve kabirlerinden başka yerlerde gaib olanlardan ve ölülerden istiğâse eden bu kimseler, putlara tapanların cinsinden olduklarından, şeytan putlara tapanları saptırıp azdırdığı gibi onları da saptırıp azdırır olmuştur.» Sözü burada bitti, Allah ona rahmet etsin. Bu manadaki nakiller çoktur."]]}]}, {"ts": "50:07", "title": "7. Külliye (devam): 3. kısım: gaib diriden istiğâse; âlimlerden nakiller ve dersin sonu", "paras": [{"reader": false, "ar": [[3007.0, "القسمُ الثالث: الاستغاثةُ بالحيّ الغائب؛"], [3015.0, "فهو حيٌّ ولكنه غائبٌ عنك،"], [3022.0, "ولا يسمع صوتَك، وليس بينك وبينه وسيلةٌ حسّيّةٌ توصل استغاثتَك له."], [3029.0, "وهذا النوع من الشرك الأكبر،"], [3032.0, "كالذين يستغيثون بالأولياء في بلادٍ أخرى ويرفعون أصواتهم مستغيثين بهم؛"], [3041.0, "فإنهم لم يفعلوا ذلك إلا لاعتقاد قلوبهم بأنّ المستغاث به له قدرةٌ خفيّةٌ وتصرُّفٌ خفيٌّ في هذا،"], [3052.0, "في هذا الكون. وكلُّ ذلك من الشرك الأكبر الذي لا يغفره اللهُ عز وجل لصاحبه."]], "tr": [[3007.0, "Üçüncü kısım: Gaib diriden istiğâse."], [3010.9, "O diridir ama senden uzaktadır (gaibdir);"], [3022.0, "sesini işitmez, seninle onun arasında istiğâseni ona ulaştıracak hissî bir vasıta da yoktur."], [3029.6, "Bu tür büyük şirktendir; başka memleketlerdeki velilerden istiğâse eden ve onlardan istiğâse ederek seslerini yükselten kimseler gibi."], [3042.1, "Çünkü onlar bunu ancak, kendisinden istiğâse edilenin bu kâinatta gizli bir gücü ve gizli bir tasarrufu olduğuna kalpleriyle inandıkları için yapmışlardır."], [3054.8, "Bunların hepsi, Allah Azze ve Celle'nin sahibini bağışlamayacağı büyük şirktendir."]]}, {"reader": false, "ar": [[3060.0, "قال الإمامُ البركويّ الحنفيّ رحمه الله تعالى:"], [3064.0, "«دعاءُ أصحاب القبور، والاستغاثةُ بهم، وسؤالُهم النصرَ والرزقَ والعافيةَ والولد، وقضاءَ الديون، وتفريجَ الكُربات، وإغاثةَ اللَّهَفات، وغيرَ ذلك من الحاجات التي كان عُبّادُ الأوثان يسألونها من أوثانهم؛ فليس شيءٌ من ذلك مشروعًا باتّفاق أئمّة المسلمين، إذ لم يفعله رسولُ الله صلى الله عليه وسلم، ولا أحدٌ من الصحابة والتابعين وسائر أئمّة الدين»."]], "tr": [[3060.0, "İmam Birgivî el-Hanefî —Allah ona rahmet etsin— şöyle demiştir:"], [3064.9, "«Kabir sahiplerine dua etmek, onlardan istiğâse etmek, onlardan yardım, rızık, afiyet ve evlat istemek, borçların ödenmesini, sıkıntıların giderilmesini, dertlilere yetişilmesini ve putlara tapanların putlarından istedikleri diğer ihtiyaçları istemek; bunların hiçbiri Müslümanların imamlarının ittifakıyla meşru değildir. Çünkü bunu ne Resûlullah ﷺ, ne sahabe ve tâbiînden herhangi biri, ne de diğer din imamları yapmıştır.»"]]}, {"reader": false, "ar": [[3092.0, "وقال الشيخ سليمانُ بن عبد الله رحمه الله تعالى في قول الله عز وجل:"], [3099.0, "<span class=\"ayah\">﴿وَمَن يَدْعُ مَعَ اللَّهِ إِلَٰهًا آخَرَ لَا بُرْهَانَ لَهُ بِهِ فَإِنَّمَا حِسَابُهُ عِندَ رَبِّهِ ۚ إِنَّهُ لَا يُفْلِحُ الْكَافِرُونَ﴾<\/span> <span class=\"ref\">[المؤمنون: ١١٧]<\/span>،"], [3106.0, "قال: «والآيةُ نصٌّ في أنّ دعاء غير الله والاستغاثةَ به شركٌ أكبر»."]], "tr": [[3092.0, "Şeyh Süleyman b. Abdullah —Allah ona rahmet etsin— Allah Azze ve Celle'nin şu sözü hakkında:"], [3097.2, "<span class=\"ayah\">﴿Kim, hakkında hiçbir delili olmadığı hâlde Allah ile birlikte başka bir ilâha dua ederse, onun hesabı ancak Rabbinin katındadır. Şüphesiz kâfirler kurtuluşa eremez﴾<\/span> [Mü'minûn 117], şöyle demiştir:"], [3105.6, "«Ayet, Allah'tan başkasına dua etmenin ve ondan istiğâse etmenin büyük şirk olduğuna dair açık bir nastır.»"]]}, {"reader": false, "ar": [[3112.0, "وقال الإمامُ المعصوميّ الخُجَنديّ الحنفيّ رحمه الله تعالى:"], [3117.0, "«من قال: لا إله إلا الله، وهو مع ذلك يفعل الشركَ الأكبر ـ كدعاء الموتى والغائبين، وسؤالهم قضاءَ الحاجات وتفريجَ الكربات، والتقرُّب إليهم بالنذر والذبائح ـ فهذا مشركٌ شاء أم أبى»."], [3134.0, "وقال أيضًا: «من الشرك أن يستغيث بغير الله أو يدعو غيرَه، والاستغاثةُ هي طلبُ الغوث، فكلُّ ما قُصد به غيرُ الله ممّا لا يقدر عليه إلا الله ـ كدعوات الأموات والغائبين ـ فهو من الشرك الذي لا يغفره الله عز وجل»."]], "tr": [[3112.0, "İmam Ma'sûmî el-Hucendî el-Hanefî —Allah ona rahmet etsin— şöyle demiştir:"], [3117.0, "«Kim \"Lâ ilâhe illallah\" der, bununla birlikte büyük şirki işlerse —ölülere ve gaib olanlara dua etmek, onlardan ihtiyaçların karşılanmasını ve sıkıntıların giderilmesini istemek, adak ve kurbanlarla onlara yaklaşmak gibi— bu kişi, istese de istemese de müşriktir.» Şöyle de demiştir:"], [3135.8, "«Allah'tan başkasından istiğâse etmek ya da O'ndan başkasına dua etmek şirktendir. İstiğâse, gavs (imdat) istemektir. Sadece Allah'ın gücü yettiği şeylerde Allah'tan başkasına yönelinen her şey —ölülere ve gaib olanlara yapılan dualar gibi— Allah Azze ve Celle'nin bağışlamayacağı şirktendir.»"]]}, {"reader": false, "ar": [[3155.0, "وقال الشيخ محمدُ بن إبراهيم رحمه الله تعالى:"], [3158.0, "«الاستغاثةُ الشركيّة التي أنكرناها هي الاستغاثةُ بالغائب، أو الميّت، أو الحيّ الحاضر الذي لا يقدر، وأمّا الجائزةُ فهي طلبُ الحيّ الحاضر»."], [3173.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[3155.0, "Şeyh Muhammed b. İbrâhîm —Allah ona rahmet etsin— şöyle demiştir:"], [3158.0, "«Karşı çıktığımız şirk olan istiğâse; gaib olandan, ölüden ya da gücü yetmeyen hazır diriden istiğâsedir. Caiz olana gelince, o hazır diriden istemektir.» Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[3176.0, "وجاء في «فتاوى اللجنة الدائمة» في المملكة ـ ونختم بها ـ قولُهم رحمهم الله تعالى:"], [3183.0, "«إنّ الاستغاثة بالأموات ودعاءَهم من دون الله أو مع الله شركٌ أكبرُ يُخرج من ملّة الإسلام، سواءٌ كان المستغاث به نبيًّا وغيرَ نبيّ»."], [3196.0, "وجاء فيها أيضًا: «الاستغاثةُ بالأموات أو الغائبين شركٌ أكبرُ يُخرج من فعل ذلك من ملّة الإسلام»."], [3207.0, "ولعلّنا نكتفي بهذا القدر،"], [3210.0, "والله أعلى وأعلم، وصلى الله وسلم على نبيّنا محمد."]], "tr": [[3176.0, "(Suudi) Krallıktaki «Fetâva'l-Lecneti'd-Dâime»de —bununla bitirelim— onların —Allah onlara rahmet etsin— şu sözü geçer:"], [3180.8, "«Allah'ı bırakarak ya da Allah ile birlikte ölülerden istiğâse etmek ve onlara dua etmek, İslâm dininden çıkaran büyük şirktir; kendisinden istiğâse edilen ister peygamber olsun ister peygamber olmayan biri.» Yine orada şöyle geçer:"], [3197.1, "«Ölülerden ya da gaib olanlardan istiğâse etmek, bunu yapanı İslâm dininden çıkaran büyük şirktir.» Bu kadarıyla yetinelim."], [3207.0, "Allah en yüce olandır ve en iyi bilendir."], [3211.2, "Allah Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;

const doc=document.getElementById("doc"),AR=[],TR=[];

  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);

    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
