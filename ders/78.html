<script>
const D={"no": 78, "vid": "gzxf6KgFkeQ", "title_ar": "الدرس (٧٨) من شرح كليات العقيدة — كليات في معاني التأويل، والفرق بين التحريف والتعطيل، وذمّ علم الكلام، والإجماع المعتبر في العقيدة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 78. Ders: Te'vilin Anlamları, Tahrif ile Ta'til Arasındaki Fark, Kelâm İlminin Yerilmesi ve Akîdede Muteber İcmâ", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Selefin yerdiği her te'vilden maksat, lafzı karinesiz olarak zahirinden çevirmektir", "paras": [{"reader": false, "ar": [[0.0, "بسم الله الرحمن الرحيم."], [1.8, "الحمدُ لله ربِّ العالمين،"], [3.6, "والصلاةُ والسلامُ على رسول الله الأمين،"], [6.2, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.4, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [11.1, "أمّا بعد: عندنا في هذا الدرس جُمَلٌ من الكلّيّات في باب الأسماء والصفات."], [19.0, "الكلّيّة الأولى: <b>كلُّ تأويلٍ ذمَّه السلف فالمرادُ به صرفُ اللفظ عن ظاهرِه بلا قرينة.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ تأويلٍ ذمَّه السلفُ فالمرادُ به صرفُ اللفظِ عن ظاهرِه بلا قرينة.<\/b>"]], "tr": [[0.0, "Rahmân ve Rahîm olan Allah'ın adıyla."], [1.8, "Âlemlerin Rabbi Allah'a hamd olsun."], [3.6, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.0, "Bundan sonra: Bu derste isim ve sıfatlar babında birtakım külliyeler var."], [19.0, "1. külliye: Selefin yerdiği her te'vilden maksat, lafzı karinesiz olarak zahirinden çevirmektir. (Tekrar ediyor.) 1."], [22.8, "külliye: Selefin yerdiği her te'vilden maksat, lafzı karinesiz olarak zahirinden çevirmektir."]]}, {"reader": false, "ar": [[38.0, "أقولُ وبالله التوفيق: اعلم رحمك الله تعالى أنّ التأويلَ له ثلاثُ معانٍ،"], [45.9, "وهذه الكلّيّةُ في واحدةٍ من معانيه،"], [56.0, "وما سيأتينا من الكلّيّات الآتية ـ إن شاء الله ـ اللاحقة تتكلّمُ عن التأويل بالمعاني الأخرى."], [63.0, "وقد ثبت عن السلف رحمهم الله تعالى أنّهم ذمّوا التأويلَ كثيرًا،"], [69.0, "بل وتواتر عن السلف ذمُّ التأويل."], [72.0, "فمتى ما رأيتَ سلفيًّا يذمُّ شيئًا من التأويل فاعرف أنّه يريد هذا التأويلَ بهذا المعنى فقط."], [80.0, "وهذا التأويل لم يكن معروفًا في عهد السلف أبدًا،"], [85.0, "وإنما أوّلُ من أحدثه الجهميّةُ والمعتزلة، وورثوه عن الفلاسفة."]], "tr": [[38.0, "Tevfik Allah'tandır, derim ki: Bil ki —Allah Teâlâ sana rahmet etsin— te'vilin üç anlamı vardır;"], [40.0, "bu külliye onun anlamlarından biri hakkındadır."], [46.5, "Allah'ın izniyle önümüze gelecek sonraki külliyeler ise te'vilden diğer anlamlarıyla bahsedecektir."], [63.0, "Selefin —Allah Teâlâ onlara rahmet etsin— te'vili çokça yerdikleri sabittir;"], [68.5, "hatta selefin te'vili yerdiği tevâtür derecesinde nakledilmiştir."], [72.0, "Ne zaman bir selefînin te'vilden bir şeyi yerdiğini görürsen, bil ki o, yalnızca bu anlamdaki bu te'vili kastetmektedir."], [80.0, "Bu te'vil selef döneminde asla bilinmiyordu;"], [83.3, "onu ilk ortaya çıkaranlar Cehmiyye ve Mu'tezile'dir, onu da filozoflardan miras aldılar."]]}, {"reader": false, "ar": [[91.0, "وهو مخالفٌ لقاعدتين سُنّيّتين سلفيّتين:"], [98.0, "القاعدة الأولى: وجوبُ إبقاء اللفظ على ظاهره."], [102.0, "القاعدة الثانية: وجوبُ بقاء اللفظ على حقيقته."], [106.0, "فيأتي هذا التأويلُ المذكور في هذه القاعدة وينسفُ هذه القواعدَ السُّنّيّة كلَّها."], [114.0, "وقد أجمع عامّةُ أهل البدع على هذا التأويل؛"], [120.0, "فكلُّ أهل البدع بلا استثناء يأتون إلى نصوص الوحي ولا يُبقونها على ظاهرها ولا على حقيقتها،"], [129.0, "وإنما ينقلونه إلى معنًى آخرَ بلا دليلٍ يقتضي هذا النقل."]], "tr": [[91.0, "Bu (te'vil), sünnî ve selefî iki kaideye aykırıdır."], [98.0, "Birinci kaide: Lafzı zahiri üzere bırakmanın vâcib oluşu."], [102.0, "İkinci kaide: Lafzın hakikati üzere kalmasının vâcib oluşu."], [106.0, "İşte bu kaidede zikredilen te'vil gelir ve bu sünnî kaidelerin hepsini yıkıp atar."], [114.0, "Bid'at ehlinin geneli bu te'vil üzerinde icmâ etmiştir."], [120.0, "İstisnasız bütün bid'at ehli vahyin naslarına gelir, onları ne zahirleri ne de hakikatleri üzere bırakır;"], [127.9, "aksine bu nakli gerektiren hiçbir delil olmaksızın onu başka bir anlama naklederler."]]}, {"reader": false, "ar": [[136.0, "فمتى ما رأيتَ السلفَ يذمّون التأويلَ فإنما يريدون به ذمَّ ذلك النوع من التأويل،"], [142.0, "وهو التأويل الذي يعتمده الجهميّةُ والمعتزلةُ والأشاعرةُ والكُلّابيّةُ والكرّاميّةُ وغيرُهم من طوائف أهل البدع."], [153.0, "وسأنقل لكم جُمَلًا من كلام أهل العلم في ذمّ هذا التأويل،"], [158.0, "حتى يتبيّن لكم صدقُ هذه الكلّيّة بإذن الله عز وجل."]], "tr": [[136.0, "Ne zaman selefin te'vili yerdiğini görürsen, bununla ancak o tür te'vili yermeyi kastederler."], [141.6, "O da Cehmiyye'nin, Mu'tezile'nin, Eş'arîlerin, Küllâbiyye'nin, Kerrâmiyye'nin ve bid'at ehlinin diğer fırkalarının dayandığı te'vildir."], [153.0, "Allah Azze ve Celle'nin izniyle bu külliyenin doğruluğu size açıkça görünsün diye, bu te'vilin yerilmesi hakkında ilim ehlinin sözlerinden birtakım nakiller aktaracağım."]]}, {"reader": false, "ar": [[162.0, "قال الإمام أبو الحسين البغويّ رحمه الله تعالى ـ بعد أن ذكر طرفًا من نصوص الصفات ـ قال:"], [169.4, "«وعلى هذا مضى سلفُ الأمّة وعلماءُ السنّة؛ تلقَّوها جميعًا بالقبول والتسليم، وتجنّبوا فيها عن التمثيل والتأويل، ووكلوا العلمَ فيها إلى الله عز وجل»."], [182.0, "وبما أنّ هذا النقلَ عن إمامٍ سلفيّ،"], [186.1, "فالمرادُ بذمّ التأويل في كلامه:"], [189.0, "صرفُ الكلام عن ظاهره بلا قرينة."]], "tr": [[162.0, "İmam Ebü'l-Hüseyin el-Beğavî —Allah Teâlâ ona rahmet etsin— sıfat naslarından bir kısmını zikrettikten sonra şöyle dedi:"], [166.7, "\"Ümmetin selefi ve sünnet âlimleri bu yol üzere geçtiler;"], [169.4, "onların hepsini kabul ve teslimiyetle karşıladılar, onlarda temsilden ve te'vilden kaçındılar ve onlar hakkındaki ilmi Allah Azze ve Celle'ye havale ettiler.\" Bu nakil selefî bir imamdan olduğuna göre, onun sözündeki te'vilin yerilmesinden maksat, sözü karinesiz olarak zahirinden çevirmektir."]]}, {"reader": false, "ar": [[192.0, "ويقول الإمام أبو يعلى الفرّاء رحمه الله تعالى:"], [196.0, "«إنّ الصحابة ومن بعدهم من التابعين حملوها ـ أي نصوصَ الصفات ـ على ظاهرها، ولم يتعرّضوا لتأويلها»."], [205.0, "والمقصود بهذا التأويل: صرفُ اللفظ عن ظاهره بلا قرينة."]], "tr": [[192.0, "İmam Ebû Ya'lâ el-Ferrâ —Allah Teâlâ ona rahmet etsin— şöyle der:"], [196.0, "\"Sahâbe ve onlardan sonra gelen tâbiîn onları —yani sıfat naslarını— zahirleri üzere anladılar ve onları te'vile kalkışmadılar.\" Bu te'vilden maksat, lafzı karinesiz olarak zahirinden çevirmektir."]]}, {"reader": false, "ar": [[209.0, "ويقول حافظُ المغرب أبو عمر ابن عبد البرّ رحمه الله تعالى:"], [215.0, "«أهلُ السنّة مُجمِعون على الإقرار بالصفات الواردة كلِّها في القرآن والسنّة، والإيمانِ بها، وحملِها على الحقيقة لا على المجاز، إلّا أنّهم لا يُكيّفون شيئًا من ذلك، ولا يَحُدّون فيه صفةً محصورة. وأمّا أهلُ البدع والجهميّةُ والمعتزلةُ والخوارج فكلُّهم يُنكرها، ولا يحمل شيئًا منها على الحقيقة، ويزعمون أنّ من أقرّ بها مشبِّه، وهم عند من أثبتها نافون للمعبود. والحقُّ فيما قاله القائلون بلا تأويل»."], [248.0, "والمرادُ بنفي التأويل هنا:"], [250.0, "صرفُ اللفظ عن ظاهره."]], "tr": [[209.0, "Mağrib'in hâfızı Ebû Ömer İbn Abdilber —Allah Teâlâ ona rahmet etsin— şöyle der:"], [215.0, "\"Ehl-i Sünnet, Kur'an'da ve Sünnet'te varid olan sıfatların hepsini ikrar etmek, onlara iman etmek ve onları mecaz üzere değil hakikat üzere anlamak hususunda icmâ etmiştir."], [227.6, "Ancak onlar bunlardan hiçbirine keyfiyet biçmezler ve onda sınırlı bir vasıf tayin etmezler."], [237.0, "Bid'at ehli, Cehmiyye, Mu'tezile ve Hâricîler ise hepsi onları inkâr eder ve onlardan hiçbirini hakikat üzere anlamaz;"], [248.0, "onları ikrar edenin müşebbih olduğunu iddia ederler."], [250.0, "Onlar ise (sıfatları) isbat edenlere göre (aslında) mabudu nefyedenlerdir."], [250.5, "Hak, te'vilsiz olarak söyleyenlerin söylediğindedir.\" Burada te'vilin nefyinden maksat, lafzı zahirinden çevirmektir."]]}, {"reader": false, "ar": [[252.0, "وقال الإمام ابن القيّم رحمه الله تعالى:"], [256.0, "«بل كلُّهم على إثبات ما نطق به الكتابُ والسنّة، كلمةً واحدةً من أوّلهم إلى آخرهم» ـ ويقصد بذلك الصحابة ـ «لم يَسوموها تأويلًا، ولم يُحرّفوها عن مواضعها تبديلًا، ولم يُبدوا لشيءٍ منها إبطالًا، ولا ضربوا لها أمثالًا»."], [276.0, "انتهى كلامه. ويقول الإمام ابن القيّم أيضًا:"], [280.4, "«ولم يتنازعوا» ـ يعني الصحابةَ رضي الله تعالى عنهم ـ «في تأويل آيات الصفات وأخبارها في موضعٍ واحد»."], [291.0, "يعني: لا يُحفظ عن أصحاب النبيّ ﷺ في موضعٍ واحد أنّهم نقلوا شيئًا من نصوص الصفات عن ظاهرها إلى معنًى آخر."]], "tr": [[252.0, "İmam İbnü'l-Kayyim —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [256.0, "\"Bilakis hepsi, Kitap ve Sünnet'in söylediğini isbat etme üzerindedir;"], [259.1, "ilkinden sonuncusuna kadar tek bir söz (hâlinde)\" —bununla sahâbeyi kastediyor— \"Onlara te'vil yüklemediler, onları yerlerinden değiştirerek tahrif etmediler, onlardan hiçbir şeyi iptal etmeye kalkışmadılar ve onlara misaller getirmediler.\" Sözü burada bitti."], [276.0, "İmam İbnü'l-Kayyim ayrıca şöyle der:"], [280.4, "\"Onlar\" —yani sahâbe, Allah Teâlâ onlardan razı olsun— \"sıfat âyetlerinin ve haberlerinin te'vili hususunda tek bir yerde bile çekişmediler.\" Yani Peygamber ﷺ'in ashâbından, tek bir yerde bile sıfat naslarından bir şeyi zahirinden başka bir anlama naklettikleri muhafaza edilmemiştir (nakledilmemiştir)."]]}]}, {"ts": "05:02", "title": "1. Külliyenin özeti · 2. Külliye: Delillerdeki her te'vil, şeyin hakikati veya tefsiri anlamındadır", "paras": [{"reader": false, "ar": [[302.0, "والكلامُ في ذلك طويلٌ ولله الحمد."], [305.0, "والخلاصةُ من هذه الكلّيّة:"], [307.5, "أنّ كلَّ تأويلٍ ذمّه سلفُ الأمّة وأئمّتُها فإنّ المراد به نقلُ اللفظ عن ظاهره بلا قرينة؛"], [317.0, "كالذين يُحرّفون الاستواءَ إلى الاستيلاء،"], [320.6, "فهذا تأويلٌ مذموم، ويُحرّفون النزولَ إلى نزول الملائكة أو نزول الأمر والرحمة،"], [327.5, "فهذا تأويلٌ مذموم، ويُحرّفون الرحمةَ إلى إرادة الثواب،"], [331.9, "والغضبَ إلى إرادة الانتقام،"], [334.1, "إلى غير ذلك من الأمثلة في تأويلات أهل البدع. والله أعلم."]], "tr": [[302.0, "Bu konudaki söz uzundur, hamd Allah'a mahsustur."], [305.0, "Bu külliyenin özeti şudur: Ümmetin selefinin ve imamlarının yerdiği her te'vilden maksat, lafzı karinesiz olarak zahirinden nakletmektir."], [313.7, "İstivâyı istîlâya (ele geçirmeye) tahrif edenler gibi;"], [317.0, "bu yerilmiş bir te'vildir. Nüzulü meleklerin inmesine veya emrin ve rahmetin inmesine tahrif ederler;"], [326.0, "bu yerilmiş bir te'vildir. Rahmeti sevap verme iradesine, gazabı intikam alma iradesine tahrif ederler;"], [333.6, "bid'at ehlinin te'villerindeki diğer örnekler de böyledir. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[341.0, "الكلّيّة الثانية: <b>كلُّ تأويلٍ في الأدلّة فهو بمعنى حقيقة الشيء أو تفسيره.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ تأويلٍ في الأدلّة فهو بمعنى حقيقة الشيء أو تفسيره.<\/b>"]], "tr": [[341.0, "2. külliye: Delillerdeki her te'vil, şeyin hakikati veya tefsiri anlamındadır. (Tekrar ediyor.) 2."], [355.0, "külliye: Delillerdeki her te'vil, şeyin hakikati veya tefsiri anlamındadır."]]}, {"reader": false, "ar": [[366.0, "أقول وبالله التوفيق: وهذا هو المعنى الثاني من معاني التأويل،"], [374.0, "وهو التأويل الذي أطبقت كلمةُ أهل السنّة والجماعة على قبوله،"], [379.0, "وهو التأويل بمعنى حقيقة الشيء،"], [382.5, "أو التأويل بمعنى تفسير الشيء."], [386.0, "فبان لك بذلك أنّ التأويل ينقسم إلى ثلاثة أقسام:"], [389.0, "نحن نقبل قسمين ونرفض قسمًا؛"], [394.0, "فنحن نقبل التأويل بمعنى حقيقة الشيء،"], [397.0, "ونقبل التأويل بمعنى التفسير،"], [399.0, "ولكن لا نقبل التأويل بمعنى صرف الكلام عن ظاهره بلا قرينة."]], "tr": [[366.0, "Tevfik Allah'tandır, derim ki: Bu, te'vilin anlamlarından ikinci anlamdır."], [368.2, "Ehl-i Sünnet ve'l-Cemaat'in sözünün kabulünde birleştiği te'vil budur;"], [374.0, "o da şeyin hakikati anlamındaki te'vil veya şeyin tefsiri anlamındaki te'vildir."], [379.7, "Böylece sana açıkça göründü ki te'vil üç kısma ayrılır:"], [386.0, "Biz iki kısmı kabul eder, bir kısmı reddederiz."], [389.0, "Şeyin hakikati anlamındaki te'vili kabul ederiz, tefsir anlamındaki te'vili kabul ederiz;"], [398.0, "fakat sözü karinesiz olarak zahirinden çevirmek anlamındaki te'vili kabul etmeyiz."]]}, {"reader": false, "ar": [[404.0, "وكلُّ لفظة «تأويل» تأتيك في الكتاب والسنّة فهي إمّا بمعنى حقيقة الشيء أو تفسير الشيء."], [414.0, "بل إنّ السلف رحمهم الله تعالى عند ألفاظ التأويل الواردة في القرآن غالبًا ما يُفسّرونها بهذين التفسيرين؛"], [422.0, "فبعضهم يقول: هذا حقيقة الشيء،"], [425.0, "وبعضهم يقول: هذا تفسير الشيء."], [428.0, "كقول الله عز وجل:"], [429.0, "<span class=\"ayah\">﴿وَكَذَٰلِكَ يَجْتَبِيكَ رَبُّكَ وَيُعَلِّمُكَ مِن تَأْوِيلِ الْأَحَادِيثِ﴾<\/span> [يوسف: 6]،"], [434.0, "أي: حقيقتها أو تفسيرها."], [436.0, "وقولِ الله عز وجل:"], [438.9, "<span class=\"ayah\">﴿وَلِنُعَلِّمَهُ مِن تَأْوِيلِ الْأَحَادِيثِ﴾<\/span> [يوسف: 21]،"], [444.0, "أي: ولِنُعلّمَه ليعرف حقيقتها أو ليعرف تفسيرها."]], "tr": [[404.0, "Kitap ve Sünnet'te karşına çıkan her \"te'vil\" lafzı ya şeyin hakikati ya da şeyin tefsiri anlamındadır."], [414.0, "Hatta selef —Allah Teâlâ onlara rahmet etsin— Kur'an'da geçen te'vil lafızlarını çoğunlukla bu iki tefsirle açıklarlar."], [417.3, "Kimisi \"Bu, şeyin hakikatidir\" der, kimisi \"Bu, şeyin tefsiridir\" der."], [422.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [426.2, "<span class=\"ayah\">﴿İşte böylece Rabbin seni seçecek ve sana olayların (rüyaların) te'vilini öğretecek.﴾<\/span> [Yûsuf 6] Yani onların hakikatini veya tefsirini."], [434.5, "Ve Allah Azze ve Celle'nin şu sözü:"], [436.0, "<span class=\"ayah\">﴿Ve ona olayların (rüyaların) te'vilini öğretelim diye.﴾<\/span> [Yûsuf 21] Yani onların hakikatini bilsin veya tefsirini bilsin diye ona öğretelim."]]}, {"reader": false, "ar": [[450.0, "ولذلك لمّا وقعت رؤيا يوسف قال:"], [453.2, "<span class=\"ayah\">﴿يَا أَبَتِ هَٰذَا تَأْوِيلُ رُؤْيَايَ﴾<\/span> [يوسف: 100]،"], [455.8, "أي: حقيقةُ ما رأيتُه،"], [457.9, "أو تفسيرُ ما رأيتُه."], [460.0, "وكذلك أيضًا قال الله عز وجل:"], [463.7, "<span class=\"ayah\">﴿رَبِّ قَدْ آتَيْتَنِي مِنَ الْمُلْكِ وَعَلَّمْتَنِي مِن تَأْوِيلِ الْأَحَادِيثِ﴾<\/span> [يوسف: 101] <span class=\"note\">(Şeyh «قال ربّي» diye okuyor)<\/span>،"], [469.0, "أي: بصّرتني في حقيقتها أو تفسيرها."]], "tr": [[450.0, "Bu yüzden Yûsuf'un rüyası gerçekleşince şöyle dedi:"], [453.2, "<span class=\"ayah\">﴿Babacığım! İşte bu, rüyamın te'vilidir.﴾<\/span> [Yûsuf 100] Yani gördüğüm şeyin hakikati veya gördüğüm şeyin tefsiri."], [457.4, "Yine Allah Azze ve Celle şöyle buyurdu:"], [460.0, "<span class=\"ayah\">﴿Rabbim! Bana mülkten (bir pay) verdin ve bana olayların (rüyaların) te'vilini öğrettin.﴾<\/span> [Yûsuf 101] <span class=\"note\">(Şeyh «Rabbî» diye okuyor.)<\/span> Yani beni onların hakikati veya tefsiri hususunda basiret sahibi kıldın."]]}, {"reader": false, "ar": [[472.0, "وكذلك قولُ الله عز وجل عن موسى والخضر،"], [478.0, "لمّا بيّن له شيئًا ممّا استنكره،"], [480.0, "قال: <span class=\"ayah\">﴿ذَٰلِكَ تَأْوِيلُ مَا لَمْ تَسْطِع عَّلَيْهِ صَبْرًا﴾<\/span> [الكهف: 82] <span class=\"note\">(Şeyh «تستطع» diye okuyor)<\/span>،"], [485.0, "أي: ذلك حقيقةُ، أو ذلك تفسيرُ (ما لم تستطع عليه صبرًا)."], [489.0, "وكذلك قولُ الله عز وجل عن يوم القيامة،"], [495.0, "قال: <span class=\"ayah\">﴿هَلْ يَنظُرُونَ إِلَّا تَأْوِيلَهُ﴾<\/span> [الأعراف: 53]،"], [498.0, "أي: هل ينظرون إلا حقيقتَه،"], [500.0, "<span class=\"ayah\">﴿يَوْمَ يَأْتِي تَأْوِيلُهُ﴾<\/span> [الأعراف: 53]، أي:"], [503.0, "يومَ يأتي حقيقتُه. فإذًا كلُّ تأويلٍ في القرآن حيثما تصرّف فإنما المرادُ به حقيقةُ الشيء أو تفسيرُه."]], "tr": [[472.0, "Yine Allah Azze ve Celle'nin Mûsâ ve Hızır hakkındaki sözü:"], [477.1, "(Hızır) ona yadırgadığı şeylerden bir kısmını açıklayınca şöyle dedi:"], [480.6, "<span class=\"ayah\">﴿İşte bu, sabredemediğin şeylerin te'vilidir.﴾<\/span> [Kehf 82] <span class=\"note\">(Şeyh «testati'» diye okuyor.)<\/span> Yani bu, (sabredemediğin şeyin) hakikatidir veya tefsiridir."], [489.0, "Yine Allah Azze ve Celle'nin kıyamet günü hakkındaki sözü:"], [492.6, "<span class=\"ayah\">﴿Onlar ancak onun te'vilini bekliyorlar.﴾<\/span> [A'râf 53] Yani onlar ancak onun hakikatini bekliyorlar."], [498.4, "<span class=\"ayah\">﴿Onun te'vili geldiği gün…﴾<\/span> [A'râf 53] Yani onun hakikati geldiği gün."], [506.0, "Demek ki Kur'an'daki her te'vil, nasıl türetilmiş olursa olsun, ondan maksat ancak şeyin hakikati veya tefsiridir."]]}, {"reader": false, "ar": [[512.0, "وكذلك قولُ الله عز وجل:"], [515.0, "<span class=\"ayah\">﴿بَلْ كَذَّبُوا بِمَا لَمْ يُحِيطُوا بِعِلْمِهِ وَلَمَّا يَأْتِهِمْ تَأْوِيلُهُ﴾<\/span> [يونس: 39]،"], [518.9, "أي: حقيقتُه أو تفسيرُه على أرض الواقع."], [522.0, "وكذلك أيضًا قولُ الفتيين مع يوسف عليه الصلاة والسلام في السجن،"], [531.0, "لمّا ذكروا له الرؤيا قالوا:"], [534.5, "<span class=\"ayah\">﴿نَبِّئْنَا بِتَأْوِيلِهِ﴾<\/span> [يوسف: 36]، أي: بحقيقته أو بتفسيره."], [542.0, "وكذلك قولُ الله عز وجل عن جلساء الملك:"], [546.0, "<span class=\"ayah\">﴿قَالُوا أَضْغَاثُ أَحْلَامٍ ۖ وَمَا نَحْنُ بِتَأْوِيلِ الْأَحْلَامِ بِعَالِمِينَ﴾<\/span> [يوسف: 44]،"], [550.3, "أي: بتفسيرها أو معرفة حقيقتها."], [553.0, "والأدلّة في ذلك كثيرة."]], "tr": [[512.0, "Yine Allah Azze ve Celle'nin şu sözü:"], [515.0, "<span class=\"ayah\">﴿Bilakis, ilmini kuşatamadıkları ve te'vili henüz kendilerine gelmemiş olan şeyi yalanladılar.﴾<\/span> [Yûnus 39] Yani onun hakikati veya vakıa zemininde tefsiri."], [522.0, "Yine zindanda Yûsuf —aleyhissalâtü vesselâm— ile birlikte olan iki gencin sözü:"], [531.0, "Ona rüyayı anlattıklarında şöyle dediler:"], [534.5, "<span class=\"ayah\">﴿Bize bunun te'vilini haber ver.﴾<\/span> [Yûsuf 36] Yani hakikatini veya tefsirini."], [542.0, "Yine Allah Azze ve Celle'nin kralın meclisindekiler hakkındaki sözü:"], [546.0, "<span class=\"ayah\">﴿Dediler ki: Karmakarışık rüyalar! Biz rüyaların te'vilini bilenler değiliz.﴾<\/span> [Yûsuf 44] Yani onların tefsirini veya hakikatini bilmeyi. Bu konudaki deliller çoktur."]]}, {"reader": false, "ar": [[556.0, "وهذا التأويل بهذين المعنيين يقبله السلفُ الصالح."], [560.0, "ولذلك تجد أنّ الإمام ابن جرير الطبريّ رحمه الله في تفسيره دائمًا يقول:"], [565.0, "«القول في تأويل قول الله عز وجل كذا وكذا»،"], [571.0, "والمقصود بذلك: أي بيانُ حقيقة قول الله،"], [575.2, "أو بيانُ التفسير. ولذلك يقول العلماء رحمهم الله:"], [581.0, "إنّ وقوعَ الرؤيا هو تأويلُها،"], [586.0, "ووقوعَ الأمر ـ يعني وقوعَ الفعل الذي أُمرتَ به ـ هو تأويلُ الأمر،"], [593.0, "وتركَك للنهي هو تأويلُ النهي."]], "tr": [[556.0, "Bu iki anlamdaki bu te'vili selef-i sâlihîn kabul eder."], [560.0, "Bu yüzden İmam İbn Cerîr et-Taberî'nin —Allah ona rahmet etsin— tefsirinde daima \"Allah Azze ve Celle'nin şu şu sözünün te'vili hakkında söz\" dediğini görürsün."], [572.2, "Bununla kastedilen, Allah'ın sözünün hakikatini açıklamak veya tefsiri açıklamaktır."], [577.0, "Bu yüzden âlimler —Allah onlara rahmet etsin— şöyle der:"], [581.0, "Rüyanın gerçekleşmesi onun te'vilidir; emrin gerçekleşmesi —yani sana emredilen fiilin gerçekleşmesi— emrin te'vilidir;"], [591.7, "yasağı terk etmen de yasağın te'vilidir."]]}, {"reader": false, "ar": [[597.0, "كما في الصحيحين من حديث عائشة رضي الله عنها ـ استمعوا ـ قالت:"], [600.3, "«كان النبيُّ ﷺ يُكثر أن يقول في ركوعه وسجوده: سبحانك اللهمّ وبحمدك، اللهمّ اغفر لي، يتأوّل القرآن» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [609.0, "أي: يُطبّق حقيقةَ ما أُمر به في القرآن."], [613.0, "فإذًا تأويلُ الرؤيا وقوعُها،"], [617.0, "وتأويلُ الأمر تنفيذُه، وتأويلُ النهي اجتنابُه."], [622.0, "طيّب، وتأويلُ الخبر؟ تصديقُه ووقوعُه، تصديقُه ووقوعُه."]], "tr": [[597.0, "Nitekim Sahîhayn'de Âişe'nin —Allah ondan razı olsun— hadisinde —dinleyin— şöyle dedi:"], [598.8, "«Peygamber ﷺ rükûunda ve secdesinde çokça \"Seni hamdinle tesbih ederim Allah'ım, Allah'ım beni bağışla\" derdi; Kur'an'ı te'vil ediyordu (uyguluyordu).» <span class=\"note\">(Buhârî, Müslim)<\/span> Yani Kur'an'da kendisine emredilenin hakikatini uyguluyordu."], [609.5, "Demek ki rüyanın te'vili onun gerçekleşmesi, emrin te'vili onun yerine getirilmesi, yasağın te'vili ondan kaçınılmasıdır."], [615.5, "Peki, haberin te'vili? Onu tasdik etmek ve onun gerçekleşmesi;"], [622.0, "onu tasdik etmek ve onun gerçekleşmesi."]]}, {"reader": false, "ar": [[627.0, "ولا بدّ من التفريق بين هذه الأنواع الثلاثة من التأويل،"], [632.0, "حتى لا ينخدع المسلمُ إذا قالوا:"], [635.8, "«لا بدّ من تأويل هذه الآية»،"], [638.0, "أو يقولون: «تأويلُ هذه الآية كذا وكذا»؛"], [641.0, "فإذا رأيتَ تأويلَهم وجدتَه من التأويل الذي ذمّه السلف."], [647.0, "فإن قلتَ: وهل الانصرافُ عن ظاهر اللفظ إلى معنًى آخرَ مذمومٌ مطلقًا؟"], [655.0, "الجواب: لا، ليس بمذمومٍ مطلقًا،"], [658.0, "بل هو مذمومٌ إذا كان انصرافًا لا دليلَ عليه."], [662.0, "وأمّا إذا انتقلتَ من ظاهر اللفظ إلى معنًى آخر لقيام القرينة الموجبة لهذا الانتقال،"], [668.0, "فإنّ ذلك لا بأس به،"], [670.8, "ولا حرجَ عليك فيه. لعلّه وضح الأمر <span class=\"q\">؟ 11:13<\/span>."]], "tr": [[627.0, "Te'vilin bu üç türü arasında mutlaka ayırım yapmak gerekir ki, \"Bu âyeti mutlaka te'vil etmek gerekir\" veya \"Bu âyetin te'vili şudur\" dediklerinde Müslüman aldanmasın."], [641.0, "Onların te'viline baktığında, onu selefin yerdiği te'vilden bulursun."], [647.0, "Eğer \"Lafzın zahirinden başka bir anlama yönelmek mutlak olarak yerilmiş midir?\" dersen, cevap:"], [655.0, "Hayır, mutlak olarak yerilmiş değildir;"], [658.0, "ancak üzerine hiçbir delil olmayan bir yönelme ise yerilmiştir."], [662.0, "Bu nakli gerektiren karine bulunduğu için lafzın zahirinden başka bir anlama geçersen, bunda bir sakınca yoktur ve sana bir vebal yoktur."], [673.1, "Herhalde mesele açıklığa kavuştu <span class=\"q\">؟<\/span>."]]}]}, {"ts": "11:15", "title": "3. Külliye: Her muharrif muattıldır, tersi değil", "paras": [{"reader": false, "ar": [[675.0, "طيّب، الكلّيّة الثالثة: <b>كلُّ محرِّفٍ فمعطِّلٌ ولا عكس.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ محرِّفٍ فمعطِّلٌ ولا عكس.<\/b>"]], "tr": [[675.0, "Peki, 3. külliye: Her muharrif (tahrif eden) muattıldır (ta'til edendir);"], [677.0, "tersi değil.<b> (Tekrar ediyor.) <\/b>3."], [684.1, "külliye: Her muharrif muattıldır; tersi değil."]]}, {"reader": false, "ar": [[693.0, "أقول: اعلم رحمك الله تعالى أنّ الله عز وجل إذا تكلّم بالكلمة فالواجبُ علينا كمكلَّفين أن نتعامل مع هذه الكلمة الربّانيّة أو الوحي بأمرين:"], [707.0, "الأمر الأوّل: أن نفهمها على اللسان العربيّ الذي نزلت به؛"], [715.0, "وبناءً على ذلك فكلُّ من فهم هذه الكلمة على غير اللسان العربيّ فإنّه مُبطِل."], [724.0, "الأمر الثاني: ألّا ننتقل عن هذا اللسان العربيّ إلى معنًى آخر."], [730.0, "وحقيقةُ التعطيل هو عدمُ الإيمان بمدلول هذه اللفظة على مقتضى اللسان العربيّ."]], "tr": [[693.0, "Derim ki: Bil ki —Allah Teâlâ sana rahmet etsin— Allah Azze ve Celle bir kelimeyle konuştuğunda, mükellefler olarak bize vâcib olan, bu rabbânî kelimeye veya vahye iki şekilde muamele etmemizdir."], [709.1, "Birincisi: Onu indiği Arap diline göre anlamamız."], [715.0, "Buna göre, bu kelimeyi Arap dilinin dışında bir şekilde anlayan herkes bâtıl üzeredir."], [724.0, "İkincisi: Bu Arap dilinden başka bir anlama geçmememiz."], [728.0, "Ta'tilin hakikati ise bu lafzın Arap dilinin gereğine göre olan medlûlüne (delâlet ettiği manaya) iman etmemektir."]]}, {"reader": false, "ar": [[743.0, "يعني بمعنى أنّه يقول:"], [745.2, "أنا لا أعلم معنى الاستواء؛"], [748.0, "فهو لا يحمل الاستواءَ المقرونَ بـ«على» على المعنى العربيّ،"], [754.0, "ولا يحمل الوجهَ على المعنى العربيّ،"], [756.0, "ولا يحمل النزولَ على المعنى العربيّ."], [759.0, "وإذا سألناه: ماذا تفهم منه؟"], [762.0, "قال: لا أفهم منه شيئًا."], [763.0, "فهذا حقيقتُه معطِّل. لماذا؟"], [765.5, "لأنّه لم يفهم اللفظةَ العربيّةَ على مدلول لسان العرب."]], "tr": [[743.0, "Yani şu anlamda: \"Ben istivânın manasını bilmiyorum\" der."], [748.0, "O, \"alâ\" (üzerine) edatıyla birlikte gelen istivâyı Arapça anlamı üzere anlamaz;"], [754.3, "vechi (yüzü) Arapça anlamı üzere anlamaz;"], [756.5, "nüzulü Arapça anlamı üzere anlamaz."], [759.0, "Ona \"Bundan ne anlıyorsun?\" diye sorduğumuzda, \"Ondan hiçbir şey anlamıyorum\" der."], [763.0, "İşte bu, gerçekte muattıldır. Neden?"], [766.0, "Çünkü Arapça lafzı Arap dilinin medlûlüne göre anlamadı."]]}, {"reader": false, "ar": [[770.0, "ولكن عندنا رجلٌ آخر لم يفهمها على لسان العرب،"], [776.0, "وأقحم فيها معنًى غريبًا؛"], [780.0, "فهذا محرِّف. فحقيقةُ التعطيل هو تفريغُ الكلمة العربيّة من معناها،"], [786.0, "وحقيقةُ التحريف هو إقحامُ معنًى غريبٍ فيها."], [795.0, "فالذي يقول في قول النبيّ ﷺ:"], [799.2, "«ينزل ربُّنا» <span class=\"note\">(Buhârî, Müslim)<\/span>: لا أعرف معنى النزول،"], [802.0, "هذا معطِّل؛ ولكنّ الذي يقول:"], [804.0, "إنّ معنى النزول هو نزولُ الملَك أو الرحمة أو الأمر، هذا محرِّف."]], "tr": [[770.0, "Fakat elimizde başka bir adam var:"], [772.7, "O da onu Arap diline göre anlamadı ve ona yabancı bir anlam soktu."], [780.0, "İşte bu muharriftir. Demek ki ta'tilin hakikati, Arapça kelimeyi anlamından boşaltmaktır;"], [785.4, "tahrifin hakikati ise ona yabancı bir anlam sokmaktır."], [795.0, "Peygamber ﷺ'in «Rabbimiz iner» <span class=\"note\">(Buhârî, Müslim)<\/span> sözü hakkında \"Nüzulün manasını bilmiyorum\" diyen kimse muattıldır."], [802.8, "Fakat \"Nüzulün manası meleğin veya rahmetin veya emrin inmesidir\" diyen kimse muharriftir."]]}, {"reader": false, "ar": [[809.0, "والذي يقول في قول الله عز وجل:"], [812.0, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> [المائدة: 64]: لا أعلم معنى اليدين،"], [815.0, "هذا معطِّل؛ وإذا قال:"], [817.5, "إنّ معناهما النعمةُ والقدرة،"], [821.0, "فهذا محرِّف. وبناءً على ذلك فالتحريفُ لا يصل الإنسانُ إليه إلا إذا عطّل اللفظةَ العربيّةَ عن مدلولها؛"], [829.0, "إذ لا يمكن أن يُزاحِم المدلولَ العربيَّ بمدلولٍ آخر،"], [833.0, "بل لا بدّ أن يسلب المدلولَ اللغويَّ الصحيح حتى يُقحِم مكانه مدلولًا غريبًا عن هذه اللفظة."]], "tr": [[809.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bilakis O'nun iki eli açıktır.﴾<\/span> [Mâide 64] sözü hakkında \"İki elin manasını bilmiyorum\" diyen kimse muattıldır."], [816.0, "\"Onların manası nimet ve kudrettir\" derse, bu muharriftir."], [821.0, "Buna göre insan, ancak Arapça lafzı medlûlünden ta'til ettiğinde tahrife ulaşabilir."], [829.0, "Çünkü Arapça medlûlü başka bir medlûlle aynı yerde tutması mümkün değildir;"], [833.0, "aksine onun yerine bu lafza yabancı bir medlûl sokabilmesi için doğru lügavî medlûlü mutlaka (önce) gidermesi gerekir."]]}, {"reader": false, "ar": [[842.0, "وبناءً على ذلك فلا جَرَمَ أنّ جريمةَ التحريف أعظمُ من جريمة التعطيل؛"], [851.0, "فإنّه لم يصل إلى التحريف إلا بعد أن عطّل."], [854.0, "فإذًا كلُّ محرِّفٍ فهو معطِّل،"], [857.0, "لكن ليس كلُّ من عطّل اللفظةَ العربيّةَ عن معناها لا بدّ وأن يُقحِم معنًى آخر."], [862.0, "فالتعطيلُ جريمةٌ واحدة، وأمّا التحريف فإنّه جريمتان."], [869.0, "ولذلك لا بدّ أن تعرفوا الفرقَ بين التعطيل والتحريف."]], "tr": [[842.0, "Buna göre, şüphesiz tahrif suçu ta'til suçundan daha büyüktür;"], [851.0, "çünkü o, ancak ta'til ettikten sonra tahrife ulaşmıştır."], [854.0, "Demek ki her muharrif muattıldır;"], [857.0, "fakat Arapça lafzı anlamından ta'til eden herkesin mutlaka başka bir anlam sokması gerekmez."], [862.0, "Ta'til tek bir suçtur; tahrif ise iki suçtur."], [869.0, "Bu yüzden ta'til ile tahrif arasındaki farkı mutlaka bilmelisiniz."]]}, {"reader": false, "ar": [[874.0, "وأنا أذكر لكم شيئًا خفيفًا لعلّكم تفهمونه،"], [879.0, "وهو أنّ التحريف يكون في الدليل،"], [882.3, "وأمّا التعطيل فيكون في المدلول؛"], [885.0, "التحريف يكون في الدليل،"], [887.0, "وأمّا التعطيل فإنّه يكون في المدلول."], [890.0, "وأضرب لكم أمثلة: إذا قال قائل:"], [893.1, "معنى قول الله عز وجل:"], [894.9, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> [المائدة: 64]: لا أعلم معناهما،"], [897.2, "فهذا معطِّل؛ وإذا قال:"], [898.9, "معناهما النعمةُ والقدرة أو القوّة، فهذا محرِّف."]], "tr": [[874.0, "Size, belki anlarsınız diye hafif bir şey zikredeyim:"], [885.0, "Tahrif delilde olur, ta'til ise medlûlde olur."], [890.0, "Tahrif delilde olur, ta'til ise medlûlde olur."], [893.1, "Size örnekler vereyim: Biri, Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bilakis O'nun iki eli açıktır.﴾<\/span> [Mâide 64] sözünün manası hakkında \"Onların manasını bilmiyorum\" derse, bu muattıldır."], [898.0, "\"Onların manası nimet ve kudret veya kuvvettir\" derse, bu muharriftir."]]}, {"reader": false, "ar": [[902.0, "وكذلك في قول الله عز وجل:"], [904.7, "<span class=\"ayah\">﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾<\/span> [الرحمن: 27]، إذا قال:"], [906.8, "لا أعلم معنى الوجه،"], [908.2, "فهذا معطِّل؛ لكن إذا قال:"], [910.8, "إنّ المراد بالوجه هو الذات،"], [913.8, "فهذا محرِّف. وكذلك إذا قال في قول النبيّ ﷺ:"], [921.0, "«حتى يضعَ ربُّ العزّة عليها رجلَه»:"], [923.0, "إذا قال: لا أدري ما معنى الرِّجل،"], [925.3, "فهذا معطِّل؛ ولكن إذا قال:"], [927.4, "إنّ المراد بالرِّجل طائفةٌ من الناس يخلقهم الله ويُدخلهم النار، فهذا محرِّف."]], "tr": [[902.0, "Yine Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rabbinin vechi bâkî kalır.﴾<\/span> [Rahmân 27] sözü hakkında \"Vechin manasını bilmiyorum\" derse, bu muattıldır;"], [909.0, "fakat \"Vechten maksat zâttır\" derse, bu muharriftir."], [915.0, "Yine Peygamber ﷺ'in «Nihayet İzzet'in Rabbi onun üzerine ayağını koyar» sözü hakkında \"Ayağın manasının ne olduğunu bilmiyorum\" derse, bu muattıldır;"], [926.0, "fakat \"Ayaktan maksat, Allah'ın yaratıp cehenneme koyacağı bir grup insandır\" derse, bu muharriftir."]]}, {"reader": false, "ar": [[934.0, "والخلاصة من هذا بارك الله فيكم:"], [938.0, "أنّ التعطيل والتحريف بينهما عمومٌ وخصوصٌ من وجه؛"], [948.0, "كما لو قلنا: كلُّ نجاسة ـ أو نقول:"], [953.0, "كلُّ نجسٍ ـ فحرام، وليس كلُّ حرامٍ نجسًا."], [959.0, "هذا الأسلوب يسمّيه العلماء:"], [960.5, "أنّ بين الشيئين عمومًا وخصوصًا من وجه؛"], [963.0, "يعني أنّ العموم لا يكون إلا من جهةٍ لا من جهةٍ أخرى."], [968.0, "فكلُّ محرِّفٍ فلا بدّ أن يكون معطِّلًا،"], [971.9, "ولكن ليس كلُّ معطِّلٍ لا بدّ أن يكون محرِّفًا. والله أعلم."]], "tr": [[934.0, "Bundan çıkan özet —Allah size bereket versin— şudur:"], [938.0, "Ta'til ile tahrif arasında umûm ve husûs min vech vardır."], [948.0, "Tıpkı \"Her necâset —veya \"her necis şey\" diyelim— haramdır;"], [953.0, "fakat her haram necis değildir\" dememiz gibi."], [959.0, "Âlimler bu üsluba, iki şey arasında umûm ve husûs min vech bulunması derler;"], [963.0, "yani umûm (genellik) bir yönden olur, başka bir yönden olmaz."], [968.0, "Demek ki her muharrif mutlaka muattıl olmalıdır;"], [971.9, "fakat her muattılın mutlaka muharrif olması gerekmez. Allah en iyisini bilir."]]}]}, {"ts": "16:18", "title": "4. Külliye: Vahyin naslarını kelâm ehlinin kaidelerine göre anlayan bid'at ehlindendir", "paras": [{"reader": false, "ar": [[978.0, "ومنها: <b>كلُّ من يفهم نصوصَ الوحيين بمقتضى قواعد أهل الكلام فمن أهل البدع.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ من يفهم نصوصَ الوحيين بمقتضى قواعد أهل الكلام فمن أهل البدع.<\/b>"]], "tr": [[978.0, "Bunlardan biri de: 4. külliye:"], [980.3, "Vahyin (Kitap ve Sünnet'in) naslarını kelâm ehlinin kaidelerinin gereğine göre anlayan herkes bid'at ehlindendir.<b> (Tekrar ediyor.) <\/b>4."], [985.6, "külliye: Vahyin naslarını kelâm ehlinin kaidelerinin gereğine göre anlayan herkes bid'at ehlindendir."]]}, {"reader": false, "ar": [[1009.0, "الكلام على هذه الكلّيّة في جُمَلٍ من المسائل خفيفة."], [1014.0, "المسألة الأولى: من هم أهل الكلام؟"], [1018.0, "فإنّ هذا المصطلح يتردّد في كثيرٍ من كتب الاعتقاد،"], [1022.0, "فيقال: هذا قول أهل الكلام،"], [1024.2, "أو: قال علماء الكلام."], [1026.0, "فما المقصود بعلم الكلام؟"], [1031.0, "الجواب: المقصود بعلم الكلام هو ما أحدثه المتكلّمون في أصول الدين من إثبات العقائد بالطرق الفلسفيّة ـ بين قوسين:"], [1050.5, "يعني المنطقيّة ـ ولا يفهمونها على مقتضى فهم الصحابة والسلف الصالح،"], [1061.0, "وإنما يفهمونها على مقتضى قواعد الفلاسفة والمناطقة."]], "tr": [[1009.0, "Bu külliye üzerindeki söz, birkaç hafif mesele hâlindedir."], [1014.0, "Birinci mesele: Kelâm ehli kimlerdir?"], [1018.0, "Çünkü bu ıstılah akîde kitaplarının birçoğunda tekrar tekrar geçer;"], [1022.4, "\"Bu, kelâm ehlinin sözüdür\" veya \"Kelâm âlimleri dedi ki\" denir."], [1026.0, "Kelâm ilminden maksat nedir? Cevap:"], [1031.0, "Kelâm ilminden maksat, mütekellimînin dinin usûlünde ortaya çıkardığı şeydir;"], [1033.9, "yani akîdeleri felsefî yollarla —parantez içinde:"], [1036.6, "yani mantıkî yollarla— isbat etmek."], [1050.5, "Onlar (akîdeleri) sahâbenin ve selef-i sâlihînin anlayışının gereğine göre anlamazlar;"], [1057.1, "ancak filozofların ve mantıkçıların kaidelerinin gereğine göre anlarlar."]]}, {"reader": false, "ar": [[1070.0, "فإن قلتَ: وما حالُ هذا العلم عند السلف؟"], [1078.0, "ما حالُ هذا العلم عند السلف؟"], [1081.0, "هل السلف قبلوه أو ردّوه؟"], [1084.0, "الجواب: لقد تواترت كلمةُ أهل السنّة والجماعة على ذمّ هذا العلم،"], [1090.0, "ولا أعلم عالمًا يُعتمد على قوله من أهل السنّة والجماعة يُجيزه مطلقًا،"], [1097.0, "بل تواترت كلمتُهم في التحذير منه،"], [1100.0, "كما سأذكره بعد قليلٍ إن شاء الله."]], "tr": [[1070.0, "Eğer \"Bu ilmin selef nezdindeki durumu nedir?\" dersen —bu ilmin selef nezdindeki durumu nedir?"], [1081.0, "Selef onu kabul mü etti, reddetti mi?"], [1084.0, "Cevap: Ehl-i Sünnet ve'l-Cemaat'in sözü bu ilmi yerme hususunda tevâtür derecesindedir."], [1089.5, "Ehl-i Sünnet ve'l-Cemaat'ten sözüne itimat edilen ve onu mutlak olarak caiz gören hiçbir âlim bilmiyorum;"], [1098.0, "bilakis inşallah birazdan zikredeceğim gibi, ondan sakındırma hususunda sözleri tevâtür derecesindedir."]]}, {"reader": false, "ar": [[1103.0, "فإن قلتَ: ولماذا سُمّي بعلم الكلام؟"], [1106.0, "لماذا سُمّي بعلم الكلام؟"], [1109.0, "فنقول: اختلف العلماءُ رحمهم الله تعالى في سبب هذه التسمية،"], [1114.0, "ولكنّ القولَ الصحيحَ في خلافهم هو:"], [1118.3, "لكثرة الكلام الذي لا فائدةَ منه."], [1120.0, "فأهلُ الكلام من خصائصهم كثرةُ كلامهم الذي لا خيرَ فيه،"], [1127.0, "وكثرةُ تقعيداتهم التي لا تدلّ على هدًى،"], [1130.0, "وكثرةُ تأصيلاتهم التي لا ينتهي الإنسانُ بالنظر فيها إلا إلى الضلال؛"], [1136.0, "فليس في كلامهم شيءٌ من الخير أبدًا."]], "tr": [[1103.0, "Eğer \"Neden kelâm ilmi diye isimlendirildi?\" dersen —neden kelâm ilmi diye isimlendirildi?— deriz ki:"], [1109.0, "Âlimler —Allah Teâlâ onlara rahmet etsin— bu isimlendirmenin sebebinde ihtilaf ettiler;"], [1114.8, "fakat ihtilaflarındaki doğru görüş şudur:"], [1118.3, "Faydası olmayan sözün (kelâmın) çokluğundan dolayıdır."], [1120.0, "Kelâm ehlinin özelliklerinden biri, hayır bulunmayan sözlerinin çokluğu, hidayete delâlet etmeyen kaide koymalarının çokluğu ve insanın onlara bakmakla ancak dalâlete vardığı usûl koymalarının çokluğudur."], [1136.0, "Onların sözlerinde asla hayırdan bir şey yoktur."]]}, {"reader": false, "ar": [[1140.0, "فتجد أنّ العالمَ من علماء أهل الكلام إذا أراد أن يُقرّر مسألةً فإنّه يحوم بك،"], [1146.4, "ويصول ويجول في ورقاتٍ كثيرة وكلامٍ كثير وتقريرات،"], [1150.0, "وفي نهايتها تخرج ولا تفهم شيئًا."], [1153.0, "فالشاهد: أنّه سُمّي هذا العلمُ علمَ الكلام لكثرة الكلام الذي لا خيرَ فيه، لا خيرَ فيه."]], "tr": [[1140.0, "Kelâm ehli âlimlerinden bir âlimin bir meseleyi takrir etmek istediğinde seni etrafında dolaştırdığını, birçok sayfada, birçok söz ve takrirle bir o yana bir bu yana gidip geldiğini görürsün;"], [1150.0, "sonunda (oradan) çıkarsın ve hiçbir şey anlamazsın."], [1153.0, "Sözün özü: Bu ilme, hayır bulunmayan sözün çokluğundan dolayı kelâm ilmi denmiştir; hayır bulunmayan."]]}, {"reader": false, "ar": [[1162.0, "فإن قلتَ: وما حكمُ إطلاق علم الكلام على علم التوحيد؟"], [1169.0, "ـ وهذا خطأٌ وقعنا فيه قديمًا،"], [1173.0, "وهي أنّنا كنّا نُسمّي علمَ التوحيد بعلم الكلام،"], [1177.0, "ولكنّ الحمدَ لله على الهداية والبصيرة ـ أقول:"], [1183.5, "هذه من تسميات أهل البدع،"], [1186.0, "ولا يُعرف عن أهل السنّة أبدًا أنّهم يُطلقون على شيءٍ من مسائل التوحيد «مسائلَ الكلام»،"], [1194.0, "وإنما هي تسميةٌ انخدع بها بعضُ أهل السنّة بكلام أهل البدع فيها."]], "tr": [[1162.0, "Eğer \"Kelâm ilmi adını tevhid ilmine vermenin hükmü nedir?\" dersen —bu, eskiden bizim de düştüğümüz bir hatadır:"], [1169.0, "Tevhid ilmine kelâm ilmi derdik;"], [1173.5, "fakat hidayet ve basiret için Allah'a hamd olsun— derim ki:"], [1183.5, "Bu, bid'at ehlinin isimlendirmelerindendir. Ehl-i Sünnet'in tevhid meselelerinden herhangi birine \"kelâm meseleleri\" dediği asla bilinmemektedir."], [1192.4, "Bu, Ehl-i Sünnet'ten bazılarının, bid'at ehlinin bu husustaki sözleriyle aldandığı bir isimlendirmedir."]]}, {"reader": false, "ar": [[1206.0, "فالأشاعرةُ يُسمّون التوحيدَ بعلم الكلام،"], [1209.0, "والماتريديّةُ يُسمّون التوحيدَ بعلم الكلام،"], [1211.0, "والمعتزلةُ يُسمّون التوحيدَ بعلم الكلام،"], [1213.0, "فورثها عنهم بعضُ أهل السنّة."], [1216.0, "ولكنّ القولَ الصحيح أنّ هذه التسميةَ تسميةٌ بدعيّة؛"], [1220.0, "فالتسميةُ الحقيقيّة هي: علمُ التوحيد،"], [1223.0, "علمُ العقيدة، علمُ الشريعة،"], [1226.0, "علمُ ـ مثلًا ـ العقائد، ونحو ذلك،"], [1232.0, "أو الإلهيّات. لكن أمّا أن نُسمّيه بعلم الكلام فهذه التسميةُ خطأ."], [1238.0, "وقد أخطأ جمعٌ من أهل العلم في تسميتها،"], [1243.4, "كالسيوطيّ وابن حجر والإمام النوويّ وغيرهم،"], [1248.5, "ممّن تكلّموا في شروح الأحاديث أو تكلّموا في شيءٍ من العقائد."]], "tr": [[1206.0, "Eş'arîler tevhide kelâm ilmi der, Mâtürîdîler tevhide kelâm ilmi der, Mu'tezile tevhide kelâm ilmi der;"], [1212.2, "Ehl-i Sünnet'ten bazıları da bunu onlardan miras aldı."], [1216.0, "Fakat doğru görüş, bu isimlendirmenin bid'at bir isimlendirme olduğudur."], [1220.0, "Hakiki isimlendirme şudur: Tevhid ilmi, akîde ilmi, şeriat ilmi, mesela akâid ilmi ve benzerleri veya ilâhiyyât."], [1233.0, "Fakat ona kelâm ilmi dememize gelince, bu isimlendirme hatadır."], [1238.0, "İlim ehlinden bir topluluk onu (böyle) isimlendirmekte hata etmiştir;"], [1243.4, "Süyûtî, İbn Hacer, İmam Nevevî ve hadis şerhlerinde konuşan veya akâidden bir şey hakkında konuşan diğerleri gibi."]]}]}, {"ts": "20:54", "title": "İlim ehlinin kelâm ve kelâmcılar hakkındaki sözleri", "paras": [{"reader": false, "ar": [[1254.0, "فإن قلتَ: اذكر لنا جُمَلًا من كلام أهل العلم على علماء الكلام وذمِّ هذا العلم."], [1264.0, "فأقول: الكلام في ذلك كثير،"], [1267.2, "ولكن أقتطف لكم شيئًا من ذلك."], [1271.0, "قال الإمام أحمد: «لا يُفلح صاحبُ الكلام أبدًا»."], [1275.0, "وصدق رحمه الله؛ فإنّ كلَّ من طلب العقائدَ بناءً على هذا المنهج القذر فإنّه لا يصل في نهايته إلا إلى الإلحاد."]], "tr": [[1254.0, "Eğer \"Bize ilim ehlinin kelâm âlimleri ve bu ilmin yerilmesi hakkındaki sözlerinden birtakımını zikret\" dersen, derim ki:"], [1264.0, "Bu konudaki söz çoktur; fakat size ondan bir kısmını derleyeyim."], [1271.0, "İmam Ahmed dedi ki: \"Kelâm sahibi asla felah bulmaz.\" Allah ona rahmet etsin, doğru söyledi."], [1276.6, "Çünkü akîdeleri bu pis metoda dayanarak talep eden herkes, sonunda ancak ilhada varır."]]}, {"reader": false, "ar": [[1284.0, "وقال الإمام الشافعيّ رحمه الله:"], [1287.3, "«حُكمي في أهل الكلام أن يُضربوا بالجريد والنِّعال» ـ طبعًا الشافعيّ مو بلا <span class=\"q\">؟ 21:33<\/span> ـ «ويُطاف بهم في العشائر والقبائل، ويُقال: هذا جزاءُ من ترك الكتابَ والسنّة وأقبل على علم الكلام»."], [1302.0, "وهم مستحقّون فعلًا لما قاله الإمام الشافعيّ رحمه الله تعالى."]], "tr": [[1284.0, "İmam Şâfiî —Allah ona rahmet etsin— dedi ki:"], [1287.3, "\"Kelâm ehli hakkındaki hükmüm, hurma dallarıyla ve ayakkabılarla dövülmeleri\" —tabii Şâfiî (bunu) boşuna (söylemiyor) <span class=\"q\">؟<\/span>— \"aşiretler ve kabileler arasında dolaştırılmaları ve 'Bu, Kitab'ı ve Sünnet'i bırakıp kelâm ilmine yönelenin cezasıdır' denmesidir.\" Onlar, İmam Şâfiî'nin —Allah Teâlâ ona rahmet etsin— söylediğini gerçekten hak etmektedirler."]]}, {"reader": false, "ar": [[1309.0, "وقال الإمام ابن المبارك رحمه الله:"], [1312.0, "«من تعاطى الكلامَ تزندق»."], [1314.0, "وصدق رحمه الله: من تعاطى الكلامَ تزندق."], [1317.0, "وقال الإمام مالك رحمه الله تعالى:"], [1321.0, "«لو كان الكلامُ علمًا لتكلّم فيه الصحابةُ والتابعون كما تكلّموا في الأحكام والشرائع، ولكنّه باطلٌ يدلّ على باطل»."]], "tr": [[1309.0, "İmam İbnü'l-Mübârek —Allah ona rahmet etsin— dedi ki:"], [1312.0, "\"Kelâmla uğraşan zındıklaşır.\" Allah ona rahmet etsin, doğru söyledi:"], [1315.0, "Kelâmla uğraşan zındıklaşır. İmam Mâlik —Allah Teâlâ ona rahmet etsin— dedi ki:"], [1321.0, "\"Eğer kelâm bir ilim olsaydı, sahâbe ve tâbiîn hükümler ve şer'î meseleler hakkında konuştukları gibi onun hakkında da konuşurlardı;"], [1328.0, "fakat o, bâtıla delâlet eden bir bâtıldır.\""]]}, {"reader": false, "ar": [[1332.0, "وقال الإمام الشافعيّ رحمه الله كلمةً عظيمة،"], [1337.0, "وهي قوله: «لأن يُبتلى المرءُ بكلّ ما نُهي عنه ما عدا الشرك ـ لأن يُبتلى المرءُ بكلّ ما نُهي عنه ما عدا الشرك ـ خيرٌ من النظر في الكلام»."], [1349.0, "وقال رحمه الله: «لو يعلم الناسُ ما في الكلام من الأهواء لفرّوا منه كما يفرّون من الأسد»."]], "tr": [[1332.0, "İmam Şâfiî —Allah ona rahmet etsin— büyük bir söz söyledi;"], [1337.9, "o da şu sözüdür: \"Kişinin şirk dışında yasaklanan her şeyle imtihan edilmesi —kişinin şirk dışında yasaklanan her şeyle imtihan edilmesi— kelâma bakmaktan (kelâmla meşgul olmaktan) daha hayırlıdır.\" Yine —Allah ona rahmet etsin— dedi ki:"], [1351.0, "\"İnsanlar kelâmdaki hevaları bilselerdi, ondan aslandan kaçar gibi kaçarlardı.\""]]}, {"reader": false, "ar": [[1357.0, "وقال الإمام أحمد رحمه الله:"], [1361.0, "«من تعاطى الكلامَ لم يُفلح أبدًا»،"], [1363.0, "وقال في روايةٍ أخرى:"], [1365.0, "«من تعاطى الكلامَ تزندق»."], [1367.0, "وقال رحمه الله: «من أحبّ الكلامَ لم يخرج من قلبه <span class=\"q\">؟ 22:47<\/span>، ولا يؤول أمرُه إلى خير»."], [1374.0, "وقال الجُنيد بن محمد رحمه الله تعالى:"], [1378.0, "«أقلُّ ما في الكلام سقوطُ هيبة الربّ من قلب العبد»."]], "tr": [[1357.0, "İmam Ahmed —Allah ona rahmet etsin— dedi ki:"], [1361.7, "\"Kelâmla uğraşan asla felah bulmaz.\" Başka bir rivayette de:"], [1365.0, "\"Kelâmla uğraşan zındıklaşır\" dedi. Yine —Allah ona rahmet etsin— dedi ki:"], [1368.4, "\"Kelâmı seven kimsenin kalbinden (o sevgi) çıkmaz <span class=\"q\">؟<\/span> ve işi hayra varmaz.\" Cüneyd b."], [1374.0, "Muhammed —Allah Teâlâ ona rahmet etsin— dedi ki:"], [1378.0, "\"Kelâmda bulunan (zararın) en azı, Rabbin heybetinin kulun kalbinden düşmesidir.\""]]}, {"reader": false, "ar": [[1384.0, "ولو رأيتَ هؤلاء فعلًا يتكلّمون عن الله،"], [1386.7, "وعن صفات الله، وعن أسماء الله،"], [1389.0, "لوجدتَ في كلامهم من قلّة الأدب على الله ـ يعني ـ ما لا يُحصيه إلا الله عز وجل؛"], [1397.0, "يتكلّمون عن صفات الله وكأنّهم يتكلّمون عن صفات إنسانٍ لا يُؤبَه به."]], "tr": [[1384.0, "Bunların Allah hakkında, Allah'ın sıfatları hakkında ve Allah'ın isimleri hakkında gerçekten nasıl konuştuklarını görsen, sözlerinde Allah'a karşı —yani— ancak Allah Azze ve Celle'nin sayabileceği kadar edepsizlik bulursun."], [1395.8, "Allah'ın sıfatları hakkında, sanki aldırış edilmeyen bir insanın vasıfları hakkında konuşuyormuş gibi konuşurlar."]]}, {"reader": false, "ar": [[1403.0, "وقال أبو يوسف رحمه الله تعالى:"], [1407.0, "«العلمُ بالكلام جهل، والجهلُ بالكلام علم»."], [1413.0, "وقال أبو عمر ابن عبد البرّ رحمه الله تعالى:"], [1416.0, "«أجمع أهلُ العلم في جميع الأعصار والأمصار أنّ أهلَ الكلام أهلُ بدعٍ وضلالات، لا يُعدّون عند الجميع في طبقات العلماء»."], [1426.0, "وما أجملَ ما قاله الحافظ العلّامة شرف الدين الدمياطيّ الشافعيّ رحمه الله تعالى،"], [1432.0, "قال: «ما العلمُ إلا في كتابٍ وسنّةٍ ... وما الجهلُ إلا في كلامٍ ومنطقِ». انتهى كلامه."]], "tr": [[1403.0, "Ebû Yûsuf —Allah Teâlâ ona rahmet etsin— dedi ki:"], [1407.0, "\"Kelâmı bilmek cehalettir, kelâmı bilmemek ilimdir.\" Ebû Ömer İbn Abdilber —Allah Teâlâ ona rahmet etsin— dedi ki:"], [1416.0, "\"Bütün asırlarda ve bütün beldelerde ilim ehli, kelâm ehlinin bid'at ve dalâlet ehli olduğunda icmâ etmiştir;"], [1423.3, "onlar herkesin nezdinde âlimlerin tabakalarından sayılmazlar.\" Hâfız allâme Şerefüddîn ed-Dimyâtî eş-Şâfiî'nin —Allah Teâlâ ona rahmet etsin— söylediği ne güzeldir;"], [1432.5, "dedi ki: \"İlim ancak Kitap'ta ve Sünnet'tedir;"], [1435.2, "cehalet ise ancak kelâmda ve mantıktadır.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1439.0, "وقال شيخُ الإسلام الأنصاريّ:"], [1443.0, "سمعتُ يحيى بن عمّار يقول:"], [1446.0, "«العلوم خمسة» ـ اسمعوها يا جماعة ـ «العلوم خمسة: علمٌ هو حياةُ الدين، وهو علمُ التوحيد؛ وعلمٌ هو قوتُ الدين، وهو علمُ العِظة والعِبرة؛ وعلمٌ هو دواءُ الدين، وهو الفقه؛ وعلمٌ هو داءُ الدين، وهو أخبارُ الفتن عن السلف» ـ الكلامُ فيما شجر بين الصحابة،"], [1474.1, "هذا يُثير الفتنة ـ «وعلمٌ هو هلاكُ الدين، وهو علمُ الكلام»."]], "tr": [[1439.0, "Şeyhülislâm el-Ensârî dedi ki: Yahyâ b."], [1439.8, "Ammâr'ı şöyle derken işittim: \"İlimler beştir\" —ey cemaat, bunu dinleyin— \"İlimler beştir:"], [1441.5, "Dinin hayatı olan bir ilim;"], [1443.0, "o da tevhid ilmidir. Dinin gıdası olan bir ilim;"], [1444.2, "o da vaaz ve ibret ilmidir."], [1444.8, "Dinin ilacı olan bir ilim;"], [1446.0, "o da fıkıhtır. Dinin hastalığı olan bir ilim;"], [1454.8, "o da selefin fitnelere dair haberleridir\" —sahâbe arasında cereyan eden olaylar hakkında konuşmak;"], [1467.7, "bu fitneyi körükler— \"Ve dinin helaki olan bir ilim; o da kelâm ilmidir.\""]]}, {"reader": false, "ar": [[1479.0, "وقال الإمام البربهاريّ رحمه الله تعالى:"], [1482.6, "«اعلم رحمك الله تعالى أنّه ما كانت زندقةٌ قطّ، ولا كفرٌ قطّ، ولا شكٌّ قطّ، ولا بدعةٌ ولا ضلالةٌ قطّ، ولا حيرةٌ في الدين، إلا من الكلام وأصحاب الكلام والجدال والمِراء والخصومة»."]], "tr": [[1479.0, "İmam Berbehârî —Allah Teâlâ ona rahmet etsin— dedi ki:"], [1483.8, "\"Bil ki —Allah Teâlâ sana rahmet etsin— hiçbir zındıklık, hiçbir küfür, hiçbir şüphe, hiçbir bid'at ve dalâlet, dinde hiçbir hayret (şaşkınlık) yoktur ki kelâmdan, kelâm ehlinden, cedelden, mirâdan (münakaşadan) ve husûmetten (kaynaklanmış) olmasın.\""]]}, {"reader": false, "ar": [[1502.0, "وقال الإمام عبد الله بن محمد القحطانيّ رحمه الله تعالى:"], [1508.5, "«لا تلتمس علمَ الكلام فإنّه ... يدعو إلى التعطيل والهَيَمانِ» ـ يعني أنّه كثيرُ الأوهام ـ «علمُ الكلام وعلمُ شرع محمدٍ ... يتغايران وليس يشتبهانِ»."], [1525.0, "وقال أبو عمر الضرير رحمه الله تعالى:"], [1529.5, "«العلمُ بالكلام بمنزلة التنجيم؛ كلّما كان صاحبُه أزيدَ علمًا كان أشدَّ لفساده»."]], "tr": [[1502.0, "İmam Abdullah b. Muhammed el-Kahtânî —Allah Teâlâ ona rahmet etsin— dedi ki:"], [1508.5, "\"Kelâm ilmini arama; çünkü o, ta'tile ve şaşkınlığa çağırır\" —yani evhamı (vehimleri) çoktur— \"Kelâm ilmi ile Muhammed'in şeriatının ilmi birbirinden farklıdır;"], [1520.5, "birbirine benzemezler.\" Ebû Ömer ed-Darîr —Allah Teâlâ ona rahmet etsin— dedi ki:"], [1529.5, "\"Kelâmı bilmek müneccimlik gibidir; sahibinin ilmi arttıkça fesadı daha şiddetli olur.\""]]}, {"reader": false, "ar": [[1538.0, "وقال شيخ الإسلام ابن تيميّة رحمه الله ـ ونختم به ـ عن المتكلّمين:"], [1543.0, "«تجدهم أعظمَ الناس شكًّا واضطرابًا، وأضعفَ الناس علمًا ويقينًا، وإنما فضيلةُ أحدهم باقتداره على الاعتراض وعلى القدح وعلى الجدل، ومن المعلوم أنّ الاعتراض والقدح ليس بعلمٍ ولا فيه منفعة»."], [1560.0, "وكلامُ السلف في ذلك كثير،"], [1562.0, "ولا أريد الإطالةَ عليكم فيه."], [1564.0, "وبناءً على ذلك فلا يجوز أن نتلقّى شيئًا من مسائل العقيدة بناءً على قواعد الفلاسفة وأصول المناطقة. والله أعلم."]], "tr": [[1538.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— mütekellimîn hakkında dedi ki —onunla bitiriyoruz—:"], [1543.0, "\"Onları insanların şüphe ve ıstırap bakımından en büyüğü, ilim ve yakîn bakımından en zayıfı olarak bulursun."], [1554.0, "Onlardan birinin fazileti ancak itiraz etmeye, karalamaya ve cedelleşmeye gücünün yetmesidir."], [1560.0, "Malumdur ki itiraz ve karalama ilim değildir, onda bir fayda da yoktur.\" Selefin bu konudaki sözü çoktur;"], [1564.0, "bu hususta sözü size uzatmak istemiyorum."], [1565.5, "Buna göre, akîde meselelerinden herhangi bir şeyi filozofların kaidelerine ve mantıkçıların usûlüne dayanarak almamız caiz değildir. Allah en iyisini bilir."]]}]}, {"ts": "26:17", "title": "5. Külliye: Şer'î ilimlerden hiçbirinin anlaşılması kelâm ilmine bağlı değildir", "paras": [{"reader": false, "ar": [[1577.0, "ومن القواعد أيضًا: <b>كلُّ فنون الشرع لا يتوقّف فهمُ شيءٍ منها على علم الكلام.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ فنون الشرع لا يتوقّف فهمُ شيءٍ منها على علم الكلام.<\/b>"]], "tr": [[1577.0, "Kaidelerden biri de: 5. külliye:"], [1581.0, "Şer'î ilimlerin (fenlerin) hiçbirinden bir şeyin anlaşılması kelâm ilmine bağlı değildir.<b> (Tekrar ediyor.) <\/b>5."], [1586.0, "külliye: Şer'î ilimlerin hiçbirinden bir şeyin anlaşılması kelâm ilmine bağlı değildir."]]}, {"reader": false, "ar": [[1592.0, "أقول وبالله التوفيق: وأنا أُقسم وأُباهل على هذا."], [1600.0, "فالكلامُ الذي نسمعه من أهل البدع بين الفينة والأخرى بأنّ أصولَ فهم الفنون الشرعيّة مبنيٌّ على تعمّقك في علم الكلام،"], [1610.0, "هذا كلُّه باطل. وأنا أُقسم بالله العظيم ثلاثةَ أيمانٍ أنّه ليس فنٌّ من فنون الشريعة يحتاج في فهمه إلى شيءٍ من علم الكلام."]], "tr": [[1592.0, "Tevfik Allah'tandır, derim ki: Ben buna yemin eder ve bunun üzerine mübâhele ederim."], [1600.0, "Bid'at ehlinden ara sıra duyduğumuz, şer'î ilimleri anlamanın usûlünün senin kelâm ilminde derinleşmene dayandığı sözü, bunların hepsi bâtıldır."], [1611.0, "Yüce Allah'a üç kez yemin ederim ki şeriat ilimlerinden hiçbir ilim, anlaşılmasında kelâm ilminden bir şeye muhtaç değildir."]]}, {"reader": false, "ar": [[1620.0, "فعلمُ التوحيد تستطيع أن تكون عالمًا راسخًا فيه ولم تدرس مسألةً كلاميّة،"], [1626.0, "وعلمُ أصول الفقه تستطيع أن تكون عالمًا راسخًا فيه من غير أن تدرس مسألةً منطقيّةً واحدة،"], [1633.0, "وكذلك علمُ التفسير، وكذلك علمُ مصطلح الحديث،"], [1636.8, "وغيرُها من فنون الشريعة."], [1639.0, "فليس هناك فنٌّ من فنون الشريعة يحتاج إلى فهم شيءٍ من علم الكلام،"], [1645.0, "فلا حاجةَ للمسلمين أبدًا بهذا العلم،"], [1649.0, "بل إنّ ضررَه أعظمُ من نفعه."]], "tr": [[1620.0, "Tevhid ilminde, hiçbir kelâmî mesele okumadan râsih bir âlim olabilirsin."], [1625.5, "Usûl-i fıkıh ilminde, tek bir mantıkî mesele okumadan râsih bir âlim olabilirsin."], [1631.2, "Tefsir ilmi de, hadis usûlü ilmi de ve şeriatın diğer ilimleri de böyledir."], [1639.0, "Şeriat ilimlerinden kelâm ilminden bir şeyi anlamaya muhtaç olan hiçbir ilim yoktur."], [1644.5, "Müslümanların bu ilme asla ihtiyacı yoktur;"], [1648.3, "bilakis onun zararı faydasından daha büyüktür."]]}, {"reader": false, "ar": [[1654.0, "ولا أجد من وصفه حقيقةً كما وصفه ابن تيميّة بقوله:"], [1658.0, "«هو علمٌ لا يفهمه الغبيّ، ولا يحتاج له الذكيّ»."], [1664.0, "بل لو تأمّل الإنسانُ كثرةَ البلايا التي أصابت أهلَ البدع فإنّه يجد بوّابتَها الكبرى هو إقبالُهم على علم الكلام."], [1678.0, "ولذلك لا نحتاج إلى شيءٍ منه أبدًا؛"], [1682.0, "لا في فهم مسألةٍ عقديّة،"], [1683.5, "ولا في فهم مسألةٍ أصوليّة،"], [1685.0, "ولا في فهم مسألةٍ تفسيريّة،"], [1688.0, "ولا في فهم شيءٍ من المسائل أبدًا."]], "tr": [[1654.0, "Onu gerçekten İbn Teymiyye'nin şu sözüyle vasfettiği gibi vasfeden birini bulamıyorum:"], [1658.0, "\"O, aptalın anlamadığı, zekinin de ihtiyaç duymadığı bir ilimdir.\" Hatta insan, bid'at ehlinin başına gelen belaların çokluğunu düşünse, bunların en büyük kapısının onların kelâm ilmine yönelmeleri olduğunu görür."], [1678.0, "Bu yüzden ona asla hiçbir şekilde ihtiyacımız yoktur;"], [1682.0, "ne bir akîde meselesini anlamada, ne bir usûl meselesini anlamada, ne bir tefsir meselesini anlamada, ne de meselelerden herhangi birini anlamada asla."]]}, {"reader": false, "ar": [[1691.0, "ودونك السلفَ الأوائل من الصحابة والتابعين،"], [1694.0, "أوليسوا قد بلغوا في العلم مبلغَه وغايتَه؟"], [1697.0, "ومع ذلك لم يدرسوا شيئًا من علم الكلام."], [1701.0, "بل ما ظهرت المخالفات،"], [1702.0, "ولا كثرت البدعُ والنزغات <span class=\"q\">؟ 28:22<\/span>،"], [1704.0, "ولا كثر الخصامُ والنزاعات،"], [1708.0, "ولا تعدّدت الطوائفُ إلا بسبب دخول هذا العلم في معارف الشريعة."]], "tr": [[1691.0, "İşte sana sahâbe ve tâbiînden olan ilk selef!"], [1694.0, "İlimde onun (varılabilecek) noktasına ve son haddine ulaşmadılar mı?"], [1697.0, "Bununla birlikte kelâm ilminden hiçbir şey okumadılar."], [1701.0, "Bilakis muhalefetler ortaya çıkmadı, bid'atler ve (şeytanî) kışkırtmalar <span class=\"q\">؟<\/span> çoğalmadı, çekişme ve münakaşalar çoğalmadı, fırkalar da çoğalmadı;"], [1710.1, "ancak bu ilmin şeriat bilgilerine girmesi sebebiyle (oldu)."]]}, {"reader": false, "ar": [[1716.0, "وقد كذب من قال بأنّ علمَ العقيدة متوقّفٌ على علم الكلام،"], [1721.0, "وعلمَ أصول الفقه متوقّفٌ على علم الكلام؛"], [1724.0, "فهذا كلُّه من الدجل والكذب،"], [1727.0, "فإنّي لا أعلم أحدًا دخل في تعلّم علم الكلام وخرج سالمًا."], [1732.0, "وقد ذكرتُ لكم جُمَلًا من قواعد علم الكلام في الكلّيّات التي رددنا فيها على جمعٍ من أهل البدع."]], "tr": [[1716.0, "Akîde ilminin kelâm ilmine bağlı olduğunu ve usûl-i fıkıh ilminin kelâm ilmine bağlı olduğunu söyleyen yalan söylemiştir."], [1724.0, "Bunların hepsi dolandırıcılık ve yalandandır."], [1727.0, "Çünkü kelâm ilmini öğrenmeye girip de salim çıkan hiç kimse bilmiyorum."], [1732.0, "Bid'at ehlinden bir topluluğa reddiye yaptığımız külliyelerde size kelâm ilminin kaidelerinden birtakımını zikretmiştim."]]}]}, {"ts": "28:59", "title": "6. Külliye: Akîde meselesinde selefin icmâsı muteber icmâdır", "paras": [{"reader": false, "ar": [[1739.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما ثبت عن السلف من الإجماع في مسألةٍ عقديّة فهو الإجماعُ المعتبر.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ ما ثبت عن السلف من الإجماع في مسألةٍ عقديّة فهو الإجماعُ المعتبر.<\/b>"]], "tr": [[1739.0, "Külliyelerden biri de: 6. külliye:"], [1740.7, "Bir akîde meselesinde selefin icmâ ettiği sabit olan her şey, muteber icmâdır.<b> (Tekrar ediyor.) <\/b>6."], [1757.0, "külliye: Bir akîde meselesinde selefin icmâ ettiği sabit olan her şey, muteber icmâdır."]]}, {"reader": false, "ar": [[1766.0, "أقول وبالله التوفيق: حتى وإن خالفتنا الطوائفُ الأخرى في هذه المسألة العقديّة،"], [1773.7, "فإنّ خلافَهم لا ينقض الإجماعَ في المسألة،"], [1778.2, "وهذا بإجماع أهل السنّة والجماعة؛"], [1783.0, "فإنّ أهل السنّة لا يزالون ينقلون الإجماعاتِ في كتبهم العقديّة خالفًا عن سالف،"], [1789.8, "مع أنّه قد خالفهم فيها أكثرُ من اثنتين وسبعين فرقة."], [1794.0, "فكلُّ الفرق تخالف أهلَ السنّة،"], [1795.9, "ولكن بما أنّ المسألة عقديّة فلا يُنظر فيها إلى خلاف أهل البدع،"], [1800.5, "وإنما لا يُنظر فيها إلا إلى قول أهل الحقّ."]], "tr": [[1766.0, "Tevfik Allah'tandır, derim ki: Diğer fırkalar bu akîde meselesinde bize muhalefet etseler bile, onların muhalefeti o meseledeki icmâyı bozmaz;"], [1777.5, "bu da Ehl-i Sünnet ve'l-Cemaat'in icmâsıyladır."], [1783.0, "Çünkü Ehl-i Sünnet, yetmiş ikiden fazla fırka bu hususta onlara muhalefet etmiş olmasına rağmen, akîde kitaplarında icmâları nesilden nesile nakletmeye devam etmektedir."], [1794.0, "Bütün fırkalar Ehl-i Sünnet'e muhalefet eder;"], [1796.7, "fakat mesele akîdevî olduğu için, onda bid'at ehlinin muhalefetine bakılmaz;"], [1800.9, "onda ancak hak ehlinin sözüne bakılır."]]}, {"reader": false, "ar": [[1804.0, "فمتى ما أجمع أهلُ السنّة والجماعة على مسألةٍ عقديّة فهو الإجماعُ الذي تترتّب عليه كلُّ مسائل الإجماع في أصول الفقه؛"], [1812.0, "فيجب متابعتُه، ولا يكون إلا حقًّا،"], [1815.4, "ولا تجوز مخالفتُه، ولا يجوز قبولُ الخلاف الذي ينشأ بعده."], [1821.0, "وهذه من المسائل التي كنتُ أتأمّلها كثيرًا؛"], [1825.0, "فإنّ تعريفَ الإجماع عند الأصوليّين هو:"], [1828.6, "اتّفاقُ مجتهدي الأمّة على حكمٍ شرعيّ،"], [1831.9, "أليس كذلك؟ فكيف نجعلها مسألةً عقديّةً مُجمَعًا عليها مع أنّ أكثرَ الأمّة على خلافها؟"]], "tr": [[1804.0, "Ne zaman Ehl-i Sünnet ve'l-Cemaat bir akîde meselesinde icmâ ederse, o, usûl-i fıkıhtaki icmâ meselelerinin hepsinin üzerine bina edildiği icmâdır."], [1812.0, "Ona uymak vâcibtir, o ancak hak olur, ona muhalefet etmek caiz değildir ve ondan sonra ortaya çıkan ihtilafı kabul etmek caiz değildir."], [1822.1, "Bu, üzerinde çokça düşündüğüm meselelerdendir."], [1825.0, "Çünkü usûlcülere göre icmânın tarifi:"], [1828.6, "Ümmetin müctehidlerinin şer'î bir hüküm üzerinde ittifak etmesidir;"], [1833.0, "öyle değil mi? Peki ümmetin çoğu ona muhalifken onu nasıl üzerinde icmâ edilmiş bir akîde meselesi yaparız?"]]}, {"reader": false, "ar": [[1840.0, "ولكنّ حلَّ ذلك الإشكال للشيخ صالح آل الشيخ ـ حفظه الله ووفّقه ـ وهو أنّ كلَّ خلافٍ ثبت عن أهل البدع فمسبوقٌ بإجماع الصحابة على تلك المسألة."], [1851.0, "فهمتم هذا؟ أنّ كلَّ خلافٍ ثبت عن أهل البدع في بعض المسائل العقديّة فهو مسبوقٌ بإجماع السلف."], [1861.0, "فالسلف قد أجمعوا على إثبات الاستواء لله عز وجل،"], [1865.0, "إذن قولُ أهل البدع:"], [1866.3, "«إنّه استيلاء» هذا خلافٌ بعد إجماع،"], [1868.8, "والخلافُ بعد الإجماع لا يُقبل."]], "tr": [[1840.0, "Fakat bu müşkülün çözümü Şeyh Sâlih Âlü'ş-Şeyh'e —Allah onu korusun ve muvaffak kılsın— aittir."], [1844.3, "O da şudur: Bid'at ehlinden sabit olan her ihtilaf, o meselede sahâbenin icmâsıyla öncelenmiştir (ondan önce sahâbenin icmâsı vardır)."], [1851.0, "Bunu anladınız mı? Bazı akîde meselelerinde bid'at ehlinden sabit olan her ihtilaf, selefin icmâsıyla öncelenmiştir."], [1861.0, "Selef, Allah Azze ve Celle için istivâyı isbat etmede icmâ etmiştir;"], [1866.3, "o hâlde bid'at ehlinin \"O, istîlâdır\" sözü, icmâdan sonra bir ihtilaftır;"], [1869.2, "icmâdan sonraki ihtilaf ise kabul edilmez."]]}, {"reader": false, "ar": [[1871.0, "والسلف أجمعوا على أنّ الله عز وجل في السماء،"], [1874.0, "وأنّه مباينٌ من خلقه،"], [1877.0, "وأنّه ليس في ذاته شيءٌ من ذوات خلقه،"], [1880.0, "ولا في ذوات خلقه شيءٌ من ذاته."], [1882.0, "فخلافُ الأشاعرة بأنّ الله عز وجل ليس في السماء هذا خلافٌ بعد إجماع،"], [1888.0, "أليس كذلك؟ فانحلّ الإشكالُ عندي."]], "tr": [[1871.0, "Selef, Allah Azze ve Celle'nin semâda olduğunda, yaratıklarından ayrı olduğunda, O'nun zâtında yaratıklarının zâtlarından hiçbir şey bulunmadığında ve yaratıklarının zâtlarında da O'nun zâtından hiçbir şey bulunmadığında icmâ etmiştir."], [1882.0, "Eş'arîlerin \"Allah Azze ve Celle semâda değildir\" diyerek muhalefet etmesi, icmâdan sonra bir ihtilaftır;"], [1887.0, "öyle değil mi? Böylece müşkül benim için çözüldü."]]}, {"reader": false, "ar": [[1890.0, "وبناءً على ذلك فالإجماعُ في المسائل العقديّة يختلف عن الإجماع في المسائل الفقهيّة؛"], [1898.0, "الإجماعُ في المسائل الفقهيّة قد ينقضه ـ قد ينقضه ـ خلافُ مبتدعٍ مجتهد،"], [1905.0, "خلافُ مبتدعٍ مجتهد. لماذا؟"], [1909.3, "لأنّنا في المسائل الفقهيّة لا ننظر إلى العقائد،"], [1912.0, "وإنما ننظر إلى الرسوخ في المسائل الفقهيّة."], [1915.0, "لكن أمّا الخلافُ في المسائل العقديّة فإنّه لا ينقضه قولُ مبتدعٍ مطلقًا."]], "tr": [[1890.0, "Buna göre, akîde meselelerindeki icmâ, fıkhî meselelerdeki icmâdan farklıdır."], [1898.0, "Fıkhî meselelerdeki icmâyı —bozabilir— müctehid bir bid'atçinin muhalefeti bozabilir;"], [1903.4, "müctehid bir bid'atçinin muhalefeti. Neden?"], [1909.0, "Çünkü fıkhî meselelerde akîdelere bakmayız;"], [1911.3, "ancak fıkhî meselelerdeki rusûha (derinliğe) bakarız."], [1915.0, "Fakat akîde meselelerindeki ihtilafa gelince, onu (oradaki icmâyı) hiçbir bid'atçinin sözü asla bozmaz."]]}, {"reader": false, "ar": [[1921.0, "لماذا؟ لأنّ جميعَ المسائل التي نحكي عليها الإجماعَ إلى الآن إنما نحكي فيها إجماعَ مَن؟"], [1929.0, "إجماعَ الصحابة، قبل وجود الأشاعرة،"], [1931.1, "قبل وجود الجهميّة، قبل وجود المعتزلة،"], [1933.7, "قبل وجود الرافضة. فإذًا وجودُ هذه الطوائف كان مسبوقًا بالإجماع،"], [1939.5, "فكلُّ خلافٍ ثبت عن أهل البدع فإنّه لا يُعتبر ناقضًا لذلك الإجماع؛"], [1947.1, "لأنّه إجماعٌ قديم. ولذلك قال الإمام ابن تيميّة رحمه الله:"], [1952.1, "«والإجماعُ الذي ينضبط هو ما كان عليه السلفُ الصالح»."]], "tr": [[1921.0, "Neden? Çünkü şimdiye kadar üzerinde icmâ naklettiğimiz bütün meselelerde kimin icmâsını naklediyoruz?"], [1926.6, "Sahâbenin icmâsını; Eş'arîler ortaya çıkmadan önce, Cehmiyye ortaya çıkmadan önce, Mu'tezile ortaya çıkmadan önce, Râfıza ortaya çıkmadan önce."], [1935.0, "Demek ki bu fırkaların ortaya çıkışından önce icmâ vardı."], [1940.1, "Dolayısıyla bid'at ehlinden sabit olan her ihtilaf o icmâyı bozucu sayılmaz;"], [1947.1, "çünkü o, eski bir icmâdır."], [1949.0, "Bu yüzden İmam İbn Teymiyye —Allah ona rahmet etsin— dedi ki:"], [1952.9, "\"Zabtedilebilen icmâ, selef-i sâlihînin üzerinde olduğu şeydir.\""]]}, {"reader": false, "ar": [[1955.8, "ـ انتبه ـ فإذا قلنا بأنّ إثباتَ اليد لله إجماعٌ لا تجوز مخالفتُه،"], [1963.0, "فحينئذٍ لا يُشكل علينا أنّ الأشاعرة ما أثبتوها،"], [1967.0, "ولا المعتزلة ما أثبتوها،"], [1968.0, "ولا الجهميّة ما أثبتوها؛"], [1969.0, "لأنّ عدمَ إثباتهم لها إنما هو خلافٌ بعد إجماع."], [1974.0, "لعلّ الأمر (واضح) إن شاء الله؟"], [1976.1, "فإذًا الإجماعُ الذي يُعتبر في مسائل العقيدة هو ما عليه أهلُ السنّة والجماعة،"], [1982.0, "وأمّا خلافُ غيرهم فإنّه خلافٌ بعد إجماع،"], [1984.0, "وهذا غيرُ معتبر. طيّب،"], [1987.5, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[1955.8, "—Dikkat et— Eğer Allah için eli isbat etmenin, muhalefet edilmesi caiz olmayan bir icmâ olduğunu söylersek, o zaman Eş'arîlerin onu isbat etmemesi, Mu'tezile'nin onu isbat etmemesi, Cehmiyye'nin onu isbat etmemesi bize müşkül gelmez;"], [1969.0, "çünkü onların onu isbat etmemesi ancak icmâdan sonra bir ihtilaftır."], [1974.0, "Herhalde mesele inşallah (açıktır)? Demek ki akîde meselelerinde muteber olan icmâ, Ehl-i Sünnet ve'l-Cemaat'in üzerinde olduğu şeydir;"], [1981.3, "diğerlerinin muhalefeti ise icmâdan sonra bir ihtilaftır ve bu muteber değildir."], [1987.0, "Peki, Allah en yüce olandır ve en iyi bilendir."], [1989.4, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);

    if(ka>=0){AR[ka].r.classList.add("on");
