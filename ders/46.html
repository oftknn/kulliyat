îsi ve Allah katında mahlûkların en faziletlisi olmasıdır;"], [2927.8, "ve Makâm-ı Mahmûd'un, varılacak Havz'ın ve en büyük şefaatin sahibi olmasıdır."]]}, {"reader": false, "ar": [[2944.0, "فلأنه يتميّز بفضائلَ لم يتميّز بها غيرُه،"], [2948.0, "ولا يُشاركه فيها غيرُه ولا بمطلق المشاركة،"], [2955.0, "أجاز الشارع أن نتبرّك بذاته."], [2957.0, "ومن هو في منزلته في هذه الفضائل حتى نُجيز إدخاله،"], [2965.0, "حتى نُجيز إدخاله معه؟"], [2967.0, "الجواب: لا أحد. فلا أبو بكرٍ رضي الله عنه بلغ هذه المنزلة،"], [2974.0, "ولا عمرُ رضي الله عنه بلغ هذه المنزلة،"], [2977.0, "ولا سائرُ إخوانهم من المهاجرين والأنصار،"], [2980.0, "فضلًا عمّن دونهم من الأئمّة والعلماء والأولياء والصالحين."]], "tr": [[2944.0, "Başkasının sahip olmadığı faziletlerle temayüz ettiği ve bu faziletlerde —mutlak bir ortaklıkla bile— başkası ona ortak olmadığı için, Şâri' onun zâtıyla teberrük etmemizi caiz kılmıştır."], [2957.0, "Peki bu faziletlerde onun mertebesinde olan kimdir ki onu da dâhil etmeyi, onunla birlikte dâhil etmeyi caiz görelim?"], [2969.0, "Cevap: Hiç kimse. Ne Ebû Bekir —Allah ondan razı olsun— bu mertebeye ulaşmıştır, ne Ömer —Allah ondan razı olsun— bu mertebeye ulaşmıştır, ne de Muhâcirler'den ve Ensâr'dan onların diğer kardeşleri;"], [2981.0, "bırakın onlardan aşağıdaki imamları, âlimleri, velîleri ve sâlihleri."]]}, {"reader": false, "ar": [[2987.0, "ولذلك كانت هذه الحقيقة متقرّرةً مستقرّةً الاستقرارَ الكاملَ في قلوب أصحاب النبيّ صلى الله عليه وسلم،"], [2998.0, "ولذلك خصّوه بهذا النوع من التبرّك،"], [3002.0, "ولم يُدخلوا معه غيرَه؛"], [3004.0, "لأنّ غيره لا يتّفق معه في هذه العلّة،"], [3008.0, "والقياسُ مع الفارق باطل."]], "tr": [[2987.0, "Bu yüzden bu hakikat, Peygamber sallallâhu aleyhi ve sellem'in ashâbının kalplerinde yerleşmiş, tam bir yerleşiklikle sabit olmuştu."], [2996.1, "Bu yüzden bu tür teberrüğü ona tahsis ettiler ve onunla birlikte başkasını (buna) dâhil etmediler."], [3004.0, "Çünkü başkası bu illette onunla ortak değildir;"], [3007.5, "fark bulunan kıyas ise bâtıldır."]]}]}, {"ts": "50:10", "title": "6. Külliye (devam): İllet tek bir illete indirgenemez · İbn Receb'in sözü", "paras": [{"reader": false, "ar": [[3010.0, "فيأتي هؤلاء ليُقرّروا البدعَ في الأمّة،"], [3015.0, "ويحذفوا كلَّ العلل التي اختصّ بها رسول الله صلى الله عليه وسلم،"], [3022.0, "والتي من أجلها جاز التبرّك بذاته،"], [3025.6, "ويُفردوها في علّةٍ واحدة،"], [3028.0, "وهي أنّ الصحابة إنما كانوا يتبرّكون به هذا النوعَ من التبرّك لصلاحه وولايته فقط،"], [3036.0, "كما صرّح به النوويّ وغيرُه،"], [3041.0, "رحم الله الجميع رحمةً واسعة."], [3042.9, "وكلٌّ يُؤخذ من قوله ويُترك إلا قولَ الشارع."]], "tr": [[3010.0, "Sonra bunlar gelip ümmette bid'atleri yerleştirmek istiyorlar;"], [3016.2, "Resûlullah sallallâhu aleyhi ve sellem'in kendisine has olan ve onun sebebiyle zâtıyla teberrüğün caiz olduğu bütün illetleri atıyorlar ve onları tek bir illete indirgiyorlar:"], [3032.3, "O da sahabenin onunla bu tür teberrüğü sadece onun salâhı ve velîliği sebebiyle yaptığıdır."], [3042.9, "Nevevî ve başkaları bunu açıkça söylemiştir."], [3043.7, "Allah hepsine geniş rahmetiyle rahmet etsin."], [3044.5, "Şâri'in sözü dışında herkesin sözünden alınır ve terk edilir."]]}, {"reader": false, "ar": [[3046.0, "فأفاد الدليلُ الأثريّ ـ وهو فعلُ الصحابة وإجماعُهم ـ والنظريّ ـ وهو إبطالُ القياس ـ بأنّ تلك الأدلّة التي تُجيز التبرّك بذات النبيّ صلى الله عليه وسلم يجب أن نعتقد أنها من جملة خصوصيّاته."], [3067.7, "وعلى ذلك كلامُ أهل العلم."]], "tr": [[3046.0, "Böylece eserî delil —yani sahabenin fiili ve icmâı— ve nazarî delil —yani kıyasın iptali— şunu ifade etti:"], [3055.7, "Peygamber sallallâhu aleyhi ve sellem'in zâtıyla teberrüğü caiz kılan o delillerin, onun hususiyetleri cümlesinden olduğuna inanmamız vâciptir."], [3067.7, "Ehl-i ilmin sözü de bu yöndedir."]]}, {"reader": false, "ar": [[3071.0, "قال الإمام ابن رجب رحمه الله تعالى ـ في معرض سياقه للنهي عن المبالغة في تعظيم الأولياء والصالحين وتنزيلهم منزلةَ الأنبياء ـ قال رحمه الله:"], [3082.6, "«وكذلك التبرّك بالآثار؛ فإنما كان يفعله الصحابة مع النبيّ صلى الله عليه وسلم، ولم يكونوا يفعلونه مع بعضهم، ولا يفعله التابعون مع الصحابة» ـ أي التبرّك الآن بالذات:"], [3102.8, "تبرّكٌ بالريق، والشعر، واللباس،"], [3105.8, "والعرق ـ «ولا يفعله التابعون مع الصحابة مع علوّ قدرهم، فدلّ على أنّ هذا لا يُفعل إلا مع النبيّ صلى الله عليه وسلم، مثل التبرّك بوضوئه، وفضلاته، وشعره، وشربِ فضل طعامه وشرابه». انتهى كلامه."]], "tr": [[3071.0, "İmam İbn Receb —Allah Teâlâ ona rahmet etsin— velîleri ve sâlihleri tazimde aşırı gitmenin ve onları peygamberlerin mertebesine indirmenin yasaklığını anlattığı bağlamda —Allah ona rahmet etsin— şöyle demiştir:"], [3082.6, "\"Eserlerle teberrük de böyledir; bunu sahabe ancak Peygamber sallallâhu aleyhi ve sellem ile yapardı, birbirleriyle yapmazlardı;"], [3092.9, "tâbiîn de bunu sahabe ile yapmazdı\" —yani şimdi zâtla teberrük:"], [3102.8, "tükürükle, saçla, elbiseyle ve terle teberrük— \"tâbiîn, sahabenin kadri yüce olmasına rağmen bunu onlarla yapmazdı."], [3114.1, "Bu da bunun ancak Peygamber sallallâhu aleyhi ve sellem ile yapıldığını gösterir;"], [3120.8, "onun abdest suyuyla, artıklarıyla, saçıyla teberrük etmek ve yemeğinin ve içeceğinin artığını içmek gibi.\" Sözü burada bitti."]]}]}, {"ts": "52:12", "title": "6. Külliye (devam): Şâtıbî'nin el-İ'tisâm'daki sözü ve icmâ nakli · Kapanış", "paras": [{"reader": false, "ar": [[3132.0, "قال الإمام الشاطبيّ رحمه الله تعالى في كتابه «الاعتصام» ـ والذي أنصح كلَّ طالب علمٍ بقراءته؛"], [3142.0, "فإنّ من أراد أن يكون قويَّ الحجّة في الردّ على أهل البدع فدونه هذا الكتاب،"], [3150.0, "فإنّ أغلب القواعد التي قُرّرت في البدع مأخوذةٌ من رجلين فحلين عظيمين:"], [3157.0, "ابن تيميّة والشاطبيّ، رحم الله الجميع رحمةً واسعة ـ قال الشاطبيّ رحمه الله تعالى ـ اللهمّ اغفر له وارحمه ـ:"], [3168.0, "«الصحابة رضي الله عنهم بعد موته عليه السلام لم يقع من أحدٍ منهم شيءٌ من ذلك بالنسبة إلى من خلفه؛ إذ لم يترك النبيّ صلى الله عليه وسلم بعده في الأمّة أفضلَ من أبي بكرٍ الصدّيق، فهو كان خليفتَه، ولم يُفعل به شيءٌ من ذلك، ولا عمرَ رضي الله عنهما، وهو» ـ أي عمر ـ «كان أفضلَ الأمّة بعده» ـ أي بعد أبي بكر."]], "tr": [[3132.0, "İmam Şâtıbî —Allah Teâlâ ona rahmet etsin— el-İ'tisâm adlı kitabında —ki her talebeye onu okumasını tavsiye ederim;"], [3136.5, "çünkü bid'at ehline reddiyede delili güçlü olmak isteyen kişinin önünde işte bu kitap vardır."], [3142.0, "Zira bid'atler konusunda ortaya konan kaidelerin çoğu iki büyük, güçlü adamdan alınmıştır:"], [3146.0, "İbn Teymiyye ve Şâtıbî. Allah hepsine geniş rahmetiyle rahmet etsin— Şâtıbî —Allah Teâlâ ona rahmet etsin;"], [3152.9, "Allah'ım, onu bağışla ve ona merhamet et— şöyle demiştir:"], [3157.0, "\"Sahabe —Allah onlardan razı olsun— onun (aleyhisselâm) vefatından sonra, onlardan hiçbirinden onun yerine geçen kimseye karşı bunlardan bir şey vâki olmamıştır."], [3163.6, "Çünkü Peygamber sallallâhu aleyhi ve sellem kendisinden sonra ümmette Ebû Bekir es-Sıddîk'tan daha faziletli birini bırakmamıştır;"], [3168.0, "o onun halifesiydi ve ona bunlardan hiçbir şey yapılmamıştır."], [3177.0, "Ömer'e de —Allah ikisinden de razı olsun— (yapılmamıştır);"], [3185.9, "o da\" —yani Ömer— \"ondan sonra\" —yani Ebû Bekir'den sonra— \"ümmetin en faziletlisiydi."]]}, {"reader": false, "ar": [[3204.0, "كلُّ فاضلٍ فإنّ المفضولَ الذي بعده لا يفعل معه كما كان الصحابة يفعلون مع من فوقهم،"], [3213.0, "وهو النبيّ صلى الله عليه وسلم ـ انتبه:"], [3216.2, "جاء بأبي بكر، ثم بيّن أنّ عمر لم يكن يفعل معه،"], [3219.0, "ثم جاء بعمرَ الآن ـ قال:"], [3221.5, "«ثم كذلك عثمان، ثم عليّ، ثم سائرُ الصحابة الذين لا أحدَ أفضلُ منهم في الأمّة، ثم لم يثبت لواحدٍ منهم من طريقٍ صحيحٍ معروفٍ أنّ متبرّكًا تبرّك به على أحد تلك الوجوه أو نحوها» ـ أي التبرّك بالشعر وغيره،"], [3243.0, "ما فيه، ما فيه ـ «بل اقتصروا فيهم» ـ أي في الأولياء والصالحين في التبرّك بهم ـ «بل اقتصروا فيهم على الاقتداء بالأفعال والأقوال والسِّيَر التي اتّبعوا فيها النبيّ صلى الله عليه وسلم."]], "tr": [[3204.0, "Her faziletli kişiye, ondan sonra gelen ve ondan daha az faziletli olan kimse, sahabenin kendilerinin üstündeki —yani Peygamber sallallâhu aleyhi ve sellem'e— yaptığı gibi yapmaz."], [3216.2, "—Dikkat et: Ebû Bekir'i zikretti, sonra Ömer'in onunla (böyle bir şey) yapmadığını açıkladı, şimdi de Ömer'i zikrediyor— Dedi ki:"], [3221.5, "\"Sonra Osman da böyledir, sonra Ali, sonra ümmette kendilerinden daha faziletli kimse bulunmayan sahabenin geri kalanı."], [3229.6, "Sonra onlardan hiçbiri için, bir teberrük edenin o şekillerden biriyle ya da benzeriyle onunla teberrük ettiği sahih ve bilinen bir yoldan sabit olmamıştır\" —yani saçla ve başka şeylerle teberrük;"], [3243.2, "böyle bir şey yok, yok— \"Bilakis onlar hakkında\" —yani velîler ve sâlihler hakkında, onlarla teberrükte— \"bilakis onlar hakkında, Peygamber sallallâhu aleyhi ve sellem'e tâbi oldukları fiillere, sözlere ve hayat tarzlarına uymakla yetindiler."]]}, {"reader": false, "ar": [[3264.0, "فهو إذن» ـ أي تركُهم للتبرّك الذاتيّ ببعضهم،"], [3268.6, "انتبه ـ «فهو إذن إجماعٌ منهم على ترك تلك الأشياء كلّها»."], [3277.0, "انتهى كلامه، وهذا حكايةُ الإجماع."], [3281.0, "وبناءً على ذلك يتبيّن لنا ممّا سبق تقريرُه أنّ ما رآه بعضُ أهل العلم ـ رحمهم الله تعالى ـ من قياس الصالحين على رسول الله صلى الله عليه وسلم في جواز التبرّك بذواتهم وآثارهم أنه غيرُ صحيح."]], "tr": [[3264.0, "Öyleyse bu\" —yani onların birbirleriyle zâtî teberrüğü terk etmeleri;"], [3268.6, "dikkat et— \"öyleyse bu, onlardan bu şeylerin hepsini terk etme üzerine bir icmâdır.\" Sözü burada bitti;"], [3281.0, "bu da icmâ naklidir. Buna göre, önceden ortaya konandan şu bize açıkça ortaya çıkıyor:"], [3288.8, "Bazı ehl-i ilmin —Allah Teâlâ onlara rahmet etsin— zâtlarıyla ve eserleriyle teberrüğün caiz oluşunda sâlihleri Resûlullah sallallâhu aleyhi ve sellem'e kıyas etme görüşü sahih değildir."]]}, {"reader": false, "ar": [[3302.0, "فإنّ إجماع الصحابة على ترك التبرّك بالذوات والآثار مع غير النبيّ صلى الله عليه وسلم إجماعٌ صحيحٌ صريحٌ يُردّ على كلّ من خالفه."], [3315.0, "اللهُ المستعان. إن شاء الله أنّنا نكتفي بهذا،"], [3320.0, "لعلّنا نكتفي بهذا القدر،"], [3322.0, "والله أعلم، وصلّى الله وسلّم على نبيّه."]], "tr": [[3302.0, "Çünkü sahabenin, Peygamber sallallâhu aleyhi ve sellem dışındakilerle zâtlar ve eserler yoluyla teberrüğü terk etmedeki icmâı, kendisine muhalefet eden herkese karşı (delil olarak) ileri sürülen sahih ve açık bir icmâdır."], [3315.0, "Yardımı istenecek olan Allah'tır. İnşallah bununla yetiniyoruz;"], [3319.7, "umarım bu kadarıyla yetiniriz. Allah en iyisini bilir."], [3322.2, "Allah Peygamberine salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
