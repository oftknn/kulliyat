<script>
const D={"no": 46, "vid": "yaTZ8Yt1_n0", "title_ar": "الدرس (٤٦) من شرح كليات العقيدة — من كليات توحيد الألوهية: التبرك", "title_tr": "Şerhu Külliyyâti'l-Akîde — 46. Ders: Ulûhiyyet Tevhidi Külliyeleri — Teberrük (Sahabenin Yapmadığı Teberrük Şekilleri, Peygamber'in Kastetmediği Yerler, Velîlerin Bereketi, Her Müslümandaki Bereket, Bereketin Sebebi ve Yaratıcısı, Peygamber'in Zâtıyla Teberrüğün Ona Mahsus Oluşu)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Sahabenin yapmadığı, Peygamber ile bereket talebi şekillerinin her biri bid'attir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.1, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.2, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.7, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [10.8, "لا نزال ـ ولله الحمدُ والمِنّة ـ في سياق شرح ما يتعلّق بكلّيّات توحيد الألوهية،"], [17.5, "ولا نزال أيضًا في باب التبرّك."], [20.6, "وقد شرحنا في الدرس الماضي عشرًا من الكلّيّات،"], [24.8, "وهذا الدرسَ أيضًا نُكمِل جُمَلًا من الكلّيّات المتعلّقة بباب التبرّك،"], [29.9, "ولكنها مختصرة، وسيكون أكثرُ شرحي نُقولًا عن أهل العلم،"], [35.0, "فأسأل الله أن يُعينكم."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.5, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.8, "—Hamd ve minnet Allah'a— hâlâ ulûhiyyet tevhidi külliyeleriyle ilgili şerh bağlamındayız;"], [16.0, "hâlâ teberrük babındayız. Geçen derste on külliye şerh ettik."], [20.6, "Bu derste de teberrük babıyla ilgili birtakım külliyeleri tamamlıyoruz;"], [26.3, "ancak bunlar kısadır ve şerhimin çoğu ehl-i ilimden nakiller olacak."], [33.2, "Allah'tan size yardım etmesini dilerim."]]}, {"reader": false, "ar": [[37.0, "الكلّيّة الأولى في هذا الدرس:"], [41.0, "<b>كلُّ صورةٍ من صور طلب البركة بالنبيّ صلى الله عليه وسلم لم يفعلها أصحابُه فبدعة.<\/b> كلُّ صورةٍ من صور طلب البركة من النبيّ صلى الله عليه وسلم لم يفعلها أصحابُه رضي الله عنهم فبدعة."], [62.0, "أُعيدها مرّةً ثالثة: <b>كلُّ صورةٍ من صور طلب البركة بالنبيّ صلى الله عليه وسلم لم يفعلها أصحابُه رضي الله عنهم فبدعة.<\/b>"]], "tr": [[37.0, "Bu dersteki <b>1. külliye: Peygamber sallallâhu aleyhi ve sellem ile bereket talep etme şekillerinden, ashâbının yapmadığı her şekil bid'attir.<\/b> Peygamber sallallâhu aleyhi ve sellem'den bereket talep etme şekillerinden, ashâbının —Allah onlardan razı olsun— yapmadığı her şekil bid'attir."], [62.0, "Üçüncü kez tekrar ediyorum: <b>Peygamber sallallâhu aleyhi ve sellem ile bereket talep etme şekillerinden, ashâbının —Allah onlardan razı olsun— yapmadığı her şekil bid'attir.<\/b>"]]}, {"reader": false, "ar": [[71.0, "أقول وبالله التوفيق: لأنّ المتقرّر في القواعد أنّ ما ليس من الدين ولا من الشرع في عهد النبيّ صلى الله عليه وسلم فلا يمكن أن يكون أبدًا من الدين ولا من الشريعة بعد عهده."], [85.0, "ولأنّ المتقرّر في القواعد أنّ كلَّ تعبّدٍ ليس عليه أصحابُ محمّدٍ صلى الله عليه وسلم فلا يمكن أن يكون تعبّدًا صحيحًا."], [97.0, "فالفيصلُ بيننا وبين القوم هو ما كان عليه أصحابُ النبيّ صلى الله عليه وسلم."]], "tr": [[71.0, "Tevfik Allah'tandır, derim ki: Çünkü kaidelerde yerleşik olan şudur:"], [75.1, "Peygamber sallallâhu aleyhi ve sellem'in zamanında dinden ve şeriatten olmayan bir şeyin, onun zamanından sonra dinden ve şeriatten olması asla mümkün değildir."], [85.0, "Yine kaidelerde yerleşik olan şudur:"], [88.0, "Muhammed sallallâhu aleyhi ve sellem'in ashâbının üzerinde olmadığı her ibadet, sahih bir ibadet olamaz."], [97.0, "Dolayısıyla bizimle o topluluk arasındaki ayırıcı ölçü, Peygamber sallallâhu aleyhi ve sellem'in ashâbının üzerinde bulunduğu şeydir."]]}, {"reader": false, "ar": [[103.0, "فإذا اخترع المخترعون المتأخّرون صفةً للتبرّك بالنبيّ صلى الله عليه وسلم فإنّنا نجعلها موقوفةً حتى ننظر إلى أصحابه رضي الله عنهم:"], [115.0, "هل فعلوها؟ فإن كان من صور التبرّك التي فعلوها فإنّنا نُفتي بجوازها ونقول فيها:"], [122.0, "لا بأس. وأمّا إن كانت من الصور المحدَثة التي ليس عليها أصحابُ محمّدٍ صلى الله عليه وسلم فإنّنا مباشرةً نقول بأنها من البدع المحدَثة المستنكَرة،"], [137.0, "التي تدخل تحت قول الله عز وجل:"], [139.2, "<span class=\"ayah\">﴿أَمْ لَهُمْ شُرَكَاءُ شَرَعُوا لَهُم مِّنَ الدِّينِ مَا لَمْ يَأْذَن بِهِ اللَّهُ﴾<\/span> <span class=\"ref\">[الشورى: ٢١]<\/span>،"], [143.0, "وتحت قوله صلى الله عليه وسلم:"], [145.6, "«من أحدث في أمرنا هذا ما ليس منه فهو ردّ»،"], [150.0, "وتحت قوله صلى الله عليه وسلم:"], [152.1, "«من عمل عملًا ليس عليه أمرُنا فهو ردّ»."]], "tr": [[103.0, "Sonradan gelen icatçılar Peygamber sallallâhu aleyhi ve sellem ile teberrük için bir şekil icat ettiklerinde, ashâbına —Allah onlardan razı olsun— bakıncaya kadar onu askıda bırakırız:"], [115.0, "Onlar bunu yaptılar mı? Eğer onların yaptığı teberrük şekillerindense caiz olduğuna fetva verir ve onun hakkında \"Sakıncası yok\" deriz."], [122.0, "Ama Muhammed sallallâhu aleyhi ve sellem'in ashâbının üzerinde olmadığı, sonradan çıkarılmış şekillerden ise, doğrudan onun sonradan çıkarılmış, münker bid'atlerden olduğunu söyleriz."], [133.6, "Bunlar Allah Azze ve Celle'nin şu sözünün kapsamına girer:"], [139.2, "<span class=\"ayah\">﴿Yoksa onların, Allah'ın izin vermediği şeyleri dinden kendilerine şeriat kılan ortakları mı var?﴾<\/span> [Şûrâ 21]."], [142.4, "Ve onun sallallâhu aleyhi ve sellem şu sözünün kapsamına girer:"], [145.6, "\"Kim bu işimizde ondan olmayan bir şey ihdas ederse, o reddedilmiştir.\" Ve onun sallallâhu aleyhi ve sellem şu sözünün kapsamına girer:"], [152.1, "\"Kim bizim emrimizin üzerinde olmadığı bir amel işlerse, o reddedilmiştir.\""]]}, {"reader": false, "ar": [[155.0, "ولأنّ المتقرّر في القواعد أنّ كلَّ شيءٍ إن جاز التبرّك به فإنّنا نتبرّك به على الصفة التي أجازها الشرع لنا،"], [168.0, "فلا يجوز لنا أن نُحدِث صفةً جديدةً نطلب بها بركةً زمانيّةً أو مكانيّةً أو بركةَ عينٍ من الأعيان إلا إذا أجاز الشارع لنا هذه الصفة؛"], [182.5, "لأنّ التبرّك بكلّ متعلّقاته غيبيّ،"], [185.8, "وما كان غيبيًّا فيكون توقيفيًّا."]], "tr": [[155.0, "Yine kaidelerde yerleşik olan şudur:"], [157.2, "Kendisiyle teberrük caiz olan her şeyle, şeriatin bize caiz kıldığı şekil üzere teberrük ederiz."], [165.3, "Dolayısıyla Şâri' bize o şekli caiz kılmadıkça, kendisiyle zamana ait, mekâna ait ya da varlıklardan bir varlığa ait bir bereket talep ettiğimiz yeni bir şekil ihdas etmemiz caiz değildir."], [182.5, "Çünkü teberrük bütün taalluklarıyla gaybîdir;"], [185.1, "gaybî olan da tevkîfîdir (nassa bağlıdır)."]]}, {"reader": false, "ar": [[189.0, "وقد أحدث الناسُ صفاتٍ كثيرةً في طلب البركة بالنبيّ صلى الله عليه وسلم،"], [194.0, "وليس عليها هديُ أصحابه رضي الله تعالى عنهم وأرضاهم."], [201.0, "فمن ذلك ـ أيّها الأحبّة ـ طلبُ الدعاء أو الشفاعة من النبيّ صلى الله عليه وسلم عند قبره،"], [211.0, "كما ترونه وتسمعونه كثيرًا،"], [213.3, "بحجّة أنهم يطلبون البركة من النبيّ صلى الله عليه وسلم."], [219.0, "فهم يطلبون بركةَ الدعاء منه بعد موته عند قبره،"], [223.5, "ويطلبون بركةَ شفاعته عند قبره،"], [226.0, "وهم يدعونه من دون الله عز وجل ويستشفعون به،"], [230.0, "ويجعلون ذلك من باب التوسّلات ومن باب التبرّك."]], "tr": [[189.0, "İnsanlar Peygamber sallallâhu aleyhi ve sellem ile bereket talep etmede birçok şekil ihdas etmişlerdir;"], [193.2, "bunlar ashâbının —Allah Teâlâ onlardan razı olsun ve onları razı etsin— yolu üzere değildir."], [201.0, "Ey sevgili kardeşler, bunlardan biri, Peygamber sallallâhu aleyhi ve sellem'den kabrinin yanında dua veya şefaat istemektir;"], [210.4, "bunu çokça görüyor ve işitiyorsunuz."], [213.3, "Gerekçeleri de Peygamber sallallâhu aleyhi ve sellem'den bereket talep ettikleridir."], [219.0, "Onun ölümünden sonra kabrinin yanında ondan duanın bereketini isterler, kabrinin yanında şefaatinin bereketini isterler."], [225.0, "Hâlbuki onlar onu Allah Azze ve Celle'yi bırakıp çağırıyor ve onu şefaatçi ediniyorlar."], [230.0, "Bunu da tevessüller babından ve teberrük babından sayıyorlar."]]}, {"reader": false, "ar": [[236.0, "وقد أجمع أهلُ السنّة والجماعة على أنّ ذلك من الأعمال المنكَرة التي لا تجوز في دين الله عز وجل،"], [244.0, "وليس على ذلك هديُ أحدٍ من أصحاب محمّدٍ صلى الله عليه وسلم."], [249.0, "وقد كان الصحابة تُصيبهم القوارعُ والزوابعُ والقحطُ في المدينة،"], [256.0, "وليس بينهم وبين القبر إلا بضعُ خطوات،"], [257.8, "ولم يثبت عن أحدٍ منهم أنه كان يأتي إلى قبر النبيّ صلى الله عليه وسلم ويستغفره،"], [265.0, "أو يسأله الاستغفارَ لأمّته،"], [266.8, "أو يدعوه من دون الله عز وجل،"], [270.0, "أو يطلب شفاعته. فكلّ ذلك ممّا هو معلومٌ من الدين بالضرورة."]], "tr": [[236.0, "Ehl-i Sünnet ve'l-Cemaat bunun, Allah Azze ve Celle'nin dininde caiz olmayan münker amellerden olduğu üzerinde icmâ etmiştir."], [241.5, "Muhammed sallallâhu aleyhi ve sellem'in ashâbından hiçbirinin yolu bu üzere değildir."], [246.1, "Sahabeye Medine'de felaketler, kasırgalar ve kıtlık isabet ederdi;"], [249.0, "onlarla kabir arasında da sadece birkaç adım vardı."], [254.7, "Buna rağmen onlardan hiçbirinin Peygamber sallallâhu aleyhi ve sellem'in kabrine gelip ondan mağfiret dilediği, ya da ümmeti için ondan istiğfar istediği, ya da onu Allah Azze ve Celle'yi bırakıp çağırdığı, ya da şefaatini istediği sabit olmamıştır."], [273.0, "Bütün bunlar dinden zorunlu olarak bilinen şeylerdendir."]]}, {"reader": false, "ar": [[277.0, "قال الإمام ابن تيميّة رحمه الله تعالى:"], [281.0, "«لا يقف عند القبر للدعاء لنفسه؛ فإنّ هذا بدعة، ولم يكن أحدٌ من الصحابة يقف عنده يدعو لنفسه، ولكن كانوا يستقبلون القبلة ويدعون في مسجده». انتهى كلامه."]], "tr": [[277.0, "İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [281.0, "\"Kendisi için dua etmek üzere kabrin yanında durmaz;"], [285.0, "çünkü bu bid'attir. Sahabeden hiçbiri kendisi için dua ederek onun yanında durmazdı;"], [292.1, "bilakis kıbleye yönelir ve onun mescidinde dua ederlerdi.\" Sözü burada bitti."]]}]}, {"ts": "05:00", "title": "1. Külliye (devam): İbn Teymiyye ve İbn Abdilhâdî'den nakiller", "paras": [{"reader": false, "ar": [[300.0, "وقال رحمه الله تعالى في موضعٍ آخر:"], [303.7, "«ليس عندهم» ـ أي عند الصحابة رضي الله عنهم ـ «عن نبيّهم صلى الله عليه وسلم نقلٌ بذلك، ولا فعل هذا أحدٌ من أصحاب نبيّهم صلى الله عليه وسلم ولا التابعين لهم بإحسان، ولا استحبّ ذلك أحدٌ من أئمّة المسلمين، لا الأئمّةُ الأربعة ولا غيرُهم. ولا ذكر أحدٌ من الأئمّة ـ لا في مناسك الحجّ ولا غيرها ـ أنه يُستحبّ لأحدٍ أن يسأل النبيَّ صلى الله عليه وسلم عند قبره أن يشفع له، أو يدعوَ لأمّته، أو يشكوَ إليه ما نزل بأمّته من مصائب الدنيا والدين."]], "tr": [[300.0, "Yine —Allah Teâlâ ona rahmet etsin— başka bir yerde şöyle demiştir:"], [301.0, "\"Onların\" —yani sahabenin, Allah onlardan razı olsun— \"yanında peygamberlerinden sallallâhu aleyhi ve sellem bu konuda bir nakil yoktur."], [303.7, "Peygamberlerinin sallallâhu aleyhi ve sellem ashâbından hiçbiri ve onlara güzellikle tâbi olanlar bunu yapmamıştır."], [312.0, "Müslümanların imamlarından hiçbiri de —ne dört imam ne de başkaları— bunu müstehap görmemiştir."], [320.0, "İmamlardan hiçbiri —ne hac menâsikinde ne de başka bir yerde— bir kimsenin Peygamber sallallâhu aleyhi ve sellem'den kabrinin yanında kendisine şefaat etmesini, ya da ümmetine dua etmesini istemesinin, ya da ümmetinin başına gelen dünya ve din musibetlerini ona şikâyet etmesinin müstehap olduğunu zikretmemiştir."]]}, {"reader": false, "ar": [[344.0, "وكان أصحابُه يُبتلَون بأنواعٍ من البلاء بعد موته:"], [350.0, "فتارةً بالجدب، وتارةً بنقص الرزق،"], [353.4, "وتارةً بالخوف وقوّة العدوّ،"], [356.1, "وتارةً بالذنوب والمعاصي. ولم يكن أحدٌ منهم يأتي إلى قبر الرسول صلى الله عليه وسلم،"], [365.0, "ولا قبرِ الخليل عليه السلام،"], [367.4, "ولا قبرِ أحدٍ من الأنبياء،"], [369.8, "فيقول: نشكو إليك جدبَ الزمان،"], [372.1, "أو قوّةَ العدوّ، أو كثرةَ الذنوب."], [375.0, "ولا يقول: سَلِ اللهَ لنا ـ أو لأمّتك ـ أن يرزقهم،"], [380.8, "أو ينصرهم، أو يغفر لهم."], [384.0, "بل هذا وما يُشبهه من البدع المحدَثة التي لم يستحبّها أحدٌ من أئمّة المسلمين،"], [394.0, "فليست واجبةً ولا مستحبّةً باتّفاق أئمّة المسلمين»."], [400.0, "انتهى كلامه رحمه الله."]], "tr": [[344.0, "Onun vefatından sonra ashâbı çeşitli belalarla imtihan edilirdi:"], [350.0, "Bazen kıtlıkla, bazen rızık azlığıyla, bazen korku ve düşmanın güçlü olmasıyla, bazen de günahlar ve isyanlarla."], [359.0, "Onlardan hiçbiri Resûl sallallâhu aleyhi ve sellem'in kabrine, Halîl (İbrâhim) aleyhisselâm'ın kabrine ya da peygamberlerden herhangi birinin kabrine gelip de 'Zamanın kıtlığını, düşmanın gücünü ya da günahların çokluğunu sana şikâyet ediyoruz' demezdi."], [375.0, "'Bizim için —ya da ümmetin için— Allah'tan onlara rızık vermesini, onlara yardım etmesini ya da onları bağışlamasını iste' de demezdi."], [384.0, "Bilakis bu ve buna benzeyenler, Müslümanların imamlarından hiçbirinin müstehap görmediği, sonradan çıkarılmış bid'atlerdendir."], [391.4, "Müslümanların imamlarının ittifakıyla bunlar ne vâciptir ne de müstehaptır.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[402.0, "وقال الإمام ابن تيميّة رحمه الله تعالى:"], [406.0, "«الله تعالى لم يأذن لنا أن نسأل ميّتًا حاجةً، لا نبيًّا ولا غيرَه، ولا يُطلب منه جلبُ منفعةٍ ولا دفعُ مضرّة، ولا أن نقصد بزيارة قبره إجابةَ دعائنا، بل شرع لنا الإيمانَ بهم» ـ أي بالأنبياء ـ «وبما جاؤوا به، وشرع لنا السلامَ عليهم»."], [438.0, "اللهمّ صلِّ وسلِّم على أنبيائك ورسلك."]], "tr": [[402.0, "İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [403.1, "\"Allah Teâlâ bize, ne bir peygamberden ne de başkasından, ölmüş birinden bir ihtiyaç istememize izin vermemiştir."], [406.0, "Ondan bir menfaat getirmesi ya da bir zararı defetmesi istenmez."], [412.9, "Onun kabrini ziyaretle duamızın kabul edilmesini kastetmemize de izin vermemiştir."], [423.0, "Bilakis bize onlara\" —yani peygamberlere— \"ve onların getirdiklerine iman etmeyi meşru kılmış, onlara selâm vermeyi de bize meşru kılmıştır.\" Allah'ım!"], [438.0, "Peygamberlerine ve resullerine salât ve selâm et."]]}, {"reader": false, "ar": [[441.0, "وقال أيضًا: «أمّا دعاءُ الرسول صلى الله عليه وسلم، وطلبُ الحوائج منه، وطلبُ شفاعته عند قبره أو بعد موته، فهذا لم يفعله أحدٌ من السلف. ومعلومٌ أنه لو كان قصدُ الدعاء عند القبر مشروعًا لفعله الصحابة والتابعون، وكذلك السؤالُ به، فكيف بدعائه وسؤاله بعد موته؟! فدلّ ذلك على أنّ ما في الحكاية المنقطعة من قوله: \"استقبِلْه واستشفِعْ به\"»."]], "tr": [[441.0, "Yine şöyle demiştir: \"Resûl sallallâhu aleyhi ve sellem'e dua etmek, ondan ihtiyaçları istemek, kabrinin yanında ya da ölümünden sonra şefaatini istemek;"], [451.3, "bunu selefin hiçbiri yapmamıştır. Bilinmektedir ki, eğer kabrin yanında dua etmeyi kastetmek meşru olsaydı, sahabe ve tâbiîn onu yapardı;"], [460.9, "onunla (onu vesile ederek) istemek de böyledir."], [464.0, "Ya ölümünden sonra ona dua etmek ve ondan istemek nasıl olur?!"], [471.4, "Bu, şunu gösterir: Kopuk (senedi munkatı') hikâyedeki 'Ona yönel ve onu şefaatçi edin' sözü…\""]]}, {"reader": false, "ar": [[478.0, "وهي قصّةٌ منقولةٌ عن الإمام مالك،"], [481.0, "لمّا سأله بعضُ الخلفاء:"], [482.3, "أين أقف؟ قال: استقبِلْه ـ أي استقبِلِ القبر ـ واستشفِعْ به."], [486.0, "فابنُ تيميّة يتكلّم عن هذه الرواية."], [489.0, "قال: «فدلّ ذلك على أنّ ما في الحكاية المنقطعة من قوله: \"استقبِلْه واستشفِعْ به\" كذبٌ على مالك، مخالفٌ لأقواله وأقوال الصحابة والتابعين وأفعالهم التي يفعلها مالكٌ وأصحابُه، ونقلها سائرُ العلماء؛ إذ كان أحدٌ منهم لم يستقبل القبرَ للدعاء لنفسه، فضلًا عن أن يستقبله ويستشفع به، ويقول له: يا رسول الله، اشفع لي، أو ادعُ لي، أو يشتكي إليه مصائبَ الدين والدنيا."]], "tr": [[478.0, "Bu, İmam Mâlik'ten nakledilen bir kıssadır:"], [479.0, "Halifelerden biri ona \"Nerede durayım?\" diye sorunca, \"Ona yönel —yani kabre yönel— ve onu şefaatçi edin\" demiş."], [482.3, "İbn Teymiyye işte bu rivayetten bahsediyor."], [483.5, "Şöyle diyor: \"Bu, şunu gösterir:"], [484.6, "Kopuk hikâyedeki 'Ona yönel ve onu şefaatçi edin' sözü Mâlik'e karşı yalandır."], [489.0, "Mâlik'in sözlerine, sahabe ve tâbiînin sözlerine ve Mâlik ile arkadaşlarının yaptığı, bütün âlimlerin de naklettiği fiillerine aykırıdır."], [499.8, "Çünkü onlardan hiçbiri kendisi için dua etmek üzere kabre yönelmezdi;"], [509.5, "bırakın ona yönelip onu şefaatçi edinmeyi ve ona 'Ey Allah'ın Resûlü, bana şefaat et' ya da 'Bana dua et' demeyi, ya da din ve dünya musibetlerini ona şikâyet etmeyi."]]}, {"reader": false, "ar": [[527.0, "أو يطلب منه ـ أو من غيره من الموتى من الأنبياء والصالحين،"], [533.0, "أو من الملائكة الذين لا يراهم ـ أن يشفعوا له،"], [537.0, "أو يشتكي إليهم المصائب؛"], [539.0, "فإنّ هذا كلَّه من فعل النصارى وغيرهم من المشركين،"], [544.0, "ومن ضاهاهم من مبتدعة هذه الأمّة."], [548.0, "ليس هذا من فعل السابقين الأوّلين من المهاجرين والأنصار والذين اتّبعوهم بإحسان،"], [555.0, "ولا ممّا أمر به أحدٌ من أئمّة المسلمين»."]], "tr": [[527.0, "Ya da ondan —veya ondan başka ölülerden, peygamberlerden ve sâlihlerden, ya da görmediği meleklerden— kendisine şefaat etmelerini istemeyi, ya da musibetleri onlara şikâyet etmeyi (bırakın)."], [539.0, "Çünkü bütün bunlar Hristiyanların ve diğer müşriklerin ve bu ümmetin bid'atçilerinden onlara benzeyenlerin işidir."], [548.0, "Bu, Muhâcirler ve Ensâr'dan ilk öncülerin ve onlara güzellikle tâbi olanların işi değildir;"], [555.0, "Müslümanların imamlarından herhangi birinin emrettiği şeylerden de değildir.\""]]}, {"reader": false, "ar": [[560.0, "وقال الإمام ابن عبد الهادي رحمه الله تعالى:"], [564.0, "«السلفُ كلُّهم متّفقون على أنّ الزائر» ـ أي للنبيّ صلى الله عليه وسلم ـ «لا يسأله شيئًا، ولا يطلب منه ما يُطلب منه في حياته ويُطلب منه يوم القيامة، لا شفاعةً ولا استغفارًا ولا غيرَ ذلك. ومن المعلوم أنه لمّا رأى عليُّ بن الحسين رضي الله عنهما رجلًا كان يجيء إلى فُرجةٍ كانت عند قبر النبيّ صلى الله عليه وسلم فيدخل فيها فيدعو، فنهاه وقال: ألا أُحدّثكم حديثًا سمعتُه عن أبي عن جدّي» ـ أي عليّ بن أبي طالب ـ «عن رسول الله صلى الله عليه وسلم أنه قال: «لا تتّخذوا قبري عيدًا، ولا بيوتَكم قبورًا، وصلّوا عليّ؛ فإنّ تسليمكم يبلغني أينما كنتم»»."]], "tr": [[560.0, "İmam İbn Abdilhâdî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [564.0, "\"Selefin hepsi şu konuda ittifak etmiştir:"], [567.3, "Ziyaretçi\" —yani Peygamber sallallâhu aleyhi ve sellem'i ziyaret eden— \"ondan bir şey istemez;"], [574.5, "hayatında ondan istenen ve kıyamet günü ondan istenecek olan şeyi —ne şefaat ne istiğfar ne de başka bir şey— ondan istemez."], [585.9, "Bilinen bir husustur ki, Ali b."], [588.8, "Hüseyin —Allah ikisinden de razı olsun— Peygamber sallallâhu aleyhi ve sellem'in kabrinin yanındaki bir aralığa gelip içine girerek dua eden bir adam görünce onu bundan nehyetti ve şöyle dedi:"], [601.1, "Size babamdan, o da dedemden\" —yani Ali b."], [604.8, "Ebî Tâlib'den— \"o da Resûlullah sallallâhu aleyhi ve sellem'den işittiğim bir hadisi anlatayım mı?"], [610.4, "O şöyle buyurmuştur: 'Kabrimi bayram yeri edinmeyin, evlerinizi de kabirlere çevirmeyin."], [615.1, "Bana salât edin; çünkü nerede olursanız olun selâmınız bana ulaşır.'\""]]}]}, {"ts": "10:21", "title": "1. Külliye (sonu): Kabir yanında ibadet etmenin bid'at oluşu", "paras": [{"reader": false, "ar": [[621.0, "وهكذا سار عليه أصحابُ النبيّ صلى الله عليه وسلم من غير نكيرٍ فيما بينهم."], [629.0, "فما يُفعل عند قبره من طلب الاستغفار لنا أو للأمّة،"], [634.1, "أو طلب الشفاعة، أو غير ذلك،"], [639.0, "كلُّ ذلك من التبرّك الذي ليس عليه أصحابُ النبيّ صلى الله عليه وسلم."]], "tr": [[621.0, "Peygamber sallallâhu aleyhi ve sellem'in ashâbı da aralarında hiçbir itiraz olmaksızın bu yol üzere yürüdüler."], [629.0, "Dolayısıyla onun kabrinin yanında yapılan şeyler —bizim için ya da ümmet için istiğfar istemek, ya da şefaat istemek veya başka şeyler— bunların hepsi, Peygamber sallallâhu aleyhi ve sellem'in ashâbının üzerinde olmadığı teberrük türündendir."]]}, {"reader": false, "ar": [[644.0, "ومن الصور أيضًا: أداءُ بعض العبادات عند القبر النبويّ،"], [651.0, "أداءُ بعض العبادات عند القبر النبويّ."], [655.0, "فمن البدع التعبّدُ عند قبر النبيّ صلى الله عليه وسلم بالصلاة،"], [661.6, "والجلوسُ عند القبر أو حول القبر لتلاوة القرآن الكريم وذكر الله عز وجل."], [670.0, "ولله درُّ السيوطيّ رحمه الله تعالى لمّا قال:"], [673.0, "«ومن البدع أيضًا طوافُهم بالقبر الشريف، ولا يحلّ ذلك، وكذلك إلصاقُهم بطونَهم وظهورَهم بجدار القبر، وتقبيلُهم إيّاه بالصندوق الذي كان عند رأس النبيّ صلى الله عليه وسلم، ومسحُه باليد، وكلُّ ذلك منهيٌّ عنه»."]], "tr": [[644.0, "(Bu bid'at) şekillerden biri de şudur:"], [647.0, "Peygamber kabrinin yanında bazı ibadetleri eda etmek;"], [651.0, "Peygamber kabrinin yanında bazı ibadetleri eda etmek."], [655.0, "Peygamber sallallâhu aleyhi ve sellem'in kabrinin yanında namazla ibadet etmek, Kur'ân-ı Kerîm okumak ve Allah Azze ve Celle'yi zikretmek için kabrin yanında ya da etrafında oturmak bid'atlerdendir."], [668.7, "Allah Suyûtî'den razı olsun —Allah Teâlâ ona rahmet etsin— ne güzel söylemiş:"], [673.0, "\"Onların şerif kabri tavaf etmeleri de bid'atlerdendir;"], [678.0, "bu helal değildir. Aynı şekilde karınlarını ve sırtlarını kabrin duvarına yapıştırmaları, Peygamber sallallâhu aleyhi ve sellem'in başucunda bulunan sandukayla (birlikte) onu öpmeleri ve onu elle sıvazlamaları da böyledir. Bunların hepsi yasaklanmıştır.\""]]}, {"reader": false, "ar": [[698.0, "وكلُّ هذه الصور نعلم أنها من جملة التبرّك البدعيّ بالنبيّ صلى الله عليه وسلم؛"], [707.0, "لأنه ليس عليها هديُ أصحاب النبيّ صلى الله عليه وسلم."], [712.0, "وقال المعلّميّ اليمانيّ رحمه الله تعالى:"], [717.0, "«علماءُ الأمّة ـ سلفًا وخلفًا ـ مُجمعون على أنّ التبرّك بالقبور: بالاستلام، والتمسّح، والتقبيل، ووضعِ العينين ونحوِه» ـ يعني ألّا تنصرف عينُه عن القبر تعظيمًا له ـ «كلُّه محادّةٌ لله ورسوله، وخروجٌ عن سواء سبيله. فالعلماء بين مكفِّرٍ ومفسِّق» ـ أي لمن فعل هذه الأفعال ـ «ولا يصحّ قياسُ قبر النبيّ صلى الله عليه وسلم على آثاره؛ لأنّ القبور ـ ولا سيّما قبورُ الأنبياء والصالحين ـ مظنّةُ افتتان الناس وضلالهم»."], [765.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[698.0, "Bütün bu şekillerin, Peygamber sallallâhu aleyhi ve sellem ile yapılan bid'î teberrük cümlesinden olduğunu biliyoruz;"], [707.0, "çünkü bunlar Peygamber sallallâhu aleyhi ve sellem'in ashâbının yolu üzere değildir."], [709.5, "Muallimî el-Yemânî —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [712.0, "\"Selef ve halef ümmetin âlimleri şu konuda icmâ etmiştir:"], [717.0, "Kabirlerle; onlara el sürerek, sıvazlayarak, öperek, gözleri (üzerlerine) koyarak ve benzeriyle teberrük etmek\" —yani ona tazim için gözünü kabirden ayırmaması— \"tamamen Allah'a ve Resûlü'ne karşı gelmek ve O'nun dosdoğru yolundan çıkmaktır."], [747.1, "Âlimler\" —bu fiilleri yapan hakkında— \"tekfir edenler ile fıskına hükmedenler arasındadır."], [755.8, "Peygamber sallallâhu aleyhi ve sellem'in kabrini onun eserlerine kıyas etmek de sahih değildir;"], [765.0, "çünkü kabirler —özellikle peygamberlerin ve sâlihlerin kabirleri— insanların fitneye düşmesinin ve sapmasının muhtemel olduğu yerlerdir.\" Sözü —Allah Teâlâ ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[769.0, "فجميعُ ما يُفعل عند قبره ـ من التمسّح بهذه الجدران،"], [772.9, "أو كثرة الدعاء، أو الصلاة التي يقصد بها صاحبُها عظيمَ البركة بالنبيّ صلى الله عليه وسلم،"], [783.0, "وغير ذلك من الصور ـ كلُّ ذلك لا نتوقّف فيه لحظةً واحدةً أنه من البدع؛"], [790.0, "لأنه طلبٌ للبركة بالنبيّ صلى الله عليه وسلم بصورةٍ ليس عليها أصحابُه."], [797.0, "ولعلّ الكلّيّة واضحة، والله أعلم."]], "tr": [[769.0, "Onun kabrinin yanında yapılan her şey —bu duvarlara sürünmek, çokça dua etmek, ya da sahibinin onunla Peygamber sallallâhu aleyhi ve sellem'den büyük bereket kastettiği namaz ve diğer şekiller— bunların hepsinin bid'atlerden olduğunda bir an bile duraksamayız."], [788.0, "Çünkü bu, ashâbının üzerinde olmadığı bir şekilde Peygamber sallallâhu aleyhi ve sellem ile bereket talep etmektir."], [797.0, "Umarım külliye açıktır. Allah en iyisini bilir."]]}]}, {"ts": "13:19", "title": "2. Külliye: Peygamber'in bizzat ibadet için kastetmediği her yeri ibadet için kastetmek bid'attir", "paras": [{"reader": false, "ar": [[799.0, "الكلّيّة الثانية: كلُّ موضعٍ لم يقصده النبيّ… كلُّ موضعٍ لم يقصده النبيّ صلى الله عليه وسلم بالتعبّد فيه لعينه فقصدُه بالتعبّد بدعة."], [820.0, "<b>كلُّ موضعٍ لم يقصده النبيّ صلى الله عليه وسلم بالتعبّد فيه لعينه فقصدُه بالتعبّد بدعة.<\/b> أُعيدها مرّةً ثالثة:"], [839.0, "<b>كلُّ موضعٍ لم يقصده النبيّ صلى الله عليه وسلم بالتعبّد فيه لعينه فقصدُه بالتعبّد بدعة.<\/b>"]], "tr": [[799.0, "<b>2. külliye:<\/b> Peygamber'in kastetmediği her yer… Peygamber sallallâhu aleyhi ve sellem'in bizzat kendisi için, orada ibadet etmeyi kastetmediği her yeri ibadet için kastetmek bid'attir."], [817.9, "<b>2. külliye: Peygamber sallallâhu aleyhi ve sellem'in bizzat kendisi için, orada ibadet etmeyi kastetmediği her yeri ibadet için kastetmek bid'attir.<\/b> Üçüncü kez tekrar ediyorum:"], [839.0, "<b>Peygamber sallallâhu aleyhi ve sellem'in bizzat kendisi için, orada ibadet etmeyi kastetmediği her yeri ibadet için kastetmek bid'attir.<\/b>"]]}, {"reader": false, "ar": [[846.2, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أنّ المواضع التي صلّى فيها النبيّ صلى الله عليه وسلم أو أقام فيها عبادةً أخرى لا تخلو من حالتين."], [861.0, "الحالة الأولى: مواضعُ قصد النبيّ صلى الله عليه وسلم التعبّدَ فيها لذات المكانيّة؛"], [873.0, "فهو يُراعي المكانيّة، فهو إنما قصد هذا المكانَ لمكانيّته،"], [880.0, "فهو يريد أن يُوقع فيه هذا النوعَ من العبادة منظورًا فيه إلى عين المكانيّة."], [889.0, "فتلك المواضعُ هي التي يُشرع تحرّيها،"], [895.0, "ويُشرع قصدُها، اقتداءً بالنبيّ صلى الله عليه وسلم،"], [901.0, "وإحياءً لسنّته، وطلبًا للأجر."]], "tr": [[846.2, "Tevfik Allah'tandır, derim ki: Bil —Allah Teâlâ sana rahmet etsin— ki Peygamber sallallâhu aleyhi ve sellem'in namaz kıldığı ya da başka bir ibadet ifa ettiği yerler iki hâlden boş değildir."], [861.0, "Birinci hâl: Peygamber sallallâhu aleyhi ve sellem'in, mekânın bizzat kendisi için orada ibadet etmeyi kastettiği yerler."], [873.0, "O, mekânı gözetmektedir; o bu mekânı ancak mekânın kendisi için kastetmiştir;"], [880.6, "bu tür ibadeti, mekânın bizzat kendisi göz önünde bulundurularak orada ifa etmek istemektedir."], [889.0, "İşte bu yerler, Peygamber sallallâhu aleyhi ve sellem'e uymak, sünnetini ihya etmek ve ecir talep etmek için araştırılıp gözetilmesi ve kastedilmesi meşru olan yerlerdir."]]}, {"reader": false, "ar": [[905.0, "كما في حديث يزيد بن أبي عُبيد:"], [907.5, "أنّ سلمة بن الأكوع رضي الله عنه كان يتحرّى الصلاةَ عند الأسطوانة التي عند المصحف،"], [915.0, "فقلتُ له: يا أبا مسلم،"], [917.7, "أراك تتحرّى الصلاةَ عند هذه الأسطوانة!"], [921.0, "فقال: رأيتُ النبيَّ صلى الله عليه وسلم يتحرّى الصلاةَ عندها."], [928.0, "فمثلُ هذا الموضع لا بأس به."]], "tr": [[905.0, "Yezîd b. Ebî Ubeyd hadisinde olduğu gibi:"], [907.5, "Seleme b. el-Ekva' —Allah ondan razı olsun— Mushaf'ın yanındaki sütunun dibinde namaz kılmayı gözetirdi."], [912.5, "Ona dedim ki: \"Ey Ebû Müslim!"], [916.1, "Seni bu sütunun yanında namaz kılmayı gözetir görüyorum!\" Dedi ki:"], [921.0, "\"Peygamber sallallâhu aleyhi ve sellem'i onun yanında namaz kılmayı gözetirken gördüm.\" İşte bunun gibi bir yerin (kastedilmesinde) sakınca yoktur."]]}]}, {"ts": "15:32", "title": "2. Külliye (devam): Bizzat kastedilen mekânlar ve İbn Teymiyye'nin açıklaması", "paras": [{"reader": false, "ar": [[932.0, "وكذلك لمّا قصد النبيّ صلى الله عليه وسلم عرفةَ ليتعبّد لله عز وجل بها في يوم عرفة بعينه،"], [942.0, "وكذلك لمّا قصد المزدلفةَ ليبيت فيها لعينها،"], [946.0, "وكذلك أيضًا لمّا قصد منًى ليبيت فيها بعينها،"], [951.0, "وكذلك أيضًا لمّا قصد الجمراتِ ليرمي تلك الجمراتِ تعبّدًا لله عز وجل في عين هذا المكان،"], [959.9, "وكذلك لمّا قصد البيتَ ليطوف به،"], [962.7, "وقصد الصفا والمروة ليسعى بينهما."], [965.0, "فكلُّ هذا من الأمكنة التي لا بأس بقصدها لعينها وذاتها،"], [971.0, "اقتداءً بالنبيّ صلى الله عليه وسلم،"], [975.2, "وإحياءً لسنّته، وامتثالًا لأمره."]], "tr": [[932.0, "Aynı şekilde Peygamber sallallâhu aleyhi ve sellem, Arefe gününde bizzat orada Allah Azze ve Celle'ye ibadet etmek için Arafat'ı kastetmiştir."], [949.1, "Aynı şekilde bizzat kendisi için orada gecelemek üzere Müzdelife'yi kastetmiştir."], [957.5, "Yine aynı şekilde bizzat orada gecelemek için Mina'yı kastetmiştir."], [965.0, "Yine aynı şekilde, tam bu mekânda Allah Azze ve Celle'ye ibadet olarak o cemreleri taşlamak için cemreleri kastetmiştir."], [968.6, "Aynı şekilde tavaf etmek için Beyt'i, aralarında sa'y etmek için Safâ ile Merve'yi kastetmiştir."], [971.7, "Bütün bunlar, Peygamber sallallâhu aleyhi ve sellem'e uymak, sünnetini ihya etmek ve emrine uymak için bizzat kendileri için kastedilmesinde sakınca olmayan mekânlardandır."]]}, {"reader": false, "ar": [[978.0, "ولذلك قال الإمام ابن تيميّة رحمه الله تعالى:"], [983.0, "«ما فعله النبيّ صلى الله عليه وسلم على وجه التعبّد فهو عبادةٌ يُشرع التأسّي به فيه، فإذا خصّص زمانًا أو مكانًا بعبادةٍ كان تخصيصُه بتلك العبادة سنّة؛ كتخصيصه العشرَ الأواخر بالاعتكاف فيها، وكتخصيصه مقامَ إبراهيم بالصلاة فيه» ـ يعني خلفَه ـ «فالتأسّي به أن يفعل مثلَ ما فعل على الوجه الذي فعل»."], [1023.0, "انتهى كلامه رحمه الله."]], "tr": [[978.0, "Bu yüzden İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [979.9, "\"Peygamber sallallâhu aleyhi ve sellem'in ibadet yoluyla yaptığı şey, kendisinde ona uymanın meşru olduğu bir ibadettir."], [983.0, "Bir zamanı veya bir mekânı bir ibadetle tahsis ettiğinde, onu o ibadetle tahsis etmesi sünnet olur;"], [995.0, "son on günü i'tikâfla tahsis etmesi ve Makâm-ı İbrâhim'i orada namaz kılmakla tahsis etmesi gibi\" —yani onun arkasında— \"Ona uymak, onun yaptığının aynısını onun yaptığı şekil üzere yapmaktır.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[1026.0, "وقال في موضعٍ آخر:"], [1029.0, "«فأمّا الأمكنة التي كان النبيّ صلى الله عليه وسلم يقصد الصلاةَ أو الدعاء عندها، فقصدُ الصلاة فيها أو الدعاء سنّةٌ، اقتداءً برسول الله صلى الله عليه وسلم واتّباعًا له، كما إذا تحرّى الصلاةَ أو الدعاء في وقتٍ من الأوقات، فإنّ قصد الصلاة أو الدعاء في ذلك الوقت سنّةٌ كسائر عباداته وسائر الأفعال التي فعلها على وجه التقرّب». انتهى كلامه."]], "tr": [[1026.0, "Başka bir yerde de şöyle demiştir:"], [1029.0, "\"Peygamber sallallâhu aleyhi ve sellem'in yanlarında namaz kılmayı veya dua etmeyi kastettiği mekânlara gelince;"], [1037.1, "Resûlullah sallallâhu aleyhi ve sellem'e uyarak ve ona tâbi olarak oralarda namaz kılmayı veya dua etmeyi kastetmek sünnettir."], [1047.0, "Tıpkı vakitlerden bir vakitte namaz kılmayı veya dua etmeyi gözettiği zaman, o vakitte namazı veya duayı kastetmenin, diğer ibadetleri ve yakınlaşma (takarrub) yoluyla yaptığı diğer fiilleri gibi sünnet olması gibi.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1065.0, "وهذه الحالة الأولى لا تعلّقَ لها بكلّيّتنا،"], [1071.0, "وإنما كلّيّتُنا تتكلّم عن الحالة الثانية."], [1076.0, "الحالة الثانية: مواضعُ ثبت عن النبيّ صلى الله عليه وسلم أنه فعل فيها شيئًا من العبادات،"], [1086.1, "لكن فعلها موافقةً دون قصدٍ لهذا المكان بخصوصه،"], [1091.2, "وإنما وافقه زمانُ التعبّد في هذا المكان."], [1101.0, "وهو لم يفعل العبادة في هذا المكان عن قصد،"], [1106.5, "وإنما من باب الموافقة."]], "tr": [[1065.0, "Bu birinci hâlin bizim külliyemizle ilgisi yoktur;"], [1071.0, "külliyemiz ancak ikinci hâlden bahsetmektedir."], [1076.0, "İkinci hâl: Peygamber sallallâhu aleyhi ve sellem'in orada bazı ibadetleri yaptığı sabit olan, ancak bu mekânı özellikle kastetmeden, denk gelerek yaptığı yerler;"], [1091.2, "ibadetin zamanı bu mekâna denk gelmiştir."], [1101.0, "O, bu mekânda ibadeti kasıtlı olarak yapmamış, ancak denk gelme kabilinden yapmıştır."]]}, {"reader": false, "ar": [[1109.0, "كأيّ حين وقتِ صلاة الظهر أو الفجر أو المغرب أو العشاء أو غير ذلك في مكانٍ معيّن،"], [1119.8, "فينزل هو وأصحابُه فيصلّون في هذا المكان،"], [1124.0, "أو يحين وقتُ قيام الليل في مكانٍ معيّن فيصلّي فيه،"], [1129.0, "أو يحين شيءٌ من التعبّدات في مكانٍ لم يقصده بالذات فيفعل هذه العبادةَ فيه."], [1138.0, "فحينئذٍ تقضي هذه الكلّيّة بأنّ قصد الإنسان أن يتعبّد لله عز وجل بهذه العبادة في هذا المكان هذا من جملة البدع المحدَثة المستنكَرة التي ما أنزل الله عز وجل بها من سلطان."]], "tr": [[1109.0, "Mesela öğle, sabah, akşam, yatsı veya başka bir namazın vakti belli bir mekânda girer;"], [1121.0, "o ve ashâbı konaklayıp bu mekânda namaz kılarlar."], [1127.0, "Ya da gece namazının vakti belli bir mekânda girer ve orada namaz kılar."], [1138.0, "Ya da bizzat kastetmediği bir mekânda ibadetlerden birinin vakti gelir ve bu ibadeti orada yapar."], [1144.7, "İşte o zaman bu külliye şuna hükmeder:"], [1149.0, "İnsanın, bu mekânda bu ibadetle Allah Azze ve Celle'ye ibadet etmeyi kastetmesi, Allah Azze ve Celle'nin hakkında hiçbir delil indirmediği, sonradan çıkarılmış münker bid'atler cümlesindendir."]]}, {"reader": false, "ar": [[1158.0, "وذلك لأنّ المتقرّر في القواعد أنّ السنّة فعلُ السنّة على الوجه الذي فُعلت عليه."], [1168.0, "والنبيّ صلى الله عليه وسلم إذا قصد التعبّد لله في مكانٍ فتكون السنّة من جزئيّتين:"], [1175.7, "من جزئيّة فعل العبادة،"], [1178.5, "ومن جزئيّة هذه المكانيّة."], [1182.0, "لكن إذا كان يفعل العبادة غيرَ قاصدٍ للمكان بعينه فتكون السنّة من جزئيّةٍ واحدة."], [1190.0, "فكونُ الإنسان يقصد هذا المكانَ الذي لم يقصده رسول الله صلى الله عليه وسلم ليتعبّد فيه بهذه العبادة،"], [1199.0, "يكون هذا قد فعل السنّة على غير الوجه الذي فعلها عليه النبيّ صلى الله عليه وسلم."]], "tr": [[1158.0, "Bu şundandır: Kaidelerde yerleşik olan, sünnetin, sünneti yapıldığı şekil üzere yapmak olduğudur."], [1168.0, "Peygamber sallallâhu aleyhi ve sellem bir mekânda Allah'a ibadet etmeyi kastettiğinde sünnet iki cüzden oluşur:"], [1175.7, "İbadeti yapma cüzü ve bu mekân cüzü."], [1182.0, "Fakat ibadeti, mekânı bizzat kastetmeksizin yapıyorsa, sünnet tek bir cüzden oluşur."], [1190.0, "Dolayısıyla insanın, Resûlullah sallallâhu aleyhi ve sellem'in kastetmediği bu mekânı, orada bu ibadeti yapmak için kastetmesi;"], [1198.2, "sünneti, Peygamber sallallâhu aleyhi ve sellem'in onu yaptığı şeklin dışında bir şekilde yapmış olması demektir."]]}]}, {"ts": "20:07", "title": "2. Külliye (devam): Kastetmek ile denk gelmek arasındaki fark · Hira mağarası ve Arafat dağı", "paras": [{"reader": false, "ar": [[1207.0, "فلا بدّ أن نفرّق بين قصد المكان ونزول المكان من باب الموافقة."], [1217.0, "فالذي لا يفرّق بينهما يقع في خللٍ عقديٍّ كبير؛"], [1223.0, "فربّما يتبرّك بأمكنةٍ يتعبّد لله عز وجل فيها وتكون عليه لا له؛"], [1231.0, "لأنّ النبيّ صلى الله عليه وسلم لم يقصدها بعينها."], [1235.0, "فكلُّ مكانٍ وقعت العبادة فيه اتّفاقًا من غير قصدٍ لها لذاتها فلا يُشرع أن يذهب الإنسان إلى هذا المكان ليُوقع فيه عينَ هذا التعبّد."]], "tr": [[1207.0, "Mekânı kastetmek ile denk gelme kabilinden bir mekâna konaklamak arasını mutlaka ayırmamız gerekir."], [1217.0, "Bu ikisini ayırt etmeyen, büyük bir akîde bozukluğuna düşer."], [1223.0, "Belki de Allah Azze ve Celle'ye ibadet ettiği mekânlarla teberrük eder, ama bunlar onun lehine değil aleyhine olur;"], [1235.0, "çünkü Peygamber sallallâhu aleyhi ve sellem onları bizzat kastetmemiştir."], [1239.5, "Dolayısıyla ibadetin, bizzat kendisi kastedilmeksizin tesadüfen gerçekleştiği her mekâna, insanın aynı ibadeti orada ifa etmek için gitmesi meşru değildir."]]}, {"reader": false, "ar": [[1251.0, "ويُمثّل لها العلماء بأمثلةٍ كثيرة."], [1256.0, "فمثلًا: ثبت عن النبيّ صلى الله عليه وسلم أنه كان يقصد غارَ حراءٍ قبل البعثة ويتحنّث فيه ـ أي يتعبّد ـ لكن هذا لقصد الابتعاد عن كفّار قريش،"], [1271.0, "وللخروج من المكان الذي يُعبد فيه غيرُ الله عز وجل."], [1275.0, "فكان يتحنّث في غار حراءٍ ـ أي يتعبّد ـ الليالي ذواتِ العدد."], [1280.0, "ولكن لا يُحفظ عنه مرّةً واحدةً بعد بعثته صلى الله عليه وسلم أنه كان يقصد غار حراءٍ لشيءٍ من التعبّدات؛"], [1291.0, "ولكن لم يُحفظ عنه صلى الله عليه وسلم مرّةً واحدةً أنه قاصدٌ هذا الغارَ بعد بعثته ليتعبّد لله فيه."]], "tr": [[1251.0, "Âlimler bunu birçok örnekle açıklar."], [1256.0, "Mesela, Peygamber sallallâhu aleyhi ve sellem'in peygamberlikten önce Hira mağarasını kastettiği ve orada tehannüs ettiği —yani ibadet ettiği— sabittir."], [1266.0, "Fakat bu, Kureyş kâfirlerinden uzaklaşmak ve Allah Azze ve Celle'den başkasına ibadet edilen yerden çıkmak maksadıylaydı."], [1275.0, "Hira mağarasında birçok gece tehannüs ederdi —yani ibadet ederdi—."], [1280.0, "Ancak peygamberliğinden sonra bir kez bile ibadetlerden herhangi biri için Hira mağarasını kastettiği ondan rivayet edilmemiştir."], [1289.0, "Evet, peygamberliğinden sonra orada Allah'a ibadet etmek için bu mağarayı kastettiği ondan sallallâhu aleyhi ve sellem bir kez bile rivayet edilmemiştir."]]}, {"reader": false, "ar": [[1303.0, "ولا يُحفظ أبدًا عن صحابيٍّ واحدٍ أنه كان يقصد التعبّد لله عز وجل في هذا الغار بخصوصه."], [1313.0, "وهذا يدلّ على أنّ النبيّ صلى الله عليه وسلم لم يكن يقصد هذا الغارَ لميزةٍ فيه،"], [1320.0, "وإنما كان يقصده لاعتباراتٍ أخرى ذكرها أهلُ السيرة."], [1325.0, "وبناءً على ذلك فليس من السنّة أن يتعبّد الإنسان بالصعود لهذا الغار،"], [1333.0, "ولا أن يصلّي فيه،"], [1334.6, "ولا أن يقرأ القرآن فيه،"], [1336.5, "ولا أن يُكثر من ذكر الله عز وجل فيه،"], [1340.0, "كما يفعله كثيرٌ من الناس ظنًّا منهم أنهم يُحيون سنّة،"], [1347.0, "وهم في الحقيقة إنما يُحيون بدعةً ومحدَثة."]], "tr": [[1303.0, "Tek bir sahabinin bile, özellikle bu mağarada Allah Azze ve Celle'ye ibadet etmeyi kastettiği asla rivayet edilmemiştir."], [1313.0, "Bu da gösterir ki Peygamber sallallâhu aleyhi ve sellem bu mağarayı kendisinde bulunan bir üstünlük sebebiyle kastetmiyordu;"], [1320.0, "onu ancak siyer âlimlerinin zikrettiği başka sebeplerle kastediyordu."], [1325.0, "Buna göre insanın bu mağaraya çıkarak ibadet etmesi, orada namaz kılması, orada Kur'an okuması ve orada Allah Azze ve Celle'yi çokça zikretmesi sünnetten değildir."], [1338.1, "İnsanların birçoğu bir sünneti ihya ettiklerini zannederek bunu yapıyorlar;"], [1342.8, "hâlbuki gerçekte ancak bir bid'ati ve sonradan çıkarılmış bir şeyi ihya ediyorlar."]]}, {"reader": false, "ar": [[1352.0, "ومن ذلك أيضًا: الجبلُ الذي جعله النبيّ صلى الله عليه وسلم بينه وبين الكعبة في حجّة الوداع،"], [1361.3, "وهو جبل عرفات المسمّى بجبل إِلال."], [1366.0, "فإنّ السنّة أن يقف الإنسان في عرفات في الموقف الذي وقف فيه النبيّ صلى الله عليه وسلم،"], [1373.0, "وهو أن يقف عند تلك الصخرات التي هي في أسفل الجبل،"], [1378.0, "ويجعل الجبلَ بينه وبين الكعبة."], [1381.0, "فما نراه من كثيرٍ من المسلمين من الحرص الشديد العظيم على صعود هذا الجبل تعبّدًا لله عز وجل بقصد هذا المكان بخصوصه،"], [1390.5, "هذا كلُّه من البدع التي ما أنزل الله عز وجل بها من سلطان."]], "tr": [[1352.0, "Bunlardan biri de Peygamber sallallâhu aleyhi ve sellem'in Vedâ haccında kendisiyle Kâbe arasına aldığı dağdır;"], [1360.2, "bu, İlâl dağı diye adlandırılan Arafat dağıdır."], [1366.0, "Sünnet olan, insanın Arafat'ta Peygamber sallallâhu aleyhi ve sellem'in durduğu yerde durmasıdır;"], [1372.2, "o da dağın eteğindeki o kayaların yanında durması ve dağı kendisiyle Kâbe arasına almasıdır."], [1381.0, "Müslümanların birçoğunda gördüğümüz, özellikle bu mekânı kastederek Allah Azze ve Celle'ye ibadet niyetiyle bu dağa çıkma konusundaki o şiddetli ve büyük hırs;"], [1391.0, "bunların hepsi, Allah Azze ve Celle'nin hakkında hiçbir delil indirmediği bid'atlerdendir."]]}, {"reader": false, "ar": [[1397.0, "بل ويدخل فيها أيضًا بعضُ الأماكن التي مرّ النبيّ صلى الله عليه وسلم بها في بعض أسفاره؛"], [1406.0, "فإنّ من الناس من يجعل هذه المواضعَ مواضعَ تعبّدات،"], [1410.2, "وهذا ليس من السنّة في صدرٍ ولا وِرْد."], [1414.0, "وكذلك ما يسمّونه أيضًا بالمساجد السبعة التي قربَ الخندق،"], [1420.4, "وغير ذلك. فكلُّ ذلك ممّا لا يجوز قصدُه بالزيارة للتعبّد لله عز وجل،"], [1428.0, "لا بصلاةٍ ولا بدعاءٍ ولا غير ذلك،"], [1433.0, "ولا يجوز أن يتمسّح الإنسان بشيءٍ من هذه الأمكنة."]], "tr": [[1397.0, "Hatta Peygamber sallallâhu aleyhi ve sellem'in bazı yolculuklarında uğradığı bazı yerler de buna girer."], [1406.0, "İnsanlardan bazıları bu yerleri ibadet yerleri edinir;"], [1409.3, "bu ise ne başında ne sonunda (hiçbir yönüyle) sünnetten değildir."], [1414.0, "Aynı şekilde Hendek yakınındaki \"yedi mescit\" diye adlandırdıkları yerler ve benzerleri de böyledir."], [1422.0, "Bütün bunlar, Allah Azze ve Celle'ye ibadet için —ne namazla ne duayla ne de başka bir şeyle— ziyaret maksadıyla kastedilmesi caiz olmayan yerlerdir."], [1432.3, "İnsanın bu mekânlardan herhangi bir şeye sürünmesi (teberrüken sıvazlaması) da caiz değildir."]]}, {"reader": false, "ar": [[1438.0, "ولذلك أمر عمرُ رضي الله تعالى عنه بقطع الشجرة التي عند العقبة،"], [1446.0, "والتي بايع تحتها النبيَّ صلى الله عليه وسلم الأنصارُ قبل أن يهاجر إليهم،"], [1458.0, "فقطعها عمرُ وقال: «أتريدون أن تتّخذوا آثارَ نبيّكم مساجد؟ إنما هلك من كان قبلكم بهذا»."], [1469.0, "فهذه الكلّيّة تسدّ عنّا هذا الباب."]], "tr": [[1438.0, "Bu yüzden Ömer —Allah Teâlâ ondan razı olsun— Akabe'deki, Ensâr'ın, kendilerine hicret etmeden önce altında Peygamber sallallâhu aleyhi ve sellem'e biat ettiği ağacın kesilmesini emretti."], [1453.4, "Ömer onu kesti ve şöyle dedi:"], [1460.1, "\"Peygamberinizin eserlerini mescitler mi edinmek istiyorsunuz?"], [1463.7, "Sizden öncekiler ancak bununla helak oldu.\" İşte bu külliye bu kapıyı bize kapatır."]]}, {"reader": false, "ar": [[1474.0, "قال ابن تيميّة رحمه الله تعالى ـ تَبِعوني ـ:"], [1478.0, "«أمّا قصدُ الصلاة والدعاء والعبادة في مكانٍ لم يقصد الأنبياءُ فيه الصلاةَ والعبادة، بل رُوي عنهم أنهم مرّوا به ونزلوا فيه أو سكنوه، فهذا ـ كما تقدّم ـ لم يكن ابنُ عمر ولا غيرُه يفعله؛ فإنه ليس فيه متابعتُهم، لا في عملٍ عملوه ولا قصدٍ قصدوه."]], "tr": [[1474.0, "İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir —beni takip edin—:"], [1475.1, "\"Peygamberlerin namaz ve ibadeti kastetmediği, aksine oradan geçtikleri, orada konakladıkları ya da orada oturdukları rivayet edilen bir mekânda namazı, duayı ve ibadeti kastetmeye gelince;"], [1478.0, "bunu —daha önce geçtiği gibi— ne İbn Ömer ne de başkası yapardı."], [1490.0, "Çünkü bunda onlara uymak yoktur;"], [1495.0, "ne onların yaptığı bir amelde ne de kastettikleri bir kasıtta."]]}]}, {"ts": "25:09", "title": "2. Külliye (devam): İbn Teymiyye'den nakiller devam ediyor", "paras": [{"reader": false, "ar": [[1509.0, "ومعلومٌ أنّ الأمكنة التي كان النبيّ صلى الله عليه وسلم يحلّ فيها ـ إمّا في سفره وإمّا في مُقامه ـ مثلُ طُرُقه في حجّه وغزواته،"], [1519.6, "ومنازلِه في أسفاره، ومثلُ بيوته التي كان يسكنها،"], [1526.0, "والبيوتِ التي كان يأتي إليها أحيانًا،"], [1529.0, "ولو كان هذا مستحبًّا» ـ أي تتبّع هذه الأشياء والأماكن ـ «ولو كان هذا مستحبًّا لكان يُستحبّ للصحابة والتابعين أن يصلّوا في جميع حُجَر أزواجه، وفي كلّ مكانٍ نزل فيه في غزواته أو أسفاره، ولكان يُستحبّ أن يبنوا هناك مساجد، ولم يفعل السلفُ شيئًا من ذلك."]], "tr": [[1509.0, "Bilinmektedir ki Peygamber sallallâhu aleyhi ve sellem'in —gerek yolculuğunda gerek ikametinde— konakladığı mekânlar vardır:"], [1514.7, "Haccındaki ve gazvelerindeki yolları, yolculuklarındaki konak yerleri, oturduğu evleri ve ara sıra gittiği evler gibi."], [1525.4, "Eğer bu müstehap olsaydı\" —yani bu şeylerin ve yerlerin peşine düşmek— \"eğer bu müstehap olsaydı, sahabe ve tâbiîn için onun hanımlarının bütün odalarında ve gazvelerinde ya da yolculuklarında konakladığı her yerde namaz kılmaları müstehap olurdu;"], [1547.6, "orada mescitler bina etmeleri de müstehap olurdu."], [1551.5, "Hâlbuki selef bunlardan hiçbirini yapmamıştır."]]}, {"reader": false, "ar": [[1555.0, "ولم يشرع الله تعالى للمسلمين مكانًا يُقصد للصلاة إلا المسجد،"], [1565.0, "ولا مكانًا يُقصد للعبادة إلا المشاعر؛"], [1568.0, "فمشاعرُ الحجّ ـ كعرفة ومزدلفة ومنًى ـ تُقصد بالذكر والدعاء والتكبير لا الصلاة،"], [1575.3, "بخلاف المساجد فإنها هي التي تُقصد للصلاة."], [1580.0, "وما ثَمّ مكانٌ يُقصد بعينه إلا المساجد والمشاعر، وفيها الصلاة والنسك."]], "tr": [[1555.0, "Allah Teâlâ Müslümanlara namaz için kastedilecek bir mekân olarak sadece mescidi, ibadet için kastedilecek bir mekân olarak da sadece meşâiri (hac ibadet yerlerini) meşru kılmıştır."], [1568.0, "Arafat, Müzdelife ve Mina gibi haccın meşâiri namaz için değil, zikir, dua ve tekbir için kastedilir;"], [1576.0, "mescitler ise böyle değildir, namaz için kastedilen onlardır."], [1580.0, "Mescitler ve meşâir dışında bizzat kendisi kastedilen bir mekân yoktur;"], [1583.3, "namaz ve hac ibadetleri de bunlardadır."]]}, {"reader": false, "ar": [[1586.0, "فالتبرّك بالمواضع التي لم يتحرّها النبيّ صلى الله عليه وسلم غيرُ مشروعٍ مطلقًا؛"], [1593.5, "لأنه لا يوجد دليلٌ من النصوص الشرعيّة يُفيد جوازَ ذلك الفعل أو استحبابَه."], [1601.0, "والجلوسُ في تلك المواضع للصلاة أو الدعاء أو الذكر ونحو ذلك قربةً وتبرّكًا من أنواع العبادة،"], [1611.0, "والعباداتُ مبناها على الاتّباع لا على الابتداع."], [1616.0, "ولم يُنقل عن الصحابة رضي الله عنهم أنهم تبرّكوا بشيءٍ من هذه المواضع التي كان يجلس فيها رسول الله صلى الله عليه وسلم،"], [1627.0, "أو البِقاع التي صلّى فيها عليه الصلاة والسلام عن غير قصدٍ منه،"], [1632.0, "وهم أحرصُ الناس على التبرّك بالرسول صلى الله عليه وسلم،"], [1637.0, "مع علمهم بتلك المواضع،"], [1639.2, "وشدّةِ محبّتهم للرسول صلى الله عليه وسلم،"], [1643.0, "وتعظيمهم له، واتّباعهم لسنّته»."], [1646.0, "انتهى كلامه، وما أجملَ كلامَه!"]], "tr": [[1586.0, "Dolayısıyla Peygamber sallallâhu aleyhi ve sellem'in gözetmediği yerlerle teberrük etmek mutlak olarak meşru değildir;"], [1593.5, "çünkü şer'î nasslardan bu fiilin caiz ya da müstehap olduğunu ifade eden bir delil yoktur."], [1601.0, "O yerlerde yakınlık ve teberrük maksadıyla namaz, dua, zikir ve benzeri için oturmak ibadet türlerindendir;"], [1609.1, "ibadetler ise ittiba (uyma) üzerine kuruludur, ibtidâ' (bid'at çıkarma) üzerine değil."], [1616.0, "Sahabeden —Allah onlardan razı olsun— Resûlullah sallallâhu aleyhi ve sellem'in oturduğu bu yerlerden ya da onun —salât ve selâm üzerine olsun— kastetmeden namaz kıldığı yerlerden herhangi biriyle teberrük ettikleri nakledilmemiştir."], [1629.5, "Hâlbuki onlar, o yerleri bilmelerine, Resûl sallallâhu aleyhi ve sellem'e olan şiddetli sevgilerine, ona tazimlerine ve sünnetine tâbi olmalarına rağmen, insanların Resûl sallallâhu aleyhi ve sellem ile teberrüğe en düşkün olanlarıydı.\" Sözü burada bitti. Sözü ne güzeldir!"]]}, {"reader": false, "ar": [[1648.0, "وقال في موضعٍ آخر رحمه الله تعالى:"], [1654.0, "«فأمّا قصدُ الصلاة في تلك البقاع التي صلّى فيها اتّفاقًا، فهذا لم يُنقل عن غير ابن عمر من الصحابة، بل كان أبو بكرٍ وعمرُ وعثمانُ وعليٌّ وسائرُ السابقين الأوّلين من المهاجرين والأنصار يذهبون من المدينة إلى مكّة حُجّاجًا وعُمّارًا ومسافرين، ولم يُنقل عن أحدٍ منهم أنه تحرّى الصلاةَ في مُصلّيات النبيّ صلى الله عليه وسلم. ومعلومٌ أنّ هذا لو كان عندهم مستحبًّا لكانوا إليه أسبق؛ فإنهم أعلمُ بسنّته وأتبعُ لها من غيرهم»."], [1694.0, "انتهى كلامه رحمه الله."]], "tr": [[1648.0, "Başka bir yerde de —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [1649.5, "\"Onun tesadüfen namaz kıldığı o yerlerde namaz kılmayı kastetmeye gelince;"], [1651.7, "bu, sahabeden İbn Ömer dışında kimseden nakledilmemiştir."], [1654.0, "Bilakis Ebû Bekir, Ömer, Osman, Ali ve Muhâcirler ile Ensâr'dan ilk öncülerin geri kalanı Medine'den Mekke'ye hacılar, umreciler ve yolcular olarak gider gelirlerdi;"], [1673.6, "onlardan hiçbirinin Peygamber sallallâhu aleyhi ve sellem'in namaz kıldığı yerlerde namaz kılmayı gözettiği nakledilmemiştir."], [1684.1, "Bilinmektedir ki bu onların nazarında müstehap olsaydı, ona en önce koşan onlar olurdu;"], [1694.0, "çünkü onlar onun sünnetini başkalarından daha iyi bilen ve ona daha çok tâbi olanlardır.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}, {"reader": false, "ar": [[1697.0, "وقال في موضعٍ آخر:"], [1699.0, "«وأمّا ما فعله» ـ أي النبيّ صلى الله عليه وسلم ـ «بحكم الاتّفاق ولم يقصده، مثل أن ينزل بمكانٍ ويصلّي فيه لكونه نزله، لا قصدًا لتخصيصه به بالصلاة والنزول فيه، فإذا قصدنا تخصيصَ ذلك المكان بالصلاة فيه أو النزول لم نكن متّبعين، بل هذا من البدع التي كان ينهى عنها عمرُ بن الخطّاب رضي الله عنه."]], "tr": [[1697.0, "Başka bir yerde de şöyle demiştir:"], [1697.5, "\"Onun\" —yani Peygamber sallallâhu aleyhi ve sellem'in— \"tesadüf hükmüyle yaptığı ve kastetmediği şeye gelince;"], [1699.0, "bir mekâna konaklayıp, orayı namazla ve orada konaklamakla tahsis etmeyi kastetmeksizin, sırf orada konakladığı için orada namaz kılması gibi;"], [1711.7, "biz o mekânı orada namaz kılmakla ya da konaklamakla tahsis etmeyi kastedersek (ona) tâbi olmuş olmayız."], [1725.6, "Bilakis bu, Ömer b. el-Hattâb'ın —Allah ondan razı olsun— nehyettiği bid'atlerdendir."]]}, {"reader": false, "ar": [[1733.0, "كما ثبت بالإسناد الصحيح من حديث شعبة عن سليمان التيميّ عن المعرور بن سُويد قال:"], [1740.4, "كان عمر بن الخطّاب في سفرٍ فصلّى الغداة،"], [1744.0, "ثم أتى على مكانٍ،"], [1745.5, "فجعل الناس يأتون مكانًا يقولون:"], [1747.5, "صلّى فيه النبيّ صلى الله عليه وسلم،"], [1751.0, "فقال عمر بن الخطّاب رضي الله عنه:"], [1754.0, "إنما هلك أهلُ الكتاب أنهم اتّبعوا آثارَ أنبيائهم فاتّخذوها كنائسَ وبِيَعًا،"], [1760.0, "فمن عرضت له الصلاة فليصلِّ،"], [1763.6, "وإلا فليمضِ». انتهى كلام الإمام ابن تيميّة رحمه الله تعالى."], [1769.0, "وبه يتمّ الكلام عن هذه الكلّيّة."]], "tr": [[1733.0, "Nitekim sahih bir senetle Şu'be'nin Süleyman et-Teymî'den, onun da Ma'rûr b."], [1735.8, "Süveyd'den rivayet ettiği hadiste sabit olmuştur."], [1737.8, "(Ma'rûr) dedi ki: Ömer b."], [1740.4, "el-Hattâb bir yolculuktaydı, sabah namazını kıldı."], [1742.2, "Sonra bir yere geldi; insanlar 'Peygamber sallallâhu aleyhi ve sellem burada namaz kıldı' diyerek bir yere gelmeye başladılar."], [1747.5, "Bunun üzerine Ömer b. el-Hattâb —Allah ondan razı olsun— şöyle dedi:"], [1754.0, "'Ehl-i kitap ancak peygamberlerinin eserlerinin peşine düşüp onları kiliseler ve havralar edindikleri için helak oldular."], [1760.7, "Kime (burada) namaz vakti gelirse kılsın;"], [1765.0, "yoksa yoluna devam etsin.'\" İmam İbn Teymiyye'nin —Allah Teâlâ ona rahmet etsin— sözü burada bitti."], [1769.0, "Bu külliye hakkındaki söz de bununla tamamlanıyor."]]}]}, {"ts": "29:31", "title": "3. Külliye: Velîlerin ve sâlihlerin bütün bereketleri manevî ve lâzımdır", "paras": [{"reader": false, "ar": [[1771.0, "الكلّيّة الثالثة: <b>كلُّ بركات الأولياء والصالحين فمعنويّةٌ لازمة.<\/b> كلُّ بركات الأولياء والصالحين فمعنويّةٌ لازمة."], [1788.0, "كلُّ بركات الأولياء والصالحين فمعنويّةٌ لازمة."]], "tr": [[1771.0, "<b>3. külliye: Velîlerin ve sâlihlerin bütün bereketleri manevîdir, lâzımdır (sahiplerinden ayrılmaz).<\/b> Velîlerin ve sâlihlerin bütün bereketleri manevîdir, lâzımdır."], [1788.0, "Velîlerin ve sâlihlerin bütün bereketleri manevîdir, lâzımdır."]]}, {"reader": false, "ar": [[1793.0, "أقول وبالله التوفيق: لقد ذكرتُ لكم سابقًا أنّ جميع بركات الزمان معنويّةٌ لازمة،"], [1802.0, "وأنّ جميع بركات الأمكنة معنويّةٌ لازمة،"], [1805.0, "وأنّ جميع الأعيان التي ثبتت بركتُها بالدليل فمعنويّةٌ لازمة،"], [1811.3, "إلا بركةَ عينٍ واحدة،"], [1814.0, "وهي بركة النبيّ صلى الله عليه وسلم."], [1818.0, "وهذه الكلّيّة تؤكّد على هذا المعنى."]], "tr": [[1793.0, "Tevfik Allah'tandır, derim ki: Daha önce size zamanın bütün bereketlerinin manevî ve lâzım olduğunu, mekânların bütün bereketlerinin manevî ve lâzım olduğunu, bereketi delille sabit olan bütün varlıkların (bereketinin) de manevî ve lâzım olduğunu zikretmiştim;"], [1811.3, "tek bir varlığın bereketi hariç, o da Peygamber sallallâhu aleyhi ve sellem'in bereketidir."], [1818.0, "Bu külliye de bu manayı pekiştirmektedir."]]}, {"reader": false, "ar": [[1823.0, "فبركةُ أبي بكرٍ معنويّةٌ لازمة،"], [1825.0, "وبركةُ عمرَ معنويّةٌ لازمة،"], [1829.0, "وبركةُ عثمانَ وعليٍّ معنويّةٌ لازمة،"], [1833.0, "وبركاتُ المهاجرين معنويّةٌ لازمة،"], [1836.0, "وبركاتُ الأنصار معنويّةٌ لازمة،"], [1840.0, "وبركاتُ السلف من التابعين وأتباعهم معنويّةٌ لازمة،"], [1845.0, "وبركاتُ الأئمّة الأربعة معنويّةٌ لازمة."], [1848.0, "وهكذا يقال في كلّ الأولياء والصالحين:"], [1853.0, "فإنّ بركاتهم معنويّةٌ لازمة."]], "tr": [[1823.0, "Ebû Bekir'in bereketi manevî ve lâzımdır;"], [1830.6, "Ömer'in bereketi manevî ve lâzımdır;"], [1837.7, "Osman'ın ve Ali'nin bereketi manevî ve lâzımdır."], [1848.0, "Muhâcirlerin bereketleri manevî ve lâzımdır;"], [1848.8, "Ensâr'ın bereketleri manevî ve lâzımdır."], [1850.3, "Tâbiîn ve onlara tâbi olanlardan selefin bereketleri manevî ve lâzımdır;"], [1853.0, "dört imamın bereketleri manevî ve lâzımdır."], [1853.8, "Bütün velîler ve sâlihler hakkında da böyle denir:"], [1854.7, "Onların bereketleri manevî ve lâzımdır."]]}, {"reader": false, "ar": [[1857.0, "فكلُّ من سوى النبيّ صلى الله عليه وسلم من الصحابة والتابعين والصالحين ومن بعدهم،"], [1865.0, "وإن كنّا نعتقد أنّ فيهم بركةً بقدر صلاحهم وتقواهم،"], [1872.0, "ولكنها بركةٌ قاصرة، فهي معنويّةٌ لازمة لا تُجاوزهم أبدًا."], [1879.0, "فليست بركاتُهم في ثيابهم،"], [1882.0, "ولا في ملابسهم الداخليّة،"], [1885.0, "وليست بركاتُهم في عرقهم،"], [1887.0, "وليست بركاتُهم في لُعابهم أو نُخامتهم،"], [1891.0, "وليست بركاتُهم في سُؤْر شرابهم،"], [1894.0, "ولا في فضلة طعامهم،"], [1896.0, "ولا في بقيّة طَهورهم؛"], [1898.0, "وإنما بركاتُهم معنويّةٌ لازمة لا تُفارق أجسادَهم."]], "tr": [[1857.0, "Dolayısıyla Peygamber sallallâhu aleyhi ve sellem dışındaki herkes —sahabe, tâbiîn, sâlihler ve onlardan sonrakiler— her ne kadar onlarda salâhları ve takvaları ölçüsünde bereket bulunduğuna inansak da, bu kendileriyle sınırlı (başkasına geçmeyen) bir berekettir;"], [1875.7, "manevîdir, lâzımdır, onları asla aşmaz."], [1879.0, "Onların bereketleri elbiselerinde değildir, iç çamaşırlarında da değildir."], [1886.0, "Onların bereketleri terlerinde değildir; onların bereketleri salyalarında veya balgamlarında değildir."], [1894.5, "Onların bereketleri içeceklerinin artığında değildir;"], [1898.0, "yemeklerinin artığında da, abdest sularının artığında da değildir."], [1900.2, "Onların bereketleri ancak manevîdir, lâzımdır; bedenlerinden ayrılmaz."]]}, {"reader": false, "ar": [[1904.0, "وكلُّ من نصّ من أهل العلم على أنّ بركة الأولياء والصالحين ذاتيّةٌ منتقلة كبركة النبيّ صلى الله عليه وسلم فقد أخطأ،"], [1922.0, "ولم يُصب في ذلك أبدًا،"], [1926.0, "بل إنه خالف إجماعَ أصحاب النبيّ صلى الله عليه وسلم،"], [1932.0, "كما سيأتي في بعض الكلّيّات الآتية إن شاء الله."], [1936.0, "ومن المعلوم أنّ كلَّ أحدٍ يُؤخذ من قوله ويُترك إلا قولَ الشارع."], [1944.0, "والمتقرّر في القواعد أنّ الرجال يُعرفون بالحقّ ولا يُعرف الحقُّ بالرجال."], [1956.0, "والمتقرّر في القواعد أنّ أقوال العلماء يُستدلّ لها ولا يُستدلّ بها."]], "tr": [[1904.0, "Ehl-i ilimden, velîlerin ve sâlihlerin bereketinin, Peygamber sallallâhu aleyhi ve sellem'in bereketi gibi zâtî ve intikal eden bir bereket olduğunu açıkça söyleyen herkes hata etmiştir;"], [1924.4, "bunda asla isabet etmemiştir. Hatta —inşallah ileride gelecek bazı külliyelerde geleceği gibi— Peygamber sallallâhu aleyhi ve sellem'in ashâbının icmâına muhalefet etmiştir."], [1936.0, "Bilinen bir husustur ki, Şâri'in sözü dışında herkesin sözünden alınır ve terk edilir."], [1944.0, "Kaidelerde yerleşik olan şudur: Kişiler hak ile tanınır;"], [1947.7, "hak kişilerle tanınmaz. Yine kaidelerde yerleşik olan şudur:"], [1956.0, "Âlimlerin sözleri için delil getirilir; onların sözleriyle delil getirilmez."]]}, {"reader": false, "ar": [[1964.0, "فلا حقَّ لأحدٍ أن يأتينا بقول عالمٍ يُجيز التبرّك بفضلة طَهور الأولياء والصالحين،"], [1974.0, "أو التبرّك بسُؤْرهم، أو بعرقهم،"], [1977.6, "أو بثيابهم، أو بنعالهم،"], [1981.0, "ويجعله من المشروع في دين الله بمجرّد أنّ العالم الفلانيّ قاله أو أجازه أو رضي به أو أقرّه؛"], [1993.0, "فإنّ هذا من الظلم العظيم ومن الكذب الصريح."], [1997.0, "فإنه وإن ثبت هذا القولُ المرجوح ـ بل الباطل ـ عن بعض من يُنسب للعلم،"], [2004.0, "إلا أنها تُعتبر من هفواتهم ومن زلّاتهم التي يُطلب لهم فيها المعاذير."], [2013.0, "ولكنّ المتقرّر في القواعد أنّ الباطل يُردّ ممّن جاء به،"], [2017.7, "وإن جاء به أصدقُ الناس، والله أعلم."]], "tr": [[1964.0, "Dolayısıyla hiç kimsenin, velîlerin ve sâlihlerin abdest suyunun artığıyla, ya da içtiklerinin artığıyla, terleriyle, elbiseleriyle veya ayakkabılarıyla teberrüğü caiz gören bir âlimin sözünü bize getirip, sırf falanca âlim onu söyledi, caiz gördü, ona razı oldu veya onu onayladı diye onu Allah'ın dininde meşru olanlardan saymaya hakkı yoktur."], [1993.0, "Çünkü bu büyük bir zulüm ve açık bir yalandır."], [1997.0, "Bu mercûh —hatta bâtıl— görüş ilme nispet edilen bazılarından sabit olsa bile, bunlar onların, kendileri için mazeret aranan sürçmelerinden ve hatalarından sayılır."], [2008.8, "Fakat kaidelerde yerleşik olan şudur:"], [2013.0, "Bâtıl, onu getiren kim olursa olsun reddedilir;"], [2016.3, "insanların en doğru sözlüsü getirse bile. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[2021.0, "وبناءً على ذلك فلا يجوز أن نتبرّك بشيءٍ من آثارهم أبدًا،"], [2027.2, "كما سيأتينا في كلّيّةٍ خاصّة."], [2030.0, "قال الشيخ محمد بن إبراهيم رحمه الله تعالى:"], [2035.0, "«الذوات جعل الله فيها ما جعل من البركة» ـ أي ذوات الصالحين ـ «ولكن لا تصلح للتبرّك بها إلا نبيّنا صلى الله عليه وسلم، من أبعاضه كريقه، ولا يُقاس على النبيّ صلى الله عليه وسلم غيرُه. والصحابة ما فعلوا مع أبي بكرٍ وعمرَ من قصد البركة فيهما كما فعلوا مع النبيّ صلى الله عليه وسلم»."], [2072.0, "انتهى كلامه رحمه الله."]], "tr": [[2021.0, "Buna göre —özel bir külliyede karşımıza geleceği gibi— onların eserlerinden herhangi bir şeyle teberrük etmemiz asla caiz değildir."], [2030.0, "Şeyh Muhammed b. İbrâhim —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2035.0, "\"Allah zâtlara koyduğu bereketi koymuştur\" —yani sâlihlerin zâtlarına— \"fakat onlarla teberrük edilmesi uygun değildir;"], [2049.7, "ancak Peygamberimiz sallallâhu aleyhi ve sellem müstesnadır, onun tükürüğü gibi bazı parçalarıyla (teberrük edilir)."], [2064.0, "Peygamber sallallâhu aleyhi ve sellem'e başkası kıyas edilmez."], [2072.0, "Sahabe, Peygamber sallallâhu aleyhi ve sellem ile yaptıkları gibi Ebû Bekir ve Ömer'de bereket kastederek (bir şey) yapmamışlardır.\" Sözü —Allah ona rahmet etsin— burada bitti."]]}]}, {"ts": "34:34", "title": "3. Külliye (devam): \"Bereket bize geldi\", \"Bu şeyhin bereketiyle\", \"Sen baştan başa bereketsin\" demenin hükmü", "paras": [{"reader": false, "ar": [[2074.0, "وهنا مسائلُ لا بأس من طرقها وبحثها."], [2079.0, "منها: ما حكمُ قول:"], [2082.1, "«زارتنا البركة» إذا جاءك بعضُ الأولياء والصالحين من أهل العلم والعبادة والزهد والورع؟"], [2088.0, "الجواب: هذا من الأقوال التي لا بأس بها إذا كان الإنسان يقصد أنها بركةٌ معنويّةٌ لازمة،"], [2099.0, "ولكنها من البدع المحدَثة إذا كان يقصد قائلُها البركةَ الذاتيّة المنتقلة."], [2106.0, "فإذا كان يقصد البركة الذاتيّة المنتقلة فإنها بدعة،"], [2115.0, "وإذا كان يقصد البركة المعنويّة اللازمة فإنه لا بأس بها."]], "tr": [[2074.0, "Burada ele alınıp incelenmesinde sakınca olmayan bazı meseleler var."], [2079.0, "Bunlardan biri: İlim, ibadet, zühd ve vera' ehlinden bazı velîler ve sâlihler sana geldiğinde \"Bereket bizi ziyaret etti\" demenin hükmü nedir?"], [2088.0, "Cevap: İnsan bunun manevî ve lâzım bir bereket olduğunu kastediyorsa, bu sakıncası olmayan sözlerdendir."], [2097.3, "Ama bunu söyleyen zâtî ve intikal eden bereketi kastediyorsa, sonradan çıkarılmış bid'atlerdendir."], [2106.0, "Zâtî ve intikal eden bereketi kastediyorsa bid'attir;"], [2115.0, "manevî ve lâzım bereketi kastediyorsa onda sakınca yoktur."]]}, {"reader": false, "ar": [[2122.0, "ومنها: ما حكمُ قول الإنسان:"], [2127.0, "«أصابني هذا ببركة هذا الشيخ»؟"], [2131.0, "«أصابني هذا» ـ أي الخيرُ والعلمُ والحفظ ـ «ببركة هذا الشيخ»."], [2139.0, "الجواب: إن كان يقصد هذه البركة التي ينسبها لهذا الشيخ أنها البركةُ المعنويّة الملازمة فإنّ هذا جائزٌ لا بأس به،"], [2152.0, "وأمّا إذا كان يقصد بها البركةَ الذاتيّة المنتقلة فإنها من البدع المحدَثة التي ما أنزل الله عز وجل بها من سلطان."]], "tr": [[2122.0, "Bunlardan biri de: İnsanın \"Bu bana şu şeyhin bereketiyle isabet etti\" demesinin hükmü nedir?"], [2139.0, "\"Bu bana\" —yani hayır, ilim ve ezber— \"şu şeyhin bereketiyle isabet etti.\" Cevap:"], [2146.6, "Bu şeyhe nispet ettiği bu bereketle, (sahibinden) ayrılmayan manevî bereketi kastediyorsa, bu caizdir, sakıncası yoktur."], [2154.9, "Ama onunla zâtî ve intikal eden bereketi kastediyorsa, Allah Azze ve Celle'nin hakkında hiçbir delil indirmediği, sonradan çıkarılmış bid'atlerdendir."]]}, {"reader": false, "ar": [[2164.0, "ومنها: لو قال قائلٌ:"], [2167.1, "«كلُّك بركة». الجواب: نفسُ الجواب السابق."], [2185.0, "فإن كان يقصد بها البركةَ المعنويّة ـ لعظيم إيمانه،"], [2189.8, "وصحّة توحيده، وكثرة منافعه للإسلام والمسلمين ـ فلا جرم أنها جائزة،"], [2198.7, "أعني إذا كان يقصد بها البركةَ المعنويّة اللازمة."], [2204.0, "وأمّا إذا كان يقصد بها البركةَ الذاتيّة المنتقلة فإنها من الأقوال المحدَثة والبدع المستنكَرة التي لا يجوز اعتقادُها."]], "tr": [[2164.0, "Bunlardan biri de: Biri \"Sen baştan başa bereketsin\" derse (hükmü nedir)?"], [2185.0, "Cevap: Bir önceki cevabın aynısıdır."], [2187.4, "Eğer bununla —imanının büyüklüğü, tevhidinin sıhhati ve İslâm'a ve Müslümanlara faydasının çokluğu sebebiyle— manevî bereketi kastediyorsa, şüphesiz caizdir;"], [2199.3, "yani bununla manevî ve lâzım bereketi kastediyorsa."], [2204.0, "Ama bununla zâtî ve intikal eden bereketi kastediyorsa, sonradan çıkarılmış sözlerden ve itikad edilmesi caiz olmayan münker bid'atlerdendir."]]}]}, {"ts": "37:00", "title": "4. Külliye: Her Müslümanda, şeriate uygunluğu ölçüsünde bereket vardır", "paras": [{"reader": false, "ar": [[2220.0, "ومن الكلّيّات أيضًا: <b>كلُّ مسلمٍ ففيه من البركة بقدر ما فيه من موافقة الشرع باطنًا وظاهرًا.<\/b> كلُّ مسلمٍ ففيه من البركة بقدر ما فيه من موافقة الشرع ظاهرًا ـ أي في الأعمال ـ وباطنًا ـ أي في العقائد."], [2262.0, "أقول وبالله التوفيق… أُعيدها،"], [2266.2, "طيّب: <b>كلُّ مسلمٍ ففيه من البركة بقدر ما فيه من موافقة الشرع باطنًا وظاهرًا.<\/b>"]], "tr": [[2220.0, "Külliyelerden biri de şudur (<b>4. külliye<\/b>):"], [2224.6, "<b>Her Müslümanda, bâtınen ve zâhiren şeriate uygunluğu ölçüsünde bereket vardır.<\/b> Her Müslümanda, zâhiren —yani amellerde— ve bâtınen —yani akîdelerde— şeriate uygunluğu ölçüsünde bereket vardır."], [2262.0, "Tevfik Allah'tandır, derim ki… Tekrar ediyorum, peki:"], [2267.6, "<b>Her Müslümanda, bâtınen ve zâhiren şeriate uygunluğu ölçüsünde bereket vardır.<\/b>"]]}, {"reader": false, "ar": [[2275.0, "أقول وبالله التوفيق: وبرهانُ هذه الكلّيّة ما في الصحيح من حديث عبد الله بن عمر رضي الله عنهما:"], [2285.0, "أنّ النبيّ صلى الله عليه وسلم قال ذات يوم:"], [2288.0, "«إنّ من الشجر شجرةً لا يتحاتُّ ورقُها، وهي مثلُ المسلم، فحدّثوني ما هي؟» فوقع الناسُ في شجر البوادي،"], [2302.0, "ووقع في نفسي أنها النخلة،"], [2305.0, "فأردتُ أن أُخبر رسول الله صلى الله عليه وسلم،"], [2309.0, "فقال صلى الله عليه وسلم ـ أي قبل أن أُخبره ـ: «هي النخلة»."]], "tr": [[2275.0, "Tevfik Allah'tandır, derim ki: Bu külliyenin delili, Sahîh'te Abdullah b."], [2278.0, "Ömer —Allah ikisinden de razı olsun— hadisinde geçen şudur:"], [2281.3, "Peygamber sallallâhu aleyhi ve sellem bir gün şöyle buyurdu:"], [2285.0, "\"Ağaçlardan bir ağaç vardır ki yaprakları dökülmez;"], [2286.0, "o Müslümanın benzeridir. Bana onun ne olduğunu söyleyin.\" İnsanlar çöl ağaçlarını (saymaya) daldılar."], [2288.0, "İçime onun hurma ağacı olduğu düştü;"], [2294.1, "Resûlullah sallallâhu aleyhi ve sellem'e haber vermek istedim."], [2303.2, "Derken —yani ben ona haber vermeden önce— sallallâhu aleyhi ve sellem: \"O, hurma ağacıdır\" buyurdu."]]}, {"reader": false, "ar": [[2317.0, "فهذا الحديث يُثبت فيه النبيّ صلى الله عليه وسلم أنّ كلَّ مسلمٍ فيه بركة،"], [2325.9, "في قوله: «وإنّها…» ـ لمّا (جعل) بركتَها كبركة المسلم <span class=\"q\">؟ 38:42<\/span> ـ فكلُّ مسلمٍ فيه بركةٌ حيًّا وميّتًا."], [2336.0, "ففيه بركةٌ لنفسه، وبركةٌ لأهله،"], [2339.5, "وبركةٌ لعشيرته، وبركةٌ لأمّته،"], [2342.2, "وبركةٌ لوطنه، بل وبركةٌ للعالم أجمع إذا كان من أهل العلم والتأليف."]], "tr": [[2317.0, "Bu hadiste Peygamber sallallâhu aleyhi ve sellem, her Müslümanda bereket bulunduğunu isbat etmektedir;"], [2321.4, "\"O (Müslümanın benzeridir)…\" sözünde —onun bereketini Müslümanın bereketi gibi (kıldığı) için <span class=\"q\">؟<\/span>—."], [2327.2, "Dolayısıyla her Müslümanda, diri iken de ölü iken de bereket vardır."], [2336.0, "Onda kendisi için bereket, ailesi için bereket, aşireti için bereket, ümmeti için bereket ve vatanı için bereket vardır;"], [2346.2, "hatta ilim ve telif ehlindense bütün âlem için bereket vardır."]]}, {"reader": false, "ar": [[2351.0, "ولكنّ هذه البركة تتفاوت بين أهل الإسلام بتفاوت موافقتهم للشرع؛"], [2360.0, "فأعظمُنا موافقةً للشرع باطنًا وظاهرًا أعظمُنا بركة."], [2368.0, "وهذه البركة ليست في حياة المؤمن فقط،"], [2374.0, "بل هي بركةٌ في حياته وبعد موته."], [2377.0, "وعلى ذلك ما في صحيح الإمام مسلم من حديث أبي هريرة رضي الله عنه قال:"], [2382.4, "قال النبيّ صلى الله عليه وسلم:"], [2385.0, "«إذا مات الإنسان انقطع عمله إلا من ثلاث: صدقةٍ جارية» ـ وتلك من بركاته ـ «أو علمٍ يُنتفع به» ـ وهذا من بركاته ـ «أو ولدٍ صالحٍ يدعو له» ـ وهذا من بركات حسن تربيته لأولاده أيضًا."]], "tr": [[2351.0, "Ancak bu bereket, İslâm ehli arasında şeriate uygunluklarının farklılığına göre farklılık gösterir."], [2360.0, "Bâtınen ve zâhiren şeriate en çok uyanımız, bereketi en büyük olanımızdır."], [2368.0, "Bu bereket sadece müminin hayatında değildir;"], [2371.7, "bilakis hem hayatında hem de ölümünden sonra bir berekettir."], [2377.0, "Buna delil, İmam Müslim'in Sahîh'inde Ebû Hüreyre —Allah ondan razı olsun— hadisinde geçen şudur:"], [2382.4, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2385.0, "\"İnsan öldüğünde ameli kesilir; ancak üç şey müstesna:"], [2389.7, "Sadaka-i câriye\" —bu onun bereketlerindendir— \"veya kendisinden faydalanılan ilim\" —bu da onun bereketlerindendir— \"veya kendisine dua eden sâlih evlat\" —bu da çocuklarını güzel terbiye etmesinin bereketlerindendir."]]}, {"reader": false, "ar": [[2408.0, "وأخرج الإمام ابن ماجه في سننه،"], [2411.6, "والبيهقيّ في شعب الإيمان،"], [2414.0, "بإسنادٍ حسنٍ لغيره، قال:"], [2417.4, "قال النبيّ صلى الله عليه وسلم:"], [2420.0, "«إنّ ممّا يلحق المؤمنَ بعد موته من أعماله وحسناته: علمًا علّمه ونشره، أو ولدًا صالحًا تركه، أو مصحفًا ورّثه، أو مسجدًا بناه، أو بيتًا لابن السبيل بناه، أو نهرًا أجراه، أو صدقةً تصدّق بها في صحّته وحياته، يلحقه أجرُها بعد مماته»،"], [2453.0, "أو كما قال صلى الله عليه وسلم."]], "tr": [[2408.0, "İmam İbn Mâce Sünen'inde, Beyhakî de Şuabü'l-Îmân'da li-gayrihî hasen bir senetle şunu rivayet etmiştir:"], [2417.4, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2420.0, "\"Ölümünden sonra müminin amellerinden ve iyiliklerinden ona ulaşanlar şunlardır:"], [2424.3, "Öğrettiği ve yaydığı bir ilim, veya geride bıraktığı sâlih bir evlat, veya miras bıraktığı bir mushaf, veya bina ettiği bir mescit, veya yolcu için bina ettiği bir ev, veya akıttığı bir nehir, veya sağlığında ve hayatında verdiği, ölümünden sonra sevabı kendisine ulaşan bir sadaka.\" Ya da onun sallallâhu aleyhi ve sellem buyurduğu gibi."]]}, {"reader": false, "ar": [[2456.0, "فإذا ترك المؤمنُ جُمَلًا من المؤلّفات،"], [2460.0, "أو بنى مسجدًا ثم مات،"], [2463.0, "أو عمل شيئًا من الصدقات ذاتِ المنافع المتعدّية ثم مات،"], [2468.7, "فلا تزال بركاتُه على أهل الإسلام تَتْرى ما بقيت هذه الأعمال بين ظهرانيهم."], [2478.0, "وهذا من نعمة الله عز وجل،"], [2483.0, "ولكنها بركةٌ معنويّةٌ لازمة."]], "tr": [[2456.0, "Mümin birtakım eserler bırakırsa, ya da bir mescit bina edip sonra ölürse, ya da faydası başkalarına geçen sadakalardan bir şey yapıp sonra ölürse, bu ameller onların arasında kaldıkça bereketleri İslâm ehli üzerine art arda gelmeye devam eder."], [2478.0, "Bu, Allah Azze ve Celle'nin nimetindendir;"], [2481.1, "ancak bu manevî ve lâzım bir berekettir."]]}]}, {"ts": "41:27", "title": "5. Külliye: Bereketi şer'an sabit olan her şey onun sebebidir, onu var eden değildir", "paras": [{"reader": false, "ar": [[2487.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما ثبتت فيه البركةُ شرعًا فهو سببٌ لها لا بمُنشئٍ لها.<\/b> كلُّ ما ثبتت فيه البركةُ شرعًا فهو سببٌ لها لا بمُنشئٍ لها."], [2512.0, "<b>كلُّ ما ثبتت فيه البركةُ شرعًا فهو سببٌ لها لا بمُنشئٍ لها.<\/b>"]], "tr": [[2487.0, "Külliyelerden biri de şudur (<b>5. külliye<\/b>):"], [2490.0, "<b>Kendisinde bereketin şer'an sabit olduğu her şey onun sebebidir, onu var eden (inşâ eden) değildir.<\/b> Kendisinde bereketin şer'an sabit olduğu her şey onun sebebidir, onu var eden değildir."], [2512.0, "<b>Kendisinde bereketin şer'an sabit olduğu her şey onun sebebidir, onu var eden değildir.<\/b>"]]}, {"reader": false, "ar": [[2520.1, "أقول وبالله التوفيق: وذلك لأنّ المتقرّر في القواعد أنّ واضعَ البركة وخالقَها إنما هو الله تبارك وتعالى،"], [2530.0, "وأنّ أحدًا من الخلق لا يستطيع ـ مهما عظم شأنُه وقوّتُه وقدرُه ومنزلتُه ـ أن يضع مطلقَ البركة في شيءٍ من المخلوقات الأخرى."], [2546.0, "فلا الملائكةُ المقرّبون يضعون البركة،"], [2549.0, "ولا الأولياء، ولا الأنبياءُ والرسلُ والأولياءُ والصالحون يستطيعون وضعَ بركةٍ في شيءٍ من ذلك."]], "tr": [[2520.1, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [2523.0, "Kaidelerde yerleşik olan, bereketi koyanın ve onu yaratanın ancak Allah Tebâreke ve Teâlâ olduğudur."], [2529.6, "Mahlûklardan hiç kimse —şanı, gücü, kadri ve mertebesi ne kadar büyük olursa olsun— diğer mahlûklardan herhangi bir şeye mutlak manada bereket koyamaz."], [2546.0, "Ne mukarrab melekler bereket koyar, ne velîler;"], [2550.5, "ne peygamberler, resuller, velîler ve sâlihler bunlardan herhangi bir şeye bereket koyabilir."]]}, {"reader": false, "ar": [[2557.0, "فإذا أخبرنا الشارع بأنّ هذا الزمانَ زمانٌ مبارك،"], [2564.0, "فنعتقد مباشرةً أنه سببٌ للبركة،"], [2567.0, "ولكنّ الزمان لم يُنشئ البركة."], [2569.0, "وإذا أخبرنا الشارع بأنّ هذا المكان مكانٌ مبارك،"], [2574.0, "فنعتقد مباشرةً بأنه سببٌ للبركة،"], [2578.0, "ولكن ليس بمُنشئٍ للبركة."], [2580.0, "وإذا أخبرنا الشارع بأنّ النبيّ صلى الله عليه وسلم بركتُه ذاتيّةٌ منتقلة،"], [2587.0, "فإنّنا نعتقد مباشرةً بأنّ التبرّك به سببٌ لحلول بركة الله،"], [2594.0, "ولكنّ النبيّ صلى الله عليه وسلم لم يخلق هذه البركة،"], [2600.6, "ولم يُنشئها من قِبَل نفسه عليه الصلاة والسلام."]], "tr": [[2557.0, "Şâri' bize bu zamanın mübarek bir zaman olduğunu haber verdiğinde, doğrudan onun bereketin sebebi olduğuna inanırız;"], [2567.0, "ama zaman bereketi var etmemiştir."], [2569.0, "Şâri' bize bu mekânın mübarek bir mekân olduğunu haber verdiğinde, doğrudan onun bereketin sebebi olduğuna inanırız;"], [2577.2, "ama o bereketi var eden değildir."], [2580.0, "Şâri' bize Peygamber sallallâhu aleyhi ve sellem'in bereketinin zâtî ve intikal eden bir bereket olduğunu haber verdiğinde, doğrudan onunla teberrüğün Allah'ın bereketinin inmesine sebep olduğuna inanırız;"], [2594.0, "ama Peygamber sallallâhu aleyhi ve sellem bu bereketi yaratmamış ve onu —salât ve selâm üzerine olsun— kendi tarafından var etmemiştir."]]}, {"reader": false, "ar": [[2606.0, "وإذا أخبرنا الشارع بأنّ المسلمين فيهم بركةٌ معنويّةٌ لازمة،"], [2612.0, "أو أنّ القرآن فيه بركة،"], [2613.8, "أو أنّ ماءَ زمزم فيه بركة،"], [2616.0, "أو أنّ الزيتَ والعسل،"], [2617.8, "أو النخلَ والتمر فيه بركة،"], [2620.0, "فنعتقد مباشرةً بأنه سببٌ لبركة الله عز وجل،"], [2627.0, "ولكنه لم يُنشئ شيئًا من هذه البركة."], [2633.0, "فلا حولَ ولا قوّةَ لمخلوقٍ أبدًا أن يُنشئ بركةً في نفسه،"], [2637.0, "زمانًا كان أو مكانًا أو عينًا،"], [2641.0, "وهذا بإجماع أهل السنّة والجماعة."], [2645.0, "بل إنّنا قلنا سابقًا:"], [2646.5, "إنّ كلَّ من اعتقد أنّ مخلوقًا يُنشئ بركةً استقلاليّةً بذاته فإنه يكون قد أشرك الشركَ الأكبر المخرجَ عن الملّة بالكلّيّة، والله أعلم."]], "tr": [[2606.0, "Şâri' bize Müslümanlarda manevî ve lâzım bir bereket bulunduğunu, ya da Kur'an'da bereket bulunduğunu, ya da zemzem suyunda bereket bulunduğunu, ya da zeytinyağında ve balda, ya da hurma ağacında ve hurmada bereket bulunduğunu haber verdiğinde, doğrudan onun Allah Azze ve Celle'nin bereketine sebep olduğuna inanırız;"], [2627.0, "ama o bu bereketten hiçbir şeyi var etmemiştir."], [2633.0, "Hiçbir mahlûkun —zaman olsun, mekân olsun, varlık olsun— kendi kendine bir bereket var etmeye asla gücü ve kuvveti yoktur;"], [2641.0, "bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır."], [2645.0, "Hatta daha önce şöyle demiştik:"], [2646.5, "Bir mahlûkun kendi zâtıyla müstakil olarak bereket var ettiğine inanan herkes, milletten tamamen çıkaran büyük şirke düşmüş olur. Allah en iyisini bilir."]]}]}, {"ts": "44:21", "title": "6. Külliye: Peygamber'in zâtıyla teberrüğü caiz gören her delil ona mahsustur", "paras": [{"reader": false, "ar": [[2661.0, "ومن الكلّيّات أيضًا: كلُّ دليلٍ ـ وهذا انتبهوا له؛"], [2666.0, "لأنه يكشف شبهةً في باب التبرّك ـ <b>كلُّ دليلٍ يُجيز التبرّك بذات النبيّ صلى الله عليه وسلم فمخصوصٌ به.<\/b> أُعيدها مرّةً ثالثة:"], [2686.0, "<b>كلُّ دليلٍ يُجيز التبرّك بذات النبيّ صلى الله عليه وسلم فمخصوصٌ به.<\/b>"]], "tr": [[2661.0, "Külliyelerden biri de şudur (<b>6. külliye<\/b>):"], [2664.0, "Her delil —buna dikkat edin, çünkü teberrük babındaki bir şüpheyi ortaya koyuyor— <b>Peygamber sallallâhu aleyhi ve sellem'in zâtıyla teberrüğü caiz kılan her delil ona mahsustur.<\/b> Üçüncü kez tekrar ediyorum:"], [2686.0, "<b>Peygamber sallallâhu aleyhi ve sellem'in zâtıyla teberrüğü caiz kılan her delil ona mahsustur.<\/b>"]]}, {"reader": false, "ar": [[2692.0, "أقول وبالله التوفيق: وهذه الكلّيّة تسدّ عنّا بابًا عظيمًا من أبواب الخرافات في باب التبرّك،"], [2702.0, "والتي يُقرّرها بعضُ أهل العلم ممّن نطلب لهم المعاذير،"], [2711.0, "ويُقرّرها بعضُ أهل البدع أصالةً ممّن لا يُطلب لهم المعاذير،"], [2717.0, "فيُجيزون التبرّك بالأولياء والصالحين."], [2722.0, "فإذا طلبنا دليلَهم على جواز التبرّك بها،"], [2726.0, "فإنهم يعمدون في أوّل استدلالاتهم إلى تلك الأدلّة التي تُبيّن أنّ الصحابة رضي الله عنهم كانوا يتبرّكون بشعر رسول الله صلى الله عليه وسلم،"], [2742.0, "وبريقه، وبفضلة طَهوره، وبعرقه،"], [2745.2, "وبثيابه، فيُلحقون ـ أو فيقيسون ـ كافّةَ الأولياء والصالحين على النبيّ صلى الله عليه وسلم."]], "tr": [[2692.0, "Tevfik Allah'tandır, derim ki: Bu külliye, teberrük babındaki hurafe kapılarından büyük bir kapıyı bize kapatır."], [2694.0, "Bu hurafeleri, kendileri için mazeret aradığımız bazı ehl-i ilim de ortaya koyar;"], [2702.8, "kendileri için mazeret aranmayan, aslen bid'at ehli olan bazıları da ortaya koyar."], [2714.6, "Böylece velîlerle ve sâlihlerle teberrüğü caiz görürler."], [2722.0, "Onlardan bununla teberrüğün caiz olduğuna dair delillerini istediğimizde, delil getirmelerinin başında, sahabenin —Allah onlardan razı olsun— Resûlullah sallallâhu aleyhi ve sellem'in saçıyla, tükürüğüyle, abdest suyunun artığıyla, teriyle ve elbiseleriyle teberrük ettiğini gösteren delillere yönelirler."], [2742.8, "Böylece bütün velîleri ve sâlihleri Peygamber sallallâhu aleyhi ve sellem'e ilhak eder —ya da kıyas eder—ler."]]}, {"reader": false, "ar": [[2758.0, "فتأتي هذه الكلّيّة لتُبيّن أنّ هذه الأدلّة من جملة خصوصيّاته صلى الله عليه وسلم."], [2768.0, "فإن قلتَ: وكيف تُجيب عمّا تقرّر في القواعد أنّ الأصل في الخصائص التوقيف،"], [2776.0, "فلا يجوز لك أن تدّعي خصيصةً بأحدٍ من الخلق دون غيره إلا إذا جئتنا بدليلٍ يدلّ على تخصيصه بها؟"], [2787.0, "فأقول: الدليلُ على تخصيصه بها إجماعُ أصحاب النبيّ صلى الله عليه وسلم على تخصيصه بمثل هذا النوع من التبرّكات."]], "tr": [[2758.0, "İşte bu külliye, bu delillerin onun sallallâhu aleyhi ve sellem hususiyetleri cümlesinden olduğunu açıklamak için gelir."], [2768.0, "Eğer şöyle dersen: \"Kaidelerde yerleşik olan 'Hususiyetlerde asıl tevkîftir;"], [2772.3, "dolayısıyla mahlûklardan birine, başkalarına değil de ona has bir hususiyet olduğunu, onun buna tahsis edildiğini gösteren bir delil getirmedikçe iddia etmen caiz değildir' kaidesine nasıl cevap verirsin?\" Derim ki:"], [2787.0, "Onun buna tahsis edildiğinin delili, Peygamber sallallâhu aleyhi ve sellem'in ashâbının, bu tür teberrükleri ona tahsis etme üzerindeki icmâıdır."]]}, {"reader": false, "ar": [[2799.0, "وإلا فإنّ الجميع متّفقٌ على أنّ أبا بكرٍ فيه بركة،"], [2805.0, "وعلى أنّ عمرَ فيه بركة،"], [2807.0, "وعلى أنّ المهاجرين والأنصار فيهم بركة."], [2810.0, "ولم يثبت عن صحابيٍّ واحدٍ أنه كان يفعل مع بركة إخوانه من الصحابة كما كان يفعل الصحابة مع بركة النبيّ صلى الله عليه وسلم."], [2821.0, "ولم يُخرَم <span class=\"q\">؟ 47:01<\/span> ـ ولا مرّةً واحدةً في حياتهم ـ أنهم تبرّكوا بريق صحابيٍّ،"], [2828.8, "أو بثياب صحابيٍّ، أو بعرق صحابيٍّ،"], [2835.0, "لا الخلفاءُ الأربعة ولا من دونهم من المهاجرين أو الأنصار."]], "tr": [[2799.0, "Aksi hâlde herkes Ebû Bekir'de bereket bulunduğunda, Ömer'de bereket bulunduğunda, Muhâcirler'de ve Ensâr'da bereket bulunduğunda ittifak etmektedir."], [2810.0, "(Buna rağmen) tek bir sahabinin, sahabeden kardeşlerinin bereketiyle, sahabenin Peygamber sallallâhu aleyhi ve sellem'in bereketiyle yaptığı gibi bir şey yaptığı sabit olmamıştır."], [2819.5, "Hayatlarında bir kez bile —ne dört halife ne de onlardan aşağıdaki Muhâcirler veya Ensâr— bir sahabinin tükürüğüyle, ya da bir sahabinin elbisesiyle, ya da bir sahabinin teriyle teberrük ettikleri (bu icmâ) bozulmamıştır <span class=\"q\">؟<\/span>."]]}, {"reader": false, "ar": [[2841.0, "فهذا إجماعٌ عمليٌّ منهم على أنّ تلك الأدلّة الكثيرة في التبرّك بذات النبيّ صلى الله عليه وسلم إنما يختصّ بها هو نفسُه،"], [2852.9, "ولا يجوز أن يدخل معه أحدٌ غيرُه."], [2857.0, "وهذا إجماعٌ قطعيٌّ منقولٌ بالتواتر عن أصحاب النبيّ صلى الله عليه وسلم."]], "tr": [[2841.0, "Bu, onlardan, Peygamber sallallâhu aleyhi ve sellem'in zâtıyla teberrük hakkındaki o çok sayıdaki delillerin ancak bizzat ona mahsus olduğuna ve onunla birlikte başka hiç kimsenin (bu hükme) girmesinin caiz olmadığına dair amelî bir icmâdır."], [2857.0, "Bu da Peygamber sallallâhu aleyhi ve sellem'in ashâbından tevatürle nakledilmiş kat'î bir icmâdır."]]}, {"reader": false, "ar": [[2866.0, "ونقول ثانيًا: إنّ المتقرّر في القواعد أنّ من شرط صحّة القياس الاتّفاقَ في العلّة بين المقيس والمقيس عليه ـ أي بين الأصل والفرع ـ فمتى ما وُجد فرقانٌ بينهما فيكون القياسُ باطلًا فاسدًا؛"], [2885.1, "لأنه قياسٌ مع الفارق."], [2889.0, "والمتقرّر في القواعد أنّ القياس مع الفارق باطل."]], "tr": [[2866.0, "İkinci olarak deriz ki: Kaidelerde yerleşik olan şudur:"], [2869.8, "Kıyasın sahih olmasının şartlarından biri, makîs ile makîsun aleyh —yani asıl ile fer'— arasında illette ittifaktır."], [2878.0, "Ne zaman ikisi arasında bir fark bulunursa, kıyas bâtıl ve fâsit olur;"], [2885.1, "çünkü bu, fark bulunan bir kıyastır."], [2889.0, "Kaidelerde yerleşik olan da fark bulunan kıyasın bâtıl olduğudur."]]}, {"reader": false, "ar": [[2894.0, "فإن قلتَ: وما تخريجُ ما ذكرتَه من بطلان القياس على هذه الأدلّة؟"], [2904.0, "الجواب: إنّ جواز التبرّك بذات النبيّ صلى الله عليه وسلم ليس لمجرّد صلاحه وولايته فقط حتى يدخل معه كلُّ وليٍّ وصالح،"], [2919.0, "وإنما لمعنًى أعظمَ من ذلك لا يُوافقه فيه غيرُه أبدًا من الأمّة،"], [2925.0, "وهو أنه رسولُ الله،"], [2927.8, "ونبيُّ الله، وأفضلُ الخلق عند الله،"], [2935.0, "ولأنه صاحبُ المقام المحمود،"], [2937.9, "والحوض المورود، والشفاعة العظمى."]], "tr": [[2894.0, "Eğer şöyle dersen: \"Zikrettiğin, bu delillere kıyasın bâtıl oluşunun gerekçelendirmesi nedir?\" Cevap:"], [2896.1, "Peygamber sallallâhu aleyhi ve sellem'in zâtıyla teberrüğün caiz oluşu, sırf onun salâhı ve velîliği sebebiyle değildir ki her velî ve sâlih onunla birlikte (bu hükme) girsin."], [2904.0, "Bilakis bundan daha büyük bir mana sebebiyledir ki ümmetten hiç kimse bu konuda asla ona denk olamaz."], [2918.5, "O da onun Allah'ın Resûlü, Allah'ın Neb
