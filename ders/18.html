<script>
const D={"no": 18, "vid": "zlqhnIOlouY", "title_ar": "الدرس (١٨) من شرح كليات العقيدة — تابع: كليات في القضاء والقدر", "title_tr": "Şerhu Külliyyâti'l-Akîde — 18. Ders: Kaza ve Kadere Dair Külliyeler (Kadere İlimsiz Dalmak, «Lev» Lafzı, Şer'î ve Kevnî İstitaat, Hidayet ve Dalalet)", "sections": [{"ts": "00:00", "title": "1. Külliye: İlim ve delil olmadan kadere dalmak, onu kötülemeyi gerektirir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.0, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.0, "وعلى آله وأصحابه ومن تبعهم بإحسانٍ إلى يوم الدين."], [9.5, "لا نزال في القواعد المتعلِّقة بباب الربوبية،"], [13.0, "ممثَّلةً في قواعد باب القضاء والقدر،"], [16.0, "وعندنا في هذا الدرس المبارك ـ إن شاء الله ـ عشرُ كلّيّات."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.0, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.5, "Hâlâ kaza ve kader babının kaideleri şeklinde temsil edilen rubûbiyyet babıyla ilgili kaidelerdeyiz."], [16.0, "Bu mübarek derste —inşallah— on külliyemiz var."]]}, {"reader": false, "ar": [[21.0, "الكلّيّة الأولى: <b>كلُّ خوضٍ في القدر بلا علمٍ ولا برهانٍ فموجِبٌ للطعن فيه.<\/b> وأُعيدها مرةً ثالثة:"], [31.0, "كلُّ خوضٍ في القدر بلا علمٍ ولا برهانٍ فموجِبٌ للطعن فيه؛"], [44.0, "أي: موجِبٌ للطعن في القضاء والقدر،"], [46.8, "وموجِبٌ للطعن في حكمة الله عز وجل."], [50.0, "وقد يُفضي هذا الخوضُ ـ والعياذ بالله ـ إلى التكذيب بالقضاء والقدر."]], "tr": [[21.0, "Birinci külliye: <b>1. külliye: İlim ve burhan (kesin delil) olmaksızın kadere her dalış, onu kötülemeyi gerektirir.<\/b> Üçüncü kez tekrar ediyorum:"], [31.0, "İlim ve burhan olmaksızın kadere her dalış, onu kötülemeyi gerektirir;"], [44.0, "yani kaza ve kaderi kötülemeyi gerektirir ve Allah Azze ve Celle'nin hikmetini kötülemeyi gerektirir."], [50.0, "Bu dalış —Allah korusun— kaza ve kaderi yalanlamaya da götürebilir."]]}, {"reader": false, "ar": [[55.0, "فالخوضُ فيه بلا علمٍ ولا برهانٍ ولا هدًى يوجب مثلَ ذلك؛"], [61.0, "فيوجب الطعنَ في القضاء والقدر،"], [63.3, "ويوجب تكذيبَه، ويوجب سوءَ الظنّ بالله عز وجل،"], [67.0, "ويوجب الطعنَ في حكمة الله عز وجل،"], [70.9, "المُوجِبَ للهلاك. وقد أخبرنا النبيُّ صلى الله عليه وسلم أنّ من أسباب هلاك الأمم ممّن هم قبلنا أنهم خاضوا في القضاء والقدر بلا علمٍ ولا برهان."]], "tr": [[55.0, "İlim, burhan ve hidayet olmaksızın ona dalmak bunun benzerini gerektirir:"], [61.0, "Kaza ve kaderi kötülemeyi, onu yalanlamayı, Allah Azze ve Celle hakkında kötü zannı ve Allah Azze ve Celle'nin hikmetini kötülemeyi gerektirir;"], [70.9, "(bu da) helake götürendir. Nebî ﷺ bize, bizden önceki ümmetlerin helak sebeplerinden birinin, ilim ve burhan olmaksızın kaza ve kadere dalmaları olduğunu haber vermiştir."]]}, {"reader": false, "ar": [[82.0, "ففي «مسند الإمام أحمد» رحمه الله تعالى من حديث عمرو بن شعيب عن أبيه عن جدّه:"], [89.0, "أنّ النبيّ صلى الله عليه وسلم خرج على أصحابه ذاتَ يومٍ وهم يتنازعون في القدر،"], [96.0, "فغضب غضبًا شديدًا حتى كأنما فُقِئَ في وجهه حَبُّ الرُّمّان من الغضب،"], [101.0, "فقال صلى الله عليه وسلم:"], [103.9, "«ما لكم تضربون كتابَ الله بعضَه ببعض؟! بهذا هلك مَن كان قبلكم». حديثٌ حسن."]], "tr": [[82.0, "İmam Ahmed'in —Allah Teâlâ ona rahmet etsin— \"Müsned\"inde Amr b."], [82.0, "Şuayb'dan, o babasından, o da dedesinden gelen hadiste şöyle geçer:"], [89.0, "Nebî ﷺ bir gün ashâbının yanına çıktı;"], [89.0, "onlar kader hakkında çekişiyorlardı. Öyle şiddetli öfkelendi ki öfkeden sanki yüzünde nar taneleri patlatılmıştı."], [96.0, "ﷺ şöyle buyurdu: «Size ne oluyor da Allah'ın Kitabı'nın bir kısmını diğer kısmıyla çarpıştırıyorsunuz?! Sizden öncekiler bununla helak oldu.» Hasen bir hadistir."]]}, {"reader": false, "ar": [[112.0, "وعند الإمام الطبراني رحمه الله تعالى بإسنادٍ حسن،"], [116.0, "من حديث ثوبان رضي الله تعالى عنه مرفوعًا،"], [120.0, "قال: قال صلى الله عليه وسلم:"], [123.9, "«إذا ذُكر أصحابي فأمسكوا، وإذا ذُكرت النجوم فأمسكوا، وإذا ذُكر القدر فأمسكوا»؛"], [134.0, "أي: لا تخوضوا فيه إلا بعلمٍ وبرهانٍ ودليل."], [138.0, "فمن أعظم الأخطار العقدية الخوضُ في هذا الباب بلا علم."]], "tr": [[112.0, "İmam Taberânî'nin —Allah Teâlâ ona rahmet etsin— rivayetinde hasen bir isnadla, Sevbân'dan —Allah ondan razı olsun— merfû olarak şöyle gelir:"], [120.0, "ﷺ buyurdu: «Ashâbım anıldığında (dilinizi) tutun; yıldızlar anıldığında tutun; kader anıldığında tutun.» Yani ona ancak ilim, burhan ve delille dalın."], [134.0, "Akîdeye dair en büyük tehlikelerden biri, bu baba ilimsiz dalmaktır."]]}, {"reader": false, "ar": [[143.0, "بل إنه أوّلُ ما نُوزع اللهُ عز وجل به:"], [147.0, "منازعتُه في قضائه وقدره؛"], [148.8, "لمّا خلق اللهُ آدمَ بيديه ـ فهذا قضاءٌ وقدرٌ كونيّ ـ ثم أمر الملائكةَ أن يسجدوا له ـ وهذا قدرٌ شرعيّ ـ فأبى إبليسُ معترضًا على قضاء الله الكونيّ والشرعيّ،"], [165.0, "فحصل ما حصل. فأوّلُ منازعةٍ لله عز وجل إنما كانت منازعةَ إبليس في شيءٍ من قضاء الله وقدره الكونيّ والشرعيّ."]], "tr": [[143.0, "Hatta Allah Azze ve Celle ile ilk çekişilen şey, O'nunla kazası ve kaderi hakkında çekişmektir."], [148.8, "Allah Âdem'i iki eliyle yarattığında —bu kevnî bir kaza ve kaderdir— sonra meleklere ona secde etmelerini emrettiğinde —bu da şer'î bir kaderdir— İblis, Allah'ın kevnî ve şer'î kazasına itiraz ederek (secdeden) kaçındı;"], [165.0, "sonra olan oldu. Allah Azze ve Celle ile ilk çekişme, İblis'in Allah'ın kevnî ve şer'î kaza ve kaderinin bir kısmı hakkındaki çekişmesiydi."]]}]}, {"ts": "02:56", "title": "1. Külliye (devam): Ebû Hüreyre hadisi; kadere ilimsiz dalmanın doğurduğu sapmalar", "paras": [{"reader": false, "ar": [[176.0, "وفي حديث أبي هريرة:"], [177.6, "أنّ النبيَّ صلى الله عليه وسلم خرج ذاتَ يومٍ على أصحابه فوجدهم يتنازعون في القدر،"], [184.0, "فقال: «أبهذا أُمرتم؟ أم بهذا أُرسلتُ إليكم؟ إنما هلك مَن قبلكم حين تنازعوا فيه، عزمتُ عليكم ـ عزمتُ عليكم ـ ألّا تتنازعوا فيه»."]], "tr": [[176.0, "Ebû Hüreyre hadisinde de şöyle geçer:"], [177.6, "Nebî ﷺ bir gün ashâbının yanına çıktı ve onları kader hakkında çekişirken buldu."], [177.6, "Şöyle buyurdu: «Bununla mı emrolundunuz? Yoksa ben size bununla mı gönderildim? Sizden öncekiler ancak onun hakkında çekiştikleri zaman helak oldular. Size kesin olarak emrediyorum —kesin olarak emrediyorum— onun hakkında çekişmeyin.»"]]}, {"reader": false, "ar": [[201.0, "فالواجبُ علينا أن نحذر من الخوض في القدر نظرًا وفكرًا ووسوسةً؛"], [207.0, "فإنه سرُّ الله عز وجل،"], [208.7, "الغيب، وما كان غيبيًّا فيكون الكلامُ فيه على حسب ما ورد به الدليل."], [216.0, "فما أُخرجت أفعالُ العباد من أن تكون مخلوقةً لله ـ كما قال القدرية ـ إلا بسبب خوضهم في باب القضاء والقدر بلا علم."]], "tr": [[201.0, "Bize vâcip olan, bakış, düşünce ve vesvese yoluyla kadere dalmaktan sakınmamızdır."], [201.0, "Çünkü o, Allah Azze ve Celle'nin sırrıdır, gaybdır."], [208.7, "Gaybî olan şey hakkında konuşmak da ancak delilin getirdiği ölçüde olur."], [216.0, "Kulların fiilleri —Kaderiyye'nin dediği gibi— Allah'ın mahlûku olmaktan ancak onların kaza ve kader babına ilimsiz dalmaları sebebiyle çıkarıldı."]]}, {"reader": false, "ar": [[227.0, "وما سُلب العبدُ قدرتَه ومشيئتَه ـ كما تقول الجبرية ـ إلا لمّا خاضوا في قضاء الله عز وجل وقدره بلا علم."], [237.0, "ولا عُورض الشرعُ بالقدر إلا لمّا خاض الناسُ في مسألة القضاء والقدر بلا علمٍ ولا برهان."], [248.0, "ولا ترك كثيرٌ من الناس شيئًا من الأعمال التعبّدية محتجّين على تركها بالقدر إلا بسبب الخوض بلا علمٍ ولا برهان."]], "tr": [[227.0, "Kulun kudreti ve meşîeti —Cebriyye'nin dediği gibi— ancak onlar Allah Azze ve Celle'nin kaza ve kaderine ilimsiz daldıklarında elinden alındı."], [227.0, "Şeriata kaderle ancak insanlar kaza ve kader meselesine ilim ve burhan olmaksızın daldıklarında muâraza edildi (itiraz edildi)."], [237.0, "İnsanların birçoğu da ibadet amellerinden bir kısmını, onları terk etmelerine kaderi delil getirerek, ancak ilim ve burhan olmaksızın dalmak sebebiyle terk etti."]]}, {"reader": false, "ar": [[257.9, "ولا احتجّ كثيرٌ من الناس على فعل المعصية بأنّ الله قدّرها عليه إلا بسبب الخوض في هذا الباب بلا علمٍ ولا برهان."], [268.0, "فأوّلُ منازل الفساد العقديّ هو الخوضُ في باب القضاء والقدر بلا علمٍ ولا برهان."]], "tr": [[257.9, "İnsanların birçoğu da günah işlemeye, Allah'ın onu kendisine takdir ettiğini delil getirmesi ancak bu baba ilim ve burhan olmaksızın dalmak sebebiyledir."], [268.0, "Akîdevî bozulmanın ilk durağı, kaza ve kader babına ilim ve burhan olmaksızın dalmaktır."]]}, {"reader": false, "ar": [[274.0, "فإن قلتَ: هذا يحملنا على ألّا نتكلّم فيه مطلقًا؟"], [279.0, "الجواب: لا، ولكن يحملنا على أن نكُفَّ ألسنتَنا عمّا لا علم لنا به في هذا الباب،"], [287.0, "وإنما يكون كلامُنا فيه على حسب ما قرّرته الأدلةُ كتابًا وسنةً،"], [293.0, "وعلى ما قرّره سلفُنا الصالح من أهل السنة والجماعة."], [299.0, "فنسأل الله عز وجل أن يجعلنا وإيّاكم من الموفَّقين."]], "tr": [[274.0, "\"Bu, bizi onun hakkında hiç konuşmamaya mı sevk eder?\" dersen, cevap:"], [279.0, "Hayır. Fakat bizi, bu babda hakkında ilmimiz olmayan şeyden dilimizi tutmaya sevk eder."], [279.0, "Onun hakkındaki sözümüz ancak Kitap ve Sünnet delillerinin ortaya koyduğu ve Ehl-i Sünnet ve'l-Cemaat'ten selef-i sâlihînimizin ortaya koyduğu ölçüde olur."], [293.0, "Allah Azze ve Celle'den bizi ve sizi muvaffak kılınanlardan eylemesini dileriz."]]}]}, {"ts": "05:04", "title": "2. Külliye: «Lev» lafzını tesahhut veya günaha heves için kullanan günahkârdır", "paras": [{"reader": false, "ar": [[304.0, "الكلّيّة الثانية: <b>كلُّ مَن استعمل «لو» في تسخُّطٍ أو تطلُّعٍ لمعصيةٍ فآثم.<\/b> كلُّ مَن استعمل «لو» في تسخُّطٍ أو تطلُّعٍ لمعصيةٍ فآثم. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[304.0, "İkinci külliye: <b>2. külliye: \"Lev\" (keşke / eğer … olsaydı) lafzını tesahhut (kadere öfkelenme) veya bir günaha göz dikmek için kullanan herkes günahkârdır.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[325.0, "هذه الكلّيّة ـ وفّقكم الله ـ تتكلّم عن أحكام استعمالات لفظة «لو»،"], [341.0, "وقد نصّ أهلُ السنة والجماعة رحمهم الله تعالى على أنّ لها أربعَ استعمالات:"], [349.0, "استعمالان محرَّمان، واستعمالٌ مشروع، واستعمالٌ جائز."]], "tr": [[325.0, "Bu külliye —Allah sizi muvaffak kılsın— \"lev\" lafzının kullanımlarının hükümlerinden bahseder."], [341.0, "Ehl-i Sünnet ve'l-Cemaat —Allah Teâlâ onlara rahmet etsin— onun dört kullanımı olduğunu açıkça belirtmişlerdir:"], [349.0, "İki haram kullanım, bir meşru kullanım ve bir caiz kullanım."]]}, {"reader": false, "ar": [[357.0, "أمّا الاستعمال المحرَّم الأول:"], [359.0, "فهو أن يستعملها الإنسانُ متسخِّطًا متضجِّرًا من قضاء الله عز وجل وقدره؛"], [365.0, "فمتى ما استُعملت «لو» في هذا الباب فإنها تكون قد استُعملت استعمالًا حرامًا."], [374.0, "كما في الصحيح من حديث أبي هريرة رضي الله عنه،"], [376.0, "قال: قال النبيّ صلى الله عليه وسلم:"], [378.9, "«فإن أصابك شيءٌ فلا تقل: لو أنّي فعلتُ كذا وكذا لكان كذا وكذا، ولكن قل: قَدَرُ الله وما شاء فعل» <span class=\"note\">(Müslim)<\/span>،"], [389.0, "أو قال: «قدَّرَ اللهُ» ـ روايتان ـ «وما شاء فعل»."]], "tr": [[357.0, "Birinci haram kullanım: İnsanın onu Allah Azze ve Celle'nin kaza ve kaderine öfkelenerek, sıkılarak kullanmasıdır."], [359.0, "\"Lev\" bu babda ne zaman kullanılırsa haram bir kullanımla kullanılmış olur."], [365.0, "Sahîh'te Ebû Hüreyre'den —Allah ondan razı olsun— gelen hadiste olduğu gibi:"], [374.0, "Nebî ﷺ buyurdu: «Sana bir şey isabet ederse \"Keşke şöyle şöyle yapsaydım, şöyle şöyle olurdu\" deme; fakat \"Allah'ın kaderidir, O dilediğini yapar\" de.» <span class=\"note\">(Müslim)<\/span>."], [378.9, "Ya da «Allah takdir etti» buyurdu —iki rivayet vardır— «ve dilediğini yaptı.»"]]}, {"reader": false, "ar": [[392.0, "وقد تقدّم لنا في كلّيّةٍ خاصة أنّ كلَّ لفظةٍ تتضمّن التسخّطَ على قضاء الله وقدره فإنها حرام."], [403.0, "فلمّا كان استعمالُ «لو» في هذا الباب يتنافى مع وجوب الصبر على قضاء الله وقدره صارت حرامًا،"], [412.0, "وهي من التسخّط اللساني،"], [416.0, "وقد قلنا بأنّ التسخّط محرَّمٌ كلُّه:"], [419.8, "لسانيًّا أو قلبيًّا أو عمليًّا."]], "tr": [[392.0, "Daha önce özel bir külliyede, Allah'ın kaza ve kaderine tesahhut içeren her lafzın haram olduğu geçmişti."], [392.0, "\"Lev\"in bu babda kullanılması, Allah'ın kaza ve kaderine sabretmenin vâcip oluşuyla çeliştiği için haram oldu;"], [403.0, "bu, dille yapılan tesahhuttandır. Tesahhutun —dille, kalple veya amelle olsun— tamamının haram olduğunu söylemiştik."]]}, {"reader": false, "ar": [[423.0, "الاستعمال المحرَّم الثاني: أن يستعملها الإنسانُ متطلِّعًا بها لفعل المعصية التي عجز عن تحصيل أسبابها."], [432.0, "كما أخرج الإمام الترمذي بإسنادٍ جيّد من حديث أبي كبشة الأنماري رضي الله تعالى عنه:"], [441.0, "أنّ النبيَّ صلى الله عليه وسلم قال:"], [443.8, "«إنما الدنيا لأربعة»، والذي يخصّنا منها الثالث:"], [447.3, "وهو الذي آتاه اللهُ عز وجل مالًا ولم يؤته علمًا،"], [453.0, "فهو يخبط في ماله خبطَ عشواء،"], [455.4, "فلا يتّقي فيه اللهَ."]], "tr": [[423.0, "İkinci haram kullanım: İnsanın onu, sebeplerini elde etmekten aciz kaldığı günahı işlemeye göz dikerek kullanmasıdır."], [423.0, "İmam Tirmizî'nin iyi bir isnadla Ebû Kebşe el-Enmârî'den —Allah Teâlâ ondan razı olsun— rivayet ettiği gibi:"], [441.0, "Nebî ﷺ buyurdu: «Dünya ancak dört kişi içindir.» Bizi ilgilendiren üçüncüsüdür:"], [443.8, "O, Allah Azze ve Celle'nin kendisine mal verip ilim vermediği kişidir;"], [447.3, "malında gece körü gibi gelişigüzel davranır, onda Allah'tan sakınmaz."]]}, {"reader": false, "ar": [[457.0, "«ورجلٌ ـ آتاه الله ـ لم يؤته اللهُ علمًا ولا مالًا، فيقول: لو أنّ لي مالًا مثلَ مال فلانٍ لفعلتُ فيه مثلَ الذي فعل»؛"], [472.0, "أي: لفعلتُ فيه من المعصية كما فعل،"], [474.0, "«فهما في الوِزر سواء»."], [477.0, "فهذا الرجل استخدم «لو» متطلِّعًا بها إلى المعصية."]], "tr": [[457.0, "«Bir de Allah'ın kendisine ne ilim ne de mal verdiği bir adam vardır; o da \"Keşke benim de falancanın malı gibi bir malım olsaydı, onda onun yaptığının aynısını yapardım\" der.» Yani onda onun yaptığı gibi günah işlerdim."], [474.0, "«Bu ikisi günahta eşittir.» Bu adam \"lev\"i günaha göz dikerek kullanmıştır."]]}, {"reader": false, "ar": [[483.0, "وعلى ذلك قولُ الناظم:"], [485.0, "«إيّاك «لو» إن كان فيه تسخّطٌ ... أو كان فيه تطلّعُ العصيانِ»،"], [492.0, "أو كان فيه تطلّعُ العصيان."]], "tr": [[483.0, "Nâzımın şu sözü de buna göredir:"], [485.0, "\"'Lev'den sakın, eğer onda tesahhut varsa / ya da onda isyana göz dikmek varsa.\" Ya da onda isyana göz dikmek varsa."]]}]}, {"ts": "08:16", "title": "2. Külliye (devam): «Lev»in meşru ve mubah kullanımları", "paras": [{"reader": false, "ar": [[496.0, "وأمّا الاستعمال الثالث ـ وأعني به الاستعمالَ المشروع ـ فهو أن يستعملها متحسِّرًا على فوات الخير؛"], [506.0, "فكلُّ مَن استعمل «لو» متحسِّرًا على فوات الخير فإنّ استعماله مشروعٌ يؤجر عليه."], [513.0, "والمتقرِّر في القواعد أنّ العبد يبلغ بحسن نيّته وصلاحها ما لا يستطيعه بعمله،"], [520.6, "أو لا يبلغه بعمله."]], "tr": [[496.0, "Üçüncü kullanım —bununla meşru kullanımı kastediyorum— onu hayrın kaçmasına hasret duyarak kullanmasıdır."], [496.0, "\"Lev\"i hayrın kaçmasına hasret duyarak kullanan herkesin kullanımı meşrudur ve bundan dolayı ecir alır."], [506.0, "Kaidelerde sabit olan şudur: Kul, niyetinin güzelliği ve sâlih oluşuyla, ameliyle güç yetiremediği ya da ameliyle ulaşamadığı şeye ulaşır."]]}, {"reader": false, "ar": [[523.0, "وعلى ذلك قولُ النبيّ صلى الله عليه وسلم:"], [527.6, "«لو استقبلتُ من أمري ما استدبرتُ لما سُقتُ الهديَ، ولجعلتُها عمرةً» <span class=\"note\">(Buhârî, Müslim)<\/span>؛"], [534.0, "محبّةً للنبيّ صلى الله عليه وسلم،"], [538.0, "أي: أن يعتمر متمتِّعًا بالتمتّع الخاص، وتطييبًا لقلوب أصحابه."]], "tr": [[523.0, "Nebî ﷺ'in şu sözü de buna göredir:"], [523.0, "«İşimde sonradan gördüğümü önceden görmüş olsaydım kurbanlığı (yanımda) sürüp getirmezdim ve onu umre yapardım.» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [527.6, "(Bu), Nebî ﷺ'in arzusu olarak —yani özel temettu' ile temettu' yaparak umre yapmayı (arzu etmesi)— ve ashâbının gönüllerini hoş etmek içindir."]]}, {"reader": false, "ar": [[544.0, "وأمّا الاستعمال الرابع ـ وأعني به الاستعمالَ المباح ـ فهي استعمالُها في ضرب المثال العلمي من باب التقريب،"], [553.0, "كقول الفقيه: ما رأيكم لو حصل كذا وكذا؟"], [558.0, "فهذا لا بأس به ولا حرج فيه؛"], [563.0, "لأنه عارٍ عمّا يوجب..."], [565.8, "أو لأنه خالٍ عمّا يوجب منعه."]], "tr": [[544.0, "Dördüncü kullanım —bununla mubah kullanımı kastediyorum— onu yaklaştırma (anlaşılır kılma) kabilinden ilmî misal vermede kullanmaktır."], [544.0, "Fakihin \"Şöyle şöyle olsaydı ne dersiniz?\" demesi gibi."], [553.0, "Bunda bir beis ve sakınca yoktur;"], [558.0, "çünkü o, (yasaklanmasını) gerektiren şeyden uzaktır..."], [563.0, "ya da yasaklanmasını gerektiren şeyden hâlîdir."]]}, {"reader": false, "ar": [[570.0, "فإذا استعملها الإنسانُ متسخِّطًا على القضاء والقدر فحرام،"], [575.0, "وإذا استعملها الإنسانُ متطلِّعًا بها فعلَ المعصية فحرام،"], [581.0, "وإذا قالها الإنسانُ متحسِّرًا على فوات الخير فلا بأس به،"], [590.0, "وأمّا إذا استعملها في بيان المثال العلمي التقريبي فإنه لا بأس به ولا حرج؛"], [597.0, "لأنه أمرٌ مباح. الكلّيّة التي بعدها،"], [601.1, "وهي كلّيّةٌ تحتاج منّا إلى وقوفٍ طويل:"]], "tr": [[570.0, "İnsan onu kaza ve kadere öfkelenerek kullanırsa haramdır."], [570.0, "Onu günah işlemeye göz dikerek kullanırsa haramdır."], [575.0, "Hayrın kaçmasına hasret duyarak söylerse bunda beis yoktur."], [581.0, "Onu yaklaştırıcı ilmî misali açıklamada kullanırsa bunda da beis ve sakınca yoktur;"], [590.0, "çünkü mubah bir iştir. Sonraki külliye, üzerinde uzun uzun durmamız gereken bir külliyedir:"]]}]}, {"ts": "10:06", "title": "3. Külliye: Varlığına ve yokluğuna teklifin bağlandığı her istitaat şer'îdir", "paras": [{"reader": false, "ar": [[606.0, "<b>كلُّ استطاعةٍ يتعلّق بوجودها وعدمها التكليفُ فشرعيّة.<\/b> كلُّ استطاعةٍ يتعلّق بوجودها وعدمها التكليفُ فشرعيّة."], [621.0, "كلُّ استطاعةٍ يتعلّق بوجودها وعدمها التكليفُ فشرعيّة."]], "tr": [[606.0, "<b>3. külliye: Varlığına ve yokluğuna teklifin (dinî yükümlülüğün) bağlandığı her istitaat (güç yetirme) şer'îdir.<\/b> (İki kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[635.0, "أقول وبالله التوفيق: وأهلُ السنة والجماعة يسمّون هذه الاستطاعةَ بالاستطاعة قبل الفعل،"], [644.0, "وبعضهم يسمّيها: سلامةَ الآلات وتوفّرَ الأسباب؛"], [653.0, "فسواءٌ سمّيناها بهذا أو بهذا فإننا نعني بها الاستطاعةَ الشرعية."], [660.0, "ومن شأن هذه الاستطاعة أنها تكون قبل التعبّد؛"], [664.0, "فإذا وُجدت وجب التعبّد،"], [668.0, "وإذا انعدمت عُذر العبدُ في ترك التعبّد."]], "tr": [[635.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat bu istitaati \"fiilden önceki istitaat\" diye adlandırır;"], [635.0, "bazıları da onu \"âletlerin sağlamlığı ve sebeplerin mevcudiyeti\" diye adlandırır."], [653.0, "Onu bununla da adlandırsak şununla da adlandırsak, bununla şer'î istitaati kastediyoruz."], [660.0, "Bu istitaatin özelliği, ibadetten önce bulunmasıdır:"], [664.0, "Bulunduğunda ibadet vâcip olur, yok olduğunda kul ibadeti terk etmekte mazur olur."]]}, {"reader": false, "ar": [[673.0, "فتلك استطاعةٌ يتعلّق بها التكليفُ وجودًا بوجودها وعدمًا بعدمها."], [680.0, "فمتى ما رأيتَ لفظَ الاستطاعة أو ما تصرّف منها مذكورًا في القرآن والسنة مقرونًا بالتكليف وجودًا وعدمًا،"], [691.0, "فاعلم أنه الآن يتكلّم عن الاستطاعة الشرعية،"], [694.0, "وهي التي نعنيها بقولنا:"], [698.0, "«التكاليف الشرعية منوطةٌ بالقدرة على العلم والعمل»، والقدرةُ هي الاستطاعة."]], "tr": [[673.0, "Bu, teklifin varlığıyla var, yokluğuyla yok olmak üzere kendisine bağlandığı bir istitaattir."], [680.0, "Kur'an ve Sünnet'te istitaat lafzının ya da ondan türeyen kelimelerin, varlık ve yokluk bakımından teklifle birlikte zikredildiğini ne zaman görürsen, bil ki o anda şer'î istitaatten bahsediliyor."], [694.0, "\"Şer'î teklifler ilme ve amele güç yetirmeye bağlıdır\" sözümüzle kastettiğimiz de budur; kudret, istitaatin ta kendisidir."]]}, {"reader": false, "ar": [[707.0, "وهي المرادة بقول الله عز وجل:"], [712.0, "<span class=\"ayah\">﴿وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا﴾<\/span> <span class=\"ref\">[آل عمران: ٩٧]<\/span>،"], [718.0, "أي: من استطاع شرعًا إليه سبيلًا."], [720.0, "ولذلك فسّرها النبيُّ صلى الله عليه وسلم في أحاديث متعدّدة تبلغ إلى رتبة الحسن بأنّ الاستطاعة:"], [730.2, "الزادُ والراحلة. وأنت تعرف أنّ وجود الزاد والراحلة لا بدّ أن يكون موجودًا قبل السعي إلى الحج؛"], [741.0, "فإذًا هي استطاعةٌ قبل الفعل."]], "tr": [[707.0, "Allah Azze ve Celle'nin şu sözüyle kastedilen de odur:"], [712.0, "<span class=\"ayah\">﴿Yoluna gücü yetenlerin Beyt'i haccetmesi, Allah'ın insanlar üzerindeki hakkıdır﴾<\/span> [Âl-i İmrân 97];"], [718.0, "yani yoluna şer'an gücü yeten."], [720.0, "Bu yüzden Nebî ﷺ, hasen derecesine ulaşan birçok hadiste istitaati \"azık ve binek\" diye tefsir etmiştir."], [730.2, "Bilirsin ki azık ve binek, hacca gitmeden önce mevcut olmalıdır."], [730.2, "O hâlde bu, fiilden önceki bir istitaattir."]]}, {"reader": false, "ar": [[744.0, "فلو أنّ الإنسان عدم تلك الاستطاعةَ التي تسبق الفعل لما وجب عليه التعبّدُ بعدها."], [752.0, "وهي التي نعنيها أيضًا بقولنا:"], [755.6, "«لا واجبَ مع العجز»،"], [760.0, "والذي نعني به فقدَ هذه الاستطاعة."], [765.0, "وهي المعنيّة بقول الله عز وجل:"], [768.6, "<span class=\"ayah\">﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ﴾<\/span> <span class=\"ref\">[التغابن: ١٦]<\/span>، أي: استطعتم شرعًا."]], "tr": [[744.0, "İnsan fiilden önce gelen o istitaati kaybetmiş olsaydı, ondan sonra ibadet ona vâcip olmazdı."], [744.0, "\"Acizlikle birlikte vâcip yoktur\" sözümüzle kastettiğimiz de budur;"], [755.6, "bununla bu istitaatin kaybını kastediyoruz."], [760.0, "Allah Azze ve Celle'nin şu sözüyle kastedilen de odur:"], [768.6, "<span class=\"ayah\">﴿Gücünüz yettiğince Allah'tan sakının﴾<\/span> [Teğâbun 16]; yani şer'an gücünüz yettiğince."]]}, {"reader": false, "ar": [[774.0, "وقولُ الله عز وجل:"], [776.8, "<span class=\"ayah\">﴿إِلَّا الْمُسْتَضْعَفِينَ مِنَ الرِّجَالِ وَالنِّسَاءِ وَالْوِلْدَانِ لَا يَسْتَطِيعُونَ حِيلَةً وَلَا يَهْتَدُونَ سَبِيلًا﴾<\/span> <span class=\"ref\">[النساء: ٩٨]<\/span>،"], [786.0, "أي: لا يستطيعون الهجرة؛"], [787.0, "فإنّ عدم قدرتهم على الهجرة كانت سابقةً لأمرهم بها،"], [792.0, "فلمّا أُمروا بها وافق الأمرُ بها عجزًا عنها؛"], [797.0, "فهي استطاعةٌ قبل الفعل."]], "tr": [[774.0, "Allah Azze ve Celle'nin şu sözü de:"], [776.8, "<span class=\"ayah\">﴿Ancak erkeklerden, kadınlardan ve çocuklardan, hiçbir çareye gücü yetmeyen ve hiçbir yol bulamayan zayıf bırakılmışlar müstesnadır﴾<\/span> [Nisâ 98];"], [776.8, "yani hicrete güç yetiremeyenler. Onların hicrete güç yetirememeleri, hicretle emrolunmalarından önceydi;"], [787.0, "onunla emrolunduklarında emir, ondan acizlikle karşılaştı."], [792.0, "O hâlde bu, fiilden önceki bir istitaattir."]]}]}, {"ts": "13:20", "title": "3. Külliye (devam): Şer'î istitaatin delilleri", "paras": [{"reader": false, "ar": [[800.0, "أرجوكم انتبهوا لهذا؛ لأنّ اللي بعدها مبنيٌّ على فهمها."], [805.0, "فكلُّ استطاعةٍ تكون قبل الفعل فالعلماء يسمّونها الاستطاعةَ الشرعية،"], [815.0, "أو بعضهم يسمّيها: سلامةَ الآلات وكمالَ القدرة على العمل؛"], [820.1, "فسمِّها بهذا أو بهذا فلا بأس."]], "tr": [[800.0, "Sizden rica ediyorum, buna dikkat edin;"], [800.0, "çünkü sonrası bunun anlaşılmasına dayanıyor."], [805.0, "Fiilden önce olan her istitaati âlimler \"şer'î istitaat\" diye adlandırır;"], [805.0, "bazıları da onu \"âletlerin sağlamlığı ve amele güç yetirmenin tamlığı\" diye adlandırır."], [815.0, "Onu bununla da adlandırsan şununla da adlandırsan beis yoktur."]]}, {"reader": false, "ar": [[824.0, "ومنها أيضًا في الأدلة قولُه..."], [826.0, "قولُ الله عز وجل:"], [828.7, "<span class=\"ayah\">﴿فَمَن لَّمْ يَجِدْ فَصِيَامُ شَهْرَيْنِ مُتَتَابِعَيْنِ ... فَمَن لَّمْ يَسْتَطِعْ فَإِطْعَامُ سِتِّينَ مِسْكِينًا﴾<\/span> <span class=\"ref\">[المجادلة: ٤]<\/span>،"], [838.0, "أي: فقد الآلاتِ التي يستطيع بها أن يصوم الشهرين المتتابعين،"], [843.0, "عنده عجزٌ في هذا الصيام."]], "tr": [[824.0, "Delillerde bundan biri de şu sözüdür..."], [826.0, "Allah Azze ve Celle'nin şu sözü:"], [828.7, "<span class=\"ayah\">﴿Kim (köle) bulamazsa, ardı ardına iki ay oruç tutması gerekir ... Kim buna da güç yetiremezse altmış yoksulu doyurması gerekir﴾<\/span> [Mücâdele 4];"], [828.7, "yani ardı ardına iki ay oruç tutmaya güç yetireceği âletleri kaybetmiş, bu orucu tutmakta acizliği olan kişi."]]}, {"reader": false, "ar": [[847.0, "وهي المرادة أيضًا بقول النبيّ صلى الله عليه وسلم:"], [852.1, "«عليكم من الأعمال بما تطيقون» ـ أي:"], [855.5, "تطيقون شرعًا ـ «فوالله لا يملّ اللهُ حتى تملّوا» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [860.0, "ومنه أيضًا قولُ النبيّ صلى الله عليه وسلم:"], [865.2, "«ما نهيتكم عنه فاجتنبوه، وما أمرتكم به فأتوا منه ما استطعتم» <span class=\"note\">(Buhârî, Müslim)<\/span>؛"], [873.0, "بمعنى أنّ المأمورات الشرعية منوطةٌ بالاستطاعة."]], "tr": [[847.0, "Nebî ﷺ'in şu sözüyle kastedilen de odur:"], [847.0, "«Amellerden gücünüzün yettiğini yapın» —yani şer'an gücünüzün yettiğini— «Allah'a yemin olsun ki siz usanmadıkça Allah usanmaz.» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [860.0, "Nebî ﷺ'in şu sözü de bu türdendir:"], [860.0, "«Size neyi yasakladıysam ondan kaçının; size neyi emrettiysem ondan gücünüz yettiğince yapın.» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [873.0, "Yani şer'î emirler istitaate bağlıdır."]]}, {"reader": false, "ar": [[878.0, "فإن وُجدت الاستطاعةُ وُجد التكليف،"], [881.6, "وإن انعدمت الاستطاعةُ انعدم التكليف؛"], [885.5, "فتلك استطاعةٌ يتعلّق بها التكليفُ وجودًا وعدمًا،"], [889.0, "فنسمّيها استطاعةً شرعيةً لتعلّقها بالتشريع وجودًا وعدمًا. أظنّ تصوّرتموها؟"]], "tr": [[878.0, "İstitaat bulunursa teklif bulunur; istitaat yok olursa teklif yok olur."], [881.6, "Bu, teklifin varlık ve yokluk bakımından kendisine bağlandığı bir istitaattir."], [885.5, "Varlık ve yokluk bakımından teşrie (şer'î hükme) bağlı olduğu için ona \"şer'î istitaat\" deriz. Sanırım onu kavradınız?"]]}, {"reader": false, "ar": [[896.0, "وأيضًا هي المرادة بقول النبيّ صلى الله عليه وسلم لعمران بن حصين رضي الله عنهما:"], [905.1, "«صلِّ قائمًا، فإن لم تستطع فقاعدًا» <span class=\"note\">(Buhârî)<\/span>."], [912.0, "ليس «فإن لم تستطع» مع القعود ـ لا ـ وإنما العجزُ موجودٌ فيك قبل الصلاة أصلًا؛"], [923.0, "أنت فقدتَ الاستطاعةَ التي تسبق الفعل."]], "tr": [[896.0, "Nebî ﷺ'in İmrân b. Husayn'a —Allah ikisinden de razı olsun— söylediği şu sözle kastedilen de odur:"], [896.0, "«Ayakta kıl; gücün yetmezse oturarak (kıl).» <span class=\"note\">(Buhârî)<\/span>."], [905.1, "\"Gücün yetmezse\" sözü, oturmayla birlikte (ortaya çıkan acizlik) değildir —hayır—;"], [912.0, "acizlik zaten namazdan önce sende mevcuttur."], [923.0, "Sen fiilden önce gelen istitaati kaybetmişsin."]]}, {"reader": false, "ar": [[927.0, "وهذا من رحمة الله عز وجل:"], [931.0, "أن جعل الأفعالَ البَعْديّةَ مقرونًا تشريعُها بالاستطاعة القَبْليّة؛"], [939.0, "لأنّ الله عز وجل يقول:"], [941.3, "<span class=\"ayah\">﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا مَا آتَاهَا﴾<\/span> <span class=\"ref\">[الطلاق: ٧]<\/span>،"], [944.6, "أي: من الاستطاعة. ويقول الله عز وجل:"], [948.4, "<span class=\"ayah\">﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾<\/span> <span class=\"ref\">[البقرة: ٢٨٦]<\/span>،"], [952.0, "أي: وسعها من هذه الاستطاعة."]], "tr": [[927.0, "Bu, Allah Azze ve Celle'nin rahmetindendir:"], [931.0, "Sonra gelen fiillerin teşriini önce gelen istitaate bağlamıştır."], [931.0, "Çünkü Allah Azze ve Celle şöyle buyurur:"], [939.0, "<span class=\"ayah\">﴿Allah hiç kimseye kendisine verdiğinden fazlasını yüklemez﴾<\/span> [Talâk 7];"], [941.3, "yani istitaatten (verdiğinden). Allah Azze ve Celle şöyle de buyurur:"], [944.6, "<span class=\"ayah\">﴿Allah hiç kimseye gücünün yeteceğinden fazlasını yüklemez﴾<\/span> [Bakara 286];"], [948.4, "yani bu istitaatten onun gücünün yettiğinden (fazlasını)."]]}, {"reader": false, "ar": [[955.0, "وهي المرادة أيضًا بقول ربّنا عز وجل:"], [959.9, "<span class=\"ayah\">﴿وَعَلَى الَّذِينَ يُطِيقُونَهُ﴾<\/span>، أي:"], [964.9, "يستطيعونه، أو «يُطَوَّقونه»، يعني بمعنى أنهم لا يستطيعونه،"], [972.0, "<span class=\"ayah\">﴿فِدْيَةٌ طَعَامُ مِسْكِينٍ﴾<\/span> <span class=\"ref\">[البقرة: ١٨٤]<\/span>. قال ابن عباس:"], [976.0, "وهي نزلت في الشيخ..."], [978.7, "في الرجل الكبير أو المرأة الكبيرة لا يستطيعان الصيام،"], [987.0, "فيُطعمان عن كل يومٍ مسكينًا."]], "tr": [[955.0, "Rabbimiz Azze ve Celle'nin şu sözüyle kastedilen de odur:"], [959.9, "<span class=\"ayah\">﴿Oruca güç yetirebilenlere﴾<\/span> —yani ona gücü yetenlere;"], [964.9, "ya da \"yutavvekûnehû\" (kıraatiyle), yani ona güç yetiremeyenlere— <span class=\"ayah\">﴿bir yoksul doyumu fidye (gerekir)﴾<\/span> [Bakara 184]."], [972.0, "İbn Abbâs şöyle dedi: Bu, yaşlı hakkında..."], [976.0, "oruç tutmaya gücü yetmeyen yaşlı erkek veya yaşlı kadın hakkında indi;"], [978.7, "onlar her gün için bir yoksulu doyururlar."]]}, {"reader": false, "ar": [[991.0, "وهي المرادة بقول شعيب عليه الصلاة والسلام:"], [999.0, "<span class=\"ayah\">﴿إِنْ أُرِيدُ إِلَّا الْإِصْلَاحَ مَا اسْتَطَعْتُ﴾<\/span> <span class=\"ref\">[هود: ٨٨]<\/span>،"], [1002.0, "أي: لا يكلّفني اللهُ عز وجل من الإصلاح إلا ما كان داخلًا تحت وسعي وطاقتي."]], "tr": [[991.0, "Şuayb'ın —ona salât ve selâm olsun— şu sözüyle kastedilen de odur:"], [999.0, "<span class=\"ayah\">﴿Ben gücüm yettiğince ıslahtan başka bir şey istemiyorum﴾<\/span> [Hûd 88];"], [1002.0, "yani Allah Azze ve Celle bana ıslahtan ancak gücümün ve takatimin altına giren şeyi yükler."]]}, {"reader": false, "ar": [[1010.0, "وهي التي تتفرّع عليها قواعدُ التيسير الكثيرة،"], [1015.0, "كقولنا: «المشقّةُ تجلب التيسير»،"], [1019.0, "أي: المشقّة السابقة قبل الفعل تجلب التيسيرَ اللاحق."], [1022.0, "وقولِنا: «إذا ضاق الأمرُ» ـ أي:"], [1025.5, "قبل الفعل ـ «اتّسع» ـ أي:"], [1028.3, "بعده. وقولِنا: «الحرجُ» ـ أي:"], [1031.1, "الحرج السابق ـ «مرفوعٌ عن الأمة» باعتبار التطبيق اللاحق."]], "tr": [[1010.0, "Birçok kolaylık kaidesi de bundan dallanır."], [1010.0, "\"Meşakkat kolaylığı celbeder\" sözümüz gibi;"], [1015.0, "yani fiilden önceki meşakkat, sonraki kolaylığı celbeder."], [1019.0, "\"Bir iş daraldığında\" —yani fiilden önce— \"genişler\" —yani ondan sonra— sözümüz."], [1025.5, "\"Harec (zorluk)\" —yani önceki zorluk— \"ümmetten kaldırılmıştır\" sözümüz de sonraki uygulama itibarıyladır."]]}, {"reader": false, "ar": [[1037.0, "فكلُّ استطاعةٍ تسبق الفعلَ فإنها تُسمّى بالاستطاعة الشرعية،"], [1045.0, "وعلامتُها أنّ التكليف يتعلّق بها وجودًا وعدمًا؛"], [1051.0, "فبوجودها يثبت التكليف، وبانعدامها ينعدم التكليف."], [1058.0, "ولذلك مَن كان عاجزًا عجزًا حقيقيًّا عن أيّ شيءٍ من التشريع ـ أمرًا أو نهيًا ـ فإنه معذورٌ عند الله عز وجل."]], "tr": [[1037.0, "Fiilden önce gelen her istitaate \"şer'î istitaat\" denir."], [1037.0, "Alameti, teklifin varlık ve yokluk bakımından ona bağlı olmasıdır:"], [1045.0, "Onun varlığıyla teklif sabit olur, yokluğuyla teklif yok olur."], [1051.0, "Bu yüzden şeriattan —emir olsun yasak olsun— herhangi bir şeyden gerçek bir acizlikle aciz olan kimse, Allah Azze ve Celle katında mazurdur."]]}, {"reader": false, "ar": [[1072.0, "فمن لم يستطع الصلاةَ قائمًا فليصلِّ قاعدًا،"], [1077.0, "ومن لم يستطع الطهارةَ المائية فليتطهّر بالطهارة الترابية،"], [1081.0, "ومن لم يستطع الصومَ فليُطعم عن كل يومٍ مسكينًا،"], [1086.0, "ومن عجز عن الحجّ ببدنه وجب عليه بماله،"], [1092.0, "وإن عجز عنهما سقط عنه وجوبُه،"], [1095.0, "ومن عجزت عن اصطحاب المَحْرَم سقط عنها وجوبُ الحج."], [1100.0, "وهي الاستطاعة التي يتكلّم عنها الفقهاء في الأعمّ الأغلب."], [1105.0, "ولعلّكم تصوّرتم هذه الاستطاعة."]], "tr": [[1072.0, "Namazı ayakta kılmaya gücü yetmeyen oturarak kılsın."], [1072.0, "Su ile taharete gücü yetmeyen toprakla taharet alsın (teyemmüm etsin)."], [1077.0, "Oruca gücü yetmeyen her gün için bir yoksulu doyursun."], [1081.0, "Bedeniyle hacca gitmekten aciz olana malıyla (hac) vâcip olur;"], [1092.0, "ikisinden de aciz olursa vücûbu ondan düşer."], [1095.0, "Yanında mahrem bulundurmaktan aciz olan kadından haccın vücûbu düşer."], [1100.0, "Fakihlerin çoğunlukla bahsettiği istitaat budur. Umarım bu istitaati kavramışsınızdır."]]}]}, {"ts": "18:30", "title": "4. Külliye: Kâfirlerden nefyedilen her istitaat kevnîdir", "paras": [{"reader": false, "ar": [[1110.0, "ويوضّح ذلك الكلّيّةُ الرابعة،"], [1115.0, "الرابعة: <b>كلُّ استطاعةٍ منفيّةٍ عن الكفّار فكونيّة.<\/b> كلُّ استطاعةٍ منفيّةٍ عن الكفّار فـ... إيش؟ فكونيّة."]], "tr": [[1110.0, "Bunu dördüncü külliye açıklar. Dördüncü:"], [1115.0, "<b>4. külliye: Kâfirlerden nefyedilen her istitaat kevnîdir.<\/b> Kâfirlerden nefyedilen her istitaat... nedir? Kevnîdir."]]}, {"reader": false, "ar": [[1127.0, "وعلامةُ هذه الاستطاعة المنفيّة عن الكفّار في النصوص:"], [1147.0, "أنها استطاعةٌ تُقارن الفعل،"], [1149.3, "أي: تكون معه؛ بمعنى أنه حالَ الفعل آلاتُه سليمة،"], [1155.3, "وجسدُه سليم، وليس ثمّة ما يمنع من قبول الحقّ ولا الإذعان له ولا استماعه،"], [1168.0, "ولكنه يُعرض عن الحق؛"], [1170.0, "فاللهُ عز وجل سمّى إعراضَه عن الحق بأنه غيرُ مستطيع."]], "tr": [[1127.0, "Naslarda kâfirlerden nefyedilen bu istitaatin alameti, fiile eşlik eden, yani onunla birlikte olan bir istitaat olmasıdır."], [1149.3, "Yani fiil anında âletleri sağlamdır, bedeni sağlamdır;"], [1155.3, "hakkı kabul etmeye, ona boyun eğmeye ve onu dinlemeye engel olan bir şey yoktur;"], [1155.3, "fakat o, haktan yüz çevirir."], [1168.0, "Allah Azze ve Celle onun haktan yüz çevirmesini \"güç yetirememek\" diye adlandırmıştır."]]}, {"reader": false, "ar": [[1176.0, "لا يقصد به الاستطاعةَ الشرعية؛"], [1180.0, "إذ لو كان عدمُ الاستطاعة المنفيّة عن الكفّار هي الاستطاعةَ الشرعية لكان كفرُهم عذرًا لهم،"], [1191.0, "لكنها الاستطاعةُ المقارِنة للفعل،"], [1193.7, "والتي تكون معه، والتي يخلقها الله عز وجل عند وجود أسبابها."]], "tr": [[1176.0, "Bununla şer'î istitaati kastetmez. Çünkü kâfirlerden nefyedilen istitaatin yokluğu şer'î istitaat olsaydı, küfürleri onlar için bir mazeret olurdu."], [1180.0, "Fakat o, fiile eşlik eden, onunla birlikte olan ve Allah Azze ve Celle'nin sebepleri bulunduğunda yarattığı istitaattir."]]}, {"reader": false, "ar": [[1201.0, "ولذلك كان القرآنُ يُتلى عليهم وآلاتُهم سليمة والأسبابُ متوفّرة،"], [1209.0, "ولكن لم يكونوا يستطيعون سماعَ القرآن ولا إبصارَ الحق ولا قبولَ الحق."], [1216.0, "لماذا؟ لأنّ ثمّة استطاعةً قد سُحبت منهم لم يُوفَّقوا لها،"], [1221.4, "وهي الاستطاعة الكونية. وقد أجمع أهلُ السنة والجماعة على أنّ انتفاء الاستطاعة الكونية ليس بعذرٍ يرفع التكليف."]], "tr": [[1201.0, "Bu yüzden Kur'an onlara okunuyordu;"], [1201.0, "âletleri sağlamdı, sebepler mevcuttu. Fakat Kur'an'ı dinlemeye, hakkı görmeye ve hakkı kabul etmeye güç yetiremiyorlardı."], [1209.0, "Neden? Çünkü onlardan çekilip alınmış, muvaffak kılınmadıkları bir istitaat vardı;"], [1221.4, "o da kevnî istitaattir. Ehl-i Sünnet ve'l-Cemaat, kevnî istitaatin yokluğunun teklifi kaldıran bir mazeret olmadığında icmâ etmiştir."]]}, {"reader": false, "ar": [[1232.0, "فالفرقانُ بين الاستطاعتين: هو مقارنتُها للفعل أو سبقُها عليه؛"], [1241.0, "فكلُّ استطاعةٍ تسبق الفعلَ فشرعيّةٌ وعدمُها عذر،"], [1247.0, "وكلُّ استطاعةٍ تقارن الفعلَ فكونيّةٌ وعدمُها ليس بعذر."]], "tr": [[1232.0, "İki istitaat arasındaki ayırıcı fark, onun fiile eşlik etmesi veya fiilden önce gelmesidir."], [1241.0, "Fiilden önce gelen her istitaat şer'îdir ve yokluğu mazerettir;"], [1247.0, "fiile eşlik eden her istitaat kevnîdir ve yokluğu mazeret değildir."]]}, {"reader": false, "ar": [[1255.0, "ولذلك قال الله عز وجل في شأن هذه الاستطاعة:"], [1261.0, "«ما كانوا يستطيعون» ـ أي:"], [1263.9, "كونًا لا شرعًا ـ <span class=\"ayah\">﴿مَا كَانُوا يَسْتَطِيعُونَ السَّمْعَ وَمَا كَانُوا يُبْصِرُونَ﴾<\/span> <span class=\"ref\">[هود: ٢٠]<\/span>؛"], [1273.0, "أي: أنه تُتلى عليهم آياتُ الله ليلًا ونهارًا ولا يستمعون لها استماعَ قبولٍ لانتفاء الاستطاعة الكونية عنهم."]], "tr": [[1255.0, "Bu yüzden Allah Azze ve Celle bu istitaat hakkında \"güç yetiremiyorlardı\" buyurdu —yani kevnen, şer'an değil—:"], [1263.9, "<span class=\"ayah\">﴿Onlar (hakkı) işitmeye güç yetiremiyorlardı ve görmüyorlardı﴾<\/span> [Hûd 20]."], [1263.9, "Yani Allah'ın ayetleri onlara gece gündüz okunuyor, fakat kevnî istitaat onlardan nefyedildiği için onları kabul dinlemesiyle dinlemiyorlardı."]]}, {"reader": false, "ar": [[1284.0, "ولا يمكن أبدًا أن يستطيع العبدُ ـ كونًا وحقيقةً وقدرةً ـ في أرض الله إلا ما كان مرادًا أن يستطيعه في تقدير الله عز وجل."], [1298.0, "فأمّا ما ليس مكتوبًا له فإنه وإن بذل كلَّ شيءٍ فإنه لا يستطيع،"], [1305.0, "لكن لا يستطيع كونًا لا شرعًا."]], "tr": [[1284.0, "Kulun Allah'ın arzında —kevnen, hakikaten ve kudret olarak— ancak Allah Azze ve Celle'nin takdirinde güç yetirmesi murad edilmiş olan şeye güç yetirmesi mümkündür, başkasına asla."], [1298.0, "Kendisi için yazılmamış olana gelince, her şeyi harcasa da güç yetiremez;"], [1298.0, "fakat kevnen güç yetiremez, şer'an değil."]]}]}, {"ts": "21:49", "title": "4. Külliye (devam): Ebû Leheb ve Ebû Cehil müslüman olmaya güç yetirebilir miydi?", "paras": [{"reader": false, "ar": [[1309.0, "ولذلك سألنا سائلٌ: هل كان أبو لهبٍ وأبو جهلٍ يستطيعان الإسلام؟"], [1317.0, "فإن قلتَ: كانا يستطيعان ـ فقط ـ أخطأت،"], [1324.0, "وإن قلتَ: لا يستطيعان الإسلام ـ فقط ـ أخطأت،"], [1330.0, "وإنما قل: كانوا يستطيعون الإسلامَ شرعًا،"], [1334.0, "ولا يستطيعونه كونًا. وعدمُ الاستطاعة الكونية ليس بعذرٍ إجماعًا،"], [1344.0, "ومن جعلها عذرًا فهو ممّن يحتجّ بالقدر على فعل المعصية."]], "tr": [[1309.0, "Bu yüzden bir soran bize sordu:"], [1309.0, "Ebû Leheb ve Ebû Cehil müslüman olmaya güç yetirebilir miydi?"], [1317.0, "\"Güç yetirebilirlerdi\" dersen —sadece bunu dersen— hata edersin."], [1324.0, "\"Müslüman olmaya güç yetiremezlerdi\" dersen —sadece bunu dersen— yine hata edersin."], [1330.0, "Bilakis şöyle de: Müslüman olmaya şer'an güç yetirebilirlerdi, kevnen güç yetiremezlerdi."], [1334.0, "Kevnî istitaatin yokluğu icmâ ile mazeret değildir;"], [1344.0, "onu mazeret sayan, günah işlemeye kaderi delil getirenlerdendir."]]}, {"reader": false, "ar": [[1353.0, "فحقيقةُ الاحتجاج بالقضاء والقدر على فعل المعصية،"], [1357.7, "حقيقتُه أنهم جعلوا الاستطاعةَ الكونية عذرًا؛"], [1364.0, "فكلُّ ما لم نستطعه كونًا فنحن معذورون فيه!"], [1369.5, "وهذا هو أبطلُ الباطل؛"], [1374.0, "لأنّ الله قد قامت حجّتُه على عباده بإرسال الرسل،"], [1380.0, "وإنزال الكتب، وبيانِ... والبيانِ للناس."]], "tr": [[1353.0, "Günah işlemeye kaza ve kaderi delil getirmenin hakikati, onların kevnî istitaati mazeret saymalarıdır:"], [1357.7, "\"Kevnen güç yetiremediğimiz her şeyde mazuruz!\" Bu, bâtılın en bâtılıdır."], [1369.5, "Çünkü Allah'ın kulları üzerindeki hücceti, resuller göndermesiyle, kitaplar indirmesiyle ve insanlara açıklamasıyla ayakta durmuştur."]]}, {"reader": false, "ar": [[1386.0, "وخلق لنا الآلاتِ التي بها نفقه الحقَّ ونُبصره ونتعرّف عليه ونتعقّله ونتدبّره ونتفكّر فيه،"], [1396.0, "ولكن لعدم استطاعة الكافر كونًا أن يستغلّ ذلك فيما يقرّبه إلى الله تعطّل هذا كلُّه،"], [1403.5, "كما قال الله عز وجل:"], [1406.0, "<span class=\"ayah\">﴿وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيرًا مِّنَ الْجِنِّ وَالْإِنسِ ۖ لَهُمْ قُلُوبٌ لَّا يَفْقَهُونَ بِهَا﴾<\/span> <span class=\"ref\">[الأعراف: ١٧٩]<\/span>؛"], [1413.0, "فعدمُ فقههم للحق هو سلبٌ للاستطاعات الكونية،"], [1418.0, "وليس ذلك بعذرٍ لهم."]], "tr": [[1386.0, "Bize hakkı onlarla kavradığımız, gördüğümüz, tanıdığımız, akledip anladığımız, üzerinde düşündüğümüz ve tefekkür ettiğimiz âletleri yarattı."], [1396.0, "Fakat kâfir bunu kendisini Allah'a yaklaştıracak şeyde kullanmaya kevnen güç yetiremediği için bütün bunlar işlevsiz kaldı."], [1403.5, "Allah Azze ve Celle'nin buyurduğu gibi:"], [1406.0, "<span class=\"ayah\">﴿Andolsun, cinlerden ve insanlardan birçoğunu cehennem için yarattık. Onların kalpleri vardır, onlarla kavramazlar﴾<\/span> [A'râf 179]."], [1406.0, "Hakkı kavramamaları, kevnî istitaatlerin elden alınmasıdır;"], [1413.0, "bu da onlar için mazeret değildir."]]}, {"reader": false, "ar": [[1420.0, "<span class=\"ayah\">﴿وَلَهُمْ أَعْيُنٌ لَّا يُبْصِرُونَ بِهَا﴾<\/span>؛"], [1423.0, "فالآلةُ سليمةٌ قادرةٌ على إبصار الحق،"], [1426.0, "ولكن تأبى أن تُبصره عنادًا وعلوًّا وإباءً واستكبارًا."], [1434.0, "<span class=\"ayah\">﴿وَلَهُمْ آذَانٌ﴾<\/span>؛ أي: أنّ الآلاتِ سليمةٌ والاستطاعةَ الشرعيةَ متوفّرة،"], [1439.0, "وقد وافق سماعُهم للحق آلاتٍ سليمةً وعقلًا موجودًا؛"], [1446.0, "فالاستطاعةُ الشرعيةُ موجودةٌ لم ينعدم منها شيء،"], [1450.0, "لكنّ المسلوبَ عنهم إنما هي الاستطاعةُ الكونية."]], "tr": [[1420.0, "<span class=\"ayah\">﴿Gözleri vardır, onlarla görmezler﴾<\/span>. Âlet sağlamdır, hakkı görmeye muktedirdir;"], [1423.0, "fakat inat, büyüklük taslama, dikbaşlılık ve kibir sebebiyle onu görmekten kaçınır."], [1434.0, "<span class=\"ayah\">﴿Kulakları vardır﴾<\/span>; yani âletler sağlamdır, şer'î istitaat mevcuttur."], [1434.0, "Onların hakkı işitmesi sağlam âletlerle ve mevcut bir akılla karşılaşmıştır."], [1446.0, "Şer'î istitaat mevcuttur, ondan hiçbir şey eksilmemiştir;"], [1450.0, "fakat onlardan alınan, ancak kevnî istitaattir."]]}, {"reader": false, "ar": [[1455.0, "كما قال الله عز وجل:"], [1458.0, "<span class=\"ayah\">﴿الَّذِينَ كَانَتْ أَعْيُنُهُمْ فِي غِطَاءٍ عَن ذِكْرِي وَكَانُوا لَا يَسْتَطِيعُونَ سَمْعًا﴾<\/span> <span class=\"ref\">[الكهف: ١٠١]<\/span>،"], [1465.0, "أي: لا يستطيعونه كونًا لا شرعًا."], [1468.0, "وكقول الله عز وجل:"], [1471.0, "<span class=\"ayah\">﴿انظُرْ كَيْفَ ضَرَبُوا لَكَ الْأَمْثَالَ فَضَلُّوا فَلَا يَسْتَطِيعُونَ سَبِيلًا﴾<\/span> <span class=\"ref\">[الإسراء: ٤٨]<\/span>،"], [1478.0, "أي: لا يستطيعونه كونًا."]], "tr": [[1455.0, "Allah Azze ve Celle'nin buyurduğu gibi:"], [1458.0, "<span class=\"ayah\">﴿Onlar ki gözleri beni anmaya karşı perde içindeydi ve işitmeye de güç yetiremiyorlardı﴾<\/span> [Kehf 101];"], [1458.0, "yani ona kevnen güç yetiremiyorlardı, şer'an değil."], [1465.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1471.0, "<span class=\"ayah\">﴿Bak, sana nasıl misaller getirdiler de saptılar; artık bir yol bulmaya güç yetiremezler﴾<\/span> [İsrâ 48];"], [1471.0, "yani ona kevnen güç yetiremezler."]]}, {"reader": false, "ar": [[1481.0, "وإن كان السبيلُ قد بُيِّن لهم،"], [1485.1, "ومُهِّد بساطُه، وأُرسل رسولُه،"], [1487.8, "وأُنزل كتابُه شرعًا؛ فالآلاتُ موجودةٌ والأسبابُ متوفّرة،"], [1492.9, "ولكن سُلبوا الاستطاعةَ الكونية،"], [1498.0, "وسلبُها ليس بعذرٍ لهم."]], "tr": [[1481.0, "Oysa yol onlara şer'an açıklanmış, zemini döşenmiş, resulü gönderilmiş ve kitabı indirilmiştir."], [1487.8, "Âletler mevcuttur, sebepler hazırdır; fakat kevnî istitaat onlardan alınmıştır ve onun alınması onlar için mazeret değildir."]]}]}, {"ts": "25:01", "title": "4. Külliye (devam): \"Allah istitaati elinden aldığı hâlde kâfire nasıl azap eder?\"", "paras": [{"reader": false, "ar": [[1501.0, "وأيضًا قولُ الله عز وجل:"], [1504.0, "<span class=\"ayah\">﴿يَوْمَ يُكْشَفُ عَن سَاقٍ وَيُدْعَوْنَ إِلَى السُّجُودِ فَلَا يَسْتَطِيعُونَ﴾<\/span> ـ انتبه ـ <span class=\"ayah\">﴿خَاشِعَةً أَبْصَارُهُمْ تَرْهَقُهُمْ ذِلَّةٌ ۖ وَقَدْ كَانُوا يُدْعَوْنَ إِلَى السُّجُودِ وَهُمْ سَالِمُونَ﴾<\/span> <span class=\"ref\">[القلم: ٤٢–٤٣]<\/span>؛"], [1523.0, "يعني: وهم في حال الأمن والهدوء والطمأنينة والدَّعة والسَّعة والصحة،"], [1531.0, "ومع ذلك لم يكونوا يسجدون مع توفّر الآلات ووجود الأسباب."]], "tr": [[1501.0, "Allah Azze ve Celle'nin şu sözü de:"], [1504.0, "<span class=\"ayah\">﴿Baldırın açılacağı ve secdeye çağrılacakları gün, güç yetiremezler﴾<\/span> —dikkat et— <span class=\"ayah\">﴿Gözleri düşük, kendilerini bir zillet kaplamış olarak. Oysa onlar sapasağlam iken secdeye çağrılıyorlardı﴾<\/span> [Kalem 42–43]."], [1504.0, "Yani emniyet, sükûnet, huzur, rahatlık, bolluk ve sağlık hâlindeyken."], [1523.0, "Buna rağmen âletler mevcut ve sebepler var olduğu hâlde secde etmiyorlardı."]]}, {"reader": false, "ar": [[1536.0, "فحُرموا من السجود كونًا بين يدي الله عز وجل إذا جاء إلى أهل الموقف مجيئًا يليق بجلاله وعظمته."], [1544.0, "فإن قيل لك: وكيف يعذّب اللهُ عز وجل الكافرَ مع أنّ الله هو الذي سلبه الاستطاعة؟"], [1555.0, "فنقول: إنما سلبه الاستطاعةَ الكونية لا الشرعية."]], "tr": [[1536.0, "Allah Azze ve Celle, celâline ve azametine yakışır bir gelişle mahşer ehline geldiğinde, O'nun huzurunda kevnen secdeden mahrum bırakıldılar."], [1544.0, "Sana \"Kâfirin istitaatini elinden alan Allah olduğu hâlde Allah Azze ve Celle ona nasıl azap eder?\" denilirse deriz ki:"], [1555.0, "Ondan ancak kevnî istitaati almıştır, şer'î istitaati değil."]]}, {"reader": false, "ar": [[1562.0, "وذلك يتبيّن... ويتّضح لك ذلك إذا قلتَ بأنّ الله لو لم يرسل رسولًا أو ينزل كتابًا لما عُذِّب أحد؛"], [1577.0, "لقول الله عز وجل:"], [1579.8, "<span class=\"ayah\">﴿وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولًا﴾<\/span> <span class=\"ref\">[الإسراء: ١٥]<\/span>."], [1584.0, "ولذلك فأهلُ الفترة لا نجزم بعذابهم كلِّهم ولا بنعيمهم كلِّهم؛"], [1590.0, "لأنهم لم يكونوا يستطيعون شرعًا أن يعرفوا الحقَّ لعدم وجود الرسول وعدم نزول الكتاب. تصوّرتموها؟"]], "tr": [[1562.0, "Bu sana şöyle açıklık kazanır:"], [1562.0, "Allah bir resul göndermeseydi ya da bir kitap indirmeseydi hiç kimseye azap edilmezdi dersin;"], [1577.0, "zira Allah Azze ve Celle şöyle buyurur:"], [1579.8, "<span class=\"ayah\">﴿Biz bir resul göndermedikçe azap edici değiliz﴾<\/span> [İsrâ 15]."], [1579.8, "Bu yüzden fetret ehlinin hepsinin azap göreceğine de hepsinin nimete ereceğine de kesin hüküm vermeyiz."], [1590.0, "Çünkü resul bulunmadığı ve kitap inmediği için hakkı bilmeye şer'an güç yetiremiyorlardı. Kavradınız mı?"]]}, {"reader": false, "ar": [[1601.0, "وإن أصرّ على سؤاله فاعلم أنه ممّن يحتجّون بالقضاء والقدر على فعل المعصية،"], [1611.0, "فنجيب عنه بما أجبنا به سابقًا في الكلّيّات السابقة."], [1616.0, "ولذلك فإنّ كلّ الكفّار سيحتجّون على الله بين يديه بأنه هو مَن سلبهم الاستطاعةَ الكونية."]], "tr": [[1601.0, "Sorusunda ısrar ederse, bil ki o, günah işlemeye kaza ve kaderi delil getirenlerdendir."], [1601.0, "Ona önceki külliyelerde daha önce verdiğimiz cevapla cevap veririz."], [1611.0, "Bu yüzden bütün kâfirler, Allah'ın huzurunda, kevnî istitaati kendilerinden alanın O olduğunu Allah'a karşı delil getireceklerdir."]]}, {"reader": false, "ar": [[1630.0, "كما قال الله عز وجل:"], [1632.7, "«وقال الذين أشركوا» <span class=\"ayah\">﴿لَوْ شَاءَ اللَّهُ مَا أَشْرَكْنَا﴾<\/span> <span class=\"ref\">[الأنعام: ١٤٨]<\/span>،"], [1636.9, "<span class=\"ayah\">﴿أَن تَقُولَ نَفْسٌ يَا حَسْرَتَىٰ عَلَىٰ مَا فَرَّطتُ فِي جَنبِ اللَّهِ وَإِن كُنتُ لَمِنَ السَّاخِرِينَ ۝ أَوْ تَقُولَ لَوْ أَنَّ اللَّهَ هَدَانِي﴾<\/span> <span class=\"ref\">[الزمر: ٥٦–٥٧]<\/span>؛"], [1648.1, "أي: لو أنه كتب الاستطاعةَ الكونيةَ لي أن أُسلم لأسلمتُ، أو أهتدي لاهتديت."]], "tr": [[1630.0, "Allah Azze ve Celle'nin buyurduğu gibi:"], [1632.7, "\"Şirk koşanlar dediler ki:\" <span class=\"ayah\">﴿Allah dileseydi şirk koşmazdık﴾<\/span> [En'âm 148]."], [1632.7, "<span class=\"ayah\">﴿Kişinin, \"Allah'a karşı yaptığım kusurlardan dolayı vay hâlime! Gerçekten ben alay edenlerdendim\" demesinden ya da \"Allah bana hidayet etseydi\" demesinden (sakının)﴾<\/span> [Zümer 56–57]."], [1636.9, "Yani: \"Müslüman olmam için bana kevnî istitaati yazsaydı müslüman olurdum\" ya da \"hidayete ermem için (yazsaydı) hidayete ererdim\"."]]}, {"reader": false, "ar": [[1655.0, "مع أنّ الله عز وجل بيّن في كتابه أنّ عدم الاستطاعة الكونية لا تُعتبر عذرًا لأحد؛"], [1663.0, "لأنك أقدمتَ على الكفر وأنت غيرُ عالمٍ أنك عندنا مكتوبٌ من هؤلاء أو هؤلاء؛"], [1672.0, "لأنّ القدر سرُّ الله."], [1674.0, "فأقدمتَ على الكفر بكامل اختيارك،"], [1676.5, "لا لأنك علمتَ أننا سلبنا الاستطاعةَ عنك،"], [1680.0, "وأقدمتَ على المعصية بكامل تخطيطك وتدبيرك واختيارك،"], [1686.0, "لا لأنك اطّلعتَ على ما كتبناه من أنك مسلوبُ الاستطاعة الكونية."]], "tr": [[1655.0, "Oysa Allah Azze ve Celle Kitabı'nda kevnî istitaatin yokluğunun hiç kimse için mazeret sayılmadığını açıklamıştır."], [1663.0, "Çünkü sen, bizim katımızda şunlardan mı bunlardan mı yazıldığını bilmeden küfre giriştin;"], [1672.0, "zira kader Allah'ın sırrıdır. Küfre tam bir ihtiyarla giriştin;"], [1676.5, "istitaati senden aldığımızı bildiğin için değil."], [1680.0, "Günaha da tam bir planlama, tedbir ve ihtiyarla giriştin;"], [1680.0, "kevnî istitaatin senden alındığına dair yazdığımız şeye muttali olduğun için değil."]]}]}, {"ts": "28:16", "title": "İki istitaat: Ehl-i Sünnet, Cebriyye ve Kaderiyye'nin görüşleri", "paras": [{"reader": false, "ar": [[1696.0, "فإذا قيل لك: كم أنواعُ الاستطاعة عند أهل السنة والجماعة؟"], [1701.0, "فقل: استطاعتان. فإن قيل:"], [1705.5, "وما هما؟ قل: الأولى:"], [1708.4, "الاستطاعة الشرعية ـ بين قوسين:"], [1711.3, "استطاعةٌ قبل الفعل ـ الثانية:"], [1716.9, "استطاعةٌ كونية ـ بين قوسين: استطاعةٌ مصاحبةٌ للفعل."]], "tr": [[1696.0, "Sana \"Ehl-i Sünnet ve'l-Cemaat'e göre istitaatin kaç türü vardır?\" denilirse, de ki:"], [1701.0, "İki istitaat. \"Nedir onlar?\" denilirse, de ki:"], [1708.4, "Birincisi şer'î istitaat —parantez içinde:"], [1711.3, "fiilden önceki istitaat—; ikincisi kevnî istitaat —parantez içinde: fiile eşlik eden istitaat—."]]}, {"reader": false, "ar": [[1724.5, "وكلا الاستطاعتين يؤمن بها أهلُ السنة والجماعة؛"], [1730.0, "فالاستطاعةُ الشرعية متعلّقةٌ بألوهيّته،"], [1736.0, "والاستطاعةُ الكونية متعلّقةٌ بربوبيّته،"], [1739.6, "وكلا الاستطاعتين نحن نؤمن بها ونصدّق بها."], [1745.0, "ولّا لا يا جماعة؟"], [1747.0, "نحن نؤمن بها ونصدّق بها."]], "tr": [[1724.5, "Ehl-i Sünnet ve'l-Cemaat her iki istitaate de iman eder."], [1724.5, "Şer'î istitaat O'nun ulûhiyyetiyle, kevnî istitaat ise O'nun rubûbiyyetiyle ilgilidir."], [1736.0, "Her iki istitaate de iman eder ve onları tasdik ederiz."], [1739.6, "Öyle değil mi, cemaat? Onlara iman eder ve onları tasdik ederiz."]]}, {"reader": false, "ar": [[1749.0, "فإن قلتَ: وما مذهب القدرية والجبرية في الاستطاعتين؟"], [1758.0, "الجواب: مذهبهم فيها مبنيٌّ على قولهم في فعل العبد؛"], [1769.0, "فلأنّ الجبرية يسلبون العبدَ قدرتَه واختيارَه ومشيئتَه،"], [1776.0, "فيقولون: لا استطاعةَ إلا مقارِنةٌ للفعل؛"], [1783.0, "فلا يؤمنون من الاستطاعتين إلا بالاستطاعة الكونية فقط،"], [1788.0, "وليس عند الجبرية استطاعةٌ شرعية."]], "tr": [[1749.0, "\"Kaderiyye'nin ve Cebriyye'nin iki istitaat hakkındaki mezhebi nedir?\" dersen, cevap:"], [1758.0, "Onların bu konudaki mezhebi, kulun fiili hakkındaki görüşlerine dayanır."], [1769.0, "Cebriyye kulun kudretini, ihtiyarını ve meşîetini elinden aldığı için \"Fiile eşlik edenden başka istitaat yoktur\" derler."], [1783.0, "Dolayısıyla iki istitaatten yalnızca kevnî istitaate iman ederler; Cebriyye'de şer'î istitaat yoktur."]]}, {"reader": false, "ar": [[1793.0, "وأمّا القدرية فلأنهم يُعطون العبدَ المشيئةَ المطلقة والقدرةَ المطلقة والاختيارَ المطلق،"], [1804.0, "وأنه هو الذي يخلق فعلَه،"], [1806.0, "فيقولون بأنّ الاستطاعة تكون قبل الفعل فقط، وممتدّةٌ إلى الفعل."]], "tr": [[1793.0, "Kaderiyye ise kula mutlak meşîeti, mutlak kudreti ve mutlak ihtiyarı verdikleri ve fiilini yaratanın kendisi olduğunu söyledikleri için istitaatin sadece fiilden önce olduğunu ve fiile kadar uzandığını söylerler."]]}, {"reader": false, "ar": [[1814.0, "يعني بمعنى أنّ الجبرية أثبتوا الاستطاعةَ المقارِنةَ للفعل،"], [1822.0, "وهي الاستطاعة الكونية، وليس عندهم استطاعةٌ شرعية."], [1826.0, "والقدريةُ المعتزلةُ النُّفاةُ أثبتوا الاستطاعةَ الشرعية،"], [1830.2, "وليس عندهم استطاعةٌ كونية."]], "tr": [[1814.0, "Yani Cebriyye fiile eşlik eden istitaati, yani kevnî istitaati isbat etti;"], [1822.0, "onlarda şer'î istitaat yoktur. (Kaderi) nefyeden Mu'tezilî Kaderiyye ise şer'î istitaati isbat etti; onlarda kevnî istitaat yoktur."]]}, {"reader": false, "ar": [[1834.0, "وأمّا أهلُ السنة والجماعة فلأنهم يجعلون فعلَ العبد منسوبًا إلى الله خلقًا وتقديرًا آمنوا بالاستطاعة الكونية،"], [1843.9, "و(لأنهم) ينسبونه إليه تحصيلًا وتسبّبًا واكتسابًا آمنوا بالاستطاعة الشرعية؛"], [1851.2, "فكلا الاستطاعتين نحن نؤمن بها إيمانًا جازمًا."]], "tr": [[1834.0, "Ehl-i Sünnet ve'l-Cemaat ise kulun fiilini yaratma ve takdir yönüyle Allah'a nispet ettikleri için kevnî istitaate iman ettiler;"], [1834.0, "tahsil, sebep olma ve kesb yönüyle onu kula nispet ettikleri için de şer'î istitaate iman ettiler."], [1851.2, "Her iki istitaate de kesin bir imanla iman ederiz."]]}]}, {"ts": "30:57", "title": "İki istitaat arasındaki farklar", "paras": [{"reader": false, "ar": [[1857.0, "فإن قيل لك: لخِّص لنا الفروقَ بين الاستطاعتين ـ أنا قلتُ لكم:"], [1862.9, "مْنطوّل فيها شوي معكم <span class=\"q\">؟ 31:02<\/span> ـ لخِّص لنا الفروقَ بين الاستطاعتين،"], [1868.0, "فأقول: الاستطاعةُ الشرعية يتعلّق بها التكليفُ وجودًا وعدمًا؛"], [1874.0, "فإذا وُجدت وُجد التكليف،"], [1876.9, "وإذا عُدمت عُدم التكليف."], [1882.0, "وأمّا الاستطاعةُ الكونية فلا تعلُّقَ لها بالتكليف وجودًا ولا عدمًا؛"], [1888.0, "فالتكليفُ يوجد وإن كانت منعدمة."]], "tr": [[1857.0, "Sana \"Bize iki istitaat arasındaki farkları özetle\" denilirse —size söylemiştim, bu konuda sizinle biraz uzun duracağız <span class=\"q\">؟<\/span>— \"Bize iki istitaat arasındaki farkları özetle\" (denilirse), derim ki:"], [1868.0, "Şer'î istitaate teklif varlık ve yokluk bakımından bağlıdır:"], [1874.0, "O bulunursa teklif bulunur, yok olursa teklif yok olur."], [1882.0, "Kevnî istitaatin ise ne varlık ne de yokluk bakımından teklifle bir bağı vardır;"], [1888.0, "o yok olsa bile teklif bulunur."]]}, {"reader": false, "ar": [[1892.0, "الثاني: أنّ الاستطاعة الشرعية من شأنها أن تكون قبل الفعل،"], [1904.0, "وأمّا الاستطاعة الكونية فمن شأنها أن تكون مصاحبةً ومقارِنةً للفعل."]], "tr": [[1892.0, "İkincisi: Şer'î istitaatin özelliği fiilden önce olmasıdır;"], [1892.0, "kevnî istitaatin özelliği ise fiile eşlik etmesi ve onunla birlikte olmasıdır."]]}, {"reader": false, "ar": [[1911.0, "الثالث: أنّ فقدان الاستطاعة الشرعية يُعتبر عذرًا شرعيًّا،"], [1916.2, "لا يُعاقَب مَن فقدها على مأمورٍ فوّته أو محظورٍ فعله."], [1930.0, "وأمّا الاستطاعة الكونية فلا يُعتبر فقدُها عذرًا شرعيًّا؛"], [1938.0, "فالكافر يُعاقَب على كفره وإن كان مسلوبَ الاستطاعة الكونية أن يُسلم،"], [1945.0, "والعاصي يُعذَّب على معصيته وإن كان مسلوبَ الاستطاعة الكونية في الطاعة."]], "tr": [[1911.0, "Üçüncüsü: Şer'î istitaatin kaybı şer'î bir mazeret sayılır;"], [1911.0, "onu kaybeden, kaçırdığı bir emirden veya işlediği bir yasaktan dolayı cezalandırılmaz."], [1930.0, "Kevnî istitaatin kaybı ise şer'î bir mazeret sayılmaz."], [1930.0, "Kâfir, müslüman olma kevnî istitaati elinden alınmış olsa bile küfründen dolayı cezalandırılır;"], [1938.0, "günahkâr da itaatte kevnî istitaati elinden alınmış olsa bile günahından dolayı azap görür."]]}, {"reader": false, "ar": [[1953.0, "ومن الفروق: أنّ فقدان الاستطاعة الشرعية شيءٌ لا يُلام عليه العبد؛"], [1965.0, "فلا يلومك الله لِمَ لم تستطع أن تصلّي قائمًا؛"], [1969.5, "لأنك عاجزٌ عنه، فأنت فاقدٌ للاستطاعة الشرعية."], [1974.0, "وفقدانُ الاستطاعة الشرعية شيءٌ لا يُلام عليه العبدُ أبدًا؛"], [1981.0, "إذ هو من فعل الله فيك."]], "tr": [[1953.0, "Farklardan biri de şudur: Şer'î istitaatin kaybı, kulun kınanmadığı bir şeydir."], [1953.0, "Allah seni \"Neden ayakta namaz kılamadın?\" diye kınamaz;"], [1965.0, "çünkü sen ondan acizsin, şer'î istitaati kaybetmişsin."], [1969.5, "Şer'î istitaatin kaybı, kulun asla kınanmadığı bir şeydir;"], [1974.0, "çünkü o, Allah'ın sende yaptığı bir fiildir."]]}, {"reader": false, "ar": [[1983.0, "فإذا قدّر اللهُ عليك المرضَ فأعجزك فأنت لا تُلام على المرض وفقدان الصحة،"], [1993.0, "وإذا عجزتَ عن الصيام فأفطرتَ فلا يلومك الله على هذا العجز؛"], [1999.0, "ففقدانُ الاستطاعة الشرعية شيءٌ لا يُلام عليه العبد."]], "tr": [[1983.0, "Allah sana hastalığı takdir edip seni aciz bıraktığında, hastalıktan ve sağlığın kaybından dolayı kınanmazsın."], [1993.0, "Oruçtan aciz kalıp orucunu yediğinde, Allah seni bu acizlikten dolayı kınamaz."], [1999.0, "Şer'î istitaatin kaybı, kulun kınanmadığı bir şeydir."]]}, {"reader": false, "ar": [[2005.0, "وأمّا فقدان الاستطاعة الكونية فأمرٌ يُلام عليه العبد،"], [2014.0, "أي: يُلام على آثاره."], [2016.0, "فلا يحقّ للكافر أن يقول:"], [2019.4, "إنما كفرتُ لأنك أعجزتني عن الإسلام كونًا؛"], [2027.0, "فإنّ ذلك ليس بعذرٍ له،"], [2029.2, "فهو ملامٌ على كفره."], [2031.0, "ولا حقَّ للعاصي أن يقول:"], [2033.7, "إنما عصيتُك لأني عاجزٌ عن طاعتك بسلب القدرة؛"], [2038.0, "فهو معاقَبٌ على معصيته."]], "tr": [[2005.0, "Kevnî istitaatin kaybı ise kulun kınandığı bir şeydir;"], [2005.0, "yani onun sonuçlarından dolayı kınanır."], [2014.0, "Kâfirin \"Beni müslüman olmaktan kevnen aciz bıraktığın için kâfir oldum\" deme hakkı yoktur;"], [2019.4, "bu onun için mazeret değildir, küfründen dolayı kınanır."], [2029.2, "Günahkârın da \"Kudret elimden alındığı için sana itaatten aciz olduğumdan sana isyan ettim\" deme hakkı yoktur; günahından dolayı cezalandırılır."]]}, {"reader": false, "ar": [[2042.0, "لعلّكم تصوّرتم الآن ـ إن شاء الله ـ تصوّرًا كاملًا."], [2046.0, "ولذلك... وهذا يتفرّع عنه الفرقانُ الأخير:"], [2052.0, "أنّ فقدان الشرعية لا عقابَ عليه،"], [2057.0, "وفقدان الكونية يتعلّق به العقاب؛"], [2060.0, "أنّ فقدان الاستطاعة الشرعية شيءٌ لا عقابَ فيه،"], [2066.0, "وأمّا فقدان الكونية فشيءٌ يتعلّق به العقاب."]], "tr": [[2042.0, "Umarım şimdi —inşallah— tam olarak kavramışsınızdır."], [2042.0, "Bu yüzden... Son fark da bundan dallanır:"], [2046.0, "Şer'î (istitaatin) kaybına ceza yoktur, kevnî (istitaatin) kaybına ise ceza bağlıdır."], [2057.0, "Şer'î istitaatin kaybı, cezası olmayan bir şeydir;"], [2060.0, "kevnî (istitaatin) kaybı ise cezanın bağlı olduğu bir şeydir."]]}, {"reader": false, "ar": [[2073.0, "فإن قلتَ: وما مبدأُ الاحتجاج بالقدر على المعصية؟"], [2082.0, "فقل: للخلط بين نوعي الاستطاعة؛"], [2087.0, "فتجده يرتكب المعصيةَ ويحتجّ على فعله بأنّ الله قدّرها عليه،"], [2095.0, "فكأنه يقول: بما أنه قدّرها فأنا لا أستطيع أن أتركها."]], "tr": [[2073.0, "\"Günaha kaderi delil getirmenin başlangıcı nedir?\" dersen, de ki:"], [2073.0, "İki istitaat türünü birbirine karıştırmaktır."], [2082.0, "Onun günahı işlediğini ve fiiline Allah'ın onu kendisine takdir ettiğini delil getirdiğini görürsün."], [2095.0, "Sanki şöyle der: \"Madem onu takdir etti, ben onu terk etmeye güç yetiremem.\""]]}, {"reader": false, "ar": [[2101.0, "فمسألةُ الاحتجاج بالقضاء والقدر مبنيّةٌ على هذه المسألة الخطيرة،"], [2109.0, "وهي التفريقُ بين نوعي الاستطاعة،"], [2112.0, "وقد هدى اللهُ أهلَ السنة فيها لِما..."], [2115.8, "إلى ما أضلَّ عنه الطائفتين:"], [2119.0, "القدريةَ والجبرية، كما ذكرتُه لكم. والله أعلم."]], "tr": [[2101.0, "Kaza ve kaderi delil getirme meselesi, bu tehlikeli meseleye, yani iki istitaat türünü birbirinden ayırmaya dayanır."], [2109.0, "Allah Ehl-i Sünnet'i bu konuda, iki taifeyi —Kaderiyye'yi ve Cebriyye'yi— saptırdığı şeye (doğruya) hidayet etti;"], [2119.0, "size zikrettiğim gibi. Allah en iyisini bilir."]]}]}, {"ts": "35:26", "title": "5. Külliye: Her hidayet ve dalalet yaratma ve takdir yönüyle Allah'tan, sebep olma ve tahsil yönüyle kuldandır", "paras": [{"reader": false, "ar": [[2126.0, "ومن الكلّيّات أيضًا: كلُّ هدايةٍ وضلالٍ فمن الله خلقًا وتقديرًا،"], [2128.8, "ومن العبد تسبُّبًا وتحصيلًا؛"], [2129.0, "كلُّ هدايةٍ وضلالٍ <span class=\"note\">(يكررها)<\/span> فمن الله خلقًا وتقديرًا،"], [2147.0, "ومن العبد تسبُّبًا وتحصيلًا، أي: اكتسابًا."]], "tr": [[2126.0, "Külliyelerden biri de şudur: 5."], [2126.0, "külliye: Her hidayet ve dalalet, yaratma ve takdir yönüyle Allah'tan, sebep olma ve tahsil yönüyle kuldandır. Her hidayet ve dalalet (tekrar ediyor), yaratma ve takdir yönüyle Allah'tan, sebep olma ve tahsil yönüyle —yani kesb yönüyle— kuldandır."]]}, {"reader": false, "ar": [[2159.0, "فالهدايةُ والإضلال من المسائل القدرية التي ضلّ فيها كثيرٌ من الأمم،"], [2169.0, "واتُّهم اللهُ عز وجل في قضائه،"], [2171.7, "وطُعن في حكمته، ونُسب إلى الظلم بسبب عدم فهمهم لمسألة الضلال والهداية."], [2182.0, "وهذه الكلّيّة تفصّل لك ما ضلّت فيه كثيرٌ من الأمم،"], [2189.0, "وحار فيه كثيرٌ من العقلاء."]], "tr": [[2159.0, "Hidayet ve saptırma, birçok ümmetin içinde saptığı kader meselelerindendir."], [2159.0, "Dalalet ve hidayet meselesini anlamamaları yüzünden Allah Azze ve Celle kazasında itham edildi, hikmeti kötülendi ve zulme nispet edildi."], [2171.7, "Bu külliye sana, birçok ümmetin içinde saptığı ve birçok akıllının şaşırıp kaldığı şeyi tafsilatlı olarak açıklar."]]}, {"reader": false, "ar": [[2191.0, "وهي أنّ كلَّ هدايةٍ فيُنظر لها باعتبارين،"], [2196.0, "كما أنّ كلَّ ضلالٍ يُنظر له باعتبارين:"], [2201.0, "باعتبار خلقهما وتقديرهما، وهذا أمرٌ يرجع إلى الله عز وجل؛"], [2207.0, "فاللهُ عز وجل هو الذي يهدي عبادَه خلقًا وتقديرًا،"], [2215.0, "وهو الذي يُضلّ عبادَه خلقًا وتقديرًا."], [2220.0, "لكن للعبد في الهداية تحصيلٌ واكتسابُ أسباب،"], [2226.0, "وللعبد في مسألة الضلال تحصيلٌ واقترافٌ واكتسابٌ وأسباب."]], "tr": [[2191.0, "Şöyle ki her hidayete iki itibarla bakılır;"], [2191.0, "her dalalete de iki itibarla bakıldığı gibi."], [2196.0, "(Birincisi) onların yaratılması ve takdiri itibarıyla;"], [2201.0, "bu, Allah Azze ve Celle'ye dönen bir iştir."], [2201.0, "Kullarını yaratma ve takdir yönüyle hidayete erdiren Allah Azze ve Celle'dir;"], [2215.0, "kullarını yaratma ve takdir yönüyle saptıran da O'dur."], [2220.0, "Fakat hidayette kulun tahsili ve sebepleri kazanması vardır;"], [2226.0, "dalalet meselesinde de kulun tahsili, irtikâbı, kesbi ve sebepleri vardır."]]}, {"reader": false, "ar": [[2233.0, "وأنت لستَ بمأمورٍ أن تنظر لما قُدّر لك من هدايةٍ أو ضلالٍ عند الله،"], [2242.0, "وإنما أنت مأمورٌ بسلوك طريق الهداية لتهتدي،"], [2246.7, "ومجانبةِ أسباب الضلالة حتى لا تقع فيها."], [2252.0, "فكثيرٌ من الناس يترك المأمورَ به،"], [2256.1, "وينظر إلى إيش؟ إلى ما ليس مأمورًا به."]], "tr": [[2233.0, "Sen, Allah katında senin için takdir edilmiş hidayete veya dalalete bakmakla emrolunmadın."], [2242.0, "Sen ancak hidayete ermek için hidayet yoluna girmekle ve dalalete düşmemek için onun sebeplerinden uzak durmakla emrolundun."], [2252.0, "İnsanların birçoğu emrolunduğu şeyi terk eder ve neye bakar? Emrolunmadığı şeye."]]}, {"reader": false, "ar": [[2265.0, "فنقول في الهداية والضلال كما نقوله في أفعال العباد."], [2272.0, "وعلى ذلك وردت الأدلةُ تنسب الهدايةَ والضلالَ خلقًا وتقديرًا إلى الله عز وجل،"], [2281.0, "وتنسب في نفس الوقت الهدايةَ والضلالَ إلى العبد،"], [2286.0, "فلا تعارضَ بين هذه النسبتين... بين هاتين النسبتين."]], "tr": [[2265.0, "Hidayet ve dalalet hakkında da kulların fiilleri hakkında söylediğimizi söyleriz."], [2272.0, "Deliller de buna göre gelmiştir:"], [2272.0, "Hidayeti ve dalaleti yaratma ve takdir yönüyle Allah Azze ve Celle'ye nispet eder, aynı zamanda hidayeti ve dalaleti kula da nispet eder."], [2286.0, "Bu iki nispet arasında bir çelişki yoktur."]]}, {"reader": false, "ar": [[2291.0, "لأنّ كلَّ هدايةٍ وإضلالٍ يُنسب إلى الله فهي نسبةُ خلقٍ وتقديرٍ وإيجاد،"], [2297.0, "وكلُّ هدايةٍ وضلالٍ يُنسب إلى المخلوق فهي هدايةُ التحصيل..."], [2302.2, "فهي هدايةٌ وضلالُ إيش؟ التحصيل والاكتساب."]], "tr": [[2291.0, "Çünkü Allah'a nispet edilen her hidayet ve saptırma, yaratma, takdir ve icat nispetidir."], [2297.0, "Mahlûka nispet edilen her hidayet ve dalalet ise tahsil hidayetidir..."], [2302.2, "Neyin hidayeti ve dalaleti? Tahsil ve kesbin."]]}]}, {"ts": "38:26", "title": "5. Külliye (devam): Hidayeti ve dalaleti Allah'a nispet eden deliller", "paras": [{"reader": false, "ar": [[2306.0, "وإليكم الأدلةَ الكثيرةَ الوفيرة:"], [2311.0, "كقول الله عز وجل:"], [2313.3, "<span class=\"ayah\">﴿فَمَن يُرِدِ اللَّهُ أَن يَهْدِيَهُ يَشْرَحْ صَدْرَهُ لِلْإِسْلَامِ﴾<\/span>،"], [2318.0, "أي: إذا أراد هدايتَه في السماء تقديرًا وخلقًا شرح صدرَه في الأرض لقبول الحق تحصيلًا واكتسابًا،"], [2329.0, "<span class=\"ayah\">﴿وَمَن يُرِدْ﴾<\/span> ـ أي: كونًا ـ <span class=\"ayah\">﴿أَن يُضِلَّهُ يَجْعَلْ صَدْرَهُ ضَيِّقًا حَرَجًا كَأَنَّمَا يَصَّعَّدُ فِي السَّمَاءِ﴾<\/span> <span class=\"ref\">[الأنعام: ١٢٥]<\/span>،"], [2337.0, "أي: يُغلق قلبَه عن قبول أسباب الهداية."]], "tr": [[2306.0, "İşte size pek çok ve bol deliller:"], [2306.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [2313.3, "<span class=\"ayah\">﴿Allah kimi hidayete erdirmek isterse onun göğsünü İslâm'a açar﴾<\/span>;"], [2313.3, "yani gökte takdir ve yaratma yönüyle onun hidayetini dilediğinde, yeryüzünde tahsil ve kesb yönüyle hakkı kabul etmesi için göğsünü açar."], [2329.0, "<span class=\"ayah\">﴿Kimi de saptırmak isterse﴾<\/span> —yani kevnen— <span class=\"ayah\">﴿onun göğsünü, göğe çıkıyormuş gibi dar ve sıkıntılı kılar﴾<\/span> [En'âm 125];"], [2329.0, "yani kalbini hidayetin sebeplerini kabul etmeye kapatır."]]}, {"reader": false, "ar": [[2341.0, "قال الله عز وجل:"], [2343.2, "<span class=\"ayah\">﴿ذَٰلِكَ هُدَى اللَّهِ يَهْدِي بِهِ مَن يَشَاءُ ۚ وَمَن يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ﴾<\/span> <span class=\"ref\">[الزمر: ٢٣]<\/span>؛"], [2351.0, "أي: يهديه تقديرًا وخلقًا وإيجادًا،"], [2354.3, "ويُضلّه تقديرًا وخلقًا وإيجادًا."], [2357.0, "وكذلك يقول الله عز وجل:"], [2359.9, "<span class=\"ayah\">﴿وَيُضِلُّ اللَّهُ الظَّالِمِينَ ۚ وَيَفْعَلُ اللَّهُ مَا يَشَاءُ﴾<\/span> <span class=\"ref\">[إبراهيم: ٢٧]<\/span>."]], "tr": [[2341.0, "Allah Azze ve Celle şöyle buyurdu:"], [2343.2, "<span class=\"ayah\">﴿İşte bu, Allah'ın hidayetidir; onunla dilediğini hidayete erdirir. Allah kimi saptırırsa artık onun için hiçbir yol gösterici yoktur﴾<\/span> [Zümer 23]."], [2351.0, "Yani onu takdir, yaratma ve icat yönüyle hidayete erdirir;"], [2354.3, "takdir, yaratma ve icat yönüyle saptırır."], [2359.9, "Allah Azze ve Celle şöyle de buyurur:"], [2359.9, "<span class=\"ayah\">﴿Allah zalimleri saptırır. Allah dilediğini yapar﴾<\/span> [İbrâhîm 27]."]]}, {"reader": false, "ar": [[2364.0, "ويقول الله عز وجل:"], [2366.7, "<span class=\"ayah\">﴿قُل لِّلَّهِ الْمَشْرِقُ وَالْمَغْرِبُ ۚ يَهْدِي مَن يَشَاءُ إِلَىٰ صِرَاطٍ مُّسْتَقِيمٍ﴾<\/span> <span class=\"ref\">[البقرة: ١٤٢]<\/span>."], [2374.0, "وقد قلتُ لكم سابقًا:"], [2376.2, "إنّ كلَّ مشيئةٍ تُنسب إلى الله في الأدلة فهي الكونيةُ المتعلّقة بالخلق والإيجاد والتقدير."], [2384.0, "وقال الله عز وجل:"], [2386.1, "<span class=\"ayah\">﴿لَّيْسَ عَلَيْكَ هُدَاهُمْ وَلَٰكِنَّ اللَّهَ يَهْدِي مَن يَشَاءُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٧٢]<\/span>، أي: خلقًا وتقديرًا."]], "tr": [[2364.0, "Allah Azze ve Celle şöyle buyurur:"], [2366.7, "<span class=\"ayah\">﴿De ki: Doğu da batı da Allah'ındır. O dilediğini dosdoğru bir yola iletir﴾<\/span> [Bakara 142]."], [2366.7, "Size daha önce söylemiştim: Delillerde Allah'a nispet edilen her meşîet, yaratma, icat ve takdirle ilgili olan kevnî meşîettir."], [2376.2, "Allah Azze ve Celle şöyle buyurdu:"], [2384.0, "<span class=\"ayah\">﴿Onları hidayete erdirmek sana ait değildir; fakat Allah dilediğini hidayete erdirir﴾<\/span> [Bakara 272];"], [2386.1, "yani yaratma ve takdir yönüyle."]]}, {"reader": false, "ar": [[2392.0, "وقال الله عز وجل:"], [2393.5, "<span class=\"ayah\">﴿ذَٰلِكَ هُدَى اللَّهِ يَهْدِي بِهِ مَن يَشَاءُ مِنْ عِبَادِهِ﴾<\/span> <span class=\"ref\">[الأنعام: ٨٨]<\/span>."], [2397.0, "وقال الله عز وجل:"], [2398.8, "<span class=\"ayah\">﴿وَأَنَّ اللَّهَ يَهْدِي مَن يُرِيدُ﴾<\/span> <span class=\"ref\">[الحج: ١٦]<\/span>."], [2401.0, "وقال الله عز وجل:"], [2403.1, "<span class=\"ayah\">﴿لَّقَدْ أَنزَلْنَا آيَاتٍ مُّبَيِّنَاتٍ ۚ وَاللَّهُ يَهْدِي مَن يَشَاءُ إِلَىٰ صِرَاطٍ مُّسْتَقِيمٍ﴾<\/span> <span class=\"ref\">[النور: ٤٦]<\/span> <span class=\"note\">(Şeyh «آيات بينات» diyor)<\/span>."]], "tr": [[2392.0, "Allah Azze ve Celle şöyle buyurdu:"], [2393.5, "<span class=\"ayah\">﴿İşte bu, Allah'ın hidayetidir; kullarından dilediğini onunla hidayete erdirir﴾<\/span> [En'âm 88]."], [2398.8, "Allah Azze ve Celle şöyle buyurdu:"], [2398.8, "<span class=\"ayah\">﴿Şüphesiz Allah dilediğini hidayete erdirir﴾<\/span> [Hac 16]."], [2403.1, "Allah Azze ve Celle şöyle buyurdu:"], [2403.1, "<span class=\"ayah\">﴿Andolsun, biz apaçık ayetler indirdik. Allah dilediğini dosdoğru bir yola iletir﴾<\/span> [Nûr 46]."]]}, {"reader": false, "ar": [[2409.0, "ويقول الله عز وجل:"], [2410.8, "<span class=\"ayah\">﴿مَن يَهْدِ اللَّهُ فَهُوَ الْمُهْتَدِ ۖ وَمَن يُضْلِلْ فَلَن تَجِدَ لَهُ وَلِيًّا مُّرْشِدًا﴾<\/span> <span class=\"ref\">[الكهف: ١٧]<\/span>،"], [2417.1, "وفي الآية الأخرى: <span class=\"ayah\">﴿وَمَن يُضْلِلْ فَأُولَٰئِكَ هُمُ الْخَاسِرُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٧٨]<\/span> <span class=\"note\">(Şeyh «ومن يضلل الله» diyor)<\/span>."], [2422.0, "وقال الله عز وجل:"], [2424.2, "<span class=\"ayah\">﴿أَفَرَأَيْتَ مَنِ اتَّخَذَ إِلَٰهَهُ هَوَاهُ وَأَضَلَّهُ اللَّهُ عَلَىٰ عِلْمٍ﴾<\/span> <span class=\"ref\">[الجاثية: ٢٣]<\/span> <span class=\"note\">(Şeyh «أرأيت» diyor)<\/span>،"], [2429.2, "أي: على تقديرٍ وإيجادٍ وخلق."]], "tr": [[2409.0, "Allah Azze ve Celle şöyle buyurur:"], [2410.8, "<span class=\"ayah\">﴿Allah kimi hidayete erdirirse doğru yolu bulan odur; kimi de saptırırsa artık onun için doğru yolu gösteren bir dost bulamazsın﴾<\/span> [Kehf 17]."], [2417.1, "Diğer ayette de: <span class=\"ayah\">﴿Kimi de saptırırsa işte onlar hüsrana uğrayanlardır﴾<\/span> [A'râf 178]."], [2422.0, "Allah Azze ve Celle şöyle buyurdu:"], [2424.2, "<span class=\"ayah\">﴿Hevâsını ilah edinen ve Allah'ın bir ilim üzere saptırdığı kimseyi gördün mü?﴾<\/span> [Câsiye 23];"], [2424.2, "yani takdir, icat ve yaratma üzere."]]}, {"reader": false, "ar": [[2432.0, "وقال الله عز وجل:"], [2434.5, "<span class=\"ayah\">﴿أَتُرِيدُونَ أَن تَهْدُوا مَنْ أَضَلَّ اللَّهُ ۖ وَمَن يُضْلِلِ اللَّهُ﴾<\/span> <span class=\"ref\">[النساء: ٨٨]<\/span> ـ أي:"], [2440.7, "خلقًا وتقديرًا وإيجادًا ـ <span class=\"ayah\">﴿فَمَا لَهُ مِنْ هَادٍ﴾<\/span> <span class=\"ref\">[الرعد: ٣٣]<\/span> <span class=\"note\">(Nisâ 88'in sonu «فلن تجد له سبيلا»dır)<\/span>."], [2445.0, "وقال الله عز وجل:"], [2446.8, "<span class=\"ayah\">﴿وَمَن يُضْلِلِ اللَّهُ فَلَن تَجِدَ لَهُ سَبِيلًا﴾<\/span> <span class=\"ref\">[النساء: ١٤٣]<\/span>."], [2450.0, "ويقول الله عز وجل:"], [2452.0, "<span class=\"ayah\">﴿مَن يُضْلِلِ اللَّهُ فَلَا هَادِيَ لَهُ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٦]<\/span>؛"], [2455.0, "أي: مهما بذلتم أسبابَ الهداية وإقناعَهم بها لن يهتدوا؛"], [2459.0, "لأنّ الله لم يقدّر ولم يخلق ولم يوجد لهم الهداية."]], "tr": [[2432.0, "Allah Azze ve Celle şöyle buyurdu:"], [2434.5, "<span class=\"ayah\">﴿Allah'ın saptırdığı kimseyi hidayete erdirmek mi istiyorsunuz? Allah kimi saptırırsa﴾<\/span> —yani yaratma, takdir ve icat yönüyle— <span class=\"ayah\">﴿onun için hiçbir yol gösterici yoktur﴾<\/span>."], [2440.7, "Allah Azze ve Celle şöyle buyurdu:"], [2440.7, "<span class=\"ayah\">﴿Allah kimi saptırırsa artık onun için bir yol bulamazsın﴾<\/span> [Nisâ 143]."], [2446.8, "Allah Azze ve Celle şöyle buyurur:"], [2446.8, "<span class=\"ayah\">﴿Allah kimi saptırırsa artık onun için yol gösterici yoktur﴾<\/span> [A'râf 186]."], [2452.0, "Yani hidayetin sebeplerini ve onları buna ikna etmeyi ne kadar harcasanız da hidayete ermezler;"], [2455.0, "çünkü Allah onlar için hidayeti takdir etmemiş, yaratmamış ve icat etmemiştir."]]}, {"reader": false, "ar": [[2465.0, "وقولُ الله عز وجل:"], [2466.5, "<span class=\"ayah\">﴿وَمَن يُضْلِلْ فَلَن تَجِدَ لَهُ وَلِيًّا مُّرْشِدًا﴾<\/span> <span class=\"ref\">[الكهف: ١٧]<\/span>."], [2469.0, "ويقول الله عز وجل:"], [2470.5, "<span class=\"ayah\">﴿وَمَن يُضْلِلِ اللَّهُ فَمَا لَهُ مِن وَلِيٍّ مِّن بَعْدِهِ﴾<\/span> <span class=\"ref\">[الشورى: ٤٤]<\/span>."], [2474.0, "ويقول الله عز وجل:"], [2475.8, "<span class=\"ayah\">﴿وَمَن يُضْلِلِ اللَّهُ فَمَا لَهُ مِن سَبِيلٍ﴾<\/span> <span class=\"ref\">[الشورى: ٤٦]<\/span>."], [2479.0, "وقال الله عز وجل:"], [2481.4, "<span class=\"ayah\">﴿وَمَا كُنَّا لِنَهْتَدِيَ﴾<\/span> ـ أي:"], [2483.7, "تسبُّبًا ـ <span class=\"ayah\">﴿لَوْلَا أَنْ هَدَانَا اللَّهُ﴾<\/span> <span class=\"ref\">[الأعراف: ٤٣]<\/span>،"], [2486.6, "أي: خلقًا وإيجادًا وتقديرًا."]], "tr": [[2465.0, "Allah Azze ve Celle'nin şu sözü de:"], [2466.5, "<span class=\"ayah\">﴿Kimi de saptırırsa artık onun için doğru yolu gösteren bir dost bulamazsın﴾<\/span> [Kehf 17]."], [2469.0, "Allah Azze ve Celle şöyle buyurur:"], [2470.5, "<span class=\"ayah\">﴿Allah kimi saptırırsa, artık ondan sonra onun hiçbir dostu yoktur﴾<\/span> [Şûrâ 44]."], [2474.0, "Allah Azze ve Celle şöyle buyurur:"], [2475.8, "<span class=\"ayah\">﴿Allah kimi saptırırsa artık onun için hiçbir yol yoktur﴾<\/span> [Şûrâ 46]."], [2479.0, "Allah Azze ve Celle şöyle buyurdu:"], [2481.4, "<span class=\"ayah\">﴿Allah bizi hidayete erdirmeseydi﴾<\/span> —yani yaratma, icat ve takdir yönüyle— <span class=\"ayah\">﴿biz hidayete eremezdik﴾<\/span> [A'râf 43] —yani sebep olma yönüyle—."]]}]}, {"ts": "41:29", "title": "5. Külliye (devam): Kulun hidayet ve dalaletteki payı (sebeplilik)", "paras": [{"reader": false, "ar": [[2489.0, "فجميعُ هذه النصوص تراها تنسب الهدايةَ والإضلالَ إلى الله عز وجل،"], [2497.0, "فنحن ـ معاشرَ أهل السنة والجماعة ـ نجعلها نسبةَ خلقٍ وإيجادٍ وكتابةٍ وعلمٍ وتقدير،"], [2506.0, "يعني: شيءٌ يرجع إلى الله عز وجل،"], [2509.0, "وهي التي يسمّيها أهلُ السنة بهداية التوفيق والإلهام."]], "tr": [[2489.0, "Bütün bu nasların hidayeti ve saptırmayı Allah Azze ve Celle'ye nispet ettiğini görürsün."], [2497.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğu bunu yaratma, icat, yazma, ilim ve takdir nispeti sayarız;"], [2506.0, "yani Allah Azze ve Celle'ye dönen bir şey."], [2509.0, "Ehl-i Sünnet'in \"tevfik ve ilham hidayeti\" dediği budur."]]}, {"reader": false, "ar": [[2515.0, "ولكن في نفس الوقت نجد أنّ الله عز وجل يبيّن أنّ للعبد مدخلًا ـ أنّ للعبد مدخلًا ـ في مسألة الهداية وفي مسألة الضلال،"], [2529.0, "وهو مدخلُ السببيّة؛ فللعبد فيها اختيارٌ وسببيّةٌ واقترافٌ وتحصيلٌ باعتبار أسبابها."], [2540.0, "ونقول فيها كما نقول في الأرزاق تمامًا:"], [2546.0, "أوليست الأرزاقُ مقدَّرةً ومكتوبة؟"], [2549.0, "وفي نفس الوقت أمرنا الله أن نسعى لتحصيل أسبابها، لتحصيلها بفعل أسبابها."]], "tr": [[2515.0, "Fakat aynı zamanda Allah Azze ve Celle'nin, kulun hidayet meselesinde ve dalalet meselesinde bir payı olduğunu açıkladığını görürüz;"], [2515.0, "o da sebeplilik payıdır. Sebepleri itibarıyla kulun bunlarda ihtiyarı, sebepliliği, irtikâbı ve tahsili vardır."], [2529.0, "Bu konuda tıpkı rızıklar hakkında söylediğimizi söyleriz:"], [2540.0, "Rızıklar takdir edilmiş ve yazılmış değil midir?"], [2546.0, "Aynı zamanda Allah bize onların sebeplerini elde etmeye, sebeplerini yaparak onları elde etmeye koşmamızı emretmiştir."]]}, {"reader": false, "ar": [[2556.0, "فكذلك الهدايةُ هي مقدَّرةٌ من الله ومكتوبة،"], [2561.0, "ولكن شرع الله عز وجل للعبد أن يبحث عن أسبابها وأن يسلك طريقَها."], [2567.0, "وكذلك الضلال أو الإضلال:"], [2572.0, "فالله عز وجل قدّره على العبد،"], [2575.8, "ولكن حذّره من سلوك أسبابه."]], "tr": [[2556.0, "Hidayet de böyledir: Allah tarafından takdir edilmiş ve yazılmıştır;"], [2556.0, "fakat Allah Azze ve Celle kula onun sebeplerini araştırmayı ve onun yoluna girmeyi meşru kılmıştır."], [2561.0, "Dalalet ya da saptırma da böyledir:"], [2567.0, "Allah Azze ve Celle onu kula takdir etmiştir;"], [2572.0, "fakat onu, sebeplerine girmekten sakındırmıştır."]]}, {"reader": false, "ar": [[2579.0, "كما قال الله عز وجل:"], [2580.7, "<span class=\"ayah\">﴿وَقُلِ الْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَاءَ فَلْيُؤْمِن﴾<\/span>،"], [2584.2, "أي: فليسلك أسبابَ النجاة بالإيمان،"], [2589.0, "<span class=\"ayah\">﴿وَمَن شَاءَ فَلْيَكْفُرْ﴾<\/span> <span class=\"ref\">[الكهف: ٢٩]<\/span>. فردّ اللهُ مشيئةَ الإيمان والكفر إلى مَن؟"], [2594.0, "إلى العبد؛ ممّا يدلّ على أنّ له مدخلًا فيه،"], [2597.0, "وهو في باب السببيّة فقط."]], "tr": [[2579.0, "Allah Azze ve Celle'nin buyurduğu gibi:"], [2580.7, "<span class=\"ayah\">﴿De ki: Hak Rabbinizdendir. Artık dileyen iman etsin﴾<\/span> —yani iman ile kurtuluşun sebeplerine girsin— <span class=\"ayah\">﴿dileyen inkâr etsin﴾<\/span> [Kehf 29]."], [2589.0, "Allah iman ve küfür meşîetini kime döndürdü?"], [2589.0, "Kula. Bu, onun bunda bir payı olduğuna delâlet eder;"], [2594.0, "o da sadece sebeplilik babındadır."]]}, {"reader": false, "ar": [[2600.0, "وعلى ذلك قولُ الله عز وجل:"], [2603.0, "<span class=\"ayah\">﴿لَا إِكْرَاهَ فِي الدِّينِ ۖ قَد تَّبَيَّنَ الرُّشْدُ مِنَ الْغَيِّ ۚ فَمَن يَكْفُرْ بِالطَّاغُوتِ﴾<\/span>؛"], [2611.0, "فنسب الكفرَ بالطاغوت إلى العبد،"], [2613.0, "وأنه من جملة أعماله التي يتّقي بها سخطَ الله وعذابَه في الآخرة،"], [2618.0, "<span class=\"note\">(Şeyh «وَيُؤْمِن بِاللَّهِ»yı okumuyor)<\/span> <span class=\"ayah\">﴿فَقَدِ اسْتَمْسَكَ بِالْعُرْوَةِ الْوُثْقَىٰ لَا انفِصَامَ لَهَا ۗ وَاللَّهُ سَمِيعٌ عَلِيمٌ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٦]<\/span>."]], "tr": [[2600.0, "Allah Azze ve Celle'nin şu sözü de buna göredir:"], [2603.0, "<span class=\"ayah\">﴿Dinde zorlama yoktur. Doğruluk sapıklıktan açıkça ayrılmıştır. Kim tâğûtu inkâr ederse﴾<\/span> —tâğûtu inkâr etmeyi kula nispet etti;"], [2613.0, "bunun, onunla âhirette Allah'ın gazabından ve azabından korunduğu amellerinden olduğunu (bildirdi)— <span class=\"ayah\">﴿kopması mümkün olmayan en sağlam kulpa yapışmıştır. Allah işitendir, bilendir﴾<\/span> [Bakara 256]."]]}, {"reader": false, "ar": [[2625.0, "وقال الله عز وجل:"], [2626.8, "<span class=\"ayah\">﴿قَدْ جَاءَكُم بَصَائِرُ مِن رَّبِّكُمْ ۖ فَمَنْ أَبْصَرَ﴾<\/span> ـ أي:"], [2631.3, "سلك سبيلَ البصيرة باتّباع الأنبياء والرسل والإيمان بما جاؤوا به من الشرائع ـ <span class=\"ayah\">﴿فَلِنَفْسِهِ ۖ وَمَنْ عَمِيَ فَعَلَيْهَا﴾<\/span> <span class=\"ref\">[الأنعام: ١٠٤]<\/span> <span class=\"note\">(Şeyh «فعليه» diyor)<\/span>."], [2644.0, "فللعبد في ذلك مدخل؛"], [2646.0, "فإنّ الله نسب الإبصارَ والعمى للعبد نفسه،"], [2650.1, "وهي نسبةُ تحصيلٍ واكتسابٍ واقتراف."]], "tr": [[2625.0, "Allah Azze ve Celle şöyle buyurdu:"], [2626.8, "<span class=\"ayah\">﴿Size Rabbinizden basiretler (gerçeği gösteren deliller) geldi. Kim görürse﴾<\/span> —yani peygamberlere ve resullere uyarak ve getirdikleri şeriatlere iman ederek basiret yoluna girerse— <span class=\"ayah\">﴿kendi lehinedir; kim kör olursa kendi aleyhinedir﴾<\/span> [En'âm 104]."], [2631.3, "Kulun bunda bir payı vardır;"], [2644.0, "çünkü Allah görmeyi ve körlüğü bizzat kula nispet etmiştir;"], [2650.1, "bu da tahsil, kesb ve irtikâb nispetidir."]]}, {"reader": false, "ar": [[2653.0, "وكذلك قولُ الله عز وجل:"], [2656.4, "<span class=\"ayah\">﴿إِنَّا هَدَيْنَاهُ السَّبِيلَ إِمَّا شَاكِرًا وَإِمَّا كَفُورًا﴾<\/span> <span class=\"ref\">[الإنسان: ٣]<\/span>."], [2663.0, "وقال الله عز وجل:"], [2665.7, "<span class=\"ayah\">﴿وَهَدَيْنَاهُ النَّجْدَيْنِ﴾<\/span> <span class=\"ref\">[البلد: ١٠]<\/span>، أي: بصّرناه بطريق الحق والضلال والهدى والرشاد."], [2673.0, "وقال الله عز وجل:"], [2675.0, "<span class=\"ayah\">﴿قَدْ أَفْلَحَ مَن زَكَّاهَا﴾<\/span>،"], [2677.0, "أي: أخذ بأسباب تزكيتها،"], [2679.0, "<span class=\"ayah\">﴿وَقَدْ خَابَ مَن دَسَّاهَا﴾<\/span> <span class=\"ref\">[الشمس: ٩–١٠]<\/span>."]], "tr": [[2653.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [2656.4, "<span class=\"ayah\">﴿Şüphesiz biz ona yolu gösterdik; ister şükreden olsun ister nankör﴾<\/span> [İnsân 3]."], [2656.4, "Allah Azze ve Celle şöyle buyurdu:"], [2663.0, "<span class=\"ayah\">﴿Ona iki yolu gösterdik﴾<\/span> [Beled 10];"], [2665.7, "yani ona hak ve dalalet, hidayet ve doğruluk yolunu gösterdik."], [2665.7, "Allah Azze ve Celle şöyle buyurdu:"], [2673.0, "<span class=\"ayah\">﴿Onu (nefsini) arındıran kurtuluşa ermiştir﴾<\/span> —yani onu arındırmanın sebeplerine sarılan—
