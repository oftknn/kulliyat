<span class=\"ayah\">﴿onu (günaha) gömen de hüsrana uğramıştır﴾<\/span> [Şems 9–10]."]]}, {"reader": false, "ar": [[2683.0, "وقال الله عز وجل:"], [2685.2, "<span class=\"ayah\">﴿مَّنْ عَمِلَ صَالِحًا فَلِنَفْسِهِ ۖ وَمَنْ أَسَاءَ فَعَلَيْهَا﴾<\/span> <span class=\"ref\">[فصلت: ٤٦]<\/span>."], [2689.0, "وقال الله عز وجل:"], [2690.1, "<span class=\"ayah\">﴿إِنَّ هَٰذِهِ تَذْكِرَةٌ ۖ فَمَن شَاءَ اتَّخَذَ إِلَىٰ رَبِّهِ سَبِيلًا﴾<\/span> <span class=\"ref\">[المزمل: ١٩]<\/span>."], [2698.0, "وقال الله عز وجل:"], [2700.2, "<span class=\"ayah\">﴿وَالَّذِينَ جَاهَدُوا فِينَا﴾<\/span> ـ أي:"], [2702.4, "بفعل أسباب الصلاح ـ <span class=\"ayah\">﴿لَنَهْدِيَنَّهُمْ سُبُلَنَا﴾<\/span> <span class=\"ref\">[العنكبوت: ٦٩]<\/span>."]], "tr": [[2683.0, "Allah Azze ve Celle şöyle buyurdu:"], [2685.2, "<span class=\"ayah\">﴿Kim salih bir amel işlerse kendi lehinedir; kim kötülük yaparsa kendi aleyhinedir﴾<\/span> [Fussilet 46]."], [2689.0, "Allah Azze ve Celle şöyle buyurdu:"], [2690.1, "<span class=\"ayah\">﴿Şüphesiz bu bir öğüttür. Dileyen Rabbine bir yol tutar﴾<\/span> [Müzzemmil 19]."], [2690.1, "Allah Azze ve Celle şöyle buyurdu:"], [2700.2, "<span class=\"ayah\">﴿Bizim uğrumuzda cihad edenleri﴾<\/span> —yani salâhın sebeplerini yaparak— <span class=\"ayah\">﴿elbette yollarımıza iletiriz﴾<\/span> [Ankebût 69]."]]}]}, {"ts": "45:07", "title": "5. Külliye (devam): Kulun sebebiyle Allah'ın takdiri birlikte zikredilir", "paras": [{"reader": false, "ar": [[2707.0, "ويقول الله عز وجل:"], [2708.5, "<span class=\"ayah\">﴿وَمَن يُؤْمِن بِاللَّهِ﴾<\/span> ـ أي:"], [2710.1, "تسبُّبًا ـ <span class=\"ayah\">﴿يَهْدِ قَلْبَهُ﴾<\/span> <span class=\"ref\">[التغابن: ١١]<\/span> ـ تقديرًا وخلقًا."], [2712.0, "ويقول الله عز وجل:"], [2714.7, "<span class=\"ayah\">﴿اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ﴾<\/span> <span class=\"ref\">[الفاتحة: ٦]<\/span>، وهذا دعاءٌ بالهداية إلى هذا الصراط،"], [2722.0, "وهو سببٌ من أسباب الهداية."]], "tr": [[2707.0, "Allah Azze ve Celle şöyle buyurur:"], [2708.5, "<span class=\"ayah\">﴿Kim Allah'a iman ederse﴾<\/span> —yani sebep olma yönüyle— <span class=\"ayah\">﴿(Allah) onun kalbini hidayete erdirir﴾<\/span> [Teğâbun 11] —takdir ve yaratma yönüyle—."], [2712.0, "Allah Azze ve Celle şöyle buyurur:"], [2714.7, "<span class=\"ayah\">﴿Bizi dosdoğru yola ilet﴾<\/span> [Fâtiha 6]."], [2714.7, "Bu, bu yola hidayet için bir duadır;"], [2714.7, "o da hidayetin sebeplerinden bir sebeptir."]]}, {"reader": false, "ar": [[2724.0, "قال الله عز وجل:"], [2726.4, "<span class=\"ayah\">﴿وَالَّذِينَ اهْتَدَوْا زَادَهُمْ هُدًى وَآتَاهُمْ تَقْوَاهُمْ﴾<\/span> <span class=\"ref\">[محمد: ١٧]<\/span>،"], [2730.0, "أي: قدّر اللهُ لهم الهدايةَ وزيادةَ التقوى؛"], [2734.3, "لأنهم سلكوا السبيلَ الذي يوصل إليها."], [2738.0, "وقال الله عز وجل:"], [2740.2, "<span class=\"ayah\">﴿وَيَزِيدُ اللَّهُ الَّذِينَ اهْتَدَوْا هُدًى﴾<\/span> <span class=\"ref\">[مريم: ٧٦]<\/span>."]], "tr": [[2724.0, "Allah Azze ve Celle şöyle buyurdu:"], [2726.4, "<span class=\"ayah\">﴿Hidayete erenlere gelince, (Allah) onların hidayetini artırır ve onlara takvalarını verir﴾<\/span> [Muhammed 17]."], [2730.0, "Yani Allah onlara hidayeti ve takvanın artmasını takdir etti;"], [2734.3, "çünkü ona ulaştıran yola girdiler."], [2738.0, "Allah Azze ve Celle şöyle buyurdu:"], [2740.2, "<span class=\"ayah\">﴿Allah hidayete erenlerin hidayetini artırır﴾<\/span> [Meryem 76]."]]}, {"reader": false, "ar": [[2743.0, "ويقول الله عز وجل:"], [2745.2, "<span class=\"ayah\">﴿كَلَّا ۖ بَلْ ۜ رَانَ عَلَىٰ قُلُوبِهِم﴾<\/span> ـ أي:"], [2748.7, "تقديرًا ـ <span class=\"ayah\">﴿مَّا كَانُوا يَكْسِبُونَ﴾<\/span> <span class=\"ref\">[المطففين: ١٤]<\/span> ـ تحصيلًا واكتسابًا."], [2754.0, "وأظنّ المسألة واضحة. وقال الله عز وجل:"], [2760.3, "<span class=\"ayah\">﴿فَلَمَّا زَاغُوا﴾<\/span> ـ تحصيلًا واكتسابًا ـ <span class=\"ayah\">﴿أَزَاغَ اللَّهُ قُلُوبَهُمْ﴾<\/span> <span class=\"ref\">[الصف: ٥]<\/span> ـ تقديرًا."]], "tr": [[2743.0, "Allah Azze ve Celle şöyle buyurur:"], [2745.2, "<span class=\"ayah\">﴿Hayır! Bilakis kalplerini paslandırmıştır﴾<\/span> —yani takdir yönüyle— <span class=\"ayah\">﴿kazanmakta oldukları şey﴾<\/span> [Mutaffifîn 14] —tahsil ve kesb yönüyle—."], [2748.7, "Sanırım mesele açık. Allah Azze ve Celle şöyle buyurdu:"], [2760.3, "<span class=\"ayah\">﴿Onlar (haktan) sapınca﴾<\/span> —tahsil ve kesb yönüyle— <span class=\"ayah\">﴿Allah da kalplerini saptırdı﴾<\/span> [Saff 5] —takdir yönüyle—."]]}, {"reader": false, "ar": [[2765.0, "وقال الله عز وجل:"], [2767.8, "<span class=\"ayah\">﴿وَيَهْدِي إِلَيْهِ﴾<\/span> ـ تقديرًا ـ <span class=\"ayah\">﴿مَن يُنِيبُ﴾<\/span> <span class=\"ref\">[الشورى: ١٣]<\/span> ـ تحصيلًا واكتسابًا."], [2780.0, "وقال الله عز وجل:"], [2782.7, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ كَفَرُوا وَظَلَمُوا﴾<\/span> ـ أي:"], [2786.2, "اكتسبوا الظلمَ والكفر ـ <span class=\"ayah\">﴿لَمْ يَكُنِ اللَّهُ لِيَغْفِرَ لَهُمْ وَلَا لِيَهْدِيَهُمْ طَرِيقًا﴾<\/span> <span class=\"ref\">[النساء: ١٦٨]<\/span>."]], "tr": [[2765.0, "Allah Azze ve Celle şöyle buyurdu:"], [2767.8, "<span class=\"ayah\">﴿(Allah) kendisine yöneleni﴾<\/span> —tahsil ve kesb yönüyle— <span class=\"ayah\">﴿kendine iletir﴾<\/span> [Şûrâ 13] —takdir yönüyle—."], [2782.7, "Allah Azze ve Celle şöyle buyurdu:"], [2782.7, "<span class=\"ayah\">﴿İnkâr edip zulmedenler﴾<\/span> —yani zulmü ve küfrü kazananlar— <span class=\"ayah\">﴿Allah onları bağışlayacak ve onları bir yola iletecek değildir﴾<\/span> [Nisâ 168]."]]}, {"reader": false, "ar": [[2793.0, "ويقول الله عز وجل:"], [2795.8, "<span class=\"ayah\">﴿كَيْفَ يَهْدِي اللَّهُ قَوْمًا كَفَرُوا بَعْدَ إِيمَانِهِمْ وَشَهِدُوا أَنَّ الرَّسُولَ حَقٌّ وَجَاءَهُمُ الْبَيِّنَاتُ ۚ وَاللَّهُ لَا يَهْدِي الْقَوْمَ الظَّالِمِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ٨٦]<\/span>."], [2807.0, "ويقول الله عز وجل:"], [2808.8, "<span class=\"ayah\">﴿كَذَٰلِكَ يُضِلُّ اللَّهُ مَنْ هُوَ مُسْرِفٌ مُّرْتَابٌ﴾<\/span> <span class=\"ref\">[غافر: ٣٤]<\/span>؛"], [2812.0, "أي: بسبب ريبهم وإسرافهم في الذنوب والمعاصي أضلّهم اللهُ عز وجل."]], "tr": [[2793.0, "Allah Azze ve Celle şöyle buyurur:"], [2795.8, "<span class=\"ayah\">﴿İmanlarından ve Resûl'ün hak olduğuna şahitlik etmelerinden, kendilerine apaçık deliller geldikten sonra inkâr eden bir kavmi Allah nasıl hidayete erdirir? Allah zalimler topluluğunu hidayete erdirmez﴾<\/span> [Âl-i İmrân 86]."], [2795.8, "Allah Azze ve Celle şöyle buyurur:"], [2808.8, "<span class=\"ayah\">﴿Allah haddi aşan, şüpheci kimseyi işte böyle saptırır﴾<\/span> [Mü'min 34]."], [2808.8, "Yani şüpheleri ve günahlarda, isyanlarda haddi aşmaları sebebiyle Allah Azze ve Celle onları saptırdı."]]}, {"reader": false, "ar": [[2818.0, "وقال الله عز وجل:"], [2820.3, "<span class=\"ayah\">﴿فَبِمَا نَقْضِهِم مِّيثَاقَهُمْ لَعَنَّاهُمْ وَجَعَلْنَا قُلُوبَهُمْ قَاسِيَةً﴾<\/span> <span class=\"ref\">[المائدة: ١٣]<\/span>،"], [2824.3, "وهذه باءُ السببيّة. وعلى ذلك قولُ الله عز وجل:"], [2830.1, "<span class=\"ayah\">﴿قُلْ كُلٌّ يَعْمَلُ عَلَىٰ شَاكِلَتِهِ﴾<\/span> <span class=\"ref\">[الإسراء: ٨٤]<\/span>."]], "tr": [[2818.0, "Allah Azze ve Celle şöyle buyurdu:"], [2820.3, "<span class=\"ayah\">﴿Ahitlerini bozmaları sebebiyle onları lanetledik ve kalplerini katılaştırdık﴾<\/span> [Mâide 13]."], [2820.3, "Bu (ayetteki \"bi-mâ\"daki) bâ, sebebiyet bâsıdır."], [2824.3, "Allah Azze ve Celle'nin şu sözü de buna göredir:"], [2830.1, "<span class=\"ayah\">﴿De ki: Herkes kendi yaratılışına göre amel eder﴾<\/span> [İsrâ 84]."]]}]}, {"ts": "47:14", "title": "5. Külliye (devam): Hulâsa; Cebriyye ve Kaderiyye'nin hidayet ve dalalet hakkındaki görüşü", "paras": [{"reader": false, "ar": [[2834.0, "والخلاصة: أنّ الإنسان لا ينبغي له أن ينسب الهدايةَ إلى الله بكلّ متعلَّقاتها،"], [2843.0, "ولا الإضلالَ إلى الله بكلّ متعلَّقاته،"], [2847.0, "كما أنه لا يجوز أيضًا أن ينسب الهدايةَ والإضلالَ إلى المخلوق بكلّ متعلَّقاتها،"], [2855.0, "بل لا بدّ أن يفرّق بين متعلَّقين:"], [2858.0, "فمنها شائبةٌ ترجع إلى الله،"], [2861.6, "وهي التقديرُ والخلق، ومنها شائبةٌ ترجع إلى المخلوق، وهو التحصيلُ والاكتساب."]], "tr": [[2834.0, "Hulâsa: İnsanın hidayeti bütün taalluklarıyla Allah'a, saptırmayı da bütün taalluklarıyla Allah'a nispet etmesi uygun değildir."], [2843.0, "Hidayeti ve saptırmayı bütün taalluklarıyla mahlûka nispet etmesi de caiz değildir."], [2847.0, "Bilakis iki taalluk arasında ayrım yapması gerekir:"], [2858.0, "Bunlardan biri Allah'a dönen yöndür;"], [2861.6, "o da takdir ve yaratmadır."], [2861.6, "Diğeri mahlûka dönen yöndür; o da tahsil ve kesbdir."]]}, {"reader": false, "ar": [[2869.0, "فإن قلتَ: وما مذهب الجبرية والقدرية في مسألة الهداية والإضلال؟"], [2875.0, "فأقول: ذهب الجبريةُ إلى أنّ الهدى والضلال يُنسبان إلى الله النسبةَ المطلقة،"], [2886.0, "وأنّ العبد لا اختيارَ له لا في طلب الهداية ولا في النجاة من الضلال؛"], [2893.0, "لأنهم يسلبون العبدَ قدرتَه ومشيئتَه واختيارَه،"], [2898.0, "ولا يؤمنون إلا بإرادةٍ كونيّةٍ فقط."]], "tr": [[2869.0, "\"Cebriyye'nin ve Kaderiyye'nin hidayet ve saptırma meselesindeki mezhebi nedir?\" dersen, derim ki:"], [2875.0, "Cebriyye, hidayet ve dalaletin mutlak nispetle Allah'a nispet edildiği ve kulun ne hidayeti istemekte ne de dalaletten kurtulmakta hiçbir ihtiyarı olmadığı görüşüne gitti."], [2886.0, "Çünkü onlar kulun kudretini, meşîetini ve ihtiyarını elinden alırlar ve yalnızca kevnî iradeye iman ederler."]]}, {"reader": false, "ar": [[2902.0, "فإن قلتَ: وما مذهب القدرية النُّفاة المعتزلة في هذه الجزئية؟"], [2909.0, "فأقول: ينسبون الهدايةَ والضلالَ إلى العبد خلقًا؛"], [2915.0, "أي: أنّ العبد هو الذي يخلق الهدى فيما اهتدى به،"], [2919.0, "ويخلق الضلالَ فيما ضلّ به،"], [2921.0, "وأنّ الله لم يخلق هدايةً ولم يقدّر ضلالًا."]], "tr": [[2902.0, "\"(Kaderi) nefyeden Mu'tezilî Kaderiyye'nin bu cüz'î meseledeki mezhebi nedir?\" dersen, derim ki:"], [2909.0, "Hidayeti ve dalaleti yaratma yönüyle kula nispet ederler."], [2915.0, "Yani hidayete erdiği şeyde hidayeti yaratan, saptığı şeyde dalaleti yaratan kulun kendisidir;"], [2919.0, "Allah ne bir hidayet yaratmış ne de bir dalalet takdir etmiştir."]]}, {"reader": false, "ar": [[2926.0, "وأمّا أهلُ السنة فآمنوا بالمتعلَّقين،"], [2930.0, "وجعلوا لكلّ متعلَّقٍ طريقَه الذي يسير فيه،"], [2935.0, "على ما فصّلتُه لكم قبل قليل."], [2938.0, "وهذا من هداية الله عز وجل لنا،"], [2940.0, "والحمد لله. وقد ضلّ أممٌ ـ أممٌ أذكياء ـ في هذه الأبواب،"], [2947.0, "ولكنّ الله يُهديها إلى قلوبنا كالماء العذب الزلال البارد في الحرّ القائظ."]], "tr": [[2926.0, "Ehl-i Sünnet ise iki taalluka da iman etti ve biraz önce size tafsilatlı olarak açıkladığım gibi her taalluka içinde yürüdüğü kendi yolunu verdi."], [2935.0, "Bu, Allah Azze ve Celle'nin bize olan hidayetindendir;"], [2940.0, "hamd Allah'adır. Bu bablarda nice ümmetler —zeki ümmetler— saptı."], [2940.0, "Fakat Allah onları (bu meseleleri), kavurucu sıcakta tatlı, berrak, soğuk su gibi kalplerimize hediye eder."]]}]}, {"ts": "49:15", "title": "6. Külliye: Mahlûka izafe edilen her hidayet, delâlet ve irşad hidayetidir", "paras": [{"reader": false, "ar": [[2955.0, "ويوضّحها الكلّيّةُ السادسة: <b>كلُّ هدايةٍ مضافةٍ للمخلوق فهدايةُ دلالةٍ وإرشاد.<\/b> كلُّ هدايةٍ مضافةٍ للمخلوق فهدايةُ دلالةٍ وإرشاد."], [2972.0, "كقول الله عز وجل:"], [2975.0, "<span class=\"ayah\">﴿وَلِكُلِّ قَوْمٍ هَادٍ﴾<\/span> <span class=\"ref\">[الرعد: ٧]<\/span>، أي:"], [2979.8, "دالٌّ ومرشدٌ ومبيّنٌ وموضّح."]], "tr": [[2955.0, "Bunu altıncı külliye açıklar: 6."], [2955.0, "külliye: Mahlûka izafe edilen her hidayet, delâlet (yol gösterme) ve irşad hidayetidir. (Tekrar ediyor.) Allah Azze ve Celle'nin şu sözü gibi:"], [2972.0, "<span class=\"ayah\">﴿Her kavmin bir yol göstericisi vardır﴾<\/span> [Ra'd 7];"], [2975.0, "yani yol gösteren, irşad eden, beyan eden ve açıklayan."]]}, {"reader": false, "ar": [[2985.0, "وقولُ الله عز وجل:"], [2987.2, "<span class=\"ayah\">﴿وَإِنَّكَ لَتَهْدِي إِلَىٰ صِرَاطٍ مُّسْتَقِيمٍ﴾<\/span> <span class=\"ref\">[الشورى: ٥٢]<\/span>،"], [2990.0, "أي: تدلّ وترشد إليه."], [2993.0, "وكقوله عز وجل: <span class=\"ayah\">﴿وَجَعَلْنَا مِنْهُمْ أَئِمَّةً يَهْدُونَ بِأَمْرِنَا﴾<\/span> <span class=\"ref\">[السجدة: ٢٤]<\/span>،"], [2998.5, "أي: يدلّون ويرشدون ويبيّنون."]], "tr": [[2985.0, "Allah Azze ve Celle'nin şu sözü de:"], [2987.2, "<span class=\"ayah\">﴿Şüphesiz sen dosdoğru bir yola iletiyorsun﴾<\/span> [Şûrâ 52];"], [2987.2, "yani ona yol gösteriyor ve irşad ediyorsun."], [2993.0, "Azze ve Celle'nin şu sözü gibi:"], [2993.0, "<span class=\"ayah\">﴿Onlardan, emrimizle yol gösteren önderler kıldık﴾<\/span> [Secde 24];"], [2993.0, "yani yol gösterirler, irşad ederler ve beyan ederler."]]}, {"reader": false, "ar": [[3003.0, "وكقوله عز وجل: <span class=\"ayah\">﴿وَمِمَّنْ خَلَقْنَا أُمَّةٌ يَهْدُونَ بِالْحَقِّ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨١]<\/span>،"], [3008.4, "أي: يدلّون ويرشدون ويبيّنون الحق."], [3017.0, "وقولُ الله عز وجل:"], [3019.7, "<span class=\"ayah\">﴿وَمِن قَوْمِ مُوسَىٰ أُمَّةٌ يَهْدُونَ بِالْحَقِّ وَبِهِ يَعْدِلُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٥٩]<\/span> <span class=\"note\">(Şeyh «للحق» diyor)<\/span>، أي: يدلّون ويرشدون."]], "tr": [[3003.0, "Azze ve Celle'nin şu sözü gibi:"], [3003.0, "<span class=\"ayah\">﴿Yarattıklarımızdan hak ile yol gösteren bir ümmet vardır﴾<\/span> [A'râf 181];"], [3003.0, "yani hakka yol gösterirler, irşad ederler ve hakkı beyan ederler."], [3017.0, "Allah Azze ve Celle'nin şu sözü de:"], [3019.7, "<span class=\"ayah\">﴿Mûsâ'nın kavminden hak ile yol gösteren ve onunla adaletle hükmeden bir ümmet vardır﴾<\/span> [A'râf 159];"], [3019.7, "yani yol gösterirler ve irşad ederler."]]}, {"reader": false, "ar": [[3027.0, "وقولُ الله عز وجل:"], [3029.0, "<span class=\"ayah\">﴿وَجَعَلْنَاهُمْ أَئِمَّةً يَهْدُونَ بِأَمْرِنَا وَأَوْحَيْنَا إِلَيْهِمْ فِعْلَ الْخَيْرَاتِ﴾<\/span> <span class=\"ref\">[الأنبياء: ٧٣]<\/span>."], [3033.0, "وهكذا في كلّ هدايةٍ تُنسب إلى مخلوقٍ فإنما يريد الله بها هدايةَ الدلالة والبيان والإرشاد،"], [3042.0, "وهي واجبُ الأنبياء، وواجبُ الرسل،"], [3045.5, "وواجبُ العلماء والدعاة والمصلحين والوعّاظ،"], [3050.0, "وواجبُ كلِّ مَن تعلّم شيئًا من الدين أن يهدي غيرَه إليه ببيانه ودلالته عليه."]], "tr": [[3027.0, "Allah Azze ve Celle'nin şu sözü de:"], [3029.0, "<span class=\"ayah\">﴿Onları emrimizle yol gösteren önderler kıldık ve onlara hayırlar yapmayı vahyettik﴾<\/span> [Enbiyâ 73]."], [3029.0, "Bir mahlûka nispet edilen her hidayette durum böyledir:"], [3033.0, "Allah onunla ancak delâlet, beyan ve irşad hidayetini murad eder."], [3033.0, "Bu, peygamberlerin vazifesi, resullerin vazifesi, âlimlerin, davetçilerin, ıslahçıların ve vaizlerin vazifesidir."], [3045.5, "Dinden bir şey öğrenen herkesin vazifesi de onu açıklayarak ve ona yol göstererek başkasını ona hidayet etmesidir."]]}]}, {"ts": "50:59", "title": "7. Külliye: Mahlûktan nefyedilen her hidayet, tevfik ve ilham hidayetidir", "paras": [{"reader": false, "ar": [[3059.0, "الكلّيّة السابعة: <b>كلُّ هدايةٍ منفيّةٍ عن المخلوق<\/b> ـ لا،"], [3064.8, "هي كونيّة، نعم <span class=\"q\">؟ 51:04<\/span> ـ <b>فهدايةُ توفيقٍ وإلهام.<\/b> كلُّ هدايةٍ منفيّةٍ عن المخلوق فهدايةُ توفيقٍ وإلهام."], [3077.0, "ونعني بها هدايةَ الامتثال،"], [3080.3, "وانشراحَ القلوب للحق، والإيمانَ به،"], [3087.3, "والإقبالَ عليه، والرغبةَ فيه؛"], [3090.0, "فهذه لا يستطيعها المخلوقُ أبدًا؛"], [3094.0, "لأنها من جملة أفعال الله التي لا يقدر عليها إلا هو سبحانه."]], "tr": [[3059.0, "Yedinci külliye: <b>7. külliye: Mahlûktan nefyedilen her hidayet<\/b> —hayır, o kevnîdir, evet <span class=\"q\">؟<\/span>— <b>tevfik ve ilham hidayetidir.<\/b> Mahlûktan nefyedilen her hidayet, tevfik ve ilham hidayetidir."], [3064.8, "Bununla (emre) uyma hidayetini, kalplerin hakka açılmasını, ona iman etmeyi, ona yönelmeyi ve ona rağbet etmeyi kastediyoruz."], [3087.3, "Mahlûk buna asla güç yetiremez;"], [3090.0, "çünkü bu, Allah'ın, O'ndan —Sübhânehû— başkasının güç yetiremediği fiillerindendir."]]}, {"reader": false, "ar": [[3099.0, "وهي الهدايةُ المنفيّة في قول الله عز وجل:"], [3103.0, "<span class=\"ayah\">﴿إِنَّكَ لَا تَهْدِي﴾<\/span> ـ أي:"], [3105.9, "توفيقًا وإلهامًا ـ <span class=\"ayah\">﴿مَنْ أَحْبَبْتَ﴾<\/span> <span class=\"ref\">[القصص: ٥٦]<\/span>."], [3110.0, "وكقول الله عز وجل:"], [3112.7, "<span class=\"ayah\">﴿أَفَأَنتَ تُسْمِعُ الصُّمَّ أَوْ تَهْدِي الْعُمْيَ﴾<\/span> <span class=\"ref\">[الزخرف: ٤٠]<\/span>،"], [3116.8, "أي: توفيقًا وإلهامًا. وكقول الله عز وجل:"], [3122.4, "<span class=\"ayah\">﴿وَمَا أَنتَ بِمُسْمِعٍ مَّن فِي الْقُبُورِ﴾<\/span> <span class=\"ref\">[فاطر: ٢٢]<\/span>،"], [3126.0, "أي: لن تستطيع أن توصل لهم كلمةَ الهداية توفيقًا وإلهامًا."]], "tr": [[3099.0, "Allah Azze ve Celle'nin şu sözünde nefyedilen hidayet budur:"], [3103.0, "<span class=\"ayah\">﴿Şüphesiz sen sevdiğini﴾<\/span> —yani tevfik ve ilham yönüyle— <span class=\"ayah\">﴿hidayete erdiremezsin﴾<\/span> [Kasas 56]."], [3105.9, "Allah Azze ve Celle'nin şu sözü gibi:"], [3112.7, "<span class=\"ayah\">﴿Sağırlara sen mi duyuracaksın, yahut körleri sen mi doğru yola ileteceksin?﴾<\/span> [Zuhruf 40];"], [3116.8, "yani tevfik ve ilham yönüyle."], [3116.8, "Allah Azze ve Celle'nin şu sözü gibi:"], [3122.4, "<span class=\"ayah\">﴿Sen kabirlerdekilere duyurucu değilsin﴾<\/span> [Fâtır 22];"], [3122.4, "yani hidayet sözünü onlara tevfik ve ilham yönüyle ulaştırmaya güç yetiremezsin."]]}, {"reader": false, "ar": [[3131.0, "وقولُ الله عز وجل:"], [3133.0, "<span class=\"ayah\">﴿وَمِنْهُم مَّن يَنظُرُ إِلَيْكَ ۚ أَفَأَنتَ تَهْدِي الْعُمْيَ وَلَوْ كَانُوا لَا يُبْصِرُونَ﴾<\/span> <span class=\"ref\">[يونس: ٤٣]<\/span>،"], [3138.5, "أي: توفيقًا وإلهامًا. وقال الله عز وجل:"], [3142.4, "<span class=\"ayah\">﴿لَّيْسَ عَلَيْكَ هُدَاهُمْ﴾<\/span> ـ أي:"], [3144.8, "توفيقًا وإلهامًا ـ <span class=\"ayah\">﴿وَلَٰكِنَّ اللَّهَ يَهْدِي مَن يَشَاءُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٧٢]<\/span>."], [3149.0, "قال الله عز وجل:"], [3151.5, "<span class=\"ayah\">﴿وَمَا كُنَّا لِنَهْتَدِيَ لَوْلَا أَنْ هَدَانَا اللَّهُ﴾<\/span> <span class=\"ref\">[الأعراف: ٤٣]<\/span>، توفيقًا وإلهامًا."]], "tr": [[3131.0, "Allah Azze ve Celle'nin şu sözü de:"], [3133.0, "<span class=\"ayah\">﴿İçlerinden sana bakanlar da vardır. Görmüyorlarsa körleri sen mi doğru yola ileteceksin?﴾<\/span> [Yûnus 43];"], [3133.0, "yani tevfik ve ilham yönüyle."], [3138.5, "Allah Azze ve Celle şöyle buyurdu:"], [3142.4, "<span class=\"ayah\">﴿Onları hidayete erdirmek﴾<\/span> —yani tevfik ve ilham yönüyle— <span class=\"ayah\">﴿sana ait değildir; fakat Allah dilediğini hidayete erdirir﴾<\/span> [Bakara 272]."], [3149.0, "Allah Azze ve Celle şöyle buyurdu:"], [3151.5, "<span class=\"ayah\">﴿Allah bizi hidayete erdirmeseydi biz hidayete eremezdik﴾<\/span> [A'râf 43]; tevfik ve ilham yönüyle."]]}, {"reader": false, "ar": [[3157.0, "وقال الله عز وجل عن الكفّار:"], [3160.4, "<span class=\"ayah\">﴿وَلَا يَهْتَدُونَ سَبِيلًا﴾<\/span> <span class=\"ref\">[النساء: ٩٨]<\/span>، أي:"], [3162.6, "لا يهتدون له توفيقًا،"], [3164.9, "فهم مسلوبون؛ فالله عز وجل سلب عنهم هذه الهداية."], [3171.0, "قال الله عز وجل:"], [3172.5, "<span class=\"ayah\">﴿فَمَا رَبِحَت تِّجَارَتُهُمْ وَمَا كَانُوا مُهْتَدِينَ﴾<\/span> <span class=\"ref\">[البقرة: ١٦]<\/span>، أي: توفيقًا وإلهامًا."]], "tr": [[3157.0, "Allah Azze ve Celle kâfirler hakkında şöyle buyurdu:"], [3160.4, "<span class=\"ayah\">﴿Hiçbir yol bulamazlar﴾<\/span> [Nisâ 98];"], [3160.4, "yani ona tevfik yönüyle hidayet bulamazlar;"], [3162.6, "(bu hidayet) onlardan alınmıştır. Allah Azze ve Celle bu hidayeti onlardan almıştır."], [3171.0, "Allah Azze ve Celle şöyle buyurdu:"], [3172.5, "<span class=\"ayah\">﴿Ticaretleri kâr etmedi ve doğru yolu bulanlar olmadılar﴾<\/span> [Bakara 16];"], [3172.5, "yani tevfik ve ilham yönüyle."]]}, {"reader": false, "ar": [[3176.0, "فمتى ما رأيتَ اللهَ ينسب الهدايةَ إلى المخلوق فاعلم أنها هدايةُ الدلالة والإرشاد،"], [3182.0, "ومتى ما رأيتَ اللهَ يسلب الهدايةَ عن المخلوق فاعلم أنها هدايةُ التوفيق والإلهام."]], "tr": [[3176.0, "Allah'ın hidayeti mahlûka nispet ettiğini ne zaman görürsen, bil ki o, delâlet ve irşad hidayetidir."], [3182.0, "Allah'ın hidayeti mahlûktan nefyettiğini ne zaman görürsen, bil ki o, tevfik ve ilham hidayetidir."]]}]}, {"ts": "53:09", "title": "8. Külliye: Kur'an'da tevhide dair her delil kadere de delildir (şerhi sonraki derse kaldı)", "paras": [{"reader": false, "ar": [[3189.0, "ومن الكلّيّات أيضًا: <b>كلُّ دليلٍ في القرآن على التوحيد فهو دليلٌ على القدر.<\/b> كلُّ دليلٍ في القدر..."], [3197.8, "كلُّ دليلٍ في القرآن على التوحيد فهو دليلٌ على القدر."], [3207.0, "ولعلّنا نقف عند هذا الحدّ؛"], [3210.0, "أنا مجهِّزٌ لكم عشرًا،"], [3211.6, "لكن شوفوا الوقت أزِف،"], [3214.0, "خلاص، ساعةٌ كاملة. طيّب،"], [3216.0, "نكمل ـ إن شاء الله ـ الدرسَ القادم."], [3218.0, "والله أعلم، وصلى الله وسلم على نبيّنا محمدٍ وعلى آله وصحبه أجمعين."]], "tr": [[3189.0, "Külliyelerden biri de şudur: 8."], [3189.0, "külliye: Kur'an'da tevhide dair her delil, kadere de delildir. Kaderde her delil..."], [3189.0, "Kur'an'da tevhide dair her delil, kadere de delildir."], [3197.8, "Belki de burada duralım. Size on (külliye) hazırlamıştım;"], [3210.0, "fakat bakın, vakit daraldı, tamam, tam bir saat oldu."], [3214.0, "Peki, inşallah gelecek derste devam ederiz."], [3216.0, "Allah en iyisini bilir. Allah, Peygamberimiz Muhammed'e, âline ve ashâbının hepsine salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();

  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
