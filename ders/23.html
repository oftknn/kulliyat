<script>
const D={"no": 23, "vid": "dzWas-8CiK0", "title_ar": "الدرس (٢٣) من شرح كليات العقيدة — تتمة كليات العبادة والبدعة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 23. Ders: İbadet ve Bid'ate Dair Külliyeler (devam) — Tevkîf, İtlâk, Vasfî Bid'at, Terk, Bid'atin Dalâlet Oluşu ve Tekfir Edici Bid'atler", "sections": [{"ts": "00:00", "title": "1. Külliye: Şeriatın bütün hükümleri tevkîfe dayanır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.1, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.2, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.9, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [11.0, "أمّا بعد: فلا نزال في سياق شرح كلّيّاتٍ تتعلّق بالعبادة والبدع،"], [18.0, "وأخذنا في الدرس الأول سبعَ قواعدَ منها،"], [22.4, "أو سبعَ كلّيّاتٍ منها،"], [25.0, "ونُكمل ـ إن شاء الله ـ في هذا الدرس."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.1, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.3, "Bundan sonra: Hâlâ ibadet ve bid'atlerle ilgili külliyelerin şerhi bağlamındayız."], [18.6, "Önceki (ilk) derste bunlardan yedi kaide, yani yedi külliye gördük;"], [25.6, "bu derste —inşallah— devam ediyoruz."]]}, {"reader": false, "ar": [[30.0, "من الكلّيّات في هذا الدرس:"], [33.0, "<b>كلُّ أحكام الشرع مبناها على التوقيف.<\/b> أو بعبارةٍ أخرى:"], [46.0, "<b>كلُّ حكمٍ يُنسَب للشرع فقبولُه توقيفيٌّ على النص.<\/b> عبِّرْ عن هذه الكلّيّة بأيِّ التعبيرين فإنه صحيح:"], [57.0, "كلُّ أحكام الشرع مبناها على التوقيف،"], [60.0, "أو نقول: كلُّ حكمٍ يُنسَب للشرع فقبولُه توقيفيٌّ على النص."]], "tr": [[30.0, "Bu dersteki külliyelerden: 1. külliye:"], [33.0, "Şeriatın bütün hükümleri tevkîfe dayanır. Ya da başka bir ifadeyle:"], [46.0, "<b>Şeriata nispet edilen her hükmün kabulü nassa bağlıdır (tevkîfîdir).<\/b> Bu külliyeyi iki ifadeden hangisiyle ifade edersen doğrudur:"], [57.0, "Şeriatın bütün hükümleri tevkîfe dayanır;"], [59.0, "ya da şöyle deriz: Şeriata nispet edilen her hükmün kabulü nassa bağlıdır."]]}, {"reader": false, "ar": [[65.0, "وذلك لأنّ كلَّ شيءٍ يُنسَب إلى الشرع فلا بدّ أن نحكم عليه بأنه توقيفيّ،"], [72.8, "لا بدّ فيه من ثبوت الدليل المستجمِع لصفتين لقبوله:"], [78.0, "أن يكون صحيحًا باعتبار إسناده،"], [81.1, "صريحًا باعتبار دلالته. فمتى ما فقد الدليلُ أحدَ هذين الركنين فإنه يوصف بأنه مردود."], [89.0, "فلا يحلّ لأحدٍ من الناس أن يُثبت حكمًا شرعيًّا بدليلٍ صحيحٍ ولكن ليس بصريحٍ فيه،"], [97.0, "ولا أن يُثبت حكمًا شرعيًّا بدليلٍ صريحٍ ولكن ليس بصحيحٍ باعتبار سنده."], [106.0, "فالأحكام الشرعية توقيفيّةٌ على ثبوت الأدلة الصحيحة الصريحة."]], "tr": [[65.0, "Bu şundandır: Şeriata nispet edilen her şeyin tevkîfî olduğuna hükmetmemiz gerekir;"], [71.2, "onun kabulü için iki vasfı kendinde toplayan bir delilin sübutu şarttır:"], [78.0, "İsnadı bakımından sahih, delâleti bakımından sarih olması."], [83.0, "Delil bu iki rükünden birini kaybettiği anda merdûd (reddedilmiş) diye nitelenir."], [89.0, "Hiç kimsenin, sahih olan ama o konuda sarih olmayan bir delille şer'î bir hüküm isbat etmesi helal değildir;"], [95.9, "sarih olan ama senedi bakımından sahih olmayan bir delille şer'î bir hüküm isbat etmesi de helal değildir."], [106.0, "Şer'î hükümler, sahih ve sarih delillerin sübutuna bağlıdır."]]}, {"reader": false, "ar": [[113.0, "وهذه القاعدة من أعظم ما ينبغي فهمُه لسدِّ أبوابِ كثيرٍ من البدع،"], [121.0, "وهي تتعلّق ـ باعتبار أصلها ـ في قسمٍ من أقسام البدع يقال له:"], [129.4, "البدعة الذاتيّة الأصليّة، أو الحقيقيّة؛"], [133.0, "وهي تلك البدع التي يُنشئها المبتدع ويحكم عليها بأنها واجبة أو مستحبّة."], [140.0, "فحينئذٍ تأتيك هذه القاعدة التي تنصّ على أنّ الاستحباب والوجوب من أحكام الشرع،"], [147.0, "والأحكام الشرعية تفتقر في ثبوتها للأدلة الصحيحة الصريحة."]], "tr": [[113.0, "Bu kaide, birçok bid'atin kapısını kapatmak için anlaşılması gereken en büyük şeylerdendir."], [121.0, "Aslı itibarıyla bid'at kısımlarından \"zâtî aslî bid'at\" ya da \"hakiki bid'at\" denen kısımla ilgilidir;"], [133.0, "bu, bid'atçinin kendisinin ortaya koyduğu ve vacip ya da müstehap olduğuna hükmettiği bid'atlerdir."], [140.0, "İşte o zaman bu kaide karşına çıkar:"], [143.2, "Müstehaplık ve vaciplik şeriatın hükümlerindendir;"], [145.9, "şer'î hükümler ise sübutları için sahih ve sarih delillere muhtaçtır."]]}, {"reader": false, "ar": [[152.0, "ولذلك قال الله عز وجل:"], [154.7, "<span class=\"ayah\">﴿وَلَا تَقُولُوا لِمَا تَصِفُ أَلْسِنَتُكُمُ الْكَذِبَ هَٰذَا حَلَالٌ وَهَٰذَا حَرَامٌ لِّتَفْتَرُوا عَلَى اللَّهِ الْكَذِبَ﴾<\/span> <span class=\"ref\">[النحل: ١١٦]<\/span>."], [163.0, "فالتحليل والتحريم ليس بابُها مفتوحًا لكلِّ من هبّ ودبّ،"], [168.0, "وإنما هي توقيفيّةٌ على النص."], [170.0, "فكلُّ من أثبت تحريمًا أو حكمًا شرعيًّا بلا دليل فإنه يوصف بأنه ممّن يفتري على الله الكذب."]], "tr": [[152.0, "Bu yüzden Allah Azze ve Celle şöyle buyurmuştur:"], [154.7, "<span class=\"ayah\">﴿Dillerinizin yalan yere nitelendirdiği şeyler için \"Bu helaldir, bu haramdır\" demeyin; yoksa Allah'a yalan iftira etmiş olursunuz﴾<\/span> [Nahl 116]."], [164.7, "Helal kılma ve haram kılmanın kapısı önüne gelen herkese açık değildir;"], [170.0, "bunlar nassa bağlıdır. Delilsiz olarak bir haramlık ya da şer'î bir hüküm isbat eden herkes, Allah'a yalan iftira edenlerden biri olarak nitelenir."]]}, {"reader": false, "ar": [[179.0, "ويقول الله عز وجل منكِرًا على من حرّم شيئًا من البهائم بلا دليل:"], [184.0, "<span class=\"ayah\">﴿مَا جَعَلَ اللَّهُ مِن بَحِيرَةٍ وَلَا سَائِبَةٍ وَلَا وَصِيلَةٍ وَلَا حَامٍ ۙ وَلَٰكِنَّ الَّذِينَ كَفَرُوا يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ﴾<\/span> <span class=\"ref\">[المائدة: ١٠٣]<\/span>،"], [194.5, "أي: يُثبتون أحكامًا شرعيّةً ولا دليل عليها،"], [198.0, "وإنما هي من عند أنفسهم."], [200.0, "ويقول الله عز وجل في أعظم المحرّمات:"], [204.0, "<span class=\"ayah\">﴿وَأَن تَقُولُوا عَلَى اللَّهِ مَا لَا تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ٣٣]<\/span>."]], "tr": [[179.0, "Allah Azze ve Celle, hayvanlardan bir kısmını delilsiz olarak haram kılanları kınayarak şöyle buyurur:"], [184.0, "<span class=\"ayah\">﴿Allah ne bahîre, ne sâibe, ne vasîle ne de hâm diye bir şey koymuştur; fakat inkâr edenler Allah'a yalan iftira ediyorlar﴾<\/span> [Mâide 103];"], [195.0, "yani üzerinde hiçbir delil bulunmayan şer'î hükümler isbat ediyorlar;"], [198.4, "bunlar ancak kendi yanlarındandır. Allah Azze ve Celle haramların en büyüğü hakkında şöyle buyurur:"], [204.0, "<span class=\"ayah\">﴿…ve Allah hakkında bilmediğiniz şeyleri söylemeniz﴾<\/span> [A'râf 33]."]]}, {"reader": false, "ar": [[207.0, "ويقول الله عز وجل:"], [209.0, "<span class=\"ayah\">﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ﴾<\/span> <span class=\"ref\">[الإسراء: ٣٦]<\/span>،"], [214.0, "أي: لا يحلّ لك أن تُحِلَّ أو تُحرِّم شيئًا ليس عليه أثارةٌ من علم،"], [221.0, "وإنما ذلك إلى الله عز وجل."], [224.0, "ويقول الله عز وجل:"], [226.0, "<span class=\"ayah\">﴿قُلْ هَاتُوا بُرْهَانَكُمْ إِن كُنتُمْ صَادِقِينَ﴾<\/span> <span class=\"ref\">[البقرة: ١١١]<\/span> لمن أثبت شيئًا،"], [231.0, "وهذا في القرآن كثير."], [233.0, "فتجد أنّ الله عز وجل يردّ على من يُثبت شيئًا بهذا الطلب:"], [240.0, "<span class=\"ayah\">﴿قُلْ هَاتُوا بُرْهَانَكُمْ إِن كُنتُمْ صَادِقِينَ﴾<\/span>،"], [243.0, "ممّا يدلّ على أنّ الحكم الشرعيّ توقيفٌ على ثبوت برهانه."]], "tr": [[207.0, "Allah Azze ve Celle şöyle buyurur:"], [209.0, "<span class=\"ayah\">﴿Hakkında bilgin olmayan şeyin ardına düşme﴾<\/span> [İsrâ 36];"], [214.4, "yani üzerinde bir ilim kalıntısı bulunmayan bir şeyi helal ya da haram kılman sana helal değildir;"], [221.0, "bu ancak Allah Azze ve Celle'ye aittir."], [224.0, "Allah Azze ve Celle bir şey isbat eden kimseye şöyle buyurur:"], [228.8, "<span class=\"ayah\">﴿De ki: Eğer doğru söyleyenlerseniz delilinizi getirin﴾<\/span> [Bakara 111]."], [233.0, "Bu, Kur'an'da çoktur. Allah Azze ve Celle'nin bir şey isbat edene bu taleple cevap verdiğini görürsün:"], [240.0, "<span class=\"ayah\">﴿De ki: Eğer doğru söyleyenlerseniz delilinizi getirin﴾<\/span>."], [243.5, "Bu da şer'î hükmün, burhanının sübutuna bağlı olduğunu gösterir."]]}, {"reader": false, "ar": [[248.0, "وقال الله عز وجل:"], [250.3, "<span class=\"ayah\">﴿أَمْ لَهُمْ شُرَكَاءُ شَرَعُوا لَهُم مِّنَ الدِّينِ مَا لَمْ يَأْذَن بِهِ اللَّهُ﴾<\/span> <span class=\"ref\">[الشورى: ٢١]<\/span>،"], [255.0, "فهذا دليلٌ على أنّ ما كان منسوبًا للدين من الأحكام الشرعية فلا بدّ فيه من إذن الله الشرعيّ."], [263.0, "ويقول الله عز وجل:"], [265.0, "<span class=\"ayah\">﴿قُلْ أَرَأَيْتُم مَّا أَنزَلَ اللَّهُ لَكُم مِّن رِّزْقٍ فَجَعَلْتُم مِّنْهُ حَرَامًا وَحَلَالًا قُلْ آللَّهُ أَذِنَ لَكُمْ ۖ أَمْ عَلَى اللَّهِ تَفْتَرُونَ﴾<\/span> <span class=\"ref\">[يونس: ٥٩]<\/span>."], [277.0, "والمقصود بهذا الإذن: أي الإذن الشرعيّ؛"], [280.0, "فلا يحلّ لأحدٍ أن يُحِلَّ شيئًا أو يوجب شيئًا إلا بدليلٍ شرعيّ."]], "tr": [[248.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [250.3, "<span class=\"ayah\">﴿Yoksa onların, Allah'ın izin vermediği şeyleri dinden onlara şeriat kılan ortakları mı var?﴾<\/span> [Şûrâ 21]."], [255.5, "Bu, şer'î hükümlerden dine nispet edilen şeyde Allah'ın şer'î izninin şart olduğuna delildir."], [260.4, "Allah Azze ve Celle şöyle buyurur:"], [263.0, "<span class=\"ayah\">﴿De ki: Allah'ın size indirdiği rızıktan bir kısmını haram, bir kısmını helal kıldığınızı gördünüz mü? De ki: Buna Allah mı size izin verdi, yoksa Allah'a iftira mı ediyorsunuz?﴾<\/span> [Yûnus 59]."], [277.0, "Bu izinden maksat şer'î izindir;"], [280.0, "hiç kimsenin şer'î bir delil olmadan bir şeyi helal ya da vacip kılması helal değildir."]]}, {"reader": false, "ar": [[286.0, "وبناءً على ذلك: فالوجوب الشرعيّ توقيفٌ على دليل الشرع،"], [293.0, "والاستحباب الشرعيّ توقيفٌ على دليل الشرع،"], [299.0, "والتحريم الشرعيّ توقيفٌ على دليل الشرع،"], [303.0, "والكراهية الشرعية أيضًا توقيفيّةٌ على دليل الشرع،"], [308.0, "والإباحة الشرعية أيضًا توقيفٌ على دليل الشرع؛"], [313.0, "وهذه أحكام التكليف الخمسة."]], "tr": [[286.0, "Buna göre: Şer'î vaciplik şeriatın deliline bağlıdır;"], [288.1, "şer'î müstehaplık şeriatın deliline bağlıdır;"], [296.1, "şer'î haramlık şeriatın deliline bağlıdır;"], [304.4, "şer'î mekruhluk da şeriatın deliline bağlıdır;"], [313.0, "şer'î mubahlık da şeriatın deliline bağlıdır. Bunlar beş teklifî hükümdür."]]}]}, {"ts": "05:19", "title": "1. Külliye (devam): Vaz'î hükümler de tevkîfîdir", "paras": [{"reader": false, "ar": [[319.0, "ثم ننتقل بعدها إلى الأحكام الوضعيّة،"], [322.0, "ونقول: إنّ السببيّة الشرعية توقيفيّةٌ على الشرع،"], [327.0, "وكذلك الاشتراط الشرعيّ توقيفيٌّ على الشرع،"], [329.8, "أي على دليل الشرع،"], [334.0, "وكذلك الموانع الشرعية توقيفيّةٌ على دليل الشرع،"], [338.0, "والرخصة التي تُنسب إلى الشريعة أيضًا توقيفيّةٌ على دليل الشرع،"], [345.0, "والعزيمة توقيفيّةٌ على دليل الشرع،"], [349.0, "والحكم على الشيء بالصحّة أو البطلان أيضًا توقيفيٌّ على دليل الشرع."]], "tr": [[319.0, "Sonra bunun ardından vaz'î hükümlere geçer ve deriz ki:"], [319.5, "Şer'î sebeplik şeriata bağlıdır; aynı şekilde şer'î şart koşma da şeriata, yani şeriatın deliline bağlıdır;"], [321.5, "aynı şekilde şer'î mânialar da şeriatın deliline bağlıdır;"], [322.7, "şeriata nispet edilen ruhsat da şeriatın deliline bağlıdır;"], [331.5, "azîmet de şeriatın deliline bağlıdır;"], [339.4, "bir şeye sıhhat ya da butlan hükmü vermek de şeriatın deliline bağlıdır."]]}, {"reader": false, "ar": [[356.0, "وجميعُ ما يُنسب إلى الأحكام الشرعية ـ سواءٌ أكانت من الأحكام التكليفيّة أو الأحكام الوضعيّة ـ كلُّ ذلك لا بدّ أن نجعل عليه دائرة التوقيف،"], [370.0, "فلا يحلّ لأحدٍ أن يُثبت شيئًا من ذلك إلا وعلى ذلك الإثبات دليلٌ من الشرع."], [377.0, "وهذه القاعدة تسدّ عنّا أبوابًا كثيرةً من البدع؛"], [382.0, "لأنّ حقيقة الابتداع هو اختراعُ وجوبٍ لا دليل عليه،"], [387.8, "أو استحبابٍ لا دليل عليه."]], "tr": [[356.0, "Şer'î hükümlere nispet edilen her şeyin —ister teklifî hükümlerden ister vaz'î hükümlerden olsun— hepsinin üzerine tevkîf dairesini çizmemiz gerekir."], [368.7, "Hiç kimsenin, bu isbat üzerinde şeriattan bir delil bulunmadıkça bunlardan herhangi bir şeyi isbat etmesi helal değildir."], [377.0, "Bu kaide bizden birçok bid'at kapısını kapatır;"], [380.1, "çünkü ibtidâın (bid'at çıkarmanın) hakikati, üzerinde delil olmayan bir vaciplik ya da üzerinde delil olmayan bir müstehaplık icat etmektir."]]}]}, {"ts": "06:31", "title": "2. Külliye: Bütün taabbudlar, delil olmadıkça mutlaklık aslı üzeredir", "paras": [{"reader": false, "ar": [[391.0, "ويوضّح ذلك الكلّيّةُ التي بعدها،"], [394.6, "وهي الكلّيّة الثانية: <b>كلُّ التعبُّدات على أصل الإطلاق إلا بدليل.<\/b> كلُّ التعبُّدات على أصل الإطلاق إلا بدليل."], [410.0, "بمعنى أنه لا يحلّ لأحدٍ أن يأتي إلى تعبُّدٍ شرعيٍّ ثم يقيّده بشيءٍ من القيود إلا وعلى ذلك التقييد دليلٌ من الشرع؛"], [430.0, "لأنه مخالفٌ للأصل فيها وهو الإطلاق،"], [436.0, "والمتقرِّر في القواعد أنّ الدليل يُطلَب من الناقل عن الأصل لا من الثابت عليه."]], "tr": [[391.0, "Bunu, ondan sonraki külliye açıklar;"], [393.9, "o da 2. külliyedir: 2."], [398.0, "külliye: Bütün taabbudlar, delil olmadıkça mutlaklık aslı üzeredir. Bütün taabbudlar, delil olmadıkça mutlaklık aslı üzeredir."], [410.0, "Yani hiç kimsenin şer'î bir taabbuda gelip, o takyid üzerinde şeriattan bir delil olmadıkça onu herhangi bir kayıtla kayıtlaması helal değildir;"], [430.0, "çünkü bu, onlardaki asla, yani mutlaklığa aykırıdır."], [436.6, "Kaidelerde sabit olan şudur: Delil, asıldan ayrılandan istenir, asıl üzerinde sabit kalandan istenmez."]]}, {"reader": false, "ar": [[444.0, "فكلُّ من زعم أنّ هذا التعبُّد مربوطٌ بهذا الشيء فإنه يخالف فيه الإطلاق،"], [454.0, "فقبولُ هذا الزعم مبنيٌّ على ثبوت الدليل بذلك؛"], [458.0, "فإن جاءنا به صحيحًا صريحًا فعلى العين والرأس،"], [462.0, "وإلا فإنّنا نعتذر عن قبول تقييدٍ لا دليل عليه."], [467.0, "فإن قلتَ: وماذا تقصد بقولك «الإطلاق»؟"], [472.0, "أيَّ إطلاقٍ تعني؟ فأقول:"], [475.6, "أعني بها أنّ كلَّ تعبُّدٍ فمطلقٌ عن الزمانيّة،"], [480.0, "فكلُّ من قيّد تعبُّدًا بزمانيّةٍ معيّنة فهو مطالَبٌ بالدليل الدالّ على هذا التقييد."]], "tr": [[444.0, "Bu taabbudun şu şeye bağlı olduğunu iddia eden herkes, bunda mutlaklığa muhalefet etmiş olur;"], [454.0, "bu iddianın kabulü, buna dair delilin sübutuna bağlıdır."], [458.0, "Eğer onu bize sahih ve sarih olarak getirirse başımız gözümüz üstüne;"], [462.0, "aksi hâlde üzerinde delil olmayan bir takyidi kabul etmekten özür dileriz."], [467.0, "Eğer \"Mutlaklık derken neyi kastediyorsun, hangi mutlaklığı kastediyorsun?\" dersen, derim ki:"], [475.0, "Bununla, her taabbudun zaman bakımından mutlak olduğunu kastediyorum;"], [479.4, "bir taabbudu belirli bir zamanla kayıtlayan herkesten, bu takyide delâlet eden delil istenir."]]}, {"reader": false, "ar": [[488.0, "والتعبُّدات كذلك مطلقةٌ عن الهيئة والصفة،"], [494.0, "فكلُّ من ربط تعبُّدًا بصفةٍ أو هيئةٍ معيّنة فإنه مطالَبٌ بالدليل الدالّ على هذا التقييد."], [503.0, "وكذلك نقول: الأصل في التعبُّدات الإطلاقُ عن المكان،"], [509.0, "فكلُّ من اعتقد فضيلةَ تعبُّدٍ في مكانٍ معيّن فإنه مطالَبٌ بالدليل الدالّ على هذا التقييد؛ لأنه مخالفٌ للأصل."]], "tr": [[488.0, "Taabbudlar aynı şekilde heyet ve sıfat bakımından da mutlaktır;"], [494.6, "bir taabbudu belirli bir sıfata ya da heyete bağlayan herkesten, bu takyide delâlet eden delil istenir."], [503.0, "Aynı şekilde deriz ki: Taabbudlarda asıl, mekân bakımından mutlaklıktır;"], [509.0, "bir taabbudun belirli bir mekânda fazileti olduğuna inanan herkesten, bu takyide delâlet eden delil istenir; çünkü bu, asla aykırıdır."]]}, {"reader": false, "ar": [[521.0, "وكذلك نقول: إنّ الأصل في التعبُّدات الإطلاقُ عن المقدار،"], [527.0, "أي العدد؛ فكلُّ من قيّد فضيلةَ تعبُّدٍ بعدديّةٍ أو مقدارٍ معيّن فإنه مطالَبٌ بالدليل الدالّ على صحّة هذا القيد."], [540.0, "وكذلك نقول: إنّ الأصل في التعبُّدات الإطلاقُ عن الشروط،"], [546.0, "فكلُّ من قيّد تعبُّدًا بشرطٍ معيّن فإنه مطالَبٌ بالدليل الدالّ على صحّة هذا الاشتراط."]], "tr": [[521.0, "Aynı şekilde deriz ki: Taabbudlarda asıl, miktar, yani sayı bakımından mutlaklıktır;"], [528.0, "bir taabbudun faziletini belirli bir sayıya ya da miktara bağlayan herkesten, bu kaydın sıhhatine delâlet eden delil istenir."], [540.0, "Aynı şekilde deriz ki: Taabbudlarda asıl, şartlar bakımından mutlaklıktır;"], [545.3, "bir taabbudu belirli bir şartla kayıtlayan herkesten, bu şart koşmanın sıhhatine delâlet eden delil istenir."]]}, {"reader": false, "ar": [[554.0, "وكذلك نقول: إنّ الأصل في التعبُّدات الإطلاقُ عن السببيّة،"], [560.0, "فكلُّ من ربط تعبُّدًا بسببيّةٍ معيّنة فهو مطالَبٌ بالدليل الدالّ على هذا القيد؛"], [570.0, "وإلا فلا حقَّ لأحدٍ أبدًا أن يربط تعبُّدًا بأيِّ شيءٍ إلا وعلى ذلك دليلٌ من الشرع."], [582.0, "وهذا يتكلّم عن النوع الآخر من البدعة،"], [586.9, "وهي البدعة الوصفيّة الإضافيّة،"], [588.6, "والتي ستأتي قاعدتُها ـ أو كلّيّتُها ـ بعد قليلٍ إن شاء الله؛"], [593.0, "وهي أن يعمد المبتدع إلى شيءٍ من التعبُّدات فيقيّده بأوصافٍ لا دليل عليها،"], [601.4, "أو زمانٍ لا دليل عليه، إلى آخر ذلك."]], "tr": [[554.0, "Aynı şekilde deriz ki: Taabbudlarda asıl, sebeplik bakımından mutlaklıktır;"], [560.0, "bir taabbudu belirli bir sebebe bağlayan herkesten, bu kayda delâlet eden delil istenir."], [570.0, "Aksi hâlde, üzerinde şeriattan bir delil olmadıkça hiç kimsenin bir taabbudu herhangi bir şeye bağlamaya asla hakkı yoktur."], [582.0, "Bu, bid'atin diğer türünden, yani vasfî izâfî bid'atten bahsetmektedir;"], [588.6, "onun kaidesi —ya da külliyesi— inşallah birazdan gelecek."], [593.0, "O da bid'atçinin taabbudlardan birine yönelip onu üzerinde delil olmayan vasıflarla ya da üzerinde delil olmayan bir zamanla vb. kayıtlamasıdır."]]}, {"reader": false, "ar": [[607.0, "فالأصل في هذا التقييد المنعُ عند أهل السنة والجماعة،"], [612.0, "إلا إذا جاء من ادّعاه بدليلٍ يجمع بين وصفَي الصحّة والصراحة؛"], [619.0, "فحينئذٍ يكون قولُه مقبولًا، وتقييدُه مقبولًا."]], "tr": [[607.0, "Ehl-i Sünnet ve'l-Cemaat'e göre bu takyidde asıl, yasaklıktır;"], [610.3, "ancak onu iddia eden kişi sıhhat ve sarahat vasıflarını birleştiren bir delil getirirse, o zaman sözü de makbul olur, takyidi de makbul olur."]]}]}, {"ts": "10:25", "title": "3. Külliye: Şer'î bir asla giren her bid'î vasıf onun men edilmesini gerektirir", "paras": [{"reader": false, "ar": [[625.0, "ويوضّح ذلك الكلّيّةُ الثالثة:"], [629.0, "<b>كلُّ وصفٍ بدعيٍّ دخل على أصلٍ شرعيٍّ فموجِبٌ لمنعه.<\/b> كلُّ وصفٍ بدعيٍّ دخل على أصلٍ شرعيٍّ فموجِبٌ لمنعه."], [650.0, "أُعيدها مرّةً ثالثة: كلُّ وصفٍ بدعيٍّ دخل على أصلٍ شرعيٍّ فموجِبٌ لمنعه."]], "tr": [[625.0, "Bunu 3. külliye açıklar: 3."], [629.0, "külliye: Şer'î bir asla giren her bid'î vasıf, onun men edilmesini gerektirir. Şer'î bir asla giren her bid'î vasıf, onun men edilmesini gerektirir."], [650.0, "Üçüncü kez tekrar ediyorum: Şer'î bir asla giren her bid'î vasıf, onun men edilmesini gerektirir."]]}, {"reader": false, "ar": [[662.0, "وهي الكلّيّة التي تتكلّم عن البدع الإضافيّة الوصفيّة؛"], [668.0, "وهي أن يعمد المبتدع إلى بعض الأصول الشرعية الثابتة بالدليل الصحيح ويضيف إليها زمانًا لا دليل عليه،"], [679.0, "فيكون الأصل المشروع ممنوعًا باعتبار هذه الإضافة؛"], [685.0, "بمعنى أنه متى ما فُصِل الأصلُ عمّا أُضيف إليه عاد إلى كونه مشروعًا،"], [693.0, "لكنّنا نمنعه ما دام مقرونًا بهذا الزمان أو الوصف البدعيّ."]], "tr": [[662.0, "Bu, izâfî vasfî bid'atlerden bahseden külliyedir."], [668.0, "Bu da bid'atçinin sahih delille sabit olan bazı şer'î asıllara yönelip onlara üzerinde delil olmayan bir zaman eklemesidir;"], [678.3, "böylece meşru asıl, bu ekleme itibarıyla yasak olur."], [685.0, "Yani asıl, kendisine eklenen şeyden ayrıldığı anda yeniden meşru olur;"], [691.2, "fakat bu zamanla ya da bid'î vasıfla birlikte olduğu sürece onu men ederiz."]]}, {"reader": false, "ar": [[698.0, "وبعضهم يأتي إلى تعبُّدٍ معيّن فيقيّده بمكانيّةٍ معيّنة،"], [707.0, "فيكون الأصل الشرعيّ ممنوعًا ما دام مقرونًا بهذه المكانيّة المحدَثة،"], [713.0, "فمتى ما فُصِل الأصلُ الشرعيُّ عن تلك المكانيّة فإنه يرجع إلى كونه مشروعًا."], [721.0, "وكذلك بعض أهل البدع يأتي إلى أصلٍ شرعيٍّ ويُلبسه صفةً لا دليل عليها،"], [730.0, "فيكون ذلك الأصل الشرعيّ ممنوعًا ما دام بهذا اللَّبوس البدعيّ،"], [736.0, "فمتى ما أبطلنا هذا الوصف البدعيّ رجع الأصل الشرعيّ إلى ما كان عليه من المشروعيّة."]], "tr": [[698.0, "Bazıları belirli bir taabbuda gelip onu belirli bir mekânla kayıtlar;"], [707.6, "o zaman şer'î asıl, bu sonradan çıkarılmış mekânla birlikte olduğu sürece yasak olur;"], [714.8, "şer'î asıl o mekândan ayrıldığı anda yeniden meşru hâle döner."], [721.0, "Aynı şekilde bid'at ehlinden bazıları şer'î bir asla gelip ona üzerinde delil olmayan bir sıfat giydirir;"], [731.2, "o şer'î asıl bu bid'î kılıkta olduğu sürece yasak olur;"], [737.5, "bu bid'î vasfı iptal ettiğimiz anda şer'î asıl, üzerinde bulunduğu meşruiyete geri döner."]]}, {"reader": false, "ar": [[744.0, "وبعضهم يُضفي على الأصل الشرعيّ مقدارًا معيّنًا أو عدديّةً معيّنة،"], [755.0, "فيقول: هذا العدد يُستحبّ في هذا الذكر،"], [762.0, "أو: اذكر اللهَ عز وجل بهذا المقدار؛"], [766.0, "فنحن نمنع ذلك الأصلَ الشرعيَّ ما دام ذلك الوصف البدعيّ مقترنًا به،"], [772.0, "فمتى ما فُكَّ عنه عاد إلى كونه مشروعًا."], [778.0, "وهي القاعدة التي نقول فيها:"], [781.4, "مشروعيّةُ الشيء بأصله لا تستلزم مشروعيّتَه بوصفه؛"], [788.0, "فليس كلُّ أصلٍ مشروعٍ يكون مشروعًا إذا أُدخل عليه ما ليس بمشروع."], [799.0, "فنحن نمنع ذلك الأصلَ المشروعَ ما دام ذلك الوصف البدعيّ مقترنًا به."]], "tr": [[744.0, "Bazıları şer'î asla belirli bir miktar ya da belirli bir sayı ekler ve \"Bu zikirde şu sayı müstehaptır\" ya da \"Allah Azze ve Celle'yi şu miktarda zikret\" der."], [766.0, "Bu bid'î vasıf ona bitişik olduğu sürece o şer'î aslı men ederiz;"], [772.7, "ondan çözüldüğü anda yeniden meşru olur."], [778.0, "Bu, hakkında şöyle dediğimiz kaidedir:"], [781.4, "Bir şeyin aslı itibarıyla meşru olması, vasfı itibarıyla meşru olmasını gerektirmez."], [788.0, "Meşru olan her asıl, içine meşru olmayan bir şey sokulduğunda meşru kalmaz."], [799.0, "Bu bid'î vasıf ona bitişik olduğu sürece o meşru aslı men ederiz."]]}, {"reader": false, "ar": [[814.0, "وعلى ذلك فالأذكار الجماعيّة ممنوعةٌ لأنها جماعيّة،"], [818.9, "لا لأنها أذكار. وقراءة الفاتحة على روح الأموات ممنوعةٌ لأنها قُيّدت بهذا الوصف المعيّن،"], [831.0, "لا على أنها فاتحة الكتاب؛"], [834.5, "بل وافتتاحُ الخطوبة بقراءتها ممنوعٌ لمّا قُرنت بهذا الوصف المعيّن،"], [843.0, "لا على أنها فاتحة."], [846.0, "وكذلك الأذكار التي يتراقص الذاكرون فيها ويُطرِّبونها ويهتزّون عليها أو يضربون الدفوف؛"], [861.0, "فما دام الذكر قد لُبِّس بهذه الصفة فإنّنا نمنعه،"], [864.9, "لا على أنه من الأذكار،"], [867.0, "وإنما لأنه لُبِّس بهذا اللَّبوس البدعيّ الممنوع."]], "tr": [[814.0, "Buna göre toplu zikirler, zikir oldukları için değil, toplu oldukları için yasaktır."], [823.0, "Fâtiha'yı ölülerin ruhuna okumak da Fâtihatü'l-Kitâb olduğu için değil, bu belirli vasıfla kayıtlandığı için yasaktır."], [833.1, "Hatta nişanı (hıtbeyi) Fâtiha okuyarak açmak da Fâtiha olduğu için değil, bu belirli vasıfla birleştirildiği için yasaktır."], [846.0, "Aynı şekilde zikredenlerin içinde raks ettikleri, nağmeyle okudukları, üzerinde sallandıkları ya da def çaldıkları zikirler de böyledir:"], [862.7, "Zikre bu sıfat giydirildiği sürece onu zikirlerden olduğu için değil, bu yasak bid'î kılığa büründürüldüğü için men ederiz."]]}, {"reader": false, "ar": [[874.0, "ولا حقَّ لصاحب الوصف البدعيّ أن يستدلّ عليه بدليل الأصل الشرعيّ؛"], [884.0, "فإنّ دليلَ الأصلِ للأصل،"], [889.0, "ويبقى الوصفُ شيئًا زائدًا يحتاج إلى دليلٍ خاصّ؛"], [894.0, "كما نقول في قاعدتنا الفقهيّة:"], [899.0, "كلُّ نجسٍ حرامٌ، وليس كلُّ حرامٍ نجسًا."], [905.0, "فلا يجوز لنا أن نستدلّ على النجاسة بالدليل الذي يدلّ على التحريم؛"], [911.0, "فإنّ دليل التحريم يُستفاد منه التحريم،"], [916.0, "ولكن لا يتكلّم عن طهارة الشيء المحرَّم ولا عن نجاسته."], [920.0, "فإذا كنتَ تريد أن تُثبت نجاسته فلا بدّ أن تأتي بدليلٍ زائدٍ على دليل الأصل؛"], [928.0, "فدليلُ الأصلِ للأصل، ويبقى النجاسةُ وصفًا زائدًا يحتاج إلى دليلٍ خاصّ."]], "tr": [[874.0, "Bid'î vasfın sahibinin, ona şer'î aslın deliliyle istidlal etmeye hakkı yoktur."], [884.0, "Çünkü aslın delili asıl içindir;"], [886.5, "vasıf ise özel bir delile muhtaç, ilave bir şey olarak kalır."], [894.0, "Tıpkı fıkhî kaidemizde dediğimiz gibi:"], [899.0, "Her necis haramdır, fakat her haram necis değildir."], [905.0, "Haramlığa delâlet eden delille necasete istidlal etmemiz caiz değildir;"], [911.0, "çünkü haramlık delilinden haramlık çıkarılır, fakat o delil haram kılınan şeyin temizliğinden de necasetinden de bahsetmez."], [920.0, "Eğer onun necasetini isbat etmek istiyorsan, aslın deliline ilave bir delil getirmen gerekir."], [926.4, "Aslın delili asıl içindir; necaset ise özel bir delile muhtaç, ilave bir vasıf olarak kalır."]]}, {"reader": false, "ar": [[935.0, "وذلك لأنّنا إذا أنكرنا عليهم الأذكار الجماعيّة استدلّوا علينا بالأدلة التي تدلّ على مشروعيّة أصل الذكر،"], [948.0, "فنقول لهم: إنّ دليلَ الأصلِ للأصل،"], [953.0, "ويبقى الوصفُ شيئًا زائدًا يحتاج إلى دليلٍ خاصّ."], [956.0, "وأظنّ الكلام واضح. وهذه الكلّيّة تردّ على أكثر البدع المنتشرة في العالم الإسلاميّ والعربيّ؛"], [965.0, "فإنّ انتشار البدع الوصفيّة الإضافيّة أكثرُ من انتشار البدع الذاتيّة الحقيقيّة؛"], [974.0, "إذ الذاتيّة الحقيقيّة مفضوحة،"], [976.7, "إذ لا يدلّ على مشروعيّتها لا أصلٌ ولا وصف،"], [983.0, "فهي ممنوعةٌ باعتبار أصلها وباعتبار أوصافها."]], "tr": [[935.0, "Bu şundandır: Onlara toplu zikirleri inkâr ettiğimizde, zikrin aslının meşruiyetine delâlet eden delillerle bize karşı istidlal ederler."], [945.3, "Biz de onlara deriz ki:"], [949.5, "Aslın delili asıl içindir; vasıf ise özel bir delile muhtaç, ilave bir şey olarak kalır."], [956.0, "Sanırım söz açıktır. Bu külliye, İslâm ve Arap dünyasında yaygın olan bid'atlerin çoğuna cevap verir;"], [965.0, "çünkü vasfî izâfî bid'atlerin yaygınlığı, zâtî hakiki bid'atlerin yaygınlığından fazladır."], [969.1, "Zâtî hakiki bid'at rezil olmuştur (açıkça bellidir);"], [974.0, "çünkü onun meşruiyetine ne bir asıl ne de bir vasıf delâlet eder;"], [980.8, "o hem aslı itibarıyla hem de vasıfları itibarıyla yasaktır."]]}, {"reader": false, "ar": [[988.0, "ولكنّ الشبهة تدخل على كثيرٍ من المسلمين في البدع الإضافيّة؛"], [995.0, "لأنّ المبتدع يُلبِّس على المسلمين بدليل الأصل،"], [1002.0, "ليستدلّ به على مشروعيّة الوصف البدعيّ الدخيل على هذا الأصل الشرعيّ."], [1010.0, "وأظنّ الكلام واضح. فإذا جاءك مبتدعٌ ببدعةٍ أصليّة فقل له:"], [1017.3, "إنّ الأحكام الشرعية تفتقر في ثبوتها للأدلة الصحيحة الصريحة؛"], [1023.0, "وإذا جاءك ببدعةٍ وصفيّةٍ إضافيّة فقل له:"], [1028.4, "بأنّ مشروعيّةَ الشيء بأصله لا تستلزم مشروعيّتَه بوصفه."]], "tr": [[988.0, "Fakat müslümanların birçoğuna şüphe izâfî bid'atlerde girer;"], [995.0, "çünkü bid'atçi, bu şer'î asla sonradan sokulmuş bid'î vasfın meşruiyetine istidlal etmek için aslın delilini kullanarak müslümanların kafasını karıştırır."], [1010.0, "Sanırım söz açıktır. Sana bir bid'atçi aslî bir bid'atle gelirse ona de ki:"], [1017.3, "Şer'î hükümler sübutları için sahih ve sarih delillere muhtaçtır."], [1023.0, "Sana vasfî izâfî bir bid'atle gelirse ona de ki:"], [1028.4, "Bir şeyin aslı itibarıyla meşru olması, vasfı itibarıyla meşru olmasını gerektirmez."]]}]}, {"ts": "17:14", "title": "4. Külliye: Sebebi Nebî ﷺ döneminde mevcut olduğu hâlde yapmadığı her taabbudî işte meşru olan terktir", "paras": [{"reader": false, "ar": [[1034.0, "ويوضّح ذلك الكلّيّةُ الثالثة ـ أو الرابعة ـ الرابعة:"], [1042.0, "<b>كلُّ أمرٍ تعبُّديٍّ توفَّر سببُه على عهد النبي صلى الله عليه وسلم ولم يفعله فالمشروعُ تركُه.<\/b> كلُّ أمرٍ تعبُّديٍّ توفَّر سببُه على عهد النبي صلى الله عليه وسلم ولم يفعله فإنّ المشروعَ تركُه."], [1070.0, "أُعيدها مرّةً ثالثة: كلُّ أمرٍ تعبُّديٍّ توفَّر سببُه على عهد النبي صلى الله عليه وسلم ولم يفعله فالمشروعُ تركُه."]], "tr": [[1034.0, "Bunu 3. —ya da 4.— 4."], [1039.1, "külliye açıklar: <b>4. külliye: Sebebi Nebî ﷺ döneminde mevcut olduğu hâlde onun yapmadığı her taabbudî işte meşru olan, onu terk etmektir.<\/b> Sebebi Nebî ﷺ döneminde mevcut olduğu hâlde onun yapmadığı her taabbudî işte meşru olan, onu terk etmektir."], [1070.0, "Üçüncü kez tekrar ediyorum: Sebebi Nebî ﷺ döneminde mevcut olduğu hâlde onun yapmadığı her taabbudî işte meşru olan, onu terk etmektir."]]}, {"reader": false, "ar": [[1082.0, "أقول وبالله التوفيق: وذلك لأنّنا متّفقون على أنّ النبي صلى الله عليه وسلم قد بلّغ البلاغ المبين،"], [1092.0, "وأنّ الله قد أتمّ به النعمة والدين؛"], [1094.0, "فما لم يكن من الدين على عهده صلى الله عليه وسلم فلا يمكن أبدًا أن يكون من الدين بعد عهده."], [1103.0, "وكلُّ من زعم بأنّ شيئًا من الدين لا يزال خفيًّا فإنه يتّهم رسولَ الله صلى الله عليه وسلم بعدم البلاغ المبين،"], [1114.0, "ويتّهمه بالخيانة في التبليغ،"], [1117.0, "وهذا قبيحٌ كلَّ القبح،"], [1120.0, "بل يوصل صاحبه إلى الكفر والردّة إذا كان لم تَعرِض له شبهةٌ معيّنة."]], "tr": [[1082.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [1086.5, "Nebî ﷺ'in apaçık bir tebliğle tebliğ ettiği ve Allah'ın onunla nimeti ve dini tamamladığı konusunda ittifak hâlindeyiz."], [1094.0, "Onun ﷺ döneminde dinden olmayan bir şeyin, onun döneminden sonra dinden olması asla mümkün değildir."], [1103.0, "Dinden bir şeyin hâlâ gizli kaldığını iddia eden herkes, Resûlullah ﷺ'i apaçık tebliğ etmemekle itham etmiş ve onu tebliğde hıyanetle suçlamış olur."], [1116.2, "Bu son derece çirkindir; hatta kendisine belirli bir şüphe arız olmamışsa sahibini küfre ve irtidada götürür."]]}, {"reader": false, "ar": [[1127.0, "فإنّ الأدلة قد دلّت على أنّ الله عز وجل ـ فإنّ الأدلة قد دلّت على أنّ النبي صلى الله عليه وسلم قد بلّغ كلَّ الشرع،"], [1137.0, "حتى قال الله عز وجل:"], [1139.8, "<span class=\"ayah\">﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا﴾<\/span> <span class=\"ref\">[المائدة: ٣]<\/span>،"], [1146.0, "وقد نزلت في يوم عرفة يومَ جمعة،"], [1150.8, "أي في عيدين للمسلمين،"], [1154.0, "كما في الصحيح من حديث ابن عباس وغيره."]], "tr": [[1127.0, "Çünkü deliller, Allah Azze ve Celle'nin —(düzeltiyor:) çünkü deliller, Nebî ﷺ'in şeriatın tamamını tebliğ ettiğine delâlet etmiştir."], [1135.4, "Hatta Allah Azze ve Celle şöyle buyurmuştur:"], [1139.8, "<span class=\"ayah\">﴿Bugün sizin için dininizi kemâle erdirdim, üzerinize nimetimi tamamladım ve sizin için din olarak İslâm'dan razı oldum﴾<\/span> [Mâide 3]."], [1148.1, "Bu ayet Arefe günü, bir cuma günü, yani müslümanların iki bayramında inmiştir;"], [1154.4, "Sahîh'te İbn Abbâs'ın ve başkalarının hadisinde olduğu gibi."]]}, {"reader": false, "ar": [[1157.0, "فالنبيُّ ـ فالله عز وجل قد وصف الدين بالكمال،"], [1163.0, "ووصف النعمة بالتمام، وسرُّ الفرقان بينهما:"], [1169.0, "أنّ ما وُصف بالكماليّة فلا يكون ثَمّة أكملُ منه،"], [1174.0, "وما وُصف بالتمام فيكون هناك أتمُّ منه."], [1180.0, "فبما أنّ الدين قد وصفه الله بالكماليّة،"], [1185.0, "فيُراد بها الكماليّة المطلقة في كلّ أصوله وفروعه،"], [1188.9, "وأدلّته وأحكامه، وجزئيّاته وكلّيّاته؛"], [1195.0, "فلم يبقَ شيءٌ يُنسب للشرع إلا وقد بيّنه النبي صلى الله عليه وسلم بأتمِّ بيانٍ وأبلغِ توضيحٍ وأفصحِ عبارة."]], "tr": [[1157.0, "Nebî —(düzeltiyor:) Allah Azze ve Celle dini kemâlle, nimeti ise tamamlıkla nitelemiştir."], [1169.0, "İkisi arasındaki farkın sırrı şudur:"], [1171.2, "Kemâlle nitelenen şeyden daha kâmili olmaz;"], [1174.0, "tamamlıkla nitelenen şeyin ise daha tamamı olabilir."], [1180.0, "Allah dini kemâlle nitelediğine göre, bununla dinin bütün usûlünde ve fürûunda, delillerinde ve hükümlerinde, cüz'iyyâtında ve külliyyâtında mutlak kemâl kastedilir."], [1195.0, "Şeriata nispet edilen hiçbir şey kalmamıştır ki Nebî ﷺ onu en tam beyanla, en beliğ açıklamayla ve en fasih ifadeyle açıklamış olmasın."]]}, {"reader": false, "ar": [[1208.0, "فلا يحلّ لأحدٍ أبدًا أن يزعم أنّ ثَمّة شيئًا من التعبُّدات لا يزال يحتاج إلى بيانٍ باعتبار أصله،"], [1218.0, "وإن كان أهل العلم يختلفون في جزئيّاتٍ من التعبُّد،"], [1221.0, "إلا أنّ أصول الدين العامّة قد بُيّنت ووُضّحت بأتمِّ بيان."], [1228.0, "وعلى ذلك أيضًا قولُ النبي صلى الله عليه وسلم في المحفل الأكبر،"], [1234.0, "في الاجتماع الأكبر: «ألا هل بلّغت؟» قالوا:"], [1238.4, "نعم، قال: «اللهمّ فاشهد»."]], "tr": [[1208.0, "Hiç kimsenin, taabbudlardan bir şeyin aslı itibarıyla hâlâ beyana muhtaç olduğunu iddia etmesi asla helal değildir."], [1217.3, "Âlimler taabbudun bazı cüz'î meselelerinde ihtilaf etseler de dinin genel usûlü en tam beyanla açıklanmış ve netleştirilmiştir."], [1228.0, "Nebî ﷺ'in en büyük toplantıda, en büyük cemiyette söylediği şu söz de buna delildir:"], [1236.0, "\"Dikkat edin, tebliğ ettim mi?\" \"Evet\" dediler. \"Allah'ım, şahit ol!\" buyurdu."]]}, {"reader": false, "ar": [[1240.0, "ويقول النبي صلى الله عليه وسلم فيما رواه الإمام مسلم:"], [1244.0, "«ما بعث اللهُ نبيًّا إلا كان حقًّا عليه أن يدلَّ أمّته على خير ما يعلمه لهم، ويُنذرَهم عن شرّ ما يعلمه لهم»."], [1259.0, "ويقول أبو ذرٍّ رضي الله عنه:"], [1262.4, "«ما تُوفّي رسول الله صلى الله عليه وسلم وطائرٌ يقلّب جناحيه في السماء إلا ذكر لنا منه علمًا»."], [1274.0, "ويقول النبي صلى الله عليه وسلم:"], [1277.3, "«لقد تركتكم على المحجّة البيضاء، ليلُها كنهارها، لا يزيغ عنها بعدي إلا هالك»،"], [1285.0, "أخرجه الإمام أحمد بإسنادٍ حسن."]], "tr": [[1240.0, "İmam Müslim'in rivayet ettiği hadiste Nebî ﷺ şöyle buyurur:"], [1244.0, "\"Allah hiçbir peygamber göndermemiştir ki, ümmetine onlar için bildiği hayrın en hayırlısını göstermek ve onları onlar için bildiği şerrin en kötüsünden sakındırmak onun üzerine bir hak olmasın.\" Ebû Zer —Allah ondan razı olsun— şöyle der:"], [1262.4, "\"Resûlullah ﷺ, gökte kanat çırpan bir kuş hakkında bile bize bir ilim zikretmiş olarak vefat etti.\" Nebî ﷺ şöyle buyurur:"], [1274.0, "\"Andolsun, sizi gecesi gündüzü gibi olan apaçık bir yol üzerinde bıraktım;"], [1279.5, "benden sonra ondan ancak helak olan sapar.\" Bunu İmam Ahmed hasen bir isnadla rivayet etmiştir."]]}, {"reader": false, "ar": [[1289.0, "فمتى ما اخترع المخترعون شيئًا من التعبُّدات القوليّة أو العمليّة أو الاعتقادات القلبيّة،"], [1301.0, "وليس على ذلك دليلٌ من الشرع،"], [1303.0, "فإنّنا نقول لهم: لو كان خيرًا لسبقنا إليه مَن هم خيرٌ منّا وأحرصُ على الهدى،"], [1312.0, "وهم النبي صلى الله عليه وسلم وصحابتُه الكرام."], [1316.0, "فلا يمكن أن يكون شيءٌ من التعبُّدات قد أُخفي عن الأمّة،"], [1322.0, "لا سيّما إذا كان سببُه متوفّرًا."]], "tr": [[1289.0, "İcatçılar sözlü ya da amelî taabbudlardan veya kalbî itikatlardan bir şey icat ettiklerinde ve bunun üzerinde şeriattan bir delil bulunmadığında onlara deriz ki:"], [1304.7, "Eğer hayır olsaydı, bizden daha hayırlı ve hidayete daha düşkün olanlar —ki onlar Nebî ﷺ ve onun kerîm ashâbıdır— ona bizden önce koşarlardı."], [1316.0, "Taabbudlardan bir şeyin ümmetten gizlenmiş olması mümkün değildir;"], [1321.5, "özellikle de sebebi mevcut idiyse."]]}]}, {"ts": "22:05", "title": "4. Külliye (devam): Dinî ve dünyevî metrûkât (terk edilenler)", "paras": [{"reader": false, "ar": [[1325.0, "فإن قلتَ: ولماذا قلتَ «كلُّ أمرٍ تعبُّديّ»؟"], [1330.0, "فأقول: لأنّ الأمور التي تركها النبي صلى الله عليه وسلم تنقسم إلى قسمين:"], [1337.0, "إلى أمورٍ دينيّة، وإلى أمورٍ دنيويّة؛"], [1344.0, "إلى أمورٍ دينيّة، وإلى أمورٍ دنيويّة."], [1349.0, "فقاعدة المتروك دينًا تقول:"], [1353.0, "كلُّ ما تركه النبي صلى الله عليه وسلم من أمر الدين فالأصلُ تركُه؛"], [1364.0, "بمعنى أنه لو كان من الدين لفعله،"], [1367.0, "فلمّا لم يفعله دلّ ذلك على أنه ليس من الدين."]], "tr": [[1325.0, "Eğer \"Neden 'her taabbudî iş' dedin?\" dersen, derim ki:"], [1330.0, "Çünkü Nebî ﷺ'in terk ettiği işler iki kısma ayrılır:"], [1334.0, "Dinî işler ve dünyevî işler;"], [1337.0, "dinî işler ve dünyevî işler."], [1344.0, "Din olarak terk edilen hakkındaki kaide şöyle der:"], [1353.0, "Nebî ﷺ'in din işinden terk ettiği her şeyde asıl, onu terk etmektir."], [1364.0, "Yani eğer dinden olsaydı onu yapardı;"], [1367.0, "yapmadığına göre bu, onun dinden olmadığına delâlet eder."]]}, {"reader": false, "ar": [[1372.0, "وأمّا قاعدة المتروكات الدنيويّة فتقول:"], [1376.0, "الأصل في المتروكات الدنيويّة الحِلّ والإباحة ما لم يَرِد دليلُ منعها."], [1383.0, "وهذا جوابٌ على من قال:"], [1387.2, "أوَكلُّ شيءٍ تركه رسول الله صلى الله عليه وسلم يكون ممنوعًا؟"], [1394.3, "أوَكلُّ شيءٍ تركه رسول الله صلى الله عليه وسلم يكون ممنوعًا؟"], [1401.0, "فيكون الجواب بأنّ المتروكات على قسمين وليست قسمًا واحدًا:"], [1406.0, "فهناك متروكاتٌ يزعم فاعلها أنها من الدين،"], [1411.0, "وهناك متروكاتٌ تتعلّق بأمر الدنيا؛"], [1416.0, "فكلُّ شيءٍ تركه ممّا يتعلّق بأمر الدين فالأصل تركُه،"], [1421.0, "وكلُّ شيءٍ تركه ممّا يتعلّق بأمر الدنيا فالأصل حِلُّه."]], "tr": [[1372.0, "Dünyevî metrûkât hakkındaki kaide ise şöyle der:"], [1376.0, "Dünyevî metrûkâtta asıl, men edildiğine dair delil gelmedikçe helallik ve mubahlıktır."], [1383.0, "Bu, şöyle diyene bir cevaptır:"], [1387.2, "\"Resûlullah ﷺ'in terk ettiği her şey yasak mı olur?"], [1394.3, "Resûlullah ﷺ'in terk ettiği her şey yasak mı olur?\" Cevap şudur:"], [1401.0, "Metrûkât tek kısım değil, iki kısımdır."], [1406.0, "Yapanın dinden olduğunu iddia ettiği metrûkât vardır;"], [1411.0, "dünya işiyle ilgili metrûkât vardır."], [1416.0, "Onun terk ettiği, din işiyle ilgili her şeyde asıl terktir;"], [1421.0, "onun terk ettiği, dünya işiyle ilgili her şeyde asıl helalliktir."]]}, {"reader": false, "ar": [[1427.0, "والخلاصة أن نقول: المتقرِّر في القواعد أنّ المتروك يُردّ إلى أصله،"], [1434.0, "أنّ المتروك يُردّ إلى أصله؛"], [1438.0, "فإن ترك شيئًا الأصلُ فيه المنع فتركُه يدلّ على منعه،"], [1444.0, "وإن ترك شيئًا الأصلُ فيه الحِلّ فإنه باقٍ على حِلّه."], [1450.0, "وصاحب الشبهة يريد أن يجعل القسمين قسمًا واحدًا حتى يجمع بين المختلفين لتقوم الشبهة؛"], [1461.0, "إذ الشبهة لا تقوم إلا بالجمع بين مختلفين،"], [1465.3, "أو التفريق بين أمرين متماثلين."]], "tr": [[1427.0, "Özetle deriz ki: Kaidelerde sabit olan şudur:"], [1428.9, "Terk edilen şey kendi aslına döndürülür;"], [1432.7, "terk edilen şey kendi aslına döndürülür."], [1438.0, "Eğer aslı yasaklık olan bir şeyi terk etmişse, terk etmesi onun yasaklığına delâlet eder;"], [1444.0, "eğer aslı helallik olan bir şeyi terk etmişse, o şey helalliği üzere kalır."], [1450.0, "Şüphe sahibi ise şüphe ayakta dursun diye iki farklı şeyi birleştirmek için iki kısmı tek bir kısım yapmak ister;"], [1461.0, "çünkü şüphe ancak iki farklı şeyi birleştirmekle ya da birbirinin benzeri iki şeyi ayırmakla ayakta durur."]]}]}, {"ts": "24:28", "title": "4. Külliye (devam): Örnekler — kabirleri tavaf, mevlid, ölü adı duyulunca Fâtiha, toplu zikir", "paras": [{"reader": false, "ar": [[1468.0, "فالطواف حول القبور الذي يزعم كثيرٌ من الصوفيّة أنه من الشرع نقول فيه:"], [1475.1, "لا والله، ليس من الشرع؛"], [1478.0, "فإنّ القبور كانت موجودةً على عهد النبي صلى الله عليه وسلم،"], [1483.0, "وكان يزور القبور والمقابر،"], [1485.5, "ومع ذلك لم يَطُف."], [1488.0, "فالطواف حول القبور أمرٌ تعبُّديّ ـ يعني أمرٌ ينسبه صاحبه إلى الدين والعبادة ـ وكلُّ أمرٍ تعبُّديٍّ توفَّر سببُه على عهد النبي صلى الله عليه وسلم ولم يفعله فإنّ المشروع تركُه."]], "tr": [[1468.0, "Sûfîlerin çoğunun şeriattan olduğunu iddia ettiği kabirlerin etrafında tavaf hakkında deriz ki:"], [1475.1, "Hayır, vallahi şeriattan değildir. Çünkü kabirler Nebî ﷺ döneminde mevcuttu;"], [1482.5, "o, kabirleri ve mezarlıkları ziyaret ederdi;"], [1488.0, "buna rağmen tavaf etmedi. Kabirlerin etrafında tavaf taabbudî bir iştir —yani sahibinin dine ve ibadete nispet ettiği bir iştir—;"], [1498.5, "sebebi Nebî ﷺ döneminde mevcut olduğu hâlde onun yapmadığı her taabbudî işte meşru olan, onu terk etmektir."]]}, {"reader": false, "ar": [[1505.0, "وكذلك نقول: الاحتفال بمولد النبي صلى الله عليه وسلم،"], [1511.0, "والذي يزعم فاعلُه أنه من العبادة والدين؛"], [1516.0, "فإنّ اليوم الذي وُلد فيه كان يمرّ عليه في حياته صلى الله عليه وسلم،"], [1522.0, "ولم يثبت عنه في يومٍ واحدٍ أنه أمر أو أشار أو أقرّ لأحدٍ أن يحتفل بشيءٍ من ذلك."], [1533.0, "فالاحتفال بمولده فعلٌ تعبُّديٌّ توفَّر سببُه على عهد النبي صلى الله عليه وسلم ولم يفعله، فالمشروع حينئذٍ تركُه."]], "tr": [[1505.0, "Aynı şekilde, yapanın ibadetten ve dinden olduğunu iddia ettiği Nebî ﷺ'in mevlidini kutlama hakkında da deriz ki:"], [1516.0, "Onun doğduğu gün, hayatında ﷺ onun üzerinden geçiyordu;"], [1519.4, "ondan tek bir gün bile bunlardan herhangi bir şeyi kutlamayı emrettiği, işaret ettiği ya da birine bunu ikrar ettiği sabit olmamıştır."], [1533.0, "Onun mevlidini kutlamak, sebebi Nebî ﷺ döneminde mevcut olduğu hâlde onun yapmadığı taabbudî bir fiildir;"], [1541.6, "o hâlde meşru olan onu terk etmektir."]]}, {"reader": false, "ar": [[1545.0, "وكذلك قراءة الفاتحة عند سماع أسماء الأموات؛"], [1551.0, "فإنّ أسماء الأموات كانت تطرق مسامعَ رسول الله صلى الله عليه وسلم ليلًا ونهارًا،"], [1560.0, "لا سيّما أسماء الأموات الذين يحبّهم النبي عليه الصلاة والسلام حبًّا عظيمًا،"], [1567.7, "كخديجة، وعمِّه حمزة، وأحبِّ أبناء عمومته إليه جعفر،"], [1572.8, "رضي الله تعالى عنهم وأرضاهم،"], [1577.0, "ولم يثبت عنه عند سماع أسمائهم أنه كان يقول شيئًا من الأذكار ـ أقصد من القرآن."], [1587.0, "فقراءة القرآن عند سماع اسم الميّت فعلٌ توفَّر سببُه على عهد النبي صلى الله عليه وسلم ولم يفعله، فالمشروع تركُه."]], "tr": [[1545.0, "Aynı şekilde ölülerin isimleri duyulduğunda Fâtiha okumak da böyledir."], [1547.2, "Çünkü ölülerin isimleri gece gündüz Resûlullah ﷺ'in kulaklarına ulaşıyordu;"], [1551.0, "özellikle de Nebî aleyhissalâtü vesselâmın büyük bir sevgiyle sevdiği ölülerin isimleri:"], [1559.4, "Hatice, amcası Hamza ve amcaoğulları içinde ona en sevimlisi olan Ca'fer gibi —Allah Teâlâ onlardan razı olsun ve onları razı etsin—."], [1577.0, "Onların isimlerini duyduğunda zikirlerden —yani Kur'an'dan— bir şey söylediği ondan sabit olmamıştır."], [1587.0, "Ölünün adı duyulduğunda Kur'an okumak, sebebi Nebî ﷺ döneminde mevcut olduğu hâlde onun yapmadığı bir fiildir;"], [1594.3, "o hâlde meşru olan onu terk etmektir."]]}, {"reader": false, "ar": [[1599.0, "والأذكار الجماعيّة التي يزعم فاعلُها أنها من أمر الدين والعبادة؛"], [1606.0, "فإنّ الأذكار أدبارَ الصلوات كانت تُقام على عهد النبي صلى الله عليه وسلم،"], [1612.0, "ولكن لم تكن مصحوبةً بالصوت الواحد ابتداءً وانتهاءً،"], [1617.2, "ولا بالتمايل أو التراقص أو الطرب أو ضرب شيءٍ من الدفوف."], [1625.0, "فهذه الأفعال عند الذكر ممّا توفَّر سببُه على عهد النبي صلى الله عليه وسلم ولم يفعله، فالمشروع تركُه."]], "tr": [[1599.0, "Yapanın din ve ibadet işinden olduğunu iddia ettiği toplu zikirler de böyledir."], [1606.0, "Çünkü namazların ardından zikirler Nebî ﷺ döneminde yapılıyordu;"], [1610.2, "fakat başlangıçta ve bitişte tek ses hâlinde, sallanarak, raks ederek, nağme ve coşkuyla ya da def çalarak yapılmıyordu."], [1625.0, "Zikir esnasındaki bu fiiller, sebebi Nebî ﷺ döneminde mevcut olduğu hâlde onun yapmadığı şeylerdendir;"], [1631.7, "o hâlde meşru olan onları terk etmektir."]]}, {"reader": false, "ar": [[1635.0, "فلا يمكن أبدًا أن يُحدِث المحدِثون شيئًا من التعبُّدات ـ أيًّا كان نوعها،"], [1643.0, "وأيًّا كان بابها ـ إلا وتلك القاعدة تكسر هذا الإحداث."], [1648.0, "وقد قلتُ لكم سابقًا بأنّ ساقَ البدعة التخصيص،"], [1653.7, "أليس كذلك؟ فمتى ما كُسر تخصيصُها كُسرت بدعيّتُها،"], [1658.0, "متى ما كُسر تخصيصُها كُسرت بدعيّتُها. والله أعلم."]], "tr": [[1635.0, "Sonradan çıkaranların —türü ne olursa olsun, babı ne olursa olsun— taabbudlardan bir şey çıkarması asla mümkün değildir ki bu kaide o ihdası kırmasın."], [1648.0, "Size daha önce bid'atin bacağının (dayanağının) tahsis olduğunu söylemiştim, değil mi?"], [1655.0, "Tahsisi kırıldığı anda bid'atliği de kırılır;"], [1657.5, "tahsisi kırıldığı anda bid'atliği de kırılır. Allah en iyisini bilir."]]}]}, {"ts": "27:43", "title": "5. Külliye: Din adına yapılıp dinden bir şahidi olmayan her şey bid'attir", "paras": [{"reader": false, "ar": [[1663.0, "ومن الكلّيّات أيضًا ـ وهي كلّيّةٌ خفيفة لن أُطيل عندها ـ:"], [1668.2, "<b>كلُّ ما يُفعل باسم الدين وليس له شاهدٌ منه فبدعة.<\/b> كلُّ ما يُفعل باسم الدين وليس له شاهدٌ منه فبدعة."], [1683.0, "وهذا هو حقيقة الابتداع:"], [1696.0, "وهو أن يُحدِث الإنسان شيئًا ينسبه للدين،"], [1701.0, "فيقول: هذا مشروع؛ هذا واجب،"], [1704.4, "أي وجوبٌ دينيّ؛ هذا أفضل،"], [1707.8, "أي أفضليّةٌ دينيّة؛ هذا مستحبّ،"], [1715.6, "أي استحبابٌ دينيّ؛ هذه طاعة،"], [1721.6, "أي طاعةٌ شرعيّة؛ هذا أمرٌ يحبّه الله،"], [1726.9, "أي محبّةٌ شرعيّة؛ هذا قربةٌ إلى الله،"], [1732.0, "أي قربةٌ توجب الثواب ورفعةَ الدرجات."]], "tr": [[1663.0, "Külliyelerden biri de şudur —hafif bir külliyedir, üzerinde uzun durmayacağım—:"], [1668.2, "<b>5. külliye: Din adına yapılıp dinden bir şahidi bulunmayan her şey bid'attir.<\/b> Din adına yapılıp dinden bir şahidi bulunmayan her şey bid'attir."], [1683.0, "İbtidâın hakikati budur: İnsanın dine nispet ettiği bir şey ortaya çıkarması ve şöyle demesidir:"], [1701.7, "\"Bu meşrudur; bu vaciptir\" —yani dinî bir vaciplik—;"], [1706.4, "\"bu daha faziletlidir\" —yani dinî bir üstünlük—;"], [1714.0, "\"bu müstehaptır\" —yani dinî bir müstehaplık—;"], [1720.0, "\"bu bir taattir\" —yani şer'î bir taat—;"], [1724.0, "\"bu Allah'ın sevdiği bir iştir\" —yani şer'î bir sevgi—;"], [1729.0, "\"bu Allah'a yakınlaştıran bir ameldir (kurbettir)\" —yani sevabı ve derecelerin yükselmesini gerektiren bir kurbet—."]]}, {"reader": false, "ar": [[1737.0, "أيًّا كان لفظُه في نسبة هذا الشيء للدين؛"], [1743.0, "فبما أنه يقول قولًا وينسبه إلى الدين،"], [1747.0, "أو يفعل فعلًا وينسبه إلى الدين،"], [1749.0, "فإنّ هذه النسبة عند معاشر أهل السنة والجماعة شرطُها قيامُ الدليل."], [1756.0, "فلا حقَّ لأحدٍ أن ينسب شيئًا للدين إلا إذا جاء بشاهدٍ له من الدين،"], [1764.0, "فإذا لم يأتِ بشاهدٍ فإنّ ما أحدثه يوصف بأنه بدعة،"], [1769.0, "أو يوصف بأنه مُحدَثة."]], "tr": [[1737.0, "Bu şeyi dine nispet ederken lafzı ne olursa olsun:"], [1743.0, "Bir söz söyleyip onu dine nispet ettiğine ya da bir fiil işleyip onu dine nispet ettiğine göre, Ehl-i Sünnet ve'l-Cemaat topluluğuna göre bu nispetin şartı delilin bulunmasıdır."], [1756.0, "Hiç kimsenin, dinden onun için bir şahit getirmedikçe bir şeyi dine nispet etmeye hakkı yoktur."], [1763.4, "Bir şahit getirmezse, ortaya çıkardığı şey bid'at diye ya da muhdes (sonradan çıkarılmış şey) diye nitelenir."]]}, {"reader": false, "ar": [[1772.0, "وعلى ذلك قولُ النبي صلى الله عليه وسلم:"], [1775.0, "«من عمل عملًا ليس عليه أمرُنا فهو ردّ»؛"], [1780.0, "«ليس عليه أمرنا» أي:"], [1782.5, "ليس عليه دليلٌ صحيحٌ صريحٌ من الوحي."], [1787.0, "وقولُ النبي صلى الله عليه وسلم:"], [1790.0, "«من أحدث في أمرنا هذا ما ليس منه» ـ أي ما ليس منه باعتبار ثبوت النص ـ «فهو ردّ»،"], [1798.3, "أي مردودٌ على صاحبه،"], [1801.0, "أي مردودٌ على صاحبه."]], "tr": [[1772.0, "Nebî ﷺ'in şu sözü buna delildir:"], [1775.0, "\"Kim bizim emrimizin üzerinde olmadığı bir amel işlerse o reddedilmiştir.\" \"Bizim emrimizin üzerinde olmadığı\", yani üzerinde vahiyden sahih ve sarih bir delil bulunmadığı demektir."], [1787.0, "Nebî ﷺ'in şu sözü de:"], [1790.0, "\"Kim bizim bu işimizde (dinimizde) ondan olmayan bir şey ihdas ederse\" —yani nassın sübutu itibarıyla ondan olmayan— \"o reddedilmiştir\", yani sahibine geri çevrilmiştir, sahibine geri çevrilmiştir."]]}, {"reader": false, "ar": [[1803.0, "فكلُّ من يفعل شيئًا وينسبه إلى الدين فلا بدّ أن يُطالَب بهذا الطلب الذي أقضَّ مضاجعَهم،"], [1813.1, "وضيّق صدورَهم، وحشرجت به نفوسُهم،"], [1817.7, "وصار كالشوكة في حلوقهم،"], [1821.0, "وهو: أعطوني دليلًا يدلّ على هذا الأمر."], [1827.0, "<span class=\"ayah\">﴿قُلْ هَاتُوا بُرْهَانَكُمْ إِن كُنتُمْ صَادِقِينَ﴾<\/span>،"], [1831.0, "<span class=\"ayah\">﴿ائْتُونِي بِكِتَابٍ مِّن قَبْلِ هَٰذَا أَوْ أَثَارَةٍ مِّنْ عِلْمٍ إِن كُنتُمْ صَادِقِينَ﴾<\/span> <span class=\"ref\">[الأحقاف: ٤]<\/span>."], [1838.0, "فهذا ينبغي أن يتمسّك به السُّنّيّ ليردَّ به كثيرًا ممّا أحدثه أهل البدع."]], "tr": [[1803.0, "Bir şey yapıp onu dine nispet eden herkesten, onların yataklarını diken yapan, göğüslerini daraltan, nefeslerini hırıldatan ve boğazlarında diken gibi olan şu talepte bulunulmalıdır:"], [1815.9, "\"Bana bu işe delâlet eden bir delil verin.\" <span class=\"ayah\">﴿De ki: Eğer doğru söyleyenlerseniz delilinizi getirin﴾<\/span>;"], [1827.0, "<span class=\"ayah\">﴿Eğer doğru söyleyenlerseniz, bundan önceki bir kitabı ya da bir ilim kalıntısını bana getirin﴾<\/span> [Ahkâf 4]."], [1838.0, "Sünnî olan kişi, bid'at ehlinin ortaya çıkardığı şeylerin çoğunu reddetmek için buna sarılmalıdır."]]}]}, {"ts": "30:45", "title": "6. Külliye: Dindeki her bid'at dalâlettir", "paras": [{"reader": false, "ar": [[1845.0, "ومن الكلّيّات أيضًا: <b>كلُّ بدعةٍ في الدين فهي ضلالة.<\/b> كلُّ بدعةٍ في الدين فهي ضلالة."], [1863.0, "وأصلُ هذه القاعدة قولُ النبي صلى الله عليه وسلم:"], [1869.0, "«أمّا بعد، فإنّ أصدقَ الحديث كتابُ الله تعالى، وخيرَ الهدي هديُ محمّدٍ صلى الله عليه وسلم، وشرَّ الأمور محدثاتُها، وكلَّ بدعةٍ ضلالة»."]], "tr": [[1845.0, "Külliyelerden biri de şudur: 6."], [1847.8, "külliye: Dindeki her bid'at dalâlettir. Dindeki her bid'at dalâlettir."], [1863.0, "Bu kaidenin aslı, Nebî ﷺ'in şu sözüdür:"], [1869.0, "\"Bundan sonra: Sözlerin en doğrusu Allah Teâlâ'nın Kitabı'dır, yolların en hayırlısı Muhammed ﷺ'in yoludur;"], [1877.5, "işlerin en kötüsü sonradan çıkarılanlarıdır ve her bid'at dalâlettir.\""]]}, {"reader": false, "ar": [[1884.0, "والمتقرِّر في قواعد الأصول أنّ «كلّ» أقوى صيغ العموم،"], [1891.0, "والمتقرِّر في القواعد أنّ الأصل في اللفظ العامّ بقاؤه على عمومه،"], [1899.0, "فلا يجوز تخصيصه إلا بدليل."], [1903.0, "وليس هناك دليلٌ يدلّ على ما يقوله بعض أهل العلم من أنّ من البدع ما يوصف بأنه حسن."], [1915.0, "وبعضهم قسّم البدعة إلى خمسة أقسام،"], [1918.4, "فقال: بدعةٌ واجبة، وبدعةٌ مستحبّة،"], [1921.8, "وبدعةٌ محرّمة، وبدعةٌ مكروهة،"], [1924.6, "وبدعةٌ مباحة؛ وكلُّ ذلك ممّا يخالف هذا العموم."]], "tr": [[1884.0, "Usûl kaidelerinde sabit olan şudur:"], [1887.6, "\"Kull (her)\" umum sîgalarının en güçlüsüdür."], [1893.8, "Kaidelerde sabit olan şudur: Âmm lafızda asıl, umumu üzere kalmasıdır;"], [1903.0, "delil olmadıkça onu tahsis etmek caiz değildir."], [1906.5, "Bazı âlimlerin söylediği, bid'atlerden bir kısmının güzel diye nitelendiği görüşüne delâlet eden hiçbir delil yoktur."], [1915.0, "Bazıları bid'ati beş kısma ayırmış ve şöyle demiştir:"], [1919.0, "Vacip bid'at, müstehap bid'at, haram bid'at, mekruh bid'at ve mubah bid'at."], [1929.0, "Bunların hepsi bu umuma aykırı olan şeylerdendir."]]}, {"reader": false, "ar": [[1933.0, "ولا يجوز لنا أن ندخل في لفظٍ عامٍّ فنُخرج بعض أفراده إلا وعلى ذلك الإخراج ـ أي التخصيص ـ دليلٌ من الشرع."], [1943.0, "فالحقُّ الحقيقُ بالقبول، والذي لا يجوز القول بغيره:"], [1948.0, "هو أنّ كلَّ محدَثةٍ في الدين فإنها بدعة،"], [1952.0, "وكلَّ بدعةٍ فإنها موصوفةٌ بأنها ضلالة؛"], [1957.0, "هذا هو الذي دلّت عليه الأدلة الكثيرة التي سُقتُ طرفًا منها في الدرس الماضي."]], "tr": [[1933.0, "Âmm bir lafza girip, o çıkarma —yani tahsis— üzerinde şeriattan bir delil olmadıkça onun bazı fertlerini dışarı çıkarmamız caiz değildir."], [1943.0, "Kabule layık olan ve başkasını söylemenin caiz olmadığı hak şudur:"], [1948.0, "Dinde sonradan çıkarılan her şey bid'attir ve her bid'at dalâlet diye nitelenir."], [1957.0, "Geçen derste bir kısmını naklettiğim birçok delilin delâlet ettiği budur."]]}, {"reader": false, "ar": [[1966.0, "ولكن يأبى أهلُ البدع إلا أن يستدلّوا على تحسين بعض البدع بجُمَلٍ من الأدلة والقواعد والأصول،"], [1976.0, "ولعلّنا نأخذ شيئًا من هذه الشُّبَه مع بيان الردّ عليها إن شاء الله."]], "tr": [[1966.0, "Fakat bid'at ehli, bazı bid'atleri güzel göstermek için bir takım delillerle, kaidelerle ve asıllarla istidlal etmekten başkasına yanaşmaz."], [1977.5, "İnşallah bu şüphelerden bir kısmını, onlara verilecek cevabı açıklayarak ele alalım."]]}]}, {"ts": "33:04", "title": "6. Külliye (devam): Birinci şüphe — \"Kim İslâm'da güzel bir sünnet başlatırsa\" hadisi", "paras": [{"reader": false, "ar": [[1984.0, "فممّا قالوه استدلالًا على تحسين البدع:"], [1990.0, "ما أخرجه الإمام مسلمٌ في صحيحه من حديث جرير بن عبد الله البَجَليّ رضي الله عنه أنّ النبي صلى الله عليه وسلم قال:"], [2002.0, "«من سنّ في الإسلام سنّةً حسنة فله أجرُها وأجرُ من عمل بها من بعده، من غير أن ينقص من أجورهم شيء»."], [2013.0, "فقوله: «من سنّ في الإسلام سنّةً حسنة»،"], [2017.0, "وحقيقة البدعة الحسنة أنها سنّةٌ حسنةٌ في الإسلام،"], [2022.0, "بها يستعين الإنسان على طاعة الله،"], [2026.0, "ويتذكّر شريعة الله، وتقوى عزيمته على التقرّب لله،"], [2032.0, "ونحو ذلك ممّا يذكرونه؛"], [2035.0, "فيجعلون هذا النصَّ دليلًا على هذا الإحداث."]], "tr": [[1984.0, "Bid'atleri güzel göstermeye delil olarak söyledikleri şeylerden biri, İmam Müslim'in Sahîh'inde Cerîr b."], [1990.0, "Abdullah el-Becelî —Allah ondan razı olsun— hadisinden rivayet ettiği şu hadistir:"], [1995.0, "Nebî ﷺ şöyle buyurmuştur: \"Kim İslâm'da güzel bir sünnet başlatırsa, onun ecri ve kendisinden sonra onunla amel edenlerin ecri —onların ecirlerinden hiçbir şey eksilmeksizin— ona aittir.\" (Diyorlar ki:) \"Kim İslâm'da güzel bir sünnet başlatırsa\" sözü (buna delildir);"], [2013.0, "güzel bid'atin hakikati de İslâm'da güzel bir sünnet olmasıdır;"], [2019.5, "insan onunla Allah'a itaate yardım alır, Allah'ın şeriatini hatırlar, Allah'a yakınlaşma azmi güçlenir;"], [2030.2, "ve söyledikleri buna benzer şeyler."], [2035.0, "Böylece bu nassı bu ihdasa delil yaparlar."]]}, {"reader": false, "ar": [[2041.0, "فنقول: الجواب من وجوه."], [2044.0, "الوجه الأول: أنّ القول الصحيح في تفسير قوله «من سنّ» أي:"], [2051.8, "من أحيا، لا من ابتدأ."], [2056.0, "فإن قلتَ: وما برهانك على تفسيرك هذا؟"], [2061.0, "فأقول: سببُ ورود الحديث أصالةً؛"], [2064.2, "فإنه لا يدلّ على إحداثٍ جديد،"], [2068.1, "وإنما يدلّ على إحياء شيءٍ مشروع."], [2072.0, "فإحياء المشروع هو السنّة الحسنة التي امتدح النبي صلى الله عليه وسلم فاعلها في هذا الحديث."]], "tr": [[2041.0, "Deriz ki: Cevap birkaç yöndendir."], [2044.0, "Birinci yön: \"Kim sünnet başlatırsa\" sözünün tefsirinde doğru görüş, \"kim ihya ederse\" demektir;"], [2051.8, "\"kim ilk defa ortaya koyarsa\" değil."], [2056.0, "Eğer \"Bu tefsirine delilin nedir?\" dersen, derim ki:"], [2061.0, "Aslında hadisin vürûd sebebi; çünkü o yeni bir ihdasa değil, meşru bir şeyin ihyasına delâlet eder."], [2072.0, "Meşru olanı ihya etmek, Nebî ﷺ'in bu hadiste yapanını övdüğü güzel sünnettir."]]}, {"reader": false, "ar": [[2083.0, "وبيانُ ذلك حديثُ جريرٍ رضي الله عنه قال:"], [2089.4, "«كنّا في صدر النهار عند رسول الله صلى الله عليه وسلم، فجاء قومٌ عُراةٌ مُجتابي النِّمار أو العَباء، متقلّدي السيوف، عامّتُهم من مُضَر، بل كلُّهم من مُضَر، فتمعّر وجهُ رسول الله صلى الله عليه وسلم لِما رأى بهم من الفاقة» ـ أي الفقر وشدّة الحاجة ـ «فدخل» ـ أي بيتَه ـ «ثم خرج» لم يجد شيئًا،"], [2117.0, "«فأمر بلالًا فأذّن» ـ أي الظهر ـ «ثم أقام، فصلّى، ثم خطب الناس، فحمد الله وأثنى عليه، ثم قال: <span class=\"ayah\">﴿يَا أَيُّهَا النَّاسُ اتَّقُوا رَبَّكُمُ الَّذِي خَلَقَكُم مِّن نَّفْسٍ وَاحِدَةٍ﴾<\/span> إلى قوله: <span class=\"ayah\">﴿إِنَّ اللَّهَ كَانَ عَلَيْكُمْ رَقِيبًا﴾<\/span> <span class=\"ref\">[النساء: ١]<\/span>» ـ من سورة النساء ـ «والآيةَ في سورة الحشر: <span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَلْتَنظُرْ نَفْسٌ مَّا قَدَّمَتْ لِغَدٍ﴾<\/span> <span class=\"ref\">[الحشر: ١٨]<\/span>»."]], "tr": [[2083.0, "Bunun açıklaması Cerîr —Allah ondan razı olsun— hadisidir."], [2087.5, "Şöyle demiştir: \"Gündüzün başlarında Resûlullah ﷺ'in yanındaydık."], [2091.1, "Çıplak denecek hâlde, çizgili yün abaları ya da (sıradan) abaları delip başlarından geçirmiş, kılıçlarını kuşanmış bir topluluk geldi;"], [2099.6, "çoğu Mudar'dandı, hatta hepsi Mudar'dandı."], [2102.5, "Onlarda gördüğü yoksulluk sebebiyle Resûlullah ﷺ'in yüzünün rengi değişti\" —yani fakirlik ve ihtiyacın şiddeti—."], [2109.3, "\"İçeri girdi\" —yani evine— \"sonra çıktı\";"], [2111.5, "bir şey bulamamıştı. \"Bilâl'e emretti, o da ezan okudu\" —yani öğle ezanını— \"sonra kamet getirdi, (Nebî ﷺ) namaz kıldırdı, sonra insanlara hutbe verdi;"], [2125.4, "Allah'a hamd ve senada bulundu, sonra şöyle buyurdu:"], [2128.4, "<span class=\"ayah\">﴿Ey insanlar! Sizi tek bir nefisten yaratan Rabbinizden korkun﴾<\/span> —şu sözüne kadar— <span class=\"ayah\">﴿Şüphesiz Allah sizin üzerinizde gözetleyicidir﴾<\/span> [Nisâ 1]\" —Nisâ sûresinden— \"ve Haşr sûresindeki şu ayeti (okudu):"], [2138.5, "<span class=\"ayah\">﴿Ey iman edenler! Allah'tan korkun ve herkes yarın için ne takdim ettiğine baksın﴾<\/span> [Haşr 18].\""]]}, {"reader": false, "ar": [[2146.0, "«ثم قال: تصدّق رجلٌ من ديناره، من درهمه، من ثيابه، من صاع بُرّه، من صاع تمره، حتى قال: ولو بشقّ تمرة. فجاء رجلٌ من الأنصار كادت تعجز عنها كفُّه، بل عجزت، ثم تتابع الناس حتى رأيتُ كومين من طعامٍ وثياب، حتى رأيتُ وجه رسول الله صلى الله عليه وسلم يتهلّل كأنه مُذهَبة، فقال صلى الله عليه وسلم: من سنّ في الإسلام سنّةً حسنة...»."]], "tr": [[2146.0, "\"Sonra şöyle buyurdu: Kişi dinarından, dirheminden, elbisesinden, bir sâ' buğdayından, bir sâ' hurmasından sadaka versin —hatta:"], [2155.3, "Yarım hurmayla da olsa, buyurdu—."], [2159.2, "Ensar'dan bir adam (bir kese ile) geldi;"], [2162.5, "eli neredeyse onu taşımaktan aciz kalacaktı, hatta aciz kaldı."], [2166.7, "Sonra insanlar birbiri ardınca (sadaka getirdi);"], [2170.0, "nihayet yiyecekten ve elbiseden iki yığın gördüm;"], [2173.5, "nihayet Resûlullah ﷺ'in yüzünün altın yaldızlı bir şey gibi parladığını gördüm."], [2178.6, "Bunun üzerine ﷺ şöyle buyurdu:"], [2181.2, "Kim İslâm'da güzel bir sünnet başlatırsa…\""]]}, {"reader": false, "ar": [[2185.0, "فأوّل الحديث يبيّن أنّ قوله «من سنّ» أي:"], [2190.2, "من أحيا؛ لأنّ الصحابيّ لم يخترع الصدقة أو يُحدثها من قِبَل نفسه،"], [2199.0, "ولكن لمّا رأى تكاسلَهم في قضيّة الصدقة أخرج صدقته وأظهرها ليكون قدوةً حسنةً في هذه السنّة الحسنة."], [2213.0, "فالقول الصحيح في قوله «من سنّ» أي:"], [2217.7, "من أحيا، لا من ابتدأ؛"], [2221.0, "وهم يحملونه على سنّة الابتداء،"], [2224.3, "والصواب أنه سنّة الإحياء."]], "tr": [[2185.0, "Hadisin başı, \"kim sünnet başlatırsa\" sözünün \"kim ihya ederse\" anlamına geldiğini açıklar."], [2190.2, "Çünkü o sahâbî sadakayı kendiliğinden icat etmedi ya da ihdas etmedi;"], [2198.0, "fakat onların sadaka konusundaki gevşekliklerini görünce, bu güzel sünnette güzel bir örnek olmak için sadakasını çıkardı ve onu açıkça gösterdi."], [2213.0, "\"Kim sünnet başlatırsa\" sözü hakkında doğru görüş, \"kim ihya ederse\" demektir, \"kim ilk defa ortaya koyarsa\" değil."], [2221.0, "Onlar bunu \"ilk defa ortaya koyma sünneti\"ne hamlediyorlar;"], [2224.3, "doğrusu ise \"ihya sünneti\" olmasıdır."]]}, {"reader": false, "ar": [[2227.0, "ويوضّح ذلك الوجه الثاني:"], [2230.0, "وهي أنّ قول النبي صلى الله عليه وسلم «سنّةً حسنة»؛"], [2235.0, "فإنّ من المعلوم أنّ حُسنَ الشيء وقُبحَه إنما يُعرف بموافقة الشرع أو مخالفته؛"], [2242.0, "فما وافق الشرع فحسن،"], [2246.0, "وما خالف الشرع فقبيح."], [2251.0, "ومن المعلوم أنّ المحدَثات والبدع ممّا ذمّها الشرع،"], [2258.0, "وأخبر بعقوبة فاعلها وببطلانها شرعًا؛"], [2263.0, "فلا يجوز أبدًا أن نصف شيئًا من المحدَثات والبدع بأنها حسنة ـ الحُسنَ الشرعيّ ـ لأنّ الأدلة المتواترة من الكتاب والسنة إنما وصفتها بالذمّ والنهي والتقبيح والتحذير."]], "tr": [[2227.0, "Bunu ikinci yön açıklar: Nebî ﷺ'in \"güzel bir sünnet\" sözü."], [2235.0, "Bilindiği üzere bir şeyin güzelliği ve çirkinliği ancak şeriata uygunluğu ya da aykırılığıyla bilinir:"], [2242.0, "Şeriata uyan güzeldir, şeriata aykırı olan çirkindir."], [2246.8, "Yine bilinmektedir ki sonradan çıkarılan şeyler ve bid'atler, şeriatın kötülediği, yapanının cezalandırılacağını ve şer'an bâtıl olduklarını haber verdiği şeylerdendir."], [2263.0, "Bu yüzden sonradan çıkarılan şeylerden ve bid'atlerden herhangi birini güzel —yani şer'î güzellikle— diye nitelememiz asla caiz değildir;"], [2270.2, "çünkü Kitap ve Sünnet'ten mütevâtir deliller onları ancak kötüleme, yasaklama, çirkin gösterme ve sakındırma ile nitelemiştir."]]}, {"reader": false, "ar": [[2282.0, "فلا ينبغي أبدًا حملُ هذا الحديث على الإحداث؛"], [2286.0, "لأنه مذموم، والحديث يدلّ على السنّة الحسنة (المقابِلة) للسنّة السيئة <span class=\"q\">؟ 38:06<\/span>."], [2295.0, "ويوضّح ذلك الوجه الثالث:"], [2297.7, "وهي أنّ قوله «حسنة» لا ينبغي تفسيره بالاستحسان النفسيّ؛"], [2305.0, "إذ كلُّ أحدٍ سيستحسن ما تستحسنه نفسُه ومزاجُه،"], [2310.4, "ويستدلّ على استحسانه بهذا الحديث."], [2315.0, "فنحن نفسّر «الحسنة» بالحُسن الشرعيّ،"], [2320.0, "وهم يفسّرون «الحسنة» بالاستحسان النفسيّ. فهمتم هذا؟"]], "tr": [[2282.0, "Bu hadisi ihdasa hamletmek asla uygun değildir;"], [2285.0, "çünkü (ihdas) kötülenmiştir. Hadis ise kötü sünnetin (karşılığı olan) güzel sünnete delâlet eder <span class=\"q\">؟<\/span>."], [2295.0, "Bunu üçüncü yön açıklar: \"Güzel\" sözünü nefsî istihsanla (kişinin kendince güzel bulmasıyla) tefsir etmek uygun değildir;"], [2305.0, "çünkü herkes nefsinin ve mizacının güzel bulduğunu güzel bulacak ve güzel bulmasına bu hadisle delil getirecektir."], [2315.0, "Biz \"güzel\"i şer'î güzellikle tefsir ederiz;"], [2318.2, "onlar ise \"güzel\"i nefsî istihsanla tefsir ederler. Bunu anladınız mı?"]]}, {"reader": false, "ar": [[2327.0, "فيُحدِثون الحدثَ وتستحسنه نفوسُهم،"], [2332.0, "فيستدلّون على استحسان نفوسهم بهذا النص؛"], [2337.0, "والحديث لا يتكلّم عن استحسان النفوس ولا على ميلها،"], [2342.0, "ولا على استحسان الأمزجة والعقول،"], [2345.0, "وإنما يتكلّم الحديث عن استحسان الشرع."], [2350.0, "فدلّ ذلك على أنه لا برهانَ لهم في الاستدلال بهذا الحديث على البدعة الحسنة."]], "tr": [[2327.0, "Bir şey ihdas ederler, nefisleri onu güzel bulur;"], [2337.0, "nefislerinin güzel bulmasına da bu nassla delil getirirler."], [2340.0, "Oysa hadis nefislerin güzel bulmasından da onların meylinden de mizaçların ve akılların güzel bulmasından da bahsetmez;"], [2350.0, "hadis ancak şeriatın güzel bulmasından bahseder."], [2352.7, "Bu da onların bu hadisle güzel bid'ate istidlal etmelerinde hiçbir delilleri olmadığını gösterir."]]}]}, {"ts": "39:20", "title": "6. Külliye (devam): İkinci şüphe — Hz. Ömer'in \"Ne güzel bid'at bu\" sözü", "paras": [{"reader": false, "ar": [[2360.0, "ثم نقول: وممّا استدلّوا به أيضًا قولُ عمر رضي الله تعالى عنه المشهورُ عنه،"], [2370.0, "لمّا رأى اجتماع الناس على أُبيّ بن كعبٍ في صلاة التراويح في رمضان،"], [2376.0, "قال: «نِعْمَتِ البدعةُ هذه»."], [2380.0, "فوصفها بأنها نِعْمَ البدعة؛"], [2384.1, "ونِعْمَ الشيءُ ـ أو وصفُ الشيء بأنه نِعْمَت أو نِعْمَ ـ يعني:"], [2391.9, "حسن. فهذا عمر يُحسِّن هذه البدعة،"], [2401.0, "فكيف تقول بأنه ليس هناك بدعةٌ حسنة؟"]], "tr": [[2360.0, "Sonra deriz ki: Delil getirdikleri şeylerden biri de Ömer'in —Allah Teâlâ ondan razı olsun— meşhur sözüdür:"], [2370.0, "Ramazan'da teravih namazında insanların Übeyy b."], [2372.3, "Ka'b'ın arkasında toplandığını görünce \"Ne güzel bid'at bu!\" demiştir."], [2376.8, "Onu \"ne güzel bid'at\" diye nitelemiştir;"], [2380.0, "bir şeyin \"ne güzel\" olması —ya da bir şeyi \"ne güzel\" diye nitelemek— güzel demektir."], [2391.9, "İşte Ömer bu bid'ati güzel buluyor;"], [2400.2, "o hâlde nasıl olur da güzel bid'at yoktur dersin?"]]}, {"reader": false, "ar": [[2404.0, "والجواب من وجوه: الأول:"], [2406.6, "أنّ عمر لا يريد البدعة الشرعيّة التي هي إحداثُ شيءٍ ليس عليه دليل،"], [2415.0, "وإنما يريد به إحياءَ شيءٍ قد هُجر عملًا وتطبيقًا."], [2425.0, "فإنّ قيام الناس جماعةً في صلاة التراويح لم يُحدثه عمر رضي الله عنه،"], [2438.0, "وإنما أحيا به سنّةً قد عملها النبي صلى الله عليه وسلم."]], "tr": [[2404.0, "Cevap birkaç yöndendir. Birincisi: Ömer, üzerinde delil olmayan bir şeyi ihdas etmek demek olan şer'î bid'ati kastetmiyor;"], [2413.1, "bununla ancak amel ve uygulama bakımından terk edilmiş bir şeyi ihya etmeyi kastediyor."], [2425.0, "Çünkü insanların teravih namazında cemaat hâlinde kıyamını Ömer —Allah ondan razı olsun— ihdas etmedi;"], [2438.5, "bununla ancak Nebî ﷺ'in yapmış olduğu bir sünneti ihya etti."]]}, {"reader": false, "ar": [[2443.0, "فإن قلتَ: إذا كان النبي صلى الله عليه وسلم عملها،"], [2449.0, "فلماذا لم يستمرّ عليها؟"], [2451.0, "الجواب: علّل النبي صلى الله عليه وسلم عدم الاستمرار عليها بقوله:"], [2458.0, "«خشيتُ أن يُفرَض عليكم قيامُ الليل»."], [2461.0, "فإن قلتَ: ولماذا لم يعمل بها أبو بكرٍ رضي الله عنه بعد موت رسول الله صلى الله عليه وسلم،"], [2472.0, "وزوالِ علّة الفرضيّة بموته وانقطاع الوحي؟"], [2476.0, "الجواب: لضيق مدّة خلافته؛"], [2481.0, "فإنّما خلافته كانت في سنتين وبضعة أشهر،"], [2485.0, "وكان رضي الله عنه مشغولًا بحروب الردّة أصلًا،"], [2490.0, "فلم تكن مدّة خلافته بمسوِّغةٍ له أن يفعل ذلك؛"], [2500.0, "لكثرة اشتغاله فيها بما يشغله عن إحياء ذلك."]], "tr": [[2443.0, "Eğer \"Nebî ﷺ onu yaptıysa neden devam ettirmedi?\" dersen, cevap:"], [2451.0, "Nebî ﷺ ona devam etmemesini şu sözüyle gerekçelendirmiştir:"], [2458.0, "\"Gece namazının size farz kılınmasından korktum.\" Eğer \"Peki Ebû Bekir —Allah ondan razı olsun— Resûlullah ﷺ'in vefatından sonra, onun vefatıyla farz kılınma illeti ortadan kalkıp vahiy kesildiği hâlde neden onunla amel etmedi?\" dersen, cevap:"], [2476.0, "Hilafet süresinin kısalığından dolayı. Onun hilafeti iki yıl birkaç ay sürmüştü;"], [2481.0, "ayrıca —Allah ondan razı olsun— zaten irtidat savaşlarıyla meşguldü."], [2486.2, "Bu yüzden hilafet süresi, onu bunu ihya etmekten alıkoyan şeylerle çokça meşgul olması sebebiyle, bunu yapmasına imkân veren bir süre değildi."]]}, {"reader": false, "ar": [[2506.0, "وأمّا عمر رضي الله عنه فإنه بقي ردحًا من خلافته لم يفعله،"], [2514.0, "ثم أمر الناس بعد ذلك أن يفعلوه،"], [2518.0, "والحديث في صحيح البخاري:"], [2520.0, "فقد خرج يومًا إلى المسجد،"], [2522.8, "فرأى الناس أوزاعًا متفرّقين،"], [2525.0, "يصلّي الرجل لنفسه، ويصلّي الرجل فيصلّي بصلاته الرهط،"], [2531.0, "فقال: «إنّي لو جمعتُ هؤلاء على قارئٍ واحدٍ لكان أفضل»،"], [2541.0, "فعزم عمر رضي الله عنه فجمعهم على أُبيّ بن كعب،"], [2545.3, "ثم خرج مرّةً أخرى فرأى الناس خلف قارئهم،"], [2549.5, "فقال: «نِعْمَتِ البدعةُ هذه»."]], "tr": [[2506.0, "Ömer —Allah ondan razı olsun— ise hilafetinin bir süresinde bunu yapmadan kaldı, sonra bunun ardından insanlara bunu yapmalarını emretti."], [2515.0, "Hadis Sahîh-i Buhârî'dedir: Bir gün mescide çıktı, insanları dağınık gruplar hâlinde gördü;"], [2520.0, "kişi kendi başına namaz kılıyor, kişi namaz kılıyor ve onun namazına küçük bir grup uyuyordu."], [2525.7, "\"Bunları tek bir kârînin arkasında toplasam daha faziletli olur\" dedi."], [2531.7, "Ömer —Allah ondan razı olsun— buna azmetti ve onları Übeyy b."], [2541.9, "Ka'b'ın arkasında topladı. Sonra başka bir sefer çıktı, insanları kârîlerinin arkasında (namaz kılarken) gördü ve \"Ne güzel bid'at bu!\" dedi."]]}, {"reader": false, "ar": [[2552.0, "فهو لا يريد بها البدعة الشرعيّة،"], [2556.1, "وإنما يريد به البدعة اللغويّة،"], [2561.0, "وهي إحياء شيءٍ قد طال زمانُ هجره."], [2564.0, "الجواب الثاني: سلّمنا جدلًا أنها من جملة ما أحدثه عمر رضي الله عنه؛"], [2575.0, "فإنه من جملة الخلفاء الراشدين والأئمّة المهديّين الذين لهم سنّةٌ متّبعة،"], [2581.5, "بقول النبي صلى الله عليه وسلم:"], [2585.0, "«فعليكم بسنّتي وسنّةِ الخلفاء الراشدين المهديّين من بعدي، تمسّكوا بها، وعَضّوا عليها بالنواجذ»، وعَضّوا عليها بالنواجذ."]], "tr": [[2552.0, "Onunla şer'î bid'ati kastetmiyor; ancak lügavî bid'ati kastediyor;"], [2557.5, "bu da terk edilme zamanı uzamış bir şeyi ihya etmektir."], [2564.0, "İkinci cevap: Tartışma için onun Ömer'in —Allah ondan razı olsun— ihdas ettiği şeylerden olduğunu kabul edelim;"], [2575.0, "o, sünnetine uyulan hulefâ-i râşidîn ve hidayete erdirilmiş imamlardandır."], [2580.9, "Nebî ﷺ'in şu sözü gereği:"], [2585.0, "\"Benim sünnetime ve benden sonra hidayete erdirilmiş râşid halifelerin sünnetine sarılın;"], [2590.4, "ona tutunun ve azı dişlerinizle ısırın\", azı dişlerinizle ısırın."]]}]}, {"ts": "43:19", "title": "6. Külliye (devam): Üçüncü şüphe — \"Biz hayır istiyoruz\"; âlimlerin sözü", "paras": [{"reader": false, "ar": [[2599.0, "وممّا قالوه أيضًا: إنّنا نطلب الخير والقربة والعبادة،"], [2604.2, "فكيف تمنعوننا من فعل الخير الذي لا نريد به إلا الخير؟"], [2614.0, "فنقول لهم: إنّ المتقرِّر في القواعد أنّ القربة مبنيّةٌ على التوقيف،"], [2621.3, "وأنّ التعبُّد مبنيٌّ على التوقيف،"], [2625.0, "وأنه لا مدخل للاستحسان في شيءٍ من أمر الشرع."], [2630.0, "والمتقرِّر في القواعد أنّ سلامة المقاصد لا تُسوِّغ الوقوع في المخالفات."], [2638.0, "والمتقرِّر في القواعد أنّ الاستغناء بالمشروع يُغني عمّا ليس بمشروع."]], "tr": [[2599.0, "Söyledikleri şeylerden biri de şudur:"], [2601.0, "\"Biz hayrı, kurbeti ve ibadeti istiyoruz;"], [2603.6, "hayırdan başka bir şey kastetmediğimiz bir hayrı yapmaktan bizi nasıl men edersiniz?\" Onlara deriz ki:"], [2614.0, "Kaidelerde sabit olan şudur: Kurbet tevkîfe dayanır, taabbud tevkîfe dayanır ve şeriat işinin hiçbir şeyinde istihsanın bir yeri yoktur."], [2630.0, "Kaidelerde sabit olan şudur: Maksatların selameti, muhalefetlere düşmeyi caiz kılmaz."], [2638.0, "Kaidelerde sabit olan şudur: Meşru olanla yetinmek, meşru olmayana ihtiyaç bırakmaz."]]}, {"reader": false, "ar": [[2651.0, "ومن العجائب أنهم قد أشغلوا أنفسهم بتلك المحدَثات والبدع عن فعل السنن والواجبات المشروعة أصلًا."], [2662.0, "وهذا يصدِّق قولَ حسّان ـ رضي الله..."], [2666.0, "رحمه الله تعالى ـ الذي أخرجه الدارميّ بإسنادٍ صحيح:"], [2673.0, "«ما ابتدع قومٌ بدعةً في دينهم إلا رفع الله من سنّتهم مثلها، ثم لا يعيدها إليهم إلى يوم القيامة»."], [2688.0, "فلو استغنوا بالمشروع عمّا ليس بمشروع لاهتدوا،"], [2692.6, "ولكن ضلّوا باشتغالهم بما ليس بمشروع عمّا هو مشروع."]], "tr": [[2651.0, "Şaşılacak şeylerdendir ki onlar kendilerini o sonradan çıkarılmış şeyler ve bid'atlerle meşgul ederek aslen meşru olan sünnetleri ve vacipleri yapmaktan alıkoymuşlardır."], [2666.0, "Bu, Dârimî'nin sahih bir isnadla rivayet ettiği Hassân'ın —Allah ondan razı ol… (düzeltiyor:) Allah Teâlâ ona rahmet etsin— şu sözünü doğrular:"], [2677.7, "\"Bir kavim dininde bir bid'at çıkarmaz ki Allah onların sünnetinden onun bir mislini kaldırmasın;"], [2688.0, "sonra onu kıyamet gününe kadar onlara geri döndürmez.\" Eğer meşru olanla yetinip meşru olmayandan müstağni olsalardı hidayete ererlerdi;"], [2694.6, "fakat meşru olmayanla meşgul olup meşru olandan uzaklaşarak saptılar."]]}, {"reader": false, "ar": [[2702.0, "والخلاصة من ذلك: أنّ كلَّ بدع الدين توصف بأنها ضلالة."], [2710.0, "فإن قلتَ: أوَلم يقل بعض أهل العلم بأنّ هناك بدعةً حسنة؟"], [2717.0, "فنقول: إنّ المتقرِّر في القواعد أنّ أقوال العلماء يُستدَلّ لها لا بها،"], [2726.0, "والمتقرِّر في القواعد وجوبُ تقديم قول الشرع ـ أي الوحي ـ على قول كلِّ من خالفه."], [2735.0, "وليست عظمةُ العالم ـ مهما كانت عظمتُه ـ بمسوِّغةٍ لنا أن نترك مقتضى النصّ الصحيح الصريح لقوله،"], [2749.0, "وتبقى منزلته فوق الرؤوس،"], [2751.7, "ولكنّ قوله ـ قبولًا وردًّا ـ مبنيٌّ على موافقة النص."], [2759.0, "وكلُّ أحدٍ يؤخذ من قوله ويُترك إلا قولَ النبي صلى الله عليه وسلم،"], [2765.0, "إلا قولَ الشارع كتابًا وسنّة."]], "tr": [[2702.0, "Bunun özeti şudur: Dindeki bütün bid'atler dalâlet diye nitelenir."], [2710.0, "Eğer \"Bazı âlimler güzel bid'at olduğunu söylemedi mi?\" dersen, deriz ki:"], [2717.0, "Kaidelerde sabit olan şudur: Âlimlerin sözleri için delil getirilir, onlarla delil getirilmez."], [2724.5, "Kaidelerde sabit olan şudur: Şeriatın —yani vahyin— sözünü, ona muhalefet eden herkesin sözünün önüne geçirmek vaciptir."], [2735.0, "Âlimin büyüklüğü —büyüklüğü ne kadar olursa olsun— onun sözü için sahih ve sarih nassın gereğini terk etmemizi caiz kılmaz."], [2749.0, "Onun makamı başımızın üstünde kalır;"], [2751.7, "fakat sözünün kabulü de reddi de nassa uygunluğuna bağlıdır."], [2759.0, "Nebî ﷺ'in sözü, yani Şâri'in Kitap ve Sünnet olarak sözü hariç, herkesin sözünden alınır da bırakılır da."]]}]}, {"ts": "46:08", "title": "7. Külliye: Dinin aslına aykırı düşen her bid'at tekfir edicidir", "paras": [{"reader": false, "ar": [[2768.0, "ومن الكلّيّات أيضًا: كلُّ بدعةٍ ـ كم قعدنا نشرح؟"], [2770.1, "<span class=\"q\">؟ 46:08<\/span> ـ <b>كلُّ بدعةٍ تناقض أصلَ الدين فمكفِّرة.<\/b> كلُّ بدعةٍ تناقض أصلَ الدين فمكفِّرة."], [2799.0, "وهذه الكلّيّة تتكلّم عن تقسيم البدع باعتبار كونها كفرًا أو فسقًا؛"], [2811.0, "وذلك لأنّ البدعة باعتبار حكمها تنقسم عند أهل السنة والجماعة إلى قسمين:"], [2820.0, "إلى بدعٍ مكفِّرة، وإلى بدعٍ مفسِّقة."]], "tr": [[2768.0, "Külliyelerden biri de şudur: Her bid'at —ne kadar zamandır şerh ediyoruz?"], [2770.1, "<span class=\"q\">؟<\/span>— <b>7. külliye: Dinin aslına aykırı düşen her bid'at tekfir edicidir.<\/b> Dinin aslına aykırı düşen her bid'at tekfir edicidir."], [2800.4, "Bu külliye, bid'atlerin küfür ya da fısk olmaları itibarıyla taksiminden bahseder."], [2811.0, "Çünkü bid'at, hükmü itibarıyla Ehl-i Sünnet ve'l-Cemaat'e göre iki kısma ayrılır:"], [2820.0, "Tekfir edici bid'atler ve fâsık kılan bid'atler."]]}, {"reader": false, "ar": [[2827.0, "ونعني بالبدع المكفِّرة: تلك البدع التي توجب لمن وقع فيها الخروجَ من الدين،"], [2836.0, "وأن يوصف بأنه كافرٌ خالعٌ ربقةَ الإسلام من عنقه بالكلّيّة."], [2843.0, "وأمّا البدع المفسِّقة: فهي التي تناقض كمالَ الدين الواجب،"], [2852.0, "ولكن لا تناقض أصلَه،"], [2855.0, "وتجعل صاحبها موصوفًا بأنه فاسق."], [2860.0, "وكلّيّتنا هذه تتكلّم عن النوع الأول،"], [2865.0, "وهي البدع التي تناقض أصل الدين."]], "tr": [[2827.0, "Tekfir edici bid'atlerle, içine düşene dinden çıkmayı ve İslâm bağını boynundan tamamen çıkarıp atmış bir kâfir diye nitelenmesini gerektiren bid'atleri kastediyoruz."], [2843.0, "Fâsık kılan bid'atler ise dinin vacip olan kemâline aykırı düşen, fakat onun aslına aykırı düşmeyen ve sahibini fâsık diye nitelenen biri yapan bid'atlerdir."], [2860.0, "Bu külliyemiz birinci türden, yani dinin aslına aykırı düşen bid'atlerden bahsetmektedir."]]}, {"reader": false, "ar": [[2869.0, "فإن قلتَ: وكيف أعرف أنّ البدعة ناقضت أصلَ الدين؟"], [2876.0, "وكيف أعرف أنّ البدعة ناقضت أصلَ الدين؟"], [2881.0, "فأقول: الجواب مفصَّلٌ في الكلّيّات الآتية."]], "tr": [[2869.0, "Eğer \"Bid'atin dinin aslına aykırı düştüğünü nasıl bilirim?"], [2874.0, "Bid'atin dinin aslına aykırı düştüğünü nasıl bilirim?\" dersen, derim ki:"], [2881.0, "Cevap, gelecek külliyelerde tafsilatlı olarak verilmiştir."]]}]}, {"ts": "48:08", "title": "8. Külliye: Taabbudu Allah'tan başkasına yöneltmeyi içeren her bid'at tekfir edicidir", "paras": [{"reader": false, "ar": [[2888.0, "الكلّيّة الثامنة ـ انتبهوا: الثامنة والتاسعة والعاشرة كلُّها بيانٌ لإيش؟"], [2899.0, "متى تكون البدعة مكفِّرة."], [2903.0, "كم رقمُها عندكم؟ ثامنها الآن <span class=\"q\">؟ 48:26<\/span>."], [2907.3, "كلُّ بدعةٍ، كلُّ بدعةٍ ـ <b>كلُّ بدعةٍ تتضمّن صرفَ التعبُّد لغير الله فمكفِّرة.<\/b> كلُّ بدعةٍ تتضمّن صرفَ التعبُّد لغير الله عز وجل فمكفِّرة."], [2930.0, "كلُّ بدعةٍ تتضمّن صرفَ التعبُّد لغير الله فمكفِّرة."]], "tr": [[2888.0, "8. külliye —dikkat edin: 8., 9."], [2892.7, "ve 10. külliyelerin hepsi neyin açıklamasıdır?"], [2899.0, "Bid'atin ne zaman tekfir edici olduğunun."], [2903.0, "Sizde numarası kaç? Şimdi sekizincisi <span class=\"q\">؟<\/span>."], [2906.0, "Her bid'at, her bid'at— 8."], [2908.0, "külliye: Taabbudu Allah'tan başkasına yöneltmeyi içeren her bid'at tekfir edicidir. Taabbudu Allah Azze ve Celle'den başkasına yöneltmeyi içeren her bid'at tekfir edicidir."], [2930.0, "Taabbudu Allah'tan başkasına yöneltmeyi içeren her bid'at tekfir edicidir."]]}, {"reader": false, "ar": [[2936.0, "فهذا أوّلُ ضابطٍ وكلّيّةٍ للبدعة المكفِّرة،"], [2942.0, "وهي تلك البدعة التي تتضمّن صرفَ شيءٍ من التعبُّدات لغير الله عز وجل."], [2950.0, "فبدعةُ الاستغاثة بغير الله في الأمر الذي لا يقدر عليه إلا الله بدعةٌ مكفِّرة،"], [2959.0, "وبدعةُ دعاء غير الله في الأمر الذي لا يقدر عليه إلا الله بدعةٌ مكفِّرة،"], [2966.0, "والبدعة التي تتضمّن الذبحَ تعبُّدًا لغير الله عز وجل بدعةٌ مكفِّرة،"], [2975.0, "وبدعةُ الطواف على القبور تعبُّدًا وتعظيمًا لصاحب القبر بدعةٌ مكفِّرة."]], "tr": [[2936.0, "Bu, tekfir edici bid'atin ilk zâbıtı ve külliyesidir:"], [2938.3, "O da taabbudlardan bir şeyi Allah Azze ve Celle'den başkasına yöneltmeyi içeren bid'attir."], [2944.5, "Buna göre, ancak Allah'ın güç yetirebildiği bir işte Allah'tan başkasından medet (istiğase) isteme bid'ati tekfir edici bir bid'attir."], [2950.0, "Ancak Allah'ın güç yetirebildiği bir işte Allah'tan başkasına dua etme bid'ati tekfir edici bir bid'attir."], [2960.0, "Allah Azze ve Celle'den başkasına ibadet olarak kurban kesmeyi içeren bid'at tekfir edici bir bid'attir."], [2969.5, "Kabir sahibine ibadet ve tazim olarak kabirleri tavaf etme bid'ati tekfir edici bir bid'attir."]]}, {"reader": false, "ar": [[2984.0, "والبدعة التي تتضمّن الحلفَ بالتعظيم المطلق بغير الله عز وجل بدعةٌ مكفِّرة،"], [2995.0, "وبدعةُ السجود والركوع تعبُّدًا وتعظيمًا لغير الله عز وجل بدعةٌ مكفِّرة،"], [3006.0, "وهكذا دواليك في بدعٍ كثيرة."], [3009.0, "فمتى ما رأيتَ البدعة تتضمّن شيئًا من صرف التعبُّد لغير الله عز وجل فاعلم مباشرةً أنها بدعةٌ مكفِّرة،"], [3020.9, "والأمثلة كثيرة ستأتينا في قواعد توحيد الألوهيّة إن شاء الله."]], "tr": [[2984.0, "Allah Azze ve Celle'den başkası adına mutlak tazimle yemin etmeyi içeren bid'at tekfir edici bir bid'attir."], [2995.0, "Allah Azze ve Celle'den başkasına ibadet ve tazim olarak secde etme ve rükû etme bid'ati tekfir edici bir bid'attir."], [3009.0, "Daha birçok bid'atte de durum böyle devam eder."], [3012.1, "Bir bid'atin taabbudu Allah Azze ve Celle'den başkasına yöneltmekten bir şey içerdiğini gördüğün anda, onun tekfir edici bir bid'at olduğunu hemen bil."], [3023.4, "Örnekler çoktur; inşallah ulûhiyyet tevhidinin kaidelerinde karşımıza gelecektir."]]}]}, {"ts": "50:27", "title": "9. Külliye: Rubûbiyyetin hakkı olan bir şeyi Allah'tan başkasına yöneltmeyi içeren her bid'at tekfir edicidir", "paras": [{"reader": false, "ar": [[3027.0, "الكلّيّة التاسعة: <b>كلُّ بدعةٍ تتضمّن صرفَ شيءٍ من مستحقّات الربوبيّة لغير الله فمكفِّرة.<\/b> كلُّ بدعةٍ ـ واضحة؟"], [3045.1, "ـ كلُّ بدعةٍ تتضمّن صرفَ شيءٍ من مستحقّات الربوبيّة ـ أي من مقتضيات الربوبيّة ـ لغير الله عز وجل فمكفِّرة."], [3064.0, "أُعيدها مرّةً أخرى: كلُّ بدعةٍ تتضمّن صرفَ شيءٍ من مستحقّات الربوبيّة لغير الله عز وجل فمكفِّرة."]], "tr": [[3027.0, "<b>9. külliye: Rubûbiyyetin hakkı olan şeylerden bir şeyi Allah'tan başkasına yöneltmeyi içeren her bid'at tekfir edicidir.<\/b> Her bid'at —açık mı?— rubûbiyyetin hakkı olan —yani rubûbiyyetin gerektirdiği— şeylerden bir şeyi Allah Azze ve Celle'den başkasına yöneltmeyi içeren her bid'at tekfir edicidir."], [3064.0, "Bir kez daha tekrar ediyorum:"], [3067.0, "Rubûbiyyetin hakkı olan şeylerden bir şeyi Allah Azze ve Celle'den başkasına yöneltmeyi içeren her bid'at tekfir edicidir."]]}, {"reader": false, "ar": [[3078.0, "بمعنى أنها بدعةٌ تتضمّن تربيبَ المخلوق،"], [3082.0, "أي تُضفي على المخلوق شيئًا من صفات الربوبيّة:"], [3089.0, "كاعتقاد أنّ هذا المخلوق يملك النفعَ والضرَّ استقلالًا،"], [3096.0, "فهي مكفِّرة؛ أو اعتقاد أنّ هذا المخلوق يملك العطاءَ والمنعَ استقلالًا،"], [3104.0, "فهي مكفِّرة؛ أو اعتقاد أنّ هذا المخلوق يملك التدبيرَ أو التصريفَ استقلالًا،"], [3113.0, "فهي مكفِّرة؛ أو اعتقاد أنّ هذا المخلوق يخلق كذا وكذا،"], [3123.0, "كاعتقاد القدريّة في أنّ المخلوق يخلق فعلَه."], [3127.0, "فكلُّ بدعةٍ تتضمّن وصفَ مخلوقٍ بخلق الإيجاد من عدمٍ فإنها مكفِّرة."]], "tr": [[3078.0, "Yani mahlûku rab edinmeyi içeren, yani mahlûka rubûbiyyet sıfatlarından bir şey yükleyen bid'attir."], [3089.0, "Tıpkı şu mahlûkun faydaya ve zarara bağımsız olarak mâlik olduğuna inanmak gibi;"], [3098.0, "bu tekfir edicidir. Ya da şu mahlûkun vermeye ve engellemeye bağımsız olarak mâlik olduğuna inanmak;"], [3105.0, "bu tekfir edicidir. Ya da şu mahlûkun (kâinatı) idare etmeye ya da tasarrufa bağımsız
