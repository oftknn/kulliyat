olarak mâlik olduğuna inanmak;"], [3115.0, "bu tekfir edicidir. Ya da şu mahlûkun şunu şunu yarattığına inanmak;"], [3123.0, "Kaderiyye'nin, mahlûkun kendi fiilini yarattığına dair inancı gibi."], [3127.0, "Bir mahlûku yoktan var etme anlamında yaratmakla niteleyen her bid'at tekfir edicidir."]]}, {"reader": false, "ar": [[3138.0, "وكلُّ بدعةٍ تتضمّن تشفيعَ المخلوق عند الله بلا إذنه ورضاه فمكفِّرة،"], [3148.0, "كاعتقاد أصحاب الأوثان في أوثانهم،"], [3153.0, "ومن يعبد غيرَ الله في معبوداته أنها ستشفع له عند الله عز وجل؛"], [3162.0, "وهذا الاعتقاد جعله الله كفرًا لأنهم يصرفون شيئًا من مستحقّات الربوبيّة لغيره عز وجل."], [3171.0, "وكاعتقاد أنّ المخلوق يملك استجابةَ الدعوات استقلالًا،"], [3179.0, "وإغاثةَ اللَّهَفات استقلالًا، ونصرَ المظلوم استقلالًا،"], [3186.0, "أو أنّ له تدبيرًا خفيًّا في الكون،"], [3191.0, "ونحو ذلك ممّا يتضمّن صرفَ شيءٍ من مقتضيات الربوبيّة إلى أحدٍ من الخلق."]], "tr": [[3138.0, "Mahlûkun Allah katında O'nun izni ve rızası olmadan şefaat ettiğine inanmayı içeren her bid'at tekfir edicidir;"], [3148.0, "put sahiplerinin putları hakkındaki ve Allah'tan başkasına ibadet edenlerin taptıkları hakkındaki, onların kendilerine Allah Azze ve Celle katında şefaat edeceklerine dair inançları gibi."], [3162.0, "Allah bu inancı küfür kılmıştır;"], [3163.9, "çünkü onlar rubûbiyyetin hakkı olan şeylerden bir şeyi O'ndan —Azze ve Celle— başkasına yöneltiyorlar."], [3171.0, "Mahlûkun duaları kabul etmeye bağımsız olarak mâlik olduğuna, feryat edenlerin imdadına yetişmeye bağımsız olarak, mazluma yardım etmeye bağımsız olarak mâlik olduğuna ya da kâinatta onun gizli bir tasarrufu (idaresi) olduğuna inanmak ve rubûbiyyetin gerektirdiği şeylerden bir şeyi mahlûkattan birine yöneltmeyi içeren benzeri şeyler de böyledir."]]}, {"reader": false, "ar": [[3199.0, "فلا جرمَ أنّ هذه البدعة نصفها بأنها بدعةٌ مكفِّرة؛"], [3204.5, "لأنها تناقض أصل التوحيد."], [3207.0, "فهناك بدعةٌ تناقض أصل التوحيد باعتبار الألوهيّات،"], [3212.0, "وهناك بدعةٌ تناقض أصل التوحيد باعتبار الربوبيّات."]], "tr": [[3199.0, "Şüphesiz bu bid'ati tekfir edici bir bid'at diye niteleriz;"], [3204.5, "çünkü tevhidin aslına aykırı düşer."], [3207.0, "Tevhidin aslına ulûhiyyet yönünden aykırı düşen bid'at vardır;"], [3212.0, "tevhidin aslına rubûbiyyet yönünden aykırı düşen bid'at vardır."]]}]}, {"ts": "53:38", "title": "10. Külliye: Dinden zaruri olarak bilinen bir şeyi inkârı içeren her bid'at tekfir edicidir", "paras": [{"reader": false, "ar": [[3218.0, "والكلّيّة التي بعدها: <b>كلُّ بدعةٍ تتضمّن إنكارَ معلومٍ من الدين بالضرورة فمكفِّرة.<\/b> كلُّ بدعةٍ تتضمّن إنكارَ معلومٍ من الدين بالضرورة فمكفِّرة."], [3241.0, "كإنكار ـ كبدعةٍ تقوم على إنكار علم الله عز وجل،"], [3248.0, "أو بدعةٍ تقوم على إنكار علوّ الله تبارك وتعالى،"], [3254.0, "أو بدعةٍ تقوم على إنكار العرش،"], [3258.0, "أو إنكار عالم الملائكة،"], [3261.0, "أو إنكار عالم الجنّ،"], [3264.0, "أو إنكار اليوم الآخر،"], [3268.0, "أو إنكار وجود الله عز وجل أصلًا."]], "tr": [[3218.0, "Ondan sonraki külliye: 10. külliye:"], [3218.6, "Dinden zaruri olarak bilinen bir şeyin inkârını içeren her bid'at tekfir edicidir. Dinden zaruri olarak bilinen bir şeyin inkârını içeren her bid'at tekfir edicidir."], [3219.9, "Şunun inkârı gibi —Allah Azze ve Celle'nin ilmini inkâra dayanan bir bid'at gibi;"], [3222.0, "ya da Allah Tebâreke ve Teâlâ'nın uluvvünü inkâra dayanan bir bid'at;"], [3227.7, "ya da Arş'ı inkâra dayanan bir bid'at;"], [3233.6, "ya da melekler âlemini inkâr;"], [3241.0, "ya da cin âlemini inkâr;"], [3249.3, "ya da âhiret gününü inkâr;"], [3256.7, "ya da Allah Azze ve Celle'nin varlığını kökten inkâr."]]}, {"reader": false, "ar": [[3273.0, "أو بدعةٍ تقوم على إنكار البعث أو الجزاء أو النشور،"], [3281.0, "أو على إنكار الجنّة كدار نعيم،"], [3285.0, "أو على إنكار جهنّم كدار عذابٍ وجحيم."], [3291.0, "وكالبدعة التي تقوم على سبّ الصحابة كُلًّا،"], [3297.0, "أو على تكفير الصحابة كُلًّا،"], [3299.0, "أو بدعةٍ تقوم على اعتقاد حلول الله في خلقه،"], [3307.0, "أو حلول المخلوقات فيه،"], [3311.0, "أو بدعةٍ تقوم على اتّحاد الخالق بالمخلوق والمخلوق بالخالق،"], [3318.7, "فصارا كعينٍ واحدة، كاعتقاد الحلوليّة الوجوديّة."]], "tr": [[3273.0, "Ya da ba'si, cezayı veya neşri (dirilişi) inkâra dayanan bir bid'at;"], [3276.5, "ya da cenneti bir nimet yurdu olarak inkâra, ya da cehennemi bir azap ve alevli ateş yurdu olarak inkâra dayanan (bir bid'at)."], [3285.7, "Ashâba toptan sövmeye ya da ashâbı toptan tekfire dayanan bid'at gibi;"], [3291.0, "ya da Allah'ın mahlûkatına hulûlüne, ya da mahlûkatın O'na hulûlüne inanmaya dayanan bir bid'at;"], [3300.4, "ya da Yaratıcı'nın mahlûkla ve mahlûkun Yaratıcı ile ittihadına dayanıp ikisinin tek bir varlık gibi olduğunu söyleyen bir bid'at;"], [3318.7, "Hulûliyye'nin ve Vücûdiyye'nin inancı gibi."]]}, {"reader": false, "ar": [[3327.0, "بل إنّ العلماء أجمعوا على أنّ بدعة النُّصيريّة والحشّاشين والإسماعيليّة والقرامطة والدروز والقاديانيّة كلُّها من البدع المكفِّرة؛"], [3354.3, "لأنها تقوم على إنكار معلومٍ من الدين بالضرورة. والله أعلم."]], "tr": [[3327.0, "Hatta âlimler Nusayrîlerin, Haşşâşîlerin, İsmâilîlerin, Karmatîlerin, Dürzîlerin ve Kâdiyânîlerin bid'atinin hepsinin tekfir edici bid'atlerden olduğu konusunda icma etmişlerdir;"], [3353.0, "çünkü dinden zaruri olarak bilinen bir şeyin inkârına dayanırlar. Allah en iyisini bilir."]]}]}, {"ts": "56:01", "title": "11. Külliye: Şeriatın aslını iptal eden her bid'at tekfir edicidir", "paras": [{"reader": false, "ar": [[3361.0, "ومن الكلّيّات أيضًا: <b>كلُّ بدعةٍ تعود على أصل الشرع بالإبطال فمكفِّرة.<\/b> سجِّلوها <span class=\"q\">؟ 56:08<\/span>:"], [3368.0, "كلُّ بدعةٍ تعود على أصل الشرع بالإبطال فمكفِّرة."], [3385.0, "بمعنى أنّنا إذا اعتمدنا هذه البدعة وأخذنا بها أبطلنا الشرع،"], [3395.0, "لا بمعنى إبطال جزئه،"], [3398.0, "وإنما إبطال كلِّه؛ فلا يبقى شيءٌ من الشرع مع هذه البدعة."]], "tr": [[3361.0, "Külliyelerden biri de şudur: 11."], [3362.9, "külliye: Şeriatın aslını iptal etmeye varan her bid'at tekfir edicidir. Bunu kaydedin <span class=\"q\">؟<\/span>:"], [3368.0, "Şeriatın aslını iptal etmeye varan her bid'at tekfir edicidir."], [3385.0, "Yani bu bid'ate dayanır ve onu alırsak şeriatı iptal etmiş oluruz;"], [3391.2, "bir parçasını iptal etmek anlamında değil, tamamını iptal etmek anlamında."], [3403.0, "Bu bid'atle birlikte şeriattan hiçbir şey kalmaz."]]}, {"reader": false, "ar": [[3408.0, "كبدعة سبّ أصحاب النبي صلى الله عليه وسلم وتكفيرهم؛"], [3414.0, "فإنهم نَقَلةُ الدين لنا،"], [3417.0, "وإذا طعنّا في الناقل طعنّا في منقوله،"], [3425.0, "أو إذا طعنّا في الحامل للشيء طعنّا في محموله."], [3432.0, "فالرافضة زنادقة، أرادوا أن يطعنوا في الدين أصالةً فلم يقدروا،"], [3438.0, "فطعنوا في حَمَلته. فأعظمُ ـ فمن أعظم البدع التي تهدم أصلَ الدين:"], [3447.0, "الطعنُ في صحابة سيّد المرسلين صلى الله عليه وسلم."]], "tr": [[3408.0, "Nebî ﷺ'in ashâbına sövme ve onları tekfir etme bid'ati gibi."], [3414.0, "Çünkü onlar dini bize nakledenlerdir;"], [3417.0, "nakledene dil uzatırsak naklettiği şeye dil uzatmış oluruz;"], [3421.5, "ya da bir şeyi taşıyana dil uzatırsak taşıdığı şeye dil uzatmış oluruz."], [3432.0, "Râfıza zındıklardır; doğrudan dine dil uzatmak istediler, güçleri yetmedi;"], [3436.2, "bunun üzerine onu taşıyanlara dil uzattılar."], [3441.0, "Dinin aslını yıkan bid'atlerin en büyüğü —bid'atlerin en büyüklerinden biri— resullerin efendisi ﷺ'in ashâbına dil uzatmaktır."]]}, {"reader": false, "ar": [[3452.0, "وكبدعة إنكار حجّيّة السنّة مطلقًا،"], [3459.0, "فيقول: إنّ السنّة ليست بحجّة،"], [3463.0, "وإنما الوحيُ واحدٌ وهو القرآن،"], [3468.0, "وأمّا السنّة فإنها ليست بحجّةٍ مطلقًا،"], [3472.0, "لا جملةً ولا تفصيلًا؛"], [3475.0, "وهذه البدعة كفرٌ بإجماع المسلمين."], [3481.0, "مع أنّنا نعلم أنّه ما من طائفةٍ تنتسب للإسلام إلا وعندها شيءٌ من إنكار بعض أجزاء السنّة،"], [3492.0, "كإنكار الآحاد في الاعتقاد،"], [3496.0, "وإنكار خبر الواحد إذا خالفه راويه،"], [3501.8, "وكاعتقاد عدم العمل بخبر الآحاد إذا خالف عملَ أهل المدينة مثلًا."]], "tr": [[3452.0, "Sünnetin hüccetliğini mutlak olarak inkâr etme bid'ati gibi:"], [3459.8, "Kişi \"Sünnet hüccet değildir; vahiy tektir, o da Kur'an'dır;"], [3465.4, "Sünnet ise ne toptan ne de tafsilatlı olarak hiçbir şekilde hüccet değildir\" der."], [3475.0, "Bu bid'at, müslümanların icmaıyla küfürdür."], [3481.0, "Bununla birlikte biliyoruz ki İslâm'a nispet edilen her fırkada Sünnet'in bazı kısımlarını inkârdan bir şey vardır:"], [3490.1, "İtikatta âhâd haberi inkâr etmek, râvisi kendisine muhalefet ettiğinde haber-i vâhidi inkâr etmek ve örneğin Medine ehlinin ameline aykırı olduğunda âhâd haberle amel edilmeyeceğine inanmak gibi."]]}, {"reader": false, "ar": [[3515.0, "مع أنّنا نردّ ذلك كلَّه،"], [3518.2, "إلا أنه ليس ممّا نتكلّم عنه،"], [3522.0, "وإنما نتكلّم عمّن يُبطل أصلَ الاحتجاج بالسنّة؛"], [3527.0, "فهذا كافر، لأنها بدعةٌ ترجع على أصل الدين بالإبطال."], [3532.0, "فإذا بطلت السنّة فكيف نصلّي؟"], [3535.0, "وكيف نزكّي؟ وكيف نحجّ؟"], [3538.0, "وكيف نعبد الله عز وجل في كثيرٍ من المعاملات التي ما جاءت تفاصيلها إلا في السنّة فقط؟"], [3548.0, "فذُكرت مجملاتُها وأصلُ تشريعها في القرآن،"], [3553.0, "وتُرك تفاصيلُها وجزئيّاتُها وشروطُها وأركانُها وواجباتُها وسننُها إلى بيان السنّة."], [3560.0, "فلا جرمَ أنّ هذه البدعة بدعةٌ مكفِّرة."]], "tr": [[3515.0, "Bunların hepsini reddetmekle birlikte, bu bizim bahsettiğimiz şey değildir;"], [3520.7, "biz ancak Sünnet'le ihticacın aslını iptal eden kimseden bahsediyoruz."], [3527.0, "İşte bu kâfirdir; çünkü bu, dinin aslını iptal etmeye varan bir bid'attir."], [3532.0, "Sünnet bâtıl olursa nasıl namaz kılacağız?"], [3535.0, "Nasıl zekât vereceğiz? Nasıl hac yapacağız?"], [3538.6, "Tafsilatı ancak ve sadece Sünnet'te gelmiş olan birçok muamelede Allah Azze ve Celle'ye nasıl ibadet edeceğiz?"], [3548.0, "Bunların mücmelleri ve teşrî asılları Kur'an'da zikredilmiş;"], [3553.0, "tafsilatları, cüz'iyyâtı, şartları, rükünleri, vacipleri ve sünnetleri Sünnet'in beyanına bırakılmıştır."], [3560.0, "Şüphesiz bu bid'at tekfir edici bir bid'attir."]]}]}, {"ts": "59:25", "title": "11. Külliye (devam): Diğer örnekler — nübüvvetin devamı, aklın nakle mutlak takdimi, tahrif iddiası, şeriatın düşmesi", "paras": [{"reader": false, "ar": [[3565.0, "وكذلك نقول: كلُّ من اعتقد أنّ باب النبوّة لم يُغلق،"], [3575.0, "وأنه يمكن خروجُ نبيٍّ بعد رسول الله صلى الله عليه وسلم،"], [3584.0, "فبدعتُه ـ أي محدثتُه ـ مكفِّرة؛"], [3587.0, "لأنها ترجع على أصل الدين بالإبطال،"], [3591.0, "لأنّ هذا النبيّ الذي تدّعيه ربما يأتينا بشريعةٍ تنسف شريعةَ رسول الله صلى الله عليه وسلم وتعارضها."]], "tr": [[3565.0, "Aynı şekilde deriz ki: Nübüvvet kapısının kapanmadığına ve Resûlullah ﷺ'den sonra bir peygamberin çıkmasının mümkün olduğuna inanan herkesin bid'ati —yani sonradan çıkardığı şey— tekfir edicidir;"], [3587.0, "çünkü dinin aslını iptal etmeye varır."], [3590.3, "Zira iddia ettiğin bu peygamber, belki bize Resûlullah ﷺ'in şeriatini kökünden yıkan ve ona muâraza eden bir şeriat getirir."]]}, {"reader": false, "ar": [[3601.0, "وكبدعة تقديم المعقول على المنقول التقديمَ المطلق؛"], [3610.0, "فكلُّ من زعم أنّ العقل مقدَّمٌ على النقل التقديمَ المطلق فإنه كافر؛"], [3618.4, "لأنّ بدعته ترجع على أصل الوحي بالبطلان،"], [3623.2, "والعياذ بالله. وكبدعة الطعن في القرآن،"], [3628.7, "وأنه كلامُ بشرٍ وليس كلامًا لله عز وجل."], [3638.0, "وكبدعة الرافضة في القول بتحريف القرآن،"], [3644.0, "وأنّ المصحف الذي بين يدي المسلمين ليس هو المصحفَ الذي أنزله الله على نبيّه صلى الله عليه وسلم،"], [3657.0, "وإنما المصحف مع صاحب الزمان في السِّرداب ـ كما قالوا ـ وسيخرج به يقرؤه على الناس قبل يوم القيامة."], [3668.0, "وهذه بدعةٌ تنسف أصلَ الدين،"], [3672.0, "ولّا لا يا جماعة؟ فهي بدعةٌ مكفِّرة."]], "tr": [[3601.0, "Akledileni nakledilene mutlak olarak takdim etme bid'ati gibi:"], [3610.0, "Aklın nakle mutlak olarak takdim edildiğini iddia eden herkes kâfirdir;"], [3618.4, "çünkü onun bid'ati vahyin aslını iptal etmeye varır —Allah'a sığınırız—."], [3626.0, "Kur'an'a dil uzatma ve onun Allah Azze ve Celle'nin kelâmı değil, beşer sözü olduğunu söyleme bid'ati gibi."], [3638.0, "Râfıza'nın Kur'an'ın tahrif edildiğini söyleme bid'ati gibi:"], [3645.3, "Müslümanların elindeki mushafın, Allah'ın Peygamberi ﷺ'e indirdiği mushaf olmadığını, mushafın —dedikleri gibi— sirdapta (yeraltı odasında) Sâhibü'z-Zamân'ın yanında olduğunu ve onunla çıkıp kıyamet gününden önce onu insanlara okuyacağını söylerler."], [3668.0, "Bu, dinin aslını kökünden yıkan bir bid'attir, değil mi ey cemaat?"], [3673.7, "O hâlde tekfir edici bir bid'attir."]]}, {"reader": false, "ar": [[3675.0, "وكبدعة الصوفيّة الغُلاة في اعتقاد سقوط الشرع عن بعض أقطابهم وأبدالهم وأوليائهم،"], [3686.0, "فيزعمون أنّ الوليّ متى ما بلغ الكمال في الولاية فإنّ الشريعة تسقط عنه؛"], [3696.0, "وهذا يرجع على أصل الدين بالإبطال،"], [3699.8, "فمعتقِدُه كافر. وكبدعة إنكار وجود الله عز وجل،"], [3704.8, "وهذا أعظمُها. وكبدعة الاتّحاديّة؛"], [3707.4, "فإنها تُبطل الشرع، وتُبطل الألوهيّة والربوبيّة."], [3715.0, "وغير ذلك من البدع التي متى ما اعتقدها الإنسان فإنه لا يبقى معه شيءٌ من الدين؛"], [3726.0, "فلا جرمَ أنّ هذه البدع بدعٌ مكفِّرة."], [3731.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمّد."]], "tr": [[3675.0, "Aşırı sûfîlerin, bazı kutuplarından, abdallarından ve velilerinden şeriatın düştüğüne inanma bid'ati gibi:"], [3683.7, "Velinin velayette kemâle ulaştığı anda şeriatın ondan düştüğünü iddia ederler."], [3690.7, "Bu, dinin aslını iptal etmeye varır;"], [3696.0, "buna inanan kâfirdir. Allah Azze ve Celle'nin varlığını inkâr etme bid'ati gibi;"], [3702.2, "bu, onların en büyüğüdür. İttihâdiyye'nin bid'ati gibi;"], [3706.0, "çünkü o şeriatı iptal eder, ulûhiyyeti ve rubûbiyyeti iptal eder."], [3715.0, "İnsan inandığı anda yanında dinden hiçbir şey kalmayan diğer bid'atler de böyledir."], [3723.4, "Şüphesiz bu bid'atler tekfir edici bid'atlerdir."], [3726.0, "Allah en yüce olan ve en iyi bilendir."], [3731.0, "Allah Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
