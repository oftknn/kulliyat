<script>
const D={"no": 11, "vid": "SS1m4CkfA-s", "title_ar": "الدرس (١١) من شرح كليات العقيدة — تابع: كليات في توحيد الربوبية", "title_tr": "Şerhu Külliyyâti'l-Akîde — 11. Ders: Rubûbiyyet Tevhidine Dair Külliyeler (devam) (Tencîm, Meşîet, Hikmet, İtkan, Kıyâs-ı Evlâ ve Nakîzayn)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Feleklerin hareketine sebebî tesir atfetmek küçük şirktir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.4, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.9, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.9, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [12.5, "أما بعد: أظنُّ أننا وقفنا عند كلّيّة تأثير الأفلاك،"], [17.8, "أم لا؟ وشرحنا قاعدةَ أن كلَّ من اعتقد أن لحركة الأفلاك تأثيرًا استقلاليًّا في حوادث الكون فهو مشركٌ شركًا أكبر، أليس كذلك؟"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.4, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [14.8, "Bundan sonra: Sanırım feleklerin tesiri külliyesinde kalmıştık, değil mi?"], [19.7, "Feleklerin hareketinin kâinattaki hadiselerde müstakil bir tesiri olduğuna inanan herkesin büyük şirkle müşrik olduğu kaidesini şerh etmiştik, öyle değil mi?"]]}, {"reader": false, "ar": [[32.0, "طيب، إذن نبدأ بالكلية الأولى في هذا الباب مستعينين بالله:"], [38.0, "<b>كلُّ من اعتقد أن لحركة الأفلاك تأثيرًا سببيًّا في حوادث الكون فشركٌ أصغر.<\/b> كل من اعتقد أن لحركة الأفلاك تأثيرًا سببيًّا في حوادث الكون فشركٌ أصغر."]], "tr": [[32.0, "Peki, o hâlde Allah'tan yardım dileyerek bu babdaki birinci külliye ile başlıyoruz:"], [40.7, "<b>1. külliye: Feleklerin hareketinin kâinattaki hadiselerde sebebî bir tesiri olduğuna inanan herkes(in bu inancı) küçük şirktir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[58.0, "وذلك لأن الإنسان متى ما اعتقد تأثيرَ حركة الأفلاك لشيءٍ من حوادث الأرض فلا يخلو من حالتين:"], [68.0, "إما أن يعتقد أن حركة الفلك هي التي خلقت هذا الشيء وأوجدته وقدّرته،"], [75.0, "فهذا من باب شرك الربوبية الأكبر،"], [78.7, "وهو الذي تكلّمت عنه القاعدةُ الكليةُ السابقة."], [83.0, "وإما أن يعتقد أن الله عز وجل هو الخالقُ لهذا الحدث،"], [89.0, "وهو المُوجِدُ والمقدِّرُ له،"], [92.0, "ولكنه يعتقد أن لحركة الفلك سببيّةً خفيّةً في وجوده أو في التأثير فيه،"], [100.0, "فهذا الاعتقاد يُعتبر عندنا من الشرك الأصغر."]], "tr": [[58.0, "Çünkü insan, feleklerin hareketinin yeryüzü hadiselerinden birine tesir ettiğine inandığı zaman iki hâlden birinde olur:"], [66.2, "Ya o şeyi yaratanın, var edenin ve takdir edenin feleğin hareketi olduğuna inanır;"], [73.4, "bu, büyük rubûbiyyet şirki kabilindendir ve önceki külliye bundan bahsetmiştir."], [79.3, "Ya da bu hadiseyi yaratanın Allah Azze ve Celle olduğuna, onu var edenin ve takdir edenin O olduğuna inanır;"], [90.5, "fakat feleğin hareketinin onun var olmasında ya da ona tesir etmesinde gizli bir sebebiyeti olduğuna inanır."], [100.7, "Bu inanç bizce küçük şirkten sayılır."]]}, {"reader": false, "ar": [[105.0, "فمتى ما اعتقد تأثيرَ الخالقيّة فهو شركٌ أكبر،"], [111.0, "ومتى ما اعتقد تأثيرَ السببيّة فهو شركٌ أصغر؛"], [117.0, "لأنه اعتقد سببًا ما ليس بسببٍ لا شرعًا ولا قدرًا،"], [123.0, "ولأنه وسيلةٌ للشرك الأكبر."], [128.0, "والمتقرّر في القواعد أن كلَّ من اتّخذ سببًا لم يدلَّ على سببيّته برهانُ الشرع والقدر فشركٌ أصغر."], [137.5, "والمتقرّر في القواعد أن كلَّ وسيلةٍ للشرك الأكبر فإنها تُعتبر من الشرك الأصغر إذا شهد النصُّ بأنها من قبيل الشرك."]], "tr": [[105.0, "Yaratıcılık tesiri(ne) inandığı zaman bu büyük şirktir;"], [109.3, "sebebiyet tesiri(ne) inandığı zaman küçük şirktir."], [113.1, "Çünkü o, ne şer'an ne de kaderen sebep olmayan bir şeyi sebep saymıştır;"], [120.8, "ayrıca bu, büyük şirke bir vesiledir."], [125.0, "Kaidelerde yerleşmiş olan şudur: Sebepliğine şeriatın ve kaderin delili delâlet etmeyen bir şeyi sebep edinen herkes(in bu işi) küçük şirktir."], [137.5, "Yine kaidelerde yerleşmiş olan şudur:"], [140.0, "Büyük şirke vesile olan her şey, nas onun şirk kabilinden olduğuna şahitlik ederse küçük şirkten sayılır."]]}, {"reader": false, "ar": [[147.0, "والكليةُ السابقة وهذه الكلية تتكلّمان عن علم التنجيم التأثيري،"], [157.0, "لأن الكلية التي ستأتينا الآن تتكلّم عن علم التنجيم التسييري."], [164.0, "وعلمُ التنجيم ينقسم إلى قسمين:"], [168.0, "إلى علم تنجيمٍ تأثيري ـ فإن كان تأثيرَ خالقيّةٍ فشركٌ أكبر،"], [175.0, "وإن كان تأثيرَ سببيّةٍ فشركٌ أصغر ـ (وإلى علم تنجيمٍ تسييري). والله أعلم."]], "tr": [[147.0, "Önceki külliye ve bu külliye tesîrî tencîm (yıldızların tesirine dair müneccimlik) ilminden bahseder;"], [159.1, "çünkü şimdi gelecek olan külliye teysîrî tencîm ilminden bahsediyor."], [164.8, "Tencîm ilmi iki kısma ayrılır:"], [168.8, "Tesîrî tencîm ilmi —tesir, yaratıcılık tesiri ise büyük şirk, sebebiyet tesiri ise küçük şirktir— (ve teysîrî tencîm ilmi). Allah en iyisini bilir."]]}]}, {"ts": "02:59", "title": "2. Külliye: Semâvî bir hadiseyle yeryüzü hadisesi arasında vakit bağı kurmak", "paras": [{"reader": false, "ar": [[179.0, "الكلية الثانية: <b>كلُّ من ربط حادثًا أرضيًّا بحادثٍ سماويٍّ ربطَ توقيتٍ دلَّ عليه دليلُ القدر فلا شيء عليه.<\/b> كل من ربط حادثًا أرضيًّا بحادثٍ سماويٍّ ربطَ توقيتٍ دلّ عليه دليل القدر فلا شيء عليه."], [213.0, "أعيدها مرةً ثالثة: كل من ربط حادثًا أرضيًّا بحادثٍ سماويٍّ ربطَ توقيتٍ دلّ عليه دليل القدر فلا شيء عليه."]], "tr": [[179.0, "İkinci külliye: <b>2. külliye: Yeryüzüne ait bir hadiseyi semâvî bir hadiseye, kader delilinin delâlet ettiği bir vakit bağıyla bağlayan kimseye bir şey (vebal) yoktur.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum: (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[226.0, "أقول وبالله التوفيق: وهذه الكلية مما اختلف فيها أهلُ السنة والجماعة،"], [232.0, "فلا تُعتبر من مسائل الدين الكبار التي يُوالى ويُعادى عليها."], [238.0, "وهي تتكلّم عن مسألة علم التنجيم التسييري،"], [244.0, "المستمدِّ من قول الله عز وجل:"], [247.4, "<span class=\"ayah\">﴿وَعَلَامَاتٍ ۚ وَبِالنَّجْمِ هُمْ يَهْتَدُونَ﴾<\/span> [النحل: 16]؛"], [252.0, "أي يهتدون إلى مصالحهم الدينية:"], [254.2, "في معرفة أوقات الصلاة دخولًا وخروجًا،"], [258.0, "وفي معرفة دخول رمضان،"], [260.0, "وفي معرفة القبلة، وفي معرفة أوقات الزراعة، وغير ذلك."]], "tr": [[226.0, "Tevfik Allah'tandır, derim ki: Bu külliye, Ehl-i Sünnet ve'l-Cemaat'in ihtilaf ettiği meselelerdendir;"], [231.5, "bu yüzden uğrunda dostluk ve düşmanlık yapılan büyük din meselelerinden sayılmaz."], [237.4, "Bu külliye, Allah Azze ve Celle'nin şu sözünden alınan teysîrî tencîm ilmi meselesinden bahseder:"], [246.3, "<span class=\"ayah\">﴿Daha başka alâmetler de (yarattı). Onlar yıldızla da yollarını bulurlar.﴾<\/span> [Nahl 16] Yani dinî maslahatlarına yol bulurlar:"], [256.3, "namaz vakitlerinin girişini ve çıkışını bilmede, Ramazan'ın girişini bilmede, kıbleyi bilmede, ekim vakitlerini bilmede ve benzerlerinde."]]}, {"reader": false, "ar": [[269.0, "فهم لا يعتقدون بأن هذا النجم مؤثّرٌ تأثيرًا ذاتيًّا أو سببيًّا في هذا الحادث الأرضي،"], [280.0, "ولكنه من باب تأثير التوقيت فقط."], [285.0, "بمعنى أن الله عز وجل لمّا خلق كونه جعله على سُنَنٍ دائمةٍ لا تختلف ولا تتغيّر،"], [292.0, "فقد يُجري الله عز وجل بعضَ الحوادث الأرضية عند وجود نجمٍ معيّن،"], [298.0, "لا لأن النجم أثّر في هذا الحادث،"], [301.8, "ولكنه يرتبط معه ارتباطَ توقيتٍ فقط."], [305.0, "فيستدلّ أهلُ الأرض بخروج هذا النجم أو اختفائه أو حركته أو قُربه أو بُعده بأنه وقتٌ صالحٌ لمثل هذا الحدث الأرضي،"], [317.0, "على ما أجراه الله عز وجل في سنّته."]], "tr": [[269.0, "Onlar bu yıldızın bu yeryüzü hadisesinde zâtî ya da sebebî bir tesiri olduğuna inanmazlar;"], [278.9, "bu sadece vakit (belirleme) tesiri kabilindendir."], [282.3, "Yani Allah Azze ve Celle kâinatını yarattığında onu değişmeyen ve farklılaşmayan daimî sünnetler (yasalar) üzere kılmıştır."], [290.7, "Allah Azze ve Celle bazı yeryüzü hadiselerini belli bir yıldızın bulunması sırasında cereyan ettirebilir;"], [297.0, "yıldız bu hadiseye tesir ettiği için değil, sadece onunla vakit bakımından bağlantılı olduğu için."], [303.9, "Böylece yeryüzü halkı, Allah Azze ve Celle'nin sünnetinde cereyan ettirdiği üzere, bu yıldızın doğuşunu, kayboluşunu, hareketini, yakınlığını ya da uzaklığını, bu gibi bir yeryüzü hadisesi için uygun bir vakit olduğuna delil sayar."]]}]}, {"ts": "05:20", "title": "2. Külliye (devam): Örnekler; Beğavî ve Nevevî'nin sözleri", "paras": [{"reader": false, "ar": [[320.0, "والسلفُ وإن كانوا يختلفون في مثل ذلك،"], [325.0, "إلا أن القول الصحيح جوازُه،"], [328.6, "لعموم الأدلة الدالّة على أن الناس يجوز لهم أن يهتدوا بمثل هذه الحركات السماوية."], [339.0, "ويُخرَّج على ذلك المطر:"], [347.0, "فإذا قيل بأنه إذا دخل النجمُ الفلاني فهو وقتٌ للمطر،"], [355.0, "فهذه نسبةُ توقيتٍ لا بأس بها."], [359.0, "ويدخل في ذلك أيضًا هبوبُ الرياح وربطُها بنجمٍ معيّن،"], [364.0, "ربطَ توقيتٍ لا تأثير،"], [367.0, "فهو جائزٌ لا بأس به."]], "tr": [[320.0, "Selef bu gibi şeylerde ihtilaf etmiş olsa da doğru görüş bunun caiz olduğudur;"], [328.6, "çünkü insanların bu gibi semâvî hareketlerle yol bulmalarının caiz olduğunu gösteren deliller umumîdir."], [337.6, "Yağmur da buna göre değerlendirilir:"], [341.6, "\"Falan yıldız girdiğinde yağmur vaktidir\" denirse, bu bir vakit nispetidir ve bunda sakınca yoktur."], [356.3, "Rüzgârların esmesi ve bunun belli bir yıldıza bağlanması da —tesir bağıyla değil vakit bağıyla olduğu sürece— buna girer; bu caizdir, sakıncası yoktur."]]}, {"reader": false, "ar": [[369.0, "ويدخل في ذلك أيضًا الأوقاتُ الصالحة للزراعة،"], [373.7, "أو لزراعة بعض الثمار أو المزروعات."], [378.0, "ويدخل في ذلك أيضًا النظرُ في حركة النجوم للاستدلال على صلاحية الحصاد والجِذاذ <span class=\"q\">؟ 06:18<\/span>."], [388.0, "ويدخل في ذلك أيضًا تحديدُ الفصول الأربعة،"], [391.7, "وما يجري فيها من تغيّرات الطقس،"], [394.9, "بخروج النجم أو اختفائه."], [397.0, "ويدخل في ذلك أيضًا ما يسمّى بهيجان الأمواج عند حلول بعض الفصول أو حركة بعض النجوم."], [408.0, "ويدخل في ذلك كثرةُ المنخفضات الجوية إذا ربطها أهلُ الفلك بنجمٍ خروجًا أو غروبًا."]], "tr": [[369.0, "Ekim için ya da bazı meyvelerin veya mahsullerin ekimi için uygun vakitler de buna girer."], [378.0, "Hasat ve (hurma) devşirme <span class=\"q\">؟<\/span> zamanının geldiğine delil getirmek için yıldızların hareketine bakmak da buna girer."], [388.5, "Dört mevsimi ve bu mevsimlerde meydana gelen hava değişikliklerini yıldızın doğması ya da kaybolmasıyla belirlemek de buna girer."], [397.7, "Bazı mevsimlerin girmesi ya da bazı yıldızların hareketi sırasında dalgaların kabarması denen şey de buna girer."], [406.9, "Felek ehli alçak basınçların çokluğunu bir yıldızın doğuşuna ya da batışına bağlarsa bu da buna girer."]]}, {"reader": false, "ar": [[415.0, "كلُّ ذلك جائزٌ لا بأس به،"], [418.5, "لكن شريطةَ أن يكون من باب ربط التوقيت الذي نسمّيه بالتسيير."], [425.0, "وأما إذا كان ربطَ تأثيرٍ فإنه على التفصيل السابق في الكليتين السابقتين."], [430.0, "قال الإمام البغوي رحمه الله تعالى:"], [434.0, "«فأما من قال: مُطِرنا بنوء كذا» ـ انتبه ـ «فأما من قال: مُطِرنا بنوء كذا، وأراد: سقانا الله بفضله في هذا الوقت، فذلك جائز»."]], "tr": [[415.0, "Bütün bunlar caizdir, sakıncası yoktur;"], [417.9, "ancak bizim teysîr dediğimiz vakit bağı kabilinden olması şartıyla."], [423.2, "Tesir bağı ise, önceki iki külliyedeki tafsilat üzeredir."], [427.1, "İmam Beğavî rahimehullah şöyle der:"], [429.2, "\"Kim 'Falan nev' (yıldız) sebebiyle yağmura kavuştuk' der\" —dikkat et— \"kim 'Falan nev' sebebiyle yağmura kavuştuk' der ve bununla 'Allah bu vakitte lütfuyla bizi suladı' demeyi kastederse, bu caizdir.\""]]}, {"reader": false, "ar": [[450.0, "وقال النووي رحمه الله:"], [454.0, "«وعلى هذا لو قال: مُطِرنا بنوء كذا، معتقدًا أنه من الله وبرحمته، وأن النوء ميقاتٌ له وعلامةٌ عليه اعتبارًا بالعادة، فكأنه قال: مُطِرنا في وقت كذا، فهذا لا يكفر». فهذا لا يكفر."]], "tr": [[450.0, "Nevevî rahimehullah da şöyle der:"], [452.6, "\"Buna göre kişi, (yağmurun) Allah'tan ve O'nun rahmetiyle olduğuna, nev'in ise âdete itibarla onun için bir vakit ve bir alâmet olduğuna inanarak 'Falan nev' sebebiyle yağmura kavuştuk' derse, 'Falan vakitte yağmura kavuştuk' demiş gibidir;"], [475.2, "bu kişi kâfir olmaz.\" Bu kişi kâfir olmaz."]]}, {"reader": false, "ar": [[480.0, "فإذا تعلّم من النجوم ما يهتدي به في ظلمات البرّ والبحر،"], [487.2, "ويعرف به القبلةَ وأوقاتَ الصلاة والطرقات،"], [495.0, "ويهتدي بها في ظلمات البرّية بما تقوم به مصالحُ الدين والدنيا،"], [503.0, "فإن ذلك من الأمور الجائزة التي لا تُفسد شيئًا من العقائد. والله أعلم."]], "tr": [[480.0, "Kişi yıldızlardan, karanın ve denizin karanlıklarında yolunu bulacağı, kıbleyi, namaz vakitlerini ve yolları bileceği, çölün karanlıklarında din ve dünya maslahatlarını ayakta tutacak şekilde yolunu bulacağı kadarını öğrenirse, bu akîdelerden hiçbir şeyi bozmayan caiz işlerdendir. Allah en iyisini bilir."]]}]}, {"ts": "08:29", "title": "3. Külliye: Gerçekleşmesi kesin olmayan gelecek haberi meşîete bağlanır", "paras": [{"reader": false, "ar": [[509.0, "ومن الكليات أيضًا: <b>كلُّ خبرٍ عن أمرٍ مستقبليٍّ غيرِ متحقِّق الوقوع فيجب تعليقُه بالمشيئة.<\/b> كل خبرٍ عن أمرٍ مستقبليٍّ غير متحقّق الوقوع فيجب تعليقه بالمشيئة."], [543.0, "أعيدها مرةً ثالثة: كل خبرٍ عن أمرٍ مستقبليٍّ غير متحقّق الوقوع فيجب تعليقه بالمشيئة."]], "tr": [[509.0, "Külliyelerden biri de şudur: 3."], [513.0, "külliye: Gerçekleşmesi kesin olmayan gelecekteki bir işe dair her haberi meşîete (Allah'ın dilemesine) bağlamak vâciptir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum: (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[554.0, "أقول وبالله التوفيق: وذلك أن الكلام يجب تعليقُه بالمشيئة في حالتين،"], [560.0, "ويحرم تعليقُه بالمشيئة في حالتين."], [563.0, "فيجب تعليقُ الكلام بالمشيئة إذا كان خبرًا عن أمرٍ مستقبليٍّ غير متحقّق الوقوع،"], [574.0, "وهو كليّتُنا هذه؛ لقول الله عز وجل:"], [578.3, "<span class=\"ayah\">﴿وَلَا تَقُولَنَّ لِشَيْءٍ إِنِّي فَاعِلٌ ذَٰلِكَ غَدًا ۝ إِلَّا أَن يَشَاءَ اللَّهُ﴾<\/span> [الكهف: 23-24]،"], [585.0, "يعني: إلا إن قيّدته بهذا القول فيجوز لك أن تُخبر به."], [590.0, "ويقول الله عز وجل:"], [592.8, "<span class=\"ayah\">﴿لَتَدْخُلُنَّ الْمَسْجِدَ الْحَرَامَ إِن شَاءَ اللَّهُ آمِنِينَ﴾<\/span> [الفتح: 27]،"], [598.0, "فربّاهم الله عز وجل على تقييد الأمور المستقبلية بالمشيئة."]], "tr": [[554.0, "Tevfik Allah'tandır, derim ki: Şöyle ki, sözü meşîete bağlamak iki durumda vâcip, iki durumda da haramdır."], [561.2, "Söz, gerçekleşmesi kesin olmayan gelecekteki bir işe dair haber olduğunda onu meşîete bağlamak vâciptir;"], [568.4, "bu bizim bu külliyemizdir. Çünkü Allah Azze ve Celle şöyle buyurur:"], [577.1, "<span class=\"ayah\">﴿Hiçbir şey için \"Bunu yarın yapacağım\" deme; ancak \"Allah dilerse\" (de).﴾<\/span> [Kehf 23-24] Yani onu bu sözle kayıtlarsan, onu haber vermen caiz olur."], [588.0, "Allah Azze ve Celle şöyle de buyurur:"], [590.0, "<span class=\"ayah\">﴿Allah dilerse, Mescid-i Harâm'a güven içinde mutlaka gireceksiniz.﴾<\/span> [Fetih 27] Böylece Allah Azze ve Celle onları gelecekteki işleri meşîetle kayıtlama üzere terbiye etti."]]}]}, {"ts": "10:04", "title": "3. Külliye (devam): İbrâhîm ve Mûsâ'nın \"inşallah\"ı; vahyin haber verdiği şeyler", "paras": [{"reader": false, "ar": [[604.0, "وكم ضاع علينا من الأمور المستقبلية فلم نُوفَّق لتحقيقها أو إتمامها،"], [609.0, "لأننا جزمنا بوقوعها اعتمادًا على حولنا وقوّتنا،"], [615.7, "وحسنِ تدبيرنا، وجمالِ ترتيبنا،"], [618.2, "وثقتِنا في أنفسنا؛ فسُحب بساطُ التوفيق والبركة من تحت أقدامنا،"], [624.0, "فلا نزال نتردّد في إنهائها ولا نستطيع مع طول الزمن،"], [629.0, "لأننا لم نعلّقها في أول الأمر بماذا؟ بالمشيئة."]], "tr": [[604.0, "Gelecekteki nice işler elimizden kayıp gitti de onları gerçekleştirmeye ya da tamamlamaya muvaffak olamadık."], [609.9, "Çünkü kendi gücümüze ve kuvvetimize, güzel planlamamıza, düzenlememizin güzelliğine ve kendimize olan güvenimize dayanarak onların gerçekleşeceğini kesin saydık."], [621.7, "Böylece tevfik ve bereket halısı ayaklarımızın altından çekildi;"], [625.2, "uzun zaman geçmesine rağmen onları bitirmekte hâlâ bocalıyoruz ve bitiremiyoruz."], [630.1, "Çünkü başta onları neye bağlamadık? Meşîete."]]}, {"reader": false, "ar": [[635.0, "ولمّا أراد إبراهيم أن يذبح ولده امتثالًا لوحي الله عز وجل وأمره قال:"], [641.5, "<span class=\"ayah\">﴿إِنِّي أَرَىٰ فِي الْمَنَامِ أَنِّي أَذْبَحُكَ فَانظُرْ مَاذَا تَرَىٰ ۚ قَالَ يَا أَبَتِ افْعَلْ مَا تُؤْمَرُ ۖ سَتَجِدُنِي إِن شَاءَ اللَّهُ مِنَ الصَّابِرِينَ﴾<\/span> [الصافات: 102]؛"], [652.7, "لأن الصبرَ من عدمه لا يزال في حيّز المستقبل الغيبي."], [658.0, "ولمّا أراد موسى أن يصحب الخضرَ قال له:"], [663.1, "<span class=\"ayah\">﴿إِنَّكَ لَن تَسْتَطِيعَ مَعِيَ صَبْرًا﴾<\/span> [الكهف: 67]،"], [666.0, "<span class=\"ayah\">﴿قَالَ سَتَجِدُنِي إِن شَاءَ اللَّهُ صَابِرًا وَلَا أَعْصِي لَكَ أَمْرًا﴾<\/span> [الكهف: 69]."]], "tr": [[635.0, "İbrâhîm, Allah Azze ve Celle'nin vahyine ve emrine uyarak oğlunu kesmek istediğinde şöyle dedi:"], [641.5, "<span class=\"ayah\">﴿\"Rüyamda seni kestiğimi görüyorum; bak, ne düşünürsün?\" (Oğlu) dedi ki: \"Babacığım! Emrolunduğun şeyi yap; inşallah beni sabredenlerden bulacaksın.\"﴾<\/span> [Sâffât 102] Çünkü sabredip etmemek hâlâ gaybî gelecek alanındadır."], [655.3, "Mûsâ, Hızır'a arkadaşlık etmek istediğinde (Hızır) ona dedi ki:"], [660.0, "<span class=\"ayah\">﴿Sen benimle beraberliğe sabredemezsin.﴾<\/span> [Kehf 67] <span class=\"ayah\">﴿(Mûsâ) dedi ki: \"İnşallah beni sabırlı bulacaksın; hiçbir işte sana karşı gelmem.\"﴾<\/span> [Kehf 69]"]]}, {"reader": false, "ar": [[675.0, "فهذه تربيةٌ شرعيةٌ على أن الإنسان لا ينبغي له أن يجزم بشيءٍ من الأمور المستقبلية جزمَ وقوعٍ إلا بعد أن يعلّق أمره هذا بالمشيئة."], [689.0, "فإن قلت: ما دخلُ هذه القاعدة في توحيد الربوبية؟"], [693.0, "فنقول: لأن الجزم في الأمر الغيبي تدخّلٌ في علم الغيب،"], [698.0, "فلا يجوز للإنسان أن يجزم بهذا الأمر الغيبي ما دام في حيّز الغيب."], [703.0, "ولا ينبغي للإنسان أن يعتمد على مشيئته وحوله وقوّته،"], [709.0, "لأنه سيكون أضعفَ ما يكون."]], "tr": [[675.0, "Bu, insanın gelecekteki işlerden hiçbirinin gerçekleşeceğini, işini meşîete bağlamadıkça kesin olarak söylememesi gerektiğine dair şer'î bir terbiyedir."], [685.0, "Eğer \"Bu kaidenin rubûbiyyet tevhidiyle ne ilgisi var?\" dersen, deriz ki:"], [691.2, "Çünkü gaybî bir işte kesin konuşmak, gayb ilmine karışmaktır."], [696.0, "Gaybî bir iş gayb alanında olduğu sürece insanın onu kesin olarak söylemesi caiz değildir."], [702.2, "İnsan kendi dilemesine, gücüne ve kuvvetine dayanmamalıdır;"], [706.4, "çünkü (o zaman) olabileceği en zayıf hâlde olur."]]}, {"reader": false, "ar": [[713.0, "فإن قلت: ولماذا قلتَ «غير متحقّق الوقوع»؟"], [719.0, "فأقول: لأنه متى ما دلّ دليلُ الوحي في هذا الأمر المستقبلي أنه واقع،"], [726.0, "فإن وقوعه ليس له دافع."], [728.0, "فمتى ما أخبر دليلُ الوحي عن وقوع هذا الشيء فلا يجوز لك أن تعلّقه بالمشيئة،"], [735.0, "بل يجب عليك أن تُخبر به خبرًا جازمًا بناءً على دليل الوحي."]], "tr": [[713.0, "Eğer \"Neden 'gerçekleşmesi kesin olmayan' dedin?\" dersen, derim ki:"], [720.1, "Çünkü vahyin delili gelecekteki bu işin mutlaka olacağına delâlet ettiği zaman, onun gerçekleşmesini engelleyecek hiçbir şey yoktur."], [728.9, "Vahyin delili bu şeyin gerçekleşeceğini haber verdiği zaman onu meşîete bağlaman caiz değildir;"], [735.4, "aksine vahyin delili üzerine onu kesin bir haberle bildirmen vâciptir."]]}, {"reader": false, "ar": [[741.0, "فإذا قلتَ: إن الشمس ستخرج من مغربها قبل يوم القيامة،"], [747.0, "فإيّاك أن تقول: إن شاء الله."], [748.0, "وإذا قلتَ بأن الدجّال سيخرج قبل يوم القيامة،"], [755.0, "فإيّاك أن تقول: إن شاء الله."], [756.0, "وإذا قلتَ بأن للدنيا نهايةً،"], [761.0, "وأنه ستقوم الساعةُ في يومٍ من الدهر،"], [765.0, "فإيّاك أن تقول: إن شاء الله."], [767.0, "لأن هذه أخبارٌ وإن كانت مستقبليةً غيبيةً إلا أن دليل الوحي أخبر بها."]], "tr": [[741.0, "\"Kıyametten önce güneş battığı yerden doğacak\" dediğinde sakın \"inşallah\" deme."], [747.5, "\"Deccal kıyametten önce çıkacak\" dediğinde sakın \"inşallah\" deme."], [755.0, "\"Dünyanın bir sonu var ve zamanın bir gününde kıyamet kopacak\" dediğinde sakın \"inşallah\" deme."], [765.3, "Çünkü bunlar gelecekle ilgili gaybî haberler olsa da vahyin delili onları haber vermiştir."]]}, {"reader": false, "ar": [[774.0, "ومن شرط الإيمان الجزمُ وعدمُ التردّد والشكّ أو التعليق،"], [781.0, "وكلمةُ «إن شاء الله» تتضمّن شكًّا في وقوعه من عدم وقوعه،"], [789.2, "أو تردّدًا، أو تعليقًا."], [791.0, "وهذا يتنافى مع وجوب الإيمان بالشيء الذي أُمرتَ شرعًا أن تؤمن به؛"], [797.0, "فيجب عليك أن تؤمن به على وجه الجزم الذي لا يخالطه شيءٌ من الشكّ ولا التردّد ولا التعليق."]], "tr": [[774.0, "İmanın şartı kesinlik ve tereddüt, şüphe ya da (şarta) bağlamanın olmamasıdır."], [781.8, "\"İnşallah\" kelimesi ise onun olup olmayacağı konusunda bir şüpheyi, ya da tereddüdü, ya da bir şarta bağlamayı içerir."], [792.5, "Bu da şer'an iman etmekle emrolunduğun şeye iman etmenin vâcip oluşuyla bağdaşmaz."], [798.0, "O hâlde ona, içine hiçbir şüphe, tereddüt ve (şarta) bağlama karışmayan kesin bir şekilde iman etmen vâciptir."]]}, {"reader": false, "ar": [[806.0, "ومن الأمور… عفوًا، إيش قلنا؟"], [812.0, "إي نعم. فهذا الأمر الأول الذي يجب تعليقُ المشيئة به،"], [816.0, "وأما بقية الأمور فستأتينا في الكليات القادمة في أبوابها بإذن الله عز وجل."]], "tr": [[806.0, "İşlerden biri de… Pardon, ne diyorduk?"], [812.0, "Evet. İşte bu, meşîete bağlanması vâcip olan birinci durumdur."], [815.6, "Diğer durumlar ise Allah Azze ve Celle'nin izniyle gelecek külliyelerde kendi bablarında karşımıza çıkacak."]]}]}, {"ts": "13:43", "title": "4. Külliye: Allah'ın bütün fiilleri hikmet, maslahat ve gayeye dayanır", "paras": [{"reader": false, "ar": [[823.0, "ومن الكليات أيضًا: <b>كلُّ أفعال الله عز وجل عن حكمةٍ ومصلحةٍ وغاية.<\/b> <span class=\"note\">(يكررها)<\/span> فلا يخرج شيءٌ من أفعاله عز وجل عن تمام الحكمة،"], [851.0, "ولا يجوز دخولُ العبث في شيءٍ من أفعاله تبارك وتعالى."], [856.0, "قال الإمام ابن القيم رحمه الله تعالى:"], [861.0, "«الله سبحانه حكيمٌ لا يفعل شيئًا عبثًا، ولا لغير معنًى ومصلحة، وحكمتُه هي الغاية المقصودة بالفعل، بل أفعالُه سبحانه صادرةٌ عن حكمةٍ بالغةٍ لأجلها فعل، كما أنها ناشئةٌ عن أسبابٍ بها فعل»."], [885.0, "انتهى كلامه رحمه الله."]], "tr": [[823.0, "Külliyelerden biri de şudur: 4."], [825.7, "külliye: Allah Azze ve Celle'nin bütün fiilleri bir hikmete, maslahata ve gayeye dayanır. (Tekrar ediyor.) O'nun fiillerinden hiçbiri tam hikmetin dışına çıkmaz;"], [851.5, "Tebâreke ve Teâlâ'nın fiillerinden hiçbirine abesin (anlamsızlığın) girmesi caiz değildir."], [856.0, "İmam İbnü'l-Kayyim rahimehullah şöyle der:"], [859.6, "\"Allah Sübhânehû hakîmdir; hiçbir şeyi abes olarak, bir anlam ve maslahat olmaksızın yapmaz."], [867.9, "O'nun hikmeti, fiille kastedilen gayedir."], [871.4, "Bilakis Sübhânehû'nun fiilleri, uğruna yaptığı derin bir hikmetten sâdır olur;"], [879.3, "tıpkı onlarla yaptığı sebeplerden doğduğu gibi.\" Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[888.0, "ومما نؤمن به أن الله عز وجل هو الحكيمُ اسمًا،"], [893.0, "وذو الحكمة المطلقة المتناهية صفةً وفعلًا."], [900.0, "قال ابن تيمية رحمه الله تعالى:"], [902.0, "«وعلى هذا فكلُّ أفعال الله عز وجل عن حكمةٍ وغايةٍ ومصلحة»."], [907.0, "انتهى كلامه رحمه الله."]], "tr": [[888.0, "İnandığımız şeylerden biri de şudur:"], [889.5, "Allah Azze ve Celle isim olarak el-Hakîm'dir;"], [892.0, "sıfat ve fiil olarak da mutlak ve son derece kâmil hikmet sahibidir."], [900.3, "İbn Teymiyye rahimehullah şöyle der:"], [901.7, "\"Buna göre Allah Azze ve Celle'nin bütün fiilleri bir hikmete, gayeye ve maslahata dayanır.\" Sözü burada bitti, Allah ona rahmet etsin."]]}]}, {"ts": "15:09", "title": "4. Külliye (devam): Hikmet ve ta'lîli inkâr edenler; Kur'an'dan deliller", "paras": [{"reader": false, "ar": [[909.0, "وهذا بإجماع أهل السنة والجماعة،"], [911.7, "خلافًا لأهل البدع من المعتزلة والأشاعرة وغيرهم من أهل البدع،"], [917.0, "ممّن يعتقدون أن الله عز وجل يفعل الشيءَ لمحض إرادته ومشيئته،"], [924.1, "لا عن حكمةٍ يريدها فيه،"], [927.3, "ولا عن غايةٍ يريد الوصولَ إليها بسببه،"], [932.0, "وهم طائفةٌ من الأشاعرة."], [934.5, "فالله عز وجل عند هؤلاء لم يأمر بمأمورات الشرع لحُسنٍ فيها،"], [941.5, "وإنما لأنه أراد أن يأمر بها فقط؛"], [946.0, "ولم ينهَ عن مناهي الشرع لحكمةٍ في النهي عنها أو لقُبحٍ فيها،"], [955.0, "وإنما لأنه أراد أن ينهى عنها فقط."]], "tr": [[909.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır."], [911.1, "Mu'tezile, Eş'arîler ve diğer bid'at ehlinden olup Allah Azze ve Celle'nin bir şeyi, onda murad ettiği bir hikmet için ya da onun sebebiyle ulaşmak istediği bir gaye için değil, sırf iradesi ve dilemesiyle yaptığına inanan bid'at ehli buna muhaliftir;"], [932.0, "bunlar Eş'arîlerden bir taifedir. Bunlara göre Allah Azze ve Celle, şeriatın emirlerini onlarda bir güzellik olduğu için emretmemiştir;"], [942.2, "sadece onları emretmeyi istediği için emretmiştir."], [945.4, "Şeriatın yasaklarını da onları yasaklamakta bir hikmet olduğu ya da onlarda bir çirkinlik bulunduğu için yasaklamamıştır;"], [955.6, "sadece onları yasaklamayı istediği için yasaklamıştır."]]}, {"reader": false, "ar": [[959.0, "فلو أراد أن ينهى عمّا كان قد أمر به لحَسُن ذلك منه،"], [966.0, "ولو أراد أن ينهى عمّا أمر به أو يأمر بما نهى عنه لحَسُن ذلك منه."], [977.0, "فالله عز وجل عند هؤلاء لم يأمر بالتوحيد لحُسنٍ في التوحيد،"], [982.0, "ولم ينهَ عن الشرك لقُبحٍ في الشرك."], [984.0, "وهم نُفاةُ الحكمة والتعليل،"], [987.5, "الذين ردّ عليهم أهلُ السنة والجماعة."], [991.0, "ومن أعظم وأفخم من ردّ عليهم ـ بعد كتاب الله عز وجل وسنة نبيه ﷺ ـ الإمامُ ابن القيم رحمه الله في كتابه «شفاء العليل في مسائل الحكمة والقضاء والقدر والتعليل»."]], "tr": [[959.0, "(Onlara göre) Allah emretmiş olduğu şeyi yasaklamak isteseydi bu O'ndan güzel olurdu;"], [965.4, "emrettiğini yasaklamak ya da yasakladığını emretmek isteseydi bu da O'ndan güzel olurdu."], [972.7, "Bunlara göre Allah Azze ve Celle tevhidi tevhidde bir güzellik olduğu için emretmemiş, şirki de şirkte bir çirkinlik olduğu için yasaklamamıştır."], [982.9, "Bunlar hikmeti ve ta'lîli (fiillerin illetlerini) inkâr edenlerdir;"], [987.5, "Ehl-i Sünnet ve'l-Cemaat onlara reddiye yazmıştır."], [991.0, "Onlara —Allah Azze ve Celle'nin Kitabı'ndan ve Peygamberi ﷺ'in sünnetinden sonra— en büyük ve en muhteşem reddiyeyi yapanlardan biri, \"Şifâü'l-Alîl fî Mesâili'l-Hikme ve'l-Kazâ ve'l-Kader ve't-Ta'lîl\" adlı kitabında İmam İbnü'l-Kayyim rahimehullahtır."]]}, {"reader": false, "ar": [[1010.0, "وقد دلّت الأدلة الكثيرة على أن الله عز وجل لا يفعل إلا لحكمة،"], [1018.0, "كما قال الله عز وجل:"], [1020.8, "<span class=\"ayah\">﴿أَلَيْسَ اللَّهُ بِأَحْكَمِ الْحَاكِمِينَ﴾<\/span> [التين: 8]."], [1023.0, "وكلُّ آيةٍ تنتهي بالحكمة ـ بأن الله عز وجل حكيم ـ فإنها دالّةٌ على ذلك."], [1029.0, "وكلُّ آيةٍ فيها شيءٌ من أفعال الله عز وجل مقيّدًا بباء السببيّة فإنها دليلٌ على حكمته وعلّة فعله،"], [1040.0, "كقول الله عز وجل:"], [1042.8, "<span class=\"ayah\">﴿فَبِمَا رَحْمَةٍ مِّنَ اللَّهِ لِنتَ لَهُمْ﴾<\/span> [آل عمران: 159]؛"], [1047.0, "أي أن الله عز وجل خلق فيك اللين،"], [1050.0, "أي لأنه رحيمٌ خلق فيك اللين."]], "tr": [[1010.0, "Birçok delil, Allah Azze ve Celle'nin ancak bir hikmet için fiilde bulunduğunu göstermiştir."], [1016.2, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1019.7, "<span class=\"ayah\">﴿Allah hâkimlerin en hâkimi değil mi?﴾<\/span> [Tîn 8] Allah Azze ve Celle'nin hakîm olduğunu bildiren hikmetle biten her ayet buna delâlet eder."], [1028.5, "Allah Azze ve Celle'nin fiillerinden birinin sebebiyet bildiren \"bâ\" harfiyle kayıtlandığı her ayet de O'nun hikmetine ve fiilinin illetine delildir."], [1038.5, "Allah Azze ve Celle'nin şu sözü gibi:"], [1041.4, "<span class=\"ayah\">﴿Allah'tan bir rahmet sebebiyle onlara yumuşak davrandın.﴾<\/span> [Âl-i İmrân 159] Yani Allah Azze ve Celle sende yumuşaklığı yarattı;"], [1049.6, "yani O rahîm olduğu için sende yumuşaklığı yarattı."]]}, {"reader": false, "ar": [[1056.0, "وكلُّ لامٍ تعليليّةٍ في شيءٍ من أفعال الله فهي دليلٌ على هذه الحكمة:"], [1065.0, "<span class=\"ayah\">﴿وَمَا جَعَلْنَا الْقِبْلَةَ الَّتِي كُنتَ عَلَيْهَا إِلَّا لِنَعْلَمَ﴾<\/span> [البقرة: 143]،"], [1070.0, "وهذا كثيرٌ دورانُه في القرآن."], [1073.0, "بل وكلُّ «كي» أو «لكيلا» في القرآن الكريم فإنها دالّةٌ على أن أفعال الله عز وجل لحكمة،"], [1085.0, "كما قال الله عز وجل:"], [1087.2, "<span class=\"ayah\">﴿لِّكَيْلَا تَأْسَوْا عَلَىٰ مَا فَاتَكُمْ وَلَا تَفْرَحُوا بِمَا آتَاكُمْ﴾<\/span> [الحديد: 23]،"], [1091.0, "وقال الله عز وجل:"], [1093.2, "<span class=\"ayah\">﴿كَيْ لَا يَكُونَ دُولَةً بَيْنَ الْأَغْنِيَاءِ مِنكُمْ﴾<\/span> [الحشر: 7]."], [1097.4, "والأدلةُ في هذه المسألة كثيرة."]], "tr": [[1056.0, "Allah'ın fiillerinden birindeki ta'lîl (gerekçe) bildiren her \"lâm\" da bu hikmete delildir:"], [1061.8, "<span class=\"ayah\">﴿Üzerinde bulunduğun kıbleyi ancak … bilelim diye (kıble) yaptık.﴾<\/span> [Bakara 143] Bu, Kur'an'da çokça geçer."], [1070.6, "Hatta Kur'ân-ı Kerîm'deki her \"key\" ya da \"li-keylâ\" (…sın diye / …masın diye) Allah Azze ve Celle'nin fiillerinin bir hikmet için olduğuna delâlet eder."], [1083.9, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1086.6, "<span class=\"ayah\">﴿Elinizden çıkana üzülmeyesiniz ve size verdiğine şımarmayasınız diye.﴾<\/span> [Hadîd 23] Allah Azze ve Celle şöyle de buyurur:"], [1093.2, "<span class=\"ayah\">﴿…sizin zenginleriniz arasında dolaşan bir servet olmasın diye.﴾<\/span> [Haşr 7] Bu meseledeki deliller çoktur."]]}, {"reader": false, "ar": [[1101.0, "بل لم تقف عند دليل النقل،"], [1104.0, "فإن حكمة الله دلّ عليها دليلُ العقل كذلك."], [1108.0, "فإن الفعل إن كان صادرًا لا عن حكمةٍ فإنه يسمّى في لغة العرب عبثًا وسُدًى،"], [1116.0, "والله عز وجل منزّهٌ عن فعل العبث،"], [1120.0, "ومنزّهٌ عن وصف فعله بالسُّدى،"], [1123.0, "كما قال الله عز وجل:"], [1124.0, "<span class=\"ayah\">﴿أَيَحْسَبُ الْإِنسَانُ أَن يُتْرَكَ سُدًى﴾<\/span> [القيامة: 36]،"], [1128.0, "وقال الله عز وجل:"], [1130.3, "<span class=\"ayah\">﴿أَفَحَسِبْتُمْ أَنَّمَا خَلَقْنَاكُمْ عَبَثًا وَأَنَّكُمْ إِلَيْنَا لَا تُرْجَعُونَ ۝ فَتَعَالَى اللَّهُ﴾<\/span> [المؤمنون: 115-116]؛"], [1136.0, "أي تعالى عن فعل الشيء الذي ليس من ورائه حكمةٌ ولا مصلحةٌ ولا غاية."]], "tr": [[1101.0, "Hatta (deliller) nakil delilinde kalmamıştır;"], [1103.0, "Allah'ın hikmetine akıl delili de delâlet etmiştir."], [1106.0, "Çünkü bir fiil bir hikmete dayanmadan sâdır oluyorsa, Arap dilinde buna \"abes\" ve \"südâ\" (başıboş, boş) denir."], [1114.7, "Allah Azze ve Celle abes iş yapmaktan münezzehtir, fiilinin başıboşlukla nitelenmesinden de münezzehtir."], [1121.2, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1123.6, "<span class=\"ayah\">﴿İnsan, başıboş bırakılacağını mı sanır?﴾<\/span> [Kıyâme 36] Allah Azze ve Celle şöyle de buyurur:"], [1131.7, "<span class=\"ayah\">﴿Sizi boşuna yarattığımızı ve bize döndürülmeyeceğinizi mi sandınız? Allah yücedir…﴾<\/span> [Mü'minûn 115-116] Yani arkasında hiçbir hikmet, maslahat ve gaye bulunmayan bir şeyi yapmaktan yücedir."]]}, {"reader": false, "ar": [[1143.0, "واعلم ـ رحمك الله تعالى ـ أنه ليس من شرط وجودها عقلُك إيّاها؛"], [1151.0, "فإن كثيرًا من أفعال الله عز وجل الكونية والشرعية تعجز العقولُ بمدركاتها أن تتصوّر الحكمة فيها على وجه التفصيل."], [1161.0, "ولا يستطيع العقلُ البشري ـ مهما عظُم إدراكه،"], [1164.9, "ومهما كان خارقًا ـ أن يتصوّر كلَّ حكمة الله عز وجل في فعله الكوني،"], [1172.1, "أو في تقديره، أو في أفعاله الشرعية."], [1176.0, "فعدمُ عقلك لشيءٍ من الحكمة في بعض المخلوقات ليس دليلًا على عدم حكمة الله في خلقها وإيجادها،"], [1185.0, "فإيّاك أن تجعل تلازمًا بين هذا وهذا،"], [1188.8, "كما سيأتينا في الكليات اللاحقة إن شاء الله."]], "tr": [[1143.0, "Bil ki —Allah sana rahmet etsin— (hikmetin) var olmasının şartı senin onu akletmen (kavraman) değildir."], [1152.6, "Çünkü Allah Azze ve Celle'nin kevnî ve şer'î fiillerinin çoğunda akıllar, idrak güçleriyle, oradaki hikmeti tafsilatlı şekilde tasavvur etmekten acizdir."], [1162.7, "İnsan aklı —idraki ne kadar büyük, ne kadar olağanüstü olursa olsun— Allah Azze ve Celle'nin kevnî fiilindeki, takdirindeki ya da şer'î fiillerindeki bütün hikmeti tasavvur edemez."], [1177.1, "Bazı mahlûkattaki hikmetten bir şeyi akledememen, Allah'ın onları yaratmasında ve var etmesinde hikmet bulunmadığına delil değildir."], [1185.0, "Sakın bununla onun arasında bir telâzüm (zorunlu bağ) kurma;"], [1189.9, "nitekim inşallah sonraki külliyelerde bu gelecek."]]}, {"reader": false, "ar": [[1193.0, "قال الإمام ابن تيمية رحمه الله:"], [1198.0, "«وعلى هذا فكلُّ ما فعله علمنا أن له فيه حكمة، وهذا يكفينا»."], [1209.0, "يعني يقول ابن تيمية:"], [1211.0, "إذا فاتك معرفةُ الحكمة التفصيلية،"], [1214.0, "فإن عقلك يؤمن بالحكمة الإجمالية،"], [1217.0, "وأن هذا الربَّ الذي خلق هذا الشيء ـ الذي لم أعرف حكمته ـ ربٌّ حكيمٌ عليمٌ خبيرٌ متقنٌ لصنعته."]], "tr": [[1193.0, "İmam İbn Teymiyye rahimehullah şöyle der:"], [1196.8, "\"Buna göre O'nun yaptığı her şeyde bir hikmeti olduğunu bildik;"], [1203.6, "bu bize yeter.\" Yani İbn Teymiyye şunu söylüyor:"], [1210.5, "Tafsilatlı hikmeti bilmek sana kaçtıysa, aklın icmâlî (genel) hikmete iman eder;"], [1216.4, "hikmetini bilmediğim bu şeyi yaratan bu Rabbin hakîm, alîm, habîr ve sanatını sağlam yapan bir Rab olduğuna iman eder."]]}]}, {"ts": "20:26", "title": "4. Külliye (devam): İcmâlî hikmet; hayvanların ve çocukların acıları", "paras": [{"reader": false, "ar": [[1226.0, "قال رحمه الله: «وعلى هذا فكلُّ ما فعله علمنا أن له فيه حكمة، وهذا يكفينا من حيث الجملة وإن لم نعرف التفصيل، وعدمُ علمنا بتفصيل حكمته بمنزلة عدم علمنا بكيفيّته في ذاته»."], [1245.0, "فكما أننا لا نعلم كيفية ذاته ـ ومع عدم علمنا فهي موجودة ـ فكذلك إذا جهلنا شيئًا من حكمة خلقه فهذا يرجع إلى عجز عقولنا،"], [1259.1, "لكنّ الحكمة في ذاتها موجودة."]], "tr": [[1226.0, "(İbn Teymiyye) rahimehullah şöyle der:"], [1229.8, "\"Buna göre O'nun yaptığı her şeyde bir hikmeti olduğunu bildik;"], [1234.2, "tafsilatını bilmesek de bu bize genel olarak yeter."], [1240.1, "O'nun hikmetinin tafsilatını bilmememiz, zâtındaki keyfiyetini bilmememiz mesabesindedir.\" Nasıl ki zâtının keyfiyetini bilmiyoruz —bilmememize rağmen o mevcuttur—, aynı şekilde yaratmasındaki hikmetten bir şeyi bilmezsek bu aklımızın acizliğine döner; ama hikmetin kendisi mevcuttur."]]}, {"reader": false, "ar": [[1262.0, "وهذا من باب تعظيم الله عز وجل؛"], [1266.0, "فإنه ما قدر اللهَ حقَّ قدره من يجعل أفعاله خارجةً عن حكمةٍ أو مصلحةٍ وغاية،"], [1274.0, "فإن هذا من أفعال السفهاء أو المجانين أو الأطفال."], [1280.0, "فإن الطفل قد يتصرّف بأشياء ليس وراءها حكمة،"], [1284.0, "وكذلك السفيه يبذّر أمواله بلا حكمةٍ ومصلحةٍ ترجع عليه لا دينيةٍ ولا دنيوية،"], [1291.0, "وكذلك المجنون في تصرّفاته أو أقواله."], [1294.0, "ولا يجوز أن نظنّ في الله عز وجل شيئًا من ذلك."]], "tr": [[1262.0, "Bu, Allah Azze ve Celle'yi tazim etmek kabilindendir."], [1266.0, "Çünkü O'nun fiillerini bir hikmetin, maslahatın ve gayenin dışında sayan kimse Allah'ı hakkıyla takdir etmemiştir;"], [1273.5, "zira bu, sefihlerin, delilerin ya da çocukların fiillerindendir."], [1278.7, "Çocuk bazen arkasında hiçbir hikmet olmayan şeyler yapar."], [1282.5, "Sefih de mallarını, kendisine dönecek dinî ya da dünyevî hiçbir hikmet ve maslahat olmaksızın saçıp savurur."], [1290.5, "Deli de davranışlarında ya da sözlerinde böyledir."], [1294.0, "Allah Azze ve Celle hakkında bunlardan herhangi birini zannetmek caiz değildir."]]}, {"reader": false, "ar": [[1299.0, "حتى وإن رأينا الله عز وجل يفعل الشيءَ الذي هو في مقاييس البشرية شرٌّ،"], [1307.0, "كتأليم البهيمة، أو الآلام والأوجاع التي يُصاب بها الأطفال مع أنهم لا عن ذنبٍ ولا عن تكليف،"], [1320.0, "فنقول: هذا وإن كان في مقاييس البشرية ضررًا محضًا،"], [1324.0, "لكن يبقى أن الإيمان يقضي على هذا المقياس بأن الذي قدّر هذا وأوجده ربٌّ حكيمٌ رحيم."]], "tr": [[1299.0, "Allah Azze ve Celle'nin, beşerî ölçülerde kötü olan bir şeyi yaptığını görsek bile —hayvana acı çektirmek ya da çocukların, bir günahtan ve bir mükellefiyetten dolayı olmadığı hâlde maruz kaldıkları acılar ve ağrılar gibi— deriz ki:"], [1321.0, "Bu, beşerî ölçülerde saf bir zarar olsa da, iman bu ölçünün üzerine hükmeder:"], [1326.5, "Bunu takdir eden ve var eden, hakîm ve rahîm bir Rab'dir."]]}, {"reader": false, "ar": [[1332.0, "وإن الملاحدةَ وفلاسفتَهم يجعلون آلامَ البهائم مسبّةً في أفعال الله عز وجل،"], [1340.0, "ولذلك يُحاجّون أهلَ التوحيد والإيمان في مسألة الحكمة والتعليل ببيان الحكمة في آلام البهائم،"], [1351.0, "أو المصائب التي تجري على البهائم في موت ولدها،"], [1356.0, "أو في مرض جسدها،"], [1359.0, "أو في الحوادث التي تصيبها،"], [1361.0, "وكذلك آلام الأطفال. ولكن يبقى أن المؤمن يقضي على هذا المقياس بأن الذي أوجد ذلك وقدّره هو الله عز وجل،"], [1371.8, "الحكيمُ اسمًا، وذو الحكمة المطلقة المتناهية صفةً."]], "tr": [[1332.0, "Mülhidler ve onların filozofları, hayvanların acılarını Allah Azze ve Celle'nin fiillerinde bir kusur (sövgü sebebi) sayarlar."], [1341.3, "Bu yüzden hikmet ve ta'lîl meselesinde tevhid ve iman ehliyle, hayvanların acılarındaki, yavrusunun ölmesinde, bedeninin hastalanmasında ya da başına gelen kazalarda hayvanların maruz kaldığı musibetlerdeki hikmeti açıklamalarını isteyerek tartışırlar;"], [1359.0, "çocukların acıları da böyledir. Fakat mü'min bu ölçünün üzerine şöyle hükmeder:"], [1364.2, "Bunu var eden ve takdir eden, isim olarak el-Hakîm, sıfat olarak da mutlak ve son derece kâmil hikmet sahibi olan Allah Azze ve Celle'dir."]]}, {"reader": false, "ar": [[1375.0, "انتبهوا! هذا، هذا من أهمّ الأشياء،"], [1377.0, "الله يجعلنا وإيّاكم من أهل الإيمان."], [1383.0, "ولذلك ينبغي لنا أن نجزم بأن أفعال الربّ تخالف أفعالَ العباد،"], [1390.0, "ومراداتُ الربّ في أفعاله تختلف عن مرادات العباد في أفعالهم."], [1396.0, "فالذي يريد أن يقيس نتائجَ أفعال الله على نتائج أفعال عباده،"], [1405.0, "هذا هو الذي يعترض عنده مثلُ هذه الأشياء."]], "tr": [[1375.0, "Dikkat edin! Bu, bu en önemli şeylerdendir;"], [1377.0, "Allah bizi ve sizi iman ehlinden kılsın."], [1383.6, "Bu yüzden Rabbin fiillerinin kulların fiillerinden farklı olduğunu, Rabbin fiillerindeki muradlarının kulların fiillerindeki muradlarından farklı olduğunu kesin olarak bilmemiz gerekir."], [1396.0, "Allah'ın fiillerinin sonuçlarını kullarının fiillerinin sonuçlarına kıyas etmek isteyen kimse, işte bu gibi şeyler onun karşısına (itiraz olarak) çıkar."]]}, {"reader": false, "ar": [[1409.0, "فلو رأينا إنسانًا يعذّب بهيمةً لكان قبيحًا منك ـ كإنسان ـ أن يصدر منك هذا الفعل بلا حكمة."], [1416.0, "فإيّاك أن تجعل ما يلزم على أفعالك لازمًا على أفعال ربك،"], [1423.0, "فإن الله ليس كمثله شيء،"], [1427.0, "ولا يُسأل عز وجل عمّا يفعل."], [1430.0, "ولو أن إنسانًا دمّر بيته بنفسه لكان قبيحًا منه باعتباره بشرًا،"], [1436.0, "ففي مقاييس البشرية هذا خطأ؛"], [1439.0, "ولكن لو أن الله عز وجل دمّر شيئًا من أرضه ومملكته لكان حسنًا منه،"], [1444.5, "ولا يفعل ذلك إلا عن حكمةٍ وغاية."]], "tr": [[1409.0, "Bir insanın bir hayvana eziyet ettiğini görsek, (derdik ki) bir insan olarak bu fiilin senden hikmetsiz olarak sâdır olması çirkin olurdu."], [1416.6, "Sakın kendi fiillerin için lâzım gelen şeyi Rabbinin fiilleri için de lâzım sayma;"], [1423.8, "çünkü Allah'ın benzeri hiçbir şey yoktur ve Azze ve Celle yaptığından sorguya çekilmez."], [1430.5, "Bir insan kendi evini kendi eliyle yıksa, bir beşer olarak bu ondan çirkin olurdu;"], [1436.6, "beşerî ölçülerde bu bir hatadır."], [1439.0, "Fakat Allah Azze ve Celle yeryüzünden ve mülkünden bir şeyi yok etse, bu O'ndan güzeldir;"], [1444.0, "O bunu ancak bir hikmet ve gaye için yapar."]]}, {"reader": false, "ar": [[1448.0, "فإذن ليس كلُّ قبيحٍ من العبد يكون قبيحًا من الله،"], [1452.0, "ولا كلُّ شيءٍ حسنٍ من العبد يكون حسنًا من الله."], [1457.0, "فإن الزواج في مقاييس البشرية شيءٌ حسن،"], [1461.0, "والولادة في مقاييس البشرية شيءٌ حسن،"], [1466.0, "والحاجة إلى الآخرين والتعاون فيما بينهم على تنجيز أمورهم شيءٌ حسن،"], [1472.0, "ولكنه ليس بحسنٍ في حقّ الله عز وجل،"], [1474.0, "لغناه عن كلّ أحد."], [1475.0, "وليس كلُّ قبيحٍ يصدر من المخلوق لا بدّ أن يكون قبيحًا إذا صدر ما هو من جنسه في حقّ الخالق عز وجل."]], "tr": [[1448.0, "Demek ki kuldan çirkin olan her şey Allah'tan da çirkin olmaz;"], [1452.0, "kuldan güzel olan her şey de Allah'tan güzel olmaz."], [1456.5, "Evlilik beşerî ölçülerde güzel bir şeydir;"], [1459.3, "doğurmak (çocuk sahibi olmak) beşerî ölçülerde güzel bir şeydir;"], [1466.0, "başkalarına ihtiyaç duymak ve işlerini bitirmek için aralarında yardımlaşmak güzel bir şeydir."], [1472.0, "Fakat bu, herkesten müstağnî olduğu için Allah Azze ve Celle hakkında güzel değildir."], [1475.5, "Mahlûktan sâdır olan her çirkin şeyin, onun cinsinden bir şey Hâlik Azze ve Celle hakkında sâdır olduğunda da mutlaka çirkin olması gerekmez."]]}, {"reader": false, "ar": [[1486.0, "فإذن مبدأُ هذه الأسئلة في إيلام الأطفال والبهائم مبنيٌّ أصلًا على مقارنة مقاييس أفعال الله بأفعال عباده،"], [1502.0, "وهذا هو عينُ الخلل."], [1504.0, "ولكن لو آمنوا بأن الله ليس كمثله شيءٌ ـ لا في ذاته،"], [1508.0, "ولا في أسمائه، ولا في صفاته،"], [1512.0, "ولا في أفعاله ـ حينئذٍ يعلمون أن الله لم يختر لهذه البهيمة هذا النوعَ من الألم،"], [1518.0, "ولا لهذا الطفل هذا النوعَ من الألم،"], [1521.0, "إلا لحكمةٍ يعلمها الله عز وجل."]], "tr": [[1486.0, "Demek ki çocuklara ve hayvanlara acı çektirilmesiyle ilgili bu soruların çıkış noktası, aslında Allah'ın fiillerinin ölçülerini kullarının fiilleriyle karşılaştırmaya dayanır;"], [1503.0, "işte asıl bozukluk budur. Fakat Allah'ın —ne zâtında, ne isimlerinde, ne sıfatlarında, ne de fiillerinde— benzeri hiçbir şey olmadığına iman etselerdi, o zaman Allah'ın bu hayvan için bu tür acıyı, bu çocuk için de bu tür acıyı ancak Allah Azze ve Celle'nin bildiği bir hikmet için seçtiğini bilirlerdi."]]}]}, {"ts": "25:23", "title": "4. Külliye (sonu): Hızır kıssası; Allah'ın fiillerine itiraz etmemek", "paras": [{"reader": false, "ar": [[1523.0, "كما أن الله نبّهنا في القرآن بقصة الخضر؛"], [1527.0, "الخضرُ لمّا قتل الغلام،"], [1530.0, "فإن قتل الغلام ـ الذي لم يصدر منه أيُّ شيءٍ ـ قبيحٌ في مقاييس البشر،"], [1536.0, "ولذلك ـ أي لقُبحه ـ أنكر موسى عليه الصلاة والسلام هذا الفعلَ على الخضر."], [1543.0, "ولكن لأن الخضر نبيٌّ يُوحى إليه صار حسنًا فعلُه،"], [1551.0, "لأن الله عز وجل علّل ذلك بقوله:"], [1554.0, "<span class=\"ayah\">﴿وَأَمَّا الْغُلَامُ فَكَانَ أَبَوَاهُ مُؤْمِنَيْنِ فَخَشِينَا أَن يُرْهِقَهُمَا طُغْيَانًا وَكُفْرًا ۝ فَأَرَدْنَا أَن يُبْدِلَهُمَا رَبُّهُمَا خَيْرًا مِّنْهُ زَكَاةً وَأَقْرَبَ رُحْمًا﴾<\/span> [الكهف: 80-81] <span class=\"note\">(Şeyh «وأقرب رحمة» diyor)<\/span>."], [1565.0, "إذن دفع عنهم المفسدةَ الخالصة أو الراجحة،"], [1568.0, "ووعدهم بوجود من هو خيرٌ منه."]], "tr": [[1523.0, "Nitekim Allah Kur'an'da Hızır kıssasıyla bize bunu hatırlattı."], [1526.0, "Hızır çocuğu öldürdüğünde —hiçbir şey sâdır olmamış bir çocuğu öldürmek beşerî ölçülerde çirkindir— bu yüzden, yani çirkinliği sebebiyle, Mûsâ aleyhissalâtu vesselâm bu fiili Hızır'a karşı yadırgadı."], [1537.8, "Fakat Hızır kendisine vahyedilen bir peygamber olduğu için fiili güzel oldu."], [1543.0, "Çünkü Allah Azze ve Celle bunun gerekçesini şu sözüyle açıkladı:"], [1551.0, "<span class=\"ayah\">﴿Çocuğa gelince, onun anne babası mü'min kimselerdi. Onları azgınlık ve küfre sürüklemesinden korktuk. İstedik ki Rableri onlara, ondan daha temiz ve daha merhametli olanını versin.﴾<\/span> [Kehf 80-81] Demek ki onlardan halis ya da ağır basan mefsedeti defetti ve onlara ondan daha hayırlı olanın var olacağını va'detti."]]}, {"reader": false, "ar": [[1571.0, "لكن لأن هذه المقاييس الربّانية الغيبية تخفى علينا ـ لضعف علمنا ومُدركاتنا،"], [1578.0, "وعدم علمنا بالغيب ـ حينئذٍ نستنكر الفعلَ استنكارًا ظاهرًا،"], [1583.0, "لكن لا ندري ما يقف وراءه من الأمور التي لا يعلمها على التفصيل إلا الله."], [1591.0, "فهذا فيصلُ التسليم في أفعاله من معارضة أفعاله."], [1596.0, "إيّاك أن تعترض على شيءٍ من أفعال الله عز وجل:"], [1599.0, "وما حكمة الله في هذا؟"], [1601.0, "طفلٌ يبكي طول الليل بسبب ألمه،"], [1604.0, "ما حكمة الله في هذا؟ فإيّاك!"]], "tr": [[1571.0, "Fakat bu rabbânî gaybî ölçüler —ilmimizin ve idrak güçlerimizin zayıflığı ve gaybı bilmememiz sebebiyle— bize gizli kaldığı için, o zaman fiili zahiren yadırgarız;"], [1584.0, "ama arkasında, tafsilatını ancak Allah'ın bildiği hangi işlerin durduğunu bilmeyiz."], [1588.7, "İşte bu, O'nun fiillerine teslim olmakla O'nun fiillerine muâraza (itiraz) etmeyi birbirinden ayıran ölçüdür."], [1596.3, "Sakın Allah Azze ve Celle'nin fiillerinden herhangi birine itiraz etme:"], [1599.4, "\"Allah'ın bunda ne hikmeti var?"], [1601.0, "Bir çocuk acısından bütün gece ağlıyor;"], [1604.0, "Allah'ın bunda ne hikmeti var?\" Sakın!"]]}, {"reader": false, "ar": [[1609.0, "فمبدأُ ذلك ـ أيها الأحبّة ـ هو إدخالُ أفعال الله عز وجل مع أفعال العباد في نتائجها ومقاييسها،"], [1620.0, "والله <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> في أفعاله <span class=\"ayah\">﴿وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> [الشورى: 11]."], [1623.0, "فلا يخلق الله عز وجل شيئًا إلا لحكمة،"], [1628.1, "ولا يعطي إلا لحكمة،"], [1630.6, "ولا يمنع إلا لحكمة،"], [1633.2, "ولا يُصيب بمصيبةٍ ـ أيًّا كان جنسها،"], [1637.0, "وأيًّا كان محلّها ـ إلا لحكمة."], [1642.0, "ولا يُصيب بالكروب والآلام إلا لحكمة،"], [1646.0, "ولا بالأمراض والأوبئة إلا لحكمة،"], [1651.0, "ولا بالفقر إلا لحكمة؛"], [1653.0, "بل كلُّ أقدار الله عز وجل لا تكون إلا عن حكمةٍ وغاية."]], "tr": [[1609.0, "Sevgili kardeşlerim, bunun çıkış noktası, Allah Azze ve Celle'nin fiillerini, sonuçları ve ölçüleri bakımından kulların fiilleriyle aynı yere koymaktır."], [1618.1, "Oysa Allah, fiillerinde (de) <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur. O işitendir, görendir.﴾<\/span> [Şûrâ 11] Allah Azze ve Celle hiçbir şeyi ancak bir hikmet için yaratır;"], [1628.1, "ancak bir hikmet için verir, ancak bir hikmet için esirger."], [1633.2, "Cinsi ne olursa olsun, yeri neresi olursa olsun, bir musibeti ancak bir hikmet için isabet ettirir."], [1642.7, "Sıkıntıları ve acıları ancak bir hikmet için, hastalıkları ve salgınları ancak bir hikmet için, fakirliği ancak bir hikmet için verir."], [1654.0, "Bilakis Allah Azze ve Celle'nin bütün takdirleri ancak bir hikmete ve gayeye dayanır."]]}, {"reader": false, "ar": [[1659.0, "فإن قلت: وما دخلُ هذه الكلية في قواعد الربوبية؟"], [1664.0, "نقول: لأنها تتكلّم عن الواجب اعتقادُه في أفعال الله،"], [1669.0, "وكلُّ شيءٍ يتعلّق بالكلام على فعلٍ من أفعال الله فهو من قواعد الربوبية،"], [1676.0, "من قواعد الربوبية. الله أكبر!"]], "tr": [[1659.0, "Eğer \"Bu külliyenin rubûbiyyet kaideleriyle ne ilgisi var?\" dersen, deriz ki:"], [1665.1, "Çünkü o, Allah'ın fiilleri hakkında inanılması vâcip olan şeyden bahseder."], [1670.5, "Allah'ın fiillerinden bir fiil hakkında konuşmakla ilgili her şey rubûbiyyet kaidelerindendir, rubûbiyyet kaidelerindendir. Allahu ekber!"]]}]}, {"ts": "28:05", "title": "Ara söz · 5. Külliye: Her mahlûktaki itkan, Yaratıcısının varlığına ve kemaline delâlet eder", "paras": [{"reader": false, "ar": [[1685.0, "ومن الكليات أيضًا… ما أسرعَ اتّهامَ ابن آدم لربه في أيّ شيءٍ يخالف مرادَه!"], [1697.0, "يعني ما يتّهم نفسه بشيء،"], [1698.7, "لا، يتّهم ربه على طول:"], [1701.0, "«أنا وش سوّيت؟ أنا وش قصّرت فيه؟ مسكين فلان، ما يستاهل!» على طول، مباشرةً يتّهمون الله."]], "tr": [[1685.0, "Külliyelerden biri de… İnsanoğlu kendi muradına aykırı olan her şeyde Rabbini ne çabuk suçluyor!"], [1697.0, "Yani kendini hiçbir şeyle suçlamıyor;"], [1698.7, "hayır, doğrudan Rabbini suçluyor: \"Ben ne yaptım ki?"], [1702.0, "Neyi eksik yaptım ki? Zavallı falan, bunu hak etmiyor!\" Hemen, doğrudan Allah'ı suçluyorlar."]]}, {"reader": false, "ar": [[1710.0, "طيب، ومن الكليات أيضًا:"], [1714.0, "<b>كلُّ مخلوقٍ فإنه يحمل من كمال الإتقان ما يدلّ على وجود خالقه وكماله في ذاته وصفاته وأفعاله.<\/b> يلّا،"], [1727.7, "من يحفظها؟ كل مخلوقٍ فيحمل من كمال الإتقان ما يدلّ على وجود خالقه ـ هذا أول شيء ـ وكماله في ذاته وصفاته وأفعاله."], [1745.0, "أعيدها مرةً ثالثة: كل مخلوقٍ فإنه يحمل من كمال الإتقان ما يدلّ على وجود خالقه وكماله في ذاته وصفاته وأفعاله."]], "tr": [[1710.0, "Peki, külliyelerden biri de şudur:"], [1715.1, "<b>5. külliye: Her mahlûk, Yaratıcısının varlığına ve O'nun zâtında, sıfatlarında ve fiillerindeki kemaline delâlet edecek kadar mükemmel bir itkan (sağlam yapılış) taşır.<\/b> Haydi, kim ezberledi?"], [1737.8, "Her mahlûk, Yaratıcısının varlığına delâlet edecek kadar mükemmel bir itkan taşır —bu birinci şey— ve O'nun zâtında, sıfatlarında ve fiillerindeki kemaline."], [1755.6, "Üçüncü kez tekrar ediyorum: (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1761.0, "أقول وبالله التوفيق: وهذا من مناهج القرآن في تقرير كمال ربوبية الله عز وجل،"], [1769.0, "وكمال ألوهيته، وكماله في ذاته وصفاته وأفعاله:"], [1775.0, "أنه يستدلّ للناس بحسن صنعته،"], [1778.3, "وأنه أتقنها على أعظم الوجوه التي يعجز هؤلاء عن إيجاد مثلها."], [1788.0, "فإتقانُ الصنعة دليلٌ على وجود صانعها،"], [1791.0, "إذ إن المعدوم لا يمكن أن يُوجِد الشيء،"], [1795.0, "فضلًا عن كونه يُتقنه بعد وجوده."], [1798.0, "ولذلك قال الله عز وجل:"], [1801.6, "<span class=\"ayah\">﴿فَتَبَارَكَ اللَّهُ أَحْسَنُ الْخَالِقِينَ﴾<\/span> [المؤمنون: 14]."]], "tr": [[1761.0, "Tevfik Allah'tandır, derim ki: Bu, Kur'an'ın Allah Azze ve Celle'nin rubûbiyyetinin kemalini, ulûhiyyetinin kemalini ve zâtında, sıfatlarında ve fiillerindeki kemalini ortaya koymadaki metotlarındandır:"], [1772.0, "İnsanlara sanatının güzelliğiyle ve onu, bunların benzerini var etmekten aciz kaldığı en muazzam şekilde sağlam yaptığıyla delil getirir."], [1783.0, "Sanatın sağlamlığı, onu yapanın varlığına delildir;"], [1788.5, "çünkü yok olan bir şey bir şeyi var edemez, var olduktan sonra onu sağlam yapması şöyle dursun."], [1795.5, "Bu yüzden Allah Azze ve Celle şöyle buyurmuştur:"], [1798.7, "<span class=\"ayah\">﴿Yaratanların en güzeli olan Allah ne yücedir!﴾<\/span> [Mü'minûn 14]"]]}]}, {"ts": "30:06", "title": "5. Külliye (devam): Yaratılıştaki güzellik ve itkana dair ayetler", "paras": [{"reader": false, "ar": [[1806.0, "وقال الله عز وجل:"], [1808.6, "<span class=\"ayah\">﴿صُنْعَ اللَّهِ الَّذِي أَتْقَنَ كُلَّ شَيْءٍ﴾<\/span> [النمل: 88]،"], [1812.5, "وقال الله عز وجل:"], [1815.1, "<span class=\"ayah\">﴿الَّذِي أَحْسَنَ كُلَّ شَيْءٍ خَلَقَهُ﴾<\/span> [السجدة: 7]،"], [1822.0, "ويقول الله تبارك وتعالى:"], [1824.8, "<span class=\"ayah\">﴿لَقَدْ خَلَقْنَا الْإِنسَانَ فِي أَحْسَنِ تَقْوِيمٍ﴾<\/span> [التين: 4]،"], [1831.0, "وقال الله عز وجل:"], [1834.0, "<span class=\"ayah\">﴿بَدِيعُ السَّمَاوَاتِ وَالْأَرْضِ﴾<\/span> [البقرة: 117]، وقال الله عز وجل:"], [1840.7, "<span class=\"ayah\">﴿هَٰذَا خَلْقُ اللَّهِ فَأَرُونِي مَاذَا خَلَقَ الَّذِينَ مِن دُونِهِ﴾<\/span> [لقمان: 11]؛"], [1848.0, "وغيرها من النصوص الدالّة على لفت الأذهان إلى إحسان الخلق وإتقانه."]], "tr": [[1806.0, "Allah Azze ve Celle şöyle buyurur:"], [1808.6, "<span class=\"ayah\">﴿Her şeyi sapasağlam yapan Allah'ın sanatı.﴾<\/span> [Neml 88] Allah Azze ve Celle şöyle buyurur:"], [1815.1, "<span class=\"ayah\">﴿O, yarattığı her şeyi güzel yapandır.﴾<\/span> [Secde 7] Allah Tebâreke ve Teâlâ şöyle buyurur:"], [1825.5, "<span class=\"ayah\">﴿Andolsun, biz insanı en güzel biçimde yarattık.﴾<\/span> [Tîn 4] Allah Azze ve Celle şöyle buyurur:"], [1835.5, "<span class=\"ayah\">﴿Gökleri ve yeri örneksiz yaratandır.﴾<\/span> [Bakara 117] Allah Azze ve Celle şöyle buyurur:"], [1842.8, "<span class=\"ayah\">﴿İşte bu, Allah'ın yarattığıdır. Şimdi O'ndan başkalarının ne yarattığını bana gösterin.﴾<\/span> [Lokmân 11] Ve zihinleri yaratılışın güzelliğine ve sağlamlığına çeken diğer naslar."]]}, {"reader": false, "ar": [[1855.0, "ليستدلّ به العبدُ على أن وراء هذا الإتقان العظيم،"], [1860.0, "وجمالِ الصنعة وحسنها، ربًّا موجودًا،"], [1863.1, "قادرًا، عليمًا، خبيرًا، حكيمًا،"], [1868.0, "لا يخلق الشيء عبثًا،"], [1871.0, "ولا يُوجده سُدًى، ويتحدّى بحسن صنعته وخلقه الآخرين،"], [1880.0, "سواءٌ العابد أو المعبود،"], [1884.0, "كما قال: <span class=\"ayah\">﴿فَأَرُونِي مَاذَا خَلَقَ الَّذِينَ مِن دُونِهِ﴾<\/span> <span class=\"note\">(Şeyh «من دوني» diyor)<\/span>؛"], [1888.0, "أي الذين تعبدونهم من دوني،"], [1891.0, "أروني خلقَهم وإبداعهم في خلقهم."], [1893.0, "فحسنُ الصنعة دليلٌ على كلّ ذلك:"], [1899.0, "على أن وراءها ربًّا موجودًا،"], [1902.0, "وأنه كاملٌ في ذاته،"], [1904.4, "وكاملٌ في صفاته، وكاملٌ في أفعاله."]], "tr": [[1855.0, "(Bunlar,) kul bu muazzam sağlamlığın, sanatın güzelliğinin ve inceliğinin ardında;"], [1859.4, "var olan, kudretli, alîm, habîr, hakîm;"], [1862.0, "hiçbir şeyi abes olarak yaratmayan, hiçbir şeyi başıboş var etmeyen ve sanatının ve yaratmasının güzelliğiyle —ibadet eden olsun, ibadet edilen olsun— başkalarına meydan okuyan bir Rab bulunduğuna delil getirsin diyedir."], [1886.0, "Nitekim şöyle buyurmuştur: <span class=\"ayah\">﴿Şimdi O'ndan başkalarının ne yarattığını bana gösterin.﴾<\/span> Yani benden başka ibadet ettiklerinizin yarattıklarını ve yaratmalarındaki sanatlarını bana gösterin."], [1896.1, "Sanatın güzelliği bütün bunlara delildir:"], [1900.2, "Ardında var olan bir Rab bulunduğuna, O'nun zâtında kâmil, sıfatlarında kâmil ve fiillerinde kâmil olduğuna."]]}, {"reader": false, "ar": [[1908.0, "ولو رأيتَ الأجرامَ السماوية وجمالها،"], [1911.1, "وزينةَ السماء بها، وأنها أفلاكٌ هائلةٌ عظيمةٌ لا يقدر قدرها ـ حجمًا وكثرةً ـ إلا الله،"], [1921.0, "تسير في نسقٍ بديعٍ ونظامٍ رائعٍ رفيع،"], [1924.5, "لا تستطيع البشرية ـ لو اختلّ نظامها ـ أن يُحكموه بعد ذلك."], [1929.0, "ولو رأيتَ إلى عالم الإنسان وما فيه من الحسن وإبداع الخلق،"], [1936.0, "بل ولو رأيت عالمَ الحيوان،"], [1938.9, "وعالمَ الجبال، وباطنَ الأرض،"], [1941.5, "وعالمَ الأجنّة، وعالمَ النمل،"], [1944.3, "وعالمَ الحيوانات، لوجدتَ فيه من إبداع الصنعة ما يدلّ قلبك ـ إن أراد الله بك خيرًا ـ على أن وراءها ربًّا عظيمًا وصانعًا مبدعًا."]], "tr": [[1908.0, "Gök cisimlerini, güzelliklerini ve göğün onlarla süslenişini görsen;"], [1912.4, "büyüklük ve çokluk bakımından değerini ancak Allah'ın bilebileceği devasa, muazzam felekler olduklarını, eşsiz bir düzen ve harika, yüce bir nizam içinde yürüdüklerini —nizamları bozulsa insanlığın onu bir daha düzene sokamayacağını— görsen;"], [1929.0, "insan âlemine, ondaki güzelliğe ve yaratılışın eşsizliğine baksan;"], [1934.1, "hatta hayvanlar âlemini, dağlar âlemini, yerin derinliklerini, ceninler âlemini, karıncalar âlemini ve hayvanlar âlemini görsen, onda sanatın öyle bir eşsizliğini bulursun ki —Allah sana hayır dilediyse— bu, kalbine onların ardında muazzam bir Rab ve eşsiz bir Sâni' (sanatkâr) bulunduğunu gösterir."]]}, {"reader": false, "ar": [[1958.0, "فالله عز وجل من باب إثبات ربوبيته يُثبت حسنَ صنعته،"], [1963.0, "ليدلّ القلوب على أنه المستحقّ للعبادة دون ما سواه."], [1966.9, "فلا بدّ من إظهار هذا المعنى أمام الناس،"], [1971.8, "ليستدلّوا بحسن صنعة الخلق على أن وراءها ربًّا يستحقّ أن يُعبد دون ما سواه."]], "tr": [[1958.0, "Allah Azze ve Celle, rubûbiyyetini isbat etmek kabilinden sanatının güzelliğini isbat eder ki kalplere, kendisinden başka hiçbir şeyin değil yalnız kendisinin ibadete layık olduğunu göstersin."], [1967.3, "Bu mananın insanların önünde ortaya konması şarttır ki yaratılıştaki sanatın güzelliğiyle, onun ardında kendisinden başkasına değil yalnız kendisine ibadet edilmeye layık bir Rab bulunduğuna delil getirsinler."]]}]}, {"ts": "32:59", "title": "6. Külliye: Mahlûktaki kusursuz her kemale Allah daha layıktır; üç kıyas türü", "paras": [{"reader": false, "ar": [[1979.0, "ومن الكليات أيضًا: كلُّ كمالٍ في المخلوق لا نقصَ فيه فالله أحقُّ أن يوصف به،"], [2006.0, "وكلُّ نقصٍ في المخلوق لا كمالَ فيه فالله أحقُّ أن يُنزَّه عنه. كل كمالٍ في المخلوق لا نقص فيه فالله أحق أن يوصف به،"], [2022.0, "وكل نقصٍ في المخلوق لا كمال فيه فالله أحق أن يُنزَّه عنه."]], "tr": [[1979.0, "Külliyelerden biri de şudur: 6."], [1983.7, "külliye: Mahlûkta bulunan ve içinde hiçbir noksanlık olmayan her kemalle vasfedilmeye Allah daha layıktır;"], [2013.3, "mahlûkta bulunan ve içinde hiçbir kemal olmayan her noksanlıktan tenzih edilmeye de Allah daha layıktır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2030.0, "أقول وبالله التوفيق: اعلموا ـ رحمكم الله تعالى ـ أن الأقيسة التي استعملتها البشرية في حقّ الله عز وجل ثلاثة أنواع:"], [2044.0, "قياسُ التمثيل، وقياسُ الشمول،"], [2047.1, "وقياسُ الأَولى. وقد استعملت الطوائفُ هذه الأقيسة على مختلف عقائدها في الله عز وجل وأسمائه وصفاته."]], "tr": [[2030.0, "Tevfik Allah'tandır, derim ki: Bilin ki —Allah size rahmet etsin— insanlığın Allah Azze ve Celle hakkında kullandığı kıyaslar üç türlüdür:"], [2043.4, "Temsil kıyası, şümûl kıyası ve evlâ (evleviyet) kıyası."], [2055.0, "Fırkalar, Allah Azze ve Celle, isimleri ve sıfatları hakkındaki farklı akîdelerine göre bu kıyasları kullanmışlardır."]]}, {"reader": false, "ar": [[2064.0, "فإن قلت: وماذا تقصد بقياس التعليل؟"], [2069.0, "فأقول: هو ذلك القياس الأصولي الذي يستعمله الأصوليون في تخريج فرعٍ على أصلٍ في حكمٍ لعلّةٍ جامعة."], [2081.0, "فإن قلت: وماذا تقصد بقياس الشمول؟"], [2086.0, "أقول: هو قياسٌ في جزئيّتين تحت أصلٍ واحد،"], [2092.0, "وهو قولنا: إن الأصل دخولُ أفراد العامّ تحت عمومه، تحت العموم."]], "tr": [[2064.0, "Eğer \"Ta'lîl kıyası (illet kıyası) ile neyi kastediyorsun?\" dersen, derim ki:"], [2070.3, "O, usulcülerin, ortak bir illet sebebiyle bir hükümde bir fer'i bir asla göre çıkarmakta kullandıkları usûl kıyasıdır."], [2079.5, "Eğer \"Şümûl kıyası ile neyi kastediyorsun?\" dersen, derim ki:"], [2086.7, "O, tek bir asıl altındaki iki cüz'î hakkında yapılan kıyastır;"], [2092.7, "\"Asıl olan, âmm (genel) lafzın fertlerinin onun umumu altına girmesidir\" sözümüz budur."]]}]}, {"ts": "35:02", "title": "6. Külliye (devam): Tesviye içeren kıyas Allah hakkında kullanılamaz", "paras": [{"reader": false, "ar": [[2102.0, "فجميعُ أجزاء العموم يشملها لفظٌ واحد،"], [2107.0, "فما تقوله في الفرد الأول تقوله في الفرد الثاني،"], [2111.0, "وما تقوله في الفرد الثاني تقوله في الفرد الثالث،"], [2115.0, "إذ أفرادُ العموم مستويةٌ تحت اللفظ العامّ؛"], [2119.0, "كقولي: زيدٌ إنسان، ومحمدٌ إنسان،"], [2127.0, "فيستويان في مسمّى الإنسانية."], [2131.0, "فأنت ترى أن قياس التعليل مبنيٌّ على مساواة الأصل والفرع،"], [2137.0, "إذن فيه تسوية؛ وأنت ترى أن قياس الشمول مبنيٌّ على استواء الأفراد تحت الدلالة العامة، إذن فيه مساواة."]], "tr": [[2102.0, "Umumun bütün parçalarını tek bir lafız kapsar."], [2107.0, "Birinci fert hakkında söylediğini ikinci fert hakkında da söylersin;"], [2110.6, "ikinci fert hakkında söylediğini üçüncü fert hakkında da söylersin."], [2114.1, "Çünkü umumun fertleri âmm lafız altında eşittir."], [2117.9, "\"Zeyd insandır, Muhammed insandır\" sözüm gibi;"], [2121.4, "ikisi insanlık adlandırmasında eşittir. Görüyorsun ki ta'lîl kıyası aslın ve fer'in eşitliğine dayanır;"], [2134.6, "demek ki onda tesviye (eşitleme) vardır."], [2137.7, "Görüyorsun ki şümûl kıyası da fertlerin genel delâlet altında eşit olmasına dayanır;"], [2145.0, "demek ki onda da eşitlik vardır."]]}, {"reader": false, "ar": [[2149.0, "وخذوها مني كليّةً: «كلُّ قياسٍ يتضمّن التسويةَ فلا يجوز استعمالُه في حقّ الخالق»."], [2156.0, "كل قياسٍ يتضمّن التسوية فلا يجوز استعماله في حقّ الخالق؛"], [2169.0, "لأن الخالق لا يدخل مع مخلوقه في قياسٍ مبناه على المساواة."], [2176.0, "فلا يمكن أبدًا أن نعتقد أن الله يساوي المخلوقَ في أيّ جزئيّةٍ من الجزئيّات،"], [2182.0, "لقول الله عز وجل:"], [2184.7, "<span class=\"ayah\">﴿إِن كُنَّا لَفِي ضَلَالٍ مُّبِينٍ ۝ إِذْ نُسَوِّيكُم بِرَبِّ الْعَالَمِينَ﴾<\/span> [الشعراء: 97-98]."]], "tr": [[2149.0, "Bunu benden bir külliye olarak alın:"], [2153.2, "\"Tesviye içeren hiçbir kıyası Yaratıcı hakkında kullanmak caiz değildir.\" (Tekrar ediyor.) Çünkü Yaratıcı, mahlûkuyla birlikte, eşitliğe dayanan bir kıyasa girmez."], [2171.5, "Allah'ın herhangi bir cüz'î hususta mahlûka eşit olduğuna asla inanamayız."], [2177.3, "Çünkü Allah Azze ve Celle şöyle buyurur:"], [2180.7, "<span class=\"ayah\">﴿Gerçekten biz apaçık bir sapıklık içindeydik; çünkü sizi âlemlerin Rabbi ile bir tutuyorduk.﴾<\/span> [Şuarâ 97-98]"]]}, {"reader": false, "ar": [[2192.0, "فكلُّ من سوّى غيرَ الله عز وجل بالله في شيءٍ من مقتضيات ربوبيته،"], [2199.9, "أو شيءٍ من مقتضيات ألوهيته،"], [2203.0, "فقد وقع في الشرك الأكبر بالمساواة المطلقة."], [2207.0, "فقياسُ التمثيل لا يجوز استعمالُه في حقّ الله ـ لأن مبناه على التسوية ـ إجماعًا،"], [2215.7, "وقياسُ الشمول لا يجوز استعمالُه في حقّ الله عز وجل إجماعًا."]], "tr": [[2192.0, "Allah Azze ve Celle'den başkasını, rubûbiyyetinin gereklerinden birinde ya da ulûhiyyetinin gereklerinden birinde Allah'a eşit tutan herkes, mutlak eşitleme ile büyük şirke düşmüştür."], [2206.4, "Temsil kıyasını —tesviyeye dayandığı için— Allah hakkında kullanmak icmâen caiz değildir;"], [2214.3, "şümûl kıyasını Allah Azze ve Celle hakkında kullanmak da icmâen caiz değildir."]]}, {"reader": false, "ar": [[2224.0, "فإن قلت: اضرب لنا مثالًا على استعمال قياس الشمول في حقّ الله،"], [2231.0, "فأقول: كأن تقول: الله موجود،"], [2234.7, "والمخلوق موجود، فاجتمع الخالقُ والمخلوق في مسمّى الوجود،"], [2243.8, "فيكون وجودُ الخالق كوجود المخلوق."], [2247.0, "هذا قياس الشمول، فسوّيتَ بينهما في معنى الوجود،"], [2253.0, "وهو الذي يفعله الطوائف."], [2258.0, "فالممثّلة وقعوا في قياس التعليل فيما بين الخالق والمخلوق،"], [2269.0, "وكذلك وقعوا في قياس الشمول فيما بين الخالق والمخلوق،"], [2276.0, "وكلاهما قياسان باطلان في حقّ الله عز وجل."]], "tr": [[2224.0, "Eğer \"Bize şümûl kıyasının Allah hakkında kullanılmasına bir örnek ver\" dersen, derim ki:"], [2231.0, "Mesela \"Allah mevcuttur, mahlûk da mevcuttur;"], [2234.7, "Yaratıcı ile mahlûk varlık adlandırmasında bir araya geldi;"], [2243.8, "o hâlde Yaratıcının varlığı mahlûkun varlığı gibidir\" demen."], [2249.0, "İşte bu şümûl kıyasıdır; varlık manasında ikisini eşit tuttun."], [2255.6, "Fırkaların yaptığı budur. Mümessile, Yaratıcı ile mahlûk arasında ta'lîl kıyasına düştü;"], [2269.0, "Yaratıcı ile mahlûk arasında şümûl kıyasına da düştü."], [2274.7, "İkisi de Allah Azze ve Celle hakkında bâtıl kıyaslardır."]]}, {"reader": false, "ar": [[2281.0, "فإن قلت: وما القياس الذي يُستعمل في حقّ الله؟"], [2286.0, "فنقول: هو قياسُ الأَولى،"], [2288.2, "وهو الذي نعنيه بهذه الكلية؛"], [2291.0, "فهذه الكلية هي تعريفٌ لمعنى قياس الأولى."], [2298.0, "فكلُّ كمالٍ في المخلوق لا نقص فيه فإن الله أحقُّ أن يوصف به:"], [2304.0, "فالحياة كمالٌ في المخلوق لا نقص فيها،"], [2307.8, "فالله أحقُّ بالاتّصاف بالحياة؛"], [2310.0, "والعلم كمالٌ في المخلوق لا نقص فيه،"], [2312.9, "فالله أحقُّ أن يوصف بالعلم؛"], [2315.0, "والسمع والبصر كمالان في المخلوق لا نقص فيهما،"], [2319.0, "فالله أحقُّ أن يكون سميعًا بصيرًا."], [2322.0, "أنتم معي في هذا ولّا لا؟"]], "tr": [[2281.0, "Eğer \"Allah hakkında kullanılan kıyas hangisidir?\" dersen, deriz ki:"], [2285.4, "O, evlâ kıyasıdır; bu külliyeyle kastettiğimiz de odur."], [2289.9, "Bu külliye, evlâ kıyasının manasının tarifidir."], [2293.2, "Mahlûkta bulunan ve içinde hiçbir noksanlık olmayan her kemalle vasfedilmeye Allah daha layıktır:"], [2302.2, "Hayat, mahlûkta noksanlık içermeyen bir kemaldir;"], [2305.1, "o hâlde hayatla vasfedilmeye Allah daha layıktır."], [2308.4, "İlim, mahlûkta noksanlık içermeyen bir kemaldir;"], [2311.2, "o hâlde ilimle vasfedilmeye Allah daha layıktır."], [2314.2, "İşitme ve görme, mahlûkta noksanlık içermeyen iki kemaldir;"], [2317.5, "o hâlde işiten ve gören olmaya Allah daha layıktır."], [2322.0, "Bu konuda benimle misiniz, değil misiniz?"]]}, {"reader": false, "ar": [[2325.0, "والقدرةُ والقوّة كمالان في المخلوق لا نقص فيهما،"], [2333.0, "فالله أحقُّ أن يوصف بالقدرة والقوّة."], [2337.0, "وهكذا دواليك في كلّ كمالات المخلوق؛"], [2342.0, "إذ لا يمكن أن يستقلّ المخلوقُ بكمالٍ لا نقص فيه وخالقُه لا يتّصف به،"], [2351.0, "فإن الذي أعطى الكمالَ لهذا المخلوق إنما هو خالقه،"], [2357.0, "ومُعطي الكمال أولى بالكمال."], [2362.0, "ومُعطي الكمال أولى بالكمال، كلامي واضح؟ نعم."]], "tr": [[2325.0, "Kudret ve kuvvet, mahlûkta noksanlık içermeyen iki kemaldir;"], [2331.2, "o hâlde kudret ve kuvvetle vasfedilmeye Allah daha layıktır."], [2337.8, "Mahlûkun bütün kemallerinde böyle devam eder."], [2342.0, "Çünkü mahlûkun, içinde noksanlık olmayan bir kemale tek başına sahip olup Yaratıcısının onunla vasıflanmaması mümkün değildir."], [2351.0, "Zira bu mahlûka kemali veren, onun Yaratıcısıdır;"], [2355.0, "kemali veren ise kemale daha layıktır."], [2359.7, "Kemali veren kemale daha layıktır; sözüm açık mı? Evet."]]}, {"reader": false, "ar": [[2366.0, "فإن قلت: ولماذا قلتَ «كلُّ كمال» وقيّدته بقولك «لا نقص فيه»؟"], [2375.0, "فأقول: لأننا نجد كمالاتٍ يُوصف بها المخلوق لكنها نقصٌ باعتبارٍ آخر،"], [2382.0, "فهي كمالٌ من وجهٍ ونقصٌ من وجه،"], [2386.5, "فليست كمالًا بكلّ اعتبار."], [2389.0, "كالنوم، فإنه كمالٌ في المخلوق،"], [2391.7, "لأن الذي ينام لا يذهب للعلاج،"], [2395.0, "ولكن الذي يفقد النوم ويصيبه الأرق فيوصف بأنه مريض."]], "tr": [[2366.0, "Eğer \"Neden 'her kemal' dedin ve onu 'içinde noksanlık olmayan' sözünle kayıtladın?\" dersen, derim ki:"], [2376.3, "Çünkü mahlûkun vasfedildiği, fakat başka bir itibarla noksanlık olan kemaller buluyoruz."], [2382.6, "Bunlar bir yönden kemal, bir yönden noksanlıktır;"], [2387.1, "her itibarla kemal değildirler. Uyku gibi:"], [2390.1, "O, mahlûkta bir kemaldir; çünkü uyuyan kimse tedaviye gitmez."], [2394.5, "Fakat uykusunu kaybeden ve uykusuzluğa yakalanan kimse hasta diye nitelenir."]]}]}, {"ts": "40:02", "title": "6. Külliye (devam): Uyku, çocuk sahibi olmak, yeme-içme ve evlilik örnekleri", "paras": [{"reader": false, "ar": [[2402.0, "فإذن النوم ليس كمالًا من كلّ وجه،"], [2405.7, "بل هو كمالٌ من وجهٍ ونقصٌ من وجه:"], [2410.0, "فهو كمالٌ باعتبار أن النائم أكملُ من الذي لا ينام،"], [2415.0, "ولكنه نقصٌ لأن النوم عبارةٌ عن نقص القدرة البشرية والطاقة الإنسانية،"], [2422.0, "فيحتاج إلى تجديدها. والله لا ينقصه شيءٌ ـ لا في ذاته،"], [2428.1, "ولا في أفعاله وصفاته ـ حتى يحتاج إلى تجديد."], [2433.0, "فالنوم لا يدخل معنا في هذه الكلية الأولويّة."]], "tr": [[2402.0, "Demek ki uyku her yönden kemal değildir;"], [2405.7, "bilakis bir yönden kemal, bir yönden noksanlıktır."], [2409.5, "Uyuyan, uyumayandan daha kâmil olduğu itibarıyla kemaldir;"], [2413.0, "fakat noksanlıktır, çünkü uyku beşerî gücün ve insanî enerjinin eksilmesinden ibarettir;"], [2420.1, "bu yüzden onun yenilenmesine ihtiyaç duyar."], [2423.8, "Allah'ın ise ne zâtında ne de fiillerinde ve sıfatlarında, yenilenmeye muhtaç olacak şekilde hiçbir şeyi eksilmez."], [2433.7, "Dolayısıyla uyku, bu evleviyet külliyesine girmez."]]}, {"reader": false, "ar": [[2440.0, "لأن من الناس من إذا سمعنا نقول:"], [2442.6, "«كلُّ كمالٍ في المخلوق فالله أحقُّ أن يوصف به»،"], [2446.0, "يأتينا بالنوم، فإنه كمالٌ في المخلوق،"], [2449.4, "والله عز وجل <span class=\"ayah\">﴿لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ﴾<\/span> [البقرة: 255]."], [2454.0, "فنجيبه بهذا الجواب، أي بهذا القيد."]], "tr": [[2440.0, "Çünkü insanlardan bazıları, bizim \"Mahlûktaki her kemalle vasfedilmeye Allah daha layıktır\" dediğimizi duyunca, karşımıza uykuyu getirir:"], [2444.9, "O, mahlûkta bir kemaldir; oysa Allah Azze ve Celle'yi <span class=\"ayah\">﴿ne bir uyuklama ne de uyku tutar.﴾<\/span> [Bakara 255] Biz ona bu cevapla, yani bu kayıtla cevap veririz."]]}, {"reader": false, "ar": [[2457.0, "فإن قلت ـ انتبه ـ اضرب لنا مثالًا آخر،"], [2462.0, "أقول: الولادة؛ فإن الولادة كمالٌ في المخلوقات،"], [2468.0, "فالذي يُولد له أكملُ من العقيم أو العاقر الذي لا يُولد له."], [2475.0, "ولذلك من يُولد له لا يحتاج إلى علاج،"], [2479.0, "لكمالية صفته عند البشر،"], [2482.0, "والذي لا يُولد له يُعتبر ناقصًا وعيبًا."], [2486.7, "بل إن الفقهاء جعلوا من جملة ما يجوز به الفسخ عُقمَ الزوج أو عُقرَ الزوجة،"], [2496.2, "أنتم معي في هذا؟"]], "tr": [[2457.0, "Eğer —dikkat et— \"Bize başka bir örnek ver\" dersen, derim ki:"], [2464.0, "Çocuk sahibi olmak. Çocuk sahibi olmak mahlûkatta bir kemaldir;"], [2469.9, "çocuğu olan kimse, çocuğu olmayan kısır erkekten ya da kısır kadından daha kâmildir."], [2476.0, "Bu yüzden çocuğu olan kimse, insanlar nezdinde vasfı kâmil olduğu için tedaviye ihtiyaç duymaz;"], [2484.0, "çocuğu olmayan ise noksan ve kusurlu sayılır."], [2488.0, "Hatta fakihler, (nikâhın) feshini caiz kılan şeyler arasında kocanın kısırlığını ya da kadının kısırlığını saymışlardır; bu konuda benimle misiniz?"]]}, {"reader": false, "ar": [[2497.0, "إلا أن الولد وإن كان كمالًا من وجهٍ فإنه نقصٌ من وجه،"], [2504.7, "وهي أن الإنسان محتاجٌ إلى الأولاد ليُعينوه على شؤون حياته،"], [2512.0, "كما قال الله عز وجل عن إبراهيم لمّا جاءه إسماعيل وكبر،"], [2518.2, "قال: <span class=\"ayah\">﴿فَلَمَّا بَلَغَ مَعَهُ السَّعْيَ﴾<\/span> [الصافات: 102]؛"], [2521.0, "فهو يسعى مع أبيه في تحصيل مصالح الدين والدنيا."], [2525.0, "ولذلك لأن الله المتوحّد بالكمال والجلال والغنى عن كلّ أحدٍ تمدّح بأنه <span class=\"ayah\">﴿لَمْ يَلِدْ وَلَمْ يُولَدْ﴾<\/span> [الإخلاص: 3]."], [2537.0, "فالولادة وإن كانت كمالًا من وجهٍ إلا أنها نقصٌ من وجهٍ آخر،"], [2544.0, "ونحن نقول: كمالٌ لا نقص فيه."]], "tr": [[2497.0, "Ancak çocuk bir yönden kemal olsa da bir yönden noksanlıktır:"], [2502.8, "İnsan, hayatının işlerinde kendisine yardım etmeleri için çocuklara muhtaçtır."], [2508.0, "Nitekim Allah Azze ve Celle, İsmâil kendisine gelip büyüdüğünde İbrâhîm hakkında şöyle buyurdu:"], [2515.9, "<span class=\"ayah\">﴿(Çocuk) onunla birlikte koşup yürüme çağına erişince…﴾<\/span> [Sâffât 102] Yani din ve dünya maslahatlarını elde etmede babasıyla birlikte koşturuyor."], [2524.6, "Bu yüzden kemalde, celâlde ve herkesten müstağnî olmakta tek olan Allah, <span class=\"ayah\">﴿doğurmamış ve doğurulmamış﴾<\/span> [İhlâs 3] olmakla kendini övmüştür."], [2537.0, "Çocuk sahibi olmak bir yönden kemal olsa da başka bir yönden noksanlıktır;"], [2543.7, "biz ise \"içinde noksanlık olmayan kemal\" diyoruz."]]}, {"reader": false, "ar": [[2546.0, "فإن قلت: اضرب مثالًا ثالثًا،"], [2550.0, "نقول: الأكل والشرب؛ فإن الأكل والشرب كمالٌ في المخلوق،"], [2556.0, "فالذي يأكل ويشرب لا يقال بأن فيه عيبًا،"], [2560.0, "لكن الذي يترك الطعام والشراب يُعتبر مريضًا ناقصًا يحتاج إلى علاج."], [2568.0, "فالأكل كمالٌ من وجه،"], [2570.0, "إلا أنه نقصٌ من وجهٍ آخر،"], [2573.0, "وهي أنه إنما يأكل للحاجة للبقاء."], [2577.0, "ولذلك استدلّ الله على بطلان ربوبية عيسى وأمّه بقوله:"], [2583.0, "<span class=\"ayah\">﴿كَانَا يَأْكُلَانِ الطَّعَامَ ۗ انظُرْ كَيْفَ نُبَيِّنُ لَهُمُ الْآيَاتِ ثُمَّ انظُرْ أَنَّىٰ يُؤْفَكُونَ﴾<\/span> [المائدة: 75]."]], "tr": [[2546.0, "Eğer \"Üçüncü bir örnek ver\" dersen, deriz ki:"], [2550.7, "Yeme ve içme. Yeme ve içme mahlûkta bir kemaldir;"], [2556.0, "yiyip içen kimse için \"Onda bir kusur var\" denmez;"], [2559.5, "fakat yemeği ve içmeyi bırakan kimse, tedaviye muhtaç, noksan bir hasta sayılır."], [2566.1, "Yemek bir yönden kemaldir; ancak başka bir yönden noksanlıktır:"], [2571.0, "Kişi ancak hayatta kalmak için ihtiyaç duyduğundan yer."], [2574.3, "Bu yüzden Allah, Îsâ'nın ve annesinin rubûbiyyetinin bâtıl olduğuna şu sözüyle delil getirmiştir:"], [2581.7, "<span class=\"ayah\">﴿İkisi de yemek yerlerdi. Bak, onlara ayetleri nasıl açıklıyoruz; sonra bak, nasıl (haktan) çevriliyorlar!﴾<\/span> [Mâide 75]"]]}, {"reader": false, "ar": [[2593.0, "وكذلك أيضًا من الأمثلة:"], [2598.0, "الزواج؛ فإن الزواج كمالٌ في المخلوق،"], [2602.0, "بل هو كمالٌ دنيويٌّ وكمالٌ دينيّ،"], [2609.0, "إلا أن الزواج وإن كان كمالًا من وجهٍ إلا أنه نقصٌ من وجهٍ آخر،"], [2618.0, "وهي لشدّة حاجة الإنسان إلى امرأةٍ يستفرغ فيها وطرَ شهوته وتُعينه على بناء حياته."], [2625.0, "فانتبهوا لهذين القيدين: في الكمال قلنا:"], [2632.0, "«لا نقص فيه»، وفي التنزيه قلنا:"], [2636.3, "«لا كمال فيه»، حتى تكمل هذه القاعدة."]], "tr": [[2593.0, "Örneklerden biri de evliliktir. Evlilik mahlûkta bir kemaldir;"], [2601.2, "hatta hem dünyevî hem de dinî bir kemaldir."], [2609.0, "Ancak evlilik bir yönden kemal olsa da başka bir yönden noksanlıktır:"], [2616.0, "Bu, insanın, şehvet ihtiyacını gidereceği ve hayatını kurmada kendisine yardım edecek bir kadına şiddetle muhtaç olmasındandır."], [2624.3, "Bu iki kayda dikkat edin:"], [2630.7, "Kemalde \"içinde noksanlık olmayan\" dedik, tenzihte de \"içinde kemal olmayan\" dedik ki bu kaide tamamlansın."]]}, {"reader": false, "ar": [[2643.0, "والخلاصة أنه لا يجوز استعمالُ شيءٍ من الأقيسة التي تُبنى على تسوية الأصل والفرع في حقّ الله عز وجل،"], [2654.0, "وإنما يُستعمل في حقّ الله عز وجل قياسُ الأَولى."]], "tr": [[2643.0, "Hulâsa: Aslın ve fer'in eşitlenmesine dayanan kıyaslardan hiçbirini Allah Azze ve Celle hakkında kullanmak caiz değildir;"], [2653.6, "Allah Azze ve Celle hakkında ancak evlâ kıyası kullanılır."]]}]}, {"ts": "44:20", "title": "7. Külliye: Sıfatlarında Allah'tan iki zıddı (nakîzayn) birlikte nefyeden kâfirdir", "paras": [{"reader": false, "ar": [[2660.0, "ومن الكليات أيضًا: كلُّ من ينفي عن الله النقيضين فكافر… <b>كلُّ من ينفي عن الله النقيضين في صفاته فكافر.<\/b> كل من ينفي عن الله النقيضين في صفاته فكافر."]], "tr": [[2660.0, "Külliyelerden biri de şudur: Allah'tan iki nakîzı (çelişik iki şeyi) nefyeden herkes kâfirdir… 7."], [2668.8, "külliye: Sıfatlarında Allah'tan iki nakîzı birlikte nefyeden herkes kâfirdir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2678.0, "أقول وبالله التوفيق: لأن هناك طوائفَ تنفي عن الله عز وجل النقيضين،"], [2686.0, "ومن المعلوم المتقرّر في بدائه العقول أن سلبَ النقيضين ممتنعٌ كاجتماع النقيضين."], [2698.0, "فكلُّ شيءٍ تصفه باجتماع النقيضين فإنما تصف عدمًا غيرَ موجود،"], [2706.0, "وكلُّ شيءٍ تصفه بسلب النقيضين فإنما تصف عدمًا."]], "tr": [[2678.0, "Tevfik Allah'tandır, derim ki: Çünkü Allah Azze ve Celle'den iki nakîzı nefyeden fırkalar vardır."], [2684.0, "Aklın bedîhiyyâtında (apaçık ilk bilgilerinde) bilinen ve yerleşmiş olan şudur:"], [2688.7, "İki nakîzın ikisini birden olumsuzlamak, iki nakîzın bir araya gelmesi gibi imkânsızdır."], [2698.0, "İki nakîzın bir araya gelmesiyle vasfettiğin her şey, ancak var olmayan bir yokluğu vasfetmektir;"], [2704.3, "iki nakîzın birden olumsuzlanmasıyla vasfettiğin her şey de ancak bir yokluğu vasfetmektir."]]}, {"reader": false, "ar": [[2711.0, "وهناك طوائف تنفي عن الله النقيضين في صفات كماله،"], [2720.0, "وهم الجهميّة المحضة أتباعُ الجهم بن صفوان،"], [2726.0, "فإنهم يسلبون عن الله عز وجل النقيضين؛"], [2730.0, "وكالقرامطة الإسماعيلية، فإنهم ينفون عن الله عز وجل النقيضين."], [2738.0, "فكلُّ من نفى عن الله النقيضين فإنه يقول بأن الله معدومٌ أو ممتنع،"], [2749.0, "ومن وصف الله بشيءٍ من العدميّة أو الامتناع فإنه كافرٌ ولا شكّ،"], [2756.0, "لأن في ذلك تعطيلًا للكون عن خالقه وصانعه ومُبدعه وربّه."]], "tr": [[2711.0, "Kemal sıfatlarında Allah'tan iki nakîzı nefyeden fırkalar vardır:"], [2715.3, "Bunlar Cehm b. Safvân'ın tâbileri olan halis Cehmiyye'dir;"], [2723.0, "onlar Allah Azze ve Celle'den iki nakîzı birden selbederler (olumsuzlarlar)."], [2729.4, "İsmâiliyye Karâmitası da böyledir; onlar da Allah Azze ve Celle'den iki nakîzı nefyederler."], [2738.7, "Allah'tan iki nakîzı nefyeden herkes, Allah'ın ma'dûm (yok) ya da mümteni' (varlığı imkânsız) olduğunu söylemiş olur."], [2750.2, "Allah'ı yoklukla ya da imkânsızlıkla vasfeden kimse şüphesiz kâfirdir;"], [2754.8, "çünkü bunda kâinatı Yaratıcısından, Sâni'inden, Mübdi'inden (örneksiz yaratanından) ve Rabbinden ta'til etmek vardır."]]}, {"reader": false, "ar": [[2765.0, "فيقولون: إن الله ليس بموجودٍ ولا بمعدوم،"], [2770.0, "فيسلبون النقيضين، وما ليس بموجودٍ ولا معدومٍ ممتنع."], [2777.0, "ويقولون بأنه لا داخلَ العالم ولا خارجَ العالم،"], [2783.0, "فهو ممتنع، أي يلزم على قولهم وصفُ الله بالامتناع."], [2789.0, "ويقولون: ليس بحيٍّ ولا يوصف بالموت،"], [2796.0, "وما ليس بحيٍّ ولا ميّتٍ ممتنع."], [2801.0, "ويقولون بأنه لا يتكلّم وليس بأبكم،"], [2804.9, "ولا يُبصر وليس بأعمى،"], [2807.5, "ولا يسمع وليس بأصمّ،"], [2810.1, "ولا بأعلى ولا بأسفل،"], [2812.7, "ولا مُحايِث. وهكذا دواليك في كلّ صفات كماله،"], [2823.1, "فهم يسلبون صفتَه وجودًا ومقابلَها عدمًا."]], "tr": [[2765.0, "Derler ki: \"Allah ne mevcuttur ne de ma'dûmdur.\" Böylece iki nakîzı birden selbederler;"], [2772.6, "ne mevcut ne de ma'dûm olan ise mümteni'dir."], [2777.8, "\"O, âlemin ne içindedir ne de dışındadır\" derler;"], [2783.0, "bu da mümteni'dir, yani onların sözüne göre Allah'ı imkânsızlıkla vasfetmek lâzım gelir."], [2789.0, "\"Diri değildir, ölümle de vasfedilmez\" derler;"], [2792.8, "ne diri ne ölü olan ise mümteni'dir."], [2799.0, "\"Konuşmaz ama dilsiz de değildir;"], [2802.9, "görmez ama kör de değildir;"], [2805.6, "işitmez ama sağır da değildir;"], [2808.2, "ne yukarıdadır ne aşağıdadır, ne de (âleme) bitişiktir\" derler."], [2812.7, "Bütün kemal sıfatlarında böyle devam eder:"], [2821.1, "O'nun sıfatını hem var olarak hem de karşılığını yok olarak selbederler."]]}, {"reader": false, "ar": [[2834.0, "وهؤلاء وصل بهم الحال إلى أنهم أكفرُ من طائفةٍ لا تصف الله عز وجل إلا بالنفي فقط،"], [2845.0, "وهم أخفُّ كفرًا من هؤلاء."], [2849.0, "فإن من لا يصف الله إلا بالنفي فقط فإنه يصفه بالعدميّة،"], [2858.0, "ولكن من ينفي عنه النفيَ والإثبات فإنه يصفه بالامتناعيّة،"], [2867.0, "ومن يصف الله بالامتناع أعظمُ كفرًا ممّن يصف الله عز وجل بالعدم."]], "tr": [[2834.0, "Bunların hâli, Allah Azze ve Celle'yi sadece nefy ile vasfeden bir fırkadan daha kâfir olmalarına kadar varmıştır;"], [2843.7, "o (fırka) bunlardan küfür bakımından daha hafiftir."], [2848.2, "Çünkü Allah'ı sadece nefy ile vasfeden kimse O'nu yoklukla vasfeder;"], [2854.5, "fakat O'ndan hem nefyi hem isbatı nefyeden kimse O'nu imkânsızlıkla vasfeder."], [2863.9, "Allah'ı imkânsızlıkla vasfeden kimse ise, Allah Azze ve Celle'yi yoklukla vasfedenden küfür bakımından daha büyüktür."]]}]}, {"ts": "47:54", "title": "7. Külliye (sonu): \"Mahal elverişli değil\" iddiası · Dersin kapanışı", "paras": [{"reader": false, "ar": [[2874.0, "ولمّا ألزمهم أهلُ السنة بذلك فرّوا إلى ما هو أعظمُ كفرًا من قولهم الأول؛"], [2888.0, "قالوا: إن سلب النقيضين لا يكون ذمًّا إلا إذا كان المحلُّ صالحًا لهما،"], [2901.0, "وأما إذا سلبتَ النقيضين عن محلٍّ غير صالحٍ فلا يُعتبر ذلك ذمًّا للمحلّ."], [2911.0, "كأن تقول: الجدار لا يُبصر وليس بأعمى،"], [2915.0, "فسلبُ السمع والبصر عن الجدار ليس ذمًّا للجدار،"], [2919.6, "لعدم قابلية الجدار لواحدٍ من الصفتين."], [2923.0, "وتقول: هذه الورقة ليست بحيّةٍ ولا بميّتة،"], [2932.0, "فسلبُ الحياة والموت عنها ليس بذمٍّ لها،"], [2937.0, "لأنه سلبٌ للنقيضين عن محلٍّ غير صالح."]], "tr": [[2874.0, "Ehl-i Sünnet bunu onlara ilzam edince (bu sonucu gösterince), ilk sözlerinden daha büyük bir küfre kaçtılar."], [2887.3, "Dediler ki: \"İki nakîzı selbetmek, ancak mahal (zât) ikisine de elverişli ise bir yergi olur;"], [2895.4, "iki nakîzı elverişli olmayan bir mahalden selbedersen, bu o mahal için bir yergi sayılmaz.\" Mesela \"Duvar görmez ama kör de değildir\" demen gibi;"], [2913.3, "işitme ve görmeyi duvardan selbetmek duvar için bir yergi değildir, çünkü duvar iki sıfattan hiçbirini kabul etmeye elverişli değildir."], [2922.4, "\"Bu kâğıt ne diridir ne ölüdür\" dersin;"], [2926.7, "hayatı ve ölümü ondan selbetmek onun için bir yergi değildir, çünkü bu, iki nakîzı elverişli olmayan bir mahalden selbetmektir."]]}, {"reader": false, "ar": [[2942.0, "وهذا أعظمُ كفرًا من قولهم الأول؛"], [2947.0, "لأنهم إذا قالوا بأن الله ليس بحيٍّ ولا ميّت ـ معتقدين أن المحلَّ غيرُ صالحٍ لأحد الصفتين ـ فهذا أشدُّ امتناعًا وأشدُّ ذمًّا."], [2959.0, "فبدلَ أن يسلب النقيضين عن محلٍّ صالح ـ مع كونه كفرًا،"], [2966.0, "هذا أخفُّ كفرًا ـ من سلب النقيضين مع اعتقاد أن المحلّ أصلًا غيرُ صالح."], [2973.0, "فلا يجعلون الله محلًّا صالحًا لا للحياة ولا للموت،"], [2979.2, "ولا للسمع، ولا ليكون أبكمَ ـ عفوًا ـ أصمَّ،"], [2984.6, "ولا للكلام ولا للخرس."], [2988.0, "فانظر كيف يعتقدون في الله عز وجل!"]], "tr": [[2942.0, "Bu, ilk sözlerinden daha büyük bir küfürdür."], [2947.0, "Çünkü onlar, mahallin iki sıfattan birine elverişli olmadığına inanarak \"Allah ne diridir ne ölüdür\" dediklerinde, bu daha şiddetli bir imkânsızlık ve daha şiddetli bir yergidir."], [2960.4, "İki nakîzı elverişli bir mahalden selbetmek —küfür olmakla birlikte— mahallin aslında elverişli olmadığına inanarak iki nakîzı selbetmekten küfür bakımından daha hafiftir."], [2972.5, "Onlar Allah'ı ne hayata ne ölüme, ne işitmeye, ne dilsiz —pardon— sağır olmaya, ne konuşmaya ne de dilsizliğe elverişli bir mahal saymazlar."], [2986.7, "Bak, Allah Azze ve Celle hakkında nasıl inanıyorlar!"]]}, {"reader": false, "ar": [[2992.0, "ولذلك أجمع أهلُ السنة أن من نفى عن الله عز وجل النقيضين فإنه كافر،"], [3000.0, "سواءٌ اعتقد أن المحلّ صالح أو اعتقد أن المحلّ غير صالح."], [3005.0, "وهذه من قواعد أبي العباس ابن تيمية رحمه الله في «التدمرية»."], [3012.5, "كم أخذنا من كلية؟"], [3014.5, "سبع. يكفيكم هذا؟ كم جلسنا؟"], [3017.5, "خمسون. طيب، لعلّنا نكتفي بهذا القدر،"], [3020.0, "والله أعلى وأعلم، وصلى الله وسلم على نبينا محمد."]], "tr": [[2992.0, "Bu yüzden Ehl-i Sünnet, Allah Azze ve Celle'den iki nakîzı nefyeden kimsenin —mahallin elverişli olduğuna inansın ya da elverişli olmadığına inansın— kâfir olduğu üzerinde icmâ etmiştir."], [3004.1, "Bu, Ebü'l-Abbâs İbn Teymiyye rahimehullahın \"et-Tedmüriyye\"deki kaidelerindendir."], [3007.7, "Kaç külliye işledik? Yedi. Bu size yeter mi?"], [3013.0, "Ne kadar oturduk? Elli (dakika)."], [3015.0, "Peki, belki bu kadarla yetinelim."], [3018.0, "Allah en yüce olandır ve en iyisini bilendir."], [3020.8, "Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
