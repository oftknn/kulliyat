<script>
const D={"no": 60, "vid": "8ghuiUzCLYo", "title_ar": "الدرس (٦٠) من شرح كليات العقيدة — من كليات الأسماء", "title_tr": "Şerhu Külliyyâti'l-Akîde — 60. Ders: İsim Külliyeleri (Allah'a Has İsimler, Mahlûka Verilebilen İsimler, İsimlerde Lafız Ortaklığı, İsimlere Delilsiz Hususiyet İsnadı, Allah'tan Başkasına Kul Kılan İsimler, Muabbed İsimlerde Tasgîr ve Naht, İsimlerin Tafâdulu)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Allah'a has bir hakikati içeren her isimle isimlenmek caiz değildir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.8, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.4, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.6, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [9.2, "أمّا بعد: فلا نزال في كلّيّات توحيد الأسماء والصفات،"], [13.1, "مُتمثِّلةً في عشر كلّيّاتٍ في كلّ درس."], [16.2, "وقد شرحنا جُمَلًا من كلّيّات أسماء الله عز وجل في الدروس الماضية،"], [21.4, "وها نحن نُكمِل ـ إن شاء الله ـ شرحَها بعشر كلّيّاتٍ في هذا الدرس، إن تيسّر الوقت."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.8, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.1, "Bundan sonra: Hâlâ isim ve sıfatlar tevhidinin külliyeleri içindeyiz;"], [13.1, "bunlar her derste on külliye şeklinde ele alınıyor."], [16.2, "Geçmiş derslerde Allah Azze ve Celle'nin isimlerine dair külliyelerden birçoğunu şerh ettik."], [22.3, "İşte inşallah, vakit elverirse, bu derste on külliyeyle onların şerhini tamamlıyoruz."]]}, {"reader": false, "ar": [[28.0, "فمن الكلّيّات في هذا الدرس كلّيّةٌ تقول:"], [32.6, "<b>كلُّ اسمٍ لله يتضمّن حقيقةً مختصّةً به فلا يجوز التسمّي به.<\/b> <b>كلُّ اسمٍ لله يتضمّن حقيقةً مختصّةً به فلا يجوز التسمّي به.<\/b> أُعيدها مرّةً ثالثة:"], [60.0, "<b>كلُّ اسمٍ لله يتضمّن حقيقةً مختصّةً به فلا يجوز التسمّي به.<\/b>"]], "tr": [[28.0, "Bu dersteki külliyelerden biri şöyle der:"], [32.6, "1. külliye: Allah'ın, kendisine has bir hakikati içeren her ismiyle isimlenmek caiz değildir. 1."], [47.0, "külliye: Allah'ın, kendisine has bir hakikati içeren her ismiyle isimlenmek caiz değildir. Üçüncü kez tekrar ediyorum:"], [60.0, "<b>1. külliye: Allah'ın, kendisine has bir hakikati içeren her ismiyle isimlenmek caiz değildir.<\/b>"]]}, {"reader": false, "ar": [[70.0, "أقول وبالله التوفيق: وهذه الكلّيّة والتي بعدها تُبيّن لك ما يجوز التسمّي به من أسماء الله عز وجل ممّا لا يجوز التسمّي به."], [79.0, "والفرقانُ بين ما يجوز التسمّي به من أسمائه ممّا لا يجوز التسمّي به هو الحقيقةُ التي يتضمّنها ذلك الاسم:"], [90.0, "فإن كانت من الحقائق التي لا يجوز اتّصافُ المخلوق بها فإنها تكون من الأسماء المختصّة بالله عز وجل،"], [99.0, "وإن كانت من الحقائق التي يجوز أن تُطلق على المخلوق فحينئذٍ يجوز التسمّي بها بشروطٍ ستأتينا في الكلّيّة التي بعدها إن شاء الله تعالى."]], "tr": [[70.0, "Tevfik Allah'tandır, derim ki: Bu külliye ve ondan sonraki külliye, Allah Azze ve Celle'nin isimlerinden isimlenilmesi caiz olanı caiz olmayandan ayırt etmeni sağlar."], [79.0, "O'nun isimlerinden isimlenilmesi caiz olanla caiz olmayanı ayıran şey, o ismin içerdiği hakikattir."], [90.0, "Eğer bu hakikat, mahlûkun onunla nitelenmesi caiz olmayan hakikatlerdense, o isim Allah Azze ve Celle'ye has isimlerden olur."], [100.2, "Eğer mahlûk için kullanılması caiz olan hakikatlerdense, o takdirde inşallah bir sonraki külliyede gelecek şartlarla onunla isimlenmek caizdir."]]}, {"reader": false, "ar": [[109.0, "فأسماءُ الله عز وجل باعتبار حقائقها تنقسم إلى قسمين:"], [115.0, "إلى حقائق لا يجوز وصفُ غير الله بها؛"], [120.0, "فكلُّ اسمٍ يتضمّن هذه الحقيقة التي لا يجوز اتّصافُ غير الله بها فإنه يُعتبر من الأسماء المختصّة به،"], [130.2, "والتي لا يجوز أن تُطلق على غيره عز وجل."], [135.0, "وذلك كاسمه الأحسن «الله»؛"], [141.0, "فإنه يتضمّن حقيقةَ الألوهيّة المطلقة واستحقاقَه للعبادة،"], [146.0, "وهذا من الحقائق التي لا يجوز إطلاقُها على المخلوق؛"], [149.0, "فإنّ وصف الألوهيّة مختصٌّ بالله عز وجل."], [152.0, "فحينئذٍ لا يجوز لأحدٍ أن يُطلق على نفسه «الله» أو «الإله»."]], "tr": [[109.0, "Allah Azze ve Celle'nin isimleri hakikatleri itibarıyla iki kısma ayrılır."], [115.0, "(Birincisi) Allah'tan başkasının onlarla nitelenmesi caiz olmayan hakikatlerdir."], [120.0, "Allah'tan başkasının nitelenmesi caiz olmayan bu hakikati içeren her isim, O'na has isimlerden sayılır ve O'ndan —Azze ve Celle— başkasına verilmesi caiz değildir."], [132.9, "Bu, O'nun en güzel ismi olan \"Allah\" gibidir."], [141.0, "Bu isim, mutlak ulûhiyyet hakikatini ve O'nun ibadete müstahak oluşunu içerir;"], [146.7, "bu da mahlûka verilmesi caiz olmayan hakikatlerdendir."], [149.0, "Çünkü ulûhiyyet vasfı Allah Azze ve Celle'ye mahsustur."], [152.0, "Dolayısıyla hiç kimsenin kendisine \"Allah\" veya \"el-İlâh\" demesi caiz değildir."]]}, {"reader": false, "ar": [[157.0, "ومنها كذلك اسمُه «الخالق»،"], [159.9, "أي المُوجِد من العدم؛"], [166.0, "فإنه يتضمّن حقيقةً مختصّةً بالله عز وجل،"], [169.5, "لا يجوز إطلاقُه على المخلوق."], [172.0, "بل إنّ أهل الإسلام قد أجمعوا على أنّ كلَّ من اعتقد في مخلوقٍ قدرتَه على الخالقيّة من العدم فإنه يُعتبر كافرًا ومشركًا في توحيد الربوبيّة؛"], [187.0, "فلا خالقَ من العدم إلا الله تبارك وتعالى."], [193.0, "وبناءً على ذلك فلا يجوز أن يتسمّى المخلوقُ باسم «الخالق» أو «خالق»،"], [201.0, "سواءً معرَّفًا بالألف واللام أو غيرَ معرَّفٍ بها."]], "tr": [[157.0, "Bunlardan biri de O'nun \"el-Hâlık\" ismidir;"], [161.3, "yani yokluktan var eden. Bu isim Allah Azze ve Celle'ye has bir hakikati içerir;"], [172.0, "mahlûka verilmesi caiz değildir. Hatta İslâm ehli, bir mahlûkun yoktan yaratmaya gücü olduğuna inanan herkesin kâfir ve rubûbiyyet tevhidinde müşrik sayılacağı üzerinde icmâ etmiştir."], [187.0, "Yoktan yaratan Allah Tebâreke ve Teâlâ'dan başkası yoktur."], [193.0, "Buna binaen mahlûkun, elif-lâm ile marife olsun veya olmasın, \"el-Hâlık\" veya \"Hâlık\" ismini alması caiz değildir."]]}, {"reader": false, "ar": [[205.0, "ومنها كذلك اسمُه «الرحمن»؛"], [211.0, "فإنه يتضمّن صفةَ الرحمة الذاتيّة العامّة لكلّ الخلق:"], [217.0, "عُلويِّهم وسُفليِّهم، إنسِهم وجنِّهم،"], [219.9, "كبيرِهم وصغيرِهم، متحرّكِهم وجامدِهم."], [226.0, "وهذه حقيقةٌ مختصّةٌ بالله عز وجل،"], [229.0, "لا يُشركه معها فيها غيرُه أبدًا."], [232.0, "فإنّ الإنسان وإن وُصف بأنه رحيم إلا أنه بمطلق الرحمة،"], [238.0, "لا الرحمة ـ لا الرحمة المطلقة."], [240.0, "ولذلك لمّا تسمّى مسيلمةُ الكذّاب «رحمانَ اليمامة» فضحه الله عز وجل على رؤوس الأشهاد."]], "tr": [[205.0, "Bunlardan biri de O'nun \"er-Rahmân\" ismidir."], [211.0, "Bu isim, bütün yaratılmışları —yukarıdakileri ve aşağıdakileri, insanları ve cinleri, büyükleri ve küçükleri, hareket edenleri ve cansızları— kuşatan zâtî ve umumi rahmet sıfatını içerir."], [226.0, "Bu, Allah Azze ve Celle'ye has bir hakikattir;"], [229.0, "bunda hiç kimse asla O'na ortak olamaz."], [232.0, "İnsan \"rahîm (merhametli)\" diye nitelense bile, bu mutlak rahmetin (rahmetin bir kısmının) ifadesidir;"], [238.0, "rahmet değil —mutlak (sınırsız) rahmet değil."], [240.0, "Bu sebeple Yalancı Müseylime kendisine \"Yemâme'nin Rahmân'ı\" adını verince, Allah Azze ve Celle onu herkesin gözü önünde rezil etti."]]}, {"reader": false, "ar": [[249.0, "ومنها كذلك اسمُه «البارئ»،"], [254.0, "أي الذي يُعطي كلَّ خلقٍ ما يناسبه،"], [258.5, "وهو زيادةٌ على الخلق."], [261.0, "فليس كلُّ خالقٍ بارئًا،"], [263.2, "ولكنّ الله عز وجل هو الخالق البارئ،"], [267.0, "الذي يُعطي كلَّ خلقٍ ما يناسبه في صفة خلقه."], [271.0, "وهذا من جملة المعاني المختصّة به عز وجل،"], [274.7, "لا يُشاركه فيها أحدٌ من خلقه أبدًا."], [278.0, "وبناءً على ذلك فلا يجوز أن يتسمّى أحدٌ من الخلق بـ«البارئ» مطلقًا."]], "tr": [[249.0, "Bunlardan biri de O'nun \"el-Bâri'\" ismidir;"], [254.6, "yani her yaratılmışa kendisine uygun olanı veren."], [257.8, "Bu, yaratmaya ilave bir anlamdır."], [261.0, "Her yaratan bâri' değildir; fakat Allah Azze ve Celle, her yaratılmışa yaratılış sıfatında kendisine uygun olanı veren Hâlık ve Bâri'dir."], [271.0, "Bu, O'na —Azze ve Celle— has anlamlar cümlesindendir;"], [274.3, "yarattıklarından hiç kimse bunda asla O'na ortak olamaz."], [278.0, "Buna binaen yaratılmışlardan hiç kimsenin hiçbir şekilde \"el-Bâri'\" ismini alması caiz değildir."]]}, {"reader": false, "ar": [[285.0, "ومنها كذلك «القيّوم»؛ فإنه من الأسماء المختصّة بالله عز وجل؛"], [292.0, "لأنه يتضمّن حقيقةً لا يجوز أن يُوصف بها المخلوق،"], [297.8, "وهي قيامُه بنفسه وقيامُه بغيره."], [301.0, "فالله عز وجل هو القائم بنفسه،"], [304.3, "والقائم بمصالح غيره. وهذا كلُّه ـ وهذا يدلّنا على أنّ من يتسمّى باسم «القيّوم» فإنه واقعٌ في الحرام."], [315.0, "فإنّ الإنسان وإن كان يُوصف بالقيّوميّة إلا أنها مطلقُ القيّوميّة، وليست القيّوميّةَ المطلقة."]], "tr": [[285.0, "Bunlardan biri de \"el-Kayyûm\"dur. Bu, Allah Azze ve Celle'ye has isimlerdendir;"], [292.0, "çünkü mahlûkun nitelenmesi caiz olmayan bir hakikati içerir:"], [295.9, "O'nun kendi zâtıyla kâim olması ve başkasını ayakta tutması."], [301.0, "Allah Azze ve Celle kendi zâtıyla kâim olan ve başkasının maslahatlarını ayakta tutandır."], [307.3, "Bütün bunlar —bu da bize gösterir ki \"el-Kayyûm\" ismini alan kimse harama düşmüştür."], [315.0, "İnsan kayyûmiyyetle nitelense bile, bu kayyûmiyyetin bir kısmıdır; mutlak kayyûmiyyet değildir."]]}]}, {"ts": "05:28", "title": "1. Külliye (devam): er-Rab, es-Seyyid, el-Kuddûs", "paras": [{"reader": false, "ar": [[328.0, "ومنها كذلك «الربّ» معرَّفًا بالألف واللام غيرَ مضاف،"], [337.0, "أي بهذه القيود؛ فإنّ «الربّ» معرَّفًا بالألف واللام غيرَ مضافٍ هذا من خصائص الله عز وجل."], [348.0, "فلا يجوز لأحدٍ أن يتسمّى به؛"], [350.8, "لأنه يتضمّن حقيقةً لا يجوز أن يتّصف بها المخلوق."], [355.0, "فإنّ المخلوق وإن كان يُوصف بأنه «ربُّ الدابّة» و«ربُّ الدار»،"], [360.0, "إلا أنها بمطلق الربوبيّة،"], [362.5, "لا للربوبيّة المطلقة العامّة."]], "tr": [[328.0, "Bunlardan biri de elif-lâm ile marife ve izafetsiz olarak \"er-Rab\"dır;"], [339.0, "yani bu kayıtlarla. Elif-lâm ile marife ve izafetsiz \"er-Rab\", Allah Azze ve Celle'nin hususiyetlerindendir."], [348.0, "Hiç kimsenin bu ismi alması caiz değildir;"], [350.8, "çünkü mahlûkun nitelenmesi caiz olmayan bir hakikati içerir."], [355.0, "Mahlûk \"hayvanın sahibi (rabbü'd-dâbbe)\" ve \"evin sahibi (rabbü'd-dâr)\" diye nitelense bile, bu rubûbiyyetin bir kısmıdır;"], [362.1, "mutlak ve umumi rubûbiyyet değildir."]]}, {"reader": false, "ar": [[365.0, "ومنها كذلك «السيّد» معرَّفًا بالألف واللام غيرَ مضاف؛"], [375.0, "فإنه يتضمّن حقيقةً مختصّةً بالله عز وجل."], [379.0, "ولذلك لمّا وصف أحدُ الصحابة النبيَّ صلى الله عليه وسلم بأنه السيّد قال:"], [386.3, "«إنما السيّدُ الله». فإن قلتَ:"], [390.1, "وكيف نجمع بين هذا وبين قول النبيّ صلى الله عليه وسلم في الحديث الصحيح:"], [397.0, "«أنا سيّدُ الناس يوم القيامة، ولا فخر»؟"], [400.0, "فنقول: هذا بمطلق السيادة الوصفيّة،"], [405.0, "ونحن نتكلّم عن إطلاق الأسماء لا إطلاق الأوصاف."], [409.0, "والمتقرِّر في القواعد أنه يُتوسَّع في إطلاق الصفات ما لا يُتوسَّع في إطلاق الأسماء."]], "tr": [[365.0, "Bunlardan biri de elif-lâm ile marife ve izafetsiz olarak \"es-Seyyid\"dir."], [375.0, "Bu isim Allah Azze ve Celle'ye has bir hakikati içerir."], [379.0, "Bu sebeple sahâbeden biri Peygamber sallallâhu aleyhi ve sellem'i \"es-Seyyid\" diye nitelediğinde o şöyle buyurdu:"], [389.0, "\"Seyyid ancak Allah'tır.\" Eğer: \"Bunu, Peygamber sallallâhu aleyhi ve sellem'in sahih hadisteki 'Ben kıyamet günü insanların seyyidiyim, (bununla) övünmüyorum' sözüyle nasıl bağdaştırırız?\" dersen, deriz ki:"], [400.0, "Bu, vasıf olarak seyyidliğin bir kısmıdır."], [405.0, "Biz ise isimlerin kullanılmasından bahsediyoruz, vasıfların kullanılmasından değil."], [409.0, "Kaidelerde yerleşik olan şudur: Sıfatların kullanılmasında, isimlerin kullanılmasında genişletilmeyen ölçüde genişlik gösterilir."]]}, {"reader": false, "ar": [[416.0, "ومنها كذلك «القدّوس» معرَّفًا بالألف واللام؛"], [423.0, "فإنه يتضمّن حقيقةً مختصّةً بالله عز وجل."], [429.0, "وهكذا دواليك في كلّ اسمٍ يتضمّن حقيقةً مختصّةً بالله عز وجل؛"], [436.0, "فإنه يكون من الأسماء الخاصّة،"], [438.7, "لا يجوز أن يُشاركه فيها غيرُه. والله أعلم."]], "tr": [[416.0, "Bunlardan biri de elif-lâm ile marife olarak \"el-Kuddûs\"tur."], [423.0, "Bu isim Allah Azze ve Celle'ye has bir hakikati içerir."], [429.0, "Allah Azze ve Celle'ye has bir hakikati içeren her isimde durum böyle devam eder:"], [436.0, "O, has isimlerden olur; başkasının bunlarda O'na ortak olması caiz değildir. Allah en iyisini bilir."]]}]}, {"ts": "07:23", "title": "2. Külliye: Allah'a has olmayan her ismin, sıfat anlamı gözetilmedikçe mahlûka verilmesi caizdir", "paras": [{"reader": false, "ar": [[443.0, "ومن الكلّيّات أيضًا: <b>كلُّ اسمٍ ليس بمختصٍّ بالله فيجوز إطلاقُه على المخلوق ما لم يُراقَب فيه معنى الصفة.<\/b> <b>كلُّ اسمٍ ليس بمختصٍّ بالله فيجوز إطلاقُه على المخلوق ما لم يُراقَب فيه معنى الصفة.<\/b> أُعيدها مرّةً ثالثة:"], [485.0, "<b>كلُّ اسمٍ ليس بمختصٍّ بالله فيجوز إطلاقُه على المخلوق ما لم يُراقَب فيه معنى الصفة.<\/b>"]], "tr": [[443.0, "Külliyelerden biri de şudur: 2."], [445.0, "külliye: Allah'a has olmayan her ismin, onda sıfat anlamı gözetilmedikçe mahlûka verilmesi caizdir.<b> <\/b>2."], [454.1, "külliye: Allah'a has olmayan her ismin, onda sıfat anlamı gözetilmedikçe mahlûka verilmesi caizdir. Üçüncü kez tekrar ediyorum:"], [485.0, "<b>2. külliye: Allah'a has olmayan her ismin, onda sıfat anlamı gözetilmedikçe mahlûka verilmesi caizdir.<\/b>"]]}, {"reader": false, "ar": [[497.0, "أقول وبالله التوفيق: قولُنا في الكلّيّة «ليس بمختصٍّ بالله» بمعنى أنّ له حقيقةً تتفاوت بين الخالق والمخلوق،"], [507.8, "أي فيجوز إطلاقُه على المخلوق."], [511.0, "وهذه الكلّيّة متمِّمةٌ للكلّيّة التي قبلها؛"], [516.0, "وذلك لأنّ أهل السنّة والجماعة يُجيزون التسمّي بأسماء الله عز وجل بثلاثة شروط،"], [524.0, "جعلوا شرطين منها أصليَّين أساسيَّين لا ينبغي التنازلُ عنهما،"], [534.0, "وأمّا الشرط الثالث فإنه يُعتبر من الشروط الكماليّة:"], [539.0, "إن وُجد فمَغنَم، وإن فات فليس في فواته مَغرَم."]], "tr": [[497.0, "Tevfik Allah'tandır, derim ki: Külliyedeki \"Allah'a has olmayan\" sözümüz, onun Hâlık ile mahlûk arasında derece derece farklılaşan bir hakikati olduğu, dolayısıyla mahlûka verilmesinin caiz olduğu anlamındadır."], [511.0, "Bu külliye kendisinden önceki külliyeyi tamamlayıcıdır."], [516.0, "Çünkü Ehl-i Sünnet ve'l-Cemaat, Allah Azze ve Celle'nin isimleriyle isimlenmeyi üç şartla caiz görür."], [524.7, "Bunlardan iki şartı, vazgeçilmemesi gereken asıl ve temel şartlar kılmışlardır."], [535.2, "Üçüncü şart ise kemâl şartlarından sayılır:"], [539.0, "Bulunursa kazançtır, bulunmazsa kaybedilmesinde bir zarar yoktur."]]}, {"reader": false, "ar": [[545.0, "الشرطُ الأوّل الأصليّ الأساسيّ:"], [549.0, "ألّا يكون متضمِّنًا لحقيقةٍ مختصّةٍ بالله عز وجل،"], [553.6, "كما شرحتُه في الكلّيّة التي قبلها؛"], [557.0, "بمعنى ألّا يكون من الأسماء الخاصّة بالله عز وجل."], [563.0, "الشرطُ الثاني ـ وهو شرطٌ أصليٌّ أساسيّ ـ:"], [568.5, "ألّا يُراقَب في التسمية به معنى الصفة؛"], [574.0, "بمعنى أنّنا لا نُسمّي مخلوقًا بـ«الكريم» لأنه متّصفٌ بالكرم،"], [581.0, "ولا نُسمّيه بـ«الحكيم» لأنه متّصفٌ بالحكمة،"], [587.0, "ولا نُسمّيه بـ«الحَكَم» لأنه إذا حكم قبل الناسُ حكمَه،"], [595.0, "ولا نُسمّيه بـ«القويّ» لأنه قويُّ النفس أو قويُّ الجسد،"], [602.0, "ولا نُسمّيه بـ«القدير» مراقبين لصفة القدرة فيه."]], "tr": [[545.0, "Birinci asıl ve temel şart:"], [549.0, "İsmin, önceki külliyede şerh ettiğim gibi, Allah Azze ve Celle'ye has bir hakikati içermemesidir;"], [557.0, "yani Allah Azze ve Celle'ye has isimlerden olmamasıdır."], [563.0, "İkinci şart —bu da asıl ve temel bir şarttır—:"], [574.0, "Onunla isimlendirmede sıfat anlamının gözetilmemesidir."], [577.3, "Yani bir mahlûku cömertlikle nitelendiği için \"el-Kerîm\", hikmetle nitelendiği için \"el-Hakîm\", hüküm verdiğinde insanlar hükmünü kabul ettiği için \"el-Hakem\", ruhu veya bedeni güçlü olduğu için \"el-Kavî\" diye isimlendirmeyiz."], [600.0, "Kudret sıfatını onda gözeterek onu \"el-Kadîr\" diye de isimlendirmeyiz."]]}, {"reader": false, "ar": [[609.0, "وذلك لأنّ التسمّي بشيءٍ من أسماء الله مع مراقبة معنى الصفة من خصائص التسمية لله عز وجل؛"], [619.0, "فالله عز وجل نُسمّيه بهذه الأسماء،"], [622.0, "ونشتقّ له من أسمائه صفات،"], [625.0, "فإذا هو ذو الأسماء الحسنى،"], [628.6, "المتّصفُ بصفات كمالها. ولكن قد نُسمّي صغيرًا لا يزال في مهده بأنه «كريم»،"], [637.0, "ونحن لا ندري عن مستقبل زمانه:"], [640.0, "أسيكون كريمًا أو لا؟"], [642.0, "فحينئذٍ تسميةٌ لم يُراقَب فيها معنى الصفة."], [646.0, "أو نُسمّيه بـ«قدير»،"], [648.1, "أو نُسمّيه بـ«جليل»،"], [650.3, "أو نُسمّيه بـ«حميد»،"], [656.0, "ونحن لا ندري عن مستقبل زمانه:"], [658.5, "هل سيتّصف بصفات هذا الاسم أو لا."], [662.0, "فمتى ما كان الاسم ليس بمختصٍّ بالله عز وجل،"], [669.0, "ولم يُراقَب في إطلاقه معنى الصفة،"], [672.0, "فلا بأس بأن يتسمّى المخلوقُ به."]], "tr": [[609.0, "Bu böyledir; çünkü sıfat anlamını gözeterek Allah'ın isimlerinden biriyle isimlendirmek, Allah Azze ve Celle için isimlendirmenin hususiyetlerindendir."], [619.0, "Allah Azze ve Celle'yi bu isimlerle isimlendiririz ve O'nun isimlerinden O'na sıfatlar türetiriz;"], [632.0, "böylece O, en güzel isimlerin sahibi ve bu isimlerin kemâl sıfatlarıyla muttasıf olandır."], [638.0, "Fakat henüz beşiğindeki bir çocuğa \"Kerîm\" adını verebiliriz;"], [642.0, "oysa onun geleceğinde cömert olup olmayacağını bilmeyiz."], [646.0, "Bu durumda bu, sıfat anlamının gözetilmediği bir isimlendirmedir."], [650.3, "Ya da ona \"Kadîr\", \"Celîl\" veya \"Hamîd\" adını veririz;"], [658.5, "oysa geleceğinde bu ismin sıfatlarıyla nitelenip nitelenmeyeceğini bilmeyiz."], [662.0, "Ne zaman ki isim Allah Azze ve Celle'ye has değildir ve verilmesinde sıfat anlamı gözetilmemiştir, mahlûkun onunla isimlenmesinde bir sakınca yoktur."]]}, {"reader": false, "ar": [[676.0, "فإن قلتَ: وما برهانُك على الشرط الثاني؟"], [681.0, "فأقول: البرهانُ على ذلك الحديثُ المعروف،"], [684.5, "وهو حديثُ أبي شُريح:"], [688.0, "أنّ رجلًا من أصحاب النبيّ صلى الله عليه وسلم كان يُسمّى ـ أو يُكنّى ـ بأبي الحَكَم،"], [693.8, "أو الحَكَم، فجاء وافدًا إلى النبيّ صلى الله عليه وسلم،"], [699.0, "فأراد أن يسأله عن سبب تسميته بهذا الاسم،"], [705.0, "فقال: «إنّ قومي إذا اختصموا وحكمتُ بينهم قبلوا حكمي»."], [711.0, "فأطلق عليه قومُه هذا الاسمَ مراقبين في إطلاقه معنى الصفة،"], [718.0, "فلم يرضَ النبيُّ صلى الله عليه وسلم بهذا الإطلاق،"], [723.0, "وقال: «ما أجملَ هذا!»،"], [725.5, "أي: ما أجملَ أن يرضى الخصمان بحكمك،"], [730.0, "وأن تسعى في الإصلاح بين الخصوم بالحكم العادل!"], [735.0, "«ولكن» ـ قال ـ: «إنّ الله هو الحَكَم، وإليه الحُكم»."]], "tr": [[676.0, "Eğer: \"İkinci şartın delili nedir?\" dersen, derim ki:"], [681.0, "Bunun delili bilinen hadis, yani Ebû Şureyh hadisidir:"], [688.0, "Peygamber sallallâhu aleyhi ve sellem'in ashâbından bir adam Ebü'l-Hakem —ya da el-Hakem— diye isimlendiriliyor veya künyeleniyordu."], [694.0, "Peygamber sallallâhu aleyhi ve sellem'e heyet olarak geldi."], [699.0, "(Peygamber) ona bu isimle isimlendirilmesinin sebebini sormak istedi."], [705.7, "O şöyle dedi: \"Kavmim anlaşmazlığa düştüğünde aralarında hüküm verirsem hükmümü kabul ederler.\" Kavmi ona bu ismi, verirken sıfat anlamını gözeterek vermişti."], [717.3, "Peygamber sallallâhu aleyhi ve sellem bu isimlendirmeye razı olmadı ve şöyle buyurdu:"], [723.6, "\"Bu ne güzel!\" Yani iki hasmın senin hükmüne razı olması ve hasımların arasını adil hükümle ıslah etmeye çalışman ne güzel!"], [735.0, "\"Fakat —buyurdu— Hakem ancak Allah'tır ve hüküm O'na aittir.\""]]}, {"reader": false, "ar": [[742.0, "فلم يرضَ النبيُّ صلى الله عليه وسلم بهذه التسمية،"], [747.0, "وعلّةُ عدم رضاه لأنه رُوقب فيها معنى الصفة."], [755.0, "فقال: «هل لك من ولد؟» قال:"], [757.6, "نعم، قال: «مَن أكبرُهم؟» قال:"], [760.4, "شُريح، قال: «أنت أبو شُريح»."], [764.0, "فمتى ما كانت التسميةُ مطابقةً للصفة فإنّ ذلك مانعٌ من موانع التسمية بأسماء الله عز وجل."]], "tr": [[742.0, "Peygamber sallallâhu aleyhi ve sellem bu isimlendirmeye razı olmadı."], [747.0, "Razı olmamasının illeti, onda sıfat anlamının gözetilmiş olmasıdır."], [755.0, "Bunun üzerine: \"Çocukların var mı?\" diye sordu."], [757.6, "\"Evet\" dedi. \"En büyükleri kim?\" dedi."], [760.4, "\"Şureyh\" dedi. \"Sen Ebû Şureyh'sin\" buyurdu."], [764.0, "Ne zaman ki isimlendirme sıfata mutabıktır, bu, Allah Azze ve Celle'nin isimleriyle isimlendirmenin manilerinden bir manidir."]]}, {"reader": false, "ar": [[774.0, "وأمّا الشرطُ الثالث، الذي وصفتُه بقولي:"], [778.0, "إن وُجد فمَغنَم، وإن فات فليس في فواته مَغرَم،"], [786.0, "فهو ألّا يكون الاسمُ معرَّفًا بالألف واللام؛"], [791.0, "فلا نُسمّيه بـ«الكريم» وإنما نُسمّيه «كريمًا»،"], [796.0, "ولا نُسمّيه بـ«القويّ» وإنما نُسمّيه «قويًّا»،"], [801.0, "ولا نُسمّيه بـ«القدير» وإنما نُسمّيه «قديرًا»،"], [807.0, "ولا نُسمّيه بـ«الرحيم» وإنما نُسمّيه «رحيمًا»."], [813.0, "فهذا إن وُجد فهو مَغنَم."]], "tr": [[774.0, "Üçüncü şarta gelince —ki onu \"bulunursa kazançtır, bulunmazsa kaybedilmesinde zarar yoktur\" sözümle nitelemiştim—:"], [783.3, "O da ismin elif-lâm ile marife olmamasıdır."], [791.0, "Onu \"el-Kerîm\" diye değil \"Kerîm\" diye, \"el-Kavî\" diye değil \"Kavî\" diye, \"el-Kadîr\" diye değil \"Kadîr\" diye, \"er-Rahîm\" diye değil \"Rahîm\" diye isimlendiririz. Bu bulunursa kazançtır."]]}, {"reader": false, "ar": [[816.0, "فإن قلتَ: ولماذا جعلتَه مَغنَمًا؟"], [819.2, "فأقول: لأنّ المتقرِّر في القواعد أنّ الألف واللام الداخلة ـ انتبه ـ الداخلة على أسماء الله عز وجل تقتضي استغراقَ مسمّى الاسم له عز وجل."], [833.0, "فإذا قلنا بأنّ الله «العزيز» أي المستغرِق لكلّ معاني العزّة،"], [839.0, "وإذا قلنا بأنّ الله «الحكيم» أي المستغرِق لكلّ معاني الحكمة،"], [846.0, "وإذا قلنا بأنّ الله «القدير» أي المستغرِق لكلّ معاني القدرة."], [853.0, "فلأنّ الألف واللام الداخلة على أسماء الله عز وجل تقتضي الاستغراقَ والعموم،"], [859.9, "كان من الأدب فيمن أراد أن يتسمّى بشيءٍ من ذلك ألّا يجعلها مُحلّاةً بالألف واللام."]], "tr": [[816.0, "Eğer: \"Bunu neden kazanç saydın?\" dersen, derim ki:"], [819.2, "Çünkü kaidelerde yerleşik olan şudur:"], [821.1, "Allah Azze ve Celle'nin isimlerine giren —dikkat et— isimlerine giren elif-lâm, ismin müsemmâsının (ifade ettiği anlamın) tamamının O'na —Azze ve Celle— ait olmasını (istiğrakı) gerektirir."], [833.0, "\"Allah el-Azîz'dir\" dediğimizde, izzetin bütün anlamlarını kuşatan demektir."], [839.0, "\"Allah el-Hakîm'dir\" dediğimizde, hikmetin bütün anlamlarını kuşatan demektir."], [846.0, "\"Allah el-Kadîr'dir\" dediğimizde, kudretin bütün anlamlarını kuşatan demektir."], [853.0, "Allah Azze ve Celle'nin isimlerine giren elif-lâm istiğrak ve umum gerektirdiği için, bunlardan biriyle isimlenmek isteyen kimsenin onu elif-lâm ile süslememesi edebdendir."]]}, {"reader": false, "ar": [[868.0, "لكن إن جعلها مُحلّاةً بالألف واللام فإنّ ذلك لا بأس به،"], [876.7, "على أنّ الألف واللام لمطلق التعريف،"], [880.0, "لا لمقتضى الاستغراق. والألف واللام في اللغة العربيّة تأتي لهذا أحيانًا،"], [888.0, "أي للاستغراق، ولهذا أحيانًا،"], [890.5, "أي لمطلق التعريف، كما في قول الله عز وجل:"], [896.6, "<span class=\"ayah\">﴿فَعَصَىٰ فِرْعَوْنُ الرَّسُولَ﴾<\/span> <span class=\"ref\">[المزمل: ١٦]<\/span>، وفرعونُ إنما عصى موسى عليه الصلاة والسلام."], [904.0, "فالألف واللام الداخلة على «الرسول» هنا لا يُراد بها الاستغراق،"], [910.0, "وإنما يُراد بها مطلقُ التعريف."]], "tr": [[868.0, "Fakat onu elif-lâm ile süslerse, elif-lâmın istiğrak gereği için değil sadece tarif (belirlilik) için olması şartıyla bunda bir sakınca yoktur."], [883.0, "Arap dilinde elif-lâm bazen bunun için, yani istiğrak için;"], [887.4, "bazen de bunun için, yani sadece tarif için gelir."], [892.7, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [896.6, "<span class=\"ayah\">﴿Firavun o elçiye isyan etti﴾<\/span> [Müzzemmil 16]."], [904.0, "Firavun ancak Mûsâ aleyhissalâtü vesselâm'a isyan etmişti."], [907.0, "Burada \"er-Resûl\" kelimesine giren elif-lâm ile istiğrak kastedilmez; sadece tarif kastedilir."]]}, {"reader": false, "ar": [[913.0, "ولذلك قلتُ بأنه إن وُجد هذا الشرطُ فهو الأفضل،"], [919.0, "وإن فات، وكان المقصودُ به ـ أي بالألف واللام ـ مجرّدَ التعريف،"], [926.6, "لا للاستغراق التامّ، فإنّ ذلك جائزٌ لا بأس به ولا حرج فيه."], [933.0, "ولذلك ثبت أنّ من أسماء أصحاب النبيّ صلى الله عليه وسلم من اسمُه «حكيم»،"], [942.0, "أليس كذلك؟ وهو حكيمُ بن حِزام رضي الله تعالى عنه،"], [947.0, "والذي روى لنا جُمَلًا من أحاديث النبيّ صلى الله عليه وسلم."], [952.0, "ولعلّ الكلّيّة بذلك قد اتّضحت. والله أعلم."]], "tr": [[913.0, "Bu sebeple dedim ki: Bu şart bulunursa daha faziletlisidir."], [919.0, "Bulunmazsa ve onunla —yani elif-lâm ile— tam istiğrak değil sadece tarif kastedilmişse, bu caizdir;"], [930.7, "bunda bir sakınca ve mahzur yoktur."], [933.0, "Bu sebeple Peygamber sallallâhu aleyhi ve sellem'in ashâbının isimleri arasında \"Hakîm\" adını taşıyanın bulunduğu sabit olmuştur;"], [943.0, "öyle değil mi? O da Hakîm b."], [946.0, "Hizâm'dır —Allah ondan razı olsun—;"], [947.9, "bize Peygamber sallallâhu aleyhi ve sellem'in hadislerinden birçoğunu rivayet etmiştir."], [952.0, "Umarım külliye bununla açıklığa kavuşmuştur. Allah en iyisini bilir."]]}]}, {"ts": "15:56", "title": "3. Külliye: Allah'a verilen isimlerin anlamları O'na hastır, başkasına verilmesi caiz olsa bile", "paras": [{"reader": false, "ar": [[956.0, "الكلّيّة الثالثة: كلُّ اسمٍ لله ـ كلُّ ما أُطلق ـ عفوًا ـ <b>كلُّ ما أُطلق على الله من الأسماء فمعانيها مختصّةٌ به وإن جاز إطلاقُها على غيره.<\/b> <b>كلُّ ما أُطلق على الله عز وجل من الأسماء فمعانيها مختصّةٌ به وإن جاز إطلاقُها على غيره.<\/b>"]], "tr": [[956.0, "3. külliye: Allah'ın her ismi —Allah'a verilen— pardon— 3."], [963.8, "külliye: Allah'a verilen bütün isimlerin anlamları O'na hastır;"], [968.7, "başkasına verilmesi caiz olsa bile.<b> <\/b>3."], [978.0, "külliye: Allah Azze ve Celle'ye verilen bütün isimlerin anlamları O'na hastır;"], [986.5, "başkasına verilmesi caiz olsa bile."]]}, {"reader": false, "ar": [[994.0, "أقول: وهذا متفرِّعٌ عن قاعدة أنّ الاتّفاق في الأسماء لا يستلزم الاتّفاقَ في المسمَّيات."], [1001.0, "فكما أنّ الله عز وجل قد وصف نفسه بصفاتٍ وصف بها عبادَه،"], [1008.2, "وليس الموصوفُ كالموصوف، فكذلك أيضًا سمّى نفسه بأسماءٍ سمّى بها عبادَه،"], [1015.5, "وليس المسمّى كالمسمّى. ففرقانٌ بين «الحكيم» الذي نُطلقه على الله اسمًا و«الحكيم» الذي نُطلقه على المخلوق اسمًا،"], [1028.0, "وفرقانٌ بين «العليم» الذي نُطلقه على الله اسمًا وبين «العليم» الذي نُطلقه على المخلوق اسمًا."], [1036.0, "فكما أنّ الله عز وجل ليس كمثله شيءٌ في ذاته،"], [1042.5, "فكذلك أيضًا ليس كمثله شيءٌ في أسمائه وصفاته وأفعاله."]], "tr": [[994.0, "Derim ki: Bu, \"isimlerde ortaklık, müsemmâlarda (isimlendirilenlerde) ortaklığı gerektirmez\" kaidesinden dallanır."], [1001.0, "Allah Azze ve Celle kendisini, kullarını da nitelediği sıfatlarla nitelemiştir ve nitelenen nitelenen gibi değildir."], [1008.8, "Aynı şekilde kendisine, kullarına da verdiği isimler vermiştir ve isimlendirilen isimlendirilen gibi değildir."], [1019.0, "Allah'a isim olarak verdiğimiz \"el-Hakîm\" ile mahlûka isim olarak verdiğimiz \"el-Hakîm\" arasında fark vardır."], [1028.0, "Allah'a isim olarak verdiğimiz \"el-Alîm\" ile mahlûka isim olarak verdiğimiz \"el-Alîm\" arasında fark vardır."], [1036.0, "Allah Azze ve Celle'nin zâtında O'nun benzeri hiçbir şey olmadığı gibi, isimlerinde, sıfatlarında ve fiillerinde de O'nun benzeri hiçbir şey yoktur."]]}, {"reader": false, "ar": [[1052.0, "ولذلك سمّى الله عز وجل نفسه «حيًّا»،"], [1055.9, "فقال الله عز وجل:"], [1058.1, "<span class=\"ayah\">﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>،"], [1062.0, "وسمّى بعضَ عباده «حيًّا» فقال:"], [1064.7, "<span class=\"ayah\">﴿يُخْرِجُ الْحَيَّ مِنَ الْمَيِّتِ وَمُخْرِجُ الْمَيِّتِ مِنَ الْحَيِّ﴾<\/span> <span class=\"ref\">[الأنعام: ٩٥]<\/span>،"], [1069.0, "وليس هذا الحيُّ مثلَ هذا الحيّ."], [1073.0, "وكذلك أيضًا سمّى نفسه «عليمًا»،"], [1075.9, "كما في قوله عز وجل:"], [1078.7, "<span class=\"ayah\">﴿إِنَّهُ هُوَ السَّمِيعُ الْعَلِيمُ﴾<\/span> <span class=\"ref\">[يوسف: ٣٤]<\/span>،"], [1081.0, "وسمّى بعضَ عباده «عليمًا» فقال:"], [1084.6, "<span class=\"ayah\">﴿وَبَشَّرُوهُ بِغُلَامٍ عَلِيمٍ﴾<\/span> <span class=\"ref\">[الذاريات: ٢٨]<\/span>، يعني إسحاقَ عليه الصلاة والسلام."], [1092.0, "وعلمُ الله عز وجل مختصٌّ به؛"], [1095.0, "فهو علمٌ كاملٌ غيرُ مسبوقٍ بجهل،"], [1098.0, "ولا يلحقه نسيان، ولا يعتريه نقص،"], [1101.0, "بخلاف علم الإنسان المضاف إليه؛"], [1104.0, "فإنه علمٌ ابتدائيّ، ويعتريه النسيانُ والنقص."]], "tr": [[1052.0, "Bu sebeple Allah Azze ve Celle kendisine \"Hayy (diri)\" adını verdi ve Allah Azze ve Celle şöyle buyurdu:"], [1060.3, "<span class=\"ayah\">﴿Allah, O'ndan başka ilâh yoktur; Hayy'dır, Kayyûm'dur﴾<\/span> [Bakara 255]."], [1064.7, "Kullarından bazısına da \"hayy (diri)\" adını verdi ve şöyle buyurdu:"], [1068.5, "<span class=\"ayah\">﴿Ölüden diriyi çıkarır, diriden de ölüyü çıkarandır﴾<\/span> [En'âm 95]."], [1073.0, "Bu diri, o diri gibi değildir."], [1075.9, "Aynı şekilde kendisine \"Alîm\" adını verdi;"], [1078.7, "nitekim Azze ve Celle şöyle buyurur:"], [1081.0, "<span class=\"ayah\">﴿Şüphesiz O, işitendir, bilendir﴾<\/span> [Yûsuf 34]."], [1084.6, "Kullarından bazısına da \"alîm\" adını verdi ve şöyle buyurdu:"], [1092.0, "<span class=\"ayah\">﴿Ona bilgin bir oğul müjdelediler﴾<\/span> [Zâriyât 28];"], [1095.0, "yani İshak aleyhissalâtü vesselâm'ı. Allah Azze ve Celle'nin ilmi O'na hastır:"], [1098.0, "Cehaletle öncelenmemiş, unutkanlığın arız olmadığı, eksikliğin ilişmediği kâmil bir ilimdir."], [1101.0, "Kendisine izafe edilen insan ilmi ise böyle değildir;"], [1104.0, "o sonradan başlayan bir ilimdir ve ona unutkanlık ve eksiklik ilişir."]]}, {"reader": false, "ar": [[1110.0, "وكذلك أيضًا سمّى نفسه «حليمًا»،"], [1116.0, "كما في قوله عز وجل:"], [1119.0, "<span class=\"ayah\">﴿إِنَّهُ كَانَ حَلِيمًا غَفُورًا﴾<\/span> <span class=\"ref\">[الإسراء: ٤٤]<\/span>،"], [1123.0, "وسمّى بعضَ عباده «حليمًا»،"], [1125.8, "كما في قوله: <span class=\"ayah\">﴿فَبَشَّرْنَاهُ بِغُلَامٍ حَلِيمٍ﴾<\/span> <span class=\"ref\">[الصافات: ١٠١]<\/span>،"], [1130.0, "يعني إسماعيلَ عليه الصلاة والسلام."], [1132.0, "وليس الحليمُ كالحليم وإن اتّفق في الاسم؛"], [1139.0, "لأنّ الاتّفاق في الأسماء لا يستلزم الاتّفاقَ في المسمَّيات."]], "tr": [[1110.0, "Aynı şekilde kendisine \"Halîm\" adını verdi;"], [1116.0, "nitekim Azze ve Celle şöyle buyurur:"], [1119.0, "<span class=\"ayah\">﴿Şüphesiz O, halîmdir, çok bağışlayandır﴾<\/span> [İsrâ 44]."], [1123.7, "Kullarından bazısına da \"halîm\" adını verdi;"], [1127.9, "nitekim şöyle buyurur: <span class=\"ayah\">﴿Biz de ona halîm bir oğul müjdeledik﴾<\/span> [Sâffât 101];"], [1132.0, "yani İsmâil aleyhissalâtü vesselâm'ı. İsimde ortak olsa da halîm halîm gibi değildir;"], [1141.1, "çünkü isimlerde ortaklık, müsemmâlarda ortaklığı gerektirmez."]]}, {"reader": false, "ar": [[1146.0, "وسمّى نفسه «سميعًا بصيرًا» فقال:"], [1150.4, "<span class=\"ayah\">﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا وَإِذَا حَكَمْتُم بَيْنَ النَّاسِ أَن تَحْكُمُوا بِالْعَدْلِ ۚ إِنَّ اللَّهَ نِعِمَّا يَعِظُكُم بِهِ ۗ إِنَّ اللَّهَ كَانَ سَمِيعًا بَصِيرًا﴾<\/span> <span class=\"ref\">[النساء: ٥٨]<\/span>،"], [1165.0, "وسمّى بعضَ عباده «سميعًا بصيرًا» فقال:"], [1168.5, "<span class=\"ayah\">﴿إِنَّا خَلَقْنَا الْإِنسَانَ مِن نُّطْفَةٍ أَمْشَاجٍ نَّبْتَلِيهِ فَجَعَلْنَاهُ سَمِيعًا بَصِيرًا﴾<\/span> <span class=\"ref\">[الإنسان: ٢]<\/span>،"], [1174.5, "وليس السميعُ كالسميع، ولا البصيرُ كالبصير."]], "tr": [[1146.0, "Kendisine \"Semî' (işiten) ve Basîr (gören)\" adını verdi ve şöyle buyurdu:"], [1150.4, "<span class=\"ayah\">﴿Şüphesiz Allah size emanetleri ehline vermenizi ve insanlar arasında hükmettiğinizde adaletle hükmetmenizi emrediyor. Allah'ın size verdiği öğüt ne güzeldir! Şüphesiz Allah işitendir, görendir﴾<\/span> [Nisâ 58]."], [1162.4, "Kullarından bazısına da \"semî' ve basîr\" adını verdi ve şöyle buyurdu:"], [1168.5, "<span class=\"ayah\">﴿Şüphesiz biz insanı, onu imtihan etmek için karışık bir nutfeden yarattık da onu işiten ve gören kıldık﴾<\/span> [İnsân 2]."], [1174.5, "İşiten işiten gibi değildir, gören de gören gibi değildir."]]}, {"reader": false, "ar": [[1178.0, "وسمّى نفسه بـ«الرؤوف الرحيم»،"], [1180.0, "فقال الله عز وجل:"], [1182.7, "<span class=\"ayah\">﴿إِنَّ اللَّهَ بِالنَّاسِ لَرَءُوفٌ رَّحِيمٌ﴾<\/span> <span class=\"ref\">[البقرة: ١٤٣]<\/span>،"], [1186.0, "وسمّى بعضَ عباده بـ«الرؤوف الرحيم» فقال:"], [1189.7, "<span class=\"ayah\">﴿لَقَدْ جَاءَكُمْ رَسُولٌ مِّنْ أَنفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُم بِالْمُؤْمِنِينَ رَءُوفٌ رَّحِيمٌ﴾<\/span> <span class=\"ref\">[التوبة: ١٢٨]<\/span>."]], "tr": [[1178.0, "Kendisine \"Raûf ve Rahîm\" adını verdi;"], [1179.5, "Allah Azze ve Celle şöyle buyurdu:"], [1182.7, "<span class=\"ayah\">﴿Şüphesiz Allah insanlara karşı çok şefkatli, çok merhametlidir﴾<\/span> [Bakara 143]."], [1186.0, "Kullarından bazısına da \"raûf ve rahîm\" adını verdi ve şöyle buyurdu:"], [1189.7, "<span class=\"ayah\">﴿Andolsun, size kendi içinizden öyle bir peygamber gelmiştir ki sıkıntıya uğramanız ona ağır gelir; size çok düşkündür, mü'minlere karşı çok şefkatli, çok merhametlidir﴾<\/span> [Tevbe 128]."]]}, {"reader": false, "ar": [[1200.0, "وليس الرؤوفُ كالرؤوف، ولا الرحيمُ كالرحيم."], [1204.0, "أنتم معي ولّا لا؟"], [1206.0, "وسمّى نفسه بـ«الجبّار المتكبّر»،"], [1209.0, "وسمّى بعضَ خلقه ـ ووصفهم ـ بالجبّار المتكبّر،"], [1214.0, "فقال: <span class=\"ayah\">﴿كَذَٰلِكَ يَطْبَعُ اللَّهُ عَلَىٰ كُلِّ قَلْبِ مُتَكَبِّرٍ جَبَّارٍ﴾<\/span> <span class=\"ref\">[غافر: ٣٥]<\/span>،"], [1219.0, "وليس الجبّارُ كالجبّار، ولا المتكبّرُ كالمتكبّر."], [1223.0, "وهكذا دواليك. فكما أنّنا نقول بأنّ الله له ذاتٌ ليست كالذوات،"], [1228.0, "فيلزم من ذلك أن نقول:"], [1230.8, "له أسماءٌ ليست كالأسماء وإن اتّفقت في ألفاظها،"], [1235.9, "وله صفاتٌ ليست كالصفات وإن اتّفقت في أسمائها."], [1240.0, "وهذا واضح، والله أعلم."]], "tr": [[1200.0, "Raûf raûf gibi değildir, rahîm de rahîm gibi değildir."], [1204.0, "Benimle misiniz, değil misiniz? Kendisine \"el-Cebbâr el-Mütekebbir\" adını verdi;"], [1207.2, "yaratılmışlarından bazısına da \"cebbâr ve mütekebbir\" adını verdi —onları bununla niteledi— ve şöyle buyurdu:"], [1214.6, "<span class=\"ayah\">﴿Allah, kibirli ve zorba olan her kalbi işte böyle mühürler﴾<\/span> [Gâfir 35]."], [1219.0, "Cebbâr cebbâr gibi değildir, mütekebbir de mütekebbir gibi değildir."], [1223.0, "Ve bu böyle devam eder."], [1224.9, "Nasıl ki \"Allah'ın zâtlara benzemeyen bir zâtı vardır\" diyoruz, bundan şunu söylememiz de lâzım gelir:"], [1230.8, "O'nun, lafızlarda ortak olsalar da isimlere benzemeyen isimleri ve adlarda ortak olsalar da sıfatlara benzemeyen sıfatları vardır."], [1240.0, "Bu açıktır. Allah en iyisini bilir."]]}]}, {"ts": "20:42", "title": "4. Külliye: Allah'ın isimlerinden birine vahyin delili olmaksızın bir hususiyet isnat eden herkes yalancı bir deccaldir", "paras": [{"reader": false, "ar": [[1242.0, "ومن الكلّيّات أيضًا كلّيّةٌ مهمّةٌ جدًّا،"], [1247.0, "أرجو أن تنتبهوا لها؛"], [1249.9, "لأنّ كثيرًا من الناس ممّن ينتسبون إلى علوم الطاقة قد وقعوا في مخالفتها."], [1257.0, "وهي كلّيّةٌ تقول: كلُّ من اعتقد ـ <b>كلُّ من اعتقد خصيصةً في شيءٍ من أسماء الله بلا دليل الوحي فكاذبٌ دجّال.<\/b> <b>كلُّ من اعتقد خصيصةً في شيءٍ من أسماء الله عز وجل بلا دليل الوحي فهو كاذبٌ دجّال.<\/b> أُعيدها مرّةً ثالثة:"], [1293.0, "<b>كلُّ من اعتقد خصيصةً في شيءٍ من أسماء الله تعالى بلا دليل الوحي فهو كاذبٌ دجّال.<\/b>"]], "tr": [[1242.0, "Külliyelerden biri de çok önemli bir külliyedir;"], [1245.8, "ona dikkat etmenizi rica ediyorum."], [1249.9, "Çünkü kendilerini \"enerji ilimleri\"ne nispet eden insanların çoğu ona muhalefete düşmüştür."], [1255.0, "Bu külliye şöyle der: İnanan herkes— 4."], [1259.0, "külliye: Allah'ın isimlerinden birinde vahyin delili olmaksızın bir hususiyet olduğuna inanan herkes yalancı bir deccaldir.<b> <\/b>4."], [1271.2, "külliye: Allah Azze ve Celle'nin isimlerinden birinde vahyin delili olmaksızın bir hususiyet olduğuna inanan herkes yalancı bir deccaldir. Üçüncü kez tekrar ediyorum:"], [1293.0, "<b>4. külliye: Allah Teâlâ'nın isimlerinden birinde vahyin delili olmaksızın bir hususiyet olduğuna inanan herkes yalancı bir deccaldir.<\/b>"]]}, {"reader": false, "ar": [[1300.0, "أقول وبالله التوفيق: وذلك لأنّ الخصائص الشرعيّة مبنيّةٌ على التوقيف؛"], [1308.0, "فلا يجوز لأحدٍ أن يدّعي خصيصةً في شيءٍ غيبيٍّ إلا وعلى ذلك الادّعاء دليلٌ من الشرع."], [1318.0, "فيدخل في ذلك جُمَلٌ من الفروع:"], [1323.0, "منها الذين يزعمون أنّ لكلّ اسمٍ من أسماء الله عز وجل خواصَّ وأسرارًا تتعلّق به،"], [1333.6, "وأنّ لكلّ اسمٍ خادمًا،"], [1336.1, "وأنّ لكلّ اسمٍ من أسماء الله عز وجل خادمًا روحانيًّا يخدم من يُواظب على الذكر به؛"], [1346.9, "كالذين يُواظبون على اسم «الودود» ويُكرّرونه،"], [1353.3, "اعتقادًا منهم أنّ لهذا الاسم خادمًا من الأرواح يُسخّره الله عز وجل في خدمة من يُكرّر هذا الاسم،"], [1362.0, "أو أنّ له خصائصَ على النفس والروح لا تكون في الأسماء الأخرى،"], [1374.0, "كما يزعمه كثيرٌ من الصوفيّة."], [1380.0, "فهذا من جملة ما لا يجوز اعتقادُه؛"], [1384.7, "لأنّ ذلك كلَّه من عالم الغيب،"], [1388.0, "ولا يجوز إثباتُ شيءٍ من الغيب إلا إذا دلّ عليه دليلٌ من الشرع."]], "tr": [[1300.0, "Tevfik Allah'tandır, derim ki: Bu böyledir;"], [1302.0, "çünkü şer'î hususiyetler tevkîfe (nassa) dayanır."], [1308.0, "Hiç kimsenin gaybî bir şeyde bir hususiyet iddia etmesi, ancak bu iddia üzerine şeriattan bir delil varsa caizdir."], [1318.0, "Buna birçok fer'î mesele girer."], [1323.0, "Bunlardan biri, Allah Azze ve Celle'nin isimlerinden her birinin kendisine taalluk eden havassı ve sırları olduğunu, her ismin bir hâdimi (hizmetçisi) olduğunu, Allah Azze ve Celle'nin isimlerinden her birinin, onunla zikre devam edene hizmet eden ruhânî bir hâdimi olduğunu iddia edenlerdir."], [1346.9, "Tıpkı \"el-Vedûd\" ismine devam edip onu tekrarlayanlar gibi;"], [1354.0, "onlar bu ismin, Allah Azze ve Celle'nin bu ismi tekrarlayanın hizmetine verdiği ruhlardan bir hâdimi olduğuna inanırlar."], [1361.5, "Ya da sûfîlerin çoğunun iddia ettiği gibi, bu ismin nefis ve ruh üzerinde diğer isimlerde bulunmayan hususiyetleri olduğuna (inanırlar)."], [1380.0, "Bu, inanılması caiz olmayan şeyler cümlesindendir;"], [1384.7, "çünkü bunların hepsi gayb âlemindendir ve gaybdan bir şeyi isbat etmek, ancak ona şeriattan bir delil delalet ettiğinde caizdir."]]}, {"reader": false, "ar": [[1395.0, "ومنها أيضًا زعمُ بعضهم بأنّ بعض الأسماء لها خصيصةٌ في فتح بعض المُغلَقات دون غيرها؛"], [1403.0, "فإذا استغلق عليك شيءٌ من أبواب الدين أو الدنيا دلّوك على تكرار اسمٍ معيّنٍ ليُفتح بتكراره ذلك المُغلَق،"], [1417.0, "فيجعلون من خصائص هذا الاسم فتحَ المُغلَقات."], [1423.0, "وهذا من جملة الخصائص التي لا يقبلها أهلُ السنّة والجماعة إلا بدليل."], [1430.0, "بل إنّ كثيرًا من السحرة دخلوا على أهل الإسلام من هذا الباب؛"], [1438.0, "فإنهم يجعلون تكرارَ بعض الأسماء رُقيةً سحريّةً وشعوذةً شيطانيّة،"], [1446.0, "يُدخلون تحتها نفثَهم <span class=\"q\">؟ 24:06<\/span> واستغاثتَهم بالشياطين،"], [1450.8, "فهم يُظهرون أنهم يُنادون هذا الاسم،"], [1455.0, "وإنما يقصدون به من تحته من أسماء الجنّ والشياطين،"], [1461.0, "كما يفعله بعضُ السحرة."]], "tr": [[1395.0, "Bunlardan biri de bazılarının, bazı isimlerin diğerlerinde olmayan, bazı kapalı şeyleri açma hususiyeti olduğunu iddia etmesidir."], [1403.0, "Din veya dünya kapılarından biri sana kapandığında, onu tekrarlamakla o kapalı şeyin açılması için seni belirli bir ismi tekrarlamaya yönlendirirler;"], [1415.7, "böylece kapalı şeyleri açmayı bu ismin hususiyetlerinden sayarlar."], [1423.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'in ancak delille kabul ettiği hususiyetler cümlesindendir."], [1426.5, "Hatta sihirbazların çoğu Müslümanlara bu kapıdan girmiştir."], [1430.0, "Bazı isimlerin tekrarını sihrî bir rukye ve şeytanî bir şa'beze (hokkabazlık) yaparlar;"], [1438.0, "bunun altına üfürüklerini <span class=\"q\">؟<\/span> ve şeytanlardan yardım dilemelerini sokarlar."], [1447.6, "Bu ismi çağırıyormuş gibi görünürler;"], [1453.5, "hâlbuki onunla, onun altındaki cin ve şeytan isimlerini kastederler. Bazı sihirbazların yaptığı gibi."]]}, {"reader": false, "ar": [[1464.0, "وكما يزعم بعضُهم من أنّ الاسم الفلانيّ يُستجلَب به الحبيبُ الشارد،"], [1477.0, "أو أنّ الاسم الفلانيّ يُستفتَح به مُغلَقُ الزوج المفقود،"], [1484.0, "أو أنّ الاسم الفلانيّ تُستحفَظ به التجارةُ من الخسارة،"], [1489.0, "أو أنّ الاسم الفلانيّ يُستحفَظ به العبدُ من الضرر والشرور،"], [1497.0, "أو أنّ الاسم الفلانيّ يُستحفَظ به الأولادُ من العين والمسّ،"], [1504.0, "ونحو ذلك من الخصائص التي يدّعيها بعضُهم فيها."], [1509.0, "وكلُّ ذلك من الكذب البيّن،"], [1512.6, "والافتراء الواضح، ومن الاستخفاف بعقول العوامّ والجهّال،"], [1520.0, "ومن القول على الله عز وجل بلا علم،"], [1524.0, "ومن إثبات حكمٍ شرعيٍّ وخصيصةٍ غيبيّةٍ بلا حجّةٍ ولا برهان."]], "tr": [[1464.0, "Bir de bazılarının iddia ettiği gibi:"], [1468.1, "Filan isimle kaçıp giden sevgili geri getirilir;"], [1478.4, "filan isimle kayıp eşin kapalı (kısmeti) açılır;"], [1484.0, "filan isimle ticaret zarardan korunur;"], [1486.8, "filan isimle kul zarardan ve kötülüklerden korunur;"], [1491.8, "filan isimle çocuklar nazardan ve cin çarpmasından korunur."], [1498.4, "Bazılarının bu isimlerde iddia ettiği buna benzer hususiyetler de böyledir."], [1505.2, "Bütün bunlar apaçık yalan, açık iftira, avamın ve cahillerin akıllarıyla alay etmek, Allah Azze ve Celle hakkında ilimsiz konuşmak ve hiçbir hüccet ve delil olmaksızın şer'î bir hüküm ve gaybî bir hususiyet isbat etmektir."]]}, {"reader": false, "ar": [[1531.0, "بل هذا كلُّه يدخل تحت قول الله عز وجل:"], [1535.0, "<span class=\"ayah\">﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ ۚ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا﴾<\/span> <span class=\"ref\">[الإسراء: ٣٦]<\/span>،"], [1543.0, "وتحت قوله عز وجل:"], [1545.0, "<span class=\"ayah\">﴿وَأَن تَقُولُوا عَلَى اللَّهِ مَا لَا تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ٣٣]<\/span>؛"], [1551.0, "فهو من افتراء الإفك على الله، ومن البهتان الواضح."]], "tr": [[1531.0, "Hatta bunların hepsi Allah Azze ve Celle'nin şu sözünün altına girer:"], [1535.0, "<span class=\"ayah\">﴿Hakkında bilgin olmayan şeyin ardına düşme. Çünkü kulak, göz ve kalp, bunların hepsi ondan sorumludur﴾<\/span> [İsrâ 36]."], [1541.7, "Ve Azze ve Celle'nin şu sözünün altına girer:"], [1545.0, "<span class=\"ayah\">﴿Allah hakkında bilmediğiniz şeyleri söylemenizi (haram kıldı)﴾<\/span> [A'râf 33]."], [1551.0, "Bu, Allah'a karşı yalan uydurmak ve apaçık bir bühtandır."]]}, {"reader": false, "ar": [[1556.0, "وكالذين يزعمون بأنّ لكلّ اسمٍ من أسماء الله خصيصةً شفائيّةً من مرضٍ معيّن:"], [1569.0, "فمرضُ السحر له هذا الاسم،"], [1571.5, "ومرضُ العين له هذا الاسم،"], [1574.0, "ومرضُ السرطان له هذا الاسم،"], [1577.0, "ومرضُ كذا له اسمُ كذا،"], [1580.0, "فيُوزّعون أسماءَ الله عز وجل في خصائصها على بعض الأمراض،"], [1586.6, "طلبًا للشفاء منها بتكرارها،"], [1591.0, "ويُدخلون ذلك في مسمّى الرُّقية الشرعيّة،"], [1595.0, "وهي إلى البدعة ـ وهي بالبدعة أحقُّ وألصق."], [1602.0, "فلا ينبغي للعقلاء أن يُتابعوا هؤلاء في مثل هذه التخرُّصات والتهوُّكات <span class=\"q\">؟ 26:42<\/span>."], [1608.0, "فهذه الكلّيّة تسدّ عنّا هذا الإفكَ والبهتانَ في باب أسماء الله عز وجل. والله أعلم."]], "tr": [[1556.0, "Bir de Allah'ın isimlerinden her birinin belirli bir hastalıktan şifa verme hususiyeti olduğunu iddia edenler gibi:"], [1569.0, "Sihir hastalığı için şu isim, nazar hastalığı için şu isim, kanser hastalığı için şu isim, şu hastalık için şu isim (derler)."], [1578.8, "Böylece Allah Azze ve Celle'nin isimlerini, tekrarlanmalarıyla şifa bulmak için, hususiyetleri bakımından bazı hastalıklara dağıtırlar ve bunu şer'î rukye adının altına sokarlar."], [1593.7, "Hâlbuki bu bid'ate —bid'ate daha lâyık ve daha yakındır."], [1602.0, "Akıllıların bu tür zan ve kuruntularda, şaşkınlıklarda <span class=\"q\">؟<\/span> bunlara uyması uygun değildir."], [1608.0, "Bu külliye, Allah Azze ve Celle'nin isimleri babında bu iftira ve bühtanın önünü bize kapatır. Allah en iyisini bilir."]]}]}, {"ts": "26:55", "title": "5. Külliye: Allah'tan başkasına kulluk bildiren her isim haramdır", "paras": [{"reader": false, "ar": [[1616.3, "ومن الكلّيّات أيضًا ـ كم جلسنا؟"], [1619.7, "ـ: <b>كلُّ اسمٍ معبَّدٍ لغير الله تعالى فمحرَّم.<\/b> <b>كلُّ اسمٍ معبَّدٍ لغير الله عز وجل فمحرَّم.<\/b> <b>كلُّ اسمٍ معبَّدٍ لغير الله تعالى فمحرَّم.<\/b> أُعيدها مرّةً ثالثة:"], [1646.8, "<b>كلُّ اسمٍ معبَّدٍ لغير الله فمحرَّم.<\/b>"]], "tr": [[1616.3, "Külliyelerden biri de şudur —ne kadar oturduk?—:"], [1619.7, "5. külliye: Allah Teâlâ'dan başkasına kul kılan (muabbed) her isim haramdır. 5."], [1625.0, "külliye: Allah Azze ve Celle'den başkasına kul kılan her isim haramdır.<b> <\/b>5."], [1630.4, "külliye: Allah Teâlâ'dan başkasına kul kılan her isim haramdır. Üçüncü kez tekrar ediyorum:"], [1646.8, "<b>5. külliye: Allah'tan başkasına kul kılan her isim haramdır.<\/b>"]]}, {"reader": false, "ar": [[1653.0, "أقول وبالله التوفيق: وهذه الكلّيّة من الكلّيّات التي اتّفق عليها أهلُ السنّة والجماعة،"], [1662.0, "وحكى ذلك الاتّفاقَ إمامان جليلان،"], [1666.0, "ومن بعدهما يحكي اتّفاقهما:"], [1671.0, "منهم الإمامُ النوويّ رحمه الله تعالى،"], [1675.2, "فإنه قال في «شرح صحيح الإمام مسلم»:"], [1678.0, "«أجمع العلماءُ على تحريم التسمية بكلّ اسمٍ معبَّدٍ لغير الله تعالى»."], [1689.0, "والثاني: الإمامُ ابنُ حزم رحمه الله تعالى،"], [1697.0, "فإنه حكى الإجماعَ في كتابه «مراتب الإجماع» بقوله:"], [1704.7, "«واتّفقوا على تحريم كلّ اسمٍ معبَّدٍ لغير الله، كعبد العُزّى، وعبد الكعبة، وعبد النبيّ، وعبد الحسين، ونحو ذلك، حاشا عبدَ المطّلب». انتهى كلامُه."]], "tr": [[1653.0, "Tevfik Allah'tandır, derim ki: Bu külliye, Ehl-i Sünnet ve'l-Cemaat'in üzerinde ittifak ettiği külliyelerdendir."], [1663.9, "Bu ittifakı iki büyük imam nakletmiştir;"], [1671.0, "onlardan sonrakiler de onların ittifakını nakleder."], [1674.8, "Bunlardan biri İmam en-Nevevî'dir —Allah ona rahmet etsin—;"], [1678.0, "\"Şerhu Sahîhi'l-İmâm Müslim\"de şöyle demiştir:"], [1683.0, "\"Âlimler, Allah Teâlâ'dan başkasına kul kılan her isimle isimlendirmenin haram olduğu üzerinde icmâ etmiştir.\" İkincisi İmam İbn Hazm'dır —Allah ona rahmet etsin—;"], [1704.7, "\"Merâtibü'l-icmâ'\" adlı kitabında şu sözüyle icmâı nakletmiştir:"], [1708.3, "\"Abdüluzzâ, Abdülkâbe, Abdünnebî, Abdülhüseyin ve benzeri gibi Allah'tan başkasına kul kılan her ismin haram olduğu üzerinde ittifak ettiler; Abdülmuttalib hariç.\" Sözü bitti."]]}, {"reader": false, "ar": [[1723.0, "والمقصودُ من ذلك حكايةُ الإجماع،"], [1727.0, "وأمّا استثناؤه لهذا الاسم فإنّ الكلام عليه سيأتي بعد قليلٍ إن شاء الله."], [1736.0, "وبناءً على ذلك فكلُّ اسمٍ عُبِّد لغير الله عز وجل فالواجبُ تغييرُه:"], [1742.0, "كعبد الحارث، وعبد مَناة،"], [1747.0, "وعبد اللات، أو عبد شمس،"], [1752.0, "أو عبد الحسين، أو عبد الرضا،"], [1755.9, "أو عبد صاحب السرداب،"], [1758.5, "أو عبد الكعبة، أو عبد النبيّ،"], [1764.0, "أو ما أشبه ذلك ممّا هو معروفٌ عند كثيرٍ من الناس."], [1770.0, "فمثلُ هذه التسمية لا تجوز لهذا الإجماع،"], [1774.7, "ولأنها تتضمّن العبوديّةَ لغير الله عز وجل،"], [1782.0, "والتعبّدُ لغير الله عز وجل محرّمٌ وشرك."]], "tr": [[1723.0, "Bundan maksat icmâın nakledilmesidir. Bu ismi istisna etmesine gelince, inşallah az sonra onun hakkında konuşulacak."], [1736.0, "Buna binaen Allah Azze ve Celle'den başkasına kul kılınan her ismin değiştirilmesi vaciptir:"], [1742.0, "Abdülhâris, Abdümenât, Abdüllât, Abdüşems, Abdülhüseyin, Abdurrızâ, Abdüsâhibisserdâb (sırdap sahibinin kulu), Abdülkâbe, Abdünnebî veya insanların çoğu nezdinde bilinen buna benzer isimler gibi."], [1764.0, "Bu tür bir isimlendirme bu icmâ sebebiyle caiz değildir;"], [1770.0, "bir de Allah Azze ve Celle'den başkasına kulluk içerdiği için (caiz değildir)."], [1777.4, "Allah Azze ve Celle'den başkasına kulluk etmek haramdır ve şirktir."]]}, {"reader": false, "ar": [[1787.0, "وبذلك أفتت اللجنةُ الدائمة لمّا سُئلت عن اسم «عبد النبيّ»،"], [1794.0, "فأفتَوا بأنها لا تجوز؛"], [1796.2, "لأنها تتضمّن معنًى غيرَ صحيح."]], "tr": [[1787.0, "Daimi Komisyon (el-Lecnetü'd-Dâime) da \"Abdünnebî\" ismi sorulduğunda bununla fetva verdi:"], [1792.7, "Bu ismin caiz olmadığına, çünkü sahih olmayan bir anlam içerdiğine fetva verdiler."]]}]}, {"ts": "29:59", "title": "5. Külliye (devam): İbn Hazm'ın \"Abdülmuttalib\" istisnası ve cevabı", "paras": [{"reader": false, "ar": [[1799.0, "فإن قلتَ: وكيف الإجابةُ عمّا استثناه ابنُ حزمٍ في حكاية الإجماع من قوله:"], [1809.2, "«حاشا عبدَ المطّلب»؟ فأقول:"], [1811.7, "إنّ الذين استثنَوا هذا الاسمَ استدلّوا بدليلين:"], [1817.0, "دليلٍ أثريٍّ ودليلٍ نظريّ."], [1822.0, "فأمّا الأثريّ: ففي بعض الغزوات لمّا تفرّق المسلمون عن النبيّ صلى الله عليه وسلم كان يرفع صوته بقوله:"], [1833.7, "«أنا النبيُّ لا كذب، أنا ابنُ عبد المطّلب»."], [1839.0, "فلو كانت التسميةُ بعبد المطّلب من الأسماء الممنوعة المحرّمة لما حكاها النبيُّ صلى الله عليه وسلم."]], "tr": [[1799.0, "Eğer: \"İbn Hazm'ın icmâı naklederken 'Abdülmuttalib hariç' sözüyle istisna ettiğine cevap nasıldır?\" dersen, derim ki:"], [1809.2, "Bu ismi istisna edenler iki delille istidlal ettiler:"], [1811.0, "Eserî (rivayete dayalı) bir delil ve nazarî (akla dayalı) bir delil."], [1822.0, "Eserî delile gelince: Gazvelerden birinde Müslümanlar Peygamber sallallâhu aleyhi ve sellem'in etrafından dağıldığında, o sesini yükselterek şöyle diyordu:"], [1833.7, "\"Ben peygamberim, yalan yok; ben Abdülmuttalib'in oğluyum.\" Eğer Abdülmuttalib ismiyle isimlendirmek yasak ve haram isimlerden olsaydı, Peygamber sallallâhu aleyhi ve sellem onu hikâye etmezdi."]]}, {"reader": false, "ar": [[1850.0, "وهذا فيه نظر؛ لأنّ حكاية النبيّ صلى الله عليه وسلم ليست حكايةَ إقرارٍ وتشريع،"], [1861.0, "وإنما حكايةُ إخبارٍ عن أمرٍ واقع."], [1866.0, "ولذلك لا نزال نحكي في سلسلة نسبه إلى إسماعيل عليه الصلاة والسلام أسماءً قد عُبِّدت لغير الله عز وجل،"], [1879.0, "ولكنّها من باب حكاية الإخبار،"], [1883.0, "وليست من باب حكاية التشريع والإقرار."]], "tr": [[1850.0, "Bunda düşünülecek bir husus vardır;"], [1854.0, "çünkü Peygamber sallallâhu aleyhi ve sellem'in hikâye etmesi bir onaylama ve teşri' hikâyesi değil, vâki bir durumdan haber verme hikâyesidir."], [1866.0, "Bu sebeple onun İsmâil aleyhissalâtü vesselâm'a kadar uzanan nesep silsilesinde Allah Azze ve Celle'den başkasına kul kılınmış isimleri hâlâ zikrederiz;"], [1878.3, "fakat bunlar haber verme hikâyesi kabîlindendir, teşri' ve onaylama hikâyesi kabîlinden değildir."]]}, {"reader": false, "ar": [[1888.0, "وأمّا الدليلُ النظريّ: فلأنهم يقولون في السِّيَر:"], [1899.0, "إنّ «عبد المطّلب» ليست من باب حكاية تعبيد الاسم لغير الله،"], [1906.0, "وإنما من باب حكاية واقع،"], [1909.3, "أي الرقيق لعبد المطّلب <span class=\"q\">؟ 31:46<\/span>،"], [1912.0, "فهي عبوديّةُ رِقّ، وليست عبوديّةَ تسمية؛"], [1916.2, "فكأنها وصفٌ وليست تسمية."], [1923.0, "قلنا: وإن كان كذلك فإنه أيضًا ممنوع،"], [1930.0, "وحكايةُ الواقع في مثل ذلك لا يُسعفه صحّةُ الإسناد."], [1938.0, "وإنما المعروف أنّ جدّ النبيّ صلى الله عليه وسلم إنما أُطلق عليه «عبد المطّلب» جريًا على عادة الجاهليّة في تعبيد كثيرٍ من الأسماء لغير الله عز وجل،"], [1954.0, "ولا يُعرف أنه جرى على جدّه رِقّ ليُقال إنه من باب إطلاق الصفات،"], [1964.0, "وليس من باب إطلاق الأسماء."]], "tr": [[1888.0, "Nazarî delile gelince: Siyer kitaplarında şöyle derler:"], [1899.0, "\"Abdülmuttalib\" ismi, ismin Allah'tan başkasına kul kılınmasını hikâye etme kabîlinden değil, vâki bir durumu hikâye etme kabîlindendir;"], [1911.3, "yani Abdülmuttalib'e (nispet edilen) kölelik <span class=\"q\">؟<\/span>."], [1916.2, "Dolayısıyla bu, isimlendirme kulluğu değil, kölelik kulluğudur;"], [1923.0, "sanki bir vasıftır, isimlendirme değildir."], [1927.5, "Deriz ki: Öyle olsa bile bu da yasaktır."], [1938.0, "Üstelik böyle bir durumda vâkıanın hikâyesini, isnadın sıhhati desteklemez."], [1943.3, "Bilinen şudur: Peygamber sallallâhu aleyhi ve sellem'in dedesine \"Abdülmuttalib\" adı, cahiliyenin birçok ismi Allah Azze ve Celle'den başkasına kul kılma âdetine uyularak verilmişti."], [1955.7, "Dedesine kölelik vâki olduğu bilinmemektedir ki bunun isim verme değil de vasıf verme kabîlinden olduğu söylenebilsin."]]}, {"reader": false, "ar": [[1967.0, "وبناءً على ردّ الاستدلال بهذين الدليلين نقول:"], [1972.7, "بأنّ «عبد المطّلب» من الأسماء المحرّمة التي تدخل في هذا الإجماع،"], [1980.0, "ومن استثناها فلم يُصِب في استثنائه رحمه الله تعالى."]], "tr": [[1967.0, "Bu iki delille istidlalin reddedilmesine binaen deriz ki:"], [1972.7, "\"Abdülmuttalib\" bu icmâa giren haram isimlerdendir."], [1976.7, "Onu istisna eden kimse —Allah ona rahmet etsin— bu istisnasında isabet etmemiştir."]]}, {"reader": false, "ar": [[1985.0, "فإن قلتَ: وكيف تقول فيما ذكره الإمامُ ابنُ عبد البرّ رحمه الله تعالى في كتابه «الاستيعاب» في أسماء الصحابة:"], [2003.0, "أنّ أحد الصحابة اسمُه «عبد المطّلب»،"], [2008.0, "أي عبدُ المطّلب بنُ عبد الله <span class=\"q\">؟ 33:28<\/span>،"], [2011.0, "والنبيُّ صلى الله عليه وسلم لم يثبت عنه أنه غيّره؟"], [2020.0, "فنقول: إنّ هذا غيرُ صحيح؛"], [2024.0, "فليس اسمُه عبدَ المطّلب،"], [2028.0, "وقد أخطأ من سمّاه عبدَ المطّلب،"], [2033.0, "وإنما صوابُه «المطّلب»، وليس عبدَ المطّلب،"], [2042.0, "كما ذكره الحافظُ ابنُ حجرٍ في «الإصابة»،"], [2045.0, "وغيرُه أيضًا من أهل العلم."], [2050.0, "فالصوابُ أنّ اسمه المطّلب،"], [2051.7, "وليس عبدَ المطّلب، بل لا يوجد في أصحاب النبيّ صلى الله عليه وسلم من اسمُه عبدُ المطّلب،"], [2062.0, "وإنما أخطأ بعضُ الرواة في تسميته في بعض كتبه."]], "tr": [[1985.0, "Eğer: \"İmam İbn Abdilber'in —Allah ona rahmet etsin— sahâbe isimleri hakkındaki 'el-İstîâb' adlı kitabında zikrettiği, sahâbeden birinin adının 'Abdülmuttalib' —yani Abdülmuttalib b."], [2003.0, "Abdullah <span class=\"q\">؟<\/span>— olduğu ve Peygamber sallallâhu aleyhi ve sellem'in onu değiştirdiğinin sabit olmadığı hakkında ne dersin?\" dersen, deriz ki:"], [2020.0, "Bu doğru değildir. Onun adı Abdülmuttalib değildir;"], [2024.0, "onu Abdülmuttalib diye isimlendiren hata etmiştir."], [2031.1, "Doğrusu \"el-Muttalib\"dir, Abdülmuttalib değildir; Hâfız İbn Hacer'in \"el-İsâbe\"de ve başka ilim ehlinin de zikrettiği gibi."], [2050.0, "Doğru olan, adının el-Muttalib olduğudur, Abdülmuttalib değildir."], [2053.0, "Hatta Peygamber sallallâhu aleyhi ve sellem'in ashâbı arasında adı Abdülmuttalib olan yoktur;"], [2061.4, "bazı râviler bazı kitaplarında onun adını vermekte hata etmiştir."]]}, {"reader": false, "ar": [[2066.0, "فإن قلتَ: وكيف تقول فيما جاء في «صحيح الإمام مسلم»:"], [2076.2, "«أنّ ابنَ عبدِ رُكانة» ـ «أنّ ابنَ عبدِ رُكانة طلّق زوجتَه البتّة» <span class=\"q\">؟ 34:32<\/span>؛"], [2090.0, "فهذا تعبيدٌ لغير الله عز وجل،"], [2093.6, "ولم يثبت أنّ النبيّ صلى الله عليه وسلم غيّره؟"], [2099.0, "فنقول: إنّ هذه قراءةٌ خاطئة،"], [2102.6, "وإنما المعروف عنه بالتنوين:"], [2108.0, "«أنّ ابنَ عبدٍ رُكانة»."], [2113.0, "فهمتم هذا؟ فهي بالتنوين،"], [2116.7, "وليست بالإضافة، وهذا الذي صحّحه العلماء."]], "tr": [[2066.0, "Eğer: \"'Sahîh-i Müslim'de gelen 'İbn Abdi Rukâne' —'İbn Abdi Rukâne hanımını bette (kesin) olarak boşadı' <span class=\"q\">؟<\/span>— rivayeti hakkında ne dersin?"], [2090.0, "Bu, Allah Azze ve Celle'den başkasına kul kılmaktır ve Peygamber sallallâhu aleyhi ve sellem'in onu değiştirdiği sabit olmamıştır\" dersen, deriz ki:"], [2099.0, "Bu yanlış bir okuyuştur. Onunla ilgili bilinen, tenvinli olarak \"İbnü Abdin Rukâne\" şeklidir."], [2113.0, "Bunu anladınız mı? Tenvinlidir, izafetle (tamlama ile) değildir."], [2120.0, "Âlimlerin sahih kabul ettiği budur."]]}, {"reader": false, "ar": [[2123.0, "وكلُّ هذا يدلّنا على أنّ استثناء ابن حزمٍ لعبد المطّلب لا معنى له."], [2133.0, "فالصحابةُ رضي الله تعالى عنهم اتّفقوا على تحريم تعبيد الاسم لغير الله عز وجل؛"], [2140.0, "فكلُّ اسمٍ لا يجوز أن يُعبَّد لغير الله،"], [2143.0, "فيجب أن تكون العبوديّةُ كلُّها لله عز وجل:"], [2148.0, "واقعًا وتسمية. فهمتم هذا؟"], [2153.0, "واقعًا وتسمية. والله أعلم."]], "tr": [[2123.0, "Bütün bunlar bize İbn Hazm'ın Abdülmuttalib'i istisna etmesinin bir anlamı olmadığını gösterir."], [2129.6, "Sahâbe —Allah onlardan razı olsun— ismin Allah Azze ve Celle'den başkasına kul kılınmasının haram olduğu üzerinde ittifak etmiştir."], [2140.0, "Hiçbir ismin Allah'tan başkasına kul kılınması caiz değildir;"], [2142.2, "kulluğun tamamı, hem vâkıada hem isimlendirmede Allah Azze ve Celle'ye ait olmalıdır."], [2148.0, "Bunu anladınız mı? Hem vâkıada hem isimlendirmede. Allah en iyisini bilir."]]}]}, {"ts": "35:56", "title": "6. Külliye: Her muabbed isimde tasgîrin ikinci cüzüne değil birinci cüzüne girmesi caizdir", "paras": [{"reader": false, "ar": [[2156.0, "ومن الكلّيّات أيضًا ـ طوّلتُ عليكم ـ:"], [2160.0, "كلُّ اسمٍ معبَّد... كلُّ اسمٍ معبَّد ـ وهذه كلّيّةٌ خفيفةٌ وبسيطة ـ:"], [2171.0, "<b>كلُّ اسمٍ معبَّدٍ فيجوز دخولُ التصغير على جزئه الأوّل لا الثاني<\/b> <span class=\"q\">؟ 36:13<\/span>."], [2180.6, "واضح؟ <b>كلُّ اسمٍ معبَّدٍ فيجوز دخولُ التصغير على جزئه الأوّل لا الثاني.<\/b> أُعيدها مرّةً ثالثة:"], [2196.0, "<b>كلُّ اسمٍ معبَّدٍ فيجوز دخولُ التصغير عليه في جزئه الأوّل لا الثاني.<\/b>"]], "tr": [[2156.0, "Külliyelerden biri de —sizi uzun tuttum—:"], [2160.0, "Her muabbed isim... Her muabbed isim —bu hafif ve basit bir külliyedir—:"], [2171.0, "<b>6. külliye: Her muabbed isimde tasgîrin (küçültmenin) ikinci cüzüne değil, birinci cüzüne girmesi caizdir<\/b> <span class=\"q\">؟<\/span>."], [2180.6, "Açık mı? <b>6. külliye: Her muabbed isimde tasgîrin ikinci cüzüne değil, birinci cüzüne girmesi caizdir.<\/b> Üçüncü kez tekrar ediyorum:"], [2196.0, "<b>6. külliye: Her muabbed isimde tasgîrin ikinci cüzüne değil, birinci cüzüne girmesi caizdir.<\/b>"]]}, {"reader": false, "ar": [[2201.0, "أقول وبالله التوفيق: قولُنا «في جزئه الأوّل» أي المضاف،"], [2208.0, "وقولُنا «لا في جزئه الثاني» أي المضاف إليه."], [2217.0, "فالاسمُ المعبَّد ـ نحو عبد العزيز وعبد الرحمن ـ يجوز تصغيرُ الجزء الأوّل منه،"], [2225.6, "وهو المضاف، فيُقال: عُبَيد العزيز،"], [2231.0, "وعُبَيد الله، وعُبَيد الرحمن."], [2236.0, "ولكن لا يجوز تصغيرُ جزئه الثاني،"], [2241.0, "أي المضاف إليه، وهو اسمُ الله عز وجل،"], [2245.0, "كأن يُقال: عبد العُزَيِّز،"], [2250.0, "عبد الرُّحَيِّم، عبد القُدَيِّر، عبد الكُرَيِّم، ونحوها."]], "tr": [[2201.0, "Tevfik Allah'tandır, derim ki: \"Birinci cüzünde\" sözümüz muzâf (tamlanan), \"ikinci cüzünde değil\" sözümüz ise muzâfun ileyh (tamlayan) demektir."], [2217.0, "Abdülazîz ve Abdurrahman gibi muabbed bir ismin birinci cüzünü, yani muzâfı küçültmek caizdir;"], [2227.9, "böylece \"Ubeydülazîz\", \"Ubeydullah\", \"Ubeydurrahman\" denir."], [2236.0, "Fakat ikinci cüzünü, yani Allah Azze ve Celle'nin ismi olan muzâfun ileyhi küçültmek caiz değildir;"], [2246.7, "\"Abdül-Uzeyyiz\", \"Abdür-Ruhayyim\", \"Abdül-Kudeyyir\", \"Abdül-Kureyyim\" ve benzerleri demek gibi."]]}, {"reader": false, "ar": [[2266.0, "فإن قلتَ: وما برهانُك على هذا؟"], [2268.0, "فأقول: إجماعُ العلماء؛ فقد أجمع العلماءُ على تحريم انصباب التصغير على شيءٍ من أسماء الله تبارك وتعالى،"], [2285.0, "وقد حكى هذا الإجماعَ الجُوَينيّ رحمه الله تعالى،"], [2290.0, "ونقله عنه الإمامُ الحافظ ابنُ حجرٍ كما في «الفتح»."], [2296.0, "رحم الله الجميعَ رحمةً واسعة. والله أعلم."]], "tr": [[2266.0, "Eğer: \"Bunun delili nedir?\" dersen, derim ki:"], [2272.0, "Âlimlerin icmâıdır. Âlimler, tasgîrin Allah Tebâreke ve Teâlâ'nın isimlerinden birine yönelmesinin haram olduğu üzerinde icmâ etmiştir."], [2285.0, "Bu icmâı el-Cüveynî —Allah ona rahmet etsin— nakletmiş, İmam Hâfız İbn Hacer de \"el-Feth\"te olduğu gibi ondan nakletmiştir."], [2296.0, "Allah hepsine geniş rahmetiyle rahmet etsin. Allah en iyisini bilir."]]}]}, {"ts": "38:19", "title": "7. Külliye: Her muabbed isimde, sahibi kastedilerek naht caizdir", "paras": [{"reader": false, "ar": [[2299.0, "ومن الكلّيّات أيضًا ـ وهي كلّيّةٌ خفيفةٌ ولطيفةٌ أيضًا ـ:"], [2305.0, "<b>كلُّ اسمٍ معبَّدٍ فيجوز فيه النَّحتُ مقصودًا به صاحبُه.<\/b> ماشي هذه؟"], [2328.0, "<b>كلُّ اسمٍ معبَّدٍ فيجوز فيه النَّحتُ مقصودًا به صاحبُه.<\/b>"]], "tr": [[2299.0, "Külliyelerden biri de —bu da hafif ve latif bir külliyedir—:"], [2305.0, "<b>7. külliye: Her muabbed isimde, sahibi kastedilerek naht (kısaltılmış lakap türetme) caizdir.<\/b> Bu tamam mı?"], [2328.7, "<b>7. külliye: Her muabbed isimde, sahibi kastedilerek naht caizdir.<\/b>"]]}, {"reader": false, "ar": [[2337.0, "أقول وبالله التوفيق: إذا نُحت من الاسم المعبَّد اسمٌ مصغَّر،"], [2351.0, "ولو كان فيه شيءٌ من حروف أسماء الله عز وجل،"], [2356.0, "فإنّ هذا ممّا لا بأس به في أصحّ قولَي أهل العلم،"], [2363.0, "مشروطًا بأن يكون التصغيرُ منصبًّا على المسمّى بهذا الاسم،"], [2370.0, "لا على شيءٍ من أسماء الله عز وجل."], [2374.0, "كما يُقال: «عُزَيِّز» فهو منحوتٌ من عبد العزيز،"], [2379.3, "أو «دُحَيم» فإنه منحوتٌ من عبد الرحمن."], [2390.0, "ولا يزال بعضُ الرواة يُسمّ ـ عفوًا ـ ولا يزال أهلُ العلم يُسمّون بعضَ الرواة بـ«دُحَيم» من غير نكيرٍ فيما بينهم."]], "tr": [[2337.0, "Tevfik Allah'tandır, derim ki: Muabbed isimden, içinde Allah Azze ve Celle'nin isimlerinin harflerinden bir kısmı bulunsa bile küçültülmüş bir isim türetilirse, ilim ehlinin iki görüşünden en sahih olanına göre bunda bir sakınca yoktur."], [2363.0, "Şu şartla ki tasgîr, Allah Azze ve Celle'nin isimlerinden birine değil, bu ismi taşıyan kişiye yönelmiş olsun."], [2374.0, "Nitekim Abdülazîz'den türetilen \"Uzeyyiz\" veya Abdurrahman'dan türetilen \"Duhaym\" denir."], [2390.0, "Hâlâ bazı râviler isim— pardon— ilim ehli hâlâ bazı râvileri aralarında hiçbir itiraz olmaksızın \"Duhaym\" diye anarlar."]]}, {"reader": false, "ar": [[2404.0, "وهذه الكلّيّة ليست من الكلّيّات المتّفق عليها بين أهل العلم،"], [2411.0, "وإنما أخرجناها مخرجَ القول الراجح."], [2415.0, "ولذلك لمّا سُئل الشيخُ ابنُ بازٍ رحمه الله تعالى عن مثل هذا النحت قال:"], [2423.7, "«لا بأس بالتصغير في الأسماء المعبَّدة وغيرها، ولا أعلم أنّ أحدًا من أهل العلم منعه، وهو كثيرٌ في الأحاديث والآثار، كأُنَيس وحُمَيد وعُبَيد وأشباه ذلك». انتهى كلامُه."]], "tr": [[2404.0, "Bu külliye ilim ehli arasında üzerinde ittifak edilen külliyelerden değildir;"], [2409.6, "biz onu râcih görüş olarak ortaya koyduk."], [2415.0, "Bu sebeple Şeyh İbn Bâz'a —Allah ona rahmet etsin— böyle bir naht sorulduğunda şöyle demiştir:"], [2420.5, "\"Muabbed isimlerde ve diğerlerinde tasgîrde bir sakınca yoktur."], [2423.7, "İlim ehlinden birinin onu yasakladığını bilmiyorum."], [2430.7, "Bu, hadislerde ve eserlerde çoktur;"], [2435.4, "Uneys, Humeyd, Ubeyd ve benzerleri gibi.\" Sözü bitti."]]}, {"reader": false, "ar": [[2451.0, "وبناءً على ذلك فإطلاقُ بعض العامّة «عَبّودي» على عبد الله جائزٌ لا بأس به،"], [2461.0, "إذا كان المرادُ بالتصغير المسمّى بهذا الاسم."], [2466.0, "وقولُ العامّة «مَلّوكي» لعبد الملك جائزٌ لا بأس به؛"], [2475.7, "فإنه من النحت، وليس من تصغير الشيء الذي يخصّه اللهُ تبارك وتعالى."], [2485.0, "وكقول بعض العامّة «دَحّومي» لعبد الرحمن أيضًا جائزٌ لا بأس به،"], [2492.0, "وقولُ بعض العامّة «عَزّوز» جائزٌ لا بأس به في الأصحّ،"], [2500.0, "ونحو ذلك. فهذا يُسمّيه أهلُ العلم بالنحت في الاسم المعبَّد،"], [2507.0, "ولا نعلم أحدًا من أهل العلم السابقين أفتى بكراهيته. والله أعلم."]], "tr": [[2451.0, "Buna binaen halkın bir kısmının Abdullah için \"Abbûdî\" demesi, tasgîrle bu ismi taşıyan kişi kastedildiğinde caizdir, sakıncası yoktur."], [2466.0, "Halkın Abdülmelik için \"Mellûkî\" demesi de caizdir, sakıncası yoktur;"], [2475.7, "çünkü bu nahttandır, Allah Tebâreke ve Teâlâ'ya has olan şeyi küçültmek değildir."], [2485.0, "Halkın bir kısmının Abdurrahman için \"Dahhûmî\" demesi de caizdir, sakıncası yoktur."], [2491.6, "Halkın bir kısmının \"Azzûz\" demesi de en sahih görüşe göre caizdir, sakıncası yoktur;"], [2502.0, "benzerleri de böyledir. İlim ehli buna muabbed isimde naht der."], [2506.7, "Önceki ilim ehlinden birinin bunun mekruh olduğuna fetva verdiğini bilmiyoruz. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[2517.0, "ولكن هنا تنبيه، وهي أنّ هذه الكلّيّة تُفيد جوازَ إطلاق هذا الاسم فقط،"], [2527.0, "لكن إذا كان صاحبُه يكره أن يُطلق عليه هذا النحت ـ فهمتم هذا؟"], [2535.0, "ـ فإنه يكون من التنابز بالألقاب،"], [2538.0, "ومن المعلوم أنّ التنابز بالألقاب أمرٌ محرّمٌ لا يجوز؛"], [2544.0, "لقول الله عز وجل:"], [2547.0, "<span class=\"ayah\">﴿وَلَا تَنَابَزُوا بِالْأَلْقَابِ﴾<\/span> <span class=\"ref\">[الحجرات: ١١]<\/span>. والله أعلم."]], "tr": [[2517.0, "Fakat burada bir uyarı var:"], [2519.7, "Bu külliye sadece bu ismin kullanılmasının caiz olduğunu ifade eder."], [2525.1, "Fakat sahibi bu nahtın kendisine söylenmesinden hoşlanmıyorsa —bunu anladınız mı?— bu, lakaplarla birbirini kötülemek olur."], [2535.0, "Bilindiği gibi lakaplarla birbirini kötülemek haramdır, caiz değildir;"], [2539.3, "çünkü Allah Azze ve Celle şöyle buyurur:"], [2544.0, "<span class=\"ayah\">﴿Birbirinizi kötü lakaplarla çağırmayın﴾<\/span> [Hucurât 11]. Allah en iyisini bilir."]]}]}, {"ts": "42:32", "title": "8. Külliye: Allah'a izafe edilen isimler anlamları itibarıyla birbirinden üstün olur", "paras": [{"reader": false, "ar": [[2552.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما يُضاف لله من الأسماء فيتفاضل باعتبار معانيه.<\/b> <b>كلُّ ما يُضاف لله عز وجل من الأسماء فيتفاضل باعتبار معانيه.<\/b> أُعيدها مرّةً ثالثة:"], [2581.0, "<b>كلُّ ما يُضاف لله عز وجل من الأسماء فيتفاضل باعتبار معانيه.<\/b>"]], "tr": [[2552.0, "Külliyelerden biri de şudur: 8."], [2555.0, "külliye: Allah'a izafe edilen bütün isimler, anlamları itibarıyla birbirinden üstün olur (tafâdul eder).<b> <\/b>8."], [2560.7, "külliye: Allah Azze ve Celle'ye izafe edilen bütün isimler, anlamları itibarıyla birbirinden üstün olur. Üçüncü kez tekrar ediyorum:"], [2581.0, "<b>8. külliye: Allah Azze ve Celle'ye izafe edilen bütün isimler, anlamları itibarıyla birbirinden üstün olur.<\/b>"]]}, {"reader": false, "ar": [[2588.0, "أقول وبالله التوفيق: وهذا ما جرى عليه أهلُ السنّة والجماعة رحمهم الله تعالى،"], [2597.0, "وهي أنّ ما يُضاف إلى الله عز وجل يتفاضل باعتبار معناه."], [2601.0, "فالقرآنُ كلامُ الله، فهو مضافٌ إلى الله؛"], [2609.0, "فهل القرآن يتفاضل؟ الجواب:"], [2611.6, "نعم، يتفاضل باعتبار معانيه،"], [2613.8, "لا باعتبار المتكلِّم به."], [2616.0, "والصفاتُ شيءٌ مضافٌ إلى الله؛"], [2619.6, "فهل الصفات تتفاضل؟ الجواب:"], [2623.6, "نعم، تتفاضل صفاتُه باعتبار معانيها،"], [2626.6, "لا باعتبار الموصوف بها."], [2629.0, "وأسماءُ الله مضافةٌ إليه؛"], [2631.9, "فهل أسماءُ الله تتفاضل؟"], [2636.0, "الجواب: نعم، تتفاضل باعتبار معانيها،"], [2639.6, "لا باعتبار المسمّى بها."], [2644.0, "فكلُّ شيءٍ يُضاف إلى الله عز وجل فإنه يتفاضل باعتبار معناه."]], "tr": [[2588.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat'in —Allah onlara rahmet etsin— üzerinde yürüdüğü yol budur:"], [2597.0, "Allah Azze ve Celle'ye izafe edilen şey, anlamı itibarıyla birbirinden üstün olur."], [2601.0, "Kur'ân Allah'ın kelâmıdır, dolayısıyla Allah'a izafe edilmiştir."], [2609.0, "Kur'ân'ın bazısı bazısından üstün olur mu?"], [2611.0, "Cevap: Evet, anlamları itibarıyla üstün olur;"], [2613.8, "onu söyleyen itibarıyla değil. Sıfatlar Allah'a izafe edilen bir şeydir."], [2619.6, "Sıfatlar birbirinden üstün olur mu?"], [2623.0, "Cevap: Evet, O'nun sıfatları anlamları itibarıyla birbirinden üstün olur;"], [2627.2, "onlarla nitelenen itibarıyla değil. Allah'ın isimleri O'na izafe edilmiştir."], [2631.9, "Allah'ın isimleri birbirinden üstün olur mu?"], [2636.0, "Cevap: Evet, anlamları itibarıyla üstün olur;"], [2639.6, "onlarla isimlendirilen itibarıyla değil. Allah Azze ve Celle'ye izafe edilen her şey, anlamı itibarıyla birbirinden üstün olur."]]}, {"reader": false, "ar": [[2649.0, "وممّا يدخل تحت هذا أسماؤه؛"], [2653.0, "فهل يجوز لنا أن نقول بأنّ بعض الأسماء أفضلُ من بعض،"], [2658.0, "أو أنّ بعض الأسماء أعظمُ من بعض؟"], [2660.0, "الجواب: نعم، ولكن لا باعتبار المسمّى بها؛"], [2666.0, "فإنّ المسمّى بها واحدٌ عز وجل،"], [2671.0, "ولكن باعتباراتٍ أخرى قد نقول بأنّ هذا الاسم أفضلُ من هذا الاسم بهذا الاعتبار،"], [2680.0, "أو أنّ هذا الاسم أفضلُ من هذا الاسم باعتبار المعنى."], [2686.0, "فهذا جائزٌ في قول عامّة أهل السنّة والجماعة،"], [2692.0, "وقد دلّت عليه الأدلّةُ الصحيحة الصريحة."]], "tr": [[2649.0, "Bunun altına giren şeylerden biri de O'nun isimleridir."], [2654.4, "Bazı isimlerin bazısından daha faziletli veya bazı isimlerin bazısından daha büyük olduğunu söylememiz caiz midir?"], [2660.0, "Cevap: Evet; fakat onlarla isimlendirilen itibarıyla değil."], [2666.0, "Çünkü onlarla isimlendirilen tektir, Azze ve Celle."], [2671.6, "Fakat başka itibarlarla, \"Şu isim bu itibarla şu isimden daha faziletlidir\" veya \"Şu isim anlam itibarıyla şu isimden daha faziletlidir\" diyebiliriz."], [2686.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'in geneline göre caizdir;"], [2690.3, "sahih ve açık deliller de buna delalet etmiştir."]]}, {"reader": false, "ar": [[2695.0, "فقد أخرج الإمامُ مسلمٌ في «صحيحه» من حديث عبد الله بن عمر بن الخطّاب رضي الله عنهما أنّ النبيّ صلى الله عليه وسلم قال:"], [2711.6, "«أحبُّ الأسماء إلى الله عبدُ الله أو عبدُ الرحمن»."], [2719.0, "فهذا دليلٌ على أنّ أسماء الله تتفاضل؛"], [2723.8, "لأنّ «أحبّ» من صِيَغ التفضيل."], [2728.0, "ويدلّ عليها أيضًا حديثُ بُرَيدة بن الحُصَيب رضي الله عنه قال:"], [2735.5, "سمع النبيُّ صلى الله عليه وسلم رجلًا يدعو وهو يقول:"], [2740.0, "«اللهمّ إنّي أسألك بأنّي أشهد أنّك أنت الله، لا إله إلا أنت، الأحدُ الصمد، الذي لم يلد ولم يولد، ولم يكن له كُفُوًا أحد»،"], [2758.0, "فقال صلى الله عليه وسلم:"], [2761.4, "«والذي نفسي بيده، لقد سأل اللهَ باسمه الأعظم، الذي إذا دُعي به أجاب، وإذا سُئل به أعطى»."], [2770.0, "فهذا دليلٌ على أنّ أسماء الله عز وجل تتفاضل؛"], [2776.0, "لأنّ قوله «الأعظم» هو من صِيَغ التفضيل."]], "tr": [[2695.0, "İmam Müslim \"Sahîh\"inde Abdullah b."], [2698.3, "Ömer b. el-Hattâb'dan —Allah ikisinden razı olsun— Peygamber sallallâhu aleyhi ve sellem'in şöyle buyurduğunu rivayet etmiştir:"], [2711.6, "\"Allah'a en sevimli isimler Abdullah ve Abdurrahman'dır.\" Bu, Allah'ın isimlerinin birbirinden üstün olduğuna delildir;"], [2723.8, "çünkü \"en sevimli (ehabb)\" tafdîl kalıplarındandır."], [2728.0, "Buna Büreyde b. el-Husayb'ın —Allah ondan razı olsun— hadisi de delalet eder."], [2735.5, "Şöyle dedi: Peygamber sallallâhu aleyhi ve sellem bir adamın şöyle dua ettiğini işitti:"], [2740.0, "\"Allah'ım! Senin, kendisinden başka ilâh olmayan Allah olduğuna, Ehad, Samed, doğurmamış ve doğurulmamış olan ve hiçbir şeyin denki olmadığı (Allah) olduğuna şahitlik etmem hürmetine senden istiyorum.\" Bunun üzerine sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2761.4, "\"Nefsim elinde olana yemin ederim ki, Allah'tan, kendisiyle dua edildiğinde icabet ettiği ve kendisiyle istendiğinde verdiği en büyük ismiyle (ism-i a'zam ile) istedi.\" Bu, Allah Azze ve Celle'nin isimlerinin birbirinden üstün olduğuna delildir;"], [2776.0, "çünkü \"en büyük (a'zam)\" sözü tafdîl kalıplarındandır."]]}, {"reader": false, "ar": [[2781.0, "ومن الأدلّة أيضًا على تفاضل أسمائه عز وجل قولُه صلى الله عليه وسلم:"], [2788.0, "«إنّ لله تسعةً وتسعين اسمًا، مئةً إلا واحدًا، من أحصاها دخل الجنّة»."], [2796.0, "فخصّ النبيُّ صلى الله عليه وسلم في هذا الحديث الأسماءَ التسعةَ والتسعين بهذه الفضيلة،"], [2802.0, "وهي أنّ من أحصاها دخل الجنّة،"], [2805.3, "فاختصّت بهذه الفضيلة. بل وأخرج الإمامُ البخاريّ في «صحيحه» عن النبيّ صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل قال:"], [2818.2, "«سبقت رحمتي غضبي». فالصفاتُ تتفاضل،"], [2821.7, "والأسماءُ تتفاضل. ولذلك قال ابنُ تيميّة رحمه الله تعالى:"], [2828.0, "«كما أنّ أسماءه وصفاته متنوّعة، فهي أيضًا متفاضلة، كما دلّ على ذلك الكتابُ والسنّة والإجماع مع العقل». انتهى كلامُه."]], "tr": [[2781.0, "Allah Azze ve Celle'nin isimlerinin birbirinden üstün olduğunun delillerinden biri de sallallâhu aleyhi ve sellem'in şu sözüdür:"], [2788.0, "\"Allah'ın doksan dokuz ismi vardır, yüzden bir eksik;"], [2796.0, "kim onları ihsâ ederse cennete girer.\" Peygamber sallallâhu aleyhi ve sellem bu hadiste doksan dokuz ismi bu faziletle —onları ihsâ edenin cennete gireceği faziletiyle— hususileştirmiştir;"], [2807.0, "böylece bu isimler bu faziletle ayrılmıştır."], [2809.3, "Hatta İmam el-Buhârî \"Sahîh\"inde Peygamber sallallâhu aleyhi ve sellem'den, Rabbi Azze ve Celle'den rivayet ettiği şu sözü nakletmiştir:"], [2818.2, "\"Rahmetim gazabımı geçmiştir.\" O hâlde sıfatlar birbirinden üstün olur, isimler de birbirinden üstün olur."], [2824.0, "Bu sebeple İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2828.0, "\"O'nun isimleri ve sıfatları çeşitli olduğu gibi, aynı zamanda birbirinden üstündür de;"], [2835.7, "nitekim Kitap, Sünnet ve icmâ, akılla birlikte buna delalet etmiştir.\" Sözü bitti."]]}]}, {"ts": "47:23", "title": "8. Külliye (devam): İsimler arasındaki tafâdulun yönleri", "paras": [{"reader": false, "ar": [[2843.0, "فإن قلتَ: وما أوجهُ التفاضل بين أسماء الله عز وجل؟"], [2850.0, "فأقول: هي كثيرة، وأذكر لك طرفًا منها."], [2857.0, "فأقول: الأوّل: التفاضلُ باعتبار الدلالة على الكماليّة المطلقة،"], [2862.5, "مفردًا أو مقترنًا. فلا جرمَ أنّ الأسماء التي تدلّ على الكمال المطلق مفردةً أفضلُ من الأسماء التي لا تدلّ على الكماليّة المطلقة إلا مقترنة ـ معي في هذه؟"], [2888.0, "ـ فهذا وجهٌ من أوجه التفاضل."]], "tr": [[2843.0, "Eğer: \"Allah Azze ve Celle'nin isimleri arasındaki tafâdulun yönleri nelerdir?\" dersen, derim ki:"], [2850.7, "Bunlar çoktur; sana bir kısmını zikredeyim."], [2857.0, "Derim ki: Birincisi: Tek başına veya başka isimle birlikte mutlak kemâle delalet etme itibarıyla tafâdul."], [2872.4, "Şüphesiz tek başına mutlak kemâle delalet eden isimler, mutlak kemâle ancak başka bir isimle birlikte delalet eden isimlerden daha faziletlidir —bunda benimle misiniz?—."], [2888.0, "Bu, tafâdulun yönlerinden bir yöndür."]]}, {"reader": false, "ar": [[2895.0, "ومنها أيضًا: أنّ من أسمائه عز وجل ما لا يدلّ تضمّنًا إلا على صفةٍ واحدة،"], [2906.0, "ولكن هناك من أسماء الله عز وجل ما يدلّ على صفاتٍ متعدّدة؛"], [2913.0, "فالاسمُ الذي يدلّ على صفاتٍ متعدّدةٍ أفضلُ من الاسم الذي لا يدلّ إلا على صفةٍ واحدة."], [2923.0, "وهذه الأفضليّة بين الأسماء لا تقتضي نقصًا في المفضول؛"], [2928.0, "كما أنّنا إذا قلنا بأنّ آية الكرسيّ أعظمُ من آية الدَّين فلا يقتضي ذلك نقصانًا في آية الدَّين،"], [2937.0, "وكما أنّنا إذا قلنا بأنّ النبيّ صلى الله عليه وسلم ـ أو أنّ الأنبياء يتفاضلون،"], [2945.0, "فلا يدلّ ذلك على وجود نقصٍ في المفضول،"], [2948.0, "وإنما من باب حساب الأفضليّة فقط،"], [2953.0, "أي أنها أفضليّةٌ لا تستلزم نقصانًا في المفضول."]], "tr": [[2895.0, "Bunlardan biri de şudur: O'nun —Azze ve Celle— isimlerinden bazısı tazammun yoluyla sadece tek bir sıfata delalet eder;"], [2906.0, "fakat Allah Azze ve Celle'nin isimlerinden birden çok sıfata delalet edenler de vardır."], [2913.0, "Birden çok sıfata delalet eden isim, sadece tek bir sıfata delalet eden isimden daha faziletlidir."], [2919.2, "İsimler arasındaki bu faziletlilik, mefdûlde bir eksiklik gerektirmez."], [2923.0, "Nitekim \"Âyetü'l-Kürsî, borç âyetinden daha büyüktür\" dediğimizde bu, borç âyetinde bir eksiklik gerektirmez."], [2928.0, "Yine \"Peygamber sallallâhu aleyhi ve sellem— ya da peygamberler birbirinden üstündür\" dediğimizde bu, mefdûlde bir eksiklik bulunduğuna delalet etmez;"], [2945.0, "bu sadece faziletliliğin hesaba katılması kabîlindendir."], [2949.5, "Yani mefdûlde bir eksiklik gerektirmeyen bir faziletliliktir."]]}, {"reader": false, "ar": [[2961.0, "ولذلك فإنّ من أعظم أسماء الله عز وجل «الله»؛"], [2967.7, "لأنه يدلّ على كلّ الصفات الذاتيّة وكلّ الصفات الفعليّة،"], [2975.0, "فجميعُ ما يستحقّه الإلهُ من الصفات والأسماء والأفعال كلُّه يتضمّنه هذا الاسمُ الأحسن،"], [2986.0, "والذي قال كثيرٌ من أهل العلم بأنه الاسمُ الأعظم."], [2992.0, "ومثلُ اسمه «الحيّ»؛ فإنه دالٌّ بالتضمّن والتلازم على كافّة ما يستحقّه الربُّ من صفات الذات،"], [3007.0, "فهو أفضلُ من غيره."], [3010.0, "وكاسمه «القيّوم»؛ فإنه دالٌّ على كلّ ما يستحقّه هذا الربُّ العظيم من صفات القيّوميّة المطلقة،"], [3024.0, "أي من صفات الفعل."], [3026.0, "وكاسمه «الحميد المجيد»؛ فإنّ «الحميد» هو ذلك الاسم الذي دلّ على جميع المحامد والكمالات لله عز وجل،"], [3038.6, "و«المجيد» هو ذلك الاسم الذي دلّ على كافّة أوصاف العظمة والجلال."]], "tr": [[2961.0, "Bu sebeple Allah Azze ve Celle'nin en büyük isimlerinden biri \"Allah\"tır;"], [2967.7, "çünkü bütün zâtî sıfatlara ve bütün fiilî sıfatlara delalet eder."], [2975.0, "İlâhın müstahak olduğu sıfatların, isimlerin ve fiillerin tamamını bu en güzel isim içerir."], [2986.0, "İlim ehlinin çoğu bu ismin ism-i a'zam olduğunu söylemiştir."], [2992.0, "O'nun \"el-Hayy\" ismi de böyledir;"], [2996.0, "tazammun ve telâzum yoluyla Rabbin müstahak olduğu bütün zât sıfatlarına delalet eder;"], [3010.0, "dolayısıyla diğerlerinden daha faziletlidir. O'nun \"el-Kayyûm\" ismi de böyledir;"], [3019.1, "bu büyük Rabbin müstahak olduğu mutlak kayyûmiyyet sıfatlarının, yani fiil sıfatlarının tamamına delalet eder."], [3028.0, "O'nun \"el-Hamîd el-Mecîd\" ismi de böyledir:"], [3031.3, "\"el-Hamîd\", Allah Azze ve Celle'ye ait bütün övgülere ve kemâllere delalet eden isimdir;"], [3043.4, "\"el-Mecîd\" ise azamet ve celâlin bütün vasıflarına delalet eden isimdir."]]}, {"reader": false, "ar": [[3051.0, "ومن مقتضيات التفضيل أيضًا:"], [3053.7, "اختصاصُها بالله عز وجل،"], [3056.4, "أو جوازُ إطلاقها على غيره بشرطه؛"], [3065.0, "فلا جرمَ أنّ الأسماء التي تتضمّن الحقيقةَ المختصّة بالله عز وجل أفضلُ من الأسماء التي تتضمّن هذا وهذا."], [3074.0, "فهمتم هذا؟ وهكذا دواليك فيما ذكره أهلُ العلم من أهل السنّة والجماعة في أوجه التفاضل."], [3084.0, "وما ذكرتُه من هذه الأمور الثلاثة إنما هو ذكرُ تمثيلٍ لا ذكرُ حصر."]], "tr": [[3051.0, "Tafdîlin gereklerinden biri de isimlerin Allah Azze ve Celle'ye has olması veya şartıyla başkasına verilmesinin caiz olmasıdır."], [3065.0, "Şüphesiz Allah Azze ve Celle'ye has hakikati içeren isimler, hem bunu hem şunu içeren isimlerden daha faziletlidir."], [3074.0, "Bunu anladınız mı? Ehl-i Sünnet ve'l-Cemaat'ten ilim ehlinin tafâdulun yönleri hakkında zikrettiklerinde de durum böyle devam eder."], [3084.0, "Bu üç husustan zikrettiğim şeyler ise örnek vermek içindir, sınırlamak için değil."]]}, {"reader": false, "ar": [[3094.0, "والخلاصةُ من ذلك ـ وفّقكم الله تعالى ـ أنّ القول بدخول التفاضل في أسماء الله عز وجل قولٌ سار عليه أهلُ السنّة والجماعة،"], [3108.0, "لكن شريطةَ أمرين لا بدّ منهما:"], [3112.0, "الأمرُ الأوّل ـ انتبه ـ: أنه تفضيلٌ لا يستلزم دخولَ النقص على المفضول."], [3120.0, "وبناءً على اشتراط هذا الشرط فمتى ما كان التفضيلُ بين أسماء الله تفضيلًا يقتضي دخولَ النقص على المفضول فهو تفاضلٌ محرّم."], [3133.0, "الشرطُ الثاني: أن يكون التفضيلُ منصبًّا على المعاني وما تتضمّنه،"], [3142.0, "لا تفضيلًا منظورًا فيه إلى المسمّى بها."]], "tr": [[3094.0, "Bundan çıkan özet —Allah sizi muvaffak kılsın— şudur:"], [3098.2, "Allah Azze ve Celle'nin isimlerine tafâdulun girdiğini söylemek, Ehl-i Sünnet ve'l-Cemaat'in üzerinde yürüdüğü bir görüştür;"], [3108.0, "fakat mutlaka bulunması gereken iki şartla."], [3112.0, "Birinci husus —dikkat et—: Bu, mefdûle eksiklik girmesini gerektirmeyen bir tafdîldir."], [3120.0, "Bu şartın konulmasına binaen, Allah'ın isimleri arasındaki tafdîl ne zaman mefdûle eksiklik girmesini gerektiren bir tafdîl olursa, bu haram bir tafâduldür."], [3133.0, "İkinci şart: Tafdîlin, onlarla isimlendirilene bakılarak yapılan bir tafdîl değil, anlamlara ve onların içerdiklerine yönelik olmasıdır."]]}, {"reader": false, "ar": [[3148.0, "لأنّ المتقرِّر في القواعد أنّ الأسماء واحدةٌ متّفقةٌ باعتبار دلالتها على ذات الباري عز وجل،"], [3160.0, "ولكنّها متباينةٌ مختلفةٌ باعتبار دلالتها على الصفات ومعانيها."], [3167.0, "فمتى ما توفّر هذان الشرطان في مسألة التفاضل بين أسماء الله فإنها تكون مسألةً سُنّيّةً سلفيّة،"], [3176.4, "لا مدخلَ لوصف المتكلِّم فيها بأنه من أهل البدع،"], [3183.0, "أو بأنه يتنقّص أسماءَ الله عز وجل. والله أعلم."]], "tr": [[3148.0, "Çünkü kaidelerde yerleşik olan şudur:"], [3150.9, "İsimler, Bârî Azze ve Celle'nin zâtına delaletleri itibarıyla bir ve aynıdır;"], [3158.9, "fakat sıfatlara ve onların anlamlarına delaletleri itibarıyla birbirinden ayrı ve farklıdır."], [3167.0, "Allah'ın isimleri arasındaki tafâdul meselesinde bu iki şart bulunduğunda, bu mesele sünnî ve selefî bir mesele olur;"], [3175.7, "bu konuda konuşan kimseyi bid'at ehlinden olmakla veya Allah Azze ve Celle'nin isimlerini küçümsemekle nitelemenin yeri yoktur. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[3187.0, "كم جلسة؟ ـ (أحد الحضور):"], [3190.0, "ثلاثة وخمسين. ـ يكفي، يكفي."], [3193.0, "والله أعلم، وصلى الله وسلم على نبيّنا محمد."]], "tr": [[3187.0, "Ne kadar oturduk? —(Dinleyicilerden biri:) Elli üç (dakika).— Yeter, yeter."], [3193.0, "Allah en iyisini bilir. Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
