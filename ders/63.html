<script>
const D={"no": 63, "vid": "Ytc9XXKz5CI", "title_ar": "الدرس (٦٣) من شرح كليات العقيدة — بداية كليات باب الصفات", "title_tr": "Şerhu Külliyyâti'l-Akîde — 63. Ders: Sıfatlar Babının İlk Külliyeleri (Sıfatların Tevkîfî Oluşu, Sıfat Naslarının Muhkem ve Müteşâbih Yönü, Her Sıfatın «Leyse kemislihî şey'» ile Birlikte Anılması, Sıfat Naslarının Manasının Bilinmesi, Sıfat Naslarının Hakikatlerine Hamledilmesi)", "sections": [{"ts": "00:00", "title": "Giriş: İsimler babından sıfatlar babına geçiş", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.1, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.9, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [11.1, "أما بعد: لقد انتهينا ـ ولله الحمدُ والمنّة ـ من الكلام على كلّيّات أسماء الله عز وجل،"], [19.0, "وها نحن ندخل في هذا الدرس ـ بإذن الله عز وجل وتوفيقه وحُسن تسديده ـ في الباب الثاني،"], [29.3, "وهو بابُ الصفات. وهذا البابُ سنُطيل فيه كثيرًا،"], [35.0, "لأنّ قواعد الصفات عند أهل السنة والجماعة أكثرُ بكثيرٍ من قواعد الأسماء،"], [40.0, "ولكنها ستكون يسيرةً إن شاء الله."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.6, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [11.1, "Bundan sonra: Allah'a hamd ve minnet olsun, Allah Azze ve Celle'nin isimlerinin külliyeleri hakkındaki sözü bitirdik."], [19.6, "İşte bu derste Allah Azze ve Celle'nin izni, tevfiki ve güzel yardımıyla ikinci baba, yani sıfatlar babına giriyoruz."], [31.2, "Bu babda çok uzun duracağız;"], [35.0, "çünkü Ehl-i Sünnet ve'l-Cemaat nezdinde sıfatların kaideleri isimlerin kaidelerinden çok daha fazladır. Fakat inşallah kolay olacaktır."]]}, {"reader": false, "ar": [[44.0, "وأستسمحكم أنّ هذا الدرس سيكون أغلبُه نُقولًا عن أهل العلم،"], [49.0, "حتى نستنير بآرائهم وكلامهم."], [53.1, "فأقول ـ وبالله التوفيق، ومنه أستمدّ العونَ والفضل ـ:"]], "tr": [[44.0, "Sizden izin isterim; bu dersin çoğu ilim ehlinden nakiller olacak ki onların görüşleri ve sözleriyle aydınlanalım."], [51.5, "Tevfik Allah'tandır, yardımı ve lütfu O'ndan dilerim, derim ki:"]]}]}, {"ts": "00:58", "title": "1. Külliye: Bütün sıfatlar, taalluklarıyla birlikte tevkîfîdir", "paras": [{"reader": false, "ar": [[58.0, "الكلّيّة الأولى: <b>كلُّ الصفات بمتعلَّقاتها توقيفيّة.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ الصفات بكلِّ متعلَّقاتها توقيفيّة.<\/b>"]], "tr": [[58.0, "<b>1. külliye: Bütün sıfatlar, taalluklarıyla birlikte tevkîfîdir (nassa bağlıdır).<\/b> (Tekrar ediyor.) <b>Bütün sıfatlar, bütün taalluklarıyla birlikte tevkîfîdir.<\/b>"]]}, {"reader": false, "ar": [[74.0, "أقول وبالله التوفيق: وهذا بإجماع أهل السنة والجماعة،"], [79.4, "رحم الله أمواتَهم وثبّت أحياءَهم."], [84.0, "وذلك لأنّ المتقرِّر في القواعد أنّ ما كان غيبيًّا فيكون توقيفيًّا على النصّ."], [91.0, "وبما أنّ الصفات التي تليق بالله عز وجل من الأمور الغيبيّة التي لا مدخلَ للعقول استقلالًا في إدراكها،"], [101.0, "فإننا نبنيها على ثبوت النصّ بها."], [104.0, "فلا نُثبت لله عز وجل من الصفات إلا ما أثبته عز وجل لنفسه في كتابه،"], [111.0, "أو أثبته له رسولُه صلى الله عليه وسلم في صحيح سنّته،"], [116.0, "من غير تحريفٍ ولا تعطيل،"], [118.5, "ومن غير تكييفٍ ولا تمثيل؛"], [121.0, "لأنّ الله عز وجل <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ ۖ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>."]], "tr": [[74.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır;"], [78.1, "Allah onların ölülerine rahmet etsin, dirilerini sebat üzere kılsın."], [84.0, "Bunun sebebi şudur: Kaidelerde yerleşik olan, gaybî olan şeyin nassa bağlı (tevkîfî) olmasıdır."], [91.0, "Allah Azze ve Celle'ye yakışan sıfatlar, akılların müstakil olarak idrak etmeye girecek yolu bulunmayan gaybî işlerden olduğuna göre, biz onları nassın onları sabit kılmasına bina ederiz."], [104.0, "Allah Azze ve Celle'ye sıfatlardan ancak Azze ve Celle'nin Kitabı'nda kendisi için isbat ettiğini veya Resûlü sallallâhu aleyhi ve sellem'in sahih sünnetinde O'nun için isbat ettiğini isbat ederiz;"], [117.0, "tahrif ve ta'til etmeden, tekyîf ve temsil etmeden."], [121.0, "Çünkü Allah Azze ve Celle, <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur. O, işitendir, görendir﴾<\/span> [Şûrâ 11]."]]}, {"reader": false, "ar": [[126.0, "فلا ندخل في هذا الباب متأوِّلين بآرائنا،"], [130.2, "ولا متوهِّمين بأهوائنا، ولا مدخلَ للقياس ولا للاجتهاد ولا للآراء ولا للنظر في شيءٍ من هذه الأبواب الغيبيّة في صَدَرٍ ولا وِرْد."], [141.0, "وعلى ذلك اتّفقت كلمةُ أهل السنة والجماعة إلى يومنا هذا،"], [146.0, "وإلى أن تقوم الساعة،"], [148.0, "على أنّ هذا الباب من الأبواب التوقيفيّة."], [153.0, "فكلُّ من أثبت لله عز وجل شيئًا من الصفات فإننا نطالبه بالدليل على صحّة هذا الإثبات؛"], [160.0, "فإن جاء به صحيحًا صريحًا فعلى العين والرأس،"], [164.0, "وإلا فلا حقَّ لأحدٍ أن يتخبّط أو يتخوّض في هذا الباب الغيبيّ،"], [168.0, "لأنّ الغيب مبناه على التوقيف."]], "tr": [[126.0, "Bu babda ne görüşlerimizle te'vil ederek ne de heveslerimizle vehme kapılarak gireriz."], [132.9, "Bu gaybî babların hiçbirinde, ne girişte ne çıkışta, kıyasın, içtihadın, görüşlerin ve nazarın girecek yeri yoktur."], [141.0, "Ehl-i Sünnet ve'l-Cemaat'in sözü, bugüne kadar ve kıyamet kopuncaya kadar, bu babın tevkîfî bablardan olduğu üzerinde ittifak etmiştir."], [153.0, "Allah Azze ve Celle'ye sıfatlardan bir şey isbat eden herkesten bu isbatın doğruluğuna delil isteriz."], [160.0, "Onu sahih ve sarih olarak getirirse başımız gözümüz üstüne;"], [164.0, "aksi hâlde hiç kimsenin bu gaybî babda gelişigüzel davranmaya veya dalmaya hakkı yoktur."], [168.0, "Çünkü gaybın temeli tevkîf üzerinedir."]]}, {"reader": false, "ar": [[173.0, "قال الإمام أبو حنيفة رحمه الله تعالى:"], [177.0, "«لا ينبغي لأحدٍ أن ينطق في ذات الله عز وجل بشيء، بل يصفه بما وصف به نفسَه، ولا يقول فيه برأيه شيئًا، تبارك الله ربُّ العالمين». انتهى كلامُه."]], "tr": [[173.0, "İmam Ebû Hanîfe —Allah ona rahmet etsin— şöyle demiştir:"], [177.0, "\"Hiç kimsenin Allah Azze ve Celle'nin zâtı hakkında bir şey söylemesi uygun değildir."], [183.4, "Bilakis O'nu, kendisini vasıflandırdığı şeyle vasıflandırır ve O'nun hakkında kendi görüşüyle hiçbir şey söylemez."], [190.2, "Âlemlerin Rabbi Allah ne yücedir!\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[195.0, "وقال الإمام الشافعيّ رحمه الله تعالى عن صفات الله عز وجل:"], [201.0, "«حرامٌ على العقول أن تمثّل الله عز وجل، وعلى الأوهام أن تحدَّه، وعلى الظنون أن تقطع، وعلى النفوس أن تفكِّر، وعلى الضمائر أن تعمَّق، وعلى الخواطر أن تحيط، وعلى العقول أن تعقل، إلا ما وصف به نفسَه أو على لسان نبيّه صلى الله عليه وسلم»."], [232.0, "انتهى كلامُه. فقطع كلَّ الطرق في إثبات شيءٍ من هذه الصفات الغيبيّة إلا طريقَ الكتاب والسنة."]], "tr": [[195.0, "İmam Şâfiî —Allah ona rahmet etsin— Allah Azze ve Celle'nin sıfatları hakkında şöyle demiştir:"], [201.0, "\"Akıllara Allah Azze ve Celle'yi temsil etmek (bir şeye benzetmek), vehimlere O'nu sınırlamak, zanlara kesin hüküm vermek, nefislere (O'nun zâtı hakkında) düşünmek, gönüllere derinleşmek, hatıra gelen düşüncelere kuşatmak, akıllara (O'nu) akletmek haramdır;"], [221.4, "ancak kendisini vasıflandırdığı veya Peygamberi sallallâhu aleyhi ve sellem'in diliyle (vasıflandırdığı) şey müstesna.\" —Sözü burada bitti."], [232.0, "Böylece bu gaybî sıfatlardan bir şeyi isbat etmede, Kitap ve Sünnet yolu dışındaki bütün yolları kesmiştir."]]}, {"reader": false, "ar": [[241.0, "وقال الإمام أحمد رحمه الله تعالى:"], [245.0, "«لا يُوصف الله تعالى بأكثر ممّا وصف به نفسَه، أو وصفه به رسولُه، بلا حدٍّ ولا غاية، <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ ۖ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>، ولا يبلغ الواصفون صفتَه، وصفاتُه منه، ولا نتعدّى القرآنَ والحديث؛ فنقول كما قال، ونصفه كما وصف نفسَه، ولا نتعدّى ذلك، نؤمن بالقرآن كلِّه، محكمِه ومتشابهِه». انتهى كلامُه."]], "tr": [[241.0, "İmam Ahmed —Allah ona rahmet etsin— şöyle demiştir:"], [241.7, "\"Allah Teâlâ, kendisini vasıflandırdığından veya Resûlü'nün O'nu vasıflandırdığından fazlasıyla vasıflandırılmaz;"], [243.0, "sınırsız ve nihayetsiz olarak. <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur. O, işitendir, görendir﴾<\/span> [Şûrâ 11]."], [245.0, "Vasfedenler O'nun vasfına ulaşamaz; sıfatları O'ndandır."], [251.0, "Kur'an'ı ve hadisi aşmayız. O'nun dediği gibi deriz, O'nu kendisini vasıflandırdığı gibi vasıflandırırız ve bunu aşmayız."], [270.0, "Kur'an'ın tamamına, muhkemine de müteşâbihine de iman ederiz.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[285.0, "وقال الإمام عثمان بن سعيد الدارميّ رحمه الله تعالى:"], [291.0, "«لا نُجيز اجتهادَ الرأي في كثيرٍ من الفرائض والأحكام التي نراها بأعيننا وتُسمع بآذاننا، فكيف في صفات الله التي لم ترها العيون، وقصرت عنها الظنون؟». انتهى كلامُه."]], "tr": [[285.0, "İmam Osman b. Saîd ed-Dârimî —Allah ona rahmet etsin— şöyle demiştir:"], [291.0, "\"Gözlerimizle gördüğümüz ve kulaklarımızla işitilen birçok farz ve hükümde bile re'y ile içtihadı caiz görmüyoruz."], [302.5, "Gözlerin görmediği, zanların ulaşamadığı Allah'ın sıfatlarında nasıl (caiz görelim)?\" —Sözü burada bitti."]]}]}, {"ts": "05:09", "title": "1. Külliye (devam): Selef imamlarının sözleri", "paras": [{"reader": false, "ar": [[309.0, "وكأنه بهذا النقل يقيس قياسًا أَولويًّا،"], [314.0, "فيقول: إذا كانت أكثرُ الأحكام الشرعيّة التي تُدركها عقولُنا وتسمعها آذانُنا ـ أو نسمعها بآذاننا ـ وتُبصرها عيونُنا،"], [324.0, "في كثيرٍ من متعلَّقاتها لا يجوز الخوض فيها إلا بدليل،"], [330.0, "فكيف بالأمر الغيبيّ بكلّ متعلَّقاته؟"], [333.0, "ويقصد بذلك صفاتِ الله عز وجل؛"], [336.0, "فإنها صفاتٌ لم ترها العيون ـ لم تَرَه العيون ـ ولم تسمع بكيفيّتها الآذان،"], [345.0, "وليست داخلةً تحت مُدرَكات العقل."]], "tr": [[309.0, "Sanki bu nakille evleviyet kıyası (öncelikle kıyas) yapıyor ve şöyle diyor:"], [316.5, "Akıllarımızın idrak ettiği, kulaklarımızın işittiği —veya kulaklarımızla işittiğimiz— ve gözlerimizin gördüğü şer'î hükümlerin çoğuna, birçok taalluklarında delil olmadan dalmak caiz değilse, bütün taalluklarıyla gaybî olan iş nasıl olur?"], [333.0, "Bununla Allah Azze ve Celle'nin sıfatlarını kastediyor."], [336.0, "Çünkü onlar, gözlerin görmediği —gözlerin görmediği— kulakların keyfiyetini işitmediği ve aklın idrak ettiği şeylerin kapsamına girmeyen sıfatlardır."]]}, {"reader": false, "ar": [[350.0, "وقال الإمام البربهاريّ رحمه الله تعالى:"], [356.0, "«اعلم ـ رحمك الله ـ أنّ الكلام في الربّ مُحدَث، وهو بدعةٌ وضلالة، ولا يُتكلَّم في الربّ إلا بما وصف به نفسَه في القرآن، وما بيّن رسولُ الله صلى الله عليه وسلم لأصحابه». انتهى كلامُه."]], "tr": [[350.0, "İmam Berbehârî —Allah ona rahmet etsin— şöyle demiştir:"], [356.0, "\"Bil ki —Allah sana rahmet etsin— Rab hakkında (kendi görüşüyle) konuşmak sonradan çıkarılmış bir şeydir;"], [365.1, "o bid'at ve dalâlettir. Rab hakkında ancak Kur'an'da kendisini vasıflandırdığı ve Resûlullah sallallâhu aleyhi ve sellem'in ashâbına açıkladığı şeyle konuşulur.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[378.0, "وقال أبو نصرٍ السِّجْزيّ:"], [381.0, "«قد اتّفقت الأئمّة على أنّ الصفات لا تُؤخذ إلا توقيفًا، وكذلك شرحُها لا يجوز إلا بتوقيف»."], [394.0, "انتهى كلامُه. وقال الإمام البيهقيّ رحمه الله تعالى:"], [399.0, "«لا يجوز وصفُه تعالى إلا بما دلّ عليه كتابُ الله تعالى، أو سنّةُ رسوله صلى الله عليه وسلم، أو أجمع عليه سلفُ هذه الأمّة». انتهى كلامُه."]], "tr": [[378.0, "Ebû Nasr es-Siczî şöyle demiştir:"], [381.0, "\"İmamlar, sıfatların ancak tevkîf yoluyla (nastan) alınacağı üzerinde ittifak etmişlerdir."], [385.9, "Aynı şekilde onların şerhi de ancak tevkîfle caizdir.\" —Sözü burada bitti."], [394.0, "İmam Beyhakî —Allah ona rahmet etsin— şöyle demiştir:"], [399.0, "\"O'nu —Teâlâ— ancak Allah Teâlâ'nın Kitabı'nın veya Resûlü sallallâhu aleyhi ve sellem'in sünnetinin delalet ettiği ya da bu ümmetin selefinin üzerinde icmâ ettiği şeyle vasıflandırmak caizdir.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[414.0, "وقال الإمام ابن تيميّة رحمه الله تعالى:"], [418.0, "«القول الشامل في جميع هذا الباب: أن يُوصف الله تعالى بما وصف به نفسَه، أو وصفه به رسولُه صلى الله عليه وسلم، وبما وصفه به السابقون الأوّلون، لا نتجاوز القرآنَ والحديث. قال الإمام أحمد رحمه الله: لا يُوصف الله إلا بما وصف به نفسَه، أو وصفه به رسولُه صلى الله عليه وسلم، لا نتجاوز القرآنَ والحديث»."], [448.7, "انتهى كلامُه. وقال الإمام ابن القيّم رحمه الله:"], [453.0, "«ما يُطلق عليه في باب الأسماء والصفات توقيفيّ». انتهى كلامُهم."]], "tr": [[414.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [416.3, "\"Bu babın tamamındaki kapsayıcı söz şudur:"], [418.0, "Allah Teâlâ, kendisini vasıflandırdığı veya Resûlü sallallâhu aleyhi ve sellem'in O'nu vasıflandırdığı ve (İslâm'a) ilk önce girenlerin O'nu vasıflandırdığı şeyle vasıflandırılır;"], [431.4, "Kur'an'ı ve hadisi aşmayız. İmam Ahmed —Allah ona rahmet etsin— şöyle demiştir:"], [441.1, "'Allah ancak kendisini vasıflandırdığı veya Resûlü sallallâhu aleyhi ve sellem'in O'nu vasıflandırdığı şeyle vasıflandırılır;"], [448.7, "Kur'an'ı ve hadisi aşmayız.'\" —Sözü burada bitti."], [450.5, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [453.0, "\"İsimler ve sıfatlar babında O'na nispet edilen şey tevkîfîdir.\" —Sözleri burada bitti."]]}, {"reader": false, "ar": [[461.0, "وبه يتبيّن لنا أنّ هذه الكلّيّة التي قرّرتُها كلّيّةٌ سُنّيّةٌ سلفيّةٌ واضحةُ المعالم،"], [470.0, "ليس فيها شكٌّ ولا ريبٌ ولا مطعنٌ بإذن الله عز وجل. والله أعلم."]], "tr": [[461.0, "Bununla, takrir ettiğim bu külliyenin, alâmetleri açık, sünnî ve selefî bir külliye olduğu bize açıkça ortaya çıkar;"], [470.0, "Allah Azze ve Celle'nin izniyle onda hiçbir şüphe, tereddüt ve itiraz noktası yoktur. Allah en iyisini bilir."]]}]}, {"ts": "07:55", "title": "2. Külliye: Sıfat nasları manaları itibarıyla muhkem, keyfiyetleri itibarıyla müteşâbihtir", "paras": [{"reader": false, "ar": [[475.0, "الكلّيّة الثانية ـ وعليكم السلام ورحمة الله ـ:"], [482.0, "كلُّ نصوص الصفات محكمةٌ باعتبار معانيها،"], [489.0, "ومتشابهةٌ باعتبار كيفيّاتها. <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [508.0, "<b>كلُّ نصوص الصفات محكمةٌ باعتبار معانيها، ومتشابهةٌ باعتبار كيفيّاتها.<\/b>"]], "tr": [[475.0, "<b>2. külliye<\/b> —ve aleykümüsselâm ve rahmetullah—:"], [482.0, "<b>Bütün sıfat nasları, manaları itibarıyla muhkem, keyfiyetleri itibarıyla müteşâbihtir.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [508.0, "<b>2. külliye: Bütün sıfat nasları, manaları itibarıyla muhkem, keyfiyetleri itibarıyla müteşâbihtir.<\/b>"]]}, {"reader": false, "ar": [[516.0, "وبيانُ الحال أن نقول:"], [519.0, "هذه الكلّيّة تُجيب عن سؤالٍ عظيمٍ في باب الصفات،"], [524.0, "وهو: هل النصوص الواردة في صفات الله عز وجل من قبيل المحكم أم من قبيل المتشابه؟"], [534.0, "وإذا قلنا: «المحكم»، فإننا نعني به الأمرَ الذي اتّضح وظهر معناه."], [543.0, "وإذا قلنا: «المتشابه»، فإننا نعني به الأمرَ الذي لا يزال خفيًّا ولا يُدرى ما معناه."]], "tr": [[516.0, "Durumun açıklaması şudur: Bu külliye, sıfatlar babındaki büyük bir soruya cevap verir:"], [524.6, "Allah Azze ve Celle'nin sıfatları hakkında varid olan naslar muhkem kısmından mıdır, yoksa müteşâbih kısmından mı?"], [534.0, "\"Muhkem\" dediğimizde, manası açık ve zahir olan şeyi kastederiz."], [543.0, "\"Müteşâbih\" dediğimizde ise hâlâ kapalı olan ve manası bilinmeyen şeyi kastederiz."]]}, {"reader": false, "ar": [[552.0, "فإذا تأمّلتَ نصوصَ صفات الله عز وجل وجدتَها واضحةً ظاهرةً بيّنةً من جهة،"], [560.0, "ولكن خفيّةً لا يُعلم معناها من جهةٍ أخرى."], [566.0, "وذلك لأنّ أهل السنة والجماعة ينظرون إلى باب الصفات من جهتين:"], [571.0, "من جهة المعنى على حسب دلالة لغة العرب،"], [577.0, "ومن جهة الكيفيّة على ما هي عليه في الواقع."], [583.0, "فأمّا باعتبار معناها فإنها واضحةُ المعالم،"], [587.4, "مُحكَماتُ المعاني، وكلُّ من وصفها بالتشابه باعتبار معانيها فإنه من أهل البدع،"], [599.0, "لأنّ أهل السنة متّفقون على أنّ معاني نصوص الصفات معلومة."]], "tr": [[552.0, "Allah Azze ve Celle'nin sıfatlarına dair nasları düşündüğünde onları bir yönden açık, zahir ve belirgin;"], [559.4, "diğer bir yönden ise manası bilinmeyen kapalı (şeyler) olarak bulursun."], [566.0, "Bunun sebebi, Ehl-i Sünnet ve'l-Cemaat'in sıfatlar babına iki yönden bakmasıdır:"], [571.0, "Arap dilinin delaletine göre mana yönünden ve gerçekte olduğu hâl üzere keyfiyet yönünden."], [583.0, "Manaları itibarıyla bakıldığında, alâmetleri açık ve manaları muhkemdir."], [589.0, "Onları manaları itibarıyla müteşâbih olmakla niteleyen herkes bid'at ehlindendir;"], [595.3, "çünkü Ehl-i Sünnet, sıfat naslarının manalarının bilindiği üzerinde ittifak etmiştir."]]}]}, {"ts": "10:05", "title": "2. Külliye (devam): Peygamber ve sahabe sıfat naslarının manasını anlıyordu", "paras": [{"reader": false, "ar": [[605.0, "فنحن نعلم معنى الاستواء إذا قُيِّد بـ«على»،"], [611.0, "ونعلم معنى الوجه في اللغة العربيّة،"], [615.0, "ونعلم معنى السمع في اللغة العربيّة ـ وعليكم السلام،"], [618.7, "تقدّم يا… ـ ونعلم معنى البصر في اللغة العربيّة،"], [625.0, "ونعلم معنى النزول في اللغة العربيّة،"], [630.0, "ونعلم معنى الرحمة والغضب والمقت والكراهية باعتبار الدلالة اللغويّة."], [641.0, "لأنّ الله عز وجل أنزل هذه النصوص باللسان العربيّ المبين،"], [648.0, "ولم يُنزلها بهذا اللسان إلا وهو يريد منا أن نفهم المعنى الذي تقرّر في لساننا العربيّ."], [661.0, "ولا يمكن أبدًا أن يقول الله عز وجل باللغة العربيّة شيئًا وهو يريد منا أن نفهم معنًى آخر،"], [674.0, "كما سيأتي في كلّيّةٍ قريبةٍ إن شاء الله تعالى."], [679.0, "ويؤكّد ذلك جُمَلٌ من الأحاديث سأذكرها في كلّيّتها بإذن الله."]], "tr": [[605.0, "\"Alâ\" (üzerine) edatıyla kayıtlandığında istivânın manasını biliriz."], [614.3, "Arap dilinde \"vech\"in (yüzün) manasını biliriz."], [619.8, "Arap dilinde \"sem'\"in (işitmenin) manasını biliriz —ve aleykümüsselâm, buyur ey…—."], [641.0, "Arap dilinde \"basar\"ın (görmenin) manasını biliriz."], [645.9, "Arap dilinde \"nüzul\"ün manasını biliriz."], [650.5, "Dilin delaleti itibarıyla rahmetin, gazabın, buğzun (makt) ve hoşlanmamanın manasını biliriz."], [661.0, "Çünkü Allah Azze ve Celle bu nasları apaçık Arap diliyle indirmiştir;"], [665.8, "onları bu dille, ancak Arap dilimizde yerleşmiş olan manayı anlamamızı isteyerek indirmiştir."], [672.7, "Allah Azze ve Celle'nin Arap diliyle bir şey söyleyip bizden başka bir mana anlamamızı istemesi asla mümkün değildir;"], [679.0, "inşallah yakında bir külliyede geleceği üzere."], [681.1, "Bunu birtakım hadisler de teyit eder;"], [683.9, "inşallah onları kendi külliyesinde zikredeceğim."]]}, {"reader": false, "ar": [[687.0, "ولذلك كان النبيُّ صلى الله عليه وسلم ينزل عليه الوحي وفيه نصوصُ الصفات،"], [695.0, "فكان يتلوه على مسامع الصحابة وهو يعلم أنهم سيفهمون منها معانيَ قد تقرّرت في قلوبهم وعقولهم بلسانهم الذي خُوطبوا به."], [709.0, "ولم يكن النبيُّ صلى الله عليه وسلم يتكلّف أن يبيّن لهم أنّ المعنى العربيّ الذي انقدح في قلوبكم ليس هو مرادَ الله عز وجل،"], [723.0, "وإنما كان يُبلِّغ ويسكت."], [726.0, "والصحابة رضي الله عنهم كانوا يتلقّون هذه النصوص من نبيّهم صلى الله عليه وسلم،"], [735.0, "ولم يكن الواحدُ منهم يتكلّف أن يسأل رسولَ الله صلى الله عليه وسلم عن شيءٍ من معاني هذه الصفات."]], "tr": [[687.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem'e içinde sıfat nasları bulunan vahiy inerdi;"], [694.4, "o da onu sahabenin kulaklarına okurdu ve onların, kendilerine hitap edilen dilleriyle kalplerinde ve akıllarında yerleşmiş olan manaları bu naslardan anlayacaklarını bilirdi."], [709.0, "Peygamber sallallâhu aleyhi ve sellem onlara, \"Kalplerinizde beliren Arapça mana, Allah Azze ve Celle'nin muradı değildir\" diye açıklamaya zahmet etmezdi;"], [721.8, "sadece tebliğ eder ve susardı."], [726.0, "Sahabe de —Allah onlardan razı olsun— bu nasları Peygamberleri sallallâhu aleyhi ve sellem'den alırlardı;"], [735.5, "onlardan hiçbiri Resûlullah sallallâhu aleyhi ve sellem'e bu sıfatların manalarından bir şeyi sormaya zahmet etmezdi."]]}, {"reader": false, "ar": [[745.0, "ويبعُد جدًّا أن يعلم النبيُّ صلى الله عليه وسلم أنّ المراد خلافُ معنى اللسان العربيّ ويسكت،"], [755.6, "لأنه مأمورٌ بالبلاغ المبين،"], [758.0, "وهذا السكوت لا يُعتبر من البلاغ المبين."], [762.0, "ويبعُد عن أصحابه ـ الذين هم أحرصُ الناس على العلم والفهم ـ أن يسمعوا كلامًا لا يفهمون معناه،"], [771.0, "ثم يتفرّقون من مجلس العلم ولا يتكلّف الواحدُ منهم أن يسأل رسولَ الله صلى الله عليه وسلم عن معنى ما أُنزل عليه من وحي الله عز وجل."], [783.0, "فهذا دليلٌ على الجزئيّة الأولى من هذه الكلّيّة،"], [787.0, "وهي أنّ المعنى من هذه النصوص معلومٌ واضحٌ ظاهرٌ بيّن،"], [792.8, "ليس بخفيٍّ ولا فيه إشكال."]], "tr": [[745.0, "Peygamber sallallâhu aleyhi ve sellem'in, muradın Arap dilinin manasından farklı olduğunu bilip susması çok uzak bir ihtimaldir;"], [755.0, "çünkü o apaçık tebliğ ile emrolunmuştur ve bu susma apaçık tebliğden sayılmaz."], [762.0, "İnsanların ilme ve anlamaya en düşkünü olan ashâbının, manasını anlamadıkları bir söz işitip sonra ilim meclisinden dağılmaları ve hiçbirinin Resûlullah sallallâhu aleyhi ve sellem'e ona indirilen Allah Azze ve Celle'nin vahyinin manasını sormaya zahmet etmemesi de uzak bir ihtimaldir."], [783.0, "İşte bu, bu külliyenin birinci cüz'ünün delilidir:"], [786.5, "Bu nasların manası bilinen, açık, zahir ve belirgindir;"], [790.7, "kapalı değildir ve onda bir müşkil yoktur."]]}, {"reader": false, "ar": [[800.0, "فمن وصف معانيَ نصوص الصفات بأنها من المتشابه الخفيّ الذي لا يعلم العربُ معناه،"], [811.6, "ولا يفقه أحدٌ مدلوله،"], [815.0, "فإنه من أهل البدع،"], [817.0, "ولا شكَّ في ذلك."], [819.0, "ولكن إذا جئنا إلى الجهة الأخرى،"], [822.8, "وهي كيفيّاتُ ما خُوطبنا به،"], [826.0, "فإنّ أهل السنة متّفقون الاتّفاقَ القطعيَّ الجازم على أنه لا يعلم أحدٌ شيئًا من كيفيّات هذه الصفات التي خُوطبنا بها."], [839.0, "وبما أنها لا تزال عنا خفيّةً غيرَ معلومةٍ لنا،"], [845.0, "فلا تزال في قسم المتشابه الذي نؤمن به على الوجه الذي يريده الله عز وجل،"], [853.0, "وعلى الوجه الذي أنزل الله عز وجل وحيَه عليه."]], "tr": [[800.0, "Sıfat naslarının manalarını, Arapların manasını bilmediği ve hiç kimsenin delaletini anlamadığı kapalı müteşâbihten olmakla niteleyen kimse bid'at ehlindendir;"], [815.5, "bunda şüphe yoktur. Fakat diğer yöne, yani bize hitap edilen şeylerin keyfiyetlerine geldiğimizde, Ehl-i Sünnet, bize hitap edilen bu sıfatların keyfiyetlerinden hiç kimsenin bir şey bilmediği üzerinde kesin ve kat'î bir ittifakla ittifak etmiştir."], [839.0, "Bunlar hâlâ bizden gizli ve bizce bilinmeyen şeyler olduğuna göre, hâlâ müteşâbih kısmındadırlar;"], [848.2, "Allah Azze ve Celle'nin murad ettiği şekilde ve Allah Azze ve Celle'nin vahyini indirdiği şekilde ona iman ederiz."]]}, {"reader": false, "ar": [[857.0, "لكن لا ندخل في تفسير شيءٍ من ذلك تفسيرَ كيف ـ لا ندخل في تفسير شيءٍ من ذلك تفسيرَ كيف ـ وأمّا تفسيرُ المعنى فكما ذكرتُ لكم بأنه متّفقٌ على معرفته بين فِئام أهل السنة والجماعة، سابقِهم ولاحقِهم."]], "tr": [[857.0, "Fakat bunlardan hiçbirini keyfiyet tefsiriyle tefsire girişmeyiz —hiçbirini keyfiyet tefsiriyle tefsire girişmeyiz—."], [861.0, "Mana tefsirine gelince, size zikrettiğim gibi, Ehl-i Sünnet ve'l-Cemaat'in öncekisi ve sonrakisiyle bütün toplulukları arasında onun bilindiği üzerinde ittifak vardır."]]}, {"reader": false, "ar": [[881.0, "فإن قلتَ: ولماذا ـ لماذا ـ جعلتَ كيفيّةَ صفات الله عز وجل من قبيل المتشابه؟"], [893.0, "فأقول: لأنّ كيفيّة الشيء لا تُعرف إلا بثلاثة أشياء:"]], "tr": [[881.0, "Eğer \"Neden —neden— Allah Azze ve Celle'nin sıfatlarının keyfiyetini müteşâbih kısmından saydın?\" dersen, derim ki:"], [893.7, "Çünkü bir şeyin keyfiyeti ancak üç şeyle bilinir:"]]}]}, {"ts": "15:01", "title": "2. Külliye (devam): Keyfiyeti bilmenin üç yolu ve üçünün de kapalı olması", "paras": [{"reader": false, "ar": [[901.0, "إمّا برؤيتها، وهذا منتفٍ عن صفات الله عز وجل؛"], [907.0, "فإنّ أهل السنة متّفقون على أنّ الله عز وجل لا يُرى في هذه الدنيا رؤيةَ عينٍ يقظة ـ أنتم معي في كلامي ولّا لا؟"], [920.0, "ـ رؤيةَ عينٍ يقظة. وإنما اختلفوا في واحد،"], [924.4, "وهو النبيُّ صلى الله عليه وسلم؛"], [928.0, "فمن أهل السنة من قال:"], [930.2, "رآه ليلةَ أُسري به،"], [932.0, "ومنهم من قال: لم يَرَه،"], [935.0, "والأصحُّ أنه لم يَرَه،"], [940.0, "وعليه أكثرُ أهل السنة والجماعة،"], [943.0, "رحم الله أمواتَهم وثبّت أحياءَهم."], [946.0, "فبما أنّ العين لم ترَ شيئًا من صفات الله عز وجل،"], [951.0, "فيكون الطريق الأوّل منقطعًا."]], "tr": [[901.0, "Ya onu görmekle; bu ise Allah Azze ve Celle'nin sıfatları hakkında söz konusu değildir."], [907.0, "Çünkü Ehl-i Sünnet, Allah Azze ve Celle'nin bu dünyada uyanıkken gözle görülmediği üzerinde ittifak etmiştir —sözümde benimle misiniz, değil misiniz?— uyanıkken gözle görülmez."], [920.0, "Sadece bir kişi hakkında ihtilaf etmişlerdir;"], [923.8, "o da Peygamber sallallâhu aleyhi ve sellem'dir."], [928.0, "Ehl-i Sünnet'ten bazıları \"İsrâ gecesi O'nu gördü\" demiş, bazıları da \"görmedi\" demiştir."], [933.8, "En sahih olanı görmediğidir; Ehl-i Sünnet ve'l-Cemaat'in çoğu bu görüştedir;"], [941.2, "Allah onların ölülerine rahmet etsin, dirilerini sebat üzere kılsın."], [946.0, "Göz, Allah Azze ve Celle'nin sıfatlarından hiçbir şeyi görmediğine göre birinci yol kesilmiştir."]]}, {"reader": false, "ar": [[954.0, "وأمّا الطريق الثاني فهي رؤيةُ شيءٍ يماثله،"], [960.0, "فيُستدلّ برؤية النظير على رؤية ـ على كيفيّات صفات نظيره الغائب."], [969.0, "وهذا طريقٌ منقطع، لأنّ الله عز وجل قد قال في كتابه الكريم:"], [976.0, "<span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [980.0, "<span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>،"], [983.0, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>. فقد قطع الله عز وجل طريقَ وجود النظير الذي يُستدلّ برؤيته على معرفة كيفيّة صفاته عز وجل."]], "tr": [[954.0, "İkinci yol ise ona benzeyen bir şeyi görmektir;"], [960.0, "benzerin görülmesiyle, gözden uzak olan benzerinin görülmesine —sıfatlarının keyfiyetlerine— istidlal edilir."], [969.0, "Bu da kesik bir yoldur;"], [971.3, "çünkü Allah Azze ve Celle Kitab-ı Kerîm'inde şöyle buyurmuştur:"], [976.0, "<span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4], <span class=\"ayah\">﴿O'nun adaşı (benzeri) olan birini biliyor musun?﴾<\/span> [Meryem 65], <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11]."], [990.1, "Böylece Allah Azze ve Celle, görülmesiyle O'nun sıfatlarının keyfiyetini bilmeye istidlal edilecek bir benzerin bulunması yolunu kesmiştir."]]}, {"reader": false, "ar": [[997.0, "فإن قلتَ: وما الطريق الثالث؟"], [1001.0, "فأقول: الطريق الثالث هو أن يُخبرك الصادقُ ـ الذي لا يُشَكّ في خبره ـ عن كيفيّة الشيء الغائب،"], [1010.0, "والمقصود بالصادق هنا النبيُّ صلى الله عليه وسلم."], [1016.0, "والنبيُّ عليه الصلاة والسلام لم يُخبرنا عن شيءٍ من كيفيّات صفات ربّنا؛"], [1024.0, "فأخبرنا أنّ لربّنا استواءً ولم يخبرنا عن كيفيّة هذا الاستواء،"], [1031.0, "وأخبرنا أنّ لربّنا وجهًا ولم يخبرنا عن كيفيّة هذا الوجه،"], [1037.0, "وأخبرنا أنّ لربّنا يدًا وعينًا وساقًا ورِجلًا وسمعًا وبصرًا ونزولًا وعلوًّا وأصابعَ،"], [1044.8, "وغيرَ ذلك من صفات الله عز وجل،"], [1057.0, "ولكن لم يُخبرنا صلى الله عليه وسلم بشيءٍ من كيفيّة ذلك كلِّه ـ بشيءٍ من كيفيّة ذلك ـ أبدًا."]], "tr": [[997.0, "Eğer \"Üçüncü yol nedir?\" dersen, derim ki:"], [1001.0, "Üçüncü yol, haberinden şüphe edilmeyen doğru sözlü birinin sana gözden uzak olan şeyin keyfiyetini haber vermesidir."], [1009.4, "Burada doğru sözlüden kasıt Peygamber sallallâhu aleyhi ve sellem'dir."], [1016.0, "Peygamber aleyhissalâtu vesselâm ise bize Rabbimizin sıfatlarının keyfiyetlerinden hiçbir şey haber vermemiştir."], [1020.0, "Bize Rabbimizin istivâsı olduğunu haber verdi, ama bu istivânın keyfiyetini haber vermedi."], [1024.0, "Bize Rabbimizin yüzü olduğunu haber verdi, ama bu yüzün keyfiyetini haber vermedi."], [1032.8, "Bize Rabbimizin eli, gözü, baldırı (sâk), ayağı, işitmesi, görmesi, nüzulü, uluvvü, parmakları ve Allah Azze ve Celle'nin daha başka sıfatları olduğunu haber verdi;"], [1048.7, "fakat sallallâhu aleyhi ve sellem bize bütün bunların keyfiyetinden —bunların keyfiyetinden— asla bir şey haber vermedi."]]}, {"reader": false, "ar": [[1068.0, "لم يُخبرنا أبدًا في أيّ نصٍّ صحيحٍ عنه أنه قال:"], [1073.9, "كيفيّةُ وجه الله كذا وكذا،"], [1076.0, "وكيفيّةُ استواء الله كذا وكذا."], [1080.0, "وبما أنّ طرق العلم بالكيفيّة منقطعةٌ عن صفات الله عز وجل،"], [1088.0, "فكيف الطريق إلى معرفة كيفيّتها؟"], [1092.0, "الجواب: لا طريقَ أبدًا."], [1094.0, "ونسأل الله عز وجل ألّا يحرمنا رؤيتَه في العَرَصات،"], [1101.0, "وبعد دخول أهل الجنة الجنة."]], "tr": [[1068.0, "Ondan gelen hiçbir sahih nasta, \"Allah'ın yüzünün keyfiyeti şöyle şöyledir, Allah'ın istivâsının keyfiyeti şöyle şöyledir\" dediğini bize asla haber vermedi."], [1080.0, "Keyfiyeti bilme yolları Allah Azze ve Celle'nin sıfatları hakkında kesik olduğuna göre, onların keyfiyetini bilmeye yol nasıl olacak?"], [1092.0, "Cevap: Asla bir yol yoktur."], [1094.0, "Allah Azze ve Celle'den, (kıyametin) meydanlarında (arasât) ve cennet ehli cennete girdikten sonra bizi O'nu görmekten mahrum etmemesini dileriz."]]}, {"reader": false, "ar": [[1106.0, "فإن قلتَ: أوَليس الكلام في المعنى فرعًا عن الكلام في الكيفيّة؟"], [1116.0, "الجواب: ليس هذا بمتلازمٍ أبدًا."], [1123.0, "وأضرب لك مثالين واضحين:"], [1127.0, "الأوّل: لو قلتُ لك:"], [1130.1, "«اشتريتُ بيتًا»، فلأنك عربيٌّ تعرف معنى الباء والياء والتاء،"], [1137.0, "فأنت ستفهم أنني لم أشترِ سيّارةً ولا دابّةً ولا ثمرًا ولا طعامًا ولا شرابًا،"], [1149.0, "وإنما تعرف المعنى لأنك عربيٌّ وأنت تعرف معنى البيت، فأنت علمتَ المعنى."]], "tr": [[1106.0, "Eğer \"Mana hakkında konuşmak, keyfiyet hakkında konuşmanın bir fer'i (ona bağlı) değil midir?\" dersen, cevap:"], [1123.0, "Bu ikisi asla birbirini gerektirmez."], [1127.0, "Sana iki açık örnek vereyim."], [1130.1, "Birincisi: Sana \"Bir ev (beyt) aldım\" desem, Arap olduğun için \"bâ\", \"yâ\" ve \"tâ\"nın manasını bilirsin;"], [1140.4, "benim bir araba, bir binek, meyve, yiyecek veya içecek almadığımı anlarsın."], [1149.6, "Manayı bilirsin, çünkü Arapsın ve \"ev\"in manasını bilirsin; dolayısıyla manayı bilmiş olursun."]]}, {"reader": false, "ar": [[1156.0, "ولكن لو سألتُك وقلتُ:"], [1158.9, "بما أنك علمتَ المعنى فأخبرني عن كيفيّة هذا البيت الذي اشتريتُه،"], [1166.0, "فإنك لا تستطيع. فليس هناك تلازمٌ بين معرفة معنى الشيء وإدراك كيفيّته،"], [1176.0, "لأنك لم ترَ البيت الذي اشتريتُه،"], [1179.0, "ولم ترَ نظيره، ولم يُخبرك مشتريه عن كيفيّة بنائه."]], "tr": [[1156.0, "Fakat sana sorsam ve \"Manayı bildiğine göre, aldığım bu evin keyfiyetini bana haber ver\" desem, buna gücün yetmez."], [1168.0, "Bir şeyin manasını bilmekle keyfiyetini idrak etmek arasında bir birbirini gerektirme yoktur;"], [1176.5, "çünkü aldığım evi görmedin, benzerini görmedin ve onu satın alan sana yapısının keyfiyetini haber vermedi."]]}, {"reader": false, "ar": [[1186.0, "ومثالٌ آخر: لو قلتُ لك:"], [1191.4, "«اشتريتُ طعامًا»، فلأنك عربيٌّ تعرف معنى الطعام في اللغة،"], [1201.0, "فإنك ستفهم أنني لم أشترِ بيتًا ولا دابّةً ولا لباسًا ولا أثاثًا،"], [1208.0, "وإنما اشتريتُ طعامًا. فمعنى الطعام عندك معلوم،"], [1212.0, "لكن مع كونه معلومًا لك فإنني أتحدّاك أن تعطيني كيفيّةَ هذا الطعام الذي اشتريتُه،"], [1221.2, "جنسًا ونوعًا ومقدارًا وكيفيّةً؛"], [1230.0, "فإنك لا تعرف شيئًا من ذلك ما لم تَرَه،"], [1235.9, "أو ترَ نظيره، أو يُخبرك مشتريه عن كيفيّته."]], "tr": [[1186.0, "Bir başka örnek: Sana \"Yiyecek aldım\" desem, Arap olduğun için dilde \"yiyecek\"in manasını bilirsin;"], [1202.2, "ev, binek, elbise veya eşya almadığımı, sadece yiyecek aldığımı anlarsın."], [1210.0, "Yiyeceğin manası senin nezdinde bilinmektedir."], [1212.0, "Fakat senin için bilinir olmasına rağmen, aldığım bu yiyeceğin keyfiyetini —cinsini, türünü, miktarını ve nasıl olduğunu— bana söylemen için sana meydan okurum."], [1230.0, "Onu görmedikçe, benzerini görmedikçe veya onu satın alan sana keyfiyetini haber vermedikçe bunlardan hiçbir şeyi bilemezsin."]]}, {"reader": false, "ar": [[1243.0, "وبهذين المثالين يتّضح لكم ـ وفّقكم الله تعالى ـ أنه لا تلازمَ أبدًا بين كلام أهل السنة والجماعة في معاني صفات الله عز وجل على حسب دلالتها اللغويّة،"], [1258.0, "وبين ـ الكلام ـ وبين إمساكهم عن الكلام في شيءٍ من الكيفيّات."]], "tr": [[1243.0, "Bu iki örnekle —Allah Teâlâ sizi muvaffak kılsın— Ehl-i Sünnet ve'l-Cemaat'in Allah Azze ve Celle'nin sıfatlarının manaları hakkında dildeki delaletlerine göre konuşmaları ile keyfiyetlerden herhangi biri hakkında konuşmaktan kaçınmaları arasında asla bir birbirini gerektirme olmadığı size açıkça ortaya çıkar."]]}]}, {"ts": "21:05", "title": "2. Külliye (devam): Keyfiyeti Allah'tan başkası bilmez; iman yolu nassın sıhhatidir", "paras": [{"reader": false, "ar": [[1265.0, "وإنني أُقسم بالله عز وجل أنه لا يعلم كيفيّةَ شيءٍ من صفات الله عز وجل لا مَلَكٌ مقرَّب،"], [1275.1, "ولا نبيٌّ مرسَل، ولا وليٌّ صالح،"], [1281.0, "فضلًا عمّن دونهم في الرتبة والمنزلة،"], [1285.0, "وإنما لا يعلم كيفيّةَ صفات الله إلا هو عز وجل."], [1291.0, "وبناءً على ذلك فنحن نتلقّى هذه الصفات باعتبار كيفيّتها تلقّيَ المؤمن بها ـ انتبه ـ وتلقّيَ عدم الخوض في كيفيّاتها،"], [1308.0, "مع كمال الإذعان والتسليم والتصديق."]], "tr": [[1265.0, "Allah Azze ve Celle'ye yemin ederim ki Allah Azze ve Celle'nin sıfatlarından herhangi birinin keyfiyetini ne mukarreb bir melek ne gönderilmiş bir peygamber ne de salih bir veli bilir;"], [1281.0, "rütbe ve mertebe olarak onlardan aşağıda olanlar ise hiç bilemez."], [1286.2, "Allah'ın sıfatlarının keyfiyetini ancak O Azze ve Celle bilir."], [1291.0, "Buna binaen biz bu sıfatları, keyfiyetleri itibarıyla, onlara iman eden kimsenin kabulüyle —dikkat et— ve keyfiyetlerine dalmama kabulüyle, tam bir boyun eğme, teslimiyet ve tasdik ile karşılarız."]]}, {"reader": false, "ar": [[1313.0, "وذلك لأنّ أهل السنة والجماعة لا يجعلون طريقَ الإيمان ما تراه العيون كالملاحدة،"], [1325.0, "ولا ما تُدركه العقول كالفلاسفة،"], [1328.0, "وإنما طريقُ الإيمان صحّةُ النصّ."], [1332.0, "فمتى صحّ النصُّ بالأمر الغيبيّ فالواجب عليّ ـ كمسلمٍ وسُنّيٍّ ـ أن أتلقّاه بأكمل الإيمان،"], [1345.0, "وأكمل الإذعان، وأكمل التسليم،"], [1349.0, "وعدم المجادلة والخوض في شيءٍ من ذلك،"], [1353.0, "وأقول كما قال الراسخون في العلم:"], [1358.0, "<span class=\"ayah\">﴿آمَنَّا بِهِ كُلٌّ مِّنْ عِندِ رَبِّنَا﴾<\/span> <span class=\"ref\">[آل عمران: ٧]<\/span>. أفهمتم هذا؟"]], "tr": [[1313.0, "Bunun sebebi şudur: Ehl-i Sünnet ve'l-Cemaat, mülhidler gibi iman yolunu gözlerin gördüğü şey kılmaz;"], [1321.3, "filozoflar gibi akılların idrak ettiği şey de kılmaz."], [1328.0, "İman yolu, nassın sahih olmasıdır."], [1332.0, "Gaybî bir iş hakkında nas sahih olduğunda, bir Müslüman ve bir sünnî olarak bana vâcip olan, onu en mükemmel imanla, en mükemmel boyun eğmeyle, en mükemmel teslimiyetle, onun hiçbir şeyi hakkında tartışmaya ve dalmaya girmeden karşılamak ve ilimde râsih olanların dediği gibi demektir:"], [1358.0, "<span class=\"ayah\">﴿Ona iman ettik; hepsi Rabbimiz katındandır﴾<\/span> [Âl-i İmrân 7]. Bunu anladınız mı?"]]}, {"reader": false, "ar": [[1366.0, "فإذا قيل لك: هل نصوص الصفات من المتشابه أو من المحكم؟"], [1371.0, "فلا تقل: من المتشابه مطلقًا،"], [1375.0, "ولا تقل: من المحكم مطلقًا،"], [1380.0, "وإنما تقول ما نصّت عليه هذه الكلّيّة:"], [1386.0, "من أنها محكمةٌ باعتبار المعنى على حسب دلالة لغة العرب،"], [1393.0, "ومتشابهةٌ باعتبار كيفيّتها على ما هي عليه في الواقع."], [1400.0, "وأظنّ أنّ الأمر وضح بإذن الله عز وجل. والله أعلم."]], "tr": [[1366.0, "Sana \"Sıfat nasları müteşâbihten mi, yoksa muhkemden mi?\" denirse, \"mutlak olarak müteşâbihtendir\" deme, \"mutlak olarak muhkemdendir\" de deme."], [1376.6, "Bu külliyenin açıkça ifade ettiğini söylersin:"], [1386.0, "Onlar Arap dilinin delaletine göre mana itibarıyla muhkem, gerçekte olduğu hâl üzere keyfiyetleri itibarıyla müteşâbihtir."], [1396.6, "Zannediyorum mesele Allah Azze ve Celle'nin izniyle açıklığa kavuştu. Allah en iyisini bilir."]]}]}, {"ts": "23:24", "title": "3. Külliye: Allah'a izafe edilen her sıfatı «Leyse kemislihî şey'» ile birlikte anmak vâciptir", "paras": [{"reader": false, "ar": [[1404.0, "الكلّيّة الثالثة: كلُّ صفةٍ مضافةٍ لله تعالى فيجب اقترانُها بقوله:"], [1422.3, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span>. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1404.0, "<b>3. külliye: Allah Teâlâ'ya izafe edilen her sıfatı, O'nun <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> sözüyle birlikte anmak vâciptir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1438.0, "أقول وبالله التوفيق: وهذه الكلّيّة تقيك ـ بإذن الله عز وجل ـ من أعظم آفةٍ إبليسيّةٍ شيطانيّة،"], [1447.0, "إذا استطاع أن يزرعها في عقلك وقلبك استولى على عقيدتك،"], [1451.0, "وهي بذرةُ التمثيل الملعونة المأفونة الإبليسيّة الشيطانيّة القذرة النجسة."], [1460.0, "فمتى استطاع إبليس أن يزرع بذرةَ تمثيل الخالق بالمخلوق،"], [1465.8, "أو المخلوق بالخالق، في قلبك،"], [1469.0, "فاعلم أنه ربح الجولة واستولى على عقيدتك،"], [1472.1, "وسوف يُدخل عليها من الفساد ما لم يكن لك في حسبان."]], "tr": [[1438.0, "Tevfik Allah'tandır, derim ki: Bu külliye, Allah Azze ve Celle'nin izniyle seni iblisçe ve şeytanca en büyük âfetten korur."], [1449.8, "(Şeytan) onu aklına ve kalbine ekmeyi başarırsa akîdeni ele geçirir."], [1460.0, "O da lanetli, çürük, iblisçe, şeytanca, pis ve necis temsil (benzetme) tohumudur."], [1466.4, "İblis, Yaratanı mahlûka veya mahlûku Yaratana benzetme tohumunu kalbine ekmeyi başardığında, bil ki o raundu kazanmış ve akîdeni ele geçirmiştir;"], [1474.3, "ona hiç hesaba katmadığın fesatları sokacaktır."]]}, {"reader": false, "ar": [[1477.0, "ولذلك من أعظم ما ينبغي أن تحتاط له أن يستطيع ـ أو ينجح ـ إبليس في زراعة آفة التمثيل وبذرة التمثيل في قلبك."], [1488.0, "فإنه ـ والله ـ ما وقع شركٌ في هذا العالم إلا لمّا زُرعت بذرةُ التمثيل؛"], [1494.0, "لمّا مُثِّل الخالقُ بالمخلوق عُبِد المخلوق،"], [1499.0, "لمّا أُضفي على المخلوق شيءٌ من صفات الخالق رُفع المخلوقُ إلى رتبة الخالق."], [1510.0, "فكلّما تقارب الخالقُ والمخلوق ببذرة التمثيل في قلبك حصل البلاءُ العقديّ،"], [1518.0, "لكن إذا كان كلٌّ منهما في منزلته،"], [1521.0, "حينئذٍ لا يستطيع الشيطان أن يلبّس عليك بشيءٍ من ذلك."]], "tr": [[1477.0, "Bu yüzden karşı en çok tedbir alman gereken şeylerden biri, İblis'in temsil âfetini ve temsil tohumunu kalbine ekmeye gücünün yetmesi —veya bunda başarılı olması—dır."], [1489.1, "Vallahi bu âlemde şirk ancak temsil tohumu ekildiğinde meydana gelmiştir:"], [1494.0, "Yaratan mahlûka benzetildiğinde mahlûka ibadet edildi;"], [1499.7, "mahlûka Yaratanın sıfatlarından bir şey giydirildiğinde mahlûk Yaratanın rütbesine yükseltildi."], [1510.0, "Temsil tohumuyla kalbinde Yaratan ile mahlûk birbirine ne kadar yaklaşırsa akîdevî bela o kadar meydana gelir."], [1519.3, "Fakat her biri kendi mertebesinde olursa, işte o zaman şeytan bu konuda sana hiçbir şeyi karıştıramaz."]]}, {"reader": false, "ar": [[1527.0, "ولذلك هذه الآيةُ في سورة الشورى،"], [1532.0, "في قول الله عز وجل:"], [1534.5, "<span class=\"ayah\">﴿فَاطِرُ السَّمَاوَاتِ وَالْأَرْضِ ۚ جَعَلَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا وَمِنَ الْأَنْعَامِ أَزْوَاجًا ۖ يَذْرَؤُكُمْ فِيهِ﴾<\/span>،"], [1543.0, "يعني: أنتم مخلوقون، ولكم أمثالٌ وأزواج."], [1546.0, "ثم تكلّم عن نفسه فقال:"], [1549.6, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ ۖ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>."], [1555.0, "فهذه الآية العظيمة تقضي على تلك البذرة الإبليسيّة،"], [1561.0, "بل أظنّها من أشدّ الآيات على إبليس،"], [1565.0, "والتي تقف في وجهه حائطًا وصدًّا منيعًا في أن يستولي على شيءٍ من عقائدك."]], "tr": [[1527.0, "Bu yüzden Şûrâ sûresindeki şu ayet, Allah Azze ve Celle'nin şu sözü:"], [1534.5, "<span class=\"ayah\">﴿(O) göklerin ve yerin yaratıcısıdır. Size kendi nefislerinizden eşler, hayvanlardan da eşler yarattı. Sizi bu yolla çoğaltıyor﴾<\/span>;"], [1543.5, "yani siz yaratılmışsınız ve sizin benzerleriniz ve eşleriniz vardır."], [1546.0, "Sonra kendisinden bahsederek şöyle buyurdu:"], [1549.6, "<span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur. O, işitendir, görendir﴾<\/span> [Şûrâ 11]."], [1555.0, "Bu büyük ayet o iblisçe tohumu yok eder."], [1560.1, "Hatta zannediyorum İblis'e en ağır gelen ayetlerdendir;"], [1564.4, "akîdelerinden bir şeyi ele geçirmesine karşı onun önünde bir duvar ve aşılmaz bir set olarak durur."]]}, {"reader": false, "ar": [[1573.0, "ولذلك تجد منهجَ القرآن في نفي الشرك:"], [1577.7, "قطعَ دابر المماثلة بين الخالق والمخلوق،"], [1584.0, "فيسلب خصائصَ الربوبيّة والألوهيّة عن هذا المخلوق،"], [1588.5, "ليكون الخالقُ في منزلته والمخلوقُ في رتبته."], [1593.0, "كما قال الله عز وجل عن إبراهيم:"], [1597.0, "<span class=\"ayah\">﴿يَا أَبَتِ لِمَ تَعْبُدُ مَا لَا يَسْمَعُ وَلَا يُبْصِرُ وَلَا يُغْنِي عَنكَ شَيْئًا﴾<\/span> <span class=\"ref\">[مريم: ٤٢]<\/span>."], [1602.0, "وفي قول الله عز وجل:"], [1605.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ تَدْعُونَ مِن دُونِ اللَّهِ لَن يَخْلُقُوا ذُبَابًا وَلَوِ اجْتَمَعُوا لَهُ ۖ وَإِن يَسْلُبْهُمُ الذُّبَابُ شَيْئًا لَّا يَسْتَنقِذُوهُ مِنْهُ ۚ ضَعُفَ الطَّالِبُ وَالْمَطْلُوبُ﴾<\/span> <span class=\"ref\">[الحج: ٧٣]<\/span>،"], [1616.0, "أي: العابدُ والمعبودُ من دون الله عز وجل."], [1619.0, "وقال الله عز وجل:"], [1621.0, "<span class=\"ayah\">﴿وَالَّذِينَ تَدْعُونَ مِن دُونِهِ مَا يَمْلِكُونَ مِن قِطْمِيرٍ﴾<\/span> <span class=\"ref\">[فاطر: ١٣]<\/span>، الآيات بتمامها."]], "tr": [[1573.0, "Bu yüzden Kur'an'ın şirki nefyetmedeki metodunun, Yaratan ile mahlûk arasındaki benzerliğin kökünü kesmek olduğunu görürsün."], [1581.1, "Rubûbiyyet ve ulûhiyyetin has özelliklerini bu mahlûktan soyar ki Yaratan kendi mertebesinde, mahlûk da kendi rütbesinde olsun."], [1593.0, "Nitekim Allah Azze ve Celle İbrâhîm'den naklen şöyle buyurmuştur:"], [1597.0, "<span class=\"ayah\">﴿Babacığım! İşitmeyen, görmeyen ve sana hiçbir fayda vermeyen şeye neden ibadet ediyorsun?﴾<\/span> [Meryem 42]."], [1602.0, "Allah Azze ve Celle'nin şu sözünde de:"], [1605.0, "<span class=\"ayah\">﴿Allah'ı bırakıp yalvardıklarınız, bunun için bir araya gelseler bile bir sinek dahi yaratamazlar. Sinek onlardan bir şey kapsa, onu ondan kurtaramazlar. İsteyen de istenen de âcizdir﴾<\/span> [Hac 73];"], [1616.4, "yani ibadet eden de Allah Azze ve Celle'yi bırakıp ibadet edilen de."], [1619.0, "Allah Azze ve Celle şöyle de buyurmuştur:"], [1621.0, "<span class=\"ayah\">﴿O'nu bırakıp yalvardıklarınız bir hurma çekirdeğinin zarına bile sahip değildir﴾<\/span> [Fâtır 13] —ayetlerin tamamıyla."]]}, {"reader": false, "ar": [[1626.0, "كلُّ القرآن على فكّ ـ على فكّ ـ شيفرة الشيطان في تمثيل الخالق بالمخلوق،"], [1632.8, "وتمثيل المخلوق بالخالق. فما عبدت اليهودُ عُزيرًا إلا لمّا أضفوا عليه شيئًا من صفات الخالق،"], [1644.0, "ولا عبدت النصارى عيسى عليه السلام إلا لمّا أضفت عليه شيئًا من صفات الخالق،"], [1652.0, "ولا عُطِّلت صفاتُ الله عز وجل إلا لمّا مُثِّلت صفاتُ الخالق بصفات المخلوق،"], [1660.0, "فأرادوا أن يفرّوا من التمثيل فوقعوا في التعطيل،"], [1663.8, "كما سأذكره قريبًا في كلّيّاتٍ خاصّةٍ إن شاء الله."]], "tr": [[1626.0, "Kur'an'ın tamamı, şeytanın Yaratanı mahlûka ve mahlûku Yaratana benzetme şifresini çözmek —çözmek— üzerinedir."], [1628.5, "Yahudiler Üzeyr'e ancak ona Yaratanın sıfatlarından bir şey giydirdiklerinde ibadet ettiler."], [1631.4, "Hristiyanlar İsa aleyhisselâma ancak ona Yaratanın sıfatlarından bir şey giydirdiklerinde ibadet ettiler."], [1635.0, "Allah Azze ve Celle'nin sıfatları ancak Yaratanın sıfatları mahlûkun sıfatlarına benzetildiğinde ta'til edildi;"], [1653.8, "temsilden kaçmak istediler ve ta'tile düştüler."], [1661.4, "İnşallah yakında özel külliyelerde bunu zikredeceğim."]]}, {"reader": false, "ar": [[1668.0, "فإذا كنّا لا نزال في أمنٍ وأمانٍ وسلامةٍ من تلك البذرة،"], [1674.5, "لم تُزرع في قلوبنا وعقولنا بعدُ،"], [1678.0, "فنحن في أمنٍ وأمانٍ من الفساد الاعتقاديّ إن شاء الله."]], "tr": [[1668.0, "Eğer hâlâ o tohumdan emniyet, güven ve selâmet içindeysek, o tohum henüz kalplerimize ve akıllarımıza ekilmemişse, inşallah itikadî fesattan emniyet ve güven içindeyiz."]]}]}, {"ts": "28:03", "title": "3. Külliye (devam): Her sıfat için «benzeri hiçbir şey yoktur» denir", "paras": [{"reader": false, "ar": [[1683.0, "ولذلك جميعُ الصفات التي أضافها الله عز وجل له،"], [1688.0, "إيّاك أن تأخذها بمعزلٍ عن قوله:"], [1692.3, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span>؛ فهي ليست مقيّدةً بالسمع والبصر الذي ورد معها في الآية،"], [1700.0, "بل تُقال في كلّ ما نُثبته لله عز وجل من صفات."], [1705.0, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span>:"], [1707.9, "استواءٌ ليس كمثله شيء."], [1712.0, "<span class=\"ayah\">﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٧]<\/span>: فلربّنا وجهٌ ليس كمثله شيء."], [1717.0, "«ينزل ربُّنا»: لله نزولٌ ليس كمثله شيء."], [1722.0, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span>: ليس كيدَي الله شيء."], [1728.0, "«حتى يضعَ ربُّ العزّة فيها رِجلَه»:"], [1731.4, "لله رِجلٌ لائقةٌ بجلاله وعظمته،"], [1734.3, "ليس كمثلها شيء. وهكذا دواليك في جميع الصفات،"], [1739.2, "تكن ناجيًا ـ بإذن الله عز وجل ـ من الفساد العقديّ."]], "tr": [[1683.0, "Bu yüzden Allah Azze ve Celle'nin kendisine izafe ettiği bütün sıfatları, O'nun <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> sözünden ayrı olarak almaktan sakın."], [1695.0, "Bu söz, ayette onunla birlikte geçen işitme ve görme ile kayıtlı değildir;"], [1699.5, "bilakis Allah Azze ve Celle'ye isbat ettiğimiz bütün sıfatlarda söylenir."], [1702.7, "<span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5]:"], [1705.0, "Benzeri hiçbir şey olmayan bir istivâ."], [1707.9, "<span class=\"ayah\">﴿Rabbinin yüzü bâki kalır﴾<\/span> [Rahmân 27]:"], [1712.0, "Rabbimizin, benzeri hiçbir şey olmayan bir yüzü vardır."], [1717.0, "\"Rabbimiz iner\": Allah'ın, benzeri hiçbir şey olmayan bir nüzulü vardır."], [1722.0, "<span class=\"ayah\">﴿Bilakis O'nun iki eli açıktır﴾<\/span> [Mâide 64]:"], [1724.2, "Allah'ın iki eli gibi hiçbir şey yoktur."], [1728.0, "\"Nihayet İzzet sahibi Rab ayağını onun (cehennemin) içine koyar\":"], [1731.4, "Allah'ın, celâline ve azametine yakışan, benzeri hiçbir şey olmayan bir ayağı vardır."], [1736.0, "Bütün sıfatlarda böyle devam et;"], [1739.2, "Allah Azze ve Celle'nin izniyle akîdevî fesattan kurtulmuş olursun."]]}, {"reader": false, "ar": [[1745.0, "فأعظمُ ما أوصيكم ـ وفّقكم الله ـ بالمحافظة عليه:"], [1750.0, "أن تحفظوا قلوبكم وعقولكم من أن يستطيع إبليس أن يزرع فيها تلك البذرةَ المأفونة اللعينة الخبيثة القذرة النجسة،"], [1766.0, "التي هي بوّابةٌ لكلّ فسادٍ عقديّ."], [1771.0, "وأسأل الله أن يعصم قلوبَنا وقلوبَ المسلمين من هذه البذرة الخبيثة."]], "tr": [[1745.0, "Size —Allah sizi muvaffak kılsın— korumanızı tavsiye ettiğim en büyük şey şudur:"], [1750.0, "Kalplerinizi ve akıllarınızı, İblis'in onlara o çürük, lanetli, habis, pis ve necis tohumu ekebilmesinden koruyun;"], [1762.2, "o tohum her akîdevî fesadın kapısıdır."], [1771.0, "Allah'tan kalplerimizi ve Müslümanların kalplerini bu habis tohumdan korumasını dilerim."]]}, {"reader": false, "ar": [[1776.0, "ولذلك نصّت الأدلّة على أهمّيّة حماية القلوب والعقول من هذه البذرة في آياتٍ كثيرة:"], [1784.0, "في قول الله عز وجل:"], [1786.8, "<span class=\"ayah\">﴿فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ﴾<\/span> <span class=\"ref\">[النحل: ٧٤]<\/span>،"], [1789.0, "وفي قول الله عز وجل:"], [1791.8, "<span class=\"ayah\">﴿فَلَا تَجْعَلُوا لِلَّهِ أَندَادًا﴾<\/span> <span class=\"ref\">[البقرة: ٢٢]<\/span>،"], [1794.0, "وفي قوله عز وجل:"], [1795.8, "<span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [1798.0, "وفي قوله عز وجل:"], [1800.0, "<span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>،"], [1802.0, "أي: نِدًّا ونظيرًا يُساميه في ذاته أو صفاته أو أفعاله أو أسمائه عز وجل. والله أعلم."]], "tr": [[1776.0, "Bu yüzden deliller, kalpleri ve akılları bu tohumdan korumanın önemini pek çok ayette açıkça ifade etmiştir:"], [1784.0, "Allah Azze ve Celle'nin şu sözünde:"], [1786.8, "<span class=\"ayah\">﴿Allah'a misaller getirmeyin﴾<\/span> [Nahl 74];"], [1789.0, "Allah Azze ve Celle'nin şu sözünde:"], [1791.8, "<span class=\"ayah\">﴿Allah'a eşler koşmayın﴾<\/span> [Bakara 22];"], [1793.4, "O Azze ve Celle'nin şu sözünde:"], [1795.8, "<span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4];"], [1797.6, "O Azze ve Celle'nin şu sözünde:"], [1800.0, "<span class=\"ayah\">﴿O'nun adaşı olan birini biliyor musun?﴾<\/span> [Meryem 65];"], [1802.5, "yani zâtında, sıfatlarında, fiillerinde veya isimlerinde O Azze ve Celle ile yarışacak bir eş ve benzer. Allah en iyisini bilir."]]}]}, {"ts": "30:11", "title": "4. Külliye: Bütün sıfat naslarının manası bilinir", "paras": [{"reader": false, "ar": [[1811.0, "ومن الكلّيّات أيضًا، وهي الكلّيّة التي قلتُ:"], [1815.8, "سأذكر فيها تفاصيلَ أكثر:"], [1822.0, "<b>كلُّ نصوص الصفات معلومةُ المعنى.<\/b>"]], "tr": [[1811.0, "Külliyelerden biri de —ki daha fazla ayrıntı zikredeceğimi söylediğim külliyedir— şudur:"], [1822.0, "<b>4. külliye: Bütün sıfat naslarının manası bilinir.<\/b>"]]}, {"reader": false, "ar": [[1827.0, "أقول وبالله التوفيق: وهذا بإجماع أهل السنة والجماعة،"], [1832.4, "رحم الله أمواتَهم وثبّت أحياءَهم،"], [1843.8, "فهم يقولون بأنّ ما خاطبنا الله عز وجل به من نصوص الصفات معلومٌ باعتبار المعنى."], [1860.0, "ومن نسب إلى أهل السنة ـ كمذهبٍ لا كأفراد ـ ومن نسب إلى أهل السنة كمذهبٍ أنهم يفوّضون المعنى،"], [1870.9, "فقد كذب واخترع وافترى على أهل السنة والجماعة."], [1878.0, "فلا تزال نصوصُهم تدلّ على أنهم يعتقدون الاعتقادَ القطعيَّ الجازم بأنّ صفات الله عز وجل معلومةٌ باعتبار المعنى. وذلك لعدّة أوجه:"]], "tr": [[1827.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır;"], [1829.0, "Allah onların ölülerine rahmet etsin, dirilerini sebat üzere kılsın."], [1835.1, "Onlar, Allah Azze ve Celle'nin bize sıfat naslarından hitap ettiği şeyin mana itibarıyla bilindiğini söylerler."], [1860.0, "Ehl-i Sünnet'e —fertler olarak değil, mezhep olarak— Ehl-i Sünnet'e mezhep olarak manayı tefvîz ettiklerini nispet eden kimse, Ehl-i Sünnet ve'l-Cemaat hakkında yalan söylemiş, uydurmuş ve iftira etmiştir."], [1878.0, "Onların sözleri hâlâ, Allah Azze ve Celle'nin sıfatlarının mana itibarıyla bilindiğine kesin ve kat'î bir inançla inandıklarını göstermektedir. Bu, birkaç vecihten dolayıdır:"]]}, {"reader": false, "ar": [[1895.0, "الوجه الأوّل: الدلالة الشرعيّة،"], [1901.0, "وذلك في جُمَلٍ من الأحاديث:"], [1905.0, "منها في «الصحيح» من حديث ابن عمر قال:"], [1915.6, "خطبنا النبيُّ صلى الله عليه وسلم فقال:"], [1919.6, "«إنّ الله تبارك وتعالى يقبض السماواتِ يوم القيامة ويأخذهنّ بيمينه، ويقبض الأرَضين ويأخذهنّ بيده الأخرى، ثم يهزّهنّ ويقول: أنا الملك، أين الجبّارون؟ أين المتكبّرون؟»."], [1940.0, "يقول الراوي: فهزّ النبيُّ صلى الله عليه وسلم يديه،"], [1945.7, "حتى إنّ أصلَ المنبر ليتحرّك برسول الله صلى الله عليه وسلم. الحديثَ بتمامه."]], "tr": [[1895.0, "Birinci vecih: Şer'î delalet. Bu, birtakım hadislerdedir."], [1905.0, "Bunlardan biri \"Sahîh\"te İbn Ömer'in rivayet ettiği hadistir."], [1915.6, "Şöyle demiştir: Peygamber sallallâhu aleyhi ve sellem bize hutbe verdi ve şöyle buyurdu:"], [1919.6, "\"Allah Tebâreke ve Teâlâ kıyamet günü gökleri kabzeder ve onları sağ eliyle alır;"], [1927.3, "yerleri kabzeder ve onları diğer eliyle alır."], [1931.2, "Sonra onları sallar ve 'Melik benim!"], [1940.0, "Zorbalar nerede? Kibirliler nerede?' der.\" Râvi diyor ki:"], [1943.8, "Peygamber sallallâhu aleyhi ve sellem ellerini salladı;"], [1947.0, "öyle ki minberin dibi Resûlullah sallallâhu aleyhi ve sellem ile birlikte sallanıyordu. —Hadisin tamamıyla."]]}, {"reader": false, "ar": [[1954.0, "ووجهُ الشاهد منه هو أنّ النبيّ صلى الله عليه وسلم بيّن لهم معنى الهزّ باعتبار اللغة،"], [1965.0, "مع أنهم يفهمونه ولو لم يُشِر <span class=\"q\">؟ 32:45<\/span>،"], [1970.0, "ولكن لتأكيد إرادة المعنى هزّ النبيُّ صلى الله عليه وسلم يديه."], [1976.0, "فكأنه يقول: كما أنّ ما ترونه أمامكم هو الهزُّ المنسوب إلى المخلوق حقيقةً،"], [1985.0, "فأنا أريد بالكلام الذي سمعتموه الهزَّ الذي يليق بالله عز وجل."], [1992.0, "فهذا الهزّ يقطع دابرَ التأويل،"], [1995.0, "ودابرَ التحريف والتعطيل، ويؤكّد على إرادة الحقيقة."]], "tr": [[1954.0, "Buradaki delil yönü şudur: Peygamber sallallâhu aleyhi ve sellem onlara sallamanın manasını dil itibarıyla açıklamıştır;"], [1962.6, "oysa o işaret etmeseydi <span class=\"q\">؟<\/span> de bunu anlarlardı."], [1968.1, "Fakat mananın murad edildiğini teyit etmek için Peygamber sallallâhu aleyhi ve sellem ellerini salladı."], [1976.0, "Sanki şöyle diyordu: Önünüzde gördüğünüz şey hakikaten mahlûka nispet edilen sallama olduğu gibi, işittiğiniz sözle de Allah Azze ve Celle'ye yakışan sallamayı kastediyorum."], [1990.5, "Bu sallama, te'vilin kökünü, tahrif ve ta'tilin kökünü keser ve hakikatin murad edildiğini teyit eder."]]}, {"reader": false, "ar": [[2000.0, "فمن أفعاله عز وجل هذا الهزُّ الذي سيكون يوم القيامة،"], [2007.0, "وهو معلومُ المعنى، ولكن مجهولُ الكيف."], [2012.0, "فحركةُ النبيّ ـ فهزُّ النبيّ صلى الله عليه وسلم ـ دليلٌ وتأكيدٌ أنّ صفات الله معلومة، معلومةُ المعنى."]], "tr": [[2000.0, "O Azze ve Celle'nin fiillerinden biri, kıyamet günü olacak bu sallamadır;"], [2007.7, "manası bilinir, fakat keyfiyeti meçhuldür."], [2012.0, "Peygamber'in hareketi —Peygamber sallallâhu aleyhi ve sellem'in sallaması— Allah'ın sıfatlarının bilindiğine, manasının bilindiğine bir delil ve teyittir."]]}]}, {"ts": "33:43", "title": "4. Külliye (devam): Kulak ve göze işaret hadisi; \"Rabbimiz güler mi?\" hadisi", "paras": [{"reader": false, "ar": [[2023.0, "ومنها في «السنن»: أنّ النبيّ صلى الله عليه وسلم لمّا نزل قولُ الله عز وجل:"], [2032.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ نِعِمَّا يَعِظُكُم بِهِ ۗ إِنَّ اللَّهَ كَانَ سَمِيعًا بَصِيرًا﴾<\/span> <span class=\"ref\">[النساء: ٥٨]<\/span>،"], [2041.0, "فوضع إبهامَه على أُذنه،"], [2045.0, "وسبّابتَه على عينه، مع أنه لو لم يفعل ذلك لفهم السامعون العربُ معنى السمع والبصر،"], [2056.0, "وهو أنّ السمع إدراكُ المسموع،"], [2059.0, "والبصر رؤيةُ الأشياء. لكن هذه الإشارة من النبيّ صلى الله عليه وسلم تقطع دابرَ التحريف والتعطيل والتأويل."]], "tr": [[2023.0, "Bunlardan biri de \"Sünen\"dedir: Allah Azze ve Celle'nin <span class=\"ayah\">﴿Şüphesiz Allah size ne güzel öğüt veriyor! Şüphesiz Allah işitendir, görendir﴾<\/span> [Nisâ 58] sözü indiğinde Peygamber sallallâhu aleyhi ve sellem başparmağını kulağının üzerine, şehadet parmağını da gözünün üzerine koydu."], [2062.0, "Oysa bunu yapmasaydı da Arap dinleyiciler işitmenin ve görmenin manasını anlarlardı:"], [2063.8, "İşitme, işitilen şeyi idrak etmektir;"], [2064.7, "görme de eşyayı görmektir. Fakat Peygamber sallallâhu aleyhi ve sellem'in bu işareti tahrifin, ta'tilin ve te'vilin kökünü keser."]]}, {"reader": false, "ar": [[2069.0, "فكما أنّ هذا هو سمعُ المخلوق حقيقةً،"], [2073.0, "وهذا بصرُ المخلوق حقيقةً،"], [2075.0, "فأنا أريد حقيقةَ سمع الله،"], [2078.0, "وحقيقةَ بصر الله، على الوجه اللائق بالله عز وجل."], [2083.0, "فهي إشارةُ تأكيد الحقيقة،"], [2087.0, "وليست إشارةَ التكييف أو التمثيل."], [2091.0, "وهذا يدلّك على صحّة هذه الكلّيّة،"], [2096.0, "من أنّ نصوص الصفات معلومةُ المعنى،"], [2100.7, "وأننا نفهمها على مقتضى دلالة اللسان العربيّ."]], "tr": [[2069.0, "(Sanki şöyle diyor:) Bu, hakikaten mahlûkun işitmesi ve bu, hakikaten mahlûkun görmesi olduğu gibi, ben de Allah'ın işitmesinin hakikatini ve Allah'ın görmesinin hakikatini, Allah Azze ve Celle'ye yakışan şekilde kastediyorum."], [2083.0, "Bu, hakikati teyit işaretidir; tekyîf veya temsil işareti değildir."], [2091.0, "Bu da sana bu külliyenin doğruluğunu gösterir:"], [2096.0, "Sıfat naslarının manası bilinir ve biz onları Arap dilinin delaletinin gerektirdiği üzere anlarız."]]}, {"reader": false, "ar": [[2107.0, "ومنها: أنّ النبيّ صلى الله عليه وسلم ذكر شيئًا من الأشياء،"], [2118.0, "وقال: «ثم فيضحك ربُّنا عز وجل» ـ يقول النبيّ صلى الله عليه وسلم:"], [2124.0, "«فيضحك الله تبارك وتعالى» ـ فقال رجلٌ من الصحابة:"], [2131.3, "أوَيضحك ربُّنا؟ قال: «نعم»."], [2136.0, "قال: لن نعدَم الخيرَ من ربٍّ يضحك."], [2140.5, "وهذا الصحابيّ ـ والعربيّ ـ وهذا الصحابيّ عربيُّ اللسان،"], [2145.0, "عربيُّ الفهم، علم معنى الضحك،"], [2150.0, "وأقرّه النبيُّ صلى الله عليه وسلم على هذا الفهم،"], [2156.0, "ممّا يدلّ على أنّ نصوص الصفات معلومةُ المعنى عند أهل السنة والجماعة."]], "tr": [[2107.0, "Bunlardan biri de şudur: Peygamber sallallâhu aleyhi ve sellem bir şey zikretti ve \"Sonra Rabbimiz Azze ve Celle güler\" buyurdu —Peygamber sallallâhu aleyhi ve sellem \"Allah Tebâreke ve Teâlâ güler\" buyuruyor—."], [2124.0, "Sahabeden bir adam \"Rabbimiz güler mi?\" dedi."], [2131.3, "\"Evet\" buyurdu. O da \"Gülen bir Rabden hayır görmekten mahrum kalmayız\" dedi."], [2140.5, "Bu sahabi —ve Arap— bu sahabi dili Arapça, anlayışı Arapça biriydi;"], [2146.9, "gülmenin manasını bildi ve Peygamber sallallâhu aleyhi ve sellem onu bu anlayışı üzerine onayladı."], [2156.6, "Bu da sıfat naslarının Ehl-i Sünnet ve'l-Cemaat nezdinde manasının bilindiğini gösterir."]]}, {"reader": false, "ar": [[2163.0, "ومنها ما ذكرتُه لكم في كلّيّة أنّ نصوص الصفات محكمةٌ باعتبار المعنى،"], [2173.0, "وهي أنّ تلك النصوص كان النبيُّ صلى الله عليه وسلم يتلوها على الصحابة ويسكت،"], [2180.0, "ويكتفي بتلاوتها، ولا يدخل في شيءٍ من تفسير معانيها."], [2184.0, "وكان الصحابة يتلقّفون ويستمعون هذه النصوص،"], [2191.0, "ويسكتون، ولا يتكلّفون سؤالَ النبيّ صلى الله عليه وسلم عن شيءٍ من معانيها؛"], [2198.0, "ممّا يدلّ على أنه إنما أراد بها ما يفهمونه،"], [2204.0, "وهم إنما حملهم على السكوت معرفتُهم بأنه لا يُراد بها إلا ما يفهمونه من لسانهم العربيّ."], [2214.0, "وهذا كلُّه دليلٌ على صحّة هذه الكلّيّة،"], [2219.0, "بأنّ نصوص الصفات معلومةُ المعنى."]], "tr": [[2163.0, "Bunlardan biri de sıfat naslarının mana itibarıyla muhkem olduğu külliyesinde size zikrettiğim şeydir:"], [2174.0, "Peygamber sallallâhu aleyhi ve sellem bu nasları sahabeye okur ve susardı;"], [2180.4, "onları okumakla yetinir, manalarının tefsirine hiç girmezdi."], [2184.0, "Sahabe de bu nasları kapar, dinler ve susarlardı;"], [2192.1, "Peygamber sallallâhu aleyhi ve sellem'e manalarından bir şeyi sormaya zahmet etmezlerdi."], [2198.0, "Bu da onun bunlarla ancak onların anladığı şeyi kastettiğini gösterir."], [2204.8, "Onları susmaya sevk eden de, bunlarla ancak Arap dillerinden anladıkları şeyin kastedildiğini bilmeleriydi."], [2214.0, "Bütün bunlar, sıfat naslarının manasının bilindiğine dair bu külliyenin doğruluğunun delilidir."]]}]}, {"ts": "37:04", "title": "4. Külliye (devam): Vahiy hidayet için indi; manası kastedilmeyen hitap teşvişe yol açar", "paras": [{"reader": false, "ar": [[2224.0, "ومنها: أنّ الله عز وجل إنما أنزل وحيَه ـ كتابًا وسنّةً ـ وبعث رسولَه ليهديَ أهل الأرض لا ليُضلّهم،"], [2237.4, "وليُبصّرهم من العمى لا ليُعميَ أبصارَ قلوبهم،"], [2245.0, "وليبيّن لهم الحقّ لا ليُلبّسه عليهم."], [2253.0, "فلو أنه خاطبنا بلسانٍ له مدلول،"], [2258.0, "وكان هو ـ إذ خاطبنا به ـ لا يريد مدلولَه،"], [2264.0, "والناسُ فهموا المدلول، والشارعُ لا يريد هذا المدلول،"], [2272.9, "وسكت ولم يبيّن أنه لا يريد هذا المدلول،"], [2277.0, "فبناءً على هذا الفهم المغلوط لم يزدد الناسُ بالرسالة وبالقرآن وبالسنة إلا بُعدًا عن الله لا قُربًا،"], [2289.0, "وإلا ضلالًا لا هداية،"], [2292.0, "وإلا انحرافًا عن طريق الحقّ والصراط المستقيم لا التزامًا واستقامةً عليه."], [2299.0, "أوَليس كذلك؟ الجواب: بلى."]], "tr": [[2224.0, "Bunlardan biri de şudur: Allah Azze ve Celle vahyini —Kitap ve Sünnet olarak— indirmiş ve Resûlü'nü, yeryüzü ehlini saptırmak için değil hidayete erdirmek için, kalplerinin gözlerini kör etmek için değil onları körlükten kurtarıp basiret sahibi kılmak için, hakkı onlara karıştırmak için değil açıklamak için göndermiştir."], [2253.0, "Eğer bize belli bir delaleti olan bir dille hitap etse ve bize onunla hitap ederken onun delaletini kastetmese;"], [2270.0, "insanlar o delaleti anlasa, Şâri' ise bu delaleti kastetmese ve susup bu delaleti kastetmediğini açıklamasa;"], [2277.8, "bu yanlış anlayışa göre insanlar risaletle, Kur'an'la ve Sünnet'le Allah'a yakınlık değil sadece uzaklık, hidayet değil sadece dalâlet, hak yolunda ve sırât-ı müstakîmde sebat ve istikamet değil sadece sapma kazanmış olurlardı."], [2299.0, "Öyle değil mi? Cevap: Evet, öyle."]]}, {"reader": false, "ar": [[2302.0, "بل إنّ الواحد منا يستنكر فيما لو سمع متكلّمًا يتكلّم بلغةٍ لها مدلولٌ معيّن،"], [2311.0, "ثم لمّا فهم السامعُ مدلولَها عاتبه المتكلّم وقال:"], [2316.3, "أنا لم أكن أريد هذا المدلول؛"], [2318.0, "فسيستنكر الناسُ كلامَه ومعاتبتَه بقولهم:"], [2322.0, "كيف تخاطبنا بلغةٍ لها مدلول وأنت لا تريد حقيقةَ مدلولها؟"], [2328.0, "فإذا كان ذلك مستقبَحًا مستبشَعًا ممجوجًا في واقع الناس،"], [2338.0, "فكيف يُتصوَّر في حقّ الله عز وجل؟"]], "tr": [[2302.0, "Hatta birimiz, belli bir delaleti olan bir dille konuşan birini işitse, sonra dinleyen o delaleti anladığında konuşan onu kınayıp \"Ben bu delaleti kastetmiyordum\" dese, bunu yadırgar."], [2316.3, "İnsanlar onun sözünü ve kınamasını yadırgayıp \"Bize delaleti olan bir dille nasıl hitap edersin de onun delaletinin hakikatini kastetmezsin?\" derler."], [2328.0, "Bu, insanların gerçek hayatında çirkin, iğrenç ve itici görülüyorsa, Allah Azze ve Celle hakkında nasıl düşünülebilir?"]]}, {"reader": false, "ar": [[2340.0, "فإنّ الله وصف كتابه بأنه نور،"], [2344.0, "وأنه هدى، وأنه فرقان،"], [2347.0, "وأنه روح، وأنه بيان."], [2351.0, "ففهمُ كثيرٍ من أهل البدع أنّ معاني الصفات غيرُ معلومة،"], [2361.0, "أو أنه لا يُراد بها ظاهرُها،"], [2364.0, "ينسف كلَّ هذه الأوصاف للقرآن والسنة،"], [2368.0, "ولعلّكم تأمّلتم ذلك. والمخرجُ من ذلك هو أن نقرّر ما قرّره أهلُ السنة والجماعة في هذه الكلّيّة،"], [2379.0, "من أنّ نصوص الصفات معلومة، معلومةُ المعنى."]], "tr": [[2340.0, "Çünkü Allah Kitabı'nı nur, hidayet, furkan, ruh ve beyan olmakla nitelemiştir."], [2351.0, "Bid'at ehlinin çoğunun, sıfatların manalarının bilinmediği veya onlarla zahirlerinin kastedilmediği şeklindeki anlayışı, Kur'an ve Sünnet'in bütün bu vasıflarını yerle bir eder;"], [2371.0, "belki bunu düşünmüşsünüzdür. Bundan çıkış yolu, Ehl-i Sünnet ve'l-Cemaat'in bu külliyede takrir ettiğini takrir etmektir:"], [2379.6, "Sıfat naslarının manası bilinir, manası bilinir."]]}, {"reader": false, "ar": [[2384.0, "ومنها: أنّ الله إنما أنزل كتابَه وسنّةَ نبيّه،"], [2397.0, "وأرسل رسولَه، ليُعرّفنا بنفسه حتى نعبده."], [2405.0, "أوَليس كذلك؟ الجواب: بلى."], [2408.0, "فإذا كنّا نقول بأنّ طريق معرفة الله لا يُعلم معناه،"], [2417.0, "فكيف إذًا سنعرف ربَّنا؟"], [2421.0, "إذا كنّا لا نعرف معنى الاستواء،"], [2424.8, "لا نعرف معنى العلوّ،"], [2427.3, "لا نعرف معنى القدرة،"], [2429.9, "لا نعرف معنى القوّة،"], [2432.4, "لا نعرف معنى النزول،"], [2434.9, "لا نعلم معنى السمع،"], [2437.5, "لا نعلم معنى البصر،"], [2443.0, "فإذًا ما فائدةُ إنزال ذلك إذا كان الطريق إلى معرفته قد انقطع بالقول بأنّ معانيها غيرُ مرادة؟"]], "tr": [[2384.0, "Bunlardan biri de şudur: Allah Kitabı'nı ve Peygamberi'nin sünnetini indirmiş ve Resûlü'nü, kendisini bize tanıtmak için göndermiştir ki O'na ibadet edelim."], [2407.2, "Öyle değil mi? Cevap: Evet, öyle."], [2421.0, "Eğer Allah'ı tanımanın yolunun manasının bilinmediğini söylersek, o hâlde Rabbimizi nasıl tanıyacağız?"], [2428.6, "İstivânın manasını bilmiyorsak, uluvvün manasını bilmiyorsak, kudretin manasını bilmiyorsak, kuvvetin manasını bilmiyorsak, nüzulün manasını bilmiyorsak, işitmenin manasını bilmiyorsak, görmenin manasını bilmiyorsak, o hâlde, manalarının kastedilmediği sözüyle O'nu tanıma yolu kesilmişse, bunları indirmenin faydası nedir?"]]}]}, {"ts": "40:53", "title": "4. Külliye (devam): Mana tefvîzi mezhebinin bâtıllığı", "paras": [{"reader": false, "ar": [[2453.0, "فحقيقةُ مذهب المفوّضة في المعاني أنه مذهبٌ إبليسيّ،"], [2461.0, "يريد قطعَ القلوب عن معرفة ربّهم عز وجل."], [2466.0, "والله العظيم إنني صادقٌ في هذا،"], [2470.0, "والله يشهد عليّ وملائكتُه أنني صادقٌ أنّ إبليس نفث في رُوع هؤلاء المفوّضة بهذا المذهب الخبيث،"], [2480.2, "ليقطع الطريقَ الأعظم في معرفة الله عز وجل،"], [2485.2, "وهو معرفتُه بمقتضى أسمائه وصفاته."]], "tr": [[2453.0, "Manalarda tefvîz ehlinin (Mufavvıda'nın) mezhebinin hakikati, kalpleri Rablerini Azze ve Celle'yi tanımaktan koparmak isteyen iblisçe bir mezhep olmasıdır."], [2466.0, "Yüce Allah'a yemin ederim ki bu konuda doğru söylüyorum."], [2470.6, "Allah ve melekleri şahittir ki doğru söylüyorum:"], [2474.4, "İblis bu habis mezhebi bu tefvîzcilerin gönlüne üfledi ki Allah Azze ve Celle'yi tanımanın en büyük yolunu, yani O'nu isimlerinin ve sıfatlarının gerektirdiği şekilde tanımayı kessin."]]}, {"reader": false, "ar": [[2491.0, "فإذا كنتَ تقول بأنّ الصفات نصوصٌ تُقرأ حروفُها وألفاظُها كما تقرأ لغةً أجنبيّةً تُتقن حروفَها ولا تفقه معناها،"], [2507.0, "فإذًا كيف تتعرّف القلوب على الله عز وجل؟"], [2510.0, "فحقيقةُ مذهب المفوّضة هو قطعُ أعظم طريقٍ يعرّفنا بالله عز وجل،"], [2519.0, "وهو معرفتُه عن طريق أسمائه وصفاته."], [2524.0, "ولا جَرَمَ أنه مذهبٌ باطل،"], [2526.0, "وأُقسم بالله العليّ العظيم أيمانًا كثيرةً بأنه مذهبٌ باطل،"], [2533.0, "لأنّ نتائجه باطلة، وفسادُ اللوازم دليلٌ على فساد الملزوم،"], [2542.0, "فسادُ اللوازم دليلٌ على فساد الملزوم. والله أعلم."]], "tr": [[2491.0, "Eğer sıfatların, harflerini iyi bildiğin ama manasını anlamadığın yabancı bir dili okuduğun gibi, harfleri ve lafızları okunan naslar olduğunu söylüyorsan, o hâlde kalpler Allah Azze ve Celle'yi nasıl tanıyacak?"], [2510.0, "Tefvîz ehlinin mezhebinin hakikati, bize Allah Azze ve Celle'yi tanıtan en büyük yolu, yani O'nu isimleri ve sıfatları yoluyla tanımayı kesmektir."], [2520.5, "Şüphesiz ki bu bâtıl bir mezheptir."], [2524.0, "Yüce ve azametli Allah'a pek çok yeminle yemin ederim ki bu bâtıl bir mezheptir;"], [2531.0, "çünkü sonuçları bâtıldır. Lâzımların (sonuçların) fesadı, melzûmun (onları gerektiren şeyin) fesadına delildir;"], [2542.0, "lâzımların fesadı, melzûmun fesadına delildir. Allah en iyisini bilir."]]}]}, {"ts": "42:28", "title": "5. Külliye: Bütün sıfat nasları, Allah'a yakışan hakikatlerine hamledilir", "paras": [{"reader": false, "ar": [[2548.0, "ومن الكلّيّات أيضًا: <b>كلُّ نصوص الصفات محمولةٌ على حقائقها اللائقة بالله عز وجل.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ نصوص الصفات محمولةٌ على حقائقها اللائقة بالله تعالى.<\/b>"]], "tr": [[2548.0, "Külliyelerden biri de şudur: 5."], [2550.7, "külliye: Bütün sıfat nasları, Allah Azze ve Celle'ye yakışan hakikatlerine hamledilir. (Tekrar ediyor.) Bütün sıfat nasları, Allah Teâlâ'ya yakışan hakikatlerine hamledilir."]]}, {"reader": false, "ar": [[2570.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرِّر في القواعد أنّ الأصل في الكلام الحقيقة،"], [2588.0, "فلا يجوز أن ننتقل من حقيقة الكلام إلى مجازه إلا بناقلٍ يوجب ذلك."], [2595.0, "وهذه القاعدة من أعظم القواعد في فهم كلام الله وسنّة رسوله ـ وكلام رسوله صلى الله عليه وسلم ـ وهي أننا نحمل كلَّ ما خُوطبنا به على حقيقته المتقرِّرة في اللسان العربيّ،"], [2612.0, "فلا ننتقل من حقيقة شيءٍ من هذه النصوص إلى مجازاتها إلا إذا ورد ناقلٌ ينقلنا،"], [2626.0, "وكان ذلك الناقلُ معتمَدًا عند أهل السنة والجماعة."]], "tr": [[2570.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, kaidelerde yerleşik olan şudur:"], [2585.9, "Sözde asıl olan hakikattir; bunu gerektiren bir nakledici (delil) olmadıkça sözün hakikatinden mecazına geçmemiz caiz değildir."], [2595.0, "Bu kaide, Allah'ın kelâmını ve Resûlü'nün sünnetini —Resûlü sallallâhu aleyhi ve sellem'in sözünü— anlamadaki en büyük kaidelerdendir."], [2603.5, "O da şudur: Bize hitap edilen her şeyi Arap dilinde yerleşik olan hakikatine hamlederiz."], [2612.0, "Bu naslardan herhangi birinin hakikatinden mecazlarına, ancak bizi (oraya) nakleden bir delil gelirse ve o nakledici Ehl-i Sünnet ve'l-Cemaat nezdinde muteber olursa geçeriz."]]}, {"reader": false, "ar": [[2629.0, "وعلى ذلك نصوصُ السلف الصالح تؤكّد صحّةَ هذه الكلّيّة."], [2634.0, "قال الإمام الطبريّ رحمه الله تعالى:"], [2638.0, "«فإن قال لنا قائل: فما الصواب في معاني هذه الصفات التي ذكرتَ، وجاء ببعضها كتابُ الله عز وجل ووحيُه، وجاء ببعضها رسولُ الله صلى الله عليه وسلم؟ قيل: الصوابُ من هذا القول عندنا أن نُثبت حقائقها على ما نعرف، من جهة الإثبات ونفي التشبيه، كما نفى عن نفسه جلّ ثناؤه فقال: <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ ۖ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>»."], [2675.0, "انتهى كلامُه. والشاهدُ منه أنه حمل هذه النصوص على حقائقها <span class=\"q\">؟ 44:35<\/span>،"], [2681.7, "ونسبه لأهل السنة والجماعة."]], "tr": [[2629.0, "Selef-i sâlihînin sözleri de bu külliyenin doğruluğunu bu şekilde teyit eder."], [2634.0, "İmam Taberî —Allah ona rahmet etsin— şöyle demiştir:"], [2638.0, "\"Biri bize 'Zikrettiğin, bir kısmını Allah Azze ve Celle'nin Kitabı ve vahyinin, bir kısmını da Resûlullah sallallâhu aleyhi ve sellem'in getirdiği bu sıfatların manalarında doğru olan nedir?' derse, ona şöyle denir:"], [2657.0, "Bu hususta bize göre doğru olan, onların hakikatlerini bildiğimiz şekilde, isbat ve teşbihi nefyetme yönünden isbat etmemizdir;"], [2669.6, "nitekim O —senası yüce olsun— kendisinden (teşbihi) nefyederek şöyle buyurmuştur:"], [2675.0, "<span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur. O, işitendir, görendir﴾<\/span> [Şûrâ 11].\" —Sözü burada bitti."], [2679.0, "Buradaki delil, onun bu nasları hakikatlerine <span class=\"q\">؟<\/span> hamletmesi ve bunu Ehl-i Sünnet ve'l-Cemaat'e nispet etmesidir."]]}, {"reader": false, "ar": [[2685.0, "وقال الإمام أبو بكرٍ الكَلاباذيّ رحمه الله تعالى،"], [2690.6, "والمتوفّى سنة ٣٨٤، قال: «أُجمِع على أنّ لله صفاتٍ على الحقيقة هو بها موصوف، من العلم والقدرة والقوّة والعزّ والحلم والحكمة والكبرياء والجبروت والقِدَم والحياة والإرادة والمشيئة والكلام، وأنّ له سمعًا وبصرًا ووجهًا ويدًا على الحقيقة، ليس كالأسماع والأبصار والأيدي والوجوه»."], [2734.0, "انتهى كلامُه رحمه الله."]], "tr": [[2685.0, "İmam Ebû Bekir el-Kelâbâzî —Allah ona rahmet etsin— ki 384 yılında vefat etmiştir, şöyle demiştir:"], [2697.7, "\"Allah'ın, hakikat üzere kendisiyle vasıflandığı sıfatları olduğu üzerinde icmâ edilmiştir:"], [2706.0, "İlim, kudret, kuvvet, izzet, hilim, hikmet, kibriyâ, ceberût, kıdem, hayat, irade, meşîet ve kelâm gibi."], [2724.4, "Yine O'nun hakikat üzere işitmesi, görmesi, yüzü ve eli vardır;"], [2734.0, "(ama bunlar mahlûkatın) işitmeleri, görmeleri, elleri ve yüzleri gibi değildir.\" —Sözü burada bitti, Allah ona rahmet etsin."]]}]}, {"ts": "45:36", "title": "5. Külliye (devam): İbn Abdilberr ve İbnü'l-Kayyim'in sözleri; dersin sonu", "paras": [{"reader": false, "ar": [[2736.0, "وقال الإمام ابن عبد البرّ رحمه الله تعالى،"], [2741.0, "والمتوفّى سنة ٤٦٣، قال: «أهلُ السنة مجمعون على الإقرار بالصفات الواردة كلِّها في القرآن والسنة ـ انتبه ـ والإيمانِ بها، وحملِها على الحقيقة لا على المجاز، إلا أنهم لا يكيّفون شيئًا من ذلك، ولا يحدّون فيه صفةً محصورة». انتهى كلامُه."]], "tr": [[2736.0, "İmam İbn Abdilberr —Allah ona rahmet etsin— ki 463 yılında vefat etmiştir, şöyle demiştir:"], [2744.7, "\"Ehl-i Sünnet, Kur'an'da ve Sünnet'te varid olan sıfatların tamamını ikrar etmek —dikkat et—, onlara iman etmek ve onları mecaza değil hakikate hamletmek üzerinde icmâ etmiştir."], [2761.0, "Ancak onlar bunlardan hiçbirine keyfiyet biçmezler ve onda sınırlı bir sıfat tayin etmezler.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[2768.0, "وقال في موضعٍ آخر:"], [2770.8, "«ومن حقّ الكلام أن يُحمل على حقيقته حتى تتّفق الأمّة أنه أُريد به المجاز، إذ لا سبيلَ إلى اتّباع ما أُنزل إلينا من ربّنا إلا على ذلك. وإنما يُوجَّه كلامُ الله عز وجل إلى الأشهر والأظهر من وجوهه، ما لم يمنع من ذلك ما يجب له التسليم. ولو ساغ ادّعاءُ المجاز لكلّ مدّعٍ ما ثبت شيءٌ من العبارات. وجلّ الله عز وجل عن أن يخاطب إلا بما تفهمه العرب في معهود مخاطباتها، ممّا يصحّ معناه عند السامعين». انتهى كلامُه."]], "tr": [[2768.0, "Başka bir yerde de şöyle demiştir:"], [2768.6, "\"Sözün hakkı, ümmet onunla mecazın kastedildiği üzerinde ittifak edinceye kadar hakikatine hamledilmesidir."], [2769.4, "Çünkü Rabbimizden bize indirilene uymanın bundan başka bir yolu yoktur."], [2770.8, "Allah Azze ve Celle'nin kelâmı, teslim olunması vâcip olan bir şey buna engel olmadıkça, vecihlerinin en meşhuruna ve en zahirine yöneltilir."], [2789.3, "Eğer her iddiacı için mecaz iddiası caiz olsaydı, ifadelerden hiçbir şey sabit olmazdı."], [2798.0, "Allah Azze ve Celle, Arapların alışılmış hitaplarında anladıkları ve dinleyenler nezdinde manası doğru olan şeyden başkasıyla hitap etmekten yücedir.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[2817.0, "وقال الإمام ابن القيّم رحمه الله في نقلٍ مطوَّلٍ قليلًا،"], [2823.0, "وهو يتكلّم عن الصحابة،"], [2825.8, "ويبيّن أنهم تنازعوا في الأحكام الفقهيّة كثيرًا،"], [2831.0, "ولكن لم يتنازعوا في باب الصفات،"], [2834.0, "فقال: «ولكن ـ بحمد الله ـ لم يتنازعوا في مسألةٍ واحدةٍ من مسائل الأسماء والصفات والأفعال، بل كلُّهم على إثبات ما نطق به الكتابُ والسنة، كلمةً واحدة، من أوّلهم إلى آخرهم؛ لم يَسُوموها تأويلًا، ولم يحرّفوها عن مواضعها تبديلًا، ولم يُبدوا لشيءٍ منها إبطالًا، ولا ضربوا لها أمثالًا، ولم يدفعوا في صدورها وأعجازها، ولم يقل أحدٌ منهم: يجب صرفُها عن حقائقها، ويجب حملُها على مجازها."]], "tr": [[2817.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— biraz uzunca bir nakilde, sahabeden bahsederken ve onların fıkhî hükümlerde çokça tartıştıklarını, fakat sıfatlar babında tartışmadıklarını açıklarken şöyle demiştir:"], [2828.5, "\"Fakat Allah'a hamdolsun, isimler, sıfatlar ve fiiller meselelerinden tek bir meselede bile tartışmadılar."], [2834.6, "Bilakis hepsi, ilkinden sonuncusuna kadar tek bir söz olarak Kitap ve Sünnet'in dile getirdiğini isbat etmek üzereydiler."], [2846.7, "Onlara te'vil yüklemediler, onları yerlerinden değiştirerek tahrif etmediler, onlardan hiçbirini iptal etmeye kalkışmadılar, onlara misaller getirmediler, onların başlarını ve sonlarını itip reddetmediler."], [2865.0, "Hiçbiri 'Onları hakikatlerinden çevirmek ve mecazlarına hamletmek vâciptir' demedi."]]}, {"reader": false, "ar": [[2871.0, "بل تلقَّوها بالقبول والتسليم،"], [2874.0, "وقابلوها بالإيمان والتعظيم، وجعلوا الأمرَ فيها كلِّها أمرًا واحدًا،"], [2881.0, "وأجرَوها على سَنَنٍ واحد،"], [2884.0, "ولم يفعلوا كما فعل أهلُ الأهواء والبدع حيث جعلوها عِضِين،"], [2889.0, "وأقرّوا ببعضها وأنكروا بعضها من غير فرقانٍ مبين». انتهى كلامُه."]], "tr": [[2871.0, "Bilakis onları kabul ve teslimiyetle aldılar, iman ve tazimle karşıladılar;"], [2877.0, "hepsindeki işi tek bir iş kıldılar ve onları tek bir yol üzerinde yürüttüler."], [2883.2, "Heva ve bid'at ehlinin yaptığı gibi yapmadılar;"], [2885.7, "onlar onları parça parça ettiler, açık bir ayırıcı (delil) olmaksızın bir kısmını ikrar edip bir kısmını inkâr ettiler.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[2898.0, "وبه يتبيّن صحّةُ هذه الكلّيّة وعراقتُها في مذهب أهل السنة والجماعة."], [2904.0, "وأظنّ أنني أطلتُ عليكم،"], [2906.0, "ولعلّنا نكتفي بهذا القدر."], [2908.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[2898.0, "Bununla bu külliyenin doğruluğu ve Ehl-i Sünnet ve'l-Cemaat mezhebindeki köklülüğü ortaya çıkar."], [2904.0, "Zannederim sizi uzun tuttum; belki bu kadarıyla yetiniriz."], [2908.0, "Allah en yüce olan ve en iyi bilendir."], [2909.4, "Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
