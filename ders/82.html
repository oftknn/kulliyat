<script>
const D={"no": 82, "vid": "Irs-WagUUn4", "title_ar": "الدرس (٨٢) من شرح كليات العقيدة — كليات باب الإيمان: مرجئة الفقهاء، ومتى يكون الخلاف معهم لفظيًّا أو حقيقيًّا، والاستثناء في الإيمان", "title_tr": "Şerhu Külliyyâti'l-Akîde — 82. Ders: İman Babının Külliyeleri (Fukahâ Mürciesi; Onlarla İhtilafın Ne Zaman Lafzî, Ne Zaman Hakiki Olduğu; İmanda İstisna)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: İmanı kalbin itikadı ve dilin sözüyle sınırlayan herkes fukahâ Mürciesindendir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.1, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.2, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.9, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [11.0, "لعلّنا نتكلّم في هذا المجلس العلميّ عن جُمَلٍ من الكلّيّات التي تتعلّق بمن يُسمّونهم بمُرجئة الفقهاء،"], [21.3, "وذلك سيكون في جُمَلٍ من الكلّيّات."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.6, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [11.0, "Belki bu ilim meclisinde, \"fukahâ Mürciesi\" diye adlandırdıkları kimselerle ilgili bir dizi külliyeden söz edeceğiz;"], [20.7, "bu da birkaç külliye hâlinde olacak."]]}, {"reader": false, "ar": [[27.0, "الكلّيّة الأولى: <b>كلُّ من قصر الإيمانَ على اعتقاد القلب وقولِ اللسان فمِن مُرجئة الفقهاء.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [36.0, "وقد تقدّم لنا في كلّيّةٍ أنّ كلَّ من أخرج العملَ عن دائرة الإيمان فإنه من المرجئة؛"], [61.0, "فمرجئةُ الفقهاء لا يخرجون عن هذا الوصف ـ أعني عن وصف الإرجاء ـ وذلك لأنهم يُخرجون العملَ عن دائرة الإيمان."], [73.0, "وبما أنّ الكلام عليهم يطول،"], [76.0, "فسيكون الكلامُ عليهم في جُمَلٍ من المسائل."]], "tr": [[27.0, "<b>1. külliye: İmanı kalbin itikadı ve dilin sözüyle sınırlayan herkes fukahâ Mürciesindendir.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [36.0, "Daha önce bir külliyede, ameli iman dairesinin dışına çıkaran herkesin Mürcieden olduğu geçmişti."], [61.0, "Fukahâ Mürciesi de bu vasfın —yani irca vasfının— dışına çıkmaz;"], [67.5, "çünkü onlar ameli iman dairesinin dışına çıkarırlar."], [73.0, "Onlar hakkındaki söz uzun olduğundan, onlar hakkında bir dizi mesele hâlinde konuşacağız."]]}, {"reader": false, "ar": [[79.0, "المسألة الأولى: إن قلتَ:"], [83.0, "مَن هم؟ فأقول: هم إحدى فِرَق المرجئة التي ظهرت في الكوفة في أواخر عهد الصحابة رضي الله تعالى عنهم،"], [93.0, "وهذا يُفيدك أنها من البدع القديمة."], [99.0, "وقد ظهرت على يد طائفةٍ من فقهاء أهل السنة والجماعة؛"], [106.0, "بمعنى أنّ مَن ابتدعها ليس ذا أصولٍ فاسدة،"], [113.0, "وإنما أصولُه صحيحة، ولكنّ الذي دعاه إلى هذا القول هو ما سيأتي إن شاء الله."]], "tr": [[79.0, "Birinci mesele: \"Onlar kimdir?\" dersen, derim ki:"], [84.4, "Onlar, sahâbe döneminin —Allah Teâlâ onlardan razı olsun— sonlarında Kûfe'de ortaya çıkan Mürcie fırkalarından biridir."], [92.2, "Bu da sana bunun eski bid'atlerden olduğunu gösterir."], [99.0, "Bu bid'at Ehl-i Sünnet ve'l-Cemaat fakihlerinden bir grubun eliyle ortaya çıkmıştır;"], [106.0, "yani onu ortaya çıkaran kimse bozuk usûl sahibi değildir, aksine usûlü sahihtir."], [117.5, "Fakat onu bu söze sevk eden şey, inşallah ileride gelecek olandır."]]}, {"reader": false, "ar": [[123.0, "فإن قلتَ: وما سببُ ظهورهم؟"], [130.0, "فأقول: سببُ ظهور الإرجاء كان عبارةً عن ردّةِ فعلٍ في مقابلة مذهب الخوارج؛"], [142.0, "فإنّ هذه الطائفة لمّا رأت الخوارجَ تحكم بالكفر على مرتكب الكبيرة،"], [149.0, "وتُكفِّر أهلَ الإسلام، وتستحلّ دماءهم،"], [152.6, "وتستبيح ديارهم وأموالهم، فعارضوا هذا المذهبَ الخارجيَّ بمذهبٍ يناقضه،"], [163.0, "فأخرجوا العملَ عن دائرة الإيمان حتى لا يُحكَم على أحدٍ بأنه كافر."], [170.0, "وهذا يدلّك على أنّ خروج هذا المذهب كان عبارةً عن ردّةِ فعلٍ حصلت في زمانهم،"], [178.0, "فأرادوا أن يعالجوها، ولكنّهم عالجوا الخطأ بخطأ، عالجوا الخطأ بخطأ."]], "tr": [[123.0, "\"Peki ortaya çıkışlarının sebebi nedir?\" dersen, derim ki:"], [132.0, "İrcanın ortaya çıkış sebebi, Hâricîler mezhebine karşı bir tepkiden ibaretti."], [142.0, "Bu grup, Hâricîlerin büyük günah işleyenin küfrüne hükmettiğini, İslâm ehlini tekfir ettiğini, onların kanlarını helâl saydığını, yurtlarını ve mallarını mubah gördüğünü görünce, bu Hâricî mezhebine onunla çelişen bir mezheple karşı çıktılar ve kimsenin kâfir olduğuna hükmedilmesin diye ameli iman dairesinin dışına çıkardılar."], [170.0, "Bu da sana gösterir ki bu mezhebin ortaya çıkışı, onların zamanında meydana gelen bir tepkiden ibaretti."], [176.9, "Onu tedavi etmek istediler, fakat hatayı hatayla tedavi ettiler; hatayı hatayla tedavi ettiler."]]}, {"reader": false, "ar": [[188.0, "ولذلك قال ابن تيميّة رحمه الله:"], [191.0, "«إنما أحدثه قومٌ قصدُهم جعلُ أهل القبلة كلِّهم مؤمنين ليسوا كفّارًا، قابلوا الخوارجَ والمعتزلةَ فصاروا في طرفٍ آخر»."], [204.0, "قلتُ: وكِلا طرفَي قصدِ الأمور ذميمُ."]], "tr": [[188.0, "Bu yüzden İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [191.0, "\"Bunu, maksatları bütün kıble ehlini kâfir değil mümin saymak olan bir topluluk ortaya çıkardı;"], [197.9, "Hâricîlere ve Mu'tezile'ye karşılık verdiler ve öbür uca düştüler.\" Derim ki:"], [204.0, "İşlerin orta yolunun iki ucu da kınanmıştır."]]}, {"reader": false, "ar": [[210.0, "فإن قلتَ: ولماذا سُمّوا بمرجئة الفقهاء؟"], [217.0, "بمعنى: أنهم لماذا لم يُطلَق عليهم اسمُ المرجئة هكذا،"], [223.0, "من غير تقييدٍ بقولنا:"], [225.4, "«الفقهاء»؟ فأقول: لأنّ إرجاءهم ليس كإرجاء مَن جاء بعدهم،"], [233.0, "والله عز وجل أمرنا أن نُعطي كلَّ ذي حقٍّ حقَّه،"], [239.0, "وأمرنا أن نقول كلمةَ القصد في الغضب والرضا،"], [244.0, "وأمرنا بأن لا نبخس الناسَ أشياءهم."], [248.0, "فلا هم الذين وافقوا أهلَ السنة والجماعة في إدخال الأعمال حتى يكونوا من أهل السنة المحضة،"], [257.0, "ولا هم الذين أخرجوا العملَ عن تأثيره باطنًا وظاهرًا حتى يكونوا كغُلاة المرجئة؛"], [269.0, "وإنما قالوا بقولٍ وسط،"], [271.7, "فيُنسَبون إلى أهل السنة باعتبار،"], [275.1, "ويُنسَبون إلى الإرجاء باعتبار."]], "tr": [[210.0, "\"Peki neden fukahâ Mürciesi diye adlandırıldılar?\" dersen —yani neden onlara \"fukahâ\" kaydı konmadan düz \"Mürcie\" adı verilmedi— derim ki:"], [225.4, "Çünkü onların ircası, kendilerinden sonra gelenlerin ircası gibi değildir."], [233.6, "Allah Azze ve Celle bize her hak sahibine hakkını vermemizi emretti;"], [241.5, "öfkede de rızada da ölçülü söz söylememizi emretti;"], [248.0, "insanların eşyasını eksik tutmamamızı emretti."], [250.2, "Onlar ne amelleri imana dahil etmekte Ehl-i Sünnet ve'l-Cemaat'e muvafakat edip saf Ehl-i Sünnet'ten olmuşlardır, ne de ameli bâtınen ve zahiren etkisinin dışına çıkarıp aşırı Mürcie gibi olmuşlardır."], [269.0, "Bilakis orta bir söz söylemişlerdir;"], [271.0, "bu yüzden bir itibarla Ehl-i Sünnet'e, bir itibarla da ircaya nispet edilirler."]]}, {"reader": false, "ar": [[279.0, "فلا هم من أهل السنة المحضة،"], [283.0, "لأنهم أخرجوا العملَ عن دائرة الإيمان؛"], [287.0, "ولا هم من المرجئة المحضة،"], [289.7, "لأنهم لا يزالون ـ مع إخراج العمل ـ يجعلون له شيئًا من التأثير في الدنيا والآخرة."], [296.0, "فهمتم هذا؟ فلذلك سُمّوا بمرجئة الفقهاء."]], "tr": [[279.0, "Onlar saf Ehl-i Sünnet'ten değildir, çünkü ameli iman dairesinin dışına çıkarmışlardır;"], [287.0, "saf Mürcieden de değildir, çünkü ameli dışarı çıkarmakla birlikte hâlâ ona dünyada ve ahirette bir miktar etki tanırlar."], [294.9, "Bunu anladınız mı? İşte bu yüzden fukahâ Mürciesi diye adlandırıldılar."]]}]}, {"ts": "05:03", "title": "1. Külliye (devam): İrcanın kıvılcımı ve fukahâ Mürciesine nispet edilen isimler", "paras": [{"reader": false, "ar": [[303.0, "وأيضًا لأنّ أصولهم التي انطلقوا منها ليست أصولًا بدعيّة،"], [310.0, "وإنما كانوا من أهل السنة المحضة؛"], [313.0, "ولكن لمّا رأوا آثارَ مذهب الخوارج والمعتزلة في الأمّة،"], [319.0, "أرادوا أن يكشفوا هذه الغُمّةَ عن الأمّة بإخراج العمل،"], [323.0, "فعالجوا الخطأ ـ كما ذكرتُ ـ بخطأٍ آخر."], [327.0, "وإرجاءُ مرجئة الفقهاء صار بَذرةً وشَرارةً ثارت بعدها ثورةُ الإرجاء العُظمى؛"], [344.0, "فهم كانوا سببًا في هذا الإرجاء الشنيع الذي جاء من بعدهم."]], "tr": [[303.0, "Bir de şu sebeple: Yola çıktıkları usûl bid'atçi usûl değildir;"], [310.5, "aksine onlar saf Ehl-i Sünnet'tendiler."], [313.0, "Fakat Hâricîler ve Mu'tezile mezhebinin ümmet içindeki etkilerini görünce, ameli dışarı çıkararak bu sıkıntıyı ümmetin üzerinden kaldırmak istediler;"], [322.1, "böylece —zikrettiğim gibi— hatayı başka bir hatayla tedavi ettiler."], [327.0, "Fukahâ Mürciesinin ircası, ardından büyük irca devriminin patlak verdiği bir tohum ve kıvılcım oldu."], [345.1, "Onlar, kendilerinden sonra gelen bu çirkin ircaya sebep olmuşlardır."]]}, {"reader": false, "ar": [[350.0, "فإنّ بدعتهم وإن لم تَكُ كبيرةً،"], [355.0, "لكنها كانت مبدأً لبدعة المرجئة التي هي من أعظم البدع الشنيعة في الإسلام؛"], [365.0, "فقد تطوّر الانحرافُ في الإرجاء إلى أن وصل إلى القول بأنّ الإيمان هو مطلقُ المعرفة،"], [372.6, "كما هو قولُ جَهْم."], [375.0, "فيكون إرجاءُ مرجئة الفقهاء كالشَّرارة،"], [381.0, "وإرجاءُ مَن بعدهم كالنار المضطرمة في عقيدة الأمّة."]], "tr": [[350.0, "Onların bid'ati büyük olmasa da, İslâm'daki en büyük çirkin bid'atlerden olan Mürcie bid'atinin başlangıcı olmuştur."], [365.0, "İrcadaki sapma gelişerek, Cehm'in sözünde olduğu gibi imanın mutlak bilgi/tanıma olduğu sözüne kadar varmıştır."], [372.0, "Böylece fukahâ Mürciesinin ircası kıvılcım gibi, onlardan sonrakilerin ircası ise ümmetin akîdesinde alevlenen ateş gibi olur."]]}, {"reader": false, "ar": [[388.0, "فإن قلتَ: سَمِّ لنا بعضَهم."], [394.0, "فأقول: لقد نصّ العلماء على جُمَلٍ من الأسماء ونسبوهم إلى مرجئة الفقهاء،"], [406.0, "وهم مجموعةٌ من التابعين والعلماء الذين لا يُشَكّ في علمهم،"], [413.0, "ولكن وقعوا في هذه البدعة،"], [415.2, "والمعصومُ مَن عصمه الله."], [417.0, "فمنهم: حمّاد بن أبي سليمان،"], [419.3, "شيخُ أبي حنيفة ـ رحم الله الجميع رحمةً واسعة ـ وقد كان فقيهَ الكوفة."], [426.0, "ومنهم: ذَرُّ بن عبد الله المُرْهِبيّ،"], [431.0, "وقد كان تابعيًّا ثقةً من أهل الكوفة أيضًا."], [438.0, "ومنهم: إبراهيم بن يزيد التيميّ،"], [441.0, "وقد كان إمامًا عابدًا فقيهًا من أهل الكوفة أيضًا."]], "tr": [[388.0, "\"Bize onlardan bazılarının adını ver\" dersen, derim ki:"], [394.0, "Âlimler bir dizi ismi açıkça belirtip onları fukahâ Mürciesine nispet etmişlerdir."], [405.2, "Bunlar, ilimlerinden şüphe edilmeyen bir grup tâbiî ve âlimdir;"], [412.4, "fakat bu bid'ate düşmüşlerdir. Masum olan, Allah'ın koruduğu kimsedir."], [417.0, "Onlardan biri, Ebû Hanîfe'nin hocası Hammâd b."], [420.2, "Ebî Süleymân'dır —Allah hepsine geniş rahmetiyle rahmet etsin—;"], [426.0, "o Kûfe'nin fakihiydi. Onlardan biri Zer b."], [430.0, "Abdillah el-Mürhibî'dir; o da Kûfe ehlinden güvenilir bir tâbiî idi."], [438.0, "Onlardan biri İbrâhîm b. Yezîd et-Teymî'dir;"], [441.0, "o da Kûfe ehlinden imam, âbid ve fakih biriydi."]]}, {"reader": false, "ar": [[448.0, "ومنهم: طَلْقُ بن حبيبٍ رحمه الله تعالى،"], [451.8, "وهو تابعيٌّ جليلٌ من أهل البصرة."], [455.0, "ومنهم كذلك: عمر بن قيس،"], [458.5, "وقد كان من ثقات الكوفيّين."], [463.0, "ومنهم: الإمام أبو حنيفة رحمه الله تعالى،"], [469.0, "وكذلك منهم صاحباه ـ أعني بهما:"], [472.2, "أبا يوسف ومحمّدَ بن الحسن ـ حيث نُسب إليهم أنهم يقولون بقول مرجئة الفقهاء. والأسماءُ كثيرة."]], "tr": [[448.0, "Onlardan biri Talk b. Habîb'dir —Allah Teâlâ ona rahmet etsin—;"], [452.3, "Basra ehlinden büyük bir tâbiîdir."], [455.0, "Yine onlardan biri Ömer b."], [458.5, "Kays'tır; o, Kûfelilerin güvenilir olanlarındandı."], [463.0, "Onlardan biri İmam Ebû Hanîfe'dir —Allah Teâlâ ona rahmet etsin—;"], [472.2, "aynı şekilde iki talebesi —yani Ebû Yûsuf ve Muhammed b."], [476.1, "el-Hasan— da onlardandır; zira onların fukahâ Mürciesinin sözünü söyledikleri nispet edilmiştir. İsimler çoktur."]]}, {"reader": false, "ar": [[490.0, "فإن قلتَ: وهل بدعتُهم ـ انتبهوا لي يا مَع… <span class=\"q\">؟ 08:10<\/span> ـ وهل بدعتُهم من البدع العظيمة أو المكفِّرة؟"], [504.0, "فأقول: يُجيب عن ذلك ابن تيميّة رحمه الله تعالى؛"], [509.0, "فإنه قال عن مرجئة الفقهاء:"], [512.0, "«كان أكثرُهم من أهل الكوفة، قالوا: إنّ الأعمال ليست من الإيمان، وكانت هذه البدعةُ أخفَّ البدع»."], [523.0, "انتهى كلامه. وقال أيضًا:"], [526.4, "«ولهذا لم يُكفِّر أحدٌ من السلف أحدًا من مرجئة الفقهاء، بل جعلوا هذا من بدع الأقوال والأفعال، لا من بدع العقائد». انتهى كلامه."]], "tr": [[490.0, "\"Peki onların bid'ati —beni dinleyin, ey (…) <span class=\"q\">؟<\/span>— onların bid'ati büyük bid'atlerden mi yoksa tekfir gerektiren bid'atlerden midir?\" dersen, derim ki:"], [504.0, "Buna İbn Teymiyye —Allah Teâlâ ona rahmet etsin— cevap veriyor."], [509.0, "O, fukahâ Mürciesi hakkında şöyle dedi:"], [512.0, "\"Onların çoğu Kûfe ehlindendi; amellerin imandan olmadığını söylediler."], [517.0, "Bu bid'at, bid'atlerin en hafifiydi.\" Sözü burada bitti."], [523.0, "Yine şöyle dedi: \"Bu yüzden selefin hiçbiri fukahâ Mürciesinden hiç kimseyi tekfir etmedi;"], [532.5, "aksine bunu akîde bid'atlerinden değil, söz ve fiil bid'atlerinden saydılar.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[541.0, "وقال أيضًا رحمه الله تعالى:"], [544.0, "«إنّ السلف والأئمّة اشتدّ إنكارُهم على هؤلاء وتبديعُهم وتغليظُ القول فيهم، ولم أعلم أحدًا منهم نطق بتكفيرهم، بل هم متّفقون على أنهم لا يُكفَّرون في ذلك. وقد نصّ أحمد وغيرُه من الأئمّة على عدم تكفير هؤلاء المرجئة. ومَن نقل عن أحمد أو غيره من الأئمّة تكفيرًا لهؤلاء، أو جعل هؤلاء من أهل البدع المتنازَع في تكفيرهم، فقد غلط غلطًا عظيمًا. والمحفوظُ عن أحمد وأمثاله من الأئمّة إنما هو تكفيرُ الجهميّة والمشبِّهة وأمثال هؤلاء، وأمّا المرجئة فلا يختلف قولُه في عدم تكفيرهم»."], [597.0, "انتهى كلامه رحمه الله."]], "tr": [[541.0, "Yine —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [541.6, "\"Selef ve imamlar bunlara karşı reddiyelerini, onları bid'atçi saymalarını ve onlar hakkında sert konuşmalarını şiddetlendirmişlerdir;"], [542.8, "fakat onlardan birinin bunları tekfir ettiğini bilmiyorum."], [544.0, "Aksine onlar, bu konuda bunların tekfir edilmeyeceğinde ittifak etmişlerdir."], [555.7, "Ahmed ve diğer imamlar bu Mürcienin tekfir edilmeyeceğini açıkça belirtmişlerdir."], [570.6, "Kim Ahmed'den veya diğer imamlardan bunları tekfir ettiğini nakleder ya da bunları tekfirleri ihtilaflı bid'at ehlinden sayarsa, büyük bir hata etmiştir."], [597.0, "Ahmed'den ve onun gibi imamlardan mahfuz (sabit) olan, ancak Cehmiyye'nin, Müşebbihe'nin ve onlar gibilerin tekfiridir."], [598.0, "Mürcieye gelince, onları tekfir etmeme konusunda sözü değişmez.\" Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[599.0, "والخلاصةُ من هذه الكلّيّة هي التعريفُ بمرجئة الفقهاء، وذكرُ نوع بدعتهم."]], "tr": [[599.0, "Bu külliyenin özeti, fukahâ Mürciesini tanıtmak ve bid'atlerinin türünü zikretmektir."]]}]}, {"ts": "10:08", "title": "2. Külliye: Zahir ile bâtın arasındaki telâzümü ve amelsiz iman olmadığını kabul eden fukahâ Mürciesiyle ihtilaf lafzîdir", "paras": [{"reader": false, "ar": [[608.0, "ويُوضِّح ذلك الكلّيّةُ الثانية:"], [612.0, "كلُّ من كان من مرجئة الفقهاء يُقِرُّ بالتلازم بين الظاهر والباطن،"], [635.0, "وأنه لا إيمانَ إلا بعمل،"], [640.0, "فالخلافُ بيننا وبينهم لفظيّ. <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [661.0, "كلُّ من كان من مرجئة الفقهاء يُقِرُّ بالتلازم بين الباطن والظاهر،"], [667.0, "وأنه لا إيمانَ إلا بعمل،"], [670.6, "فالخلافُ بيننا وبينهم لفظيّ."]], "tr": [[608.0, "Bunu 2. külliye açıklar: 2."], [612.0, "külliye: Fukahâ Mürciesinden olup zahir ile bâtın arasındaki telâzümü ve amelsiz iman olmadığını kabul eden herkesle bizim aramızdaki ihtilaf lafzîdir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [661.0, "<b>2. külliye: Fukahâ Mürciesinden olup bâtın ile zahir arasındaki telâzümü ve amelsiz iman olmadığını kabul eden herkesle bizim aramızdaki ihtilaf lafzîdir.<\/b>"]]}, {"reader": false, "ar": [[674.0, "أقول وبالله التوفيق: اختلف أهلُ السنة والجماعة في نوع الخلاف بيننا وبين مرجئة الفقهاء:"], [685.0, "أهو نزاعٌ لفظيّ، أم نزاعٌ حقيقيٌّ له ثمرة؟"], [693.0, "على ثلاثة أقوال: فمِن أهل السنة مَن جعل الخلافَ كلَّه حقيقيًّا لا صوريًّا،"], [703.0, "ومن أهل السنة مَن جعل الخلافَ كلَّه صوريًّا لا حقيقيًّا،"], [713.0, "ومن أهل السنة مَن توسّط فجعل بعضَ الخلاف مع مرجئة الفقهاء صوريًّا ـ أي لفظيًّا ـ وبعضَ الخلاف معهم حقيقيًّا."], [730.0, "واختار هذا القولَ أبو العبّاس ابن تيميّة رحمه الله تعالى،"], [735.0, "وهو القولُ الصحيح في هذه المسألة."]], "tr": [[674.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat, bizimle fukahâ Mürciesi arasındaki ihtilafın türünde —lafzî bir çekişme mi, yoksa semeresi olan hakiki bir çekişme mi olduğunda— üç görüşe ayrılmıştır:"], [693.0, "Ehl-i Sünnet'ten bazıları ihtilafın tamamını sûrî değil hakiki saymıştır."], [696.0, "Ehl-i Sünnet'ten bazıları ihtilafın tamamını hakiki değil sûrî saymıştır."], [703.7, "Ehl-i Sünnet'ten bazıları da orta yolu tutmuş;"], [713.0, "fukahâ Mürciesiyle ihtilafın bir kısmını sûrî —yani lafzî—, bir kısmını da hakiki saymıştır."], [730.0, "Bu görüşü Ebü'l-Abbâs İbn Teymiyye —Allah Teâlâ ona rahmet etsin— tercih etmiştir;"], [735.0, "bu meselede doğru görüş de budur."]]}, {"reader": false, "ar": [[741.0, "إذا علمتَ هذا، فاعلم أنّ هذه الكلّيّة التي معنا،"], [745.0, "والكلّيّة التي بعدها، تُبيِّن لك تفاصيلَ القول الراجح؛"], [753.0, "وهي: أنه متى يكون الخلاف معهم حقيقيًّا،"], [759.0, "ومتى يكون الخلاف معهم صوريًّا."], [764.0, "فذكرت الكلّيّة أنّ الخلاف معهم يكون صوريًّا إذا كانوا يُقِرّون بأمرين:"], [771.0, "الأمرُ الأوّل: يُقِرّون بالتلازم بين الباطن والظاهر،"], [778.0, "وأنّ أعمال الباطن مؤثِّرةٌ في أعمال الظاهر،"], [781.5, "وأنّ أعمال الظاهر مؤثِّرةٌ في أعمال الباطن."], [785.0, "والثاني: أن يُقِرّوا بأنّ الإيمان لا يكمُل إلا ـ ولا بدّ ـ من عمل <span class=\"q\">؟ 13:05<\/span>؛"], [800.0, "فلا إيمانَ إلا بعمل،"], [802.8, "كما أنه لا عملَ إلا بإيمان."]], "tr": [[741.0, "Bunu bildiysen, bil ki elimizdeki bu külliye ve ondan sonraki külliye sana râcih görüşün ayrıntılarını açıklar;"], [753.0, "yani onlarla ihtilafın ne zaman hakiki, ne zaman sûrî olduğunu."], [764.0, "Külliye, şu iki şeyi kabul ettiklerinde onlarla ihtilafın sûrî olduğunu zikretti:"], [771.0, "Birinci husus: Bâtın ile zahir arasındaki telâzümü kabul ederler;"], [778.5, "bâtının amellerinin zahirin amellerinde, zahirin amellerinin de bâtının amellerinde etkili olduğunu kabul ederler."], [785.0, "İkincisi: İmanın ancak —mutlaka— amelle kemâle ereceğini kabul etmeleridir <span class=\"q\">؟<\/span>."], [800.0, "Buna göre amelsiz iman olmaz, tıpkı imansız amel olmadığı gibi."]]}, {"reader": false, "ar": [[807.0, "فإذا كان مرجئةُ الفقهاء يُقِرّون بهذين الأمرين،"], [815.0, "فيكون النزاعُ بيننا وبينهم لفظيًّا،"], [817.7, "في حالة تسليم المخالف بهذين الأمرين؛"], [821.0, "فيقول: إنّ الإيمان الذي في القلب لا بدّ ـ لِزامًا ـ أن يستلزم الأعمالَ الظاهرة،"], [832.0, "ثم يُنازِع بعد ذلك في هذا التلازم:"], [837.0, "أهو تلازمُ رُكنٍ أم تلازمُ شرط؟"], [841.0, "فيكون الخلاف بيننا وبينه في هذه الجزئيّة لفظيًّا."]], "tr": [[807.0, "Fukahâ Mürciesi bu iki hususu kabul ediyorsa, muhalifin bu iki hususu teslim etmesi durumunda bizimle onlar arasındaki çekişme lafzî olur."], [821.0, "Şöyle der: Kalpteki iman mutlaka —zorunlu olarak— zahirî amelleri gerektirir."], [832.0, "Sonra bu telâzüm hakkında çekişir:"], [837.0, "Bu, rükün telâzümü müdür, şart telâzümü müdür?"], [841.0, "İşte bu cüz'î noktada bizimle onun arasındaki ihtilaf lafzî olur."]]}, {"reader": false, "ar": [[847.0, "ولذلك قال ابن تيميّة رحمه الله:"], [850.0, "«فإنّ كثيرًا من النزاع فيها» ـ أي في مسألة مرجئة الفقهاء ـ قال:"], [856.4, "«فإنّ كثيرًا من النزاع فيها لفظيّ، لكنّ اللفظ المطابق للكتاب والسنة هو الصواب، فليس لأحدٍ أن يقول بخلاف قول الله ورسوله»."], [867.0, "أقول: يعني بذلك أنه خطّأ مرجئةَ الفقهاء في إخراج العمل عن دائرة الإيمان؛"], [875.0, "لأنّ الكتاب والسنة ونصوصَ الشرع قد نصّت على أنّ العمل داخلٌ في مسمّى الإيمان."], [882.0, "فيكون ابن تيميّة في هذه الجزئيّة قد خطّأهم في اللفظ،"], [888.0, "وجعل الخلافَ بيننا وبينهم صوريًّا في هذه الجزئيّة."]], "tr": [[847.0, "Bu yüzden İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [850.0, "\"Bu konudaki çekişmenin çoğu\" —yani fukahâ Mürciesi meselesinde— dedi ki:"], [854.2, "\"Bu konudaki çekişmenin çoğu lafzîdir;"], [856.4, "fakat Kitap ve Sünnet'e uygun olan lafız doğru olandır."], [860.1, "Hiç kimsenin Allah'ın ve Resûlü'nün sözüne aykırı söz söylemesi caiz değildir.\" Derim ki:"], [867.0, "Bununla, ameli iman dairesinin dışına çıkarmakta fukahâ Mürciesini hatalı bulduğunu kastediyor;"], [875.0, "çünkü Kitap, Sünnet ve şer'î nasslar amelin iman adlandırmasına dahil olduğunu açıkça belirtmiştir."], [882.0, "Böylece İbn Teymiyye bu cüz'î noktada onları lafızda hatalı bulmuş ve bu noktada bizimle onlar arasındaki ihtilafı sûrî saymıştır."]]}, {"reader": false, "ar": [[892.0, "وقال رحمه الله ـ وانتبهوا لهذا النقل ـ:"], [896.0, "«فإنّ كثيرًا من النزاع فيها نزاعٌ في الاسم واللفظ دون الحكم؛ إذ كان الفقهاءُ الذين يُضاف إليهم هذا القول ـ مثل حمّاد بن أبي سليمان وأبي حنيفة وغيرهما ـ هم مع سائر أهل السنة متّفقين على أنّ الله يُعذِّب مَن يُعذِّبه من أهل الكبائر بالنار، ثم يُخرجهم بالشفاعة كما جاءت الأحاديث الصحيحة بذلك، وعلى أنه لا بدّ في الإيمان أن يتكلّم بلسانه، وعلى أنّ الأعمال المفروضة واجبة، وتاركُها مستحقٌّ للذمّ والعقاب."]], "tr": [[892.0, "Yine —Allah ona rahmet etsin— şöyle dedi —bu nakle dikkat edin—:"], [898.2, "\"Bu konudaki çekişmenin çoğu hükümde değil, isim ve lafızda bir çekişmedir."], [904.2, "Zira bu sözün nispet edildiği fakihler —Hammâd b."], [909.2, "Ebî Süleymân, Ebû Hanîfe ve diğerleri gibi— diğer bütün Ehl-i Sünnet'le birlikte şu hususlarda ittifak hâlindeydiler:"], [918.6, "Allah büyük günah ehlinden azap edeceği kimselere ateşte azap eder, sonra sahih hadislerin bildirdiği gibi onları şefaatle oradan çıkarır;"], [928.1, "imanda mutlaka diliyle söylemesi gerekir;"], [930.9, "farz ameller vaciptir ve onları terk eden kınanmayı ve cezayı hak eder."]]}, {"reader": false, "ar": [[939.0, "فكان في الأعمال ـ هل هي من الإيمان ـ وفي الاستثناء ونحو ذلك،"], [947.0, "عامّتُه نزاعٌ لفظيّ؛ فإنّ الإيمان إذا أُطلق دخلت فيه الأعمال»."], [951.3, "انتهى كلامه. وهذا لا يقول به كلُّ مرجئة الفقهاء،"], [957.0, "وإنما يقول به بعضُهم في مسألة التلازم بين الباطن والظاهر،"], [965.0, "وفي أن لا إيمانَ إلا بعمل."]], "tr": [[939.0, "Böylece amellerin imandan olup olmadığı, istisna ve benzeri konulardaki (çekişmenin) çoğu lafzî bir çekişme oldu."], [949.0, "Çünkü iman mutlak olarak söylendiğinde ameller ona dahil olur.\" Sözü burada bitti."], [951.3, "Bunu fukahâ Mürciesinin hepsi söylemez;"], [954.9, "ancak bazıları, bâtın ile zahir arasındaki telâzüm ve amelsiz iman olmadığı meselesinde bunu söyler."]]}, {"reader": false, "ar": [[967.0, "وقال رحمه الله تعالى ـ انتبهوا ـ:"], [971.6, "«ممّا ينبغي أن يُعرف أنّ أكثرَ التنازع» ـ وانتبهوا لكلمة «أكثر»؛"], [980.0, "فهذا دليلٌ على أنّ هناك جزئيّاتٍ من النزاع حقيقيّة،"], [986.0, "وهي التي ستأتينا في الكلّيّة التي بعدها ـ أُعيد كلامه وأقول:"], [991.6, "«ممّا ينبغي أن يُعرف أنّ أكثرَ التنازع بين أهل السنة في هذه المسألة هو نزاعٌ لفظيّ، وإلّا فالقائلون بأنّ الإيمان قولٌ من الفقهاء ـ كحمّاد بن أبي سليمان، وهو أوّلُ من قال ذلك، ومن اتّبعه من أهل الكوفة وغيرهم ـ متّفقون مع جميع علماء السنة على أنّ أصحاب الذنوب داخلون تحت الذمّ والوعيد». انتهى كلامه."]], "tr": [[967.0, "Yine —Allah Teâlâ ona rahmet etsin— şöyle dedi —dikkat edin—:"], [971.6, "\"Bilinmesi gereken şeylerden biri, çekişmenin çoğunun…\" —\"çoğu\" kelimesine dikkat edin;"], [980.0, "bu, çekişmenin hakiki olan cüz'î noktaları da bulunduğuna delildir;"], [986.6, "bunlar da sonraki külliyede bize gelecek— sözünü tekrarlıyorum:"], [991.6, "\"Bilinmesi gereken şeylerden biri, bu meselede Ehl-i Sünnet arasındaki çekişmenin çoğunun lafzî bir çekişme olduğudur."], [999.8, "Yoksa fakihlerden imanın söz olduğunu söyleyenler —bunu ilk söyleyen Hammâd b."], [1006.3, "Ebî Süleymân ve ona uyan Kûfe ehli ve diğerleri gibi— bütün sünnet âlimleriyle, günah sahiplerinin kınama ve tehdidin kapsamına girdiğinde ittifak hâlindedirler.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1021.0, "بخلاف ما يقوله غُلاةُ المرجئة:"], [1025.0, "بأنّ العمل غيرُ مؤثّرٍ أصالةً،"], [1028.0, "لا في الدنيا ولا في الآخرة،"], [1032.0, "وأنه ليس مَحَطًّا لا لزيادة الإيمان ولا لنقصانه،"], [1036.5, "ولا للثواب ولا للعقاب ولا للذمّ."], [1041.0, "وأمّا مرجئةُ الفقهاء فهذا قولُهم."]], "tr": [[1021.0, "Aşırı Mürcienin söylediğinin aksine: Onlar amelin aslen ne dünyada ne ahirette etkili olmadığını;"], [1030.0, "ne imanın artmasına ne eksilmesine, ne sevaba ne cezaya ne de kınanmaya konu olmadığını söylerler."], [1041.0, "Fukahâ Mürciesine gelince, onların sözü budur (yukarıda zikredilen)."]]}, {"reader": false, "ar": [[1044.0, "وقال رحمه الله تعالى:"], [1046.3, "«قيل لمن قال: دخولُ الأعمال الظاهرة في اسم الإيمان مجاز» ـ قلتُ:"], [1052.7, "وهو قولُ مرجئة الفقهاء؛"], [1055.2, "فإنهم وإن أدخلوا الأعمالَ في الإيمان،"], [1059.2, "إلا أنهم يُدخلونها على أنها شرطُ كمالٍ أو مجاز."], [1066.0, "فابن تيميّة يخاطب هؤلاء،"], [1068.1, "يقول: «قيل لمن قال: دخولُ الأعمال الظاهرة في اسم الإيمان مجاز: نزاعُك لفظيّ؛ فإنك إن سلّمتَ أنّ هذه» ـ أي الأعمال ـ «لوازمُ الإيمان الواجب الذي في القلب وموجَباتُه، كان عدمُ اللازم موجِبًا لعدم الملزوم، فيلزم من عدم هذا الظاهر» ـ أي الأعمال ـ «عدمُ الباطن» ـ أي عدمُ إيمان القلب ـ «فإذا اعترفتَ بهذا كان النزاعُ لفظيًّا»."], [1099.0, "كلامي واضح؟ انتهى كلامه."]], "tr": [[1044.0, "Yine —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1046.3, "\"Zahirî amellerin iman ismine dahil olmasının mecaz olduğunu söyleyene denir ki…\" —derim ki:"], [1055.2, "Bu, fukahâ Mürciesinin sözüdür; onlar amelleri imana dahil etseler de, onları ancak kemâl şartı olarak veya mecazen dahil ederler."], [1068.7, "İbn Teymiyye bunlara hitap ederek diyor ki— \"Zahirî amellerin iman ismine dahil olmasının mecaz olduğunu söyleyene denir ki:"], [1079.0, "Senin çekişmen lafzîdir. Çünkü eğer bunların\" —yani amellerin— \"kalpteki vacip imanın lâzımları ve gerektirdikleri olduğunu teslim edersen, lâzımın yokluğu melzûmun yokluğunu gerektirir."], [1091.0, "Böylece bu zahirin\" —yani amellerin— \"yokluğundan bâtının yokluğu\" —yani kalbin imanının yokluğu— \"lâzım gelir."], [1099.0, "Bunu kabul edersen çekişme lafzî olur.\" Sözüm açık mı? Sözü burada bitti."]]}, {"reader": false, "ar": [[1103.0, "وقال أيضًا: «فإذا قال» ـ أي مرجئةُ الفقهاء ـ «إنها» ـ أي الأعمال ـ «من لوازمه» ـ أي من لوازم الإيمان ـ «وإنّ الإيمان الباطن يستلزم عملًا صالحًا ظاهرًا، كان بعد ذلك قولُه: إنّ تلك الأعمال لازمةٌ لمسمّى الإيمان أو جزءٌ منه، نزاعًا لفظيًّا». انتهى كلامه."]], "tr": [[1103.0, "Yine şöyle dedi: \"(Muhalif)\" —yani fukahâ Mürciesi— \"onların\" —yani amellerin— \"onun lâzımlarından\" —yani imanın lâzımlarından— \"olduğunu ve bâtın imanın zahirî salih bir ameli gerektirdiğini söylerse, bundan sonra o amellerin iman adlandırmasının lâzımı mı yoksa ondan bir cüz mü olduğu yönündeki sözü lafzî bir çekişme olur.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1136.0, "وقال ابن أبي العزّ الحنفيّ رحمه الله تعالى:"], [1142.0, "«الاختلافُ الذي بين أبي حنيفة والأئمّة الباقين من أهل السنة اختلافٌ صوريّ؛ فإنّ كونَ أعمال الجوارح لازمةً لإيمان القلب، أو جزءًا من الإيمان ـ مع الاتّفاق على أنّ مرتكب الكبيرة لا يخرج من الإيمان، بل هو في مشيئة الله، إن شاء عذّبه وإن شاء عفا عنه ـ نزاعٌ لفظيٌّ لا يترتّب عليه فسادُ اعتقاد». انتهى كلامه."]], "tr": [[1136.0, "İbn Ebi'l-İz el-Hanefî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1142.0, "\"Ebû Hanîfe ile Ehl-i Sünnet'in diğer imamları arasındaki ihtilaf sûrî bir ihtilaftır."], [1148.0, "Çünkü —büyük günah işleyenin imandan çıkmadığı, aksine Allah'ın meşîetinde olduğu, dilerse ona azap edeceği, dilerse onu affedeceği konusunda ittifakla birlikte— azaların amellerinin kalbin imanının lâzımı mı yoksa imanın bir cüzü mü olduğu, itikad bozukluğu doğurmayan lafzî bir çekişmedir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1175.0, "واعلموا ـ رحمكم الله تعالى ـ أنّ ابن تيميّة لمّا قال:"], [1181.0, "«فإنّ كثيرًا من النزاع فيها لفظيّ»،"], [1185.0, "مرادُه بهذا: أنّ الفقهاء ـ كحمّاد بن أبي سليمان وأبي حنيفة ـ يوافقون السلفَ في مسألة الأحكام في الآخرة من جهة وعيد أهل الكبائر،"], [1196.0, "ويوافقون السلفَ أيضًا في مسألة لزوم الواجبات،"], [1200.0, "وفي الطعن على أهل الكبائر بالفسق،"], [1202.7, "وأمثال هذه المسائل، وهذا هو حقيقةُ مذهب أهل السنة والجماعة."], [1209.0, "ولكنّ ابن تيميّة لم يُرِد بقوله هذا أنّ كلَّ الخلاف بيننا وبين مرجئة الفقهاء من باب النزاع اللفظيّ."]], "tr": [[1175.0, "Bilin ki —Allah Teâlâ size rahmet etsin— İbn Teymiyye \"Bu konudaki çekişmenin çoğu lafzîdir\" dediğinde, bununla şunu kastediyor:"], [1186.0, "Hammâd b. Ebî Süleymân ve Ebû Hanîfe gibi fakihler, büyük günah ehline yönelik tehdit açısından ahiretteki hükümler meselesinde selefe muvafakat ederler;"], [1196.0, "vaciplerin gerekliliği meselesinde, büyük günah ehlini fısk ile nitelemekte ve buna benzer meselelerde de selefe muvafakat ederler."], [1204.0, "Ehl-i Sünnet ve'l-Cemaat mezhebinin hakikati de budur."], [1209.0, "Fakat İbn Teymiyye bu sözüyle, bizimle fukahâ Mürciesi arasındaki ihtilafın tamamının lafzî çekişme kabilinden olduğunu kastetmedi."]]}]}, {"ts": "20:20", "title": "2. Külliye (sonuç): İhtilafın sûrî olduğu dört durum", "paras": [{"reader": false, "ar": [[1220.0, "ومن خلال ما سبق يمكن أن يقال:"], [1224.0, "إنّ أكثر الخلاف بين أهل السنة والحديث وبين مرجئة الفقهاء خلافٌ صوريٌّ في أمور:"], [1232.0, "الأوّل: إذا أدخلوا اعتقادَ القلب في الإيمان ولم يكتفوا بالتصديق."], [1239.0, "الثاني: إذا قالوا: لا بدّ في الإيمان من نطق اللسان."], [1247.0, "الثالث: إذا وافقوا أهلَ السنة في حكم أصحاب الكبائر،"], [1253.0, "وأنّ منهم من يدخل النار."]], "tr": [[1220.0, "Geçenlerden hareketle şöyle denebilir: Ehl-i Sünnet ve hadis ehli ile fukahâ Mürciesi arasındaki ihtilafın çoğu şu hususlarda sûrî bir ihtilaftır:"], [1232.0, "Birincisi: Kalbin itikadını imana dahil edip sadece tasdikle yetinmedikleri takdirde."], [1239.0, "İkincisi: İmanda dilin söylemesinin şart olduğunu söyledikleri takdirde."], [1247.0, "Üçüncüsü: Büyük günah sahiplerinin hükmünde ve onlardan bazılarının ateşe gireceği hususunda Ehl-i Sünnet'e muvafakat ettikleri takdirde."]]}, {"reader": false, "ar": [[1256.0, "الرابع: أنهم يقولون: إنّ الإيمان بدون العمل المفروض ـ من فعل المحرَّم ـ من تركِ المحرّمات وفعلِ الواجبات،"], [1270.0, "صاحبُ هذا الإيمان الذي لم يفعل المأمورات،"], [1274.3, "أو وقع في شيءٍ من المحظورات،"], [1278.0, "مستحقٌّ للذمّ والعقاب. فإذا كان قولُهم بهذه الصورة،"], [1284.3, "فلا جرمَ أنّ خلافنا معهم في هذه الجزئيّات إنما هو نزاعٌ لفظيّ."]], "tr": [[1256.0, "Dördüncüsü: Şunu söylemeleri: Farz olan amel —haram işlemek— haramları terk etmek ve vacipleri yapmak olmaksızın iman;"], [1270.0, "emredilenleri yapmayan veya yasaklardan bir şeye düşen bu imanın sahibi, kınanmayı ve cezayı hak eder."], [1282.0, "Onların sözü bu şekilde ise, şüphesiz bu cüz'î noktalarda onlarla ihtilafımız lafzî bir çekişmeden ibarettir."]]}, {"reader": false, "ar": [[1290.0, "والخلاصةُ أنّ الكلّيّة جمعت لك صُوَرَ الخلاف بين أهل السنة ومرجئة الفقهاء في نقطتين:"], [1299.0, "الأولى: في قوله: «إذا اعتقدوا التلازم بين الباطن والظاهر»،"], [1305.0, "والثانية: «إذا قالوا بأن لا إيمانَ إلا بعمل»."], [1312.0, "أنتم معي في هذا ولّا؟ الحمد لله <span class=\"q\">؟ 21:52<\/span>."]], "tr": [[1290.0, "Özet şudur: Külliye, Ehl-i Sünnet ile fukahâ Mürciesi arasındaki (lafzî) ihtilaf şekillerini sana iki noktada topladı:"], [1299.0, "Birincisi, \"bâtın ile zahir arasındaki telâzüme inandıkları takdirde\" sözünde;"], [1305.7, "ikincisi, \"amelsiz iman olmadığını söyledikleri takdirde\" (sözünde)."], [1312.0, "Bu konuda benimle misiniz, değil misiniz? Elhamdülillah <span class=\"q\">؟<\/span>."]]}]}, {"ts": "21:54", "title": "3. Külliye: Telâzümü ve amelin etkisini mutlak olarak nefyeden fukahâ Mürciesiyle ihtilaf hakikidir", "paras": [{"reader": false, "ar": [[1314.0, "فإذا عُلم هذا، فيكمل توضيحُ الأمر بالكلّيّة الثالثة:"], [1319.7, "<b>كلُّ من نفى التلازم<\/b> ـ آه،"], [1323.0, "أنتم معي الآن؟ ـ كلُّ من نفى التلازمَ بين الباطن والظاهر،"], [1337.0, "ونفى تأثيرَ العمل مطلقًا،"], [1340.0, "من مرجئة الفقهاء، فنزاعُه مع أهل السنة حقيقيّ.<b> <span class=\"note\">(يكررها)<\/span> <\/b>كلُّ من نفى التلازمَ بين الظاهر والباطن،"], [1355.0, "ونفى تأثيرَ العمل مطلقًا،"], [1358.0, "من مرجئة الفقهاء، فنزاعُه مع أهل السنة حقيقيّ."]], "tr": [[1314.0, "Bu bilindiyse, meselenin açıklaması 3."], [1316.9, "külliye ile tamamlanır: 3. külliye:"], [1319.7, "Telâzümü nefyeden…<b> —ha, şimdi benimle misiniz?— <\/b>3."], [1325.0, "külliye: Fukahâ Mürciesinden bâtın ile zahir arasındaki telâzümü nefyeden ve amelin etkisini mutlak olarak nefyeden herkesin Ehl-i Sünnet'le çekişmesi hakikidir. (Tekrar ediyor.) Fukahâ Mürciesinden zahir ile bâtın arasındaki telâzümü nefyeden ve amelin etkisini mutlak olarak nefyeden herkesin Ehl-i Sünnet'le çekişmesi hakikidir."]]}, {"reader": false, "ar": [[1365.0, "أقول وبالله التوفيق: وهذه صورةُ الخلاف الآخر،"], [1377.0, "وهي ما كان الخلافُ بيننا وبين مرجئة الفقهاء فيه محقَّقًا،"], [1382.0, "وليس مجرّدَ نزاعٍ في عبارة."], [1384.0, "فمتى ما كان الخلاف بيننا وبين مرجئة الفقهاء في جزئيّتين ـ عفوًا ـ في الجزئيّتين المذكورتين في الكلّيّة،"], [1396.0, "فإنّ الخلاف يكون بيننا وبينهم محقَّقًا."], [1400.0, "الجزئيّة الأولى: في قوله:"], [1402.0, "«كلُّ من نفى التلازم بين الباطن والظاهر»،"], [1405.0, "فلم يجعلوا تلازمًا بين أعمال القلوب وأعمال الجوارح،"], [1410.0, "فجعلوا الأمرَ منفكًّا ليس فيه مطلقُ التلازم."], [1416.0, "والثاني: في قوله: «ونفى تأثيرَ العمل مطلقًا»."]], "tr": [[1365.0, "Tevfik Allah'tandır, derim ki: Bu da diğer ihtilaf şeklidir;"], [1377.5, "yani bizimle fukahâ Mürciesi arasındaki ihtilafın gerçek olduğu, sadece bir ifade çekişmesi olmadığı durum."], [1384.0, "Bizimle fukahâ Mürciesi arasındaki ihtilaf iki cüz'î noktada —affedersiniz— külliyede zikredilen iki cüz'î noktada olduğunda, bizimle onlar arasındaki ihtilaf gerçek olur."], [1396.7, "Birinci cüz'î nokta, \"Bâtın ile zahir arasındaki telâzümü nefyeden herkes\" sözündedir:"], [1402.0, "Kalplerin amelleri ile azaların amelleri arasında telâzüm kabul etmediler;"], [1406.2, "meseleyi birbirinden kopuk, hiçbir şekilde telâzüm bulunmayan bir şey hâline getirdiler."], [1416.0, "İkincisi, \"ve amelin etkisini mutlak olarak nefyeden\" sözündedir."]]}, {"reader": false, "ar": [[1423.0, "فكلُّ من وقع من مرجئة الفقهاء في هاتين الجزئيّتين،"], [1429.0, "فإنّ الخلاف بيننا وبينهم محقَّق،"], [1433.0, "وليس مجرّدَ نزاعٍ في عبارة."], [1437.0, "أظنّكم فهمتم. فمن قال بأنّ أعمال القلوب لا تستلزم أعمالَ الجوارح،"], [1444.0, "فالخلافُ بيننا وبينه حقيقيّ."], [1450.0, "ومن قال بأنّ أعمال الجوارح لا تزيد في إيمان القلب،"], [1457.0, "فإنّ الخلاف بيننا وبينه حقيقيّ."], [1461.0, "ومن قال بأنّ تارك المأمورات لا يُذَمّ ولا يستحقّ العقوبة،"], [1468.0, "لا في الدنيا ولا في الآخرة،"], [1471.0, "فإنّ الخلاف بيننا وبينه حقيقيّ."]], "tr": [[1423.0, "Fukahâ Mürciesinden bu iki cüz'î noktaya düşen herkesle bizim aramızdaki ihtilaf gerçektir, sadece bir ifade çekişmesi değildir."], [1437.0, "Sanırım anladınız. Kim kalplerin amellerinin azaların amellerini gerektirmediğini söylerse, bizimle onun arasındaki ihtilaf hakikidir."], [1450.0, "Kim azaların amellerinin kalbin imanını artırmadığını söylerse, bizimle onun arasındaki ihtilaf hakikidir."], [1461.0, "Kim emredilenleri terk edenin ne dünyada ne ahirette kınanmayacağını ve cezayı hak etmeyeceğini söylerse, bizimle onun arasındaki ihtilaf hakikidir."]]}, {"reader": false, "ar": [[1474.0, "ومن قال بأنّ فاعل المحرّمات لا يستحقّ العقوبة،"], [1480.0, "أو قال بأنه لا يضرّ أصالةً مع الإيمان ذنبٌ،"], [1486.0, "وأنّ الذنوب لا تُنقِص مؤشِّرَ الإيمان <span class=\"q\">؟ 24:46<\/span>،"], [1491.0, "فلا جرمَ أنّ الخلاف بيننا وبينه في هذه الحالة حقيقيّ."], [1496.0, "فتبيّن لك بهاتين الكلّيّتين متى يكون الخلافُ صوريًّا،"], [1503.0, "ومتى يكون الخلافُ حقيقيًّا."]], "tr": [[1474.0, "Kim haramları işleyenin cezayı hak etmediğini söylerse ya da imanla birlikte hiçbir günahın aslen zarar vermediğini ve günahların imanın göstergesini eksiltmediğini <span class=\"q\">؟<\/span> söylerse, şüphesiz bu durumda bizimle onun arasındaki ihtilaf hakikidir."], [1494.0, "Böylece bu iki külliyeyle ihtilafın ne zaman sûrî, ne zaman hakiki olduğu sana açıkça ortaya çıktı."]]}]}, {"ts": "25:06", "title": "3. Külliye (devam): Orta görüş ve ircanın ümmete getirdiği bozukluklar", "paras": [{"reader": false, "ar": [[1506.0, "وهذا قولٌ وسطٌ بين مَن جعل الخلاف بيننا وبينهم حقيقيًّا في كلّ جزئيّاته،"], [1513.0, "وبين مَن جعل الخلاف بيننا وبينهم صوريًّا في كلّ جزئيّاته،"], [1519.8, "وخيرُ الأمور أوساطُها. واعلم ـ رحمك الله تعالى ـ أنّ مذهب المرجئة ـ سواءٌ مرجئةُ الفقهاء أو غيرُ الفقهاء ـ قد ترتّب عليه مفاسدُ كثيرةٌ في الشريعة؛"], [1535.0, "بل إنّ مرجئة الفقهاء يدخلون في ذمّ السلف للإرجاء دخولًا أوّليًّا،"], [1546.4, "لأنهم أوّلُ الشَّرارة التي فتحت للناس بابَ الإرجاء."]], "tr": [[1506.0, "Bu, bizimle onlar arasındaki ihtilafı bütün cüz'î noktalarında hakiki sayanlarla bütün cüz'î noktalarında sûrî sayanlar arasında orta bir görüştür;"], [1517.7, "işlerin en hayırlısı ortasıdır. Bil ki —Allah Teâlâ sana rahmet etsin— Mürcie mezhebi —ister fukahâ Mürciesi ister fakih olmayanlar— şeriatte birçok bozukluğa yol açmıştır."], [1535.0, "Hatta fukahâ Mürciesi, selefin ircayı kınamasına öncelikle girerler;"], [1545.0, "çünkü onlar insanlara irca kapısını açan ilk kıvılcımdır."]]}, {"reader": false, "ar": [[1552.6, "فمِن مفاسد أقوال المرجئة في الأمّة:"], [1558.0, "أنهم فتحوا لمن بعدهم بابَ إسقاط تأثير الأعمال مطلقًا،"], [1569.0, "حتى وصل الجهميّة ـ في تعريف الإيمان وبيان حقيقته ـ إلى أنه مطلقُ المعرفة."], [1576.0, "وأنتم تعرفون أنّ البدع أوائلُها تدعو إلى أواخرها،"], [1581.9, "و«من سنّ في الإسلام سنّةً سيّئةً فعليه وزرُها ووزرُ من عمل بها من بعده، من غير أن ينقص من أوزارهم شيئًا»."], [1594.0, "فلو لم يقل مرجئةُ الفقهاء بسقوط الأعمال عن مسمّى الإيمان،"], [1601.0, "لما جاء من بعدهم متجرِّئًا على هذا الإسقاط."]], "tr": [[1552.6, "Mürcienin sözlerinin ümmet içindeki bozukluklarından biri şudur:"], [1558.0, "Kendilerinden sonrakilere amellerin etkisini mutlak olarak düşürme kapısını açtılar;"], [1563.3, "öyle ki Cehmiyye, imanı tanımlarken ve hakikatini açıklarken onun mutlak bilgi/tanıma olduğu noktasına vardı."], [1576.0, "Bilirsiniz ki bid'atlerin başları sonlarına çağırır."], [1580.3, "\"Kim İslâm'da kötü bir çığır açarsa, onun günahı ve kendisinden sonra onunla amel edenlerin günahı —onların günahlarından hiçbir şey eksilmeksizin— onun üzerinedir.\" Eğer fukahâ Mürciesi amellerin iman adlandırmasından düştüğünü söylemeseydi, onlardan sonra gelen bu düşürmeye cüret ederek gelmezdi."]]}, {"reader": false, "ar": [[1606.1, "فمرجئةُ الفقهاء هم الذريعة الذين فُتحت بعدهم أبوابُ الإرجاء،"], [1616.0, "فهم داخلون في قول الله عز وجل:"], [1620.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَتَّبِعُوا خُطُوَاتِ الشَّيْطَانِ﴾<\/span> <span class=\"ref\">[النور: ٢١]<\/span>،"], [1624.0, "وهذه آيةٌ في وجوب سدّ الذرائع التي تُفضي إلى ما وراءها من الفساد."]], "tr": [[1606.1, "Fukahâ Mürciesi, kendilerinden sonra irca kapılarının açıldığı vesiledir."], [1612.6, "Bu yüzden onlar Allah Azze ve Celle'nin şu sözünün kapsamına girerler:"], [1620.0, "<span class=\"ayah\">﴿Ey iman edenler! Şeytanın adımlarına uymayın﴾<\/span> [Nûr 21]."], [1623.5, "Bu ayet, ardındaki bozukluğa götüren vesilelerin (zerîalerin) önünü kesmenin vacip olduğuna dair bir ayettir."]]}, {"reader": false, "ar": [[1629.3, "ومن مفاسد قولهم في الأمّة:"], [1634.0, "سقوطُ هيبة الأعمال الشرعيّة؛"], [1637.0, "فيستوي من يعمل ومن لا يعمل؛"], [1640.0, "يستوي من يُصلّي ومن لا يُصلّي ـ على قول المرجئة ـ ويستوي من يَكُدّ ومن لا يَكُدّ <span class=\"q\">؟ 27:24<\/span>،"], [1648.0, "ويستوي من يحُجّ ومن لا يحُجّ،"], [1651.0, "ويستوي من يصوم ومن لا يصوم،"], [1654.0, "ويستوي من يُزكّي ومن لا يُزكّي،"], [1656.0, "ويستوي من حرم نفسَه من الذنوب والمعاصي وجاهد نفسَه عليها،"], [1662.5, "ومَن ـ وقع فيها وصارت هِجِّيراه ودَيدنَه."], [1667.0, "فقولٌ بهذه النهاية فلا جرمَ أنه قولٌ قبيحٌ في الأمّة."]], "tr": [[1629.3, "Onların sözünün ümmet içindeki bozukluklarından biri de şer'î amellerin heybetinin düşmesidir."], [1634.0, "Amel edenle etmeyen eşit olur;"], [1634.8, "Mürcienin sözüne göre namaz kılanla kılmayan eşit olur;"], [1637.0, "çabalayanla çabalamayan <span class=\"q\">؟<\/span> eşit olur;"], [1638.5, "hacca gidenle gitmeyen eşit olur;"], [1640.0, "oruç tutanla tutmayan eşit olur;"], [1643.1, "zekât verenle vermeyen eşit olur;"], [1648.0, "nefsini günahlardan ve isyanlardan mahrum bırakıp bu konuda nefsiyle mücadele edenle, onlara düşüp onları âdeti ve alışkanlığı hâline getiren eşit olur."], [1667.0, "Böyle bir sonuca varan söz, şüphesiz ümmet içinde çirkin bir sözdür."]]}, {"reader": false, "ar": [[1674.0, "حتى وإن كنّا نطلب لهم المعاذير ولا نُكفِّرهم،"], [1678.0, "ونجعل بعضَ خلافنا معهم صوريًّا،"], [1681.0, "لكنّهم البوّابةُ والثغرة التي فتحت على الأمّة هذه الأبوابَ الخطيرة."], [1688.0, "ومن مفاسدهم أيضًا: أنهم فتحوا بابًا للفُسّاق والعُصاة فدخلوا منه،"], [1697.0, "مُسوِّغين لأنفسهم أنّ معاصيهم لا تؤثّر في إيمانهم،"], [1704.0, "ولا تُنقص منه شيئًا أبدًا؛"], [1708.0, "لأنّ الإيمان عند المرجئة شيءٌ واحدٌ لا يزيد ولا ينقص،"], [1712.0, "فإيمانُ أفسقِ الناس كإيمان أبي بكرٍ وعمر."]], "tr": [[1674.0, "Onlar için mazeretler arasak, onları tekfir etmesek ve onlarla ihtilafımızın bir kısmını sûrî saysak bile, ümmete bu tehlikeli kapıları açan geçit ve gedik onlardır."], [1688.0, "Onların bozukluklarından biri de fâsıklara ve âsilere bir kapı açmalarıdır;"], [1693.6, "onlar da isyanlarının imanlarına etki etmediğini ve ondan asla hiçbir şey eksiltmediğini kendilerine gerekçe yaparak oradan girdiler."], [1708.0, "Çünkü Mürcieye göre iman artmayan ve eksilmeyen tek bir şeydir;"], [1711.2, "insanların en fâsığının imanı Ebû Bekir'in ve Ömer'in imanı gibidir."]]}, {"reader": false, "ar": [[1719.0, "فالفاسق يقول: أنا مؤمنٌ كاملُ الإيمان،"], [1723.9, "والسِّكّيرُ يقول: أنا مؤمنٌ كاملُ الإيمان،"], [1728.7, "والسارقُ والزاني يقول: أنا مؤمنٌ كاملُ الإيمان؛"], [1736.0, "بل يقول: إنّ إيماني كإيمان جبريل وميكائيل،"], [1739.5, "وكإيمان الصحابة والتابعين، مع أنه يتقحّم الذنوبَ فعلًا،"], [1744.3, "معتقدًا بأنّ ذلك لا يؤثّر في شيءٍ من إيمانه أبدًا."], [1753.0, "وهذه جُمَلٌ يسيرةٌ من المفاسد التي وقع فيها أهلُ الإرجاء."]], "tr": [[1719.0, "Fâsık \"Ben imanı kâmil bir müminim\" der;"], [1725.7, "ayyaş \"Ben imanı kâmil bir müminim\" der;"], [1732.8, "hırsız ve zinakâr \"Ben imanı kâmil bir müminim\" der."], [1736.0, "Hatta \"Benim imanım Cebrâil'in ve Mîkâil'in imanı gibidir, sahâbenin ve tâbiînin imanı gibidir\" der;"], [1742.3, "oysa fiilen günahlara dalmaktadır ve bunun imanından hiçbir şeye asla etki etmediğine inanmaktadır."], [1753.0, "Bunlar, irca ehlinin düştüğü bozukluklardan birkaç tanesidir."]]}, {"reader": false, "ar": [[1759.0, "والخلاصةُ من ذلك: أنّ خلافنا مع مرجئة الفقهاء إذا كان مبنيًّا على عدم التلازم بين الباطن والظاهر،"], [1769.0, "وعلى أنّ الأعمال لا تؤثّر في الإيمان،"], [1773.1, "وليست مَحَطًّا للثواب ولا للعقاب،"], [1776.0, "فإنّ خلافنا معهم في هذه الجزئيّة خلافٌ معتبَر."], [1781.6, "والله أعلم. تصوّرتم القواعدَ الثلاث؟"]], "tr": [[1759.0, "Bunun özeti şudur: Fukahâ Mürciesiyle ihtilafımız, bâtın ile zahir arasında telâzüm olmadığı ve amellerin imana etki etmediği, sevaba da cezaya da konu olmadığı görüşüne dayanıyorsa, bu cüz'î noktada onlarla ihtilafımız muteber (gerçek) bir ihtilaftır."], [1781.6, "Allah en iyisini bilir. Üç kaideyi kavradınız mı?"]]}]}, {"ts": "29:45", "title": "4. Külliye: İmanın kalpteki aslının varlığına taalluk etmeyen her istisnada sakınca yoktur", "paras": [{"reader": false, "ar": [[1785.0, "الكلّيّة الرابعة، وهي في مسألة الاستثناء في الإيمان:"], [1790.0, "<b>كلُّ استثناءٍ في الإيمان لا يتعلّق بأصل وجوده في القلب فلا بأسَ به.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها ثالثة:"], [1811.0, "<b>كلُّ استثناءٍ في الإيمان لا يتعلّق بأصل وجوده في القلب فلا بأسَ به.<\/b>"]], "tr": [[1785.0, "<b>4. külliye<\/b> —bu, imanda istisna meselesi hakkındadır—:"], [1789.4, "<b>İmanda, onun kalpteki aslının varlığına taalluk etmeyen her istisnada sakınca yoktur.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [1811.0, "<b>4. külliye: İmanda, onun kalpteki aslının varlığına taalluk etmeyen her istisnada sakınca yoktur.<\/b>"]]}, {"reader": false, "ar": [[1817.0, "أقول وبالله التوفيق: وهذه المسألة فرعٌ عن خلاف أهل القبلة في مسألة الأعمال:"], [1830.0, "أهي داخلةٌ في الإيمان أو خارجةٌ عنه؟"], [1834.0, "فمِن آثار هذه المسألة:"], [1837.0, "مسألةُ الاستثناء جوازًا وتحريمًا."], [1841.0, "فإن قلتَ: وما صورتُها؟"], [1844.0, "فأقول: صورتُها أن يُعلَّق شيءٌ من أعمال القلوب بالمشيئة:"], [1851.0, "أنا متوكّلٌ على الله إن شاء الله،"], [1855.0, "أنا مؤمنٌ إن شاء الله،"], [1857.0, "أنا خائفٌ من الله إن شاء الله،"], [1860.0, "أنا أرجو الله إن شاء الله."], [1864.0, "فمسألةُ الاستثناء في الإيمان متعلّقةٌ بأعمال القلوب، متعلّقةٌ بأعمال القلوب."]], "tr": [[1817.0, "Tevfik Allah'tandır, derim ki: Bu mesele, kıble ehlinin ameller meselesindeki —amellerin imana dahil mi yoksa onun dışında mı olduğu konusundaki— ihtilafının bir dalıdır."], [1834.0, "Bu meselenin sonuçlarından biri, caiz ya da haram oluşu bakımından istisna meselesidir."], [1844.0, "\"Peki bunun şekli nedir?\" dersen, derim ki:"], [1851.0, "Şekli, kalplerin amellerinden birinin meşîete bağlanmasıdır:"], [1855.0, "\"İnşallah Allah'a tevekkül edenim\", \"İnşallah mü'minim\", \"İnşallah Allah'tan korkanım\", \"İnşallah Allah'ı umanım.\" Demek ki imanda istisna meselesi kalplerin amelleriyle ilgilidir; kalplerin amelleriyle ilgilidir."]]}, {"reader": false, "ar": [[1873.0, "فهل الاستثناء في الإيمان جائزٌ أو لا؟"], [1884.0, "الجواب: فيه خلافٌ بين أهل القبلة."], [1887.0, "والذي أجمع عليه أهلُ السنة والجماعة هو مقتضى هذه الكلّيّة؛"], [1893.0, "وهي أنّنا لا نمنع الاستثناءَ في الإيمان مطلقًا،"], [1898.0, "ولا نُجيز الاستثناءَ فيه مطلقًا،"], [1903.0, "وإنما نُجيزه أحيانًا ونمنعه أحيانًا."], [1909.0, "وهذا هو القولُ الوسط بين أقوال أهل القبلة، وخيرُ الأمور أوساطُها."]], "tr": [[1873.0, "Peki imanda istisna caiz midir, değil midir?"], [1884.0, "Cevap: Bu konuda kıble ehli arasında ihtilaf vardır."], [1887.0, "Ehl-i Sünnet ve'l-Cemaat'in icmâ ettiği şey bu külliyenin gerektirdiği şeydir:"], [1893.0, "İmanda istisnayı ne mutlak olarak yasaklarız ne de mutlak olarak caiz görürüz;"], [1901.2, "bilakis bazen caiz görür, bazen yasaklarız."], [1909.0, "Bu, kıble ehlinin görüşleri arasında orta görüştür; işlerin en hayırlısı ortasıdır."]]}, {"reader": false, "ar": [[1916.0, "فإن قلتَ: وما التفصيل بين الجواز وعدمه؟"], [1921.0, "فأقول: ما ذُكر في الكلّيّة؛"], [1923.0, "فإنّ المؤلّف ذكر في هذه الكلّيّة نوعين:"], [1931.0, "النوعُ الأوّل: إذا كان الاستثناء يرجع إلى الشكّ في أصل وجود العمل القلبيّ؛"], [1938.0, "فإذا قال: أنا مؤمنٌ إن شاء الله،"], [1942.7, "شاكًّا في أصل وجود إيمانه أو عدمه،"], [1949.0, "أو قال: أنا متوكّلٌ على الله إن شاء الله،"], [1954.0, "وهو شاكٌّ في أصل وجود بَذرة التوكّل في قلبه؛"], [1959.0, "فمتى ما كان الاستثناءُ في الإيمان أو متعلَّقاته القلبيّة يرجع إلى الشكّ في أصل وجوده، فهذا كفر."]], "tr": [[1916.0, "\"Peki caiz olanla olmayan arasındaki ayrım nedir?\" dersen, derim ki:"], [1923.0, "Külliyede zikredilen şeydir. Müellif bu külliyede iki tür zikretmiştir:"], [1932.6, "Birinci tür: İstisnanın kalbî amelin aslının varlığındaki şüpheye dönmesi."], [1938.0, "Kişi, imanının aslının var olup olmadığından şüphe ederek \"İnşallah mü'minim\" derse veya kalbinde tevekkül tohumunun aslının varlığından şüphe ederek \"İnşallah Allah'a tevekkül edenim\" derse —imanda veya onunla ilgili kalbî hususlarda istisna, onun aslının varlığındaki şüpheye dönüyorsa— bu küfürdür."]]}, {"reader": false, "ar": [[1970.0, "لأنّ الإيمان مرتكِزٌ على اليقين والقطع؛"], [1977.0, "فالإيمانُ بوجود الله لا يقبل أن يدخل الشكُّ فيه،"], [1982.0, "والإيمانُ بوجود الملائكة لا يقبل أن يدخل الشكُّ فيه."], [1986.0, "فمن شكّ في وجود الله فهو كافر،"], [1990.0, "ومن شكّ في وجود الملائكة فهو كافر."], [1995.0, "فلا يجتمع إيمانٌ وشكٌّ في أصل وجوده، فهما متناقضان."]], "tr": [[1970.0, "Çünkü iman yakîn ve kesinlik üzerine kuruludur."], [1977.0, "Allah'ın varlığına iman, içine şüphe girmesini kabul etmez;"], [1982.0, "meleklerin varlığına iman, içine şüphe girmesini kabul etmez."], [1986.0, "Kim Allah'ın varlığından şüphe ederse kâfirdir;"], [1990.0, "kim meleklerin varlığından şüphe ederse kâfirdir."], [1995.0, "İman ile onun aslının varlığındaki şüphe bir arada bulunmaz; bu ikisi birbiriyle çelişir."]]}, {"reader": false, "ar": [[2004.0, "ولذلك اشترط الله عز وجل اليقينَ في كتابه،"], [2008.0, "وفي سنّة رسوله صلى الله عليه وسلم،"], [2010.8, "في مسائل الإيمان؛ فقال الله عز وجل:"], [2014.0, "«إنما كان قولَ المؤمنين إذا» ـ عفوًا ـ <span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ آمَنُوا بِاللَّهِ وَرَسُولِهِ ثُمَّ لَمْ يَرْتَابُوا﴾<\/span> <span class=\"ref\">[الحجرات: ١٥]<\/span>؛"], [2024.0, "أي: لم يشُكّوا. وفي الحديث يقول النبيّ صلى الله عليه وسلم:"], [2028.0, "«أشهد أن لا إله إلا الله وأنّي رسولُ الله، لا يلقى اللهَ بهما عبدٌ غيرَ شاكٍّ فيهما فيُحجَبَ عن الجنّة» <span class=\"note\">(Müslim)<\/span>."], [2039.0, "بل قال الله عز وجل:"], [2041.0, "<span class=\"ayah\">﴿قَالَتْ رُسُلُهُمْ أَفِي اللَّهِ شَكٌّ فَاطِرِ السَّمَاوَاتِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[إبراهيم: ١٠]<\/span>، الآيةَ بتمامها."]], "tr": [[2004.0, "Bu yüzden Allah Azze ve Celle, Kitabı'nda ve Resûlü sallallâhu aleyhi ve sellem'in sünnetinde iman meselelerinde yakîni şart koşmuştur."], [2012.0, "Allah Azze ve Celle şöyle buyurdu:"], [2014.0, "\"Müminlerin sözü ancak…\" —affedersiniz— <span class=\"ayah\">﴿Müminler ancak Allah'a ve Resûlü'ne iman eden, sonra da şüpheye düşmeyen kimselerdir﴾<\/span> [Hucurât 15];"], [2024.0, "yani şüphe etmeyen. Hadiste Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [2028.0, "\"Allah'tan başka ilâh olmadığına ve benim Allah'ın Resûlü olduğuma şahitlik ederim."], [2033.0, "Bu ikisinde şüphe etmeyerek bunlarla Allah'a kavuşan hiçbir kul cennetten alıkonmaz.\" <span class=\"note\">(Müslim)<\/span> Hatta Allah Azze ve Celle şöyle buyurdu:"], [2041.0, "<span class=\"ayah\">﴿Peygamberleri dedi ki: Gökleri ve yeri yaratan Allah hakkında şüphe mi olur?﴾<\/span> [İbrâhîm 10] —ayetin tamamı."]]}, {"reader": false, "ar": [[2048.0, "فمتى ما قال: أنا مؤمنٌ إن شاء الله،"], [2052.0, "وهو يقصد بمشيئته هنا الشكَّ في أصل وجود الإيمان في قلبه،"], [2062.0, "فتلك هي الحالة التي نعتبرها كفرًا،"], [2065.0, "هي الحالة التي نعتبرها كفرًا."], [2070.0, "فكلُّ من استثنى وشكّ باستثنائه في أصل إيمانه فهو كافر."], [2076.0, "ولكن إذا قال: أنا مؤمنٌ إن شاء الله،"], [2079.0, "ومشيئتُه لا تتعلّق بأصل الإيمان،"], [2082.0, "وإنما بكمالاته، فهذا جائزٌ لا بأس به؛"], [2087.0, "بل قد يُستحبّ أحيانًا،"], [2089.4, "بل قد يجب في بعض الصور،"], [2093.0, "على حسب ما يَعرِض له ممّا يجعله مستحبًّا أو واجبًا."]], "tr": [[2048.0, "Kişi \"İnşallah mü'minim\" der ve buradaki meşîetle kalbindeki imanın aslının varlığındaki şüpheyi kastederse, işte bu küfür saydığımız durumdur;"], [2070.0, "küfür saydığımız durum budur. İstisna yapıp istisnasıyla imanının aslında şüphe eden herkes kâfirdir."], [2076.0, "Fakat \"İnşallah mü'minim\" der de meşîeti imanın aslına değil, ancak kemâllerine taalluk ederse, bu caizdir, sakıncası yoktur."], [2087.0, "Hatta ona arız olan ve onu müstehap veya vacip kılan duruma göre bazen müstehap olabilir, hatta bazı durumlarda vacip olabilir."]]}, {"reader": false, "ar": [[2103.0, "وبهذين الأمرين نعرف أنّ الأمر لا بدّ أن يقوم على التفصيل؛"], [2111.0, "فالإيمانُ في القلب عندنا له أصلٌ وكمال:"], [2116.0, "فإن كان الشكّ يخصّ أصلَه فكفر،"], [2120.0, "وإن كان الشكّ يتعلّق بكمالاته المندوبة أو كمالاته الواجبة،"], [2127.0, "فإنّ هذا جائزٌ لا بأس به."], [2130.0, "وعلى ذلك أقوالُ أهل العلم."]], "tr": [[2103.0, "Bu iki hususla anlarız ki mesele mutlaka tafsil üzerine kurulmalıdır."], [2109.2, "Bize göre kalpteki imanın bir aslı ve bir kemâli vardır."], [2116.0, "Şüphe onun aslına aitse küfürdür;"], [2119.3, "şüphe onun mendup kemâllerine veya vacip kemâllerine taalluk ediyorsa, bu caizdir, sakıncası yoktur."], [2130.0, "İlim ehlinin sözleri de bu yöndedir."]]}]}, {"ts": "35:33", "title": "4. Külliye (devam): Selefin istisna hakkındaki sözleri ve istisnanın birinci dayanağı", "paras": [{"reader": false, "ar": [[2133.0, "قال الوليد بن مسلم رحمه الله تعالى:"], [2137.0, "«سمعتُ أبا عمرٍو ـ يعني الأوزاعيَّ ـ ومالكَ بن أنس، وسعيدَ بن عبد العزيز، يُنكرون أن يقول: أنا مؤمن، ويأذنون في الاستثناء أن يقول: أنا مؤمنٌ إن شاء الله»."], [2153.8, "انتهى كلامه. وقال البيهقيّ رحمه الله:"], [2158.9, "«قد روينا هذا» ـ يعني الاستثناءَ في الإيمان ـ «عن جماعةٍ من الصحابة والتابعين والسلف الصالح رضي الله عنهم أجمعين». انتهى كلامه."]], "tr": [[2133.0, "Velîd b. Müslim —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [2137.0, "\"Ebû Amr'ı —yani Evzâî'yi—, Mâlik b."], [2139.5, "Enes'i ve Saîd b. Abdülazîz'i, (kişinin) 'Ben mü'minim' demesini reddederken ve 'İnşallah mü'minim' diyerek istisna yapmasına izin verirken işittim.\" Sözü burada bitti."], [2153.8, "Beyhakî —Allah ona rahmet etsin— şöyle dedi:"], [2158.9, "\"Biz bunu\" —yani imanda istisnayı— \"sahâbeden, tâbiînden ve selef-i sâlihînden —Allah hepsinden razı olsun— bir topluluktan rivayet ettik.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2170.0, "وقال ابن تيميّة رحمه الله:"], [2173.0, "«أمّا مذهبُ سلفِ أصحاب الحديث ـ كابن مسعودٍ وأصحابه، والثوريّ، وابن عُيينة، وأكثر علماء الكوفة، ويحيى بن سعيدٍ القطّان فيما يرويه عن علماء أهل البصرة، وأحمد بن حنبل، وغيره من أئمّة السنة ـ فكانوا يستثنون في الإيمان» ـ فكانوا يستثنون في الإيمان ـ «وهذا متواترٌ عنهم». انتهى كلامه."]], "tr": [[2170.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [2173.0, "\"Hadis ehlinin selefinin mezhebine gelince —İbn Mes'ûd ve ashâbı, Sevrî, İbn Uyeyne, Kûfe âlimlerinin çoğu, Basra ehlinin âlimlerinden rivayet ettiği kadarıyla Yahyâ b."], [2184.4, "Saîd el-Kattân, Ahmed b. Hanbel ve diğer sünnet imamları gibi—, onlar imanda istisna yaparlardı\" —imanda istisna yaparlardı— \"bu, onlardan tevâtürle sabittir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2197.4, "وقال رحمه الله: «المأثورُ عن الصحابة وأئمّة التابعين وجمهور السلف ـ وهو مذهبُ أهل الحديث، وهو المنسوب إلى أهل السنة ـ أنّ الإيمان قولٌ وعمل، يزيد وينقص، يزيد بالطاعة وينقص بالمعصية، وأنه يجوز الاستثناءُ فيه»."], [2218.0, "انتهى كلامه. وقال كذلك:"], [2221.3, "«الاستثناءُ في الإيمان سنّةٌ عند أصحابنا وأكثر أهل السنة»."]], "tr": [[2197.4, "Yine —Allah ona rahmet etsin— şöyle dedi:"], [2199.4, "\"Sahâbeden, tâbiînin imamlarından ve selefin cumhurundan nakledilen —ki bu hadis ehlinin mezhebidir ve Ehl-i Sünnet'e nispet edilen görüştür— şudur:"], [2208.6, "İman söz ve ameldir; artar ve eksilir;"], [2212.3, "taatle artar, masiyetle eksilir; onda istisna yapmak caizdir.\" Sözü burada bitti."], [2218.0, "Yine şöyle dedi: \"İmanda istisna, ashâbımız ve Ehl-i Sünnet'in çoğu nezdinde sünnettir.\""]]}, {"reader": false, "ar": [[2227.0, "وقد بيّن أهلُ السنة مآخذَ هذا الاستثناء في كمالات الإيمان لا في أصله:"], [2235.0, "لماذا ينبغي للإنسان أن لا يجزم بكمالات إيمانه؟"], [2241.0, "ولماذا ينبغي له ـ تواضعًا لربّه ـ أن يقول:"], [2245.7, "«إن شاء الله»، شاكًّا في كمالات إيمانه؟"], [2252.0, "وذكروا أنّ لذلك صُوَرًا:"], [2258.0, "الأولى: أنه إن قال:"], [2260.7, "أنا مؤمن، وسكت، فإنه يشهد لنفسه بالإيمان المطلق،"], [2267.0, "والإيمانُ المطلق من شرطه امتثالُ جميع المأمورات فلا يترك مأمورًا،"], [2276.0, "واجتنابُ جميع المحظورات فلا يفعل محظورًا."], [2282.0, "ومن الذي يمكن أن يفعل ذلك؟!"]], "tr": [[2227.0, "Ehl-i Sünnet, imanın aslında değil kemâllerinde yapılan bu istisnanın dayanaklarını açıklamıştır:"], [2235.0, "İnsan neden imanının kemâllerinden kesin emin olmamalıdır?"], [2241.0, "Ve neden Rabbine karşı tevazu olarak, imanının kemâllerinden şüphe ederek \"inşallah\" demelidir?"], [2252.0, "Bunun birkaç şekli olduğunu zikretmişlerdir:"], [2260.7, "Birincisi: \"Ben mü'minim\" deyip susarsa, kendisi için mutlak imana şahitlik etmiş olur."], [2268.4, "Mutlak imanın şartı ise bütün emredilenlere uymak —hiçbir emri terk etmemek— ve bütün yasaklardan kaçınmak —hiçbir yasağı işlememektir. Bunu kim yapabilir ki?!"]]}, {"reader": false, "ar": [[2284.0, "ولذلك فالأسلمُ لك أن تقول:"], [2287.5, "أنا مؤمنٌ إن شاء الله؛"], [2291.0, "لأنك إن أطلقتَ فأنت تشهد لنفسك بمثل هذه الشهادة."], [2296.0, "قال الإمام أحمد رحمه الله:"], [2299.0, "«أذهبُ إلى حديث ابن مسعودٍ في الاستثناء في الإيمان؛ لأنّ الإيمان قولٌ وعمل، والعملُ الفعل، فقد جئنا بالقول، ونخشى أن نكون قد فرّطنا في العمل، فيُعجبني أن نستثني في الإيمان، بقول: أنا مؤمنٌ إن شاء الله». انتهى كلامه."]], "tr": [[2284.0, "Bu yüzden senin için en selametlisi \"İnşallah mü'minim\" demendir;"], [2287.5, "çünkü mutlak söylersen kendin için böyle bir şahitlikte bulunmuş olursun."], [2291.0, "İmam Ahmed —Allah ona rahmet etsin— şöyle dedi:"], [2296.0, "\"İmanda istisna konusunda İbn Mes'ûd'un hadisini benimserim."], [2299.0, "Çünkü iman söz ve ameldir;"], [2303.0, "amel ise fiildir. Sözü getirdik, amelde kusur etmiş olmaktan korkarız."], [2314.1, "Bu yüzden 'İnşallah mü'minim' diyerek imanda istisna yapmamız hoşuma gider.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2325.0, "وعن المَيمونيّ رحمه الله أنه سأل أحمدَ عن قوله ورأيه في قول:"], [2330.0, "أنا مؤمنٌ إن شاء الله،"], [2332.0, "فقال: «أقول: مؤمنٌ إن شاء الله، ومؤمنٌ أرجو؛ لأنه لا يدري كيف أداؤه للأعمال على ما افتُرض عليه أم لا». انتهى كلامه."]], "tr": [[2325.0, "Meymûnî'den —Allah ona rahmet etsin— rivayet edildiğine göre, Ahmed'e \"İnşallah mü'minim\" demek hakkındaki sözünü ve görüşünü sordu."], [2332.5, "O da şöyle dedi: \"'İnşallah mü'minim' ve 'Mü'min olduğumu umarım' derim."], [2338.0, "Çünkü kişi amelleri kendisine farz kılındığı şekilde eda edip etmediğini bilmez.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2345.0, "وقال أبو عمرٍو الدانيّ رحمه الله:"], [2347.0, "«من قول أهل السنة أنّ الاستثناء في الإيمان جائزٌ واسع» ـ انتبهوا،"], [2353.0, "انتبهوا ـ «إذا كان عائدًا إلى العاقبة أو الكمال، ولا يجوز عن طريق الشكّ؛ لأنّ أقلَّ ما يُقبل من الإيمان ما لا يُجامعه الشكوك»."], [2365.0, "انتهى كلامه. فقد جمع بين الحالتين في مسألة الاستثناء:"], [2371.0, "فأجاز الاستثناءَ في الكمالات،"], [2374.0, "ولم يُجِز الاستثناءَ في الأصل."]], "tr": [[2345.0, "Ebû Amr ed-Dânî —Allah ona rahmet etsin— şöyle dedi:"], [2347.0, "\"Ehl-i Sünnet'in sözüne göre imanda istisna caizdir ve geniştir\" —dikkat edin, dikkat edin— \"akıbete veya kemâle dönük olduğunda."], [2355.3, "Şüphe yoluyla ise caiz değildir;"], [2357.4, "çünkü imandan kabul edilecek en az şey, şüphelerin kendisiyle bir araya gelmediği şeydir.\" Sözü burada bitti."], [2365.0, "Böylece istisna meselesinde iki durumu bir araya getirmiştir:"], [2371.0, "Kemâllerde istisnayı caiz görmüş, asılda istisnayı caiz görmemiştir."]]}, {"reader": false, "ar": [[2377.0, "وقال الرازيّ رحمه الله تعالى:"], [2381.0, "«عابوا على الشافعيّ قولَه: أنا مؤمنٌ إن شاء الله. والجوابُ: أنّ هذا القول منقولٌ عن الكثير من السلف، فكان المرادُ بقولنا: إن شاء الله، ليس هو الشكَّ في الاعتقاد والإقرار، بل الشكّ في كمال الأعمال». انتهى كلامه."]], "tr": [[2377.0, "Râzî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [2381.0, "\"Şâfiî'yi 'İnşallah mü'minim' sözünden dolayı ayıpladılar."], [2385.4, "Cevap şudur: Bu söz seleften birçoğundan nakledilmiştir."], [2390.4, "'İnşallah' sözümüzle kastedilen, itikad ve ikrarda şüphe değil, amellerin kemâlinde şüphedir.\" Sözü burada bitti."]]}]}, {"ts": "40:01", "title": "4. Külliye (devam): Birinci dayanağın tamamlanması · İkinci dayanak: İmanın kabulü gaybdır", "paras": [{"reader": false, "ar": [[2401.0, "وقال ابن تيميّة رحمه الله تعالى:"], [2404.0, "«الإيمانُ المطلق يتضمّن فعلَ ما أمر الله به عبدَه كلَّه، وتركَ المحرّمات كلِّها؛ فإذا قال الرجل: أنا مؤمن ـ بهذا الاعتبار ـ فقد شهد لنفسه بأنه من الأبرار المتّقين، القائمين بفعل جميع ما أُمروا به، وتركِ كلِّ ما نُهوا عنه، فيكون من أولياء الله». انتهى كلامه."]], "tr": [[2401.0, "İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [2404.0, "\"Mutlak iman, Allah'ın kuluna emrettiği şeylerin hepsini yapmayı ve haramların hepsini terk etmeyi içerir."], [2414.0, "Kişi bu itibarla 'Ben mü'minim' derse, kendisi için, emrolundukları her şeyi yerine getiren ve yasaklandıkları her şeyi terk eden takvâ sahibi iyilerden olduğuna şahitlik etmiş olur;"], [2426.6, "böylece Allah'ın velîlerinden olur.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2430.0, "يعني أنها شهادةٌ تتضمّن تزكيةً ـ كما سيأتينا إن شاء الله ـ ولذلك قال الله عز وجل:"], [2439.4, "<span class=\"ayah\">﴿فَلَا تُزَكُّوا أَنفُسَكُمْ ۖ هُوَ أَعْلَمُ بِمَنِ اتَّقَىٰ﴾<\/span> <span class=\"ref\">[النجم: ٣٢]<\/span>،"], [2445.0, "وقال الله عز وجل:"], [2447.7, "<span class=\"ayah\">﴿أَلَمْ تَرَ إِلَى الَّذِينَ يُزَكُّونَ أَنفُسَهُم ۚ بَلِ اللَّهُ يُزَكِّي مَن يَشَاءُ﴾<\/span> <span class=\"ref\">[النساء: ٤٩]<\/span> <span class=\"q\">؟ 40:45<\/span>."], [2455.0, "فهذا المأخذُ الأوّل في مسألة الاستثناء."]], "tr": [[2430.0, "Yani bu, —inşallah ileride bize geleceği gibi— tezkiye içeren bir şahitliktir."], [2435.2, "Bu yüzden Allah Azze ve Celle şöyle buyurdu:"], [2439.4, "<span class=\"ayah\">﴿Kendinizi temize çıkarmayın; O, kimin takvâ sahibi olduğunu daha iyi bilir﴾<\/span> [Necm 32]."], [2447.7, "Allah Azze ve Celle şöyle buyurdu:"], [2449.7, "<span class=\"ayah\">﴿Kendilerini temize çıkaranları görmedin mi? Hayır, Allah dilediğini temize çıkarır﴾<\/span> [Nisâ 49] <span class=\"q\">؟<\/span>."], [2455.0, "İşte istisna meselesindeki birinci dayanak budur."]]}, {"reader": false, "ar": [[2461.0, "المأخذُ الثاني: أنّ الإيمان النافع هو الإيمانُ المتقبَّل عند الله،"], [2471.0, "والإيمانُ المتقبَّل عند الله من الغيب؛"], [2480.0, "فإنّ قبولَ الله ـ من عدم قبوله ـ لإيماننا وأعمالنا من الغيب."], [2486.0, "فإذا قال المؤمن: أنا مؤمن،"], [2488.5, "وأطلق، فكأنه يشهد لنفسه أنّ الله عز وجل قد تقبّل أعمالَه،"], [2495.9, "وهذه حقيقةُ التزكية المنهيّ عنها."]], "tr": [[2461.0, "İkinci dayanak: Fayda veren iman, Allah katında kabul edilen imandır;"], [2467.3, "Allah katında kabul edilen iman ise gaybdandır."], [2480.0, "Çünkü Allah'ın imanımızı ve amellerimizi kabul edip etmemesi gaybdandır."], [2486.0, "Mümin \"Ben mü'minim\" deyip mutlak bırakırsa, sanki Allah Azze ve Celle'nin amellerini kabul ettiğine kendisi için şahitlik etmiş olur."], [2495.9, "Yasaklanan tezkiyenin hakikati de budur."]]}, {"reader": false, "ar": [[2499.0, "فإنّ مِن طبع المؤمنين أنهم يُؤتون ما آتَوا وقلوبُهم وَجِلة،"], [2505.9, "خائفةٌ أن لا يُتقبَّل منهم،"], [2509.0, "كما قال الله عز وجل:"], [2511.7, "<span class=\"ayah\">﴿وَالَّذِينَ يُؤْتُونَ مَا آتَوا وَّقُلُوبُهُمْ وَجِلَةٌ﴾<\/span> <span class=\"ref\">[المؤمنون: ٦٠]<\/span>،"], [2515.0, "وقد فسّرها النبيّ صلى الله عليه وسلم بأنهم قومٌ يصومون ويُصلّون ويتصدّقون ـ ولهم فضولُ أعمال ـ ويخافون أن لا يُتقبَّل منهم."], [2530.0, "ولذلك لا بدّ أن يُقرَن الإيمانُ بالمشيئة،"], [2533.7, "فرارًا من تلك الشهادة الغيبيّة بأنّ إيمانك عند الله مقبولٌ أو متقبَّل."]], "tr": [[2499.0, "Çünkü müminlerin tabiatındandır ki verdiklerini, kalpleri ürpererek —kendilerinden kabul edilmemesinden korkarak— verirler."], [2504.6, "Nitekim Allah Azze ve Celle şöyle buyurdu:"], [2508.4, "<span class=\"ayah\">﴿Onlar ki verdiklerini kalpleri ürpererek verirler﴾<\/span> [Mü'minûn 60]."], [2511.7, "Peygamber sallallâhu aleyhi ve sellem bunu, oruç tutan, namaz kılan, sadaka veren —ve fazladan amelleri de olan— fakat kendilerinden kabul edilmemesinden korkan bir topluluk diye tefsir etmiştir."], [2530.0, "Bu yüzden, imanının Allah katında makbul veya kabul edilmiş olduğuna dair o gaybî şahitlikten kaçmak için imanın mutlaka meşîetle birlikte söylenmesi gerekir."]]}, {"reader": false, "ar": [[2540.0, "ولذلك قال ابن بطّة رحمه الله تعالى:"], [2544.4, "«فهذه» ـ أي الاستثناء ـ «فهذه سبيلُ المؤمنين، وطريقُ العقلاء من العلماء: لزومُ الاستثناء والخوفِ والرجاء؛ لا يدرون كيف أحوالُهم عند الله، ولا كيف أعمالُهم: أمقبولةٌ هي أم مردودة»."]], "tr": [[2540.0, "Bu yüzden İbn Batta —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [2544.4, "\"İşte bu\" —yani istisna— \"işte bu müminlerin yolu ve âlimlerden akıllı olanların yöntemidir:"], [2550.7, "İstisnaya, korkuya ve ümide sarılmak."], [2553.2, "Allah katında hâllerinin nasıl olduğunu, amellerinin nasıl olduğunu —makbul mü yoksa merdut mu olduğunu— bilmezler.\""]]}, {"reader": false, "ar": [[2568.0, "وقال أبو الفرج الشيرازيّ رحمه الله تعالى ـ وهو من الحنابلة ـ قال:"], [2578.7, "«فإن قيل» ـ انتبهوا ـ «فقد تحقّق بإتيان الإيمان» ـ يعني:"], [2584.7, "تحقّق وجودُ أصل إيمانه بأعمال الإيمان والنطق بالشهادة ـ «فكيف يجوز أن يستثني؟»."], [2593.9, "أجاب عن هذا بقوله:"], [2597.0, "«هو أنّا قد بيّنّا أنّ الاستثناء لا ينفي التحقيق، وإنما هو ترجٍّ وتذلّلٌ إلى الله تعالى، والاستثناءُ لم يقع بشكٍّ في الفعل، وإنما وقع خوفًا من الخاتمة وخوفًا من القبول. فإذا قال: أنا مؤمنٌ إن شاء الله، فيكون معناه: إن قبل الله تعالى إيماني وأماتني عليه. وكذلك قولُه: صلّيتُ إن شاء الله، معناه: إن قبل الله صلاتي. وقولُه: أُصلّي إن شاء الله، أي: إن يسّر الله تعالى لي»."]], "tr": [[2568.0, "Ebü'l-Ferec eş-Şîrâzî —Allah Teâlâ ona rahmet etsin;"], [2568.7, "o Hanbelîlerdendir— şöyle dedi: \"Eğer denirse ki\" —dikkat edin— \"imanı getirmekle (iman) gerçekleşmiştir\" —yani imanın amelleri ve şehadeti söylemekle imanının aslının varlığı gerçekleşmiştir— \"o hâlde nasıl istisna yapması caiz olur?\" Buna şu sözüyle cevap verdi:"], [2578.7, "\"(Cevap) şudur: İstisnanın tahkiki (kesinliği) nefyetmediğini açıklamıştık;"], [2580.9, "o ancak Allah Teâlâ'ya bir ümit ve tezellüldür."], [2584.7, "İstisna, fiilde şüphe sebebiyle olmamıştır;"], [2587.6, "ancak akıbetten korkmak ve kabulden korkmak sebebiyle olmuştur."], [2593.9, "'İnşallah mü'minim' derse, anlamı şu olur:"], [2594.6, "Allah Teâlâ imanımı kabul eder ve beni onun üzere öldürürse."], [2597.0, "Aynı şekilde 'İnşallah namaz kıldım' sözünün anlamı:"], [2615.0, "Allah namazımı kabul ederse. 'İnşallah namaz kılacağım' sözü ise:"], [2633.3, "Allah Teâlâ bana kolaylaştırırsa (demektir).\""]]}, {"reader": false, "ar": [[2644.0, "وقد قال الإمام أحمد رحمه الله تعالى:"], [2647.0, "«الاستثناءُ ليس بشكٍّ، وليس بداخلٍ في الشكّ، وإنما هو توقّعٌ وترجٍّ»."], [2655.0, "انتهى كلامه. وقال الإمام ابن تيميّة رحمه الله:"], [2663.0, "«خوفُ مَن خاف من السلف أن لا يُتقبَّل منه، لخوفه أن لا يكون أتى بالعمل على وجهه المأمور، وهذا أظهرُ الوجوه في استثناء مَن استثنى منهم في الإيمان وفي أعمال الإيمان، كقول أحدهم: أنا مؤمنٌ إن شاء الله، وصلّيتُ إن شاء الله؛ لخوفِ أن لا يكون أتى بالواجب على الوجه المأمور به، لا على وجه الشكّ فيما بقلبه من التصديق». انتهى كلامه."]], "tr": [[2644.0, "İmam Ahmed —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [2645.3, "\"İstisna şüphe değildir ve şüpheye dahil de değildir;"], [2647.0, "o ancak bir bekleyiş ve ümittir.\" Sözü burada bitti."], [2650.6, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [2655.0, "\"Seleften korkanların, (amellerinin) kendilerinden kabul edilmemesinden korkması, ameli emredildiği şekilde getirmemiş olmaktan korkmalarındandır."], [2663.0, "Onlardan imanda ve imanın amellerinde istisna yapanların istisnasında en açık vecih budur."], [2673.5, "Birinin 'İnşallah mü'minim' ve 'İnşallah namaz kıldım' demesi gibi;"], [2680.3, "(bunu) vacibi emredildiği şekilde getirmemiş olma korkusundan (söyler), kalbindeki tasdikten şüphe etme yoluyla değil.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2693.0, "وسُئل ابن المبارك، فقيل له:"], [2696.6, "إنّ قومًا يقولون: إنّ سفيان حين كان يقول:"], [2701.5, "«إن شاء الله» كان ذاك منه شكًّا!"], [2705.0, "فقال ابن المبارك: «أترى سفيانَ كان يستثني في وحدانيّة الله، في وحدانيّة الربّ؟» ـ يعني باعتبار الأصل ـ «أترى سفيانَ كان يستثني في وحدانيّة الربّ، أو في محمّدٍ صلى الله عليه وسلم؟ إنما كان استثناؤه في قبول إيمانه، وما هو عند الله»."], [2731.0, "أنتم معي ولّا لا؟"]], "tr": [[2693.0, "İbn Mübârek'e soruldu; ona dendi ki:"], [2699.0, "\"Bir topluluk, Süfyân'ın 'inşallah' demesinin ondan bir şüphe olduğunu söylüyor!\" İbn Mübârek dedi ki:"], [2707.0, "\"Süfyân'ın Allah'ın birliğinde —Rabbin birliğinde— istisna yaptığını mı sanıyorsun?\" —yani aslı itibarıyla— \"Süfyân'ın Rabbin birliğinde veya Muhammed sallallâhu aleyhi ve sellem hakkında istisna yaptığını mı sanıyorsun?"], [2724.4, "Onun istisnası ancak imanının kabulünde ve onun Allah katındaki durumunda idi.\" Benimle misiniz, değil misiniz?"]]}]}, {"ts": "45:35", "title": "4. Külliye (devam): Üçüncü dayanak: Nefsi tezkiyeden uzak durmak · Dersin sonu", "paras": [{"reader": false, "ar": [[2735.0, "الثالث: البُعدُ عن تزكية النفس <span class=\"note\">(يكررها)<\/span>؛"], [2738.0, "فإنه لا تزكيةَ لها أعظمُ من التزكية بالإيمان،"], [2746.0, "حتى حمل النبيَّ صلى الله عليه وسلم على أن يُغيِّر اسمَ بَرّة إلى زينب،"], [2754.0, "معلِّلًا ذلك بقوله: «الله أعلمُ بأهل البرّ منكم» <span class=\"note\">(Müslim)<\/span>."], [2760.0, "وأخذ العلماءُ منها قاعدةً في باب التسمية:"], [2764.0, "أنّ كلَّ تسميةٍ تتضمّن تزكيةً دينيّةً محضةً فمحرّمة،"], [2772.0, "كما قد ذُكر ذلك في موضعٍ آخر."]], "tr": [[2735.0, "Üçüncüsü: Nefsi tezkiyeden uzak durmak (tekrar ediyor)."], [2738.0, "Çünkü nefis için imanla yapılan tezkiyeden daha büyük bir tezkiye yoktur."], [2747.7, "Öyle ki (bu), Peygamber sallallâhu aleyhi ve sellem'i Berre ismini Zeyneb'e değiştirmeye sevk etti;"], [2756.2, "bunu \"Allah, sizden iyi (birr) olanları daha iyi bilir\" sözüyle gerekçelendirdi."], [2760.0, "<span class=\"note\">(Müslim)<\/span> Âlimler bundan isim koyma babında bir kaide çıkarmışlardır:"], [2764.0, "Saf dinî bir tezkiye içeren her isimlendirme haramdır;"], [2772.0, "nitekim bu, başka bir yerde zikredilmiştir."]]}, {"reader": false, "ar": [[2776.0, "فليس هناك تزكيةٌ للنفس وراءَ الشهادة لها بالإيمان؛"], [2781.0, "فمَن قال عن نفسه إنه مؤمن،"], [2784.4, "وأطلق، فقد زكّاها بأعظم تزكية،"], [2789.0, "ونعتها بأكمل الصفات وأجملها."], [2793.0, "وقد نهى الله عز وجل عن ذلك في الآيات التي تلوتُها عليكم آنفًا،"], [2798.0, "في قول الله عز وجل:"], [2799.9, "<span class=\"ayah\">﴿فَلَا تُزَكُّوا أَنفُسَكُمْ ۖ هُوَ أَعْلَمُ بِمَنِ اتَّقَىٰ﴾<\/span> <span class=\"ref\">[النجم: ٣٢]<\/span>."]], "tr": [[2776.0, "Nefse imanla şahitlik etmenin ötesinde bir tezkiye yoktur."], [2779.1, "Kim kendisi hakkında mü'min olduğunu söyleyip mutlak bırakırsa, onu en büyük tezkiyeyle temize çıkarmış ve onu sıfatların en kâmiliyle ve en güzeliyle nitelemiş olur."], [2793.0, "Allah Azze ve Celle size az önce okuduğum ayetlerde bunu yasaklamıştır;"], [2797.2, "Allah Azze ve Celle'nin şu sözünde:"], [2799.9, "<span class=\"ayah\">﴿Kendinizi temize çıkarmayın; O, kimin takvâ sahibi olduğunu daha iyi bilir﴾<\/span> [Necm 32]."]]}, {"reader": false, "ar": [[2803.0, "ولذلك قال الحسن في معنى هذه الآية:"], [2808.0, "«علم اللهُ من كلّ نفسٍ ما هي صانعة، وإلى ما هي صائرة؛ فلا تزكّوا أنفسكم: فلا تُبرّئوها عن الآثام، ولا تمدحوها بحسن أعمالها». انتهى كلامه."]], "tr": [[2803.0, "Bu yüzden Hasan (-ı Basrî) bu ayetin anlamı hakkında şöyle dedi:"], [2808.0, "\"Allah her nefsin ne yapacağını ve nereye varacağını bilmiştir."], [2813.2, "'Kendinizi temize çıkarmayın' yani onu günahlardan beri saymayın ve onu amellerinin güzelliğiyle övmeyin.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2824.0, "وقال يحيى بن أبي الخير العِمرانيّ رحمه الله تعالى:"], [2830.0, "«الإيمانُ من أعلى صفات الحمد، وإطلاقُ القول به تزكيةٌ مطلقة، والاستثناءُ فيه خروجٌ من التزكية؛ كما يقال للإنسان: أنت فقيه، أو مفسِّر، فيقول: نعم إن شاء الله، لا في معرض الشكّ، ولكن لإخراج نفسه عن التزكية». انتهى كلامه."]], "tr": [[2824.0, "Yahyâ b. Ebi'l-Hayr el-İmrânî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [2828.0, "\"İman, övgü sıfatlarının en yücelerindendir."], [2830.0, "Onu mutlak olarak söylemek mutlak bir tezkiyedir;"], [2834.7, "onda istisna yapmak ise tezkiyeden çıkmaktır."], [2841.2, "Tıpkı insana 'Sen fakihsin' veya 'müfessirsin' denince, onun şüphe makamında değil, kendini tezkiyeden çıkarmak için 'Evet, inşallah' demesi gibi.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2858.0, "طيّب، نكتفي بهذا، والله أعلى وأعلم،"], [2860.0, "وصلى الله وسلم على نبيّنا محمد."]], "tr": [[2858.0, "Peki, bununla yetiniyoruz. Allah en yüce ve en iyi bilendir."], [2860.4, "Allah Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';

  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);

    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
