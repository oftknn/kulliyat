lemiz var: Sihri benzeri bir sihirle çözmenin hükmü nedir?"], [2897.6, "Cevap: Doğrusu bu konuda ehl-i ilim —Allah onlara rahmet etsin— arasında ihtilaf vardır."], [2907.0, "Ancak kendisinden başkasını söylemek uygun olmayan hak (görüş), bunun haram kılınması ve kapılarının kapatılmasıdır."], [2913.0, "Sihri sihirle çözmeyi caiz görmemiz asla uygun değildir;"], [2917.7, "çünkü bu çok tehlikeli bir yoldur."]]}, {"reader": false, "ar": [[2922.0, "ولأنه مهما بلغت الحالةُ السحريّة أو الآثارُ السحريّة في الإنسان،"], [2930.0, "فإنكم تعلمون أنّ الأمر لن يبلغ إلى دائرة الضرورة أبدًا،"], [2935.0, "ولذلك لا يجوز لنا أن نتداوى بما حُرِّم تحريمَ مقاصد."], [2943.0, "فالقاعدةُ عند أهل العلم ـ رحمهم الله تعالى ـ بأنّ ما كان تحريمُه تحريمَ مقاصد فإنه لا يجوز التداوي به،"], [2952.0, "والسحرُ محرّمٌ في الشرع تحريمَ مقاصد."]], "tr": [[2922.0, "Bir de insandaki sihir hâli veya sihir etkileri ne dereceye ulaşırsa ulaşsın, bilirsiniz ki iş asla zaruret dairesine ulaşmaz."], [2933.5, "Bu yüzden maksatların haram kılınması (tahrîmü'l-makâsıd) şeklinde haram kılınmış bir şeyle tedavi olmamız caiz değildir."], [2943.6, "Ehl-i ilmin —Allah onlara rahmet etsin— kaidesi şudur:"], [2947.5, "Haramlığı maksatların haramlığı türünden olan şeyle tedavi caiz değildir."], [2951.2, "Sihir de şeriatte maksatların haramlığı şeklinde haram kılınmıştır."]]}, {"reader": false, "ar": [[2956.0, "فإن قلتَ: ولماذا؟ أقول:"], [2959.6, "لأنّ المتقرِّر في القواعد أنّ ما حُرِّم تحريمَ مقاصد فإنه لا تُبيحه إلا الضرورات،"], [2967.0, "والمتقرِّر في القواعد أنّ كلَّ ما لا يقوم غيرُه مقامَه فضرورة."], [2976.0, "ولا يمكن أبدًا أن يبلغ السحرُ بالإنسان حالةً تُقفَل في وجهه الأبوابُ ولا يجد أمامه إلا التداويَ عند الساحر؛"], [2988.0, "فإنّ الدعاء سببٌ لكشفه،"], [2990.0, "والرقيةَ سببٌ لكشفه وإن طال زمانُها،"], [2994.0, "ووجودَ مكان السحر سببٌ لكشفه."], [2997.0, "فبما أنّ طرق كشفه كثيرةٌ فلا يمكن أن يبلغ مرتبةَ الضرورة،"]], "tr": [[2956.0, "Eğer \"Neden?\" dersen, derim ki:"], [2959.6, "Çünkü kaidelerde yerleşmiş olan şudur:"], [2962.0, "Maksatların haramlığı şeklinde haram kılınan şeyi ancak zaruretler mubah kılar."], [2966.5, "Yine kaidelerde yerleşmiş olan şudur:"], [2969.8, "Başkasının yerini tutamadığı her şey zarurettir."], [2973.2, "Sihrin insanı, yüzüne bütün kapıların kapandığı ve önünde sihirbazda tedavi olmaktan başka bir şey bulamadığı bir hâle ulaştırması asla mümkün değildir."], [2987.1, "Zira dua onun giderilmesine sebeptir;"], [2989.0, "rukye de, zamanı uzasa bile, onun giderilmesine sebeptir;"], [2993.3, "sihrin yerini bulmak da onun giderilmesine sebeptir."], [2997.7, "Onu gidermenin yolları çok olduğuna göre zaruret mertebesine ulaşması mümkün değildir;"]]}, {"reader": false, "ar": [[3005.0, "فلا ينبغي أن نستعمل فيه ما كان محرَّمًا تحريمَ مقاصد."], [3013.0, "ولأنّ الأدلّة دلّت على أنه يجب الحذرُ من السحر والسحرة،"], [3019.7, "ويحرُم إتيانُهم وسؤالُهم وتصديقُ أخبارهم،"], [3025.0, "فإذا أجزنا للإنسان أن يأتي إليهم فإننا نهدم كلَّ ذلك."]], "tr": [[3005.0, "dolayısıyla onda maksatların haramlığı şeklinde haram kılınmış bir şeyi kullanmamız uygun değildir."], [3013.0, "Bir de deliller, sihirden ve sihirbazlardan sakınmanın vâcip olduğunu, onlara gitmenin, onlara soru sormanın ve haberlerini tasdik etmenin haram olduğunu göstermiştir."], [3026.4, "İnsanın onlara gitmesini caiz görürsek bütün bunları yıkmış oluruz."]]}, {"reader": false, "ar": [[3033.0, "وسدًّا لذريعة فساد التوحيد؛"], [3035.2, "فإنّ الإنسان إذا طال عليه زمنُ الأذى بسبب السحر،"], [3040.2, "فإنه لو ذهب إلى ساحرٍ ليحُلّ عنه،"], [3044.0, "فوالله لو أمره أن يكفر لكفر،"], [3047.2, "أو أمره أن يذبح لغير الله لذبح."], [3051.0, "وإن صبر واحدٌ أو اثنان فليس ذلك بالضرورة أن يكون للجميع؛"], [3058.0, "فلا بدّ من سدّ هذا الباب؛"], [3060.1, "لأننا لو فتحناه لكان خطرًا على التوحيد والإيمان."]], "tr": [[3033.0, "Bir de tevhidin bozulmasının zerîasını kapatmak için (haramdır)."], [3036.8, "Zira sihir sebebiyle eziyet süresi uzayan insan, (sihri) kendisinden çözmesi için bir sihirbaza gitse, vallahi (sihirbaz) ona küfre girmesini emretse küfre girer, ya da Allah'tan başkası için kurban kesmesini emretse keser."], [3051.6, "Bir veya iki kişi sabretse bile, bunun herkes için olması zorunlu değildir."], [3058.0, "Bu kapıyı mutlaka kapatmak gerekir;"], [3059.8, "çünkü onu açsaydık tevhid ve iman için bir tehlike olurdu."]]}, {"reader": false, "ar": [[3063.0, "ولأنّ كلَّ ساحرٍ يؤذي فإنه سيُخرج نفسَه مَخرجَ من يحُلّ لا من يعقد،"], [3073.0, "فنجعل له مكانًا في المجتمع؛"], [3077.0, "بمعنى أنه إنما يُبطل أثرَ السحرة الآخرين وهو لا يعقد شيئًا."], [3084.0, "فلربما يدخل كثيرٌ من السحرة على المجتمع من هذا الباب،"], [3091.0, "فيضُرّون بالمجتمع من حيث يُظهرون أنهم يريدون الإحسان."], [3099.0, "فلو جاء أحدٌ لعقابه أو لمؤاخذته فقال:"], [3103.3, "إنما أنا أحُلّ السحرَ ولا أعقده،"], [3107.0, "أحُلّ السحرَ ولا أعقده."]], "tr": [[3063.0, "Bir de eziyet veren her sihirbaz kendini düğümleyen değil çözen biri olarak gösterecek ve biz ona toplumda bir yer açmış olacağız;"], [3078.3, "yani \"O sadece diğer sihirbazların etkisini iptal ediyor, kendisi hiçbir şey düğümlemiyor\" (denecek)."], [3086.1, "Belki birçok sihirbaz topluma bu kapıdan girecek ve iyilik yapmak istediklerini gösterirken topluma zarar verecekler."], [3099.0, "Biri onu cezalandırmak veya hesaba çekmek için gelse, \"Ben sadece sihri çözüyorum, düğümlemiyorum; sihri çözüyorum, düğümlemiyorum\" der."]]}, {"reader": false, "ar": [[3110.0, "فإن قلتَ: وكيف نقول في قول سعيد بن المسيّب ـ رحمه الله تعالى ـ لمّا سُئل عن النُّشرة فقال:"], [3118.5, "«لا بأس به، إنما يريدون به الإصلاح، وأمّا ما ينفع فلا بأس به»،"], [3129.0, "أو كما قال رحمه الله تعالى،"], [3133.0, "وهو في «صحيح البخاري» معلَّقًا بصيغة الجزم؟"], [3136.0, "فنقول: إنه لا ينبغي أبدًا أن نقبل قولَ أحدٍ من العلماء ـ كائنًا من كان ـ إذا ثبتت مخالفتُه للأدلّة الصحيحة الصريحة."], [3147.0, "وقد ثبت عن النبيّ صلى الله عليه وسلم أنه حرّم السحرَ تحريمَ إطلاق،"], [3153.0, "والأدلّةُ الكثيرة حرّمت السحرَ وتعاطيَه وتعلُّمَه وتعليمَه والعملَ به على وجه الإطلاق والعموم،"], [3160.0, "فلا يجوز أن نخُصّ بها حالةً دون حالة."]], "tr": [[3110.0, "Eğer \"Saîd b. el-Müseyyeb'in —Allah ona rahmet etsin— nüşre hakkında sorulduğunda söylediği şu söz hakkında ne diyeceğiz:"], [3117.0, "'Onda bir sakınca yoktur; onunla ancak ıslahı istiyorlar."], [3120.8, "Fayda veren şeyde ise bir sakınca yoktur' —ya da (Allah ona rahmet etsin) onun dediği gibi— ki bu söz 'Sahîh-i Buhârî'de cezm sîgasıyla muallak olarak vardır?\" dersen, deriz ki:"], [3137.6, "Âlimlerden kim olursa olsun herhangi birinin sözünü, sahih ve sarih delillere muhalefeti sabit olduğunda kabul etmemiz asla uygun değildir."], [3146.1, "Peygamber sallallâhu aleyhi ve sellem'den sihri mutlak olarak haram kıldığı sabit olmuştur."], [3150.7, "Pek çok delil, sihri, onunla uğraşmayı, onu öğrenmeyi, öğretmeyi ve onunla amel etmeyi mutlak ve umumi olarak haram kılmıştır;"], [3158.9, "dolayısıyla onları bir hâle tahsis edip diğerini dışarıda bırakmamız caiz değildir."]]}, {"reader": false, "ar": [[3164.0, "ثم لا ينبغي أن نسوِّغ الذهابَ لمن نفى اللهُ عز وجل عنه الفلاحَ بصيغة الإطلاق في قوله عز وجل:"], [3172.6, "<span class=\"ayah\">﴿وَلَا يُفْلِحُ السَّاحِرُ حَيْثُ أَتَىٰ﴾<\/span> <span class=\"ref\">[طه: ٦٩]<\/span>؛"], [3175.0, "فكيف نُحسن الظنَّ بأنه سيحُلّ عنّا السحرَ من وصفه اللهُ عز وجل بنفي الفلاح على وجه الإطلاق؟!"], [3183.0, "ولكنّ الذي ينبغي أن يُحمَل كلامُ العلماء ـ ما استطعنا ـ على المحامل المقبولة."]], "tr": [[3164.0, "Sonra Allah Azze ve Celle'nin <span class=\"ayah\">﴿Sihirbaz nereye gelirse gelsin kurtuluşa eremez﴾<\/span> [Tâhâ 69] sözünde mutlak sîgayla kendisinden felahı nefyettiği kimseye gitmeyi meşru göstermemiz uygun değildir."], [3175.5, "Allah Azze ve Celle'nin mutlak olarak felahı nefyetmekle nitelediği kimsenin bizden sihri çözeceği hususunda nasıl hüsnüzan besleyebiliriz?!"], [3183.6, "Fakat yapılması gereken, âlimlerin sözünü gücümüz yettiğince makbul manalara hamletmektir."]]}, {"reader": false, "ar": [[3190.0, "وهي أنه سُئل: أيُحَلّ عنه أو يُنشَر؟"], [3194.7, "إذن سُئل عن أيّ أمر؟"], [3198.0, "سُئل عن أمرين: أيُحَلّ عن هذا المسحور أو يُنشَر؟"], [3203.6, "إذن سُئل عن حلّ السحر،"], [3205.7, "وسُئل عن النُّشرة. وأنتم تعلمون أنّ النُّشرة تنقسم إلى قسمين،"], [3211.9, "وليست قسمًا واحدًا: فإنّ النُّشرة قد تكون بسحرٍ مثله،"], [3219.7, "وهذه النُّشرة المحرّمة التي ثبت عن كثيرٍ من الصحابة والسلف أنهم حرّموها،"], [3225.0, "والتي وصفها النبيُّ صلى الله عليه وسلم بأنها «من عمل الشيطان»،"], [3230.0, "ولا يمكن أن يُحمَل كلامُ سعيد بن المسيّب على ذلك."]], "tr": [[3190.0, "Şöyle ki: Ona \"Ondan (sihir) çözülür mü, yoksa nüşre mi yapılır?\" diye soruldu."], [3197.3, "O hâlde hangi iş hakkında soruldu?"], [3201.9, "İki iş hakkında soruldu: Bu sihirlenmiş kişiden (sihir) çözülür mü, yoksa nüşre mi yapılır?"], [3207.7, "O hâlde sihri çözmek hakkında ve nüşre hakkında soruldu."], [3213.3, "Bilirsiniz ki nüşre tek kısım değil, iki kısma ayrılır:"], [3220.1, "Nüşre benzeri bir sihirle olabilir;"], [3222.3, "bu, sahabeden ve seleften birçoğunun haram kıldığı sabit olan ve Peygamber sallallâhu aleyhi ve sellem'in \"şeytanın amelinden\" olmakla nitelediği haram nüşredir."], [3230.6, "Saîd b. el-Müseyyeb'in sözünün buna hamledilmesi mümkün değildir."]]}, {"reader": false, "ar": [[3233.0, "وإنما يُحمَل كلامُه على النُّشرة الأخرى:"], [3236.3, "وهي النُّشرة بالأدعية والرُّقى والتعاويذ والأدوية المباحة التي ليس فيها محظور،"], [3242.3, "ولا بأس به؛ يعني:"], [3244.6, "أيُحَلّ عنه بالنُّشرة الجائزة؟"], [3247.0, "أيُنشَر عنه بالنُّشرة الجائزة؟"], [3250.0, "فقال: «لا بأس به، إنما يريدون به الإصلاح»."], [3254.0, "وهذا وإن كان فيه شيءٌ من التكلُّف،"], [3259.0, "إلا أنه لا بدّ أن نحمل كلامَه عليه."]], "tr": [[3233.0, "Onun sözü ancak diğer nüşreye hamledilir:"], [3235.2, "Bu, dualar, rukyeler, muskalar (taâvîz) ve içinde yasak bir şey bulunmayan mubah ilaçlarla yapılan nüşredir;"], [3242.3, "bunda bir sakınca yoktur. Yani \"Ondan caiz nüşre ile (sihir) çözülür mü?"], [3247.8, "Ona caiz nüşre ile nüşre yapılır mı?\" (diye soruldu) ve o da \"Onda bir sakınca yoktur;"], [3255.4, "onunla ancak ıslahı istiyorlar\" dedi."], [3258.3, "Bunda biraz zorlama olsa da, onun sözünü buna hamletmemiz gerekir."]]}, {"reader": false, "ar": [[3262.0, "فإن قلتَ: وكيف نقول في قول الحسن أيضًا:"], [3265.1, "«لا يحُلّ السحرَ إلا ساحر»؟"], [3267.0, "فنقول: إنما قاله في مقام الذمّ لا المدح؛"], [3271.0, "لأنه سُئل عن أناسٍ يحُلّون السحر،"], [3275.0, "فقال: إنّ الذي يتعلّم حلَّ السحر غالبًا يكون ساحرًا."], [3282.0, "فقيل في مقام الذمّ لا في مقام المدح."]], "tr": [[3262.0, "Eğer \"Hasan'ın 'Sihri ancak sihirbaz çözer' sözü hakkında da ne diyeceğiz?\" dersen, deriz ki:"], [3267.0, "Bunu ancak övme makamında değil yerme makamında söylemiştir."], [3270.6, "Çünkü ona sihir çözen insanlar hakkında soruldu;"], [3275.0, "o da \"Sihir çözmeyi öğrenen kişi çoğunlukla sihirbazdır\" dedi."], [3281.0, "Dolayısıyla (bu söz) övme makamında değil yerme makamında söylenmiştir."]]}]}, {"ts": "54:47", "title": "Kapanış", "paras": [{"reader": false, "ar": [[3287.0, "ولي رسالةٌ مختصرةٌ ألّفتُها قديمًا اسمها:"], [3296.8, "«حكمُ حلّ السحر بالسحر»،"], [3300.0, "لمّا انتشرت بعضُ الفتاوى التي تُجيز حلَّ السحر بالسحر،"], [3305.0, "وذكرتُ فيها الأدلّةَ من الكتاب ومن السنّة ومن مقاصد الشريعة والقواعد المقرَّرة ما يتبيّن للناظر فيه ـ إن شاء الله ـ صحّةُ هذا القول."]], "tr": [[3287.0, "Sihri sihirle çözmeyi caiz gören bazı fetvalar yayıldığında eskiden yazdığım \"Sihri Sihirle Çözmenin Hükmü\" adında muhtasar bir risalem var."], [3305.0, "Onda Kitap'tan, Sünnet'ten, şeriatin maksatlarından ve yerleşik kaidelerden, ona bakan kimse için inşallah bu görüşün doğruluğunun ortaya çıkacağı delilleri zikrettim."]]}, {"reader": false, "ar": [[3316.0, "لعلّنا نكتفي بهذا القدر،"], [3317.7, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[3316.0, "Belki bu kadarıyla yetiniriz. Allah en yüce olandır ve en iyisini bilendir."], [3319.4, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
