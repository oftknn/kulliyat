<script>
const D={"no": 51, "vid": "F8_fiAYt3D0", "title_ar": "الدرس (٥١) من شرح كليات العقيدة — من كليات باب السحر", "title_tr": "Şerhu Külliyyâti'l-Akîde — 51. Ders: Sihir Babı Külliyeleri (Sihrin Hakikati, Büyük ve Küçük Küfür, Sihirbazın Öldürülmesi, Sihirlenmiş Kişinin Fiilleri, Sihrin Tedavisi ve Sihri Sihirle Çözme)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Başkasına gizli şeytânî bir güçle yapılan her etki sihirdir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.3, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.7, "وعلى آله وأصحابه، ومن تبعهم بإحسانٍ إلى يوم الدين،"], [10.9, "أمّا بعد: فلا نزال في سياق كلّيّات توحيد الألوهيّة،"], [15.8, "وعندنا في هذا الدرس جُمَلٌ من الكلّيّات في باب السحر،"], [21.4, "في باب السحر. وحاولتُ أن أجمع مسائلَه وجزئيّاتِه في جُمَلٍ من الكلّيّات،"], [28.8, "وهي كما يلي. الكلّيّة الأولى:"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.9, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [13.7, "Bundan sonra: Hâlâ ulûhiyyet tevhidi külliyeleri bağlamındayız."], [18.1, "Bu derste sihir babında, sihir babında birtakım külliyeler var."], [23.0, "Bu babın meselelerini ve cüz'iyyâtını birtakım külliyelerde toplamaya çalıştım; bunlar şöyledir. 1. külliye:"]]}, {"reader": false, "ar": [[32.0, "<b>كلُّ تأثيرٍ على الغير بقوّةٍ شيطانيّةٍ خفيّةٍ فسِحر.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[32.0, "<b>1. külliye: Başkası üzerinde gizli şeytânî bir güçle yapılan her etki sihirdir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[56.0, "وهذا هو حقيقةُ السحر:"], [58.8, "وهي أنه عبارةٌ عن تأثيرٍ شيطانيّ،"], [63.0, "يستعين فيه الساحرُ بشيءٍ من القوّة الشيطانيّة حتى يؤثّر على الآخرين."], [71.0, "وتكاد كلمةُ علماء اللغة تُجمِع على هذا المعنى اللغويّ في السحر؛"], [78.0, "فهذا الأزهريّ وغيره ينصّون على أنّ السحر:"], [82.5, "ما خفي ولطُف سببُه."], [85.0, "فقال الأزهريّ: «وأصلُ السحر صرفُ الشيء عن حقيقته إلى غيره بسببٍ خفيّ، فكأنّ الساحر لمّا أرى الباطلَ في صورة الحقّ، وخيّل الشيءَ على غير حقيقته، قد سحر الشيءَ عن وجهه»، أي: صرفه."]], "tr": [[56.0, "Sihrin hakikati budur: O, sihirbazın başkalarını etkilemek için şeytânî güçten bir şeyin yardımını aldığı şeytânî bir etkiden ibarettir."], [67.8, "Dil âlimlerinin sözü, sihirdeki bu lügavî anlam üzerinde neredeyse ittifak eder."], [74.8, "İşte Ezherî ve başkaları, sihrin \"sebebi gizli ve ince olan şey\" olduğunu açıkça söylerler."], [83.7, "Ezherî şöyle demiştir: \"Sihrin aslı, bir şeyi gizli bir sebeple hakikatinden başka bir şeye çevirmektir."], [93.0, "Sihirbaz bâtılı hak suretinde gösterip bir şeyi hakikatinden farklı hayal ettirince, sanki o şeyi yüzünden sihirlemiş\" yani onu çevirmiş olur."]]}, {"reader": false, "ar": [[103.0, "وليس المهمُّ عندنا تعريفَه لغةً،"], [110.0, "وإنما الكلّيّة تتكلّم عن حقيقة السحر الشرعيّة."], [114.0, "وقد اختلفت عباراتُ أهل السنّة والجماعة في تعريف السحر اصطلاحًا،"], [121.0, "ولكنّ هذه الكلّيّة تجمع لك ما قد قيل في ذلك:"], [127.0, "وهي أنّ حقيقة السحر هو ذلك التأثيرُ على الغير،"], [132.0, "والذي يستعين فيه المؤثِّرُ بقوّةٍ شيطانيّةٍ يتقرّب لها ببعض القرابين،"], [140.0, "ثم تُعينه على تحقيق ما يريده من الشرّ في غيره."]], "tr": [[103.0, "Bizim için önemli olan onun lügat bakımından tarifi değildir;"], [111.7, "külliye, sihrin şer'î hakikatinden bahsetmektedir."], [114.7, "Ehl-i Sünnet ve'l-Cemaat'in sihri ıstılâhen tarif etmedeki ifadeleri farklı olmuştur;"], [121.6, "ama bu külliye bu konuda söylenenleri senin için toplar:"], [127.0, "Sihrin hakikati, başkası üzerinde yapılan o etkidir ki, etkileyen kişi onda bazı kurbanlarla yakınlaştığı şeytânî bir gücün yardımını alır;"], [140.0, "sonra o güç, başkasında istediği kötülüğü gerçekleştirmesinde ona yardım eder."]]}, {"reader": false, "ar": [[143.0, "ولذلك عرّفه أهلُ العلم ـ رحمهم الله تعالى ـ بتعاريفَ ترجع إلى هذه الكلّيّة؛"], [152.0, "فهذا أبو بكرٍ الرازيّ يعرّفه بقوله:"], [156.1, "«هو كلُّ أمرٍ خفيَ سببُه، وتُخُيِّل على غير حقيقته، ويجري مجرى التمويه والخداع»."], [171.0, "وهذا الإمامُ ابنُ قدامة ـ رحمه الله تعالى ـ يعرّفه بقوله:"], [175.8, "«السحرُ عزائمُ ورُقًى وعُقَد، يؤثّر في القلوب والأبدان، فيُمرِض ويقتل، ويفرّق بين المرء وزوجه، ويأخذ أحدَ الزوجين عن صاحبه»."]], "tr": [[143.0, "Bu yüzden ehl-i ilim —Allah onlara rahmet etsin— onu bu külliyeye dönen tariflerle tarif etmiştir."], [150.5, "İşte Ebû Bekir er-Râzî onu şöyle tarif eder:"], [155.5, "\"Sebebi gizli olan, hakikatinden farklı hayal ettirilen ve temvîh (göz boyama) ve aldatma yolunda cereyan eden her iştir.\" İmam İbn Kudâme —Allah ona rahmet etsin— de onu şöyle tarif eder:"], [175.8, "\"Sihir; azimetler, rukyeler ve düğümlerdir;"], [178.0, "kalplere ve bedenlere tesir eder, hasta eder ve öldürür, kişi ile eşinin arasını ayırır ve eşlerden birini diğerinden alıkoyar.\""]]}, {"reader": false, "ar": [[188.0, "وعرّفه بعضُ أهل العلم بقوله:"], [190.7, "«هو عبارةٌ عن أمورٍ دقيقة» ـ أي خفيّة،"], [194.4, "مُوغِلة في الخفاء ـ «يمكن اكتسابُها بالتعلُّم، تُشبه الخارقةَ للعادة، وليس فيها تحدٍّ، أو تجري مجرى التمويه والخداع، تصدر من نفسٍ شرّيرة، تؤثّر في عالم العناصر بغير مباشرةٍ أو بمباشرة»."], [212.0, "وقيل فيه غيرُ ذلك،"], [214.0, "وكلُّ ذلك يرجع إلى إثبات هذه الحقيقة الشرعيّة."]], "tr": [[188.0, "Bazı ehl-i ilim de onu şöyle tarif etmiştir:"], [191.7, "\"O, ince işlerden ibarettir\" —yani gizli, gizlilikte derinleşmiş— \"öğrenmekle kazanılabilir, harikulâdeye benzer ama içinde tehaddî (meydan okuma) yoktur;"], [202.0, "ya da temvîh ve aldatma yolunda cereyan eder;"], [205.5, "kötü bir nefisten sâdır olur ve unsurlar âlemine dolaylı veya doğrudan tesir eder.\" Hakkında bundan başka şeyler de söylenmiştir;"], [215.0, "hepsi bu şer'î hakikatin isbatına döner."]]}, {"reader": false, "ar": [[218.0, "وبه تعلم أنّ السحر عند أهل السنّة والجماعة ينقسم إلى قسمين:"], [224.0, "إلى سحرٍ بالمعنى اللغويّ،"], [226.0, "وإلى سحرٍ بالمعنى الاصطلاحيّ الشرعيّ."], [230.0, "وكلُّ هذين المعنيين سوف تأتينا فيها كلّيّاتٌ بإذن الله عز وجل."]], "tr": [[218.0, "Bununla, Ehl-i Sünnet ve'l-Cemaat'e göre sihrin iki kısma ayrıldığını öğrenirsin:"], [222.7, "lügavî anlamda sihir ve ıstılâhî şer'î anlamda sihir."], [227.6, "Allah Azze ve Celle'nin izniyle bu iki anlamın her biri hakkında bize külliyeler gelecek."]]}]}, {"ts": "03:59", "title": "2. Külliye: Sihri şeytanlara yakınlaşma yoluyla olan herkesin küfrü büyük küfürdür", "paras": [{"reader": false, "ar": [[239.0, "الكلّيّة الثانية: <b>كلُّ من كان سحرُه عن طريق التقرُّب للشياطين فكفرُه أكبر.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[239.0, "<b>2. külliye: Sihri şeytanlara yakınlaşma (takarrub) yoluyla olan herkesin küfrü büyük küfürdür.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[262.0, "وهذه الكلّيّة تتكلّم عن النوع الأوّل من أنواع السحر،"], [270.0, "وهو السحرُ بالمعنى الاصطلاحيّ."], [273.0, "فمتى ما ورد ذمُّ السحر في الأدلّة كتابًا وسنّةً فإنّ المراد به ذلك المعنى الاصطلاحيّ،"], [283.0, "والذي لا يمكن تحقُّقه إلا بوساطة الشياطين."], [287.0, "ولذلك ذهب عامّةُ أهل العلم إلى أنّ السحر كفر؛"], [292.0, "لأنه لا يكون إلا بواسطة الشياطين،"], [295.0, "ويجب على الساحر أن يتقرّب إليهم ليُسلِّطهم على المسحور."]], "tr": [[262.0, "Bu külliye, sihrin çeşitlerinden birinci çeşitten, yani ıstılâhî anlamdaki sihirden bahsetmektedir."], [271.5, "Delillerde, Kitap'ta ve Sünnet'te sihir ne zaman yerilse, ondan kastedilen o ıstılâhî anlamdır;"], [279.5, "o ise ancak şeytanların aracılığıyla gerçekleşebilir."], [284.7, "Bu yüzden ehl-i ilmin geneli sihrin küfür olduğu görüşüne gitmiştir;"], [290.3, "çünkü o ancak şeytanların aracılığıyla olur ve sihirbazın, onları sihirlenen kişiye musallat etmek için onlara yakınlaşması gerekir."]]}, {"reader": false, "ar": [[302.0, "فلا يمكن أبدًا أن يصل الساحرُ إلى السحر بالمعنى الشرعيّ إلا بوساطة الشياطين،"], [311.0, "ولا يمكن للشياطين أن تخدمه إلا إذا تقرّب لهم بأنواع التقرُّب."]], "tr": [[302.0, "Sihirbazın şer'î anlamdaki sihre şeytanların aracılığı olmadan ulaşması asla mümkün değildir;"], [309.4, "şeytanların da ona hizmet etmesi, ancak onlara çeşitli yakınlaşma yollarıyla yakınlaşırsa mümkündür."]]}, {"reader": false, "ar": [[322.0, "فإن قلتَ: وما الأدلّةُ على هذه الكلّيّة؟"], [325.0, "فأقول: الأدلّةُ عليها كثيرة؛"], [328.0, "منها قولُ الله عز وجل:"], [330.0, "<span class=\"ayah\">﴿وَاتَّبَعُوا مَا تَتْلُو الشَّيَاطِينُ عَلَىٰ مُلْكِ سُلَيْمَانَ وَمَا كَفَرَ سُلَيْمَانُ وَلَٰكِنَّ الشَّيَاطِينَ كَفَرُوا يُعَلِّمُونَ النَّاسَ السِّحْرَ وَمَا أُنزِلَ عَلَى الْمَلَكَيْنِ بِبَابِلَ هَارُوتَ وَمَارُوتَ وَمَا يُعَلِّمَانِ مِنْ أَحَدٍ حَتَّىٰ يَقُولَا إِنَّمَا نَحْنُ فِتْنَةٌ فَلَا تَكْفُرْ فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِ بَيْنَ الْمَرْءِ وَزَوْجِهِ وَمَا هُم بِضَارِّينَ بِهِ مِنْ أَحَدٍ إِلَّا بِإِذْنِ اللَّهِ وَيَتَعَلَّمُونَ مَا يَضُرُّهُمْ وَلَا يَنفَعُهُمْ وَلَقَدْ عَلِمُوا لَمَنِ اشْتَرَاهُ مَا لَهُ فِي الْآخِرَةِ مِنْ خَلَاقٍ وَلَبِئْسَ مَا شَرَوْا بِهِ أَنفُسَهُمْ لَوْ كَانُوا يَعْلَمُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٠٢]<\/span>."]], "tr": [[322.0, "Eğer \"Bu külliyenin delilleri nelerdir?\" dersen, derim ki:"], [324.6, "Delilleri çoktur. Bunlardan biri Allah Azze ve Celle'nin şu sözüdür:"], [329.6, "<span class=\"ayah\">﴿Süleyman'ın mülkü (saltanatı) hakkında şeytanların okuyup durduklarına uydular. Süleyman küfre girmedi; fakat şeytanlar küfre girdiler; insanlara sihri ve Bâbil'de Hârût ile Mârût adlı iki meleğe indirileni öğretiyorlardı. Oysa o ikisi, \"Biz ancak bir imtihanız, sakın küfre girme\" demedikçe kimseye (bir şey) öğretmezlerdi. Onlardan, kişi ile eşinin arasını ayıracak şeyler öğreniyorlardı. Hâlbuki onlar Allah'ın izni olmadıkça onunla hiç kimseye zarar veremezler. Kendilerine zarar verecek, fayda vermeyecek şeyleri öğreniyorlardı. Andolsun, onu satın alanın ahirette hiçbir nasibi olmadığını biliyorlardı. Kendilerini karşılığında sattıkları şey ne kötüdür! Keşke bilselerdi﴾<\/span> [Bakara 102]."]]}, {"reader": false, "ar": [[366.0, "قال الإمامُ ابنُ كثيرٍ ـ رحمه الله تعالى ـ:"], [369.3, "«قد استدلّ بعضُهم بهذه الآية على تكفير من تعلّم السحر»."], [374.0, "فإن قلتَ: وما وجهُ الاستدلال بها؟"], [376.3, "فأقول: وجهُ الاستدلال بها من عدّة أمور:"], [379.0, "الأمرُ الأوّل: أنّ الله عز وجل نفى عن سليمان الكفرَ بنفيه عنه تعلُّمَ السحر؛"], [391.0, "فإنك لو تأمّلتَ في سياق الآية لَما وجدتَ أنّ سليمان قد نسبه أحدٌ للكفر،"], [398.0, "ولكنّ الله عز وجل برّأه من تهمة الكفر معلِّلًا ذلك بأنه لم يتعلّم السحر."], [406.0, "فدلّ ذلك على أنّ من تعلّم السحر فإنه لا بدّ وأن يكون موصوفًا بالكفر."]], "tr": [[366.0, "İmam İbn Kesîr —Allah ona rahmet etsin— şöyle demiştir:"], [370.7, "\"Bazıları bu ayeti, sihir öğrenenin tekfirine delil getirmiştir.\" Eğer \"Onunla istidlalin vechi nedir?\" dersen, derim ki:"], [378.6, "Onunla istidlalin vechi birkaç yöndendir."], [381.7, "Birinci yön: Allah Azze ve Celle, Süleyman'dan sihir öğrenmeyi nefyederek küfrü nefyetmiştir."], [393.0, "Zira ayetin siyakını düşünürsen, kimsenin Süleyman'ı küfre nispet ettiğini görmezsin;"], [399.1, "ama Allah Azze ve Celle onu, sihir öğrenmediği gerekçesiyle küfür ithamından berî kılmıştır."], [407.6, "Bu da sihir öğrenenin mutlaka küfürle nitelenmesi gerektiğini gösterir."]]}, {"reader": false, "ar": [[413.0, "وتأمّل معي قولَ الله عز وجل:"], [419.0, "<span class=\"ayah\">﴿وَلَقَدْ عَلِمُوا لَمَنِ اشْتَرَاهُ مَا لَهُ فِي الْآخِرَةِ مِنْ خَلَاقٍ﴾<\/span> <span class=\"ref\">[البقرة: ١٠٢]<\/span>؛"], [424.0, "فقولُه: <span class=\"ayah\">﴿خَلَاقٍ﴾<\/span> نكرة، وهي نكرةٌ في سياق النفي،"], [430.0, "والمتقرِّر في القواعد أنّ النكرة في سياق النفي تعُمّ؛"], [435.0, "بمعنى أنه ليس له ولا مطلقُ الحظّ ولا مطلقُ النصيب في الآخرة."], [440.0, "وهذا الوعيدُ أبدًا لم يُطلَق إلا فيما هو كفرٌ لا بقاءَ للإيمان معه أبدًا؛"], [447.0, "فإنّ المؤمن إن مات على شيءٍ من الإيمان فمهما بلغ عذابُه في الآخرة فإنّ معه مطلقَ النصيب ومطلقَ الحظّ ليخرج من جهنّم يومًا من الدهر،"], [458.0, "وإن أصابه قبل ذلك ما أصابه."]], "tr": [[413.0, "Benimle birlikte Allah Azze ve Celle'nin şu sözünü düşün:"], [419.6, "<span class=\"ayah\">﴿Andolsun, onu satın alanın ahirette hiçbir nasibi olmadığını biliyorlardı﴾<\/span> [Bakara 102]."], [424.7, "<span class=\"ayah\">﴿Nasib (halâk)﴾<\/span> kelimesi nekiredir ve nefy siyakında bir nekiredir."], [430.6, "Kaidelerde yerleşmiş olan şudur: Nefy siyakındaki nekire umum ifade eder."], [435.4, "Yani onun ahirette ne mutlak bir payı ne de mutlak bir nasibi vardır."], [440.0, "Bu tehdit, imanın kendisiyle asla bâki kalmadığı bir küfür hakkında olmadıkça asla mutlak olarak söylenmemiştir."], [446.5, "Zira mümin, imandan bir şey üzere ölürse, ahiretteki azabı ne kadar büyük olursa olsun, ondan önce başına ne gelirse gelsin, onunla birlikte zamanın bir gününde cehennemden çıkmasını sağlayacak mutlak bir nasip ve mutlak bir pay vardır."]]}, {"reader": false, "ar": [[460.0, "فلمّا وصف اللهُ عز وجل من تعلّم السحرَ وعلّمه بأنه ليس له في الآخرة من خلاق،"], [468.0, "علِمنا بأنه يموت على أصل الكفر،"], [470.0, "فليس معه لا أصلُ الإيمان ولا أصلُ الإسلام؛"], [474.0, "فإنه ما من مؤمنٍ إلا ولا بدّ وأن يدخل الجنّة،"], [478.0, "وكفى بدخول الجنّة خلاقًا،"], [480.4, "ولا يدخل الجنّةَ إلا نفسٌ مؤمنة."]], "tr": [[460.0, "Allah Azze ve Celle sihri öğrenen ve öğreteni ahirette hiçbir nasibi olmamakla nitelendirince, onun küfrün aslı üzere öldüğünü bildik;"], [469.3, "onunla birlikte ne imanın aslı ne de İslâm'ın aslı vardır."], [474.4, "Zira her mümin mutlaka cennete girer;"], [477.2, "nasip olarak cennete girmek yeter."], [479.8, "Cennete ancak mümin bir nefis girer."]]}, {"reader": false, "ar": [[484.0, "ثم تأمّل معي أيضًا قولَ الله عز وجل:"], [489.0, "<span class=\"ayah\">﴿وَلَوْ أَنَّهُمْ آمَنُوا وَاتَّقَوْا لَمَثُوبَةٌ مِّنْ عِندِ اللَّهِ خَيْرٌ لَّوْ كَانُوا يَعْلَمُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٠٣]<\/span>؛"], [496.0, "فجعل تعلُّمَ السحر مضادًّا للإيمان."], [502.0, "فهذا دليلٌ على أنّ من دخل في السحر وتعلّمه فإنه لا يبقى معه مطلقُ الإيمان؛"], [509.0, "بمعنى أنّ الساحر قد استبدل الكفرَ بالإيمان،"], [513.0, "فدفع الإيمانَ واشترى الكفر."]], "tr": [[484.0, "Sonra benimle birlikte Allah Azze ve Celle'nin şu sözünü de düşün:"], [490.5, "<span class=\"ayah\">﴿Eğer onlar iman edip takvâ sahibi olsalardı, Allah katındaki sevap elbette daha hayırlı olurdu; keşke bilselerdi﴾<\/span> [Bakara 103]."], [502.5, "(Allah) sihir öğrenmeyi imana zıt kılmıştır."], [505.3, "Bu, sihre girip onu öğrenen kimsede mutlak imanın kalmadığına delildir."], [509.6, "Yani sihirbaz imanı küfürle değiştirmiştir;"], [512.4, "imanı verip küfrü satın almıştır."]]}, {"reader": false, "ar": [[518.0, "وتأمّل معي قولَه عز وجل:"], [522.0, "<span class=\"ayah\">﴿وَلَا يُفْلِحُ السَّاحِرُ حَيْثُ أَتَىٰ﴾<\/span> <span class=\"ref\">[طه: ٦٩]<\/span>؛"], [527.0, "والمتقرِّر في قواعد الأصول أنّ الفعل المضارع إذا ورد في سياق النفي فإنه يفيد الإطلاق،"], [535.0, "وبعضُ الأصوليّين قال: يفيد العموم،"], [538.7, "والخلافُ لفظيّ؛ يعني بمعنى أنّ جميع أنواع الفلاح منتفيةٌ عنه."], [548.0, "وهذا التركيبُ لا يُذكَر في الدليل إلا في حقّ من كفر وخرج عن دائرة الإسلام بالكلّيّة."], [558.0, "فمتى ما رأيتَ فعلَ الفلاح منفيًّا في الأدلّة فاعلم أنّ المراد به نفيُ مطلق الفلاح."], [567.0, "فإذا تعلّم الإنسانُ السحرَ أو علّمه فإنه يُعتبر منفيًّا عنه كلُّ أنواع الفلاح."]], "tr": [[518.0, "Benimle birlikte O'nun Azze ve Celle şu sözünü düşün:"], [524.4, "<span class=\"ayah\">﴿Sihirbaz nereye gelirse gelsin kurtuluşa eremez﴾<\/span> [Tâhâ 69]."], [530.0, "Usûl kaidelerinde yerleşmiş olan şudur:"], [532.5, "Muzâri fiil nefy siyakında gelirse ıtlak (mutlaklık) ifade eder;"], [538.7, "bazı usûlcüler \"umum ifade eder\" demiştir;"], [544.9, "ihtilaf lafzîdir. Yani felahın (kurtuluşun) bütün çeşitleri ondan nefyedilmiştir."], [551.5, "Bu terkip delilde ancak küfre giren ve İslâm dairesinden tamamen çıkan kimse hakkında zikredilir."], [559.8, "Delillerde felah fiilinin nefyedildiğini ne zaman görürsen, bilesin ki ondan maksat mutlak felahın nefyidir."], [568.4, "İnsan sihri öğrenir veya öğretirse, felahın bütün çeşitleri ondan nefyedilmiş sayılır."]]}, {"reader": false, "ar": [[578.0, "بل وتأمّل معي أيضًا قولَ الله عز وجل:"], [585.0, "<span class=\"ayah\">﴿وَيَوْمَ يَحْشُرُهُمْ جَمِيعًا يَا مَعْشَرَ الْجِنِّ قَدِ اسْتَكْثَرْتُم مِّنَ الْإِنسِ وَقَالَ أَوْلِيَاؤُهُم مِّنَ الْإِنسِ رَبَّنَا اسْتَمْتَعَ بَعْضُنَا بِبَعْضٍ وَبَلَغْنَا أَجَلَنَا الَّذِي أَجَّلْتَ لَنَا قَالَ النَّارُ مَثْوَاكُمْ خَالِدِينَ فِيهَا إِلَّا مَا شَاءَ اللَّهُ﴾<\/span> <span class=\"ref\">[الأنعام: ١٢٨]<\/span>."]], "tr": [[578.0, "Hatta benimle birlikte Allah Azze ve Celle'nin şu sözünü de düşün:"], [585.0, "<span class=\"ayah\">﴿Onların hepsini topladığı gün (şöyle der): Ey cin topluluğu! İnsanlardan pek çoğunu (saptırıp kendinize) kattınız. Onların insanlardan olan dostları da derler ki: Rabbimiz! Birbirimizden faydalandık ve bize belirlediğin vakte ulaştık. (Allah) der ki: Allah'ın dilediği hariç, içinde ebedî kalmak üzere yeriniz ateştir﴾<\/span> [En'âm 128]."]]}]}, {"ts": "10:04", "title": "2. Külliye (devam): İns ile cinnin birbirinden faydalanması · İcmâ ve âlimlerin nakilleri", "paras": [{"reader": false, "ar": [[604.0, "فاستمتاعُ الإنسيّ بالجنّيّ هو أن يجعل له خوارقَ العادات؛"], [610.0, "فالإنسيّ يستمتع من الجنّيّ بأنه يوصله إلى هذه المرتبة،"], [615.0, "ويقرّب له ما كان بعيدًا،"], [617.8, "وينتقم له ممّن يريد الانتقامَ منه،"], [622.0, "ويؤذي من يريد إيذاءه؛"], [624.0, "وبذلك يستمتع الإنسيّ إذا كانت نفسُه منطويةً على الشرّ."], [629.0, "والجنّيّ في المقابل لا بدّ أن يستمتع بالإنسيّ،"], [634.0, "واستمتاعُه بالإنسيّ إنما هو فيما يقدّمه له الإنسيُّ من الذبائح والقرابين."], [643.0, "وكلّما عظُمت صورةُ الكفر والشرك عظُم ذلك الاستمتاعُ فيما بينهما."]], "tr": [[604.0, "İnsin cinden faydalanması, (cinnin) ona harikulâde şeyler yapmasıdır."], [609.3, "İns cinden, onu bu mertebeye ulaştırması, uzak olanı ona yakınlaştırması, intikam almak istediği kimseden onun intikamını alması ve eziyet etmek istediği kimseye eziyet etmesiyle faydalanır."], [624.6, "Nefsi kötülük barındıran ins bu şekilde faydalanır."], [628.4, "Buna karşılık cin de mutlaka insten faydalanır;"], [633.4, "onun insten faydalanması ise insin ona sunduğu kesilen hayvanlar ve kurbanlardadır."], [640.9, "Küfür ve şirkin sureti büyüdükçe, aralarındaki bu faydalanma da büyür."]]}, {"reader": false, "ar": [[651.0, "وقد جعل اللهُ عز وجل هذا الاستمتاعَ طريقًا موصلًا إلى العذاب الأبديّ والخلود المطلق في ناره."], [660.0, "فلو رأيتَ العلاقةَ بين الساحر والشياطين لوجدتَها علاقةَ استمتاع؛"], [666.0, "فهذا يستمتع بهذا، وهذا يستمتع بهذا،"], [669.2, "وهذا الاستمتاعُ فيما بينهما هو الذي يوصلهم إلى لعنة الله عز وجل وسخطه؛"], [676.0, "فهم يكفرون بالله عز وجل بهذه الأفعال الخبيثة."]], "tr": [[651.0, "Allah Azze ve Celle bu faydalanmayı ebedî azaba ve O'nun ateşinde mutlak olarak ebedî kalmaya götüren bir yol kılmıştır."], [660.0, "Sihirbaz ile şeytanlar arasındaki ilişkiye bakarsan, onu bir faydalanma ilişkisi olarak bulursun:"], [666.5, "Bu ondan faydalanır, o da bundan faydalanır."], [669.7, "Aralarındaki bu faydalanma, onları Allah Azze ve Celle'nin lânetine ve gazabına ulaştıran şeydir."], [675.5, "Onlar bu habis fiillerle Allah Azze ve Celle'yi inkâr ederler."]]}, {"reader": false, "ar": [[681.0, "فهذا النوعُ من أنواع السحر لا يمكن أن يصل إليه الإنسانُ إلا بالكفر والشرك."], [689.0, "وبناءً عليه فلا يمكن أبدًا أن يصل الإنسانُ إلى المعنى الشرعيّ من السحر إلا إذا كفر وتقرّب وخلع رِبْقةَ الإسلام من عنقه بالكلّيّة."], [701.0, "وقد أجمع على ذلك العلماء؛"], [704.0, "فقد أجمع العلماءُ على أنّ كلَّ من كان سحرُه مبنيًّا على التقرُّب للشياطين وذبحِ توحيده <span class=\"q\">؟ 11:52<\/span> فإنه كافرٌ الكفرَ الأكبر."]], "tr": [[681.0, "Sihrin bu çeşidine insan ancak küfür ve şirkle ulaşabilir."], [687.3, "Buna binaen insanın sihrin şer'î anlamına ulaşması, ancak küfre girer, (şeytanlara) yakınlaşır ve İslâm bağını boynundan tamamen çıkarırsa mümkündür."], [699.8, "Âlimler bu konuda icmâ etmiştir:"], [703.4, "Âlimler, sihri şeytanlara yakınlaşmaya ve tevhidini boğazlamaya <span class=\"q\">؟<\/span> dayanan herkesin büyük küfürle kâfir olduğunda icmâ etmiştir."]]}, {"reader": false, "ar": [[717.0, "قال ابنُ قدامة ـ رحمه الله تعالى ـ:"], [719.0, "«إنّ تعلُّم السحر وتعليمَه حرام، لا نعلم فيه خلافًا بين أهل العلم. قال أصحابنا: ويكفُر الساحرُ بتعلُّمه وفعله، سواءٌ اعتقد تحريمَه أو إباحتَه»."], [734.0, "وقال القرطبيّ ـ رحمه الله تعالى ـ:"], [738.0, "«السحرُ لا يتمّ إلا مع الكفر والاستكبار أو تعظيم الشيطان، فالسحرُ إذن دالٌّ على الكفر على هذا التقدير»."]], "tr": [[717.0, "İbn Kudâme —Allah ona rahmet etsin— şöyle demiştir:"], [719.0, "\"Sihri öğrenmek ve öğretmek haramdır;"], [721.1, "bu konuda ehl-i ilim arasında bir ihtilaf bilmiyoruz."], [725.0, "Ashâbımız (Hanbelîler) dediler ki: Sihirbaz, onu haram veya mubah saysın, sihri öğrenmesi ve yapmasıyla kâfir olur.\" Kurtubî —Allah ona rahmet etsin— de şöyle demiştir:"], [741.6, "\"Sihir ancak küfür ve kibirle veya şeytanı tazimle tamamlanır."], [745.5, "Buna göre sihir küfre delâlet eder.\""]]}, {"reader": false, "ar": [[750.0, "وقال أيضًا ـ رحمه الله تعالى ـ:"], [752.1, "«قوله تعالى: <span class=\"ayah\">﴿وَمَا كَفَرَ سُلَيْمَانُ﴾<\/span> <span class=\"ref\">[البقرة: ١٠٢]<\/span>: تبرئةٌ من الله لسليمان، ولم يتقدّم في الآية أنّ أحدًا نسبه إلى الكفر، ولكنّ اليهود نسبته إلى السحر، ولمّا كان السحرُ كفرًا صار بمنزلة من نسبه إلى الكفر. ثم قال: <span class=\"ayah\">﴿وَلَٰكِنَّ الشَّيَاطِينَ كَفَرُوا﴾<\/span> <span class=\"ref\">[البقرة: ١٠٢]<\/span>، فأثبت كفرَهم بتعليم السحر». انتهى كلامه."]], "tr": [[750.0, "Yine o —Allah ona rahmet etsin— şöyle demiştir:"], [752.6, "\"Yüce Allah'ın <span class=\"ayah\">﴿Süleyman küfre girmedi﴾<\/span> [Bakara 102] sözü, Allah'tan Süleyman için bir tebriyedir."], [758.7, "Ayette daha önce kimsenin onu küfre nispet ettiği geçmemiştir;"], [761.0, "ama Yahudiler onu sihre nispet etmişlerdi."], [764.0, "Sihir küfür olunca, (bu) onu küfre nispet etmek yerine geçti."], [767.5, "Sonra <span class=\"ayah\">﴿fakat şeytanlar küfre girdiler﴾<\/span> [Bakara 102] buyurdu ve sihir öğretmeleri sebebiyle küfürlerini isbat etti.\" Sözü bitti."]]}, {"reader": false, "ar": [[774.0, "وقال الإمامُ أحمدُ بنُ حمدان الحنبليّ ـ رحمه الله تعالى ـ:"], [779.0, "«السحرُ ثابتٌ موجودٌ له حقيقة، لكنه حرامٌ يكفُر معلِّمُه ومتعلِّمُه»."], [789.0, "انتهى كلامه. والنقولُ عن أهل العلم في ذلك كثيرةٌ جدًّا."]], "tr": [[774.0, "İmam Ahmed b. Hamdân el-Hanbelî —Allah ona rahmet etsin— şöyle demiştir:"], [779.0, "\"Sihir sabittir, mevcuttur, hakikati vardır;"], [781.4, "fakat haramdır; onu öğreten de öğrenen de kâfir olur.\" Sözü bitti."], [791.0, "Ehl-i ilimden bu konudaki nakiller pek çoktur."]]}, {"reader": false, "ar": [[794.0, "قال الإمامُ محمدُ بنُ عبد الوهّاب ـ رحمه الله تعالى ـ وهو يذكر نواقضَ الإسلام العشر،"], [801.0, "قال: «من أعظم نواقض الإسلام عشرة»،"], [804.0, "ثم ذكر منها: «السابع: السحر، ومنه الصَّرْف والعَطْف، فمن فعله أو رضي به كفر»."], [811.0, "وقال في موضعٍ آخر:"], [812.9, "«يحرُم تعلُّم السحر وتعليمُه وفعلُه، وهو عُقَدٌ ورُقًى وكلامٌ يتكلّم به أو يكتبه، أو يعمل شيئًا يؤثّر في بدن المسحور أو عقله أو قلبه من غير مباشرة، وله حقيقة؛ فمنه ما يقتل، ومنه ما يُمرِض، ومنه ما يأخذ الرجلَ عن امرأته، ومنه ما يفرّق بين المرء وزوجته، ومنه ما يُبغِّض أحدَهما إلى الآخر، ويُحبِّب بين اثنين. ويكفُر بتعلُّمه وفعله، سواءٌ اعتقد تحريمَه أو إباحتَه، كالذي يركب الجمادَ من مكّة <span class=\"q\">؟ 14:08<\/span> وغيرها فيطير به في الهواء». انتهى كلامه."]], "tr": [[794.0, "İmam Muhammed b. Abdülvehhâb —Allah ona rahmet etsin— İslâm'ı bozan on şeyi zikrederken şöyle demiştir:"], [800.2, "\"İslâm'ı bozan şeylerin en büyükleri ondur.\" Sonra bunlardan şunu zikretmiştir:"], [804.0, "\"Yedincisi: Sihir; sarf (sevgiyi nefrete çevirme) ve atf (sevdirme) da ondandır."], [808.5, "Kim onu yapar veya ona razı olursa kâfir olur.\" Başka bir yerde de şöyle demiştir:"], [814.4, "\"Sihri öğrenmek, öğretmek ve yapmak haramdır."], [816.8, "O; düğümler, rukyeler ve kişinin söylediği veya yazdığı bir söz ya da doğrudan temas olmaksızın sihirlenenin bedenine, aklına veya kalbine tesir eden bir şey yapmasıdır."], [827.1, "Onun hakikati vardır: Kimi öldürür, kimi hasta eder, kimi erkeği karısından alıkoyar, kimi kişi ile eşinin arasını ayırır, kimi birini diğerine sevimsiz gösterir ve iki kişi arasında sevgi oluşturur."], [840.0, "(Sihirbaz) onu haram veya mubah saysın, onu öğrenmesi ve yapmasıyla kâfir olur."], [846.2, "Mekke'den <span class=\"q\">؟<\/span> ve başka yerlerden cansız bir şeye binip onunla havada uçan kimse gibi.\" Sözü bitti."]]}]}, {"ts": "14:14", "title": "3. Külliye: Sihri sırf göz boyamaya ve göz aldatmasına dayanan herkesin küfrü küçük küfürdür", "paras": [{"reader": false, "ar": [[854.0, "الكلّيّة الثالثة: <b>كلُّ من كان سحرُه مبنيًّا على مجرّد التمويه والخداع البصريّ بلا استعانةٍ بالشياطين فكفرُه أصغر.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[854.0, "<b>3. külliye: Sihri, şeytanlardan yardım almaksızın sırf temvîhe (göz boyamaya) ve göz aldatmasına dayanan herkesin küfrü küçük küfürdür.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[895.0, "أقول وبالله التوفيق: وأمثلةُ هذا النوع من السحر كثيرةٌ جدًّا في عصرنا؛"], [905.0, "كالذين يخدعون أبصارَ الناس في لعب الورق،"], [908.0, "وكالذي يُدخل في فمه شيئًا ثم يختفي،"], [912.0, "وكالذي يجعل في يده شيئًا من الكُرات ثم كلّما حرّك يده زادت أعدادُها أو نقصت أعدادُها،"], [921.0, "وكالذي يُخرج الأوراقَ من عدم."]], "tr": [[895.0, "Tevfik Allah'tandır, derim ki: Sihrin bu çeşidinin örnekleri asrımızda pek çoktur:"], [905.0, "Kâğıt oyunlarında insanların gözlerini aldatanlar, ağzına bir şey sokup sonra (o şeyin) kaybolduğu kimse, eline birkaç top alıp elini her oynattığında sayıları artan veya azalan kimse ve yoktan kâğıtlar çıkaran kimse gibi."]]}, {"reader": false, "ar": [[924.0, "وكلُّ ذلك لو تأمّلتَه لَما وجدتَه استعانةً بالشياطين ولا سحرًا بالمعنى الشرعيّ،"], [931.0, "وإنما هو عبارةٌ عن تمويهٍ بصريّ وخفّةِ يد."], [937.0, "وهذا وإن كان يدخل فيه مسمّى السحر،"], [941.0, "إلا أنه لا يُعتبر من السحر بالمعنى الاصطلاحيّ الشرعيّ،"], [946.1, "وإنما هو سحرٌ بالمعنى اللغويّ؛"], [949.0, "لأنه أمرٌ خفيَ ولطُف سببُه."], [952.0, "ولذلك إذا كشف صاحبُ اللعبة لعبتَه لم تعُد مستغربةً فيما لو طبّقها مرّةً أخرى؛"], [960.0, "لأنّ العجب زال بسبب زوال خفائه،"], [966.0, "أو خفاءِ المتعجَّب منه."]], "tr": [[924.0, "Bütün bunları düşünürsen, onu ne şeytanlardan yardım alma ne de şer'î anlamda sihir olarak bulursun;"], [932.5, "o sadece göz boyama ve el çabukluğundan ibarettir."], [938.1, "Bu, sihir adının kapsamına girse de ıstılâhî şer'î anlamdaki sihirden sayılmaz;"], [943.9, "o ancak lügavî anlamda sihirdir;"], [946.7, "çünkü sebebi gizli ve ince bir iştir."], [950.8, "Bu yüzden oyunun sahibi oyununu açığa çıkarırsa, onu bir daha uyguladığında artık garip karşılanmaz;"], [958.1, "çünkü hayret, onun gizliliğinin ya da hayret edilen şeyin gizliliğinin kalkmasıyla ortadan kalkmıştır."]]}, {"reader": false, "ar": [[968.0, "فإن قلتَ: ولماذا لا يكون كفرًا أكبر؟"], [971.3, "نقول: لأنّ من ثبت إسلامُه بيقينٍ فلا يجوز الحكمُ عليه بالكفر والخروج من الملّة إلا بيقين."], [979.0, "وبما أنه سحرٌ بالمعنى اللغويّ،"], [981.1, "ولا يتضمّن تقديمَ شيءٍ من التعبُّدات أو صرفَ شيءٍ منها لغير الله عز وجل،"], [987.0, "فليس هناك شيءٌ يوجب أن نُخرجه أو أن نصفه بأنه كافرٌ الكفرَ الأكبر؛"], [996.3, "فهو لم يرتكب ناقضًا من نواقض الإسلام."]], "tr": [[968.0, "Eğer \"Peki neden büyük küfür olmuyor?\" dersen, deriz ki:"], [971.8, "Çünkü İslâm'ı yakînen sabit olan kimse hakkında ancak yakînle küfür ve milletten çıkma hükmü verilebilir."], [979.0, "Bu, lügavî anlamda bir sihir olduğu ve ibadetlerden bir şeyi Allah Azze ve Celle'den başkasına sunmayı veya yöneltmeyi içermediği için, onu (milletten) çıkarmamızı veya büyük küfürle kâfir olduğunu söylememizi gerektiren bir şey yoktur;"], [997.6, "o, İslâm'ı bozan şeylerden birini işlememiştir."]]}, {"reader": false, "ar": [[1001.0, "ولذلك قال ابنُ تيميّة ـ رحمه الله تعالى ـ:"], [1004.0, "«كما يختصّ قومٌ بخفّة اليد، وقومٌ بالسباحة الغريبة حتى يضطجع أحدُهم على الماء، وكما يختصّ قومٌ بالقِيافة حتى يُباين بها غيرَهم»."], [1022.0, "قاله في معرض تعداد الأشياء التي تدخل في مصافّ السحر بالمعنى اللغويّ."]], "tr": [[1001.0, "Bu yüzden İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1004.0, "\"Nasıl ki bir kavim el çabukluğuyla, bir kavim de biri suyun üzerine uzanıp yatacak kadar garip yüzmeyle ayrılırsa;"], [1018.0, "nasıl ki bir kavim de kıyâfe (iz ve eşkâl sürme) ile başkalarından ayrılacak derecede öne çıkarsa.\" Bunu, lügavî anlamda sihir saflarına giren şeyleri sayma bağlamında söylemiştir."]]}, {"reader": false, "ar": [[1028.0, "وقال النوويّ في «شرح مسلم»:"], [1031.3, "«وأمّا تعلُّمه وتعليمُه فحرام، فإن تضمّن ما يقتضي الكفرَ كفَر، وإلّا فلا. وإذا لم يكن فيه ما يقتضي الكفرَ عُزِّر واستُتيب منه، ولا يُقتَل عندنا، فإن تاب قُبِلت توبتُه»."], [1057.8, "انتهى كلامه. وستأتينا مسألةُ قتل الساحر في كلّيّةٍ خاصّة."]], "tr": [[1028.0, "Nevevî \"Şerhu Müslim\"de şöyle demiştir:"], [1030.0, "\"Onu öğrenmek ve öğretmek ise haramdır."], [1033.3, "Eğer küfrü gerektiren bir şey içerirse (kişi) kâfir olur, aksi hâlde olmaz."], [1048.6, "İçinde küfrü gerektiren bir şey yoksa tazir edilir ve ondan tevbeye çağrılır;"], [1053.5, "bize (Şâfiîlere) göre öldürülmez. Tevbe ederse tevbesi kabul edilir.\" Sözü bitti."], [1059.0, "Sihirbazın öldürülmesi meselesi bize özel bir külliyede gelecek."]]}, {"reader": false, "ar": [[1064.0, "قال الشيخُ سليمانُ بنُ عبد الله ـ رحمه الله تعالى ـ:"], [1068.0, "«وأمّا سحرُ الأدوية والتدخين ونحوه فليس بسحر، وإن سُمِّي سحرًا فعلى سبيل المجاز» ـ أي على سبيل التوسُّع اللغويّ ـ «كتسمية القول البليغ والنميمة سحرًا، ولكنه يكون حرامًا لمضرّته، يُعزَّر من يفعله تعزيرًا بليغًا»."]], "tr": [[1064.0, "Şeyh Süleymân b. Abdullah —Allah ona rahmet etsin— şöyle demiştir:"], [1067.5, "\"İlaçlar, tütsüleme ve benzeriyle yapılan sihir ise sihir değildir."], [1073.0, "Ona sihir denirse bu mecaz yoluyladır\" —yani lügavî genişletme yoluyla— \"beliğ söze ve kovuculuğa sihir denmesi gibi."], [1083.4, "Fakat zararı sebebiyle haram olur;"], [1087.1, "onu yapan ağır bir şekilde tazir edilir.\""]]}, {"reader": false, "ar": [[1092.0, "وقال الشنقيطيّ ـ رحمه الله تعالى ـ في «أضواء البيان»:"], [1096.0, "«وإن كان السحرُ لا يقتضي الكفرَ، كالاستعانة بخواصّ بعض الأشياء من دهاناتٍ وغيرها، فهو حرامٌ حرمةً شديدة، ولكنه لا يبلغ بصاحبه الكفر. هذا هو التحقيق إن شاء الله في هذه المسألة التي اختلف فيها العلماء». انتهى كلامه."]], "tr": [[1092.0, "Şinkîtî —Allah ona rahmet etsin— \"Advâü'l-Beyân\"da şöyle demiştir:"], [1096.0, "\"Eğer sihir, yağlar ve benzeri bazı şeylerin hassalarından yardım almak gibi küfrü gerektirmiyorsa, şiddetli bir haramlıkla haramdır;"], [1108.3, "fakat sahibini küfre ulaştırmaz. Âlimlerin ihtilaf ettiği bu meselede tahkik (doğru görüş) inşallah budur.\" Sözü bitti."]]}, {"reader": false, "ar": [[1117.0, "فدلّ ذلك على أنّ من كان يتعاطى شيئًا من ذلك،"], [1123.0, "من غير أن يترتّب على تعاطيه لهذه الأمور شيءٌ من الاستعانة بالجنّ،"], [1129.0, "ولا الذبحِ لهم، ولا السجودِ لهم،"], [1132.0, "ولا أن يقرّب لهم شيئًا يخرج به من التوحيد والإيمان،"], [1138.0, "فإننا وإن سمّيناه سحرًا،"], [1140.9, "وعزّرناه، واستتبناه، وعاقبناه، إلا أنه لا يُعتبر من السحر الذي يُخرج صاحبَه من دائرة الإسلام. والله أعلم."]], "tr": [[1117.0, "Bu da gösterir ki, bu işlerle uğraşması cinlerden yardım almayı, onlara kurban kesmeyi, onlara secde etmeyi ya da onlara tevhidden ve imandan çıkaracak bir şey sunmayı gerektirmeksizin bunlardan bir şeyle uğraşan kimseye, ona sihir desek, onu tazir etsek, tevbeye çağırsak ve cezalandırsak da, (yaptığı) sahibini İslâm dairesinden çıkaran sihirden sayılmaz. Allah en iyisini bilir."]]}]}, {"ts": "19:09", "title": "4. Külliye: Büyük küfrü gerektiren sihri sabit olanı öldürmek vâciptir; diğerinin öldürülmesi imamın ictihadına kalmıştır", "paras": [{"reader": false, "ar": [[1149.0, "الكلّيّة الرابعة: كلُّ من ثبت عليه السحرُ الموجبُ للكفر الأكبر فالواجبُ قتلُه،"], [1156.9, "وقتلُ غيره مردُّه إلى اجتهاد الإمام. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1149.0, "4. külliye: Büyük küfrü gerektiren sihri üzerinde sabit olan herkesi öldürmek vâciptir;"], [1155.6, "diğerinin öldürülmesi ise imamın (devlet başkanının) ictihadına kalmıştır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1196.0, "أقول وبالله التوفيق: اتّفق العلماءُ ـ رحمهم الله تعالى ـ على أنّ الساحر الذي يستخدم في سحره الشياطين ويستخدم الكفرَ فإنه يكفُر بالسحر،"], [1209.8, "ولا شكّ في ذلك."], [1212.0, "فإذا كان بسبب سحره يسجد للشيطان،"], [1216.0, "ويستعمل الشيطانَ في العُقَد والنَّفْث،"], [1219.0, "فهذا حكمُه بالاتّفاق القتل،"], [1224.0, "فتُضرَب عنقُه، لأدلّةٍ ستأتينا بعد قليلٍ إن شاء الله."]], "tr": [[1196.0, "Tevfik Allah'tandır, derim ki: Âlimler —Allah onlara rahmet etsin— sihrinde şeytanları kullanan ve küfrü kullanan sihirbazın sihirle kâfir olduğunda ittifak etmişlerdir;"], [1210.4, "bunda şüphe yoktur. Sihri sebebiyle şeytana secde ediyor, düğümlerde ve üfürmede şeytanı kullanıyorsa, bunun hükmü ittifakla öldürülmektir;"], [1225.1, "boynu vurulur. Bunun delilleri inşallah birazdan gelecek."]]}, {"reader": false, "ar": [[1233.0, "ولكنّ العلماء اشتدّ خلافُهم في السحر بالنوع الثاني:"], [1238.0, "هل يُقتَل أو لا يُقتَل؟"], [1240.0, "على قولين. والأقربُ منهما أنّ ذلك مردُّه إلى اجتهاد الإمام فيما يراه مناسبًا في حاله؛"], [1248.0, "فإذا رأى الإمامُ أنّ الأنسب أن يُقتَل صاحبُ خفّة اليد لكثرة تعاطي ذلك،"], [1255.0, "ولعظيم فتنته ومضرّته على الناس،"], [1258.6, "فإنه يُقتَل. وإذا رأى أنّ الأفضل أن يستتيبه منه،"], [1263.8, "أو يحبسه، أو يجلده،"], [1266.0, "أو يعزّره بأيّ نوعٍ من أنواع التعزير، فله ذلك."]], "tr": [[1233.0, "Fakat âlimler ikinci çeşit sihirde (sihirbazın) öldürülüp öldürülmeyeceği hususunda şiddetle ihtilaf etmişlerdir;"], [1239.2, "iki görüş vardır. İkisinden (doğruya) en yakın olanı, bunun imamın onun durumu hakkında uygun gördüğüne dair ictihadına kalmış olmasıdır."], [1249.1, "İmam, el çabukluğu sahibinin bunu çokça yapması, fitnesinin ve insanlara zararının büyüklüğü sebebiyle öldürülmesini daha uygun görürse, öldürülür."], [1259.3, "Onu ondan tevbeye çağırmayı, hapsetmeyi, celde vurmayı veya tazir çeşitlerinden herhangi biriyle tazir etmeyi daha faziletli görürse, bu da onun hakkıdır."]]}, {"reader": false, "ar": [[1271.0, "لكن فيما لو رأى الإمامُ أن يقتله فإنّ قتلَه لا يُعتبر قتلَ ردّة،"], [1278.6, "وإنما يُعتبر قتلَ تعزير،"], [1281.0, "أو قتلَ حدٍّ على قول بعض أهل العلم."], [1284.0, "وقد ذهب جماهيرُ أهل العلم ـ رحمهم الله تعالى ـ إلى أنّ الساحر بالنوع الثاني يُقتَل،"], [1293.0, "وقال الشافعيّة: لا يُقتَل بل يُعزَّر."], [1297.0, "وما اخترناه في هذه الكلّيّة يُعتبر وسطًا بين القولين؛"], [1303.0, "لأنّ الأمر لا بدّ وأن يكون مرجعُه إلى اجتهاد الإمام."]], "tr": [[1271.0, "Ancak imam onu öldürmeyi uygun görürse, onun öldürülmesi irtidat sebebiyle öldürme sayılmaz;"], [1278.1, "tazir olarak öldürme veya bazı ehl-i ilmin görüşüne göre had olarak öldürme sayılır."], [1284.0, "Ehl-i ilmin cumhuru —Allah onlara rahmet etsin— ikinci çeşit sihirbazın öldürüleceği görüşüne gitmiştir."], [1292.4, "Şâfiîler ise \"Öldürülmez, bilakis tazir edilir\" demiştir."], [1297.0, "Bu külliyede tercih ettiğimiz görüş iki görüş arasında orta yol sayılır;"], [1304.0, "çünkü işin mercii mutlaka imamın ictihadı olmalıdır."]]}, {"reader": false, "ar": [[1308.0, "فإن قلتَ: وما الدليلُ على أنّ الساحر يُقتَل؟"], [1313.0, "فأقول: لقد استدلّ أهلُ العلم ـ رحمهم الله تعالى ـ بجُمَلٍ من الأدلّة؛"], [1318.0, "فمن الأدلّة ما أخرجه الترمذيّ موقوفًا على جُندَبٍ رضي الله تعالى عنه أنه قال:"], [1330.3, "«حدُّ الساحر ضربةٌ بالسيف»."], [1333.0, "وقد رُوي مرفوعًا إلى النبيّ صلى الله عليه وسلم ولكنه ضعيف،"], [1339.0, "إلا أنه صحيحُ السند موقوفًا،"], [1342.5, "ومثلُه ممّا لا يقال بالرأي؛"], [1348.0, "لأنه إثباتُ قتلٍ وإزهاقُ نفس."], [1351.0, "والمتقرِّر في القواعد أنّ الصحابيّ إذا قال قولًا لا مجال للرأي ولا للاجتهاد فيه فلقوله حكمُ الرفع."]], "tr": [[1308.0, "Eğer \"Sihirbazın öldürüleceğinin delili nedir?\" dersen, derim ki:"], [1312.4, "Ehl-i ilim —Allah onlara rahmet etsin— birtakım delillerle istidlal etmiştir."], [1316.6, "Delillerden biri, Tirmizî'nin Cündeb'e —Allah ondan razı olsun— mevkûf olarak rivayet ettiği şu sözdür:"], [1324.2, "\"Sihirbazın haddi kılıçla bir vuruştur.\" Bu, Peygamber sallallâhu aleyhi ve sellem'e merfû olarak da rivayet edilmiştir, fakat (merfû rivayet) zayıftır."], [1337.9, "Ancak mevkûf olarak senedi sahihtir ve bunun gibisi re'y ile söylenemeyecek şeylerdendir;"], [1344.6, "çünkü bir öldürmeyi isbat etmek ve bir canı almaktır."], [1351.5, "Kaidelerde yerleşmiş olan şudur: Sahâbî, içinde re'ye ve ictihada yer olmayan bir söz söylerse, sözü merfû hükmündedir."]]}, {"reader": false, "ar": [[1362.0, "وتأكّد ذلك بما أخرجه الإمامُ البخاريّ من حديث بَجَالة قال:"], [1367.5, "«كنتُ كاتبًا لجَزْء بن معاوية عمِّ الأحنف بن قيس، فأتانا كتابُ عمرَ قبل موته بسنة: أنِ اقتلوا كلَّ ساحر» ـ وفي رواية:"], [1379.5, "«وساحرة» ـ «وفرِّقوا بين كلّ ذي مَحْرَمٍ من المجوس»،"], [1387.0, "الحديثَ بتمامه. قال ابنُ قدامة ـ رحمه الله تعالى ـ:"], [1393.4, "«هذا اشتهر» ـ أي عن عمر رضي الله تعالى عنه ـ «فلم يُنكَر، فكان إجماعًا»."], [1401.1, "لماذا؟ لأنه بعثه إلى وُلاته على الأقاليم ونشروه في أقاليمهم،"], [1407.0, "ولا يُعرَف عن أحدٍ من أصحاب النبيّ صلى الله عليه وسلم أنه أنكر ذلك على عمر رضي الله عنه، فكان إجماعًا."]], "tr": [[1362.0, "Bu, İmam Buhârî'nin Becâle'den rivayet ettiği şu hadisle teyit edilmiştir:"], [1367.0, "\"Ahnef b. Kays'ın amcası Cez' b."], [1369.5, "Muâviye'nin kâtibiydim. Ömer'in ölümünden bir yıl önce mektubu bize geldi:"], [1374.5, "Her sihirbazı öldürün\" —bir rivayette:"], [1377.2, "\"ve (her) sihirbaz kadını\"— \"ve Mecûsîlerden her mahrem (evlilik) sahibinin arasını ayırın.\" Hadisin tamamı."], [1390.0, "İbn Kudâme —Allah ona rahmet etsin— şöyle demiştir:"], [1394.5, "\"Bu meşhur oldu\" —yani Ömer'den, Allah ondan razı olsun— \"ve inkâr edilmedi;"], [1401.1, "dolayısıyla icmâ oldu.\" Neden? Çünkü onu eyaletlerdeki valilerine gönderdi, onlar da onu eyaletlerinde yaydılar;"], [1408.1, "Peygamber sallallâhu aleyhi ve sellem'in ashâbından hiçbirinin bunu Ömer'e —Allah ondan razı olsun— inkâr ettiği bilinmemektedir; dolayısıyla icmâ oldu."]]}, {"reader": false, "ar": [[1415.0, "ومن الآثار الدالّة على ذلك أيضًا ما رواه مالكٌ في «الموطّأ» من حديث محمد بن عبد الرحمن بن سعد بن زُرارة:"], [1425.0, "أنه بلغه أنّ حفصة زوجَ النبيّ صلى الله عليه وسلم قتلت جاريةً لها سحرتها،"], [1433.0, "وقد كانت دبّرتها ـ أي جعلت عتقَها بعد موتها ـ فأمرت بها فقُتِلت."]], "tr": [[1415.0, "Buna delâlet eden eserlerden biri de Mâlik'in \"Muvatta\"da Muhammed b."], [1419.1, "Abdurrahmân b. Sa'd b. Zürâre'den rivayet ettiği şudur:"], [1423.0, "Ona ulaştığına göre, Peygamber sallallâhu aleyhi ve sellem'in hanımı Hafsa kendisine sihir yapan bir cariyesini öldürtmüştür."], [1431.3, "Onu müdebber yapmıştı —yani azat edilmesini kendi ölümünden sonraya bağlamıştı—; emretti ve (cariye) öldürüldü."]]}, {"reader": false, "ar": [[1442.0, "ومن الآثار الدالّة على ذلك أيضًا ما رواه البخاريّ في «تاريخه الكبير» قال:"], [1449.5, "حدّثنا إسحاق، قال: حدّثنا خالدٌ الواسطيّ،"], [1452.2, "عن خالدٍ الحذّاء، عن أبي عثمان:"], [1455.0, "«كان عند الوليد رجلٌ يلعب، فذبح إنسانًا وأبان رأسه، فجاء جُندَبٌ الأزديّ فقتله»."], [1464.0, "فأنت ترى أنه قد صحّ قتلُ الساحر عن جمعٍ من أصحاب النبيّ صلى الله عليه وسلم:"], [1471.0, "عن عمر، وابنتِه أمِّ المؤمنين حفصة،"], [1474.0, "وعن جُندَب. قال العلماء:"], [1477.5, "ولم يُعلَم لهم مخالفٌ من الصحابة،"], [1482.0, "فكان كالإجماع، أو فكان إجماعًا."]], "tr": [[1442.0, "Buna delâlet eden eserlerden biri de Buhârî'nin \"et-Târîhu'l-Kebîr\"de rivayet ettiği şudur:"], [1447.2, "Bize İshâk anlattı, dedi ki:"], [1449.5, "Bize Hâlid el-Vâsıtî, Hâlid el-Hazzâ'dan, o da Ebû Osmân'dan anlattı:"], [1453.6, "\"Velîd'in yanında oyun oynayan (gösteri yapan) bir adam vardı."], [1458.2, "Bir insanı boğazladı ve başını (gövdesinden) ayırdı."], [1461.8, "Bunun üzerine Cündeb el-Ezdî gelip onu öldürdü.\" Görüyorsun ki sihirbazın öldürülmesi Peygamber sallallâhu aleyhi ve sellem'in ashâbından bir topluluktan sahih olarak sabit olmuştur:"], [1471.5, "Ömer'den, kızı mü'minlerin annesi Hafsa'dan ve Cündeb'den."], [1475.0, "Âlimler dediler ki: Sahabeden onlara muhalefet eden bilinmemektedir;"], [1480.3, "dolayısıyla icmâ gibi oldu, ya da icmâ oldu."]]}, {"reader": false, "ar": [[1486.0, "فإن قلتَ: وهل يُعتبر قتلُه في هذه الحالة ردّةً أو حدًّا؟"], [1493.0, "الجواب: هذا يختلف باختلاف نوع سحره؛"], [1497.0, "فإن قتلناه بناءً على السحر الذي يُخرج صاحبَه من الملّة فلا جرمَ أننا نقتله قتلَ ردّة."], [1506.0, "وأمّا إذا قتلناه بناءً على السحر الذي لا يُخرج صاحبَه من الملّة ـ إذا رأى الإمامُ قتلَه ـ فإننا نقتله قتلَ حدّ."]], "tr": [[1486.0, "Eğer \"Bu durumda onun öldürülmesi irtidat mı sayılır yoksa had mi?\" dersen, cevap şudur:"], [1495.7, "Bu, sihrinin çeşidine göre değişir."], [1499.4, "Onu sahibini milletten çıkaran sihir sebebiyle öldürürsek, şüphesiz onu irtidat sebebiyle öldürürüz."], [1506.6, "Onu sahibini milletten çıkarmayan sihir sebebiyle —imam onun öldürülmesini uygun görürse— öldürürsek, onu had olarak öldürürüz."]]}]}, {"ts": "25:17", "title": "4. Külliye (devam): İrtidat ve had olarak öldürme farkı · Sihirbaz kadın ve zimmî sihirbaz", "paras": [{"reader": false, "ar": [[1517.0, "والفرقانُ بين القتلين ظاهرٌ واضح؛"], [1519.0, "فإنّ من قتلناه قتلَ ردّةٍ فإننا نعامله بعد موته معاملةَ الكفّار،"], [1525.0, "وأمّا من قتلناه قتلَ حدٍّ أو تعزيرٍ فإننا نعامله بعد موته معاملةَ عُصاة الموحِّدين."]], "tr": [[1517.0, "İki öldürme arasındaki fark açık ve nettir:"], [1519.5, "İrtidat sebebiyle öldürdüğümüz kimseye ölümünden sonra kâfirlere davranıldığı gibi davranırız;"], [1525.0, "had veya tazir olarak öldürdüğümüz kimseye ise ölümünden sonra muvahhidlerin günahkârlarına davranıldığı gibi davranırız."]]}, {"reader": false, "ar": [[1533.0, "فإن قلتَ: وهل تُقتَل المرأةُ إذا ثبت أنها ساحرة؟"], [1538.0, "وهل تُقتَل المرأةُ إذا ثبت أنها ساحرة؟"], [1543.0, "فأقول: في ذلك خلافٌ بين أهل العلم رحمهم الله تعالى؛"], [1548.0, "فذهب جمهورُ أهل العلم إلى أنها تُقتَل؛"], [1550.1, "لأنّ العلّة واحدة، والحديثُ عامٌّ مطلق."], [1553.0, "وذهب بعضُ الحنفيّة إلى أنها تُعزَّر وتُستتاب وتُحبَس الحبسَ الطويل،"], [1561.0, "ولكن لا تُقتَل؛ لأنّ النبيّ صلى الله عليه وسلم نهى عن قتل النساء في الجهاد،"], [1567.0, "ولمّا مرّ على امرأةٍ مقتولةٍ قال:"], [1570.5, "«لا ينبغي لمثل هذه أن تُقتَل»."]], "tr": [[1533.0, "Eğer \"Bir kadının sihirbaz olduğu sabit olursa öldürülür mü?"], [1537.4, "Bir kadının sihirbaz olduğu sabit olursa öldürülür mü?\" dersen, derim ki:"], [1544.0, "Bu konuda ehl-i ilim —Allah onlara rahmet etsin— arasında ihtilaf vardır."], [1548.6, "Ehl-i ilmin cumhuru onun öldürüleceği görüşüne gitmiştir;"], [1550.4, "çünkü illet birdir ve hadis âmm ve mutlaktır."], [1554.4, "Bazı Hanefîler ise onun tazir edileceği, tevbeye çağrılacağı ve uzun süre hapsedileceği, fakat öldürülmeyeceği görüşüne gitmiştir;"], [1563.8, "çünkü Peygamber sallallâhu aleyhi ve sellem cihadda kadınların öldürülmesini yasaklamış ve öldürülmüş bir kadının yanından geçince \"Bunun gibisinin öldürülmesi uygun değildir\" buyurmuştur."]]}, {"reader": false, "ar": [[1574.0, "ولكنّ القولَ الحقّ أنها تُقتَل،"], [1578.0, "ولا بدّ من قتلها؛"], [1580.0, "لأنها إذا كان سحرُها من السحر الذي يُخرج من الملّة فإننا نقتلها قتلَ ردّةٍ؛"], [1586.8, "لعموم قول النبيّ صلى الله عليه وسلم:"], [1590.0, "«من بدّل دينَه فاقتلوه»."], [1592.0, "ولأنّ المتقرِّر في القواعد أنّ الحكم يدور مع علّته وجودًا وعدمًا؛"], [1600.0, "فمتى ما ثبت عند القاضي بأنها ساحرةٌ بالمعنى الأوّل ـ أي بالسحر الاصطلاحيّ الشرعيّ ـ فإنها تُعتبر مرتدّة، والمرتدّةُ تُقتَل."]], "tr": [[1574.0, "Fakat hak olan görüş onun öldürüleceği ve öldürülmesinin zorunlu olduğudur."], [1580.5, "Çünkü onun sihri milletten çıkaran sihirdense, Peygamber sallallâhu aleyhi ve sellem'in \"Dinini değiştireni öldürün\" sözünün umumu sebebiyle onu irtidat sebebiyle öldürürüz."], [1590.5, "Ayrıca kaidelerde yerleşmiş olan şudur:"], [1593.4, "Hüküm, varlık ve yokluk bakımından illetiyle birlikte döner."], [1598.9, "Kadı nezdinde onun birinci anlamda —yani ıstılâhî şer'î sihirle— sihirbaz olduğu sabit olursa, mürtede sayılır; mürtede kadın da öldürülür."]]}, {"reader": false, "ar": [[1611.0, "ولعظيم شرّها على الأمّة؛"], [1617.0, "فإنّ النبيّ صلى الله عليه وسلم بيّن لنا أنّ هذه المرأة إنما لا ينبغي أن تُقتَل في الحرب لأنها لم تقاتل ولم تشارك في القتال مع الكفّار،"], [1629.0, "ولكن لو أنها قاتلت وأعانت الكفّار فإنّ الحقّ قتلُها لوجود شرّها."], [1637.0, "فلا ينبغي أن تُقاس المرأةُ الساحرة التي ثبت سحرُها،"], [1641.8, "وثبت أذاها، وثبت شرُّها،"], [1644.0, "وتطاير ضررُها على العباد والبلاد،"], [1646.9, "بامرأةٍ كافرةٍ بقيت في بيتها لم تقاتل ولم يظهر منها أيُّ شرّ؛"], [1653.5, "فإنّ هذا قياسٌ مع الفارق،"], [1656.0, "والمتقرِّر في القواعد أنّ القياس مع الفارق باطلٌ أو فاسد."]], "tr": [[1611.0, "Bir de ümmete olan kötülüğünün büyüklüğü sebebiyle (öldürülür)."], [1618.5, "Zira Peygamber sallallâhu aleyhi ve sellem bize, bu kadının savaşta öldürülmesinin uygun olmamasının, savaşmamış ve kâfirlerle birlikte savaşa katılmamış olmasından dolayı olduğunu açıklamıştır."], [1627.7, "Fakat o savaşsaydı ve kâfirlere yardım etseydi, kötülüğü mevcut olduğu için onu öldürmek hak olurdu."], [1637.0, "Sihri sabit olmuş, eziyeti sabit olmuş, kötülüğü sabit olmuş ve zararı kullara ve beldelere yayılmış sihirbaz kadın, evinde kalıp savaşmamış ve kendisinden hiçbir kötülük görülmemiş kâfir bir kadına kıyas edilmemelidir."], [1652.5, "Zira bu, farklı olana kıyastır (kıyâs mea'l-fârık);"], [1655.5, "kaidelerde yerleşmiş olan da farklı olana kıyasın bâtıl veya fâsid olduğudur."]]}, {"reader": false, "ar": [[1662.0, "فإن قلتَ: وما الحكمُ فيما لو كان الساحرُ من أهل الذمّة ـ أي يهوديٌّ أو نصرانيّ ـ أفنقتله أو لا؟"], [1675.0, "الجواب: فيه خلافٌ بين أهل العلم رحمهم الله تعالى؛"], [1682.0, "فعند أبي حنيفة أنه يُقتَل كما يُقتَل الساحرُ المسلم سواءً بسواء،"], [1689.0, "ولكن ذهب الإمامُ مالكٌ والشافعيّ والإمامُ أحمد إلى أنه لا يُقتَل، بأنه لا يُقتَل."]], "tr": [[1662.0, "Eğer \"Sihirbaz zimmet ehlinden —yani Yahudi veya Hristiyan— olursa hüküm nedir?"], [1671.3, "Onu öldürür müyüz, öldürmez miyiz?\" dersen, cevap şudur:"], [1675.0, "Bu konuda ehl-i ilim —Allah onlara rahmet etsin— arasında ihtilaf vardır."], [1683.3, "Ebû Hanîfe'ye göre o da Müslüman sihirbazın öldürüldüğü gibi aynen öldürülür."], [1690.4, "Fakat İmam Mâlik, Şâfiî ve İmam Ahmed onun öldürülmeyeceği, öldürülmeyeceği görüşüne gitmişlerdir."]]}, {"reader": false, "ar": [[1699.2, "واستدلّوا على ذلك بقصّة سحر النبيّ صلى الله عليه وسلم لمّا سحره لَبِيدُ بنُ الأعصم اليهوديّ؛"], [1709.0, "فإنّ النبيّ صلى الله عليه وسلم لم يتعرّض له بالقتل،"], [1713.0, "وإنما اكتفى بقوله: «أمّا أنا فإنّ الله قد شفاني»؛"], [1719.0, "يعني بمعنى أنّ هذا الرجل لا أتعرّض له بشيء."], [1724.0, "فلو كان الساحرُ الذمّيُّ حقُّه القتلَ لأمر النبيّ صلى الله عليه وسلم بقتله."]], "tr": [[1699.2, "Buna, Yahudi Lebîd b. el-A'sam'ın Peygamber sallallâhu aleyhi ve sellem'e sihir yaptığı kıssayla istidlal ettiler."], [1709.0, "Zira Peygamber sallallâhu aleyhi ve sellem ona öldürmeyle dokunmadı;"], [1712.6, "sadece \"Bana gelince, Allah bana şifa verdi\" sözüyle yetindi."], [1719.0, "Yani \"Bu adama hiçbir şeyle dokunmam\" demektir."], [1723.4, "Zimmî sihirbazın hakkı öldürülmek olsaydı, Peygamber sallallâhu aleyhi ve sellem onun öldürülmesini emrederdi."]]}, {"reader": false, "ar": [[1731.0, "والقولُ الأقربُ إن شاء الله أنه يُقتَل ولا كرامةَ له؛"], [1739.0, "وذلك لعموم الأدلّة، ولأنه بمجرّد سحره وصدور ذلك الأذى العظيم منه على المسلمين،"], [1751.0, "هذا يُعتبر خرقًا لعهده؛"], [1754.0, "فإننا ما عاهدناه ولا أعطيناه ذمّتنا على أن يؤذينا."]], "tr": [[1731.0, "(Doğruya) en yakın görüş inşallah onun öldürüleceği ve onun için hiçbir ikramın olmadığıdır."], [1737.3, "Bu, delillerin umumu sebebiyledir; bir de sırf sihri ve ondan Müslümanlara o büyük eziyetin sâdır olması, ahdini bozmak sayılır."], [1751.8, "Zira biz onunla bize eziyet etmesi üzere ahitleşmedik ve ona bu şart üzere zimmetimizi vermedik."]]}, {"reader": false, "ar": [[1760.0, "وأمّا تركُ قتلِ النبيّ صلى الله عليه وسلم لهذا الساحر فإنه راعى فيه المصلحة؛"], [1769.0, "فإنه رأى أنّ قتله قد يوجب فتنةً عظيمةً فيما بين اليهود وبين المسلمين،"], [1781.0, "فأراد إخمادَ هذه الفتنة،"], [1783.8, "وسدَّ ذريعة ثوران هذه الثورة،"], [1787.2, "بعدم قتله. ومن أهل العلم من قال:"], [1795.3, "بأنّ سحرَ النبيّ من أعظم الذنوب الذي لا يكفّره القتل،"], [1802.0, "فلا يُتعرَّض لمثل هؤلاء الذين عندهم ذنوبٌ عظيمةٌ في مثل ذلك بالقتل،"], [1810.0, "وإنما يُوكَل أمرُهم إلى من؟"], [1812.8, "إلى الله تبارك وتعالى؛"], [1815.0, "لأنه لن يطهّرهم شيءٌ من ذلك أبدًا."]], "tr": [[1760.0, "Peygamber sallallâhu aleyhi ve sellem'in bu sihirbazı öldürmeyi terk etmesine gelince, o bunda maslahatı gözetmiştir."], [1769.7, "Onu öldürmenin Yahudilerle Müslümanlar arasında büyük bir fitneye sebep olabileceğini gördü;"], [1781.0, "onu öldürmeyerek bu fitneyi söndürmek ve bu kargaşanın alevlenmesinin zerîasını kapatmak istedi."], [1793.3, "Ehl-i ilimden bazıları da şöyle demiştir:"], [1797.3, "Peygamber'e sihir yapmak, öldürmenin kefaret olamayacağı en büyük günahlardandır;"], [1804.0, "bu tür büyük günahları olan kimselere öldürmeyle dokunulmaz, onların işi kime bırakılır?"], [1812.2, "Allah Tebâreke ve Teâlâ'ya; çünkü bundan hiçbir şey onları asla temizlemez."]]}]}, {"ts": "30:18", "title": "4. Külliye (sonu): Sihirbazın tevbesi", "paras": [{"reader": false, "ar": [[1818.0, "ولكن حيثما قال أهلُ العلم وتصرّفت أجوبتُهم،"], [1823.0, "إلا أنّ حملَه على تحصيل المصالح وتكميلها،"], [1827.0, "وإغلاقِ باب المفاسد وتقليلها،"], [1829.0, "هو الذي ينبغي أن يُحمَل عليه تركُ قتلِ النبيّ صلى الله عليه وسلم للَبِيد بن الأعصم."]], "tr": [[1818.0, "Ancak ehl-i ilim ne derse desin ve cevapları nasıl değişirse değişsin, Peygamber sallallâhu aleyhi ve sellem'in Lebîd b."], [1828.0, "el-A'sam'ı öldürmeyi terk etmesinin hamledilmesi gereken mana, onu maslahatları elde etmeye ve tamamlamaya, mefsedetler kapısını kapatmaya ve azaltmaya hamletmektir."]]}, {"reader": false, "ar": [[1836.0, "فإن قلتَ: وما الحكمُ فيما لو تاب الساحر؟"], [1844.0, "هل تُقبَل توبتُه؟ الجواب:"], [1847.0, "إذا تاب قبل أن يأتينا،"], [1849.4, "وقبل القدرة عليه، وكانت التوبةُ هي التوبةَ الصادقةَ النصوحَ المستجمِعةَ لشروطها،"], [1854.7, "فلا جرمَ أنّ توبته تُقبَل كسائر الذنوب."], [1858.0, "فإذا كانت توبةُ المشرك من شركه ـ إذا صدقت ـ تُقبَل،"], [1867.7, "فالتوبةُ ممّا دونه من الذنوب من باب أولى."], [1881.0, "وقد قبل اللهُ عز وجل توبةَ سحرة فرعون."]], "tr": [[1836.0, "Eğer \"Sihirbaz tevbe ederse hüküm nedir?"], [1842.5, "Tevbesi kabul edilir mi?\" dersen, cevap şudur:"], [1846.0, "Bize gelmeden ve onu yakalamaya güç yetirmeden önce tevbe ederse ve tevbe, şartlarını toplamış sâdık ve nasûh (içten) bir tevbe ise, şüphesiz tevbesi diğer günahlarda olduğu gibi kabul edilir."], [1859.9, "Müşrikin şirkinden tevbesi —sâdık olursa— kabul ediliyorsa, ondan daha aşağıdaki günahlardan tevbe evleviyetle (kabul edilir)."], [1872.2, "Allah Azze ve Celle Firavun'un sihirbazlarının tevbesini kabul etmiştir."]]}, {"reader": false, "ar": [[1885.0, "وأمّا إذا لم يتُب إلا بعد القدرة عليه فإنّ التوبة بعد القدرة لا ترفع عنه وجوبَ القتل في أصحّ قولَي أهل العلم رحمهم الله تعالى،"], [1899.0, "وحملُه على أنه زنديق <span class=\"q\">؟ 31:39<\/span>،"], [1901.0, "والتوبةُ لا تُقبَل من زنديق؛"], [1905.0, "يعني بمعنى أنّ كفره باطن،"], [1908.0, "ولا نستطيع أن نتبيّن أنه تاب من سحره التبيُّنَ الكامل؛"], [1912.0, "لأنّ تعامله مع الشياطين يكون خفيًّا."], [1916.0, "فاستدفاعًا لشرّه عن الأمّة،"], [1918.0, "وسدًّا لذريعة كذبه في هذه التوبة التي لم تطرأ على باله وقلبه إلا بعد القبض والقدرة عليه،"], [1926.0, "نقتله ونكِلُ أمرَه إلى الله عز وجل."]], "tr": [[1885.0, "Ancak ona güç yetirildikten sonra tevbe ederse, ehl-i ilmin —Allah onlara rahmet etsin— iki görüşünden en sahih olanına göre, güç yetirildikten sonraki tevbe ondan öldürülme vücubunu kaldırmaz;"], [1899.0, "o zındık hükmünde tutulur <span class=\"q\">؟<\/span>."], [1901.8, "Zındıktan da tevbe kabul edilmez."], [1905.6, "Yani küfrü bâtınîdir (gizlidir) ve onun sihrinden tevbe ettiğini tam olarak tespit edemeyiz;"], [1911.2, "çünkü şeytanlarla münasebeti gizli olur."], [1914.0, "Kötülüğünü ümmetten defetmek ve ancak yakalandıktan ve kendisine güç yetirildikten sonra aklına ve kalbine gelen bu tevbede yalan söylemesinin zerîasını kapatmak için onu öldürür ve işini Allah Azze ve Celle'ye havale ederiz."]]}]}, {"ts": "32:10", "title": "5. Külliye: Sihirlenmiş kişinin sihrin etkisiyle yaptığı her şeyden teklîfî olarak hesaba çekilmez, vaz'î olarak değil", "paras": [{"reader": false, "ar": [[1930.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما يفعله المسحورُ بسبب تأثير السحر فلا يؤاخَذ به تكليفًا لا وضعًا.<\/b> فهمتوها؟"], [1962.0, "<b>كلُّ ما يفعله المسحورُ بسبب تأثير السحر فلا يؤاخَذ به تكليفًا لا وضعًا.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1930.0, "Külliyelerden biri de şudur: 5."], [1937.0, "külliye: Sihirlenmiş kişinin sihrin etkisi sebebiyle yaptığı her şeyden teklîfî olarak hesaba çekilmez;"], [1943.2, "vaz'î olarak değil (yani teklîfî hüküm bakımından sorumlu tutulmaz). Anladınız mı?"], [1963.4, "Sihirlenmiş kişinin sihrin etkisi sebebiyle yaptığı her şeyden teklîfî olarak hesaba çekilmez;"], [1968.8, "vaz'î olarak değil. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1972.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرِّر في القواعد أنّ الإكراه رافعٌ للتكليف،"], [1981.0, "وأنّ العقل مناطُ التكليف،"], [1983.8, "وأنّ التكاليف الشرعيّة منوطةٌ ـ عفوًا ـ منوطةٌ بالعقل؛"], [1991.0, "فمتى ما زال عقلُ الإنسان فإنّ التكاليف عنه ترتفع."], [1996.0, "لقول الله عز وجل:"], [1998.0, "<span class=\"ayah\">﴿إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُ مُطْمَئِنٌّ بِالْإِيمَانِ﴾<\/span> <span class=\"ref\">[النحل: ١٠٦]<\/span>؛"], [2001.0, "فإذا كان الإكراهُ يرفع حكمَ كلمة الكفر مع اطمئنان القلب بالإيمان،"], [2007.2, "فلأَن يرفعَ ما دونه ـ إن حصل إكراهًا ـ من باب أولى."]], "tr": [[1972.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [1976.1, "Kaidelerde yerleşmiş olan şudur: İkrah (zorlama) teklifi kaldırır;"], [1982.4, "akıl teklifin menatıdır (dayanağıdır); şer'î teklifler —affedersiniz— akla bağlıdır."], [1991.0, "İnsanın aklı gidince teklifler ondan kalkar."], [1994.3, "Allah Azze ve Celle'nin şu sözü sebebiyle:"], [1998.5, "<span class=\"ayah\">﴿Kalbi imanla mutmain olduğu hâlde zorlanan hariç﴾<\/span> [Nahl 106]."], [2003.2, "İkrah, kalp imanla mutmain olduğu hâlde küfür sözünün hükmünü kaldırıyorsa, ondan aşağısını —ikrah gerçekleşirse— evleviyetle kaldırır."]]}, {"reader": false, "ar": [[2013.0, "ولقول النبيّ صلى الله عليه وسلم:"], [2018.0, "«رُفِع القلمُ عن ثلاثة»،"], [2019.6, "وذكر منها: «وعن المجنون حتى يعقل»."], [2022.0, "وإنّ تصرّفات المسحور لا تخلو من حالتين:"], [2025.0, "إمّا أن تُحمَل على أنها كتصرّفات المجنون سواءً بسواء،"], [2030.0, "أو تُحمَل على أنها كتصرّفات المُكرَه؛"], [2034.0, "فهو لا يخرج عن هاتين الحقيقتين."], [2036.0, "وكلا الأمرين ـ أي من فقد العقل ووجود الإكراه ـ كلُّه من روافع،"], [2043.3, "كلُّه ممّا يرفع التكليف."]], "tr": [[2013.0, "Bir de Peygamber sallallâhu aleyhi ve sellem'in şu sözü sebebiyle:"], [2019.2, "\"Kalem üç kişiden kaldırılmıştır.\" Bunlardan şunu zikretti:"], [2021.6, "\"Akıllanıncaya kadar deliden.\" Sihirlenmiş kişinin tasarrufları iki hâlden hâli değildir:"], [2025.6, "Ya aynen delinin tasarrufları gibi kabul edilir ya da zorlanan kimsenin tasarrufları gibi kabul edilir;"], [2034.0, "o bu iki hakikatin dışına çıkmaz."], [2035.7, "İki durumun her biri —yani aklın yitirilmesi ve ikrahın varlığı— (teklifi) kaldıran şeylerdendir, hepsi teklifi kaldıran şeylerdendir."]]}, {"reader": false, "ar": [[2046.0, "ولقول الله عز وجل:"], [2048.8, "<span class=\"ayah\">﴿وَلَيْسَ عَلَيْكُمْ جُنَاحٌ فِيمَا أَخْطَأْتُم بِهِ وَلَٰكِن مَّا تَعَمَّدَتْ قُلُوبُكُمْ﴾<\/span> <span class=\"ref\">[الأحزاب: ٥]<\/span>."], [2055.7, "ومن المعلوم أنّ كثيرًا من تصرّفات المسحور الحُكميّة إنما يتصرّفها بلا قصد القلب،"], [2062.4, "ولكن بسبب ضغوط السحر أو تسلُّط الشيطان الملابس."]], "tr": [[2046.0, "Bir de Allah Azze ve Celle'nin şu sözü sebebiyle:"], [2050.2, "<span class=\"ayah\">﴿Yanıldığınız şeylerde size bir günah yoktur; fakat kalplerinizin kasten yaptığı (şeylerde günah vardır)﴾<\/span> [Ahzâb 5]."], [2056.9, "Bilinmektedir ki sihirlenmiş kişinin hükmî (hukukî sonuç doğuran) tasarruflarının çoğunu kalbin kastı olmaksızın, sihrin baskıları veya (bedenine) girmiş şeytanın musallat olması sebebiyle yapar."]]}, {"reader": false, "ar": [[2068.0, "وبناءً على ذلك: فلو اضطرّه سحرُه لأن ينطق بكلمة الكفر مع اطمئنان قلبه بالإيمان فإنه لا يكفُر."], [2077.0, "ولو أنه ظاهَرَ من زوجته بسبب السحر فإنّ ظِهارَه لاغٍ لا يقع."], [2083.0, "ولو أنه طلّق زوجتَه بسبب السحر فإنّ طلاقه لاغٍ لا يقع؛"], [2092.0, "ولذلك قال أبو العبّاس في «الاختيارات»:"], [2096.2, "«ومن سُحِر ليطلِّق فإكراه»."]], "tr": [[2068.0, "Buna binaen: Sihri, kalbi imanla mutmain olduğu hâlde onu küfür sözünü söylemeye mecbur bıraksa kâfir olmaz."], [2076.5, "Sihir sebebiyle hanımına zıhar yapsa, zıharı geçersizdir, vâki olmaz."], [2081.5, "Sihir sebebiyle hanımını boşasa, talakı geçersizdir, vâki olmaz."], [2086.5, "Bu yüzden Ebu'l-Abbâs (İbn Teymiyye) \"el-İhtiyârât\"ta şöyle demiştir:"], [2093.4, "\"Boşaması için sihir yapılan kimse(nin durumu) ikrahtır.\""]]}, {"reader": false, "ar": [[2100.0, "ولو استهزأ بشيءٍ من الدين أو الشريعة بسبب ملابسة الشيطان اللعين له،"], [2109.0, "فأجرى كلماتِ السبّ أو اللعن أو الاستهزاء على لسانه،"], [2115.0, "فإنه لا ينبغي الحكمُ عليه بالردّة."], [2118.0, "ولو ترك الصلاةَ التركَ المطلق بسبب عدم قدرته على الذهاب إلى المسجد مثلًا،"], [2125.0, "أو لعدم قدرته على أفعالها أصلًا،"], [2128.0, "فإنه معذور؛ فلا يجب عليه من أمر الشريعة إلا ما كان قادرًا عليه،"], [2134.9, "عاقلًا له، مطيقًا له،"], [2137.0, "وأمّا ما يعجز عنه فإنه لا واجبَ مع العجز إجماعًا."], [2143.0, "ولكن لا بدّ أن نتأكّد أنّ هذه الأفعال التي وقع فيها إنما كان وقوعُه فيها بسبب السحر. والله أعلم."]], "tr": [[2100.0, "Lânetli şeytanın ona girmesi sebebiyle dinden veya şeriattan bir şeyle alay etse ve (şeytan) diline sövme, lânet veya alay sözlerini akıtsa, onun hakkında irtidat hükmü vermek uygun değildir."], [2119.1, "Mesela mescide gitmeye gücü yetmediği için ya da namazın fiillerini yapmaya hiç gücü yetmediği için namazı tamamen terk etse, mazurdur."], [2130.1, "Şeriatın emrinden ona ancak gücünün yettiği, aklının erdiği ve takat getirebildiği şey vâcip olur;"], [2138.2, "âciz kaldığı şeye gelince, icmâ ile acizlik varken vâcip yoktur."], [2144.4, "Fakat düştüğü bu fiillere ancak sihir sebebiyle düştüğünden emin olmamız gerekir. Allah en iyisini bilir."]]}]}, {"ts": "35:53", "title": "6. Külliye: Sebebi gaybî olan her hastalığın ilacı tevkîfîdir", "paras": [{"reader": false, "ar": [[2153.0, "ومن الكلّيّات أيضًا: <b>كلُّ داءٍ سببيّتُه غيبيّةٌ فدواؤه توقيفيّ.<\/b> <span class=\"note\">(يكررها)<\/span> إلى الآن ماشي معي؟"], [2170.8, "معلوماتٌ واضحة إن شاء الله؟"], [2175.0, "<b>كلُّ داءٍ سببيّتُه غيبيّةٌ فدواؤه توقيفيّ.<\/b> أُعيدها مرّةً ثالثة:"], [2181.1, "<b>كلُّ داءٍ سببيّتُه غيبيّةٌ فدواؤه توقيفيّ.<\/b>"]], "tr": [[2153.0, "Külliyelerden biri de şudur: 6."], [2154.7, "külliye: Sebebiyeti (etki sebebi) gaybî olan her hastalığın ilacı tevkîfîdir (nassa bağlıdır). (Tekrar ediyor.) Buraya kadar benimle beraber misiniz?"], [2173.0, "Bilgiler inşallah açık mı? <b>Sebebiyeti gaybî olan her hastalığın ilacı tevkîfîdir.<\/b> Üçüncü kez tekrar ediyorum:"], [2181.1, "<b>Sebebiyeti gaybî olan her hastalığın ilacı tevkîfîdir.<\/b>"]]}, {"reader": false, "ar": [[2186.0, "أقول: اعلم ـ رحمك الله تعالى ـ أنّ الأدواء تنقسم إلى قسمين:"], [2190.0, "أدواءٌ سببيّتُها غيبيّةٌ غيرُ معلومةٍ لنا،"], [2197.0, "فمهما عرضناها على الأطبّاء والخبراء فإنهم لا يستطيعون أن يعلموا أو يتعرّفوا على سببيّة التأثير،"], [2205.0, "مع أنّ أعراض المرض قائمةٌ أمامهم،"], [2208.0, "إلا أنّ سببيّة التأثير غيرُ معلومة؛"], [2211.0, "فهذا هو الذي نقصده بالسببيّة الغيبيّة."]], "tr": [[2186.0, "Derim ki: Bil —Allah sana rahmet etsin— hastalıklar iki kısma ayrılır:"], [2191.5, "Sebebiyeti gaybî olan, bizim için bilinmeyen hastalıklar."], [2200.2, "Onları doktorlara ve uzmanlara ne kadar arz etsek de, hastalığın belirtileri önlerinde durduğu hâlde etkinin sebebiyetini bilemez ve tanıyamazlar;"], [2210.0, "etkinin sebebiyeti bilinmez. Gaybî sebebiyetten kastettiğimiz budur."]]}, {"reader": false, "ar": [[2215.0, "ومنها العين؛ فإنّ العين سببيّتُها في المحسود غيرُ معلومة،"], [2224.0, "وكذلك السحر، وكذلك الصَّرَع الشيطانيّ أو المسّ الشيطانيّ أو ما يسمّى بعشق الشياطين؛"], [2231.0, "فإنّ هذه وإن كانت آثارُها واضحةً أمامنا ـ فنراه يتقيّأ،"], [2237.0, "ونراه يُصرَع، ونراه يبكي ويصرخ ويضرب نفسه ـ إلا أننا لا ندري عن سببيّة هذا التأثير."]], "tr": [[2215.0, "Bunlardan biri nazardır; nazarın hasetlik edilen kişideki sebebiyeti bilinmez."], [2224.0, "Sihir de böyledir; şeytânî sar'a, şeytânî temas (mess) ya da \"şeytanların aşkı\" denilen şey de böyledir."], [2233.0, "Bunların izleri önümüzde açık olsa da —onun kustuğunu, sar'a geçirdiğini, ağladığını, bağırdığını ve kendini dövdüğünü görürüz— bu etkinin sebebiyetini bilmeyiz."]]}, {"reader": false, "ar": [[2248.0, "فمتى ما رأيتَ الداءَ سببيّتُه غيبيّة فإيّاك أن تفتح المجالَ في علاجه إلا في حدود ما أجازه النصّ،"], [2261.0, "أو جرى عليه ـ على الأقلّ ـ عملُ السلف رحمهم الله تعالى."], [2269.0, "والقسمُ الثاني: الداءُ الحسّيّ،"], [2274.0, "الداءُ الحسّيّ: وهو الذي يعلم أصحابُ الخبرة فيه عن سببيّة تأثيره،"], [2283.0, "وهم يعرفون سببيّةَ تأثير هذا الداء في هذا الجسد،"], [2290.0, "وقاعدةُ هذا النوع أنّ دواءه تجريبيّ."]], "tr": [[2248.0, "Hastalığın sebebiyetinin gaybî olduğunu ne zaman görürsen, sakın onun tedavisinde nassın caiz gördüğü veya en azından selefin —Allah onlara rahmet etsin— amelinin üzerine cereyan ettiği sınırların dışında bir alan açma."], [2271.6, "İkinci kısım hissî hastalıktır, hissî hastalık:"], [2277.5, "Bu, uzmanlarının etkisinin sebebiyetini bildiği hastalıktır;"], [2283.0, "onlar bu hastalığın bu bedendeki etkisinin sebebiyetini bilirler."], [2288.7, "Bu çeşidin kaidesi, ilacının tecrübî olmasıdır."]]}, {"reader": false, "ar": [[2296.0, "فهما قاعدتان في الأدواء والدواء:"], [2301.0, "فكلُّ داءٍ سببيّتُه غيبيّةٌ فدواؤه توقيفيّ،"], [2308.0, "وكلُّ داءٍ سببيّتُه ظاهرةٌ فدواؤه تجريبيّ."], [2316.0, "وبما أننا نتكلّم عن السحر فإنه لا بدّ أن نجعل دواءَ السحر أو علاجَه أو طريقةَ كشفه يغلب عليها طابعُ التوقيف؛"], [2330.0, "فلا ينبغي في مثل ذلك الاجتهاد،"], [2333.0, "ولا ينبغي أن ندخل فيه بقول من يقول: جرّب ونفع."]], "tr": [[2296.0, "Hastalıklar ve ilaç hakkında iki kaide vardır:"], [2301.8, "Sebebiyeti gaybî olan her hastalığın ilacı tevkîfîdir;"], [2309.5, "sebebiyeti zahir olan her hastalığın ilacı tecrübîdir."], [2318.4, "Sihirden bahsettiğimize göre, sihrin ilacına, tedavisine veya onu açığa çıkarma yoluna tevkîf damgasının hâkim olmasını sağlamamız gerekir."], [2328.5, "Bu gibi şeylerde ictihad uygun değildir;"], [2332.0, "\"denedi ve faydasını gördü\" diyenin sözüyle bu işe girmemiz de uygun değildir."]]}, {"reader": false, "ar": [[2339.0, "فإنّ ذلك إنما نقبله في الأدواء الحسّيّة،"], [2346.0, "وأمّا في الأدواء ـ أي الأمراض ـ الغيبيّة فإننا لا نقبل مثل هذه التجارب فيها."], [2354.0, "مع أننا نجزم ـ ولله الحمد ـ بأنّ الله «ما أنزل من داءٍ إلا وجعل له دواءً، علِمه من علِمه، وجهِله من جهِله»."], [2364.0, "ونعلم كذلك بأنّ السحر لا يعدو أن يكون مرضًا يُصاب به الإنسان،"], [2371.0, "ولكنّ الله عز وجل لم يجعله خِلْوًا عن العلاجات التي دلّ عليها الدليلُ الشرعيّ الصحيح الصريح."]], "tr": [[2339.0, "Zira bunu ancak hissî hastalıklarda kabul ederiz;"], [2346.0, "gaybî hastalıklarda —yani rahatsızlıklarda— ise bu tür tecrübeleri kabul etmeyiz."], [2352.7, "Bununla birlikte —hamd Allah'a— kesin olarak biliriz ki Allah \"hiçbir hastalık indirmemiştir ki ona bir ilaç kılmamış olsun;"], [2361.5, "onu bilen bilmiş, bilmeyen bilmemiştir.\" Yine biliyoruz ki sihir, insanın yakalandığı bir hastalık olmaktan öteye geçmez;"], [2371.0, "fakat Allah Azze ve Celle onu, sahih ve sarih şer'î delilin gösterdiği tedavilerden yoksun bırakmamıştır."]]}]}, {"ts": "39:41", "title": "6. Külliye (devam): Sihrin tedavi yolları — dua ve sihrin yerini bulup çıkarmak", "paras": [{"reader": false, "ar": [[2381.0, "فممّا دلّ عليه الدليل:"], [2383.8, "كثرةُ الدعاء بأن يكشفه اللهُ عز وجل؛"], [2390.0, "لِما في الصحيح من حديث عائشة رضي الله عنها أنه لمّا سُحِر النبيُّ صلى الله عليه وسلم،"], [2397.0, "قالت: «فدعا ثم دعا»؛"], [2402.0, "يعني أنه ألحّ في الدعاء على الله عز وجل أن يكشف عنه هذه الغُمّة."], [2408.0, "واللهُ عز وجل بيده كلُّ شيء،"], [2413.0, "ولذلك علّق اللهُ عز وجل في الدليل ـ علّق اللهُ عز وجل ـ الإصابةَ بالسحر بإذنه الكونيّ،"], [2421.0, "كما قال الله عز وجل:"], [2423.0, "<span class=\"ayah\">﴿وَمَا هُم بِضَارِّينَ بِهِ مِنْ أَحَدٍ إِلَّا بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ١٠٢]<\/span>."], [2429.0, "فإذا كان اللهُ قد أذِن كونًا بأن تُصاب به،"], [2434.0, "فهو قادرٌ على أن يأذن كونًا برفعه."]], "tr": [[2381.0, "Delilin gösterdiği şeylerden biri, Allah Azze ve Celle'nin onu gidermesi için çokça dua etmektir."], [2390.4, "Çünkü Sahîh'te Âişe'nin —Allah ondan razı olsun— hadisinde, Peygamber sallallâhu aleyhi ve sellem'e sihir yapıldığında şöyle dediği vardır:"], [2397.0, "\"Dua etti, sonra (yine) dua etti.\" Yani bu sıkıntıyı ondan gidermesi için Allah Azze ve Celle'ye ısrarla dua etti."], [2407.6, "Her şey Allah Azze ve Celle'nin elindedir."], [2413.0, "Bu yüzden Allah Azze ve Celle delilde —Allah Azze ve Celle— sihirle musibete uğramayı kevnî iznine bağlamıştır."], [2421.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2423.7, "<span class=\"ayah\">﴿Hâlbuki onlar Allah'ın izni olmadıkça onunla hiç kimseye zarar veremezler﴾<\/span> [Bakara 102]."], [2430.7, "Allah, senin ona uğramana kevnen izin verdiyse, onun kalkmasına da kevnen izin vermeye kâdirdir."]]}, {"reader": false, "ar": [[2437.0, "وقال الله عز وجل:"], [2440.0, "<span class=\"ayah\">﴿وَإِذَا مَرِضْتُ فَهُوَ يَشْفِينِ﴾<\/span> <span class=\"ref\">[الشعراء: ٨٠]<\/span>."], [2442.0, "واللهُ عز وجل لا يتعاظمه شيءٌ من الأدواء أبدًا،"], [2447.0, "وقدرتُه لا تفتقر إلى أسباب،"], [2450.0, "ولكن عليك أن تُقبِل على الله عز وجل بقلبٍ صادقٍ مخلص،"], [2456.0, "وتُلِحَّ على الله عز وجل الإلحاحَ العظيم الطويل،"], [2461.0, "ولا تعجَل في الاستجابة،"], [2463.0, "فإنّ الله عز وجل يكشف ما بك."], [2467.0, "فمن أعظم ما يُتداوى به السحرُ:"], [2470.0, "التوجّهُ إلى الله عز وجل بالدعاء والتضرّع بين يديه،"], [2473.0, "وهذا من أعظم ما يُتداوى به."]], "tr": [[2437.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [2440.5, "<span class=\"ayah\">﴿Hastalandığımda bana şifa veren O'dur﴾<\/span> [Şuarâ 80]."], [2443.1, "Hastalıklardan hiçbir şey Allah Azze ve Celle'ye asla büyük gelmez;"], [2448.2, "O'nun kudreti sebeplere muhtaç değildir."], [2450.5, "Fakat senin sâdık ve ihlaslı bir kalple Allah Azze ve Celle'ye yönelmen, Allah Azze ve Celle'ye büyük ve uzun bir ısrarla yalvarman ve icabette acele etmemen gerekir;"], [2463.6, "Allah Azze ve Celle sendeki sıkıntıyı giderir."], [2467.0, "Sihrin kendisiyle tedavi edildiği en büyük şeylerden biri, dua ve O'nun huzurunda yalvarmakla Allah Azze ve Celle'ye yönelmektir."], [2473.0, "Bu, kendisiyle tedavi olunan en büyük şeylerdendir."]]}, {"reader": false, "ar": [[2477.0, "العلاجُ الثاني، أو الطريقُ الثاني:"], [2480.0, "أن يتعرّف الإنسانُ على مكان سحره،"], [2484.0, "ثم يستخرجه ويُبطله. وهذا الذي فعله النبيُّ صلى الله عليه وسلم لمّا سحره لَبِيدُ بنُ الأعصم،"], [2496.0, "وفيه أنه صلى الله عليه وسلم لمّا سُحِر سأل ربَّه في ذلك فدُلَّ عليه،"], [2503.0, "فاستخرجه من بئر، فكان في مُشطٍ ومُشاطة،"], [2508.0, "فلمّا استخرجه صاروا يحُلّونه عُقدةً عُقدة،"], [2512.0, "فكلّما حلّوا عقدةً خفّ جسدُ النبيّ صلى الله عليه وسلم،"], [2517.0, "حتى قام كأنما نُشِط من عِقال."]], "tr": [[2477.0, "İkinci tedavi veya ikinci yol:"], [2479.4, "İnsanın sihrinin yerini öğrenmesi, sonra onu çıkarıp iptal etmesidir."], [2484.9, "Lebîd b. el-A'sam Peygamber sallallâhu aleyhi ve sellem'e sihir yaptığında onun yaptığı budur."], [2495.2, "Kıssada şu vardır: O sallallâhu aleyhi ve sellem'e sihir yapılınca bu hususta Rabbine sordu ve ona (yeri) gösterildi;"], [2502.2, "onu bir kuyudan çıkardı. (Sihir) bir tarak ve taranırken dökülen saçlar içindeydi."], [2509.3, "Onu çıkarınca düğüm düğüm çözmeye başladılar;"], [2512.5, "her düğümü çözdüklerinde Peygamber sallallâhu aleyhi ve sellem'in bedeni hafifledi;"], [2517.0, "sonunda sanki bağdan çözülmüş gibi kalktı."]]}, {"reader": false, "ar": [[2521.0, "قال الإمامُ ابنُ القيّم ـ رحمه الله تعالى ـ:"], [2525.0, "«فهذا» ـ أي وجودُ السحر وإبطالُه ـ «أبلغُ ما يُعالَج به المطبوب، وهذا بمنزلة إزالة المادّة الخبيثة وقلعِها من الجسد بالاستفراغ». انتهى كلامه."]], "tr": [[2521.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [2523.9, "\"Bu\" —yani sihri bulmak ve iptal etmek— \"sihirlenmiş kişinin (matbûb) kendisiyle tedavi edildiği en etkili şeydir."], [2533.0, "Bu, habis maddeyi gidermek ve istifrağ (boşaltma) yoluyla onu bedenden sökmek mesabesindedir.\" Sözü bitti."]]}, {"reader": false, "ar": [[2538.0, "وقد يقول قائل: إنّ هذا في حقّ النبيّ صلى الله عليه وسلم؛"], [2545.0, "فإنّ هذه الرؤيا التي رآها في القصّة المذكورة في الصحيح من حديث عائشة ـ وكلُّكم تعرفونها ـ إنما هي وحيٌ من الله عز وجل،"], [2559.0, "ولكنّ أحدَنا كيف يعرف مكانَ سحره؟"], [2566.0, "أقول: إنّ هذا ليس من جملة خصائصه صلى الله عليه وسلم،"], [2571.0, "بل إنّ هذا معلَّلٌ بكثرة دعائه صلى الله عليه وسلم وكثرة سؤاله ربَّه أن يكشف عنه،"], [2579.0, "ثم أراه اللهُ عز وجل أنّ ملَكين أحدُهما عند رأسه والآخرُ عند رجله،"], [2586.0, "فصارا يتحاوران في مكان سحره،"], [2588.7, "حتى علم النبيُّ صلى الله عليه وسلم مكانَه،"], [2593.0, "فأرسل الصحابةَ ليُخرجوه، فحُلَّ،"], [2595.5, "فشفاه اللهُ عز وجل."]], "tr": [[2538.0, "Biri şöyle diyebilir: Bu, Peygamber sallallâhu aleyhi ve sellem hakkındadır;"], [2543.2, "zira Sahîh'te Âişe hadisinde zikredilen kıssada gördüğü —hepiniz onu bilirsiniz— bu rüya ancak Allah Azze ve Celle'den bir vahiydir."], [2555.6, "Peki bizden biri sihrinin yerini nasıl bilecek?"], [2559.0, "Derim ki: Bu, onun sallallâhu aleyhi ve sellem hususiyetlerinden değildir."], [2567.8, "Bilakis bu, onun sallallâhu aleyhi ve sellem çokça dua etmesi ve Rabbinden onu gidermesini çokça istemesiyle açıklanır."], [2576.0, "Sonra Allah Azze ve Celle ona, biri başucunda diğeri ayakucunda iki meleğin sihrinin yeri hakkında konuştuklarını gösterdi;"], [2584.4, "nihayet Peygamber sallallâhu aleyhi ve sellem onun yerini öğrendi, onu çıkarmaları için sahabeyi gönderdi;"], [2591.9, "(sihir) çözüldü ve Allah Azze ve Celle ona şifa verdi."]]}, {"reader": false, "ar": [[2598.0, "والمتقرِّر في القواعد أنّ الخصائص لا تثبت إلا بالدليل،"], [2604.0, "فليس هناك دليلٌ يدلّ على أنّ معرفة مكان السحر بالرؤيا من جملة خصائصه صلى الله عليه وسلم."], [2612.0, "وكم من إنسانٍ في واقع الناس رأى مكانَ سحره في المنام؛"], [2619.0, "فبعضُهم رآه في شجرةٍ عند بابه،"], [2624.0, "وبعضُهم رآه في مكانٍ من سيّارته،"], [2627.0, "بل وبعضُهم رآه في بيّارة داره،"], [2630.0, "بل وبعضُهم رآه في البحر،"], [2634.0, "وبعضُهم رآه في المقابر؛"], [2636.0, "فكلّما استفاق متأثّرًا بالسحر يقول:"], [2640.4, "كنتُ نائمًا بين الأموات،"], [2642.0, "كنتُ نائمًا بين الأموات؛"], [2644.0, "فهذا دليلٌ على أنّ مكان سحره في المقبرة."]], "tr": [[2598.0, "Kaidelerde yerleşmiş olan şudur: Hususiyetler ancak delille sabit olur."], [2604.0, "Sihrin yerini rüya ile bilmenin onun sallallâhu aleyhi ve sellem hususiyetlerinden olduğunu gösteren bir delil yoktur."], [2612.6, "İnsanların hayatında nice insan sihrinin yerini rüyada görmüştür:"], [2617.7, "Kimi onu kapısının yanındaki bir ağaçta görmüş, kimi arabasının bir yerinde görmüş, hatta kimi evinin foseptik çukurunda görmüş, hatta kimi denizde görmüş, kimi de kabristanda görmüştür."], [2636.0, "Sihrin etkisi altında her uyandığında \"Ölülerin arasında uyuyordum, ölülerin arasında uyuyordum\" der;"], [2644.0, "bu da sihrinin yerinin kabristanda olduğuna delildir."]]}, {"reader": false, "ar": [[2647.0, "وإذا رأيتَ الرؤيا وإن لم تكن ظاهرةً فلعلّك تعرضها على عالمٍ ناصحٍ عارفٍ بأمر الرؤى يعبُرها،"], [2657.0, "يعبُرها لك. والمقصود أنّ هذا ـ أي اكتشافَ مكان السحر بالرؤيا ـ ليس من جملة خصائصه صلى الله عليه وسلم."]], "tr": [[2647.0, "Bir rüya gördüğünde, açık olmasa bile, onu rüyalar işini bilen, nasihat eden bir âlime arz edersin;"], [2654.8, "o onu tabir eder, senin için tabir eder."], [2659.1, "Maksat şudur: Bu —yani sihrin yerini rüya ile keşfetmek— onun sallallâhu aleyhi ve sellem hususiyetlerinden değildir."]]}, {"reader": false, "ar": [[2667.0, "بل وهناك طريقٌ آخر:"], [2669.7, "وهي أن يتكلّم الجانُّ المسؤول عن السحر عن مكان السحر؛"], [2678.0, "فإنّ سياطَ الرقية إذا مسّته فإنه يريد الخلاص،"], [2683.3, "ويعلم أنّ خلاصه في الدلالة على مكان السحر."], [2689.0, "وكم من سحرٍ حُلَّ ـ ولله الحمد والمنّة ـ بسبب اعتراف الشيطان الملابس للمسحور،"], [2697.0, "إلا أنه ينبغي أن يتثبّت الإنسانُ من خبريّته؛"], [2702.3, "لأنّ الأصل فيهم الكذب،"]], "tr": [[2667.0, "Hatta başka bir yol daha vardır:"], [2671.0, "Sihirden sorumlu cinnin sihrin yeri hakkında konuşması."], [2675.7, "Zira rukyenin kırbaçları ona dokununca kurtulmak ister ve kurtuluşunun sihrin yerini göstermekte olduğunu bilir."], [2687.3, "Nice sihir —hamd ve minnet Allah'a— sihirlenmiş kişiye girmiş şeytanın itirafı sebebiyle çözülmüştür."], [2696.3, "Ancak insanın onun haberinden emin olması gerekir;"], [2701.0, "çünkü onlarda asıl olan yalandır;"]]}]}, {"ts": "45:05", "title": "6. Külliye (devam): Rukye, istifrağ, hacamat ve sidr yaprağı", "paras": [{"reader": false, "ar": [[2705.0, "لقول النبيّ صلى الله عليه وسلم:"], [2707.7, "«صدَقك وهو كذوب». ووصيّتي للقرّاء:"], [2710.8, "ألّا يحرصوا على معرفة من سحر؛"], [2716.0, "لأنهم سيفتحون أمام الشياطين الملابِسة أو المسؤولة عن السحر بابًا عظيمًا من أبواب الخصومات فيما بين الأقارب."], [2726.0, "وإنما يحرص القارئُ الكريم على أن يتعرّف أين مكانُ السحر فقط،"], [2733.0, "ولا شأنَ لنا بمن سحر؛"], [2736.3, "لكثرة الكذب في ذلك،"], [2739.0, "وسرعةِ تصديق الناس لخبر الشيطان بمثل ذلك."], [2747.0, "وكم حصل من تضارُب <span class=\"q\">؟ 45:47<\/span> الأقارب،"], [2750.5, "وكثرةِ الخصومات والنزاع بين الأقارب،"], [2755.0, "بسبب قبول أخبار الشيطان."]], "tr": [[2705.0, "Peygamber sallallâhu aleyhi ve sellem'in şu sözü sebebiyle:"], [2707.7, "\"O çok yalancı olduğu hâlde sana doğru söyledi.\" Rukye yapanlara (kurrâ) tavsiyem şudur:"], [2716.0, "Sihri kimin yaptığını öğrenmeye hırslı olmasınlar."], [2719.3, "Çünkü (bedene) girmiş veya sihirden sorumlu şeytanların önüne akrabalar arasında husumet kapılarından büyük bir kapı açarlar."], [2726.6, "Değerli rukyeci sadece sihrin yerinin neresi olduğunu öğrenmeye hırslı olmalıdır;"], [2732.4, "sihri kimin yaptığıyla bizim işimiz yoktur."], [2735.7, "Çünkü bu konuda yalan çoktur ve insanlar bu gibi konularda şeytanın haberini çabuk tasdik ederler."], [2747.0, "Şeytanın haberlerini kabul etmek sebebiyle akrabalar arasında nice çatışma <span class=\"q\">؟<\/span>, nice husumet ve çekişme meydana gelmiştir."]]}, {"reader": false, "ar": [[2756.0, "ومن طرق حلّ السحر أيضًا:"], [2759.7, "الرقيةُ الشرعيّة، وسيأتينا ـ إن شاء الله ـ في كلّيّات باب الرُّقى ما يتعلّق بهذا الطريق ـ إن شاء الله عز وجل ـ تفصيلًا وتفريعًا."]], "tr": [[2756.0, "Sihri çözme yollarından biri de şer'î rukyedir."], [2763.0, "Bu yolla ilgili olanlar inşallah —Allah Azze ve Celle'nin izniyle— rukyeler babının külliyelerinde tafsilatlı ve fer'î meseleleriyle bize gelecektir."]]}, {"reader": false, "ar": [[2781.0, "ومنها كذلك: الاستفراغ، وذلك بأن يكون في المحلّ الذي يصل إليه أذى السحر."], [2790.0, "قال الإمامُ ابنُ القيّم ـ رحمه الله تعالى ـ:"], [2794.0, "«فإنّ للسحر تأثيرًا في الطبيعة، وهيجانِ أخلاطها، وتشويشِ مزاجها، فإذا ظهر أثرُه في عضوٍ وأمكن استفراغُ المادّة الرديئة من ذلك العضو نفع جدًّا»."]], "tr": [[2781.0, "Bunlardan biri de istifrağdır (bedenden kötü maddeyi boşaltma);"], [2785.1, "bu, sihrin eziyetinin ulaştığı yerde olur."], [2788.6, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [2792.9, "\"Sihrin tabiatta, onun hıltlarının (salgılarının) galeyana gelmesinde ve mizacının bozulmasında bir etkisi vardır."], [2800.0, "Etkisi bir uzuvda ortaya çıkar ve kötü maddeyi o uzuvdan boşaltmak mümkün olursa, çok fayda verir.\""]]}, {"reader": false, "ar": [[2808.0, "ومن أعظم أنواع الاستفراغات:"], [2811.1, "الاستفراغُ بالحجامة؛ فإذا كان الإنسانُ قد أثّر السحرُ في كتفيه فيحتجم في كتفيه،"], [2820.0, "أو في ركبتيه فيحتجم في رجليه،"], [2824.0, "أو في ظهره فيحتجم في ظهره؛"], [2827.0, "ليستفرغ المادّةَ التي يستعين الشيطانُ ببقائها على دوام أثر عُقَد السحر."]], "tr": [[2808.0, "İstifrağ çeşitlerinin en büyüklerinden biri hacamatla istifrağdır."], [2815.5, "Sihir insanın omuzlarına etki etmişse omuzlarından hacamat olur;"], [2819.1, "dizlerine (etki etmişse) bacaklarından hacamat olur;"], [2821.8, "sırtına (etki etmişse) sırtından hacamat olur."], [2826.0, "Böylece şeytanın, kalıcılığı sayesinde sihir düğümlerinin etkisinin devamına yardım aldığı maddeyi boşaltır."]]}, {"reader": false, "ar": [[2835.0, "وذهب بعضُ أهل العلم إلى أنّ هناك بعضَ الأدوية التي وردت عن بعض السلف:"], [2843.0, "وهي أن يأتي الإنسانُ بسبع ورقاتٍ من السِّدر،"], [2847.8, "ثم يدُقّها، ثم يصبّ عليها شيئًا من الماء،"], [2853.0, "ويقرأ عليها الآياتِ المتعلّقة بالسحر وإبطالِ أثره،"], [2858.0, "ثم يشرب منها شيئًا ويغتسل منها بشيء."], [2862.0, "وهذا لا أعلم له دليلًا مرفوعًا عن النبيّ صلى الله عليه وسلم،"], [2866.0, "ولا من فعل أحدٍ من الصحابة في الحقيقة،"], [2870.0, "ولكنه ذكره جمعٌ من الأطبّاء المسلمين،"], [2875.0, "وقرّره الإمامُ ابنُ القيّم ـ رحمه الله تعالى ـ في كتابه العظيم «زاد المعاد». والله أعلم."]], "tr": [[2835.0, "Bazı ehl-i ilim, bazı seleften gelmiş birtakım ilaçlar olduğu görüşüne gitmiştir:"], [2840.5, "İnsan yedi sidr (Arabistan kirazı) yaprağı getirir, onları döver, sonra üzerine biraz su döker, üzerine sihirle ve onun etkisinin iptaliyle ilgili ayetleri okur, sonra ondan biraz içer ve biraz da onunla yıkanır."], [2860.9, "Doğrusu bunun için Peygamber sallallâhu aleyhi ve sellem'den merfû bir delil de, sahabeden birinin fiilinden (bir delil) de bilmiyorum."], [2868.0, "Fakat bunu Müslüman tabiplerden bir topluluk zikretmiş, İmam İbnü'l-Kayyim de —Allah ona rahmet etsin— büyük eseri \"Zâdü'l-Meâd\"da bunu takrir etmiştir. Allah en iyisini bilir."]]}]}, {"ts": "48:06", "title": "6. Külliye (devam): Sihri sihirle çözmenin hükmü", "paras": [{"reader": false, "ar": [[2884.6, "ومن الكلّيّات ـ عفوًا ـ وعندنا مسائلُ في هذه الجزئيّة؛"], [2889.6, "عندنا مسألةٌ خطيرة: وهي ما حكمُ حلّ السحر بسحرٍ مثله؟"], [2898.0, "الجواب: فيه خلافٌ في الحقيقة بين أهل العلم رحمهم الله تعالى،"], [2907.0, "إلا أنّ الحقّ الذي لا ينبغي القولُ بغيره هو تحريمُ ذلك وسدُّ أبوابه؛"], [2913.0, "فلا ينبغي لنا أبدًا أن نُجيز حلَّ السحر بالسحر؛"], [2919.0, "لأنه طريقٌ خطيرٌ جدًّا."]], "tr": [[2884.6, "Külliyelerden —affedersiniz— bu cüz'î konuda bazı meselelerimiz var;"], [2888.9, "tehlikeli bir mese
