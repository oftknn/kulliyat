<script>
const D={"no": 10, "vid": "7mvc2Faq-8A", "title_ar": "الدرس (١٠) من شرح كليات العقيدة — كليات في توحيد الربوبية", "title_tr": "Şerhu Külliyyâti'l-Akîde — 10. Ders: Rubûbiyyet Tevhidine Dair Külliyeler (Kalbin Taalluku, Ta'til, Rubûbiyyette Şirk, Gayb, Kehânet ve Tencîm)", "sections": [{"ts": "00:00", "title": "1. Külliye: Kalbin bağlandığı şeye bırakılması", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.3, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.8, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.6, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [12.1, "أما بعد: فلا نزال ـ ولله الحمد والمنّة ـ في سياق شرح كلّيّات الاعتقاد في باب توحيد الربوبية،"], [21.3, "وأظننا كتبنا رأسَ الكلّيّة التي ستكون منطلَقَنا في هذا الدرس إن شاء الله،"], [28.8, "وهي الكلّيّة الأولى: <b>كلُّ ما يتعلّق به القلبُ فموكولٌ إليه.<\/b> كل ما يتعلق به القلب فموكولٌ إليه."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.3, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.1, "Bundan sonra: Allah'a hamd ve minnet olsun, hâlâ rubûbiyyet tevhidi babındaki itikad külliyelerinin şerhi bağlamındayız."], [21.3, "Sanırım bu derste başlangıç noktamız olacak külliyenin başlığını yazmıştık;"], [28.8, "o da birinci külliyedir: 1."], [28.8, "külliye: Kalbin bağlandığı her şeye (kişi) bırakılır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[39.0, "أقول وبالله التوفيق: وأصلُ هذه الكلية حديثُ عبد الله بن عُكَيمٍ رضي الله تعالى عنه قال:"], [47.5, "قال النبي ﷺ: «من تعلّق شيئًا وُكِل إليه»."], [53.0, "ولأن المتقرّر في القواعد أن القلب بكلّ شُعَبه لا ينبغي أن يتعلّق ـ في توكّله،"], [62.0, "وفي خوفه، وفي رجائه،"], [64.6, "وفي خشيته ورغبته ورهبته وتوكّله ـ إلا على الله عز وجل."], [73.0, "فلا ينبغي للعبد أن يصرف شيئًا من شُعَب قلبه لغير الله تبارك وتعالى."]], "tr": [[39.0, "Tevfik Allah'tandır, derim ki: Bu külliyenin aslı Abdullah b."], [39.0, "Ukeym'in (radıyallahu anh) hadisidir. Dedi ki:"], [39.0, "Nebî ﷺ şöyle buyurdu: «Bir şeye bağlanan (kalbini asan), ona bırakılır.» Ayrıca kaidelerde yerleşmiş olan şudur:"], [53.0, "Kalp bütün şubeleriyle —tevekkülünde, korkusunda, ümidinde, haşyetinde, rağbetinde, rehbetinde ve tevekkülünde— ancak Aziz ve Celîl olan Allah'a bağlanmalıdır."], [64.6, "Kulun kalbinin şubelerinden hiçbirini Allah Tebâreke ve Teâlâ'dan başkasına yöneltmesi yakışmaz."]]}, {"reader": false, "ar": [[78.0, "وهذه الكلية تُعتبر دليلًا على العقوبة الربانية في حقّ كلّ من علّق قلبه بغير الله عز وجل؛"], [91.0, "فكلُّ من تعلّقت شُعبةٌ من شُعَب قلبه بغير الله تبارك وتعالى في تحصيل مطلوبٍ أو النجاة من مكروب،"], [103.0, "فإن الله عز وجل يَكِلُه إلى هذا الشيء."], [106.0, "وإن أعظم الخسارة أن يَكِلَك الله عز وجل إلى الأسباب الحسّيّة المادّيّة،"], [111.0, "ويسحبَ بساطَ التوفيق من تحت قدميك."]], "tr": [[78.0, "Bu külliye, kalbini Allah'tan başkasına bağlayan herkes hakkındaki ilâhî cezanın delili sayılır."], [78.0, "Bir isteğe ulaşmada ya da bir sıkıntıdan kurtulmada kalbinin şubelerinden biri Allah Tebâreke ve Teâlâ'dan başkasına bağlanan herkesi, Allah Azze ve Celle o şeye bırakır."], [106.0, "En büyük hüsran, Allah'ın seni hissî ve maddî sebeplere bırakması ve tevfik halısını ayaklarının altından çekmesidir."]]}, {"reader": false, "ar": [[115.0, "وبناءً على ذلك: فمن تعلّق التمائم وُكِل إليها،"], [120.0, "ومن تعلّق الودَع وُكِل إليه،"], [125.0, "ومن تعلّق على الرُّقى ـ مع أنها أسبابٌ شرعية ـ وُكِل إليها،"], [134.0, "ومن تعلّق على شيءٍ من الأسباب الحسّيّة المادّيّة وُكِل إليها."]], "tr": [[115.0, "Buna göre: Muskalara bağlanan onlara bırakılır;"], [115.0, "boncuk ve deniz kabuklarına (vede') bağlanan ona bırakılır;"], [125.0, "rukyelere bağlanan —onlar meşru sebepler olduğu hâlde— onlara bırakılır;"], [134.0, "hissî ve maddî sebeplerden herhangi birine bağlanan ona bırakılır."]]}, {"reader": false, "ar": [[143.0, "وعكسُ ذلك من يعلّق شُعَب قلبه بالله تبارك وتعالى،"], [150.0, "فلا يخشى إلا من الله،"], [151.7, "ولا يخاف إلا من الله،"], [153.3, "ولا يتوكّل إلا على الله،"], [155.0, "ولا يستعصم إلا بالله،"], [157.9, "ولا يستكفي إلا بالله،"], [161.0, "ولا يحتسب في طلب حاجيّاته أو النجاة من مكروباته إلا بالله عز وجل؛"], [168.0, "فإنه يكون قد اعتمد على الركن الركين الذي لا يخيب من استعصم به،"], [175.0, "كما قال الله عز وجل:"], [177.7, "<span class=\"ayah\">﴿قُلْ حَسْبِيَ اللَّهُ ۖ عَلَيْهِ يَتَوَكَّلُ الْمُتَوَكِّلُونَ﴾<\/span> [الزمر: 38]."]], "tr": [[143.0, "Bunun tersi ise kalbinin şubelerini Allah Tebâreke ve Teâlâ'ya bağlayan kimsedir:"], [150.0, "Allah'tan başkasından haşyet duymaz, Allah'tan başkasından korkmaz, Allah'tan başkasına tevekkül etmez, Allah'tan başkasına sığınmaz, Allah'tan başkasıyla yetinmez;"], [161.0, "ihtiyaçlarını istemede ya da sıkıntılarından kurtulmada ancak Allah'a güvenir."], [168.0, "Böyle biri, kendisine sığınanı asla hüsrana uğratmayan sağlam dayanağa dayanmış olur."], [175.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [177.7, "<span class=\"ayah\">﴿De ki: Allah bana yeter. Tevekkül edenler ancak O'na tevekkül eder.﴾<\/span> [Zümer 38]"]]}, {"reader": false, "ar": [[181.0, "ويقول الله عز وجل:"], [182.6, "<span class=\"ayah\">﴿وَعَلَى اللَّهِ فَتَوَكَّلُوا إِن كُنتُم مُّؤْمِنِينَ﴾<\/span> [المائدة: 23]،"], [185.0, "وتقديمُ الجارّ والمجرور يفيد الحصر،"], [191.0, "كما نصّ على ذلك علماء النحو والبلاغة."], [194.0, "ويقول الله عز وجل:"], [196.7, "<span class=\"ayah\">﴿وَإِن يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ ۖ وَإِن يُرِدْكَ بِخَيْرٍ فَلَا رَادَّ لِفَضْلِهِ﴾<\/span> [يونس: 107]."], [207.0, "ويقول الله عز وجل:"], [209.8, "<span class=\"ayah\">﴿وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ﴾<\/span> [الطلاق: 3]."], [215.0, "ويقول الله عز وجل:"], [216.8, "<span class=\"ayah\">﴿وَمَن يُضْلِلِ اللَّهُ فَمَا لَهُ مِنْ هَادٍ ۝ وَمَن يَهْدِ اللَّهُ فَمَا لَهُ مِن مُّضِلٍّ﴾<\/span> [الزمر: 36–37]."]], "tr": [[181.0, "Allah Azze ve Celle şöyle buyurur:"], [182.6, "<span class=\"ayah\">﴿Eğer mü'minseniz yalnız Allah'a tevekkül edin.﴾<\/span> [Mâide 23] Câr ve mecrûrun öne alınması hasr (sınırlama) ifade eder;"], [185.0, "nahiv ve belâgat âlimleri bunu açıkça belirtmişlerdir."], [194.0, "Allah Azze ve Celle şöyle buyurur:"], [196.7, "<span class=\"ayah\">﴿Eğer Allah sana bir zarar dokundurursa onu O'ndan başka giderecek yoktur. Eğer sana bir hayır dilerse O'nun lütfunu geri çevirecek de yoktur.﴾<\/span> [Yûnus 107] Allah Azze ve Celle şöyle buyurur:"], [209.8, "<span class=\"ayah\">﴿Kim Allah'a tevekkül ederse O ona yeter.﴾<\/span> [Talâk 3] Allah Azze ve Celle şöyle buyurur:"], [216.8, "<span class=\"ayah\">﴿Allah kimi saptırırsa artık onun için bir yol gösterici yoktur. Allah kime hidayet verirse onu saptıracak da yoktur.﴾<\/span> [Zümer 36–37]"]]}, {"reader": false, "ar": [[223.0, "فطوبى لعبدٍ يسّر الله عز وجل له تحقيقَ تعليق شُعَب قلبه ـ بكلّ متعلَّقاتها ـ بالله عز وجل وحده لا شريك له."], [233.0, "وإن النقص في تحصيل مطالب الدين والدنيا إنما يكون بسبب فَوات تعلّق القلب ـ أو شيءٍ من شُعَبه ـ بالله تبارك وتعالى."]], "tr": [[223.0, "Ne mutlu, Allah Azze ve Celle'nin kendisine kalbinin şubelerini bütün taalluklarıyla yalnızca ortağı olmayan tek Allah'a bağlamayı nasip ettiği kula!"], [223.0, "Din ve dünya isteklerini elde etmedeki eksiklik ancak kalbin —ya da onun şubelerinden birinin— Allah Tebâreke ve Teâlâ'ya bağlanmasının kaybolmasından kaynaklanır."]]}, {"reader": false, "ar": [[245.0, "فمن الناس من يعتمد قلبُه على واسطةٍ في تحصيل وظيفة،"], [249.7, "أو يتعلّق قلبه بأميرٍ في تحصيل مال،"], [253.0, "أو يتعلّق قلبه بمحسنٍ في كشف كربة،"], [256.0, "أو يتعلّق قلبه براقٍ في كشف ما ألمّ به من الأمراض المعنوية الروحية،"], [264.0, "أو يتعلّق قلبه بطبيبٍ في كشف ما ألمّ به من الأمراض الحسّيّة الظاهرة."], [271.0, "وكلُّ ذلك مما يُضعف سيرَ القلب إلى الله عز وجل،"], [275.0, "ومما يُغلق عن العبد أبوابَ كفاية الله عز وجل."], [282.0, "فأغلبُ الأمور التي تتفلّت علينا إنما سببها عدمُ تعلّق قلوبنا التعلّقَ المطلق الكامل التام بالله عز وجل، والله أعلم."]], "tr": [[245.0, "İnsanlardan kimi, bir iş elde etmede kalbiyle bir aracıya (torpile) dayanır;"], [249.7, "kimi mal elde etmede kalbini bir emîre bağlar;"], [253.0, "kimi bir sıkıntının giderilmesinde kalbini bir hayırsevere bağlar;"], [256.0, "kimi başına gelen manevî ve ruhî hastalıkların giderilmesinde kalbini bir rukyeciye bağlar;"], [264.0, "kimi de başına gelen hissî ve zahirî hastalıkların giderilmesinde kalbini bir doktora bağlar."], [271.0, "Bütün bunlar kalbin Allah'a doğru yürüyüşünü zayıflatan ve kula Allah'ın kifâyet (yetme) kapılarını kapatan şeylerdendir."], [282.0, "Elimizden kayıp giden işlerin çoğunun sebebi, kalplerimizin mutlak, kâmil ve tam bir bağlılıkla Allah'a bağlanmamasıdır. Allah en iyisini bilir."]]}]}, {"ts": "04:53", "title": "2. Külliye: Allah'ı vâcip kemalinden ta'til eden kâfirdir", "paras": [{"reader": false, "ar": [[293.4, "ومن الكليات أيضًا: <b>كلُّ من عطّل الله عز وجل عن كماله في ذاته وأفعاله فكافرٌ الكفرَ الأكبر.<\/b> كل من عطّل الله عز وجل عن كماله الواجب في ذاته وأفعاله فكافرٌ الكفرَ الأكبر."]], "tr": [[293.4, "Külliyelerden biri de şudur: 2."], [293.4, "külliye: Allah Azze ve Celle'yi zâtında ve fiillerinde (vâcip olan) kemalinden ta'til eden (yoksun sayan) herkes büyük küfürle kâfirdir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[317.0, "أقول وبالله التوفيق: وذلك لأن المتقرّر في قواعد أهل السنة والجماعة وجوبُ وصف الله عز وجل بكلّ كمال،"], [327.0, "فلا يجوز للإنسان أن يعمد إلى شيءٍ من كمالات الله عز وجل ثم يعطّله عنها،"], [335.0, "كالذين يعطّلون الله عز وجل عن أسمائه كلّها أو صفاته كلّها ـ كالجهمية ـ فإنهم كفّارٌ الكفرَ الأكبر."]], "tr": [[317.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşmiş olan, Allah Azze ve Celle'yi her kemalle vasfetmenin vâcip oluşudur."], [327.0, "İnsanın Allah'ın kemallerinden birine yönelip sonra O'nu ondan ta'til etmesi caiz değildir."], [335.0, "Allah'ı bütün isimlerinden veya bütün sıfatlarından ta'til edenler —Cehmiyye gibi— büyük küfürle kâfirdirler."]]}, {"reader": false, "ar": [[345.0, "وقد ذهب عامةُ أهل السنة والجماعة من المتأخّرين إلى تكفير الجهمية أتباعِ الجهم بن صفوان،"], [354.0, "لأن مذهبهم مبنيٌّ على أنه ليس فوق السماء ربٌّ يُعبد،"], [359.9, "ولا فوق العرش إلهٌ يُصلّى له ويُسجد؛"], [364.0, "فإنهم يعطّلون الله عز وجل عن كماله في أسمائه وكماله في صفاته،"], [371.0, "فلا يُثبتون لله عز وجل لا شيئًا من الأسماء ولا شيئًا من الصفات."], [375.0, "وقد حكى الإمام ابن القيم رحمه الله إجماعَ أهل السنة من المتأخّرين على تكفيرهم في قوله:"], [384.0, "«ولقد تقلّدَ كفرَهم خمسون في ... عشرٍ من العلماءِ في البلدانِ»."]], "tr": [[345.0, "Ehl-i Sünnet ve'l-Cemaat'in müteahhirînden olanlarının geneli, Cehm b."], [345.0, "Safvân'ın tâbileri olan Cehmiyye'yi tekfir etmiştir."], [345.0, "Çünkü onların mezhebi, semanın üstünde ibadet edilen bir Rab, Arş'ın üstünde kendisi için namaz kılınıp secde edilen bir İlah bulunmadığı esası üzerine kuruludur."], [364.0, "Onlar Allah Azze ve Celle'yi isimlerindeki ve sıfatlarındaki kemalinden ta'til ederler;"], [371.0, "Allah için ne bir isim ne de bir sıfat isbat ederler."], [371.0, "İmam İbnü'l-Kayyim (rahimehullah), Ehl-i Sünnet'in müteahhirînden olanlarının onları tekfir etmedeki icmâını şu sözüyle nakletmiştir:"], [384.0, "\"Onların küfrüne, beldelerdeki âlimlerden on kere elli (beş yüz) kişi hükmetmiştir.\""]]}, {"reader": false, "ar": [[392.0, "وكالذين يعطّلون الله عز وجل عن وجوده،"], [396.8, "وهم الملاحدة ـ ملاحدةُ الوجود ـ فيقولون:"], [400.4, "إن الله عز وجل ليس بموجود،"], [403.0, "وإن العالَم أو الكون خلق نفسه بنفسه،"], [408.0, "وإن هذا الإحكام لا يرجع إلى ربٍّ يدبّره ولا يصرّفه."], [413.0, "وهذا من أعظم ما عُطِّل الله عز وجل به،"], [417.0, "فلا جرم أنهم كفّار."]], "tr": [[392.0, "(Yine) Allah Azze ve Celle'yi varlığından ta'til edenler de böyledir;"], [396.8, "bunlar mülhidler, yani varlık (Allah'ın varlığı) konusundaki mülhidlerdir."], [400.4, "Allah Azze ve Celle'nin mevcut olmadığını, âlemin ya da kâinatın kendi kendini yarattığını, bu sağlamlığın (intizamın) onu idare eden ve tasarruf eden bir Rabbe dayanmadığını söylerler."], [413.0, "Bu, Allah Azze ve Celle'nin ta'til edildiği en büyük şeylerdendir; şüphesiz onlar kâfirdir."]]}, {"reader": false, "ar": [[420.0, "ويدخل فيها أيضًا من يُنكر كمالَ قدرة الله عز وجل على فعل كلّ شيء،"], [427.0, "فإنه مكذِّبٌ ومنكِرٌ وجاحدٌ لقول الله عز وجل:"], [431.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ﴾<\/span> [البقرة: 20]،"], [433.0, "ولقوله عز وجل: <span class=\"ayah\">﴿وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ مُّقْتَدِرًا﴾<\/span> [الكهف: 45]،"], [438.0, "ولقول الله عز وجل:"], [439.7, "<span class=\"ayah\">﴿وَمَا كَانَ اللَّهُ لِيُعْجِزَهُ مِن شَيْءٍ فِي السَّمَاوَاتِ وَلَا فِي الْأَرْضِ ۚ إِنَّهُ كَانَ عَلِيمًا قَدِيرًا﴾<\/span> [فاطر: 44]."]], "tr": [[420.0, "Allah Azze ve Celle'nin her şeyi yapmaya gücünün kemalini inkâr eden de bu külliyeye girer."], [427.0, "Çünkü o, Allah Azze ve Celle'nin şu sözlerini yalanlayan, inkâr eden ve reddeden kimsedir:"], [433.0, "<span class=\"ayah\">﴿Şüphesiz Allah her şeye kadirdir.﴾<\/span> [Bakara 20];"], [433.0, "<span class=\"ayah\">﴿Allah her şeye muktedirdir.﴾<\/span> [Kehf 45];"], [439.7, "<span class=\"ayah\">﴿Göklerde ve yerde hiçbir şey Allah'ı âciz bırakamaz. Şüphesiz O, hakkıyla bilendir, her şeye gücü yetendir.﴾<\/span> [Fâtır 44]"]]}, {"reader": false, "ar": [[446.0, "والآيات والنصوص في إثبات كمال قدرة الله عز وجل كثيرةٌ جدًّا."], [451.0, "فكلُّ من عطّل الله عز وجل عن كماله في قدرته،"], [456.0, "وأنه الفعّال لما يريد،"], [458.0, "فإنه يُعتبر كافرًا الكفرَ الأكبر المخرجَ عن الملة بالكلية."]], "tr": [[446.0, "Allah Azze ve Celle'nin kudretinin kemalini isbat eden ayetler ve naslar pek çoktur."], [451.0, "Allah Azze ve Celle'yi kudretindeki kemalinden ve dilediğini yapan olmasından ta'til eden herkes, dinden tamamen çıkaran büyük küfürle kâfir sayılır."]]}, {"reader": false, "ar": [[462.0, "وكذلك من عطّل الله عز وجل عن علمه فأنكر علمَ الله عز وجل،"], [469.0, "كالقدرية الأوائل الذين هم مجوسُ هذه الأمة؛"], [474.0, "فإنهم يقولون: بأن لا قدَر،"], [476.3, "وأن الله لا يعلم الأشياء قبل وقوعها،"], [479.6, "وأن الأمر أُنُف، وأن الله لم يكتب شيئًا من علمه الأزليّ في اللوح المحفوظ،"], [488.0, "ويُنكرون اللوح المحفوظ، وغير ذلك مما يتعلّق بكمال الله عز وجل في علمه."]], "tr": [[462.0, "Aynı şekilde Allah Azze ve Celle'yi ilminden ta'til edip Allah'ın ilmini inkâr eden de böyledir;"], [469.0, "bu ümmetin Mecûsîleri olan ilk Kaderiyye gibi."], [469.0, "Onlar kader diye bir şeyin olmadığını, Allah'ın eşyayı meydana gelmeden önce bilmediğini, işin yeni başladığını (önceden takdir edilmediğini), Allah'ın ezelî ilminden hiçbir şeyi Levh-i Mahfûz'a yazmadığını söylerler;"], [488.0, "Levh-i Mahfûz'u ve Allah Azze ve Celle'nin ilmindeki kemaliyle ilgili diğer şeyleri de inkâr ederler."]]}, {"reader": false, "ar": [[493.0, "وهؤلاء هم الذين قال فيهم ابنُ عمر رضي الله تعالى عنهما:"], [499.0, "«فإذا لقيتَ أولئك فأخبرهم أنهم بُرَآءُ مني، وأني بريءٌ منهم، والذي يحلف به عبدُ الله بن عمر: لو أن أحدهم أنفق مثلَ أُحُدٍ ذهبًا ما قبله الله منه حتى يؤمن بالقدر». <span class=\"note\">(Müslim)<\/span>"]], "tr": [[493.0, "İbn Ömer'in (radıyallahu anhumâ) haklarında şöyle dediği kimseler bunlardır:"], [493.0, "«Onlarla karşılaşırsan kendilerine haber ver ki onlar benden uzaktır, ben de onlardan uzağım. Abdullah b. Ömer'in üzerine yemin ettiği (Allah'a) andolsun ki, onlardan biri Uhud dağı kadar altın infak etse, kadere iman edinceye kadar Allah onu ondan kabul etmez.» <span class=\"note\">(Müslim)<\/span>"]]}, {"reader": false, "ar": [[514.0, "ويقول أهل السنة والجماعة:"], [515.7, "ناظِروهم بالعلم؛ فإن أقرّوا به فَلَجوا <span class=\"q\">؟ 08:37<\/span>،"], [519.9, "وإن عطّلوه وأنكروه كفروا."], [523.0, "وإنّ من أعظم ما عُطِّل الله عز وجل به عن كماله تعطيلَ الله عز وجل عن كمال علمه."]], "tr": [[514.0, "Ehl-i Sünnet ve'l-Cemaat şöyle der:"], [514.0, "Onlarla ilim (meselesi) üzerinden münazara edin;"], [515.7, "eğer onu kabul ederlerse (hüccetle) yenilmiş olurlar <span class=\"q\">؟<\/span>;"], [519.9, "eğer onu ta'til edip inkâr ederlerse kâfir olurlar."], [523.0, "Allah Azze ve Celle'nin kemalinden ta'til edildiği en büyük şeylerden biri, O'nun ilminin kemalinden ta'til edilmesidir."]]}, {"reader": false, "ar": [[530.0, "ويدخل فيه أيضًا من عطّل الله عز وجل عن تقديره وتدبيره وتصريفه في الأشياء،"], [539.0, "وأن الله عز وجل لم يكتب شيئًا من الأقدار في اللوح المحفوظ،"], [544.0, "وجميعُ الأشياء تحصل بلا قضاءٍ ولا قدر؛"], [549.5, "فهم يعطّلون الله عز وجل عن كمال تقديره للأشياء."], [554.0, "ولا يخفى على شريف علمكم أن الأدلة قد تواترت في أنه لا يكون شيءٌ من الأشياء إلا بقضاء الله عز وجل وقدره."]], "tr": [[530.0, "Allah Azze ve Celle'yi eşyadaki takdirinden, tedbirinden ve tasarrufundan ta'til eden;"], [530.0, "Allah'ın kaderlerden hiçbir şeyi Levh-i Mahfûz'a yazmadığını ve bütün eşyanın kaza ve kader olmaksızın meydana geldiğini söyleyen de buna girer."], [544.0, "Bunlar Allah Azze ve Celle'yi eşyayı takdir etmesinin kemalinden ta'til ederler."], [549.5, "Değerli ilminizce malumdur ki, hiçbir şeyin ancak Allah Azze ve Celle'nin kazası ve kaderiyle olacağı hususunda deliller tevâtür derecesine ulaşmıştır."]]}, {"reader": false, "ar": [[565.0, "وكذلك أيضًا من عطّل الله عز وجل عن الجزاء والحساب في يوم القيامة،"], [571.0, "وأنكر حقائقَ اليوم الآخر،"], [573.0, "وأن الناس إذا ماتوا لم يكن ثَمّةَ بعثٌ ولا نشورٌ ولا حسابٌ ولا عذابٌ ولا جنةٌ ولا نار؛"], [580.0, "فكلُّ ذلك من تعطيل الخالق عن كماله الواجب."], [584.0, "فصدقت لنا هذه الكلية:"], [586.0, "أن كلَّ من عطّل الله عز وجل عن كماله الواجب في شيءٍ من ذاته أو أفعاله فإنه يُعتبر كافرًا الكفرَ الأكبر."]], "tr": [[565.0, "Aynı şekilde Allah Azze ve Celle'yi kıyamet günündeki ceza ve hesaptan ta'til eden, âhiret gününün hakikatlerini inkâr eden ve insanlar ölünce ne ba's, ne neşr, ne hesap, ne azap, ne cennet ne de cehennem olmadığını söyleyen de böyledir."], [573.0, "Bütün bunlar Yaratıcı'yı vâcip olan kemalinden ta'til etmektir."], [580.0, "Böylece bu külliye bizim için doğrulanmış oldu:"], [586.0, "Allah Azze ve Celle'yi zâtından veya fiillerinden bir hususta vâcip olan kemalinden ta'til eden herkes büyük küfürle kâfir sayılır."]]}, {"reader": false, "ar": [[596.0, "إلا أنه لا بدّ أن نقيّدها بأن يكون تعطيلُه تعطيلَ جحودٍ وتكذيبٍ وإنكار."], [603.0, "لكن إذا عطّل الإنسانُ الربَّ عن شيءٍ من كماله في أسمائه تأويلًا،"], [610.8, "فحينئذٍ ننتظر به حتى نكشف عنه الشبهة."], [617.0, "فإذا كان تعطيلُ كمالات الرب عز وجل تعطيلَ جحودٍ وإنكار فلا جرم أنه داخلٌ تحت هذه الكلية،"], [625.0, "وأما إذا كان تعطيلُه عن شيءٍ من كمالاته ـ في أسمائه أو صفاته أو أفعاله ـ تعطيلَ شبهةٍ وتأويل،"], [635.0, "فإننا ننتظر به حتى نكشفها عنه، والله أعلم."]], "tr": [[596.0, "Ancak bunu, ta'tilinin cuhûd (bile bile inkâr), tekzip ve inkâr ta'tili olması şartıyla kayıtlamamız gerekir."], [603.0, "Fakat insan Rabbi isimlerindeki kemalinden bir şeyden te'vil yoluyla ta'til ederse, o zaman şüphesini kendisinden giderinceye kadar onu bekleriz."], [617.0, "Rabbin kemallerini ta'til etmesi cuhûd ve inkâr ta'tili ise şüphesiz bu külliyenin altına girer."], [617.0, "Ama O'nu isimlerinde, sıfatlarında veya fiillerinde kemallerinden birinden ta'til etmesi bir şüphe ve te'vil ta'tili ise, şüpheyi kendisinden giderinceye kadar onu bekleriz. Allah en iyisini bilir."]]}]}, {"ts": "10:39", "title": "3. Külliye: Tedbir ve tasarrufta mahlûku Allah'a ortak kılan müşriktir", "paras": [{"reader": false, "ar": [[639.0, "ومن الكليات أيضًا: <b>كلُّ من اعتقد في مخلوقٍ مشاركةَ الله<\/b> ـ يرحمك الله ـ <b>كلُّ من اعتقد في مخلوقٍ مشاركةَ الله عز وجل في شيءٍ من التدبير والتصريف فمشركٌ في ربوبيته.<\/b> أعيدها مرةً أخرى:"], [666.0, "كل من اعتقد في مخلوقٍ مشاركة الله عز وجل في شيءٍ من التدبير والتصريف فمشركٌ في ربوبيته."]], "tr": [[639.0, "Külliyelerden biri de şudur: 3."], [639.0, "külliye: Bir mahlûkun Allah'a ortak olduğuna —Allah sana rahmet etsin (aksırana)— bir mahlûkun tedbir ve tasarruftan herhangi bir şeyde Allah Azze ve Celle'ye ortak olduğuna inanan herkes, O'nun rubûbiyyetinde müşriktir. Bir kez daha tekrar ediyorum: (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[681.0, "أقول وبالله التوفيق: ونعني به الشركَ الأكبر المخرجَ من الملة بالكلية،"], [686.9, "والعياذ بالله. وذلك لأن المتقرّر في قواعد أهل السنة أن المدبِّر والمتصرِّف في كلّ هذا العالم ـ بكلّ ذرّاته ـ على الحقيقة إنما هو الله عز وجل وحده لا شريك له."], [701.0, "وعلى ذلك قامت الأدلة الكثيرة التي تنسب التدبير والتصريف لله عز وجل،"], [707.0, "كقول الله عز وجل:"], [709.3, "<span class=\"ayah\">﴿وَإِن يَمْسَسْكَ اللَّهُ بِضُرٍّ فَلَا كَاشِفَ لَهُ إِلَّا هُوَ ۖ وَإِن يُرِدْكَ بِخَيْرٍ فَلَا رَادَّ لِفَضْلِهِ﴾<\/span> [يونس: 107]."]], "tr": [[681.0, "Tevfik Allah'tandır, derim ki: Bununla dinden tamamen çıkaran büyük şirki kastediyoruz;"], [681.0, "Allah'a sığınırız. Bunun sebebi, Ehl-i Sünnet'in kaidelerinde yerleşmiş olan şudur:"], [686.9, "Bütün zerreleriyle bu âlemin tamamında hakiki olarak tedbir eden (idare eden) ve tasarruf eden ancak ortağı olmayan tek Allah Azze ve Celle'dir."], [701.0, "Tedbir ve tasarrufu Allah Azze ve Celle'ye nispet eden pek çok delil bunun üzerine kurulmuştur."], [707.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [709.3, "<span class=\"ayah\">﴿Eğer Allah sana bir zarar dokundurursa onu O'ndan başka giderecek yoktur. Eğer sana bir hayır dilerse O'nun lütfunu geri çevirecek de yoktur.﴾<\/span> [Yûnus 107]"]]}, {"reader": false, "ar": [[718.0, "وقول الله عز وجل:"], [720.3, "<span class=\"ayah\">﴿وَمَن يُدَبِّرُ الْأَمْرَ ۚ فَسَيَقُولُونَ اللَّهُ ۚ فَقُلْ أَفَلَا تَتَّقُونَ﴾<\/span> [يونس: 31]،"], [725.0, "وقول الله عز وجل:"], [726.8, "<span class=\"ayah\">﴿يُدَبِّرُ الْأَمْرَ ۖ مَا مِن شَفِيعٍ إِلَّا مِن بَعْدِ إِذْنِهِ﴾<\/span> [يونس: 3]."], [731.0, "ويقول الله عز وجل:"], [733.2, "<span class=\"ayah\">﴿يَسْأَلُهُ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ ۚ كُلَّ يَوْمٍ هُوَ فِي شَأْنٍ﴾<\/span> [الرحمن: 29]،"], [738.6, "أي: من شؤون التدبير والتصريف الاستقلاليّ الابتدائيّ التقديريّ."]], "tr": [[718.0, "Allah Azze ve Celle'nin şu sözü:"], [720.3, "<span class=\"ayah\">﴿\"İşleri kim idare ediyor?\" (diye sor). \"Allah\" diyecekler. De ki: \"O hâlde (O'na karşı gelmekten) sakınmaz mısınız?\"﴾<\/span> [Yûnus 31];"], [726.8, "ve Allah Azze ve Celle'nin şu sözü:"], [726.8, "<span class=\"ayah\">﴿İşleri O idare eder. O'nun izni olmadan hiçbir şefaatçi yoktur.﴾<\/span> [Yûnus 3]."], [731.0, "Allah Azze ve Celle şöyle buyurur:"], [733.2, "<span class=\"ayah\">﴿Göklerde ve yerde olanlar O'ndan ister. O her gün bir iştedir.﴾<\/span> [Rahmân 29] Yani müstakil, ibtidâî (ilk baştan) ve takdirî tedbir ve tasarruf işlerinden bir iştedir."]]}, {"reader": false, "ar": [[743.0, "فيُغني هذا ويُفقر هذا،"], [745.0, "ويوجد هذا ويُعدم هذا،"], [747.0, "ويُحيي هذا ويُميت هذا،"], [749.0, "ويُغني هذا ويُفقر هذا،"], [751.2, "ويُمرض هذا ويُصحّ هذا،"], [753.5, "ويُقرّب هذا ويُبعد هذا،"], [755.8, "وينصر هذا ويهزم هذا،"], [758.0, "ويُعزّ هذا ويُذلّ هذا."], [761.0, "وهذا من باب التدبير الذي يجب أن نعتقد وحدانيةَ الله عز وجل به."]], "tr": [[743.0, "Birini zengin eder, birini fakir eder;"], [745.0, "birini var eder, birini yok eder;"], [747.0, "birini diriltir, birini öldürür; birini zengin eder, birini fakir eder;"], [751.2, "birini hasta eder, birini iyileştirir;"], [753.5, "birini yaklaştırır, birini uzaklaştırır; birine yardım eder, birini bozguna uğratır;"], [758.0, "birini aziz eder, birini zelil eder."], [761.0, "Bu, Allah Azze ve Celle'nin onda tek olduğuna inanmamız gereken tedbir babındandır."]]}, {"reader": false, "ar": [[768.0, "وكما قال الله عز وجل:"], [771.0, "<span class=\"ayah\">﴿اللَّهُ الَّذِي خَلَقَكُمْ ثُمَّ رَزَقَكُمْ ثُمَّ يُمِيتُكُمْ ثُمَّ يُحْيِيكُمْ ۖ هَلْ مِن شُرَكَائِكُم مَّن يَفْعَلُ مِن ذَٰلِكُم مِّن شَيْءٍ﴾<\/span> [الروم: 40]."], [781.0, "ويقول الله عز وجل:"], [782.0, "<span class=\"ayah\">﴿قُلِ ادْعُوا الَّذِينَ زَعَمْتُم مِّن دُونِ اللَّهِ ۖ لَا يَمْلِكُونَ مِثْقَالَ ذَرَّةٍ﴾<\/span> أي:"], [788.2, "من التدبير والتصريف والملك والخلق،"], [792.0, "<span class=\"ayah\">﴿لَا يَمْلِكُونَ مِثْقَالَ ذَرَّةٍ فِي السَّمَاوَاتِ وَلَا فِي الْأَرْضِ وَمَا لَهُمْ فِيهِمَا مِن شِرْكٍ﴾<\/span> أي:"], [800.4, "مشاركة، <span class=\"ayah\">﴿وَمَا لَهُ مِنْهُم مِّن ظَهِيرٍ﴾<\/span> [سبأ: 22] أي: مُعين."]], "tr": [[768.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [771.0, "<span class=\"ayah\">﴿Allah O'dur ki sizi yarattı, sonra sizi rızıklandırdı, sonra sizi öldürecek, sonra da diriltecektir. Ortaklarınızdan bunlardan herhangi birini yapabilen var mı?﴾<\/span> [Rûm 40] Allah Azze ve Celle şöyle buyurur:"], [782.0, "<span class=\"ayah\">﴿De ki: Allah'ı bırakıp da (ilah olduklarını) iddia ettiklerinizi çağırın. Onlar zerre ağırlığınca bir şeye sahip değildirler﴾<\/span> —yani tedbir, tasarruf, mülk ve yaratmadan— <span class=\"ayah\">﴿göklerde de yerde de zerre ağırlığınca bir şeye sahip değildirler. Onların bu ikisinde hiçbir ortaklığı yoktur﴾<\/span> —yani iştirakleri— <span class=\"ayah\">﴿O'nun onlardan hiçbir yardımcısı da yoktur.﴾<\/span> [Sebe' 22] —yani muîni."]]}, {"reader": false, "ar": [[805.0, "فنفى الله عز وجل عن كلّ المخلوقات أن تكون خالقةً استقلالًا،"], [809.9, "أو مشاركةً في شيءٍ من التدبير والتصريف،"], [813.0, "أو مُعينةً له على شيءٍ من تدبير أمر ملكوته تبارك وتعالى."], [819.0, "فإذا جاءنا رجلٌ يعتقد في أحد المخلوقات العُلوية أو السُّفلية ـ أيًّا كانت منزلةُ هذا المخلوق ـ بأنه يشارك الله عز وجل في شيءٍ من التدبير أو التصريف الاستقلاليّ الابتدائيّ التقديريّ،"], [837.0, "فلا جرم أنه قد وقع في الشرك الأكبر الذي يُخرجه عن دائرة الإسلام بالكلية."]], "tr": [[805.0, "Böylece Allah Azze ve Celle bütün mahlûkattan müstakil olarak yaratıcı olmayı, tedbir ve tasarruftan bir şeyde ortak olmayı ya da melekûtunun işlerinin idaresinde O'na yardımcı olmayı nefyetmiştir."], [819.0, "Bir adam gelip —mertebesi ne olursa olsun— yüce ya da aşağı mahlûklardan birinin müstakil, ibtidâî ve takdirî tedbir veya tasarruftan bir şeyde Allah Azze ve Celle'ye ortak olduğuna inanırsa, şüphesiz onu İslam dairesinden tamamen çıkaran büyük şirke düşmüştür."]]}, {"reader": false, "ar": [[844.0, "وعلى ذلك شركُ النصارى،"], [846.7, "فإنهم يزعمون أن الله عز وجل هو المسيح ابن مريم،"], [854.0, "وأن الله ثالثُ ثلاثة،"], [856.0, "وأن المسيح ابن الله؛"], [858.0, "أي: في التدبير والتصريف الابتدائيّ التقديريّ."], [861.0, "ويدخل في ذلك أيضًا شركُ الذي <span class=\"ayah\">﴿حَاجَّ إِبْرَاهِيمَ فِي رَبِّهِ أَنْ آتَاهُ اللَّهُ الْمُلْكَ إِذْ قَالَ إِبْرَاهِيمُ رَبِّيَ الَّذِي يُحْيِي وَيُمِيتُ﴾<\/span> ـ أي:"], [874.2, "ابتداءً وتقديرًا ـ <span class=\"ayah\">﴿قَالَ أَنَا أُحْيِي وَأُمِيتُ﴾<\/span> [البقرة: 258]،"], [877.5, "فزعم أنه مشاركٌ لله عز وجل في هذه الخصلة من خصال الربوبية."]], "tr": [[844.0, "Hristiyanların şirki bunun üzerinedir. Onlar Allah Azze ve Celle'nin Meryem oğlu Mesih olduğunu, Allah'ın üçün üçüncüsü olduğunu ve Mesih'in Allah'ın oğlu olduğunu iddia ederler;"], [858.0, "yani ibtidâî ve takdirî tedbir ve tasarrufta (ortak kılarlar)."], [861.0, "Şu kimsenin şirki de buna girer:"], [861.0, "<span class=\"ayah\">﴿Allah kendisine hükümranlık verdi diye Rabbi hakkında İbrahim ile tartışan; hani İbrahim \"Benim Rabbim diriltir ve öldürür\" demişti﴾<\/span> —yani ilk baştan ve takdir ederek— <span class=\"ayah\">﴿o da \"Ben de diriltir ve öldürürüm\" dedi.﴾<\/span> [Bakara 258] Böylece rubûbiyyet hasletlerinden bu haslette Allah Azze ve Celle'ye ortak olduğunu iddia etti."]]}, {"reader": false, "ar": [[885.0, "ويدخل في ذلك أيضًا شركُ الصابئة عُبّادِ الأفلاك السبعة،"], [890.0, "الذين هم قومُ إبراهيم،"], [894.0, "فإنهم يعتقدون أن الأفلاك السماوية السبعة تُعين الله أو تشاركه في تدبير أمر ملكوته."]], "tr": [[885.0, "İbrahim'in kavmi olan, yedi feleğe (gezegene) tapan Sâbiîlerin şirki de buna girer."], [890.0, "Onlar yedi semavî feleğin, melekûtunun işlerini idare etmede Allah'a yardım ettiğine veya O'na ortak olduğuna inanırlar."]]}]}, {"ts": "15:02", "title": "3. Külliye (devam): Sâbiîler, kabirciler, Râfıza, Kaderiyye ve Mecûsîler", "paras": [{"reader": false, "ar": [[902.0, "وقد جمع الناظمُ هذه الأفلاك السبعة في قوله:"], [907.3, "«زُحَلٌ شرى مِرّيخَه من شمسِه ... فتزاهرت لعُطاردَ الأقمارُ»."], [916.0, "فهذه الكواكب السبعة تزعم الصابئةُ أن لها تدبيرًا وتصريفًا استقلاليًّا تقديريًّا خفيًّا في الكون مع الله تبارك وتعالى."]], "tr": [[902.0, "Nâzım bu yedi feleği şu sözünde toplamıştır:"], [902.0, "\"Zuhal, (Müş)terî, Merrîh, Şems, (Zühre), Utârid ve Kamer\" (Satürn, Jüpiter, Mars, Güneş, Venüs, Merkür ve Ay)."], [916.0, "Sâbiîler bu yedi gezegenin, Allah Tebâreke ve Teâlâ ile birlikte kâinatta müstakil, takdirî ve gizli bir tedbir ve tasarrufu olduğunu iddia ederler."]]}, {"reader": false, "ar": [[928.0, "ولذلك لما حاجّهم إبراهيم عليه الصلاة والسلام حاجّهم في حركة هذه الكواكب،"], [936.0, "كما قال الله عز وجل عنه محاجًّا لقومه:"], [940.0, "<span class=\"ayah\">﴿فَنَظَرَ نَظْرَةً فِي النُّجُومِ ۝ فَقَالَ إِنِّي سَقِيمٌ﴾<\/span> [الصافات: 88–89]."], [944.0, "وقال الله عز وجل عنه:"], [947.1, "لما طلعت الشمسُ والقمرُ والكوكب،"], [950.2, "كلُّها يقول: «هذا ربي»،"], [952.5, "ثم يستدلّ على بطلان ربوبيته بغياب نفعه عن العالم،"], [957.0, "حتى أوصلهم إلى أن هذه الأفلاك والكواكب لا شأن لها في التدبير والتصريف."]], "tr": [[928.0, "Bu yüzden İbrahim (aleyhisselâm) onlarla tartıştığında, bu gezegenlerin hareketi üzerinden tartıştı."], [928.0, "Nitekim Allah Azze ve Celle, kavmiyle tartışırken ondan şöyle haber verir:"], [940.0, "<span class=\"ayah\">﴿Yıldızlara bir göz attı ve \"Ben hastayım\" dedi.﴾<\/span> [Sâffât 88–89] Yine Allah Azze ve Celle ondan haber verir:"], [944.0, "Güneş, ay ve yıldız doğduğunda her biri için \"Bu benim Rabbimdir\" diyor, sonra onun faydasının âlemden kaybolmasıyla rubûbiyyetinin bâtıl olduğuna delil getiriyordu."], [952.5, "Sonunda onları, bu feleklerin ve gezegenlerin tedbir ve tasarrufta hiçbir payı olmadığı sonucuna ulaştırdı."]]}, {"reader": false, "ar": [[965.0, "ويدخل في ذلك أيضًا شركُ القبوريين الذين يصرفون لها كثيرًا من العبادات،"], [971.0, "معتقدين أن هذا الوليَّ أو المقبورَ له تدبيرٌ خفيٌّ وتصريفٌ في الكون:"], [978.0, "من الرزق والنصر والإعزاز والرفعة،"], [981.5, "أو الشفاعة عند الله عز وجل."]], "tr": [[965.0, "Kabirlere birçok ibadeti yönelten kabircilerin (kubûriyyûn) şirki de buna girer."], [965.0, "Onlar bu velinin ya da kabirde yatanın kâinatta gizli bir tedbiri ve tasarrufu olduğuna inanırlar:"], [971.0, "rızık, zafer, izzet vermek, yüceltmek ya da Allah Azze ve Celle katında şefaat etmek gibi."]]}, {"reader": false, "ar": [[987.0, "ويدخل في ذلك شركُ الرافضة الذين يزعمون أن آل البيت لهم الأحقّيّة المطلقة في أفعال الربوبية كأحقّيّتها لله عز وجل؛"], [1001.0, "فلهم الأحقّيّة في أن يُعزّوا هذا ويُذلّوا هذا،"], [1005.0, "وأن لهم الأحقّيّة في مشاركة الله عز وجل في علم الغيب،"], [1010.5, "وفي التدبير والتصريف، وغير ذلك."], [1013.0, "فالرافضة الذين يعتقدون مثلَ هذا الاعتقاد لا جرم أنهم مشركون في باب الربوبية."]], "tr": [[987.0, "Ehl-i Beyt'in, rubûbiyyet fiillerinde Allah Azze ve Celle'nin hakkı gibi mutlak bir hakka sahip olduğunu iddia eden Râfıza'nın şirki de buna girer."], [1001.0, "(Onlara göre) Ehl-i Beyt'in birini aziz, birini zelil etme hakkı;"], [1005.0, "gayb ilminde, tedbir ve tasarrufta ve başka hususlarda Allah Azze ve Celle'ye ortak olma hakkı vardır."], [1013.0, "Böyle bir inanca sahip olan Râfıza, şüphesiz rubûbiyyet babında müşriktir."]]}, {"reader": false, "ar": [[1022.0, "ويدخل في ذلك أيضًا شركُ القدرية الذين يزعمون بأن المخلوق هو الذي يخلق فعلَه،"], [1034.0, "كما وصفهم النبي ﷺ في ذلك في بعض الأحاديث ـ وإن كانت ضعيفة،"], [1041.0, "إلا أن أهل السنة قد تلقّوها بالقبول ـ:"], [1046.0, "«أن القدرية مجوسُ هذه الأمة»."], [1050.0, "ووجهُ مشابهة القدرية المعتزلة للمجوس المانوية الثَّنَوية:"], [1059.0, "أنهم يزعمون أن للعالَم خالقَين."]], "tr": [[1022.0, "Mahlûkun kendi fiilini kendisinin yarattığını iddia eden Kaderiyye'nin şirki de buna girer."], [1022.0, "Nitekim Nebî ﷺ bazı hadislerde —bunlar zayıf olsa da Ehl-i Sünnet onları kabulle karşılamıştır— onları «Kaderiyye bu ümmetin Mecûsîleridir» diye vasfetmiştir."], [1046.0, "Mu'tezilî Kaderiyye'nin, Mâniheist ve düalist (seneviyye) Mecûsîlere benzeme yönü, âlemin iki yaratıcısı olduğunu iddia etmeleridir."]]}, {"reader": false, "ar": [[1062.0, "فالقدرية تقول بأن الله عز وجل لم يخلق أفعالَ العباد،"], [1067.0, "وإنما العبادُ هم الذين يخلقون أفعالهم بأنفسهم؛"], [1072.0, "فزعموا أن لله مشاركًا في تدبيره وخلقه وتصريفه."], [1077.0, "ومن ذلك أيضًا شركُ المجوس ـ كما ذكرتُ لكم ـ لأنهم يعتقدون أن للعالَم خالقَين:"], [1084.6, "النورَ والظلمة، فيجعلون النورَ خالقًا للخير،"], [1089.0, "والظلمةَ تخلق الشرّ. وهكذا دواليك في كلّ من زعم أن للمخلوق شيئًا من التدبير،"], [1098.9, "أو المشاركة في شيءٍ من تدبير ملكوت الله تبارك وتعالى."]], "tr": [[1062.0, "Kaderiyye, Allah Azze ve Celle'nin kulların fiillerini yaratmadığını, kulların fiillerini bizzat kendilerinin yarattığını söyler."], [1067.0, "Böylece Allah'ın tedbirinde, yaratmasında ve tasarrufunda bir ortağı olduğunu iddia etmişlerdir."], [1077.0, "Size zikrettiğim gibi Mecûsîlerin şirki de bundandır;"], [1077.0, "çünkü onlar âlemin iki yaratıcısı olduğuna inanırlar:"], [1084.6, "nur ve zulmet. Nuru hayrı yaratan, zulmeti de şerri yaratan kılarlar."], [1089.0, "Mahlûkun bir tedbiri olduğunu ya da Allah Tebâreke ve Teâlâ'nın melekûtunun idaresinde bir şeye ortak olduğunu iddia eden herkes için durum böyle devam eder."]]}, {"reader": false, "ar": [[1104.0, "وأما نحن معاشرَ المسلمين فنؤمن إيمانًا جازمًا قطعيًّا بأن المدبِّر على الحقيقة،"], [1111.7, "والمتصرِّف على الحقيقة في كلّ شؤون هذا العالَم ـ عُلويِّه وسُفليِّه،"], [1117.6, "صغيره وكبيره، جليله وحقيره ـ إنما هو الله عز وجل وحده لا شريك له."], [1125.0, "فلا الملائكةُ يملكون شيئًا من هذا التدبير الاستقلاليّ الابتدائيّ،"], [1130.0, "ولا الأنبياءُ والرسلُ يملكون شيئًا من هذا التدبير الاستقلاليّ الابتدائيّ،"], [1135.0, "ولا الأولياءُ والصالحون يملكون شيئًا من هذا التدبير الاستقلاليّ،"], [1139.8, "فضلًا عن غيرهم من الإنس والجن."], [1143.0, "إنما الذي يملكه واحدٌ أحدٌ فردٌ صمدٌ،"], [1147.1, "لم يلد ولم يولد،"], [1149.5, "وهو الله تبارك وتعالى، والله أعلم."]], "tr": [[1104.0, "Biz Müslümanlar topluluğuna gelince: Bu âlemin bütün işlerinde —yücesinde ve aşağısında, küçüğünde ve büyüğünde, değerlisinde ve değersizinde— hakiki olarak tedbir eden ve hakiki olarak tasarruf edenin, ortağı olmayan tek Allah Azze ve Celle olduğuna kesin ve kat'î bir imanla inanırız."], [1125.0, "Ne melekler bu müstakil, ibtidâî tedbirden bir şeye sahiptir;"], [1125.0, "ne peygamberler ve resuller bu müstakil, ibtidâî tedbirden bir şeye sahiptir;"], [1130.0, "ne de veliler ve salihler bu müstakil tedbirden bir şeye sahiptir;"], [1135.0, "insanlardan ve cinlerden diğerleri ise hiç sahip değildir."], [1139.8, "Buna sahip olan ancak bir, tek, eşsiz, Samed olan;"], [1143.0, "doğurmamış ve doğurulmamış olan Allah Tebâreke ve Teâlâ'dır. Allah en iyisini bilir."]]}]}, {"ts": "19:13", "title": "4. Külliye: Bir mahlûkun mutlak gaybı bildiğine inanan kâfirdir", "paras": [{"reader": false, "ar": [[1153.0, "ومن الكليات أيضًا: <b>كلُّ من اعتقد في مخلوقٍ علمَ شيءٍ من الغيب المطلق فكافرٌ الكفرَ الأكبر.<\/b> كل من اعتقد في مخلوقٍ أنه يعلم شيئًا من الغيب المطلق فكافرٌ الكفرَ الأكبر."], [1176.0, "كل من اعتقد في مخلوقٍ أنه يعلم شيئًا من الغيب فإنه كافرٌ الكفرَ الأكبر."]], "tr": [[1153.0, "Külliyelerden biri de şudur: 4."], [1153.0, "külliye: Bir mahlûkun mutlak gaybdan bir şey bildiğine inanan herkes büyük küfürle kâfirdir. (İki kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1184.0, "أقول وبالله التوفيق: وذلك لأن المتقرّر في القواعد أن علمَ الغيب المطلق من خصائص الله عز وجل،"], [1191.0, "فلا يعلم الغيبَ المطلق إلا الله تبارك وتعالى،"], [1194.1, "كما قال الله عز وجل:"], [1196.0, "<span class=\"ayah\">﴿قُل لَّا يَعْلَمُ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ الْغَيْبَ إِلَّا اللَّهُ﴾<\/span> [النمل: 65]،"], [1200.0, "وقولِ الله عز وجل:"], [1201.0, "<span class=\"ayah\">﴿وَعِندَهُ مَفَاتِحُ الْغَيْبِ لَا يَعْلَمُهَا إِلَّا هُوَ﴾<\/span> [الأنعام: 59]،"], [1205.0, "وقولِ الله تبارك وتعالى:"], [1207.0, "<span class=\"ayah\">﴿عَالِمُ الْغَيْبِ فَلَا يُظْهِرُ عَلَىٰ غَيْبِهِ أَحَدًا﴾<\/span> [الجن: 26]."]], "tr": [[1184.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, kaidelerde yerleşmiş olan şudur:"], [1184.0, "Mutlak gayb ilmi Allah Azze ve Celle'ye has olan şeylerdendir;"], [1191.0, "mutlak gaybı Allah Tebâreke ve Teâlâ'dan başkası bilmez."], [1196.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1196.0, "<span class=\"ayah\">﴿De ki: Göklerde ve yerde olanlardan Allah'tan başka kimse gaybı bilmez.﴾<\/span> [Neml 65];"], [1200.0, "Allah Azze ve Celle'nin şu sözü:"], [1201.0, "<span class=\"ayah\">﴿Gaybın anahtarları O'nun katındadır; onları O'ndan başkası bilmez.﴾<\/span> [En'âm 59];"], [1205.0, "ve Allah Tebâreke ve Teâlâ'nın şu sözü:"], [1207.0, "<span class=\"ayah\">﴿O gaybı bilendir; gaybına kimseyi muttali kılmaz.﴾<\/span> [Cin 26]"]]}, {"reader": false, "ar": [[1213.0, "وقد ذكر الله عز وجل أن من مقتضيات ربوبيته ـ في مواضع كثيرةٍ جدًّا من القرآن ـ أنه عالمُ الغيب والشهادة."], [1224.0, "وقال الله عز وجل عن الجن:"], [1227.0, "<span class=\"ayah\">﴿فَلَمَّا خَرَّ تَبَيَّنَتِ الْجِنُّ أَن لَّوْ كَانُوا يَعْلَمُونَ الْغَيْبَ مَا لَبِثُوا فِي الْعَذَابِ الْمُهِينِ﴾<\/span> [سبأ: 14]."], [1234.0, "وقال عن سيّد الأنبياء عليه الصلاة والسلام:"], [1238.5, "<span class=\"ayah\">﴿قُل لَّا أَمْلِكُ لِنَفْسِي نَفْعًا وَلَا ضَرًّا … وَلَوْ كُنتُ أَعْلَمُ الْغَيْبَ لَاسْتَكْثَرْتُ مِنَ الْخَيْرِ وَمَا مَسَّنِيَ السُّوءُ﴾<\/span> [الأعراف: 188] <span class=\"note\">(Şeyh «إلا ما شاء الله» kısmını okumadı)<\/span>."]], "tr": [[1213.0, "Allah Azze ve Celle, Kur'an'ın pek çok yerinde rubûbiyyetinin gereklerinden birinin, gaybı ve şehâdeti (görüleni) bilen olması olduğunu zikretmiştir."], [1227.0, "Allah Azze ve Celle cinler hakkında şöyle buyurmuştur:"], [1227.0, "<span class=\"ayah\">﴿(Süleyman) yere yıkılınca cinler anladılar ki, eğer gaybı bilselerdi o alçaltıcı azap içinde kalmazlardı.﴾<\/span> [Sebe' 14] Peygamberlerin efendisi (aleyhissalâtu vesselâm) hakkında da şöyle buyurmuştur:"], [1238.5, "<span class=\"ayah\">﴿De ki: Ben kendime bir fayda ya da zarar verme gücüne sahip değilim… Eğer gaybı bilseydim, daha çok hayır elde ederdim ve bana hiçbir kötülük dokunmazdı.﴾<\/span> [A'râf 188]"]]}, {"reader": false, "ar": [[1249.0, "وقال الله عز وجل منكرًا على من زعم شيئًا من الفضائل الشرعية:"], [1254.5, "<span class=\"ayah\">﴿أَطَّلَعَ الْغَيْبَ أَمِ اتَّخَذَ عِندَ الرَّحْمَٰنِ عَهْدًا﴾<\/span> [مريم: 78]،"], [1259.5, "وكلاهما لم يحصل. وكذلك الله عز وجل يقول:"], [1265.1, "<span class=\"ayah\">﴿وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ﴾<\/span> ـ أي:"], [1268.8, "علم الغيب ـ <span class=\"ayah\">﴿إِلَّا بِمَا شَاءَ﴾<\/span> [البقرة: 255]."], [1273.0, "والأدلة في هذا المعنى كثيرة:"], [1279.0, "يقول الله عز وجل:"], [1281.4, "<span class=\"ayah\">﴿وَمَا كَانَ اللَّهُ لِيُطْلِعَكُمْ عَلَى الْغَيْبِ﴾<\/span> [آل عمران: 179]،"], [1285.0, "وقال الله عز وجل:"], [1287.7, "<span class=\"ayah\">﴿قُل لَّا أَقُولُ لَكُمْ عِندِي خَزَائِنُ اللَّهِ وَلَا أَعْلَمُ الْغَيْبَ﴾<\/span> [الأنعام: 50]،"], [1296.0, "وكذلك يقول الله عز وجل:"], [1299.5, "<span class=\"ayah\">﴿فَقُلْ إِنَّمَا الْغَيْبُ لِلَّهِ فَانتَظِرُوا إِنِّي مَعَكُم مِّنَ الْمُنتَظِرِينَ﴾<\/span> [يونس: 20]."]], "tr": [[1249.0, "Allah Azze ve Celle, şer'î faziletlerden bir şey (kendisinde olduğunu) iddia edeni kınayarak şöyle buyurmuştur:"], [1254.5, "<span class=\"ayah\">﴿Gaybı mı öğrendi, yoksa Rahmân katında bir söz mü aldı?﴾<\/span> [Meryem 78] Bunların ikisi de gerçekleşmemiştir."], [1259.5, "Aynı şekilde Allah Azze ve Celle şöyle buyurur:"], [1265.1, "<span class=\"ayah\">﴿Onlar O'nun ilminden hiçbir şeyi kavrayamazlar﴾<\/span> —yani gayb ilminden— <span class=\"ayah\">﴿ancak O'nun dilediği kadarını (bilirler).﴾<\/span> [Bakara 255] Bu manadaki deliller çoktur."], [1281.4, "Allah Azze ve Celle şöyle buyurur:"], [1281.4, "<span class=\"ayah\">﴿Allah sizi gayba muttali kılacak değildir.﴾<\/span> [Âl-i İmrân 179] Allah Azze ve Celle şöyle buyurmuştur:"], [1287.7, "<span class=\"ayah\">﴿De ki: Size, Allah'ın hazineleri benim yanımdadır demiyorum; gaybı da bilmem.﴾<\/span> [En'âm 50] Aynı şekilde Allah Azze ve Celle şöyle buyurur:"], [1299.5, "<span class=\"ayah\">﴿De ki: Gayb ancak Allah'a aittir. Bekleyin, ben de sizinle birlikte bekleyenlerdenim.﴾<\/span> [Yûnus 20]"]]}, {"reader": false, "ar": [[1306.0, "فإن قلت: ولماذا قيّدتَ القاعدة بقولك:"], [1310.3, "«الغيب المطلق»؟ فأقول: لأن الغيب عند أهل السنة ينقسم إلى قسمين:"], [1319.4, "إلى غيبٍ مطلق، وإلى غيبٍ نسبي."], [1323.0, "فأما الغيب المطلق فهو الغيب الذي اختصّ الله عز وجل به،"], [1330.0, "فلا يعلم أحدٌ من ملائكة السماء والأرض شيئًا من هذا الغيب المطلق أبدًا،"], [1337.0, "ولا الأنبياءُ والرسلُ يعلمون شيئًا من هذا الغيب المطلق إلا ما أوحاه الله عز وجل إليهم في دليل الشرع،"], [1348.0, "ولا الأولياءُ والصالحون يعلمون شيئًا من هذا الغيب أبدًا."]], "tr": [[1306.0, "Eğer \"Kaideyi niçin 'mutlak gayb' sözüyle kayıtladın?\" dersen, derim ki:"], [1310.3, "Çünkü Ehl-i Sünnet'e göre gayb iki kısma ayrılır:"], [1319.4, "mutlak gayb ve nisbî gayb."], [1319.4, "Mutlak gayb, Allah Azze ve Celle'nin kendisine has kıldığı gaybdır."], [1330.0, "Göğün ve yerin meleklerinden hiçbiri bu mutlak gaybdan asla bir şey bilmez."], [1330.0, "Peygamberler ve resuller de bu mutlak gaybdan, Allah Azze ve Celle'nin şer'î delilde onlara vahyettiği dışında bir şey bilmezler."], [1348.0, "Veliler ve salihler de bu gaybdan asla bir şey bilmezler."]]}, {"reader": false, "ar": [[1352.0, "فمتى ما زعم زاعمٌ بأن أحدًا من هذه المخلوقات يشارك الله عز وجل في شيءٍ من علم الغيب المطلق ـ ولو شيئًا يسيرًا ـ فإنه يُعتبر خالعًا رِبْقةَ الإسلام من عنقه بالكلية،"], [1372.0, "لأنه سوّى غيرَ الله بالله في شيءٍ من خصائص ربوبيته عز وجل."]], "tr": [[1352.0, "Biri, bu mahlûklardan birinin mutlak gayb ilminden bir şeyde —az bir şey de olsa— Allah Azze ve Celle'ye ortak olduğunu iddia ederse, İslam bağını boynundan tamamen çıkarmış sayılır."], [1352.0, "Çünkü o, Allah Azze ve Celle'nin rubûbiyyetine has olan şeylerden birinde Allah'tan başkasını Allah'a denk tutmuştur."]]}, {"reader": false, "ar": [[1378.0, "وأما النوع الثاني فهو الغيب النسبي،"], [1383.0, "وهو ما غاب عن بعض الناس دون بعض؛"], [1387.0, "كمن ضاعت منه ناقة،"], [1391.1, "فإن مكانَ وجودها غيبٌ بالنسبة له،"], [1396.0, "ولكنه ليس غيبًا بالنسبة لمن هي عندهم."], [1399.0, "أو سُرقت منه السيارة،"], [1401.7, "فإن مكانَ وجودها أو معرفةَ سارقها من الغيب بالنسبة له،"], [1409.0, "ولكنها ليست غيبًا بالنسبة لسارقها أو لمن أعانه على سرقتها،"], [1415.9, "وهكذا. والكلام في هذه الكلية ليس عن الغيب النسبي،"], [1422.5, "وإنما عن الغيب المطلق."]], "tr": [[1378.0, "İkinci kısım ise nisbî gaybdır:"], [1378.0, "Bazı insanlardan gizli olup bazılarından gizli olmayan şeydir."], [1387.0, "Devesi kaybolan kimse gibi: Devenin bulunduğu yer onun için gaybdır, ama deve yanlarında olanlar için gayb değildir."], [1399.0, "Ya da arabası çalınan kimse:"], [1401.7, "Arabanın bulunduğu yer veya hırsızın kim olduğu onun için gaybdandır, fakat hırsız ya da hırsızlığa yardım eden için gayb değildir;"], [1415.9, "ve bunun gibi. Bu külliyedeki söz nisbî gayb hakkında değil, mutlak gayb hakkındadır."]]}, {"reader": false, "ar": [[1427.0, "وبناءً على ذلك: فإن الكهّان الذين يدّعون علمَ شيءٍ من الغيب المطلق لا جرم أنهم عندنا كفّارٌ الكفرَ الأكبر،"], [1437.0, "وكذلك السحرة الذين يدّعون شيئًا من علم الغيب المطلق،"], [1441.0, "وكذلك العرّافون فإنهم كفّارٌ الكفرَ الأكبر،"], [1448.0, "لأنهم يزعمون أنهم يعلمون شيئًا من هذا الغيب."], [1452.0, "وكذلك من كان مشعوِذًا يتخرّص في شيءٍ من دعوى علم الغيب المطلق فإنه يُعتبر كافرًا."]], "tr": [[1427.0, "Buna göre: Mutlak gaybdan bir şey bildiğini iddia eden kâhinler, şüphesiz bize göre büyük küfürle kâfirdir."], [1427.0, "Mutlak gayb ilminden bir şey iddia eden sihirbazlar da öyledir."], [1437.0, "Arrâflar (falcılar) da büyük küfürle kâfirdirler;"], [1448.0, "çünkü bu gaybdan bir şey bildiklerini iddia ederler."], [1452.0, "Mutlak gayb ilmi iddiasında tahminle konuşan hokkabaz (muşa'viz) da kâfir sayılır."]]}, {"reader": false, "ar": [[1462.0, "وكذلك المنجّمون الذين يستدلّون على استكشاف الغيبيات بحركة الأفلاك ـ ظهورًا واختفاءً،"], [1469.6, "أو قُربًا وبُعدًا ـ فلا جرم أنهم يدخلون في هذه الكلية."], [1477.0, "وكذلك ما يسمّيه أهلُه بـ«تحضير الأرواح» التي تُخبرهم بشيءٍ من المغيّبات المستقبلية،"], [1488.0, "وحقيقتُها أنها ليست أرواحَ الموتى،"], [1490.8, "وإنما هي أرواحُ الشياطين التي ينادونها ويستغيثون بها ويتعبّدون لها أو يذبحون لها،"], [1499.0, "ثم يُخيِّلون للحاضرين بأنهم ينادون الأموات فتحضر أرواحهم،"], [1505.0, "فتخبرهم بأهل الجنة من أهل النار،"], [1507.0, "ومن كان منهم سعيدًا أو تعيسًا في مستقبل زمانه."], [1514.0, "فكلُّ ذلك مما يدخل تحت هذه الكلية العظيمة."]], "tr": [[1462.0, "Aynı şekilde gaybî şeyleri keşfetmede feleklerin hareketini —görünüp kaybolmalarını ya da yakınlaşıp uzaklaşmalarını— delil edinen müneccimler de şüphesiz bu külliyeye girer."], [1469.6, "Ehlinin \"ruh çağırma\" dediği ve kendilerine gelecekteki gaybî şeylerden haber verdiği (iddia edilen) şey de böyledir."], [1477.0, "Onun hakikati, bunların ölülerin ruhları değil, şeytanların ruhları olmasıdır:"], [1490.8, "Onlara seslenir, onlardan yardım diler, onlara ibadet eder ya da onlar için kurban keserler."], [1490.8, "Sonra orada bulunanlara ölüleri çağırdıklarını ve ruhlarının geldiğini hayal ettirirler;"], [1499.0, "(bu ruhlar da) onlara cennet ehlini cehennem ehlinden, içlerinden kimin geleceğinde mutlu ya da bedbaht olacağını haber verir."], [1514.0, "Bütün bunlar bu büyük külliyenin altına girer."]]}, {"reader": false, "ar": [[1519.0, "ويدخل في ذلك أيضًا ما يسمّى بـ«علم الأبراج»،"], [1522.0, "وهي ربطُ السَّعد والنَّحس المستقبليّ ببُرج الولادة؛"], [1529.0, "فإنه من باب التنجيم المحرّم الذي لا يجوز اعتقادُه،"], [1533.5, "ولا تصديقُ أصحابه، ولا الاستماعُ إليهم،"], [1536.7, "ولا الركونُ لهم، ولا تتبّعُ أخبارهم."], [1540.0, "فكلُّ من يعتقد في مخلوقٍ من المخلوقات أن عنده القدرةَ على استكشاف شيءٍ من غيب الله عز وجل المطلق،"], [1552.0, "فلا جرم أنه عندنا يُعتبر كافرًا خالعًا رِبْقةَ الإسلام من عنقه بالكلية."]], "tr": [[1519.0, "\"Burç ilmi\" denen şey de buna girer:"], [1519.0, "Gelecekteki uğuru ve uğursuzluğu doğum burcuna bağlamaktır."], [1522.0, "Bu, haram olan tencîm (yıldızlardan hüküm çıkarma) babındandır;"], [1529.0, "ona inanmak, sahiplerini tasdik etmek, onları dinlemek, onlara meyletmek ve haberlerini takip etmek caiz değildir."], [1540.0, "Mahlûklardan birinin Allah Azze ve Celle'nin mutlak gaybından bir şeyi keşfetme gücüne sahip olduğuna inanan herkes, şüphesiz bize göre İslam bağını boynundan tamamen çıkarmış bir kâfir sayılır."]]}, {"reader": false, "ar": [[1558.0, "فإن قلت: وكيف تقول ذلك،"], [1561.3, "والله عز وجل أخبر عن الأنبياء والرسل أنهم قد أخبروا أممهم بشيءٍ من المغيّبات؟"], [1574.0, "فنقول: إن هذا ليس من علم الغيب بالنسبة لهم،"], [1578.2, "لأن الله هو الذي أطلعهم عليه،"], [1581.0, "فعلموه بواسطة الوحي. وستأتينا كليةٌ للدرس القادم إن شاء الله:"], [1588.0, "أن كلَّ من عرف شيئًا من الوحي <span class=\"q\">؟ 26:28<\/span> بناءً على وسيلةٍ تُثبت التجاربُ صدقَ نتائجها فإنه ليس بكاهن."]], "tr": [[1558.0, "Eğer \"Bunu nasıl söylersin? Allah Azze ve Celle, peygamberlerin ve resullerin ümmetlerine gaybî şeylerden bir kısmını haber verdiklerini bildirmiştir\" dersen, deriz ki:"], [1574.0, "Bu, onlar açısından gayb ilmi değildir;"], [1578.2, "çünkü onları buna muttali kılan Allah'tır, onlar da onu vahiy vasıtasıyla öğrenmişlerdir."], [1581.0, "İnşallah gelecek derste (şu) külliye gelecek:"], [1588.0, "Tecrübelerin sonuçlarının doğruluğunu isbat ettiği bir vasıtaya dayanarak vahiyden <span class=\"q\">؟<\/span> bir şey bilen kimse kâhin değildir."]]}, {"reader": false, "ar": [[1597.0, "كما قال الله عز وجل:"], [1599.7, "<span class=\"ayah\">﴿فَلَا يُظْهِرُ عَلَىٰ غَيْبِهِ أَحَدًا ۝ إِلَّا مَنِ ارْتَضَىٰ مِن رَّسُولٍ﴾<\/span> ـ أي:"], [1605.6, "مَلَكيٍّ أو بشري ـ <span class=\"ayah\">﴿فَإِنَّهُ يَسْلُكُ مِن بَيْنِ يَدَيْهِ وَمِنْ خَلْفِهِ رَصَدًا﴾<\/span> [الجن: 26–27]."], [1612.0, "فتلك الغيبيّات التي يُخبر بها الأنبياء لم تكن عن علمٍ غيبيّ أو مشاركةٍ لله عز وجل في شيءٍ من علم غيبه المطلق،"], [1622.0, "وإنما كانت عن وحيٍ أوحاه الله عز وجل إليهم."]], "tr": [[1597.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1599.7, "<span class=\"ayah\">﴿Gaybına kimseyi muttali kılmaz; ancak razı olduğu bir elçi müstesna﴾<\/span> —yani melek ya da beşer elçi— <span class=\"ayah\">﴿Çünkü O, onun önünden ve arkasından gözetleyiciler yürütür.﴾<\/span> [Cin 26–27] Peygamberlerin haber verdiği o gaybî şeyler, (kendilerine ait) bir gayb ilminden ya da Allah Azze ve Celle'nin mutlak gayb ilminden bir şeye ortaklıktan kaynaklanmıyordu;"], [1612.0, "bilakis Allah Azze ve Celle'nin onlara vahyettiği bir vahiyden kaynaklanıyordu."]]}, {"reader": false, "ar": [[1627.0, "فإن قلت: أوليس ملَكُ الأرحام قد سجّل قدرَ الجنين وهو في بطن أمه؟"], [1636.0, "وتلك الأقدار ـ من كتابة أجله وعمله ورزقه وأثره ومضجعه،"], [1642.2, "وشقيٌّ أو سعيد ـ كلُّها من الغيبيّات؛"], [1648.0, "أفيكون ذلك الملَك مشاركًا لله عز وجل في علم الغيب؟"], [1652.0, "فأقول: كلّا، ولا في لحظة،"], [1654.7, "ولا في طرفة عين؛"], [1657.0, "لأن الملَك إنما يكتب ما يُمليه الله عز وجل عليه،"], [1661.0, "فلا يُعتبر علمُ الملَك بما سيكون لهذا الجنين من علم الغيب،"], [1666.0, "لأن الله هو الذي أطلعه على هذا الغيب المطلق."]], "tr": [[1627.0, "Eğer \"Rahimler meleği, cenin annesinin karnındayken onun kaderini kaydetmiyor mu?"], [1627.0, "Ecelinin, amelinin, rızkının, izinin, (öleceği) yerinin, bedbaht mı mutlu mu olacağının yazılması gibi o kaderlerin hepsi gaybî şeylerdendir."], [1648.0, "O hâlde o melek gayb ilminde Allah Azze ve Celle'ye ortak mı oluyor?\" dersen, derim ki:"], [1652.0, "Asla! Ne bir an ne de göz açıp kapayıncaya kadar."], [1657.0, "Çünkü melek ancak Allah Azze ve Celle'nin kendisine yazdırdığını yazar."], [1661.0, "Meleğin bu ceninin başına gelecekleri bilmesi gayb ilmi sayılmaz;"], [1666.0, "çünkü onu bu mutlak gayba muttali kılan Allah'tır."]]}, {"reader": false, "ar": [[1671.0, "ثم أضِفْ إلى هذا بأن الأقدار الملَكية أحيانًا تكون أقدارًا معلّقةً لا مجزومًا بها،"], [1681.0, "لينفرد الله عز وجل بعلم الغيب المطلق،"], [1687.0, "كما قال الله عز وجل:"], [1688.5, "<span class=\"ayah\">﴿يَمْحُو اللَّهُ مَا يَشَاءُ وَيُثْبِتُ﴾<\/span> ـ أي:"], [1690.4, "باعتبار الصحف التي في أيدي الملائكة ـ <span class=\"ayah\">﴿وَعِندَهُ أُمُّ الْكِتَابِ﴾<\/span> [الرعد: 39] ـ أي:"], [1695.0, "القدر المبرَم الذي لا يدخله التبديل،"], [1698.0, "ولا الزيادة، ولا التحويل،"], [1700.0, "ولا النقص، ولا التغيير."], [1702.0, "فإن الملَك وإن عرف شيئًا من أقدار هذا الغلام أو الجنين،"], [1707.0, "إلا أن بعض الأقدار لم يكن مجزومًا بها وإنما معلّقة،"], [1712.0, "لينفرد الله عز وجل بعلم الغيب المطلق."]], "tr": [[1671.0, "Buna şunu da ekle: Meleklere ait kaderler bazen kesinleşmiş değil, muallak (bir şarta bağlı) kaderler olur;"], [1681.0, "ta ki Allah Azze ve Celle mutlak gayb ilminde tek kalsın."], [1687.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1688.5, "<span class=\"ayah\">﴿Allah dilediğini siler, dilediğini sabit bırakır﴾<\/span> —yani meleklerin elindeki sahifeler itibarıyla— <span class=\"ayah\">﴿Ana kitap O'nun katındadır.﴾<\/span> [Ra'd 39] —yani değiştirme, artırma, dönüştürme, eksiltme ve başkalaştırmanın giremediği kesinleşmiş (mübrem) kader."], [1702.0, "Melek bu çocuğun ya da ceninin kaderlerinden bir kısmını bilse de, bazı kaderler kesinleşmiş değil muallaktır;"], [1707.0, "ta ki Allah Azze ve Celle mutlak gayb ilminde tek kalsın."]]}, {"reader": false, "ar": [[1717.0, "فإن قلت: وكيف نقول في قول الله عز وجل:"], [1721.8, "<span class=\"ayah\">﴿وَيَعْلَمُ مَا فِي الْأَرْحَامِ﴾<\/span> [لقمان: 34]،"], [1724.0, "مع أن الأطباء يعلمون ذكورةَ وأنوثةَ من في الرحم الآن؟"], [1729.0, "فأقول: اعلم ـ وفّقك الله عز وجل ـ أنك لو تأمّلت الآية وألفاظها الأصولية لوجدت أن الله عز وجل لا يقصد الأنوثة والذكورة؛"], [1743.0, "لأنه لو كان يقصد الأنوثة والذكورة فيكون الكلامُ عن عاقل،"], [1748.0, "والله لم يقل: «ويعلم مَن في الأرحام»،"], [1752.0, "وإنما قال: <span class=\"ayah\">﴿وَيَعْلَمُ مَا فِي الْأَرْحَامِ﴾<\/span>،"], [1756.4, "و«ما» في اللغة العربية تُستعمل لغير العاقل."]], "tr": [[1717.0, "Eğer \"Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rahimlerde olanı bilir.﴾<\/span> [Lokmân 34] sözü hakkında ne diyeceğiz?"], [1721.8, "Oysa doktorlar bugün rahimdekinin erkek mi dişi mi olduğunu biliyorlar\" dersen, derim ki:"], [1729.0, "Bil —Allah Azze ve Celle seni muvaffak kılsın— ayeti ve usûlî lafızlarını düşünseydin, Allah Azze ve Celle'nin (burada) dişiliği ve erkekliği kastetmediğini görürdün."], [1743.0, "Çünkü dişiliği ve erkekliği kastetseydi söz akıl sahibi hakkında olurdu;"], [1748.0, "oysa Allah \"rahimlerde olan kimseyi (men) bilir\" demedi, <span class=\"ayah\">﴿rahimlerde olan şeyi (mâ) bilir﴾<\/span> dedi."], [1756.4, "\"Mâ\" Arapçada akıl sahibi olmayan için kullanılır."]]}, {"reader": false, "ar": [[1761.0, "فيدخل فيها قدرُه وعملُه،"], [1764.0, "وشقيٌّ أو سعيد، صحيحٌ أو مريض،"], [1769.0, "ومن أولادُه، وما تعاستُه،"], [1771.9, "وما وظيفتُه، ومن زوجتُه."], [1778.0, "فمسألة الذكورة والأنوثة إنما هي شيءٌ مما يعلمه الله عز وجل مما في الأرحام."], [1785.0, "فلا تفهم من قول الله عز وجل:"], [1788.7, "<span class=\"ayah\">﴿وَيَعْلَمُ مَا فِي الْأَرْحَامِ﴾<\/span> أنه محصورٌ أو مقصورٌ على مسألة الذكورة والأنوثة،"], [1795.0, "ليكون ذلك متعارضًا مع ما كشفه الله عز وجل لكثيرٍ من الأطباء في مخترعاتهم في هذا الزمان."]], "tr": [[1761.0, "Buna onun kaderi, ameli, bedbaht mı mutlu mu, sağlıklı mı hasta mı olacağı, çocuklarının kim olacağı, bedbahtlığının ne olacağı, mesleğinin ne olacağı ve eşinin kim olacağı girer."], [1778.0, "Erkeklik ve dişilik meselesi, Allah Azze ve Celle'nin rahimlerde olanlardan bildiği şeylerden sadece biridir."], [1788.7, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rahimlerde olanı bilir﴾<\/span> sözünden, bunun erkeklik ve dişilik meselesiyle sınırlı olduğunu anlama;"], [1795.0, "ki bu, Allah Azze ve Celle'nin bu zamanda birçok doktora icatlarında açtığı şeyle çelişsin."]]}, {"reader": false, "ar": [[1803.0, "وإنما كلُّ ما يتعلّق بهذه النطفة فإن الله عز وجل يعلمه،"], [1809.3, "حتى يعلم أنه من أهل الجنة أو من أهل النار؛"], [1815.0, "وأيُّ طبيبٍ يعلم ذلك من هذا الجنين؟"], [1817.8, "الجواب: لا أحد. ثم أضِفْ إلى هذا أن الله عز وجل عالمٌ بكلّ متعلَّقات هذه النطفة في الرحم قبل تخلّقها،"], [1828.0, "وأما الطبيب فإنه لا يعلم ذكورتها وأنوثتها إلا في طور المضغة المخلَّقة؛"], [1837.0, "وأما في طور النطفة،"], [1839.7, "وفي طور العلقة، وفي طور المضغة غير المخلَّقة،"], [1848.0, "فإنه لا يمكن أبدًا أن يتعرّف الطبيب:"], [1851.5, "أذكرٌ هو أم أنثى."]], "tr": [[1803.0, "Bilakis bu nutfeyle ilgili her şeyi Allah Azze ve Celle bilir;"], [1803.0, "hatta onun cennet ehlinden mi cehennem ehlinden mi olduğunu bilir."], [1815.0, "Hangi doktor bu ceninde bunu bilebilir?"], [1817.8, "Cevap: Hiç kimse. Buna şunu da ekle:"], [1817.8, "Allah Azze ve Celle, rahimdeki bu nutfenin bütün taalluklarını o şekillenmeden önce bilir."], [1817.8, "Doktor ise onun erkekliğini ve dişiliğini ancak şekillenmiş mudga (et parçası) evresinde bilebilir."], [1837.0, "Nutfe evresinde, alaka evresinde ve şekillenmemiş mudga evresinde ise doktorun onun erkek mi dişi mi olduğunu bilmesi asla mümkün değildir."]]}, {"reader": false, "ar": [[1854.0, "ثم أضِفْ إلى هذا أن الطبيب لا يقول شيئًا من تلقاء نفسه،"], [1860.0, "وإنما يسلّط أجهزته على جوف الرحم،"], [1864.2, "فيعرف ذلك بطريقةٍ حسّيّةٍ معلومة تُثبت التجاربُ صدقَ نتائجها في الأعمّ الأغلب."], [1872.0, "«وكلُّ شيءٍ معلومٍ بطريقٍ حسّيٍّ فليس من الغيب»؛"], [1876.0, "كل شيءٍ معلومٍ بطريقٍ حسّيٍّ فليس من الغيب،"], [1883.0, "كما سيأتينا إن شاء الله عز وجل."], [1886.0, "فيبقى الله عز وجل منفردًا بعلم الغيب المطلق،"], [1890.7, "وأنه من خصائص الله تبارك وتعالى،"], [1894.0, "لا يملكها ولا شيئًا منها أحدٌ من المخلوقين ـ أيًّا كانت منزلته ـ إلا فيما أوحاه الله عز وجل إليه."]], "tr": [[1854.0, "Buna şunu da ekle: Doktor kendiliğinden bir şey söylemez;"], [1854.0, "cihazlarını rahmin içine yöneltir ve bunu, tecrübelerin sonuçlarının doğruluğunu çoğunlukla isbat ettiği bilinen hissî bir yolla öğrenir."], [1864.2, "\"Hissî bir yolla bilinen her şey gaybdan değildir.\" (Tekrar ediyor.) İnşallah (ileride) gelecektir."], [1876.0, "Böylece Allah Azze ve Celle mutlak gayb ilminde tek kalır;"], [1886.0, "bu, Allah Tebâreke ve Teâlâ'nın hususiyetlerindendir."], [1890.7, "Mahlûklardan hiç kimse —mertebesi ne olursa olsun— Allah Azze ve Celle'nin ona vahyettiği dışında buna ve bundan bir şeye sahip değildir."]]}]}, {"ts": "31:44", "title": "5. Külliye: Tecrübeyle doğrulanmamış vasıtayla gayb konuşan kâhindir", "paras": [{"reader": false, "ar": [[1904.0, "ومن الكليات أيضًا: <b>كلُّ من يبني كلامه في الغيب على وسيلةٍ لم تُثبت التجاربُ صدقَ نتائجها فكاهن.<\/b> كل من يبني كلامه في الغيب على وسيلةٍ لم تثبت التجارب صدق نتائجها فكاهن."], [1944.0, "أعيدها مرةً ثالثة: كل من يبني كلامه في الغيب على وسيلةٍ لم تثبت التجارب صدق نتائجها فكاهن."]], "tr": [[1904.0, "Külliyelerden biri de şudur: 5."], [1904.0, "külliye: Gayb hakkındaki sözünü, tecrübelerin sonuçlarının doğruluğunu isbat etmediği bir vasıtaya dayandıran herkes kâhindir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum: (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1955.0, "أقول وبالله التوفيق: وهذا تعريفُ الكاهن عندنا."], [1961.0, "فإذا قيل لك: مَن الكاهن؟"], [1967.0, "فقل: من اتّصف بوصفين:"], [1971.0, "الوصف الأول: أنه يتكلّم في الأمور الغيبية."], [1975.0, "الوصف الثاني: أنه يبني كلامه في هذا الغيب على وسيلةٍ محسوسةٍ لم تُثبت التجاربُ صدقَ نتائجها."]], "tr": [[1955.0, "Tevfik Allah'tandır, derim ki: Bu, bize göre kâhinin tanımıdır."], [1961.0, "Sana \"Kâhin kimdir?\" denirse de ki:"], [1967.0, "İki vasfı taşıyan kimsedir. Birinci vasıf:"], [1971.0, "Gaybî işlerde konuşur. İkinci vasıf:"], [1975.0, "Bu gayb hakkındaki sözünü, tecrübelerin sonuçlarının doğruluğunu isbat etmediği hissî bir vasıtaya dayandırır."]]}, {"reader": false, "ar": [[1983.0, "فإن كثيرًا من الكهّان يتّخذون شيئًا من الوسائل الحسّيّة الظاهرة من باب التخييل والتلبيس ومخادعة الناس،"], [1996.0, "بأن هذا الغيب الذي يُخبرون به إنما كان ناتجًا أو حادثًا عن هذه الوسائل الظاهرة المحسوسة،"], [2004.0, "وفي الحقيقة أنه مما تُلقيه <span class=\"q\">؟ 33:24<\/span> الشياطين في آذانهم."], [2011.0, "فإنهم يبعثون مسترِقي السمع إلى السماء،"], [2016.0, "ثم ترجع لهم شياطينهم؛"], [2018.2, "فربما أدركهم الشهاب قبل أن يُلقوا تلك الكلمة التي سمعوها من السماء،"], [2025.0, "وربما ألقَوها قبل أن يدركهم الشهاب،"], [2030.0, "فيحدّثون بها الناس فيَصدُقون فيها، فيُفتتن الناس بهم."]], "tr": [[1983.0, "Kâhinlerin çoğu, haber verdikleri bu gaybın ancak bu zahirî, hissî vasıtalardan sonuç olarak doğduğunu (göstermek için), hayal ettirme, telbis (karıştırma) ve insanları aldatma kabilinden bazı zahirî hissî vasıtalar edinirler."], [1996.0, "Hakikatte ise o, şeytanların kulaklarına bıraktığı <span class=\"q\">؟<\/span> şeylerdendir."], [2004.0, "Onlar kulak hırsızlarını (müsterik-i sem') göğe gönderirler;"], [2011.0, "sonra şeytanları onlara döner. Bazen onlar, gökten duydukları o kelimeyi bırakmadan önce şihâb (yıldız alevi) onlara yetişir;"], [2018.2, "bazen de şihâb yetişmeden önce onu bırakırlar."], [2025.0, "(Kâhinler) onu insanlara anlatırlar, o hususta doğru çıkarlar ve insanlar onlar yüzünden fitneye düşer."]]}, {"reader": false, "ar": [[2037.0, "وقد كانت العِرافةُ والكهانةُ حرفةً في الجاهلية،"], [2043.0, "وقد كان لكلّ قومٍ كاهنٌ يرجعون إليه في فصل النزاعات ومعرفة السارق،"], [2049.0, "أو فصل الخصومات ونحوها،"], [2051.0, "وقد جاء الإسلام محرِّمًا ذلك كلَّه."], [2057.0, "فالكاهن في خاصّة نفسه كافر،"], [2060.5, "لأنه يتكلّم في علم الغيب المطلق،"], [2065.0, "وما يتفوّه به من علم الغيب إنما هو بسبب ما توحيه الشياطين إليه،"], [2072.0, "كما قال الله عز وجل:"], [2074.5, "<span class=\"ayah\">﴿يُوحِي بَعْضُهُمْ إِلَىٰ بَعْضٍ زُخْرُفَ الْقَوْلِ غُرُورًا﴾<\/span> [الأنعام: 112]."]], "tr": [[2037.0, "Arrâflık ve kâhinlik câhiliyede bir meslekti."], [2037.0, "Her kavmin, anlaşmazlıkları çözmek, hırsızı bulmak, davaları karara bağlamak ve benzeri işlerde başvurdukları bir kâhini vardı."], [2049.0, "İslam gelip bunların hepsini haram kıldı."], [2051.0, "Kâhin bizzat kendisi kâfirdir; çünkü mutlak gayb ilmi hakkında konuşur."], [2060.5, "Gayb ilminden ağzından çıkanlar ise ancak şeytanların ona vahyettiği (fısıldadığı) şeyler sebebiyledir."], [2072.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2074.5, "<span class=\"ayah\">﴿Aldatmak için birbirlerine yaldızlı sözler fısıldarlar.﴾<\/span> [En'âm 112]"]]}, {"reader": false, "ar": [[2078.0, "فمن جملة وسائلهم: زجرُ الطير؛"], [2086.0, "فجعلوا زجرَ الطير سبيلًا لاستكشاف الغيب،"], [2090.3, "هذا من الكهانة؛ لأن زجر الطير ليس من الوسائل التي أثبتت التجاربُ صدقَ نتائجها في استكشاف شيءٍ من ذلك."], [2100.0, "ومن ذلك: قراءةُ ما في الضمير؛"], [2105.0, "فيسلّط الكاهن عينيه على وجه الإنسان،"], [2109.0, "ثم يخبره بما يحدّثه به ضميره،"], [2113.0, "وهذا التسليط لم تُثبت التجارب أنه طريقٌ لمعرفة شيءٍ من الغيبيّات."]], "tr": [[2078.0, "Onların vasıtalarından biri kuş uçurmaktır (zecru't-tayr)."], [2086.0, "Kuş uçurmayı gaybı keşfetmenin yolu yaptılar;"], [2090.3, "bu kâhinliktendir. Çünkü kuş uçurmak, bunlardan bir şeyi keşfetmede tecrübelerin sonuçlarının doğruluğunu isbat ettiği vasıtalardan değildir."], [2100.0, "Bunlardan biri de içten geçeni okumaktır:"], [2105.0, "Kâhin gözlerini insanın yüzüne diker, sonra ona içinden geçenleri haber verir."], [2109.0, "Tecrübeler, bu göz dikmenin gaybî şeylerden birini bilmenin yolu olduğunu isbat etmemiştir."]]}, {"reader": false, "ar": [[2119.0, "ومن ذلك أيضًا ما يسمّى بالعِرافة،"], [2124.0, "وهي حرفةٌ كان أهل الجاهلية يحترفونها،"], [2131.0, "فيدّعون العلمَ بشيءٍ من المقدّمات التي يبنون عليها شيئًا من الغيبيّات."], [2137.0, "ويدخل في ذلك ما يسمّى بـ«الخطّ في الرمل»:"], [2142.0, "فيخطّ خطوطًا متشابكةً أو متوازيةً أو متماثلةً أو متقاطعة،"], [2148.0, "ثم ينظر فيها ويخبرك بالغيبيّات بناءً على النظر في هذا الخط."]], "tr": [[2119.0, "Bunlardan biri de arrâflık denen şeydir."], [2119.0, "Bu, câhiliye ehlinin meslek edindiği bir işti:"], [2124.0, "Üzerine bazı gaybî şeyleri bina ettikleri birtakım öncülleri bildiklerini iddia ederlerdi."], [2137.0, "\"Kuma çizgi çekme\" (remil) denen şey de buna girer:"], [2137.0, "Birbirine geçmiş, paralel, benzer ya da kesişen çizgiler çizer, sonra onlara bakar ve bu çizgiye bakmaya dayanarak sana gaybî şeyleri haber verir."]]}, {"reader": false, "ar": [[2154.0, "وقد كان ذلك من باب المعجزات لنبيٍّ من الأنبياء،"], [2159.0, "كما في صحيح مسلمٍ من حديث معاوية بن الحكم السُّلَمي رضي الله عنه قال:"], [2166.6, "قلتُ: يا رسول الله،"], [2168.8, "وإنّ منا ناسًا يخُطّون،"], [2171.0, "قال: «كان نبيٌّ من الأنبياء يخُطّ، فمن وافق خطَّه فذاك»؛"], [2177.0, "أي: من وافق خطُّه الأمرَ القدريّ فذاك."], [2181.0, "ولكن بما أنها معجزةٌ أوتيها نبيّ فلن يُوفَّق أحدٌ في مثلها،"], [2187.2, "لأن المعجزات من خصائص الأنبياء."]], "tr": [[2154.0, "Bu, peygamberlerden birine ait mucizeler kabilindendi."], [2154.0, "Nitekim Sahîh-i Müslim'de Muâviye b."], [2159.0, "el-Hakem es-Sülemî'nin (radıyallahu anh) hadisinde şöyle geçer:"], [2159.0, "\"Ey Allah'ın Resûlü! Aramızda çizgi çeken insanlar var\" dedim."], [2168.8, "Buyurdu ki: «Peygamberlerden biri çizgi çekerdi; kimin çizgisi onunkine uyarsa işte o (isabet eder).» Yani kimin çizgisi kaderî işe uyarsa o."], [2177.0, "Fakat bu bir peygambere verilmiş bir mucize olduğundan, hiç kimse onun benzerinde muvaffak olamaz;"], [2181.0, "çünkü mucizeler peygamberlere has şeylerdendir."]]}, {"reader": false, "ar": [[2190.0, "ويدخل في ذلك أيضًا النظرُ في الفنجان ـ أو في الفنجال ـ فينظر فيه الكاهن ثم يخبرك بسعدك أو نحسك،"], [2204.0, "أو ما ينتظرك من الخير أو الشر في مستقبل الزمان."], [2209.0, "ويدخل في ذلك ما يسمّى بـ«صبّ الرصاص»:"], [2212.0, "فيصبّون الرصاص على الأرض قريبًا من المريض،"], [2215.0, "ثم يتشكّل الرصاص على شكل حيوانٍ أو طائرٍ أو مخلوق،"], [2221.0, "فينظر فيه الكاهن ثم يخبرك بشيءٍ من مستقبليّات زمانك."]], "tr": [[2190.0, "Fincana bakmak (kahve falı) da buna girer:"], [2190.0, "Kâhin ona bakar, sonra sana uğurunu ya da uğursuzluğunu veya gelecekte seni bekleyen hayrı ya da şerri haber verir."], [2209.0, "\"Kurşun dökme\" denen şey de buna girer:"], [2212.0, "Kurşunu hastanın yakınında yere dökerler;"], [2212.0, "kurşun bir hayvan, kuş veya bir mahlûk şeklini alır;"], [2215.0, "kâhin ona bakar ve sana geleceğinden bir şeyler haber verir."]]}, {"reader": false, "ar": [[2227.0, "ويدخل في ذلك ما يسمّى بـ«رمي الحصى» أو «الضرب بالحصى»:"], [2232.0, "فيهزّ الكاهن الحصى ثم يرميه أمامه،"], [2237.0, "ثم يخبرك بشيءٍ من السعد أو النحس،"], [2240.0, "أو ما سيحصل عليك في مستقبل الزمان."], [2242.0, "ويدخل في ذلك النظرُ في النجوم:"], [2246.0, "فينظر الكاهن في نجمك أو برجك،"], [2249.0, "ثم يخبرك بشيءٍ من مستقبل زمانك."]], "tr": [[2227.0, "\"Çakıl atma\" ya da \"çakılla fal bakma\" denen şey de buna girer:"], [2227.0, "Kâhin çakıl taşlarını sallar, sonra önüne atar ve sana uğurdan ya da uğursuzluktan veya gelecekte başına gelecek şeylerden haber verir."], [2240.0, "Yıldızlara bakmak da buna girer:"], [2242.0, "Kâhin senin yıldızına ya da burcuna bakar, sonra sana geleceğinden bir şeyler haber verir."]]}, {"reader": false, "ar": [[2253.0, "وكلُّ هذه الأخبار لا شأن لهذه الوسائل بها،"], [2258.0, "وإنما يتّخذها الكاهن من باب التلبيس والمخادعة والتدليس على جلسائه أو من يأتيه،"], [2272.0, "وإلا ففي الحقيقة أن الشياطين هي التي تُخبره بشيءٍ من ذلك."], [2278.0, "فكلُّ من رأيتموه يفعل ذلك ـ أن يتكلّم في أمرٍ غيبيّ ويبني كلامه على وسائل لم تُثبت التجاربُ صدقَ نتائجها غالبًا ـ فإنه من الكهّان."]], "tr": [[2253.0, "Bütün bu haberlerle bu vasıtaların hiçbir ilgisi yoktur."], [2258.0, "Kâhin onları, yanında oturanları ya da kendisine geleni telbis, aldatma ve tedlîs (hile) kabilinden edinir."], [2272.0, "Yoksa hakikatte ona bunlardan bir şeyi haber veren şeytanlardır."], [2272.0, "Bunu yaptığını gördüğünüz —gaybî bir işte konuşup sözünü, tecrübelerin sonuçlarının doğruluğunu çoğunlukla isbat etmediği vasıtalara dayandıran— herkes kâhinlerdendir."]]}]}, {"ts": "38:11", "title": "6. Külliye: Tecrübeyle doğrulanmış vasıtayla haber veren kâhin değildir", "paras": [{"reader": false, "ar": [[2291.0, "ويوضّح ذلك الكلية السادسة."], [2294.4, "(كلامٌ غير واضح) <span class=\"q\">؟ 38:15<\/span> <b>كلُّ من أخبر عن غيبٍ بناءً على وسيلةٍ أثبتت التجاربُ صدقَ نتائجها فليس بكاهن.<\/b> كل من أخبر عن غيبٍ بناءً على وسيلةٍ أثبتت التجارب صدق نتائجها غالبًا فليس بكاهن."], [2323.0, "أعيدها مرةً ثالثة: كل من أخبر عن غيبٍ بناءً على وسيلةٍ أثبتت التجارب صدق نتائجها غالبًا فليس بكاهن."]], "tr": [[2291.0, "Bunu altıncı külliye açıklar. (Anlaşılmayan bir söz) <span class=\"q\">؟<\/span> 6."], [2294.4, "külliye: Tecrübelerin sonuçlarının doğruluğunu (çoğunlukla) isbat ettiği bir vasıtaya dayanarak bir gaybdan haber veren kimse kâhin değildir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum: (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2336.0, "أقول وبالله التوفيق: أي أنه لا يحرم الكلامُ في الأمر الغيبيّ إذا كانت الوسيلة قد أثبتت التجاربُ صدقَ نتائجها في الأعمّ الأغلب؛"], [2346.0, "لأن المتقرّر في قواعد أهل السنة والجماعة أن كلَّ من تكلّم في غيبٍ بناءً على وسيلةٍ حسّيّةٍ صادقة النتائج فإن كلامه جائزٌ لا بأس به ولا حرج فيه،"], [2360.0, "ويكون ذلك من تيسير الله عز وجل لعباده في بعض المكتشفات أو المخترعات الحديثة،"], [2366.0, "التي جعلها الله عز وجل وسيلةً قدريّةً كونيّةً تُخبر مستعملها ـ على الوجه الصحيح ـ بشيءٍ من الأخبار الغيبية."]], "tr": [[2336.0, "Tevfik Allah'tandır, derim ki: Yani vasıta, tecrübelerin sonuçlarının doğruluğunu çoğunlukla isbat ettiği bir vasıta ise gaybî bir işte konuşmak haram değildir."], [2336.0, "Çünkü Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşmiş olan şudur:"], [2346.0, "Sonuçları doğru çıkan hissî bir vasıtaya dayanarak bir gayb hakkında konuşan herkesin sözü caizdir;"], [2346.0, "bunda bir sakınca ve vebal yoktur."], [2360.0, "Bu, Allah Azze ve Celle'nin bazı modern keşif ve icatlarda kullarına sağladığı kolaylıktandır."], [2366.0, "Allah Azze ve Celle bunları, doğru şekilde kullanan kimseye gaybî haberlerden bir kısmını bildiren kaderî ve kevnî bir vasıta kılmıştır."]]}, {"reader": false, "ar": [[2381.0, "وبناءً على ذلك: التقاويمُ التي يُخبر أصحابها بالكسوف لسنواتٍ طويلةٍ جدًّا،"], [2391.0, "أو الخسوف لسنواتٍ طويلةٍ جدًّا،"], [2394.0, "فإن ذلك ليس من التكهّن،"], [2398.0, "لأنهم بنَوا هذا الأمر على الحساب الدقيق الذي لا تُخطئ نتائجه في الأعمّ الأغلب."], [2405.0, "وعندنا كليةٌ تقول: «كلُّ أمرٍ يُدرك بالحساب الدقيق فليس بكهانة»."]], "tr": [[2381.0, "Buna göre: Sahiplerinin çok uzun yıllar sonrası için güneş tutulmasını ya da çok uzun yıllar sonrası için ay tutulmasını haber verdiği takvimler kâhinlik değildir."], [2394.0, "Çünkü onlar bu işi, sonuçları çoğunlukla yanılmayan kesin (dakik) hesaba dayandırmışlardır."], [2398.0, "Bizim şöyle diyen bir külliyemiz var:"], [2405.0, "\"Kesin hesapla idrak edilen her şey kâhinlik değildir.\""]]}, {"reader": false, "ar": [[2415.0, "فما يبنيه الحُسّاب من الأمور الغيبية بناءً على حسابهم ـ في طلوع النجم كذا في وقت كذا،"], [2424.0, "أو غروبه في وقت كذا،"], [2426.0, "أو الكسوف في وقت كذا،"], [2431.0, "أو الخسوف في وقت كذا ـ مع أنها لا تزال أمورًا في علم الغيب المطلق،"], [2437.0, "إلا أن الله قد جعل في الحساب طريقةً لمعرفة شيءٍ من ذلك إذا استُعمل على الوجه الصحيح."]], "tr": [[2415.0, "Hesap ehlinin, hesaplarına dayanarak gaybî işlerden bina ettikleri şeyler —falan yıldızın falan vakitte doğması, falan vakitte batması, falan vakitte güneş tutulması veya falan vakitte ay tutulması gibi— hâlâ mutlak gayb ilmindeki işler olmakla birlikte, Allah hesapta, doğru şekilde kullanıldığında bunlardan bir kısmını bilmenin bir yolunu kılmıştır."]]}, {"reader": false, "ar": [[2445.0, "ويدخل في ذلك معرفةُ أحوال الطقس في هذا الزمان؛"], [2451.0, "فإن من يُخبر بشيءٍ من أحوال الطقس ـ كالأمطار في مستقبل الزمان،"], [2458.0, "أو نوعِ كثافة السحب غدًا،"], [2463.0, "أو اتجاهِ الريح غدًا،"], [2467.0, "أو مقدارِ الموج غدًا،"], [2470.0, "أو نحو ذلك ـ فإن كلامه ليس بكهانة وإن كان غيبيًّا،"], [2476.0, "لأنه بنى كلامه على وسائل أثبتت التجاربُ صدقَ نتائجها في الأعمّ الأغلب."]], "tr": [[2445.0, "Bu zamanda hava durumunu bilmek de buna girer."], [2445.0, "Hava durumundan bir şey haber veren kimsenin —gelecekteki yağmurlar, yarın bulutların yoğunluğunun türü, yarın rüzgârın yönü, yarın dalgaların büyüklüğü ve benzeri gibi— sözü, gaybî olsa da kâhinlik değildir."], [2470.0, "Çünkü o, sözünü tecrübelerin sonuçlarının doğruluğunu çoğunlukla isbat ettiği vasıtalara dayandırmıştır."]]}, {"reader": false, "ar": [[2483.0, "وهنا مسألةٌ معاصرة، وهي «علم تحليل الشخصية» المعاصر ببعض الوسائل:"], [2491.4, "كالتوقيع، أو الألوان التي يحبّها الشخص،"], [2496.0, "أو نوع الكتابة مثلًا،"], [2499.0, "أو تحديد شخصيته بملامح وجهه،"], [2503.0, "أو بنوع مِشيته، أو غير ذلك مما يُعرف ويكثر الكلام عليه في هذا الزمان،"], [2514.0, "وتُقام فيه الدورات المكثّفة."], [2517.0, "فهل ذلك من باب ادّعاء شيءٍ من علم الغيب؟"], [2521.0, "وهل تلك الوسائل أثبتت التجاربُ صدقَ نتائجها؟"]], "tr": [[2483.0, "Burada çağdaş bir mesele var:"], [2483.0, "Bazı vasıtalarla yapılan çağdaş \"kişilik analizi ilmi\";"], [2491.4, "imza, kişinin sevdiği renkler, yazı türü gibi ya da kişiliğini yüz hatlarıyla veya yürüyüş şekliyle belirleme gibi;"], [2503.0, "bu zamanda bilinen, hakkında çokça konuşulan ve yoğun kurslar düzenlenen diğer şeyler."], [2514.0, "Bu, gayb ilminden bir şey iddia etme kabilinden midir?"], [2517.0, "Tecrübeler bu vasıtaların sonuçlarının doğruluğunu isbat etmiş midir?"]]}, {"reader": false, "ar": [[2526.0, "فأقول: في هذه المسألة خلافٌ بين المعاصرين."], [2531.0, "وبما أنني قلتُ: «خلافٌ بين المعاصرين»،"], [2534.5, "فإن المسألة لا تُعتبر من المسائل العقدية الكبار التي يُوالى ويُعادى عليها،"], [2542.0, "وأن كلَّ واحدٍ منا يتعبّد ربَّه فيها بما أدّاه إليه اجتهاده،"], [2548.0, "مع سلامة الطرف الآخر من حقد القلب،"], [2550.8, "وسوء منطق الألفاظ، أو التراشق بالتهم،"], [2553.9, "أو التعييب والتعيير بما لا ينبغي دورانه بين أهل العلم خصوصًا والمسلمين عمومًا."]], "tr": [[2526.0, "Derim ki: Bu meselede çağdaş âlimler arasında ihtilaf vardır."], [2531.0, "\"Çağdaşlar arasında ihtilaf vardır\" dediğime göre, bu mesele üzerine dostluk ve düşmanlık kurulan büyük akîde meselelerinden sayılmaz."], [2534.5, "Her birimiz bu meselede, içtihadının kendisini ulaştırdığı şeyle Rabbine ibadet eder;"], [2542.0, "diğer taraf da kalp kininden, sözlerin kötülüğünden, birbirine suçlama atmaktan, özellikle ilim ehli ve genel olarak Müslümanlar arasında dolaşmaması gereken ayıplama ve kınamalardan uzak kalmalıdır."]]}, {"reader": false, "ar": [[2562.0, "فمن أهل العلم من أجاز ذلك إذا أثبتت التجاربُ صدقَ نتائج هذا التحليل الشخصي؛"], [2571.0, "فإذا استقرأناه استقراءً أغلبيًّا في أن من كان خطُّه على هذه الشاكلة فشخصيته كذا وكذا،"], [2579.0, "وكانت التجارب تَصدُق غالبًا،"], [2581.6, "فإنه حينئذٍ يُعتبر من الكلام في الأمر الخفيّ بناءً على وسيلةٍ أثبتت التجاربُ صدقَ نتائجها."]], "tr": [[2562.0, "İlim ehlinden bazıları, tecrübeler bu kişilik analizinin sonuçlarının doğruluğunu isbat ederse buna cevaz vermiştir."], [2571.0, "Yani yazısı şu şekilde olanın kişiliğinin şöyle şöyle olduğunu çoğunluk esasına dayalı bir tümevarımla incelersek ve tecrübeler çoğunlukla doğru çıkarsa, o zaman bu, tecrübelerin sonuçlarının doğruluğunu isbat ettiği bir vasıtaya dayanarak gizli bir iş hakkında konuşmak sayılır."]]}, {"reader": false, "ar": [[2593.0, "وهذا القول عندي مرجوح،"], [2595.5, "والراجح هو القول الثاني:"], [2597.9, "وهو أن الله عز وجل لم يجعل لشيءٍ من ذلك دليلًا على استكشاف الأمر الخفيّ،"], [2605.0, "لا في برهان الشرع ولا في برهان القدَر والتجارب."], [2611.0, "وتلك التجارب المُدّعاة إنما هي تجاربُ على أشخاصٍ معيّنين لا على الكلّ،"], [2621.0, "فليست من التجارب التي نعتمد على نتائجها،"], [2625.9, "لقصورها في نفسها، ولكثرة خطئها في مثل هذا التحليل."]], "tr": [[2593.0, "Bu görüş bana göre mercûhtur (zayıftır);"], [2595.5, "râcih olan ikinci görüştür: Allah Azze ve Celle bunlardan hiçbirini gizli işi keşfetmeye delil kılmamıştır;"], [2597.9, "ne şer'î burhanda ne de kaderî burhanda ve tecrübelerde."], [2605.0, "İddia edilen o tecrübeler, herkes üzerinde değil, belirli kişiler üzerinde yapılmış tecrübelerdir."], [2611.0, "Bu yüzden kendi içlerindeki yetersizlik ve bu tür bir analizde çok hata yapmaları sebebiyle, sonuçlarına dayanacağımız tecrübelerden değildir."]]}, {"reader": false, "ar": [[2635.0, "وبناءً على ذلك: فالقول الحقّ عندي في هذه المسألة أنه لم يدلّ دليلُ الشرع ولا دليلُ القدَر على أن مجرّد كتابة الشخص أو توقيعه أو ملامح وجهه تدلّ على شيءٍ من شخصيته."], [2650.0, "لكن هناك أنواعٌ من التحليل قد اتفق الأطباء النفسيّون على سلامتها وصدق نتائجها في الأعمّ الأغلب،"], [2659.0, "كطريقة كلامه؛ فإننا نستدلّ على استقامة شخصيته أو عدم استقامتها بكلامه وترتيب كلامه،"], [2671.0, "والدخول معه في أسئلةٍ وأجوبةٍ نستشفّ منها ما يُخفيه في باطنه أو ما يُكنّه في نفسه."]], "tr": [[2635.0, "Buna göre bu meselede bana göre hak olan görüş şudur:"], [2635.0, "Ne şer'î delil ne de kaderî delil, kişinin sadece yazısının, imzasının veya yüz hatlarının onun kişiliğinden bir şeye delâlet ettiğini göstermiştir."], [2635.0, "Fakat psikiyatristlerin (tıbbî) sağlamlığı ve sonuçlarının çoğunlukla doğruluğu üzerinde ittifak ettiği bazı analiz türleri vardır;"], [2659.0, "konuşma tarzı gibi. Çünkü biz kişiliğinin düzgün olup olmadığını konuşmasından ve konuşmasının düzeninden, onunla soru-cevaba girişerek içinde gizlediğini ya da nefsinde sakladığını sezmekten çıkarırız."]]}, {"reader": false, "ar": [[2682.0, "فتحليل الشخصية إن كان مبنيًّا على برامج نفسيّة قد أثبتت التجاربُ صدقَ نتائجها،"], [2689.0, "وكانت معتمَدةً عند الأطباء المسلمين،"], [2692.0, "فإنها طريقٌ صالحٌ لاستكشاف شخصية الإنسان."], [2697.0, "وأما تلك الأمور الوافدة لنا من الغرب ـ كتحليل الشخصية بناءً على أشياء لم يدلّ على صلاحيتها واستقامتها وصدق نتائجها لا دليلُ الشرع ولا دليلُ القدَر ـ فإنه ينبغي سدُّ بابها وإحكامُ إغلاقه،"], [2717.0, "لأنها في الحقيقة نوعٌ من الكهانة المعاصرة التي لبست لَبوسًا علميًّا،"], [2726.0, "وإلا ففي الحقيقة أنها كهانة،"], [2728.7, "لأنها تخوض في شيءٍ من الأمور الخفيّة الغيبية بناءً على وسائل لم تُثبت التجاربُ صدقَ نتائجها."]], "tr": [[2682.0, "Kişilik analizi, tecrübelerin sonuçlarının doğruluğunu isbat ettiği ve Müslüman doktorlar nezdinde itibar edilen psikolojik programlara dayanıyorsa, insanın kişiliğini keşfetmek için elverişli bir yoldur."], [2697.0, "Batı'dan bize gelen şeylere gelince —elverişliliğine, sağlamlığına ve sonuçlarının doğruluğuna ne şer'î delilin ne de kaderî delilin delâlet ettiği şeylere dayalı kişilik analizi gibi— onların kapısını kapatmak ve sıkıca kilitlemek gerekir."], [2717.0, "Çünkü hakikatte bunlar ilmî bir kılığa bürünmüş çağdaş bir kâhinlik türüdür."], [2726.0, "Yoksa hakikatte bu kâhinliktir; çünkü tecrübelerin sonuçlarının doğruluğunu isbat etmediği vasıtalara dayanarak gizli, gaybî işlere dalar."]]}]}, {"ts": "45:38", "title": "7. Külliye: Feleklerin hareketiyle gayba istidlal eden müneccimdir", "paras": [{"reader": false, "ar": [[2738.0, "ومن الكليات أيضًا: <b>كلُّ من استدلّ بحركة الأفلاك على شيءٍ من الغيب فمنجِّم.<\/b> كل من استدل بحركة الأفلاك على شيء من الغيب فمنجّم."], [2762.0, "وسواءٌ قلنا: مُنجِّم، أو قلنا:"], [2765.4, "عرّاف، أو قلنا: مشعوذ،"], [2768.2, "أو قلنا: كاهن، فإن المؤدّى شيءٌ واحد."], [2778.7, "وهذا من علم التنجيم الذي أجمع أهل الإسلام على تحريمه،"], [2787.0, "وهو الذي يسمّيه أهل العلم بعلم التنجيم التأثيري."]], "tr": [[2738.0, "Külliyelerden biri de şudur: 7."], [2738.0, "külliye: Feleklerin hareketiyle gaybdan bir şeye istidlal eden herkes müneccimdir. (Tekrar ediyor.) İster müneccim diyelim, ister arrâf diyelim, ister üfürükçü (hokkabaz) diyelim, ister kâhin diyelim;"], [2768.2, "varılan sonuç tek bir şeydir."], [2768.2, "Bu, İslâm ehlinin haram olduğunda icmâ ettiği tencîm ilmindendir;"], [2778.7, "ilim ehlinin \"te'sîrî tencîm ilmi\" diye adlandırdığı şey budur."]]}, {"reader": false, "ar": [[2793.0, "ويزعم أصحابه بأن حركة الأفلاك ـ ظهورًا واختفاءً،"], [2797.8, "قربًا وابتعادًا عن بعضها ـ لها دورٌ في التأثير في بعض الأمور الغيبية،"], [2811.0, "وأنه يدلّ على شيءٍ من الغيب."], [2814.0, "وهذا هو التنجيم الذي جاءت الأدلة بتحريمه والتحذير منه،"], [2821.0, "والتي قال فيها النبي ﷺ:"], [2825.0, "«من اقتبس شُعبةً من النجوم فقد اقتبس شُعبةً من السحر، زاد ما زاد» <span class=\"note\">(Ebû Dâvûd, İbn Mâce; meşhur lafız: «من اقتبس علمًا من النجوم…»)<\/span>؛"], [2833.0, "أي: زاد سحرُه ما زاد في اقتباسه."]], "tr": [[2793.0, "Bunun sahipleri, feleklerin hareketinin —görünüp kaybolması, birbirine yaklaşıp uzaklaşması— bazı gaybî işlere tesir etmede bir rolü olduğunu ve gaybdan bir şeye delâlet ettiğini iddia ederler."], [2814.0, "İşte delillerin haram kıldığı ve kendisinden sakındırdığı tencîm budur;"], [2821.0, "Nebî ﷺ onun hakkında şöyle buyurmuştur:"], [2825.0, "«Yıldızlardan bir şube (ilim) edinen, sihirden bir şube edinmiş olur; (yıldız ilmini) arttırdıkça (sihri de) artar.» Yani (yıldız ilminden) edinmesini arttırdıkça sihri de artar."]]}, {"reader": false, "a
