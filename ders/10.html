r": [[2838.0, "ولقد أخبرنا الله عز وجل أنه خلق هذه النجوم لثلاث مصالح:"], [2844.0, "زينةً للسماء، وعلاماتٍ يُهتدى بها،"], [2847.7, "ورجومًا للشياطين؛ فمن تأوّل فيها غير هذا فقد أخطأ وضلّ وأضاع نصيبه من الدين."], [2859.0, "كما قال الله عز وجل:"], [2862.0, "<span class=\"ayah\">﴿إِنَّا زَيَّنَّا السَّمَاءَ الدُّنْيَا بِزِينَةٍ الْكَوَاكِبِ ۝ وَحِفْظًا مِّن كُلِّ شَيْطَانٍ مَّارِدٍ﴾<\/span> [الصافات: 6–7]،"], [2869.2, "<span class=\"ayah\">﴿إِلَّا مَنِ اسْتَرَقَ السَّمْعَ فَأَتْبَعَهُ شِهَابٌ مُّبِينٌ﴾<\/span> [الحجر: 18] <span class=\"note\">(Şeyh «شهاب ثاقب» diyor)<\/span>."], [2877.0, "وقال الله عز وجل:"], [2879.5, "<span class=\"ayah\">﴿وَعَلَامَاتٍ ۚ وَبِالنَّجْمِ هُمْ يَهْتَدُونَ﴾<\/span> [النحل: 16]."], [2882.0, "وقال الله عز وجل:"], [2884.8, "<span class=\"ayah\">﴿إِلَّا مَنْ خَطِفَ الْخَطْفَةَ فَأَتْبَعَهُ شِهَابٌ ثَاقِبٌ﴾<\/span> [الصافات: 10]."], [2890.0, "وقال الله عز وجل:"], [2892.9, "<span class=\"ayah\">﴿وَالسَّمَاءِ وَالطَّارِقِ﴾<\/span> … <span class=\"ayah\">﴿النَّجْمُ الثَّاقِبُ﴾<\/span> [الطارق: 1، 3] <span class=\"note\">(Şeyh «والنجم الثاقب» diyor)<\/span>."]], "tr": [[2838.0, "Allah Azze ve Celle bize bu yıldızları üç maslahat için yarattığını haber vermiştir:"], [2844.0, "Göğe süs, kendileriyle yol bulunan alâmetler ve şeytanlara atılan taşlar olarak."], [2847.7, "Kim onlar hakkında bundan başkasını te'vil ederse hata etmiş, sapmış ve dinden nasibini zayi etmiştir."], [2862.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2862.0, "<span class=\"ayah\">﴿Şüphesiz biz dünya semasını bir süsle, yıldızlarla süsledik. Ve (onu) her inatçı şeytandan koruduk.﴾<\/span> [Sâffât 6–7], <span class=\"ayah\">﴿Ancak kulak hırsızlığı yapan olursa, onu da apaçık bir alev takip eder.﴾<\/span> [Hicr 18]."], [2877.0, "Allah Azze ve Celle şöyle buyurur:"], [2879.5, "<span class=\"ayah\">﴿Ve (daha nice) alâmetler (yarattı). Onlar yıldızla da yollarını bulurlar.﴾<\/span> [Nahl 16]."], [2884.8, "Allah Azze ve Celle şöyle buyurur:"], [2884.8, "<span class=\"ayah\">﴿Ancak (sözden) bir parça kapan olursa, onu da delip geçen bir alev takip eder.﴾<\/span> [Sâffât 10]."], [2892.9, "Allah Azze ve Celle şöyle buyurur:"], [2892.9, "<span class=\"ayah\">﴿Andolsun göğe ve Târık'a!﴾<\/span> … <span class=\"ayah\">﴿(O,) delip geçen yıldızdır.﴾<\/span> [Târık 1, 3]."]]}, {"reader": false, "ar": [[2896.0, "فلا يجوز للإنسان أن يدّعي أن هذه النجوم دليلٌ على شيءٍ من علم الغيب،"], [2902.0, "أو أن حركتها مما يتعرّف به أحدٌ على شيءٍ من الغيب أبدًا."], [2911.0, "ويوضّح ذلك الكليةُ التي بعدها، وهي الكلية الثامنة."]], "tr": [[2896.0, "Bu sebeple insanın, bu yıldızların gayb ilminden bir şeye delil olduğunu ya da hareketlerinin, herhangi birinin onunla gaybdan bir şeyi bilebileceği şeylerden olduğunu iddia etmesi asla caiz değildir."], [2911.0, "Bunu, ardından gelen külliye açıklar; o da 8. külliyedir."]]}]}, {"ts": "48:31", "title": "8. Külliye: Feleklerin hareketine müstakil tesir nispet eden şirk-i ekber ehlidir", "paras": [{"reader": false, "ar": [[2927.0, "<b>كلُّ من اعتقد أن لحركة الأفلاك تأثيرًا استقلاليًّا في حوادث الكون فمشركٌ الشركَ الأكبر.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [2954.0, "وهو ما كان يعتقده الصابئة من قوم إبراهيم عليه وعلى نبينا الصلاة والسلام؛"], [2964.0, "فإنهم كانوا يعتقدون أن للأفلاك تأثيرًا عظيمًا في حوادث الأرض،"], [2971.0, "فإذا أصابهم في الأرض شيءٌ فإنهم ينسبون هذا الحادث الأرضيّ إلى هذا الحادث السماويّ."]], "tr": [[2927.0, "<b>8. külliye: Feleklerin hareketinin kâinattaki hâdiselerde müstakil bir tesiri olduğuna inanan herkes şirk-i ekberle müşriktir.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [2954.0, "Bu, İbrâhîm'in —ona ve Nebî'mize salât ve selâm olsun— kavminden olan Sâbiîlerin inandığı şeydir."], [2964.0, "Onlar feleklerin yeryüzü hâdiselerinde büyük bir tesiri olduğuna inanırlardı;"], [2971.0, "yeryüzünde başlarına bir şey geldiğinde bu yeryüzü hâdisesini şu gök hâdisesine nispet ederlerdi."]]}, {"reader": false, "ar": [[2979.0, "والمتقرّر في قواعد أهل السنة والجماعة أنه لا يجوز نسبةُ حوادث الأرض للسماء،"], [2986.8, "ولا حوادث السماء للأرض،"], [2989.0, "إلا بدليلٍ يربط بينهما؛"], [2991.0, "فليس كلُّ شيءٍ يحدث في الأرض يكون لأمرٍ حصل في السماء."], [2997.0, "وعلى ذلك قولُ الله عز وجل:"], [3002.0, "<span class=\"ayah\">﴿وَتَجْعَلُونَ رِزْقَكُمْ أَنَّكُمْ تُكَذِّبُونَ﴾<\/span> [الواقعة: 82]؛"], [3006.0, "أي: يرزقكم الله الرزقَ في الأرض،"], [3011.0, "ثم تنسبون رزقه إلى حركة الأفلاك والنجوم."]], "tr": [[2979.0, "Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşmiş olan şudur:"], [2979.0, "Aralarını bağlayan bir delil olmadıkça yeryüzü hâdiselerini göğe, gök hâdiselerini de yeryüzüne nispet etmek caiz değildir."], [2991.0, "Yeryüzünde meydana gelen her şey, gökte olmuş bir iş sebebiyle değildir."], [2997.0, "Allah Azze ve Celle'nin şu sözü de buna dairdir:"], [3002.0, "<span class=\"ayah\">﴿Rızkınızı (şükür yerine) yalanlamak mı yapıyorsunuz?﴾<\/span> [Vâkıa 82]."], [3002.0, "Yani Allah size yeryüzünde rızık veriyor, sonra siz O'nun rızkını feleklerin ve yıldızların hareketine nispet ediyorsunuz."]]}, {"reader": false, "ar": [[3018.0, "وفي الصحيحين من حديث ابن عباس وعائشة وغيرهما رضي الله عنهما:"], [3025.0, "أن النبي… قال: انكسفت الشمس على عهد إبراهيم،"], [3030.0, "فقال الناس: إنما انكسفت الشمس لموت إبراهيم،"], [3038.0, "فقال النبي ﷺ: «إن الشمس والقمر آيتان من آيات الله، وإنهما لا ينكسفان ـ أو قال: لا ينخسفان ـ لموت أحدٍ ولا لحياته»،"], [3049.0, "الحديث بتمامه. فقولُ الناس:"], [3052.4, "«انكسفت الشمس» وهو الحادث السماويّ،"], [3056.0, "وقولُهم: «لموت إبراهيم» وهو الحادث الأرضيّ؛"], [3061.0, "فربطوا بين حوادث الأرض وحوادث السماء،"], [3064.7, "فرفض الشارع هذا الربط؛"], [3067.2, "فإن موت إبراهيم لا شأن له بكسوف الشمس ولا بعدم كسوفها."]], "tr": [[3018.0, "Sahîhayn'de İbn Abbâs, Âişe ve başkalarının —Allah onlardan razı olsun— hadisinde şöyle geçer:"], [3025.0, "İbrâhîm'in (Nebî ﷺ'in oğlu) zamanında güneş tutuldu."], [3030.0, "İnsanlar: \"Güneş ancak İbrâhîm'in ölümü için tutuldu\" dediler."], [3038.0, "Bunun üzerine Nebî ﷺ şöyle buyurdu:"], [3038.0, "«Güneş ve ay, Allah'ın âyetlerinden iki âyettir; kimsenin ölümü ve hayatı için tutulmazlar» —ya da \"ay tutulması olmaz\" dedi—, hadisin tamamıyla."], [3049.0, "İnsanların \"güneş tutuldu\" sözü gök hâdisesidir;"], [3052.4, "\"İbrâhîm'in ölümü için\" sözleri de yeryüzü hâdisesidir."], [3056.0, "Böylece yeryüzü hâdiseleriyle gök hâdiseleri arasında bağ kurdular;"], [3061.0, "Şâri' de bu bağı reddetti."], [3064.7, "Çünkü İbrâhîm'in ölümünün güneşin tutulmasıyla da tutulmamasıyla da bir ilgisi yoktur."]]}, {"reader": false, "ar": [[3074.0, "وفي الصحيحين من حديث زيد بن خالد الجُهَنيّ رضي الله عنه قال:"], [3079.4, "صلّى بنا رسول الله ﷺ صلاة الصبح بالحديبية على إثر سماءٍ كانت من الليل،"], [3087.0, "فلما سلّم أقبل علينا بوجهه فقال:"], [3091.0, "«هل تدرون ماذا قال ربكم؟» قالوا:"], [3093.8, "الله ورسوله أعلم. قال:"], [3096.6, "«قال: أصبح من عبادي مؤمنٌ بي وكافر؛ فأما من قال: مُطِرنا بفضل الله ورحمته ـ وهي باء السببية ـ فذلك مؤمنٌ بي كافرٌ بالكوكب، وأما من قال: مُطِرنا بنَوء كذا وكذا، فذلك كافرٌ بي مؤمنٌ بالكوكب»."]], "tr": [[3074.0, "Sahîhayn'de Zeyd b. Hâlid el-Cühenî'nin (radıyallahu anh) hadisinde şöyle geçer:"], [3074.0, "Resûlullah ﷺ, geceden yağmış bir yağmurun ardından Hudeybiye'de bize sabah namazını kıldırdı."], [3079.4, "Selam verince yüzünü bize çevirdi ve şöyle buyurdu:"], [3087.0, "«Rabbinizin ne buyurduğunu biliyor musunuz?» \"Allah ve Resûlü daha iyi bilir\" dediler."], [3093.8, "Buyurdu ki: «(Allah) şöyle dedi: Kullarımdan bana iman eden ve (beni) inkâr eden kimseler olarak sabahladılar. \"Allah'ın fazlı ve rahmetiyle yağmura kavuştuk\" diyen —bu, sebebiyet bâ'sıdır— bana iman etmiş, yıldızı inkâr etmiştir. \"Falan falan nev' (yıldız) sebebiyle yağmura kavuştuk\" diyen ise beni inkâr etmiş, yıldıza iman etmiştir.»"]]}, {"reader": false, "ar": [[3118.0, "فلم يرضَ الشارع بنسبة المطر ـ وهو الحادث الأرضيّ ـ إلى نوء كذا وكذا،"], [3126.5, "والأنواء هي منازل النجوم."], [3129.0, "فلا يجوز لنا أن نربط حوادث الأرض بحوادث السماء ربطَ تأثير."], [3137.0, "وهذا التأثير عند أهل السنة ينقسم إلى قسمين:"], [3143.0, "إلى تأثيرٍ إيجاديٍّ خَلقيّ،"], [3147.0, "وإلى تأثيرٍ سببيّ. وهذه الكلية في التأثير الأول،"], [3155.0, "ولذلك قيّدتُها بقولي: «تأثيرًا استقلاليًّا»، أي: إيجاديًّا خَلقيًّا."]], "tr": [[3118.0, "Şâri', yeryüzü hâdisesi olan yağmurun falan falan nev'e nispet edilmesine razı olmamıştır;"], [3126.5, "envâ' yıldızların menzilleridir. Bu yüzden yeryüzü hâdiselerini gök hâdiselerine tesir bağıyla bağlamamız caiz değildir."], [3137.0, "Bu tesir Ehl-i Sünnet'e göre iki kısma ayrılır:"], [3143.0, "îcâdî-halkî (var edici, yaratıcı) tesir ve sebebî tesir."], [3147.0, "Bu külliye birinci tesir hakkındadır;"], [3155.0, "bu yüzden onu \"müstakil bir tesir\" sözümle kayıtladım;"], [3155.0, "yani îcâdî ve halkî (tesir)."]]}, {"reader": false, "ar": [[3166.0, "بمعنى أن النجم هو الذي خلق هذه الريح وأوجدها،"], [3170.0, "أو النجم هو الذي خلق هذا البركان وأوجده،"], [3174.0, "أو أن هذا النجم هو الذي خلق هذا الزلزال وأوجده،"], [3178.0, "أو أن هذا النجم هو الذي أنزل المطر وأوجده."], [3183.0, "فكلُّ من نسب شيئًا من حوادث الأرض إلى شيءٍ من حوادث الأفلاك في السماء نسبةَ إيجادٍ وخلقٍ وتأثير،"], [3193.0, "فإنه يُعتبر مشركًا الشركَ الأكبر في باب الربوبية ـ والعياذ بالله ـ كما كانت الصابئة تفعله."]], "tr": [[3166.0, "Yani bu rüzgârı yaratıp var edenin yıldız olduğu, ya da bu yanardağı yaratıp var edenin yıldız olduğu, ya da bu depremi yaratıp var edenin bu yıldız olduğu, ya da yağmuru indirip var edenin bu yıldız olduğu (inancı)."], [3178.0, "Yeryüzü hâdiselerinden bir şeyi, gökteki feleklerin hâdiselerinden bir şeye var etme, yaratma ve tesir etme nispetiyle nispet eden herkes —Allah korusun— rubûbiyyet babında şirk-i ekberle müşrik sayılır; tıpkı Sâbiîlerin yaptığı gibi."]]}]}, {"ts": "53:24", "title": "İbrâhîm'in (a.s.) Sâbiîlerle münazarası", "paras": [{"reader": false, "ar": [[3204.0, "ولذلك جعل إبراهيم مناظرته قائمةً على هذا التأثير الأرضيّ بحركة الفلك السماويّ،"], [3215.0, "في قوله: <span class=\"ayah\">﴿فَنَظَرَ نَظْرَةً فِي النُّجُومِ ۝ فَقَالَ إِنِّي سَقِيمٌ﴾<\/span> [الصافات: 88–89]؛"], [3220.0, "فربط بين سقمه في الأرض وحركة النجم في السماء،"], [3225.0, "من باب ابتداء المناظرة."], [3229.0, "وعليه قول الله عز وجل:"], [3231.7, "<span class=\"ayah\">﴿أَلَمْ تَرَ إِلَى الَّذِي حَاجَّ إِبْرَاهِيمَ فِي رَبِّهِ﴾<\/span> [البقرة: 258]."], [3236.0, "وسأقول الآية كاملة: <span class=\"ayah\">﴿وَإِذْ قَالَ إِبْرَاهِيمُ لِأَبِيهِ آزَرَ أَتَتَّخِذُ أَصْنَامًا آلِهَةً ۖ إِنِّي أَرَاكَ وَقَوْمَكَ فِي ضَلَالٍ مُّبِينٍ﴾<\/span> [الأنعام: 74]؛"], [3248.0, "لأن آزر وقومه كانوا يعبدون النجوم في السماء،"], [3254.0, "ويبنون لها الأصنام والأوثان والهياكل في الأرض، ويسمّونها بأسمائها."]], "tr": [[3204.0, "Bu yüzden İbrâhîm, münazarasını gökteki feleğin hareketiyle olan bu yeryüzü tesiri üzerine kurdu;"], [3204.0, "şu sözünde: <span class=\"ayah\">﴿Yıldızlara şöyle bir baktı ve \"Ben hastayım\" dedi.﴾<\/span> [Sâffât 88–89]."], [3215.0, "Böylece yeryüzündeki hastalığı ile gökteki yıldızın hareketi arasında bağ kurdu;"], [3220.0, "bu, münazaraya başlama kabilindendir. Allah Azze ve Celle'nin şu sözü de buna dairdir:"], [3231.7, "<span class=\"ayah\">﴿Rabbi hakkında İbrâhîm ile tartışanı görmedin mi?﴾<\/span> [Bakara 258]."], [3231.7, "Ayeti tam olarak söyleyeceğim: <span class=\"ayah\">﴿Hani İbrâhîm babası Âzer'e: \"Putları ilahlar mı ediniyorsun? Doğrusu ben seni ve kavmini apaçık bir sapıklık içinde görüyorum\" demişti.﴾<\/span> [En'âm 74]."], [3236.0, "Çünkü Âzer ve kavmi gökteki yıldızlara taparlar, onlar için yeryüzünde putlar, heykeller ve mabetler inşa ederler ve onlara (yıldızların) isimlerini verirlerdi."]]}, {"reader": false, "ar": [[3259.0, "ثم قال الله عز وجل:"], [3261.0, "<span class=\"ayah\">﴿وَكَذَٰلِكَ نُرِي إِبْرَاهِيمَ مَلَكُوتَ السَّمَاوَاتِ وَالْأَرْضِ وَلِيَكُونَ مِنَ الْمُوقِنِينَ﴾<\/span> [الأنعام: 75]؛"], [3266.0, "أي أنه لا مدبّر ولا متصرّف في شيءٍ من هذه العوالم إلا الله عز وجل."], [3272.0, "<span class=\"ayah\">﴿فَلَمَّا جَنَّ عَلَيْهِ اللَّيْلُ رَأَىٰ كَوْكَبًا ۖ قَالَ هَٰذَا رَبِّي﴾<\/span> [الأنعام: 76]،"], [3278.5, "من باب التنزّل في المناظرة؛"], [3281.0, "والمتقرّر في قواعد أهل السنة أنه يجوز في باب المناظرات والحِجاج ما لا يجوز في غيرها."], [3288.0, "<span class=\"ayah\">﴿فَلَمَّا أَفَلَ﴾<\/span> أي: غابت منفعته،"], [3293.0, "<span class=\"ayah\">﴿قَالَ لَا أُحِبُّ الْآفِلِينَ﴾<\/span>؛"], [3294.5, "لأن من خصائص الربّ ألّا يأفل عن عبيده،"], [3298.0, "فهو معهم دائمًا وأبدًا:"], [3300.7, "بمعيّته العامة المقتضية لعلمه وإحاطته،"], [3304.0, "ومعيّته الخاصة المقتضية لنصره وتأييده."]], "tr": [[3259.0, "Sonra Allah Azze ve Celle şöyle buyurdu:"], [3261.0, "<span class=\"ayah\">﴿Böylece İbrâhîm'e göklerin ve yerin melekûtunu gösteriyorduk; kesin inananlardan olsun diye.﴾<\/span> [En'âm 75]."], [3261.0, "Yani bu âlemlerin hiçbirinde Allah Azze ve Celle'den başka müdebbir ve mutasarrıf yoktur."], [3266.0, "<span class=\"ayah\">﴿Gece onu bürüyünce bir yıldız gördü; \"Bu benim Rabbimdir\" dedi.﴾<\/span> [En'âm 76]."], [3272.0, "Bu, münazarada (hasmın seviyesine) inme kabilindendir."], [3272.0, "Ehl-i Sünnet'in kaidelerinde yerleşmiş olan şudur:"], [3281.0, "Münazara ve tartışma babında, başka yerde caiz olmayan şeyler caiz olur."], [3281.0, "<span class=\"ayah\">﴿(Yıldız) batınca﴾<\/span> yani faydası kaybolunca, <span class=\"ayah\">﴿\"Ben batıp gidenleri sevmem\" dedi.﴾<\/span> Çünkü Rabbin hususiyetlerinden biri, kullarından kaybolmamasıdır."], [3294.5, "O, daima ve ebediyen onlarla beraberdir:"], [3298.0, "İlmini ve ihatasını gerektiren genel maiyyetiyle ve yardımını ve desteğini gerektiren özel maiyyetiyle."]]}, {"reader": false, "ar": [[3308.0, "كما قال الله عز وجل:"], [3310.2, "<span class=\"ayah\">﴿مَا يَكُونُ مِن نَّجْوَىٰ ثَلَاثَةٍ إِلَّا هُوَ رَابِعُهُمْ وَلَا خَمْسَةٍ إِلَّا هُوَ سَادِسُهُمْ وَلَا أَدْنَىٰ مِن ذَٰلِكَ وَلَا أَكْثَرَ إِلَّا هُوَ مَعَهُمْ أَيْنَ مَا كَانُوا﴾<\/span> [المجادلة: 7]."], [3320.0, "فاستدلّ إبراهيم بأفول الكوكب عن العالم بأنه لا يصلح أن يكون إلهًا ولا ربًّا."], [3328.0, "ثم قال: <span class=\"ayah\">﴿فَلَمَّا رَأَى الْقَمَرَ بَازِغًا قَالَ هَٰذَا رَبِّي ۖ فَلَمَّا أَفَلَ قَالَ لَئِن لَّمْ يَهْدِنِي رَبِّي لَأَكُونَنَّ مِنَ الْقَوْمِ الضَّالِّينَ﴾<\/span> [الأنعام: 77]؛"], [3338.0, "فاستدلّ بأفول القمر على عدم صلاحية ربوبيته وألوهيته."], [3344.0, "<span class=\"ayah\">﴿فَلَمَّا رَأَى الشَّمْسَ بَازِغَةً قَالَ هَٰذَا رَبِّي هَٰذَا أَكْبَرُ ۖ فَلَمَّا أَفَلَتْ قَالَ يَا قَوْمِ إِنِّي بَرِيءٌ مِّمَّا تُشْرِكُونَ﴾<\/span> [الأنعام: 78]."]], "tr": [[3308.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [3310.2, "<span class=\"ayah\">﴿Üç kişinin gizli konuşması yoktur ki dördüncüleri O olmasın; beş kişinin de yoktur ki altıncıları O olmasın. Bundan az da olsa çok da olsa, nerede olurlarsa olsunlar, mutlaka O onlarla beraberdir.﴾<\/span> [Mücâdele 7]."], [3320.0, "İbrâhîm, yıldızın âlemden batıp kaybolmasıyla onun ilah da rab da olmaya elverişli olmadığına istidlal etti."], [3328.0, "Sonra şöyle dedi: <span class=\"ayah\">﴿Ayı doğarken görünce \"Bu benim Rabbimdir\" dedi. O da batınca: \"Andolsun, Rabbim beni doğru yola iletmezse, elbette sapıklardan olurum\" dedi.﴾<\/span> [En'âm 77]."], [3338.0, "Ayın batmasıyla onun rubûbiyyete ve ulûhiyyete elverişli olmadığına istidlal etti."], [3344.0, "<span class=\"ayah\">﴿Güneşi doğarken görünce: \"Bu benim Rabbimdir, bu daha büyük\" dedi. O da batınca: \"Ey kavmim! Ben sizin ortak koştuğunuz şeylerden uzağım\" dedi.﴾<\/span> [En'âm 78]."]]}, {"reader": false, "ar": [[3353.0, "حتى يبيّن لهم أن هذه الأفلاك إنما منفعتها في الكون مطلق المنفعة في وقت خروجها وظهورها للمنفعة المطلقة <span class=\"q\">؟ 55:57<\/span>،"], [3365.0, "وكلُّ من كانت منفعته مقيّدةً لا مطلقة فإنه لا يصلح أن يكون ربًّا ولا إلهًا مع الله تبارك وتعالى."], [3379.0, "فلا يجوز لنا أن نعتقد في هذه الأفلاك شيئًا من التأثير الاستقلاليّ أبدًا؛"], [3385.1, "لأن ذلك ينقل العبد من دائرة الإسلام إلى دائرة الشرك الأكبر في باب الربوبية."]], "tr": [[3353.0, "(Bunu) onlara şunu açıklamak için (yaptı):"], [3353.0, "Bu feleklerin kâinattaki faydası, ancak çıkış ve görünme vaktindeki fayda (ile sınırlı)dır <span class=\"q\">؟<\/span>."], [3353.0, "Faydası mutlak değil de kayıtlı (sınırlı) olan her şey, Allah Tebâreke ve Teâlâ ile birlikte rab da ilah da olmaya elverişli değildir."], [3379.0, "Bu yüzden bu feleklerde asla müstakil bir tesir bulunduğuna inanmamız caiz değildir;"], [3385.1, "çünkü bu, kulu İslâm dairesinden rubûbiyyet babındaki şirk-i ekber dairesine geçirir."]]}]}, {"ts": "56:31", "title": "9. Külliyenin başlığı ve kapanış", "paras": [{"reader": false, "ar": [[3391.0, "ولعلّنا نكتفي بهذا القدر،"], [3393.3, "واكتبوا رأس الكلية، وهي:"], [3395.5, "<b>كلُّ من اعتقد أن لحركة الأفلاك تأثيرًا سببيًّا فشركٌ أصغر.<\/b> <span class=\"note\">(يكررها)<\/span> وأنا أراعي فيكم الوقت قليلًا،"], [3411.1, "وإن… يعني. والله أعلى وأعلم،"], [3413.2, "وصلّى الله وسلّم على نبينا محمد وعلى آله وصحبه أجمعين."]], "tr": [[3391.0, "Belki bu kadarla yetiniriz; külliyenin başlığını yazın, o da şudur:"], [3393.3, "<b>9. külliye: Feleklerin hareketinin sebebî bir tesiri olduğuna inanan herkes(in bu inancı) şirk-i asgardır.<\/b> (Tekrar ediyor.) Sizin için vakti biraz gözetiyorum, yoksa… yani."], [3411.1, "Allah en yüce olandır ve en iyisini bilendir."], [3413.2, "Allah, Nebî'miz Muhammed'e, âline ve bütün ashâbına salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
