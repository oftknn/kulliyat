<script>
const D={"no": 21, "vid": "a7i2URzqLhw", "title_ar": "الدرس (٢١) من شرح كليات العقيدة — كليات في الشرك والكفر", "title_tr": "Şerhu Külliyyâti'l-Akîde — 21. Ders: Şirk ve Küfre Dair Külliyeler (Şirkin Vesileleri, Nekre ve Marife Küfür, Ortaklık Vehmi Veren Lafızlar, Şirk–Küfür İlişkisi, Habût)", "sections": [{"ts": "00:00", "title": "1. Külliye: Büyük şirke giden her vesileyi kapatmak vâcibtir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.5, "والصلاةُ والسلامُ على رسول الله الأمين،"], [6.4, "وعلى آله وأصحابه أزكى الصلاة وأعظمُ التسليم."], [10.8, "<span class=\"ayah\">﴿سُبْحَانَكَ لَا عِلْمَ لَنَا إِلَّا مَا عَلَّمْتَنَا ۖ إِنَّكَ أَنتَ الْعَلِيمُ الْحَكِيمُ﴾<\/span> <span class=\"ref\">[البقرة: ٣٢]<\/span>."], [18.0, "نبدأ مستعينين بالله عز وجل في سياق كلّيّات هذا الدرس،"], [23.3, "وهي كلّيّاتٌ في الشرك والكفر."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [0.0, "Salât ve selâm, Allah'ın emin Resûlü'ne, âline ve ashâbına olsun;"], [6.4, "salâtın en temizi ve selâmın en büyüğü (onlara olsun)."], [10.8, "<span class=\"ayah\">﴿Seni tenzih ederiz! Bize öğrettiğinden başka hiçbir bilgimiz yoktur. Şüphesiz sen her şeyi bilensin, hüküm ve hikmet sahibisin﴾<\/span> [Bakara 32]."], [10.8, "Allah Azze ve Celle'den yardım dileyerek bu dersin külliyeleri bağlamına başlıyoruz;"], [23.3, "bunlar şirk ve küfre dair külliyelerdir."]]}, {"reader": false, "ar": [[26.0, "الكلّيّة الأولى: <b>كلُّ وسيلةٍ للشرك الأكبر فالواجبُ سدُّها.<\/b> كلُّ وسيلةٍ للشرك الأكبر فالواجب سدُّها. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[26.0, "<b>1. külliye: Büyük şirke (götüren) her vesileyi kapatmak vâcibtir.<\/b> Büyük şirke (götüren) her vesileyi kapatmak vâcibtir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[40.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرّر في القواعد أنّ الشريعة إذا أمرت بشيءٍ فإنها تأمر بكلّ الوسائل التي تُفضي إليه،"], [53.0, "وإذا نهت عن شيءٍ فإنها تنهى عن جميع الوسائل التي تُفضي إليه."], [59.0, "ومن المعلوم لديكم ـ وفّقكم الله ـ أنّ المنهيّات في الشريعة تنقسم إلى قسمين:"], [66.0, "إلى منهيّات مقاصد، وإلى منهيّات وسائل."], [69.0, "والشركُ الأكبر من جملة منهيّات المقاصد."]], "tr": [[40.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, kaidelerde yerleşik olan şu husustur:"], [40.0, "Şeriat bir şeyi emrettiğinde, ona götüren bütün vesileleri de emreder;"], [53.0, "bir şeyi yasakladığında, ona götüren bütün vesileleri de yasaklar."], [59.0, "Allah sizi muvaffak kılsın, bildiğiniz üzere şeriattaki yasaklar iki kısma ayrılır:"], [66.0, "Maksat yasakları ve vesile yasakları."], [69.0, "Büyük şirk, maksat yasakları arasındadır."]]}, {"reader": false, "ar": [[74.0, "فبما أنه من منهيّات المقاصد،"], [76.1, "فإنّ الشريعة حرصت على أنّ كلّ طريقٍ قد يُفضي إليه فإنه لا بدّ من سدّه."], [82.0, "والمتقرّر في القواعد وجوبُ سدّ الذرائع؛"], [86.0, "فكلُّ طريقٍ يُفضي إلى الشرك إفضاءَ علمٍ أو غلبةِ ظنٍّ فالواجب سدُّه."], [93.0, "إذ لا يمكن أبدًا في الشرع ولا في العقل أن ينهى الشارعُ عن شيءٍ ثم يفتح كلَّ الأبواب التي تُفضي إليه؛"], [103.0, "فإنّ فتح الوسائل وصولٌ للمقاصد،"], [106.0, "وإغلاقَ الوسائل سدٌّ للوصول للمقاصد."]], "tr": [[74.0, "Madem o bir maksat yasağıdır, şeriat ona götürebilecek her yolun mutlaka kapatılmasına özen göstermiştir."], [76.1, "Kaidelerde yerleşik olan, zerîalerin (vesilelerin) kapatılmasının vâcib olmasıdır."], [86.0, "Dolayısıyla şirke kesin bilgiyle veya galip zanla götüren her yolu kapatmak vâcibtir."], [86.0, "Zira Şâri'in bir şeyi yasaklayıp sonra ona götüren bütün kapıları açması ne şer'an ne de aklen asla mümkün değildir."], [93.0, "Çünkü vesileleri açmak maksatlara ulaşmaktır;"], [103.0, "vesileleri kapatmak ise maksatlara ulaşmanın önünü kesmektir."]]}, {"reader": false, "ar": [[111.0, "فإذا حرّمت الشريعةُ شيئًا فإنها لا بدّ أن تحرّم كلَّ الوسائل التي تُفضي إليه."], [118.0, "وقد كثُرت الأدلة في تحريم هذه الوسائل:"], [122.0, "فمنها مثلًا تحريمُ نسبة المطر للنَّوء،"], [126.0, "فإنّ ذلك من باب تحريم الوسائل،"], [129.0, "في قول النبي ﷺ فيما يرويه عن ربه عز وجل:"], [133.0, "«أصبح من عبادي مؤمنٌ بي وكافر... فأمّا من قال: مُطرنا بنَوء كذا وكذا، فذلك كافرٌ بي مؤمنٌ بالكوكب»."]], "tr": [[111.0, "Şeriat bir şeyi haram kıldığında, ona götüren bütün vesileleri de mutlaka haram kılar."], [111.0, "Bu vesilelerin haram kılınması hakkında deliller çoktur."], [118.0, "Bunlardan biri, örneğin, yağmuru nev'e (yıldızların doğuş-batışına) nispet etmenin haram kılınmasıdır;"], [122.0, "bu, vesilelerin haram kılınması babındandır."], [126.0, "Nebî ﷺ'in Rabbi Azze ve Celle'den rivayet ettiği şu sözde olduğu gibi:"], [129.0, "«Kullarımdan bana iman eden ve (beni) inkâr eden olarak sabahladılar... \"Falanca nev' sebebiyle bize yağmur yağdı\" diyen ise beni inkâr eden, yıldıza iman edendir.»"]]}, {"reader": false, "ar": [[143.0, "وأنتم تعرفون أنّ هذه النسبة قد تكون كفرًا أصغر،"], [147.2, "وقد تكون كفرًا أكبر."], [149.0, "فإذا نسبتَ المطر للنَّوء نسبةَ سببيّة ـ والله هو الخالق للمطر ـ فهذه شركٌ أصغر،"], [156.7, "وهو الذي يخصّ قاعدتنا."], [159.0, "وأمّا إذا نسبتَ المطر للنَّوء نسبةَ إيجادٍ وخلقٍ وفعلٍ وتقدير،"], [164.0, "فلا جرم أنّ هذا تجاوز إلى الشرك الأكبر، إلى الكفر الأكبر."]], "tr": [[143.0, "Bilirsiniz ki bu nispet bazen küçük küfür, bazen de büyük küfür olur."], [147.2, "Yağmuru nev'e sebeplik nispetiyle nispet edersen —yağmuru yaratan Allah olduğu hâlde— bu küçük şirktir;"], [156.7, "kaidemizi ilgilendiren de budur. Ama yağmuru nev'e var etme, yaratma, yapma ve takdir etme nispetiyle nispet edersen, şüphesiz bu, büyük şirke, büyük küfre taşmıştır."]]}, {"reader": false, "ar": [[168.0, "ومنها كذلك تحريمُ التميمة؛"], [171.0, "فإنّ تحريم التميمة إنما هو تحريمُ وسائل،"], [175.0, "حتى لا تصل إلى اعتقاد أنّ التميمة هي التي تجلب الخيرَ بذاتها أو تدفع الشرَّ بذاتها."], [184.0, "أمّا إذا كانت في دائرة السببيّة فإنّ ذلك من الشرك الأكبر <span class=\"q\">؟ 03:04<\/span>."], [189.0, "فإذًا حرّمت الشريعةُ التمائمَ من باب سدّ الذرائع التي تُفضي إلى الشرك الأكبر."]], "tr": [[168.0, "Bunlardan biri de temimenin (muskanın) haram kılınmasıdır."], [171.0, "Temimenin haram kılınması, ancak bir vesile yasağıdır;"], [175.0, "ta ki temimenin hayrı bizzat kendisi getirdiği veya şerri bizzat kendisi savdığı inancına varmayasın."], [184.0, "Sebeplik dairesinde ise bu, büyük şirktendir <span class=\"q\">؟<\/span>."], [189.0, "Demek ki şeriat temimeleri, büyük şirke götüren zerîaları kapatma babından haram kılmıştır."]]}, {"reader": false, "ar": [[195.0, "ومنها كذلك بابُ تحريم الطِّيَرة؛"], [199.0, "فإنّ تحريم الطِّيَرة أيضًا من تحريم الوسائل التي تُفضي إلى الشرك."], [204.0, "فلا يجوز لك أبدًا أن تنسب سببيّةً للطير في أيّ شيءٍ من أنواع التدبير،"], [211.0, "لا في جلب خيرٍ ولا في دفع شرٍّ؛"], [215.2, "سدًّا لذريعة الوصول إلى اعتقاد أنّ الطير هو ذاته مَن يخلق هذا الشرَّ أو يقدّر هذا الشرّ."]], "tr": [[195.0, "Bunlardan biri de tıyerenin (uğursuzluk sayma, kuşla fal tutma) haram kılınması babıdır."], [199.0, "Tıyerenin haram kılınması da şirke götüren vesilelerin haram kılınmasındandır."], [204.0, "Tedbir türlerinden hiçbir şeyde, ne hayır getirmede ne de şer savmada, kuşa sebeplik nispet etmen asla caiz değildir."], [215.2, "Bu, kuşun bu şerri bizzat kendisinin yarattığı veya takdir ettiği inancına varmanın zerîasını kapatmak içindir."]]}, {"reader": false, "ar": [[224.0, "ومنها كذلك أيضًا تحريمُ التصوير؛"], [228.0, "فإنّ الشريعة إنما حرّمت التصوير من باب سدّ الذرائع التي تُفضي إلى الشرك،"], [233.0, "ولا جرم أنّ الصورَ قرينةٌ للشرك <span class=\"q\">؟ 03:53<\/span>."], [237.0, "كما قال النبي ﷺ: «ثم صوّروا صورَهم، فلمّا هلك أولئك ونُسي العلمُ عُبدت من دون الله عز وجل»."], [247.0, "فلمّا صوّروا صورَ الصالحين عُبدت صورُهم من دون الله عز وجل."]], "tr": [[224.0, "Bunlardan biri de resim yapmanın (tasvirin) haram kılınmasıdır."], [228.0, "Şeriat tasviri ancak şirke götüren zerîaları kapatma babından haram kılmıştır."], [228.0, "Şüphesiz suretler şirkin yoldaşıdır <span class=\"q\">؟<\/span>."], [233.0, "Nebî ﷺ'in dediği gibi: «Sonra onların suretlerini yaptılar. O (nesil) helak olup ilim unutulunca, Allah Azze ve Celle'yi bırakıp onlara ibadet edildi.» Salihlerin suretlerini yapınca, Allah Azze ve Celle'yi bırakıp onların suretlerine ibadet edildi."]]}, {"reader": false, "ar": [[253.0, "فجاءت الأدلة المتواترة تحرّم بابَ التصوير بكلّ أنواعه،"], [257.0, "وقد وردت بإطلاقٍ وعموم."], [260.0, "والمتقرّر في القواعد وجوبُ بقاء المطلق على إطلاقه والعامّ على عمومه،"], [267.0, "فلا يجوز تقييدُ الإطلاق إلا بدليل،"], [269.7, "ولا تخصيصُ العموم إلا بدليل."], [272.0, "فيدخل في ذلك ما يُسمّى بالصور المجسَّمة ـ يعني يسمّونها تصويرَ النحت ـ وتصويرُ الرسم،"], [280.2, "والتصويرُ بهذه الآلات أيضًا."], [284.0, "والذي أخرج صورةً عن هذا العموم والإطلاق فإننا نطالبه بالدليل الدالّ على هذا الأمر."]], "tr": [[253.0, "Mütevâtir deliller tasvir babını bütün türleriyle haram kılarak gelmiştir ve (bu deliller) mutlak ve âmm olarak varid olmuştur."], [260.0, "Kaidelerde yerleşik olan, mutlakın mutlaklığı üzere, âmmın da umumu üzere kalmasının vâcib olmasıdır."], [267.0, "Mutlakı ancak bir delille takyid etmek, âmmı da ancak bir delille tahsis etmek caizdir."], [272.0, "Buna, mücessem suretler denilen şey —yani heykel tasviri dedikleri şey—, çizim tasviri ve bu aletlerle yapılan tasvir de girer."], [284.0, "Bu umum ve mutlaklıktan bir sureti dışarı çıkarandan, bu hususa delâlet eden delili isteriz."]]}, {"reader": false, "ar": [[291.0, "يقول الناظم: «واحذر ذواتِ الروح لا تنسخ لها ... صُوَرًا بأيّ طريقةٍ ببنانِ ... فتكونَ ممّن ناله دَرْكُ الشقا ... فالشركُ والتصويرُ مرتضعانِ»."]], "tr": [[291.0, "Nâzım şöyle der: «Ruh sahiplerinden sakın, parmağınla hangi yolla olursa olsun onların suretini çıkarma; yoksa bedbahtlığın dibine ulaşanlardan olursun. Çünkü şirk ile tasvir süt kardeştir.»"]]}]}, {"ts": "05:04", "title": "1. Külliye (devam): Resim ve kabirlerle ilgili vesileler", "paras": [{"reader": false, "ar": [[304.0, "وقد ذكرتُ لكم سابقًا أنّ الذريعة إذا كانت تُفضي إلى الشرك فلا بدّ من سدّها،"], [309.5, "وإن كنّا نقطع أنها لن تُعبد في هذا الزمان،"], [313.0, "لن تُعبد في هذا الزمان."], [316.0, "ولذلك كلّما عظُم تحريمُ المقصود كلّما توسّعت الشريعة في سدّ وسائله."], [321.0, "فلا يأتينا رجلٌ يقول بأنّ هذه الصورة في هذا الزمان لا يُتصوَّر أن يعبدها أحد."], [329.0, "لماذا؟ لأنّ الذريعة ذريعةُ شرك،"], [332.0, "وذرائعُ الشرك لا بدّ أن تُسدّ،"], [334.0, "حتى وإن لم نتصوّر أحدًا يعبدها إلا بعد عشرات السنين أو مئات السنين."]], "tr": [[304.0, "Daha önce size şunu söylemiştim:"], [304.0, "Zerîa şirke götürüyorsa, bu zamanda ona ibadet edilmeyeceğini kesin olarak bilsek bile, onu mutlaka kapatmak gerekir;"], [309.5, "bu zamanda ona ibadet edilmeyecek olsa bile."], [316.0, "Bu yüzden maksadın haramlığı ne kadar büyükse, şeriat onun vesilelerini kapatmada o kadar genişlik gösterir."], [321.0, "Kimse bize gelip \"Bu zamanda bu surete birinin ibadet etmesi düşünülemez\" demesin."], [329.0, "Neden? Çünkü zerîa, şirk zerîasıdır ve şirkin zerîaları mutlaka kapatılmalıdır;"], [334.0, "onlarca veya yüzlerce yıl sonrasına kadar kimsenin ona ibadet edeceğini düşünmesek bile."]]}, {"reader": false, "ar": [[341.0, "فيجب علينا أن نحرص على سدّ هذه الذرائع لعِظَم ما توصل إليه من الأمور المحرّمة،"], [347.0, "وهي الشرك الأكبر، وهو أعظم المحرّمات."], [350.0, "ومنها كذلك الأدلة التي تحرّم الصلاة إلى القبور،"], [354.0, "كحديث أبي مَرثَدٍ الغَنَوي عند الإمام مسلم،"], [357.0, "قال: قال النبي ﷺ: «لا تصلّوا إلى القبور ولا تجلسوا عليها»."], [363.0, "فكلُّ ذلك من باب سدّ ذريعة الشرك،"], [365.7, "مع أنّ المصلّي إنما يصلّي لله عز وجل،"], [368.7, "لكن لا ينبغي أن يستقبل قبرًا،"], [371.0, "سدًّا لذريعة أن ينقدح في قلبه يومًا من الأيام أنه يصلّي للقبر،"], [377.0, "أو يتعبّد لصاحب القبر بهذه الصلاة."]], "tr": [[341.0, "Bu zerîaları kapatmaya özen göstermemiz vâcibtir;"], [341.0, "çünkü ulaştırdıkları haram şeyler büyüktür:"], [341.0, "Bu, büyük şirktir ve haramların en büyüğüdür."], [347.0, "Bunlardan biri de kabirlere doğru namaz kılmayı haram kılan delillerdir."], [350.0, "İmam Müslim'in rivayet ettiği Ebû Mersed el-Ganevî hadisi gibi;"], [354.0, "Nebî ﷺ şöyle buyurmuştur: «Kabirlere doğru namaz kılmayın ve üzerlerine oturmayın.» Bunların hepsi şirk zerîasını kapatma babındandır."], [363.0, "Namaz kılan kişi ancak Allah Azze ve Celle için namaz kılıyor olsa da bir kabre yönelmemelidir."], [368.7, "Bu, bir gün kalbine kabir için namaz kıldığı veya bu namazla kabir sahibine ibadet ettiği düşüncesinin doğmasının zerîasını kapatmak içindir."]]}, {"reader": false, "ar": [[380.0, "ومنها كذلك تحريمُ بناء المساجد على القبور،"], [385.0, "فالأدلة في ذلك كثيرةٌ جدًّا؛"], [388.0, "وقد لعن النبي ﷺ الذين يتّخذون القبور مساجد،"], [393.0, "وحذّر من ذلك التحذيرَ العظيم،"], [395.0, "وأخبر بأنهم شرارُ الخلق عند الله عز وجل."], [398.0, "والأحاديث في هذا متعدّدة،"], [400.0, "وما ذلك إلا لسدّ ذريعة الشرك."]], "tr": [[380.0, "Bunlardan biri de kabirler üzerine mescit bina etmenin haram kılınmasıdır."], [385.0, "Bu konudaki deliller pek çoktur."], [388.0, "Nebî ﷺ kabirleri mescit edinenlere lanet etmiş, bundan büyük bir sakındırmayla sakındırmış ve onların Allah Azze ve Celle katında mahlûkatın en şerlileri olduğunu haber vermiştir."], [398.0, "Bu konudaki hadisler çoktur. Bu, sadece şirk zerîasını kapatmak içindir."]]}, {"reader": false, "ar": [[404.0, "وكذلك أيضًا يدخل تحته تحريمُ تزويق القبر بأيّ نوعٍ من أنواع التزويق؛"], [411.0, "فلا يجوز وضعُ الستور عليه،"], [413.0, "ولا تخليقُه بالطِّيب، أو صبُّ ماء الورد عليه،"], [417.0, "ولا يجوز تجصيصُه، أو وضعُ الرخام والجرانيت أو الجِبس عليه."], [422.0, "فأيُّ صورةٍ من صور تجميل القبور فإنها ذريعةٌ سوف تُفضي بعد ذلك إلى الشرك."], [429.0, "ولذلك لو رأيتم إلى القبور المعظَّمة في أكثر العوالم الإسلامية،"], [433.0, "لوجدتم عليها من الزخارف والزينة ما يجعل القلوبَ منبهرةً برؤيتها ومتعلّقةً بالقرب منها."], [442.0, "فينبغي لنا أن نحذر من ذلك أشدَّ الحذر."]], "tr": [[404.0, "Aynı şekilde kabri herhangi bir süsleme türüyle süslemenin haram kılınması da bunun altına girer."], [411.0, "Üzerine örtüler koymak, onu güzel kokuyla (halûk ile) kokulamak veya üzerine gül suyu dökmek caiz değildir."], [417.0, "Onu alçıyla sıvamak veya üzerine mermer, granit ya da alçı koymak caiz değildir."], [422.0, "Kabirleri güzelleştirmenin her şekli, sonradan şirke götürecek bir zerîadır."], [429.0, "Bu yüzden İslâm âleminin çoğunda tazim edilen kabirlere baksanız, üzerlerinde kalpleri onları görmekle büyüleyen ve onlara yakın olmaya bağlayan süsler ve ziynetler bulursunuz."], [442.0, "Bundan en şiddetli şekilde sakınmamız gerekir."]]}, {"reader": false, "ar": [[446.0, "ولذلك ثبت عن النبي ﷺ أنه نهى عن تجصيص القبور،"], [452.1, "والتجصيصُ أي للتزيين؛ فنأخذ من ذلك أنّ ما كان أعظمَ من الجصّ في الزينة فإنه لا جرم أنه يدخل فيه من باب أولى."], [462.0, "ومنها كذلك أيضًا تحريمُ البناء على القبور،"], [465.7, "فلا يجوز أن تُرفع القبور فوق مقدار الشبر،"], [470.0, "كما في صحيح الإمام مسلم من حديث جابرٍ رضي الله عنه قال:"], [474.9, "«نهى النبي ﷺ أن يُبنى على القبر»."], [479.0, "فأيُّ بناءٍ على القبر فالواجب هدمُه."]], "tr": [[446.0, "Bu yüzden Nebî ﷺ'den kabirleri alçıyla sıvamayı yasakladığı sabit olmuştur;"], [452.1, "alçıyla sıvamak, yani süslemek için."], [452.1, "Buradan şunu çıkarırız: Süslemede alçıdan daha büyük olan şey, şüphesiz evleviyetle bu yasağa girer."], [452.1, "Bunlardan biri de kabirler üzerine bina yapmanın haram kılınmasıdır."], [462.0, "Kabirleri bir karıştan fazla yükseltmek caiz değildir."], [465.7, "İmam Müslim'in Sahîh'inde Câbir'in —Allah ondan razı olsun— hadisinde olduğu gibi;"], [470.0, "şöyle demiştir: «Nebî ﷺ kabrin üzerine bina yapılmasını yasakladı.» Kabrin üzerindeki her binayı yıkmak vâcibtir."]]}, {"reader": false, "ar": [[483.0, "وفي صحيح الإمام مسلم من حديث أبي الهيّاج الأسدي رحمه الله تعالى قال:"], [491.0, "قال لي عليُّ بن أبي طالب رضي الله عنه:"], [494.0, "«ألا أبعثك على ما بعثني عليه النبي ﷺ: ألّا تدع صورةً إلا طمستَها» ـ أي سدًّا لذريعة الشرك ـ «ولا قبرًا مُشرِفًا» ـ أي مرتفعًا بناؤه ـ «إلا سوّيتَه»،"], [509.0, "يعني إلا سوّيتَه بالأرض،"], [512.0, "من باب سدّ ذريعة،"], [513.0, "من باب سدّ ذريعة الشرك."]], "tr": [[483.0, "İmam Müslim'in Sahîh'inde Ebu'l-Heyyâc el-Esedî'nin —Allah ona rahmet etsin— hadisinde şöyle der:"], [483.0, "Ali b. Ebî Tâlib —Allah ondan razı olsun— bana şöyle dedi:"], [491.0, "«Seni, Nebî ﷺ'in beni gönderdiği şeyle göndermeyeyim mi? Hiçbir sureti bırakmayacaksın, mutlaka onu silip yok edeceksin» —yani şirk zerîasını kapatmak için— «ve yüksek hiçbir kabri» —yani binası yükseltilmiş— «bırakmayacaksın, mutlaka onu düzleyeceksin.» Yani mutlaka onu yerle bir edeceksin."], [512.0, "Bu, zerîayı kapatma, şirk zerîasını kapatma babındandır."]]}, {"reader": false, "ar": [[515.0, "ومنها كذلك أيضًا تحريمُ الكتابة على القبور؛"], [520.0, "فإنّ الكتابة على القبور لا تجوز ولو كانت كتابةً تعريفيّة،"], [524.0, "ما دمنا نستطيع أن نعرّف القبور بغير الكتابة."], [528.0, "فلا يجوز أن يُكتب اسمُ الميت،"], [530.3, "ولا تاريخُ وفاته، ولا شيءٌ من سيرته،"], [533.0, "ولا شهاداتُه التي أخذها في حياته،"], [536.3, "ولا سببيّةُ وفاته؛ وجميعُ ما يدخل في مسمّى الكتابة فإنه يحرم."]], "tr": [[515.0, "Bunlardan biri de kabirlerin üzerine yazı yazmanın haram kılınmasıdır."], [520.0, "Kabirlerin üzerine yazı yazmak, tanıtıcı bir yazı olsa bile caiz değildir;"], [524.0, "kabirleri yazı dışında bir şeyle tanıtabildiğimiz sürece."], [528.0, "Ölünün adını, vefat tarihini, hayat hikâyesinden bir şeyi, hayatında aldığı diplomaları ve vefat sebebini yazmak caiz değildir."], [536.3, "Yazı adı altına giren her şey haramdır."]]}, {"reader": false, "ar": [[543.0, "وقد ثبت في الصحيح أنّ النبي..."], [544.1, "وقد ثبت عند الترمذي بإسنادٍ صحيح من حديث جابر أنّ النبي ﷺ «نهى عن تجصيص القبور وأن يُكتب عليها»،"], [555.0, "وما ذلك إلا لسدّ ذريعة الشرك."], [560.0, "ومنها كذلك تحريمُ الحلف بغير الله؛"], [565.0, "فإنّ الأدلة كثُرت في تحريم عقد اليمين بغير الله عز وجل،"], [571.0, "وما ذلك إلا لسدّ ذريعة الشرك."]], "tr": [[543.0, "Sahîh'te sabit olmuştur ki Nebî..."], [543.0, "Tirmizî'de sahih bir isnadla Câbir'in hadisinden sabit olmuştur ki Nebî ﷺ «kabirlerin alçıyla sıvanmasını ve üzerlerine yazı yazılmasını yasakladı.» Bu, sadece şirk zerîasını kapatmak içindir."], [555.0, "Bunlardan biri de Allah'tan başkası adına yemin etmenin haram kılınmasıdır."], [560.0, "Allah Azze ve Celle'den başkası adına yemin akdetmenin haramlığı hakkında deliller çoktur;"], [571.0, "bu da sadece şirk zerîasını kapatmak içindir."]]}, {"reader": false, "ar": [[573.0, "وقد قلتُ لكم سابقًا ـ وسأقول لاحقًا ـ بأنّ الحلف بغير الله بمطلق التعظيم شركٌ أصغر،"], [579.5, "وبالتعظيم المطلق شركٌ أكبر."], [583.0, "فالأدلة التي نهت عن عقد اليمين بغير الله إنما نهت عنها من باب سدّ ذريعة الشرك."], [590.0, "ومنها كذلك تحريمُ قول:"], [592.0, "«ما شاء الله وشئت»،"], [594.0, "وسيأتي في ذلك قاعدةٌ خاصة إن شاء الله عز وجل."]], "tr": [[573.0, "Size daha önce söyledim, ileride de söyleyeceğim:"], [573.0, "Allah'tan başkası adına mutlak-ı tazim (bir miktar tazim) ile yemin etmek küçük şirk, tazim-i mutlak (tam tazim) ile yemin etmek büyük şirktir."], [583.0, "Allah'tan başkası adına yemin akdetmeyi yasaklayan deliller, onu ancak şirk zerîasını kapatma babından yasaklamıştır."], [590.0, "Bunlardan biri de \"Allah ve sen dilediniz\" (mâ şâallahu ve şi'te) demenin haram kılınmasıdır;"], [594.0, "inşallah bu konuda özel bir kaide gelecek."]]}]}, {"ts": "10:01", "title": "1. Külliye (devam): Gulüv, riyâ ve ağaçlarla teberrük", "paras": [{"reader": false, "ar": [[601.0, "ومنها أيضًا تحريمُ الغلوّ في الأنبياء والأولياء والصالحين؛"], [605.0, "فإنّ الغلوّ هو البوّابة الكبرى الموجِبة لفساد كلّ اعتقاد،"], [611.0, "فجميعُ من فسدت عقيدته فإنه يقف وراء فسادها الغلوّ."], [617.0, "ولذلك قال الله عز وجل:"], [618.7, "<span class=\"ayah\">﴿يَا أَهْلَ الْكِتَابِ لَا تَغْلُوا فِي دِينِكُمْ﴾<\/span> <span class=\"ref\">[النساء: ١٧١]<\/span>."], [621.0, "فما عُبد عيسى إلا بالغلوّ،"], [623.0, "وما عُبد عُزيرٌ إلا بالغلوّ،"], [625.0, "وما عُبدت الشمسُ والقمر إلا بالغلوّ،"], [628.0, "ولا عُبدت الكواكبُ والأشجار والأحجار والأصنام والأوثان إلا بالغلوّ."]], "tr": [[601.0, "Bunlardan biri de peygamberler, veliler ve salihler hakkında gulüvvün (aşırılığın) haram kılınmasıdır."], [605.0, "Çünkü gulüv, her inancın bozulmasını gerektiren büyük kapıdır;"], [611.0, "akîdesi bozulan herkesin, bu bozulmanın arkasında gulüv durur."], [617.0, "Bu yüzden Allah Azze ve Celle şöyle buyurmuştur:"], [618.7, "<span class=\"ayah\">﴿Ey Kitap ehli! Dininizde aşırı gitmeyin﴾<\/span> [Nisâ 171]."], [618.7, "Îsâ'ya ancak gulüv yüzünden ibadet edildi, Üzeyr'e ancak gulüv yüzünden ibadet edildi, güneşe ve aya ancak gulüv yüzünden ibadet edildi;"], [625.0, "yıldızlara, ağaçlara, taşlara, putlara ve heykellere de ancak gulüv yüzünden ibadet edildi."]]}, {"reader": false, "ar": [[635.0, "ولذلك قال النبي ﷺ: «وإيّاكم والغلوّ، فإنما أهلك من كان قبلكم الغلوّ»."], [643.0, "فتحريم الغلوّ إنما كان تحريمَ وسائل،"], [645.7, "لأنه ما عُبدت هذه القبور إلا بسبب الغلوّ،"], [649.3, "ولا وقع الشرك إلا بسبب الغلوّ."]], "tr": [[635.0, "Bu yüzden Nebî ﷺ şöyle buyurmuştur:"], [635.0, "«Gulüvden sakının; sizden öncekileri ancak gulüv helak etti.» Gulüvvün haram kılınması ancak bir vesile yasağıdır;"], [645.7, "çünkü bu kabirlere ancak gulüv sebebiyle ibadet edildi ve şirk ancak gulüv sebebiyle meydana geldi."]]}, {"reader": false, "ar": [[652.0, "ومن ذلك أيضًا تحريمُ يسير الرياء؛"], [655.3, "فإنّ الرياء محرَّمٌ كثيرُه وقليلُه."], [658.0, "لكن مَن راءى غيرَه بمطلق الرياء فهذا شركٌ أصغر."], [665.0, "لكن أمّا إن راءاه ولم يقصد بعمله أصلًا إلا وجهَه هو،"], [669.0, "وكان الباعثُ له على أصل العمل إرضاءَه أو تعظيمَه أو التقرّبَ إليه،"], [675.8, "فلا جرم أنّ ذلك لم يعد يسيرًا،"], [679.0, "وإنما موجبٌ للشرك الأكبر."]], "tr": [[652.0, "Bunlardan biri de riyânın azının haram kılınmasıdır."], [655.3, "Riyânın çoğu da azı da haramdır."], [655.3, "Fakat başkasına mutlak-ı riyâ (bir miktar riyâ) ile gösteriş yapan kişinin bu yaptığı küçük şirktir."], [665.0, "Ama ona gösteriş yapar ve ameliyle aslında sadece onun rızasını kastederse ve amelin aslına onu sevk eden şey onu razı etmek, ona tazim etmek veya ona yakınlaşmak olursa, şüphesiz bu artık az olmaktan çıkmış, büyük şirki gerektiren bir şey olmuştur."]]}, {"reader": false, "ar": [[682.0, "ومنها كذلك تحريمُ التبرّك بالأشجار والأحجار،"], [687.0, "كما حرّم النبي ﷺ ذلك لمّا مرّوا على شجرةٍ فقالوا:"], [694.8, "«يا رسول الله، اجعل لنا ذاتَ أنواط» ـ أي نتبرّك بها ونعلّق عليها أسلحتنا كما يفعل المشركون ـ قالوا:"], [704.3, "«يا رسول الله، اجعل لنا ذاتَ أنواطٍ كما لهم ذاتُ أنواط»،"], [708.0, "فقال: «قلتم ـ والذي نفسي بيده ـ كما قالت بنو إسرائيل: <span class=\"ayah\">﴿اجْعَل لَّنَا إِلَٰهًا كَمَا لَهُمْ آلِهَةٌ﴾<\/span> <span class=\"ref\">[الأعراف: ١٣٨]<\/span>»."], [715.0, "وما ذلك إلا لسدّ ذريعة الشرك."]], "tr": [[682.0, "Bunlardan biri de ağaçlar ve taşlarla teberrük etmenin (bereket ummanın) haram kılınmasıdır."], [687.0, "Nebî ﷺ bunu haram kılmıştır:"], [687.0, "Bir ağacın yanından geçtiklerinde \"Ey Allah'ın Resûlü!"], [694.8, "Bize de bir Zâtu Envât yap\" dediler —yani onunla teberrük edelim ve müşriklerin yaptığı gibi silahlarımızı üzerine asalım—."], [694.8, "\"Ey Allah'ın Resûlü! Onların bir Zâtu Envât'ı olduğu gibi bize de bir Zâtu Envât yap\" dediler."], [708.0, "Bunun üzerine şöyle buyurdu: «Nefsim elinde olana yemin olsun ki, İsrâiloğulları'nın dediği gibi dediniz: <span class=\"ayah\">﴿Onların ilahları olduğu gibi bize de bir ilah yap﴾<\/span> [A'râf 138].» Bu da sadece şirk zerîasını kapatmak içindir."]]}, {"reader": false, "ar": [[718.0, "وهكذا دواليك في أمثلةٍ كثيرة."], [721.0, "فكلُّ وسيلةٍ تُفضي إلى الشرك الأكبر إفضاءَ علمٍ ـ يعني نقطع بأنها تُفضي إليه ـ أو غلبةِ ظنٍّ ـ يعني يغلب على ظنّنا أنها تُفضي إليه ـ فإنّ الواجب علينا سدُّها وإحكامُ إغلاق أبوابها،"], [735.2, "وألّا نفتح شيئًا من ذلك أبدًا. والله أعلم."]], "tr": [[718.0, "Daha pek çok örnekte durum böyledir."], [721.0, "Büyük şirke kesin bilgiyle —yani ona götürdüğünü kesin olarak bildiğimiz— veya galip zanla —yani ona götürdüğü zannımıza galip gelen— götüren her vesileyi kapatmamız ve kapılarını sıkıca kilitlememiz vâcibtir;"], [721.0, "bundan hiçbir şeyi asla açmamalıyız. Allah en iyisini bilir."]]}]}, {"ts": "12:19", "title": "2. Külliye: Delillerde nekre olarak gelen her küfürden küçük küfür kastedilir", "paras": [{"reader": false, "ar": [[739.0, "ومن الكلّيّات أيضًا: <b>كلُّ كفرٍ منكَّرٍ في الأدلة فيُرادُ به الأصغرُ إلا بقرينة إرادة الأكبر.<\/b> كلُّ كفرٍ منكَّرٍ في الأدلة فيُراد به الأصغر إلا بقرينة إرادة الأكبر."], [757.0, "كلُّ كفرٍ منكَّرٍ في الأدلة فيُراد به الأصغر إلا بقرينة إرادة الأكبر. واضحة؟"]], "tr": [[739.0, "Külliyelerden biri de şudur: 2."], [739.0, "külliye: Delillerde nekre (belirsiz, harf-i tarifsiz) olarak gelen her küfürden, büyük küfrün kastedildiğine dair bir karine olmadıkça küçük küfür kastedilir. (İki kez tekrar ediyor.) Anlaşıldı mı?"]]}, {"reader": false, "ar": [[768.0, "أقول وبالله التوفيق: وذلك لأنّ أهل السنة والجماعة متّفقون على أنّ الكفر ليس نوعًا واحدًا كما قالته الوعيديّة،"], [776.0, "وإنما هو كفران: كفرٌ أكبر وكفرٌ أصغر،"], [781.0, "ويجمعها الجحود. فمن جحد ما يجب عليه الإيمانُ به مطلقَ الجحود فهذا كفرٌ أصغر،"], [793.0, "ومن جحد ما يجب الإيمانُ عليه به أو فيه بالجحود المطلق فإنه كفرٌ أكبر."], [801.0, "والجامعُ في الكفر هو الجحود."], [803.0, "وستأتينا كلّيّتان تتكلّمان عن التفريق بين الشرك والكفر بعد قليل إن شاء الله تعالى."]], "tr": [[768.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi şudur:"], [768.0, "Ehl-i Sünnet ve'l-Cemaat, Vaîdiyye'nin dediği gibi küfrün tek bir tür olmadığı, bilakis iki küfür olduğu konusunda ittifak hâlindedir:"], [776.0, "Büyük küfür ve küçük küfür."], [781.0, "İkisini bir araya getiren şey cuhûddur (inkârdır)."], [781.0, "İman etmesi gereken şeyi mutlak-ı cuhûd (bir miktar inkâr) ile inkâr edenin (durumu) küçük küfürdür."], [793.0, "İman etmesi gereken şeyi cuhûd-ı mutlak (tam inkâr) ile inkâr edenin (durumu) ise büyük küfürdür."], [803.0, "Küfürde ortak unsur cuhûddur. Birazdan inşallah şirk ile küfür arasındaki farktan bahseden iki külliye gelecek."]]}, {"reader": false, "ar": [[809.0, "وقد وضع العلماءُ ـ رحمهم الله تعالى ـ جُملًا من الضوابط التي تعرّفك ما كان من قبيل الكفر الأكبر،"], [818.5, "وما كان من قبيل الكفر الأصغر."], [822.0, "ولكنّ هذه الضوابط قد تكون مدخولةً في بعض الأمثلة،"], [827.0, "ولذلك ضبطتُ الكلّيّة بضابطٍ لا ينخرم إن شاء الله،"], [831.0, "وهي أنّ كلَّ كفرٍ منكَّرٍ في الأدلة فإنه يُراد به الأصغرُ أصالةً،"], [838.0, "إلا إذا وردت قرينةُ إرادة الأكبر."]], "tr": [[809.0, "Âlimler —Allah onlara rahmet etsin— sana neyin büyük küfür kabilinden, neyin küçük küfür kabilinden olduğunu tanıtan birçok zâbıt koymuşlardır."], [818.5, "Fakat bu zâbıtlar bazı örneklerde kusurlu (itiraza açık) olabilir."], [822.0, "Bu yüzden külliyeyi inşallah bozulmayan bir zâbıtla belirledim:"], [827.0, "Delillerde nekre olarak gelen her küfürden aslen küçük küfür kastedilir;"], [831.0, "ancak büyük küfrün kastedildiğine dair bir karine gelirse (durum değişir)."]]}, {"reader": false, "ar": [[842.0, "وذلك كقول النبي ﷺ: «سِبابُ المسلم فسوقٌ، وقتالُه كفر»."], [850.0, "فهنا ورد الكفر منكَّرًا ـ أي بغير الألف واللام ـ فيُراد به الكفر الأصغر."], [857.0, "وقد أجمع أهل السنة والجماعة على أنّ من قاتل مسلمًا غيرَ مستحلٍّ لدمه فإنه قد ارتكب كبيرةً من الكبائر،"], [870.0, "ووقع في مطلق الجحود، أي الكفر الأصغر."]], "tr": [[842.0, "Bu, Nebî ﷺ'in şu sözü gibidir:"], [842.0, "«Müslümana sövmek fısktır, onunla savaşmak küfürdür.» Burada küfür nekre olarak, yani elif-lâm olmadan gelmiştir;"], [850.0, "bu yüzden ondan küçük küfür kastedilir."], [857.0, "Ehl-i Sünnet ve'l-Cemaat, kanını helal saymaksızın bir Müslümanla savaşan kişinin büyük günahlardan birini işlemiş olduğu ve mutlak-ı cuhûda, yani küçük küfre düştüğü üzerinde icmâ etmiştir."]]}, {"reader": false, "ar": [[875.0, "وكقول النبي ﷺ: «اثنتان في الناس هما بهم كفر: النياحةُ على الميت، والطعنُ في النسب» ـ أو قال:"], [887.5, "«في الأنساب»، أو قال:"], [888.8, "«الطعنُ في الأنساب والنياحةُ على الميت» ـ أو كما قال ﷺ."], [893.0, "وقد أجمع العلماء على أنّ هذين الأمرين ليس بموجبٍ للخروج من الملّة،"], [899.5, "وإنما يُراد به الكفر الأصغر،"], [902.3, "لأنه ورد منكَّرًا غيرَ معرَّف."]], "tr": [[875.0, "Nebî ﷺ'in şu sözü gibi:"], [875.0, "«İnsanlarda iki şey vardır ki onlar kendilerinde bir küfürdür: Ölünün arkasından feryat ederek ağlamak ve nesebe dil uzatmak» —ya da \"nesepler hakkında\" dedi, ya da \"nesepler hakkında dil uzatmak ve ölünün arkasından feryat ederek ağlamak\" dedi— ya da ﷺ nasıl dediyse."], [893.0, "Âlimler bu iki şeyin dinden çıkmayı gerektirmediği, ondan küçük küfür kastedildiği üzerinde icmâ etmişlerdir;"], [902.3, "çünkü marife değil, nekre olarak gelmiştir."]]}]}, {"ts": "15:05", "title": "2. Külliye (devam): Mü'minlerin birbiriyle savaşması, nesebi inkâr, namazı terk", "paras": [{"reader": false, "ar": [[905.0, "ومنها أيضًا قول النبي ﷺ:"], [910.0, "«لا ترجعوا بعدي كفّارًا يضرب بعضُكم رقابَ بعض»."], [915.0, "ومن المعلوم أنّ اقتتال المسلمين فيما بينهم لا يوصل إلى الكفر الأكبر،"], [921.7, "وإنما يبقى في دائرة الكفر الأصغر؛"], [925.0, "لأنّ الله عز وجل دعا الطائفتين المؤمنتين المقتتلتين ـ بعد قوله:"], [931.5, "<span class=\"ayah\">﴿وَإِن طَائِفَتَانِ مِنَ الْمُؤْمِنِينَ اقْتَتَلُوا فَأَصْلِحُوا بَيْنَهُمَا ۖ فَإِن بَغَتْ إِحْدَاهُمَا عَلَى الْأُخْرَىٰ فَقَاتِلُوا الَّتِي تَبْغِي حَتَّىٰ تَفِيءَ إِلَىٰ أَمْرِ اللَّهِ ۚ فَإِن فَاءَتْ فَأَصْلِحُوا بَيْنَهُمَا بِالْعَدْلِ وَأَقْسِطُوا ۖ إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ﴾<\/span> <span class=\"ref\">[الحجرات: ٩]<\/span>،"], [946.0, "ثم قال: <span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ﴾<\/span> <span class=\"ref\">[الحجرات: ١٠]<\/span> ـ فدعاهم في أول الآيات بالإيمان،"], [950.0, "ووصفهم في آخرها بالإيمان؛"], [953.0, "ممّا يدلّ على أنّ قتل المسلم لأخيه المسلم ليس كفرًا أكبر."]], "tr": [[905.0, "Bunlardan biri de Nebî ﷺ'in şu sözüdür:"], [910.0, "«Benden sonra birbirinizin boynunu vuran kâfirler hâline dönmeyin.» Bilindiği üzere Müslümanların kendi aralarında savaşması büyük küfre ulaştırmaz, küçük küfür dairesinde kalır."], [925.0, "Çünkü Allah Azze ve Celle birbiriyle savaşan iki mü'min taifeyi (mü'min diye) çağırmıştır."], [931.5, "Şu sözünden sonra: <span class=\"ayah\">﴿Eğer mü'minlerden iki topluluk birbiriyle savaşırsa aralarını düzeltin. Şayet biri ötekine saldırırsa, Allah'ın emrine dönünceye kadar saldıranla savaşın. Eğer dönerse aralarını adaletle düzeltin ve âdil davranın. Şüphesiz Allah âdil davrananları sever﴾<\/span> [Hucurât 9]."], [931.5, "Sonra şöyle buyurmuştur: <span class=\"ayah\">﴿Mü'minler ancak kardeştir﴾<\/span> [Hucurât 10]."], [946.0, "Onları ayetlerin başında imanla çağırmış, sonunda da imanla nitelemiştir."], [950.0, "Bu, Müslümanın Müslüman kardeşini öldürmesinin büyük küfür olmadığına delâlet eder."]]}, {"reader": false, "ar": [[957.0, "وكذلك قول الله عز وجل في شأن القاتل:"], [960.0, "<span class=\"ayah\">﴿فَمَنْ عُفِيَ لَهُ مِنْ أَخِيهِ﴾<\/span> <span class=\"ref\">[البقرة: ١٧٨]<\/span>."], [962.0, "ومن المعلوم أنّ الأخوّة هنا ليست أخوّةَ النسب،"], [966.0, "وإنما أخوّةُ الدين؛ فأثبت الله عز وجل بين القاتل والمقتول عمدًا أخوّةً،"], [972.9, "أخوّةً دينيّة، فدلّ ذلك على أنّ هذا الكفر إنما يُراد به الكفر الأصغر."]], "tr": [[957.0, "Aynı şekilde Allah Azze ve Celle'nin katil hakkındaki şu sözü:"], [960.0, "<span class=\"ayah\">﴿Kimin için kardeşi tarafından bir şey bağışlanırsa﴾<\/span> [Bakara 178]."], [962.0, "Bilindiği üzere buradaki kardeşlik nesep kardeşliği değil, din kardeşliğidir."], [966.0, "Allah Azze ve Celle kasten öldüren ile öldürülen arasında bir kardeşlik, dinî bir kardeşlik isbat etmiştir."], [972.9, "Bu da bu küfürden ancak küçük küfrün kastedildiğine delâlet eder."]]}, {"reader": false, "ar": [[978.0, "ومنها أيضًا قول النبي ﷺ:"], [981.3, "«لا ترغبوا عن آبائكم، فمن رغب عن أبيه فهو كفر»."], [986.0, "ومن المعلوم أنّ انتساب الإنسان إلى غير أبيه ـ وهو يعلمه ـ ليس من الكفر الأكبر،"], [993.0, "وإنما من الكفر الأصغر."], [994.0, "وأيضًا مثلُه قول النبي ﷺ:"], [998.6, "«ليس منّا من ادّعى لغير أبيه، فمن ادّعى لغير أبيه فقد كفر»،"], [1005.5, "والمراد به إنما هو الكفر الأصغر."]], "tr": [[978.0, "Bunlardan biri de Nebî ﷺ'in şu sözüdür:"], [981.3, "«Babalarınızdan yüz çevirmeyin; kim babasından yüz çevirirse bu bir küfürdür.» Bilindiği üzere insanın bile bile babasından başkasına nispet edilmesi büyük küfürden değil, küçük küfürdendir."], [993.0, "Aynı şekilde Nebî ﷺ'in şu sözü de onun gibidir:"], [994.0, "«Babasından başkasına nispet iddia eden bizden değildir; kim babasından başkasına nispet iddia ederse küfretmiştir.» Bundan kastedilen de ancak küçük küfürdür."]]}, {"reader": false, "ar": [[1009.0, "فمتى ما رأيتَ الكفرَ منكَّرًا ـ أي بغير الألف واللام ـ فاحمله مباشرةً على أنه كفرٌ أصغر،"], [1017.8, "إلا إذا وردت قرينةٌ تدلّ على أنه الكفر الأكبر."], [1023.0, "وإنّ من عجائب فصاحة النبي ﷺ أنه وصف تاركَ الصلاة بالكفر المعرَّف والمنكَّر،"], [1038.0, "فقال ـ في صحيح مسلم من حديث جابر رضي الله عنه ـ:"], [1046.0, "«بين الرجل والكفر تركُ الصلاة»،"], [1052.0, "فهنا ورد الكفر معرَّفًا."]], "tr": [[1009.0, "Küfrü nekre olarak, yani elif-lâm olmadan gördüğün her zaman, onu doğrudan küçük küfür olarak anla;"], [1009.0, "ancak onun büyük küfür olduğuna delâlet eden bir karine gelirse (durum değişir)."], [1017.8, "Nebî ﷺ'in fesahatinin hayret verici yönlerindendir ki namazı terk edeni hem marife hem nekre küfürle nitelemiştir."], [1023.0, "Müslim'in Sahîh'inde Câbir'in —Allah ondan razı olsun— hadisinde şöyle buyurmuştur:"], [1038.0, "«Kişi ile küfür arasında namazı terk etmek vardır.» Burada küfür marife olarak gelmiştir."]]}, {"reader": false, "ar": [[1054.0, "بينما قال في حديث بُريدة في السنن:"], [1057.0, "«العهدُ الذي بيننا وبينهم الصلاة، فمن تركها فقد كفر»،"], [1063.0, "وهنا ورد منكَّرًا. وذلك لأنّ تارك الصلاة قد يكون كافرًا الكفرَ الأصغر،"], [1069.0, "وقد يكون كافرًا الكفرَ الأكبر."], [1072.0, "وهذا يدلّ على أنّ أرجح الأقوال فيه هو التفريق بين مطلق الترك والترك المطلق:"], [1079.0, "فمن ترك الصلاة بمطلق الترك فكفرُه كفرٌ أصغر،"], [1084.0, "وعليه تُحمل روايةُ التنكير؛"], [1087.0, "ومن ترك الصلاة التركَ المطلقَ الدائم الذي لا ينقطع فإنّ كفره كفرٌ أكبر،"], [1094.0, "وعليه تُحمل روايةُ التعريف. والله أعلم."]], "tr": [[1054.0, "Oysa Sünen'deki Büreyde hadisinde şöyle buyurmuştur:"], [1057.0, "«Bizimle onlar arasındaki ahid namazdır; kim onu terk ederse küfretmiştir.» Burada ise nekre olarak gelmiştir."], [1063.0, "Bunun sebebi, namazı terk edenin bazen küçük küfürle, bazen de büyük küfürle kâfir olmasıdır."], [1069.0, "Bu da bu konudaki görüşlerin en racihinin mutlak-ı terk (ara sıra terk) ile terk-i mutlak (tamamen terk) arasında ayırım yapmak olduğunu gösterir."], [1079.0, "Namazı mutlak-ı terk ile terk edenin küfrü küçük küfürdür;"], [1084.0, "nekreli rivayet buna hamledilir. Namazı hiç kesintisiz, sürekli bir terk-i mutlak ile terk edenin küfrü ise büyük küfürdür;"], [1087.0, "marifeli rivayet de buna hamledilir. Allah en iyisini bilir."]]}]}, {"ts": "18:18", "title": "3. Külliye: Elif-lâm ile marife olarak gelen her küfürden büyük küfür kastedilir", "paras": [{"reader": false, "ar": [[1098.0, "ومن الكلّيّات أيضًا: <b>كلُّ كفرٍ ورد معرَّفًا بالألف واللام فيُراد به الأكبر إلا بقرينة إرادة الأصغر.<\/b> ورد معرَّفًا، أي بالألف واللام."]], "tr": [[1098.0, "Külliyelerden biri de şudur: 3."], [1098.0, "külliye: Elif-lâm ile marife olarak gelen her küfürden, küçük küfrün kastedildiğine dair bir karine olmadıkça büyük küfür kastedilir. Marife olarak, yani elif-lâm ile gelen."]]}, {"reader": false, "ar": [[1112.0, "أقول وبالله التوفيق: ويدخل في ذلك كلُّ كفرٍ ذكره الله عز وجل في القرآن وتوعّد عليه بالعذاب الشديد الأليم."], [1123.0, "فمتى ما مررتَ على «الكافرين» أو «كفر» في كتاب الله عز وجل،"], [1128.0, "فإنه لا يُراد به إلا الكفر الأكبر،"], [1132.0, "إلا الكفر الأكبر. كقول الله عز وجل ـ انتبهوا ـ كقول الله عز وجل:"], [1138.0, "«إنّ الذين كفروا»... لا،"], [1140.9, "في الآية <span class=\"q\">؟ 19:02<\/span>: <span class=\"ayah\">﴿إِنَّ الَّذِينَ يَكْفُرُونَ بِآيَاتِ اللَّهِ﴾<\/span> <span class=\"ref\">[آل عمران: ٢١]<\/span>،"], [1145.6, "فيُراد بها الكفر الأكبر."], [1150.6, "<span class=\"ayah\">﴿مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ﴾<\/span>،"], [1153.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ كَفَرُوا مِنْ أَهْلِ الْكِتَابِ وَالْمُشْرِكِينَ﴾<\/span> <span class=\"ref\">[البينة: ٦]<\/span>،"], [1156.8, "فـ«الذين كفروا» يُراد بها الأكبر."]], "tr": [[1112.0, "Tevfik Allah'tandır, derim ki: Allah Azze ve Celle'nin Kur'an'da zikredip üzerine şiddetli ve elem verici azap tehdidinde bulunduğu her küfür buna girer."], [1123.0, "Allah Azze ve Celle'nin Kitabı'nda \"kâfirler\" veya \"küfür\" kelimesine rastladığın her zaman, ondan ancak büyük küfür kastedilir, ancak büyük küfür."], [1132.0, "Allah Azze ve Celle'nin şu sözü gibi —dikkat edin— Allah Azze ve Celle'nin şu sözü gibi:"], [1140.9, "\"Şüphesiz küfredenler\"... hayır, ayette <span class=\"q\">؟<\/span>:"], [1140.9, "<span class=\"ayah\">﴿Şüphesiz Allah'ın ayetlerini inkâr edenler﴾<\/span> [Âl-i İmrân 21];"], [1150.6, "bundan büyük küfür kastedilir. <span class=\"ayah\">﴿Kitap ehlinden ve müşriklerden﴾<\/span>, <span class=\"ayah\">﴿Şüphesiz Kitap ehlinden ve müşriklerden küfredenler﴾<\/span> [Beyyine 6]; \"küfredenler\"den büyük (küfür) kastedilir."]]}, {"reader": false, "ar": [[1160.0, "وهكذا في كلّ كتاب الله عز وجل،"], [1162.0, "من الفاتحة إلى الناس:"], [1164.0, "فما مرّ عليك كفرٌ في كتاب الله ـ سواءٌ كان منكَّرًا أو معرَّفًا،"], [1169.0, "سواءٌ كان مقرونًا بالشرك أو مذكورًا لوحده ـ فإنما يُراد به الكفر الأكبر."], [1178.0, "هذه لغة القرآن، كما نصّ على ذلك الإمام ابن تيمية رحمه الله تعالى."], [1183.0, "فجميعُ الكفر الوارد في كتاب الله عز وجل فإنما يُراد به الكفر الأكبر،"], [1189.0, "إلا بقرينة، إلا بقرينة ـ انتبهوا ـ إلا بقرينة إرادة الأصغر."]], "tr": [[1160.0, "Fâtiha'dan Nâs'a kadar Allah Azze ve Celle'nin bütün Kitabı'nda durum böyledir:"], [1164.0, "Allah'ın Kitabı'nda karşına çıkan her küfürden —ister nekre ister marife olsun, ister şirkle birlikte ister tek başına zikredilsin— ancak büyük küfür kastedilir."], [1169.0, "İmam İbn Teymiyye'nin —Allah ona rahmet etsin— açıkça belirttiği gibi Kur'an'ın dili budur."], [1178.0, "Allah Azze ve Celle'nin Kitabı'nda geçen bütün küfürlerden ancak büyük küfür kastedilir;"], [1183.0, "ancak bir karine, ancak bir karine —dikkat edin— küçük küfrün kastedildiğine dair bir karine varsa (durum değişir)."]]}, {"reader": false, "ar": [[1194.0, "ولم أجدهم يفرّعون على هذا في الكفر الوارد في القرآن إلا بفرعٍ واحد،"], [1199.8, "وهي قول الله عز وجل:"], [1201.8, "<span class=\"ayah\">﴿وَمَن لَّمْ يَحْكُم بِمَا أَنزَلَ اللَّهُ فَأُولَٰئِكَ هُمُ الْكَافِرُونَ﴾<\/span> <span class=\"ref\">[المائدة: ٤٤]<\/span>."], [1206.0, "فهنا ثبت عن كثيرٍ من أصحاب النبي ﷺ ـ كابن عباس وغيره ـ وعن كثيرٍ من التابعين أنه لا يُراد به الكفر الأكبر،"], [1217.0, "وإنما يُراد به كفرٌ دون كفر."], [1220.0, "وهذه لها تفاصيل ستأتينا في مسائل الحكم بغير ما أنزل الله عز وجل."]], "tr": [[1194.0, "Kur'an'da geçen küfür hakkında bu (kaideden) ayrılan tek bir fer' (istisna) dışında bir şey bulmadım."], [1199.8, "O da Allah Azze ve Celle'nin şu sözüdür:"], [1201.8, "<span class=\"ayah\">﴿Kim Allah'ın indirdiğiyle hükmetmezse, işte onlar kâfirlerin ta kendileridir﴾<\/span> [Mâide 44]."], [1201.8, "Burada İbn Abbas ve başkaları gibi Nebî ﷺ'in ashâbından birçoğundan ve tâbiînden birçoğundan, bundan büyük küfrün değil, \"küfürden aşağı bir küfür\"ün kastedildiği sabit olmuştur."], [1217.0, "Bunun Allah Azze ve Celle'nin indirdiğinden başkasıyla hükmetme meselelerinde gelecek ayrıntıları var."]]}, {"reader": false, "ar": [[1225.0, "لكنّ الذي أريد أن أنبّهك عليه هنا:"], [1227.7, "أنه متى ما مرّت عليك كلمةُ الكفر في الكتاب أو السنة معرَّفةً بالألف واللام،"], [1233.4, "فإنما يُراد بها الكفر الأكبر،"], [1235.6, "إلا بقرينة إرادة الأصغر. والله أعلم."]], "tr": [[1225.0, "Fakat burada sana dikkat çekmek istediğim şudur:"], [1225.0, "Kitap'ta veya Sünnet'te elif-lâm ile marife olarak \"küfür\" kelimesi karşına çıktığında, küçük küfrün kastedildiğine dair bir karine olmadıkça ondan ancak büyük küfür kastedilir. Allah en iyisini bilir."]]}]}, {"ts": "20:38", "title": "4. Külliye: Mahlûkun Hâlık'a ortak kılındığı vehmini veren her lafız", "paras": [{"reader": false, "ar": [[1238.0, "ومن الكلّيّات أيضًا: <b>كلُّ لفظٍ أوهم تشريكَ المخلوق بالخالق فالواجبُ تركُه.<\/b> كلُّ لفظٍ أوهم تشريك المخلوق بالخالق فالواجب تركه،"], [1259.0, "أو نقول: فهو محرَّم،"], [1261.0, "أو نقول: فهو شرك."], [1264.0, "يلّا عبّروا <span class=\"q\">؟ 21:04<\/span>. فالواجب تركه،"], [1269.0, "أو: فهو محرَّم، أو:"], [1272.7, "فهو شرك. وكلُّ هذا سيأتي شرحه إن شاء الله."]], "tr": [[1238.0, "Külliyelerden biri de şudur: 4."], [1238.0, "külliye: Mahlûkun Hâlık'a ortak kılındığı vehmini veren her lafzı terk etmek vâcibtir. Mahlûkun Hâlık'a ortak kılındığı vehmini veren her lafzı terk etmek vâcibtir;"], [1259.0, "ya da \"o haramdır\" deriz, ya da \"o şirktir\" deriz."], [1264.0, "Haydi, (siz) ifade edin <span class=\"q\">؟<\/span>."], [1264.0, "Onu terk etmek vâcibtir, ya da:"], [1269.0, "O haramdır, ya da: O şirktir."], [1272.7, "Bütün bunların şerhi inşallah gelecek."]]}, {"reader": false, "ar": [[1276.0, "أقول وبالله التوفيق: إنه لا يجوز للإنسان أبدًا أن يَقرن مع الله عز وجل غيرَه في تدبيرٍ كونيٍّ أو مشيئةٍ كونيّةٍ بحرف الواو."], [1286.0, "لا يجوز للإنسان أن يقرن الله عز وجل بغيره ـ أيًّا كان ذلك المخلوق ـ بحرف الواو."], [1296.0, "فما كان من قبيل التدبير الكوني والمشيئة الكونيّة،"], [1300.0, "فالواجب عليك أن تُفرد الله عز وجل به،"], [1304.0, "أو على الأقلّ أن تعطف المخلوقَ على الخالق بحرفٍ يقتضي عدم المساواة."]], "tr": [[1276.0, "Tevfik Allah'tandır, derim ki: İnsanın kevnî bir tedbirde veya kevnî bir meşîette Allah Azze ve Celle ile birlikte başkasını vav harfiyle yan yana getirmesi asla caiz değildir."], [1286.0, "İnsanın Allah Azze ve Celle'yi başkasıyla —o mahlûk kim olursa olsun— vav harfiyle yan yana getirmesi caiz değildir."], [1296.0, "Kevnî tedbir ve kevnî meşîet kabilinden olan şeyde Allah Azze ve Celle'yi tekleştirmen, ya da en azından mahlûku Hâlık'a eşitlik olmamasını gerektiren bir harfle atfetmen vâcibtir."]]}, {"reader": false, "ar": [[1310.0, "والعلماء ينصّون على ذلك في مسألة المشيئة أو التدبير الكوني؛"], [1319.0, "فلا يُقرَن مع الله غيرُه في أمرٍ يخصّ المشيئة الكونيّة أو التدبير الكوني،"], [1327.0, "كقولك: «ما شاء الله وشئت»،"], [1329.0, "فإنّ ذلك من الألفاظ التي توهم تشريكَ الخالق بالمخلوق."], [1334.0, "وإنما صوابُها أن يُقال:"], [1335.6, "«ما شاء الله ثم شئت»،"], [1337.6, "أو يُقال: «ما شاء الله وحده»."]], "tr": [[1310.0, "Âlimler bunu meşîet veya kevnî tedbir meselesinde açıkça belirtirler."], [1310.0, "Kevnî meşîete veya kevnî tedbire ait bir hususta Allah ile birlikte başkası yan yana getirilmez."], [1319.0, "\"Allah ve sen dilediniz\" demen gibi;"], [1329.0, "çünkü bu, Hâlık'ın mahlûka ortak kılındığı vehmini veren lafızlardandır."], [1334.0, "Doğrusu \"Allah diledi, sonra sen diledin\" demek veya \"Yalnız Allah diledi\" demektir."]]}, {"reader": false, "ar": [[1340.0, "كما في حديث قُتيلة رضي الله عنها:"], [1343.5, "أنّ يهوديًّا جاء إلى النبي ﷺ فقال:"], [1348.5, "«إنكم تُشركون؛ تقولون: ما شاء الله وشئت، وتقولون: والكعبة»،"], [1353.0, "فأمرهم النبي ﷺ أن يقولوا:"], [1358.3, "«ما شاء الله ثم شئت»..."], [1361.7, "الحديث بتمامه. وكذلك جاء رجلٌ إلى النبي ﷺ فقال:"], [1368.0, "«ما شاء الله وشئت»،"], [1370.0, "فقال: «أجعلتني لله ندًّا؟! قل: ما شاء الله وحده»."]], "tr": [[1340.0, "Kuteyle'nin —Allah ondan razı olsun— hadisinde olduğu gibi:"], [1343.5, "Bir Yahudi Nebî ﷺ'e gelip şöyle dedi:"], [1343.5, "\"Siz şirk koşuyorsunuz; 'Allah ve sen dilediniz' diyorsunuz ve 'Kâbe'ye yemin olsun' diyorsunuz.\" Bunun üzerine Nebî ﷺ onlara \"Allah diledi, sonra sen diledin\" demelerini emretti..."], [1361.7, "hadisin tamamı. Aynı şekilde bir adam Nebî ﷺ'e gelip \"Allah ve sen dilediniz\" dedi."], [1368.0, "Bunun üzerine şöyle buyurdu: «Beni Allah'a denk mi kıldın?! \"Yalnız Allah diledi\" de.»"]]}, {"reader": false, "ar": [[1374.0, "فإذًا كلُّ أمرٍ تدبيريٍّ أو مشيئةٍ كونيّة،"], [1377.3, "فإيّاك أن تقرن مع الله عز وجل غيرَه بحرف العطف،"], [1382.0, "أي بحرف الواو. وإنما إمّا أن تُفرد الله عز وجل بها فتقول:"], [1386.6, "«ما شاء الله وحده» ـ وهو الأكمل ـ أو على الأقلّ أن تعطف المخلوق على الخالق بحرف «ثم»،"], [1393.0, "فإنّ ذلك جائزٌ وردت به الأدلة."]], "tr": [[1374.0, "Demek ki her tedbirle ilgili hususta veya kevnî meşîette, Allah Azze ve Celle ile birlikte başkasını atıf harfiyle, yani vav harfiyle yan yana getirmekten sakın."], [1382.0, "Ya Allah Azze ve Celle'yi onda tekleştirip \"Yalnız Allah diledi\" dersin —en mükemmeli budur— ya da en azından mahlûku Hâlık'a \"sonra\" (sümme) harfiyle atfedersin;"], [1393.0, "bu caizdir ve deliller bununla gelmiştir."]]}, {"reader": false, "ar": [[1396.0, "وبناءً على ذلك فلا يجوز للإنسان أن يقول:"], [1399.6, "«لولا الله وأنت»، وإنما يقول:"], [1402.3, "«لولا الله وحده»، أو يقول:"], [1405.5, "«لولا الله ثم أنت»؛"], [1408.0, "فلا يجوز أن يُقرن مع الخالق غيرُه بحرف الواو."], [1413.0, "وكذلك: «أنا في حَسْب الله وحَسْبك»،"], [1417.0, "وهذا لا يجوز؛ إمّا أن تقول:"], [1420.3, "«أنا في حسب الله وحده»،"], [1422.4, "أو «في حسب الله ثم حسبك»."], [1425.0, "وكذلك أيضًا: «أنا بالله وبك»،"], [1429.0, "فإمّا أن تقول: «أنا بالله وحده»،"], [1432.3, "أو «أنا بالله ثم بك»."]], "tr": [[1396.0, "Buna göre insanın \"Allah ve sen olmasaydınız\" demesi caiz değildir;"], [1399.6, "bilakis \"Yalnız Allah olmasaydı\" veya \"Allah, sonra sen olmasaydın\" der."], [1402.3, "Hâlık ile birlikte başkasını vav harfiyle yan yana getirmek caiz değildir."], [1408.0, "Aynı şekilde \"Ben Allah'ın ve senin himayendeyim (hasbindeyim)\" (demek de böyledir);"], [1413.0, "bu caiz değildir. Ya \"Ben yalnız Allah'ın himayesindeyim\" ya da \"Allah'ın, sonra senin himayendeyim\" dersin."], [1422.4, "Aynı şekilde \"Ben Allah'la ve seninleyim\" (demek de böyledir);"], [1429.0, "ya \"Ben yalnız Allah'layım\" ya da \"Ben Allah'la, sonra seninleyim\" dersin."]]}, {"reader": false, "ar": [[1435.0, "وكذلك قولهم: «أنا في جوار الله وجوارك»،"], [1440.0, "أي في حماية الله وحمايتك،"], [1443.0, "وهذا لا يجوز؛ لأنّ الحماية أمرٌ تدبيريٌّ كونيّ،"], [1447.4, "أو مشيئةٌ كونيّة. فإمّا أن تقول:"], [1450.2, "«أنا في جوار الله وحده»،"], [1452.2, "أو تقول: «في جوار الله ثم جوارك»."], [1455.0, "وكذلك أيضًا: «أنا في وجه الله ووجهك»،"], [1459.7, "وهي من العبارات التي فيها نوعُ استجارة،"], [1466.0, "استجارة، فهذا لا يجوز؛"], [1467.8, "إمّا أن تقول: «أنا في وجه الله وحده»،"], [1471.2, "أي الله يحميني ويُجيرني،"], [1473.0, "أو تقول على الأقلّ:"], [1474.5, "«أنا في وجه الله ثم في وجهك»."]], "tr": [[1435.0, "Aynı şekilde \"Ben Allah'ın ve senin civarındayım (korumandayım)\" demeleri, yani Allah'ın ve senin himayendeyim demeleri de caiz değildir;"], [1443.0, "çünkü koruma kevnî bir tedbir işi veya kevnî bir meşîettir."], [1447.4, "Ya \"Ben yalnız Allah'ın civarındayım\" ya da \"Allah'ın, sonra senin civarındayım\" dersin."], [1452.2, "Aynı şekilde \"Ben Allah'ın ve senin yüzüne (sığındım)\" (demek de böyledir);"], [1459.7, "bu, içinde bir tür sığınma, sığınma olan ifadelerdendir;"], [1466.0, "bu caiz değildir. Ya \"Ben yalnız Allah'ın yüzüne (sığındım)\", yani beni Allah korur ve bana O aman verir, dersin ya da en azından \"Ben Allah'ın, sonra senin yüzüne (sığındım)\" dersin."]]}, {"reader": false, "ar": [[1477.0, "وكذلك أيضًا قولهم: «أنا معتمدٌ على الله وعليك»،"], [1484.0, "وكلُّ ذلك لا يجوز؛"], [1486.0, "فإمّا أن تقول: «أنا معتمدٌ على الله وحده»،"], [1490.0, "أو على الأقلّ: «معتمدٌ على الله ثم عليك»."], [1494.0, "فأيُّ عبارةٍ توهم تشريكَ الخالق والمخلوق في هذا الأمر الكوني والتدبير الكوني فإنها لا تجوز."]], "tr": [[1477.0, "Aynı şekilde \"Ben Allah'a ve sana dayanıyorum\" demeleri de böyledir;"], [1484.0, "bunların hepsi caiz değildir. Ya \"Ben yalnız Allah'a dayanıyorum\" ya da en azından \"Allah'a, sonra sana dayanıyorum\" dersin."], [1494.0, "Bu kevnî iş ve kevnî tedbirde Hâlık ile mahlûkun ortak kılındığı vehmini veren her ifade caiz değildir."]]}]}, {"ts": "25:02", "title": "4. Külliye (devam): ﴿حَسْبُكَ اللَّهُ وَمَنِ اتَّبَعَكَ﴾ ayeti", "paras": [{"reader": false, "ar": [[1502.0, "فإمّا أن تُفرد الله عز وجل بهذا الأمر وحده،"], [1505.0, "أو تعطف الخالقَ على المخلوق <span class=\"note\">(kastedilen: mahlûku Hâlık'a)<\/span> بحرفٍ يقتضي التعقيبَ بمُهلة،"], [1511.0, "وهو حرف «ثم». فإن قلتَ:"], [1513.8, "وكيف نصنع بقول الله عز وجل:"], [1516.0, "<span class=\"ayah\">﴿يَا أَيُّهَا النَّبِيُّ حَسْبُكَ اللَّهُ وَمَنِ اتَّبَعَكَ مِنَ الْمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[الأنفال: ٦٤]<\/span>،"], [1522.0, "يعني أنّ... أنّ الله والمؤمنين هم حسبُك؟"]], "tr": [[1502.0, "Ya bu işte yalnız Allah Azze ve Celle'yi tekleştirirsin, ya da Hâlık'ı mahlûka <span class=\"note\">(kastedilen: mahlûku Hâlık'a)<\/span> mühletli bir takip (ardından ve aralıklı gelme) gerektiren bir harfle atfedersin;"], [1511.0, "o da \"sümme\" (sonra) harfidir."], [1513.8, "Eğer \"Allah Azze ve Celle'nin şu sözünü ne yapacağız?\" dersen:"], [1516.0, "<span class=\"ayah\">﴿Ey Peygamber! Sana ve sana uyan mü'minlere Allah yeter﴾<\/span> [Enfâl 64] —yani (sanki)..."], [1522.0, "Allah ve mü'minler sana yeterler (anlamında)?"]]}, {"reader": false, "ar": [[1527.0, "فالجواب: إنّ هذا من الفهم الغلط في كتاب الله عز وجل؛"], [1533.0, "بل اللهُ هو حسبُ الطائفتين."], [1536.0, "يعني: كما أنّ الله عز وجل حسبُك يا محمد،"], [1541.0, "فكذلك هو حسبُ أتباعك من المؤمنين؛"], [1544.0, "كقول الشاعر: «فحسبُك والضحّاكَ سيفٌ مهنّدُ»،"], [1549.0, "يعني: أنت والضحاك يكفيكم سيفٌ واحد."], [1553.0, "فإذًا الله عز وجل حسبُ الطائفتين،"], [1557.0, "حسبُ الطائفتين؛ فالله يكفي نبيَّه،"], [1560.7, "ويكفي أيضًا مَن تبعه من المؤمنين."]], "tr": [[1527.0, "Cevap şudur: Bu, Allah Azze ve Celle'nin Kitabı'nı yanlış anlamaktandır."], [1527.0, "Bilakis Allah, iki topluluğun da yeterlisidir."], [1536.0, "Yani ey Muhammed, Allah Azze ve Celle sana yettiği gibi, sana uyan mü'minlere de O yeter."], [1541.0, "Şairin şu sözü gibi: «Sana ve Dahhâk'a Hint işi bir kılıç yeter.» Yani sen ve Dahhâk, size tek bir kılıç yeter."], [1549.0, "Demek ki Allah Azze ve Celle iki topluluğun da yeterlisidir, iki topluluğun da yeterlisi."], [1557.0, "Allah Peygamberine yeter, ona uyan mü'minlere de yeter."]]}]}, {"ts": "26:04", "title": "5. ve 6. Külliye: Her müşrik kâfirdir, tersi değil; her tendîd şirk, her cuhûd küfürdür", "paras": [{"reader": false, "ar": [[1564.0, "ومن الكلّيّات أيضًا: <b>كلُّ مشركٍ فكافرٌ ولا عكس.<\/b> كلُّ مشركٍ فكافرٌ ولا عكس."], [1577.0, "والكلّيّة التي بعدها: كلُّ تنديدٍ فشركٌ،"], [1588.3, "وكلُّ جحودٍ فكفر. كلُّ تنديدٍ فشرك،"], [1595.3, "وكلُّ جحودٍ فكفر. أُعيد الكلّيّتين:"], [1601.0, "الكلّيّة ـ كم رقمها؟ ـ الخامسة:"], [1607.0, "كلُّ شركٍ فكفرٌ ولا عكس."], [1612.0, "والكلّيّة التي بعدها: كلُّ تنديدٍ فشرك، وكلُّ جحودٍ فكفر."]], "tr": [[1564.0, "Külliyelerden biri de şudur: 5."], [1564.0, "külliye: Her müşrik kâfirdir; tersi değil. Her müşrik kâfirdir;"], [1564.0, "tersi değil. Ondan sonraki külliye:"], [1577.0, "<b>6. külliye: Her tendîd (Allah'a denk tutma) şirktir, her cuhûd (inkâr) küfürdür.<\/b> Her tendîd şirktir, her cuhûd küfürdür."], [1595.3, "İki külliyeyi tekrar ediyorum: Külliye —numarası kaç?— beşinci:"], [1607.0, "Her şirk küfürdür; tersi değil."], [1612.0, "Ondan sonraki külliye: Her tendîd şirktir, her cuhûd küfürdür."]]}, {"reader": false, "ar": [[1622.0, "أقول وبالله التوفيق: وهاتان الكلّيّتان تبيّن لك العلاقة بين الكفر والشرك؛"], [1634.0, "وذلك لأنّ لفظَي الكفر والشرك إمّا أن يَرِدا في نصٍّ جميعًا،"], [1642.0, "وإمّا أن ينفردا، فيُذكر الكفر وحده أو الشرك وحده."], [1647.0, "فكلُّ نصٍّ ذُكر فيه الكفر وحده فإنّ الشرك يدخل معه،"], [1653.0, "كقول الله عز وجل:"], [1655.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ كَفَرُوا بِآيَاتِنَا﴾<\/span> <span class=\"ref\">[النساء: ٥٦]<\/span>،"], [1658.0, "أي: وأشركوا. وقولِ الله عز وجل:"], [1663.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ لَا يَغْفِرُ أَن يُشْرَكَ بِهِ﴾<\/span> <span class=\"ref\">[النساء: ٤٨]<\/span>،"], [1666.0, "أي: وأن يُكفَر به."]], "tr": [[1622.0, "Tevfik Allah'tandır, derim ki: Bu iki külliye sana küfür ile şirk arasındaki ilişkiyi açıklar."], [1622.0, "Çünkü küfür ve şirk lafızları ya bir nasta birlikte gelir ya da ayrı ayrı gelir;"], [1634.0, "yani ya yalnız küfür ya da yalnız şirk zikredilir."], [1642.0, "Yalnız küfrün zikredildiği her nasta şirk de onunla birlikte (anlama) girer."], [1647.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1655.0, "<span class=\"ayah\">﴿Şüphesiz ayetlerimizi inkâr edenler﴾<\/span> [Nisâ 56], yani ve şirk koşanlar."], [1658.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [1663.0, "<span class=\"ayah\">﴿Şüphesiz Allah kendisine şirk koşulmasını bağışlamaz﴾<\/span> [Nisâ 48], yani ve kendisine küfredilmesini."]]}, {"reader": false, "ar": [[1668.0, "فمتى ما ذُكر الشرك وحده في القرآن دخل معه الكفر تبعًا،"], [1673.0, "ومتى ما ذُكر الكفر وحده في القرآن دخل معه الشرك تبعًا."], [1678.0, "ولكن إذا ذُكرا في نصٍّ ـ إذا ذُكرا في نصٍّ ـ فحينئذٍ يكون الكفرُ معناه الجحود؛"], [1688.0, "فكلُّ جحودٍ فهو كفر،"], [1691.0, "فرُكن الكفر هو الجحود:"], [1694.0, "فإن كان الجحودَ المطلق فهو الكفر الأكبر،"], [1697.0, "وإن كان مطلقَ الجحود فهو الكفر الأصغر."]], "tr": [[1668.0, "Kur'an'da yalnız şirk zikredildiğinde küfür de ona tâbi olarak girer;"], [1673.0, "Kur'an'da yalnız küfür zikredildiğinde şirk de ona tâbi olarak girer."], [1678.0, "Fakat bir nasta (birlikte) zikredildiklerinde —bir nasta zikredildiklerinde— o zaman küfrün anlamı cuhûd olur."], [1691.0, "Her cuhûd küfürdür; küfrün rüknü cuhûddur."], [1694.0, "Eğer cuhûd-ı mutlak ise büyük küfürdür;"], [1697.0, "mutlak-ı cuhûd ise küçük küfürdür."]]}, {"reader": false, "ar": [[1700.0, "وأمّا الشرك فيكون معناه التنديدَ والمساواة؛"], [1707.0, "فإن كانت التنديدَ والمساواةَ المطلقة فشركٌ أكبر،"], [1711.0, "وإن كان مطلقَ التنديد ومطلقَ المساواة فهي الشرك الأصغر."], [1717.0, "فقيامُ الكفر على الجحود،"], [1719.7, "ومبنى الشرك على المساواة والتنديد،"], [1723.0, "كقول الله عز وجل:"], [1725.0, "<span class=\"ayah\">﴿إِن كُنَّا لَفِي ضَلَالٍ مُّبِينٍ ۝ إِذْ نُسَوِّيكُم بِرَبِّ الْعَالَمِينَ﴾<\/span> <span class=\"ref\">[الشعراء: ٩٧–٩٨]<\/span>،"], [1732.0, "ويقول الله عز وجل:"], [1734.0, "<span class=\"ayah\">﴿فَلَا تَجْعَلُوا لِلَّهِ أَندَادًا وَأَنتُمْ تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[البقرة: ٢٢]<\/span>،"], [1737.0, "<span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>، أي: مثيلًا ونظيرًا."]], "tr": [[1700.0, "Şirkin anlamı ise tendîd ve eşit tutmadır."], [1700.0, "Eğer tendîd-i mutlak ve tam eşit tutma ise büyük şirktir;"], [1707.0, "mutlak-ı tendîd ve mutlak-ı eşit tutma (bir miktar denk tutma) ise küçük şirktir."], [1717.0, "Küfür cuhûd üzerine, şirk ise eşit tutma ve tendîd üzerine kuruludur."], [1723.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1725.0, "<span class=\"ayah\">﴿Biz gerçekten apaçık bir sapıklık içindeydik; çünkü sizi âlemlerin Rabbi ile bir tutuyorduk﴾<\/span> [Şuarâ 97–98]."], [1732.0, "Allah Azze ve Celle şöyle de buyurur:"], [1734.0, "<span class=\"ayah\">﴿Bile bile Allah'a denkler koşmayın﴾<\/span> [Bakara 22]."], [1734.0, "<span class=\"ayah\">﴿O'nun adaşı (dengi) olan birini biliyor musun?﴾<\/span> [Meryem 65], yani benzeri ve dengi."]]}, {"reader": false, "ar": [[1741.0, "فمتى ما كان الذنب مقرونًا بالتنديد فهو شرك،"], [1745.0, "ومتى كان الذنب غيرَ مقرونٍ بالتنديد فهو ـ يعني ـ ومتى كان الذنب مقرونًا بالجحود فهو كفر."], [1754.0, "وبناءً على ذلك فكلُّ مشركٍ فإنه لا بدّ وأن يكون كافرًا،"], [1760.0, "لأنّ حقيقة الشرك هي الخروج من الملّة،"], [1763.5, "والخروجُ من الملّة هو الكفر."], [1766.0, "ولكن ليس كلُّ من وقع في الكفر الأكبر يكون مشركًا؛"], [1770.0, "وذلك لأنّ الذنب قد يكون جحودًا،"], [1772.4, "ليس تنديدًا ولا مساواة."]], "tr": [[1741.0, "Günah tendîd ile birlikte ise şirktir;"], [1741.0, "günah tendîd ile birlikte değilse o —yani— günah cuhûd ile birlikte ise küfürdür."], [1745.0, "Buna göre her müşrikin mutlaka kâfir olması gerekir;"], [1754.0, "çünkü şirkin hakikati dinden çıkmaktır, dinden çıkmak da küfürdür."], [1763.5, "Fakat büyük küfre düşen herkes müşrik olmaz;"], [1766.0, "çünkü günah, tendîd ve eşit tutma olmayan bir cuhûd olabilir."]]}, {"reader": false, "ar": [[1774.0, "كمَن سبّ الله عز وجل ـ والعياذ بالله ـ فإنه كافر،"], [1778.0, "ولكن ليس ثَمّة تنديدٌ ولا مساواة."], [1781.0, "وكذلك أيضًا مَن استهزأ بشيءٍ ممّا جاء به النبي ﷺ فإنه يُعتبر كافرًا،"], [1788.7, "ولكن ليس ثَمّة تنديدٌ ولا مساواة."], [1792.0, "وكمَن ترك الصلاة التركَ المطلقَ الدائم <span class=\"q\">؟ 29:52<\/span>،"], [1796.2, "فإنه يوصف بأنه كافر،"], [1799.0, "ولكن ليس ثَمّة تنديدٌ ولا مساواة."]], "tr": [[1774.0, "Allah Azze ve Celle'ye söven kişi gibi —Allah'a sığınırız—;"], [1774.0, "o kâfirdir, fakat orada tendîd de eşit tutma da yoktur."], [1781.0, "Aynı şekilde Nebî ﷺ'in getirdiği şeylerden bir şeyle alay eden kişi kâfir sayılır, fakat orada tendîd de eşit tutma da yoktur."], [1792.0, "Namazı sürekli terk-i mutlak ile terk eden kişi gibi <span class=\"q\">؟<\/span>;"], [1792.0, "o kâfir olarak nitelenir, fakat orada tendîd de eşit tutma da yoktur."]]}]}, {"ts": "30:02", "title": "5. ve 6. Külliye (devam): Küfür ile şirk arasındaki ilişki", "paras": [{"reader": false, "ar": [[1802.0, "وكذلك من اعتقد أنّ في وُسعه الخروجَ عن شريعة محمد ﷺ فإنه كافر،"], [1810.0, "ولكن ليس ثَمّة تنديدٌ ولا مساواة؛"], [1813.0, "مع أنّ النهاية واحدة،"], [1814.8, "وهي الخروج من الملّة،"], [1816.7, "والخلودُ الأبديّ المطلق في النار."], [1819.0, "ولكن لا بدّ في الكلام عليهما أن نحرّر بين المصطلحين،"], [1824.0, "كما حرّرنا بين مصطلح الإيمان والإسلام والعلاقةِ بينهما."]], "tr": [[1802.0, "Aynı şekilde Muhammed ﷺ'in şeriatından çıkmanın kendi imkânında olduğuna inanan kişi de kâfirdir, fakat orada tendîd de eşit tutma da yoktur."], [1813.0, "Bununla birlikte sonuç birdir: Dinden çıkmak ve ateşte ebedî, mutlak olarak kalmak."], [1816.7, "Fakat bu ikisi hakkında konuşurken iki terimi netleştirmemiz gerekir;"], [1819.0, "tıpkı iman ve İslâm terimlerini ve aralarındaki ilişkiyi netleştirdiğimiz gibi."]]}, {"reader": false, "ar": [[1830.0, "فإذا قيل لك: ما العلاقة بين الكفر والشرك؟"], [1833.0, "تقول: هي من الألفاظ التي إذا افترقت اجتمعت،"], [1837.0, "وإذا اجتمعت افترقت. وأيضًا العلاقة الثانية:"], [1842.0, "أنّ بينهما عمومًا وخصوصًا من وجه؛"], [1846.0, "فكلُّ مشركٍ فإنه لا بدّ أن يكون كافرًا ـ هذه جهةُ عموم ـ ولكن ليس كلُّ كافرٍ لا بدّ أن يكون مشركًا ـ وهذه جهةُ الخصوص ـ أي بينهما عمومٌ وخصوص،"], [1861.0, "بينهما عمومٌ وخصوص. والله أعلم."]], "tr": [[1830.0, "Sana \"Küfür ile şirk arasındaki ilişki nedir?\" denirse şöyle dersin:"], [1833.0, "Bunlar, ayrı zikredildiklerinde birbirinin anlamını kapsayan, birlikte zikredildiklerinde ise anlamları ayrışan lafızlardandır."], [1842.0, "İkinci ilişki de şudur: Aralarında umûm ve husûs min vech vardır."], [1846.0, "Her müşrik mutlaka kâfirdir —bu, umum yönüdür—;"], [1846.0, "fakat her kâfirin mutlaka müşrik olması gerekmez —bu da husus yönüdür—."], [1846.0, "Yani aralarında umum ve husus vardır, aralarında umum ve husus vardır. Allah en iyisini bilir."]]}]}, {"ts": "31:05", "title": "7. Külliye: Delillerde küfür ve şirkle birlikte gelen her habûttan tam habût kastedilir", "paras": [{"reader": false, "ar": [[1865.0, "ومن الكلّيّات أيضًا: <b>كلُّ حبوطٍ في الأدلة مقرونٍ بالكفر والشرك فيُراد به الحبوطُ المطلق.<\/b> <span class=\"note\">(يكررها)<\/span> وهذا مصطلح القرآن من أوله إلى آخره،"], [1886.8, "إلا في آيةٍ واحدة،"], [1903.0, "في قول الله عز وجل:"], [1905.7, "<span class=\"ayah\">﴿أَن تَحْبَطَ أَعْمَالُكُمْ وَأَنتُمْ لَا تَشْعُرُونَ﴾<\/span> <span class=\"ref\">[الحجرات: ٢]<\/span>؛"], [1909.0, "فيُراد بالحبوط هنا فقط مطلقُ الحبوط،"], [1913.4, "لا الحبوطُ المطلق. لأنّ رفع صوت الإنسان على صوت النبي ﷺ لا يوجب الكفر،"], [1922.0, "وإنما يوجب مطلقَ الحبوط فقط."]], "tr": [[1865.0, "Külliyelerden biri de şudur: 7."], [1865.0, "külliye: Delillerde küfür ve şirkle birlikte gelen her habûttan (amellerin boşa çıkmasından) habût-ı mutlak (tam boşa çıkma) kastedilir. (Tekrar ediyor.) Bu, baştan sona Kur'an'ın ıstılahıdır;"], [1886.8, "yalnız bir ayet hariç. O da Allah Azze ve Celle'nin şu sözüdür:"], [1905.7, "<span class=\"ayah\">﴿Siz farkında olmadan amelleriniz boşa gider﴾<\/span> [Hucurât 2]."], [1905.7, "Burada habûttan yalnızca mutlak-ı habût (kısmî boşa çıkma) kastedilir, habût-ı mutlak değil."], [1913.4, "Çünkü insanın sesini Nebî ﷺ'in sesinin üstüne yükseltmesi küfrü gerektirmez; sadece mutlak-ı habûtu gerektirir."]]}, {"reader": false, "ar": [[1925.0, "وعلى ذلك دلّت الأدلة،"], [1928.0, "كقول الله عز وجل:"], [1929.7, "<span class=\"ayah\">﴿لَئِنْ أَشْرَكْتَ لَيَحْبَطَنَّ عَمَلُكَ﴾<\/span> <span class=\"ref\">[الزمر: ٦٥]<\/span>،"], [1931.3, "فهو حبوطٌ مقرونٌ بالشرك،"], [1933.0, "فيُراد به الحبوط المطلق."], [1935.0, "وقولِ الله عز وجل:"], [1937.4, "<span class=\"ayah\">﴿وَمَن يَكْفُرْ بِالْإِيمَانِ فَقَدْ حَبِطَ عَمَلُهُ﴾<\/span> <span class=\"ref\">[المائدة: ٥]<\/span>،"], [1941.0, "فهو حبوطٌ مقرونٌ بالكفر،"], [1943.0, "فيُراد به الحبوط المطلق."], [1945.0, "وكقوله عز وجل: <span class=\"ayah\">﴿أُولَٰئِكَ الَّذِينَ لَيْسَ لَهُمْ فِي الْآخِرَةِ إِلَّا النَّارُ ۖ وَحَبِطَ مَا صَنَعُوا﴾<\/span> <span class=\"ref\">[هود: ١٦]<\/span>،"], [1951.0, "فهو حبوطٌ مقرونٌ بالشرك،"], [1953.5, "ويُراد به الحبوط المطلق."]], "tr": [[1925.0, "Deliller buna delâlet etmiştir. Allah Azze ve Celle'nin şu sözü gibi:"], [1929.7, "<span class=\"ayah\">﴿Andolsun, eğer şirk koşarsan amelin boşa gider﴾<\/span> [Zümer 65]."], [1931.3, "Bu, şirkle birlikte gelen bir habûttur;"], [1933.0, "ondan habût-ı mutlak kastedilir. Allah Azze ve Celle'nin şu sözü de böyledir:"], [1937.4, "<span class=\"ayah\">﴿Kim imanı inkâr ederse ameli boşa gitmiştir﴾<\/span> [Mâide 5]."], [1937.4, "Bu, küfürle birlikte gelen bir habûttur;"], [1943.0, "ondan habût-ı mutlak kastedilir. Yüce Allah'ın şu sözü gibi:"], [1945.0, "<span class=\"ayah\">﴿Onlar, âhirette kendileri için ateşten başka bir şey olmayanlardır; yaptıkları şeyler boşa gitmiştir﴾<\/span> [Hûd 16]."], [1945.0, "Bu, şirkle birlikte gelen bir habûttur; ondan habût-ı mutlak kastedilir."]]}, {"reader": false, "ar": [[1956.0, "وكذلك قول الله عز وجل:"], [1958.6, "<span class=\"ayah\">﴿وَالَّذِينَ كَذَّبُوا بِآيَاتِنَا وَلِقَاءِ الْآخِرَةِ حَبِطَتْ أَعْمَالُهُمْ﴾<\/span> <span class=\"ref\">[الأعراف: ١٤٧]<\/span>،"], [1962.2, "وهذا حبوطٌ مقرونٌ بالكفر،"], [1964.3, "لأنّ الكفر مبناه على الجحد والتكذيب،"], [1967.4, "فهو الحبوط المطلق. وكقول الله عز وجل:"], [1971.6, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ يَكْفُرُونَ بِآيَاتِ اللَّهِ وَيَقْتُلُونَ النَّبِيِّينَ بِغَيْرِ حَقٍّ وَيَقْتُلُونَ الَّذِينَ يَأْمُرُونَ بِالْقِسْطِ مِنَ النَّاسِ فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ ۝ أُولَٰئِكَ الَّذِينَ حَبِطَتْ أَعْمَالُهُمْ فِي الدُّنْيَا وَالْآخِرَةِ وَمَا لَهُم مِّن نَّاصِرِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ٢١–٢٢]<\/span> <span class=\"note\">(Şeyh «أولئك حبطت أعمالهم» diyor; «الذين» okunmuyor)<\/span>،"], [1990.0, "فهو حبوطٌ مقرونٌ بالكفر،"], [1992.5, "فيُراد به الحبوط المطلق."]], "tr": [[1956.0, "Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [1958.6, "<span class=\"ayah\">﴿Ayetlerimizi ve âhirete kavuşmayı yalanlayanların amelleri boşa gitmiştir﴾<\/span> [A'râf 147]."], [1962.2, "Bu, küfürle birlikte gelen bir habûttur;"], [1964.3, "çünkü küfür cahd (inkâr) ve tekzip üzerine kuruludur."], [1971.6, "Dolayısıyla bu, habût-ı mutlaktır. Allah Azze ve Celle'nin şu sözü gibi:"], [1971.6, "<span class=\"ayah\">﴿Allah'ın ayetlerini inkâr edenleri, peygamberleri haksız yere öldürenleri ve insanlardan adaleti emredenleri öldürenleri elem verici bir azapla müjdele. İşte onlar, amelleri dünyada ve âhirette boşa gitmiş olanlardır; onların hiçbir yardımcısı da yoktur﴾<\/span> [Âl-i İmrân 21–22]."], [1971.6, "Bu, küfürle birlikte gelen bir habûttur; ondan habût-ı mutlak kastedilir."]]}, {"reader": false, "ar": [[1995.0, "وكذلك قول الله عز وجل:"], [1997.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ كَفَرُوا وَصَدُّوا عَن سَبِيلِ اللَّهِ وَشَاقُّوا الرَّسُولَ مِن بَعْدِ مَا تَبَيَّنَ لَهُمُ الْهُدَىٰ لَن يَضُرُّوا اللَّهَ شَيْئًا وَسَيُحْبِطُ أَعْمَالَهُمْ﴾<\/span> <span class=\"ref\">[محمد: ٣٢]<\/span>،"], [2007.0, "فهو حبوطٌ مقرونٌ بالشرك،"], [2009.0, "فيُراد به الحبوط المطلق."], [2011.0, "وكذلك قول الله عز وجل:"], [2013.0, "<span class=\"ayah\">﴿وَلَوْ أَشْرَكُوا لَحَبِطَ عَنْهُم مَّا كَانُوا يَعْمَلُونَ﴾<\/span> <span class=\"ref\">[الأنعام: ٨٨]<\/span>،"], [2016.0, "فيُراد به الحبوط المطلق."], [2018.0, "وقولُ الله عز وجل:"], [2019.0, "<span class=\"ayah\">﴿وَمَن يَرْتَدِدْ مِنكُمْ عَن دِينِهِ فَيَمُتْ وَهُوَ كَافِرٌ فَأُولَٰئِكَ حَبِطَتْ﴾<\/span> <span class=\"ref\">[البقرة: ٢١٧]<\/span>،"], [2024.0, "وأيضًا يُراد به الحبوط المطلق."]], "tr": [[1995.0, "Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [1997.0, "<span class=\"ayah\">﴿Şüphesiz küfredenler, Allah'ın yolundan alıkoyanlar ve kendilerine hidayet apaçık belli olduktan sonra Peygamber'e karşı gelenler Allah'a hiçbir şekilde zarar veremezler; O, onların amellerini boşa çıkaracaktır﴾<\/span> [Muhammed 32]."], [2007.0, "Bu, şirkle birlikte gelen bir habûttur;"], [2009.0, "ondan habût-ı mutlak kastedilir. Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [2013.0, "<span class=\"ayah\">﴿Eğer şirk koşsalardı, yaptıkları şeyler boşa giderdi﴾<\/span> [En'âm 88];"], [2016.0, "ondan da habût-ı mutlak kastedilir."], [2018.0, "Allah Azze ve Celle'nin şu sözü:"], [2019.0, "<span class=\"ayah\">﴿Sizden kim dininden döner de kâfir olarak ölürse, işte onların (amelleri) boşa gitmiştir﴾<\/span> [Bakara 217];"], [2024.0, "ondan da habût-ı mutlak kastedilir."]]}, {"reader": false, "ar": [[2026.0, "وقولُ الله عز وجل:"], [2028.0, "<span class=\"ayah\">﴿ذَٰلِكَ بِأَنَّهُمْ كَرِهُوا مَا أَنزَلَ اللَّهُ فَأَحْبَطَ أَعْمَالَهُمْ﴾<\/span> <span class=\"ref\">[محمد: ٩]<\/span>،"], [2034.0, "ويُراد به الحبوط المطلق."], [2036.0, "وهكذا دواليك، إلا في قول الله عز وجل:"], [2039.0, "<span class=\"ayah\">﴿أَن تَحْبَطَ أَعْمَالُكُمْ وَأَنتُمْ لَا تَشْعُرُونَ﴾<\/span> <span class=\"ref\">[الحجرات: ٢]<\/span>،"], [2044.0, "فيُراد به مطلقُ الحبوط لا الحبوطُ المطلق."]], "tr": [[2026.0, "Allah Azze ve Celle'nin şu sözü:"], [2028.0, "<span class=\"ayah\">﴿Bu, onların Allah'ın indirdiğini beğenmemeleri sebebiyledir; O da amellerini boşa çıkarmıştır﴾<\/span> [Muhammed 9];"], [2034.0, "ondan da habût-ı mutlak kastedilir."], [2036.0, "Durum hep böyledir; yalnız Allah Azze ve Celle'nin şu sözü hariç:"], [2039.0, "<span class=\"ayah\">﴿Siz farkında olmadan amelleriniz boşa gider﴾<\/span> [Hucurât 2];"], [2039.0, "ondan habût-ı mutlak değil, mutlak-ı habût kastedilir."]]}]}, {"ts": "34:05", "title": "8. Külliye: Büyük günahla birlikte gelen her habûttan kısmî habût kastedilir", "paras": [{"reader": false, "ar": [[2046.0, "وهو الكلّيّة التي بعدها:"], [2048.0, "<b>كلُّ حبوطٍ مقرونٍ بالكبيرة فيُراد به مطلقُ الحبوط لا الحبوطُ المطلق.<\/b> ـ كم رقمها؟"], [2058.0, "ـ كلُّ حبوطٍ مقرونٍ بالكبيرة فيُراد به مطلقُ الحبوط لا الحبوطُ المطلق. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2046.0, "Bu da ondan sonraki külliyedir:"], [2046.0, "<b>8. külliye: Büyük günahla birlikte gelen her habûttan habût-ı mutlak değil, mutlak-ı habût (kısmî boşa çıkma) kastedilir.<\/b> —Numarası kaç?— Büyük günahla birlikte gelen her habûttan habût-ı mutlak değil, mutlak-ı habût kastedilir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2074.0, "أقول وبالله التوفيق: وذلك لأننا ـ معاشرَ أهل السنة والجماعة ـ نعتقد أنّ الكبائر لا تنافي أصلَ الدين والإيمان،"], [2087.3, "وإنما تنافي كمالَه الواجب."], [2090.0, "فإذا وقع الإنسان في شيءٍ من الكبائر فإنّ إيمانه لا ينتقض كلُّه،"], [2096.0, "وإنما ينقص من مقداره الواجب ما يوجب عليه العقوبةَ يوم القيامة."], [2103.0, "فيكون مرتكبُ الكبيرة عندنا في الدنيا مؤمنًا،"], [2106.0, "إلا أنه ناقصُ الإيمان،"], [2108.2, "وفي الآخرة تحت مشيئة الله عز وجل."]], "tr": [[2074.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi, biz Ehl-i Sünnet ve'l-Cemaat topluluğunun, büyük günahların dinin ve imanın aslına aykırı olmadığına, sadece onun vâcib kemâline aykırı olduğuna inanmamızdır."], [2090.0, "İnsan büyük günahlardan birine düştüğünde imanının tamamı bozulmaz;"], [2096.0, "sadece vâcib miktarından, kıyamet günü kendisine cezayı gerektirecek kadarı eksilir."], [2103.0, "Bize göre büyük günah işleyen kişi dünyada mü'mindir, ancak imanı eksiktir;"], [2106.0, "âhirette ise Allah Azze ve Celle'nin meşîeti altındadır."]]}, {"reader": false, "ar": [[2112.0, "فإذا رأيتَ الحبوطَ مقرونًا بشيءٍ من الكبائر،"], [2118.0, "فإيّاك أن تفهم منه الحبوطَ المطلق،"], [2121.0, "وإنما تفهم منه مطلقَ الحبوط؛"], [2124.0, "كقول الله عز وجل فيمن يرفع صوته على صوت النبي ﷺ:"], [2131.0, "<span class=\"ayah\">﴿أَن تَحْبَطَ أَعْمَالُكُمْ وَأَنتُمْ لَا تَشْعُرُونَ﴾<\/span> <span class=\"ref\">[الحجرات: ٢]<\/span>،"], [2134.0, "أي بمطلق الحبوط لا الحبوطِ المطلق."]], "tr": [[2112.0, "Habûtu büyük günahlardan biriyle birlikte gördüğünde, ondan habût-ı mutlak anlamaktan sakın;"], [2118.0, "ondan ancak mutlak-ı habût anlarsın."], [2121.0, "Allah Azze ve Celle'nin, sesini Nebî ﷺ'in sesinin üstüne yükselten kişi hakkındaki şu sözü gibi:"], [2131.0, "<span class=\"ayah\">﴿Siz farkında olmadan amelleriniz boşa gider﴾<\/span> [Hucurât 2];"], [2131.0, "yani habût-ı mutlak ile değil, mutlak-ı habût ile."]]}, {"reader": false, "ar": [[2137.0, "وفي الصحيح من حديث بُريدة أنّ النبي ﷺ قال:"], [2142.5, "«مَن ترك صلاة العصر فقد حبط عمله»."], [2146.0, "وقد اختلف العلماء ـ رحمهم الله تعالى ـ في الحبوط الوارد هنا،"], [2151.0, "لكنّ الأصحّ أن نقول:"], [2153.2, "هو مطلقُ الحبوط لا الحبوطُ المطلق."], [2156.0, "والذين قالوا بمطلق الحبوط اختلفوا،"], [2159.0, "والأصحُّ عندي: أي عملُ يومه؛"], [2161.0, "أي أنّ جميع ما عمله من الحسنات والطاعات في هذا اليوم فإنها تُعتبر حابطة،"], [2169.0, "لأنّ آخر الواجبات في اليوم إنما هي صلاة العصر،"], [2173.0, "ثم يستقبل الإنسان ليلةَ يومٍ جديد."]], "tr": [[2137.0, "Sahîh'te Büreyde'nin hadisinde Nebî ﷺ şöyle buyurmuştur:"], [2137.0, "«Kim ikindi namazını terk ederse ameli boşa gitmiştir.» Âlimler —Allah onlara rahmet etsin— burada geçen habût hakkında ihtilaf etmişlerdir."], [2151.0, "Fakat en doğrusu, bunun habût-ı mutlak değil, mutlak-ı habût olduğunu söylememizdir."], [2156.0, "Mutlak-ı habût diyenler de ihtilaf etmişlerdir."], [2159.0, "Bana göre en doğrusu: (Boşa giden) o günün amelidir;"], [2161.0, "yani o gün yaptığı bütün iyilikler ve taatler boşa gitmiş sayılır."], [2169.0, "Çünkü gündeki vâciblerin sonuncusu ikindi namazıdır;"], [2173.0, "sonra insan yeni bir günün gecesini karşılar."]]}, {"reader": false, "ar": [[2177.0, "والمتقرّر في القواعد أنّ الأمور بخواتيمها،"], [2182.0, "يعني أنّ الأعمال بالخواتيم؛"], [2184.0, "فإحسانُك في الخاتمة قد يكون مكفِّرًا لإساءة الابتداء،"], [2191.0, "وإساءتُك في الخاتمة قد يكون محبطًا لحسنة الابتداء."], [2196.0, "فالعبرة بالخواتيم، كما قال النبي ﷺ في حديث سهل بن سعد في الصحيحين:"], [2204.0, "«إنّ الرجل ليعمل عملَ أهل النار وإنه من أهل الجنة، ويعمل عملَ أهل الجنة وإنه من أهل النار... وإنما الأعمال بالخواتيم»."]], "tr": [[2177.0, "Kaidelerde yerleşik olan, işlerin sonlarına göre olduğudur;"], [2182.0, "yani ameller sonlarına göredir. Sondaki iyiliğin, başlangıçtaki kötülüğe kefaret olabilir;"], [2184.0, "sondaki kötülüğün de başlangıçtaki iyiliği boşa çıkarabilir."], [2191.0, "İtibar sonlaradır. Nebî ﷺ'in, Sahîhayn'da Sehl b."], [2196.0, "Sa'd'ın hadisinde buyurduğu gibi: «Kişi cehennem ehlinin amelini işler, hâlbuki o cennet ehlindendir; cennet ehlinin amelini işler, hâlbuki o cehennem ehlindendir... Ameller ancak sonlarına göredir.»"]]}, {"reader": false, "ar": [[2216.0, "فإذا ختم الإنسانُ يومَه بترك آخر واجبٍ عليه،"], [2221.0, "وأفضلِ فريضةٍ مرّت عليه في اليوم والليلة،"], [2224.0, "فلا جرم أنّ ذلك يكون سببًا لحبوط عمله،"], [2228.0, "ولكن بمطلق الحبوط لا الحبوطِ المطلق."], [2233.0, "ولعلّنا نكتفي بهذا القدر،"], [2234.7, "والله أعلى وأعلم، وصلّى الله وسلّم على نبينا محمد."]], "tr": [[2216.0, "İnsan gününü, üzerindeki son vâcibi ve gece-gündüzde karşısına çıkan en faziletli farzı terk ederek bitirirse, şüphesiz bu, amelinin boşa gitmesine sebep olur;"], [2224.0, "fakat habût-ı mutlak ile değil, mutlak-ı habût ile."], [2228.0, "Belki bu kadarla yetinelim. Allah en yüce olandır ve en iyisini bilendir."], [2234.7, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
