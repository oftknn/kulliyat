llah ona rahmet etsin— bunların mezhebini açıklarken der ki:"], [2808.4, "\"Cehm'in ve Sâlihî'nin görüşünü söyleyen bu kimseler, Allah'a ve Resûlü'ne sövmenin, teslîsi (üçlemeyi) dile getirmenin ve küfür sözlerinden her kelimenin bâtında küfür olmadığını, fakat zahirde küfre delil olduğunu açıkça söylemişlerdir."], [2815.8, "Buna rağmen bu sövüp hakaret eden kimsenin bâtında Allah'ı bilen, O'nu birleyen ve O'na iman eden biri olmasını caiz görürler."], [2834.0, "Onlara bir nas veya icmâ ile bu kişinin bâtınen ve zahiren kâfir olduğuna dair delil getirildiğinde, 'Bu, o (fiilin) bâtındaki yalanlamayı gerektirdiğini ve imanın da onun yokluğunu gerektirdiğini iktiza eder' derler.\" Sözü bitti; Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2861.0, "وقال الإمامُ الحُميديّ رحمه الله:"], [2865.0, "«أُخبرتُ أنّ قومًا يقولون: إنّ من أقرّ بالصلاة والزكاة والصوم والحجّ، ولم يفعل من ذلك شيئًا حتى يموت، أو يصلّي مستدبرَ القبلة حتى يموت، فهو مؤمنٌ ما لم يكن جاحدًا، إذا كان يُقرّ بالفرائض واستقبال القبلة. فقلتُ: هذا الكفرُ الصُّراح، وخلافُ كتاب الله وسنّة رسوله صلى الله عليه وسلم وفعلِ المسلمين». انتهى كلامُه."]], "tr": [[2861.0, "İmam Humeydî —Allah ona rahmet etsin— der ki:"], [2862.6, "\"Bana bir topluluğun şöyle dediği haber verildi:"], [2865.0, "Namazı, zekâtı, orucu ve haccı ikrar edip ölünceye kadar bunlardan hiçbirini yapmayan ya da ölünceye kadar kıbleye arkasını dönerek namaz kılan kimse, farzları ve kıbleye yönelmeyi ikrar ettiği sürece, inkâr etmedikçe mümindir."], [2885.3, "Ben de dedim ki: Bu apaçık küfürdür;"], [2889.8, "Allah'ın Kitabı'na, Resûlü sallallâhu aleyhi ve sellem'in sünnetine ve Müslümanların uygulamasına aykırıdır.\" Sözü bitti."]]}, {"reader": false, "ar": [[2898.0, "وقال الإمامُ إسحاقُ بن راهويه رحمه الله تعالى:"], [2902.0, "«ممّا أجمعوا على تكفيره، وحكموا عليه كما حكموا على الجاحد: المؤمنُ الذي آمن بالله تعالى وممّا جاء به من عنده، ثم قتل نبيًّا أو أعان على قتله، وإن كان مُقرًّا ويقول: قتلُ الأنبياء محرّم، فهو كافر. وكذلك من شتم نبيًّا أو ردّ عليه قولَه من غير تقيّةٍ أو خوف»."], [2927.0, "قلتُ: فكلُّ هؤلاء أجمع أهلُ السنة على كفرهم بهذه الأفعال،"], [2933.6, "وإن كانوا يُقرّون بوجوبها أو حرمتها في الباطن."]], "tr": [[2898.0, "İmam İshâk b. Râhûye —Allah Teâlâ ona rahmet etsin— der ki:"], [2902.0, "\"Tekfirinde icmâ ettikleri ve inkâr edene hükmettikleri gibi hükmettikleri kimselerden biri şudur:"], [2907.5, "Allah Teâlâ'ya ve O'nun katından gelene iman etmiş olan mümin, sonra bir peygamberi öldürür veya öldürülmesine yardım ederse, ikrar edip 'Peygamberleri öldürmek haramdır' dese bile kâfirdir."], [2918.6, "Aynı şekilde, takiyye veya korku olmaksızın bir peygambere söven veya onun sözünü reddeden de (kâfirdir).\" Derim ki:"], [2927.0, "Bunların hepsinin bu fiiller sebebiyle küfrü üzerinde Ehl-i Sünnet icmâ etmiştir;"], [2932.9, "bâtında bunların vâcip veya haram olduğunu ikrar etseler bile."]]}, {"reader": false, "ar": [[2939.0, "وقال ابنُ سُحنون رحمه الله تعالى:"], [2942.4, "«أجمع العلماءُ على أنّ شاتمَ النبيّ صلى الله عليه وسلم المتنقّصَ له كافر، والوعيدُ جارٍ عليه بعذاب الله له، وحكمُه عند الأمّة القتل، ومن شكّ في كفره وعذابه كفر». انتهى كلامُه."]], "tr": [[2939.0, "İbn Sahnûn —Allah Teâlâ ona rahmet etsin— der ki:"], [2942.4, "\"Âlimler, Peygamber sallallâhu aleyhi ve sellem'e söven ve onu küçümseyenin kâfir olduğu, Allah'ın ona azap edeceğine dair tehdidin onun hakkında geçerli olduğu ve ümmete göre hükmünün öldürülmek olduğu üzerinde icmâ etmiştir."], [2955.0, "Onun küfründen ve azabından şüphe eden de kâfir olur.\" Sözü bitti."]]}, {"reader": false, "ar": [[2961.0, "والخلاصةُ من هذه الكلّيّة:"], [2963.0, "أنّ أهل العلم رحمهم الله تعالى نصّوا على أنّ الكفرَ يُوازن الإيمانَ في الأركان؛"], [2974.0, "فكما أنّ الإيمان يكون بالقلب فكذلك الكفرُ يكون بالقلب،"], [2980.0, "وكما أنّ الإيمان يكون باللسان فكذلك يكون الكفرُ باللسان،"], [2986.0, "وكما أنّ الإيمان يكون بالجوارح والعمل فكذلك أيضًا الكفرُ يكون بالجوارح والعمل."], [2994.0, "فكلُّ من فعل كفرًا فإنّه يُعتبر كافرًا،"], [2999.0, "وإن كان قلبُه لا يزال مصدِّقًا."]], "tr": [[2961.0, "Bu külliyenin özeti şudur: İlim ehli —Allah Teâlâ onlara rahmet etsin— küfrün rükünlerde imana denk olduğunu açıkça belirtmişlerdir."], [2974.0, "İman kalple olduğu gibi küfür de kalple olur;"], [2979.3, "iman dille olduğu gibi küfür de dille olur;"], [2985.3, "iman azalarla ve amelle olduğu gibi küfür de azalarla ve amelle olur."], [2994.0, "Küfür işleyen herkes, kalbi hâlâ tasdik ediyor olsa bile kâfir sayılır."]]}, {"reader": false, "ar": [[3003.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا."]], "tr": [[3003.0, "Allah en yüce olandır ve en iyisini bilendir."], [3004.6, "Allah Peygamberimize salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
