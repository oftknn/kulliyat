<script>
const D={"no": 84, "vid": "9Qfegg98NGA", "title_ar": "الدرس (٨٤) من شرح كليات العقيدة — كليات مرتكب الكبيرة: نفي الإيمان عن فاعل الكبيرة، والكفر بالإيمان، والذنوب منقصة لا ناقضة، وغلاة المرجئة، وحصر الكفر في الجحود", "title_tr": "Şerhu Külliyyâti'l-Akîde — 84. Ders: Büyük Günah İşleyenle İlgili Külliyeler (Büyük Günah İşleyenden İmanın Nefyi; İmanı İnkâr; Günahların İmanı Eksiltip Bozmaması; Mürcie'nin Aşırıları; Küfrü Kalbin İnkârına Hasretmek)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Büyük günah işleyenden imanı nefyeden nas, mutlak imanın nefyidir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.9, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.8, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.1, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [10.0, "أمّا بعد: فلا نزال في شرح الكلّيّات المتعلّقة بمسائل الإيمان ومتعلَّقاته،"], [15.2, "وإذا قلتُ «متعلَّقاته» فأنا أقصد مرتكبَ الكبيرة ومتعلَّقاتِ هذه العقائد."], [20.0, "وعندنا جُمَلٌ من الكلّيّات."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.9, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [11.0, "Bundan sonra: Hâlâ iman meseleleri ve onun taalluklarıyla ilgili külliyelerin şerhindeyiz;"], [15.7, "\"taalluklar\" dediğimde büyük günah işleyeni ve bu akîdelerin taalluklarını kastediyorum. Elimizde birtakım külliyeler var."]]}, {"reader": false, "ar": [[23.0, "الكلّيّة الأولى: <b>كلُّ نصٍّ فيه نفيُ الإيمان عن فاعل الكبيرة فيُراد به نفيُ الإيمان المطلق لا مطلقِ الإيمان.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيده مرّةً ثالثة:"], [48.4, "<b>كلُّ نصٍّ فيه نفيُ الإيمان عن فاعل الكبيرة فيُراد به نفيُ الإيمان المطلق لا مطلقِ الإيمان.<\/b>"]], "tr": [[23.0, "<b>1. külliye: Büyük günah işleyenden imanı nefyeden her nasla, imanın mutlakı değil, mutlak iman nefyedilmek istenir.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [48.4, "<b>1. külliye: Büyük günah işleyenden imanı nefyeden her nasla, imanın mutlakı değil, mutlak iman nefyedilmek istenir.<\/b>"]]}, {"reader": false, "ar": [[55.0, "أقول وبالله التوفيق: وهذا ممّا أجمع عليه أهلُ السنة والجماعة ـ رحم الله أمواتَهم وثبّت أحياءَهم ـ فإنّنا نجد في النصوص،"], [64.6, "كتابًا وسنّةً، أنّ الله عز وجل ينفي الإيمانَ عمّن فعل شيئًا من الكبائر،"], [70.0, "سواءٌ كبيرةُ فعلِ المحظور أو كبيرةُ تركِ المأمور."], [77.0, "فمتى ما رأيتَ النصَّ ينفي الإيمانَ عن شيءٍ من فاعل الكبائر فاعلم أنّه يريد به نفيَ الإيمان المطلق، لا مطلقِ الإيمان."]], "tr": [[55.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'in —Allah onların ölülerine rahmet etsin, dirilerini sabit kılsın— icmâ ettiği şeylerdendir."], [65.3, "Çünkü Kitap ve Sünnet nasslarında, Allah Azze ve Celle'nin büyük günahlardan birini işleyenden imanı nefyettiğini görüyoruz;"], [77.0, "ister yasaklananı yapma kebîresi olsun, ister emredileni terk etme kebîresi."], [80.2, "Nassın büyük günah işleyenlerden birinden imanı nefyettiğini gördüğünde bil ki bununla imanın mutlakını değil, mutlak imanı nefyetmeyi kastetmektedir."]]}, {"reader": false, "ar": [[93.0, "فإن قلتَ: وما الفرقانُ بين الشيء المطلق ومطلقِ الشيء؟"], [98.0, "فأقول: أمّا الشيءُ المطلق فهو كلُّه،"], [101.0, "وأمّا مطلقُ الشيء فهو بعضُه."], [104.0, "فإذا رأينا أنّ الشريعة تنفي الإيمانَ عن مرتكب الكبيرة،"], [111.0, "فإيّاك أن تفهم أنّه نفيٌ لمطلق الإيمان،"], [114.0, "فإنّ هذا مذهبُ الوعيديّة من الخوارج والمعتزلة،"], [118.0, "الذين يعتقدون بأنّ فاعل الكبيرة لم يبقَ معه ولا مطلقُ الإيمان."]], "tr": [[93.0, "Şayet \"Mutlak şey ile şeyin mutlakı arasındaki fark nedir?\" dersen, derim ki:"], [98.0, "Mutlak şey, onun tamamıdır; şeyin mutlakı ise onun bir kısmıdır."], [104.0, "Şeriatın büyük günah işleyenden imanı nefyettiğini gördüğümüzde, sakın bunun imanın mutlakının nefyi olduğunu anlama."], [113.6, "Çünkü bu, Hâricîler ve Mu'tezile'den olan Va'îdiyye'nin mezhebidir;"], [118.6, "onlar büyük günah işleyende imanın mutlakının bile kalmadığına inanırlar."]]}, {"reader": false, "ar": [[125.0, "وإنّما المقصود من هذا النفي عند أهل السنة والجماعة هو نفيُ الإيمان المطلق،"], [133.0, "أي نفيُ الكمال الواجب الذي تتعلّق به النجاةُ يومَ القيامة،"], [139.0, "كما في قوله صلى الله عليه وسلم:"], [144.0, "«لا يزني الزاني حين يزني وهو مؤمن»."], [147.0, "فهذا ليس دليلًا على أنّ الزنا يُخرج من الملّة بالكلّيّة،"], [152.0, "وإنّما دليلٌ على أنّ الزاني ينقص من إيمانه بقدر زناه."]], "tr": [[125.0, "Ehl-i Sünnet ve'l-Cemaat'e göre bu nefyden maksat, mutlak imanın nefyidir;"], [130.8, "yani kıyamet günü kurtuluşun kendisine bağlı olduğu vâcip kemalin nefyidir."], [137.5, "Nitekim Peygamber sallallâhu aleyhi ve sellem'in şu sözünde olduğu gibi:"], [144.0, "«Zina eden, zina ettiği sırada mümin olarak zina etmez.» Bu, zinanın dinden tamamen çıkardığına delil değildir;"], [152.6, "ancak zina edenin imanının zinası kadar eksildiğine delildir."]]}, {"reader": false, "ar": [[158.0, "وقولُه صلى الله عليه وسلم:"], [161.0, "«ولا يشرب الخمرَ حين يشربها وهو مؤمن» ليس دليلًا على نفي مطلق الإيمان عن شارب الخمر،"], [168.0, "وإنّما نقص من إيمان شارب الخمر بقدر جريمته التي ارتكبها."], [179.0, "وقولُه صلى الله عليه وسلم:"], [181.9, "«ولا يسرق السارقُ حين يسرق وهو مؤمن» ليس دليلًا على أنّ السارق يخرج من الملّة بالكلّيّة،"], [191.4, "وإنّما ينقص إيمانُه بقدر جريمة سرقته."]], "tr": [[158.0, "Peygamber sallallâhu aleyhi ve sellem'in «İçki içen, içtiği sırada mümin olarak içmez» sözü, içki içenden imanın mutlakının nefyedildiğine delil değildir;"], [168.8, "ancak içki içenin imanı, işlediği suç kadar eksilmiştir."], [179.0, "Peygamber sallallâhu aleyhi ve sellem'in «Hırsız, çaldığı sırada mümin olarak çalmaz» sözü de hırsızın dinden tamamen çıktığına delil değildir;"], [190.8, "ancak imanı hırsızlık suçu kadar eksilir."]]}, {"reader": false, "ar": [[195.0, "وكذلك قولُه صلى الله عليه وسلم:"], [197.7, "«ولا ينتهب نُهبةً ذاتَ شرفٍ يرفع الناسُ إليه أبصارَهم فيها حين ينتهبها وهو مؤمن»،"], [204.0, "فهذا دليلٌ على أنّ إيمانه قد نقص عن كماله نقصانًا بقدر ما فعل من الجريمة والكبيرة."]], "tr": [[195.0, "Aynı şekilde Peygamber sallallâhu aleyhi ve sellem'in «İnsanların gözlerini kendisine kaldırıp baktığı değerli bir malı yağmalayan, onu yağmaladığı sırada mümin olarak yağmalamaz» sözü de imanının, işlediği suç ve büyük günah kadar kemalinden eksildiğine delildir."]]}, {"reader": false, "ar": [[213.0, "وكقوله صلى الله عليه وسلم:"], [217.0, "«والله لا يؤمن، والله لا يؤمن، والله لا يؤمن»."], [223.0, "قالوا: من يا رسول الله؟"], [224.0, "قال: «من لا يأمن جارُه بوائقَه»."], [227.0, "فإذا كان جارُك يخاف من غوائلك ودواهيك،"], [232.0, "فهذا دليلٌ على أنّه نقص من إيمانك المقدارُ الواجبُ الذي تحصل به النجاةُ يومَ القيامة."], [241.0, "وليس المراد بنفي الإيمان هنا أنّك خرجتَ من الإسلام بمجرّد عدم أمن جارك لك،"], [250.0, "وإنّما نقص من إيمانك بالمقدار الذي يناسب هذه الكبيرة."]], "tr": [[213.0, "Yine Peygamber sallallâhu aleyhi ve sellem'in şu sözü gibi:"], [217.0, "«Vallahi iman etmiş olmaz, vallahi iman etmiş olmaz, vallahi iman etmiş olmaz.» \"Kim, ey Allah'ın Resûlü?\" dediler."], [224.0, "Buyurdu ki: «Komşusu, kötülüklerinden emin olmayan kimse.» Komşun senin tuzaklarından ve belalarından korkuyorsa, bu, imanından kıyamet günü kurtuluşun kendisiyle hâsıl olduğu vâcip miktarın eksildiğine delildir."], [241.0, "Burada imanın nefyinden maksat, sırf komşunun senden emin olmaması sebebiyle İslam'dan çıktığın değildir;"], [250.0, "ancak imanından bu büyük günaha uygun miktar eksilmiştir."]]}, {"reader": false, "ar": [[257.0, "وكذلك أيضًا قولُه صلى الله عليه وسلم:"], [261.0, "«لا يؤمن أحدُكم حتى أكون أحبَّ إليه من ولده ووالده والناس أجمعين»."], [268.0, "فإنّ هذا فيه دليلٌ على نقص إيمان من لم يفعل هذا الواجب،"], [273.0, "وليس المقصود أنّه يخرج من الإيمان بالكلّيّة."], [279.0, "بدليل أنّ النبيّ صلى الله عليه وسلم قال… بدليل أنّ عمر رضي الله عنه قال للنبيّ صلى الله عليه وسلم:"], [288.0, "والله يا رسول الله،"], [290.3, "إنّي لأُحبّك أكثرَ من (كلّ) شيءٍ إلا من نفسي."], [295.0, "فقال: «لا والذي نفسي بيده يا عمر، حتى يكون (أحبَّ إليك) من نفسك»."]], "tr": [[257.0, "Yine Peygamber sallallâhu aleyhi ve sellem'in şu sözü:"], [261.0, "«Ben sizden birine çocuğundan, babasından ve bütün insanlardan daha sevimli olmadıkça iman etmiş olmaz.» Bunda, bu vâcibi yerine getirmeyenin imanının eksik olduğuna delil vardır;"], [273.0, "maksat onun imandan tamamen çıkması değildir."], [279.0, "Delili şudur: Peygamber sallallâhu aleyhi ve sellem dedi ki… (düzeltiyor:) Delili şudur:"], [284.7, "Ömer radıyallâhu anh Peygamber sallallâhu aleyhi ve sellem'e:"], [288.0, "\"Vallahi ey Allah'ın Resûlü, seni kendim hariç (her) şeyden daha çok seviyorum\" dedi."], [295.0, "Bunun üzerine: «Hayır, nefsim elinde olana yemin olsun ki ey Ömer, (sana) kendinden (daha sevimli) olmadıkça (olmaz)» buyurdu."]]}, {"reader": false, "ar": [[300.0, "فقال: الآن يا رسول الله أحبّك أكثرَ من نفسي."], [305.0, "ولم يأمره بتجديد الدين،"], [306.0, "ممّا يدلّ على أنّه إنّما فوّت صفةً واجبةً من صفات المؤمن."]], "tr": [[300.0, "Ömer: \"Şimdi ey Allah'ın Resûlü, seni kendimden daha çok seviyorum\" dedi."], [305.0, "(Peygamber) ona dinini yenilemesini emretmedi;"], [306.0, "bu da onun ancak müminin vâcip sıfatlarından birini kaçırmış olduğunu gösterir."]]}]}, {"ts": "05:12", "title": "1. Külliye (devam): Ebû Ubeyd, İbn Hacer, İbn Ebî Zemenîn, İbnü's-Salâh ve Nevevî'nin sözleri", "paras": [{"reader": false, "ar": [[312.0, "وكذلك قولُه صلى الله عليه وسلم:"], [317.0, "«لا إيمانَ لمن لا أمانةَ له، ولا دينَ لمن لا عهدَ له»."], [322.0, "فمن خان في أمانته وفي عهده فيكون قد انتقص من إيمانه الكامل بقدر ما فعله من هذه الكبائر."]], "tr": [[312.0, "Aynı şekilde Peygamber sallallâhu aleyhi ve sellem'in şu sözü:"], [317.0, "«Emaneti olmayanın imanı yoktur; ahdi olmayanın dini yoktur.» Emanetine ve ahdine ihanet eden, bu büyük günahlardan işlediği kadar kâmil imanını eksiltmiş olur."]]}, {"reader": false, "ar": [[333.0, "ولذلك يقول أبو عُبيد القاسمُ بن سلّام رحمه الله تعالى:"], [339.0, "«الذي عندنا في هذا الباب كلِّه أنّ المعاصي والذنوب لا تُزيل إيمانًا ولا تُوجب كفرًا، ولكنّها إنّما تنفي من الإيمان حقيقتَه وإخلاصَه الذي نعت الله به أهلَه. وأمّا الآثارُ المرويّاتُ بذكر الكفر والشرك ووجوبِهما بالمعاصي، فإنّ معناها عندنا ليست تُثبت على أهلها كفرًا ولا شركًا يُزيلان الإيمانَ عن صاحبه، إنّما وجوهُها أنّها من الأخلاق والسنن التي عليها الكفّارُ والمشركون». انتهى كلامُه."]], "tr": [[333.0, "Bu yüzden Ebû Ubeyd el-Kâsım b."], [336.0, "Sellâm —Allah Teâlâ ona rahmet etsin— der ki:"], [340.1, "\"Bu babın tamamında bizim görüşümüz şudur:"], [342.7, "Masiyetler ve günahlar imanı gidermez ve küfrü gerektirmez;"], [347.0, "ancak imandan, Allah'ın iman ehlini kendisiyle nitelediği hakikatini ve ihlâsını nefyeder."], [353.7, "Masiyetlerle küfrün ve şirkin vâcip olduğunu zikreden rivayet edilmiş eserlere gelince, bize göre bunların anlamı, sahiplerine imanı gideren bir küfür veya şirk isbat etmeleri değildir;"], [366.9, "bunların izahı, bu (fiillerin) kâfirlerin ve müşriklerin üzerinde bulunduğu ahlâk ve âdetlerden olmasıdır.\" Sözü bitti."]]}, {"reader": false, "ar": [[375.0, "وقال ابنُ حجر رحمه الله تعالى:"], [379.0, "«قال الحسن البصريّ ومحمّد بن جرير الطبريّ: معناه يُنزع عنه اسمُ المدح الذي سمّى الله به أولياءه، فلا يُقال في حقّه: مؤمن، ويستحقّ اسمَ الذمّ، فيُقال: سارقٌ وزانٍ وفاجرٌ وفاسق»."], [397.0, "انتهى كلامُهم رحمهم الله تعالى."]], "tr": [[375.0, "İbn Hacer —Allah Teâlâ ona rahmet etsin— der ki:"], [377.0, "\"Hasan-ı Basrî ve Muhammed b."], [379.0, "Cerîr et-Taberî şöyle dedi: Bunun anlamı, Allah'ın velilerini kendisiyle isimlendirdiği övgü isminin ondan sökülüp alınmasıdır."], [387.2, "Onun hakkında 'mümin' denmez ve yergi ismini hak eder;"], [392.0, "'hırsız, zâni, fâcir, fâsık' denir.\" Sözleri bitti;"], [397.0, "Allah Teâlâ onlara rahmet etsin."]]}, {"reader": false, "ar": [[400.0, "وكذلك أيضًا قال الإمامُ ابنُ أبي زمنين:"], [406.0, "«قال: هذه الأحاديث وما أشبهها معناها أنّ هذه الأفعال المذكورة فيها من أخلاق الكفّار والمشركين وسننهم، منهيٌّ عنها ليتحاشاها المسلمون، وأمّا أن يكون في فعل شيءٍ منها مشركًا بالله أو كافرًا فلا». انتهى كلامُه."]], "tr": [[400.0, "Yine İmam İbn Ebî Zemenîn der ki:"], [402.2, "\"Bu hadislerin ve benzerlerinin anlamı şudur:"], [406.0, "Bu zikredilen fiillerde kâfirlerin ve müşriklerin ahlâk ve âdetlerinden (bir şey) vardır;"], [413.4, "Müslümanlar onlardan sakınsın diye yasaklanmıştır."], [416.9, "Ama bunlardan birini işlemekle (kişinin) Allah'a şirk koşan veya kâfir olmasına gelince, hayır (öyle değildir).\" Sözü bitti."]]}, {"reader": false, "ar": [[426.0, "وقال الإمامُ ابنُ الصلاح رحمه الله تعالى في شرح حديث «لا يزني الزاني حين يزني وهو مؤمن»:"], [435.0, "«قال: المرادُ به نفيُ كمال الإيمان عنه، لا نفيُ أصل الإيمان، ويفيد أنّ الفاسق لا يُطلق عليه اسمُ المؤمن، ويُقال فيه: مؤمنٌ ناقصُ الإيمان». انتهى كلامُه."]], "tr": [[426.0, "İmam İbnü's-Salâh —Allah Teâlâ ona rahmet etsin— «Zina eden, zina ettiği sırada mümin olarak zina etmez» hadisinin şerhinde der ki:"], [435.0, "\"Bununla kastedilen, imanın kemalinin ondan nefyidir, imanın aslının nefyi değildir."], [439.9, "(Hadis) fâsığa (mutlak olarak) mümin isminin verilmeyeceğini ifade eder;"], [444.5, "onun hakkında 'imanı eksik mümin' denir.\" Sözü bitti."]]}, {"reader": false, "ar": [[450.0, "قال الإمامُ النوويّ رحمه الله تعالى:"], [453.4, "«القولُ الصحيح الذي قاله المحقّقون أنّ معناه: لا يفعل هذه المعاصيَ وهو كاملُ الإيمان، وهذا من الألفاظ التي تُطلق على نفس الشيء ويُراد نفيُ كماله ومختارِه». انتهى كلامُه."]], "tr": [[450.0, "İmam Nevevî —Allah Teâlâ ona rahmet etsin— der ki:"], [453.4, "\"Muhakkiklerin söylediği sahih görüş şudur:"], [455.6, "Anlamı, (kişinin) bu masiyetleri imanı kâmil olduğu hâlde işlemeyeceğidir."], [460.6, "Bu, şeyin kendisi üzerine söylenip onun kemalinin ve seçkin olanının nefyi kastedilen lafızlardandır.\" Sözü bitti."]]}, {"reader": false, "ar": [[469.0, "وقد زاد الإمامُ ابنُ تيميّة رحمه الله تعالى على ما ذكره الأئمّةُ قيدًا مهمًّا،"], [477.0, "وهي أنّ مثل هذه الأحاديث التي فيها نفيُ الإيمان أنّها ليست لنفي الإيمان المستحبّ،"], [487.0, "وإنّما نفيٌ لصفةٍ يتعلّق بها الإيمانُ الواجب،"], [494.0, "كما سيأتي بيانُه ونقولُ أهل العلم فيه في محلّه بإذن الله عز وجل."]], "tr": [[469.0, "İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— imamların zikrettiklerine önemli bir kayıt eklemiştir:"], [477.0, "İmanın nefyedildiği bu tür hadisler, müstehap imanın nefyi için değildir;"], [482.8, "ancak vâcip imanın kendisine bağlı olduğu bir sıfatın nefyidir."], [490.7, "Bunun açıklaması ve ilim ehlinin bu konudaki nakilleri, Allah Azze ve Celle'nin izniyle yerinde gelecektir."]]}, {"reader": false, "ar": [[501.0, "والخلاصةُ من هذه الكلّيّة:"], [503.6, "أنّكم متى ما رأيتم نصًّا ينفي الإيمانَ عن فاعل الكبيرة،"], [510.0, "فاعلموا أنّه نفيٌ للإيمان المطلق،"], [513.6, "وليس نفيًا لمطلق الإيمان."], [517.0, "ولذلك فسّر الصحابةُ رضي الله تعالى عنهم هذا النفيَ بمثل ذلك،"], [523.0, "كما أخرجه الإمامُ البخاريّ رحمه الله تعالى من حديث عكرمة قال:"], [530.6, "قلتُ لابن عباس: كيف يُنزع منه الإيمان؟"], [534.9, "قال: هكذا ـ وشبّك بين أصابعه ثم أخرجها ـ فإن تاب عاد إليه هكذا ـ وشبّك بين أصابعه."]], "tr": [[501.0, "Bu külliyenin özeti şudur: Büyük günah işleyenden imanı nefyeden bir nas gördüğünüzde, bilin ki bu, mutlak imanın nefyidir, imanın mutlakının nefyi değildir."], [517.0, "Bu yüzden sahabe —Allah Teâlâ onlardan razı olsun— bu nefyi böyle tefsir etmiştir."], [523.0, "Nitekim İmam Buhârî —Allah Teâlâ ona rahmet etsin— İkrime'nin hadisinden şunu rivayet etmiştir:"], [530.6, "(İkrime) dedi ki: İbn Abbâs'a \"İman ondan nasıl sökülür?\" dedim."], [534.9, "\"Şöyle\" dedi —parmaklarını birbirine geçirdi, sonra onları çıkardı— \"Tövbe ederse ona şöyle geri döner\" dedi ve parmaklarını birbirine geçirdi."]]}, {"reader": false, "ar": [[544.0, "وقال أبو عبد الله ـ يعني البخاريّ رحمه الله تعالى ـ:"], [549.7, "«لا يكون هذا مؤمنًا تامًّا، ولا يكون له نورُ الإيمان»."], [556.0, "وفي سنن أبي داود بإسنادٍ صحيح من حديث أبي هريرة رضي الله عنه قال:"], [562.5, "قال النبيّ صلى الله عليه وسلم:"], [565.2, "«إذا زنى العبدُ خرج منه الإيمانُ فكان فوق رأسه كالظُّلّة، فإذا خرج من ذلك العمل رجع إليه الإيمان»."], [576.0, "والشاهد منه: أنّه رجع بدون النطق بالشهادتين،"], [581.0, "ممّا يدلّ على أنّ المراد به كمالُ الإيمان وليس أصلَ الإيمان. والله أعلم."]], "tr": [[544.0, "Ebû Abdillah —yani Buhârî, Allah Teâlâ ona rahmet etsin— dedi ki:"], [549.7, "\"Bu kişi tam mümin olmaz ve onun iman nuru olmaz.\" Sünen-i Ebî Dâvûd'da sahih bir isnadla Ebû Hüreyre radıyallâhu anh'ın hadisinden:"], [559.7, "Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [562.5, "«Kul zina ettiğinde iman ondan çıkar ve başının üstünde bir gölgelik gibi olur; o amelden çıktığında iman ona geri döner.» Delil yönü şudur:"], [576.0, "(İman) şehâdeteyni söylemeden geri dönmüştür;"], [579.6, "bu da kastedilenin imanın aslı değil, imanın kemali olduğunu gösterir. Allah en iyisini bilir."]]}]}, {"ts": "09:49", "title": "2. Külliye: İmanın inkârından bahseden nasta iman, dinin tamamıdır", "paras": [{"reader": false, "ar": [[589.0, "القاعدة الثانية: <b>كلُّ نصٍّ فيه الكفرُ بالإيمان فالمرادُ به الدينُ كلُّه.<\/b> <span class=\"note\">(يكررها)<\/span> فهمتم؟"], [609.0, "<b>كلُّ نصٍّ فيه الكفرُ بالإيمان فالمرادُ به الدينُ كلُّه.<\/b>"]], "tr": [[589.0, "<b>2. külliye<\/b> (Şeyh \"ikinci kaide\" diyor):"], [591.7, "<b>İmanı inkârdan (küfürden) bahseden her nasta (imandan) kastedilen, dinin tamamıdır.<\/b> (Tekrar ediyor.) Anladınız mı?"], [609.0, "<b>İmanı inkârdan bahseden her nasta kastedilen, dinin tamamıdır.<\/b>"]]}, {"reader": false, "ar": [[616.0, "أقول وبالله تعالى التوفيق:"], [619.0, "فمتى ما قرن الله عز وجل في نصٍّ واحدٍ بين كفرٍ وإيمان،"], [625.0, "فاعلم أنّ المراد بالإيمان الدينُ كلُّه،"], [629.0, "وليس المرادُ به الإيمانَ المقابلَ بالإسلام،"], [634.0, "وإنّما يُراد به الدينُ كلُّه."], [637.0, "كقول الله عز وجل:"], [639.7, "<span class=\"ayah\">﴿وَمَن يَتَبَدَّلِ الْكُفْرَ بِالْإِيمَانِ فَقَدْ ضَلَّ سَوَاءَ السَّبِيلِ﴾<\/span> [البقرة: 108]،"], [646.0, "ومعناها: أنّ من يختار الكفرَ ويترك الإيمانَ فقد خرج عن الدين كلِّه."]], "tr": [[616.0, "Tevfik Allah Teâlâ'dandır, derim ki:"], [619.0, "Allah Azze ve Celle bir nasta küfür ile imanı bir araya getirdiğinde, bil ki imandan kastedilen dinin tamamıdır;"], [629.0, "İslam'ın karşılığı olarak kullanılan iman kastedilmez, ancak dinin tamamı kastedilir."], [637.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [639.7, "<span class=\"ayah\">﴿Kim imanı küfürle değiştirirse, şüphesiz yolun ortasından sapmıştır.﴾<\/span> [Bakara 108] Anlamı şudur:"], [648.3, "Küfrü seçip imanı terk eden, dinin tamamından çıkmıştır."]]}, {"reader": false, "ar": [[653.0, "وكقول الله عز وجل:"], [655.4, "<span class=\"ayah\">﴿وَمَن يَكْفُرْ بِالْإِيمَانِ فَقَدْ حَبِطَ عَمَلُهُ وَهُوَ فِي الْآخِرَةِ مِنَ الْخَاسِرِينَ﴾<\/span> [المائدة: 5]،"], [662.0, "والمراد بالإيمان هنا الدينُ كلُّه،"], [666.0, "بمعنى أنّه يخرج من الإسلام بالكلّيّة."], [670.0, "وكقول الله عز وجل:"], [673.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ اشْتَرَوُا الْكُفْرَ بِالْإِيمَانِ لَن يَضُرُّوا اللَّهَ شَيْئًا وَلَهُمْ عَذَابٌ أَلِيمٌ﴾<\/span> [آل عمران: 177]،"], [681.0, "يعني: استبدلوا الإيمانَ بالكفر،"], [684.0, "والمراد بالإيمان هنا الدينُ كلُّه."]], "tr": [[653.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [655.4, "<span class=\"ayah\">﴿Kim imanı inkâr ederse, ameli boşa gitmiştir ve o, âhirette hüsrana uğrayanlardandır.﴾<\/span> [Mâide 5] Burada imandan kastedilen dinin tamamıdır;"], [666.0, "yani o kişi İslam'dan tamamen çıkar."], [670.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [673.0, "<span class=\"ayah\">﴿İmana karşılık küfrü satın alanlar, Allah'a hiçbir zarar veremezler; onlar için elem verici bir azap vardır.﴾<\/span> [Âl-i İmrân 177] Yani imanı küfürle değiştirdiler;"], [684.8, "burada imandan kastedilen dinin tamamıdır."]]}, {"reader": false, "ar": [[689.0, "وكقوله تعالى: <span class=\"ayah\">﴿إِنَّ الَّذِينَ كَفَرُوا بَعْدَ إِيمَانِهِمْ ثُمَّ ازْدَادُوا كُفْرًا لَّن تُقْبَلَ تَوْبَتُهُمْ وَأُولَٰئِكَ هُمُ الضَّالُّونَ﴾<\/span> [آل عمران: 90]،"], [699.0, "أي: الذين كفروا بالدين كلِّه."], [703.0, "وكقوله تعالى: إنّ الذين آ… عفوًا،"], [704.2, "وكقوله تعالى: <span class=\"ayah\">﴿لَا تَعْتَذِرُوا قَدْ كَفَرْتُم بَعْدَ إِيمَانِكُمْ﴾<\/span> [التوبة: 66]،"], [713.0, "أي: قد كفرتم بالدين كلِّه."]], "tr": [[689.0, "Allah Teâlâ'nın şu sözü gibi:"], [691.6, "<span class=\"ayah\">﴿İman ettikten sonra inkâr edip sonra inkârlarını artıranların tövbesi asla kabul edilmeyecektir; onlar sapıkların ta kendileridir.﴾<\/span> [Âl-i İmrân 90] Yani dinin tamamını inkâr edenler."], [703.0, "Allah Teâlâ'nın şu sözü gibi:"], [703.9, "\"İman edenler…\" pardon, Allah Teâlâ'nın şu sözü gibi:"], [704.5, "<span class=\"ayah\">﴿Özür dilemeyin; imanınızdan sonra kâfir oldunuz.﴾<\/span> [Tevbe 66] Yani dinin tamamını inkâr ettiniz."]]}, {"reader": false, "ar": [[717.0, "ولذلك قال الإمامُ ابنُ تيميّة رحمه الله تعالى:"], [721.0, "«وإذا ذُكر الإيمانُ مجرّدًا دخل فيه الإسلامُ والأعمالُ الصالحة، كقوله في حديث الشُّعَب: الإيمانُ بضعٌ وسبعون شعبةً، أفضلُها قولُ لا إله إلا الله، وأدناها إماطةُ الأذى عن الطريق، وكذلك سائرُ الأحاديث التي يُجعل فيها أعمالُ البرّ من الإيمان». انتهى كلامُه."]], "tr": [[717.0, "Bu yüzden İmam İbn Teymiyye —Allah Teâlâ ona rahmet etsin— der ki:"], [721.0, "\"İman tek başına zikredildiğinde, ona İslam ve salih ameller de girer."], [730.0, "(Peygamber'in) şuabât (iman şubeleri) hadisindeki şu sözü gibi:"], [734.4, "'İman yetmiş küsur şubedir; en üstünü Lâ ilâhe illallah sözü, en aşağısı da yoldan eziyet veren şeyi kaldırmaktır.' İyilik amellerinin imandan sayıldığı diğer bütün hadisler de böyledir.\" Sözü bitti."]]}, {"reader": false, "ar": [[747.0, "والخلاصةُ من ذلك: أنّه متى ما ذُكر الإيمانُ مفردًا فإنّ المراد به الدينُ كلُّه،"], [755.0, "فأيُّ نصٍّ يجمع بين الكفر والإيمان أو يقابل بينهما فالمراد به الكفرُ بالدين كلِّه. والله أعلم."]], "tr": [[747.0, "Bunun özeti şudur: İman tek başına zikredildiğinde ondan kastedilen dinin tamamıdır."], [752.6, "Küfür ile imanı bir araya getiren veya onları karşı karşıya koyan her nasta kastedilen, dinin tamamını inkârdır. Allah en iyisini bilir."]]}]}, {"ts": "12:44", "title": "3. Külliye: Küfür dışındaki bütün günahlar imanı eksiltir, bozmaz", "paras": [{"reader": false, "ar": [[764.0, "الكلّيّة الثالثة: <b>كلُّ الذنوب ما عدا الكفرَ مُنقِّصةٌ لا ناقضة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[764.0, "<b>3. külliye: Küfür dışındaki bütün günahlar (imanı) eksiltir, bozmaz.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[781.0, "أقول وبالله التوفيق: وهذا اعتقادُ أهل السنة والجماعة فيمن يفعل شيئًا من الذنوب،"], [788.0, "كما قال الإمامُ أبو جعفر الطحاويّ:"], [792.0, "«ولا نُكفّر أحدًا من أهل القبلة بذنبٍ ما لم يستحلَّه»."], [798.0, "وكما قال الإمامُ أبو حنيفة النعمانُ رحمه الله تعالى في «الفقه الأكبر»،"], [805.0, "قال: «ألّا نُكفّر أحدًا من أهل القبلة بذنب»،"], [809.0, "وقال أيضًا: «ولا نُكفّر مسلمًا بذنبٍ من الذنوب وإن كانت كبيرةً إذا لم يستحلَّها»."]], "tr": [[781.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'in günahlardan birini işleyen kimse hakkındaki itikadıdır."], [787.7, "Nitekim İmam Ebû Ca'fer et-Tahâvî şöyle demiştir:"], [792.0, "\"Kıble ehlinden hiç kimseyi, helal saymadıkça bir günah sebebiyle tekfir etmeyiz.\" Yine İmam Ebû Hanîfe en-Nu'mân —Allah Teâlâ ona rahmet etsin— el-Fıkhu'l-Ekber'de şöyle demiştir:"], [805.5, "\"Kıble ehlinden hiç kimseyi bir günah sebebiyle tekfir etmememiz…\" Yine şöyle demiştir:"], [810.3, "\"Bir Müslüman'ı, büyük günah da olsa, helal saymadıkça günahlardan herhangi biri sebebiyle tekfir etmeyiz.\""]]}, {"reader": false, "ar": [[818.0, "وقال الإمامُ محمّد بن الحسن الشيبانيّ رحمه الله:"], [823.0, "«لا ينبغي لأحدٍ من أهل الإسلام أن يشهد على رجلٍ من أهل الإسلام بذنبٍ أذنبه بكفر، وإن عظُم جُرمُه، وهو قولُ أبي حنيفة والعامّة من فقهائنا»."], [837.0, "وقال الإمامُ أحمد بن حنبل رحمه الله تعالى ـ فيما يرويه عنه محمّد بن حُميد ـ قال أحمد في بيان صفة المؤمن من أهل السنة والجماعة:"], [851.0, "«ولم يشكّ في إيمانه، ولم يُكفّر أحدًا من أهل التوحيد بذنب»."]], "tr": [[818.0, "İmam Muhammed b. el-Hasen eş-Şeybânî —Allah ona rahmet etsin— der ki:"], [823.0, "\"İslam ehlinden hiç kimsenin, İslam ehlinden bir adamın işlediği bir günah sebebiyle, suçu büyük de olsa, onun küfrüne şahitlik etmesi uygun değildir."], [831.7, "Bu, Ebû Hanîfe'nin ve fakihlerimizin geneliyle görüşüdür.\" İmam Ahmed b."], [837.0, "Hanbel —Allah Teâlâ ona rahmet etsin— Muhammed b."], [843.0, "Humeyd'in ondan rivayet ettiğine göre, Ehl-i Sünnet ve'l-Cemaat'ten olan müminin vasfını açıklarken şöyle demiştir:"], [851.0, "\"İmanında şüphe etmez ve tevhid ehlinden hiç kimseyi bir günah sebebiyle tekfir etmez.\""]]}, {"reader": false, "ar": [[859.0, "وقال الإمامُ ابنُ عبد البرّ المالكيّ رحمه الله تعالى:"], [863.0, "«وقد اتّفق أهلُ السنة والجماعة ـ وهم أهلُ الفقه والأثر ـ على أنّ أحدًا لا يُخرجه ذنبُه وإن عظُم من الإسلام، وخالفهم أهلُ البدع»."], [876.0, "انتهى كلامُه. وقال أبو الحسن الأشعريّ رحمه الله تعالى:"], [881.0, "«ولا يُكفّرون أحدًا من أهل القبلة بذنبٍ، كنحو الزنا والسرقة وما أشبه ذلك من الكبائر، وهم بما معهم من الإيمان مؤمنون وإن ارتكبوا الكبائر»."]], "tr": [[859.0, "İmam İbn Abdilber el-Mâlikî —Allah Teâlâ ona rahmet etsin— der ki:"], [863.0, "\"Ehl-i Sünnet ve'l-Cemaat —ki onlar fıkıh ve eser ehlidir— hiç kimseyi, büyük de olsa, günahının İslam'dan çıkarmayacağı üzerinde ittifak etmiştir;"], [871.2, "bid'at ehli ise onlara muhalefet etmiştir.\" Sözü bitti."], [876.0, "Ebu'l-Hasen el-Eş'arî —Allah Teâlâ ona rahmet etsin— der ki:"], [881.0, "\"(Ehl-i Sünnet) kıble ehlinden hiç kimseyi zina, hırsızlık ve benzeri büyük günahlar gibi bir günah sebebiyle tekfir etmezler."], [890.7, "Onlar, büyük günahlar işleseler bile, beraberlerindeki iman sebebiyle mümindirler.\""]]}, {"reader": false, "ar": [[896.0, "فهذه النقولُ تدلّ على أنّ هذه الكلّيّة ممّا أجمع عليه أهلُ السنة والجماعة رحمهم الله تعالى."], [904.0, "وهذه الكلّيّة فيها جزئيّتان،"], [906.6, "لا بدّ أن نستدلّ على كلّ واحدةٍ منهما بدليلها الشرعيّ:"], [913.0, "الجزئيّة الأولى: أنّ الذنوب مُنقِّصة،"], [917.0, "والجزئيّة الثانية: أنّ الذنوب ليست بناقضة."]], "tr": [[896.0, "Bu nakiller, bu külliyenin Ehl-i Sünnet ve'l-Cemaat'in —Allah Teâlâ onlara rahmet etsin— icmâ ettiği şeylerden olduğunu gösterir."], [904.0, "Bu külliyede iki cüz vardır;"], [907.2, "her birini şer'î delille isbat etmemiz gerekir."], [913.0, "Birinci cüz: Günahlar (imanı) eksiltir."], [917.0, "İkinci cüz: Günahlar (imanı) bozmaz."]]}]}, {"ts": "15:23", "title": "3. Külliye (devam): Günahların imanı bozmadığının Kitap'tan delilleri", "paras": [{"reader": false, "ar": [[923.0, "أمّا الدليلُ على أنّها ليست بناقضة فبالكتاب والسنة والإجماع."], [931.0, "فأمّا من الكتاب فقولُ الله عز وجل:"], [934.2, "<span class=\"ayah\">﴿فَمَنْ عُفِيَ لَهُ مِنْ أَخِيهِ شَيْءٌ فَاتِّبَاعٌ بِالْمَعْرُوفِ وَأَدَاءٌ إِلَيْهِ بِإِحْسَانٍ﴾<\/span> [البقرة: 178]،"], [943.0, "وهذه قالها الله عز وجل في مسألة القتل العمد،"], [947.0, "الذي هو كبيرةٌ باتّفاق أهل السنة والجماعة."], [949.7, "فسمّى الله… فوصف اللهُ عز وجل القاتلَ بأنّه أخٌ للمقتول،"], [959.0, "والمقصود بالأخوّة هنا أي أخوّة الدين والإيمان،"], [964.0, "ممّا يدلّ على أنّ فعل الكبيرة لا ينقض أخوّة الدين والإيمان."]], "tr": [[923.0, "(Günahların imanı) bozmadığının delili ise Kitap, Sünnet ve icmâdır."], [931.0, "Kitap'tan delil, Allah Azze ve Celle'nin şu sözüdür:"], [934.2, "<span class=\"ayah\">﴿Kime kardeşi tarafından bir şey bağışlanırsa, artık örfe uymak ve ona güzellikle ödemek gerekir.﴾<\/span> [Bakara 178] Allah Azze ve Celle bunu, Ehl-i Sünnet ve'l-Cemaat'in ittifakıyla büyük günah olan kasten öldürme meselesinde söylemiştir."], [949.7, "Allah (onu) isimlendirdi… Allah Azze ve Celle katili, öldürülenin kardeşi olarak nitelemiştir."], [959.9, "Burada kardeşlikten kastedilen din ve iman kardeşliğidir."], [964.0, "Bu da büyük günah işlemenin din ve iman kardeşliğini bozmadığını gösterir."]]}, {"reader": false, "ar": [[971.0, "ومنها أيضًا قولُ الله عز وجل في المتقاتلين من أهل الإيمان بغيًا،"], [978.0, "قال: <span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ﴾<\/span> [الحجرات: 10]،"], [983.0, "بعد أن وصفهم بقوله:"], [985.3, "<span class=\"ayah\">﴿وَإِن طَائِفَتَانِ مِنَ الْمُؤْمِنِينَ اقْتَتَلُوا فَأَصْلِحُوا بَيْنَهُمَا ۖ فَإِن بَغَتْ إِحْدَاهُمَا عَلَى الْأُخْرَىٰ فَقَاتِلُوا الَّتِي تَبْغِي حَتَّىٰ تَفِيءَ إِلَىٰ أَمْرِ اللَّهِ ۚ فَإِن فَاءَتْ فَأَصْلِحُوا بَيْنَهُمَا بِالْعَدْلِ وَأَقْسِطُوا ۖ إِنَّ اللَّهَ يُحِبُّ الْمُقْسِطِينَ﴾<\/span> [الحجرات: 9]."], [1002.0, "ثم وصف جميعَ المتقاتلين فيما بينهم بأنّهم إخوةٌ في قوله:"], [1008.2, "<span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ﴾<\/span> [الحجرات: 10]، والمقصود بالأخوّة هنا إنّما هي أخوّة الدين والإيمان."], [1015.0, "فدلّ ذلك على أنّ فعل الكبيرة لا ينقض أصلَ الإيمان في القلب."]], "tr": [[971.0, "Bunlardan biri de Allah Azze ve Celle'nin iman ehlinden haksızlıkla birbiriyle savaşanlar hakkındaki sözüdür:"], [978.9, "<span class=\"ayah\">﴿Müminler ancak kardeştir.﴾<\/span> [Hucurât 10] Bunu, onları şu sözüyle niteledikten sonra söylemiştir:"], [985.3, "<span class=\"ayah\">﴿Eğer müminlerden iki grup birbiriyle çarpışırsa aralarını düzeltin. Şayet biri diğerine saldırırsa, Allah'ın emrine dönünceye kadar saldıran tarafla savaşın. Eğer dönerse, artık aralarını adaletle düzeltin ve âdil davranın. Şüphesiz Allah âdil davrananları sever.﴾<\/span> [Hucurât 9] Sonra birbiriyle savaşanların hepsini <span class=\"ayah\">﴿Müminler ancak kardeştir﴾<\/span> [Hucurât 10] sözüyle kardeş olarak nitelemiştir."], [1008.2, "Burada kardeşlikten kastedilen ancak din ve iman kardeşliğidir."], [1015.0, "Bu da büyük günah işlemenin kalpteki imanın aslını bozmadığını gösterir."]]}, {"reader": false, "ar": [[1020.0, "ولذلك قال الإمامُ البغويّ رحمه الله تعالى:"], [1024.0, "«وفي هاتين الآيتين دليلٌ على أنّ البغيَ لا يُزيل اسمَ الإيمان، لأنّ الله تعالى سمّاهم إخوةً مؤمنين مع كونهم باغين». انتهى كلامُه."]], "tr": [[1020.0, "Bu yüzden İmam Begavî —Allah Teâlâ ona rahmet etsin— der ki:"], [1024.0, "\"Bu iki ayette, haksız saldırının (bağy) iman ismini gidermediğine delil vardır;"], [1030.4, "çünkü Allah Teâlâ onları, saldırgan olmalarına rağmen mümin kardeşler olarak isimlendirmiştir.\" Sözü bitti."]]}]}, {"ts": "17:19", "title": "3. Külliye (devam): Sünnet'ten deliller — Ubâde hadisleri ve zekâtı vermeyen", "paras": [{"reader": false, "ar": [[1039.0, "ومنها أيضًا ما في الصحيح من حديث عُبادة رضي الله عنه،"], [1043.0, "أنّ النبيّ صلى الله عليه وسلم قال ـ وحولَه عصابةٌ من أصحابه ـ:"], [1049.0, "«بايعوني على ألّا تُشركوا بالله شيئًا، ولا تسرقوا، ولا تزنوا، ولا تقتلوا أولادكم، ولا تأتوا ببهتانٍ تفترونه بين أيديكم وأرجلكم، ولا تعصوا في معروف، فمن وفّى منكم فأجرُه على الله، ومن أصاب من ذلك شيئًا فعُوقب به في الدنيا كان كفّارةً له»."]], "tr": [[1039.0, "Bunlardan biri de Sahîh'te Ubâde radıyallâhu anh'ın hadisinde bulunan şudur:"], [1042.6, "Peygamber sallallâhu aleyhi ve sellem, etrafında ashâbından bir topluluk varken şöyle buyurdu:"], [1049.0, "«Allah'a hiçbir şeyi ortak koşmamak, hırsızlık yapmamak, zina etmemek, çocuklarınızı öldürmemek, elleriniz ve ayaklarınız arasında uydurduğunuz bir iftirayı getirmemek ve iyilikte isyan etmemek üzere bana biat edin. Sizden kim (sözünü) yerine getirirse ecri Allah'a aittir. Kim bunlardan birini işler de dünyada onunla cezalandırılırsa, bu onun için keffâret olur.»"]]}, {"reader": false, "ar": [[1077.0, "والشاهد منه قولُه: «ومن أصاب من ذلك» ـ أي من تلك الكبائر ـ «شيئًا فستره الله، كان أمرُه إلى الله» عز وجل،"], [1090.0, "«إن شاء عفا عنه، وإن شاء عذّبه، فبايعناه على ذلك»."], [1095.0, "فهذا دليلٌ على أنّ فاعل الكبيرة لا ينتقض إيمانُه بالكلّيّة،"], [1101.7, "وإنّما ينقص إيمانُه بقدر كبيرته."]], "tr": [[1077.0, "Delil yönü şu sözüdür: «Kim bunlardan» —yani o büyük günahlardan— «birini işler de Allah onu örterse, onun işi Allah'a» Azze ve Celle'ye «kalmıştır; dilerse onu affeder, dilerse ona azap eder. Biz de buna biat ettik.» Bu, büyük günah işleyenin imanının tamamen bozulmadığına, ancak imanının büyük günahı kadar eksildiğine delildir."]]}, {"reader": false, "ar": [[1110.0, "ومنها كذلك ما في مسند الإمام أحمد وسنن أبي داود بإسنادٍ صحيحٍ لغيره،"], [1117.0, "من حديث عُبادة بن الصامت رضي الله عنهما،"], [1121.0, "قال: قال النبيّ صلى الله عليه وسلم:"], [1124.0, "«خمسُ صلواتٍ افترضهنّ الله على العباد، فمن حافظ على طُهورهنّ، وصلّاهنّ لميقاتهنّ، وأتمّ خشوعَهنّ وركوعَهنّ، كان له عهدٌ عند الله أن يغفر له، ومن لم يفعل ذلك لم يكن له عهدٌ عند الله، إن شاء عفا عنه وإن شاء عذّبه»."], [1147.0, "فهذا دليلٌ على أنّه ترك… على أنّ إخلاله بشيءٍ من هذه المأمورات الشرعيّة لم يُوجب انتقاضَ إيمانه بالكلّيّة."]], "tr": [[1110.0, "Bunlardan biri de Müsned-i İmam Ahmed'de ve Sünen-i Ebî Dâvûd'da sahîh li-gayrihî bir isnadla Ubâde b."], [1118.5, "es-Sâmit radıyallâhu anh'ın hadisinde bulunan şudur:"], [1121.4, "Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [1124.0, "«Allah'ın kullara farz kıldığı beş vakit namaz vardır. Kim onların abdestine dikkat eder, onları vaktinde kılar, huşûlarını ve rükûlarını tam yaparsa, Allah katında onu bağışlayacağına dair bir ahdi olur. Kim bunu yapmazsa Allah katında onun bir ahdi yoktur; dilerse onu affeder, dilerse ona azap eder.» Bu, onun terk ettiğine… bu şer'î emirlerden birinde kusur etmesinin imanının tamamen bozulmasını gerektirmediğine delildir."]]}, {"reader": false, "ar": [[1159.0, "ومنها أيضًا ما في صحيح الإمام مسلم من حديث أبي هريرة رضي الله عنه في عقوبة مانع الزكاة،"], [1168.2, "قال صلى الله عليه وسلم:"], [1171.0, "«ما من صاحب ذهبٍ ولا فضّةٍ لا يؤدّي منها حقَّها، إلا إذا كان يومُ القيامة صُفِّحت له صفائحُ من نار، فيُكوى بها جنبُه وجبينُه وظهرُه، كلّما بردت عليه أُعيدت، في يومٍ كان مقدارُه خمسين ألفَ سنة، حتى يُقضى بين العباد، فيرى سبيلَه إمّا إلى الجنة وإمّا إلى النار»."], [1198.0, "وهكذا ذكر في الإبل،"], [1200.8, "وهكذا ذكر في البقر والغنم."]], "tr": [[1159.0, "Bunlardan biri de Sahîh-i İmam Müslim'de Ebû Hüreyre radıyallâhu anh'ın hadisinde zekâtı vermeyenin cezası hakkında bulunan şudur:"], [1167.1, "Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [1171.0, "«Altın ve gümüş sahibi olup da onların hakkını ödemeyen hiç kimse yoktur ki kıyamet günü olduğunda onun için ateşten levhalar yapılmasın; bunlarla onun yanı, alnı ve sırtı dağlanır. Levhalar her soğudukça, miktarı elli bin yıl olan bir günde, kullar arasında hüküm verilinceye kadar ona tekrar (kızdırılıp) getirilir. Sonra yolunu ya cennete ya da cehenneme doğru görür.» Develer hakkında da sığır ve koyunlar hakkında da böyle zikretmiştir."]]}, {"reader": false, "ar": [[1205.0, "فكلُّ من منع شيئًا من الواجب عليه في الزكاة فتلك عقوبتُه،"], [1210.0, "ومنعُ إخراج الزكاة من الكبائر."], [1214.0, "فتعليقُ عقوبته بقوله: «ثم يرى… حتى يرى سبيلَه إمّا إلى الجنة وإمّا إلى النار» دليلٌ على أنّه لم ينتقض إيمانُه بهذه الكبيرة."]], "tr": [[1205.0, "Zekâtta üzerine vâcip olandan bir şeyi vermeyen herkesin cezası budur;"], [1209.5, "zekâtı vermemek de büyük günahlardandır."], [1214.0, "Cezasının «Sonra… (kullar arasında hüküm verilinceye) kadar, yolunu ya cennete ya da cehenneme doğru görür» sözüne bağlanması, onun imanının bu büyük günahla bozulmadığına delildir."]]}]}, {"ts": "20:30", "title": "3. Külliye (devam): «Zina etse de, hırsızlık yapsa da», kudsî hadis, bitâka hadisi ve şefaat", "paras": [{"reader": false, "ar": [[1230.0, "ومنها أيضًا قولُه صلى الله عليه وسلم في الصحيحين من حديث أبي هريرة رضي الله عنه:"], [1237.0, "«ما من عبدٍ قال لا إله إلا الله ثم مات على ذلك إلا دخل الجنة»."], [1245.0, "قال أبو ذرّ: وإن زنى وإن سرق؟"], [1249.0, "قال: «وإن زنى وإن سرق»."], [1252.0, "قلتُ: وإن زنى وإن سرق؟"], [1254.0, "قال: «وإن زنى وإن سرق»."], [1256.0, "قلتُ: وإن زنى وإن سرق؟"], [1258.0, "قال: «وإن زنى وإن سرق، على رَغم أنف أبي ذرّ»."], [1261.0, "والمرادُ بالحديث: أنّه مهما فعل من الكبائر فإنّها تُنقص إيمانَه الواجب،"], [1268.3, "ولكن لا تنقض أصلَ الإيمان."]], "tr": [[1230.0, "Bunlardan biri de Sahîhayn'de Ebû Hüreyre radıyallâhu anh'ın hadisinden (gelen) Peygamber sallallâhu aleyhi ve sellem'in şu sözüdür:"], [1237.0, "«Lâ ilâhe illallah deyip sonra bunun üzerine ölen hiçbir kul yoktur ki cennete girmesin.» Ebû Zer:"], [1245.0, "\"Zina etse de, hırsızlık yapsa da mı?\" dedi."], [1249.0, "«Zina etse de, hırsızlık yapsa da» buyurdu."], [1252.0, "\"Zina etse de, hırsızlık yapsa da mı?\" dedim."], [1254.0, "«Zina etse de, hırsızlık yapsa da» buyurdu."], [1256.0, "\"Zina etse de, hırsızlık yapsa da mı?\" dedim."], [1258.0, "«Ebû Zer'in burnu sürtülse de, zina etse de, hırsızlık yapsa da» buyurdu."], [1261.0, "Hadisten kastedilen şudur: Ne kadar büyük günah işlerse işlesin, bunlar onun vâcip imanını eksiltir, fakat imanın aslını bozmaz."]]}, {"reader": false, "ar": [[1272.0, "ومن الأحاديث أيضًا حديثُ أبي ذرّ رضي الله عنه قال:"], [1276.5, "قال النبيّ صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل أنّه قال:"], [1283.0, "«يا ابنَ آدم، لو لقيتني بقُراب الأرض خطيئةً لا تُشرك بي شيئًا، لَلقيتُك بقُرابها مغفرةً»،"], [1297.0, "ممّا يدلّ على أنّ الكبائر تُنقص ولا تنقض."], [1301.0, "قال الإمامُ ابنُ رجب رحمه الله:"], [1304.0, "«فمن جاء مع التوحيد بقُراب الأرض ـ وهو ملؤها أو ما يقارب ملأها ـ خطايا، لقيه الله بقُرابها مغفرةً، لكنّ هذا مع مشيئة الله عز وجل، فإن شاء غفر له، وإن شاء أخذه بذنوبه، ثم كان عاقبتُه ألّا يُخلَّد في النار، بل يخرج منها ثم يدخل الجنة»."], [1329.0, "انتهى كلامُه رحمه الله."]], "tr": [[1272.0, "Hadislerden biri de Ebû Zer radıyallâhu anh'ın hadisidir:"], [1276.5, "Peygamber sallallâhu aleyhi ve sellem, Rabbi Azze ve Celle'den rivayet ettiği hadiste O'nun şöyle buyurduğunu söyledi:"], [1283.0, "«Ey Âdemoğlu! Bana hiçbir şeyi ortak koşmadan, yeryüzü dolusu hatayla kavuşsan, ben de sana onun dolusu mağfiretle kavuşurum.» Bu da büyük günahların (imanı) eksiltip bozmadığını gösterir."], [1301.0, "İmam İbn Receb —Allah ona rahmet etsin— der ki:"], [1304.0, "\"Kim tevhidle birlikte yeryüzü dolusu —yani onun dolusu veya dolusuna yakın— hatayla gelirse, Allah onu o dolusu mağfiretle karşılar."], [1318.0, "Fakat bu, Allah Azze ve Celle'nin meşîetine bağlıdır:"], [1323.9, "Dilerse onu bağışlar, dilerse onu günahlarıyla sorgular (cezalandırır);"], [1329.0, "sonra onun akıbeti cehennemde ebedî kalmamak olur, aksine oradan çıkar, sonra cennete girer.\" Sözü bitti; Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[1331.0, "ومن الأدلّة أيضًا حديثُ البطاقة المعروف،"], [1335.0, "الذي يقول فيه النبيّ صلى الله عليه وسلم:"], [1340.0, "«يُنادى برجلٍ من أمّتي على رؤوس الخلائق يومَ القيامة، فيُنشر له تسعةٌ وتسعون سجلًّا، كلُّ سجلٍّ مدَّ البصر» إلى آخر الحديث المعروف."], [1353.0, "ووجهُ الشاهد منه: أنّ تلك السجلّات ـ مع ما فيها من الذنوب والكبائر ـ لم تنقض أصلَ الإيمان وأصلَ الإسلام من قلبه."]], "tr": [[1331.0, "Delillerden biri de meşhur bitâka (kart) hadisidir."], [1335.0, "Orada Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [1340.0, "«Kıyamet günü ümmetimden bir adam mahlûkatın gözü önünde çağrılır. Ona her biri göz alabildiğine uzanan doksan dokuz defter açılır» —meşhur hadisin sonuna kadar."], [1353.0, "Delil yönü şudur: O defterler, içlerindeki günahlar ve büyük günahlarla birlikte, onun kalbindeki imanın aslını ve İslam'ın aslını bozmamıştır."]]}, {"reader": false, "ar": [[1367.0, "ومن الأدلّة أيضًا قولُه صلى الله عليه وسلم:"], [1373.0, "«يخرج من النار من قال لا إله إلا الله وفي قلبه وزنُ شعيرةٍ من خير، ويخرج من النار من قال لا إله إلا الله وفي قلبه وزنُ بُرّةٍ من خير، ويخرج من النار من قال لا إله إلا الله وفي قلبه وزنُ ذرّةٍ من خير»،"], [1391.9, "وهو لم يدخل النارَ إلا بسبب ارتكاب الذنوب والكبائر،"], [1396.0, "فلو كانت ناقضةً لما كان له حظٌّ في الجنة أبدًا."]], "tr": [[1367.0, "Delillerden biri de Peygamber sallallâhu aleyhi ve sellem'in şu sözüdür:"], [1373.0, "«Lâ ilâhe illallah diyen ve kalbinde arpa ağırlığınca hayır bulunan cehennemden çıkar; Lâ ilâhe illallah diyen ve kalbinde buğday tanesi ağırlığınca hayır bulunan cehennemden çıkar; Lâ ilâhe illallah diyen ve kalbinde zerre ağırlığınca hayır bulunan cehennemden çıkar.» O kişi cehenneme ancak günahlar ve büyük günahlar işlemesi sebebiyle girmiştir."], [1395.1, "Eğer (bunlar imanı) bozucu olsaydı, onun cennette asla bir payı olmazdı."]]}]}, {"ts": "23:24", "title": "3. Külliye (devam): «Himâr» lakaplı sahabînin hadisi ve hadlerin uygulanması", "paras": [{"reader": false, "ar": [[1404.0, "ومنها أيضًا ما رواه عمرُ بن الخطاب رضي الله عنه في رجلٍ من أصحاب النبيّ صلى الله عليه وسلم،"], [1418.5, "كان اسمُه عبدَ الله،"], [1421.0, "وكان يُلقَّب حمارًا، وكان يُضحك رسولَ الله صلى الله عليه وسلم،"], [1427.0, "وكان النبيّ صلى الله عليه وسلم قد جلده في الشراب،"], [1431.0, "فأُتي به يومًا فأمر به فجُلد،"], [1437.0, "فقال رجلٌ من القوم:"], [1439.7, "اللهمّ العنه، ما أكثرَ ما يُؤتى به!"], [1443.0, "فقال النبيّ صلى الله عليه وسلم:"], [1446.0, "«لا تلعنوه، فوالله ما علمتُ إلا أنّه يحبّ اللهَ ورسولَه»،"], [1453.0, "أو كما قال صلى الله عليه وسلم."]], "tr": [[1404.0, "Bunlardan biri de Ömer b."], [1408.9, "el-Hattâb radıyallâhu anh'ın Peygamber sallallâhu aleyhi ve sellem'in ashâbından bir adam hakkında rivayet ettiği şudur:"], [1425.4, "Adı Abdullah idi, \"Himâr\" (eşek) diye lakaplanırdı ve Resûlullah sallallâhu aleyhi ve sellem'i güldürürdü."], [1439.7, "Peygamber sallallâhu aleyhi ve sellem onu içki sebebiyle celde vurdurmuştu."], [1441.4, "Bir gün yine getirildi; emretti ve celde vuruldu."], [1443.0, "Topluluktan bir adam: \"Allah'ım ona lanet et!"], [1444.5, "Ne kadar çok getiriliyor!\" dedi."], [1446.0, "Bunun üzerine Peygamber sallallâhu aleyhi ve sellem:"], [1449.2, "«Ona lanet etmeyin! Vallahi ben onun ancak Allah'ı ve Resûlü'nü sevdiğini biliyorum» buyurdu —ya da sallallâhu aleyhi ve sellem'in dediği gibi."]]}, {"reader": false, "ar": [[1455.0, "ووجهُ الدلالة منه واضحةٌ جدًّا في أنّ الكبائر لا تنقض أصلَ الإيمان؛"], [1461.0, "فالحديث صريحٌ هنا ببقاء محبّة الله ورسوله ـ وهي من أعظم أصول الإيمان القلبيّ ـ مع تكرار شربه للخمر."], [1473.0, "قال الإمامُ ابنُ حجر رحمه الله تعالى:"], [1477.0, "«وفيه» ـ أي في هذا الحديث ـ «الردُّ على من زعم أنّ مرتكب الكبيرة كافرٌ، لثبوت النهي عن لعنه والأمر بالدعاء له. وفيه أن لا تنافيَ بين ارتكاب النهي وثبوت محبّة الله ورسوله في قلب المرتكب، لأنّه صلى الله عليه وسلم أخبر بأنّ المذكور يحبّ الله ورسوله مع وجود ما صدر منه». انتهى كلامُه."]], "tr": [[1455.0, "Büyük günahların imanın aslını bozmadığına dair bu hadisin delâlet yönü çok açıktır."], [1461.0, "Hadis burada, içki içmeyi tekrarlamasına rağmen —kalbî imanın en büyük asıllarından olan— Allah ve Resûlü sevgisinin baki kaldığını açıkça ifade etmektedir."], [1473.0, "İmam İbn Hacer —Allah Teâlâ ona rahmet etsin— der ki:"], [1474.7, "\"Bunda\" —yani bu hadiste— \"büyük günah işleyenin kâfir olduğunu iddia edene reddiye vardır;"], [1477.0, "çünkü ona lanet etmenin yasaklandığı ve ona dua etmenin emredildiği sabittir."], [1483.0, "Yine bunda, yasaklananı işlemek ile işleyenin kalbinde Allah ve Resûlü sevgisinin bulunması arasında bir çelişki olmadığı (anlaşılır);"], [1495.1, "çünkü Peygamber sallallâhu aleyhi ve sellem, ondan sadır olana rağmen o kişinin Allah'ı ve Resûlü'nü sevdiğini haber vermiştir.\" Sözü bitti."]]}, {"reader": false, "ar": [[1507.0, "ومن الأدلّة أيضًا على أنّ الكبائر ليست بناقضة:"], [1513.0, "وجوبُ تطبيق الحدود على من ارتكب شيئًا من هذه الكبائر."], [1519.0, "قال الإمامُ أبو عُبيد رحمه الله تعالى:"], [1525.0, "«قد وجدنا الله تبارك وتعالى يُكذّب مقالتَهم، وذلك أنّه حكم في السارق بقطع اليد، وفي الزاني والقاذف بالجلد، ولو كان الذنبُ يُكفّر صاحبَه ما كان الحكمُ على هؤلاء إلا بالقتل، لأنّ الرسول صلى الله عليه وسلم قال: من بدّل دينه فاقتلوه. أفلا ترى أنّهم لو كانوا كفّارًا لما كانت عقوباتُهم القطعَ والجلد؟"]], "tr": [[1507.0, "Büyük günahların (imanı) bozmadığının delillerinden biri de bu büyük günahlardan birini işleyene hadlerin uygulanmasının vâcip olmasıdır."], [1513.0, "İmam Ebû Ubeyd —Allah Teâlâ ona rahmet etsin— der ki:"], [1516.0, "\"Allah Tebâreke ve Teâlâ'nın onların sözünü yalanladığını görüyoruz."], [1519.0, "Çünkü O, hırsız hakkında elin kesilmesine, zina eden ve zina iftirası atan hakkında celdeye hükmetmiştir."], [1525.0, "Eğer günah sahibini kâfir yapsaydı, bunlar hakkındaki hüküm ancak öldürme olurdu;"], [1536.2, "çünkü Resûl sallallâhu aleyhi ve sellem 'Dinini değiştireni öldürün' buyurmuştur."], [1547.3, "Görmüyor musun ki onlar kâfir olsalardı cezaları el kesme ve celde olmazdı?"]]}, {"reader": false, "ar": [[1559.0, "وكذلك قولُ الله عز وجل فيمن قُتل مظلومًا:"], [1563.0, "<span class=\"ayah\">﴿فَقَدْ جَعَلْنَا لِوَلِيِّهِ سُلْطَانًا﴾<\/span> [الإسراء: 33]،"], [1566.0, "فلو كان القتلُ كفرًا ما كان للوليّ عفوٌ ولا أخذُ ديةٍ،"], [1574.0, "ولزمه القتل». انتهى كلامُه."]], "tr": [[1559.0, "Aynı şekilde Allah Azze ve Celle'nin zulmen öldürülen hakkındaki sözü:"], [1563.0, "<span class=\"ayah\">﴿Biz onun velisine yetki vermişizdir.﴾<\/span> [İsrâ 33] Eğer öldürmek küfür olsaydı, velinin affetme ve diyet alma hakkı olmazdı ve (katili) öldürmek lâzım gelirdi.\" Sözü bitti."]]}, {"reader": false, "ar": [[1577.0, "وقال الإمامُ ابنُ تيميّة رحمه الله:"], [1580.6, "«القرآنُ والنقلُ المتواتر عنه يُبيّن أنّ هؤلاء لهم عقوباتٌ غيرُ عقوبة المرتدّ عن الإسلام، كما ذكر الله عز وجل في القرآن جلدَ القاذف والزاني وقطعَ يد السارق، وهذا متواترٌ عن النبيّ صلى الله عليه وسلم، ولو كانوا مرتدّين لقتلهم، فكلا القولين ممّا يُعلم فسادُه بالاضطرار من دين الإسلام»."], [1607.7, "انتهى كلامُه. وقال ابنُ أبي العزّ الحنفيّ رحمه الله:"], [1613.0, "«نصوصُ الكتاب والسنة والإجماع تدلّ على أنّ الزاني والسارق والقاذف لا يُقتل، بل يُقام عليه الحدّ، فدلّ على أنّه ليس بمرتدّ». انتهى كلامُه."]], "tr": [[1577.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— der ki:"], [1580.6, "\"Kur'an ve ondan (Peygamber'den) mütevâtir nakil, bunların İslam'dan dönen mürtedin cezasından başka cezaları olduğunu açıklar."], [1591.1, "Nitekim Allah Azze ve Celle Kur'an'da zina iftirası atana ve zina edene celdeyi, hırsızın elinin kesilmesini zikretmiştir;"], [1602.1, "bu, Peygamber sallallâhu aleyhi ve sellem'den mütevâtirdir."], [1607.7, "Eğer mürted olsalardı onları öldürürdü."], [1609.0, "Her iki görüş de İslam dininden zarurî olarak fesadı bilinen şeylerdendir.\" Sözü bitti."], [1613.0, "İbn Ebi'l-İz el-Hanefî —Allah ona rahmet etsin— der ki:"], [1615.5, "\"Kitap, Sünnet ve icmâ nassları, zina eden, hırsızlık yapan ve zina iftirası atanın öldürülmeyip ona had uygulanacağına delâlet eder;"], [1621.2, "bu da onun mürted olmadığını gösterir.\" Sözü bitti."]]}]}, {"ts": "27:04", "title": "3. Külliye (devam): İcmâ nakilleri", "paras": [{"reader": false, "ar": [[1624.0, "ومن الأدلّة أيضًا الإجماعُ الذي ذكرتُه لكم بالنقول عمّن ذكرتُهم في أوّل هذه الكلّيّة،"], [1638.0, "وأزيدُهم نقلًا وأقول: قال زهيرُ بن عبّاد رحمه الله تعالى:"], [1648.0, "«كلُّ من أدركتُ من المشايخ ـ مالكُ بن أنس، وسفيانُ بن عيينة، وعيسى بن يونس، وفُضيل بن عياض، وعبدُ الله بن المبارك، ووكيعُ بن الجرّاح، وغيرُهم ـ لا يُكفّرون أحدًا بذنب، ولا يشهدون لأحدٍ أنّه في الجنة وإن لم يعصِ الله، ولا أنّه في النار وإن عمل الكبائر، ومن خالف هذا فهو عندهم مبتدع». انتهى كلامُه."]], "tr": [[1624.0, "Delillerden biri de bu külliyenin başında zikrettiğim kimselerden yaptığım nakillerle size zikrettiğim icmâdır."], [1628.7, "Onlara bir nakil daha ekleyerek derim ki:"], [1632.0, "Züheyr b. Abbâd —Allah Teâlâ ona rahmet etsin— der ki:"], [1645.0, "\"Yetiştiğim bütün şeyhler —Mâlik b."], [1646.3, "Enes, Süfyân b. Uyeyne, Îsâ b."], [1648.0, "Yûnus, Fudayl b. İyâz, Abdullah b."], [1651.9, "el-Mübârek, Vekî' b. el-Cerrâh ve diğerleri— hiç kimseyi bir günah sebebiyle tekfir etmez, Allah'a isyan etmemiş olsa bile hiç kimse için cennette olduğuna, büyük günahlar işlemiş olsa bile cehennemde olduğuna şahitlik etmezlerdi."], [1671.3, "Buna muhalefet eden, onlara göre bid'atçıdır.\" Sözü bitti."]]}, {"reader": false, "ar": [[1678.0, "وقال الإمامُ الشافعيّ في وصيّته المشهورة:"], [1681.0, "«لا أُكفّر أحدًا من أهل التوحيد بذنبٍ وإن عمل بالكبائر، وأَكِلُهم إلى الله عز وجل»."], [1688.0, "انتهى كلامُه. قال الإمامُ أحمد بن حنبل رحمه الله:"], [1692.5, "«أجمع تسعون رجلًا من التابعين وأئمّة المسلمين وأئمّة السلف وفقهاء الأمصار على أنّ السنّة التي تُوفّي عنها رسولُ الله صلى الله عليه وسلم: ألّا نُكفّر أحدًا من أهل التوحيد وإن عملوا الكبائر». انتهى كلامُه."]], "tr": [[1678.0, "İmam Şâfiî meşhur vasiyetinde der ki:"], [1681.0, "\"Tevhid ehlinden hiç kimseyi, büyük günahlar işlese bile bir günah sebebiyle tekfir etmem;"], [1684.3, "onları Allah Azze ve Celle'ye havale ederim.\" Sözü bitti."], [1688.0, "İmam Ahmed b. Hanbel —Allah ona rahmet etsin— der ki:"], [1692.5, "\"Tâbiînden, Müslümanların imamlarından, selefin imamlarından ve şehirlerin fakihlerinden doksan kişi, Resûlullah sallallâhu aleyhi ve sellem'in üzerinde vefat ettiği sünnetin şu olduğu üzerinde icmâ etmiştir:"], [1703.5, "Tevhid ehlinden hiç kimseyi, büyük günahlar işleseler bile tekfir etmememiz.\" Sözü bitti."]]}, {"reader": false, "ar": [[1712.0, "وقال أيضًا رحمه الله تعالى:"], [1714.0, "«من مات من أهل القبلة موحِّدًا يُصلّى عليه ويُستغفر له، ولا يُحجب عنه الاستغفار، ولا تُترك الصلاةُ عليه لذنبٍ أذنبه، صغيرًا كان أو كبيرًا، أمرُه إلى الله عز وجل»."], [1732.0, "وقال الإمامُ المزنيّ رحمه الله:"], [1734.0, "«لا يخرجون بالذنوب من الإيمان، ولا يكفرون بركوب كبيرةٍ ولا عصيان»،"], [1741.0, "أي أهلُ السنة والجماعة."]], "tr": [[1712.0, "Yine (Ahmed) —Allah Teâlâ ona rahmet etsin— der ki:"], [1714.0, "\"Kıble ehlinden muvahhid olarak ölenin cenaze namazı kılınır ve onun için istiğfar edilir."], [1721.2, "İstiğfar ondan esirgenmez; işlediği, küçük veya büyük bir günah sebebiyle cenaze namazı terk edilmez."], [1732.0, "Onun işi Allah Azze ve Celle'ye kalmıştır.\" İmam Müzenî —Allah ona rahmet etsin— der ki:"], [1737.0, "\"Günahlar sebebiyle imandan çıkmazlar; büyük günah ve isyan işlemekle kâfir olmazlar.\" Yani Ehl-i Sünnet ve'l-Cemaat."]]}, {"reader": false, "ar": [[1743.0, "وقال الإمامُ محمّد بن نصر المروزيّ رحمه الله:"], [1747.0, "«إنّ المُصِرّ على ما دون الشرك حتى يموت مؤمنٌ غيرُ كافرٍ ولا مشرك، وهو بين خوفٍ ورجاء، يخاف أن يعاقبه الله على معصيته إيّاه بما استحقّ من العقوبة، ونرجو أن يتفضّل الله عليه فيعفوَ عنه ويغفرَ له»."]], "tr": [[1743.0, "İmam Muhammed b. Nasr el-Mervezî —Allah ona rahmet etsin— der ki:"], [1744.5, "\"Ölünceye kadar şirkten aşağı olan (günahlarda) ısrar eden kimse, kâfir ve müşrik olmayan bir mümindir."], [1747.0, "O, korku ile ümit arasındadır:"], [1751.4, "Allah'ın, O'na isyanı sebebiyle hak ettiği cezayla onu cezalandırmasından korkar;"], [1758.8, "biz de Allah'ın ona lütufta bulunup onu affetmesini ve bağışlamasını umarız.\""]]}, {"reader": false, "ar": [[1767.0, "وقال الإمامُ ابنُ خزيمة ـ وبه أختم ـ:"], [1769.0, "«كلُّ مرتكبِ معصيةٍ زجر الله عنها فقد أغواه إبليس، والله عز وجل قد يشاء غفرانَ كلِّ معصيةٍ يرتكبها المسلمُ دون الشرك وإن لم يتب منها، كذلك أعلمنا في محكم تنزيله» <span class=\"note\">(يكررها)<\/span> «في قوله: <span class=\"ayah\">﴿وَيَغْفِرُ مَا دُونَ ذَٰلِكَ لِمَن يَشَاءُ﴾<\/span> [النساء: 48]» <span class=\"note\">(يكررها)<\/span>."]], "tr": [[1767.0, "İmam İbn Huzeyme —ki onunla bitiriyorum— der ki:"], [1768.0, "\"Allah'ın yasakladığı bir masiyeti işleyen herkesi İblis azdırmıştır."], [1769.0, "Allah Azze ve Celle, Müslüman'ın işlediği şirkten aşağı her masiyeti, ondan tövbe etmemiş olsa bile bağışlamayı dileyebilir."], [1781.5, "Muhkem tenzilinde (Kur'an'ında) bize böyle bildirmiştir\" (tekrar ediyor), \"şu sözünde:"], [1788.0, "<span class=\"ayah\">﴿Bundan aşağısını dilediği kimse için bağışlar.﴾<\/span> [Nisâ 48]\" (tekrar ediyor)."]]}, {"reader": false, "ar": [[1796.0, "وأمّا الجزئيّةُ الثانية ـ انتبهوا ـ وأمّا الجزئيّةُ الثانية الدالّةُ على أنّ ارتكابها مُنقِّص،"], [1810.0, "فهي الأدلّةُ التي ذكرتُها لكم في الكلّيّة الأولى من هذا الدرس،"], [1815.0, "وهي كلُّ دليلٍ ينفي الإيمان،"], [1818.7, "فهمتموها؟ وهي أنّ كلَّ دليلٍ ينفي الإيمانَ عن فاعل الكبيرة فإنّه يدلّ على نقصان إيمانه."]], "tr": [[1796.0, "İkinci cüze gelince —dikkat edin— (günahları) işlemenin (imanı) eksilttiğini gösteren ikinci cüze gelince, onun delilleri bu dersin 1."], [1813.2, "külliyesinde size zikrettiğim delillerdir; yani imanı nefyeden her delil."], [1820.0, "Anladınız mı? Yani büyük günah işleyenden imanı nefyeden her delil, onun imanının eksildiğini gösterir."]]}, {"reader": false, "ar": [[1831.0, "وأيضًا كلُّ حديثٍ يُثبت الشفاعةَ في أهل الكبائر ـ وهي أحاديثُ متواترة ـ بأنّ طائفةً من أهل التوحيد يدخلون النارَ بكبائرهم ثم يخرجون منها بشفاعة الشافعين؛"], [1850.0, "فكلُّ حديثٍ يُثبت الشفاعةَ في أصحاب الكبائر يومَ القيامة فإنّه من الأدلّة الدالّة على أنّ الذنوبَ مُنقِّصة. والله أعلم."]], "tr": [[1831.0, "Yine büyük günah ehli hakkında şefaati isbat eden her hadis —ki bunlar mütevâtir hadislerdir—, tevhid ehlinden bir grubun büyük günahları sebebiyle cehenneme girip sonra şefaatçilerin şefaatiyle oradan çıkacağını (bildirir)."], [1850.6, "Kıyamet günü büyük günah sahipleri hakkında şefaati isbat eden her hadis, günahların (imanı) eksilttiğini gösteren delillerdendir. Allah en iyisini bilir."]]}]}, {"ts": "31:04", "title": "4. Külliye: Günahların imanı eksiltmesini reddeden herkes Mürcie'nin aşırılarındandır", "paras": [{"reader": false, "ar": [[1864.0, "ومن الكلّيّات أيضًا: <b>كلُّ من نفى تأثيرَ الذنوب في نقص الإيمان فمن غُلاة المرجئة.<\/b> لا تقل:"], [1878.0, "«من المرجئة»، قل: «من غُلاة المرجئة»."], [1880.8, "<span class=\"note\">(يكررها)<\/span> <b>كلُّ من نفى تأثيرَ الذنوب في نقص الإيمان فمن غُلاة المرجئة.<\/b>"]], "tr": [[1864.0, "Külliyelerden biri de şudur: 4."], [1867.0, "külliye: Günahların imanı eksiltmedeki etkisini nefyeden herkes Mürcie'nin aşırılarındandır. \"Mürcie'dendir\" deme;"], [1878.0, "\"Mürcie'nin aşırılarındandır\" de. (Tekrar ediyor.) <b>Günahların imanı eksiltmedeki etkisini nefyeden herkes Mürcie'nin aşırılarındandır.<\/b>"]]}, {"reader": false, "ar": [[1897.0, "أقول وبالله التوفيق: يُنسب إلى بعض المرجئة أنّهم قالوا:"], [1904.0, "«لا يضرّ مع الإيمان ذنب»،"], [1906.0, "لكن لا يُعرف قائلٌ معيّنٌ يقول ذلك،"], [1910.0, "ولعلّ هذا قولُ بعض غُلاتهم،"], [1915.0, "نُقل عنه وأقرّوه، ولكن لا يُنسب في أوائل أمره إلى قائلٍ معيّن."], [1924.0, "ومقتضى ذلك أنّ تارك الصلاة والزكاة والصيام غيرُ مُعرَّضٍ للوعيد،"], [1935.0, "ومن المعلوم أنّ هذا خلافُ الكتاب والسنة والإجماع."]], "tr": [[1897.0, "Tevfik Allah'tandır, derim ki: Mürcie'nin bazılarına \"İmanla birlikte hiçbir günah zarar vermez\" dedikleri nispet edilir;"], [1899.0, "fakat bunu söyleyen belirli bir kişi bilinmemektedir."], [1904.0, "Belki bu, onların aşırılarından bazılarının sözüdür;"], [1907.1, "ondan nakledilmiş ve onlar da bunu kabul etmişlerdir."], [1915.9, "Fakat işin başlangıcında belirli bir kişiye nispet edilmez."], [1924.0, "Bunun gereği, namazı, zekâtı ve orucu terk edenin tehdide (vaîde) maruz olmamasıdır."], [1930.3, "Bunun Kitap'a, Sünnet'e ve icmâya aykırı olduğu ise bilinen bir şeydir."]]}, {"reader": false, "ar": [[1940.0, "بل حكم جمعٌ من أهل السنة على أنّ من اعتقد بأنّه لا يضرّ مع الإيمان ذنبٌ بأنّه كافر،"], [1953.0, "لأنّه قولٌ يتضمّن التكذيبَ بنصوص الوعيد."], [1959.0, "وهذا خلافُ قول مرجئة الفقهاء،"], [1963.0, "فإنّ مرجئة الفقهاء موافقون لأهل السنة في أنّ فاعل الكبيرة مستحقٌّ للذمّ <span class=\"q\">؟ 32:52<\/span> والعقاب، وأنّه تحت المشيئة."]], "tr": [[1940.0, "Hatta Ehl-i Sünnet'ten bir topluluk, imanla birlikte hiçbir günahın zarar vermeyeceğine inanan kimsenin kâfir olduğuna hükmetmiştir;"], [1950.0, "çünkü bu söz, vaîd (tehdit) nasslarını yalanlamayı içerir."], [1953.8, "Bu, fakihlerin Mürcie'sinin görüşüne aykırıdır."], [1959.0, "Çünkü fakihlerin Mürcie'si, büyük günah işleyenin yergiyi <span class=\"q\">؟<\/span> ve cezayı hak ettiği ve (Allah'ın) meşîeti altında olduğu konusunda Ehl-i Sünnet'e muvafıktır."]]}, {"reader": false, "ar": [[1980.0, "والكلامُ في هذه الكلّيّة إنّما هو مع من ينفي تأثيرَ الذنوب في الإيمان مطلقًا،"], [1991.0, "فيقول: لا يضرّ مع الإيمان ذنب،"], [1994.0, "كما لا ينفع مع الكفر إيمان."], [1997.0, "فإذا قال الإنسان: أشهد أن لا إله إلا الله،"], [2001.5, "وآمن، لا يضرّه على قولهم أيُّ ذنب،"], [2006.0, "حتى لو ارتكب جميعَ الجرائم والكبائر."], [2010.0, "حتى قال قائلُهم: لو هدم المساجد،"], [2014.3, "وقتل الأنبياءَ والرسل، وداس المصحفَ بقدميه،"], [2021.1, "ما دام قلبُه لا يزال مصدِّقًا ـ فلو ارتكب جميعَ الجرائم والكبائر ـ فهو مؤمنٌ كاملُ الإيمان يدخل الجنةَ من أوّل وهلة."], [2038.0, "ومن المعلوم أنّ هذا من أبطل الباطل."]], "tr": [[1980.0, "Bu külliyedeki söz, ancak günahların imandaki etkisini mutlak olarak nefyeden kimseyle ilgilidir."], [1987.4, "O, \"Küfürle birlikte iman fayda vermediği gibi, imanla birlikte de hiçbir günah zarar vermez\" der."], [1997.0, "İnsan \"Eşhedü en lâ ilâhe illallah\" deyip iman ettiğinde, onların görüşüne göre ona hiçbir günah zarar vermez;"], [2005.3, "bütün suçları ve büyük günahları işlese bile."], [2010.0, "Hatta onlardan biri şöyle demiştir:"], [2012.1, "Mescitleri yıksa, peygamberleri ve resulleri öldürse, Mushaf'ı ayaklarıyla çiğnese bile, kalbi hâlâ tasdik ettiği sürece —bütün suçları ve büyük günahları işlese bile— o, imanı kâmil bir mümindir ve cennete ilk anda girer."], [2038.0, "Bunun bâtılın en bâtılı olduğu ise bilinen bir şeydir."]]}]}, {"ts": "34:02", "title": "4. Külliye (devam): İbn Teymiyye'nin sözü; Eş'arî, Bağdâdî ve Tahâvî'nin nakilleri", "paras": [{"reader": false, "ar": [[2042.0, "ولذلك قال أبو العبّاس ابنُ تيميّة رحمه الله:"], [2046.0, "«وإن قالوا: إنّه لا يضرّه تركُ العمل، فهذا كفرٌ صريح. وبعضُ الناس يحكي هذا عنهم، وأنّهم يقولون: إنّ الله فرض على العباد فرائضَ ولم يُرِد منهم أن يعملوها، ولا يضرّهم تركُها. وهذا قد يكون قولَ الغالية» ـ لذلك قلتُ:"], [2075.2, "غُلاة المرجئة ـ قال: «وهذا قد يكون قولَ الغالية الذين يقولون: لا يدخل النارَ من أهل التوحيد أحد. لكن ما علمتُ معيَّنًا أحكي عنه هذا القول، وإنّما الناسُ يحكونه في الكتب ولا يُعيّنون قائلَه. وقد يكون قولَ من لا خَلاقَ له، فإنّ كثيرًا من الفسّاق والمنافقين يقولون: لا يضرّ مع الإيمان ذنب، أو مع التوحيد. وبعضُ كلام الرادّين على المرجئة وصفهم بهذا». انتهى كلامُه."]], "tr": [[2042.0, "Bu yüzden Ebu'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— der ki:"], [2043.5, "\"Eğer 'Ameli terk etmek ona zarar vermez' derlerse, bu apaçık küfürdür."], [2045.0, "Bazı insanlar bunu onlardan nakleder;"], [2046.0, "onların şöyle dediklerini (söyler): 'Allah kullara farzlar farz kılmış, fakat onlardan bunları yapmalarını istememiştir;"], [2054.8, "bunları terk etmek onlara zarar vermez.' Bu, aşırıların (Gâliye'nin) sözü olabilir.\" —Bu yüzden \"Mürcie'nin aşırıları\" dedim.— (İbn Teymiyye) diyor ki:"], [2066.0, "\"Bu, 'Tevhid ehlinden hiç kimse cehenneme girmez' diyen aşırıların sözü olabilir."], [2075.2, "Fakat bu sözü kendisinden nakledeceğim belirli bir kişi bilmiyorum;"], [2075.7, "insanlar bunu kitaplarda naklediyorlar, ama söyleyenini belirlemiyorlar."], [2076.9, "Bu, (dinden) nasibi olmayan kimsenin sözü de olabilir;"], [2084.4, "zira fâsıkların ve münafıkların çoğu 'İmanla —ya da tevhidle— birlikte hiçbir günah zarar vermez' der."], [2099.0, "Mürcie'ye reddiye yazanların sözlerinin bir kısmı da onları bununla nitelemiştir.\" Sözü bitti."]]}, {"reader": false, "ar": [[2111.0, "وهذه العبارةُ لا تزال كتبُ أهل السنة والجماعة تنسبها إلى غُلاة المرجئة؛"], [2122.0, "فعلى سبيل المثال نقلها عنهم الأشعريُّ في «المقالات»،"], [2127.0, "ونقلها عنهم كذلك البغداديُّ في «الفَرق بين الفِرَق»،"], [2132.0, "وإن لم ينسبوه إلى قائلٍ معيّن،"], [2136.0, "لكنّه أمرٌ موجودٌ منقولٌ في كتب أهل الإرجاء،"], [2141.0, "وفي كتب من ردّ على أهل الإرجاء من أهل السنة والجماعة."]], "tr": [[2111.0, "Bu ifadeyi Ehl-i Sünnet ve'l-Cemaat'in kitapları hâlâ Mürcie'nin aşırılarına nispet etmektedir."], [2122.0, "Meselâ Eş'arî onu onlardan el-Makâlât'ta nakletmiş, Bağdâdî de onlardan el-Fark beyne'l-Fırak'ta nakletmiştir;"], [2128.9, "her ne kadar onu belirli bir kişiye nispet etmemiş olsalar da."], [2136.0, "Fakat bu, irca ehlinin kitaplarında ve Ehl-i Sünnet ve'l-Cemaat'ten irca ehline reddiye yazanların kitaplarında mevcut ve nakledilen bir şeydir."]]}, {"reader": false, "ar": [[2147.0, "وقال الإمامُ الطحاويّ رحمه الله تعالى ـ حاكيًا هذا القولَ ورادًّا له ـ:"], [2158.0, "«ولا نقول: لا يضرّ مع الإيمان ذنبٌ لمن عمله»."], [2164.0, "انتهى كلامُه. والخلاصةُ أنّ هذا القول ـ أي قول:"], [2168.9, "لا يضرّ مع الإيمان ذنب ـ قولٌ مخالفٌ للقرآن،"], [2174.0, "وللسنة، وللمعقول، وللإجماع؛ فهو قولٌ فاسدٌ لا قيمةَ له ولا يُعتبر به،"], [2183.0, "لأنّه لا يستند إلى دليلٍ شرعيّ،"], [2186.0, "ولا عقليّ، ولا وضعيّ،"], [2188.0, "وإنّما هو قولٌ مبنيٌّ على خيالاتٍ وشبهاتٍ وهوى،"], [2192.4, "فلا يُلتفت إليه. والله أعلم."]], "tr": [[2147.0, "İmam Tahâvî —Allah Teâlâ ona rahmet etsin— bu sözü nakledip reddederek der ki:"], [2158.0, "\"İmanla birlikte, onu işleyene hiçbir günah zarar vermez de demeyiz.\" Sözü bitti."], [2164.0, "Özetle bu söz —yani \"İmanla birlikte hiçbir günah zarar vermez\" sözü— Kur'an'a, Sünnet'e, akla ve icmâya aykırı bir sözdür."], [2170.6, "Bu, değeri olmayan ve itibar edilmeyen fâsit bir sözdür;"], [2179.0, "çünkü ne şer'î, ne aklî, ne de vaz'î (dilsel) bir delile dayanır."], [2185.0, "O ancak hayaller, şüpheler ve heva üzerine kurulmuş bir sözdür;"], [2190.7, "ona iltifat edilmez. Allah en iyisini bilir."]]}]}, {"ts": "36:35", "title": "5. Külliye: Küfrü kalbin inkârına hasreden herkes Mürcie'dendir", "paras": [{"reader": false, "ar": [[2195.0, "ومن الكلّيّات أيضًا: <b>كلُّ من حصر الكفرَ بجحود القلب فمن المرجئة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2195.0, "Külliyelerden biri de şudur: 5."], [2197.6, "külliye: Küfrü kalbin inkârına hasreden herkes Mürcie'dendir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2202.0, "أقول وبالله التوفيق: وهذا من أفسد الأصول التي بناها المرجئةُ في مذهبهم،"], [2222.0, "أي انحصارُ الإيمان في التصديق القلبيّ فقط،"], [2226.0, "وحصرُ الكفر في جحود القلب فقط."], [2231.0, "فكما أنّنا وصفناهم بالإرجاء لمّا حصروا الإيمانَ في التصديق،"], [2239.0, "فكذلك مرّةً أخرى نصفهم بالإرجاء لمّا حصروا الكفرَ في الجحود والتكذيب."]], "tr": [[2202.0, "Tevfik Allah'tandır, derim ki: Bu, Mürcie'nin mezheplerinde üzerine bina ettikleri en fâsit asıllardandır;"], [2222.0, "yani imanın sadece kalbî tasdikle sınırlı olması ve küfrün sadece kalbin inkârına hasredilmesi."], [2231.0, "İmanı tasdike hasrettikleri için onları irca ile nitelediğimiz gibi, küfrü inkâr ve yalanlamaya hasrettikleri için de onları bir kez daha irca ile nitelendiriyoruz."]]}, {"reader": false, "ar": [[2249.0, "فإنّ قائلَهم يقول بأنّ الأعمال التي ظاهرُها كفرٌ إنّما هي عبارةٌ عنه،"], [2256.6, "ولكنّ من فعلها لا يُحكم عليه بمقتضاها ما دام قلبُه لا يزال مصدِّقًا،"], [2264.9, "غيرَ جاحدٍ ولا مكذِّب."], [2276.0, "فمهما فعل الإنسانُ من الكفريّات الظاهرة،"], [2281.0, "فما دام قلبُه لا يزال مصدِّقًا فإنّه مؤمنٌ كاملُ الإيمان."]], "tr": [[2249.0, "Onlardan biri, zahiri küfür olan amellerin ancak ona (küfre) delâlet eden bir ifade olduğunu, fakat kalbi hâlâ tasdik edip inkâr etmediği ve yalanlamadığı sürece onu işleyen kimse hakkında bunun gereğiyle hüküm verilmeyeceğini söyler."], [2276.8, "İnsan zahirî küfür fiillerinden ne yaparsa yapsın, kalbi hâlâ tasdik ettiği sürece imanı kâmil bir mümindir."]]}, {"reader": false, "ar": [[2288.0, "فلو أنّه سجد للصنم،"], [2294.0, "وأهان المصحف، وسبّ الرسولَ صلى الله عليه وسلم،"], [2300.0, "وغيرَ ذلك من أنواع الكفر،"], [2303.0, "فإنّه لا بدّ أن يُنظر في قلبه:"], [2307.0, "هل جحد أو لا يزال مصدِّقًا؟"], [2310.0, "فإن جحد فيكون كافرًا،"], [2313.0, "وإن كان لا يزال مصدِّقًا فإنّ ذلك لا يدلّ على كفره بعينه."], [2320.0, "أنتم معي ولّا لا؟"]], "tr": [[2288.0, "Puta secde etse, Mushaf'a hakaret etse, Resûl sallallâhu aleyhi ve sellem'e sövse ve bunun dışındaki küfür türlerini işlese bile, mutlaka kalbine bakılmalıdır:"], [2307.0, "İnkâr mı etti, yoksa hâlâ tasdik mi ediyor?"], [2310.0, "İnkâr ettiyse kâfir olur; hâlâ tasdik ediyorsa bu, onun bizzat küfrüne delâlet etmez. Benimle misiniz, değil misiniz?"]]}, {"reader": false, "ar": [[2325.0, "وقد أجاب أهلُ السنة والجماعة رحمهم الله تعالى عن ذلك بقولهم:"], [2331.0, "إنّ الإيمان ليس في القلب فقط،"], [2335.2, "وإنّما الإيمانُ ثلاثةُ أركان:"], [2338.1, "فمنها ما يرجع إلى تصديق القلوب،"], [2342.3, "ومنها ما يرجع إلى نطق اللسان،"], [2345.8, "ومنها ما يرجع إلى عمل الجوارح والأركان."], [2350.0, "فكما أنّ الإيمان متوزّعٌ على هذه الأشياء فالكفرُ مثلُه:"], [2355.0, "فمن الكفر ما يرجع إلى تصديق القلب،"], [2360.0, "ومن الكفر ما يرجع إلى عدم النطق باللسان،"], [2365.0, "ومن الكفر ما يرجع إلى أمرٍ لم يعمل الإنسانُ به."], [2370.0, "فهناك كفرٌ قلبيّ، وكفرٌ لسانيّ،"], [2376.0, "وكفرٌ عمليّ. هذا الجوابُ الأوّل."]], "tr": [[2325.0, "Ehl-i Sünnet ve'l-Cemaat —Allah Teâlâ onlara rahmet etsin— buna şu sözleriyle cevap vermiştir:"], [2332.4, "İman sadece kalpte değildir; iman üç rükündür:"], [2338.1, "Bir kısmı kalplerin tasdikine, bir kısmı dilin söylemesine, bir kısmı da azaların ve organların ameline döner."], [2350.0, "İman bu şeylere dağıldığı gibi küfür de onun gibidir:"], [2355.0, "Küfrün bir kısmı kalbin tasdikine (döner), bir kısmı dille söylememeye döner, bir kısmı da insanın yapmadığı bir şeye döner."], [2370.0, "Dolayısıyla kalbî küfür, lisânî küfür ve amelî küfür vardır. Bu birinci cevaptır."]]}, {"reader": false, "ar": [[2381.0, "لكن لأنّ المرجئة إنّما يحصرون الإيمانَ في جزئيّة التصديق فقط،"], [2388.0, "فيحصرون جزئيّة الكفر في التكذيب والجحود فقط."]], "tr": [[2381.0, "Fakat Mürcie imanı yalnızca tasdik cüzüne hasrettikleri için, küfür cüzünü de yalnızca yalanlama ve inkâra hasrediyorlar."]]}]}, {"ts": "39:54", "title": "5. Külliye (devam): Küfrün türleri — inkâr küfrü ve diretme-büyüklenme küfrü (İblis, ümmetler)", "paras": [{"reader": false, "ar": [[2394.0, "ومن أجوبة أهل السنة:"], [2396.7, "أنّ من المعلوم أنّ الأدلّة الصحيحة الصريحة ذكرت جُمَلًا من أنواع الكفر،"], [2406.0, "ولم تحصر الكفرَ في نوعٍ واحد."], [2410.0, "فالكفرُ أنواعٌ متعدّدة: فمنها كفرُ الجحود ـ ومنها كفرُ… عفوًا ـ كفرُ الجحود والتكذيب،"], [2414.6, "كمن يُكذّب بالرسول أو يجحد شيئًا ممّا يجب الإيمانُ به."]], "tr": [[2394.0, "Ehl-i Sünnet'in cevaplarından biri de şudur:"], [2397.3, "Bilinen bir şeydir ki sahih ve sarih deliller küfrün birçok türünü zikretmiş, küfrü tek bir türe hasretmemiştir."], [2410.0, "Küfür birden çok türdür: Bunlardan biri inkâr küfrüdür —bunlardan biri de… pardon— inkâr ve yalanlama küfrüdür;"], [2414.6, "Resûl'ü yalanlayan veya iman edilmesi vâcip olan bir şeyi inkâr eden kimse gibi."]]}, {"reader": false, "ar": [[2426.0, "ومنها كفرُ الإباء والاستكبار،"], [2430.0, "ككفر إبليسَ اللعين، الذي أقرّ وأُمر بالسجود فلم يسجد،"], [2441.0, "استكبارًا وإباءً، لا جحودًا لوجود الله عز وجل،"], [2447.0, "كما قال الله عز وجل:"], [2449.0, "<span class=\"ayah\">﴿أَبَىٰ وَاسْتَكْبَرَ وَكَانَ مِنَ الْكَافِرِينَ﴾<\/span> [البقرة: 34]."], [2453.0, "فإبليسُ لم يُنكر الوجوب،"], [2455.0, "بل كان يُقرّ ويعلم أنّ الله عز وجل أوجب عليه السجودَ لآدم،"], [2461.0, "لكنّه اعترض على أمر الله عز وجل وقال:"], [2465.0, "<span class=\"ayah\">﴿أَأَسْجُدُ لِمَنْ خَلَقْتَ طِينًا﴾<\/span> [الإسراء: 61]،"], [2467.0, "وقال: <span class=\"ayah\">﴿أَنَا خَيْرٌ مِّنْهُ خَلَقْتَنِي مِن نَّارٍ وَخَلَقْتَهُ مِن طِينٍ﴾<\/span> [الأعراف: 12]."]], "tr": [[2426.0, "Bunlardan biri de diretme ve büyüklenme küfrüdür;"], [2430.7, "lanetli İblis'in küfrü gibi. O ikrar etti ve secdeyle emrolundu, fakat secde etmedi;"], [2442.4, "bunu Allah Azze ve Celle'nin varlığını inkâr ederek değil, büyüklenerek ve direterek yaptı."], [2449.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2453.0, "<span class=\"ayah\">﴿Diretti, büyüklendi ve kâfirlerden oldu.﴾<\/span> [Bakara 34] İblis (secdenin) vâcip olduğunu inkâr etmedi;"], [2457.0, "aksine Allah Azze ve Celle'nin ona Âdem'e secdeyi vâcip kıldığını ikrar ediyor ve biliyordu."], [2461.5, "Fakat Allah Azze ve Celle'nin emrine itiraz etti ve şöyle dedi:"], [2465.0, "<span class=\"ayah\">﴿Çamurdan yarattığın kimseye mi secde edeceğim?﴾<\/span> [İsrâ 61] Ve şöyle dedi:"], [2467.5, "<span class=\"ayah\">﴿Ben ondan hayırlıyım; beni ateşten yarattın, onu ise çamurdan yarattın.﴾<\/span> [A'râf 12]"]]}, {"reader": false, "ar": [[2472.0, "بل إنّك لو تأمّلتَ كفرَ الأمم لما وجدتَ أمّةً كفرت برسولها جحودًا،"], [2482.0, "بل كانوا يُقرّون بصدق الرسول في بواطنهم،"], [2486.0, "وإنّما كفروا عنادًا وإباءً واستكبارًا،"], [2492.0, "كما قال الله عز وجل:"], [2495.6, "<span class=\"ayah\">﴿وَجَحَدُوا بِهَا وَاسْتَيْقَنَتْهَا أَنفُسُهُمْ﴾<\/span> [النمل: 14]."], [2499.0, "وقال الله عز وجل عن موسى أنّه قال لفرعون وقومه:"], [2504.0, "<span class=\"ayah\">﴿لَقَدْ عَلِمْتَ مَا أَنزَلَ هَٰؤُلَاءِ إِلَّا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ بَصَائِرَ﴾<\/span> [الإسراء: 102]."], [2511.0, "وقال الله عز وجل لنبيّه صلى الله عليه وسلم:"], [2515.0, "<span class=\"ayah\">﴿فَإِنَّهُمْ لَا يُكَذِّبُونَكَ وَلَٰكِنَّ الظَّالِمِينَ بِآيَاتِ اللَّهِ يَجْحَدُونَ﴾<\/span> [الأنعام: 33]."]], "tr": [[2472.0, "Hatta ümmetlerin küfrünü düşünürsen, resulünü inkâr ederek kâfir olan bir ümmet bulamazsın;"], [2482.0, "aksine onlar içlerinde resulün doğruluğunu ikrar ediyorlardı."], [2486.8, "Ancak inat, diretme ve büyüklenme ile kâfir oldular."], [2495.6, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2499.0, "<span class=\"ayah\">﴿Kalpleri ona kesin olarak inandığı hâlde onu inkâr ettiler.﴾<\/span> [Neml 14] Allah Azze ve Celle, Mûsâ'nın Firavun'a ve kavmine şöyle dediğini bildirmiştir:"], [2504.0, "<span class=\"ayah\">﴿Bunları, birer basiret (açık deliller) olarak ancak göklerin ve yerin Rabbinin indirdiğini sen de çok iyi bildin.﴾<\/span> [İsrâ 102] Allah Azze ve Celle Peygamberi sallallâhu aleyhi ve sellem'e de şöyle buyurmuştur:"], [2515.0, "<span class=\"ayah\">﴿Onlar aslında seni yalanlamıyorlar; fakat o zalimler Allah'ın ayetlerini inkâr ediyorlar.﴾<\/span> [En'âm 33]"]]}, {"reader": false, "ar": [[2524.0, "فأعظمُ ما كفرت به الأممُ ليس كفرَ الجحود القلبيّ،"], [2529.0, "وإنّما كفرُ الإباء والاستكبار والعناد."]], "tr": [[2524.0, "Ümmetlerin kâfir olduğu şeyin en büyüğü kalbî inkâr küfrü değil, ancak diretme, büyüklenme ve inat küfrüdür."]]}]}, {"ts": "42:16", "title": "5. Külliye (devam): Ebû Tâlib'in ve Yahudilerin küfrü", "paras": [{"reader": false, "ar": [[2536.0, "بل لو تأمّلتَ أبا طالب لوجدتَ أنّ كفرَه لم يكن عن جحودٍ للرسالة،"], [2545.0, "وإنّما كان إباءً واستكبارًا أن يُقال:"], [2553.2, "قد أسلم أبو طالب وترك دينَ آبائه وأجداده."], [2558.0, "ولذلك يُروى عنه أنّه كان يقول:"], [2562.0, "«ولقد علمتُ بأنّ دينَ محمّدٍ من خير أديان البريّة دينا، لولا الملامةُ أو حِذارُ مسبّةٍ لرأيتَني سمحًا بذاك مُبينا»."], [2576.0, "ففي كلامه هذا أوضحُ دلالةٍ على أنّه لم يُكذّب أو يجحد بنبوّة النبيّ صلى الله عليه وسلم،"], [2585.0, "بل كان مصدِّقًا بها،"], [2587.7, "وإنّما منعه من الإسلام أن يُعيّره قومُه بسبب ذلك."], [2594.0, "فهذا كفرُ إباءٍ وليس كفرَ جحود."]], "tr": [[2536.0, "Hatta Ebû Tâlib'i düşünürsen, onun küfrünün risaleti inkârdan kaynaklanmadığını, ancak \"Ebû Tâlib Müslüman oldu, babalarının ve atalarının dinini terk etti\" denmesine karşı bir diretme ve büyüklenme olduğunu görürsün."], [2558.0, "Bu yüzden ondan şöyle dediği rivayet edilir:"], [2562.0, "\"Andolsun bildim ki Muhammed'in dini, yaratılmışların dinlerinin en hayırlılarındandır."], [2568.0, "Kınanma ya da sövülme korkusu olmasaydı, beni buna gönül hoşluğuyla ve açıkça (bağlanmış) görürdün.\" Onun bu sözünde, Peygamber sallallâhu aleyhi ve sellem'in nübüvvetini yalanlamadığına veya inkâr etmediğine, aksine onu tasdik ettiğine en açık delâlet vardır;"], [2594.0, "onu İslam'dan alıkoyan, kavminin bu sebeple onu ayıplamasıydı."], [2596.3, "Bu, diretme küfrüdür, inkâr küfrü değildir."]]}, {"reader": false, "ar": [[2600.0, "ولذلك لمّا همّ النبيّ صلى الله عليه وسلم أن يستغفر له جاء النهيُ من الله عز وجل في قوله:"], [2610.4, "<span class=\"ayah\">﴿مَا كَانَ لِلنَّبِيِّ وَالَّذِينَ آمَنُوا أَن يَسْتَغْفِرُوا لِلْمُشْرِكِينَ وَلَوْ كَانُوا أُولِي قُرْبَىٰ مِن بَعْدِ مَا تَبَيَّنَ لَهُمْ أَنَّهُمْ أَصْحَابُ الْجَحِيمِ﴾<\/span> [التوبة: 113]،"], [2621.0, "فوصف أبا طالب بأنّه من المشركين،"], [2624.0, "مع أنّ كفرَه ليس عن جحودٍ وإنّما عن إباءٍ واستكبار."]], "tr": [[2600.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem onun için istiğfar etmeye niyetlendiğinde, Allah Azze ve Celle'den şu sözüyle yasak geldi:"], [2610.4, "<span class=\"ayah\">﴿Cehennemlik oldukları kendilerine açıkça belli olduktan sonra, akraba bile olsalar, müşrikler için istiğfar etmek ne Peygamber'e ne de iman edenlere yakışır.﴾<\/span> [Tevbe 113] Böylece Ebû Tâlib'i müşriklerden biri olarak nitelemiştir;"], [2624.4, "oysa onun küfrü inkârdan değil, ancak diretme ve büyüklenmedendir."]]}, {"reader": false, "ar": [[2628.0, "بل لو تأمّلتَ كفرَ اليهود لوجدتَه عن عنادٍ وإباءٍ واستكبار،"], [2637.0, "وإلّا فقد كانوا يعرفون النبيَّ صلى الله عليه وسلم ومبعثَه ونبوّتَه وصفتَه كما يعرفون أبناءهم،"], [2648.0, "كما قال الله عز وجل:"], [2650.8, "<span class=\"ayah\">﴿يَعْرِفُونَهُ كَمَا يَعْرِفُونَ أَبْنَاءَهُمْ﴾<\/span> [البقرة: 146]،"], [2653.0, "وقال الله عز وجل:"], [2655.0, "<span class=\"ayah\">﴿فَلَمَّا جَاءَهُم مَّا عَرَفُوا كَفَرُوا بِهِ ۚ فَلَعْنَةُ اللَّهِ عَلَى الْكَافِرِينَ﴾<\/span> [البقرة: 89]."]], "tr": [[2628.0, "Hatta Yahudilerin küfrünü düşünürsen, onun inat, diretme ve büyüklenmeden kaynaklandığını görürsün."], [2635.2, "Yoksa onlar Peygamber sallallâhu aleyhi ve sellem'i, onun gönderilişini, nübüvvetini ve vasfını kendi oğullarını tanıdıkları gibi tanıyorlardı."], [2646.3, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2650.8, "<span class=\"ayah\">﴿Onu, oğullarını tanıdıkları gibi tanırlar.﴾<\/span> [Bakara 146] Allah Azze ve Celle şöyle de buyurmuştur:"], [2655.0, "<span class=\"ayah\">﴿Tanıdıkları şey kendilerine gelince onu inkâr ettiler. Allah'ın laneti kâfirlerin üzerine olsun.﴾<\/span> [Bakara 89]"]]}, {"reader": false, "ar": [[2660.0, "والأمثلةُ على ذلك كثيرة،"], [2662.0, "يُبيّن الله عز وجل فيها أنّ أكثرَ من وقع في الكفر من الأمم والأفراد لم يكن عن جحودٍ قلبيّ،"], [2672.0, "بل كان عن عنادٍ وإباءٍ واستكبار،"], [2676.2, "وهو كفرُ الإباء والاستكبار."]], "tr": [[2660.0, "Bunun örnekleri çoktur; Allah Azze ve Celle bunlarda, ümmetlerden ve fertlerden küfre düşenlerin çoğunun (küfrünün) kalbî inkârdan değil, inat, diretme ve büyüklenmeden kaynaklandığını açıklamaktadır;"], [2674.1, "bu da diretme ve büyüklenme küfrüdür."]]}, {"reader": false, "ar": [[2679.0, "قال شيخُ الإسلام ابنُ تيميّة رحمه الله:"], [2682.8, "«كفرُ إبليسَ وفرعونَ واليهودِ ونحوِهم لم يكن أصلُه من جهة عدم التصديق والعلم، فإنّ إبليس لم يُخبره أحدٌ بخبر، بل أمره اللهُ بالسجود لآدم فأبى واستكبر وكان من الكافرين، فكفرُه بالإباء والاستكبار وما يتبع ذلك، لا لأجل تكذيب. وكذلك فرعونُ وقومُه <span class=\"ayah\">﴿جَحَدُوا بِهَا وَاسْتَيْقَنَتْهَا أَنفُسُهُمْ ظُلْمًا وَعُلُوًّا﴾<\/span> [النمل: 14]». انتهى كلامُه."]], "tr": [[2679.0, "Şeyhulislâm İbn Teymiyye —Allah ona rahmet etsin— der ki:"], [2682.3, "\"İblis'in, Firavun'un, Yahudilerin ve benzerlerinin küfrünün aslı, tasdik ve bilgi yokluğu cihetinden değildi."], [2687.8, "Çünkü İblis'e kimse bir haber vermedi;"], [2690.0, "aksine Allah ona Âdem'e secde etmesini emretti, o da diretti, büyüklendi ve kâfirlerden oldu."], [2696.6, "Onun küfrü, yalanlama sebebiyle değil, diretme, büyüklenme ve bunlara tâbi olan şeylerledir."], [2703.0, "Firavun ve kavmi de böyledir:"], [2705.6, "<span class=\"ayah\">﴿Kalpleri ona kesin olarak inandığı hâlde, zulüm ve büyüklenme yüzünden onu inkâr ettiler.﴾<\/span> [Neml 14]\" Sözü bitti."]]}]}, {"ts": "45:13", "title": "5. Külliye (devam): Yüz çevirme (i'râz) küfrü; şek, nifak ve amel küfrü", "paras": [{"reader": false, "ar": [[2714.3, "ومن أنواع الكفر: كفرُ الإعراض ـ كفرُ الإعراض ـ كما قال الله عز وجل:"], [2721.8, "<span class=\"ayah\">﴿وَالَّذِينَ كَفَرُوا عَمَّا أُنذِرُوا مُعْرِضُونَ﴾<\/span> [الأحقاف: 3]."], [2725.0, "فكلُّ من أعرض عن دين الله علمًا وعملًا ـ الإعراضَ المطلق ـ فإنّه يكون كافرًا."]], "tr": [[2714.3, "Küfrün türlerinden biri de yüz çevirme (i'râz) küfrüdür —yüz çevirme küfrü—."], [2718.7, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2721.8, "<span class=\"ayah\">﴿İnkâr edenler ise uyarıldıkları şeyden yüz çevirmektedirler.﴾<\/span> [Ahkâf 3] Allah'ın dininden ilim ve amel olarak —mutlak yüz çevirme ile— yüz çeviren herkes kâfir olur."]]}, {"reader": false, "ar": [[2739.0, "ومن ذلك ـ أي ومن أنواع الكفر ـ كفرُ الشكّ،"], [2744.7, "والنفاق، والعمل، كمن يفعل أفعالًا نصّ الشارعُ على أنّها كفرٌ تُخرج من الملّة،"], [2753.0, "كما قال الله عز وجل:"], [2755.7, "<span class=\"ayah\">﴿مَن كَانَ يُرِيدُ الْحَيَاةَ الدُّنْيَا وَزِينَتَهَا نُوَفِّ إِلَيْهِمْ أَعْمَالَهُمْ فِيهَا وَهُمْ فِيهَا لَا يُبْخَسُونَ ۝ أُولَٰئِكَ الَّذِينَ لَيْسَ لَهُمْ فِي الْآخِرَةِ إِلَّا النَّارُ ۖ وَحَبِطَ مَا صَنَعُوا فِيهَا وَبَاطِلٌ مَّا كَانُوا يَعْمَلُونَ﴾<\/span> [هود: 15-16]."]], "tr": [[2739.0, "Bundan —yani küfür türlerinden— biri de şek, nifak ve amel küfrüdür;"], [2745.6, "Şâri'in dinden çıkaran küfür olduğunu nassla bildirdiği fiilleri işleyen kimse gibi."], [2751.9, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2755.7, "<span class=\"ayah\">﴿Kim dünya hayatını ve onun süsünü isterse, onlara orada amellerinin karşılığını tam olarak veririz ve orada onlara hiçbir eksiklik yapılmaz. ۝ Onlar, âhirette kendileri için ateşten başka bir şey olmayan kimselerdir. Orada yaptıkları boşa gitmiştir ve yapmakta oldukları şeyler bâtıldır.﴾<\/span> [Hûd 15-16]"]]}, {"reader": false, "ar": [[2771.0, "والخلاصةُ من ذلك: أنّ الأدلّة دلّت على أنواعٍ متعدّدةٍ من الكفر،"], [2777.0, "فحصرُ المرجئة الكفرَ في الجحود والتكذيب فقط مخالفٌ لهذه الأدلّة،"], [2784.0, "بل ومخالفٌ للإجماع أيضًا؛"], [2789.0, "فإنّ أهل السنة والجماعة يرون أنّ الإيمانَ قولٌ باللسان،"], [2793.0, "واعتقادٌ بالجَنان، وعملٌ بالأركان،"], [2795.0, "يزيد بالطاعة وينقص بالعصيان،"], [2798.0, "وفي مقابله يكون الكفرُ أيضًا،"], [2802.0, "فيكون هناك كفرٌ بالقلب،"], [2804.2, "وكفرٌ باللسان، وكفرٌ بالجوارح والأركان."]], "tr": [[2771.0, "Bunun özeti şudur: Deliller küfrün birden çok türüne delâlet etmektedir."], [2777.7, "Mürcie'nin küfrü yalnızca inkâr ve yalanlamaya hasretmesi bu delillere aykırıdır;"], [2789.0, "hatta icmâya da aykırıdır. Çünkü Ehl-i Sünnet ve'l-Cemaat, imanın dille söz, kalple itikad ve organlarla amel olduğunu, taatle artıp isyanla eksildiğini kabul eder."], [2798.8, "Bunun karşılığında küfür de öyledir:"], [2802.0, "Kalple küfür, dille küfür ve azalar ve organlarla küfür vardır."]]}]}, {"ts": "46:47", "title": "5. Külliye (devam): İbn Teymiyye, Humeydî, İshâk b. Râhûye ve İbn Sahnûn'un sözleri; külliyenin özeti", "paras": [{"reader": false, "ar": [[2807.0, "قال الإمامُ ابنُ تيميّة رحمه الله مُبيّنًا مذهبَ هؤلاء،"], [2815.0, "قال: «هؤلاء القائلون بقول جهمٍ والصالحيّ قد صرّحوا بأنّ سبَّ الله ورسوله، والتكلّمَ بالتثليث، وكلَّ كلمةٍ من كلام الكفر، ليس هو كفرًا في الباطن، ولكنّه دليلٌ في الظاهر على الكفر، ويجوز مع هذا أن يكون هذا السابُّ الشاتمُ في الباطن عارفًا بالله موحِّدًا له مؤمنًا به. فإذا أُقيمت عليهم حجّةٌ بنصٍّ أو إجماعٍ أنّ هذا كافرٌ باطنًا وظاهرًا، قالوا: هذا يقتضي أنّ ذلك مستلزمٌ للتكذيب الباطن، وأنّ الإيمان يستلزم عدمَ ذلك»."], [2859.0, "انتهى كلامُه رحمه الله."]], "tr": [[2807.0, "İmam İbn Teymiyye —A
