<script>
const D={"no": 8, "vid": "kyXHjnBHKg0", "title_ar": "الدرس (٨) من شرح كليات العقيدة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 8. Ders: Rubûbiyyet Tevhidinde Sebepler — Sebeplerin Tesiri, Temime ve Vehimden Hakikate", "sections": [{"ts": "00:00", "title": "1. Külliye: Bütün sebepler tesir eder, ama zatıyla değil", "paras": [{"reader": false, "ar": [[0.0, "بسم الله الرحمن الرحيم،"], [1.6, "الحمدُ لله ربِّ العالمين،"], [3.2, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.6, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.6, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [10.0, "كلّيّاتُ هذا الدرس عشرٌ،"], [12.3, "نأخذ منها ما تيسّر،"], [14.5, "مو بلازمٍ أن نأخذها كلَّها."], [17.4, "طيب، الكلية الأولى ـ ولا نزال في كليات توحيد الربوبية ـ:"], [22.5, "<b>كلُّ الأسباب مؤثِّرةٌ لا بذاتها.<\/b> كل الأسباب مؤثرةٌ لا بذاتها،"], [28.2, "كل الأسباب تؤثّرُ لا بذاتها."]], "tr": [[0.0, "Rahmân ve Rahîm olan Allah'ın adıyla."], [1.6, "Âlemlerin Rabbi Allah'a hamd olsun."], [3.2, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [7.6, "Bu dersin külliyeleri ondur; bunlardan kolayımıza geleni alacağız, hepsini almamız şart değil."], [14.5, "Peki, birinci külliye —hâlâ rubûbiyyet tevhidinin külliyeleri içindeyiz—:"], [17.4, "<b>1. külliye: Bütün sebepler tesir eder, ama zatıyla (kendiliğinden) değil.<\/b> Bütün sebepler tesir eder, zatıyla değil;"], [22.5, "bütün sebepler tesir eder, zatıyla değil."]]}, {"reader": false, "ar": [[31.0, "أقول وبالله التوفيق: وهذا من قواعد السببية عند أهل السنة والجماعة،"], [38.0, "من قواعد السببية عند أهل السنة والجماعة."], [42.0, "وهي أن عقيدتنا في الأسباب ملخَّصةٌ في جزئيتين:"], [48.0, "الجزئية الأولى: أن الأسباب خلقها الله عز وجل مؤثِّرةً في مسبَّباتها،"], [54.0, "فكلُّ سببيةٍ لا بد أن يكون لها أثر،"], [58.0, "باعتبار أصل خلق الله عز وجل لكونه."], [62.0, "الجزئية الثانية: أن هذه الآثار التي تترتب على أسبابها إنما تترتب بتقدير الله عز وجل، لا بذات السببية."]], "tr": [[31.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'e göre sebebiyet kaidelerindendir."], [38.0, "Sebepler hakkındaki akîdemiz iki cüzde özetlenir:"], [42.0, "Birinci cüz: Allah Teâlâ sebepleri, müsebbeplerinde (sonuçlarında) tesirli olarak yaratmıştır;"], [48.0, "Allah'ın kâinatını yaratışının aslı itibarıyla her sebebin mutlaka bir eseri vardır."], [58.0, "İkinci cüz: Sebeplerine bağlı olarak ortaya çıkan bu eserler, sebebin zatıyla değil, ancak Allah Teâlâ'nın takdiriyle ortaya çıkar."]]}, {"reader": false, "ar": [[75.0, "وكِلا الجزئيتين قد خالفَنا فيها طوائف."], [81.0, "فالجزئية الأولى ـ بأن الأسباب مؤثرة ـ خالفَنا فيها معطِّلةُ الأسباب،"], [87.0, "الذين يقولون بأن الأسباب لا تؤثر،"], [92.0, "فالله عز وجل خلق الأسباب غيرَ مؤثرة،"], [98.0, "وهم طائفةٌ من الأشاعرة."], [100.0, "يزعمون بأن السببية لا أثر لها،"], [104.0, "وإذا وُجد عند السببية شيءٌ من الآثار فإنه وُجد عندها لا بها."], [111.0, "فإذا رميتَ زجاجةً فانكسرت،"], [115.0, "فليس للرمية أثرٌ في الانكسار،"], [119.0, "ولكن الله أراد خلق الانكسار عند ارتطام الحجر بالزجاج."]], "tr": [[75.0, "Bu iki cüzün her birinde bize muhalefet eden fırkalar olmuştur."], [81.0, "Birinci cüzde, yani sebeplerin tesirli olduğu hususunda bize \"sebepleri ta'til edenler\" (muattılatü'l-esbâb) muhalefet etmiştir."], [87.0, "Bunlar sebeplerin tesir etmediğini, Allah'ın sebepleri tesirsiz yarattığını söylerler;"], [98.0, "bunlar Eş'arîlerden bir gruptur. Sebebin hiçbir eseri olmadığını iddia ederler;"], [104.0, "sebep anında bir eser ortaya çıkarsa, onun sebeple değil, sebep yanında ortaya çıktığını söylerler."], [111.0, "Bir cama taş atarsın, cam kırılır;"], [115.0, "onlara göre atışın kırılmada hiçbir etkisi yoktur, fakat Allah taşın cama çarpması anında kırılmayı yaratmayı dilemiştir."]]}, {"reader": false, "ar": [[124.0, "ولو أن إنسانًا رمى غيره برصاصةٍ فمات،"], [130.0, "فهو بريءٌ من موته،"], [132.7, "لأن الله عز وجل خلق الموت عند ارتطام الرصاصة ودخولها في جسده."], [141.0, "وكذلك لو أن الإنسان كان جائعًا فأكل فشبع،"], [147.0, "فليس للأكل سببيةٌ أو أثرٌ في الشبع،"], [152.0, "وإنما أراد الله عز وجل أن يكون الشبع عند الأكل لا به."], [157.0, "وقد ردّ عليهم الإمام ابن القيم وغيرُه من أهل العلم،"], [162.0, "في كتابه العظيم «شفاء العليل»."]], "tr": [[124.0, "Bir insan başkasına kurşun atsa ve o ölse, (onlara göre) bu kişi onun ölümünden berîdir;"], [132.7, "çünkü Allah Teâlâ ölümü, kurşunun çarpması ve bedenine girmesi anında yaratmıştır."], [141.0, "Aynı şekilde insan aç olsa, yese ve doysa, yemenin doymada hiçbir sebebiyeti veya etkisi yoktur;"], [147.0, "Allah Teâlâ doymanın yemekle değil, yemek anında olmasını dilemiştir."], [152.0, "İmam İbnü'l-Kayyim ve diğer ilim ehli onlara reddiye yazmıştır;"], [157.0, "(İbnü'l-Kayyim) bunu büyük eseri «Şifâü'l-Alîl»de yapmıştır."]]}, {"reader": false, "ar": [[165.0, "الطائفة الثانية خالفونا في الجزئية الثانية:"], [168.9, "بأن الأسباب ـ وإن اعتقدنا أنها مؤثرة ـ إلا أنها تؤثر بتقدير الله عز وجل."], [181.0, "وهم طائفةُ مشرِكة الأسباب،"], [183.6, "وهم الذين يعتقدون بأن لكل سببٍ تأثيرًا ذاتيًّا خَلْقيًّا تقديريًّا،"], [190.0, "فيجعلون السبب هو الخالقَ لأثره،"], [192.5, "وهو المدبّرَ لأثره، وهو المتصرّفَ في أثره،"], [196.0, "وهو الذي يُثمر أثره بذاته لا بتقدير الله عز وجل."], [201.0, "وهذه الطائفة ستأتينا فيهم قاعدةٌ بعد قليل بإذن الله عز وجل."]], "tr": [[165.0, "İkinci fırka, ikinci cüzde bize muhalefet etti:"], [165.0, "Yani sebeplerin tesirli olduğuna inansak da, onların ancak Allah'ın takdiriyle tesir ettiği hususunda."], [168.9, "Bunlar \"sebeplere şirk koşanlar\" (müşriketü'l-esbâb) fırkasıdır;"], [183.6, "her sebebin zâtî, yaratıcı ve takdir edici bir tesiri olduğuna inanırlar."], [190.0, "Sebebi, eserinin yaratıcısı, eserinin müdebbiri, eserinde tasarruf eden ve eserini Allah'ın takdiriyle değil kendi zatıyla meydana getiren şey kabul ederler."], [201.0, "Allah'ın izniyle az sonra bu fırka hakkında bir kaide gelecek."]]}, {"reader": false, "ar": [[207.0, "فجاء أهل السنة والجماعة فقالوا:"], [209.7, "«الأسباب مؤثرة» للردّ على معطّلة الأسباب،"], [213.0, "وقالوا: «لا بذاتها» للرد على مشرِكة الأسباب."], [219.0, "بمعنى أن الله عز وجل متى ما أراد أن يفصل السبب عن أثره تقديرًا فصَله،"], [227.0, "كما فصل سببية النار للإحراق لمّا أُلقي إبراهيم فيها."], [233.0, "فلو كانت السببية تفيد أثرها بذاتها لاحترق إبراهيم،"], [240.0, "ولكن الله عز وجل سلب آثار النار بقوله:"], [245.4, "<span class=\"ayah\">﴿كُونِي بَرْدًا وَسَلَامًا عَلَىٰ إِبْرَاهِيمَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٦٩]<\/span>."]], "tr": [[207.0, "Ehl-i Sünnet ve'l-Cemaat gelip sebepleri ta'til edenlere reddiye olarak \"Sebepler tesir eder\" dediler;"], [213.0, "sebeplere şirk koşanlara reddiye olarak da \"zatıyla değil\" dediler."], [219.0, "Yani Allah Teâlâ bir sebebi takdiren eserinden ayırmak istediği zaman onu ayırır."], [227.0, "Tıpkı İbrâhîm ateşe atıldığında ateşin yakma sebebiyetini ondan ayırdığı gibi."], [233.0, "Sebep eserini zatıyla verseydi İbrâhîm yanardı;"], [240.0, "fakat Allah Teâlâ ateşin eserlerini <span class=\"ayah\">﴿Serin ve esenlik ol İbrâhîm'e﴾<\/span> [Enbiyâ 69] sözüyle giderdi."]]}, {"reader": false, "ar": [[249.0, "وفي صحيح الإمام مسلم من حديث أبي هريرة رضي الله عنه قال:"], [256.0, "قال النبي ﷺ: «ليس السَّنةُ أن لا تُمطَروا، ولكنّ السَّنةَ أن تُمطَروا وتُمطَروا ولا تُنبِتَ الأرض»،"], [264.0, "مع أن من أسباب نبات الأرض نزولَ المطر."], [267.0, "فإذا أراد الله عز وجل أن يفصل السبب عن أثره فصله،"], [272.0, "لأن الأثر إنما يترتب على سببيته بتقدير الله تبارك وتعالى،"], [279.0, "بتقدير الله تبارك وتعالى."]], "tr": [[249.0, "İmam Müslim'in Sahîh'inde Ebû Hüreyre (r.a.) hadisinde Nebî ﷺ şöyle buyurdu:"], [256.0, "«Kıtlık yağmur yağmaması değildir; asıl kıtlık, üst üste yağmur yağması ve yerin (yine de) bitirmemesidir.» Hâlbuki yerin bitki bitirmesinin sebeplerinden biri yağmurun yağmasıdır."], [267.0, "Allah Teâlâ sebebi eserinden ayırmak isterse ayırır;"], [272.0, "çünkü eser, sebebine ancak Allah Tebâreke ve Teâlâ'nın takdiriyle bağlanır."]]}, {"reader": false, "ar": [[283.0, "وبناءً على ذلك فأريد أن ألفت أنظاركم إلى شيءٍ مهم:"], [288.0, "وهي أن من الناس من يكتفي بالتوكل على الله عز وجل في قول الأذكار فقط،"], [295.0, "ولا يتوكل على الله عز وجل في ترتّب آثارها."], [299.0, "فللعبد عند التعبّدات توكّلان لا بد منهما:"]], "tr": [[283.0, "Buna dayanarak dikkatinizi önemli bir şeye çekmek istiyorum:"], [283.0, "İnsanlardan bazıları sadece zikirleri söylemede Allah'a tevekkül etmekle yetinir, onların eserlerinin gerçekleşmesinde Allah'a tevekkül etmez."], [295.0, "Kulun ibadetlerde mutlaka bulunması gereken iki tevekkülü vardır:"]]}]}, {"ts": "05:05", "title": "1. Külliye (devam): İki tevekkül; Allah'ın sebebi eserinden ayırması", "paras": [{"reader": false, "ar": [[305.0, "توكلٌ على الله عز وجل في إيقاع السببية،"], [308.3, "وتوكلٌ على الله عز وجل في ترتّب آثار السببية."], [312.0, "وهي التي يقول فيها العامة ـ على ملاحظةٍ في قولهم ـ:"], [316.0, "«سوّينا اللي علينا والباقي على الله»،"], [319.0, "مع أن أصل فعل السببية على الله،"], [323.0, "وترتّب أثرها أيضًا على الله عز وجل."], [327.0, "ولو لم يُعِنِ الله العبدَ على شيءٍ من ذلك ـ سببيةً وأثرًا ـ لما ترتب شيءٌ من ذلك أبدًا."]], "tr": [[305.0, "Sebebi yerine getirmede Allah'a tevekkül ve sebebin eserlerinin gerçekleşmesinde Allah'a tevekkül."], [308.3, "Avamın —sözlerinde bir çekince olmakla birlikte— \"Bize düşeni yaptık, gerisi Allah'a kalmış\" dediği budur."], [316.0, "Hâlbuki sebebi yapmanın aslı da Allah'a bağlıdır, eserinin gerçekleşmesi de Allah Teâlâ'ya bağlıdır."], [323.0, "Allah kula bunların hiçbirinde —ne sebepte ne eserde— yardım etmeseydi, bunlardan hiçbir şey asla gerçekleşmezdi."]]}, {"reader": false, "ar": [[338.0, "وبناءً على ذلك يسأل سائل:"], [340.0, "لماذا قد أكون محافظًا على الأذكار أحيانًا ويصيبني شيءٌ من الضرر؟"], [347.0, "فإن السحر الذي أصاب النبي ﷺ لا يمكن أن يكون عن ترك شيءٍ من الأذكار."], [355.0, "فالجواب عن ذلك هو هذه القاعدة:"], [361.0, "وهي أن ترتّب الآثار على الأسباب ليس ترتّبًا ذاتيًّا ـ من حيث يوجد السبب يوجد الأثر ـ وإنما ترتّبٌ تقديريٌّ إراديٌّ من الله تبارك وتعالى."], [374.0, "فقد يقول الإنسان الذكر الذي يوجب حفظه،"], [376.0, "ولكن الله لا يريد أن يحفظه في هذا الزمان أو المكان المعيّن لحكمةٍ يعلمها الله عز وجل."], [383.0, "وقد يقرأ الإنسان آية الكرسي في ليلةٍ من الليالي،"], [388.2, "والتي توجب حفظه، ولكن الله يقدّر عليه شيئًا من الأضرار أو المسّ لحكمةٍ يعلمها الله عز وجل."]], "tr": [[338.0, "Buna dayanarak biri şöyle sorar:"], [340.0, "Neden bazen zikirlere devam ettiğim hâlde bana bir zarar dokunuyor?"], [340.0, "Nebî ﷺ'e isabet eden sihrin, zikirlerden birini terk etmekten kaynaklanmış olması mümkün değildir."], [355.0, "Bunun cevabı işte bu kaidedir:"], [355.0, "Eserlerin sebeplere bağlanması zâtî bir bağlanma —yani sebep bulununca eserin de bulunması— değildir;"], [361.0, "aksine Allah Tebâreke ve Teâlâ'dan gelen takdirî ve iradî bir bağlanmadır."], [374.0, "İnsan, korunmasını gerektiren zikri söyleyebilir;"], [376.0, "fakat Allah, bildiği bir hikmetten dolayı onu o belirli zamanda veya mekânda korumayı dilemeyebilir."], [376.0, "İnsan gecelerden bir gece, korunmasını gerektiren Âyetü'l-Kürsî'yi okuyabilir;"], [388.2, "fakat Allah, bildiği bir hikmetten dolayı ona bazı zararlar veya cin çarpması takdir edebilir."]]}, {"reader": false, "ar": [[398.0, "كما أن من حِكَم سحر النبي ﷺ إظهارَ بشريته،"], [403.0, "وأنه لا يملك لنفسه لا نفعًا ولا ضرًّا،"], [407.0, "ففيه سدٌّ لذريعة الإشراك به،"], [409.3, "أو وصفِه بشيءٍ من صفات الربوبية أو الألوهية،"], [413.0, "كما قال الله عز وجل عنه:"], [415.0, "<span class=\"ayah\">﴿قُل لَّا أَمْلِكُ لِنَفْسِي نَفْعًا وَلَا ضَرًّا إِلَّا مَا شَاءَ اللَّهُ ۚ وَلَوْ كُنتُ أَعْلَمُ الْغَيْبَ لَاسْتَكْثَرْتُ مِنَ الْخَيْرِ وَمَا مَسَّنِيَ السُّوءُ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٨]<\/span>."], [424.0, "فكل من سألك عن القيام بسببيةٍ وعدم ترتّب أثرها بعد قيامها،"], [431.0, "فقل له: إن عقيدة أهل السنة والجماعة أن الأسباب لا تفيد آثارها بذاتها،"], [437.0, "وإنما تفيد آثارها بتقدير الله عز وجل."]], "tr": [[398.0, "Nitekim Nebî ﷺ'e yapılan sihrin hikmetlerinden biri de onun beşerîliğini ve kendisine ne fayda ne de zarar verme gücüne sahip olmadığını göstermektir."], [407.0, "Bunda, ona şirk koşmaya veya onu rubûbiyyet ya da ulûhiyyet sıfatlarından bir şeyle nitelemeye giden yolu kapatma vardır."], [415.0, "Nitekim Allah Teâlâ onun hakkında şöyle buyurmuştur:"], [415.0, "<span class=\"ayah\">﴿De ki: Ben kendime, Allah'ın dilediğinden başka ne bir fayda ne de bir zarar verebilirim. Eğer gaybı bilseydim elbette daha çok hayır yapardım ve bana hiçbir kötülük dokunmazdı﴾<\/span> [A'râf 188]."], [424.0, "Sana bir sebebi yerine getirip de ardından eserinin gerçekleşmemesini soran herkese de ki:"], [431.0, "Ehl-i Sünnet ve'l-Cemaat'in akîdesi şudur:"], [431.0, "Sebepler eserlerini zatlarıyla vermez, eserlerini ancak Allah Teâlâ'nın takdiriyle verir."]]}, {"reader": false, "ar": [[441.0, "وقد جعل الله عز وجل الرقية سببًا للشفاء،"], [445.0, "ولكن قد يُرقى الإنسان الزمانَ الطويل ولا يقدّر الله الشفاء؛"], [448.0, "مَن الذي فصل السبب عن أثره؟"], [451.0, "إنما هو الله عز وجل."], [453.0, "وقد شهد النص بأن من تصبّح بسبع تمراتٍ عجوةً فإنه لا يصيبه ذلك اليوم سمٌّ ولا سحر،"], [460.0, "ولكن قد يتصبّح ولا يريد الله عز وجل أن يترتب الأثر على سببيته."], [464.0, "وقد ذكر النبي ﷺ أن الشفاء في ثلاث:"], [469.5, "شرطةِ محجم، وكيّةِ نار،"], [471.5, "أو شربةِ عسل، ومع ذلك قد يداوم الإنسان على شيءٍ من ذلك ولا يرتفع ما به من الأمراض أو الأوجاع."]], "tr": [[441.0, "Allah Teâlâ rukyeyi şifa için bir sebep kılmıştır;"], [441.0, "fakat insana uzun zaman rukye yapılabilir de Allah şifayı takdir etmeyebilir."], [445.0, "Sebebi eserinden ayıran kimdir? Ancak Allah Teâlâ'dır."], [451.0, "Nass, sabahleyin yedi acve hurması yiyene o gün ne zehrin ne de sihrin isabet etmeyeceğine şahitlik etmiştir;"], [453.0, "fakat kişi sabah bunu yiyebilir de Allah Teâlâ eserin sebebine bağlanmasını dilemeyebilir."], [460.0, "Nebî ﷺ şifanın üç şeyde olduğunu zikretmiştir:"], [464.0, "hacamat neşterinin bir çizgisi, bir ateşle dağlama veya bir yudum bal."], [471.5, "Bununla birlikte insan bunlardan birine devam edebilir de üzerindeki hastalık veya ağrılar kalkmayabilir."]]}, {"reader": false, "ar": [[481.0, "وقد أخبرنا الله عز وجل في النصوص الصحيحة الصريحة بأن من أعظم سببيات تحصيل المطلوب والنجاة من المكروب الدعاء،"], [492.0, "ولكن قد يدعو الإنسان الزمانَ الطويل بخيرٍ يُجلب أو شرٍّ يُدفع،"], [496.4, "ولا يرى أثرًا لا لخيرٍ جُلب ولا لشرٍّ دُفع."], [500.0, "فالذي يفصل بين السبب وأثره إنما هو الله عز وجل،"], [507.0, "وفصلُ الله عز وجل بين السبب وأثره إنما هو لحكمة،"], [511.4, "أو لتذكير العبد بشيءٍ من التقصير في جنبه،"], [515.0, "حتى يراجع نفسه ويتوب من ذنبٍ قد يكون سببًا لفصل كثيرٍ من الأسباب عن آثارها."]], "tr": [[481.0, "Allah Teâlâ sahih ve sarih nasslarda, istenene ulaşmanın ve sıkıntıdan kurtulmanın en büyük sebeplerinden birinin dua olduğunu bize haber vermiştir."], [481.0, "Fakat insan uzun zaman celbedilecek bir hayır veya def edilecek bir şer için dua edebilir de ne celbedilen bir hayrın ne de def edilen bir şerrin eserini görmeyebilir."], [500.0, "Sebep ile eseri arasını ayıran ancak Allah Teâlâ'dır."], [500.0, "Allah'ın sebep ile eseri arasını ayırması ya bir hikmet içindir ya da kulun Allah'ın hakkındaki bir kusurunu ona hatırlatmak içindir;"], [511.4, "ta ki kendini gözden geçirsin ve birçok sebebin eserlerinden ayrılmasına sebep olmuş olabilecek bir günahtan tevbe etsin."]]}, {"reader": false, "ar": [[524.0, "بل قد يجلس طالب العلم الزمانَ الطويل في العلم،"], [528.0, "وتمرّ به السنون، وقد حقّق أكثر الأسباب التي بها يتعلم الطلاب،"], [533.0, "ولكن لا يجد نفسه قد حفظ شيئًا أو ضبط شيئًا من العلم."], [538.0, "والخلاصة من ذلك ـ مما أريد أن أقرّره لكم ـ هو أن آثار السببية لا تترتب ترتّبًا ذاتيًّا،"], [549.0, "وإنما ترتّبٌ تقديريٌّ بإرادة الله عز وجل وحكمته."]], "tr": [[524.0, "Hatta ilim talebesi uzun zaman ilimle meşgul olabilir, üzerinden yıllar geçer, talebelerin öğrendiği sebeplerin çoğunu da yerine getirmiştir;"], [533.0, "fakat kendisini ilimden bir şey ezberlemiş veya sağlamlaştırmış bulmaz."], [538.0, "Size yerleştirmek istediğim şeyin özeti şudur:"], [538.0, "Sebebin eserleri zâtî bir şekilde gerçekleşmez;"], [538.0, "aksine Allah Teâlâ'nın iradesi ve hikmetiyle takdirî bir şekilde gerçekleşir."]]}]}, {"ts": "09:14", "title": "2. Külliye: Şer'in ve kaderin delâlet etmediği bir sebebi edinmek küçük şirktir", "paras": [{"reader": false, "ar": [[554.0, "الكلية الثانية: <b>كلُّ من اتخذ سببيةً لا يدل عليها شرعٌ ولا قدرٌ فقد وقع في الشرك الأصغر.<\/b> كل من اتخذ سببيةً لم يدل عليها شرعٌ ولا قدرٌ فشركٌ أصغر."]], "tr": [[554.0, "<b>2. külliye: Ne şer'in ne de kaderin delâlet ettiği bir sebebi edinen herkes küçük şirke düşmüştür.<\/b> Ne şer'in ne de kaderin delâlet ettiği bir sebebi edinen herkes(in yaptığı) küçük şirktir."]]}, {"reader": false, "ar": [[587.0, "أقول وبالله التوفيق: وهي قاعدةٌ قد ذكرنا أطرافًا لها في دروسنا في العقيدة،"], [595.0, "وذلك لأن السببية ـ خلقًا وأثرًا ـ إنما هي من فعل الله عز وجل."], [602.0, "فلا حقّ لأحدٍ أن يعتقد أن هذا الشيء سببٌ لهذا الشيء إلا وعلى ذلك أحدُ دليلين:"], [609.0, "إما دليل الشرع، من كتاب الله عز وجل أو سنةٍ صحيحةٍ من سنن النبي ﷺ،"], [617.0, "أو يكون بدليل القدر،"], [620.0, "وهو دليل التجربة. وبناءً على ذلك،"], [626.0, "فكلُّ سببيةٍ أنت تعتقد سببيتها لشيءٍ معيّن،"], [630.0, "ولا يقف وراء هذه السببية لا دليلُ الشرع ولا دليلُ القدر،"], [634.0, "فتكون قد تدخّلت ـ أو دسستَ نفسك ـ في شيءٍ من خصائص الله عز وجل."]], "tr": [[587.0, "Tevfik Allah'tandır, derim ki: Bu, akîde derslerimizde bazı yönlerini zikrettiğimiz bir kaidedir."], [595.0, "Bunun sebebi şudur: Sebebiyet —yaratılışı ve eseriyle— ancak Allah Teâlâ'nın fiilidir."], [602.0, "Dolayısıyla hiç kimsenin, iki delilden biri olmadıkça, şu şeyin şu şeye sebep olduğuna inanma hakkı yoktur:"], [609.0, "Ya Allah'ın Kitabı'ndan veya Nebî ﷺ'in sahih sünnetlerinden bir sünnetten şer'î delil ya da kader delili, yani tecrübe delili."], [620.0, "Buna göre, belirli bir şey için sebep olduğuna inandığın ve arkasında ne şer'î delil ne de kader delili bulunan her sebepte, Allah Teâlâ'nın hususiyetlerinden birine müdahale etmiş, ya da kendini oraya sokmuş olursun."]]}]}, {"ts": "10:41", "title": "2. Külliye (devam): Temime, rukye, tetayyur, dağlama ve enva", "paras": [{"reader": false, "ar": [[641.0, "وإذا قلنا: «لم يدل عليها شرع»،"], [646.0, "هذا إذا كانت السببية شرعية؛"], [649.0, "وإذا قلنا: «أو قدر»،"], [652.0, "هذا إذا كانت الأسباب تجريبيةً حسية،"], [655.0, "وسيأتي قواعدها بعد قليل بإذن الله عز وجل."], [659.0, "فلا يجوز لأحدٍ أن يقول:"], [661.7, "إن هذا الشيء سببٌ لهذا الشيء،"], [665.0, "إلا وعلى تلك السببية دليلُ الشرع إن كانت سببيةً شرعية،"], [669.0, "أو دليلُ القدر والتجربة إن كانت حسيةً تجريبية."]], "tr": [[641.0, "\"Şer'in delâlet etmediği\" dediğimizde bu, sebebiyet şer'î ise geçerlidir;"], [649.0, "\"veya kaderin\" dediğimizde bu, sebepler tecrübî ve hissî ise geçerlidir."], [655.0, "Allah'ın izniyle bunların kaideleri az sonra gelecek."], [659.0, "Hiç kimsenin \"Şu şey şu şeyin sebebidir\" demesi caiz değildir;"], [665.0, "ancak o sebebiyet şer'î ise üzerinde şer'î delil, hissî ve tecrübî ise kader ve tecrübe delili bulunursa (caizdir)."]]}, {"reader": false, "ar": [[674.0, "وبناءً على ذلك حكم الشارع على متّخذ التميمة بأنه مشرك،"], [681.0, "لماذا؟ لأنه اعتقد سببيةً في جلب خيرٍ أو دفع شرٍّ بلا دليلٍ،"], [686.2, "لا قدريٍّ ولا شرعي."], [688.0, "فلا يوجد دليلٌ من الشرع يدل على أن تعليق التمائم يوجب ذلك،"], [694.0, "ولا نزال قدرًا وتجربةً نرى من يعلّق التمائم ولا تزال المضرّات تأتيه."], [702.0, "فلم يدل على سببية التمائم في جلب الخير أو دفع الشر لا دليلُ القدر ولا دليلُ الشرع."], [709.0, "ولذلك قال النبي ﷺ: «إن التمائم والرقى والتِّوَلة شرك»،"], [715.0, "«ومن تعلّق تميمةً فقد أشرك»."], [718.0, "وهل هو شركٌ أكبر أو أصغر؟"], [720.8, "سيأتينا بعد قليل في كليةٍ خاصة إن شاء الله."]], "tr": [[674.0, "Buna dayanarak Şâri' (Allah ve Resûlü), temime (muska/nazarlık) edinen kişinin müşrik olduğuna hükmetmiştir."], [681.0, "Neden? Çünkü o, hayır celbetmede veya şer def etmede, ne kaderî ne de şer'î bir delili olmayan bir sebebiyete inanmıştır."], [688.0, "Şeriattan temimeleri asmanın bunu gerektirdiğine delâlet eden bir delil yoktur;"], [694.0, "kader ve tecrübe açısından da temime takanları görüyoruz ve zararlar ona gelmeye devam ediyor."], [702.0, "Dolayısıyla temimelerin hayır celbetme veya şer def etmedeki sebebiyetine ne kader delili ne de şer'î delil delâlet etmiştir."], [709.0, "Bu yüzden Nebî ﷺ şöyle buyurmuştur:"], [709.0, "«Şüphesiz temimeler, (şirkî) rukyeler ve tivele (sevgi büyüsü) şirktir», «Kim bir temime takarsa şirk koşmuş olur.» Bu büyük şirk midir küçük şirk mi?"], [720.8, "İnşallah az sonra özel bir külliyede gelecek."]]}, {"reader": false, "ar": [[725.0, "ومنها الرقى: هل يجوز أن نعتقد سببية الرقى للشفاء؟"], [731.0, "الجواب: نعم، لوجود الدليل الشرعي الدالّ على كونها سببًا للعافية والشفاء،"], [738.0, "كما في قول الله عز وجل:"], [740.5, "<span class=\"ayah\">﴿وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ﴾<\/span> <span class=\"ref\">[الإسراء: ٨٢]<\/span>،"], [743.0, "وقول الله عز وجل:"], [745.0, "<span class=\"ayah\">﴿قُلْ هُوَ لِلَّذِينَ آمَنُوا هُدًى وَشِفَاءٌ﴾<\/span> <span class=\"ref\">[فصلت: ٤٤]<\/span>،"], [748.0, "وقول الله عز وجل:"], [749.5, "<span class=\"ayah\">﴿وَشِفَاءٌ لِّمَا فِي الصُّدُورِ﴾<\/span> <span class=\"ref\">[يونس: ٥٧]<\/span>."], [751.0, "والأحاديث الدالة على الرقية قولًا وفعلًا كثيرةٌ جدًّا."], [759.0, "فهي من جملة الأسباب،"], [761.2, "فيجوز لنا حينئذٍ أن نعتقد سببيتها لقيام دليل الشرع على كونها سببًا."]], "tr": [[725.0, "(Örneklerden) biri de rukyelerdir: Rukyelerin şifa için sebep olduğuna inanmamız caiz midir?"], [731.0, "Cevap: Evet; çünkü onların afiyet ve şifa için bir sebep olduğuna delâlet eden şer'î delil vardır."], [740.5, "Allah Teâlâ'nın şu sözlerinde olduğu gibi:"], [740.5, "<span class=\"ayah\">﴿Kur'an'dan şifa olan şeyler indiriyoruz﴾<\/span> [İsrâ 82], <span class=\"ayah\">﴿De ki: O, iman edenler için bir hidayet ve şifadır﴾<\/span> [Fussilet 44] ve <span class=\"ayah\">﴿Göğüslerde olana bir şifa﴾<\/span> [Yûnus 57]."], [749.5, "Rukyeye sözlü ve fiilî olarak delâlet eden hadisler de pek çoktur."], [751.0, "Dolayısıyla rukye sebepler cümlesindendir; onun sebep olduğuna dair şer'î delil bulunduğu için sebebiyetine inanmamız caizdir."]]}, {"reader": false, "ar": [[768.0, "ومنها أيضًا التطيّر: فقد حكم الشارع على أن من تطيّر بمرئيٍّ أو مسموعٍ أو زمانٍ أو مكانٍ بأنه مشرك،"], [782.0, "وذلك لأنه يتخذ ذلك سببيةً لدفع الشر أو جلب الخير."], [789.0, "ولم يقم دليل الشرع على أن البومة سببٌ لجلب الخير أو دفع الشر،"], [796.0, "ولا على أن شهر صفر سببٌ لجلب الخير أو دفع الشر،"], [801.0, "كما قال ﷺ: «لا عدوى ولا طِيَرة ولا هامة ولا صفر»."], [809.0, "فلم يجعل الله عز وجل الزمانيةَ أو المكانيةَ سببًا لجلب الخير أو دفع الشر."]], "tr": [[768.0, "Biri de tetayyurdur (uğursuzluğa inanmak):"], [768.0, "Şâri', görülen veya işitilen bir şeyden, bir zamandan veya bir mekândan uğursuzluk çıkaranın müşrik olduğuna hükmetmiştir;"], [768.0, "çünkü o, bunu şerri def etmek veya hayrı celbetmek için bir sebep edinmektedir."], [782.0, "Baykuşun hayır celbetmek veya şer def etmek için bir sebep olduğuna dair şer'î delil yoktur;"], [789.0, "Safer ayının hayır celbetmek veya şer def etmek için bir sebep olduğuna dair de yoktur."], [796.0, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [796.0, "«Kendiliğinden bulaşma (advâ) yoktur, uğursuzluk (tıyara) yoktur, hâme (baykuş inancı) yoktur, Safer (uğursuzluğu) yoktur.» Allah Teâlâ zamanı veya mekânı hayır celbetmek ya da şer def etmek için bir sebep kılmamıştır."]]}, {"reader": false, "ar": [[816.0, "فإذا اعتقدت في بومةٍ،"], [817.5, "أو في مرئيٍّ، أو في مسموعٍ،"], [819.8, "أو في زمانٍ، أو في مكانٍ،"], [822.0, "أنه من جوالب الشر لك فاتّقيتَه تشاؤمًا،"], [826.0, "فقد وقعت في الشرك الأصغر،"], [828.3, "لأنك اعتقدت سببيةً لم يدل على سببيتها شرعٌ ولا قدر،"], [833.0, "شرعٌ ولا قدر. وأما قول النبي ﷺ:"], [840.0, "«الشؤم في ثلاث: المرأة، والدابة، والمسكن»،"], [844.0, "فسيأتي الجواب عنها في قواعد باب التطيّر وكلّيّاته بإذن الله عز وجل."]], "tr": [[816.0, "Bir baykuş, görülen veya işitilen bir şey, bir zaman ya da bir mekân hakkında onun sana şer getiren şeylerden olduğuna inanır ve uğursuz sayarak ondan sakınırsan küçük şirke düşmüş olursun;"], [828.3, "çünkü sebebiyetine ne şer'in ne de kaderin delâlet ettiği bir sebebiyete inanmışsındır."], [833.0, "Nebî ﷺ'in «Uğursuzluk üç şeydedir: kadında, binekte ve meskende» sözüne gelince, bunun cevabı Allah'ın izniyle tetayyur babının kaideleri ve külliyelerinde gelecektir."]]}, {"reader": false, "ar": [[850.0, "ومنها أيضًا الكيّ: فإنه سببيةٌ صالحةٌ لرفع الشرّ ـ المرض ـ لوجود الدليل الدالّ على سببيته."], [866.0, "ومنها أيضًا ما يسمى بالاستسقاء بالأنواء،"], [871.0, "أي نسبة المطر إلى منازل النجوم،"], [875.0, "فإن الشارع قد قطع سببيته في نزول المطر،"], [882.0, "كما في حديث زيد بن خالد الجهني في الصحيحين،"], [886.0, "المعروف لديكم: «أصبح من عبادي مؤمنٌ بي وكافر، فأما من قال: مُطِرنا بفضل الله ورحمته، فذلك مؤمنٌ بي كافرٌ بالكوكب، وأما من قال: مُطِرنا بنوء كذا وكذا،"]], "tr": [[850.0, "Biri de dağlamadır (key): O, şerri —hastalığı— gidermek için elverişli bir sebeptir;"], [850.0, "çünkü sebebiyetine delâlet eden delil vardır."], [850.0, "Biri de \"enva ile yağmur istemek\" denen şeydir, yani yağmuru yıldızların menzillerine nispet etmek."], [871.0, "Şâri', yağmurun yağmasında onun sebebiyetini kesip atmıştır."], [875.0, "Nitekim Sahîhayn'de bulunan ve sizce bilinen Zeyd b."], [882.0, "Hâlid el-Cühenî hadisinde şöyle buyrulur:"], [882.0, "«Kullarımdan bir kısmı bana iman eden, bir kısmı da (beni) inkâr eden olarak sabahladı. \"Allah'ın lütfu ve rahmetiyle yağmura kavuştuk\" diyen, bana iman etmiş, yıldızı inkâr etmiştir. \"Şu şu nev (yıldız doğuşu/batışı) sayesinde yağmura kavuştuk\" diyen ise"]]}]}, {"ts": "15:01", "title": "2. Külliye (devam): Enva, kabirler, kurt derisi, tuz serpmek, parasetamol", "paras": [{"reader": false, "ar": [[901.0, "فذلك كافرٌ بي مؤمنٌ بالكوكب»."], [904.0, "فقوله: «بنوء»: الباء هنا باء السببية."], [907.0, "فلما نسبوا المطر الحادث إلى الأنواء نسبةً سببية،"], [913.0, "حكم الشارع عليهم بأنها كفر،"], [916.0, "لأن الشارع لم يجعل الأنواء ـ من ظهور النجوم واختفائها،"], [922.0, "واقتراب بعضها من بعض أو ابتعاد بعضها عن بعض ـ سببيةً لنزول المطر أو عدم نزوله."]], "tr": [[901.0, "beni inkâr etmiş, yıldıza iman etmiştir.» \"Bi-nev'\" sözündeki \"bâ\" harfi burada sebebiyet bâ'sıdır."], [907.0, "Meydana gelen yağmuru sebebiyet nispetiyle envaya nispet edince Şâri' bunun küfür olduğuna hükmetti;"], [916.0, "çünkü Şâri' envayı —yıldızların doğması ve kaybolması, birbirine yaklaşması veya birbirinden uzaklaşması gibi— yağmurun yağması veya yağmaması için bir sebep kılmamıştır."]]}, {"reader": false, "ar": [[929.0, "ومنها أيضًا اعتقادُ أفضلية الدعاء لله عز وجل عند قبور الأولياء،"], [940.0, "أو اعتقادُ فضيلة الذبح عند قبور الأولياء؛"], [944.0, "والدعاء والذبح لله عز وجل،"], [947.0, "ولكن مما يعظُم به فضل الدعاء أو الذبح أن يكون عند قبر الولي."], [953.0, "فهذا الاعتقاد يوجب الشرك الأصغر،"], [956.0, "لماذا؟ لأنه اعتقد سببيةً لم يدل عليها دليل الشرع ولا دليل القدر."]], "tr": [[929.0, "Biri de velilerin kabirleri yanında Allah Teâlâ'ya dua etmenin daha faziletli olduğuna veya velilerin kabirleri yanında kurban kesmenin fazileti olduğuna inanmaktır."], [944.0, "Dua da kurban da Allah Teâlâ içindir;"], [947.0, "fakat (onlara göre) dua veya kurbanın faziletini büyüten şeylerden biri, onun velinin kabri yanında olmasıdır."], [953.0, "Bu inanç küçük şirki gerektirir."], [956.0, "Neden? Çünkü o, ne şer'î delilin ne de kader delilinin delâlet ettiği bir sebebiyete inanmıştır."]]}, {"reader": false, "ar": [[963.0, "ومنها ما هو مشهورٌ عند العامة،"], [966.9, "من اعتقاد أن جلد الذئب يطرد الشياطين،"], [971.5, "أو يشفي صاحب المسّ من مسّه؛"], [976.0, "فهم يعتقدون سببيةً آثارها غيبية،"], [981.0, "ولم يدل دليل الشرع على أن تعاطي هذا يصلح أن يكون سببًا لطرد الشياطين أو جلبهم."], [990.0, "ومنها ما يسمى برشّ البيت بالملح،"], [993.6, "أو تعميم البيت بالملح،"], [996.0, "فإنه لم يقم دليل الشرع ولا دليل التجربة على أن مجرد تعميم البيت بالملح سببٌ صالحٌ لطرد الشياطين."]], "tr": [[963.0, "Biri de avam arasında meşhur olan, kurt derisinin şeytanları kovduğuna veya cin çarpmış kişiyi şifaya kavuşturduğuna inanmaktır."], [971.5, "Bunlar eserleri gaybî olan bir sebebiyete inanıyorlar;"], [976.0, "oysa şer'î delil bunu kullanmanın şeytanları kovmak veya celbetmek için bir sebep olmaya elverişli olduğuna delâlet etmemiştir."], [990.0, "Biri de \"evi tuzla serpmek\" veya \"evin her yanına tuz yaymak\" denen şeydir."], [996.0, "Ne şer'î delil ne de tecrübe delili, evin her yanına sadece tuz yaymanın şeytanları kovmak için elverişli bir sebep olduğunu göstermiştir."]]}, {"reader": false, "ar": [[1009.0, "وأما قولهم: «جُرِّب ونفع»،"], [1011.7, "فإن الأسباب لا تقبل التجربة إذا كانت آثارها غيبية،"], [1018.0, "فإن الأسباب التي تقبل التجربة هي الأسباب الحسية التي تُدرَك آثارها بالحواس،"], [1024.0, "وأما ما لا يُدرَك آثاره بالحس فيكون توقيفيًّا على دلالة النص،"], [1030.0, "كما سيأتينا بعد قليل في قواعد السببية."], [1033.0, "كل هذا سيأتينا بإذن الله مفصّلًا في قواعده."]], "tr": [[1009.0, "\"Denendi ve faydası görüldü\" sözlerine gelince:"], [1011.7, "Eserleri gaybî olan sebepler tecrübeyi kabul etmez."], [1011.7, "Tecrübeyi kabul eden sebepler, eserleri duyularla idrak edilen hissî sebeplerdir."], [1018.0, "Eserleri hisle idrak edilmeyen ise —az sonra sebebiyet kaidelerinde geleceği üzere— nassın delâletine bağlıdır (tevkîfîdir)."], [1030.0, "Allah'ın izniyle bunların hepsi kendi kaidelerinde tafsilatlı olarak gelecek."]]}, {"reader": false, "ar": [[1037.0, "وهل يجوز أن أعتقد أن البندول سببٌ لتخفيض الحرارة،"], [1044.0, "أو الشفاء من بعض آلام الرأس؟"], [1047.0, "الجواب: نعم. طيب، وأين الدليل الشرعي الدالّ على ذلك؟"], [1051.0, "الجواب: لا نحتاج إلى دليلٍ شرعي،"], [1053.0, "لأنه سببٌ حسيٌّ، إيه،"], [1054.0, "تجريبي، فحينئذٍ يُقبل فيه دليل القدر،"], [1058.5, "أي دليل التجارب، دليل التجارب."], [1062.0, "وعلى كل حال، فلا يجوز للإنسان أن يعتقد أن هذا الشيء سببٌ لهذا الشيء إلا إذا كان يقف وراء هذا الاعتقاد أحدُ دليلين:"], [1071.0, "إما دليل الشرع إذا كانت السببية شرعية،"], [1075.7, "أو دليل القدر إن كانت السببية حسيةً تجريبية."]], "tr": [[1037.0, "Panadol'ün (parasetamol) ateşi düşürmek veya bazı baş ağrılarından kurtulmak için bir sebep olduğuna inanmam caiz midir?"], [1047.0, "Cevap: Evet. Peki, buna delâlet eden şer'î delil nerede?"], [1051.0, "Cevap: Şer'î bir delile ihtiyacımız yoktur;"], [1054.0, "çünkü o hissî, evet, tecrübî bir sebeptir."], [1054.0, "Bu durumda onda kader delili, yani tecrübeler delili kabul edilir."], [1062.0, "Her hâlükârda insanın, şu şeyin şu şeye sebep olduğuna inanması, ancak bu inancın arkasında iki delilden biri bulunursa caizdir:"], [1071.0, "Sebebiyet şer'î ise şer'î delil, sebebiyet hissî ve tecrübî ise kader delili."]]}]}, {"ts": "18:01", "title": "3. Külliye: Bir sebebin zatıyla tesir ettiğine inanmak büyük şirktir", "paras": [{"reader": false, "ar": [[1081.0, "ومن الكليات أيضًا: <b>كلُّ من اعتقد في سببيةٍ أنها تؤثّر بذاتها فشركٌ أكبر.<\/b> كل من اعتقد في سببيةٍ أنها مؤثرةٌ بذاتها،"], [1095.0, "كل من اعتقد في سببيةٍ أنها تؤثر بذاتها فشركٌ أكبر،"], [1103.0, "كل من اعتقد في سببيةٍ أنها تؤثر بذاتها فشركٌ أكبر."]], "tr": [[1081.0, "Külliyelerden biri de şudur: 3."], [1081.0, "külliye: Bir sebep hakkında onun zatıyla tesir ettiğine inanan herkes(in bu inancı) büyük şirktir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1112.0, "بمعنى أنه يعتقد أن التميمة هي التي تجلب الخير بذاتها أو تدفع الشر بذاتها،"], [1121.0, "فهذا ينقلب من كونها شركًا أصغر إلى شركٍ أكبر."], [1125.0, "وإذا اعتقد أن البومة التي تطيّر بها هي التي تجلب الشر بذاتها،"], [1131.8, "أو تجلب المصائب بذاتها،"], [1134.0, "فإنها حينئذٍ تنقلب من كونها شركًا أصغر إلى شركٍ أكبر."], [1139.0, "بل حتى ولو اعتقد في سببيةٍ دلّ على سببيتها دليل الشرع أنها تجلب الخير بذاتها،"], [1149.0, "فإن هذا الاعتقاد يُخرجه إلى دائرة الشرك الأكبر."]], "tr": [[1112.0, "Yani temimenin hayrı zatıyla celbettiğine veya şerri zatıyla def ettiğine inanırsa, bu küçük şirk olmaktan büyük şirke dönüşür."], [1121.0, "Uğursuz saydığı baykuşun şerri zatıyla getirdiğine veya musibetleri zatıyla getirdiğine inanırsa, bu durumda (inancı) küçük şirk olmaktan büyük şirke dönüşür."], [1134.0, "Hatta sebebiyetine şer'î delilin delâlet ettiği bir sebep hakkında bile onun hayrı zatıyla celbettiğine inanırsa, bu inanç onu büyük şirk dairesine çıkarır."]]}, {"reader": false, "ar": [[1153.0, "وعلى ذلك قول النبي ﷺ:"], [1157.0, "«إن الرقى والتمائم والتِّوَلة شرك»."], [1161.0, "فأما التمائم والتولة فهذه قد انقطعت سببيتها بدليل الشرع،"], [1167.0, "لكن الرقى كيف تكون شركًا وقد أثبت الشارع سببيتها للشفاء؟"], [1172.0, "نقول: بأنها تكون شركًا أكبر إذا اعتقد أن الرقية بذاتها هي التي تجلب الشفاء،"], [1181.6, "بغير تقدير الله عز وجل،"], [1184.8, "ولا إرادته، ولا خلقه وتدبيره."], [1188.0, "وإذا اعتقد أن النوء هو الذي أنزل المطر بذاته،"], [1193.0, "فإن هذا من الشرك الأكبر،"], [1198.0, "كما هو اعتقاد الصابئة في الكواكب السبعة،"], [1202.0, "كما ستأتينا قاعدةٌ تخصّ ذلك إن شاء الله تعالى."]], "tr": [[1153.0, "Nebî ﷺ'in «Şüphesiz rukyeler, temimeler ve tivele şirktir» sözü de buna göredir."], [1161.0, "Temimeler ve tiveleye gelince, bunların sebebiyeti şer'î delille kesilmiştir."], [1167.0, "Fakat Şâri' rukyelerin şifa için sebebiyetini isbat etmişken rukyeler nasıl şirk olur?"], [1172.0, "Deriz ki: Kişi rukyenin, Allah Teâlâ'nın takdiri, iradesi, yaratması ve tedbiri olmaksızın şifayı bizzat kendisinin getirdiğine inanırsa büyük şirk olur."], [1188.0, "Nev'in (yıldızın) yağmuru zatıyla indirdiğine inanırsa, bu da büyük şirktendir;"], [1198.0, "Sâbiîlerin yedi gezegen hakkındaki inancı gibi."], [1202.0, "İnşallah bununla ilgili özel bir kaide gelecek."]]}, {"reader": false, "ar": [[1206.0, "فكل من اعتقد أن هذا السبب بعينه هو الذي يجلب الخير بذاته،"], [1216.0, "أو يدفع الشر بذاته،"], [1217.7, "فإن هذا واقعٌ في شرك الربوبية الأكبر،"], [1223.0, "لأنه اعتقد مدبِّرًا تدبيرًا استقلاليًّا،"], [1229.0, "ومتصرِّفًا تصريفًا استقلاليًّا مع الله عز وجل."]], "tr": [[1206.0, "Şu sebebin bizzat kendisinin hayrı zatıyla getirdiğine veya şerri zatıyla def ettiğine inanan herkes, rubûbiyyetteki büyük şirke düşmüştür;"], [1217.7, "çünkü Allah Teâlâ ile birlikte müstakil olarak tedbir eden bir müdebbire ve müstakil olarak tasarruf eden bir mutasarrıfa inanmıştır."]]}]}, {"ts": "20:33", "title": "4. Külliye: Tesiri veya eserleri gaybî olan her sebep tevkîfîdir", "paras": [{"reader": false, "ar": [[1233.0, "ومن الكليات أيضًا: <b>كلُّ سببيةٍ تأثيرُها غيبيٌّ ـ أثرُها غيبيٌّ ـ فتوقيفية.<\/b> كل سببيةٍ تأثيرها غيبيٌّ فتوقيفية،"], [1245.0, "كل سببيةٍ تأثيرها أو آثارها غيبيةٌ فتوقيفية."]], "tr": [[1233.0, "Külliyelerden biri de şudur: 4."], [1233.0, "külliye: Tesiri —eseri— gaybî olan her sebep tevkîfîdir (nassa bağlıdır). Tesiri gaybî olan her sebep tevkîfîdir;"], [1245.0, "tesiri veya eserleri gaybî olan her sebep tevkîfîdir."]]}, {"reader": false, "ar": [[1251.0, "وهذه الكلية الطيبة تجيب عن سؤالٍ يتردد على ألسنة الطلاب والناس كثيرًا:"], [1261.0, "هل تُقبل التجارب في الأسباب؟"], [1265.0, "هل تثبت الأسباب بمجرد التجارب؟"], [1271.0, "فلا نقول: تثبت مطلقًا،"], [1272.3, "ولا نقول: لا تثبت مطلقًا،"], [1274.0, "وإنما ذلك يختلف باختلاف آثار السببية."], [1280.0, "فإذا كانت من الأسباب التي آثارها غيبيةٌ لا تدركها الحواس،"], [1287.0, "فكلُّ سببيةٍ غيبيةٍ فهي توقيفيةٌ على دليل الشرع."]], "tr": [[1251.0, "Bu güzel külliye, talebelerin ve insanların dilinde çokça dolaşan bir soruya cevap verir:"], [1251.0, "Sebeplerde tecrübeler kabul edilir mi?"], [1261.0, "Sebepler sadece tecrübelerle sabit olur mu?"], [1271.0, "\"Mutlak olarak sabit olur\" demeyiz, \"mutlak olarak sabit olmaz\" da demeyiz;"], [1274.0, "bu, sebebin eserlerinin farklılığına göre değişir."], [1280.0, "Eğer eserleri gaybî olan ve duyuların idrak edemediği sebeplerdense, her gaybî sebep şer'î delile bağlıdır (tevkîfîdir)."]]}, {"reader": false, "ar": [[1292.0, "وهو الذي جعلنا نمنع رشّ البيوت بالملح طردًا للجن،"], [1298.0, "لأن كون الجن طُرِدوا أو بقُوا من الآثار الغيبية التي لا نقبل سببيتها إلا بدليل الشرع."], [1307.0, "ولكننا نقبل سببية قراءة سورة البقرة لطرد الجن،"], [1313.0, "لأنها ثبتت بدليل الشرع،"], [1316.0, "لقول النبي ﷺ: «فإن الشيطان ينفِر ـ أو قال: يفِرّ ـ من البيت الذي تُقرأ فيه سورة البقرة»،"], [1325.0, "كما في صحيح مسلم من حديث أبي هريرة رضي الله عنه."]], "tr": [[1292.0, "Cinleri kovmak için evlere tuz serpmeyi yasaklamamızın sebebi budur;"], [1298.0, "çünkü cinlerin kovulması veya kalması, sebebiyetini ancak şer'î delille kabul ettiğimiz gaybî eserlerdendir."], [1298.0, "Fakat cinleri kovmak için Bakara sûresini okumanın sebebiyetini kabul ederiz;"], [1313.0, "çünkü bu, şer'î delille sabit olmuştur."], [1316.0, "Nebî ﷺ şöyle buyurmuştur: «Şüphesiz şeytan, içinde Bakara sûresi okunan evden kaçar» (ya da \"ürker\" dedi)."], [1325.0, "Bu, Sahîh-i Müslim'de Ebû Hüreyre (r.a.) hadisindedir."]]}, {"reader": false, "ar": [[1328.0, "ونمنع وضع المصحف على المخدّة طردًا للجن،"], [1335.0, "لماذا؟ لأن كون الجن طُرِدوا بوجود المصحف قريبًا من النائم،"], [1342.0, "هذا من الآثار الغيبية التي لا بد أن يكون لها دليلٌ خاص."], [1349.0, "لكننا نقبل سببية قراءة آية الكرسي لوجود حافظٍ عليك من الله،"], [1355.9, "ولا يقربك شيطانٌ حتى تصبح،"], [1358.1, "لوجود الدليل الشرعي الدالّ على هذه السببية."]], "tr": [[1328.0, "Cinleri kovmak için Mushaf'ı yastığın üzerine koymayı da yasaklarız."], [1335.0, "Neden? Çünkü Mushaf'ın uyuyana yakın bulunmasıyla cinlerin kovulması, mutlaka özel bir delili olması gereken gaybî eserlerdendir."], [1342.0, "Fakat Âyetü'l-Kürsî okumanın, Allah'tan üzerinde bir koruyucu bulunması ve sabaha kadar sana şeytanın yaklaşmaması için sebep olduğunu kabul ederiz;"], [1358.1, "çünkü bu sebebiyete delâlet eden şer'î delil vardır."]]}, {"reader": false, "ar": [[1362.0, "ونمنع استعمال جلد الذئب أيضًا لاستخراج الجانّ،"], [1368.7, "أو استعماله في الرقية،"], [1370.0, "لأن الآثار المطلوبة على هذا الاستعمال حسيةٌ أو غيبية؟"], [1375.0, "غيبية. فإذًا كلُّ سببيةٍ آثارها غيبيةٌ فإنها تكون توقيفيةً على النص."], [1381.0, "وأنتم تعرفون قاعدتنا وكليتنا العظيمة في التوحيد،"], [1386.0, "التي يُبنى عليها التوحيد كله:"], [1389.0, "أنّ ما كان غيبيًّا فيكون توقيفيًّا على النص."], [1393.0, "فلا حقّ لأحدٍ أن يتخبّط في باب سببيةٍ يطلب منها آثارًا غيبية،"], [1400.0, "بحجة أنها جُرِّبت فنفعت،"], [1403.0, "كما يقوله من يقوله في تسويغ بعض السببيات التي لا دليل عليها."]], "tr": [[1362.0, "Cinleri çıkarmak için veya rukyede kurt derisi kullanmayı da yasaklarız;"], [1368.7, "çünkü bu kullanımdan beklenen eserler hissî midir, gaybî mi?"], [1370.0, "Gaybîdir. O hâlde eserleri gaybî olan her sebep nassa bağlıdır."], [1375.0, "Tevhidin tamamının üzerine bina edildiği büyük kaidemizi ve külliyemizi biliyorsunuz:"], [1381.0, "Gaybî olan şey nassa bağlıdır (tevkîfîdir)."], [1386.0, "Dolayısıyla hiç kimsenin, \"denendi, faydası görüldü\" bahanesiyle, kendisinden gaybî eserler beklenen bir sebep babında gelişigüzel hareket etme hakkı yoktur;"], [1400.0, "bazılarının delili olmayan bazı sebepleri meşrulaştırmak için söylediği gibi."]]}, {"reader": false, "ar": [[1409.0, "وقد ناقشني بعضهم في مسألة الملح،"], [1413.0, "وقال: إن أهل البيت اطمأنّت نفوسهم بعد رشّ الملح."], [1419.0, "فنقول: اطمئنان نفوسهم ـ (هل) تجزم أنه لأن الشياطين خرجت؟"], [1421.5, "ـ أو أنها خدعةٌ من الشياطين لتقنعك بالبدعة <span class=\"q\">؟ 23:39<\/span>."], [1424.0, "فإن الشيطان لا يهمّه أن يبقى في البيت ويضرّ أهله،"], [1429.0, "فإنها مجرد أذًى قاصر،"], [1433.0, "لكنْ كونُه يقنعك أنت بنفع هذه السببية الغيبية التي لا دليل عليها،"], [1439.0, "هذا يوقعك في ماذا؟"], [1440.3, "في بدعة. ولا جرم أن البدعة أحبُّ إلى إبليس من غيرها."]], "tr": [[1409.0, "Bazıları benimle tuz meselesini tartıştı ve \"Tuz serpildikten sonra ev halkının içi rahatladı\" dedi."], [1413.0, "Deriz ki: Onların içinin rahatlaması —bunun şeytanlar çıktığı için olduğunu kesin olarak söyleyebilir misin?— yoksa bu, seni bid'ata ikna etmek için şeytanların bir hilesi midir <span class=\"q\">؟<\/span>?"], [1424.0, "Çünkü şeytan için evde kalıp ev halkına zarar vermek önemli değildir;"], [1429.0, "bu sadece sınırlı bir eziyettir."], [1433.0, "Fakat delili olmayan bu gaybî sebebin faydasına seni ikna etmesi, seni neye düşürür?"], [1440.3, "Bid'ata. Şüphesiz bid'at İblis'e diğer (günahlardan) daha sevimlidir."]]}, {"reader": false, "ar": [[1445.0, "ألا ترى أن ابن مسعود لما حُدِّث عن بعض الرقى فمنعها،"], [1450.0, "فأُخبر بأنها نافعة، فقال:"], [1452.6, "إنما ذلك الشيطان يرفع أثره عندها،"], [1456.0, "حتى يقنعك بماذا؟ بأنها مؤثرة."], [1461.0, "وقد كنا في الزمن السابق في هذه البلد،"], [1465.0, "إذا سقط أحد الأولاد في الشارع،"], [1468.0, "فإننا نرشّ الماء على مكان سقوطه،"], [1473.0, "أو نأخذ شيئًا من التراب يسمّونه «خمّ تراب»،"], [1478.0, "والعجيب أنه يُشفى. فنقول:"], [1480.9, "إن شفاءه ليس بالضرورة أن يكون لتعاطي هذه السببية،"], [1488.0, "بل قد يكون خدعةً أو مكيدةً من الشيطان ليُقنع <span class=\"q\">؟ 24:51<\/span> الناس بنفع هذه السببية."]], "tr": [[1445.0, "Görmüyor musun, İbn Mes'ûd'a bazı rukyelerden bahsedilince onları yasakladı;"], [1450.0, "ona bunların faydalı olduğu haber verilince şöyle dedi:"], [1452.6, "\"Bu, ancak şeytanın, o (rukye) yapılınca kendi etkisini kaldırmasıdır.\" Seni neye ikna etmek için?"], [1461.0, "Onun tesirli olduğuna. Eskiden bu memlekette çocuklardan biri sokakta düşerse, düştüğü yere su serperdik veya \"hamm turâb\" dedikleri bir miktar toprak alırdık;"], [1473.0, "işin tuhafı, çocuk iyileşirdi. Deriz ki:"], [1480.9, "Onun iyileşmesinin bu sebebi kullanmaktan kaynaklanması zorunlu değildir;"], [1488.0, "aksine bu, insanları bu sebebin faydasına ikna etmek <span class=\"q\">؟<\/span> için şeytanın bir hilesi veya tuzağı olabilir."]]}, {"reader": false, "ar": [[1496.0, "فسدًّا للدخول في ذلك قرّر أهل السنة هذه القاعدة:"], [1500.0, "من أن السببية التي آثارها غيبيةٌ لا بد فيها من دليل الشرع."], [1505.0, "فإذا أخبرنا من يعلم الغيب عن هذا الأثر الغيبي،"], [1511.0, "وأن هذه سببيته، فحينئذٍ نقول:"], [1514.6, "سمعنا وأطعنا، وآمنا وصدّقنا."]], "tr": [[1496.0, "Buna girişin yolunu kapatmak için Ehl-i Sünnet şu kaideyi yerleştirmiştir:"], [1500.0, "Eserleri gaybî olan sebepte mutlaka şer'î delil gerekir."], [1500.0, "Gaybı bilen (Allah) bize bu gaybî eseri ve bunun sebebinin bu olduğunu haber verirse, o zaman \"İşittik ve itaat ettik, iman ettik ve tasdik ettik\" deriz."]]}]}, {"ts": "25:18", "title": "5. Külliye: Eserleri hissî olan her sebep tecrübîdir", "paras": [{"reader": false, "ar": [[1518.0, "القاعدة الثا… الكليةُ الخامسة:"], [1520.2, "<b>كلُّ سببيةٍ آثارُها حسيّةٌ فتجريبية.<\/b> كل سببيةٍ آثارها حسيةٌ فتجريبية."], [1532.0, "ما أدري أنا شرحي واضح ولّا عافس اليوم؟"], [1533.9, "ها؟ أنا مستحي… الشيخ خالد <span class=\"q\">؟ 25:32<\/span>."], [1536.0, "كل سببيةٍ آثارها حسيةٌ فتجريبية."]], "tr": [[1518.0, "İkinci kai… beşinci külliye: 5."], [1518.0, "külliye: Eserleri hissî olan her sebep tecrübîdir (tecrübeyle sabit olur). Eserleri hissî olan her sebep tecrübîdir."], [1532.0, "Bilmiyorum, bugün anlatımım açık mı, yoksa karıştırıyor muyum?"], [1533.9, "Ha? Utanıyorum… Şeyh Hâlid <span class=\"q\">؟<\/span>."], [1536.0, "Eserleri hissî olan her sebep tecrübîdir."]]}, {"reader": false, "ar": [[1540.0, "وهذه الكلية متمّمةٌ للقسم الثاني،"], [1548.0, "للكلية الأولى. فإذا كان الأثر المطلوب من تعاطي هذه السببية تدركه الحواس،"], [1557.8, "فتراه العين، أو يشمّه الأنف،"], [1561.0, "أو يُدرَك بالذوق، أو تدركه الأذن بسمعها ـ يعني له آثارٌ حسيةٌ واضحة،"], [1569.0, "يراها من يراها، أو يسمعها من يسمع،"], [1572.8, "أو يذوقها من يذوق،"], [1575.0, "أو يشمّها من يشمّ،"], [1576.5, "أو يلمسها من يلمس ـ فحينئذٍ الباب فيها مفتوحٌ للتجارب."]], "tr": [[1540.0, "Bu külliye, (önceki) külliyenin ikinci kısmını tamamlayıcıdır."], [1548.0, "Bu sebebi kullanmaktan beklenen eseri duyular idrak ediyorsa —göz onu görüyor, burun onu kokluyor, tadımla idrak ediliyor veya kulak onu işitiyorsa, yani gören görsün, işiten işitsin, tadan tatsın, koklayan koklasın, dokunan dokunsun, açık hissî eserleri varsa— bu durumda onda kapı tecrübelere açıktır."]]}, {"reader": false, "ar": [[1582.0, "وعلى ذلك سببيةُ الدواء للداء،"], [1587.0, "سببيةُ الدواء الحسيّ التجريبي ـ انتبهْ ـ للدواء،"], [1593.0, "وقد يتفوّق الكفار على المسلمين في هذه السببية."], [1597.0, "ولكن السببية الأولى في الأعمّ الأغلب يُشترط في متعاطيها أن يكون مسلمًا."], [1604.0, "ولذلك لم يشترط العلماء في الدواء التجريبي أن يتعاطاه مسلم،"], [1610.0, "فأجازوا تطبيب الكافر للمسلم إذا أُمِنت غائلة تطبيبه."], [1616.0, "وأما الرقية فلا أعلم خلافًا بينهم على أن من شروط تعاطيها الإسلام،"], [1622.0, "لأن آثارها غيبية، فليست داخلةً تحت محض الاجتهاد،"], [1627.2, "وإنما لا بد أن يكون دليل الشرع ـ وإنما لا بد أن يقف وراءها دليل الشرع."]], "tr": [[1582.0, "İlacın hastalığa sebebiyeti buna göredir:"], [1587.0, "hissî ve tecrübî ilacın —dikkat et— sebebiyeti."], [1587.0, "Bu sebebiyette kâfirler Müslümanları geçebilir."], [1593.0, "Fakat birinci (gaybî) sebebiyette ise, çoğunlukla onu uygulayanın Müslüman olması şart koşulur."], [1597.0, "Bu yüzden âlimler tecrübî ilaçta onu uygulayanın Müslüman olmasını şart koşmamış, tedavisinin zararından emin olunduğu takdirde kâfirin Müslümanı tedavi etmesini caiz görmüşlerdir."], [1616.0, "Rukyeye gelince, onu uygulamanın şartlarından birinin İslâm olduğu konusunda aralarında bir ihtilaf bilmiyorum;"], [1622.0, "çünkü onun eserleri gaybîdir. Dolayısıyla o, salt içtihadın kapsamına girmez;"], [1627.2, "aksine arkasında mutlaka şer'î delilin bulunması gerekir."]]}, {"reader": false, "ar": [[1637.0, "والصناعات كلها ذات آثارٍ حسية،"], [1640.6, "فأسبابها خاضعةٌ للتجارب. وأغلب الناس الآن يعيشون في أشياء سببيتها تجريبية:"], [1655.5, "كالمكيّفات، سببٌ تجريبي، والسيارات التي نركبها إنما جرّبوا وجرّبوا حتى نفعت وصلحت،"], [1666.1, "والنظارة التي ألبسها، كلها آثارها حسية."], [1672.0, "فالذي يفرّق بين السببيتين بالتفريق بين آثارهما قد أصاب عين الحق في جواب هذا السؤال الذي ذكرته لكم آنفًا:"], [1683.0, "هل الأسباب تُقبل فيها التجارب أو لا تُقبل؟"], [1686.0, "فنقول: تُقبل فيها التجارب إذا كانت حسية،"], [1690.0, "ولا تُقبل فيها التجارب إذا كانت آثارها غيبية."]], "tr": [[1637.0, "Bütün sanayi ürünlerinin eserleri hissîdir;"], [1640.6, "dolayısıyla onların sebepleri tecrübelere tâbidir."], [1640.6, "İnsanların çoğu bugün sebebiyeti tecrübî olan şeyler içinde yaşıyor:"], [1655.5, "Klimalar tecrübî bir sebeptir; bindiğimiz arabaları denediler, denediler, ta ki faydalı ve elverişli hâle geldiler;"], [1666.1, "taktığım gözlük de öyle; hepsinin eserleri hissîdir."], [1672.0, "İki sebebiyeti, eserlerini birbirinden ayırarak ayırt eden kişi, az önce size zikrettiğim \"Sebeplerde tecrübeler kabul edilir mi, edilmez mi?\" sorusunun cevabında hakkın ta kendisine isabet etmiştir."], [1686.0, "Deriz ki: Hissî olduklarında onlarda tecrübeler kabul edilir, eserleri gaybî olduğunda tecrübeler kabul edilmez."]]}]}, {"ts": "28:15", "title": "6. Külliye: Tesiri hayalî ve vehmî olan her asılı şey temimedir", "paras": [{"reader": false, "ar": [[1695.0, "ومن الكليات أيضًا: <b>كلُّ معلَّقٍ تأثيرُه خياليٌّ توهّميٌّ فتميمة.<\/b> لا نزال في قواعد توحيد الربوبية،"], [1723.9, "في التدبير والتصريف. كل معلَّقٍ تأثيره خياليٌّ توهّميٌّ فتميمة."], [1733.1, "وهذا ضابطٌ عظيم يُعرف به التميمة من عدمها."]], "tr": [[1695.0, "Külliyelerden biri de şudur: 6."], [1695.0, "külliye: Tesiri hayalî ve vehmî olan her asılı (takılı) şey temimedir. Hâlâ rubûbiyyet tevhidinin, tedbir ve tasarruf (konusundaki) kaideleri içindeyiz."], [1723.9, "Tesiri hayalî ve vehmî olan her asılı şey temimedir."], [1723.9, "Bu, bir şeyin temime olup olmadığının bilindiği büyük bir zâbıttır."]]}, {"reader": false, "ar": [[1746.0, "فليس كلُّ ما علّقه الإنسان على نفسه،"], [1749.5, "أو على ولده، أو على دابته،"], [1752.5, "أو في بيته، يكون تميمة،"], [1755.0, "بل لا بد أن يكون هذا المعلَّق مصحوبًا بشيءٍ معيّن:"], [1760.0, "وهو أنه إنما علّقه ليطلب به أثرًا،"], [1765.0, "فإذا كان أثره من الآثار الخيالية التوهّمية فحينئذٍ ما علّقته يسمى تميمة."], [1776.0, "وأما إذا علّقته لطلب أثرٍ،"], [1779.0, "وأثرُه يترتب عليه ترتّبًا حقيقيًّا واقعيًّا،"], [1783.0, "فلا يعتبر تميمة. وبناءً على ذلك،"], [1788.0, "فما ذهب إليه بعض أهل العلم من الوصف بالتميمة لمجرد التعليق هذا فيه نظر،"], [1794.0, "وإنما لا بد من أن يكون الرابط بين المعلَّق وبين الأثر المطلوب من تعليقه توهّميًّا خياليًّا."]], "tr": [[1746.0, "İnsanın kendi üzerine, çocuğunun üzerine, hayvanının üzerine veya evine astığı her şey temime değildir."], [1752.5, "Aksine bu asılan şeyin belirli bir şeyle birlikte olması gerekir:"], [1760.0, "Onu ancak bir eser elde etmek için asmış olması."], [1765.0, "Eğer eseri hayalî ve vehmî eserlerdense, bu durumda astığın şeye temime denir."], [1776.0, "Onu bir eser elde etmek için astıysan ve eseri ona hakiki ve gerçek bir şekilde bağlanıyorsa, temime sayılmaz."], [1783.0, "Buna göre, bazı ilim ehlinin sadece asmaktan dolayı temime vasfı vermesi üzerinde düşünülmesi gereken bir görüştür;"], [1794.0, "aksine asılan şey ile asılmasından beklenen eser arasındaki bağın vehmî ve hayalî olması gerekir."]]}]}, {"ts": "30:05", "title": "6. Külliye (devam): Gözlük, küpe, boncuk ve nal; temime hadisleri", "paras": [{"reader": false, "ar": [[1805.0, "فكلُّ ما علّقته ترجو به أثرًا خياليًّا توهّميًّا فإنه تميمة."], [1811.0, "وإلا فإن ضعيف النظر يعلّق النظارة على أذنيه يطلب بها أثرًا،"], [1817.2, "وأثرُه حقيقيٌّ واقعيٌّ يحسّه الإنسان،"], [1820.0, "فإذًا تعليقها لا يعتبر تميمة،"], [1821.7, "لأن الأثر حقيقيٌّ واقعي."], [1823.7, "والطبيب يعلّق سمّاعته على رقبته يطلب بها أثرًا،"], [1829.2, "وأثر تعليقها حقيقيٌّ ولّا خيالي؟"], [1834.9, "حقيقيٌّ واقعي، فإذًا لا يعتبر تعليقها تميمة."], [1839.4, "والمرأة تعلّق القُرط في أذنها والقلادة في عنقها ـ أليس كذلك؟"], [1846.1, "ـ تطلب به جمالًا، وهي بعد التعليق تزداد جمالًا ـ بعضُ النساء طبعًا ـ تزداد جمالًا."], [1855.0, "فحينئذٍ لا يعتبر تلك المعلَّقات،"], [1858.0, "التي تترتب عليها آثارها ترتّبَ حقيقةٍ وواقع،"], [1863.0, "لا تعتبر من التمائم أبدًا."]], "tr": [[1805.0, "Hayalî ve vehmî bir eser umarak astığın her şey temimedir."], [1805.0, "Aksi hâlde, gözü zayıf olan kişi gözlüğü kulaklarına asar, onunla bir eser ister;"], [1811.0, "eseri de insanın hissettiği hakiki ve gerçek bir eserdir."], [1820.0, "O hâlde onu asmak temime sayılmaz, çünkü eser hakiki ve gerçektir."], [1823.7, "Doktor stetoskopunu boynuna asar, onunla bir eser ister;"], [1829.2, "onu asmanın eseri hakiki mi, hayalî mi?"], [1834.9, "Hakiki ve gerçek; o hâlde onu asmak temime sayılmaz."], [1839.4, "Kadın küpeyi kulağına, gerdanlığı boynuna takar —öyle değil mi?— onunla güzellik ister;"], [1846.1, "takındıktan sonra da güzelliği artar —bazı kadınlar tabii— güzelliği artar."], [1855.0, "Bu durumda, eserleri kendilerine hakiki ve gerçek bir şekilde bağlanan bu asılı şeyler asla temimelerden sayılmaz."]]}, {"reader": false, "ar": [[1865.0, "لكن هناك من المعلَّقات ما يعتقد معلِّقُها أثرًا هو في الحقيقة خيالٌ تخيّله فعمل به،"], [1875.1, "ووهمٌ توهّمه فعمل به،"], [1878.0, "ولكن ما علّقه لا يجلب له ما يريده من الخير،"], [1883.0, "ولا يدفع عنه ما يرجو دفعه من الشر،"], [1887.5, "فيكون أثره من الآثار الخيالية التوهّمية؛"], [1891.0, "هذا هو التميمة. كالذي يعلّق الودَعة لجلب خيرٍ أو دفع شرٍّ فهي تميمة،"], [1899.0, "لأن الله لم يُجرِ في كونه أن الودعة تجلب خيرًا أو تدفع شرًّا."], [1905.0, "وكالذي يعلّق على دابته الخيوط أو الحبال ليجلب خيرًا،"], [1912.5, "أو يدفع عنها العين أو الضرر، فهذا هو التميمة."]], "tr": [[1865.0, "Fakat öyle asılı şeyler vardır ki, asan kişi onda bir eser olduğuna inanır;"], [1865.0, "hâlbuki bu, gerçekte hayal ettiği ve ona göre davrandığı bir hayal, vehmettiği ve ona göre davrandığı bir vehimdir."], [1878.0, "Astığı şey ona istediği hayrı getirmez, def edilmesini umduğu şerri de ondan def etmez;"], [1887.5, "dolayısıyla onun eseri hayalî ve vehmî eserlerdendir."], [1887.5, "İşte temime budur. Hayır celbetmek veya şer def etmek için deniz kabuğu (vedaa) asan kişi gibi;"], [1891.0, "bu temimedir, çünkü Allah kâinatında deniz kabuğunun hayır getirmesini veya şer def etmesini âdet kılmamıştır."], [1905.0, "Hayır celbetmek veya nazarı ya da zararı ondan def etmek için hayvanının üzerine iplikler veya ipler asan kişi gibi; işte temime budur."]]}, {"reader": false, "ar": [[1919.0, "أو كالذي يعلّق على سيارته حَدوةَ خيل ـ أو حدوة ـ كما يُفعل في دول البلقان،"], [1928.0, "كثيرًا يُفعل، فيعلّقون حدوة الخيل هذه،"], [1932.2, "أو حديدة الخيل التي توضع في قدمه،"], [1936.0, "ولا ترتاح نفوسهم إذا دخلوا مكانًا أو ركبوا سيارةً ليس فيها شيءٌ من ذلك."], [1941.0, "فهم يعلّقونها يرجون بها أثرًا،"], [1944.2, "ولكن هذا الأثر الذي يرجونه إنما هو خياليٌّ توهّمي، فهذا هو التميمة."]], "tr": [[1919.0, "Ya da Balkan ülkelerinde yapıldığı gibi —çokça yapılır— arabasına at nalı asan kişi gibi."], [1928.0, "Bu at nalını, yani atın ayağına takılan demiri asarlar;"], [1932.2, "içinde bunlardan bir şey bulunmayan bir yere girdiklerinde veya bir arabaya bindiklerinde içleri rahat etmez."], [1941.0, "Onu bir eser umarak asarlar;"], [1944.2, "fakat umdukları bu eser ancak hayalî ve vehmîdir. İşte temime budur."]]}, {"reader": false, "ar": [[1952.0, "ولذلك قال النبي ﷺ: «من تعلّق وَدَعةً فلا ودَع الله له، ومن تعلّق تميمةً فلا أتمّ الله له»."], [1964.0, "وفي الصحيح من حديث بشير الأنصاري رضي الله تعالى عنه ـ أو أبي بشير الأنصاري رضي الله عنه ـ أن النبي ﷺ بعث رسولًا:"], [1976.5, "«أن لا يبقيَنّ في رقبة بعيرٍ قلادةٌ ـ أو قلادةٌ من وتر ـ إلا قُطِعت»،"], [1983.0, "لأنهم كانت جرت عادتهم في الجاهلية أن يعلّقوا مثل هذه المعلَّقات على الإبل ذات الصفات العظيمة دفعًا للعين."]], "tr": [[1952.0, "Bu yüzden Nebî ﷺ şöyle buyurmuştur:"], [1952.0, "«Kim bir deniz kabuğu (vedaa) takarsa Allah onu rahata erdirmesin; kim bir temime takarsa Allah onun işini tamamlamasın.» Sahîh'te Beşîr el-Ensârî —ya da Ebû Beşîr el-Ensârî— (r.a.) hadisinde, Nebî ﷺ'in bir elçi göndererek «Hiçbir devenin boynunda bir gerdanlık —ya da kiriş ipinden bir gerdanlık— bırakılmasın, mutlaka kesilsin» (diye duyurduğu) rivayet edilir."], [1983.0, "Çünkü onların cahiliyede, üstün vasıflara sahip develere nazarı def etmek için bu tür şeyler asmak âdetleriydi."]]}, {"reader": false, "ar": [[1995.0, "ولمّا رأى حذيفة رضي الله تعالى عنه رجلًا قد وضع خيطًا من الحمّى ـ أي يستدفع به الحمّى ـ قطعه،"], [2010.7, "وقال: «انزعها عنك فإنها لا تزيدك إلا وهنًا، إلا وهنًا»."], [2018.0, "فليس كلُّ معلَّقٍ يكون تميمة،"], [2023.0, "إلا إذا كان الرابط بينه وبين أثره خياليًّا توهّميًّا."]], "tr": [[1995.0, "Huzeyfe (r.a.) sıtmadan dolayı —yani onunla sıtmayı def etmek için— bir iplik takmış bir adam görünce onu kesti ve şöyle dedi:"], [2010.7, "«Onu üzerinden çıkar; o sana ancak zayıflık katar.» Dolayısıyla her asılı şey temime değildir;"], [2018.0, "ancak onunla eseri arasındaki bağ hayalî ve vehmî olursa (temime olur)."]]}]}, {"ts": "33:48", "title": "Tevhidin büyük kaidesi: Resuller kalpleri vehimlerden hakikatlere çıkarmak için gönderildi", "paras": [{"reader": false, "ar": [[2028.0, "فإذا فهمتم هذا، فأنا أردّكم إلى قاعدةٍ عظيمةٍ في التوحيد،"], [2034.0, "وعليها يُبنى التوحيد كله:"], [2038.0, "وهي أن الأصل من بعثة الرسل ونزول الكتب إخراجُ القلوب والعقول من الأوهام إلى الحقائق."], [2044.0, "أوَليست الرسل نهت عن الشرك وأمرت بالتوحيد؟"], [2050.0, "فالشرك وهمٌ والتوحيد حقيقة."], [2053.0, "أوَليس من مقاصد الرسل إخراج الناس من البدعة إلى السنة؟"], [2058.0, "فالبدعة وهمٌ والسنة حقيقة،"], [2060.0, "المعصية وهمٌ والطاعة حقيقة."], [2063.0, "فتجد أن الشرك من أوله إلى آخره مبنيٌّ على أوهام،"], [2069.0, "فإذا جاء القرآن يُبطل الشرك فإنه يزيل هذه الأوهام ليعيش الناس في حقائق."]], "tr": [[2028.0, "Bunu anladıysanız, sizi tevhidde büyük bir kaideye götürüyorum;"], [2028.0, "tevhidin tamamı onun üzerine bina edilir:"], [2034.0, "Resullerin gönderilmesinin ve kitapların indirilmesinin aslı, kalpleri ve akılları vehimlerden hakikatlere çıkarmaktır."], [2044.0, "Resuller şirki yasaklayıp tevhidi emretmedi mi?"], [2044.0, "Şirk vehimdir, tevhid hakikattir. İnsanları bid'attan sünnete çıkarmak resullerin maksatlarından değil midir?"], [2053.0, "Bid'at vehimdir, sünnet hakikattir; masiyet vehimdir, itaat hakikattir."], [2060.0, "Şirkin baştan sona vehimler üzerine kurulu olduğunu görürsün."], [2063.0, "Kur'an şirki iptal etmek için geldiğinde, insanlar hakikatler içinde yaşasın diye bu vehimleri giderir."]]}, {"reader": false, "ar": [[2077.0, "فمن محبة الله لنا ـ معاشرَ بني آدم ـ لا يرضى أن نعيش في أوهام،"], [2084.0, "فأرسل لنا الرسل لتُخرجنا من تلك الأوهام،"], [2087.0, "وأنزل لنا الكتب لتُخرجنا من تلك الخيالات،"], [2090.0, "حتى نعيش في حقائق."], [2092.0, "ولذلك قال الله عز وجل:"], [2093.9, "<span class=\"ayah\">﴿قُلْ أَفَرَأَيْتُم مَّا تَدْعُونَ مِن دُونِ اللَّهِ إِنْ أَرَادَنِيَ اللَّهُ بِضُرٍّ هَلْ هُنَّ كَاشِفَاتُ ضُرِّهِ أَوْ أَرَادَنِي بِرَحْمَةٍ هَلْ هُنَّ مُمْسِكَاتُ رَحْمَتِهِ﴾<\/span> <span class=\"ref\">[الزمر: ٣٨]<\/span>،"], [2104.7, "وعابدوها كانوا يعتقدون أنها تدفع الشر وتجلب الخير،"], [2111.0, "فجاءت الأدلة لتُخرج العقول والقلوب من هذه الأوهام."]], "tr": [[2077.0, "Ey Âdemoğulları topluluğu! Allah'ın bize olan sevgisindendir ki vehimler içinde yaşamamıza razı olmaz."], [2084.0, "Bu yüzden bizi o vehimlerden çıkarsınlar diye bize resuller gönderdi, bizi o hayallerden çıkarsınlar diye bize kitaplar indirdi;"], [2092.0, "ta ki hakikatler içinde yaşayalım."], [2093.9, "Bu yüzden Allah Teâlâ şöyle buyurmuştur:"], [2093.9, "<span class=\"ayah\">﴿De ki: Allah'ı bırakıp da taptıklarınızı hiç düşündünüz mü? Allah bana bir zarar dilerse, onlar O'nun zararını kaldırabilirler mi? Yahut bana bir rahmet dilerse, onlar O'nun rahmetini tutabilirler mi?﴾<\/span> [Zümer 38]."], [2093.9, "Onlara tapanlar onların şerri def ettiğine ve hayrı getirdiğine inanıyorlardı;"], [2111.0, "deliller de akılları ve kalpleri bu vehimlerden çıkarmak için geldi."]]}]}, {"ts": "35:16", "title": "Kaide (devam): Temime ve ezlâmın haram kılınması; dâvetçilerin vazifesi; ayetlerden örnekler", "paras": [{"reader": false, "ar": [[2116.0, "فما حُرِّمت التمائم إلا لإخراج القلوب والعقول من حيّز الأوهام والخيالات إلى حيّز الحقائق."], [2123.0, "قال الله عز وجل:"], [2125.8, "<span class=\"ayah\">﴿وَأَن تَسْتَقْسِمُوا بِالْأَزْلَامِ ۚ ذَٰلِكُمْ فِسْقٌ﴾<\/span> <span class=\"ref\">[المائدة: ٣]<\/span>،"], [2130.0, "وقد كان الرجل منهم إذا أراد سفرًا،"], [2132.8, "أو أراد بيعًا، أو أراد شراءً،"], [2135.2, "استقسم بالأزلام، فأخرجنا الله عز وجل من هذا الوهم والخيال،"], [2140.7, "وشرع لنا صلاة الاستخارة."], [2143.0, "ولذلك وظيفتُنا ـ كدعاةٍ وعلماء،"], [2145.7, "مع أنني أكره هذا الفصام النكِد بين العلماء والدعاة ـ وظيفتُنا العظمى هي إخراج القلوب والعقول من دائرة الأوهام والخيالات إلى دائرة الحقائق."]], "tr": [[2116.0, "Temimeler ancak kalpleri ve akılları vehimler ve hayaller alanından hakikatler alanına çıkarmak için haram kılınmıştır."], [2123.0, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿Fal oklarıyla kısmet aramanız (da size haram kılındı). Bunlar fısktır﴾<\/span> [Mâide 3]."], [2125.8, "Onlardan biri bir yolculuk, bir satış veya bir alım yapmak istediğinde fal oklarıyla kısmet arardı."], [2135.2, "Allah Teâlâ bizi bu vehimden ve hayalden çıkardı ve bize istihâre namazını meşru kıldı."], [2140.7, "Bu yüzden dâvetçiler ve âlimler olarak vazifemiz —gerçi âlimler ile dâvetçiler arasındaki bu uğursuz ayrımdan hoşlanmıyorum— en büyük vazifemiz, kalpleri ve akılları vehimler ve hayaller dairesinden hakikatler dairesine çıkarmaktır."]]}, {"reader": false, "ar": [[2163.0, "قال الله عز وجل:"], [2165.7, "<span class=\"ayah\">﴿وَالَّذِينَ تَدْعُونَ مِن دُونِهِ مَا يَمْلِكُونَ مِن قِطْمِيرٍ﴾<\/span> <span class=\"ref\">[فاطر: ١٣]<\/span>،"], [2171.0, "وقد كانوا يتوهّمون أنهم يملكون؛"], [2175.0, "<span class=\"ayah\">﴿إِن تَدْعُوهُمْ لَا يَسْمَعُوا دُعَاءَكُمْ﴾<\/span>،"], [2178.0, "وقد كانوا يتخيّلون أنهم يسمعون؛"], [2181.0, "<span class=\"ayah\">﴿وَلَوْ سَمِعُوا مَا اسْتَجَابُوا لَكُمْ﴾<\/span>،"], [2183.5, "وقد كانوا يتخيّلون أنهم يستجيبون؛"], [2186.0, "<span class=\"ayah\">﴿وَيَوْمَ الْقِيَامَةِ يَكْفُرُونَ بِشِرْكِكُمْ ۚ وَلَا يُنَبِّئُكَ مِثْلُ خَبِيرٍ﴾<\/span> <span class=\"ref\">[فاطر: ١٤]<\/span>،"], [2191.0, "وقد كانوا يدّخرون عبادتهم إلى أنهم سينفعونهم يوم القيامة."], [2197.0, "ولكن قال الله عز وجل ـ إزالةً لهذا الوهم والخيال قبل أن تموتوا وتواجهوا الحقيقة التي ما أعددتم لها توحيدًا صحيحًا ولا إيمانًا صريحًا ـ:"]], "tr": [[2163.0, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿O'nu bırakıp da taptıklarınız bir çekirdek zarına bile sahip değildir﴾<\/span> [Fâtır 13];"], [2165.7, "hâlbuki onlar, bunların (bir şeye) sahip olduklarını vehmediyorlardı."], [2175.0, "<span class=\"ayah\">﴿Onlara dua etseniz duanızı işitmezler﴾<\/span>;"], [2175.0, "hâlbuki onlar işittiklerini hayal ediyorlardı."], [2178.0, "<span class=\"ayah\">﴿İşitseler bile size cevap veremezler﴾<\/span>;"], [2181.0, "hâlbuki onlar cevap verdiklerini hayal ediyorlardı."], [2183.5, "<span class=\"ayah\">﴿Kıyamet günü de sizin şirkinizi inkâr ederler. (Her şeyden) haberdar olan (Allah) gibi sana kimse haber veremez﴾<\/span> [Fâtır 14];"], [2186.0, "hâlbuki onlar, kıyamet günü kendilerine fayda vereceklerine (güvenerek) ibadetlerini onlar için biriktiriyorlardı."], [2197.0, "Fakat Allah Teâlâ —ölmeden ve kendisi için ne sahih bir tevhid ne de sarih bir iman hazırladığınız hakikatle yüzleşmeden önce bu vehmi ve hayali gidermek için— şöyle buyurmuştur:"]]}, {"reader": false, "ar": [[2209.0, "<span class=\"ayah\">﴿وَمَنْ أَضَلُّ مِمَّن يَدْعُو مِن دُونِ اللَّهِ مَن لَّا يَسْتَجِيبُ لَهُ إِلَىٰ يَوْمِ الْقِيَامَةِ﴾<\/span>،"], [2214.0, "وقد كانوا يظنون أنهم سيستجيبون،"], [2216.0, "<span class=\"ayah\">﴿وَهُمْ عَن دُعَائِهِمْ غَافِلُونَ﴾<\/span> <span class=\"ayah\">﴿وَإِذَا حُشِرَ النَّاسُ كَانُوا لَهُمْ أَعْدَاءً وَكَانُوا بِعِبَادَتِهِمْ كَافِرِينَ﴾<\/span> <span class=\"ref\">[الأحقاف: ٥–٦]<\/span>."], [2224.0, "كلُّ هذه آياتٌ تزيل ـ إيش؟"], [2226.0, "ـ عن العقول والقلوب الأوهام،"], [2228.0, "تُخرجهم من دائرة الأوهام إلى دائرة الحقائق."]], "tr": [[2209.0, "<span class=\"ayah\">﴿Allah'ı bırakıp da kıyamet gününe kadar kendisine cevap veremeyecek olanlara dua edenden daha sapık kim vardır?﴾<\/span>;"], [2209.0, "hâlbuki onlar cevap vereceklerini sanıyorlardı."], [2214.0, "<span class=\"ayah\">﴿Onlar ise bunların dualarından habersizdirler. İnsanlar (mahşerde) toplandığı zaman, (taptıkları) onlara düşman olurlar ve onların ibadetlerini inkâr ederler﴾<\/span> [Ahkâf 5–6]."], [2216.0, "Bütün bunlar, akıllardan ve kalplerden —neyi?— vehimleri gideren, onları vehimler dairesinden hakikatler dairesine çıkaran ayetlerdir."]]}, {"reader": false, "ar": [[2231.0, "قال الله عز وجل:"], [2233.5, "<span class=\"ayah\">﴿وَقَالَ إِنَّمَا اتَّخَذْتُم مِّن دُونِ اللَّهِ أَوْثَانًا مَّوَدَّةَ بَيْنِكُمْ فِي الْحَيَاةِ الدُّنْيَا ۖ ثُمَّ يَوْمَ الْقِيَامَةِ يَكْفُرُ بَعْضُكُم بِبَعْضٍ﴾<\/span> <span class=\"ref\">[العنكبوت: ٢٥]<\/span>،"], [2244.0, "أي: انتبهوا الآن قبل يوم القيامة،"], [2246.0, "اخرجوا من هذا الوهم،"], [2247.0, "لن ينفعوكم يوم القيامة،"], [2249.0, "لن يقفوا في صفّكم يوم القيامة."], [2252.0, "بل كلُّ ما عُبد من دون الله فسيكون مع عابده في النار يوم القيامة،"], [2259.0, "كما قال الله عز وجل:"], [2261.3, "<span class=\"ayah\">﴿إِنَّكُمْ وَمَا تَعْبُدُونَ مِن دُونِ اللَّهِ حَصَبُ جَهَنَّمَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٩٨]<\/span>."], [2264.9, "فمن كان يعبد الطواغيت يكون مع الطواغيت في جهنم،"], [2269.0, "ومن كان يعبد القمر يكون معه في النار،"], [2272.0, "ومن كان يعبد الشمس فيكون معها في النار."]], "tr": [[2231.0, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿(İbrâhîm) dedi ki: Siz, dünya hayatında aranızdaki sevgi (bağı) yüzünden Allah'ı bırakıp putlar edindiniz. Sonra kıyamet günü birbirinizi inkâr edeceksiniz﴾<\/span> [Ankebût 25]."], [2233.5, "Yani: Kıyamet gününden önce şimdi uyanın, bu vehimden çıkın;"], [2244.0, "kıyamet günü size fayda vermeyecekler, kıyamet günü sizin safınızda durmayacaklar."], [2249.0, "Aksine Allah'tan başka ibadet edilen her şey kıyamet günü kendisine ibadet edenle birlikte ateşte olacaktır."], [2259.0, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [2261.3, "<span class=\"ayah\">﴿Siz ve Allah'ı bırakıp taptıklarınız cehennemin yakıtısınız﴾<\/span> [Enbiyâ 98]."], [2264.9, "Tâğûtlara tapan tâğûtlarla birlikte cehennemde olacak;"], [2269.0, "aya tapan onunla birlikte ateşte olacak;"], [2269.0, "güneşe tapan da onunla birlikte ateşte olacaktır."]]}, {"reader": false, "ar": [[2275.0, "وهذا هو الحكمة من قول النبي ﷺ:"], [2279.0, "«الشمس والقمر ثوران مكوَّران يوم القيامة»،"], [2282.0, "إما لزيادة التعذيب بهما،"], [2284.9, "أو لزيادة تبكيت عابدِيهما،"], [2288.0, "لكن العلماء مجمعون على أنها ليست لتعذيبهما."], [2293.0, "واضحٌ كلامي؟ فما حُرِّمت التمائم إلا لإخراج العقول والقلوب من دائرة الأوهام والخيالات إلى دائرة الحقائق،"], [2303.0, "وما حُرِّم باب الطِّيَرة وجُعل شركًا إلا لإخراج العقول والقلوب من دائرة الأوهام."]], "tr": [[2275.0, "Nebî ﷺ'in «Güneş ve ay kıyamet günü dürülmüş iki boğa (gibi) olacaktır» sözünün hikmeti budur:"], [2279.0, "Ya onlarla azabı artırmak için ya da onlara tapanları daha çok azarlamak için."], [2284.9, "Fakat âlimler bunun, onların (güneş ve ayın) kendilerine azap için olmadığında icma etmiştir."], [2293.0, "Sözüm anlaşıldı mı? Temimeler ancak akılları ve kalpleri vehimler ve hayaller dairesinden hakikatler dairesine çıkarmak için haram kılındı;"], [2303.0, "tıyara babı da ancak akılları ve kalpleri vehimler dairesinden çıkarmak için haram kılındı ve şirk sayıldı."]]}]}, {"ts": "38:29", "title": "Tevhidin en büyük maksadı; sahih ve bâtıl akîdeyi ayırt eden kaide · Kapanış", "paras": [{"reader": false, "ar": [[2309.0, "إذًا مقصودُ التوحيد الأعظم ـ مقصود التوحيد الأعظم ـ إخراجُ القلوب والعقول من هذه الأوهام والخيالات التي سببها الشيطان إلى دائرة الحقائق."], [2323.0, "وإنّ من أغيظ الناس على الشيطان من يُخرج فرائسه من شباك توهّماته وخيالاته إلى دائرة الحقائق."], [2334.0, "ولذلك العلماء هم أغيظ الناس على الشيطان،"], [2337.0, "لماذا؟ لأن الشيطان لا تُفلح مساعيه إلا إذا كان في بيئةٍ يعشعش فيها بتلك الخيالات والأوهام،"], [2346.0, "من غير وجود من يكشفها."], [2349.0, "العلماء ورثة الأنبياء، لأن وظيفة الأنبياء إخراج القلوب والعقول من هذا إلى هذا،"], [2356.0, "والعلماء وظيفتهم أيضًا إخراج القلوب والعقول من هذا إلى هذا."]], "tr": [[2309.0, "O hâlde tevhidin en büyük maksadı, kalpleri ve akılları, sebebi şeytan olan bu vehimlerden ve hayallerden hakikatler dairesine çıkarmaktır."], [2309.0, "Şeytanı en çok öfkelendiren insanlardan biri, onun avlarını vehimlerinin ve hayallerinin ağlarından hakikatler dairesine çıkaran kimsedir."], [2323.0, "Bu yüzden âlimler şeytanı en çok öfkelendiren insanlardır."], [2334.0, "Neden? Çünkü şeytanın çabaları, ancak o hayaller ve vehimlerle yuvalandığı ve onları açığa çıkaran kimsenin bulunmadığı bir ortamda başarılı olur."], [2346.0, "Âlimler peygamberlerin vârisleridir; çünkü peygamberlerin vazifesi kalpleri ve akılları bundan buna çıkarmaktır;"], [2356.0, "âlimlerin vazifesi de kalpleri ve akılları bundan buna çıkarmaktır."]]}, {"reader": false, "ar": [[2360.0, "ولذلك سُئلت يومًا من الأيام عن مسألة:"], [2365.0, "هل عندك قاعدةٌ تبيّن لنا الاعتقاد الصحيح من الباطل؟"], [2369.0, "فقلت: نعم، قاعدةٌ واحدة:"], [2371.0, "كلُّ عقيدةٍ توهّميةٍ خياليةٍ فباطل،"], [2374.0, "وكلُّ عقيدةٍ حقيقيةٍ واقعيةٍ فصحيح."], [2379.0, "لماذا كان الاعتقاد في الأولياء والصالحين باطلًا؟"], [2385.0, "لأنه عقيدةٌ توهّميةٌ خيالية."], [2387.0, "لماذا كان الاعتقاد في الأوثان والأصنام باطلًا؟"], [2391.0, "لأنها عقيدةٌ خياليةٌ وهمية."], [2393.0, "لماذا كان الاعتقاد في الله اعتقادًا صحيحًا؟"], [2397.2, "لأنه عقيدةٌ حقيقيةٌ واقعية."], [2401.0, "لماذا كان الإلحاد باطلًا؟"], [2403.9, "لأنه عقيدةٌ خياليةٌ وهمية."]], "tr": [[2360.0, "Bu yüzden bir gün bana bir mesele soruldu:"], [2360.0, "\"Bize sahih inancı bâtıldan ayırt eden bir kaiden var mı?\" Dedim ki:"], [2369.0, "Evet, tek bir kaide: Vehmî ve hayalî her akîde bâtıldır;"], [2371.0, "hakiki ve gerçek her akîde sahihtir."], [2374.0, "Veliler ve salihler hakkındaki (şirkî) inanç neden bâtıldır?"], [2379.0, "Çünkü vehmî ve hayalî bir akîdedir."], [2385.0, "Putlar ve heykeller hakkındaki inanç neden bâtıldır?"], [2387.0, "Çünkü hayalî ve vehmî bir akîdedir."], [2391.0, "Allah'a inanç neden sahih bir inançtır?"], [2393.0, "Çünkü hakiki ve gerçek bir akîdedir."], [2397.2, "İlhad (ateizm) neden bâtıldır? Çünkü hayalî ve vehmî bir akîdedir."]]}, {"reader": false, "ar": [[2408.0, "فإذًا نأخذ قاعدةً توحيديةً عظيمة:"], [2410.0, "كلُّ عقيدةٍ توصل إلى وهمٍ وخيالٍ فباطلة،"], [2417.0, "وكلُّ عقيدةٍ توصل إلى حقيقةٍ وواقعٍ فصحيحة."], [2423.0, "لا أريد الإطالة عليكم،"], [2424.3, "لعلنا نقف عند هذا الحد."], [2426.0, "والله أعلم، وصلى الله وسلم على نبينا محمد."]], "tr": [[2408.0, "O hâlde tevhide dair büyük bir kaide alıyoruz:"], [2410.0, "Vehme ve hayale götüren her akîde bâtıldır;"], [2410.0, "hakikate ve gerçeğe götüren her akîde sahihtir."], [2417.0, "Sizi fazla uzatmak istemiyorum; belki bu noktada duralım."], [2424.3, "Allah en iyisini bilir. Allah Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
