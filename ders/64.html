<script>
const D={"no": 64, "vid": "XhYm8KmnrL8", "title_ar": "الدرس (٦٤) من شرح كليات العقيدة — كليات المحاذير في باب الصفات: المجاز والتعطيل والتحريف والتمثيل", "title_tr": "Şerhu Külliyyâti'l-Akîde — 64. Ders: Sıfatlar Babındaki Mahzurlar (Sıfatı Mecaza Hamletmek, Ta'til, Tahrif, Muattılın Mümessil ve Mümessilin Muattıl Oluşu, Bâtıl Lâzımların Sebebi)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Allah'ın bir sıfatını mecaza hamleden herkes bid'at ehlindendir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.1, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.1, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.7, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [10.8, "أمّا بعد: فقد ابتدأنا ـ ولله الحمدُ والمنّة ـ في الدرس الماضي،"], [15.9, "أو اللقاء الماضي، في شيءٍ من كلّيّات توحيد الصفات عند أهل السنّة والجماعة،"], [22.6, "ولعلّنا نأخذ في هذا الدرس ـ إن شاء الله ـ أيضًا جُمَلًا من الكلّيّات."], [28.3, "فأقول وبالله التوفيق: الكلّيّة الأولى:"], [30.9, "<b>كلُّ من حمل صفةً لله عز وجل على المجاز فمن أهل البدع.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.5, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.8, "Bundan sonra: Geçen derste —veya geçen buluşmada— —hamd ve minnet Allah'adır— Ehl-i Sünnet ve'l-Cemaat nezdinde sıfatların tevhidine dair külliyelerden bir kısmına başlamıştık."], [23.5, "Belki bu derste de inşallah birtakım külliyeler alırız."], [28.3, "Tevfik Allah'tandır, derim ki: 1."], [29.8, "külliye: Allah Azze ve Celle'ye ait bir sıfatı mecaza hamleden herkes bid'at ehlindendir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[36.0, "<b>كلُّ من حمل صفةً لله عز وجل على المجاز فمن أهل البدع.<\/b> أقول وبالله التوفيق:"], [55.2, "وهذا بإجماع أهل السنّة والجماعة؛"], [61.0, "لأنّ المتقرِّر في القواعد أنّ ما كان غيبيًّا فيكون توقيفيًّا على النصّ،"], [65.0, "ولأنّ المتقرِّر في القواعد أن لا مجازَ في مسألةٍ غيبيّة؛"], [71.0, "وذلك لأنّ المجاز عمليّةٌ عقليّة،"], [75.0, "والمتقرِّر في القواعد أنه لا يجوز إقحامُ العقل استقلالًا فيما كان غيبيًّا."]], "tr": [[36.0, "<b>1. külliye: Allah Azze ve Celle'ye ait bir sıfatı mecaza hamleden herkes bid'at ehlindendir.<\/b> Tevfik Allah'tandır, derim ki:"], [55.2, "Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyladır."], [56.6, "Çünkü kaidelerde yerleşik olan şudur:"], [61.0, "Gaybî olan şey nassa bağlıdır (tevkîfîdir)."], [63.7, "Yine kaidelerde yerleşik olan şudur:"], [66.8, "Gaybî bir meselede mecaz yoktur."], [71.0, "Bu da mecazın aklî bir işlem olmasındandır."], [75.0, "Kaidelerde yerleşik olan şudur: Gaybî olan şeye aklı müstakil olarak sokmak caiz değildir."]]}, {"reader": false, "ar": [[83.0, "ومن المعلوم المتقرِّر عند أهل السنّة والجماعة أنّ الأصل حملُ ألفاظ نصوص الصفات على حقائقها وظاهرها؛"], [93.0, "فمن انتقل من حقيقتها إلى مجازاتها فمن أهل البدع،"], [97.0, "ومن انتقل من ظاهرها إلى مؤوَّلها بلا قرينةٍ توجب ذلك فهو من أهل البدع أيضًا."], [106.0, "وهنا لمحةٌ لا بدّ أن ننتبه لها في هذه القضيّة،"], [112.0, "أو نقول: وهنا لمحتان لا بدّ أن ننتبه لهما في هذه القضيّة."]], "tr": [[83.0, "Ehl-i Sünnet ve'l-Cemaat nezdinde bilinen ve yerleşik olan şudur:"], [87.7, "Asıl olan, sıfat naslarının lafızlarını hakikatlerine ve zahirlerine hamletmektir."], [93.0, "Kim onların hakikatinden mecazlarına geçerse bid'at ehlindendir."], [96.1, "Kim de onların zahirinden, bunu gerektiren bir karine olmaksızın müevveline geçerse o da bid'at ehlindendir."], [106.0, "Burada bu meselede dikkat etmemiz gereken bir nükte var;"], [111.4, "ya da diyelim ki: Burada bu meselede dikkat etmemiz gereken iki nükte var."]]}, {"reader": false, "ar": [[121.0, "اللمحة الأولى: اعلم ـ رحمك الله تعالى ـ أنّ المجاز لا يجوز أن نقول به إلا إذا كنّا متصوِّرين أصالةً لحقيقة الشيء؛"], [136.0, "فالشيء إذا لم يكن العقلُ يُدرك حقيقتَه فلا يجوز أن نقول بأنّ المراد به مجازُه."], [143.0, "فلو أنني قلتُ لكم:"], [145.7, "«دخلتُ المسجد فرأيتُ أسدًا قد امتطى صهوةَ المنبر يخطب»،"], [153.0, "فإنّ جميع السامعين لكلامي لن يفهموا منه الأسدَ حقيقةً،"], [159.0, "لأنهم يعلمون حقيقةَ الأسد المفترس."]], "tr": [[121.0, "Birinci nükte: Bil ki —Allah Teâlâ sana rahmet etsin— mecazı ancak bir şeyin hakikatini aslen tasavvur ediyorsak söyleyebiliriz."], [136.0, "Aklın hakikatini idrak etmediği bir şey hakkında \"bununla kastedilen mecazıdır\" dememiz caiz değildir."], [143.0, "Size \"Mescide girdim, minberin sırtına binmiş hutbe veren bir aslan gördüm\" desem, sözümü dinleyenlerin hiçbiri bundan gerçek aslanı anlamaz;"], [157.7, "çünkü onlar yırtıcı aslanın hakikatini bilirler."]]}, {"reader": false, "ar": [[165.0, "ولو قلتُ لكم: «دخلتُ الفصل فرأيتُ حمارًا بين الطلاب»،"], [172.0, "فإنّ أحدًا لن يفهم أنه الحمارُ الحقيقيّ،"], [176.0, "وإنما سيفهم أنه الطالبُ البليد الغبيّ؛"], [182.0, "لأنّ السامع يعرف حقيقةَ الحمار،"], [187.0, "ولا يمكن أن يتصوّر وجودَ حقيقة الحمار في هذا المكان."], [190.0, "فمتى ما كان العقلُ متصوِّرًا لحقيقة الشيء فله الأحقّيّةُ ـ مع وجود القرينة ـ أن يقول:"], [198.3, "لا يُراد بالكلام حقيقتُه،"], [200.1, "وإنما يُراد به المجاز."]], "tr": [[165.0, "Size \"Sınıfa girdim, talebelerin arasında bir eşek gördüm\" desem, hiç kimse bunun gerçek eşek olduğunu anlamaz;"], [174.9, "bilakis onun ahmak, kalın kafalı talebe olduğunu anlar."], [182.0, "Çünkü dinleyen, eşeğin hakikatini bilir ve eşeğin hakikatinin bu mekânda bulunmasını tasavvur edemez."], [190.0, "Akıl bir şeyin hakikatini tasavvur ettiği zaman, —karine de bulunursa— \"Sözle hakikati kastedilmiyor, mecazı kastediliyor\" demeye hakkı olur."]]}, {"reader": false, "ar": [[202.0, "لكنّ هذا لا يجوز دخولُه في مسائل الغيب أبدًا؛"], [208.0, "لأنّ كيفيّاتِ ما أخبرنا به من الغيبيّات لا تُدرك عقولُنا كيفيّتَه."], [217.0, "فإذا قال الله عز وجل:"], [218.8, "<span class=\"ayah\">﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٧]<\/span>، لا حقَّ لأحدٍ أن يقول:"], [221.7, "لا يُراد به الوجهُ حقيقةً،"], [223.5, "وإنما يُراد به المجاز؛"], [225.0, "لأنّ من شرط القول بالمجاز في الشيء أن يُدرك العقلُ حقيقةَ الشيء وكيفيّتَه."], [233.0, "وهل العقول تُدرك كيفيّةَ وجه الله عز وجل؟ الجواب: بالطبع لا."]], "tr": [[202.0, "Fakat bunun gayb meselelerine girmesi asla caiz değildir."], [208.0, "Çünkü bize haber verilen gaybî şeylerin keyfiyetlerini akıllarımız idrak edemez."], [217.0, "Allah Azze ve Celle <span class=\"ayah\">﴿Rabbinin yüzü bâki kalır﴾<\/span> [Rahmân 27] buyurduğunda, hiç kimsenin \"Bununla hakikaten yüz kastedilmiyor, mecaz kastediliyor\" demeye hakkı yoktur."], [225.0, "Çünkü bir şey hakkında mecaz demenin şartı, aklın o şeyin hakikatini ve keyfiyetini idrak etmesidir."], [233.0, "Akıllar Allah Azze ve Celle'nin yüzünün keyfiyetini idrak edebilir mi? Cevap: Elbette hayır."]]}, {"reader": false, "ar": [[239.0, "وإذا قال الله عز وجل:"], [242.1, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span>، فلا يجوز لأحدٍ أن يقول:"], [246.0, "لا يُراد به اليدُ حقيقةً،"], [248.0, "وإنما يُراد به النعمةُ والقدرة؛"], [250.0, "لأنّ حقيقةَ كيفيّة يد الله عز وجل ليست داخلةً تحت مُدرَكات العقول."], [257.0, "فشيءٌ لا يُدرك العقلُ كيفيّتَه ولا حقيقتَه ولا كُنهَه،"], [263.0, "لا حقَّ له أن يقول:"], [265.3, "لا يُراد به حقيقتُه،"], [267.2, "وإنما يُراد به مجازُه."]], "tr": [[239.0, "Allah Azze ve Celle <span class=\"ayah\">﴿Bilakis O'nun iki eli açıktır﴾<\/span> [Mâide 64] buyurduğunda, hiç kimsenin \"Bununla hakikaten el kastedilmiyor, nimet ve kudret kastediliyor\" demesi caiz değildir."], [250.0, "Çünkü Allah Azze ve Celle'nin elinin keyfiyetinin hakikati, akılların idrak ettiği şeylerin kapsamına girmez."], [257.0, "Keyfiyetini, hakikatini ve künhünü idrak edemediği bir şey hakkında aklın \"Bununla hakikati kastedilmiyor, mecazı kastediliyor\" demeye hakkı yoktur."]]}, {"reader": false, "ar": [[269.0, "وإذا سمعنا قولَ النبيّ صلى الله عليه وسلم:"], [275.0, "«ينزل ربُّنا إلى السماء الدنيا»،"], [278.0, "فلا حقَّ لأحدٍ أن يقول:"], [280.5, "لا يُراد به النزولُ حقيقةً،"], [283.0, "وإنما يُراد به نزولُ المَلَك أو الرحمة أو الأمر."], [286.0, "لماذا؟ لأنّ الانتقال من حقيقة الكلام إلى مجازه من شرطه أن يكون العقلُ متصوِّرًا لحقيقة الشيء."], [297.0, "وهل عقلُك ـ يا ابنَ آدم ـ يُدرك كيفيّةَ نزول الله عز وجل،"]], "tr": [[269.0, "Peygamber sallallâhu aleyhi ve sellem'in \"Rabbimiz dünya semasına iner\" sözünü işittiğimizde, hiç kimsenin \"Bununla hakikaten iniş kastedilmiyor;"], [280.5, "meleğin, rahmetin veya emrin inişi kastediliyor\" demeye hakkı yoktur."], [286.0, "Neden? Çünkü sözün hakikatinden mecazına geçmenin şartı, aklın o şeyin hakikatini tasavvur etmesidir."], [294.3, "Ey Âdemoğlu! Senin aklın Allah Azze ve Celle'nin inişinin keyfiyetini idrak ediyor mu ki,"]]}]}, {"ts": "05:01", "title": "1. Külliye (devam): Sıfat nasları hakikatleri üzere bırakılır; muattılın temsilden kaçışı", "paras": [{"reader": false, "ar": [[301.0, "حتى يأبى عقلُك أن يحمله على حقيقته؟"], [305.0, "الجواب: لا. فحقيقةُ قول هؤلاء الذين يُقحمون عقولَهم في نصوص الصفات،"], [312.0, "ويصرفونها عن ظواهرها إلى مؤوَّلها،"], [316.0, "أو يصرفونها من حقائقها إلى مجازاتها ـ حقيقةُ قولهم أنهم يُقحمون عقولَهم في شيءٍ عقولُهم أصلًا لا تُدركه."], [326.0, "فهذا من التخوُّض في باب الغيب الذي أطبقت كلمةُ أهل السنّة والجماعة على تحريمه ومنعه."]], "tr": [[301.0, "aklın onu hakikatine hamletmekten kaçınsın?"], [305.0, "Cevap: Hayır. Sıfat naslarına akıllarını sokan, onları zahirlerinden müevvellerine çeviren veya hakikatlerinden mecazlarına çeviren bu kimselerin sözünün hakikati şudur:"], [320.5, "Akıllarını, akıllarının zaten idrak edemediği bir şeye sokuyorlar."], [326.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'in haram ve yasak olduğunda söz birliği ettiği, gayb babına dalmaktandır."]]}, {"reader": false, "ar": [[335.0, "وبناءً على ذلك فكلُّ نصٍّ من نصوص الصفات يُثبت شيئًا من الصفات لله عز وجل،"], [342.0, "فالواجب أن نبقى فيه على حقيقته،"], [345.0, "والواجب فيه أن نبقى على ظاهره،"], [348.0, "ولا يحلّ لنا أن نسمح لعقولنا أن تتخوّض فيه فتنقلَه من الحقيقة إلى المجاز،"], [356.3, "إلا إذا ورد ناقل،"], [359.0, "ولا أعلم في صفات الله عز وجل ناقلًا يُوجب هذا الانتقال."], [363.0, "ولذلك أجمع أهل السنّة والجماعة على أنّ نصوص الصفات تُمَرّ كما جاءت،"], [371.0, "من غير تحريفٍ ولا تعطيل،"], [372.5, "ومن غير تكييفٍ ولا تمثيل؛"], [374.0, "لأنّ الله <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ ۖ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>."]], "tr": [[335.0, "Buna binaen Allah Azze ve Celle'ye sıfatlardan bir şeyi isbat eden sıfat naslarının her biri hakkında vâcip olan, onun hakikati üzere kalmamız ve zahiri üzere kalmamızdır."], [350.8, "Akıllarımızın ona dalıp onu hakikatten mecaza nakletmesine izin vermemiz bize helal değildir;"], [359.7, "ancak bir nakledici (delil) varid olursa başka."], [363.0, "Allah Azze ve Celle'nin sıfatlarında bu geçişi gerektiren bir nakledici bilmiyorum."], [367.7, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat, sıfat naslarının tahrif ve ta'til olmaksızın, tekyîf ve temsil olmaksızın geldiği gibi geçirileceğinde icmâ etmiştir."], [374.0, "Çünkü Allah <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur; O, işitendir, görendir﴾<\/span> [Şûrâ 11]."]]}, {"reader": false, "ar": [[377.0, "فخلاصةُ هذه اللمحة الأولى أنني أُبيّن فيها لماذا لا يجوز إقحامُ المجاز في صفات الله عز وجل."], [390.0, "وعلّتُه أنّ من شرط القول بالمجاز في الشيء أن يُدرك العقلُ حقيقةَ الشيء وكُنهَه وكيفيّتَه،"], [398.0, "وبما أنّ كيفيّاتِ وحقائقَ صفات الله عز وجل غيرُ داخلةٍ أصلًا تحت مُدرَكات عقولنا،"], [406.0, "فحينئذٍ لا يجوز أن ننتقل من حقائقها إلى مجازاتها."]], "tr": [[377.0, "Bu birinci nüktenin özeti şudur:"], [380.3, "Burada mecazı Allah Azze ve Celle'nin sıfatlarına sokmanın neden caiz olmadığını açıklıyorum."], [390.0, "Bunun illeti şudur: Bir şey hakkında mecaz demenin şartı, aklın o şeyin hakikatini, künhünü ve keyfiyetini idrak etmesidir."], [398.0, "Allah Azze ve Celle'nin sıfatlarının keyfiyetleri ve hakikatleri ise akıllarımızın idrak ettiği şeylerin kapsamına aslen girmediğine göre, o hâlde onların hakikatlerinden mecazlarına geçmemiz caiz değildir."]]}, {"reader": false, "ar": [[411.0, "وهذا يؤكّد لنا أنّ القوم ـ وأعني بهم أهلَ البدع ـ مثّلوا صفاتِ الله عز وجل بصفات خلقه،"], [424.0, "فأرادوا بعقولهم أن يفرّوا من هذه الحقيقة التي فرضوها هم ببدعتهم."], [437.0, "فلمّا لم يفهموا من وجه الله عز وجل إلا ما يفهمونه من وجه المخلوق،"], [447.0, "قالوا: لا يُراد بالوجه حقيقتُه."], [450.0, "ولمّا لم يفهموا من يد الله إلا كما يفهمون من يد المخلوق،"], [455.0, "قالوا: لا يُراد باليد حقيقتُها."]], "tr": [[411.0, "Bu bize şunu teyit eder:"], [413.8, "O topluluk —bid'at ehlini kastediyorum— Allah Azze ve Celle'nin sıfatlarını mahlûkatının sıfatlarına benzettiler (temsil ettiler);"], [425.4, "sonra akıllarıyla, kendi bid'atleriyle varsaydıkları bu hakikatten kaçmak istediler."], [437.0, "Allah Azze ve Celle'nin yüzünden ancak mahlûkun yüzünden anladıklarını anlayınca \"Yüzle hakikati kastedilmiyor\" dediler."], [450.0, "Allah'ın elinden ancak mahlûkun elinden anladıkları gibi anlayınca \"Elle hakikati kastedilmiyor\" dediler."]]}, {"reader": false, "ar": [[458.0, "ولمّا لم يفهموا من استواء الله على عرشه إلا كما يفهمونه من استواء المخلوق على كرسيّه،"], [468.0, "أو على ظهور الفُلك والرواحل،"], [471.0, "قالوا: لا يُراد بالاستواء حقيقتُه."], [474.0, "ولمّا لم يفهموا من عين الله عز وجل إلا ما يفهمونه من عين المخلوق،"], [482.0, "قالوا: لا يُراد بالعين حقيقتُها،"], [485.0, "وإنما يُراد بها العلمُ فقط."], [489.0, "ولمّا لم يفهموا من نزول الله عز وجل إلا ما يفهمونه من نزول المخلوق،"], [496.0, "قالوا: لا يُراد بالنزول حقيقتُه،"], [498.8, "وإنما يُراد به مجازُه."]], "tr": [[458.0, "Allah'ın Arşı üzerine istivâsından ancak mahlûkun kürsüsü üzerine veya gemilerin ve binek hayvanlarının sırtları üzerine istivâsından anladıkları gibi anlayınca \"İstivâ ile hakikati kastedilmiyor\" dediler."], [474.0, "Allah Azze ve Celle'nin gözünden ancak mahlûkun gözünden anladıklarını anlayınca \"Gözle hakikati kastedilmiyor, onunla sadece ilim kastediliyor\" dediler."], [489.0, "Allah Azze ve Celle'nin inişinden ancak mahlûkun inişinden anladıklarını anlayınca \"İnişle hakikati kastedilmiyor, onunla mecazı kastediliyor\" dediler."]]}, {"reader": false, "ar": [[501.0, "ولذلك صَدَقَ <span class=\"q\">؟ 08:21<\/span> قولُ أهل السنّة لمّا قالوا:"], [505.8, "كلُّ معطِّلٍ فهو ممثِّل؛"], [509.0, "لأنه لم يصل إلى رتبة التعطيل إلا بعد أن ارتقى درجةَ التمثيل،"], [515.4, "كما سيأتينا في قاعدةٍ خاصّة."]], "tr": [[501.0, "Bu yüzden Ehl-i Sünnet'in \"Her muattıl (ta'til eden) mümessildir (temsil eden)\" sözü <span class=\"q\">؟<\/span> doğru çıkmıştır."], [509.0, "Çünkü o, ta'til mertebesine ancak temsil basamağına çıktıktan sonra ulaşmıştır;"], [514.3, "nitekim (bu) bize özel bir kaidede gelecek."]]}]}, {"ts": "08:38", "title": "1. Külliye (devam): İkinci nükte: Dilde, Kur'an'da ve Sünnet'te mecazın varlığı hakkındaki ihtilaf", "paras": [{"reader": false, "ar": [[518.0, "اللمحة الثانية: اختلف العلماء ـ رحمهم الله تعالى ـ في وجود المجاز في الكلام أصالةً،"], [529.0, "بين مشدِّدٍ في نفيه جدًّا،"], [532.0, "وبين متراخٍ في إطلاقه جدًّا،"], [538.0, "وبين متوسّط. والمتقرِّر في القواعد أنّ خيرَ الأمور أوساطُها."]], "tr": [[518.0, "İkinci nükte: Âlimler —Allah onlara rahmet etsin— sözde mecazın aslen var olup olmadığında ihtilaf etmişlerdir:"], [527.9, "Kimisi onu nefyetmekte çok sıkı davranır, kimisi onu kullanmakta çok gevşek davranır, kimisi de orta yoldadır."], [541.0, "Kaidelerde yerleşik olan şudur: İşlerin hayırlısı ortalamasıdır."]]}, {"reader": false, "ar": [[547.0, "فمن أهل العلم من قال:"], [551.5, "لا وجودَ للمجاز البتّة،"], [556.0, "لا في القرآن، ولا في السنّة،"], [560.0, "ولا في لغة العرب،"], [562.9, "شعرًا ولا نثرًا. وعلى رأسهم أبو العبّاس ابن تيميّة رحمه الله تعالى ومن وافقه في قوله؛"], [574.0, "فابن تيميّة رحمه الله تعالى ينفي وجودَ المجاز أصلًا في اللغة،"], [581.0, "فضلًا عن وجوده أصلًا في القرآن والسنّة."]], "tr": [[547.0, "İlim ehlinden bazıları \"Mecaz kesinlikle yoktur;"], [551.5, "ne Kur'an'da, ne Sünnet'te, ne de Arap dilinde, ne şiirde ne nesirde\" demiştir."], [562.9, "Bunların başında Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— ve onun görüşüne katılanlar gelir."], [574.0, "İbn Teymiyye —Allah ona rahmet etsin— Kur'an ve Sünnet'te aslen var olmasını bırakın, dilde bile mecazın varlığını aslen nefyeder."]]}, {"reader": false, "ar": [[585.0, "ومن أهل القبلة من جعلوا المجاز داخلًا في الكلام كلِّه؛"], [594.0, "ففي لغة العرب مجاز،"], [596.8, "وفي القرآن مجاز، وفي السنّة مجاز،"], [601.0, "بغضّ النظر عن كونها من نصوص الغيب أو من غير نصوص الغيب،"], [611.0, "وهذا منهج أهل البدع."], [613.4, "ولكنّ من أهل العلم من توسّطوا فقالوا:"], [617.7, "أمّا اللغة العربيّة ففيها مجاز،"], [621.1, "ولكن لا مجازَ في الكتاب والسنّة."]], "tr": [[585.0, "Ehl-i Kıble'den bazıları ise mecazı sözün tamamına dahil etmişlerdir:"], [594.0, "Arap dilinde mecaz vardır, Kur'an'da mecaz vardır, Sünnet'te mecaz vardır;"], [599.6, "gayb naslarından olup olmamasına bakılmaksızın."], [603.0, "Bu, bid'at ehlinin metodudur. İlim ehlinden bazıları ise orta yolu tutmuş ve şöyle demiştir:"], [613.4, "Arap dilinde mecaz vardır, fakat Kitap ve Sünnet'te mecaz yoktur."]]}, {"reader": false, "ar": [[628.0, "والأصحُّ من هذا الخلاف كلِّه هو أنّ المجاز موجودٌ في لغة العرب،"], [638.0, "وموجودٌ في القرآن، وموجودٌ في السنّة،"], [645.0, "إلا فيما كان من قبيل الغيب فلا مجازَ فيه."], [649.0, "فنحن لا نمنع وجودَ المجاز في لغة العرب،"], [654.4, "لأنّ العرب استعملوا قضيّةَ المجاز وإن سمَّوه بغير اسمه،"], [661.0, "وكذلك كثيرٌ من أساليب الكتاب والسنّة استعملت المجاز؛"], [667.3, "كقول الله عز وجل:"], [670.0, "<span class=\"ayah\">﴿جِدَارًا يُرِيدُ أَن يَنقَضَّ﴾<\/span> <span class=\"ref\">[الكهف: ٧٧]<\/span>،"], [672.0, "وقول الله عز وجل:"], [674.3, "<span class=\"ayah\">﴿وَاشْتَعَلَ الرَّأْسُ شَيْبًا﴾<\/span> <span class=\"ref\">[مريم: ٤]<\/span>، وهكذا كثيرٌ في كتاب الله وسنّة رسوله صلى الله عليه وسلم."]], "tr": [[628.0, "Bütün bu ihtilaftan en sahih olanı şudur:"], [632.8, "Mecaz Arap dilinde vardır, Kur'an'da vardır, Sünnet'te vardır;"], [641.1, "ancak gayb kabilinden olan şey müstesna, onda mecaz yoktur."], [649.0, "Biz Arap dilinde mecazın varlığını reddetmeyiz;"], [652.4, "çünkü Araplar —başka bir adla adlandırmış olsalar da— mecaz meselesini kullanmışlardır."], [659.5, "Aynı şekilde Kitap ve Sünnet'in üsluplarının birçoğu da mecazı kullanmıştır."], [667.3, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿yıkılmak isteyen bir duvar﴾<\/span> [Kehf 77] sözü ve Allah Azze ve Celle'nin <span class=\"ayah\">﴿baş ağarıp tutuştu﴾<\/span> [Meryem 4] sözü gibi."], [674.3, "Allah'ın Kitabı'nda ve Resûlü sallallâhu aleyhi ve sellem'in sünnetinde bunun gibisi çoktur."]]}, {"reader": false, "ar": [[682.0, "وليس القولُ بوجود المجاز في اللغة ولا في أدلّة الوحيين بخطيرٍ جدًّا،"], [691.0, "إلا إذا أُقحِم في باب الغيبيّات؛"], [694.0, "فلا يُقال ببدعيّة إدخال المجاز إلا إذا استُعمل فيما هو من قبيل الغيب."], [705.0, "وبناءً على ذلك فإنّ الجميع يتّفقون على أنّ العرب قد تستعمل لفظةً وتريد بها معنًى آخر؛"], [716.0, "فنحن نسمّي هذا الأسلوبَ مجازًا،"], [719.5, "وهم يسمّونه أسلوبًا من أساليب العرب."], [724.0, "فالخلاف بيننا وبينهم يُشبه أن يكون لفظيًّا،"], [728.8, "إلا في أبواب الغيبيّات؛"], [732.0, "فلا يكون القولُ بالمجاز ذا خطرٍ عظيمٍ إلا إذا أُقحِم في باب الغيبيّات."]], "tr": [[682.0, "Dilde veya iki vahyin (Kitap ve Sünnet'in) delillerinde mecazın varlığını söylemek pek tehlikeli değildir;"], [691.5, "ancak gaybiyyât babına sokulursa (tehlikelidir)."], [694.0, "Mecazı sokmanın bid'at olduğu, ancak gayb kabilinden olan şeyde kullanılırsa söylenir."], [705.0, "Buna binaen herkes şunda ittifak eder:"], [709.0, "Araplar bazen bir lafız kullanıp onunla başka bir mana kastederler."], [716.0, "Biz bu üsluba \"mecaz\" deriz, onlar da ona \"Arapların üsluplarından bir üslup\" derler."], [726.1, "Bizimle onlar arasındaki ihtilaf lafzî olmaya benzer;"], [732.0, "gaybiyyât babları müstesna. Mecaz demek ancak gaybiyyât babına sokulursa büyük bir tehlike arz eder."]]}, {"reader": false, "ar": [[742.0, "وأظنّ أنّ من نفى وجودَ المجاز في القرآن والسنّة إنما مَلمَحُ نفيِه هو سدُّ ذريعة القول بالمجاز في نصوص القرآن،"], [756.0, "ليجعل سياجًا منيعًا على الغيبيّات حتى لا يتخوّض فيها أهلُ البدع."], [764.0, "ولكنّ هذا لا يمنعنا أن نقول بأنّ اللغة العربيّة فيها مجاز،"], [772.0, "وأنّ القرآن والسنّة فيها مجاز،"], [776.0, "لكنّنا ننفي المجاز في بابٍ من أبواب الوحي،"], [782.0, "وهو ما كان من قبيل الغيب."]], "tr": [[742.0, "Zannediyorum Kur'an ve Sünnet'te mecazın varlığını nefyedenin bu nefyindeki gaye, Kur'an naslarında mecaz demenin yolunu kapatmak (sedd-i zerîa), gaybiyyâtın etrafına aşılmaz bir duvar örmek ve böylece bid'at ehlinin onlara dalmasını engellemektir."], [764.0, "Fakat bu, Arap dilinde mecaz olduğunu, Kur'an ve Sünnet'te mecaz olduğunu söylememize engel değildir."], [775.2, "Ancak biz vahyin bablarından bir babda mecazı nefyederiz;"], [782.0, "o da gayb kabilinden olandır."]]}, {"reader": false, "ar": [[785.0, "فإن قلت: ولماذا؟ فأقول:"], [787.7, "لِما بيّنتُه لك في اللمحة الأولى،"], [791.6, "بأنّ القول بالمجاز من شرطه أن يكون العقلُ مدركًا لحقيقة الشيء."]], "tr": [[785.0, "Eğer \"Neden?\" dersen, derim ki:"], [787.0, "Birinci nüktede sana açıkladığım şeyden dolayı;"], [791.6, "mecaz demenin şartı, aklın o şeyin hakikatini idrak etmesidir."]]}]}, {"ts": "13:20", "title": "1. Külliye (devam): Külliyenin özeti; Zehebî'nin sözü; tahrif örnekleri", "paras": [{"reader": false, "ar": [[800.0, "والخلاصةُ من هذه الكلّيّة هو أنّ جميعَ ما أضافه الله عز وجل لنفسه في كتابه،"], [810.0, "أو أضافه له نبيُّه صلى الله عليه وسلم في صحيح سنّته،"], [815.5, "لا يجوز أن يُقال فيه بالمجاز،"], [821.0, "وإنما يجب علينا أن نحمله على حقيقته."], [825.0, "فأهل السنّة والجماعة يعتقدون أنّ صفاتِ الله تعالى ثابتةٌ له على الحقيقة، لا على المجاز."]], "tr": [[800.0, "Bu külliyenin özeti şudur: Allah Azze ve Celle'nin Kitabı'nda kendisine izafe ettiği veya Peygamberi sallallâhu aleyhi ve sellem'in sahih sünnetinde O'na izafe ettiği her şey hakkında mecaz demek caiz değildir;"], [821.6, "bilakis onu hakikatine hamletmemiz vâciptir."], [825.0, "Ehl-i Sünnet ve'l-Cemaat, Allah Teâlâ'nın sıfatlarının mecaz olarak değil, hakikat olarak O'na sabit olduğuna inanır."]]}, {"reader": false, "ar": [[833.0, "قال الإمام الحافظ الذهبيّ رحمه الله تعالى:"], [839.0, "«ولو كانت الصفاتُ تُرَدّ إلى المجاز لبطل أن تكون صفاتٍ لله عز وجل، وإنما الصفةُ تابعةٌ للموصوف؛ فهو موجودٌ حقيقةً لا مجازًا، وصفاتُه ليست مجازًا. فإذا كان لا مثلَ له ولا نظير، لزم أن تكون لا مثلَ لها ولا نظير». انتهى كلامُه."]], "tr": [[833.0, "İmam Hâfız ez-Zehebî —Allah ona rahmet etsin— şöyle demiştir:"], [835.5, "\"Sıfatlar mecaza döndürülseydi, Allah Azze ve Celle'nin sıfatları olmaları bâtıl olurdu."], [839.0, "Sıfat ancak mevsufa (nitelenene) tâbidir."], [842.0, "O, mecazen değil hakikaten mevcuttur;"], [845.0, "sıfatları da mecaz değildir. O'nun benzeri ve dengi olmadığına göre, sıfatlarının da benzeri ve dengi olmaması lâzım gelir.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[860.0, "قلتُ: فالإمام الذهبيّ رحمه الله تعالى في هذا النقل يؤكّد أنّ الكلام في الصفات فرعٌ عن القول في الذات؛"], [870.0, "فكما أنّنا نُثبت أنّ ذاتَ الله عز وجل حقيقةٌ وليست مجازًا،"], [877.0, "فكذلك صفاتُ هذه الذات على الحقيقة،"], [880.5, "ولا مدخلَ للمجاز فيها. والله أعلم."]], "tr": [[860.0, "Derim ki: İmam Zehebî —Allah ona rahmet etsin— bu nakilde, sıfatlar hakkındaki sözün zât hakkındaki sözün fer'i olduğunu teyit etmektedir."], [870.0, "Allah Azze ve Celle'nin zâtının mecaz değil hakikat olduğunu isbat ettiğimiz gibi, bu zâtın sıfatları da hakikat üzeredir;"], [879.3, "mecazın onlarda yeri yoktur. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[884.0, "وبناءً على ذلك فمن حرّف اليدَ إلى القدرة فهو من أهل البدع،"], [891.0, "ومن حرّف الوجهَ إلى الذات فمن أهل البدع،"], [894.0, "ومن حرّف النزولَ إلى نزول الرحمة أو الأمر أو مَلَكٍ من الملائكة فمن أهل البدع،"], [900.0, "ومن حرّف الرحمةَ لإرادة الثواب فمن أهل البدع،"], [906.0, "ومن حرّف الغضبَ لإرادة الانتقام فمن أهل البدع،"], [911.0, "ومن حرّف الاستواءَ بالاستيلاء فمن أهل البدع،"], [917.0, "ومن حرّف علوَّ الذات بعلوّ القدر فمن أهل البدع."], [923.0, "والكلّيّة واضحة، والله أعلم."]], "tr": [[884.0, "Buna binaen eli kudrete tahrif eden bid'at ehlindendir;"], [888.7, "yüzü zâta tahrif eden bid'at ehlindendir;"], [891.8, "inişi rahmetin veya emrin ya da meleklerden bir meleğin inişine tahrif eden bid'at ehlindendir;"], [897.6, "rahmeti sevap verme iradesine tahrif eden bid'at ehlindendir;"], [901.5, "gazabı intikam alma iradesine tahrif eden bid'at ehlindendir;"], [907.2, "istivâyı istîlâ (hâkimiyet kurma) ile tahrif eden bid'at ehlindendir;"], [913.3, "zâtın yüceliğini kadrin (mertebenin) yüceliğiyle tahrif eden bid'at ehlindendir."], [921.0, "Külliye açıktır. Allah en iyisini bilir."]]}]}, {"ts": "15:26", "title": "2. Külliye: Sıfat naslarını sahih medlûllerinden boşaltan herkes muattıldır", "paras": [{"reader": false, "ar": [[926.0, "الكلّيّة الثانية: <b>كلُّ من أفرغ نصوصَ الصفات عن مدلولاتها الصحيحة فمعطِّل.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ من أفرغ نصوصَ الصفات عن مدلولاتها الصحيحة فمعطِّل.<\/b> واضح؟"]], "tr": [[926.0, "2. külliye: Sıfat naslarını sahih medlûllerinden (delalet ettikleri manalardan) boşaltan herkes muattıldır. (Tekrar ediyor.) 2."], [954.7, "külliye: Sıfat naslarını sahih medlûllerinden boşaltan herkes muattıldır. Anlaşıldı mı?"]]}, {"reader": false, "ar": [[966.0, "أقول وبالله التوفيق: وهذا أيضًا من جملة المحاذير في باب الأسماء والصفات،"], [975.0, "وهو محذورُ التعطيل. والتعطيل لغةً:"], [981.0, "هو التفريغ والإخلاء، ومنه قول الله عز وجل:"], [986.0, "<span class=\"ayah\">﴿وَبِئْرٍ مُّعَطَّلَةٍ﴾<\/span> <span class=\"ref\">[الحج: ٤٥]<\/span>، أي: أخلاها أهلُها بسبب نزول العذاب عليهم."], [992.0, "وتقول العرب: «جِيدٌ معطَّل»،"], [996.0, "أي: مفرَّغٌ من وجود الحُليّ عليه."]], "tr": [[966.0, "Tevfik Allah'tandır, derim ki: Bu da isim ve sıfatlar babındaki mahzurlardandır;"], [971.2, "o da ta'til mahzurudur. Ta'til lügatte boşaltmak ve ıssız bırakmaktır."], [977.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿ve terk edilmiş (muattal) kuyu﴾<\/span> [Hac 45] sözü de bundandır;"], [986.0, "yani üzerlerine azap inmesi sebebiyle sahipleri onu boş bırakmıştır."], [992.0, "Araplar \"cîdun muattal\" derler; yani üzerinde ziynet bulunmayan, (ziynetten) boşaltılmış boyun."]]}, {"reader": false, "ar": [[999.0, "وأمّا التعطيل لغةً <span class=\"note\">(Şeyh böyle diyor; kastettiği «اصطلاحًا»dır, hemen ardından öyle tekrar ediyor)<\/span> فهو:"], [1004.0, "إنكارُ ما يجب لله عز وجل من الأسماء والصفات،"], [1012.0, "إنكارًا كلّيًّا أو جزئيًّا."], [1018.0, "أُعيد تعريفه مرّةً أخرى:"], [1022.0, "التعطيل اصطلاحًا: هو إنكارُ ما يجب لله عز وجل من الأسماء والصفات،"], [1030.0, "إنكارًا كلّيًّا أو جزئيًّا."]], "tr": [[999.0, "Ta'til ise lügatte (kastedilen: ıstılahta) şudur:"], [1004.0, "Allah Azze ve Celle için vâcip olan isim ve sıfatları külli veya cüz'î olarak inkâr etmektir."], [1018.0, "Tarifini bir kez daha tekrar ediyorum:"], [1022.7, "Ta'til ıstılahta, Allah Azze ve Celle için vâcip olan isim ve sıfatları külli veya cüz'î olarak inkâr etmektir."]]}, {"reader": false, "ar": [[1035.0, "وقولُنا في التعريف: «كلّيًّا أو جزئيًّا» فيه بيانُ أنواع التعطيل؛"], [1042.0, "فإنّ المعطِّلة لشيءٍ من الأسماء والصفات ينقسمون إلى قسمين:"], [1048.0, "إلى من عطّل الله عز وجل التعطيلَ الكلّيّ،"], [1052.0, "وإلى من عطّل الله التعطيلَ الجزئيّ."], [1057.0, "فمثالُ القسم الأول: الجهميّة،"], [1063.0, "الذين يُنكرون أسماءَ الله عز وجل وصفاتِه كلَّها،"], [1068.0, "فلا يُجيزون تسميةَ الله عز وجل باسم،"], [1073.0, "ولا يُجيزون أن يُوصف بصفة؛ فتعطيلُهم تعطيلٌ كلّيّ."]], "tr": [[1035.0, "Tarifteki \"külli veya cüz'î\" sözümüzde ta'tilin türlerinin beyanı vardır."], [1042.0, "Çünkü isim ve sıfatlardan bir şeyi ta'til edenler iki kısma ayrılır:"], [1048.0, "Allah Azze ve Celle'yi külli ta'tille ta'til eden ve Allah'ı cüz'î ta'tille ta'til eden."], [1057.0, "Birinci kısmın örneği Cehmiyye'dir; onlar Allah Azze ve Celle'nin isimlerinin ve sıfatlarının hepsini inkâr ederler."], [1067.4, "Allah Azze ve Celle'nin herhangi bir isimle isimlendirilmesini caiz görmezler, herhangi bir sıfatla nitelenmesini de caiz görmezler."], [1078.0, "Onların ta'tili külli bir ta'tildir."]]}, {"reader": false, "ar": [[1081.0, "وكذلك تعطيلُ غُلاة القرامطة،"], [1087.0, "الذين يسلبون عن الله عز وجل النقيضين،"], [1093.0, "فيقولون: الله لا حيٌّ ولا ميّت،"], [1097.2, "ولا موجودٌ ولا معدوم،"], [1113.0, "ولا يسمع وليس بأصمّ،"], [1116.0, "ولا داخلَ العالم ولا خارجَه،"], [1123.0, "ولا يتكلّم وليس بأبكم."], [1129.0, "ويقولون: نحن ننفي عن الله عز وجل الإثباتَ حتى لا يماثلَ الموجودات،"], [1144.0, "وننفي عن الله عز وجل نقيضَ الإثبات حتى لا نمثّلَه بالمعدومات؛"], [1154.0, "فإن أثبتنا مثّلناه بالموجودات،"], [1159.0, "وإن نفينا مثّلناه بالمعدومات، فننفي الإثباتَ والنفي."]], "tr": [[1081.0, "Aynı şekilde aşırı Karâmita'nın ta'tili de (böyledir)."], [1083.5, "Onlar iki zıddı birden Allah Azze ve Celle'den nefyederler ve şöyle derler:"], [1090.7, "Allah ne diridir ne ölü;"], [1093.7, "ne mevcuttur ne ma'dûm (yok);"], [1098.6, "ne işitir ne de sağırdır;"], [1116.7, "ne âlemin içindedir ne dışında;"], [1129.0, "ne konuşur ne de dilsizdir."], [1134.4, "Şöyle de derler: Mevcutlara benzemesin diye Allah Azze ve Celle'den isbatı nefyederiz;"], [1144.7, "O'nu ma'dûmlara benzetmeyelim diye de Allah Azze ve Celle'den isbatın zıddını nefyederiz."], [1154.0, "Eğer isbat edersek O'nu mevcutlara benzetmiş oluruz;"], [1159.0, "nefyedersek ma'dûmlara benzetmiş oluruz. Bu yüzden hem isbatı hem nefyi nefyederiz."]]}, {"reader": false, "ar": [[1168.0, "يقول أبو العبّاس: «ففرّوا من تشبيه الله عز وجل بالمعدومات فوقعوا في وصفه بالممتنعات»؛"], [1179.0, "لأنّ ارتفاعَ صفتي النقيض ممتنعٌ كاجتماعهما."], [1189.0, "فلا يمكن أن يُوصف شيءٌ بالوجود والعدم في وقتٍ واحد،"], [1196.0, "ولا أن يُوصف شيءٌ واحدٌ بالحياة والموت في وقتٍ واحد،"]], "tr": [[1168.0, "Ebü'l-Abbâs (İbn Teymiyye) der ki:"], [1169.8, "\"Allah Azze ve Celle'yi ma'dûmlara benzetmekten kaçtılar, O'nu mümteni' (imkânsız) şeylerle nitelemeye düştüler.\" Çünkü iki zıt sıfatın birlikte ortadan kalkması, birlikte bulunmaları gibi imkânsızdır."], [1189.0, "Bir şeyin aynı anda varlık ve yoklukla nitelenmesi mümkün değildir;"], [1195.3, "tek bir şeyin aynı anda hayat ve ölümle nitelenmesi de (mümkün değildir);"]]}]}, {"ts": "20:01", "title": "2. Külliye (devam): Selb ehli filozoflar; cüz'î ta'til (Mu'tezile, Eş'arîler, Küllâbiyye, Kerrâmiyye); ta'tilin hükmü", "paras": [{"reader": false, "ar": [[1201.0, "ولا أن يُوصف بالعلوّ والسُّفل في وقتٍ واحد."], [1207.0, "فمن سُلب عنه النقيضان فهو ممتنِع."], [1215.0, "فتعطيلُ القرامطة هو من جملة التعطيل الكلّيّ."], [1222.0, "وكذلك تعطيلُ أصحاب السُّلوب من الفلاسفة."], [1230.0, "وإذا قلتُ: «أصحاب السلوب» يعني:"], [1232.9, "من لا يصفون الله عز وجل إلا بالنفي فقط،"], [1238.0, "فيقولون: املأ الدنيا نفيًا،"], [1240.8, "ولكن احذر أن تُثبت له صفةً واحدة."]], "tr": [[1201.0, "aynı anda yücelik ve aşağılıkla nitelenmesi de (mümkün değildir)."], [1207.0, "İki zıddın birden kendisinden nefyedildiği şey mümtenidir."], [1215.0, "Karâmita'nın ta'tili de külli ta'til cümlesindendir."], [1218.7, "Aynı şekilde filozoflardan selb (olumsuzlama) ehlinin ta'tili de."], [1230.0, "\"Selb ehli\" dediğimde, Allah Azze ve Celle'yi sadece nefy ile niteleyenleri kastediyorum."], [1238.7, "Onlar \"Dünyayı nefy ile doldur, ama sakın O'na tek bir sıfat isbat etme\" derler."]]}, {"reader": false, "ar": [[1248.0, "فيقولون: الله لا داخلَ العالم ولا خارجَه،"], [1252.5, "ولا فوقُ ولا تحت،"], [1255.1, "ولا يَرى، ولا يَشَمّ،"], [1257.7, "ولا يتكلّم، ولا يسمع،"], [1260.3, "إلى غير ذلك، لكن احذر من أن تُثبت صفةً واحدة."], [1275.6, "وهذه الطائفة إنما تُثبت لله عز وجل الوجودَ بشرط الإطلاق،"], [1286.0, "يعني أنه وجودٌ ليس له صفة."], [1289.9, "ومن المعلوم المتقرِّر أنّ الوجود المطلق شيءٌ ليس بموجودٍ أصالةً إلا في الأذهان،"], [1304.0, "لكن يمتنع تحقُّقُه في الأعيان؛"], [1308.0, "فلا ترى العينُ إلا المقيَّدات،"], [1312.0, "أمّا المطلقات فشيءٌ لا تراه العين ولا تُدركه."]], "tr": [[1248.0, "Şöyle derler: Allah ne âlemin içindedir ne dışında;"], [1252.5, "ne yukarıdadır ne aşağıda; ne görür, ne koklar, ne konuşur, ne işitir;"], [1260.3, "ve benzeri. Ama sakın tek bir sıfat isbat etmekten kaçın!"], [1275.6, "Bu taife, Allah Azze ve Celle için ancak \"mutlaklık şartıyla\" varlık isbat eder;"], [1286.0, "yani hiçbir sıfatı olmayan bir varlık."], [1289.9, "Bilinen ve yerleşik olan şudur:"], [1292.5, "Mutlak varlık, aslen ancak zihinlerde mevcut olan bir şeydir;"], [1297.7, "dış dünyada (a'yânda) gerçekleşmesi ise imkânsızdır."], [1308.0, "Göz ancak mukayyed (belirli) şeyleri görür;"], [1312.0, "mutlak şeyler ise gözün görmediği ve idrak etmediği şeylerdir."]]}, {"reader": false, "ar": [[1320.0, "فحقيقةُ قول أصحاب السلوب والنفي هو التعطيلُ الكلّيّ،"], [1326.0, "بسبب أنّ من لا يُوصف إلا بالنفي فهو معدوم."], [1339.0, "وأمّا القسم الثاني من التعطيل فهو التعطيلُ الجزئيّ،"], [1345.4, "كتعطيل المعتزلة الذين يُثبتون لله عز وجل الأسماءَ فقط بلا صفات،"], [1355.0, "فيقولون: عليمٌ ولا يُوصف بالعلم،"], [1360.0, "عليٌّ ولا يُوصف بالعلوّ،"], [1364.0, "وسميعٌ ولا يُوصف بالسمع، إلى غير ذلك."]], "tr": [[1320.0, "Selb ve nefy ehlinin sözünün hakikati külli ta'tildir;"], [1326.7, "çünkü sadece nefy ile nitelenen şey ma'dûmdur."], [1339.0, "Ta'tilin ikinci kısmı ise cüz'î ta'tildir;"], [1343.8, "Allah Azze ve Celle için sıfatsız olarak sadece isimleri isbat eden Mu'tezile'nin ta'tili gibi."], [1355.8, "Onlar şöyle derler: (O) Alîm'dir ama ilimle nitelenmez;"], [1361.7, "Aliyy'dir ama yücelikle nitelenmez; Semî'dir ama işitmeyle nitelenmez; ve benzeri."]]}, {"reader": false, "ar": [[1370.0, "إلا أنّ تعطيلهم أخفُّ من تعطيل أصحاب سلب النقيضين وأصحاب السلوب والنفي،"], [1379.0, "لكنّه يبقى تعطيلًا محرّمًا."], [1384.0, "ومن أصحاب التعطيل الجزئيّ أيضًا:"], [1387.6, "الأشاعرةُ والكُلّابيّةُ والكرّاميّة؛ فإنّ مذهبهم إثباتُ كافّة أسماء الله عز وجل،"], [1398.0, "إلا أنهم لا يصفون الله عز وجل إلا بشيءٍ من الصفات،"], [1403.0, "سبعًا أو ثمانيًا، على خلافٍ بينهم."], [1407.0, "وكلُّ ذلك من الأمور المحرّمة التي قد تصل بصاحبها إلى الكفر ـ والعياذ بالله ـ كما سيأتينا بإذن الله عز وجل في الكلّيّات."]], "tr": [[1370.0, "Ancak onların ta'tili, iki zıddı birden nefyedenlerin ve selb ve nefy ehlinin ta'tilinden daha hafiftir;"], [1377.7, "fakat yine de haram bir ta'til olarak kalır."], [1384.0, "Cüz'î ta'til ehlinden biri de Eş'arîler, Küllâbiyye ve Kerrâmiyye'dir."], [1394.0, "Onların mezhebi Allah Azze ve Celle'nin bütün isimlerini isbat etmektir;"], [1398.5, "ancak Allah Azze ve Celle'yi —aralarındaki ihtilafa göre— yedi veya sekiz sıfat gibi bazı sıfatlarla nitelerler."], [1407.0, "Bütün bunlar, sahibini —Allah korusun— küfre ulaştırabilen haram şeylerdendir;"], [1413.8, "nitekim Allah Azze ve Celle'nin izniyle külliyelerde bize gelecek."]]}, {"reader": false, "ar": [[1423.0, "فإذا قيل لك: ما حكمُ التعطيل؟"], [1427.2, "فقل: التعطيلُ محرّمٌ بالإجماع،"], [1433.0, "وقد يصل بصاحبه في كثيرٍ من صوره إلى الكفر."], [1438.0, "فتعطيلُ الجهميّة الكلّيُّ أوصلهم إلى الكفر،"], [1442.0, "وتعطيلُ القرامطة والإسماعيليّة والنُّصيريّة الكلّيُّ أوصلهم أيضًا إلى الكفر."]], "tr": [[1423.0, "Sana \"Ta'tilin hükmü nedir?\" denirse de ki:"], [1427.2, "Ta'til icmâ ile haramdır ve birçok suretinde sahibini küfre ulaştırabilir."], [1438.0, "Cehmiyye'nin külli ta'tili onları küfre ulaştırmıştır."], [1441.3, "Karâmita'nın, İsmâiliyye'nin ve Nusayriyye'nin külli ta'tili de onları küfre ulaştırmıştır."]]}, {"reader": false, "ar": [[1459.0, "ولذلك قال الإمام ابن القيّم رحمه الله مبيّنًا أنّ التعطيل شرٌّ من الشرك ـ وأظنّني ذكرتُه لكم سابقًا ـ يقول ابن القيّم رحمه الله:"], [1474.2, "«والتعطيلُ شرٌّ من الشرك؛ فإنّ المعطِّل جاحدٌ للذات أو لكمالها، وهو جحدٌ لحقيقة الإلهيّة، والمشركُ مُقِرٌّ بالله، لكن عبد معه غيرَه، فهو خيرٌ من المعطِّل للذات والصفات»."]], "tr": [[1459.0, "Bu yüzden İmam İbnü'l-Kayyim —Allah ona rahmet etsin— ta'tilin şirkten daha kötü olduğunu açıklayarak şöyle demiştir —zannederim bunu size daha önce zikretmiştim—."], [1466.2, "İbnü'l-Kayyim —Allah ona rahmet etsin— der ki:"], [1468.9, "\"Ta'til şirkten daha kötüdür. Çünkü muattıl zâtı veya onun kemalini inkâr edendir;"], [1474.2, "bu da ilahlığın hakikatini inkârdır."], [1477.3, "Müşrik ise Allah'ı ikrar eder, fakat O'nunla birlikte başkasına ibadet etmiştir;"], [1484.9, "dolayısıyla o, zâtı ve sıfatları ta'til edenden daha hayırlıdır.\""]]}, {"reader": false, "ar": [[1497.6, "والخلاصةُ من هذه الكلّيّة أنّ التعطيل بكلّ أقسامه وأنواعه محرّمٌ في باب الأسماء والصفات،"], [1506.4, "ومنه ما يكون كفرًا،"], [1508.2, "ومنه ما يكون محرّمًا وفسقًا. والله أعلم."]], "tr": [[1497.6, "Bu külliyenin özeti şudur: Ta'til, bütün kısımları ve türleriyle isim ve sıfatlar babında haramdır;"], [1505.3, "onun küfür olanı da vardır, haram ve fısk olanı da. Allah en iyisini bilir."]]}]}, {"ts": "25:16", "title": "3. Külliye: Kelimeleri yerlerinden değiştiren herkes muharriftir (tahrif ve kısımları)", "paras": [{"reader": false, "ar": [[1516.0, "ومن الكلّيّات أيضًا: <b>كلُّ من غيّر الكَلِمَ عن مواضعه فمحرِّف.<\/b> <span class=\"q\">؟ 25:16<\/span> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1516.0, "Külliyelerden biri de şudur: 3."], [1517.8, "külliye: Kelimeleri yerlerinden değiştiren herkes muharriftir (tahrif edicidir). <span class=\"q\">؟<\/span> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1522.0, "أقول وبالله التوفيق: وهذا من جملة محاذير الأسماء والصفات أيضًا،"], [1528.8, "وهو محذورُ التحريف. والتحريف درجةٌ فوق التعطيل؛"], [1554.0, "فإنّ حقيقة التعطيل إنما هي تفريغُ اللفظ العربيّ عن دلالته فقط،"], [1561.0, "وأمّا التحريف فإنه إقحامُ دلالةٍ غريبةٍ على اللفظ؛"], [1569.0, "فالتحريف تعطيلٌ وزيادة. وكلُّه داخلٌ في قول الله عز وجل:"], [1578.8, "<span class=\"ayah\">﴿يُحَرِّفُونَ الْكَلِمَ عَن مَّوَاضِعِهِ﴾<\/span> <span class=\"ref\">[النساء: ٤٦]<\/span>،"], [1583.0, "وفي القراءة ـ وفي الآية الأخرى ـ:"], [1586.5, "<span class=\"ayah\">﴿يُحَرِّفُونَ الْكَلِمَ مِن بَعْدِ مَوَاضِعِهِ﴾<\/span> <span class=\"ref\">[المائدة: ٤١]<\/span>."]], "tr": [[1522.0, "Tevfik Allah'tandır, derim ki: Bu da isim ve sıfatların mahzurlarındandır;"], [1550.0, "o da tahrif mahzurudur. Tahrif, ta'tilin bir derece üstündedir."], [1554.0, "Çünkü ta'tilin hakikati, Arapça lafzı sadece delaletinden boşaltmaktır."], [1558.5, "Tahrif ise lafza yabancı bir delalet sokmaktır."], [1563.2, "Dolayısıyla tahrif, ta'til ve fazlasıdır."], [1569.0, "Bunun hepsi Allah Azze ve Celle'nin şu sözüne dahildir:"], [1578.8, "<span class=\"ayah\">﴿Kelimeleri yerlerinden kaydırırlar﴾<\/span> [Nisâ 46]."], [1583.0, "Kıraatte —diğer ayette— de: <span class=\"ayah\">﴿Kelimeleri (konuldukları) yerlerinden sonra kaydırırlar﴾<\/span> [Mâide 41]."]]}, {"reader": false, "ar": [[1591.0, "والمعنى من ذلك أنهم يعمِدون إلى لفظةٍ من ألفاظ الوحي،"], [1597.0, "ويعطّلونها عن مدلولها الصحيح الذي دلّ عليه لسانُ العرب،"], [1603.0, "ثم يُقحمون مكانه دلالةً أخرى لا يدلّ عليها لا لسانُ العرب،"], [1611.0, "ولا لغةُ الشرع، ولا فهمُ السلف."]], "tr": [[1591.0, "Bunun manası şudur: Vahyin lafızlarından bir lafza yönelirler, onu Arap dilinin delalet ettiği sahih medlûlünden ta'til ederler, sonra onun yerine ne Arap dilinin, ne şeriatın dilinin, ne de selefin anlayışının delalet ettiği başka bir delalet sokarlar."]]}, {"reader": false, "ar": [[1616.0, "فإن قلت: وما التحريف لغةً؟"], [1619.1, "فأقول: هو التغيير. فإن قلت:"], [1622.6, "وما التحريف اصطلاحًا؟ فأقول:"], [1625.7, "هو تغييرُ النصّ لفظًا أو معنًى ـ تغييرُ النصّ لفظًا أو معنًى."], [1635.0, "وهذا يدلّنا على أنّ التحريف ينقسم إلى قسمين:"], [1641.0, "إلى تحريفٍ لفظيّ، بأن ينصبّ المحرِّف على تغيير اللفظ أصالةً،"], [1650.0, "إمّا بحذف كلمة، أو بحذف آية،"], [1654.0, "أو بتغيير حركةٍ من كلمةٍ يتغيّر بها المعنى."]], "tr": [[1616.0, "Eğer \"Tahrif lügatte nedir?\" dersen, derim ki:"], [1619.1, "Değiştirmektir. Eğer \"Tahrif ıstılahta nedir?\" dersen, derim ki:"], [1625.0, "Nassı lafız veya mana olarak değiştirmektir —nassı lafız veya mana olarak değiştirmektir."], [1635.0, "Bu bize tahrifin iki kısma ayrıldığını gösterir:"], [1641.0, "Birincisi lafzî tahriftir; muharrifin doğrudan lafzı değiştirmeye yönelmesidir:"], [1647.0, "Ya bir kelimeyi hazfetmek, ya bir ayeti hazfetmek ya da bir kelimenin manayı değiştiren bir harekesini değiştirmek suretiyle."]]}, {"reader": false, "ar": [[1661.0, "وأشهرُ الطوائف التي عُرفت بالتحريف اللفظيّ هم الرافضة،"], [1670.0, "الذين يزعمون بأنّ القرآن زِيد فيه ونُقص منه،"], [1677.0, "بل وفي بعض رواياتهم التي يُخفونها:"], [1681.0, "بأنّ القرآن الذي أُنزل على محمّدٍ صلى الله عليه وسلم ليس فيه من قرآن العامّة ـ أي أهل السنّة ـ حرفٌ واحد،"], [1694.0, "وأنّ المصحف سيخرج به صاحبُ الزمان في آخر الزمان."]], "tr": [[1661.0, "Lafzî tahrifle tanınan en meşhur taife Râfıza'dır."], [1666.1, "Onlar Kur'an'a ilave yapıldığını ve ondan eksiltildiğini iddia ederler."], [1677.0, "Hatta gizledikleri bazı rivayetlerinde şöyle der:"], [1681.0, "Muhammed sallallâhu aleyhi ve sellem'e indirilen Kur'an'da, \"âmme\"nin —yani Ehl-i Sünnet'in— Kur'an'ından tek bir harf yoktur ve o mushafı âhir zamanda \"Sâhibü'z-zamân\" çıkaracaktır."]]}, {"reader": false, "ar": [[1704.0, "ولا أدري ما الفائدةُ فيما إذا خرج به صاحبُ الزمان في آخر الزمان،"], [1712.0, "لفوات وقت العمل بهذا القرآن الصحيح!"], [1716.0, "ولذلك لا نشكّ طرفةَ عينٍ في أنّ الرافضة الذين يعتقدون تحريفَ القرآن بالزيادة أو النقصان أنهم كفّار."]], "tr": [[1704.0, "Sâhibü'z-zamân onu âhir zamanda çıkarırsa bunun ne faydası olacak, bilmiyorum;"], [1709.5, "zira bu \"sahih Kur'an\" ile amel etme vakti geçmiş olacak!"], [1716.0, "Bu yüzden Kur'an'ın ilave veya eksiltmeyle tahrif edildiğine inanan Râfıza'nın kâfir olduğundan göz açıp kapayıncaya kadar bile şüphe etmeyiz."]]}, {"reader": false, "ar": [[1729.0, "ومن الطوائف التي عُرفت به أيضًا:"], [1733.5, "الجهميّة، ولذلك كانوا يقولون:"], [1738.2, "«الرحمنُ على العرش استولى»."], [1745.0, "وكذلك اليهود الذين أُمروا أن يقولوا:"], [1749.3, "«حِطّة»، فقالوا: «حِنطة». فاليهود زادت في وحي الله نونًا،"], [1761.1, "والجهميّة زادت في وحي الله لامًا."], [1769.0, "وقد عقدها الإمام ابن القيّم في قوله:"], [1773.7, "«نونُ اليهودِ ولامُ جهميٍّ هما ... في وحي ربِّ العرشِ زائدتانِ»."]], "tr": [[1729.0, "Bununla tanınan taifelerden biri de Cehmiyye'dir;"], [1733.5, "bu yüzden \"Rahmân Arş'a istîlâ etti (hâkim oldu)\" derlerdi."], [1745.0, "Aynı şekilde \"hıtta\" demekle emrolunan, fakat \"hınta\" (buğday) diyen Yahudiler de."], [1757.0, "Yahudiler Allah'ın vahyine bir \"nûn\" eklediler;"], [1760.4, "Cehmiyye de Allah'ın vahyine bir \"lâm\" ekledi."], [1769.0, "İmam İbnü'l-Kayyim bunu şu beytinde nazmetmiştir:"], [1773.7, "\"Yahudilerin nûnu ve Cehmî'nin lâmı;"], [1776.5, "ikisi de Arş'ın Rabbinin vahyine eklenmiş fazlalıklardır.\""]]}, {"reader": false, "ar": [[1781.0, "وقد أجمع العلماءُ من أهل السنّة والجماعة على أنّ كلَّ من اعتقد أنّ في القرآن ما ليس منه،"], [1793.0, "أو أنه حُذف منه ما هو منه،"], [1799.0, "أنه كافر. فكلُّ من كفر بحرفٍ متواترٍ في القرآن فإنه كافر،"], [1807.0, "وكلُّ من زاد حرفًا ليس عليه قُرّاءُ القرآن فإنه كافر."], [1814.0, "فالتحريف اللفظيّ يُوجب الكفرَ ولا شكّ."]], "tr": [[1781.0, "Ehl-i Sünnet ve'l-Cemaat âlimleri şu hususta icmâ etmişlerdir:"], [1788.9, "Kur'an'da ondan olmayan bir şey bulunduğuna veya ondan olan bir şeyin ondan hazfedildiğine inanan herkes kâfirdir."], [1800.0, "Kur'an'da mütevâtir olan bir harfi inkâr eden herkes kâfirdir;"], [1807.0, "Kur'an kurrâsının üzerinde olmadığı bir harfi ilave eden herkes kâfirdir."], [1814.0, "Lafzî tahrif şüphesiz küfrü gerektirir."]]}]}, {"ts": "30:21", "title": "3. Külliye (devam): Manevî tahrif; tahrifin hükmü", "paras": [{"reader": false, "ar": [[1821.0, "إلا أنّ الطوائف التي قالت به قليلٌ جدًّا،"], [1828.0, "لأنّ أمرَه مفضوحٌ عند العامّة؛"], [1834.0, "فما إن يُحذف من القرآن شيء،"], [1836.7, "ولا أن يُبدَّل شيءٌ منه،"], [1839.0, "إلا وتُدركه عقولُ أهل الإسلام،"], [1843.0, "لا سيّما الحُفّاظُ منهم."], [1846.0, "ولكنّ التحريف الذي هو بحرٌ لا ساحلَ له هو التحريف الثاني، وهو التحريف المعنويّ."]], "tr": [[1821.0, "Ancak bunu söyleyen taifeler çok azdır;"], [1824.6, "çünkü onun durumu halk nezdinde rezildir (hemen fark edilir)."], [1834.0, "Kur'an'dan bir şey hazfedilir veya ondan bir şey değiştirilirse, İslâm ehlinin akılları —özellikle de hâfızları— onu hemen fark eder."], [1846.0, "Fakat sahili olmayan bir deniz olan tahrif, ikinci tahriftir; o da manevî tahriftir."]]}, {"reader": false, "ar": [[1856.0, "بأن يأتي المحرِّف ويُبقي اللفظَ على ما هو عليه،"], [1862.0, "ولا يُغيّر منه شيئًا،"], [1864.0, "لا بزيادةٍ ولا بنقصان،"], [1866.0, "ولكن يعمِد إلى المعنى الصحيح فيعطّله،"], [1869.8, "ويُقحم بدلَه معنًى فاسدًا لا تدلّ عليه لغةُ العرب،"], [1879.4, "ولا لغةُ الشرع، ولا فهمُ أهل السنّة والجماعة."], [1887.0, "وهذا عليه أكثرُ الطوائف المحرِّفة."]], "tr": [[1856.0, "(Bu da) muharrifin gelip lafzı olduğu gibi bırakması, ondan ne ilave ne eksiltme yoluyla hiçbir şeyi değiştirmemesi;"], [1865.0, "fakat sahih manaya yönelip onu ta'til etmesi ve onun yerine ne Arap dilinin, ne şeriatın dilinin, ne de Ehl-i Sünnet ve'l-Cemaat'in anlayışının delalet ettiği fâsid bir mana sokmasıdır."], [1887.0, "Tahrifçi taifelerin çoğu bunun üzerindedir."]]}, {"reader": false, "ar": [[1893.0, "فتحريفُ الأشعريّة ليس لفظيًّا ولكنّه تحريفٌ معنويّ،"], [1900.0, "وتحريفُ المعتزلة ليس لفظيًّا ولكنّه تحريفٌ معنويّ،"], [1906.0, "وتحريفُ الكُلّابيّة ليس لفظيًّا ولكنّه معنويّ،"], [1913.0, "وتحريفُ الكرّاميّة ليس لفظيًّا ولكنّه تحريفٌ معنويّ."]], "tr": [[1893.0, "Eş'arîlerin tahrifi lafzî değil, manevî bir tahriftir."], [1900.0, "Mu'tezile'nin tahrifi lafzî değil, manevî bir tahriftir."], [1906.0, "Küllâbiyye'nin tahrifi lafzî değil, manevîdir."], [1909.8, "Kerrâmiyye'nin tahrifi lafzî değil, manevî bir tahriftir."]]}, {"reader": false, "ar": [[1921.0, "فإن قلت: وما حكمُ التحريف؟"], [1926.0, "فأقول ـ كما قلنا في التعطيل سواءً بسواء ـ:"], [1930.0, "هو محرّمٌ أصالةً بالإجماع،"], [1935.0, "وقد يصل في كثيرٍ من صوره إلى الكفر،"], [1940.0, "على ما سيأتينا تفصيلُه في كلّيّاته الخاصّة بإذن الله عز وجل."], [1947.0, "قال ابن أبي العزّ في «شرح الطحاويّة»،"], [1950.0, "قال: «وكلٌّ من التحريف والانحراف على مراتب: فقد يكون كفرًا، وقد يكون فسقًا، وقد يكون معصيةً، وقد يكون خطأً»."], [1965.0, "انتهى كلامُه. والله أعلم."]], "tr": [[1921.0, "Eğer \"Tahrifin hükmü nedir?\" dersen, derim ki —ta'til hakkında söylediğimizin tıpkısı gibi—:"], [1930.0, "O, aslen icmâ ile haramdır ve birçok suretinde küfre varabilir;"], [1937.5, "Allah Azze ve Celle'nin izniyle bunun ayrıntısı kendine has külliyelerinde gelecek."], [1944.3, "İbn Ebi'l-İzz \"Şerhu't-Tahâviyye\"de şöyle demiştir:"], [1947.0, "\"Tahrif ve inhirafın her biri mertebeler üzeredir:"], [1950.6, "Bazen küfür olur, bazen fısk olur, bazen masiyet olur, bazen de hata olur.\" —Sözü burada bitti. Allah en iyisini bilir."]]}]}, {"ts": "32:48", "title": "4. Külliye: Her muattıl mümessildir", "paras": [{"reader": false, "ar": [[1968.0, "الكلّيّة الرابعة: <b>كلُّ معطِّلٍ فممثِّل.<\/b> وأظنّ الكلّيّة واضحةً لديكم وضوحَ الشمس بإذن الله عز وجل."]], "tr": [[1968.0, "<b>4. külliye: Her muattıl mümessildir.<\/b> Zannederim külliye, Allah Azze ve Celle'nin izniyle sizin için güneş gibi açıktır."]]}, {"reader": false, "ar": [[1996.0, "وذلك لأنّ المعطِّل لم يصل إلى مرتبة التعطيل إلا بعد أن مرّ على مرتبة التمثيل؛"], [2004.0, "فهو مثّل أوّلًا، وعطّل ثانيًا."], [2008.0, "ولكن هناك أنواعٌ من تعطيل الممثِّل لا بدّ من فهمها أيضًا،"], [2015.0, "وهي كما يلي: الأوّل:"], [2018.7, "فالمعطِّل لم يصل إلى مرتبة التعطيل إلا بعد أن صعد درجةَ التمثيل."]], "tr": [[1996.0, "Bu böyledir; çünkü muattıl, ta'til mertebesine ancak temsil mertebesinden geçtikten sonra ulaşmıştır."], [2004.0, "O önce temsil etmiş, sonra ta'til etmiştir."], [2009.9, "Fakat mümessilin ta'tilinin anlaşılması gereken türleri de vardır;"], [2018.0, "şunlardır: Birincisi: Muattıl, ta'til mertebesine ancak temsil basamağına çıktıktan sonra ulaşmıştır."]]}, {"reader": false, "ar": [[2026.0, "وإنّ القاعدة التي أوجبت لهم التمثيلَ هي قولُهم:"], [2031.3, "إنّ الاتّفاق في الاسم يستلزم الاتّفاقَ في الكُنه والصفة،"], [2037.0, "وقولُهم: إنّ الاتّفاق في الاسم الكلّيّ العامّ يستلزم الاتّفاقَ بعد الإضافة والتقييد والتخصيص،"], [2048.0, "وقولُهم بوجوب قياس الغائب على الشاهد."]], "tr": [[2026.0, "Onlara temsili gerektiren kaide şu sözleridir:"], [2028.0, "İsimde ortaklık, künhte ve sıfatta ortaklığı gerektirir."], [2031.3, "Bir de şu sözleridir: Külli, genel isimde ortaklık, izafe, takyîd ve tahsisten sonra da ortaklığı gerektirir."], [2044.0, "Bir de gâibin (görünmeyenin) şâhide (görünene) kıyas edilmesinin vâcip olduğu sözleridir."]]}, {"reader": false, "ar": [[2055.0, "فلمّا خاطبنا الله عز وجل بأنّ له يدًا،"], [2059.0, "فنحن لا نعقل من معنى اليد الغائبة إلا ما نعقله من معنى اليد المشاهَدة،"], [2065.0, "فتكون اليدُ الغائبة كاليد المشاهَدة،"], [2068.0, "وبما أنّ تمثيل الخالق بالمخلوق لا يجوز،"], [2071.0, "فإذًا ليس لله يد، وإنما النعمةُ والقدرة."]], "tr": [[2055.0, "(Derler ki:) Allah Azze ve Celle bize kendisinin bir eli olduğunu hitap edince, biz gâib elin manasından ancak görülen elin manasından akledeceğimizi akledebiliriz;"], [2064.1, "dolayısıyla gâib el, görülen el gibi olur."], [2067.4, "Yaratanı mahlûka benzetmek caiz olmadığına göre, o hâlde Allah'ın eli yoktur;"], [2072.4, "(kastedilen) ancak nimet ve kudrettir."]]}, {"reader": false, "ar": [[2076.0, "ولمّا خاطبنا الله عز وجل باستوائه على عرشه ـ وهو غائبٌ عنّا ـ فعقولُنا لا تفهم من كيفيّة هذا الاستواء الغائب إلا كما تفهمه من هذا الاستواء المشاهَد،"], [2092.0, "فيكون الاستواءُ الغائب كالاستواء المشاهَد،"], [2096.0, "وبما أنّ الله لا يجوز تمثيلُه بخلقه،"], [2100.3, "فليس لله استواء، وإنما هو استيلاء. عرفتم كيف وصل؟"]], "tr": [[2076.0, "Allah Azze ve Celle bize Arşı üzerine istivâsını hitap edince —ki bu bizden gâibtir—, akıllarımız bu gâib istivânın keyfiyetinden ancak bu görülen istivâdan anladığı gibi anlar;"], [2092.8, "dolayısıyla gâib istivâ, görülen istivâ gibi olur."], [2097.8, "Allah'ı mahlûkatına benzetmek caiz olmadığına göre, Allah'ın istivâsı yoktur;"], [2104.0, "o ancak istîlâdır. Nasıl (bu sonuca) ulaştığını anladınız mı?"]]}]}, {"ts": "35:06", "title": "4. Külliye (devam): İniş ve işitme-görme örnekleri; temsil tohumu", "paras": [{"reader": false, "ar": [[2106.0, "وبما أنّ الله عز وجل خاطبنا بالنزول في ثلث الليل إلى السماء الدنيا،"], [2112.0, "فنحن لا نعقل من هذا النزول الغائب إلا ما نعقله من نزول المخلوق المشاهَد،"], [2119.0, "فيكون النزولُ كالنزول، وبما أنّ تمثيل صفات الخالق بالمخلوق لا يجوز،"], [2126.0, "فليس لله نزول، وإنما الذي ينزل أمرُه أو رحمتُه أو مَلَكٌ من ملائكته."]], "tr": [[2106.0, "Allah Azze ve Celle bize gecenin üçte birinde dünya semasına inişi hitap ettiğine göre, biz bu gâib inişten ancak görülen mahlûkun inişinden akledeceğimizi akledebiliriz;"], [2118.1, "dolayısıyla iniş, iniş gibi olur."], [2122.0, "Yaratanın sıfatlarını mahlûka benzetmek caiz olmadığına göre, Allah'ın inişi yoktur;"], [2127.4, "inen ancak O'nun emri, rahmeti veya meleklerinden bir melektir."]]}, {"reader": false, "ar": [[2131.7, "مثالٌ رابع: وكما أنّ الله عز وجل خاطبنا بأنّ له سمعًا وبصرًا،"], [2142.0, "ونحن لا نعقل من السمع والبصر الغائبين إلا ما نعقله من سمع المخلوق وبصره،"], [2149.0, "فيكون السمعُ كالسمع، والبصرُ كالبصر،"], [2152.0, "والله <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>،"], [2155.0, "فإذًا ننفي عن الله عز وجل سمعَه،"], [2157.0, "وننفي عن الله عز وجل بصرَه."]], "tr": [[2131.7, "Dördüncü bir örnek: Allah Azze ve Celle bize kendisinin işitmesi ve görmesi olduğunu hitap ettiği gibi, biz de gâib işitme ve görmeden ancak mahlûkun işitmesinden ve görmesinden akledeceğimizi akledebiliriz;"], [2147.7, "dolayısıyla işitme, işitme gibi; görme, görme gibi olur."], [2150.8, "Allah ise <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11]."], [2155.3, "O hâlde Allah Azze ve Celle'den işitmesini nefyederiz, Allah Azze ve Celle'den görmesini nefyederiz."]]}, {"reader": false, "ar": [[2161.0, "فكلُّ شيئين اتّفقا في الاسم عندهم فلا بدّ أن يتّفقا في صفاتهما،"], [2168.0, "وكلُّ أمرٍ غيبيٍّ أُخبروا به فلا بدّ أن يقيسوه على الأمر المشاهَد."], [2175.0, "ولذلك لمّا صعدوا مرتبةَ التمثيل وقعوا في مرتبة التعطيل."], [2182.0, "ولذلك قلتُ لكم سابقًا بأنّ أقذرَ بذرةٍ تُفسد العقائد هي بذرةُ التمثيل. والله أعلم."]], "tr": [[2161.0, "Onlara göre isimde ortak olan her iki şeyin sıfatlarında da ortak olması zorunludur;"], [2168.0, "kendilerine haber verilen her gaybî işi de görülen işe kıyas etmeleri zorunludur."], [2175.0, "Bu yüzden temsil mertebesine çıkınca ta'til mertebesine düştüler."], [2180.0, "Bu yüzden size daha önce, akîdeleri bozan en pis tohumun temsil tohumu olduğunu söylemiştim. Allah en iyisini bilir."]]}]}, {"ts": "36:36", "title": "5. Külliye: Her mümessil muattıldır (mümessilin ta'tilinin üç derecesi)", "paras": [{"reader": false, "ar": [[2196.0, "ومن الكلّيّات أيضًا: <b>كلُّ ممثِّلٍ فهو معطِّل.<\/b> <span class=\"note\">(يكررها)<\/span> وهي عكسُ القاعدة الأولى."], [2214.0, "وقد بيّن أهلُ السنّة والجماعة أنّ تعطيل الممثِّل ثلاثةُ أقسام ـ ثلاثُ درجات:"]], "tr": [[2196.0, "Külliyelerden biri de şudur: 5."], [2198.2, "külliye: Her mümessil muattıldır. (Tekrar ediyor.) Bu, birinci (önceki) kaidenin tersidir."], [2214.7, "Ehl-i Sünnet ve'l-Cemaat, mümessilin ta'tilinin üç kısım —üç derece— olduğunu açıklamıştır:"]]}, {"reader": false, "ar": [[2225.0, "الدرجة الأولى: أنه لمّا مثّل صفاتِ الله عز وجل بصفات خلقه،"], [2233.0, "فيكون في نفس الأمر معطِّلًا للآيات التي تنفي مماثلةَ الله بخلقه على وجه العموم."], [2241.0, "فبمجرّد تمثيله يكون معطِّلًا لقوله تعالى:"], [2245.3, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>، وبمجرّد تمثيله يكون معطِّلًا لقول الله عز وجل:"], [2252.3, "<span class=\"ayah\">﴿فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ﴾<\/span> <span class=\"ref\">[النحل: ٧٤]<\/span>،"], [2254.0, "وبمجرّد تمثيله يكون معطِّلًا لقول الله عز وجل:"], [2258.9, "<span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [2262.0, "وبمجرّد تمثيله يكون معطِّلًا لقول الله عز وجل:"], [2270.0, "<span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>."]], "tr": [[2225.0, "Birinci derece: O, Allah Azze ve Celle'nin sıfatlarını mahlûkatının sıfatlarına benzetince, aslında Allah'ın mahlûkatına benzemesini genel olarak nefyeden ayetleri ta'til etmiş olur."], [2236.4, "Sırf temsil etmesiyle Allah Teâlâ'nın <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11] sözünü ta'til etmiş olur."], [2245.3, "Sırf temsil etmesiyle Allah Azze ve Celle'nin <span class=\"ayah\">﴿Allah'a misaller getirmeyin﴾<\/span> [Nahl 74] sözünü ta'til etmiş olur."], [2252.3, "Sırf temsil etmesiyle Allah Azze ve Celle'nin <span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4] sözünü ta'til etmiş olur."], [2258.9, "Sırf temsil etmesiyle Allah Azze ve Celle'nin <span class=\"ayah\">﴿O'nun adaşı (benzeri) olan birini biliyor musun?﴾<\/span> [Meryem 65] sözünü ta'til etmiş olur."]]}, {"reader": false, "ar": [[2271.0, "فأوّلُ تعطيلٍ يقع فيه الممثِّل أنه عطّل تلك النصوصَ العامّة التي تنفي مماثلةَ الله بخلقه."], [2281.0, "وأمّا التعطيل الثاني فهو تعطيلُ نصوص الصفات بخصوصها التي تُثبتها لله عز وجل،"], [2292.0, "وهو تعطيلُ نصوص صفاتٍ كثيرة."]], "tr": [[2271.0, "Mümessilin düştüğü ilk ta'til, Allah'ın mahlûkatına benzemesini nefyeden o genel nasları ta'til etmesidir."], [2281.0, "İkinci ta'til ise Allah Azze ve Celle'ye sıfatları isbat eden özel sıfat naslarının ta'tilidir;"], [2290.3, "bu da birçok sıfat nassının ta'tilidir."]]}, {"reader": false, "ar": [[2295.0, "فالمعطِّل لمّا لم يفهم من قول الله عز وجل:"], [2300.2, "<span class=\"ayah\">﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٧]<\/span> إلا وجهًا يماثل وجهَ المخلوق،"], [2304.3, "فيكون قد عطّل هذا النصَّ عن دلالته الصحيحة."], [2308.0, "ولمّا لم يفهم من قول الله عز وجل:"], [2313.1, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span> إلا يدًا كيد المخلوق،"], [2317.5, "فيكون قد عطّل هذا النصَّ الثاني عن دلالته الصحيحة."], [2323.0, "ولمّا لم يفهم من قول الله عز وجل:"], [2326.3, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span> إلا استواءً كاستواء المخلوق،"], [2331.0, "فيكون قد عطّل هذا النصَّ الثالث عن دلالته الصحيحة."]], "tr": [[2295.0, "Muattıl, Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rabbinin yüzü bâki kalır﴾<\/span> [Rahmân 27] sözünden ancak mahlûkun yüzüne benzeyen bir yüz anlayınca, bu nassı sahih delaletinden ta'til etmiş olur."], [2308.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bilakis O'nun iki eli açıktır﴾<\/span> [Mâide 64] sözünden ancak mahlûkun eli gibi bir el anlayınca, bu ikinci nassı sahih delaletinden ta'til etmiş olur."], [2323.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5] sözünden ancak mahlûkun istivâsı gibi bir istivâ anlayınca, bu üçüncü nassı sahih delaletinden ta'til etmiş olur."]]}, {"reader": false, "ar": [[2338.0, "وهكذا نقول في كلّ نصوص الصفات التي تُثبت شيئًا من الصفات لله عز وجل،"], [2344.0, "وهي كثيرةٌ في الكتاب والسنّة."], [2347.0, "فيكون الممثِّل ـ بمجرّد تمثيله هذه الصفةَ التي يُثبتها النصّ بصفات المخلوقات ـ يكون قد عطّل هذا النصَّ الخاصّ عن دلالته الصحيحة؛"], [2359.0, "لأنّ النصّ إنما نزل ليُثبت صفةً لائقةً بجلال الله عز وجل وكماله،"], [2367.0, "وهم فهموا منه غيرَ هذا الفهم الصحيح."]], "tr": [[2338.0, "Allah Azze ve Celle'ye sıfatlardan bir şeyi isbat eden bütün sıfat nasları hakkında da böyle deriz;"], [2344.0, "bunlar Kitap ve Sünnet'te çoktur."], [2347.0, "Mümessil, nassın isbat ettiği bu sıfatı sırf mahlûkatın sıfatlarına benzetmesiyle bu özel nassı sahih delaletinden ta'til etmiş olur."], [2359.0, "Çünkü nas, ancak Allah Azze ve Celle'nin celâline ve kemaline layık bir sıfatı isbat etmek için inmiştir;"], [2367.0, "onlar ise ondan bu sahih anlayıştan başkasını anlamışlardır."]]}, {"reader": false, "ar": [[2372.0, "وهناك تعطيلٌ ثالث ـ أعوذ بالله ـ وهو أنّ الممثِّل لمّا قارن ومثّل بين صفات الخالق الكامل من كلّ وجه،"], [2389.0, "وجعلها كصفات المخلوق الضعيف من كلّ وجه،"], [2395.0, "فيكون قد عطّل اللهَ عن كماله الذي يجب له، كما قال الناظم:"]], "tr": [[2372.0, "Bir de üçüncü bir ta'til vardır —Allah'a sığınırım—:"], [2379.0, "Mümessil, her yönden kâmil olan Yaratanın sıfatlarını her yönden zayıf olan mahlûkun sıfatlarıyla karşılaştırıp benzetince ve onları mahlûkun sıfatları gibi kılınca, Allah'ı O'na vâcip olan kemalinden ta'til etmiş olur. Nitekim şair şöyle demiştir:"]]}, {"reader": false, "ar": [[2402.0, "«ألم ترَ أنّ السيفَ ينقصُ قدرُه ... إذا قيل إنّ السيفَ أمضى من العصا»."], [2411.0, "فلو أنني عقدتُ مقارنةً وقلت:"], [2414.5, "أيُّهما أقوى: الأسدُ أو الفأرة؟"], [2418.0, "فبمجرّد هذه المقارنة أنا أُنزل الأسدَ عن مرتبته التي تجب له."]], "tr": [[2402.0, "\"Görmez misin, kılıcın değeri düşer, 'Kılıç sopadan daha keskindir' denildiğinde.\" Bir karşılaştırma yapıp \"Hangisi daha güçlü:"], [2414.5, "Aslan mı, fare mi?\" desem, sırf bu karşılaştırmayla aslanı ona vâcip olan mertebesinden indirmiş olurum."]]}, {"reader": false, "ar": [[2425.0, "فإذا قارنتُ أو مثّلتُ سمعَ الله الخالق الكامل بسمع المخلوق الضعيف العاجز،"], [2434.0, "فأكون قد عطّلتُ اللهَ عن كماله الواجب في سمعه."], [2438.0, "وإذا مثّلتُ بصرَ الله الكامل من كلّ وجه ببصر المخلوق الضعيف من كلّ وجه،"], [2447.0, "فأكون قد عطّلتُ اللهَ عن كماله الواجب في بصره ـ أعوذ بالله ـ."], [2453.0, "وإذا مثّلتُ علوَّ الله عز وجل بعلوّ المخلوق،"], [2462.0, "فأكون قد عطّلتُ علوَّ الله عز وجل عن كماله الذي يجب له."], [2468.0, "وهكذا في كلّ صفات الله عز وجل."]], "tr": [[2425.0, "Kâmil Yaratan olan Allah'ın işitmesini, zayıf ve âciz mahlûkun işitmesiyle karşılaştırır veya ona benzetirsem, Allah'ı işitmesinde (O'na) vâcip olan kemalinden ta'til etmiş olurum."], [2439.4, "Her yönden kâmil olan Allah'ın görmesini, her yönden zayıf olan mahlûkun görmesine benzetirsem, Allah'ı görmesinde vâcip olan kemalinden ta'til etmiş olurum —Allah'a sığınırım—."], [2453.0, "Allah Azze ve Celle'nin yüceliğini mahlûkun yüceliğine benzetirsem, Allah Azze ve Celle'nin yüceliğini O'na vâcip olan kemalinden ta'til etmiş olurum."], [2468.0, "Allah Azze ve Celle'nin bütün sıfatlarında da böyledir."]]}, {"reader": false, "ar": [[2471.0, "لأنّ الممثِّلة والمعطِّلة لا يفهمون منها إلا كما يفهمونه من صفات المخلوقات،"], [2478.9, "أو من خصائص المخلوقات،"], [2483.0, "وهذا بحدّ ذاته يُنقص الكاملَ من كلّ وجهٍ عن كماله الذي يجب له."], [2493.0, "ولذلك قال أهل السنّة بأنّ الإنسان بمجرّد تمثيله يكون معطِّلًا للنصوص العامّة،"], [2503.0, "وللنصوص الخاصّة، ومعطِّلًا لكمال الله عز وجل الواجب له."], [2509.0, "والكلام واضح إن شاء الله."]], "tr": [[2471.0, "Çünkü Mümessile ve Muattıla onlardan (sıfatlardan) ancak mahlûkatın sıfatlarından veya mahlûkatın has özelliklerinden anladıkları gibi anlarlar."], [2479.6, "Bu da başlı başına, her yönden kâmil olanı O'na vâcip olan kemalinden eksiltmektir."], [2488.4, "Bu yüzden Ehl-i Sünnet şöyle demiştir:"], [2493.0, "İnsan sırf temsil etmesiyle genel nasları da özel nasları da ta'til etmiş, Allah Azze ve Celle'nin O'na vâcip olan kemalini de ta'til etmiş olur. Söz inşallah açıktır."]]}]}, {"ts": "41:53", "title": "6. Külliye: Allah'ın sıfatlarına gelen her bâtıl lâzımın sebebi, Yaratanın sıfatlarını mahlûkun sıfatlarına benzetmektir", "paras": [{"reader": false, "ar": [[2513.0, "الكلّيّة السادسة: <b>كلُّ لازمٍ باطلٍ على شيءٍ من صفات الله فسببُه تمثيلُ صفات الخالق بصفات المخلوق.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيد القاعدة؟"], [2554.5, "ولّا الكلّيّة واضحة؟ طيّب."]], "tr": [[2513.0, "<b>6. külliye: Allah'ın sıfatlarından birine (yöneltilen) her bâtıl lâzımın (sonucun) sebebi, Yaratanın sıfatlarını mahlûkun sıfatlarına benzetmektir.<\/b> (Tekrar ediyor.) Kaideyi tekrar edeyim mi, yoksa külliye açık mı? Peki."]]}, {"reader": false, "ar": [[2561.0, "وهي إجابةٌ عن سؤال:"], [2566.0, "لماذا وقع هؤلاء الأذكياء فيما وقعوا فيه من هذا التعطيل العظيم المتكرِّر معهم في كلّ شيءٍ من نصوص الصفات؟"], [2579.0, "والجواب في هذه الكلّيّة:"], [2583.0, "هي أنهم جعلوا صفاتِ الله عز وجل كصفات خلقه،"], [2589.0, "فصارت عقولُهم تسبح في تلك اللوازم الباطلة على صفات الله عز وجل؛"], [2594.0, "لأنهم لا يتصوّرون منها إلا ما يتصوّرونه من اللوازم على صفات المخلوقات،"], [2601.0, "فكلُّ لازمٍ على صفةٍ من صفات المخلوق فيلزم على صفات الخالق عندهم."]], "tr": [[2561.0, "Bu (külliye) şu sorunun cevabıdır:"], [2566.0, "Bu zeki kimseler, sıfat naslarının her birinde kendileriyle birlikte tekrar eden bu büyük ta'tile neden düştüler?"], [2579.0, "Cevap bu külliyededir: Onlar Allah Azze ve Celle'nin sıfatlarını mahlûkatının sıfatları gibi kıldılar;"], [2588.3, "böylece akılları Allah Azze ve Celle'nin sıfatlarına (yöneltilen) o bâtıl lâzımlarda yüzmeye başladı."], [2594.0, "Çünkü onlar o sıfatlardan ancak mahlûkatın sıfatlarına gelen lâzımlardan tasavvur ettiklerini tasavvur ederler."], [2601.0, "Onlara göre mahlûkun sıfatlarından birine gelen her lâzım, Yaratanın sıfatlarına da gelir."]]}, {"reader": false, "ar": [[2610.0, "فأرادوا أن يُنزّهوا اللهَ عز وجل عن هذه اللوازم الباطلة التي فرضتها عقولُهم بسبب تمثيل صفات الخالق بصفات المخلوق،"], [2621.0, "ولو أنّ عقولهم سلمت من هذا التمثيل لسلمت من تلك اللوازم الباطلة،"], [2628.0, "ولكن قدّر الله وما شاء فعل."], [2632.0, "ولذلك لا تزال نصوصُ الصفات تُتلى على مسامع أهل السنّة والجماعة ليلًا ونهارًا في الصلوات وغيرها،"], [2642.0, "وتمرّ على قلوبهم مرورَ الكرام،"], [2645.0, "لا يلزم عليها شيءٌ من تلك اللوازم الباطلة."]], "tr": [[2610.0, "Yaratanın sıfatlarını mahlûkun sıfatlarına benzetmeleri sebebiyle akıllarının varsaydığı bu bâtıl lâzımlardan Allah Azze ve Celle'yi tenzih etmek istediler."], [2620.4, "Akılları bu temsilden salim kalsaydı, o bâtıl lâzımlardan da salim kalırdı;"], [2626.8, "fakat Allah takdir etti ve dilediğini yaptı."], [2632.0, "Bu yüzden sıfat nasları gece gündüz namazlarda ve başka yerlerde Ehl-i Sünnet ve'l-Cemaat'in kulaklarına okunur ve onların kalplerinden kerîm kimselerin geçişi gibi (sükûnetle) geçer;"], [2646.2, "onlara o bâtıl lâzımlardan hiçbiri gelmez."]]}, {"reader": false, "ar": [[2650.0, "وسببُ ذلك أنّ عقول أهل السنّة معصومةٌ من هذه البذرة الإبليسيّة التي نسمّيها بذرةَ التمثيل."], [2659.0, "فلو أنك تأمّلتَ في صفة الاستواء عندهم،"], [2667.0, "فإنهم تصوّروا أنّ الله عز وجل مستوٍ على عرشه كاستواء الإنسان على كرسيّه،"], [2678.0, "وجميعُ ما يلزم من استواء الإنسان على كرسيّه فإنهم مباشرةً يجعلونه لازمًا على استواء الله على عرشه."], [2689.0, "فكما أنّ الإنسان لا يجلس إلا على ما هو أكبرُ منه،"], [2694.9, "إذًا فمن لوازم استواء الله على العرش أن يكون العرشُ أكبرَ من الله،"]], "tr": [[2650.0, "Bunun sebebi, Ehl-i Sünnet'in akıllarının, \"temsil tohumu\" dediğimiz bu iblisçe tohumdan korunmuş olmasıdır."], [2659.0, "Onlar nezdinde istivâ sıfatını düşünürsen (görürsün ki):"], [2663.5, "Allah Azze ve Celle'nin Arşı üzerine, insanın kürsüsü üzerine istivâsı gibi müstevî olduğunu tasavvur ettiler."], [2678.7, "İnsanın kürsüsü üzerine istivâsından lâzım gelen her şeyi de hemen Allah'ın Arşı üzerine istivâsına lâzım kılarlar."], [2689.0, "İnsan ancak kendisinden büyük olan bir şeyin üzerine oturabildiğine göre, o hâlde Allah'ın Arş üzerine istivâsının lâzımlarından biri, Arş'ın Allah'tan büyük olmasıdır."]]}]}, {"ts": "45:00", "title": "6. Külliye (devam): İstivâ, el, ayak ve \"semadaki\" örnekleri; şeytanın ilkası", "paras": [{"reader": false, "ar": [[2700.0, "وهذا باطل، إذًا ننفي صفةَ الاستواء."], [2703.0, "ومن لوازم استواء الإنسان على كرسيّه أنه لو أُبعد عنه الكرسيُّ لسقط،"], [2711.0, "فيجعلون ذلك أيضًا من لوازم استواء الله على عرشه:"], [2718.0, "أنه لو أُبعد العرشُ عن الربّ لسقط،"], [2722.0, "وبما أنه لازمٌ باطل،"], [2725.0, "فننفي صفةَ الاستواء لنرتاح من تلك اللوازم الباطلة."]], "tr": [[2700.0, "Bu ise bâtıldır; o hâlde istivâ sıfatını nefyederiz."], [2703.0, "İnsanın kürsüsü üzerine istivâsının lâzımlarından biri de kürsü ondan uzaklaştırılırsa düşecek olmasıdır."], [2711.0, "Bunu da Allah'ın Arşı üzerine istivâsının lâzımlarından kılarlar:"], [2718.0, "Arş Rab'den uzaklaştırılsa O düşerdi."], [2720.3, "Bu bâtıl bir lâzım olduğuna göre, o bâtıl lâzımlardan kurtulmak için istivâ sıfatını nefyederiz (derler)."]]}, {"reader": false, "ar": [[2731.0, "وهكذا أيضًا في صفة يده؛"], [2737.0, "فإنّ من لوازم يد المخلوق وصفَها بالجارحة،"], [2742.0, "والجوارحُ ممتنعةٌ على الله عز وجل،"], [2744.0, "فإذًا ليس لله يد،"], [2746.0, "وإنما هي النعمةُ والقدرة."], [2748.0, "وكذلك صفةُ الساق والرِّجل لله عز وجل،"], [2755.0, "يحرّفونها ويُخرجونها عن مدلولها الصحيح،"], [2761.0, "بحجّة أنّ الرِّجل من لوازمها في حقّ المخلوق أن تُسمّى بأنها جارحة،"], [2769.0, "والجوارحُ ممتنعةٌ على الله عز وجل،"], [2773.0, "فإذًا ليس لله لا ساقٌ ولا رِجلٌ ولا قدم."]], "tr": [[2731.0, "O'nun eli sıfatında da böyledir:"], [2731.8, "Mahlûkun elinin lâzımlarından biri onun bir uzuv (cârıha) olarak nitelenmesidir;"], [2733.4, "uzuvlar ise Allah Azze ve Celle için imkânsızdır;"], [2737.0, "o hâlde Allah'ın eli yoktur, o ancak nimet ve kudrettir (derler)."], [2742.0, "Allah Azze ve Celle'nin baldır (sâk) ve ayak (ricl) sıfatı da böyledir:"], [2745.5, "Onu tahrif eder ve sahih medlûlünden çıkarırlar."], [2748.0, "Gerekçeleri şudur: Ayağın mahlûk hakkındaki lâzımlarından biri, onun bir uzuv olarak adlandırılmasıdır;"], [2762.9, "uzuvlar ise Allah Azze ve Celle için imkânsızdır;"], [2769.7, "o hâlde Allah'ın ne baldırı ne ayağı ne de kademi vardır."]]}, {"reader": false, "ar": [[2777.0, "وكذلك يقولون في قول الله عز وجل:"], [2784.0, "<span class=\"ayah\">﴿أَأَمِنتُم مَّن فِي السَّمَاءِ﴾<\/span> <span class=\"ref\">[الملك: ١٦]<\/span>،"], [2788.0, "فهم يعطّلون الله عز وجل عن كونه على السماء،"], [2792.0, "لأنهم لا يفهمون من «في» هنا إلا الظرفيّة؛"], [2798.0, "فهو كما تقول بأنّ الإنسان في غرفته،"], [2802.6, "فيلزم من «في» هنا أن تكون الغرفةُ محيطةً بمن فيها من كلّ الجهات،"], [2815.0, "فبعضُها يُقِلّه، وبعضُها يُظِلّه،"], [2817.8, "ومنها ما هو عن جانبيه."], [2825.0, "فلا يفهمون من أنّ الله عز وجل في السماء إلا ما يفهمونه من ظرفيّة المخلوق في المخلوق."]], "tr": [[2777.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Semada olandan emin mi oldunuz?﴾<\/span> [Mülk 16] sözü hakkında da böyle derler."], [2784.0, "Allah Azze ve Celle'yi sema üzerinde olmaktan ta'til ederler;"], [2790.7, "çünkü buradaki \"fî\" (içinde) edatından ancak zarfiyeti (kuşatılmışlığı) anlarlar."], [2798.0, "Bu, senin \"İnsan odasının içindedir\" demen gibidir;"], [2802.6, "buradaki \"fî\"den, odanın içindekini her yönden kuşatması lâzım gelir:"], [2808.4, "Bir kısmı onu taşır, bir kısmı onu gölgeler, bir kısmı da iki yanındadır."], [2825.0, "Allah Azze ve Celle'nin semada olmasından ancak mahlûkun mahlûk içinde bulunmasından anladıklarını anlarlar."]]}, {"reader": false, "ar": [[2834.0, "وكلُّ ذلك سببُه ما تؤكّد عليه هذه الكلّيّة:"], [2839.2, "أنّ كلَّ من انقدح في ذهنه شيءٌ من اللوازم الباطلة بعد سماع شيءٍ من نصوص الصفات،"], [2850.0, "فسببُ هذا اللازم هو تمثيلُ صفة الخالق بالمخلوق."]], "tr": [[2834.0, "Bütün bunların sebebi, bu külliyenin üzerinde durduğu şeydir:"], [2839.9, "Sıfat naslarından birini işittikten sonra zihninde bâtıl lâzımlardan bir şey beliren herkesin bu lâzımının sebebi, Yaratanın sıfatını mahlûka benzetmektir."]]}, {"reader": false, "ar": [[2856.0, "وأظنّ هذا النوع يدخل تحت قول الله عز وجل:"], [2862.0, "<span class=\"ayah\">﴿وَمَا أَرْسَلْنَا مِن قَبْلِكَ مِن رَّسُولٍ وَلَا نَبِيٍّ إِلَّا إِذَا تَمَنَّىٰ﴾<\/span> ـ والأمنيّة هنا هي القراءة ـ <span class=\"ayah\">﴿أَلْقَى الشَّيْطَانُ فِي أُمْنِيَّتِهِ﴾<\/span> <span class=\"ref\">[الحج: ٥٢]<\/span>،"], [2874.0, "وهي تلك النفخاتُ الشيطانيّة التي يُلقيها في عقلك وقلبك وقتَ قراءة القرآن،"], [2884.0, "عند نصوص الصفات أو شيءٍ من متعلّقات الغيب،"], [2887.0, "حتى يُوقعك في تمثيلها بالمشاهَدات،"], [2892.0, "فتصل بهذا إلى تلك اللوازم الباطلة التي تُفضي بك إلى التعطيل والإلحاد."]], "tr": [[2856.0, "Zannediyorum bu tür, Allah Azze ve Celle'nin şu sözünün kapsamına girer:"], [2862.0, "<span class=\"ayah\">﴿Senden önce gönderdiğimiz hiçbir resul ve nebi yoktur ki temennî ettiğinde (okuduğunda)﴾<\/span> —buradaki \"ümniyye\" okumadır— <span class=\"ayah\">﴿şeytan onun okumasına (bir şey) atmış olmasın﴾<\/span> [Hac 52]."], [2875.7, "Bu, Kur'an okunurken, sıfat nasları veya gaybın taallukları yanında şeytanın senin aklına ve kalbine attığı o şeytanî üfürüklerdir;"], [2886.2, "ta ki seni onları görülen şeylere benzetmeye düşürsün ve sen bununla seni ta'tile ve ilhada götüren o bâtıl lâzımlara ulaşasın."]]}, {"reader": false, "ar": [[2901.0, "لكن بقواعد أهل السنّة <span class=\"ayah\">﴿يَنسَخُ اللَّهُ﴾<\/span> عز وجل <span class=\"ayah\">﴿مَا يُلْقِي الشَّيْطَانُ ثُمَّ يُحْكِمُ اللَّهُ آيَاتِهِ ۗ وَاللَّهُ عَلِيمٌ حَكِيمٌ﴾<\/span> <span class=\"ref\">[الحج: ٥٢]<\/span>."], [2912.0, "ولذلك فإنّ آيات الله إذا تُليت على أهل السنّة إنما تزيدهم إيمانًا،"], [2921.0, "ولكن إذا تُليت آياتُ الصفات على أهل البدع فإنهم كما قال الله عز وجل:"], [2928.0, "<span class=\"ayah\">﴿وَإِذَا تُتْلَىٰ عَلَيْهِمْ آيَاتُنَا بَيِّنَاتٍ تَعْرِفُ فِي وُجُوهِ الَّذِينَ كَفَرُوا الْمُنكَرَ ۖ يَكَادُونَ يَسْطُونَ بِالَّذِينَ يَتْلُونَ عَلَيْهِمْ آيَاتِنَا﴾<\/span> <span class=\"ref\">[الحج: ٧٢]<\/span>."]], "tr": [[2901.0, "Fakat Ehl-i Sünnet'in kaideleriyle <span class=\"ayah\">﴿Allah﴾<\/span> Azze ve Celle <span class=\"ayah\">﴿şeytanın attığını giderir, sonra Allah ayetlerini sağlamlaştırır. Allah her şeyi bilendir, hüküm ve hikmet sahibidir﴾<\/span> [Hac 52]."], [2912.0, "Bu yüzden Allah'ın ayetleri Ehl-i Sünnet'e okunduğunda onların ancak imanını artırır."], [2919.9, "Fakat sıfat ayetleri bid'at ehline okunduğunda, onlar Allah Azze ve Celle'nin buyurduğu gibidir:"], [2928.0, "<span class=\"ayah\">﴿Onlara ayetlerimiz apaçık olarak okunduğunda, inkâr edenlerin yüzlerinde hoşnutsuzluğu tanırsın. Neredeyse kendilerine ayetlerimizi okuyanlara saldıracaklar﴾<\/span> [Hac 72]."]]}, {"reader": false, "ar": [[2940.0, "فإذا تلوتَ عليهم: <span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span> تمعّرت وجوهُهم:"], [2945.0, "هذا لا يجوز وصفُ الله به!"], [2948.0, "وإذا تلوتَ عليهم: <span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span> تمعّرت وجوهُهم،"], [2953.0, "ويقولون بأنّ الله لا يُوصف بأنّ له يدين."], [2958.0, "فمتى ما تُليت آياتُ الصفات على أهل البدع والمعطِّلة أو الممثِّلة فإنّ قلوبهم تشمئزّ،"], [2967.0, "ووجوهَهم تكفهرّ. أمّا أهل السنّة ـ ولله الحمد ـ فلا تزيدهم تلك الآياتُ إلا إيمانًا،"], [2975.0, "وسببُ ذلك عدمُ وجود بذرة التمثيل في عقولنا وقلوبنا،"], [2980.4, "نسأل الله أن يعصمنا من ذلك."]], "tr": [[2940.0, "Onlara <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5] diye okuduğunda yüzleri değişir:"], [2945.0, "\"Allah bununla nitelenemez!\" Onlara <span class=\"ayah\">﴿Bilakis O'nun iki eli açıktır﴾<\/span> [Mâide 64] diye okuduğunda yüzleri değişir ve \"Allah'ın iki eli olduğu söylenerek nitelenemez\" derler."], [2958.0, "Sıfat ayetleri bid'at ehline, Muattıla'ya veya Mümessile'ye ne zaman okunsa, kalpleri tiksinir, yüzleri kararır."], [2969.0, "Ehl-i Sünnet'e gelince —hamd Allah'adır— o ayetler onların ancak imanını artırır."], [2975.0, "Bunun sebebi akıllarımızda ve kalplerimizde temsil tohumunun bulunmamasıdır;"], [2980.4, "Allah'tan bizi bundan korumasını dileriz."]]}, {"reader": false, "ar": [[2984.0, "واعلموا أنّ كلَّ من أنكر صفةَ نزول الله في ثلث الليل إنما سببُه أنه مثّل نزولَ الله بنزول خلقه،"], [3001.0, "فيقول قائلُهم بأنّ ثلث الليل يدور على الكرة الأرضيّة،"], [3006.0, "فيلزم من ذلك أن يكون الله نازلًا ويدور بدوران ثلث الليل!"]], "tr": [[2984.0, "Bilin ki gecenin üçte birinde Allah'ın iniş sıfatını inkâr eden herkesin (inkârının) sebebi, Allah'ın inişini mahlûkatının inişine benzetmesidir."], [2999.3, "Onlardan biri der ki: Gecenin üçte biri yerkürenin üzerinde döner;"], [3004.9, "bundan, Allah'ın inmiş olması ve gecenin üçte birinin dönmesiyle birlikte dönmesi lâzım gelir!"]]}, {"reader": false, "ar": [[3013.0, "وكأنّ الكرة الأرضيّة وكافّةَ الأفلاك العلويّة والسفليّة تُشكّل شيئًا عند عظمة الله عز وجل!"], [3024.0, "فما السماواتُ السبع والأرضون السبع إلا كحلقةٍ مُلقاةٍ في أرضٍ فلاةٍ بالنسبة للكرسيّ،"], [3032.8, "بَلْهَ العرش، بَلْهَ من استوى على العرش عز وجل."], [3037.0, "ولكنّ سببَ إنكارهم لصفة النزول هو هذا:"], [3043.0, "أنه إذا نزل إلى السماء الدنيا فيلزم أن يكون بعضُ السماوات فوقه؛"], [3049.0, "لأنهم لم يفهموا من النزول الإلهيّ إلا كنزول المخلوق،"], [3054.0, "فجعلوا ما يلزم على هذا يلزم على هذا."]], "tr": [[3013.0, "Sanki yerküre ve yukarıdaki ve aşağıdaki bütün felekler Allah Azze ve Celle'nin azameti karşısında bir şey ifade ediyormuş gibi!"], [3024.0, "Yedi gök ve yedi yer, Kürsî'ye nispetle ancak çöl bir araziye atılmış bir halka gibidir;"], [3032.8, "Arş'ı bırak, Arş'a istivâ eden Azze ve Celle'yi hiç bırak!"], [3037.0, "Fakat onların iniş sıfatını inkâr etmelerinin sebebi şudur:"], [3043.0, "O, dünya semasına indiğinde göklerin bir kısmının O'nun üstünde olması lâzım gelir (derler)."], [3049.0, "Çünkü onlar ilâhî inişten ancak mahlûkun inişi gibi bir şey anladılar;"], [3054.0, "bunun için lâzım geleni onun için de lâzım kıldılar."]]}, {"reader": false, "ar": [[3058.0, "ولذلك فالواجبُ الحذرُ من أن ينجح الشيطان في أن يزرع بذرةَ التمثيل في قلبك أو عقلك،"]], "tr": [[3058.0, "Bu yüzden vâcip olan, şeytanın kalbine veya aklına temsil tohumunu ekmeyi başarmasından sakınmaktır."]]}, {"reader": false, "ar": [[3071.0, "لأنها البذرة التي متى ما وُجدت وُجد معها الفسادُ العقديّ،"], [3077.0, "فيُوجد معها الشرك، ويُوجد معها التمثيل،"], [3080.0, "ويُوجد معها التعطيلُ والإلحاد ـ التعطيلُ والإلحاد."]], "tr": [[3071.0, "Çünkü o, ne zaman bulunursa onunla birlikte akîde fesadının da bulunduğu tohumdur:"], [3076.2, "Onunla birlikte şirk bulunur, onunla birlikte temsil bulunur, onunla birlikte ta'til ve ilhad bulunur —ta'til ve ilhad."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
