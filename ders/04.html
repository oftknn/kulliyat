ekle birlikte, bu, inanılması ve isbat edilmesi vacip bir hakikat olarak kalır."], [3439.0, "Pek çok meselede durum böyledir."]]}, {"reader": false, "ar": [[3442.0, "فتجد أن أمور الغيب قد يحار العقل فيها لسعة مدلولها ومعناها،"], [3449.4, "وضعفِ مدركاته وعجزه. فمن الناس من يجعل عجزَ ضعفه وحيرتَه وضعفَ مدركاته في هذا الأمر الغيبي دليلًا على إنكاره في ذاته،"], [3464.0, "وهذا منهج أهل البدع."], [3467.0, "ومن الناس من يجعل المتّهَمَ عقلَه،"], [3471.5, "لا النص <span class=\"q\">؟ 57:47<\/span>، ويجعل العيب في مدركات عقله وليس العيب في النص،"], [3481.0, "وهم أهل السنة والجماعة."]], "tr": [[3442.0, "Gayb işlerinde, delâletlerinin ve manalarının genişliği, aklın idrakinin zayıflığı ve acizliği sebebiyle aklın hayrete düşebildiğini görürsün."], [3449.4, "İnsanlardan kimi, bu gaybî işteki zayıflığının acizliğini, hayretini ve idrakinin zayıflığını, o işin kendisini inkâr etmeye delil yapar;"], [3464.0, "bu, bid'at ehlinin metodudur. İnsanlardan kimi de nassı değil, aklını töhmet altında görür <span class=\"q\">؟<\/span>;"], [3471.5, "kusuru nasta değil, aklının idrakinde görür;"], [3471.5, "bunlar da Ehl-i Sünnet ve'l-Cemaat'tir."]]}, {"reader": false, "ar": [[3485.0, "ولعلكم فهمتم. ترى كلُّ هذا الدرس واللي قبله كلُّها مقدّماتٌ في فهم العقيدة. فهمتموني؟ طيب."]], "tr": [[3485.0, "Umarım anladınız. Bakın, bu dersin ve öncekinin tamamı akîdeyi anlamaya dair mukaddimelerdir. Beni anladınız mı? Peki."]]}]}, {"ts": "58:15", "title": "8. Külliye: Naklin nuruyla aydınlanmayan her akıl sapıklık ve körlük içindedir", "paras": [{"reader": false, "ar": [[3495.0, "الكلية الثامنة: <b>كلُّ عقلٍ لم يستنِر بنور النقل ففي ضلالٍ وعمى.<\/b> كلُّ عقلٍ لم يستنر بنور النقل ففي ضلالةٍ وعمى."], [3518.0, "ولذلك يقول أهل السنة:"], [3520.7, "إنّ من أُعجب برأيه ضلّ،"], [3524.1, "ومن استغنى بعقله زلّ."], [3532.0, "ولله درُّ أبي العباس ابن تيمية رحمه الله تعالى وهو يتكلّم عن حال أهل الكلام والفلسفة،"], [3542.0, "ويبيّن سبب ضلالهم في العقيدة،"], [3545.3, "وهو اعتمادهم على عقولهم المجرّدة عن نور الوحي ودليل النص،"], [3552.0, "فقال: «أولئك قومٌ أُوتوا ذكاءً ولم يُؤتَوا زكاءً، وأُعطوا فهومًا ولم يُعطَوا علومًا، وأُعطوا سمعًا وأبصارًا وأفئدة، فما أغنى عنهم سمعُهم ولا أبصارُهم ولا أفئدتُهم من شيء»."]], "tr": [[3495.0, "Sekizinci külliye: <b>Naklin nuruyla aydınlanmayan her akıl sapıklık ve körlük içindedir.<\/b> (Tekrar ediyor.) Bu yüzden Ehl-i Sünnet şöyle der:"], [3495.0, "Kendi görüşünü beğenen sapar, aklıyla (nakle) ihtiyaç duymayan kayar."], [3524.1, "Kelâm ve felsefe ehlinin hâlinden bahsederken ve onların akîdedeki sapıklıklarının sebebini —vahyin nurundan ve nassın delilinden soyulmuş akıllarına dayanmalarını— açıklarken Ebü'l-Abbâs İbn Teymiyye (rahimehullah) ne güzel söylemiştir:"], [3545.3, "\"Onlar zekâ verilmiş ama arınmışlık (zekâ') verilmemiş, anlayışlar verilmiş ama ilimler verilmemiş, kulaklar, gözler ve gönüller verilmiş bir topluluktur;"], [3552.0, "fakat ne kulakları, ne gözleri, ne de gönülleri onlara hiçbir fayda vermemiştir.\""]]}, {"reader": false, "ar": [[3586.0, "فإن قلت: ولماذا لم تُغنِ عنهم من شيء؟"], [3588.0, "الجواب: لأنها لم تستنر بنور الدليل."], [3592.0, "مهما بلغ الإنسان في ذكائه،"], [3596.0, "ومهما كان خارقًا في دهائه،"], [3600.0, "فإن العقل بمجرّده ليس كفيلًا بالنجاة،"], [3605.0, "بل النجاة مرهونةٌ بكمال العقل مقرونًا بنور الوحي والنقل."]], "tr": [[3586.0, "\"Neden onlara hiçbir fayda vermedi?\" dersen, cevap:"], [3586.0, "Çünkü delilin nuruyla aydınlanmadılar. İnsan zekâsında ne kadar ileri giderse gitsin, kurnazlığında ne kadar olağanüstü olursa olsun, akıl tek başına kurtuluşun kefili değildir;"], [3605.0, "bilakis kurtuluş, vahyin ve naklin nuruyla birleşmiş aklın kemaline bağlıdır."]]}]}, {"ts": "1:00:14", "title": "8. Külliye (devam): Nakilsiz akıllar ve Kur'an'daki deliller", "paras": [{"reader": false, "ar": [[3614.0, "ولذلك وصف الله عز وجل العقولَ بلا نقولٍ بأنها عقولٌ ضالّة،"], [3623.0, "وأنها عقولٌ بهيمية، كما قال الله عز وجل:"], [3628.0, "<span class=\"ayah\">﴿وَلَقَدْ ذَرَأْنَا لِجَهَنَّمَ كَثِيرًا مِّنَ الْجِنِّ وَالْإِنسِ ۖ لَهُمْ قُلُوبٌ لَّا يَفْقَهُونَ بِهَا﴾<\/span>،"], [3642.0, "وعدمُ فقه قلوبهم لأنها عقولٌ مجرّدةٌ عن نور النص؛"], [3652.0, "فلو اهتدت عقولهم وقلوبهم بنور النص لانتفعوا بها،"], [3657.3, "لكنهم لم ينتفعوا بها،"], [3659.0, "لأنهم اعتمدوا عليها ورفضوا ـ ورفضوا ـ اتّباع هداية النص."], [3667.0, "<span class=\"ayah\">﴿وَلَهُمْ أَعْيُنٌ لَّا يُبْصِرُونَ بِهَا﴾<\/span> لأنها أعينٌ مجرّدةٌ عن بصيرة النص،"], [3675.0, "<span class=\"ayah\">﴿وَلَهُمْ آذَانٌ لَّا يَسْمَعُونَ بِهَا﴾<\/span> <span class=\"ref\">[الأعراف: ١٧٩]<\/span> لأنها آذانٌ مجرّدةٌ عن سماع النص وامتثال النص."]], "tr": [[3614.0, "Bu yüzden Allah Teâlâ nakilsiz akılları sapık akıllar ve hayvanî akıllar olarak nitelemiştir."], [3623.0, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [3628.0, "<span class=\"ayah\">﴿Andolsun, cinlerden ve insanlardan birçoğunu cehennem için yarattık. Onların kalpleri vardır, onlarla kavramazlar﴾<\/span>."], [3628.0, "Kalplerinin kavramaması, onların nassın nurundan soyulmuş akıllar olmasındandır."], [3652.0, "Akılları ve kalpleri nassın nuruyla hidayete erseydi onlardan faydalanırlardı;"], [3659.0, "ama onlardan faydalanmadılar, çünkü onlara dayandılar ve nassın hidayetine uymayı reddettiler."], [3667.0, "<span class=\"ayah\">﴿Gözleri vardır, onlarla görmezler﴾<\/span>; çünkü nassın basiretinden soyulmuş gözlerdir."], [3675.0, "<span class=\"ayah\">﴿Kulakları vardır, onlarla işitmezler﴾<\/span> [A'râf 179];"], [3675.0, "çünkü nassı işitmekten ve ona uymaktan soyulmuş kulaklardır."]]}, {"reader": false, "ar": [[3688.0, "وكما قال الله عز وجل:"], [3690.7, "<span class=\"ayah\">﴿وَكَذَٰلِكَ أَوْحَيْنَا إِلَيْكَ رُوحًا مِّنْ أَمْرِنَا ۚ مَا كُنتَ تَدْرِي مَا الْكِتَابُ وَلَا الْإِيمَانُ وَلَٰكِن جَعَلْنَاهُ نُورًا نَّهْدِي بِهِ مَن نَّشَاءُ مِنْ عِبَادِنَا﴾<\/span> <span class=\"ref\">[الشورى: ٥٢]<\/span>."], [3706.0, "فمن كان عنده عقلٌ ولا يدري عن نور الوحي فإنه لا يزال في عمايةٍ وضلالٍ وتيهٍ وحيرة."]], "tr": [[3688.0, "Allah Teâlâ'nın şu sözü de böyledir:"], [3690.7, "<span class=\"ayah\">﴿İşte böylece sana da emrimizden bir ruh (Kur'an) vahyettik. Sen kitap nedir, iman nedir bilmezdin. Fakat biz onu, kullarımızdan dilediğimizi kendisiyle doğru yola ilettiğimiz bir nur kıldık﴾<\/span> [Şûrâ 52]."], [3690.7, "Aklı olup da vahyin nurundan habersiz olan kişi, körlük, sapıklık, şaşkınlık ve hayret içinde kalmaya devam eder."]]}, {"reader": false, "ar": [[3716.0, "وبناءً على ذلك فكلُّ من زعم كمالَ قدرته العقلية أن يخرج عن مقتضى النص فهو كافرٌ وضالّ؛"], [3730.0, "إذ لا يمكن للعقل المجرّد ـ مهما بلغ في الذكاء والدهاء ـ أن يخترع طريقًا يوصلك إلى الله إلا بدلالة النص."], [3742.4, "فالعقل بمجرّده لا يهديك إلى الله،"], [3745.7, "والقلب بمجرّده لا يهديك إلى الله،"], [3749.0, "والبصر والسمع بمجرّدهما لا يهديانك إلى الله،"], [3753.9, "إلا إذا استنارت بنور النص."], [3757.0, "فطوبى لنا ـ معاشرَ أهل السنة والجماعة ـ فإننا دائمًا متّبِعين ـ فإننا دائمًا متّبِعون للنقل."]], "tr": [[3716.0, "Buna dayanarak, akıl gücünün kemaliyle nassın gereğinden çıkabileceğini iddia eden herkes kâfir ve sapıktır."], [3730.0, "Çünkü soyut akıl, zekâ ve kurnazlıkta ne kadar ileri giderse gitsin, nassın delâleti olmadan seni Allah'a ulaştıracak bir yol icat edemez."], [3742.4, "Akıl tek başına seni Allah'a iletmez;"], [3745.7, "kalp tek başına seni Allah'a iletmez;"], [3749.0, "göz ve kulak tek başlarına seni Allah'a iletmez;"], [3753.9, "ancak nassın nuruyla aydınlanırlarsa (iletir)."], [3757.0, "Ne mutlu bize, Ehl-i Sünnet ve'l-Cemaat topluluğuna!"], [3757.0, "Çünkü biz daima nakle uyanlarız."]]}, {"reader": false, "ar": [[3768.0, "وكذلك أجمع أهل السنة على أن العقل بمجرّده ليس طريقًا يكفل الهداية ما لم يستنر بنور النص."], [3783.0, "وكذلك أجمع أهل السنة على ضلال من زعم تقديم العقل على النقل إذا تعارضا؛"], [3793.0, "فمعتقد ذلك ضالٌّ بالإجماع."]], "tr": [[3768.0, "Aynı şekilde Ehl-i Sünnet, aklın nassın nuruyla aydınlanmadıkça tek başına hidayeti garanti eden bir yol olmadığında icmâ etmiştir."], [3783.0, "Yine Ehl-i Sünnet, çeliştiklerinde aklın nakilden önce geldiğini iddia edenin sapıklığında icmâ etmiştir;"], [3793.0, "buna inanan icmâ ile sapıktır."]]}, {"reader": false, "ar": [[3797.0, "فإن قلت: هلّا عقدتَ مقارنةً بسيطةً بين العقل والنقل،"], [3806.0, "حتى نعرف لماذا العقل يعمى ويضلّ إذا لم يستنر بنور النص؟"], [3813.0, "فأقول: خذها مقارنةً بسيطة:"], [3816.0, "العقل يعمى والنص لا يعمى،"], [3820.0, "كما قال الله عز وجل:"], [3822.0, "<span class=\"ayah\">﴿أَفَلَمْ يَسِيرُوا فِي الْأَرْضِ فَتَكُونَ لَهُمْ قُلُوبٌ يَعْقِلُونَ بِهَا أَوْ آذَانٌ يَسْمَعُونَ بِهَا ۖ فَإِنَّهَا لَا تَعْمَى الْأَبْصَارُ﴾<\/span> ـ أي لا تعمى الأدلة <span class=\"q\">؟ 01:03:52<\/span> ـ <span class=\"ayah\">﴿وَلَٰكِن تَعْمَى الْقُلُوبُ الَّتِي فِي الصُّدُورِ﴾<\/span> <span class=\"ref\">[الحج: ٤٦]<\/span> ـ أي العقول."], [3838.0, "فالذي يعمى مفتقرٌ إلى الذي لا يعمى."]], "tr": [[3797.0, "\"Akıl ile nakil arasında basit bir karşılaştırma yapsan da, nassın nuruyla aydınlanmadığında aklın neden körleşip saptığını bilsek\" dersen, derim ki:"], [3816.0, "Al sana basit bir karşılaştırma:"], [3820.0, "Akıl körleşir, nas körleşmez. Nitekim Allah Teâlâ şöyle buyurmuştur:"], [3822.0, "<span class=\"ayah\">﴿Yeryüzünde gezip dolaşmadılar mı ki, düşünecek kalpleri veya işitecek kulakları olsun? Çünkü gerçekte gözler kör olmaz﴾<\/span> —yani deliller kör olmaz <span class=\"q\">؟<\/span>— <span class=\"ayah\">﴿fakat göğüslerdeki kalpler kör olur﴾<\/span> [Hac 46] —yani akıllar. Körleşen, körleşmeyene muhtaçtır."]]}, {"reader": false, "ar": [[3848.0, "ولأن العقل يخطئ والوحي لا يخطئ؛"], [3853.0, "فليس كلُّ نتائج العقل تكون صوابًا،"], [3858.0, "لكن كلُّ نتائج النص تكون صوابًا،"], [3862.0, "والذي يخطئ مفتقرٌ إلى الذي لا يخطئ."], [3867.0, "والعقل يضلّ، كما قال الله عز وجل:"], [3877.0, "<span class=\"ayah\">﴿مَا كُنتَ تَدْرِي مَا الْكِتَابُ وَلَا الْإِيمَانُ﴾<\/span>،"], [3881.0, "والمقصود بالضلال هنا أي عدم العلم:"], [3886.0, "<span class=\"ayah\">﴿وَوَجَدَكَ ضَالًّا فَهَدَىٰ﴾<\/span> <span class=\"ref\">[الضحى: ٧]<\/span> ـ (أي هداك) إلى النبوة."], [3891.0, "وأما الوحي فإنه لا يمكن أن يوصف بالضلال أبدًا، ومن"]], "tr": [[3848.0, "Ayrıca akıl hata eder, vahiy hata etmez."], [3853.0, "Aklın bütün sonuçları doğru olmaz;"], [3853.0, "ama nassın bütün sonuçları doğrudur."], [3858.0, "Hata eden, hata etmeyene muhtaçtır."], [3862.0, "Akıl sapar; nitekim Allah Teâlâ şöyle buyurmuştur:"], [3867.0, "<span class=\"ayah\">﴿Sen kitap nedir, iman nedir bilmezdin﴾<\/span>."], [3877.0, "Buradaki sapıklıktan (dalâl) maksat bilmemektir:"], [3881.0, "<span class=\"ayah\">﴿Seni yolunu kaybetmiş bulup doğru yola iletmedi mi?﴾<\/span> [Duhâ 7] —(yani seni) nübüvvete (iletti)."], [3886.0, "Vahye gelince, o asla sapıklıkla nitelenemez. Sapması tasavvur edilebilen —"]]}]}, {"ts": "1:05:00", "title": "8. Külliye (devam): Aklın vahye muhtaçlığının sebepleri", "paras": [{"reader": false, "ar": [[3900.0, "يُتصوَّر أن يضلّ مفتقرٌ إلى ما لا يضلّ."], [3907.0, "ولأن العقل ليس بمعصوم،"], [3910.0, "وأما الوحي فمعصوم، وغيرُ المعصوم مفتقرٌ إلى المعصوم."], [3921.0, "أنتم معي في هذا ولّا لا؟"], [3924.4, "طيب. ولأن العقل يتفاوت بين الناس،"], [3929.0, "وأما الوحي فمِشكاةٌ واحدةٌ لا يتفاوت،"], [3935.0, "وما يتفاوت مفتقرٌ إلى ما لا يتفاوت."]], "tr": [[3900.0, "— sapmayana muhtaçtır. Ayrıca akıl masum değildir, vahiy ise masumdur;"], [3907.0, "masum olmayan, masum olana muhtaçtır."], [3910.0, "Bu konuda benimle misiniz, değil misiniz?"], [3921.0, "Peki. Ayrıca akıl insanlar arasında farklılık gösterir;"], [3924.4, "vahiy ise tek bir kandildir (mişkât), farklılık göstermez."], [3929.0, "Farklılık gösteren, farklılık göstermeyene muhtaçtır."]]}, {"reader": false, "ar": [[3944.0, "ولأن العقل يضطرب بسبب تعارض الحجج،"], [3949.0, "وأما الوحي فلا يضطرب ولا يختلف أبدًا،"], [3956.0, "كما قال الله عز وجل:"], [3958.0, "<span class=\"ayah\">﴿وَلَوْ كَانَ مِنْ عِندِ غَيْرِ اللَّهِ لَوَجَدُوا فِيهِ اخْتِلَافًا كَثِيرًا﴾<\/span> <span class=\"ref\">[النساء: ٨٢]<\/span>،"], [3963.0, "وكما قال الله عز وجل عن وصف القرآن:"], [3966.0, "<span class=\"ayah\">﴿لَّا يَأْتِيهِ الْبَاطِلُ﴾<\/span> ـ أي الاضطرابُ والتناقضُ والاختلاف ـ <span class=\"ayah\">﴿مِن بَيْنِ يَدَيْهِ وَلَا مِنْ خَلْفِهِ﴾<\/span> <span class=\"ref\">[فصلت: ٤٢]<\/span>."], [3974.0, "وأما العقل فيضطرب ويختلف،"], [3976.0, "ويأتيه الباطل من بين يديه ومن خلفه،"], [3979.0, "ومن يضطرب مفتقرٌ إلى هداية ما لا يضطرب."]], "tr": [[3944.0, "Ayrıca akıl delillerin çatışması sebebiyle sarsılır;"], [3949.0, "vahiy ise asla sarsılmaz ve çelişmez."], [3956.0, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [3958.0, "<span class=\"ayah\">﴿Eğer o, Allah'tan başkası tarafından olsaydı, onda birçok çelişki bulurlardı﴾<\/span> [Nisâ 82]."], [3963.0, "Allah Teâlâ Kur'an'ı nitelerken de şöyle buyurmuştur:"], [3966.0, "<span class=\"ayah\">﴿Ona bâtıl﴾<\/span> —yani sarsıntı, tenakuz ve çelişki— <span class=\"ayah\">﴿ne önünden ne de arkasından gelebilir﴾<\/span> [Fussilet 42]."], [3966.0, "Akıl ise sarsılır, çelişir; ona bâtıl önünden ve arkasından gelir. Sarsılan, sarsılmayanın hidayetine muhtaçtır."]]}, {"reader": false, "ar": [[3985.0, "ولذلك لا بدّ للعقول أن تستنير بنور النص؛"], [3989.0, "فالعقول لا تزال في ضلالٍ وغوايةٍ وجهالةٍ وعمى وانحراف،"], [3996.0, "ما لم تستنر بنور الكتاب والسنة وفهم السلف الصالح."], [4000.0, "نسأل الله أن يثبّتنا وإياكم على ذلك."], [4002.0, "والله أعلى وأعلم، وصلى الله وسلم على نبينا محمد."]], "tr": [[3985.0, "Bu yüzden akılların nassın nuruyla aydınlanması şarttır."], [3985.0, "Akıllar, Kitap ve Sünnet'in ve selef-i sâlihînin anlayışının nuruyla aydınlanmadıkça sapıklık, azgınlık, cehalet, körlük ve sapma içinde kalmaya devam eder."], [3996.0, "Allah'tan bizi ve sizi bunun üzerinde sabit kılmasını dileriz."], [4000.0, "Allah en yüce olandır ve en iyisini bilendir."], [4002.0, "Allah Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};

function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
