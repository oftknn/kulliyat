<script>
const D={"no": 4, "vid": "I58hb9tirPk", "title_ar": "الدرس (٤) من شرح كليات العقيدة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 4. Ders: İkinci Kırk Külliye (1–8) — Akîdede Çoğulculuk, Ehl-i Sünnet'in Sınırları, Gayb ve Akıl", "sections": [{"ts": "00:00", "title": "Giriş ve 1. Külliye: Akîdede çoğulculuk reddedilir", "paras": [{"reader": false, "ar": [[0.5, "(والصلاة والسلام) على رسول الله الأمين،"], [2.1, "وعلى آله وأصحابه الطيبين الطاهرين،"], [4.8, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [7.9, "أما بعد: هذا هو المجلس العلمي الثاني في شرح كلّيّات التوحيد والعقيدة."], [15.4, "وقد شرحنا في المجلس الأول أربعين كلّيّةً عقدية،"], [20.5, "وراجعناكم فيها، وأعجبتموني في المراجعة أيَّما إعجاب."], [33.0, "ونبدأ ـ إن شاء الله ـ مستعينين (بالله) في هذا الدرس بشرح الأربعين الثانية،"], [39.0, "مبتدئين بالكلية الأولى: <b>كلُّ تعدُّديةٍ في أمور الاعتقاد فمرفوضة.<\/b> كلُّ تعدديةٍ في أمور الاعتقاد مرفوضة."], [61.0, "كلُّ تعدديةٍ في أمور الاعتقاد مرفوضة."], [71.0, "تحبّون أن أعيد؟ واضحة؟ طيب."]], "tr": [[0.5, "Salât ve selâm Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [7.9, "Bundan sonra: Bu, tevhid ve akîde külliyelerinin şerhindeki ikinci ilim meclisidir."], [15.4, "Birinci mecliste kırk akîde külliyesini şerh ettik, onları sizinle tekrar ettik ve tekrarda beni son derece memnun ettiniz."], [33.0, "Allah'ın izniyle, (Allah'tan) yardım dileyerek bu derste ikinci kırkın şerhine başlıyoruz;"], [39.0, "birinci külliye ile başlıyoruz: <b>Akîde meselelerindeki her çoğulculuk (taaddüdiyye) reddedilmiştir.<\/b> (İki kez tekrar ediyor.) Tekrar etmemi ister misiniz? Anlaşıldı mı? Peki."]]}, {"reader": false, "ar": [[78.0, "أقول وبالله التوفيق: اعلم ـ رحمنا الله وإياك ـ أن التعددية لا تخلو من قسمين:"], [86.0, "تعدديةٍ عقدية، وتعدديةٍ فقهية."], [94.0, "فنحن ـ معاشرَ أهل السنة والجماعة ـ نقبل التعددية الفقهية فقط؛"], [101.0, "فلا بأس أن تكون المذاهب الفقهية أربعةً أو أقلَّ أو أكثر،"], [107.0, "كلُّ ذلك سائغٌ جائز،"], [109.0, "لا تحريمَ ولا منعَ فيه،"], [111.5, "ولله الحمد والمنّة. وهذا بإجماع أهل الإسلام؛"], [117.0, "فإن أهل الإسلام لا يزالون يُقرّون التعددية الفقهية،"], [124.0, "كإقرارهم جوازَ التفقّه على واحدٍ من المذاهب الأربعة."]], "tr": [[78.0, "Tevfik Allah'tandır, derim ki: Bil ki —Allah bize ve sana rahmet etsin— çoğulculuk iki kısımdan hâli değildir:"], [86.0, "itikadî çoğulculuk ve fıkhî çoğulculuk."], [86.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğu yalnızca fıkhî çoğulculuğu kabul ederiz."], [94.0, "Fıkhî mezheplerin dört ya da daha az veya daha çok olmasında bir sakınca yoktur;"], [101.0, "bunların hepsi makul ve caizdir, onda ne haramlık ne de yasak vardır;"], [109.0, "hamd ve minnet Allah'a mahsustur."], [111.5, "Bu, İslâm ehlinin icmâıyla sabittir."], [111.5, "Çünkü İslâm ehli, dört mezhepten biri üzerine fıkıh öğrenmenin caiz olduğunu kabul ettikleri gibi fıkhî çoğulculuğu da kabul etmeye devam etmektedir."]]}, {"reader": false, "ar": [[131.0, "فمن أراد أن يكون على مذهب الإمام مالكٍ رحمه الله فله ذلك،"], [137.0, "أو مذهب الإمام أبي حنيفة رحمه الله فله ذلك،"], [141.0, "أو مذهب الإمام الشافعي والإمام أحمد رحمهما الله فله ذلك،"], [150.0, "ومن أراد أن يكون على مذهب الظاهرية فله ذلك."], [155.0, "فأنت مخيَّرٌ في طريق التفقّه بين هذه المذاهب،"], [163.0, "إلا أنها تبقى عندنا تعدديةً في أمرٍ فقهي."], [169.0, "فالتعددية الفقهية ليست بممنوعةٍ عندنا معاشرَ أهل السنة والجماعة."]], "tr": [[131.0, "İmam Mâlik'in (rahimehullah) mezhebi üzere olmak isteyen için bu hakkıdır;"], [137.0, "İmam Ebû Hanîfe'nin (rahimehullah) mezhebi de öyle;"], [137.0, "İmam Şâfiî ve İmam Ahmed'in (rahimehumallah) mezhebi de öyle."], [141.0, "Zâhirîlerin mezhebi üzere olmak isteyen için de bu hakkıdır."], [150.0, "Fıkıh öğrenme yolunda bu mezhepler arasında seçim yapmakta serbestsin."], [155.0, "Ancak bu, bizde fıkhî bir işteki çoğulculuk olarak kalır."], [169.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğu nezdinde fıkhî çoğulculuk yasak değildir."]]}, {"reader": false, "ar": [[175.0, "وأما القسم الثاني فهو التعددية العقدية،"], [181.0, "فهذه مرفوضةٌ بإجماع أهل السنة والجماعة؛"], [186.0, "وذلك لأن الأدلة شهدت بأن الحقَّ في أمور الاعتقاد واحد،"], [196.0, "وأن الجميع يجب عليه أن يعتقد هذا الحق،"], [201.0, "وأن كلَّ من اعتقد غيره فإنه آثمٌ وضالٌّ وصاحبُ عقيدةٍ فاسدة."], [212.0, "فيجب على أمة محمدٍ صلى الله عليه وسلم كلِّها أن تعتقد مذهبَ ـ المذهبَ الحق:"], [222.0, "فإن كانوا من أمة الدعوة فيجب عليهم أن يُسلموا،"], [227.0, "وإن كانوا من أهل الإسلام فيجب عليهم أن يتديّنوا بمذهب أهل السنة والجماعة."]], "tr": [[175.0, "İkinci kısım ise itikadî çoğulculuktur;"], [175.0, "bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyla reddedilmiştir."], [186.0, "Çünkü deliller, itikad meselelerinde hakkın bir olduğuna, herkesin bu hakka inanmasının vacip olduğuna ve ondan başkasına inanan herkesin günahkâr, sapkın ve fâsid akîde sahibi olduğuna şahitlik etmiştir."], [212.0, "Muhammed ﷺ'in bütün ümmetinin hak mezhebe inanması vaciptir:"], [222.0, "Davet ümmetinden iseler Müslüman olmaları, İslâm ehlinden iseler Ehl-i Sünnet ve'l-Cemaat mezhebini din edinmeleri vaciptir."]]}, {"reader": false, "ar": [[234.0, "فإن قلت: وما دليلك على أن التعددية العقدية مرفوضة؟"], [241.0, "فأقول: دليلي على ذلك عدّةُ أدلة:"], [245.0, "منها قول الله عز وجل في السورة التي نردّدها كلَّ صباحٍ ومساء:"], [251.0, "<span class=\"ayah\">﴿اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ﴾<\/span> <span class=\"ref\">[الفاتحة: ٦]<\/span>، فصراطُ الحقِّ واحدٌ لا يتعدّد."], [259.0, "ونحن ندعو الله عز وجل أن يهدينا هذا الصراط الذي بيّنه الله عز وجل بقوله:"], [268.0, "<span class=\"ayah\">﴿فَأُولَٰئِكَ مَعَ الَّذِينَ أَنْعَمَ اللَّهُ عَلَيْهِم مِّنَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ وَالصَّالِحِينَ ۚ وَحَسُنَ أُولَٰئِكَ رَفِيقًا﴾<\/span> <span class=\"ref\">[النساء: ٦٩]<\/span>."]], "tr": [[234.0, "\"İtikadî çoğulculuğun reddedildiğine delilin nedir?\" dersen, derim ki:"], [241.0, "Buna delilim birkaç delildir. Bunlardan biri, Allah Teâlâ'nın her sabah ve akşam tekrarladığımız sûredeki şu sözüdür:"], [251.0, "<span class=\"ayah\">﴿Bizi dosdoğru yola ilet﴾<\/span> [Fâtiha 6]."], [251.0, "Hak yol birdir, çoğalmaz. Biz Allah Teâlâ'ya, O'nun şu sözüyle açıkladığı bu yola bizi iletmesi için dua ediyoruz:"], [268.0, "<span class=\"ayah\">﴿İşte onlar, Allah'ın kendilerine nimet verdiği peygamberler, sıddîklar, şehitler ve salihlerle beraberdir. Bunlar ne güzel arkadaştır!﴾<\/span> [Nisâ 69]."]]}, {"reader": false, "ar": [[278.0, "فكلُّ صراطٍ غيرِ هذا الصراط فإنه صراطُ غوايةٍ،"], [285.0, "وصراطُ ضلالٍ وتيهٍ ومخالفة،"], [290.0, "كما قال الله عز وجل بعد أن ذكر الصراط المستقيم:"], [295.0, "<span class=\"ayah\">﴿غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ﴾<\/span> <span class=\"ref\">[الفاتحة: ٧]<\/span>،"], [298.0, "ولم يصف صراطَ المغضوب عليهم"]], "tr": [[278.0, "Bu yoldan başka her yol, azgınlık yolu, sapıklık, şaşkınlık ve muhalefet yoludur."], [285.0, "Nitekim Allah Teâlâ dosdoğru yolu zikrettikten sonra şöyle buyurmuştur:"], [295.0, "<span class=\"ayah\">﴿Gazaba uğrayanların ve sapıtanların (yoluna) değil﴾<\/span> [Fâtiha 7]. Gazaba uğrayanların —"]]}]}, {"ts": "05:00", "title": "1. Külliye (devam): Hak yolun tek olduğuna dair deliller", "paras": [{"reader": false, "ar": [[303.0, "والضالين بوصف الصراط، لأنهم ليسوا على صراطٍ صحيح،"], [307.0, "لأنهم ليسوا على صراطٍ صحيح."], [313.0, "ومثلُها قول الله عز وجل:"], [315.0, "<span class=\"ayah\">﴿وَأَنَّ هَٰذَا صِرَاطِي مُسْتَقِيمًا فَاتَّبِعُوهُ ۖ وَلَا تَتَّبِعُوا السُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِ﴾<\/span> <span class=\"ref\">[الأنعام: ١٥٣]<\/span>."], [326.0, "فهذا دليلٌ على أن التعددية العقدية مرفوضةٌ عند الله عز وجل وعند عباده المؤمنين."], [334.0, "إنما صراطُ الحقِّ الذي لا نجاةَ إلا بسلوكه وامتثاله واعتقاده هو صراطٌ واحد،"], [343.2, "وهو صراط أهل السنة والجماعة."], [350.0, "وأما ما عداها من السبل فقد نهانا الله عز وجل عن اتّباعها،"], [356.0, "لأنها طريقُ ـ أو طرقُ ـ غوايةٍ وطرقُ ضلال."]], "tr": [[303.0, "— ve sapıtanların yolunu \"yol\" (sırât) vasfıyla nitelememiştir;"], [307.0, "çünkü onlar sahih bir yol üzere değildir."], [313.0, "(Tekrar ediyor.) Allah Teâlâ'nın şu sözü de böyledir:"], [315.0, "<span class=\"ayah\">﴿Şüphesiz bu, benim dosdoğru yolumdur; ona uyun. Başka yollara uymayın; yoksa sizi O'nun yolundan ayırır﴾<\/span> [En'âm 153]."], [315.0, "Bu, itikadî çoğulculuğun Allah Teâlâ nezdinde ve O'nun mümin kulları nezdinde reddedildiğinin delilidir."], [326.0, "Ancak ona girmek, ona uymak ve ona inanmakla kurtuluş olan hak yol tek bir yoldur;"], [334.0, "o da Ehl-i Sünnet ve'l-Cemaat'in yoludur."], [343.2, "Onun dışındaki yollara gelince, Allah Teâlâ bizi onlara uymaktan nehyetmiştir;"], [350.0, "çünkü onlar azgınlık yolu —ya da yolları— ve sapıklık yollarıdır."]]}, {"reader": false, "ar": [[363.0, "ومنها أيضًا قول الله عز وجل:"], [367.0, "<span class=\"ayah\">﴿وَمَن يُشَاقِقِ الرَّسُولَ مِن بَعْدِ مَا تَبَيَّنَ لَهُ الْهُدَىٰ وَيَتَّبِعْ غَيْرَ سَبِيلِ الْمُؤْمِنِينَ﴾<\/span>."], [377.0, "فهذا دليلٌ على أن السبيل الذي يجب اتّباعه إنما هو سبيلٌ واحد،"], [385.0, "وهو صراط الله عز وجل الذي دلّنا عليه النبي صلى الله عليه وسلم،"], [393.0, "واعتقده عبادُ الله المؤمنون."], [396.0, "فمن ابتغى سبيلًا غيرَ هذا السبيل فإن الله عز وجل قد توعّده بقوله:"], [404.0, "<span class=\"ayah\">﴿نُوَلِّهِ مَا تَوَلَّىٰ وَنُصْلِهِ جَهَنَّمَ ۖ وَسَاءَتْ مَصِيرًا﴾<\/span> <span class=\"ref\">[النساء: ١١٥]<\/span>."], [410.0, "فلا يقبل الله عز وجل سلوكَ طريقٍ إلا هذا الطريقَ فقط؛"], [415.0, "فالتعددية العقدية مرفوضةٌ عند الله عز وجل."]], "tr": [[363.0, "Bunlardan biri de Allah Teâlâ'nın şu sözüdür:"], [367.0, "<span class=\"ayah\">﴿Kim kendisine hidayet apaçık belli olduktan sonra Resûl'e karşı çıkar ve müminlerin yolundan başka bir yola uyarsa﴾<\/span>."], [367.0, "Bu, uyulması vacip olan yolun tek bir yol olduğunun delilidir;"], [377.0, "o da Nebî ﷺ'in bize gösterdiği ve Allah'ın mümin kullarının inandığı Allah Teâlâ'nın yoludur."], [393.0, "Kim bu yoldan başka bir yol ararsa, Allah Teâlâ onu şu sözüyle tehdit etmiştir:"], [396.0, "<span class=\"ayah\">﴿Onu döndüğü yöne döndürürüz ve cehenneme sokarız; o ne kötü bir varış yeridir!﴾<\/span> [Nisâ 115]."], [404.0, "Allah Teâlâ sadece bu yoldan başka bir yola girilmesini kabul etmez."], [410.0, "Dolayısıyla itikadî çoğulculuk Allah Teâlâ nezdinde reddedilmiştir."]]}, {"reader": false, "ar": [[419.0, "ومنها قول الله عز وجل:"], [422.0, "<span class=\"ayah\">﴿فَإِنْ آمَنُوا بِمِثْلِ مَا آمَنتُم بِهِ فَقَدِ اهْتَدَوا﴾<\/span> <span class=\"ref\">[البقرة: ١٣٧]<\/span>."], [429.0, "فهذا دليلٌ على أن طريق الإيمان طريقٌ واحد،"], [434.0, "وهو أن تؤمن الأمةُ بما آمن به أصحاب محمدٍ صلى الله عليه وسلم."], [440.0, "فكلُّ من آمن أو اعتقد شيئًا خلافَ ما عليه أصحاب النبي صلى الله عليه وسلم فالله عز وجل ينفي عنه صفة الهداية بمفهوم المخالفة من قوله:"], [455.8, "«فقد اهتدوا». فيُفهم منها أنهم إن آمنوا بشيءٍ آخر لم تؤمنوا به،"], [463.4, "واعتقدوا أمورًا أخرى لم تعتقدوها،"], [466.6, "وسلكوا سبلًا أخرى غيرَ سبيلكم،"], [469.8, "فإنهم على غوايةٍ وضلال."]], "tr": [[419.0, "Bunlardan biri de Allah Teâlâ'nın şu sözüdür:"], [422.0, "<span class=\"ayah\">﴿Eğer onlar da sizin inandığınız gibi inanırlarsa, doğru yolu bulmuş olurlar﴾<\/span> [Bakara 137]."], [429.0, "Bu, iman yolunun tek bir yol olduğunun delilidir;"], [434.0, "o da ümmetin, Muhammed ﷺ'in ashâbının inandığı şeye inanmasıdır."], [434.0, "Nebî ﷺ'in ashâbının üzerinde olduğu şeye aykırı bir şeye iman eden veya inanan herkesten Allah Teâlâ, \"doğru yolu bulmuş olurlar\" sözünün mefhûm-i muhalifiyle hidayet vasfını nefyetmektedir."], [455.8, "Buradan şu anlaşılır: Eğer sizin inanmadığınız başka bir şeye iman eder, sizin inanmadığınız başka şeylere inanır ve sizin yolunuzdan başka yollara girerlerse, azgınlık ve sapıklık üzeredirler."]]}, {"reader": false, "ar": [[474.0, "فهذا دليلٌ على أن الحقَّ في العقائد واحدٌ لا يتعدّد."], [480.5, "ومنها قول الله عز وجل:"], [483.8, "<span class=\"ayah\">﴿فَمَاذَا بَعْدَ الْحَقِّ إِلَّا الضَّلَالُ﴾<\/span> <span class=\"ref\">[يونس: ٣٢]<\/span>."], [487.0, "فإذا كان طريقُ رسول الله صلى الله عليه وسلم،"], [492.3, "وطريقُ صحابته الكرام وأهلِ السنة والجماعة هو الحق،"], [497.0, "فجميع الطرق الأخرى لا توصف إلا بأنها ضلال،"], [503.0, "لأن الحق واحدٌ لا يتعدّد."], [506.0, "فلا يمكن أن يوصف الحقُّ ونقيضُه بوصفٍ واحد،"], [512.0, "وإنما الحقُّ يوصف بالأحقّية،"], [516.0, "ونقيضُه يوصف بالبطلان. <span class=\"ayah\">﴿فَمَاذَا بَعْدَ الْحَقِّ إِلَّا الضَّلَالُ﴾<\/span>."]], "tr": [[474.0, "Bu, akîdelerde hakkın bir olduğunun, çoğalmadığının delilidir."], [480.5, "Bunlardan biri de Allah Teâlâ'nın şu sözüdür:"], [483.8, "<span class=\"ayah\">﴿Haktan sonra sapıklıktan başka ne vardır?﴾<\/span> [Yûnus 32]."], [487.0, "Resûlullah ﷺ'in yolu, değerli sahabesinin ve Ehl-i Sünnet ve'l-Cemaat'in yolu hak olduğuna göre, diğer bütün yollar ancak sapıklık olarak nitelenebilir;"], [503.0, "çünkü hak birdir, çoğalmaz. Hakkın ve zıddının tek bir vasıfla nitelenmesi mümkün değildir."], [512.0, "Hak, hak oluşla nitelenir; zıddı ise bâtıllıkla nitelenir."], [516.0, "<span class=\"ayah\">﴿Haktan sonra sapıklıktan başka ne vardır?﴾<\/span>"]]}, {"reader": false, "ar": [[523.0, "وكذلك قول الله عز وجل:"], [526.0, "<span class=\"ayah\">﴿لَكُمْ دِينُكُمْ﴾<\/span> ـ أي عقيدتُكم ومذهبُكم ـ <span class=\"ayah\">﴿وَلِيَ دِينِ﴾<\/span> <span class=\"ref\">[الكافرون: ٦]<\/span>."], [536.0, "ودينُ نبيِّ الله صلى الله عليه وسلم هو الدين الحق؛"], [540.0, "فلو أن دينهم كان حقًّا لم يُحتَجْ أن يقال لهم هذه المقولة."], [548.0, "لكن لما كان غيرُ دين الرسول هو الباطل،"], [552.0, "أمره الله عز وجل أن يُعلنها صريحةً:"], [557.0, "أنّ لكم ما تولّيتم من مذاهبكم الباطلة،"], [560.0, "ولي ما اختاره الله لي عز وجل من العقيدة الصحيحة."], [566.0, "فالحقُّ لا يتعدّد في أمور الاعتقاد أبدًا،"], [569.0, "ولا يحلّ لأحدٍ أن يسلك غيرَ طريق الكتاب والسنة المفهومِ بفهم سلف الأمة."]], "tr": [[523.0, "Allah Teâlâ'nın şu sözü de böyledir:"], [526.0, "<span class=\"ayah\">﴿Sizin dininiz size﴾<\/span> —yani akîdeniz ve mezhebiniz— <span class=\"ayah\">﴿benim dinim banadır﴾<\/span> [Kâfirûn 6]."], [536.0, "Allah'ın Nebîsi ﷺ'in dini hak dindir."], [536.0, "Eğer onların dini hak olsaydı, onlara bu sözün söylenmesine ihtiyaç duyulmazdı."], [540.0, "Ama Resûl'ün dininden başkası bâtıl olunca, Allah Teâlâ ona bunu açıkça ilan etmesini emretti:"], [552.0, "Yöneldiğiniz bâtıl mezhepleriniz sizin olsun;"], [557.0, "Allah Teâlâ'nın benim için seçtiği sahih akîde de benimdir."], [560.0, "İtikad meselelerinde hak asla çoğalmaz."], [566.0, "Hiç kimsenin, ümmetin selefinin anlayışıyla anlaşılan Kitap ve Sünnet yolundan başkasına girmesi helal değildir."]]}, {"reader": false, "ar": [[581.0, "وكذلك ثبت عن النبي صلى الله عليه وسلم أنه خطّ خطًّا مستقيمًا وقال:"], [592.7, "«هذه سبيلُ الله»، وخطّ عن يمينه وشماله خطوطًا"]], "tr": [[581.0, "Aynı şekilde Nebî ﷺ'den sabit olmuştur ki o, dümdüz bir çizgi çizdi ve \"Bu, Allah'ın yoludur\" dedi;"], [592.7, "sağına ve soluna da çizgiler çizdi —"]]}]}, {"ts": "10:00", "title": "1. Külliye (devam): Yetmiş üç fırka, din hürriyeti ve \"her müctehid isabetlidir\" sözü", "paras": [{"reader": false, "ar": [[600.0, "وقال: «هذه سُبُل، وعلى كلِّ سبيلٍ منها شيطانٌ يدعو إليها»،"], [608.0, "ثم تلا: <span class=\"ayah\">﴿وَأَنَّ هَٰذَا صِرَاطِي مُسْتَقِيمًا فَاتَّبِعُوهُ ۖ وَلَا تَتَّبِعُوا السُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِ﴾<\/span>."], [615.0, "فهذا دليلٌ على أن الحقَّ في مسائل الاعتقاد واحدٌ لا يتعدّد،"], [620.0, "وأن كلَّ من سلك غيرَ طريق هذا الحق فإنه على غوايةٍ وضلال."]], "tr": [[600.0, "— ve \"Bunlar (başka) yollardır;"], [600.0, "bunların her birinin üzerinde ona çağıran bir şeytan vardır\" dedi."], [608.0, "Sonra şu ayeti okudu: <span class=\"ayah\">﴿Şüphesiz bu, benim dosdoğru yolumdur; ona uyun. Başka yollara uymayın; yoksa sizi O'nun yolundan ayırır﴾<\/span>."], [608.0, "Bu, itikad meselelerinde hakkın bir olduğunun, çoğalmadığının ve bu hakkın yolundan başkasına giren herkesin azgınlık ve sapıklık üzere olduğunun delilidir."]]}, {"reader": false, "ar": [[629.0, "ويوضّح ذلك أكثرَ قولُ النبي صلى الله عليه وسلم في بيان رفض التعددية العقدية،"], [637.4, "في الحديث الذي يصحّ بمجموع طرقه:"], [641.0, "«وستفترق هذه الأمة على ثلاثٍ وسبعين فرقة، كلُّها في النار»."], [649.0, "فاستحقاق هذه الفرق للنار دليلٌ على أن التعددية العقدية مرفوضةٌ عندنا معاشرَ أهل السنة والجماعة."], [663.0, "ثم قال: «إلا واحدة»،"], [665.0, "قالوا: من يا رسول الله؟"], [667.5, "قال: «ما أنا عليه وأصحابي»."]], "tr": [[629.0, "Bunu daha da açıklayan, Nebî ﷺ'in itikadî çoğulculuğun reddini beyan ederken, turuklarının toplamıyla sahih olan hadisteki şu sözüdür:"], [637.4, "\"Bu ümmet yetmiş üç fırkaya ayrılacak, hepsi ateştedir.\" Bu fırkaların ateşi hak etmesi, itikadî çoğulculuğun biz Ehl-i Sünnet ve'l-Cemaat topluluğu nezdinde reddedildiğinin delilidir."], [649.0, "Sonra \"Biri hariç\" dedi. \"Kimdir o, ey Allah'ın Resûlü?\" dediler."], [665.0, "\"Benim ve ashâbımın üzerinde olduğu şey(i izleyenler)\" dedi."]]}, {"reader": false, "ar": [[670.0, "فلو كان لكلِّ إنسانٍ أن يختار عقيدته كما يشاء،"], [675.5, "لَما استحقّ بعد هذا الاختيار الجائز أن يُتوعَّد بالنار،"], [681.0, "لأنه إنما فعل شيئًا جائزًا،"], [683.9, "ومن فعل الجائز فإنه ليس بموعودٍ بالعقوبة."], [688.0, "لكن لما توعّد الله من اختار غيرَ طريق الحقِّ عقيدةً ومذهبًا بالنار،"], [697.0, "دلّ ذلك على أن التعددية العقدية غيرُ مقبولةٍ عندنا."]], "tr": [[670.0, "Eğer her insanın akîdesini dilediği gibi seçme hakkı olsaydı, bu caiz seçimden sonra ateşle tehdit edilmeyi hak etmezdi;"], [675.5, "çünkü o sadece caiz bir şey yapmıştır, caiz olanı yapan da cezayla tehdit edilmez."], [683.9, "Ama Allah, akîde ve mezhep olarak hak yoldan başkasını seçeni ateşle tehdit edince, bu, itikadî çoğulculuğun bizde kabul edilmediğini gösterdi."]]}, {"reader": false, "ar": [[702.0, "وبناءً على ذلك فنحن نرفض ما يسمّى بحرية الأديان،"], [709.0, "وأنّ لكل إنسانٍ أن يختار من الدين ما يشاء:"], [714.0, "فمن أراد أن يكون يهوديًّا فليكن،"], [718.0, "ومن شاء أن يكون نصرانيًّا فليكن،"], [722.0, "ومن شاء أن يكون بوذيًّا أو سيخيًّا فليكن."], [726.0, "هذا على مستوى أمة الإجابة والدعوة."], [730.0, "فهذه الدعوة دعوةٌ فاجرةٌ وظالمةٌ وآثمةٌ وكفرية،"], [737.0, "ومن اعتقد صحّتها فهو كافرٌ باتفاق المسلمين؛"], [742.0, "لأن كلَّ من صحّح دين الكفار فإنه يُعتبر كافرًا،"], [750.0, "لمناقضته للمتواتر من أدلة الكتاب والسنة،"], [757.0, "ولِما أجمع عليه العلماء الإجماعَ القطعيَّ من أن كلَّ من شكّ في كفر الكفار،"], [763.6, "أو صحّح مذهبهم، أو أجاز التعبّد لله على مقتضى عقائدهم،"], [769.4, "فإنه يُعتبر كافرًا خالعًا رِبقةَ الإسلام من عنقه بالكلّيّة."]], "tr": [[702.0, "Buna dayanarak biz \"din hürriyeti\" denilen şeyi ve her insanın dinden dilediğini seçebileceği fikrini reddederiz:"], [714.0, "Yahudi olmak isteyen olsun, Hristiyan olmak isteyen olsun, Budist veya Sih olmak isteyen olsun (denmesini)."], [722.0, "Bu, icâbet ve davet ümmeti düzeyindedir."], [726.0, "Bu çağrı, günahkâr, zalim, vebal getiren ve küfrî bir çağrıdır."], [730.0, "Onun doğruluğuna inanan, Müslümanların ittifakıyla kâfirdir."], [737.0, "Çünkü kâfirlerin dinini doğru sayan herkes kâfir kabul edilir;"], [742.0, "zira Kitap ve Sünnet'in mütevâtir delillerine ve âlimlerin kat'î icmâına aykırıdır:"], [757.0, "Kâfirlerin küfründen şüphe eden, mezheplerini doğru sayan veya onların akîdelerinin gereğine göre Allah'a ibadet etmeyi caiz gören herkes, İslâm bağını boynundan tamamen çıkarmış bir kâfir sayılır."]]}, {"reader": false, "ar": [[775.0, "وكذلك أيضًا نرفض الدعوة إلى حرية الطائفية المذهبية،"], [780.4, "وهذا على مستوى أمة الإجابة:"], [786.0, "فمن شاء أن يكون رافضيًّا فليكن،"], [789.0, "ومن شاء أن يكون صوفيًّا فليكن،"], [792.0, "ومن شاء أن يكون مرجئًا أو جبريًّا أو قدريًّا فليكن،"], [797.0, "لا حقَّ لكم أن تغصبوا الناس،"], [800.0, "ولا أن تُكرهوهم، ولا أن تُلزموهم على أن يكونوا على مذهبٍ واحد."], [806.0, "فتلك الدعاوى كلُّها من الدعاوى التي تفتح على الأمة أبواب جهنم،"], [812.0, "لأنهم يدعونهم إلى الضلال،"], [814.7, "وإلى التيه والحيرة ومخالفة السنة،"], [818.1, "وإلى البدع والمحدثات. فكلُّ هذه الدعاوى مرفوضة:"], [823.6, "فالدعوة إلى الكفر مرفوضة،"], [826.1, "والدعوة إلى انتحال البدعة أيضًا مرفوضة."]], "tr": [[775.0, "Aynı şekilde mezhebî taifecilik hürriyetine çağrıyı da reddederiz;"], [780.4, "bu da icâbet ümmeti düzeyindedir:"], [786.0, "Râfızî olmak isteyen olsun, Sûfî olmak isteyen olsun, Mürcie, Cebriyye veya Kaderiyye'den olmak isteyen olsun;"], [792.0, "insanları zorlamaya, onları mecbur etmeye ve tek bir mezhep üzere olmaya zorunlu tutmaya hakkınız yok (denmesini)."], [800.0, "Bu iddiaların hepsi ümmete cehennemin kapılarını açan iddialardır;"], [806.0, "çünkü insanları sapıklığa, şaşkınlığa, hayrete, Sünnet'e muhalefete, bid'atlara ve sonradan çıkarılmış şeylere çağırırlar."], [818.1, "Bu iddiaların hepsi reddedilmiştir: Küfre çağrı reddedilmiştir;"], [826.1, "bid'atı benimsemeye çağrı da reddedilmiştir."]]}, {"reader": false, "ar": [[830.0, "فإن قلت: أوَلم يقرّر الأصوليون بأن كلَّ مجتهدٍ مصيب؟"], [839.0, "الجواب: هذه اللفظة مجملة،"], [841.9, "فيها حقٌّ وفيها باطل."], [846.0, "فليس كلُّ مجتهدٍ مصيبًا باعتبار موافقة الحق عند الله عز وجل؛"], [856.0, "فكم من إنسانٍ يجتهد في شيءٍ ثم تكون نتائج اجتهاده مخالفةً للحق عند الله."], [863.0, "وكلُّ مجتهدٍ مصيبٌ باعتبار سلوك طريق الاجتهاد والبحث عن الحق؛"], [875.0, "فهو مصيبٌ في بحثه عن الحق،"], [878.0, "ولكن ليس بالضرورة أن يكون مصيبًا في إصابة الحق."], [884.0, "فلا نقول بأن كلَّ مجتهدٍ مصيبٌ مطلقًا،"], [889.0, "ولا أن كلَّ مجتهدٍ مخطئٌ مطلقًا،"], [893.0, "وإنما لا بدّ من التفصيل:"], [895.0, "فكلُّ مجتهدٍ مصيبٌ باعتبار سلوك الطريق في الاجتهاد،"]], "tr": [[830.0, "\"Usûlcüler 'Her müctehid isabetlidir' diye takrir etmediler mi?\" dersen, cevap:"], [839.0, "Bu lafız mücmeldir; içinde hak da var bâtıl da."], [841.9, "Allah Teâlâ nezdindeki hakka uygunluk bakımından her müctehid isabetli değildir;"], [846.0, "nice insan bir şeyde içtihat eder, sonra içtihadının sonuçları Allah nezdindeki hakka aykırı olur."], [863.0, "İçtihat yoluna girme ve hakkı arama bakımından ise her müctehid isabetlidir;"], [863.0, "o, hakkı aramasında isabetlidir, ama hakka isabet etmede isabetli olması zorunlu değildir."], [878.0, "\"Her müctehid mutlak olarak isabetlidir\" de demeyiz, \"her müctehid mutlak olarak hatalıdır\" da demeyiz;"], [893.0, "tafsil (ayrıntılandırma) şarttır: İçtihatta yola girme bakımından her müctehid isabetlidir —"]]}]}, {"ts": "15:00", "title": "1. Külliye (devam): \"Nisbî hak\" çağrısına karşı uyarı", "paras": [{"reader": false, "ar": [[903.0, "وليس كلُّ مجتهدٍ مصيبًا باعتبار إصابة الحق في نتائج اجتهاداته."], [910.0, "وهناك دعوةٌ لا بدّ من تحذير الأمة منها،"], [918.0, "وهي دعوةُ «الحقِّ النسبي»،"], [921.0, "بمعنى أنه ليس هناك مذهبٌ ولا طائفةٌ تعتمد الحقَّ كلَّه،"], [930.0, "بل في كلِّ مذهبٍ من المذاهب شيءٌ من الحق وشيءٌ من الباطل؛"], [935.0, "فإذا تكاملت المذاهب كلُّها حصّلنا الحقَّ كلَّه،"], [942.0, "وإذا فرّقنا بين المذاهب ضيّعنا بعض الحق الذي في هذه المذاهب."], [949.0, "وهذه كلمةٌ إبليسيةٌ فاجرة."]], "tr": [[903.0, "— ama içtihatlarının sonuçlarında hakka isabet etme bakımından her müctehid isabetli değildir."], [910.0, "Ümmetin kendisinden sakındırılması gereken bir çağrı daha vardır:"], [918.0, "\"nisbî (göreceli) hak\" çağrısı. Yani hakkın tamamına dayanan ne bir mezhep ne de bir taife vardır;"], [930.0, "bilakis mezheplerin her birinde haktan bir şey ve bâtıldan bir şey vardır;"], [930.0, "bütün mezhepler birbirini tamamlarsa hakkın tamamını elde ederiz, mezhepleri birbirinden ayırırsak bu mezheplerdeki hakkın bir kısmını kaybederiz (derler)."], [949.0, "Bu, iblisçe ve günahkâr bir sözdür."]]}, {"reader": false, "ar": [[953.0, "فإن قلت: ولماذا؟ أقول:"], [955.5, "لأن مذهب أهل السنة هو الحقُّ المطلق،"], [960.0, "وما عداه من المذاهب ففيها شيءٌ من الحق وفيها شيءٌ من الباطل."], [966.0, "فإدخالُ مذهب أهل السنة مع سائر المذاهب في بعضية الحق وبعضية الباطل هذا تلبيسٌ وتدليس."], [975.0, "كما نقوله في الإسلام وغيره من الأديان:"], [982.0, "فالحقُّ المطلق في الإسلام،"], [985.0, "لكن اليهودية فيها شيءٌ من الحق وفيها كثيرٌ من الباطل،"], [993.1, "والنصرانية فيها شيءٌ من الحق وفيها كثيرٌ من الباطل،"], [998.0, "أما دين الإسلام فهو الحقُّ المطلق."]], "tr": [[953.0, "\"Neden?\" dersen, derim ki: Çünkü Ehl-i Sünnet'in mezhebi mutlak haktır;"], [955.5, "onun dışındaki mezheplerde ise haktan bir şey ve bâtıldan bir şey vardır."], [960.0, "Ehl-i Sünnet mezhebini diğer mezheplerle birlikte \"hakkın bir kısmı ve bâtılın bir kısmı\" içine sokmak bir karıştırma ve hilekârlıktır."], [975.0, "Bunu İslâm ve diğer dinler hakkında da söyleriz:"], [982.0, "Mutlak hak İslâm'dadır; Yahudilikte haktan bir şey ve bâtıldan çok şey vardır, Hristiyanlıkta haktan bir şey ve bâtıldan çok şey vardır;"], [998.0, "İslâm dinine gelince, o mutlak haktır."]]}, {"reader": false, "ar": [[1001.6, "فكما نقوله في الإسلام مقارنةً بالأديان الأخرى،"], [1006.1, "نقوله في مذهب أهل السنة والجماعة مقارنًا بالطوائف الأخرى:"], [1013.5, "فالأحقّية النسبية إنما هي في الطوائف (الأخرى)،"], [1019.0, "وأما الأحقّية المطلقة فإنها في مذهب أهل السنة والجماعة."], [1024.0, "فيريدون منا ـ تلبيسًا وزخرفةً وخداعًا ـ أن نُدخل الإسلام مع سائر المذاهب في الأحقّية النسبية،"], [1036.0, "لنُجيز التديّن بأيّ مذهبٍ كان."], [1040.0, "ويريدون منا ـ تلبيسًا وزخرفةً ومخادعةً ـ أن نُدخل مذهب أهل السنة والجماعة في الأحقّية النسبية،"], [1053.0, "لنُجيز اعتقاد أيِّ طائفةٍ من الطوائف الأخرى."]], "tr": [[1001.6, "Diğer dinlere kıyasla İslâm hakkında ne söylüyorsak, diğer taifelere kıyasla Ehl-i Sünnet ve'l-Cemaat mezhebi hakkında da onu söyleriz:"], [1013.5, "Nisbî haklılık ancak (diğer) taifelerdedir;"], [1013.5, "mutlak haklılık ise Ehl-i Sünnet ve'l-Cemaat mezhebindedir."], [1019.0, "Karıştırma, süsleme ve aldatma yoluyla bizden, herhangi bir mezhebi din edinmeyi caiz görelim diye İslâm'ı diğer mezheplerle birlikte nisbî haklılığa sokmamızı istiyorlar."], [1036.0, "Yine karıştırma, süsleme ve aldatma yoluyla bizden, diğer taifelerden herhangi birinin akîdesini caiz görelim diye Ehl-i Sünnet ve'l-Cemaat mezhebini nisbî haklılığa sokmamızı istiyorlar."]]}, {"reader": false, "ar": [[1059.0, "ولذلك فالأحقّية بالنسبة للإسلام هي الأحقّية المطلقة،"], [1064.0, "وبالنسبة للأديان الأخرى هي الأحقّية النسبية."], [1068.0, "والأحقّية بالنسبة لمذهب أهل السنة والجماعة هي الأحقّية المطلقة،"], [1076.0, "وبالنسبة للمذاهب الأخرى هي مطلقُ الأحقّية،"], [1080.0, "أي الأحقّية النسبية. أفهمتم؟"], [1085.0, "لأن الحقَّ في المسائل العقدية واحد،"], [1089.0, "ولا نقبل تعدّديته مطلقًا."], [1091.0, "والله أعلم. فهمتم هذا إن شاء الله؟ طيب."]], "tr": [[1059.0, "Bu yüzden İslâm açısından haklılık mutlak haklılıktır;"], [1059.0, "diğer dinler açısından ise nisbî haklılıktır."], [1064.0, "Ehl-i Sünnet ve'l-Cemaat mezhebi açısından haklılık mutlak haklılıktır;"], [1068.0, "diğer mezhepler açısından ise \"haklılığın mutlakı\" (bir miktar haklılık), yani nisbî haklılıktır."], [1080.0, "Anladınız mı? Çünkü itikadî meselelerde hak birdir;"], [1085.0, "onun çoğalmasını asla kabul etmeyiz."], [1089.0, "Allah en iyisini bilir. İnşallah bunu anladınız mı? Peki."]]}]}, {"ts": "18:18", "title": "2. Külliye: Telakki kaynaklarında Ehl-i Sünnet'e muhalefet eden onlardan değildir", "paras": [{"reader": false, "ar": [[1098.0, "الكلية الثانية: <b>كلُّ من خالف أهل السنة في مصادر التلقّي فليس منهم.<\/b> كلُّ من خالف أهل السنة في مصادر التلقّي فليس منهم."], [1118.0, "وهذه الكلية والتي بعدها والتي بعدها تبيّن لنا الأمور التي يخرج بها الإنسان عن دائرة أهل السنة والجماعة."]], "tr": [[1098.0, "İkinci külliye: <b>Telakki (bilgiyi alma) kaynaklarında Ehl-i Sünnet'e muhalefet eden herkes onlardan değildir.<\/b> (Tekrar ediyor.) Bu külliye ile ondan sonraki ve ondan sonraki külliye, insanın Ehl-i Sünnet ve'l-Cemaat dairesinden çıkmasına sebep olan şeyleri bize açıklar."]]}, {"reader": false, "ar": [[1133.0, "ونقول في بيانها وبالله التوفيق:"], [1139.0, "إن لأهل السنة والجماعة مذهبًا في مصدر التلقّي."], [1146.0, "فمن أين يتلقّى أهل السنة والجماعة عقائدهم؟"], [1151.0, "الجواب: من ثلاثة أصول:"], [1155.0, "الكتابِ والسنةِ استدلالًا، ومنهجِ أهل السنة فهمًا."], [1165.0, "فنحن لا نأخذ معتقداتنا إلا من الكتاب والسنة استدلالًا،"], [1173.0, "وعلى منهج أهل السنة فهمًا."], [1177.0, "هذه مصادر التلقّي عندنا:"], [1181.0, "فمن وافقنا فيها فهو سنّي،"], [1186.0, "ومن خالفنا فيها فليس بسنّي."], [1192.0, "فكلُّ من خالف أهل السنة والجماعة في مصادر التلقّي فليس منهم."]], "tr": [[1133.0, "Onu açıklarken deriz ki —tevfik Allah'tandır—:"], [1133.0, "Ehl-i Sünnet ve'l-Cemaat'in telakki kaynağı konusunda bir mezhebi vardır."], [1146.0, "Ehl-i Sünnet ve'l-Cemaat akîdelerini nereden alır?"], [1146.0, "Cevap: Üç asıldan: istidlal (delil getirme) bakımından Kitap ve Sünnet'ten, anlama bakımından da Ehl-i Sünnet'in metodundan."], [1165.0, "Biz inançlarımızı ancak istidlal bakımından Kitap ve Sünnet'ten ve anlama bakımından Ehl-i Sünnet'in metodu üzere alırız."], [1177.0, "Bizdeki telakki kaynakları bunlardır: Bunlarda bize uyan sünnîdir, bunlarda bize muhalefet eden sünnî değildir."], [1192.0, "Telakki kaynaklarında Ehl-i Sünnet ve'l-Cemaat'e muhalefet eden herkes onlardan değildir."]]}, {"reader": false, "ar": [[1197.0, "فالخوارج ليسوا من أهل السنة،"], [1200.5, "لأنهم يخالفوننا في مصادر التلقّي."], [1204.0, "والجهمية ليسوا منا، لأنهم يخالفوننا في مصادر التلقّي."], [1212.0, "والرافضة ليسوا منا، لأنهم يخالفوننا في مصادر التلقّي."], [1222.0, "بل علماء الكلام وأهل الكلام والفلسفة على مختلف طوائفهم ليسوا منا،"], [1230.5, "لأنهم يخالفوننا في مصادر التلقّي."]], "tr": [[1197.0, "Hâricîler Ehl-i Sünnet'ten değildir, çünkü telakki kaynaklarında bize muhalefet ederler."], [1204.0, "Cehmiyye bizden değildir, çünkü telakki kaynaklarında bize muhalefet ederler."], [1212.0, "Râfıza bizden değildir, çünkü telakki kaynaklarında bize muhalefet ederler."], [1222.0, "Hatta kelâm âlimleri, kelâm ve felsefe ehli, çeşitli taifeleriyle bizden değildir, çünkü telakki kaynaklarında bize muhalefet ederler."]]}, {"reader": false, "ar": [[1236.0, "فهم لا يعتمدون في مصدر التلقّي على الكتاب والسنة أصالةً،"], [1242.0, "وإنما يعتمدون على الكتاب والسنة فيما وافق عقولهم:"], [1249.0, "فما وافق عقولهم من الكتاب والسنة أخذوا به،"], [1254.0, "وما خالف عقولهم من الكتاب والسنة ردّوه وحرّفوه واتّهموه وعطّلوه."], [1261.0, "فمصدر التلقّي عندهم هو العقل،"], [1266.6, "وأما النقل ففرعٌ عنه."], [1269.0, "أما نحن ـ معاشرَ أهل السنة ـ فإن الأصل في مصدر التلقّي عندنا هو الكتاب والسنة،"], [1278.0, "والعقل وسيلةٌ لفهم النقل فقط."]], "tr": [[1236.0, "Onlar telakki kaynağında aslen Kitap ve Sünnet'e dayanmazlar;"], [1236.0, "Kitap ve Sünnet'e ancak akıllarına uyan kısımda dayanırlar:"], [1242.0, "Kitap ve Sünnet'ten akıllarına uyanı alırlar;"], [1249.0, "Kitap ve Sünnet'ten akıllarına aykırı olanı ise reddeder, tahrif eder, töhmet altında bırakır ve ta'til ederler."], [1261.0, "Onlarda telakki kaynağı akıldır; nakil ise ondan bir fer'dir."], [1269.0, "Biz Ehl-i Sünnet topluluğuna gelince, bizde telakki kaynağında asıl Kitap ve Sünnet'tir;"], [1269.0, "akıl ise sadece nakli anlamanın bir vasıtasıdır."]]}, {"reader": false, "ar": [[1280.0, "وكذلك سائر الطوائف في مسألة الفهم؛"], [1286.0, "فلا أعلم طائفةً في الدنيا تعتمد فهمَ السلف الصالح لأدلة الاعتقاد."], [1295.0, "فحيث كانت الطوائف لا تعتمد فهم السلف الصالح في مسائل الاعتقاد،"], [1302.0, "إذن ليسوا من أهل السنة والجماعة؛"], [1306.0, "لأنهم يفهمون الكتاب والسنة على معطيات عقولهم،"], [1311.0, "وعلى نتائج أفكارهم، وعلى مقتضيات قواعدهم الفلسفية الكلامية التي لا تُسمن ولا تُغني من جوع،"], [1323.0, "والتي تعارض المنقول وتصادم المعقول."]], "tr": [[1280.0, "Anlama meselesinde diğer taifeler de böyledir."], [1286.0, "Dünyada itikad delillerini anlamada selef-i sâlihînin anlayışına dayanan bir taife bilmiyorum."], [1295.0, "Taifeler itikad meselelerinde selef-i sâlihînin anlayışına dayanmadıklarına göre, demek ki Ehl-i Sünnet ve'l-Cemaat'ten değildirler."], [1306.0, "Çünkü onlar Kitap ve Sünnet'i akıllarının verilerine, fikirlerinin sonuçlarına ve ne besleyen ne de açlığı gideren, menkûle aykırı düşen ve ma'kûle çarpan felsefî-kelâmî kaidelerinin gereklerine göre anlarlar."]]}, {"reader": false, "ar": [[1328.0, "فلا يمكن أن يوصف بالسنة إنسانٌ أو طائفةٌ أو جماعةٌ تخالف أهل السنة والجماعة في مصادر التلقّي."], [1340.0, "فالذي يجعل الأشاعرة من أهل السنة هذا رجلٌ ظالم،"], [1345.0, "لأنهم يخالفون أهل السنة والجماعة في مصادر التلقّي."], [1350.0, "والذي يجعل الماتريدية من أهل السنة هذا رجلٌ ظالم،"], [1355.0, "لأنهم يخالفون أهل السنة والجماعة في مصادر التلقّي."], [1360.0, "فإن قيل: أوَأنت تُخرجهم عن الإسلام؟"], [1363.0, "فأقول: حاشا وكلّا، هم مسلمون،"], [1366.0, "ولكن البحث في هذه الكلية:"], [1369.5, "أهُم من أهل السنة أو لا؟"], [1374.0, "فلا يوصف المعتقِد بأنه من أهل السنة إلا إذا وافق أهل السنة في مصادر التلقّي."]], "tr": [[1328.0, "Telakki kaynaklarında Ehl-i Sünnet ve'l-Cemaat'e muhalefet eden bir insanın, taifenin veya cemaatin Sünnet'le nitelenmesi mümkün değildir."], [1340.0, "Eş'arîleri Ehl-i Sünnet'ten sayan kişi zalimdir, çünkü onlar telakki kaynaklarında Ehl-i Sünnet ve'l-Cemaat'e muhalefet ederler."], [1350.0, "Mâtürîdîleri Ehl-i Sünnet'ten sayan kişi zalimdir, çünkü onlar telakki kaynaklarında Ehl-i Sünnet ve'l-Cemaat'e muhalefet ederler."], [1355.0, "\"Sen onları İslâm'dan mı çıkarıyorsun?\" denirse, derim ki:"], [1363.0, "Hâşâ ve kellâ, onlar Müslümandır."], [1363.0, "Ama bu külliyedeki mesele şudur:"], [1366.0, "Onlar Ehl-i Sünnet'ten midir, değil midir?"], [1374.0, "İnanan bir kişi, ancak telakki kaynaklarında Ehl-i Sünnet'e uyarsa Ehl-i Sünnet'ten olmakla nitelenir."]]}, {"reader": false, "ar": [[1384.0, "وأقول من باب التوضيح:"], [1388.0, "هل يوصف بالطبّ من خالف الأطباء في مصادر تلقّي الطب؟"], [1394.0, "الجواب: لا. هل يوصف بالمهندس من خالف علماء الهندسة في تلقّي المعارف الهندسية؟"], [1405.0, "الجواب: لا. هل يوصف بالإسلام من خالف المسلمين في أصل الاعتقاد ومصادر التلقّي؟"], [1414.0, "الجواب: لا. فلا يُنسب الشخص إلى طائفةٍ إلا إذا وافقهم في مصدر التلقّي،"], [1424.0, "وأما من خالفهم في مصدر التلقّي فلا يُعتبر منهم. والله أعلم."]], "tr": [[1384.0, "Açıklama olsun diye derim ki:"], [1384.0, "Tıp bilgisini alma kaynaklarında doktorlara muhalefet eden kişi tabiplikle nitelenir mi?"], [1394.0, "Cevap: Hayır. Mühendislik bilgilerini almada mühendislik âlimlerine muhalefet eden kişi mühendis olarak nitelenir mi?"], [1405.0, "Cevap: Hayır. İtikadın aslında ve telakki kaynaklarında Müslümanlara muhalefet eden kişi İslâm'la nitelenir mi?"], [1414.0, "Cevap: Hayır. Bir kişi ancak telakki kaynağında bir taifeye uyarsa ona nispet edilir;"], [1414.0, "telakki kaynağında onlara muhalefet eden ise onlardan sayılmaz. Allah en iyisini bilir."]]}]}, {"ts": "23:50", "title": "3. Külliye: İtikad usûlünden bir asılda muhalefet eden onlardan değildir", "paras": [{"reader": false, "ar": [[1430.0, "الكلية الثالثة: <b>كلُّ من خالف أهل السنة في أصلٍ من أصول الاعتقاد فليس منهم.<\/b> كلُّ من خالف أهل السنة في أصلٍ من أصول الاعتقاد فليس منهم."], [1456.0, "أقول وبالله التوفيق: وهذه كليةٌ ثانيةٌ تبيّن لك الشيء الذي يخرج به الإنسان عن دائرة أهل السنة."], [1471.0, "فإن لكلِّ طائفةٍ أصولَها العقدية،"], [1475.0, "أليس كذلك؟ الجواب: بلى."], [1480.0, "وكذلك أهل السنة والجماعة لمذهبهم أصولٌ وقواعد يدخل تحتها جزئياتٌ وفروعٌ عقديةٌ كثيرة."], [1493.0, "فمن جاء وخالف أهل السنة والجماعة في هذا الأصل العام"]], "tr": [[1430.0, "Üçüncü külliye: <b>İtikad usûlünden bir asılda Ehl-i Sünnet'e muhalefet eden herkes onlardan değildir.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [1430.0, "Bu da insanın Ehl-i Sünnet dairesinden çıkmasına sebep olan şeyi sana açıklayan ikinci bir külliyedir."], [1456.0, "Her taifenin kendine ait itikadî usûlü vardır, değil mi?"], [1475.0, "Cevap: Evet. Aynı şekilde Ehl-i Sünnet ve'l-Cemaat'in mezhebinin de altına pek çok itikadî cüz'î ve fer'î mesele giren usûlü ve kaideleri vardır."], [1493.0, "Kim gelip bu genel asılda —"]]}]}, {"ts": "25:00", "title": "3. Külliye (devam): Mümessile, Muattıla, Mürcie, Vaîdiyye, Cebriyye ve Kaderiyye", "paras": [{"reader": false, "ar": [[1500.0, "وفي هذه القاعدة الكبيرة فإنه لا يُعتبر منهم."], [1506.0, "فالممثّلة ليسوا من أهل السنة،"], [1509.4, "لأنهم خالفوا أهل السنة في أصل الإثبات؛"], [1515.0, "فإثبات أهل السنة لا تمثيل فيه،"], [1519.2, "وإثبات الممثّلة يتضمّن التمثيل،"], [1522.0, "فليسوا من أهل السنة لهذا الاعتبار."], [1526.0, "والمعطّلة ليسوا من أهل السنة،"], [1531.0, "لأنهم خالفونا في أصل التنزيه؛"], [1534.0, "فتنزيهنا لا تعطيل فيه،"], [1538.0, "وتنزيههم يتضمّن التعطيل، فلما خالفونا في هذا الأصل أخرجناهم عن دائرتنا."]], "tr": [[1500.0, "— ve bu büyük kaidede Ehl-i Sünnet ve'l-Cemaat'e muhalefet ederse, onlardan sayılmaz."], [1506.0, "Mümessile Ehl-i Sünnet'ten değildir, çünkü isbat aslında Ehl-i Sünnet'e muhalefet etmişlerdir:"], [1515.0, "Ehl-i Sünnet'in isbatında temsil yoktur, Mümessile'nin isbatı ise temsili içerir;"], [1522.0, "bu itibarla Ehl-i Sünnet'ten değildirler."], [1526.0, "Muattıla Ehl-i Sünnet'ten değildir, çünkü tenzih aslında bize muhalefet etmişlerdir:"], [1534.0, "Bizim tenzihimizde ta'til yoktur, onların tenzihi ise ta'tili içerir;"], [1538.0, "bu asılda bize muhalefet edince onları dairemizden çıkardık."]]}, {"reader": false, "ar": [[1547.0, "وكذلك المرجئة على مختلف طوائفهم ليسوا من أهل السنة،"], [1555.0, "لأن الأصل عندنا في الإيمان بناؤه على اعتقاد الجَنان،"], [1561.0, "ونطق اللسان، والعمل بالجوارح والأركان؛"], [1567.0, "فجاء المرجئة وأخرجوا العمل والقول عن دائرة الإيمان،"], [1576.0, "فخالفونا في هذا الأصل الإيماني العقدي الكبير،"], [1581.0, "فليسوا منا. وكذلك الوعيدية من الخوارج والمعتزلة ليسوا منا،"], [1588.0, "لأننا نعتقد أن فعل الكبيرة يُنقص كمالَ الإيمان الواجب،"], [1598.0, "ولكن لا ينقض أصلَ الإيمان؛"], [1602.0, "فخالفنا الوعيدية وقالوا: بل يَكفُر بالكبيرة ويخرج عن أصل الإيمان،"], [1610.0, "فخالفونا في هذا الأصل العقدي الكبير، فليسوا منا."]], "tr": [[1547.0, "Aynı şekilde Mürcie de çeşitli taifeleriyle Ehl-i Sünnet'ten değildir."], [1547.0, "Çünkü bizde imanda asıl, onun kalbin itikadı, dilin söylemesi ve organlar ve rükünlerle amel üzerine bina edilmesidir."], [1561.0, "Mürcie gelip ameli ve sözü iman dairesinden çıkardı;"], [1567.0, "bu büyük imanî-itikadî asılda bize muhalefet ettiler, dolayısıyla bizden değildirler."], [1576.0, "Aynı şekilde Hâricîler ve Mu'tezile'den Vaîdiyye de bizden değildir."], [1581.0, "Çünkü biz büyük günah işlemenin vacip iman kemalini eksilttiğine, ama imanın aslını bozmadığına inanırız."], [1598.0, "Vaîdiyye bize muhalefet etti ve \"Bilakis büyük günahla kâfir olur ve imanın aslından çıkar\" dedi."], [1602.0, "Bu büyük itikadî asılda bize muhalefet ettiler, dolayısıyla bizden değildirler."]]}, {"reader": false, "ar": [[1616.5, "والجبرية ليسوا منا في باب القدر،"], [1621.0, "لأن العبد عندنا في باب القدر له مشيئةٌ واختيار،"], [1627.0, "والجبرية قالوا: لا مشيئة ولا اختيار للعبد في الأقدار."], [1633.0, "وكذلك القدرية من المعتزلة ليسوا منا في باب القدر،"], [1642.0, "لأننا نعتقد أن الله هو الذي خلق فعلَ العبد وقدّره وقضاه،"], [1651.0, "والقدرية يقولون: للعبد المشيئةُ والاختيارُ المطلق،"], [1655.1, "والله لم يخلق أفعال العباد."], [1660.0, "فكيف تريد مني أن أُدخل من يخالفني في أصول مذهبي معي في المذهب؟"]], "tr": [[1616.5, "Cebriyye kader babında bizden değildir."], [1616.5, "Çünkü bizde kader babında kulun meşîeti ve ihtiyarı vardır;"], [1621.0, "Cebriyye ise \"Kaderlerde kulun ne meşîeti ne de ihtiyarı vardır\" dedi."], [1627.0, "Aynı şekilde Mu'tezile'den Kaderiyye de kader babında bizden değildir."], [1633.0, "Çünkü biz kulun fiilini yaratanın, takdir edenin ve hükmedenin Allah olduğuna inanırız;"], [1651.0, "Kaderiyye ise \"Kulun mutlak meşîeti ve ihtiyarı vardır;"], [1651.0, "Allah kulların fiillerini yaratmamıştır\" der."], [1655.1, "Mezhebimin usûlünde bana muhalefet edeni, benimle birlikte mezhebe nasıl sokmamı istersin?"]]}, {"reader": false, "ar": [[1670.0, "وأزيد الأمر إيضاحًا فأقول:"], [1672.3, "هل من خالف المالكية في أصول مذهبهم يكون مالكيًّا؟"], [1678.1, "الجواب: لا. هل من خالف أصول الحنفية في فقههم يكون حنفيًّا؟"], [1689.6, "الجواب: لا. هل من خالف الشافعية أو الحنابلة أو الظاهرية في أصول مذهبهم يكون منسوبًا إليهم؟"], [1701.3, "الجواب: لا. فكذلك نقول:"], [1709.4, "إن من خالف أهل السنة والجماعة في أصولهم العقدية فليس منهم."]], "tr": [[1670.0, "Meseleyi daha da açıklığa kavuşturup derim ki:"], [1672.3, "Mâlikîlere mezheplerinin usûlünde muhalefet eden Mâlikî olur mu?"], [1678.1, "Cevap: Hayır. Fıkıhlarında Hanefîlerin usûlüne muhalefet eden Hanefî olur mu?"], [1678.1, "Cevap: Hayır. Mezheplerinin usûlünde Şâfiîlere, Hanbelîlere veya Zâhirîlere muhalefet eden onlara nispet edilir mi?"], [1689.6, "Cevap: Hayır. İşte biz de aynı şekilde deriz ki:"], [1709.4, "İtikadî usûllerinde Ehl-i Sünnet ve'l-Cemaat'e muhalefet eden onlardan değildir."]]}, {"reader": false, "ar": [[1721.0, "والكلام واضحٌ لا إشكال فيه،"], [1724.0, "إلا على من أراد أن يُلبّس على المسلمين،"], [1730.0, "ويُخادع الناس في عقيدتهم،"], [1733.0, "فيكون من جملة الأبالسة الذين يدعون الناس إلى غير مقتضى الشرع؛"], [1739.0, "وكلُّ من دعاك لغير مقتضى الشرع فمِن جنود إبليس. والله أعلم."]], "tr": [[1721.0, "Söz açıktır, onda bir müşkil yoktur;"], [1721.0, "ancak Müslümanların kafasını karıştırmak ve insanları akîdeleri konusunda aldatmak isteyen için (müşkildir)."], [1733.0, "Böylesi, insanları şeriatın gereğinden başkasına çağıran iblislerden olur."], [1733.0, "Seni şeriatın gereğinden başkasına çağıran herkes İblis'in askerlerindendir. Allah en iyisini bilir."]]}]}, {"ts": "29:08", "title": "4. Külliye: İcmâ edilmiş itikadî bir meselede muhalefet eden o cüz'îde onlardan değildir", "paras": [{"reader": false, "ar": [[1748.0, "الكلية الرابعة: <b>كلُّ من خالف أهل السنة والجماعة في مسألةٍ عقديةٍ مُجمَعٍ عليها فليس منهم في هذه الجزئية.<\/b> كلُّ من خالف أهل السنة والجماعة في مسألةٍ عقديةٍ مجمعٍ عليها فليس منهم في هذه الجزئية."], [1776.5, "أعيدها مرةً أخرى لطلابي وأحبابي:"], [1785.0, "كلُّ من خالف أهل السنة والجماعة في مسألةٍ ـ انتبهوا ـ عقديةٍ مجمعٍ عليها فليس منهم في هذه الجزئية."]], "tr": [[1748.0, "Dördüncü külliye: <b>Üzerinde icmâ edilmiş itikadî bir meselede Ehl-i Sünnet ve'l-Cemaat'e muhalefet eden herkes, bu cüz'î meselede onlardan değildir.<\/b> (Tekrar ediyor.) Talebelerim ve sevdiklerim için bir kez daha tekrar ediyorum:"], [1776.5, "Üzerinde icmâ edilmiş —dikkat edin— itikadî bir meselede Ehl-i Sünnet ve'l-Cemaat'e muhalefet eden herkes, bu cüz'î meselede onlardan değildir."]]}]}, {"ts": "30:00", "title": "4. Külliye (devam): \"Mutlak çıkarma\" ve \"çıkarmanın mutlakı\"", "paras": [{"reader": false, "ar": [[1802.0, "بمعنى أن الأصول التي قرّرها أهل السنة،"], [1806.8, "والقواعد التي اعتمدها أهل الحق،"], [1814.0, "لا بدّ أن ينتج عنها جزئياتٌ ومسائل."], [1818.0, "فإذا كان المخالف قد خالفني في الأصل الكلي فليس مني مطلقًا،"], [1825.0, "وأما إذا خالفني في جزئيةٍ مع اتفاقه معي في هذا الأصل فأنا أُخرجه عن دائرة أهل السنة في هذه الجزئية فقط."]], "tr": [[1802.0, "Yani Ehl-i Sünnet'in takrir ettiği usûlden ve hak ehlinin dayandığı kaidelerden mutlaka cüz'î meseleler ve meseleler doğar."], [1814.0, "Muhalif bana küllî asılda muhalefet etmişse mutlak olarak benden değildir."], [1818.0, "Ama bu asılda benimle ittifak etmekle birlikte bir cüz'î meselede bana muhalefet ederse, onu sadece bu cüz'î meselede Ehl-i Sünnet dairesinden çıkarırım."]]}, {"reader": false, "ar": [[1839.0, "فلو قال لنا قائل:"], [1842.0, "يا أهل السنة، أنا سأكون معكم في مصادر التلقّي،"], [1849.0, "وفي كافة أصولكم العقدية،"], [1853.0, "ولكن اسمحوا لي أن أحرّف صفة الاستواء إلى الاستيلاء؛"], [1857.0, "فهو لم يخالفني في مصدر التلقّي،"], [1861.0, "ولم يخالفني في الأصل العام،"], [1864.0, "ولكن خالفني في جزئيةٍ من جزئيات هذا الأصل العام؛"], [1868.0, "فأنا أُخرجه عن دائرة أهل السنة في هذه الجزئية فقط،"], [1873.0, "وإن كنتُ أصفه بالسنة في الجزئيات والأصول الأخرى التي وافقني فيها."]], "tr": [[1839.0, "Biri bize şöyle dese: \"Ey Ehl-i Sünnet!"], [1842.0, "Telakki kaynaklarında ve bütün itikadî usûlünüzde sizinle beraber olacağım;"], [1849.0, "ama istivâ sıfatını istîlâya tahrif etmeme izin verin.\" Bu kişi telakki kaynağında bana muhalefet etmemiştir, genel asılda da bana muhalefet etmemiştir;"], [1864.0, "ama bu genel aslın cüz'î meselelerinden birinde bana muhalefet etmiştir."], [1868.0, "Onu sadece bu cüz'î meselede Ehl-i Sünnet dairesinden çıkarırım;"], [1873.0, "bana uyduğu diğer cüz'î meselelerde ve usûlde onu Sünnet'le nitelesem de."]]}, {"reader": false, "ar": [[1880.0, "ولو قال لنا قائل:"], [1883.0, "سأُثبت كلَّ ما أجمعتم عليه من العقائد،"], [1887.0, "ولكن اسمحوا لي في عدم وصف الله بالعلوّ؛"], [1892.0, "أو قال قائل: اسمحوا لي في عدم وصف الله باليدين،"], [1900.0, "فعلوُّ الله عندي هو علوُّ القدر لا علوُّ الذات،"], [1907.2, "واليدان عندي معناها النعمة والقدرة،"], [1913.0, "لا أنها صفةٌ من صفات الله."], [1915.0, "فهل نحن ـ معاشرَ أهل السنة والجماعة ـ نقبل هذا الكلام؟"], [1919.0, "الجواب: لا نقبله مطلقًا،"], [1922.0, "ونردّه، ونزجر صاحبه، ونعظه،"], [1927.7, "ونخوّفه من مغبّة عقيدته الجزئية المخالفة لأهل السنة."]], "tr": [[1880.0, "Biri bize şöyle dese: \"Akîdelerden üzerinde icmâ ettiğiniz her şeyi isbat edeceğim;"], [1887.0, "ama Allah'ı uluvvle (yücelikle) nitelememe izin verin.\" Ya da biri şöyle dese:"], [1892.0, "\"Allah'ı iki elle nitelememe izin verin;"], [1892.0, "bana göre Allah'ın uluvvü zâtın yüceliği değil, kadrin (şanın) yüceliğidir;"], [1907.2, "bana göre iki elin manası nimet ve kudrettir, Allah'ın sıfatlarından bir sıfat değildir.\" Biz Ehl-i Sünnet ve'l-Cemaat topluluğu bu sözü kabul eder miyiz?"], [1915.0, "Cevap: Onu asla kabul etmeyiz;"], [1919.0, "onu reddeder, sahibini azarlar, ona öğüt verir ve Ehl-i Sünnet'e aykırı bu cüz'î akîdesinin kötü akıbetinden onu korkuturuz."]]}, {"reader": false, "ar": [[1933.0, "ولكن لا نُخرجه عن دائرة أهل السنة جملةً وتفصيلًا،"], [1939.0, "إذ عنده من موافقة الحق الشيءُ الكثير والمقدار العظيم جدًّا،"], [1946.0, "ولكن خالفني في مسألةٍ واحدة،"], [1949.0, "وهذه المخالفة في المسألة الواحدة تجعلني أُخرجه مطلقَ الإخراج،"], [1956.4, "لا الإخراجَ المطلق <span class=\"q\">؟ 32:37<\/span>. فبان لنا بذلك أن الخروج عن مذهب أهل السنة ينقسم إلى قسمين:"], [1965.0, "إلى الإخراج المطلق عن الدائرة كلِّها،"], [1971.0, "وإلى مطلق الإخراج، أي عن بعض الدائرة لا عن كلِّها."]], "tr": [[1933.0, "Ama onu Ehl-i Sünnet dairesinden bütünüyle ve tafsilatıyla çıkarmayız;"], [1939.0, "çünkü onda hakka uygunluktan çok şey ve çok büyük bir miktar vardır."], [1939.0, "Ama bana tek bir meselede muhalefet etmiştir;"], [1946.0, "tek meseledeki bu muhalefet beni onu \"çıkarmanın mutlakı\" (kısmî çıkarma) ile çıkarmaya sevk eder, \"mutlak çıkarma\" ile değil <span class=\"q\">؟<\/span>."], [1956.4, "Böylece bize şu açıklık kazandı:"], [1956.4, "Ehl-i Sünnet mezhebinden çıkış iki kısma ayrılır:"], [1965.0, "Dairenin tamamından mutlak çıkarma ve çıkarmanın mutlakı, yani dairenin tamamından değil bir kısmından çıkarma."]]}, {"reader": false, "ar": [[1977.0, "فأنا أُخرجه الإخراجَ المطلق إذا خالفني في مصادر التلقّي،"], [1985.0, "وأُخرجه الإخراجَ المطلق ـ من يكمل؟"], [1991.0, "ـ إذا خالفني في أصلٍ عقدي،"], [1995.0, "نعم؛ وأُخرجه مطلقَ الإخراج إذا خالفني في مسألةٍ عقديةٍ مجمعٍ عليها. والله أعلم."]], "tr": [[1977.0, "Telakki kaynaklarında bana muhalefet ederse onu mutlak çıkarma ile çıkarırım;"], [1977.0, "onu mutlak çıkarma ile çıkarırım —kim tamamlar?— itikadî bir asılda bana muhalefet ederse;"], [1991.0, "evet. Üzerinde icmâ edilmiş itikadî bir meselede bana muhalefet ederse de onu çıkarmanın mutlakı ile çıkarırım. Allah en iyisini bilir."]]}]}, {"ts": "33:30", "title": "5. Külliye: Ehl-i Sünnet'in ihtilaf ettiği mesele, dost-düşmanlık ölçüsü olan büyük meselelerden değildir", "paras": [{"reader": false, "ar": [[2010.0, "الكلية الخامسة: <b>كلُّ مسألةٍ ثبت اختلافُ أهل السنة فيها فليست من مسائل الدين الكبار التي يُوالى ويُعادى عليها.<\/b> أقول وبالله التوفيق:"], [2026.3, "لا يجوز لنا ـ معاشرَ أهل السنة والجماعة ـ أن يُخرج بعضُنا بعضًا من دائرة أهل السنة،"], [2037.8, "لا الإخراجَ المطلق ولا مطلقَ الإخراج،"], [2041.5, "إذا اختلفنا في مسألةٍ عقديةٍ تتجاذبها الأدلة،"], [2046.9, "ويجوز فيها الاختلاف والاجتهاد."], [2050.0, "فإن الاجتهاد في الاعتقادات جائزٌ عندنا معاشرَ أهل السنة والجماعة؛"], [2057.0, "فكما أن المسائل الفقهية فيها مسائلُ مجمعٌ عليها وفيها مسائلُ مختلفٌ فيها،"], [2064.0, "فكذلك المسائل العقدية فيها أيضًا إجماعٌ واجتهاد."]], "tr": [[2010.0, "Beşinci külliye: <b>Ehl-i Sünnet'in ihtilaf ettiği sabit olan her mesele, üzerine dostluk ve düşmanlık kurulan büyük din meselelerinden değildir.<\/b> Tevfik Allah'tandır, derim ki:"], [2026.3, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğunun, delillerin çekiştirdiği, ihtilafın ve içtihadın caiz olduğu itikadî bir meselede ihtilaf ettiğimizde birbirimizi Ehl-i Sünnet dairesinden —ne mutlak çıkarma ne de çıkarmanın mutlakı ile— çıkarmamız caiz değildir."], [2050.0, "Çünkü biz Ehl-i Sünnet ve'l-Cemaat topluluğu nezdinde itikadî konularda içtihat caizdir."], [2057.0, "Fıkhî meselelerde üzerinde icmâ edilmiş meseleler ve ihtilaf edilmiş meseleler olduğu gibi, itikadî meselelerde de icmâ ve içtihat vardır."]]}, {"reader": false, "ar": [[2072.0, "فإذا دار الخلاف بيننا معاشرَ أهل السنة،"], [2076.8, "ولم يخرج الخلاف عن دائرتنا ـ ولم يخرج الخلاف عن دائرتنا ـ فلا يجوز لنا أن نجعل المسألة التي اختلفتُ أنا وأخي فيها مجالًا للتبديع أو التفسيق أو التكفير،"], [2096.0, "ولا مجالًا لفساد أخوّة الدين والإيمان،"], [2101.0, "ولا مجالًا لفساد القلوب وامتلائها على بعض،"], [2108.0, "ولا مجالًا للسباب والشتائم أو كثرة الخصومات والنزاع،"], [2116.0, "ولا مجالًا للولاء والبراء،"], [2119.0, "ولا مجالًا للتحاسد والتحاقد والتباغض والتدابر؛"], [2128.0, "لأنها مسألةٌ أيسرُ من أن تُفسد ما بيننا من أخوّة السنة والجماعة ومحبّة الدين والإيمان."]], "tr": [[2072.0, "Biz Ehl-i Sünnet topluluğu arasında ihtilaf döner ve ihtilaf dairemizin dışına çıkmazsa —(tekrar ediyor)— kardeşimle ihtilaf ettiğim meseleyi bid'atçılıkla, fâsıklıkla veya tekfirle itham etme alanı;"], [2076.8, "din ve iman kardeşliğinin bozulması alanı;"], [2096.0, "kalplerin bozulup birbirine karşı dolması alanı;"], [2101.0, "sövgü ve hakaret veya çok husumet ve çekişme alanı;"], [2108.0, "velâ ve berâ (dostluk ve düşmanlık) alanı;"], [2108.0, "birbirini kıskanma, kin tutma, buğzetme ve sırt çevirme alanı yapmamız caiz değildir."], [2119.0, "Çünkü o mesele, aramızdaki Sünnet ve Cemaat kardeşliğini, din ve iman sevgisini bozmaktan daha hafiftir."]]}]}, {"ts": "35:42", "title": "5. Külliye (devam): Ehl-i Sünnet içindeki ihtilaflara örnekler", "paras": [{"reader": false, "ar": [[2142.0, "كمسألة اختلافنا: هل رأى محمدٌ صلى الله عليه وسلم ربَّه ليلة أُسري به أو لم يرَه؟"], [2151.0, "فسواءٌ قلتَ: رآه، أو قلت:"], [2153.1, "لم يرَه، فأنت سنّيٌّ على كلا القولين."], [2156.0, "وكمسألة: من سيرى اللهَ في العرصات قبل دخول الجنة؟"], [2165.0, "فإن قلت: يراه المؤمنون فقط،"], [2168.7, "فأنت سنّي. وإن قلت:"], [2172.5, "يراه المؤمنون والمنافقون فقط،"], [2177.0, "فأنت سنّي. وإن قلت:"], [2180.6, "يراه هؤلاء والكفار، ثم يحتجب عن المنافقين والكفار،"], [2186.0, "ويبقى يراه المؤمنون حتى يدخلوا الجنة،"], [2189.0, "فأنت من أهل السنة؛"], [2191.0, "إذ كلُّ الأقوال الثلاثة قال بها جمعٌ من أهل السنة."], [2197.0, "فالخلاف في هذه المسألة خلافٌ دائرٌ بين أهل السنة أنفسهم."]], "tr": [[2142.0, "Mesela şu meseledeki ihtilafımız gibi:"], [2142.0, "Muhammed ﷺ İsrâ gecesinde Rabbini gördü mü, görmedi mi?"], [2142.0, "İster \"gördü\" de ister \"görmedi\" de, her iki görüşe göre de sünnîsin."], [2153.1, "Şu mesele gibi: Cennete girmeden önce arasat meydanlarında Allah'ı kim görecek?"], [2156.0, "\"Sadece müminler görür\" dersen sünnîsin."], [2165.0, "\"Sadece müminler ve münafıklar görür\" dersen sünnîsin."], [2172.5, "\"Bunlar ve kâfirler görür, sonra münafıklardan ve kâfirlerden perdelenir, müminler ise cennete girinceye kadar O'nu görmeye devam eder\" dersen Ehl-i Sünnet'tensin."], [2189.0, "Çünkü bu üç görüşün hepsini Ehl-i Sünnet'ten bir topluluk söylemiştir."], [2191.0, "Bu meseledeki ihtilaf, bizzat Ehl-i Sünnet arasında dönen bir ihtilaftır."]]}, {"reader": false, "ar": [[2202.4, "وكمسألة تسمية اليد الأخرى بالشمال:"], [2209.0, "فاتفق العلماء على أن لله يدين،"], [2214.0, "واتفق العلماء على وصف اليدين باليمين في البذل والإنفاق والعطاء والكرم،"], [2222.0, "واتفق العلماء على أن اسم إحدى اليدين يمين،"], [2229.0, "ولكن اختلفوا في اسم اليد الأخرى:"], [2233.0, "أيُطلق عليها شمالٌ أم يمينٌ أيضًا؟"], [2237.0, "على قولين ـ لمن؟ ـ لأهل السنة أنفسهم."], [2241.0, "فمن قال بأنها شمالٌ فهو من أهل السنة،"], [2245.0, "ومن قال بأنها يمينٌ ـ وهو الأصح ـ فهو من أهل السنة."], [2252.0, "فلا تبديع، ولا تفسيق،"], [2254.9, "ولا قطع لأخوّة الدين،"], [2258.0, "ولا موالاة ولا معاداة في هذه المسائل."]], "tr": [[2202.4, "Diğer elin \"sol\" (şimâl) diye isimlendirilmesi meselesi gibi:"], [2209.0, "Âlimler Allah'ın iki eli olduğunda ittifak etmiş;"], [2214.0, "bağışta, infakta, vermede ve cömertlikte iki elin \"sağ\" (yemîn) olarak nitelenmesinde ittifak etmiş;"], [2222.0, "iki elden birinin adının \"sağ\" olduğunda ittifak etmişlerdir."], [2229.0, "Ama diğer elin adında ihtilaf etmişlerdir:"], [2233.0, "Ona \"sol\" mu denir, yoksa o da mı \"sağ\"dır?"], [2237.0, "İki görüş vardır —kimin?— bizzat Ehl-i Sünnet'in."], [2241.0, "\"Sol'dur\" diyen Ehl-i Sünnet'tendir; \"O da sağdır\" diyen —ki daha sahih olan budur— Ehl-i Sünnet'tendir."], [2245.0, "Bu meselelerde ne bid'atçılıkla itham, ne fâsıklıkla itham, ne din kardeşliğini kesmek, ne de dostluk ve düşmanlık vardır."]]}, {"reader": false, "ar": [[2262.0, "وكمسألة خلوّ العرش عند النزول:"], [2269.0, "فمنهم من قال: يخلو،"], [2271.8, "ومنهم من قال: لا يخلو ـ وهو الأصح ـ ومنهم من توقّف فلم يقل لا بهذا ولا بهذا."], [2284.0, "فحيثما أخذتَ بشيءٍ من هذه الأقوال في هذه المسألة فأنت لا تزال على مسمّى أهل السنة والجماعة."], [2298.2, "وكمسألة: ما الذي سيوزن في ميزان الأعمال يوم القيامة؟"], [2306.0, "أهو العامل كما قاله بعضهم،"], [2311.0, "أم عمله كما قاله بعضهم،"], [2316.0, "أم صحيفة عمله كما قاله بعضهم،"], [2321.0, "أم كلُّ ذلك سيوزن كما هو القول الراجح؟"], [2327.0, "فحيثما قلت بواحدةٍ من هذه الأقوال فأنت سنّيٌّ سلفي،"], [2336.0, "ومن خالفك فيها فسنّيٌّ سلفي. ما أجملَ العلم!"]], "tr": [[2262.0, "Nüzul sırasında Arş'ın boş kalması meselesi gibi:"], [2269.0, "Onlardan kimi \"boş kalır\" dedi, kimi \"boş kalmaz\" dedi —ki daha sahih olan budur—, kimi de tevakkuf etti ve ne bunu ne de şunu söyledi."], [2284.0, "Bu meselede bu görüşlerden hangisini alırsan al, hâlâ Ehl-i Sünnet ve'l-Cemaat adı üzerindesin."], [2284.0, "Şu mesele gibi: Kıyamet günü amellerin mizanında tartılacak olan nedir?"], [2298.2, "Bazılarının dediği gibi amel eden kişi mi, bazılarının dediği gibi ameli mi, bazılarının dediği gibi amel defteri mi, yoksa râcih görüş olduğu üzere bunların hepsi mi tartılacak?"], [2327.0, "Bu görüşlerden hangisini söylersen sünnî-selefîsin;"], [2327.0, "bunda sana muhalefet eden de sünnî-selefîdir. İlim ne güzeldir!"]]}, {"reader": false, "ar": [[2346.0, "وكمسألة عذاب القبر: هل هو على الجسد،"], [2354.0, "أم على الروح، أم عليهما كما هو القول الراجح؟"], [2361.0, "فحيثما أخذتَ بواحدٍ من هذه الأقوال فأنت من أهل السنة والجماعة."], [2370.0, "وكمسألة: هل لكلِّ نبيٍّ يوم القيامة في العرصات حوضٌ،"], [2379.0, "أم أنه حوضٌ واحدٌ لنبينا صلى الله عليه وسلم؟"], [2385.0, "على قولين، والصواب أن لكلِّ نبيٍّ حوضًا،"], [2392.0, "ولكن أعظمها وأوسعها وأعذبها ماءً وأكثرها واردًا هو حوضُ نبينا صلى الله عليه وسلم."]], "tr": [[2346.0, "Kabir azabı meselesi gibi: Bedene mi, ruha mı, yoksa râcih görüş olduğu üzere ikisine birden mi?"], [2354.0, "Bu görüşlerden hangisini alırsan al Ehl-i Sünnet ve'l-Cemaat'tensin."], [2361.0, "Şu mesele gibi: Kıyamet günü arasatta her peygamberin bir havzı var mıdır, yoksa sadece Peygamberimiz ﷺ'e ait tek bir havuz mu vardır?"], [2379.0, "İki görüş vardır. Doğrusu her peygamberin bir havzı olduğudur;"], [2385.0, "ama bunların en büyüğü, en genişi, suyu en tatlısı ve ona gelenleri en çok olanı Peygamberimiz ﷺ'in havzıdır."]]}]}, {"ts": "40:05", "title": "5. Külliye (devam): Sâk ayeti ve külliyenin kaydı", "paras": [{"reader": false, "ar": [[2405.0, "وكمسألة الخلاف في قول الله عز وجل:"], [2409.5, "<span class=\"ayah\">﴿يَوْمَ يُكْشَفُ عَن سَاقٍ﴾<\/span> <span class=\"ref\">[القلم: ٤٢]<\/span>،"], [2412.1, "مع إجماع أهل السنة على إثبات الساق لله بأدلةٍ أخرى،"], [2423.0, "لكن: هل من جملة الأدلة هذه الآية؟"], [2427.0, "على قولين: فمنهم من قال:"], [2430.2, "نعم، هي من جملة الأدلة على إثبات الساق ـ وهو الأصح ـ ومنهم من قال:"], [2438.5, "لا. ومن قال بهذا أو قال بهذا فإنه لا يخرج بقوله واختياره عن دائرة أهل السنة والجماعة."], [2450.1, "والأمثلة على ذلك كثيرة."]], "tr": [[2405.0, "Allah Teâlâ'nın <span class=\"ayah\">﴿Baldırın açılacağı gün﴾<\/span> [Kalem 42] sözü hakkındaki ihtilaf meselesi gibi."], [2409.5, "Ehl-i Sünnet başka delillerle Allah için sâkın (baldırın) isbatında icmâ etmiştir;"], [2423.0, "ama bu ayet de o deliller arasında mıdır?"], [2427.0, "İki görüş vardır: Kimi \"Evet, sâkın isbatına dair delillerdendir\" dedi —ki daha sahih olan budur—, kimi de \"Hayır\" dedi."], [2438.5, "Bunu da söylese şunu da söylese, kişi bu sözü ve tercihi sebebiyle Ehl-i Sünnet ve'l-Cemaat dairesinden çıkmaz. Bunun örnekleri çoktur."]]}, {"reader": false, "ar": [[2453.0, "فكلُّ خلافٍ عقديٍّ ثبت في دائرة أهل السنة والجماعة فلا يُعتبر من المسائل العقدية الكبار التي توجب إخراجًا أو تبديعًا أو تفسيقًا أو تهاجرًا أو ولاءً أو براءً."], [2469.0, "فإن قلت: ولماذا قلتَ:"], [2471.0, "في دائرة أهل السنة؟"], [2473.0, "الجواب: حتى أُخرج الخلافَ بين أهل السنة والطوائف الأخرى،"], [2484.0, "فإنه خلافٌ يُبدَّع فيه ويُفسَّق فيه."], [2489.0, "وإنما الكلية مقيّدةٌ بالخلاف الثابت بين أهل السنة والجماعة أنفسهم. والله أعلم."]], "tr": [[2453.0, "Ehl-i Sünnet ve'l-Cemaat dairesi içinde sabit olan her itikadî ihtilaf, (daireden) çıkarmayı, bid'atçılıkla veya fâsıklıkla itham etmeyi, küsüşmeyi, dostluk veya düşmanlığı gerektiren büyük itikadî meselelerden sayılmaz."], [2453.0, "\"Neden 'Ehl-i Sünnet dairesi içinde' dedin?\" dersen, cevap:"], [2471.0, "Ehl-i Sünnet ile diğer taifeler arasındaki ihtilafı (kapsamdan) çıkarmak için;"], [2473.0, "çünkü o, içinde bid'atçılıkla ve fâsıklıkla hüküm verilen bir ihtilaftır."], [2489.0, "Külliye, bizzat Ehl-i Sünnet ve'l-Cemaat arasında sabit olan ihtilafla kayıtlıdır. Allah en iyisini bilir."]]}]}, {"ts": "41:38", "title": "6. Külliye: Gayb türünden olan hiçbir şeyde mecaz yoktur", "paras": [{"reader": false, "ar": [[2498.0, "الكلية السادسة: <b>كلُّ ما كان من قبيل الغيب فلا مجاز فيه.<\/b> كلُّ ما كان من قبيل الغيب فلا مجاز فيه."], [2515.0, "ولعلكم في التفريغ تُدرجونها تحت قواعد الغيبيات فيما بعد إن شاء الله."], [2524.0, "كلُّ ما كان من قبيل الغيب فلا مجاز فيه."]], "tr": [[2498.0, "Altıncı külliye: <b>Gayb türünden olan hiçbir şeyde mecaz yoktur.<\/b> (Tekrar ediyor.) Belki deşifre sırasında bunu daha sonra, inşallah, gaybîlere dair kaidelerin altına yerleştirirsiniz."], [2515.0, "Gayb türünden olan hiçbir şeyde mecaz yoktur."]]}, {"reader": false, "ar": [[2530.0, "أقول وبالله التوفيق ـ بعد أن تضعوا الأقلام وتنتبهوا لي ـ أقول وبالله التوفيق:"], [2539.0, "اعلم رحمك الله تعالى أن المجاز ـ المجاز ـ عمليةٌ عقلية؛"], [2546.0, "بمعنى أن الواجب عليك أن تبقى على حقيقة الكلام،"], [2552.0, "فإذا أردت أن تنتقل منه ـ أي من الحقيقة ـ إلى المجاز،"], [2558.0, "فيُشترط قبل الانتقال أن يكون عقلك متصوِّرًا لكيفية الحقيقة."], [2566.0, "فكلُّ حقيقةٍ لم يتصوّرها العقل،"], [2572.0, "ولا تدخل تحت مدركاته،"], [2575.0, "فلا يحلّ الانتقال فيها من الحقيقة إلى المجاز،"], [2580.0, "لفوات الشرط. فلا حقَّ لأحدٍ أن يدّعي مجازًا في لفظةٍ إلا إذا كان عقله يتصوّر كيفيتها أولًا."]], "tr": [[2530.0, "Tevfik Allah'tandır, derim ki —kalemleri bırakıp beni dikkatle dinledikten sonra—, tevfik Allah'tandır, derim ki:"], [2539.0, "Bil ki —Allah Teâlâ sana rahmet etsin— mecaz aklî bir işlemdir."], [2546.0, "Yani sana düşen, sözün hakikati üzere kalmandır;"], [2552.0, "ondan, yani hakikatten mecaza geçmek istersen, geçişten önce aklının hakikatin keyfiyetini tasavvur ediyor olması şarttır."], [2558.0, "Aklın tasavvur etmediği ve idrak alanına girmeyen her hakikatte, şart bulunmadığı için hakikatten mecaza geçmek helal değildir."], [2575.0, "Hiç kimsenin bir lafızda mecaz iddia etmeye hakkı yoktur;"], [2580.0, "ancak aklı önce onun keyfiyetini tasavvur ediyorsa (bu hakkı olur)."]]}, {"reader": false, "ar": [[2595.0, "فلو قلتُ لكم: دخلتُ المسجد فإذا أسدٌ على المنبر يخطب،"], [2604.0, "فإن عقلك يعجز من حمل الأسد على حقيقته؛"], [2609.0, "لأن حقيقة الأسد وكيفيته يعرفها عقلك،"], [2615.0, "فبما أن عقلك يعرف هذه الكيفية فلك الحقُّ أن تنتقل من الحقيقة إلى المجاز،"], [2624.0, "وهو الخطيب القويّ المفوَّه."], [2628.0, "لكن إذا سمعت قول الله عز وجل:"], [2632.9, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span>، فهذه يدٌ غيبية،"], [2638.2, "عقلي لا يتصوّر كيفيتها؛"], [2642.0, "فما الذي يحملني أن أقول:"], [2644.7, "لا يُراد باليد حقيقتها وإنما يراد بها المجاز؟"], [2649.0, "أنت في هذه الحالة انتقلت من حقيقةٍ لم يدركها عقلك أصلًا،"], [2659.0, "فلم يتحقّق شرط الانتقال حتى تنتقل؛"], [2665.0, "لأن شرط الانتقال أن يكون العقل متصوِّرًا لكيفية اليدين."], [2673.0, "وهل يدُ الله يمكن معرفة كيفيتها؟ الجواب: بالطبع لا."]], "tr": [[2595.0, "Size \"Mescide girdim, bir de ne göreyim, minberde bir aslan hutbe veriyor\" desem, aklın aslanı hakikati üzere anlamaktan aciz kalır."], [2609.0, "Çünkü aslanın hakikatini ve keyfiyetini aklın bilir."], [2615.0, "Aklın bu keyfiyeti bildiğine göre, hakikatten mecaza, yani güçlü ve dili düzgün hatibe geçmeye hakkın vardır."], [2628.0, "Ama Allah Teâlâ'nın <span class=\"ayah\">﴿Bilakis O'nun iki eli de açıktır﴾<\/span> [Mâide 64] sözünü işittiğinde, bu gaybî bir eldir;"], [2632.9, "aklım onun keyfiyetini tasavvur etmez."], [2642.0, "\"Elden hakikati kastedilmez, mecaz kastedilir\" dememe beni sevk eden nedir?"], [2644.7, "Sen bu durumda aklının hiç idrak etmediği bir hakikatten geçiş yapmış oldun;"], [2649.0, "geçiş yapabilmen için geçiş şartı gerçekleşmedi."], [2659.0, "Çünkü geçişin şartı, aklın iki elin keyfiyetini tasavvur etmesidir."], [2665.0, "Allah'ın elinin keyfiyetini bilmek mümkün müdür? Cevap: Elbette hayır."]]}, {"reader": false, "ar": [[2679.0, "وإذا سمعتَ الله يقول:"], [2681.9, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span>،"], [2686.0, "فلا يحقّ لك أن تقول:"], [2689.0, "إنه لا يراد به الاستواء حقيقةً،"], [2692.6, "وإنما يراد به الاستيلاء؛"], [2695.0, "لأنك بهذا ـ نعم ـ تكون قد فررتَ من حقيقةٍ عقلُك لم يتصوّر كيفيتها،"]], "tr": [[2679.0, "Allah'ın <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5] dediğini işittiğinde, \"Bundan hakiki istivâ kastedilmez, istîlâ kastedilir\" demeye hakkın yoktur."], [2692.6, "Çünkü bununla —evet— aklının keyfiyetini tasavvur etmediği bir hakikatten kaçmış olursun;"]]}]}, {"ts": "45:00", "title": "6. Külliye (devam): Bid'at ehli önce temsil eder, sonra mecaza kaçar", "paras": [{"reader": false, "ar": [[2706.0, "لأن استواء الله لا يعلم كيفيته إلا الله؛"], [2710.0, "فما الذي جعلك تفرّ من حقيقةٍ يجهلها عقلك إلى مجاز؟"], [2715.0, "وإذا سمعت النبي صلى الله عليه وسلم يقول:"], [2720.0, "«ينزل ربُّنا»، فبعض الناس يقول:"], [2727.0, "إنه لا يراد به النزول حقيقةً،"], [2730.0, "وإنما يراد به نزول الملَك،"], [2734.0, "أو نزول الرحمة، أو نزول الأمر."], [2738.0, "فأنا أسألك: هل وُجد شرط الانتقال حتى تنتقل؟ الجواب: لم يوجد."]], "tr": [[2706.0, "Çünkü Allah'ın istivâsının keyfiyetini Allah'tan başkası bilmez."], [2710.0, "Seni aklının bilmediği bir hakikatten mecaza kaçmaya sevk eden nedir?"], [2715.0, "Nebî ﷺ'in \"Rabbimiz iner\" dediğini işittiğinde, bazı insanlar \"Bundan hakiki iniş kastedilmez;"], [2727.0, "meleğin inişi, rahmetin inişi ya da emrin inişi kastedilir\" der."], [2734.0, "Sana soruyorum: Geçiş yapabilmen için geçiş şartı bulundu mu? Cevap: Bulunmadı."]]}, {"reader": false, "ar": [[2748.0, "فهذا يبيّن لك حقيقةً أخرى في هؤلاء الذين ينتقلون في الغيبيات من الحقائق إلى المجازات:"], [2764.0, "وهي أنهم كيّفوا الغيب بما يقتضي صفات البشر،"], [2772.0, "فلما مثّلوا الكيفية الغائبة بالكيفية البشرية المشاهَدة حينئذٍ فرّوا من مماثلة الله عز وجل بخلقه."], [2787.0, "فلم يتصوّروا من اليد في قوله:"], [2791.0, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> إلا يدَ البشر،"], [2795.0, "فقالوا: لا يراد به اليد حقيقةً،"], [2798.3, "وإنما يراد به النعمة والقدرة."], [2801.0, "ولم يتصوّروا لما سمعوا قول الله عز وجل:"], [2807.0, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> إلا استواءَ الملِك على سرير ملكه البشري،"], [2815.0, "فأرادوا أن يفرّوا من هذه الحقيقة التي فرضتها عقولهم،"], [2823.0, "متغافلين عن قول الله: <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>."]], "tr": [[2748.0, "Bu, gaybîlerde hakikatlerden mecazlara geçen bu kimseler hakkında sana başka bir hakikati açıklar:"], [2748.0, "Onlar gaybı beşerin sıfatlarının gerektirdiği şekilde keyfiyetlendirdiler (tekyîf)."], [2772.0, "Görünmeyen keyfiyeti görünen beşerî keyfiyete benzetince, o zaman Allah Teâlâ'yı mahlûkatına benzetmekten kaçtılar."], [2787.0, "<span class=\"ayah\">﴿Bilakis O'nun iki eli de açıktır﴾<\/span> sözündeki elden beşerin elinden başkasını tasavvur etmediler ve \"Bundan hakiki el kastedilmez, nimet ve kudret kastedilir\" dediler."], [2801.0, "Allah Teâlâ'nın <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> sözünü işittiklerinde de beşerî hükümdarın tahtına oturmasından başkasını tasavvur etmediler;"], [2815.0, "Allah'ın <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11] sözünü görmezden gelerek, akıllarının farz ettiği bu hakikatten kaçmak istediler."]]}, {"reader": false, "ar": [[2828.0, "فالسبب الرئيس الذي يجعل أهل البدع يهربون من الحقيقة إلى المجاز هو أن عقولهم مثّلت الحقيقة،"], [2842.0, "فلما مثّلوا فرّوا. ولو أنهم ما مثّلوا ـ من يكمل؟"], [2852.0, "ـ ولو أنهم ما مثّلوا لما فرّوا."], [2855.0, "فلو سألتك وقلت: لماذا أهل السنة لا يفرّون من الحقائق الغيبية إلى المجازات؟"], [2863.0, "الجواب: لأنهم آمنوا بكيفياتها على الوجه اللائق بالله،"], [2869.0, "لم يدخلوا فيها متأوّلين بآرائهم ولا متوهّمين بأهوائهم،"], [2876.0, "فليس هناك داعٍ يدعوهم إلى الفرار من الحقيقة؛"], [2881.0, "فقالوا: نُثبت لله اليدين حقيقةً على الوجه اللائق به."], [2885.0, "لكن لما كان أهل البدع مثّلوا الصفات الغائبة بالصفات المشاهَدة فرّوا من هذه الحقيقة."]], "tr": [[2828.0, "Bid'at ehlini hakikatten mecaza kaçmaya sevk eden asıl sebep, akıllarının hakikati temsil etmesidir (benzetmesidir);"], [2842.0, "benzetince kaçtılar. Eğer benzetmeselerdi —kim tamamlar?— eğer benzetmeselerdi kaçmazlardı."], [2852.0, "Sana \"Ehl-i Sünnet neden gaybî hakikatlerden mecazlara kaçmaz?\" diye sorsam, cevap:"], [2855.0, "Çünkü onlar bunların keyfiyetlerine Allah'a yakışır şekilde iman ettiler;"], [2863.0, "bunlara ne görüşleriyle te'vil ederek ne de heveslerine göre vehme kapılarak girdiler."], [2876.0, "Onları hakikatten kaçmaya çağıran bir sebep yoktur."], [2881.0, "\"Allah'a iki eli, O'na yakışır şekilde hakiki olarak isbat ederiz\" dediler."], [2885.0, "Ama bid'at ehli görünmeyen sıfatları görünen sıfatlara benzetince bu hakikatten kaçtılar."]]}, {"reader": false, "ar": [[2899.0, "والعجيب أنهم يصفوننا بالمجسّمة الذين يمثّلون الله بصفات خلقه!"], [2911.0, "وهل نحن مثّلنا؟ ما مثّلنا،"], [2915.0, "ولذلك ما فررنا. لكن أنتم من جعل صفات الله كصفات خلقه،"], [2922.0, "ولذلك فررتم. فمن أحقُّ بوصف التجسيم:"], [2927.0, "نحن أو أنتم؟ نحن أو أنتم؟"], [2936.0, "الجواب: أنتم. ولكن الأمر يُعكس عندهم تضليلًا ومخادعةً وزخرفة."]], "tr": [[2899.0, "İşin tuhafı, bizi Allah'ı mahlûkatının sıfatlarına benzeten mücessime (cisimleştirenler) olmakla niteliyorlar!"], [2911.0, "Biz benzettik mi? Benzetmedik; bu yüzden kaçmadık."], [2915.0, "Ama Allah'ın sıfatlarını mahlûkatının sıfatları gibi yapan sizsiniz;"], [2922.0, "bu yüzden kaçtınız. Tecsim vasfına kim daha lâyıktır:"], [2927.0, "biz mi siz mi? Biz mi siz mi?"], [2936.0, "Cevap: Siz. Ama saptırma, aldatma ve süsleme yoluyla iş onlarda tersine çevrilir."]]}, {"reader": false, "ar": [[2947.0, "فقرّر العلماء هذه الكلية العظيمة:"], [2950.0, "بأنه لا مجاز في الغيبيات."], [2954.0, "لماذا؟ لأن من شرط القول بالمجاز العلمَ بالكيفية،"], [2958.0, "وبما أن الأمر غيبيٌّ لا يدخل تحت مدركات العقول،"], [2962.0, "فننفي عنه المجاز لفوات الشرط."], [2965.0, "عرفتم؟ أجيبوا: عرفتم أم ما عرفتم؟"], [2971.0, "لو سألتكم سؤالًا: لماذا لا تقولون ـ يا أهل السنة ـ بالمجاز في الغيبيات؟"], [2979.1, "لماذا؟ لأن من شرط المجاز معرفةَ الحقيقة والكيفية،"], [2985.0, "وبما أنها غيبيات ـ وبما أنها غيبيات ـ لا يعرف عقلي كيفيتها،"], [2991.0, "فلا أنتقل من حقيقتها إلى مجازاتها،"], [2995.0, "لفوات شرط الانتقال. والله أعلم."]], "tr": [[2947.0, "Âlimler bu büyük külliyeyi takrir ettiler:"], [2947.0, "Gaybîlerde mecaz yoktur. Neden? Çünkü mecaz demenin şartı keyfiyeti bilmektir."], [2954.0, "İş gaybî olup akılların idrak alanına girmediğine göre, şart bulunmadığı için ondan mecazı nefyederiz."], [2962.0, "Anladınız mı? Cevap verin: Anladınız mı, anlamadınız mı?"], [2971.0, "Size bir soru sorsam: Ey Ehl-i Sünnet, gaybîlerde neden mecaz demiyorsunuz?"], [2971.0, "Neden? Çünkü mecazın şartı hakikati ve keyfiyeti bilmektir."], [2979.1, "Bunlar gaybî olduğuna göre —(tekrar ediyor)— aklım keyfiyetlerini bilmez;"], [2985.0, "dolayısıyla geçiş şartı bulunmadığı için onların hakikatinden mecazlarına geçmem. Allah en iyisini bilir."]]}]}, {"ts": "50:00", "title": "7. Külliye: Akıl gaybda hayrete düşebilir ama onu imkânsız görmez", "paras": [{"reader": false, "ar": [[3000.0, "ومن الكليات أيضًا: كلُّ الغيب قد يَحار فيه العقل،"], [3014.0, "ولكن لا يُحيله. كلُّ الغيب فقد يحار فيه العقل ولكن لا يُحيله."], [3027.0, "أقول وبالله التوفيق: إن الله عز وجل هو الذي أنزل النصَّ كتابًا وسنة،"], [3040.0, "وفي ذات الوقت هو الذي خلق العقل؛"], [3045.0, "فلا يمكن أن يكون الذي أنزل النصَّ يجعله متعارضًا مع العقل الذي خلقه."], [3054.0, "فالنصوص لا تعارض العقول مطلقًا،"], [3058.0, "ولكن أحيانًا تأتي النصوص بغيبياتٍ تجعل العقل في حيرة،"], [3065.0, "لأن معنى الغيب أوسع من مدركات العقل."]], "tr": [[3000.0, "Külliyelerden biri de şudur: <b>Akıl gaybın tamamında hayrete düşebilir, ama onu imkânsız görmez.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [3027.0, "Nassı Kitap ve Sünnet olarak indiren Allah Teâlâ'dır;"], [3027.0, "aynı zamanda aklı yaratan da O'dur."], [3040.0, "Nassı indirenin, onu yarattığı akılla çelişkili kılması mümkün değildir."], [3045.0, "Naslar akıllarla asla çelişmez; ama bazen naslar aklı hayrete düşüren gaybî şeyler getirir."], [3058.0, "Çünkü gaybın manası aklın idrak alanından daha geniştir."]]}, {"reader": false, "ar": [[3070.0, "فالله عز وجل جعل مدركات العقل محصورةً ضعيفةً عاجزةً عن إدراك الغيب بكلِّ متعلّقاته،"], [3080.0, "فالغيب أوسع من العقل."], [3086.0, "فلوجود هذا الفرقان العظيم بين المعنى الغيبي والخَلق العقلي <span class=\"q\">؟ 51:31<\/span> ـ أو الضعف العقلي ـ فيكون العقل في حيرةٍ من هذا النص،"], [3100.0, "لكن حيرته لا تُلزم استحالةَ مدلول النص."], [3106.1, "فلا بدّ أن تفرّق بين حيرة العقل واستحالة الشيء."]], "tr": [[3070.0, "Allah Teâlâ aklın idrak alanını, gaybı bütün taallukatıyla idrak etmekten aciz, sınırlı ve zayıf kılmıştır;"], [3070.0, "gayb akıldan daha geniştir. Gaybî mana ile aklın yaratılışı <span class=\"q\">؟<\/span> —ya da aklın zayıflığı— arasındaki bu büyük fark sebebiyle akıl bu nas karşısında hayrete düşer;"], [3086.0, "ama onun hayreti, nassın delâlet ettiği şeyin imkânsız olmasını gerektirmez."], [3100.0, "Aklın hayreti ile bir şeyin imkânsızlığı arasını ayırman şarttır."]]}, {"reader": false, "ar": [[3116.0, "وأضرب لك مثالًا حتى يتبيّن لك الأمر:"], [3119.0, "فإنك لو نظرتَ إلى هذا الجوّال وهو يعمل معك،"], [3125.0, "وأنت تنتقل بين تطبيقاته والمواقع فيه ـ أسألك بالله ـ أوَلا يستغرب عقلك ويحار:"], [3134.0, "كيف صُنع؟ لكن حيرته هل تمنع صنعه وعمله؟"], [3140.0, "فعقلك لا يُحيل عمله وأنه يمكن صناعته،"], [3147.0, "لكن طريقة عمله تجعلني في حيرة:"], [3151.0, "ما هذه العقلية الفذّة التي صنعت هذا الجهاز بهذه الصورة التي يحار فيها العقل؟"], [3159.0, "ففرقانٌ بين حيرة العقل وبين استحالة وقوع الشيء."]], "tr": [[3116.0, "Mesele sana açıklık kazansın diye bir örnek vereyim:"], [3119.0, "Seninle çalışırken, uygulamaları ve içindeki siteler arasında gezinirken şu cep telefonuna baksan —Allah aşkına soruyorum— aklın \"Nasıl yapıldı?\" diye şaşırıp hayrete düşmez mi?"], [3134.0, "Ama onun hayreti, telefonun yapılmasına ve çalışmasına engel olur mu?"], [3140.0, "Aklın onun çalışmasını ve yapılabileceğini imkânsız görmez;"], [3147.0, "ama çalışma şekli beni hayrete düşürür:"], [3151.0, "Bu cihazı aklın hayrete düştüğü bu şekilde yapan bu eşsiz zekâ nedir?"], [3151.0, "Aklın hayreti ile bir şeyin meydana gelmesinin imkânsızlığı arasında fark vardır."]]}, {"reader": false, "ar": [[3167.0, "فإذا أخبر القرآن بالغيب فهو حقٌّ واقع،"], [3171.0, "وإن كان العقل يحار فيه."], [3174.0, "أوَليس العقل يحار في أن السماوات السبع والأرضين السبع بالنسبة للكرسي ما هي إلا كحلقةٍ معدنيةٍ صغيرةٍ قد أُلقيت في أرضٍ فلاة؟"], [3190.0, "أوَليس العقل يحار في ذلك؟"], [3192.0, "لكن حيرته لا تُلزم استحالة هذا الشيء،"], [3194.0, "فهو حقٌّ واقع وإن كان عقلك يحار فيه."], [3198.0, "فإياك أن تجعل عجز عقلك دليلًا على امتناع دلالة النص؛"], [3203.0, "بمعنى أن عقلك إذا حار في شيءٍ فلا تجعل حيرته دليلًا على امتناع الشيء."], [3213.0, "فالشيء موجودٌ وحقٌّ وواقع،"], [3215.8, "وإن كان عقلك عاجزًا عن إدراكه."]], "tr": [[3167.0, "Kur'an gaybdan haber verdiğinde o, gerçekleşmiş bir haktır;"], [3171.0, "akıl onda hayrete düşse bile."], [3174.0, "Yedi gök ve yedi yerin, Kürsî'ye nispetle çöl gibi bir araziye atılmış küçük bir metal halkadan başka bir şey olmamasına akıl hayrete düşmez mi?"], [3174.0, "Akıl buna hayrete düşmez mi?"], [3190.0, "Ama onun hayreti bu şeyin imkânsızlığını gerektirmez;"], [3192.0, "aklın ona hayrete düşse de o, gerçekleşmiş bir haktır."], [3194.0, "Sakın aklının acizliğini nassın delâletinin imkânsızlığına delil yapma."], [3198.0, "Yani aklın bir şeyde hayrete düşerse, onun hayretini o şeyin imkânsızlığına delil yapma."], [3203.0, "Aklın onu idrak etmekten aciz olsa da o şey mevcuttur, haktır ve gerçekleşmiştir."]]}, {"reader": false, "ar": [[3220.0, "ذلك لأن بعض أهل البدع يجعلون حيرة عقولهم في الغيب دليلًا على امتناع الغيب."], [3231.0, "فكيف أُنكر عذابُ القبر؟"], [3237.0, "لأنه أمرٌ غيبيٌّ جاء بشيءٍ أعظم من طاقة العقل؛"], [3243.0, "فلما نظروا في أدلة عذاب القبر بعقولهم حارت عقولهم فيه،"], [3251.0, "فجعلوا حيرتها دليلًا على إنكار عذاب القبر."], [3255.0, "لا تلازم أبدًا بين حيرة العقل وامتناع الشيء؛"], [3262.0, "كما قلت لكم: العقل يحار في بعض المخترعات والصناعات،"], [3266.0, "ولكن حيرته شيءٌ ووجودها شيءٌ آخر."], [3270.0, "فلا تلازم عندنا ـ معاشرَ أهل السنة والجماعة ـ بين حيرة العقل وإحالته للشيء؛"], [3281.0, "فليس كلُّ شيءٍ حار العقل فيه يكون ممتنعًا مستحيلًا،"], [3286.0, "يكون ممتنعًا مستحيلًا، أليس كذلك؟"]], "tr": [[3220.0, "Bunu söylememin sebebi şudur: Bazı bid'at ehli, akıllarının gayb karşısındaki hayretini gaybın imkânsızlığına delil yaparlar."], [3231.0, "Kabir azabı nasıl inkâr edildi?"], [3237.0, "Çünkü o, aklın gücünden daha büyük bir şey getiren gaybî bir iştir."], [3243.0, "Kabir azabının delillerine akıllarıyla bakınca akılları onda hayrete düştü;"], [3251.0, "onun hayretini de kabir azabını inkâra delil yaptılar."], [3255.0, "Aklın hayreti ile bir şeyin imkânsızlığı arasında asla bir telâzüm (zorunlu bağ) yoktur."], [3262.0, "Size dediğim gibi, akıl bazı icatlar ve sanayi ürünleri karşısında hayrete düşer;"], [3266.0, "ama onun hayreti bir şeydir, onların varlığı başka bir şey."], [3270.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğu nezdinde aklın hayreti ile bir şeyi imkânsız görmesi arasında telâzüm yoktur."], [3281.0, "Aklın hayrete düştüğü her şey imkânsız ve muhal değildir; değil mi?"]]}, {"reader": false, "ar": [[3291.0, "ومثالٌ آخر: الإسراء والمعراج، حادثتان سماويةٌ وأرضية"]], "tr": [[3291.0, "Başka bir örnek: İsrâ ve Mi'râc;"], [3291.0, "biri semavî, biri arzî iki hadise —"]]}]}, {"ts": "55:00", "title": "7. Külliye (devam): İsrâ-Mi'râc ve Allah'ın dolu eli", "paras": [{"reader": false, "ar": [[3301.0, "يحار العقل فيها؛ فإن العقل يفرض أن البشر لا يمكن أن يقطع هذه المسافة في هذه السرعة ـ العقل القديم ـ أما الآن فتستطيع أن تطير من مكة بالطائرة إلى فلسطين في ليلةٍ واحدة،"], [3321.0, "لكن العقل العربي الجاهلي القديم كان ذلك (عنده) مستحيلًا."], [3325.0, "ثم ينتقل بعد ذلك إلى السماوات السبع في هذه السرعة،"], [3331.2, "ويرجع في ليلة! وهذا هو الذي لم تستطع البشرية صنعَ مثله إلى الآن."], [3337.0, "فالسفرة الأرضية قد وُجد فيها مخترعاتٌ تيسّر فهمها،"], [3345.0, "لكن السفرة السماوية لم تستطع البشرية ومخترعاتها وقواها أن تصنع مثل هذه الآلة، وهي آلة المعراج."]], "tr": [[3301.0, "— akıl onlarda hayrete düşer."], [3301.0, "Çünkü akıl, bir beşerin bu mesafeyi bu hızla katetmesinin mümkün olmadığını farz eder;"], [3301.0, "eski akıl (böyleydi). Şimdi ise tek bir gecede Mekke'den Filistin'e uçakla uçabilirsin;"], [3321.0, "ama eski Arap cahiliye aklına göre bu imkânsızdı."], [3321.0, "Sonra bundan sonra bu hızla yedi göğe yükseliyor ve bir gecede dönüyor!"], [3331.2, "İşte insanlığın şimdiye kadar benzerini yapamadığı şey budur."], [3331.2, "Arzî yolculukta onu anlamayı kolaylaştıran icatlar bulundu;"], [3345.0, "ama semavî yolculukta insanlık, icatları ve güçleriyle bu aletin, yani mi'râc aletinin benzerini yapamadı."]]}, {"reader": false, "ar": [[3357.0, "فعقلي يحار، لكن هل حيرته تجعلني أُنكر هذه الحوادث؟"], [3366.0, "الجواب: بالطبع لا. فكلُّ من أنكر هذه الحوادث إنما سببُ إنكاره لها حيرةُ عقله فيها؛"], [3377.0, "فجعلوا حيرة عقولهم دليلًا على عدم وقوع هذه الحوادث."], [3383.0, "ما أدري: أنتم فاهمينني ولّا لا؟ واضح جدًّا."]], "tr": [[3357.0, "Aklım hayrete düşer; ama onun hayreti beni bu hadiseleri inkâr etmeye mi sevk eder?"], [3366.0, "Cevap: Elbette hayır. Bu hadiseleri inkâr eden herkesin inkârının sebebi, aklının onlar karşısındaki hayretidir;"], [3377.0, "akıllarının hayretini bu hadiselerin gerçekleşmediğine delil yaptılar."], [3383.0, "Bilmiyorum, beni anlıyor musunuz, anlamıyor musunuz? Çok açık."]]}, {"reader": false, "ar": [[3389.0, "وكذلك أيضًا لو نظرنا إلى أن «يدَ الله عز وجل ملأى» بالخير،"], [3399.0, "«لا يَغيضُها نفقةٌ، سحّاءُ الليلَ والنهار، أرأيتم ما أنفق منذ خلق السماوات والأرض، فإنه لم يَغِضْ» ـ أي لم يُنقص ـ «ما في يمينه» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [3413.0, "هذا شيءٌ يحار فيه العقل البشري،"], [3420.0, "لكن حيرته لا تُحيله؛"], [3424.0, "فيبقى أنه حقيقةٌ يجب اعتقادها وإثباتها،"], [3430.0, "مع الاعتراف الكامل بأن عقولنا تحار في هذه الصفة العظيمة."], [3439.0, "وهكذا دواليك في كثيرٍ من المسائل."]], "tr": [[3389.0, "Aynı şekilde \"Allah Teâlâ'nın eli (hayırla) doludur;"], [3389.0, "hiçbir harcama onu eksiltmez; gece gündüz bol bol akıtır."], [3399.0, "Gökleri ve yeri yarattığından beri ne kadar infak ettiğini görmüyor musunuz?"], [3399.0, "Bu, O'nun sağ elindekini eksiltmemiştir\" <span class=\"note\">(Buhârî, Müslim)<\/span> (hadisine) baksak:"], [3399.0, "Bu, beşer aklının hayrete düştüğü bir şeydir;"], [3413.0, "ama onun hayreti onu imkânsız kılmaz."], [3420.0, "Aklımızın bu büyük sıfat karşısında hayrete düştüğünü tam olarak itiraf etm
