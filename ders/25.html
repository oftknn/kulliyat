<script>
const D={"no": 25, "vid": "bCKO9bjIjsA", "title_ar": "الدرس (٢٥) من شرح كليات العقيدة — تتمة كليات البدع", "title_tr": "Şerhu Külliyyâti'l-Akîde — 25. Ders: Bid'ate Dair Külliyeler (devam): Mubahla Taabbud, Gayb, Zayıf Hadis, Gulüv ve Mubahı Terk", "sections": [{"ts": "00:00", "title": "1. Külliye: Mubahla bizzat taabbud eden bid'atçidir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.2, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.6, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.4, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [11.7, "أمّا بعد: فلا نزال ـ ولله الحمدُ والمنّة ـ في شرح الكلّيّات العقديّة،"], [17.9, "ولا نزال أيضًا فيما يتعلّق بكلّيّات البدع،"], [22.4, "وقد أخذنا منها جُمَلًا طيّبةً في درسين أو ثلاثة،"], [27.4, "وها نحن نُكمل ـ بإذن الله عز وجل ـ ما يتيسّر منها."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.7, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [8.9, "Bundan sonra: Hamd ve minnet Allah'a olsun, hâlâ akîde külliyelerinin şerhindeyiz;"], [12.9, "yine hâlâ bid'at külliyeleriyle ilgili kısımdayız."], [17.3, "Bunlardan iki üç derste güzel bir kısmını gördük;"], [24.6, "işte şimdi Allah Azze ve Celle'nin izniyle kolayımıza geleni tamamlıyoruz."]]}, {"reader": false, "ar": [[33.0, "من القواعد، أو من الكلّيّات:"], [38.0, "<b>كلُّ متعبِّدٍ بالمباح لذاته فمبتدع.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[33.0, "Kaidelerden, ya da külliyelerden biri:"], [35.4, "<b>1. külliye: Mubahla bizzat kendisi için taabbud eden herkes bid'atçidir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[62.0, "أقول وبالله التوفيق: وذلك لأنّ العبادة لا بدّ أن توصف بواحدٍ من وصفين:"], [74.0, "إمّا أن تكون عبادةً واجبة،"], [77.5, "وإمّا أن تكون عبادةً مستحبّة."], [81.0, "فالله عز وجل لا يُعبَد إلا بالواجبات أو المستحبّات فعلًا،"], [87.0, "ويُتعبَّد له بترك المحرّمات والمكروهات تركًا."], [95.0, "فإذا قيل لك: ما دائرة التعبُّدات؟"], [98.3, "فقل: فعلٌ وترك. فأمّا في دائرة الفعل فيدخل التعبُّد لله عز وجل بالواجبات والمندوبات،"], [107.0, "وأمّا في دائرة الترك فيُتعبَّد لله عز وجل بترك المحرّمات وبترك المكروهات."]], "tr": [[62.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [68.1, "İbadet iki vasıftan biriyle nitelenmek zorundadır:"], [74.0, "Ya vacip bir ibadettir ya da müstehap bir ibadettir."], [81.0, "Allah Azze ve Celle'ye yapma yönüyle ancak vaciplerle veya müstehaplarla ibadet edilir;"], [86.4, "terk yönüyle de haramları ve mekruhları terk ederek O'na taabbud edilir."], [96.7, "Sana \"Taabbudların dairesi nedir?\" denirse, de ki:"], [100.0, "Yapmak ve terk etmek. Yapma dairesine, vacipler ve mendupla Allah Azze ve Celle'ye taabbud girer;"], [107.0, "terk dairesinde ise haramları ve mekruhları terk ederek Allah Azze ve Celle'ye taabbud edilir."]]}, {"reader": false, "ar": [[115.0, "وبقي عندنا من الأحكام التكليفية الخمسة:"], [119.3, "المباح، الذي لا يدخل في دائرة ما طُلب فعلُه،"], [125.1, "ولا في دائرة ما يُطلب تركُه."], [129.0, "فهذا المباح بالنظر إلى ذاته لا يجوز أن يُتعبَّد لله عز وجل به؛"], [137.0, "بمعنى أنّ الإنسان لا يتعبّد لله عز وجل بالأكل لذات الأكل،"], [143.0, "ولا بالنوم لذات النوم،"], [146.0, "ولا بالبيع والشراء لذات البيع والشراء،"], [150.0, "ولا بلُبس الثوب لذات اللباس؛"], [156.0, "لأنّ المباح بالنظر إلى ذاته لا يتعلّق به طلبُ فعلٍ ولا طلبُ ترك."], [164.0, "فلا يجوز للإنسان أبدًا أن يجعل المباحَ مَهْيَعًا أو دائرةً يتعبّد اللهَ عز وجل بها."]], "tr": [[115.0, "Beş teklîfî hükümden geriye mubah kaldı:"], [119.3, "Ne yapılması istenenler dairesine ne de terk edilmesi istenenler dairesine girer."], [129.0, "Bu mubahla, zâtı itibarıyla Allah Azze ve Celle'ye taabbud edilmesi caiz değildir."], [137.0, "Yani insan yemek yemenin kendisi için yemekle, uykunun kendisi için uykuyla, alışverişin kendisi için alışverişle, giyinmenin kendisi için elbise giymekle Allah Azze ve Celle'ye taabbud etmez."], [156.0, "Çünkü mubaha, zâtı itibarıyla ne yapma talebi ne de terk talebi taalluk eder."], [164.0, "Dolayısıyla insanın mubahı, Allah Azze ve Celle'ye onunla taabbud ettiği bir yol veya daire hâline getirmesi asla caiz değildir."]]}, {"reader": false, "ar": [[174.0, "فإن قلتَ: وهل يمكن أن يُتعبَّد لله عز وجل بالمباح؟"], [179.0, "الجواب: نعم، لكن لا لذاته،"], [182.6, "وإنما بنيّته وهيئته. فالمباح لا يدخل في دائرة القُرُبات والتعبُّدات إلا بالنظر إلى نيّته وهيئته،"], [194.0, "فبهذين الأمرين ينقلب المباحُ قربةً وطاعة."], [201.0, "فإذا أكل الإنسان فلا ينبغي أن يتعبّد لله عز وجل بذات الأكل،"], [208.0, "ولكن يتعبّد لله عز وجل بنيّة التقوّي على طاعته بهذا الأكل،"], [214.0, "فصار المباح عبادةً بنيّته."]], "tr": [[174.0, "Şayet \"Mubahla Allah Azze ve Celle'ye taabbud edilebilir mi?\" dersen, cevap:"], [179.0, "Evet; fakat zâtı için değil, ancak niyeti ve hey'eti (yapılış şekli) sebebiyle."], [186.0, "Mubah, kurbetler ve taabbudlar dairesine ancak niyeti ve hey'eti itibarıyla girer;"], [192.7, "bu iki şeyle mubah, kurbete ve taate dönüşür."], [201.0, "İnsan yemek yediğinde yemenin kendisiyle Allah Azze ve Celle'ye taabbud etmemelidir;"], [206.2, "fakat bu yemekle O'na itaate güç kazanma niyetiyle Allah Azze ve Celle'ye taabbud eder."], [212.9, "Böylece mubah, niyetiyle ibadet olmuş olur."]]}, {"reader": false, "ar": [[217.0, "وبصفة إيقاع الأكل: بأن يأكل بالأصابع الثلاث،"], [223.0, "وأن يُثلِّث مأكولَه، وأن يأكل ممّا يليه،"], [229.0, "وأن يأكل بيده اليمنى،"], [231.9, "وأن يُسمّي عند الابتداء،"], [235.0, "وأن يحمد عند الانتهاء."], [237.0, "فالمباح لا يكون عبادةً لله عز وجل بالنظر إلى ذاته،"], [242.0, "وإنما يكون عبادةً بالنظر إلى نيّة إيقاعه وهيئة إيقاعه؛"], [248.0, "لأنّ الهيئة هي المشروعة،"], [250.3, "وهي التي يُتقرَّب بها إلى الله عز وجل."]], "tr": [[217.0, "(Ayrıca) yemeği yapış şekliyle de (ibadet olur):"], [223.0, "Üç parmakla yemesi, yediğini üçe bölmesi, önünden yemesi, sağ eliyle yemesi, başlarken besmele çekmesi ve bitirince hamd etmesi gibi."], [237.0, "Mubah, zâtı itibarıyla Allah Azze ve Celle'ye ibadet olmaz;"], [241.5, "ancak yapılış niyeti ve yapılış hey'eti itibarıyla ibadet olur."], [248.0, "Çünkü meşru olan hey'ettir; Allah Azze ve Celle'ye kendisiyle yaklaşılan da odur."]]}]}, {"ts": "04:15", "title": "1. Külliye (devam): Uyku, giyim ve meslek — mubahlar niyet ve hey'etle ibadete dönüşür", "paras": [{"reader": false, "ar": [[255.0, "وكذلك النوم: فإنه لا ينبغي للعبد أن يتعبّد لله عز وجل بالنوم لذاته،"], [263.0, "وإنما يتعبّد لله عز وجل بنيّة نومه للتقوّي على طاعة الله،"], [269.0, "فصار النوم مقرونًا بهذه النيّة عبادة."], [273.0, "وبصفة النوم الشرعية: بأن يتوضّأ قبل أن ينام،"], [278.0, "وأن يقول الأذكار المشروعة قبل نومه،"], [282.0, "وأن يضطجع على شِقّه الأيمن،"], [285.0, "وأن يكون نومه بعد العشاء بفترةٍ يسيرةٍ مثلًا؛"], [289.0, "لأنّ النبيّ صلى الله عليه وسلم «كان يكره النومَ قبل العشاء والحديثَ بعدها»."], [296.0, "فإذا فعلتَ هذا المباحَ بنيّته المشروعة وبهيئته المشروعة انقلب إلى قربةٍ وإلى طاعة."]], "tr": [[255.0, "Uyku da böyledir: Kulun, uykunun kendisi için uyumakla Allah Azze ve Celle'ye taabbud etmemesi gerekir;"], [262.4, "ancak Allah'a itaate güç kazanmak için uyuma niyetiyle Allah Azze ve Celle'ye taabbud eder."], [269.0, "Böylece bu niyetle birlikte uyku ibadet olur."], [273.0, "Uykunun şer'î şekliyle de (ibadet olur):"], [276.1, "Uyumadan önce abdest alması, uykusundan önce meşru zikirleri söylemesi, sağ yanına yatması ve mesela uykusunun yatsıdan kısa bir süre sonra olması gibi."], [289.0, "Çünkü Nebî ﷺ \"yatsıdan önce uyumayı ve ondan sonra sohbet etmeyi hoş görmezdi.\" Bu mubahı meşru niyetiyle ve meşru hey'etiyle yaptığında o, kurbete ve taate dönüşür."]]}, {"reader": false, "ar": [[310.0, "وكذلك لُبس الثياب: فإنّ الإنسان لا ينبغي أن يتعبّد لله عز وجل باللُّبس لذاته،"], [320.0, "ولكن بنيّة اللباس: أن يستر عورته عن الناس،"], [324.0, "وأن يمتثل أمر الله عز وجل في ذلك،"], [328.0, "وبأن يُظهر نعمة الله عز وجل عليه،"], [332.7, "وبأن يلبس اللباس المشروع في طوله وفي هيئته."], [338.0, "بل لو لبس الثوب الأبيض أو اللباسَ ـ أو لباسَ البياض ـ متعبّدًا لله عز وجل بتطبيق قول النبيّ ـ بامتثال قول النبيّ صلى الله عليه وسلم ـ:"], [349.0, "«البَسوا من ثيابكم البياض»،"], [351.0, "لكان لباسُه في هذه الحالة بتلك النيّة وتلك الهيئة طاعةً وقربة."]], "tr": [[310.0, "Elbise giymek de böyledir: İnsanın giyinmenin kendisi için giyinmekle Allah Azze ve Celle'ye taabbud etmemesi gerekir;"], [318.1, "fakat giyinme niyetiyle (taabbud eder):"], [321.5, "Avretini insanlardan örtmek ve bu konuda Allah Azze ve Celle'nin emrine uymak (niyetiyle);"], [327.5, "Allah Azze ve Celle'nin kendisi üzerindeki nimetini göstermesiyle ve uzunluğu ve şekli bakımından meşru elbiseyi giymesiyle."], [338.0, "Hatta beyaz elbise ya da beyaz giysi giyse, Nebî'nin sözünü uygulayarak —Nebî ﷺ'in \"Elbiselerinizin beyazını giyin\" sözüne uyarak— Allah Azze ve Celle'ye taabbud etse, bu durumda o niyet ve o hey'etle giyinmesi taat ve kurbet olur."]]}, {"reader": false, "ar": [[358.0, "وكذلك الوظيفة: فإنها من الأمور المباحة،"], [368.0, "فلا ينبغي أن يجعلها الإنسان عبادةً لله عز وجل بالنظر إلى ذاتها،"], [374.0, "ولكن يجعلها عبادةً باعتبار نيّتها:"], [377.0, "وهي أن يجعلها وسيلةً لكسب المال الحلال،"], [381.0, "ليكُفّ بها وجهَه ووجهَ أهله عن الناس،"], [385.0, "وليقوم بواجب الشرع عليه من النفقة أو الصدقة أو غير ذلك من الأمور الواجبة أو المندوبة في المال،"], [393.0, "فتنقلب وظيفته إلى قربةٍ وطاعة."]], "tr": [[358.0, "Meslek (iş) de böyledir: O mubah işlerdendir."], [368.5, "İnsanın onu zâtı itibarıyla Allah Azze ve Celle'ye ibadet kılmaması gerekir;"], [374.0, "fakat niyeti itibarıyla ibadet kılar:"], [377.0, "Onu, kendisini ve ailesini insanlara el açmaktan koruyacağı helal mal kazanmaya vesile kılması ve nafaka, sadaka ya da malda vacip veya mendup olan diğer işler gibi şeriatin üzerine yüklediği vazifeyi yerine getirmesi için (çalışması)."], [392.6, "Böylece mesleği kurbete ve taate dönüşür."]]}, {"reader": false, "ar": [[398.0, "ولذلك قرّر العلماء هنا قاعدةً تقول:"], [402.1, "المباحات تنقلب إلى عباداتٍ بالنيّات والهيئات،"], [406.1, "المباحات تنقلب عباداتٍ بالنيّات والهيئات."], [409.0, "والذي يخصّنا هنا هو أنّ من جملة ما تُعرف به البدعة:"], [416.1, "أن يتعبّد المسلم أو المكلَّف لله عز وجل بالمباح لذاته."], [424.0, "وإذا قلتُ: «بذاته» أعني به:"], [427.1, "أنه لا يَرِد عليه شيءٌ ينقله من المباح إلى القربة والطاعة،"], [434.0, "من هيئةٍ أو نيّة."]], "tr": [[398.0, "Bu yüzden âlimler burada şöyle diyen bir kaide koymuşlardır:"], [402.1, "Mubahlar niyetler ve hey'etlerle ibadetlere dönüşür;"], [405.5, "mubahlar niyetler ve hey'etlerle ibadetlere dönüşür."], [409.0, "Burada bizi ilgilendiren şudur: Bid'atin kendisiyle tanındığı şeylerden biri, Müslümanın veya mükellefin mubahla bizzat kendisi için Allah Azze ve Celle'ye taabbud etmesidir."], [424.0, "\"Bizzat kendisi için\" dediğimde şunu kastediyorum:"], [427.1, "Ona, onu mubahlıktan kurbete ve taate taşıyacak bir hey'et veya niyet gibi bir şey eklenmemiş olması."]]}]}, {"ts": "07:20", "title": "2. Külliye: Delilsiz gayb isbat eden herkes bid'atçidir", "paras": [{"reader": false, "ar": [[437.0, "ومن الكلّيّات أيضًا: <b>كلُّ من أثبت غيبًا بلا دليلٍ فمبتدع.<\/b> <span class=\"note\">(يكررها)<\/span> وذلك لأنّ المتقرّر عند العلماء أنّ الغيب مبنيٌّ على التوقيف،"], [470.0, "أي: على ثبوت الدليل الصحيح الصريح به؛"], [473.0, "فما كان غيبيًّا فيكون توقيفيًّا."]], "tr": [[437.0, "Külliyelerden biri de şudur: 2."], [440.0, "külliye: Delilsiz bir gayb isbat eden herkes bid'atçidir. (Tekrar ediyor.) Bu şundandır:"], [465.5, "Âlimler nezdinde yerleşik olan şudur:"], [470.4, "Gayb, tevkîfe, yani onu bildiren sahih ve sarih delilin sübûtuna dayanır."], [473.0, "Gaybî olan şey tevkîfî olur."]]}, {"reader": false, "ar": [[480.0, "فمتى ما رأيتَ الإنسان يتخبّط أو يتخوّض في شيءٍ من الغيبيات العُلويّة،"], [487.0, "أو الغيبيات السُّفليّة التي غابت عن حواسّه،"], [494.0, "فيقول: إنّ من الغيب كذا وكذا،"], [499.0, "فاعلم أنه مباشرةً مفتتحٌ ـ فاعلم أنه يريد افتتاحَ باب بدعة."], [506.0, "وكم من الغيبيات التي يتفوّه بها أهلُ البدع بلا دليلٍ ولا برهان!"]], "tr": [[480.0, "İnsanın, duyularından gizli kalmış yukarı âleme ait gaybî şeylerden veya aşağı âleme ait gaybî şeylerden birine dair gelişigüzel konuştuğunu ya da ona daldığını ve \"Gaybdan şu şu vardır\" dediğini gördüğünde bil ki o doğrudan açmaktadır —bil ki bir bid'at kapısı açmak istemektedir."], [506.0, "Bid'at ehlinin delilsiz ve burhansız ağızlarına aldıkları nice gaybî şey vardır!"]]}, {"reader": false, "ar": [[513.0, "فإنّ من الناس من يُثبت فضيلةً لعملٍ من الأعمال في زمانٍ معيّنٍ أو مكانٍ معيّن،"], [522.0, "ومن المعلوم المتقرّر أنّ الفضائل غيبية،"], [527.0, "فلا يجوز أن تَثبت فضيلةٌ لتعبُّدٍ قوليٍّ أو عمليٍّ إلا وعلى ذلك دليلٌ خاصّ."], [536.0, "وتجد أنّ بعض الناس يدّعي أنّ الميّت ينتفع بوضع الأغصان الرطبة على قبره،"], [545.0, "مع أنّ انتفاعه من الأمور الغيبية التي لا يجوز إثباتها إلا بالنصّ."]], "tr": [[513.0, "İnsanlardan kimi, belirli bir zamanda veya belirli bir mekânda amellerden birine bir fazilet isbat eder."], [521.3, "Hâlbuki bilinen ve yerleşik olan şudur:"], [525.1, "Faziletler gaybîdir. Kavlî veya amelî bir taabbud için, ona dair hususi bir delil olmadıkça fazilet sabit olmaz."], [536.0, "Bazı insanların, kabrinin üzerine yaş dallar konulmasıyla ölünün fayda göreceğini iddia ettiğini görürsün."], [545.0, "Hâlbuki onun fayda görmesi, ancak nasla isbat edilmesi caiz olan gaybî işlerdendir."]]}, {"reader": false, "ar": [[552.0, "وما ثبت عن النبيّ صلى الله عليه وسلم في الصحيحين من حديث ابن عباس إنما هو من جملة خصائصه؛"], [562.6, "لأنه فعلٌ مقرونٌ بعلّة،"], [566.0, "وتلك العلّة قد خُصّ بها رسول الله صلى الله عليه وسلم،"], [573.0, "فإنه قال: «ولولا ألّا تَدافنوا لدعوتُ الله أن يُسمعكم من عذاب القبر الذي أسمع»."], [584.0, "وقد مرّ النبيّ صلى الله عليه وسلم على قبورٍ كثيرة،"], [589.0, "ولم يثبت عنه أنه كلّما مرّ على قبرٍ وضع عليه غصنًا رطبًا،"], [595.0, "وإنما مرّ على قبرين فقال:"], [598.5, "«إنهما ليُعذَّبان، وما يُعذَّبان في كبير»."]], "tr": [[552.0, "Sahîhayn'da İbn Abbâs hadisinden Nebî ﷺ'den sabit olan (yaş dal dikme) ise onun hususiyetlerindendir."], [558.0, "Çünkü o, bir illete bağlı bir fiildir;"], [562.6, "o illet de Resûlullah ﷺ'e has kılınmıştır."], [566.6, "Nitekim o şöyle buyurmuştur: \"Birbirinizi defnetmeyi bırakacağınız (korkusu) olmasaydı, benim işittiğim kabir azabından size de işittirmesi için Allah'a dua ederdim.\" Nebî ﷺ pek çok kabrin yanından geçmiştir;"], [584.0, "bir kabrin yanından her geçtiğinde üzerine yaş bir dal koyduğu ondan sabit olmamıştır."], [591.0, "O ancak iki kabrin yanından geçti ve \"Bu ikisi azap görüyor;"], [598.5, "hem de büyük (görünen) bir şeyden dolayı azap görmüyorlar\" buyurdu."]]}, {"reader": false, "ar": [[604.0, "فدعا، فإذًا علّةُ هذا الدعاء والغرسِ مقرونةٌ بقوله:"], [609.7, "«ليُعذَّبان»، وبما أنّ سماع العذاب في القبر من خصائصه،"], [618.0, "فيكون ما يترتّب عليه من ذلك من خصائصه."], [622.0, "ولذلك لا نعرف عن أحدٍ من أصحاب النبيّ صلى الله عليه وسلم ـ مع عِظَم محبّتهم لامتثال فعله ـ أنه كان يفعل ذلك،"], [630.8, "أو يضع الأغصان الرطبة على القبور التي يمرّ عليها؛"], [635.0, "فتركُهم للاقتداء به في هذا الفعل دليلٌ على أنها من جملة خصوصيّاته صلى الله عليه وسلم."]], "tr": [[604.0, "Ve dua etti. Demek ki bu duanın ve (dalı) dikmenin illeti, onun \"azap görüyorlar\" sözüne bağlıdır."], [609.7, "Kabirdeki azabı işitmek onun hususiyetlerinden olduğuna göre, ona bağlı olarak ortaya çıkan şey de onun hususiyetlerinden olur."], [622.0, "Bu yüzden Nebî ﷺ'in ashâbından hiçbirinin —onun fiiline uymayı çok sevmelerine rağmen— bunu yaptığını ya da yanından geçtiği kabirlere yaş dallar koyduğunu bilmiyoruz."], [635.0, "Onların bu fiilde ona uymayı terk etmeleri, bunun onun ﷺ hususiyetlerinden olduğuna delildir."]]}]}, {"ts": "10:47", "title": "2. Külliye (devam): Mevlid, teberrük, cinlerin korkusu ve belirli kişiye şehadet", "paras": [{"reader": false, "ar": [[647.0, "فالذي يغرس هذه الأغصان إنما يريد أن يُثبت غيبًا بلا دليل."], [655.0, "ويدّعي الصوفيةُ المحتفلون بمولد النبيّ صلى الله عليه وسلم أنه صلى الله عليه وسلم يحضر يوم مولده ويحتفل مع الناس،"], [672.0, "ولكن لا ترونه! فيحتفل الناس،"], [674.5, "ويُظهرون الشيءَ العظيم من محبّته والبكاء،"], [678.9, "لاعتقادهم بأنه حاضرٌ فيما بينهم،"], [683.0, "وحضورُه من عدم حضوره من الغيب؛"], [687.0, "فمن أثبت غيبًا بلا دليلٍ فلا جرم أنه من جملة أهل البدع."]], "tr": [[647.0, "Bu dalları diken kişi, delilsiz bir gayb isbat etmek istemektedir."], [655.0, "Nebî ﷺ'in mevlidini kutlayan sûfîler de onun ﷺ doğum gününde hazır bulunduğunu ve insanlarla birlikte kutladığını, fakat sizin onu görmediğinizi iddia ederler!"], [673.0, "İnsanlar da onun aralarında hazır olduğuna inandıkları için kutlama yapar, ona olan sevgilerinden ve ağlamaktan büyük şeyler gösterirler."], [687.0, "Onun hazır bulunup bulunmaması gaybdandır."], [689.0, "Delilsiz gayb isbat eden kimse şüphesiz bid'at ehlindendir."]]}, {"reader": false, "ar": [[693.0, "وكذلك أيضًا دعوى كثيرٍ من الصوفية وجودَ البركة في هذا الموضع،"], [701.0, "كدعواهم بأنّ تراب قبور الأولياء فيه بركة؛"], [707.0, "فإنّ وجود البركة في العين من الأمور الغيبية،"], [711.0, "فإنّ البركة في الشيء لا تُشَمّ ولا تُلمَس ولا تُذاق ولا تُرى ولا تُسمَع،"], [719.0, "وكلُّ ما خفي عن حواسّك فغيبٌ بالنسبة لك."], [725.3, "فدعوى أنّ تراب الوليّ فيه بركة،"], [729.0, "وأنّ هذا العمود من الحرم فيه بركة،"], [732.0, "وأنّ هذا الحجر عند هذا الصالح فيه بركة ـ فتجدهم يتمسّحون ويتبرّكون بمثل ذلك ـ كلُّ ذلك من دعوى الغيب بلا دليل،"], [745.0, "وكلُّ من يدّعي غيبًا في أمرٍ بلا دليلٍ فإنه يكون من أهل البدع."]], "tr": [[693.0, "Yine aynı şekilde sûfîlerin çoğunun, şu yerde bereket bulunduğu iddiası da böyledir;"], [701.0, "velilerin kabirlerinin toprağında bereket olduğu iddiaları gibi."], [707.0, "Çünkü bir nesnede bereketin bulunması gaybî işlerdendir."], [711.0, "Bir şeydeki bereket koklanmaz, dokunulmaz, tadılmaz, görülmez ve işitilmez;"], [717.3, "duyularından gizli kalan her şey de senin için gaybdır."], [725.3, "Velinin toprağında bereket olduğu, Harem'deki şu sütunda bereket olduğu, şu salih kişinin yanındaki şu taşta bereket olduğu iddiası —onları bu tür şeylere sürünüp teberrük ederken görürsün— bunların hepsi delilsiz gayb iddiasındandır."], [745.5, "Bir hususta delilsiz gayb iddia eden herkes bid'at ehlinden olur."]]}, {"reader": false, "ar": [[751.0, "وكذلك دعوى بعض القُرّاء أنّ الجنّ تخاف من كذا وكذا،"], [757.0, "وخوفُ الجنّ من الأمور الغيبية؛"], [761.0, "فإذا أراد الإنسان أن يُثبت شيئًا من ذلك فإننا نطالبه ـ أوّلَ ما نطالبه ـ بالدليل؛"], [770.0, "لأنك تريد أن تُثبت غيبًا،"], [772.5, "والغيب مبنيٌّ على التوقيف حتى لا يتخوّض أحدٌ فيه."]], "tr": [[751.0, "Bazı okuyucuların (rukye yapanların) cinlerin şundan şundan korktuğu iddiası da böyledir."], [757.8, "Cinlerin korkusu gaybî işlerdendir. İnsan bundan bir şey isbat etmek isterse, ondan ilk istediğimiz şey delildir."], [770.0, "Çünkü sen bir gayb isbat etmek istiyorsun;"], [773.0, "gayb ise kimse ona dalmasın diye tevkîfe dayanır."]]}, {"reader": false, "ar": [[777.0, "ومن أجل ذلك منع أهلُ السنة والجماعة ـ رحم الله أمواتَهم،"], [783.6, "وثبّت أحياءَهم ـ الشهادةَ للمعيَّن بجنّةٍ أو نارٍ ما لم يشهد له النصّ بذلك؛"], [791.8, "لأنّ تلك الشهادة من الغيب،"], [794.2, "ولا يجوز أن نُثبتها إلا بالدليل،"], [796.1, "إلا بالدليل. وأظنّ الأمر واضح؛"], [799.0, "فإنّ من الأبواب التي فتحت كثيرًا من البدع على أهل الإسلام:"], [806.2, "دعوى الغيب بلا دليل."]], "tr": [[777.0, "Bu sebeple Ehl-i Sünnet ve'l-Cemaat —Allah ölülerine rahmet etsin, dirilerine sebat versin— nas şehadet etmedikçe belirli bir kişi için cennet veya cehennem şehadetinde bulunmayı yasaklamıştır."], [791.8, "Çünkü o şehadet gaybdandır; onu ancak delille isbat etmemiz caizdir, ancak delille."], [799.0, "Sanırım mesele açıktır: Müslümanlara pek çok bid'at kapısı açan kapılardan biri, delilsiz gayb iddiasıdır."]]}, {"reader": false, "ar": [[811.0, "فتجد المبتدعَ وأتباعَه يجتهدون في تلك البدعة رجاءَ تحصيل ذلك الأمر الغيبيّ الذي لا يقف وراءه دليلُ الشرع،"], [824.0, "فيكونون «من الأخسرين أعمالًا» <span class=\"ayah\">﴿الَّذِينَ ضَلَّ سَعْيُهُمْ فِي الْحَيَاةِ الدُّنْيَا وَهُمْ يَحْسَبُونَ أَنَّهُمْ يُحْسِنُونَ صُنْعًا﴾<\/span> <span class=\"ref\">[الكهف: ١٠٤]<\/span>."]], "tr": [[811.0, "Bid'atçiyi ve ona uyanları, arkasında şer'î bir delil bulunmayan o gaybî şeyi elde etme ümidiyle o bid'atte gayret ederken görürsün."], [820.8, "Böylece onlar \"amelleri bakımından en çok hüsrana uğrayanlardan\" olurlar:"], [826.7, "<span class=\"ayah\">﴿Onlar, iyi iş yaptıklarını sandıkları hâlde dünya hayatındaki çabaları boşa gitmiş kimselerdir﴾<\/span> [Kehf 104]."]]}]}, {"ts": "13:54", "title": "3. Külliye: Gaybî bir işin keyfiyetini soran herkes bid'atçidir", "paras": [{"reader": false, "ar": [[834.0, "ومن الكلّيّات أيضًا: <b>كلُّ من سأل عن كيفيّة أمرٍ غيبيٍّ فمبتدع.<\/b> <span class=\"note\">(يكررها)<\/span> أظنّ واضح."], [843.0, "وذلك لأننا ـ معاشرَ أهل السنة والجماعة ـ نتعامل مع الغيبيات باعتبارين:"], [865.0, "باعتبار معانيها ودلالاتها اللغوية في لسان العرب،"], [871.0, "وباعتبار كيفيّاتها على ما هي عليه في الواقع الذي يعلمه الله."], [877.0, "فأهل السنة في باب الغيبيات يعلمون معانيها ويجهلون كيفيّاتها."]], "tr": [[834.0, "Külliyelerden biri de şudur: 3."], [836.1, "külliye: Gaybî bir işin keyfiyetini soran herkes bid'atçidir. (Tekrar ediyor.) Sanırım açıktır."], [843.0, "Bu şundandır: Biz Ehl-i Sünnet ve'l-Cemaat topluluğu, gaybî şeylere iki itibarla muamele ederiz:"], [865.0, "Arap dilindeki manaları ve lügat delâletleri itibarıyla;"], [872.1, "ve Allah'ın bildiği hakikatteki hâlleriyle keyfiyetleri itibarıyla."], [877.0, "Ehl-i Sünnet, gaybî şeyler babında onların manalarını bilir, keyfiyetlerini bilmez."]]}, {"reader": false, "ar": [[888.0, "فقولي: «يعلمون معانيها»؛ لأنّ الله خاطبهم فيها باللسان العربيّ،"], [896.0, "وهو لم يخاطبنا في الوحي في هذا الأمر الغيبيّ بهذا اللسان العربيّ إلا وهو يريد منّا ـ كعربٍ ـ أن نحمل تلك الألفاظ العربية على معانيها ودلالاتها العربية."], [911.0, "لكن أمّا باعتبار كيفيّاتها فإننا نَكِل أمرَ العلم بها إلى الله عز وجل."]], "tr": [[888.0, "\"Manalarını bilirler\" sözüm şundandır: Çünkü Allah onlara bu konuda Arap diliyle hitap etmiştir."], [897.8, "O, vahiyde bu gaybî işte bize bu Arap diliyle hitap ettiyse, mutlaka Araplar olarak bizden o Arapça lafızları Arapça manalarına ve delâletlerine hamletmemizi istemektedir."], [911.0, "Fakat keyfiyetleri itibarıyla ise, onları bilme işini Allah Azze ve Celle'ye havale ederiz."]]}, {"reader": false, "ar": [[920.0, "فلا نقول بالجهل في الأمور الغيبية بالاعتبارين كما قالته المفوِّضة،"], [928.0, "ولا نقول بالعلم بها بالاعتبارين كما قالته الممثِّلة،"], [935.0, "وإنما نقول بالعلم بها باعتبار معانيها،"], [940.0, "وبالجهل بها باعتبار كيفيّاتها."], [943.0, "وعلى ذلك صفاتُ الله عز وجل التي أخبرنا بها في كتابه أو في صحيح سنّته صلى الله عليه وسلم:"], [951.0, "فنعلم معانيها، ونَكِل أمرَ كيفيّتها على ما هي عليه إلى الله عز وجل."]], "tr": [[920.0, "Gaybî işlerde, Müfevvida'nın dediği gibi iki itibarla da bilinmezlik demeyiz;"], [928.0, "Mümessile'nin dediği gibi iki itibarla da bilinirlik demeyiz."], [935.8, "Aksine, manaları itibarıyla bilindiklerini, keyfiyetleri itibarıyla bilinmediklerini söyleriz."], [943.0, "Allah Azze ve Celle'nin Kitabı'nda veya Nebî ﷺ'in sahih sünnetinde bize haber verdiği sıfatları da buna göredir:"], [951.0, "Manalarını biliriz, hakikatteki hâlleriyle keyfiyetlerini Allah Azze ve Celle'ye havale ederiz."]]}, {"reader": false, "ar": [[959.0, "فنعلم معنى الوجه، وكيفيّتُه لا يعلمها إلا الله."], [965.0, "ونعلم معنى السمع لغةً،"], [968.0, "وأمّا كيفيّة سمع الله فلا يعلمه إلا الله."], [972.0, "ونعلم معنى الاستواء على الشيء باعتبار دلالة اللغة،"], [979.0, "ولكنّ كيفيّة استواء الله على ما هو عليه لا يعلمها إلا الله عز وجل."], [986.0, "وهذا هو الذي ينبغي أن يقال."]], "tr": [[959.0, "Yüzün (vech) manasını biliriz; keyfiyetini ise Allah'tan başkası bilmez."], [965.0, "İşitmenin manasını lügat olarak biliriz;"], [968.5, "Allah'ın işitmesinin keyfiyetini ise Allah'tan başkası bilmez."], [972.0, "Lügatin delâleti itibarıyla bir şeyin üzerine istivânın manasını biliriz;"], [980.0, "fakat Allah'ın hakikatteki hâliyle istivâsının keyfiyetini Allah Azze ve Celle'den başkası bilmez. Söylenmesi gereken budur."]]}, {"reader": false, "ar": [[987.0, "ونعلم معنى العذاب في القبر،"], [992.0, "فمعنى العذاب معلوم، لكنّ كيفيّة عذاب القبر على ما هي عليه لا يعلمها إلا الله."], [999.0, "نعلم معنى النعيم، وأمّا كيفيّة النعيم المضاف إلى القبر فلا يعلمه إلا الله."], [1007.0, "نعلم معنى اختلاف الأضلاع لغةً،"], [1011.0, "لكنّ كيفيّة اختلاف أضلاع الكافر في قبره لا يعلمها إلا الله."], [1017.0, "نعلم معنى الميزان لغةً،"], [1019.7, "لكنّ كيفيّة الميزان الذي سيكون يوم القيامة لا يعلمه إلا الله."]], "tr": [[987.0, "Kabirdeki azabın manasını biliriz; azabın manası bilinir, fakat kabir azabının hakikatteki keyfiyetini Allah'tan başkası bilmez."], [999.0, "Nimetin manasını biliriz; kabre izafe edilen nimetin keyfiyetini ise Allah'tan başkası bilmez."], [1007.0, "Kaburgaların birbirine geçmesinin manasını lügat olarak biliriz;"], [1011.6, "fakat kâfirin kabrinde kaburgalarının birbirine geçmesinin keyfiyetini Allah'tan başkası bilmez."], [1017.0, "Mîzânın manasını lügat olarak biliriz;"], [1020.3, "fakat kıyamet günü kurulacak olan mîzânın keyfiyetini Allah'tan başkası bilmez."]]}]}, {"ts": "17:08", "title": "3. Külliye (devam): Cennet, cehennem ve melekler — mana bilinir, keyfiyet bilinmez", "paras": [{"reader": false, "ar": [[1028.0, "نعلم معنى نعيم الجنة اسمًا ولغةً:"], [1033.0, "ففي الجنة خمر، والخمر معلومةُ المعنى لكن مجهولةُ الكيف."], [1039.0, "وفي الجنة ماء، والماء معلومُ المعنى لكن مجهولُ الكيف."], [1045.0, "وفي الجنة نخلٌ وفاكهة،"], [1047.8, "وهي معلومةُ المعنى لكنها مجهولةُ الكيف."], [1053.0, "وفي النار سلاسل، وهي معلومةُ المعنى ولكن مجهولةُ الكيف،"], [1060.0, "وزقّوم وهو معلوم المعنى،"], [1064.0, "وحميم وهو معلوم المعنى،"], [1068.0, "وأصفادٌ ومطارقُ من حديد،"], [1071.0, "وهي معلومةُ المعنى لغةً لكنها مجهولةُ الكيف."]], "tr": [[1028.0, "Cennet nimetinin manasını isim ve lügat olarak biliriz:"], [1033.0, "Cennette şarap vardır; şarabın manası bilinir, fakat keyfiyeti bilinmez."], [1039.0, "Cennette su vardır; suyun manası bilinir, fakat keyfiyeti bilinmez."], [1042.3, "Cennette hurma ağaçları ve meyveler vardır;"], [1045.0, "manaları bilinir, fakat keyfiyetleri bilinmez."], [1047.1, "Cehennemde zincirler vardır; manaları bilinir, fakat keyfiyetleri bilinmez."], [1053.0, "Zakkum vardır, manası bilinir; hamîm (kaynar su) vardır, manası bilinir;"], [1062.5, "prangalar ve demirden tokmaklar vardır;"], [1069.5, "manaları lügat olarak bilinir, fakat keyfiyetleri bilinmez."]]}, {"reader": false, "ar": [[1080.0, "ونحن نعلم معنى الملائكة،"], [1082.5, "أنهم خَلقٌ من نور،"], [1085.0, "ونحن نعلم معنى النور،"], [1087.0, "ولكنّ كيفيّة خلقهم على ما هي عليه اللهُ أعلم بها."], [1092.0, "نحن نعلم معنى الجناح لغةً،"], [1096.0, "وأمّا الجناح المضاف إلى الملك ـ <span class=\"ayah\">﴿أُولِي أَجْنِحَةٍ مَّثْنَىٰ وَثُلَاثَ وَرُبَاعَ﴾<\/span> <span class=\"ref\">[فاطر: ١]<\/span> ـ لا يعلمها إلا الله عز وجل."]], "tr": [[1080.0, "Meleklerin manasını, onların nurdan yaratılmış bir mahlûk olduklarını biliriz;"], [1085.5, "nurun manasını da biliriz. Fakat hakikatteki hâliyle yaratılışlarının keyfiyetini Allah daha iyi bilir."], [1092.0, "Kanadın manasını lügat olarak biliriz;"], [1095.2, "meleğe izafe edilen kanat ise —<span class=\"ayah\">﴿ikişer, üçer ve dörder kanatlı﴾<\/span> [Fâtır 1]— onu Allah Azze ve Celle'den başkası bilmez."]]}, {"reader": false, "ar": [[1106.0, "ولا يَسلم في باب الغيب إلا من قال هذا؛"], [1110.0, "فما سَلِم من فوّض المعنى والكيف،"], [1114.0, "وما سَلِم من ادّعى العلمَ بالمعنى والكيف،"], [1120.0, "وإنما لا يَسلم في غيبيّاته إلا من عَلِم المعنى وفوّض علمَ الكيفيّة لله عز وجل."], [1133.0, "فمن البدع المنتشرة في هذا الزمان:"], [1137.0, "إمّا تفويضُ معاني الغيبيات،"], [1139.9, "أو دعوى العلم بالكيفيّات؛"], [1146.0, "فمن فوّض المعنى فقد ابتدع،"], [1149.2, "ومن ادّعى العلمَ بالكيف فقد ابتدع."]], "tr": [[1106.0, "Gayb babında ancak bunu söyleyen selamette olur."], [1110.0, "Manayı ve keyfiyeti (birlikte) tefvîz eden selamette olmamıştır;"], [1114.0, "manayı ve keyfiyeti bildiğini iddia eden de selamette olmamıştır."], [1120.7, "Gaybî meselelerinde ancak manayı bilen ve keyfiyetin bilgisini Allah Azze ve Celle'ye tefvîz eden selamette olur."], [1133.0, "Bu zamanda yaygın olan bid'atlerden biri ya gaybî şeylerin manalarını tefvîz etmek ya da keyfiyetleri bildiğini iddia etmektir."], [1146.0, "Manayı tefvîz eden bid'at işlemiştir;"], [1148.5, "keyfiyeti bildiğini iddia eden de bid'at işlemiştir."]]}]}, {"ts": "19:13", "title": "3. Külliye (devam): Keyfiyeti bilmenin üç yolu", "paras": [{"reader": false, "ar": [[1153.0, "قال السائل: ولماذا تمنعنا من الخوض في كيفيّة الأمر الغيبيّ؟"], [1165.0, "فأقول: لأنّ كيفيّة الشيء لا تُعلم إلا بواحدةٍ من ثلاث طرق:"], [1174.0, "إمّا أن تراه، فيكون طريقُ العلم بالكيفيّة رؤيتَه،"], [1182.0, "وهذا الغيب لا يزال غيبًا عن أعيننا فلم نره."], [1187.0, "أو ترى نظيرًا له،"], [1189.7, "وهذا الغيب لا ندري عن نظيرٍ له حتى نقيسه عليه."], [1198.0, "أو يُخبرك الصادقُ صلى الله عليه وسلم عن كيفيّة هذا الأمر الغيبيّ."]], "tr": [[1153.0, "Soran der ki: Gaybî işin keyfiyetine dalmaktan bizi neden men ediyorsun?"], [1165.0, "Derim ki: Çünkü bir şeyin keyfiyeti ancak üç yoldan biriyle bilinir:"], [1174.0, "Ya onu görürsün; keyfiyeti bilmenin yolu onu görmek olur."], [1183.1, "Bu gayb ise hâlâ gözlerimizden gizlidir;"], [1187.0, "onu görmedik. Ya da onun bir benzerini görürsün;"], [1191.0, "bu gaybın ise onu ona kıyas edeceğimiz bir benzerini bilmiyoruz."], [1198.0, "Ya da sâdık (doğru sözlü) ﷺ sana bu gaybî işin keyfiyetini haber verir."]]}, {"reader": false, "ar": [[1204.0, "والصادق إنما أخبرنا بوجوده وثبوته،"], [1207.6, "ولم يُخبرنا عن كيفيّته:"], [1212.0, "فأخبرنا أنّ لربّنا وجهًا ولم يُخبرنا عن كيفيّة هذا الوجه،"], [1217.0, "وأخبرنا بأنّ في القبر عذابًا ولم يُخبرنا عن كيفيّة هذا العذاب،"], [1222.0, "وأخبرنا بأنّ في الجنة نعيمًا ولم يُخبرنا عن كيفيّة هذا النعيم،"], [1228.0, "وبأنّ في النار جحيمًا ولم يُخبرنا عن كيفيّة هذا الجحيم."]], "tr": [[1204.0, "Sâdık ise bize ancak onun varlığını ve sübûtunu haber verdi, keyfiyetini haber vermedi:"], [1206.8, "Rabbimizin bir vechi (yüzü) olduğunu bize haber verdi, bu vechin keyfiyetini haber vermedi."], [1212.0, "Kabirde azap olduğunu bize haber verdi, bu azabın keyfiyetini haber vermedi."], [1218.8, "Cennette nimet olduğunu bize haber verdi, bu nimetin keyfiyetini haber vermedi."], [1225.8, "Cehennemde alevli ateş olduğunu (haber verdi), bu ateşin keyfiyetini haber vermedi."]]}, {"reader": false, "ar": [[1234.0, "فإذًا انقطعت كلُّ وسائل العلم بالكيفيّة:"], [1238.0, "من رؤيةٍ، أو رؤيةِ النظير،"], [1241.3, "أو إخبارِ الصادق عنه."], [1246.0, "فكيف تأمرني أو تطلب منّي أن أُخبرك بكيفيّة شيءٍ لم أره،"], [1251.5, "ولا أعرف نظيره، ولم يُخبرني الصادقُ عن كيفيّته؟!"], [1256.6, "فهذا لا يكون أبدًا."]], "tr": [[1234.0, "Demek ki keyfiyeti bilmenin bütün vasıtaları —görmek, benzerini görmek veya sâdıkın onu haber vermesi— kesilmiştir."], [1246.0, "Görmediğim, benzerini bilmediğim ve sâdıkın bana keyfiyetini haber vermediği bir şeyin keyfiyetini sana haber vermemi nasıl emreder ya da benden nasıl istersin?! Bu asla olmaz."]]}]}, {"ts": "21:00", "title": "4. Külliye: Çok zayıf veya uydurma hadise dayanan her taabbud bid'attir", "paras": [{"reader": false, "ar": [[1260.0, "ومن الكلّيّات أيضًا: <b>كلُّ تعبُّدٍ بُني على حديثٍ ضعيفٍ جدًّا أو موضوعٍ فبدعة.<\/b> <span class=\"note\">(يكررها)<\/span> وذلك لأنّ أمر التعبُّد توقيفيٌّ على ثبوت النصّ،"], [1278.5, "والمتقرّر في القواعد أنّ الأصل في العبادات التوقيفُ بكلّ متعلَّقاتها؛"], [1303.0, "ولأنّ التعبُّد من أحكام الشرع،"], [1308.0, "والمتقرّر في القواعد أنّ الأحكام الشرعية تفتقر في ثبوتها للأدلة الصحيحة الصريحة."]], "tr": [[1260.0, "Külliyelerden biri de şudur: 4."], [1262.0, "külliye: Çok zayıf veya uydurma bir hadis üzerine bina edilen her taabbud bid'attir. (Tekrar ediyor.) Bu şundandır:"], [1275.1, "Taabbud işi, nassın sübûtuna bağlı olarak tevkîfîdir."], [1279.9, "Kaidelerde yerleşik olan şudur: İbadetlerde asıl, bütün taalluklarıyla tevkîftir."], [1303.0, "Ayrıca taabbud şer'î hükümlerdendir; kaidelerde yerleşik olan şudur:"], [1310.3, "Şer'î hükümler sübûtlarında sahih ve sarih delillere muhtaçtır."]]}, {"reader": false, "ar": [[1319.0, "وبناءً على ذلك: فأيُّ تعبُّدٍ ورد في حديثٍ ضعيفٍ جدًّا،"], [1326.0, "أو ورد في حديثٍ موضوع،"], [1329.0, "فلا يجوز لك أن تتعبّد لله عز وجل به؛"], [1333.0, "لأنك سوف تفتح على نفسك بابًا من أبواب المحدثات والبدع."], [1340.0, "فالتعبُّدات مقصورةٌ على ما صحّ من النصوص،"], [1347.0, "وأمّا ما كان ضعيفًا جدًّا أو موضوعًا فإنه لا يجوز أن نجعله محلًّا لشيءٍ من التعبُّدات؛"], [1357.0, "فالأحكام الشرعية لا تؤخذ من الأحاديث الضعيفة،"], [1361.7, "أو الواهية، أو الأحاديث الموضوعة."]], "tr": [[1319.0, "Buna göre: Çok zayıf bir hadiste ya da uydurma bir hadiste gelen herhangi bir taabbudla Allah Azze ve Celle'ye taabbud etmen caiz değildir."], [1333.0, "Çünkü kendine muhdes işlerin ve bid'atlerin kapılarından birini açmış olursun."], [1340.0, "Taabbudlar, nasslardan sahih olanlarla sınırlıdır."], [1344.5, "Çok zayıf veya uydurma olanı ise hiçbir taabbuda mahal kılmamız caiz değildir."], [1357.0, "Şer'î hükümler zayıf, vâhî (çok zayıf) veya uydurma hadislerden alınmaz."]]}, {"reader": false, "ar": [[1365.0, "وبناءً على ذلك: فليس من السنّة أن نقرأ سورة يس عند المحتضَر،"], [1375.0, "لأنّ حديثها ضعيفٌ جدًّا."], [1378.0, "وليس من السنّة أن نتعبّد لله عز وجل بتقليم الأظفار على طريقةٍ معيّنة،"], [1390.0, "مبتدئين بهذا ثم هذا ثم هذا ثم هذا ثم هذا،"], [1398.0, "لأنّ حديثها موضوع. وليس من السنّة كذلك أن نتعبّد لله عز وجل بنَتْر الذَّكَر عند الاستنجاء،"], [1413.0, "لأنّ حديثها ضعيفٌ جدًّا."]], "tr": [[1365.0, "Buna göre: Ölüm hâlindeki kişinin yanında Yâsîn sûresini okumak sünnetten değildir;"], [1378.0, "çünkü onun hadisi çok zayıftır."], [1380.7, "Tırnakları belirli bir şekilde —şununla, sonra şununla, sonra şununla, sonra şununla, sonra şununla başlayarak— keserek Allah Azze ve Celle'ye taabbud etmek sünnetten değildir;"], [1402.0, "çünkü onun hadisi uydurmadır. Aynı şekilde istincâ sırasında zekeri silkeleyerek (nesr) Allah Azze ve Celle'ye taabbud etmek de sünnetten değildir;"], [1413.0, "çünkü onun hadisi çok zayıftır."]]}, {"reader": false, "ar": [[1417.0, "وليس من السنّة أن نتعبّد لله عز وجل بالأذان في أُذن المولود،"], [1431.0, "لأنّ كلّ حديثٍ ورد فيه فضعيفٌ جدًّا."], [1438.0, "وليس من السنّة كذلك أن نتعبّد لله عز وجل بالإقامة في الأذن الأخرى،"], [1447.0, "لعدم ورود النصّ: صحيحًا ولا ضعيفًا ولا موضوعًا."], [1452.0, "فالأذان وردت فيه جُمَلٌ من الأحاديث لكنها ضعيفةٌ جدًّا،"], [1458.0, "وأمّا الإقامة فلم يَرِد فيها شيءٌ أصلًا."]], "tr": [[1417.0, "Yeni doğanın kulağına ezan okuyarak Allah Azze ve Celle'ye taabbud etmek sünnetten değildir;"], [1424.5, "çünkü bu konuda gelen her hadis çok zayıftır."], [1438.0, "Aynı şekilde diğer kulağına kamet getirerek Allah Azze ve Celle'ye taabbud etmek de sünnetten değildir;"], [1446.1, "çünkü ne sahih ne zayıf ne de uydurma bir nas gelmiştir."], [1452.0, "Ezan hakkında bir kısım hadisler gelmiştir, fakat bunlar çok zayıftır;"], [1458.7, "kamet hakkında ise hiçbir şey gelmemiştir."]]}, {"reader": false, "ar": [[1465.0, "وليس من السنّة كذلك أن نتوضّأ لمجرّد القهقهة،"], [1473.0, "لأنّ حديث انتقاض الوضوء بها ضعيفٌ جدًّا،"], [1478.6, "ضعيفٌ جدًّا. وليس من السنّة أن نَخُصّ شهرَ رجبٍ بشيءٍ من التعبُّدات،"], [1487.6, "معتقدين فضيلةً لها بخصوصها في هذا الزمان بخصوصه؛"], [1498.0, "لأنّ كلّ حديثٍ في فضل رجبٍ فلا يصحّ،"], [1503.3, "بل هو ضعيفٌ جدًّا،"], [1506.0, "بل هو موضوع، كما قاله جمعٌ من أهل العلم. وهكذا دواليك."]], "tr": [[1465.0, "Aynı şekilde sadece kahkaha sebebiyle abdest almak da sünnetten değildir;"], [1473.0, "çünkü abdestin onunla bozulduğuna dair hadis çok zayıftır, çok zayıftır."], [1481.0, "Recep ayını, özellikle bu zamana has bir fazileti olduğuna inanarak bazı taabbudlarla tahsis etmek de sünnetten değildir."], [1488.9, "Çünkü Recep'in faziletine dair her hadis sahih değildir;"], [1498.0, "hatta çok zayıftır, hatta uydurmadır;"], [1502.0, "ilim ehlinden bir topluluğun dediği gibi."], [1507.3, "(Diğer örnekler de) bu şekilde devam eder."]]}, {"reader": false, "ar": [[1517.0, "فمن الأبواب التي فتحت علينا البدع:"], [1521.0, "التعبُّدُ لله عز وجل بما وردت به الأحاديث الواهية المستنكَرة،"], [1530.0, "أو الأحاديث الموضوعة المكذوبة المختلَقة على النبيّ صلى الله عليه وسلم."], [1538.0, "فمن أراد السلامة في دينه فليجعل أساسَ تعبُّده النقلَ الصحيح،"], [1546.0, "إن كان يريد السلامة في الدارين."]], "tr": [[1517.0, "Bize bid'atleri açan kapılardan biri, vâhî ve münker hadislerde ya da Nebî ﷺ'e karşı uydurulmuş, yalan olarak isnat edilmiş mevzû hadislerde gelen şeylerle Allah Azze ve Celle'ye taabbud etmektir."], [1538.0, "Kim dininde selamet isterse, iki dünyada selamet istiyorsa taabbudunun temelini sahih nakil kılsın."]]}]}, {"ts": "25:52", "title": "5. Külliye: Meşru olmayan şeyle Allah'a taabbud eden herkes bid'atçidir", "paras": [{"reader": false, "ar": [[1552.0, "ومن الكلّيّات أيضًا ـ مَدري كم رقم عندكم ـ:"], [1556.0, "<b>كلُّ من تعبّد لله بما ليس بمشروعٍ فمبتدع.<\/b> وهذه أوسعُ من الأولى."], [1573.4, "<span class=\"note\">(يكررها)<\/span> لقول النبيّ صلى الله عليه وسلم:"], [1585.0, "«من أحدث في أمرنا هذا ما ليس منه فهو ردّ»،"], [1592.0, "ولقوله صلى الله عليه وسلم:"], [1595.4, "«من عمل عملًا ليس عليه أمرُنا فهو ردّ»،"], [1601.0, "ولقوله صلى الله عليه وسلم:"], [1604.3, "«وإيّاكم ومحدثاتِ الأمور، فإنّ كلَّ محدثةٍ بدعة، وكلَّ بدعةٍ ضلالة» ـ حديثٌ صحيح."]], "tr": [[1552.0, "Külliyelerden biri de —sizde numarası kaç, bilmiyorum—:"], [1556.0, "<b>5. külliye: Meşru olmayan bir şeyle Allah'a taabbud eden herkes bid'atçidir.<\/b> Bu, öncekinden daha geniştir."], [1573.4, "(Tekrar ediyor.) Çünkü Nebî ﷺ şöyle buyurmuştur:"], [1585.0, "\"Kim bizim bu işimizde (dinimizde) ondan olmayan bir şey ihdas ederse, o reddedilmiştir.\" Yine o ﷺ şöyle buyurmuştur:"], [1595.4, "\"Kim bizim işimizin üzerinde olmadığı bir amel işlerse, o reddedilmiştir.\" Yine o ﷺ şöyle buyurmuştur:"], [1604.3, "\"Sonradan çıkarılan işlerden sakının; çünkü sonradan çıkarılan her şey bid'attir ve her bid'at dalâlettir.\" Sahih bir hadistir."]]}, {"reader": false, "ar": [[1613.0, "وبناءً عليه: فليس من السنّة أن نتعبّد لله بذكره بالاسم المفرد:"], [1622.0, "الله، الله، الله؛ لعدم ورود ذلك في السنّة الصحيحة."], [1629.5, "ولا التعبُّدُ لله عز وجل بالضمير:"], [1635.0, "هو، هو، هو، كما يفعله مَهاويسُ <span class=\"q\">؟ 27:15<\/span> الصوفية."], [1643.0, "وليس من السنّة أن نتعبّد لله عز وجل بصلاة ركعتين بعد الفراغ من السعي،"], [1650.9, "لعدم وجود النصّ بذلك."], [1655.0, "وليس من السنّة أن نتعبّد لله عز وجل بالتلفّظ بالنيّة عند ابتداء التعبُّد،"], [1662.0, "لعدم ورود السنّة بذلك."]], "tr": [[1613.0, "Buna göre: Allah'ı müfred isimle —Allah, Allah, Allah— zikrederek O'na taabbud etmek sünnetten değildir;"], [1625.0, "çünkü bu, sahih sünnette gelmemiştir."], [1629.5, "Sûfîlerin şaşkınlarının <span class=\"q\">؟<\/span> yaptığı gibi zamirle —Hû, Hû, Hû— Allah Azze ve Celle'ye taabbud etmek de (sünnetten) değildir."], [1643.0, "Sa'yi bitirdikten sonra iki rekât namaz kılarak Allah Azze ve Celle'ye taabbud etmek sünnetten değildir;"], [1650.2, "çünkü bu konuda nas yoktur."], [1655.0, "Taabbuda başlarken niyeti dille söyleyerek Allah Azze ve Celle'ye taabbud etmek sünnetten değildir;"], [1661.4, "çünkü bu konuda sünnet gelmemiştir."]]}, {"reader": false, "ar": [[1665.0, "وليس من السنّة أن نتعبّد لله عز وجل بالأذان في غير الصلوات الخمس،"], [1673.0, "كالأذان للجنازة أو الأذان للاستسقاء ونحوها،"], [1678.0, "لعدم ورود النصّ بذلك."], [1682.0, "وليس من السنّة أن نتعبّد لله عز وجل باعتقاد فضيلةٍ خاصّةٍ لقراءة القرآن عند القبر ـ كما نصّ عليه بعض الفقهاء ـ فإنّ ذلك من البدع المحدثة؛"], [1699.0, "لأنه تعبُّدٌ لله بما ليس بمشروع."]], "tr": [[1665.0, "Beş vakit namaz dışında —cenaze için ezan veya yağmur duası için ezan ve benzeri gibi— ezan okuyarak Allah Azze ve Celle'ye taabbud etmek sünnetten değildir;"], [1682.0, "çünkü bu konuda nas gelmemiştir."], [1684.0, "Kabrin yanında Kur'an okumanın hususi bir fazileti olduğuna inanarak Allah Azze ve Celle'ye taabbud etmek —bazı fakihlerin açıkça belirttiği gibi— sünnetten değildir."], [1699.0, "Bu, muhdes bid'atlerdendir; çünkü meşru olmayan bir şeyle Allah'a taabbuddur."]]}, {"reader": false, "ar": [[1704.0, "وليس من السنّة أن نتعبّد لله بقراءة الفاتحة عند افتتاح الخِطبة،"], [1711.0, "ولا بقراءتها عند سماع اسم الأموات،"], [1717.0, "لعدم ورود النصّ بشيءٍ من ذلك."], [1722.0, "وليس من السنّة أن نتعبّد لله عز وجل بإحياء موالد الأولياء والأنبياء،"], [1730.0, "فكلّما مرّ مولدُ نبيٍّ تعبّدنا لله بالاحتفال به،"], [1736.0, "أو كلّما مرّ مولدُ وليٍّ من الأولياء والصالحين تعبّدنا لله بإحيائه والاحتفال به؛"], [1745.0, "فهذا من البدع المحدثة،"], [1747.0, "لأنه تعبُّدٌ لله بما ليس بمشروع."]], "tr": [[1704.0, "Nişan (hıtbe) başlarken Fâtiha okuyarak ve ölülerin adı duyulduğunda Fâtiha okuyarak Allah'a taabbud etmek sünnetten değildir;"], [1714.8, "çünkü bunların hiçbiri hakkında nas gelmemiştir."], [1722.0, "Velilerin ve peygamberlerin mevlidlerini ihya ederek Allah Azze ve Celle'ye taabbud etmek sünnetten değildir:"], [1729.3, "Bir peygamberin doğum günü her geldiğinde onu kutlayarak Allah'a taabbud etmek, ya da veli ve salihlerden birinin doğum günü her geldiğinde onu ihya edip kutlayarak Allah'a taabbud etmek."], [1745.0, "Bu, muhdes bid'atlerdendir; çünkü meşru olmayan bir şeyle Allah'a taabbuddur."]]}, {"reader": false, "ar": [[1750.0, "وليس من السنّة أن نتعبّد لله بإحياء الليالي المشهورة في الإسلام،"], [1760.0, "كليلة الإسراء والمعراج، أو كليلة النصف من شعبان ـ وكلُّ حديثٍ فيها فضعيفٌ جدًّا ـ أو غيرها من الليالي التي لها شهرتُها وميزانُها وقدرُها عند أهل الإسلام؛"], [1779.0, "فكلُّ ذلك نصفه ـ معاشرَ أهل السنة والجماعة ـ بأنه من المحدثات والبدع؛"], [1787.0, "لأنه تعبُّدٌ لله بما ليس بمشروع،"], [1790.0, "وكلُّ من تعبّد لله بما ليس بمشروعٍ فمبتدع."]], "tr": [[1750.0, "İslam'da meşhur olan geceleri —İsrâ ve Mi'râc gecesi ya da Şâban'ın on beşinci gecesi gibi;"], [1761.4, "ki bu konudaki her hadis çok zayıftır— veya Müslümanlar nezdinde şöhreti, değeri ve kadri olan diğer geceleri ihya ederek Allah'a taabbud etmek sünnetten değildir."], [1779.0, "Biz Ehl-i Sünnet ve'l-Cemaat topluluğu bunların hepsini muhdes işlerden ve bid'atlerden sayarız;"], [1787.0, "çünkü meşru olmayan bir şeyle Allah'a taabbuddur."], [1789.5, "Meşru olmayan bir şeyle Allah'a taabbud eden herkes de bid'atçidir."]]}]}, {"ts": "29:54", "title": "6. Külliye: Nehyedilmiş bir şeyle Allah'a taabbud eden herkes bid'atçidir", "paras": [{"reader": false, "ar": [[1794.0, "ومن الكلّيّات أيضًا: <b>كلُّ من تعبّد لله بمنهيٍّ عنه فمبتدع.<\/b> منهيٌّ عنه يُتعبَّد لله به؟!"], [1804.0, "<b>كلُّ من تعبّد لله بمنهيٍّ عنه فمبتدع<\/b>؛"], [1808.7, "فإنّ حقّ المنهيّ عنه تركُه،"], [1812.0, "لا أن نفعله. لكن نشأ لنا طائفةٌ من أهل البدع يعمِدون إلى المنهيّات الشرعية،"], [1832.8, "ويجعلونها عبادةً وقربةً وطاعةً يتقرّبون بها إلى الله عز وجل."]], "tr": [[1794.0, "Külliyelerden biri de şudur: 6."], [1797.0, "külliye: Nehyedilmiş (yasaklanmış) bir şeyle Allah'a taabbud eden herkes bid'atçidir. Yasaklanmış bir şeyle Allah'a taabbud mu edilir?!"], [1804.0, "<b>Nehyedilmiş bir şeyle Allah'a taabbud eden herkes bid'atçidir.<\/b> Çünkü yasaklanan şeyin hakkı terk edilmesidir, yapılması değil."], [1827.0, "Fakat bid'at ehlinden bir grup türedi;"], [1829.6, "şer'î yasaklara yönelip onları Allah Azze ve Celle'ye yaklaştıkları bir ibadet, kurbet ve taat hâline getiriyorlar."]]}, {"reader": false, "ar": [[1838.0, "كالتعبُّد لله عز وجل بسماع الملاهي وآلات الموسيقى،"], [1844.0, "أو التعبُّد لله عز وجل برقص الرجال مع النساء،"], [1852.0, "أو برقص الرجال لوحدهم،"], [1854.0, "أو التعبُّد لله عز وجل بمعاشرة الغلمان المِلاح،"], [1860.0, "أو مخالطة النساء الأجنبيّات،"], [1865.0, "أو التقرّب إلى الله عز وجل بصلاة النفل في أوقات ـ في أوقات النهي ـ بلا سبب،"], [1873.0, "كما يفعله بعض غلاة الصوفية عند طلوع الشمس وعند غروبها."]], "tr": [[1838.0, "Çalgıları ve müzik aletlerini dinleyerek Allah Azze ve Celle'ye taabbud etmek, erkeklerin kadınlarla dans etmesiyle ya da erkeklerin kendi başlarına dans etmesiyle Allah Azze ve Celle'ye taabbud etmek, güzel yüzlü oğlanlarla düşüp kalkarak ya da yabancı kadınlarla karışarak Allah Azze ve Celle'ye taabbud etmek, ya da bazı aşırı sûfîlerin güneş doğarken ve batarken yaptığı gibi, vakitlerde —nehiy (kerahat) vakitlerinde— sebepsiz nafile namaz kılarak Allah Azze ve Celle'ye yaklaşmak gibi."]]}, {"reader": false, "ar": [[1879.0, "وليس من القربة طلبُ الكرامة بالمبيت مع حيّةٍ،"], [1884.4, "أو المبيت مع حيوانٍ مفترس،"], [1896.0, "كما يفعله بعض الصوفية طلبًا للكرامة؛"], [1902.0, "لأنّ كلّ طريقٍ يُفضي إلى هلاك النفس فإنه محرّمٌ منهيٌّ عنه."], [1910.0, "وليس من القربة دعاءُ غير الله عز وجل ـ كما يجعله هؤلاء من التعبُّدات ـ ولا الاستغاثةُ بالأموات،"], [1922.0, "ولا طلبُ الحاجات منهم."]], "tr": [[1879.0, "Bir yılanla ya da vahşi bir hayvanla birlikte geceleyerek keramet aramak kurbetten değildir;"], [1896.0, "bazı sûfîlerin keramet arayarak yaptığı gibi."], [1902.0, "Çünkü nefsin helakine götüren her yol haramdır, yasaklanmıştır."], [1907.5, "Allah Azze ve Celle'den başkasına dua etmek —bunların onu taabbudlardan saydığı gibi—, ölülerden yardım dilemek ve onlardan ihtiyaçları istemek de kurbetten değildir."]]}, {"reader": false, "ar": [[1926.0, "وليس من القربة بناءُ المساجد على قبور الأولياء والصالحين،"], [1933.0, "كما يدّعيه كثيرٌ من الصوفية الغُلاة،"], [1938.0, "فإنهم يبنون المساجد مدّعين أنها قربةٌ وطاعة،"], [1944.0, "مع أنّ الأدلة المتواترة قد ثبتت بالنهي عن ذلك."], [1948.0, "والجامعُ في ذلك: أنّ كلّ من تعبّد لله بشركٍ فمبتدع،"], [1955.0, "وكلّ من تعبّد لله بمحدثةٍ فمبتدع،"], [1961.0, "وكلّ من تعبّد لله بمعصيةٍ فمبتدع؛"], [1966.0, "لأنّ كلّ من تعبّد لله بالمنهيّ عنه فقد وَلَج بابًا من أبواب البدع، والله أعلم."]], "tr": [[1926.0, "Velilerin ve salihlerin kabirleri üzerine mescid bina etmek de kurbetten değildir;"], [1935.3, "aşırı sûfîlerin çoğunun iddia ettiği gibi."], [1940.2, "Onlar mescidleri, bunun kurbet ve taat olduğunu iddia ederek bina ediyorlar;"], [1948.0, "hâlbuki mütevâtir deliller bunun yasak olduğunu sabit kılmıştır."], [1948.7, "Bunların hepsini toplayan (ölçü) şudur:"], [1950.1, "Şirkle Allah'a taabbud eden herkes bid'atçidir;"], [1953.6, "muhdes bir şeyle Allah'a taabbud eden herkes bid'atçidir;"], [1958.8, "bir günahla Allah'a taabbud eden herkes bid'atçidir."], [1966.0, "Çünkü yasaklanmış olanla Allah'a taabbud eden herkes, bid'at kapılarından birine girmiştir. Allah en iyisini bilir."]]}]}, {"ts": "32:52", "title": "7. Külliye: Taabbudu meşru ölçüden çıkaran her gulüv bid'attir", "paras": [{"reader": false, "ar": [[1972.0, "ومن الكلّيّات أيضًا: <b>كلُّ غلوٍّ أخرج التعبُّدَ عن القدر المشروع فبدعة.<\/b> <span class=\"note\">(يكررها)<\/span> وذلك لأنّ الشريعة مبنيّةٌ على الوسطيّة؛"], [1997.0, "لأنّ المتقرّر في القواعد أنّ الأمور الشرعية تُبنى على الوسطيّة التي لا غلوّ ولا جفاء فيها،"], [2008.0, "امتثالًا لقول الله عز وجل:"], [2011.0, "<span class=\"ayah\">﴿وَكَذَٰلِكَ جَعَلْنَاكُمْ أُمَّةً وَسَطًا﴾<\/span> <span class=\"ref\">[البقرة: ١٤٣]<\/span>."], [2017.0, "ويقول النبيّ صلى الله عليه وسلم:"], [2020.0, "«وإيّاكم والغلوَّ، فإنما أهلك من كان قبلكم الغلوُّ»."]], "tr": [[1972.0, "Külliyelerden biri de şudur: 7."], [1974.1, "külliye: Taabbudu meşru ölçüden çıkaran her gulüv (aşırılık) bid'attir. (Tekrar ediyor.) Bu şundandır:"], [1980.8, "Şeriat vasatlık (orta yol) üzerine kuruludur."], [1997.0, "Çünkü kaidelerde yerleşik olan şudur:"], [1999.4, "Şer'î işler, içinde ne aşırılık ne de ihmal (cefâ) bulunan vasatlık üzerine bina edilir;"], [2006.8, "Allah Azze ve Celle'nin şu sözüne uyarak:"], [2011.0, "<span class=\"ayah\">﴿Böylece sizi vasat bir ümmet kıldık﴾<\/span> [Bakara 143]."], [2018.0, "Nebî ﷺ de şöyle buyurur:"], [2020.0, "\"Gulüvden sakının; sizden öncekileri ancak gulüv helak etti.\""]]}, {"reader": false, "ar": [[2026.0, "وفي حديث عائشة: أنّ النبيّ صلى الله عليه وسلم دخل عليها وعندها فلانةُ تذكر من صلاتها،"], [2036.0, "فقال: «مَهْ يا عائشة، عليكم من الأعمال بما تُطيقون، فوالله لا يَملّ الله حتى تَملّوا»،"], [2047.0, "وكان أحبَّ الدين إليه ما داوم عليه صاحبُه."]], "tr": [[2026.0, "Âişe hadisinde de şöyledir: Nebî ﷺ onun yanına girdi;"], [2032.0, "yanında da namazından bahsedilen falanca kadın vardı."], [2036.8, "Buyurdu ki: \"Dur ey Âişe!"], [2040.6, "Amellerden gücünüzün yettiğini yapın. Allah'a yemin olsun ki siz usanmadıkça Allah usanmaz.\" Onun en sevdiği din (amel), sahibinin devamlı yaptığı idi."]]}, {"reader": false, "ar": [[2051.0, "ولا يخفى على شريف علمكم ما في الصحيحين من حديث الرهط الثلاثة،"], [2057.0, "من حديث أنسٍ رضي الله عنه قال:"], [2060.4, "«جاء ثلاثةُ رهطٍ إلى بيوت أزواج النبيّ صلى الله عليه وسلم يسألون عن عبادته، فلمّا أُخبروا بها فكأنهم تقالّوها، فقالوا: أين نحن من رسول الله صلى الله عليه وسلم؟ فإنّ الله عز وجل قد غفر له ما تقدّم من ذنبه وما تأخّر. قال أحدهم: أمّا أنا فأصلّي الليل أبدًا ولا أنام» ـ فهنا دخل الغلوّ على التعبُّد ـ «وقال الآخر: وأنا أصوم الدهر أبدًا ولا أُفطر» ـ فهنا دخل الغلوّ على التعبُّد ـ «وقال الثالث: وأنا أعتزل النساء أبدًا فلا أتزوّج» ـ فهنا دخل الغلوّ على التعبُّد."]], "tr": [[2051.0, "Sahîhayn'daki üç kişilik grup hadisi değerli ilminizden gizli değildir;"], [2053.5, "Enes'in —Allah ondan razı olsun— hadisidir, dedi ki:"], [2056.5, "\"Üç kişilik bir grup, Nebî ﷺ'in ibadetini sormak için hanımlarının evlerine geldi."], [2060.4, "Kendilerine haber verilince onu az görür gibi oldular ve 'Biz Resûlullah ﷺ'in neresindeyiz!"], [2067.2, "Allah Azze ve Celle onun geçmiş ve gelecek günahlarını bağışlamıştır' dediler."], [2073.0, "Biri 'Ben geceyi hep namazla geçireceğim, uyumayacağım' dedi\" —işte burada taabbuda gulüv girdi— \"Diğeri 'Ben de ömür boyu oruç tutacağım, hiç bozmayacağım' dedi\" —işte burada taabbuda gulüv girdi— \"Üçüncüsü 'Ben de kadınlardan hep uzak duracağım, evlenmeyeceğim' dedi\" —işte burada taabbuda gulüv girdi."]]}, {"reader": false, "ar": [[2103.0, "«فجاء إليهم النبيّ صلى الله عليه وسلم فقال: أنتم الذين قلتم كذا وكذا؟ قالوا: نعم يا رسول الله، قال: أمَا والله إنّي لأعلمُكم بالله وأخشاكم له، ولكنّي أصلّي وأنام، وأصوم وأُفطر، وأتزوّج النساء، فمن رغب عن سنّتي فليس منّي»."], [2123.0, "وقال صلى الله عليه وسلم:"], [2127.0, "«ليُصلِّ أحدُكم نشاطَه، فإذا فتر فليقعد، فإذا فتر فليقعد»."]], "tr": [[2103.0, "\"Nebî ﷺ yanlarına geldi ve 'Şöyle şöyle diyenler sizler misiniz?' dedi."], [2108.7, "'Evet, ey Allah'ın Resûlü' dediler."], [2111.0, "Buyurdu ki: 'Dikkat edin! Allah'a yemin ederim ki ben Allah'ı en iyi bileniniz ve O'ndan en çok korkanınızım."], [2123.0, "Fakat ben namaz kılarım ve uyurum, oruç tutarım ve açarım, kadınlarla da evlenirim."], [2127.0, "Kim benim sünnetimden yüz çevirirse benden değildir.'\" Yine o ﷺ şöyle buyurdu:"], [2130.9, "\"Sizden biri zinde olduğu sürece namaz kılsın; yorulunca otursun, yorulunca otursun.\""]]}, {"reader": false, "ar": [[2137.0, "وقال صلى الله عليه وسلم:"], [2139.0, "«إذا نَعَس أحدُكم وهو يصلّي فليرقد حتى يذهب عنه النوم، فإنّ أحدكم إذا صلّى وهو ناعسٌ لا يدري لعلّه يستغفر فيسبّ نفسه»."], [2153.0, "ولأنّ النبيّ صلى الله عليه وسلم قال:"], [2157.0, "«إنّ الدين يسر، ولن يُشادّ ـ وهذا هو الغلوّ ـ ولن يُشادّ الدينَ أحدٌ إلا غلبه، فسدّدوا وقاربوا»."]], "tr": [[2137.0, "Yine o ﷺ şöyle buyurdu:"], [2139.0, "\"Sizden biri namaz kılarken uyuklarsa, uykusu gidinceye kadar uyusun."], [2143.8, "Çünkü sizden biri uyuklarken namaz kılarsa, belki istiğfar ettiğini sanarken kendine beddua eder de farkına varmaz.\" Ayrıca Nebî ﷺ şöyle buyurmuştur:"], [2153.0, "\"Din kolaylıktır. Hiç kimse zorlamaz —işte gulüv budur— hiç kimse dini zorlamaya kalkışmaz ki din ona galip gelmesin."], [2162.0, "O hâlde doğru olanı yapın ve (ona) yaklaşın.\""]]}]}, {"ts": "36:09", "title": "7. Külliye (devam): Gulüv örnekleri — sürekli oruç, bütün gece ibadet, cemreler, adak ve abdest", "paras": [{"reader": false, "ar": [[2169.0, "وقبل ذلك يقول الله عز وجل:"], [2173.0, "<span class=\"ayah\">﴿يَا أَهْلَ الْكِتَابِ لَا تَغْلُوا فِي دِينِكُمْ﴾<\/span> <span class=\"ref\">[النساء: ١٧١]<\/span>."], [2176.0, "فالغلوّ هو البوّابة الكبرى التي أفسدت التعبُّدات والعقائد؛"], [2181.0, "فكلُّ غلوٍّ دخل في عقيدةٍ أفسدها،"], [2185.0, "وكلُّ غلوٍّ دخل على تعبُّدٍ أفسده."], [2190.0, "فالله عز وجل يريد منّا الوسطيّة في أمر الاعتقاد وفي أمر التعبُّدات."]], "tr": [[2169.0, "Bundan önce de Allah Azze ve Celle şöyle buyurur:"], [2173.0, "<span class=\"ayah\">﴿Ey Kitap ehli! Dininizde aşırı gitmeyin﴾<\/span> [Nisâ 171]."], [2176.0, "Gulüv, taabbudları ve akîdeleri bozan en büyük kapıdır."], [2181.0, "Bir akîdeye giren her gulüv onu bozmuştur;"], [2185.0, "bir taabbuda giren her gulüv onu bozmuştur."], [2190.0, "Allah Azze ve Celle bizden itikad işinde de taabbudlar işinde de vasatlık istemektedir."]]}, {"reader": false, "ar": [[2198.0, "وبناءً على ذلك: فلا يجوز أن نتعبّد لله عز وجل بصيام الدهر كلّه،"], [2205.0, "كما في الحديث: «لا صام من صام الدهر»،"], [2210.0, "وفي روايةٍ: «لا صام ولا أفطر»."], [2214.0, "ونهى النبيّ صلى الله عليه وسلم عبدَ الله بن عمرو بن العاص رضي الله عنهما عن صيام الدهر؛"], [2224.0, "لأنه غلوٌّ دخل على تعبُّدٍ فأخرجها عن المقدار المطلوب شرعًا."]], "tr": [[2198.0, "Buna göre: Bütün sene oruç tutarak Allah Azze ve Celle'ye taabbud etmemiz caiz değildir;"], [2206.9, "hadiste geldiği gibi: \"Ömür boyu oruç tutan oruç tutmuş olmaz.\" Bir rivayette de:"], [2214.0, "\"Ne oruç tutmuş ne de yemiş olur.\" Nebî ﷺ, Abdullah b."], [2218.4, "Amr b. el-Âs'ı —Allah ikisinden de razı olsun— ömür boyu oruç tutmaktan nehyetti;"], [2224.0, "çünkü bu, bir taabbuda girip onu şer'an istenen miktardan çıkaran bir gulüvdür."]]}, {"reader": false, "ar": [[2231.0, "وليس من السنّة أن يقوم الإنسان الليلَ كلَّه،"], [2238.0, "بل السنّة أن يقوم بعضًا وينام بعضًا،"], [2244.0, "كما قال صلى الله عليه وسلم:"], [2247.3, "«خيرُ الصلاة صلاةُ داود، كان ينام نصفَ الليل، ويقوم ثلثَه، وينام سدسَه»."], [2254.0, "وفي صحيح مسلمٍ من حديث عائشة رضي الله عنها قالت:"], [2259.9, "«وما علمتُ أنّ النبيّ صلى الله عليه وسلم قام الليلَ إلى الصباح، ولا قرأ القرآن في ليلة، ولا صام شهرًا كاملًا غيرَ رمضان»،"], [2274.0, "أو كما قالت رضي الله تعالى عنها."]], "tr": [[2231.0, "İnsanın bütün geceyi ibadetle geçirmesi sünnetten değildir;"], [2236.1, "aksine sünnet, bir kısmında kalkıp bir kısmında uyumasıdır."], [2244.0, "Nitekim o ﷺ şöyle buyurmuştur:"], [2247.3, "\"Namazın en hayırlısı Dâvûd'un namazıdır:"], [2249.6, "Gecenin yarısını uyur, üçte birini kalkıp namaz kılar, altıda birini uyurdu.\" Sahîh-i Müslim'de Âişe'den —Allah ondan razı olsun— gelen hadiste şöyle dedi:"], [2259.9, "\"Nebî ﷺ'in geceyi sabaha kadar ibadetle geçirdiğini, Kur'an'ı bir gecede okuduğunu ve Ramazan dışında tam bir ay oruç tuttuğunu bilmiyorum.\" Ya da onun —Allah ondan razı olsun— dediği gibi."]]}, {"reader": false, "ar": [[2277.0, "وليس من السنّة رميُ الجمرات بالحجارة الكبيرة،"], [2281.0, "أو بالنِّعال، أو بالمظلّات؛"], [2283.0, "فهذا من الغلوّ الذي يُدخله الشيطانُ على التعبُّد ليُفسده."], [2288.0, "وليس من السنّة أن ينذر الإنسان التعبُّدَ مقرونًا بالسكوت،"], [2295.0, "أو مقرونًا بالقيام وعدم القعود،"], [2300.0, "أو مقرونًا بالبروز للشمس وعدم الاستظلال؛"], [2304.0, "فذلك غلوٌّ دخل على التعبُّد."]], "tr": [[2277.0, "Cemreleri büyük taşlarla, ayakkabılarla veya şemsiyelerle taşlamak sünnetten değildir;"], [2283.0, "bu, şeytanın taabbudu bozmak için ona soktuğu gulüvdendir."], [2288.0, "İnsanın, susmakla, ya da ayakta durup oturmamakla, ya da güneşe çıkıp gölgelenmemekle birleşik bir taabbud adaması sünnetten değildir;"], [2304.0, "bu, taabbuda girmiş bir gulüvdür."]]}, {"reader": false, "ar": [[2307.0, "وقد رأى النبيّ صلى الله عليه وسلم رجلًا واقفًا في الشمس لا يتكلّم،"], [2314.0, "فسأل عنه، فقالوا: فلانٌ نذر أن يصوم ولا يستظلّ ولا يتكلّم،"], [2322.0, "فقال: «مُرُوه فليتكلّم، وليستظلّ، وليقعد، وليُتمّ صيامه»؛"], [2330.0, "يعني: جرِّد التعبُّد من هذا الغلوّ الذي دخل عليه."]], "tr": [[2307.0, "Nebî ﷺ güneşte ayakta duran ve konuşmayan bir adam gördü;"], [2313.5, "onu sordu. \"Falanca; oruç tutmayı, gölgelenmemeyi ve konuşmamayı adadı\" dediler."], [2322.7, "Buyurdu ki: \"Ona söyleyin, konuşsun, gölgelensin, otursun ve orucunu tamamlasın.\" Yani:"], [2332.1, "Taabbudu, ona girmiş olan bu gulüvden arındır."]]}, {"reader": false, "ar": [[2338.0, "وليس من السنّة ـ بل هو من المحدثات ـ الزيادةُ على الغسلات الثلاث في الوضوء،"], [2347.0, "فإنّ ذلك من المحدثات،"], [2352.0, "كما في مسند أحمد بإسنادٍ صحيحٍ لغيره من حديث عمرو بن شعيبٍ عن أبيه عن جدّه:"], [2361.0, "أنّ رجلًا جاء إلى النبيّ صلى الله عليه وسلم يسأله عن الوضوء،"], [2366.0, "فأراه ثلاثًا ثلاثًا، وقال:"], [2369.1, "«هكذا الوضوء، فمن زاد على هذا فقد أساء وتعدّى وظلم»."]], "tr": [[2338.0, "Abdestte üç yıkamanın üzerine ziyade etmek sünnetten değildir;"], [2345.7, "aksine muhdes işlerdendir. Bu muhdes işlerdendir;"], [2353.7, "nitekim Müsned-i Ahmed'de, sahîh li-ğayrihî bir isnadla Amr b."], [2361.0, "Şuayb'ın babasından, onun da dedesinden rivayet ettiği hadiste şöyledir:"], [2363.1, "Bir adam Nebî ﷺ'e gelip abdesti sordu."], [2364.8, "O da ona (azaları) üçer üçer (yıkayarak) gösterdi ve buyurdu ki:"], [2369.1, "\"Abdest böyledir. Kim bunun üzerine ziyade ederse kötü yapmış, haddi aşmış ve zulmetmiştir.\""]]}, {"reader": false, "ar": [[2376.0, "وليس من السنّة استعمالُ المنظّفات في الوضوء طلبًا لزيادة التنظيف،"], [2385.0, "فإنّ هذا من الغلوّ الذي يجعل هذا الوضوء من البدع،"], [2388.0, "يجعله من البدع. وليس من السنّة المبالغةُ ـ انتبه ـ في مسح الرأس بغسله؛"], [2400.0, "فإنّ من الناس من يقول:"], [2402.0, "إنّ الغسل أفضلُ وأعمق من مجرّد المسح،"], [2408.0, "فيغسله بدلَ مسحه، فهذا غلوٌّ دخل على التعبُّد فيُفسده."]], "tr": [[2376.0, "Daha fazla temizlik arayarak abdestte temizlik maddeleri kullanmak sünnetten değildir;"], [2385.6, "çünkü bu, abdesti bid'atlerden kılan gulüvdendir, onu bid'atlerden kılar."], [2391.0, "Başı mesh etmede —dikkat et— onu yıkayarak mübalağa etmek de sünnetten değildir."], [2400.0, "İnsanlardan kimi \"Yıkamak sadece meshten daha faziletli ve daha derindir\" der ve başını meshetmek yerine yıkar."], [2409.3, "Bu, taabbuda girmiş bir gulüvdür; onu bozar."]]}, {"reader": false, "ar": [[2414.0, "وليس من السنّة تركُ الزواج تعبُّدًا،"], [2418.3, "وغير ذلك. فالله عز وجل حذّرنا من دخول الغلوّ في التعبُّدات؛"], [2427.0, "لأنه يُفسدها ويقلبها من تعبُّدٍ إلى بد.."], [2432.0, "إلى بدعةٍ، باعتبار ذلك الوصف الدخيل عليه."]], "tr": [[2414.0, "Taabbud maksadıyla evliliği terk etmek ve benzerleri de sünnetten değildir."], [2421.0, "Allah Azze ve Celle bizi taabbudlara gulüvün girmesinden sakındırmıştır;"], [2427.0, "çünkü gulüv onları bozar ve ona sonradan eklenen o vasıf itibarıyla onu taabbuddan bid'.. bid'ate çevirir."]]}]}, {"ts": "40:37", "title": "8. Külliye: Mubahı aslen terk ederek Allah'a taabbud eden herkes bid'atçidir", "paras": [{"reader": false, "ar": [[2437.0, "ومن الكلّيّات أيضًا: <b>كلُّ من تعبّد لله بترك المباح أصالةً فمبتدع.<\/b> <span class=\"note\">(يكررها)<\/span> كلُّ من تعبّد لله عز وجل بترك المباح أصالةً،"], [2465.2, "أي: كُلًّا، ما عاد يفعل هذا المباحَ أبدًا،"], [2469.0, "فهو تركُ أصالةٍ، لا تركُ أبعاضٍ وأجزاء."], [2473.0, "فهمتم معنى قولي: «ترك أصالة»؟"], [2479.0, "ترك أصالة، يعني: تركه من أصله،"], [2483.0, "تركه تركًا كلّيًّا، أي:"], [2485.7, "الترك المطلق، لا مطلق الترك؛ فهذا من البدع."]], "tr": [[2437.0, "Külliyelerden biri de şudur: 8."], [2439.1, "külliye: Mubahı aslen terk ederek Allah'a taabbud eden herkes bid'atçidir. (Tekrar ediyor.) Mubahı aslen terk ederek Allah Azze ve Celle'ye taabbud eden herkes;"], [2465.9, "yani tamamen (terk eden), o mubahı artık hiç yapmayan kişi."], [2469.6, "Bu, bazı kısım ve parçaları terk etmek değil, aslen terktir."], [2475.4, "\"Aslen terk\" sözümün manasını anladınız mı?"], [2481.0, "Aslen terk, yani onu kökünden terk etmesi, tamamen terk etmesi;"], [2485.7, "yani mutlak terk, terkin mutlakı (herhangi bir terk) değil. İşte bu bid'atlerdendir."]]}, {"reader": false, "ar": [[2492.0, "وأنتم ترون أنّ المباح أحيانًا يكون التعبُّد به لذاته بدعةً ـ كما قرّرتُ في الكلّيّة الأولى ـ ويكون تركُه كُلًّا تعبُّدًا من البدع أيضًا."], [2513.0, "وذلك لأنّ في حديث الرهط الثلاثة ـ في بعض الروايات ـ قال:"], [2519.0, "«وقال الآخر: وأنا لا آكل اللحم» ـ والحديث في الصحيح في بعض الروايات ـ قال:"], [2526.9, "«وأنا لا آكل اللحم»،"], [2529.3, "قال النبيّ صلى الله عليه وسلم ردًّا عليه:"], [2534.2, "«وآكلُ اللحم، فمن رغب عن سنّتي فليس منّي»."]], "tr": [[2492.0, "Görüyorsunuz ki mubahla bizzat kendisi için taabbud etmek bazen bid'at olur —birinci külliyede ortaya koyduğum gibi—;"], [2504.4, "onu taabbud maksadıyla tamamen terk etmek de bid'atlerden olur."], [2513.0, "Bu şundandır: Üç kişilik grup hadisinde —bazı rivayetlerde— şöyle geçer:"], [2519.0, "\"Diğeri: 'Ben de et yemeyeceğim' dedi.\" —Hadis Sahîh'te bazı rivayetlerde vardır— \"Ben de et yemeyeceğim\" dedi."], [2526.9, "Nebî ﷺ ona reddiye olarak:"], [2529.9, "\"Ben et de yerim. Kim benim sünnetimden yüz çevirirse benden değildir\" buyurdu."]]}, {"reader": false, "ar": [[2539.0, "ولأنّ الرجل الذي نذر أن يصوم فإنه قرن نذرَه بترك مباحاتٍ تعبُّدًا:"], [2550.0, "فمن المباحات الاستظلالُ عن الشمس،"], [2553.6, "وهو نذر أن يتركه،"], [2557.0, "ومن المباحات القعودُ عن قيام،"], [2560.5, "وهو نذر أن يتركه تعبُّدًا،"], [2565.0, "ومن المباحات الكلام، وهو نذر أن يتركه؛"], [2573.0, "فنهاه النبيّ صلى الله عليه وسلم عن أن يتعبّد لله عز وجل بترك هذه المباحات."]], "tr": [[2539.0, "Ayrıca oruç tutmayı adayan adam, adağını taabbud maksadıyla bazı mubahları terk etmekle birleştirmişti:"], [2550.0, "Güneşten gölgelenmek mubahlardandır, o bunu terk etmeyi adadı."], [2555.0, "Ayakta durmaktan (yorulunca) oturmak mubahlardandır, o bunu taabbud maksadıyla terk etmeyi adadı."], [2565.0, "Konuşmak mubahlardandır, o bunu terk etmeyi adadı."], [2573.0, "Nebî ﷺ de onu bu mubahları terk ederek Allah Azze ve Celle'ye taabbud etmekten nehyetti."]]}, {"reader": false, "ar": [[2580.0, "ولأنّ التعبُّد لله بترك المباح ممّا يخالف مقصودَ الشارع في إباحتها؛"], [2588.0, "فإنّ الله عز وجل إنما أباح لنا المباحات ليوسّع علينا دنيانا وديننا،"], [2596.0, "فلا ينبغي أن يقصد الإنسان في تعبُّده أمرًا يناقض مقصودَ الشارع فيه،"], [2604.0, "فلا ينبغي للإنسان أن يقصد في تعبُّده أمرًا ينافي أو يناقض مقصودَ الشارع فيه."], [2612.0, "فالشارع إنما قصد بالمباحات التوسّع،"], [2616.0, "وأنت تقصد أن تتركها تعبُّدًا،"], [2619.7, "فتعارض المقصودان؛ فأنّى يقبل اللهُ عز وجل منك تعبُّدًا ينافي مقصودَه؟!"]], "tr": [[2580.0, "Ayrıca mubahı terk ederek Allah'a taabbud etmek, Şâri'in onları mubah kılmaktaki maksadına aykırıdır."], [2588.0, "Çünkü Allah Azze ve Celle mubahları bize ancak dünyamızı ve dinimizi genişletmek için mubah kılmıştır."], [2596.7, "İnsanın taabbudunda, Şâri'in o husustaki maksadıyla çelişen bir şeyi kastetmesi uygun değildir;"], [2603.3, "insanın taabbudunda Şâri'in o husustaki maksadına aykırı düşen veya onunla çelişen bir şeyi kastetmesi uygun değildir."], [2612.0, "Şâri mubahlarla ancak genişliği kastetmiştir;"], [2615.2, "sen ise onları taabbud maksadıyla terk etmeyi kastediyorsun;"], [2621.6, "böylece iki maksat çatışmıştır. Allah Azze ve Celle, O'nun maksadına aykırı bir taabbudu senden nasıl kabul etsin?!"]]}]}, {"ts": "43:48", "title": "8. Külliye (devam): Selefin mubahları terk etmesi nasıl anlaşılır — üç yorum", "paras": [{"reader": false, "ar": [[2628.0, "فإن قلتَ: أوَلم يُنقل عن كثيرٍ من السلف ـ من الصحابة والتابعين ـ أنهم كانوا يتركون كثيرًا من المباحات زهدًا وورعًا؟"], [2643.0, "الجواب: بلى، ولكنّ هذا الترك لا بدّ أن يُحمل على محملين أو ثلاثة."]], "tr": [[2628.0, "Şayet \"Selefin —sahâbe ve tâbiînin— çoğundan, zühd ve vera' sebebiyle pek çok mubahı terk ettikleri nakledilmedi mi?\" dersen, cevap:"], [2644.1, "Evet, (nakledildi). Fakat bu terkin iki veya üç yoruma hamledilmesi gerekir."]]}, {"reader": false, "ar": [[2653.0, "المحمل الأوّل: على أنه تركُ أبعاضٍ،"], [2658.0, "لا تركُ أصالة؛ يعني بمعنى:"], [2662.5, "أنهم يتركون لذيذَ الطعام،"], [2666.0, "لكن لا يتركون أصلَ الطعام،"], [2668.0, "أو يتركون نوعًا من الكلام،"], [2670.0, "لا يتركون أصلَ الكلام،"], [2673.0, "أو يتركون نوعًا من الاستظلال ـ كـ(ما) في الحجّ أو النُّسُك وغير ذلك ـ لكن لا،"], [2680.3, "لا تركَ الاستظلال كُلًّا،"], [2683.0, "أو يتركون نوعًا من اللباس،"], [2688.0, "لكن لا يتركونه أصالةً."]], "tr": [[2653.0, "Birinci yorum: Bunun aslen terk değil, bazı kısımları terk olduğudur."], [2656.1, "Yani lezzetli yemeği terk ederler, fakat yemeğin aslını terk etmezler;"], [2661.0, "ya da bir tür konuşmayı terk ederler, konuşmanın aslını terk etmezler;"], [2668.4, "ya da —hac veya nüsük ve benzerlerinde olduğu gibi— bir tür gölgelenmeyi terk ederler, fakat hayır, gölgelenmeyi tamamen terk etmek değil;"], [2679.7, "ya da bir tür elbiseyi terk ederler, fakat onu aslen terk etmezler."]]}, {"reader": false, "ar": [[2690.0, "فإن لم تقبل هذا المحمل فانتقل إلى المحمل الثاني:"], [2695.8, "وهو أنهم كانوا يتركونه إذا علموا أو غلب على ظنّهم أنه يُفضي بهم إلى الممنوع؛"], [2707.0, "فإنهم كانوا يتركون فضولَ المباحات،"], [2710.6, "لكن لا يتركون المباحات،"], [2714.0, "ويعلّلون تركَ الفضول بأنّ من توسّع في المباح فإنه يُخشى عليه أن يقع في الحرام،"], [2723.0, "فكانوا يجعلون تركَ الفضول برزخًا بين المباح وبين الوقوع في الحرام."]], "tr": [[2690.0, "Bu yorumu kabul etmezsen ikinci yoruma geç:"], [2695.8, "O da şudur: Onlar, bir şeyin kendilerini yasak olana götüreceğini bildiklerinde veya buna zanları galip geldiğinde onu terk ederlerdi."], [2702.2, "Onlar mubahların fazlasını terk ederlerdi, fakat mubahları terk etmezlerdi."], [2707.0, "Fazlayı terk etmeyi de şöyle gerekçelendirirlerdi:"], [2712.7, "Mubahta genişliğe giden kimsenin harama düşmesinden korkulur."], [2718.8, "Böylece fazlayı terk etmeyi mubah ile harama düşmek arasında bir berzah (engel) kılarlardı."]]}, {"reader": false, "ar": [[2730.0, "وأنتم ترون أنّ من يتوسّع في بعض المباحات أحيانًا فلا بدّ أن يقوده هذا التوسّع في يومٍ من الأيام إلى الوقوع في الحرام؛"], [2742.0, "فكانوا يجعلون تركَ فضول هذه المباحات من البرزخ الذي يتّقون به الحرام."]], "tr": [[2730.0, "Görüyorsunuz ki bazen bazı mubahlarda genişliğe giden kimseyi bu genişlik bir gün mutlaka harama düşmeye sürükler."], [2740.0, "Bu yüzden onlar bu mubahların fazlasını terk etmeyi, kendisiyle haramdan korundukları berzahtan sayarlardı."]]}, {"reader": false, "ar": [[2751.0, "والمحمل الثالث: أنّنا سلّمنا ـ جدلًا ـ أنك لم تقبل شيئًا من ذلك،"], [2759.0, "فإننا لسنا بمأمورين بمتابعة أحدٍ غيرِ النبيّ صلى الله عليه وسلم،"], [2766.0, "وقد ثبت عنه صلى الله عليه وسلم أنه كان يلبس الثوب الجميل،"], [2771.0, "وكان يتطيّب بالطيب الجميل،"], [2773.9, "وكان يدّهن بالدُّهن الطيّب،"], [2779.0, "وكان يقول صلى الله عليه وسلم:"], [2781.8, "«إنّ الله يحبّ أن يرى أثرَ نعمته على عبده»،"], [2786.0, "كما في حديث عمرو بن شعيبٍ عن أبيه عن جدّه،"], [2790.2, "وغير ذلك. ولا أظنّنا ـ إن شاء الله ـ نحتاج إلى هذا الجواب الثالث ما دام معنا هذه الأجوبة السابقة."]], "tr": [[2751.0, "Üçüncü yorum: Tartışma uğruna, bunlardan hiçbirini kabul etmediğini varsayalım;"], [2759.6, "biz Nebî ﷺ'den başka kimseye uymakla emrolunmadık."], [2765.4, "Ondan ﷺ sabit olmuştur ki güzel elbise giyerdi, güzel koku sürünürdü, güzel yağ sürünürdü ve o ﷺ şöyle buyururdu:"], [2781.8, "\"Allah, nimetinin eserini kulunun üzerinde görmeyi sever.\" Amr b."], [2786.0, "Şuayb'ın babasından, onun da dedesinden rivayet ettiği hadiste ve başkalarında olduğu gibi."], [2791.0, "İnşallah elimizde bu önceki cevaplar olduğu sürece bu üçüncü cevaba ihtiyaç duyacağımızı sanmıyorum."]]}]}, {"ts": "46:40", "title": "9. Külliye: Ehl-i Sünnet arasında ihtilaflı meselede kişiler bid'atçi sayılmaz", "paras": [{"reader": false, "ar": [[2800.0, "ومن الكلّيّات أيضًا ـ وهي الكلّيّة التاسعة <span class=\"q\">؟ 46:40<\/span> ـ:"], [2806.0, "<b>كلُّ مسألةٍ خلافيّةٍ بين أهل السنة فلا يُبدَّع فيها الأعيان.<\/b> <span class=\"note\">(يكررها)<\/span> لعلّي نقف عند هذا،"], [2830.0, "إن شاء الله نشرح (ها) الدرسَ القادم."], [2832.0, "والله أعلى وأعلم، وصلى الله وسلم على نبيّنا محمد."]], "tr": [[2800.0, "Külliyelerden biri de —o da 9."], [2806.0, "külliyedir <span class=\"q\">؟<\/span>—: <b>9. külliye: Ehl-i Sünnet arasında ihtilaflı olan her meselede kişiler (belirli şahıslar) bid'atçi sayılmaz.<\/b> (Tekrar ediyor.) Burada duralım;"], [2830.3, "inşallah (onu) gelecek derste şerh ederiz."], [2832.0, "Allah en yüce olandır ve en iyisini bilendir."], [2835.7, "Allah, Nebîmiz Muhammed'e salât ve selâm etsin."]]}]}]};

  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);

    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});

});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);

  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
