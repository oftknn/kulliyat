ْلَمُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٦٩]<\/span> <span class=\"note\">(Şeyh «بالسوء» yerine «بالشرك» der gibi.)<\/span>."], [2767.0, "هذا من أعظم مَحابِّ الشيطان فينا."]], "tr": [[2730.0, "Çünkü Allah Teâlâ haramları en büyüklerine doğru sıralayarak açıklarken şöyle buyurmuştur:"], [2734.0, "<span class=\"ayah\">﴿…ve Allah hakkında bilmediğiniz şeyleri söylemeniz﴾<\/span> [A'râf 33]."], [2737.0, "Allah Teâlâ şöyle de buyurur:"], [2739.0, "<span class=\"ayah\">﴿Allah'a yalan iftira etmek için dillerinizin uydurduğu yalana dayanarak \"Bu helaldir, bu haramdır\" demeyin﴾<\/span> [Nahl 116]."], [2739.0, "Allah hakkında bilgisizce konuşmak, şeytanın bizde gerçekleştirmek istediği en büyük hedeflerdendir."], [2754.0, "Çünkü Allah Teâlâ şeytanın en büyük hedefleri hakkında şöyle buyurmuştur:"], [2759.0, "<span class=\"ayah\">﴿O size ancak kötülüğü ve hayâsızlığı emreder﴾<\/span> ve ne?"], [2764.0, "<span class=\"ayah\">﴿…ve Allah hakkında bilmediğiniz şeyleri söylemenizi﴾<\/span> [Bakara 169]."], [2764.0, "Bu, şeytanın bizde en çok sevdiği şeylerdendir."]]}, {"reader": false, "ar": [[2772.0, "ومن البوابات العظيمة التي تجعلنا نقول على الله بلا علمٍ تتبُّعُ تفاصيل الغيب التي سكت عنها النص؛"], [2781.0, "كقولك مثلًا: ينزل ربنا،"], [2785.0, "وبعد نزوله هل يخلو العرش منه أو لا؟"], [2789.0, "مسألة الخلوّ من عدمه شيءٌ سكت عنه النص،"], [2793.0, "فكان الأَولى والأسلم ألّا نختلف فيه معاشرَ أهل السنة والجماعة."], [2799.0, "وإذا سمعتَ قول الله عز وجل ـ عفوًا ـ وإذا سمعتَ قول النبي ﷺ:"], [2807.0, "«ينزل» ـ عفوًا ـ في قول الله عز وجل:"], [2811.0, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span>،"], [2813.0, "إياك أن تقول: إن من ضرورات الاستواء أن يكون المستوى عليه أكبر ممن يجلس عليه،"], [2819.0, "وأن المستوي عليه مفتقرٌ أو محتاجٌ له."], [2827.0, "كلُّ ذلك من باب البحث في تفاصيل غيبيةٍ سكت عنها النص،"], [2832.0, "وهذا ليس بخيرٍ لك."]], "tr": [[2772.0, "Bizi Allah hakkında bilgisizce konuşturan büyük kapılardan biri de nassın hakkında sustuğu gayb ayrıntılarının peşine düşmektir."], [2772.0, "Mesela şöyle demen gibi: \"Rabbimiz iner;"], [2785.0, "indikten sonra Arş O'ndan boş kalır mı, kalmaz mı?\" Boş kalıp kalmama meselesi nassın hakkında sustuğu bir şeydir;"], [2793.0, "biz Ehl-i Sünnet ve'l-Cemaat topluluğunun bu konuda ihtilaf etmemesi daha uygun ve daha selametliydi."], [2799.0, "Allah Teâlâ'nın sözünü işittiğinde —pardon— Nebî ﷺ'in \"iner\" sözünü işittiğinde —pardon— Allah Teâlâ'nın <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> sözü hakkında sakın şöyle deme:"], [2813.0, "\"İstivânın zaruretlerinden biri, üzerine istivâ edilen şeyin üzerinde oturandan daha büyük olmasıdır ve istivâ eden ona muhtaçtır.\" Bütün bunlar nassın hakkında sustuğu gaybî ayrıntıları araştırma kabilindendir ve bu senin için hayırlı değildir."]]}, {"reader": false, "ar": [[2833.0, "وكالذي يقول: كيف تقولون بأن الله ينزل في ثلث الليل الآخر،"], [2839.0, "مع أننا نجد أن ثلث الليل الآخر دائرٌ على الأرض لا يرتفع عنها أبدًا،"], [2844.0, "فهذا يقتضي أن يكون الله نازلًا أبدًا؟"], [2846.0, "نقول: وهل أُمرتَ بالبحث والكشف عن هذا الأمر الغيبي،"], [2850.0, "أم أنك مأمورٌ بإثبات صفة النزول فقط؟"], [2853.0, "الجواب: أنت مأمورٌ بالإيمان بهذه الصفة،"], [2857.0, "وما وراءها من التفاصيل الغيبية هي أكبر من مدركات عقلك،"], [2862.3, "وأعظم من علمك وفهمك،"], [2865.0, "فلا تخُضْ فيها يا بنيّ حتى لا تضلّ."]], "tr": [[2833.0, "Şöyle diyen kimse gibi: \"Allah'ın gecenin son üçte birinde indiğini nasıl söylersiniz?"], [2839.0, "Oysa gecenin son üçte birinin yeryüzünde dolaşıp durduğunu, ondan hiç kalkmadığını görüyoruz;"], [2844.0, "bu, Allah'ın sürekli inmiş olmasını gerektirir.\" Deriz ki:"], [2846.0, "Sen bu gaybî işi araştırmak ve keşfetmekle mi emrolundun, yoksa sadece nüzul sıfatını isbat etmekle mi emrolundun?"], [2853.0, "Cevap: Sen bu sıfata iman etmekle emrolundun."], [2857.0, "Onun ötesindeki gaybî ayrıntılar aklının idrak alanından daha büyük, ilminden ve anlayışından daha yücedir."], [2865.0, "Ey oğulcuğum, sapmaman için onlara dalma."]]}, {"reader": false, "ar": [[2868.0, "فإن كثيرًا من الناس بحث في التفاصيل الغيبية بلا برهان الدليل،"], [2873.0, "فأوصله بحثُه إلى الزندقة،"], [2875.0, "وإلى الجحود، وإلى التعطيل،"], [2877.0, "وإلى إخراج الأمور عن دلالاتها الصحيحة."], [2880.0, "فنصيحةُ محبّكم لكم: اسكتوا عمّا سكت عنه النص من أمور الغيب،"], [2886.0, "ولا تبحثوا في التفاصيل التي لم يتطرّق لها النص،"], [2890.0, "وأن تعلموا أن الواجب عليكم إنما هو الإيمان بظاهر ذلك النص،"], [2897.0, "والسكوت عمّا سوى ذلك."]], "tr": [[2868.0, "Çünkü insanların birçoğu, delilin burhanı olmaksızın gaybî ayrıntıları araştırdı;"], [2873.0, "araştırması onu zındıklığa, inkâra, ta'tile ve meseleleri sahih delâletlerinden çıkarmaya götürdü."], [2877.0, "Sizi sevenin size nasihati şudur:"], [2880.0, "Gayb işlerinden nassın sustuğu şeyde susun, nassın değinmediği ayrıntıları araştırmayın ve bilin ki size düşen, ancak o nassın zahirine iman etmek ve bunun dışında kalan hakkında susmaktır."]]}]}, {"ts": "48:20", "title": "16. Külliye: Delil gelmemiş gayb ayrıntılarına dalan halis tevhidden mahrum kalır", "paras": [{"reader": false, "ar": [[2900.0, "ومن الكليات أيضًا ـ ولا أدري عن رقمها،"], [2905.2, "السادسة عشرة ـ: كلُّ من خاض في تفاصيل غيبٍ… هذه قريبةٌ منها:"], [2914.0, "<b>كلُّ من خاض في تفاصيل غيبٍ لم يأتِ بها دليلٌ فإنه يُحجَب عن خالص التوحيد.<\/b> إي والله."], [2920.0, "كلُّ من خاض في تفاصيل غيبٍ لم يأتِ بها دليلُ الوحي فإنه يُحجب عن خالص التوحيد."]], "tr": [[2900.0, "Külliyelerden biri de —numarasını bilmiyorum;"], [2900.0, "on altıncı— şudur: Gayb ayrıntılarına dalan herkes… Bu, ona (önceki külliyeye) yakındır:"], [2914.0, "<b>Hakkında delil gelmemiş gayb ayrıntılarına dalan herkes halis tevhidden perdelenir (mahrum kalır).<\/b> Evet, vallahi."], [2920.0, "Hakkında vahyin delili gelmemiş gayb ayrıntılarına dalan herkes halis tevhidden perdelenir."]]}, {"reader": false, "ar": [[2932.0, "وذلك لأن المتقرّر في القواعد عند أهل السنة والجماعة أن الغيب ـ أصلًا ومتعلَّقًا ـ مبناه على التوقيف،"], [2949.0, "وأن من خاض في الغيب بلا علمٍ فلا بدّ أن ينتهي به المطاف إلى أن يقول على الله بلا علم،"], [2960.0, "ولأن أكثر من عطّلوا وحرّفوا وكفروا وأنكروا هم الذين سمحوا لعقولهم الخوضَ في الغيبيات بلا دليل."], [2978.0, "فسدًّا لذريعة الوصول إلى هذه النتائج العقدية المدمّرة <span class=\"q\">؟ 49:38<\/span> نمنع الخوض في التفاصيل الغيبية."]], "tr": [[2932.0, "Bunun sebebi şudur: Ehl-i Sünnet ve'l-Cemaat katında kaidelerde yerleşik olan, gaybın —aslı ve taallukları bakımından— tevkîf (nassa bağlılık) üzerine kurulu olmasıdır."], [2949.0, "Gayba bilgisizce dalan kimsenin sonunda varacağı yer mutlaka Allah hakkında bilgisizce konuşmaktır."], [2960.0, "Ayrıca ta'til edenlerin, tahrif edenlerin, küfre girenlerin ve inkâr edenlerin çoğu, akıllarının delilsiz olarak gaybîlere dalmasına izin verenlerdir."], [2978.0, "Bu yıkıcı <span class=\"q\">؟<\/span> akîdevî sonuçlara ulaşma yolunu kapatmak için gaybî ayrıntılara dalmayı yasaklıyoruz."]]}, {"reader": false, "ar": [[2992.0, "ولذلك لا يمكن أن يسلم توحيدُ شخصٍ تقحّم وتوغّل في البحث عن جزئيات الغيب،"], [3001.0, "إلا في حدود ما أجازه النص."], [3005.0, "وأما إذا تجاوز ذلك إلى خارج حدود النص فوالله لن يرجع بتوحيدٍ سليمٍ ولا بإيمانٍ صافٍ."]], "tr": [[2992.0, "Bu yüzden gaybın cüz'lerini araştırmaya dalan ve derinlemesine giren bir kimsenin tevhidinin selamette kalması mümkün değildir;"], [3001.0, "ancak nassın izin verdiği sınırlar içinde (kalırsa başka)."], [3005.0, "Bunu aşıp nassın sınırlarının dışına çıkarsa, vallahi ne sağlam bir tevhidle ne de saf bir imanla geri döner."]]}]}, {"ts": "50:15", "title": "17. Külliye: İtikadda istenen her şey en mükemmel şekilde açıklanmıştır", "paras": [{"reader": false, "ar": [[3015.0, "ومن الكليات أيضًا: <b>كلُّ مطلوبٍ في الاعتقاد فقد بُيِّن أتمَّ البيان.<\/b> وهذه حقيقةٌ عقديةٌ قبل أن ندرس تفاصيل الاعتقاد وجزئياته:"], [3027.5, "أنه ما من شيءٍ يقرّبنا إلى الله عز وجل ظاهرًا وباطنًا إلا وقد بُيّن لنا في الكتاب والسنة أتمَّ البيان،"], [3039.9, "بأفصح لسانٍ وأكمل بلاغة،"], [3046.0, "وأن النبي ﷺ ما ترك شيئًا يخصّنا دينًا ودنيا إلا وبيّنه لنا."], [3054.0, "ولذلك قال الله عز وجل:"], [3058.0, "<span class=\"ayah\">﴿وَأَنزَلْنَا إِلَيْكَ الذِّكْرَ لِتُبَيِّنَ لِلنَّاسِ مَا نُزِّلَ إِلَيْهِمْ﴾<\/span> <span class=\"ref\">[النحل: ٤٤]<\/span>."]], "tr": [[3015.0, "Külliyelerden biri de şudur: <b>İtikadda istenen her şey en mükemmel şekilde açıklanmıştır.<\/b> Bu, itikadın ayrıntılarını ve cüz'lerini öğrenmeden önce (bilinmesi gereken) akîdevî bir hakikattir:"], [3027.5, "Bizi zahiren ve bâtınen Allah Teâlâ'ya yaklaştıran hiçbir şey yoktur ki Kitap ve Sünnet'te en fasih dil ve en mükemmel belâgatle bize en mükemmel şekilde açıklanmış olmasın."], [3046.0, "Nebî ﷺ din ve dünya bakımından bizi ilgilendiren hiçbir şeyi bize açıklamadan bırakmamıştır."], [3054.0, "Bu yüzden Allah Teâlâ şöyle buyurmuştur:"], [3058.0, "<span class=\"ayah\">﴿İnsanlara, kendilerine indirileni açıklaman için sana bu Zikr'i (Kur'an'ı) indirdik﴾<\/span> [Nahl 44]."]]}, {"reader": false, "ar": [[3063.0, "وقال الله عز وجل ـ مبيّنًا تمامَ هذا البلاغ بكل أصوله وتفاصيله ـ:"], [3069.0, "<span class=\"ayah\">﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي﴾<\/span> <span class=\"ref\">[المائدة: ٣]<\/span>."], [3074.0, "فالدين كاملٌ باعتبار عقائده وشرائعه،"], [3079.0, "ولا يوصف الشيء بالكمال إذا كان لا يزال محتاجًا إلى بيان."], [3084.0, "ولكن لمّا كان الدين قد تمّ بيانه أتمَّ البيان وأبلغه،"], [3090.7, "بأفصح لسان، قال: <span class=\"ayah\">﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ﴾<\/span>."]], "tr": [[3063.0, "Allah Teâlâ bu tebliğin bütün usûlü ve ayrıntılarıyla tam olduğunu açıklayarak şöyle buyurmuştur:"], [3069.0, "<span class=\"ayah\">﴿Bugün size dininizi kemale erdirdim ve üzerinize nimetimi tamamladım﴾<\/span> [Mâide 3]."], [3074.0, "Din, akîdeleri ve şeriatları bakımından kâmildir."], [3079.0, "Bir şey hâlâ açıklamaya muhtaçsa kemalle nitelenmez."], [3079.0, "Fakat din en fasih dille, en mükemmel ve en beliğ şekilde açıklanmış olduğu için <span class=\"ayah\">﴿Bugün size dininizi kemale erdirdim﴾<\/span> buyurdu."]]}, {"reader": false, "ar": [[3094.0, "وهنا لطيفةٌ تفسيرية: لماذا وصف الدين بالكمال ووصف النعمة بالتمام؟"], [3101.0, "الجواب: لأن الكمال لا يكون هناك ما هو أكمل منه،"], [3110.0, "وأما النعمة فتمامها يكون هناك ما هو أتمّ منه."], [3114.0, "فالنعمة علينا أتمّها الله،"], [3117.0, "لكن قد يُتمّ الله عز وجل على بعض الناس نعمةً أعظم من هذه النعمة."], [3123.0, "لكن أما الدين فليس هناك شيءٌ يكمل به بعد أن قال:"], [3127.3, "<span class=\"ayah\">﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ﴾<\/span>."], [3129.0, "فما كان كاملًا فلا يقبل أن يكون أكملَ من هذه الصورة،"], [3134.0, "وأما ما كان تامًّا فقد يكون أتمَّ من هذه الصورة."]], "tr": [[3094.0, "Burada tefsire dair ince bir nokta vardır:"], [3094.0, "Neden dini kemalle, nimeti ise tamamlanmışlıkla (temâm) niteledi?"], [3101.0, "Cevap: Çünkü kemalde ondan daha kâmil bir şey olmaz;"], [3110.0, "nimetin tamamlanmışlığında ise ondan daha tam olan bir şey olabilir."], [3114.0, "Allah nimeti üzerimize tamamladı; fakat Allah Teâlâ bazı insanlara bu nimetten daha büyük bir nimeti tamamlayabilir."], [3123.0, "Dine gelince, <span class=\"ayah\">﴿Bugün size dininizi kemale erdirdim﴾<\/span> buyurduktan sonra onu tamamlayacak bir şey yoktur."], [3129.0, "Kâmil olan, bu hâlinden daha kâmil olmayı kabul etmez;"], [3134.0, "tam olan ise bu hâlinden daha tam olabilir."]]}, {"reader": false, "ar": [[3138.0, "فبما أن النعمة تمامُها يقبل الزيادة قال:"], [3141.5, "<span class=\"ayah\">﴿وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي﴾<\/span>، ولكن لمّا كان كمال الدين لا يقبل الزيادة قال:"], [3146.5, "<span class=\"ayah\">﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ﴾<\/span>."], [3148.0, "فالدين كاملٌ بكل تفاصيله،"], [3150.1, "لا يحتاج إلى تكميل زيدٍ ولا عُبيد،"], [3153.7, "ولا إلى بدعة مبتدع،"], [3155.8, "ولا إلى خرافة مخرّف،"], [3157.9, "ولا إلى قاعدة مبطِل."], [3160.0, "ولذلك قال الله عز وجل لنبيه ﷺ:"], [3164.7, "<span class=\"ayah\">﴿يَا أَيُّهَا الرَّسُولُ بَلِّغْ مَا أُنزِلَ إِلَيْكَ﴾<\/span> <span class=\"ref\">[المائدة: ٦٧]<\/span>،"], [3168.0, "وقال الله عز وجل:"], [3170.0, "<span class=\"ayah\">﴿وَمَا عَلَى الرَّسُولِ إِلَّا الْبَلَاغُ الْمُبِينُ﴾<\/span> <span class=\"ref\">[النور: ٥٤]<\/span>."]], "tr": [[3138.0, "Nimetin tamamlanmışlığı artmayı kabul ettiği için <span class=\"ayah\">﴿ve üzerinize nimetimi tamamladım﴾<\/span> buyurdu;"], [3141.5, "dinin kemali ise artmayı kabul etmediği için <span class=\"ayah\">﴿Bugün size dininizi kemale erdirdim﴾<\/span> buyurdu."], [3146.5, "Din bütün ayrıntılarıyla kâmildir; ne Zeyd'in ne Ubeyd'in tamamlamasına, ne bid'atçının bid'atına, ne hurafecinin hurafesine, ne de bâtıl ehlinin kaidesine muhtaçtır."], [3160.0, "Bu yüzden Allah Teâlâ Peygamberine ﷺ şöyle buyurmuştur:"], [3164.7, "<span class=\"ayah\">﴿Ey Resul! Sana indirileni tebliğ et﴾<\/span> [Mâide 67]."], [3168.0, "Allah Teâlâ şöyle de buyurmuştur:"], [3170.0, "<span class=\"ayah\">﴿Resule düşen ancak apaçık tebliğdir﴾<\/span> [Nûr 54]."]]}, {"reader": false, "ar": [[3173.0, "وقال الله عز وجل:"], [3175.7, "<span class=\"ayah\">﴿لَقَدْ جَاءَكُمْ رَسُولٌ مِّنْ أَنفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُم بِالْمُؤْمِنِينَ رَءُوفٌ رَّحِيمٌ﴾<\/span> <span class=\"ref\">[التوبة: ١٢٨]<\/span>."], [3186.0, "فتلك الصفات تدل على أنه ما ترك شيئًا يخصّنا في دينٍ ولا دنيا إلا وقد بيّنه لنا،"], [3192.0, "إذ لو كان قد كتم عنا شيئًا ينفعنا في طريقنا إلى الله لكان ذلك من الغشّ والتلبيس،"], [3198.0, "وحاشا رسولَ الله ﷺ أن يوصف بشيءٍ من ذلك."], [3202.0, "ولذلك يقول بعض الصحابة:"], [3204.3, "«ما مات رسول الله ﷺ وطائرٌ يقلّب جناحيه في السماء إلا ذكر لنا منه علمًا»."]], "tr": [[3173.0, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿Andolsun size içinizden öyle bir resul geldi ki sıkıntıya uğramanız ona ağır gelir; size çok düşkündür; müminlere karşı çok şefkatli, çok merhametlidir﴾<\/span> [Tevbe 128]."], [3175.7, "Bu sıfatlar onun, din ve dünya bakımından bizi ilgilendiren hiçbir şeyi bize açıklamadan bırakmadığını gösterir."], [3186.0, "Çünkü Allah'a giden yolumuzda bize fayda verecek bir şeyi bizden gizlemiş olsaydı, bu bir aldatma ve karıştırma olurdu;"], [3192.0, "Resûlullah ﷺ bunlardan herhangi biriyle nitelenmekten münezzehtir."], [3198.0, "Bu yüzden sahabeden biri şöyle der:"], [3202.0, "\"Resûlullah ﷺ, gökte kanatlarını çırpan bir kuş hakkında bile bize bir ilim anlatmış olarak vefat etti.\""]]}, {"reader": false, "ar": [[3214.0, "بل إن العقل يفرض كمالَ البيان بأوضح عبارةٍ وأكمل إشارة؛"], [3222.0, "فإن الشريعة التي أوحاها الله إلى نبيه ﷺ هي النور والهدى،"], [3228.2, "أليس كذلك؟ وأعظمُ النور والهدى هو العقيدة،"], [3232.0, "فلا يمكن أن يكون النبي ﷺ قد بيّن أدنى النور وترك أعلى النور ملتبسًا غامضًا."], [3240.0, "ولأن النبي ﷺ نراه قد حرص الحرص الكامل على بيان آداب الخلاء،"], [3250.0, "وآداب الأكل، وآداب النوم أتمَّ البيان،"], [3252.9, "فلا يمكن أن يترك أمور الاعتقاد ـ التي فيها سير القلب إلى الله ـ بلا بيان."], [3259.0, "فإذا كانت الفروع قد بُيّنت أتمَّ البيان فكيف بالأصل الذي تُبنى عليه هذه الفروع؟"]], "tr": [[3214.0, "Hatta akıl da beyanın en açık ifade ve en mükemmel işaretle tam olmasını gerektirir."], [3222.0, "Çünkü Allah'ın Peygamberine ﷺ vahyettiği şeriat nur ve hidayettir, öyle değil mi?"], [3228.2, "Nurun ve hidayetin en büyüğü de akîdedir."], [3228.2, "Nebî ﷺ'in nurun en aşağısını açıklayıp en yücesini karışık ve kapalı bırakmış olması mümkün değildir."], [3232.0, "Ayrıca Nebî ﷺ'in tuvalet âdâbını, yemek âdâbını ve uyku âdâbını en mükemmel şekilde açıklamaya son derece özen gösterdiğini görüyoruz;"], [3250.0, "kalbin Allah'a yolculuğunun içinde bulunduğu itikad meselelerini açıklamadan bırakması mümkün değildir."], [3259.0, "Fer'ler en mükemmel şekilde açıklanmışsa, bu fer'lerin üzerine kurulduğu asıl nasıl (açıklanmamış olur)?"]]}, {"reader": false, "ar": [[3265.0, "فالذي يقول: إن من العقائد ما فيه إشكالٌ وفيه إلغازٌ وعدمُ فهم،"], [3271.0, "فإنما أُتي من قلة بحثه،"], [3273.7, "أو تلوّث عقله ببعض القواعد الفلسفية المنطقية الكلامية،"], [3278.0, "وإلا فالعقائد واضحة. والذي يقول بأن باب الصفات من أصعب الأبواب نقول:"], [3283.5, "كذبتَ، بل كلُّ العقيدة من أسهل الأبواب،"], [3287.0, "بل أنا أرى أن الأمور العقدية أسهلُ فهمًا من كثيرٍ من الأمور الفقهية."]], "tr": [[3265.0, "\"Akîdelerden bazılarında müşkil, bilmece ve anlaşılmazlık vardır\" diyen kişi, ancak araştırmasının azlığından ya da aklının bazı felsefî, mantıkî ve kelamî kaidelerle kirlenmesinden dolayı (bu hataya) düşmüştür;"], [3278.0, "yoksa akîdeler açıktır. \"Sıfatlar babı babların en zorlarındandır\" diyene de deriz ki:"], [3278.0, "Yalan söyledin. Bilakis akîdenin tamamı babların en kolaylarındandır."], [3287.0, "Hatta ben akîdevî meselelerin anlaşılmasının birçok fıkhî meseleden daha kolay olduğu görüşündeyim."]]}, {"reader": false, "ar": [[3292.0, "ولذلك لما سُئل سلمانُ رضي الله تعالى عنه ـ سأله اليهود سؤالَ مستحقِر ـ قال:"], [3300.5, "لقد علّمكم نبيكم ﷺ كلَّ شيءٍ حتى الخِراءة!"], [3306.0, "أي ما تفعل في الخلاء."], [3307.0, "قال: نعم، علّمنا كلَّ شيء:"], [3310.0, "«نهانا أن نستقبل القبلة بغائطٍ أو بول، أو أن نستنجي باليمين، أو أن نستنجي بأقلّ من ثلاثة أحجار، أو أن نستنجي برجيعٍ أو عظم» <span class=\"note\">(Müslim)<\/span>."]], "tr": [[3292.0, "Bu yüzden Selmân'a (r.a.) —Yahudiler ona küçümseyerek bir soru sordu— şöyle denildiğinde:"], [3292.0, "\"Peygamberiniz ﷺ size her şeyi, hatta tuvalet âdâbını bile öğretmiş!\" —yani tuvalette ne yapacağını— şöyle dedi:"], [3307.0, "\"Evet, bize her şeyi öğretti:"], [3310.0, "Büyük veya küçük abdest bozarken kıbleye yönelmemizi, sağ elle istincâ etmemizi, üç taştan az bir şeyle istincâ etmemizi ya da tezek veya kemikle istincâ etmemizi yasakladı.\" <span class=\"note\">(Müslim)<\/span>"]]}, {"reader": false, "ar": [[3319.0, "فالذي بيّن لهم آدابَ التعامل مع الخلاء،"], [3322.0, "أفيترك آدابَ التعامل مع الله عز وجل؟"], [3325.0, "هذا لا يمكن أبدًا."], [3329.0, "ولذلك يجب علينا أن نعتقد الاعتقادَ الجازم بأن النبي ﷺ قد بيّن لنا كلَّ مطلوبٍ في الشرع،"], [3338.0, "سواءٌ أكان من المسائل ـ الأمور العقدية العلمية،"], [3342.0, "أو من الأمور الفقهية الشرعية العملية ـ وليس شيءٌ يحتاج إلى زيادة بيان،"], [3350.0, "ولكن يبقى اجتهاد أهل العلم في النص."]], "tr": [[3319.0, "Onlara tuvaletle ilgili âdâbı açıklayan, Allah Teâlâ ile ilgili âdâbı (açıklamadan) bırakır mı?"], [3325.0, "Bu asla mümkün değildir. Bu yüzden şuna kesin olarak inanmamız gerekir:"], [3329.0, "Nebî ﷺ, ister ilmî-akîdevî meselelerden olsun ister amelî-şer'î fıkhî meselelerden, şeriatta istenen her şeyi bize açıklamıştır."], [3342.0, "Daha fazla açıklamaya muhtaç hiçbir şey yoktur;"], [3342.0, "fakat ilim ehlinin nas üzerindeki içtihadı (her zaman) kalır."]]}]}, {"ts": "55:54", "title": "18. Külliye: Şer'î delilin itibar etmediği her akîdevî taksim bâtıldır", "paras": [{"reader": false, "ar": [[3354.0, "ومن الكليات أيضًا: <b>كلُّ تقسيمٍ في أمرٍ عقديٍّ لا يشهد له دليلُ الشرع بالاعتبار فباطل.<\/b> السلام عليكم،"], [3375.0, "يا سلام عليكم أيها الطلاب."], [3378.0, "كلُّ تقسيمٍ في أمرٍ عقديٍّ لا يشهد له دليل الشرع بالاعتبار فهو باطل."], [3388.0, "كلُّ تقسيمٍ عقديٍّ لا يشهد له دليل الشرع بالاعتبار فهو باطل."]], "tr": [[3354.0, "Külliyelerden biri de şudur: <b>Şer'î delilin itibar ederek şahitlik etmediği, akîdevî bir meseledeki her taksim (bölümlendirme) bâtıldır.<\/b> Esselâmu aleyküm;"], [3378.0, "esselâmu aleyküm, ey talebeler. (Külliyeyi iki kez daha tekrar ediyor.)"]]}, {"reader": false, "ar": [[3393.0, "وذلك لأن المتقرّر في القواعد أن كلَّ تقسيمٍ يختلف به دليلُ الشرع <span class=\"q\">؟ 56:33<\/span> فهو توقيفيٌّ على النص."], [3402.0, "فلا حقَّ لك ـ أيها المسلم ـ أن تعمد إلى جزئيةٍ عقدية ثم تقول:"], [3406.9, "هذه الجزئية تنقسم إلى قسمين:"], [3409.0, "قسمٌ كذا وقسمٌ كذا،"], [3411.0, "وحكمُ هذا القسم كذا،"], [3413.0, "والثاني حكمه كذا. فكلُّ تقسيمٍ في أمرٍ عقديٍّ فإننا نطالبك فيه بالدليل الدالّ على صحة هذا التقسيم وعلى اعتباره شرعًا؛"], [3423.0, "فإن جئتنا بدليلٍ مقبولٍ فأهلًا وسهلًا بهذا التقسيم،"], [3427.0, "وإلا فلا أهلًا ولا سهلًا، وتقسيمُك مردودٌ عليك."]], "tr": [[3393.0, "Çünkü kaidelerde yerleşik olan şudur:"], [3393.0, "Şer'î delilin onunla farklılaştığı <span class=\"q\">؟<\/span> her taksim, nassa bağlıdır (tevkîfîdir)."], [3393.0, "Ey Müslüman, akîdeye dair bir cüz'î meseleye yönelip \"Bu mesele iki kısma ayrılır:"], [3402.0, "şöyle bir kısım ve şöyle bir kısım;"], [3406.9, "bu kısmın hükmü şudur, ikincisinin hükmü şudur\" demeye hakkın yoktur."], [3413.0, "Akîdevî bir meseledeki her taksimde senden, bu taksimin sıhhatine ve şer'an itibar edildiğine delâlet eden delili isteriz."], [3413.0, "Bize kabul edilebilir bir delil getirirsen bu taksime başüstüne;"], [3423.0, "yoksa ne başüstüne ne de hoş geldin; taksimin sana geri çevrilir."]]}, {"reader": false, "ar": [[3432.0, "وبناءً على ذلك نحن نردّ تقسيم البدعة إلى بدعةٍ حسنةٍ مقبولة،"], [3440.0, "وإلى بدعةٍ سيئةٍ مذمومة؛"], [3442.0, "فإن هذا التقسيم يخالف دليل الشرع،"], [3445.0, "ولا يشهد له دليل الشرع بالاعتبار أبدًا."], [3447.0, "فإن النبي ﷺ قال: «كلُّ بدعةٍ ضلالة» <span class=\"note\">(Müslim)<\/span>،"], [3457.0, "وقال ﷺ: «وكلُّ ضلالةٍ في النار»."], [3461.0, "والأدلة تدل على أن جميع محدثات الدين وبدعه ـ على أن كل البدع المنكرة والمحدثات المستهجنة القبيحة ـ كلها توصف بأنها ضلال."], [3475.0, "فجاء أناسٌ وقسّموا البدعة إلى خمسة أقسام،"], [3478.9, "وذلك تقسيمٌ في أمرٍ عقديٍّ لا يشهد له دليل الشرع بالاعتبار،"], [3483.0, "فهو مرفوضٌ لا نقبله."]], "tr": [[3432.0, "Buna binaen biz, bid'atın kabul edilen güzel bid'at ve kınanan kötü bid'at diye taksim edilmesini reddederiz."], [3440.0, "Çünkü bu taksim şer'î delile aykırıdır ve şer'î delil ona asla itibar ederek şahitlik etmez."], [3445.0, "Nebî ﷺ şöyle buyurmuştur: \"Her bid'at sapıklıktır.\" <span class=\"note\">(Müslim)<\/span> Yine ﷺ şöyle buyurmuştur:"], [3447.0, "\"Her sapıklık da ateştedir.\" Deliller, dinde sonradan çıkarılan şeylerin ve bid'atların tamamının —yani münker bid'atların ve çirkin, yadırganan muhdesâtın tamamının— sapıklık olarak nitelendiğini gösterir."], [3461.0, "Bazı insanlar gelip bid'atı beş kısma ayırdılar;"], [3475.0, "bu, şer'î delilin itibar ederek şahitlik etmediği, akîdevî bir meseledeki bir taksimdir;"], [3478.9, "dolayısıyla reddedilmiştir, onu kabul etmeyiz."]]}, {"reader": false, "ar": [[3487.0, "ونكمل بعد الصلاة إن شاء الله."], [3489.0, "والصلاة والسلام على رسول الله الأمين،"], [3492.0, "وعلى آله وأصحابه الطيبين الطاهرين،"], [3494.8, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [3497.0, "أما بعد: لا نزال في شرح كلية:"], [3499.5, "«كلُّ تقسيمٍ في أمرٍ عقديٍّ لم يشهد له دليل الشرع بالاعتبار فباطل»،"], [3505.0, "أليس كذلك؟ وفرّعنا عليها تقسيم البدعة إلى حسنةٍ وسيئة،"], [3511.0, "وهذا تقسيمٌ باطل، لأنه لم يشهد له دليل الشرع بالاعتبار،"], [3516.0, "وإنما أدلة الشرع تشهد بأن كلَّ محدثةٍ في الدين فإنها ردّ،"], [3522.0, "ومن عمل عملًا ليس عليه أمرُ النبي ﷺ فإنه ردّ."]], "tr": [[3487.0, "İnşallah namazdan sonra devam edeceğiz."], [3487.0, "(Aradan sonra:) Salât ve selâm Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [3494.8, "Bundan sonra: Hâlâ \"Şer'î delilin itibar ederek şahitlik etmediği, akîdevî bir meseledeki her taksim bâtıldır\" külliyesinin şerhindeyiz, öyle değil mi?"], [3505.0, "Ona, bid'atın güzel ve kötü diye taksimini bağladık."], [3505.0, "Bu bâtıl bir taksimdir, çünkü şer'î delil ona itibar ederek şahitlik etmemiştir."], [3511.0, "Bilakis şer'î deliller, dinde sonradan çıkarılan her şeyin reddolunduğuna ve Nebî ﷺ'in emrinin üzerinde olmadığı bir ameli işleyenin (amelinin) reddolunduğuna şahitlik eder."]]}, {"reader": false, "ar": [[3528.0, "ومن ذلك تقسيم الدين إلى أصولٍ وفروع ـ تقسيمُ أهل البدع ـ فيجعلون الأصولَ أي أمورَ الاعتقاد،"], [3547.0, "ويجعلون الفروعَ أي أمورَ الفقه."], [3553.0, "وهذا تقسيمٌ محدَثٌ لا يُعلم عن أحدٍ من أهل السنة والجماعة،"], [3558.0, "وإنّ أول من قسّم الدين إلى أصولٍ وفروعٍ بهذا الاعتبار إنما هم المعتزلة."], [3564.0, "وهذا التقسيم لم يشهد له دليل الشرع بالاعتبار،"], [3571.0, "فيكون تقسيمًا باطلًا، ولأنه يُبنى عليه فروعٌ باطلة،"], [3578.0, "كقولهم بأن الأصول لا يُقبل فيها إلا المتواترات،"], [3582.0, "وأما الآحاد فإننا لا نقبلها في مسائل العقائد."], [3587.0, "وهذا كلُّه كلامٌ باطل."]], "tr": [[3528.0, "Bunlardan biri de dinin usûl ve fürû diye taksim edilmesidir —bid'at ehlinin taksimi—:"], [3528.0, "Usûlü itikad meseleleri, fürûu da fıkıh meseleleri yaparlar."], [3547.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'ten hiç kimseden bilinmeyen, sonradan çıkarılmış bir taksimdir."], [3558.0, "Dini bu itibarla usûl ve fürû diye ilk taksim edenler Mu'tezile'dir."], [3558.0, "Bu taksime şer'î delil itibar ederek şahitlik etmemiştir;"], [3564.0, "dolayısıyla bâtıl bir taksimdir. Ayrıca onun üzerine bâtıl fer'ler bina edilir;"], [3571.0, "\"Usûlde ancak mütevâtir haberler kabul edilir;"], [3578.0, "âhâd haberleri ise akîde meselelerinde kabul etmeyiz\" demeleri gibi. Bunların hepsi bâtıl sözlerdir."]]}, {"reader": false, "ar": [[3589.0, "فإن قلت: ونحن قرأنا لبعض أهل العلم بأن الدين ينقسم إلى أصولٍ وفروع،"], [3598.0, "كابن تيمية وغيره؟ فأقول:"], [3600.0, "نعم، لكن لا يقصدون به هذا التقسيم البدعي المحدَث،"], [3604.0, "وإنما يقصدون بالأصول المسائلَ المجمعَ عليها،"], [3609.0, "بغضّ النظر عن بابها،"], [3610.1, "عقيدةً أو فقهًا؛ فكلُّ مسألةٍ أجمع العلماء عليها فهي من مسائل الأصول،"], [3616.0, "وكلُّ مسألةٍ مختلَفٍ فيها ـ عقيدةً كانت أو شريعة ـ فإنها من مسائل الفروع."], [3623.0, "وهذا تقسيمٌ يخالف تقسيم أهل البدع،"], [3627.0, "فلا بدّ من التنبيه على ذلك."]], "tr": [[3589.0, "\"Biz bazı ilim ehlinin, İbn Teymiyye ve başkaları gibi, dinin usûl ve fürû diye ayrıldığını söylediğini okuduk\" dersen, derim ki:"], [3600.0, "Evet; fakat onlar bununla bu sonradan çıkarılmış bid'at taksimini kastetmezler."], [3604.0, "Usûl ile, babı akîde ya da fıkıh olsun, üzerinde icma edilen meseleleri kastederler."], [3610.1, "Âlimlerin üzerinde icma ettiği her mesele usûl meselelerindendir;"], [3616.0, "akîde ya da şeriat olsun, hakkında ihtilaf edilen her mesele de fürû meselelerindendir."], [3623.0, "Bu, bid'at ehlinin taksimine aykırı bir taksimdir; buna dikkat çekmek gerekir."]]}]}, {"ts": "1:00:32", "title": "18. Külliye (devam): Ehl-i Sünnet'i üçe ayırmak; tevhidin üç kısmı", "paras": [{"reader": false, "ar": [[3632.0, "ومن هذا التقسيم الباطل تقسيمُ أهل السنة إلى ثلاثة أقسام:"], [3639.0, "إلى أشعريةٍ وماتريديةٍ وحنابلة،"], [3643.0, "كما تسمعونه في وسائل الإعلام كثيرًا في هذا الزمان من بعض من يُنسب إلى العلم."], [3651.0, "وهذا تقسيمٌ باطل؛ فأهل السنة هم أهل الحق،"], [3656.0, "والحقُّ لا يتعدّد في مسائل العقائد،"], [3659.0, "والتعدّديةُ العقدية غير مقبولةٍ عندنا."], [3662.0, "فإمّا أن يكونوا هم على الحق ونحن على الباطل،"], [3666.0, "وإمّا أن نكون نحن على الحق وهم على الباطل."], [3670.0, "وأمّا أن تجمع بين المذهبين المتناقضين في أصولهما ونتائج نظرهما،"], [3677.0, "فإن ذلك من الجمع بين المتناقضين والمختلفين،"], [3682.0, "والشريعة لا تجمع بين مختلفين."]], "tr": [[3632.0, "Bu bâtıl taksimlerden biri de, bu zamanda ilme nispet edilen bazı kimselerden medyada sıkça işittiğiniz gibi, Ehl-i Sünnet'in üç kısma —Eş'arîler, Mâtürîdîler ve Hanbelîler— ayrılmasıdır."], [3643.0, "Bu bâtıl bir taksimdir. Ehl-i Sünnet hak ehlidir;"], [3651.0, "hak ise akîde meselelerinde birden fazla olmaz;"], [3656.0, "akîdevî çoğulculuk bizce kabul edilemez."], [3659.0, "Ya onlar hak üzeredir, biz bâtıl üzereyiz;"], [3662.0, "ya da biz hak üzereyiz, onlar bâtıl üzeredir."], [3666.0, "Usûlleri ve nazarlarının sonuçları bakımından birbiriyle çelişen iki mezhebi bir araya getirmeye gelince, bu, çelişen ve ayrışan iki şeyi birleştirmektir;"], [3677.0, "şeriat ise ayrışan iki şeyi bir araya getirmez."]]}, {"reader": false, "ar": [[3686.0, "كما قال الله عز وجل:"], [3688.0, "<span class=\"ayah\">﴿أَمْ حَسِبَ الَّذِينَ اجْتَرَحُوا السَّيِّئَاتِ أَن نَّجْعَلَهُمْ كَالَّذِينَ آمَنُوا وَعَمِلُوا الصَّالِحَاتِ سَوَاءً مَّحْيَاهُمْ وَمَمَاتُهُمْ﴾<\/span> <span class=\"ref\">[الجاثية: ٢١]<\/span>،"], [3696.0, "وقال الله عز وجل:"], [3698.3, "<span class=\"ayah\">﴿أَفَنَجْعَلُ الْمُسْلِمِينَ كَالْمُجْرِمِينَ﴾<\/span> <span class=\"ref\">[القلم: ٣٥]<\/span>. لا يمكن أن يكون أهل السنة يُصَفّون مَصافَّ أهل البدع في منزلةٍ واحدة."], [3706.0, "فتقسيم أهل السنة إلى ثلاث طوائف ـ إلى أشعريةٍ وماتريديةٍ وحنابلة ـ هذا تقسيمٌ باطل،"], [3712.5, "لأنه تقسيمٌ في أمرٍ عقدي،"], [3715.0, "والأمور العقدية لا تقبل التعدّدية."]], "tr": [[3686.0, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [3688.0, "<span class=\"ayah\">﴿Yoksa kötülükleri işleyenler, kendilerini iman edip salih amel işleyenler gibi kılacağımızı, hayatlarının ve ölümlerinin bir olacağını mı sandılar?﴾<\/span> [Câsiye 21]."], [3688.0, "Allah Teâlâ şöyle de buyurmuştur:"], [3696.0, "<span class=\"ayah\">﴿Müslümanları suçlular gibi mi tutacağız?﴾<\/span> [Kalem 35]."], [3698.3, "Ehl-i Sünnet'in bid'at ehliyle aynı safa, aynı mertebeye konması mümkün değildir."], [3698.3, "Ehl-i Sünnet'in üç taifeye —Eş'arîler, Mâtürîdîler ve Hanbelîler— ayrılması bâtıl bir taksimdir;"], [3706.0, "çünkü akîdevî bir meselede yapılan bir taksimdir ve akîdevî meseleler çoğulculuğu kabul etmez."]]}, {"reader": false, "ar": [[3718.0, "بل الحق أن أهل السنة طائفةٌ واحدةٌ لا تتعدّد،"], [3722.0, "وهم أهل السنة والجماعة،"], [3724.5, "أتباع السلف الصالح، والطائفة المنصورة،"], [3727.7, "والفرقة الناجية، وأهل الحديث والأثر."], [3731.0, "فهذه التقسيمات نحن لا نقبلها أبدًا."], [3736.0, "وهكذا دواليك في تقسيماتٍ عند أهل البدع في كثيرٍ من الأبواب العقدية."], [3744.0, "فقبل أن تقبل ـ أيها السني ـ أيَّ تقسيمٍ من التقسيمات لا بدّ أن تنظر إلى دليله وبرهانه:"], [3752.0, "هل شهد له دليل الشرع بالاعتبار أو لم يشهد؟"], [3755.0, "فإن شهد له دليل الشرع بالاعتبار فأهلًا وسهلًا،"], [3758.0, "وإن لم يشهد له دليل الشرع بالاعتبار فلا حقَّ لك أن تقبله."]], "tr": [[3718.0, "Bilakis hak olan şudur: Ehl-i Sünnet çoğalmayan tek bir taifedir."], [3722.0, "Onlar Ehl-i Sünnet ve'l-Cemaat'tir; selef-i sâlihînin tâbileri, (Allah'ın) yardım ettiği taife (et-Tâifetü'l-Mansûra), kurtuluşa eren fırka (el-Fırkatü'n-Nâciye), hadis ve eser ehlidir."], [3736.0, "Bu taksimleri biz asla kabul etmeyiz."], [3736.0, "Bid'at ehlinin birçok akîde babındaki taksimlerinde de durum böyledir."], [3744.0, "Ey Sünnî, taksimlerden herhangi birini kabul etmeden önce onun deliline ve burhanına bakman gerekir:"], [3752.0, "Şer'î delil ona itibar ederek şahitlik etmiş mi, etmemiş mi?"], [3755.0, "Şer'î delil ona itibar ederek şahitlik etmişse başüstüne;"], [3755.0, "şer'î delil ona itibar ederek şahitlik etmemişse onu kabul etmeye hakkın yoktur."]]}, {"reader": false, "ar": [[3764.0, "فإن قلت: وأين الدليل على تقسيم التوحيد إلى توحيد ربوبية،"], [3769.7, "وتوحيد ألوهية، وأسماء وصفات؟"], [3772.0, "فإن هذا تقسيمٌ في أمرٍ عقدي."], [3775.0, "فنقول: هذا التقسيم قد وقع عليه الاستقراء التام،"], [3781.0, "والاستقراء دليلٌ يستدل به الشرع أحيانًا؛"], [3785.0, "فإننا رأينا إلى أدلة التوحيد فوجدناها تنقسم إلى ثلاثة أقسام:"], [3791.0, "وجدنا أن منها قسمًا يتكلم الله فيه عن أفعاله،"], [3795.0, "وقسمًا يتكلم فيه عن أسمائه وصفاته،"], [3799.0, "وقسمًا يتكلم فيه عن واجب ألوهيته على عباده."], [3804.0, "وهذا دليلٌ استقرائيٌّ قد دلّ عليه دليل الشرع بالاعتبار،"], [3812.0, "فلا حقَّ لأحدٍ أن ينكر هذا التقسيم."]], "tr": [[3764.0, "\"Tevhidin rubûbiyyet tevhidi, ulûhiyyet tevhidi ve isim ve sıfatlar (tevhidi) diye taksim edilmesinin delili nerede?"], [3769.7, "Çünkü bu da akîdevî bir meseledeki bir taksimdir\" dersen, deriz ki:"], [3775.0, "Bu taksim üzerinde tam bir tümevarım (istikrâ-i tâm) gerçekleşmiştir;"], [3781.0, "tümevarım da şeriatın zaman zaman delil olarak kullandığı bir delildir."], [3785.0, "Tevhid delillerine baktık ve onların üç kısma ayrıldığını gördük:"], [3791.0, "Bir kısmında Allah'ın fiillerinden bahsettiğini, bir kısmında isimlerinden ve sıfatlarından bahsettiğini, bir kısmında da kulları üzerindeki ulûhiyyetinin gereğinden bahsettiğini gördük."], [3804.0, "Bu, şer'î delilin itibar ettiği tümevarıma dayalı bir delildir;"], [3804.0, "dolayısıyla hiç kimsenin bu taksimi inkâr etmeye hakkı yoktur."]]}, {"reader": false, "ar": [[3815.0, "ثم سلّمنا جدلًا أنه غير مقبول،"], [3819.0, "فهل تقبلون مضمونه؟ فإننا وإن اتفقنا معكم أنه تقسيمٌ لا دليل عليه ـ وهذا من باب التسليم الفرضي الجدلي ـ فإننا ننسف هذه الأقسام الثلاثة،"], [3835.0, "لكن هل ننسف مضمونها أيضًا؟"], [3837.0, "فإذا كنتم تتفقون معنا على مضامينها فدعوا الأسماء والتقسيمات تذهب جانبًا."], [3843.0, "فإذا كان الخلاف بيننا وبينكم في مجرد أسماءٍ وتقسيمات فنحن نتنازل عنها،"], [3849.9, "لكن لا نتنازل عن وجوب إفراد الله بالعبادة،"], [3855.0, "ولا نتنازل عن إثبات الأسماء والصفات لله عز وجل وإن لم نسمّه توحيدَ أسماءٍ وصفات،"], [3861.0, "ولا نتنازل عن إفراد الله بأفعاله وإن لم نسمّه توحيد ربوبية."]], "tr": [[3815.0, "Sonra, tartışma icabı onun kabul edilmediğini varsaysak bile, onun içeriğini kabul ediyor musunuz?"], [3819.0, "Onun delili olmayan bir taksim olduğu konusunda sizinle anlaşsak bile —bu, farazî ve cedelî bir kabul kabilindendir— bu üç kısmı ortadan kaldırırız;"], [3835.0, "fakat içeriğini de ortadan kaldırır mıyız?"], [3837.0, "Eğer içerikleri konusunda bizimle anlaşıyorsanız, isimleri ve taksimleri bir kenara bırakın."], [3843.0, "Aramızdaki ihtilaf sadece isimler ve taksimlerdeyse biz onlardan vazgeçeriz."], [3843.0, "Fakat Allah'ı ibadette tekleştirmenin vücubundan vazgeçmeyiz;"], [3849.9, "isim ve sıfat tevhidi diye adlandırmasak da Allah Teâlâ'ya isim ve sıfatları isbat etmekten vazgeçmeyiz;"], [3855.0, "rubûbiyyet tevhidi diye adlandırmasak da Allah'ı fiillerinde tekleştirmekten vazgeçmeyiz."]]}, {"reader": false, "ar": [[3868.0, "لكنهم يريدون بنسف تقسيم التوحيد إلى ثلاثة أقسام نسفَ مضمون التوحيد أصلًا؛"], [3875.0, "فهم لا يريدون توحيدًا،"], [3877.0, "فجعلوا طريقَ نسف المضمون نسفَ الأسماء والتقسيم."], [3884.0, "وإلا فلا دخلَ لمضامين هذه الأنواع التوحيدية الثلاث في أسمائها."], [3893.0, "فإن كنتم تقبلون مضامينها فإننا وإياكم سننسف مجرد الأسماء."]], "tr": [[3868.0, "Fakat onlar tevhidin üç kısma ayrılmasını ortadan kaldırmakla, tevhidin içeriğini tamamen ortadan kaldırmayı istiyorlar."], [3875.0, "Onlar tevhid istemiyorlar; isimleri ve taksimi ortadan kaldırmayı, içeriği ortadan kaldırmanın yolu yaptılar."], [3884.0, "Yoksa bu üç tevhid türünün içeriklerinin isimleriyle bir ilgisi yoktur."], [3884.0, "Eğer içeriklerini kabul ediyorsanız, siz ve biz birlikte sadece isimleri ortadan kaldırırız."]]}, {"reader": false, "ar": [[3899.0, "فتوحيدُ الله بأفعال العباد إذا كان محقَّقًا ـ تؤمنون؟"], [3906.0, "ـ إذا كنتم تحقّقونه وتؤمنون به فلا تسمّوه بتوحيد الألوهية،"], [3911.0, "لا يهمّ هذا الاسم."], [3913.0, "وأسماءُ الله وصفاته إذا كنتم تُثبتونها على الوجه اللائق بالله فلا تسمّوه توحيدَ الأسماء والصفات،"], [3920.0, "ليس بلازم. وإذا كنتم تؤمنون وتوحّدون الله بأفعاله فلا تسمّوه توحيد الربوبية."], [3928.0, "فالأسماء لا تضرّ، المهمّ المضمونُ والحقيقة."]], "tr": [[3899.0, "Allah'ı kulların fiilleriyle tekleştirmek gerçekleşiyorsa —iman ediyor musunuz?— onu gerçekleştiriyor ve ona iman ediyorsanız, ona ulûhiyyet tevhidi demeyin;"], [3911.0, "bu ismin önemi yok. Allah'ın isim ve sıfatlarını Allah'a layık olan şekilde isbat ediyorsanız, ona isim ve sıfatlar tevhidi demeyin;"], [3913.0, "(bu isim) şart değildir. Allah'a iman ediyor ve O'nu fiillerinde tekleştiriyorsanız, ona rubûbiyyet tevhidi demeyin."], [3928.0, "İsimler zarar vermez; önemli olan içerik ve hakikattir."]]}, {"reader": false, "ar": [[3931.0, "ولكنّ القوم أرادوا بنسف الأسماء نسفَ الحقيقة؛"], [3937.0, "فهم لا يريدون إفرادَ الله بالعبادة،"], [3940.0, "ولا يريدون وصفَ الله بالصفات،"], [3944.0, "ولا تسميتَه بأسمائه، ولا يريدون توحيده بأفعال ربوبيته…"]], "tr": [[3931.0, "Fakat bu kimseler isimleri ortadan kaldırmakla hakikati ortadan kaldırmak istediler."], [3937.0, "Onlar Allah'ı ibadette tekleştirmek istemiyorlar;"], [3937.0, "Allah'ı sıfatlarla nitelemek, O'nu isimleriyle adlandırmak istemiyorlar;"], [3944.0, "O'nu rubûbiyyet fiillerinde tekleştirmek de istemiyorlar… <span class=\"note\">(Video burada kesiliyor.)<\/span>"]]}]}]};

const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
