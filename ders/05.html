<script>
const D={"no": 5, "vid": "2y87WoFcxVM", "title_ar": "الدرس (٥) من شرح كليات العقيدة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 5. Ders: Aklın Yeri, Kelâm İlmi, Hüccetin İkamesi ve Akîdede Taksimler", "sections": [{"ts": "00:00", "title": "9. Külliye: Akıl idrak eder, teşri etmez", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.7, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.4, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [9.0, "الكلّيّة التاسعة: كلُّ العقول مفطورةٌ على إدراك حُسن الأمور وقُبحها،"], [14.3, "ولا حقَّ لها في تشريعها."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [0.0, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [6.4, "9. külliye: Bütün akıllar, işlerin güzelliğini ve çirkinliğini idrak etmeye yatkın yaratılmıştır;"], [9.0, "fakat onları teşri etmeye (şer'î hüküm koymaya) hakları yoktur."]]}, {"reader": false, "ar": [[17.0, "أقول وبالله التوفيق: اعلم أن أهل القبلة انقسموا في مسألة عمل العقل إلى ثلاثة أقسام."], [24.0, "الأول: قومٌ عبدوا العقل وجعلوه إلهًا،"], [33.0, "وهم المعتزلة ومن وافقهم على قولهم هذا،"], [38.0, "بأنّ العقل مدرِكٌ ومنشئٌ للحكم،"], [45.0, "فجعلوا له الميزتين. فالعقل عندهم يدرك الحسن ويشرّعه،"], [53.0, "ويدرك القبح ويمنعه. وهؤلاء قد رفعوا العقل عن وظيفته التي خُلق لها،"], [67.0, "وغلَوا فيه الغلوَّ المطلق."]], "tr": [[17.0, "Tevfik Allah'tandır, derim ki: Bil ki kıble ehli, aklın işlevi meselesinde üç kısma ayrılmıştır."], [17.0, "Birincisi: Aklı putlaştırıp ilah edinen bir topluluk;"], [24.0, "bunlar Mu'tezile ve bu sözlerinde onlara uyanlardır."], [33.0, "Onlara göre akıl hem idrak edici hem de hükmü inşa edicidir (koyucudur);"], [38.0, "böylece ona iki özelliği birden verdiler."], [45.0, "Onlara göre akıl güzeli idrak eder ve onu meşru kılar, çirkini idrak eder ve onu yasaklar."], [53.0, "Bunlar aklı yaratıldığı görevin üstüne çıkardılar ve onda mutlak bir aşırılığa gittiler."]]}, {"reader": false, "ar": [[70.0, "بينما قابلهم طائفةٌ أخرى قالوا:"], [75.6, "إن العقل ليس بمدرِكٍ ولا بمنشئ،"], [79.0, "فنفَوا عنه الصفتين جميعًا."], [84.0, "فلو لم ترد الأدلة بحُسن الشيء لما استطاع العقل أن يدرك حُسنها،"], [92.0, "ولو لم يرد الشرع بقبح هذا الشيء لما استطاع العقل بمجرّده أن يدرك قبحها."], [101.0, "وهؤلاء فرّطوا في جانب العقل وأنزلوه عن منزلته."], [107.0, "فلا الأوّلون أصابوا، ولا الآخرون أصابوا."]], "tr": [[70.0, "Buna karşılık başka bir grup da şöyle dedi:"], [70.0, "Akıl ne idrak edicidir ne de inşa edici;"], [75.6, "böylece ondan iki sıfatı birden nefyettiler."], [79.0, "(Onlara göre) deliller bir şeyin güzel olduğunu bildirmeseydi akıl onun güzelliğini idrak edemezdi;"], [92.0, "şeriat bu şeyin çirkinliğini bildirmeseydi akıl tek başına onun çirkinliğini idrak edemezdi."], [92.0, "Bunlar da akıl konusunda ihmalkâr davrandılar ve onu mertebesinden aşağı indirdiler."], [107.0, "Ne birinciler isabet etti ne de ikinciler."]]}, {"reader": false, "ar": [[114.0, "وإنما الحقُّ هو الوسط،"], [116.0, "وخيرُ الأمور أوساطها، وهو ما تقتضيه هذه الكلية،"], [120.0, "وهو مذهب أهل السنة والجماعة:"], [123.0, "من أن العقل مدرِكٌ لا منشئ،"], [128.0, "من أن العقل مدرِكٌ لا منشئ."], [133.0, "فهو يدرك حُسن الأشياء وإن لم يرد بحسنها دليلُ الشرع،"], [138.0, "ولكن لا حقَّ له في تشريع الشيء الذي يراه حسنًا ما لم يرد دليلُ الشرع بتشريعه."], [145.0, "فليس كلُّ شيءٍ رآه العقل حسنًا يكون مشروعًا،"], [152.0, "حتى يرد بتشريعه برهانُ الشرع."]], "tr": [[114.0, "Hak olan ise ortadır; işlerin en hayırlısı ortalarıdır."], [116.0, "Bu külliyenin gerektirdiği de budur ve Ehl-i Sünnet ve'l-Cemaat'in mezhebi budur:"], [120.0, "Akıl idrak edicidir, inşa edici (hüküm koyucu) değildir."], [128.0, "(Bunu iki kez tekrar ediyor.) Akıl, şer'î delil bir şeyin güzelliğini bildirmemiş olsa bile onun güzelliğini idrak eder;"], [138.0, "fakat şer'î delil onun meşruiyetini bildirmedikçe, güzel gördüğü şeyi teşri etmeye hakkı yoktur."], [145.0, "Aklın güzel gördüğü her şey, şeriatın burhanı onun meşruiyetini bildirmedikçe meşru olmaz."]]}, {"reader": false, "ar": [[155.0, "والعقل يدرك قُبح بعض الأشياء وإن لم يرد ببيان قبحها دليلُ الشرع،"], [164.0, "إلا أنه لا حقَّ له أن يمنعها أو يحرّمها شرعًا ما لم يرد دليلُ الشرع بتحريمها تعيينًا."], [173.0, "فمن جعله مشرِّعًا فقد رفعه عن منزلته رفعًا مرفوضًا مذمومًا،"], [183.0, "ومن سلب منه خاصيةَ الإدراك فقد أنزله عن منزلته إنزالًا مذمومًا مرفوضًا."], [192.0, "ولكن منزلته في الشرع أن الله خلقه مدرِكًا،"], [197.0, "وطريقًا للفهم، وطريقًا للمعرفة،"], [200.0, "ولكن ليس بمنشئٍ للأحكام الشرعية."], [204.0, "وهي مسألة التحسين والتقبيح العقليَّين التي طال جدالُ أهل القبلة حولها، وهذه خلاصتها."]], "tr": [[155.0, "Akıl, şer'î delil bazı şeylerin çirkinliğini açıklamamış olsa bile onların çirkinliğini idrak eder;"], [164.0, "ancak şer'î delil onların haramlığını açıkça belirtmedikçe onları şer'an yasaklamaya veya haram kılmaya hakkı yoktur."], [164.0, "Onu teşri edici kılan, onu mertebesinin üstüne, reddedilmiş ve kınanmış bir şekilde yükseltmiştir."], [183.0, "Ondan idrak özelliğini alan ise onu mertebesinin altına, kınanmış ve reddedilmiş bir şekilde indirmiştir."], [183.0, "Şeriattaki mertebesi ise şudur: Allah onu idrak edici, anlamanın ve bilmenin bir yolu olarak yaratmıştır;"], [197.0, "fakat şer'î hükümleri inşa edici değildir."], [200.0, "Bu, kıble ehlinin etrafında uzun uzun tartıştığı aklî tahsîn ve takbîh (güzel ve çirkini akılla belirleme) meselesidir; bu da onun özetidir."]]}]}, {"ts": "03:35", "title": "10. Külliye: Akîdeyi kelamcıların yoluyla arayan zındıklaşır ve sapar", "paras": [{"reader": false, "ar": [[215.0, "ومن الكليات أيضًا: <b>كلُّ من طلب العقائدَ على طريقة المتكلّمين تزندق وضلّ.<\/b> كلُّ من طلب العقائد على طريقة المتكلمين تزندق وضلّ. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[215.0, "Külliyelerden biri de şudur: <b>Akîdeleri kelamcıların (mütekellimîn) yoluyla arayan herkes zındıklaşır ve sapar.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[243.0, "فإن قلت: وما علمُ الكلام؟"], [246.4, "فأقول: هو ما أحدثه المتكلّمون في أصول الدين وعقائده،"], [271.0, "مما ابتدعوه وأعرضوا به عن علوم الكتاب والسنة."], [280.0, "فتجد أن أهل السنة والجماعة لهم طريقةٌ في إثبات العقائد،"], [287.0, "وهي الاستدلال عليها بالقرآن والسنة وعلى فهم السلف الصالح فقط،"], [291.0, "ونحن لا نتجاوز في فهم العقائد هذه الأصول الثلاثة."], [296.0, "وأما طريقة المتكلّمين من الفلاسفة ومن نحا منحاهم وتربّى على موائدهم،"]], "tr": [[243.0, "\"Kelam ilmi nedir?\" dersen, derim ki:"], [246.4, "Kelamcıların dinin usûlünde ve akîdelerinde sonradan ortaya çıkardıkları, bid'at olarak uydurdukları ve onunla Kitap ve Sünnet ilimlerinden yüz çevirdikleri şeydir."], [280.0, "Görürsün ki Ehl-i Sünnet ve'l-Cemaat'in akîdeleri isbat etmede bir yolu vardır:"], [287.0, "O da onlara sadece Kur'an ve Sünnet ile ve selef-i sâlihînin anlayışına göre delil getirmektir."], [291.0, "Biz akîdeleri anlamada bu üç aslı aşmayız."], [291.0, "Filozoflardan olan, onların yolunu tutan ve onların sofralarında yetişen kelamcıların yoluna gelince —"]]}]}, {"ts": "05:03", "title": "10. Külliye (devam): Kelam yolunun sonuçları ve imamların hükmü", "paras": [{"reader": false, "ar": [[303.0, "فإن لهم طرائقَ كثيرةً متعددةً يستنبطون منها النتائج العقدية،"], [308.0, "هي في ذاتها ضلال،"], [310.0, "ونتائجها أضلُّ من الضلال."], [312.0, "فما ضلّ الجهميةُ إلا لأنهم أخذوا عقائدهم على طريقة المتكلمين:"], [319.0, "من قضية حدوث العالم،"], [321.8, "والجوهر والعَرَض، والمقدمات المنطقية الفلسفية،"], [329.0, "والقواعد التي تناقض المعقول وتصادم المنقول،"], [333.0, "وتخالف طريقة السلف الصالح وما أجمعوا عليه."], [337.0, "فعسّروا إثبات العقائد تعسيرًا لا يفهمه العوام،"], [342.0, "والدين مبنيٌّ على التخفيف والتيسير،"], [346.0, "وعلى الحنيفية السمحة، ورفع الآصار والأغلال."], [349.0, "والله عز وجل وصف كتابه بقوله:"], [353.0, "<span class=\"ayah\">﴿وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ فَهَلْ مِن مُّدَّكِرٍ﴾<\/span> <span class=\"ref\">[القمر: ١٧]<\/span>."]], "tr": [[303.0, "— onların akîdevî sonuçları çıkardıkları pek çok ve çeşitli yolları vardır ki bunlar bizzat sapıklıktır, sonuçları ise sapıklıktan da sapıktır."], [312.0, "Cehmiyye ancak akîdelerini kelamcıların yoluyla aldıkları için saptı:"], [319.0, "âlemin hudûsü meselesi, cevher ve araz, mantıkî-felsefî öncüller, aklî olana aykırı ve nakle çarpan, selef-i sâlihînin yoluna ve onların icma ettiği şeye muhalif kaideler."], [333.0, "Böylece akîdeleri isbat etmeyi avamın anlayamayacağı şekilde zorlaştırdılar."], [337.0, "Oysa din hafifletme ve kolaylaştırma, hoşgörülü hanîflik ve ağır yüklerle zincirlerin kaldırılması üzerine kuruludur."], [349.0, "Allah Teâlâ Kitabını şu sözüyle nitelemiştir:"], [353.0, "<span class=\"ayah\">﴿Andolsun biz Kur'an'ı öğüt almak için kolaylaştırdık; öğüt alan yok mu?﴾<\/span> [Kamer 17]."]]}, {"reader": false, "ar": [[357.0, "فلو أردتَ أن تفهم العقائد ـ أيًّا كان بابها ـ على طريقة المتكلمين،"], [363.0, "فإنه يلزم عليك أولًا أن تتعلم القواعد المنطقية وعلمَ الكلام والفلسفة،"], [369.0, "حتى تُخرِّج آيات القرآن والسنة عليها؛"], [374.0, "فما اتفق معها قبلتَه،"], [376.0, "وما تعارض معها رفضتَه."], [378.0, "فكلُّ من طلب العقيدة على هذه الطريقة الفلسفية الكلامية فإن نتائج طلبه ستكون ضلالًا مبينًا."], [387.0, "فما حُرّفت صفاتُ الله،"], [389.0, "ولا عُطّلت أسماؤه، ولا أُنكر قضاؤه وقدره،"], [396.0, "إلا بسبب طلب العقيدة على طريقة المتكلمين."]], "tr": [[357.0, "Akîdeleri —babı ne olursa olsun— kelamcıların yoluyla anlamak istersen, önce mantık kaidelerini, kelam ilmini ve felsefeyi öğrenmen gerekir ki Kur'an ve Sünnet'in ayetlerini onlara göre yorumlayasın;"], [369.0, "onlarla uyuşanı kabul eder, onlarla çatışanı reddedersin."], [376.0, "Akîdeyi bu felsefî-kelamî yolla arayan herkesin aramasının sonucu apaçık bir sapıklık olacaktır."], [378.0, "Allah'ın sıfatları ancak akîdenin kelamcıların yoluyla aranması sebebiyle tahrif edildi, isimleri ta'til edildi, kazası ve kaderi inkâr edildi."]]}, {"reader": false, "ar": [[402.0, "ولذلك اشتدّ نكيرُ أهل السنة والجماعة على علماء الكلام،"], [408.0, "وبيّنوا نهايته. فهذا الإمام أحمد رحمه الله يقول:"], [412.0, "«لا يُفلح صاحبُ كلامٍ أبدًا»،"], [415.0, "أي من طلب العقيدة على طريقة الفلاسفة فإنه لا يفلح أبدًا،"], [420.0, "ولن تكون عقيدته على مراد الله وما يرضيه."], [423.0, "وهذا الإمام الشافعي رحمه الله يقول:"], [426.3, "«حكمي في أهل الكلام» ـ أي من يطلب العقيدة على طريقة المتكلمين ـ «أن يُضرَبوا بالجريد والنعال، وأن يُطاف بهم في العشائر والقبائل، ويقال: هذا جزاءُ من ترك الكتاب والسنة وأقبل على علم الكلام»."]], "tr": [[402.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat'in kelam âlimlerine tepkisi şiddetli oldu ve onun (kelamın) varacağı sonu açıkladılar."], [408.0, "İşte İmam Ahmed (rahimehullah) şöyle der:"], [412.0, "\"Kelam sahibi asla felah bulmaz.\" Yani akîdeyi filozofların yoluyla arayan asla felah bulmaz ve akîdesi Allah'ın murad ettiği ve razı olduğu şekilde olmaz."], [423.0, "İşte İmam Şâfiî (rahimehullah) de şöyle der:"], [423.0, "\"Kelam ehli hakkındaki hükmüm\" —yani akîdeyi kelamcıların yoluyla arayanlar hakkında— \"hurma dallarıyla ve ayakkabılarla dövülmeleri, aşiretler ve kabileler arasında dolaştırılmaları ve 'Bu, Kitap ve Sünnet'i bırakıp kelam ilmine yönelenin cezasıdır' denmesidir.\""]]}, {"reader": false, "ar": [[444.0, "وإنّ من أعظم من اهتمّ بعلم الكلام جلبًا لكتبه المأمونُ في أواخر المئة الأولى،"], [456.7, "فإنه استجلب كتبَ الفلاسفة المشّائين،"], [460.0, "كأرسطو وأفلاطون وغيرهما من الفلاسفة المشّائين،"], [464.0, "ممن يتكلمون في الإلهيات والربوبيات على طريقة الفلاسفة،"], [470.0, "وعرّبها ونثرها على المسلمين."], [476.0, "وصار كثيرٌ من الناس ينتهجون منهج الفلاسفة في فهم العقائد،"], [481.1, "فجاؤوا لنا بخليطٍ كفريٍّ،"], [483.7, "وزندقةٍ عظيمة، ونفاقٍ وشرٍّ مستطير،"], [487.0, "لا نزال نعايش آثاره إلى هذا اليوم."]], "tr": [[444.0, "Kelam ilmine, kitaplarını getirterek en çok önem verenlerden biri, birinci asrın sonlarında Me'mûn'dur."], [456.7, "O, Aristo, Eflâtun ve diğerleri gibi, ilâhiyyât ve rubûbiyyât konularında filozofların yoluyla konuşan Meşşâî filozofların kitaplarını getirtti, onları Arapçaya çevirtti ve Müslümanlar arasına saçtı."], [470.0, "İnsanların birçoğu akîdeleri anlamada filozofların metodunu izlemeye başladı;"], [476.0, "bize küfür karışımı bir şey, büyük bir zındıklık, nifak ve her yana yayılan bir şer getirdiler ki bugün hâlâ onun etkilerini yaşıyoruz."]]}, {"reader": false, "ar": [[490.0, "فلا يزال أهل الكلام في ضلالٍ وعَماية إلى أن تقوم الساعة،"], [495.0, "بسبب أن أصولهم في فهم العقائد باطلة؛"], [499.0, "فما أخذوها على طريقة الأنبياء والرسل والسلف الصالح،"], [504.0, "وإنما أخذوها على طريقة أفلاطون وأرسطو وأرسطاطاليس وغيرهم من هؤلاء الحُثالة البشرية،"], [514.0, "الذين لم يصلوا لا إلى يقينٍ ولا إلى حقيقة."]], "tr": [[490.0, "Kelam ehli, akîdeleri anlamadaki usûlleri bâtıl olduğu için kıyamet kopuncaya kadar sapıklık ve körlük içinde kalmaya devam edecektir."], [499.0, "Çünkü onları peygamberlerin, resullerin ve selef-i sâlihînin yoluyla almadılar;"], [504.0, "ancak Eflâtun'un, Aristo'nun, Aristotalis'in ve ne yakîne ne de hakikate ulaşabilmiş diğer insanlık döküntülerinin yoluyla aldılar."]]}, {"reader": false, "ar": [[518.0, "حتى اعترف كبراءُ علماء الكلام عند موتهم بالندم العظيم على استفراغ أوقاتهم في علم الكلام،"], [524.0, "كما يُنقل ذلك عن الغزالي،"], [526.7, "وعن الرازي، وعن الشهرستاني،"], [528.9, "وعن الجويني، وهم أقطابُ وأفلاكُ علم الكلام والفلسفة."], [534.0, "ومع ذلك نهاياتُهم يتمنّون أن يموتوا على عقائد عجائز نيسابور."], [539.0, "كما قال الرازي: «نهايةُ إقدامِ العقولِ عِقالُ، وغايةُ سعيِ العالمين ضلالُ، وما استفدنا من بحثنا طولَ عمرنا إلا أن جمعنا فيه قيل وقال»."]], "tr": [[518.0, "Hatta kelam âlimlerinin büyükleri, ölümleri sırasında vakitlerini kelam ilmine harcadıkları için büyük bir pişmanlık itiraf ettiler."], [524.0, "Bu, Gazzâlî'den, Râzî'den, Şehristânî'den ve Cüveynî'den nakledilir;"], [526.7, "bunlar kelam ve felsefe ilminin kutupları ve yörüngeleridir."], [528.9, "Buna rağmen sonlarında Nîşâbur'un yaşlı kadınlarının akîdesi üzere ölmeyi temenni ettiler."], [534.0, "Nitekim Râzî şöyle demiştir: \"Akılların atılışının sonu bir bukağıdır;"], [539.0, "âlimlerin çabasının varacağı yer sapıklıktır."], [539.0, "Ömrümüz boyunca araştırmamızdan, 'dedi-dediler'i toplamaktan başka bir fayda görmedik.\""]]}, {"reader": false, "ar": [[556.0, "ويقول بعضهم مخبرًا عن نفسه أنه قد درس الفلسفة وبلغ أوجَها ونهايتها،"], [567.0, "ولكنه لم يجد فيها يقينًا ولا حقًّا،"], [571.0, "بل كلما توغّل في دهاليزها توغّل في الحيرة،"], [575.5, "وتوغّل في الضلال والتِّيه والزندقة."], [578.0, "قال: ولقد رأيتُ أفضلَ الطرق في الإثبات طريقةَ القرآن:"], [584.0, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span>،"], [586.0, "ورأيتُ أفضل الطرق في النفي في القرآن:"], [589.0, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ ۖ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>."], [591.0, "فليتني أموت على عقائد عجائز نيسابور."], [597.0, "ولنا فيهم عظةٌ وعبرة."]], "tr": [[556.0, "Onlardan biri de kendisi hakkında haber vererek felsefeyi okuduğunu, zirvesine ve sonuna ulaştığını, fakat onda ne bir yakîn ne de bir hak bulduğunu söyler."], [571.0, "Bilakis onun dehlizlerine daldıkça hayrete daldı;"], [575.5, "sapıklığa, şaşkınlığa ve zındıklığa daldı."], [578.0, "Şöyle dedi: \"İsbatta yolların en iyisinin Kur'an'ın yolu olduğunu gördüm:"], [584.0, "<span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5]."], [584.0, "Nefyde de yolların en iyisini Kur'an'da gördüm:"], [586.0, "<span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur; O işitendir, görendir﴾<\/span> [Şûrâ 11]."], [589.0, "Keşke Nîşâbur'un yaşlı kadınlarının akîdesi üzere ölsem.\" Onlarda bizim için bir öğüt ve ibret vardır."]]}]}, {"ts": "10:01", "title": "10. Külliye (devam): Selefin icmaı; kelama ihtiyaç yoktur", "paras": [{"reader": false, "ar": [[601.0, "وهذا الإمام ابن عبد البر رحمه الله تعالى يقول:"], [605.8, "«أجمع أهلُ الفقه والأثر من جميع الأمصار على أن أهل الكلام أهلُ بدعٍ وزيغ، ولا يُعَدّون عند جميع طبقات الفقهاء من العلماء»."], [622.0, "وقال الإمام البغوي رحمه الله تعالى:"], [625.5, "«واتفق علماء السلف من أهل السنة على النهي عن الجدال والخصومات في الصفات، وعلى الزجر عن الخوض في علم الكلام وتعليمه»."], [638.0, "وكلامهم في ذلك لا يكاد يُحصر."]], "tr": [[601.0, "İşte İmam İbn Abdilber (rahimehullah) şöyle der:"], [601.0, "\"Bütün beldelerdeki fıkıh ve eser ehli, kelam ehlinin bid'at ve sapma ehli olduğu konusunda icma etmiştir;"], [605.8, "onlar fakihlerin bütün tabakalarında âlimlerden sayılmazlar.\" İmam Beğavî (rahimehullah) de şöyle demiştir:"], [622.0, "\"Ehl-i Sünnet'ten olan selef âlimleri, sıfatlar hakkında cedel ve tartışmayı yasaklamakta ve kelam ilmine dalmaktan ve onu öğretmekten men etmekte ittifak etmişlerdir.\" Onların bu konudaki sözleri neredeyse sayılamayacak kadar çoktur."]]}, {"reader": false, "ar": [[644.0, "والحقُّ الحقيقُ بالقبول أنه لا حاجة للمسلمين في دراسة عقيدتهم إلى علم المنطق والفلسفة أصلًا،"], [653.0, "بل هو علمٌ ـ كما قال الإمام ابن تيمية ـ «لا يفهمه البليد، ولا يحتاجه الذكي»."], [663.0, "لا يفهمه البليد لأنه صعب،"], [664.8, "ولا يحتاجه الذكي لأن الذكي إذا سلك الطريقة الصحيحة في إثبات العقيدة فإنه سيصل إلى النتائج المطلوبة شرعًا من غير سلوكٍ لعلم الكلام."], [675.0, "فعلمُ الكلام لم يزد علومَ الإسلام إلا تعقيدًا وتضليلًا وإلغازًا وعمايةً وجهالةً وضلالة."]], "tr": [[644.0, "Kabule layık olan hak şudur:"], [644.0, "Müslümanların akîdelerini öğrenirken mantık ve felsefe ilmine aslâ ihtiyaçları yoktur."], [653.0, "Bilakis o, İmam İbn Teymiyye'nin dediği gibi, \"ahmağın anlayamadığı, zekinin de ihtiyaç duymadığı\" bir ilimdir."], [663.0, "Ahmak anlayamaz, çünkü zordur; zeki ihtiyaç duymaz, çünkü zeki akîdeyi isbatta doğru yolu tutarsa kelam ilmine başvurmadan şer'an istenen sonuçlara ulaşır."], [664.8, "Kelam ilmi İslâm ilimlerine karmaşıklık, saptırma, bilmece, körlük, cehalet ve sapıklıktan başka bir şey katmamıştır."]]}, {"reader": false, "ar": [[687.0, "فنحن لا نحتاج إلى علم الكلام أبدًا،"], [692.0, "فليس لنا ضرورةٌ فيه مطلقًا في أيّ فنٍّ من الفنون."], [698.0, "ومن قال بأن العقيدة لا بدّ لفهمها من فهم علم الكلام فإنه كاذب؛"], [704.0, "فلا يزال السلف يفهمون العقائد جملةً وتفصيلًا من غير أن يعرف أحدهم قاعدةً من قواعد المتكلمين،"], [712.0, "ولا مقدمةً من مقدماتهم المنطقية."], [715.0, "ومن قال بأن أصول الفقه علمٌ لا يُفهم إلا إذا درس الإنسانُ المنطقَ فأنت كاذب؛"], [721.0, "فلا نزال ندرس الفقه ونفهمه وندرّسه لطلابنا خالفًا عن سالفٍ إلى يومنا هذا من غير مرورٍ على المقدمات المنطقية."]], "tr": [[687.0, "Biz kelam ilmine asla ihtiyaç duymayız;"], [687.0, "hangi ilim dalında olursa olsun onda bizim için mutlak olarak hiçbir zaruret yoktur."], [698.0, "\"Akîdeyi anlamak için kelam ilmini anlamak şarttır\" diyen yalancıdır."], [704.0, "Selef, hiçbiri kelamcıların kaidelerinden bir kaideyi ya da mantıkî öncüllerinden bir öncülü bilmeden, akîdeleri icmalen ve tafsilen anlıyordu."], [715.0, "\"Usûl-i fıkıh, insan mantığı okumadıkça anlaşılamayan bir ilimdir\" diyen de —sen yalancısın."], [721.0, "Biz, mantıkî öncüllere hiç uğramadan, halef seleften devralarak bugüne kadar fıkhı okuyor, anlıyor ve talebelerimize okutuyoruz."]]}, {"reader": false, "ar": [[729.0, "بل ما عَسُر الفقه إلا لمّا أُدخلت فيه المقدمات المنطقية التي لا تشفي عليلًا ولا تروي غليلًا."], [738.0, "بل أجمع أهل الإسلام على أن نهايات علم الكلام إنما تُفضي إلى الزندقة،"], [746.4, "وإلى الجحود، وإلى التعطيل،"], [749.0, "وإلى التكذيب المفضي إلى الإلحاد."], [756.0, "وقد أفضى ببعضهم ـ كالرازي ـ إلى الإلحاد،"], [761.0, "وإلى تأليف كتب السحر،"], [764.0, "وإلى تأليف كتبٍ تصحّح عبادة النجوم والكواكب،"], [767.0, "لأنه طلب العقيدة على طريقة المتكلمين."]], "tr": [[729.0, "Hatta fıkıh ancak içine, ne hastaya şifa veren ne de susuzluğu gideren mantıkî öncüller sokulunca zorlaştı."], [729.0, "Bilakis İslâm ehli, kelam ilminin sonlarının ancak zındıklığa, inkâra, ta'tile ve ilhada götüren yalanlamaya vardığı konusunda icma etmiştir."], [749.0, "Râzî gibi bazılarını ilhada, sihir kitapları yazmaya ve yıldızlara ve gezegenlere ibadeti doğru gösteren kitaplar yazmaya götürmüştür;"], [767.0, "çünkü akîdeyi kelamcıların yoluyla aradı."]]}, {"reader": false, "ar": [[773.0, "ولذلك أنا أحذّركم يا طلاب العلم من علم الكلام والمنطق والفلسفة."], [780.0, "ومهما وُصف الإنسان بأنه رجعيٌّ ظلاميٌّ متخلّفٌ متأخرٌ في المعرفة ما لم يسلك طريق الفلسفة،"], [788.0, "فإنها كلماتٌ ألقاها الشيطان،"], [790.0, "يريد استدراج <span class=\"q\">؟ 13:10<\/span> أتباعه، ليزخرف القول؛"], [794.0, "لأنه يعلم أنه متى ما دخل الإنسان في علم الكلام والفلسفة في الإلهيات فإنه سيكون مآلُه مآلَ الزندقة والضلال."]], "tr": [[773.0, "Bu yüzden ey ilim talebeleri, sizi kelam, mantık ve felsefe ilminden sakındırıyorum."], [780.0, "İnsan felsefe yolunu tutmadıkça ne kadar gerici, karanlıkçı, geri kalmış, bilgide geride diye nitelenirse nitelensin, bunlar şeytanın ortaya attığı sözlerdir;"], [790.0, "onunla kendisine uyanları adım adım çekmek <span class=\"q\">؟<\/span> ve sözü yaldızlamak ister."], [794.0, "Çünkü bilir ki insan ilâhiyyât konusunda kelam ve felsefe ilmine girdiği anda, varacağı yer zındıklık ve sapıklık olacaktır."]]}]}, {"ts": "13:23", "title": "11. Külliye: Vahyin delili hakkındaki soru — istilam caiz, muâraza haram", "paras": [{"reader": false, "ar": [[803.0, "ومن الكليات أيضًا: كلُّ سؤالٍ عن دليل الوحي… ومن الكليات أيضًا:"], [810.0, "كلُّ سؤالٍ عن دليل الوحي،"], [812.0, "فإن كان استعلامًا فجائز،"], [816.0, "وإن كان معارضةً ومعاندةً وتشكيكًا فمحرَّم. كلُّ سؤالٍ عن دليل الوحي،"], [826.0, "إن كان استعلامًا فجائز،"], [830.0, "وإن كان معارضةً ومعاندةً وتشكيكًا فمحرَّم."], [836.0, "هذه مقدماتٌ مهمةٌ يفهمها الطلاب."], [838.0, "أعيدها مرةً ثالثة: كلُّ سؤالٍ عن دليل الوحي ـ أو على دليل الوحي ـ إن كان استعلامًا فجائز،"], [848.0, "وإن كان معارضةً ومعاندةً وتشكيكًا فمحرَّم."]], "tr": [[803.0, "Külliyelerden biri de şudur: Vahyin delili hakkındaki her soru… Külliyelerden biri de şudur:"], [810.0, "Vahyin delili hakkındaki her soru, eğer bilgi edinmek (istilam) için ise caizdir;"], [816.0, "eğer muâraza (itiraz), inat ve şüphe uyandırmak için ise haramdır. (Tekrar ediyor.) Bunlar talebelerin anlaması gereken önemli mukaddimelerdir."], [836.0, "Üçüncü kez tekrar ediyorum: Vahyin delili hakkındaki —ya da vahyin delili üzerine— her soru, bilgi edinmek için ise caizdir;"], [838.0, "muâraza, inat ve şüphe uyandırmak için ise haramdır."]]}, {"reader": false, "ar": [[852.0, "أقول وبالله التوفيق: الأصل في السؤال عن العلم الحِلُّ والإباحة؛"], [857.7, "لا حقَّ لأحدٍ أن يحرّم على طالبٍ أن يسأل شيخًا عن دليلٍ من القرآن أو السنة."], [866.0, "ولا يزال أهل العلم من الصحابة ومن بعدهم يسألون علماءهم عن مسألةٍ شرعية،"], [876.0, "ولا ينبغي لنا أن نضيّق هذا أبدًا."], [880.0, "وأما قول الله عز وجل:"], [882.3, "<span class=\"ayah\">﴿لَا تَسْأَلُوا عَنْ أَشْيَاءَ إِن تُبْدَ لَكُمْ تَسُؤْكُمْ﴾<\/span> <span class=\"ref\">[المائدة: ١٠١]<\/span>،"], [886.0, "فهذا مخصوصٌ بأوائل الوحي،"], [887.0, "سدًّا لذريعة أن يسأل الإنسان عن الشيء ثم يُشرَع،"], [892.1, "فتُلزَم الأمة بهذه الشريعة بسبب سؤالٍ واحد،"], [896.0, "فكانوا يُحذَّرون من ذلك."]], "tr": [[852.0, "Tevfik Allah'tandır, derim ki: İlim hakkında soru sormada asıl olan helal ve mubah olmasıdır."], [857.7, "Hiç kimsenin, bir talebenin bir hocaya Kur'an'dan veya Sünnet'ten bir delil sormasını haram kılmaya hakkı yoktur."], [866.0, "Sahabeden ve onlardan sonrakilerden ilim ehli, şer'î bir meseleyi âlimlerine sormaya devam etmiştir;"], [876.0, "bunu asla daraltmamız gerekmez. Allah Teâlâ'nın <span class=\"ayah\">﴿Size açıklandığında hoşunuza gitmeyecek şeyleri sormayın﴾<\/span> [Mâide 101] sözüne gelince, bu, vahyin ilk dönemlerine mahsustur."], [886.0, "İnsanın bir şeyi sorması, sonra (onun hakkında hüküm) teşri edilmesi ve tek bir soru yüzünden ümmetin bu hükümle yükümlü tutulması yolunu kapatmak içindir; bu yüzden bundan sakındırılıyorlardı."]]}]}, {"ts": "15:00", "title": "11. Külliye (devam): Makbul soru — istilam ve istifham", "paras": [{"reader": false, "ar": [[900.0, "لِما في الصحيحين من حديث سعد بن أبي وقاص رضي الله عنه قال:"], [906.4, "قال النبي ﷺ: «إنّ أعظمَ المسلمين في المسلمين جُرمًا مَن سُئل عن شيءٍ لم يُحرَّم فحُرِّم من أجل مسألته» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [916.0, "ولذلك نُهي الصحابة عن السؤال لهذا الأمر."], [921.0, "ولكن بعد موت النبي ﷺ وانقطاع التشريع والوحي زالت العلة،"], [926.0, "والمتقرّر في القواعد أن الحكم يدور مع علته وجودًا وعدمًا."], [931.0, "فالأصل جواز السؤال عن العلم،"], [934.0, "والأصل جواز السؤال عن أدلة الكتاب والسنة."]], "tr": [[900.0, "Çünkü Sahîhayn'de Sa'd b. Ebî Vakkâs'tan (r.a.) gelen hadiste Nebî ﷺ şöyle buyurmuştur:"], [900.0, "\"Müslümanlar içinde Müslümanlara karşı suçu en büyük olan, haram kılınmamış bir şeyi sorup da onun sorusu yüzünden o şey haram kılınan kimsedir.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Bu yüzden sahabe bu sebepten dolayı soru sormaktan nehyedildi."], [916.0, "Fakat Nebî ﷺ'in vefatından ve teşriin ve vahyin kesilmesinden sonra illet ortadan kalktı."], [921.0, "Kaidelerde yerleşik olan şudur: Hüküm, varlık ve yokluk bakımından illetiyle birlikte döner."], [926.0, "Dolayısıyla ilim hakkında soru sormanın caiz olması asıldır;"], [934.0, "Kitap ve Sünnet'in delillerini sormanın caiz olması da asıldır."]]}, {"reader": false, "ar": [[938.0, "إلا أن هذا السؤال ينقسم إلى قسمين:"], [942.0, "سؤالٌ مقبولٌ سائغ، وسؤالٌ مرفوضٌ زائغ."], [950.0, "أما السؤال المقبول السائغ فهو سؤال الاستعلام:"], [956.0, "كأن تستفسر عن معنى لفظةٍ،"], [959.2, "أو دلالة آيةٍ، أو حكمٍ يتضمّنه نصّ،"], [963.7, "أو شيءٍ من المعارضة وقعت في قلبك تريد أن تحلّها."], [973.0, "فسؤالك ـ معناه، عفوًا ـ فسؤالك مقصوده الاستعلام والاستفهام فقط،"], [981.0, "فهذا جائزٌ ولا بأس به ولا حرج فيه."], [985.0, "فقد كانت بعض الآيات تنزل ويسأل الصحابة عن معناها،"], [992.0, "وكان بعض الصحابة يسمع الحديث من النبي ﷺ ثم يسأل عن معناه."]], "tr": [[938.0, "Ancak bu soru iki kısma ayrılır:"], [938.0, "kabul edilen, yerinde bir soru ve reddedilen, sapkın bir soru."], [950.0, "Kabul edilen, yerinde soru ise bilgi edinme (istilam) sorusudur:"], [956.0, "Bir lafzın manasını, bir ayetin delâletini, bir nassın içerdiği hükmü ya da kalbine düşen ve çözmek istediğin bir çelişki (muâraza) hissini sorman gibi."], [973.0, "Sorunun —manası, pardon— sorunun maksadı sadece bilgi edinmek ve anlamaksa, bu caizdir;"], [981.0, "bunda hiçbir sakınca ve günah yoktur."], [985.0, "Bazı ayetler iner, sahabe onların manasını sorardı;"], [992.0, "bazı sahabiler de Nebî ﷺ'den hadisi işitir, sonra manasını sorardı."]]}, {"reader": false, "ar": [[999.0, "فمثلًا في الصحيحين من حديث عائشة رضي الله عنها أن النبي ﷺ قال:"], [1006.6, "«مَن حُوسِب عُذِّب»، فأشكل على عائشة رضي الله عنها هذا الإطلاق،"], [1012.4, "ورأت أنه يتعارض مع قول الله عز وجل:"], [1016.8, "<span class=\"ayah\">﴿فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا﴾<\/span> <span class=\"ref\">[الانشقاق: ٨]<\/span>،"], [1019.0, "فسألت عنه، وأقرّ النبي ﷺ سؤالها ولم ينكره،"], [1024.0, "والمتقرّر في القواعد أن إقرار النبي ﷺ حجةٌ على الجواز."], [1030.0, "فقال: «إنما ذلكِ العَرْض» ـ أي حساب العرض ـ «ولكن مَن نُوقش الحسابَ يَهلِك» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[999.0, "Mesela Sahîhayn'de Âişe'den (r.anhâ) gelen hadiste Nebî ﷺ \"Hesaba çekilen azap görür\" buyurdu."], [1006.6, "Bu mutlak ifade Âişe'ye (r.anhâ) müşkil geldi;"], [1006.6, "bunun Allah Teâlâ'nın <span class=\"ayah\">﴿Kolay bir hesapla hesaba çekilecek﴾<\/span> [İnşikâk 8] sözüyle çeliştiğini düşündü ve bunu sordu."], [1016.8, "Nebî ﷺ onun sorusunu onayladı, onu reddetmedi."], [1019.0, "Kaidelerde yerleşik olan şudur: Nebî ﷺ'in onaylaması (takriri) caiz oluşa delildir."], [1024.0, "Şöyle buyurdu: \"O ancak arzdır\" —yani arz (gösterilme) hesabıdır— \"fakat hesapta sorguya çekilen (münâkaşa edilen) helak olur.\" <span class=\"note\">(Buhârî, Müslim)<\/span>"]]}, {"reader": false, "ar": [[1040.0, "وفي الصحيحين من حديث عائشة رضي الله عنها قالت:"], [1045.4, "استأذن عليّ عمّي من الرضاعة فلم آذن له حتى أسأل رسول الله ﷺ،"], [1052.0, "فجاء النبي ﷺ فسألته فقال:"], [1056.6, "«إنه عمُّكِ فأْذَني له» ـ هذا نصّ ـ فاستشكل على عائشة ذلك الأمر،"], [1062.7, "فقالت: يا رسول الله،"], [1064.8, "إنما أرضعتني المرأة ولم يُرضعني الرجل."], [1068.0, "فأقرّها النبي ﷺ على هذا السؤال بعد نزول الوحي،"], [1075.0, "وإقراره دليلُ الجواز، وسؤالها إنما كان سؤالَ استعلامٍ واستفهام،"], [1081.0, "لا سؤالَ معاندةٍ ولا سؤالَ تشكيكٍ وطعن."], [1085.0, "قال: «إنه عمُّكِ فلْيَلِجْ عليكِ»،"], [1090.0, "وكان ذلك بعد أن فُرض علينا الحجاب <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[1040.0, "Sahîhayn'de yine Âişe'den (r.anhâ) gelen hadiste şöyle dedi:"], [1040.0, "\"Süt amcam yanıma girmek için izin istedi;"], [1045.4, "Resûlullah ﷺ'e sormadan ona izin vermedim."], [1052.0, "Nebî ﷺ gelince ona sordum;"], [1052.0, "'O senin amcandır, ona izin ver' buyurdu.\" —Bu bir nastır.— Bu durum Âişe'ye müşkil geldi ve \"Ey Allah'ın Resûlü, beni kadın emzirdi, erkek emzirmedi\" dedi."], [1064.8, "Nebî ﷺ vahiy indikten sonra onu bu sorusu üzerine onayladı;"], [1068.0, "onun onaylaması caiz oluşun delilidir."], [1075.0, "Onun sorusu ancak bilgi edinme ve anlama sorusuydu;"], [1075.0, "inat sorusu ya da şüphe uyandırma ve ta'n sorusu değildi."], [1085.0, "Şöyle buyurdu: \"O senin amcandır, yanına girsin.\" Bu, bize hicab farz kılındıktan sonraydı. <span class=\"note\">(Buhârî, Müslim)<\/span>"]]}, {"reader": false, "ar": [[1093.0, "وفي الصحيحين من حديث عقبة بن عامر رضي الله عنه قال:"], [1097.3, "قال النبي ﷺ: «إياكم والدخولَ على النساء»،"], [1101.0, "فأشكل على بعض الصحابة مسألةُ الحَمْو ـ يعني أخا الزوج ـ قال:"], [1106.7, "يا رسول الله، أرأيتَ الحمو؟"], [1110.0, "فأقرّه النبي ﷺ على هذا السؤال بعد نزول الوحي،"], [1114.0, "لكنه كان سؤالَ استعلامٍ واستفهام،"], [1118.0, "وليس سؤالَ تشكيكٍ وردٍّ ومعاندة."], [1120.0, "فقال: «الحمو الموت» <span class=\"note\">(Buhârî, Müslim)<\/span>، أو كما قال ﷺ."], [1129.0, "فمثل ذلك لا بأس به."]], "tr": [[1093.0, "Sahîhayn'de Ukbe b. Âmir'den (r.a.) gelen hadiste Nebî ﷺ şöyle buyurdu:"], [1093.0, "\"Kadınların yanına girmekten sakının.\" Bazı sahabilere hamv —yani kocanın kardeşi— meselesi müşkil geldi ve biri \"Ey Allah'ın Resûlü, hamv hakkında ne dersin?\" dedi."], [1106.7, "Nebî ﷺ vahiy indikten sonra onu bu sorusu üzerine onayladı;"], [1110.0, "çünkü bu, bilgi edinme ve anlama sorusuydu;"], [1114.0, "şüphe uyandırma, reddetme ve inat sorusu değildi."], [1118.0, "Şöyle buyurdu: \"Hamv ölümdür.\" <span class=\"note\">(Buhârî, Müslim)<\/span> —ya da buna yakın bir şey buyurdu ﷺ."], [1120.0, "Bu tür (sorularda) bir sakınca yoktur."]]}, {"reader": false, "ar": [[1131.0, "ولما قال النبي ﷺ: «انصُرْ أخاك ظالمًا أو مظلومًا»،"], [1137.0, "فأشكل على الصحابة قوله:"], [1139.7, "أنصره ظالمًا؟ فبيّن لهم أن المقصود من ذلك كفُّه عن الظلم،"], [1146.0, "فإن ذلك نصرةٌ له."], [1148.0, "وغير ذلك من الوقائع كثيرٌ جدًّا،"], [1152.0, "إلا أنها أسئلةٌ استفهاميةٌ استعلامية."]], "tr": [[1131.0, "Nebî ﷺ \"Kardeşine, zalim de olsa mazlum da olsa yardım et\" buyurduğunda, \"zalime nasıl yardım ederiz?\" sözü sahabeye müşkil geldi."], [1139.7, "Onlara bundan maksadın onu zulümden alıkoymak olduğunu, bunun ona yardım olduğunu açıkladı."], [1148.0, "Bunun dışında da pek çok olay vardır;"], [1148.0, "ancak bunlar anlamaya ve bilgi edinmeye yönelik sorulardır."]]}, {"reader": false, "ar": [[1156.5, "وكليتُنا تتكلم عن النوع الثاني،"], [1161.0, "وهي تلك الأسئلة التي تكون عند نزول الوحي،"], [1165.0, "لا يريد صاحبها الاستفهام،"], [1168.0, "ولا يريد التعلم، ولا يريد الاستعلام،"], [1170.6, "وإنما يريد المعارضة والتشكيك وعدم الامتثال لهذا النص."], [1175.0, "فهو رافضٌ للنص، ويُخرج رفضه بأسئلةٍ عناديةٍ تشكيكية يقصد بها معارضة النص،"], [1187.9, "لأن قلبه لم يقبل النص ولم يمتثل ولم ينقَدْ له أصلًا،"], [1193.0, "ولم يستسلم ولم يُذعن له."], [1195.0, "فهذه الأسئلة هي الأسئلة المذمومة في الكتاب والسنة،"]], "tr": [[1156.5, "Külliyemiz ise ikinci türden bahseder:"], [1161.0, "Vahiy indiği sırada sorulan, sahibinin anlamak, öğrenmek ya da bilgi edinmek istemediği, sadece muâraza, şüphe uyandırma ve bu nassa uymamayı istediği sorular."], [1170.6, "O kişi nassı reddediyordur ve reddini, nassa itiraz etmeyi kastettiği inatçı ve şüpheci sorularla dışa vurur."], [1175.0, "Çünkü kalbi nassı kabul etmemiş, ona uymamış, ona hiç boyun eğmemiş, teslim olmamış ve ona itaat etmemiştir."], [1195.0, "İşte Kitap ve Sünnet'te kınanan sorular bu sorulardır —"]]}]}, {"ts": "20:00", "title": "11. Külliye (devam): Kınanan inatçı sorular", "paras": [{"reader": false, "ar": [[1200.0, "كسؤال اليهود موسى لما قال:"], [1204.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تَذْبَحُوا بَقَرَةً﴾<\/span> <span class=\"ref\">[البقرة: ٦٧]<\/span>،"], [1207.0, "كان الأصل فيهم أن يقولوا:"], [1211.0, "سمعنا وأطعنا، لكنهم صاروا يتنقّلون من سؤالٍ عناديٍّ تشكيكيٍّ يريدون به معارضة النص،"], [1221.0, "ولا يزال الله عز وجل يشدّد ويغلّظ عليهم في الإجابة."], [1226.0, "فلو أنهم امتثلوا الأمر أولَ مرة لما كانت نهاياته كما في آخر مرة."]], "tr": [[1200.0, "— Yahudilerin Mûsâ'ya sorusu gibi:"], [1204.0, "O <span class=\"ayah\">﴿Allah size bir inek kesmenizi emrediyor﴾<\/span> [Bakara 67] dediğinde, onlara düşen \"İşittik ve itaat ettik\" demeleriydi."], [1211.0, "Fakat nassa itiraz etmeyi amaçladıkları inatçı, şüpheci bir sorudan (diğerine) geçmeye başladılar;"], [1221.0, "Allah Teâlâ da cevapta onlara giderek zorlaştırıp ağırlaştırdı."], [1226.0, "Emre ilk seferde uysalardı, sonu son seferdeki gibi olmazdı."]]}, {"reader": false, "ar": [[1231.0, "وكسؤال أولئك القوم لما قال لهم نبيهم:"], [1243.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ قَدْ بَعَثَ لَكُمْ طَالُوتَ مَلِكًا﴾<\/span>،"], [1245.0, "كان الواجب عليهم أن يقولوا:"], [1247.1, "سمعنا وأطعنا، لكنهم سألوا سؤالَ معاندٍ ومعارضٍ ورافضٍ لهذا الأمر:"], [1252.0, "<span class=\"ayah\">﴿أَنَّىٰ يَكُونُ لَهُ الْمُلْكُ عَلَيْنَا وَنَحْنُ أَحَقُّ بِالْمُلْكِ مِنْهُ وَلَمْ يُؤْتَ سَعَةً مِّنَ الْمَالِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٤٧]<\/span>."], [1257.0, "هذه أسئلةٌ لا يُراد بها الاستفهام،"], [1262.0, "ولا يُراد بها الاستعلام والتعلم،"], [1264.0, "وإنما يُراد بها التشكيك والمعارضة والرفض وعدم الامتثال."]], "tr": [[1231.0, "Ve peygamberleri onlara <span class=\"ayah\">﴿Allah size Tâlût'u hükümdar olarak gönderdi﴾<\/span> dediğinde o topluluğun sorusu gibi."], [1245.0, "Onlara düşen \"İşittik ve itaat ettik\" demeleriydi;"], [1247.1, "fakat bu emre inat eden, itiraz eden ve onu reddeden birinin sorusunu sordular:"], [1252.0, "<span class=\"ayah\">﴿Bizim üzerimizde onun hükümdarlığı nasıl olur? Hükümdarlığa biz ondan daha layığız; ona maldan bir genişlik de verilmemiştir﴾<\/span> [Bakara 247]."], [1257.0, "Bunlar anlamak, bilgi edinmek ve öğrenmek kastedilmeyen;"], [1262.0, "sadece şüphe uyandırma, itiraz, reddetme ve uymamanın kastedildiği sorulardır."]]}, {"reader": false, "ar": [[1270.0, "ولذلك يقول النبي ﷺ: «ذَروني ما تركتُكم، فإنما هلك من كان قبلكم بكثرة مسائلهم» <span class=\"note\">(Müslim)<\/span>،"], [1284.0, "أي مسائلهم إيش؟ العنادية التشكيكية،"], [1288.0, "التي يريدون بها معارضة الحق والطعن فيه."], [1293.0, "ولذلك في الصحيحين من حديث مُعاذة عن عائشة:"], [1299.0, "أنها سألت عائشة رضي الله عنها:"], [1302.4, "ما بالُ الحائض تقضي الصوم ولا تقضي الصلاة؟"], [1307.0, "فأرادت أن تستفسر منها:"], [1309.9, "أهو سؤالُ مشكِّكٍ ومعاند؟"], [1315.0, "فقالت: أحَروريّةٌ أنتِ؟ فشأن الحرورية أسئلة التشكيك والمعارضة."], [1323.0, "فقالت: لستُ بحرورية، ولكني أسأل،"], [1326.5, "أي أسأل سؤالَ استعلامٍ واستفهام."]], "tr": [[1270.0, "Bu yüzden Nebî ﷺ şöyle buyurur:"], [1270.0, "\"Ben sizi (kendi hâlinize) bıraktığım sürece siz de beni bırakın;"], [1270.0, "sizden öncekiler ancak sorularının çokluğu yüzünden helak oldular.\" <span class=\"note\">(Müslim)<\/span> Yani ne tür soruları?"], [1284.0, "Hakka itiraz etmeyi ve onu ta'n etmeyi amaçladıkları inatçı, şüpheci soruları."], [1293.0, "Bu yüzden Sahîhayn'de Muâze'nin Âişe'den rivayet ettiği hadiste, (Muâze) Âişe'ye (r.anhâ) şunu sordu:"], [1299.0, "\"Hayızlı kadına ne oluyor da orucu kaza ediyor da namazı kaza etmiyor?\" (Âişe) ondan, bunun şüpheci ve inatçı birinin sorusu olup olmadığını öğrenmek istedi ve \"Sen Harûriyye'den (Hâricîlerden) misin?\" dedi."], [1315.0, "Çünkü Harûriyye'nin işi şüphe ve itiraz sorularıdır."], [1323.0, "(Muâze) \"Harûrî değilim, sadece soruyorum\" dedi;"], [1326.5, "yani bilgi edinmek ve anlamak için soruyorum."]]}, {"reader": false, "ar": [[1331.0, "فلما تأكّدت من هذا أجابت بقولها:"], [1336.0, "«كان النبي ﷺ يأمرنا بقضاء الصوم ولا يأمرنا بقضاء الصلاة» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [1344.0, "واسمع إلى قول الله عز وجل:"], [1345.0, "<span class=\"ayah\">﴿وَإِذَا قِيلَ لَهُمُ اسْجُدُوا لِلرَّحْمَٰنِ﴾<\/span>،"], [1348.0, "المفروض أن يقولوا: سمعنا وأطعنا،"], [1355.0, "لكنهم تركوا «سمعنا وأطعنا» وسألوا سؤالَ رافضٍ لهذا الأمر:"], [1360.0, "<span class=\"ayah\">﴿قَالُوا وَمَا الرَّحْمَٰنُ أَنَسْجُدُ لِمَا تَأْمُرُنَا وَزَادَهُمْ نُفُورًا﴾<\/span> <span class=\"ref\">[الفرقان: ٦٠]<\/span>."], [1368.0, "«زادهم نفورًا» أي سؤالهم هذا زادهم تشكيكًا وكفرًا ونفورًا عن قبول الحق،"], [1375.0, "كما قال الله عز وجل:"], [1378.0, "<span class=\"ayah\">﴿فَلَمَّا زَاغُوا أَزَاغَ اللَّهُ قُلُوبَهُمْ﴾<\/span> <span class=\"ref\">[الصف: ٥]<\/span>."]], "tr": [[1331.0, "Bundan emin olunca şu sözüyle cevap verdi:"], [1336.0, "\"Nebî ﷺ bize orucu kaza etmemizi emrederdi, namazı kaza etmemizi emretmezdi.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Allah Teâlâ'nın şu sözünü dinle:"], [1344.0, "<span class=\"ayah\">﴿Onlara \"Rahmân'a secde edin\" denildiğinde﴾<\/span> — onlara düşen \"İşittik ve itaat ettik\" demeleriydi."], [1348.0, "Fakat \"İşittik ve itaat ettik\"i bırakıp bu emri reddeden birinin sorusunu sordular:"], [1360.0, "<span class=\"ayah\">﴿\"Rahmân da nedir? Senin emrettiğin şeye mi secde edeceğiz?\" dediler ve bu, onların nefretini artırdı﴾<\/span> [Furkân 60]."], [1360.0, "\"Nefretlerini artırdı\", yani bu soruları onların şüphesini, küfrünü ve hakkı kabulden kaçışını artırdı."], [1375.0, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [1378.0, "<span class=\"ayah\">﴿Onlar sapınca Allah da kalplerini saptırdı﴾<\/span> [Saf 5]."]]}, {"reader": false, "ar": [[1381.0, "وسؤالُ العناد وسؤالُ التشكيك وسؤالُ المعارضة كلُّها من زيغ القلوب عند سماع النصوص."], [1390.0, "فلربما تسأل سؤالَ عنادٍ بعد نزول النص تريد به الطعن في النص والتشكيك فيه،"], [1396.0, "فيعاقبك الله أن لا يقبل قلبُك الحقَّ بعد ذلك،"], [1400.0, "كما قال الله عز وجل:"], [1402.2, "<span class=\"ayah\">﴿وَنُقَلِّبُ أَفْئِدَتَهُمْ وَأَبْصَارَهُمْ كَمَا لَمْ يُؤْمِنُوا بِهِ أَوَّلَ مَرَّةٍ﴾<\/span> <span class=\"ref\">[الأنعام: ١١٠]<\/span>،"], [1406.7, "أي بالحق. فعقوبةُ من لا يؤمن بالحق أولَ مرة إغلاقُ قلبه عن الإيمان به ثاني مرة،"], [1413.0, "حرمانًا وخذلانًا من الله عز وجل."]], "tr": [[1381.0, "İnat sorusu, şüphe sorusu ve itiraz sorusu;"], [1381.0, "bunların hepsi nasları işitirken kalplerin sapmasındandır."], [1381.0, "Belki de nas indikten sonra, onunla nassı ta'n etmeyi ve onda şüphe uyandırmayı istediğin bir inat sorusu sorarsın;"], [1390.0, "Allah da seni, kalbinin bundan sonra hakkı kabul etmemesiyle cezalandırır."], [1400.0, "Nitekim Allah Teâlâ şöyle buyurmuştur:"], [1402.2, "<span class=\"ayah\">﴿İlk defa ona iman etmedikleri gibi, biz de onların kalplerini ve gözlerini ters çeviririz﴾<\/span> [En'âm 110], yani hakka (iman etmedikleri gibi)."], [1402.2, "Hakka ilk seferde iman etmeyenin cezası, Allah Teâlâ'nın bir mahrum bırakması ve yardımsız bırakması olarak kalbinin ikinci seferde ona iman etmeye kapanmasıdır."]]}, {"reader": false, "ar": [[1420.0, "فاحذروا يا طلبة العلم إذا سمعتم الله يقول:"], [1423.0, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> أن تقولوا:"], [1425.2, "كيف يستوي؟ فاستواؤه يلزم منه أن يكون محتاجًا للعرش!"], [1431.0, "كلُّ هذه أسئلةُ عنادٍ وتشكيكٍ وطعنٍ في النص."], [1434.0, "وهو حالُ أهل البدع إذا سمعوا الآيات،"], [1438.0, "فإنها لا تزيدهم إيمانًا."], [1439.8, "كما قال الله عز وجل:"], [1442.0, "<span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ﴾<\/span> إيش؟"], [1446.0, "<span class=\"ayah\">﴿وَجِلَتْ قُلُوبُهُمْ وَإِذَا تُلِيَتْ عَلَيْهِمْ آيَاتُهُ﴾<\/span> ـ آياتُ الصفات،"], [1451.0, "آيات الوعد، آيات الوعيد،"], [1453.0, "آيات الأمر، آيات النهي ـ <span class=\"ayah\">﴿زَادَتْهُمْ إِيمَانًا﴾<\/span> <span class=\"ref\">[الأنفال: ٢]<\/span>،"], [1457.0, "أي زادتهم امتثالًا وسمعًا وطاعةً وإذعانًا وتسليمًا."]], "tr": [[1420.0, "Ey ilim talebeleri! Allah'ın <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> buyurduğunu işittiğinizde \"Nasıl istivâ eder?"], [1423.0, "O'nun istivâsı Arş'a muhtaç olmasını gerektirir!\" demekten sakının."], [1425.2, "Bunların hepsi inat, şüphe ve nassı ta'n sorularıdır."], [1431.0, "Bu, bid'at ehlinin ayetleri işittiklerindeki hâlidir:"], [1438.0, "Ayetler onların imanını artırmaz. Nitekim Allah Teâlâ şöyle buyurmuştur:"], [1442.0, "<span class=\"ayah\">﴿Müminler ancak o kimselerdir ki Allah anıldığında﴾<\/span> ne olur?"], [1446.0, "<span class=\"ayah\">﴿kalpleri titrer; O'nun ayetleri kendilerine okunduğunda﴾<\/span> —sıfat ayetleri, vaad ayetleri, vaîd ayetleri, emir ayetleri, nehiy ayetleri— <span class=\"ayah\">﴿imanlarını artırır﴾<\/span> [Enfâl 2];"], [1453.0, "yani onların itaatini, işitip boyun eğmesini, teslimiyetini ve kabulünü artırır."]]}, {"reader": false, "ar": [[1462.0, "إياكم أن تكونوا ممن قال الله عز وجل فيهم:"], [1466.0, "<span class=\"ayah\">﴿وَإِذَا تُتْلَىٰ عَلَيْهِمْ آيَاتُنَا بَيِّنَاتٍ تَعْرِفُ فِي وُجُوهِ الَّذِينَ كَفَرُوا الْمُنكَرَ﴾<\/span> <span class=\"note\">(Şeyh «فاعرف» diye okuyor gibi.)<\/span> إذا تلوتَ على الأشعري آيات إثبات الصفات تمعّر وجهه وقال:"], [1477.8, "لا، هذه ليست على ظاهرها."], [1480.0, "إذا تلوتَ على المعتزلي الآيات التي تدل على أن القرآن منزَّلٌ غير مخلوق رفض ذلك وقال:"], [1487.9, "لا يُراد بها ذلك."], [1489.0, "إذا تلوتَ على الصوفي الآيات التي تحذّر من عبادة الأولياء،"], [1494.0, "وعبادة القبور والذبح لها،"], [1495.7, "والطواف والاستغاثة بأصحابها، أنكر ذلك وقال:"], [1498.4, "لا يمكن أن يكون المراد بها أولياؤنا."]], "tr": [[1462.0, "Sakın Allah Teâlâ'nın hakkında şöyle buyurduğu kimselerden olmayın:"], [1466.0, "<span class=\"ayah\">﴿Ayetlerimiz onlara apaçık olarak okunduğunda, kâfirlerin yüzlerinde inkârı tanırsın﴾<\/span>."], [1466.0, "Eş'arîye sıfatları isbat eden ayetleri okuduğunda yüzü değişir ve \"Hayır, bunlar zahirleri üzere değildir\" der."], [1466.0, "Mu'tezilîye Kur'an'ın indirilmiş olduğunu, mahlûk olmadığını gösteren ayetleri okuduğunda bunu reddeder ve \"Hayır, bununla bu kastedilmez\" der."], [1480.0, "Sûfîye velilere ibadetten, kabirlere ibadetten, onlar için kurban kesmekten, onları tavaf etmekten ve sahiplerinden istiğaseden sakındıran ayetleri okuduğunda bunu inkâr eder ve \"Bununla bizim velilerimizin kastedilmesi mümkün değildir\" der."]]}]}, {"ts": "25:01", "title": "11. Külliye (devam): Telakkinin esası tam teslimdir", "paras": [{"reader": false, "ar": [[1501.2, "<span class=\"ayah\">﴿تَعْرِفُ فِي وُجُوهِ الَّذِينَ كَفَرُوا الْمُنكَرَ ۖ يَكَادُونَ يَسْطُونَ بِالَّذِينَ يَتْلُونَ عَلَيْهِمْ آيَاتِنَا﴾<\/span> <span class=\"ref\">[الحج: ٧٢]<\/span>."], [1510.0, "فكلُّ من اكفهرّ وجهه عند سماع شيءٍ من الوحي فهو دليلٌ على زيغ القلب،"], [1517.0, "وكلُّ من سأل سؤالَ عنادٍ وتشكيكٍ ومعارضةٍ بعد سماع شيءٍ من الوحي فهذا دليلٌ على إيش؟"], [1523.0, "ضلال المنهج في التلقي."], [1526.0, "ولذلك نحن معاشرَ أهل السنة نقرّر بأن التلقي مبنيٌّ على إيش؟"], [1532.0, "كمال… كمال إيش؟ كمال الإذعان،"], [1535.0, "كمال الإيمان، وكمال التسليم وعدم المعارضة."], [1538.8, "أليس كذلك؟ احمدوا ربكم،"], [1542.0, "الحمد لله أننا من أهل السنة."]], "tr": [[1501.2, "<span class=\"ayah\">﴿Kâfirlerin yüzlerinde inkârı tanırsın; neredeyse kendilerine ayetlerimizi okuyanlara saldıracaklar﴾<\/span> [Hac 72]."], [1501.2, "Vahiyden bir şey işittiğinde yüzü kararan herkes, (bu) kalbin sapmasına delildir."], [1510.0, "Vahiyden bir şey işittikten sonra inat, şüphe ve itiraz sorusu soran herkes, bu neye delildir?"], [1517.0, "Telakkide (dini alışta) metodun sapıklığına."], [1517.0, "Bu yüzden biz Ehl-i Sünnet topluluğu, telakkinin neye dayandığını takrir ederiz?"], [1526.0, "Tam… tam neye? Tam boyun eğmeye, tam imana, tam teslimiyete ve itiraz etmemeye."], [1535.0, "Öyle değil mi? Rabbinize hamd edin;"], [1538.8, "Ehl-i Sünnet'ten olduğumuz için Allah'a hamd olsun."]]}, {"reader": false, "ar": [[1543.0, "ولذلك لما جاءت قريشٌ تخبر أبا بكرٍ بأن النبي ﷺ قد أُسري به،"], [1553.0, "قال: «إن كان قاله فقد صدق»،"], [1558.0, "أو كما قال رضي الله عنه وأرضاه."]], "tr": [[1543.0, "Bu yüzden Kureyş, Nebî ﷺ'in İsrâ'ya götürüldüğünü Ebû Bekir'e haber vermeye geldiğinde, \"Eğer o bunu söylediyse doğru söylemiştir\" dedi —ya da buna yakın bir şey söyledi;"], [1558.0, "Allah ondan razı olsun ve onu razı etsin."]]}, {"reader": false, "ar": [[1560.0, "الكلية التي بعدها: <b>كلُّ من بلغه الدليلُ وفهمه مطلقَ الفهم فقد قامت عليه الحجة.<\/b> كلُّ من بلغه الدليل وفهمه بمطلق الفهم فقد قامت عليه الحجة."], [1582.0, "كلُّ من بلغه الدليل وفهمه مطلق الفهم فقد قامت عليه الحجة."]], "tr": [[1560.0, "Sonraki külliye: <b>Delil kendisine ulaşan ve onu mutlak bir anlayışla (az da olsa) anlayan herkese hüccet ikame edilmiş olur.<\/b> (İki kez daha tekrar ediyor.)"]]}, {"reader": false, "ar": [[1589.0, "وهذا دليلٌ على أن الحجة لا تقوم إلا بشرطين اثنين:"], [1595.0, "الأول: بلوغ النص. وبناءً على اشتراط هذا الشرط فكلُّ من لم يبلغه النص ـ أي الدليل من الكتاب والسنة ـ فإن الحجة لم تقم عليه بعد،"], [1608.0, "لقول الله عز وجل:"], [1610.0, "<span class=\"ayah\">﴿وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولًا﴾<\/span> <span class=\"ref\">[الإسراء: ١٥]<\/span>،"], [1615.0, "ولقول الله عز وجل:"], [1617.0, "<span class=\"ayah\">﴿لِأُنذِرَكُم بِهِ وَمَن بَلَغَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٩]<\/span>."], [1624.0, "فمن بلغته النصوص فقد قامت عليه الحجة،"], [1627.0, "ومن لم تبلغه النصوص فإن الحجة لم تقم عليه."]], "tr": [[1589.0, "Bu, hüccetin ancak iki şartla ikame edileceğine delildir."], [1589.0, "Birincisi: Nassın ulaşması. Bu şartın konulmasına binaen, nas —yani Kitap ve Sünnet'ten delil— kendisine ulaşmayan herkese henüz hüccet ikame edilmemiştir."], [1595.0, "Çünkü Allah Teâlâ şöyle buyurmuştur:"], [1610.0, "<span class=\"ayah\">﴿Biz bir resul göndermedikçe azap edici değiliz﴾<\/span> [İsrâ 15]."], [1610.0, "Yine Allah Teâlâ şöyle buyurmuştur:"], [1615.0, "<span class=\"ayah\">﴿Onunla sizi ve ulaştığı herkesi uyarayım diye﴾<\/span> [En'âm 19]."], [1617.0, "Naslar kendisine ulaşana hüccet ikame edilmiştir;"], [1624.0, "naslar kendisine ulaşmayana hüccet ikame edilmemiştir."]]}, {"reader": false, "ar": [[1631.0, "ولقول الله عز وجل:"], [1633.5, "<span class=\"ayah\">﴿كُلَّمَا أُلْقِيَ فِيهَا فَوْجٌ سَأَلَهُمْ خَزَنَتُهَا أَلَمْ يَأْتِكُمْ نَذِيرٌ ۝ قَالُوا بَلَىٰ﴾<\/span> <span class=\"ref\">[الملك: ٨–٩]<\/span>."], [1640.0, "إذن الجواب: بما أنه قد جاءكم النذير بالوحي والنص فقد قامت عليكم الحجة،"], [1647.0, "فلا يُغاثون إذا استغاثوا."], [1650.0, "ولقول الله عز وجل:"], [1654.0, "<span class=\"ayah\">﴿وَسِيقَ الَّذِينَ كَفَرُوا إِلَىٰ جَهَنَّمَ زُمَرًا ۖ حَتَّىٰ إِذَا جَاءُوهَا فُتِحَتْ أَبْوَابُهَا وَقَالَ لَهُمْ خَزَنَتُهَا أَلَمْ يَأْتِكُمْ رُسُلٌ مِّنكُمْ يَتْلُونَ عَلَيْكُمْ آيَاتِ رَبِّكُمْ وَيُنذِرُونَكُمْ لِقَاءَ يَوْمِكُمْ هَٰذَا ۚ قَالُوا بَلَىٰ﴾<\/span> <span class=\"ref\">[الزمر: ٧١]<\/span>."], [1668.8, "إذن قامت الحجة بعد مجيء النص."]], "tr": [[1631.0, "Ve Allah Teâlâ'nın şu sözü sebebiyle:"], [1633.5, "<span class=\"ayah\">﴿Oraya her bir topluluk atıldıkça bekçileri onlara \"Size bir uyarıcı gelmedi mi?\" diye sorar. \"Evet\" derler﴾<\/span> [Mülk 8–9]."], [1640.0, "O hâlde cevap şudur: Size vahiy ve nasla uyarıcı geldiğine göre, size hüccet ikame edilmiştir;"], [1647.0, "artık yardım istediklerinde yardım görmezler."], [1654.0, "Ve Allah Teâlâ'nın şu sözü sebebiyle:"], [1654.0, "<span class=\"ayah\">﴿İnkâr edenler bölük bölük cehenneme sürülür. Oraya vardıklarında kapıları açılır ve bekçileri onlara \"İçinizden, size Rabbinizin ayetlerini okuyan ve bu gününüze kavuşacağınız konusunda sizi uyaran resuller gelmedi mi?\" der. \"Evet\" derler﴾<\/span> [Zümer 71]."], [1654.0, "Demek ki hüccet, nassın gelmesinden sonra ikame edilmiştir."]]}, {"reader": false, "ar": [[1671.0, "ولقول الله عز وجل:"], [1673.7, "<span class=\"ayah\">﴿رُّسُلًا مُّبَشِّرِينَ وَمُنذِرِينَ لِئَلَّا يَكُونَ لِلنَّاسِ عَلَى اللَّهِ حُجَّةٌ بَعْدَ الرُّسُلِ﴾<\/span> <span class=\"ref\">[النساء: ١٦٥]<\/span>،"], [1681.0, "فإذا جاء الرسول بالوحي المبين والنص الواضح فإن الحجة قد قامت على من جاء إليهم."], [1689.1, "وقال الله عز وجل:"], [1691.6, "<span class=\"ayah\">﴿وَمَا كَانَ رَبُّكَ مُهْلِكَ الْقُرَىٰ حَتَّىٰ يَبْعَثَ فِي أُمِّهَا رَسُولًا يَتْلُو عَلَيْهِمْ آيَاتِنَا﴾<\/span> <span class=\"ref\">[القصص: ٥٩]<\/span>،"], [1703.0, "فأفاد ذلك أنه إذا لم يأتِ هذا الرسول لبعض القرى فإن الحجة لا تقوم عليهم."], [1710.0, "ولقول الله عز وجل:"], [1712.6, "<span class=\"ayah\">﴿وَمَا كَانَ اللَّهُ لِيُضِلَّ قَوْمًا بَعْدَ إِذْ هَدَاهُمْ حَتَّىٰ يُبَيِّنَ لَهُم مَّا يَتَّقُونَ﴾<\/span> <span class=\"ref\">[التوبة: ١١٥]<\/span>،"], [1722.0, "أي بنزول الوحي، وأما قبل ذلك فلا تقوم الحجة."]], "tr": [[1671.0, "Ve Allah Teâlâ'nın şu sözü sebebiyle:"], [1673.7, "<span class=\"ayah\">﴿Resullerden sonra insanların Allah'a karşı bir hücceti olmasın diye müjdeleyici ve uyarıcı resuller (gönderdik)﴾<\/span> [Nisâ 165]."], [1673.7, "Resul apaçık vahiy ve açık nasla geldiğinde, kendilerine geldiği kimselere hüccet ikame edilmiş olur."], [1689.1, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿Rabbin, ülkelerin anakentine onlara ayetlerimizi okuyan bir resul göndermedikçe o ülkeleri helak edici değildir﴾<\/span> [Kasas 59]."], [1691.6, "Bu da şunu ifade etti:"], [1703.0, "Bu resul bazı ülkelere gelmezse onlara hüccet ikame edilmiş olmaz."], [1703.0, "Ve Allah Teâlâ'nın şu sözü sebebiyle:"], [1712.6, "<span class=\"ayah\">﴿Allah bir kavmi hidayete erdirdikten sonra, sakınacakları şeyleri onlara açıklamadıkça onları saptıracak değildir﴾<\/span> [Tevbe 115], yani vahyin inmesiyle;"], [1722.0, "ondan önce ise hüccet ikame edilmiş olmaz."]]}, {"reader": false, "ar": [[1729.0, "ولذلك في الصحيحين من حديث ابن عمر رضي الله عنه قال:"], [1738.0, "«بينما الناس بقُباءٍ في صلاة الصبح إذ جاءهم آتٍ فقال: إن النبي ﷺ قد أُنزل عليه الليلة قرآن، وقد أُمر أن يستقبل القبلة فاستقبِلوها، فاستداروا كما هم إلى الكعبة» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [1756.0, "أي أكملوا صلاتهم، فافتتحوها إلى القبلة المنسوخة واختتموها بالقبلة الناسخة،"], [1764.0, "ولم يستأنفوا الصلاة من جديد."], [1766.0, "فلماذا لم يُطالَبوا بأدلة نسخ القبلة؟"], [1769.0, "لأنهم لم يعلموا بها ولم تصلهم بعد."]], "tr": [[1729.0, "Bu yüzden Sahîhayn'de İbn Ömer'den (r.a.) gelen hadiste şöyle dedi:"], [1729.0, "\"İnsanlar Kubâ'da sabah namazındayken onlara biri geldi ve 'Bu gece Nebî ﷺ'e Kur'an indirildi ve kıbleye (Kâbe'ye) yönelmesi emredildi;"], [1738.0, "siz de ona yönelin' dedi."], [1738.0, "Bunun üzerine oldukları hâlde Kâbe'ye doğru döndüler.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Yani namazlarını tamamladılar:"], [1756.0, "Onu neshedilmiş kıbleye yönelerek başlattılar, nesheden kıbleye yönelerek bitirdiler ve namaza yeniden başlamadılar."], [1764.0, "Neden kıblenin neshine dair delillerle (daha önce) sorumlu tutulmadılar?"], [1766.0, "Çünkü onu bilmiyorlardı ve (haber) henüz onlara ulaşmamıştı."]]}, {"reader": false, "ar": [[1772.0, "فإذا كان ذلك حالَ أهل قباء،"], [1774.0, "وهم قريبون من المدينة،"], [1778.0, "ومع ذلك لم يأمرهم النبي ﷺ بإعادة هذه الصلاة التي افتتحوها إلى القبلة المنسوخة،"], [1784.0, "فكيف بحال المسلمين في مكة مع بُعد المسافة؟"], [1787.0, "أو بحال المسلمين في أرض الحبشة مع بعد المسافة؟"], [1794.0, "أو بحال المسلمين في اليمامة مع بعد المسافة؟"]], "tr": [[1772.0, "Medine'ye yakın oldukları hâlde Kubâ ehlinin durumu buysa ve Nebî ﷺ onlara neshedilmiş kıbleye yönelerek başladıkları bu namazı iade etmelerini emretmediyse, uzak mesafeye rağmen Mekke'deki Müslümanların durumu nasıl olur?"], [1784.0, "Ya da uzak mesafeye rağmen Habeşistan'daki Müslümanların durumu?"], [1787.0, "Ya da uzak mesafeye rağmen Yemâme'deki Müslümanların durumu?"]]}]}, {"ts": "30:00", "title": "12. Külliye (devam): İkinci şart — mutlak anlayış (mutlaku'l-fehm)", "paras": [{"reader": false, "ar": [[1800.0, "ومع ذلك لم يثبت أن النبي ﷺ قد أمر أحدًا بإعادة صلاةٍ صلّاها إلى القبلة المنسوخة،"], [1807.0, "لأن الدليل الناسخ لا يلزم العمل به إلا بعد العلم به،"], [1812.0, "ولأن المتقرّر في القواعد أن التكاليف الشرعية منوطةٌ بالقدرة على العلم والعمل،"], [1819.0, "فلا تكليفَ إلا بعلم،"], [1822.5, "ولا عقوبةَ إلا بعد إنذار."]], "tr": [[1800.0, "Buna rağmen Nebî ﷺ'in, neshedilmiş kıbleye yönelerek kıldığı bir namazı iade etmesini herhangi birine emrettiği sabit olmamıştır."], [1807.0, "Çünkü nesheden delille amel etmek ancak onu öğrendikten sonra gerekli olur."], [1812.0, "Ayrıca kaidelerde yerleşik olan şudur:"], [1812.0, "Şer'î teklifler, bilmeye ve amel etmeye güç yetirmeye bağlıdır."], [1819.0, "İlim olmadan teklif, uyarıdan önce de ceza olmaz."]]}, {"reader": false, "ar": [[1826.0, "وأما الشرط الثاني فهو فهمُ النص بمطلق الفهم،"], [1836.0, "بمعنى أن من بلغه النص ولم يفهمه بمطلق الفهم فإن الحجة لا تقوم عليه."], [1846.0, "والفهم عندنا ـ معاشرَ أهل السنة والجماعة ـ ينقسم إلى قسمين:"], [1853.0, "إلى مطلق الفهم، أي بعضه،"], [1856.0, "وإلى الفهم المطلق، أي كلّه."], [1861.0, "والمشترط في قيام الحجة هو مطلق الفهم لا الفهم المطلق."]], "tr": [[1826.0, "İkinci şart ise nassı mutlak bir anlayışla (mutlaku'l-fehm) anlamaktır."], [1836.0, "Yani nas kendisine ulaşan, fakat onu mutlak bir anlayışla anlamayan kimseye hüccet ikame edilmiş olmaz."], [1846.0, "Biz Ehl-i Sünnet ve'l-Cemaat'e göre anlayış iki kısma ayrılır:"], [1846.0, "mutlaku'l-fehm, yani onun bir kısmı;"], [1853.0, "el-fehmü'l-mutlak, yani onun tamamı. Hüccetin ikamesinde şart koşulan ise mutlaku'l-fehmdir (anlayışın bir kısmı), el-fehmü'l-mutlak (tam anlayış) değildir."]]}, {"reader": false, "ar": [[1870.0, "فإذا بلغك النص وفهمته بمطلق الفهم،"], [1879.0, "وعرفت مراد الله عز وجل فيه مطلقَ المعرفة،"], [1883.0, "فإن الحجة قد قامت عليك،"], [1885.0, "وإن لم تفهمه الفهمَ الكامل كفهم أبي بكرٍ وعمر،"], [1889.3, "وفهم المهاجرين والأنصار، أو كفهم العلماء الراسخين؛"], [1893.0, "فإنّ لكلٍّ فهمَه الذي يخصّ معرفته."], [1897.0, "فالمقصود في قيام الحجة هو درجةٌ من درجات الفهم، وليس الفهمَ الكامل."]], "tr": [[1870.0, "Nas sana ulaşır ve onu mutlak bir anlayışla anlar, Allah Teâlâ'nın ondaki muradını mutlak bir bilişle bilirsen, sana hüccet ikame edilmiş olur;"], [1885.0, "Ebû Bekir ve Ömer'in anlayışı, Muhacirler ve Ensar'ın anlayışı ya da râsih âlimlerin anlayışı gibi onu tam olarak anlamamış olsan bile."], [1889.3, "Çünkü herkesin, kendi bilgisine has bir anlayışı vardır."], [1897.0, "Hüccetin ikamesinde kastedilen, anlayış derecelerinden bir derecedir; tam anlayış değildir."]]}, {"reader": false, "ar": [[1904.0, "وبالتفريق بين نوعَي الفهم نعرف أن اختلاف أهل العلم في اشتراط الفهم من عدمه إنما هو خلافٌ لفظي،"], [1917.0, "لأن من اشترط الفهم فإنما يشترط مطلق الفهم،"], [1924.0, "ولكن لا يشترط الفهم المطلق،"], [1928.0, "ومن نفى اشتراط الفهم فإنما ينفي الفهم المطلق لا مطلق الفهم."], [1936.5, "فلا بدّ من التفريق بين المصطلحين،"], [1944.0, "لأن من أهل العلم من ينقل خلافًا في هذه المسألة،"], [1948.6, "في اشتراط الفهم. فإذا جمعنا كلام أهل العلم في هذه المسألة فإننا نجد الفهم الذي يُثبته هؤلاء ليس هو الفهم الذي ينفيه هؤلاء،"], [1960.0, "والفهم الذي ينفيه هؤلاء ليس هو الفهم الذي يُثبته هؤلاء."]], "tr": [[1904.0, "İki anlayış türünü birbirinden ayırarak, ilim ehlinin anlamanın şart olup olmadığı konusundaki ihtilafının sadece lafzî bir ihtilaf olduğunu anlarız."], [1917.0, "Çünkü anlamayı şart koşan, ancak mutlaku'l-fehmi şart koşar, el-fehmü'l-mutlakı şart koşmaz."], [1928.0, "Anlamanın şart olmasını nefyeden de ancak el-fehmü'l-mutlakı nefyeder, mutlaku'l-fehmi değil."], [1936.5, "Bu iki terimi birbirinden ayırmak şarttır;"], [1944.0, "çünkü ilim ehlinden bazıları bu meselede, anlamanın şart olup olmadığı konusunda bir ihtilaf nakleder."], [1948.6, "İlim ehlinin bu meseledeki sözlerini bir araya getirdiğimizde, bunların isbat ettiği anlayışın, şunların nefyettiği anlayış olmadığını;"], [1948.6, "şunların nefyettiği anlayışın da bunların isbat ettiği anlayış olmadığını görürüz."]]}, {"reader": false, "ar": [[1968.0, "وبناءً على ذلك فالإجماع في هذه الكلية واقعٌ في ثلاث مسائل."], [1977.0, "الأولى: أجمع أهل السنة على أن بلوغ الدليل شرطٌ في قيام الحجة."], [1985.0, "انتهينا من البلوغ؟ طيب،"], [1988.0, "أعيده مرةً أخرى: أجمع أهل السنة على أن بلوغ النص شرطٌ في قيام الحجة."], [1998.0, "الثاني: أجمع أهل السنة على أن مطلق الفهم ـ أي بعضه ـ شرطٌ في قيام الحجة؛"], [2011.0, "ولذلك لو بلغت الأدلةُ مجنونًا ليس عنده مطلق الفهم فإن الحجة لا تقوم عليه،"], [2019.0, "أليس كذلك؟ أو سمعت البهيمةُ آيةً فإن الحجة لا تقوم عليها،"], [2026.9, "وليست داخلةً في دائرة التكليف،"], [2029.0, "لأنه ليس عندها مطلق العقل ولا مطلق الفهم التكليفي."]], "tr": [[1968.0, "Buna binaen bu külliyede icma üç meselede gerçekleşmiştir."], [1968.0, "Birincisi: Ehl-i Sünnet, delilin ulaşmasının hüccetin ikamesinde şart olduğu konusunda icma etmiştir."], [1977.0, "Ulaşmayı bitirdik mi? Peki, bir kez daha tekrar edeyim:"], [1988.0, "Ehl-i Sünnet, nassın ulaşmasının hüccetin ikamesinde şart olduğu konusunda icma etmiştir."], [1998.0, "İkincisi: Ehl-i Sünnet, mutlaku'l-fehmin —yani anlayışın bir kısmının— hüccetin ikamesinde şart olduğu konusunda icma etmiştir."], [2011.0, "Bu yüzden deliller, mutlaku'l-fehmi olmayan bir deliye ulaşsa ona hüccet ikame edilmiş olmaz, öyle değil mi?"], [2019.0, "Ya da bir hayvan bir ayet işitse ona hüccet ikame edilmiş olmaz ve o teklif dairesine girmez;"], [2026.9, "çünkü onda ne mutlak akıl ne de teklife esas olan mutlak anlayış vardır."]]}, {"reader": false, "ar": [[2034.0, "الثالث: أجمع أهل السنة على أن الفهم المطلق… من يكمل؟"], [2046.0, "على أن الفهم المطلق ليس شرطًا في قيام الحجة،"], [2050.0, "وهو ما تنصّ عليه كليتُنا."], [2056.0, "فلو تأمّلتموها لوجدتم فيها الشرطين الأوّلين فقط،"], [2062.0, "وهي قولنا: «كلُّ من بلغه الدليل»،"], [2066.0, "وهذا الشرط الأول، أي اشتراط بلوغ النص."], [2069.0, "قوله: «وفهمه بمطلق الفهم»،"], [2074.0, "وهذا يُخرج الفهمَ المطلق،"], [2077.0, "فليس بشرطٍ بإجماع أهل السنة والجماعة. والله أعلم."]], "tr": [[2034.0, "Üçüncüsü: Ehl-i Sünnet, el-fehmü'l-mutlakın… Kim tamamlar?"], [2034.0, "…el-fehmü'l-mutlakın hüccetin ikamesinde şart olmadığı konusunda icma etmiştir."], [2046.0, "Külliyemizin açıkça ifade ettiği de budur."], [2056.0, "Onu düşünürseniz, onda sadece ilk iki şartı bulursunuz:"], [2056.0, "\"Delil kendisine ulaşan herkes\" sözümüz;"], [2062.0, "bu birinci şarttır, yani nassın ulaşmasının şart koşulması."], [2066.0, "\"Ve onu mutlak bir anlayışla anlayan\" sözü ise el-fehmü'l-mutlakı dışarıda bırakır;"], [2074.0, "o, Ehl-i Sünnet ve'l-Cemaat'in icmaıyla şart değildir. Allah en iyisini bilir."]]}]}, {"ts": "34:42", "title": "13. Külliye: Bâtında sahih tevhide dayanmayan zahirî amel bâtıldır", "paras": [{"reader": false, "ar": [[2082.0, "ومن الكليات أيضًا: <b>كلُّ عملٍ في الظاهر لم يُبنَ على توحيدٍ صحيحٍ في الباطن فباطل.<\/b> كلُّ عملٍ في الظاهر لم يُبنَ على توحيدٍ صحيحٍ في الباطن فباطل."], [2097.8, "<span class=\"note\">(يكررها)<\/span> وهذا لا نعلم فيه نزاعًا بين أهل السنة والجماعة."]], "tr": [[2082.0, "Külliyelerden biri de şudur: <b>Bâtında sahih bir tevhid üzerine bina edilmeyen, zahirdeki her amel bâtıldır.<\/b> (Tekrar ediyor.) Bu konuda Ehl-i Sünnet ve'l-Cemaat arasında bir ihtilaf bilmiyoruz."]]}, {"reader": false, "ar": [[2114.0, "لقول الله عز وجل:"], [2115.8, "<span class=\"ayah\">﴿وَقَدِمْنَا إِلَىٰ مَا عَمِلُوا مِنْ عَمَلٍ﴾<\/span> أي في الظاهر <span class=\"ayah\">﴿فَجَعَلْنَاهُ هَبَاءً مَّنثُورًا﴾<\/span> <span class=\"ref\">[الفرقان: ٢٣]<\/span>،"], [2122.0, "لأنه لم يُبنَ على عقيدةٍ وتوحيدٍ صحيحٍ في الباطن."], [2128.0, "فإذا فسد الباطن فسدت أعمال الظاهر."], [2133.0, "ولذلك قال الله عز وجل:"], [2136.6, "<span class=\"ayah\">﴿إِذَا جَاءَكَ الْمُنَافِقُونَ قَالُوا نَشْهَدُ إِنَّكَ لَرَسُولُ اللَّهِ﴾<\/span>،"], [2144.0, "أي شهادةً ظاهريةً بألسنتهم فقط،"], [2147.0, "لكنها لمّا لم تكن مبنيةً على شهادةٍ باطنيةٍ قلبية قال:"], [2160.7, "<span class=\"ayah\">﴿وَاللَّهُ يَعْلَمُ إِنَّكَ لَرَسُولُهُ وَاللَّهُ يَشْهَدُ إِنَّ الْمُنَافِقِينَ لَكَاذِبُونَ﴾<\/span> <span class=\"ref\">[المنافقون: ١]<\/span>."], [2167.0, "فلماذا أكذبهم في الشهادة اللسانية الظاهرة؟"], [2170.0, "لأنها لم تُبنَ على عقيدةٍ صحيحةٍ باطنة."]], "tr": [[2114.0, "Çünkü Allah Teâlâ şöyle buyurmuştur:"], [2115.8, "<span class=\"ayah\">﴿Yaptıkları her amele yöneldik﴾<\/span> —yani zahirdeki (amellerine)— <span class=\"ayah\">﴿ve onu savrulmuş toz hâline getirdik﴾<\/span> [Furkân 23];"], [2115.8, "çünkü o, bâtında sahih bir akîde ve tevhid üzerine bina edilmemişti."], [2122.0, "Bâtın bozulunca zahirin amelleri de bozulur."], [2128.0, "Bu yüzden Allah Teâlâ şöyle buyurmuştur:"], [2136.6, "<span class=\"ayah\">﴿Münafıklar sana geldiklerinde \"Şahitlik ederiz ki sen elbette Allah'ın Resûlüsün\" dediler﴾<\/span>;"], [2136.6, "yani sadece dilleriyle zahirî bir şahitlik."], [2147.0, "Fakat bu, bâtınî ve kalbî bir şahitlik üzerine bina edilmediği için şöyle buyurdu:"], [2160.7, "<span class=\"ayah\">﴿Allah senin elbette O'nun Resûlü olduğunu bilir; Allah şahitlik eder ki münafıklar elbette yalancıdır﴾<\/span> [Münâfikûn 1]."], [2160.7, "Onları zahirî, dille yapılan şahitlikte neden yalanladı?"], [2167.0, "Çünkü o, bâtında sahih bir akîde üzerine bina edilmemişti."]]}, {"reader": false, "ar": [[2176.0, "فكلُّ أعمال الظاهر لا يقبلها الله إلا بعد أن ينظر في صحة العقيدة،"], [2184.0, "كما قال النبي ﷺ: «إن الله تبارك وتعالى لا ينظر إلى صوركم ولا إلى أجسامكم، ولكن ينظر إلى قلوبكم وأعمالكم» <span class=\"note\">(Müslim)<\/span>."], [2194.0, "فإذا اتفق صحةُ الاعتقاد مع صحة العمل في الظاهر قَبِل الله عز وجل العمل."], [2201.0, "وأما إذا كان العمل صحيحًا في الظاهر،"], [2204.0, "مستوفيًا لأركانه وواجباته وشروطه ظاهرًا،"], [2208.0, "لكنه مبنيٌّ على عقيدةٍ وتوحيدٍ فاسدَين،"], [2211.0, "فإن الله لا يقبله."]], "tr": [[2176.0, "Zahirin amellerinin hiçbirini Allah, akîdenin sıhhatine bakmadan kabul etmez."], [2176.0, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [2184.0, "\"Allah Tebâreke ve Teâlâ sizin suretlerinize ve bedenlerinize bakmaz;"], [2184.0, "fakat kalplerinize ve amellerinize bakar.\" <span class=\"note\">(Müslim)<\/span> İtikadın sıhhati zahirde amelin sıhhatiyle bir araya gelince Allah Teâlâ ameli kabul eder."], [2201.0, "Amel zahirde sahih olup rükünlerini, vaciplerini ve şartlarını zahiren tamamlamış olsa da fâsid bir akîde ve tevhid üzerine bina edilmişse, Allah onu kabul etmez."]]}, {"reader": false, "ar": [[2213.0, "ولذلك قال الله عز وجل:"], [2216.0, "<span class=\"ayah\">﴿مَّثَلُ الَّذِينَ كَفَرُوا بِرَبِّهِمْ ۖ أَعْمَالُهُمْ كَرَمَادٍ اشْتَدَّتْ بِهِ الرِّيحُ فِي يَوْمٍ عَاصِفٍ﴾<\/span> <span class=\"ref\">[إبراهيم: ١٨]<\/span> <span class=\"note\">(Şeyh «بربهم» kelimesini okumuyor.)<\/span>،"], [2225.0, "وفي الآية الأخرى: <span class=\"ayah\">﴿كَسَرَابٍ بِقِيعَةٍ يَحْسَبُهُ الظَّمْآنُ مَاءً حَتَّىٰ إِذَا جَاءَهُ لَمْ يَجِدْهُ شَيْئًا﴾<\/span> <span class=\"ref\">[النور: ٣٩]<\/span>،"], [2233.0, "أي جميع ما عمله الكافر لا ينفعه يوم القيامة."], [2237.0, "لماذا؟ لأنه عملٌ ظاهريٌّ لم يُبنَ على عقيدةٍ وتوحيدٍ صحيحَين."], [2242.0, "وقال الله عز وجل:"], [2245.0, "<span class=\"ayah\">﴿وَلَوْ كَانُوا يُؤْمِنُونَ بِاللَّهِ وَالنَّبِيِّ وَمَا أُنزِلَ إِلَيْهِ مَا اتَّخَذُوهُمْ أَوْلِيَاءَ﴾<\/span> <span class=\"ref\">[المائدة: ٨١]<\/span>،"], [2251.0, "فأبطل عملهم في الظاهر بناءً على فساد عقيدتهم في الباطن."]], "tr": [[2213.0, "Bu yüzden Allah Teâlâ şöyle buyurmuştur:"], [2216.0, "<span class=\"ayah\">﴿Rablerini inkâr edenlerin amellerinin durumu, fırtınalı bir günde rüzgârın şiddetle savurduğu kül gibidir﴾<\/span> [İbrâhîm 18]."], [2216.0, "Diğer ayette de: <span class=\"ayah\">﴿Düz arazideki serap gibidir; susamış kimse onu su sanır, nihayet yanına gelince onu hiçbir şey bulamaz﴾<\/span> [Nûr 39]."], [2225.0, "Yani kâfirin yaptığı her şey kıyamet günü ona fayda vermez."], [2233.0, "Neden? Çünkü o, sahih bir akîde ve tevhid üzerine bina edilmemiş zahirî bir ameldir."], [2237.0, "Allah Teâlâ şöyle buyurmuştur: <span class=\"ayah\">﴿Eğer Allah'a, Peygamber'e ve ona indirilene iman etselerdi, onları dost edinmezlerdi﴾<\/span> [Mâide 81]."], [2245.0, "Bâtındaki akîdelerinin bozukluğuna binaen zahirdeki amellerini iptal etti."]]}, {"reader": false, "ar": [[2257.0, "وعلى ذلك قولُ النبي ﷺ:"], [2263.0, "«إنما الأعمالُ» ـ أي الظاهرة ـ «بالنيات» ـ أي بأعمال القلوب ـ <span class=\"note\">(Buhârî, Müslim)<\/span>."], [2268.0, "وقال النبي ﷺ في الصحيحين من حديث النعمان بن بشير:"], [2275.8, "«إن الحلال بيّنٌ وإن الحرام بيّن…» إلى أن قال:"], [2280.0, "«ألا وإن في الجسد مضغةً إذا صلحت» ـ أي صلحت عقيدتها،"], [2285.0, "واستقام توجّهها وقصدها، وسلم إيمانها ـ «صلح الجسد كلُّه، وإذا فسدت فسد الجسد كلُّه، ألا وهي القلب» <span class=\"note\">(Buhârî, Müslim)<\/span>."], [2303.0, "فأعمال الظاهر مبنيةٌ على أعمال الباطن،"], [2307.0, "فلا يقبل الله من العمل الظاهري إلا ما كان مبنيًّا على عقيدةٍ وتوحيدٍ صحيح."]], "tr": [[2257.0, "Nebî ﷺ'in şu sözü de buna dayanır:"], [2263.0, "\"Ameller\" —yani zahirî ameller— \"ancak niyetlere göredir\" —yani kalplerin amellerine göredir."], [2263.0, "<span class=\"note\">(Buhârî, Müslim)<\/span> Nebî ﷺ Sahîhayn'de Nu'mân b."], [2268.0, "Beşîr'den gelen hadiste şöyle buyurmuştur:"], [2275.8, "\"Helal apaçıktır, haram da apaçıktır…\" ve şunu söyleyinceye kadar:"], [2280.0, "\"Dikkat edin! Bedende bir et parçası vardır ki o düzelirse\" —yani akîdesi düzelir, yönelişi ve kastı dosdoğru olur, imanı selamette olursa— \"bütün beden düzelir;"], [2285.0, "o bozulursa bütün beden bozulur."], [2285.0, "Dikkat edin, o kalptir.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Zahirin amelleri bâtının amelleri üzerine kuruludur;"], [2307.0, "Allah zahirî amelden ancak sahih bir akîde ve tevhid üzerine bina edilmiş olanı kabul eder."]]}, {"reader": false, "ar": [[2312.0, "ولذلك لمّا سأل بعضُ الصحابة النبيَّ ﷺ قال:"], [2316.5, "يا رسول الله، ابنُ جُدعان كان يصل الرحم،"], [2320.7, "ويحمل الكَلّ، ويَقري الضيف،"], [2323.0, "فهل ذلك ينفعه؟ ـ أعمالٌ تعبّديةٌ عظيمة ـ قال:"], [2327.7, "«لا ينفعه، إنه لم يقل يومًا: ربِّ اغفر لي خطيئتي يوم الدين» <span class=\"note\">(Müslim)<\/span>،"], [2332.0, "أي لم يُسلم. فجميع أعمال ابن جدعان ـ وإن كانت صحيحةً،"], [2337.3, "وإن كانت جيدةً حسنةً في الظاهر ـ إلا أنها عند الله غير مقبولة،"], [2343.0, "لأنها بُنيت على توحيدٍ فاسدٍ وعلى عقيدةٍ باطلة."]], "tr": [[2312.0, "Bu yüzden sahabeden biri Nebî ﷺ'e sorduğunda şöyle dedi:"], [2312.0, "\"Ey Allah'ın Resûlü! İbn Cüd'ân akrabalık bağını gözetir, düşkünün yükünü taşır, misafiri ağırlardı;"], [2323.0, "bu ona fayda verir mi?\" —Bunlar büyük ibadet türü amellerdir.— Şöyle buyurdu:"], [2327.7, "\"Ona fayda vermez; çünkü o bir gün bile 'Rabbim, din gününde hatamı bağışla' demedi.\" <span class=\"note\">(Müslim)<\/span> Yani Müslüman olmadı."], [2332.0, "İbn Cüd'ân'ın bütün amelleri —zahirde sahih, iyi ve güzel olsalar da— Allah katında makbul değildir;"], [2337.3, "çünkü fâsid bir tevhid ve bâtıl bir akîde üzerine bina edilmişlerdir."]]}, {"reader": false, "ar": [[2347.0, "فهذا أصلٌ عظيمٌ عند أهل السنة والجماعة:"], [2351.0, "أن أعمال الظاهر بينها وبين أعمال القلوب تلازمٌ ظاهرٌ واضح؛"], [2357.0, "فالأصلُ أعمالُ الباطن، والفرعُ والآثارُ أعمالُ الظاهر."], [2364.0, "فالأصل أعمال الباطن، والفروع والآثار هي أعمال الظاهر. والله أعلم."]], "tr": [[2347.0, "Bu, Ehl-i Sünnet ve'l-Cemaat katında büyük bir asıldır:"], [2351.0, "Zahirin amelleri ile kalplerin amelleri arasında açık ve net bir telâzum (birbirini gerektirme) vardır."], [2357.0, "Asıl, bâtının amelleridir; fer' ve eserler ise zahirin amelleridir."], [2364.0, "(Tekrar ediyor.) Allah en iyisini bilir."]]}]}, {"ts": "39:32", "title": "14. Külliye: Hakkın lâzımları haktır", "paras": [{"reader": false, "ar": [[2372.0, "ومن الكليات أيضًا: <b>كلُّ لوازمِ الحقِّ حقّ.<\/b> أقول وبالله التوفيق:"], [2379.1, "هذه كليةٌ واضحةٌ لا تحتاج إلى شرح؛"], [2386.0, "فإن لوازم الحق حق،"], [2388.5, "ولوازم الباطل باطل، ولوازم الكفر كفر،"], [2392.4, "وهكذا. فإن اللوازم تابعةٌ لما تلزم عليه؛"], [2398.0, "فإذا كان ملزومها حقًّا فهي حق،"], [2405.0, "وإذا كان ملزومها باطلًا فإنها باطلة."]], "tr": [[2372.0, "Külliyelerden biri de şudur: <b>Hakkın bütün lâzımları (gerektirdiği sonuçlar) haktır.<\/b> Tevfik Allah'tandır, derim ki:"], [2379.1, "Bu, şerhe ihtiyaç duymayan açık bir külliyedir."], [2386.0, "Hakkın lâzımları haktır, bâtılın lâzımları bâtıldır, küfrün lâzımları küfürdür;"], [2392.4, "ve bu böyle devam eder."], [2392.4, "Çünkü lâzımlar, gerektiği şeye tâbidir:"], [2398.0, "Melzûmu (onu gerektiren şey) hak ise onlar da haktır;"], [2405.0, "melzûmu bâtıl ise onlar da bâtıldır."]]}, {"reader": false, "ar": [[2410.0, "فلا يمكن أن يلزم على الحق باطل،"], [2413.5, "ولا يمكن أن يلزم على الباطل حق،"], [2417.0, "لأن المتقرّر في القواعد أن التابع في الشيء تابعٌ له في الحكم."], [2423.0, "وبناءً على ذلك فالقرآن كله حقٌّ منطوقًا ومفهومًا ولوازمَ،"], [2433.0, "فأيُّ آيةٍ من نصوص القرآن لزم منها عندك شيءٌ من لوازم الباطل فاعلم أنك إنما أُتيتَ من عقلك وسوء فهمك،"], [2444.9, "وأما الدليل في ذاته فلازمه حق."]], "tr": [[2410.0, "Haktan bâtılın gerekmesi mümkün değildir;"], [2410.0, "bâtıldan hakkın gerekmesi de mümkün değildir."], [2413.5, "Çünkü kaidelerde yerleşik olan şudur:"], [2417.0, "Bir şeye tâbi olan, hükümde de ona tâbidir."], [2417.0, "Buna binaen Kur'an'ın tamamı, mantûku (açık ifadesi), mefhûmu ve lâzımları bakımından haktır."], [2423.0, "Kur'an naslarından herhangi bir ayetten sana göre bâtıl lâzımlardan bir şey gerekiyorsa, bil ki sen ancak aklından ve kötü anlayışından dolayı (bu hataya) düşmüşsündür;"], [2433.0, "delilin kendisine gelince, onun lâzımı haktır."]]}, {"reader": false, "ar": [[2447.0, "فالذين يفهمون من قول الله عز وجل:"], [2451.0, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> بعضَ اللوازم الباطلة،"], [2455.0, "فإنما هي لوازم فرضتها شياطينهم وعقولهم الفاسدة،"], [2460.0, "وإلا فالنص لا يلزم عليه أيُّ شيءٍ من الباطل،"], [2464.0, "لأنه حقٌّ في ذاته،"], [2465.3, "وما كان حقًّا في ذاته فيكون حقًّا في لوازمه."], [2468.0, "والذين يفهمون بعض اللوازم الباطلة من قول النبي ﷺ:"], [2475.0, "«ينزل ربنا إلى السماء الدنيا»،"], [2478.0, "فإنه يلزم على هذا النزول عند بعضهم أن يخترق اللهُ السماوات،"], [2483.0, "وأن يكون بعض السماء تُظلّه وبعض السماء تُقلّه؛"], [2487.0, "وهذا اللازم الباطل ليس من اللوازم على هذا النص،"], [2490.0, "لأنه لازمٌ باطل، ولوازم الباطل لا تكون على ملزومٍ هو حقٌّ في ذاته."]], "tr": [[2447.0, "Allah Teâlâ'nın <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> sözünden bazı bâtıl lâzımlar anlayanlar (bilsinler ki) bunlar ancak şeytanlarının ve bozuk akıllarının dayattığı lâzımlardır."], [2460.0, "Yoksa bu nastan bâtıldan hiçbir şey gerekmez;"], [2464.0, "çünkü o bizzat haktır, bizzat hak olan şey lâzımlarında da haktır."], [2465.3, "Nebî ﷺ'in \"Rabbimiz dünya semasına iner\" sözünden bazı bâtıl lâzımlar anlayanlara göre de bu inişten, Allah'ın gökleri delip geçmesi, göğün bir kısmının O'nu gölgelemesi, bir kısmının da O'nu taşıması gerekir."], [2483.0, "Bu bâtıl lâzım bu nassın lâzımlarından değildir;"], [2487.0, "çünkü bâtıl bir lâzımdır ve bâtılın lâzımları, bizzat hak olan bir melzûma ait olmaz."]]}, {"reader": false, "ar": [[2497.0, "وإنما هو لازمٌ فرضه عقلُك لمّا مثّل نزولَ الله عز وجل بنزول خلقه،"], [2503.0, "جعل ما يلزم على هذا ـ أي على نزول الخلق ـ يلزم على هذا ـ أي على نزول الخالق."], [2510.0, "فأيُّ لازمٍ يثيره الشيطان في ذهنك من لوازم الباطل،"], [2515.0, "عند سماع شيءٍ من آيات الصفات،"], [2517.0, "أو عند سماع شيءٍ من آيات إثبات الملائكة،"], [2520.0, "أو عند سماع أيّ شيءٍ من آيات إثبات عذاب القبر ونعيمه،"], [2525.0, "أو عند سماع أيّ نصٍّ من نصوص الأسماء أو القضاء والقدر،"], [2529.0, "اعلم أنه من أطروحة الشيطان،"], [2532.0, "يريد أن يسترقّك بهذه الشبهة،"], [2539.0, "ويسلب عقيدتك الصحيحة بهذه الشبهة."]], "tr": [[2497.0, "O ancak, aklının, Allah Teâlâ'nın inişini mahlûkatının inişine benzettiği zaman dayattığı bir lâzımdır;"], [2503.0, "buna —yani mahlûkun inişine— gereken şeyi, buna —yani Hâlık'ın inişine— de gerekli kıldı."], [2510.0, "Sıfat ayetlerinden bir şeyi, meleklerin varlığını isbat eden ayetlerden bir şeyi, kabir azabını ve nimetini isbat eden ayetlerden herhangi bir şeyi ya da isimler veya kaza ve kader naslarından herhangi bir nassı işittiğinde şeytanın zihninde uyandırdığı bâtıl lâzımlardan her lâzımın, şeytanın ortaya attığı bir iddia olduğunu bil."], [2529.0, "Onunla seni bu şüpheyle köleleştirmek ve bu şüpheyle sahih akîdeni elinden almak ister."]]}, {"reader": false, "ar": [[2542.0, "ولذلك اعتمِدوا في دراسة العقيدة ـ وفقكم الله ـ أن جميع اللوازم التي تلزم على الأدلة،"], [2550.0, "أيًّا كان بابها، لا بدّ وأن تكون حقًّا،"], [2554.0, "وأن أيّ لازمٍ باطلٍ طرأ في ذهني عند سماع شيءٍ من آيات القرآن أو أحاديث السنة،"], [2561.0, "فأنا مباشرةً أستعيذ بالله عز وجل،"], [2563.0, "وأعلم أنني إنما أُتيتُ من قلة فهمي،"], [2567.0, "أو لخطأ نظري في هذا النص."]], "tr": [[2542.0, "Bu yüzden —Allah sizi muvaffak kılsın— akîdeyi öğrenirken şunu esas alın:"], [2542.0, "Babı ne olursa olsun, delillerden gereken bütün lâzımlar mutlaka haktır."], [2550.0, "Kur'an ayetlerinden ya da Sünnet'in hadislerinden bir şey işittiğimde zihnime gelen her bâtıl lâzımda hemen Allah Teâlâ'ya sığınırım ve bilirim ki ben ancak anlayışımın azlığından ya da bu nas hakkındaki bakışımın hatasından dolayı (bu duruma) düştüm."]]}]}, {"ts": "42:50", "title": "15. Külliye: Gayb delilinin sustuğu ayrıntıları araştırmak tenattu'dur", "paras": [{"reader": false, "ar": [[2570.0, "ومن الكليات أيضًا: <b>كلُّ ما سكت عنه دليلُ الغيب من التفاصيل فالبحثُ عنه تنطّع.<\/b> كلُّ ما سكت عنه دليل الغيب من التفاصيل فالبحث عنه تنطّع."]], "tr": [[2570.0, "Külliyelerden biri de şudur: <b>Gayb delilinin hakkında sustuğu ayrıntıların her birini araştırmak tenattu'dur (aşırılıktır).<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2587.0, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أن السلامة لا يعدلها شيء،"], [2607.0, "وإنّ من أعظم السلامة في الأمور الغيبية ألّا تبحث فيها إلا في حدود ما أذن لك الدليلُ فيه فقط،"], [2616.0, "وأما ما سكت الدليل عنه ولم يبيّنه فإن السلامة ألّا تبحث عنه،"], [2623.0, "وألّا تفتح باب النظر فيه مطلقًا."], [2625.0, "فإن جميع من ضلّ في باب الغيب إنما هو الذي سمح لعقله أن يسأل عمّا لم يتكلم الدليل عنه من متعلّقات هذا الغيب."]], "tr": [[2587.0, "Tevfik Allah'tandır, derim ki: Bil —Allah Teâlâ sana rahmet etsin— ki selametin denki yoktur."], [2607.0, "Gaybî işlerde selametin en büyüğü, onlarda ancak delilin sana izin verdiği sınırlar içinde araştırma yapmandır."], [2607.0, "Delilin hakkında sustuğu ve açıklamadığı şeye gelince, selamet onu araştırmaman ve onda düşünme kapısını hiç açmamandır."], [2625.0, "Gayb babında sapan herkes, ancak aklının bu gaybın taalluklarından delilin hakkında konuşmadığı şeyleri sormasına izin veren kimsedir."]]}, {"reader": false, "ar": [[2640.0, "فمتعلّقات الغيبيّ غيبية؛ فكما أننا لا نُثبت أصل الغيب إلا بدليل،"], [2647.0, "فكذلك لا نتكلم في شيءٍ من فروعه وجزئياته ومتعلّقاته إلا بدليل."], [2654.0, "فإياك أن تأخذك نَهمةُ النظر ونهمة حبّ الاطلاع أن تبحث فيما وراء الغيب عن تفاصيل غيبيةٍ لم يهدِك إليها النص،"], [2666.0, "فحينئذٍ سوف ترجع بالضلال والتيه والأسئلة الكثيرة،"], [2672.0, "والتشكيك الموجب للطعن في النص،"], [2674.0, "أو التكذيب به، أو جحده،"], [2676.1, "أو تعطيله، أو إخراجه عن دلالته الصحيحة."], [2679.0, "والسلامة لا يعدلها شيء."]], "tr": [[2640.0, "Gaybî olanın taallukları da gaybîdir."], [2640.0, "Gaybın aslını ancak delille isbat ettiğimiz gibi, onun fer'lerinden, cüz'lerinden ve taalluklarından herhangi bir şey hakkında da ancak delille konuşuruz."], [2654.0, "Sakın düşünme hırsı ve merak hırsı seni, gaybın ötesinde, nassın sana yol göstermediği gaybî ayrıntıları araştırmaya sürüklemesin."], [2666.0, "O zaman sapıklıkla, şaşkınlıkla, bir sürü soruyla ve nassı ta'n etmeyi, onu yalanlamayı, inkâr etmeyi, ta'til etmeyi ya da sahih delâletinden çıkarmayı gerektiren şüpheyle geri dönersin. Selametin denki yoktur."]]}, {"reader": false, "ar": [[2682.0, "ولذلك قال الله عز وجل:"], [2683.0, "<span class=\"ayah\">﴿لَا تَسْأَلُوا عَنْ أَشْيَاءَ إِن تُبْدَ لَكُمْ تَسُؤْكُمْ﴾<\/span> <span class=\"ref\">[المائدة: ١٠١]<\/span>،"], [2687.0, "وأدخل العلماء في هذا النهي السؤالَ عن التفاصيل الغيبية التي لم يثبت بشأنها نصٌّ خاص."], [2694.0, "ويقول الله عز وجل:"]], "tr": [[2682.0, "Bu yüzden Allah Teâlâ şöyle buyurmuştur:"], [2683.0, "<span class=\"ayah\">﴿Size açıklandığında hoşunuza gitmeyecek şeyleri sormayın﴾<\/span> [Mâide 101]."], [2683.0, "Âlimler, hakkında özel bir nas sabit olmayan gaybî ayrıntıları sormayı da bu yasağın içine dâhil etmişlerdir. Allah Teâlâ şöyle buyurur:"]]}]}, {"ts": "45:03", "title": "15. Külliye (devam): Allah hakkında bilgisizce konuşmak", "paras": [{"reader": false, "ar": [[2697.1, "<span class=\"ayah\">﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ﴾<\/span> <span class=\"ref\">[الإسراء: ٣٦]<\/span>."], [2705.0, "وتلك التفاصيل الغيبية مهما أعملتَ عقلك فيها فلن تصل فيها إلى نتيجة،"], [2709.0, "لأن الله أخفاها عن مدركات عقلك؛"], [2711.0, "فإذًا قَفْوُك لها قفوٌ لِما ليس لك به علم،"], [2716.7, "وهذا منهيٌّ عنه. وكلُّ من قفا تفصيلَ غيبٍ بلا برهانٍ فلا بدّ وأن يقول على الله بلا علم،"], [2725.0, "والقولُ على الله بلا علمٍ من أعظم الكبائر ومن أشدّ المحرّمات."]], "tr": [[2697.1, "<span class=\"ayah\">﴿Hakkında bilgin olmayan şeyin ardına düşme﴾<\/span> [İsrâ 36]."], [2697.1, "O gaybî ayrıntılarda aklını ne kadar çalıştırırsan çalıştır bir sonuca ulaşamazsın;"], [2705.0, "çünkü Allah onları aklının idrak alanından gizlemiştir."], [2709.0, "O hâlde senin onların ardına düşmen, hakkında bilgin olmayan şeyin ardına düşmektir ve bu yasaklanmıştır."], [2716.7, "Burhansız olarak bir gayb ayrıntısının ardına düşen herkes, mutlaka Allah hakkında bilgisizce konuşur."], [2716.7, "Allah hakkında bilgisizce konuşmak ise büyük günahların en büyüklerinden ve haramların en şiddetlilerindendir."]]}, {"reader": false, "ar": [[2730.0, "لقول الله عز وجل في بيان المحرّمات على سبيل الأعظمية:"], [2734.0, "<span class=\"ayah\">﴿وَأَن تَقُولُوا عَلَى اللَّهِ مَا لَا تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ٣٣]<\/span>."], [2737.0, "ويقول الله عز وجل:"], [2739.0, "<span class=\"ayah\">﴿وَلَا تَقُولُوا لِمَا تَصِفُ أَلْسِنَتُكُمُ الْكَذِبَ هَٰذَا حَلَالٌ وَهَٰذَا حَرَامٌ لِّتَفْتَرُوا عَلَى اللَّهِ الْكَذِبَ﴾<\/span> <span class=\"ref\">[النحل: ١١٦]<\/span>."], [2747.0, "وإنّ القول على الله بلا علمٍ من أعظم مقاصد الشيطان فينا،"], [2754.0, "لقول الله عز وجل عن أعظم مقاصد الشيطان:"], [2759.0, "<span class=\"ayah\">﴿إِنَّمَا يَأْمُرُكُم بِالسُّوءِ وَالْفَحْشَاءِ﴾<\/span> وإيش؟"], [2764.0, "<span class=\"ayah\">﴿وَأَن تَقُولُوا عَلَى اللَّهِ مَا لَا تَع
