<script>
const D={"no": 57, "vid": "PZMx3iQR3Sg", "title_ar": "الدرس (٥٧) من شرح كليات العقيدة — من كليات الكرامات", "title_tr": "Şerhu Külliyyâti'l-Akîde — 57. Ders: Kerâmet Külliyeleri (Kudret ve Te'sîr Kerâmeti, Kerâmete Delilsiz Lâzımlar Yüklemek, Sahih Yolla Sabit Olmayan Kerâmetler, Kerâmet İstemek, Hârikaya Güç Yetirdiğini İddia Eden, Kerâmetin Cinsini İnkâr, Kalbe Atılan Hak, Sadık Rüya, Kerâmetin Şükrü)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Hakka yardımcı olan ve başkasının âdeten güç yetiremediği bir şeye güç yetiren herkes için bu kerâmettir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.0, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.1, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.7, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [10.7, "أمّا بعد: فلا نزال في الكلّيّات التي تتكلّم عن المعجزات والكرامات،"], [16.4, "ونبدأ مستعينين بالله عز وجل فيما بقي من شرح هذه الكلّيّات."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.0, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [11.8, "Bundan sonra: Hâlâ mucizeler ve kerâmetlerden bahseden külliyeler içindeyiz."], [15.9, "Allah Azze ve Celle'den yardım dileyerek bu külliyelerin şerhinden geri kalan kısma başlıyoruz."]]}, {"reader": false, "ar": [[22.0, "الكلّيّة الأولى: <b>كلُّ من قدر على ما لا يقدر عليه غيرُه من الأمور المُعينة على الحقّ عادةً فكرامة.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثانية:"], [54.0, "<b>كلُّ من قدر على ما لا يقدر عليه غيرُه من الأمور المُعينة على الحقّ عادةً فكرامة.<\/b>"]], "tr": [[22.0, "1. külliye: <b>1. külliye: Hakka yardımcı olan işlerden, başkasının âdeten güç yetiremediği bir şeye güç yetiren herkes için bu, kerâmettir.<\/b> (Tekrar ediyor.) İkinci kez tekrar ediyorum:"], [54.0, "<b>1. külliye: Hakka yardımcı olan işlerden, başkasının âdeten güç yetiremediği bir şeye güç yetiren herkes için bu, kerâmettir.<\/b>"]]}, {"reader": false, "ar": [[63.0, "أقول وبالله التوفيق: المتقرِّر في قواعد أهل السنّة والجماعة أنّ الكرامة تنقسم إلى نوعين:"], [72.0, "إلى كرامةٍ في المكاشفات،"], [74.7, "وقد شرحناها في كلّيّةٍ ماضية،"], [78.0, "وإلى كرامةٍ في القدرة والتأثيرات."], [81.0, "وهذه الكلّيّة تتكلّم عن النوع الثاني من أنواع الكرامات،"], [87.0, "وهي الكرامة بمعنى القدرة والتأثير."], [91.0, "وخلاصتها: أنّ الله عز وجل قد يُجري على يد أحدٍ من أوليائه شيئًا من القدرة التي لا يستطيعها غيرُه،"], [99.0, "ولكن لا بدّ أن تكون تلك القدرة مُعينةً له على الحقّ،"], [105.0, "وأنّ غيرَه لا يستطيعها في الزمنيّة التي أقدر الله عز وجل عليها هذا الوليَّ،"], [112.0, "وإن كان في الزمنيّة التي بعده قد يقدر عليها غيرُه،"], [118.0, "لكنّها تُوصَف بأنها كرامةٌ باعتبار زمانيّته."]], "tr": [[63.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşik olan şudur:"], [70.1, "Kerâmet iki türe ayrılır: Mükâşefâtta (keşiflerde) kerâmet —bunu geçmiş bir külliyede şerh ettik— ve kudret ve te'sîrlerde kerâmet."], [82.3, "Bu külliye kerâmet türlerinden ikincisinden, yani kudret ve te'sîr anlamındaki kerâmetten bahseder."], [91.4, "Özeti şudur: Allah Azze ve Celle velîlerinden birinin eliyle başkasının güç yetiremediği bir kudret ortaya çıkarabilir."], [98.6, "Fakat bu kudretin onun hakka yardımcısı olması ve Allah Azze ve Celle'nin bu velîye güç verdiği zaman diliminde başkasının ona güç yetirememesi gerekir."], [111.5, "Kendisinden sonraki zaman diliminde başkası ona güç yetirebilse bile, o, kendi zamanı itibarıyla kerâmet olarak nitelenir."]]}, {"reader": false, "ar": [[123.0, "ويُمثَّل لذلك بعدّة أمثلة:"], [127.0, "المثال الأول: ذو القرنين."], [130.0, "وقد اختلف أهلُ العلم في نبوّته من عدمها،"], [134.0, "والأصحّ الذي عليه جمهورُ أهل العلم أنه ملكٌ صالح،"], [139.2, "ولكن ليس بنبيّ، وقد نصّ على ذلك جمعٌ من أصحاب النبيّ صلى الله عليه وسلم."], [145.0, "فذو القرنين المذكور في سورة الكهف كان مَلِكًا من ملوك الأرض،"], [151.0, "وعبدًا صالحًا مسلمًا، أقام الله عز وجل به دينَه في أطراف الأرض من ها هنا وها هنا."], [158.9, "فقد طاف الأرضَ يدعو إلى الإسلام،"], [161.8, "ويقاتل عليه من خالفه،"], [164.0, "فنشر الإسلامَ، وقمع الكفرَ وأهلَه،"], [167.6, "وأعان المظلوم، وأقام العدل."], [170.0, "وهذه كلُّها كرامات، وهذه كلُّها تُعتبر كراماتٍ بأنواع القدرة والتأثير."]], "tr": [[123.0, "Buna birkaç örnek verilir. Birinci örnek:"], [127.8, "Zülkarneyn. İlim ehli onun nebî olup olmadığı konusunda ihtilaf etmiştir."], [133.0, "İlim ehlinin cumhurunun görüşü olan en sahih görüş, onun sâlih bir hükümdar olduğu, fakat nebî olmadığıdır."], [141.3, "Peygamber sallallâhu aleyhi ve sellem'in ashâbından bir topluluk bunu açıkça söylemiştir."], [145.0, "Kehf sûresinde zikredilen Zülkarneyn, yeryüzü hükümdarlarından bir hükümdar ve sâlih, Müslüman bir kuldu."], [151.6, "Allah Azze ve Celle onunla dinini yeryüzünün dört bir tarafında ayakta tuttu."], [157.1, "Yeryüzünü dolaştı, İslâm'a davet ediyor ve ona muhalefet edenle bunun için savaşıyordu."], [161.8, "İslâm'ı yaydı, küfrü ve ehlini bastırdı, mazluma yardım etti ve adaleti ikame etti."], [169.7, "Bunların hepsi kerâmettir; bunların hepsi kudret ve te'sîr türlerinden kerâmetler sayılır."]]}, {"reader": false, "ar": [[179.0, "ولذلك قال الله عز وجل مبيِّنًا هذه الكرامة:"], [183.0, "<span class=\"ayah\">﴿ثُمَّ أَتْبَعَ سَبَبًا﴾<\/span> <span class=\"ref\">[الكهف: ٨٩]<\/span>، <span class=\"ayah\">﴿وَآتَيْنَاهُ مِن كُلِّ شَيْءٍ سَبَبًا﴾<\/span> <span class=\"ref\">[الكهف: ٨٤]<\/span>."], [191.0, "قال الله عز وجل:"], [192.3, "<span class=\"ayah\">﴿وَآتَيْنَاهُ مِن كُلِّ شَيْءٍ سَبَبًا﴾<\/span> <span class=\"ref\">[الكهف: ٨٤]<\/span>،"], [194.0, "«فأتبع»، <span class=\"ayah\">﴿ثُمَّ أَتْبَعَ سَبَبًا﴾<\/span> <span class=\"ref\">[الكهف: ٨٩]<\/span>."], [198.0, "فهذا نوعُ كرامةٍ أجراها الله عز وجل على يد هذا الملك الصالح،"], [203.0, "حتى أملكه الله عز وجل أطرافَ الأرض من ها هنا وها هنا،"], [208.0, "في زمنيّةٍ لا يقدر عادةً الملوكُ على مثل ما أقدر الله عز وجل عليه ذا القرنين."], [216.0, "وقد استعان ذو القرنين بهذه الكرامة من الله عز وجل على نشر الحقّ،"], [223.0, "وكانت مُعينةً له على نشر دين الله عز وجل."]], "tr": [[179.0, "Bu sebeple Allah Azze ve Celle bu kerâmeti açıklayarak şöyle buyurdu:"], [183.0, "<span class=\"ayah\">﴿Sonra yine bir yol tuttu﴾<\/span> [Kehf 89], <span class=\"ayah\">﴿Ona her şeyden bir sebep (yol) verdik﴾<\/span> [Kehf 84]."], [192.3, "Allah Azze ve Celle şöyle buyurdu:"], [194.0, "<span class=\"ayah\">﴿Ona her şeyden bir sebep (yol) verdik﴾<\/span> [Kehf 84], \"O da tuttu\", <span class=\"ayah\">﴿Sonra yine bir yol tuttu﴾<\/span> [Kehf 89]."], [202.2, "Bu, Allah Azze ve Celle'nin bu sâlih hükümdarın eliyle gerçekleştirdiği bir tür kerâmettir;"], [206.8, "öyle ki Allah Azze ve Celle onu yeryüzünün dört bir tarafına hükümdar kıldı."], [211.0, "Hem de hükümdarların âdeten, Allah Azze ve Celle'nin Zülkarneyn'e güç verdiği şeyin benzerine güç yetiremediği bir zaman diliminde."], [217.6, "Zülkarneyn, Allah Azze ve Celle'den gelen bu kerâmetten hakkı yaymak için yardım aldı;"], [223.0, "bu kerâmet, Allah Azze ve Celle'nin dinini yaymada onun yardımcısı oldu."]]}, {"reader": false, "ar": [[227.0, "وأمّا ما يتوارد على ألسنة البعض أنّ ذا القرنين هو الإسكندرُ المقدونيّ،"], [233.1, "باني الإسكندريّة، الذي غزا الصينَ والهندَ وبلادَ الترك،"], [237.8, "وقهر مَلِكَ الفرس واستولى على مملكته،"], [238.4, "وقهر ملكَ الفرس واستولى على مملكته،"], [243.0, "فهذا قولٌ باطلٌ مردود."]], "tr": [[227.0, "Bazılarının dilinde dolaşan, Zülkarneyn'in, İskenderiye'yi kuran, Çin'e, Hindistan'a ve Türk diyarına sefer düzenleyen, Fars hükümdarını yenip onun memleketini ele geçiren —Fars hükümdarını yenip memleketini ele geçiren— Makedonyalı İskender olduğu görüşüne gelince;"], [241.1, "bu bâtıl ve reddedilmiş bir görüştür."]]}, {"reader": false, "ar": [[249.0, "ومن الأمثلة أيضًا على هذه الكلّيّة:"], [251.8, "ما حصل لمريم رضي الله تعالى عنها حين حملت بعيسى ابن مريم صلى الله عليه وسلم:"], [259.0, "<span class=\"ayah\">﴿فَأَجَاءَهَا الْمَخَاضُ إِلَىٰ جِذْعِ النَّخْلَةِ﴾<\/span> <span class=\"ref\">[مريم: ٢٣]<\/span>،"], [262.0, "وجلست على هذا الجذع،"], [263.6, "فقالت: <span class=\"ayah\">﴿يَا لَيْتَنِي مِتُّ قَبْلَ هَٰذَا وَكُنتُ نَسْيًا مَّنسِيًّا ۝ فَنَادَاهَا مِن تَحْتِهَا أَلَّا تَحْزَنِي قَدْ جَعَلَ رَبُّكِ تَحْتَكِ سَرِيًّا ۝ وَهُزِّي إِلَيْكِ بِجِذْعِ النَّخْلَةِ تُسَاقِطْ عَلَيْكِ رُطَبًا جَنِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٢٣–٢٥]<\/span>."], [278.0, "ووجهُ الكرامة في هذا قولُ الله عز وجل:"], [281.0, "<span class=\"ayah\">﴿وَهُزِّي إِلَيْكِ بِجِذْعِ النَّخْلَةِ﴾<\/span> <span class=\"ref\">[مريم: ٢٥]<\/span>،"], [284.0, "وهي امرأةٌ ماخِض، تهزّ بجذع النخلة فيهتزّ فرعُها."], [289.0, "ومن المعلوم أنّ الهزّ بجذع النخلة حسب العادة لا يمكن أن يهتزّ به فرعُ النخلة،"], [298.0, "لكن اهتزّ فرعُ النخلة وتساقط منه الرُّطَبُ الجنيّ."]], "tr": [[249.0, "Bu külliyenin örneklerinden biri de Meryem'in —Allah ondan razı olsun— Meryem oğlu İsa sallallâhu aleyhi ve sellem'e hamile kaldığında başına gelendir:"], [256.8, "<span class=\"ayah\">﴿Doğum sancısı onu bir hurma ağacının gövdesine (dayanmaya) sevk etti﴾<\/span> [Meryem 23]."], [261.4, "O gövdenin yanına oturdu ve şöyle dedi:"], [264.0, "<span class=\"ayah\">﴿Keşke bundan önce ölseydim de unutulup gitmiş olsaydım! Bunun üzerine (Cebrail) aşağısından ona şöyle seslendi: Üzülme, Rabbin senin alt yanında bir su arkı akıttı. Hurma dalını kendine doğru silkele, üzerine taze, olgun hurma dökülsün﴾<\/span> [Meryem 23–25]."], [279.1, "Bunda kerâmet yönü Allah Azze ve Celle'nin şu sözüdür:"], [283.2, "<span class=\"ayah\">﴿Hurma dalını kendine doğru silkele﴾<\/span> [Meryem 25]."], [286.0, "O, doğum sancısı çeken bir kadındır;"], [289.6, "hurmanın gövdesini sarsıyor ve dalları sallanıyor."], [292.6, "Bilindiği gibi âdete göre hurmanın gövdesini sarsmakla hurmanın dalları sallanamaz."], [297.4, "Fakat hurmanın dalları sallandı ve ondan taze olgun hurma döküldü."]]}]}, {"ts": "05:03", "title": "1. Külliye (devam): Meryem, Ashâb-ı Kehf, Kitaptan ilmi olan kişi, âlimlere verilen ilim ve te'lif gücü", "paras": [{"reader": false, "ar": [[303.0, "والنخلةُ لا شكّ أنها فوق قامة الإنسان."], [307.0, "فمثلُ هذه القدرة أجراها الله عز وجل على يد هذه الصالحة الزكيّة البتول،"], [315.0, "إظهارًا لشرفها، وتأييدًا لها،"], [318.1, "ونصرةً لها؛ فأقدرها الله عز وجل على أمرٍ لا يقدر عليه أهلُ زمانها عادةً،"], [326.0, "واستعانت به على الحقّ."]], "tr": [[303.0, "Hurma ağacı şüphesiz insan boyunun üstündedir."], [305.9, "Allah Azze ve Celle bu kudreti, bu sâlih, temiz, iffetli (Betûl) kadının eliyle, onun şerefini göstermek, onu desteklemek ve ona yardım etmek için gerçekleştirdi."], [318.8, "Allah Azze ve Celle ona, zamanının insanlarının âdeten güç yetiremediği bir şeye güç verdi;"], [325.0, "o da bununla hakka yardım aldı."]]}, {"reader": false, "ar": [[328.0, "ومن ذلك أيضًا كرامةُ أهل الكهف،"], [332.0, "وهي ذلك النومُ الطويل الذي أجراه الله عز وجل عليهم،"], [338.0, "في زمنيّةٍ قال الله عز وجل عنها:"], [340.8, "<span class=\"ayah\">﴿وَلَبِثُوا فِي كَهْفِهِمْ ثَلَاثَ مِائَةٍ سِنِينَ وَازْدَادُوا تِسْعًا﴾<\/span> <span class=\"ref\">[الكهف: ٢٥]<\/span>."], [345.0, "وهذه قدرةٌ على النوم لا يستطيعها أهلُ زمانهم،"], [350.0, "ولا من قبلهم، ولا من بعدهم،"], [353.0, "وكانت من أعظم ما أعانهم على الحقّ لمّا فرّوا بدينهم من سُلطة قومهم."]], "tr": [[328.0, "Bundan biri de Ashâb-ı Kehf'in kerâmetidir."], [331.3, "Bu, Allah Azze ve Celle'nin onlara verdiği o uzun uykudur;"], [336.8, "Allah Azze ve Celle o süre hakkında şöyle buyurmuştur:"], [340.0, "<span class=\"ayah\">﴿Mağaralarında üç yüz yıl kaldılar, dokuz yıl da eklediler﴾<\/span> [Kehf 25]."], [345.0, "Bu, ne zamanlarının insanlarının ne onlardan öncekilerin ne de sonrakilerin güç yetirebildiği bir uyku kudretidir."], [352.5, "Kavimlerinin tahakkümünden dinlerini koruyarak kaçtıklarında, onlara hak üzere en büyük yardımı sağlayan şeylerden biri buydu."]]}, {"reader": false, "ar": [[362.0, "ومنها أيضًا كرامةُ الذي آتاه الله عز وجل علمًا من الكتاب،"], [367.5, "المذكور في قصّة سليمان عليه الصلاة والسلام:"], [371.0, "<span class=\"ayah\">﴿قَالَ الَّذِي عِندَهُ عِلْمٌ مِّنَ الْكِتَابِ أَنَا آتِيكَ بِهِ قَبْلَ أَن يَرْتَدَّ إِلَيْكَ طَرْفُكَ﴾<\/span> <span class=\"ref\">[النمل: ٤٠]<\/span>،"], [377.0, "بغضّ النظر عن نوعيّته:"], [379.7, "هل كان إنسيًّا أو جنّيًّا،"], [383.0, "لكنّه من عباد الله الذين أجرى الله عز وجل على أيديهم شيئًا من القدرة التأثيريّة."], [390.0, "فإنّ مثل هذه السرعة في المجيء بهذا العرش العظيم في تلك المسافات الشاسعة لا يقدر عليه أهلُ زمانهم،"], [399.0, "فهي من جملة الكرامات."]], "tr": [[362.0, "Bunlardan biri de Süleyman aleyhisselâm kıssasında zikredilen, Allah Azze ve Celle'nin kendisine kitaptan bir ilim verdiği kişinin kerâmetidir:"], [371.0, "<span class=\"ayah\">﴿Kitaptan bir ilmi olan kişi dedi ki: Ben onu, gözünü açıp kapamadan önce sana getiririm﴾<\/span> [Neml 40]."], [379.0, "Onun ne olduğuna —insan mı cin mi olduğuna— bakmaksızın, o, Allah Azze ve Celle'nin elleriyle bir miktar te'sîr kudreti gerçekleştirdiği kullarından biridir."], [390.9, "Bu büyük tahtı o uzak mesafelerden bu süratle getirmeye, onların zamanının insanları güç yetiremez;"], [397.8, "dolayısıyla bu da kerâmetler cümlesindendir."]]}, {"reader": false, "ar": [[401.0, "بل ومنها ما يفتحه الله عز وجل على بعض أهل العلم من العلوم التي تُعتبر كثيرةً في زمنيّةٍ يسيرة،"], [410.0, "أو يُقدِر الله عز وجل بعضَ العلماء على التأليف في زمنيّةٍ لا يستطيع غيرُه أن يؤلّف مؤلّفاتِه فيها،"], [419.0, "أو أن يستجمع علومًا لا يستطيع غيرُه في زمنيّته أن يستجمع مثلَها،"], [425.0, "كما هو المأثور عن أبي العبّاس ابن تيميّة رحمه الله تعالى؛"], [429.0, "فإنّ الله عز وجل قد فتح عليه من علم المنقول والمعقول والمؤلَّفات ما لم يستطعه غيرُه من علماء أهل زمانه."], [439.0, "فهذا نوعُ كرامة، لكنّه مشروطٌ بما ذكرتُه لكم في الكلّيّة:"], [446.0, "أنه لا بدّ أن يكون مُعينًا للإنسان على الحقّ."]], "tr": [[401.0, "Hatta bunlardan biri de Allah Azze ve Celle'nin bazı ilim ehline kısa bir zaman diliminde çok sayılan ilimleri açmasıdır."], [411.0, "Ya da Allah Azze ve Celle bazı âlimlere, başkasının o eserleri yazamayacağı bir zaman diliminde te'lif gücü verir;"], [421.0, "veya onun zamanında başkasının benzerini toplayamayacağı ilimleri toplamasını sağlar."], [425.7, "Ebü'l-Abbâs İbn Teymiyye'den —Allah ona rahmet etsin— rivayet edilen budur:"], [429.7, "Allah Azze ve Celle ona menkûl ve ma'kûl ilminden ve eserlerden, zamanının âlimlerinden başkasının güç yetiremediği şeyleri açmıştır."], [440.4, "Bu bir tür kerâmettir; fakat size külliyede zikrettiğim şarta bağlıdır:"], [447.3, "İnsanın hakka yardımcısı olması gerekir."]]}, {"reader": false, "ar": [[450.0, "وإنّكم ترون أنّ أناسًا يحملون أثقالًا لا يحملها غيرُهم،"], [455.0, "لكن حملُ الأثقال ليس لهم منفعةٌ دينيّة،"], [458.5, "وليس ممّا يُعين على الحقّ."], [461.0, "وقد يعطي الله عز وجل بعضَ الناس قدرةً في أن يصرع غيرَه،"], [467.0, "أو يصرع المجموعةَ الكبيرة،"], [469.0, "لكنّها أمورٌ لا تُعين على الحقّ."], [472.0, "فليس كلُّ من أقدره الله عز وجل على ما لم يقدر عليه غيرُه تكون كرامة،"], [479.0, "إلا إذا نظرنا: هل كانت مُعينةً له على الحقّ،"], [482.0, "أو مُعينةً له على الباطل؟"], [485.0, "فإن كانت مُعينةً له على الحقّ فلا جرمَ أنّنا نصفها بأنها كرامة،"], [490.0, "وإن كانت مُعينةً له على الباطل فلا جرمَ أنّنا نصفها بأنها من مخاريق الأبالسة أو الاستدراج،"], [497.0, "وإن كانت غيرَ مُعينةٍ لا على هذا ولا على هذا فتبقى من الأمور التي لا تُوصَف بأنها كرامة. والله أعلم."]], "tr": [[450.0, "Görüyorsunuz ki bazı insanlar başkalarının kaldıramadığı ağırlıkları kaldırıyor;"], [454.4, "fakat ağırlık kaldırmanın onlar için dinî bir faydası yoktur ve hakka yardımcı olan şeylerden değildir."], [463.0, "Allah Azze ve Celle bazı insanlara başkasını, hatta büyük bir grubu yere serme gücü de verebilir;"], [471.5, "fakat bunlar hakka yardımcı olmayan şeylerdir."], [473.7, "Dolayısıyla Allah Azze ve Celle'nin başkasının güç yetiremediği bir şeye güç verdiği herkes için bu kerâmet olmaz;"], [482.6, "ancak (şuna) bakarız: Bu, onun hakka mı yardımcısıydı, bâtıla mı?"], [487.5, "Eğer hakka yardımcısı idiyse şüphesiz onu kerâmet olarak niteleriz."], [492.5, "Eğer bâtıla yardımcısı idiyse şüphesiz onu iblislerin hileli hârikalarından veya istidrâçtan sayarız."], [498.0, "Eğer ne buna ne ona yardımcı değilse, kerâmet olarak nitelenmeyen işlerden kalır. Allah en iyisini bilir."]]}]}, {"ts": "08:27", "title": "2. Külliye: Kerâmette şer'an lâzım olmayan bir şeyi lâzım tutan herkes bâtılı söylemiştir", "paras": [{"reader": false, "ar": [[507.0, "ومن الكلّيّات أيضًا: <b>كلُّ من التزم في الكرامة ما ليس بلازمٍ شرعًا فقائلٌ بالباطل.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [528.0, "<b>كلُّ من التزم في الكرامة ما ليس بلازمٍ شرعًا فقائلٌ بالباطل.<\/b>"]], "tr": [[507.0, "Külliyelerden biri de şudur: 2."], [510.3, "külliye: Kerâmette şer'an lâzım olmayan bir şeyi lâzım tutan herkes bâtılı söylemiştir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [528.0, "<b>2. külliye: Kerâmette şer'an lâzım olmayan bir şeyi lâzım tutan herkes bâtılı söylemiştir.<\/b>"]]}, {"reader": false, "ar": [[535.0, "أقول وبالله التوفيق: وذلك لأنّ من الناس من يجعل لظهور الكرامة على يد الوليّ لوازمَ شرعيّة،"], [544.0, "فإذا طلبنا منه الدليلَ على هذا اللازم لم يأتِنا بدليل."], [551.0, "فقرّر أهلُ السنّة والجماعة هذه الكلّيّة:"], [554.6, "بأنّ الكرامة لا يجوز أن نجعل لها لوازمَ معيّنة،"], [560.0, "تثبت هذه اللوازم بثبوتها وتنتفي بانتفائها،"], [565.0, "إلا وعلى هذا التلازم دليلٌ من الشرع؛"], [569.0, "ولأنّ المتقرِّر في القواعد أنّ كلَّ من التزم ما ليس بلازمٍ شرعًا ولا قدرًا فقائلٌ بالباطل."]], "tr": [[535.0, "Tevfik Allah'tandır, derim ki: Bu böyledir;"], [538.9, "çünkü insanlardan bazıları kerâmetin velînin elinde zuhur etmesine şer'î lâzımlar (zorunlu sonuçlar) bağlar;"], [544.0, "ondan bu lâzımın delilini istediğimizde bize delil getiremez."], [548.9, "Ehl-i Sünnet ve'l-Cemaat bu külliyeyi şöyle takrir etti:"], [554.0, "Kerâmete, onun sübûtuyla sabit olan ve yokluğuyla ortadan kalkan belirli lâzımlar bağlamamız caiz değildir;"], [561.5, "ancak bu telâzum (karşılıklı gereklilik) üzerine şeriattan bir delil varsa (caizdir)."], [568.4, "Bir de kaidelerde yerleşik olan şudur:"], [570.4, "Şer'an ve kader bakımından lâzım olmayan bir şeyi lâzım tutan herkes bâtılı söylemiştir."]]}, {"reader": false, "ar": [[575.0, "وقد فرض بعضُ الناس ـ أو بعضُ الطوائف ـ على من ظهرت على يديه الكرامةُ جُمَلًا من اللوازم التي ليس عليها دليل."], [587.0, "فمن ذلك قولهم: إنّ الكرامة من لوازم الولاية،"], [592.0, "فيجعلون الكرامةَ دليلًا على الولاية،"], [598.0, "وهذا ليس بصحيح، بل الولايةُ دليلٌ على الكرامة."]], "tr": [[575.0, "Bazı insanlar —veya bazı fırkalar— elinde kerâmet zuhur eden kimseye, üzerinde hiçbir delil bulunmayan birtakım lâzımlar yüklemişlerdir."], [586.6, "Bunlardan biri şu sözleridir: \"Kerâmet velâyetin lâzımlarındandır.\" Böylece kerâmeti velâyete delil yaparlar."], [598.0, "Bu doğru değildir; bilakis velâyet kerâmete delildir."]]}]}, {"ts": "10:03", "title": "2. Külliye (devam): Kerâmete yüklenen bâtıl lâzımlar", "paras": [{"reader": false, "ar": [[603.0, "وإيّاكم أن تعكسوا الأمر!"], [605.0, "فيذهب طائفةٌ من الصوفيّة إلى أنّ من ظهرت على يديه الكراماتُ فإنه محكومٌ بأنه وليٌّ من أولياء الله،"], [615.0, "وهذا ليس بصحيح. فليس وقوعُ الخارق أمرًا لازمًا للوليّ؛"], [623.0, "فكم من الأولياء الصادقين من الصحابة فمن بعدهم لم تقع لهم خوارقُ أبدًا!"], [631.0, "وكم من السحرة والمبطلين ممّن وقعت لهم خوارقُ كثيرة!"], [636.0, "ولا شكّ أنّ الخوارق ابتلاءٌ للعبد من جنس النِّعَم،"], [640.0, "وليس حصولُها برهانًا على فضل الرجل عند الله عز وجل، كما سيأتينا."]], "tr": [[603.0, "Sakın meseleyi tersine çevirmeyin! Sûfîlerden bir grup, elinde kerâmetler zuhur eden kimsenin Allah'ın velîlerinden bir velî olduğuna hükmedildiği görüşüne gider;"], [612.7, "bu doğru değildir. Hârikanın vuku bulması velî için lâzım bir şey değildir."], [620.1, "Sahâbe ve onlardan sonrakilerden nice sâdık velî vardır ki onlara hiç hârika vuku bulmamıştır!"], [629.8, "Sihirbazlardan ve bâtıl ehlinden nicelerine de pek çok hârika vuku bulmuştur!"], [635.4, "Şüphesiz hârikalar, kul için nimetler cinsinden bir imtihandır;"], [639.1, "ileride geleceği gibi bunların meydana gelmesi, kişinin Allah Azze ve Celle katındaki faziletine delil değildir."]]}, {"reader": false, "ar": [[645.0, "وبناءً على ذلك فالمتقرِّر في قواعد أهل السنّة والجماعة أنّ الولاية دليلُ الكرامة،"], [653.5, "وليست الكرامةُ دليلَ الولاية."], [656.0, "فهذا التزامُ ما ليس بلازمٍ شرعًا،"], [659.6, "فلا ينبغي القولُ به."]], "tr": [[645.0, "Buna binaen Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşik olan şudur:"], [651.0, "Velâyet kerâmetin delilidir; kerâmet velâyetin delili değildir."], [655.4, "Bu, şer'an lâzım olmayanı lâzım tutmaktır;"], [659.0, "dolayısıyla bunu söylemek uygun değildir."]]}, {"reader": false, "ar": [[662.0, "ومن اللوازم أيضًا: سلبُ الولاية عمّن (لم) تحصل على يديه كرامة <span class=\"q\">؟ 11:02<\/span>؛"], [669.0, "فيقولون بأنّ من لم يجرِ على يديه شيءٌ من الكرامات فإنه لا يستحقّ أن يُوصف بأنه وليّ."], [680.0, "وهذا من اللوازم الباطلة؛"], [683.0, "فإنّنا لا نعلم دليلًا يدلّ على هذا التلازم الباطل."], [686.0, "وكما ذكرتُ لكم بأنّ هناك من الأولياء والصالحين من لم يجرِ على يديه شيءٌ من الكرامات،"], [694.0, "بل وكم أجرى الله على يد المفضول من الكرامات ما لم يُجرِه على يد الفاضل!"], [702.0, "فالكراماتُ التي أجراها الله عز وجل على يد عمر أكثرُ من الكرامات التي أجراها الله عز وجل على يد أبي بكر،"], [711.0, "بل إنّ الكرامات التي أجراها الله على كثيرٍ من التابعين لا يُعرف مثلُها في جيل الصحابة رضي الله عنهم وأرضاهم."]], "tr": [[662.0, "Lâzımlardan biri de elinde kerâmet (meydana gelmeyen) <span class=\"q\">؟<\/span> kimseden velâyeti nefyetmektir."], [670.4, "Elinde hiçbir kerâmet gerçekleşmeyen kimsenin velî olarak nitelenmeyi hak etmediğini söylerler."], [679.1, "Bu bâtıl lâzımlardandır; çünkü bu bâtıl telâzuma delalet eden hiçbir delil bilmiyoruz."], [685.7, "Size zikrettiğim gibi, velîler ve sâlihler arasında elinde hiçbir kerâmet gerçekleşmemiş olanlar vardır."], [693.6, "Hatta Allah, mefdûlün (faziletçe aşağı olanın) eliyle nice kerâmetler gerçekleştirmiştir ki fâzılın eliyle gerçekleştirmemiştir!"], [702.4, "Allah Azze ve Celle'nin Ömer'in eliyle gerçekleştirdiği kerâmetler, Ebû Bekir'in eliyle gerçekleştirdiği kerâmetlerden daha çoktur."], [710.2, "Hatta Allah'ın tâbiînden birçoğuna verdiği kerâmetlerin benzeri sahâbe neslinde —Allah onlardan razı olsun ve onları razı etsin— bilinmez."]]}, {"reader": false, "ar": [[724.0, "فلا ينبغي أن نجعل ذلك لازمًا للولاية؛"], [729.0, "فقد يُوصف العبدُ بأنه وليٌّ إذا كان مؤمنًا متّقيًا،"], [733.0, "وإن لم يجرِ في حياته شيئًا،"], [736.0, "وإن لم يجرِ على يديه في حياته شيءٌ من هذه الكرامات."], [741.0, "فانتبهوا لذلك. ولذلك قيل لأبي محمّدٍ المُرتعِش:"], [748.0, "فلانٌ يمشي على الماء!"], [750.0, "قال: «عندي أنّ من مكّنه الله من مخالفة هواه فهو أعظمُ عندي ممّن يمشي على الماء»."]], "tr": [[724.0, "O hâlde bunu velâyet için lâzım kılmamız uygun değildir."], [729.9, "Kul, mü'min ve müttaki olduğunda —hayatında hiçbir şey gerçekleştirmese, hayatında elinde bu kerâmetlerden hiçbiri gerçekleşmese bile— velî olarak nitelenebilir."], [738.7, "Buna dikkat edin. Bu sebeple Ebû Muhammed el-Murta'iş'e \"Falan kişi su üzerinde yürüyor!\" denildi."], [749.0, "O şöyle dedi: \"Bana göre, Allah'ın hevâsına muhalefet etmeye muktedir kıldığı kimse, bence su üzerinde yürüyenden daha büyüktür.\""]]}, {"reader": false, "ar": [[761.0, "ومن اللوازم الباطلة في باب الكرامة أيضًا:"], [766.0, "اعتقادُ أنّ من جرى على يديه شيءٌ من الكرامات أنه يستحقّ شيئًا من صفات الربوبيّة أو الألوهيّة،"], [774.0, "أو أنه يستحقّ أن يُصرف له شيءٌ من العبادة."], [778.0, "وهذا سيأتينا له تنبيهٌ خاصٌّ بإذن الله عز وجل."], [784.0, "ولذلك لمّا جعل الصوفيّةُ الكرامةَ أساسَ الولاية حرصوا على تأليف مؤلَّفاتٍ في كرامات الأولياء،"], [795.0, "وكلُّها من القصص الخرافيّة والدَّجَل الذي ما أنزل الله به من سلطان،"], [805.0, "وما ذلك إلا ليُثبتوا أنّ لأوليائهم الذين يعظّمونهم أو يعبدونهم من دون الله عز وجل أنّ لهم كرامات."]], "tr": [[761.0, "Kerâmet babındaki bâtıl lâzımlardan biri de şudur:"], [765.3, "Elinde kerâmetlerden bir şey gerçekleşen kimsenin rubûbiyyet veya ulûhiyyet sıfatlarından bir şeyi hak ettiğine ya da kendisine ibadetten bir şeyin yöneltilmesini hak ettiğine inanmak."], [776.7, "Allah Azze ve Celle'nin izniyle bununla ilgili özel bir uyarı ileride gelecek."], [784.0, "Bu sebeple sûfîler kerâmeti velâyetin temeli yapınca, velîlerin kerâmetleri hakkında eserler yazmaya hırs gösterdiler."], [795.0, "Bunların hepsi hurafe kıssalar ve Allah'ın hakkında hiçbir delil indirmediği şarlatanlıktır."], [804.3, "Bunu yapmalarının tek sebebi, tazim ettikleri veya Allah Azze ve Celle'yi bırakıp ibadet ettikleri velîlerinin kerâmetleri olduğunu isbat etmektir."]]}, {"reader": false, "ar": [[813.0, "ومن اللوازم الباطلة في باب الكرامة قولُهم:"], [818.8, "الكرامةُ يتفاضل بها أهلُ الولاية <span class=\"note\">(يكررها)<\/span>،"], [823.0, "وهذا قولٌ باطل. فلا نعلم أحدًا من أهل السنّة جعل جريانَ الكرامة من عدمها بابًا من أبواب التفضيل بين الأولياء."], [839.0, "وهذا ليس كسابقه من اللوازم؛"], [842.0, "فإنّ اللازم الذي ذكرتُه لكم آنفًا هو إثباتُ أصل الولاية بالكرامة،"], [848.0, "لكنّ هذا اللازم هو إثباتُ التفاضل بين الأولياء بكثرة الكرامات من قلّتها،"], [856.0, "وكلا اللازمين باطل، وكلا اللازمين باطل."]], "tr": [[813.0, "Kerâmet babındaki bâtıl lâzımlardan biri de şu sözleridir:"], [818.8, "\"Velâyet ehli kerâmetle birbirinden üstün olur.\" (Tekrar ediyor.) Bu bâtıl bir sözdür."], [832.5, "Ehl-i Sünnet'ten hiç kimsenin kerâmetin gerçekleşip gerçekleşmemesini velîler arasında üstünlük bablarından biri yaptığını bilmiyoruz."], [839.0, "Bu, lâzımlardan bir öncekine benzemez:"], [841.4, "Size az önce zikrettiğim lâzım, velâyetin aslını kerâmetle isbat etmektir;"], [846.8, "bu lâzım ise velîler arasındaki üstünlüğü kerâmetlerin çokluğu ve azlığıyla isbat etmektir."], [854.5, "İki lâzım da bâtıldır, iki lâzım da bâtıldır."]]}, {"reader": false, "ar": [[861.0, "ومن اللوازم في باب الكرامات أيضًا قولُهم:"], [866.8, "الكرامةُ قرينةُ العصمة. فيعتقدون بأنّ من أجرى الله عز وجل على يديه كراماتٍ فإنه خرج عن دائرة الخطأ إلى دائرة العصمة،"], [878.0, "فيقبلون كلَّ أقواله، ويقتدون بكلّ أفعاله."], [884.0, "وهذا لازمٌ باطل، لم يقل به أحدٌ من أهل السنّة والجماعة."], [890.0, "وهذه الكلّيّة كلّيّةٌ طيّبةٌ جدًّا؛"], [893.0, "لأنّ باب الكرامة قد دخل فيه أهلُ البدع بمثل هذه اللوازم التي يجعلونها لازمةً لكلّ من أجرى الله على يديه شيئًا من الكرامات،"], [904.0, "وهي من اللوازم الباطلة التي لا تستند إلى دليل الكتاب والسنّة،"], [910.0, "ولا إلى قول عالمٍ من علماء أهل السنّة والجماعة. والله أعلم."]], "tr": [[861.0, "Kerâmetler babındaki lâzımlardan biri de şu sözleridir:"], [866.8, "\"Kerâmet ismetin karinesidir.\" Allah Azze ve Celle'nin eliyle kerâmetler gerçekleştirdiği kimsenin hata dairesinden çıkıp ismet (masumiyet) dairesine girdiğine inanırlar;"], [877.0, "bütün sözlerini kabul eder ve bütün fiillerine uyarlar."], [884.7, "Bu bâtıl bir lâzımdır; Ehl-i Sünnet ve'l-Cemaat'ten hiç kimse bunu söylememiştir."], [890.6, "Bu külliye çok güzel bir külliyedir;"], [894.0, "çünkü bid'at ehli, Allah'ın eliyle kerâmetlerden bir şey gerçekleştirdiği herkes için lâzım kıldıkları bu tür lâzımlarla kerâmet babına girmiştir."], [903.5, "Bunlar ne Kitap ve Sünnet'in delillerine ne de Ehl-i Sünnet ve'l-Cemaat âlimlerinden bir âlimin sözüne dayanan bâtıl lâzımlardır. Allah en iyisini bilir."]]}]}, {"ts": "15:15", "title": "3. Külliye: Sahih bir yolla sabit olmayan her kerâmete dayanmak caiz değildir", "paras": [{"reader": false, "ar": [[915.0, "ومن الكلّيّات أيضًا: <b>كلُّ كرامةٍ لم تثبت بطريقٍ صحيحٍ فلا يجوز اعتمادُها.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها ثالثة:"], [938.0, "<b>كلُّ كرامةٍ لم تثبت بطريقٍ صحيحٍ فلا يجوز اعتمادُها.<\/b>"]], "tr": [[915.0, "Külliyelerden biri de şudur: 3."], [917.0, "külliye: Sahih bir yolla sabit olmayan her kerâmete dayanmak caiz değildir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [938.0, "<b>3. külliye: Sahih bir yolla sabit olmayan her kerâmete dayanmak caiz değildir.<\/b>"]]}, {"reader": false, "ar": [[943.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرِّر في القواعد أنّ الخبريّة المتعلّقة بشيءٍ من الشرع مَناطُها صحّةُ الطريق."], [955.0, "فلا يجوز لنا أن ننسب كرامةً لأحدٍ إلا إذا ثبتت كرامتُه بطريقٍ يُقبل في النقل."], [964.0, "وبناءً على ذلك فالكرامة إذا لم ينقلها العدولُ الثقاتُ الأثبات،"], [970.1, "أو تثبت بالنصّ الصحيح الصريح،"], [973.0, "فإنه لا يجوز لنا قبولُها،"], [975.9, "ولا اعتمادُها، ولا نسبتُها لمن نُسبت إليه."]], "tr": [[943.0, "Tevfik Allah'tandır, derim ki: Bu böyledir;"], [946.1, "çünkü kaidelerde yerleşik olan şudur:"], [948.7, "Şeriattan bir şeye taalluk eden haberlerin (kabulünün) dayanağı yolun (rivayet yolunun) sıhhatidir."], [956.2, "Dolayısıyla bir kerâmeti birine, ancak onun kerâmeti nakilde kabul edilen bir yolla sabit olduğunda nispet edebiliriz."], [964.6, "Buna binaen kerâmeti âdil, güvenilir, sağlam râviler nakletmemişse veya sahih ve açık bir nasla sabit olmamışsa, onu kabul etmemiz, ona dayanmamız ve nispet edildiği kimseye nispet etmemiz caiz değildir."]]}, {"reader": false, "ar": [[980.0, "وإنّ كثيرًا من الكرامات المنقولة في كتب الصوفيّة،"], [984.9, "كـ«كرامات الأولياء» للشَّعرانيّ وغيرها،"], [989.0, "كلُّها من الكرامات التي لم تثبت بطريقٍ صحيح،"], [992.0, "وإنما أسانيدُها مملوءةٌ بالدجاجلة والكذّابين وأهل الخرافة والبدعة."], [1001.0, "فلا يجوز لنا أن نعتمد شيئًا من هذه الكرامات إلا إذا ثبتت عندنا ـ معاشرَ أهل السنّة ـ بطريقٍ صحيح. والكلّيّة واضحة."]], "tr": [[980.0, "Sûfîlerin kitaplarında nakledilen kerâmetlerin çoğu —Şa'rânî'nin \"Kerâmâtü'l-evliyâ\"sı ve benzerleri gibi— sahih bir yolla sabit olmamış kerâmetlerdir;"], [991.2, "senetleri deccallar, yalancılar, hurafe ve bid'at ehliyle doludur."], [997.1, "Bu kerâmetlerden hiçbirine, ancak biz Ehl-i Sünnet topluluğu nezdinde sahih bir yolla sabit olursa dayanabiliriz. Külliye açıktır."]]}]}, {"ts": "16:53", "title": "4. Külliye: Hakka yardım almak için kerâmet isteyen herkes için bunda sakınca yoktur", "paras": [{"reader": false, "ar": [[1013.0, "ومن الكلّيّات أيضًا: <b>كلُّ من سأل كرامةً ليستعين بها على الحقّ فلا بأس به.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[1013.0, "Külliyelerden biri de şudur: 4."], [1022.0, "külliye: Hakka yardım almak için kerâmet isteyen herkes için bunda sakınca yoktur. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1034.0, "أقول وبالله التوفيق: أهلُ السنّة والجماعة رحمهم الله تعالى لا يرون حرجًا في أن يسأل المسلمُ ربَّه شيئًا من الكرامات؛"], [1050.0, "فلا بأس على الوليّ أن يسأل أن يُكرمه الله عز وجل بما يُكرم به أولياءه من أمورٍ خارقةٍ للعادة،"], [1059.0, "ولكن لا بدّ أن يُحسن قصدَه في هذا السؤال."], [1065.0, "فلا ينبغي أن يقوم في قلبه أن يفتخر بهذه الكرامة،"], [1071.6, "أو يُفضّل بها نفسَه على غيره،"], [1076.0, "أو يُعجَب بهذه الكرامة،"], [1078.8, "أو يجعلها سُلَّمًا ليتسلّط بها على غيره،"], [1084.0, "وإنما لا بدّ أن يكون سؤالُه للكرامة مقرونًا بحسن القصد."]], "tr": [[1034.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat —Allah onlara rahmet etsin— Müslüman'ın Rabbinden kerâmetlerden bir şey istemesinde bir sakınca görmez."], [1050.9, "Velînin, Allah Azze ve Celle'nin velîlerine ikram ettiği hârikulâde şeylerle kendisine de ikram etmesini istemesinde bir sakınca yoktur;"], [1060.3, "fakat bu istekte niyetini güzel tutması gerekir."], [1065.7, "Kalbinde bu kerâmetle övünmek, onunla kendini başkalarından üstün tutmak, bu kerâmetle ucba kapılmak veya onu başkalarına tahakküm etmek için bir merdiven yapmak (düşüncesi) bulunmamalıdır."], [1084.5, "Bilakis kerâmeti istemesi mutlaka güzel niyetle birlikte olmalıdır."]]}, {"reader": false, "ar": [[1089.0, "وهذا الجوازُ مستندٌ لعدّة أمور:"], [1094.0, "الأمرُ الأول: أنه لم يرد نهيٌ عن ذلك؛"], [1098.0, "فلا أعلم دليلًا في كتاب الله عز وجل،"], [1101.0, "ولا في سنّة رسوله صلى الله عليه وسلم،"], [1106.0, "ولا في قول أحدٍ ممّن يُعتدّ بقوله في الأمّة،"], [1110.0, "أنه نهى عن ذلك."], [1114.0, "والمتقرِّر في القواعد أنّ الأصل في مثل هذه الأفعال الحِلُّ والإباحة حتى يرد دليلُ الشرع بالمنع."]], "tr": [[1089.0, "Bu cevaz birkaç şeye dayanır."], [1094.0, "Birinci husus: Bundan bir nehiy (yasak) varid olmamıştır."], [1098.4, "Allah Azze ve Celle'nin Kitabı'nda, Resûlü sallallâhu aleyhi ve sellem'in sünnetinde veya ümmette sözü itibar edilenlerden birinin sözünde bunu yasaklayan bir delil bilmiyorum."], [1110.8, "Kaidelerde yerleşik olan şudur: Bu tür fiillerde asıl olan, şeriatın delili yasakla gelinceye kadar helâllik ve mubahlıktır."]]}, {"reader": false, "ar": [[1123.0, "ومنها أيضًا: أنّ الكرامة ليست مستحيلةَ الوقوع للمؤمن،"], [1131.0, "بل هي كثيرةٌ، يُكرم الله عز وجل بها ـ سبحانه ـ من شاء من عباده المؤمنين،"], [1138.0, "ويُصيب بها من شاء منهم."], [1141.0, "فإذا سأل العبدُ ربَّه ذلك فلا يُعتبر أن يكون قد سأل ربَّه شيئًا مستحيلًا أو ممتنعًا؛"], [1150.0, "فهذا ليس بسؤالٍ لممنوعٍ شرعًا،"], [1153.6, "ولا بمستحيلٍ عقلًا وواقعًا،"], [1158.0, "والله عز وجل قادرٌ على كلّ شيء،"], [1160.8, "ولا يُعجزه شيءٌ في السماوات ولا في الأرض."]], "tr": [[1123.0, "Bunlardan biri de şudur: Kerâmetin mü'min için vuku bulması imkânsız değildir;"], [1131.5, "bilakis çoktur. Allah Azze ve Celle —münezzehtir— mü'min kullarından dilediğine onunla ikram eder ve onlardan dilediğine onu nasip eder."], [1140.4, "Kul Rabbinden bunu istediğinde, Rabbinden imkânsız veya mümteni (olması engelli) bir şey istemiş sayılmaz."], [1147.1, "Bu ne şer'an yasaklanmış bir şeyi ne de aklen ve vâkıa olarak imkânsız bir şeyi istemektir."], [1158.4, "Allah Azze ve Celle her şeye kâdirdir;"], [1160.8, "göklerde ve yerde hiçbir şey O'nu âciz bırakamaz."]]}, {"reader": false, "ar": [[1164.0, "ومن الأدلّة أيضًا: حديثُ الثلاثة الذين انطبقت عليهم الصخرة،"], [1170.0, "وهو في «الصحيحين» من حديث ابن عمر رضي الله عنهما،"], [1176.0, "فدعا كلُّ واحدٍ منهم بعمله الصالح أن يُفرّج الله عز وجل عنهم أمرَ هذه الصخرة."], [1182.0, "ومن المعلوم أنّ تفريجها ليس داخلًا تحت قدرتهم،"], [1186.5, "وإنما الله عز وجل هو القادر على ذلك."], [1191.0, "وقد حكى النبيُّ صلى الله عليه وسلم هذا السؤالَ من هؤلاء الثلاثة حكايةَ إقرارٍ وثناءٍ على ما فعلوه،"], [1202.0, "فدلّ ذلك على أنّ سؤال الكرامة من الأمور الجائزة التي لا بأس بها ولا حرج فيها إن شاء الله،"], [1211.0, "إذا كان قصدُ السائل أمرًا يُعينه على الحقّ."]], "tr": [[1164.0, "Delillerden biri de üzerlerine kaya kapanan üç kişinin hadisidir."], [1170.0, "Bu hadis \"Sahîhayn\"da İbn Ömer'den —Allah ikisinden razı olsun— rivayet edilmiştir."], [1176.4, "Onlardan her biri, Allah Azze ve Celle'nin bu kaya meselesinde onlara bir çıkış vermesi için sâlih ameliyle dua etti."], [1184.8, "Bilindiği gibi kayayı açmak onların kudreti dahilinde değildir;"], [1189.3, "buna kâdir olan ancak Allah Azze ve Celle'dir."], [1194.1, "Peygamber sallallâhu aleyhi ve sellem bu üç kişinin bu isteğini, yaptıklarını onaylayarak ve överek hikâye etti."], [1203.4, "Bu da, isteyenin maksadı kendisine hak üzere yardımcı olacak bir şey olduğunda, kerâmet istemenin inşallah sakıncası ve mahzuru olmayan caiz işlerden olduğuna delalet etti."]]}, {"reader": false, "ar": [[1217.0, "ونحوُه كذلك أيضًا: حديثُ الرجل الذي جعل المالَ في الخشبة،"], [1223.0, "والحديثُ أخرجه الإمامُ البخاريّ في «صحيحه» معلَّقًا بصيغة الجزم،"], [1230.0, "في قصّةٍ معروفةٍ لديكم،"], [1233.0, "ثم ألقى بها في البحر،"], [1237.0, "وسأل الله عز وجل أن يُوصلها إلى صاحب الحقّ الذي استدان منه،"], [1242.0, "فأوصلها الله عز وجل إليه."], [1244.5, "ومثلُ هذا كرامةٌ، ولا شكّ في ذلك،"], [1248.0, "وقد حكاها النبيُّ صلى الله عليه وسلم حكايةَ إقرارٍ وثناء."]], "tr": [[1217.0, "Buna benzer olarak bir de parayı bir kütüğün içine koyan adamın hadisi vardır."], [1223.7, "Bu hadisi İmam el-Buhârî \"Sahîh\"inde cezm sîgasıyla muallak olarak rivayet etmiştir;"], [1230.8, "sizce bilinen bir kıssadır. Sonra onu denize attı ve Allah Azze ve Celle'den onu kendisinden borç aldığı hak sahibine ulaştırmasını istedi;"], [1241.6, "Allah Azze ve Celle de onu ona ulaştırdı."], [1245.0, "Bunun gibisi kerâmettir, bunda şüphe yoktur."], [1247.5, "Peygamber sallallâhu aleyhi ve sellem de onu onaylayarak ve överek hikâye etmiştir."]]}, {"reader": false, "ar": [[1254.0, "وقد ذكر الإمامُ اللالكائيّ في «كرامات الأولياء» مجموعةً من الكرامات التي تحقّقت للصالحين بعد سؤالهم الله عز وجل شيئًا من ذلك،"], [1267.0, "مثل دعاء العلاء بن الحضرميّ:"], [1269.7, "«يا عليمُ يا حليمُ، يا عليُّ يا عظيمُ، اسقنا» <span class=\"q\">؟ 21:07<\/span>،"], [1276.3, "فأُمطِروا، ودعائه بمثله حتى مشى جيشُه على النهر،"], [1283.0, "وغيرها كثيرٌ ممّا هو معلومٌ في مظانّه."], [1288.0, "فهذه كلُّها أدلّةٌ تدلّ على جواز سؤال الله عز وجل خوارقَ العادات على وجه الكرامة من حيث الأصل."]], "tr": [[1254.0, "İmam el-Lâlekâî \"Kerâmâtü'l-evliyâ\"da, sâlihlere Allah Azze ve Celle'den bu tür bir şey istemelerinin ardından gerçekleşen bir grup kerâmeti zikretmiştir."], [1264.5, "Alâ b. el-Hadramî'nin \"Ey her şeyi bilen, ey halîm, ey yüce, ey azîm!"], [1270.3, "Bize yağmur ver.\" <span class=\"q\">؟<\/span> duası ve bunun üzerine yağmura kavuşmaları;"], [1277.7, "yine benzeri bir duasıyla ordusunun nehrin üzerinde yürümesi gibi."], [1284.4, "Bunlar dışında kaynaklarında bilinen pek çok örnek vardır."], [1289.1, "Bunların hepsi, aslı itibarıyla, Allah Azze ve Celle'den kerâmet yoluyla hârikulâde şeyler istemenin caiz olduğuna delalet eden delillerdir."]]}, {"reader": false, "ar": [[1296.0, "ولكنّنا نُنبّه ونُعيد: أنه لا بدّ أن يكون الداعي لذلك إنما هو إرادةُ إظهار الحقّ،"], [1304.2, "أو نصرة الحقّ، أو نحو ذلك."], [1308.0, "وبناءً على ذلك فلا يجوز للإنسان أن يدعو بشيءٍ من تلك الكرامات إذا كان مقصودُه تحصيلَ أمرٍ دنيويٍّ فقط،"], [1320.0, "أو كان مقصودُه إنما هي المفاخرةُ والمباهاةُ والتعاظمُ بهذه الكرامات."]], "tr": [[1296.0, "Fakat şunu hatırlatıyor ve tekrar ediyoruz:"], [1298.9, "Buna sevk eden şeyin ancak hakkı ortaya çıkarma, hakka yardım etme veya benzeri bir istek olması gerekir."], [1308.0, "Buna binaen insanın, maksadı sadece dünyevî bir şey elde etmek ise ya da maksadı bu kerâmetlerle övünmek, böbürlenmek ve büyüklenmek ise o kerâmetlerden bir şey için dua etmesi caiz değildir."]]}]}, {"ts": "22:09", "title": "5. Külliye: Elinde hârika gerçekleştirmeye gücü olduğunu iddia eden herkes yalancı bir deccaldir", "paras": [{"reader": false, "ar": [[1329.0, "ومن الكلّيّات أيضًا: <b>كلُّ من يدّعي قدرتَه على جريان الخارق على يديه فدجّالٌ كذّاب.<\/b> كلُّ من يدّعي قدرتَه على جريان الخارق على يديه..."], [1348.8, "شو نسمّيه؟ فدجّالٌ كذّاب."], [1355.0, "أُعيده مرّةً ثانية: <b>كلُّ من يدّعي قدرتَه على جريان الخارق على يديه فدجّالٌ كذّاب.<\/b>"]], "tr": [[1329.0, "Külliyelerden biri de şudur: 5."], [1331.7, "külliye: Elinde hârika gerçekleştirmeye gücü olduğunu iddia eden herkes yalancı bir deccaldir. Elinde hârika gerçekleştirmeye gücü olduğunu iddia eden herkes..."], [1345.0, "Ona ne diyoruz? Yalancı bir deccal."], [1354.0, "İkinci kez tekrar ediyorum: 5."], [1357.0, "külliye: Elinde hârika gerçekleştirmeye gücü olduğunu iddia eden herkes yalancı bir deccaldir."]]}, {"reader": false, "ar": [[1362.0, "أقول وبالله التوفيق: وهذا ممّا أُقسم بالله عز وجل على صحّته وأحقّيّته؛"], [1371.0, "وذلك لأنّ الكرامة من الله تعالى،"], [1374.0, "وليست من فعل العبد أبدًا."], [1376.0, "فالله تعالى هو الذي يخرق العادةَ لمن شاء متى شاء،"], [1382.0, "فصاحبُ الكرامة لا يستطيع أن يدّعي أنه يخرق العادةَ إذا شاء ومتى شاء؛"], [1389.0, "لأنّ أولياء الله عز وجل حقًّا يعتقدون اعتقادًا جازمًا أنّ الخلق والأمر والقدرة التامّة بيد الله تبارك وتعالى،"], [1399.0, "والله عز وجل هو القادر على مثل هذا الأمر العظيم،"], [1407.0, "كما قال الله عز وجل:"], [1408.9, "<span class=\"ayah\">﴿أَلَا لَهُ الْخَلْقُ وَالْأَمْرُ ۗ تَبَارَكَ اللَّهُ رَبُّ الْعَالَمِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ٥٤]<\/span>."]], "tr": [[1362.0, "Tevfik Allah'tandır, derim ki: Bu, doğruluğuna ve hak oluşuna Allah Azze ve Celle adına yemin ettiğim şeylerdendir."], [1372.5, "Çünkü kerâmet Allah Teâlâ'dandır; asla kulun fiili değildir."], [1375.6, "Âdeti dilediği kimse için dilediği zaman bozan Allah Teâlâ'dır."], [1380.2, "Kerâmet sahibi, dilediğinde ve dilediği zaman âdeti bozduğunu iddia edemez."], [1385.2, "Çünkü Allah Azze ve Celle'nin gerçek velîleri, yaratmanın, emrin ve tam kudretin Allah Tebâreke ve Teâlâ'nın elinde olduğuna kesin olarak inanırlar."], [1394.9, "Bu büyük işe kâdir olan Allah Azze ve Celle'dir."], [1399.7, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1403.9, "<span class=\"ayah\">﴿İyi bilin ki yaratmak da emretmek de yalnız O'na mahsustur. Âlemlerin Rabbi Allah ne yücedir﴾<\/span> [A'râf 54]."]]}, {"reader": false, "ar": [[1412.0, "فالله تعالى هو الذي يُكرم الرجلَ الصالح بالكرامة ابتداءً أو سؤالًا،"], [1421.0, "لكن لا ينبغي أبدًا أن يدّعي الرجلُ الصالح أنه قادرٌ على أن يُجري هذا الخارقَ على يديه،"], [1429.0, "كما هي أحوالُ كثيرٍ من الصوفيّة؛"], [1433.2, "فهم أصحابُ الأحوال الشيطانيّة،"], [1438.0, "فيدّعون كذبًا وزورًا وبهتانًا أنّ في قدرتهم علمَ ما في الصدور،"], [1444.0, "فيتحدّون بأن يُظهروا ما في مكنون أنفس من يخاطبونه،"], [1450.0, "أو أنهم يُخبرونك بما يجري لك في الغد،"], [1454.0, "أو بأنهم يقرؤون الكفَّ أو الفنجانَ أو الضربَ بالحصى،"], [1462.0, "أو أنهم يدّعون قدرتَهم أن يدخلوا النارَ ويخرجوا بلا احتراق،"], [1471.0, "أو أنهم يُدخلون السيوفَ في بطونهم ولا تضرّهم،"], [1476.0, "أو أنهم يجعلون الحصى يُسبّح بين أيديهم،"], [1483.0, "أو الخشبَ، أو ينادون الشجرةَ من مكانٍ بعيدٍ فيأتيهم يخُطّ بعروقه الأرض،"], [1490.0, "أو نحو ذلك. فكلُّ ذلك إنما يجري بأحوالٍ شيطانيّةٍ إبليسيّة."]], "tr": [[1412.0, "Sâlih kişiye kerâmeti, ya kendiliğinden ya da istemesi üzerine ikram eden Allah Teâlâ'dır."], [1421.9, "Fakat sâlih kişinin, bu hârikayı kendi eliyle gerçekleştirmeye gücü olduğunu iddia etmesi asla uygun değildir."], [1429.0, "Sûfîlerin çoğunun hâli böyledir; onlar şeytanî hâller sahibidirler."], [1434.6, "Yalan, iftira ve bühtan olarak göğüslerdekini bilmenin güçleri dahilinde olduğunu iddia ederler;"], [1443.5, "muhatap oldukları kişinin içinde gizli olanı ortaya çıkaracaklarına dair meydan okurlar."], [1450.5, "Ya da sana yarın başına geleceği haber verdiklerini, el falı, kahve falı veya çakıl taşı falı baktıklarını iddia ederler."], [1464.1, "Ya da ateşe girip yanmadan çıkabildiklerini veya kılıçları karınlarına soktukları hâlde kendilerine zarar vermediğini, çakıl taşlarını —ya da tahtayı— önlerinde tesbih ettirdiklerini, ağacı uzak bir yerden çağırdıklarında köklerini yere sürterek yanlarına geldiğini veya benzeri şeyleri (iddia ederler)."], [1492.1, "Bütün bunlar ancak şeytanî, iblisçe hâllerle gerçekleşir."]]}]}, {"ts": "25:00", "title": "5. Külliye (devam): Deccal ve kerâmetin hakikati", "paras": [{"reader": false, "ar": [[1500.0, "وآخرُهم الدجّالُ الذي سيخرج في آخر الزمان،"], [1505.0, "ويدّعي قدرتَه على أن يُنزل المطر،"], [1510.9, "وعلى أن يُخرج النبات،"], [1514.0, "وعلى أن يقسم الناسَ قسمين:"], [1516.7, "منهم في الجنّة ومنهم في السعير،"], [1520.0, "ويدّعي قدرةً أمكنه الله عز وجل منها بما شاء أن يُمكّنه في زمانه."], [1527.0, "فكلُّ هؤلاء إنما تُعينهم الشياطينُ على مثل هذه الأحوال."]], "tr": [[1500.0, "Bunların sonuncusu, âhir zamanda çıkacak olan Deccal'dir."], [1505.0, "Yağmur yağdırmaya, bitki çıkarmaya ve insanları iki kısma —bir kısmı cennette, bir kısmı alevli ateşte— ayırmaya gücü olduğunu iddia edecektir."], [1519.5, "Allah Azze ve Celle'nin, zamanında dilediği kadarıyla imkân verdiği bir kudreti iddia edecektir."], [1526.5, "Bunların hepsine bu tür hâllerde ancak şeytanlar yardım eder."]]}, {"reader": false, "ar": [[1534.0, "فحقيقةُ الكرامة أنها تأتي للإنسان فجأةً،"], [1538.0, "أو عن سؤالٍ لا يدري هل استجاب الله له فيه أو لم يستجب."], [1543.0, "لكن من يزعم ابتداءً أنه قادرٌ على خرق هذه العادة فإنه عند أهل السنّة دجّالٌ كاهنٌ مشعوذ،"], [1552.9, "أو ساحرٌ كذّاب، كما هو حالُ كثيرٍ ممّن يدّعي التصوّف؛"], [1559.0, "فإنما تجري على أيديهم تلك الأحوالُ الإبليسيّة بسبب الشياطين. والله أعلم."]], "tr": [[1534.0, "Kerâmetin hakikati şudur: İnsana ansızın gelir veya Allah'ın kendisine icabet edip etmediğini bilmediği bir istek üzerine gelir."], [1542.2, "Fakat baştan bu âdeti bozmaya gücü yettiğini iddia eden kimse, Ehl-i Sünnet nezdinde deccal, kâhin, hokkabazdır veya yalancı bir sihirbazdır."], [1553.6, "Tasavvufu iddia edenlerin çoğunun hâli böyledir;"], [1557.2, "o iblisçe hâller onların ellerinde ancak şeytanlar sebebiyle gerçekleşir. Allah en iyisini bilir."]]}]}, {"ts": "26:07", "title": "6. Külliye: Kerâmetin cinsini inkâr eden herkes bid'atçidir; ağır basan zanna dayanarak bazılarının aynını inkâr eden değil", "paras": [{"reader": false, "ar": [[1567.0, "ومن الكلّيّات أيضًا: كلُّ من أنكر جنسَ الكرامة فمبتدع،"], [1574.4, "لا من أنكر أعيانَ بعضها عن غلبة ظنّ. <span class=\"note\">(يكررها)<\/span> أُعيدها ثالثةً يا إخواني:"], [1597.0, "كلُّ من أنكر جنسَ الكرامة فمبتدع،"], [1601.0, "لا من أنكر أعيانَ بعضها عن غلبة ظنّ."]], "tr": [[1567.0, "Külliyelerden biri de şudur: 6."], [1571.0, "külliye: Kerâmetin cinsini inkâr eden herkes bid'atçidir;"], [1574.0, "ağır basan bir zanna dayanarak bazılarının aynını (tek tek olaylarını) inkâr eden değil. (Tekrar ediyor.) Kardeşlerim, üçüncü kez tekrar ediyorum:"], [1597.7, "6. külliye: Kerâmetin cinsini inkâr eden herkes bid'atçidir;"], [1601.0, "ağır basan bir zanna dayanarak bazılarının aynını inkâr eden değil."]]}, {"reader": false, "ar": [[1608.0, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أنّ من خصائص أهل السنّة والجماعة الإيمانَ بكرامات الأولياء،"], [1620.0, "ولكنّ المطلوب في الكرامة إنما هو التصديقُ بجنسها؛"], [1626.0, "يعني بمعنى: أن تؤمن بأنّ الله قد يُجري كرامةً على يد وليٍّ من أوليائه."], [1632.0, "فالتصديقُ بوجود الكرامات في الجملة هو الذي يجب على كلّ سُنّيّ."], [1640.0, "أمّا كرامةُ الشخص المعيّن،"], [1643.0, "أو دعواه الكرامةَ بالإخبار ببعض ما سيحدث في المستقبل،"], [1649.0, "فهذا ليس ممّا يجب على كلّ أحدٍ التصديقُ به."]], "tr": [[1608.0, "Tevfik Allah'tandır, derim ki: Bil ki —Allah sana rahmet etsin— velîlerin kerâmetlerine iman Ehl-i Sünnet ve'l-Cemaat'in hususiyetlerindendir."], [1620.7, "Fakat kerâmette istenen, ancak onun cinsini tasdik etmektir;"], [1626.4, "yani Allah'ın velîlerinden bir velînin elinde kerâmet gerçekleştirebileceğine iman etmendir."], [1630.7, "Kerâmetlerin genel olarak var olduğunu tasdik etmek her Sünnî'ye vâcip olandır."], [1637.3, "Belirli bir şahsın kerâmetine veya onun gelecekte olacak bazı şeyleri haber vererek kerâmet iddia etmesine gelince;"], [1649.0, "bu, herkesin tasdik etmesi vâcip olan şeylerden değildir."]]}, {"reader": false, "ar": [[1653.0, "فلو أنّ رجلًا أخبرك بأنّ الله أجرى على يديه كذا وكذا،"], [1658.0, "أو قرأتَ في بعض الكتب بأنّ الله أجرى على يد الوليّ الفلانيّ شيئًا من هذه الكرامات،"], [1665.0, "وأنكرتَ عينَها، فإنّ إنكارك لعين هذه الكرامة لا يُخرجك عن دائرة أهل السنّة والجماعة،"], [1673.0, "ما لم تكن ثابتةً بطريقٍ صحيح."], [1676.0, "فالمطلوبُ هو الإيمانُ بجنس الكرامات،"], [1684.0, "وأمّا التشكيكُ أو إنكارُ بعض أعيانها فإنه لا يُخرج الإنسانَ عن دائرة السنّة."]], "tr": [[1653.0, "Bir adam sana Allah'ın onun eliyle şunu şunu gerçekleştirdiğini haber verse veya bazı kitaplarda Allah'ın falan velînin eliyle bu kerâmetlerden bir şey gerçekleştirdiğini okusan ve onun aynını inkâr etsen, bu kerâmetin aynını inkâr etmen —sahih bir yolla sabit olmadığı sürece— seni Ehl-i Sünnet ve'l-Cemaat dairesinden çıkarmaz."], [1675.5, "İstenen, kerâmetlerin cinsine imandır. Bazı tek tek olaylarından şüphe etmek veya onları inkâr etmek ise insanı Sünnet dairesinden çıkarmaz."]]}, {"reader": false, "ar": [[1693.0, "وذلك لأنّنا لا نقطع أنّ هذه الكرامة المعيّنة كرامةٌ من الله عز وجل؛"], [1699.0, "فيُحتمل أنها شيءٌ ظنّه الوليُّ أنه كرامة وليست بكرامة،"], [1706.0, "أو أنها من مخاريق الأبالسة التي أرادت أن تُلبّس عليه بها،"], [1712.0, "وقد لُبِّس على صاحبها فظنّها كرامة."], [1718.0, "وهذا سيّدُ المُلهَمين في هذه الأمّة عمرُ بن الخطّاب رضي الله عنه قد كان يظنّ أشياء ثم يتراجع عنها حينما يتبيّن له أنها لم تكن صوابًا."], [1729.9, "فلا بدّ من التفريق بين إنكار جنس الكرامات المُخرِج عن دائرة السنّة،"], [1739.0, "وبين إنكار بعضها أو التشكيك في بعضها."]], "tr": [[1693.0, "Bu böyledir; çünkü bu belirli kerâmetin Allah Azze ve Celle'den bir kerâmet olduğunu kesin olarak söyleyemeyiz."], [1699.7, "Velînin kerâmet sandığı ama kerâmet olmayan bir şey olması muhtemeldir;"], [1706.5, "ya da onunla ona telbiste bulunmak (işi karıştırmak) isteyen iblislerin hileli hârikalarından olması ve sahibinin aldatılıp onu kerâmet sanması (muhtemeldir)."], [1719.5, "İşte bu ümmetteki ilham olunanların efendisi Ömer b."], [1723.0, "el-Hattâb —Allah ondan razı olsun— bazı şeyleri zanneder, sonra doğru olmadıkları kendisine açıkça belli olunca onlardan dönerdi."], [1729.6, "Dolayısıyla Sünnet dairesinden çıkaran, kerâmetlerin cinsini inkâr etmek ile bazılarını inkâr etmek veya bazılarından şüphe etmek arasında mutlaka ayırım yapmak gerekir."]]}, {"reader": false, "ar": [[1744.0, "قال أبو العبّاس ابن تيميّة رحمه الله تعالى في نقلٍ مطوَّل،"], [1749.1, "فانتبهوا له: «وأمّا من شاع له لسانُ صدقٍ في الأمّة، بحيث اتّفقت الأمّةُ على الثناء عليه، فهل يُشهد له بذلك؟ هذا فيه نزاعٌ بين أهل السنّة، والأشبهُ أن يُشهد له بذلك»."], [1767.0, "ـ هذا في الأمر العامّ،"], [1769.0, "انتبه ـ. «وأمّا خواصُّ الناس فقد يعلمون عواقبَ أقوامٍ بما كشف الله لهم، لكن هذا ليس ممّن يجب التصديقُ العامّ به؛ فإنّ كثيرًا ممّن يُظنّ به أنه حصل له هذا الكشف يكون ظانًّا في ذلك ظنًّا لا يُغني من الحقّ شيئًا. وأهلُ المكاشفات والمخاطبات يُصيبون تارةً ويُخطئون أخرى، كأهل النظر والاستدلال في موارد الاجتهاد. ولهذا وجب عليهم جميعهم أن يعتصموا بكتاب الله وسنّة رسوله صلى الله عليه وسلم،"]], "tr": [[1744.0, "Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— uzun bir nakilde şöyle demiştir, buna dikkat edin:"], [1750.0, "\"Ümmette hakkında doğruluk dili (iyi bir ün) yayılan, ümmetin onu övmekte ittifak ettiği kimseye gelince;"], [1758.3, "ona bununla (cennetlik olduğuna) şahitlik edilir mi?"], [1761.6, "Bunda Ehl-i Sünnet arasında ihtilaf vardır;"], [1764.4, "daha doğruya yakın olan, ona bununla şahitlik edilmesidir.\" —Bu genel durumdadır, dikkat et.— \"İnsanların havassına gelince;"], [1772.5, "Allah'ın kendilerine keşfettiği şeyle bazı kavimlerin akıbetlerini bilebilirler."], [1776.0, "Fakat bu, genel olarak tasdik edilmesi vâcip olan şeylerden değildir."], [1780.0, "Çünkü kendisine bu keşfin hâsıl olduğu zannedilen kimselerin çoğu bu konuda haktan hiçbir şey ifade etmeyen bir zan ile zannetmektedir."], [1790.1, "Mükâşefât ve muhâtabât (keşif ve hitap) ehli, ictihad mahallerindeki nazar ve istidlâl ehli gibi kâh isabet eder, kâh hata eder."], [1800.0, "Bu sebeple hepsinin Allah'ın Kitabı'na ve Resûlü sallallâhu aleyhi ve sellem'in sünnetine sarılmaları,"]]}, {"reader": false, "ar": [[1806.0, "وأن يَزِنوا مواجيدَهم ومشاهداتِهم وآراءَهم ومعقولاتِهم بكتاب الله وسنّة رسوله صلى الله عليه وسلم،"], [1814.0, "ولا يكتفوا بمجرّد ذلك."], [1817.0, "فإنّ سيّد المحدَّثين والمخاطَبين المُلهَمين في هذه الأمّة هو عمرُ بن الخطّاب رضي الله عنه،"], [1824.0, "وقد كانت تقع له وقائعُ فيردّها عليه رسولُ الله صلى الله عليه وسلم،"], [1829.0, "أو صدِّيقُه» ـ يعني: أبا بكرٍ الصدّيق رضي الله عنه ـ «التابعُ له، الآخذُ عنه، الذي هو أكملُ من المحدَّث الذي يُحدّثه قلبُه عن ربّه. ولهذا وجب على جميع الخلق اتّباعُ الرسول صلى الله عليه وسلم»."], [1846.1, "انتهى كلامه. وخلاصتُه: أنّ التصديق العامّ لا يستلزم تصديقَ الأعيان؛"], [1854.0, "أنّ التصديق بالكرامات على وجه العموم لا يستلزم أن نُصدّق بكلّ من يدّعي كرامةً بعينها. والله أعلم."]], "tr": [[1806.0, "vecdlerini, müşahedelerini, görüşlerini ve akılla vardıkları şeyleri Allah'ın Kitabı ve Resûlü sallallâhu aleyhi ve sellem'in sünnetiyle tartmaları ve sadece bunlarla yetinmemeleri vâcip olmuştur."], [1817.5, "Çünkü bu ümmetteki muhaddeslerin (kalbine söylenenlerin), kendilerine hitap edilenlerin ve ilham olunanların efendisi Ömer b."], [1823.6, "el-Hattâb'dır —Allah ondan razı olsun—."], [1825.5, "Onun başına bazı olaylar gelir, Resûlullah sallallâhu aleyhi ve sellem veya sıddîkı\" —yani Ebû Bekir es-Sıddîk, Allah ondan razı olsun— \"onları reddederdi."], [1835.5, "O (sıddîk), Resûl'e tâbi olan, ondan alan ve kalbi kendisine Rabbinden bir şey söyleyen muhaddesten daha kâmil olandır."], [1841.9, "Bu sebeple bütün halka Resûl sallallâhu aleyhi ve sellem'e uymak vâcip olmuştur.\" Sözü bitti."], [1847.7, "Özeti şudur: Genel tasdik, tek tek olayların tasdikini gerektirmez;"], [1854.5, "kerâmetleri genel olarak tasdik etmek, belirli bir kerâmet iddia eden herkesi tasdik etmemizi gerektirmez. Allah en iyisini bilir."]]}]}, {"ts": "31:03", "title": "7. Külliye: Amelle birlikte olan haktan kalplere atılan her şey kerâmettir", "paras": [{"reader": false, "ar": [[1863.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما يُقذف في القلوب من الحقّ المقرون بالعمل فكرامة.<\/b> <span class=\"note\">(يكررها)<\/span> ـ ما شاء الله ـ <b>كلُّ ما يُقذف في القلوب من الحقّ المقرون بالعمل فكرامة.<\/b>"]], "tr": [[1863.0, "Külliyelerden biri de şudur: 7."], [1865.5, "külliye: Amelle birlikte olan haktan kalplere atılan her şey kerâmettir.<b> (Tekrar ediyor.) —Mâşallah.— <\/b>7."], [1871.0, "külliye: Amelle birlikte olan haktan kalplere atılan her şey kerâmettir."]]}, {"reader": false, "ar": [[1889.0, "أقول وبالله التوفيق: ودليلُ ذلك قولُ النبيّ صلى الله عليه وسلم ـ كما في «الصحيحين» ـ:"], [1899.0, "«إنه قد كان فيما مضى قبلكم من الأمم محدَّثون، وإنه إن كان في أمّتي هذه منهم فإنه عمرُ بن الخطّاب» رضي الله تعالى عنه."], [1912.0, "وهذا التحديثُ هو ما نقصده بهذه الكلّيّة،"], [1917.0, "وهو: أن يقذف الله عز وجل في قلب الوليّ علمًا ضروريًّا لا يستطيع هو نفسُه أن يُكذّبه،"], [1926.0, "أو أن يُشكّك فيه،"], [1927.5, "أو أن يطعن فيه."]], "tr": [[1889.0, "Tevfik Allah'tandır, derim ki: Bunun delili Peygamber sallallâhu aleyhi ve sellem'in \"Sahîhayn\"da geçen şu sözüdür:"], [1899.7, "\"Sizden önce geçmiş ümmetlerde muhaddesler (kendilerine ilham olunan kimseler) vardı."], [1906.4, "Eğer benim bu ümmetimde onlardan biri varsa, o da Ömer b."], [1911.8, "el-Hattâb'dır\" —Allah ondan razı olsun—."], [1914.9, "Bu külliyeyle kastettiğimiz şey bu tahdîstir."], [1918.3, "O da şudur: Allah Azze ve Celle'nin velînin kalbine, kendisinin dahi yalanlayamayacağı, şüphe edemeyeceği veya itiraz edemeyeceği zarurî bir ilim atmasıdır."]]}, {"reader": false, "ar": [[1929.0, "ويؤيّد ذلك ما في الحديث الذي رواه الترمذيّ عن عبد الله بن مسعودٍ رضي الله عنه قال:"], [1936.3, "قال النبيّ صلى الله عليه وسلم:"], [1938.0, "«إنّ للشيطان لَمّةً بابن آدم، وإنّ للملَك لَمّةً» ـ وهذه اللَّمّةُ هي التحديث ـ «فأمّا لمّةُ الشيطان فإيعادٌ بالشرّ وتكذيبٌ بالحقّ، وأمّا لمّةُ الملَك فإيعادٌ بالخير وتصديقٌ بالحقّ، فمن وجد ذلك» ـ أي:"], [1965.4, "لمّةَ الملَك ـ «فليعلم أنها من الله فليحمد الله، ومن وجد الأخرى» ـ أي:"], [1972.8, "لمّةَ الشيطان ـ «فليستعذ بالله من الشيطان الرجيم»،"], [1977.0, "ثم تلا: <span class=\"ayah\">﴿الشَّيْطَانُ يَعِدُكُمُ الْفَقْرَ وَيَأْمُرُكُم بِالْفَحْشَاءِ ۖ وَاللَّهُ يَعِدُكُم مَّغْفِرَةً مِّنْهُ وَفَضْلًا﴾<\/span> <span class=\"ref\">[البقرة: ٢٦٨]<\/span>، الآيةَ بتمامها."]], "tr": [[1929.0, "Bunu, Tirmizî'nin Abdullah b. Mes'ûd'dan —Allah ondan razı olsun— rivayet ettiği hadis de destekler."], [1933.8, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1936.3, "\"Şeytanın Âdemoğluna bir dokunuşu (lemmesi) vardır, meleğin de bir dokunuşu vardır\" —bu lemme tahdîstir— \"Şeytanın dokunuşu, kötülükle tehdit etmek ve hakkı yalanlamaktır."], [1947.0, "Meleğin dokunuşu ise hayır vaat etmek ve hakkı tasdik etmektir."], [1954.7, "Kim bunu\" —yani meleğin dokunuşunu— \"bulursa, onun Allah'tan olduğunu bilsin ve Allah'a hamd etsin."], [1966.6, "Kim de diğerini\" —yani şeytanın dokunuşunu— \"bulursa, kovulmuş şeytandan Allah'a sığınsın.\" Sonra şu ayeti okudu:"], [1974.0, "<span class=\"ayah\">﴿Şeytan sizi fakirlikle korkutur ve size çirkinliği emreder. Allah ise size kendinden bir mağfiret ve lütuf vaat eder﴾<\/span> [Bakara 268], ayetin tamamı."]]}, {"reader": false, "ar": [[1987.0, "فما يُلقيه الله عز وجل في قلوب بعض عباده ـ انتبه ـ بإدراك الحقّ في قضيّةٍ قد تُشكل على الأمّة،"], [1997.0, "سواءٌ كانت قضيّةً فرديّةً أو جماعيّة،"], [2001.0, "ويضطرب الناسُ في معرفة المَخرج منها،"], [2006.0, "فيحتاج الناسُ فيها إلى أن يعرفوا وجهَ الحقّ لالتباس النظر فيها أو تعدّد وجوه النظر فيها؛"], [2015.0, "فالله عز وجل قد يُلقي في قلوب بعض العباد إدراكَ الحقّ في هذه الجزئيّة،"], [2020.0, "ويخرج على الأمّة بقولٍ تعمل به وتخرج من مأزقها."], [2026.0, "فيُسمّى هذا إلهامًا، ويُسمّى تحديثًا،"], [2029.7, "ويُسمّى فراسةً. لكن من المعلوم أنه ليس عن طريق الوحي الذي تحصل به النبوّة،"], [2040.0, "وإنما هو عن طريق هذا الكشف الذي يقذفه الله عز وجل في قلب هذا الوليّ،"], [2050.0, "وهذا فتحٌ من الله عز وجل للعبد."]], "tr": [[1987.0, "Allah Azze ve Celle'nin bazı kullarının kalplerine —dikkat et— ümmete müşkil gelebilen bir meselede hakkı idrak etmeyi atması:"], [1996.5, "Bu mesele ister ferdî ister toplumsal olsun, insanlar ondan çıkış yolunu bilmede karışıklığa düşmüş olsun ve ona bakışın karışıklığı veya bakış açılarının çokluğu sebebiyle insanlar onda hakkın yönünü bilmeye muhtaç olsun."], [2015.0, "Allah Azze ve Celle bazı kulların kalplerine bu cüz'î meselede hakkı idrak etmeyi atabilir;"], [2020.0, "o da ümmete, onunla amel edip içinde bulunduğu çıkmazdan kurtulacağı bir sözle çıkar."], [2028.2, "Buna ilham denir, tahdîs denir, firâset denir."], [2035.5, "Fakat bilindiği gibi bu, nübüvvetin kendisiyle hâsıl olduğu vahiy yoluyla değildir;"], [2040.7, "bilakis Allah Azze ve Celle'nin bu velînin kalbine attığı bu keşif yoluyladır."], [2048.7, "Bu, Allah Azze ve Celle'den kula bir fetihtir (açılımdır)."]]}, {"reader": false, "ar": [[2053.0, "فعمرُ بن الخطّاب رضي الله عنه اشتهرت عنه مواقفُ ألهمه الله عز وجل فيها للحقّ،"], [2059.0, "حتى كان يقول رضي الله تعالى عنه:"], [2062.2, "«وافقتُ ربّي في ثلاث»،"], [2064.0, "فكان ينطق بالكلمة وينزل الوحيُ موافقًا لقول عمر."], [2071.0, "وقد أخذ النبيُّ صلى الله عليه وسلم بكثيرٍ من آرائه،"], [2076.0, "والتي منها ما في «الصحيحين» من حديث ابن عمر رضي الله عنهما قال:"], [2082.0, "«لمّا قدم المسلمون المدينةَ كانوا يجتمعون فيتحيّنون الصلاة، ليس يُنادي بها أحد، فتكلّموا يومًا في ذلك، فقال بعضهم: اتّخذوا ناقوسًا مثل ناقوس النصارى، وقال بعضهم: بل قرنًا مثل قرن اليهود، فقال عمر: يا رسول الله، أوَلا تبعثون رجلًا يُنادي بالصلاة؟ فقال النبيّ صلى الله عليه وسلم: يا بلال، قم فنادِ بالصلاة»."]], "tr": [[2053.0, "Ömer b. el-Hattâb'dan —Allah ondan razı olsun— Allah Azze ve Celle'nin kendisine hakkı ilham ettiği pek çok tavır meşhur olmuştur."], [2060.4, "Hatta —Allah ondan razı olsun— \"Üç şeyde Rabbime muvafakat ettim\" derdi."], [2065.4, "Bir söz söylerdi, vahiy de Ömer'in sözüne uygun olarak inerdi."], [2072.5, "Peygamber sallallâhu aleyhi ve sellem onun görüşlerinin çoğunu benimsemiştir."], [2076.9, "Bunlardan biri \"Sahîhayn\"da İbn Ömer'in —Allah ikisinden razı olsun— şu hadisinde geçendir:"], [2082.0, "\"Müslümanlar Medine'ye geldiklerinde toplanır, namaz vaktini kollarlardı;"], [2085.5, "kimse namaza çağırmazdı. Bir gün bu konuda konuştular."], [2089.9, "Bazıları: Hristiyanların çanı gibi bir çan edinin, dedi."], [2093.1, "Bazıları: Hayır, Yahudilerin borusu gibi bir boru (edinin), dedi."], [2097.4, "Ömer: Ey Allah'ın Resûlü, namaza çağıracak bir adam göndermez misiniz?"], [2102.5, "dedi. Peygamber sallallâhu aleyhi ve sellem:"], [2104.5, "Ey Bilâl, kalk ve namaza çağır, buyurdu.\""]]}]}, {"ts": "35:07", "title": "7. Külliye (devam): Firâset örnekleri, İbnü'l-Kayyim'in naklettiği İbn Teymiyye'nin firâseti", "paras": [{"reader": false, "ar": [[2107.0, "هذا مع أنّ النبيّ صلى الله عليه وسلم معصومٌ والله يُوحي إليه،"], [2112.0, "ولكن لم يمنعه ذلك من أن يأخذ بقول عمر؛"], [2115.0, "لعلمه بأنه من الفتح الذي ألقاه الله عز وجل على قلب عمر."], [2119.0, "وقال ابنُ مسعودٍ رضي الله تعالى عنه:"], [2123.2, "«أفرسُ الناس ثلاثة: العزيزُ في يوسف حيث قال لامرأته: <span class=\"ayah\">﴿أَكْرِمِي مَثْوَاهُ عَسَىٰ أَن يَنفَعَنَا أَوْ نَتَّخِذَهُ وَلَدًا﴾<\/span> <span class=\"ref\">[يوسف: ٢١]<\/span>، وابنةُ شعيبٍ حين قالت لأبيها في موسى: <span class=\"ayah\">﴿اسْتَأْجِرْهُ ۖ إِنَّ خَيْرَ مَنِ اسْتَأْجَرْتَ الْقَوِيُّ الْأَمِينُ﴾<\/span> <span class=\"ref\">[القصص: ٢٦]<\/span>، وأبو بكرٍ في عمر رضي الله تعالى عنه حين استخلفه»."], [2144.0, "وفي روايةٍ أخرى: «وامرأةُ فرعون حين قالت: <span class=\"ayah\">﴿قُرَّتُ عَيْنٍ لِّي وَلَكَ ۖ لَا تَقْتُلُوهُ عَسَىٰ أَن يَنفَعَنَا أَوْ نَتَّخِذَهُ وَلَدًا﴾<\/span> <span class=\"ref\">[القصص: ٩]<\/span>»."]], "tr": [[2107.0, "Bu, Peygamber sallallâhu aleyhi ve sellem masum olduğu ve Allah ona vahyettiği hâlde böyledir."], [2111.2, "Fakat bu, onu Ömer'in sözünü almaktan alıkoymadı;"], [2113.0, "çünkü onun, Allah Azze ve Celle'nin Ömer'in kalbine attığı fetihten olduğunu biliyordu."], [2116.0, "İbn Mes'ûd —Allah ondan razı olsun— şöyle demiştir:"], [2118.0, "\"İnsanların firâseti en kuvvetli olanı üç kişidir:"], [2120.2, "Yûsuf hakkında Azîz; zira hanımına şöyle dedi:"], [2123.8, "<span class=\"ayah\">﴿Ona güzel bak; belki bize faydası dokunur veya onu evlat ediniriz﴾<\/span> [Yûsuf 21]."], [2129.0, "Şuayb'ın kızı; Mûsâ hakkında babasına şöyle dediğinde:"], [2131.9, "<span class=\"ayah\">﴿Onu ücretle tut; çünkü ücretle tuttuğun en hayırlı kimse, güçlü ve güvenilir olandır﴾<\/span> [Kasas 26]."], [2138.0, "Ve Ebû Bekir, Ömer'i —Allah ondan razı olsun— halife tayin ettiğinde onun hakkında.\" Başka bir rivayette:"], [2143.2, "\"Ve Firavun'un hanımı, şöyle dediğinde:"], [2144.6, "<span class=\"ayah\">﴿(Bu çocuk) benim için de senin için de bir göz aydınlığıdır. Onu öldürmeyin; belki bize faydası dokunur veya onu evlat ediniriz﴾<\/span> [Kasas 9].\""]]}, {"reader": false, "ar": [[2155.0, "وكان الصدّيقُ رضي الله تعالى عنه من أعظم الناس في مثل هذا،"], [2160.0, "وبعده عمرُ رضي الله عنه."], [2162.9, "والوقائعُ في ذلك كثيرة،"], [2164.9, "قد ذكر طرفًا منها الإمامُ ابنُ القيّم رحمه الله تعالى في كتابه «الطرق الحُكميّة في السياسة الشرعيّة»."], [2173.0, "ولا نزال نُحسّ بذلك،"], [2175.2, "ويُحسّ به كثيرٌ من الناس:"], [2178.0, "أنّ الإنسان قد تُشكل عليه مسألةٌ علميّة،"], [2181.2, "ثم يُقذف في قلبه الحقُّ فيها،"], [2184.0, "أو يرى الحقَّ في رؤيا يُجريها الله عز وجل على قلبه في منامه،"], [2192.0, "بل قد يُجري الله عز وجل الحقَّ على يد طالبٍ من طلّابه،"], [2197.0, "فتكون كلمةُ هذا الطالب من الحقّ الذي قذفه الله في قلب الطالب ليُخبر به هذا الشيخ."], [2203.0, "وقد جرى من القصص في مثل ذلك ما يطول المقامُ بذكره تفصيلًا."]], "tr": [[2155.0, "Sıddîk —Allah ondan razı olsun— bu konuda insanların en büyüklerindendi;"], [2159.2, "ondan sonra da Ömer —Allah ondan razı olsun—."], [2164.0, "Bu konudaki olaylar çoktur; İmam İbnü'l-Kayyim —Allah ona rahmet etsin— \"et-Turuku'l-hükmiyye fi's-siyâseti'ş-şer'iyye\" adlı kitabında bunlardan bir kısmını zikretmiştir."], [2173.6, "Bunu hâlâ hissediyoruz, insanların çoğu da hissediyor:"], [2178.0, "İnsana ilmî bir mesele müşkil gelir, sonra o meseledeki hak kalbine atılır;"], [2184.0, "ya da hakkı, Allah Azze ve Celle'nin uykusunda kalbine gösterdiği bir rüyada görür."], [2192.4, "Hatta Allah Azze ve Celle hakkı onun talebelerinden birinin eliyle ortaya çıkarabilir;"], [2197.8, "bu talebenin sözü, Allah'ın bu hocaya haber vermesi için talebenin kalbine attığı haktan olur."], [2204.3, "Bu konuda, ayrıntılı olarak anlatılması uzun sürecek kıssalar yaşanmıştır."]]}, {"reader": false, "ar": [[2211.0, "ولكنّ هذا الأمر يرجع إلى قوّة إيمان القلب،"], [2216.0, "وقوّة صفاء النفس، ومدى ارتباط العبد بالله عز وجل."], [2222.0, "ولذلك كان بعضُ السلف رحمهم الله يقول:"], [2225.0, "«من غضّ بصرَه عن المحارم، وأمسك نفسَه عن الشهوات، وعمّر باطنَه بالمراقبة، وظاهرَه باتّباع السنّة، وتعوّد أكلَ الحلال، لم تُخطئ فراستُه»."]], "tr": [[2211.0, "Fakat bu iş kalbin imanının kuvvetine, nefsin saflığının kuvvetine ve kulun Allah Azze ve Celle'ye bağlılığının derecesine bağlıdır."], [2220.7, "Bu sebeple selefin bazısı —Allah onlara rahmet etsin— şöyle derdi:"], [2224.6, "\"Kim gözünü haramlardan sakınır, nefsini şehvetlerden tutar, iç dünyasını murâkabe ile, dışını da sünnete uymakla imar eder ve helâl yemeyi âdet edinirse, firâseti hata etmez.\""]]}, {"reader": false, "ar": [[2239.0, "وقال الإمامُ ابنُ القيّم رحمه الله،"], [2243.0, "وهو يحكي شيئًا من هذا الأمر الذي تذكره هذه الكلّيّة،"], [2249.0, "قال: «ولقد شاهدتُ من فراسة شيخ الإسلام ابن تيميّة أمورًا عجيبة، وما لم أشاهده منها أعظمُ وأعظم، ووقائعُ فراسته تستدعي سِفرًا ضخمًا. أخبر أصحابَه بدخول التتار الشامَ سنة تسعٍ وتسعين وستّمائة، وأنّ جيوش المسلمين تُكسَر، وأنّ دمشق لا يكون بها قتلٌ عامٌّ ولا سبيٌ عامّ، وأنّ كَلَبَ الجيش وحِدّتَه في الأموال، وهذا قبل أن يهمّ التتارُ بالحركة."]], "tr": [[2239.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— bu külliyenin zikrettiği bu işten bir kısmını hikâye ederken şöyle demiştir:"], [2249.0, "\"Şeyhülislâm İbn Teymiyye'nin firâsetinden hayret verici şeyler müşahede ettim;"], [2253.1, "müşahede etmediklerim ise çok daha büyüktür."], [2257.1, "Firâsetinin olayları büyük bir cildi gerektirir."], [2262.4, "Ashâbına Tatarların altı yüz doksan dokuz senesinde Şam'a gireceğini, Müslüman ordularının bozguna uğrayacağını, Dımaşk'ta genel bir katliam ve genel bir esir alma olmayacağını, ordunun hırsının ve şiddetinin mallara yöneleceğini haber verdi."], [2282.0, "Bu, Tatarlar harekete geçmeye niyetlenmeden önceydi."]]}, {"reader": false, "ar": [[2288.0, "ثم أخبر الناسَ بعد ذلك وأخبر الأمراءَ سنة اثنتين وسبعمائة،"], [2293.0, "لمّا تحرّك التتارُ وقصدوا الشام،"], [2296.0, "أنّ الدائرة والهزيمة عليهم،"], [2299.0, "وأنّ الظفر والنصر للمسلمين،"], [2302.0, "وأقسم على ذلك أكثرَ من سبعين يمينًا،"], [2305.0, "فيُقال له: قل إن شاء الله،"], [2307.0, "فيقول: إن شاء الله تحقيقًا لا تعليقًا."], [2311.0, "وسمعتُه يقول ذلك. قال:"], [2312.5, "فلمّا أكثروا عليّ قلتُ:"], [2314.9, "لا تُكثروا، كتب الله تعالى في اللوح المحفوظ أنهم مهزومون في هذه الكَرّة،"], [2322.0, "وأنّ النصر لجيوش الإسلام."], [2325.0, "قال: وأطمعتُ بعضَ الأمراء والعسكر» ـ عفوًا ـ «وأطعمتُ بعضَ الأمراء والعسكر حلاوةَ النصر قبل خروجهم إلى لقاء العدوّ»."], [2335.0, "وزّع عليهم حلاوة. والله أعلم."]], "tr": [[2288.0, "Sonra bundan sonra, yedi yüz iki senesinde Tatarlar harekete geçip Şam'a yöneldiklerinde, insanlara ve emirlere felaketin ve hezimetin onların üzerine olacağını, zafer ve yardımın Müslümanlara ait olacağını haber verdi."], [2302.4, "Buna yetmişten fazla yemin etti."], [2304.1, "Kendisine: İnşallah de, deniliyordu. O da:"], [2306.0, "Ta'lîk (şarta bağlama) olarak değil, tahkik (kesinlik) olarak inşallah, diyordu."], [2310.4, "Onu bunu söylerken işittim. Dedi ki:"], [2312.5, "Bana çok ısrar edince, dedim ki:"], [2315.9, "Çok ısrar etmeyin; Allah Teâlâ Levh-i Mahfûz'a onların bu seferde yenileceklerini ve zaferin İslâm ordularına ait olduğunu yazmıştır."], [2324.2, "Dedi ki: Bazı emirleri ve askerleri ümitlendirdim\" —pardon— \"bazı emirlere ve askerlere, düşmanla karşılaşmaya çıkmadan önce zafer tatlısı yedirdim.\" Onlara tatlı dağıttı. Allah en iyisini bilir."]]}]}, {"ts": "38:58", "title": "8. Külliye: Hakka yardımcı olan her sadık rüya kerâmettir", "paras": [{"reader": false, "ar": [[2339.6, "ومن الكلّيّات أيضًا: <b>كلُّ رؤيا صادقةٍ مُعينةٍ على حقٍّ فكرامة.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها ثالثةً:"], [2363.4, "<b>كلُّ رؤيا صادقةٍ مُعينةٍ على حقٍّ فكرامة.<\/b>"]], "tr": [[2339.6, "Külliyelerden biri de şudur: 8."], [2342.0, "külliye: Hakka yardımcı olan her sadık rüya kerâmettir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [2363.4, "<b>8. külliye: Hakka yardımcı olan her sadık rüya kerâmettir.<\/b>"]]}, {"reader": false, "ar": [[2369.0, "أقول وبالله التوفيق: ولا جرمَ في ذلك،"], [2372.7, "كما قرّره كثيرٌ من علماء أهل السنّة والجماعة؛"], [2377.0, "فمن جملة كرامات المؤمن صدقُ رؤياه إذا كانت مُعينةً على الحقّ،"], [2382.0, "فإنّ رؤيا المؤمن قد تصدق كثيرًا."], [2386.0, "فقد قال رسولُ الله صلى الله عليه وسلم:"], [2389.5, "«إذا اقترب الزمانُ لم تكد رؤيا المؤمن تكذب، وأصدقُهم رؤيا أصدقُهم حديثًا، ورؤيا المسلم جزءٌ من ستّةٍ وأربعين جزءًا من النبوّة»،"], [2405.0, "خرّجه عبدُ الرزّاق بإسنادٍ صحيح."]], "tr": [[2369.0, "Tevfik Allah'tandır, derim ki: Bunda şüphe yoktur;"], [2372.2, "Ehl-i Sünnet ve'l-Cemaat âlimlerinin birçoğunun takrir ettiği gibi."], [2376.5, "Mü'minin kerâmetleri cümlesinden biri, hakka yardımcı olduğunda rüyasının sadık çıkmasıdır;"], [2380.6, "çünkü mü'minin rüyası çoğu zaman sadık çıkabilir."], [2384.7, "Resûlullah sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2387.8, "\"Zaman yaklaştığında mü'minin rüyası neredeyse hiç yalan çıkmaz."], [2391.2, "Rüyası en sadık olanları, sözü en doğru olanlarıdır."], [2395.6, "Müslüman'ın rüyası nübüvvetin kırk altı cüzünden bir cüzdür.\" Bunu Abdürrezzâk sahih bir senetle rivayet etmiştir."]]}, {"reader": false, "ar": [[2409.0, "ومن ذلك ما أراه الله عز وجل كثيرًا من أوليائه،"], [2416.0, "فحصلت في واقع الأمر كما أراهم الله عز وجل تمامًا."], [2424.0, "فمن رأى رؤيا سارّةً فهي بُشرى له،"], [2428.0, "وكذلك إذا رآها لغيره فيُستحبّ له أن يُبشّره بها إن علم أو غلب على ظنّه عدمُ اغتراره بها."], [2437.0, "وهي تُعتبر من الكرامة إذا عُرف صاحبُها بالاستقامة على الطاعة،"], [2443.8, "وكانت مُعينةً له على إحقاق الحقّ أو إبطال الباطل."]], "tr": [[2409.0, "Bundan biri de Allah Azze ve Celle'nin velîlerinden birçoğuna gösterdiği ve Allah Azze ve Celle'nin onlara gösterdiği gibi aynen vâkıada gerçekleşen (rüyalardır)."], [2424.0, "Kim sevindirici bir rüya görürse bu onun için bir müjdedir."], [2429.0, "Aynı şekilde başkası için görürse, onun buna aldanmayacağını bilirse veya buna zannı galip olursa, onu bununla müjdelemesi müstehaptır."], [2437.7, "Sahibi taat üzere istikametle tanınırsa ve rüya onun hakkı ikame etmesine veya bâtılı iptal etmesine yardımcı olursa, kerâmetten sayılır."]]}, {"reader": false, "ar": [[2449.0, "وقد عدّها رسولُ الله صلى الله عليه وسلم من المبشِّرات،"], [2454.0, "فقال صلى الله عليه وسلم:"], [2456.3, "«إنه لم يبقَ من مبشِّرات النبوّة إلا الرؤيا الصالحة، يراها المسلمُ أو تُرى له»،"], [2462.0, "أخرجه مسلمٌ في «الصحيح»."], [2464.0, "وفي روايةٍ للبخاريّ: «لم يبقَ من النبوّة إلا المبشِّرات»،"], [2469.0, "قالوا: وما المبشِّرات؟ قال:"], [2471.7, "«الرؤيا الصالحة». وقال صلى الله عليه وسلم:"], [2475.2, "«الرؤيا الصالحةُ من الله، والرؤيا السوءُ من الشيطان»،"], [2479.0, "أخرجه مسلم. والكلامُ عليها واضح."]], "tr": [[2449.0, "Resûlullah sallallâhu aleyhi ve sellem onu müjdeleyiciler arasında saymış ve şöyle buyurmuştur:"], [2454.5, "\"Nübüvvetin müjdeleyicilerinden, Müslüman'ın gördüğü veya onun için (başkasına) gösterilen sâlih rüyadan başka bir şey kalmadı.\" Bunu Müslim \"Sahîh\"inde rivayet etmiştir."], [2462.5, "Buhârî'nin bir rivayetinde: \"Nübüvvetten müjdeleyicilerden başka bir şey kalmadı.\" Dediler ki:"], [2467.9, "Müjdeleyiciler nedir? Buyurdu ki: \"Sâlih rüyadır.\" Yine sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2474.8, "\"Sâlih rüya Allah'tandır, kötü rüya şeytandandır.\" Bunu Müslim rivayet etmiştir. Bu konudaki söz açıktır."]]}]}, {"ts": "41:23", "title": "9. Külliye: Bütün kerâmetler Allah'tandır; onların gereği şükür, onlara güvenip dayanmamak ve ucba kapılmamaktır", "paras": [{"reader": false, "ar": [[2483.0, "ومن الكلّيّات أيضًا ـ ولعلّه آخرُها ـ:"], [2486.0, "كلُّ الكرامات من الله،"], [2488.4, "فواجبُها الشكرُ وعدمُ الاتّكال والإعجابِ بالنفس. <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[2483.0, "Külliyelerden biri de —belki de sonuncusu— şudur:"], [2485.4, "9. külliye: Bütün kerâmetler Allah'tandır;"], [2487.2, "onların gereği şükür, (onlara) güvenip dayanmamak ve nefse hayran olmamaktır. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[2492.0, "أقول وبالله التوفيق: وذلك لأنّ الكرامة نعمةٌ عظيمةٌ من الله عز وجل،"], [2513.0, "وإنّ واجبَ النِّعَم هو الشكر."], [2516.0, "فإذا أجرى الله عز وجل على يدك شيئًا من الكرامات فيجب عليك أن تشكر الله عز وجل على هذه النعمة؛"], [2524.0, "فإنّ الأدلّة الدالّة على وجوب شكر المنعم كثيرةٌ جدًّا."], [2531.0, "بل إنّ الله عز وجل قد يُجري على يديك كراماتٍ كثيرةً إذا شكرتَ الكرامةَ الأولى،"], [2537.0, "لقول الله عز وجل:"], [2538.0, "<span class=\"ayah\">﴿وَإِذْ تَأَذَّنَ رَبُّكُمْ لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ ۖ وَلَئِن كَفَرْتُمْ إِنَّ عَذَابِي لَشَدِيدٌ﴾<\/span> <span class=\"ref\">[إبراهيم: ٧]<\/span>."]], "tr": [[2492.0, "Tevfik Allah'tandır, derim ki: Bu böyledir;"], [2494.7, "çünkü kerâmet Allah Azze ve Celle'den büyük bir nimettir;"], [2513.0, "nimetlerin gereği de şükürdür. Allah Azze ve Celle senin elinle kerâmetlerden bir şey gerçekleştirdiğinde, bu nimet için Allah Azze ve Celle'ye şükretmen vâcip olur;"], [2522.5, "çünkü nimet verene şükretmenin vâcip olduğuna delalet eden deliller pek çoktur."], [2526.8, "Hatta ilk kerâmetin şükrünü edersen, Allah Azze ve Celle senin elinle pek çok kerâmet gerçekleştirebilir."], [2534.2, "Zira Allah Azze ve Celle şöyle buyurur:"], [2536.5, "<span class=\"ayah\">﴿Hani Rabbiniz şöyle bildirmişti: Andolsun, eğer şükrederseniz elbette size (nimetimi) artırırım; eğer nankörlük ederseniz, şüphesiz azabım çok şiddetlidir﴾<\/span> [İbrâhîm 7]."]]}, {"reader": false, "ar": [[2545.0, "ومع واجب الشكر فالواجبُ الحذرُ من مَزلقين فيها:"], [2551.0, "المزلقُ الأول: مزلقُ الاتّكال على هذه الكرامة؛"], [2555.0, "فلا يجوز أن تحملك الكرامةُ على تعطيل شيءٍ من المأمورات اتّكالًا عليها،"], [2561.0, "أو اقتراف شيءٍ من المحظورات اتّكالًا عليها،"], [2564.0, "ظنًّا منك أنّ الله ما أجرى على يدك هذه الكرامة إلا لأنه قد جعلك من أهل الجنّة،"], [2572.0, "أو ممّن رضي عنهم فلا يسخط عليهم أبدًا،"], [2577.0, "أو ممّن نظر له بعين الرضا النظرَ الدائم."], [2581.0, "ولذلك منع النبيُّ صلى الله عليه وسلم معاذًا أن يُخبر الناسَ بما حدّثه به في الحديث المعروف،"], [2591.0, "خشيةَ أن يتّكل الناسُ على هذه الكلمة."]], "tr": [[2545.0, "Şükür vâcibiyle birlikte bu konuda iki kaygan zeminden sakınmak da vâciptir."], [2552.1, "Birinci kaygan zemin: Bu kerâmete güvenip dayanma kaygan zeminidir."], [2556.5, "Kerâmetin, ona güvenerek emredilenlerden bir şeyi terk etmeye veya ona güvenerek yasaklanmış şeylerden birini işlemeye seni sevk etmesi caiz değildir."], [2564.8, "(Bunu) Allah'ın bu kerâmeti senin elinle, ancak seni cennet ehlinden kıldığı için veya razı olup kendilerine asla gazap etmeyeceği kimselerden ya da kendisine daimî rıza nazarıyla baktığı kimselerden kıldığı için gerçekleştirdiğini zannederek (yapman caiz değildir)."], [2581.7, "Bu sebeple Peygamber sallallâhu aleyhi ve sellem, bilinen hadiste, insanların bu söze güvenip (amelsiz) kalmasından korkarak Muâz'ı kendisine söylediği şeyi insanlara haber vermekten men etti."]]}, {"reader": false, "ar": [[2595.0, "بل ينبغي للمؤمن إذا أجرى الله عز وجل على يده شيئًا من هذه الكرامات أن تكون مُعينةً له على الازدياد من عظيم التعبّد والشكر لله عز وجل."], [2608.0, "وإنّ من أعظم كرامات المؤمن أن يُبشَّر بالجنّة في حياته،"], [2613.0, "وإنّ النبيّ صلى الله عليه وسلم أخبرنا عن عددٍ من الصحابة أنهم من أهل الجنّة،"], [2621.0, "وما زادهم ذلك إلا إيمانًا وتسليمًا وعملًا وثقةً بالله عز وجل ويقينًا بموعوده؛"], [2630.0, "فلم يُعطّل أحدٌ منهم مأمورًا،"], [2632.7, "ولم يقع في محظور،"], [2634.8, "أو تكاسل عن مندوب."]], "tr": [[2595.0, "Bilakis mü'mine yakışan, Allah Azze ve Celle onun eliyle bu kerâmetlerden bir şey gerçekleştirdiğinde, bunun kendisine Allah Azze ve Celle'ye büyük ibadeti ve şükrü artırmada yardımcı olmasıdır."], [2607.4, "Mü'minin en büyük kerâmetlerinden biri, hayatında cennetle müjdelenmesidir."], [2611.0, "Peygamber sallallâhu aleyhi ve sellem bize sahâbeden bazılarının cennet ehlinden olduğunu haber verdi."], [2617.8, "Bu, onların ancak imanlarını, teslimiyetlerini, amellerini, Allah Azze ve Celle'ye güvenlerini ve O'nun vaadine yakînlerini artırdı."], [2627.1, "Onlardan hiçbiri emredilen bir şeyi terk etmedi, yasak bir şeye düşmedi veya mendup bir şeyde gevşeklik göstermedi."]]}, {"reader": false, "ar": [[2637.0, "بل إنّ النبيّ صلى الله عليه وسلم كان يقوم من الليل حتى تتفطّر قدماه،"], [2645.0, "لمّا أنزل الله عز وجل عليه:"], [2647.6, "<span class=\"ayah\">﴿لِّيَغْفِرَ لَكَ اللَّهُ مَا تَقَدَّمَ مِن ذَنبِكَ وَمَا تَأَخَّرَ﴾<\/span> <span class=\"ref\">[الفتح: ٢]<\/span>،"], [2651.0, "حتى كان يُسأل: لِمَ تصنع هذا وقد غفر الله لك ما تقدّم من ذنبك وما تأخّر؟"], [2656.0, "فيقول: «أفلا أكونُ عبدًا شكورًا؟»."], [2660.0, "فكما أنّ النبيّ صلى الله عليه وسلم يزداد بازدياد المعجزات شكرًا لربّه وتعبّدًا،"], [2668.0, "فكذلك المؤمن إذا أجرى الله عز وجل على يده شيئًا من الكرامات فتكون مُعينةً له على الازدياد على الطاعة والثبات."]], "tr": [[2637.0, "Hatta Peygamber sallallâhu aleyhi ve sellem, Allah Azze ve Celle ona <span class=\"ayah\">﴿Allah senin geçmiş ve gelecek günahlarını bağışlasın diye﴾<\/span> [Fetih 2] ayetini indirdiğinde, ayakları çatlayıncaya kadar geceleyin namaza kalkardı."], [2650.2, "Öyle ki kendisine: Allah senin geçmiş ve gelecek günahlarını bağışlamışken bunu niçin yapıyorsun?"], [2654.4, "diye sorulurdu. O da: \"Çok şükreden bir kul olmayayım mı?\" derdi."], [2660.0, "Peygamber sallallâhu aleyhi ve sellem mucizeler arttıkça Rabbine şükrünü ve ibadetini artırdığı gibi, mü'min de Allah Azze ve Celle onun eliyle kerâmetlerden bir şey gerçekleştirdiğinde, bunlar onun için taatte artışa ve sebata yardımcı olur."]]}, {"reader": false, "ar": [[2676.1, "المزلقُ الثاني: احذر من أن تُعجَب بنفسك،"], [2680.6, "أو أن تمدحها، أو أن تُزكّيها بجريان هذه الكرامة،"], [2687.0, "بل ينبغي لك أن تزيدك الكرامةُ خوفًا من الله عز وجل أن تكون استدراجًا لك."], [2692.0, "فليس كلُّ تيسيرٍ للأمور،"], [2694.0, "أو كلُّ أمرٍ خارقٍ جرى على يد وليٍّ،"], [2698.0, "يكون كرامة؛ فلربّما يكون استدراجًا وأنت لا تدري عن حقيقة الأمر."]], "tr": [[2676.1, "İkinci kaygan zemin: Bu kerâmetin gerçekleşmesi sebebiyle nefsine hayran olmaktan, onu övmekten veya temize çıkarmaktan sakın."], [2685.9, "Bilakis kerâmetin, bunun senin için bir istidrâç olmasından dolayı Allah Azze ve Celle'den korkunu artırması gerekir."], [2692.0, "İşlerin her kolaylaşması veya bir velînin elinde gerçekleşen her hârika iş kerâmet değildir;"], [2698.5, "belki de bu bir istidrâçtır ve sen işin hakikatini bilmiyorsundur."]]}, {"reader": false, "ar": [[2704.0, "وإنما عليك أن تنظر إلى تقصير نفسك،"], [2709.0, "وإلى أنك لا تزال مفتقرًا إلى ربّك الافتقارَ الذاتيّ،"], [2713.0, "مهما أكرمك الله عز وجل بشيءٍ من هذه الكرامات؛"], [2717.0, "فلا تزال تتّهم نفسَك بالتقصير،"], [2720.0, "كما قال الله عز وجل عن عباده الصالحين:"], [2724.0, "<span class=\"ayah\">﴿وَالَّذِينَ يُؤْتُونَ مَا آتَوا وَّقُلُوبُهُمْ وَجِلَةٌ﴾<\/span> <span class=\"ref\">[المؤمنون: ٦٠]<\/span>،"], [2729.0, "وهم الذين يزدادون من الخيرات،"], [2731.3, "ولا يزالون يتّهمون أنفسَهم بالتقصير في جنب الله عز وجل."]], "tr": [[2704.0, "Bilakis sana düşen, nefsinin kusuruna bakmak ve Allah Azze ve Celle sana bu kerâmetlerden bir şeyle ne kadar ikram ederse etsin, Rabbine zâtî bir muhtaçlıkla hâlâ muhtaç olduğuna bakmaktır."], [2717.0, "Böylece nefsini kusurla itham etmeye devam edersin."], [2720.5, "Nitekim Allah Azze ve Celle sâlih kulları hakkında şöyle buyurur:"], [2725.5, "<span class=\"ayah\">﴿Verdiklerini kalpleri ürpererek verenler﴾<\/span> [Mü'minûn 60]."], [2729.5, "Onlar hayırları artıran ve Allah Azze ve Celle'nin hakkında nefislerini kusurla itham etmeye devam edenlerdir."]]}, {"reader": false, "ar": [[2736.0, "ولعلّ هذه الكلّيّة تكون آخرَ الكلّيّات في باب الكرامات."], [2741.0, "والله أعلى وأعلم، وصلى الله وسلم على نبيّنا محمّد."]], "tr": [[2736.0, "Belki de bu külliye kerâmetler babındaki külliyelerin sonuncusu olur."], [2739.3, "Allah en yüce olandır ve en iyisini bilendir."], [2742.2, "Allah Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
