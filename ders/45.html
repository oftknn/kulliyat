<script>
const D={"no": 45, "vid": "I4_yTuMSMOw", "title_ar": "الدرس (٤٥) من شرح كليات العقيدة — من كليات توحيد الألوهية: التبرك ومتعلقاته", "title_tr": "Şerhu Külliyyâti'l-Akîde — 45. Ders: Ulûhiyyet Tevhidi Külliyeleri (Teberrük: Bereketi Koyan Allah'tır, Bereketin Tevkîfî Oluşu, Zaman, Mekân ve Nesnelerde Bereket İddiası, Mânevî-Lâzım ve Zâtî-İntikal Eden Bereket, Peygamber ﷺ'in Eserlerinin Bereketi, Delilsiz Bereket Sebebi Edinmek, Mahlûkun Bizzat Bereket Verdiğine İnanmak, Bereketi Ancak Şer'î Sıfatla Talep Etmek)", "sections": [{"ts": "00:01", "title": "Giriş · 1. Külliye: Her mübareki mübarek kılan Allah'tır", "paras": [{"reader": false, "ar": [[1.0, "الحمدُ لله ربِّ العالمين،"], [3.3, "والصلاةُ والسلامُ على رسول الله الأمين،"], [6.8, "وعلى آله وأصحابه الطيبين الطاهرين،"], [9.7, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [13.2, "لا نزال في سياق الكلام على شرح الكلّيّات المتعلّقة بتوحيد الألوهية،"], [19.6, "وعندنا في هذا الدرس عشرُ كلّيّاتٍ ـ أو قد تزيد قليلًا على حسب الوقت ـ تتكلّم عن مسألة التبرّك ومتعلّقاته."]], "tr": [[1.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [3.3, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [15.5, "Hâlâ ulûhiyyet tevhidine dair külliyelerin şerhi hakkındaki konuşmanın akışı içindeyiz."], [20.7, "Bu derste elimizde —vakte göre biraz artabilir de— teberrük meselesinden ve onun taalluklarından bahseden on külliye var."]]}, {"reader": false, "ar": [[30.0, "فإنّ باب البركة من الأبواب التي دخل ـ بسبب سوء عدم الفهم فيها ـ بدعٌ وشركٌ وصورٌ من مخالفات الشريعة كثيرة."], [45.0, "فهيّا بنا حتى نضبط هذا البابَ بكلّيّاته وقواعده،"], [50.0, "وحتى نتعرّف على ما يجوز منه وما لا يجوز،"], [56.0, "وما هو ممدوحٌ منه وما هو مذموم. فنقول وبالله التوفيق:"]], "tr": [[30.0, "Çünkü bereket babı, onu kötü anlamak (anlamamak) sebebiyle içine bid'atlerin, şirkin ve şeriate muhalefetin pek çok şeklinin girdiği bablardandır."], [45.0, "Haydi, bu babı külliyeleri ve kaideleriyle sağlamca öğrenelim;"], [50.7, "ondan neyin caiz olup neyin caiz olmadığını, neyin övülmüş neyin yerilmiş olduğunu tanıyalım. Tevfik Allah'tandır, deriz ki:"]]}, {"reader": false, "ar": [[62.0, "الكلّيّة الأولى: <b>كلُّ مبارَكٍ فاللهُ مبارِكُه.<\/b> كلُّ مبارَكٍ فاللهُ مبارِكُه."], [68.6, "كلُّ مبارَكٍ ـ بفتح الراء ـ فاللهُ مبارِكُه."]], "tr": [[62.0, "<b>1. külliye: Her mübarek (bereketli kılınmış) şeyi mübarek kılan Allah'tır.<\/b> Her mübareki mübarek kılan Allah'tır."], [68.6, "Her \"mübârek\" —râ harfinin fethasıyla— şeyi mübarek kılan Allah'tır."]]}, {"reader": false, "ar": [[81.0, "أقول وبالله التوفيق: وهذه الكلّيّة متّفقٌ عليها بين أهل السنة والجماعة،"], [87.5, "وهي أنّ واضعَ البركة في الأشياء إنما هو الله عز وجل."], [94.0, "فلا يستطيع لا الملَكُ المقرَّب،"], [96.5, "ولا النبيُّ المرسَل، ولا الوليُّ الصالح أن يضع بركةً في شيءٍ أبدًا؛"], [104.0, "فإنّ وضعَ البركة في الشيء هو من جملة أفعال ربوبيّة الله عز وجل،"], [111.0, "فهو من جملة ما يوصف اللهُ عز وجل به،"], [114.0, "ولذلك التباركُ من جملة صفاته."], [119.0, "فالمخلوقاتُ كلُّها مباركةٌ، والذي وضع البركةَ فيها إنما هو الله عز وجل."]], "tr": [[81.0, "Tevfik Allah'tandır, derim ki: Bu külliye Ehl-i Sünnet ve'l-Cemaat arasında üzerinde ittifak edilmiş bir külliyedir."], [88.7, "O da şudur: Eşyaya bereketi koyan ancak Allah Azze ve Celle'dir."], [95.0, "Ne mukarreb melek, ne gönderilmiş peygamber ne de sâlih velî hiçbir şeye aslâ bereket koyamaz."], [103.4, "Çünkü bir şeye bereket koymak, Allah Azze ve Celle'nin rubûbiyyet fiillerindendir;"], [108.8, "dolayısıyla Allah Azze ve Celle'nin kendisiyle nitelendiği şeylerdendir."], [112.0, "Bu yüzden \"tebâreke\" (bereket ve hayır kaynağı olmak) O'nun sıfatlarındandır."], [117.2, "(Mübarek olan) mahlûkatın hepsi mübarektir;"], [120.2, "onlara bereketi koyan ise ancak Allah Azze ve Celle'dir."]]}, {"reader": false, "ar": [[124.0, "وبناءً على ذلك فلا يجوز أن تنسب وضعَ البركة لأحدٍ من المخلوقات؛"], [130.0, "لأنك إذا فعلتَ ذلك فتكون قد ساويتَه بالله عز وجل في شيءٍ من خصائصه."], [139.0, "وسيأتينا أنّ زعمَ أنّ بعض المخلوقات يضع البركة أنه من جملة الاعتقاد الشركيّ،"], [148.0, "في بعض الكلّيّات الآتية إن شاء الله عز وجل."], [152.0, "فلنتّفق جميعًا على أنّ الله عز وجل هو واضعُ البركة،"], [157.0, "وأنّ وضعَ البركة في الشيء إنما هو من أفعال ربوبيّته،"], [161.0, "وأنّ أحدًا من مخلوقاته ـ وإن عظُم أمرُه ـ لا يستطيع أن يعطي أحدًا شيئًا من البركة."]], "tr": [[124.0, "Buna binaen bereketi koymayı mahlûkattan herhangi birine nispet etmen caiz değildir."], [130.0, "Çünkü bunu yaparsan, onu Allah Azze ve Celle'nin hususiyetlerinden birinde O'na denk tutmuş olursun."], [140.4, "İnşallah ileride gelecek bazı külliyelerde, bazı mahlûkatın bereket koyduğunu iddia etmenin şirk itikadından olduğu gelecek."], [151.1, "Hepimiz şunda ittifak edelim: Bereketi koyan Allah Azze ve Celle'dir;"], [156.5, "bir şeye bereket koymak ancak O'nun rubûbiyyet fiillerindendir;"], [160.2, "O'nun mahlûkatından hiçbiri —işi ne kadar büyük olursa olsun— kimseye bereketten bir şey veremez."]]}, {"reader": false, "ar": [[169.0, "فالذي وضع بركةَ الزمان إنما هو الله عز وجل،"], [173.0, "والذي وضع بركةَ المكان إنما هو الله عز وجل،"], [178.0, "والذي وضع بركةَ الأعيان والأشياء إنما هو الله تبارك وتعالى."], [184.0, "وبناءً على ذلك فإيّاك أن تنسب وضعَ البركة لأحدٍ من المخلوقات فتقول:"], [191.2, "باركَ فلانٌ حفلَنا، أو باركَ فلانٌ درسَنا،"], [195.7, "أو أحلَّ فلانٌ علينا البركةَ بحلوله في مجلسنا، مثلًا."]], "tr": [[169.0, "Zamanın bereketini koyan ancak Allah Azze ve Celle'dir;"], [172.6, "mekânın bereketini koyan ancak Allah Azze ve Celle'dir;"], [176.9, "nesnelerin ve eşyanın bereketini koyan ancak Allah Tebâreke ve Teâlâ'dır."], [182.8, "Buna binaen, sakın bereketi koymayı mahlûkattan birine nispet edip de mesela \"Falan kişi toplantımızı bereketlendirdi\", \"Falan kişi dersimizi bereketlendirdi\" ya da \"Falan kişi meclisimize gelmesiyle üzerimize bereket indirdi\" deme."]]}, {"reader": false, "ar": [[206.0, "فإيّاك أن تنسب البركةَ لأحدٍ من المخلوقين باعتبار أصل وضعها؛"], [213.0, "لأنك حينئذٍ ستساويه بالله عز وجل في شيءٍ من خصائصه."], [218.0, "وهذه قاعدةٌ واضحةٌ ولا إشكال فيها. والله أعلم."]], "tr": [[206.0, "Sakın bereketi, aslen onu koymak itibarıyla mahlûklardan birine nispet etme."], [210.9, "Çünkü o takdirde onu Allah Azze ve Celle'nin hususiyetlerinden birinde O'na denk tutmuş olursun."], [217.0, "Bu açık bir kaidedir, bunda bir müşkil yoktur. Allah en iyisini bilir."]]}]}, {"ts": "03:42", "title": "2. Külliye: Bereket, bütün taalluklarıyla tevkîfîdir", "paras": [{"reader": false, "ar": [[222.0, "الكلّيّة الثانية: <b>كلُّ البركة بمتعلّقاتها توقيفيّة.<\/b> كلُّ البركة بمتعلّقاتها توقيفيّة."]], "tr": [[222.0, "<b>2. külliye: Bereketin tamamı, taalluklarıyla birlikte tevkîfîdir (nassa bağlıdır).<\/b> Bereketin tamamı, taalluklarıyla birlikte tevkîfîdir."]]}, {"reader": false, "ar": [[237.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرّر في القواعد أنّ ما كان غيبيًّا فيكون توقيفيًّا على النصّ."], [251.0, "وإذا قلتُ «توقيفي» فأقصد به:"], [254.3, "أنني لا أقبل شيئًا من متعلّقات البركة إلا إذا جاء مدّعيها بدليلٍ صحيحٍ من كتاب الله عز وجل،"], [264.0, "أو سنّةٍ من سنن النبيّ صلى الله عليه وسلم."], [268.0, "وذلك لأنّ وجودَ البركة في الزمان أمرٌ ليس داخلًا تحت مُدرَكات حواسّنا الخمس،"], [276.0, "والمتقرّر في القواعد أنّ كلَّ ما لا تدركه الحواسّ فهو من الغيب."]], "tr": [[237.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [240.3, "Kaidelerde yerleşik olan şudur: Gaybî olan şey nassa bağlı olarak tevkîfî olur."], [251.7, "\"Tevkîfî\" dediğimde şunu kastediyorum: Bereketin taalluklarından hiçbir şeyi, onu iddia eden kişi Allah Azze ve Celle'nin Kitabı'ndan ya da Peygamber sallallâhu aleyhi ve sellem'in sünnetlerinden bir sünnetten sahih bir delil getirmedikçe kabul etmem."], [269.3, "Çünkü zamanda bereketin bulunması, beş duyumuzun idrak ettiği şeylerin kapsamına girmeyen bir iştir."], [277.3, "Kaidelerde yerleşik olan şudur: Duyuların idrak etmediği her şey gaybdandır."]]}, {"reader": false, "ar": [[284.0, "وبما أنّ البركة في الزمان لا تدركه الحواسّ،"], [288.0, "وبما أنّ البركة في المكان لا تدركه الحواسّ،"], [293.0, "وبما أنّ البركة في الأعيان والأشياء لا تدركها الحواسّ،"], [297.0, "فيكون بابُ البركة بكلّ متعلّقاته من الأبواب التوقيفيّة."]], "tr": [[284.0, "Zamandaki bereketi duyular idrak etmediğine, mekândaki bereketi duyular idrak etmediğine, nesnelerdeki ve eşyadaki bereketi de duyular idrak etmediğine göre, bereket babı bütün taalluklarıyla tevkîfî bablardan olur."]]}]}, {"ts": "05:02", "title": "3. Külliye: Bir zamanda bereket olduğunu iddia edenden delil istenir", "paras": [{"reader": false, "ar": [[302.0, "ويوضّح معنى التوقيفيّة الكلّيّاتُ الآتية،"], [307.0, "وهي الكلّيّة الثالثة: <b>كلُّ من ادّعى بركةً في زمانٍ فمطالَبٌ بالدليل.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[302.0, "Tevkîfî oluşun anlamını şu gelecek külliyeler açıklar."], [305.2, "O da 3. külliyedir: 3."], [312.0, "külliye: Bir zamanda bereket olduğunu iddia eden herkesten delil istenir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[328.0, "أقول وبالله التوفيق: وذلك لأنها مبنيّةٌ على الغيب."], [333.0, "فمتى ما زعم الإنسانُ أنّ هذا الزمانَ مبارك،"], [338.0, "فإننا لا نقبل قولَه إلا إذا جاءنا بدليلٍ صحيحٍ صريح؛"], [343.0, "فإن جاءنا به صحيحًا صريحًا فعلى العين والرأس،"], [348.0, "وإلّا فلا حقَّ لأحدٍ أن يُثبت أمرًا غيبيًّا من عند نفسه،"], [353.0, "أو يُثبته تقليدًا لغيره،"], [356.0, "أو يُثبته هكذا اعتباطًا،"], [358.5, "أو مزاجًا، أو استحسانًا من تلقاء اجتهاده."], [363.0, "فالأمرُ غيبٌ، وما كان غيبيًّا فيكون توقيفيًّا."]], "tr": [[328.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [331.1, "Çünkü bu (iddia) gayb üzerine kuruludur."], [334.9, "İnsan bu zamanın mübarek olduğunu iddia ettiğinde, bize sahih ve açık bir delil getirmedikçe sözünü kabul etmeyiz."], [343.6, "Onu sahih ve açık olarak getirirse başım gözüm üstüne;"], [348.9, "aksi hâlde hiç kimsenin gaybî bir şeyi kendiliğinden, başkasını taklit ederek, öylesine gelişigüzel, keyfine göre ya da kendi içtihadından bir istihsanla ispat etmeye hakkı yoktur."], [363.0, "Mesele gaybdır; gaybî olan da tevkîfî olur."]]}, {"reader": false, "ar": [[369.0, "فإذا قلتَ بأنّ هذه الليلة مباركة فنحن نطالبك بالدليل."], [374.0, "وإذا قلتَ: إنّ هذا النهار مبارك،"], [376.4, "أو هذه الساعة مباركة،"], [378.0, "أو هذا الشهر مبارك،"], [380.0, "أو هذا اليوم مبارك،"], [382.0, "أو هذا أو هذا،"], [384.0, "أو هذه السنة مباركة،"], [386.0, "وغير ذلك من أجزاء الزمان،"], [389.0, "فإنّ قبولَ قولك مبنيٌّ على ثبوت النصّ."]], "tr": [[369.0, "Bu gecenin mübarek olduğunu söylersen senden delil isteriz."], [373.4, "\"Bu gündüz mübarektir\", \"Bu saat mübarektir\", \"Bu ay mübarektir\", \"Bu gün mübarektir\", şu ya da bu, \"Bu yıl mübarektir\" ya da zamanın diğer parçaları hakkında (böyle bir şey) söylersen, sözünün kabulü nassın sabit olmasına bağlıdır."]]}, {"reader": false, "ar": [[395.0, "فإن قلتَ: وهل دلّت الأدلّة على وجود بعض الأزمنة المباركة؟"], [401.0, "فنقول: نعم، وكثيرةٌ جدًّا."], [403.0, "فمن جملة الأزمنة المباركة:"], [406.1, "شهرُ رمضان، وقد شهد الدليلُ بأنه زمانٌ مبارك،"], [412.0, "كما قال النبيّ صلى الله عليه وسلم ـ في الحديث الحسن لشواهده ـ:"], [417.0, "«أتاكم رمضانُ، شهرٌ مبارك»."], [422.0, "وكذلك ليلةُ القدر من رمضان،"], [425.0, "فإنّ الأدلّة دلّت على أنها من الليالي المباركة،"], [430.0, "كما قال الله عز وجل:"], [431.0, "<span class=\"ayah\">﴿إِنَّا أَنزَلْنَاهُ فِي لَيْلَةٍ مُّبَارَكَةٍ ۚ إِنَّا كُنَّا مُنذِرِينَ﴾<\/span> <span class=\"ref\">[الدخان: ٣]<\/span>."]], "tr": [[395.0, "Eğer \"Deliller bazı mübarek zamanların varlığına delâlet etmiş midir?\" dersen, deriz ki:"], [401.0, "Evet, hem de çok fazla."], [403.0, "Mübarek zamanlardan biri Ramazan ayıdır."], [406.1, "Delil onun mübarek bir zaman olduğuna şahitlik etmiştir."], [411.3, "Nitekim Peygamber sallallâhu aleyhi ve sellem —şâhidleriyle hasen olan hadiste— şöyle buyurmuştur:"], [416.1, "\"Size Ramazan geldi; mübarek bir ay.\" Ramazan'daki Kadir gecesi de böyledir;"], [423.8, "deliller onun mübarek gecelerden olduğuna delâlet etmiştir."], [427.5, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [430.4, "<span class=\"ayah\">﴿Şüphesiz biz onu mübarek bir gecede indirdik. Şüphesiz biz uyarıcılarız﴾<\/span> [Duhân 3]."]]}, {"reader": false, "ar": [[439.0, "وكذلك أيضًا يومُ الجمعة،"], [443.0, "فقد دلّت الأدلّة على أنه من الأيام المباركة،"], [447.0, "كما في «صحيح مسلم» من حديث أبي هريرة رضي الله عنه قال:"], [452.6, "قال النبيّ صلى الله عليه وسلم:"], [456.0, "«خيرُ يومٍ طلعت عليه الشمسُ يومُ الجمعة؛ فيه خُلق آدم، وفيه أُدخل الجنّة، وفيه أُخرج منها، ولا تقوم الساعةُ إلا في يوم الجمعة»."]], "tr": [[439.0, "Cuma günü de böyledir. Deliller onun mübarek günlerden olduğuna delâlet etmiştir."], [446.5, "Nitekim Sahîh-i Müslim'de Ebû Hüreyre radıyallâhu anh hadisinde şöyle dedi:"], [451.1, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [454.3, "\"Üzerine güneşin doğduğu en hayırlı gün cuma günüdür."], [458.9, "Âdem o gün yaratıldı, o gün cennete konuldu, o gün oradan çıkarıldı."], [465.0, "Kıyamet de ancak cuma günü kopacaktır.\""]]}, {"reader": false, "ar": [[468.0, "وفي حديث أوس بن أوس رضي الله عنه قال:"], [472.0, "قال رسول الله صلى الله عليه وسلم:"], [474.6, "<span class=\"q\">؟ 07:54<\/span> «إنّ من أفضل أيامكم يومَ الجمعة، فيه خُلق آدم، وفيه قُبض، وفيه النفخة، وفيه الصعقة، فأكثِروا عليَّ من الصلاة فيه، فإنّ صلاتكم معروضةٌ عليّ»."]], "tr": [[468.0, "Evs b. Evs radıyallâhu anh hadisinde şöyle dedi:"], [470.7, "Resûlullah sallallâhu aleyhi ve sellem buyurdu:"], [472.6, "<span class=\"q\">؟<\/span> \"Günlerinizin en faziletlilerinden biri cuma günüdür."], [475.1, "Âdem o gün yaratıldı, o gün ruhu kabzedildi;"], [478.6, "(sûra) üfürülme o gündedir, (herkesin) bayılıp ölmesi o gündedir."], [483.0, "O gün bana çokça salavat getirin;"], [484.8, "çünkü salavatınız bana arz edilir.\""]]}, {"reader": false, "ar": [[487.0, "ومن جملة الأيام المباركة أيضًا:"], [491.0, "يومُ عرفة، فإنّ النبيّ صلى الله عليه وسلم أخبرنا بأنه يحتسب على ربّه أنّ من صامه فإنه يكون له كفّارةَ سنتين."], [506.0, "وكذلك أيضًا يومُ عاشوراء،"], [508.3, "فإنه يومٌ مبارك، ومن صامه فإنه يكون كفّارةً لسنةٍ قبله."]], "tr": [[487.0, "Mübarek günlerden biri de Arefe günüdür."], [491.0, "Peygamber sallallâhu aleyhi ve sellem bize, onu oruçla geçirenin bu orucunun kendisi için iki yıla kefaret olmasını Rabbinden umduğunu haber vermiştir."], [500.9, "Âşûrâ günü de böyledir; o da mübarek bir gündür."], [508.3, "Onu oruçla geçiren için bu, kendisinden önceki bir yıla kefaret olur."]]}, {"reader": false, "ar": [[516.0, "وكذلك عشرُ الأيام الأُوَل من ذي الحجّة،"], [523.0, "فإنها أيامٌ مباركة، كما في «صحيح البخاري» من حديث ابن عباس رضي الله عنهما قال:"], [530.0, "قال النبيّ صلى الله عليه وسلم:"], [533.0, "«ما من أيامٍ العملُ الصالح فيهنّ أحبُّ إلى الله عز وجل من هذه الأيام العشر»."]], "tr": [[516.0, "Zilhicce'nin ilk on günü de böyledir;"], [520.5, "bunlar mübarek günlerdir. Nitekim Sahîh-i Buhârî'de İbn Abbâs radıyallâhu anhümâ hadisinde şöyle dedi:"], [529.0, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [532.0, "\"Sâlih amelin Allah Azze ve Celle'ye bu on günden daha sevimli olduğu hiçbir gün yoktur.\""]]}, {"reader": false, "ar": [[541.0, "وكذلك أيضًا يومُ الاثنين ويومُ الخميس من كلّ أسبوع،"], [549.0, "فإنها أيامٌ مباركة. وكذلك يوما عيدي الفطر والأضحى،"], [556.6, "فإنها أيامٌ مباركة. وهكذا دواليك؛"], [560.2, "فما ثبت به النصُّ من بركة بعض الأزمنة فإننا نؤمن به ونعتقد بركته."], [568.0, "وأمّا من يدّعي زمانًا مباركًا ولم يأتنا بدليلٍ يدلّ على بركته،"], [576.0, "فإنّ قولَه مردودٌ عليه،"], [578.0, "مضروبٌ به في وجهه. والله أعلم."]], "tr": [[541.0, "Her haftanın pazartesi ve perşembe günleri de böyledir;"], [545.3, "bunlar mübarek günlerdir. Ramazan ve Kurban bayramı günleri de böyledir;"], [555.2, "bunlar mübarek günlerdir. Ve bu böyle devam eder."], [560.2, "Bazı zamanların bereketine dair nassın sabit kıldığı şeye iman eder ve onun bereketine inanırız."], [567.4, "Mübarek bir zaman iddia edip de bize onun bereketine delâlet eden bir delil getirmeyene gelince, onun sözü kendisine reddedilir, yüzüne çarpılır. Allah en iyisini bilir."]]}]}, {"ts": "09:41", "title": "4. Külliye: Bir mekânda bereket olduğunu iddia edenden delil istenir", "paras": [{"reader": false, "ar": [[581.0, "ويوضّح ذلك الكلّيّةُ الرابعة أيضًا:"], [584.4, "<b>كلُّ من ادّعى بركةً في مكانٍ فمطالَبٌ بالدليل.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[581.0, "Bunu 4. külliye de açıklar:"], [583.0, "<b>4. külliye: Bir mekânda bereket olduğunu iddia eden herkesten delil istenir.<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[603.0, "أقول وبالله التوفيق: فكلُّ من زعم أنّ هذا المكانَ مكانٌ مبارك فإننا نطالبه بالدليل الدالّ على هذه الدعوى؛"], [615.0, "فإنّ البيّنة على من ادّعى."], [618.0, "فإن جاءنا بالدليل الصحيح الصريح الدالّ على ثبوت البركة قبلنا كلامه،"], [625.0, "وإلّا فلا حقَّ لأحدٍ أن يُثبت بركةً مكانيّةً لا دليلَ عليها؛"], [629.6, "لأنّ الأمر غيب، وما كان غيبيًّا فيكون توقيفيًّا."]], "tr": [[603.0, "Tevfik Allah'tandır, derim ki: Bu mekânın mübarek bir mekân olduğunu iddia eden herkesten bu iddiaya delâlet eden delili isteriz."], [612.7, "Çünkü beyyine (delil getirmek) iddia edene düşer."], [617.4, "Bize bereketin sabit olduğuna delâlet eden sahih ve açık delili getirirse sözünü kabul ederiz;"], [625.0, "aksi hâlde hiç kimsenin, üzerinde delil olmayan mekânsal bir bereketi ispat etmeye hakkı yoktur."], [630.1, "Çünkü mesele gaybdır; gaybî olan da tevkîfî olur."]]}, {"reader": false, "ar": [[634.0, "فإن قلتَ: وهل ثبت النصُّ ببعض الأمكنة المباركة؟"], [639.0, "فأقول: نعم، وكثيرةٌ جدًّا ولله الحمد."], [642.0, "فمن الأمكنة المباركة: المساجدُ على هذه الكرة الأرضيّة؛"], [648.0, "لِما في «صحيح الإمام مسلم» من حديث أبي هريرة رضي الله عنه قال:"], [655.5, "قال النبيّ صلى الله عليه وسلم:"], [658.7, "«أحبُّ البلاد إلى الله مساجدُها، وأبغضُ البلاد إلى الله أسواقُها»."], [664.0, "وقبل ذلك قولُ الله عز وجل:"], [667.1, "<span class=\"ayah\">﴿فِي بُيُوتٍ أَذِنَ اللَّهُ أَن تُرْفَعَ وَيُذْكَرَ فِيهَا اسْمُهُ يُسَبِّحُ لَهُ فِيهَا بِالْغُدُوِّ وَالْآصَالِ ۝ رِجَالٌ﴾<\/span> <span class=\"ref\">[النور: ٣٦–٣٧]<\/span>، الآيةَ بتمامها."]], "tr": [[634.0, "Eğer \"Nas bazı mübarek mekânları sabit kılmış mıdır?\" dersen, derim ki:"], [639.5, "Evet, hem de çok fazla;"], [641.5, "hamd Allah'a. Mübarek mekânlardan biri bu yerküre üzerindeki mescitlerdir."], [646.4, "Çünkü Sahîh-i İmam Müslim'de Ebû Hüreyre radıyallâhu anh hadisinde şöyle dedi:"], [652.1, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [655.0, "\"Beldelerin Allah'a en sevimli yerleri mescitleri, beldelerin Allah'a en sevimsiz yerleri ise çarşılarıdır.\" Bundan önce de Allah Azze ve Celle'nin şu sözü vardır:"], [665.6, "<span class=\"ayah\">﴿(O nur) Allah'ın yükseltilmesine ve içlerinde isminin anılmasına izin verdiği evlerdedir; orada sabah akşam O'nu tesbih eder; öyle adamlar ki…﴾<\/span> [Nûr 36–37] ayetin tamamı."]]}, {"reader": false, "ar": [[676.0, "وعلى رأس المساجد المساجدُ الثلاثة:"], [679.3, "المسجدُ الحرام، ومسجدُ النبيّ صلى الله عليه وسلم،"], [684.7, "والمسجدُ الأقصى؛ فقد دلّت الأدلّة على أنها من المواضع المباركة،"], [691.0, "كما في قول النبيّ صلى الله عليه وسلم:"], [695.2, "«لا تُشَدُّ الرحالُ إلا إلى ثلاثة مساجد: المسجدِ الحرام، والمسجدِ الأقصى، ومسجدي هذا»."], [702.0, "ويقول الله عز وجل ـ واصفًا البيتَ المقدس ـ:"], [706.9, "<span class=\"ayah\">﴿الَّذِي بَارَكْنَا حَوْلَهُ﴾<\/span> <span class=\"ref\">[الإسراء: ١]<\/span>، <span class=\"ayah\">﴿الَّذِي بَارَكْنَا حَوْلَهُ﴾<\/span>."]], "tr": [[676.0, "Mescitlerin başında üç mescit gelir:"], [678.7, "Mescid-i Harâm, Peygamber sallallâhu aleyhi ve sellem'in Mescidi ve Mescid-i Aksâ."], [685.3, "Deliller bunların mübarek yerlerden olduğuna delâlet etmiştir."], [689.5, "Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [693.6, "\"(İbadet için) yolculuk ancak üç mescide yapılır:"], [696.8, "Mescid-i Harâm, Mescid-i Aksâ ve şu mescidim.\" Allah Azze ve Celle de Beyt-i Makdis'i nitelendirerek şöyle buyurur:"], [705.5, "<span class=\"ayah\">﴿…çevresini mübarek kıldığımız…﴾<\/span> [İsrâ 1], <span class=\"ayah\">﴿…çevresini mübarek kıldığımız…﴾<\/span>"]]}, {"reader": false, "ar": [[711.0, "ومنها أيضًا من هذه الأماكن:"], [714.6, "المشاعرُ المقدّسة؛ كعرفة، فإنها مكانٌ مبارك،"], [719.0, "وكالمزدلفة، فإنها مكانٌ مبارك،"], [722.7, "وكمِنًى، فإنها أيضًا مكانٌ مبارك."]], "tr": [[711.0, "Bu mekânlardan biri de mukaddes meş'arlardır (hac mekânları)."], [714.6, "Arafat gibi; o mübarek bir mekândır."], [718.2, "Müzdelife gibi; o mübarek bir mekândır."], [721.5, "Minâ gibi; o da mübarek bir mekândır."]]}]}, {"ts": "12:09", "title": "5. Külliye: Bir nesnede bereket olduğunu iddia edenden delil istenir", "paras": [{"reader": false, "ar": [[729.0, "ويوضّح ذلك الكلّيّةُ التي بعدها:"], [735.0, "كلُّ من ادّعى بركةً في عين… <b>كلُّ من ادّعى بركةً في عينٍ من الأعيان فمطالَبٌ بالدليل.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[729.0, "Bunu ondan sonraki külliye açıklar:"], [732.2, "Bir nesnede bereket olduğunu iddia eden herkes… 5."], [739.0, "külliye: Nesnelerden herhangi birinde bereket olduğunu iddia eden herkesten delil istenir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[746.0, "وذلك لأنّ البركة في العين أمرٌ غيبيّ،"], [758.0, "وأمورُ الغيب توقيفيّةٌ على النصّ."], [761.0, "فلا يجوز لأحدٍ أن يقول:"], [763.8, "إنّ هذا الشيء مبارك،"], [766.0, "أو هذه العين مباركة،"], [769.0, "أو هذا الشخص مبارك،"], [772.0, "أو هذا الحجر مبارك،"], [775.0, "أو هذا الشجر مبارك،"], [777.0, "إلا إذا جاءنا بالدليل الدالّ على صحّة دعواه."], [783.0, "فإن جاءنا به صحيحًا صريحًا فعلى العين والرأس،"], [786.0, "وإلّا فلا حقَّ لأحدٍ أن يدّعي بركةً في عينٍ لم يثبت ببركتها دليل."]], "tr": [[746.0, "Bu şundandır: Çünkü nesnedeki bereket gaybî bir iştir;"], [758.0, "gayb işleri de nassa bağlı olarak tevkîfîdir."], [761.6, "Dolayısıyla hiç kimsenin, iddiasının doğruluğuna delâlet eden delili bize getirmedikçe \"Bu şey mübarektir\", \"Bu nesne mübarektir\", \"Bu şahıs mübarektir\", \"Bu taş mübarektir\" ya da \"Bu ağaç mübarektir\" demesi caiz değildir."], [779.9, "Onu sahih ve açık olarak getirirse başım gözüm üstüne;"], [784.9, "aksi hâlde hiç kimsenin, bereketine dair bir delil sabit olmayan bir nesnede bereket iddia etmeye hakkı yoktur."]]}, {"reader": false, "ar": [[794.0, "فإن قلتَ: وهل دلّت الأدلّة على وجود البركة في بعض الأعيان؟"], [799.0, "فأقول: نعم، وكثيرةٌ جدًّا."], [802.0, "فمن أعظمها وعلى رأسها:"], [804.5, "كتابُ الله عز وجل،"], [807.0, "فإنّ كتاب الله عينٌ مباركة،"], [810.0, "وقد دلّت الأدلّة على ذلك بما لا حاجةَ لنا إلى ذكر شيءٍ منها."], [818.0, "وكذلك زيتُ الزيتون، فإنّ النبيّ صلى الله عليه وسلم نصّ على بركته."], [826.0, "وكذلك اللبن، فإنه عينٌ مباركة،"], [831.0, "وقد قال النبيّ صلى الله عليه وسلم:"], [833.0, "«اللهمّ بارك لنا فيه»،"], [835.0, "«ومن سقاه اللهُ لبنًا فليقل: اللهمّ بارك لنا فيه»."]], "tr": [[794.0, "Eğer \"Deliller bazı nesnelerde bereketin varlığına delâlet etmiş midir?\" dersen, derim ki:"], [798.5, "Evet, hem de çok fazla."], [802.0, "Bunların en büyüğü ve başında geleni Allah Azze ve Celle'nin Kitabı'dır."], [808.2, "Allah'ın Kitabı mübarek bir nesnedir;"], [810.6, "deliller buna, herhangi birini zikretmeye ihtiyaç duymayacağımız şekilde delâlet etmiştir."], [816.2, "Zeytinyağı da böyledir; Peygamber sallallâhu aleyhi ve sellem onun bereketini açıkça belirtmiştir."], [823.3, "Süt de böyledir; o mübarek bir nesnedir."], [827.6, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [831.9, "\"Allah'ım, onu bizim için mübarek kıl.\" \"Allah kime süt içirirse şöyle desin:"], [836.2, "Allah'ım, onu bizim için mübarek kıl.\""]]}, {"reader": false, "ar": [[839.0, "ومنها أيضًا الحبّةُ السوداء،"], [843.0, "فقد دلّت الأدلّة على أنها حبّةٌ مباركة،"], [846.0, "كما قال النبيّ صلى الله عليه وسلم:"], [848.0, "«إنها شفاءٌ من كلّ داءٍ إلا السّام»؛"], [851.9, "أي الموت. ومن الأعيان المباركة أيضًا الكَمْأة،"], [857.0, "كما قال النبيّ صلى الله عليه وسلم:"], [860.0, "«الكمأةُ من المنّ، وماؤها شفاءٌ للعين»."], [863.0, "ومنها كذلك تمرُ العجوة،"], [866.0, "فقد دلّ الدليل على أنه عينٌ مباركة،"], [870.0, "كما قال النبيّ صلى الله عليه وسلم:"], [872.0, "«من تصبّح بسبع تمراتٍ عجوةً ممّا بين لابتيها لم يمسَّه ذلك اليومَ سمٌّ ولا سحر»."]], "tr": [[839.0, "Bunlardan biri de çörek otudur."], [843.0, "Deliller onun mübarek bir tohum olduğuna delâlet etmiştir."], [845.6, "Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [847.7, "\"O, sâm dışında her derde şifadır\";"], [850.2, "yani ölüm dışında. Mübarek nesnelerden biri de keme mantarıdır."], [854.6, "Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [858.7, "\"Keme mantarı mendendir (Allah'ın zahmetsiz bir lütfudur);"], [861.0, "suyu da göze şifadır.\" Acve hurması da böyledir;"], [865.2, "delil onun mübarek bir nesne olduğuna delâlet etmiştir."], [869.4, "Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [871.4, "\"Kim sabahleyin (Medine'nin) iki kara taşlığı arasından yedi acve hurması yerse, o gün ona ne zehir ne de sihir dokunur.\""]]}, {"reader": false, "ar": [[881.7, "وكذلك العسل، فإنه عينٌ مباركة،"], [886.0, "كما دلّت على ذلك الآياتُ في سورة النحل."], [890.8, "وكذلك ماءُ زمزم ـ أحاول الاختصار ـ وكذلك ماءُ زمزم فإنها عينٌ مباركة،"], [897.0, "كما قال النبيّ صلى الله عليه وسلم:"], [901.1, "«إنها مباركة، إنها طعامُ طُعْم»."]], "tr": [[881.7, "Bal da böyledir; o mübarek bir nesnedir;"], [886.7, "Nahl sûresindeki ayetler buna delâlet etmiştir."], [890.0, "Zemzem suyu da böyledir —kısa tutmaya çalışıyorum— Zemzem suyu da böyledir;"], [892.7, "o mübarek bir nesnedir. Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [900.5, "\"O mübarektir; o doyurucu bir yiyecektir.\""]]}]}, {"ts": "15:04", "title": "5. Külliye (devam): Yağmur suyu, at ve koyun", "paras": [{"reader": false, "ar": [[904.0, "وكذلك ماءُ المطر، فإنّ الدليل دلّ على أنه ماءٌ مبارك،"], [909.0, "كما قال الله عز وجل:"], [911.5, "<span class=\"ayah\">﴿وَنَزَّلْنَا مِنَ السَّمَاءِ مَاءً مُّبَارَكًا فَأَنبَتْنَا بِهِ جَنَّاتٍ وَحَبَّ الْحَصِيدِ﴾<\/span> <span class=\"ref\">[ق: ٩]<\/span>."], [917.0, "ولمّا أصاب النبيَّ صلى الله عليه وسلم شيءٌ من المطر،"], [921.0, "حسر رسولُ الله صلى الله عليه وسلم ثوبَه حتى أصابه من المطر،"], [927.0, "فقلنا: يا رسول الله،"], [928.7, "لِمَ صنعتَ ذلك؟ فقال:"], [930.3, "«لأنه حديثُ عهدٍ بربّه»."]], "tr": [[904.0, "Yağmur suyu da böyledir; delil onun mübarek bir su olduğuna delâlet etmiştir."], [909.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [912.0, "<span class=\"ayah\">﴿Gökten mübarek bir su indirdik de onunla bahçeler ve biçilen taneler bitirdik﴾<\/span> [Kâf 9]."], [918.2, "Peygamber sallallâhu aleyhi ve sellem'e biraz yağmur isabet edince, Resûlullah sallallâhu aleyhi ve sellem yağmur kendisine değsin diye elbisesini (bedeninden) açtı."], [926.5, "\"Ey Allah'ın Resûlü, bunu niçin yaptın?\" dedik."], [929.1, "Buyurdu ki: \"Çünkü o, Rabbinden yeni gelmiştir.\""]]}, {"reader": false, "ar": [[932.0, "وكذلك الخيل، فإنّ الخيل معقودٌ في نواصيها الخيرُ إلى يوم القيامة."], [939.0, "وكذلك الغنم، فإنها من جملة الأعيان المباركة،"], [943.0, "فقد قال النبيّ صلى الله عليه وسلم:"], [946.5, "«صلّوا في مرابضها فإنها بركة»."], [949.0, "وغيرُ ذلك من الأعيان التي دلّ الدليل على وجود البركة فيها."], [954.0, "وبناءً على ذلك فكلُّ من ادّعى وجودَ بركةٍ في عينٍ من الأعيان ممّا لا دليلَ عليه،"], [961.0, "فإنه لا حظَّ لكلامه من القبول."]], "tr": [[932.0, "At da böyledir; atların alınlarına kıyamet gününe kadar hayır bağlanmıştır."], [938.4, "Koyun da böyledir; o da mübarek nesnelerdendir."], [943.0, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [947.0, "\"Onların ağıllarında namaz kılın; çünkü onlar berekettir.\" Delilin, içinde bereket bulunduğuna delâlet ettiği diğer nesneler de böyledir."], [955.3, "Buna binaen, üzerinde delil olmayan nesnelerden birinde bereket bulunduğunu iddia eden herkesin sözünün kabulden hiçbir payı yoktur."]]}]}, {"ts": "16:09", "title": "6. Külliye: Zamana, mekâna ya da nesneye sabit olan her bereket mânevî ve lâzımdır", "paras": [{"reader": false, "ar": [[965.3, "ومن الكلّيّات أيضًا: <b>كلُّ بركةٍ ثبتت لزمانٍ أو مكانٍ أو عينٍ فمعنويّةٌ لازمة.<\/b> كلُّ بركةٍ ثبتت لزمانٍ أو مكانٍ أو عينٍ فمعنويّةٌ لازمة."], [994.0, "أعيدها مرّةً ثالثة: كلُّ بركةٍ ثبتت لزمانٍ أو مكانٍ أو عينٍ فمعنويّةٌ لازمة."]], "tr": [[965.3, "Külliyelerden biri de şudur: 6."], [969.0, "külliye: Bir zamana, bir mekâna ya da bir nesneye sabit olan her bereket mânevî ve lâzımdır (yerinden ayrılmaz). Bir zamana, bir mekâna ya da bir nesneye sabit olan her bereket mânevî ve lâzımdır."], [994.7, "Üçüncü kez tekrar ediyorum: Bir zamana, bir mekâna ya da bir nesneye sabit olan her bereket mânevî ve lâzımdır."]]}, {"reader": false, "ar": [[1004.0, "أقول وبالله التوفيق: إلّا أنه يُستثنى من الأعيان عينُ النبيّ صلى الله عليه وسلم،"], [1011.0, "وسيأتينا فيها كلّيّةٌ خاصّة بإذن الله."], [1015.0, "وحتى تتّضح هذه الكلّيّة أقول وبالله التوفيق:"], [1021.0, "اعلم أنّ البركة التي ثبت بها النصّ تنقسم إلى قسمين ـ اعلم أنّ البركة التي ثبت بها النصّ تنقسم إلى قسمين ـ:"], [1030.0, "إلى بركةٍ معنويّةٍ لازمة،"], [1032.9, "وإلى بركةٍ ذاتيّةٍ منتقلة."]], "tr": [[1004.0, "Tevfik Allah'tandır, derim ki: Ancak nesnelerden Peygamber sallallâhu aleyhi ve sellem'in zatı istisna edilir;"], [1010.5, "Allah'ın izniyle onun hakkında özel bir külliye gelecek."], [1015.0, "Bu külliye açıklığa kavuşsun diye —tevfik Allah'tandır— derim ki:"], [1021.4, "Bil ki nassın sabit kıldığı bereket iki kısma ayrılır —bil ki nassın sabit kıldığı bereket iki kısma ayrılır—:"], [1029.0, "mânevî ve lâzım bereket ile zâtî ve intikal eden bereket."]]}, {"reader": false, "ar": [[1036.0, "ونعني بالبركة المعنويّة اللازمة:"], [1044.0, "أي تلك البركة التي لا يمكن أبدًا أن تفارق محلَّها؛"], [1048.0, "فمهما مسستَها بيدك، أو مسّها أيُّ شيء،"], [1052.0, "فإنها لا يمكن أبدًا أن تنتقل،"], [1056.0, "فهي ملازمةٌ لمحلّها، لا تنتقل إلى ما ماسَّها أبدًا."], [1063.0, "ونعني بالبركة الذاتيّة المنتقلة:"], [1065.7, "تلك البركة التي تنتقل إلى أيّ شيءٍ يمسّها."]], "tr": [[1036.0, "Mânevî ve lâzım bereketten kastımız, bulunduğu yerden aslâ ayrılması mümkün olmayan berekettir."], [1046.4, "Ona elinle ne kadar dokunursan dokun ya da ona herhangi bir şey dokunsun, onun intikal etmesi (başka yere geçmesi) aslâ mümkün değildir."], [1057.3, "O, bulunduğu yere bitişiktir; kendisine dokunan şeye aslâ geçmez."], [1063.0, "Zâtî ve intikal eden bereketten kastımız ise kendisine dokunan her şeye geçen berekettir."]]}, {"reader": false, "ar": [[1074.0, "وهذه الكلّيّة التي نحن بصدد شرحها إنما هي في البركة المعنويّة اللازمة."], [1080.0, "وعلامتُها هي هذه الكلّيّة،"], [1082.6, "وهي: أنّ كلَّ زمانٍ في الشرع ثبتت بركتُه فإنّ بركته معنويّةٌ لازمة لا تفارقه أبدًا."], [1095.0, "وكلُّ بركةٍ ثبتت لمكانٍ فإنّ بركته معنويّةٌ لازمة؛"], [1100.4, "فالكعبة ـ عفوًا ـ فالمسجدُ الحرام بركتُه لازمة،"], [1106.0, "يعني بمعنى أنه ليس كلُّ من تمسّح بشيءٍ من أجزاء المسجد الحرام انتقلت البركةُ إليه."]], "tr": [[1074.0, "Şerhini yapmakta olduğumuz bu külliye, mânevî ve lâzım bereket hakkındadır."], [1079.0, "Onun alameti bu külliyedir; o da şudur:"], [1083.9, "Şeriatte bereketi sabit olan her zamanın bereketi mânevî ve lâzımdır;"], [1091.1, "ondan aslâ ayrılmaz. Bir mekâna sabit olan her bereket de mânevî ve lâzımdır."], [1103.1, "Kâbe —pardon— Mescid-i Harâm'ın bereketi lâzımdır;"], [1109.3, "yani Mescid-i Harâm'ın parçalarından birine sürünen herkese bereket geçmez."]]}, {"reader": false, "ar": [[1116.0, "وكذلك بركةُ المسجد الأقصى بركةٌ معنويّةٌ لازمة؛"], [1120.0, "فليست البركةُ في كلّ جدارٍ من جدرانه،"], [1123.3, "أو حجرٍ من أحجاره،"], [1125.1, "أو شجرٍ من أشجاره."], [1127.0, "وكذلك بركةُ المدينة، المسجدِ النبويّ أيضًا،"], [1131.1, "بركتُه بركةٌ معنويّةٌ لازمة لا تفارقها."], [1136.0, "فبركةُ الزمان معنويّةٌ لازمة،"], [1139.0, "وبركةُ المكان معنويّةٌ لازمة،"], [1142.0, "وكذلك بركةُ الأعيان التي ثبت الدليلُ بوجود البركة فيها معنويّةٌ لازمة لا تفارق محلَّها."]], "tr": [[1116.0, "Mescid-i Aksâ'nın bereketi de böyledir;"], [1118.3, "mânevî ve lâzım bir berekettir."], [1120.5, "Bereket onun her bir duvarında, her bir taşında ya da her bir ağacında değildir."], [1126.1, "Medine'nin, Mescid-i Nebevî'nin bereketi de böyledir;"], [1129.0, "onun bereketi de mânevî ve lâzım bir berekettir, ondan ayrılmaz."], [1134.5, "Zamanın bereketi mânevî ve lâzımdır;"], [1139.0, "mekânın bereketi mânevî ve lâzımdır."], [1142.0, "İçinde bereket bulunduğuna delilin sabit olduğu nesnelerin bereketi de böyledir;"], [1147.8, "mânevî ve lâzımdır, bulunduğu yerden ayrılmaz."]]}, {"reader": false, "ar": [[1152.0, "فبركةُ القرآن معنويّةٌ لازمة؛"], [1155.0, "بمعنى أنك إذا وضعتَ يدك على المصحف فليس ثمّة بركةٌ سوف تخرج منه إلى يدك،"], [1161.0, "وإذا وضعتَه على صدرك فإنه ليس ثمّة بركةٌ ستخرج منه وتحلّ طمأنينتُه في قلبك."], [1169.0, "وإنما بركتُه في تلاوته،"], [1171.7, "وبركتُه في تدبّره وتعقّله،"], [1174.3, "والعملِ به، والحكمِ به،"], [1177.0, "والتحاكمِ إليه، والاستشفاءِ به،"], [1183.0, "ومضاعفةِ أجور قراءته، وهكذا."], [1187.0, "لكن ليس ثمّة بركةٌ تنتقل من القرآن إلى ما يمسّه."]], "tr": [[1152.0, "Kur'ân'ın bereketi mânevî ve lâzımdır."], [1155.0, "Yani elini mushafın üzerine koyduğunda, ondan çıkıp eline geçecek bir bereket yoktur."], [1159.9, "Onu göğsünün üzerine koyduğunda da ondan çıkıp huzuru kalbine yerleşecek bir bereket yoktur."], [1166.6, "Onun bereketi ancak tilâvetinde; bereketi onu tedebbür etmekte ve akletmekte, onunla amel etmekte, onunla hükmetmekte, onun hükmüne başvurmakta, onunla şifa aramakta, okumasının ecirlerinin katlanmasında ve benzerlerindedir."], [1187.5, "Fakat Kur'ân'dan ona dokunan şeye geçen bir bereket yoktur."]]}, {"reader": false, "ar": [[1192.0, "وبركةُ ماء زمزم أيضًا بركةٌ معنويّةٌ لازمة،"], [1196.0, "إنما بركتُه في شربه."], [1199.0, "لكن لو أنّ الإنسان غسل ثيابه بماء زمزم،"], [1203.0, "فهل يكون ثوبُه مباركًا؟"], [1205.0, "أو غسل بيته بماء زمزم،"], [1207.0, "أفيكون بيتُه مباركًا؟ أو أنه وضع يدَه في إناءٍ من ماء زمزم،"], [1214.0, "فهل ثمّة بركةٌ سوف تحلّ في يده؟ الجواب: لا."]], "tr": [[1192.0, "Zemzem suyunun bereketi de mânevî ve lâzım bir berekettir;"], [1196.8, "onun bereketi ancak içilmesindedir. Fakat insan elbiselerini zemzem suyuyla yıkasa, elbisesi mübarek olur mu?"], [1204.5, "Ya da evini zemzem suyuyla yıkasa, evi mübarek olur mu?"], [1209.6, "Ya da elini zemzem suyu dolu bir kaba koysa, eline yerleşecek bir bereket var mıdır? Cevap: Hayır."]]}]}, {"ts": "20:18", "title": "6. Külliye (devam): Zemzem, Kâbe, Makâm-ı İbrâhim ve Hacer-i Esved'in bereketi", "paras": [{"reader": false, "ar": [[1218.0, "وإنما بركتُه في الاستشفاء به،"], [1221.0, "وفي استطعامه؛ يعني بمعنى أنه يُروي عن ظمأ،"], [1226.0, "ويُغني عن طعام، ويَشفي من سقم."], [1233.0, "وكذلك أيضًا بركةُ الكعبة،"], [1237.0, "فإنها عينٌ مباركة، ولكنّ بركتها في الطواف عليها،"], [1241.0, "وفي مسّ الركنين اليمانيّين منها،"], [1246.0, "ونحو ذلك. ولكن ليس بركتُها في أن يضع الإنسانُ صدرَه على جدرانها ظنًّا منه أنّ ثمّة شيئًا سيخرج منها إليه؛"], [1257.0, "فبركتُها ملازمةٌ لها لا تنتقل عنها أبدًا."]], "tr": [[1218.0, "Onun bereketi ancak onunla şifa aramakta ve onu yiyecek yerine kullanmaktadır;"], [1224.5, "yani susuzluğu giderir, yiyecek yerine geçer ve hastalıktan şifa verir."], [1233.8, "Kâbe'nin bereketi de böyledir. O mübarek bir nesnedir;"], [1239.8, "fakat onun bereketi etrafında tavaf etmekte, iki Yemânî köşesine dokunmakta ve benzerlerindedir."], [1248.2, "Ama onun bereketi, insanın, ondan kendisine bir şey çıkacağını zannederek göğsünü duvarlarına dayamasında değildir."], [1256.0, "Onun bereketi ona bitişiktir; ondan aslâ başka yere geçmez."]]}, {"reader": false, "ar": [[1261.0, "وبناءً على ذلك فقد أنكر ابنُ عباس رضي الله عنهما على معاوية بن أبي سفيان رضي الله عنهما لمّا مسّ الركنين الشاميّين،"], [1273.0, "فأنكر عليه، وقال: يا ابنَ عباس،"], [1276.5, "ليس شيءٌ من البيت مهجورًا."], [1281.0, "فقال: أليس لك في رسول الله صلى الله عليه وسلم أُسوةٌ حسنة؟"]], "tr": [[1261.0, "Buna binaen İbn Abbâs radıyallâhu anhümâ, Muâviye b."], [1264.5, "Ebî Süfyân radıyallâhu anhümâ'ya, iki Şâmî köşeye dokunduğunda karşı çıktı."], [1269.0, "Ona karşı çıkınca (Muâviye) şöyle dedi:"], [1272.2, "\"Ey İbn Abbâs! Beyt'in hiçbir yeri terk edilmiş değildir.\" (İbn Abbâs) da şöyle dedi:"], [1281.4, "\"Senin için Resûlullah sallallâhu aleyhi ve sellem'de güzel bir örnek yok mu?\""]]}, {"reader": false, "ar": [[1286.0, "وكذلك أيضًا مقامُ إبراهيم عينٌ مباركة،"], [1293.0, "ولكنّ بركته في الصلاة ـ في صلاة ركعتين ـ خلفه،"], [1297.0, "وليس بالطواف به كما نراه من بعضهم،"], [1301.0, "وليس بالتمسّح به أو لعقِه كما يفعله بعضهم؛"], [1306.0, "فكلُّ ذلك من البدع التي ما أنزل الله بها من سلطان."]], "tr": [[1286.0, "Makâm-ı İbrâhim de böyledir; o mübarek bir nesnedir."], [1293.5, "Fakat onun bereketi, arkasında namaz —iki rekât namaz— kılmaktadır."], [1297.6, "Bazılarından gördüğümüz gibi onun etrafında tavaf etmekte değildir;"], [1302.2, "bazılarının yaptığı gibi ona sürünmekte ya da onu yalamakta değildir."], [1307.1, "Bunların hepsi, Allah'ın hakkında hiçbir delil indirmediği bid'atlerdendir."]]}, {"reader": false, "ar": [[1310.0, "وكذلك بركةُ الحجر الأسود،"], [1313.0, "فإنه عينٌ مباركة، وبركتُه في تقبيله،"], [1317.9, "أو في مسّه بشيءٍ وتقبيلِ ما مسستَه به،"], [1323.0, "أو في الإشارة إليه."], [1325.0, "ويجمع ذلك أنها بركةُ متابعةٍ للنبيّ صلى الله عليه وسلم،"], [1331.0, "كما قال أميرُ المؤمنين عمر رضي الله عنه:"], [1334.0, "«أما إني أعلم أنك حجرٌ لا تضرّ ولا تنفع، ولولا أني رأيت رسولَ الله صلى الله عليه وسلم يقبّلك ما قبّلتُك»."]], "tr": [[1310.0, "Hacer-i Esved'in bereketi de böyledir."], [1313.0, "O mübarek bir nesnedir; bereketi onu öpmekte, ya da ona bir şeyle dokunup dokunduğun o şeyi öpmekte ya da ona işaret etmektedir."], [1326.2, "Bunların hepsini toplayan şudur: Bu, Peygamber sallallâhu aleyhi ve sellem'e tâbi olmanın bereketidir."], [1332.1, "Nitekim Mü'minlerin Emîri Ömer radıyallâhu anh şöyle demiştir:"], [1336.0, "\"Bilirim ki sen zarar da fayda da veremeyen bir taşsın."], [1341.5, "Resûlullah sallallâhu aleyhi ve sellem'i seni öperken görmeseydim seni öpmezdim.\""]]}, {"reader": false, "ar": [[1346.0, "فما نراه من فعل بعض الناس،"], [1348.0, "من أنه إذا مسحه صار يمسح بيده وجهَه وصدرَه ونحرَه،"], [1356.6, "وإذا كان معه طفلٌ فإنه يمسح جسدَ الطفل ظنًّا منه أنّ ثمّة بركةً سيبعثها الحجرُ وتعلق في يده ثم هو يوصلها إلى جسده… فكلُّ هذه الأعيان مباركة،"], [1373.9, "ولكنّ بركتها معنويّةٌ لازمة."]], "tr": [[1346.0, "Bazı insanların yaptığını gördüğümüz şey —ona dokunduğunda eliyle yüzünü, göğsünü ve boğazını sıvazlaması, yanında bir çocuk varsa taşın göndereceği, eline yapışacak, sonra da kendisinin (çocuğun) bedenine ulaştıracağı bir bereket olduğunu zannederek çocuğun bedenini sıvazlaması…— (bunlar yanlıştır)."], [1369.8, "Bu nesnelerin hepsi mübarektir; fakat bereketleri mânevî ve lâzımdır."]]}]}, {"ts": "23:01", "title": "6. Külliye (devam): Velîlerin, sâlihlerin ve bütün Müslümanların bereketi", "paras": [{"reader": false, "ar": [[1381.0, "وكذلك بركةُ الأولياء والصالحين،"], [1387.0, "بركةُ المسلمين جميعًا، بركتُهم بركةٌ معنويّةٌ لازمة."], [1394.0, "فبركةُ أبي بكرٍ معنويّةٌ لازمة،"], [1398.0, "وبركةُ عمر، وعثمان، وعليّ،"], [1400.8, "والمهاجرين والأنصار، والأئمّة، والعُبّاد،"], [1403.6, "والزُّهّاد، والعلماء، كلُّهم بركتُهم بركةٌ معنويّةٌ لازمة،"], [1413.0, "كما قال النبيّ صلى الله عليه وسلم:"], [1416.0, "«إنّ من الشجر لَمَا بركتُه كبركة المسلم»."]], "tr": [[1381.0, "Velîlerin ve sâlihlerin bereketi, bütün Müslümanların bereketi de böyledir;"], [1389.0, "onların bereketi mânevî ve lâzım bir berekettir."], [1394.8, "Ebû Bekir'in bereketi mânevî ve lâzımdır."], [1398.7, "Ömer'in, Osman'ın, Ali'nin, Muhâcirlerin ve Ensâr'ın, imamların, âbidlerin, zâhidlerin ve âlimlerin bereketi;"], [1409.0, "hepsinin bereketi mânevî ve lâzım bir berekettir."], [1413.4, "Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1416.0, "\"Ağaçlardan öylesi vardır ki bereketi Müslümanın bereketi gibidir.\""]]}, {"reader": false, "ar": [[1422.0, "فكلُّ مسلمٍ فيه بركة،"], [1424.3, "لكنها بركةُ اعتقاد، وبركةُ توحيد،"], [1427.5, "وبركةُ عمل، وبركةُ اتّباعٍ وامتثالٍ لأمر الله عز وجل."], [1432.0, "لكنّ لعابَهم ليس فيه بركةٌ تنتقل،"], [1438.0, "عرقُهم ليس فيه بركةٌ تنتقل،"], [1441.0, "سؤرُهم في الشراب ليس ثمّة بركةٌ تنتقل."]], "tr": [[1422.0, "Her Müslümanda bereket vardır; fakat bu itikat bereketi, tevhid bereketi, amel bereketi, Allah Azze ve Celle'nin emrine tâbi olma ve uyma bereketidir."], [1432.8, "Ama onların salyasında geçen bir bereket yoktur;"], [1438.6, "terlerinde geçen bir bereket yoktur;"], [1441.0, "içtikleri şeyden artakalanda geçen bir bereket yoktur."]]}, {"reader": false, "ar": [[1447.0, "ولذلك لو تأمّلتم، فإنّ العلماء متّفقون على أنّ رسول الله صلى الله عليه وسلم فيه بركة،"], [1454.0, "وأنّ أبا بكرٍ رضي الله عنه فيه بركة،"], [1459.0, "فكيف كان الصحابة يتعاملون مع البركتين؟"], [1463.0, "الجواب: أمّا… أمّا تعاملُهم مع بركة النبيّ صلى الله عليه وسلم فإنها… إيش؟"], [1471.0, "فإنهم يحرصون على أن تنتقل إليهم."], [1478.0, "وأمّا بركةُ أبي بكرٍ فلا نعلم عن صحابيٍّ واحدٍ أنه كان يأخذ ثيابَ أبي بكرٍ ليتبرّك بها،"], [1487.0, "أو يأكل ممّا أكل منه أبو بكرٍ ليتبرّك به،"], [1492.0, "أو يأخذ سؤرَ أبي بكرٍ ليتبرّك به،"], [1496.0, "أو يأخذ عرقَ أبي بكرٍ ليتبرّك به،"], [1499.0, "أو يأخذ فضلةَ طَهور أبي بكرٍ ليتبرّك به."]], "tr": [[1447.0, "Bu yüzden dikkat ederseniz, âlimler Resûlullah sallallâhu aleyhi ve sellem'de bereket bulunduğunda ve Ebû Bekir radıyallâhu anh'ta bereket bulunduğunda ittifak etmişlerdir."], [1458.4, "Peki sahabe bu iki berekete nasıl muamele ediyordu?"], [1463.7, "Cevap: Peygamber sallallâhu aleyhi ve sellem'in bereketine muamelelerine gelince, o… ne?"], [1471.8, "Onun kendilerine geçmesine çok düşkündüler."], [1478.0, "Ebû Bekir'in bereketine gelince, tek bir sahabînin Ebû Bekir'in elbiselerini teberrük için aldığını, Ebû Bekir'in yediği şeyden teberrük için yediğini, Ebû Bekir'in artığını teberrük için aldığını, Ebû Bekir'in terini teberrük için aldığını ya da Ebû Bekir'in abdest suyundan artakalanı teberrük için aldığını bilmiyoruz."]]}, {"reader": false, "ar": [[1505.0, "فتعاملُ الصحابة مع البركتين يدلّنا على أنهم يقسمون البركة إلى بركتين:"], [1513.0, "إلى بركةٍ ذاتيّةٍ منتقلة،"], [1516.0, "وإلى بركةٍ معنويّةٍ لازمة."], [1518.0, "والخلاصةُ من هذه الكلّيّة:"], [1521.0, "أنّ كلَّ زمانٍ ثبتت بركته فمعنويّةٌ لازمة،"], [1525.0, "وأنّ كلَّ مكانٍ ثبتت بركته فمعنويّةٌ لازمة،"], [1529.0, "وأنّ كلَّ عينٍ ثبتت بركتها فمعنويّةٌ لازمة،"], [1534.0, "إلا عينًا واحدة، وهي التي سأتكلّم عنها في الكلّيّة التي بعدها."]], "tr": [[1505.0, "Sahabenin bu iki berekete muamelesi, bize onların bereketi iki berekete ayırdıklarını gösterir:"], [1512.3, "zâtî ve intikal eden bereket ile mânevî ve lâzım bereket."], [1518.0, "Bu külliyenin özeti şudur: Bereketi sabit olan her zamanın (bereketi) mânevî ve lâzımdır;"], [1525.0, "bereketi sabit olan her mekânın (bereketi) mânevî ve lâzımdır;"], [1529.7, "bereketi sabit olan her nesnenin (bereketi) mânevî ve lâzımdır."], [1535.4, "Yalnız tek bir zat müstesna;"], [1538.1, "ondan bir sonraki külliyede bahsedeceğim."]]}]}, {"ts": "25:43", "title": "7. Külliye: Peygamber ﷺ'in bütün eserlerinin bereketi zâtîdir ve intikal eder", "paras": [{"reader": false, "ar": [[1543.0, "الكلّيّة السابعة: <b>كلُّ آثار النبيّ صلى الله عليه وسلم بركتُها ذاتيّةٌ منتقلة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1543.0, "<b>7. külliye: Peygamber sallallâhu aleyhi ve sellem'in bütün eserlerinin bereketi zâtîdir ve intikal eder.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1558.0, "أقول وبالله التوفيق: لقد أجمع أصحابُ النبيّ صلى الله عليه وسلم،"], [1563.2, "ومن بعدهم إلى يومنا هذا من أهل العلم،"], [1567.0, "أنّ هناك بركةً خلقها الله عز وجل في عين رسول الله صلى الله عليه وسلم؛"], [1574.0, "فهو رجلٌ مبارك، ونبيٌّ مبارك،"], [1577.6, "ورسولٌ مبارك. وأنّها… عليه الصلاة والسلام… وأنّ هذه البركة التي أحلّها الله في رسوله صلى الله عليه وسلم هي تلك البركة التي تنتقل إلى كلّ شيءٍ يمسّه."]], "tr": [[1558.0, "Tevfik Allah'tandır, derim ki: Peygamber sallallâhu aleyhi ve sellem'in ashâbı ve onlardan sonra günümüze kadar ilim ehli, Allah Azze ve Celle'nin Resûlullah sallallâhu aleyhi ve sellem'in zatında yarattığı bir bereket bulunduğunda icmâ etmişlerdir."], [1574.0, "O mübarek bir adam, mübarek bir peygamber ve mübarek bir resuldür."], [1581.0, "Ve o… aleyhissalâtü vesselâm… Allah'ın Resûlü sallallâhu aleyhi ve sellem'e yerleştirdiği bu bereket, kendisine dokunan her şeye geçen o berekettir."]]}, {"reader": false, "ar": [[1594.0, "فإن عرِق فإنّ عرقَه بركة،"], [1598.0, "وإن توضّأ فإنّ فضلةَ طَهوره بركة،"], [1601.0, "وإن لبس شيئًا انتقلت البركةُ إلى ما لبسه،"], [1607.0, "وإن سقط منه شعرٌ،"], [1608.6, "أو حلق شعرًا، أو قصّر شعرًا،"], [1611.0, "فإنّ شعرَه فيه بركة."], [1615.0, "ولذلك ثبت عن الصحابة أنهم كانوا يتبرّكون بكلّ متعلّقات النبيّ صلى الله عليه وسلم."], [1623.0, "وهذه البركة في آثاره ـ بالإجماع ـ ليست مخصوصةً بحياته،"], [1630.0, "بل يجوز أن نتبرّك بآثاره ولو بعد وفاته."]], "tr": [[1594.0, "Terlerse teri berekettir; abdest alırsa abdest suyundan artakalan berekettir;"], [1599.5, "bir şey giyerse giydiği şeye bereket geçer;"], [1603.9, "ondan bir saç düşerse ya da saçını tıraş ettirir veya kısaltırsa, saçında bereket vardır."], [1611.0, "Bu yüzden sahabeden, Peygamber sallallâhu aleyhi ve sellem'e ait her şeyle teberrük ettikleri sabit olmuştur."], [1621.3, "Onun eserlerindeki bu bereket —icmâ ile— hayatına mahsus değildir;"], [1627.3, "aksine vefatından sonra da olsa onun eserleriyle teberrük etmemiz caizdir."]]}, {"reader": false, "ar": [[1637.0, "ولكن ستأتينا كلّيّةٌ أنّ كلَّ آثار النبيّ صلى الله عليه وسلم قد فُقدت في العصور الأولى،"], [1648.0, "وأنّ جميعَ ما يُدّعى أنّ هذا سيفُه،"], [1652.5, "وأنّ هذا قدحُ شرابه،"], [1655.1, "وأنّ هذا نعلُه، وأنّ هذا شعرُه،"], [1659.0, "كلُّ ذلك من الكذب والدجل الذي يُراد به ابتزازُ مشاعر المسلمين وعواطفهم،"], [1667.0, "أو ابتزازُ أموالهم، وإفسادُ عقائدهم."]], "tr": [[1637.0, "Fakat Peygamber sallallâhu aleyhi ve sellem'in bütün eserlerinin ilk asırlarda kaybolduğuna dair bir külliye gelecek."], [1646.9, "\"Bu onun kılıcıdır, bu içtiği kadehtir, bu onun ayakkabısıdır, bu onun saçıdır\" diye iddia edilen her şey, Müslümanların duygularını ve hislerini sömürmek ya da mallarını sızdırmak ve akîdelerini bozmak için yapılan yalan ve dolandırıcılıktır."]]}, {"reader": false, "ar": [[1671.0, "فقد كان الصحابة لا يتركون شيئًا من متعلّقات النبيّ صلى الله عليه وسلم إلا تبرّكوا بها."], [1680.0, "ففي «الصحيحين» من حديث أبي جُحَيفة رضي الله عنه قال:"], [1685.4, "رأيتُ النبيّ صلى الله عليه وسلم وهو بمكّة في قُبّةٍ حمراء من أَدَم،"], [1690.0, "وخرج بلالٌ بوَضوء رسول الله صلى الله عليه وسلم،"], [1696.0, "ورأيتُ الناس يبتدرون ذلك الوَضوء،"], [1702.0, "فمن أصاب منه شيئًا تمسّح به،"], [1706.0, "ومن لم يُصب منه أخذ من بلل يد صاحبه."], [1713.0, "ورأيتُ بلالًا أخذ عَنَزةً فركزها،"], [1717.0, "وخرج رسول الله صلى الله عليه وسلم في حُلّةٍ حمراء مشمِّرًا،"], [1723.0, "صلّى إلى العنزة ركعتين،"], [1724.8, "ورأيتُ الناس والدوابّ يمرّون بين يدي العنزة."]], "tr": [[1671.0, "Sahabe, Peygamber sallallâhu aleyhi ve sellem'e ait hiçbir şeyi teberrük etmeden bırakmazdı."], [1676.9, "Sahîhayn'de Ebû Cuhayfe radıyallâhu anh hadisinde şöyle dedi:"], [1681.7, "Peygamber sallallâhu aleyhi ve sellem'i Mekke'de deriden kırmızı bir çadırda gördüm."], [1686.8, "Bilâl, Resûlullah sallallâhu aleyhi ve sellem'in abdest suyuyla çıktı."], [1690.0, "İnsanların o abdest suyuna koşuştuklarını gördüm;"], [1694.0, "ondan bir şey isabet eden onu (yüzüne, bedenine) sürüyor, isabet etmeyen de arkadaşının elindeki ıslaklıktan alıyordu."], [1706.7, "Bilâl'in bir kısa mızrak alıp (yere) diktiğini gördüm."], [1713.0, "Resûlullah sallallâhu aleyhi ve sellem kırmızı bir elbise içinde, eteklerini toplamış olarak çıktı ve mızrağa doğru iki rekât namaz kıldı."], [1724.8, "İnsanların ve hayvanların mızrağın önünden geçtiklerini gördüm."]]}, {"reader": false, "ar": [[1728.0, "وفي حديث صلح الحديبية قال:"], [1730.9, "ما تنخّم رسولُ الله صلى الله عليه وسلم نُخامةً إلا وقعت في كفّ رجلٍ فدلك بها وجهَه وجلدَه،"], [1744.0, "وإذا توضّأ كادوا يقتتلون على وَضوئه."], [1748.0, "وفي «الصحيح» من حديث عائشة رضي الله عنها:"], [1752.6, "أنّ النبيّ صلى الله عليه وسلم كان إذا اشتكى جمع يديه ونفث فيهما بالمعوّذتين ومسح جسده بيد نفسه،"], [1763.0, "فلمّا اشتدّ عليه المرض كنتُ أقرأ في يدي النبيّ صلى الله عليه وسلم وأمسح جسده بيد نفسه طلبًا لبركتها."]], "tr": [[1728.0, "Hudeybiye sulhu hadisinde şöyle dedi:"], [1730.3, "Resûlullah sallallâhu aleyhi ve sellem ne zaman tükürse, mutlaka (tükürüğü) bir adamın avucuna düşer, o da onu yüzüne ve derisine sürerdi."], [1744.7, "Abdest aldığında da abdest suyu için neredeyse birbirleriyle çarpışırlardı."], [1750.3, "Sahîh'te Âişe radıyallâhu anhâ hadisinde de şöyle geçer:"], [1754.9, "Peygamber sallallâhu aleyhi ve sellem rahatsızlandığında ellerini birleştirir, Muavvizeteyn'i okuyarak içine üfler ve kendi eliyle bedenini meshederdi."], [1764.2, "Hastalığı ağırlaşınca, ben Peygamber sallallâhu aleyhi ve sellem'in ellerine okur, elinin bereketini umarak kendi eliyle bedenini meshederdim."]]}, {"reader": false, "ar": [[1774.0, "وفي الحديث عن أنسٍ رضي الله تعالى عنه قال:"], [1779.6, "كان رسول الله صلى الله عليه وسلم إذا صلّى الغداة ـ وتأمّلوا هذا الحديث ـ إذا صلّى الغداة جاء خدمُ المدينة بآنيتهم من الماء،"], [1793.2, "فما يُؤتى بإناءٍ إلا يغمس يدَه فيه،"], [1797.6, "فربّما جاؤوه في الغداة الباردة فيغمس يدَه فيه عليه الصلاة والسلام."]], "tr": [[1774.0, "Enes radıyallâhu teâlâ anh'tan gelen hadiste şöyle dedi:"], [1779.0, "Resûlullah sallallâhu aleyhi ve sellem sabah namazını kıldığında —bu hadisi iyi düşünün— sabah namazını kıldığında Medine'nin hizmetçileri su kaplarını getirirlerdi."], [1791.4, "Kendisine getirilen her kaba mutlaka elini daldırırdı."], [1795.7, "Bazen soğuk bir sabahta gelirlerdi, o aleyhissalâtü vesselâm yine de elini içine daldırırdı."]]}]}, {"ts": "30:05", "title": "7. Külliye (devam): Saç-ı şerif, cübbe ve eserlerin ilk asırda kaybolması", "paras": [{"reader": false, "ar": [[1805.0, "وكذلك كانوا يتبرّكون بشعر النبيّ صلى الله عليه وسلم."], [1810.0, "ففي «الصحيح» من حديث أنسٍ رضي الله تعالى عنه:"], [1814.0, "أنّ رسول الله صلى الله عليه وسلم أتى مِنًى،"], [1817.0, "فدعا بالحلّاق، وأشار إلى جانب رأسه الأيمن فحلقه،"], [1822.7, "فأعطاه رجلًا من الصحابة،"], [1825.6, "أبا طلحة ـ فأعطاه أبا طلحة ـ ثم أشار إلى نصفه الآخر فحلقه،"], [1832.7, "ثم أعطاه أبا طلحة وقال:"], [1836.0, "«اقسمه بين الناس». قال أنس:"], [1839.2, "فأصابتني شعرة. فأخذها من بعدِ أنسٍ ابنُ سيرين،"], [1844.0, "فكانت عندهم حتى فُقدت."]], "tr": [[1805.0, "Saç-ı şerifle de teberrük ederlerdi."], [1807.2, "Sahîh'te Enes radıyallâhu teâlâ anh hadisinde şöyle geçer:"], [1810.9, "Resûlullah sallallâhu aleyhi ve sellem Minâ'ya geldi, berberi çağırdı ve başının sağ tarafını gösterdi;"], [1816.0, "o da orayı tıraş etti."], [1817.7, "Onu sahabeden bir adama, Ebû Talha'ya verdi —Ebû Talha'ya verdi—."], [1824.1, "Sonra diğer yarısını gösterdi; onu da tıraş etti."], [1828.9, "Sonra onu Ebû Talha'ya verdi ve \"Bunu insanlar arasında paylaştır\" buyurdu."], [1835.3, "Enes dedi ki: Bana da bir tel isabet etti."], [1840.4, "Enes'ten sonra onu İbn Sîrîn aldı;"], [1843.4, "kaybolana kadar onların yanında kaldı."]]}, {"reader": false, "ar": [[1847.0, "وفي الحديث أيضًا ـ في حديث عبد الله بن عثمان بن مَوْهَب ـ أنهم كانوا إذا اعتلّ أحدُهم أرسلوه إلى ميمونة رضي الله تعالى عنها بقدحٍ فيه ماء،"], [1866.0, "فجاءت بجُلجُلٍ من فضّة فيه شيءٌ من شعرات النبيّ صلى الله عليه وسلم ـ وهذا بعد وفاته ـ فيه شيءٌ من شعرات النبيّ صلى الله عليه وسلم،"], [1879.0, "فتأخذ الشعرات فتخضخضها في الماء،"], [1881.8, "ثم تردّها في الجلجل،"], [1884.0, "فيُسقاه المريضُ فيبرأ، فيُسقاه المريضُ فيبرأ."]], "tr": [[1847.0, "Yine hadiste —Abdullah b. Osman b."], [1849.8, "Mevheb hadisinde— şöyle geçer: İçlerinden biri hastalandığında, içinde su bulunan bir kadehle onu (kadehi) Meymûne radıyallâhu teâlâ anhâ'ya gönderirlerdi."], [1860.3, "O da içinde Peygamber sallallâhu aleyhi ve sellem'in saçlarından birkaç tel bulunan gümüşten bir çıngırak (küçük kap) getirirdi —bu onun vefatından sonradır— içinde Peygamber sallallâhu aleyhi ve sellem'in saçlarından birkaç tel bulunan (bir kap)."], [1876.9, "Saç tellerini alıp suyun içinde çalkalar, sonra onları kaba geri koyardı."], [1881.2, "Hastaya o su içirilir, o da iyileşirdi;"], [1884.0, "hastaya o su içirilir, o da iyileşirdi."]]}, {"reader": false, "ar": [[1890.0, "وكذلك أيضًا ممّا خلّفه النبيّ صلى الله عليه وسلم جُبّة،"], [1899.0, "كانت عند عائشة حتى قُبضت،"], [1903.0, "فلمّا قُبضت قبضتها أسماء،"], [1908.0, "وكان النبيّ صلى الله عليه وسلم يلبسها في العيدين والجمعة،"], [1914.0, "فنحن نغسلها للمرضى يُستشفى بها،"], [1918.0, "فنحن نغسلها للمرضى يُستشفى بها."], [1923.0, "وهكذا في أدلّةٍ كثيرة."], [1925.0, "فجميعُ ما ثبت أنه من آثاره صلى الله عليه وسلم فإنه يجوز أن نتبرّك به."]], "tr": [[1890.0, "Peygamber sallallâhu aleyhi ve sellem'in geride bıraktıklarından biri de bir cübbedir."], [1897.3, "Âişe vefat edene kadar onun yanındaydı;"], [1902.2, "o vefat edince onu Esmâ aldı."], [1908.0, "Peygamber sallallâhu aleyhi ve sellem onu iki bayramda ve cumada giyerdi."], [1914.0, "\"Biz onu hastalar için yıkıyoruz, (suyuyla) şifa aranıyor;"], [1919.6, "biz onu hastalar için yıkıyoruz, (suyuyla) şifa aranıyor.\" Ve bunun gibi pek çok delil vardır."], [1929.2, "Onun eserlerinden olduğu sabit olan her şeyle teberrük etmemiz caizdir."]]}, {"reader": false, "ar": [[1937.0, "فإن قلتَ: وأيُّ البركتين أكثر في الشرع:"], [1941.0, "المعنويّةُ اللازمة أم الذاتيّةُ المنتقلة؟"], [1946.0, "الجواب: أكثرُ بركات الشرع هي تلك البركةُ المعنويّةُ اللازمة؛"], [1956.0, "لأنّ البركة الذاتيّة المنتقلة ليست في عينٍ من الأعيان إلا في عين… إلا في النبيّ صلى الله عليه وسلم."]], "tr": [[1937.0, "Eğer \"Şeriatte bu iki bereketten hangisi daha çoktur:"], [1940.4, "mânevî ve lâzım olan mı, zâtî ve intikal eden mi?\" dersen, cevap:"], [1949.5, "Şeriatteki bereketlerin çoğu o mânevî ve lâzım berekettir."], [1957.1, "Çünkü zâtî ve intikal eden bereket, nesnelerden hiçbirinde yoktur;"], [1961.3, "yalnız bir zatta… yalnız Peygamber sallallâhu aleyhi ve sellem'de vardır."]]}, {"reader": false, "ar": [[1966.0, "ولكن أؤكّد مرّةً أخرى أنّ جميع آثار النبيّ صلى الله عليه وسلم قد فُقدت في العصر الأوّل،"], [1978.0, "كما ثبت ذلك عن عمرو بن الحارث رضي الله عنه أنه قال:"], [1982.0, "«ما ترك رسولُ الله صلى الله عليه وسلم عند موته درهمًا، ولا دينارًا، ولا عبدًا، ولا أمةً، ولا شيئًا، إلا بغلتَه البيضاء، وسلاحَه، وأرضًا جعلها صدقة»."], [1995.0, "وهذا يدلّ على قلّة ما خلّفه الرسول صلى الله عليه وسلم بعد موته من أدواته الخاصّة،"], [2002.0, "وهذا القليلُ أيضًا قد فُقد في الزمان الأوّل. والله أعلم."]], "tr": [[1966.0, "Fakat bir kez daha vurguluyorum:"], [1968.6, "Peygamber sallallâhu aleyhi ve sellem'in bütün eserleri ilk asırda kaybolmuştur."], [1975.2, "Nitekim Amr b. el-Hâris radıyallâhu anh'tan şöyle dediği sabit olmuştur:"], [1980.0, "\"Resûlullah sallallâhu aleyhi ve sellem vefatında ne bir dirhem, ne bir dinar, ne bir köle, ne bir câriye ne de başka bir şey bıraktı;"], [1989.2, "yalnız beyaz katırını, silahını ve sadaka kıldığı bir araziyi bıraktı.\" Bu, Resûl sallallâhu aleyhi ve sellem'in vefatından sonra kendi özel eşyasından geride bıraktığı şeylerin azlığını gösterir."], [2001.6, "Bu az şey de ilk zamanda kaybolmuştur. Allah en iyisini bilir."]]}]}, {"ts": "33:28", "title": "8. Külliye: Delilsiz olarak bir şeyi bereket sebebi saymak küçük şirktir", "paras": [{"reader": false, "ar": [[2008.0, "ومن الكلّيّات أيضًا: <b>كلُّ من اعتقد في شيءٍ أنه سببٌ للبركة بلا دليل الشرع فشركٌ أصغر.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2008.0, "Külliyelerden biri de şudur: 8."], [2009.9, "külliye: Şer'î delil olmaksızın bir şeyin bereket sebebi olduğuna inanan herkes(in bu inancı) küçük şirktir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2038.0, "أقول وبالله التوفيق: وذلك لأنّ وضعَ البركة في الشيء إنما هو من أفعال الله عز وجل،"], [2046.3, "فلا يستطيعها أحدٌ من مخلوقاته وإن عظُم أمرُه وشأنُه."], [2051.0, "ولأنّ المتقرّر في القواعد أنّ من اعتقد سببًا لشيءٍ لم يدلّ على سببيّته له دليلُ الشرع ولا دليلُ القدر فهذا شركٌ أصغر."], [2070.0, "وبما أنّ الأمر غيبيّ فلا حقَّ لأحدٍ أن يتبرّك بشيءٍ إلا إذا ثبت الدليلُ بجواز التبرّك به."]], "tr": [[2038.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [2040.1, "Çünkü bir şeye bereket koymak ancak Allah Azze ve Celle'nin fiillerindendir;"], [2044.8, "O'nun mahlûkatından hiçbiri —işi ve şanı ne kadar büyük olursa olsun— buna güç yetiremez."], [2050.5, "Ayrıca kaidelerde yerleşik olan şudur:"], [2052.9, "Bir şey için, sebep oluşuna ne şer'î delilin ne de kaderî (tecrübî) delilin delâlet etmediği bir sebebe inanan kimse(nin bu inancı) küçük şirktir."], [2070.0, "Mesele gaybî olduğuna göre, hiç kimsenin, kendisiyle teberrük etmenin caiz olduğuna dair delil sabit olmadıkça bir şeyle teberrük etmeye hakkı yoktur."]]}, {"reader": false, "ar": [[2083.0, "فإذا طلب الإنسان بركةً من شيءٍ ـ معتقدًا أنّ الله هو الذي وضع البركة في هذا الشيء،"], [2094.0, "ويعتقد أنّ هذا الشيء إنما هو سببٌ لنيل البركة فقط ـ ولم يثبت دليلٌ بأنه سببٌ للبركة،"], [2104.0, "فمجرّدُ هذا الاعتقاد يوقع العبدَ في الشرك الأصغر؛"], [2109.0, "لأنه تدخّلٌ في شيءٍ من خصائص… من خصائص الله عز وجل."]], "tr": [[2083.0, "İnsan bir şeyden bereket istediğinde —bu şeye bereketi koyanın Allah olduğuna inanarak ve bu şeyin sadece berekete ulaşmak için bir sebep olduğuna inanarak— onun bereket sebebi olduğuna dair bir delil de sabit olmamışsa, sırf bu inanç kulu küçük şirke düşürür."], [2109.0, "Çünkü bu, hususiyetlerinden… Allah Azze ve Celle'nin hususiyetlerinden birine müdahaledir."]]}, {"reader": false, "ar": [[2115.0, "فالسببيّةُ الكونيّة والشرعيّة هذه من خصائص الله عز وجل،"], [2120.0, "وإنما المخلوقُ يكتشف هذه السببيّة،"], [2123.5, "ولكن لا يخلقها ولا يضعها."], [2127.0, "فدورُنا في هذه الحياة اكتشافُها،"], [2131.0, "واكتشافُها له طريقان: إمّا أن نكتشفها لأنّ الشارع أخبرنا بها،"], [2138.0, "وإمّا أن نكتشفها لأنّ التجربة القدريّة الكونيّة دلّت على سببيّتها."], [2146.0, "وأمّا أن نزعم سببيّةً لا يقف وراء سببيّتها دليلُ شرعٍ ولا دليلُ قدر،"], [2153.0, "فإنّ هذا تدخّلٌ في شيءٍ من خصائص الله عز وجل،"], [2158.0, "وأقلُّ أحواله أن يكون شركًا أصغر."]], "tr": [[2115.0, "Kevnî ve şer'î sebebiyet Allah Azze ve Celle'nin hususiyetlerindendir."], [2119.4, "Mahlûk bu sebebiyeti ancak keşfeder;"], [2122.1, "onu ne yaratır ne de koyar."], [2126.3, "Bu hayattaki rolümüz onu keşfetmektir."], [2130.2, "Onu keşfetmenin iki yolu vardır:"], [2134.0, "Ya Şâri' bize onu haber verdiği için onu keşfederiz ya da kaderî-kevnî tecrübe onun sebep oluşuna delâlet ettiği için onu keşfederiz."], [2147.6, "Arkasında ne şer'î ne de kaderî bir delil bulunan bir sebebiyet iddia etmemize gelince, bu Allah Azze ve Celle'nin hususiyetlerinden birine müdahaledir;"], [2158.0, "en hafif hâli küçük şirk olmasıdır."]]}, {"reader": false, "ar": [[2161.0, "وبناءً على ذلك فمن طلب البركة من شجرٍ مع اعتقاده أنّ الله هو الذي يخلق البركة في الشجرة فقد وقع في الشرك الأصغر،"], [2175.0, "ومن تبرّك بحجرٍ معتقدًا أنّ الله هو الذي وضع البركة في هذا الحجر فقد أشرك شركًا أصغر،"], [2186.0, "إذا لم يدلّ الدليلُ على جواز التبرّك به."], [2191.0, "فكلّيّتُنا هذه مفروضةٌ في التبرّك بالأشياء التي لم يرد لها… لم يرد بجواز التبرّك بها دليل."]], "tr": [[2161.0, "Buna binaen, ağaçta bereketi yaratanın Allah olduğuna inanmakla birlikte bir ağaçtan bereket isteyen kimse küçük şirke düşmüştür."], [2172.0, "Bu taşa bereketi koyanın Allah olduğuna inanarak bir taşla teberrük eden kimse de —eğer delil onunla teberrük etmenin caiz olduğuna delâlet etmiyorsa— küçük şirk koşmuştur."], [2189.8, "Bu külliyemiz, kendileri için… kendileriyle teberrük etmenin caiz olduğuna dair delil gelmemiş şeylerle teberrük hakkında varsayılmıştır."]]}, {"reader": false, "ar": [[2202.0, "وكذلك إذا تبرّك بالأولياء والصالحين ـ أي بآثارهم ـ معتقدًا أنّ سؤرهم فيه بركةٌ تنتقل،"], [2217.0, "أو أنّ عرقهم فيه بركةٌ تنتقل،"], [2221.0, "أو أنّ ثيابهم فيها بركةٌ تنتقل،"], [2224.0, "أو أنّ نُخامتهم ولُعابهم فيه بركةٌ تنتقل،"], [2229.0, "فتبرّك بذلك وصار يدلك به جسده،"], [2233.0, "أو يمسح به وجهه وصدره،"], [2236.0, "فهذا قد وقع في الشرك الأصغر."], [2240.0, "والأمثلةُ على ذلك كثيرة."]], "tr": [[2202.0, "Velîlerle ve sâlihlerle —yani onların eserleriyle— teberrük eden de böyledir:"], [2212.9, "Onların artığında geçen bir bereket bulunduğuna, terlerinde geçen bir bereket bulunduğuna, elbiselerinde geçen bir bereket bulunduğuna ya da balgamlarında ve salyalarında geçen bir bereket bulunduğuna inanarak bununla teberrük eder, onu bedenine sürmeye ya da onunla yüzünü ve göğsünü sıvazlamaya başlarsa, bu kimse küçük şirke düşmüştür. Bunun örnekleri çoktur."]]}, {"reader": false, "ar": [[2243.0, "وكالذي يتبرّك بجدران الكعبة؛"], [2246.0, "فإنّ الله لم يجعل التبرّكَ بالجدران سببًا لحلول البركة."], [2252.0, "والتبرّكُ بمقام إبراهيم، والتبرّكُ بأعمدة المسجد الحرام أو أعمدة المسجد النبويّ معتقدًا أنّ التمسّح بها سببٌ للبركة،"], [2268.0, "وكلُّ ذلك من طلب البركة بلا دليلٍ شرعيّ."]], "tr": [[2243.0, "Kâbe'nin duvarlarıyla teberrük eden kimse gibi;"], [2246.7, "çünkü Allah duvarlarla teberrük etmeyi bereketin yerleşmesine sebep kılmamıştır."], [2251.3, "Makâm-ı İbrâhim ile teberrük etmek, Mescid-i Harâm'ın sütunlarıyla ya da Mescid-i Nebevî'nin sütunlarıyla, onlara sürünmenin bereket sebebi olduğuna inanarak teberrük etmek de böyledir."], [2269.4, "Bunların hepsi şer'î delil olmaksızın bereket istemektendir."]]}]}, {"ts": "37:55", "title": "9. Külliye: Bir mahlûkun bizzat bereket verdiğine inanmak büyük şirktir", "paras": [{"reader": false, "ar": [[2275.0, "ويوضّح ذلك الكلّيّةُ التي بعدها:"], [2278.0, "<b>كلُّ من اعتقد في مخلوقٍ أنه يُبارِك بذاته فشركٌ أكبر.<\/b> وذلك شركٌ في الربوبيّة."], [2287.0, "فمتى ما ظننتَ أنّ الشجرة التي تبرّكتَ بها هي التي خلقت بركتها فهذا شركٌ أكبر،"], [2295.0, "ومتى ما اعتقدتَ أنّ ترابَ القبر الذي تبرّكتَ به أنّ الميّت هو الذي وضع فيه البركة وخلقها وأوجدها فهذا شركٌ أكبر."]], "tr": [[2275.0, "Bunu ondan sonraki külliye açıklar:"], [2278.0, "<b>9. külliye: Bir mahlûkun bizzat kendisinin bereket verdiğine inanan herkes(in bu inancı) büyük şirktir.<\/b> Bu, rubûbiyyette şirktir."], [2289.7, "Teberrük ettiğin ağacın, onun bereketini kendisinin yarattığını zannettiğinde bu büyük şirktir."], [2296.1, "Teberrük ettiğin kabir toprağına bereketi koyanın, onu yaratanın ve var edenin ölü olduğuna inandığında bu büyük şirktir."]]}, {"reader": false, "ar": [[2308.0, "فكلُّ من تبرّك بشجرٍ،"], [2310.7, "أو حجرٍ، أو إنسانٍ،"], [2313.4, "أو ترابٍ، أو حيٍّ،"], [2316.1, "أو ميّتٍ، يعتقد أنّ هذا الشيء الذي تبرّك به هو الذي خلق هذه البركة،"], [2326.0, "وهو الذي أحلّها وأوجدها في هذا الشيء،"], [2330.0, "فلا جرمَ أنّ هذا يُخرج العبدَ عن دائرة الإسلام بالكلّيّة."], [2336.0, "وهو الذي كان يفعله المشركون مع أوثانهم وأصنامهم؛"], [2341.0, "فإنهم كانوا يتمسّحون بها ويتبرّكون بها،"], [2344.0, "معتقدين أنها تخلق لهم البركة."]], "tr": [[2308.0, "Bir ağaçla, bir taşla, bir insanla, bir toprakla, bir diriyle ya da bir ölüyle teberrük edip, teberrük ettiği bu şeyin bu bereketi kendisinin yarattığına, onu bu şeye kendisinin yerleştirip var ettiğine inanan herkes(e gelince), şüphesiz bu, kulu tamamen İslâm dairesinden çıkarır."], [2335.4, "Müşriklerin vesenleriyle ve putlarıyla yaptıkları da budur."], [2339.8, "Onlar, kendilerine bereketi onların yarattığına inanarak onlara sürünür ve onlarla teberrük ederlerdi."]]}, {"reader": false, "ar": [[2348.0, "وعلى ذلك حديثُ أبي واقدٍ الليثيّ رضي الله عنه قال:"], [2353.4, "خرجنا مع رسول الله صلى الله عليه وسلم إلى حُنَين ونحن حُدَثاءُ عهدٍ بكفر،"], [2360.0, "وللمشركين سِدرةٌ يعكفون عندها وينوطون بها أسلحتهم ـ أي يطلبون البركة منها طلبَ ذات ـ فقال الصحابة:"], [2371.1, "يا رسول الله، اجعل لنا ذاتَ أنواطٍ كما لهم ذاتُ أنواط."], [2377.0, "فقال النبيّ صلى الله عليه وسلم:"], [2380.0, "«اللهُ أكبر! إنها السُّنن، قلتم ـ والذي نفسي بيده ـ كما قالت بنو إسرائيل لموسى: <span class=\"ayah\">﴿اجْعَل لَّنَا إِلَٰهًا كَمَا لَهُمْ آلِهَةٌ﴾<\/span> <span class=\"ref\">[الأعراف: ١٣٨]<\/span>»."]], "tr": [[2348.0, "Ebû Vâkıd el-Leysî radıyallâhu anh hadisi de bunu ifade eder."], [2351.9, "Şöyle dedi: Resûlullah sallallâhu aleyhi ve sellem ile birlikte Huneyn'e çıktık;"], [2356.1, "biz küfürden yeni çıkmıştık. Müşriklerin yanında itikâfa durdukları ve silahlarını astıkları bir sidre ağacı vardı —yani ondan zâtî olarak bereket istiyorlardı—."], [2368.0, "Sahabe dedi ki: \"Ey Allah'ın Resûlü, onların Zâtu Envât'ı olduğu gibi bize de bir Zâtu Envât belirle.\" Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2378.0, "\"Allahu ekber! İşte (önceki ümmetlerin) yolları bunlardır."], [2380.5, "Nefsim elinde olana yemin olsun ki, İsrâiloğullarının Mûsâ'ya söylediği gibi söylediniz:"], [2384.7, "<span class=\"ayah\">﴿Onların ilâhları olduğu gibi bize de bir ilâh yap﴾<\/span> [A'râf 138].\""]]}, {"reader": false, "ar": [[2389.0, "وهذا يدلّ على أنّ هذا من الشرك الأكبر،"], [2392.0, "ولكنّ عذرَهم أنهم حُدَثاءُ عهدٍ بكفر؛"], [2396.0, "يعني أنه لا تزال بعضُ أمور الجاهليّة مستقرّةً في القلب لم تخرج بعد."], [2402.0, "وقد كان من مقاصد النبيّ صلى الله عليه وسلم أن يحرص كلَّ الحرص على أن يُخرج بعضَ لوثة الجاهليّة من قلوب الصحابة؛"], [2411.0, "لأنّ الإنسان إذا عاش على شيءٍ زمانًا طويلًا فليس من الممكن أن ينقلب ما في قلبه ممّا ألِفه وأنِس به واعتاده واعتقده،"], [2423.1, "أن يتغيّر في يومٍ وليلة."]], "tr": [[2389.0, "Bu, bunun büyük şirkten olduğunu gösterir;"], [2391.2, "fakat onların mazereti küfürden yeni çıkmış olmalarıdır."], [2396.0, "Yani cahiliyenin bazı şeyleri hâlâ kalpte yerleşik duruyordu, henüz çıkmamıştı."], [2401.1, "Peygamber sallallâhu aleyhi ve sellem'in maksatlarından biri de cahiliyenin bazı kirlerini sahabenin kalplerinden çıkarmaya son derece özen göstermekti."], [2409.2, "Çünkü insan uzun bir zaman bir şey üzerine yaşarsa, kalbindeki alıştığı, ünsiyet ettiği, âdet edindiği ve inandığı şeyin bir gün ve bir gecede değişip dönüşmesi mümkün değildir."]]}, {"reader": false, "ar": [[2426.0, "ولذلك لمّا حجّوا معه في حجّة الوداع وطافوا وسعَوا،"], [2431.0, "ألزم من لم يَسُق الهديَ أن يقصّر ويجعلها عمرة؛"], [2440.0, "ليُخرج ما في قلوبهم من أمر الجاهليّة أنّ العمرة في أشهر الحجّ من أفجر الفجور،"], [2445.6, "حتى استنكر بعضُهم وقال:"], [2448.0, "أيذهب أحدُنا إلى مِنًى وذَكَرُه يقطر منيًّا؟!"], [2451.0, "يعني وهو حلال. فقد كان النبيّ صلى الله عليه وسلم حريصًا على أن يُخرج ذلك."]], "tr": [[2426.0, "Bu yüzden Vedâ haccında onunla birlikte hac yapıp tavaf ve sa'y ettiklerinde, kurbanlık hayvan getirmemiş olanları saçlarını kısaltmaya ve onu (haccı) umreye çevirmeye mecbur tuttu."], [2440.7, "(Bunu,) kalplerindeki \"hac aylarında umre yapmak en büyük günahlardandır\" şeklindeki cahiliye inancını çıkarmak için (yaptı)."], [2445.6, "Öyle ki bazıları bunu yadırgadı ve şöyle dedi:"], [2448.9, "\"Birimiz Minâ'ya, tenasül uzvundan meni damlarken mi gidecek?!\" Yani ihramdan çıkmış hâlde."], [2454.2, "Peygamber sallallâhu aleyhi ve sellem bunu (kalplerden) çıkarmaya çok özen gösteriyordu."]]}, {"reader": false, "ar": [[2460.0, "والخلاصةُ من هذه الكلّيّة:"], [2463.0, "أنّ من اعتقد أنّ الشيء الذي تبرّك به هو الذي يخلق البركة بذاته فهذا شركٌ أكبر،"], [2471.0, "وإن اعتقد أنّ الله هو الذي يخلق البركة،"], [2476.0, "ولكنّ هذا مجرّدُ سبب، فهذا شركٌ أصغر."]], "tr": [[2460.0, "Bu külliyenin özeti şudur: Teberrük ettiği şeyin bereketi bizzat kendisinin yarattığına inanan kimse(nin bu inancı) büyük şirktir."], [2470.3, "Bereketi yaratanın Allah olduğuna, fakat bu şeyin sadece bir sebep olduğuna inanırsa bu küçük şirktir."]]}]}, {"ts": "41:21", "title": "10. Külliye: Bereketi delille sabit olan şeyden bereket ancak şer'î sıfatla istenir", "paras": [{"reader": false, "ar": [[2481.0, "الكلّيّة العاشرة: <b>كلُّ ما ثبتت بركتُه بالدليل فلا تُطلب إلا على الصفة الشرعيّة.<\/b> كلُّ ما ثبتت بركتُه بالدليل فلا تُطلب إلا على الصفة المشروعة."]], "tr": [[2481.0, "<b>10. külliye: Bereketi delille sabit olan her şeyin (bereketi) ancak şer'î sıfat üzere istenir.<\/b> Bereketi delille sabit olan her şeyin (bereketi) ancak meşru sıfat üzere istenir."]]}, {"reader": false, "ar": [[2502.0, "أقول وبالله التوفيق: هذه الكلّيّة مهمّةٌ جدًّا؛"], [2508.0, "وذلك لأنّ من الناس من يعمد إلى شيءٍ ثبتت بركته بالنصّ ـ زمانًا،"], [2515.8, "أو مكانًا، أو عينًا ـ ثم يفتح لنفسه الأبواب ليطلب بركتها بأيّ صفةٍ شاء،"], [2529.0, "ولا حقَّ لك أن تنكر عليه هذه الصفة؛"], [2535.0, "لأنه سيستدلّ بأنّ هذا الزمان مبارك،"], [2540.0, "وأنا أطلب بهذه الصفة بركته،"], [2543.0, "أو أنّ هذا المكان مبارك،"], [2546.0, "وأنا أطلب بهذه الصفة بركته،"], [2550.0, "أو أنّ هذه العين مباركة،"], [2552.0, "وأنا أطلب بهذه الصفة بركتها."]], "tr": [[2502.0, "Tevfik Allah'tandır, derim ki: Bu külliye çok önemlidir."], [2506.5, "Bu şundandır: İnsanlardan bazıları, bereketi nasla sabit olan bir şeye —bir zamana, bir mekâna ya da bir nesneye— yönelir, sonra onun bereketini dilediği her sıfatla istemek için kendine kapılar açar;"], [2527.0, "(ona göre) senin de ona bu sıfat sebebiyle karşı çıkmaya hakkın yoktur."], [2534.1, "Çünkü o şununla delil getirecektir:"], [2537.3, "\"Bu zaman mübarektir, ben de onun bereketini bu sıfatla istiyorum\";"], [2543.0, "ya da \"Bu mekân mübarektir, ben de onun bereketini bu sıfatla istiyorum\";"], [2550.0, "ya da \"Bu nesne mübarektir, ben de onun bereketini bu sıfatla istiyorum.\""]]}, {"reader": false, "ar": [[2556.0, "فتأتي هذه الكلّيّة لتردّ عليه بأنه ـ وإن ثبتت بركتُه شرعًا ـ فلا حقَّ لك أن تطلب البركة منه إلا على صفة الشرع؛"], [2570.0, "فانظر كيف أجاز لك الشارعُ أن تطلب بركتها فتقتصر على هذه الصفات."], [2576.0, "فالبركةُ أصلًا ووصفًا مبنيّان على التوقيف."]], "tr": [[2556.0, "İşte bu külliye ona şöyle cevap vermek için gelir:"], [2560.2, "Bereketi şer'an sabit olsa bile, ondan bereketi ancak şeriatin (belirlediği) sıfat üzere istemeye hakkın vardır."], [2568.2, "Şâri'nin, onun bereketini istemene nasıl izin verdiğine bak ve bu sıfatlarla yetin."], [2574.0, "Bereket, hem aslı hem de vasfı (şekli) bakımından tevkîf üzerine kuruludur."]]}, {"reader": false, "ar": [[2582.0, "فالقرآن عينٌ مباركة، فاطلب بركته بما أذن لك به الشرع:"], [2589.0, "فاطلب بركته من قراءته،"], [2591.0, "اطلب بركته من تدبّره،"], [2594.0, "اطلب بركته من قراءته في البيت،"], [2599.0, "اطلب بركته بالاستشفاء به،"], [2602.0, "اطلب بركته بالحكم به والتحاكم إليه."], [2608.0, "لكن أن تطلب بركته بأن تضعه على وسادتك ليمنعك من الأحلام المزعجة ويحفظك من الشياطين،"], [2616.0, "هذا طلبٌ للبركة بغير صفة الشرع."]], "tr": [[2582.0, "Kur'ân mübarek bir nesnedir; onun bereketini şeriatin sana izin verdiği şeyle iste:"], [2589.0, "Onun bereketini okumasından iste, onun bereketini tedebbüründen iste, onun bereketini evde okunmasından iste, onun bereketini onunla şifa aramakla iste, onun bereketini onunla hükmetmek ve onun hükmüne başvurmakla iste."], [2605.8, "Fakat onun bereketini, seni rahatsız edici rüyalardan alıkoysun ve şeytanlardan korusun diye onu yastığının üzerine koyarak istemen, şeriatin (belirlediği) sıfattan başka bir şekilde bereket istemektir."]]}, {"reader": false, "ar": [[2619.0, "أو أن تطلب بركته بأن تفتحه للفأل؛"], [2623.8, "فإذا أردتَ سفرًا فتحتَه لعلّ عينك تقع على آيةٍ تعينك على السفر،"], [2634.0, "وإذا أردتَ زواجًا فتحتَه،"], [2637.0, "وإذا أردتَ تجارةً فتحتَه،"], [2641.0, "تفتحه للفأل مرّتين أو ثلاثًا،"], [2644.5, "ثم تقرأ الوجهَ الذي فتحتَه،"], [2649.0, "لعلّك تجد فيه ما يعينك على الإقدام أو الإحجام."], [2653.0, "فهل هذه الصورة من صور البركة بكتاب الله عز وجل؟ الجواب: لا."]], "tr": [[2619.0, "Ya da onun bereketini fal için açarak istemen:"], [2623.1, "Bir yolculuğa çıkmak istediğinde, belki gözün yolculuk için sana yardımcı olacak bir ayete rastlar diye onu açarsın;"], [2634.0, "evlenmek istediğinde onu açarsın; ticaret yapmak istediğinde onu açarsın;"], [2638.7, "onu iki ya da üç kez fal için açar, sonra açtığın sayfayı okursun ki belki onda (işe) girişmek ya da (ondan) vazgeçmek konusunda sana yardımcı olacak bir şey bulursun."], [2654.0, "Bu şekil, Allah Azze ve Celle'nin Kitabı'yla bereket (aramanın) şekillerinden midir? Cevap: Hayır."]]}, {"reader": false, "ar": [[2659.0, "وليس من بركته أن نضعه تميمةً لجلب الخير أو دفع الشرّ،"], [2668.0, "وليس من البركة أن نضعه في السيّارة استدفاعًا لوقوع الشرّ عليها أو تفاديًا لوقوع الحادث عليها؛"], [2679.0, "فكلُّ ذلك من الصور التي لم يأتِ الدليلُ بجواز التبرّك بالمصحف على منوالها."]], "tr": [[2659.0, "Onu hayır celbetmek ya da şerri defetmek için bir muska olarak takmamız onun bereketinden değildir."], [2669.4, "Başına bir kötülük gelmesini defetmek ya da kaza olmasından sakınmak için onu arabaya koymamız da bereketten değildir."], [2679.6, "Bunların hepsi, delilin, mushafla bu tarzda teberrük etmenin caiz olduğuna dair gelmediği şekillerdendir."]]}, {"reader": false, "ar": [[2687.0, "وكذلك ماءُ زمزم عينٌ مباركة،"], [2691.0, "ولكن لا حقَّ لك أن تخترع صورةً لطلب البركة من هذا الماء المبارك."], [2697.0, "فليس من بركته… اسمعوا لي،"], [2700.1, "ترى هذه أسئلة ـ يعني ـ جاوبتُ عليها <span class=\"q\">؟ 44:59<\/span>."]], "tr": [[2687.0, "Zemzem suyu da böyledir; o mübarek bir nesnedir."], [2691.5, "Fakat bu mübarek sudan bereket istemek için bir şekil icat etmeye hakkın yoktur."], [2696.5, "Onun bereketinden değildir… Beni dinleyin;"], [2699.4, "bunlar (sorulmuş) sorulardır, yani onlara cevap verdim <span class=\"q\">؟<\/span>."]]}]}, {"ts": "45:03", "title": "10. Külliye (devam): Zemzem, Kâbe, Ravza; bereket babında iki esas", "paras": [{"reader": false, "ar": [[2703.0, "فليس من بركته سقيُ السيّارة به،"], [2707.0, "وضعُه في السيّارة ـ يعني في ماء الرّديتر ـ حتى تكون السيّارة مباركة."], [2714.1, "وليس من بركته غسلُ الثياب به،"], [2717.9, "وليس من بركته تعميمُ البيت به لتحلّ البركة."], [2723.0, "وإنما بركتُه في شربه والاستشفاء به أو الوضوء به؛"], [2727.5, "فقد ثبت عن النبيّ صلى الله عليه وسلم أنه دعا بسَجْلٍ من ماء زمزم فشرب منه وتوضّأ."]], "tr": [[2703.0, "Arabayı onunla sulamak, onu arabaya —yani radyatör suyuna— araba mübarek olsun diye koymak onun bereketinden değildir."], [2712.2, "Elbiseleri onunla yıkamak onun bereketinden değildir."], [2715.4, "Bereket yerleşsin diye evin her yerine onu serpmek onun bereketinden değildir."], [2721.7, "Onun bereketi ancak içilmesinde, onunla şifa aranmasında ya da onunla abdest alınmasındadır."], [2727.5, "Nitekim Peygamber sallallâhu aleyhi ve sellem'in zemzem suyundan bir kova isteyip ondan içtiği ve abdest aldığı sabit olmuştur."]]}, {"reader": false, "ar": [[2736.0, "وكذلك أيضًا الكعبةُ عينٌ مباركة،"], [2739.4, "لكن تُطلب بركتها بالطواف حولها ومسّ الركنين اليمانيّين منها،"], [2747.0, "لكن ليس من بركتها أن تؤخذ خيوطُ سُترتها،"], [2752.4, "أو أن يوضع الصدرُ والوجه عليها؛"], [2758.0, "فكلُّ ذلك ممّا لا دليلَ عليه،"], [2761.5, "إلا فيما بين المقام ـ إلا فيما بين الركن والباب،"], [2766.8, "والمسمّى بالملتزَم ـ فهذا قد ورد عن النبيّ صلى الله عليه وسلم،"], [2771.4, "وعن جمعٍ من أصحابه،"], [2772.9, "وعن السلف تجويزُه. فلا حقَّ لأحدٍ أن يأتي إلى شيءٍ مبارك ثم يخترع لنا صفةً يطلب فيها البركةَ منه ولا دليلَ عليها."]], "tr": [[2736.0, "Kâbe de böyledir; mübarek bir nesnedir."], [2739.4, "Fakat onun bereketi etrafında tavaf etmekle ve iki Yemânî köşesine dokunmakla istenir."], [2748.3, "Örtüsünün ipliklerinin alınması ya da göğsün ve yüzün ona dayanması onun bereketinden değildir."], [2758.0, "Bunların hepsi üzerinde delil olmayan şeylerdendir;"], [2760.9, "yalnız Makâm ile —pardon, Rükün (Hacer-i Esved köşesi) ile kapı arasındaki, Mültezem denilen yer müstesna."], [2768.8, "Bunun caiz olduğu Peygamber sallallâhu aleyhi ve sellem'den, ashâbından bir topluluktan ve seleften gelmiştir."], [2773.6, "Dolayısıyla hiç kimsenin mübarek bir şeye gelip de ondan bereket istemek için bize üzerinde delil olmayan bir sıfat icat etmeye hakkı yoktur."]]}, {"reader": false, "ar": [[2787.0, "وكذلك أيضًا نقول: إنّ الروضة الشريفة مكانٌ مبارك،"], [2792.2, "لكن لا تخصّها بشيءٍ من الأذكار دون سائر أجزاء المسجد،"], [2799.0, "ولا تعتقد فضيلةَ صلاة ركعتين فيها دون سائر المسجد؛"], [2805.0, "فصلاةُ الركعتين فيها كسائر أجزاء المسجد."], [2810.0, "فالزحامُ الذي نراه عليها هذا من باب طلب البركة من موضعٍ مباركٍ بما لم ترِد الأدلّة بجواز طلب البركة منه."], [2821.0, "وكذلك بركةُ الحجر الأسود ونحوها."]], "tr": [[2787.0, "Yine deriz ki: Ravza-i şerîfe mübarek bir mekândır;"], [2791.6, "fakat onu mescidin diğer kısımlarından ayırarak zikirlerden herhangi biriyle tahsis etme."], [2797.5, "Orada iki rekât namaz kılmanın, mescidin diğer yerlerinden farklı bir fazileti olduğuna da inanma;"], [2806.3, "orada iki rekât kılmak, mescidin diğer kısımlarında kılmak gibidir."], [2811.9, "Orada gördüğümüz izdiham, mübarek bir yerden, delillerin caiz olduğuna dair gelmediği bir şekilde bereket istemek kabîlindendir."], [2819.4, "Hacer-i Esved'in bereketi ve benzerleri de böyledir."]]}, {"reader": false, "ar": [[2825.0, "فالمهمُّ أنّ من الخلط في باب البركة أن يعتقد الإنسان أنه متى ما ثبت الدليلُ ببركة زمانٍ فليفعل في هذا الزمان ما يشاء طلبًا للبركة وإن لم يرد به دليل،"], [2840.0, "وإذا ثبتت البركةُ في مكانٍ أو عينٍ فله الحقُّ المطلق أن يطلب البركةَ بأيّ صفةٍ شاء من هذا المكان أو من هذه العين،"], [2853.8, "ولو لم يرد بها دليل."]], "tr": [[2825.0, "Önemli olan şudur: Bereket babındaki karışıklıklardan biri, insanın şuna inanmasıdır:"], [2831.5, "Bir zamanın bereketine dair delil sabit olduğunda, hakkında delil gelmemiş olsa bile bereket isteyerek o zamanda dilediğini yapabilir;"], [2839.6, "bir mekânda ya da bir nesnede bereket sabit olduğunda da, hakkında delil gelmemiş olsa bile, o mekândan ya da o nesneden dilediği her sıfatla bereket istemeye mutlak hakkı vardır."]]}, {"reader": false, "ar": [[2856.0, "فنحن في باب البركة مطالَبون بأمرين:"], [2859.0, "الأمرُ الأوّل: ألّا نعتقد بركةً في زمانٍ أو مكانٍ أو عينٍ إلا بدليل."], [2868.0, "والأمرُ الثاني: ألّا نطلب البركةَ ممّا ثبتت البركةُ فيه بالنصّ إلا على وَفق الدليل؛"], [2876.7, "لنكون أكملَ متابعةً للنبيّ صلى الله عليه وسلم."]], "tr": [[2856.0, "Biz bereket babında iki şeyle mükellefiz:"], [2858.5, "Birinci şey: Bir zamanda, bir mekânda ya da bir nesnede ancak delille bereket bulunduğuna inanmak."], [2867.0, "İkinci şey: Bereketi nasla sabit olan şeyden bereketi ancak delile uygun olarak istemek;"], [2874.0, "ta ki Peygamber sallallâhu aleyhi ve sellem'e en mükemmel şekilde tâbi olanlar olalım."]]}, {"reader": false, "ar": [[2882.0, "وبذلك نكون قد انتهينا من درسنا،"], [2886.0, "وآخرُ دعوانا أنِ الحمدُ لله ربِّ العالمين،"], [2889.0, "وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[2882.0, "Böylece dersimizi bitirmiş olduk. Son duamız, âlemlerin Rabbi Allah'a hamd olsun (demektir)."], [2888.6, "Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
