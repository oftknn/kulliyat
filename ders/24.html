<script>
const D={"no": 24, "vid": "q4N7zemAbcc", "title_ar": "الدرس (٢٤) من شرح كليات العقيدة — كليات البدعة المفسّقة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 24. Ders: Sahibini Fâsık Kılan (Tefsîk Eden) Bid'ate Dair Külliyeler", "sections": [{"ts": "00:00", "title": "Giriş ve 1. Külliye: Dinin vâcip kemâline aykırı her bid'at tefsîk edicidir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.5, "والصلاةُ والسلامُ على رسول الله الأمين،"], [6.2, "وعلى آله وأصحابه الطيبين الطاهرين،"], [9.3, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [13.0, "أمّا بعد: فلا نزال في سياق الكلّيّات التي تتكلّم عن البدع ومعرفتها وأحكامها."], [21.0, "وأظنّ أننا استقطعنا الدرسَ الماضي في الكلام على البدعة المكفِّرة،"], [28.0, "ومتى تكون البدعة مكفِّرة،"], [30.7, "أليس كذلك؟ وهذا الدرس بكلّيّاته العشر سوف نقطعه في النوع الثاني من أنواع البدع باعتبار أحكامها، وهي البدعة المفسِّقة."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.5, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [13.0, "Bundan sonra: Hâlâ bid'atlerden, onların tanınmasından ve hükümlerinden bahseden külliyeler bağlamındayız."], [21.0, "Zannediyorum geçen dersi, (sahibini) kâfir kılan bid'at ve bid'atin ne zaman kâfir kılıcı olacağı hakkındaki konuşmaya ayırdık, öyle değil mi?"], [30.7, "Bu dersi de on külliyesiyle, hükümleri itibarıyla bid'at türlerinin ikinci türüne, yani (sahibini) fâsık kılan bid'ate ayıracağız."]]}, {"reader": false, "ar": [[46.0, "فنقول وبالله التوفيق: الكلّيّة الأولى:"], [52.0, "<b>كلُّ بدعةٍ تنافي كمالَ الدين الواجب فمفسِّقة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[46.0, "Tevfik Allah'tandır, deriz ki: 1."], [46.0, "külliye: Dinin vâcip kemâline aykırı düşen her bid'at, (sahibini) fâsık kılar. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[71.0, "أقول وبالله التوفيق: أي أننا نحكم على صاحبها بأنه فاسق؛"], [78.0, "وذلك لأنّ الدين ننظر له بثلاث اعتبارات:"], [85.0, "باعتبار أصله، فكلُّ بدعةٍ تنافي أصلَ الدين فمكفِّرة؛"], [92.0, "وباعتبار كماله الواجب الذي لا تحصل النجاة يوم القيامة إلا به،"], [98.0, "وهو محطُّ رحال كلّيّتنا هذه؛"], [103.0, "وإلى كمال الدين المندوب المستحبّ."]], "tr": [[71.0, "Tevfik Allah'tandır, derim ki: Yani sahibinin fâsık olduğuna hükmederiz."], [78.0, "Bu şundandır: Dine üç itibarla bakarız:"], [78.0, "Aslı itibarıyla; dinin aslına aykırı her bid'at (sahibini) kâfir kılar."], [92.0, "Kıyamet günü kurtuluşun ancak onunla gerçekleşeceği vâcip kemâli itibarıyla;"], [98.0, "bu külliyemizin konusu budur. Bir de dinin mendup, müstehap kemâline (göre)."]]}, {"reader": false, "ar": [[108.0, "والبدع لا بدّ أن تتنافى مع الدين في الجزئيّتين الأُولَيَين:"], [117.0, "فمن البدع ما يتنافى مع أصل الدين،"], [121.9, "وهي البدع المكفِّرة، ومن البدع ما يتنافى مع كمال الدين الواجب،"], [129.5, "وهي البدع المفسِّقة. فليس هناك بدعةٌ يرتكبها الإنسان لا تتنافى مع أصل الدين أو مع كماله الواجب."], [142.0, "ولذلك فالقول الصحيح أنّ البدع كلَّها في صفّ الكبائر،"], [146.8, "أنّ البدع كلّها في مصافّ الكبائر."]], "tr": [[108.0, "Bid'atler, dinle ilk iki cüzde mutlaka çatışır:"], [108.0, "Bid'atlerin bir kısmı dinin aslına aykırıdır;"], [117.0, "bunlar kâfir kılan bid'atlerdir. Bir kısmı da dinin vâcip kemâline aykırıdır;"], [121.9, "bunlar fâsık kılan bid'atlerdir. İnsanın işlediği, dinin aslına ya da vâcip kemâline aykırı düşmeyen hiçbir bid'at yoktur."], [129.5, "Bu yüzden doğru görüş şudur:"], [142.0, "Bid'atlerin hepsi büyük günahlar safındadır, bid'atlerin hepsi büyük günahlar sırasındadır."]]}, {"reader": false, "ar": [[150.0, "فليس في البدع ما لا يتنافى مع أصل الدين أو يتنافى مع كماله الواجب؛"], [160.4, "لا بدّ من منافاة البدعة لواحدةٍ من هاتين الجزئيّتين."], [169.0, "فالبدع ـ وإن حرّمها الدليل،"], [171.7, "ونهى عنها، وذمّ أصحابها،"], [174.4, "وحذّر منها، وأخبر بالعقوبة على فاعلها ـ إلا أنها قد تتنافى مع أصل الدين،"], [185.8, "وتتنافى مع كماله الواجب."]], "tr": [[150.0, "Bid'atler arasında dinin aslına aykırı olmayan ya da vâcip kemâline aykırı olmayan (bir bid'at) yoktur;"], [160.4, "bid'atin bu iki cüzden birine aykırı olması kaçınılmazdır."], [160.4, "Bid'atleri —delil onları haram kılmış, onlardan nehyetmiş, sahiplerini yermiş, onlardan sakındırmış ve failinin cezalandırılacağını haber vermiş olsa da— (bunlar) bazen dinin aslına, bazen de vâcip kemâline aykırı düşer."]]}, {"reader": false, "ar": [[190.0, "فالبدعة التي تتنافى مع كماله الواجب نحكم على صاحبها بأنه فاسق،"], [196.0, "أي: ناقص الإيمان، لم يأتِ بالإيمان الذي تتحقّق به نجاتُه يوم القيامة."], [204.0, "وأمثلتها كثيرةٌ جدًّا؛ فهناك من البدع المفسِّقة ما هو عقديّ كما سيأتي،"], [215.1, "ومنها ما هو عمليّ."], [220.0, "فمن البدع الاعتقادية: تحريفُ شيءٍ من صفات الله تعالى،"], [226.0, "فهذا من البدع المفسِّقة لا المكفِّرة؛"], [230.0, "وكاعتقاد كفر مرتكب الكبيرة،"], [232.8, "فإنها من البدع المفسِّقة لا المكفِّرة."]], "tr": [[190.0, "Dinin vâcip kemâline aykırı düşen bid'atin sahibinin fâsık olduğuna hükmederiz;"], [190.0, "yani imanı eksiktir, kıyamet günü kurtuluşunu sağlayacak imanı getirmemiştir."], [196.0, "Bunun örnekleri pek çoktur. Fâsık kılan bid'atlerin bir kısmı —ileride geleceği gibi— akîdevîdir, bir kısmı da amelîdir."], [204.0, "İtikâdî bid'atlerden biri, Allah Teâlâ'nın sıfatlarından bir kısmını tahrif etmektir;"], [220.0, "bu, kâfir kılan değil, fâsık kılan bid'atlerdendir."], [226.0, "Büyük günah işleyenin kâfir olduğuna inanmak da böyledir;"], [232.8, "bu da kâfir kılan değil, fâsık kılan bid'atlerdendir."]]}, {"reader": false, "ar": [[239.0, "واعتقادُ الجبرية في باب القضاء والقدر أنّ العبد ليس له قدرةٌ ولا اختيارٌ في مجال الأقدار،"], [249.0, "فهي من البدع المفسِّقة لا المكفِّرة."], [254.0, "وكالأذكار الجماعية، أو ضرب الدفوف في الأذكار،"], [261.0, "وكالاحتفالات البدعية ببعض الليالي المعظَّمة،"], [267.0, "ونحو ذلك ممّا سيأتي بيانه إن شاء الله تعالى."]], "tr": [[239.0, "Cebriyye'nin kazâ ve kader babında, kulun kaderler alanında hiçbir kudreti ve seçimi olmadığına dair inancı da kâfir kılan değil, fâsık kılan bid'atlerdendir."], [254.0, "Toplu zikirler, zikirlerde def çalmak, bazı yüceltilen gecelerde yapılan bid'at kutlamalar ve —inşallah açıklaması gelecek olan— benzerleri de böyledir."]]}, {"reader": false, "ar": [[272.0, "فإن قلتَ: وهل هناك ضوابطُ تعرّفنا بأنّ هذه البدعة مفسِّقة؟"], [279.0, "الجواب: نعم، وهو ما سيأتي من الكلّيّات، والله أعلم."]], "tr": [[272.0, "Şayet \"Bu bid'atin fâsık kılıcı olduğunu bize tanıtan zâbıtlar var mı?\" dersen, cevap:"], [279.0, "Evet; bunlar ileride gelecek külliyelerdir. Allah en iyisini bilir."]]}]}, {"ts": "04:45", "title": "2. Külliye: Zamana bağlı her bid'at tefsîk edicidir", "paras": [{"reader": false, "ar": [[285.0, "الكلّيّة الثانية: <b>كلُّ بدعةٍ زمانيّةٍ فمفسِّقة.<\/b> ماشي معي؟"], [291.0, "<b>كلّ بدعةٍ زمانيّةٍ فمفسِّقة.<\/b> بمعنى أنّ البدعة التي سببُها اختراعُ زمانيّةٍ لا دليل عليها،"], [302.7, "هذه ليست بمكفِّرة، وإنما مفسِّقة؛"], [312.0, "كالاحتفال بيوم مولد النبيّ صلى الله عليه وسلم،"], [317.0, "فإنّ هذا الإحداث من البدع المفسِّقة؛"], [321.0, "لأنها بدعةٌ تتعلّق بالزمان."]], "tr": [[285.0, "<b>2. külliye: Zamana bağlı her bid'at, (sahibini) fâsık kılar.<\/b> Benimle misiniz?"], [291.0, "<b>Zamana bağlı her bid'at fâsık kılar.<\/b> Yani sebebi, delili olmayan bir zamaniyyet (zaman tahsisi) icat etmek olan bid'at kâfir kılıcı değil, fâsık kılıcıdır."], [312.0, "Nebî ﷺ'in doğum gününü kutlamak gibi;"], [317.0, "bu ihdas fâsık kılan bid'atlerdendir, çünkü zamanla ilgili bir bid'attir."]]}, {"reader": false, "ar": [[325.0, "أو الاحتفال بأيّ يومٍ من الموالد البدعية التي عند الصوفية،"], [331.0, "فإنها بدعةٌ مفسِّقة لتعلُّقها بالزمان."], [335.0, "أو الاحتفال بليلة الإسراء والمعراج،"], [339.0, "فإنها من البدع المفسِّقة لتعلُّقها بالزمان."], [344.0, "أو اعتقاد فضيلة الصلاة في زمانٍ معيّنٍ لا دليل عليه،"], [351.0, "أو اعتقاد فضيلة الصوم في زمانٍ معيّنٍ لا دليل عليه،"], [359.0, "أو اعتقاد فضيلة الذكر أو قراءة القرآن في زمانيّةٍ معيّنةٍ لا دليل عليها."]], "tr": [[325.0, "Ya da Sûfîlerdeki bid'at mevlidlerden herhangi bir günü kutlamak;"], [325.0, "bu da zamanla ilgili olduğu için fâsık kılan bir bid'attir."], [331.0, "Ya da İsrâ ve Mi'râc gecesini kutlamak;"], [335.0, "bu da zamanla ilgili olduğu için fâsık kılan bid'atlerdendir."], [339.0, "Ya da delili olmayan belirli bir zamanda namazın faziletine inanmak, delili olmayan belirli bir zamanda orucun faziletine inanmak, ya da delili olmayan belirli bir zaman diliminde zikrin veya Kur'an okumanın faziletine inanmak."]]}, {"reader": false, "ar": [[372.0, "فكلُّ من ربط تعبُّدًا بزمانٍ لا دليل عليه فبدعته من نوع البدع المفسِّقة."], [382.0, "فاختراعُ الزمان يعرّفك بأنّ هذه البدعة مفسِّقةٌ وليست بمكفِّرة."], [391.0, "واضح هذا الكلام؟ والله أعلم."]], "tr": [[372.0, "Bir taabbudu delili olmayan bir zamana bağlayan herkesin bid'ati, fâsık kılan bid'atler türündendir."], [382.0, "Zaman icat etmek, sana bu bid'atin kâfir kılıcı değil fâsık kılıcı olduğunu tanıtır."], [382.0, "Bu söz açık mı? Allah en iyisini bilir."]]}]}, {"ts": "06:33", "title": "3. Külliye: Taabbudun faziletinde bütün zamanlar eşittir", "paras": [{"reader": false, "ar": [[393.0, "الكلّيّة الثالثة: كلُّ الأزمنة في فضل التعبُّد سواء،"], [404.0, "إلا ما خصّه النصُّ بفضلٍ خاصّ. <span class=\"note\">(يكررها)<\/span> أعيدها مرّةً ثالثة:"], [424.0, "كلّ الأزمنة في فضل التعبّد سواء،"], [428.0, "إلا ما خصّه النصّ بفضلٍ خاصّ."]], "tr": [[393.0, "3. külliye: Taabbudun faziletinde bütün zamanlar eşittir;"], [393.0, "ancak nassın özel bir faziletle tahsis ettiği (zaman) müstesnadır. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [404.0, "Taabbudun faziletinde bütün zamanlar eşittir;"], [424.0, "ancak nassın özel bir faziletle tahsis ettiği müstesnadır."]]}, {"reader": false, "ar": [[433.0, "بمعنى أنّ الله عز وجل خلق الأزمنة وجعل فضلَ التعبُّد فيها واحدًا،"], [440.0, "فمن ادّعى فضيلةَ تعبُّدٍ في زمانٍ دون زمان فإنه مخالفٌ للأصل،"], [449.2, "ودعواه موقوفةٌ على المجيء بالدليل؛"], [456.0, "لأنّ الاستحباب حكمٌ شرعيّ،"], [458.6, "والمتقرّر في القواعد أنّ الأحكام الشرعية تفتقر في ثبوتها للأدلّة الصحيحة الصريحة."], [467.0, "فلا حقَّ لأحدٍ أن يربط فضيلةَ تعبُّدٍ بأيّ زمانٍ إلا وعلى ذلك دليل."]], "tr": [[433.0, "Yani Allah Azze ve Celle zamanları yaratmış ve onlarda taabbudun faziletini bir kılmıştır."], [433.0, "Kim bir taabbudun bir zamanda diğerinden daha faziletli olduğunu iddia ederse asıl kurala muhalefet etmiş olur ve iddiası delil getirmesine bağlıdır."], [456.0, "Çünkü müstehaplık şer'î bir hükümdür;"], [458.6, "kaidelerde yerleşik olan şudur: Şer'î hükümler sübutlarında sahih ve sarih delillere muhtaçtır."], [458.6, "Hiç kimsenin, üzerinde bir delil olmadıkça bir taabbudun faziletini herhangi bir zamana bağlama hakkı yoktur."]]}, {"reader": false, "ar": [[473.0, "ولأنّ الأصل في التعبُّدات الإطلاقُ عن الزمان،"], [478.0, "فمن قال: هذا التعبُّد في هذا الزمان أفضلُ من الزمان الذي قبله والزمان الذي بعده،"], [486.0, "فإننا نطالبه بالدليل الدالّ على هذه الأفضلية."], [492.0, "وبناءً على ذلك: فمن ادّعى فضيلةَ قراءة الفاتحة،"], [497.4, "أو قراءة شيءٍ من القرآن غيرها،"], [503.0, "في زمانٍ معيّن، فإننا نطالبه بالدليل الدالّ على صحّة هذه الدعوى."]], "tr": [[473.0, "Ayrıca taabbudlarda asıl, zamandan mutlak (bağımsız) olmaktır."], [478.0, "Kim \"Bu taabbud bu zamanda, öncesindeki ve sonrasındaki zamandan daha faziletlidir\" derse, ondan bu üstünlüğe delâlet eden delili isteriz."], [486.0, "Buna göre kim belirli bir zamanda Fâtiha'yı ya da ondan başka Kur'an'dan bir kısmı okumanın faziletini iddia ederse, ondan bu iddianın doğruluğuna delâlet eden delili isteriz."]]}, {"reader": false, "ar": [[511.0, "ومن اعتقد فضيلةَ الصلاة في زمانٍ دون زمان فهو مطالَبٌ بالدليل الدالّ على صحّة هذه الدعوى."], [523.0, "ومن اعتقد فضيلةَ زيارة القبور في زمانٍ معيّنٍ من اليوم والليلة،"], [531.0, "أو من الأسبوع أو الشهر أو العام،"], [533.0, "فإننا نطالبه بالدليل الدالّ على صحّة هذه الدعوى."], [539.0, "ومن اعتقد فضيلةَ الصوم في رجب،"], [543.1, "أو فضيلةَ العمرة بخصوصها في رجبٍ بخصوصه،"], [549.0, "فإنه مطالَبٌ بالدليل الدالّ على صحّة هذه الدعوى."]], "tr": [[511.0, "Kim namazın bir zamanda diğerinden daha faziletli olduğuna inanırsa, bu iddianın doğruluğuna delâlet eden delili getirmekle yükümlüdür."], [523.0, "Kim gece ve gündüzün, ya da haftanın, ayın veya yılın belirli bir zamanında kabir ziyaretinin faziletine inanırsa, ondan bu iddianın doğruluğuna delâlet eden delili isteriz."], [533.0, "Kim Receb'de orucun faziletine ya da özellikle Receb ayında özellikle umrenin faziletine inanırsa, bu iddianın doğruluğuna delâlet eden delili getirmekle yükümlüdür."]]}, {"reader": false, "ar": [[555.0, "بل ومن اعتقد فضيلةَ أيّ قولٍ أو عملٍ تعبُّديّ فإنّ قبول قوله موقوفٌ على صحّة دليله؛"], [567.0, "فإن جاءنا به صحيحًا صريحًا فعلى العين والرأس،"], [572.0, "وإلا فلا حقّ لأحدٍ أن يقيّد تعبُّدًا بزمانٍ بلا دليل."], [577.0, "أو اعتقاد فضيلة ذكرٍ في كلّ يومٍ بعينه:"], [584.0, "فيستحبّ في يوم السبت هذا الذكرُ المعيّن،"], [589.0, "وفي يوم الأحد هذا الذكرُ المعيّن،"], [592.8, "وهكذا في أيام الأسبوع كلّها؛"], [595.9, "فذلك من البدع التي ما أنزل الله بها من سلطان."], [602.2, "أو اعتقاد فضيلة ختم العام أو ابتدائه بصومٍ أو استغفارٍ أو صلاة،"], [612.0, "فإنه مطالَبٌ بالدليل الدالّ على صحّة هذه الدعوى، والله أعلم."]], "tr": [[555.0, "Hatta kim herhangi bir taabbudî söz veya amelin faziletine inanırsa, sözünün kabulü delilinin sahih olmasına bağlıdır."], [567.0, "Onu sahih ve sarih olarak getirirse başım gözüm üstüne;"], [567.0, "aksi hâlde hiç kimsenin bir taabbudu delilsiz olarak bir zamanla kayıtlama hakkı yoktur."], [577.0, "Ya da her güne özgü bir zikrin faziletine inanmak:"], [584.0, "Cumartesi günü şu belirli zikir, pazar günü şu belirli zikir müstehaptır;"], [589.0, "haftanın bütün günlerinde böyle... Bu, Allah'ın hakkında hiçbir delil indirmediği bid'atlerdendir."], [595.9, "Ya da yılı oruçla, istiğfarla veya namazla bitirmenin ya da başlatmanın faziletine inanmak;"], [602.2, "(bunu iddia eden) bu iddianın doğruluğuna delâlet eden delili getirmekle yükümlüdür. Allah en iyisini bilir."]]}]}, {"ts": "10:22", "title": "4. Külliye: Mekâna bağlı her bid'at tefsîk edicidir", "paras": [{"reader": false, "ar": [[622.0, "إذن أخذنا أنّ البدعة الزمانية مفسِّقة،"], [624.7, "ثم أخذنا القاعدة في الزمان،"], [626.7, "ولّا لا؟ طيب، اللي بعدها،"], [629.3, "وهي الكلّيّة الرابعة: <b>كلُّ بدعةٍ مكانيّةٍ فمفسِّقة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[622.0, "Demek ki zamana bağlı bid'atin fâsık kıldığını öğrendik, sonra da zaman hakkındaki kaideyi öğrendik, değil mi?"], [626.7, "Peki, sonrakine (geçelim); o da 4."], [629.3, "külliyedir: <b>4. külliye: Mekâna bağlı her bid'at, (sahibini) fâsık kılar.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[647.0, "بمعنى أنّ الله عز وجل خلق الأمكنة،"], [653.0, "وجعل فضلَ التعبُّد فيها واحدًا،"], [657.0, "فمن زعم في تعبُّدٍ أنه في هذا المكان أفضلُ منه في الأمكنة الأخرى فهو يدّعي شيئًا زائدًا على الأصل،"], [670.0, "ولا نقبل هذه الدعوى إلا إذا جاءنا بدليلٍ خاصّ."], [675.0, "فما رأيتَه من البدع المكانية قد أُدخل على شيءٍ من التعبُّدات فاعرف أنه من جملة البدع المفسِّقة."]], "tr": [[647.0, "Yani Allah Azze ve Celle mekânları yaratmış ve onlarda taabbudun faziletini bir kılmıştır."], [657.0, "Kim bir taabbudun bu mekânda diğer mekânlardakinden daha faziletli olduğunu ileri sürerse, asıl kurala ilave bir şey iddia etmiş olur;"], [670.0, "bu iddiayı ancak bize özel bir delil getirirse kabul ederiz."], [675.0, "Taabbudlardan birine sokulmuş gördüğün mekânla ilgili bid'atlerin, fâsık kılan bid'atler cümlesinden olduğunu bil."]]}, {"reader": false, "ar": [[689.0, "فمهما اخترع الناس أمكنةً وألصقوها بالتعبُّدات فإنها لا تصل إلى التكفير،"], [700.0, "وإنما تبقى على حدّ البدع المفسِّقة؛"], [704.0, "كاعتقاد فضيلة الصلاة في مكانٍ معيّنٍ بلا دليل،"], [711.0, "أو اعتقاد فضيلة ذكرٍ في مكانٍ معيّنٍ بلا دليل،"], [716.0, "أو اعتقاد فضيلة صومٍ في مكانٍ معيّنٍ بلا دليل،"], [724.0, "أو اعتقاد فضيلة الصدقة في مكانٍ معيّنٍ بلا دليل،"], [730.0, "أو اعتقاد فضيلة الذبح في مكانٍ معيّنٍ بلا دليل."], [740.0, "فكلُّ هذا من البدع المفسِّقة،"], [744.0, "ولا تصل إلى درجة التكفير، والله أعلم."]], "tr": [[689.0, "İnsanlar ne kadar mekân icat edip onları taabbudlara yapıştırsalar da bu, tekfîre ulaşmaz;"], [689.0, "fâsık kılan bid'atler sınırında kalır."], [700.0, "Delilsiz olarak belirli bir mekânda namazın faziletine inanmak, delilsiz olarak belirli bir mekânda bir zikrin faziletine inanmak, delilsiz olarak belirli bir mekânda bir orucun faziletine inanmak, delilsiz olarak belirli bir mekânda sadakanın faziletine inanmak ya da delilsiz olarak belirli bir mekânda kurban kesmenin faziletine inanmak gibi."], [730.0, "Bunların hepsi fâsık kılan bid'atlerdendir ve tekfîr derecesine ulaşmaz. Allah en iyisini bilir."]]}]}, {"ts": "12:28", "title": "5. Külliye: Taabbudun faziletinde bütün mekânlar eşittir", "paras": [{"reader": false, "ar": [[748.0, "الكلّيّة الخامسة: كلُّ الأمكنة في فضل التعبُّد سواء،"], [757.1, "إلا ما خصّه النصُّ بفضلٍ خاصّ. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[748.0, "5. külliye: Taabbudun faziletinde bütün mekânlar eşittir;"], [748.0, "ancak nassın özel bir faziletle tahsis ettiği (mekân) müstesnadır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[778.0, "فلا يجوز لنا أن نعتقد أنّ هذا القول أو هذا الفعل التعبُّديّ في هذا المكان أفضلُ منه في المكان الذي قبله والمكان الذي بعده إلا بدليلٍ يدلّ على هذا."], [796.0, "فمن اعتقد فضيلةَ صلاةٍ،"], [798.6, "أو صومٍ، أو صدقةٍ،"], [801.3, "أو قراءة قرآنٍ، أو ذكرٍ،"], [804.6, "أو طوافٍ، أو وقوفٍ،"], [812.0, "أو سجودٍ وركوعٍ، في مكانٍ معيّنٍ دون غيره من الأمكنة،"], [820.0, "فقبول قوله موقوفٌ على ثبوت الدليل؛"], [825.0, "فإن جاءنا به صحيحًا صريحًا فأهلًا وسهلًا،"], [829.0, "وإلا فلا حقّ لأحدٍ أن يقيّد مطلقَ التعبُّدات بمكانٍ إلا بدليل، والله أعلم."]], "tr": [[778.0, "Bu taabbudî söz veya fiilin bu mekânda, öncesindeki ve sonrasındaki mekândakinden daha faziletli olduğuna, buna delâlet eden bir delil olmadıkça inanmamız caiz değildir."], [778.0, "Kim namazın, orucun, sadakanın, Kur'an okumanın, zikrin, tavafın, vakfenin ya da secde ve rükûun diğer mekânlar değil de belirli bir mekânda faziletli olduğuna inanırsa, sözünün kabulü delilin sübutuna bağlıdır."], [820.0, "Onu sahih ve sarih olarak getirirse hoş geldi sefa geldi;"], [825.0, "aksi hâlde hiç kimsenin mutlak taabbudları delilsiz olarak bir mekânla kayıtlama hakkı yoktur. Allah en iyisini bilir."]]}]}, {"ts": "13:55", "title": "6. Külliye: Sayıya bağlı her bid'at tefsîk edicidir", "paras": [{"reader": false, "ar": [[835.0, "الكلّيّة السادسة: <b>كلُّ بدعةٍ عدديّةٍ فمفسِّقة.<\/b> <span class=\"note\">(يكررها)<\/span> بمعنى أن يعمد المبتدع إلى تعبُّدٍ مشروع،"], [868.0, "فيضيف عليه عدديّةً لا دليل عليها."], [875.0, "فأيُّ عدديّةٍ محدثةٍ دخلت على تعبُّدٍ مشروعٍ فإننا نصفها بأنها بدعةٌ مفسِّقة."], [886.0, "ومهما أحدثوا من العدديّات في التعبُّد فلا يمكن أبدًا أن يصل الإحداث في عدديّتهم إلى الكفر،"], [897.0, "وإنما يبقى في دائرة التفسيق."]], "tr": [[835.0, "<b>6. külliye: Sayıya bağlı her bid'at, (sahibini) fâsık kılar.<\/b> (Tekrar ediyor.) Yani bid'atçinin meşru bir taabbuda yönelip ona delili olmayan bir sayı (adediyyet) eklemesidir."], [875.0, "Meşru bir taabbuda giren her muhdes sayıyı, fâsık kılan bir bid'at olarak niteleriz."], [886.0, "Taabbudda ne kadar sayı icat etseler de, sayılarındaki ihdasın küfre ulaşması asla mümkün değildir; tefsîk dairesinde kalır."]]}, {"reader": false, "ar": [[902.0, "وبناءً على ذلك: فمن اعتقد فضيلةَ الذكر ـ أيًّا كان نوعه ـ بعدديّةٍ معيّنةٍ لا دليل عليها فهو من أصحاب البدع المفسِّقة."], [922.0, "أو قال في الرقية مثلًا:"], [925.3, "تقرأ سورة الفاتحة سبعين مرّة،"], [928.6, "أو تقرأ آية كذا بكذا وكذا من الأعداد،"], [937.0, "فتلك من البدع العدديّة التي توجب فسقَ صاحبها."], [942.0, "أو اعتقد فضيلةَ الصلاة على النبيّ صلى الله عليه وسلم بعدديّةٍ معيّنةٍ لا دليل عليها،"], [954.7, "فهي من البدع المفسِّقة."]], "tr": [[902.0, "Buna göre kim —türü ne olursa olsun— zikrin delili olmayan belirli bir sayıyla faziletli olduğuna inanırsa, fâsık kılan bid'atlerin sahiplerindendir."], [902.0, "Ya da rukye hakkında mesela \"Fâtiha sûresini yetmiş kere okursun\" ya da \"Şu ayeti şu kadar ve şu kadar sayıda okursun\" derse, bunlar sahibinin fâsıklığını gerektiren sayı bid'atlerindendir."], [942.0, "Ya da Nebî ﷺ'e salavât getirmenin delili olmayan belirli bir sayıyla faziletli olduğuna inanırsa, bu da fâsık kılan bid'atlerdendir."]]}, {"reader": false, "ar": [[957.0, "أو اعتقد فضيلةَ الاستغفار بعدديّةٍ معيّنةٍ ـ فهذا،"], [963.4, "عفوًا ـ ولا دليل عليها،"], [965.9, "فإنها من البدع المفسِّقة."], [971.0, "وأقصد بها العدديّة التي يعتقد فضيلةً فيها بخصوصها،"], [980.0, "وليست من باب التنظيم والترتيب وجدولة الوقت،"], [986.0, "بل هي من العدديّة التي تدخل تحت التخصيص التعبُّديّ الدينيّ،"], [994.0, "الذي لا نقبل شيئًا منه ولا من متعلَّقاته إلا بدليل."]], "tr": [[957.0, "Ya da istiğfarın belirli bir sayıyla faziletli olduğuna inanırsa —bu, pardon— ve bunun delili yoksa, bu da fâsık kılan bid'atlerdendir."], [965.9, "Bununla, kişinin özellikle kendisinde bir fazilet olduğuna inandığı sayıyı kastediyorum;"], [980.0, "düzen, tertip ve vakti planlama kabilinden olan (sayıyı) değil."], [986.0, "Bilakis, hiçbir kısmını ve hiçbir taallukunu delilsiz kabul etmediğimiz dinî, taabbudî tahsisin altına giren sayıyı (kastediyorum)."]]}]}, {"ts": "16:39", "title": "7. Külliye: Taabbudun şekline sokulan her muhdes şey tefsîk edicidir", "paras": [{"reader": false, "ar": [[999.0, "ومن الكلّيّات أيضًا: <b>كلُّ المحدثات الدخيلة على هيئة التعبُّد مفسِّقة.<\/b> كلّ المحدثات على هيئة التعبّد ـ أو الدخيلة على هيئة التعبّد ـ مفسِّقة."], [1020.0, "أعيدها ثالثة: <b>كلّ المحدثات الدخيلة على هيئة التعبّد مفسِّقة.<\/b>"]], "tr": [[999.0, "Külliyelerden biri de şudur: 7."], [999.0, "külliye: Taabbudun şekline (heyetine) sonradan sokulan bütün muhdes şeyler, (sahibini) fâsık kılar. Taabbudun şekli üzerindeki —ya da taabbudun şekline sokulan— bütün muhdes şeyler fâsık kılar."], [1020.0, "Üçüncü kez tekrar ediyorum: <b>Taabbudun şekline sokulan bütün muhdes şeyler fâsık kılar.<\/b>"]]}, {"reader": false, "ar": [[1027.0, "بمعنى أن يعمد المبتدع إلى تعبُّدٍ شرعيّ،"], [1033.0, "ثم يُدخل فيه هيئةً محدثةً لا دليل عليها."], [1039.0, "فمهما أحدثوا من الهيئات في التعبُّدات فبدعُهم مفسِّقة،"], [1045.0, "ولا تصل إلى دائرة الكفر."], [1048.0, "وذلك كالتزام الصوت الجماعيّ عند الذكر،"], [1052.0, "فتلك هيئةٌ دخيلةٌ على أصلٍ شرعيّ فمفسِّقة."], [1058.0, "أو الضرب بالدفوف والاهتزاز والتراقص عند قول الأذكار،"], [1069.0, "فتلك هيئةٌ دخيلةٌ على الذكر فتكون مفسِّقة."]], "tr": [[1027.0, "Yani bid'atçinin şer'î bir taabbuda yönelip sonra ona delili olmayan muhdes bir şekil sokmasıdır."], [1033.0, "Taabbudlarda ne kadar şekil icat etseler de bid'atleri fâsık kılıcıdır ve küfür dairesine ulaşmaz."], [1045.0, "Zikir sırasında toplu sesi (koro hâlinde zikri) âdet edinmek gibi;"], [1048.0, "bu, şer'î bir asla sokulmuş bir şekildir, dolayısıyla fâsık kılar."], [1058.0, "Ya da zikirleri söylerken def çalmak, sallanmak ve raks etmek;"], [1058.0, "bu, zikre sokulmuş bir şekildir, dolayısıyla fâsık kılar."]]}, {"reader": false, "ar": [[1074.0, "أو ما يسمّى بصلاة الرغائب،"], [1077.6, "أو الصلاة الألفيّة، وهي صلاةٌ يَكُدّون فيها أنفسهم حتى يقرؤوا <span class=\"ayah\">﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ١]<\/span> في ركعتين ألفَ مرّة،"], [1092.0, "ويعتقدون فضيلةً لها في جزءٍ زمنيٍّ من العام؛"], [1098.0, "فتلك هيئةٌ دخيلةٌ على التعبُّد فتكون مفسِّقة."], [1105.0, "وكالضرب على الفخذين قبل السلام، كما يفعله الرافضة."]], "tr": [[1074.0, "Ya da Regâib namazı veya \"Elfiyye namazı\" denilen şey;"], [1077.6, "bu, iki rekâtta bin kere <span class=\"ayah\">﴿De ki: O Allah birdir﴾<\/span> [İhlâs 1] okuyuncaya kadar kendilerini yordukları bir namazdır ve yılın belli bir zaman diliminde onun bir fazileti olduğuna inanırlar."], [1092.0, "Bu, taabbuda sokulmuş bir şekildir, dolayısıyla fâsık kılar."], [1098.0, "Râfızîlerin yaptığı gibi selamdan önce uyluklara vurmak da böyledir."]]}, {"reader": false, "ar": [[1115.0, "وكجمع القراءات في الآية الواحدة في الصلاة في ركعة:"], [1121.0, "فيقرأ آيةً لها عدّة قراءاتٍ عند القُرّاء،"], [1126.6, "فكلّما انتهى من قراءةٍ جاء بالقراءة الثانية،"], [1132.0, "فجمع القراءات في قراءة الركعة الواحدة؛"], [1137.0, "هذا من البدع في الهيئات،"], [1139.0, "فتكون من جملة المفسِّقات."]], "tr": [[1115.0, "Namazda bir rekâtta tek bir ayette kıraatleri birleştirmek de böyledir:"], [1121.0, "Kurrâya göre birkaç kıraati olan bir ayeti okur;"], [1121.0, "bir kıraati bitirdikçe ikinci kıraati getirir ve böylece tek rekâtın kıraatinde kıraatleri birleştirir."], [1132.0, "Bu, şekillerdeki bid'atlerdendir; dolayısıyla fâsık kılan şeyler cümlesinden olur."]]}, {"reader": false, "ar": [[1143.0, "فأخذنا من ذلك كلّه أنّ البدع متى ما كانت زمانيّةً فمفسِّقة،"], [1150.0, "أو مكانيّةً فمفسِّقة، أو عدديّةً فمفسِّقة،"], [1156.0, "أو دخلت على هيئةٍ تعبُّديّةٍ فمفسِّقة، والله أعلم."]], "tr": [[1143.0, "Bütün bunlardan şunu öğrendik: Bid'atler zamana bağlı olduğunda fâsık kılar, mekâna bağlı olduğunda fâsık kılar, sayıya bağlı olduğunda fâsık kılar ya da taabbudî bir şekle sokulduğunda fâsık kılar. Allah en iyisini bilir."]]}]}, {"ts": "19:28", "title": "8. Külliye: Şâriin mutlak bıraktığını kayıtlayan ya da kayıtladığını mutlak bırakan bid'atçidir", "paras": [{"reader": false, "ar": [[1168.0, "ومن الكلّيّات أيضًا: كلُّ من قيّد ما أطلقه الشارع،"], [1174.1, "أو أطلق ما قيّده الشارع،"], [1177.5, "فمبتدع. <span class=\"note\">(يكررها)<\/span> واضحة القاعدة؟"]], "tr": [[1168.0, "Külliyelerden biri de şudur: 8."], [1168.0, "külliye: Şâriin mutlak bıraktığını kayıtlayan ya da Şâriin kayıtladığını mutlak bırakan herkes bid'atçidir. (Tekrar ediyor.) Kaide açık mı?"]]}, {"reader": false, "ar": [[1201.0, "وذلك لأنّ الأصل موافقةُ الشرع في هيئة التعبُّد إطلاقًا وتقييدًا."], [1211.0, "فإذا رأيتَ الإنسان يفكّ ما أطلقه الشارع ليقيّده بشيءٍ معيّنٍ بلا دليل فقد ابتدع،"], [1220.0, "وإذا رأيتَ الإنسان يعمد إلى ما قيّده الشارع ثم يحلّ إطلاقه ـ يحلّ قيدَه ـ ليكون مطلقًا فقد ابتدع."], [1231.1, "فلا بدّ أن توقَع العبادة على الوجه الذي شُرعت عليه إطلاقًا وتقييدًا."]], "tr": [[1201.0, "Bu şundandır: Asıl olan, taabbudun şeklinde mutlaklık ve kayıtlılık bakımından şeriate uymaktır."], [1201.0, "İnsanın, Şâriin mutlak bıraktığını delilsiz olarak belirli bir şeyle kayıtlamak için (mutlaklığını) çözdüğünü görürsen, bid'at işlemiştir."], [1220.0, "İnsanın, Şâriin kayıtladığı şeye yönelip sonra onun mutlaklığını —(yani) kaydını— mutlak olsun diye çözdüğünü görürsen, bid'at işlemiştir."], [1231.1, "İbadetin, mutlaklık ve kayıtlılık bakımından meşru kılındığı şekilde edâ edilmesi zorunludur."]]}, {"reader": false, "ar": [[1242.0, "وبناءً على ذلك: فلو أنّ الإنسان ضيّق زمنَ ذبح الأضاحي في اليوم الأول من أيام التشريق فهو مبتدع،"], [1254.3, "كما أنه لو فتح زمانَ الأضحية فتحًا زائدًا على أيام التشريق فقد ابتدع."], [1265.0, "وكمن يجوّز الاعتكاف في غير مسمّى المسجديّة،"], [1274.0, "فيجوّز للإنسان أن يعتكف في بيته إن كان مريضًا،"], [1280.0, "أو في مكتب عمله إن كان موظّفًا مشغولًا،"], [1284.0, "أو يجوّز للمرأة أن تعتكف في مصلّى بيتها من باب المحافظة عليها ألّا تخرج؛"], [1293.0, "فكلّ ذلك من البدع؛"], [1295.9, "لأنها إطلاقٌ لما قيّده الشارع،"], [1300.0, "فالاعتكاف عبادةٌ مقيّدةٌ في مسمّى المسجديّة فقط."]], "tr": [[1242.0, "Buna göre insan kurban kesme zamanını teşrîk günlerinin ilk gününe daraltsa bid'atçidir;"], [1242.0, "aynı şekilde kurban zamanını teşrîk günlerini aşacak şekilde genişletse bid'at işlemiş olur."], [1254.3, "İtikâfı mescid adı verilen (yer) dışında caiz görenler de böyledir:"], [1265.0, "İnsanın hastaysa evinde, meşgul bir memursa iş yerindeki ofisinde itikâfa girmesini ya da kadının dışarı çıkmasın diye korunması maksadıyla evinin namaz kılınan yerinde itikâfa girmesini caiz görürler."], [1284.0, "Bunların hepsi bid'attir; çünkü Şâriin kayıtladığını mutlak bırakmaktır."], [1295.9, "İtikâf, sadece mescid adı verilen (yer) ile kayıtlı bir ibadettir."]]}, {"reader": false, "ar": [[1307.0, "وكتجويز الطواف بغير الكعبة؛"], [1312.0, "فإنّ العلماء متّفقون على أنه لا يُطاف بشيءٍ من أجزاء الأرض إلا البيت الحرام فقط،"], [1322.9, "فمن وسّع الدائرة وأجاز الطواف بغير ذلك فقد ابتدع؛"], [1330.1, "لأنه أطلق ما قيّده الشارع."], [1334.8, "ومن اعتقد مشروعيةَ السعي الشديد في كلّ أجزاء المسعى فإنه أيضًا مبتدع؛"], [1345.5, "لأنه أطلق ما قيّده الشارع،"], [1348.9, "فإنما السنّة هي السعي الشديد بين العلمين الأخضرين فقط."]], "tr": [[1307.0, "Kâbe'den başka bir şeyin tavaf edilmesini caiz görmek de böyledir."], [1312.0, "Âlimler, yeryüzünün parçalarından sadece Beytü'l-Harâm'ın tavaf edileceği konusunda ittifak etmişlerdir."], [1322.9, "Kim bu daireyi genişletip başkasının tavafını caiz görürse bid'at işlemiş olur;"], [1330.1, "çünkü Şâriin kayıtladığını mutlak bırakmıştır."], [1334.8, "Kim mes'ânın her yerinde koşarak sa'y etmenin meşru olduğuna inanırsa o da bid'atçidir;"], [1345.5, "çünkü Şâriin kayıtladığını mutlak bırakmıştır."], [1348.9, "Sünnet, sadece iki yeşil işaret arasında koşarak sa'y etmektir."]]}, {"reader": false, "ar": [[1358.6, "وكمن اعتقد مشروعيةَ الرَّمَل في غير الطواف الأول؛"], [1369.0, "فإنّ الرمل سنّةٌ في الطواف الأول فقط،"], [1375.0, "وأمّا بقيّة الأطوفة في النسك الواحد فإنّ السنّة فيها أن يمشي مشيًا،"], [1385.7, "لا أن يرمل رملًا."], [1390.0, "وكمن اعتقد فضيلةَ الرمل في الأشواط السبعة كلّها من الطواف الأول،"], [1398.0, "فإنه مبتدعٌ بهذا الإطلاق؛"], [1400.6, "فإنّ السنّة في الطواف الأول إنما هو الرملُ في ثلاثة أشواطٍ منه فقط."]], "tr": [[1358.6, "İlk tavaf dışında da remelin meşru olduğuna inanan da böyledir."], [1369.0, "Remel sadece ilk tavafta sünnettir;"], [1375.0, "aynı nüsükteki diğer tavaflarda ise sünnet, remel yapması değil, (normal) yürüyüşle yürümesidir."], [1390.0, "İlk tavafın yedi şavtının hepsinde remelin faziletine inanan da bu mutlak bırakmasıyla bid'atçidir;"], [1400.6, "çünkü ilk tavaftaki sünnet, sadece onun üç şavtında remel yapmaktır."]]}, {"reader": false, "ar": [[1413.0, "وكمن اعتقد جوازَ ذبح الهدي أو الأضحية من غير بهيمة الأنعام؛"], [1431.0, "فالأدلّة إنما دلّت على تقييد هذا التعبُّد بهذا المذبوح المعيّن،"], [1440.0, "فمن قال بجواز ذبح الدجاج أو الأرانب في الأضاحي فهو مبتدع؛"], [1449.5, "لأنه أطلق ما قيّده الشرع."], [1455.0, "وكمن تعبّد بزيادة غسلةٍ رابعةٍ في الوضوء،"], [1463.0, "فإنه حينئذٍ زائدٌ على ما قرّره الشارع."]], "tr": [[1413.0, "Hedy veya kurbanı behîmetü'l-en'âm (deve, sığır, koyun-keçi) dışındaki hayvanlardan kesmenin caiz olduğuna inanan da böyledir."], [1431.0, "Deliller bu taabbudun ancak bu belirli kesilen (hayvan) ile kayıtlı olduğunu göstermiştir."], [1440.0, "Kim kurbanlarda tavuk veya tavşan kesmenin caiz olduğunu söylerse bid'atçidir;"], [1449.5, "çünkü şeriatin kayıtladığını mutlak bırakmıştır."], [1455.0, "Abdestte dördüncü bir yıkamayı ilave ederek taabbud eden de böyledir;"], [1463.0, "o takdirde Şâriin belirlediğine ilave yapmış olur."]]}, {"reader": false, "ar": [[1468.0, "أو اعتقد فضيلةَ الزيادة على الرمي سبعًا،"], [1474.0, "أو الطواف سبعًا، أو السعي سبعًا،"], [1482.0, "أو غيرها من التعبُّدات العدديّة،"], [1485.0, "فإنّ ذلك إطلاقٌ لما قيّده الشارع."], [1489.0, "فمتى ما رأيتَ الإنسان يُطلق من التعبُّدات ما هو مقيّدٌ شرعًا،"], [1495.0, "أو يقيّد من التعبُّدات ما هو مطلقٌ شرعًا،"], [1502.0, "فاعلم أنه قد افتتح بابًا من أبواب البدعة والابتداع،"], [1506.7, "والله أعلم. أدري كلامي واضح؟"]], "tr": [[1468.0, "Ya da cemrelerde yedi taşı, tavafta yedi şavtı, sa'yde yedi şavtı ya da diğer sayılı taabbudlarda (belirlenen sayıyı) aşmanın faziletine inanırsa;"], [1485.0, "bu, Şâriin kayıtladığını mutlak bırakmaktır."], [1489.0, "İnsanın, taabbudlardan şer'an kayıtlı olanı mutlak bıraktığını ya da taabbudlardan şer'an mutlak olanı kayıtladığını ne zaman görürsen, bid'at ve ibtidâ' kapılarından birini açtığını bil."], [1502.0, "Allah en iyisini bilir. Acaba sözüm açık mı?"]]}]}, {"ts": "25:10", "title": "9. Külliye: Salt re'ye ve hevâya dayanan her taabbud bid'attir", "paras": [{"reader": false, "ar": [[1510.0, "الكلّيّة التاسعة: <b>كلُّ تعبُّدٍ يستند إلى الرأي المجرّد والهوى فبدعة.<\/b> <span class=\"note\">(يكررها)<\/span> وذلك لأنّ المتقرّر في القواعد أنّ الأصل في التعبُّدات بكلّ متعلَّقاتها التوقيف،"], [1548.0, "والمتقرّر في القواعد أنّ الأحكام الشرعية ـ تكليفيّةً أو وضعيّةً ـ تفتقر في ثبوتها للأدلّة الصحيحة الصريحة."], [1563.0, "فكلُّ تعبُّدٍ يدعوك إليه أحدٌ وليس ثَمّة مستندٌ له من دليلٍ معتبرٍ عند أهل السنّة،"], [1579.0, "فاعلم أنه يدعوك إلى بدعة."]], "tr": [[1510.0, "<b>9. külliye: Salt re'ye ve hevâya dayanan her taabbud bid'attir.<\/b> (Tekrar ediyor.) Bu şundandır:"], [1510.0, "Kaidelerde yerleşik olan şudur: Bütün taallukları ile taabbudlarda asıl tevkîftir."], [1510.0, "Kaidelerde yerleşik olan (bir diğer husus) şudur:"], [1548.0, "Şer'î hükümler —teklîfî olsun vaz'î olsun— sübutlarında sahih ve sarih delillere muhtaçtır."], [1548.0, "Birinin seni çağırdığı ve Ehl-i Sünnet katında muteber bir delilden dayanağı olmayan her taabbudda, bil ki seni bir bid'ate çağırmaktadır."]]}, {"reader": false, "ar": [[1581.0, "وقد تخبّط كثيرٌ من الطوائف الضالّة في تعبُّداتها بسبب ابتناء تعبُّداتها على الأهواء والآراء المجرّدة؛"], [1595.0, "كاعتماد الصوفية في إثبات التعبُّدات على الكشف وخوارق العادات التي يزعمونها في أوليائهم وأبدالهم وأقطابهم،"], [1610.0, "وكضلالهم في إثبات كثيرٍ من التعبُّدات المبنيّة على الأحلام والرؤى،"], [1622.0, "وكضلال كثيرٍ من أهل البدع في بناء عباداتهم على مجرّد العقل،"], [1632.0, "أو الاستحسان، أو الأمزجة،"], [1634.8, "أو الذوق، أو ميل النفوس لهذا الشيء."]], "tr": [[1581.0, "Sapık fırkaların birçoğu, taabbudlarını hevâlara ve salt re'ylere bina etmeleri sebebiyle taabbudlarında şaşkınlık içinde kalmıştır."], [1595.0, "Sûfîlerin taabbudları isbatta keşfe ve velîleri, abdâlları ve kutupları hakkında iddia ettikleri harikulade hâllere dayanmaları gibi."], [1610.0, "Rüyalara ve düşlere dayanan birçok taabbudu isbat etmedeki sapmaları gibi."], [1622.0, "Bid'at ehlinden birçoğunun ibadetlerini salt akla, istihsâna, mizaçlara, zevke ya da nefislerin bir şeye meyline bina etmedeki sapmaları gibi."]]}, {"reader": false, "ar": [[1647.0, "فتجده متى ما قدح في ذهنه شيءٌ من ذلك فإنه يصيّره عبادةً يتعبّد اللهَ عز وجل بها."], [1658.0, "وكالتعبُّد لله عز وجل بجعل السُّلوم والعادات والتقاليد والأعراف القبليّة في مصافّ العبادات التي يأمرون بها وينكرون على من خالفها."], [1681.0, "وكما تسمعون من كثيرٍ من الصوفية التعبُّدَ لله عز وجل بذكر الاسم مفردًا،"], [1689.0, "فيقولون: الله، الله، أو التعبُّد لله بذكر الضمير فقط، كقولهم: هو، هو."]], "tr": [[1647.0, "Onu, zihnine bunlardan bir şey geldiğinde onu Allah Azze ve Celle'ye kulluk ettiği bir ibadet hâline getirir bulursun."], [1647.0, "Kabile gelenekleri (sulûm), âdetler, gelenekler ve kabile örflerini emrettikleri ve muhalefet edeni ayıpladıkları ibadetler sırasına koyarak Allah Azze ve Celle'ye taabbud etmek de böyledir."], [1658.0, "Sûfîlerden birçoğundan işittiğiniz gibi, Allah Azze ve Celle'ye tek başına ism-i celâli zikrederek \"Allah, Allah\" demeleri ya da sadece zamiri zikrederek, \"Hû, Hû\" demeleri gibi taabbud etmeleri de böyledir."]]}, {"reader": false, "ar": [[1707.0, "فكلُّ ذلك من الاستحسانات الباردة التي مردُّها الأهواء،"], [1716.0, "غيرُ مستندةٍ في ثبوتها إلى شيءٍ من دليل الشرع."], [1722.0, "فمتى ما رأيتَ التعبُّد مستندًا إلى رأيٍ مجرّدٍ أو هوى فاعلم أنه من البدع."], [1734.0, "ولذلك فإنّ أهل السنّة يصفون أهل البدع بأهل الأهواء؛"], [1745.0, "لأنهم إنما يتّبعون في تعبُّداتهم أهواءَهم."]], "tr": [[1707.0, "Bunların hepsi, dönüp dolaşıp hevâlara varan, sübutunda şeriatin delilinden hiçbir şeye dayanmayan soğuk istihsânlardır."], [1716.0, "Taabbudun salt bir re'ye veya hevâya dayandığını ne zaman görürsen, bil ki o bid'atlerdendir."], [1722.0, "Bu yüzden Ehl-i Sünnet, bid'at ehlini \"hevâ ehli\" diye niteler;"], [1734.0, "çünkü onlar taabbudlarında ancak hevâlarına uyarlar."]]}, {"reader": false, "ar": [[1751.0, "وقد قال الله عز وجل:"], [1754.5, "<span class=\"ayah\">﴿أَفَرَأَيْتَ مَنِ اتَّخَذَ إِلَٰهَهُ هَوَاهُ﴾<\/span> <span class=\"ref\">[الجاثية: ٢٣]<\/span>،"], [1759.0, "وقال الله عز وجل:"], [1761.8, "<span class=\"ayah\">﴿يَا دَاوُودُ إِنَّا جَعَلْنَاكَ خَلِيفَةً فِي الْأَرْضِ فَاحْكُم بَيْنَ النَّاسِ بِالْحَقِّ وَلَا تَتَّبِعِ الْهَوَىٰ فَيُضِلَّكَ عَن سَبِيلِ اللَّهِ﴾<\/span> <span class=\"ref\">[ص: ٢٦]<\/span>."], [1775.0, "فمن لم يتّبع الحقَّ فإنه لا بدّ لِزامًا أن يكون واقعًا في الهوى، والله أعلم."]], "tr": [[1751.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1754.5, "<span class=\"ayah\">﴿Hevâsını ilâh edineni gördün mü?﴾<\/span> [Câsiye 23]."], [1754.5, "Allah Azze ve Celle şöyle buyurmuştur:"], [1761.8, "<span class=\"ayah\">﴿Ey Dâvûd! Biz seni yeryüzünde halife yaptık. O hâlde insanlar arasında hak ile hükmet; hevâya uyma, yoksa seni Allah'ın yolundan saptırır﴾<\/span> [Sâd 26]."], [1761.8, "Hakka uymayan kimse, zorunlu olarak mutlaka hevâya düşmüş olur. Allah en iyisini bilir."]]}]}, {"ts": "29:46", "title": "10. Külliye: Muhammed ﷺ'in ashâbının bilmediği her taabbud bid'attir", "paras": [{"reader": false, "ar": [[1786.0, "الكلّيّة الأخيرة في هذا الدرس:"], [1790.0, "<b>كلُّ تعبُّدٍ لا يعرفه أصحابُ محمدٍ صلى الله عليه وسلم فبدعة.<\/b> وذلك لأنه لا يمكن أن يكون من الدين ما ليس من الدين في عهد النبيّ صلى الله عليه وسلم وصحابته الكرام."], [1811.0, "ففيصلُ معرفة البدعة من السنّة في المحدثات إنما هو ما عليه أصحابُ محمدٍ صلى الله عليه وسلم."]], "tr": [[1786.0, "Bu dersteki son külliye: 10."], [1786.0, "külliye: Muhammed ﷺ'in ashâbının bilmediği her taabbud bid'attir. Bu şundandır:"], [1790.0, "Nebî ﷺ ve kerîm sahâbîleri döneminde dinden olmayan bir şeyin dinden olması mümkün değildir."], [1790.0, "Muhdes şeylerde bid'ati sünnetten ayırt etmenin ölçüsü, ancak Muhammed ﷺ'in ashâbının üzerinde bulunduğu şeydir."]]}, {"reader": false, "ar": [[1822.0, "فإن كان من جملة التعبُّدات التي تعبّدوها فهي عبادةٌ مقبولة،"], [1829.0, "وإن كان من جملة التعبُّدات التي لا تثبت عن أحدٍ منهم فإنها من البدع المحدثة."], [1839.0, "وذلك كصلاة الرغائب، فإنّ أصحاب محمدٍ صلى الله عليه وسلم لا يعرفونها."], [1847.0, "وكصلاة القضاء العُمْريّ، فإنّ أصحاب محمدٍ صلى الله عليه وسلم لا يعرفونها؛"], [1859.0, "وهي جمعُ صلوات يومٍ واحدٍ بعد صلاة الجمعة في آخر جمعةٍ من رمضان،"], [1872.0, "معتقدين بأنّ جميع ما فوّته أو أهمله من الصلوات في هذا العام يقع مكفَّرًا."]], "tr": [[1822.0, "Eğer onların kulluk ettikleri taabbudlar cümlesindense, kabul edilmiş bir ibadettir;"], [1829.0, "onlardan hiçbirinden sabit olmayan taabbudlar cümlesindense, muhdes bid'atlerdendir."], [1839.0, "Regâib namazı gibi; Muhammed ﷺ'in ashâbı onu bilmezler."], [1839.0, "\"Kazâ-i ömrî\" namazı gibi; Muhammed ﷺ'in ashâbı onu bilmezler."], [1847.0, "Bu, Ramazan'ın son cumasında cuma namazından sonra bir günün namazlarını toplu olarak kılmaktır;"], [1859.0, "(kişinin) o yıl kaçırdığı veya ihmal ettiği bütün namazların (bununla) keffâretlenmiş olacağına inanırlar."]]}, {"reader": false, "ar": [[1882.4, "فيصلّون الجمعة في آخر جمعةٍ من رمضان،"], [1890.0, "ثم يقومون فيصلّون الفجر،"], [1893.0, "ثم يصلّون الظهر، ثم يصلّون العصر ـ أعوذ بالله من البدع ـ ثم يصلّون المغرب والعشاء،"], [1903.0, "ويسمّونها بصلاة القضاء العُمْريّ؛"], [1908.0, "فجميع ما فوّته الإنسان أو أهمله من صلواته أو فرّط فيه فيقع مكفَّرًا بهذا الفعل."], [1919.0, "فذلك تعبُّدٌ ليس عليه أصحابُ محمدٍ صلى الله عليه وسلم، فيكون بدعة."]], "tr": [[1882.4, "Ramazan'ın son cumasında cumayı kılarlar, sonra kalkıp sabah namazını kılarlar, sonra öğleyi kılarlar, sonra ikindiyi kılarlar —bid'atlerden Allah'a sığınırım— sonra akşam ve yatsıyı kılarlar ve buna \"kazâ-i ömrî namazı\" adını verirler."], [1903.0, "(Onlara göre) insanın kaçırdığı, ihmal ettiği veya gevşek davrandığı bütün namazları bu fiille keffâretlenmiş olur."], [1919.0, "Bu, Muhammed ﷺ'in ashâbının üzerinde olmadığı bir taabbuddur; dolayısıyla bid'attir."]]}, {"reader": false, "ar": [[1930.0, "وكقراءة الفاتحة عند افتتاح الخطوبة،"], [1934.0, "أو قراءة الفاتحة عند سماع اسم أحدٍ من الأموات؛"], [1940.0, "فإنّ الزيجاتِ وأسماءَ الأموات كانت في عهدهم،"], [1948.0, "ولم يُعرف عن أحدٍ منهم رضي الله عنهم أنه كان يخصّ شيئًا من ذلك بقراءة الفاتحة."], [1957.0, "وكالاحتفال بمولد النبيّ صلى الله عليه وسلم،"], [1967.0, "فإنه تعبُّدٌ ليس عليه أصحابُ محمدٍ صلى الله عليه وسلم."], [1974.0, "وكالاحتفال بليلة الإسراء والمعراج،"], [1981.0, "وكالأذكار الجماعية أو غيرها."]], "tr": [[1930.0, "Nişanın açılışında Fâtiha okumak ya da ölülerden birinin adını duyunca Fâtiha okumak da böyledir."], [1934.0, "Evlilikler de ölülerin adları da onların döneminde vardı;"], [1940.0, "fakat onlardan —Allah onlardan razı olsun— hiçbirinin bunlardan herhangi birini Fâtiha okumaya tahsis ettiği bilinmemektedir."], [1957.0, "Nebî ﷺ'in mevlidini kutlamak da böyledir;"], [1967.0, "bu, Muhammed ﷺ'in ashâbının üzerinde olmadığı bir taabbuddur."], [1974.0, "İsrâ ve Mi'râc gecesini kutlamak, toplu zikirler ve benzerleri de böyledir."]]}, {"reader": false, "ar": [[1985.0, "فكلُّ من أحدث عبادةً فإننا نسأله:"], [1989.0, "هل كان عليها أصحابُ محمدٍ صلى الله عليه وسلم أم لا؟"], [1994.0, "فإن كانوا عليها فمشروعة،"], [1998.0, "وإن لم يكونوا عليها فممنوعة."], [2003.0, "ولله درُّ حذيفة رضي الله عنه لمّا قال:"], [2008.0, "«كلُّ عبادةٍ لم يتعبّد بها أصحابُ محمدٍ صلى الله عليه وسلم فلا تعبّدوها؛ فإنّ الأول لم يدَعْ للآخِر مقالًا، فاتّقوا الله يا معشر القُرّاء، خذوا طريقَ من كان قبلكم»."]], "tr": [[1985.0, "İbadet icat eden herkese şunu sorarız:"], [1985.0, "Muhammed ﷺ'in ashâbı bunun üzerinde miydi, değil miydi?"], [1989.0, "Eğer onun üzerindeyseler meşrudur; onun üzerinde değillerse yasaktır."], [1998.0, "Huzeyfe'ye —Allah ondan razı olsun— ne güzel söylemiş:"], [2008.0, "\"Muhammed ﷺ'in ashâbının kulluk etmediği hiçbir ibadetle kulluk etmeyin."], [2008.0, "Çünkü ilk (gelen), sonrakine söyleyecek söz bırakmamıştır."], [2008.0, "Ey kurrâ topluluğu, Allah'tan korkun; sizden öncekilerin yolunu tutun.\""]]}, {"reader": false, "ar": [[2032.0, "وقال مالك بن أنس رحمه الله تعالى:"], [2037.0, "«لن يصلح آخرَ هذه الأمة إلا ما أصلح أوّلَها»."], [2044.0, "وقال سعيد بن جبير رحمه الله تعالى:"], [2047.8, "«ما لم يعرفه البدريّون» ـ ويقصد بذلك الصحابة ـ «ما لم يعرفه البدريّون فليس من الدين»."], [2058.0, "ولعلّنا نكتفي بهذا القدر،"], [2059.6, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[2032.0, "Mâlik b. Enes —Allah ona rahmet etsin— şöyle demiştir:"], [2037.0, "\"Bu ümmetin sonunu, ancak evvelini ıslah eden şey ıslah eder.\" Saîd b."], [2044.0, "Cübeyr —Allah ona rahmet etsin— şöyle demiştir:"], [2047.8, "\"Bedir ehlinin bilmediği şey\" —bununla sahâbeyi kastediyor— \"Bedir ehlinin bilmediği şey dinden değildir.\" Bu kadarla yetinelim."], [2058.0, "Allah en yüce olan ve en iyi bilendir."], [2059.6, "Allah, Nebîmiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){

    if(ka>=0){AR[ka].r.classList.add("on");
