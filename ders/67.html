<script>
const D={"no": 67, "vid": "xi3vEA1tmGY", "title_ar": "الدرس (٦٧) من شرح كليات العقيدة — كليات في باب الصفات: بطلان نسبة التأويل إلى السلف، والقول في الذات والصفات، والصفات الذاتية والفعلية", "title_tr": "Şerhu Külliyyâti'l-Akîde — 67. Ders: Sıfatlar Babının Külliyeleri (Selefe Nispet Edilen Te'villerin Yalan Oluşu, Sıfatlar Hakkındaki Sözün Zât Hakkındaki Söz Gibi Oluşu, Bütün Sıfatlarda Sözün Bir Oluşu, Tahrif Edene Kaçtığı Mahzurun Benzerinin Lâzım Gelmesi, İsbatta Tafsil–Nefyde İcmal, Zâtî ve Fiilî Sıfatlar)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Selefin birinden sıfat naslarının bir kısmını te'vil ettiğine dair nakledilen her şey, ona karşı yalandır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.7, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.2, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.3, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [8.8, "أما بعد: فلا نزال ـ ولله الحمدُ والمنّة ـ في سياق الكلّيّات المتعلّقة بباب الصفات عند أهل السنة والجماعة،"], [15.9, "وعندنا في هذا اليوم جُمَلٌ من الكلّيّات."], [18.9, "الكلّيّة الأولى: <b>كلُّ منقولٍ عن أحدٍ من السلف من تأويل بعض نصوص الصفات فكذبٌ عليه.<\/b> أظنّ أمليتُها عليكم."], [34.5, "<span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [47.0, "<b>كلُّ منقولٍ عن أحدٍ من السلف من تأويل بعض نصوص الصفات فكذبٌ عليه.<\/b>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.3, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [8.8, "Bundan sonra: Hamd ve minnet Allah'a, hâlâ Ehl-i Sünnet ve'l-Cemaat nezdinde sıfatlar babıyla ilgili külliyeler bağlamındayız."], [16.3, "Bugün elimizde birtakım külliyeler var."], [18.9, "<b>1. külliye: Selefin birinden, sıfat naslarının bir kısmını te'vil ettiğine dair nakledilen her şey, ona karşı (söylenmiş) bir yalandır.<\/b> Zannederim bunu size yazdırmıştım."], [34.5, "(Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [47.0, "<b>1. külliye: Selefin birinden, sıfat naslarının bir kısmını te'vil ettiğine dair nakledilen her şey, ona karşı bir yalandır.<\/b>"]]}, {"reader": false, "ar": [[52.0, "أقول وبالله التوفيق: ولا يزال أهلُ التعطيل لا يجدون دليلًا على ما ذهبوا إليه من تحريف صفات الله عز وجل؛"], [60.0, "فلا يُسعفهم في مذهبهم الفاسد لا كتابُ الله عز وجل ولا سنّةُ رسوله صلى الله عليه وسلم."], [67.0, "فأرادوا أن يتمسّحوا ببعض المنقولات عن بعض الصحابة،"], [71.3, "أو عن بعض كبار أهل السنة والجماعة:"], [75.0, "من أنّ فلانًا الصحابيَّ قال في صفة كذا:"], [78.8, "كذا وكذا، وأنّ فلانًا العالمَ قال في صفة كذا:"], [83.1, "كذا وكذا. فتأتيك هذه الكلّيّة لتقطع عليهم شريانَهم الثالث:"], [89.0, "بأنه لا يُسعفكم في تصحيح مذهبكم الفاسد في تحريف صفات الله عز وجل لا كتابُ الله عز وجل،"], [97.1, "ولا سنّةُ رسوله صلى الله عليه وسلم،"], [100.0, "ولا شيءٌ من المنقولات عن سلف الأمة وأئمّتها،"], [106.0, "لا الصحابة ولا من دونهم ممّن هو عالمٌ من علماء أهل السنة والجماعة."]], "tr": [[52.0, "Tevfik Allah'tandır, derim ki: Ta'til ehli, Allah Azze ve Celle'nin sıfatlarını tahrif etme hususunda gittikleri yola hâlâ bir delil bulamamaktadır."], [60.0, "Fâsid mezheplerinde onlara ne Allah Azze ve Celle'nin Kitabı yardım eder ne de Resûlü sallallâhu aleyhi ve sellem'in sünneti."], [67.0, "Bu yüzden sahabenin bazılarından veya Ehl-i Sünnet ve'l-Cemaat'in bazı büyüklerinden nakledilen bazı şeylere tutunmak istediler:"], [75.0, "Falanca sahabînin falanca sıfat hakkında şöyle şöyle dediği, falanca âlimin falanca sıfat hakkında şöyle şöyle dediği gibi."], [83.1, "İşte bu külliye, onların üçüncü şah damarını kesmek için gelir:"], [89.0, "Allah Azze ve Celle'nin sıfatlarını tahrif hususundaki fâsid mezhebinizi doğrulamada size ne Allah Azze ve Celle'nin Kitabı yardım eder, ne Resûlü sallallâhu aleyhi ve sellem'in sünneti, ne de ümmetin selefinden ve imamlarından nakledilen herhangi bir şey;"], [106.0, "ne sahabe ne de onlardan sonra gelen Ehl-i Sünnet ve'l-Cemaat âlimlerinden herhangi bir âlim."]]}, {"reader": false, "ar": [[116.0, "ولذلك لا نزال نقول بملء الفم:"], [119.2, "بأنّ أهل السنة والجماعة متّفقون الاتّفاقَ القطعيَّ على إمرار هذه النصوص على ظاهرها،"], [126.0, "فلا ينتقلون عنه إلى المؤوَّل إلا بقرينةٍ ودليل،"], [130.0, "ومُجمِعون أيضًا على أنّ الواجب في هذه النصوص هو البقاءُ على حقيقتها،"], [135.2, "فلا ينتقلون عنها إلى المجاز إلا بناقلٍ ودليل."], [139.0, "ولكنّهم لا يزالون ينسبون في كتبهم إلى بعض أهل العلم شيئًا من التأويل."], [147.0, "فتأتي هذه الكلّيّة تقول:"], [149.1, "بأنّ كلَّ منقولٍ عن أحدٍ من أصحاب النبيّ صلى الله عليه وسلم أنه أوّل صفةَ كذا وكذا بكذا وكذا،"], [159.0, "أو عن أحدٍ من سلف الأمة وأئمّتها من الأئمّة المشهود لهم بالعلم والخيريّة أنه قال في صفة كذا:"], [168.7, "كذا وكذا، فإنّ هذا من الكذب الذي لا يصحّ عنه."]], "tr": [[116.0, "Bu sebeple ağzımızı doldurarak hâlâ şunu söyleriz:"], [119.2, "Ehl-i Sünnet ve'l-Cemaat, bu nasları zahirleri üzere geçirmekte kesin bir ittifakla ittifak etmiştir;"], [127.5, "bir karine ve delil olmadıkça zahirden müevvele geçmezler."], [132.4, "Yine bu naslarda vâcip olanın onların hakikati üzere kalmak olduğunda icmâ etmişlerdir;"], [139.0, "nakledici bir delil olmadıkça hakikatten mecaza geçmezler."], [141.5, "Fakat onlar (ta'til ehli) kitaplarında hâlâ bazı ilim ehline bir miktar te'vil nispet etmektedir."], [147.0, "İşte bu külliye gelip der ki:"], [149.1, "Peygamber sallallâhu aleyhi ve sellem'in ashâbından birinden, falanca sıfatı şöyle şöyle te'vil ettiğine dair nakledilen her şey;"], [158.6, "veya ümmetin selefinden ve imamlarından, ilim ve hayırlılıklarına şahitlik edilen imamlardan birinden, falanca sıfat hakkında şöyle şöyle dediğine dair nakledilen her şey, ondan sahih olmayan yalanlardandır."]]}, {"reader": false, "ar": [[172.0, "فمن ذلك ما ينقلونه عن ابن عبّاس رضي الله عنهما:"], [177.0, "من أنه أوّل قولَ الله عز وجل:"], [180.8, "<span class=\"ayah\">﴿وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span> أي:"], [183.5, "علمُه، فأوّل الكرسيَّ بأنه العلم."], [187.0, "وهذا لا يصحّ عن ابن عبّاس أبدًا،"], [190.5, "لا في صَدَرٍ ولا وِرْد."], [193.0, "فجميع الأسانيد التي تنقل عن ابن عبّاس رضي الله عنهما بأنه أوّل الكرسيَّ بالعلم فإنها أسانيدُ باطلةٌ لا تصحّ."], [203.0, "بل المنقول الصحيح عنه بالسند الصحيح هو أنه ذكر بأنّ الكرسيَّ موضعُ قدمَي الربّ عز وجل."], [212.0, "فقد جرى في بيانه للكرسيّ على ما جرى عليه أهل السنة والجماعة:"], [219.0, "بأنّ العرش موضعُ الاستواء،"], [221.3, "وأنّ الكرسيَّ موضعُ قدمَي الربّ،"], [224.1, "على ما يليق بجلاله وعظمته."]], "tr": [[172.0, "Bunlardan biri, İbn Abbâs'tan —Allah ikisinden de razı olsun— naklettikleri şeydir:"], [177.0, "Onun, Allah Azze ve Celle'nin <span class=\"ayah\">﴿O'nun kürsîsi gökleri ve yeri kuşatmıştır﴾<\/span> [Bakara 255] sözünü \"yani ilmi\" diye te'vil ettiği, kürsîyi ilim diye te'vil ettiği (iddiası)."], [187.0, "Bu, İbn Abbâs'tan asla sahih değildir;"], [190.0, "ne gidişte ne dönüşte (hiçbir şekilde)."], [193.0, "İbn Abbâs'tan —Allah ikisinden de razı olsun— kürsîyi ilimle te'vil ettiğini nakleden bütün isnadlar bâtıl, sahih olmayan isnadlardır."], [203.0, "Bilakis ondan sahih senedle nakledilen sahih rivayet, kürsînin Rabb Azze ve Celle'nin iki ayağının yeri olduğunu zikretmesidir."], [212.0, "O, kürsîyi açıklarken Ehl-i Sünnet ve'l-Cemaat'in gittiği yoldan gitmiştir:"], [219.0, "Arş istivânın yeridir, kürsî ise —celâline ve azametine yakışır şekilde— Rabb'in iki ayağının yeridir."]]}, {"reader": false, "ar": [[227.0, "ومن ذلك أيضًا ما يروونه عن الإمام مالك بن أنس،"], [232.4, "إمامِ دار الهجرة رحمه الله تعالى:"], [236.1, "بأنه أوّل صفةَ النزول إلى السماء الدنيا بنزول الأمر."], [244.0, "فينقلون عنه في قول الله ـ في قول النبيّ صلى الله عليه وسلم:"], [252.0, "«ينزل ربُّنا» أنّ ذلك من نزول أمره."], [258.0, "وهذا الأثر لا يثبت من طريقٍ صحيحٍ عن الإمام مالك رحمه الله تعالى،"], [266.0, "وقد جاء عن الإمام من طريقين باطلين لا يصحّان عنه أبدًا:"], [275.0, "ففي الطريق الأول كذّاب،"], [277.5, "وفي الطريق الثاني مجهول."], [280.0, "وقد أجمل شيخ الإسلام ابن تيمية رحمه الله تعالى هذا المنقولَ عن الإمام مالك بقوله:"], [288.0, "«هذا من رواية حبيبٍ كاتبِه، وهو كذّابٌ باتّفاقهم، وقد رُويت من وجهٍ آخر لكنّ الإسناد مجهول». انتهى كلامه."]], "tr": [[227.0, "Bunlardan biri de Dâru'l-Hicre'nin imamı İmam Mâlik b."], [231.3, "Enes'ten —Allah ona rahmet etsin— rivayet ettikleri şeydir:"], [236.1, "Onun, dünya semasına nüzul sıfatını emrin inmesi diye te'vil ettiği (iddiası)."], [244.0, "Allah'ın sözü hakkında —Peygamber sallallâhu aleyhi ve sellem'in \"Rabbimiz iner\" sözü hakkında— ondan, bunun O'nun emrinin inmesi olduğunu naklederler."], [258.0, "Bu eser İmam Mâlik'ten —Allah ona rahmet etsin— sahih bir yolla sabit değildir."], [266.7, "İmam'dan, ondan asla sahih olmayan iki bâtıl yolla gelmiştir:"], [275.0, "Birinci yolda bir yalancı, ikinci yolda ise meçhul biri vardır."], [280.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— İmam Mâlik'ten nakledilen bu şeyi şu sözüyle özetlemiştir:"], [288.0, "\"Bu, onun kâtibi Habîb'in rivayetindendir;"], [290.9, "o, ittifakla yalancıdır. Başka bir yoldan da rivayet edilmiştir, fakat isnadı meçhuldür.\" —Sözü burada bitti."]]}]}, {"ts": "05:03", "title": "1. Külliye (devam): İmam Ahmed'e ve İmam Buhârî'ye nispet edilen te'viller", "paras": [{"reader": false, "ar": [[303.0, "والذي يثبت بالسند الصحيح عن الإمام مالك رحمه الله تعالى هو أنه يقول في صفة نزول الله عز وجل كما يقوله سائرُ أئمّة أهل السنة والجماعة،"], [318.0, "وهو إثباتُ صفة النزول لله عز وجل إثباتًا من غير تحريفٍ ولا تكييف،"], [324.5, "ومن غير تمثيلٍ ولا تعطيل."]], "tr": [[303.0, "İmam Mâlik'ten —Allah ona rahmet etsin— sahih senedle sabit olan şudur:"], [309.0, "O, Allah Azze ve Celle'nin nüzul sıfatı hakkında, Ehl-i Sünnet ve'l-Cemaat'in bütün imamlarının söylediği gibi söyler;"], [318.0, "o da nüzul sıfatını Allah Azze ve Celle'ye tahrifsiz ve tekyîfsiz, temsilsiz ve ta'tilsiz bir isbatla isbat etmektir."]]}, {"reader": false, "ar": [[327.0, "ومن ذلك أيضًا ما ينقلونه عن الإمام أحمد بن حنبل رحمه الله تعالى:"], [337.0, "من أنه أوّل صفةَ مجيء الله عز وجل يوم القيامة بمجيء الثواب،"], [344.0, "في قول الله عز وجل:"], [347.1, "<span class=\"ayah\">﴿وَجَاءَ رَبُّكَ وَالْمَلَكُ صَفًّا صَفًّا﴾<\/span> <span class=\"ref\">[الفجر: ٢٢]<\/span>،"], [350.2, "أي: جاء ثوابُه. وهذا لا يصحّ ألبتّةَ عن الإمام أحمد رحمه الله تعالى؛"], [360.0, "وذلك لأنه ينقلها عنه رجلٌ يقال له:"], [365.1, "حنبل، ولهذا الرجل رواياتٌ شاذّةٌ عن الإمام أحمد،"], [375.0, "سواءٌ في بعض العقائد،"], [377.2, "أو في بعض الفقهيّات أو الأحكام العمليّة."], [381.0, "ولذلك لا يعتمد أهلُ السنة والجماعة،"], [385.0, "ولا الأئمّةُ الحنابلة رحمهم الله تعالى،"], [389.0, "على ما ينفرد به حنبلٌ عن الإمام أحمد رحمه الله تعالى،"], [395.0, "ولا ينسبونه للإمام أحمد أبدًا."]], "tr": [[327.0, "Bunlardan biri de İmam Ahmed b."], [331.1, "Hanbel'den —Allah ona rahmet etsin— naklettikleri şeydir:"], [337.0, "Onun, Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rabbin ve melekler saf saf geldiğinde﴾<\/span> [Fecr 22] sözünde, kıyamet günü Allah Azze ve Celle'nin gelmesi sıfatını sevabın gelmesi diye, yani \"O'nun sevabı geldi\" diye te'vil ettiği (iddiası)."], [350.8, "Bu, İmam Ahmed'den —Allah ona rahmet etsin— asla sahih değildir."], [360.0, "Çünkü bunu ondan Hanbel denilen bir adam nakletmektedir."], [365.1, "Bu adamın İmam Ahmed'den, gerek bazı akîde meselelerinde gerekse bazı fıkhî meselelerde veya amelî hükümlerde şâz rivayetleri vardır."], [381.0, "Bu sebeple Ehl-i Sünnet ve'l-Cemaat de, Hanbelî imamlar —Allah onlara rahmet etsin— da Hanbel'in İmam Ahmed'den —Allah ona rahmet etsin— tek başına rivayet ettiği şeylere itimat etmez ve onu asla İmam Ahmed'e nispet etmezler."]]}, {"reader": false, "ar": [[398.0, "وعلى ذلك تواترت نُقولُ أهل العلم في إثبات ذلك."], [404.0, "فهذا ابن تيمية رحمه الله يقول:"], [407.0, "«قيل: إنّ هذا غلطٌ من حنبل، انفرد به دون الذين ذكروا عنه المناظرة، مثل صالحٍ وعبد الله والمرُّوذي وغيرهم» ـ مثل صالحٍ وعبد الله والمرُّوذي وغيرهم ـ «فإنهم لم يذكروا هذا. وحنبلٌ ينفرد برواياتٍ يُغلِّطه فيها طائفةٌ كالخلّال وصاحبه. قال أبو إسحاق ابن شاقلا <span class=\"q\">؟ 07:15<\/span> رحمه الله: هذا غلطٌ من حنبل لا شكّ فيه». انتهى كلامه."]], "tr": [[398.0, "İlim ehlinin nakilleri bunu isbat hususunda tevâtür derecesine ulaşmıştır."], [400.7, "İşte İbn Teymiyye —Allah ona rahmet etsin— şöyle diyor:"], [404.0, "\"Bunun Hanbel'in bir hatası olduğu söylenmiştir."], [404.6, "Onu, ondan (Ahmed'den) münazarayı zikreden Sâlih, Abdullah, el-Merrûzî ve başkaları gibi kimseler değil, (yalnız) o tek başına rivayet etmiştir\" —Sâlih, Abdullah, el-Merrûzî ve başkaları gibi— \"Çünkü onlar bunu zikretmemişlerdir."], [406.5, "Hanbel birtakım rivayetlerde tek kalır;"], [407.0, "Hallâl ve arkadaşı gibi bir topluluk onu bunlarda hatalı bulur."], [418.0, "Ebû İshâk İbn Şâkılâ <span class=\"q\">؟<\/span> —Allah ona rahmet etsin— şöyle demiştir:"], [435.4, "Bu, şüphesiz Hanbel'in bir hatasıdır.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[444.0, "ويقول الإمام الذهبيّ رحمه الله مؤكِّدًا:"], [447.0, "«وَهِمَ حنبلٌ في هذه الرواية»."], [452.0, "قال: «له مسائلُ كثيرةٌ عن أحمد، ويتفرّد ويُغرِب»."], [457.0, "انتهى كلامه. ويقول الإمام ابن القيّم رحمه الله تعالى:"], [462.0, "«فإنّ حنبلًا تفرّد به عنه، وهو كثيرُ المفاريد المخالفة للمشهور من مذهبه»."], [469.0, "أنت معي ولّا لا؟"], [472.0, "قال ابن القيّم رحمه الله:"], [474.0, "«فإنّ حنبلًا تفرّد به عنه، وهو كثيرُ المفاريد المخالفة للمشهور من مذهبه»."], [483.0, "انتهى كلامُهم رحمهم الله تعالى."]], "tr": [[444.0, "İmam Zehebî —Allah ona rahmet etsin— de te'kid ederek şöyle diyor:"], [447.0, "\"Hanbel bu rivayette vehme düşmüştür.\" (Yine) dedi ki:"], [452.0, "\"Onun Ahmed'den pek çok meselesi vardır;"], [453.9, "(bazılarında) tek kalır ve garip rivayetler getirir.\" —Sözü burada bitti."], [457.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— de şöyle diyor:"], [462.0, "\"Çünkü onu ondan Hanbel tek başına rivayet etmiştir;"], [464.9, "o ise mezhebinin meşhur olanına aykırı pek çok tek rivayet (mefârîd) sahibidir.\" Benimle misin, değil misin?"], [472.0, "İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle dedi:"], [474.0, "\"Çünkü onu ondan Hanbel tek başına rivayet etmiştir;"], [477.4, "o ise mezhebinin meşhur olanına aykırı pek çok tek rivayet sahibidir.\" —Sözleri burada bitti, Allah onlara rahmet etsin."]]}, {"reader": false, "ar": [[487.0, "ومن ذلك أيضًا ما ينقلونه عن الإمام البخاريّ رحمه الله تعالى:"], [493.1, "من أنه أوّل صفةَ الضحك بالرحمة،"], [501.0, "في قول الله عز وجل ـ في قول النبيّ صلى الله عليه وسلم:"], [507.5, "«يضحك الله إلى رجلين يقتل أحدُهما الآخرَ، كلاهما يدخل الجنة»."], [513.0, "فينقلون عن الإمام البخاريّ رحمه الله تعالى بأنه قال:"], [519.1, "بأنّ المراد بالضحك الرحمة،"], [522.0, "وهم فرِحون الفرحَ الكبير في وجود مثل هذه الكلمة في بعض نُسَخ «الصحيح»."], [529.0, "ولكنها غلطٌ على الإمام البخاريّ رحمه الله تعالى؛"], [535.0, "فإنّ هذا الأثر ضعيفٌ منقطع."]], "tr": [[487.0, "Bunlardan biri de İmam Buhârî'den —Allah ona rahmet etsin— naklettikleri şeydir:"], [493.1, "Onun, Allah Azze ve Celle'nin sözünde —Peygamber sallallâhu aleyhi ve sellem'in \"Allah, biri diğerini öldüren, ikisi de cennete giren iki adama güler\" sözünde— gülme sıfatını rahmetle te'vil ettiği (iddiası)."], [513.0, "İmam Buhârî'den —Allah ona rahmet etsin— \"gülmeden maksat rahmettir\" dediğini naklederler ve \"Sahîh\"in bazı nüshalarında böyle bir kelimenin bulunmasına çok büyük bir sevinçle sevinirler."], [529.0, "Fakat bu, İmam Buhârî'ye —Allah ona rahmet etsin— karşı yapılmış bir hatadır."], [535.0, "Çünkü bu eser zayıf ve munkatı'dır."]]}, {"reader": false, "ar": [[539.0, "فإنّ البيهقيّ رحمه الله تعالى نقله عن الفِرَبْريّ ـ انتبهوا للنطق ـ الإمام البيهقيّ رحمه الله تعالى نقله عن الفِرَبْريّ،"], [551.0, "وهو من جملة رواة «صحيح البخاري»."], [554.0, "ولكنّ جميع النُّسَخ المنقولة بالإسناد عن الإمام البخاريّ كلُّها لم تُذكَر فيها هذه اللفظة:"], [566.6, "بأنّ المراد بالضحك الرحمة."], [569.0, "ولذلك مع كثرة نُسَخ «صحيح» الإمام البخاريّ فإنه لا يُعرَف هذا القول عن البخاريّ في نسخةٍ منها أبدًا."], [579.0, "ولذلك قال الإمام الحافظ ابن حجر،"], [583.0, "العارفُ بالبخاريّ و«صحيحه» ونُسَخه،"], [588.0, "قال: «لم أرَ ذلك في النُّسَخ التي وقعت لنا من البخاريّ»."], [594.0, "فإذن هي خطأٌ من الفِرَبْريّ نفسِه."]], "tr": [[539.0, "Çünkü Beyhakî —Allah ona rahmet etsin— onu el-Firebrî'den nakletmiştir —telaffuza dikkat edin—;"], [547.9, "İmam Beyhakî —Allah ona rahmet etsin— onu el-Firebrî'den nakletmiştir;"], [554.0, "o da \"Sahîhu'l-Buhârî\"nin râvilerindendir. Fakat İmam Buhârî'den isnadla nakledilen nüshaların hepsinde \"gülmeden maksat rahmettir\" lafzı zikredilmemiştir."], [569.0, "Bu sebeple İmam Buhârî'nin \"Sahîh\"inin nüshaları çok olduğu hâlde, bu söz Buhârî'den onların hiçbir nüshasında asla bilinmemektedir."], [579.0, "Bu yüzden Buhârî'yi, onun \"Sahîh\"ini ve nüshalarını bilen İmam Hâfız İbn Hacer şöyle demiştir:"], [588.5, "\"Buhârî'den bize ulaşan nüshalarda bunu görmedim.\" Öyleyse bu, bizzat el-Firebrî'nin bir hatasıdır."]]}]}, {"ts": "10:00", "title": "1. Külliye (sonuç) · 2. Külliye: Allah'ın zâtı hakkında söylenmesi vâcip olan her söz, sıfatları hakkında da söylenmesi vâciptir", "paras": [{"reader": false, "ar": [[600.0, "وأمّا الإمام البخاريّ رحمه الله تعالى فإنه بريءٌ من هذا التحريف."], [607.0, "وهكذا دواليك في كلّ من نُقل عنه من الأئمّة من أهل السنة والجماعة ـ سواءٌ من الصحابة أو ممّن بعدهم ـ أنه أوّل صفةَ كذا إلى كذا وكذا،"], [623.8, "فإنها لا تصحّ عنه."], [627.0, "ولذلك جاءت هذه الكلّيّة لتُريح طالبَ العلم من عناء البحث:"], [632.0, "بأنّ كلَّ ما ينسبونه لإمامٍ مُبرِّزٍ من أئمّة أهل السنة والجماعة من أنه أوّل صفةَ كذا وكذا إلى كذا وكذا،"], [642.2, "فإنها من الكذب عنه. والله أعلم."]], "tr": [[600.0, "İmam Buhârî'ye —Allah ona rahmet etsin— gelince, o bu tahriften berîdir."], [607.0, "Ehl-i Sünnet ve'l-Cemaat imamlarından —ister sahabeden ister onlardan sonrakilerden olsun— falanca sıfatı şöyle şöyle bir şeye te'vil ettiği nakledilen herkes hakkında da durum böyledir;"], [622.5, "bu ondan sahih değildir. Bu sebeple bu külliye, ilim talebesini araştırma zahmetinden rahatlatmak için gelmiştir:"], [632.0, "Ehl-i Sünnet ve'l-Cemaat imamlarından seçkin bir imama, falanca sıfatı şöyle şöyle bir şeye te'vil ettiğine dair nispet ettikleri her şey, ona karşı (uydurulmuş) yalanlardandır. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[646.0, "ومن الكلّيّات أيضًا: <b>كلُّ قولٍ واجبٍ في ذات الله فيجب قولُه في صفاته.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [664.0, "<b>كلُّ قولٍ واجبٍ في ذات الله عز وجل فيجب في صفاته.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[646.0, "Külliyelerden biri de şudur: 2."], [647.8, "külliye: Allah'ın zâtı hakkında söylenmesi vâcip olan her söz, O'nun sıfatları hakkında da söylenmesi vâciptir. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [664.0, "<b>2. külliye: Allah Azze ve Celle'nin zâtı hakkında vâcip olan her söz, sıfatları hakkında da vâciptir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[681.0, "أقول وبالله التوفيق: وقد أجمع أهلُ السنة والجماعة على مقتضى هذه الكلّيّة،"], [689.0, "ولله الحمد والمنّة. وقد نُقل هذا الإجماع عن الإمام ابن تيمية ومن قبله ومن بعده،"], [698.0, "حتى صارت قاعدةً وأصلًا عظيمًا يرجع إليه أهلُ السنة والجماعة في الردّ على أهل البدع،"], [706.0, "وهي التي نقول فيها:"], [708.7, "«القولُ في الصفات فرعٌ عن القول في الذات»."], [714.0, "وبيانُها: أنّ الله عز وجل ليس كمثله شيءٌ،"], [717.8, "لا في ذاته ولا في صفاته ولا في أفعاله عز وجل."], [723.0, "فإذا كان لله ذاتٌ حقيقةً لا تُماثل الذوات،"], [731.0, "فيجب علينا أن نُثبت لهذه الذات أيضًا صفاتٍ لا تُماثل الصفات."]], "tr": [[681.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat bu külliyenin gereği üzerinde icmâ etmiştir;"], [691.0, "hamd ve minnet Allah'adır. Bu icmâ İmam İbn Teymiyye'den, ondan öncekilerden ve sonrakilerden nakledilmiştir."], [699.1, "Öyle ki bu, Ehl-i Sünnet ve'l-Cemaat'in bid'at ehline reddiyede başvurduğu bir kaide ve büyük bir asıl olmuştur."], [708.7, "Bu, hakkında \"Sıfatlar hakkındaki söz, zât hakkındaki sözün fer'idir\" dediğimiz kaidedir."], [714.0, "Açıklaması şudur: Allah Azze ve Celle'nin benzeri hiçbir şey yoktur;"], [719.2, "ne zâtında ne sıfatlarında ne de fiillerinde."], [723.0, "Allah'ın hakikaten, zâtlara benzemeyen bir zâtı olduğuna göre, bu zât için de sıfatlara benzemeyen sıfatlar isbat etmemiz vâciptir."]]}, {"reader": false, "ar": [[737.0, "فأيُّ شيءٍ نقوله في ذات الله عز وجل فإنه مُنجرٌّ إلى القول في صفاته؛"], [743.0, "فالقول في هذا وفي هذا قولٌ واحد."], [748.0, "فإيّاك أن تُعطي ذاتَ الله عز وجل قولًا لا تقوله في الصفات؛"], [755.0, "فإنّ الباب بابٌ واحد،"], [757.5, "والقول فيه قولٌ واحد."], [760.0, "والمتقرِّر في الشريعة أنّ الشريعة لا تُفرِّق بين متماثلين،"], [768.0, "كما أنها لا تجمع بين مختلفين."]], "tr": [[737.0, "Allah Azze ve Celle'nin zâtı hakkında söylediğimiz her şey, O'nun sıfatları hakkındaki söze de çekilir."], [742.1, "Bu hususta da şu hususta da söz tek bir sözdür."], [748.0, "Sakın Allah Azze ve Celle'nin zâtına, sıfatlar hakkında söylemediğin bir söz verme!"], [753.8, "Çünkü bab tek bir babdır, bu babdaki söz de tek bir sözdür."], [760.0, "Şeriatta yerleşik olan şudur: Şeriat iki benzer şeyin arasını ayırmaz;"], [767.5, "tıpkı iki farklı şeyi bir araya getirmediği gibi."]]}, {"reader": false, "ar": [[771.0, "قال الإمام أحمد رحمه الله تعالى:"], [775.0, "«إنما التشبيه أن يقول: يدٌ كيدي، أو وجهٌ كوجهي. فأمّا إثباتُ يدٍ ليست كالأيدي، ووجهٍ ليس كالوجوه، فهو كإثبات ذاتٍ ليست كالذوات، وحياةٍ ليست كغيرها من الحياة، وسمعٍ وبصرٍ ليس كالأسماع والأبصار»."], [797.0, "انتهى كلامه. والشاهد منه:"], [800.5, "أنه جعل على هذا الكلام ـ عفوًا ـ جعل الكلامَ في الصفات كالكلام في الذات."], [809.0, "فكما أنّ الله عز وجل له ذاتٌ ليست كالذوات،"], [812.0, "فلهذه الذات صفاتٌ ليست كالصفات."]], "tr": [[771.0, "İmam Ahmed —Allah ona rahmet etsin— şöyle demiştir:"], [775.0, "\"Teşbih ancak 'benim elim gibi bir el' veya 'benim yüzüm gibi bir yüz' demektir."], [779.4, "Ellere benzemeyen bir el ve yüzlere benzemeyen bir yüz isbat etmeye gelince, bu;"], [786.0, "zâtlara benzemeyen bir zât, diğer hayatlara benzemeyen bir hayat, işitmelere ve görmelere benzemeyen bir işitme ve görme isbat etmek gibidir.\" —Sözü burada bitti."], [797.0, "Buradaki delil şudur: O, bu sözü —affedersiniz— sıfatlar hakkındaki sözü zât hakkındaki söz gibi kılmıştır."], [809.0, "Allah Azze ve Celle'nin zâtlara benzemeyen bir zâtı olduğu gibi, bu zâtın da sıfatlara benzemeyen sıfatları vardır."]]}, {"reader": false, "ar": [[815.0, "ويؤكّد ذلك الإمامُ الخطّابيّ رحمه الله تعالى في قوله:"], [820.0, "«والأصل في هذا أنّ الكلام في الصفات فرعٌ عن الكلام في الذات، ويُحتذى في ذلك حَذْوُه ومثالُه. فإذا كان معلومًا أنّ إثبات الباري سبحانه إنما هو إثباتُ وجودٍ لا إثباتُ كيفيّة، فكذلك إثباتُ صفاته إنما هو إثباتُ وجودٍ لا إثباتُ تحديدٍ وتكييف». انتهى كلامه."]], "tr": [[815.0, "İmam Hattâbî —Allah ona rahmet etsin— de bunu şu sözüyle te'kid eder:"], [820.0, "\"Bu konudaki asıl şudur: Sıfatlar hakkındaki söz, zât hakkındaki sözün fer'idir;"], [826.4, "bunda onun izine ve örneğine uyulur."], [829.8, "Bâri' Sübhânehû'yu isbat etmenin, keyfiyet isbatı değil ancak varlık isbatı olduğu bilindiğine göre, O'nun sıfatlarını isbat etmek de tahdîd (sınırlama) ve tekyîf isbatı değil, ancak varlık isbatıdır.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[846.0, "ويؤكّد ذلك المعنى أبو العبّاس ابن تيمية رحمه الله تعالى في قوله:"], [853.0, "«القول في الصفات كالقول في الذات؛ فإنّ الله ليس كمثله شيءٌ، لا في ذاته ولا في صفاته ولا في أفعاله. فإذا كان له ذاتٌ حقيقةً لا تُماثل الذوات، فالذات متّصفةٌ بصفاتٍ حقيقةً لا تُماثل سائرَ الصفات». انتهى كلامه."]], "tr": [[846.0, "Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— de bu manayı şu sözüyle te'kid eder:"], [850.7, "\"Sıfatlar hakkındaki söz, zât hakkındaki söz gibidir."], [853.0, "Çünkü Allah'ın benzeri hiçbir şey yoktur;"], [856.0, "ne zâtında ne sıfatlarında ne de fiillerinde."], [860.0, "O'nun hakikaten, zâtlara benzemeyen bir zâtı olduğuna göre, bu zât da hakikaten diğer sıfatlara benzemeyen sıfatlarla vasıflanmıştır.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[873.0, "ويؤكّد ذلك أيضًا الإمام ابن القيّم رحمه الله تعالى في قوله:"], [879.0, "«وعلموا» ـ أي أهلُ السنة والجماعة ـ «أنّ الصفات حكمُها حكمُ الذات؛ فكما أنّ ذاته سبحانه لا تُشبه الذوات، فصفاتُه لا تُشبه الصفات. فما جاءهم من الصفات عن المعصوم صلى الله عليه وسلم تلقَّوه بالقبول، وقابلوه بالمعرفة والإيمان والإقرار، لعلمهم بأنه صفةُ من لا شبيهَ لذاته ولا لصفاته». انتهى كلامه."]], "tr": [[873.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— de bunu şu sözüyle te'kid eder:"], [875.2, "\"Bildiler ki\" —yani Ehl-i Sünnet ve'l-Cemaat— \"sıfatların hükmü zâtın hükmüdür."], [876.8, "O Sübhânehû'nun zâtı zâtlara benzemediği gibi, sıfatları da sıfatlara benzemez."], [879.0, "Ma'sûm sallallâhu aleyhi ve sellem'den onlara gelen sıfatları kabulle karşıladılar;"], [890.9, "onları ma'rifet, iman ve ikrarla karşıladılar."], [896.5, "Çünkü bunun, ne zâtının ne de sıfatlarının benzeri olan birinin sıfatı olduğunu biliyorlardı.\" —Sözü burada bitti."]]}]}, {"ts": "15:12", "title": "2. Külliye (devam): Zât hakkında söylenenin sıfatlarda da söylenmesi; Cehmî'ye cevap", "paras": [{"reader": false, "ar": [[912.0, "وبناءً على ذلك فنقول:"], [915.0, "فإذا كنّا نؤمن بأنّ ذات الله عز وجل موجودة،"], [920.0, "فالواجب علينا أن نؤمن أيضًا بأنّ صفات هذه الذات موجودة."], [924.0, "وإذا كنّا نؤمن بأنّ إثباتنا لذات الله عز وجل إثباتُ وجودٍ لا إثباتُ تكييف،"], [932.0, "فكذلك إثباتُنا لصفات هذه الذات إثباتُ وجودٍ لا إثباتُ تكييف."], [939.0, "وإذا كنّا نقول بأنّ الله عز وجل ليس كمثله شيءٌ في ذاته،"], [946.0, "فكذلك أيضًا ليس كمثله شيءٌ في سائر صفاته."], [951.0, "وإذا كنّا نقول بأنّ لله عز وجل ذاتًا كاملةً من كلّ وجه،"], [959.0, "فإنه يجب علينا أيضًا أن نقول بأنّ لهذه الذات صفاتٍ كاملةً من كلّ وجه."]], "tr": [[912.0, "Buna binaen şöyle deriz: Allah Azze ve Celle'nin zâtının var olduğuna iman ediyorsak, bu zâtın sıfatlarının da var olduğuna iman etmemiz vâciptir."], [924.0, "Allah Azze ve Celle'nin zâtını isbatımızın tekyîf isbatı değil varlık isbatı olduğuna iman ediyorsak, bu zâtın sıfatlarını isbatımız da tekyîf isbatı değil varlık isbatıdır."], [939.0, "Allah Azze ve Celle'nin zâtında O'nun benzeri hiçbir şey olmadığını söylüyorsak, bütün sıfatlarında da O'nun benzeri hiçbir şey yoktur."], [951.0, "Allah Azze ve Celle'nin her yönden kâmil bir zâtı olduğunu söylüyorsak, bu zâtın her yönden kâmil sıfatları olduğunu söylememiz de vâciptir."]]}, {"reader": false, "ar": [[968.0, "وإذا كنّا نقول بأنّ الله عز وجل لا يعتريه في ذاته شيءٌ من النقص بوجهٍ من الوجوه،"], [976.0, "فكذلك أيضًا نقول بأنّ صفات هذه الذات لا يعتريها نقصٌ بوجهٍ من الوجوه."], [986.0, "وكما نقول بأنّ معرفة عقولنا لكيفيّة ذات الله عز وجل ممتنعة،"], [996.0, "فكذلك معرفةُ عقولنا لشيءٍ من كيفيّات صفات هذه الذات ممتنعة."], [1003.0, "وإذا كنّا نقول بأننا نُثبت لله عز وجل ذاتًا إثباتًا بلا إلحادٍ ولا تكييفٍ ولا تمثيلٍ ولا تعطيلٍ ولا غير ذلك،"], [1020.0, "فكذلك أيضًا يجب علينا أن نقول في إثبات الصفات:"], [1023.0, "أننا نُثبتها لله عز وجل إثباتًا بلا إلحادٍ ولا تحريفٍ ولا تكييفٍ ولا تعطيلٍ ولا تمثيل؛"], [1031.0, "لأنّ من ليس كمثله شيءٌ في ذاته فليس كمثله شيءٌ في صفاته ولا في أفعاله عز وجل."]], "tr": [[968.0, "Allah Azze ve Celle'nin zâtına hiçbir şekilde hiçbir noksanlık ârız olmadığını söylüyorsak, bu zâtın sıfatlarına da hiçbir şekilde noksanlık ârız olmadığını söyleriz."], [981.4, "Akıllarımızın Allah Azze ve Celle'nin zâtının keyfiyetini bilmesinin imkânsız olduğunu söylediğimiz gibi, akıllarımızın bu zâtın sıfatlarının keyfiyetlerinden herhangi birini bilmesi de imkânsızdır."], [1003.0, "Allah Azze ve Celle için ilhadsız, tekyîfsiz, temsilsiz, ta'tilsiz ve benzeri şeyler olmaksızın bir zât isbat ettiğimizi söylüyorsak, sıfatları isbat hususunda da onları Allah Azze ve Celle'ye ilhadsız, tahrifsiz, tekyîfsiz, ta'tilsiz ve temsilsiz bir isbatla isbat ettiğimizi söylememiz vâciptir."], [1031.0, "Çünkü zâtında benzeri hiçbir şey olmayanın, sıfatlarında ve fiillerinde de benzeri hiçbir şey yoktur."]]}, {"reader": false, "ar": [[1039.0, "وكما أنه لا يجوز تعطيلُ الله عز وجل عن ذاته،"], [1047.0, "فكذلك أيضًا لا يجوز تعطيلُ الله عز وجل عن شيءٍ من صفاته."], [1053.0, "وكما أنّ الأدلّة التي تُثبت ذاتَ الله عز وجل لا يدخلها المجاز،"], [1060.0, "فكذلك أيضًا صفاتُ هذه الذات لا يجوز القولُ بدخول المجاز في شيءٍ منها."], [1067.0, "بل إنّ من بركة هذه الكلّيّة أنه يُردّ بها على الجهميّة المعطِّلة الذين ينفون صفات الله عز وجل."]], "tr": [[1039.0, "Allah Azze ve Celle'yi zâtından ta'til etmek caiz olmadığı gibi, Allah Azze ve Celle'yi sıfatlarından herhangi birinden ta'til etmek de caiz değildir."], [1053.0, "Allah Azze ve Celle'nin zâtını isbat eden delillere mecaz girmediği gibi, bu zâtın sıfatlarından herhangi birine mecazın girdiğini söylemek de caiz değildir."], [1067.0, "Hatta bu külliyenin bereketlerinden biri, Allah Azze ve Celle'nin sıfatlarını nefyeden muattıl Cehmiyye'ye bununla reddiye yapılmasıdır."]]}, {"reader": false, "ar": [[1076.0, "فإذا جاءك الجهميُّ وقال لك:"], [1078.8, "<span class=\"ayah\">﴿الرَّحْمَٰنُ عَلَى الْعَرْشِ اسْتَوَىٰ﴾<\/span> <span class=\"ref\">[طه: ٥]<\/span>،"], [1081.0, "كيف استوى؟ فقل له:"], [1084.8, "أوَأنت تؤمن بأنّ لله ذاتًا؟"], [1088.7, "الجواب: نعم. فقل له:"], [1092.1, "أخبِرني كيف اللهُ عز وجل في ذاته،"], [1096.0, "حتى أُخبرك كيف اللهُ عز وجل في استوائه."], [1102.0, "سيقول لك: أنا لا أعلم كيفيّة ذات الله عز وجل."], [1107.0, "فقل: عدمُ العلم بالكيفيّة يجرّني وإيّاك إلى عدم العلم بصفات هذه الكيفيّة؛"], [1115.0, "فكيف تأمرني أن أُعطيك كيفيّةَ صفةِ ذاتٍ أنا وأنت نتّفق على عدم العلم بالكيفيّة بها؟"]], "tr": [[1076.0, "Cehmî sana gelip <span class=\"ayah\">﴿Rahmân Arş'a istivâ etti﴾<\/span> [Tâhâ 5] (ayetini okuyarak) \"Nasıl istivâ etti?\" derse, ona de ki:"], [1083.0, "\"Sen Allah'ın bir zâtı olduğuna iman ediyor musun?\" Cevap:"], [1088.7, "\"Evet.\" Ona de ki: \"Bana Allah Azze ve Celle'nin zâtında nasıl olduğunu haber ver ki ben de sana Allah Azze ve Celle'nin istivâsında nasıl olduğunu haber vereyim.\" Sana \"Ben Allah Azze ve Celle'nin zâtının keyfiyetini bilmiyorum\" diyecektir."], [1107.0, "De ki: \"Keyfiyeti bilmemek, beni de seni de bu keyfiyetin sıfatlarını bilmemeye götürür."], [1115.0, "Keyfiyetini bilmediğimizde senin de benim de ittifak ettiğimiz bir zâtın sıfatının keyfiyetini sana vermemi nasıl emredersin?\""]]}, {"reader": false, "ar": [[1124.0, "ولذلك يقول الناظم: «فمن يقلْ: كيف استوى؟ فقلْ له: كيف بذاتِ الربِّ؟ كيف كُنهُهُ؟ / فإن يقلْ: لا أعلمَنْ كُنهَهُ، فقلْ: كذا استواؤه يَتبعُ له» <span class=\"q\">؟ 18:46<\/span>."], [1139.0, "فكما أننا نتّفق جميعًا على أنّ الكلام في كيفيّة ذات الله عز وجل محرَّمٌ ولا طريقَ لمعرفته،"], [1152.0, "فكذلك يجب علينا أن نُجمِع بأنّ الكلام على شيءٍ من كيفيّات صفات الله عز وجل محرَّمٌ ولا طريقَ إلى معرفته أبدًا."], [1165.0, "والخلاصة من ذلك: أنّ كلَّ من يسألك عن شيءٍ من صفات الله فألزِمه بالقول في ذات الله،"], [1175.0, "وما كان جوابُه عن ذات الله عز وجل فهو جوابُك أنت عمّا سألك عنه من الصفات. والله أعلم."]], "tr": [[1124.0, "Bu yüzden nâzım şöyle der:"], [1126.0, "\"Kim 'Nasıl istivâ etti?' derse, ona de ki:"], [1131.6, "Rabb'in zâtı nasıldır, künhü nasıldır?"], [1135.0, "Eğer 'Onun künhünü bilmiyorum' derse, de ki:"], [1139.0, "İstivâsı da böyledir, ona (zâta) tâbidir.\" <span class=\"q\">؟<\/span> Allah Azze ve Celle'nin zâtının keyfiyeti hakkında konuşmanın haram olduğunda ve onu bilmenin hiçbir yolu bulunmadığında hepimiz ittifak ettiğimiz gibi, Allah Azze ve Celle'nin sıfatlarının keyfiyetlerinden herhangi biri hakkında konuşmanın haram olduğunda ve onu bilmenin asla bir yolu bulunmadığında da ittifak etmemiz vâciptir."], [1166.2, "Bundan çıkan sonuç şudur: Sana Allah'ın sıfatlarından herhangi birini soran herkesi, Allah'ın zâtı hakkında söz söylemekle ilzam et."], [1175.0, "Onun Allah Azze ve Celle'nin zâtı hakkındaki cevabı neyse, onun sana sorduğu sıfatlar hakkındaki senin cevabın da odur. Allah en iyisini bilir."]]}]}, {"ts": "19:43", "title": "3. Külliye: Bir sıfat hakkında söylenmesi vâcip olan her söz, bütün sıfatlar hakkında da söylenmesi vâciptir", "paras": [{"reader": false, "ar": [[1183.0, "ومن الكلّيّات أيضًا: <b>كلُّ قولٍ واجبٍ في صفةٍ فيجب قولُه في كلّ الصفة<\/b> ـ <b>كلُّ قولٍ واجبٍ في صفةٍ فيجب قولُه في كلّ الصفات.<\/b> أُعيدها مرّةً ثالثة:"], [1202.0, "<b>كلُّ قولٍ واجبٍ في صفةٍ فيجب قولُه في كلّ الصفات.<\/b>"]], "tr": [[1183.0, "Külliyelerden biri de şudur: 3."], [1185.2, "külliye: Bir sıfat hakkında söylenmesi vâcip olan her söz, bütün sıfat hakkında da söylenmesi vâciptir — Bir sıfat hakkında söylenmesi vâcip olan her söz, bütün sıfatlar hakkında da söylenmesi vâciptir. Üçüncü kez tekrar ediyorum:"], [1202.0, "<b>3. külliye: Bir sıfat hakkında söylenmesi vâcip olan her söz, bütün sıfatlar hakkında da söylenmesi vâciptir.<\/b>"]]}, {"reader": false, "ar": [[1211.0, "أقول وبالله التوفيق: وهذا من الأصول السُّنّيّة السلفيّة التي أجمع عليها أهلُ السنة والجماعة قاطبةً،"], [1223.0, "ولم يخالف فيها أحد."], [1224.8, "وهي من جملة الأصول التي اعتمدها أبو العبّاس ابن تيمية رحمه الله تعالى في كتاب «التدمريّة»،"], [1232.0, "في قوله: «القول في بعض الصفات كالقول في بعض»."], [1238.0, "أي: أنّ من أثبت شيئًا لله عز وجل من الصفات،"], [1242.7, "وعطّل اللهَ عز وجل عن صفاتٍ أخرى ـ أخرى،"], [1246.7, "انتبهوا ـ فإنه يلزمه فيما أثبته نظيرُ ما يلزمه فيما عطّله."]], "tr": [[1211.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'in istisnasız icmâ ettiği, hiç kimsenin muhalefet etmediği sünnî ve selefî asıllardandır."], [1224.8, "Bu, Ebü'l-Abbâs İbn Teymiyye'nin —Allah ona rahmet etsin— \"et-Tedmüriyye\" kitabında dayandığı asıllar cümlesindendir;"], [1229.3, "\"Sıfatların bazısı hakkındaki söz, diğer bazısı hakkındaki söz gibidir\" sözünde."], [1233.3, "Yani Allah Azze ve Celle için sıfatlardan bir şeyi isbat edip Allah Azze ve Celle'yi başka sıfatlardan —başka, dikkat edin— ta'til eden kimseye, isbat ettiği şeyde de ta'til ettiği şeyde lâzım gelenin benzeri lâzım gelir."]]}, {"reader": false, "ar": [[1260.0, "فإن كان قال: أنا أُثبت لله عز وجل السمعَ والبصر،"], [1265.7, "ولكن أُنكر الغضبَ والرحمة،"], [1268.0, "فنسأله: ما الذي يجعلك تُنكر صفةَ الغضب والرحمة؟"], [1272.0, "فيقول: لأنها من الصفات التي لا تليق بالله عز وجل."], [1277.0, "فقل: وكذلك السمعُ والبصر الذي تُثبته لا يليق بالله عز وجل."], [1282.0, "فإن قال: أنا أُثبت سمعًا وبصرًا لائقًا بجلاله وعظمته،"], [1286.0, "فقل: كذلك أُثبت له غضبًا ورحمةً لائقةً بجلاله وعظمته."], [1291.0, "فإن قال: أنا أُثبت سمعًا وبصرًا لا يقتضي إثباتُهما مماثلتَهما بصفات الخلق،"], [1298.0, "فقل: كذلك أُثبت لله عز وجل غضبًا ورحمةً لا يقتضي إثباتُها مماثلةَ الله عز وجل بصفات خلقه."]], "tr": [[1260.0, "Eğer \"Ben Allah Azze ve Celle için işitme ve görmeyi isbat ediyorum, fakat gazabı ve rahmeti inkâr ediyorum\" derse, ona sorarız:"], [1268.5, "\"Seni gazap ve rahmet sıfatını inkâr etmeye sevk eden nedir?\" O da:"], [1272.0, "\"Çünkü bunlar Allah Azze ve Celle'ye yakışmayan sıfatlardandır\" der."], [1277.0, "De ki: \"Senin isbat ettiğin işitme ve görme de aynı şekilde Allah Azze ve Celle'ye yakışmaz.\" Eğer \"Ben O'nun celâline ve azametine yakışan bir işitme ve görme isbat ediyorum\" derse, de ki:"], [1286.6, "\"Ben de aynı şekilde O'na celâline ve azametine yakışan bir gazap ve rahmet isbat ediyorum.\" Eğer \"Ben, isbatı onların mahlûkatın sıfatlarına benzemesini gerektirmeyen bir işitme ve görme isbat ediyorum\" derse, de ki:"], [1298.5, "\"Ben de aynı şekilde Allah Azze ve Celle için, isbatı Allah Azze ve Celle'nin mahlûkatının sıfatlarına benzemesini gerektirmeyen bir gazap ve rahmet isbat ediyorum.\""]]}, {"reader": false, "ar": [[1308.0, "فإن قال لك: بأنّ الرحمة لا يوصف بها إلا المخلوق،"], [1312.0, "فقل: وكذلك السمع لا يوصف به إلا المخلوق."], [1315.0, "فما كان قولُه دفاعًا عن صفاته التي يُثبتها فهو ردُّنا عليه في صفاته التي ينفيها؛"], [1327.0, "لأنّ القول في باب الصفات قولٌ واحد."], [1331.0, "فمن أعطى بعضَ الصفات قولًا،"], [1333.0, "وأعطى بعضَ الصفات قولًا آخر،"], [1335.9, "فإنه يكون قد فرّق بين متماثلين،"], [1339.4, "ومن فرّق بين متماثلين فقد خالف مقتضى الشرع."]], "tr": [[1308.0, "Eğer sana \"Rahmetle ancak mahlûk vasıflanır\" derse, de ki:"], [1312.4, "\"İşitmeyle de aynı şekilde ancak mahlûk vasıflanır.\" Onun isbat ettiği sıfatları savunmak için söylediği söz neyse, nefyettiği sıfatlar hakkında bizim ona reddiyemiz de odur."], [1327.0, "Çünkü sıfatlar babındaki söz tek bir sözdür."], [1331.0, "Kim sıfatların bazısına bir söz, bazısına başka bir söz verirse, iki benzer şeyin arasını ayırmış olur;"], [1338.2, "iki benzer şeyin arasını ayıran ise şeriatın gereğine muhalefet etmiştir."]]}, {"reader": false, "ar": [[1344.0, "قال الإمام ابن تيمية رحمه الله تعالى:"], [1348.6, "«ومن فرّق بين صفةٍ وصفة ـ مع تساويهما في أسباب الحقيقة والمجاز ـ كان متناقضًا في قوله، متهافتًا في مذهبه، مشابهًا لمن آمن ببعض الكتاب وكفر ببعض»."], [1368.0, "انتهى كلامه. وقال الإمام ابن تيمية أيضًا:"], [1373.0, "«القول في بعض صفات الله كالقول في سائرها، وأنّ القول في صفاته كالقول في ذاته، وأنّ من أثبت صفةً دون صفةٍ ممّا جاء به الرسول صلى الله عليه وسلم، مع مشاركة إحداهما الأخرى فيما به نفاها، كان متناقضًا»."]], "tr": [[1344.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1348.6, "\"Hakikat ve mecaz sebeplerinde eşit oldukları hâlde bir sıfatla diğer bir sıfatın arasını ayıran kimse, sözünde çelişkiye düşmüş, mezhebinde tutarsız, Kitab'ın bir kısmına iman edip bir kısmını inkâr edene benzeyen biri olur.\" —Sözü burada bitti."], [1370.0, "İmam İbn Teymiyye yine şöyle demiştir:"], [1373.0, "\"Allah'ın sıfatlarının bazısı hakkındaki söz, diğerleri hakkındaki söz gibidir;"], [1377.0, "O'nun sıfatları hakkındaki söz de zâtı hakkındaki söz gibidir."], [1381.4, "Resûl sallallâhu aleyhi ve sellem'in getirdiklerinden bir sıfatı isbat edip diğerini —onu nefyettiği şeyde ikisi ortak olduğu hâlde— isbat etmeyen kimse çelişkiye düşmüştür.\""]]}, {"reader": false, "ar": [[1396.0, "بمعنى: أنك إنما نفيتَ هذه الصفة وأثبتَّ هذه الصفة بسبب فُرقانٍ عندك؛"], [1404.0, "اعلم أنّ هذا الفُرقان هو ردُّنا عليك فيما نفيتَه،"], [1410.0, "وأنه فُرقانٌ باطل. إلا إذا قال:"], [1414.1, "بأنّ الصفات التي أُثبتها يقتضيها العقل،"], [1419.0, "وأنّ الصفات التي أنفيها لا يقتضي العقلُ إثباتَها،"], [1423.0, "فحينئذٍ نُجيب عنه بإجاباتٍ أخرى سوف تأتينا في كلّيّاتٍ قادمة إن شاء الله عز وجل."], [1431.0, "وخلاصةُ جوابنا: بأنّ هذا البابَ غيبيٌّ،"], [1434.0, "ليس خاضعًا ـ فيما نُثبته فيه أو ننفيه عنه ـ لمقتضى العقول، ولأنّ العقول متفاوتة."]], "tr": [[1396.0, "Yani sen bu sıfatı ancak sendeki bir ayırıcı (furkan) sebebiyle nefyettin, şu sıfatı da onun sebebiyle isbat ettin."], [1404.0, "Bil ki bu ayırıcı, nefyettiğin şey hakkında bizim sana reddiyemizdir ve o bâtıl bir ayırıcıdır."], [1414.1, "Ancak \"İsbat ettiğim sıfatları akıl gerektirir, nefyettiğim sıfatların isbatını ise akıl gerektirmez\" derse, o zaman ona inşallah ileriki külliyelerde gelecek başka cevaplarla cevap veririz."], [1427.0, "Cevabımızın özeti şudur: Bu bab gaybî bir babdır;"], [1431.0, "onda isbat ettiğimiz veya ondan nefyettiğimiz şeylerde akılların gereğine tâbi değildir."], [1437.5, "Bir de akıllar birbirinden farklıdır."]]}, {"reader": false, "ar": [[1442.0, "فبأيّ عقلٍ يُوزَن الكتابُ والسنّة؟"], [1446.0, "أفبعقل القرمطيّ النُّصيريّ الإسماعيليّ الذي ينفي عن الله عز وجل النقيضين،"], [1455.0, "فيقول: إنّ عقلي لا يُثبت لله عز وجل صفةً من صفات النقيضين؛"], [1463.0, "فلا يجوز أن أقول بأنه حيّ،"], [1466.0, "لأنني سأُشبّهه بالموجودات، ولا يجوز أن أقول إنه ميّت،"], [1472.3, "لأنني سأُشبّهه بالمعدومات، ولا يجوز لي أن أقول بأنه موجود،"], [1478.9, "لأنني سأُشبّهه بالموجودات، ولا أصفه بأنه معدوم،"], [1485.9, "لأنني سأُشبّهه بالمعدومات، ولا يجوز أن أقول بأنه عليّ،"], [1492.0, "لأنني سأُشبّهه بالموجودات، ولا أقول بأنه في سُفل،"], [1497.5, "لأنني سأُشبّهه بما يقتضي نقصَه؟"], [1501.0, "فيقول: بأنّ عقلي لا يُثبت لله عز وجل في باب الصفات لا إثباتًا ولا نفيًا."]], "tr": [[1442.0, "Kitap ve Sünnet hangi akılla tartılacak?"], [1442.8, "Allah Azze ve Celle'den iki nakîzi nefyeden Karmatî, Nusayrî, İsmâilî'nin aklıyla mı?"], [1446.0, "O şöyle der: \"Aklım Allah Azze ve Celle için iki nakîz sıfattan hiçbirini isbat etmez."], [1455.7, "O'nun diri olduğunu söylemem caiz değildir, çünkü O'nu var olanlara benzetmiş olurum."], [1459.0, "O'nun ölü olduğunu söylemem caiz değildir, çünkü O'nu yok olanlara benzetmiş olurum."], [1463.0, "O'nun var olduğunu söylemem caiz değildir, çünkü O'nu var olanlara benzetmiş olurum."], [1474.0, "O'nu yok olmakla da vasıflandırmam, çünkü O'nu yok olanlara benzetmiş olurum."], [1488.0, "O'nun yüce olduğunu söylemem caiz değildir, çünkü O'nu var olanlara benzetmiş olurum."], [1501.0, "Aşağıda olduğunu da söylemem, çünkü O'nu noksanlığını gerektiren şeye benzetmiş olurum.\" Böylece \"Aklım sıfatlar babında Allah Azze ve Celle için ne isbat ne de nefy kabul eder\" der."]]}]}, {"ts": "25:10", "title": "3. Külliye (devam): Hangi akıl? Bilmemek, yokluğu bilmek değildir", "paras": [{"reader": false, "ar": [[1510.0, "أم بعقل الفلسفيّ الجهميّ الذي يقول:"], [1514.1, "إنّ عقلي يحتمل صفاتِ النفي والسلب،"], [1521.0, "ولا يحتمل إثباتَ صفةٍ واحدةٍ لله عز وجل،"], [1525.0, "فيقول: املأ الدنيا نفيًا،"], [1527.2, "ولكن احذر من أن تُثبت صفةً واحدة؟"], [1531.0, "أم نقيس الكتاب والسنّة بعقل الجهميّ الذي لا يُثبت لله عز وجل اسمًا ولا صفة؟"], [1541.0, "أم نقيس الكتاب والسنّة بعقل المعتزليّ الذي يؤمن أنّ لله عز وجل أسماءً،"], [1548.0, "ولكنّ عقله لا يحتمل إثباتَ شيءٍ من الصفات لله عز وجل؟"], [1553.0, "أم بعقل الأشعريّ الذي يُثبت لله عز وجل الأسماءَ كلَّها،"], [1558.0, "ولم يستطع عقلُه إلا أن يُثبت سبعَ صفات؟"]], "tr": [[1510.0, "Yoksa \"Aklım nefy ve selb sıfatlarını kaldırır, fakat Allah Azze ve Celle için tek bir sıfatın isbatını kaldırmaz\" diyen filozof Cehmî'nin aklıyla mı?"], [1525.5, "O der ki: \"Dünyayı nefyle doldur, fakat tek bir sıfat isbat etmekten sakın!\" Yoksa Kitap ve Sünnet'i, Allah Azze ve Celle için ne bir isim ne de bir sıfat isbat eden Cehmî'nin aklına mı kıyas edeceğiz?"], [1541.0, "Yoksa Kitap ve Sünnet'i, Allah Azze ve Celle'nin isimleri olduğuna iman eden fakat aklı Allah Azze ve Celle için sıfatlardan hiçbirinin isbatını kaldırmayan Mu'tezilî'nin aklına mı kıyas edeceğiz?"], [1553.0, "Yoksa Allah Azze ve Celle için bütün isimleri isbat eden fakat aklı ancak yedi sıfat isbat edebilen Eş'arî'nin aklıyla mı?"]]}, {"reader": false, "ar": [[1561.0, "فإذا قلنا بأنّ الاعتماد فيما يُثبَت ويُنفى في باب الصفات على العقل،"], [1567.0, "فبأيّ عقلٍ يُوزَن الكتابُ والسنّة؟"], [1571.0, "فإنّ العقول متفاوتة. ثم أضِف إلى هذا أننا نرفض هذه الدعوى بقولنا:"], [1579.5, "ومن قال لك بأنّ الغضب لا نستطيع أن نُثبته بعقولنا،"], [1584.0, "مع أنك تنفيه بدعوى أنّ عقلك لا يستطيع إثباتَه؟"], [1588.0, "ومن قال لك بأنّ الرحمة لا نستطيع أن نُثبتها بعقولنا،"], [1592.0, "مع أنّ عقلك ينفيها بحجّة أنه لا يستطيع إثباتَها؟"], [1597.0, "فلو أننا فتحنا لعقولنا إثباتَ صفات الكمال لله عز وجل لزِدنا في سبعِك صفاتٍ كثيرة."]], "tr": [[1561.0, "Sıfatlar babında isbat edilen ve nefyedilen şeylerde dayanağın akıl olduğunu söylersek, Kitap ve Sünnet hangi akılla tartılacak?"], [1571.0, "Çünkü akıllar birbirinden farklıdır. Sonra buna şunu da ekle:"], [1576.5, "Biz bu iddiayı şu sözümüzle reddederiz:"], [1579.5, "Gazabı akıllarımızla isbat edemeyeceğimizi sana kim söyledi?"], [1583.1, "Hâlbuki sen onu, aklının onu isbat edemeyeceği iddiasıyla nefyediyorsun."], [1588.0, "Rahmeti akıllarımızla isbat edemeyeceğimizi sana kim söyledi?"], [1591.2, "Hâlbuki senin aklın onu, onu isbat edemeyeceği gerekçesiyle nefyediyor."], [1597.0, "Akıllarımıza Allah Azze ve Celle için kemal sıfatlarını isbat etme kapısını açsaydık, senin yedi (sıfatına) pek çok sıfat eklerdik."]]}, {"reader": false, "ar": [[1607.0, "فدعواك أنّ عقلك عاجزٌ عن إثبات ما زاد على السبع فهو إعلانٌ بجهلك."], [1615.0, "فإيّاك أن تجعل عدمَ علمك بثبوت الشيء علمًا بعدم هذا الشيء؛"], [1626.0, "فإنّ المتقرِّر في قواعد العقول أنّ عدم العلم بالشيء ليس علمًا بعدمه،"], [1633.0, "وإنما أنت تُخبر عن جهلك فقط،"], [1635.0, "وغيرُك قد يستطيع أن يزيد على هذه السبع التي توقّف عقلُك عندها."]], "tr": [[1607.0, "Aklının yediden fazlasını isbat etmekten âciz olduğu iddian, cehaletinin ilanıdır."], [1615.0, "Sakın bir şeyin sübûtunu bilmemeni, o şeyin yokluğunu bilmek sayma!"], [1619.1, "Çünkü akılların kaidelerinde yerleşik olan şudur:"], [1626.0, "Bir şeyi bilmemek, onun yokluğunu bilmek değildir."], [1631.2, "Sen ancak kendi cehaletini haber veriyorsun;"], [1634.7, "başkası ise aklının yanında durduğu bu yediye ekleme yapabilir."]]}, {"reader": false, "ar": [[1642.0, "والخلاصة من ذلك: أنّ كلَّ من يُثبت شيئًا من الصفات فإنما أثبتها لمعنًى،"], [1650.0, "وكلَّ من أنكر شيئًا من الصفات فإنما نفاها لمحذورٍ قام عنده؛"], [1656.0, "فحينئذٍ يلزمه فيما أثبته كما يلزمه فيما نفاه."], [1665.0, "فإن كان ما أثبته لا محذورَ في إثباته،"], [1669.0, "فنقول له: إنّ ما نفيتَه ـ واللهِ ـ لا محذورَ أبدًا في إثباته."], [1675.0, "وإن كان ما نفاه إنما نفاه لمحذورٍ في ذاته،"], [1679.0, "فنقول: إنّ هذا المحذور يلزمك فيما أثبتَّه."], [1683.0, "فإمّا أن تُثبت الجميعَ وتكون كإخوانك من أهل السنة والجماعة،"], [1690.0, "وإمّا أن تنفي الجميعَ فتكون كإخوانك من الجهميّة النُّفاة،"], [1696.0, "وأمّا أن تُثبت بعضًا وتنفي بعضًا فهذا عينُ التناقض؛"], [1702.4, "لأنّ المتقرِّر في الكلّيّات عند أهل السنة والجماعة أنّ كلَّ قولٍ يجب في صفةٍ فإنه يجب قولُه في سائر الصفات. والله أعلم."]], "tr": [[1642.0, "Bundan çıkan sonuç şudur: Sıfatlardan bir şeyi isbat eden herkes onu ancak bir mana sebebiyle isbat etmiştir;"], [1649.4, "sıfatlardan bir şeyi inkâr eden herkes de onu ancak kendisinde oluşan bir mahzur sebebiyle nefyetmiştir."], [1656.0, "O zaman ona isbat ettiği şeyde de nefyettiği şeyde lâzım gelen lâzım gelir."], [1665.0, "Eğer isbat ettiği şeyin isbatında bir mahzur yoksa, ona deriz ki:"], [1670.0, "Vallahi senin nefyettiğin şeyin isbatında da asla bir mahzur yoktur."], [1675.0, "Eğer nefyettiği şeyi ancak bizzat onda bulunan bir mahzur sebebiyle nefyettiyse, deriz ki:"], [1679.6, "Bu mahzur senin isbat ettiğin şeyde de sana lâzım gelir."], [1683.0, "Ya hepsini isbat edersin ve Ehl-i Sünnet ve'l-Cemaat'ten olan kardeşlerin gibi olursun;"], [1689.3, "ya da hepsini nefyedersin ve nefyedici Cehmiyye'den olan kardeşlerin gibi olursun."], [1695.3, "Bir kısmını isbat edip bir kısmını nefyetmene gelince, bu çelişkinin ta kendisidir."], [1702.4, "Çünkü Ehl-i Sünnet ve'l-Cemaat nezdinde külliyelerde yerleşik olan şudur:"], [1705.5, "Bir sıfat hakkında vâcip olan her söz, diğer bütün sıfatlar hakkında da söylenmesi vâciptir. Allah en iyisini bilir."]]}]}, {"ts": "28:33", "title": "4. Külliye: Bir sıfatı, onda vehmettiği bir mahzur yüzünden tahrif eden herkese, isbat ettiği şeyde bu mahzurun benzeri ve daha şiddetlisi lâzım gelir", "paras": [{"reader": false, "ar": [[1713.0, "ومن الكلّيّات أيضًا ـ وهي كلّيّةٌ مؤكِّدةٌ لما مضى ـ:"], [1718.0, "<b>كلُّ من حرّف صفةً لمحذورٍ توهّمه فيها فيلزمه فيما أثبته نظيرُ هذا المحذور وأشدّ.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة باختصار:"], [1765.0, "<b>كلُّ من حرّف صفةً لمحذورٍ توهّمه فيها فيلزمه فيما أثبته نظيرُ هذا المحذور وأشدّ.<\/b>"]], "tr": [[1713.0, "Külliyelerden biri de —ki o, geçenleri te'kid eden bir külliyedir— şudur:"], [1718.0, "<b>4. külliye: Bir sıfatı, onda vehmettiği bir mahzur yüzünden tahrif eden herkese, isbat ettiği şeyde bu mahzurun benzeri ve daha şiddetlisi lâzım gelir.<\/b> (Tekrar ediyor.) Üçüncü kez kısaca tekrar ediyorum:"], [1765.0, "<b>4. külliye: Bir sıfatı, onda vehmettiği bir mahzur yüzünden tahrif eden herkese, isbat ettiği şeyde bu mahzurun benzeri ve daha şiddetlisi lâzım gelir.<\/b>"]]}, {"reader": false, "ar": [[1773.0, "أقول وبالله التوفيق: ومعناها ما ذكرتُ لكم طرفًا منه في الكلّيّة التي قبلها،"], [1782.0, "وهي: أنّ كلَّ من فرّق بين صفةٍ وصفة،"], [1787.4, "فأثبت صفةً لمعنًى فيها يقتضي إثباتَها،"], [1792.0, "ونفى صفةً لمحذورٍ رآه فيها ـ انتبه ـ فإنه يلزمه فيما أثبته نظيرُ المحذور الذي فرّ منه،"], [1803.0, "بل وأشدُّ وأشرُّ من ذلك؛"], [1806.4, "لأنه فرّ ممّا ثبت في الكتاب والسنّة،"], [1813.0, "واخترع هو من عند نفسه شيئًا لم يرد به كتابٌ ولا سنّةٌ ولا قولُ إمامٍ من أئمّة أهل العلم."], [1822.1, "فإذن يلزمه مع التعطيل التحريف،"], [1825.6, "فإذن وقع في شرّين."]], "tr": [[1773.0, "Tevfik Allah'tandır, derim ki: Bunun manası, bir kısmını size önceki külliyede zikrettiğim şeydir."], [1782.7, "O da şudur: Bir sıfatla diğer bir sıfatın arasını ayıran, isbatını gerektiren bir mana sebebiyle bir sıfatı isbat edip onda gördüğü bir mahzur sebebiyle başka bir sıfatı nefyeden herkese —dikkat et— isbat ettiği şeyde kaçtığı mahzurun benzeri lâzım gelir;"], [1806.4, "hatta ondan daha şiddetlisi ve daha kötüsü."], [1809.8, "Çünkü o, Kitap ve Sünnet'te sabit olandan kaçmış, kendi tarafından ne Kitab'ın ne Sünnet'in ne de ilim ehlinin imamlarından herhangi bir imamın sözünün getirmediği bir şey uydurmuştur."], [1822.1, "Öyleyse ona ta'tille birlikte tahrif de lâzım gelir; öyleyse iki kötülüğe düşmüştür."]]}, {"reader": false, "ar": [[1830.0, "ويؤكّد ذلك ابنُ تيمية بقوله:"], [1833.2, "«وهؤلاء جميعُهم يفرّون من شيءٍ فيقعون في نظيره وفي شرٍّ منه، مع ما يلزمهم من التحريف والتعطيل». انتهى كلامه."]], "tr": [[1830.0, "İbn Teymiyye bunu şu sözüyle te'kid eder:"], [1833.2, "\"Bunların hepsi bir şeyden kaçar, onun benzerine ve ondan daha kötüsüne düşer;"], [1839.0, "üstelik onlara tahrif ve ta'til de lâzım gelir.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[1848.0, "وأضرب لكم أمثلة: الذين ينفون عن الله عز وجل النقيضين،"], [1853.7, "فيقولون: لا حيّ ولا ميّت،"], [1856.5, "ولا يسمع وليس بأصمّ،"], [1858.7, "ولا يتكلّم وليس بأخرس؛"], [1861.0, "كلُّ ذلك من باب الفرار ـ في الإثبات ـ من تشبيهه بالموجودات،"], [1869.0, "ويفرّون بالنفي من تشبيهه بالمعدومات."], [1874.0, "فلمّا سلبوا عنه صفةَ النقيضين شبّهوه بالممتنعات التي لا يُتصوَّر وجودُها أصالةً."], [1881.0, "فإذن نفروا من محذورٍ ووقعوا في نظيره،"], [1885.8, "بل في أشدّ منه."], [1889.0, "فإذا قلتَ بأنّ الله لا موجودٌ ولا معدوم،"], [1893.9, "فإذن هو ممتنع؛ إذا قلتَ بأنّ الله لا حيٌّ ولا ميّت،"], [1899.5, "إذن هو ممتنع؛ إذا قلتَ بأنّ الله لا يُبصر وليس بأعمى،"], [1906.4, "إذن أنت تصف شيئًا ممتنعًا."]], "tr": [[1848.0, "Size örnekler vereyim: Allah Azze ve Celle'den iki nakîzi nefyedenler şöyle derler:"], [1854.2, "\"Ne diridir ne ölü; ne işitir ne de sağırdır;"], [1861.0, "ne konuşur ne de dilsizdir.\" Bütün bunlar, isbat hususunda O'nu var olanlara benzetmekten kaçmak içindir;"], [1874.0, "nefy ile de O'nu yok olanlara benzetmekten kaçarlar."], [1878.1, "İki nakîz sıfatı O'ndan soyunca, O'nu varlığı aslen tasavvur edilemeyen mümteni' (imkânsız) şeylere benzettiler."], [1889.0, "Öyleyse bir mahzurdan kaçtılar ve onun benzerine, hatta ondan daha şiddetlisine düştüler."], [1895.5, "\"Allah ne vardır ne yoktur\" dersen, öyleyse O mümteni'dir."], [1898.0, "\"Allah ne diridir ne ölü\" dersen, öyleyse O mümteni'dir."], [1901.0, "\"Allah görmez ve kör de değildir\" dersen, öyleyse sen mümteni' bir şeyi vasıflandırıyorsun."]]}, {"reader": false, "ar": [[1912.0, "فلمّا أخذ أهلُ السنة بحلوقهم وألزموهم بهذا الإلزام،"], [1917.3, "أجابوا بجوابٍ أوقعهم في شرٍّ من ذلك؛"], [1925.0, "فقالوا: إنّ سلب صفتَي النقيض يلزم [منه] الوصفُ بالعدم إذا كان المسلوبُ عنه صالحًا لأحد الصفتين."], [1939.0, "بمعنى أنني لو قلت بأنّ الجدار لا يسمع وليس بأصمّ،"], [1945.6, "فلا يكون ذلك وصفًا للجدار بالامتناع،"], [1954.0, "لأنني سلبتُ صفتَي النقيض عمّن ليس قابلًا لهما أصلًا."], [1958.0, "وإذا قلتُ بأنّ الله عز وجل ليس بحيٍّ ولا بميّت،"], [1969.0, "فلا يلزم من ذلك وصفُه بالامتناع ـ انتبه ـ لأنني لو قلت بأنّ الجدار ليس بحيٍّ ولا بميّت،"], [1980.0, "فلا يلزم من ذلك أن يكون الجدار ممتنعًا،"], [1983.0, "لأنّ الجدار أصلًا لا يقبل أن يكون حيًّا ولا يقبل أن يكون ميّتًا."]], "tr": [[1912.0, "Ehl-i Sünnet onların boğazlarından yakalayıp onları bu ilzamla ilzam edince, onları bundan daha kötüsüne düşüren bir cevap verdiler."], [1925.0, "Dediler ki: \"İki nakîz sıfatı soymak, kendisinden soyulan şey iki sıfattan birine elverişli olduğu takdirde yoklukla vasıflandırmayı gerektirir.\" Yani \"Duvar işitmez ve sağır da değildir\" desem, bu duvarı imkânsızlıkla vasıflandırmak olmaz;"], [1948.3, "çünkü iki nakîz sıfatı onları aslen kabul etmeyen bir şeyden soymuşumdur."], [1958.0, "\"Allah Azze ve Celle ne diridir ne ölü\" dersem, bundan O'nu imkânsızlıkla vasıflandırmak lâzım gelmez —dikkat et—;"], [1975.3, "çünkü \"Duvar ne diridir ne ölü\" desem, bundan duvarın mümteni' olması lâzım gelmez."], [1982.6, "Zira duvar aslen ne diri olmayı kabul eder ne de ölü olmayı."]]}, {"reader": false, "ar": [[1989.0, "قلنا: وقعتم في شرٍّ من قولكم الأول،"], [1994.0, "وهي أنكم تجعلون الله عز وجل مسلوبَ صفتَي النقيض لأنه ليس محلًّا صالحًا لاتّصافه بأحدهما،"], [2006.0, "فوصفتموه بالممتنعات التي هي من جنس الجمادات فيما لو تُصُوِّر وجودُها."], [2013.0, "وهكذا لا يفرّون من شيءٍ إلا ويقعون في نظيره أو في أشدّ منه."]], "tr": [[1989.0, "Dedik ki: \"İlk sözünüzden daha kötüsüne düştünüz."], [1994.6, "O da şudur: Allah Azze ve Celle'yi, ikisinden biriyle vasıflanmaya elverişli bir mahal olmadığı için iki nakîz sıfattan soyulmuş kılıyorsunuz."], [2013.0, "Böylece O'nu —varlıkları tasavvur edilse bile— cansızlar cinsinden olan mümteni' şeylerle vasıflandırdınız.\" İşte böyle, bir şeyden kaçtıklarında mutlaka onun benzerine veya ondan daha şiddetlisine düşerler."]]}, {"reader": false, "ar": [[2020.0, "وإذا قال لك الأشعريُّ مثلًا:"], [2025.0, "لا يمكن أن أصف الله بالرحمة،"], [2029.0, "وإنما المرادُ برحمته إرادةُ الثواب،"], [2034.0, "فقل: والمخلوق له إرادة؛"], [2038.0, "فإذن يلزمك أن تفرّ من قولك:"], [2042.3, "«إرادة الثواب»؛ لأنك فررتَ من الرحمة خوفًا من مماثلة رحمة الله برحمة خلقه،"], [2049.0, "إلى إرادة الثواب التي يلزمك فيها نظيرُ ما يلزمك في الأمر الذي فررتَ منه."], [2060.0, "ولذلك لا سلامةَ في هذا الباب إلا أن نُثبت ما أثبته الله عز وجل لنفسه،"], [2068.0, "وأثبته له نبيُّه صلى الله عليه وسلم في صحيح سنّته."]], "tr": [[2020.0, "Eş'arî sana mesela \"Allah'ı rahmetle vasıflandırmam mümkün değildir;"], [2026.3, "O'nun rahmetinden maksat sevap vermeyi irade etmektir\" derse, de ki:"], [2034.8, "\"Mahlûkun da iradesi vardır. Öyleyse 'sevap vermeyi irade etmek' sözünden de kaçman gerekir."], [2042.3, "Çünkü sen Allah'ın rahmetinin mahlûkatının rahmetine benzemesinden korktuğun için rahmetten kaçıp 'sevap vermeyi irade etme'ye sığındın;"], [2049.5, "oysa onda da kaçtığın şeyde sana lâzım gelenin benzeri sana lâzım gelir.\" Bu sebeple bu babda selamet, ancak Allah Azze ve Celle'nin kendisi için isbat ettiğini ve Peygamberi sallallâhu aleyhi ve sellem'in sahih sünnetinde O'nun için isbat ettiğini isbat etmekle olur."]]}, {"reader": false, "ar": [[2075.0, "والذين قالوا: لا يجوز أن يوصف الله بصفة وجود،"], [2083.0, "ولكن لك الحقُّ الكامل أن تنفي عنه ما شئتَ من الصفات،"], [2086.0, "فقل: لا داخلَ العالم ولا خارجَه،"], [2089.4, "ولا فوق ولا تحت،"], [2091.6, "ولا يسمع <span class=\"q\">؟ 34:46<\/span> ولا يرى ولا يتكلّم،"], [2095.0, "لكن إيّاك أن تُثبت صفةً واحدة؛"], [2099.0, "فنقول لهم: ما المحذور الذي جعلكم تفرّون من صفات الإثبات؟"], [2105.0, "فيقولون: لأننا لو أثبتنا له صفةً واحدةً لشبّهناه بالموجودات،"], [2116.0, "والله <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>."]], "tr": [[2075.0, "\"Allah'ın bir varlık sıfatıyla vasıflanması caiz değildir;"], [2080.0, "fakat O'ndan dilediğin sıfatları nefyetmeye tam hakkın vardır."], [2084.6, "'Ne âlemin içindedir ne dışında;"], [2086.6, "ne yukarıdadır ne aşağıda; ne işitir <span class=\"q\">؟<\/span> ne görür ne de konuşur' de;"], [2092.8, "fakat sakın tek bir sıfat isbat etme!\" diyenlere de deriz ki:"], [2099.0, "\"Sizi isbat sıfatlarından kaçmaya sevk eden mahzur nedir?\" Derler ki:"], [2105.0, "\"Çünkü O'na tek bir sıfat isbat etseydik O'nu var olanlara benzetmiş olurduk;"], [2110.0, "Allah ise <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11].\""]]}, {"reader": false, "ar": [[2118.0, "فنقول: أيضًا يلزمكم ـ انتبه ـ يلزمكم فيما فررتم منه نظيرُ ما يلزمكم فيما أثبتّموه؛"], [2130.0, "فإنكم لَتنفون عن الله عز وجل الصفاتِ كلَّها،"], [2134.0, "وإذا أردتُ أن أصف معدومًا فإنني أنفي عنه كلَّ الصفات."], [2140.0, "ففررتم من تشبيهه بالموجودات،"], [2144.0, "ووقعتم في تشبيهه بالمعدومات،"], [2147.0, "مع ما يلزمهم من التعطيل والتحريف الذي ألزموا أنفسهم به."], [2156.0, "أنتم معي في هذا ولّا لا؟"]], "tr": [[2118.0, "Deriz ki: \"Size de lâzım gelir —dikkat et— kaçtığınız şeyde, isbat ettiğiniz şeyde size lâzım gelenin benzeri lâzım gelir."], [2130.0, "Çünkü siz Allah Azze ve Celle'den bütün sıfatları nefyediyorsunuz;"], [2133.5, "ben ise yok olan bir şeyi vasıflandırmak istesem ondan bütün sıfatları nefyederim."], [2140.0, "Böylece O'nu var olanlara benzetmekten kaçtınız ve O'nu yok olanlara benzetmeye düştünüz.\" Üstelik onlara, kendilerini mecbur bıraktıkları ta'til ve tahrif de lâzım gelir."], [2156.0, "Bu konuda benimle misiniz, değil misiniz?"]]}, {"reader": false, "ar": [[2159.0, "وهكذا في كلّ من خالف شيئًا من نصوص الكتاب والسنّة."], [2165.0, "ولذلك أقول لكم كلمةً احفظوها،"], [2167.9, "وهي: أنّ التناقض مبنيٌّ على مخالفة الحقّ؛"], [2172.0, "فكلُّ من خالف الحقَّ فلا بدّ أن يقع عنده شيءٌ من التناقض."], [2178.0, "فمن خالف الحقَّ المخالفةَ المطلقة وقع في التناقض المطلق،"], [2183.0, "وإلا فكلُّ واحدٍ عنده من التناقض بمقدار ما خالف به من الحقّ. والله أعلم."]], "tr": [[2159.0, "Kitap ve Sünnet naslarından bir şeye muhalefet eden herkes hakkında durum böyledir."], [2165.0, "Bu yüzden size bir söz söylüyorum, onu ezberleyin:"], [2168.5, "Çelişki, hakka muhalefet üzerine bina edilir."], [2172.0, "Hakka muhalefet eden herkeste mutlaka bir miktar çelişki meydana gelir."], [2178.0, "Hakka mutlak bir muhalefetle muhalefet eden mutlak çelişkiye düşer;"], [2182.4, "aksi hâlde her birinde, haktan muhalefet ettiği miktar kadar çelişki vardır. Allah en iyisini bilir."]]}]}, {"ts": "36:35", "title": "5. Külliye: Her isbatta tafsil tarafını galip tutarız", "paras": [{"reader": false, "ar": [[2195.0, "ومن الكلّيّات أيضًا: <b>كلُّ إثباتٍ فنُغلِّب فيه جانبَ التفصيل<\/b> ـ كلُّ إثباتٍ لله عز وجل فنُغلِّب فيه جانبَ التفصيل ـ <b>كلُّ إثباتٍ فنُغلِّب فيه جانبَ التفصيل.<\/b>"]], "tr": [[2195.0, "Külliyelerden biri de şudur: 5."], [2199.0, "külliye: Her isbatta tafsil (ayrıntılandırma) tarafını galip tutarız —Allah Azze ve Celle için yapılan her isbatta tafsil tarafını galip tutarız— Her isbatta tafsil tarafını galip tutarız."]]}, {"reader": false, "ar": [[2219.0, "أقول وبالله التوفيق: وهذه قاعدةٌ واضحة،"], [2224.0, "وهي: أنّ من كمالات الله عز وجل في باب إثبات الصفات أن تُفصِّل في هذه الصفات إثباتًا لله عز وجل."], [2235.0, "فالله عز وجل يحبّ في باب الكمال أن تُفصِّل؛"], [2239.0, "فإنّ ذلك كمالٌ في حقّ المخلوق لا نقصَ فيه،"], [2244.0, "والله عز وجل أحقُّ أن يوصف به."], [2246.0, "ولذلك تجد أنّ الله عز وجل في كتابه إذا أراد أن يُثبت الكمالاتِ له فإنه لا يقتصر على إثباتها إجمالًا،"], [2256.8, "وإنما يُفصِّلها، كقول الله عز وجل:"], [2260.7, "«إنّ الله عليمٌ حكيم»،"], [2263.3, "«سميعٌ بصير»، «عزيزٌ حكيم»،"], [2266.1, "«عليمٌ غفور»، «عليٌّ عظيم» <span class=\"q\">؟ 37:38<\/span>."]], "tr": [[2219.0, "Tevfik Allah'tandır, derim ki: Bu açık bir kaidedir."], [2224.5, "O da şudur: Sıfatları isbat babında Allah Azze ve Celle'nin kemalâtından biri, bu sıfatları Allah Azze ve Celle için isbat ederken tafsil etmendir."], [2235.0, "Allah Azze ve Celle kemal babında tafsil etmeni sever."], [2239.0, "Çünkü bu, mahlûkun hakkında bile içinde noksanlık olmayan bir kemaldir;"], [2243.4, "Allah Azze ve Celle ise onunla vasıflanmaya daha layıktır."], [2246.0, "Bu sebeple görürsün ki Allah Azze ve Celle Kitabı'nda kendisi için kemalâtı isbat etmek istediğinde onları icmalen isbat etmekle yetinmez, bilakis onları tafsil eder."], [2257.4, "Allah Azze ve Celle'nin \"Şüphesiz Allah alîmdir, hakîmdir\", \"semîdir, basîrdir\", \"azîzdir, hakîmdir\", \"alîmdir, gafûrdur\", \"aliyyüdür, azîmdir\" sözleri gibi <span class=\"q\">؟<\/span>."]]}, {"reader": false, "ar": [[2270.0, "بل اسمع إلى ذلك الإثبات العظيم في قول الله عز وجل في آخر سورة الحشر:"], [2274.0, "<span class=\"ayah\">﴿هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ ۖ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ ۖ هُوَ الرَّحْمَٰنُ الرَّحِيمُ ۝ هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ الْمَلِكُ الْقُدُّوسُ السَّلَامُ الْمُؤْمِنُ الْمُهَيْمِنُ الْعَزِيزُ الْجَبَّارُ الْمُتَكَبِّرُ ۚ سُبْحَانَ اللَّهِ عَمَّا يُشْرِكُونَ ۝ هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ ۖ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ ۚ يُسَبِّحُ لَهُ مَا فِي السَّمَاوَاتِ وَالْأَرْضِ ۖ وَهُوَ الْعَزِيزُ الْحَكِيمُ﴾<\/span> <span class=\"ref\">[الحشر: ٢٢–٢٤]<\/span>."], [2304.0, "وهذه طريقةُ الأدب مع الله عز وجل."]], "tr": [[2270.0, "Hatta Allah Azze ve Celle'nin Haşr sûresinin sonundaki sözünde geçen o büyük isbatı dinle:"], [2273.2, "<span class=\"ayah\">﴿O, kendisinden başka hiçbir ilah olmayan Allah'tır; gaybı da görüneni de bilendir. O, Rahmân'dır, Rahîm'dir. O, kendisinden başka hiçbir ilah olmayan Allah'tır; Melik'tir, Kuddûs'tür, Selâm'dır, Mü'min'dir, Müheymin'dir, Azîz'dir, Cebbâr'dır, Mütekebbir'dir. Allah, onların ortak koştukları şeylerden münezzehtir. O, yaratan, var eden, şekil veren Allah'tır. En güzel isimler O'nundur. Göklerde ve yerde olanlar O'nu tesbih eder. O, Azîz'dir, Hakîm'dir﴾<\/span> [Haşr 22–24]."], [2304.0, "İşte bu, Allah Azze ve Celle ile edebin yoludur."]]}, {"reader": false, "ar": [[2307.0, "بل إنك لو دخلتَ على ملكٍ من ملوك الدنيا،"], [2312.0, "وفصّلتَ في صفاته: كرمًا وشهامةً ووفاءً وشجاعةً ورجولةً،"], [2321.0, "وغير ذلك من صفات الكمال،"], [2324.0, "لكان ذلك أدعى لسرور قلبه،"], [2326.9, "وأشرحَ لصدره، وأدخلَ في بيان كمالاته."], [2331.0, "فالله عز وجل أحقُّ من المخلوق بذلك."], [2335.0, "ولكنني قلتُ في الكلّيّة كلمةً مهمّة،"], [2339.3, "وهي قوله: «فنُغلِّب»؛ وذلك لأنّ هذه الكلّيّة ليست كلّيّةً مطلقة،"], [2349.0, "وإنما هي كلّيّةٌ أغلبيّة."]], "tr": [[2307.0, "Hatta dünya krallarından birinin huzuruna girsen ve onun sıfatlarını —cömertlik, mertlik, vefa, cesaret, yiğitlik ve diğer kemal sıfatlarını— tafsil etsen, bu onun kalbini sevindirmeye daha elverişli, göğsünü daha çok ferahlatan ve kemalâtını açıklamaya daha uygun olurdu."], [2331.0, "Allah Azze ve Celle buna mahlûktan daha layıktır."], [2335.0, "Fakat ben külliyede önemli bir kelime söyledim;"], [2337.8, "o da \"galip tutarız\" sözüdür."], [2341.0, "Çünkü bu külliye mutlak bir külliye değil, ağlebî (çoğunlukla geçerli) bir külliyedir."]]}, {"reader": false, "ar": [[2352.0, "بمعنى أننا نجد في كتاب الله عز وجل إثباتًا مجملًا،"], [2359.0, "كقول الله عز وجل:"], [2361.2, "«وله الأسماء» <span class=\"ayah\">﴿أَيًّا مَّا تَدْعُوا فَلَهُ الْأَسْمَاءُ الْحُسْنَىٰ﴾<\/span> <span class=\"ref\">[الإسراء: ١١٠]<\/span>،"], [2365.0, "وقولِ الله عز وجل:"], [2367.0, "<span class=\"ayah\">﴿وَلَهُ الْمَثَلُ الْأَعْلَىٰ فِي السَّمَاوَاتِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[الروم: ٢٧]<\/span>،"], [2370.0, "وغير ذلك من الآيات."], [2372.0, "لكنّ الأغلب الأكثر في إثبات الكمالات هو التفصيل."]], "tr": [[2352.0, "Yani Allah Azze ve Celle'nin Kitabı'nda icmalî bir isbat da buluruz."], [2361.2, "Allah Azze ve Celle'nin \"İsimler O'nundur\" <span class=\"ayah\">﴿Hangisiyle dua ederseniz edin, en güzel isimler O'nundur﴾<\/span> [İsrâ 110] sözü ve <span class=\"ayah\">﴿Göklerde ve yerde en yüce sıfat O'nundur﴾<\/span> [Rûm 27] sözü ve benzeri ayetler gibi."], [2372.0, "Fakat kemalâtın isbatında en çok ve en yaygın olan tafsildir."]]}]}, {"ts": "39:37", "title": "6. Külliye: Her nefyde icmal tarafını galip tutarız", "paras": [{"reader": false, "ar": [[2377.0, "ويؤكّد ذلك الكلّيّةُ التي بعدها:"], [2380.0, "<b>كلُّ نفيٍ فنُغلِّب فيه جانبَ الإجمال.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ نفيٍ فنُغلِّب فيه جانبَ الإجمال.<\/b> كم رقمُها عندكم؟"]], "tr": [[2377.0, "Bunu, ondan sonraki külliye te'kid eder:"], [2380.0, "<b>6. külliye: Her nefyde icmal (toplu ifade) tarafını galip tutarız.<\/b> (Tekrar ediyor.) <b>Her nefyde icmal tarafını galip tutarız.<\/b> Sizde numarası kaç?"]]}, {"reader": false, "ar": [[2403.0, "أقول وبالله التوفيق: وهي كلّيّةٌ تُتمِّم لك ما مضى شرحُه في الكلّيّة التي قبلها،"], [2410.0, "وذلك من باب الأدب الذي جاء به الوحي؛"], [2414.0, "فإنّ الوحي في الأعمّ الأغلب إذا أراد أن ينفي صفاتِ النقص عن الله عز وجل فإنه لا يُفصِّل في نفي صفات النقص،"], [2424.0, "وإنما يُجملها، كقول الله عز وجل:"], [2427.2, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>، ولم يقل:"], [2430.9, "ليس كمثله أحدٌ من الملائكة ولا من الأنبياء،"], [2434.0, "وليس كمثله شيءٌ في كذا وفي كذا."], [2437.0, "وإنما أجمل لأنّ المقام مقامُ نفي النقائص،"], [2440.0, "وكمالُ الأدب فيها هو الإجمال."]], "tr": [[2403.0, "Tevfik Allah'tandır, derim ki: Bu, sana önceki külliyede şerhi geçen şeyi tamamlayan bir külliyedir."], [2411.0, "Bu, vahyin getirdiği edep babındandır."], [2414.0, "Çünkü vahiy, çoğunlukla Allah Azze ve Celle'den noksanlık sıfatlarını nefyetmek istediğinde, noksanlık sıfatlarının nefyinde tafsile girmez, bilakis onları icmal eder."], [2422.7, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11] sözü gibi."], [2430.9, "\"Meleklerden ve peygamberlerden hiç kimse O'nun benzeri değildir;"], [2433.3, "şu hususta ve bu hususta O'nun benzeri hiçbir şey yoktur\" dememiştir."], [2437.0, "İcmal etmiştir; çünkü makam noksanlıkları nefyetme makamıdır ve bunda edebin kemali icmaldir."]]}, {"reader": false, "ar": [[2445.0, "وكقول الله عز وجل:"], [2447.0, "<span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>،"], [2449.7, "أي: نظيرًا يستحقّ ما يستحقّه عز وجل من الكمالات،"], [2453.7, "وهذا من باب النفي المجمل."], [2456.0, "وكقول الله عز وجل:"], [2457.8, "<span class=\"ayah\">﴿فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ﴾<\/span> <span class=\"ref\">[النحل: ٧٤]<\/span>،"], [2459.7, "وهذا من باب النفي المجمل."], [2462.0, "وكقول الله عز وجل:"], [2464.0, "<span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [2466.5, "وهو من باب النفي المجمل."]], "tr": [[2445.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿O'na adaş (denk) birini biliyor musun?﴾<\/span> [Meryem 65] sözü gibi;"], [2450.3, "yani O Azze ve Celle'nin hak ettiği kemalâtı hak eden bir benzer."], [2456.0, "Bu, icmalî nefy babındandır. Allah Azze ve Celle'nin <span class=\"ayah\">﴿Allah'a misaller getirmeyin﴾<\/span> [Nahl 74] sözü gibi;"], [2460.2, "bu da icmalî nefy babındandır."], [2462.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4] sözü gibi;"], [2467.0, "bu da icmalî nefy babındandır."]]}, {"reader": false, "ar": [[2469.0, "ولأنّ الواحد منّا لو دخل على ملكٍ من ملوك الدنيا،"], [2473.7, "ثم فصّل في صفات النقص،"], [2477.0, "لعاقبه الملك؛ لأنّ التفصيل في مثل هذا الباب ليس ممّا ينبغي."], [2484.0, "فإذا كان التفصيل في صفات النقص من النقص الذي لا كمالَ فيه بالنسبة للمخلوق،"], [2491.0, "فالله عز وجل أحقُّ أن يُنزَّه عنه."], [2494.0, "إلا أنني قلتُ في الكلّيّة كلمةً مهمّة،"], [2499.0, "وهي قوله: «فنُغلِّب»؛ وذلك لأنّ القاعدة ـ هذه الكلّيّة ـ كلّيّةٌ أغلبيّة."]], "tr": [[2469.0, "Bir de birimiz dünya krallarından birinin huzuruna girip sonra (onun hakkında) noksanlık sıfatlarını tafsil etse, kral onu cezalandırırdı."], [2478.7, "Çünkü bu tür bir babda tafsil uygun olan şeylerden değildir."], [2484.0, "Noksanlık sıfatlarında tafsil, mahlûk açısından bile içinde hiçbir kemal bulunmayan bir noksanlık olduğuna göre, Allah Azze ve Celle ondan tenzih edilmeye daha layıktır."], [2494.0, "Ancak ben külliyede önemli bir kelime söyledim;"], [2497.5, "o da \"galip tutarız\" sözüdür."], [2501.0, "Çünkü kaide —bu külliye— ağlebî bir külliyedir."]]}, {"reader": false, "ar": [[2509.0, "بمعنى أننا يمكن أن نجد شيئًا من النفي المفصَّل،"], [2514.0, "لكنّ الله عز وجل من حكمته أن يُفصِّل في هذا النفي بخصوصه من باب الردّ على من وصفه عز وجل به،"], [2524.0, "كقول الله عز وجل:"], [2525.0, "<span class=\"ayah\">﴿وَقُلِ الْحَمْدُ لِلَّهِ الَّذِي لَمْ يَتَّخِذْ وَلَدًا وَلَمْ يَكُن لَّهُ شَرِيكٌ فِي الْمُلْكِ وَلَمْ يَكُن لَّهُ وَلِيٌّ مِّنَ الذُّلِّ﴾<\/span> <span class=\"ref\">[الإسراء: ١١١]<\/span>،"], [2535.0, "فهذا نفيٌ مفصَّل؛ لأنّ هناك من الطوائف والأمم من وصفت الله عز وجل بشيءٍ من ذلك."], [2541.0, "وكقوله عز وجل: <span class=\"ayah\">﴿لَمْ يَلِدْ وَلَمْ يُولَدْ﴾<\/span> <span class=\"ref\">[الإخلاص: ٣]<\/span>،"], [2545.0, "هذا من النفي المفصَّل،"], [2547.0, "ردًّا على من وصف الله عز وجل بشيءٍ من ذلك."], [2551.0, "وكقوله عز وجل: <span class=\"ayah\">﴿مَا اتَّخَذَ صَاحِبَةً وَلَا وَلَدًا﴾<\/span> <span class=\"ref\">[الجن: ٣]<\/span>،"], [2555.0, "وهذا من النفي المفصَّل،"], [2556.0, "من باب الردّ على من وصف الله عز وجل بشيءٍ من ذلك."], [2562.0, "وأظنّ الكلامَ واضحًا إن شاء الله."]], "tr": [[2509.0, "Yani bir miktar tafsilli nefy de bulabiliriz."], [2514.0, "Fakat Allah Azze ve Celle'nin hikmetindendir ki O'nu bununla vasıflandıranlara reddiye olarak özellikle bu nefyi tafsil eder."], [2525.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿De ki: Hamd, çocuk edinmeyen, mülkünde ortağı olmayan ve zillet sebebiyle bir yardımcıya ihtiyacı olmayan Allah'adır﴾<\/span> [İsrâ 111] sözü gibi."], [2536.0, "Bu tafsilli bir nefydir; çünkü fırkalardan ve ümmetlerden Allah Azze ve Celle'yi bunlardan bir şeyle vasıflandıranlar vardır."], [2543.0, "O Azze ve Celle'nin <span class=\"ayah\">﴿O doğurmamış ve doğurulmamıştır﴾<\/span> [İhlâs 3] sözü gibi;"], [2547.4, "bu da Allah Azze ve Celle'yi bunlardan bir şeyle vasıflandıranlara reddiye olarak tafsilli nefydendir."], [2552.0, "O Azze ve Celle'nin <span class=\"ayah\">﴿O, ne bir eş ne de bir çocuk edinmiştir﴾<\/span> [Cin 3] sözü gibi;"], [2557.7, "bu da Allah Azze ve Celle'yi bunlardan bir şeyle vasıflandıranlara reddiye babından tafsilli nefydendir. Zannederim söz inşallah açıktır."]]}]}, {"ts": "42:46", "title": "7. Külliye: O'nun zâtından ayrılmayan her sıfat zâtîdir", "paras": [{"reader": false, "ar": [[2566.0, "ومن الكلّيّات أيضًا: <b>كلُّ صفةٍ لا تنفكّ عن ذاته فذاتيّة.<\/b>"]], "tr": [[2566.0, "Külliyelerden biri de şudur: 7."], [2567.7, "külliye: O'nun zâtından ayrılmayan her sıfat zâtîdir."]]}, {"reader": false, "ar": [[2587.0, "أقول وبالله التوفيق: وذلك لأنّ أهل السنة والجماعة قد أجمعت كلمتُهم على تقسيم الصفات الواردة في الكتاب والسنّة لله عز وجل إلى هذين القسمين:"], [2600.0, "إلى صفاتٍ ذاتيّة، وإلى صفاتٍ فعليّة."], [2604.0, "وكلّيّتُنا هذه تتعلّق بالقسم الأول،"], [2607.0, "وهي الصفات الذاتيّة. وضابطُها:"], [2609.7, "أنها من الصفات التي يتّصف الله عز وجل بها أزلًا فيما لا أوّلَ له،"], [2619.0, "وأبدًا فيما لا آخريّةَ له؛"], [2624.0, "كعلوّه، فإنه من صفاته الملازمة لذاته،"], [2629.0, "وكحياته، فإنها من صفاته الملازمة لذاته،"], [2633.0, "وكسمعه وبصره، ووجهه وعينه ويده وساقه ورجله،"], [2637.8, "وقوّته وقدرته، وغير ذلك؛"], [2649.0, "فإنها من الصفات الملازمة للذات أزلًا وأبدًا."]], "tr": [[2587.0, "Tevfik Allah'tandır, derim ki: Bu böyledir;"], [2589.1, "çünkü Ehl-i Sünnet ve'l-Cemaat, Kitap ve Sünnet'te Allah Azze ve Celle için varid olan sıfatları şu iki kısma ayırmakta söz birliği etmiştir:"], [2600.0, "Zâtî sıfatlar ve fiilî sıfatlar."], [2604.0, "Bu külliyemiz birinci kısımla, yani zâtî sıfatlarla ilgilidir."], [2609.0, "Bunun zâbıtı şudur: Bunlar, Allah Azze ve Celle'nin evveli olmayan ezelde ve sonu olmayan ebedde vasıflandığı sıfatlardandır."], [2617.2, "O'nun uluvvü (yüceliği) gibi; bu, O'nun zâtına mülâzım (ondan ayrılmayan) sıfatlarındandır."], [2624.0, "Hayatı gibi; bu da O'nun zâtına mülâzım sıfatlarındandır."], [2630.3, "İşitmesi, görmesi, yüzü, gözü, eli, incik (sâk), ayağı, kuvveti, kudreti ve benzerleri gibi;"], [2649.0, "bunlar ezelen ve ebeden zâta mülâzım sıfatlardandır."]]}, {"reader": false, "ar": [[2655.0, "وهناك ضابطٌ آخر فيها،"], [2657.7, "وهي: أنّ كلَّ صفةٍ لا يصحّ اتّصافُ الله بنقيضها فصفةُ ذات ـ كلُّ صفةٍ لا يصحّ اتّصافُ الله عز وجل بنقيضها فصفةُ ذات."], [2673.0, "فنقيضُ الحياة الموتُ، والله لا يصحّ اتّصافُه به،"], [2678.5, "فالحياة صفةُ ذات. ونقيضُ السمع الصممُ،"], [2683.1, "ولا يصحّ اتّصافُ الله به،"], [2686.5, "فالسمع صفةٌ ذاتيّة. ونقيضُ العلوّ السُّفلُ،"], [2693.2, "والسُّفلُ نقص، فالعلوّ صفةٌ ذاتيّة."], [2700.0, "فكلُّ صفةٍ لا يصحّ اتّصافُ الله بنقيضها فهي من صفات ذاته."]], "tr": [[2655.0, "Bunda bir zâbıt daha vardır;"], [2658.3, "o da şudur: Allah'ın nakîziyle vasıflanması sahih olmayan her sıfat, zât sıfatıdır —Allah Azze ve Celle'nin nakîziyle vasıflanması sahih olmayan her sıfat, zât sıfatıdır."], [2673.0, "Hayatın nakîzi ölümdür; Allah'ın onunla vasıflanması sahih değildir;"], [2677.1, "öyleyse hayat bir zât sıfatıdır."], [2681.0, "İşitmenin nakîzi sağırlıktır; Allah'ın onunla vasıflanması sahih değildir;"], [2685.1, "öyleyse işitme zâtî bir sıfattır."], [2691.0, "Uluvvün nakîzi aşağıda olmaktır; aşağıda olmak ise noksanlıktır;"], [2700.0, "öyleyse uluv zâtî bir sıfattır."], [2701.6, "Allah'ın nakîziyle vasıflanması sahih olmayan her sıfat, O'nun zâtının sıfatlarındandır."]]}]}, {"ts": "45:06", "title": "8. Külliye: O'nun meşîetine bağlı her sıfat fiilîdir · 9. Külliye: Fiilî sıfatların hepsi, onlara kudretin aslı itibarıyla zâtîdir", "paras": [{"reader": false, "ar": [[2706.0, "ويُوضّح ذلك الكلّيّةُ التي بعدها:"], [2709.5, "<b>كلُّ صفةٍ متعلّقةٍ بمشيئته ففعليّة.<\/b> كلُّ صفةٍ متعلّقةٍ بمشيئته ـ الهمزة على نبرة ـ بمشيئته ففعليّة."], [2727.0, "<b>كلُّ صفةٍ متعلّقةٍ بمشيئته ففعليّة.<\/b>"]], "tr": [[2706.0, "Bunu, ondan sonraki külliye açıklar: <b>8. külliye: O'nun meşîetine (dilemesine) bağlı her sıfat fiilîdir.<\/b> O'nun meşîetine bağlı her sıfat —(«مشيئته» kelimesinde) hemze nebre (dişli harf) üzerindedir— meşîetine bağlı her sıfat fiilîdir. <b>8. külliye: O'nun meşîetine bağlı her sıfat fiilîdir.<\/b>"]]}, {"reader": false, "ar": [[2733.0, "وهي تلك الصفات ـ أقول وبالله التوفيق ـ وهي تلك الصفات التي متى ما شاء الله عز وجل فعلها،"], [2741.1, "ومتى ما شاء لم يفعلها؛"], [2743.0, "كنزوله إلى السماء الدنيا،"], [2744.8, "ليس من الصفات الملازمة لذاته،"], [2747.0, "بل من الصفات المتعلّقة بمشيئته وفعله."], [2750.0, "وكرضاه، فليس من الصفات الملازمة لذاته،"], [2755.0, "وإنما من الصفات التي إن شاء فعلها وإن شاء لم يفعلها."], [2759.0, "وكغضبه ومقته وكراهيته، واستوائه على عرشه،"], [2767.7, "وإتيانه ومجيئه يوم القيامة،"], [2770.7, "وغير ذلك؛ فكلُّ ذلك لو تأمّلتَه لوجدتَه من الصفات التي ليست ملازمةً للذات أزلًا وأبدًا،"], [2779.0, "وإنما من الصفات المتعلّقة بمشيئته؛"], [2782.4, "فمتى ما شاء فعلها،"], [2785.1, "ومتى ما شاء تركها،"], [2788.0, "والله عز وجل لا مُكرِهَ له."]], "tr": [[2733.0, "Bunlar —tevfik Allah'tandır, derim ki— Allah Azze ve Celle'nin dilediği zaman yaptığı, dilediği zaman yapmadığı sıfatlardır."], [2743.0, "Dünya semasına nüzulü gibi; bu, O'nun zâtına mülâzım sıfatlardan değil, bilakis meşîetine ve fiiline bağlı sıfatlardandır."], [2750.0, "Rızası gibi; bu da O'nun zâtına mülâzım sıfatlardan değil, dilerse yaptığı, dilerse yapmadığı sıfatlardandır."], [2757.9, "Gazabı, buğzu (makt), kerâheti (hoşlanmaması), Arş'ına istivâsı, kıyamet günü gelmesi ve teşrifi ve benzerleri gibi."], [2773.0, "Bunların hepsini düşünürsen, ezelen ve ebeden zâta mülâzım olmayan, bilakis O'nun meşîetine bağlı sıfatlardan olduğunu görürsün;"], [2782.4, "dilediği zaman onu yapar, dilediği zaman terk eder."], [2787.1, "Allah Azze ve Celle'yi zorlayan hiç kimse yoktur."]]}, {"reader": false, "ar": [[2790.7, "ويُوضّح ذلك الكلّيّةُ التي بعدها:"], [2793.0, "<b>كلُّ الصفات الفعليّة ذاتيّةٌ باعتبار أصل القدرة عليها وعدم العجز عنها متى شاء.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [2825.0, "<b>كلُّ الصفات الفعليّة ذاتيّةٌ<\/b> ـ مَن يقول؟"], [2831.0, "<span class=\"q\">؟ 47:05<\/span> ـ <b>باعتبار أصل القدرة عليها وعدم العجز عنها متى شاء.<\/b>"]], "tr": [[2790.7, "Bunu, ondan sonraki külliye açıklar:"], [2793.0, "<b>9. külliye: Fiilî sıfatların hepsi, onlara kudretin aslı ve dilediği zaman onlardan âciz olmaması itibarıyla zâtîdir.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [2825.0, "<b>9. külliye: Fiilî sıfatların hepsi zâtîdir<\/b> —kim söyler?"], [2831.0, "<span class=\"q\">؟<\/span>— <b>onlara kudretin aslı ve dilediği zaman onlardan âciz olmaması itibarıyla.<\/b>"]]}, {"reader": false, "ar": [[2836.0, "أقول وبالله التوفيق: ومثالُ ذلك صفةُ الكلام؛"], [2844.0, "فإنّ أصل القدرة على أن يتكلّم متى شاء صفةٌ ذاتيّة،"], [2851.0, "لكن إذا تكلّم الله عز وجل بالشيء صار الكلامُ صفةً فعليّة؛"], [2856.0, "فهو فعليٌّ باعتبار آحاده،"], [2858.8, "وذاتيٌّ باعتبار أصل القدرة عليه."], [2863.0, "وكالغضب؛ فإنّ الله عز وجل قادرٌ على أن يغضب متى شاء،"], [2873.0, "فأصلُ القدرة على الغضب ذاتيّ،"], [2878.0, "لكن إذا وقع الغضبُ من الله عز وجل على من شاء في أيّ وقتٍ شاء،"], [2884.0, "صار غضبُه موصوفًا بأنه صفةٌ فعليّة؛"], [2888.0, "فآحادُ الغضب فعليّ، وأصلُ القدرة عليه متى شاء ذاتيّ."]], "tr": [[2836.0, "Tevfik Allah'tandır, derim ki: Bunun örneği kelâm sıfatıdır."], [2844.0, "Dilediği zaman konuşmaya kudretin aslı zâtî bir sıfattır;"], [2849.6, "fakat Allah Azze ve Celle bir şeyi konuştuğunda kelâm fiilî bir sıfat olur."], [2856.0, "O, tek tek fertleri (âhâdı) itibarıyla fiilî, ona kudretin aslı itibarıyla zâtîdir."], [2863.0, "Gazap gibi; Allah Azze ve Celle dilediği zaman gazaplanmaya kâdirdir;"], [2873.0, "gazaba kudretin aslı zâtîdir. Fakat Allah Azze ve Celle'den gazap, dilediği vakitte dilediği kimseye vâki olduğunda, O'nun gazabı fiilî bir sıfat olmakla nitelenir."], [2888.0, "Gazabın fertleri fiilîdir; dilediği zaman ona kudretin aslı ise zâtîdir."]]}, {"reader": false, "ar": [[2897.0, "وكصفة النزول؛ فإنّ الله عز وجل قادرٌ القدرةَ التامّةَ الكاملة على أن ينزل متى شاء،"], [2908.0, "لكن إذا نزل في ثلث الليل الآخر صار النزولُ صفةً فعليّة؛"], [2913.0, "فآحادُ النزول فعليّ، وأصلُ كمال القدرة عليه متى شاء ذاتيّ."], [2918.0, "وهذا ليس في صفة الكلام [فقط] كما يُمثِّل به بعضُ أهل السنة ـ أو كثيرٌ من أهل السنة ـ بل نقوله في كلّ صفةٍ فعليّة؛"], [2932.0, "فإننا إذا نظرنا إلى أصل كمال قدرة الله عز وجل عليها في أن يفعلها متى شاء ـ بمعنى أنه ليس بعاجزٍ عنها ـ فإننا نصفها بأنها صفةُ ذات،"], [2944.0, "ولكن إذا وقعت من الله عز وجل على الوجه اللائق به،"], [2948.4, "في أيّ زمانٍ شاء،"], [2950.0, "وفي أيّ مكانٍ شاء،"], [2952.0, "وعلى أيّ شخصٍ شاء،"], [2954.0, "فإنها حينئذٍ تُوصَف بأنها فعليّة."]], "tr": [[2897.0, "Nüzul sıfatı gibi; Allah Azze ve Celle dilediği zaman inmeye tam ve kâmil bir kudretle kâdirdir."], [2908.0, "Fakat gecenin son üçte birinde indiğinde nüzul fiilî bir sıfat olur."], [2913.0, "Nüzulün fertleri fiilîdir; dilediği zaman ona kudretin kemalinin aslı ise zâtîdir."], [2918.0, "Bu, Ehl-i Sünnet'ten bazılarının —veya Ehl-i Sünnet'ten çoğunun— örnek verdiği gibi (yalnız) kelâm sıfatında değildir;"], [2926.4, "bilakis bunu her fiilî sıfatta söyleriz."], [2932.0, "Çünkü Allah Azze ve Celle'nin onu dilediği zaman yapmaya kudretinin kemalinin aslına baktığımızda —yani O'nun ondan âciz olmadığı manasında— onu zât sıfatı olmakla nitelendiririz."], [2944.4, "Fakat Allah Azze ve Celle'den, O'na layık olan şekilde, dilediği zamanda, dilediği mekânda ve dilediği kişiye vâki olduğunda, o zaman fiilî olmakla nitelenir."]]}, {"reader": false, "ar": [[2957.0, "فيصدق على الصفات الفعليّة قولُنا:"], [2960.0, "الصفاتُ الفعليّة حادثةٌ باعتبار آحادها،"], [2967.0, "وذاتيّةٌ باعتبار أصل القدرة عليها."], [2972.5, "وأظنّ الكلامَ واضحًا، والله أعلم."]], "tr": [[2957.0, "Böylece fiilî sıfatlar hakkında şu sözümüz doğru olur:"], [2960.0, "Fiilî sıfatlar, fertleri itibarıyla hâdistir (sonradan meydana gelir), onlara kudretin aslı itibarıyla ise zâtîdir."], [2972.5, "Zannederim söz açıktır. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[2975.0, "وصلّى الله وسلّم على نبيّنا محمّدٍ، وعلى آله وصحبه."]], "tr": [[2975.0, "Allah, Peygamberimiz Muhammed'e, âline ve ashâbına salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

let cur=0,ia=-1,it=-1,player=null;

function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
