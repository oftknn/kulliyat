const D={"no": 12, "vid": "h8muQumZ4Bg", "title_ar": "الدرس (١٢) من شرح كليات العقيدة — تابع: كليات في توحيد الربوبية", "title_tr": "Şerhu Külliyyâti'l-Akîde — 12. Ders: Rubûbiyyet Tevhidine Dair Külliyeler (Tenzih, Mahlûkun Aczi, Âlemin Hudûsu, Hayır ve Şer, Fazl ve Adl, Kudret)", "sections": [{"ts": "00:00", "title": "1. Külliye: Rubûbiyyet ve ulûhiyyetin kemaline aykırı her şeyden Allah tenzih edilir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.3, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.8, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.7, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [12.2, "فلا نزال في سياق شرح كلّيّات توحيد الربوبية،"], [16.8, "وما يتعلّق بها من مسائلَ وتفاصيلَ وأصولٍ وقواعد."], [21.4, "وعندنا في هذا الدرس جُمَلٌ من الكلّيّات،"], [25.5, "نبدؤها بالكلّيّة الأولى، تقول هذه الكلّيّة:"], [28.9, "<b>كلُّ ما يتنافى مع كمال الربوبية والألوهية فيجب تنزيهُ الله عنه.<\/b> كلُّ ما يتنافى مع كمال الربوبية والألوهية فيجب تنزيه الله عنه."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.3, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [12.2, "Hâlâ rubûbiyyet tevhidi külliyelerinin ve onlarla ilgili meselelerin, ayrıntıların, usûlün ve kaidelerin şerhi bağlamındayız."], [21.4, "Bu derste birkaç külliyemiz var;"], [25.5, "onlara birinci külliye ile başlıyoruz."], [28.9, "Bu külliye der ki: 1."], [28.9, "külliye: Rubûbiyyet ve ulûhiyyetin kemaline aykırı olan her şeyden Allah'ı tenzih etmek vâciptir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[43.0, "بمعنى أنه لا يجوز في حقّ الله عز وجل أن يوصف به أو يُنسب إليه،"], [50.0, "وذلك لقول الله عز وجل:"], [52.0, "<span class=\"ayah\">﴿وَلَهُ الْمَثَلُ الْأَعْلَىٰ فِي السَّمَاوَاتِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[الروم: ٢٧]<\/span>."], [56.0, "فجميعُ ما يتنافى مع كمال ربوبيته أو ألوهيته عز وجل فالواجب علينا أن ننزّه الله عز وجل عنه،"], [66.0, "كما نزّه نفسه عن كثيرٍ مما نُسب إليه أو وُصف به في كتابه بقوله:"], [74.6, "«سبحان الله»، «سبحان ربك»."], [77.0, "وكلُّ كلمة «سبحان» في القرآن فهي تعظيمٌ وتنزيهٌ عمّا لا يليق."]], "tr": [[43.0, "Yani bununla Allah Azze ve Celle'nin nitelenmesi ya da bunun O'na nispet edilmesi, O'nun hakkında caiz değildir."], [50.0, "Bunun delili Allah Azze ve Celle'nin şu sözüdür:"], [52.0, "<span class=\"ayah\">﴿Göklerde ve yerde en yüce sıfat O'nundur﴾<\/span> [Rûm 27]."], [52.0, "O'nun rubûbiyyetinin veya ulûhiyyetinin kemaline aykırı olan her şeyden Allah Azze ve Celle'yi tenzih etmemiz vâciptir;"], [56.0, "nitekim O da Kitabı'nda kendisine nispet edilen ya da kendisinin nitelendiği birçok şeyden \"Sübhânallah\", \"Sübhâne rabbike\" sözleriyle kendini tenzih etmiştir."], [77.0, "Kur'an'daki her \"sübhân\" kelimesi, (Allah'ı) yakışmayan şeylerden yüceltme ve tenzihtir."]]}, {"reader": false, "ar": [[83.0, "فقد نزّه نفسه عن شرك المشركين في قوله:"], [88.3, "<span class=\"ayah\">﴿فَتَعَالَى اللَّهُ عَمَّا يُشْرِكُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٩٠]<\/span>،"], [91.0, "وفي قوله عز وجل:"], [93.4, "<span class=\"ayah\">﴿سُبْحَانَ رَبِّكَ رَبِّ الْعِزَّةِ عَمَّا يَصِفُونَ ۝ وَسَلَامٌ عَلَى الْمُرْسَلِينَ ۝ وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ﴾<\/span> <span class=\"ref\">[الصافات: ١٨٠–١٨٢]<\/span>."], [102.0, "وكذلك قال الله عز وجل:"], [105.6, "<span class=\"ayah\">﴿سُبْحَانَ اللَّهِ عَمَّا يَصِفُونَ﴾<\/span> <span class=\"ref\">[المؤمنون: ٩١]<\/span>."], [109.0, "وقال الله عز وجل:"], [111.2, "<span class=\"ayah\">﴿لَوْ كَانَ فِيهِمَا آلِهَةٌ إِلَّا اللَّهُ لَفَسَدَتَا ۚ فَسُبْحَانَ اللَّهِ رَبِّ الْعَرْشِ عَمَّا يَصِفُونَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٢]<\/span>،"], [120.0, "<span class=\"ayah\">﴿وَقَالُوا اتَّخَذَ اللَّهُ وَلَدًا ۗ سُبْحَانَهُ﴾<\/span> <span class=\"ref\">[البقرة: ١١٦]<\/span>."]], "tr": [[83.0, "Allah, müşriklerin şirkinden kendini şu sözüyle tenzih etmiştir:"], [88.3, "<span class=\"ayah\">﴿Allah onların ortak koştuklarından yücedir﴾<\/span> [A'râf 190]."], [91.0, "Allah Azze ve Celle'nin şu sözüyle de:"], [93.4, "<span class=\"ayah\">﴿İzzet sahibi Rabbin, onların nitelendirmelerinden münezzehtir. Selâm, gönderilen peygamberlere olsun. Hamd, âlemlerin Rabbi Allah'adır﴾<\/span> [Sâffât 180–182]."], [93.4, "Aynı şekilde Allah Azze ve Celle şöyle buyurmuştur:"], [105.6, "<span class=\"ayah\">﴿Allah, onların nitelendirmelerinden münezzehtir﴾<\/span> [Mü'minûn 91]."], [109.0, "Allah Azze ve Celle şöyle de buyurmuştur:"], [111.2, "<span class=\"ayah\">﴿Eğer yerde ve gökte Allah'tan başka ilahlar olsaydı, ikisi de bozulup giderdi. Arş'ın Rabbi olan Allah, onların nitelendirmelerinden münezzehtir﴾<\/span> [Enbiyâ 22]."], [120.0, "<span class=\"ayah\">﴿\"Allah çocuk edindi\" dediler. O bundan münezzehtir﴾<\/span> [Bakara 116]."]]}, {"reader": false, "ar": [[125.0, "وهذا يتكرّر كثيرًا في القرآن،"], [128.0, "مما يجعلنا نقرّر هذه الكلّيّة؛"], [131.0, "فإننا نرى أنّ من منهج القرآن وجوبَ تنزيه الله عز وجل عن كلّ ما يتنافى مع كمال ربوبيته وألوهيته."], [141.0, "وإنّ من أعظم الطوائف وصفًا لله عز وجل بما لا يليق:"], [146.5, "اليهود ـ عليهم لعائنُ الله المتتابعة ـ كما حكى الله عنهم ذلك في مواضعَ متعددةٍ من كتابه،"], [153.0, "كما في قوله عز وجل:"], [155.0, "<span class=\"ayah\">﴿لَّقَدْ سَمِعَ اللَّهُ قَوْلَ الَّذِينَ قَالُوا إِنَّ اللَّهَ فَقِيرٌ وَنَحْنُ أَغْنِيَاءُ ۘ سَنَكْتُبُ مَا قَالُوا وَقَتْلَهُمُ الْأَنبِيَاءَ بِغَيْرِ حَقٍّ﴾<\/span> <span class=\"ref\">[آل عمران: ١٨١]<\/span>،"], [166.0, "وهذا من تنزيهه عمّا قالوا."]], "tr": [[125.0, "Bu, Kur'an'da çokça tekrar eder;"], [125.0, "bu da bizi bu külliyeyi takrir etmeye götürür."], [128.0, "Çünkü görüyoruz ki Allah Azze ve Celle'yi rubûbiyyetinin ve ulûhiyyetinin kemaline aykırı her şeyden tenzih etmenin vâcip oluşu, Kur'an'ın metodundandır."], [141.0, "Allah Azze ve Celle'yi yakışmayan şeylerle en çok niteleyen taifelerden biri Yahudilerdir —Allah'ın ardı ardına lanetleri üzerlerine olsun—."], [146.5, "Nitekim Allah Kitabı'nın birçok yerinde bunu onlardan nakletmiştir;"], [155.0, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [155.0, "<span class=\"ayah\">﴿\"Allah fakirdir, biz zenginiz\" diyenlerin sözünü Allah elbette işitmiştir. Onların söylediklerini ve haksız yere peygamberleri öldürmelerini yazacağız﴾<\/span> [Âl-i İmrân 181]."], [155.0, "Bu, O'nun onların söylediklerinden kendini tenzihidir."]]}, {"reader": false, "ar": [[169.0, "وقال الله عز وجل عنهم:"], [172.5, "<span class=\"ayah\">﴿وَقَالَتِ الْيَهُودُ يَدُ اللَّهِ مَغْلُولَةٌ﴾<\/span>،"], [176.0, "فردّ عليهم بقوله: <span class=\"ayah\">﴿غُلَّتْ أَيْدِيهِمْ وَلُعِنُوا بِمَا قَالُوا﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span>."], [181.0, "ويقول الله عز وجل في مواضعَ كثيرةٍ عن اليهود بأنهم يصفونه بالصفات التي لا تليق بمقام ربوبيته ولا ألوهيته."], [194.0, "فاليهود من أكثر الطوائف وصفًا لله عز وجل بما لا يليق،"], [199.0, "بل من جملة ما وصفوا الله به أنهم وصفوه بالتعب،"], [203.3, "كما في التوراة المحرّفة؛"], [205.0, "فإنهم ينصّون فيها أن الله عز وجل لمّا فرغ من خلق الخلق استراح."], [214.0, "وقد نزّه الله عز وجل نفسه عن ذلك في قوله:"], [219.0, "<span class=\"ayah\">﴿وَلَقَدْ خَلَقْنَا السَّمَاوَاتِ وَالْأَرْضَ وَمَا بَيْنَهُمَا فِي سِتَّةِ أَيَّامٍ وَمَا مَسَّنَا مِن لُّغُوبٍ﴾<\/span> <span class=\"ref\">[ق: ٣٨]<\/span>."]], "tr": [[169.0, "Allah Azze ve Celle onlar hakkında şöyle buyurmuştur:"], [172.5, "<span class=\"ayah\">﴿Yahudiler \"Allah'ın eli bağlıdır\" dediler﴾<\/span>."], [176.0, "Ardından onlara şu sözüyle reddiye verdi:"], [176.0, "<span class=\"ayah\">﴿Onların elleri bağlansın ve söyledikleri yüzünden lanetlensinler﴾<\/span> [Mâide 64]."], [181.0, "Allah Azze ve Celle birçok yerde Yahudilerin, O'nu rubûbiyyetinin ve ulûhiyyetinin makamına yakışmayan sıfatlarla nitelediklerini bildirir."], [194.0, "Yahudiler, Allah Azze ve Celle'yi yakışmayan şeylerle en çok niteleyen taifelerdendir."], [199.0, "Hatta Allah'ı niteledikleri şeylerden biri de O'nu yorgunlukla nitelemeleridir;"], [205.0, "tahrif edilmiş Tevrat'ta olduğu gibi."], [205.0, "Orada, Allah Azze ve Celle'nin mahlûkatı yaratmayı bitirince dinlendiğini açıkça yazarlar."], [214.0, "Allah Azze ve Celle ise şu sözüyle kendini bundan tenzih etmiştir:"], [219.0, "<span class=\"ayah\">﴿Andolsun, gökleri, yeri ve ikisi arasındakileri altı günde yarattık; bize hiçbir yorgunluk dokunmadı﴾<\/span> [Kâf 38]."]]}, {"reader": false, "ar": [[227.0, "بل ووصفوه بالندم، والله عز وجل أيضًا نزّه نفسه عن ذلك في قوله:"], [234.6, "<span class=\"ayah\">﴿لَا يُسْأَلُ عَمَّا يَفْعَلُ وَهُمْ يُسْأَلُونَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٣]<\/span>."], [238.0, "ويقول الله عز وجل:"], [240.3, "<span class=\"ayah\">﴿فَمَا بَكَتْ عَلَيْهِمُ السَّمَاءُ وَالْأَرْضُ وَمَا كَانُوا مُنظَرِينَ﴾<\/span> <span class=\"ref\">[الدخان: ٢٩]<\/span>."], [245.0, "ويقول الله عز وجل:"], [247.7, "<span class=\"ayah\">﴿فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنبِهِمْ فَسَوَّاهَا ۝ وَلَا يَخَافُ عُقْبَاهَا﴾<\/span> <span class=\"ref\">[الشمس: ١٤–١٥]<\/span>."], [253.0, "بل وصفوا الله عز وجل بالبكاء وذرفِ الدموع الكثيرة،"], [259.0, "كما في التوراة المحرّفة."], [261.0, "وكلُّ ذلك من وصف الله عز وجل بما لا يليق،"], [266.0, "لا بربوبيته ولا بألوهيته عز وجل. ـ يرحمك الله ـ"]], "tr": [[227.0, "Hatta O'nu pişmanlıkla nitelediler. Allah Azze ve Celle de şu sözüyle kendini bundan tenzih etmiştir:"], [234.6, "<span class=\"ayah\">﴿O, yaptığından sorumlu tutulmaz; onlar ise sorguya çekilirler﴾<\/span> [Enbiyâ 23]."], [238.0, "Allah Azze ve Celle şöyle buyurur:"], [240.3, "<span class=\"ayah\">﴿Onlara ne gök ağladı ne de yer; onlara mühlet de verilmedi﴾<\/span> [Duhân 29]."], [240.3, "Allah Azze ve Celle şöyle buyurur:"], [245.0, "<span class=\"ayah\">﴿Rableri, günahları yüzünden onları helâk edip yerle bir etti. O, bunun sonucundan korkmaz﴾<\/span> [Şems 14–15]."], [247.7, "Hatta tahrif edilmiş Tevrat'ta olduğu gibi Allah Azze ve Celle'yi ağlamak ve bol gözyaşı dökmekle nitelediler."], [259.0, "Bütün bunlar, Allah Azze ve Celle'yi ne rubûbiyyetine ne de ulûhiyyetine yakışmayan şeylerle nitelemektir."], [266.0, "(Aksırana:) Allah sana rahmet etsin."]]}, {"reader": false, "ar": [[269.0, "وكذلك النصارى، فقد كثر وصفُهم لله عز وجل بما لا يليق،"], [276.0, "كما في قول الله عز وجل:"], [279.4, "<span class=\"ayah\">﴿لَّقَدْ كَفَرَ الَّذِينَ قَالُوا إِنَّ اللَّهَ ثَالِثُ ثَلَاثَةٍ﴾<\/span> <span class=\"ref\">[المائدة: ٧٣]<\/span>،"], [284.0, "<span class=\"ayah\">﴿وَقَالَتِ الْيَهُودُ عُزَيْرٌ ابْنُ اللَّهِ وَقَالَتِ النَّصَارَى الْمَسِيحُ ابْنُ اللَّهِ﴾<\/span> <span class=\"ref\">[التوبة: ٣٠]<\/span>،"], [289.0, "والآيات في هذا المعنى كثيرة."], [291.0, "وكذلك أيضًا يجب تنزيهُ الله عز وجل عن مماثلة صفاته لشيءٍ من صفات خلقه،"]], "tr": [[269.0, "Hristiyanlar da böyledir; Allah Azze ve Celle'yi yakışmayan şeylerle nitelemeleri çoktur."], [276.0, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [279.4, "<span class=\"ayah\">﴿\"Allah üçün üçüncüsüdür\" diyenler andolsun ki kâfir olmuştur﴾<\/span> [Mâide 73]."], [284.0, "<span class=\"ayah\">﴿Yahudiler \"Üzeyr Allah'ın oğludur\" dediler, Hristiyanlar da \"Mesih Allah'ın oğludur\" dediler﴾<\/span> [Tevbe 30]."], [284.0, "Bu anlamdaki ayetler çoktur. Aynı şekilde Allah Azze ve Celle'yi, sıfatlarının mahlûkatının sıfatlarından herhangi birine benzemesinden tenzih etmek de vâciptir;"]]}]}, {"ts": "05:01", "title": "1. Külliye (devam): Temsil, ta'til, Kaderiyye, sû-i zan ve zulüm nispeti", "paras": [{"reader": false, "ar": [[301.0, "لأنّ مماثلة الله بخلقه مما يتنافى مع كمال ربوبيته وألوهيته وأسمائه وصفاته عز وجل."], [310.0, "وكذلك يجب تنزيه الله عز وجل عن تعطيله عن كمالاته،"], [316.0, "كما فعله المعطِّلة؛ فإنهم يعطّلون الله عز وجل عن صفات كماله،"], [324.0, "فلا يصفونه بما وصف به نفسه في كتابه،"], [328.0, "ولا بما وصفه به نبيُّه صلى الله عليه وسلم."], [331.0, "وعلى ذلك قولُ الله عز وجل:"], [334.3, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>، وقولُ الله عز وجل:"], [337.8, "<span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [340.0, "وقولُ الله عز وجل:"], [342.0, "<span class=\"ayah\">﴿هَلْ تَعْلَمُ لَهُ سَمِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٥]<\/span>."]], "tr": [[301.0, "Çünkü Allah'ı mahlûkatına benzetmek, O'nun rubûbiyyetinin, ulûhiyyetinin, isim ve sıfatlarının kemaline aykırıdır."], [310.0, "Aynı şekilde Muattıla'nın yaptığı gibi Allah Azze ve Celle'yi kemallerinden ta'til etmekten de O'nu tenzih etmek vâciptir."], [316.0, "Çünkü onlar Allah Azze ve Celle'yi kemal sıfatlarından ta'til ederler;"], [328.0, "O'nu ne Kitabı'nda kendini nitelediği şeylerle ne de Peygamberi ﷺ'in O'nu nitelediği şeylerle nitelerler."], [334.3, "Allah Azze ve Celle'nin şu sözleri buna delildir:"], [334.3, "<span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11], <span class=\"ayah\">﴿Hiçbir şey O'na denk değildir﴾<\/span> [İhlâs 4], <span class=\"ayah\">﴿O'nun adaşı (benzeri) olan birini biliyor musun?﴾<\/span> [Meryem 65]."]]}, {"reader": false, "ar": [[344.0, "وكذلك أيضًا في هذه الكلّيّة ردٌّ على من يسلب قدرةَ الله عز وجل على خلق أفعال العباد،"], [355.0, "كما فعله القدرية في باب القدر؛"], [358.0, "فإنهم يصفون الله عز وجل بعجزه عن خلق أفعال العباد."], [363.0, "وكذلك فيها ردٌّ على من ينفي العلمَ عن الله عز وجل،"], [370.0, "كما فعله القدرية الأوائل؛"], [372.0, "فإنهم يزعمون أن لا قدَر،"], [375.6, "وأنّ الأمر أُنُف، وأن الله لا يعلم الشيء قبل وقوعه."], [382.0, "وكلُّ ذلك مما يتنافى مع كمال ربوبيته وألوهيته."]], "tr": [[344.0, "Aynı şekilde bu külliyede, kader babında Kaderiyye'nin yaptığı gibi Allah Azze ve Celle'nin kulların fiillerini yaratma kudretini elinden alanlara bir reddiye vardır;"], [355.0, "çünkü onlar Allah Azze ve Celle'yi kulların fiillerini yaratmaktan aciz olmakla nitelerler."], [358.0, "Yine bu külliyede, ilk Kaderiyye'nin yaptığı gibi Allah Azze ve Celle'den ilmi nefyedenlere bir reddiye vardır."], [370.0, "Onlar kader diye bir şey olmadığını, işin yeni başladığını (önceden bilinmediğini) ve Allah'ın bir şeyi olmadan önce bilmediğini iddia ederler."], [382.0, "Bütün bunlar O'nun rubûbiyyetinin ve ulûhiyyetinin kemaline aykırıdır."]]}, {"reader": false, "ar": [[388.0, "ويدخل في ذلك أيضًا ظنُّ السوء بالله عز وجل؛"], [392.0, "فمن ظنّ أن الله سيترك عباده في أرضه هَمَلًا سُدًى بلا جزاءٍ ولا حساب،"], [398.0, "فقد وصف الله بما يتنافى مع كمال ربوبيته وألوهيته."], [403.0, "وكذلك يدخل فيه أيضًا من نسب الله عز وجل إلى خِذلان أنبيائه ورسله،"], [412.0, "وأنّ الكفار سيتغلّبون عليهم الغلبةَ المطلقة،"], [418.0, "وأن الله سيُسلِم رسلَه وأتباعَهم من الأنبياء لأيدي أعدائهم."], [424.0, "وكلُّ ذلك قد نفاه الله عز وجل في قوله:"], [430.0, "<span class=\"ayah\">﴿الظَّانِّينَ بِاللَّهِ ظَنَّ السَّوْءِ ۚ عَلَيْهِمْ دَائِرَةُ السَّوْءِ﴾<\/span> <span class=\"ref\">[الفتح: ٦]<\/span>."]], "tr": [[388.0, "Allah Azze ve Celle hakkında kötü zan da buna girer."], [388.0, "Kim Allah'ın kullarını yeryüzünde karşılıksız ve hesapsız, başıboş ve boş yere bırakacağını zannederse, Allah'ı rubûbiyyetinin ve ulûhiyyetinin kemaline aykırı bir şeyle nitelemiş olur."], [403.0, "Allah Azze ve Celle'ye peygamberlerini ve resullerini yardımsız bırakmayı nispet eden, kâfirlerin onlara mutlak bir galibiyetle galip geleceğini ve Allah'ın resullerini ve peygamberlerden onlara tâbi olanları düşmanlarının eline teslim edeceğini söyleyen de buna girer."], [424.0, "Allah Azze ve Celle bütün bunları şu sözüyle nefyetmiştir:"], [430.0, "<span class=\"ayah\">﴿Allah hakkında kötü zanda bulunanlar... Kötülük çemberi onların başına olsun﴾<\/span> [Fetih 6]."]]}, {"reader": false, "ar": [[436.0, "وكذلك أيضًا يدخل فيها تنزيهُ الله عز وجل عن الظلم في مجال الأقدار؛"], [442.0, "فإن كثيرًا من الناس ينسب الله عز وجل إلى الظلم فيما يصيبه من المصائب والآلام والأمراض،"], [448.0, "وهذا مما يتنافى مع كماله في ربوبيته وألوهيته."], [455.0, "ولذلك نفى الله عز وجل عن نفسه ذلك في قوله:"], [460.0, "<span class=\"ayah\">﴿وَمَا رَبُّكَ بِظَلَّامٍ لِّلْعَبِيدِ﴾<\/span> <span class=\"ref\">[فصلت: ٤٦]<\/span>."]], "tr": [[436.0, "Yine kaderler alanında Allah Azze ve Celle'yi zulümden tenzih etmek de bu külliyeye girer."], [436.0, "Çünkü insanların birçoğu, başına gelen musibetler, acılar ve hastalıklar konusunda Allah Azze ve Celle'ye zulüm nispet eder."], [448.0, "Bu ise O'nun rubûbiyyetindeki ve ulûhiyyetindeki kemaline aykırıdır."], [455.0, "Bu yüzden Allah Azze ve Celle şu sözüyle bunu kendinden nefyetmiştir:"], [460.0, "<span class=\"ayah\">﴿Rabbin kullarına zulmedici değildir﴾<\/span> [Fussilet 46]."]]}, {"reader": false, "ar": [[462.0, "بل ونفى عن نفسه حاجتَه إلى عباده؛"], [467.0, "فالله عز وجل له الكمال الذاتي،"], [470.0, "لا يمكن أن ينفكّ كمالُه وغناه عنه أبدًا،"], [475.0, "كما قال الله عز وجل مبطلًا إلهيّةَ عيسى وأمّه بأنهما <span class=\"ayah\">﴿كَانَا يَأْكُلَانِ الطَّعَامَ﴾<\/span> <span class=\"ref\">[المائدة: ٧٥]<\/span>."], [484.0, "والله عز وجل هو الأحد الصمد،"], [486.0, "الذي لا يأكل ولا يشرب عز وجل."], [489.0, "وعلى كلّ حال، فالمؤمن إنما يقوم إيمانُه بربّه على هذه الكلّيّة،"], [500.0, "فينقص التوحيد مطلقَ النقص ـ أو النقصَ المطلق ـ متى ما وصفتَ ربك عز وجل بشيءٍ يتنافى مع كمال ربوبيته وألوهيته. والله أعلم."]], "tr": [[462.0, "Hatta kullarına muhtaç olmayı da kendinden nefyetmiştir."], [467.0, "Allah Azze ve Celle'nin zâtî kemali vardır;"], [470.0, "kemali ve ganiliği (hiçbir şeye muhtaç olmayışı) O'ndan asla ayrılamaz."], [475.0, "Nitekim Allah Azze ve Celle, Îsâ'nın ve annesinin ilahlığını iptal ederken onların <span class=\"ayah\">﴿yemek yediklerini﴾<\/span> [Mâide 75] bildirmiştir."], [484.0, "Allah Azze ve Celle ise Ehad'dır, Samed'dir;"], [486.0, "yemez ve içmez. Her hâlükârda mümin, Rabbine olan imanını bu külliye üzerine kurar."], [489.0, "Rabbini rubûbiyyetinin ve ulûhiyyetinin kemaline aykırı bir şeyle nitelediğin anda tevhid mutlak bir şekilde —ya da mutlak eksiklikle— eksilir. Allah en iyisini bilir."]]}]}, {"ts": "08:32", "title": "2. Külliye: Makamı ne kadar yüce olursa olsun her mahlûk acz ve noksanla nitelenir", "paras": [{"reader": false, "ar": [[512.0, "ومن الكلّيّات أيضًا: <b>كلُّ مخلوقٍ مهما عظمت منزلتُه فموصوفٌ بالعجز والنقص.<\/b> كلُّ مخلوقٍ مهما عظمت منزلته فموصوفٌ بالعجز والنقص."], [529.0, "أقول: وذلك لأنّ المتفرّد بالكمال المطلق إنما هو الله عز وجل،"], [536.0, "وأمّا ما سواه من سائر المخلوقات فإنه لا بد أن يدخل في أصل خلقها ـ أو ما يعرض لها ـ شيءٌ من النقص أو العجز،"], [547.5, "به تبطل ربوبيتُها وألوهيتُها؛"], [551.0, "فإنّ الربَّ والإلهَ لا يصلح أن يعتريه شيءٌ من النقص ولا العجز بأيّ وجهٍ من الوجوه."]], "tr": [[512.0, "Külliyelerden biri de şudur: 2."], [512.0, "külliye: Makamı ne kadar yüce olursa olsun her mahlûk acz ve noksanla nitelenir. (Tekrar ediyor.) Derim ki:"], [512.0, "Bunun sebebi, mutlak kemalde tek olanın ancak Allah Azze ve Celle olmasıdır."], [529.0, "O'nun dışındaki bütün mahlûkatın ise ya yaratılışının aslına ya da sonradan arız olan hâllerine mutlaka bir noksan veya acz girer;"], [547.5, "onların rubûbiyyeti ve ulûhiyyeti de bununla bâtıl olur."], [551.0, "Çünkü Rab ve ilaha hiçbir şekilde bir noksan veya acz ârız olamaz."]]}, {"reader": false, "ar": [[560.0, "وإنّ من أعظم مَن خلق الله عز وجل الملائكة،"], [564.0, "وقد أبطل الله عز وجل ربوبيتَهم وألوهيتَهم بوصفهم بهاتين الصفتين:"], [569.0, "أنهم عاجزون، وأنّ فيهم نقصًا،"], [572.0, "كما قال الله عز وجل:"], [574.9, "<span class=\"ayah\">﴿بَلْ عِبَادٌ مُّكْرَمُونَ ۝ لَا يَسْبِقُونَهُ بِالْقَوْلِ وَهُم بِأَمْرِهِ يَعْمَلُونَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٦–٢٧]<\/span>،"], [580.0, "وهذا دليلٌ على أنهم لا يصلحون لشيءٍ من مقتضيات الربوبية ولا الألوهية."], [589.0, "بل وصفهم الله عز وجل بالخوف الشديد،"], [592.5, "كما في قوله عز وجل:"], [595.0, "<span class=\"ayah\">﴿وَلَا تَنفَعُ الشَّفَاعَةُ عِندَهُ إِلَّا لِمَنْ أَذِنَ لَهُ ۚ حَتَّىٰ إِذَا فُزِّعَ عَن قُلُوبِهِمْ قَالُوا مَاذَا قَالَ رَبُّكُمْ ۖ قَالُوا الْحَقَّ ۖ وَهُوَ الْعَلِيُّ الْكَبِيرُ﴾<\/span> <span class=\"ref\">[سبأ: ٢٣]<\/span>."]], "tr": [[560.0, "Allah Azze ve Celle'nin yarattıklarının en büyüklerinden biri meleklerdir."], [564.0, "Allah Azze ve Celle onların rubûbiyyetini ve ulûhiyyetini, onları şu iki sıfatla niteleyerek iptal etmiştir:"], [569.0, "Onlar acizdir ve onlarda noksanlık vardır."], [574.9, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [574.9, "<span class=\"ayah\">﴿Bilakis onlar ikram edilmiş kullardır. Sözde O'nun önüne geçmezler ve O'nun emriyle iş yaparlar﴾<\/span> [Enbiyâ 26–27]."], [580.0, "Bu, onların rubûbiyyetin ve ulûhiyyetin gereklerinden hiçbirine elverişli olmadıklarının delilidir."], [589.0, "Hatta Allah Azze ve Celle onları şiddetli korkuyla nitelemiştir;"], [595.0, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [595.0, "<span class=\"ayah\">﴿O'nun katında, izin verdiği kimseden başkasının şefaati fayda vermez. Nihayet kalplerinden korku giderilince \"Rabbiniz ne buyurdu?\" derler. \"Hakkı (buyurdu)\" derler. O, yücedir, büyüktür﴾<\/span> [Sebe' 23]."]]}]}, {"ts": "10:05", "title": "2. Külliye (devam): Meleklerin ve peygamberlerin acz ve noksanı", "paras": [{"reader": false, "ar": [[605.0, "يوضّح هذا قولُ النبي صلى الله عليه وسلم:"], [609.0, "«إذا قضى الله الأمرَ في السماء ضربت الملائكةُ بأجنحتها خُضْعانًا لقوله، كأنه سلسلةٌ على صفوان، ينفُذُهم ذلك، حتى إذا فُزِّع عن قلوبهم قالوا: ماذا قال ربكم؟» <span class=\"note\">(Buhârî)<\/span>."], [623.0, "فإذا كان ذلك العجزُ والنقص يصيب عالمَ الملائكة،"], [628.0, "فمَن دونهم من باب أولى."], [632.0, "ويقول الله عز وجل:"], [636.0, "<span class=\"ayah\">﴿لَّا يَعْصُونَ اللَّهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ﴾<\/span> <span class=\"ref\">[التحريم: ٦]<\/span>."], [642.0, "ويقول الله عز وجل:"], [643.7, "<span class=\"ayah\">﴿وَمَن يَقُلْ مِنْهُمْ إِنِّي إِلَٰهٌ مِّن دُونِهِ فَذَٰلِكَ نَجْزِيهِ جَهَنَّمَ ۚ كَذَٰلِكَ نَجْزِي الظَّالِمِينَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٩]<\/span>."]], "tr": [[605.0, "Nebî ﷺ'in şu sözü bunu açıklar:"], [605.0, "«Allah gökte bir işe hükmettiğinde, melekler O'nun sözüne boyun eğerek kanatlarını çırparlar; (ses) sanki düz bir kaya üzerinde (sürüklenen) bir zincir gibidir; bu onlara işler. Nihayet kalplerinden korku giderilince \"Rabbiniz ne buyurdu?\" derler.» <span class=\"note\">(Buhârî)<\/span>."], [623.0, "Bu acz ve noksan melekler âlemine isabet ediyorsa, onlardan aşağıda olanlara haydi haydi isabet eder."], [636.0, "Allah Azze ve Celle şöyle buyurur:"], [636.0, "<span class=\"ayah\">﴿Allah'ın kendilerine emrettiği hususta O'na isyan etmezler ve emrolundukları şeyi yaparlar﴾<\/span> [Tahrîm 6]."], [643.7, "Allah Azze ve Celle şöyle buyurur:"], [643.7, "<span class=\"ayah\">﴿Onlardan kim \"Ben O'ndan başka bir ilahım\" derse, onu cehennemle cezalandırırız. Zalimleri işte böyle cezalandırırız﴾<\/span> [Enbiyâ 29]."]]}, {"reader": false, "ar": [[650.0, "ويقول النبي صلى الله عليه وسلم:"], [652.0, "«أطّت السماءُ وحُقَّ لها أن تئِطّ، ما من موضعِ أربعِ أصابعَ إلا مَلَكٌ ساجدٌ أو راكع»."], [659.0, "وهذا دليلٌ على بطلان ألوهيتهم وربوبيتهم،"], [663.0, "إذ بسبب نقصهم وفقرهم وعجزهم لله عز وجل يحتاجون ويفتقرون الافتقارَ الذاتيَّ إلى الركوع والسجود والتسبيح وكثرة التعبّد له عز وجل."]], "tr": [[650.0, "Nebî ﷺ şöyle buyurur: «Gök gıcırdadı; gıcırdaması da hakkıdır. Dört parmaklık bir yer yoktur ki orada secde eden ya da rükû eden bir melek bulunmasın.» Bu, onların ulûhiyyetinin ve rubûbiyyetinin bâtıl olduğunun delilidir."], [663.0, "Çünkü onlar, noksanlıkları, fakirlikleri ve Allah Azze ve Celle karşısındaki aczleri sebebiyle rükûa, secdeye, tesbihe ve O'na çokça ibadet etmeye zâtî bir ihtiyaçla muhtaçtırlar."]]}, {"reader": false, "ar": [[675.0, "وكذلك الأنبياء ـ وهم أشرفُ من خلق الله عز وجل في ملكوت أرضه ـ يُخبر عنهم في مواضعَ كثيرةٍ بأنهم ناقصون،"], [684.7, "وأنهم عاجزون عن كثيرٍ من متطلّبات أمورهم."], [689.0, "فهذا النبي صلى الله عليه وسلم يُؤمر بأن يقول:"], [693.3, "<span class=\"ayah\">﴿قُل لَّا أَمْلِكُ لِنَفْسِي نَفْعًا وَلَا ضَرًّا﴾<\/span>،"], [696.6, "وذلك لقصور البشرية، <span class=\"ayah\">﴿وَلَوْ كُنتُ أَعْلَمُ الْغَيْبَ لَاسْتَكْثَرْتُ مِنَ الْخَيْرِ وَمَا مَسَّنِيَ السُّوءُ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٨]<\/span>."], [705.0, "وقد أخبر الله عز وجل أن كثيرًا من أنبيائه قُتلوا وطُردوا وشُرّدوا وأُوذوا،"], [712.0, "كما قال صلى الله عليه وسلم وهو يحكي نبيًّا من الأنبياء ضربه قومه فأدمَوه،"], [719.0, "وهو يمسح الدمَ عن وجهه ويقول:"], [722.5, "«اللهم اغفر لقومي فإنهم لا يعلمون» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[675.0, "Aynı şekilde peygamberler de —ki onlar Allah Azze ve Celle'nin yeryüzü melekûtunda yarattıklarının en şereflileridir— birçok yerde noksan oldukları ve işlerinin gerektirdiği birçok şeyden aciz oldukları bildirilir."], [689.0, "İşte Nebî ﷺ'e şöyle demesi emredilir:"], [693.3, "<span class=\"ayah\">﴿De ki: Ben kendime ne bir fayda ne de bir zarar verme gücüne sahibim﴾<\/span>;"], [696.6, "bu, beşerî yetersizlik sebebiyledir. <span class=\"ayah\">﴿Eğer gaybı bilseydim elbette daha çok hayır yapardım ve bana hiçbir kötülük dokunmazdı﴾<\/span> [A'râf 188]."], [696.6, "Allah Azze ve Celle, peygamberlerinin çoğunun öldürüldüğünü, kovulduğunu, sürgün edildiğini ve eziyet gördüğünü bildirmiştir."], [712.0, "Nitekim Nebî ﷺ, kavmi kendisini döverek kanatan ve yüzündeki kanı silerken «Allah'ım, kavmimi bağışla, çünkü onlar bilmiyorlar» diyen peygamberlerden birini anlatmıştır <span class=\"note\">(Buhârî, Müslim)<\/span>."]]}, {"reader": false, "ar": [[726.0, "بل يقول الله عز وجل إذا قصّ على نبيّه في كتابه شيئًا من قصص الأوّلين يقول:"], [732.4, "<span class=\"ayah\">﴿مَا كُنتَ تَعْلَمُهَا أَنتَ وَلَا قَوْمُكَ مِن قَبْلِ هَٰذَا﴾<\/span> <span class=\"ref\">[هود: ٤٩]<\/span>،"], [736.0, "وهذا دليلٌ على النقص البشري في العلم."], [738.0, "ويقول الله عز وجل:"], [740.2, "<span class=\"ayah\">﴿وَكَذَٰلِكَ أَوْحَيْنَا إِلَيْكَ رُوحًا مِّنْ أَمْرِنَا ۚ مَا كُنتَ تَدْرِي مَا الْكِتَابُ وَلَا الْإِيمَانُ وَلَٰكِن جَعَلْنَاهُ نُورًا نَّهْدِي بِهِ مَن نَّشَاءُ مِنْ عِبَادِنَا﴾<\/span> <span class=\"ref\">[الشورى: ٥٢]<\/span>."], [750.0, "ويقول... وقد ثبت عن النبي صلى الله عليه وسلم أنّ قومه قد شجّوا رأسه،"], [758.6, "وأنهم كسروا رَباعيَته، فقال صلى الله عليه وسلم:"], [764.5, "«كيف يُفلح قومٌ شجّوا نبيَّهم؟!»،"], [767.0, "فأنزل الله: <span class=\"ayah\">﴿لَيْسَ لَكَ مِنَ الْأَمْرِ شَيْءٌ﴾<\/span> <span class=\"ref\">[آل عمران: ١٢٨]<\/span> <span class=\"note\">(Müslim)<\/span>."]], "tr": [[726.0, "Hatta Allah Azze ve Celle, Kitabı'nda Peygamberine öncekilerin kıssalarından bir şey anlattığında şöyle der:"], [732.4, "<span class=\"ayah\">﴿Bundan önce bunları ne sen biliyordun ne de kavmin﴾<\/span> [Hûd 49]."], [736.0, "Bu, ilimde beşerî noksanlığın delilidir."], [736.0, "Allah Azze ve Celle şöyle buyurur:"], [740.2, "<span class=\"ayah\">﴿Sana da böylece emrimizden bir ruh (Kur'an) vahyettik. Sen kitap nedir, iman nedir bilmiyordun. Fakat biz onu, kullarımızdan dilediğimizi kendisiyle doğru yola ilettiğimiz bir nur kıldık﴾<\/span> [Şûrâ 52]."], [740.2, "Yine... Nebî ﷺ'den sabit olmuştur ki kavmi onun başını yarmış ve ön dişini kırmıştı."], [750.0, "Bunun üzerine Nebî ﷺ «Peygamberlerinin başını yaran bir kavim nasıl kurtuluşa erer?!» dedi."], [764.5, "Allah da şunu indirdi: <span class=\"ayah\">﴿Bu işte senin yapabileceğin bir şey yoktur﴾<\/span> [Âl-i İmrân 128] <span class=\"note\">(Müslim)<\/span>."]]}, {"reader": false, "ar": [[771.0, "فإذا كان أشرفُ مَن خلق الله في العالم العلوي فيهم هذا العجزُ والنقص،"], [776.0, "وإذا كان أشرفُ مَن خلق الله عز وجل في العالم السفلي فيهم ذلك العجزُ والنقص،"], [781.0, "فمَن دونهم من باب أولى:"], [784.0, "من الأولياء والصالحين، والأشجار والأحجار،"], [787.0, "والإنس والجن، وغيرهم من المخلوقات."], [790.0, "فهذا دليلٌ على بطلان ربوبية وألوهية المخلوق؛"], [796.0, "فالمخلوق لا يصلح أن يكون ربًّا،"], [799.3, "ولا يصلح أن يكون إلهًا،"], [802.0, "وذلك لأنه ما من مخلوقٍ إلا ولا بد أن يوصف بشيءٍ من النقص،"], [806.0, "وأن يوصف بشيءٍ من العجز."]], "tr": [[771.0, "Yüce âlemde Allah'ın yarattıklarının en şereflilerinde bu acz ve noksan bulunuyorsa, aşağı âlemde Allah Azze ve Celle'nin yarattıklarının en şereflilerinde de bu acz ve noksan bulunuyorsa, onlardan aşağıda olanlar —veliler, salihler, ağaçlar, taşlar, insanlar, cinler ve diğer mahlûkat— haydi haydi böyledir."], [790.0, "Bu, mahlûkun rubûbiyyetinin ve ulûhiyyetinin bâtıl olduğunun delilidir."], [796.0, "Mahlûk ne Rab olmaya elverişlidir ne de ilah olmaya."], [802.0, "Çünkü mutlaka bir noksanla ve bir aczle nitelenmeyen hiçbir mahlûk yoktur."]]}, {"reader": false, "ar": [[809.0, "بل إنّ من أعظم العجز الذي لا يستطيع المخلوق دفعه:"], [813.0, "عجزَ الموت، وانقطاعَ الروح،"], [815.0, "وانقطاعَ الحياة، كما قال الله عز وجل:"], [818.2, "<span class=\"ayah\">﴿كُلُّ مَنْ عَلَيْهَا فَانٍ ۝ وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٦–٢٧]<\/span>."], [823.0, "ويقول الله عز وجل:"], [825.5, "<span class=\"ayah\">﴿إِنَّكَ مَيِّتٌ وَإِنَّهُم مَّيِّتُونَ﴾<\/span> <span class=\"ref\">[الزمر: ٣٠]<\/span>."], [828.0, "ويقول الله عز وجل:"], [829.8, "<span class=\"ayah\">﴿وَمَا جَعَلْنَا لِبَشَرٍ مِّن قَبْلِكَ الْخُلْدَ ۖ أَفَإِن مِّتَّ فَهُمُ الْخَالِدُونَ﴾<\/span> <span class=\"ref\">[الأنبياء: ٣٤]<\/span>."], [834.0, "ويقول النبي صلى الله عليه وسلم:"], [837.0, "«اللهم أنت الحيُّ الذي لا تموت، والإنسُ والجنُّ يموتون»."], [842.0, "فهذا من نقصهم وعجزهم وفقرهم الذاتي لله تبارك وتعالى."]], "tr": [[809.0, "Hatta mahlûkun defetmeye gücü yetmediği en büyük acizlik;"], [809.0, "ölüm aczi, ruhun ve hayatın kesilmesidir."], [815.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [818.2, "<span class=\"ayah\">﴿Yeryüzündeki herkes fânidir. Celâl ve ikram sahibi Rabbinin yüzü ise bâkidir﴾<\/span> [Rahmân 26–27]."], [818.2, "Allah Azze ve Celle şöyle buyurur:"], [823.0, "<span class=\"ayah\">﴿Şüphesiz sen öleceksin, onlar da ölecekler﴾<\/span> [Zümer 30]."], [825.5, "Allah Azze ve Celle şöyle buyurur:"], [828.0, "<span class=\"ayah\">﴿Senden önce hiçbir beşere ebedîlik vermedik. Şimdi sen ölürsen onlar ebedî mi kalacaklar?﴾<\/span> [Enbiyâ 34]."], [829.8, "Nebî ﷺ de şöyle buyurur:"], [834.0, "«Allah'ım! Sen ölmeyen Hayy'sın; insanlar ve cinler ise ölürler.» Bu, onların noksanlığından, aczinden ve Allah Tebâreke ve Teâlâ'ya olan zâtî fakirliklerindendir."]]}, {"reader": false, "ar": [[848.0, "فهذه الكلّيّة فيها إبطالٌ لما صُرف من مقتضيات الربوبية والألوهية للمخلوقين؛"], [856.0, "فالذي يصيبه ذلك النقص وذلك العجز لا يصلح أن يكون ربًّا،"], [860.5, "ولا يصلح أن يكون إلهًا."], [862.0, "وأما الله وحده لا شريك له،"], [865.0, "فهو المتفرّد بالكمال والجلال وكمال القدرة والقوة،"], [869.9, "بحيث إنه لا يمكن أبدًا أن يصيبه شيءٌ من النقص أو العجز،"], [875.0, "لا في ذاته، ولا في أسمائه وصفاته،"], [877.9, "ولا في شيءٍ من أفعاله؛"], [880.0, "فهو المستحقّ لأن يُعبد دون ما سواه عز وجل. والله أعلم."]], "tr": [[848.0, "Bu külliyede, rubûbiyyet ve ulûhiyyetin gereklerinden mahlûklara yöneltilen şeylerin iptali vardır."], [856.0, "O noksanın ve o aczin isabet ettiği kimse ne Rab olmaya elverişlidir ne de ilah olmaya."], [862.0, "Ortağı olmayan tek Allah ise kemalde, celâlde, kudret ve kuvvetin kemalinde tektir;"], [865.0, "öyle ki O'na ne zâtında, ne isim ve sıfatlarında, ne de fiillerinden herhangi birinde asla bir noksan veya acz isabet edemez."], [877.9, "O'ndan başkası değil, ibadet edilmeye müstahak olan O'dur. Allah en iyisini bilir."]]}]}, {"ts": "14:44", "title": "3. Külliye: Allah'tan başka her şey muhdes ve mümkinü'l-vücûddur", "paras": [{"reader": false, "ar": [[884.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما سوى الله فمُحدَثٌ ممكنُ الوجود.<\/b> أقول:"], [898.7, "وهذه قاعدةٌ واضحةٌ لا تحتاج إلى شيءٍ من التوضيح."]], "tr": [[884.0, "Külliyelerden biri de şudur: 3."], [884.0, "külliye: Allah'tan başka her şey muhdes (sonradan var olmuş) ve mümkinü'l-vücûddur (varlığı zorunlu değildir). Derim ki:"], [898.7, "Bu, hiçbir açıklamaya ihtiyaç duymayan açık bir kaidedir."]]}, {"reader": false, "ar": [[912.0, "وذلك لأنّ المتفرّد بالأوّلية المطلقة والأزلية المطلقة إنما هو الله عز وجل؛"], [919.0, "فهو الأوّل الذي ليس قبله شيء،"], [922.0, "وهو الآخِر الذي ليس بعده شيء،"], [925.0, "وهو الظاهر الذي ليس فوقه شيء،"], [928.5, "وهو الباطن الذي ليس دونه شيء."], [932.0, "وأما ما سواه فإنه يوصف بأنه ممكنُ الوجود وأنه محدَث،"], [938.0, "بمعنى أنه كان بعد أن لم يكن،"], [942.8, "ومنعدمٌ بعد أن كان."], [946.0, "فلا أحدَ أبدًا يتفرّد بالأوّلية إلا الله،"], [950.1, "ولا يتفرّد بالآخِرية إلا الله."]], "tr": [[912.0, "Bunun sebebi, mutlak evveliyyette ve mutlak ezeliyyette tek olanın ancak Allah Azze ve Celle olmasıdır."], [912.0, "O, kendisinden önce hiçbir şey olmayan Evvel'dir;"], [922.0, "kendisinden sonra hiçbir şey olmayan Âhir'dir;"], [925.0, "üstünde hiçbir şey olmayan Zâhir'dir;"], [928.5, "ötesinde hiçbir şey olmayan Bâtın'dır."], [932.0, "O'nun dışındakiler ise mümkinü'l-vücûd ve muhdes olmakla nitelenir;"], [932.0, "yani yok iken var olmuştur ve var olduktan sonra yok olacaktır."], [942.8, "Evveliyyette Allah'tan başka hiç kimse tek değildir;"], [946.0, "âhiriyyette de Allah'tan başka hiç kimse tek değildir."]]}, {"reader": false, "ar": [[953.0, "والأوّليةُ التي نصف الله عز وجل بها إنما هي الأوّليةُ الواجبة التي لم تُستمدّ من شيءٍ آخر،"], [962.0, "ولكن لأنه الله فهو الأوّل الذي ليس قبله شيء."], [968.0, "وهذا دليلٌ على أنّ هذا العالم العلويَّ والسفليَّ ـ بكلّ متعلَّقاته ومجرّاته وأفلاكه وسمائه وأرضه وجباله وإنسه وجنّه،"], [981.0, "وكافّةِ ما فيه من المخلوقات ـ إنما يوصف بأنه محدَثٌ ممكنُ الوجود."]], "tr": [[953.0, "Allah Azze ve Celle'yi nitelediğimiz evveliyyet, başka bir şeyden alınmamış vâcip evveliyyettir;"], [953.0, "O, Allah olduğu için kendisinden önce hiçbir şey olmayan Evvel'dir."], [962.0, "Bu, yüce ve aşağı âlemin —bütün taalluklarıyla, galaksileriyle, felekleriyle, göğüyle, yeriyle, dağlarıyla, insanlarıyla, cinleriyle ve içindeki bütün mahlûkatla— ancak muhdes ve mümkinü'l-vücûd olmakla nitelendiğinin delilidir."]]}, {"reader": false, "ar": [[990.0, "وهذا فيه ردٌّ على الفلاسفة الذين يزعمون بقِدَم العالم قِدَمَ ذات؛"], [997.0, "وكلُّ من زعم بأن العالم قديمٌ قِدَمَ ذات فإنه يجعله ربًّا وإلهًا مع الله عز وجل،"], [1006.0, "وهذا من الاعتقادات الكفرية الوثنية التي ورِثها بعضُ فلاسفة المسلمين من الفلاسفة اليونانيين."], [1019.0, "فالكون كلُّه محدَثٌ ومخلوق،"], [1021.7, "حتى وإن تطاول زمانُه وتعاقبت بعد ذلك أحداثُه؛"], [1029.0, "فلا يزال أنّ كلَّ أوّلٍ فيه فله أوّلٌ منه،"], [1035.0, "أي مسبوقٌ بما هو أوّلُ منه،"], [1038.0, "إلا أوّليةَ الله عز وجل فإنها ليست بمسبوقةٍ بأوّلية،"], [1044.0, "وآخِريّتُه عز وجل ليست متبوعةً بآخِرية."]], "tr": [[990.0, "Bunda, âlemin zâtî bir kıdemle kadîm (ezelî) olduğunu iddia eden filozoflara bir reddiye vardır."], [990.0, "Âlemin zâtî bir kıdemle kadîm olduğunu iddia eden herkes, onu Allah Azze ve Celle ile birlikte bir Rab ve ilah yapmış olur."], [1006.0, "Bu, Müslüman filozofların bazılarının Yunan filozoflarından miras aldığı küfrî ve putperest inançlardandır."], [1006.0, "Kâinatın tamamı muhdes ve mahlûktur;"], [1019.0, "zamanı ne kadar uzasa ve ardından olayları birbirini takip etse de."], [1021.7, "Onda her ilk olanın, kendisinden daha önce olan bir ilki vardır;"], [1029.0, "yani kendisinden daha önce olan bir şey tarafından öncelenmiştir."], [1035.0, "Allah Azze ve Celle'nin evveliyyeti hariç;"], [1038.0, "çünkü O'nun evveliyyetinden önce bir evveliyyet yoktur ve O'nun âhiriyyetinden sonra bir âhiriyyet gelmez."]]}, {"reader": false, "ar": [[1049.0, "وفي هذه الكلّيّة دليلٌ على إبطال ما عُبد من دون الله عز وجل؛"], [1055.0, "إذ إنّ من صفات الربّ الذي يستحقّ أن يُعبد:"], [1059.0, "أن يكون وجودُه من الوجود الواجب،"], [1064.0, "وأنه <span class=\"ayah\">﴿لَمْ يَلِدْ وَلَمْ يُولَدْ﴾<\/span> <span class=\"ref\">[الإخلاص: ٣]<\/span>،"], [1067.0, "وأنه لا أوّلَ له ولا آخِرَ له."], [1071.0, "فكلُّ موصوفٍ بأنه محدَثٌ فلا يصلح أن يكون ربًّا ولا إلهًا،"], [1077.0, "وكلُّ ما هو موصوفٌ بأنه ممكنُ الوجود فلا يصلح أن يكون ربًّا ولا إلهًا."]], "tr": [[1049.0, "Bu külliyede, Allah Azze ve Celle'den başka ibadet edilen şeylerin iptaline delil vardır."], [1055.0, "Çünkü ibadet edilmeye müstahak olan Rabbin sıfatlarından biri, varlığının vâcip varlıktan olması, <span class=\"ayah\">﴿doğurmamış ve doğurulmamış﴾<\/span> [İhlâs 3] olması, başlangıcının ve sonunun olmamasıdır."], [1071.0, "Muhdes olmakla nitelenen her şey ne Rab ne de ilah olmaya elverişlidir."], [1077.0, "Mümkinü'l-vücûd olmakla nitelenen her şey de ne Rab ne de ilah olmaya elverişlidir."]]}]}, {"ts": "18:03", "title": "4. Külliye: Allah'ın bütün fiilleri hayırdır, onlarda şer yoktur", "paras": [{"reader": false, "ar": [[1083.0, "ومن الكلّيّات أيضًا: <b>كلُّ أفعال الله عز وجل خيرٌ لا شرَّ فيها<\/b> ـ سبحانه وتعالى ـ."], [1095.0, "كلُّ أفعال الله عز وجل فخيرٌ لا شرَّ فيها."], [1103.0, "كلُّ أفعال الله عز وجل خيرٌ لا شرَّ فيها."], [1110.0, "فالشرُّ ليس إلى الله عز وجل مطلقًا،"], [1115.0, "ولا يجوز نسبةُ الشرّ إلى شيءٍ من الله؛"], [1119.0, "فالله عز وجل يجب تنزيهُه عن الشرّ مطلقًا،"], [1123.0, "في ذاته وأسمائه وصفاته وأفعاله عز وجل."]], "tr": [[1083.0, "Külliyelerden biri de şudur: 4."], [1083.0, "külliye: Allah Azze ve Celle'nin bütün fiilleri hayırdır, onlarda hiçbir şer yoktur. —O münezzeh ve yücedir—."], [1095.0, "(İki kez tekrar ediyor.) Şer, hiçbir şekilde Allah Azze ve Celle'ye (nispet edilmez);"], [1110.0, "Allah'a ait herhangi bir şeye şer nispet etmek caiz değildir."], [1115.0, "Allah Azze ve Celle'yi zâtında, isim ve sıfatlarında ve fiillerinde şerden mutlak olarak tenzih etmek vâciptir."]]}, {"reader": false, "ar": [[1130.0, "وإنما يدخل الشرُّ في مفعولاته لا في فعله،"], [1137.0, "وفي مخلوقاته لا في صفة خلقه."], [1142.0, "فالشرُّ في المقدور الذي هو فعلُ العبد،"], [1148.0, "وليس في القدَر الذي هو فعلُ الله."], [1152.0, "والشرُّ في المخلوق الذي هو العبد،"], [1157.0, "وليس في صفة الخلق التي تُنسب إلى الله عز وجل."], [1161.0, "والشرُّ في المقضيّ الذي هو فعلُ العبد،"], [1166.0, "وليس الشرُّ في القضاء الذي هو فعلُ الله تبارك وتعالى."]], "tr": [[1130.0, "Şer ancak O'nun mef'ûllerine (fiilinin sonucu olan şeylere) girer, fiiline değil;"], [1137.0, "mahlûklarına girer, yaratma sıfatına değil."], [1142.0, "Şer, kulun fiili olan makdûrdadır (takdir edilen şeydedir);"], [1148.0, "Allah'ın fiili olan kaderde değil."], [1152.0, "Şer, kul olan mahlûktadır; Allah Azze ve Celle'ye nispet edilen yaratma sıfatında değil."], [1161.0, "Şer, kulun fiili olan makzîdedir (hükmedilen şeydedir);"], [1166.0, "Allah Tebâreke ve Teâlâ'nın fiili olan kazada değil."]]}, {"reader": false, "ar": [[1173.0, "فيجب تنزيهُ الله عز وجل في كلّ شيءٍ عن الشرّ؛"], [1180.0, "فالله عز وجل يوصف بالخيريّة المطلقة في ذاته،"], [1185.0, "وبالخيريّة المطلقة في أسمائه وصفاته،"], [1189.0, "وبالخيريّة المطلقة في أفعاله."], [1192.0, "وقد نصّ النبي صلى الله عليه وسلم على هذه الكلّيّة بقوله في دعاء الاستفتاح ـ كما في حديث عليٍّ في صحيح الإمام مسلم ـ قال:"], [1203.0, "«والشرُّ ليس إليك»، «ليس إليك»."]], "tr": [[1173.0, "Allah Azze ve Celle'yi her şeyde şerden tenzih etmek vâciptir."], [1180.0, "Allah Azze ve Celle zâtında mutlak hayırla, isim ve sıfatlarında mutlak hayırla, fiillerinde mutlak hayırla nitelenir."], [1189.0, "Nebî ﷺ, İmam Müslim'in Sahîh'indeki Ali (radıyallahu anh) hadisinde olduğu gibi, istiftah duasındaki şu sözüyle bu külliyeyi açıkça ifade etmiştir:"], [1192.0, "«Şer sana (nispet edilmez).» «Sana (nispet edilmez).»"]]}, {"reader": false, "ar": [[1206.4, "فإن قلتَ: وكيف نفعل بهذه الآلام والمصائب والأمراض التي تصيب الناس،"], [1219.9, "أوَليست شرًّا؟ الجواب: بلى،"], [1222.7, "ولكنها من الشرّ باعتبار وقوعها في أرض الله،"], [1227.8, "ولكن ليست شرًّا باعتبار تقديرها وخلقها،"], [1231.7, "كما سيأتي توضيحه أكثر في الكلّيّة التي بعدها."], [1237.2, "فإن قلتَ: أوَليس الكفر من الشرّ؟"], [1240.0, "فنقول: نعم، ولكنه شرٌّ باعتبار فعل المخلوق له،"], [1244.0, "لا باعتبار القضاء والقدر."]], "tr": [[1206.4, "\"İnsanlara isabet eden bu acılar, musibetler ve hastalıklar ne olacak?"], [1206.4, "Bunlar şer değil mi?\" dersen, cevap:"], [1219.9, "Evet (şerdir); fakat bunlar Allah'ın yeryüzünde meydana gelmeleri itibarıyla şerdendir;"], [1227.8, "takdir edilmeleri ve yaratılmaları itibarıyla ise şer değildir."], [1231.7, "Bunun açıklaması, sonraki külliyede daha fazla gelecektir."], [1237.2, "\"Küfür de şerden değil mi?\" dersen, deriz ki:"], [1240.0, "Evet; fakat o, mahlûkun onu işlemesi itibarıyla şerdir, kaza ve kader itibarıyla değil."]]}, {"reader": false, "ar": [[1246.0, "فإنّ الله قدّر الكفر قبل أن يخلق السماوات والأرض بخمسين ألف سنة،"], [1253.0, "فهل ظهرت آثارُ الكفر إذ كان قدرًا؟"], [1256.0, "الجواب: لا، ولكن لم تظهر آثارُه السيئةُ القبيحة إلا بعد أن تلبّس المخلوق به؛"], [1264.0, "فالمخلوق لمّا كفر ظهرت آثار الكفر."], [1267.0, "فشرُّ الكفر في مفعولات العبد،"], [1269.5, "ولكن ليس في قضاء الله عز وجل."]], "tr": [[1246.0, "Çünkü Allah küfrü, gökleri ve yeri yaratmadan elli bin yıl önce takdir etmiştir."], [1246.0, "Peki küfrün eserleri, o bir kader iken ortaya çıktı mı?"], [1256.0, "Cevap: Hayır. Onun kötü ve çirkin eserleri ancak mahlûk ona bulaştıktan sonra ortaya çıktı."], [1256.0, "Mahlûk küfredince küfrün eserleri ortaya çıktı."], [1264.0, "Küfrün şerri kulun işlediği şeylerdedir, Allah Azze ve Celle'nin kazasında değil."]]}, {"reader": false, "ar": [[1273.0, "وكذلك الزنا في أرض الله من الشرّ باعتبار فعل الزاني،"], [1278.0, "ولكنّ هذا الزنا قد كتبه الله عز وجل على العبد قبل أن يخلق السماوات والأرض بآلافٍ مؤلّفةٍ من السنين،"], [1288.0, "فهل ظهرت آثارُ الزنا إذ كان قضاءً وقدرًا؟"], [1292.8, "الجواب: لا، وإنما ظهرت آثارُه بعد أن وقع حقيقةً من فعل العبد."], [1300.0, "فالشرُّ في فعل العبد،"], [1301.8, "وليس في قضاء الله عز وجل وقدره."]], "tr": [[1273.0, "Aynı şekilde Allah'ın yeryüzündeki zina da zina edenin fiili itibarıyla şerdendir."], [1278.0, "Fakat bu zinayı Allah Azze ve Celle, gökleri ve yeri yaratmadan binlerce yıl önce kula yazmıştır."], [1278.0, "Peki zinanın eserleri, o bir kaza ve kader iken ortaya çıktı mı?"], [1288.0, "Cevap: Hayır. Onun eserleri ancak kulun fiiliyle gerçekten meydana geldikten sonra ortaya çıktı."], [1292.8, "Şer kulun fiilindedir, Allah Azze ve Celle'nin kaza ve kaderinde değil."]]}, {"reader": false, "ar": [[1305.0, "بل وجميعُ الذنوب والمعاصي لمّا قدّرها الله عز وجل،"], [1310.0, "وكانت قضاءً وقدرًا في اللوح المحفوظ مكتوبةً على العبد،"], [1315.0, "لم يظهر شيءٌ من شرّها أبدًا،"], [1319.0, "ولكن لمّا تلبّس المخلوق بها صارت شرًّا."], [1323.0, "وهذا معنى قولنا: الشرُّ في المقدور ـ أي فعل العبد ـ وليس في القدَر الذي هو فعلُ الله عز وجل،"], [1333.0, "وفي المقضيّ الذي هو فعلُ العبد،"], [1336.0, "وليس في القضاء الذي هو من فعل الله تبارك وتعالى."], [1340.0, "فالذي يخلط بين القدَر والمقدور،"], [1344.0, "والقضاء والمقضيّ، ربما يصيبه شيءٌ من هذا الخلط،"], [1350.0, "فينسب إلى الله عز وجل شيئًا من الشرّ."]], "tr": [[1305.0, "Hatta bütün günahlar ve isyanlar, Allah Azze ve Celle onları takdir ettiğinde ve Levh-i Mahfûz'da kula yazılmış bir kaza ve kader olduklarında, onların şerrinden hiçbir şey asla ortaya çıkmamıştı."], [1319.0, "Fakat mahlûk onlara bulaşınca şer hâline geldiler."], [1323.0, "\"Şer makdûrdadır —yani kulun fiilindedir—, Allah Azze ve Celle'nin fiili olan kaderde değil;"], [1323.0, "kulun fiili olan makzîdedir, Allah Tebâreke ve Teâlâ'nın fiilinden olan kazada değil\" sözümüzün anlamı budur."], [1336.0, "Kader ile makdûru, kaza ile makzîyi birbirine karıştıran kişiye bu karışıklıktan bir şey isabet edebilir de Allah Azze ve Celle'ye şerden bir şey nispet edebilir."]]}, {"reader": false, "ar": [[1355.0, "ولذلك تجد أنّ القرآن دائمًا لا ينسب الشرّ إلى الله عز وجل،"], [1363.0, "كما قال الله عز وجل عن الجنّ:"], [1366.1, "<span class=\"ayah\">﴿وَأَنَّا لَا نَدْرِي أَشَرٌّ أُرِيدَ بِمَن فِي الْأَرْضِ أَمْ أَرَادَ بِهِمْ رَبُّهُمْ رَشَدًا﴾<\/span> <span class=\"ref\">[الجن: ١٠]<\/span>."], [1376.0, "فلمّا جاؤوا في نسبة الشرّ ـ فمن كمال الأدب مع الله ـ بنَوه للمجهول ولم ينسبوه إلى الله عز وجل،"], [1385.0, "ولمّا جاءت إرادةُ الخير نسبوا إرادة الخير إلى الله عز وجل."], [1392.0, "فالشرُّ ليس إلى الله تبارك وتعالى."]], "tr": [[1355.0, "Bu yüzden Kur'an'ın şerri hiçbir zaman Allah Azze ve Celle'ye nispet etmediğini görürsün."], [1363.0, "Nitekim Allah Azze ve Celle cinlerden naklen şöyle buyurur:"], [1366.1, "<span class=\"ayah\">﴿Doğrusu biz, yeryüzündekilere bir şer mi dilendi, yoksa Rableri onlara bir hayır mı diledi, bilmiyoruz﴾<\/span> [Cin 10]."], [1366.1, "Şerri nispet etmeye gelince —Allah'a karşı edebin kemalinden dolayı— onu meçhul (edilgen) kalıpla söylediler ve Allah Azze ve Celle'ye nispet etmediler."], [1385.0, "Hayrı dilemeye gelince ise hayır dilemeyi Allah Azze ve Celle'ye nispet ettiler."], [1385.0, "Şer, Allah Tebâreke ve Teâlâ'ya (nispet edilmez)."]]}, {"reader": false, "ar": [[1395.0, "وكذلك لمّا بيّن الخضرُ أسبابَ فعله التي أنكرها ـ أو استنكرها ـ موسى عليه الصلاة والسلام،"], [1406.0, "قال: <span class=\"ayah\">﴿وَأَمَّا الْغُلَامُ فَكَانَ أَبَوَاهُ مُؤْمِنَيْنِ فَخَشِينَا أَن يُرْهِقَهُمَا طُغْيَانًا وَكُفْرًا ۝ فَأَرَدْنَا﴾<\/span> <span class=\"ref\">[الكهف: ٨٠–٨١]<\/span>،"], [1412.7, "أي بقتله. فنسب القتلَ له،"], [1416.2, "لأنّ ظاهر القتل شرّ؛"], [1420.0, "فمن أدب الخضر مع الله عز وجل لم ينسب هذا الشرّ إلى الله،"], [1425.4, "وإنما نسبه إلى نفسه."], [1427.0, "ولكن لمّا جاء إلى بناء الجدار الذي ظاهره خيرٌ قال:"], [1432.0, "<span class=\"ayah\">﴿فَأَرَادَ رَبُّكَ﴾<\/span> <span class=\"ref\">[الكهف: ٨٢]<\/span>، أي ببناء هذا الجدار."]], "tr": [[1395.0, "Aynı şekilde Hızır, Mûsâ'nın (aleyhissalâtu vesselâm) karşı çıktığı —ya da garip karşıladığı— fiillerinin sebeplerini açıkladığında şöyle dedi:"], [1406.0, "<span class=\"ayah\">﴿Çocuğa gelince, anası babası mümin kimselerdi. Onları azgınlık ve küfre sürüklemesinden korktuk. Bu yüzden istedik ki...﴾<\/span> [Kehf 80–81];"], [1406.0, "yani onu öldürmekle. Öldürmeyi kendine nispet etti, çünkü öldürmenin zahiri şerdir."], [1420.0, "Hızır, Allah Azze ve Celle'ye karşı edebinden dolayı bu şerri Allah'a nispet etmedi, kendine nispet etti."], [1427.0, "Fakat zahiri hayır olan duvarın inşasına gelince <span class=\"ayah\">﴿Rabbin istedi﴾<\/span> [Kehf 82] dedi; yani bu duvarın inşasını."]]}, {"reader": false, "ar": [[1439.0, "وكذلك لمّا جاء في خرق السفينة قال:"], [1443.9, "<span class=\"ayah\">﴿فَأَرَدتُّ أَنْ أَعِيبَهَا﴾<\/span> <span class=\"ref\">[الكهف: ٧٩]<\/span>، ولم يقل:"], [1447.0, "«فأراد ربك أن أعيبها»،"], [1449.0, "لأنّ خرق السفينة فعلٌ ظاهرُه أنه شرّ."], [1456.0, "فالشرُّ إنما يكون في مفعولاته ـ أي مخلوقاته ـ لا في فعله،"], [1465.0, "وفي مقدوراته ـ أي أفعال عباده ـ لا في قدَره،"], [1470.0, "وفي مقضيّه ـ أي فعل العبد ـ ولكن لا في قضائه."], [1475.0, "وهذا من توحيـ... وهذا من كمال توحيد الربوبية."]], "tr": [[1439.0, "Aynı şekilde geminin delinmesine gelince <span class=\"ayah\">﴿Onu kusurlu yapmak istedim﴾<\/span> [Kehf 79] dedi;"], [1443.9, "\"Rabbin onu kusurlu yapmamı istedi\" demedi."], [1447.0, "Çünkü gemiyi delmek, zahiri şer olan bir fiildir."], [1449.0, "Şer ancak O'nun mef'ûllerinde —yani mahlûklarında— olur, fiilinde değil;"], [1456.0, "makdûrlarında —yani kullarının fiillerinde— olur, kaderinde değil;"], [1470.0, "makzîsinde —yani kulun fiilinde— olur, kazasında değil."], [1475.0, "Bu, tevhid... bu, rubûbiyyet tevhidinin kemalindendir."]]}]}, {"ts": "24:40", "title": "5. Külliye: Kaderin akışında zahiri şer olan şey cüz'îdir, karşısında daha büyük bir hayır vardır", "paras": [{"reader": false, "ar": [[1480.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما ظاهرُه الشرُّ في مجريات الأقدار فجزئيٌّ يقابله خيرٌ أكثرُ منه.<\/b> كلُّ ما ظاهره الشرُّ في مجريات الأقدار فجزئيٌّ يقابله خيرٌ أعظمُ منه، أو أكثرُ منه."]], "tr": [[1480.0, "Külliyelerden biri de şudur: 5."], [1480.0, "külliye: Kaderin akışında zahiri şer olan her şey cüz'îdir;"], [1480.0, "karşısında ondan daha çok bir hayır vardır. (Tekrar ediyor:) Kaderin akışında zahiri şer olan her şey cüz'îdir;"], [1480.0, "karşısında ondan daha büyük ya da daha çok bir hayır vardır."]]}, {"reader": false, "ar": [[1521.0, "فنحن نُقرّ بأنّ في موجودات هذا الكون شيئًا من الشرّ:"], [1531.0, "فالشيطانُ وجودُه شرّ، والكفرُ وجودُه شرّ،"], [1537.0, "والذنوبُ والمعاصي والبدعُ وجودُها شرّ،"], [1541.0, "والأمراضُ والآلامُ أيضًا وجودُها شرّ."], [1549.0, "ولكن إيّاك أن تجعلها من الشرّ المحض الذي ليس بمقابَلٍ بشيءٍ من الخير."]], "tr": [[1521.0, "Biz bu kâinattaki varlıklarda bir miktar şer bulunduğunu kabul ederiz:"], [1531.0, "Şeytanın varlığı şerdir, küfrün varlığı şerdir, günahların, isyanların ve bid'atlerin varlığı şerdir, hastalıkların ve acıların varlığı da şerdir."], [1549.0, "Fakat sakın bunları, karşısında hiçbir hayır bulunmayan katıksız şerden sayma."]]}, {"reader": false, "ar": [[1556.0, "فكلُّ شرٍّ في هذا الوجود فلا بد أن تنظر فيه من جهتين:"], [1562.0, "الجهة الأولى: أنه شرٌّ جزئيٌّ وليس شرًّا محضًا؛"], [1566.0, "فالله لا يوجد في كونه ولا يخلق شرًّا محضًا أبدًا،"], [1570.0, "فالشرّيّةُ المحضة لا يجوز أبدًا أن تُنسب إلى الله عز وجل،"], [1577.0, "خلقًا ولا تقديرًا. الأمر الثاني:"], [1583.1, "أنّ هذا الشرّ إنما هو شرٌّ من جهةٍ واحدة،"], [1588.0, "ولكنه لا بد أن يكون مقابَلًا بخيرٍ كثير،"], [1594.0, "قد لا يعلمه على التفصيل إلا الله تبارك وتعالى."]], "tr": [[1556.0, "Bu varlık âlemindeki her şere mutlaka iki yönden bakmalısın."], [1556.0, "Birinci yön: O, cüz'î bir şerdir, katıksız bir şer değildir."], [1562.0, "Allah kâinatında asla katıksız bir şer var etmez ve yaratmaz."], [1570.0, "Katıksız şerlik, ne yaratma ne de takdir bakımından asla Allah Azze ve Celle'ye nispet edilemez."], [1577.0, "İkinci husus: Bu şer, yalnızca bir yönden şerdir;"], [1583.1, "fakat mutlaka karşısında, ayrıntısını belki de Allah Tebâreke ve Teâlâ'dan başkasının bilmediği pek çok hayır vardır."]]}, {"reader": false, "ar": [[1599.0, "فالآلامُ والأمراضُ والأوبئةُ والقحطُ وموتُ البهائم،"], [1605.0, "والحوادثُ والمصائبُ التي يُجريها الله عز وجل على العباد،"], [1610.0, "هي شرٌّ باعتبار أنها تُنقص شيئًا من دينهم أو دنياهم،"], [1614.0, "إلا أنها خيرٌ باعتبار كونها مكفِّرةً لذنوبهم وآثامهم،"], [1620.0, "وباعتبار كونها رادّةً لقلوبهم إلى الله عز وجل،"], [1625.0, "ومبيِّنةً ضعفَهم أمام كمال قدرته تبارك وتعالى،"], [1630.0, "كما قال الله عز وجل:"], [1632.5, "<span class=\"ayah\">﴿ظَهَرَ الْفَسَادُ فِي الْبَرِّ وَالْبَحْرِ بِمَا كَسَبَتْ أَيْدِي النَّاسِ لِيُذِيقَهُم بَعْضَ الَّذِي عَمِلُوا﴾<\/span>،"], [1639.0, "ثم بيّن الخير الذي فيه في قوله: <span class=\"ayah\">﴿لَعَلَّهُمْ يَرْجِعُونَ﴾<\/span> <span class=\"ref\">[الروم: ٤١]<\/span>."]], "tr": [[1599.0, "Acılar, hastalıklar, salgınlar, kıtlık, hayvanların ölümü ve Allah Azze ve Celle'nin kullar üzerinde cereyan ettirdiği kazalar ve musibetler, dinlerinden veya dünyalarından bir şeyi eksiltmeleri itibarıyla şerdir."], [1614.0, "Ancak günahlarına ve veballerine kefaret olmaları, kalplerini Allah Azze ve Celle'ye döndürmeleri ve O'nun kudretinin kemali karşısında zayıflıklarını göstermeleri itibarıyla hayırdır."], [1630.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1632.5, "<span class=\"ayah\">﴿İnsanların kendi elleriyle kazandıkları yüzünden karada ve denizde bozulma ortaya çıktı; Allah, yaptıklarının bir kısmını onlara tattırsın diye﴾<\/span>."], [1639.0, "Sonra bundaki hayrı şu sözüyle açıkladı:"], [1639.0, "<span class=\"ayah\">﴿Umulur ki dönerler﴾<\/span> [Rûm 41]."]]}, {"reader": false, "ar": [[1644.0, "وقال الله عز وجل:"], [1646.0, "<span class=\"ayah\">﴿وَلَنُذِيقَنَّهُم مِّنَ الْعَذَابِ الْأَدْنَىٰ﴾<\/span> ـ وهو شرٌّ بالنسبة لهم ـ <span class=\"ayah\">﴿دُونَ الْعَذَابِ الْأَكْبَرِ لَعَلَّهُمْ يَرْجِعُونَ﴾<\/span> <span class=\"ref\">[السجدة: ٢١]<\/span>."], [1654.0, "وكم من إنسانٍ يعجز عن أعلى مراتب الجنة بأعماله،"], [1660.0, "ولكن يبتليه الله عز وجل بشيءٍ هو يراه على نفسه من الشرّ،"], [1664.0, "إلا أنه يبلغ به مراتبَ في الجنة لو جلس عُمُرَ نوحٍ وهو يعمل لما بلغها،"], [1671.0, "كما في قول النبي صلى الله عليه وسلم:"], [1675.0, "«إنّ العبد إذا سبقت له المنزلةُ من الله لم يبلغها بعمله، ابتلاه الله عز وجل في نفسه أو في ماله أو في ولده، ثم صبّره على ذلك البلاء، حتى يُبلِّغه المنزلةَ التي سبقت له من الله»."]], "tr": [[1644.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1646.0, "<span class=\"ayah\">﴿Andolsun, belki dönerler diye onlara en büyük azaptan önce yakın azaptan tattıracağız﴾<\/span> [Secde 21] —bu (yakın azap) onlara göre şerdir—."], [1646.0, "Nice insan amelleriyle cennetin en yüksek derecelerine ulaşmaktan acizdir;"], [1654.0, "fakat Allah Azze ve Celle onu, kendisi için şer olarak gördüğü bir şeyle imtihan eder ve o bununla cennette öyle derecelere ulaşır ki Nûh'un ömrü kadar oturup amel etse onlara ulaşamazdı."], [1664.0, "Nitekim Nebî ﷺ şöyle buyurur:"], [1671.0, "«Kul için Allah katında bir derece önceden takdir edilmiş olur da ona ameliyle ulaşamazsa, Allah Azze ve Celle onu canında, malında veya çocuğunda bir belayla imtihan eder; sonra o belaya karşı ona sabır verir; nihayet onu Allah katında kendisi için önceden takdir edilmiş dereceye ulaştırır.»"]]}, {"reader": false, "ar": [[1691.0, "وموتُ الأقارب لا جرمَ أنه مصيبة،"], [1696.1, "كما وصف الله عز وجل ذلك في قوله:"], [1700.4, "<span class=\"ayah\">﴿فَأَصَابَتْكُم مُّصِيبَةُ الْمَوْتِ﴾<\/span> <span class=\"ref\">[المائدة: ١٠٦]<\/span>، إلا أنّ ما يعقبه بعد ذلك من الصبر واحتسابِ الأجر والرضا بالقضاء والحوقلة،"], [1711.0, "فإنّ ذلك من الخير العظيم الذي قد لا يناله الإنسان إلا بجريان هذه المصيبة في قدر الله عز وجل،"], [1719.0, "كما قال الله عز وجل:"], [1721.8, "<span class=\"ayah\">﴿وَلَنَبْلُوَنَّكُم بِشَيْءٍ مِّنَ الْخَوْفِ وَالْجُوعِ وَنَقْصٍ مِّنَ الْأَمْوَالِ وَالْأَنفُسِ وَالثَّمَرَاتِ﴾<\/span> ـ وإيش؟"], [1728.0, "ـ <span class=\"ayah\">﴿وَبَشِّرِ الصَّابِرِينَ ۝ الَّذِينَ إِذَا أَصَابَتْهُم مُّصِيبَةٌ﴾<\/span> ـ أي وهم يرونها من الشرّ ـ <span class=\"ayah\">﴿قَالُوا إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٥٥–١٥٦]<\/span>."]], "tr": [[1691.0, "Yakınların ölümü şüphesiz bir musibettir;"], [1696.1, "nitekim Allah Azze ve Celle onu şu sözüyle nitelemiştir:"], [1700.4, "<span class=\"ayah\">﴿Size ölüm musibeti isabet ederse﴾<\/span> [Mâide 106]."], [1700.4, "Ancak ardından gelen sabır, ecrini Allah'tan umma, kazaya rıza ve havkale (lâ havle velâ kuvvete illâ billâh demek), insanın belki de ancak bu musibetin Allah Azze ve Celle'nin kaderinde cereyan etmesiyle elde edebileceği büyük hayırdandır."], [1721.8, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1721.8, "<span class=\"ayah\">﴿Andolsun, sizi biraz korku, açlık, mallardan, canlardan ve ürünlerden eksiltme ile imtihan edeceğiz﴾<\/span> —sonra ne (geliyor)?— <span class=\"ayah\">﴿Sabredenleri müjdele. Onlar ki kendilerine bir musibet isabet ettiğinde﴾<\/span> —yani onu şer olarak gördükleri hâlde— <span class=\"ayah\">﴿\"Biz Allah'a aitiz ve şüphesiz O'na döneceğiz\" derler﴾<\/span> [Bakara 155–156]."]]}, {"reader": false, "ar": [[1739.0, "ثم انظر إلى الخيرات العظيمة المترتّبة على ذلك في قوله:"], [1742.0, "<span class=\"ayah\">﴿أُولَٰئِكَ عَلَيْهِمْ صَلَوَاتٌ مِّن رَّبِّهِمْ وَرَحْمَةٌ ۖ وَأُولَٰئِكَ هُمُ الْمُهْتَدُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٥٧]<\/span>."], [1748.0, "ولذلك قال العلماء: إنّ العبد ليبلغ من منازل الجنة العليا بصبره ورضاه على مصابه في الدنيا أعظمَ مما يحصّله بعمله."]], "tr": [[1739.0, "Sonra bunun üzerine terettüp eden büyük hayırlara şu sözünde bak:"], [1742.0, "<span class=\"ayah\">﴿İşte Rablerinden bağışlamalar ve rahmet onlaradır ve doğru yolu bulanlar da onlardır﴾<\/span> [Bakara 157]."], [1742.0, "Bu yüzden âlimler şöyle demiştir:"], [1748.0, "Kul, dünyadaki musibetine sabrı ve rızası sayesinde cennetin yüksek menzillerinden, ameliyle elde edeceğinden daha büyüğüne ulaşır."]]}, {"reader": false, "ar": [[1760.0, "وفي جامع الإمام الترمذي بإسنادٍ حسن من حديث أنسٍ رضي الله عنه قال:"], [1770.0, "قال النبي صلى الله عليه وسلم:"], [1773.0, "«إذا أراد الله بعبده الخيرَ عجّل له العقوبةَ في الدنيا» ـ والعقوبةُ تنزل على العبد وهو يراها من الشرّ،"], [1782.0, "إلا أنها عند الله خيرٌ له ـ «وإذا أراد الله بعبده الشرَّ أمسك عنه بذنبه حتى يوافيَ به يوم القيامة»."], [1793.0, "ويقول النبي صلى الله عليه وسلم:"], [1796.0, "«لا يزال البلاءُ بالمؤمن أو المؤمنة في نفسه أو ولده أو ماله حتى يمشيَ على الأرض ما عليه خطيئة»."]], "tr": [[1760.0, "İmam Tirmizî'nin el-Câmi'inde hasen bir senedle Enes'in (radıyallahu anh) hadisinden (rivayet edildiğine göre) Nebî ﷺ şöyle buyurdu:"], [1773.0, "«Allah kulu için hayır dilediğinde cezasını dünyada öne alır.» —Ceza kulun başına gelir ve o onu şer olarak görür;"], [1773.0, "fakat o, Allah katında onun için hayırdır.— «Allah kulu için şer dilediğinde, günahının (cezasını) ondan tutar; nihayet kıyamet günü onu tam olarak ona öder.» Nebî ﷺ şöyle de buyurur:"], [1793.0, "«Bela, mümin erkeğin ya da mümin kadının canında, çocuğunda veya malında devam eder; nihayet üzerinde hiçbir günah olmadan yeryüzünde yürür.»"]]}]}, {"ts": "30:07", "title": "5. Külliye (devam): Hastalığın hayrı; Allah şerri kevnî iradesiyle diler", "paras": [{"reader": false, "ar": [[1807.0, "ولمّا دخل النبي صلى الله عليه وسلم على أمّ السائب فقال:"], [1813.6, "«يا أمَّ السائب، ما لكِ تُزَفْزِفين؟» قالت:"], [1817.7, "الحُمّى، لا بارك الله فيها."], [1821.0, "فقال: «لا تسبّي الحُمّى، فإنها تُذهب خطايا بني آدم كما يُذهب الكيرُ خبثَ الحديد» <span class=\"note\">(Müslim)<\/span>،"], [1828.1, "أو كما قال صلى الله عليه وسلم."], [1831.0, "ويقول صلى الله عليه وسلم لمّا عاد مريضًا أصابته الحُمّى،"], [1837.0, "قال: «أبشر، فإنّ الله عز وجل يقول: هي ناري أسلّطها على من أشاء من عبادي، لتكون حظَّه من نار الآخرة»."]], "tr": [[1807.0, "Nebî ﷺ Ümmü's-Sâib'in yanına girdiğinde \"Ey Ümmü's-Sâib!"], [1807.0, "Neyin var, titriyorsun?\" buyurdu. O da \"Sıtma;"], [1813.6, "Allah onu bereketlendirmesin\" dedi. Bunun üzerine Nebî ﷺ şöyle buyurdu:"], [1821.0, "«Sıtmaya sövme! Çünkü o, körüğün demirin pasını giderdiği gibi Âdemoğullarının günahlarını giderir.» <span class=\"note\">(Müslim)<\/span> —ya da Nebî ﷺ'in buyurduğu gibi—."], [1828.1, "Nebî ﷺ sıtmaya yakalanmış bir hastayı ziyaret ettiğinde şöyle buyurmuştur:"], [1831.0, "«Müjdeler olsun! Çünkü Allah Azze ve Celle şöyle buyuruyor: O benim ateşimdir; onu kullarımdan dilediğime musallat ederim ki âhiret ateşinden onun payı olsun.»"]]}, {"reader": false, "ar": [[1847.0, "فلم يخلق الله عز وجل شرًّا محضًا أبدًا،"], [1853.0, "بل جميعُ الشرّ الذي نراه علينا أو على غيرنا ـ أيًّا كان نوعُه ـ لا بد أن يُنظر له بأنه شرٌّ جزئيٌّ لا كلّي،"], [1864.0, "وأنه مقابَلٌ بالخير الذي لا يعلم الغُنْمَ فيه على وجه التفصيل إلا الله تبارك وتعالى. والله أعلم."]], "tr": [[1847.0, "Allah Azze ve Celle asla katıksız bir şer yaratmamıştır."], [1853.0, "Aksine bizim üzerimizde ya da başkalarının üzerinde gördüğümüz her şere —türü ne olursa olsun— küllî değil cüz'î bir şer olarak bakılmalıdır;"], [1853.0, "karşısında da, içindeki kazancı ayrıntılı olarak Allah Tebâreke ve Teâlâ'dan başkasının bilmediği bir hayır vardır. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[1878.0, "فإن قلتَ: هل الله عز وجل يريد الشرّ في كونه؟"], [1882.0, "فقل: نعم، ولكن يريده بإرادته الكونية لا بإرادته الشرعية."], [1891.0, "والله عز وجل لا يريد الشرّ لذاته،"], [1895.0, "وإنما يريده بإرادته الكونية لما يترتّب عليه من الآثار الشرعية والخير العظيم الذي لا يكون إلا بجريان هذا الشرّ."]], "tr": [[1878.0, "\"Allah Azze ve Celle kâinatında şerri diler mi?\" dersen, de ki:"], [1882.0, "Evet; fakat onu şer'î iradesiyle değil, kevnî iradesiyle diler."], [1891.0, "Allah Azze ve Celle şerri zâtı için dilemez;"], [1895.0, "onu, üzerine terettüp eden şer'î sonuçlar ve ancak bu şerrin cereyan etmesiyle olabilecek büyük hayır için kevnî iradesiyle diler."]]}]}, {"ts": "31:49", "title": "6. Külliye: Allah'ın yarattıkları hakkındaki bütün fiilleri fazl ile adl arasında döner", "paras": [{"reader": false, "ar": [[1909.0, "ومن الكلّيّات أيضًا: <b>كلُّ أفعال الله عز وجل في خلقه دائرةٌ بين فضلٍ وعدل.<\/b> كلُّ أفعال الله عز وجل في خلقه دائرةٌ بين فضلٍ وعدل."], [1934.0, "أقول: واحذر من الاحتمال الثالث،"], [1938.0, "وهو الظلم؛ فالله عز وجل لا يظلم أحدًا من عباده أبدًا،"], [1945.0, "كما قال الله عز وجل:"], [1947.0, "<span class=\"ayah\">﴿وَلَا يَظْلِمُ رَبُّكَ أَحَدًا﴾<\/span> <span class=\"ref\">[الكهف: ٤٩]<\/span> ـ نكرةٌ في سياق النفي فتعُمّ ـ،"], [1951.0, "وقال الله عز وجل:"], [1953.9, "<span class=\"ayah\">﴿وَمَا رَبُّكَ بِظَلَّامٍ لِّلْعَبِيدِ﴾<\/span> <span class=\"ref\">[فصلت: ٤٦]<\/span>."]], "tr": [[1909.0, "Külliyelerden biri de şudur: 6."], [1909.0, "külliye: Allah Azze ve Celle'nin yarattıkları hakkındaki bütün fiilleri fazl (lütuf) ile adl (adalet) arasında döner. (Tekrar ediyor.) Derim ki:"], [1909.0, "Üçüncü ihtimalden, yani zulümden sakın."], [1934.0, "Allah Azze ve Celle kullarından hiçbirine asla zulmetmez."], [1938.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [1945.0, "<span class=\"ayah\">﴿Rabbin kimseye zulmetmez﴾<\/span> [Kehf 49] —(buradaki \"kimse\" kelimesi) nefy bağlamında nekiredir, dolayısıyla umum ifade eder—."], [1951.0, "Allah Azze ve Celle şöyle de buyurur:"], [1953.9, "<span class=\"ayah\">﴿Rabbin kullarına zulmedici değildir﴾<\/span> [Fussilet 46]."]]}, {"reader": false, "ar": [[1958.0, "ويقول النبي صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل أنه قال:"], [1965.0, "«يا عبادي، إني حرّمتُ الظلمَ على نفسي، وجعلتُه بينكم محرّمًا، فلا تظالموا» <span class=\"note\">(Müslim)<\/span>."], [1971.0, "فمجرياتُ أفعال الله عز وجل في عباده دائرةٌ بين من يعامله بعدله،"], [1978.0, "وبين من يعامله بفضله."], [1982.0, "فالله عز وجل يهدي من يشاء من عباده فضلًا،"], [1987.5, "ويُضلّ من يشاء عدلًا؛"], [1990.0, "فهدايته فضلٌ، وإضلاله عدل."], [1995.0, "ويعطي من يشاء فضلًا،"], [1997.9, "ويمنع من يشاء عدلًا."], [2002.0, "ويُثيب من يشاء فضلًا،"], [2004.9, "ويعاقب من يشاء عدلًا."]], "tr": [[1958.0, "Nebî ﷺ Rabbi Azze ve Celle'den rivayet ettiği (hadiste) O'nun şöyle buyurduğunu bildirir:"], [1958.0, "«Ey kullarım! Ben zulmü kendime haram kıldım ve onu aranızda da haram kıldım; o hâlde birbirinize zulmetmeyin.» <span class=\"note\">(Müslim)<\/span>."], [1965.0, "Allah Azze ve Celle'nin kulları hakkındaki fiillerinin akışı, adaletiyle muamele ettiği kimse ile lütfuyla muamele ettiği kimse arasında döner."], [1978.0, "Allah Azze ve Celle kullarından dilediğine lütfuyla hidayet verir, dilediğini adaletiyle saptırır;"], [1987.5, "O'nun hidayet vermesi fazldır, saptırması adldir."], [1990.0, "Dilediğine lütfuyla verir, dilediğinden adaletiyle alıkoyar."], [1997.9, "Dilediğine lütfuyla sevap verir, dilediğini adaletiyle cezalandırır."]]}, {"reader": false, "ar": [[2009.0, "ويُنعم ـ أي ويُصيب بنعمته ـ من يشاء فضلًا،"], [2013.6, "ويُنزل نقمتَه وغضبَه وعذابَه وأليمَ عقابه على من يشاء عدلًا."], [2025.0, "فالله عز وجل لا يظلم أحدًا من عباده،"], [2030.0, "كما قال الله عز وجل:"], [2033.4, "<span class=\"ayah\">﴿مَن جَاءَ بِالْحَسَنَةِ فَلَهُ عَشْرُ أَمْثَالِهَا﴾<\/span> ـ فضلًا ـ <span class=\"ayah\">﴿وَمَن جَاءَ بِالسَّيِّئَةِ فَلَا يُجْزَىٰ إِلَّا مِثْلَهَا﴾<\/span> <span class=\"ref\">[الأنعام: ١٦٠]<\/span> ـ عدلًا."], [2045.0, "أنتم معي في هذا ولّا لا؟"], [2049.0, "فهذه الكلّيّة تبيّن لك أنه ليس ثَمّةَ احتمالٌ ثالثٌ في مجريات أفعال الله عز وجل مع عباده. والله أعلم."]], "tr": [[2009.0, "Dilediğine lütfuyla nimet verir —yani nimetini ulaştırır—;"], [2013.6, "intikamını, gazabını, azabını ve elem verici cezasını da dilediğine adaletiyle indirir."], [2025.0, "Allah Azze ve Celle kullarından hiçbirine zulmetmez."], [2030.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2033.4, "<span class=\"ayah\">﴿Kim bir iyilikle gelirse ona on katı vardır﴾<\/span> —bu fazldır— <span class=\"ayah\">﴿Kim de bir kötülükle gelirse ancak onun dengiyle cezalandırılır﴾<\/span> [En'âm 160] —bu da adldir—."], [2033.4, "Benimle birlikte misiniz, değil misiniz?"], [2045.0, "Bu külliye sana Allah Azze ve Celle'nin kullarıyla ilgili fiillerinin akışında üçüncü bir ihtimalin olmadığını gösterir. Allah en iyisini bilir."]]}]}, {"ts": "34:19", "title": "7. Külliye: Her şey Allah'ın tam kudretiyle O'nun kudreti dahilindedir", "paras": [{"reader": false, "ar": [[2059.0, "ومن الكلّيّات أيضًا ـ ما أدري كم الرقمُ عندكم <span class=\"q\">؟ 34:19<\/span> ـ:"], [2063.0, "<b>كلُّ شيءٍ فمقدورٌ لله تعالى بالقدرة التامة.<\/b> كلُّ شيءٍ فمقدورٌ لله عز وجل بالقدرة التامة."], [2080.0, "أقول وبالله التوفيق: فكلُّ ما يدخل في اسم «الشيء» فإنه لا يخرج أن يكون مقدورًا لله عز وجل بكمال قدرته المطلقة المتناهية،"], [2097.0, "كما قال الله عز وجل:"], [2100.1, "<span class=\"ayah\">﴿وَمَا كَانَ اللَّهُ لِيُعْجِزَهُ مِن شَيْءٍ فِي السَّمَاوَاتِ وَلَا فِي الْأَرْضِ﴾<\/span> <span class=\"ref\">[فاطر: ٤٤]<\/span>."]], "tr": [[2059.0, "Külliyelerden biri de şudur —sizde numarası kaçtır bilmiyorum <span class=\"q\">؟<\/span>—:"], [2059.0, "<b>7. külliye: Her şey, Allah Teâlâ'nın tam kudretiyle O'nun kudreti dahilindedir.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [2080.0, "\"Şey\" isminin kapsamına giren her şey, Allah Azze ve Celle'nin mutlak ve son noktaya varmış kudretinin kemaliyle O'nun kudreti dahilinde olmaktan çıkmaz."], [2100.1, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2100.1, "<span class=\"ayah\">﴿Göklerde ve yerde hiçbir şey Allah'ı aciz bırakamaz﴾<\/span> [Fâtır 44]."]]}, {"reader": false, "ar": [[2107.0, "وبدأ بالسماوات قبل الأرض هنا لأنّ أجرام السماء أكبرُ من أجرام الأرض؛"], [2114.0, "فنفى الله عز وجل عن نفسه أن يُعجزه الشيءُ الضخم الكبير."], [2119.0, "وفي آياتٍ كثيرةٍ يقول الله عز وجل:"], [2123.7, "<span class=\"ayah\">﴿إِنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ﴾<\/span> <span class=\"ref\">[البقرة: ٢٠]<\/span>،"], [2128.0, "وقال الله عز وجل:"], [2130.4, "<span class=\"ayah\">﴿وَكَانَ اللَّهُ عَلَىٰ كُلِّ شَيْءٍ مُّقْتَدِرًا﴾<\/span> <span class=\"ref\">[الكهف: ٤٥]<\/span>."], [2134.0, "فالله لا يُعجزه شيءٌ في الأرض ولا في السماء أبدًا،"], [2138.0, "مهما كان ذلك الشيء."], [2141.0, "وهذا دليلٌ على كمال قدرته تبارك وتعالى،"], [2145.0, "والتي من أجلها استحقّ أن يكون هو الربّ الذي لا ربَّ سواه،"], [2151.0, "والإله الذي لا يجوز أن يُعبد غيرُه تبارك وتعالى."]], "tr": [[2107.0, "Burada gökleri yerden önce zikretti, çünkü göğün cisimleri yerin cisimlerinden daha büyüktür."], [2114.0, "Allah Azze ve Celle, iri ve büyük şeyin kendisini aciz bırakmasını kendinden nefyetti."], [2119.0, "Birçok ayette Allah Azze ve Celle şöyle buyurur:"], [2123.7, "<span class=\"ayah\">﴿Şüphesiz Allah her şeye kadirdir﴾<\/span> [Bakara 20]."], [2128.0, "Allah Azze ve Celle şöyle de buyurmuştur:"], [2130.4, "<span class=\"ayah\">﴿Allah her şeye hakkıyla güç yetirendir﴾<\/span> [Kehf 45]."], [2134.0, "Allah'ı yerde ve gökte, ne olursa olsun hiçbir şey asla aciz bırakamaz."], [2138.0, "Bu, O'nun kudretinin kemaline delildir;"], [2141.0, "O, bu kudret sebebiyle kendisinden başka Rab olmayan Rab ve kendisinden başkasına ibadet edilmesi caiz olmayan ilah olmaya müstahak olmuştur."]]}, {"reader": false, "ar": [[2155.0, "فإن قلتَ: ولماذا قلتَ في الكلّيّة «كلُّ شيء»؟"], [2163.0, "الجواب: لأنّ كثيرًا من الناس يفرض احتمالاتٍ على كمال قدرة الله عز وجل،"], [2171.0, "وهي لا تدخل في مسمّى الشيء؛"], [2177.0, "وذلك لأنّ المُحال ينقسم إلى قسمين:"], [2183.0, "إلى محالٍ لذاته، وإلى محالٍ لغيره."], [2191.0, "وكلُّ ما كان محالًا لذاته فليس بشيء."]], "tr": [[2155.0, "\"Külliyede neden 'her şey' dedin?\" dersen, cevap:"], [2155.0, "Çünkü insanların birçoğu Allah Azze ve Celle'nin kudretinin kemali hakkında, \"şey\" kavramına girmeyen ihtimaller farz eder."], [2171.0, "Bunun sebebi, muhalin iki kısma ayrılmasıdır:"], [2177.0, "Zâtı gereği muhal (muhal li-zâtihî) ve başka bir sebeple muhal (muhal li-ğayrihî)."], [2191.0, "Zâtı gereği muhal olan her şey, \"şey\" değildir."]]}, {"reader": false, "ar": [[2199.0, "وعلى ذلك جوابُ السؤال القديم:"], [2202.0, "أوَيستطيع الله أن يخلق حجرًا لا يستطيع أن يحمله؟"], [2207.0, "لأننا نجيب بقولنا: إنّ هذا الحجر بهذه الأوصاف لا يدخل في مسمّى الشيء،"], [2214.0, "ولكن فرضتموه شيئًا، وكان سؤالكم مبنيًّا على إدخال هذا الشيء في مسمّى الأشياء."], [2226.0, "وكقول قائلهم: هل يستطيع الله عز وجل أن يخلق إلهًا آخر؟"], [2234.0, "فإنّ وجود هذا الإله مع الله عز وجل محالٌ لذاته،"], [2240.0, "وما كان محالًا لذاته فلا يصحّ أن يوصف بأنه شيء؛"], [2245.0, "فالمستحيل لذاته لا يكون شيئًا."]], "tr": [[2199.0, "Şu eski sorunun cevabı da buna dayanır:"], [2199.0, "\"Allah, kaldıramayacağı bir taş yaratabilir mi?\" Çünkü biz şöyle cevap veririz:"], [2207.0, "Bu vasıflardaki bu taş \"şey\" kavramına girmez;"], [2207.0, "fakat siz onu bir şey olarak farz ettiniz ve sorunuz bu şeyi \"şeyler\" kavramına dahil etmeye dayandı."], [2214.0, "Onlardan birinin \"Allah Azze ve Celle başka bir ilah yaratabilir mi?\" demesi de böyledir."], [2226.0, "Çünkü bu ilahın Allah Azze ve Celle ile birlikte var olması zâtı gereği muhaldir;"], [2234.0, "zâtı gereği muhal olan şeyin \"şey\" olarak nitelenmesi doğru değildir."], [2245.0, "Zâtı gereği imkânsız olan bir şey olmaz."]]}, {"reader": false, "ar": [[2251.0, "كقولك: هل تجتمع الحركة والسكون في وقتٍ واحدٍ في عينٍ من الأعيان؟"], [2260.0, "الجواب: اجتماعُ النقيضين محالٌ لذاته فليس بشيء،"], [2264.0, "وارتفاعُ النقيضين محالٌ لذاته فليس بشيء."], [2273.0, "فمشكلةُ مثل هذه الأسئلة ـ مع حرمة طرحها وابتلاء المسلمين بها ـ هي أنهم يفرضون شيئًا من المحال لذاته،"], [2283.6, "ويُدخلونه في اسم الشيء،"], [2286.2, "ثم يسألون: هل يستطيع الله فعلَه أو لا؟"], [2291.4, "فلا بد من الانتباه لذلك."]], "tr": [[2251.0, "Tıpkı \"Hareket ve sükûn, tek bir varlıkta aynı anda bir araya gelebilir mi?\" demen gibi."], [2251.0, "Cevap: İki çelişiğin bir araya gelmesi zâtı gereği muhaldir, dolayısıyla \"şey\" değildir;"], [2260.0, "iki çelişiğin birlikte ortadan kalkması da zâtı gereği muhaldir, dolayısıyla \"şey\" değildir."], [2273.0, "Bu tür soruların —onları sormanın haram olmasıyla ve Müslümanların bunlarla imtihan edilmesiyle birlikte— sorunu şudur:"], [2273.0, "Zâtı gereği muhal olan bir şeyi farz ediyorlar, onu \"şey\" isminin kapsamına sokuyorlar, sonra \"Allah bunu yapabilir mi, yapamaz mı?\" diye soruyorlar. Buna dikkat etmek gerekir."]]}, {"reader": false, "ar": [[2294.7, "فإن قلتَ: وما معنى قول النصارى لابن مريم عليه الصلاة والسلام:"], [2303.0, "<span class=\"ayah\">﴿هَلْ يَسْتَطِيعُ رَبُّكَ أَن يُنَزِّلَ عَلَيْنَا مَائِدَةً مِّنَ السَّمَاءِ﴾<\/span> <span class=\"ref\">[المائدة: ١١٢]<\/span>؟"], [2308.0, "فنقول: إنّ نزول هذه المائدة من السماء ليست من المستحيل لذاته،"], [2315.0, "وإنما من المستحيل لغيره،"], [2318.0, "وكلُّ ما كان مستحيلًا لغيره فيصحّ إطلاقُ الشيء عليه."], [2325.0, "فإذا قيل لك: هل المستحيل لذاته شيء؟"], [2330.0, "فقل: المستحيل لذاته ليس بشيء."], [2334.0, "فإن قيل لك: هل المستحيل لغيره شيء؟"], [2338.7, "فقل: المستحيل لغيره يوصف بأنه شيء."]], "tr": [[2294.7, "\"Hristiyanların Meryem oğluna (aleyhissalâtu vesselâm) <span class=\"ayah\">﴿Rabbin bize gökten bir sofra indirebilir mi?﴾<\/span> [Mâide 112] demelerinin anlamı nedir?\" dersen, deriz ki:"], [2303.0, "Bu sofranın gökten inmesi zâtı gereği imkânsız olanlardan değil, başka bir sebeple imkânsız olanlardandır."], [2308.0, "Başka bir sebeple imkânsız olan her şeye \"şey\" denmesi doğrudur."], [2318.0, "Sana \"Zâtı gereği imkânsız olan şey midir?\" denirse, de ki:"], [2325.0, "Zâtı gereği imkânsız olan şey değildir."], [2330.0, "Sana \"Başka bir sebeple imkânsız olan şey midir?\" denirse, de ki:"], [2334.0, "Başka bir sebeple imkânsız olan \"şey\" olarak nitelenir."]]}, {"reader": false, "ar": [[2345.0, "فالله عز وجل قادرٌ على إيجاد المستحيل لغيره؛"], [2352.0, "فالمائدة التي طُلبت من عيسى عليه الصلاة والسلام ليست من قبيل المستحيل لذاته،"], [2359.0, "وإنما من قبيل المستحيل لغيره،"], [2363.0, "ولذلك قال الله عز وجل:"], [2366.6, "<span class=\"ayah\">﴿إِنِّي مُنَزِّلُهَا عَلَيْكُمْ﴾<\/span> <span class=\"ref\">[المائدة: ١١٥]<\/span>، الآياتِ بتمامها."]], "tr": [[2345.0, "Allah Azze ve Celle başka bir sebeple imkânsız olanı var etmeye kadirdir."], [2352.0, "Îsâ'dan (aleyhissalâtu vesselâm) istenen sofra, zâtı gereği imkânsız olanlar kabilinden değil, başka bir sebeple imkânsız olanlar kabilindendir."], [2363.0, "Bu yüzden Allah Azze ve Celle <span class=\"ayah\">﴿Ben onu size indireceğim﴾<\/span> [Mâide 115] buyurmuştur; ayetlerin tamamı (okunabilir)."]]}]}, {"ts": "39:31", "title": "7. Külliye (devam): \"Allah dilediğine kadirdir\" sözü ve muhâlefet mefhumu", "paras": [{"reader": false, "ar": [[2371.0, "فإن قلتَ: وما قولك فيمن يقول:"], [2382.0, "«الله على ما يشاء قادر»،"], [2388.0, "فيعلّق قدرته على الشيء بمشيئته له؟"], [2393.0, "فأقول: هذا قولٌ صحيحٌ إذا لم يُفهم منه مفهومُ مخالفة."], [2402.0, "فإن قلتَ: وما مفهوم المخالفة من هذا القول؟"], [2408.0, "فأقول: مفهوم المخالفة هو أن يعتقد قائلُ هذا القول أنه لا يقدر إلا على ما يشاؤه،"], [2421.0, "كما هو مذهب المعتزلة في خلق أفعال العباد."]], "tr": [[2371.0, "\"Allah dilediği şeye kadirdir\" diyerek O'nun bir şeye kudretini o şeyi dilemesine bağlayan kimse hakkında ne dersin?\" dersen, derim ki:"], [2393.0, "Ondan bir muhâlefet mefhumu (ters anlam) çıkarılmazsa bu doğru bir sözdür."], [2402.0, "\"Bu sözün muhâlefet mefhumu nedir?\" dersen, derim ki:"], [2408.0, "Muhâlefet mefhumu, bu sözü söyleyenin, O'nun yalnızca dilediği şeye kadir olduğuna inanmasıdır;"], [2408.0, "kulların fiillerinin yaratılması konusunda Mu'tezile'nin mezhebi olduğu gibi."]]}, {"reader": false, "ar": [[2430.0, "فهم يقولون: لأنّ الله لا يشاء فعلَ العبد فهو غيرُ قادرٍ على خلقه،"], [2440.0, "فالعبد هو الذي يخلق فعلَه؛"], [2444.0, "فأخرجوا أفعالَ العباد عن كونها مخلوقةً لله عز وجل،"], [2449.0, "بناءً على أنه لا يشاؤها."], [2453.0, "فيعلّقون قدرته بما يشاؤه:"], [2456.0, "فما شاءه فقادرٌ عليه،"], [2460.0, "وما لم يشأه فغيرُ قادرٍ عليه."], [2464.0, "فإذا كان الإنسان يفهم من هذه الكلمة مفهومَ المخالفة فهذا محرّمٌ لا يجوز،"], [2474.0, "لأنه تنقّصٌ في حقّ الربّ عز وجل."]], "tr": [[2430.0, "Onlar şöyle derler: Allah kulun fiilini dilemediği için onu yaratmaya kadir değildir;"], [2430.0, "fiilini yaratan kulun kendisidir. Böylece kulların fiillerini, O'nun onları dilemediği esasına dayanarak Allah Azze ve Celle'nin mahlûku olmaktan çıkardılar."], [2453.0, "O'nun kudretini dilediği şeye bağlarlar:"], [2456.0, "Dilediğine kadirdir, dilemediğine kadir değildir."], [2464.0, "Eğer insan bu sözden muhâlefet mefhumunu anlıyorsa bu haramdır, caiz değildir;"], [2464.0, "çünkü bu, Rab Azze ve Celle'nin hakkında bir eksiltmedir."]]}, {"reader": false, "ar": [[2478.0, "وهي ـ أي هذه الكلمة ـ صحيحةٌ إن لم يُفهم منها مفهومُ مخالفة،"], [2486.0, "بل وقد وردت في الكتاب والسنة بهذا التركيب بغير مفهوم المخالفة،"], [2495.0, "كما قال الله تبارك وتعالى:"], [2500.0, "<span class=\"ayah\">﴿وَهُوَ عَلَىٰ جَمْعِهِمْ إِذَا يَشَاءُ قَدِيرٌ﴾<\/span> <span class=\"ref\">[الشورى: ٢٩]<\/span>،"], [2506.0, "ولا يجوز أن نفهم من ذلك أنه لو لم يشأ جمعَهم لكان عاجزًا عنه."], [2513.0, "وكذلك في الحديث القدسي في آخر من يدخل الجنة،"], [2519.0, "أنه قال: «أتستهزئ بي وأنت ربُّ العالمين؟» قال:"], [2525.7, "«إني لا أستهزئ بك، ولكني على ما أشاء قادر» <span class=\"note\">(Müslim)<\/span>،"], [2532.0, "شريطةَ أن لا يُفهم منها مفهومُ مخالفة."]], "tr": [[2478.0, "Bu söz, ondan muhâlefet mefhumu anlaşılmazsa doğrudur."], [2478.0, "Hatta Kitap ve Sünnet'te bu terkiple, muhâlefet mefhumu olmaksızın gelmiştir."], [2486.0, "Nitekim Allah Tebâreke ve Teâlâ şöyle buyurur:"], [2495.0, "<span class=\"ayah\">﴿O, dilediği zaman onları bir araya toplamaya kadirdir﴾<\/span> [Şûrâ 29]."], [2500.0, "Bundan, eğer onları toplamayı dilemeseydi bundan aciz olacağı anlamını çıkarmamız caiz değildir."], [2506.0, "Aynı şekilde cennete en son girecek kimse hakkındaki kudsî hadiste o kişi \"Sen âlemlerin Rabbi iken benimle alay mı ediyorsun?\" der."], [2519.0, "(Allah) şöyle buyurur: «Ben seninle alay etmiyorum; fakat ben dilediğime kadirim.» <span class=\"note\">(Müslim)<\/span>."], [2532.0, "Yeter ki ondan muhâlefet mefhumu anlaşılmasın."]]}]}, {"ts": "42:17", "title": "7. Külliye (devam): Kudretin taalluku genel mi, muayyen mi?", "paras": [{"reader": false, "ar": [[2537.0, "وأزيد الأمرَ وضوحًا فأقول:"], [2540.0, "إنّ القدرة المضافة إلى الله عز وجل إمّا أن يكون الكلام على متعلَّقها عامًّا،"], [2549.6, "وإمّا أن يكون الكلام على متعلَّقها في شيءٍ يدلّ عليه السياق."], [2558.0, "فإن كان الكلام على متعلَّقها باعتبار العموم فعبّر بقولك:"], [2564.0, "«إنّ الله على كلّ شيءٍ قدير»،"], [2570.0, "فلا يصلح التعبير بقولك:"], [2572.4, "«إنّ الله على ما يشاء قادر» إذا كنتَ تتكلّم عن كمال القدرة غيرَ معيّنٍ لشيءٍ بخصوصه."]], "tr": [[2537.0, "Meseleyi daha da açıklığa kavuşturarak derim ki:"], [2540.0, "Allah Azze ve Celle'ye izafe edilen kudretin taalluku (ilişkin olduğu şey) hakkındaki söz ya genel olur ya da bağlamın gösterdiği bir şey hakkında olur."], [2549.6, "Eğer onun taalluku hakkındaki söz genellik itibarıyla ise \"Şüphesiz Allah her şeye kadirdir\" diye ifade et."], [2564.0, "Belirli bir şeyi tayin etmeksizin kudretin kemalinden bahsediyorsan \"Şüphesiz Allah dilediğine kadirdir\" diye ifade etmen uygun olmaz."]]}, {"reader": false, "ar": [[2583.0, "لكن إن كنتَ تتكلّم عن مقدورٍ معيّن فلك أن تعبّر بهذا التعبير،"], [2591.0, "كقولك: هل يقدر الله على أن يُخرج التمر في الشتاء؟"], [2598.0, "فتقول: إن شاء ذلك فهو قادر،"], [2602.0, "لأنّ متعلَّق القدرة الآن كلامٌ على شيءٍ معيّن."], [2607.0, "فلمّا كان الكلام على عظمة مُلك آخر من يدخل الجنة،"], [2615.0, "قال الله في هذا المقدور المعيّن:"], [2620.0, "«ولكني على ما أشاء قادر»،"], [2624.0, "لأنّ الكلام على شيءٍ معيّنٍ ومقدورٍ معيّن."], [2629.0, "وكذلك في الآية: لمّا كان الكلام على قدرة الله على بعثهم وجمعهم ـ وهو مقدورٌ معيّن ـ قال:"], [2639.3, "<span class=\"ayah\">﴿وَهُوَ عَلَىٰ جَمْعِهِمْ إِذَا يَشَاءُ قَدِيرٌ﴾<\/span>."]], "tr": [[2583.0, "Fakat belirli bir makdûrdan (kudretin konusu olan şeyden) bahsediyorsan bu ifadeyi kullanabilirsin."], [2591.0, "Mesela \"Allah kışın hurma çıkarmaya kadir midir?\" dersin ve \"Bunu dilerse kadirdir\" diye cevap verirsin;"], [2602.0, "çünkü kudretin taalluku şu anda belirli bir şey hakkındaki sözdür."], [2607.0, "Söz, cennete en son girecek kimsenin mülkünün büyüklüğü hakkında olunca Allah bu belirli makdûr hakkında \"Fakat ben dilediğime kadirim\" buyurdu;"], [2624.0, "çünkü söz belirli bir şey ve belirli bir makdûr hakkındadır."], [2629.0, "Ayette de böyledir: Söz, Allah'ın onları diriltmeye ve toplamaya kudreti hakkında olunca —ki bu belirli bir makdûrdur— <span class=\"ayah\">﴿O, dilediği zaman onları bir araya toplamaya kadirdir﴾<\/span> buyurdu."]]}, {"reader": false, "ar": [[2645.0, "فإن كان الكلام على متعلَّق القدرة عمومًا فلا تُقيِّد وإنما تُطلق،"], [2652.0, "وإن كان الكلام على متعلَّق القدرة تعيينًا وتخصيصًا في مقدورٍ معيّن فلك أن تقيّدها بالمشيئة،"], [2660.8, "شريطةَ أن لا تفهم من هذا التقييد مفهومَ مخالفة."], [2666.0, "ولعلكم فهمتم هذا، ولعلكم فهمتم هذا إن شاء الله."]], "tr": [[2645.0, "Eğer söz kudretin taalluku hakkında genel olarak ise kayıt koyma, mutlak bırak."], [2645.0, "Eğer söz kudretin taalluku hakkında, belirli bir makdûrda tayin ve tahsis yoluyla ise, bu kayıttan muhâlefet mefhumu anlamaman şartıyla onu meşîetle (dilemeyle) kayıtlayabilirsin."], [2666.0, "Umarım bunu anladınız; inşallah bunu anlamışsınızdır."]]}, {"reader": false, "ar": [[2673.0, "وبناءً على ذلك: فقد أجمع أهلُ الإسلام على أنّ كلَّ من أنكر كمالَ قدرة الله عز وجل على الشيء فإنه كافرٌ خالعٌ رِبقةَ الإسلام من عنقه بالكلّيّة."], [2694.0, "فلعلّنا نكتفي بهذا القدر،"], [2695.7, "والله أعلى وأعلم، وصلى الله وسلم على نبينا محمد."]], "tr": [[2673.0, "Buna dayanarak: İslâm ehli, Allah Azze ve Celle'nin bir şeye kudretinin kemalini inkâr eden herkesin, İslâm bağını boynundan tamamen çıkarıp atmış bir kâfir olduğu üzerinde icmâ etmiştir."], [2673.0, "Belki bu kadarıyla yetiniriz. Allah en yüce olandır ve en iyisini bilendir."], [2695.7, "Allah, Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
