<script>
const D={"no": 14, "vid": "B20MlrZpeKE", "title_ar": "الدرس (١٤) من شرح كليات العقيدة — تابع: كليات في توحيد الربوبية (الأرزاق، القضاء والقدر، الكوني والشرعي)", "title_tr": "Şerhu Külliyyâti'l-Akîde — 14. Ders: Rubûbiyyet Tevhidine Dair Külliyeler (Rızık, Kaza ve Kader, Kevnî ve Şer'î Ayrımı)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Bütün rızıklar taksim edilmiştir ve bilinen sebeplerle istenir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.7, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.4, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [9.0, "ولا نزال في سياق شرح كلّيّات كتاب الربوبية،"], [13.8, "وقد أخذنا منها جُمَلًا طيبةً،"], [16.8, "ولله الحمد والمنّة، ونأخذ في هذا الدرس ما تيسّر مما تمّ تحضيره."], [24.0, "الكلّيّة الأولى: كلُّ الأرزاق مقسومةٌ،"], [26.5, "وتُطلب بالأسباب المعلومة. كلُّ الأرزاق مقسومةٌ وتُطلب بالأسباب المعلومة."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.7, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.0, "Hâlâ rubûbiyyet bahsinin külliyelerini şerh etme bağlamındayız."], [13.8, "Onlardan güzel bir kısmını işledik;"], [16.8, "hamd ve minnet Allah'adır. Bu derste de hazırlanabilenlerden kolay gelenleri ele alıyoruz."], [24.0, "Birinci külliye: <b>1. külliye: Bütün rızıklar taksim edilmiştir (paylaştırılmıştır) ve bilinen sebeplerle istenir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[31.0, "كما قال الله عز وجل:"], [34.5, "<span class=\"ayah\">﴿وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ﴾<\/span> <span class=\"ref\">[الذاريات: ٢٢]<\/span>."], [48.0, "وقال الله عز وجل:"], [50.2, "<span class=\"ayah\">﴿وَمَا مِن دَابَّةٍ فِي الْأَرْضِ إِلَّا عَلَى اللَّهِ رِزْقُهَا وَيَعْلَمُ مُسْتَقَرَّهَا وَمُسْتَوْدَعَهَا﴾<\/span> <span class=\"ref\">[هود: ٦]<\/span>."], [57.0, "وقال الله عز وجل:"], [59.4, "<span class=\"ayah\">﴿أَهُمْ يَقْسِمُونَ رَحْمَتَ رَبِّكَ ۚ نَحْنُ قَسَمْنَا بَيْنَهُم مَّعِيشَتَهُمْ فِي الْحَيَاةِ الدُّنْيَا﴾<\/span> <span class=\"ref\">[الزخرف: ٣٢]<\/span>."], [66.0, "وقال الله عز وجل:"], [68.1, "<span class=\"ayah\">﴿أَمَّن يَبْدَأُ الْخَلْقَ ثُمَّ يُعِيدُهُ وَمَن يَرْزُقُكُم مِّنَ السَّمَاءِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[النمل: ٦٤]<\/span>."], [74.0, "وقال الله عز وجل:"], [76.7, "<span class=\"ayah\">﴿يَبْسُطُ الرِّزْقَ لِمَن يَشَاءُ وَيَقْدِرُ﴾<\/span> <span class=\"ref\">[الرعد: ٢٦]<\/span>."]], "tr": [[31.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [34.5, "<span class=\"ayah\">﴿Rızkınız ve size vaat edilen şeyler göktedir﴾<\/span> [Zâriyât 22]."], [48.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [50.2, "<span class=\"ayah\">﴿Yeryüzünde yürüyen hiçbir canlı yoktur ki rızkı Allah'a ait olmasın. O, onların durağını da emanet bırakılacakları yeri de bilir﴾<\/span> [Hûd 6]."], [57.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [59.4, "<span class=\"ayah\">﴿Rabbinin rahmetini onlar mı paylaştırıyorlar? Dünya hayatında onların geçimliklerini aralarında biz paylaştırdık﴾<\/span> [Zuhruf 32]."], [66.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [68.1, "<span class=\"ayah\">﴿Yaratmayı başlatan, sonra onu tekrar eden ve sizi gökten ve yerden rızıklandıran kimdir?﴾<\/span> [Neml 64]."], [68.1, "Allah Azze ve Celle şöyle buyurmuştur:"], [76.7, "<span class=\"ayah\">﴿Rızkı dilediğine bol verir, (dilediğine) daraltır﴾<\/span> [Ra'd 26]."]]}, {"reader": false, "ar": [[80.0, "وقال الله عز وجل:"], [82.3, "<span class=\"ayah\">﴿وَاللَّهُ فَضَّلَ بَعْضَكُمْ عَلَىٰ بَعْضٍ فِي الرِّزْقِ ۚ فَمَا الَّذِينَ فُضِّلُوا بِرَادِّي رِزْقِهِمْ عَلَىٰ مَا مَلَكَتْ أَيْمَانُهُمْ فَهُمْ فِيهِ سَوَاءٌ ۚ أَفَبِنِعْمَةِ اللَّهِ يَجْحَدُونَ﴾<\/span> <span class=\"ref\">[النحل: ٧١]<\/span>."], [95.0, "وقال الله عز وجل:"], [97.1, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ تَعْبُدُونَ مِن دُونِ اللَّهِ لَا يَمْلِكُونَ لَكُمْ رِزْقًا فَابْتَغُوا عِندَ اللَّهِ الرِّزْقَ وَاعْبُدُوهُ وَاشْكُرُوا لَهُ ۖ إِلَيْهِ تُرْجَعُونَ﴾<\/span> <span class=\"ref\">[العنكبوت: ١٧]<\/span>."], [107.0, "وقال النبي صلى الله عليه وسلم:"], [110.7, "«كلُّ شيءٍ بقدر الله، حتى العجزُ والكَيْس» <span class=\"note\">(Müslim)<\/span>."], [115.0, "وقال صلى الله عليه وسلم:"], [117.9, "«وإنه لن تموتَ نفسٌ حتى تستوفيَ ـ أو قال: تستكملَ ـ رزقَها وأجلَها، فاتقوا الله وأجمِلوا في الطلب»."]], "tr": [[80.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [82.3, "<span class=\"ayah\">﴿Allah rızık bakımından kiminizi kiminize üstün kılmıştır. Üstün kılınanlar, rızıklarını ellerinin altındakilere verip de onlarla bu hususta eşit olacak değillerdir. Şimdi Allah'ın nimetini mi inkâr ediyorlar?﴾<\/span> [Nahl 71]."], [82.3, "Allah Azze ve Celle şöyle buyurmuştur:"], [97.1, "<span class=\"ayah\">﴿Allah'ı bırakıp taptıklarınız size rızık vermeye güç yetiremezler. Rızkı Allah katında arayın, O'na ibadet edin ve O'na şükredin. Ancak O'na döndürüleceksiniz﴾<\/span> [Ankebût 17]."], [97.1, "Nebî ﷺ şöyle buyurmuştur: «Her şey Allah'ın kaderiyledir; acizlik ve zekâ (becerikli olmak) bile.» <span class=\"note\">(Müslim)<\/span>."], [110.7, "Yine ﷺ şöyle buyurmuştur: «Hiçbir nefis rızkını ve ecelini tamamen almadıkça —ya da \"tamamlamadıkça\" dedi— ölmeyecektir. O hâlde Allah'tan korkun ve (rızkı) istemede güzel yolu tutun.»"]]}, {"reader": false, "ar": [[127.0, "وهذه الأدلة تدل على أن الأرزاق مقسومةٌ من عند الله عز وجل."], [133.0, "ولا نعني بها الأرزاق المالية،"], [135.3, "بل نعني بها الأرزاق المعنوية والحسية."], [138.0, "فالبصرُ من رزق الله،"], [140.7, "وهو مقسوم، والعمى كذلك مقسومٌ على العبد،"], [144.0, "والفقرُ والغنى مقسومان على العبد،"], [147.0, "والصحةُ والمرض مقسومان على العبد،"], [150.0, "والشقاءُ والسعادة مقسومةٌ على العبد،"], [153.0, "والسَّعةُ والضيق مقسومةٌ على العبد."], [156.0, "كلُّ ذلك قد جرى به قلمُ القضاء والقدر قبل أن يخلق الله السماوات والأرض بخمسين ألف سنة."]], "tr": [[127.0, "Bu deliller, rızıkların Allah Azze ve Celle katından taksim edildiğini gösterir."], [133.0, "Bununla (yalnızca) malî rızıkları kastetmiyoruz;"], [135.3, "bilakis manevî ve hissî rızıkları da kastediyoruz."], [138.0, "Görme Allah'ın rızkındandır ve taksim edilmiştir;"], [140.7, "körlük de aynı şekilde kula taksim edilmiştir."], [144.0, "Fakirlik ve zenginlik kula taksim edilmiştir;"], [147.0, "sağlık ve hastalık kula taksim edilmiştir;"], [150.0, "bedbahtlık ve saadet kula taksim edilmiştir;"], [153.0, "genişlik ve darlık kula taksim edilmiştir."], [156.0, "Bütün bunlar, Allah gökleri ve yeri yaratmadan elli bin yıl önce kaza ve kader kalemiyle yazılmıştır."]]}, {"reader": false, "ar": [[163.0, "كما في صحيح مسلم من حديث عبد الله بن عمرو رضي الله عنهما قال:"], [169.0, "قال النبي صلى الله عليه وسلم:"], [172.0, "«كتب الله مقاديرَ الخلائق قبل أن يخلق السماواتِ والأرضَ ـ قبل أن يخلق الله السماوات والأرض ـ بخمسين ألف سنة»."], [183.0, "إلا أنه ـ وإن كان مقسومًا مقدَّرًا مقضيًّا بقضاءٍ وقدر ـ فإنه ينبغي على العبد أن يطلبه،"], [193.0, "وأن لا يتواكلَ على ما كُتب وقُدِّر له."], [197.0, "ولذلك أمرنا الله عز وجل بالسعي في هذه الأرض والمشيِ في مناكبها طلبًا لرزقه،"], [204.0, "مع أنه أخبرنا في مواضعَ أخرى أنه قدّره وقسمه فيما بيننا."]], "tr": [[163.0, "Nitekim Sahîh-i Müslim'de Abdullah b."], [163.0, "Amr'ın (radıyallahu anhumâ) hadisinde şöyle geçer:"], [169.0, "Nebî ﷺ şöyle buyurdu: «Allah, mahlûkatın takdirlerini gökleri ve yeri yaratmadan —Allah gökleri ve yeri yaratmadan— elli bin yıl önce yazdı.» Ancak rızık, kaza ve kaderle taksim edilmiş, takdir edilmiş ve hükmedilmiş olsa da kulun onu istemesi ve kendisine yazılıp takdir edilene dayanıp tembellik etmemesi gerekir."], [193.0, "Bu yüzden Allah Azze ve Celle, rızkını talep etmek üzere bu yeryüzünde çalışmamızı ve onun omuzlarında (dört bir yanında) yürümemizi emretmiştir;"], [197.0, "oysa başka yerlerde onu takdir ettiğini ve aramızda taksim ettiğini de bize haber vermiştir."]]}, {"reader": false, "ar": [[210.0, "فلا ينبغي للإنسان أن يترك تعاطيَ الأسباب التي يحصل بها رزقُه المقضيُّ له،"], [217.0, "وذلك لأن الأرزاق المقدَّرة تنقسم إلى قسمين:"], [221.0, "إلى أقدا... إلى أرزاقٍ ابتدائية،"], [225.0, "وإلى أرزاقٍ كسبيةٍ جزائية."], [229.0, "فالأرزاق الابتدائية: هي ما يبتدئ الله عز وجل به رزقَ عبدٍ من العباد من غير أن يكدَّ ولا أن يطلب شيئًا من ذلك،"], [239.0, "كالميراث؛ فإن العبد تأتيه أرزاق الله عز وجل عن طريق الميراث بلا كدٍّ ولا تعب."], [246.0, "وكالصدقة الابتدائية، من غير مدِّ يدٍ ولا سؤال،"], [250.0, "ولا بذلِ ماءِ وجه."], [252.0, "فهذا من جملة أرزاق الله عز وجل الابتدائية."]], "tr": [[210.0, "İnsanın, kendisine hükmedilmiş rızkını elde edeceği sebeplere başvurmayı terk etmesi uygun değildir."], [210.0, "Çünkü takdir edilmiş rızıklar iki kısma ayrılır:"], [217.0, "...ibtidâî (kendiliğinden başlatılan) rızıklar ve kesbî, cezâî (kazanca bağlı, karşılık olarak verilen) rızıklar."], [229.0, "İbtidâî rızıklar, Allah Azze ve Celle'nin kullardan birini, o kul hiç zahmet çekmeden ve ondan hiçbir şey istemeden, kendiliğinden rızıklandırdığı şeylerdir;"], [239.0, "miras gibi. Kula Allah Azze ve Celle'nin rızıkları miras yoluyla zahmetsiz ve yorgunluksuz gelir."], [246.0, "El uzatmadan, istemeden ve yüz suyu dökmeden kendiliğinden verilen sadaka da böyledir."], [250.0, "İşte bunlar Allah Azze ve Celle'nin ibtidâî rızıklarındandır."]]}, {"reader": false, "ar": [[257.0, "وهناك أرزاقٌ كسبيةٌ سببية،"], [261.0, "وهي الأرزاق التي قدَرُها معلَّقٌ بفعل أسبابها؛"], [265.0, "فمن فعل أسبابها رُزق،"], [267.0, "ومن ترك تعاطيَ الأسباب لم يُرزق."], [270.0, "وبناءً على ذلك فنحن نعلم غلطَ من يقول:"], [274.0, "بما أن الأرزاق مقدَّرةٌ فستأتيني وإن لم أطلبها،"], [278.0, "وإذا كانت غيرَ مقدَّرةٍ فإنها لن تأتيني ولو طلبتها."], [284.0, "فهذا إنما أُتي من جعل الرزق قسمًا واحدًا ـ وهو الرزق الابتدائي ـ وجودًا وعدمًا."], [296.0, "ولكن في الحقّ أن الرزق ينقسم إلى رزقٍ ابتدائي،"], [299.0, "وإلى رزقٍ كسبيٍّ سببي."]], "tr": [[257.0, "Bir de kesbî ve sebebî rızıklar vardır."], [261.0, "Bunlar, kaderi sebeplerinin yapılmasına bağlanmış rızıklardır;"], [265.0, "sebeplerini yapan rızıklanır, sebeplere başvurmayı terk eden rızıklanmaz."], [270.0, "Buna dayanarak şunu söyleyenin hatasını biliyoruz:"], [274.0, "\"Rızıklar takdir edildiğine göre, istemesem de bana gelecektir;"], [278.0, "takdir edilmemişse istesem de bana gelmeyecektir.\" Bu kişinin yanılgısı, rızkı var olması ve olmaması bakımından tek bir kısım —yani ibtidâî rızık— saymasından kaynaklanmaktadır."], [296.0, "Hakikatte ise rızık, ibtidâî rızık ve kesbî-sebebî rızık olmak üzere ikiye ayrılır."]]}]}, {"ts": "05:00", "title": "1. Külliye (devam): Kesbî rızık, dilenmenin yerilmesi ve tevekkül", "paras": [{"reader": false, "ar": [[300.0, "فلا بد أن تطرقَ <span class=\"q\">؟ 05:00<\/span> الأسباب،"], [303.0, "ولا بد أن تتكسّب وتطلب رزق الله عز وجل بالسعي في التجارة،"], [308.8, "والبيعِ والشراء، والإجارةِ والتأجير؛"], [311.0, "لعل الله عز وجل قد كتب لك رزقًا،"], [315.5, "لكن لم يجعله ابتدائيًّا،"], [317.8, "وإنما جعله سببيًّا كسبيًّا."], [320.0, "فهذه شبهةٌ أدخلها الشيطان على كثيرٍ من الناس،"], [325.0, "وعطّله عن أسباب تحصيل أرزاقه بحجة أنها مقدَّرة،"], [330.0, "ظنًّا منه أنها قدرٌ واحد."], [333.0, "وفي الحقيقة أن الأقدار في الأرزاق قد تكون ابتدائيةً، وقد تكون سببية."]], "tr": [[300.0, "O hâlde sebeplerin kapısını çalman <span class=\"q\">؟<\/span> ve ticarette, alım satımda, kiralamada ve kiraya vermede çalışarak Allah Azze ve Celle'nin rızkını kazanman ve istemen gerekir."], [308.8, "Belki Allah Azze ve Celle sana bir rızık yazmıştır, fakat onu ibtidâî kılmamış, sebebî ve kesbî kılmıştır."], [317.8, "Bu, şeytanın birçok insana soktuğu bir şüphedir;"], [320.0, "(şeytan) kişiyi, rızıkların takdir edilmiş olduğu bahanesiyle, onların tek bir kader olduğunu zannettirerek rızkını elde etme sebeplerinden alıkoymuştur."], [333.0, "Hakikatte ise rızıklardaki kaderler bazen ibtidâî, bazen sebebî olur."]]}, {"reader": false, "ar": [[338.0, "ولذلك يقول الله عز وجل:"], [340.7, "<span class=\"ayah\">﴿هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِن رِّزْقِهِ﴾<\/span> <span class=\"ref\">[الملك: ١٥]<\/span>،"], [346.0, "فعلّق الرزق بالمشي في مناكبها،"], [348.8, "وهو الرزق السببي الكسبي."], [351.0, "وقال الله عز وجل:"], [353.4, "<span class=\"ayah\">﴿فَإِذَا قُضِيَتِ الصَّلَاةُ فَانتَشِرُوا فِي الْأَرْضِ وَابْتَغُوا مِن فَضْلِ اللَّهِ﴾<\/span> <span class=\"ref\">[الجمعة: ١٠]<\/span>،"], [359.0, "وكلُّ «فضلٍ» في القرآن فهو المال،"], [362.0, "إلا بقرينةٍ تُخرجه عن موضوعه."], [364.0, "وقال النبي صلى الله عليه وسلم:"], [368.0, "«ما أكل أحدٌ طعامًا خيرًا من أن يأكل من عمل يده» <span class=\"note\">(Buhârî)<\/span>."], [374.0, "وهذا الرزق إيش؟ وهذا الرزق الكسبي السببي."]], "tr": [[338.0, "Bu yüzden Allah Azze ve Celle şöyle buyurur:"], [340.7, "<span class=\"ayah\">﴿O, yeryüzünü size boyun eğdirilmiş kılandır. Haydi onun omuzlarında (dört bir yanında) yürüyün ve O'nun rızkından yiyin﴾<\/span> [Mülk 15]."], [346.0, "Rızkı yeryüzünün omuzlarında yürümeye bağlamıştır;"], [348.8, "bu da sebebî-kesbî rızıktır. Allah Azze ve Celle şöyle buyurmuştur:"], [353.4, "<span class=\"ayah\">﴿Namaz kılınınca yeryüzüne dağılın ve Allah'ın fazlından arayın﴾<\/span> [Cuma 10]."], [353.4, "Kur'an'daki her \"fazl\" maldır; onu bu anlamından çıkaran bir karine olması hariç."], [362.0, "Nebî ﷺ şöyle buyurmuştur: «Hiç kimse, kendi elinin emeğinden yemesinden daha hayırlı bir yemek yememiştir.» <span class=\"note\">(Buhârî)<\/span>."], [374.0, "Bu rızık nedir? Bu, kesbî-sebebî rızıktır."]]}, {"reader": false, "ar": [[377.0, "وقال النبي صلى الله عليه وسلم:"], [379.9, "«لأنْ يأخذ أحدُكم حبلَه، فيأتيَ بحُزمة الحطب على ظهره فيبيعَها، فيكُفَّ الله بها وجهَه عن الناس، خيرٌ له من أن يسأل الناس، أعطَوه أو منعوه» <span class=\"note\">(Buhârî)<\/span>."], [392.0, "بل إن الأدلة في عمومها دلّت على أن الإنسان لا ينبغي له أن يجعل من مكاسب رزقه سؤالَ الناس،"], [403.0, "فإن الأدلة قد دلّت على أنها حالةٌ اضطراريةٌ لا ينبغي للإنسان أن يفزع إليها إلا في دائرة الاضطرار،"], [411.2, "لا في دائرة الاختيار."]], "tr": [[377.0, "Nebî ﷺ şöyle buyurmuştur: «Birinizin ipini alıp sırtında bir demet odun getirmesi ve onu satması, böylece Allah'ın onunla yüzünü insanlardan (dilenmekten) koruması, insanlara —ister versinler ister vermesinler— dilenmesinden onun için daha hayırlıdır.» <span class=\"note\">(Buhârî)<\/span>."], [392.0, "Hatta deliller genel olarak, insanın insanlardan istemeyi rızık kazanma yollarından biri hâline getirmemesi gerektiğini göstermiştir."], [403.0, "Çünkü deliller, bunun zaruri bir durum olduğunu;"], [403.0, "insanın ona ancak zaruret dairesinde, ihtiyar (seçim) dairesinde değil, başvurması gerektiğini göstermiştir."]]}, {"reader": false, "ar": [[413.0, "كما قال النبي صلى الله عليه وسلم:"], [415.0, "«واليدُ العليا خيرٌ من اليد السفلى»،"], [419.0, "واليد العليا هي المنفقة،"], [421.0, "واليد السفلى هي السائلة <span class=\"note\">(Buhârî, Müslim)<\/span>."], [423.0, "وقال النبي صلى الله عليه وسلم ـ وقال عليه الصلاة والسلام ـ:"], [429.0, "«من سأل الناسَ أموالَهم تكثُّرًا فإنما يسأل جمرًا، فليستقِلَّ أو ليستكثِر» <span class=\"note\">(Müslim)<\/span>."], [436.0, "وقال صلى الله عليه وسلم في حديث قَبيصة بن المُخارِق رضي الله عنه،"], [441.0, "قال: «ألا إن المسألة لا تحلُّ إلا لأحد ثلاثة» <span class=\"note\">(Müslim)<\/span>؛"], [445.0, "فجعل الأصلَ في مسألة الناس أموالَهم التحريمَ،"], [448.0, "إلا في هذه الدوائر الثلاثة التي يجمعها الاضطرارُ أو الحاجةُ الملحّة."], [455.0, "والحديث معروفٌ لديكم ولله الحمد."]], "tr": [[413.0, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [413.0, "«Üstteki el alttaki elden hayırlıdır.» Üstteki el infak eden, alttaki el ise dilenen eldir <span class=\"note\">(Buhârî, Müslim)<\/span>."], [421.0, "Nebî ﷺ —aleyhissalâtu vesselâm— şöyle buyurmuştur:"], [423.0, "«Kim malını çoğaltmak için insanlardan mallarını isterse, ancak kor ateş istemiş olur; artık ister az istesin ister çok.» <span class=\"note\">(Müslim)<\/span>."], [429.0, "Nebî ﷺ, Kabîsa b. Muhârik'in (radıyallahu anh) hadisinde şöyle buyurmuştur:"], [436.0, "«Dikkat edin! İstemek ancak üç kişiden birine helal olur.» <span class=\"note\">(Müslim)<\/span>."], [441.0, "Böylece insanlardan mallarını istemede aslı haram kılmıştır;"], [448.0, "zaruret veya sıkıştıran ihtiyacın bir araya getirdiği bu üç daire hariç."], [448.0, "Hadis sizce bilinmektedir, hamd Allah'adır."]]}, {"reader": false, "ar": [[458.0, "ولذلك يقول الله عز وجل:"], [460.9, "<span class=\"ayah\">﴿وَجَعَلْنَا النَّهَارَ مَعَاشًا﴾<\/span> <span class=\"ref\">[النبأ: ١١]<\/span>، أي طلبًا للمعاش."], [465.0, "وقال الله عز وجل:"], [466.7, "<span class=\"ayah\">﴿وَآخَرُونَ يَضْرِبُونَ فِي الْأَرْضِ يَبْتَغُونَ مِن فَضْلِ اللَّهِ﴾<\/span>."], [470.0, "وتأمّل هذه الآية، فإن الله جعل الضربَ في الأرض ابتغاءً لرزقه كالضرب في الأرض جهادًا في سبيله،"], [481.0, "قال: <span class=\"ayah\">﴿وَآخَرُونَ يُقَاتِلُونَ فِي سَبِيلِ اللَّهِ﴾<\/span> <span class=\"ref\">[المزمل: ٢٠]<\/span>."], [485.0, "فكلاهما ضرب: الأول لإعلاء كلمة الله عز وجل بالجهاد،"], [491.1, "وهو طلبُ رزق الآخرة،"], [495.0, "والثاني ضربٌ في الأرض لابتغاء رزق الدنيا وإقامةِ أَوَدِ العيش."]], "tr": [[458.0, "Bu yüzden Allah Azze ve Celle şöyle buyurur:"], [460.9, "<span class=\"ayah\">﴿Gündüzü geçim vakti kıldık﴾<\/span> [Nebe' 11];"], [460.9, "yani geçimi aramak için. Allah Azze ve Celle şöyle buyurmuştur:"], [466.7, "<span class=\"ayah\">﴿Diğerleri Allah'ın fazlından arayarak yeryüzünde yol alırlar﴾<\/span>."], [466.7, "Bu ayeti düşün: Allah, rızkını aramak için yeryüzünde yol almayı, O'nun yolunda cihad için yeryüzünde yol almak gibi kılmıştır;"], [470.0, "şöyle buyurmuştur: <span class=\"ayah\">﴿Diğerleri de Allah yolunda savaşırlar﴾<\/span> [Müzzemmil 20]."], [481.0, "İkisi de yol almaktır: Birincisi, cihadla Allah Azze ve Celle'nin kelimesini yüceltmek içindir;"], [485.0, "bu, âhiret rızkını istemektir. İkincisi ise dünya rızkını aramak ve geçimin eğriliğini doğrultmak (hayatı ayakta tutmak) için yeryüzünde yol almaktır."]]}, {"reader": false, "ar": [[502.0, "فلا ينبغي للإنسان أبدًا أن يحتجَّ بأنها مقسومةٌ على ترك تعاطي أسبابها."], [509.0, "وفي صحيح الإمام البخاري من حديث ابن عباس رضي الله عنهما قال:"], [514.7, "«كان أهلُ اليمن يحجّون ولا يتزوّدون، ويقولون: نحن المتوكّلون»،"], [525.0, "فأنزل الله عز وجل ـ «ليس عليكم» ـ:"], [528.9, "<span class=\"ayah\">﴿وَتَزَوَّدُوا فَإِنَّ خَيْرَ الزَّادِ التَّقْوَىٰ﴾<\/span> <span class=\"ref\">[البقرة: ١٩٧]<\/span> <span class=\"note\">(Şeyh önce «ليس عليكم» diyor; bu, Bakara 198'in başıdır.)<\/span>. والله أعلم."]], "tr": [[502.0, "İnsanın, rızıkların taksim edilmiş olmasını, sebeplerine başvurmayı terk etmeye asla delil getirmemesi gerekir."], [509.0, "İmam Buhârî'nin Sahîh'inde İbn Abbâs'ın (radıyallahu anhumâ) hadisinde şöyle der:"], [514.7, "«Yemen halkı hacca gider ve azık almazlardı; \"Biz tevekkül edenleriz\" derlerdi.» Bunun üzerine Allah Azze ve Celle —\"Size (günah) yoktur...\"— <span class=\"ayah\">﴿Azık edinin. Şüphesiz azığın en hayırlısı takvadır﴾<\/span> [Bakara 197] (ayetini) indirdi. Allah en iyisini bilir."]]}]}, {"ts": "08:54", "title": "2. Külliye: Her şey kaza ve kaderledir", "paras": [{"reader": false, "ar": [[534.0, "ومن القواعد أيضًا: <b>كلُّ شيءٍ بقضاءٍ وقدر.<\/b> <span class=\"note\">(يكررها)<\/span>."], [541.0, "وهذه قاعدةٌ مُجمَعٌ عليها بين أهل الإسلام:"], [553.0, "أنّ كلَّ ما يكون في العالم العلوي أو السفلي إلا بقضاء الله عز وجل وقدره،"], [561.0, "وأنّ ما كان، وما يكون،"], [563.1, "وما سيكون، وما لم يكن ـ عفوًا ـ وما لم يكن أنْ لو كان كيف سيكون،"], [569.0, "إنما هو بقضاء الله تبارك وتعالى."]], "tr": [[534.0, "Kaidelerden biri de şudur: 2."], [534.0, "külliye: Her şey kaza ve kaderledir. (Tekrar ediyor.) Bu, İslâm ehli arasında üzerinde icmâ edilmiş bir kaidedir:"], [553.0, "Yüce âlemde veya aşağı âlemde olan her şey ancak Allah Azze ve Celle'nin kazası ve kaderiyle olur."], [561.0, "Olmuş olan, olmakta olan, olacak olan ve olmamış olan —pardon— olmamış olanın, olsaydı nasıl olacağı;"], [563.1, "hepsi ancak Allah Tebâreke ve Teâlâ'nın kazasıyladır."]]}, {"reader": false, "ar": [[572.0, "كما قال الله عز وجل:"], [574.0, "<span class=\"ayah\">﴿وَعِندَهُ مَفَاتِحُ الْغَيْبِ لَا يَعْلَمُهَا إِلَّا هُوَ ۚ وَيَعْلَمُ مَا فِي الْبَرِّ وَالْبَحْرِ ۚ وَمَا تَسْقُطُ مِن وَرَقَةٍ إِلَّا يَعْلَمُهَا وَلَا حَبَّةٍ فِي ظُلُمَاتِ الْأَرْضِ وَلَا رَطْبٍ وَلَا يَابِسٍ إِلَّا فِي كِتَابٍ مُّبِينٍ﴾<\/span> <span class=\"ref\">[الأنعام: ٥٩]<\/span>."], [589.0, "وقال الله عز وجل:"], [591.2, "<span class=\"ayah\">﴿وَكَانَ أَمْرُ اللَّهِ قَدَرًا مَّقْدُورًا﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٨]<\/span>."], [594.0, "وقال الله عز وجل:"], [596.8, "<span class=\"ayah\">﴿إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾<\/span> <span class=\"ref\">[القمر: ٤٩]<\/span>."]], "tr": [[572.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [574.0, "<span class=\"ayah\">﴿Gaybın anahtarları O'nun katındadır; onları O'ndan başkası bilmez. Karada ve denizde olanı bilir. Bir yaprak düşmez ki onu bilmesin. Yerin karanlıklarındaki bir tane, yaş ve kuru ne varsa hepsi apaçık bir kitaptadır﴾<\/span> [En'âm 59]."], [574.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [589.0, "<span class=\"ayah\">﴿Allah'ın emri, takdir edilmiş bir kaderdir﴾<\/span> [Ahzâb 38]."], [591.2, "Allah Azze ve Celle şöyle buyurmuştur:"], [596.8, "<span class=\"ayah\">﴿Şüphesiz biz her şeyi bir kaderle yarattık﴾<\/span> [Kamer 49]."]]}, {"reader": false, "ar": [[601.0, "ويقول الله عز وجل:"], [602.4, "<span class=\"ayah\">﴿إِنَّ اللَّهَ بَالِغُ أَمْرِهِ ۚ قَدْ جَعَلَ اللَّهُ لِكُلِّ شَيْءٍ قَدْرًا﴾<\/span> <span class=\"ref\">[الطلاق: ٣]<\/span>."], [606.0, "وقال الله عز وجل:"], [608.5, "<span class=\"ayah\">﴿نَحْنُ قَدَّرْنَا بَيْنَكُمُ الْمَوْتَ﴾<\/span> <span class=\"ref\">[الواقعة: ٦٠]<\/span>."], [611.0, "وقال الله عز وجل:"], [612.6, "<span class=\"ayah\">﴿مَا أَصَابَ مِن مُّصِيبَةٍ فِي الْأَرْضِ وَلَا فِي أَنفُسِكُمْ إِلَّا فِي كِتَابٍ مِّن قَبْلِ أَن نَّبْرَأَهَا﴾<\/span> <span class=\"ref\">[الحديد: ٢٢]<\/span>."], [619.0, "ويقول النبي صلى الله عليه وسلم ـ كما في صحيح مسلم من حديث ابن عمر رضي الله عنهما ـ:"], [627.0, "«كلُّ شيءٍ بقدر الله، حتى العجزُ والكَيْس»."], [631.0, "وذكرتُ لكم آنفًا حديث عبد الله بن عمرو:"], [635.0, "«إن الله كتب مقادير الخلائق قبل أن يخلق السماوات والأرض بخمسين ألف سنة»،"], [641.0, "قال: «وكان عرشُه على الماء»."]], "tr": [[601.0, "Allah Azze ve Celle şöyle buyurur:"], [602.4, "<span class=\"ayah\">﴿Şüphesiz Allah emrini yerine getirendir. Allah her şey için bir ölçü kılmıştır﴾<\/span> [Talâk 3]."], [602.4, "Allah Azze ve Celle şöyle buyurmuştur:"], [608.5, "<span class=\"ayah\">﴿Aranızda ölümü biz takdir ettik﴾<\/span> [Vâkıa 60]."], [608.5, "Allah Azze ve Celle şöyle buyurmuştur:"], [612.6, "<span class=\"ayah\">﴿Yeryüzünde ve kendinizde uğradığınız hiçbir musibet yoktur ki biz onu yaratmadan önce bir kitapta (yazılmış) olmasın﴾<\/span> [Hadîd 22]."], [612.6, "Nebî ﷺ de —Sahîh-i Müslim'de İbn Ömer'in (radıyallahu anhumâ) hadisinde olduğu gibi— şöyle buyurur:"], [619.0, "«Her şey Allah'ın kaderiyledir; acizlik ve zekâ bile.» Size az önce Abdullah b."], [631.0, "Amr'ın hadisini zikretmiştim: «Allah, mahlûkatın takdirlerini gökleri ve yeri yaratmadan elli bin yıl önce yazdı.» (Nebî ﷺ) şöyle dedi: «O'nun Arş'ı su üzerindeydi.»"]]}, {"reader": false, "ar": [[643.0, "وفي الصحيحين من حديث عليٍّ رضي الله تعالى عنه قال:"], [650.4, "قال النبي صلى الله عليه وسلم:"], [653.0, "«ما منكم من أحدٍ إلا وقد كُتب مقعدُه من النار ومقعدُه من الجنة»."], [658.0, "قالوا: يا رسول الله،"], [659.6, "أفلا نتّكل على كتابنا وندعُ العمل؟"], [662.0, "قال: «اعملوا، فكلٌّ ميسَّرٌ لما خُلق له»، أي قضاءً وقدرًا."]], "tr": [[643.0, "Buhârî ve Müslim'in Sahîh'lerinde Ali'nin (radıyallahu anh) hadisinde şöyle der:"], [650.4, "Nebî ﷺ şöyle buyurdu: «Sizden hiç kimse yoktur ki cehennemdeki yeri de cennetteki yeri de yazılmış olmasın.» Dediler ki:"], [653.0, "\"Ey Allah'ın Resûlü! Yazımıza güvenip ameli bırakmayalım mı?\" Buyurdu ki:"], [659.6, "«Amel edin; herkes ne için yaratıldıysa ona kolaylaştırılmıştır.» Yani kaza ve kader olarak."]]}, {"reader": false, "ar": [[667.0, "وفي صحيح الإمام مسلم من حديث عمران بن حُصين رضي الله عنهما:"], [672.0, "أنّ رجلين من مُزَينة قالا:"], [674.3, "«يا رسول الله، أرأيتَ ما يعمل الناسُ اليوم ويكدحون فيه، أشيءٌ قُضي عليهم ومضى فيهم من قدرٍ سبق، أم فيما يستقبلونه مما أتاهم به نبيُّهم وثبتت الحجةُ عليهم؟ فقال: لا، بل شيءٌ قُضي عليهم ومضى فيهم، وتصديقُ ذلك في كتاب الله: <span class=\"ayah\">﴿وَنَفْسٍ وَمَا سَوَّاهَا ۝ فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا﴾<\/span> <span class=\"ref\">[الشمس: ٧–٨]<\/span>»."]], "tr": [[667.0, "İmam Müslim'in Sahîh'inde İmrân b."], [667.0, "Husayn'ın (radıyallahu anhumâ) hadisinde şöyle geçer:"], [667.0, "Müzeyne'den iki adam dedi ki:"], [672.0, "«Ey Allah'ın Resûlü! İnsanların bugün yaptıkları ve uğrunda didindikleri şey hakkında ne dersin? Bu, onlar hakkında hükmedilmiş ve önceden geçmiş bir kaderle onlarda gerçekleşmiş bir şey midir, yoksa peygamberlerinin onlara getirdiği ve aleyhlerine hüccetin sabit olduğu şeyde (bundan sonra) karşılaşacakları bir şey midir? Buyurdu ki: Hayır, bilakis onlar hakkında hükmedilmiş ve onlarda gerçekleşmiş bir şeydir. Bunun tasdiki Allah'ın Kitabı'ndadır: <span class=\"ayah\">﴿Nefse ve onu düzenleyene andolsun. Sonra ona kötülüğünü ve takvasını ilham edene﴾<\/span> [Şems 7–8].»"]]}, {"reader": false, "ar": [[701.0, "وفي صحيح الإمام البخاري من حديث أبي هريرة رضي الله عنه قال:"], [705.3, "«أتيتُ النبي صلى الله عليه وسلم فاستأذنتُه في الاختصاء فلم يأذن لي، ثم قلتُ له الثانية فلم يأذن لي، ثم قلتُ له الثالثة، فقال: يا أبا هريرة، جفّ القلم ـ جفّ القلم أي قضاءً وقدرًا ـ جفّ القلمُ بما أنت لاقٍ، فاختصِ على ذلك أو ذَرْ»."], [726.0, "والآيات والأحاديث والنصوص في هذا المعنى كثيرة."], [731.0, "فكلُّ شيءٍ إنما يكون بقضاء الله عز وجل وقدره،"], [737.0, "ولا يخرج شيءٌ عن كونه مقدورًا لله عز وجل،"], [741.0, "ويوضّح هذا الكلّيّاتُ القدرية التي ستأتي فيما بعد إن شاء الله."]], "tr": [[701.0, "İmam Buhârî'nin Sahîh'inde Ebû Hüreyre'nin (radıyallahu anh) hadisinde şöyle der:"], [701.0, "«Nebî ﷺ'e geldim ve kendimi iğdiş etmek için izin istedim; bana izin vermedi. Sonra ona ikinci kez söyledim; yine izin vermedi. Sonra üçüncü kez söyledim. Buyurdu ki: Ey Ebû Hüreyre! Kalem kurudu —kalem kurudu, yani kaza ve kader olarak— karşılaşacağın şeyle kalem kurudu. Artık buna göre ister iğdiş ol ister bırak.» Bu anlamdaki ayetler, hadisler ve nasslar çoktur."], [726.0, "Her şey ancak Allah Azze ve Celle'nin kaza ve kaderiyle olur;"], [731.0, "hiçbir şey Allah Azze ve Celle'nin kudreti dahilinde takdir edilmiş olmaktan çıkmaz."], [741.0, "Bunu, inşallah ileride gelecek olan kader külliyeleri açıklayacaktır."]]}]}, {"ts": "12:26", "title": "3. Külliye: Rubûbiyyete taalluk eden her izin kevnîdir", "paras": [{"reader": false, "ar": [[746.0, "ومن الكلّيّات أيضًا: <b>كلُّ إذنٍ متعلِّقٍ بربوبية الله عز وجل فكوني.<\/b> <span class=\"note\">(يكررها)<\/span>."], [760.8, "أُعيدها مرةً أخرى: كلُّ إذنٍ متعلِّقٍ بربوبية الله عز وجل فكوني."]], "tr": [[746.0, "Külliyelerden biri de şudur: 3."], [746.0, "külliye: Allah Azze ve Celle'nin rubûbiyyetine taalluk eden her izin kevnîdir. (Tekrar ediyor.) Bir kez daha tekrar ediyorum:"], [760.8, "Allah Azze ve Celle'nin rubûbiyyetine taalluk eden her izin kevnîdir."]]}, {"reader": false, "ar": [[778.0, "أقول وبالله التوفيق: هذه الكلّيّة والكلّيّات التي بعدها في أقسامٍ عند أهل السنة والجماعة مهمةٌ جدًّا وعظيمة،"], [787.3, "ولا بد من فهمها."], [789.0, "وما ضلّ من ضلّ في باب القضاء والقدر إلا وسببُ ضلاله عدمُ معرفته لهذه الأقسام والأنواع."], [802.0, "ويجمعها أن نقول: إنّ كلَّ تدبيرٍ لله عز وجل في خلقه فمنقسمٌ إلى كونيٍّ وإلى شرعي."], [811.0, "كلُّ تدبيرٍ لله عز وجل في خلقه فلا بد أن تقسمه إلى كونيٍّ وشرعي."]], "tr": [[778.0, "Tevfik Allah'tandır, derim ki: Bu külliye ve ondan sonraki külliyeler, Ehl-i Sünnet ve'l-Cemaat nezdindeki bazı taksimlere dairdir;"], [778.0, "çok önemli ve büyüktürler, anlaşılmaları şarttır."], [787.3, "Kaza ve kader babında sapan kim saptıysa, sapmasının sebebi bu kısımları ve türleri bilmemesidir."], [789.0, "Bunları bir araya getiren söz şudur:"], [802.0, "Allah Azze ve Celle'nin yarattıkları hakkındaki her tedbiri kevnî ve şer'î olarak ikiye ayrılır."], [802.0, "Allah Azze ve Celle'nin yarattıkları hakkındaki her tedbirini mutlaka kevnî ve şer'î olarak ikiye ayırmalısın."]]}, {"reader": false, "ar": [[818.0, "ومن ذلك هذه الكلّيّة،"], [821.0, "وهي الإذن المضاف إلى الله عز وجل؛"], [824.0, "فإنّ إذن الله من جملة تدبيره في عباده."], [828.0, "فالإذن منقسمٌ إلى قسمين:"], [832.0, "إلى إذنٍ متعلِّقٍ بأفعال ربوبيته،"], [836.0, "وإلى إذنٍ متعلِّقٍ بمقتضيات ألوهيته."], [841.0, "وكلّيّتنا تخصّ القسم الأول،"], [844.0, "وهي أنّ كلَّ إذنٍ متعلِّقٍ بأفعال ربوبية الله عز وجل فهو من الإذن الكوني،"], [851.0, "الذي لا بد أن يقع،"], [853.8, "ولا يستلزم محبةَ الله،"], [856.0, "وليس مرادًا لذاته، وإنما مرادٌ لغيره."]], "tr": [[818.0, "Bu külliye de bundandır; o da Allah Azze ve Celle'ye izafe edilen izindir."], [821.0, "Çünkü Allah'ın izni, O'nun kulları hakkındaki tedbirindendir."], [828.0, "İzin iki kısma ayrılır: O'nun rubûbiyyet fiillerine taalluk eden izin ve O'nun ulûhiyyetinin gereklerine taalluk eden izin."], [836.0, "Külliyemiz birinci kısma mahsustur: Allah Azze ve Celle'nin rubûbiyyet fiillerine taalluk eden her izin kevnî izindendir;"], [844.0, "mutlaka gerçekleşir, Allah'ın sevgisini gerektirmez, bizzat kendisi için murad edilmiş değildir, ancak başka bir şey için murad edilmiştir."]]}, {"reader": false, "ar": [[864.0, "وهو ذلك الإذن الذي يتعلّق بشيءٍ من التدبير الكوني،"], [869.0, "الذي لا تعلُّقَ له بالحلال والحرام،"], [872.3, "ولا بالأمر والنهي. فمتى ما رأيتَ شيئًا من الإذن مضافًا لله عز وجل يتعلّق بشيءٍ من التدبير الكوني فاعلم أنه من جملة الإذن الكوني،"], [886.0, "كقول الله عز وجل:"], [888.0, "<span class=\"ayah\">﴿وَمَا هُم بِضَارِّينَ بِهِ مِنْ أَحَدٍ إِلَّا بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ١٠٢]<\/span>،"], [892.2, "وقول الله عز وجل:"], [894.1, "<span class=\"ayah\">﴿مَن ذَا الَّذِي يَشْفَعُ عِندَهُ إِلَّا بِإِذْنِهِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>."]], "tr": [[864.0, "Bu, helal ve haramla, emir ve nehiyle hiçbir alakası olmayan, kevnî tedbirden bir şeye taalluk eden izindir."], [872.3, "Allah Azze ve Celle'ye izafe edilmiş ve kevnî tedbirden bir şeye taalluk eden bir izin gördüğün zaman bil ki o kevnî izindendir."], [872.3, "Allah Azze ve Celle'nin şu sözü gibi:"], [888.0, "<span class=\"ayah\">﴿Onlar Allah'ın izni olmadıkça onunla hiç kimseye zarar veremezler﴾<\/span> [Bakara 102]."], [888.0, "Ve Allah Azze ve Celle'nin şu sözü:"], [894.1, "<span class=\"ayah\">﴿O'nun izni olmadan O'nun katında kim şefaat edebilir?﴾<\/span> [Bakara 255]."]]}, {"reader": false, "ar": [[897.3, "وقول الله عز وجل عن عيسى عليه السلام أنه قال لقومه:"], [903.5, "<span class=\"ayah\">﴿أَنِّي أَخْلُقُ لَكُم مِّنَ الطِّينِ كَهَيْئَةِ الطَّيْرِ فَأَنفُخُ فِيهِ فَيَكُونُ طَيْرًا بِإِذْنِ اللَّهِ ۖ وَأُبْرِئُ الْأَكْمَهَ وَالْأَبْرَصَ وَأُحْيِي الْمَوْتَىٰ بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[آل عمران: ٤٩]<\/span>."], [915.0, "وكذلك قول الله عز وجل:"], [918.0, "<span class=\"ayah\">﴿وَمَا كَانَ لِنَفْسٍ أَن تَمُوتَ إِلَّا بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[آل عمران: ١٤٥]<\/span>."], [924.0, "وقال الله عز وجل:"], [925.0, "<span class=\"ayah\">﴿وَمَا أَصَابَكُمْ يَوْمَ الْتَقَى الْجَمْعَانِ فَبِإِذْنِ اللَّهِ وَلِيَعْلَمَ الْمُؤْمِنِينَ﴾<\/span> <span class=\"ref\">[آل عمران: ١٦٦]<\/span>."]], "tr": [[897.3, "Allah Azze ve Celle'nin, Îsâ'nın (aleyhisselâm) kavmine şöyle dediğini bildiren sözü:"], [903.5, "<span class=\"ayah\">﴿Ben size çamurdan kuş şeklinde bir şey yapar, ona üflerim; o da Allah'ın izniyle kuş olur. Doğuştan körü ve alacalıyı iyileştiririm ve Allah'ın izniyle ölüleri diriltirim﴾<\/span> [Âl-i İmrân 49]."], [903.5, "Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [915.0, "<span class=\"ayah\">﴿Allah'ın izni olmadıkça hiçbir nefis ölemez﴾<\/span> [Âl-i İmrân 145]."], [918.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [924.0, "<span class=\"ayah\">﴿İki topluluğun karşılaştığı gün size isabet eden, Allah'ın izniyledir; (Allah) müminleri ortaya çıkarmak için (böyle yaptı)﴾<\/span> [Âl-i İmrân 166]."]]}, {"reader": false, "ar": [[931.0, "وقال الله عز وجل عن الشجرة:"], [934.0, "<span class=\"ayah\">﴿تُؤْتِي أُكُلَهَا كُلَّ حِينٍ﴾<\/span> بإيش؟"], [937.1, "<span class=\"ayah\">﴿بِإِذْنِ رَبِّهَا﴾<\/span> <span class=\"ref\">[إبراهيم: ٢٥]<\/span>. وقال الله عز وجل:"], [941.7, "<span class=\"ayah\">﴿وَيُمْسِكُ السَّمَاءَ أَن تَقَعَ عَلَى الْأَرْضِ إِلَّا بِإِذْنِهِ﴾<\/span> <span class=\"ref\">[الحج: ٦٥]<\/span>."], [947.0, "وقال الله عز وجل:"], [948.5, "<span class=\"ayah\">﴿مَا أَصَابَ مِن مُّصِيبَةٍ إِلَّا بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[التغابن: ١١]<\/span>."], [951.0, "وذلك في آياتٍ كثيرة."]], "tr": [[931.0, "Allah Azze ve Celle ağaç hakkında şöyle buyurmuştur:"], [934.0, "<span class=\"ayah\">﴿Meyvesini her zaman verir﴾<\/span> neyle?"], [937.1, "<span class=\"ayah\">﴿Rabbinin izniyle﴾<\/span> [İbrâhîm 25]. Allah Azze ve Celle şöyle buyurmuştur:"], [941.7, "<span class=\"ayah\">﴿Gökyüzünü, izni olmadıkça yerin üzerine düşmekten tutar﴾<\/span> [Hac 65]."], [941.7, "Allah Azze ve Celle şöyle buyurmuştur:"], [948.5, "<span class=\"ayah\">﴿Allah'ın izni olmadıkça hiçbir musibet isabet etmez﴾<\/span> [Teğâbün 11]."], [948.5, "Bu, pek çok ayette vardır."]]}, {"reader": false, "ar": [[955.0, "وعلامة هذا الإذن أنه لا يتعلّق بشيءٍ من الحلال ولا الحرام،"], [960.1, "ولا بالأمر ولا بالنهي،"], [962.0, "وإنما يتعلّق بشيءٍ من تدبير الله عز وجل في أموره الكونية."], [968.0, "وبما أنه إذنٌ يتعلّق بالأمر الكوني فهو من جملة مقتضيات ربوبيته."], [975.0, "ويوضّح ذلك الكلّيّةُ التي بعدها:"]], "tr": [[955.0, "Bu iznin alameti, helal ve haramdan, emir ve nehiyden hiçbir şeye taalluk etmemesi;"], [960.1, "sadece Allah Azze ve Celle'nin kevnî işlerindeki tedbirinden bir şeye taalluk etmesidir."], [962.0, "Kevnî işe taalluk eden bir izin olduğuna göre, O'nun rubûbiyyetinin gereklerindendir."], [975.0, "Bunu ondan sonraki külliye açıklar:"]]}]}, {"ts": "16:19", "title": "4. Külliye: Ulûhiyyetin gereklerine taalluk eden her izin şer'îdir", "paras": [{"reader": false, "ar": [[979.0, "<b>كلُّ إذنٍ متعلِّقٍ بمقتضيات ألوهيته فشرعي.<\/b> <span class=\"note\">(يكررها)<\/span>."], [997.0, "وهذا النوع الثاني من أنواع إذن الله عز وجل."], [1001.8, "فلا بد أن تعرفوا أن إذن الله منقسمٌ إلى إذنٍ كونيٍّ وإلى إذنٍ شرعي."], [1009.0, "وعلامة الإذن الشرعي أنه قد يقع وقد لا يقع،"], [1016.0, "ولا يقع إلا مستلزمًا لمحبة الله عز وجل،"], [1022.0, "ويكون مرادًا لذاته لا لغيره."], [1025.0, "وضابطه: الإذن الذي يتعلّق بالحلال والحرام،"], [1029.3, "أو الأمر والنهي الشرعي."]], "tr": [[979.0, "<b>4. külliye: O'nun ulûhiyyetinin gereklerine taalluk eden her izin şer'îdir.<\/b> (Tekrar ediyor.) Bu, Allah Azze ve Celle'nin izninin türlerinden ikincisidir."], [1001.8, "Allah'ın izninin kevnî izin ve şer'î izin olarak ikiye ayrıldığını mutlaka bilmelisiniz."], [1001.8, "Şer'î iznin alameti, bazen gerçekleşip bazen gerçekleşmemesi, ancak Allah Azze ve Celle'nin sevgisini gerektirerek gerçekleşmesi ve başkası için değil bizzat kendisi için murad edilmiş olmasıdır."], [1025.0, "Zâbıtı şudur: Helal ve harama ya da şer'î emir ve nehye taalluk eden izin."]]}, {"reader": false, "ar": [[1037.0, "كقول الله عز وجل:"], [1039.0, "<span class=\"ayah\">﴿أَمْ لَهُمْ شُرَكَاءُ شَرَعُوا لَهُم مِّنَ الدِّينِ مَا لَمْ يَأْذَن بِهِ اللَّهُ﴾<\/span> <span class=\"ref\">[الشورى: ٢١]<\/span>،"], [1045.0, "أي بإذنه الشرعي. وهي دليلٌ على أن الأصل في التشريع التوقيفُ على الإذن الشرعي،"], [1053.0, "التوقيفُ على الإذن الشرعي."], [1056.0, "وكذلك قول الله عز وجل واصفًا نبيَّه صلى الله عليه وسلم:"], [1061.0, "<span class=\"ayah\">﴿إِنَّا أَرْسَلْنَاكَ شَاهِدًا وَمُبَشِّرًا وَنَذِيرًا ۝ وَدَاعِيًا إِلَى اللَّهِ﴾<\/span> بإيش؟"], [1066.0, "<span class=\"ayah\">﴿بِإِذْنِهِ وَسِرَاجًا مُّنِيرًا﴾<\/span> <span class=\"ref\">[الأحزاب: ٤٥–٤٦]<\/span>، أي بإذنه الشرعي."]], "tr": [[1037.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1039.0, "<span class=\"ayah\">﴿Yoksa onların, Allah'ın izin vermediği şeyleri dinde kendileri için şeriat kılan ortakları mı var?﴾<\/span> [Şûrâ 21];"], [1039.0, "yani O'nun şer'î izniyle. Bu ayet, teşrîde aslın şer'î izne bağlı olmak (tevkîf) olduğunun delilidir;"], [1045.0, "şer'î izne bağlı olmak. Aynı şekilde Allah Azze ve Celle'nin Peygamberi ﷺ'i nitelerken buyurduğu şu söz:"], [1056.0, "<span class=\"ayah\">﴿Ey Peygamber! Şüphesiz biz seni bir şahit, bir müjdeci, bir uyarıcı ve Allah'a davet eden﴾<\/span> neyle?"], [1061.0, "<span class=\"ayah\">﴿O'nun izniyle (davet eden) ve aydınlatıcı bir kandil olarak gönderdik﴾<\/span> [Ahzâb 45–46]; yani O'nun şer'î izniyle."]]}, {"reader": false, "ar": [[1070.0, "وقال الله عز وجل:"], [1072.2, "<span class=\"ayah\">﴿وَمَا كَانَ لِرَسُولٍ أَن يَأْتِيَ بِآيَةٍ إِلَّا بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[الرعد: ٣٨]<\/span>،"], [1077.3, "أي بإذنه الشرعي. وقال الله عز وجل:"], [1081.4, "<span class=\"ayah\">﴿وَمَا كَانَ لِبَشَرٍ أَن يُكَلِّمَهُ اللَّهُ إِلَّا وَحْيًا أَوْ مِن وَرَاءِ حِجَابٍ أَوْ يُرْسِلَ رَسُولًا فَيُوحِيَ بِإِذْنِهِ مَا يَشَاءُ﴾<\/span> <span class=\"ref\">[الشورى: ٥١]<\/span>،"], [1093.0, "أي بإذنه الشرعي. وقال الله عز وجل:"], [1096.0, "<span class=\"ayah\">﴿وَاللَّهُ يَدْعُو إِلَى الْجَنَّةِ وَالْمَغْفِرَةِ بِإِذْنِهِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٢١]<\/span>،"], [1102.0, "أي بإذنه الشرعي، أي بالدليل الشرعي."]], "tr": [[1070.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1072.2, "<span class=\"ayah\">﴿Hiçbir resulün, Allah'ın izni olmadan bir mucize getirmesi mümkün değildir﴾<\/span> [Ra'd 38];"], [1077.3, "yani O'nun şer'î izniyle. Allah Azze ve Celle şöyle buyurmuştur:"], [1081.4, "<span class=\"ayah\">﴿Allah bir beşerle ancak vahiyle, ya da perde arkasından konuşur; yahut bir elçi gönderir de o, O'nun izniyle dilediğini vahyeder﴾<\/span> [Şûrâ 51];"], [1081.4, "yani O'nun şer'î izniyle. Allah Azze ve Celle şöyle buyurmuştur:"], [1096.0, "<span class=\"ayah\">﴿Allah ise izniyle cennete ve mağfirete çağırır﴾<\/span> [Bakara 221];"], [1096.0, "yani O'nun şer'î izniyle, yani şer'î delille."]]}, {"reader": false, "ar": [[1105.0, "وقال الله عز وجل:"], [1106.0, "<span class=\"ayah\">﴿قُلْ مَن كَانَ عَدُوًّا لِّجِبْرِيلَ فَإِنَّهُ نَزَّلَهُ عَلَىٰ قَلْبِكَ بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ٩٧]<\/span>،"], [1112.0, "أي بإذنه الشرعي. فكلُّ إذنٍ مضافٍ إلى الله عز وجل يتعلّق بشيءٍ من الحلال ـ من التحليل أو التحريم ـ أو الأمر أو النهي الشرعيين،"], [1122.0, "فإنه إذنُ الله الشرعي."], [1127.0, "ويوضّح ذلك التقسيمُ الذي بعده في الكلّيّة الآتية:"]], "tr": [[1105.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1106.0, "<span class=\"ayah\">﴿De ki: Kim Cebrâil'e düşman ise (bilsin ki) onu (Kur'an'ı) Allah'ın izniyle senin kalbine o indirmiştir﴾<\/span> [Bakara 97];"], [1112.0, "yani O'nun şer'î izniyle. Allah Azze ve Celle'ye izafe edilen ve helalden —helal kılma veya haram kılmadan— ya da şer'î emir veya nehiyden bir şeye taalluk eden her izin, Allah'ın şer'î iznidir."], [1127.0, "Bunu, sonraki külliyedeki bir sonraki taksim açıklar:"]]}]}, {"ts": "18:52", "title": "5. Külliye: Rubûbiyyet fiillerine taalluk eden her kader kevnîdir", "paras": [{"reader": false, "ar": [[1132.0, "<b>كلُّ قدرٍ يتعلّق بأفعال ربوبيته فكوني.<\/b> <span class=\"note\">(يكررها)<\/span>."], [1151.0, "كقول الله عز وجل:"], [1153.8, "<span class=\"ayah\">﴿وَكَانَ أَمْرُ اللَّهِ قَدَرًا مَّقْدُورًا﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٨]<\/span>،"], [1159.0, "وقول الله عز وجل:"], [1160.8, "<span class=\"ayah\">﴿إِنَّا كُلَّ شَيْءٍ خَلَقْنَاهُ بِقَدَرٍ﴾<\/span> <span class=\"ref\">[القمر: ٤٩]<\/span>."], [1163.0, "والمراد بالقدر هنا: أي القدر الكوني،"], [1167.0, "وهو ذلك القدر الذي يدبّر الله عز وجل به كونَه."], [1172.0, "والكون كلُّه ـ علويُّه وسفليُّه ـ خاضعٌ لهذا التقدير الكوني،"], [1178.0, "فلا يخرج شيءٌ من المخلوقات ـ وإن دقّ ـ عن كونه مقدَّرًا بتقديرٍ كونيٍّ لله عز وجل."], [1188.0, "وهذا التقدير الكوني لا بد وأن يقع،"], [1193.0, "ولا يستلزم محبةَ الله،"], [1195.8, "ويكون مرادًا لغيره لا لذاته."]], "tr": [[1132.0, "<b>5. külliye: O'nun rubûbiyyet fiillerine taalluk eden her kader kevnîdir.<\/b> (Tekrar ediyor.) Allah Azze ve Celle'nin şu sözü gibi:"], [1153.8, "<span class=\"ayah\">﴿Allah'ın emri, takdir edilmiş bir kaderdir﴾<\/span> [Ahzâb 38]."], [1159.0, "Ve Allah Azze ve Celle'nin şu sözü:"], [1160.8, "<span class=\"ayah\">﴿Şüphesiz biz her şeyi bir kaderle yarattık﴾<\/span> [Kamer 49]."], [1163.0, "Buradaki kaderden maksat kevnî kaderdir;"], [1163.0, "Allah Azze ve Celle'nin kâinatını onunla idare ettiği kaderdir."], [1167.0, "Kâinatın tamamı —yücesi ve aşağısıyla— bu kevnî takdire boyun eğmiştir."], [1172.0, "Mahlûkattan hiçbir şey, ne kadar küçük olursa olsun, Allah Azze ve Celle'nin kevnî bir takdiriyle takdir edilmiş olmaktan çıkmaz."], [1178.0, "Bu kevnî takdir mutlaka gerçekleşir, Allah'ın sevgisini gerektirmez, kendisi için değil başka bir şey için murad edilmiştir."]]}]}, {"ts": "20:01", "title": "6. Külliye: Ulûhiyyetin gereklerine taalluk eden her kader şer'îdir", "paras": [{"reader": false, "ar": [[1201.0, "ويوضّحه الكلّيّةُ التي بعدها:"], [1205.0, "<b>كلُّ قدرٍ يتعلّق بمقتضيات ألوهيته فشرعي.<\/b> <span class=\"note\">(يكررها)<\/span>."], [1218.0, "فالأمرُ بالإيمان من قدره الشرعي،"], [1223.0, "والأمرُ بالتوحيد من قدره الشرعي،"], [1226.0, "والأمرُ بالصلوات الخمس من قدره الشرعي،"], [1232.0, "وتقديرُه للزكاة من أمره الشرعي،"], [1236.0, "وتقديرُه للصوم في رمضان وللحجّ في أشهره كلُّها من أمره الشرعي،"], [1243.0, "والأمرُ ببرّ الوالدين من تقديره الشرعي."], [1247.0, "فكلُّ قدرٍ يتعلّق بشيءٍ من الشرع فإنه يُقال له: تقديرٌ شرعي."]], "tr": [[1201.0, "Bunu ondan sonraki külliye açıklar:"], [1201.0, "<b>6. külliye: O'nun ulûhiyyetinin gereklerine taalluk eden her kader şer'îdir.<\/b> (Tekrar ediyor.) İmanın emredilmesi O'nun şer'î kaderindendir;"], [1223.0, "tevhidin emredilmesi O'nun şer'î kaderindendir;"], [1226.0, "beş vakit namazın emredilmesi O'nun şer'î kaderindendir;"], [1232.0, "zekâtı takdir etmesi O'nun şer'î emrindendir;"], [1236.0, "Ramazan'da orucu ve belli aylarında haccı takdir etmesi, bunların hepsi O'nun şer'î emrindendir;"], [1243.0, "anne-babaya iyiliğin emredilmesi O'nun şer'î takdirindendir."], [1247.0, "Şeriattan bir şeye taalluk eden her kadere \"şer'î takdir\" denir."]]}]}, {"ts": "20:54", "title": "7. Külliye: Rubûbiyyet fiillerine taalluk eden her hüküm kevnîdir", "paras": [{"reader": false, "ar": [[1254.0, "ومن الكلّيّات أيضًا: <b>كلُّ حُكمٍ يتعلّق بأفعال ربوبيته فكوني.<\/b> كلُّ حكمٍ يتعلّق بأفعال ربوبيته فكوني،"], [1270.0, "أي فيوصف بأنه حكمٌ كوني."], [1275.0, "كقول الله عز وجل:"], [1277.7, "<span class=\"ayah\">﴿وَاللَّهُ يَحْكُمُ لَا مُعَقِّبَ لِحُكْمِهِ﴾<\/span> <span class=\"ref\">[الرعد: ٤١]<\/span>،"], [1281.0, "أي لحكمه الكوني. وقال الله عز وجل:"], [1286.2, "<span class=\"ayah\">﴿ثُمَّ رُدُّوا إِلَى اللَّهِ مَوْلَاهُمُ الْحَقِّ ۚ أَلَا لَهُ الْحُكْمُ﴾<\/span> ـ أي كونًا ـ <span class=\"ayah\">﴿وَهُوَ أَسْرَعُ الْحَاسِبِينَ﴾<\/span> <span class=\"ref\">[الأنعام: ٦٢]<\/span>."]], "tr": [[1254.0, "Külliyelerden biri de şudur: 7."], [1254.0, "külliye: O'nun rubûbiyyet fiillerine taalluk eden her hüküm kevnîdir. (Tekrar ediyor.) Yani kevnî bir hüküm olarak nitelenir."], [1270.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1277.7, "<span class=\"ayah\">﴿Allah hükmeder; O'nun hükmünü geri çevirecek yoktur﴾<\/span> [Ra'd 41];"], [1281.0, "yani O'nun kevnî hükmünü. Allah Azze ve Celle şöyle buyurmuştur:"], [1286.2, "<span class=\"ayah\">﴿Sonra hak mevlâları olan Allah'a döndürülürler. Bilin ki hüküm O'nundur﴾<\/span> —yani kevnî olarak— <span class=\"ayah\">﴿O, hesap görenlerin en süratlisidir﴾<\/span> [En'âm 62]."]]}, {"reader": false, "ar": [[1295.0, "وقال الله عز وجل:"], [1297.0, "<span class=\"ayah\">﴿إِنِ الْحُكْمُ إِلَّا لِلَّهِ﴾<\/span> <span class=\"ref\">[يوسف: ٤٠]<\/span>،"], [1299.0, "وهذه تصلح للحكمين: للحكم الكوني القدري،"], [1303.0, "وللحكم الأمري الشرعي الديني."], [1307.0, "ويقول الله عز وجل:"], [1309.2, "<span class=\"ayah\">﴿كُلُّ شَيْءٍ هَالِكٌ إِلَّا وَجْهَهُ ۚ لَهُ الْحُكْمُ﴾<\/span> ـ أي كونًا ـ <span class=\"ayah\">﴿وَإِلَيْهِ تُرْجَعُونَ﴾<\/span> <span class=\"ref\">[القصص: ٨٨]<\/span>."]], "tr": [[1295.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1297.0, "<span class=\"ayah\">﴿Hüküm ancak Allah'ındır﴾<\/span> [Yûsuf 40]."], [1297.0, "Bu ayet her iki hükme de elverişlidir:"], [1299.0, "kevnî-kaderî hükme ve emrî-şer'î-dinî hükme."], [1303.0, "Allah Azze ve Celle şöyle buyurur:"], [1309.2, "<span class=\"ayah\">﴿O'nun yüzü (zâtı) hariç her şey helâk olacaktır. Hüküm O'nundur﴾<\/span> —yani kevnî olarak— <span class=\"ayah\">﴿ve O'na döndürüleceksiniz﴾<\/span> [Kasas 88]."]]}]}, {"ts": "21:53", "title": "8. Külliye: Ulûhiyyetin gereklerine taalluk eden her hüküm şer'îdir", "paras": [{"reader": false, "ar": [[1316.0, "الكلّيّة التي بعدها: <b>كلُّ حكمٍ يتعلّق بمقتضيات ألوهيته فشرعي.<\/b> أقسامٌ ترونها بسيطةً وسهلة،"], [1329.0, "ولكن ضلّ فيها الجبرية والقدرية في باب القضاء والقدر ضلالًا عظيمًا،"], [1335.0, "فالحمد لله الذي يسّر فهمَها واعتقادها."], [1339.0, "كلُّ حكمٍ يتعلّق بمقتضيات ألوهيته فشرعي،"], [1343.0, "وهو ذلك الحكم الذي يصدر من الله عز وجل،"], [1348.0, "يأمر فيه بشيءٍ أو ينهى فيه عن شيء،"], [1355.0, "يعني أنه حكمٌ يتعلّق بشيءٍ من الشريعة،"], [1359.0, "تحليلًا وتحريمًا، أو أمرًا ونهيًا."]], "tr": [[1316.0, "Ondan sonraki külliye: 8. külliye:"], [1316.0, "O'nun ulûhiyyetinin gereklerine taalluk eden her hüküm şer'îdir. Bunları basit ve kolay taksimler olarak görüyorsunuz;"], [1329.0, "fakat Cebriyye ve Kaderiyye kaza ve kader babında bunlarda büyük bir sapıklıkla saptılar."], [1335.0, "Bunları anlamayı ve bunlara inanmayı kolaylaştıran Allah'a hamd olsun."], [1339.0, "O'nun ulûhiyyetinin gereklerine taalluk eden her hüküm şer'îdir."], [1343.0, "Bu, Allah Azze ve Celle'den sâdır olan, onda bir şeyi emrettiği veya bir şeyden nehyettiği hükümdür;"], [1355.0, "yani helal ve haram kılma ya da emir ve nehiy olarak şeriattan bir şeye taalluk eden hükümdür."]]}, {"reader": false, "ar": [[1361.0, "فقول الله عز وجل:"], [1364.0, "<span class=\"ayah\">﴿أَلَمْ تَرَ إِلَى الَّذِينَ أُوتُوا نَصِيبًا مِّنَ الْكِتَابِ يُدْعَوْنَ إِلَىٰ كِتَابِ اللَّهِ لِيَحْكُمَ بَيْنَهُمْ﴾<\/span> <span class=\"ref\">[آل عمران: ٢٣]<\/span>،"], [1372.0, "أي بالحكم الشرعي. وقال الله عز وجل:"], [1376.7, "<span class=\"ayah\">﴿وَكَيْفَ يُحَكِّمُونَكَ وَعِندَهُمُ التَّوْرَاةُ فِيهَا حُكْمُ اللَّهِ﴾<\/span> <span class=\"ref\">[المائدة: ٤٣]<\/span>،"], [1382.0, "حكمُ الله الشرعي، حكمُ الله الشرعي."]], "tr": [[1361.0, "Allah Azze ve Celle'nin şu sözü:"], [1364.0, "<span class=\"ayah\">﴿Kitap'tan kendilerine bir nasip verilenleri görmedin mi? Aralarında hükmetmesi için Allah'ın Kitabı'na çağrılıyorlar﴾<\/span> [Âl-i İmrân 23];"], [1364.0, "yani şer'î hükümle. Allah Azze ve Celle şöyle buyurmuştur:"], [1376.7, "<span class=\"ayah\">﴿İçinde Allah'ın hükmü bulunan Tevrat yanlarında iken seni nasıl hakem yapıyorlar?﴾<\/span> [Mâide 43];"], [1376.7, "Allah'ın şer'î hükmü, Allah'ın şer'î hükmü."]]}, {"reader": false, "ar": [[1387.0, "وكذلك يقول الله عز وجل:"], [1389.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ ۚ أُحِلَّتْ لَكُم بَهِيمَةُ الْأَنْعَامِ إِلَّا مَا يُتْلَىٰ عَلَيْكُمْ غَيْرَ مُحِلِّي الصَّيْدِ وَأَنتُمْ حُرُمٌ﴾<\/span> ها؟"], [1399.0, "<span class=\"ayah\">﴿إِنَّ اللَّهَ يَحْكُمُ مَا يُرِيدُ﴾<\/span> <span class=\"ref\">[المائدة: ١]<\/span>،"], [1402.0, "يعني بحكمه الشرعي. وقال الله عز وجل:"], [1407.0, "<span class=\"ayah\">﴿وَإِذَا دُعُوا إِلَى اللَّهِ وَرَسُولِهِ لِيَحْكُمَ بَيْنَهُمْ إِذَا فَرِيقٌ مِّنْهُم مُّعْرِضُونَ﴾<\/span> <span class=\"ref\">[النور: ٤٨]<\/span>،"], [1416.0, "أي بحكمه الشرعي. وقال الله عز وجل:"], [1420.6, "<span class=\"ayah\">﴿أَفَحُكْمَ الْجَاهِلِيَّةِ يَبْغُونَ ۚ وَمَنْ أَحْسَنُ مِنَ اللَّهِ حُكْمًا لِّقَوْمٍ يُوقِنُونَ﴾<\/span> <span class=\"ref\">[المائدة: ٥٠]<\/span>."], [1427.0, "فمتى ما رأيت الحكمَ مضافًا إلى شيءٍ من أفعاله الكونية فهو حكمٌ كوني،"], [1433.0, "ومتى ما رأيت الحكم مضافًا إلى شيءٍ من مقتضيات الألوهية فهو حكمٌ شرعي."]], "tr": [[1387.0, "Aynı şekilde Allah Azze ve Celle şöyle buyurur:"], [1389.0, "<span class=\"ayah\">﴿Ey iman edenler! Akitlerinizi yerine getirin. İhramlı iken avlanmayı helal saymamanız şartıyla, size okunacak olanlar dışındaki hayvanlar size helal kılındı﴾<\/span> değil mi?"], [1389.0, "<span class=\"ayah\">﴿Şüphesiz Allah dilediği hükmü verir﴾<\/span> [Mâide 1];"], [1399.0, "yani şer'î hükmüyle. Allah Azze ve Celle şöyle buyurmuştur:"], [1402.0, "<span class=\"ayah\">﴿Aralarında hükmetmesi için Allah'a ve Resûlü'ne çağrıldıklarında, bakarsın ki içlerinden bir grup yüz çevirir﴾<\/span> [Nûr 48];"], [1407.0, "yani O'nun şer'î hükmüyle. Allah Azze ve Celle şöyle buyurmuştur:"], [1416.0, "<span class=\"ayah\">﴿Yoksa onlar cahiliye hükmünü mü arıyorlar? Kesin olarak inanan bir topluluk için hüküm bakımından Allah'tan daha güzel kim olabilir?﴾<\/span> [Mâide 50]."], [1420.6, "Hükmün O'nun kevnî fiillerinden bir şeye izafe edildiğini gördüğün zaman o kevnî bir hükümdür;"], [1427.0, "hükmün ulûhiyyetin gereklerinden bir şeye izafe edildiğini gördüğün zaman o şer'î bir hükümdür."]]}]}, {"ts": "24:00", "title": "9. Külliye: Rubûbiyyet fiillerine taalluk eden her kaza kevnîdir", "paras": [{"reader": false, "ar": [[1440.0, "ومن الكلّيّات أيضًا: كلُّ قضاءٍ..."], [1443.6, "مَن يُكمل القاعدة؟ <span class=\"q\">؟ 24:00<\/span> <b>كلُّ قضاءٍ يتعلّق بأفعال ربوبيته فكوني.<\/b> كلُّ قضاءٍ يتعلّق بأفعال ربوبيته فكوني."], [1461.0, "جاك النوم؟ انتبه! كلُّ قضاءٍ يتعلّق بأفعال ربوبيته فكوني."]], "tr": [[1440.0, "Külliyelerden biri de şudur: Her kaza..."], [1440.0, "Kaideyi kim tamamlar? <span class=\"q\">؟<\/span> 9."], [1443.6, "külliye: O'nun rubûbiyyet fiillerine taalluk eden her kaza kevnîdir. (Tekrar ediyor.) Uykun mu geldi?"], [1443.6, "Dikkat et! O'nun rubûbiyyet fiillerine taalluk eden her kaza kevnîdir."]]}, {"reader": false, "ar": [[1472.0, "كقول الله عز وجل:"], [1476.0, "«وقضينا إلى بني إسرائيل لتفسدنّ في الأرض مرتين»،"], [1482.0, "<span class=\"ayah\">﴿وَقَضَيْنَا إِلَىٰ بَنِي إِسْرَائِيلَ فِي الْكِتَابِ لَتُفْسِدُنَّ فِي الْأَرْضِ مَرَّتَيْنِ﴾<\/span> <span class=\"ref\">[الإسراء: ٤]<\/span> <span class=\"note\">(Şeyh önce «في الكتاب»ı atlayarak okuyor, sonra düzeltiyor.)<\/span>،"], [1489.0, "أي بالقضاء الكوني. وقال الله عز وجل عن السماوات:"], [1496.5, "<span class=\"ayah\">﴿فَقَضَاهُنَّ سَبْعَ سَمَاوَاتٍ﴾<\/span> <span class=\"ref\">[فصلت: ١٢]<\/span>، أي بالقضاء الكوني."], [1500.0, "وقال الله عز وجل:"], [1502.9, "<span class=\"ayah\">﴿فَلَمَّا قَضَيْنَا عَلَيْهِ الْمَوْتَ﴾<\/span> <span class=\"ref\">[سبأ: ١٤]<\/span>، أي بالقضاء الكوني."]], "tr": [[1472.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1476.0, "\"İsrâiloğullarına, yeryüzünde iki kez fesat çıkaracağınızı bildirdik\";"], [1482.0, "<span class=\"ayah\">﴿Kitapta İsrâiloğullarına, yeryüzünde iki kez fesat çıkaracağınızı hükmederek bildirdik﴾<\/span> [İsrâ 4];"], [1482.0, "yani kevnî kaza ile. Allah Azze ve Celle gökler hakkında şöyle buyurmuştur:"], [1489.0, "<span class=\"ayah\">﴿Onları yedi gök olarak tamamladı (hükmetti)﴾<\/span> [Fussilet 12];"], [1496.5, "yani kevnî kaza ile. Allah Azze ve Celle şöyle buyurmuştur:"], [1502.9, "<span class=\"ayah\">﴿Onun ölümüne hükmettiğimizde﴾<\/span> [Sebe' 14]; yani kevnî kaza ile."]]}]}, {"ts": "25:10", "title": "10. Külliye: Ulûhiyyetin gereklerine taalluk eden her kaza şer'îdir", "paras": [{"reader": false, "ar": [[1510.0, "ومن الكلّيّات أيضًا: كلُّ قضاءٍ يتعلّق بـ..."], [1514.0, "ها؟ بمقتضيات ألوهيته فشرعي. كلُّ قضاءٍ يتعلّق بمقتضيات ألوهيته فشرعي."], [1525.0, "وهو ذلك القضاء الذي يتعلّق به التحليل والتحريم أو الأمر والنهي الشرعيين،"], [1531.0, "أو يتعلّق به الأمر والنهي الشرعيين."], [1538.0, "كقول الله عز وجل:"], [1541.1, "<span class=\"ayah\">﴿وَقَضَىٰ رَبُّكَ أَلَّا تَعْبُدُوا إِلَّا إِيَّاهُ وَبِالْوَالِدَيْنِ إِحْسَانًا﴾<\/span> <span class=\"ref\">[الإسراء: ٢٣]<\/span>،"], [1547.0, "وقول الله عز وجل:"], [1548.8, "<span class=\"ayah\">﴿وَمَا كَانَ لِمُؤْمِنٍ وَلَا مُؤْمِنَةٍ إِذَا قَضَى اللَّهُ وَرَسُولُهُ أَمْرًا أَن يَكُونَ لَهُمُ الْخِيَرَةُ مِنْ أَمْرِهِمْ﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٦]<\/span>."]], "tr": [[1510.0, "Külliyelerden biri de şudur: 10."], [1510.0, "külliye: O'nun... ne? ...ulûhiyyetinin gereklerine taalluk eden her kaza şer'îdir. (Tekrar ediyor.) Bu, helal ve haram kılmanın ya da şer'î emir ve nehyin kendisine taalluk ettiği kazadır;"], [1531.0, "yahut şer'î emir ve nehyin kendisine taalluk ettiği kazadır."], [1541.1, "Allah Azze ve Celle'nin şu sözü gibi:"], [1541.1, "<span class=\"ayah\">﴿Rabbin, kendisinden başkasına ibadet etmemenizi ve anne-babaya iyilik etmenizi hükmetti﴾<\/span> [İsrâ 23]."], [1548.8, "Ve Allah Azze ve Celle'nin şu sözü:"], [1548.8, "<span class=\"ayah\">﴿Allah ve Resûlü bir işe hükmettiği zaman, mümin bir erkek ve mümin bir kadın için o işlerinde tercih hakkı yoktur﴾<\/span> [Ahzâb 36]."]]}]}, {"ts": "25:58", "title": "11. Külliye: Rubûbiyyet fiillerine taalluk eden her emir kevnîdir", "paras": [{"reader": false, "ar": [[1558.0, "ومن الكلّيّات أيضًا: <b>كلُّ أمرٍ يتعلّق بأفعال ربوبيته فكوني.<\/b> <span class=\"note\">(يكررها)<\/span>."], [1587.0, "كقول الله عز وجل:"], [1589.0, "<span class=\"ayah\">﴿إِنَّمَا أَمْرُهُ إِذَا أَرَادَ شَيْئًا أَن يَقُولَ لَهُ كُن فَيَكُونُ﴾<\/span> <span class=\"ref\">[يس: ٨٢]<\/span>،"], [1594.0, "وقول الله عز وجل:"], [1596.7, "<span class=\"ayah\">﴿وَإِذَا أَرَدْنَا أَن نُّهْلِكَ قَرْيَةً أَمَرْنَا مُتْرَفِيهَا﴾<\/span> <span class=\"ref\">[الإسراء: ١٦]<\/span>،"], [1601.4, "أي بأمرنا الكوني، الذي لا بد وأن يقع،"], [1607.1, "ولا يستلزم محبةَ الله عز وجل،"], [1612.0, "وليس مرادًا لذاته، وإنما مرادٌ لغيره،"], [1617.0, "كما ستأتينا في كلّيّةٍ تجمع ذلك كلَّه إن شاء الله."]], "tr": [[1558.0, "Külliyelerden biri de şudur: 11."], [1558.0, "külliye: O'nun rubûbiyyet fiillerine taalluk eden her emir kevnîdir. (Tekrar ediyor.) Allah Azze ve Celle'nin şu sözü gibi:"], [1589.0, "<span class=\"ayah\">﴿O bir şeyi dilediği zaman, O'nun emri ona sadece \"Ol!\" demektir; o da hemen oluverir﴾<\/span> [Yâsîn 82]."], [1589.0, "Ve Allah Azze ve Celle'nin şu sözü:"], [1596.7, "<span class=\"ayah\">﴿Bir memleketi helâk etmek istediğimizde, onun şımarık varlıklılarına emrederiz﴾<\/span> [İsrâ 16];"], [1596.7, "yani kevnî emrimizle. Bu emir mutlaka gerçekleşir, Allah Azze ve Celle'nin sevgisini gerektirmez, bizzat kendisi için murad edilmiş değildir, ancak başka bir şey için murad edilmiştir;"], [1617.0, "inşallah bunların hepsini bir araya getiren bir külliyede bize gelecektir."]]}, {"reader": false, "ar": [[1620.0, "وقولُ الله عز وجل ـ وقول الله عز وجل عن ريح عاد ـ:"], [1625.8, "<span class=\"ayah\">﴿تُدَمِّرُ كُلَّ شَيْءٍ﴾<\/span> بإيش؟"], [1630.0, "<span class=\"ayah\">﴿بِأَمْرِ رَبِّهَا﴾<\/span> <span class=\"ref\">[الأحقاف: ٢٥]<\/span>، أي الكوني."], [1632.0, "وقال الله عز وجل:"], [1634.0, "<span class=\"ayah\">﴿وَلِلَّهِ غَيْبُ السَّمَاوَاتِ وَالْأَرْضِ وَإِلَيْهِ يُرْجَعُ الْأَمْرُ كُلُّهُ﴾<\/span> <span class=\"ref\">[هود: ١٢٣]<\/span>،"], [1641.0, "أي الأمر الكوني. وقال الله عز وجل:"], [1645.0, "<span class=\"ayah\">﴿وَمَا أَمْرُنَا إِلَّا وَاحِدَةٌ كَلَمْحٍ بِالْبَصَرِ﴾<\/span> <span class=\"ref\">[القمر: ٥٠]<\/span>،"], [1649.0, "أي الأمر الكوني. وقال الله عز وجل:"], [1652.0, "<span class=\"ayah\">﴿وَكَانَ أَمْرُ اللَّهِ مَفْعُولًا﴾<\/span> <span class=\"ref\">[النساء: ٤٧]<\/span>، أي أمرُه الكوني."]], "tr": [[1620.0, "Allah Azze ve Celle'nin —Âd kavminin rüzgârı hakkındaki— şu sözü:"], [1625.8, "<span class=\"ayah\">﴿Her şeyi yerle bir eder﴾<\/span> neyle?"], [1630.0, "<span class=\"ayah\">﴿Rabbinin emriyle﴾<\/span> [Ahkâf 25]; yani kevnî emriyle."], [1630.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1634.0, "<span class=\"ayah\">﴿Göklerin ve yerin gaybı Allah'ındır. Bütün işler (emir) O'na döndürülür﴾<\/span> [Hûd 123];"], [1634.0, "yani kevnî emir. Allah Azze ve Celle şöyle buyurmuştur:"], [1641.0, "<span class=\"ayah\">﴿Bizim emrimiz, göz açıp kapayıncaya kadar olan tek bir (söz)dür﴾<\/span> [Kamer 50];"], [1645.0, "yani kevnî emir. Allah Azze ve Celle şöyle buyurmuştur:"], [1652.0, "<span class=\"ayah\">﴿Allah'ın emri mutlaka yerine gelir﴾<\/span> [Nisâ 47]; yani O'nun kevnî emri."]]}, {"reader": false, "ar": [[1656.0, "وقال الله عز وجل:"], [1658.0, "<span class=\"ayah\">﴿وَإِذَا جَاءَهُمْ أَمْرٌ مِّنَ الْأَمْنِ أَوِ الْخَوْفِ أَذَاعُوا بِهِ﴾<\/span> <span class=\"ref\">[النساء: ٨٣]<\/span>،"], [1665.0, "أي شيءٌ من الأمر الكوني يوجب إخافتَهم أو يوجب أمنَهم."], [1672.0, "وقال الله عز وجل عن نوحٍ أنه قال لابنه وهو يغرق:"], [1677.0, "<span class=\"ayah\">﴿قَالَ لَا عَاصِمَ الْيَوْمَ مِنْ أَمْرِ اللَّهِ إِلَّا مَن رَّحِمَ﴾<\/span> <span class=\"ref\">[هود: ٤٣]<\/span>."], [1683.0, "وقال الله عز وجل:"], [1686.0, "<span class=\"ayah\">﴿يَا إِبْرَاهِيمُ أَعْرِضْ عَنْ هَٰذَا ۖ إِنَّهُ قَدْ جَاءَ أَمْرُ رَبِّكَ﴾<\/span> <span class=\"ref\">[هود: ٧٦]<\/span>،"], [1695.0, "وبما أنه أمرٌ يتعلّق بشيءٍ من التدبير الكوني فهو كوني."]], "tr": [[1656.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1658.0, "<span class=\"ayah\">﴿Onlara güvenlik veya korkuya dair bir haber (emir) geldiğinde onu yayarlar﴾<\/span> [Nisâ 83];"], [1658.0, "yani onları korkutmayı veya güvende hissettirmeyi gerektiren kevnî emirden bir şey."], [1672.0, "Allah Azze ve Celle, Nûh'un boğulmakta olan oğluna şöyle dediğini bildirir:"], [1677.0, "<span class=\"ayah\">﴿Dedi ki: Bugün Allah'ın emrinden koruyacak hiçbir şey yoktur; ancak O'nun merhamet ettiği müstesna﴾<\/span> [Hûd 43]."], [1686.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1686.0, "<span class=\"ayah\">﴿Ey İbrâhîm! Bundan vazgeç. Çünkü Rabbinin emri gelmiştir﴾<\/span> [Hûd 76]."], [1686.0, "Kevnî tedbirden bir şeye taalluk eden bir emir olduğuna göre kevnîdir."]]}, {"reader": false, "ar": [[1701.0, "وقال الله عز وجل عن الملائكة الحفظة:"], [1705.0, "<span class=\"ayah\">﴿يَحْفَظُونَهُ مِنْ أَمْرِ اللَّهِ﴾<\/span> <span class=\"ref\">[الرعد: ١١]<\/span>،"], [1708.0, "أي هؤلاء الحفظة إنما حفظوه بأمرٍ من الله عز وجل."], [1714.0, "وقال الله عز وجل:"], [1716.8, "<span class=\"ayah\">﴿أَتَىٰ أَمْرُ اللَّهِ فَلَا تَسْتَعْجِلُوهُ﴾<\/span> <span class=\"ref\">[النحل: ١]<\/span>،"], [1721.0, "أي أمره الكوني. وقال الله عز وجل:"], [1724.5, "«هل ينظرون إلا أن تأتيهم الملائكة أو يأتي ربك، أو يأتي بعض...»،"], [1733.0, "<span class=\"ayah\">﴿هَلْ يَنظُرُونَ إِلَّا أَن تَأْتِيَهُمُ الْمَلَائِكَةُ أَوْ يَأْتِيَ أَمْرُ رَبِّكَ ۚ كَذَٰلِكَ فَعَلَ الَّذِينَ مِن قَبْلِهِمْ ۚ وَمَا ظَلَمَهُمُ اللَّهُ وَلَٰكِن كَانُوا أَنفُسَهُمْ يَظْلِمُونَ﴾<\/span> <span class=\"ref\">[النحل: ٣٣]<\/span>، في سورة النحل."]], "tr": [[1701.0, "Allah Azze ve Celle koruyucu melekler hakkında şöyle buyurmuştur:"], [1705.0, "<span class=\"ayah\">﴿Onu Allah'ın emriyle korurlar﴾<\/span> [Ra'd 11];"], [1705.0, "yani bu koruyucular onu ancak Allah Azze ve Celle'den bir emirle korurlar."], [1714.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1716.8, "<span class=\"ayah\">﴿Allah'ın emri geldi; artık onu acele istemeyin﴾<\/span> [Nahl 1];"], [1721.0, "yani O'nun kevnî emri. Allah Azze ve Celle şöyle buyurmuştur:"], [1724.5, "\"Onlar ancak meleklerin kendilerine gelmesini veya Rabbinin gelmesini, ya da bazı..."], [1733.0, "(âyetlerinin) gelmesini mi bekliyorlar\" —(düzeltiyor:)— <span class=\"ayah\">﴿Onlar ancak meleklerin kendilerine gelmesini veya Rabbinin emrinin gelmesini mi bekliyorlar? Onlardan öncekiler de böyle yaptı. Allah onlara zulmetmedi, fakat onlar kendilerine zulmediyorlardı﴾<\/span> [Nahl 33]; Nahl sûresinde."]]}, {"reader": false, "ar": [[1747.0, "فكلُّ هذه الأوامر المضافة إلى الله عز وجل يصفها أهل السنة بأنها الأمرُ الكوني،"], [1754.0, "لأنها تتعلّق بشيءٍ من التدبير الكوني،"], [1756.0, "وكلُّ ما يتعلّق بالتدبير الكوني المحض فمنسوبٌ إلى أفعال ربوبيته."]], "tr": [[1747.0, "Allah Azze ve Celle'ye izafe edilen bütün bu emirleri Ehl-i Sünnet kevnî emir olarak niteler;"], [1747.0, "çünkü bunlar kevnî tedbirden bir şeye taalluk eder."], [1754.0, "Salt kevnî tedbire taalluk eden her şey, O'nun rubûbiyyet fiillerine nispet edilir."]]}]}, {"ts": "29:24", "title": "12. Külliye: Ulûhiyyetin gereklerine taalluk eden her emir şer'îdir", "paras": [{"reader": false, "ar": [[1764.0, "ومن الكلّيّات أيضًا: كلُّ أمرٍ..."], [1766.9, "مَن يُكمل؟ «يتعلّق بمقتضيات إله...» بس."], [1768.0, "<b>كلُّ أمرٍ يتعلّق بمقتضيات ألوهيته فشرعي.<\/b> كقول الله عز وجل:"], [1779.7, "<span class=\"ayah\">﴿إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَىٰ﴾<\/span> <span class=\"ref\">[النحل: ٩٠]<\/span>،"], [1784.4, "أي بأمره الشرعي. وقول الله عز وجل:"], [1798.7, "<span class=\"ayah\">﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾<\/span> <span class=\"ref\">[النساء: ٥٨]<\/span>، أي بأمره الشرعي."]], "tr": [[1764.0, "Külliyelerden biri de şudur: Her emir..."], [1764.0, "Kim tamamlar? (Bir talebe:) \"…ulûhiyyetinin gereklerine taalluk eden…\" Yeter."], [1768.0, "<b>12. külliye: O'nun ulûhiyyetinin gereklerine taalluk eden her emir şer'îdir.<\/b> Allah Azze ve Celle'nin şu sözü gibi:"], [1779.7, "<span class=\"ayah\">﴿Şüphesiz Allah adaleti, iyiliği ve yakınlara vermeyi emreder﴾<\/span> [Nahl 90];"], [1784.4, "yani şer'î emriyle. Ve Allah Azze ve Celle'nin şu sözü:"], [1798.7, "<span class=\"ayah\">﴿Şüphesiz Allah size emanetleri ehline vermenizi emrediyor﴾<\/span> [Nisâ 58]; yani şer'î emriyle."]]}, {"reader": false, "ar": [[1806.0, "وقال الله عز وجل:"], [1808.7, "<span class=\"ayah\">﴿قُلْ إِنَّ اللَّهَ لَا يَأْمُرُ بِالْفَحْشَاءِ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٨]<\/span>،"], [1812.8, "أي بأمره الشرعي؛ فالأمر المنفيُّ هنا إنما هو الأمر الشرعي."], [1823.0, "وبه تعلم وجهَ الجمع بين هذه الآية:"], [1827.1, "<span class=\"ayah\">﴿إِنَّ اللَّهَ لَا يَأْمُرُ بِالْفَحْشَاءِ﴾<\/span>،"], [1830.0, "وبين قول الله عز وجل:"], [1833.1, "<span class=\"ayah\">﴿وَإِذَا أَرَدْنَا أَن نُّهْلِكَ قَرْيَةً أَمَرْنَا مُتْرَفِيهَا﴾<\/span> <span class=\"ref\">[الإسراء: ١٦]<\/span>؛"], [1838.0, "فالأمر في الآية الأولى إنما هو الأمر الشرعي،"], [1842.0, "والأمر في الآية الثانية إنما هو الأمر الكوني،"], [1849.0, "الذي لا يستلزم محبةَ الله ولا رضاه."]], "tr": [[1806.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [1808.7, "<span class=\"ayah\">﴿De ki: Şüphesiz Allah hayâsızlığı emretmez﴾<\/span> [A'râf 28];"], [1812.8, "yani şer'î emriyle. Burada nefyedilen emir ancak şer'î emirdir."], [1823.0, "Bununla, <span class=\"ayah\">﴿Şüphesiz Allah hayâsızlığı emretmez﴾<\/span> ayeti ile Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bir memleketi helâk etmek istediğimizde, onun şımarık varlıklılarına emrederiz﴾<\/span> [İsrâ 16] sözünü bağdaştırmanın yolunu öğrenirsin:"], [1838.0, "Birinci ayetteki emir ancak şer'î emirdir;"], [1842.0, "ikinci ayetteki emir ise Allah'ın sevgisini ve rızasını gerektirmeyen kevnî emirdir."]]}, {"reader": false, "ar": [[1851.0, "وقول الله عز وجل:"], [1853.5, "<span class=\"ayah\">﴿وَيَقْطَعُونَ مَا أَمَرَ اللَّهُ بِهِ أَن يُوصَلَ﴾<\/span> <span class=\"ref\">[البقرة: ٢٧]<\/span>،"], [1858.0, "أي بأمره الشرعي. وقول الله عز وجل:"], [1861.9, "<span class=\"ayah\">﴿قُلْ أَمَرَ رَبِّي بِالْقِسْطِ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٩]<\/span>،"], [1865.0, "أي بأمره الشرعي. وقال الله عز وجل:"], [1868.0, "<span class=\"ayah\">﴿وَالَّذِينَ يَصِلُونَ مَا أَمَرَ اللَّهُ بِهِ أَن يُوصَلَ﴾<\/span> <span class=\"ref\">[الرعد: ٢١]<\/span>، أي بأمره الشرعي."]], "tr": [[1851.0, "Allah Azze ve Celle'nin şu sözü:"], [1853.5, "<span class=\"ayah\">﴿Allah'ın birleştirilmesini emrettiği şeyi koparırlar﴾<\/span> [Bakara 27];"], [1853.5, "yani şer'î emriyle. Ve Allah Azze ve Celle'nin şu sözü:"], [1861.9, "<span class=\"ayah\">﴿De ki: Rabbim adaleti emretti﴾<\/span> [A'râf 29];"], [1861.9, "yani şer'î emriyle. Allah Azze ve Celle şöyle buyurmuştur:"], [1868.0, "<span class=\"ayah\">﴿Onlar ki Allah'ın birleştirilmesini emrettiği şeyi birleştirirler﴾<\/span> [Ra'd 21]; yani şer'î emriyle."]]}]}, {"ts": "31:14", "title": "Kapanış", "paras": [{"reader": false, "ar": [[1874.3, "لعلّنا نكتفي بهذا القدر <span class=\"q\">؟ 31:14<\/span>،"], [1877.0, "والله أعلى وأعلم، وصلى الله وسلم على نبينا محمد."], [1882.0, "أنا جعلتُ كلَّ قسمٍ منها في كلّيّةٍ خاصة لأهمية هذه التقسيمات،"], [1888.0, "التي بفهمها ستُفهم القواعد القدرية فيما بعد،"], [1890.7, "في أفعال العباد وغيرها."], [1892.0, "جزاكم الله عن المسلمين خيرًا."]], "tr": [[1874.3, "Belki bu kadarıyla yetiniriz <span class=\"q\">؟<\/span>."], [1874.3, "Allah en yüce olandır ve en iyisini bilendir."], [1877.0, "Allah Peygamberimiz Muhammed'e salât ve selâm etsin."], [1882.0, "Bu taksimlerin önemi sebebiyle her kısmı ayrı bir külliyede verdim;"], [1882.0, "çünkü onları anlamakla, ileride kulların fiilleri ve diğer konulardaki kader kaideleri anlaşılacaktır."], [1890.7, "Allah sizi Müslümanlar adına hayırla mükâfatlandırsın."]]}]}]};

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
