<script>
const D={"no": 52, "vid": "tMQGx3yimcA", "title_ar": "الدرس (٥٢) من شرح كليات العقيدة — من كليات السحر وعالم الجن", "title_tr": "Şerhu Külliyyâti'l-Akîde — 52. Ders: Sihir ve Cin Âlemi Külliyeleri (Sihrin Hakikati, Cinlerden Kehânet Yoluyla Yardım İstemek, Tedavide Cin Kullanmak, Cinlerin İnsana Girmesi, Cinlerin Mükellefiyeti, Cin Âlemi Hakkında Delil Şartı)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Sihrin hakikatini inkâr eden herkes bid'at ehlindendir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.9, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.8, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.2, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [10.0, "أمّا بعد: عندنا في هذا الدرس جُمَلٌ من الكلّيّات."], [15.0, "الكلّيّة الأولى <span class=\"q\">؟ 00:15<\/span>: <b>كلُّ من أنكر حقيقةَ السحر فمن أهل البدع.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.9, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.5, "Bundan sonra: Bu derste elimizde birçok külliye var."], [13.9, "1. külliye <span class=\"q\">؟<\/span>: 1. külliye:"], [16.3, "Sihrin hakikatini inkâr eden herkes bid'at ehlindendir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[34.0, "أقول وبالله التوفيق: لقد أجمع أهلُ السنّة والجماعة على أنّ السحر الذي أثبته الله عز وجل في كتابه،"], [41.4, "ونبيُّه صلى الله عليه وسلم في صحيح سنّته،"], [44.8, "أنّ له حقيقة، وأنه ليس مجرّدَ أوهامٍ وخيالاتٍ ومجرّدَ إحساساتٍ يُحسّ الإنسانُ بها،"], [52.7, "وإنما له حقيقةٌ ظاهرةٌ واقعة."], [56.1, "فمنه ما يُجِنّ العقل،"], [58.8, "ومنه ما يُمرِض الجسد،"], [61.0, "ويُوجب للإنسان أن يكون مُمدَّدًا بين أهله مريضًا،"], [66.0, "ولا يعرف أهلُه حقيقةَ مرضه."], [68.8, "ومنه ما يُفرّق بين الزوج وزوجه،"], [71.9, "ومنه ما يُوجب القتل،"], [76.0, "فيموت بين ظَهرانَي أهله ولا يعرفون سببَ قتله."]], "tr": [[34.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat, Allah Azze ve Celle'nin Kitabı'nda ve Peygamberi sallallâhu aleyhi ve sellem'in sahih sünnetinde isbat ettiği sihrin bir hakikati olduğunda, onun sadece vehimler, hayaller ve insanın hissettiği birtakım duygulardan ibaret olmadığında, bilakis açık ve vâki bir hakikati bulunduğunda icmâ etmiştir."], [54.7, "Ondan aklı delirten vardır, bedeni hasta eden vardır;"], [59.7, "insanın ailesi arasında hasta olarak yatağa uzanıp kalmasına sebep olur da ailesi hastalığının hakikatini bilmez."], [68.4, "Ondan karı ile koca arasını ayıran vardır, ölüme sebep olan vardır;"], [73.9, "kişi ailesinin ortasında ölür de onlar ölümünün sebebini bilmezler."]]}, {"reader": false, "ar": [[81.0, "فالسحرُ له حقيقة، ويؤثّر إذا شاء الله عز وجل وقوعَ تأثيره،"], [86.0, "كما قال الله عز وجل:"], [88.1, "<span class=\"ayah\">﴿وَمَا هُم بِضَارِّينَ بِهِ مِنْ أَحَدٍ إِلَّا بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[البقرة: ١٠٢]<\/span>."], [92.0, "فإن قلت: وما برهانُك على هذا؟"], [95.0, "فأقول: البرهانُ آياتٌ كثيرة،"], [98.0, "منها قول الله عز وجل:"], [99.9, "<span class=\"ayah\">﴿وَاتَّبَعُوا مَا تَتْلُو الشَّيَاطِينُ عَلَىٰ مُلْكِ سُلَيْمَانَ وَمَا كَفَرَ سُلَيْمَانُ وَلَٰكِنَّ الشَّيَاطِينَ كَفَرُوا﴾<\/span> <span class=\"ref\">[البقرة: ١٠٢]<\/span>، الآيةَ بتمامها."]], "tr": [[81.0, "Sihrin bir hakikati vardır ve Allah Azze ve Celle etkisinin gerçekleşmesini dilediğinde etki eder."], [86.0, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [88.1, "<span class=\"ayah\">﴿Hâlbuki onlar, Allah'ın izni olmadıkça onunla kimseye zarar verecek değillerdi﴾<\/span> [Bakara 102]."], [92.0, "Eğer \"Buna delilin nedir?\" dersen, derim ki:"], [95.0, "Delil pek çok ayettir. Bunlardan biri Allah Azze ve Celle'nin şu sözüdür:"], [99.9, "<span class=\"ayah\">﴿Süleyman'ın mülkü hakkında şeytanların okuyup durduklarına uydular. Süleyman kâfir olmadı, fakat şeytanlar kâfir oldular﴾<\/span> [Bakara 102], ayetin tamamı."]]}, {"reader": false, "ar": [[108.0, "قال الإمامُ المازَريّ رحمه الله تعالى:"], [112.0, "«أهلُ السنّة وجمهورُ العلماء من الأمّة على إثبات السحر، وأنّ له حقيقةً كحقائق غيره من الأشياء الثابتة، خلافًا لمن أنكره ونفى حقيقتَه، وأضاف ما يتّفق منه إلى خيالاتٍ باطلةٍ لا حقائقَ لها»."], [132.0, "انتهى كلامه. فقد حكى في هذا النقل إجماعَ أهل السنّة والجماعة على أنّ للسحر حقيقة،"], [139.0, "وأنّ كلَّ من أنكر السحر فإنه من أهل البدع؛"], [142.0, "لأنّ أوّلَ من أنكره إنما هم الجهميّةُ والمعتزلة،"], [147.0, "إنّ أوّلَ من أنكره إنما هم الجهميّةُ والمعتزلة."]], "tr": [[108.0, "İmam el-Mâzerî —Allah ona rahmet etsin— şöyle demiştir:"], [112.6, "\"Ehl-i Sünnet ve ümmetin âlimlerinin cumhuru sihrin isbatı ve onun, sabit olan diğer şeylerin hakikatleri gibi bir hakikati olduğu görüşündedir."], [125.4, "Bu, onu inkâr edip hakikatini nefyeden ve ondan meydana gelenleri hakikati olmayan bâtıl hayallere bağlayanlara muhaliftir.\" Sözü bitti."], [134.4, "Bu nakilde Ehl-i Sünnet ve'l-Cemaat'in sihrin bir hakikati olduğuna ve sihri inkâr eden herkesin bid'at ehlinden olduğuna dair icmâını hikâye etmiştir."], [142.6, "Çünkü onu ilk inkâr edenler Cehmiyye ve Mu'tezile'dir;"], [147.6, "onu ilk inkâr edenler Cehmiyye ve Mu'tezile'dir."]]}, {"reader": false, "ar": [[152.0, "ويدلّ على ذلك أيضًا قولُ الله عز وجل:"], [156.5, "<span class=\"ayah\">﴿قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ مِن شَرِّ مَا خَلَقَ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ﴾<\/span> <span class=\"ref\">[الفلق: ١–٤]<\/span>."], [166.0, "فأمر الله عز وجل نبيَّه صلى الله عليه وسلم أصالةً،"], [170.7, "وأمّتَه تبعًا، أن يتعوّذوا من شرّ النفّاثات في العقد."], [175.0, "فلو كان مجرّدَ خيالاتٍ وأوهامٍ لما أوجب أن يستعيذوا منه؛"], [179.0, "فإنّ الاستعاذة من الخيالات والأوهام ليست بمشروعة."], [183.0, "فلمّا أمر الله عز وجل بالاستعاذة منه دلّ على أنّ له حقيقة،"], [189.0, "وأنه يُفرّق بين المرء وزوجه."], [192.0, "وهذا كلُّه متّفقٌ عليه بين أهل السنّة والجماعة."]], "tr": [[152.0, "Buna Allah Azze ve Celle'nin şu sözü de delalet eder:"], [156.5, "<span class=\"ayah\">﴿De ki: Yarattığı şeylerin şerrinden, karanlığı çöktüğü zaman gecenin şerrinden ve düğümlere üfleyenlerin şerrinden sabahın Rabbine sığınırım﴾<\/span> [Felak 1–4]."], [166.0, "Allah Azze ve Celle, aslen Peygamberi sallallâhu aleyhi ve sellem'e, tâbi olarak da ümmetine düğümlere üfleyenlerin şerrinden sığınmalarını emretti."], [174.1, "Eğer (sihir) sadece hayaller ve vehimlerden ibaret olsaydı ondan sığınmalarını vâcip kılmazdı;"], [178.2, "çünkü hayallerden ve vehimlerden sığınmak meşru değildir."], [181.9, "Allah Azze ve Celle ondan sığınmayı emredince, bu onun bir hakikati olduğuna ve kişi ile eşinin arasını ayırdığına delalet etti."], [191.4, "Bütün bunlar Ehl-i Sünnet ve'l-Cemaat arasında üzerinde ittifak edilmiş şeylerdir."]]}, {"reader": false, "ar": [[196.0, "وقال الإمامُ الخطّابيّ رحمه الله تعالى:"], [200.0, "«السحرُ ثابتٌ وحقيقتُه موجودة، وقد اتّفق أكثرُ الأمم من العرب والفرس والهند وبعض الروم على إثباته، وهؤلاء من أفضل سكّان واسطة الأرض وأكثرهم علمًا وحكمة. وقد ذكر الله عز وجل أمرَ السحر في كتابه في قصّة سليمان، وما كان الشياطين يُعلّمون من ذلك، فقال: <span class=\"ayah\">﴿وَلَٰكِنَّ الشَّيَاطِينَ كَفَرُوا﴾<\/span> <span class=\"ref\">[البقرة: ١٠٢]<\/span>»."]], "tr": [[196.0, "İmam el-Hattâbî —Allah ona rahmet etsin— şöyle demiştir:"], [200.0, "\"Sihir sabittir ve hakikati mevcuttur."], [203.0, "Araplar, Farslar, Hintliler ve Rumların bir kısmı gibi milletlerin çoğu onun isbatında ittifak etmiştir."], [210.5, "Bunlar yeryüzünün orta bölgesinde yaşayanların en faziletlileri, ilim ve hikmet bakımından en ileri olanlarıdır."], [217.5, "Allah Azze ve Celle Kitabı'nda sihir meselesini Süleyman kıssasında ve şeytanların bundan öğrettikleri şeyler bağlamında zikretmiş ve şöyle buyurmuştur:"], [225.5, "<span class=\"ayah\">﴿Fakat şeytanlar kâfir oldular﴾<\/span> [Bakara 102].\""]]}, {"reader": false, "ar": [[230.3, "وممّا يدلّ على حقيقته أيضًا قولُ الله عز وجل:"], [239.0, "<span class=\"ayah\">﴿فَيَتَعَلَّمُونَ مِنْهُمَا مَا يُفَرِّقُونَ بِهِ بَيْنَ الْمَرْءِ وَزَوْجِهِ﴾<\/span> <span class=\"ref\">[البقرة: ١٠٢]<\/span>."], [243.0, "فهذا دليلٌ على أنّ له حقيقة،"], [246.2, "وأنّ الرجل يكره امرأتَه بلا سببيّةٍ ظاهرة،"], [250.0, "أو أنّ الزوجة تكره زوجَها بلا سببيّةٍ ظاهرة،"], [254.8, "ويستمرّ عليهما تأثيرُ السحر حتى يتفرّقا بالطلاق، حتى يتفرّقا بالطلاق."]], "tr": [[230.3, "Onun hakikatine delalet eden şeylerden biri de Allah Azze ve Celle'nin şu sözüdür:"], [239.5, "<span class=\"ayah\">﴿Onlardan, kişi ile eşinin arasını ayıracakları şeyi öğreniyorlardı﴾<\/span> [Bakara 102]."], [243.0, "Bu, onun bir hakikati olduğuna delildir;"], [245.7, "adam görünür bir sebep olmaksızın hanımından hoşlanmaz olur veya kadın görünür bir sebep olmaksızın kocasından hoşlanmaz olur."], [253.0, "Sihrin etkisi ikisinin üzerinde devam eder, ta ki boşanmayla ayrılıncaya kadar;"], [258.4, "ta ki boşanmayla ayrılıncaya kadar."]]}, {"reader": false, "ar": [[261.0, "وكذلك ورد عن النبيّ صلى الله عليه وسلم أنه سُحِر،"], [266.8, "فكان يُخيَّل إليه أنه يأتي الشيءَ ولا يأتيه،"], [270.0, "وأنه يأتي المرأةَ وهو في الحقيقة لم يأتِها."], [274.0, "وقد اعتلّ جسدُه صلى الله عليه وسلم حتى ضرّه ذلك جدًّا،"], [282.0, "حتى فرّج الله عز وجل عنه."], [283.5, "ـ وعليكم السلام ورحمة الله وبركاته ـ."], [284.0, "وقد ثبت عن الصحابة رضي الله تعالى عنهم أخبارٌ كثيرةٌ في إثبات حقيقة السحر،"], [293.0, "ولا يُنكرها لكثرتها إلا من أنكر العِيانَ وجحد الضروريّات،"], [298.0, "كما قاله أهلُ العلم رحمهم الله تعالى."]], "tr": [[261.0, "Aynı şekilde Peygamber sallallâhu aleyhi ve sellem'den kendisine sihir yapıldığı rivayet edilmiştir:"], [266.8, "Bir şeyi yapmadığı hâlde yaptığı kendisine hayal ettiriliyordu;"], [269.6, "hakikatte hanımının yanına gitmediği hâlde gittiğini sanıyordu."], [272.5, "Bedeni sallallâhu aleyhi ve sellem rahatsızlandı, bu ona çok zarar verdi;"], [278.1, "ta ki Allah Azze ve Celle onu ferahlatıncaya kadar."], [283.0, "—Ve aleykümüsselâm ve rahmetullâhi ve berekâtüh.— Sahâbe'den —Allah onlardan razı olsun— sihrin hakikatini isbat eden pek çok haber sabit olmuştur."], [291.0, "Bunları, çokluklarından dolayı, ancak gözle görüleni inkâr eden ve zarurî bilgileri reddeden kimse inkâr eder;"], [298.0, "ilim ehlinin —Allah onlara rahmet etsin— dediği gibi."]]}]}, {"ts": "05:03", "title": "1. Külliye (devam): Fakihlerin sihirbazlar hakkındaki hükümleri, İbn Kudâme ve Nevevî", "paras": [{"reader": false, "ar": [[303.0, "يقول الإمامُ الخطّابيّ رحمه الله:"], [305.5, "«ولذلك» ـ أي: ولأنّ السحر له حقيقة ـ قال:"], [309.4, "«فرّع الفقهاءُ في كتبهم من الأحكام في السحرة، وما يلزمهم من العقوبات فيما يأتونه من أفعالهم، كما فعلوه في سائر الجنايات التي يقترفها الجُناةُ من أهل العبث والفساد. ولا يبلغ ما لا أصلَ له ولا حقيقةَ هذا المبلغَ من الشهرة والاستفاضة. فنفيُ السحر جهلٌ، والاشتغالُ بالردّ على من نفاه لغوٌ»."], [333.2, "انتهى كلامه. يعني: بمعنى أنه صار من الأمور المعلومة من الدين بالضرورة،"], [342.0, "ولا يُنكرها إلا جاهلٌ أو معاندٌ مكابر."]], "tr": [[303.0, "İmam el-Hattâbî —Allah ona rahmet etsin— şöyle der:"], [306.6, "\"Bu sebeple\" —yani sihrin bir hakikati olduğu için— dedi ki:"], [311.2, "\"Fakihler kitaplarında sihirbazlar hakkındaki hükümleri ve yaptıkları fiillerden dolayı onlara gereken cezaları, abes ve fesat ehlinden olan suçluların işlediği diğer cinayetlerde yaptıkları gibi tefrî etmişlerdir (ayrıntılı hükümlere bağlamışlardır)."], [322.8, "Aslı ve hakikati olmayan bir şey bu derece şöhrete ve yaygınlığa ulaşmaz."], [327.0, "Sihri nefyetmek cehalettir; onu nefyedene reddiye ile uğraşmak da boş iştir.\" Sözü bitti."], [336.6, "Yani bu, dinden zarurî olarak bilinen işlerden olmuştur;"], [340.8, "onu ancak cahil veya inatçı, büyüklenen biri inkâr eder."]]}, {"reader": false, "ar": [[346.0, "وقال الإمامُ ابنُ قُدامة رحمه الله تعالى في تعريف السحر:"], [351.1, "«إنه عُقَدٌ ورُقًى وكلامٌ يُتكلَّم به، أو يكتبه، أو يعمل شيئًا في بدن المسحور أو قلبه أو عقله من غير مباشرةٍ له. وله حقيقة؛ فمنه ما يقتل، وما يُمرض، ويأخذ الرجلَ عن امرأته فيمنعه وطأها، ومنه ما يُفرّق بين المرء وزوجه، وما يُبغّض أحدَهما إلى الآخر، أو يُحبّب بين اثنين»."], [379.9, "انتهى كلامه. وعلى ذلك ـ كما ذكرتُ ـ إجماعُ أهل العلم رحمهم الله تعالى."]], "tr": [[346.0, "İmam İbn Kudâme —Allah ona rahmet etsin— sihrin tarifinde şöyle demiştir:"], [350.4, "\"O, düğümler, rukyeler (efsunlar) ve konuşulan ya da yazılan sözlerdir;"], [355.9, "veya (sihirbaz) doğrudan temas etmeksizin sihirlenen kişinin bedeninde, kalbinde veya aklında bir şey yapar."], [361.7, "Onun bir hakikati vardır: Ondan öldüren, hasta eden ve adamı hanımından alıkoyup onunla cinsî münasebetten men eden vardır;"], [371.0, "ondan kişi ile eşinin arasını ayıran, birini diğerine sevimsiz gösteren veya iki kişi arasında sevgi meydana getiren vardır.\" Sözü bitti."], [380.6, "Zikrettiğim gibi ilim ehlinin —Allah onlara rahmet etsin— icmâı da bu yöndedir."]]}, {"reader": false, "ar": [[385.0, "وفي الحديث يقول النبيّ صلى الله عليه وسلم:"], [390.4, "«إنّ التمائمَ والرُّقى والتِّوَلةَ شرك» <span class=\"note\">(Ebû Dâvûd, İbn Mâce, Ahmed)<\/span>."], [393.9, "والتِّوَلة: هي شيءٌ يصنعه الساحر يُحبّب الزوجَ إلى زوجته والزوجةَ إلى زوجها."], [402.0, "وقد حكى الإمامُ ابنُ حجرٍ العسقلانيّ في «فتح الباري» إجماعَ أهل السنّة على إثبات حقيقته أيضًا."], [411.0, "وقال الإمامُ النوويّ رحمه الله تعالى:"], [413.4, "«والصحيحُ أنّ له حقيقة، وبه قطع الجمهور، وعليه عامّةُ العلماء، ويدلّ عليه الكتابُ والسنّةُ الصحيحةُ المشهورة». انتهى كلامه."]], "tr": [[385.0, "Hadiste Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [389.1, "\"Muhakkak ki temîmeler (muskalar), (şirkî) rukyeler ve tivele şirktir.\" Tivele, sihirbazın kocayı karısına ve karıyı kocasına sevdirmek için yaptığı bir şeydir."], [400.7, "İmam İbn Hacer el-Askalânî de \"Fethu'l-Bârî\"de Ehl-i Sünnet'in onun hakikatini isbat etme üzerindeki icmâını hikâye etmiştir."], [408.8, "İmam en-Nevevî —Allah ona rahmet etsin— şöyle demiştir:"], [411.8, "\"Sahih olan, onun bir hakikati olduğudur."], [413.8, "Cumhur bunu kesin olarak söylemiştir, âlimlerin geneli bu görüştedir."], [418.1, "Kitap ve meşhur sahih sünnet de buna delalet eder.\" Sözü bitti."]]}, {"reader": false, "ar": [[424.0, "قلتُ: وهذا لا يمنع أنّ من أنواعه ما هو تخييلٌ وتلبيسٌ ومخادعةٌ وخفّةُ يد،"], [430.0, "لكنّ إثبات هذا لا يستلزم أن يكون كلُّ السحر كذلك،"], [436.0, "وإنما له حقيقةٌ يُحسّها الإنسانُ من نفسه،"], [440.3, "ويُحسّها من حوله: في كراهية ما كان لا يكرهه،"], [445.0, "أو في طلاقٍ ليس له سبب،"], [447.0, "أو في مرضٍ ليس له سبب،"], [449.0, "ونحو ذلك من الآثار التي يفعلها الساحر. والله أعلم."]], "tr": [[424.0, "Derim ki: Bu, onun türlerinden bir kısmının hayal ettirme, göz boyama, aldatma ve el çabukluğu olmasına engel değildir."], [431.2, "Fakat bunu isbat etmek, sihrin tamamının böyle olmasını gerektirmez."], [436.0, "Bilakis onun, insanın kendinde ve çevresindekilerin onda hissettiği bir hakikati vardır:"], [442.5, "Daha önce hoşlanmadığı bir şey değilken ondan hoşlanmaz olmak, sebebi olmayan bir boşanma, sebebi olmayan bir hastalık ve sihirbazın yaptığı buna benzer etkiler gibi. Allah en iyisini bilir."]]}]}, {"ts": "07:34", "title": "2. Külliye: Cinlerden kehânete dayalı şeytanî bir yardım isteyen herkes kâfirdir", "paras": [{"reader": false, "ar": [[454.0, "ومن الكلّيّات أيضًا: <b>كلُّ من استعان بالجنّ استعانةً كهنوتيّةً شيطانيّةً فكافر.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[454.0, "Külliyelerden biri de şudur: 2."], [456.0, "külliye: Cinlerden kehânete dayalı şeytanî bir yardım isteyen herkes kâfirdir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[476.0, "أقول وبالله التوفيق: وذلك لأنّ أهل السنّة والجماعة قسّموا استعانةَ الإنس بالجنّ إلى ثلاثة أقسام:"], [485.0, "إلى استعانةٍ كهنوتيّةٍ شيطانيّة،"], [487.7, "وإلى استعمالٍ مَلَكيٍّ سليمانيّ،"], [490.5, "وإلى استعمالٍ رحمانيٍّ محمّديّ."], [498.0, "وهذه الكلّيّة إنما تخصّ النوعَ الأوّل،"], [501.6, "وهي في حقّ من يستعمل الجنَّ استعمالًا كهنوتيًّا شيطانيًّا."], [507.3, "وحيثما قلنا: «استعمالًا كهنوتيًّا شيطانيًّا» فإننا نعني به استعمالَهم في الكهانة،"], [513.4, "وفي استكشاف ما وراء الغيب،"], [516.0, "وفي الضرر، وفي السحر،"], [518.2, "وفي العِرافة، وفي الشعوذة،"], [520.4, "وفي إيذاء الناس، وفي عبادتهم من دون الله عز وجل،"], [525.8, "والتقرّب لهم بأنواع العبادات."]], "tr": [[476.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi şudur:"], [479.6, "Ehl-i Sünnet ve'l-Cemaat insanların cinlerden yardım istemesini üç kısma ayırmıştır:"], [485.7, "Kehânete dayalı şeytanî yardım isteme, Süleyman'a has melikâne (hükümdarca) kullanma ve Muhammed'e has rahmânî kullanma."], [499.8, "Bu külliye sadece birinci türe hastır;"], [503.4, "cinleri kehânete dayalı şeytanî bir şekilde kullanan kimse hakkındadır."], [508.6, "\"Kehânete dayalı şeytanî kullanma\" dediğimiz her yerde, onları kehânette, gaybın ötesindekini keşfetmede, zarar vermede, sihirde, arraflıkta (falcılıkta), şa'beze (hokkabazlıkta), insanlara eziyet etmede, Allah Azze ve Celle'yi bırakıp onlara ibadet etmede ve çeşitli ibadetlerle onlara yaklaşmada kullanmayı kastederiz."]]}, {"reader": false, "ar": [[528.0, "فمتى ما كان استعمالُ الإنسيّ للجنّيّ نابعًا من هذا النوع،"], [534.0, "فلا جرمَ أنه استعمالٌ يُوجب الكفرَ لصاحبه والمروقَ من الإسلام."], [540.0, "وعليه قولُ الله عز وجل:"], [542.7, "<span class=\"ayah\">﴿وَأَنَّهُ كَانَ رِجَالٌ مِّنَ الْإِنسِ يَعُوذُونَ﴾<\/span> ـ أي:"], [546.4, "يصرفون الاستعاذةَ في الأمر الذي لا يقدر عليه إلا الله ـ بمن يعوذون؟"], [551.5, "<span class=\"ayah\">﴿بِرِجَالٍ مِّنَ الْجِنِّ فَزَادُوهُمْ رَهَقًا﴾<\/span> <span class=\"ref\">[الجن: ٦]<\/span>."]], "tr": [[528.0, "İnsanın cini kullanması bu türden kaynaklandığında, şüphesiz bu, sahibi için küfrü ve İslâm'dan çıkmayı gerektiren bir kullanmadır."], [537.0, "Allah Azze ve Celle'nin şu sözü de bunu ifade eder:"], [542.2, "<span class=\"ayah\">﴿Doğrusu insanlardan bazı kimseler sığınırlardı﴾<\/span> —yani ancak Allah'ın gücü yeten bir işte sığınmayı (Allah'tan başkasına) yöneltirlerdi— kime sığınırlardı?"], [549.3, "<span class=\"ayah\">﴿cinlerden bazı kimselere sığınırlardı da onların azgınlığını artırırlardı﴾<\/span> [Cin 6]."]]}, {"reader": false, "ar": [[556.0, "وعليه أيضًا قولُ الله عز وجل:"], [558.7, "<span class=\"ayah\">﴿وَيَوْمَ يَحْشُرُهُمْ جَمِيعًا يَا مَعْشَرَ الْجِنِّ قَدِ اسْتَكْثَرْتُم مِّنَ الْإِنسِ وَقَالَ أَوْلِيَاؤُهُم مِّنَ الْإِنسِ رَبَّنَا اسْتَمْتَعَ بَعْضُنَا بِبَعْضٍ وَبَلَغْنَا أَجَلَنَا الَّذِي أَجَّلْتَ لَنَا قَالَ النَّارُ مَثْوَاكُمْ خَالِدِينَ فِيهَا إِلَّا مَا شَاءَ اللَّهُ إِنَّ رَبَّكَ حَكِيمٌ عَلِيمٌ﴾<\/span> <span class=\"ref\">[الأنعام: ١٢٨]<\/span>."], [579.0, "وحقيقةُ هذا الاستمتاع هو هذا الاستمتاعُ الكهنوتيّ الشيطانيّ الذي يُوجب لصاحبه الخروجَ من الملّة."]], "tr": [[556.0, "Allah Azze ve Celle'nin şu sözü de bunu ifade eder:"], [559.1, "<span class=\"ayah\">﴿Allah onların hepsini bir araya toplayacağı gün: \"Ey cin topluluğu! Siz insanların birçoğunu (saptırıp kendinize) uydurdunuz\" der. İnsanlardan onların dostları da: \"Rabbimiz! Birbirimizden faydalandık ve bize tayin ettiğin vadeye ulaştık\" derler. Allah da: \"Allah'ın dilediği hariç, içinde ebedî kalmak üzere duracağınız yer ateştir\" der. Şüphesiz Rabbin hüküm ve hikmet sahibidir, hakkıyla bilendir﴾<\/span> [En'âm 128]."], [581.8, "Bu faydalanmanın hakikati, sahibi için dinden çıkmayı gerektiren bu kehânete dayalı şeytanî faydalanmadır."]]}, {"reader": false, "ar": [[587.0, "فالعلاقةُ التي تقوم بين هؤلاء وبين الشياطين أساسُها الكفر،"], [591.6, "وأساسُها الشركُ والإلحاد. ومضمونُ هذه العلاقة يعتمد على إبرام عقدٍ بين الطرفين كما هو معلوم،"], [599.0, "ويقوم هذا العقدُ أساسًا على قيام الإنسيّ ببعض الأمور الشركيّة أو الكفريّة،"], [606.0, "سواءٌ كانت تلك الأفعالُ سرّيّةً أو جهريّة،"], [609.5, "مقابلَ خدماتٍ يقدّمها الشيطانُ له."], [612.0, "وعلى قدر كفره ووثنيّته وشركه على قدر تلك الخدمات التي تُقدَّم له."]], "tr": [[587.0, "Bunlarla şeytanlar arasında kurulan ilişkinin temeli küfürdür;"], [590.0, "temeli şirk ve ilhaddır. Bilindiği üzere bu ilişkinin muhtevası, iki taraf arasında bir akit yapılmasına dayanır."], [598.6, "Bu akit esas olarak insanın, gizli veya açık, şirk ya da küfür içeren bazı işleri yapmasına, buna karşılık şeytanın ona birtakım hizmetler sunmasına dayanır."], [611.5, "Küfrü, putperestliği ve şirki ne kadarsa ona sunulan hizmetler de o kadardır."]]}]}, {"ts": "10:18", "title": "2. Külliye (devam): Sihirbazların şeytanı razı etmek için yaptıkları küfürler", "paras": [{"reader": false, "ar": [[618.0, "فمن السحرة من يرتدي المصحفَ في قدميه <span class=\"q\">؟ 10:18<\/span> والعياذُ بالله،"], [624.0, "أو يدخل به الخلاء،"], [626.0, "أو يرمي به في دورات المياه."], [629.0, "ومنهم من يكتب آياتٍ من القرآن بالقذارة كدم الحيض أو منيّ الرجال،"], [634.0, "ومنهم من يكتبها بغير ذلك من النجاسات كالبول وغيره والعياذُ بالله."], [639.0, "ومنهم من يكتب آياتٍ من القرآن على أسفل قدميه أو نعليه ويصير يطأ بها،"], [645.0, "ولا يحضر عنده الشيطانُ أو يخدمه إلا إذا فعل ذلك."], [650.0, "ومنهم من يكتب الفاتحةَ معكوسة،"], [654.0, "ومنهم من يصلّي بدون وضوء،"], [656.0, "ومنهم من يظلّ جُنُبًا طيلةَ حياته."]], "tr": [[618.0, "Sihirbazlardan Mushaf'ı ayaklarına giyen <span class=\"q\">؟<\/span> —Allah'a sığınırız—, onunla helâya giren veya onu tuvaletlere atan vardır."], [627.5, "Onlardan Kur'an ayetlerini hayız kanı veya erkek menisi gibi pisliklerle yazan vardır;"], [633.2, "onlardan onları idrar ve benzeri başka necasetlerle yazan vardır —Allah'a sığınırız—."], [638.5, "Onlardan Kur'an ayetlerini ayaklarının altına veya ayakkabılarına yazıp onları çiğneyen vardır;"], [643.7, "bunu yapmadıkça şeytan yanına gelmez veya ona hizmet etmez."], [648.5, "Onlardan Fâtiha'yı tersten yazan vardır;"], [651.6, "onlardan abdestsiz namaz kılan vardır;"], [655.2, "onlardan ömrü boyunca cünüp olarak kalan vardır."]]}, {"reader": false, "ar": [[660.0, "ومنهم من يذبح للشيطان فلا يذكر اسمَ الله عز وجل عند الذبح،"], [665.0, "ويرمي الذبيحةَ في مكانٍ يُحدّده له الشيطان."], [670.0, "ومنهم من يخاطب الكواكبَ بأسماء الله عز وجل ويسجد لها من دون الله تبارك وتعالى."], [677.0, "ومنهم من يأتي أمَّه ـ والعياذُ بالله ـ أو ابنتَه إرضاءً للشيطان."], [682.0, "ومنهم من يذبح الأطفالَ الصغار،"], [685.3, "سواءٌ أطفالَه أو أطفالًا يختطفهم،"], [688.7, "يُقدّمهم قرابينَ للشيطان حتى يخدمه."], [692.0, "ومنهم من يكتب طلسمًا بألفاظٍ غير عربيّةٍ تحمل معانيَ كفريّة."]], "tr": [[660.0, "Onlardan şeytan için kurban kesip keserken Allah Azze ve Celle'nin ismini anmayan ve kurbanı şeytanın kendisine belirlediği bir yere atan vardır."], [668.6, "Onlardan yıldızlara Allah Azze ve Celle'nin isimleriyle hitap eden ve Allah Tebâreke ve Teâlâ'yı bırakıp onlara secde eden vardır."], [676.5, "Onlardan şeytanı razı etmek için annesiyle —Allah'a sığınırız— veya kızıyla münasebette bulunan vardır."], [682.0, "Onlardan küçük çocukları —ister kendi çocukları ister kaçırdığı çocuklar olsun— boğazlayıp kendisine hizmet etsin diye şeytana kurban olarak sunan vardır."], [692.7, "Onlardan Arapça olmayan, küfrî manalar taşıyan kelimelerle tılsım yazan vardır."]]}, {"reader": false, "ar": [[699.0, "ومن هنا يتبيّن لنا أنّ استعمالهم إنما هو استعمالٌ كهنوتيٌّ شيطانيّ،"], [705.0, "لا يمكن أن يقوم بين الشيطان وبين الإنس إلا إذا قدّم له ما يُرضيه من صور الكفر والشرك؛"], [717.0, "لأنّ الجنّ أبدًا لا تخدم الساحرَ إلا بمقابلٍ من توحيده وإيمانه وإيذاء الناس."], [723.0, "وكلّما كان الساحرُ أشدَّ كفرًا كان الشيطانُ أكثرَ طاعةً له وأسرعَ في تنفيذ أوامره."], [731.0, "وإذا قصّر الساحرُ في شيءٍ من تنفيذ أوامر الشيطان فإنها ترجع عليه وتقتله،"], [738.0, "ترجع عليه وتقتله، أو تقتل زوجتَه،"], [741.8, "أو أحدًا من أهل بيته."]], "tr": [[699.0, "Buradan bize açıkça anlaşılır ki onların (cinleri) kullanması, ancak kehânete dayalı şeytanî bir kullanmadır."], [705.7, "Bu, şeytanla insan arasında, (insan) ona küfür ve şirk suretlerinden onu razı edecek şeyi sunmadıkça kurulamaz."], [714.8, "Çünkü cinler, sihirbaza ancak tevhidinden, imanından ve insanlara eziyet etmekten bir karşılık mukabilinde hizmet eder."], [721.6, "Sihirbaz küfürde ne kadar ileri olursa şeytan ona o kadar itaatkâr ve emirlerini yerine getirmede o kadar hızlı olur."], [731.0, "Sihirbaz şeytanın emirlerini yerine getirmede bir kusur işlerse, (şeytanlar) ona geri dönüp onu öldürür;"], [737.5, "ona geri dönüp onu öldürür, ya da karısını veya ev halkından birini öldürür."]]}, {"reader": false, "ar": [[745.0, "فمتى ما امتنع الإنسيُّ بعد هذا العقد الذي أبرمه فيما بينه وبين الشياطين،"], [752.0, "فإنّ الشياطين ترجع عليه وتؤذيه."], [757.0, "وهذا الذي يجعلنا نكتشف أنّ كثيرًا من السحرة يموتون هكذا فجأةً،"], [763.0, "أو يموتون في دورات المياه؛"], [765.0, "فإنما قتلتهم الشياطينُ التي سخّروها في إيذاء الناس لمّا عصَوا أمرَهم."], [773.0, "فالساحرُ والشيطانُ قرينان التقيا على الكفر والشرك،"], [778.0, "نعوذ بالله منهم. فإذًا:"], [780.6, "كلُّ من استعمل الشياطين بهذا النوع من الاستعمال فإنه لا يكون إلا موصوفًا بالكفر والشرك والوثنيّة. والله أعلم."]], "tr": [[745.0, "İnsan, kendisiyle şeytanlar arasında yaptığı bu akitten sonra (onların isteğini yapmaktan) kaçındığında şeytanlar ona geri dönüp eziyet eder."], [757.0, "Sihirbazların birçoğunun böyle aniden öldüğünü veya tuvaletlerde öldüğünü fark etmemizin sebebi budur:"], [763.8, "Onları, insanlara eziyet etmekte kullandıkları şeytanlar, emirlerine karşı geldiklerinde öldürmüştür."], [769.8, "Sihirbaz ile şeytan, küfür ve şirk üzerinde buluşmuş iki arkadaştır;"], [778.0, "onlardan Allah'a sığınırız. Öyleyse şeytanları bu tür bir kullanmayla kullanan herkes, ancak küfür, şirk ve putperestlikle nitelenir. Allah en iyisini bilir."]]}]}, {"ts": "13:11", "title": "3. Külliye: Tedavide cin kullandığı sabit olan herkesin yanında tedavi olmak haramdır", "paras": [{"reader": false, "ar": [[791.0, "ومن الكلّيّات أيضًا: <b>كلُّ من ثبت عنه استعمالُ الجنّ في التداوي فيحرم التداوي عنده.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[791.0, "Külliyelerden biri de şudur: 3."], [794.7, "külliye: Tedavide cin kullandığı sabit olan herkesin yanında tedavi olmak haramdır. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[815.0, "أقول: وهذا يدخل تحت قاعدة سدّ الذرائع،"], [819.1, "بغضّ النظر عن الجنّيّ الذي يساعده،"], [822.6, "أكان مسلمًا أو كافرًا،"], [825.0, "وسواءٌ طلب المعالِجُ ممّن يعالجه شيئًا أو لم يطلب منه شيئًا."], [832.0, "فبمجرّد انتشار الخبر بأنّ فلانًا يستعين بالشياطين في أمر التداوي والعلاج،"], [838.0, "فإنه لا يجوز لأهل التوحيد والإيمان أن يتداوَوا عندهم."], [844.0, "وذلك لأنّ الرسول صلى الله عليه وسلم لم يأتِ عنه أنه استعان بالجنّ في مثل ذلك أبدًا،"], [852.0, "ولا عن الصحابة، ولا عن التابعين."], [854.0, "ولو كان في هذا خيرٌ لما ادّخره الله عز وجل عنهم."]], "tr": [[815.0, "Derim ki: Bu, zerîaları kapatma kaidesinin altına girer;"], [819.1, "ona yardım eden cin ister Müslüman ister kâfir olsun, tedavi eden kişi tedavi ettiği kimseden bir şey istesin veya hiçbir şey istemesin, fark etmez."], [833.1, "Falan kişinin tedavi ve şifa işinde şeytanlardan yardım aldığı haberi yayıldığı anda, tevhid ve iman ehlinin onların yanında tedavi olması caiz değildir."], [845.9, "Çünkü Resûl sallallâhu aleyhi ve sellem'den böyle bir konuda cinlerden yardım istediği asla nakledilmemiştir;"], [852.0, "ne sahâbeden ne de tâbiînden."], [853.7, "Eğer bunda bir hayır olsaydı, Allah Azze ve Celle onu onlardan esirgemezdi."]]}, {"reader": false, "ar": [[861.0, "ثمّ إنّ الاستعانة بهم لا بدّ وأن تجعل قلبَ المعالِج متعلّقًا بهم،"], [867.7, "منصرفةً شيئًا من شُعَب توكّله عليهم ولا بدّ،"], [872.0, "وهذا وسيلةٌ من وسائل الشرك."], [875.6, "ولأنهم عالَمٌ مجهولٌ وغيبيّ،"], [880.0, "فلا يدري الإنسانُ عمّن يخاطبه أو يُعينه:"], [883.5, "أهو مسلمٌ أو كافر؟"], [885.2, "أهو صادقٌ أو كاذب؟"], [887.2, "فجهالةُ حالهم تجعلنا نبتعد عنهم."], [891.0, "ولأنّ الأصلَ انفصالُ عالَمنا عن عالَمهم،"], [894.4, "فلا يجوز أن يلتقي العالَمان في شيءٍ أبدًا؛"], [899.0, "فهم في عالَمهم وأحكامه،"], [901.5, "ونحن في عالَمنا وأحكامه."]], "tr": [[861.0, "Sonra onlardan yardım istemek, kaçınılmaz olarak tedavi edenin kalbini onlara bağlar ve tevekkülünün şubelerinden bir kısmını kaçınılmaz olarak onlara yöneltir;"], [870.2, "bu da şirkin vesilelerinden bir vesiledir."], [872.0, "Ayrıca onlar meçhul ve gaybî bir âlemdir;"], [876.3, "insan kendisine hitap eden veya yardım eden kimseyi bilemez:"], [882.2, "Müslüman mı, kâfir mi? Doğru sözlü mü, yalancı mı?"], [885.7, "Hâllerinin bilinmezliği bizi onlardan uzaklaşmaya sevk eder."], [888.6, "Ayrıca asıl olan, bizim âlemimizin onların âleminden ayrı olmasıdır;"], [893.9, "iki âlemin hiçbir şeyde buluşması asla caiz değildir."], [897.3, "Onlar kendi âlemlerinde ve onun hükümlerindedir, biz de kendi âlemimizde ve onun hükümlerindeyiz."]]}, {"reader": false, "ar": [[904.0, "فمتى ما حصل التواصلُ بين الإنس والجنّ في أيّ نقطةٍ من النقاط،"], [908.0, "فلا بدّ أن يحصل فيها من الفساد بقدرها."], [911.0, "فسدًّا لذريعة فساد الاعتقاد وتعلّق قلب المعالِج عليهم،"], [918.0, "لا يجوز ذلك أبدًا،"], [919.0, "في صَدَرٍ ولا وِرْد،"], [920.0, "حتى وإن كان الجنّيُّ هو الذي يعرض هذه الخدمات على المعالِج،"], [926.0, "فلا ينبغي للمعالِج أن يفتح له ثغرةً في قبول شيءٍ من ذلك أبدًا."]], "tr": [[904.0, "İnsanlarla cinler arasında herhangi bir noktada irtibat meydana geldiğinde, o noktada mutlaka onun ölçüsünde bir fesat meydana gelir."], [909.5, "İtikadın bozulması ve tedavi edenin kalbinin onlara bağlanması zerîasını kapatmak için bu, ne başta ne sonda (hiçbir şekilde) asla caiz değildir."], [920.0, "Bu hizmetleri tedavi edene sunan cinin kendisi olsa bile, tedavi edenin ondan herhangi bir şeyi kabul etmek için ona bir gedik açması asla uygun değildir."]]}, {"reader": false, "ar": [[935.0, "ومن المعلوم أنّ الأصل في عالمهم الكذب،"], [937.0, "كما قال النبيّ صلى الله عليه وسلم في حديث أبي هريرة:"], [942.1, "«صدقك وهو كذوب» <span class=\"note\">(Buhârî)<\/span>. ولأنّ الاستعانة بهم قد تكون ذريعةً للشرك فوجب سدُّها؛"], [947.0, "فإنهم قد يدخلون على القارئ بأنهم مسلمون صادقون مخلصون في معونته،"], [952.0, "حتى إذا تعلّق قلبُه بهم وتشرّبت نفسُه حبَّهم،"], [956.4, "فإنهم ينقلبون عليه مباشرةً،"], [958.5, "فلا يحضرون في مجلس علاجه إلا بعد أن يقدّم لهم،"], [964.0, "أو يقرأ التعويذات التي فيها شركٌ بالله عز وجل حتى يرجعوا."], [970.0, "وقد سمعنا من القصص في ذلك ما يؤكّد لنا أهمّيّةَ هذه الكلّيّة."]], "tr": [[935.0, "Bilindiği üzere onların âleminde asıl olan yalandır;"], [936.7, "nitekim Peygamber sallallâhu aleyhi ve sellem Ebû Hüreyre hadisinde şöyle buyurmuştur:"], [940.7, "\"O çok yalancı olduğu hâlde sana doğru söyledi.\" Ayrıca onlardan yardım istemek şirke zerîa olabileceği için onu kapatmak vâcip olmuştur."], [948.4, "Zira onlar rukye yapan kişiye, Müslüman, doğru sözlü ve ona yardımda ihlaslı olduklarını söyleyerek yaklaşabilirler."], [954.7, "Nihayet kalbi onlara bağlanıp nefsi onların sevgisini içine çekince, hemen ona karşı dönerler;"], [960.7, "o kendilerine (bir şey) takdim etmedikçe veya içinde Allah Azze ve Celle'ye şirk bulunan muskaları okumadıkça tedavi meclisine gelmezler ki geri dönsünler."], [971.5, "Bu konuda bu külliyenin önemini bize teyit eden kıssalar işittik."]]}, {"reader": false, "ar": [[976.0, "فهم عالَمٌ مبنيٌّ على الكذب،"], [978.9, "وعندهم من المكر، ومن الزخارف،"], [981.9, "ومن المخادعة، ومن الغدر،"], [984.2, "ومن التغرير بالإنسان، ما يجعل الإنسانَ فريسةً سهلةً لهم إذا فتح أبوابَ قلبه لما يعرضونه له من المعونة."], [995.0, "ولذلك يقول الله عز وجل:"], [997.7, "<span class=\"ayah\">﴿إِنَّ الشَّيْطَانَ لَكُمْ عَدُوٌّ فَاتَّخِذُوهُ عَدُوًّا﴾<\/span> <span class=\"ref\">[فاطر: ٦]<\/span>."], [1001.0, "وحيث إنّ الإنسان لا يستطيع أن يفرّق بين الصالح منهم والطالح،"], [1006.0, "والصادق منهم والكاذب، والمخلص منهم والغادر،"], [1010.0, "فيلزمه البعدُ عنهم ما استطاع إلى ذلك سبيلًا."]], "tr": [[976.0, "Onlar yalan üzerine kurulu bir âlemdir."], [978.9, "Onlarda öyle hile, süslü aldatmaca, kandırma, ihanet ve insanı aldatma vardır ki, insan onların sunduğu yardıma kalbinin kapılarını açtığında onlar için kolay bir av hâline gelir."], [994.4, "Bu yüzden Allah Azze ve Celle şöyle buyurur:"], [998.3, "<span class=\"ayah\">﴿Şüphesiz şeytan sizin düşmanınızdır; siz de onu düşman edinin﴾<\/span> [Fâtır 6]."], [1003.7, "İnsan onların sâlihini kötüsünden, doğru sözlüsünü yalancısından, ihlaslısını hainden ayırt edemediğine göre, gücü yettiği kadar onlardan uzak durması gerekir."]]}, {"reader": false, "ar": [[1014.0, "قال ابنُ مُفلحٍ رحمه الله تعالى في «الآداب»:"], [1017.0, "قال أحمدُ رحمه الله في رواية البِرْزاطيّ ـ هكذا يُنطَق ـ في الرجل يزعم أنه يعالج المجنونَ من الصرع بالرُّقى والعزائم،"], [1032.0, "ويزعم أنه يخاطب الجنَّ ويكلّمهم،"], [1034.5, "ومنهم من يخدمه، قال:"], [1036.4, "«ما أحبّ لأحدٍ أن يفعله، تركُه أحبُّ إليّ»."], [1040.0, "ومن المعلوم لطافةُ الإمام أحمد رحمه الله في بعض الأمور،"], [1044.0, "مع أنه يرى تحريمَها، من باب الورع."]], "tr": [[1014.0, "İbn Müflih —Allah ona rahmet etsin— \"el-Âdâb\"da şöyle demiştir:"], [1016.6, "Ahmed —Allah ona rahmet etsin— el-Birzâtî'nin —böyle telaffuz edilir— rivayetinde, deliyi sar'adan rukyeler ve azimetlerle (okumalarla) tedavi ettiğini, cinlere hitap edip onlarla konuştuğunu ve onlardan kendisine hizmet edenler olduğunu iddia eden adam hakkında şöyle dedi:"], [1035.5, "\"Kimsenin bunu yapmasını sevmem; onu terk etmek bana daha sevimlidir.\" İmam Ahmed'in —Allah ona rahmet etsin— bazı konulardaki (ifade) inceliği bilinmektedir;"], [1042.8, "o, bunları haram gördüğü hâlde vera' (ihtiyat) gereği (bu şekilde ifade eder)."]]}, {"reader": false, "ar": [[1047.0, "وقال العلّامةُ محمدُ بنُ إبراهيم،"], [1050.0, "مفتي السعوديّة رحمه الله تعالى،"], [1053.0, "في فتاواه، في سؤالٍ عُرض عليه في هذا الشأن،"], [1059.3, "فقال ـ حتى لا أُطيل عليكم ـ:"], [1063.0, "«إنه طلبٌ من الجنّ» ـ يعني أنّ هذا القارئ الذي وُصف حالُه في السؤال أنه يطلب من الجنّ أن يُعينوه ـ فقال:"], [1072.3, "«إنه طلبٌ من الجنّ، فيدخل في سؤال الغائبين، فيدخل في سؤال الغائبين الذي يُشبه سؤالَ الأموات، وفيه رائحةٌ من روائح الشرك» ـ وفيه رائحةٌ،"], [1086.7, "يعني: ذريعةٌ ـ من روائح الشرك."]], "tr": [[1047.0, "Suudi Arabistan müftüsü Allâme Muhammed b."], [1050.0, "İbrâhîm —Allah ona rahmet etsin— fetvalarında, bu konuda kendisine arz edilen bir soru hakkında —sözü size uzatmayayım— şöyle dedi:"], [1063.0, "\"Bu, cinden talepte bulunmaktır.\" —Yani soruda hâli anlatılan bu rukye yapan kişi, cinlerden kendisine yardım etmelerini istemektedir.— Dedi ki:"], [1071.5, "\"Bu, cinden talepte bulunmaktır; dolayısıyla gâiblerden (hazır olmayanlardan) istemeye girer, ölülerden istemeye benzeyen gâiblerden istemeye girer."], [1080.5, "Bunda şirk kokularından bir koku vardır.\" —Bunda bir koku, yani bir zerîa vardır— şirk kokularından."]]}, {"reader": false, "ar": [[1091.0, "وقال الشيخُ ابنُ بازٍ رحمه الله تعالى لمّا سُئل عن هذه المسألة،"], [1095.0, "قال: «لا ينبغي للمريض استخدامُ الجنّ في العلاج، ولا يسألهم، بل يسأل الأطبّاءَ المعروفين. وأمّا اللجوء إلى الجنّ فلا؛ لأنه وسيلةٌ إلى عبادتهم وتصديقهم؛ لأنّ في الجنّ من هو كافر، ومن هو مسلم، ومن هو مبتدع، ولا تُعرف أحوالُهم، فلا ينبغي الاعتمادُ عليهم، ولا يُسألون ولو تمثّلوا لك، بل عليك أن تسأل أهلَ العلم والطبّ من الإنس. وقد ذمّ الله عز وجل المشركين بقوله: <span class=\"ayah\">﴿وَأَنَّهُ كَانَ رِجَالٌ مِّنَ الْإِنسِ يَعُوذُونَ بِرِجَالٍ مِّنَ الْجِنِّ فَزَادُوهُمْ رَهَقًا﴾<\/span> <span class=\"ref\">[الجن: ٦]<\/span>»."], [1132.0, "ولأنه وسيلةٌ للاعتقاد فيهم والشرك،"], [1135.0, "وهو وسيلةٌ لطلب النفع منهم والاستعانة بهم،"], [1138.0, "وذلك كلُّه من الشرك."]], "tr": [[1091.0, "Şeyh İbn Bâz —Allah ona rahmet etsin— bu mesele kendisine sorulduğunda şöyle dedi:"], [1094.6, "\"Hastanın tedavide cinleri kullanması uygun değildir;"], [1096.5, "onlardan (bir şey) istememeli, bilakis bilinen doktorlara sormalıdır."], [1099.0, "Cinlere başvurmaya gelince, hayır! Çünkü bu, onlara ibadet etmeye ve onları tasdik etmeye vesiledir."], [1105.8, "Zira cinler içinde kâfir olan da var, Müslüman olan da var, bid'atçi olan da var;"], [1112.2, "hâlleri bilinmez. Bu yüzden onlara güvenmek uygun değildir;"], [1115.5, "sana görünseler bile onlardan (bir şey) istenmez."], [1118.3, "Bilakis insanlardan ilim ve tıp ehline sormalısın."], [1121.0, "Allah Azze ve Celle müşrikleri şu sözüyle kınamıştır:"], [1125.7, "<span class=\"ayah\">﴿Doğrusu insanlardan bazı kimseler cinlerden bazı kimselere sığınırlardı da onların azgınlığını artırırlardı﴾<\/span> [Cin 6].\" Ayrıca bu, onlar hakkında (bâtıl) inanca ve şirke vesiledir;"], [1135.0, "onlardan fayda istemeye ve onlardan yardım dilemeye vesiledir; bunların hepsi de şirktendir."]]}, {"reader": false, "ar": [[1140.0, "وأزيد الأمرَ إيضاحًا فأقول:"], [1143.0, "نحن نمنع ذلك لعدّة عِلَل،"], [1145.0, "ذكرتُ طرفًا منها فيما مضى،"], [1148.0, "وأزيدها جُمَلًا. منها: أنه ثبت عن النبيّ صلى الله عليه وسلم أنه رقى ورُقي،"], [1159.0, "وأمر أصحابَه بالرقية، فاجتمع بذلك فعلُه وأمرُه وإقرارُه صلى الله عليه وسلم."], [1167.0, "فلو كانت الاستعانةُ بالجنّ المسلمين في العلاج ـ كما يدّعي البعض ـ فضيلةً،"], [1173.0, "فوالله لن يدّخرها الله عز وجل ورسولُه صلى الله عليه وسلم عن الأمّة أبدًا."]], "tr": [[1140.0, "Meseleyi daha da açıklayarak derim ki:"], [1143.0, "Biz bunu birkaç illetten dolayı men ediyoruz;"], [1145.6, "bunların bir kısmını daha önce zikrettim, birkaçını daha ekliyorum."], [1154.4, "Bunlardan biri: Peygamber sallallâhu aleyhi ve sellem'in rukye yaptığı, kendisine rukye yapıldığı ve ashâbına rukyeyi emrettiği sabittir;"], [1160.9, "böylece bu konuda onun sallallâhu aleyhi ve sellem fiili, emri ve takriri bir araya gelmiştir."], [1168.1, "Eğer —bazılarının iddia ettiği gibi— tedavide Müslüman cinlerden yardım istemek bir fazilet olsaydı, vallahi Allah Azze ve Celle ve Resûlü sallallâhu aleyhi ve sellem onu ümmetten asla esirgemezdi."]]}, {"reader": false, "ar": [[1178.0, "وقد ثبت عن النبيّ صلى الله عليه وسلم أنه سحرته يهود،"], [1183.0, "ولم يستعن النبيُّ صلى الله عليه وسلم بأيّ أحدٍ دون الله عز وجل."], [1190.0, "فلم يثبت عنه صلى الله عليه وسلم،"], [1193.2, "ولا عن أصحابه رضي الله عنهم ـ وهم خيرُ الخلق وأفضلُهم بعد النبيّ صلى الله عليه وسلم ـ أنهم استعملوا أحدًا من الجنّ في شيءٍ من الأدواء أو الأمراض،"], [1206.0, "مع أنّ فيهم من أصابه الصرع،"], [1209.0, "وفيهم من أصابته العين،"], [1211.0, "وفيهم من تناوشته الأمراضُ من كلّ جانب."], [1214.0, "فما نقلت لنا كتبُ السنّة عن راقٍ منهم أبدًا أنه استعان بالجنّ."]], "tr": [[1178.0, "Peygamber sallallâhu aleyhi ve sellem'e Yahudilerin sihir yaptığı sabittir;"], [1182.1, "Peygamber sallallâhu aleyhi ve sellem Allah Azze ve Celle'den başka hiç kimseden yardım istemedi."], [1189.5, "Ondan sallallâhu aleyhi ve sellem ve —Peygamber sallallâhu aleyhi ve sellem'den sonra yaratılmışların en hayırlısı ve en faziletlisi olan— ashâbından —Allah onlardan razı olsun— hastalıklardan herhangi birinde cinlerden birini kullandıkları sabit olmamıştır."], [1204.9, "Hâlbuki aralarında sar'aya yakalanan da vardı, nazar değen de vardı, hastalıkların her yandan kuşattığı kimse de vardı."], [1213.6, "Sünnet kitapları bize onlardan rukye yapan hiçbir kimsenin cinlerden yardım istediğini nakletmemiştir."]]}, {"reader": false, "ar": [[1220.0, "وممّا يدلّ على ذلك أيضًا:"], [1223.4, "أنّ المتقرّر في القواعد أنّ المجهول لا يُستعان به،"], [1232.0, "والمتقرّر في القواعد أنّ الغائب لا يُستعان به،"], [1236.0, "من باب سدّ ذريعة تعلّق قلب الراقي بهذا الجنّيّ."], [1242.0, "ومنها أيضًا: أنّ الجنّ أصلُ خلقته من النار،"], [1251.0, "والنارُ من خاصّيّتها الإحراقُ والطيشُ والعجلة،"], [1257.0, "فيغلب على طبعه الظلمُ والاعتداءُ وسرعةُ التقلّب والتحوّل من حالٍ إلى حال."]], "tr": [[1220.0, "Buna delalet eden şeylerden biri de şudur:"], [1224.0, "Kaidelerde yerleşik olan, meçhul olandan yardım istenmeyeceğidir;"], [1228.1, "kaidelerde yerleşik olan, gâib olandan (hazır olmayandan) yardım istenmeyeceğidir."], [1235.0, "Bu, rukye yapanın kalbinin bu cine bağlanması zerîasını kapatmak babındandır."], [1240.0, "Bunlardan biri de şudur: Cinin yaratılışının aslı ateştir;"], [1244.9, "ateşin hassası ise yakmak, hafiflik (savrukluk) ve aceleciliktir."], [1253.3, "Bu yüzden onun tabiatına zulüm, saldırganlık, çabuk değişme ve bir hâlden bir hâle dönme galip gelir."]]}, {"reader": false, "ar": [[1264.0, "فقد ينقلب من صديقٍ للقارئ إلى عدوٍّ له؛"], [1268.0, "لأنه ذو عنصرٍ ناريّ،"], [1271.0, "والنارُ سريعةُ التقلّب. فقد ينقلب من كونه صديقًا إلى ألدّ الأعداء،"], [1277.0, "وقد يُذيق صاحبَه سوءَ العذاب؛"], [1280.0, "لأنه أصبح خبيرًا بنقاط ضعفه."], [1282.0, "وبناءً على ما ذكرتُ من العلل تصدق كلّيّتُنا ـ إن شاء الله ـ بأنّ كلَّ من عُرف عنه أنه يستعمل الجنّ في العلاج فإنه لا يجوز التداوي عنده مطلقًا."]], "tr": [[1264.0, "Rukye yapan kişinin dostu iken ona düşman hâline gelebilir;"], [1268.8, "çünkü o ateşî bir unsura sahiptir, ateş de çabuk değişir."], [1275.5, "Dost olmaktan en azılı düşmana dönüşebilir ve arkadaşına azabın en kötüsünü tattırabilir;"], [1282.0, "çünkü onun zayıf noktalarını iyice öğrenmiştir."], [1286.0, "Zikrettiğim illetlere binaen, inşallah, tedavide cin kullandığı bilinen herkesin yanında tedavi olmanın mutlak olarak caiz olmadığı şeklindeki külliyemiz doğrudur."]]}]}, {"ts": "21:38", "title": "4. Külliye: Cinlerin insana girmesini inkâr eden herkes bid'at ehlindendir", "paras": [{"reader": false, "ar": [[1298.0, "ومن الكلّيّات أيضًا: <b>كلُّ من أنكر دخولَ الجنّ في الإنس فمن أهل البدع.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[1298.0, "Külliyelerden biri de şudur: 4."], [1300.7, "külliye: Cinlerin insana girmesini inkâr eden herkes bid'at ehlindendir. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1320.0, "أقول وبالله التوفيق: ولقد أجمع أهلُ السنّة والجماعة قاطبةً على أنّ الجنّيّ قد يدخل في الإنس،"], [1330.0, "وأنّ ذلك ثابتٌ شرعًا،"], [1332.9, "وجائزٌ عقلًا، وواقعٌ حسًّا."], [1339.0, "فصَرْعُ الجنّيّ للإنسيّ أمرٌ ثابتٌ في الشرع والواقع،"], [1344.0, "ولا يمنعه قاطعٌ عقليّ."], [1347.0, "وهذا الأمر لا خلافَ فيه بين أهل السنّة والجماعة،"], [1351.0, "وإنما خالف فيه طوائفُ من أهل البدع كالمعتزلة والجهميّة."]], "tr": [[1320.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat istisnasız olarak cinin insana girebileceğinde ve bunun şer'an sabit, aklen caiz ve hissen vâki olduğunda icmâ etmiştir."], [1333.6, "Cinin insanı çarpması (sar'a) şeriatte ve vâkıada sabit bir iştir;"], [1342.8, "hiçbir kesin aklî delil buna engel değildir."], [1347.0, "Bu meselede Ehl-i Sünnet ve'l-Cemaat arasında ihtilaf yoktur;"], [1350.1, "buna ancak Mu'tezile ve Cehmiyye gibi bid'at ehlinden bazı fırkalar muhalefet etmiştir."]]}, {"reader": false, "ar": [[1357.0, "قال شيخُ الإسلام ابنُ تيميّة رحمه الله تعالى:"], [1360.0, "«وجودُ الجنّ ثابتٌ بالكتاب والسنّة واتّفاق سلف الأمّة، وكذلك دخولُ الجنّيّ في بدن الإنسان ثابتٌ باتّفاق أهل السنّة» ـ أو:"], [1373.8, "«باتّفاق أئمّة السنّة» ـ «وهو أمرٌ مشهودٌ محسوسٌ لمن تدبّره؛ يدخل في المصروع ويتكلّم بكلامٍ لا يعرفه، بل ولا يدري به، بل يُضرب ضربًا لو ضُرب به جملٌ لمات، ولا يُحسّ به المصروع». انتهى كلامه."]], "tr": [[1357.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1359.6, "\"Cinlerin varlığı Kitap, Sünnet ve ümmetin selefinin ittifakıyla sabittir."], [1364.4, "Aynı şekilde cinin insan bedenine girmesi de Ehl-i Sünnet'in ittifakıyla\" —veya:"], [1370.6, "\"Sünnet imamlarının ittifakıyla\"— \"sabittir. Bu, üzerinde düşünen için görülen ve hissedilen bir iştir:"], [1380.5, "(Cin) sar'alıya girer ve (sar'alı) bilmediği bir dille konuşur, hatta bunun farkında bile olmaz."], [1386.8, "Hatta öyle bir dövülür ki, o dayakla bir deve dövülse ölürdü;"], [1392.6, "sar'alı ise bunu hissetmez.\" Sözü bitti."]]}, {"reader": false, "ar": [[1396.0, "وقال في موضعٍ آخر:"], [1398.0, "«وليس في أئمّة المسلمين من يُنكر دخولَ الجنّيّ في بدن المصروع وغيره، ومن أنكر ذلك وادّعى أنّ الشرع يُكذّب ذلك فقد كذب على الشرع، وليس في الأدلّة الشرعيّة ما ينفي ذلك»."], [1412.0, "انتهى كلامه. وحكى الإجماعَ أيضًا ابنُ حزمٍ رحمه الله تعالى،"], [1417.0, "قال: «فصحّ أنّ الشيطان يمسّ الإنسانَ الذي يُسلّطه الله عليه مسًّا، كما جاء في القرآن، يُثير به من طبائعه السوداءَ والأبخرةَ المتصاعدةَ إلى الدماغ، كما يُخبر به عن نفسه كلُّ مصروعٍ بلا خلافٍ منهم، فيُحدث الله عز وجل له الصرعَ والتخبّطَ حينئذٍ كما نشاهده» ـ يعني:"], [1442.3, "دليلَ الواقع ـ «كما نشاهده، وهذا نصُّ القرآن وما تُوجبه المشاهدة». انتهى كلامه."]], "tr": [[1396.0, "Başka bir yerde de şöyle demiştir:"], [1398.0, "\"Müslümanların imamları arasında cinin sar'alının ve başkasının bedenine girmesini inkâr eden kimse yoktur."], [1403.5, "Kim bunu inkâr eder ve şeriatin bunu yalanladığını iddia ederse şeriat adına yalan söylemiş olur;"], [1409.0, "şer'î delillerde bunu nefyeden bir şey yoktur.\" Sözü bitti."], [1412.0, "İbn Hazm —Allah ona rahmet etsin— de icmâı hikâye ederek şöyle demiştir:"], [1417.0, "\"Böylece sahih olmuştur ki şeytan, Allah'ın kendisine musallat ettiği insana, Kur'an'da geldiği gibi bir dokunuşla dokunur;"], [1425.1, "bununla onun tabiatlarından sevdâyı (kara safrayı) ve beyne yükselen buharları harekete geçirir."], [1430.5, "Bunu her sar'alı, aralarında ihtilaf olmaksızın kendisi hakkında haber verir."], [1435.0, "O zaman Allah Azze ve Celle onda sar'ayı ve çırpınmayı meydana getirir;"], [1440.8, "bizim gördüğümüz gibi\" —yani vâkıa delili— \"bizim gördüğümüz gibi."], [1444.6, "Bu, Kur'an'ın nassı ve müşahedenin gerektirdiği şeydir.\" Sözü bitti."]]}, {"reader": false, "ar": [[1451.0, "وقال ابنُ حجرٍ الهيتميّ رحمه الله تعالى:"], [1454.0, "«فدخولُه» ـ أي الجنّيّ ـ «في بدن الإنسان هو مذهبُ أهل السنّة والجماعة»."], [1462.0, "انتهى كلامه. وقال الشيخُ ابنُ بازٍ رحمه الله تعالى:"], [1465.0, "«وقد دلّ كتابُ الله عز وجل، وسنّةُ رسوله صلى الله عليه وسلم، وإجماعُ الأمّة على جواز دخول الجنّيّ في الإنسيّ وصرعه إيّاه»."], [1477.0, "وقال عبدُ الله بنُ الإمام أحمد رحمه الله تعالى:"], [1481.0, "«قلتُ لأبي: إنّ أقوامًا يزعمون أنّ الجنّيّ لا يدخل في بدن الإنسيّ، فقال: يا بنيّ، يكذبون، هذا هو يتكلّم على لسانه»."]], "tr": [[1451.0, "İbn Hacer el-Heytemî —Allah ona rahmet etsin— şöyle demiştir:"], [1454.5, "\"Onun\" —yani cinin— \"insan bedenine girmesi Ehl-i Sünnet ve'l-Cemaat'in mezhebidir.\" Sözü bitti."], [1462.5, "Şeyh İbn Bâz —Allah ona rahmet etsin— şöyle demiştir:"], [1465.3, "\"Allah Azze ve Celle'nin Kitabı, Resûlü sallallâhu aleyhi ve sellem'in sünneti ve ümmetin icmâı, cinin insana girmesinin ve onu çarpmasının caiz olduğuna delalet etmiştir.\" İmam Ahmed'in oğlu Abdullah —Allah ona rahmet etsin— şöyle demiştir:"], [1482.3, "\"Babama: Bazı kimseler cinin insan bedenine girmediğini iddia ediyorlar, dedim."], [1488.3, "Dedi ki: Yavrum, yalan söylüyorlar;"], [1491.8, "işte o, onun diliyle konuşuyor.\""]]}]}, {"ts": "24:56", "title": "4. Külliye (devam): Kitap'tan ve Sünnet'ten deliller", "paras": [{"reader": false, "ar": [[1496.0, "فإن قلت: وما الدليل على ذلك غيرُ الإجماع؟"], [1500.0, "فأقول: قد دلّ على ذلك كتابُ الله عز وجل،"], [1503.0, "والسنّةُ الصحيحةُ عن النبيّ صلى الله عليه وسلم."], [1507.0, "فمن ذلك قولُه عز وجل في الآية التي يستدلّ بها أهلُ السنّة دائمًا وأبدًا إذا تكلّموا عن هذه المسألة:"], [1516.0, "<span class=\"ayah\">﴿الَّذِينَ يَأْكُلُونَ الرِّبَا لَا يَقُومُونَ إِلَّا كَمَا يَقُومُ الَّذِي يَتَخَبَّطُهُ الشَّيْطَانُ مِنَ الْمَسِّ﴾<\/span> <span class=\"ref\">[البقرة: ٢٧٥]<\/span>."], [1523.0, "وهذا مثالٌ ضربه الله عز وجل في القرآن في شأن آكل الربا إذا قام يوم القيامة،"], [1529.0, "فضرب له مثلًا حسّيًّا،"], [1531.0, "وأمثلةُ القرآن لا تكون مخالفةً للحسّ والواقع أبدًا."]], "tr": [[1496.0, "Eğer \"İcmâ dışında buna delil nedir?\" dersen, derim ki:"], [1500.3, "Buna Allah Azze ve Celle'nin Kitabı ve Peygamber sallallâhu aleyhi ve sellem'den gelen sahih sünnet delalet etmiştir."], [1507.5, "Bunlardan biri, Ehl-i Sünnet'in bu meseleden bahsettiklerinde her zaman delil getirdiği ayetteki şu sözüdür:"], [1514.6, "<span class=\"ayah\">﴿Faiz yiyenler, şeytanın çarpıp çarpılmış hâle getirdiği kimsenin kalktığı gibi kalkarlar﴾<\/span> [Bakara 275]."], [1521.4, "Bu, Allah Azze ve Celle'nin Kur'an'da faiz yiyenin kıyamet günü kalkışı hakkında verdiği bir misaldir."], [1527.9, "Ona hissî bir misal vermiştir;"], [1530.0, "Kur'an'ın misalleri ise asla hisse ve vâkıaya aykırı olmaz."]]}, {"reader": false, "ar": [[1535.0, "أي: لا يقومون من قبورهم يوم القيامة إلا كما يقوم المصروعُ حالَ صرعه وتخبّط الشيطان له،"], [1546.0, "وذلك أنه يقوم قيامًا منكرًا."], [1548.1, "انتهى كلامهم. ومن الأدلّة أيضًا قولُ الله عز وجل:"], [1552.5, "<span class=\"ayah\">﴿وَاذْكُرْ عَبْدَنَا أَيُّوبَ إِذْ نَادَىٰ رَبَّهُ أَنِّي مَسَّنِيَ الشَّيْطَانُ بِنُصْبٍ وَعَذَابٍ﴾<\/span> <span class=\"ref\">[ص: ٤١]<\/span>،"], [1561.0, "أي: بأمرٍ مُشِقٍّ مُتعِبٍ مُعذِّب."], [1564.4, "وكان قد سُلّط على جسده فنفخ فيه حتى تقرّح،"], [1571.0, "ثمّ تقيّح بعد ذلك،"], [1572.7, "واشتدّ به الأمرُ حتى أذن الله عز وجل بشفائه وعافاه،"], [1577.0, "بما قصّه الله عز وجل علينا في كتابه."], [1580.0, "فنسب هذا المسَّ إلى الشيطان."]], "tr": [[1535.0, "Yani kıyamet günü kabirlerinden ancak sar'alının sar'a hâlinde ve şeytanın onu çarptığı sırada kalktığı gibi kalkarlar;"], [1543.6, "zira o, garip (çirkin) bir şekilde kalkar."], [1546.9, "Sözleri bitti. Delillerden biri de Allah Azze ve Celle'nin şu sözüdür:"], [1551.0, "<span class=\"ayah\">﴿Kulumuz Eyyûb'u da an. Hani o Rabbine: \"Şeytan bana yorgunluk ve azap dokundurdu\" diye seslenmişti﴾<\/span> [Sâd 41];"], [1561.0, "yani meşakkatli, yorucu ve azap veren bir şeyle."], [1565.7, "(Şeytan) onun bedenine musallat edilmişti;"], [1568.4, "ona üfledi, nihayet (bedeni) yara oldu, sonra irinlendi ve durumu ağırlaştı;"], [1573.6, "ta ki Allah Azze ve Celle'nin Kitabı'nda bize anlattığı şekilde onun şifasına izin verip ona âfiyet verdiği vakte kadar."], [1580.0, "(Eyyûb) bu dokunuşu şeytana nispet etti."]]}, {"reader": false, "ar": [[1584.0, "ومن الأدلّة أيضًا ما في الصحيحين من حديث أنسٍ رضي الله عنه قال:"], [1590.5, "قال النبيّ صلى الله عليه وسلم:"], [1593.3, "«إنّ الشيطان يجري من ابن آدم مجرى الدم»."], [1597.0, "وقد استُدلّ بهذا الحديث على قدرة الجنّ على سلوك بدن الإنسان بما أقدره الله عز وجل من ذلك."], [1610.0, "وقد أجمعت كلمةُ أهل العلم على الاستدلال بهذا الحديث على هذه المسألة:"], [1619.0, "فمنهم الإمامُ القرطبيّ في تفسيره،"], [1621.8, "وابنُ تيميّة في فتاويه،"], [1624.0, "وابنُ حجرٍ الهيتميّ وردّ به على المعتزلة منكري ذلك،"], [1628.0, "وكذلك البِقاعيّ في تفسيره،"], [1630.0, "وابنُ حجرٍ العسقلانيّ في «بذل الماعون»،"], [1633.0, "وكذلك العلّامةُ موفّقُ الدين ابنُ عبد اللطيف البغداديّ،"], [1637.0, "وكذلك القاسميّ في تفسيره."]], "tr": [[1584.0, "Delillerden biri de Sahîhayn'de Enes —Allah ondan razı olsun— hadisinde geçendir."], [1589.5, "Dedi ki: Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1594.2, "\"Şüphesiz şeytan, Âdemoğlunda kanın dolaştığı yerde dolaşır.\" Bu hadisle, Allah Azze ve Celle'nin cinlere verdiği güç ölçüsünde onların insan bedenine girebilme kudretine delil getirilmiştir."], [1611.4, "İlim ehlinin sözü bu meselede bu hadisle delil getirme üzerinde birleşmiştir."], [1620.1, "Bunlardan bazıları: İmam el-Kurtubî tefsirinde, İbn Teymiyye fetvalarında, İbn Hacer el-Heytemî —bunu inkâr eden Mu'tezile'ye bununla reddiye yapmıştır—, yine el-Bikâî tefsirinde, İbn Hacer el-Askalânî \"Bezlü'l-Mâûn\"da, yine Allâme Muvaffakuddîn İbn Abdillatîf el-Bağdâdî ve yine el-Kâsımî tefsirinde."]]}, {"reader": false, "ar": [[1639.0, "وحكى النوويّ أنّ بعض علماء الشافعيّة استدلّوا بهذا الحديث أيضًا على أنّ الله جعل للشيطان قوّةً وقدرةً على الجري في باطن الإنسان مجاريَ دمه."], [1650.9, "ولذلك أمرنا النبيُّ صلى الله عليه وسلم في تسكين الشهوة التي يُثيرها الشيطانُ بالصيام؛"], [1658.0, "لتضييق مجاريه، فلا ينفذ إلى العقل والقلب كما ينفذ إذا اتّسعت مجاريه بالأكل والشرب."]], "tr": [[1639.0, "en-Nevevî, Şâfiî âlimlerinden bazılarının bu hadisle, Allah'ın şeytana insanın içinde, kanının dolaştığı yollarda dolaşmak için bir güç ve kudret verdiğine delil getirdiklerini de hikâye etmiştir."], [1648.6, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem şeytanın harekete geçirdiği şehveti yatıştırmak için bize orucu emretmiştir;"], [1656.4, "onun dolaşım yollarını daraltmak için."], [1660.0, "Böylece yeme ve içme ile yolları genişlediğinde akla ve kalbe nüfuz ettiği gibi nüfuz edemez."]]}, {"reader": false, "ar": [[1668.0, "ومنها كذلك ما في الصحيحين من حديث عطاء بن أبي رباح،"], [1674.0, "قال: قال لي ابنُ عبّاسٍ رضي الله عنهما:"], [1677.0, "«ألا أُريك امرأةً من أهل الجنّة؟ قلتُ: بلى. قال: هذه المرأةُ السوداء، أتت النبيَّ صلى الله عليه وسلم فقالت: يا رسول الله، إنّي أُصرَع، وإنّي أتكشّف، فادعُ الله تعالى لي. فقال: إن شئتِ دعوتُ الله لكِ أن يُعافيَكِ، وإن شئتِ صبرتِ ولكِ الجنّة. فقالت: أصبر. ثمّ قالت: فإنّي أتكشّف، فادعُ الله ألّا أتكشّف. فدعا لها» ألّا تتكشّف."], [1702.0, "وهذا دليلٌ على أنّ ما أصابها كان من ملامسة الشيطان لها وتلبّسه بها."]], "tr": [[1668.0, "Bunlardan biri de Sahîhayn'de Atâ b."], [1670.4, "Ebî Rebâh hadisinde geçendir. Dedi ki:"], [1673.0, "İbn Abbâs —Allah ikisinden de razı olsun— bana şöyle dedi:"], [1676.2, "\"Sana cennet ehlinden bir kadın göstereyim mi?"], [1678.3, "Evet, dedim. Dedi ki: İşte bu siyah kadın."], [1680.3, "Peygamber sallallâhu aleyhi ve sellem'e gelip şöyle dedi:"], [1683.5, "Ey Allah'ın Resûlü! Ben sar'aya tutuluyorum ve (o sırada) açılıyorum;"], [1687.2, "benim için Allah Teâlâ'ya dua et."], [1688.8, "(Peygamber) buyurdu ki: İstersen sana âfiyet vermesi için Allah'a dua ederim;"], [1692.0, "istersen sabredersin, sana da cennet vardır."], [1695.0, "Kadın: Sabrederim, dedi. Sonra: Ama ben açılıyorum, açılmamam için Allah'a dua et, dedi."], [1700.0, "O da ona dua etti\" açılmaması için."], [1703.1, "Bu, ona isabet eden şeyin şeytanın ona dokunmasından ve ona girmesinden olduğuna delildir."]]}, {"reader": false, "ar": [[1710.0, "ومنها أيضًا ما في صحيح الإمام مسلمٍ من حديث أبي هريرة رضي الله عنه قال:"], [1715.4, "قال النبيّ صلى الله عليه وسلم:"], [1718.0, "«التثاؤبُ من الشيطان، فإذا تثاءب أحدُكم فليكظم ما استطاع، فإنّ الشيطان يدخل»."], [1726.0, "يدخل في ماذا؟ أي:"], [1727.6, "يدخل في بدن الإنسان."], [1730.0, "قال الإمامُ الحافظ رحمه الله تعالى في «الفتح»:"], [1733.0, "«فيُحتمل أن يُراد الدخولُ حقيقةً، فيُحتمل أن يُراد الدخولُ حقيقةً، وهو وإن كان يجري من الإنسان مجرى الدم، لكنّه لا يتمكّن منه ما دام ذاكرًا لله تعالى، والمتثائبُ في تلك الحالة غيرُ ذاكرٍ، فيتمكّن الشيطانُ من الدخول فيه حقيقةً». انتهى كلامه."]], "tr": [[1710.0, "Bunlardan biri de İmam Müslim'in Sahîh'inde Ebû Hüreyre —Allah ondan razı olsun— hadisinde geçendir."], [1714.6, "Dedi ki: Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1718.7, "\"Esneme şeytandandır. Biriniz esnediğinde gücü yettiği kadar onu tutsun;"], [1723.0, "çünkü şeytan girer.\" Neye girer?"], [1726.7, "Yani insanın bedenine girer. İmam el-Hâfız (İbn Hacer) —Allah ona rahmet etsin— \"el-Feth\"te şöyle demiştir:"], [1733.6, "\"Girmenin hakiki olarak kastedilmesi muhtemeldir;"], [1736.6, "girmenin hakiki olarak kastedilmesi muhtemeldir."], [1739.4, "O, insanda kanın dolaştığı yerde dolaşsa bile, kişi Allah Teâlâ'yı zikrettiği sürece ona hâkim olamaz."], [1745.1, "Esneyen ise o hâlde zikretmiyordur;"], [1747.5, "bu yüzden şeytan hakiki olarak ona girmeye imkân bulur.\" Sözü bitti."]]}, {"reader": false, "ar": [[1754.0, "ومنها أيضًا حديثُ عثمان بن أبي العاص ـ الذي تكلّمنا عنه آنفًا ـ قال:"], [1762.4, "«لمّا استعملني رسولُ الله صلى الله عليه وسلم على الطائف جعل يَعرِض لي شيءٌ في صلاتي حتى ما أدري ما أُصلّي، فلمّا رأيتُ ذلك رحلتُ إلى رسول الله صلى الله عليه وسلم، فقال: ابنُ أبي العاص؟ قلتُ: نعم يا رسول الله. قال: ما جاء بك؟ قلتُ: يا رسول الله، عرض لي شيءٌ في صلواتي حتى ما أدري ما أُصلّي. قال: ذاك الشيطان، ادْنُه. فدنوتُ منه، فجلستُ على صدور قدميّ أمامَه، قال: فضرب صدري بيده، وتفل في فمي، وقال: اخرُجْ عدوَّ الله. ففعل ذلك ثلاثَ مرّات، ثمّ قال لي: الْحَقْ بعملك. فقال عثمان: فلعمري ما أحسبه خالطني بعد ذلك»."]], "tr": [[1754.0, "Bunlardan biri de —az önce kendisinden bahsettiğimiz— Osman b."], [1758.8, "Ebi'l-Âs hadisidir. Dedi ki: \"Resûlullah sallallâhu aleyhi ve sellem beni Tâif'e vali tayin edince namazımda bana bir şey ârız olmaya başladı;"], [1767.9, "öyle ki ne kıldığımı bilmez oldum."], [1771.1, "Bunu görünce Resûlullah sallallâhu aleyhi ve sellem'in yanına yolculuk ettim."], [1775.7, "Dedi ki: İbn Ebi'l-Âs mı?"], [1777.5, "Evet ey Allah'ın Resûlü, dedim."], [1779.3, "Seni buraya getiren nedir? dedi."], [1780.7, "Ey Allah'ın Resûlü! Namazlarımda bana bir şey ârız oldu;"], [1783.5, "öyle ki ne kıldığımı bilmez oldum, dedim."], [1786.5, "Dedi ki: O, şeytandır; yaklaş."], [1788.5, "Ona yaklaştım ve önünde ayaklarımın parmak uçları üzerine oturdum."], [1794.2, "(Osman) dedi ki: Eliyle göğsüme vurdu, ağzıma tükürdü ve:"], [1799.7, "Çık ey Allah'ın düşmanı! dedi."], [1802.8, "Bunu üç kez yaptı, sonra bana:"], [1806.4, "İşinin başına dön, dedi. Osman dedi ki:"], [1810.5, "Ömrüme yemin olsun ki, ondan sonra onun bana karıştığını sanmıyorum.\""]]}]}, {"ts": "30:17", "title": "4. Külliye (devam): Ya'lâ b. Mürre, Hamne ve tâun hadisleri", "paras": [{"reader": false, "ar": [[1817.0, "رواه ابنُ ماجه، وقال الإمامُ البُوصيريّ:"], [1821.3, "إسنادُه صحيحٌ ورجالُه ثقات."], [1823.0, "ورواه الإمامُ الحاكمُ في مستدركه وقال:"], [1826.0, "هذا حديثٌ صحيحُ الإسناد."], [1828.0, "وصحّحه الألبانيّ، رحم الله الجميعَ رحمةً واسعة."], [1832.0, "وفي الحديث عن يعلى بن مُرّة الثقفيّ عن أبيه:"], [1837.0, "«أنّ امرأةً جاءت إلى النبيّ صلى الله عليه وسلم معها صبيٌّ لها به لَمَمٌ» ـ أي:"], [1846.2, "مسٌّ من الجنّ ـ «فقال النبيّ صلى الله عليه وسلم: اخرُجْ عدوَّ الله، أنا رسولُ الله. قال: فبرِئ»."], [1856.0, "أخرجه الإمامُ أحمد، وصحّحه الإمامُ الألبانيّ رحمه الله."]], "tr": [[1817.0, "Bunu İbn Mâce rivayet etmiştir."], [1820.0, "İmam el-Bûsîrî: \"İsnadı sahihtir, ravileri sikadır\" demiştir."], [1822.6, "İmam el-Hâkim de onu Müstedrek'inde rivayet etmiş ve \"Bu, isnadı sahih bir hadistir\" demiştir."], [1828.0, "el-Elbânî de onu sahih kabul etmiştir."], [1831.0, "Allah hepsine geniş rahmetiyle rahmet etsin."], [1833.1, "Ya'lâ b. Mürre es-Sekafî'den, o da babasından gelen hadiste şöyle geçer:"], [1838.2, "\"Bir kadın, yanında lemem (yani cin çarpması) bulunan bir çocuğuyla Peygamber sallallâhu aleyhi ve sellem'e geldi."], [1845.6, "Peygamber sallallâhu aleyhi ve sellem:"], [1848.0, "Çık ey Allah'ın düşmanı, ben Allah'ın Resûlüyüm!"], [1851.3, "dedi. (Ravi) dedi ki: Çocuk iyileşti.\" Bunu İmam Ahmed rivayet etmiş, İmam el-Elbânî —Allah ona rahmet etsin— sahih kabul etmiştir."]]}, {"reader": false, "ar": [[1860.0, "ومنها ما أخرجه الترمذيّ في جامعه من حديث حَمْنة رضي الله عنها قالت:"], [1866.5, "«كنتُ أُستحاض حيضةً كثيرةً شديدةً تمنعني من الصوم والصلاة، فأتيتُ النبيَّ صلى الله عليه وسلم فقال: إنما هي ركضةٌ من الشيطان»،"], [1877.9, "الحديثَ بتمامه. فهذا دليلٌ على أنّ كثيرًا من عوارض النزيف التي تُصيب النساء إنما هي ركضةٌ من الشيطان ومسٌّ منه."], [1889.0, "وهذا الحديث رواه الترمذيّ في جامعه وقال:"], [1892.1, "حسنٌ صحيح، وأخرجه أبو داود والنسائيّ في سننهما،"], [1896.3, "وأحمدُ في مسنده، وصحّحه الإمامُ الألبانيّ رحمه الله تعالى."]], "tr": [[1860.0, "Bunlardan biri de et-Tirmizî'nin Câmi'inde Hamne —Allah ondan razı olsun— hadisinden rivayet ettiğidir."], [1865.5, "Dedi ki: \"Beni oruçtan ve namazdan alıkoyan, çok ve şiddetli bir istihâza kanı görüyordum."], [1871.6, "Peygamber sallallâhu aleyhi ve sellem'e geldim;"], [1875.0, "buyurdu ki: Bu ancak şeytandan bir tepmedir.\" Hadisin tamamı."], [1879.5, "Bu, kadınlara isabet eden kanama ârızalarından birçoğunun ancak şeytandan bir tepme ve onun bir dokunuşu olduğuna delildir."], [1887.9, "Bu hadisi et-Tirmizî Câmi'inde rivayet etmiş ve \"hasen sahih\" demiştir."], [1892.1, "Ebû Dâvûd ve en-Nesâî Sünen'lerinde, Ahmed de Müsned'inde rivayet etmiş;"], [1896.9, "İmam el-Elbânî —Allah ona rahmet etsin— sahih kabul etmiştir."]]}, {"reader": false, "ar": [[1901.0, "ومن الأدلّة أيضًا قولُه صلى الله عليه وسلم:"], [1905.0, "«فناءُ أمّتي بالطعن والطاعون، فناءُ أمّتي بالطعن والطاعون. قيل: يا رسول الله، هذا الطعنُ قد عرفناه، فما الطاعون؟ قال: وَخْزُ أعدائكم من الجنّ، وخزُ أعدائكم من الجنّ»."], [1922.0, "قال الإمامُ المنذريّ: رواه أحمدُ بأسانيدَ أحدُها صحيح،"], [1928.0, "وأبو يعلى والبزّار والطبرانيّ،"], [1930.7, "وصحّحه الألبانيّ رحمه الله تعالى."]], "tr": [[1901.0, "Delillerden biri de onun sallallâhu aleyhi ve sellem şu sözüdür:"], [1904.5, "\"Ümmetimin yok oluşu ta'n (mızrak darbesi) ve tâun iledir;"], [1909.8, "ümmetimin yok oluşu ta'n ve tâun iledir."], [1913.0, "Denildi ki: Ey Allah'ın Resûlü!"], [1915.0, "Ta'nı biliyoruz, tâun nedir? Buyurdu ki:"], [1917.0, "Cinlerden düşmanlarınızın dürtmesidir; cinlerden düşmanlarınızın dürtmesidir.\" İmam el-Münzirî şöyle demiştir:"], [1921.5, "Bunu Ahmed, biri sahih olan isnadlarla rivayet etmiştir;"], [1924.9, "Ebû Ya'lâ, el-Bezzâr ve et-Taberânî de (rivayet etmiştir)."], [1929.3, "el-Elbânî —Allah ona rahmet etsin— de sahih kabul etmiştir."]]}, {"reader": false, "ar": [[1934.0, "فإذا دلّ الإجماعُ والكتابُ والسنّةُ الصحيحةُ على ما دلّت عليه هذه الكلّيّة؛"], [1941.0, "لأنّ المسَّ الشيطانيَّ واقعٌ بهذه الأدلّة،"], [1950.0, "وأنه لا يُنكره إلا جهميٌّ أو معتزليّ."], [1953.0, "بل ودلّ الواقعُ على ذلك أيضًا."], [1957.0, "قال ابنُ تيميّة رحمه الله في بيان هذا الواقع:"], [1960.0, "«وهذا الذي قاله» ـ أي الإمامُ أحمد لمّا قال:"], [1964.0, "«هذا هو يُكلّمنا ونُكلّمه» ـ قال:"], [1966.7, "«وهذا الذي قاله أمرٌ مشهور؛ فإنه يُصرَع الرجلُ فيتكلّم بلسانٍ لا يُعرف معناه، ويُضرب على بدنه ضربًا عظيمًا لو ضُرب به جملٌ لأثّر فيه أثرًا عظيمًا، والمصروعُ مع هذا لا يُحسّ بالضرب ولا بالكلام الذي يقوله»."]], "tr": [[1934.0, "Böylece icmâ, Kitap ve sahih sünnet bu külliyenin delalet ettiği şeye delalet etmiştir:"], [1940.0, "Bu delillerle şeytanî mess (çarpma) vâkidir ve onu ancak bir Cehmî veya Mu'tezilî inkâr eder."], [1952.1, "Hatta vâkıa da buna delalet etmiştir."], [1955.0, "İbn Teymiyye —Allah ona rahmet etsin— bu vâkıayı açıklarken şöyle demiştir:"], [1959.0, "\"Onun söylediği bu şey\" —yani İmam Ahmed'in \"İşte o bizimle konuşuyor, biz de onunla konuşuyoruz\" demesi— dedi ki:"], [1966.0, "\"Onun söylediği bu şey meşhur bir iştir."], [1970.0, "Zira adam sar'aya tutulur da manası bilinmeyen bir dille konuşur;"], [1980.0, "bedenine öyle büyük bir dayak vurulur ki, onunla bir deve dövülse onda büyük bir iz bırakırdı."], [1986.0, "Sar'alı ise bununla birlikte ne dayağı ne de söylediği sözü hisseder.\""]]}, {"reader": false, "ar": [[1992.0, "ـ انتبه ـ «وقد يجرّ المصروعُ غيرَ المصروع، ويجرّ البساطَ الذي يجلس عليه، ويُحوّل الآلات، ويُنقَل من مكانٍ إلى مكان، ويجري به غيرُ ذلك من الأمور، من شاهدها أفادته علمًا ضروريًّا بأنّ الناطقَ على لسان الإنسيّ والمحرِّكَ لهذه الأجسام جنسٌ آخرُ غيرُ الإنسان»."], [2016.0, "انتهى كلامه. قال ابنُ القيّم رحمه الله تعالى:"], [2019.0, "«وشاهدتُ شيخَنا» ـ أي ابنَ تيميّة ـ «يُرسل إلى المصروع من يخاطب الروحَ التي فيه، ويقول: قال لكِ الشيخ: اخرُجي، فإنّ هذا لا يحلّ لكِ، فيُفيق المصروع. وربما خاطبها بنفسه، وربما كانت الروحُ ماردةً فيُخرجها بالضرب، فيُفيق المصروعُ ولا يُحسّ بألم. وقد شاهدنا نحن وغيرُنا منه ذلك مرارًا»."]], "tr": [[1992.0, "—Dikkat et— \"Sar'alı bazen sar'alı olmayanı sürükler, üzerinde oturduğu yaygıyı sürükler, aletlerin yerini değiştirir, bir yerden bir yere taşınır ve onunla başka şeyler de olur."], [2005.5, "Bunları gören kimseye bu, insanın dili üzerinden konuşanın ve bu cisimleri hareket ettirenin insandan başka bir cins olduğuna dair zarurî bir ilim verir.\" Sözü bitti."], [2016.5, "İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [2018.3, "\"Şeyhimizi\" —yani İbn Teymiyye'yi— \"sar'alıya, içindeki ruha hitap edecek birini gönderirken gördüm."], [2024.0, "(Gönderdiği kişi) şöyle derdi: Şeyh sana diyor ki:"], [2026.8, "Çık, çünkü bu sana helal değildir!"], [2028.9, "Sar'alı da ayılırdı. Bazen ona bizzat kendisi hitap ederdi."], [2036.0, "Bazen ruh azılı olurdu; onu dövmek suretiyle çıkarırdı, sar'alı ayılır ve hiçbir acı hissetmezdi."], [2043.6, "Biz ve başkaları ondan bunu defalarca gördük.\""]]}, {"reader": false, "ar": [[2047.0, "إلى أن قال رحمه الله:"], [2049.0, "«وبالجملة، فهذا النوعُ من الصرع وعلاجُه لا يُنكره إلا قليلُ الحظّ من العلم والعقل والمعرفة. وأكثرُ تسلّط الأرواح الخبيثة على أهلها تكون من جهة قلّة دينهم، وخراب قلوبهم وألسنتهم من حقائق الذكر والتعاويذ والتحصينات النبويّة والإيمانيّة، فتلقى الروحُ الخبيثةُ الرجلَ أعزلَ لا سلاحَ معه، وربما كان عُريانًا» ـ أي:"], [2078.7, "عن الذكر ـ «فيؤثّر فيه هذا»."], [2081.5, "انتهى كلامه رحمه الله تعالى. وبه تنتهي الكلّيّة."]], "tr": [[2047.0, "Sonra —Allah ona rahmet etsin— şöyle demiştir:"], [2049.0, "\"Kısacası, sar'anın bu türünü ve tedavisini ancak ilimden, akıldan ve marifetten nasibi az olan inkâr eder."], [2054.6, "Habis ruhların, musallat oldukları kimselere tasallutunun çoğu, onların dinlerinin azlığından, kalplerinin ve dillerinin zikrin, sığınma dualarının ve nebevî ve imanî korunma dualarının hakikatlerinden harap olmasından kaynaklanır."], [2067.3, "Habis ruh, adamı yanında silahı olmayan silahsız biri olarak bulur;"], [2076.0, "hatta bazen çıplaktır\" —yani zikirden— \"ve bu ona tesir eder.\" Sözü bitti, Allah ona rahmet etsin. Külliye bununla sona eriyor."]]}]}, {"ts": "34:47", "title": "5. Külliye: İnsanlar için akîde ve şeriatten meşru olan her şey, tahsis delili olmadıkça tâbi olarak cinler için de meşrudur", "paras": [{"reader": false, "ar": [[2087.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما كان مشروعًا في حقّ الإنس من العقائد والشرائع فمشروعٌ في حقّ الجنّ تبعًا إلا بدليل الاختصاص.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[2087.0, "Külliyelerden biri de şudur: 5."], [2090.0, "külliye: İnsanlar hakkında akîdeler ve şeriatlerden meşru olan her şey, tahsis (hususiyet) delili olmadıkça tâbi olarak cinler hakkında da meşrudur. (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[2125.0, "أقول وبالله التوفيق: وهذا بإجماع أهل العلم رحمهم الله تعالى،"], [2135.0, "بأنّ الجنّ مكلَّفون ومخاطَبون بالشرع مثلَ الإنس،"], [2140.0, "وقد خُلقوا للغاية نفسها التي خُلق من أجلها الإنس،"], [2147.0, "كما قال الله عز وجل:"], [2149.3, "<span class=\"ayah\">﴿وَمَا خَلَقْتُ الْجِنَّ وَالْإِنسَ إِلَّا لِيَعْبُدُونِ﴾<\/span> <span class=\"ref\">[الذاريات: ٥٦]<\/span>."], [2152.0, "وقد أُرسلت إليهم الرسلُ كما أُرسلت إلى الإنس،"], [2158.0, "كما قال الله عز وجل:"], [2160.2, "<span class=\"ayah\">﴿يَا مَعْشَرَ الْجِنِّ وَالْإِنسِ أَلَمْ يَأْتِكُمْ رُسُلٌ مِّنكُمْ يَقُصُّونَ عَلَيْكُمْ آيَاتِي وَيُنذِرُونَكُمْ لِقَاءَ يَوْمِكُمْ هَٰذَا﴾<\/span> <span class=\"ref\">[الأنعام: ١٣٠]<\/span>."]], "tr": [[2125.0, "Tevfik Allah'tandır, derim ki: Bu, ilim ehlinin —Allah onlara rahmet etsin— icmâıyladır:"], [2131.3, "Cinler de insanlar gibi şeriatle mükellef ve muhataptırlar."], [2139.3, "İnsanların yaratıldığı aynı gaye için yaratılmışlardır;"], [2142.1, "nitekim Allah Azze ve Celle şöyle buyurur:"], [2147.0, "<span class=\"ayah\">﴿Ben cinleri ve insanları ancak bana ibadet etsinler diye yarattım﴾<\/span> [Zâriyât 56]."], [2151.5, "İnsanlara peygamberler gönderildiği gibi onlara da peygamberler gönderilmiştir;"], [2155.6, "nitekim Allah Azze ve Celle şöyle buyurur:"], [2159.3, "<span class=\"ayah\">﴿Ey cin ve insan topluluğu! İçinizden size ayetlerimi anlatan ve bu gününüzle karşılaşacağınızı size haber veren peygamberler gelmedi mi?﴾<\/span> [En'âm 130]."]]}, {"reader": false, "ar": [[2169.0, "وقال الله عز وجل:"], [2170.8, "<span class=\"ayah\">﴿قُلْ أُوحِيَ إِلَيَّ أَنَّهُ اسْتَمَعَ نَفَرٌ مِّنَ الْجِنِّ فَقَالُوا إِنَّا سَمِعْنَا قُرْآنًا عَجَبًا يَهْدِي إِلَى الرُّشْدِ فَآمَنَّا بِهِ وَلَن نُّشْرِكَ بِرَبِّنَا أَحَدًا﴾<\/span> <span class=\"ref\">[الجن: ١–٢]<\/span>،"], [2181.7, "الآياتِ بتمامها. ولقول الله عز وجل حكايةً عن قول الجنّ:"], [2186.0, "<span class=\"ayah\">﴿قَالُوا يَا قَوْمَنَا إِنَّا سَمِعْنَا كِتَابًا أُنزِلَ مِن بَعْدِ مُوسَىٰ مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ يَهْدِي إِلَى الْحَقِّ وَإِلَىٰ طَرِيقٍ مُّسْتَقِيمٍ يَا قَوْمَنَا أَجِيبُوا دَاعِيَ اللَّهِ وَآمِنُوا بِهِ يَغْفِرْ لَكُم مِّن ذُنُوبِكُمْ وَيُجِرْكُم مِّنْ عَذَابٍ أَلِيمٍ وَمَن لَّا يُجِبْ دَاعِيَ اللَّهِ فَلَيْسَ بِمُعْجِزٍ فِي الْأَرْضِ وَلَيْسَ لَهُ مِن دُونِهِ أَوْلِيَاءُ أُولَٰئِكَ فِي ضَلَالٍ مُّبِينٍ﴾<\/span> <span class=\"ref\">[الأحقاف: ٣٠–٣٢]<\/span> <span class=\"note\">(Şeyh «أُنزِلَ» yerine «يُنزَل» diyor)<\/span>."]], "tr": [[2169.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [2170.8, "<span class=\"ayah\">﴿De ki: Bana şöyle vahyolundu: Cinlerden bir topluluk (Kur'an'ı) dinledi de şöyle dediler: Gerçekten biz, doğru yola ileten hayranlık verici bir Kur'an dinledik; biz de ona iman ettik. Artık Rabbimize hiç kimseyi asla ortak koşmayacağız﴾<\/span> [Cin 1–2], ayetlerin tamamı."], [2184.5, "Ve Allah Azze ve Celle'nin cinlerin sözünü hikâye eden şu sözünden dolayı:"], [2188.5, "<span class=\"ayah\">﴿Dediler ki: Ey kavmimiz! Biz, Mûsâ'dan sonra indirilmiş, kendinden öncekileri doğrulayan, hakka ve doğru yola ileten bir kitap dinledik. Ey kavmimiz! Allah'ın davetçisine icabet edin ve ona iman edin ki (Allah) günahlarınızdan bir kısmını bağışlasın ve sizi elem verici bir azaptan korusun. Allah'ın davetçisine icabet etmeyen kimse yeryüzünde (Allah'ı) âciz bırakacak değildir; onun Allah'tan başka dostları da yoktur. İşte onlar apaçık bir sapıklık içindedirler﴾<\/span> [Ahkâf 30–32]."]]}, {"reader": false, "ar": [[2211.0, "وهذه الآياتُ تُفيد أيضًا علمَهم بشريعة نبيّ الله موسى وبالشرائع قبله،"], [2217.0, "كما تؤكّد تكليفَهم بشريعة محمّدٍ صلى الله عليه وسلم."], [2221.0, "وهذه الكلّيّة تؤكّد أنّ ما كان الإنسُ مأمورين به فإنّ الجنّ مأمورون به أصالةً،"], [2230.0, "وأنّ ما كان الإنسُ منهيّين عنه فإنّ الجنّ منهيّون عنه،"], [2236.0, "إلا بدليلٍ يدلّ على خلاف ذلك،"], [2240.0, "وأنّ جميع العقائد التي سيُحاسَب عنها الإنسُ فإنه سيُحاسَب عنها الجنُّ تمامًا."]], "tr": [[2211.0, "Bu ayetler ayrıca onların Allah'ın peygamberi Mûsâ'nın şeriatini ve ondan önceki şeriatleri bildiklerini ifade eder;"], [2218.3, "aynı şekilde Muhammed sallallâhu aleyhi ve sellem'in şeriatiyle mükellef olduklarını da teyit eder."], [2224.9, "Bu külliye şunu teyit eder:"], [2228.1, "İnsanların emrolunduğu şeyle cinler de aslen emrolunmuştur;"], [2232.4, "insanların nehyolunduğu şeyden cinler de nehyolunmuştur;"], [2235.4, "ancak bunun aksine delalet eden bir delil bulunursa müstesna."], [2241.0, "İnsanların hesaba çekileceği bütün akîdelerden cinler de aynen hesaba çekilecektir."]]}, {"reader": false, "ar": [[2246.0, "فكما أنّ الشركَ حرامٌ على الإنس فهو حرامٌ على الجنّ،"], [2250.0, "وكما أنّ البدعةَ حرامٌ على الإنس فهي حرامٌ على الجنّ،"], [2254.0, "وكما أنّ المعاصيَ ـ كبارَها وصغارَها ـ حرامٌ على الإنس فهي حرامٌ على الجنّ،"], [2260.0, "وهكذا في سائر المنهيّات."], [2263.0, "وكما أنّ التوحيدَ واجبٌ على الإنس فهو واجبٌ على الجنّ،"], [2268.0, "وكما أنّ اتّباعَ السنّة واجبٌ على الإنس فكذلك هو واجبٌ على الجنّ،"], [2275.0, "وكما أنّ الطاعةَ واجبةٌ على الإنس فهي واجبةٌ على الجنّ تبعًا."]], "tr": [[2246.0, "Şirk insanlara haram olduğu gibi cinlere de haramdır;"], [2249.6, "bid'at insanlara haram olduğu gibi cinlere de haramdır;"], [2253.6, "büyüğüyle küçüğüyle günahlar insanlara haram olduğu gibi cinlere de haramdır;"], [2259.0, "diğer bütün yasaklar da böyledir."], [2263.0, "Tevhid insanlara vâcip olduğu gibi cinlere de vâciptir;"], [2268.0, "sünnete uymak insanlara vâcip olduğu gibi cinlere de vâciptir;"], [2274.4, "itaat insanlara vâcip olduğu gibi tâbi olarak cinlere de vâciptir."]]}, {"reader": false, "ar": [[2280.0, "فالجنُّ مثلُهم مثلُ الإنس في موقفهم من التكليف والعبادة تمامًا؛"], [2285.0, "فمنهم المؤمنون والطائعون، ومنهم الفاسقون،"], [2288.7, "ومنهم الكافرون، كما حكى الله عز وجل عنهم أنهم قالوا:"], [2296.3, "<span class=\"ayah\">﴿وَأَنَّا مِنَّا الْمُسْلِمُونَ وَمِنَّا الْقَاسِطُونَ فَمَنْ أَسْلَمَ فَأُولَٰئِكَ تَحَرَّوْا رَشَدًا وَأَمَّا الْقَاسِطُونَ فَكَانُوا لِجَهَنَّمَ حَطَبًا﴾<\/span> <span class=\"ref\">[الجن: ١٤–١٥]<\/span>."], [2304.0, "وكما يشهد كفّارُهم على أنفسهم يوم القيامة بالكفر مثلَ الإنس تمامًا،"], [2310.0, "كما في قوله عز وجل:"], [2312.7, "<span class=\"ayah\">﴿وَشَهِدُوا عَلَىٰ أَنفُسِهِمْ أَنَّهُمْ كَانُوا كَافِرِينَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٣٠]<\/span>."]], "tr": [[2280.0, "Cinler, teklife ve ibadete karşı tutumlarında aynen insanlar gibidir."], [2283.0, "Onlardan mü'minler ve itaatkârlar vardır, onlardan fâsıklar vardır, onlardan kâfirler vardır."], [2288.0, "Nitekim Allah Azze ve Celle onların şöyle dediklerini hikâye eder:"], [2294.2, "<span class=\"ayah\">﴿Doğrusu içimizde Müslümanlar da var, hak yoldan sapanlar da var. Kim Müslüman olursa, işte onlar doğru yolu arayıp bulmuşlardır. Hak yoldan sapanlar ise cehenneme odun olmuşlardır﴾<\/span> [Cin 14–15]."], [2304.5, "Ve kâfirleri, aynen insanlar gibi kıyamet günü kendi aleyhlerine küfürle şahitlik ederler;"], [2308.9, "Allah Azze ve Celle'nin şu sözünde olduğu gibi:"], [2312.2, "<span class=\"ayah\">﴿Kâfir olduklarına dair kendi aleyhlerine şahitlik ettiler﴾<\/span> [En'âm 130]."]]}, {"reader": false, "ar": [[2316.0, "والجنُّ مثلُ الإنس؛ فمؤمنُهم يدخل الجنّةَ في الأصحّ،"], [2323.0, "وكافرُهم يدخل النارَ إجماعًا،"], [2327.0, "كما قال الله عز وجل:"], [2330.0, "<span class=\"ayah\">﴿قَالَ ادْخُلُوا فِي أُمَمٍ قَدْ خَلَتْ مِن قَبْلِكُم مِّنَ الْجِنِّ وَالْإِنسِ فِي النَّارِ﴾<\/span> <span class=\"ref\">[الأعراف: ٣٨]<\/span>."], [2335.0, "قال القرطبيّ رحمه الله تعالى في تفسيره في قول الله عز وجل:"], [2343.6, "<span class=\"ayah\">﴿سَنَفْرُغُ لَكُمْ أَيُّهَ الثَّقَلَانِ﴾<\/span> <span class=\"ref\">[الرحمن: ٣١]<\/span>،"], [2347.0, "قال: «هذه السورةُ والأحقافُ و<span class=\"ayah\">﴿قُلْ أُوحِيَ﴾<\/span> دليلٌ على أنّ الجنّ مخاطَبون، مكلَّفون، مأمورون، منهيّون، مُثابون، معاقَبون، كالإنس سواءً؛ مؤمنُهم كمؤمنهم، وكافرُهم ككافرهم، لا فرقَ بيننا وبينهم في شيءٍ من ذلك أبدًا». انتهى كلامه."]], "tr": [[2316.0, "Cinler insanlar gibidir: En sahih görüşe göre mü'minleri cennete girer;"], [2322.2, "kâfirleri ise icmâ ile cehenneme girer."], [2325.6, "Nitekim Allah Azze ve Celle şöyle buyurur:"], [2329.4, "<span class=\"ayah\">﴿(Allah) der ki: Sizden önce gelip geçmiş cin ve insan toplulukları arasında siz de ateşe girin﴾<\/span> [A'râf 38]."], [2334.6, "el-Kurtubî —Allah ona rahmet etsin— tefsirinde Allah Azze ve Celle'nin <span class=\"ayah\">﴿Ey iki ağır topluluk (insanlar ve cinler)! Yakında sizin (hesabınıza) yöneleceğiz﴾<\/span> [Rahmân 31] sözü hakkında şöyle demiştir:"], [2349.0, "\"Bu sûre, Ahkâf ve <span class=\"ayah\">﴿Kul ûhiye﴾<\/span> (Cin sûresi), cinlerin aynen insanlar gibi muhatap, mükellef, emrolunmuş, nehyolunmuş, sevap verilen ve cezalandırılan varlıklar olduğuna delildir."], [2359.8, "Mü'minleri (insanların) mü'minleri gibi, kâfirleri (insanların) kâfirleri gibidir;"], [2368.6, "bu hususların hiçbirinde bizimle onlar arasında asla fark yoktur.\" Sözü bitti."]]}, {"reader": false, "ar": [[2373.0, "وقال الزركشيّ رحمه الله تعالى في «البحر المحيط»:"], [2377.0, "«والدليلُ على تكليف الجنّ بالفروع: الإجماعُ على أنّ النبيّ صلى الله عليه وسلم أُرسل بالقرآن إلى الإنس والجنّ، وجميعُ أوامره ونواهيه يتوجّه إلى الجنسين، وقد تضمّن ذلك أنّ كفّار الإنس مخاطَبون بها، وكذلك كفّارُ الجنّ». انتهى كلامه."]], "tr": [[2373.0, "ez-Zerkeşî —Allah ona rahmet etsin— \"el-Bahru'l-Muhît\"te şöyle demiştir:"], [2376.5, "\"Cinlerin fer'î hükümlerle mükellef olduğunun delili, Peygamber sallallâhu aleyhi ve sellem'in Kur'an'la insanlara ve cinlere gönderildiğine dair icmâdır."], [2385.6, "Onun bütün emirleri ve yasakları iki cinse de yönelir."], [2391.1, "Bu, insanların kâfirlerinin onlarla muhatap olduğunu, aynı şekilde cinlerin kâfirlerinin de (muhatap olduğunu) içermektedir.\" Sözü bitti."]]}]}, {"ts": "40:01", "title": "5. Külliye (devam): \"Tahsis delili olmadıkça\" kaydı ve âlimlerin sözleri", "paras": [{"reader": false, "ar": [[2401.0, "فإن قلت: ولماذا قيّدتَ آخرَ الكلّيّة بقولك:"], [2405.9, "«إلا بدليل الاختصاص»؟ فأقول:"], [2408.7, "لأنّ الجنّ ربما خالفوا الإنسَ في بعض التكاليف لاختلاف طبيعتهم عن طبيعة الإنس."], [2418.0, "ويوضّح ذلك الإمامُ الزركشيّ رحمه الله تعالى في «البحر المحيط»،"], [2425.0, "قال: «وقد وقع نزاعٌ بين المتأخّرين في أنّ الجنّ مكلَّفون بفروع الدين، فقال بعضُ محقّقيهم: إنهم مكلَّفون بها في الجملة، لكن لا على حدّ تكليف الإنس بها؛ لأنهم يخالفون الإنسَ بالحدّ والحقيقة، فبالضرورة يخالفونهم في بعض التكاليف»."]], "tr": [[2401.0, "Eğer \"Külliyenin sonunu niçin 'tahsis delili olmadıkça' sözüyle kayıtladın?\" dersen, derim ki:"], [2408.0, "Çünkü cinler, tabiatlarının insanların tabiatından farklı olması sebebiyle bazı teklîflerde insanlardan ayrılabilirler."], [2415.6, "İmam ez-Zerkeşî —Allah ona rahmet etsin— bunu \"el-Bahru'l-Muhît\"te şöyle açıklar:"], [2422.2, "\"Müteahhirîn arasında cinlerin dinin fer'î hükümleriyle mükellef olup olmadığı hakkında tartışma çıkmıştır."], [2429.1, "Onların muhakkiklerinden bazıları şöyle demiştir:"], [2431.4, "Onlar genel olarak bunlarla mükelleftirler;"], [2434.1, "fakat insanların bunlarla mükellef olduğu ölçüde değil."], [2437.2, "Çünkü onlar tarif ve hakikat bakımından insanlardan farklıdırlar;"], [2440.8, "dolayısıyla zorunlu olarak bazı teklîflerde de onlardan farklıdırlar.\""]]}, {"reader": false, "ar": [[2445.0, "ثمّ ضرب لك مثالًا فقال رحمه الله:"], [2448.5, "«مثالُه أنّ الجنّ قد أُعطي بعضُهم قوّةَ الطيران في الهواء، فهو مخاطَبٌ بقصد البيت الحرام للحجّ طائرًا، والإنسانُ لعدم تلك القوّة لا يُخاطَب بذلك. هذا في طرف زيادة تكليفهم على تكليف الإنس. فكلُّ تكليفٍ يتعلّق بخصوص طبيعة الإنس ينتفي في حقّ الجنّ لعدم تلك الخصوصيّة»."], [2471.0, "انتهى كلامه رحمه الله."], [2473.0, "يعني: بمعنى أنهم وإن اتّفقوا في أصل التكليف إلا أنه قد يختلف في بعض فروعه وجزئيّاته؛"], [2479.0, "لاختلاف طبيعة الإنس عن طبيعة الجنّ."]], "tr": [[2445.0, "Sonra sana bir misal vererek —Allah ona rahmet etsin— şöyle dedi:"], [2449.5, "\"Bunun misali şudur: Cinlerden bazılarına havada uçma kuvveti verilmiştir;"], [2453.5, "bu yüzden o, hac için Beytullah'a uçarak gitmekle muhataptır."], [2457.0, "İnsan ise o kuvvete sahip olmadığı için bununla muhatap değildir."], [2462.0, "Bu, onların teklîfinin insanların teklîfinden fazla olması tarafındandır."], [2465.5, "(Diğer tarafta ise) insanların tabiatının hususiyetine bağlı her teklîf, o hususiyet bulunmadığı için cinler hakkında ortadan kalkar.\" Sözü bitti, Allah ona rahmet etsin."], [2474.7, "Yani teklîfin aslında ittifak etseler de, insan tabiatının cin tabiatından farklı olması sebebiyle onun bazı fer'î ve cüz'î hükümlerinde farklılık olabilir."]]}, {"reader": false, "ar": [[2482.0, "وقد سُئل شيخُ الإسلام ابنُ تيميّة رحمه الله عن الجانّ المؤمنين:"], [2487.0, "هل هم مخاطَبون بفروع الإسلام كالصوم والصلاة وغير ذلك من العبادات،"], [2492.0, "أو هم مخاطَبون بنفس التصديق ـ أي:"], [2495.0, "بنفس الإيمان ـ لا غير؟"], [2497.0, "فأجاب رحمه الله: «لا ريبَ أنهم مأمورون بأعمالٍ زائدةٍ على التصديق، ومنهيّون عن أعمالٍ غير التكذيب، فهم مأمورون بالأصول والفروع بحسبهم؛ فإنهم ليسوا مماثلين للإنس في الحدّ والحقيقة، فلا يكون ما أُمروا به ونُهوا عنه مساويًا لما عليه الإنسُ في الحدّ، لكنّهم مشاركون الإنسَ في جنس التكليف بالأمر والنهي والتحليل والتحريم، وهذا ما لم أعلم فيه نزاعًا بين المسلمين»."], [2528.0, "انتهى كلامه رحمه الله."]], "tr": [[2482.0, "Şeyhülislâm İbn Teymiyye'ye —Allah ona rahmet etsin— mü'min cinler hakkında, oruç, namaz ve diğer ibadetler gibi İslâm'ın fer'î hüküm
