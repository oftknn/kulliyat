leriyle mi muhatap oldukları, yoksa sadece tasdikle —yani sadece imanla— mı muhatap oldukları soruldu."], [2494.5, "O da —Allah ona rahmet etsin— şöyle cevap verdi:"], [2498.4, "\"Şüphesiz onlar tasdikten fazla amellerle emrolunmuş ve tekzipten başka amellerden de nehyolunmuşlardır."], [2503.2, "Dolayısıyla onlar kendilerine göre usûl ve fürû ile emrolunmuşlardır."], [2509.0, "Zira onlar tarif ve hakikatte insanlara benzer değildirler;"], [2511.6, "bu yüzden emrolundukları ve nehyolundukları şey, tarif bakımından insanların üzerindekine eşit olmaz."], [2515.8, "Fakat onlar emir ve nehiy, helal kılma ve haram kılma ile teklîfin cinsinde insanlarla ortaktırlar."], [2523.0, "Bu, Müslümanlar arasında bir ihtilaf bilmediğim bir husustur.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[2529.0, "وقد عقد الإمامُ الشِّبليّ بابًا قال فيه:"], [2537.0, "«بابٌ في أنّ الجنّ مكلَّفون بإجماع أهل النظر»،"], [2541.0, "ثمّ نقل فيه عن أبي عمر بن عبد البرّ:"], [2545.6, "«أنّ الجنّ عند الجماعة» ـ أي عند أهل السنّة والجماعة ـ «مكلَّفون مخاطَبون»."], [2552.0, "وقال الرازيّ في تفسيره:"], [2554.8, "«أطبق الكلُّ على أنّ الجنّ كلَّهم مكلَّفون»."], [2560.0, "وقال الإمامُ ابنُ القيّم رحمه الله:"], [2563.3, "«الصوابُ الذي عليه جمهورُ أهل الإسلام أنهم مأمورون، منهيّون، مكلَّفون بالشريعة الإسلاميّة، وأدلّةُ القرآن والسنّة على ذلك أكثرُ من أن تُحصَر»."], [2574.0, "انتهى كلامه رحمه الله."]], "tr": [[2529.0, "İmam eş-Şiblî bir bab açmış ve orada şöyle demiştir:"], [2537.5, "\"Cinlerin, nazar ehlinin icmâıyla mükellef olduğuna dair bab.\" Sonra orada Ebû Ömer İbn Abdilberr'den şunu nakletmiştir:"], [2544.9, "\"Cinler, cemaate göre\" —yani Ehl-i Sünnet ve'l-Cemaat'e göre— \"mükellef ve muhataptırlar.\" er-Râzî tefsirinde şöyle demiştir:"], [2552.7, "\"Herkes, cinlerin hepsinin mükellef olduğunda birleşmiştir.\" İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şöyle demiştir:"], [2561.7, "\"Ehl-i İslâm'ın cumhurunun üzerinde bulunduğu doğru görüş, onların İslâm şeriatiyle emrolunmuş, nehyolunmuş ve mükellef olduklarıdır."], [2569.4, "Kur'an ve Sünnet'in buna dair delilleri sayılamayacak kadar çoktur.\" Sözü bitti, Allah ona rahmet etsin."]]}]}, {"ts": "42:57", "title": "6. Külliye: Cin âlemi hakkında bir şeyi isbat veya nefyeden herkes delil getirmekle yükümlüdür", "paras": [{"reader": false, "ar": [[2577.0, "ومن الكلّيّات أيضًا: <b>كلُّ من أثبت أو نفى عن عالم الجنّ أمرًا<\/b> ـ كلُّ من نفى أو أثبت ـ <b>كلُّ من أثبت أو نفى في عالم الجنّ أمرًا فمُطالَبٌ بالدليل، فمُطالَبٌ بالدليل.<\/b> ماشي؟"]], "tr": [[2577.0, "Külliyelerden biri de şudur: 6."], [2580.6, "külliye: Cin âleminden bir şeyi isbat veya nefyeden herkes<b> —nefyeden veya isbat eden herkes— <\/b>cin âleminde bir şeyi isbat veya nefyeden herkes delil getirmekle yükümlüdür;"], [2604.0, "delil getirmekle yükümlüdür. Tamam mı?"]]}, {"reader": false, "ar": [[2614.0, "وذلك لأنّ المتقرّر في القواعد أنّ ما كان غيبيًّا فيكون توقيفيًّا على النصّ."], [2620.0, "فلأنّ عالمَ الجنّ من العوالم الغيبيّة،"], [2623.6, "فإنّ الواجب علينا أن نجعل ميزانَ قبول أو ردّ شيءٍ عن هذا العالم أو فيه توقيفيًّا على النصّ."], [2637.0, "فلا يجوز لنا أن نُثبت لهذا العالم إلا ما أثبته النصّ،"], [2641.0, "ولا أن ننفي عن هذا العالم إلا ما نفاه النصّ."], [2645.0, "وأمّا ما لم يرد النصُّ بإثباته أو نفيه فنتوقّف فيه،"], [2650.3, "فلا حقَّ لأحدٍ أن يُثبته أو ينفيه."], [2654.0, "فكما أنّ من أثبت شيئًا لهذا العالم مطالَبٌ بالدليل،"], [2659.0, "فكذلك من نفى شيئًا عن هذا العالم أيضًا مطالَبٌ بالدليل."]], "tr": [[2614.0, "Bunun sebebi şudur: Kaidelerde yerleşik olan, gaybî olan şeyin nassa bağlı, tevkîfî olmasıdır."], [2619.5, "Cin âlemi gaybî âlemlerden olduğu için, bu âlem hakkında veya bu âlemde bir şeyi kabul etme ya da reddetme ölçüsünü nassa bağlı, tevkîfî kılmamız vâciptir."], [2637.0, "Dolayısıyla bu âleme ancak nassın isbat ettiğini isbat etmemiz, bu âlemden de ancak nassın nefyettiğini nefyetmemiz caizdir."], [2643.4, "İsbatına veya nefyine dair nas gelmeyen şeyde ise tevakkuf ederiz (hüküm vermeyiz);"], [2649.2, "kimsenin onu isbat etmeye veya nefyetmeye hakkı yoktur."], [2653.5, "Bu âleme bir şey isbat eden delil getirmekle yükümlü olduğu gibi, bu âlemden bir şeyi nefyeden de delil getirmekle yükümlüdür."]]}, {"reader": false, "ar": [[2663.0, "وهناك نقاطٌ أثبتها الدليلُ نجعلها فروعًا على هذه الكلّيّة."], [2669.0, "منها: إن قلتَ: هل هم موجودون؟"], [2674.0, "فأقول: نعم، وقد دلّ على وجودهم الإجماعُ القطعيُّ المنقولُ بالتواتر."], [2682.0, "ومن أنكر أصلَ وجود عالم الجنّ فإنه كافرٌ إجماعًا؛"], [2687.0, "لأنه منكرٌ للمعلوم من الدين بالضرورة،"], [2690.0, "والمتقرّر في القواعد أنّ كلَّ من أنكر معلومًا من الدين بالضرورة فإنه كافر."], [2697.0, "والأدلّةُ على وجود الجنّ من القرآن كثيرةٌ جدًّا."]], "tr": [[2663.0, "Delilin isbat ettiği bazı noktalar vardır ki onları bu külliyenin fer'î meseleleri kılıyoruz."], [2670.5, "Bunlardan biri: Eğer \"Onlar var mıdır?\" dersen, derim ki:"], [2677.6, "Evet. Onların varlığına tevâtürle nakledilen kesin icmâ delalet etmiştir."], [2682.6, "Cin âleminin varlığının aslını inkâr eden kimse icmâ ile kâfirdir;"], [2687.5, "çünkü o, dinden zarurî olarak bilineni inkâr etmektedir."], [2691.1, "Kaidelerde yerleşik olan da, dinden zarurî olarak bilinen bir şeyi inkâr eden herkesin kâfir olduğudur."], [2697.4, "Cinlerin varlığına dair Kur'an'dan deliller pek çoktur."]]}, {"reader": false, "ar": [[2700.0, "ولا أدلَّ على ذلك من أنّ الله عز وجل سمّى في قرآنه سورةً كاملةً باسمهم،"], [2708.0, "وهي سورة الجنّ، وقد قصّ الله عز وجل علينا فيها وفي غيرها من أخبارهم وأقوالهم الشيءَ الكثير."], [2715.0, "وأمّا أحاديثُ السنّة الدالّةُ على وجودهم فأكثرُ من أن تُحصَر."], [2720.0, "قال شيخُ الإسلام ابنُ تيميّة رحمه الله تعالى:"], [2723.0, "«لم يخالف أحدٌ من طوائف المسلمين في وجود الجنّ، ولا في أنّ الله أرسل محمّدًا صلى الله عليه وسلم إليهم. وهذا لأنّ وجود الجنّ تواترت به أخبارُ الأنبياء تواترًا معلومًا بالاضطرار، ومعلومٌ بالاضطرار أنهم أحياءٌ عقلاءُ فاعلون بالإرادة، بل مأمورون ومنهيّون». انتهى كلامه."]], "tr": [[2700.0, "Buna, Allah Azze ve Celle'nin Kur'an'ında tam bir sûreye onların adını vermesinden daha açık bir delil yoktur;"], [2708.0, "o da Cin sûresidir. Allah Azze ve Celle onda ve başka yerlerde bize onların haberlerinden ve sözlerinden pek çok şey anlatmıştır."], [2715.5, "Onların varlığına delalet eden sünnet hadislerine gelince, sayılamayacak kadar çoktur."], [2720.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2723.0, "\"Müslüman fırkalarından hiçbiri cinlerin varlığında ve Allah'ın Muhammed sallallâhu aleyhi ve sellem'i onlara gönderdiğinde muhalefet etmemiştir."], [2729.2, "Bunun sebebi, cinlerin varlığına dair peygamberlerin haberlerinin zarurî olarak bilinen bir tevâtürle mütevâtir olmasıdır."], [2736.9, "Onların diri, akıllı, iradeyle fiil işleyen, hatta emrolunmuş ve nehyolunmuş varlıklar oldukları da zarurî olarak bilinmektedir.\" Sözü bitti."]]}]}, {"ts": "45:47", "title": "6. Külliye (devam): Yaratılış maddeleri, insandan önce yaratılmaları, erkek ve dişi olmaları", "paras": [{"reader": false, "ar": [[2747.0, "ومنها أيضًا: إن قيل:"], [2749.7, "ما أصلُ مادّة خلقهم؟"], [2751.2, "فأقول: من النار. وقد صرّح القرآنُ بهذه الحقيقة التي أجمع عليها العلماء في قوله عز وجل:"], [2760.0, "<span class=\"ayah\">﴿وَلَقَدْ خَلَقْنَا الْإِنسَانَ مِن صَلْصَالٍ مِّنْ حَمَإٍ مَّسْنُونٍ وَالْجَانَّ خَلَقْنَاهُ مِن قَبْلُ مِن نَّارِ السَّمُومِ﴾<\/span> <span class=\"ref\">[الحجر: ٢٦–٢٧]<\/span>."], [2768.0, "فمادّةُ خلقهم هي النار."], [2771.0, "ولقول الله عز وجل:"], [2773.0, "<span class=\"ayah\">﴿مِن مَّارِجٍ مِّن نَّارٍ﴾<\/span> <span class=\"ref\">[الرحمن: ١٥]<\/span>."], [2777.0, "وسُمّيت نارُ السَّموم بهذا الاسم لأنها تنفذ في مسامّ البدن لشدّة حرّها وتوهّجها."], [2786.0, "وقال الله عز وجل:"], [2788.8, "<span class=\"ayah\">﴿وَخَلَقَ الْجَانَّ مِن مَّارِجٍ مِّن نَّارٍ﴾<\/span> <span class=\"ref\">[الرحمن: ١٥]<\/span>."]], "tr": [[2747.0, "Bunlardan biri de şudur: \"Onların yaratılış maddesinin aslı nedir?\" denirse, derim ki:"], [2751.7, "Ateştir. Kur'an, âlimlerin üzerinde icmâ ettiği bu hakikati Allah Azze ve Celle'nin şu sözünde açıkça ifade etmiştir:"], [2759.0, "<span class=\"ayah\">﴿Andolsun, biz insanı kuru bir çamurdan, şekillendirilmiş kara balçıktan yarattık. Cinleri de daha önce zehirli (nüfuz edici) ateşten yarattık﴾<\/span> [Hicr 26–27]."], [2767.4, "Onların yaratılış maddesi ateştir. Ve Allah Azze ve Celle'nin şu sözünden dolayı:"], [2773.0, "<span class=\"ayah\">﴿dumansız saf bir ateşten﴾<\/span> [Rahmân 15]."], [2777.0, "Semûm ateşi bu isimle adlandırılmıştır;"], [2780.2, "çünkü sıcaklığının ve alevinin şiddetinden bedenin gözeneklerine nüfuz eder."], [2783.9, "Allah Azze ve Celle şöyle buyurmuştur:"], [2788.1, "<span class=\"ayah\">﴿Cinleri de dumansız saf bir ateşten yarattı﴾<\/span> [Rahmân 15]."]]}, {"reader": false, "ar": [[2794.0, "وفي صحيح الإمام مسلمٍ من حديث عائشة رضي الله عنها قالت:"], [2798.4, "قال النبيّ صلى الله عليه وسلم:"], [2800.5, "«خُلقت الملائكةُ من نور، وخُلق الجانُّ من مارجٍ من نار، وخُلق آدمُ ممّا وُصف لكم»."], [2809.0, "ولكن لا يخفى أنّ خلق الجانّ من نارٍ لا يلزم منه أنّ أشكالهم وهيئاتهم لا تزال ناريّة؛"], [2817.0, "فالبشرُ خُلقوا من ترابٍ وليسوا كذلك الآن."], [2822.0, "ولكن يُؤخذ منه أنّ في الجنّ صفاتٍ من صفات النار،"], [2826.0, "كالخفّة واللطافة والطيش، مثلَ ما للبشر من صفات التراب كالثقل والكثافة."], [2833.0, "وسيأتي تفصيلُه بعد قليلٍ إن شاء الله."]], "tr": [[2794.0, "İmam Müslim'in Sahîh'inde Âişe —Allah ondan razı olsun— hadisinde şöyle geçer:"], [2798.4, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2800.9, "\"Melekler nurdan yaratıldı, cinler dumansız saf ateşten yaratıldı, Âdem de size vasfedilen şeyden yaratıldı.\" Fakat açıktır ki cinlerin ateşten yaratılması, şekillerinin ve görünüşlerinin hâlâ ateşten olmasını gerektirmez;"], [2815.6, "insanlar da topraktan yaratılmıştır ama şimdi öyle değildir."], [2820.6, "Ancak buradan, cinlerde ateşin sıfatlarından hafiflik, latiflik ve savrukluk gibi sıfatlar bulunduğu anlaşılır;"], [2827.9, "tıpkı insanlarda ağırlık ve yoğunluk gibi toprağın sıfatlarının bulunması gibi."], [2833.3, "Bunun tafsilatı inşallah birazdan gelecek."]]}, {"reader": false, "ar": [[2835.0, "ومنها أيضًا: إن قلتَ:"], [2837.5, "أيُّهم أسبقُ في الخلق،"], [2840.0, "الإنسُ أم الجنّ؟ فأقول:"], [2841.8, "لا جرمَ أنهم الجنُّ إجماعًا؛"], [2847.0, "لقول الله عز وجل:"], [2848.0, "<span class=\"ayah\">﴿وَلَقَدْ خَلَقْنَا الْإِنسَانَ مِن صَلْصَالٍ مِّنْ حَمَإٍ مَّسْنُونٍ وَالْجَانَّ خَلَقْنَاهُ مِن قَبْلُ مِن نَّارِ السَّمُومِ﴾<\/span> <span class=\"ref\">[الحجر: ٢٦–٢٧]<\/span>."], [2854.0, "ومنها أيضًا: إن قلتَ:"], [2856.0, "هل عالمُهم منقسمٌ إلى ذكورٍ وإناث؟"], [2859.0, "الجوابُ: نعم بالإجماع. فعالمُهم منقسمٌ كعالم الإنس إلى ذكورٍ وإناث،"], [2868.0, "فجنسُ الجنّ كجنس الجنّ <span class=\"q\">؟ 47:48<\/span> فيهم الذكورُ والإناث؛"], [2872.0, "لقول الله عز وجل:"], [2873.0, "<span class=\"ayah\">﴿وَأَنَّهُ كَانَ رِجَالٌ مِّنَ الْإِنسِ يَعُوذُونَ بِرِجَالٍ مِّنَ الْجِنِّ فَزَادُوهُمْ رَهَقًا﴾<\/span> <span class=\"ref\">[الجن: ٦]<\/span>."]], "tr": [[2835.0, "Bunlardan biri de şudur: Eğer \"Yaratılışta hangisi öncedir, insanlar mı cinler mi?\" dersen, derim ki:"], [2840.7, "Şüphesiz icmâ ile onlar cinlerdir."], [2843.3, "Allah Azze ve Celle'nin şu sözünden dolayı:"], [2847.5, "<span class=\"ayah\">﴿Andolsun, biz insanı kuru bir çamurdan, şekillendirilmiş kara balçıktan yarattık. Cinleri de daha önce zehirli ateşten yarattık﴾<\/span> [Hicr 26–27]."], [2852.3, "Bunlardan biri de şudur: Eğer \"Onların âlemi erkekler ve dişiler olarak ikiye ayrılır mı?\" dersen, cevap:"], [2858.0, "İcmâ ile evet. Onların âlemi de insanların âlemi gibi erkekler ve dişiler olarak ayrılır;"], [2866.6, "cin cinsi de (insan cinsi gibidir; <span class=\"q\">؟<\/span>) içlerinde erkekler ve dişiler vardır."], [2871.4, "Allah Azze ve Celle'nin şu sözünden dolayı:"], [2873.0, "<span class=\"ayah\">﴿Doğrusu insanlardan bazı erkekler, cinlerden bazı erkeklere sığınırlardı da onların azgınlığını artırırlardı﴾<\/span> [Cin 6]."]]}, {"reader": false, "ar": [[2880.0, "وفي الصحيحين من حديث أنسٍ رضي الله عنه قال:"], [2885.4, "«كان النبيّ صلى الله عليه وسلم إذا دخل الخلاء قال: اللهمّ إنّي أعوذ بك من الخُبُث والخبائث»."], [2892.0, "وعند أبي داود بإسنادٍ صحيحٍ من حديث زيد بن أرقم رضي الله عنه قال:"], [2899.5, "قال النبيّ صلى الله عليه وسلم:"], [2902.2, "«إنّ هذه الحُشوشَ مُحتضَرة، فإذا دخل أحدُكم الخلاء فليقل: أعوذ بالله من الخُبُث والخبائث»."], [2909.0, "والخُبُث ـ بضمّ الباء ـ ذكورُ الجنّ، والخبائثُ إناثُهم."]], "tr": [[2880.0, "Sahîhayn'de Enes —Allah ondan razı olsun— hadisinde şöyle geçer:"], [2885.0, "\"Peygamber sallallâhu aleyhi ve sellem helâya girdiğinde şöyle derdi:"], [2888.1, "Allah'ım! Erkek ve dişi şeytanlardan sana sığınırım (min el-hubusi ve'l-habâis).\" Ebû Dâvûd'da sahih bir isnadla Zeyd b."], [2894.7, "Erkam —Allah ondan razı olsun— hadisinde şöyle geçer:"], [2898.5, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [2901.3, "\"Bu helâlar (şeytanların) hazır bulunduğu yerlerdir."], [2904.0, "Biriniz helâya girdiğinde: Erkek ve dişi şeytanlardan Allah'a sığınırım, desin.\" el-Hubus —bâ harfinin ötresiyle— erkek cinler, el-habâis de dişileridir."]]}]}, {"ts": "48:37", "title": "6. Külliye (devam): Ateşî asıllarında kalıp kalmadıkları", "paras": [{"reader": false, "ar": [[2917.0, "ومنها أيضًا: إن قلتَ:"], [2919.8, "هل هم باقون على أصل ناريّتهم؟"], [2924.0, "فأقول: اعلم ـ رحمك الله تعالى ـ أنّ الله تعالى أضاف الشياطينَ والجنَّ إلى النار حسبما أضاف الإنسانَ إلى التراب والطين والفخّار."], [2943.0, "والمرادُ به في حقّ الإنسان أنّ أصلَه الطين،"], [2947.0, "وليس الآدميُّ طينًا حقيقةً في ذرّيّة آدم،"], [2954.0, "ولكنّه كان طينًا. وكذلك الجانُّ أيضًا كان نارًا باعتبار الأصل ـ بدليل قول النبيّ صلى الله عليه وسلم ـ ولكنّه لا يلزم أن يبقى على أصل ناريّته في ذرّيّته."]], "tr": [[2917.0, "Bunlardan biri de şudur: Eğer \"Onlar ateşî asıllarında mı kalmaktadırlar?\" dersen, derim ki:"], [2925.4, "Bil ki —Allah sana rahmet etsin— Allah Teâlâ şeytanları ve cinleri ateşe, insanı toprağa, çamura ve pişmiş kile nispet ettiği gibi nispet etmiştir."], [2945.5, "İnsan hakkında bununla kastedilen, onun aslının çamur olmasıdır;"], [2950.0, "Âdem'in zürriyetinde insan hakikaten çamur değildir, fakat (aslı) çamurdu."], [2959.0, "Aynı şekilde cin de asıl itibarıyla ateşti —Peygamber sallallâhu aleyhi ve sellem'in sözünün delaletiyle— fakat zürriyetinde ateşî aslı üzere kalması gerekmez."]]}, {"reader": false, "ar": [[2968.0, "والدليلُ على ذلك قولُ النبيّ صلى الله عليه وسلم:"], [2973.0, "«عرض لي الشيطانُ في صلاتي فخنقتُه» ـ انتبه ـ «حتى وجدتُ بردَ لُعابه على يدي»."], [2980.0, "ومن يكون نارًا محرقةً كيف يكون لعابُه أو ريقُه باردًا،"], [2989.0, "أو أنّ له ريقًا أصلًا؟"], [2991.0, "وممّا يدلّ على ذلك أيضًا ـ أي على أنّ الجنّ ليسوا بباقين على عنصرهم الناريّ ـ قولُ النبيّ صلى الله عليه وسلم:"], [3000.5, "«إنّ عدوَّ الله إبليس» ـ أي الشيطان ـ «جاء بشهابٍ من نارٍ ليجعله في وجهي»."]], "tr": [[2968.0, "Bunun delili Peygamber sallallâhu aleyhi ve sellem'in şu sözüdür:"], [2972.4, "\"Namazımda şeytan bana ârız oldu, ben de onu boğdum\" —dikkat et— \"öyle ki salyasının serinliğini elimde hissettim.\" Yakıcı bir ateş olan kimsenin salyası veya tükürüğü nasıl serin olur, ya da onun hiç tükürüğü olur mu?"], [2994.2, "Buna —yani cinlerin ateşî unsurlarında kalmadıklarına— delalet eden şeylerden biri de Peygamber sallallâhu aleyhi ve sellem'in şu sözüdür:"], [3000.9, "\"Allah'ın düşmanı İblis\" —yani şeytan— \"yüzüme atmak için ateşten bir alev getirdi.\""]]}, {"reader": false, "ar": [[3006.0, "وبيانُ الدلالة منه: أنهم لو كانوا باقين على أصل عنصرهم الناريّ لما احتاجوا إلى أن يأتي الشيطانُ أو العفريتُ منهم بشعلةٍ من نار،"], [3015.0, "ولكانت يدُ الشيطان أو العفريت أو شيءٌ من أعضائه إذا مسّ شيئًا من أعضاء بني آدم لأحرقته من غير حاجةٍ إلى شعلةٍ من نار."], [3026.0, "وبهذا يُعلم أنه كما يتأذّى الإنسانُ من ضربة الطين والحجر مع أنه خُلق من الطين،"], [3039.0, "فإنّ الجنّ كذلك يتأذّون ويحترقون بالنار مع أنهم خُلقوا منها."], [3044.0, "وهذا جوابُ إشكالٍ يُردّده بعضُ الملاحدة:"], [3047.0, "من أنه كيف يكون الشيطانُ مخلوقًا من نار،"], [3050.0, "ثمّ تكون آخرتُه التعذيبَ بالنار؟"]], "tr": [[3006.0, "Bundan delaletin açıklaması şudur: Eğer onlar ateşî unsurlarının aslında kalmış olsalardı, şeytanın veya onlardan ifritin ateşten bir alev getirmesine ihtiyaç duymazlardı;"], [3014.6, "şeytanın veya ifritin eli ya da azalarından biri Âdemoğlunun azalarından birine dokunduğunda, ateşten bir aleve ihtiyaç olmaksızın onu yakardı."], [3022.9, "Bununla bilinir ki, insan çamurdan yaratıldığı hâlde çamur ve taş darbesinden nasıl eziyet görüyorsa, cinler de ateşten yaratıldıkları hâlde aynı şekilde ateşle eziyet görür ve yanarlar."], [3043.0, "Bu, bazı mülhidlerin tekrarlayıp durduğu bir müşkilin cevabıdır:"], [3047.4, "\"Şeytan ateşten yaratılmışken nasıl olur da âhireti ateşle azap görmek olur?\""]]}]}, {"ts": "50:53", "title": "6. Külliye (devam): Yeme-içme, meskenler ve şekil değiştirme", "paras": [{"reader": false, "ar": [[3053.0, "ومنها أيضًا: إن قلتَ:"], [3056.0, "هل يأكلون ويشربون؟ الجوابُ:"], [3060.1, "نعم، كما في حديث عبد الله بن مسعودٍ رضي الله عنه أنّ رسول الله صلى الله عليه وسلم قال:"], [3069.9, "«أتاني داعي الجنّ فذهبتُ معه فقرأتُ عليهم القرآن»."], [3073.0, "قال عبدُ الله بن مسعود:"], [3075.3, "«فانطلق رسولُ الله صلى الله عليه وسلم بنا فأرانا آثارَهم وآثارَ نيرانهم، قال: وسألوه الزاد، فقال: لكم كلُّ عظمٍ ذُكر اسمُ الله عليه يقع في أيديكم أوفرَ ما يكون لحمًا، وكلُّ بعرةٍ علفٌ لدوابّكم». أخرجه مسلم."]], "tr": [[3053.0, "Bunlardan biri de şudur: Eğer \"Yiyip içerler mi?\" dersen, cevap:"], [3060.1, "Evet. Nitekim Abdullah b. Mes'ûd —Allah ondan razı olsun— hadisinde Resûlullah sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [3068.5, "\"Bana cinlerin davetçisi geldi; onunla gittim ve onlara Kur'an okudum.\" Abdullah b."], [3072.2, "Mes'ûd dedi ki: \"Resûlullah sallallâhu aleyhi ve sellem bizi alıp götürdü ve bize onların izlerini ve ateşlerinin izlerini gösterdi."], [3080.5, "(Ravi) dedi ki: Ondan azık istediler;"], [3083.3, "buyurdu ki: Üzerine Allah'ın ismi anılmış her kemik sizindir;"], [3086.7, "elinize olabildiğince etli olarak geçer."], [3088.8, "Her tezek de hayvanlarınız için yemdir.\" Bunu Müslim rivayet etmiştir."]]}, {"reader": false, "ar": [[3093.0, "ولا يخفى عليكم أنّ ذكرَ هذين الصنفين من الطعام لا يدلّ على أنّ الجنّ عامّةً مقتصرون عليهما؛"], [3102.0, "فربما كان ذلك من أهمّ طعامهم،"], [3105.2, "أو أنه مختصٌّ ببعضهم على حسب أصنافهم وأماكن إقامتهم،"], [3110.0, "والله أعلم بأحوالهم. ولذلك قال النبيّ صلى الله عليه وسلم:"], [3117.0, "«فإنّ الشيطان يستحلّ الطعامَ الذي لم يُذكر عليه اسمُ الله» عز وجل."]], "tr": [[3093.0, "Size gizli değildir ki bu iki çeşit yiyeceğin zikredilmesi, cinlerin genel olarak bunlarla yetindiğine delalet etmez."], [3100.9, "Belki bu onların en önemli yiyeceklerindendir veya türlerine ve ikamet yerlerine göre bazılarına mahsustur;"], [3108.4, "onların hâllerini Allah daha iyi bilir."], [3112.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [3118.4, "\"Çünkü şeytan, üzerine Allah'ın ismi anılmayan yemeği kendisine helal sayar.\""]]}, {"reader": false, "ar": [[3126.0, "ومنها أيضًا: إن قلتَ:"], [3127.6, "هل لهم قرًى ومساكنُ كما للإنس؟"], [3130.0, "فأقول: لم يرد في كتاب الله عز وجل،"], [3132.8, "ولا في سنّة رسوله صلى الله عليه وسلم الصحيحة،"], [3136.1, "وصفٌ تفصيليٌّ لمساكن الجنّ أو شكل عيشهم،"], [3140.0, "وهل لهم مدنٌ أو قرًى كالحال عند البشر،"], [3144.0, "أم أنهم يعيشون في البراري والفيافي،"], [3147.0, "أم أنهم مختلطون بالبشر في بيوتهم ومساكنهم."], [3150.0, "إلا أنه قد ورد في السنّة تعيينُ بعض الأماكن بأنّ الشياطين تتواجد فيها كثيرًا،"], [3156.0, "كما في دورات المياه والحمّامات،"], [3159.0, "كما في قوله صلى الله عليه وسلم:"], [3161.0, "«إنّ هذه الحشوشَ مُحتضَرة»."]], "tr": [[3126.0, "Bunlardan biri de şudur: Eğer \"İnsanların olduğu gibi onların da köyleri ve meskenleri var mıdır?\" dersen, derim ki:"], [3132.1, "Allah Azze ve Celle'nin Kitabı'nda ve Resûlü sallallâhu aleyhi ve sellem'in sahih sünnetinde cinlerin meskenlerine veya yaşayış şekillerine dair ayrıntılı bir vasıf gelmemiştir;"], [3141.0, "insanlarda olduğu gibi onların da şehirleri veya köyleri mi var, yoksa çöllerde ve kırlarda mı yaşıyorlar, yoksa insanlarla evlerinde ve meskenlerinde iç içe mi yaşıyorlar (bildirilmemiştir)."], [3151.7, "Ancak sünnette, şeytanların çokça bulunduğu bazı yerlerin belirlendiği gelmiştir;"], [3155.6, "tuvaletler ve hamamlar gibi. Nitekim onun sallallâhu aleyhi ve sellem şu sözünde geçer:"], [3160.4, "\"Bu helâlar (şeytanların) hazır bulunduğu yerlerdir.\""]]}, {"reader": false, "ar": [[3163.0, "وقد دلّ الدليلُ أيضًا على أنّ بعض الجنّ المسلم قد يعيش مع الإنس ويُسمَّون بالعوامر؛"], [3169.0, "ولذلك نهانا النبيُّ صلى الله عليه وسلم عن قتل الحيّات حتى نُؤذِنها ثلاثًا،"], [3176.0, "فإن ذهبت وإلا جاز قتلُها."], [3179.0, "ومنها أيضًا: إن قلتَ:"], [3181.5, "هل يتشكّلون على صورٍ أخرى؟"], [3184.7, "فأقول: نعم. ففي الحديث عن أبي ثعلبة الخُشَنيّ رضي الله عنه قال:"], [3190.4, "قال النبيّ صلى الله عليه وسلم:"], [3192.8, "«الجنُّ ثلاثةُ أصناف: فصنفٌ لهم أجنحةٌ يطيرون في الهواء، وصنفٌ حيّاتٌ، وصنفٌ يَحُلّون ويَظْعَنون» ـ مثلُ:"], [3203.3, "كالبدو ـ. رواه الطبرانيّ ورجالُه موثَّقون."]], "tr": [[3163.0, "Delil ayrıca Müslüman cinlerden bazılarının insanlarla birlikte yaşayabileceğine delalet etmiştir;"], [3166.2, "bunlara \"avâmir\" (ev sakinleri) denir."], [3167.8, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem, üç kez haber vermedikçe (ihtar etmedikçe) yılanları öldürmemizi yasaklamıştır;"], [3174.4, "eğer giderse (ne âlâ), gitmezse onu öldürmek caiz olur."], [3178.4, "Bunlardan biri de şudur: Eğer \"Başka suretlere girerler mi?\" dersen, derim ki:"], [3184.7, "Evet. Ebû Sa'lebe el-Huşenî —Allah ondan razı olsun— hadisinde şöyle geçer:"], [3188.7, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [3191.2, "\"Cinler üç sınıftır: Bir sınıfın kanatları vardır, havada uçarlar;"], [3194.0, "bir sınıf yılanlardır; bir sınıf da konaklar ve göçerler\" —mesela bedeviler gibi—."], [3201.9, "Bunu et-Taberânî rivayet etmiştir; ravileri güvenilir kabul edilmiştir."]]}, {"reader": false, "ar": [[3207.0, "قال شيخُ الإسلام ابنُ تيميّة رحمه الله:"], [3210.0, "«الجنُّ يتصوّرون في صور الإبل والبقر والغنم والخيل والبغال والحمير، وفي صور بني آدم، وقد أتى الشيطانُ قريشًا في صورة شيخٍ نجديٍّ لمّا اجتمعوا بدار الندوة: هل يقتلوا الرسولَ صلى الله عليه وسلم، أو يحبسوه، أو يُخرجوه»،"], [3232.0, "كما قال الله عز وجل:"], [3234.4, "<span class=\"ayah\">﴿وَإِذْ يَمْكُرُ بِكَ الَّذِينَ كَفَرُوا لِيُثْبِتُوكَ أَوْ يَقْتُلُوكَ أَوْ يُخْرِجُوكَ وَيَمْكُرُونَ وَيَمْكُرُ اللَّهُ وَاللَّهُ خَيْرُ الْمَاكِرِينَ﴾<\/span> <span class=\"ref\">[الأنفال: ٣٠]<\/span>."], [3242.0, "وثَمّةَ آثارٌ كثيرةٌ تُبيّن تمثّلَ الجنّ ببني آدم،"], [3246.0, "وهي تدلّ على قدرة الجنّ على أن تتشكّل بصورٍ مختلفة."]], "tr": [[3207.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [3210.0, "\"Cinler deve, sığır, koyun, at, katır ve eşek suretlerine ve Âdemoğullarının suretlerine girerler."], [3217.5, "Şeytan, Kureyş Dâru'n-Nedve'de Resûl sallallâhu aleyhi ve sellem'i öldürmek mi, hapsetmek mi yoksa sürgün etmek mi diye toplandıklarında onlara Necidli bir ihtiyar suretinde gelmişti.\" Nitekim Allah Azze ve Celle şöyle buyurur:"], [3231.5, "<span class=\"ayah\">﴿Hani kâfirler seni tutup bağlamak veya öldürmek ya da (yurdundan) çıkarmak için sana tuzak kuruyorlardı. Onlar tuzak kurarken Allah da tuzak kuruyordu. Allah, tuzak kuranların en hayırlısıdır﴾<\/span> [Enfâl 30]."], [3243.5, "Cinlerin Âdemoğulları suretine girdiğini açıklayan pek çok eser (rivayet) vardır;"], [3247.5, "bunlar cinlerin farklı suretlere girme kudretine delalet eder."]]}]}, {"ts": "54:11", "title": "6. Külliye (devam): Yayılma vakitleri ve insanların onları görmesi", "paras": [{"reader": false, "ar": [[3251.0, "ومنها أيضًا: إن قلتَ:"], [3253.3, "وما وقتُ انتشارهم؟ فأقول:"], [3255.7, "بيّنه النبيُّ صلى الله عليه وسلم في حديث جابر،"], [3262.0, "أنّ النبيّ صلى الله عليه وسلم قال:"], [3266.0, "«إذا كان جُنْحُ الليل ـ أو أمسيتم ـ فكُفّوا صبيانَكم، فإنّ الشيطان ينتشر حينئذٍ، فإذا ذهب ساعةٌ من الليل فخلّوهم، وأغلقوا الأبوابَ واذكروا اسمَ الله، فإنّ الشيطان لا يفتح بابًا مغلقًا، وأَوكوا قِرَبَكم واذكروا اسمَ الله، وخمّروا آنيتَكم واذكروا اسمَ الله ولو أن تَعرُضوا عليها شيئًا، وأطفئوا مصابيحَكم»، الحديثَ بتمامه."]], "tr": [[3251.0, "Bunlardan biri de şudur: Eğer \"Onların yayılma vakti nedir?\" dersen, derim ki:"], [3256.4, "Bunu Peygamber sallallâhu aleyhi ve sellem Câbir hadisinde açıklamıştır."], [3262.0, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [3265.4, "\"Gecenin karanlığı bastığında —veya akşama girdiğinizde— çocuklarınızı (dışarı çıkmaktan) alıkoyun;"], [3269.5, "çünkü şeytan o vakit yayılır."], [3272.2, "Geceden bir saat geçince onları serbest bırakın."], [3275.7, "Kapıları kapatın ve Allah'ın ismini anın;"], [3278.5, "çünkü şeytan kapalı bir kapıyı açmaz."], [3280.8, "Kırbalarınızın ağzını bağlayın ve Allah'ın ismini anın;"], [3283.5, "kaplarınızın üzerini örtün ve Allah'ın ismini anın, üzerine enlemesine bir şey koymakla da olsa. Kandillerinizi söndürün.\" Hadisin tamamı."]]}, {"reader": false, "ar": [[3293.0, "فإن قلتَ: وما الحكمةُ من انتشارهم في هذا الوقت بخصوصه؟"], [3296.0, "فأقول: إنّ حركتهم في الليل أمكنُ منها لهم في النهار؛"], [3304.0, "لأنّ الظلام أجمعُ للقوى الشيطانيّة من غيره،"], [3308.2, "وكذلك كلُّ سواد؛ ولذلك قال النبيّ صلى الله عليه وسلم:"], [3313.2, "«فإنّ الكلبَ الأسودَ شيطان»."]], "tr": [[3293.0, "Eğer \"Özellikle bu vakitte yayılmalarının hikmeti nedir?\" dersen, derim ki:"], [3295.7, "Gecedeki hareketleri onlar için gündüzdeki hareketlerinden daha kolaydır;"], [3300.2, "çünkü karanlık şeytanî güçleri başka şeylerden daha çok toplar;"], [3307.0, "her siyahlık da böyledir. Bu yüzden Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur: \"Çünkü siyah köpek şeytandır.\""]]}, {"reader": false, "ar": [[3315.0, "فإن قلتَ ـ ولعلّها المسألةُ الأخيرة ـ:"], [3317.8, "هل يمكن للإنس رؤيتُهم؟"], [3320.0, "هل يمكن للإنس رؤيتُهم؟"], [3323.0, "فأقول: الأصلُ أنه لا يستطيع رؤيتَهم على أصل خلقتهم التي خلقهم الله عز وجل عليها؛"], [3331.0, "لقول الله عز وجل:"], [3332.5, "<span class=\"ayah\">﴿إِنَّهُ يَرَاكُمْ هُوَ وَقَبِيلُهُ مِنْ حَيْثُ لَا تَرَوْنَهُمْ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٧]<\/span>."], [3335.0, "لكنّ هذا قد يُستثنى منه بعضُ الناس،"], [3343.0, "فيُوجد من الإنس من قد يرى الجنَّ في بعض الأحوال."], [3347.0, "وقد ثبت أنّ النبيّ صلى الله عليه وسلم رأى الجنّ وكلّمهم وخاطبهم."]], "tr": [[3315.0, "Eğer —belki de son mesele budur— \"İnsanların onları görmesi mümkün müdür?"], [3320.0, "İnsanların onları görmesi mümkün müdür?\" dersen, derim ki:"], [3325.0, "Asıl olan, (insanın) onları Allah Azze ve Celle'nin onları üzerinde yarattığı asıl yaratılışlarıyla göremeyeceğidir."], [3331.0, "Allah Azze ve Celle'nin şu sözünden dolayı:"], [3333.2, "<span class=\"ayah\">﴿Çünkü o ve kabilesi, sizin onları göremeyeceğiniz yerden sizi görürler﴾<\/span> [A'râf 27]."], [3338.0, "Fakat bundan bazı insanlar istisna edilebilir;"], [3344.2, "insanlardan bazı hâllerde cinleri görebilen kimseler bulunur."], [3346.6, "Peygamber sallallâhu aleyhi ve sellem'in cinleri gördüğü, onlarla konuştuğu ve onlara hitap ettiği sabit olmuştur."]]}, {"reader": false, "ar": [[3353.0, "بل ثبت عن أبي سعيدٍ الخدريّ رضي الله عنه:"], [3356.0, "«أنّ رسول الله صلى الله عليه وسلم قام فصلّى صلاةَ الصبح ونحن خلفَه، فقرأ فالتبست عليه القراءة، فلمّا فرغ من صلاته قال: لو رأيتموني وإبليسَ، فأهويتُ بيدي، فما زلتُ أخنقه حتى وجدتُ بردَ لعابه بين إصبعيّ هاتين: الإبهامِ والتي تليها، ولولا دعوةُ أخي سليمان» ـ وهذا الشاهد ـ «لأصبح موثَقًا يلعب به ولدانُ أهل المدينة»."]], "tr": [[3353.0, "Hatta Ebû Saîd el-Hudrî'den —Allah ondan razı olsun— şu sabit olmuştur:"], [3356.0, "\"Resûlullah sallallâhu aleyhi ve sellem kalkıp sabah namazını kıldırdı, biz de arkasındaydık."], [3359.6, "Okudu, kıraat ona karıştı. Namazını bitirince şöyle buyurdu:"], [3364.0, "Keşke beni ve İblis'i görseydiniz!"], [3365.9, "Elimi uzattım ve onu boğmaya devam ettim;"], [3368.8, "öyle ki salyasının serinliğini şu iki parmağımın —baş parmak ile yanındakinin— arasında hissettim."], [3375.3, "Kardeşim Süleyman'ın duası olmasaydı\" —delil yeri burasıdır— \"Medine halkının çocuklarının onunla oynadığı bağlı bir hâlde sabahlardı.\""]]}, {"reader": false, "ar": [[3386.0, "وكذلك ثبت في صحيح مسلمٍ من حديث أبي الدرداء رضي الله عنه قال:"], [3390.4, "«قام النبيّ صلى الله عليه وسلم يصلّي، فسمعناه يقول: أعوذ بالله منك، ثلاثًا، ثمّ قال: ألعنك بلعنة الله التامّة، ثلاثًا، ثمّ بسط يدَه كأنه يتناول شيئًا. فقلنا: يا رسول الله، لقد سمعناك تقول في الصلاة شيئًا لم نسمعك تقوله من قبل. فقال: إنّ عدوَّ الله إبليسَ جاء بشهابٍ من نارٍ ليُحرِق به وجهي، فقلتُ: أعوذ بالله منك، ثلاثًا، فلم يستأخر، فقلتُ: ألعنك بلعنة الله التامّة، ثلاثًا، فلم يستأخر، فأردتُ أخذَه، فلولا دعوةُ أخي سليمان لأصبح موثَقًا يلعب به ولدانُ أهل المدينة»."]], "tr": [[3386.0, "Aynı şekilde Sahîh-i Müslim'de Ebü'd-Derdâ —Allah ondan razı olsun— hadisinde şöyle sabit olmuştur:"], [3389.7, "\"Peygamber sallallâhu aleyhi ve sellem kalkıp namaz kılıyordu."], [3392.1, "Onun üç kez 'Senden Allah'a sığınırım' dediğini işittik."], [3394.6, "Sonra üç kez 'Seni Allah'ın tam lânetiyle lânetliyorum' dedi."], [3398.4, "Sonra bir şey tutacakmış gibi elini uzattı."], [3400.7, "Dedik ki: Ey Allah'ın Resûlü!"], [3402.6, "Namazda senin daha önce söylediğini hiç işitmediğimiz bir şey söylediğini işittik."], [3406.2, "Buyurdu ki: Allah'ın düşmanı İblis, yüzümü yakmak için ateşten bir alev getirdi."], [3411.0, "Üç kez 'Senden Allah'a sığınırım' dedim, geri çekilmedi."], [3413.9, "Üç kez 'Seni Allah'ın tam lânetiyle lânetliyorum' dedim, yine geri çekilmedi."], [3418.0, "Sonra onu yakalamak istedim. Kardeşim Süleyman'ın duası olmasaydı, Medine halkının çocuklarının onunla oynadığı bağlı bir hâlde sabahlardı.\""]]}, {"reader": false, "ar": [[3425.0, "فإذًا قد يتشكّل الإنسانُ <span class=\"q\">؟ 57:05<\/span> على صورةٍ أخرى،"], [3428.0, "فيراه من شاء الله عز وجل أن يراه من الإنس."], [3434.0, "قال الإمامُ ابنُ رجبٍ رحمه الله:"], [3436.0, "«وفي هذا الحديث دليلٌ على إمكان ربط الشيطان وحبسه وإيثاقه، وعلى جواز ربطه في المسجد كما يُربط الأسيرُ فيه، وعلى جواز رؤية غير الأنبياء للجنّ والشياطين، وتلاعب الصبيان بهم». انتهى كلامه."]], "tr": [[3425.0, "Öyleyse insan (yani cin; <span class=\"q\">؟<\/span>) başka bir surete girebilir ve insanlardan Allah Azze ve Celle'nin dilediği kimse onu görür."], [3433.4, "İmam İbn Receb —Allah ona rahmet etsin— şöyle demiştir:"], [3436.6, "\"Bu hadiste şeytanı bağlamanın, hapsetmenin ve sıkıca bağlamanın mümkün olduğuna;"], [3441.4, "esirin mescitte bağlandığı gibi onu mescitte bağlamanın caiz olduğuna;"], [3445.1, "peygamberlerden başkalarının cinleri ve şeytanları görmesinin ve çocukların onlarla oynamasının caiz olduğuna delil vardır.\" Sözü bitti."]]}, {"reader": false, "ar": [[3455.0, "وقد سُئل ابنُ تيميّة رحمه الله عن قوله تعالى:"], [3461.0, "<span class=\"ayah\">﴿إِنَّهُ يَرَاكُمْ هُوَ وَقَبِيلُهُ مِنْ حَيْثُ لَا تَرَوْنَهُمْ﴾<\/span> <span class=\"ref\">[الأعراف: ٢٧]<\/span>،"], [3465.0, "الآيةَ الكريمة: هل ذلك عامٌّ لا يراهم أحد،"], [3468.0, "أم يراهم بعضُ الناس دون بعض؟"], [3470.0, "فأجاب رحمه الله: «الذي في القرآن أنهم يرون الإنسَ من حيث لا يراهم الإنس، وهذا حقٌّ يقتضي أنهم يرون الإنسَ في حالٍ لا يراهم الإنسُ فيها، وليس فيه أنهم لا يراهم أحدٌ من الإنس بحال، بل قد يراهم الصالحون وغيرُ الصالحين أيضًا، لكن لا يرونهم في كلّ حال»."], [3493.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[3455.0, "İbn Teymiyye'ye —Allah ona rahmet etsin— Allah Teâlâ'nın <span class=\"ayah\">﴿Çünkü o ve kabilesi, sizin onları göremeyeceğiniz yerden sizi görürler﴾<\/span> [A'râf 27] kerim ayeti hakkında, bunun hiç kimsenin onları göremeyeceği şeklinde genel mi olduğu, yoksa insanların bir kısmının onları görüp bir kısmının göremeyeceği mi olduğu soruldu."], [3472.5, "O da —Allah ona rahmet etsin— şöyle cevap verdi:"], [3476.0, "\"Kur'an'da olan, onların insanları, insanların kendilerini göremedikleri yerden gördükleridir."], [3479.5, "Bu haktır ve onların insanları, insanların kendilerini göremediği bir hâlde gördüklerini gerektirir."], [3483.7, "Onda, insanlardan hiç kimsenin onları hiçbir hâlde göremeyeceği yoktur."], [3487.9, "Bilakis onları sâlihler de, sâlih olmayanlar da görebilir;"], [3490.7, "fakat onları her hâlde göremezler.\" Sözü bitti, Allah ona rahmet etsin."]]}]}, {"ts": "58:17", "title": "6. Külliye (sonu): Cinlerin binekleri · Külliyenin özeti ve kapanış", "paras": [{"reader": false, "ar": [[3497.0, "فإن قلتَ: وهل للجنّ دوابّ؟"], [3499.0, "الجوابُ: نعم، كما قال النبيّ صلى الله عليه وسلم في حديث ابن مسعودٍ السابق:"], [3504.0, "«وكلُّ بعرةٍ علفٌ لدوابّكم»."], [3507.0, "والخلاصةُ من هذه الكلّيّة:"], [3509.0, "أنه لا يجوز أن نُثبت لهذا العالم شيئًا من الأمور إلا وعليه دليل،"], [3514.0, "ولا ننفي عن هذا العالم شيئًا من الأمور إلا وعلى نفيه دليل."], [3518.0, "وما لم يرد الدليلُ بإثباته ولا نفيه فلا حقَّ لأحدٍ أن يُثبته أو ينفيه؛"], [3524.0, "لأنه عالمٌ غيبيّ، والأصلُ في العوالم الغيبيّة أنها توقيفيّة."], [3528.5, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[3497.0, "Eğer \"Cinlerin binek hayvanları var mıdır?\" dersen, cevap:"], [3499.5, "Evet. Nitekim Peygamber sallallâhu aleyhi ve sellem daha önce geçen İbn Mes'ûd hadisinde şöyle buyurmuştur:"], [3504.0, "\"Her tezek de hayvanlarınız için yemdir.\" Bu külliyenin özeti şudur:"], [3509.4, "Bu âleme, üzerinde delil bulunmadıkça hiçbir şey isbat etmemiz caiz değildir;"], [3513.0, "bu âlemden de, nefyine dair delil bulunmadıkça hiçbir şeyi nefyetmeyiz."], [3516.2, "İsbatına da nefyine de delil gelmeyen şeyi ise kimsenin isbat etmeye veya nefyetmeye hakkı yoktur;"], [3521.0, "çünkü o gaybî bir âlemdir ve gaybî âlemlerde asıl olan tevkîfî (nassa bağlı) olmalarıdır."], [3526.5, "Allah en yüce olan ve en iyi bilendir."], [3530.0, "Allah Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
