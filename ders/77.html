const D={"no": 77, "vid": "k7YEAQUmzww", "title_ar": "الدرس (٧٧) من شرح كليات العقيدة — كليات في حدود العقل، ومعارضة النص بالعقل، وخطر مذهب التفويض", "title_tr": "Şerhu Külliyyâti'l-Akîde — 77. Ders: Aklın Sınırları, Nassa Akılla Muâraza ve Tefvîz Mezhebinin Tehlikesi", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Aklın idrak alanına girmeyen şeye aklın girişi yoktur", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.8, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.5, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.7, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [9.4, "أما بعد: فلعلَّ هذا الدرس ـ إن شاء الله ـ يكون آخرَ درسٍ في باب الأسماء والصفات،"], [16.1, "وقد أخذنا فيه جُمَلًا طيبةً وصالحةً من الكلّيّات،"], [19.7, "ولله الحمد والمنّة. طيب،"], [21.5, "الكلية الأولى: <b>كلُّ ما ليس بداخلٍ تحت مُدرَكات العقل فلا مدخلَ له فيه.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.3, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [9.4, "Bundan sonra: Umarım bu ders, inşallah, isim ve sıfatlar babındaki son ders olur."], [14.7, "Bu babda külliyelerden güzel ve faydalı birçoğunu işledik;"], [18.3, "hamd ve minnet Allah'adır. Peki, 1."], [21.0, "külliye: Aklın idrak alanına (müdrekâtına) girmeyen her şey;"], [24.5, "aklın onda bir girişi (söz hakkı) yoktur. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[28.0, "أقول وبالله التوفيق: وهذا ممّا أجمع عليه أهلُ السنة والجماعة ـ رحم الله أمواتهم وثبّت أحياءهم ـ فإنّ ما أخبرت به الرسلُ من تفاصيل اليوم الآخر،"], [57.6, "وما أمرت به من تفاصيل الشرائع،"], [60.0, "لا يعلمه الناس بعقولهم."], [63.0, "كما أنّ ما أخبرت به الرسل من تفاصيل أسماء الله عز وجل وصفاته،"], [69.0, "لو لم تُخبرنا به الرسلُ والأدلّة لَما كان للعقل مدخلٌ في معرفته."], [75.0, "فلا يجوز للمسلم أبدًا أن يُقحِم عقله فيما لم يُخلق له."]], "tr": [[28.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'in —Allah ölülerine rahmet etsin, dirilerine sebat versin— icmâ ettiği şeylerdendir."], [54.8, "Çünkü resullerin âhiret gününün ayrıntılarına dair haber verdikleri ve şeriatların ayrıntılarına dair emrettikleri şeyleri insanlar akıllarıyla bilemezler."], [63.0, "Aynı şekilde resullerin Allah Azze ve Celle'nin isim ve sıfatlarının ayrıntılarına dair haber verdikleri şeyler de, eğer resuller ve deliller onu bize haber vermeseydi, onu bilmede aklın hiçbir girişi olmazdı."], [75.0, "Bu yüzden Müslüman'ın aklını, onun için yaratılmadığı bir şeye asla sokması caiz değildir."]]}, {"reader": false, "ar": [[80.0, "فإنّ الله عز وجل لمّا خلق العقل جعل له حدودًا وطاقات،"], [85.0, "لا يزال تفكيرُ العقل سليمًا ما دام داخلَ حدوده وطاقاته أو مُدرَكاته."], [92.0, "لكن متى ما أخرجه العبدُ عن هذه الطاقة،"], [95.4, "وأدخله فيما لا طاقةَ له فيه،"], [98.0, "فإنه لن يرجع إلا بالخيبة والخسارة والشُّبَه والشكوك والأوهام والخيالات."], [104.0, "ولذلك فإنّ من أعظم ضلال الناس في باب الغيبيات هو إقحامُ عقولهم،"], [113.2, "طلبًا لكيفيّتها أو استكشافًا لحقائقها."], [118.0, "فما سلِم في دينه من أقحم عقله فيما ليس له فيه مدخل."]], "tr": [[80.0, "Çünkü Allah Azze ve Celle aklı yarattığında ona sınırlar ve kapasiteler koydu."], [84.1, "Akıl, kendi sınırları ve kapasiteleri ya da idrak alanı içinde kaldığı sürece düşüncesi sağlıklı olmaya devam eder."], [92.0, "Fakat kul onu bu kapasitenin dışına çıkarır ve gücünün yetmediği bir şeye sokarsa, ancak hüsran, kayıp, şüpheler, tereddütler, vehimler ve hayallerle geri döner."], [104.0, "Bu yüzden insanların gaybî konular babındaki en büyük sapmalarından biri, bunların keyfiyetini talep ederek veya hakikatlerini keşfetmeye çalışarak akıllarını onlara sokmalarıdır."], [118.8, "Aklını, girişi olmayan bir şeye sokan kimse dininde selamette kalmamıştır."]]}, {"reader": false, "ar": [[123.0, "وإنما السلامةُ في العقائد هي أن تقف عقولُنا على حدود مُدرَكاتها فقط."], [131.0, "فما كان من الغيبيات ـ كالأسماء والصفات،"], [135.0, "وحقائق اليوم الآخر، وما أعدّه الله عز وجل في الجنة من النعيم أو في العذاب من الجحيم،"], [143.0, "وكنعيم القبر وعذابه وسؤاله،"], [145.8, "والبعث والنشور، وغيرها من الغيبيات ـ فإنّ طريق السلامة فيها ألّا تتقحّمها بعقلك."], [153.0, "وقد نصّ أهل العلم ـ رحمهم الله تعالى ـ على ذلك."]], "tr": [[123.0, "Akîdelerde selamet ancak akıllarımızın sadece kendi idrak alanının sınırlarında durmasıdır."], [129.0, "Gaybî olan şeyler —isim ve sıfatlar, âhiret gününün hakikatleri, Allah Azze ve Celle'nin cennette hazırladığı nimetler veya azapta (hazırladığı) cehennem, kabir nimeti, azabı ve sorgusu, ba's ve neşr (diriliş ve toplanma) ve diğer gaybî şeyler gibi— bunlarda selamet yolu, onlara aklınla dalmamandır."], [153.0, "Ehl-i ilim —Allah Teâlâ onlara rahmet etsin— bunu açıkça belirtmişlerdir."]]}, {"reader": false, "ar": [[158.0, "فهذا ابن تيمية ـ رحمه الله تعالى ـ يقول:"], [161.0, "«فما أخبرت به الرسلُ من تفاصيل اليوم الآخر، وما أمرت به من تفاصيل الشرائع، لا يعلمه الناس بعقولهم، كما أنّ ما أخبرت به الرسلُ من تفصيل أسماء الله وصفاته لا يعلمه الناس بعقولهم»."], [178.0, "انتهى كلامه. وما أجملَ قولَ الإمام الشاطبيّ ـ رحمه الله تعالى ـ:"], [184.0, "«إنّ الله جعل للعقول في إدراكها حدًّا تنتهي إليه لا تتعدّاه، ولم يجعل لها سبيلًا إلى الإدراك في كلّ مطلوب، ولو كانت كذلك لاستوت مع الباري تعالى في إدراك جميع ما كان وما يكون وما لا يكون». انتهى كلامه."]], "tr": [[158.0, "İşte İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle der:"], [161.0, "\"Resullerin âhiret gününün ayrıntılarına dair haber verdikleri ve şeriatların ayrıntılarına dair emrettikleri şeyleri insanlar akıllarıyla bilemezler;"], [167.5, "aynı şekilde resullerin Allah'ın isim ve sıfatlarının ayrıntısına dair haber verdikleri şeyleri de insanlar akıllarıyla bilemezler.\" Sözü burada bitti."], [178.0, "İmam Şâtıbî'nin —Allah Teâlâ ona rahmet etsin— şu sözü ne güzeldir:"], [184.0, "\"Allah akıllara, idraklerinde varıp dayandıkları ve aşamadıkları bir sınır koymuştur;"], [189.5, "onlara her istenen şeyi idrak etmeye bir yol vermemiştir."], [195.3, "Eğer öyle olsaydı, olmuş, olacak ve olmayacak her şeyi idrak etmede Bârî Teâlâ ile eşit olurlardı.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[207.0, "وبناءً على ذلك فيدخل تحت هذه الكلية ثلاثةُ أمورٍ أساسية:"], [213.0, "الأمر الأول: ما كان غيبيًّا،"], [215.8, "فإنه لا يجوز أن نتخوّض فيه بعقولنا."], [222.0, "الأمر الثاني: تفاصيل التشريع في التحليل والتحريم،"], [226.7, "فلا يجوز أن نتخوّض فيه بعقولنا؛"], [232.0, "فالواجب ما أوجبه الله بالدليل،"], [234.5, "والمحرَّم ما حرّمه الله بالدليل،"], [237.0, "وهكذا نقوله في سائر الأحكام الشرعية."], [242.0, "فلا يجوز أن نجعل مناطَ إثبات شيءٍ من الأحكام الشرعية هو العقل،"], [248.0, "وإنما مناطُ إثبات الأحكام الشرعية هو النص."]], "tr": [[207.0, "Buna göre bu külliyenin altına üç temel husus girer:"], [213.0, "Birinci husus: Gaybî olan şey;"], [216.5, "ona akıllarımızla dalmamız caiz değildir."], [222.0, "İkinci husus: Helal kılma ve haram kılmadaki teşrî ayrıntıları;"], [226.7, "onlara da akıllarımızla dalmamız caiz değildir."], [232.0, "Vâcip, Allah'ın delille vâcip kıldığı şeydir;"], [234.5, "haram, Allah'ın delille haram kıldığı şeydir;"], [237.0, "diğer bütün şer'î hükümlerde de böyle deriz."], [242.0, "Şer'î hükümlerden herhangi birini isbat etmenin dayanağını (menâtını) akıl yapmamız caiz değildir;"], [248.0, "şer'î hükümleri isbat etmenin dayanağı ancak nastır."]]}, {"reader": false, "ar": [[252.0, "ثم قد يكون للعقل بعد ذلك في النصّ مدخلٌ وفهمٌ في علّته وحكمته ومقاصده ومآلاته ونحو ذلك."], [262.0, "ولذلك فقد أجمع أهل العلم ـ رحمهم الله تعالى ـ بأنّ العقول لا تستقلّ بتفاصيل التشريع،"], [270.0, "لا تستقلّ بتفاصيل التشريع."], [273.0, "هذا الأمر الثاني. الأمر الثالث:"], [275.3, "لا يجوز أن نتخوّض بعقولنا فيما أخفاه الشارعُ عنّا من حِكَم بعض التشريعات،"], [286.0, "ككون الصلاة أربعَ ركعات،"], [288.7, "أو ثلاثَ ركعات، أو ركعتين؛"], [292.0, "فإنّ ذلك من الحِكَم التي أخفاها الله عز وجل عن عقولنا،"], [296.0, "فلا يجوز أن نتخوّض فيها بعقولنا."], [299.0, "وكون الله عز وجل يختار لصلاة الفجر هذا الوقت،"]], "tr": [[252.0, "Sonra bundan sonra aklın, nassın illetinde, hikmetinde, maksatlarında, varacağı sonuçlarda ve benzerlerinde bir girişi ve anlayışı olabilir."], [262.0, "Bu yüzden ehl-i ilim —Allah Teâlâ onlara rahmet etsin— akılların teşrî ayrıntılarında müstakil olamayacağına icmâ etmiştir;"], [271.5, "akıllar teşrî ayrıntılarında müstakil olamaz."], [274.0, "Bu ikinci husustur. Üçüncü husus:"], [276.7, "Şâri'in bazı teşrîlerin hikmetlerinden bizden gizlediği şeylere akıllarımızla dalmamız caiz değildir;"], [283.3, "namazın dört rekât, üç rekât veya iki rekât olması gibi."], [292.0, "Çünkü bu, Allah Azze ve Celle'nin akıllarımızdan gizlediği hikmetlerdendir;"], [295.6, "ona akıllarımızla dalmamız caiz değildir."], [299.0, "Allah Azze ve Celle'nin sabah namazı için bu vakti,"]]}]}, {"ts": "05:00", "title": "1. Külliye (devam): Hikmeti gizlenen hükümler; Muâze hadisi", "paras": [{"reader": false, "ar": [[303.0, "ولصلاة الظهر هذا الوقت،"], [305.0, "ولصلاة العصر أو المغرب أو العشاء هذا الوقت،"], [310.0, "فكلُّ ذلك ممّا لا يجوز أن نتخوّض فيه بعقولنا،"], [314.0, "مع كمال إيماننا بأنّ له حكمة؛"], [318.0, "لأنّ الذي شرعه هو الحكيمُ اسمًا وذو الحكمة صفةً،"], [322.0, "ولكنّ عقولنا لا تُدرك هذه الحكمة،"], [326.0, "ويكفينا أنه قد صحّ به النص."]], "tr": [[303.0, "öğle namazı için bu vakti, ikindi, akşam veya yatsı namazı için bu vakti seçmesi;"], [310.0, "bütün bunlar, akıllarımızla dalmamızın caiz olmadığı şeylerdendir."], [312.7, "Bununla birlikte bunun bir hikmeti olduğuna tam olarak iman ederiz;"], [318.0, "çünkü onu teşrî eden, isim olarak el-Hakîm, sıfat olarak hikmet sahibidir."], [322.0, "Fakat akıllarımız bu hikmeti idrak edemez;"], [325.3, "nassın bununla sahih olarak gelmiş olması bize yeter."]]}, {"reader": false, "ar": [[329.0, "كما في الصحيحين من حديث معاذةَ العدويّة ـ رضي الله عنها ـ قالت:"], [334.5, "سألتُ عائشة ـ رضي الله عنها ـ:"], [337.0, "ما بالُ الحائض تقضي الصوم ولا تقضي الصلاة؟"], [341.0, "فقالت: «أحروريّةٌ أنتِ؟» قلت:"], [343.6, "لستُ بحروريّة، ولكنّي أسأل."], [346.0, "فقالت: «كان يُصيبنا ذلك على عهد النبيّ صلى الله عليه وسلم، فنُؤمَر بقضاء الصوم، ولا نُؤمَر بقضاء الصلاة»."]], "tr": [[329.0, "Sahîhayn'de Muâze el-Adeviyye'nin —Allah ondan razı olsun— hadisinde olduğu gibi;"], [333.0, "dedi ki: Âişe'ye —Allah ondan razı olsun— sordum:"], [337.0, "\"Hayızlı kadına ne oluyor ki orucu kaza ediyor da namazı kaza etmiyor?\" Dedi ki:"], [343.6, "\"Sen Harûrî (Hâricî) misin?\" Dedim ki:"], [346.0, "\"Harûrî değilim, sadece soruyorum.\" Dedi ki:"], [347.8, "\"Peygamber sallallâhu aleyhi ve sellem zamanında bize bu (hâl) gelirdi;"], [351.6, "orucu kaza etmekle emrolunurduk, namazı kaza etmekle emrolunmazdık.\""]]}, {"reader": false, "ar": [[355.0, "فإذًا: ما كان غيبيًّا فيكون توقيفيًّا على النص،"], [358.0, "وما كان تشريعًا فيكون توقيفيًّا على النص،"], [361.0, "وما أخفى الله علّته أو حكمته عن عقولنا فيكون توقيفيًّا على النص."], [366.0, "فهذه الأبواب الثلاثة لا يجوز لك ـ أيها المسلم ـ أن تتخوّض فيها بعقلك الضعيف."], [374.0, "فإذًا كلُّ ما ليس للعقل… والخلاصةُ من ذلك:"], [379.0, "أنّ كلَّ ما ليس للعقل فيه مدخل فلا يجوز أن نتخوّض بعقولنا فيه،"], [385.0, "وهذا طريق السلامة لمن أراد الله له العافية في الدنيا والآخرة. والله أعلم."]], "tr": [[355.0, "O hâlde: Gaybî olan şey nassa bağlıdır (tevkîfîdir);"], [358.4, "teşrî olan şey nassa bağlıdır;"], [361.0, "Allah'ın illetini veya hikmetini akıllarımızdan gizlediği şey de nassa bağlıdır."], [366.0, "Ey Müslüman! Bu üç baba zayıf aklınla dalman caiz değildir."], [371.5, "O hâlde aklın … olmadığı her şey… Bundan çıkan özet şudur:"], [379.0, "Aklın girişi olmayan her şeye akıllarımızla dalmamız caiz değildir."], [383.0, "Allah'ın dünyada ve âhirette âfiyet dilediği kimse için selamet yolu budur. Allah en iyisini bilir."]]}]}, {"ts": "06:31", "title": "2. Külliye: Nassa karşı ileri sürülen her akıl hevâdır", "paras": [{"reader": false, "ar": [[391.0, "الكلية الثانية ـ كلامي واضح ولا؟"], [397.0, "ـ: <b>كلُّ عقلٍ عُورِض به النصُّ فهوًى.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ عقلٍ عُورِض به النصُّ فهوًى.<\/b>"]], "tr": [[391.0, "<b>2. külliye<\/b> —sözüm açık mı, değil mi?—:"], [397.0, "<b>Nassa karşı muâraza için ileri sürülen her akıl hevâdır.<\/b> (Tekrar ediyor.) <b>Nassa karşı muâraza için ileri sürülen her akıl hevâdır.<\/b>"]]}, {"reader": false, "ar": [[415.0, "ونعني بقولنا «هوًى»: أي أنه من جملة الأهواء."], [423.0, "ولذلك فقد أجمع أهل السنة والجماعة ـ رحم الله أمواتهم وثبّت أحياءهم ـ على أنّ أهل البدع يُسمَّون بأهل الأهواء،"], [433.0, "مع أنهم يزعمون أنّ لهم معقولات،"], [436.0, "وأنّ لهم نتائجَ نظر،"], [438.0, "وأنهم أصحاب العلم والحكمة،"], [441.0, "إلا أنّ معقولاتهم لمّا عارضت النصوص الشرعية فإنها عبارةٌ عن أهواء."]], "tr": [[415.0, "\"Hevâdır\" sözümüzle, onun hevâlar cümlesinden olduğunu kastediyoruz."], [423.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat —Allah ölülerine rahmet etsin, dirilerine sebat versin— bid'at ehlinin \"hevâ ehli\" diye adlandırıldığına icmâ etmiştir."], [432.3, "Oysa onlar kendilerinin akliyyâtı (akli delilleri) olduğunu, nazar (düşünme) sonuçları olduğunu ve ilim ve hikmet sahibi olduklarını iddia ederler."], [442.4, "Ancak akliyyâtları şer'î naslara muâraza edince, onlar hevâlardan ibaret kalır."]]}, {"reader": false, "ar": [[449.0, "وإلّا فإنّ المتقرِّر بالإجماع أنّ العقل الصريح السليم لا يمكن أن يتناقض مع النقل الصحيح في سنده."], [461.0, "فمتى ما رأيتَ عقلًا يعارض نصًّا فاعلم أنه هوًى،"], [466.0, "ولكن أُخرِج الهوى في صورة عقل،"], [469.0, "وإلّا ففي الحقيقة أنه هوًى."], [473.0, "وكلُّ دليلٍ يحذِّر من الأهواء فإنه ضمنًا يحذِّر من معارضة النص بالعقل،"], [483.0, "لأنّ معارضة النص بالعقل هي من جملة ما يدخل تحت هذا العموم."]], "tr": [[449.0, "Yoksa icmâ ile sabit olan şudur:"], [453.4, "Sarih ve selim akıl, senedi sahih olan nakil ile asla çelişemez."], [461.0, "Bir aklın bir nassa muâraza ettiğini gördüğün zaman bil ki o hevâdır;"], [466.5, "fakat hevâ akıl kılığında ortaya çıkarılmıştır, yoksa hakikatte o hevâdır."], [473.0, "Hevâlardan sakındıran her delil, zımnen nassa akılla muâraza etmekten de sakındırır;"], [483.0, "çünkü nassa akılla muâraza, bu umumun altına giren şeyler cümlesindendir."]]}, {"reader": false, "ar": [[489.0, "كما قال الله عز وجل:"], [491.0, "<span class=\"ayah\">﴿فَإِن لَّمْ يَسْتَجِيبُوا لَكَ فَاعْلَمْ أَنَّمَا يَتَّبِعُونَ أَهْوَاءَهُمْ﴾<\/span> <span class=\"ref\">[القصص: ٥٠]<\/span>."], [500.0, "فكلُّ من لم يستجب لرسول الله صلى الله عليه وسلم ـ سواءٌ في أصل الإيمان،"], [507.0, "أو فيما يُكمِّله وجوبًا أو استحبابًا ـ فإنّ سبب عدم الاستجابة هو الهوى،"], [514.0, "وإن أُخرِج في صورة معقولات."]], "tr": [[489.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [491.0, "<span class=\"ayah\">﴿Eğer sana cevap vermezlerse, bil ki onlar ancak hevâlarına uymaktadırlar﴾<\/span> [Kasas 50]."], [500.0, "Resûlullah sallallâhu aleyhi ve sellem'e —ister imanın aslında, ister onu vâcip veya müstehap olarak tamamlayan şeylerde— icabet etmeyen herkesin icabet etmemesinin sebebi hevâdır;"], [513.3, "akliyyât kılığında ortaya çıkarılsa bile."]]}, {"reader": false, "ar": [[520.0, "وبناءً على ذلك: فجميع القواعد الفلسفية المنطقية،"], [526.0, "المناقِضة للمعقول والمصادِمة للمنقول،"], [529.0, "كلُّها عن بَكرة أبيها تُسمّى أهواءً،"], [533.4, "وليست معقولات. فالجهمية لمّا عارضوا النصّ بالعقول،"], [539.0, "فكانت تلك المعارضةُ عن هوًى،"], [543.0, "وكذلك المعتزلة، وكذلك الأشاعرة والماتريدية والكُلّابية،"], [548.0, "وغيرهم من طوائف أهل الضلال؛"], [550.0, "إنما أهواؤهم هي التي عارضت النصوص،"], [555.0, "ولكنهم يُخرِجون هذا في صورة معقولات:"]], "tr": [[520.0, "Buna göre: Akla aykırı ve nakille çatışan bütün felsefî ve mantıkî kaideler, istisnasız hepsi hevâlar diye adlandırılır, akliyyât değildir."], [535.0, "Cehmiyye nassa akıllarla muâraza ettiğinde, bu muâraza hevâdan kaynaklanıyordu."], [541.4, "Mu'tezile de böyledir; Eş'arîler, Mâtürîdîler, Küllâbiyye ve diğer sapkınlık ehli fırkalar da böyledir."], [550.0, "Naslara muâraza eden ancak onların hevâlarıdır;"], [555.0, "fakat bunu akliyyât kılığında ortaya çıkarırlar:"]]}, {"reader": false, "ar": [[559.0, "«أنّ العقل لا يمكن أن يصدِّق ذلك»،"], [564.0, "«أنّ العقل يُنزِّه الله عن ذلك»،"], [568.0, "«أنّ العقل يمتنع من أن يصف اللهَ عز وجل بذلك»،"], [574.0, "ونحو هذا الكلام الذي نسمعه دائمًا في كتبهم،"], [578.0, "أو نسمعه من كلامهم،"], [579.5, "أو نقرؤه في كتبهم."], [581.0, "وفي الحقيقة أنها أهواء."], [584.0, "وقال الله عز وجل:"], [586.0, "<span class=\"ayah\">﴿فَاحْكُم بَيْنَ النَّاسِ بِالْحَقِّ﴾<\/span>،"], [588.0, "ثم جاء بالمَحمَل <span class=\"q\">؟ 09:48<\/span> الثاني،"], [591.2, "وهو: <span class=\"ayah\">﴿وَلَا تَتَّبِعِ الْهَوَىٰ﴾<\/span> <span class=\"ref\">[ص: ٢٦]<\/span>."], [594.0, "فإذًا كلُّ من ترك الحقَّ فإنما هو متّبعٌ لهواه،"], [599.0, "وليس هناك قسمةٌ ثالثة."]], "tr": [[559.0, "\"Akıl bunu tasdik edemez\", \"Akıl Allah'ı bundan tenzih eder\", \"Akıl Allah Azze ve Celle'yi bununla vasıflandırmaktan kaçınır\" ve kitaplarında daima işittiğimiz, ya da sözlerinden işittiğimiz veya kitaplarında okuduğumuz buna benzer sözler."], [578.8, "Hakikatte bunlar hevâlardır. Allah Azze ve Celle şöyle buyurmuştur:"], [584.0, "<span class=\"ayah\">﴿İnsanlar arasında hak ile hükmet﴾<\/span>;"], [586.0, "sonra ikinci şıkkı <span class=\"q\">؟<\/span> getirdi, o da şudur:"], [592.0, "<span class=\"ayah\">﴿Hevâya uyma﴾<\/span> [Sâd 26]. O hâlde hakkı terk eden herkes ancak hevâsına uymaktadır; üçüncü bir kısım yoktur."]]}]}, {"ts": "10:01", "title": "2. Külliye (devam): Kur'an hak ile hevâyı daima karşı karşıya getirir", "paras": [{"reader": false, "ar": [[601.0, "وقال الله عز وجل:"], [603.0, "<span class=\"ayah\">﴿أَفَكُلَّمَا جَاءَكُمْ رَسُولٌ بِمَا لَا تَهْوَىٰ أَنفُسُكُمُ اسْتَكْبَرْتُمْ فَفَرِيقًا كَذَّبْتُمْ وَفَرِيقًا تَقْتُلُونَ﴾<\/span> <span class=\"ref\">[البقرة: ٨٧]<\/span>."], [611.0, "وقال الله عز وجل:"], [613.0, "<span class=\"ayah\">﴿وَلَئِنِ اتَّبَعْتَ أَهْوَاءَهُم بَعْدَ الَّذِي جَاءَكَ مِنَ الْعِلْمِ مَا لَكَ مِنَ اللَّهِ مِن وَلِيٍّ وَلَا نَصِيرٍ﴾<\/span> <span class=\"ref\">[البقرة: ١٢٠]<\/span>."], [620.0, "قال الله: <span class=\"ayah\">﴿وَلَا تَتَّبِعْ أَهْوَاءَهُمْ عَمَّا جَاءَكَ مِنَ الْحَقِّ﴾<\/span> <span class=\"ref\">[المائدة: ٤٨]<\/span>."], [624.0, "فدائمًا القرآن يقرن بين الحقّ والهوى؛"], [627.0, "فمن كان مع الأهواء فإنه مُجانِبٌ للحق،"], [632.0, "ومن كان ثابتًا على الحق فإنه مُجانِبٌ للهوى،"], [637.0, "ولا يمكن أن يجتمع الحقُّ والهوى في قلبٍ ولا عقل."]], "tr": [[601.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [603.0, "<span class=\"ayah\">﴿Size ne zaman bir resul nefislerinizin hoşlanmadığı bir şey getirdiyse büyüklük taslamadınız mı? Bir kısmını yalanladınız, bir kısmını da öldürüyorsunuz﴾<\/span> [Bakara 87]."], [611.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [613.0, "<span class=\"ayah\">﴿Sana gelen ilimden sonra eğer onların hevâlarına uyarsan, Allah'tan sana ne bir dost ne de bir yardımcı vardır﴾<\/span> [Bakara 120]."], [620.0, "Allah buyurdu: <span class=\"ayah\">﴿Sana gelen haktan (ayrılıp) onların hevâlarına uyma﴾<\/span> [Mâide 48]."], [624.0, "Kur'an daima hak ile hevâyı birlikte (karşılıklı) anar:"], [627.0, "Hevâlarla beraber olan haktan uzaktır;"], [630.6, "hak üzere sebat eden de hevâdan uzaktır."], [635.1, "Hak ile hevânın bir kalpte veya bir akılda bir araya gelmesi mümkün değildir."]]}, {"reader": false, "ar": [[641.0, "وقال الله عز وجل:"], [644.0, "<span class=\"ayah\">﴿قُل لَّا أَتَّبِعُ أَهْوَاءَكُمْ قَدْ ضَلَلْتُ إِذًا وَمَا أَنَا مِنَ الْمُهْتَدِينَ﴾<\/span> <span class=\"ref\">[الأنعام: ٥٦]<\/span>."], [649.0, "وقال الله عز وجل:"], [651.0, "<span class=\"ayah\">﴿وَإِنَّ كَثِيرًا لَّيُضِلُّونَ بِأَهْوَائِهِم﴾<\/span> <span class=\"ref\">[الأنعام: ١١٩]<\/span>؛"], [656.0, "فقد ضلّوا هم في أنفسهم بسبب أهوائهم،"], [660.0, "وأضلّوا غيرَهم بسبب أهوائهم."], [663.0, "وقال الله عز وجل في سورة الأعراف:"], [666.0, "<span class=\"ayah\">﴿وَلَوْ شِئْنَا لَرَفَعْنَاهُ بِهَا﴾<\/span> ـ أي بآياتنا،"], [670.3, "بالحق ـ <span class=\"ayah\">﴿وَلَٰكِنَّهُ أَخْلَدَ إِلَى الْأَرْضِ وَاتَّبَعَ هَوَاهُ﴾<\/span> <span class=\"ref\">[الأعراف: ١٧٦]<\/span>."]], "tr": [[641.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [644.0, "<span class=\"ayah\">﴿De ki: Ben sizin hevâlarınıza uymam; aksi hâlde sapmış olurum ve hidayete erenlerden olmam﴾<\/span> [En'âm 56]."], [649.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [651.0, "<span class=\"ayah\">﴿Birçokları hevâlarıyla (insanları) saptırırlar﴾<\/span> [En'âm 119]."], [656.0, "Yani hevâları sebebiyle hem kendileri sapmışlar hem de hevâları sebebiyle başkalarını saptırmışlardır."], [663.0, "Allah Azze ve Celle A'râf sûresinde şöyle buyurmuştur:"], [666.0, "<span class=\"ayah\">﴿Dileseydik onu onlarla yükseltirdik﴾<\/span> —yani âyetlerimizle, hak ile— <span class=\"ayah\">﴿fakat o yere saplanıp kaldı ve hevâsına uydu﴾<\/span> [A'râf 176]."]]}, {"reader": false, "ar": [[675.0, "وقال الله عز وجل:"], [677.3, "<span class=\"ayah\">﴿فَلَا يَصُدَّنَّكَ عَنْهَا﴾<\/span> ـ أي عن الآخرة،"], [680.5, "أو عن الذكرى ـ <span class=\"ayah\">﴿مَن لَّا يُؤْمِنُ بِهَا وَاتَّبَعَ هَوَاهُ فَتَرْدَىٰ﴾<\/span> <span class=\"ref\">[طه: ١٦]<\/span>."], [686.0, "وقال الله عز وجل:"], [688.5, "<span class=\"ayah\">﴿وَلَوِ اتَّبَعَ الْحَقُّ أَهْوَاءَهُمْ لَفَسَدَتِ السَّمَاوَاتُ وَالْأَرْضُ وَمَن فِيهِنَّ﴾<\/span> <span class=\"ref\">[المؤمنون: ٧١]<\/span>."], [694.0, "وقال الله عز وجل:"], [696.7, "<span class=\"ayah\">﴿أَفَرَأَيْتَ مَنِ اتَّخَذَ إِلَٰهَهُ هَوَاهُ وَأَضَلَّهُ اللَّهُ عَلَىٰ عِلْمٍ﴾<\/span> <span class=\"ref\">[الجاثية: ٢٣]<\/span> <span class=\"note\">(Şeyh «أرأيت» diye okuyor; bu, Furkân 43'ün başıdır.)<\/span> والآيات في هذا المعنى كثيرة،"], [703.0, "والآيات في هذا المعنى كثيرة."]], "tr": [[675.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [677.3, "<span class=\"ayah\">﴿Ona inanmayan ve hevâsına uyan kimse sakın seni ondan﴾<\/span> —yani âhiretten veya zikirden— <span class=\"ayah\">﴿alıkoymasın; sonra helâk olursun﴾<\/span> [Tâhâ 16]."], [686.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [688.5, "<span class=\"ayah\">﴿Eğer hak onların hevâlarına uysaydı, gökler, yer ve bunlarda bulunanlar mutlaka bozulurdu﴾<\/span> [Mü'minûn 71]."], [694.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [696.7, "<span class=\"ayah\">﴿Hevâsını ilah edineni ve Allah'ın bir ilim üzere saptırdığı kimseyi gördün mü?﴾<\/span> [Câsiye 23]."], [702.7, "Bu manada ayetler çoktur. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[706.0, "قال الإمام شيخ الإسلام ابن تيمية ـ رحمه الله تعالى ـ:"], [710.5, "«من الأصول المتّفق عليها بين الصحابة والتابعين لهم بإحسان: ألّا يُقبَل من أحدٍ أن يعارض القرآن برأيه، ولا ذوقه، ولا معقوله، ولا قياسه، ولا وَجْده؛ فإنهم ثبت عنهم بالبراهين القطعيات والآيات البيّنات أنّ الرسول جاء بالهدى ودين الحق، وأنّ القرآن <span class=\"ayah\">﴿يَهْدِي لِلَّتِي هِيَ أَقْوَمُ﴾<\/span> <span class=\"ref\">[الإسراء: ٩]<\/span>»."], [740.0, "انتهى كلامه. وهذا بالإجماع."]], "tr": [[706.0, "İmam Şeyhülislâm İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle demiştir:"], [708.0, "\"Sahabe ile onlara güzellikle tâbi olan tâbiîn arasında ittifak edilen usûldendir:"], [710.5, "Hiç kimseden Kur'an'a kendi re'yiyle, zevkiyle, aklıyla, kıyasıyla veya vecdiyle muâraza etmesi kabul edilmez."], [718.3, "Çünkü kat'î burhanlar ve apaçık ayetlerle, Resûl'ün hidayet ve hak din ile geldiği ve Kur'an'ın <span class=\"ayah\">﴿en doğru olana ilettiği﴾<\/span> [İsrâ 9] onlar katında sabit olmuştur.\" Sözü burada bitti. Bu, icmâ iledir."]]}, {"reader": false, "ar": [[743.0, "وقال الإمام الشاطبيّ ـ رحمه الله تعالى ـ في «الاعتصام»،"], [747.0, "قال: «سُمّي أهل البدع أهلَ الأهواء لأنهم اتّبعوا أهواءهم، فلم يأخذوا بالأدلة الشرعية مأخذَ الافتقار إليها والتعويل عليها حتى يصدُروا عنها، بل قدّموا أهواءهم واعتمدوا على آرائهم، ثم جعلوا الأدلة الشرعية منظورًا فيها من وراء ذلك»."], [770.0, "يعني: أنّ اعتمادهم الأول على أهوائهم وعقولهم."]], "tr": [[743.0, "İmam Şâtıbî —Allah Teâlâ ona rahmet etsin— el-İ'tisâm'da şöyle demiştir:"], [746.0, "\"Bid'at ehline hevâ ehli denmiştir;"], [747.8, "çünkü hevâlarına uydular. Şer'î delilleri, onlara muhtaç olarak ve onlara dayanarak, (görüşlerini) onlardan çıkaracak şekilde almadılar."], [759.8, "Aksine hevâlarını öne aldılar, re'ylerine dayandılar, sonra şer'î delillere bunun arkasından bakılır kıldılar.\" Yani onların ilk dayanağı hevâları ve akıllarıdır."]]}, {"reader": false, "ar": [[776.0, "فآفةُ أهل البدع والأهواء تقديمُ عقولهم؛"], [780.0, "فيعتقدون في الشيء أولًا بعقولهم وأهوائهم،"], [784.0, "ثم يبحثون عمّا يؤيّده من دلالة الكتاب،"], [788.0, "حتى ولو لم يجدوا على ما يؤيّد عقولهم إلا حديثًا ضعيفًا،"], [795.2, "أو منكرًا، أو واهيًا،"], [797.9, "أو مكذوبًا، بل حتى لو لم يجدوا إلا بيتًا من الشعر لا يُعرَف قائله،"], [805.2, "فإنهم يفرحون به ويأخذونه."], [807.0, "والآفةُ فيهم أنهم اعتقدوا بعقولهم،"], [810.4, "ثم حاولوا أن يستدلّوا بعد ذلك بالأدلة الشرعية."]], "tr": [[776.0, "Bid'at ve hevâ ehlinin âfeti akıllarını öne almalarıdır:"], [780.0, "Bir şeye önce akılları ve hevâlarıyla inanırlar, sonra onu destekleyen Kitap delâletini ararlar."], [787.4, "Akıllarını destekleyen bir şey olarak zayıf, münker, çok zayıf (vâhî) veya uydurma bir hadisten başka bir şey bulamasalar bile;"], [800.0, "hatta söyleyeni bilinmeyen bir şiir beytinden başka bir şey bulamasalar bile ona sevinir ve onu alırlar."], [807.0, "Onlardaki âfet şudur: Akıllarıyla inandılar, sonra bundan sonra şer'î delillerle istidlal etmeye çalıştılar."]]}, {"reader": false, "ar": [[818.0, "وأمّا ما لا يتّفق مع عقولهم وأهوائهم من أدلة الكتاب والسنة،"], [825.1, "فإنهم يسومونها تعطيلًا، وتأويلًا،"], [827.7, "وتحريفًا، وجحدًا، وتكذيبًا، وإنكارًا؛"], [830.2, "كلُّ ذلك انتصارًا لعقولهم،"], [838.0, "وفي الحقيقة أنه انتصارٌ لأهوائهم."], [841.0, "ولذلك فلا يزال أهل السنة يحذِّرون من أهل الأهواء،"], [847.0, "ومن النظر في الأدلة بعين الرأي المجرَّد عن فهم السلف الصالح. والله أعلم."]], "tr": [[818.0, "Kitap ve Sünnet delillerinden akıllarına ve hevâlarına uymayana gelince, ona ta'til, te'vil, tahrif, inkâr (cahd), tekzip ve reddetme muamelesi yaparlar."], [830.2, "Bütün bunlar akıllarına yardım içindir;"], [838.0, "hakikatte ise hevâlarına yardımdır. Bu yüzden Ehl-i Sünnet, hevâ ehlinden ve delillere selef-i sâlihînin anlayışından soyutlanmış çıplak re'y gözüyle bakmaktan sakındırmaya devam eder. Allah en iyisini bilir."]]}]}, {"ts": "14:14", "title": "3. Külliye: Sıfat naslarını Arap dilindeki manalarından ta'til eden, kalplere Allah'ı tanıma yolunu kapatmıştır", "paras": [{"reader": false, "ar": [[854.0, "ومن الكلّيّات أيضًا: <b>كلُّ من عطّل نصوصَ الصفات عن معانيها المقرَّرة في لسان العرب فقد سدّ على القلوب طريقَ معرفة الله.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ من عطّل نصوص الصفات عن معانيها المقرّرة في لسان العرب فقد سدّ على القلوب طريق معرفة الله.<\/b>"]], "tr": [[854.0, "Külliyelerden biri de şudur: 3."], [856.0, "külliye: Sıfat naslarını Arap dilinde yerleşik manalarından ta'til eden herkes, kalplere Allah'ı tanıma yolunu kapatmıştır.<b> (Tekrar ediyor.) <\/b>3."], [882.5, "külliye: Sıfat naslarını Arap dilinde yerleşik manalarından ta'til eden herkes, kalplere Allah'ı tanıma yolunu kapatmıştır."]]}, {"reader": false, "ar": [[893.0, "أقول وبالله التوفيق: وأعني بذلك مذهبَ المفوِّضة،"], [898.0, "الذين يقولون بأنّ ظواهر نصوص الصفات غيرُ مراد،"], [903.0, "ولكن لا تسألنا عن معانيها،"], [905.5, "فإننا لا نتكلّم في المعاني."], [908.0, "وهذا المذهب من أخطر المذاهب البدعية،"], [914.0, "لأنّ حقيقته سدُّ طريق المعرفة بالله عز وجل؛"], [921.0, "فإنّ الله عز وجل إنما تعرّف لعباده بمقتضى أسمائه وصفاته."]], "tr": [[893.0, "Tevfik Allah'tandır, derim ki: Bununla Müfevvize'nin mezhebini kastediyorum."], [895.0, "Onlar şöyle derler: Sıfat naslarının zahiri murad değildir;"], [899.9, "fakat bize onların manalarını sorma, çünkü biz manalar hakkında konuşmayız."], [905.0, "Bu mezhep, bid'at mezheplerinin en tehlikelilerindendir;"], [908.0, "çünkü hakikati, Allah Azze ve Celle'yi tanıma yolunu kapatmaktır."], [916.2, "Zira Allah Azze ve Celle kendisini kullarına ancak isim ve sıfatlarının gerektirdiğiyle tanıtmıştır."]]}]}, {"ts": "15:29", "title": "3. Külliye (devam): Tefvîz mezhebinin bâtıl lâzımları — Allah'ın hikmetini eksiltmek", "paras": [{"reader": false, "ar": [[929.0, "فإذا قلنا بأنّ ظواهر نصوص الصفات غيرُ مراد،"], [933.0, "ولا ندري عن معانيها،"], [935.0, "فحينئذٍ كيف نعبد الله عز وجل باسمه «السميع» ونحن لا نعرف معنى السمع؟"], [943.0, "وكيف نعبد الله عز وجل باسمه «البصير» ونحن لا نعرف معنى البصر؟"], [949.0, "وكيف نتعبّد لله عز وجل باسمه «القدير» «القويّ» ونحن لا ندري أصلًا ما معنى القدرة المضافة إلى الله عز وجل،"], [957.7, "ولا القوة المضافة إلى الله عز وجل؟"], [960.0, "وكيف نتعبّد لله عز وجل باسمه «الرقيب» ونحن أصالةً لا ندري عن معنى الرقابة المضافة إلى الله عز وجل؟"]], "tr": [[929.0, "Sıfat naslarının zahirinin murad olmadığını ve manalarını bilmediğimizi söylersek, o zaman Allah Azze ve Celle'ye es-Semî' ismiyle nasıl kulluk ederiz, biz işitmenin manasını bilmiyorken?"], [943.0, "Allah Azze ve Celle'ye el-Basîr ismiyle nasıl kulluk ederiz, biz görmenin manasını bilmiyorken?"], [949.0, "Allah Azze ve Celle'ye el-Kadîr, el-Kaviyy ismiyle nasıl kulluk ederiz, biz Allah Azze ve Celle'ye izâfe edilen kudretin ve Allah Azze ve Celle'ye izâfe edilen kuvvetin ne manaya geldiğini aslında hiç bilmiyorken?"], [960.0, "Allah Azze ve Celle'ye er-Rakîb ismiyle nasıl kulluk ederiz, biz Allah Azze ve Celle'ye izâfe edilen murâkabenin (gözetlemenin) manasını aslında bilmiyorken?"]]}, {"reader": false, "ar": [[971.0, "ففي الحقيقة أنّ هذا المذهب يلزم عليه لوازمُ باطلة،"], [976.0, "لو تدبّرها أصحابه لتبيّن لهم أنهم على ضلالٍ مبين."], [983.0, "فإذا عرضنا مقالة التعطيل القائلة بصرف اللفظ عن ظاهره مع عدم التعرّض لبيان معناه المراد منه،"], [993.0, "للزم على ذلك لوازمُ كثيرة."], [997.0, "من هذه اللوازم مثلًا:"], [999.0, "التنقّص من حكمة الله عز وجل؛"], [1002.0, "فإنّ من يعتقد تفويض المعنى هذا متنقِّصٌ من حكمة الله عز وجل."]], "tr": [[971.0, "Hakikatte bu mezhebin bâtıl lâzımları vardır;"], [974.9, "sahipleri onları düşünselerdi apaçık bir sapıklık üzere olduklarını anlarlardı."], [983.0, "Lafzı zahirinden çevirip ondan murad edilen manayı açıklamaya hiç girişmeyen ta'til görüşünü (incelemeye) arz edersek, bundan birçok lâzım gerekir."], [997.0, "Bu lâzımlardan biri mesela Allah Azze ve Celle'nin hikmetini eksiltmektir."], [1002.0, "Çünkü mananın tefvîzine inanan kimse, Allah Azze ve Celle'nin hikmetini eksiltmektedir."]]}, {"reader": false, "ar": [[1012.0, "فإن قلتَ: وكيف ذلك؟"], [1014.0, "فأقول: لأنّ الله عز وجل إنما أنزل كتابه ليفهمه عبادُه،"], [1019.0, "وكيف يفهم العبادُ كتابًا لا يجوز حمله على معانيه التي يعرفونها في لغتهم؟"], [1026.0, "فإنّ الله إنما أنزل كتابه لنا ليهدينا،"], [1030.7, "فكيف نهتدي بكتابٍ نحن لا نعرف معانيه؟"], [1037.0, "فإنه ليس من حكمة الواحد منّا أن يأمر إنسانًا أن يدرس كتابًا هو نفسه لا يعرف معانيه،"], [1046.0, "فإنّ ذلك منافٍ لحكمة المخلوق."]], "tr": [[1012.0, "\"Bu nasıl olur?\" dersen, derim ki:"], [1014.0, "Çünkü Allah Azze ve Celle Kitabını ancak kulları onu anlasın diye indirmiştir."], [1019.5, "Kullar, kendi dillerinde bildikleri manalarına hamledilmesi caiz olmayan bir kitabı nasıl anlarlar?"], [1026.0, "Allah Kitabını bize ancak bizi hidayete erdirmek için indirmiştir;"], [1030.7, "manalarını bilmediğimiz bir kitapla nasıl hidayete ereriz?"], [1037.0, "Birimizin, bir insana kendisinin manalarını bilmediği bir kitabı okumasını emretmesi hikmetten değildir;"], [1044.9, "bu, mahlûkun hikmetine bile aykırıdır."]]}, {"reader": false, "ar": [[1050.0, "فكيف يُوصَف الله عز وجل بأنه قد أنزل كتابه،"], [1054.8, "وأمر الناسَ بما فيه،"], [1057.0, "وكلّفهم بشرائعه، وهم أصلًا لا يعرفون معانيه؟"], [1062.0, "فهذا تنقّصٌ لله عز وجل،"], [1064.7, "وطعنٌ في حكمة الله تبارك وتعالى؛"], [1068.0, "فإنّ العبادَ ـ بناءً على مذهب التفويض ـ ليسوا مؤهَّلين لفهم القرآن،"], [1074.6, "ولا فهمِ شيءٍ من الأسماء والصفات."]], "tr": [[1050.0, "O hâlde Allah Azze ve Celle, Kitabını indirdiği, insanlara onda olanı emrettiği ve onları şeriatıyla mükellef kıldığı hâlde onlar aslında manalarını bilmiyorlarsa, (böyle bir şeyle) nasıl vasıflandırılır?"], [1062.0, "Bu, Allah Azze ve Celle'yi eksiltmek ve Allah Tebâreke ve Teâlâ'nın hikmetine dil uzatmaktır."], [1068.0, "Çünkü tefvîz mezhebine göre kullar ne Kur'an'ı anlamaya ne de isim ve sıfatlardan bir şey anlamaya ehildirler."]]}, {"reader": false, "ar": [[1080.0, "ولذلك يقول الله عز وجل:"], [1083.1, "<span class=\"ayah\">﴿وَمَا أَرْسَلْنَا مِن رَّسُولٍ إِلَّا بِلِسَانِ قَوْمِهِ﴾<\/span>،"], [1087.5, "لماذا؟ الجواب: <span class=\"ayah\">﴿لِيُبَيِّنَ لَهُمْ﴾<\/span> <span class=\"ref\">[إبراهيم: ٤]<\/span>."], [1090.0, "فالله عز وجل أرسل لكلّ أمةٍ رسولًا يتكلّم بلسانهم،"], [1095.1, "ليفهموا مرادَ الله عز وجل في شريعته ودينه."], [1103.0, "فكيف يُرسل الله عز وجل لنا محمدًا صلى الله عليه وسلم باللسان العربي،"], [1109.6, "ويُنزل عليه كتابًا نحن لا ندري عن معانيه؟"], [1114.0, "فلا ندري عن معنى «إنّ الله عزيزٌ حكيم»،"], [1117.0, "ولا ندري عن معنى «إنّ الله سميعٌ بصير»،"], [1120.0, "ولا ندري عن معنى «وهو العليُّ العظيم»،"], [1123.0, "ولا يجوز لأحدٍ عند المفوِّضة أن يتكلّم في شيءٍ من معاني الأسماء والصفات."]], "tr": [[1080.0, "Bu yüzden Allah Azze ve Celle şöyle buyurur:"], [1083.1, "<span class=\"ayah\">﴿Biz her peygamberi ancak kendi kavminin diliyle gönderdik﴾<\/span>."], [1088.1, "Niçin? Cevap: <span class=\"ayah\">﴿Onlara açıklasın diye﴾<\/span> [İbrâhîm 4]."], [1090.0, "Allah Azze ve Celle her ümmete onların diliyle konuşan bir resul gönderdi ki Allah Azze ve Celle'nin şeriatındaki ve dinindeki muradını anlasınlar."], [1103.0, "O hâlde Allah Azze ve Celle bize Muhammed sallallâhu aleyhi ve sellem'i Arap diliyle gönderip ona bizim manalarını bilmediğimiz bir kitap indirir mi?"], [1112.0, "\"Şüphesiz Allah Azîz'dir, Hakîm'dir\" sözünün manasını bilmeyiz;"], [1114.0, "\"Şüphesiz Allah Semî'dir, Basîr'dir\" sözünün manasını bilmeyiz;"], [1117.4, "\"O Aliyy'dir, Azîm'dir\" sözünün manasını bilmeyiz;"], [1120.4, "Müfevvize'ye göre hiç kimsenin isim ve sıfatların manalarından herhangi biri hakkında konuşması caiz değildir."]]}, {"reader": false, "ar": [[1130.0, "أنتم معي يا جماعة؟"], [1132.9, "هذا المذهب لعين، هذا المذهب لعينٌ لعين،"], [1138.0, "شيطانيٌّ إبليسيّ، وهو أخطر من مذهب التحريف أو التأويل؛"], [1145.0, "لأنّ المؤوِّل جعل لك شيئًا تتمسّك به على الأقل،"], [1149.0, "وإن كان خطأً، لكنّ المفوِّض لم يسمح لعقلك أصلًا أن ينصرف إلى أيّ معنى،"], [1156.0, "لا ينصرف إلى أيّ معنى."]], "tr": [[1130.0, "Benimle misiniz, ey cemaat? Bu mezhep lanetlidir;"], [1132.9, "bu mezhep lanetli, lanetlidir; şeytanî ve iblisçedir."], [1139.0, "Tahrif veya te'vil mezhebinden daha tehlikelidir."], [1145.0, "Çünkü müevvil (te'vil eden) sana en azından tutunacağın bir şey bırakmıştır, yanlış olsa bile."], [1151.9, "Fakat müfevvid, aklının hiçbir manaya yönelmesine asla izin vermemiştir; (aklın) hiçbir manaya yönelmez."]]}, {"reader": false, "ar": [[1161.0, "ولذلك ناقشني بعضُهم يومًا من الأيام،"], [1163.0, "وقلتُ له: إذا كنتَ في غرفةٍ ومعك معصية،"], [1167.4, "ولا يراك أحد، فما الذي يزجر قلبك عن تعاطي المعصية؟"], [1173.0, "يقول: الله رقيب. فأنت ـ كمفوِّض ـ لا تعرف معنى الرقابة،"], [1180.0, "فكيف تدبّر قلبُك أنّ معنى «الرقيب» هو المطّلع على أفعال العباد،"], [1187.0, "والذي لا يخفى عليه شيءٌ في الأرض ولا في السماء؟"], [1190.0, "إذًا أنت تكلّمتَ في المعنى؛"], [1191.0, "قلبك استشعر هذا المعنى."], [1195.0, "ولذلك هذا المذهب يقطع القلوب عن معرفة الله عز وجل."], [1199.0, "ثم أضِف إلى هذا شيئًا آخر،"]], "tr": [[1161.0, "Bu yüzden bir gün biri benimle tartıştı."], [1163.0, "Ona dedim ki: Bir odada olsan, yanında bir masiyet bulunsa ve seni kimse görmese, kalbini o masiyeti işlemekten alıkoyan nedir?"], [1173.0, "Diyor ki: \"Allah Rakîb'dir (gözetleyicidir).\" Peki sen bir müfevvid olarak murâkabenin manasını bilmiyorsun;"], [1181.3, "kalbin, er-Rakîb'in manasının kulların fiillerine muttali olan ve yerde de gökte de kendisine hiçbir şey gizli kalmayan demek olduğunu nasıl düşündü?"], [1190.0, "Demek ki sen manada konuştun;"], [1191.0, "kalbin bu manayı hissetti. Bu yüzden bu mezhep kalpleri Allah Azze ve Celle'yi tanımaktan koparır."], [1199.0, "Sonra buna başka bir şey daha ekle:"]]}]}, {"ts": "20:01", "title": "3. Külliye (devam): Terğîb ile terhîbi karıştırmak, sıfatları nefyetmek", "paras": [{"reader": false, "ar": [[1201.0, "وهي أنه يخلط بين الترغيب والترهيب."], [1206.0, "فمن لوازم مذهب التفويض أنك لا تعرف الآية المُرهِّبة،"], [1211.5, "ولا تعرف الآية المُرغِّبة."], [1214.0, "لماذا؟ لأنك رُغِّبتَ بألفاظٍ أنت لا تدري عن معناها،"], [1220.0, "ورُهِّبتَ بألفاظٍ أنت لا تدري عن معناها."], [1224.0, "فكيف أعرف أنّ من معاني الترغيب «إنّ الله غفورٌ رحيم» وأنا لا أدري أصلًا ما معنى المغفرة،"], [1230.9, "ولا أدري ما معنى الرحمة؟"], [1233.0, "فكيف يطمع قلبي ترغيبًا في هذه الآية وأنا لا أدري عن معناها؟"]], "tr": [[1201.0, "O da şudur: Bu (mezhep) terğîb (teşvik) ile terhîbi (korkutmayı) birbirine karıştırır."], [1206.0, "Tefvîz mezhebinin lâzımlarından biri, korkutan ayeti de teşvik eden ayeti de bilmemendir."], [1214.0, "Niçin? Çünkü manasını bilmediğin lafızlarla teşvik edildin ve manasını bilmediğin lafızlarla korkutuldun."], [1224.0, "Mağfiretin ne demek olduğunu, rahmetin ne demek olduğunu hiç bilmiyorken, \"Şüphesiz Allah Gafûr'dur, Rahîm'dir\" (sözünün) terğîb manalarından olduğunu nasıl bilebilirim?"], [1233.0, "Manasını bilmiyorken kalbim bu ayette teşvik edilerek nasıl ümitlenir?"]]}, {"reader": false, "ar": [[1238.0, "وكيف ينزجر قلبي من قول الله عز وجل:"], [1243.0, "«إنّ الله شديد العقاب»،"], [1244.8, "وأنا لا أدري ما معنى شدّة العقاب،"], [1248.0, "أو اتّصاف الله عز وجل بأنه شديد العقاب؟"], [1251.0, "وكيف تطلب منّي أن أنزجر عن المعصية في الأرض وأنا لا أعرف ما معنى البصر المضاف إلى الله،"], [1259.0, "ولا معنى الإحاطة المضافة إلى الله،"], [1261.0, "ولا معنى الهيمنة المضافة إلى الله،"], [1263.0, "ولا معنى المعيّة المضافة إلى الله؟"], [1265.0, "كلُّ ذلك لا أعرفه،"], [1266.0, "فكيف تنزجر نفسي عن ارتكاب الذنوب والمعاصي؟"]], "tr": [[1238.0, "Allah Azze ve Celle'nin \"Şüphesiz Allah'ın cezası çetindir\" sözünden kalbim nasıl çekinir, ben cezanın çetinliğinin veya Allah Azze ve Celle'nin cezası çetin olmakla vasıflanmasının ne demek olduğunu bilmiyorken?"], [1251.0, "Allah'a izâfe edilen görmenin manasını, Allah'a izâfe edilen ihatanın manasını, Allah'a izâfe edilen hâkimiyetin (heymene) manasını, Allah'a izâfe edilen maiyyetin (beraberliğin) manasını bilmiyorken yeryüzünde masiyetten çekinmemi benden nasıl istersin?"], [1265.0, "Bunların hiçbirini bilmiyorum; nefsim günahları ve masiyetleri işlemekten nasıl çekinir?"]]}, {"reader": false, "ar": [[1269.0, "وكيف يرغب قلبي فيما عند الله عز وجل إذا كنتُ خُوطِبتُ بآياتٍ ترغيبيّة أنا لا أدري أصلًا عن معناها؟"], [1280.0, "وكيف يؤثّر في قلبي تلك الآيات؟"], [1282.0, "وكيف تؤثّر في قلبي تلك الآيات ترغيبًا أو ترهيبًا إذا كنتُ لا أدري ما معناها؟"], [1289.0, "ففي الحقيقة أنهم يفصلون القلوب عن معرفة الله عز وجل،"], [1293.0, "إي والله، يفصلون القلوب عن معرفة الله عز وجل."]], "tr": [[1269.0, "Manasını hiç bilmediğim terğîb ayetleriyle muhatap kılınmışsam, kalbim Allah Azze ve Celle katında olana nasıl rağbet eder?"], [1280.0, "Bu ayetler kalbime nasıl tesir eder?"], [1282.0, "Manalarını bilmiyorsam bu ayetler kalbime teşvik veya korkutma olarak nasıl tesir eder?"], [1289.0, "Hakikatte onlar kalpleri Allah Azze ve Celle'yi tanımaktan ayırıyorlar;"], [1292.6, "evet, vallahi, kalpleri Allah Azze ve Celle'yi tanımaktan ayırıyorlar."]]}, {"reader": false, "ar": [[1301.0, "ومن لوازمه الباطلة: أنه يتضمّن نفيَ صفات الله عز وجل؛"], [1308.0, "لأنّ اعتبار معاني نصوص الصفات مجهولةً بالنسبة للمكلَّفين،"], [1315.0, "وهذا يستلزم تعطيلها، إذ إنّ القلوب لا تُثبت الشيء إلا إذا كانت تفهمه،"], [1320.0, "وأمّا إذا خُوطِبت بأمورٍ لا تفهمها فإنها تُعرض عنها،"], [1323.9, "ولا تنظر لها بعين الاعتبار."], [1326.0, "والآياتُ في القرآن ـ عفوًا ـ وآياتُ الصفات في القرآن كثيرةٌ جدًّا."]], "tr": [[1301.0, "Bâtıl lâzımlarından biri de şudur:"], [1303.1, "(Bu mezhep) Allah Azze ve Celle'nin sıfatlarının nefyini içerir."], [1308.0, "Çünkü sıfat naslarının manalarını mükellefler için meçhul saymak, onların ta'tilini gerektirir."], [1316.4, "Zira kalpler bir şeyi ancak onu anlıyorsa isbat eder;"], [1320.0, "anlamadığı şeylerle muhatap kılınırsa onlardan yüz çevirir ve onlara itibar gözüyle bakmaz."], [1326.0, "Kur'an'daki ayetler —pardon— Kur'an'daki sıfat ayetleri pek çoktur."]]}, {"reader": false, "ar": [[1334.0, "فكلُّ نصٍّ من نصوص الصفات يمرّ عليه المفوِّض لا يقف عنده فيؤمن به؛"], [1340.0, "لأنه إن آمن به فإنما يؤمن به إيمانًا خاليًا عن معنى."], [1347.0, "أنتم معي؟ <span class=\"q\">؟ 22:27<\/span> خاليًا عن معنى."], [1349.0, "وهل هذا هو الإيمان الذي يريده الله؟"], [1351.0, "الجواب: ليس هذا الإيمانَ الذي يريده."]], "tr": [[1334.0, "Müfevvidin üzerinden geçtiği her sıfat nassında durup ona iman etmez;"], [1338.6, "çünkü ona iman etse bile ancak manadan boş bir imanla iman eder."], [1347.0, "Benimle misiniz? <span class=\"q\">؟<\/span> Manadan boş (bir iman)."], [1349.6, "Allah'ın istediği iman bu mudur?"], [1351.0, "Cevap: Bu, (Allah'ın) istediği iman değildir."]]}, {"reader": false, "ar": [[1354.0, "وأضِف إلى هذا ـ أيها الأحباب ـ من اللوازم الباطلة:"], [1360.0, "أنّ هذا المذهب الباطل يُفوِّت على العباد معرفةَ أشرف بابٍ من أبواب الشريعة؛"], [1369.0, "فأعظمُ بابٍ، وأشرفُ باب،"], [1371.9, "وأفخمُ وأعظمُ أبواب التشريع،"], [1375.0, "هي معرفة الله عز وجل بمقتضى أسمائه وصفاته."], [1378.0, "فيأتي هؤلاء ويضربون هذا الباب ويكسرونه،"], [1382.1, "ولا ينظرون إلى آثار كسره أبدًا."]], "tr": [[1354.0, "Ey sevgili kardeşlerim! Bâtıl lâzımlardan buna şunu da ekle:"], [1360.0, "Bu bâtıl mezhep, kulların şeriatın bablarının en şereflisini öğrenmesini kaçırır."], [1366.3, "En büyük bab, en şerefli bab, teşrî bablarının en muhteşemi ve en büyüğü, Allah Azze ve Celle'yi isim ve sıfatlarının gerektirdiğiyle tanımaktır."], [1378.0, "Bunlar gelip bu kapıya vuruyor, onu kırıyorlar ve kırılmasının sonuçlarına asla bakmıyorlar."]]}, {"reader": false, "ar": [[1388.0, "ولذلك الله عز وجل ونبيُّه صلى الله عليه وسلم علّمنا آدابَ الخلاء،"], [1395.0, "وآدابَ النوم، وآدابَ الأكل والشرب،"], [1398.0, "فنحن نطبّقها؛ لكن إذا جئنا إلى أعظم الأبواب ـ وهي معرفة القلوب لله عز وجل ـ تجد أنّ القلب لا يفقه شيئًا من ذلك أبدًا."], [1407.0, "فعطّل المفوِّضةُ أعظمَ باب،"], [1410.0, "وسدّوا على الناس أشرفَ بابٍ وأفخمَ باب،"], [1413.0, "في بابٍ من معارف الشريعة،"], [1415.0, "وهي بابُ معرفة الله بأسمائه وصفاته."], [1418.0, "أنتم معي في هذا ولا لا؟"], [1419.0, "والله العظيم، والله هذا…"]], "tr": [[1388.0, "Allah Azze ve Celle ve Peygamberi sallallâhu aleyhi ve sellem bize helâ âdâbını, uyku âdâbını, yeme ve içme âdâbını öğretti;"], [1398.7, "biz de bunları uyguluyoruz. Fakat babların en büyüğüne —ki o, kalplerin Allah Azze ve Celle'yi tanımasıdır— gelince, kalbin bundan hiçbir şey anlamadığını görürsün."], [1407.0, "Müfevvize en büyük babı ta'til etti;"], [1410.4, "şeriatın marifet bablarından birinde, insanlara en şerefli ve en muhteşem kapıyı kapattılar;"], [1414.6, "o da Allah'ı isim ve sıfatlarıyla tanıma babıdır."], [1418.0, "Bu konuda benimle misiniz, değil misiniz? Vallahi'l-azîm, vallahi bu…"]]}]}, {"ts": "23:42", "title": "3. Külliye (devam): Amelleri ta'til etmek; ibadetin lezzetini kaybetmek", "paras": [{"reader": false, "ar": [[1422.0, "ومنها أيضًا: أنهم يعطّلون الأعمال بناءً على تعطيل المعاني."], [1428.0, "فكيف أُصلّي لربٍّ أنا لا أعرفه؟"], [1432.0, "وكيف تبكي عيني من ربٍّ أنا أصلًا لا أعرفه؟"], [1436.0, "ـ أقصد: لا أعرفه بمقتضى أسمائه وصفاته ومعانيها ـ وكيف تريد منّي أن أخاف من ربٍّ أنا أصلًا لا أعرفه؟"], [1445.0, "وكيف تريد من قلبي أن ينزجر عن أمرٍ حرّمه ذلك الربّ،"], [1452.0, "أنا لا أدري أصلًا ما معنى صفاته، ولا معنى أسمائه؟"]], "tr": [[1422.0, "Bunlardan biri de şudur: Manaları ta'til etmeleri üzerine amelleri de ta'til ederler."], [1428.0, "Tanımadığım bir Rabb'e nasıl namaz kılarım?"], [1432.0, "Aslında tanımadığım bir Rabb'den (korkarak) gözüm nasıl ağlar?"], [1436.0, "—Yani O'nu isim ve sıfatlarının ve bunların manalarının gerektirdiğiyle tanımıyorum demek istiyorum.— Aslında tanımadığım bir Rabb'den korkmamı benden nasıl istersin?"], [1446.9, "Sıfatlarının ve isimlerinin manasını hiç bilmediğim o Rabb'in haram kıldığı bir şeyden kalbimin çekinmesini nasıl istersin?"]]}, {"reader": false, "ar": [[1457.0, "فكأنك تحذّرني من مجهولٍ عندي،"], [1461.0, "وإذا حُذِّرتَ من مجهولٍ أنت لا تعرف شيئًا عنه فحينئذٍ لن تخاف ولن تنزجر."], [1471.0, "ولذلك هذا المذهب، من يمشي عليه ويعمل بمقتضاه،"], [1475.0, "والله سيفقد لذّة العبادة يومًا من الأيام،"], [1478.0, "وسيترك كثيرًا من التعبّدات،"], [1481.0, "ولن يكون في قلبه دافعٌ أو وَقودٌ إيمانيٌّ يجعله يضحّي من أجل هذا الدين،"], [1488.0, "أو ـ يعني ـ يجاهد في سبيل إعلاء كلمة الله في الأرض يومًا من الأيام."], [1494.0, "لماذا؟ لأنه لا يعرف هذا الربّ،"], [1496.0, "لا يعرف هذا الربّ. أعوذ بالله."]], "tr": [[1457.0, "Sanki beni, benim için meçhul olan bir şeyden sakındırıyorsun."], [1462.1, "Hakkında hiçbir şey bilmediğin meçhul bir şeyden sakındırıldığında, o zaman ne korkarsın ne de çekinirsin."], [1471.0, "Bu yüzden bu mezhebe kim yürür ve gereğiyle amel ederse, vallahi bir gün ibadetin lezzetini kaybedecek, birçok ibadeti terk edecek;"], [1480.2, "kalbinde onu bu din uğrunda fedakârlık yapmaya veya —yani— bir gün yeryüzünde Allah'ın kelimesini yüceltmek için Allah yolunda cihad etmeye sevk eden bir itici güç veya imanî bir yakıt olmayacak."], [1494.0, "Niçin? Çünkü bu Rabb'i tanımıyor;"], [1496.0, "bu Rabb'i tanımıyor. Allah'a sığınırım."]]}]}, {"ts": "25:00", "title": "3. Külliye (devam): Vahye dil uzatmak; insanları vahiysiz bırakmanın daha iyi olması", "paras": [{"reader": false, "ar": [[1500.0, "ولذلك يقول أهل العلم:"], [1502.0, "فإنّ من في قلبه أدنى حياةٍ وطلبٍ للعلم،"], [1505.3, "أو همّةٍ في العبادة،"], [1507.0, "يكون البحثُ عن هذا الباب ـ أي باب معرفة الله بأسمائه وصفاته ـ هو أعظمَ مطالبه على الإطلاق."], [1516.0, "ولذلك فالمفوِّضة عرفوا كيف يقطعون الطريق بين العباد وبين الله عز وجل."]], "tr": [[1500.0, "Bu yüzden ehl-i ilim şöyle der:"], [1502.4, "Kalbinde en küçük bir hayat, ilim talebi veya ibadette himmet bulunan kimse için bu babı —yani Allah'ı isim ve sıfatlarıyla tanıma babını— araştırmak, mutlak olarak en büyük talebidir."], [1516.0, "Bu yüzden Müfevvize, kullar ile Allah Azze ve Celle arasındaki yolu nasıl keseceklerini bildiler."]]}, {"reader": false, "ar": [[1522.0, "ومنها أيضًا: الطعنُ في الوحي؛"], [1530.0, "فمذهب المفوِّضة يتضمّن الطعن في الوحي."], [1532.0, "لماذا؟ لأنّ الله عز وجل قد وصف هذا الوحي بأنه برهان،"], [1538.0, "وكيف يكون برهانًا وأنا لا أفهم معناه؟"], [1541.2, "إذًا في الحقيقة أنه ليس ببرهان."], [1545.0, "انتبه! قال الله عز وجل:"], [1548.0, "<span class=\"ayah\">﴿يَا أَيُّهَا النَّاسُ قَدْ جَاءَكُم بُرْهَانٌ مِّن رَّبِّكُمْ وَأَنزَلْنَا إِلَيْكُمْ﴾<\/span> إيش؟ <span class=\"ayah\">﴿نُورًا مُّبِينًا﴾<\/span> <span class=\"ref\">[النساء: ١٧٤]<\/span>."]], "tr": [[1522.0, "Bunlardan biri de vahye dil uzatmaktır;"], [1530.0, "Müfevvize'nin mezhebi vahye dil uzatmayı içerir."], [1532.0, "Niçin? Çünkü Allah Azze ve Celle bu vahyi burhan (kesin delil) olmakla vasıflandırmıştır."], [1538.0, "Ben manasını anlamıyorken o nasıl burhan olur?"], [1541.2, "O hâlde hakikatte o burhan değildir."], [1545.0, "Dikkat et! Allah Azze ve Celle şöyle buyurdu:"], [1548.0, "<span class=\"ayah\">﴿Ey insanlar! Size Rabbinizden bir burhan geldi ve size﴾<\/span> ne?"], [1551.6, "<span class=\"ayah\">﴿apaçık bir nur indirdik﴾<\/span> [Nisâ 174]."]]}, {"reader": false, "ar": [[1553.4, "إذًا وصف الوحيَ بأنه برهان،"], [1555.8, "وأنه نور، وأنه هدًى؛"], [1558.0, "وكيف يكون نورًا وأنا لا أعرف معناه؟"], [1561.0, "وكيف يكون هدًى وأنا لا أستطيع أن أهتدي به لعدم معرفتي لمعناه؟"], [1565.0, "فهذا طعنٌ في الوحي."], [1567.0, "وكذلك يقول الله عز وجل:"], [1570.3, "<span class=\"ayah\">﴿كِتَابٌ فُصِّلَتْ آيَاتُهُ قُرْآنًا عَرَبِيًّا لِّقَوْمٍ يَعْلَمُونَ﴾<\/span> <span class=\"ref\">[فصلت: ٣]<\/span>،"], [1575.0, "وسمّاه الله عز وجل فرقانًا في قوله:"], [1577.7, "<span class=\"ayah\">﴿تَبَارَكَ الَّذِي نَزَّلَ الْفُرْقَانَ عَلَىٰ عَبْدِهِ﴾<\/span> <span class=\"ref\">[الفرقان: ١]<\/span>."]], "tr": [[1553.4, "Demek ki vahyi burhan, nur ve hidayet olmakla vasıflandırdı."], [1558.0, "Manasını bilmiyorken o nasıl nur olur?"], [1561.0, "Manasını bilmediğim için onunla hidayete eremiyorken o nasıl hidayet olur?"], [1565.0, "Bu, vahye dil uzatmaktır. Aynı şekilde Allah Azze ve Celle şöyle buyurur:"], [1570.3, "<span class=\"ayah\">﴿Bilen bir kavim için ayetleri Arapça bir Kur'an olarak ayrıntılı açıklanmış bir kitap﴾<\/span> [Fussilet 3]."], [1575.8, "Allah Azze ve Celle onu <span class=\"ayah\">﴿Kuluna Furkân'ı indiren (Allah) yücedir﴾<\/span> [Furkân 1] sözünde Furkân diye adlandırdı."]]}, {"reader": false, "ar": [[1580.0, "وهذه الأوصاف للقرآن لا يفهمها المفوِّضة."], [1584.0, "لماذا؟ لأنّ من شرط فهمها معرفةَ المعاني التي خُوطِبنا بها،"], [1589.0, "وهؤلاء يقولون: لا يجوز الكلام في المعنى."], [1595.0, "فكيف يكون القرآن هدًى وشفاءً ونورًا وفرقانًا،"], [1604.0, "ونحن لا نعرف معناه،"], [1606.5, "ولا نعرف شيئًا ممّا خُوطِبنا به؟"]], "tr": [[1580.0, "Kur'an'ın bu vasıflarını Müfevvize anlamaz."], [1584.0, "Niçin? Çünkü onları anlamanın şartı, muhatap kılındığımız manaları bilmektir;"], [1588.5, "bunlar ise \"Mana hakkında konuşmak caiz değildir\" derler."], [1595.0, "Biz onun manasını bilmiyor ve muhatap kılındığımız şeylerden hiçbir şey bilmiyorken Kur'an nasıl hidayet, şifa, nur ve furkân olur?"]]}, {"reader": false, "ar": [[1611.0, "ومن اللوازم أيضًا: أنّ تركَ الناس بلا وحيٍ أفضلُ لهم في دينهم من إنزال الوحي،"], [1621.0, "وكأنّ المفوِّضة يقولون هذا الكلام بنصّه."], [1625.0, "لماذا؟ لأننا إذا مررنا على قول الله عز وجل:"], [1629.2, "«إنّ الله سميعٌ بصير»،"], [1631.0, "يأتيك المفوِّض ويقول: إيّاك أن تتكلّم في معنى السمع وفي معنى البصر!"], [1637.0, "فإذا أثبتَّ أنّ لله عز وجل سمعًا،"], [1640.2, "ومعنى السمع إدراكُ المسموعات،"], [1642.0, "وأنّ له بصرًا، وأنّ معنى البصر رؤيةُ الأشياء،"], [1644.2, "وأنّ له علوًّا، وأنّ له نزولًا،"], [1646.2, "وأنّ له مجيئًا وإتيانًا،"], [1647.9, "فإنك عند المفوِّض قد كفرت."]], "tr": [[1611.0, "Lâzımlardan biri de şudur: İnsanları vahiysiz bırakmak, dinleri için vahyin indirilmesinden daha hayırlıdır;"], [1620.3, "sanki Müfevvize bu sözü harfiyen söylüyor."], [1625.0, "Niçin? Çünkü Allah Azze ve Celle'nin \"Şüphesiz Allah Semî'dir, Basîr'dir\" sözüne geldiğimizde müfevvid sana gelir ve \"Sakın işitmenin ve görmenin manası hakkında konuşma!\" der."], [1637.0, "Allah Azze ve Celle'nin işitmesi olduğunu ve işitmenin manasının işitilenleri idrak etmek olduğunu, görmesi olduğunu ve görmenin manasının eşyayı görmek olduğunu, O'nun uluvvü (yüceliği) olduğunu, nüzulü olduğunu, gelişi (mecî' ve ityân) olduğunu isbat edersen, müfevvide göre kâfir olmuşsundur."]]}, {"reader": false, "ar": [[1650.0, "فإذًا تركُ الناس بلا كتابٍ كان أسلمَ لهم في دينهم من إنزال الكتاب الذي سيفهم منه أصحابُ اللغة ما يدلّ عليه لسانُ العرب،"], [1663.0, "ولكن عند المفوِّضة إذا فهمتَ هذا المعنى فقد كفرت. أعوذ بالله."]], "tr": [[1650.0, "O hâlde insanları kitapsız bırakmak, dinleri için, dil ehlinin ondan Arap dilinin delâlet ettiği şeyi anlayacağı kitabı indirmekten daha selametli olurdu."], [1663.0, "Fakat Müfevvize'ye göre bu manayı anlarsan kâfir olmuşsundur. Allah'a sığınırım."]]}]}, {"ts": "27:49", "title": "3. Külliye (sonu): Resûl'ü ve ashâbını cahil saymak · Kapanış", "paras": [{"reader": false, "ar": [[1669.0, "ومنها كذلك ـ ولعلّه آخرها ـ:"], [1673.0, "تجهيلُ الرسول وأصحابه، تجهيلُ الرسول صلى الله عليه وسلم وأصحابه."], [1680.0, "فإنّ المفوِّضة يزعمون أنّ الرسول سمع من جبريل كلامًا لا يفهم معناه،"], [1688.0, "وأنه بلّغ الصحابةَ كلامًا هو نفسُه لا يعلم معناه،"], [1693.0, "وأنّ الصحابة قد سمعوا كلامًا فيه أسماءٌ وصفاتٌ لله عز وجل،"], [1697.0, "ولكن لم يفهموا معناه،"], [1699.0, "ولم يسألوا رسول الله صلى الله عليه وسلم عن المعنى."]], "tr": [[1669.0, "Bunlardan biri de —belki sonuncusu— Resûl'ü ve ashâbını cahil saymaktır;"], [1676.0, "Resûl sallallâhu aleyhi ve sellem'i ve ashâbını cahil saymaktır."], [1680.0, "Çünkü Müfevvize iddia eder ki Resûl Cebrâil'den manasını anlamadığı bir söz işitmiş, sahabeye kendisinin de manasını bilmediği bir sözü tebliğ etmiş;"], [1692.4, "sahabe de içinde Allah Azze ve Celle'ye ait isim ve sıfatlar bulunan bir söz işitmiş, fakat manasını anlamamış ve Resûlullah sallallâhu aleyhi ve sellem'e de manasını sormamış."]]}, {"reader": false, "ar": [[1704.0, "ثم الصحابة بعد ذلك نقلوا هذه الآيات وتلك النصوص من الوحي إلى الأمة،"], [1709.0, "مع أنهم لا يعلمون معناها."], [1710.9, "إذًا الأمةُ من أولها إلى آخرها كلُّها جاهلة؛"], [1714.4, "خُوطِبنا بوحيٍ نجهله، وأُرسِل لنا رسولٌ لا يفهم شيئًا من هذا الوحي ـ حاشاه وكلّا،"], [1721.4, "صلى الله عليه وسلم ـ."], [1723.0, "فيقولون: إنّ النبيّ صلى الله عليه وسلم تكلّم بكلامٍ هو نفسُه لا يفهم معناه،"], [1732.0, "وأنّ الصحابة سمعوا كلامًا هم أنفسهم لا يعلمون معناه."]], "tr": [[1704.0, "Sonra sahabe bundan sonra bu ayetleri ve vahyin bu naslarını, manalarını bilmedikleri hâlde ümmete nakletmiş."], [1710.9, "O hâlde ümmetin başından sonuna hepsi cahildir:"], [1714.4, "Bilmediğimiz bir vahiyle muhatap kılındık ve bize bu vahiyden hiçbir şey anlamayan bir resul gönderildi —hâşâ ve kellâ, sallallâhu aleyhi ve sellem—."], [1723.0, "Diyorlar ki: Peygamber sallallâhu aleyhi ve sellem kendisinin de manasını anlamadığı bir sözle konuştu;"], [1732.0, "sahabe de kendilerinin manasını bilmediği bir söz işitti."]]}, {"reader": false, "ar": [[1736.0, "ولذلك تركُ الناس بلا رسالةٍ خيرٌ لهم من أن يُرسَل لهم رسول،"], [1742.0, "أو يُنزَل عليهم وحيٌ لم يزدادوا بنزوله إلا ضلالًا وتيهًا وحيرةً وشكًّا فقط."], [1750.0, "ما أدري، أنتم معي؟"], [1752.0, "نعم. أسأل الله عز وجل أن يعافينا وإيّاكم من كلّ شر."], [1757.0, "ولذلك هذه اللوازم لو تدبّرها العاقل لفهم أنّ هذا المذهب من أخبث المذاهب."]], "tr": [[1736.0, "Bu yüzden insanları risaletsiz bırakmak, onlara bir resul gönderilmesinden veya indirilmesiyle sadece sapıklık, şaşkınlık, hayret ve şüpheden başka bir şey artırmadıkları bir vahyin indirilmesinden daha hayırlıdır."], [1750.0, "Bilmiyorum, benimle misiniz? Evet. Allah Azze ve Celle'den bizi ve sizi her kötülükten âfiyette kılmasını dilerim."], [1757.0, "Bu yüzden akıllı kimse bu lâzımları düşünse, bu mezhebin mezheplerin en habislerinden olduğunu anlardı."]]}, {"reader": false, "ar": [[1763.0, "ولذلك يقول ابن تيمية:"], [1765.0, "«فمذهبُ أهل التجهيل ـ وهم المفوِّضة ـ من شرّ أقوال أهل البدع»،"], [1770.0, "من شرّ أقوال أهل البدع."], [1774.0, "فإنّ المحرِّف، فإنّ المحرِّف إذا نقلك من معنًى إلى معنًى آخر فإنه يفتح لك بابَ تعبّدٍ ولو بالمعنى الآخر،"], [1783.0, "لكن لا يقطع عليك باب التعبّد."], [1787.0, "لكن أمّا المفوِّض فإنه يقول:"], [1789.1, "لا يجوز لك أن تفهم ظاهر المعنى،"], [1792.0, "ولن أنقلك لمعنًى آخر تتعبّد به،"], [1794.0, "بل تبقى هكذا بلا فهم،"], [1797.0, "تبقى هكذا بلا فهم."]], "tr": [[1763.0, "Bu yüzden İbn Teymiyye şöyle der:"], [1765.0, "\"Techîl ehlinin —ki onlar Müfevvize'dir— mezhebi, bid'at ehlinin sözlerinin en kötülerindendir\";"], [1770.0, "bid'at ehlinin sözlerinin en kötülerindendir."], [1774.0, "Çünkü muharrif (tahrif eden), seni bir manadan başka bir manaya naklettiğinde, diğer mana ile de olsa sana bir taabbüd kapısı açar;"], [1784.3, "taabbüd kapısını sana kapatmaz. Fakat müfevvide gelince, şöyle der:"], [1789.1, "\"Mananın zahirini anlaman caiz değildir;"], [1791.2, "seni onunla kulluk edeceğin başka bir manaya da nakletmeyeceğim.\" Bilakis böylece anlayışsız kalırsın; böylece anlayışsız kalırsın."]]}, {"reader": false, "ar": [[1800.0, "أسأل الله أن يوفّقنا وإيّاكم لكلّ خير،"], [1804.0, "وأن يُعيذنا وإيّاكم من نزغات الشيطان الرجيم."], [1806.0, "والله أعلم، وصلى الله وسلم على نبينا محمد."]], "tr": [[1800.0, "Allah'tan bizi ve sizi her hayra muvaffak kılmasını ve bizi ve sizi kovulmuş şeytanın vesveselerinden korumasını dilerim."], [1805.7, "Allah en iyisini bilir. Allah Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';

D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
