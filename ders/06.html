<script>
const D={"no": 6, "vid": "VUE-F1yzt0M", "title_ar": "الدرس (٦) من شرح كليات العقيدة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 6. Ders: Sünnetin Hücciyeti, Ehl-i Kıble, Cehalet Özrü ve Bid'at Ehlinin Alametleri", "sections": [{"ts": "00:00", "title": "19. Külliye: Sünneti delil olmaktan iptal eden kâfirdir", "paras": [{"reader": false, "ar": [[0.0, "ومن الكلّيّات أيضًا: <b>كلُّ من عطّل السنةَ عن أصل الاحتجاج بها فكافر.<\/b> وتكفيره مُجمَعٌ عليه بين أهل العلم،"], [11.4, "حكاه الإمام ابن حزم وغيرُه كالسيوطي وغيره."], [15.8, "قال ابن حزم رحمه الله:"], [36.0, "«لو أن امرأً قال: لا نأخذ إلا بما في القرآن، لكان كافرًا بإجماع الأمة»."], [41.0, "وكذلك حكاه السيوطي، وحكاه ابن باز من المعاصرين،"], [47.0, "وحكاه غيرُهم من أهل العلم."]], "tr": [[0.0, "Külliyelerden biri de şudur: 19."], [1.9, "külliye: Sünneti, delil olma aslından iptal eden (ta'til eden) herkes kâfirdir. Onun tekfiri ehl-i ilim arasında icma ile sabittir;"], [12.7, "bunu İmam İbn Hazm ve başkaları, mesela Suyûtî ve diğerleri nakletmiştir."], [36.0, "İbn Hazm (rahimehullah) şöyle der:"], [37.4, "\"Bir kişi 'Kur'an'da olandan başkasını almayız' dese, ümmetin icmaıyla kâfir olur.\" Suyûtî de böyle nakletmiş, çağdaşlardan İbn Bâz da nakletmiş, ehl-i ilimden başkaları da nakletmiştir."]]}, {"reader": false, "ar": [[50.0, "وعلّةُ تكفيره: لأنه مكذّبٌ لأدلة القرآن المثبِتة لحجّيّة السنة،"], [60.0, "كقول الله عز وجل:"], [62.3, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ﴾<\/span> <span class=\"ref\">[النساء: ٥٩]<\/span>،"], [67.0, "وكقول الله عز وجل:"], [68.6, "<span class=\"ayah\">﴿مَّن يُطِعِ الرَّسُولَ فَقَدْ أَطَاعَ اللَّهَ﴾<\/span> <span class=\"ref\">[النساء: ٨٠]<\/span>،"], [71.0, "وكقول الله عز وجل:"], [73.8, "<span class=\"ayah\">﴿فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّىٰ يُحَكِّمُوكَ﴾<\/span> ـ أي كتابًا وسنةً ـ <span class=\"ayah\">﴿فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لَا يَجِدُوا فِي أَنفُسِهِمْ حَرَجًا مِّمَّا قَضَيْتَ وَيُسَلِّمُوا تَسْلِيمًا﴾<\/span> <span class=\"ref\">[النساء: ٦٥]<\/span>،"], [86.0, "وكقول الله عز وجل:"], [87.7, "<span class=\"ayah\">﴿وَمَا كَانَ لِمُؤْمِنٍ وَلَا مُؤْمِنَةٍ إِذَا قَضَى اللَّهُ﴾<\/span> ـ أي في القرآن ـ <span class=\"ayah\">﴿وَرَسُولُهُ﴾<\/span> ـ أي في السنة ـ <span class=\"ayah\">﴿أَمْرًا أَن يَكُونَ لَهُمُ الْخِيَرَةُ مِنْ أَمْرِهِمْ﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٦]<\/span>."]], "tr": [[50.0, "Tekfirinin illeti şudur: O, Kur'an'ın sünnetin hüccet olduğunu isbat eden delillerini yalanlamaktadır."], [60.0, "Mesela Allah Teâlâ şöyle buyurur:"], [62.3, "<span class=\"ayah\">﴿Ey iman edenler! Allah'a itaat edin, Resûl'e de itaat edin﴾<\/span> [Nisâ 59]."], [67.0, "Yine Allah Teâlâ şöyle buyurur:"], [68.6, "<span class=\"ayah\">﴿Kim Resûl'e itaat ederse Allah'a itaat etmiş olur﴾<\/span> [Nisâ 80]."], [71.0, "Yine Allah Teâlâ şöyle buyurur:"], [73.8, "<span class=\"ayah\">﴿Hayır, Rabbine andolsun ki, aralarında çıkan anlaşmazlıklarda seni hakem kılmadıkça —yani Kitap ve Sünnet'i— sonra da verdiğin hükümden içlerinde hiçbir sıkıntı duymadan tam bir teslimiyetle teslim olmadıkça iman etmiş olmazlar﴾<\/span> [Nisâ 65]."], [87.7, "Yine Allah Teâlâ şöyle buyurur:"], [88.9, "<span class=\"ayah\">﴿Allah —yani Kur'an'da— ve Resûlü —yani Sünnet'te— bir işe hükmettiği zaman, hiçbir mümin erkek ve mümin kadına o işte başka bir seçim hakkı yoktur﴾<\/span> [Ahzâb 36]."]]}, {"reader": false, "ar": [[97.0, "وكقول الله عز وجل:"], [100.0, "<span class=\"ayah\">﴿فَإِن تَنَازَعْتُمْ فِي شَيْءٍ فَرُدُّوهُ إِلَى اللَّهِ﴾<\/span> ـ أي إلى القرآن ـ <span class=\"ayah\">﴿وَالرَّسُولِ﴾<\/span> ـ أي إلى السنة."], [107.0, "<span class=\"note\">(Şeyh «وإلى الرسول» diyor.)<\/span> إذ لا يمكن أن يكون الردُّ المأمور به إلى الرسول هو الردَّ إلى القرآن،"], [112.0, "لأن الردَّ إلى القرآن قد ذُكر سابقًا في الردّ إلى الله."], [116.0, "ثم قال الله عز وجل:"], [119.0, "<span class=\"ayah\">﴿إِن كُنتُمْ تُؤْمِنُونَ بِاللَّهِ وَالْيَوْمِ الْآخِرِ ۚ ذَٰلِكَ خَيْرٌ وَأَحْسَنُ تَأْوِيلًا﴾<\/span> <span class=\"ref\">[النساء: ٥٩]<\/span>."]], "tr": [[97.0, "Yine Allah Teâlâ şöyle buyurur:"], [100.0, "<span class=\"ayah\">﴿Bir şeyde anlaşmazlığa düşerseniz onu Allah'a —yani Kur'an'a— ve Resûl'e —yani Sünnet'e— götürün﴾<\/span>."], [107.0, "Çünkü Resûl'e götürülmesi emredilen şeyin, Kur'an'a götürmek olması mümkün değildir;"], [111.0, "zira Kur'an'a götürmek daha önce \"Allah'a götürmek\" ifadesinde zikredilmiştir."], [114.1, "Sonra Allah Teâlâ şöyle buyurdu:"], [116.0, "<span class=\"ayah\">﴿Eğer Allah'a ve ahiret gününe iman ediyorsanız. Bu daha hayırlı ve netice bakımından daha güzeldir﴾<\/span> [Nisâ 59]."]]}, {"reader": false, "ar": [[123.0, "وكقول الله عز وجل:"], [125.0, "<span class=\"ayah\">﴿وَمَا آتَاكُمُ الرَّسُولُ﴾<\/span> ـ أي كتابًا وسنةً ـ <span class=\"ayah\">﴿فَخُذُوهُ﴾<\/span>،"], [131.0, "وهذا أمرٌ، والأمر يقتضي الوجوب،"], [134.0, "<span class=\"ayah\">﴿وَمَا نَهَاكُمْ عَنْهُ﴾<\/span> ـ أي في الكتاب والسنة ـ <span class=\"ayah\">﴿فَانتَهُوا﴾<\/span> <span class=\"ref\">[الحشر: ٧]<\/span>."], [139.0, "وكقول الله عز وجل:"], [141.0, "<span class=\"ayah\">﴿وَمَا يَنطِقُ عَنِ الْهَوَىٰ ۝ إِنْ هُوَ إِلَّا وَحْيٌ يُوحَىٰ﴾<\/span> <span class=\"ref\">[النجم: ٣–٤]<\/span>."], [147.0, "وكقول الله عز وجل:"], [149.0, "<span class=\"ayah\">﴿قُلْ إِن كُنتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي﴾<\/span> <span class=\"ref\">[آل عمران: ٣١]<\/span>،"], [152.0, "أي: في أقوالي، وفي أفعالي،"], [155.0, "وفي تركي، وفي تقريراتي،"], [158.0, "وهي أقسام السنة الأربعة."]], "tr": [[123.0, "Yine Allah Teâlâ şöyle buyurur:"], [125.0, "<span class=\"ayah\">﴿Peygamber size ne verdiyse —yani Kitap ve Sünnet olarak— onu alın﴾<\/span>;"], [131.0, "bu bir emirdir, emir de vücûbu gerektirir;"], [134.0, "<span class=\"ayah\">﴿size neyi yasakladıysa —yani Kitap ve Sünnet'te— ondan kaçının﴾<\/span> [Haşr 7]."], [139.0, "Yine Allah Teâlâ şöyle buyurur:"], [141.0, "<span class=\"ayah\">﴿O, hevâsından konuşmaz. O (söyledikleri), ancak vahyedilen bir vahiydir﴾<\/span> [Necm 3–4]."], [147.0, "Yine Allah Teâlâ şöyle buyurur:"], [149.0, "<span class=\"ayah\">﴿De ki: Eğer Allah'ı seviyorsanız bana uyun﴾<\/span> [Âl-i İmrân 31];"], [152.7, "yani sözlerimde, fiillerimde, terklerimde ve takrirlerimde (onaylarımda). Bunlar sünnetin dört kısmıdır."]]}, {"reader": false, "ar": [[159.0, "فإن السنة يُحتجّ فيها بقول رسول الله صلى الله عليه وسلم،"], [165.0, "وبما ثبت من أفعاله،"], [166.0, "وبما ثبت من تركه وإقراراته؛"], [170.0, "كلُّها إذا صحّ سندها تُعتبر حجةً لأنها سنة."], [175.0, "والأدلة من القرآن المثبِتة للسنة كثيرةٌ جدًّا،"], [181.0, "كما قال الله عز وجل:"], [184.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَجِيبُوا لِلَّهِ وَلِلرَّسُولِ إِذَا دَعَاكُمْ لِمَا يُحْيِيكُمْ﴾<\/span> <span class=\"ref\">[الأنفال: ٢٤]<\/span>."], [191.0, "فالاستجابة لله: أي الاستجابة لنداءات القرآن،"], [196.0, "والاستجابة للرسول صلى الله عليه وسلم:"], [198.5, "أي الاستجابة لما صحّ من سنته."]], "tr": [[159.0, "Sünnette Resûlullah ﷺ'in sözüyle, sabit olan fiilleriyle, sabit olan terkleri ve onaylarıyla delil getirilir."], [165.5, "Bunların hepsi, senedi sahih olduğunda hüccet sayılır;"], [170.0, "çünkü sünnettir. Kur'an'dan sünneti isbat eden deliller pek çoktur."], [175.0, "Nitekim Allah Teâlâ şöyle buyurur:"], [178.7, "<span class=\"ayah\">﴿Ey iman edenler! Sizi, size hayat verecek şeye çağırdığı zaman Allah'a ve Resûl'e icabet edin﴾<\/span> [Enfâl 24]."], [191.0, "Allah'a icabet, Kur'an'ın çağrılarına icabet etmektir;"], [196.0, "Resûl ﷺ'e icabet ise onun sünnetinden sahih olana icabet etmektir."]]}, {"reader": false, "ar": [[201.0, "ولذلك يقول النبي صلى الله عليه وسلم في حديث العرباض بن سارية:"], [207.0, "«إنه من يعش منكم فسيرى اختلافًا كثيرًا، فعليكم بسنتي وسنة الخلفاء الراشدين المهديين، تمسّكوا بها وعَضّوا عليها بالنواجذ»،"], [218.8, "الحديثَ بتمامه. ويقول النبي صلى الله عليه وسلم:"], [223.0, "«لا أُلفينّ أحدَكم متكئًا على أريكته يأتيه الأمر من أمري، مما أمرتُ به» ـ أي في السنة ـ «أو نهيتُ عنه، فيقول: لا ندري، ما وجدنا في كتاب الله اتّبعنا»."]], "tr": [[201.0, "Bu yüzden Nebî ﷺ, İrbâd b."], [203.0, "Sâriye hadisinde şöyle buyurur: \"Sizden yaşayan çok ihtilaf görecektir."], [207.0, "Size benim sünnetimi ve hidayete ermiş râşid halifelerin sünnetini tutmanızı tavsiye ederim;"], [212.2, "ona sarılın ve azı dişlerinizle sımsıkı tutun.\" Hadisin tamamı (bilinmektedir)."], [220.0, "Nebî ﷺ yine şöyle buyurur:"], [223.0, "\"Sizden birinizi koltuğuna yaslanmış hâlde, emrettiğim —yani sünnette— ya da yasakladığım bir emrim kendisine geldiğinde 'Bilmeyiz, Allah'ın Kitabı'nda ne bulduysak ona uyarız' derken bulmayayım.\""]]}, {"reader": false, "ar": [[238.0, "وكقوله صلى الله عليه وسلم:"], [242.0, "«ألا وإني أوتيت القرآن ومثلَه معه، ألا يوشك رجلٌ شبعانُ متكئٌ على أريكته يأتيه الأمر من أمري فيقول: عليكم بهذا القرآن، فما وجدتم فيه من حلالٍ فأحلّوه، وما وجدتم فيه من حرامٍ فحرّموه. ألا وإنما حرّم رسول الله كما حرّم الله»،"], [270.0, "حديثٌ صحيحٌ لغيره. والأدلة على ذلك كثيرةٌ جدًّا."]], "tr": [[238.0, "Yine onun ﷺ şu sözü gibi:"], [238.8, "\"Dikkat edin! Bana Kur'an ve onunla birlikte onun bir benzeri verildi."], [242.0, "Dikkat edin! Karnı tok, koltuğuna yaslanmış bir adamın, kendisine emrimden bir emir geldiğinde 'Size bu Kur'an yeter;"], [254.8, "onda helal olarak ne bulduysanız helal sayın, haram olarak ne bulduysanız haram sayın' demesi yakındır."], [264.5, "Dikkat edin! Resûlullah'ın haram kıldığı, Allah'ın haram kıldığı gibidir.\" Bu, sahih li-gayrihî bir hadistir."], [273.0, "Bu konudaki deliller pek çoktur."]]}, {"reader": false, "ar": [[276.0, "وقد وقع إجماعُ أهل العلم على أن السنة حجةٌ باعتبار أصلها وفصلها،"], [285.0, "ولا حقَّ لأحدٍ أن يردّ شيئًا من السنة صحّ سنده إلى النبي صلى الله عليه وسلم."], [292.0, "ولذلك فالسنة حجةٌ متى ما صحّت عن رسول الله صلى الله عليه وسلم."], [299.0, "والذي يجعلني أتكلم عن دليل السنة:"], [302.0, "لأن كثيرًا من العقائد ستمرّ عليكم دليلُها من السنة،"], [307.0, "وستسمعون أهل البدع بإجماعهم يقولون:"], [310.0, "هذا حديثُ آحاد، ولا نقبل في العقائد إلا المتواترات."]], "tr": [[276.0, "Ehl-i ilim, sünnetin hem aslı hem de ayrıntısı itibarıyla hüccet olduğu konusunda icma etmiştir."], [285.9, "Senedi Nebî ﷺ'e kadar sahih olan sünnetten herhangi bir şeyi reddetmeye kimsenin hakkı yoktur."], [292.0, "Bu yüzden sünnet, Resûlullah ﷺ'den sahih olarak geldiği sürece hüccettir."], [297.4, "Beni sünnet delilinden bahsetmeye sevk eden şey şudur:"], [302.0, "Birçok akîdenin delilinin sünnetten olduğunu göreceksiniz;"], [304.8, "bid'at ehlinin de hep birlikte \"Bu bir âhâd hadistir;"], [310.0, "akîdede sadece mütevatirleri kabul ederiz\" dediklerini işiteceksiniz."]]}]}, {"ts": "05:16", "title": "19. Külliye (devam): Sünnetle sabit olan sıfatlar", "paras": [{"reader": false, "ar": [[316.0, "فنحن معاشرَ أهل السنة نُثبت لله صفة الضحك على الوجه اللائق به،"], [321.0, "وحجّتنا السنة، بقول النبي صلى الله عليه وسلم:"], [325.0, "«يضحك الله إلى رجلين يقتل أحدهما الآخر، كلاهما يدخلان الجنة»."], [333.0, "ونحن نثبت صفة الأصابع لله عز وجل،"], [337.0, "ودليلها السنة، في قول النبي صلى الله عليه وسلم:"], [341.0, "«إن قلوب بني آدم كلَّها بين إصبعين من أصابع الرحمن كقلبٍ واحد»."]], "tr": [[316.0, "Biz Ehl-i Sünnet topluluğu, Allah için O'na yakışan şekilde gülme (dahk) sıfatını isbat ederiz."], [323.0, "Delilimiz sünnettir; Nebî ﷺ'in şu sözüdür:"], [325.0, "\"Allah, biri diğerini öldüren iki adama güler;"], [333.0, "ikisi de cennete girer.\" Allah Teâlâ için parmaklar sıfatını da isbat ederiz;"], [338.3, "delili sünnettir, Nebî ﷺ'in şu sözüdür:"], [341.0, "\"Âdemoğullarının kalplerinin hepsi, Rahmân'ın parmaklarından iki parmak arasında tek bir kalp gibidir.\""]]}, {"reader": false, "ar": [[348.0, "ونُثبت صفة الملل لله عز وجل على الوجه اللائق به،"], [354.0, "ليس كمَلَل المخلوقين، يقال فيه ما يقال في سائر صفاته عز وجل:"], [358.0, "«فوالله لا يملّ الله حتى تملّوا»."], [361.0, "ونثبت صفة الفرح لله عز وجل،"], [366.0, "وبرهانها السنة، في قول النبي صلى الله عليه وسلم في الصحيح:"], [370.0, "«لَلّهُ أشدُّ فرحًا بتوبة عبده حين يتوب»،"], [374.0, "الحديثَ بتمامه. ونثبت صفة النزول لله عز وجل،"], [381.0, "وبرهانها السنة: «ينزل ربنا إلى السماء الدنيا»."]], "tr": [[348.0, "Allah Teâlâ için O'na yakışan şekilde, mahlûkların usanması gibi olmayan usanma (melel) sıfatını da isbat ederiz;"], [355.3, "onun hakkında da diğer sıfatları hakkında söylenen söylenir:"], [358.0, "\"Vallahi siz usanmadıkça Allah usanmaz.\" Allah Teâlâ için sevinme (ferah) sıfatını da isbat ederiz;"], [368.3, "burhanı sünnettir, Nebî ﷺ'in Sahîh'teki şu sözüdür:"], [370.0, "\"Allah, kulunun tövbe ettiği zamanki tövbesine (sizden birinin sevincinden) daha çok sevinir.\" Hadisin tamamı (bilinmektedir)."], [376.0, "Allah Teâlâ için nüzul sıfatını da isbat ederiz;"], [384.0, "burhanı sünnettir: \"Rabbimiz dünya semasına iner.\""]]}, {"reader": false, "ar": [[386.0, "وهناك عقائد كثيرة إنما نُثبتها بدليل السنة."], [390.0, "فلا يجوز لأحدٍ أن يأتيك… فلا تقبل قول من يأتيك ويقول:"], [395.4, "إن السنة ليست بحجة."], [397.0, "فلا بد أن نتكلم عن دليل السنة في مقدّمات العقائد."]], "tr": [[386.0, "Sadece sünnet deliliyle isbat ettiğimiz daha pek çok akîde vardır."], [390.0, "Kimsenin sana gelip… Sana gelip \"Sünnet hüccet değildir\" diyenin sözünü kabul etme."], [397.0, "Bu yüzden akîdelerin mukaddimelerinde sünnet delilinden bahsetmemiz gerekir."]]}]}, {"ts": "06:42", "title": "20. Külliye: Sahih sünneti \"kabul ve ret\" taksimine tabi tutmak", "paras": [{"reader": false, "ar": [[402.0, "ثم نقول: من الكليات أيضًا:"], [407.0, "<b>كلُّ من قسّم السنة الصحيحة تقسيمَ قبولٍ وردٍّ فمفتتحُ بابِ ضلالة.<\/b> كلُّ من قسّم السنة تقسيم قبول وردّ… السنة الصحيحة يا جماعة؛"], [420.0, "كلُّ من قسّم السنة الصحيحة تقسيم قبول وردّ فمفتتحُ باب ضلالة."]], "tr": [[402.0, "Sonra deriz ki: Külliyelerden biri de şudur:"], [407.0, "<b>20. külliye: Sahih sünneti \"kabul ve ret\" taksimine tabi tutan herkes bir dalalet kapısı açmaktadır.<\/b> Sünneti kabul ve ret taksimine tabi tutan herkes… Sahih sünneti, ey cemaat!"], [420.0, "Sahih sünneti kabul ve ret taksimine tabi tutan herkes bir dalalet kapısı açmaktadır."]]}, {"reader": false, "ar": [[430.0, "وذلك لأن هذا التقسيم لم يشهد له دليل الشرع بالاعتبار."], [439.0, "فالسنة متى ما صحّ سندها إلى النبي صلى الله عليه وسلم ولم تُنسخ فلا يجوز ردُّها،"], [445.6, "ولا إدخالُ أيّ تقسيمٍ عليها يوجب قبولَ بعضها وردَّ بعضها؛"], [451.0, "فإنّ حقَّ وواجبَ السنة الصحيحة قبولُها،"], [455.1, "واعتمادُ مدلولها، وتحرُم مخالفتها، والإيمانُ بمقتضاها."]], "tr": [[430.0, "Bunun sebebi, şer'î delilin bu taksime itibar ettiğine şahitlik etmemesidir."], [439.0, "Sünnetin senedi Nebî ﷺ'e kadar sahih olduğu ve neshedilmediği sürece onu reddetmek de, ona bir kısmının kabulünü, bir kısmının reddini gerektiren herhangi bir taksim sokmak da caiz değildir."], [447.2, "Çünkü sahih sünnetin hakkı ve ona karşı vacip olan;"], [451.0, "onu kabul etmek, delalet ettiği manaya dayanmak ve gereğine iman etmektir; ona muhalefet etmek haramdır."]]}, {"reader": false, "ar": [[461.0, "لكننا نرى أهل البدع يُدخلون تقسيماتٍ على ما صحّ من السنة توجب قبولَ بعضها وردَّ بعضها،"], [471.0, "كتقسيم السنة إلى متواترٍ وآحاد تقسيمَ قبولٍ وردّ؛"], [477.0, "فيقبلون المتواترات في العقائد،"], [480.0, "ويردّون الآحادَ الصحيحة في العقائد."], [483.0, "فهذا تقسيمٌ للسنة الصحيحة يتضمّن قبولًا وردًّا،"], [488.0, "وهذا من شأن أهل البدع."]], "tr": [[461.0, "Fakat bid'at ehlinin, sünnetten sahih olana, bir kısmının kabulünü, bir kısmının reddini gerektiren taksimler soktuğunu görüyoruz."], [469.1, "Mesela sünneti kabul ve ret taksimi olarak mütevatir ve âhâd diye ayırmaları gibi:"], [477.0, "Akîdede mütevatirleri kabul ediyor, akîdede sahih âhâd haberleri reddediyorlar."], [483.0, "Bu, sahih sünnetin kabul ve ret içeren bir taksimidir;"], [488.0, "bu da bid'at ehlinin işidir."]]}, {"reader": false, "ar": [[490.0, "ولذلك فقد أجمع أهل السنة والجماعة على أن خبر الآحاد حجةٌ في باب العقائد إذا صحّ سنده إلى النبي صلى الله عليه وسلم،"], [502.0, "وكم أثبتنا من العقائد بدليل حديث الآحاد،"], [508.0, "كما ذكرتُ لكم طرفًا منها في الكلية التي قبلها."], [511.0, "وقولُ من قال بأننا لا نقبل في العقائد إلا المتواترات هو قولُ زورٍ وكذبٍ لُبِس بلَبوس الحق."]], "tr": [[490.0, "Bu yüzden Ehl-i Sünnet ve'l-Cemaat, senedi Nebî ﷺ'e kadar sahih olduğunda âhâd haberin akîde babında hüccet olduğu konusunda icma etmiştir."], [501.6, "Âhâd hadis deliliyle nice akîdeler isbat ettik;"], [508.0, "bir önceki külliyede bunlardan bir kısmını size zikrettim."], [511.0, "\"Akîdede sadece mütevatirleri kabul ederiz\" diyenin sözü, hak elbisesi giydirilmiş bir yalan ve iftira sözüdür."]]}, {"reader": false, "ar": [[524.0, "فإن القوم لا يريدون إثباتَ الصفات لله عز وجل،"], [528.0, "ولكنهم قدَروا على الآحاد مضمونًا وسندًا،"], [533.0, "فقالوا: لا نقبله، نحن نردّ معناه وسنده."], [537.0, "ولما جاءت المتواترات وشَرِقوا بها قالوا:"], [540.6, "نقبلها ظاهرًا لأن سندها متواترٌ قطعي،"], [544.0, "ولكن نهجم على معناها فنحرّفها."]], "tr": [[524.0, "Çünkü bu topluluk Allah Teâlâ için sıfatları isbat etmek istemiyor."], [527.1, "Fakat âhâd haberlere hem muhteva hem de sened bakımından güçleri yetti;"], [533.6, "\"Onu kabul etmeyiz; biz onun manasını da senedini de reddederiz\" dediler."], [537.0, "Mütevatirler gelince de onlarla boğazlarına bir şey takılmış gibi oldular ve \"Senedleri mütevatir ve kat'î olduğu için onları zahiren kabul ederiz;"], [544.0, "fakat manalarına saldırır ve onları tahrif ederiz\" dediler."]]}, {"reader": false, "ar": [[546.0, "فقولهم بأننا لا نقبل في العقائد إلا المتواترات:"], [551.0, "هل قبلوا صفة الاستواء وهي ثابتةٌ بالتواتر؟"], [555.0, "هل قبلوا صفة الوجه وهي ثابتةٌ بالتواتر؟"], [558.0, "هل قبلوا صفة اليدين وهي ثابتةٌ بالتواتر؟"], [561.0, "الجواب: لم يقبلوا شيئًا من ذلك أبدًا."], [564.0, "لكنهم عجزوا عن ردّ المتواتر سندًا لأنهم سيُفضَحون،"], [568.0, "وقدَروا على ردّ الآحاد سندًا ومتنًا،"], [573.0, "لأنهم سيظهرون في مظهر المحافظ على العقيدة الإسلامية،"], [578.0, "والذي لا يريد أن يُثبت فيها إلا ما كان قطعيًّا يقينيًّا متواترًا."]], "tr": [[546.0, "\"Akîdede sadece mütevatirleri kabul ederiz\" sözlerine gelince:"], [551.0, "Mütevatir olarak sabit olan istivâ sıfatını kabul ettiler mi?"], [555.0, "Mütevatir olarak sabit olan yüz (vech) sıfatını kabul ettiler mi?"], [558.0, "Mütevatir olarak sabit olan iki el sıfatını kabul ettiler mi?"], [561.4, "Cevap: Bunlardan hiçbirini asla kabul etmediler."], [564.0, "Fakat mütevatiri sened bakımından reddetmekten âciz kaldılar;"], [566.5, "çünkü rezil olacaklardı. Âhâd haberi ise hem sened hem metin bakımından reddetmeye güç yetirdiler;"], [574.9, "çünkü böylece İslam akîdesini koruyan, onda sadece kat'î, yakînî ve mütevatir olanı isbat etmek isteyen kimse görüntüsünde ortaya çıkacaklardı."]]}, {"reader": false, "ar": [[582.0, "وإلا فالحقيقة أن هذا التقسيم تقسيمٌ بدعي،"], [587.0, "لأنه تقسيمٌ للسنة الصحيحة تقسيمَ قبولٍ وردّ،"], [591.0, "وهذا غير مقبولٍ عند أهل السنة والجماعة."], [593.0, "وكتقسيم الأئمة الحنفية ـ وإن كنا لا نبدّعهم في هذا التقسيم، ولكن نمنعهم منه ـ"]], "tr": [[582.0, "Yoksa hakikat şu ki bu taksim bid'î bir taksimdir;"], [587.0, "çünkü sahih sünneti kabul ve ret taksimine tabi tutmaktır."], [591.0, "Bu da Ehl-i Sünnet ve'l-Cemaat katında kabul edilmez."], [593.0, "Hanefî imamların taksimi de böyledir —gerçi bu taksimden dolayı onları bid'atçi saymıyoruz, fakat onları bundan men ediyoruz—"]]}]}, {"ts": "10:02", "title": "20. Külliye (devam): Umûmu'l-belvâda âhâd haber; usûl-i hadisteki taksim", "paras": [{"reader": false, "ar": [[602.0, "فإن بعض الحنفية قسّموا السنة الآحادية إلى سنة… انتبه،"], [611.0, "فإنهم قسّموا السنة إلى متواترةٍ وآحاد،"], [615.0, "وجعلوا المتواتر مقبولًا فيما تعمّ به البلوى،"], [619.0, "والآحاد غير مقبولٍ فيما تعمّ به البلوى."], [622.0, "فهذا تقسيمٌ للسنة الصحيحة تقسيمَ قبولٍ وردّ،"], [626.7, "وهذا باطل. ولذلك فالمتقرّر في القواعد عندنا أن خبر الآحاد حجةٌ فيما تعمّ به البلوى خلافًا للحنفية،"], [639.0, "رحم الله أمواتهم، وثبّت أحياءهم،"], [641.8, "وغفر لهم هذه الزلّة."]], "tr": [[602.0, "Çünkü bazı Hanefîler âhâd sünneti … sünnete ayırdılar… Dikkat et:"], [611.0, "Sünneti mütevatir ve âhâd diye ayırdılar;"], [614.3, "umûmu'l-belvâ (herkesin karşılaştığı ve bilmesi gereken) konularda mütevatiri makbul, âhâdı ise umûmu'l-belvâ konularında makbul değil saydılar."], [622.0, "Bu, sahih sünneti kabul ve ret taksimine tabi tutmaktır ve bâtıldır."], [628.0, "Bu yüzden bizim kaidelerimizde yerleşik olan şudur:"], [632.0, "Hanefîlerin aksine, âhâd haber umûmu'l-belvâ konularında hüccettir."], [636.0, "Allah onların ölülerine rahmet etsin, dirilerine sebat versin ve bu hatalarını bağışlasın."]]}, {"reader": false, "ar": [[644.0, "فلا يزال أهل السنة والجماعة يستدلّون بأحاديث الآحاد في أبواب الاعتقاد أيًّا كان بابُها:"], [655.0, "أفي توحيد الألوهية، أو في توحيد الربوبية،"], [659.0, "أو في توحيد الأسماء والصفات،"], [662.0, "أو في مسائل الأحكام والدين ومرتكب الكبيرة،"], [665.0, "أو في باب القضاء والقدر؛"], [667.0, "فما دام سنده صحيحًا فإنهم يقبلونه،"], [673.0, "ولا يردّونه لأنه آحاد."], [675.0, "فانتبهوا لهذا، لأنكم ستواجهون في دراسة العقيدة أقوامًا يقسّمون السنة الصحيحة في كثيرٍ من الأبواب تقسيمَ قبولٍ وردّ."]], "tr": [[644.0, "Ehl-i Sünnet ve'l-Cemaat, babı ne olursa olsun itikad bablarında âhâd hadislerle delil getirmeye devam etmektedir:"], [655.0, "İster ulûhiyyet tevhidinde, ister rubûbiyyet tevhidinde, ister isim ve sıfatlar tevhidinde, ister ahkâm ve din (isimleri) ile büyük günah işleyen meselelerinde, ister kaza ve kader babında olsun."], [667.0, "Senedi sahih olduğu sürece onu kabul ederler;"], [675.0, "âhâd olduğu için reddetmezler. Buna dikkat edin;"], [677.2, "çünkü akîde tahsilinizde birçok babda sahih sünneti kabul ve ret taksimine tabi tutan topluluklarla karşılaşacaksınız."]]}, {"reader": false, "ar": [[684.0, "فإن قلت: أوَلم يثبت أن أهل السنة في مصطلح الحديث قسّموا السنة إلى متواترٍ وآحاد؟"], [690.7, "فأقول: بلى، ولكنه تقسيمُ معرفة الطريق فقط،"], [694.5, "لكنه ليس تقسيمَ قبولٍ وردّ."], [698.0, "فهم يقبلون المتواترات ويقبلون الآحاد،"], [700.5, "ولكن حتى إذا تعارض آحادٌ ومتواتر حينئذٍ نرجّح المتواتر على الآحاد؛"], [708.0, "فهذا من باب معرفة الطرق للترجيح بين ما ظاهره التعارض."], [713.0, "وأما تقسيم… وأما أهل البدع فإنهم يقسّمون السنة إلى متواترةٍ وآحاد تقسيمَ قبولٍ وردّ،"], [719.3, "فلا بد من التفريق. والله أعلم."]], "tr": [[684.0, "\"Ehl-i Sünnet'in mustalahu'l-hadiste sünneti mütevatir ve âhâd diye ayırdığı sabit değil mi?\" dersen, derim ki:"], [690.7, "Evet, fakat bu sadece yolu (rivayet yolunu) bilmeye yönelik bir taksimdir;"], [695.0, "kabul ve ret taksimi değildir."], [698.0, "Onlar hem mütevatirleri hem de âhâdı kabul ederler."], [701.0, "Ancak bir âhâd ile bir mütevatir çatışırsa, o zaman mütevatiri âhâda tercih ederiz."], [708.0, "Bu, zahiren çatışır görünenler arasında tercih yapmak için yolları bilme kabilindendir."], [713.0, "Taksime gelince… Bid'at ehli ise sünneti kabul ve ret taksimi olarak mütevatir ve âhâd diye ayırır."], [718.5, "Bu yüzden ikisini ayırt etmek gerekir. Allah en iyisini bilir."]]}]}, {"ts": "12:01", "title": "21. Külliye: Sahih sünnette gelen her şey Kur'an'da emredilmiştir", "paras": [{"reader": false, "ar": [[721.0, "ومن الكليات أيضًا… ومن الكليات أيضًا:"], [731.0, "<b>كلُّ ما وردت به السنة الصحيحة فمأمورٌ به في القرآن.<\/b> كلُّ ما وردت به السنة الصحيحة فمأمورٌ به في القرآن،"], [743.0, "وأنا أُقسم على ذلك."], [747.0, "وكلمة «وأنا أقسم على ذلك» ليست من كمال القاعدة،"], [750.0, "ولكن من باب شرحها."], [752.2, "وأُعيدها مرةً أخرى: كلُّ ما وردت به السنة فمأمورٌ به في القرآن."]], "tr": [[721.0, "Külliyelerden biri de… Külliyelerden biri de şudur:"], [733.2, "<b>21. külliye: Sahih sünnette gelen her şey Kur'an'da emredilmiştir.<\/b> Sahih sünnette gelen her şey Kur'an'da emredilmiştir;"], [747.0, "ben buna yemin ederim. \"Ben buna yemin ederim\" sözü kaidenin bir parçası değildir;"], [752.2, "onun şerhi kabilindendir. Bir kez daha tekrar ediyorum:"], [756.3, "Sünnette gelen her şey Kur'an'da emredilmiştir."]]}, {"reader": false, "ar": [[759.0, "أقول وبالله التوفيق: وهذا ما نُباهِل عليه <span class=\"q\">؟ 12:39<\/span> ونُقسم عليه؛"], [765.0, "فإن جميع جزئيات السنة الصحيحة نجد أن القرآن قد أمر بها الأمرَ العام،"], [773.0, "في قول الله عز وجل:"], [776.0, "<span class=\"ayah\">﴿وَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانتَهُوا﴾<\/span> <span class=\"ref\">[الحشر: ٧]<\/span>،"], [780.0, "وفي قول الله عز وجل:"], [781.7, "<span class=\"ayah\">﴿وَأَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ﴾<\/span> <span class=\"ref\">[المائدة: ٩٢]<\/span>،"], [783.0, "وفي الآيات التي تلوتُها على مسامعكم في كلية الاحتجاج بالسنة."], [789.0, "فإنها أدلةٌ قرآنية تأمرنا أن نطيع رسول الله صلى الله عليه وسلم فيما أمر،"], [796.0, "وأن ننتهي عمّا عنه نهى وزجر،"], [802.0, "وأن لا نعبد الله إلا بما شرع،"], [805.2, "وأن نصدّقه فيما أخبر."], [807.0, "أوَليس كذلك؟ فجزئيات السنة كلُّها مأمورٌ بها في القرآن أمرًا عامًّا مجملًا."]], "tr": [[759.0, "Tevfik Allah'tandır, derim ki: Bu, üzerine mübahele <span class=\"q\">؟<\/span> ettiğimiz ve yemin ettiğimiz bir şeydir."], [765.0, "Çünkü sahih sünnetin bütün cüz'î meselelerini, Kur'an'ın genel bir emirle emrettiğini görürüz:"], [776.0, "Allah Teâlâ'nın <span class=\"ayah\">﴿Peygamber size ne verdiyse onu alın, size neyi yasakladıysa ondan kaçının﴾<\/span> [Haşr 7] sözünde, <span class=\"ayah\">﴿Allah'a itaat edin, Resûl'e de itaat edin﴾<\/span> [Mâide 92] sözünde ve sünnetle delil getirme külliyesinde size okuduğum ayetlerde."], [789.0, "Bunlar, Resûlullah ﷺ'e emrettiği şeyde itaat etmemizi, yasakladığı ve men ettiği şeyden kaçınmamızı, Allah'a ancak onun şeriat kıldığıyla ibadet etmemizi ve haber verdiği şeyde onu tasdik etmemizi emreden Kur'anî delillerdir."], [805.6, "Öyle değil mi? O hâlde sünnetin cüz'î meselelerinin hepsi Kur'an'da genel ve mücmel bir emirle emredilmiştir."]]}, {"reader": false, "ar": [[813.0, "وإنّ من فقه الصحابة كابن مسعودٍ وغيره:"], [817.0, "لما جاءته امرأةٌ تسأله عن الوصل،"], [823.0, "فقالت: كيف تنهى عن الوصل ولم يُنهَ عنه في القرآن؟"], [832.0, "فقال: لقد نهى النبي صلى الله عليه وسلم عن… فقد… لعن النبي صلى الله عليه وسلم الواصلة،"], [842.0, "وكيف لا أنهى عمّا نهى رسول الله صلى الله عليه وسلم عنه؟"], [847.0, "وإنه لفي القرآن. النهيُ عن الوصل،"], [850.3, "يقول: وإنه لفي القرآن."], [852.0, "فقالت المرأة: إني قرأتُ القرآن من دفّته إلى دفّته ولم أجد النهي عن الوصل."], [860.0, "قال: أقرأتِ <span class=\"ayah\">﴿وَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانتَهُوا﴾<\/span>؟"], [865.0, "قالت: بلى، نعم. قال: هو ذاك."]], "tr": [[813.0, "Sahâbenin, İbn Mes'ûd ve başkalarının fıkhındandır:"], [817.0, "Bir kadın ona gelip saç ekleme (vasl) hakkında sordu ve \"Kur'an'da yasaklanmadığı hâlde saç eklemeyi nasıl yasaklarsın?\" dedi."], [832.0, "O da şöyle dedi: \"Nebî ﷺ … yasakladı… Nebî ﷺ saç ekleyen kadına lanet etti."], [834.8, "Resûlullah ﷺ'in yasakladığı şeyi nasıl yasaklamam?"], [842.0, "O, Kur'an'da da vardır.\" Saç ekleme yasağı için \"O, Kur'an'da da vardır\" diyor."], [847.0, "Kadın, \"Ben Kur'an'ı iki kapağı arasında baştan sona okudum, saç ekleme yasağını bulamadım\" dedi."], [852.0, "O, \"<span class=\"ayah\">﴿Peygamber size ne verdiyse onu alın, size neyi yasakladıysa ondan kaçının﴾<\/span> (ayetini) okumadın mı?\" dedi."], [860.0, "Kadın, \"Evet, okudum\" dedi. O da \"İşte o budur\" dedi."]]}, {"reader": false, "ar": [[868.0, "فإذًا كلُّ ما جاءت به السنة من التفاصيل فإن القرآن قد أمر به."], [874.0, "فإذًا السنة والقرآن أخَوان متلازمان،"], [876.9, "ومصدران شرعيّان لا ينفكّ أحدهما عن الآخر؛"], [881.0, "فمن أراد التفريق بينهما فقد فرّق بين مصادر الاستدلال،"], [887.1, "وسعى في هدم الإسلام."]], "tr": [[868.0, "Demek ki sünnetin getirdiği bütün ayrıntıları Kur'an emretmiştir."], [871.7, "O hâlde sünnet ve Kur'an birbirinden ayrılmayan iki kardeş ve biri diğerinden kopmayan iki şer'î kaynaktır."], [881.0, "Onları birbirinden ayırmak isteyen, istidlal kaynaklarını birbirinden ayırmış ve İslam'ı yıkmaya çalışmış olur."]]}]}, {"ts": "14:50", "title": "22. Külliye: Şeriatın gereğinden çıkmayı içeren her hürriyet çağrısı bâtıldır", "paras": [{"reader": false, "ar": [[890.0, "ومن الكليات أيضًا: <b>كلُّ دعوةٍ لحريةٍ تتضمّن الخروجَ عن مقتضى الشرع فباطلة.<\/b> كلُّ دعوةٍ لحريةٍ تتضمّن الخروج عن مقتضى الشرع فباطلة. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[890.0, "Külliyelerden biri de şudur: 22."], [893.5, "külliye: Şeriatın gereğinden çıkmayı içeren her hürriyet çağrısı bâtıldır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[912.0, "وهذا لا بد أن نؤمن به،"], [918.0, "لأنكم ستسمعون في مستقبل الزمان دعاوى كثيرة تأمر كلَّ طائفةٍ أن لا تُنكر على الطائفة الأخرى،"], [927.0, "وأن تتعايش معها، وأن يُزيلا ما بينهما من الفروق العقدية،"], [934.0, "وأن يعيشا بالأخوّة الإبراهيمية أو الأخوّة الإنسانية،"], [940.0, "متغافلين عن الفروق العقدية الجزئية فيما بينهما؛"], [943.0, "فتجتمع الأديان كلُّها تحت سقف الإبراهيمية،"], [949.0, "ويجتمع الدين الإبراهيمي كلُّه تحت سقف الإنسانية البشرية."]], "tr": [[912.0, "Buna mutlaka iman etmemiz gerekir."], [915.8, "Çünkü ileriki zamanlarda, her fırkaya diğer fırkayı inkâr etmemesini (ona itiraz etmemesini), onunla birlikte yaşamasını, aralarındaki akîdevî farkları kaldırmalarını, aralarındaki cüz'î akîdevî farkları görmezden gelerek İbrâhîmî kardeşlik ya da insanlık kardeşliğiyle yaşamalarını emreden pek çok iddia işiteceksiniz."], [943.0, "Böylece bütün dinler İbrâhîmîlik çatısı altında toplanacak, İbrâhîmî din de bütünüyle beşerî insanlık çatısı altında toplanacak."]]}, {"reader": false, "ar": [[955.0, "وهذا هو الدين الجديد الذي تدعو له هيئة الأمم،"], [959.0, "ويدعو له الدجّال في جزيرة اعتزاله،"], [963.0, "والذي يسعى له ـ وللأسف ـ وإلى تقريره بعضُ علماء المسلمين."], [971.0, "فسوف تسمعون من يُنكر على اليهودي يهوديّته… وستسمعون التغليظ والعقوبة والإنكار على من يُنكر على النصراني نصرانيّته،"], [989.0, "وعلى الرافضي رافضيّته، وعلى الصوفي صوفيّته،"], [995.0, "وعلى الأشعري أشعريّته، بحجّة حرية الأديان،"], [1000.2, "وحرية الأتباع، وحرية الطوائف الطائفية."]], "tr": [[955.0, "İşte bu, Birleşmiş Milletler'in çağırdığı, Deccâl'in de uzlet adasında çağırdığı yeni dindir;"], [960.3, "ne yazık ki Müslüman âlimlerin bazıları da onun için çalışıyor ve onu yerleştirmeye uğraşıyor."], [971.0, "Yahudiye Yahudiliğini inkâr eden kimseyi… Hristiyana Hristiyanlığını, Râfızîye Râfızîliğini, Sûfîye Sûfîliğini, Eş'arîye Eş'arîliğini inkâr eden kimseye;"], [988.3, "dinler hürriyeti, mensuplar hürriyeti ve mezhebî fırkalar hürriyeti bahanesiyle sert davranıldığını, ceza verildiğini ve itiraz edildiğini işiteceksiniz."]]}, {"reader": false, "ar": [[1006.0, "وإنما المحرّم أن يعتدي بعضهم على بعض،"], [1010.0, "ولكن يعيش بعضهم مع بعض،"], [1013.0, "ويدخل هؤلاء متعبّدات هؤلاء،"], [1017.0, "ويفعل هؤلاء طقوسَ دين هؤلاء،"], [1020.0, "من غير نكيرٍ ولا استنكار."], [1024.0, "فجاءت هذه الكلية لتهدم هذه الخطة الإبليسية الدجّالية،"], [1033.0, "وتبيّن أن الأصل في الناس الحرية،"], [1041.0, "ولكن الحرية لا نقبلها إذا هدمت ثلاثة أشياء."]], "tr": [[1006.0, "(Onlara göre) haram olan sadece birbirlerine saldırmalarıdır;"], [1010.0, "bunun dışında birbirleriyle birlikte yaşarlar, bunlar ötekilerin ibadethanelerine girer, bunlar ötekilerin dininin ayinlerini hiçbir itiraz ve inkâr olmaksızın yapar."], [1024.0, "İşte bu külliye, bu İblisçe ve Deccâlce planı yıkmak için geldi."], [1033.8, "İnsanlarda aslın hürriyet olduğunu, fakat hürriyetin üç şeyi yıktığı zaman onu kabul etmediğimizi açıklamaktadır."]]}, {"reader": false, "ar": [[1046.0, "كلُّ حريةٍ تهدم حقًّا من حقوق الله فهي حريةٌ إبليسيةٌ آثمةٌ ظالمة،"], [1052.0, "كالدعوة إلى حرية الأديان،"], [1058.0, "فإنها دعوةٌ إلى حريةٍ تهدم حقًّا من حقوق الله عز وجل،"], [1063.0, "وكالدعوة إلى حرية الطائفية المذهبية،"], [1067.0, "فإنها دعوةٌ تتضمّن إسقاطَ حقٍّ من حقوق الله عز وجل."], [1073.0, "لذلك يقول الله عز وجل:"], [1075.0, "<span class=\"ayah\">﴿وَمَا كَانَ لِمُؤْمِنٍ وَلَا مُؤْمِنَةٍ إِذَا قَضَى اللَّهُ وَرَسُولُهُ أَمْرًا أَن يَكُونَ لَهُمُ الْخِيَرَةُ﴾<\/span> <span class=\"ref\">[الأحزاب: ٣٦]<\/span>،"], [1082.0, "أي: الحرية في اختيار ما يشاؤون،"], [1084.5, "وما يعتقدون، وما يفعلون أو يتعبّدون."], [1087.0, "كلُّ ذلك غير مقبولٍ عندنا، ولله الحمد والمنّة."]], "tr": [[1046.0, "Allah'ın haklarından bir hakkı yıkan her hürriyet İblisçe, günahkâr ve zalim bir hürriyettir."], [1058.0, "Dinler hürriyetine çağrı gibi; çünkü bu, Allah Teâlâ'nın haklarından bir hakkı yıkan bir hürriyete çağrıdır."], [1068.8, "Mezhebî fırkacılık hürriyetine çağrı gibi;"], [1073.0, "çünkü bu, Allah Teâlâ'nın haklarından bir hakkı düşürmeyi içeren bir çağrıdır."], [1074.2, "Bu yüzden Allah Teâlâ şöyle buyurur:"], [1075.0, "<span class=\"ayah\">﴿Allah ve Resûlü bir işe hükmettiği zaman, hiçbir mümin erkek ve mümin kadına seçim hakkı yoktur﴾<\/span> [Ahzâb 36];"], [1083.2, "yani istediklerini, inandıklarını, yaptıklarını veya ibadet ettiklerini seçme hürriyeti."], [1087.0, "Bunların hepsi bizim katımızda kabul edilmez; hamd ve minnet Allah'adır."]]}, {"reader": false, "ar": [[1094.0, "وكلُّ حريةٍ تتضمّن إسقاطَ حقّ النفس فهي باطلة؛"], [1100.0, "فمن يدعو إلى حرية الانتحار وإزهاق النفس فهي حريةٌ محرّمة،"], [1107.0, "لأنها حريةٌ تتضمّن إسقاط حق النفس."], [1111.0, "وكلُّ حريةٍ تتضمّن إسقاطَ حقّ الغير فهي حريةٌ آثمةٌ ظالمة؛"], [1119.4, "فلا حقَّ لك أن تؤذي الناس في شوارعهم بحجّة أنك حرٌّ تتصرّف كيفما تشاء،"], [1129.0, "ولا أن تؤذي الناس في مكان وظيفتهم بدعوى أنك حرٌّ تفعل ما تشاء."]], "tr": [[1094.0, "Nefsin hakkını düşürmeyi içeren her hürriyet bâtıldır."], [1100.0, "İntihar etme ve cana kıyma hürriyetine çağıran kimsenin (savunduğu) hürriyet haram bir hürriyettir;"], [1107.0, "çünkü nefsin hakkını düşürmeyi içeren bir hürriyettir."], [1111.0, "Başkasının hakkını düşürmeyi içeren her hürriyet de günahkâr ve zalim bir hürriyettir."], [1122.6, "\"Ben hürüm, istediğim gibi davranırım\" bahanesiyle insanlara sokaklarında eziyet etmeye, \"Ben hürüm, istediğimi yaparım\" iddiasıyla insanlara iş yerlerinde eziyet etmeye hakkın yoktur."]]}, {"reader": false, "ar": [[1136.0, "كلُّ ذلك من الحريات المحرّمة،"], [1138.6, "لأنها إما أن تُسقط حقًّا من حقوق الله،"], [1142.8, "أو تُسقط حقًّا من حقوق النفس،"], [1145.9, "أو تُسقط حقًّا من حقوق الآخرين."], [1149.0, "وإلا فالأصل أننا أحرارٌ ما لم تكن حريتنا تتعارض مع واحدٍ من هذه الحقوق الثلاثة."]], "tr": [[1136.0, "Bunların hepsi haram hürriyetlerdendir; çünkü ya Allah'ın haklarından bir hakkı, ya nefsin haklarından bir hakkı ya da başkalarının haklarından bir hakkı düşürür."], [1149.0, "Yoksa asıl olan, hürriyetimiz bu üç haktan biriyle çatışmadığı sürece hür olmamızdır."]]}]}, {"ts": "19:17", "title": "23. Külliye: Namazında kıbleye yönelen herkes Ehl-i Kıble'dendir", "paras": [{"reader": false, "ar": [[1157.0, "ومن الكليات أيضًا: <b>كلُّ من استقبل القبلة في صلاته فمن أهل القبلة.<\/b> كلُّ من استقبل القبلة في صلاته فمن أهل القبلة."], [1162.0, "كم رقمها؟ كلُّ من استقبل القبلة في صلاته فمن أهل القبلة."]], "tr": [[1157.0, "Külliyelerden biri de şudur: 23."], [1158.5, "külliye: Namazında kıbleye yönelen herkes Ehl-i Kıble'dendir. Namazında kıbleye yönelen herkes Ehl-i Kıble'dendir."], [1162.0, "Numarası kaç? Namazında kıbleye yönelen herkes Ehl-i Kıble'dendir."]]}, {"reader": false, "ar": [[1175.0, "أقول: وذلك لأنه سيمرّ عليكم مصطلح «أهل القبلة» كثيرًا في قراءة كتب العقيدة القديمة والمعاصرة."], [1187.0, "فإذا سألكم سائل: من أهل القبلة؟"], [1190.6, "فقولوا: هم أهل الإسلام."], [1193.0, "فنحن نعني بأهل القبلة:"], [1195.3, "أي أهل الإسلام، ونعني بأهل الإسلام:"], [1198.5, "أي أمّة الإجابة. فإذا قلنا «أهل القبلة» فنعني بهم أهل الإسلام من أمّة الإجابة."]], "tr": [[1175.0, "Derim ki: Bunun sebebi, eski ve çağdaş akîde kitaplarını okurken \"Ehl-i Kıble\" ıstılahıyla çokça karşılaşacak olmanızdır."], [1187.0, "Biri size \"Ehl-i Kıble kimlerdir?\" diye sorarsa, \"Onlar Ehl-i İslam'dır\" deyin."], [1193.0, "Ehl-i Kıble ile Ehl-i İslam'ı, Ehl-i İslam ile de icabet ümmetini kastederiz."], [1200.0, "\"Ehl-i Kıble\" dediğimizde, icabet ümmetinden olan Ehl-i İslam'ı kastederiz."]]}, {"reader": false, "ar": [[1207.0, "فإن قلت: ولماذا سُمّوا بأهل القبلة؟"], [1211.0, "فنقول: لأن الصفة التي تجمعهم هي أن جميعهم يتوجّهون إلى جهة القبلة."], [1219.0, "وبعض أهل العلم يسمّيهم بأهل الصلاة،"], [1223.0, "لأنهم مُجمِعون على فرضية الصلوات الخمس في اليوم والليلة."], [1228.0, "وقد ورد هذا الاسم فيما رواه البخاري في صحيحه من حديث أنسٍ رضي الله عنه،"], [1239.0, "في قول النبي صلى الله عليه وسلم:"], [1241.3, "«من صلّى صلاتنا، واستقبل قبلتنا، وأكل ذبيحتنا، فذلك المسلم الذي له ذمّة الله وذمّة رسوله، فلا تُخفِروا الله في ذمّته»."], [1255.8, "فأهل القبلة هم أهل الإسلام."]], "tr": [[1207.0, "\"Neden Ehl-i Kıble diye isimlendirildiler?\" dersen, deriz ki:"], [1212.3, "Çünkü onları bir araya getiren vasıf, hepsinin kıble yönüne yönelmesidir."], [1219.0, "Bazı ehl-i ilim onlara \"Ehl-i Salât\" (namaz ehli) der;"], [1228.0, "çünkü onlar gece ve gündüzde beş vakit namazın farz olduğu konusunda icma etmişlerdir."], [1236.5, "Bu isim, Buhârî'nin Sahîh'inde Enes'ten (radıyallâhu anh) rivayet ettiği hadiste, Nebî ﷺ'in şu sözünde geçmiştir:"], [1241.3, "\"Kim bizim namazımızı kılar, kıblemize yönelir ve kestiğimizi yerse, işte o, Allah'ın ve Resûlü'nün himayesinde (zimmetinde) olan Müslümandır."], [1254.2, "Allah'ın himayesini bozmayın.\" O hâlde Ehl-i Kıble, Ehl-i İslam'dır."]]}, {"reader": false, "ar": [[1259.0, "فإن قلت: وهل متابعة الهوى تُخرج الإنسان عن مسمّى أهل القبلة؟"], [1268.5, "الجواب: لا تُخرجه، إن لم يُخرجه هواه عن أصل الإسلام."], [1274.8, "فإن قلت: وهل البدعة تُخرج الإنسان عن وصف أهل القبلة؟"], [1280.7, "فأقول: الجواب: لا تُخرجه،"], [1283.4, "إن لم تكن بدعةً مكفّرة."], [1286.8, "فإن قلت: وهل ارتكاب الكبائر والمعاصي يُخرجه عن اسم… عن مسمّى أهل القبلة؟"], [1296.0, "الجواب: لا تُخرجه ما لم يستحلّها."], [1301.0, "أنتم معي في هذا؟"]], "tr": [[1259.0, "\"Hevâya uymak insanı Ehl-i Kıble adından çıkarır mı?\" dersen, cevap:"], [1268.5, "Hevâsı onu İslam'ın aslından çıkarmadıkça çıkarmaz."], [1273.0, "\"Bid'at insanı Ehl-i Kıble vasfından çıkarır mı?\" dersen, derim ki:"], [1280.7, "Cevap: Tekfir edici bir bid'at olmadıkça çıkarmaz."], [1286.8, "\"Büyük günahları ve masiyetleri işlemek onu Ehl-i Kıble isminden… adından çıkarır mı?\" dersen, cevap:"], [1296.0, "Onları helal saymadıkça çıkarmaz. Bu konuda benimle misiniz?"]]}, {"reader": false, "ar": [[1305.0, "فإن قلت: وما الذي يُخرج الإنسان عن دائرة أهل القبلة؟"], [1310.0, "فأقول: مروقُه من الدين،"], [1312.8, "وخلعُه لرِبقة الإسلام من عنقه."], [1317.0, "فإذا ابتدع الإنسان بدعةً مكفّرة فإن بدعته المكفّرة تُخرجه عن أهل القبلة."], [1324.0, "وإذا فعل شركًا ـ كأن استغاث بغير الله عز وجل،"], [1328.9, "أو دعا غير الله،"], [1331.0, "أو ركع وسجد للقبور والأولياء،"], [1333.8, "أو ذبح لهم ذبحَ تعظيمٍ وتقرّب،"], [1337.0, "أو ادّعى أنه يعلم الغيب،"], [1339.8, "أو نحو ذلك من النواقض والمكفّرات ـ فإن كفره يُخرجه عن دائرة أهل القبلة."], [1347.0, "فكلُّ ما أخرجه عن التوجّه إلى جهة الصلاة فإنه يُخرجه عن مسمّى أهل القبلة،"], [1353.0, "وهو الأمر الذي يوجب كفرًا فقط."]], "tr": [[1305.0, "\"İnsanı Ehl-i Kıble dairesinden çıkaran nedir?\" dersen, derim ki:"], [1310.0, "Dinden çıkması ve İslam bağını boynundan çıkarıp atmasıdır."], [1317.0, "İnsan tekfir edici bir bid'at icat ederse, bu tekfir edici bid'ati onu Ehl-i Kıble'den çıkarır."], [1324.0, "Şirk işlerse —mesela Allah Teâlâ'dan başkasından medet (istigâse) dilerse, Allah'tan başkasına dua ederse, kabirlere ve velilere rükû ve secde ederse, onlar için tazim ve yaklaşma kurbanı keserse, gaybı bildiğini iddia ederse veya buna benzer (İslam'ı) bozan ve küfre sokan şeylerden birini yaparsa— küfrü onu Ehl-i Kıble dairesinden çıkarır."], [1347.0, "Onu namaz yönüne yönelmekten çıkaran her şey, onu Ehl-i Kıble adından da çıkarır;"], [1352.6, "bu da sadece küfrü gerektiren şeydir."]]}]}, {"ts": "22:38", "title": "24. Külliye: Bir babın nasslarının bir kısmına bakıp diğerini bırakan sapar", "paras": [{"reader": false, "ar": [[1358.0, "ومن الكليات أيضًا: <b>كلُّ من نظر في الباب الواحد لبعض نصوصه دون بعضٍ فقد ضلّ.<\/b> أُعيده مرةً أخرى:"], [1371.0, "كلُّ من نظر في الباب الواحد لبعض نصوصه دون بعضٍ فقد ضلّ."], [1380.0, "أقول: طوبى لمن آمن واهتمّ بتطبيق هذه الكلية؛"], [1389.0, "فإن جميع من ضلّ في بابٍ من الأبواب العقدية فإنما سببُ ضلاله أنه اقتصر نظرُه على جزءٍ من أدلة هذا الباب،"], [1399.0, "وعَمِيَ ـ أو تعامى ـ قلبُه وبصرُه وبصيرته عن الجزء الآخر من الأدلة."]], "tr": [[1358.0, "Külliyelerden biri de şudur: 24."], [1361.0, "külliye: Tek bir babda, o babın nasslarının bir kısmına bakıp diğer kısmını bırakan herkes sapmıştır. Bir kez daha tekrar ediyorum:"], [1371.0, "Tek bir babda, o babın nasslarının bir kısmına bakıp diğer kısmını bırakan herkes sapmıştır."], [1380.0, "Derim ki: Bu külliyeye iman eden ve onu uygulamaya önem veren kimseye ne mutlu!"], [1390.9, "Çünkü akîde bablarından herhangi bir babda sapan herkesin sapmasının sebebi, bakışını o babın delillerinin bir kısmıyla sınırlaması, kalbinin, gözünün ve basiretinin delillerin diğer kısmına karşı kör olması —ya da kendini kör göstermesidir."]]}, {"reader": false, "ar": [[1407.0, "فأهل التمثيل إنما نظروا في أدلة إثبات الأسماء والصفات فقط،"], [1417.0, "ولم ينظروا في أدلة نفي مماثلة الله للمخلوقات،"], [1423.0, "فأثبتوا ومثّلوا، لأنهم إنما نظروا في جزءٍ من الأدلة ولم ينظروا في الجزء الآخر."], [1433.0, "وأهل التعطيل نظروا في الأدلة التي تنفي مماثلة الله للمخلوقات،"], [1440.0, "وتعامَوا عن الأدلة التي تُثبت الأسماء والصفات،"], [1446.0, "فعطّلوا. فسببُ تمثيل الممثّلة هو النظر في جزءٍ من الأدلة دون الجزء الآخر،"], [1455.0, "وسببُ ضلال المعطّلة هو لأنهم نظروا في جزءٍ من الأدلة دون الجزء الآخر."]], "tr": [[1407.0, "Temsil ehli sadece isim ve sıfatları isbat eden delillere baktılar;"], [1419.9, "Allah'ın mahlûklara benzemesini nefyeden delillere bakmadılar."], [1429.3, "Böylece isbat ettiler ve temsile düştüler;"], [1433.0, "çünkü delillerin sadece bir kısmına baktılar, diğer kısmına bakmadılar."], [1436.9, "Ta'til ehli ise Allah'ın mahlûklara benzemesini nefyeden delillere baktılar, isim ve sıfatları isbat eden delillere karşı kendilerini kör gösterdiler;"], [1447.0, "böylece ta'til ettiler. Mümessilenin temsilinin sebebi, delillerin diğer kısmını bırakıp bir kısmına bakmaktır;"], [1455.9, "Muattılanın sapmasının sebebi de delillerin diğer kısmını bırakıp bir kısmına bakmalarıdır."]]}, {"reader": false, "ar": [[1462.0, "فكلُّ من نظر في بعض أجزاء الأدلة في الباب الواحد،"], [1466.0, "وتعامى عن الأطراف الأخرى من الأدلة،"], [1469.0, "فإنه سيكون ضالًّا مُضلًّا،"], [1471.0, "ولن تكون نتيجته على الحق أبدًا."], [1475.0, "فهمتم هذا؟ والمرجئة نظروا في عظيم مغفرة الله عز وجل،"], [1483.0, "وتعامَوا عن شديد عقوبته وأليم عذابه،"], [1487.0, "فأخذوا بأدلة الرجاء وتركوا أدلة الوعيد،"], [1493.0, "أو بمعنًى آخر نقول:"], [1495.4, "أخذوا أدلة الوعد وتركوا أدلة الوعيد،"], [1499.0, "فضلّوا لأنهم أخذوا بجزءٍ وتركوا جزءًا."]], "tr": [[1462.0, "Tek bir babda delillerin bazı kısımlarına bakıp delillerin diğer taraflarına karşı kendini kör gösteren herkes sapmış ve saptırıcı olur;"], [1470.5, "vardığı sonuç asla hak üzere olmaz."], [1475.0, "Bunu anladınız mı? Mürcie, Allah Teâlâ'nın mağfiretinin büyüklüğüne baktı;"], [1482.4, "cezasının şiddetine ve azabının acıklılığına karşı kendini kör gösterdi."], [1488.5, "Recâ (ümit) delillerini alıp vaîd (tehdit) delillerini bıraktılar;"], [1495.4, "başka bir ifadeyle, vaad delillerini alıp vaîd delillerini bıraktılar."], [1499.0, "Bir kısmı alıp bir kısmı bıraktıkları için saptılar."]]}, {"reader": false, "ar": [[1502.0, "والوعيدية ضلّوا لأنهم أخذوا بأدلة الوعيد وتركوا أدلة الوعد،"], [1510.0, "فضلّوا لأنهم أخذوا بجزءٍ من الأدلة دون بعض."], [1514.0, "والجبرية ضلّوا لأنهم أخذوا بجزءٍ من الأدلة،"], [1523.0, "وهو الجزء الذي ينسب أفعال العبد إلى الله عز وجل،"], [1527.0, "وأن كلَّ شيءٍ بقضائه وقدره،"], [1529.0, "ولكن تركوا الأدلة التي فيها نسبةُ الأفعال إلى العباد؛"], [1533.0, "فأخذوا ببعضٍ دون بعض،"], [1537.0, "وآمنوا ببعض الكتاب وكفروا ببعض."]], "tr": [[1502.0, "Vaîdiyye ise vaîd delillerini alıp vaad delillerini bıraktıkları için saptılar;"], [1510.0, "delillerin bir kısmını alıp diğerini bıraktıkları için saptılar."], [1514.0, "Cebriyye de delillerin bir kısmını aldıkları için saptı:"], [1523.4, "Kulun fiillerini Allah Teâlâ'ya nispet eden ve her şeyin O'nun kaza ve kaderiyle olduğunu bildiren kısmı."], [1529.9, "Fakat fiillerin kullara nispet edildiği delilleri bıraktılar."], [1533.0, "Bir kısmı alıp diğerini bıraktılar;"], [1535.5, "Kitab'ın bir kısmına iman edip bir kısmını inkâr ettiler."]]}, {"reader": false, "ar": [[1541.0, "والقدرية ضلّوا لأنهم نظروا في الأدلة التي تنسب الأفعال إلى العبد،"], [1549.0, "وتعامَوا عن الأدلة التي فيها أن كلَّ شيءٍ بقضاء الله وقدره،"], [1555.0, "وأن الله خالقُ أفعال العباد."], [1557.0, "وهكذا دواليك في كلّ من ضلّ؛"], [1561.0, "فتجد من أسباب ضلاله أنه جاء إلى الباب الواحد،"], [1566.0, "ونظر في جزءٍ من أدلته،"], [1568.7, "وأخرج نتيجته قبل أن ينظر في الطرف الآخر من الأدلة ليتكامل نظرُه وتتكامل نتيجته."]], "tr": [[1541.0, "Kaderiyye de fiilleri kula nispet eden delillere baktıkları, her şeyin Allah'ın kaza ve kaderiyle olduğunu ve Allah'ın kulların fiillerinin yaratıcısı olduğunu bildiren delillere karşı kendilerini kör gösterdikleri için saptılar."], [1557.0, "Sapan herkeste durum böyle devam eder:"], [1561.0, "Sapmasının sebeplerinden birinin, tek bir baba gelip onun delillerinin bir kısmına bakması ve bakışı tamamlansın, sonucu da tamamlansın diye delillerin diğer tarafına bakmadan önce sonucunu çıkarması olduğunu görürsün."]]}, {"reader": false, "ar": [[1578.0, "فخذوها منّي كليةً لن تسمعوها من غيري،"], [1582.0, "اسمعوني، لعلكم لا تسمعونها من غيري:"], [1587.0, "لا هُدى إلا بمطالعة أطراف الأدلة كلّها في الباب العقدي الواحد،"], [1594.0, "إلا في مطالعة الأدلة كلّها في الباب العقدي الواحد."], [1600.0, "ولذلك لو أننا نظرنا إلى قول الله عز وجل:"], [1604.0, "<span class=\"ayah\">﴿نَبِّئْ عِبَادِي أَنِّي أَنَا الْغَفُورُ الرَّحِيمُ﴾<\/span> <span class=\"ref\">[الحجر: ٤٩]<\/span> فقط،"], [1606.4, "لوقعنا في الأمن من مكر الله."], [1609.0, "ولو أننا نظرنا إلى قول الله عز وجل:"], [1614.0, "<span class=\"ayah\">﴿وَأَنَّ عَذَابِي هُوَ الْعَذَابُ الْأَلِيمُ﴾<\/span> <span class=\"ref\">[الحجر: ٥٠]<\/span> فقط،"], [1617.0, "لوقعنا في اليأس من رَوح الله والقنوط من رحمته."]], "tr": [[1578.0, "Bunu benden, başkasından işitmeyeceğiniz bir külliye olarak alın."], [1581.4, "Beni dinleyin; belki de onu başkasından işitmezsiniz:"], [1587.0, "Tek bir akîde babında delillerin bütün taraflarını incelemeden hidayet olmaz;"], [1592.9, "tek bir akîde babında bütün delilleri incelemekten başka yolla (hidayet) olmaz."], [1600.0, "Bu yüzden sadece Allah Teâlâ'nın <span class=\"ayah\">﴿Kullarıma haber ver ki ben, evet ben, çok bağışlayıcı, çok merhametliyim﴾<\/span> [Hicr 49] sözüne baksaydık, Allah'ın mekrinden emin olma (hatasına) düşerdik."], [1609.0, "Sadece Allah Teâlâ'nın <span class=\"ayah\">﴿Ve benim azabımın da elem verici azap olduğunu﴾<\/span> [Hicr 50] sözüne baksaydık, Allah'ın rahmetinden ümit kesme ve rahmetinden yeise düşme (hatasına) düşerdik."]]}, {"reader": false, "ar": [[1621.0, "لكن إذا تكامل نظرُنا في الآيتين جميعًا،"], [1627.0, "فحينئذٍ إيش؟ ها يا جماعة؟"], [1629.0, "حينئذٍ نخرج بنتيجةٍ قال الله عز وجل عنها:"], [1633.5, "<span class=\"ayah\">﴿وَيَدْعُونَنَا رَغَبًا وَرَهَبًا﴾<\/span> <span class=\"ref\">[الأنبياء: ٩٠]<\/span>، وقال الله عز وجل:"], [1637.0, "<span class=\"ayah\">﴿أَمَّنْ هُوَ قَانِتٌ آنَاءَ اللَّيْلِ سَاجِدًا وَقَائِمًا يَحْذَرُ الْآخِرَةَ وَيَرْجُو رَحْمَةَ رَبِّهِ﴾<\/span> <span class=\"ref\">[الزمر: ٩]<\/span>."], [1644.0, "فمن عبد الله بالرجاء فقط أمِن من مكر الله،"], [1648.0, "ومن عبد الله بالخوف فقط قنط من رحمة الله،"], [1651.0, "ومن عبد الله بالرجاء والخوف استقام توحيدُه وسيرُه إلى الله."]], "tr": [[1621.0, "Fakat iki ayete de bakışımız tamamlanırsa, o zaman ne olur?"], [1627.8, "Hı, ey cemaat? O zaman, Allah Teâlâ'nın hakkında şöyle buyurduğu bir sonuca varırız:"], [1633.5, "<span class=\"ayah\">﴿Bize rağbet ederek ve korkarak dua ederlerdi﴾<\/span> [Enbiyâ 90]."], [1635.5, "Allah Teâlâ şöyle de buyurdu:"], [1637.0, "<span class=\"ayah\">﴿Yoksa gece saatlerinde secde ederek ve kıyamda durarak ibadet eden, ahiretten korkan ve Rabbinin rahmetini uman kimse mi?﴾<\/span> [Zümer 9]."], [1644.0, "Allah'a sadece ümitle ibadet eden, Allah'ın mekrinden emin olur;"], [1647.6, "Allah'a sadece korkuyla ibadet eden, Allah'ın rahmetinden ümit keser;"], [1650.3, "Allah'a ümit ve korkuyla ibadet edenin tevhidi ve Allah'a yürüyüşü dosdoğru olur."]]}, {"reader": false, "ar": [[1657.0, "فمن أعظم خصائص أهل السنة الأخذُ بالأجزاء كلّها،"], [1662.9, "وعدمُ ترك جزءٍ دون آخر."], [1666.0, "ومن خصائص أهل البدع في الأبواب العقدية اقتصارُهم على جزءٍ من أجزاء الأدلة دون النظر في الطرف الآخر."], [1675.0, "ولذلك صدقت كليّتنا، وهي أنّ كلَّ من نظر في جزءٍ من النصوص في الباب الواحد ـ في جزءٍ من النصوص،"], [1684.3, "أو لبعض نصوصه دون بعض ـ فقد ضلّ،"], [1687.1, "لأن نتيجته لن تكون على الوجه المطلوب."]], "tr": [[1657.0, "Ehl-i Sünnet'in en büyük özelliklerinden biri, bütün kısımları almak ve bir kısmı bırakıp diğerini almamaktır."], [1667.7, "Akîde bablarında bid'at ehlinin özelliklerinden biri de diğer tarafa bakmadan delillerin kısımlarından birine yetinmeleridir."], [1675.0, "Bu yüzden külliyemiz doğru çıktı:"], [1677.7, "Tek bir babda nassların bir kısmına —nassların bir kısmına ya da o babın nasslarının bir kısmına— bakıp diğerini bırakan herkes sapmıştır;"], [1687.1, "çünkü vardığı sonuç istenen şekilde olmayacaktır."]]}]}, {"ts": "28:11", "title": "25. Külliye: Nassların herkesin anladığı bir zahiri, havassın anladığı bir bâtını olduğuna inanan", "paras": [{"reader": false, "ar": [[1691.0, "ومن الكليات أيضًا: كلُّ من اعتقد أن للنصوص ظاهرًا يفهمه الكل،"], [1698.0, "وباطنًا لا يفهمه إلا الخواص،"], [1702.2, "فكافرٌ زنديق. كلُّ من اعتقد أن للنصوص ظاهرًا يفهمه الكل،"], [1711.0, "وباطنًا يفهمه… لا يفهمه إلا الخواص، فكافرٌ زنديق. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1691.0, "Külliyelerden biri de şudur: 25."], [1694.9, "külliye: Nassların herkesin anladığı bir zahiri ve sadece havassın (seçkinlerin) anladığı bir bâtını olduğuna inanan herkes kâfir ve zındıktır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1717.0, "أقول: وهذا اعتقاد الباطنية أنفسهم،"], [1728.0, "ومن سار على منهجهم من علماء الكلام والفلاسفة."], [1732.0, "فإن الباطنية يعتقدون أن نصوص الوحيين لها ظاهرٌ وباطن؛"], [1738.0, "فأما الظاهر فيتّفق الجميع في فهمه وإدراك معناه ومعرفة مراده،"], [1744.0, "وأما الباطن فيجعلونه من الأسرار المكتومة التي يختصّ أولياؤهم وأقطابهم وكبراؤهم بمعرفتها دون سائر المسلمين."], [1756.0, "وكلُّ من زعم أن للنصوص ظاهرًا وباطنًا بهذا الاعتبار وبهذا المعنى فإنه يُعتبر كافرًا زنديقًا."]], "tr": [[1717.0, "Derim ki: Bu, bizzat Bâtınîlerin ve kelam âlimleri ile filozoflardan onların yolunda gidenlerin itikadıdır."], [1732.0, "Bâtınîler, iki vahyin (Kitap ve Sünnet'in) nasslarının bir zahiri ve bir bâtını olduğuna inanırlar."], [1738.0, "Zahirini anlamakta, manasını idrak etmekte ve kastedilenini bilmekte herkes birleşir."], [1744.0, "Bâtınını ise, diğer Müslümanlar değil sadece velilerinin, kutuplarının ve büyüklerinin bilmesine mahsus gizli sırlardan sayarlar."], [1756.0, "Nassların bu itibarla ve bu manada bir zahiri ve bir bâtını olduğunu iddia eden herkes kâfir ve zındık sayılır."]]}, {"reader": false, "ar": [[1766.0, "فالباطنية يعتقدون أن قول الله عز وجل:"], [1771.0, "<span class=\"ayah\">﴿أَقِيمُوا الصَّلَاةَ﴾<\/span>، أنّ الصلاة ظاهرًا يفهمها العامة،"], [1778.0, "وهي تلك الحركات المفتتحة بالتكبير والمختتمة بالتسليم،"], [1784.0, "إلا أن معناها الباطني معرفةُ أسرار الولاية."], [1788.0, "وأن قول الله عز وجل:"], [1794.0, "<span class=\"ayah\">﴿ثُمَّ أَتِمُّوا الصِّيَامَ إِلَى اللَّيْلِ﴾<\/span> <span class=\"ref\">[البقرة: ١٨٧]<\/span>،"], [1797.0, "أنّ للصيام ظاهرًا يفهمه العامة،"], [1800.0, "وهو الإمساك عن المفطّرات من طلوع الفجر الصادق إلى غروب الشمس،"], [1805.0, "وله معنًى باطنٌ لا يفهمه إلا كبراؤهم،"], [1808.2, "وهو كتمُ هذه الأسرار وعدمُ إفشائها للناس."]], "tr": [[1766.0, "Bâtınîler, Allah Teâlâ'nın <span class=\"ayah\">﴿Namazı kılın﴾<\/span> sözü hakkında şuna inanırlar:"], [1768.1, "Namazın zahiren avamın anladığı (bir manası) vardır;"], [1771.0, "o da tekbirle başlayıp selamla biten o hareketlerdir."], [1777.4, "Fakat bâtınî manası velâyet sırlarını bilmektir."], [1780.2, "Allah Teâlâ'nın <span class=\"ayah\">﴿Sonra orucu geceye kadar tamamlayın﴾<\/span> [Bakara 187] sözü hakkında da şuna inanırlar:"], [1788.0, "Orucun avamın anladığı bir zahiri vardır;"], [1794.0, "o da sâdık fecrin doğuşundan güneşin batışına kadar orucu bozan şeylerden uzak durmaktır."], [1802.3, "Bir de sadece büyüklerinin anladığı bâtın bir manası vardır;"], [1806.8, "o da bu sırları gizlemek ve insanlara yaymamaktır."]]}, {"reader": false, "ar": [[1814.0, "وأن قول الله عز وجل:"], [1817.4, "<span class=\"ayah\">﴿وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا﴾<\/span> <span class=\"ref\">[آل عمران: ٩٧]<\/span>،"], [1825.0, "أنّ الحج له معنًى ظاهرٌ يفهمه العوام،"], [1828.0, "وهو قصدُ مكة والمشاعر لأداء نسكٍ مخصوصٍ من شخصٍ مخصوصٍ في وقتٍ مخصوص،"], [1836.0, "وله معنًى باطنٌ، وهو زيارة القبور والمشاهد،"], [1839.2, "والطواف عليها، وعبادة أصحابها."]], "tr": [[1814.0, "Allah Teâlâ'nın <span class=\"ayah\">﴿Yoluna gücü yetenlerin o evi haccetmesi, Allah'ın insanlar üzerindeki bir hakkıdır﴾<\/span> [Âl-i İmrân 97] sözü hakkında da şuna inanırlar:"], [1816.0, "Haccın avamın anladığı zahir bir manası vardır;"], [1817.4, "o da belirli bir kişinin belirli bir vakitte belirli bir ibadeti eda etmek için Mekke'ye ve meş'arlere yönelmesidir."], [1829.2, "Bir de bâtın bir manası vardır;"], [1833.5, "o da kabirleri ve türbeleri ziyaret etmek, onları tavaf etmek ve sahiplerine ibadet etmektir."]]}, {"reader": false, "ar": [[1841.0, "والرافضة ساروا في تفسير القرآن سيرَ الباطنية؛"], [1851.0, "فيجعلون للآية ظاهرًا يفهمه العامة،"], [1855.0, "ولكن لها باطنٌ لا يفهمه إلا خواصّهم،"], [1860.0, "ولهم في ذلك سقطاتٌ تفسيريةٌ عظيمةٌ جدًّا،"], [1866.0, "ولا أريد أن أؤذي مسامعكم بشيءٍ منها."], [1873.0, "فهذا مسلكٌ في فهم النصوص خطيرٌ جدًّا،"], [1877.0, "سارت عليه أكثرُ طوائف الضلال:"], [1880.0, "أنها تجعل للنص ظاهرًا يفهمه العامة،"], [1884.0, "وباطنًا لا يفهمه إلا الخواص."]], "tr": [[1841.0, "Râfıza da Kur'an tefsirinde Bâtınîlerin yolundan gitti."], [1851.0, "Ayet için avamın anladığı bir zahir, fakat sadece kendi havaslarının anladığı bir bâtın olduğunu söylerler."], [1860.7, "Bu konuda onların çok büyük tefsir sapmaları vardır;"], [1866.7, "onlardan herhangi biriyle kulaklarınızı incitmek istemiyorum."], [1873.0, "Bu, nassları anlamada çok tehlikeli bir yoldur;"], [1876.4, "sapık fırkaların çoğu bu yolda gitmiştir:"], [1880.0, "Nass için avamın anladığı bir zahir ve sadece havassın anladığı bir bâtın olduğunu kabul ederler."]]}, {"reader": false, "ar": [[1886.0, "وقد سار الصوفية في فهم النصوص ودلالاتها وإشاراتها هذا السير؛"], [1894.0, "فيجعلون لكثيرٍ من نصوص الكتاب والسنة ظاهرًا يفهمه الناس،"], [1898.0, "وباطنًا يتكلّمون فيه في مجالسهم الخاصة،"], [1902.0, "ويفسّرونه لطلابهم ومريديهم، ويأخذون العهود والمواثيق عليهم أن لا يُخبروا الناس بها."], [1908.0, "فالواجب الحذرُ الشديد من هذا المسلك أيها الناس."]], "tr": [[1886.0, "Sûfîler de nassları, onların delaletlerini ve işaretlerini anlamada bu yolda gittiler."], [1894.0, "Kitap ve Sünnet'in nasslarının çoğu için insanların anladığı bir zahir ve özel meclislerinde konuştukları, talebelerine ve müritlerine tefsir ettikleri bir bâtın olduğunu söylerler;"], [1904.0, "bunları insanlara haber vermeyeceklerine dair onlardan ahit ve misak alırlar."], [1908.0, "Ey insanlar! Bu yoldan şiddetle sakınmak vaciptir."]]}, {"reader": false, "ar": [[1917.0, "فإن قلت: وما الواجب؟"], [1919.0, "الواجب هو الأخذ بظاهر النص،"], [1921.0, "وبيانُ أن معناه متّفقٌ مع حقيقته ولفظه وظاهره،"], [1931.0, "ولا يجوز لنا أن نحرّف دلالة النص لنُقحم في باطنه دلالةً لا يدلّ عليها دليل الشرع ولا لغة العرب."], [1944.0, "فما أجملَ مذهبَ أهل السنة!"], [1947.0, "وأنا لا ألومهم في كراهيتنا،"], [1950.0, "لأننا نأتي إلى أصولهم فنكسرها،"], [1954.0, "ولا ندع لهم مجالًا يستفيدون من قِبَله أو عن طريقه من أدلة الكتاب والسنة. بسم الله."]], "tr": [[1917.0, "\"Vacip olan nedir?\" dersen: Vacip olan, nassın zahirini almak ve manasının onun hakikati, lafzı ve zahiriyle uyumlu olduğunu açıklamaktır."], [1931.0, "Nassın bâtınına, ne şer'î delilin ne de Arap dilinin delalet ettiği bir delaleti sokmak için nassın delaletini tahrif etmemiz caiz değildir."], [1944.0, "Ehl-i Sünnet'in mezhebi ne güzeldir!"], [1947.0, "Bizden nefret etmelerinden dolayı onları kınamıyorum;"], [1950.0, "çünkü biz onların usûlüne gelip onları kırıyoruz ve Kitap ve Sünnet'in delillerinden, onun vasıtasıyla ya da onun yoluyla istifade edecekleri bir alan bırakmıyoruz. Bismillah."]]}]}, {"ts": "32:40", "title": "26. Külliye: Hakkı ve bâtılı muhtemel akîdevî lafız hakkında istifsâl etmeden hüküm verilmez", "paras": [{"reader": false, "ar": [[1960.0, "ومن الكليات أيضًا: كلُّ لفظٍ عقديٍّ مجمل… كلُّ لفظٍ عقدي ـ عفوًا ـ <b>كلُّ لفظٍ عقديٍّ يحتمل الحقَّ والباطل فلا يُحكم فيه قبل الاستفصال.<\/b> كلُّ لفظٍ عقديٍّ يحتمل الحق والباطل فلا يُحكم فيه قبل الاستفصال. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[1960.0, "Külliyelerden biri de şudur: Mücmel olan her akîdevî lafız… Her akîdevî lafız —pardon— 26."], [1973.5, "külliye: Hakkı ve bâtılı muhtemel olan her akîdevî lafız hakkında, istifsâl etmeden (ne kastedildiğini ayrıntılı sormadan) hüküm verilmez. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[1995.0, "وهذا من أعظم أصول أهل السنة والجماعة:"], [2001.0, "وهي أن كثيرًا من أهل البدع وصلوا إلى إنكار الحق وتقرير الباطل عن طريق الألفاظ المجملة التي تحتمل الحق والباطل؛"], [2012.0, "فإن جئتها من أحد طرفيها وجدتها حقًّا،"], [2015.0, "وإن جئتَ إلى الطرف الآخر وجدتها باطلًا."], [2018.0, "فأهل البدع يستغلّون طرفَ حقّها لتقرير باطلها."]], "tr": [[1995.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'in en büyük usûllerindendir."], [2001.0, "Şöyle ki: Bid'at ehlinin çoğu, hakkı inkâr etmeye ve bâtılı yerleştirmeye, hakkı ve bâtılı muhtemel olan mücmel lafızlar yoluyla ulaşmıştır."], [2012.0, "Böyle bir lafza iki tarafından birinden gelirsen onu hak bulursun;"], [2015.4, "diğer tarafından gelirsen onu bâtıl bulursun."], [2018.0, "Bid'at ehli, onun bâtılını yerleştirmek için onun hak tarafını istismar eder."]]}, {"reader": false, "ar": [[2027.0, "وأهل السنة والجماعة قرّروا قاعدةً ليسُدّوا على أهل البدع هذا الطريق،"], [2034.0, "وهي أن الألفاظ المجملة لا يجوز ردُّها مطلقًا لأن فيها حقًّا،"], [2039.5, "والحقُّ لا يُردّ، ولا يجوز قبولها مطلقًا لأن فيها باطلًا،"], [2045.5, "والباطل لا يُقبل؛ وإنما هي موقوفةٌ على الاستفصال حتى يتميّز حقُّها فيُقبل، من باطلها فيُردّ."]], "tr": [[2027.0, "Ehl-i Sünnet ve'l-Cemaat, bid'at ehline bu yolu kapatmak için bir kaide koymuştur:"], [2036.5, "Mücmel lafızları mutlak olarak reddetmek caiz değildir;"], [2041.0, "çünkü onlarda hak vardır, hak da reddedilmez."], [2047.0, "Onları mutlak olarak kabul etmek de caiz değildir;"], [2048.8, "çünkü onlarda bâtıl vardır, bâtıl da kabul edilmez."], [2050.6, "Bunlar, hakkı ayırt edilip kabul edilsin, bâtılı da ayırt edilip reddedilsin diye istifsâle bağlıdır."]]}, {"reader": false, "ar": [[2054.0, "كقولهم: ما ثَمّ إلا الله."], [2058.0, "فإن هذه لفظةٌ مجملةٌ تحتمل الحق والباطل،"], [2063.0, "وقوله «ثَمّ» أي: هناك."], [2067.0, "فإن كان يقصد «ما ثَمّ إلا الله» أي:"], [2070.3, "ما ثَمّ ربٌّ إلا الله،"], [2072.0, "وما ثَمّ خالقٌ إلا الله،"], [2075.0, "وما ثَمّ مالكٌ لذرّات الكون إلا الله،"], [2078.0, "وما ثَمّ إلهٌ يستحقّ العبادة إلا الله،"], [2081.0, "فهذه معانٍ حق. ولكنهم هم لا يقصدونها بهذه الكلمة،"], [2088.0, "وإنما يقصدون المعنى الباطل الكفري ـ أو الكفري الباطل ـ وهو أنّ «ما ثَمّ إلا الله» أي:"], [2096.3, "ذات الله؛ فكلُّ شيءٍ تراه عينك فهو ذات الله."]], "tr": [[2054.0, "Mesela onların \"Orada Allah'tan başka bir şey yoktur (mâ semme illallâh)\" sözleri gibi."], [2060.1, "Bu, hakkı ve bâtılı muhtemel olan mücmel bir lafızdır."], [2065.6, "\"Semme\" sözü \"orada\" demektir. Eğer \"Orada Allah'tan başka bir şey yoktur\" sözüyle, orada Allah'tan başka Rab yoktur, Allah'tan başka yaratıcı yoktur, kâinatın zerrelerinin Allah'tan başka sahibi yoktur, ibadete layık Allah'tan başka ilah yoktur manasını kastediyorsa, bunlar hak manalardır."], [2080.1, "Fakat onlar bu sözle bunları kastetmezler;"], [2083.0, "bâtıl ve küfrî —ya da küfrî ve bâtıl— manayı kastederler:"], [2090.2, "\"Orada Allah'tan başka bir şey yoktur\" yani Allah'ın zatından başka bir şey yoktur;"], [2096.3, "gözünün gördüğü her şey Allah'ın zatıdır."]]}, {"reader": false, "ar": [[2100.0, "فالله قد اتّحد وحلّ في جميع المخلوقات بذاته،"], [2104.0, "فكلُّ شيءٍ تراه بعينك فهو عينُ ذات الله عز وجل،"], [2110.0, "وإن اختلفت صورته باعتبار نظر العين."], [2113.0, "وأجمع أهل السنة على أن كلَّ من اعتقد حلولَ الله في شيءٍ من مخلوقاته،"], [2120.0, "أو أنه قد اتّحد بشيءٍ من مخلوقاته،"], [2123.5, "أنه كافرٌ زنديقٌ ضالٌّ مُضلّ."], [2126.0, "فانظر كيف حكم أهل السنة على هذه اللفظة المجملة بعد تمييز حقّها من باطلها."]], "tr": [[2100.0, "(Onlara göre) Allah zatıyla bütün mahlûklarla ittihad etmiş ve onlara hulûl etmiştir;"], [2105.6, "gözünle gördüğün her şey, gözün bakışı itibarıyla sureti farklı olsa bile, Allah Teâlâ'nın zatının ta kendisidir."], [2113.0, "Ehl-i Sünnet, Allah'ın mahlûklarından herhangi bir şeye hulûl ettiğine ya da mahlûklarından herhangi bir şeyle ittihad ettiğine inanan herkesin kâfir, zındık, sapık ve saptırıcı olduğu konusunda icma etmiştir."], [2126.0, "Bak, Ehl-i Sünnet bu mücmel lafzın hakkını bâtılından ayırt ettikten sonra onun hakkında nasıl hüküm verdi."]]}, {"reader": false, "ar": [[2135.0, "وكقولهم: لفظي بالقرآن مخلوق."], [2139.0, "فإنها كلمةٌ مجملةٌ تحتمل الحق والباطل."], [2145.0, "فإن كنتَ تقصد بقولك «لفظي» أي:"], [2148.4, "ما يرجع إلى صفتي من حركة لساني وشفتي وحبالي الصوتية،"], [2154.0, "فإن هذه مخلوقةٌ ولا شك."], [2158.0, "وإن كنتَ تقصد عينَ القرآن الذي تكلّمتُ به،"], [2163.0, "فلا جرم أنه غير مخلوق."], [2166.0, "وكلا المعنيين يحتملهما قولهم «لفظي»؛"], [2172.0, "فلم نقبلها مطلقًا لأن فيها حقًّا لا بد من قبوله،"], [2176.0, "ولم نردّها مطلقًا لأن فيها باطلًا… يجب ردُّه."], [2176.0, "<span class=\"note\">(Şeyh gerekçeleri yer değiştirerek söylüyor.)<\/span>"]], "tr": [[2135.0, "Yine onların \"Kur'an'ı telaffuzum (lafzım) mahlûktur\" sözleri gibi."], [2145.0, "Bu, hakkı ve bâtılı muhtemel olan mücmel bir sözdür."], [2148.4, "\"Lafzım\" sözünle, benim sıfatıma dönen şeyi, yani dilimin, dudaklarımın ve ses tellerimin hareketini kastediyorsan, bunlar şüphesiz mahlûktur."], [2158.0, "Eğer telaffuz ettiğim Kur'an'ın kendisini kastediyorsan, kesinlikle o mahlûk değildir."], [2163.0, "\"Lafzım\" sözü iki manayı da muhtemeldir."], [2166.0, "Bu yüzden onu mutlak olarak kabul etmedik;"], [2172.0, "çünkü onda mutlaka kabul edilmesi gereken bir hak vardır."], [2174.8, "Onu mutlak olarak reddetmedik; çünkü onda reddedilmesi vacip olan bir bâtıl vardır."]]}, {"reader": false, "ar": [[2183.0, "وكقولهم: الله في قلبي."], [2189.0, "فإن كان يقصد: حبُّه في قلبي،"], [2193.0, "الإيمانُ به في قلبي،"], [2196.0, "التسليمُ له في قلبي،"], [2201.0, "التوكّلُ عليه في قلبي،"], [2203.3, "فهذه معانٍ حق. وإن كان يقصد:"], [2206.7, "الله بذاته في قلبي،"], [2209.0, "فهذا من الكفر البَواح الذي يُستتاب صاحبه ثلاثًا،"], [2214.0, "فإن تاب وإلا قُتل."]], "tr": [[2183.0, "Yine onların \"Allah kalbimdedir\" sözleri gibi."], [2191.0, "Eğer \"O'nun sevgisi kalbimdedir, O'na iman kalbimdedir, O'na teslimiyet kalbimdedir, O'na tevekkül kalbimdedir\" manasını kastediyorsa, bunlar hak manalardır."], [2206.7, "Eğer \"Allah zatıyla kalbimdedir\" manasını kastediyorsa, bu apaçık küfürdendir;"], [2209.7, "sahibinden üç kez tövbe etmesi istenir;"], [2213.2, "tövbe ederse (ne âlâ), yoksa öldürülür."]]}, {"reader": false, "ar": [[2216.0, "وكقولهم: محمدٌ نورُ الله."], [2222.0, "فإن كانوا يقصدون نورَه باعتبار ما جاء به من البيان والشرع والرسالة،"], [2231.0, "فلا جرم أن ما جاء به من الكتاب والسنة والتشريع أنه نورٌ من الله،"], [2237.0, "لقول الله عز وجل:"], [2239.0, "<span class=\"ayah\">﴿وَلَٰكِن جَعَلْنَاهُ نُورًا نَّهْدِي بِهِ مَن نَّشَاءُ مِنْ عِبَادِنَا﴾<\/span> <span class=\"ref\">[الشورى: ٥٢]<\/span>."], [2244.0, "وأما إذا كان يقصد:"], [2246.8, "أي من نور صفته الذاتية،"], [2251.0, "فهذا كفر؛ فإن العلماء متّفقون على أن من اعتقد أن شيئًا من ذات الله قد حلّ في شيءٍ من ذوات خلقه،"], [2260.0, "أو أن شيئًا من ذوات خلقه قد حلّ في شيءٍ من ذات الله،"], [2265.0, "فإنه كافرٌ خالعٌ رِبقةَ الإسلام من عنقه بالكلية."]], "tr": [[2216.0, "Yine onların \"Muhammed Allah'ın nurudur\" sözleri gibi."], [2222.0, "Eğer onun nurunu, getirdiği beyan, şeriat ve risalet itibarıyla kastediyorlarsa, getirdiği Kitap, Sünnet ve teşriin Allah'tan bir nur olduğunda şüphe yoktur."], [2236.5, "Çünkü Allah Teâlâ şöyle buyurur:"], [2239.0, "<span class=\"ayah\">﴿Fakat biz onu, kullarımızdan dilediğimizi kendisiyle hidayete erdirdiğimiz bir nur kıldık﴾<\/span> [Şûrâ 52]."], [2244.0, "Fakat (Allah'ın) zâtî sıfatı olan nurundan (bir parça) kastediyorsa, bu küfürdür."], [2253.0, "Çünkü âlimler şu konuda ittifak etmiştir:"], [2255.5, "Allah'ın zatından bir şeyin O'nun yarattıklarının zatlarından bir şeye hulûl ettiğine ya da yarattıklarının zatlarından bir şeyin Allah'ın zatından bir şeye hulûl ettiğine inanan kimse kâfirdir;"], [2265.4, "İslam bağını boynundan tamamen çıkarıp atmıştır."]]}, {"reader": false, "ar": [[2268.0, "وكقولهم: الرسول واسطةٌ بيننا وبين الله."], [2276.0, "فإن لفظ «الواسطة» من الألفاظ المجملة؛"], [2281.0, "فإن كانوا يقصدون واسطة التبليغ والتشريع،"], [2285.0, "فلا جرم أنه واسطةٌ بيننا وبين الله في تبليغ الأحكام وتشريع السنن."], [2292.0, "وإن كانوا يقصدون بأنه واسطةٌ بيننا وبين الله في طلب الدعاء منه والاستغاثة به،"], [2303.0, "فإن هذا عينُ الشرك الذي جاء محمدٌ صلى الله عليه وسلم بنفيه ودحره ونقضه والنهي عنه."]], "tr": [[2268.0, "Yine onların \"Resûl bizimle Allah arasında bir vasıtadır\" sözleri gibi."], [2276.0, "\"Vasıta\" lafzı mücmel lafızlardandır. Eğer tebliğ ve teşri vasıtasını kastediyorlarsa, ahkâmın tebliği ve sünnetlerin teşrii konusunda onun bizimle Allah arasında bir vasıta olduğunda şüphe yoktur."], [2292.0, "Eğer ondan dua istemek ve ondan medet dilemek konusunda bizimle Allah arasında bir vasıta olduğunu kastediyorlarsa, bu, Muhammed ﷺ'in nefyetmek, defetmek, bozmak ve yasaklamak için geldiği şirkin ta kendisidir."]]}, {"reader": false, "ar": [[2315.0, "ومن أراد الاطّلاع أكثر على هذه الألفاظ العقدية المجملة فليرجع إلى رسالة… «رسالة في بيان شرح قاعدة المجملات عند أهل السنة والجماعة»."]], "tr": [[2315.0, "Bu mücmel akîdevî lafızlar hakkında daha fazla bilgi edinmek isteyen, \"Ehl-i Sünnet ve'l-Cemaat'e Göre Mücmel Lafızlar Kaidesinin Şerhini Açıklayan Risale\"ye… müracaat etsin."]]}]}, {"ts": "38:49", "title": "27. Külliye: Gidermekten âciz kalınan her cehalet özürdür", "paras": [{"reader": false, "ar": [[2329.0, "ومن الكليات أيضًا: <b>كلُّ جهلٍ معجوزٍ عن رفعه فعذر.<\/b> كأننا شرحناها في الفقه."], [2337.0, "كلُّ جهلٍ معجوزٍ عن رفعه فعذر."], [2344.7, "<span class=\"note\">(يكررها)<\/span> أقول: وذلك لأن رفع الجهل حكمٌ شرعي،"], [2354.0, "فلا يجوز للإنسان أن يجهل شيئًا يجب العلم به والعمل به وهو قادرٌ على رفعه عن نفسه،"], [2366.0, "لقول الله عز وجل:"], [2367.8, "<span class=\"ayah\">﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[النحل: ٤٣]<\/span>."]], "tr": [[2329.0, "Külliyelerden biri de şudur: 27."], [2331.0, "külliye: Gidermekten âciz kalınan her cehalet özürdür. Sanki bunu fıkıhta şerh etmiştik."], [2344.7, "(Tekrar ediyor.) Derim ki: Bunun sebebi, cehaleti gidermenin şer'î bir hüküm olmasıdır."], [2354.7, "İnsanın, bilinmesi ve amel edilmesi vacip olan bir şeyi, onu kendinden gidermeye gücü yettiği hâlde bilmemesi caiz değildir."], [2365.3, "Çünkü Allah Teâlâ şöyle buyurur:"], [2367.8, "<span class=\"ayah\">﴿Eğer bilmiyorsanız zikir ehline sorun﴾<\/span> [Nahl 43]."]]}, {"reader": false, "ar": [[2371.0, "فبما أن رفع الجهل وطلب العلم من الأحكام الشرعية،"], [2376.0, "فإنه لا بد وأن نقيّدها بالقدرة،"], [2378.0, "لقول الله عز وجل:"], [2380.0, "<span class=\"ayah\">﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ﴾<\/span> <span class=\"ref\">[التغابن: ١٦]<\/span>،"], [2382.0, "أي: اطلبوا العلم بالمقدار الذي تستطيعونه،"], [2386.0, "ولقول النبي صلى الله عليه وسلم:"], [2389.0, "«وإذا أمرتكم بأمرٍ فأتوا منه ما استطعتم»،"], [2394.0, "ولأن المتقرّر في القواعد أن التكاليف الشرعية منوطةٌ بالقدرة على العلم والعمل،"], [2402.0, "فلا واجبَ مع العجز إجماعًا."]], "tr": [[2371.0, "Cehaleti gidermek ve ilim talep etmek şer'î hükümlerden olduğuna göre, onu güç yetirmeyle kayıtlamamız gerekir."], [2377.6, "Çünkü Allah Teâlâ şöyle buyurur:"], [2380.0, "<span class=\"ayah\">﴿Gücünüz yettiğince Allah'tan korkun﴾<\/span> [Tegâbün 16];"], [2382.7, "yani ilmi gücünüz yettiği ölçüde talep edin."], [2386.5, "Nebî ﷺ de şöyle buyurur:"], [2389.0, "\"Size bir şey emrettiğimde ondan gücünüz yettiğini yapın.\" Ayrıca kaidelerde yerleşik olan şudur:"], [2396.7, "Şer'î teklifler, bilmeye ve amel etmeye güç yetirmeye bağlıdır;"], [2401.3, "icma ile acziyet varken vacip yoktur."]]}, {"reader": false, "ar": [[2405.0, "فبما أن رفع الجهل مأمورٌ به،"], [2409.0, "فيكون الأمر به مقرونًا بالقدرة والاستطاعة."], [2412.0, "فمن كان قادرًا على رفع الجهل عن نفسه،"], [2416.0, "وتكاسل وتقاعس وفتر مع انفتاح أبواب العلم والتعلّم،"], [2423.0, "فإنه من الجهل المقدور على رفعه،"], [2427.0, "ويسمّيه بعض أهل السنة بالجهل الاختياري،"], [2430.0, "أي: هو قادرٌ على رفعه ولكنه اختار البقاء فيه."], [2433.0, "فالجهل الاختياري ليس بعذرٍ عند أهل العلم."]], "tr": [[2405.0, "Cehaleti gidermek emredildiğine göre, onunla ilgili emir güç ve takat ile birlikte olur."], [2412.0, "Cehaleti kendinden gidermeye gücü yeten, ilim ve öğrenme kapıları açık olduğu hâlde tembellik eden, geri duran ve gevşeyen kimsenin cehaleti, gidermeye güç yetirilen cehalettendir."], [2427.0, "Ehl-i Sünnet'ten bazıları buna \"ihtiyarî cehalet\" der;"], [2430.4, "yani onu gidermeye gücü yeter, fakat onda kalmayı tercih etmiştir."], [2433.0, "İhtiyarî cehalet, ehl-i ilim katında özür değildir."]]}, {"reader": false, "ar": [[2440.0, "ولكن هناك من الناس من يصيبه الجهل في بعض المسائل،"], [2445.0, "ويبحث عن طريقٍ يتعلّم فيه،"], [2448.5, "ولكن قد سُدّت جميع طرق التعلّم؛"], [2453.0, "فجهلُه من الجهل المعجوز عن رفعه،"], [2458.0, "وهو الجهل الذي يسمّيه بعض أهل العلم بالجهل الاضطراري،"], [2464.0, "أي: لا يستطيع أن يرفعه لانغلاق وانسداد أبواب التعلّم في وجهه."]], "tr": [[2440.0, "Fakat insanlardan öyleleri vardır ki bazı meselelerde cehalete düşer, öğrenebileceği bir yol arar, fakat bütün öğrenme yolları kapanmıştır."], [2453.0, "Onun cehaleti, gidermekten âciz kalınan cehalettendir."], [2458.0, "Bazı ehl-i ilmin \"ızdırarî cehalet\" dediği cehalet budur;"], [2464.7, "yani öğrenme kapıları yüzüne kapandığı ve tıkandığı için onu gideremez."]]}, {"reader": false, "ar": [[2472.0, "كمن نشأ في باديةٍ بعيدةٍ عن العلم والعلماء،"], [2476.0, "وليس بينه وبينهم أيُّ وسيلةٍ من وسائل التواصل،"], [2480.0, "وكالكافر الحربيّ إذا أسلم وبقي في دار حربه بقاءَ اضطرار،"], [2486.0, "مع خلوّ دار الحرب من العلماء وطلاب العلم في الأعمّ الأغلب،"], [2491.1, "وكالذي ينشأ في غابةٍ أو أدغالٍ بعيدةٍ عن الناس وبعيدةٍ عن المدن والتعلّم."], [2501.0, "فمثل هؤلاء يعجزون عن رفع العلم ـ عفوًا ـ عن رفع الجهل عن أنفسهم بالعلم والتعلّم."]], "tr": [[2472.0, "İlimden ve âlimlerden uzak bir çölde yetişen ve onlarla arasında hiçbir iletişim vasıtası bulunmayan kimse gibi."], [2480.6, "Harbî kâfirin Müslüman olup, çoğunlukla âlimlerden ve ilim talebelerinden boş olan dâru'l-harbde zorunlu olarak kalması gibi."], [2489.6, "İnsanlardan, şehirlerden ve öğrenimden uzak bir ormanda ya da sık ağaçlıklarda yetişen kimse gibi."], [2501.0, "Bu gibiler ilmi —pardon— cehaleti ilim ve öğrenmeyle kendilerinden gidermekten âcizdir."]]}, {"reader": false, "ar": [[2511.0, "فمن كان جهله جهلَ اختيارٍ فغير معذورٍ به،"], [2519.0, "ومن كان جهله جهلَ اضطرارٍ فهو معذورٌ به."], [2524.0, "ولذلك عذر النبي صلى الله عليه وسلم عمرَ وعمّارًا لما بعثهما في حاجةٍ فأجنبا؛"], [2535.0, "فأما عمّارٌ فتمعّك في الصعيد كما تتمعّك الدابة،"], [2540.0, "وصلّى بهذا التيمّم، وهي صفةُ تيمّمٍ خاطئة،"], [2547.0, "وأما عمرُ فبقي أيامًا لا يصلّي،"], [2550.0, "ظنًّا منه أن التيمّم إنما يرفع الحدث الأصغر دون الأكبر."]], "tr": [[2511.0, "Cehaleti ihtiyarî cehalet olan kimse onunla mazur değildir;"], [2519.0, "cehaleti ızdırarî cehalet olan ise onunla mazurdur."], [2524.0, "Bu yüzden Nebî ﷺ, Ömer ile Ammâr'ı bir iş için gönderdiğinde cünüp olduklarında onları mazur gördü."], [2535.0, "Ammâr, hayvanın toprakta yuvarlandığı gibi toprakta yuvarlandı ve bu teyemmümle namaz kıldı;"], [2542.0, "bu yanlış bir teyemmüm şeklidir."], [2547.5, "Ömer ise, teyemmümün büyük hadesi değil sadece küçük hadesi kaldırdığını zannederek günlerce namaz kılmadan kaldı."]]}, {"reader": false, "ar": [[2555.0, "فلما أخبرهما النبي صلى الله عليه وسلم بالوجهة الشرعية الصحيحة لم يأمر أحدًا بقضاء شيءٍ فاته،"], [2564.0, "مما يدلّ على أنهما معذوران لعدم علمهما بحقيقة الحكم."], [2570.0, "ولما جاءت حَمْنةُ تقول:"], [2573.0, "يا رسول الله، إني أُستحاض حيضةً كثيرةً شديدةً تمنعني من الصوم والصلاة،"], [2581.0, "فعلم رسول الله صلى الله عليه وسلم أنها قعدت عن صلاةٍ واجبةٍ وعن صومٍ واجب،"], [2588.0, "ومع ذلك دلّها على الوجهة الشرعية الصحيحة وكيفية التعامل في حال الاستحاضة،"], [2593.0, "ولم يأمرها بقضاء صومٍ فات ولا صلاةٍ فاتت،"], [2597.0, "مما يدلّ على أنه عذرها لعدم علمها،"], [2600.0, "وجهلُها معجوزٌ عن رفعه،"], [2603.0, "لأنها كانت تفعل الشيء ظنًّا منها بصواب نفسها."]], "tr": [[2555.0, "Nebî ﷺ onlara doğru şer'î yolu haber verdiğinde, hiçbirine kaçırdığı bir şeyi kaza etmesini emretmedi."], [2562.5, "Bu, hükmün hakikatini bilmedikleri için mazur olduklarını gösterir."], [2566.7, "Hamne gelip \"Ey Allah'ın Resûlü!"], [2570.0, "Beni oruçtan ve namazdan alıkoyan çok ve şiddetli bir istihâza kanı görüyorum\" dediğinde, Resûlullah ﷺ onun vacip bir namazı ve vacip bir orucu terk ettiğini bildi."], [2571.5, "Buna rağmen ona doğru şer'î yolu ve istihâza hâlinde nasıl davranacağını gösterdi;"], [2572.2, "kaçırdığı orucu ve kaçırdığı namazı kaza etmesini emretmedi."], [2573.0, "Bu, onu bilmediği için mazur gördüğünü gösterir;"], [2585.2, "onun cehaleti gidermekten âciz kalınan bir cehaletti;"], [2595.5, "çünkü bir şeyi kendi doğruluğunu zannederek yapıyordu."]]}, {"reader": false, "ar": [[2607.0, "وعذر النبي صلى الله عليه وسلم عديَّ بن حاتمٍ لما أفطر في نهار رمضان متأوّلًا قول الله عز وجل:"], [2618.0, "<span class=\"ayah\">﴿حَتَّىٰ يَتَبَيَّنَ لَكُمُ الْخَيْطُ الْأَبْيَضُ مِنَ الْخَيْطِ الْأَسْوَدِ مِنَ الْفَجْرِ﴾<\/span> <span class=\"ref\">[البقرة: ١٨٧]<\/span>؛"], [2624.0, "فلما أخبره بأن هذا ليس المعنى الصحيح،"], [2627.0, "ودلّه على الوجهة الشرعية الصحيحة،"], [2630.0, "لم يأمره بقضاء هذا اليوم."], [2632.0, "ولم يأمر النبي صلى الله عليه وسلم أهلَ قباء ـ لما افتتحوا صلاتهم إلى القبلة المنسوخة ـ بإعادة تلك الصلاة،"], [2642.0, "لأنهم معذورون لجهلهم بماذا؟"], [2645.0, "بتحويل القبلة ونسخها. وهكذا دواليك."]], "tr": [[2607.0, "Nebî ﷺ, Allah Teâlâ'nın <span class=\"ayah\">﴿Fecrin beyaz ipliği siyah iplikten ayırt edilinceye kadar﴾<\/span> [Bakara 187] sözünü te'vil ederek Ramazan gündüzünde (vakti geçtiği hâlde) yiyen Adî b."], [2624.0, "Hâtim'i de mazur gördü. Bunun doğru mana olmadığını ona haber verip doğru şer'î yolu gösterdiğinde, o günü kaza etmesini emretmedi."], [2632.0, "Nebî ﷺ, namazlarına neshedilmiş kıbleye doğru başlayan Kubâ ehline de o namazı iade etmelerini emretmedi;"], [2639.9, "çünkü neyi bilmedikleri için mazurdular?"], [2645.0, "Kıblenin değiştirilmesini ve neshedilmesini. Bu böyle devam eder."]]}, {"reader": false, "ar": [[2649.0, "إلا أنه ليس كلُّ من ادّعى الجهل نقبل دعواه،"], [2653.0, "حتى ننظر إلى القرائن التي تصاحب دعواه؛"], [2657.0, "فإن كانت تصدّق دعواه ـ بمعنى أنها تبيّن لنا أن جهله كان من قبيل جهل الاضطرار ـ فإننا نجعل جهله عذرًا،"], [2667.0, "وأما إذا كانت القرائن تكذّب دعواه،"], [2670.0, "وتبيّن لنا أن جهله جهلُ اختيار،"], [2674.0, "فلا نجعل جهله عذرًا. والله أعلم."]], "tr": [[2649.0, "Ancak cehalet iddia eden herkesin iddiasını, iddiasına eşlik eden karinelere bakmadan kabul etmeyiz."], [2657.0, "Karineler onun iddiasını doğruluyorsa —yani cehaletinin ızdırarî cehalet kabilinden olduğunu bize gösteriyorsa— cehaletini özür sayarız."], [2664.8, "Karineler onun iddiasını yalanlıyor ve cehaletinin ihtiyarî cehalet olduğunu bize gösteriyorsa, cehaletini özür saymayız. Allah en iyisini bilir."]]}]}, {"ts": "44:36", "title": "28. Külliye: Dinden zaruri olarak bilinen kat'î meselelerde cehalet özür değildir", "paras": [{"reader": false, "ar": [[2676.0, "ومن الكليات أيضًا: <b>كلُّ قطعيٍّ معلومٍ من الدين بالضرورة فلا يُعذر فيه بالجهل.<\/b> كلُّ قطعيٍّ معلومٍ من الدين بالضرورة فلا يُعذر فيه بالجهل."], [2691.0, "كالعلم… كالجهل بوجود الله،"], [2698.0, "فإننا لا نقبل فيه دعوى الجهل لأنه معلومٌ من الدين بالضرورة."], [2704.0, "وكإنكار عالم الملائكة، فإننا لا نقبل في هذا الإنكار دعوى الجهل لأنه معلومٌ من الدين بالضرورة."]], "tr": [[2676.0, "Külliyelerden biri de şudur: 28."], [2678.0, "külliye: Dinden zaruri olarak bilinen her kat'î meselede cehaletle mazur görülmez. (Tekrar ediyor.) Mesela bilmek… Allah'ın varlığını bilmemek gibi;"], [2691.0, "bunda cehalet iddiasını kabul etmeyiz, çünkü dinden zaruri olarak bilinir."], [2702.0, "Melekler âlemini inkâr etmek gibi;"], [2704.0, "bu inkârda cehalet iddiasını kabul etmeyiz, çünkü dinden zaruri olarak bilinir."]]}, {"reader": false, "ar": [[2713.0, "وكإنكار وحدانية الله عز وجل،"], [2718.0, "وإنكار ربوبيته، وإنكار أسمائه جملةً وتفصيلًا،"], [2723.0, "وصفاته جملةً وتفصيلًا؛ فكلُّ ذلك من الجهل في مسائل معلومةٍ من الدين بالضرورة،"], [2731.0, "فلا نقبل دعوى الجهل فيها."], [2734.0, "وكإنكار فرضية الصلوات الخمس،"], [2737.0, "وإنكار فرضية الزكوات، وإنكار فرضية صيام شهر رمضان،"], [2744.0, "وإنكار فرضية الحج لبيت الله الحرام،"], [2748.0, "وإنكار تحريم الزنا، وجحد تحريم السرقة وشرب الخمر واللواط وغيرها من المحرّمات."]], "tr": [[2713.0, "Allah Teâlâ'nın birliğini inkâr etmek, rubûbiyyetini inkâr etmek, isimlerini toptan ve tek tek, sıfatlarını toptan ve tek tek inkâr etmek gibi."], [2726.0, "Bunların hepsi dinden zaruri olarak bilinen meselelerdeki cehalettendir;"], [2730.5, "bunlarda cehalet iddiasını kabul etmeyiz."], [2734.0, "Beş vakit namazın farziyetini inkâr etmek, zekâtların farziyetini inkâr etmek, Ramazan ayı orucunun farziyetini inkâr etmek, Beytullah'ı haccetmenin farziyetini inkâr etmek, zinanın haramlığını inkâr etmek, hırsızlığın, içki içmenin, livâtanın ve diğer haramların haramlığını inkâr etmek gibi."]]}, {"reader": false, "ar": [[2760.0, "فمن أنكر وجوبَ واجبٍ معلومٍ وجوبُه من الدين بالضرورة،"], [2766.0, "أو استحلّ حرامًا معلومًا حرمتُه من الدين بالضرورة،"], [2775.0, "فإنه يُعتبر كافرًا… معلومًا من الدين بالضرورة،"], [2779.0, "فإنه يُعتبر كافرًا، ولا نعذره بالجهل."]], "tr": [[2760.0, "Vücûbu dinden zaruri olarak bilinen bir vacibin vücûbunu inkâr eden ya da haramlığı dinden zaruri olar
