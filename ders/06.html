ak bilinen bir haramı helal sayan kimse kâfir sayılır… Dinden zaruri olarak bilinen… kâfir sayılır; onu cehaletle mazur görmeyiz."]]}, {"reader": false, "ar": [[2785.0, "فإن قلت: وماذا تقصد بالمسائل القطعية المعلومة من الدين بالضرورة؟"], [2791.0, "فأقول: هي ما لا تحتاج إلى تعلّمٍ ولا طلبٍ ولا نظرٍ في دليل،"], [2798.0, "لأن المجتمع الإسلامي يعلمها عن بَكرة أبيها ـ أو عن بَكرة أبيه ـ فيشترك في علمها الصغار قبل الكبار،"], [2808.3, "والعوامّ والعلماء وطلاب العلم وأنصاف المثقّفين،"], [2812.9, "والذكور والإناث، والإنس والجن."]], "tr": [[2785.0, "\"Dinden zaruri olarak bilinen kat'î meselelerle neyi kastediyorsun?\" dersen, derim ki:"], [2791.0, "Bunlar öğrenmeye, talebe ve delile bakmaya ihtiyaç duyulmayan meselelerdir;"], [2796.4, "çünkü İslam toplumu onları istisnasız bütünüyle bilir."], [2800.7, "Onları bilmekte büyüklerden önce küçükler, avam, âlimler, ilim talebeleri ve yarı aydınlar, erkekler ve kadınlar, insler ve cinler ortaktır."]]}, {"reader": false, "ar": [[2817.0, "فصارت من العلوم الضرورية الاضطرارية التي لا تحتاج في تعلّمها ولا فهمها ولا معرفتها إلى نظرٍ ولا إلى استدلالٍ أبدًا،"], [2828.0, "كما ضربتُ لكم أمثلتها،"], [2831.0, "فيسمّي العلماء هذا النوع من المسائل:"], [2835.2, "المعلومَ من الدين بالضرورة."], [2838.0, "فإن قلت: ولماذا لم تعذر فيه بالجهل؟"], [2840.0, "أقول: لأنه إذا ادّعى الجهل في هذا النوع من المسائل فقرائنُ الدعوى تكذّب دعواه،"], [2848.0, "لأن المجتمع كلَّه يعلم الحكم."]], "tr": [[2817.0, "Böylece bunlar, öğrenilmesinde, anlaşılmasında ve bilinmesinde asla düşünmeye ve istidlale ihtiyaç duyulmayan zaruri ve ızdırarî ilimlerden olmuştur;"], [2827.5, "size örneklerini verdiğim gibi. Âlimler bu tür meselelere \"dinden zaruri olarak bilinen\" derler."], [2838.0, "\"Neden bunda cehaletle mazur görmedin?\" dersen, derim ki:"], [2840.0, "Çünkü bu tür meselelerde cehalet iddia ederse, iddianın karineleri onun iddiasını yalanlar;"], [2846.8, "zira bütün toplum hükmü bilmektedir."]]}, {"reader": false, "ar": [[2851.0, "فكيف أنت تكون فردًا في مجتمعٍ عالمٍ وأنت جاهلٌ بهذه المسألة،"], [2855.0, "والمجتمع كلُّه ـ صغيرُه وكبيرُه،"], [2857.7, "ذكرُه وأنثاه، عالِمُه وعاميُّه ـ كلُّهم يعرفون؟"], [2863.0, "فأنت تكذب في هذه الدعوى."], [2864.0, "فكلُّ ما تواترت به الأدلة وصار من العلوم الاضطرارية فإننا لا نقبل فيه دعوى الجهل."]], "tr": [[2851.0, "Sen, bilen bir toplumun bir ferdi olup da bu meseleyi nasıl bilmezsin?"], [2854.6, "Bütün toplum —küçüğü ve büyüğü, erkeği ve kadını, âlimi ve avamı— hepsi biliyor."], [2863.0, "Demek ki bu iddiada yalan söylüyorsun."], [2864.0, "Delillerin tevâtür ile geldiği ve ızdırarî ilimlerden olan her şeyde cehalet iddiasını kabul etmeyiz."]]}]}, {"ts": "47:52", "title": "29. Külliye: Hükmün aslını bilip sonuçlarını bilmeyenin fiilinde özrü yoktur", "paras": [{"reader": false, "ar": [[2872.0, "ومن الكليات أيضًا: <b>كلُّ من علم بأصل الحكم وجهل آثارَه فلا عذرَ له في فعله.<\/b> كلُّ من علم بأصل الحكم وجهل آثاره فلا عذر له في فعله. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2872.0, "Külliyelerden biri de şudur: 29."], [2876.8, "külliye: Hükmün aslını bilip onun sonuçlarını (âsârını) bilmeyen herkesin, fiilinde özrü yoktur. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2909.0, "أقول وبالله التوفيق: لا بد أن نفرّق بين الجهل بأصل الحكم والجهل بآثار الحكم."], [2918.0, "فالجهل الذي يُعتبر عذرًا هو الجهل المعجوز عن رفعه في أصل الحكم،"], [2925.0, "وأما إذا كان الإنسان عالمًا بأصل الحكم ـ أمرًا أو نهيًا ـ ولكن جهل الآثار التي تترتّب على هذا الحكم،"], [2934.0, "فإن جهله بالآثار ليس بعذرٍ يرفع عنه ما يجب عليه في هذا الشأن."]], "tr": [[2909.0, "Tevfik Allah'tandır, derim ki: Hükmün aslını bilmemek ile hükmün sonuçlarını bilmemek arasında ayrım yapmamız gerekir."], [2918.0, "Özür sayılan cehalet, hükmün aslında gidermekten âciz kalınan cehalettir."], [2924.0, "İnsan hükmün aslını —emir ya da yasak olarak— biliyor, fakat bu hükme terettüp eden sonuçları bilmiyorsa, sonuçları bilmemesi, bu konuda kendisine vacip olanı üzerinden kaldıracak bir özür değildir."]]}, {"reader": false, "ar": [[2943.0, "فلو أن إنسانًا علم أن الجماع في نهار رمضان حرام،"], [2949.0, "ولكن كان يجهل وجوب الكفّارة،"], [2952.0, "فجهلُه بالكفّارة لا يرفع عنه أثرها ـ أو لا يرفع عنه حكمها ـ فنرتّب على فعله الكفّارة ولو كان يجهل بها،"], [2965.0, "فإن جهله ليس في أصل الحكم وإنما في أثره."], [2969.0, "ولو أن إنسانًا علم حرمة الزنا،"], [2972.0, "ولكن كان يجهل وجوبَ الجلد مئةً إن كان بكرًا والرجمِ إن كان ثيّبًا،"], [2980.0, "فإننا نرتّب عليه مقتضى زناه،"], [2984.0, "لأن جهله ليس بأصل الحكم وإنما بآثاره وعقوباته."]], "tr": [[2943.0, "Bir insan Ramazan gündüzünde cinsel ilişkinin haram olduğunu bilse, fakat kefaretin vacip olduğunu bilmese, kefareti bilmemesi onun sonucunu —ya da hükmünü— üzerinden kaldırmaz."], [2961.2, "Bilmese bile fiiline kefareti terettüp ettiririz;"], [2965.4, "çünkü cehaleti hükmün aslında değil, sonucundadır."], [2969.0, "Bir insan zinanın haramlığını bilse, fakat bekârsa yüz celde, evliyse recm vacip olduğunu bilmese, zinasının gereğini ona uygularız;"], [2982.4, "çünkü cehaleti hükmün aslında değil, sonuçlarında ve cezalarındadır."]]}, {"reader": false, "ar": [[2990.0, "وكإنسانٍ علم بحرمة القتل،"], [2997.0, "ولكن كان يجهل وجوب القصاص والدية فيه،"], [3000.0, "فنرتّب عليه القصاص، لأن جهله ليس بأصل الحكم وإنما بآثاره."], [3009.0, "وكإنسانٍ يعلم بحرمة شرب الخمر في الإسلام،"], [3013.0, "ولكن كان يجهل وجوب إقامة الحدّ على شربه،"], [3016.0, "فإننا نقيم عليه الحدّ،"], [3018.0, "لأن جهله ليس في أصل الحكم وإنما في آثاره."]], "tr": [[2990.0, "Öldürmenin haramlığını bilip onda kısasın ve diyetin vacip olduğunu bilmeyen insan gibi;"], [3000.9, "ona kısası uygularız; çünkü cehaleti hükmün aslında değil, sonuçlarındadır."], [3009.0, "İslam'da içki içmenin haramlığını bilip içmesi sebebiyle had uygulanmasının vacip olduğunu bilmeyen insan gibi;"], [3017.0, "ona haddi uygularız; çünkü cehaleti hükmün aslında değil, sonuçlarındadır."]]}, {"reader": false, "ar": [[3022.0, "وكإنسانٍ يعلم حرمة السرقة،"], [3026.0, "ولكن كان يجهل وجوب القطع فيها،"], [3029.0, "فإننا نقطعه إذا سرق،"], [3032.0, "لأنه إنما يجهل الأثر،"], [3035.0, "لا أصلَ الحكم. فالجهل الذي يُعتبر عذرًا إنما هو الجهل المعجوز عنه في أصل الحكم،"], [3042.0, "لا في آثاره ومتعلّقاته. ولعلكم فهمتم."]], "tr": [[3022.0, "Hırsızlığın haramlığını bilip onda (el) kesmenin vacip olduğunu bilmeyen insan gibi;"], [3029.0, "hırsızlık yaparsa elini keseriz; çünkü o sadece sonucu bilmemektedir, hükmün aslını değil."], [3038.0, "Özür sayılan cehalet, sadece hükmün aslında âciz kalınan cehalettir;"], [3041.2, "sonuçlarında ve taalluklarında değil. Umarım anladınız."]]}]}, {"ts": "50:45", "title": "30. Külliye: Hakkı ve ehlini çirkin sıfatlarla niteleyen, hevâ ve bid'at ehlindendir", "paras": [{"reader": false, "ar": [[3045.0, "ومن الكليات أيضًا: <b>كلُّ من وصف الحقَّ وأهلَه بصفاتٍ قبيحةٍ مستهجَنةٍ فمن أهل الأهواء والبدع.<\/b> كلُّ من وصف الحق… هذه الآن صفاتُ أهل البدع،"], [3056.7, "كلياتٌ في صفات أهل البدع."], [3057.0, "كلُّ من وصف الحق وأهله بصفاتٍ قبيحةٍ مستهجنةٍ فمن أهل الأهواء والبدع. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[3045.0, "Külliyelerden biri de şudur: 30."], [3047.0, "külliye: Hakkı ve ehlini çirkin ve iğrenç sıfatlarla niteleyen herkes hevâ ve bid'at ehlindendir. Hakkı niteleyen herkes… Bunlar şimdi bid'at ehlinin sıfatlarıdır;"], [3056.7, "bid'at ehlinin sıfatları hakkında külliyelerdir."], [3057.0, "Hakkı ve ehlini çirkin ve iğrenç sıfatlarla niteleyen herkes hevâ ve bid'at ehlindendir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[3069.0, "أقول: إنّ لكلّ طائفةٍ علامات،"], [3076.0, "وإنّ من أعظم علامات أهل البدع أنهم ينصِبون على الحق وأهله،"], [3082.3, "فيصفونهم بصفاتٍ قبيحةٍ مستهجنةٍ حتى يُنفِّروا من الحق وأهله."], [3089.0, "وقد ورثوا هذا المنهج الشيطانيَّ الإبليسيَّ الخطيرَ الملعونَ المأفونَ من آبائهم من أهل الشرك؛"], [3098.0, "فإنّ كلَّ أمةٍ بُعث لها رسولٌ لا بد أن تصفه وتصف رسالته بالأوصاف القبيحة المستهجنة."]], "tr": [[3069.0, "Derim ki: Her taifenin alametleri vardır."], [3072.2, "Bid'at ehlinin en büyük alametlerinden biri, hakka ve ehline düşmanlık beslemeleri ve insanları haktan ve ehlinden nefret ettirmek için onları çirkin ve iğrenç sıfatlarla nitelemeleridir."], [3089.0, "Bu şeytanî, iblisçe, tehlikeli, lanetli ve akılsızca metodu, şirk ehlinden olan atalarından miras almışlardır."], [3098.0, "Çünkü kendisine bir peygamber gönderilen her ümmet, mutlaka onu ve risaletini çirkin ve iğrenç vasıflarla nitelemiştir."]]}, {"reader": false, "ar": [[3107.0, "كما قال الله عز وجل:"], [3110.0, "<span class=\"ayah\">﴿أَمْ يَقُولُونَ شَاعِرٌ﴾<\/span> <span class=\"ref\">[الطور: ٣٠]<\/span>، فيصفون الحقَّ وأهله بأنه تخرّصٌ وقولُ شِعر."], [3121.0, "وكما قال الله عز وجل:"], [3124.0, "<span class=\"ayah\">﴿إِنْ هَٰذَا إِلَّا سِحْرٌ يُؤْثَرُ﴾<\/span> <span class=\"ref\">[المدثر: ٢٤]<\/span>،"], [3126.0, "فيصفون الحقَّ وأهله بأنهم سحرة،"], [3128.0, "وأنّ ما يقولونه إنما هو من قبيل السحر."], [3132.0, "وكما قال الله عز وجل:"], [3135.0, "قالوا: <span class=\"ayah\">﴿سَاحِرٌ كَذَّابٌ﴾<\/span> <span class=\"ref\">[غافر: ٢٤]<\/span>، فيصفونهم بأنهم كذّابون وسحرة."]], "tr": [[3107.0, "Nitekim Allah Teâlâ şöyle buyurur:"], [3110.0, "<span class=\"ayah\">﴿Yoksa \"(O) bir şairdir\" mi diyorlar?﴾<\/span> [Tûr 30]."], [3117.4, "Böylece hakkı ve ehlini, (hakkın) bir uydurma ve şiir sözü olduğu şeklinde nitelerler."], [3124.0, "Yine Allah Teâlâ şöyle buyurur:"], [3125.2, "<span class=\"ayah\">﴿Bu, (başkalarından) nakledilen bir sihirden başka bir şey değildir﴾<\/span> [Müddessir 24]."], [3127.6, "Böylece hakkı ve ehlini, onların sihirbaz olduğu ve söylediklerinin sihir kabilinden olduğu şeklinde nitelerler."], [3132.0, "Yine Allah Teâlâ'nın bildirdiği gibi, <span class=\"ayah\">﴿(Bu) yalancı bir sihirbazdır﴾<\/span> dediler [Mü'min (Ğâfir) 24]."], [3136.3, "Böylece onları yalancılar ve sihirbazlar olarak nitelerler."]]}, {"reader": false, "ar": [[3140.0, "وكذلك قال الله عز وجل:"], [3143.0, "<span class=\"ayah\">﴿إِنَّمَا يُعَلِّمُهُ بَشَرٌ﴾<\/span> <span class=\"ref\">[النحل: ١٠٣]<\/span>، فينسبون هذا الحقَّ إلى التعليم البشري،"], [3149.0, "لا إلى الوحي الربانيّ الإلهي."], [3151.0, "وإذا سمعوا الحقَّ فإنهم يعبّرون عنه بما قاله الله عنهم في قوله:"], [3157.0, "<span class=\"ayah\">﴿أَسَاطِيرُ الْأَوَّلِينَ﴾<\/span>، من باب تقبيح الحق وأهله."]], "tr": [[3140.0, "Yine Allah Teâlâ şöyle buyurur:"], [3143.0, "<span class=\"ayah\">﴿Ona bunu ancak bir beşer öğretiyor﴾<\/span> [Nahl 103]."], [3147.0, "Böylece bu hakkı ilâhî ve rabbânî vahye değil, beşerî bir öğretime nispet ederler."], [3151.0, "Hakkı işittiklerinde de ondan, Allah'ın onlar hakkında <span class=\"ayah\">﴿Öncekilerin masalları﴾<\/span> sözüyle bildirdiği şekilde söz ederler;"], [3157.0, "hakkı ve ehlini çirkin göstermek kabilinden."]]}, {"reader": false, "ar": [[3162.0, "ولا يزال أهلُ البدع يصفون أهلَ السنة بصفاتٍ قبيحةٍ حتى يُنفّروا عن الحق؛"], [3171.0, "فالمعطِّلة يصفوننا بالمجسِّمة، والرافضة يصفوننا بالنواصب،"], [3181.0, "وأهل الكلام يسمّوننا ـ أو يصفوننا ـ بالنابتة،"], [3188.0, "وكثيرٌ من أهل الطوائف يصفون أهل الحق بالصابئة،"], [3198.0, "أو يصفوننا بالوهّابية، أو يصفوننا بالظلاميّين،"], [3207.0, "أو يصفوننا بالمتطرّفين، أو يصفوننا بالأصوليّين الرجعيّين."]], "tr": [[3162.0, "Bid'at ehli, insanları haktan nefret ettirmek için Ehl-i Sünnet'i çirkin sıfatlarla nitelemeye devam etmektedir."], [3165.8, "Muattıla bizi \"Mücessime\" (Allah'a cisim isnat edenler) diye niteler;"], [3169.0, "Râfıza bizi \"Nevâsıb\" (Ehl-i Beyt düşmanları) diye niteler;"], [3171.0, "kelâm ehli bizi \"Nâbite\" (sonradan türeyenler) diye adlandırır —ya da niteler—."], [3183.3, "Taife ehlinin birçoğu hak ehlini \"Sâbie\" (dinden dönenler) diye niteler;"], [3196.5, "ya da bizi \"Vehhâbîler\", ya da \"karanlıkçılar\", ya da \"aşırılar\", ya da \"gerici köktenciler\" diye nitelerler."]]}, {"reader": false, "ar": [[3219.0, "أو يصفوننا بالشكّاكة، كما وصفنا بها طائفةٌ من المرجئة؛"], [3226.0, "فيصفون أهلَ السنة بالشكّاكة،"], [3229.0, "لأننا نُجيز في بعض التفاصيل قَرْنَ الإيمان بالمشيئة،"], [3234.0, "فتقول: أنا مؤمنٌ إن شاء الله،"], [3236.3, "على تفصيلٍ ستأتينا كلياتُه فيما بعد إن شاء الله تعالى."]], "tr": [[3219.0, "Ya da bizi \"Şekkâke\" (şüpheciler) diye nitelerler;"], [3226.0, "Mürcie'den bir taifenin bizi bununla nitelediği gibi."], [3230.8, "Ehl-i Sünnet'i \"şüpheciler\" diye nitelerler;"], [3234.3, "çünkü biz bazı tafsilatta imanı meşîete (Allah'ın dilemesine) bağlamayı caiz görürüz;"], [3237.1, "\"İnşallah ben müminim\" dersin. Bunun tafsilatı, inşallah ileride külliyeleriyle gelecektir."]]}, {"reader": false, "ar": [[3240.0, "ولا يزال هذا المسلسلُ مستمرًّا إلى أن يرث الله الأرضَ ومن عليها،"], [3246.0, "وينتهيَ النزاعُ بين الحق والباطل؛"], [3249.0, "وإلا فلا يزال أهل الباطل دائمًا وأبدًا يصفون أهل الحق بتلك الصفات."], [3253.0, "فإيّاكم ثم إيّاكم أن يَحرِفكم عن الحق وصفُكم بشيءٍ من هذه الأوصاف القبيحة،"], [3261.0, "فقد وُصف بها من هو خيرٌ منكم. والله أعلم."]], "tr": [[3240.0, "Bu silsile, Allah yeryüzüne ve üzerindekilere vâris oluncaya ve hak ile bâtıl arasındaki çekişme sona erinceye kadar devam edecektir."], [3249.0, "Yoksa bâtıl ehli, hak ehlini daima ve ebediyen bu sıfatlarla nitelemeye devam edecektir."], [3253.0, "Sakın ha, sakın! Bu çirkin vasıflardan biriyle nitelenmeniz sizi haktan saptırmasın;"], [3260.0, "sizden daha hayırlı olanlar da bunlarla nitelenmiştir. Allah en iyisini bilir."]]}]}, {"ts": "54:26", "title": "31. Külliye: Dinde her ayrılık yerilmiştir", "paras": [{"reader": false, "ar": [[3266.0, "ومن الكليات أيضًا: <b>كلُّ افتراقٍ في الدين فمذموم.<\/b> هذه صفاتُ أهل البدع."], [3272.0, "كلُّ افتراقٍ في الدين فمذموم."], [3276.0, "كم رقمُها؟ كلُّ افتراقٍ في الدين فمذموم."]], "tr": [[3266.0, "Külliyelerden biri de şudur: 31."], [3267.0, "külliye: Dinde her ayrılık yerilmiştir. Bunlar bid'at ehlinin sıfatlarıdır."], [3272.0, "Dinde her ayrılık yerilmiştir. Numarası kaç? Dinde her ayrılık yerilmiştir."]]}, {"reader": false, "ar": [[3283.1, "أقول وبالله التوفيق: ولا بد أن تقيِّد هذا الافتراق بالافتراق في الدين."], [3290.0, "وقد تواترت الأدلة بالأمر بالجماعة والوحدة،"], [3298.0, "والنهي عن النزاع والفُرقة؛"], [3300.9, "كقول الله عز وجل:"], [3303.0, "<span class=\"ayah\">﴿وَاعْتَصِمُوا بِحَبْلِ اللَّهِ جَمِيعًا وَلَا تَفَرَّقُوا﴾<\/span> <span class=\"ref\">[آل عمران: ١٠٣]<\/span>،"], [3307.3, "وكقول الله عز وجل:"], [3310.0, "<span class=\"ayah\">﴿وَلَا تَكُونُوا مِنَ الْمُشْرِكِينَ ۝ مِنَ الَّذِينَ فَرَّقُوا دِينَهُمْ وَكَانُوا شِيَعًا ۖ كُلُّ حِزْبٍ بِمَا لَدَيْهِمْ فَرِحُونَ﴾<\/span> <span class=\"ref\">[الروم: ٣١–٣٢]<\/span>."]], "tr": [[3283.1, "Tevfik Allah'tandır, derim ki: Bu ayrılığı \"dinde ayrılık\" ile kayıtlaman gerekir."], [3290.0, "Cemaat ve birlik emri ile çekişme ve tefrika yasağı hakkında deliller tevâtür derecesindedir."], [3300.9, "Allah Teâlâ'nın şu sözü gibi:"], [3303.0, "<span class=\"ayah\">﴿Hep birlikte Allah'ın ipine sımsıkı sarılın ve ayrılmayın﴾<\/span> [Âl-i İmrân 103]."], [3310.0, "Yine Allah Teâlâ'nın şu sözü gibi:"], [3312.0, "<span class=\"ayah\">﴿Müşriklerden olmayın; dinlerini parçalayıp gruplara ayrılanlardan (olmayın). Her grup kendi yanındakiyle sevinmektedir﴾<\/span> [Rûm 31–32]."]]}, {"reader": false, "ar": [[3319.1, "وكقول الله عز وجل:"], [3322.0, "<span class=\"ayah\">﴿فَتَقَطَّعُوا أَمْرَهُم بَيْنَهُمْ زُبُرًا ۖ كُلُّ حِزْبٍ بِمَا لَدَيْهِمْ فَرِحُونَ﴾<\/span> <span class=\"ref\">[المؤمنون: ٥٣]<\/span> <span class=\"note\">(Şeyh «وتقطّعوا» diyor.)<\/span>،"], [3331.0, "وكقول الله عز وجل:"], [3333.0, "وأنّ هذه أمتكم… <span class=\"ayah\">﴿إِنَّ هَٰذِهِ أُمَّتُكُمْ أُمَّةً وَاحِدَةً وَأَنَا رَبُّكُمْ فَاعْبُدُونِ﴾<\/span> <span class=\"ref\">[الأنبياء: ٩٢]<\/span>."], [3340.0, "وقال الله عز وجل:"], [3341.0, "<span class=\"ayah\">﴿شَرَعَ لَكُم مِّنَ الدِّينِ مَا وَصَّىٰ بِهِ نُوحًا وَالَّذِي أَوْحَيْنَا إِلَيْكَ وَمَا وَصَّيْنَا بِهِ إِبْرَاهِيمَ وَمُوسَىٰ وَعِيسَىٰ﴾<\/span> ـ إيش؟"], [3352.0, "ـ <span class=\"ayah\">﴿أَنْ أَقِيمُوا الدِّينَ وَلَا تَتَفَرَّقُوا فِيهِ﴾<\/span> <span class=\"ref\">[الشورى: ١٣]<\/span>."], [3356.0, "فرسالاتُ الأنبياء مبنيّةٌ على الجماعة والنهي عن الفرقة."]], "tr": [[3319.1, "Yine Allah Teâlâ'nın şu sözü gibi:"], [3322.0, "<span class=\"ayah\">﴿Fakat onlar işlerini aralarında parça parça kitaplara bölüştüler. Her grup kendi yanındakiyle sevinmektedir﴾<\/span> [Mü'minûn 53]."], [3331.0, "Yine Allah Teâlâ'nın şu sözü gibi:"], [3333.0, "\"Şüphesiz bu ümmetiniz…\" <span class=\"ayah\">﴿Şüphesiz bu ümmetiniz tek bir ümmettir. Ben de sizin Rabbinizim; öyleyse bana ibadet edin﴾<\/span> [Enbiyâ 92]."], [3341.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Dinden Nûh'a tavsiye ettiğini, sana vahyettiğimizi ve İbrâhîm'e, Mûsâ'ya ve Îsâ'ya tavsiye ettiğimizi —ne?— \"Dini dosdoğru ayakta tutun ve onda ayrılığa düşmeyin\" diye size de şeriat kıldı﴾<\/span> [Şûrâ 13]."], [3356.0, "Demek ki peygamberlerin risaletleri cemaat ve tefrika yasağı üzerine bina edilmiştir."]]}, {"reader": false, "ar": [[3362.0, "وكقول الله عز وجل:"], [3364.0, "<span class=\"ayah\">﴿وَأَنَّ هَٰذَا صِرَاطِي مُسْتَقِيمًا فَاتَّبِعُوهُ﴾<\/span>،"], [3367.0, "ثم حذّرك من الفرقة بقوله:"], [3370.0, "<span class=\"ayah\">﴿وَلَا تَتَّبِعُوا السُّبُلَ فَتَفَرَّقَ بِكُمْ عَن سَبِيلِهِ﴾<\/span> <span class=\"ref\">[الأنعام: ١٥٣]<\/span>."], [3374.0, "وكقول النبي صلى الله عليه وسلم:"], [3376.0, "«وستفترق أمتي على ثلاثٍ وسبعين فرقة، كلُّها في النار إلا واحدة»."], [3384.0, "وكقوله صلى الله عليه وسلم:"], [3388.0, "«إنّ الله يرضى لكم ثلاثًا ويكره لكم ثلاثًا»،"], [3391.0, "وذكر مما يرضاه لنا:"], [3392.8, "«وأن تعتصموا بحبل الله جميعًا ولا تفرّقوا» <span class=\"note\">(Müslim)<\/span>."]], "tr": [[3362.0, "Yine Allah Teâlâ'nın şu sözü gibi:"], [3364.0, "<span class=\"ayah\">﴿Şüphesiz bu, benim dosdoğru yolumdur; ona uyun﴾<\/span>."], [3367.0, "Sonra seni tefrikadan şu sözüyle sakındırdı:"], [3370.0, "<span class=\"ayah\">﴿Başka yollara uymayın; yoksa sizi O'nun yolundan ayırıp dağıtır﴾<\/span> [En'âm 153]."], [3374.3, "Yine Nebî ﷺ'in şu sözü gibi:"], [3376.0, "\"Ümmetim yetmiş üç fırkaya ayrılacak;"], [3378.0, "biri hariç hepsi ateştedir.\" Yine onun ﷺ şu sözü gibi:"], [3384.0, "\"Allah sizin için üç şeyden razı olur, üç şeyi de sizin için hoş görmez.\" Bizim için razı olduğu şeyler arasında şunu zikretti:"], [3392.8, "\"Hep birlikte Allah'ın ipine sarılmanız ve ayrılmamanız.\" <span class=\"note\">(Müslim)<\/span>"]]}, {"reader": false, "ar": [[3396.0, "وقال النبي صلى الله عليه وسلم:"], [3399.0, "«من خرج من الطاعة وفارق الجماعة» ـ قال:"], [3402.7, "وفارق الجماعة ـ «فمات، فميتتُه جاهلية» <span class=\"note\">(Müslim)<\/span>."], [3407.0, "وهذه الكلية مُجمَعٌ عليها بين أهل العلم رحمهم الله تعالى."], [3413.0, "فانتبهوا أن تكونوا ممن قال الله فيهم:"], [3415.0, "<span class=\"ayah\">﴿وَلَا تَكُونُوا كَالَّذِينَ تَفَرَّقُوا وَاخْتَلَفُوا مِن بَعْدِ مَا جَاءَهُمُ الْبَيِّنَاتُ ۚ وَأُولَٰئِكَ لَهُمْ عَذَابٌ عَظِيمٌ﴾<\/span> <span class=\"ref\">[آل عمران: ١٠٥]<\/span>."]], "tr": [[3396.0, "Nebî ﷺ şöyle buyurdu: \"Kim itaatten çıkar ve cemaatten ayrılır\" —\"ve cemaatten ayrılır\" dedi— \"da ölürse, onun ölümü cahiliye ölümüdür.\" <span class=\"note\">(Müslim)<\/span> Bu külliye, ehl-i ilim (rahimehumullah) arasında icma ile sabittir."], [3407.0, "Allah'ın haklarında şöyle buyurduğu kimselerden olmaktan sakının:"], [3413.0, "<span class=\"ayah\">﴿Kendilerine apaçık deliller geldikten sonra parçalanıp ayrılığa düşenler gibi olmayın. İşte onlar için büyük bir azap vardır﴾<\/span> [Âl-i İmrân 105]."]]}]}, {"ts": "57:03", "title": "32. Külliye: Vahye muhalefette hevâsına uyan herkes sapıktır", "paras": [{"reader": false, "ar": [[3423.0, "ومن الكليات أيضًا: <b>كلُّ متّبعٍ لهواه في مخالفة الوحي فضالّ.<\/b> كلُّ متّبعٍ لهواه في مخالفة الوحي فضالّ."], [3432.6, "<span class=\"note\">(يكررها)<\/span> فإنّ الله عز وجل مما… فإنّ الله قد حذّرنا من متابعة الهوى؛"], [3454.0, "لأن المتقرّر في القواعد أن الدين مبنيٌّ على الهدى والاتّباع،"], [3463.0, "لا على الهوى والابتداع."], [3466.0, "والمتقرّر في القواعد أن من اتّبع هواه هَوى <span class=\"q\">؟ 57:46<\/span>."]], "tr": [[3423.0, "Külliyelerden biri de şudur: 32."], [3425.1, "külliye: Vahye muhalefet ederek hevâsına uyan herkes sapıktır. Vahye muhalefet ederek hevâsına uyan herkes sapıktır."], [3432.6, "(Tekrar ediyor.) Çünkü Allah Teâlâ… Çünkü Allah bizi hevâya uymaktan sakındırmıştır."], [3437.8, "Zira kaidelerde yerleşik olan şudur:"], [3454.0, "Din hidayet ve ittiba üzerine bina edilmiştir;"], [3458.9, "hevâ ve ibtidâ' (bid'at icadı) üzerine değil."], [3466.0, "Kaidelerde yerleşik olan şudur: Hevâsına uyan düşer (helak olur) <span class=\"q\">؟<\/span>."]]}, {"reader": false, "ar": [[3471.0, "وعلى ذلك قولُ الله عز وجل:"], [3475.1, "<span class=\"ayah\">﴿أَرَأَيْتَ مَنِ اتَّخَذَ إِلَٰهَهُ هَوَاهُ﴾<\/span> <span class=\"ref\">[الفرقان: ٤٣]<\/span>."], [3479.0, "وقال الله عز وجل:"], [3481.2, "<span class=\"ayah\">﴿وَلَا تَتَّبِعِ الْهَوَىٰ فَيُضِلَّكَ عَن سَبِيلِ اللَّهِ﴾<\/span> <span class=\"ref\">[ص: ٢٦]<\/span>؛"], [3485.0, "فوصف الله عز وجل مَن اتّبع الهوى بأنه ضالّ،"], [3490.0, "واخترتُ هذا اللفظ بخصوصه في الكلية لموافقة دليل الشرع."], [3495.0, "وقال الله عز وجل:"], [3497.5, "<span class=\"ayah\">﴿وَمَنْ أَضَلُّ مِمَّنِ اتَّبَعَ هَوَاهُ بِغَيْرِ هُدًى مِّنَ اللَّهِ﴾<\/span>،"], [3503.0, "وهذه الآية أظنّها في أوّلها:"], [3505.9, "<span class=\"ayah\">﴿فَإِن لَّمْ يَسْتَجِيبُوا لَكَ فَاعْلَمْ أَنَّمَا يَتَّبِعُونَ أَهْوَاءَهُمْ ۚ وَمَنْ أَضَلُّ مِمَّنِ اتَّبَعَ هَوَاهُ بِغَيْرِ هُدًى مِّنَ اللَّهِ﴾<\/span> <span class=\"ref\">[القصص: ٥٠]<\/span>."]], "tr": [[3471.0, "Allah Teâlâ'nın şu sözü de buna dayanır:"], [3475.1, "<span class=\"ayah\">﴿Hevâsını ilah edineni gördün mü?﴾<\/span> [Furkân 43]."], [3479.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Hevâya uyma; yoksa seni Allah'ın yolundan saptırır﴾<\/span> [Sâd 26]."], [3485.0, "Böylece Allah Teâlâ hevâya uyanı sapık olarak nitelemiştir;"], [3489.0, "ben de şer'î delile uygun olsun diye külliyede özellikle bu lafzı seçtim."], [3495.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Allah'tan bir hidayet olmaksızın hevâsına uyandan daha sapık kim vardır?﴾<\/span> Sanırım bu ayetin başında şu vardır:"], [3505.9, "<span class=\"ayah\">﴿Eğer sana icabet etmezlerse, bil ki onlar sadece hevâlarına uyuyorlar. Allah'tan bir hidayet olmaksızın hevâsına uyandan daha sapık kim vardır?﴾<\/span> [Kasas 50]."]]}, {"reader": false, "ar": [[3515.0, "وكذلك قال الله عز وجل عن داود:"], [3517.0, "<span class=\"ayah\">﴿يَا دَاوُودُ إِنَّا جَعَلْنَاكَ خَلِيفَةً فِي الْأَرْضِ﴾<\/span>،"], [3521.0, "فقسّم الله عز وجل الحُكمَ في خلافته إلى قسمين."], [3526.0, "قال ماذا؟ <span class=\"ayah\">﴿فَاحْكُم بَيْنَ النَّاسِ بِالْحَقِّ﴾<\/span> ـ هذا القسم الأول ـ <span class=\"ayah\">﴿وَلَا تَتَّبِعِ الْهَوَىٰ﴾<\/span> <span class=\"ref\">[ص: ٢٦]<\/span>."], [3533.9, "فإذن كلُّ ما ليس من الحق فهو هوى،"], [3537.0, "وكلُّ ما كان من الهوى فلا يكون حقًّا؛"], [3541.0, "فهما قسمان متناقضان لا يتداخلان."]], "tr": [[3515.0, "Yine Allah Teâlâ Dâvûd hakkında şöyle buyurdu:"], [3517.0, "<span class=\"ayah\">﴿Ey Dâvûd! Biz seni yeryüzünde halife kıldık﴾<\/span>."], [3521.0, "Allah Teâlâ onun hilafetindeki hükmü iki kısma ayırdı."], [3526.0, "Ne buyurdu? <span class=\"ayah\">﴿İnsanlar arasında hak ile hükmet﴾<\/span> —bu birinci kısımdır— <span class=\"ayah\">﴿ve hevâya uyma﴾<\/span> [Sâd 26]."], [3533.9, "O hâlde haktan olmayan her şey hevâdır;"], [3537.0, "hevâdan olan her şey de hak olamaz."], [3541.0, "Bunlar birbirine zıt, iç içe girmeyen iki kısımdır."]]}, {"reader": false, "ar": [[3545.0, "وكقول الله عز وجل:"], [3549.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا كُونُوا قَوَّامِينَ بِالْقِسْطِ شُهَدَاءَ لِلَّهِ وَلَوْ عَلَىٰ أَنفُسِكُمْ أَوِ الْوَالِدَيْنِ وَالْأَقْرَبِينَ ۚ إِن يَكُنْ غَنِيًّا أَوْ فَقِيرًا فَاللَّهُ أَوْلَىٰ بِهِمَا ۖ فَلَا تَتَّبِعُوا الْهَوَىٰ أَن تَعْدِلُوا﴾<\/span> <span class=\"ref\">[النساء: ١٣٥]<\/span>."], [3565.0, "فإذن كلُّ من جانب العدل فقد وقع في الهوى."]], "tr": [[3545.0, "Yine Allah Teâlâ'nın şu sözü gibi:"], [3549.0, "<span class=\"ayah\">﴿Ey iman edenler! Kendiniz, anne babanız ve yakınlarınız aleyhine de olsa adaleti titizlikle ayakta tutan, Allah için şahitlik eden kimseler olun. (Şahitlik ettiğiniz kimse) zengin de olsa fakir de olsa, Allah ikisine de daha yakındır. Öyleyse adaletten sapmak için hevâya uymayın﴾<\/span> [Nisâ 135]."], [3567.0, "O hâlde adaletten uzaklaşan herkes hevâya düşmüştür."]]}, {"reader": false, "ar": [[3571.0, "فالهوى مضادٌّ للهدى، لأن الله وصف متّبعه بالضلال؛"], [3579.0, "والهوى مضادٌّ للحق، لأن الله جعله قسيمَ الحق؛"], [3586.0, "والهوى مضادٌّ للعدل، لأن الله عز وجل جعله قسيمًا له،"], [3593.0, "فهو مضادٌّ له في هذا التقسيم."], [3596.0, "فنعوذ بالله من الهوى."]], "tr": [[3571.0, "Hevâ hidayetin zıddıdır; çünkü Allah ona uyanı sapıklıkla nitelemiştir."], [3579.0, "Hevâ hakkın zıddıdır; çünkü Allah onu hakkın karşı kısmı kılmıştır."], [3586.0, "Hevâ adaletin zıddıdır; çünkü Allah Teâlâ onu adaletin karşı kısmı kılmıştır;"], [3594.0, "bu taksimde onun zıddıdır. Hevâdan Allah'a sığınırız."]]}]}, {"ts": "59:59", "title": "32. Külliye (devam): Hevâya uymayı yeren diğer deliller", "paras": [{"reader": false, "ar": [[3599.0, "قال الله عز وجل:"], [3601.0, "<span class=\"ayah\">﴿يَا أَهْلَ الْكِتَابِ لَا تَغْلُوا فِي دِينِكُمْ﴾<\/span> … <span class=\"ayah\">﴿وَلَا تَتَّبِعُوا أَهْوَاءَ قَوْمٍ قَدْ ضَلُّوا مِن قَبْلُ وَأَضَلُّوا كَثِيرًا وَضَلُّوا عَن سَوَاءِ السَّبِيلِ﴾<\/span> <span class=\"ref\">[المائدة: ٧٧]<\/span>."], [3613.0, "وقال الله عز وجل:"], [3615.0, "<span class=\"ayah\">﴿وَلَوِ اتَّبَعَ الْحَقُّ أَهْوَاءَهُمْ لَفَسَدَتِ السَّمَاوَاتُ وَالْأَرْضُ وَمَن فِيهِنَّ﴾<\/span> <span class=\"ref\">[المؤمنون: ٧١]<\/span>."], [3620.0, "وفي الحديث: «لا يؤمن أحدُكم حتى يكون هواه تبعًا لما جئتُ به»،"], [3629.0, "وهو ـ وإن كان فيه ضعف ـ إلا أن أهل العلم تلقّوه بالقبول والاعتماد والتسليم،"], [3635.0, "ودلّت عليه أصول الشريعة وقواعدها العامة."]], "tr": [[3599.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Ey Kitap ehli! Dininizde aşırı gitmeyin﴾<\/span> … <span class=\"ayah\">﴿Daha önce sapmış, birçoklarını saptırmış ve dümdüz yoldan sapmış bir topluluğun hevâlarına uymayın﴾<\/span> [Mâide 77]."], [3613.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Eğer hak onların hevâlarına uysaydı, gökler, yer ve bunlarda bulunanlar mutlaka bozulurdu﴾<\/span> [Mü'minûn 71]."], [3620.0, "Hadiste de şöyle gelir: \"Hevâsı benim getirdiğime tâbi olmadıkça hiçbiriniz iman etmiş olmaz.\" Bu hadiste zayıflık olsa da ehl-i ilim onu kabul, itimat ve teslimiyetle karşılamıştır;"], [3633.7, "şeriatın asılları ve genel kaideleri de ona delâlet etmektedir."]]}]}, {"ts": "1:00:39", "title": "33. Külliye: Nass dışındakine taassup eden herkes hevâsına uymaktadır", "paras": [{"reader": false, "ar": [[3639.0, "ومن الكليات أيضًا: <b>كلُّ متعصّبٍ لغير النص فمتّبعٌ لهواه.<\/b> كلُّ متعصّبٍ لغير النص فمتّبعٌ لهواه."], [3668.1, "<span class=\"note\">(يكررها)<\/span> فإنّ كثيرًا من الناس لو صُبّت عليه الآياتُ صبًّا،"], [3676.0, "وجاءه الدعاةُ صفًّا صفًّا،"], [3679.0, "فإنه لا يزال مُصِرًّا ومتعصّبًا لباطله،"], [3682.0, "ومعتمدًا على رأيه، ومحكِّمًا مذهبَه،"], [3688.0, "فلا يستجيب لحقٍّ ولا لحجةٍ ولا لبرهان."]], "tr": [[3639.0, "Külliyelerden biri de şudur: 33."], [3649.0, "külliye: Nass dışındaki bir şeye taassup eden herkes hevâsına uymaktadır. Nass dışındaki bir şeye taassup eden herkes hevâsına uymaktadır."], [3668.1, "(Tekrar ediyor.) Çünkü insanların birçoğunun üzerine ayetler yağmur gibi dökülse ve davetçiler saf saf ona gelse, o yine de bâtılında ısrar etmeye ve ona taassup etmeye, kendi görüşüne dayanmaya ve mezhebini hakem kılmaya devam eder;"], [3685.0, "ne bir hakka, ne bir hüccete, ne de bir burhana icabet eder."]]}, {"reader": false, "ar": [[3694.0, "فمتى ما رأى الإنسانُ نفسه متعصّبًا لقوله ورأيه،"], [3698.0, "فليعلم أن هذا التعصّب مبنيٌّ على دخول الهوى في قلبه ونفسه وروحه؛"], [3703.0, "فالتعصّب قرينُ الهوى، فلو سلِم قلبه من هذا الهوى لسلِم عقله من هذا التعصّب."], [3714.0, "وبناءً على ذلك: فالتعصّب للباطل هوى،"], [3720.0, "والتعصّب لمشايخ الضلال هوى،"], [3725.0, "والتعصّب للبدع والمدافعةُ عنها وعن أهلها، هذا كلُّه هوى."]], "tr": [[3694.0, "İnsan ne zaman kendini kendi sözüne ve görüşüne taassup eder hâlde görürse, bilsin ki bu taassup, hevânın onun kalbine, nefsine ve ruhuna girmesi üzerine bina edilmiştir."], [3704.9, "Taassup hevânın yoldaşıdır; kalbi bu hevâdan salim olsaydı, aklı da bu taassuptan salim olurdu."], [3714.0, "Buna göre: Bâtıla taassup hevâdır;"], [3717.8, "sapıklık şeyhlerine taassup hevâdır; bid'atlere taassup etmek, onları ve ehlini savunmak, bunların hepsi hevâdır."]]}, {"reader": false, "ar": [[3738.0, "وكراهيةُ الحق وأهله هي من التعصّب الذي سببه الهوى،"], [3747.0, "والكيدُ لأهل الحق هو من التعصّب الذي سببه الهوى،"], [3755.0, "وتسخيرُ الأدلة ـ الذي نسمع به بين الفينة والأخرى ـ لموافقة البدع؛"], [3762.0, "فتجدهم يستدلّون على شركهم وبدعهم بأدلة الكتاب والسنة،"], [3768.0, "ويلوون أعناقَ الأدلة حتى تتّفق مع مراداتهم وأهوائهم."]], "tr": [[3738.0, "Hakkı ve ehlini sevmemek, sebebi hevâ olan taassuptandır."], [3743.7, "Hak ehline tuzak kurmak, sebebi hevâ olan taassuptandır."], [3752.7, "Zaman zaman duyduğumuz, delilleri bid'atlere uydurmak için kullanmak da (böyledir):"], [3762.0, "Onların, şirklerine ve bid'atlerine Kitap ve Sünnet delilleriyle istidlal ettiklerini, delilleri kendi maksatlarına ve hevâlarına uysun diye eğip büktüklerini görürsün."]]}, {"reader": false, "ar": [[3775.0, "وإنّ من أعظم ما يقتل الدينَ الهوى؛"], [3779.0, "فالهوى يدخل على القلب ويطرد الدينَ طردًا،"], [3784.0, "كما قال النبي صلى الله عليه وسلم:"], [3787.0, "«وسيكون في أمتي أقوامٌ تتجارى بهم الأهواء كما يتجارى الكَلَبُ بصاحبه، فلا يبقى» ـ أو قال:"], [3797.0, "فلا يبقى ـ «منه عرقٌ ولا مَفصِلٌ إلا دخله» <span class=\"note\">(Ebû Dâvûd, Ahmed)<\/span>،"], [3803.0, "حتى يكون إلهُه هواه؛"], [3807.0, "فلا يسمع إلا ما يُشبِع هواه،"], [3810.0, "ولا يُبصر إلا ما يراه هواه،"], [3813.0, "ولا يدين إلا بما يدين به هواه."], [3817.0, "فهذا كلُّه من باب العصبية بالباطل،"], [3821.0, "وما أكثرَ المتعصّبين للباطل في هذا الزمان!"]], "tr": [[3775.0, "Dini en çok öldüren şeylerden biri hevâdır."], [3779.0, "Hevâ kalbe girer ve dini oradan tamamen kovar."], [3784.4, "Nitekim Nebî ﷺ şöyle buyurmuştur:"], [3787.0, "\"Ümmetimde, kuduz hastalığının sahibine yayılması gibi hevâların kendilerine yayılacağı kavimler olacaktır;"], [3797.0, "(hastalık) onun hiçbir damarını ve hiçbir eklemini girmedik bırakmaz.\" <span class=\"note\">(Ebû Dâvûd, Ahmed)<\/span> Sonunda hevâsı onun ilahı olur:"], [3809.5, "Ancak hevâsını doyuranı işitir, ancak hevâsının gördüğünü görür, ancak hevâsının din edindiğini din edinir."], [3817.0, "Bunların hepsi bâtıl ile asabiyet kabilindendir."], [3820.3, "Bu zamanda bâtıla taassup edenler ne kadar çoktur!"]]}]}, {"ts": "1:03:44", "title": "34. Külliye: Dinde bir şey icat edip insanları onunla imtihan eden bid'at ehlindendir", "paras": [{"reader": false, "ar": [[3824.0, "ومن الكليات أيضًا: <b>كلُّ من أحدث في الدين حدثًا وامتحن به الناسَ فمن أهل البدع.<\/b> كلُّ من أحدث في الدين حدثًا… كم رقمُها؟"], [3842.0, "كلُّ من أحدث في الدين حدثًا وامتحن به الناس فمن أهل البدع."]], "tr": [[3824.0, "Külliyelerden biri de şudur: 34."], [3827.0, "külliye: Dinde yeni bir şey icat edip insanları onunla imtihan eden herkes bid'at ehlindendir. Dinde yeni bir şey icat eden herkes… Numarası kaç?"], [3842.0, "Dinde yeni bir şey icat edip insanları onunla imtihan eden herkes bid'at ehlindendir."]]}, {"reader": false, "ar": [[3851.0, "أقول وبالله التوفيق: وهذا قد عانى منه أسلافُنا من أهل السنة والجماعة سابقًا،"], [3859.0, "ولا نزال نعاني منه لاحقًا،"], [3862.0, "وسيعاني منه أهلُ السنة في مستقبل الزمان إلى أن يحكم الله بين الحق والباطل."], [3868.0, "فلا يزال أهلُ البدع يبتدعون بدعًا ثم يمتحنون الناس بها؛"], [3877.0, "فمن وافقهم فيها فهو المُحِقّ،"], [3881.0, "ومن رفضها وخالفهم فيها فهو المُبطِل."]], "tr": [[3851.0, "Tevfik Allah'tandır, derim ki: Ehl-i Sünnet ve'l-Cemaat'ten olan selefimiz geçmişte bundan sıkıntı çekti, biz de hâlâ bundan sıkıntı çekiyoruz ve Allah hak ile bâtıl arasında hükmedinceye kadar gelecek zamanda da Ehl-i Sünnet bundan sıkıntı çekecektir."], [3868.0, "Bid'at ehli bid'atler icat edip sonra insanları onlarla imtihan etmeye devam eder:"], [3877.0, "Onlara bu konuda uyan haklı, onu reddedip onlara muhalefet eden ise bâtıl ehli sayılır."]]}, {"reader": false, "ar": [[3884.0, "ولله درُّ ابن تيمية رحمه الله لمّا قال:"], [3890.0, "«ولهذا كان من شعار أهل البدع: إحداثُ قولٍ أو فعلٍ، وإلزامُ الناس به، وإكراهُهم عليه، والموالاةُ عليه، والمعاداةُ على تركه»."], [3907.0, "كما ابتدعت الخوارجُ رأيها وألزمت الناس به،"], [3913.0, "ووالت وعادت عليه؛ وابتدعت الرافضةُ رأيها،"], [3920.0, "ووالت وعادت عليه، وألزمت الناس به؛"], [3923.0, "وابتدعت الجهميةُ رأيها، ووالت عليه وعادت عليه، وألزمت الناس به."]], "tr": [[3884.0, "Allah İbn Teymiyye'den (rahimehullah) razı olsun, ne güzel söylemiş:"], [3890.0, "\"Bu sebeple bid'at ehlinin şiarlarından biri, bir söz ya da fiil icat etmek, insanları ona zorlamak, onları ona mecbur etmek, onun üzerine dostluk kurmak ve onu terk edene düşmanlık etmektir.\" Nitekim Hâricîler kendi görüşlerini icat ettiler, insanları ona zorladılar, onun üzerine dostluk ve düşmanlık ettiler."], [3916.0, "Râfıza kendi görüşünü icat etti, onun üzerine dostluk ve düşmanlık etti, insanları ona zorladı."], [3923.0, "Cehmiyye kendi görüşünü icat etti, onun üzerine dostluk ve düşmanlık etti, insanları ona zorladı."]]}, {"reader": false, "ar": [[3932.0, "وابتدعت الجهميةُ ـ قلناها <span class=\"q\">؟ 01:05:32<\/span> ـ رأيها،"], [3934.2, "ووالت وعادت الناسَ عليه."], [3939.0, "ولا يزال أهلُ الطوائف يبتدعون بدعًا من قِبَل أنفسهم،"], [3944.0, "ثم يفتنون بها الناس،"], [3946.0, "ويوالون ويعادون عليها. فهذا من شعار أهل البدع،"], [3950.8, "فاحذروا منه يا أهل السنة والجماعة."]], "tr": [[3932.0, "Cehmiyye —bunu söyledik <span class=\"q\">؟<\/span>— kendi görüşünü icat etti, onun üzerine insanlarla dostluk ve düşmanlık etti."], [3940.1, "Taife ehli kendiliklerinden bid'atler icat etmeye, sonra insanları onlarla fitneye düşürmeye, onların üzerine dostluk ve düşmanlık etmeye devam etmektedir."], [3949.0, "Bu, bid'at ehlinin şiarlarındandır; ey Ehl-i Sünnet ve'l-Cemaat, ondan sakının."]]}]}, {"ts": "1:05:53", "title": "35. Külliye: Vahyin nasslarını kabul ve retta aklı asıl yapan bid'atçidir", "paras": [{"reader": false, "ar": [[3953.0, "ومن الكليات أيضًا: كلُّ من جعل موافقةَ العقل أصلًا… كلُّ من جعل العقل أصلًا… <b>كلُّ من جعل العقلَ أصلًا فيما يُقبَل ويُرَدّ من نصوص الوحي فمبتدع.<\/b> كلُّ من جعل العقل أصلًا فيما يُقبل ويُردّ من نصوص الوحي فمبتدع. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[3953.0, "Külliyelerden biri de şudur: Akla uygunluğu asıl yapan herkes… Aklı asıl yapan herkes… 35."], [3965.8, "külliye: Vahyin nasslarından kabul edilecek ve reddedilecek olanda aklı asıl yapan herkes bid'atçidir. Vahyin nasslarından kabul edilecek ve reddedilecek olanda aklı asıl yapan herkes bid'atçidir. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[3982.0, "وهذه الكلية تتكلّم عن طوائف يبنون عقائدهم على مقتضيات عقولهم ونتائج أفهامهم وأفكارهم،"], [3993.0, "ولا يعتمدون فهمَ السلف في أدلة الاعتقاد أبدًا،"], [3999.0, "وإنما يعبدون عقولهم ويتّبعونها،"], [4002.0, "ويؤمنون بها وبنتائجها؛ فما أملته عليهم عقولُهم أخذوا به وإن خالف دليلَ الكتاب والسنة،"], [4012.0, "وما وافق عقولهم أخذوا به واعتقدوه واعتمدوه وإن لم يرد أصلًا في الكتاب والسنة."]], "tr": [[3982.0, "Bu külliye, akidelerini akıllarının gereklerine, anlayışlarının ve fikirlerinin sonuçlarına bina eden, itikat delillerinde selefin anlayışına asla dayanmayan taifelerden bahsetmektedir."], [3996.6, "Onlar akıllarına tapar, onlara uyar, onlara ve sonuçlarına iman ederler."], [4005.0, "Akıllarının onlara dikte ettiğini, Kitap ve Sünnet'in delillerine muhalif olsa bile alırlar;"], [4011.4, "akıllarına uygun olanı da, Kitap ve Sünnet'te hiç gelmemiş olsa bile alır, ona inanır ve ona dayanırlar."]]}, {"reader": false, "ar": [[4022.0, "فكلُّ من جعل عقلَه هو الأصلَ المتَّبع فيما يُثبِت وفيما ينفي فإنه مبتدع."], [4034.0, "فمن أعظم علامات أهل البدع اعتمادُها على عقلها المجرّد عن نور النقل؛"], [4040.0, "فما حُرِّفت صفاتُ الله إلا بسبب اعتماد العقل،"], [4044.0, "وما أُنكِرت أسماؤه إلا بسبب اعتماد العقل،"], [4049.0, "وما حُرِّف قضاؤه وقدرُه إلا بسبب الاعتماد على العقل،"], [4059.0, "وما كذّبوا بكثيرٍ من الغيبيات وعطّلوها عن مدلولاتها الصحيحة إلا بسبب أن عقولهم لم ترضَ بها."]], "tr": [[4022.0, "İsbat ettiği ve nefyettiği şeylerde kendi aklını uyulan asıl yapan herkes bid'atçidir."], [4034.0, "Bid'at ehlinin en büyük alametlerinden biri, nakil nurundan soyutlanmış akıllarına dayanmalarıdır."], [4037.0, "Allah'ın sıfatları ancak akla dayanma sebebiyle tahrif edildi;"], [4040.0, "isimleri ancak akla dayanma sebebiyle inkâr edildi;"], [4044.0, "kazası ve kaderi ancak akla dayanma sebebiyle tahrif edildi."], [4051.8, "Gayb meselelerinin birçoğunu yalanlamaları ve onları sahih medlûllerinden ta'til etmeleri de ancak akıllarının onlara razı olmaması sebebiyledir."]]}, {"reader": false, "ar": [[4069.0, "ولذلك لا يجوز أن نوافقهم في ذلك؛"], [4074.0, "ولأننا سنقول لهم: إنّ العقول متفاوتة،"], [4080.0, "فبأيّ عقلٍ نزل الكتابُ والسنة؟"], [4084.0, "فإن قلتم: نزل الكتابُ والسنة بعقل الأشعري الذي يُثبت الأسماءَ كلَّها وسبعَ صفات،"], [4093.0, "فنقول: للأسف، إنّ عقلَ أخيه المعتزلي رفض الصفاتِ كلَّها ولكن آمن بالأسماء."], [4105.0, "ونقول للأسف أيضًا: إنّ عقلَ أخيهم الجهمي أنكر الأسماءَ أيضًا وأنكر الصفات."]], "tr": [[4069.0, "Bu yüzden bu konuda onlara uymamız caiz değildir."], [4074.0, "Ayrıca onlara şöyle diyeceğiz: Akıllar birbirinden farklıdır;"], [4077.8, "Kitap ve Sünnet hangi akılla indi?"], [4084.0, "Eğer \"Kitap ve Sünnet, bütün isimleri ve yedi sıfatı isbat eden Eş'arî'nin aklıyla indi\" derseniz, deriz ki:"], [4093.8, "Ne yazık ki kardeşi Mu'tezilî'nin aklı bütün sıfatları reddetti, fakat isimlere iman etti."], [4105.0, "Yine ne yazık ki deriz:"], [4108.0, "Kardeşleri Cehmî'nin aklı isimleri de inkâr etti, sıfatları da inkâr etti."]]}, {"reader": false, "ar": [[4114.0, "وعقلُ أخيهم الفلسفي لا يصف الله عز وجل إلا بالسُّلوب والنفي،"], [4120.0, "وعقلُ الباطني القرمطي لا يصف الله عز وجل بالنقيضين،"], [4126.0, "فهو يسلب عن الله عز وجل النقيضين أصلًا."], [4129.0, "فبما أنّ العقول متفاوتة،"], [4132.0, "فبأيّ عقلٍ نحتكم إليه؟"], [4135.0, "فأعطونا عقلًا واحدًا حتى نجعله أصلًا فيما يُثبَت وفيما يُنفى."]], "tr": [[4114.0, "Kardeşleri felsefecinin aklı Allah Teâlâ'yı ancak selbî (olumsuz) sıfatlarla ve nefy ile niteler."], [4120.9, "Bâtınî Karmatî'nin aklı ise Allah Teâlâ'yı iki zıttan hiçbiriyle nitelemez;"], [4127.0, "iki zıddı da Allah'tan tamamen nefyeder."], [4129.0, "Madem akıllar farklıdır, hangi akla muhakeme olacağız?"], [4133.5, "Bize tek bir akıl verin ki isbat edilecek ve nefyedilecek olanda onu asıl kılalım."]]}, {"reader": false, "ar": [[4140.0, "ولذلك من مقاصد الشريعة استقرارُ أحكامها؛"], [4145.0, "فلو بُنيت أحكامُها العقدية على العقول لأفضى ذلك إلى عدم الاستقرار،"], [4150.0, "ولكن ـ ولله الحمد ـ بُنيت على الكتاب والسنة وفهم السلف الصالح."]], "tr": [[4140.0, "Bu yüzden şeriatın maksatlarından biri hükümlerinin istikrarıdır."], [4145.0, "Eğer onun akîdevî hükümleri akıllar üzerine bina edilseydi, bu istikrarsızlığa götürürdü."], [4149.6, "Fakat —hamd Allah'a— Kitap, Sünnet ve selef-i sâlihînin anlayışı üzerine bina edilmiştir."]]}]}, {"ts": "1:09:16", "title": "36. Külliye: Kur'an'daki her ayet tevhide davettir", "paras": [{"reader": false, "ar": [[4156.0, "ومن الكليات أيضًا: <b>كلُّ آيةٍ في القرآن فهي دعوةٌ إلى التوحيد.<\/b> كلُّ آيةٍ في القرآن فهي دعوةٌ إلى التوحيد."], [4169.2, "<span class=\"note\">(يكررها)<\/span> أقول: وأنا أترك الإمامَ ابنَ القيم رحمه الله تعالى يشرح لكم هذه الكلية في نقلٍ مطوّلٍ عنه،"], [4181.0, "فقال رحمه الله: «كلُّ آيةٍ في القرآن فهي متضمّنةٌ للتوحيد، شاهدةٌ به، وداعيةٌ إليه؛ فإنّ القرآن إمّا خبرٌ عن الله وأسمائه وصفاته وأفعاله، فهو التوحيد العلمي الخبري»."]], "tr": [[4156.0, "Külliyelerden biri de şudur: 36."], [4159.8, "külliye: Kur'an'daki her ayet tevhide bir davettir. Kur'an'daki her ayet tevhide bir davettir."], [4169.2, "(Tekrar ediyor.) Derim ki: Bu külliyeyi size, ondan uzunca bir nakille İmam İbnü'l-Kayyim'in (rahimehullah) şerh etmesine bırakıyorum."], [4183.1, "O (rahimehullah) şöyle der: \"Kur'an'daki her ayet tevhidi içerir, ona şahitlik eder ve ona davet eder."], [4197.1, "Çünkü Kur'an ya Allah'tan, O'nun isimlerinden, sıfatlarından ve fiillerinden haberdir; bu, ilmî-haberî tevhiddir.\""]]}, {"reader": false, "ar": [[4204.0, "قلت: أي توحيد الربوبية والأسماء والصفات."], [4208.0, "ثم قال: «وإمّا دعوةٌ إلى عبادته وحده لا شريك له، وخلعِ كلِّ ما يُعبَد من دونه، فهو التوحيد الإرادي الطلبي»."], [4220.0, "قلت: أي توحيد الألوهية."], [4223.0, "ثم قال: «وإمّا أمرٌ ونهيٌ…» ـ معي ولّا لا يا جماعة؟"], [4235.0, "ـ «وإمّا أمرٌ… بطاعته في أمره»… كأني نسيتُ شيئًا… «وإمّا أمرٌ…» <span class=\"q\">؟ 01:10:47<\/span> «وإمّا أمرٌ ونهيٌ» ـ انتبه ـ «وإمّا أمرٌ ونهيٌ وإلزامٌ بطاعته في نهيه وأمره، فهي حقوق التوحيد ومكمِّلاته»."]], "tr": [[4204.0, "Derim ki: Yani rubûbiyyet ile isim ve sıfatlar tevhidi."], [4208.0, "Sonra şöyle der: \"Ya da O'na, tek ve ortaksız olarak ibadete ve O'ndan başka ibadet edilen her şeyi bırakmaya davettir;"], [4217.0, "bu, irâdî-talebî tevhiddir.\" Derim ki:"], [4220.0, "Yani ulûhiyyet tevhidi. Sonra şöyle der:"], [4223.0, "\"Ya da emir ve nehiydir…\" —benimle misiniz, değil misiniz, ey cemaat?— \"Ya da emirde O'na itaat…\" Galiba bir şey unuttum… \"Ya da emir…\" <span class=\"q\">؟<\/span> \"Ya da emir ve nehiy\" —dikkat et— \"ya da emir ve nehiy ve nehyinde ve emrinde O'na itaati zorunlu kılmaktır;"], [4256.0, "bunlar tevhidin hakları ve tamamlayıcılarıdır.\""]]}, {"reader": false, "ar": [[4262.0, "«وإمّا خبرٌ عن كرامة الله عز وجل لأهل توحيده وطاعته، وما فعل بهم في الدنيا، وما يُكرمهم به في الآخرة، فهو جزاء توحيده؛ وإمّا خبرٌ عن أهل الشرك، وما فعل بهم في الدنيا من النَّكال، وما يحلّ بهم في العُقبى من العذاب، فهو خبرٌ عمّن خرج عن حكم التوحيد. فالقرآن كلُّه في التوحيد وحقوقه وجزائه، وفي شأن الشرك وأهله وجزائه»."]], "tr": [[4262.0, "\"Ya da Allah Teâlâ'nın tevhid ve itaat ehline ikramından, dünyada onlara yaptıklarından ve ahirette onlara ikram edeceklerinden haberdir;"], [4271.2, "bu, O'nun tevhidinin mükâfatıdır. Ya da şirk ehlinden, dünyada onlara yaptığı ibret verici cezalardan ve ahirette başlarına gelecek azaptan haberdir;"], [4281.1, "bu, tevhidin hükmünden çıkan kimse hakkında haberdir."], [4283.9, "Kur'an'ın tamamı tevhid, onun hakları ve mükâfatı;"], [4287.7, "şirk, ehli ve onların cezası hakkındadır.\""]]}, {"reader": false, "ar": [[4291.0, "وهذا دليلٌ على أن الرسل إنما بُعثوا بالتوحيد."], [4296.0, "فتارةً تتكلّم الآية عن توحيد الربوبية فهي توحيد،"], [4301.0, "أو الألوهية فهي توحيد،"], [4303.0, "أو الأسماء والصفات فهي توحيد،"], [4305.0, "أو عن أخبار الأمم الماضية فهي بيانُ عاقبة من خالف التوحيد،"], [4312.0, "أو ما سيحصل في الآخرة من إكرام أهل التوحيد والطاعة وإهانة أهل الشرك والمعصية،"], [4320.0, "فهي كلامٌ عن جزاء التوحيد موافقةً أو مخالفة."], [4326.0, "فتجد القرآن دائمًا يتكلّم عن التوحيد،"], [4329.0, "إمّا كلامَ منطوقٍ أو مضمونٍ أو تلازم. والله أعلم."]], "tr": [[4291.0, "Bu da peygamberlerin ancak tevhid ile gönderildiğinin delilidir."], [4294.8, "Ayet bazen rubûbiyyet tevhidinden bahseder;"], [4297.2, "bu tevhiddir. Ya da ulûhiyyetten;"], [4300.4, "bu tevhiddir. Ya da isim ve sıfatlardan;"], [4303.0, "bu tevhiddir. Ya da geçmiş ümmetlerin haberlerinden;"], [4305.6, "bu, tevhide muhalefet edenin akıbetinin beyanıdır."], [4308.8, "Ya da ahirette tevhid ve itaat ehline yapılacak ikramdan ve şirk ve isyan ehline yapılacak ihanetten;"], [4317.4, "bu, uyma ya da muhalefet açısından tevhidin karşılığı hakkında bir sözdür."], [4322.9, "Böylece Kur'an'ı daima tevhidden bahsederken bulursun;"], [4326.5, "ya mantûk (açık lafız), ya mazmun (içerik) ya da telâzüm (gerektirme) yoluyla. Allah en iyisini bilir."]]}]}, {"ts": "1:12:15", "title": "37. Külliye: Tevhid ve akidenin sıhhatinin bağlı olduğu her ilim farzdır", "paras": [{"reader": false, "ar": [[4335.0, "ومن الكليات أيضًا: <b>كلُّ علمٍ تتوقّف عليه صحةُ التوحيد والعقيدة ففرض.<\/b> كم يا فهد؟"], [4347.0, "<span class=\"q\">؟ 01:12:25<\/span> كلُّ علمٍ تتوقّف عليه صحة التوحيد والعقيدة ففرض."], [4357.7, "أقول: لأنّ المتقرّر أن وسائل الواجب واجبة،"], [4364.0, "ولأنّ المتقرّر أن ما لا يتمّ الواجب إلا به فهو واجب."]], "tr": [[4335.0, "Külliyelerden biri de şudur: 37."], [4337.0, "külliye: Tevhid ve akidenin sıhhatinin kendisine bağlı olduğu her ilim farzdır. Kaç, ey Fehd?"], [4347.0, "<span class=\"q\">؟<\/span> Tevhid ve akidenin sıhhatinin kendisine bağlı olduğu her ilim farzdır."], [4357.7, "Derim ki: Çünkü yerleşik kaideye göre vacibin vesileleri vaciptir;"], [4364.7, "yine yerleşik kaideye göre vacibin kendisiyle tamamlandığı şey de vaciptir."]]}, {"reader": false, "ar": [[4372.0, "فهناك من العقائد ما لا يصحّ توحيدُك وسيرُ قلبك إلى الله إلا بمعرفته،"], [4379.0, "فيكون ذلك من العلم العقدي التوحيدي الواجب تعلّمُه،"], [4386.0, "ولا يجوز لك أن تشتغل عن تعلّمه لا بوظيفةٍ،"], [4390.1, "ولا بأولاد، ولا بزوجة،"], [4392.0, "ولا بمأكل، ولا بمشرب،"], [4394.0, "وإنما يجب عليك أن تتعلّم ـ بطريقةٍ من طرق التعلّم ـ هذا النوعَ من العقائد أو التوحيد مما تتوقّف عليه صحةُ التوحيد أو العقائد."], [4408.0, "فطلبُ صحة التوحيد واجب،"], [4411.0, "وما لا يتمّ الواجب إلا به فهو واجب. وهذا واضح."]], "tr": [[4372.0, "Akidelerden öyleleri vardır ki tevhidin ve kalbinin Allah'a yolculuğu ancak onu bilmekle sahih olur."], [4386.0, "Bu, öğrenilmesi vacip olan akîdevî ve tevhidî ilimdendir."], [4391.5, "Onu öğrenmekten ne bir işle, ne çocuklarla, ne eşle, ne yiyecekle, ne de içecekle meşgul olman caiz değildir."], [4408.0, "Bilakis, tevhidin ya da akidelerin sıhhatinin kendisine bağlı olduğu bu tür akideleri ya da tevhidi, öğrenme yollarından biriyle öğrenmen vaciptir."], [4412.6, "Tevhidin sıhhatini talep etmek vaciptir;"], [4413.4, "vacibin kendisiyle tamamlandığı şey de vaciptir. Bu açıktır."]]}]}, {"ts": "1:13:35", "title": "38. Külliye: Bid'at ehlinin bütün mezhepleri sonradan çıkmadır", "paras": [{"reader": false, "ar": [[4415.0, "ومن الكليات أيضًا: <b>كلُّ مذاهب أهل البدع مُحدَثة.<\/b> كلُّ مذاهب أهل البدع محدثة."], [4432.1, "<span class=\"note\">(يكررها)<\/span> بمعنى أنه لا سلفَ لها؛"], [4438.0, "فلا يمكن أبدًا نسبةُ شيءٍ من مذاهب أهل البدع إلى نبيٍّ من الأنبياء مطلقًا،"], [4444.0, "ولا إلى رسولٍ من الرسل مطلقًا،"], [4447.0, "ولا تصحّ نسبةُ شيءٍ منها إلى محمدٍ صلى الله عليه وسلم،"], [4452.0, "ولا يمكن أن يتجرّأ مبتدعٌ في نسبة مذهبه إلى صحابيٍّ من الصحابة،"], [4460.0, "لا من المهاجرين ولا من الأنصار،"], [4463.0, "ولا تُقبل هذه النسبة أبدًا."]], "tr": [[4415.0, "Külliyelerden biri de şudur: 38."], [4417.2, "külliye: Bid'at ehlinin bütün mezhepleri sonradan çıkmadır (muhdestir). Bid'at ehlinin bütün mezhepleri sonradan çıkmadır."], [4429.6, "(Tekrar ediyor.) Yani onların selefi yoktur."], [4432.1, "Bid'at ehlinin mezheplerinden hiçbir şeyi peygamberlerden herhangi bir nebiye asla nispet etmek mümkün değildir;"], [4434.6, "resullerden herhangi bir resule de asla (mümkün değildir)."], [4438.0, "Onlardan hiçbir şeyin Muhammed ﷺ'e nispeti sahih değildir."], [4445.0, "Hiçbir bid'atçi mezhebini sahâbeden birine —ne muhâcirlerden ne de ensardan— nispet etmeye cüret edemez;"], [4460.5, "bu nispet asla kabul edilmez."]]}, {"reader": false, "ar": [[4466.0, "فمذاهبُهم كلُّها مبتوتةٌ عن السلفية الحقّة،"], [4470.0, "وإنما هي تُنسب إلى أصحابها وإلى مُحدِثيها؛"], [4474.0, "فالمعتزلة تُنسب إلى منشئها وهو واصل بن عطاء،"], [4479.0, "والأشعرية تُنسب إلى منشئها وهو أبو الحسن الأشعري،"], [4483.0, "والماتريدية تُنسب إلى منشئها وهو أبو منصور الماتريدي،"], [4489.0, "والجهمية تُنسب إلى منشئها وهو الجهم بن صفوان الترمذي،"], [4495.0, "والكُلّابية تُنسب إلى منشئها وهو محمد بن سعيد بن كُلّاب."]], "tr": [[4466.0, "Onların mezheplerinin hepsi hakiki selefiyyetten kopuktur;"], [4470.0, "ancak sahiplerine ve onları icat edenlere nispet edilir."], [4475.2, "Mu'tezile kurucusu Vâsıl b. Atâ'ya nispet edilir;"], [4480.0, "Eş'ariyye kurucusu Ebü'l-Hasan el-Eş'arî'ye nispet edilir;"], [4483.0, "Mâtürîdiyye kurucusu Ebû Mansûr el-Mâtürîdî'ye nispet edilir;"], [4489.0, "Cehmiyye kurucusu Cehm b. Safvân et-Tirmizî'ye nispet edilir;"], [4495.0, "Küllâbiyye kurucusu Muhammed b. Saîd b. Küllâb'a nispet edilir."]]}, {"reader": false, "ar": [[4501.0, "وكذلك قد تُنسب أحيانًا بعضُ البدع إلى بدعتها؛"], [4505.0, "فالخوارج يُنسبون إلى بدعة خروجهم،"], [4509.0, "فأوّلُ ما نشأت تلك الطائفة إنما لمّا خرجوا على علي بن أبي طالب."], [4514.0, "لكن هل تُنسب إلى نبيٍّ أو رسولٍ،"], [4517.8, "أو تُنسب إلى صحابي؟"], [4520.0, "الجواب: لا. فممّا يتميّز به مذهبُ أهل السنة نسبتُه إلى النبوة والرسالة وإلى الصحابة؛"], [4528.0, "فجذورُ مذهبنا مبنيّةٌ على طريقة الأنبياء في العقائد،"], [4535.0, "وطريقة الرسل في العقائد،"], [4537.0, "وطريقة الصحابة في تقرير العقائد،"], [4539.0, "وهو المذهب الوحيد الذي تصحّ نسبتُه إلى النبوة والرسالة."]], "tr": [[4501.0, "Yine bazen bazı bid'atler kendi bid'atlerine nispet edilir."], [4505.0, "Hâricîler \"huruç\" (isyan) bid'atlerine nispet edilir;"], [4509.4, "bu taife ilk olarak Ali b."], [4511.7, "Ebû Tâlib'e karşı ayaklandıklarında ortaya çıkmıştır."], [4514.0, "Fakat bir nebiye ya da resule veya bir sahâbîye nispet edilir mi?"], [4520.0, "Cevap: Hayır. Ehl-i Sünnet mezhebini ayırt eden şeylerden biri, onun nübüvvete, risalete ve sahâbeye nispet edilmesidir."], [4528.0, "Mezhebimizin kökleri, akidelerde peygamberlerin yolu, akidelerde resullerin yolu ve akideleri ortaya koymada sahâbenin yolu üzerine bina edilmiştir."], [4539.0, "Nübüvvete ve risalete nispeti sahih olan tek mezhep odur."]]}, {"reader": false, "ar": [[4544.0, "وأمّا المذاهب الأخرى فإنما تُنسب إلى أصحابها أو إلى بدعتها؛"], [4550.0, "كالخوارج، وكالمعتزلة فإنهم نُسبوا إلى اعتزال واصل بن عطاء مجلسَ الحسن البصري،"], [4559.0, "والمرجئةِ نسبةً إلى إخراج العمل عن دائرة الإيمان،"], [4565.0, "والوعيديةِ نسبةً إلى تكفير مرتكب الكبيرة،"], [4569.1, "والجبريةِ نسبةً إلى سلب العبد قدرتَه واختيارَه،"], [4573.0, "والقدريةِ نسبةً إلى قولهم بأن العبد يخلق فعله."]], "tr": [[4544.0, "Diğer mezhepler ise ancak sahiplerine ya da bid'atlerine nispet edilir:"], [4549.4, "Hâricîler gibi; Mu'tezile gibi —onlar Vâsıl b."], [4555.6, "Atâ'nın Hasan-ı Basrî'nin meclisinden ayrılmasına (i'tizâline) nispet edilmiştir—;"], [4559.0, "Mürcie, ameli iman dairesinden çıkarmaya nispetle;"], [4564.3, "Vaîdiyye, büyük günah işleyeni tekfir etmeye nispetle;"], [4568.0, "Cebriyye, kulun kudretini ve iradesini elinden almaya nispetle;"], [4572.0, "Kaderiyye de kulun kendi fiilini yarattığı sözüne nispetle (böyle adlandırılmıştır)."]]}, {"reader": false, "ar": [[4578.0, "فتبًّا لمذاهبَ مبتوتةٍ عن الانتساب للمصدر العزيز،"], [4584.0, "وهو النبوة والرسالة، وإلى السلف الصالح من الصحابة والتابعين."]], "tr": [[4578.0, "Aziz kaynağa, yani nübüvvet ve risalete, sahâbe ve tâbiînden olan selef-i sâlihîne nispetten kopuk mezheplerin canı cehenneme!"]]}]}, {"ts": "1:16:30", "title": "39. Külliye: Bütün peygamberler tevhid ile gönderilmiştir", "paras": [{"reader": false, "ar": [[4590.0, "ومن الكليات أيضًا: <b>كلُّ الأنبياء بُعثوا بالتوحيد.<\/b> وهذه الكلية متّفقٌ عليها بين أهل العلم رحمهم الله تعالى،"], [4600.0, "ويدلّ عليها قول الله عز وجل:"], [4602.0, "<span class=\"ayah\">﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾<\/span> <span class=\"ref\">[النحل: ٣٦]<\/span>،"], [4607.0, "وقول الله عز وجل:"], [4609.0, "<span class=\"ayah\">﴿وَمَا أَرْسَلْنَا مِن قَبْلِكَ مِن رَّسُولٍ إِلَّا نُوحِي إِلَيْهِ أَنَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدُونِ﴾<\/span> <span class=\"ref\">[الأنبياء: ٢٥]<\/span>."]], "tr": [[4590.0, "Külliyelerden biri de şudur: 39."], [4592.0, "külliye: Bütün peygamberler tevhid ile gönderilmiştir. Bu külliye ehl-i ilim (rahimehumullah) arasında ittifakla kabul edilmiştir."], [4599.7, "Buna Allah Teâlâ'nın şu sözü delâlet eder:"], [4602.0, "<span class=\"ayah\">﴿Andolsun, biz her ümmete \"Allah'a ibadet edin ve tâğûttan kaçının\" diye bir resul gönderdik﴾<\/span> [Nahl 36]."], [4607.0, "Yine Allah Teâlâ'nın şu sözü:"], [4609.0, "<span class=\"ayah\">﴿Senden önce hiçbir resul göndermedik ki ona \"Benden başka ilah yoktur; öyleyse bana ibadet edin\" diye vahyetmiş olmayalım﴾<\/span> [Enbiyâ 25]."]]}, {"reader": false, "ar": [[4616.0, "وقولُ الله عز وجل عن نوحٍ أنه قال لقومه آمرًا بالتوحيد:"], [4622.0, "<span class=\"ayah\">﴿اعْبُدُوا اللَّهَ مَا لَكُم مِّنْ إِلَٰهٍ غَيْرُهُ﴾<\/span> <span class=\"ref\">[الأعراف: ٥٩]<\/span>،"], [4625.0, "وقالها هودٌ لقومه، وصالحٌ لقومه،"], [4630.0, "وشعيبٌ لقومه، ولوطٌ لقومه،"], [4635.0, "وقالها نبيُّنا محمدٌ صلى الله عليه وسلم،"], [4638.1, "في قوله: <span class=\"ayah\">﴿إِنَّهُمْ كَانُوا إِذَا قِيلَ لَهُمْ لَا إِلَٰهَ إِلَّا اللَّهُ يَسْتَكْبِرُونَ ۝ وَيَقُولُونَ أَئِنَّا لَتَارِكُو آلِهَتِنَا لِشَاعِرٍ مَّجْنُونٍ﴾<\/span> <span class=\"ref\">[الصافات: ٣٥–٣٦]<\/span>."], [4647.0, "فجميعُ الأنبياء من آدم إلى محمدٍ صلى الله عليه وسلم إنما بُعثوا لتقرير التوحيد بكلّ أنواعه."]], "tr": [[4616.0, "Yine Allah Teâlâ'nın Nûh hakkında, onun kavmine tevhidi emrederek şöyle dediğini bildiren sözü:"], [4622.0, "<span class=\"ayah\">﴿Allah'a ibadet edin; sizin O'ndan başka hiçbir ilahınız yoktur﴾<\/span> [A'râf 59]."], [4627.4, "Bunu Hûd kavmine, Sâlih kavmine, Şuayb kavmine, Lût kavmine söyledi;"], [4636.8, "Peygamberimiz Muhammed ﷺ de söyledi."], [4639.0, "(Bu) Allah'ın şu sözündedir: <span class=\"ayah\">﴿Onlara \"Allah'tan başka ilah yoktur\" denildiğinde büyüklük taslarlardı. \"Deli bir şair için ilahlarımızı mı bırakacağız?\" derlerdi﴾<\/span> [Sâffât 35–36]."], [4649.4, "Âdem'den Muhammed ﷺ'e kadar bütün peygamberler ancak tevhidi bütün çeşitleriyle yerleştirmek için gönderilmiştir."]]}, {"reader": false, "ar": [[4658.0, "وكقول الله عز وجل:"], [4661.0, "<span class=\"ayah\">﴿وَاسْأَلْ مَنْ أَرْسَلْنَا مِن قَبْلِكَ مِن رُّسُلِنَا أَجَعَلْنَا مِن دُونِ الرَّحْمَٰنِ آلِهَةً يُعْبَدُونَ﴾<\/span> <span class=\"ref\">[الزخرف: ٤٥]<\/span>."], [4668.0, "وعلى ذلك قولُ النبي صلى الله عليه وسلم:"], [4670.0, "«الأنبياء إخوةٌ من علّات، أمهاتهم شتّى ودينهم واحد» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [4677.0, "أي: عقيدتهم واحدة. فالعقيدة والتوحيد الذي بُعث به نوحٌ عليه الصلاة والسلام،"], [4686.0, "ومن قبله أبوه آدمُ عليه الصلاة والسلام،"], [4688.0, "هو التوحيد والعقيدة التي بُعث بها كلُّ نبيٍّ وكلُّ رسول،"], [4693.0, "حتى ختم الله النبوةَ والرسالة بخيرهم وخاتمهم محمدٍ صلى الله عليه وسلم."]], "tr": [[4658.0, "Yine Allah Teâlâ'nın şu sözü gibi:"], [4661.0, "<span class=\"ayah\">﴿Senden önce gönderdiğimiz resullerimize sor: Rahmân'dan başka ibadet edilecek ilahlar kılmış mıyız?﴾<\/span> [Zuhruf 45]."], [4668.0, "Nebî ﷺ'in şu sözü de buna dayanır:"], [4670.0, "\"Peygamberler baba bir kardeşlerdir; anneleri ayrı, dinleri birdir.\" <span class=\"note\">(Buhârî, Müslim)<\/span> Yani akideleri birdir."], [4677.7, "Nûh'un (aleyhisselâm) ve ondan önce babası Âdem'in (aleyhisselâm) gönderildiği akide ve tevhid, her nebinin ve her resulün gönderildiği tevhid ve akidedir;"], [4690.0, "ta ki Allah nübüvveti ve risaleti onların en hayırlısı ve sonuncusu Muhammed ﷺ ile sona erdirinceye kadar."]]}]}, {"ts": "1:18:20", "title": "40. Külliye: Resûl'e ittibayı gerektirmeyen her sevgi yalandır", "paras": [{"reader": false, "ar": [[4700.0, "القاعدة الأخيرة فيما أظنّ ـ أو الكلية الأخيرة:"], [4704.0, "<b>كلُّ محبّةٍ للرسول لا تقتضي متابعتَه فكذب.<\/b> كلُّ محبّةٍ للرسول لا تقتضي متابعته فكذب."], [4715.0, "كلُّ محبّةٍ لا تقتضي متابعةَ الرسول فكذب. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[4700.0, "Sanırım son kaide —ya da son külliye—:"], [4704.0, "<b>40. külliye: Resûl'e ittibayı gerektirmeyen her sevgi yalandır.<\/b> Resûl'e ittibayı gerektirmeyen her sevgi yalandır."], [4715.0, "Resûl'e uymayı gerektirmeyen her sevgi yalandır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[4732.0, "وقد تواترت الأدلة ـ ولله الحمد والمِنّة ـ في هذا المعنى؛"], [4739.0, "كقول الله عز وجل:"], [4741.6, "<span class=\"ayah\">﴿قُلْ إِن كُنتُمْ تُحِبُّونَ اللَّهَ فَاتَّبِعُونِي﴾<\/span> <span class=\"ref\">[آل عمران: ٣١]<\/span>،"], [4744.0, "فقرن بين صدق محبّته ومتابعته."], [4748.0, "فكلُّ من زعم أنه يحبّ رسول الله صلى الله عليه وسلم ولم يلتزم بمقتضى شريعته فإنه كاذب."], [4758.0, "وعلى ذلك أهلُ البدع جميعًا؛"], [4760.0, "فإنك لا تجد مبتدعًا ـ أيًّا كان نوعُ بدعته ـ وهو يُبغض رسول الله صلى الله عليه وسلم،"], [4767.0, "بل كلُّهم يزعمون أنهم يحبّونه."]], "tr": [[4732.0, "Bu manada deliller —hamd ve minnet Allah'a— tevâtür derecesindedir."], [4739.0, "Allah Teâlâ'nın şu sözü gibi:"], [4741.6, "<span class=\"ayah\">﴿De ki: Eğer Allah'ı seviyorsanız bana uyun﴾<\/span> [Âl-i İmrân 31]."], [4748.0, "Böylece O'nu sevmedeki sadakat ile ona uymayı birbirine bağladı."], [4751.3, "Resûlullah ﷺ'i sevdiğini iddia edip de onun şeriatının gereğine bağlı kalmayan herkes yalancıdır."], [4760.0, "Bid'at ehlinin tamamı da buna göredir:"], [4762.5, "Bid'atinin türü ne olursa olsun Resûlullah ﷺ'e buğz eden bir bid'atçi bulamazsın;"], [4766.6, "bilakis hepsi onu sevdiğini iddia eder."]]}, {"reader": false, "ar": [[4770.0, "فنقول لهم: إنّ علامة محبّته صدقًا موافقتُه باطنًا في العقائد الصحيحة،"], [4777.0, "وظاهرًا في الأعمال الصحيحة؛"], [4779.0, "ولكنكم تزعمون أنكم تحبّونه،"], [4782.0, "فإذا رأينا عقائدكم الباطنية وجدناها على خلاف عقيدته،"], [4786.0, "وإذا نظرنا إلى أعمالكم الظاهرية وجدنا فيها من البدع والمحدثات ما يجعلكم مجانبين له ومخالفين له."], [4795.0, "فأيُّ محبّةٍ تزعمونها؟ فلو كانت محبّتكم صادقةً لكانت مبنيّةً على الاتّباع."]], "tr": [[4770.0, "Onlara deriz ki: Onu gerçekten sevmenin alameti, bâtında sahih akidelerde, zahirde de sahih amellerde ona uymaktır."], [4779.0, "Siz ise onu sevdiğinizi iddia ediyorsunuz;"], [4782.5, "fakat bâtınî akidelerinize baktığımızda onları onun akidesine muhalif bulduk;"], [4786.0, "zahirî amellerinize baktığımızda da onlarda sizi ondan uzaklaştıran ve ona muhalif kılan bid'atler ve sonradan çıkarılmış şeyler bulduk."], [4795.0, "O hâlde iddia ettiğiniz bu sevgi ne sevgisidir?"], [4798.7, "Sevginiz samimi olsaydı ittiba üzerine bina edilmiş olurdu."]]}, {"reader": false, "ar": [[4805.0, "وكما قال الله عز وجل:"], [4808.0, "<span class=\"ayah\">﴿وَإِن تُطِيعُوهُ تَهْتَدُوا﴾<\/span> <span class=\"ref\">[النور: ٥٤]<\/span>. وقال الله عز وجل:"], [4811.0, "<span class=\"ayah\">﴿الَّذِينَ يَتَّبِعُونَ الرَّسُولَ النَّبِيَّ الْأُمِّيَّ الَّذِي يَجِدُونَهُ مَكْتُوبًا عِندَهُمْ فِي التَّوْرَاةِ وَالْإِنجِيلِ يَأْمُرُهُم بِالْمَعْرُوفِ وَيَنْهَاهُمْ عَنِ الْمُنكَرِ﴾<\/span> <span class=\"ref\">[الأعراف: ١٥٧]<\/span> إلى آخر الآيتين بعدها."], [4832.0, "وقد أجمع أهل السنة والجماعة على ذلك."], [4836.0, "وعلى ذلك قولُ النبي صلى الله عليه وسلم:"], [4839.0, "«لا يؤمن أحدكم حتى أكون أحبَّ إليه من ولده ووالده والناس أجمعين» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[4805.0, "Allah Teâlâ'nın şu buyruğu gibi:"], [4808.0, "<span class=\"ayah\">﴿Eğer ona itaat ederseniz hidayete erersiniz﴾<\/span> [Nûr 54]."], [4811.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Onlar ki, yanlarındaki Tevrat'ta ve İncil'de yazılı buldukları o ümmî nebiye, Resûl'e uyarlar. O, onlara iyiliği emreder, onları kötülükten alıkoyar﴾<\/span> [A'râf 157] ve ardındaki iki ayetin sonuna kadar."], [4836.0, "Ehl-i Sünnet ve'l-Cemaat buna icma etmiştir."], [4837.1, "Nebî ﷺ'in şu sözü de buna dayanır:"], [4839.0, "\"Ben kendisine çocuğundan, babasından ve bütün insanlardan daha sevimli olmadıkça hiçbiriniz iman etmiş olmaz.\" <span class=\"note\">(Buhârî, Müslim)<\/span>"]]}, {"reader": false, "ar": [[4846.0, "ويقول الله عز وجل:"], [4848.0, "<span class=\"ayah\">﴿اتَّبِعُوا مَا أُنزِلَ إِلَيْكُم مِّن رَّبِّكُمْ وَلَا تَتَّبِعُوا مِن دُونِهِ أَوْلِيَاءَ ۗ قَلِيلًا مَّا تَذَكَّرُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ٣]<\/span>."], [4854.0, "وقال الله عز وجل:"], [4856.1, "<span class=\"ayah\">﴿لَقَدْ جَاءَكُمْ رَسُولٌ مِّنْ أَنفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ حَرِيصٌ عَلَيْكُم بِالْمُؤْمِنِينَ رَءُوفٌ رَّحِيمٌ﴾<\/span> <span class=\"ref\">[التوبة: ١٢٨]<\/span> <span class=\"note\">(Şeyh «ولقد» diye başlıyor.)<\/span>."], [4865.0, "وكلُّ ذلك مما يقتضي متابعته؛"], [4868.0, "فإن كنّا نصدُق في محبّتنا له فلنصدُق في متابعتنا له."], [4872.0, "وسيأتي كمالُ ذلك إن شاء الله في الدرس القادم."]], "tr": [[4846.0, "Allah Teâlâ şöyle buyurur: <span class=\"ayah\">﴿Rabbinizden size indirilene uyun; O'nu bırakıp başka dostlara uymayın. Ne kadar da az öğüt alıyorsunuz!﴾<\/span> [A'râf 3]."], [4854.0, "Allah Teâlâ şöyle buyurdu: <span class=\"ayah\">﴿Andolsun, size kendi içinizden öyle bir resul geldi ki sıkıntıya uğramanız ona ağır gelir; size çok düşkündür; müminlere karşı çok şefkatli, çok merhametlidir﴾<\/span> [Tevbe 128]."], [4868.0, "Bütün bunlar ona uymayı gerektirir."], [4869.5, "Eğer ona olan sevgimizde samimiysek, ona uymamızda da samimi olalım."], [4872.0, "Bunun tamamı inşallah gelecek derste gelecektir."]]}, {"reader": false, "ar": [[4877.0, "هذه أربعون كليةً قد تمّت في الساعة الخامسة وعشر دقائق… التاسعة وعشر دقائق."], [4884.0, "وآخر دعوانا أن الحمد لله رب العالمين،"], [4887.0, "وصلى الله وسلم على نبينا محمدٍ وعلى آله وأصحابه أجمعين."]], "tr": [[4877.0, "İşte bu kırk külliye, saat beşi on geçe… dokuzu on geçe tamamlandı."], [4884.0, "Son duamız, hamd âlemlerin Rabbi Allah'adır."], [4886.6, "Allah Peygamberimiz Muhammed'e, âline ve ashabının tamamına salât ve selam eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};

</script></body></html>
