<script>
const D={"no": 79, "vid": "obJiRkOn_x4", "title_ar": "الدرس (٧٩) من شرح كليات العقيدة — كليات باب الإيمان: تركيب حقيقة الإيمان من الاعتقاد والقول والعمل، ومذهب الجهمية في الإيمان، وترك جنس العمل", "title_tr": "Şerhu Külliyyâti'l-Akîde — 79. Ders: İman Babının Külliyeleri (İmanın Hakikatinin İtikad, Söz ve Amelden Oluşması; Cehmiyye'nin İman Tanımı; Amel Cinsini Terk Etmek)", "sections": [{"ts": "00:00", "title": "Giriş: İman babına geçiş · 1. Külliye: Şâri'in çağırdığı her imanın hakikati itikad, söz ve amelden oluşur", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.1, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.2, "وعلى آله وأصحابه الطيبين الطاهرين،"], [7.9, "ومن تبعهم بإحسانٍ إلى يوم الدين."], [11.0, "لقد ختمنا في الدرس الماضي ـ ولله الحمدُ والمنّة ـ الكلّيّاتِ المتعلّقةَ بأسماء الله عز وجل وصفاته،"], [18.1, "ولله الحمد. وسندخل اليوم ـ إن شاء الله ـ في الكلّيّات المتعلّقة بباب الإيمان عند أهل السنة والجماعة."], [28.0, "وكما جرت عادتُنا أنّنا نأخذ شيئًا من الكلّيّات،"], [31.6, "إمّا عشرًا أو أقلَّ،"], [33.3, "على ما يُيسّره الله عز وجل."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.6, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [11.0, "Geçen derste —hamd ve minnet Allah'a— Allah Azze ve Celle'nin isim ve sıfatlarıyla ilgili külliyeleri bitirdik;"], [19.0, "hamd Allah'adır. Bugün inşallah Ehl-i Sünnet ve'l-Cemaat'e göre iman babıyla ilgili külliyelere gireceğiz."], [28.0, "Âdetimiz olduğu üzere, Allah Azze ve Celle'nin kolaylaştırdığı kadarıyla külliyelerden bir kısmını —ya on ya da daha azını— alacağız."]]}, {"reader": false, "ar": [[36.0, "الكلّيّة الأولى: كلُّ إيمانٍ دعا له الشرع،"], [40.3, "<b>كلُّ إيمانٍ دعا إليه الشارع فحقيقتُه مركّبةٌ من اعتقادٍ وقولٍ وعمل.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [61.0, "<b>كلُّ إيمانٍ دعا إليه الشارع فحقيقتُه مركّبةٌ من اعتقادٍ وقولٍ وعمل.<\/b> وسأُكثِر من النُّقول عن أهل العلم في قواعد الإيمان، فلا تستطيلوها."]], "tr": [[36.0, "<b>1. külliye:<\/b> Şer'in çağırdığı her iman, <b>Şâri'in (Allah'ın ve Resûlü'nün) çağırdığı her imanın hakikati itikad, söz ve amelden oluşur.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [61.7, "<b>1. külliye: Şâri'in çağırdığı her imanın hakikati itikad, söz ve amelden oluşur.<\/b> İman kaidelerinde ilim ehlinden çokça nakil yapacağım; bunları uzun bulmayın."]]}, {"reader": false, "ar": [[75.0, "أقول وبالله التوفيق: اعلم ـ رحمك الله تعالى ـ أنّ الحقائق تنقسم إلى حقائق لغويّة،"], [85.5, "وإلى … <span class=\"q\">؟ 01:15<\/span> فالحقيقة اللغويّة هي استعمال اللفظ فيما وُضع له لغةً،"], [93.4, "والحقيقة الشرعيّة هي استعمال اللفظ فيما وُضع له شرعًا،"], [100.4, "والحقيقة العرفيّة هي استعمال … <span class=\"q\">؟ 01:15<\/span> فمتى ما رأيتَ الله عز وجل أو رسولَه صلى الله عليه وسلم يدعو إلى الإيمان،"], [115.0, "فلا يجوز لك أن تحمل هذا الإيمانَ على الحقيقة اللغويّة التي هي مجرّد التصديق،"], [122.0, "وإنما لا بدّ أن تحمل ألفاظ الإيمان الواردة في الكتاب والسنة على الحقيقة الشرعيّة."], [129.0, "ولا تتحقّق حقيقةُ الإيمان الشرعيّة إلا إذا قام على ثلاثة أركان:"], [135.0, "على اعتقاد الجَنان، وقول اللسان، وعمل الجوارح والأركان."]], "tr": [[75.0, "Tevfik Allah'tandır, derim ki: Bil ki —Allah Teâlâ sana rahmet etsin— hakikatler lügavî hakikatlere ve (…) <span class=\"q\">؟<\/span> ayrılır."], [75.9, "Lügavî hakikat, lafzı dilde konulduğu anlamda kullanmaktır;"], [76.9, "şer'î hakikat, lafzı şer'an konulduğu anlamda kullanmaktır;"], [77.7, "örfî hakikat ise (…) kullanmaktır <span class=\"q\">؟<\/span>."], [86.3, "Allah Azze ve Celle'yi veya Resûlü sallallâhu aleyhi ve sellem'i imana çağırırken gördüğünde, bu imanı sadece tasdikten ibaret olan lügavî hakikate hamletmen caiz değildir;"], [118.5, "aksine Kitap ve Sünnet'te geçen iman lafızlarını mutlaka şer'î hakikate hamletmelisin."], [129.0, "İmanın şer'î hakikati ancak üç rükün üzerine kurulduğunda gerçekleşir:"], [135.0, "kalbin itikadı, dilin sözü ve azaların ve organların ameli."]]}, {"reader": false, "ar": [[141.0, "وعلى هذا أجمع أهلُ السنة والجماعة:"], [144.0, "على أنّ الإيمان مرتكِزٌ على هذه الأركان الثلاثة،"], [149.0, "متى ما اختلّ واحدٌ منها اختلّت حقيقةُ الإيمان الشرعيّة،"], [156.0, "وإن كانت تبقى الحقيقةُ اللغويّة؛"], [159.3, "ولكنّ الكلام الآن على الحقيقة الشرعيّة المعهودة في لسان الشارع."], [166.0, "ومُستنَدُ هذا الإجماع عند أهل السنة والجماعة نصوصٌ كثيرةٌ جدًّا من الكتاب والسنة،"], [175.0, "كلُّها تدلّ على أنّ هذا الإيمان الشرعيّ مبنيٌّ على هذه الأركان الثلاثة."]], "tr": [[141.0, "Ehl-i Sünnet ve'l-Cemaat bunun üzerinde icmâ etmiştir:"], [144.0, "İman bu üç rükne dayanır;"], [147.8, "bunlardan biri bozulduğunda imanın şer'î hakikati bozulur, lügavî hakikat kalsa bile."], [159.3, "Fakat şu an söz, Şâri'in dilinde bilinen şer'î hakikat hakkındadır."], [166.0, "Ehl-i Sünnet ve'l-Cemaat'e göre bu icmâın dayanağı Kitap ve Sünnet'ten pek çok nastır;"], [174.1, "bunların hepsi bu şer'î imanın bu üç rükün üzerine bina edildiğine delâlet eder."]]}, {"reader": false, "ar": [[181.0, "فأمّا كونُه مبنيًّا على اعتقاد القلب،"], [185.0, "فدليلُه قولُ الله عز وجل:"], [188.0, "<span class=\"ayah\">﴿إِنَّمَا الْمُؤْمِنُونَ الَّذِينَ إِذَا ذُكِرَ اللَّهُ وَجِلَتْ قُلُوبُهُمْ﴾<\/span> <span class=\"ref\">[الأنفال: ٢]<\/span>،"], [194.0, "وقولُ الله عز وجل:"], [197.0, "<span class=\"ayah\">﴿وَنُقَلِّبُ أَفْئِدَتَهُمْ وَأَبْصَارَهُمْ كَمَا لَمْ يُؤْمِنُوا بِهِ أَوَّلَ مَرَّةٍ﴾<\/span> <span class=\"ref\">[الأنعام: ١١٠]<\/span>؛"], [202.0, "أي: بسبب عدم إيمانهم بالوحي أوّلَ مرّة،"], [207.0, "حرم اللهُ قلوبَهم من ولوج الإيمان فيها ثانيَ مرّة."], [213.0, "وقال الله عز وجل:"], [215.0, "<span class=\"ayah\">﴿أُولَٰئِكَ الَّذِينَ لَمْ يُرِدِ اللَّهُ أَن يُطَهِّرَ قُلُوبَهُمْ﴾<\/span> <span class=\"ref\">[المائدة: ٤١]<\/span>،"], [220.0, "وقولُ الله عز وجل:"], [221.0, "<span class=\"ayah\">﴿أُولَٰئِكَ كَتَبَ فِي قُلُوبِهِمُ الْإِيمَانَ وَأَيَّدَهُم بِرُوحٍ مِّنْهُ﴾<\/span> <span class=\"ref\">[المجادلة: ٢٢]<\/span>،"], [228.0, "وقال الله عز وجل:"], [230.0, "<span class=\"ayah\">﴿وَمَن يُؤْمِن بِاللَّهِ يَهْدِ قَلْبَهُ﴾<\/span> <span class=\"ref\">[التغابن: ١١]<\/span>."]], "tr": [[181.0, "İmanın kalbin itikadı üzerine bina edilmesine gelince, delili Allah Azze ve Celle'nin şu sözüdür:"], [188.0, "<span class=\"ayah\">﴿Müminler ancak o kimselerdir ki Allah anıldığında kalpleri ürperir﴾<\/span> [Enfâl 2]."], [193.1, "Ve Allah Azze ve Celle'nin şu sözü:"], [197.0, "<span class=\"ayah\">﴿İlk defasında ona iman etmedikleri gibi, biz de onların gönüllerini ve gözlerini ters çeviririz﴾<\/span> [En'âm 110];"], [204.1, "yani ilk defasında vahye iman etmemeleri sebebiyle, Allah kalplerini imanın ikinci defa oraya girmesinden mahrum bırakmıştır."], [213.0, "Allah Azze ve Celle şöyle buyurdu:"], [215.0, "<span class=\"ayah\">﴿Onlar, Allah'ın kalplerini temizlemek istemediği kimselerdir﴾<\/span> [Mâide 41]."], [218.8, "Ve Allah Azze ve Celle'nin şu sözü:"], [221.0, "<span class=\"ayah\">﴿İşte Allah onların kalplerine imanı yazmış ve onları kendi katından bir ruh ile desteklemiştir﴾<\/span> [Mücâdele 22]."], [228.0, "Allah Azze ve Celle şöyle buyurdu:"], [230.0, "<span class=\"ayah\">﴿Kim Allah'a iman ederse (Allah) onun kalbini hidayete erdirir﴾<\/span> [Teğâbün 11]."]]}, {"reader": false, "ar": [[233.0, "وفي الحديث الصحيح يقول النبيّ صلى الله عليه وسلم:"], [237.0, "«يا معشرَ مَن آمن بلسانه ولم يُفضِ الإيمانُ إلى قلبه، لا تُؤذوا المسلمين، ولا تُعيِّروهم، ولا تتّبعوا عوراتِهم؛ فإنّه من يتتبّعْ عورةَ أخيه المسلم يتتبّعِ اللهُ عورتَه، ومن يتتبّعِ اللهُ عورتَه يفضحْه ولو في جوف رَحْله»،"], [257.9, "أو كما قال صلى الله عليه وسلم."], [261.0, "فهذا دليلٌ على أنّ القلب يوصف بالكفر والإيمان،"], [266.0, "فيقال: قلبٌ مؤمن، وقلبٌ كافر."]], "tr": [[233.0, "Sahih hadiste Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [234.8, "\"Ey diliyle iman edip de iman kalbine ulaşmamış olanlar topluluğu!"], [237.0, "Müslümanlara eziyet etmeyin, onları ayıplamayın, onların ayıplarını araştırmayın."], [242.5, "Çünkü kim Müslüman kardeşinin ayıbını araştırırsa Allah da onun ayıbını araştırır;"], [250.1, "Allah kimin ayıbını araştırırsa, evinin içinde bile olsa onu rezil eder\" —ya da sallallâhu aleyhi ve sellem'in dediği gibi."], [261.0, "Bu, kalbin küfür ve imanla vasıflandığına delildir;"], [265.4, "\"mümin kalp\" ve \"kâfir kalp\" denir."]]}, {"reader": false, "ar": [[270.0, "وأمّا كونُه مبنيًّا أيضًا على نطق اللسان،"], [274.0, "فدليلُه قولُ الله عز وجل:"], [277.3, "«قولوا آمنّا»؛ فأمرهم بالقول،"], [280.0, "قال: <span class=\"ayah\">﴿قُولُوا آمَنَّا بِاللَّهِ وَمَا أُنزِلَ إِلَيْنَا وَمَا أُنزِلَ إِلَىٰ إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ وَيَعْقُوبَ وَالْأَسْبَاطِ﴾<\/span> <span class=\"ref\">[البقرة: ١٣٦]<\/span> الآيةَ بتمامها."], [291.0, "وكذلك أيضًا يقول النبيّ صلى الله عليه وسلم:"], [295.9, "«أُمرتُ أن أقاتل الناس حتى يقولوا: لا إله إلا الله،"]], "tr": [[270.0, "İmanın dilin söylemesi üzerine de bina edilmesine gelince, delili Allah Azze ve Celle'nin \"Deyin ki:"], [277.3, "İman ettik\" sözüdür; onlara söylemeyi emretmiştir."], [280.6, "Buyurdu ki: <span class=\"ayah\">﴿Deyin ki: Biz Allah'a, bize indirilene, İbrâhîm'e, İsmâîl'e, İshâk'a, Ya'kûb'a ve torunlarına indirilene iman ettik﴾<\/span> [Bakara 136] —ayetin tamamı."], [291.0, "Aynı şekilde Peygamber sallallâhu aleyhi ve sellem de şöyle buyurur:"], [295.9, "\"İnsanlarla, 'Lâ ilâhe illallah' deyinceye kadar savaşmakla emrolundum;"]]}]}, {"ts": "05:02", "title": "1. Külliye (devam): Dilin sözü ve azaların amelinin imandan olduğunun delilleri", "paras": [{"reader": false, "ar": [[302.0, "فمن قال: لا إله إلا الله،"], [304.6, "عصم منّي نفسَه ومالَه إلا بحقّه،"], [307.7, "وحسابُه على الله». وفي حديث أبي هريرة في الصحيحين يقول النبيّ صلى الله عليه وسلم:"], [315.0, "«الإيمانُ بضعٌ وستّون ـ أو قال: بضعٌ وسبعون ـ شُعبةً، فأعلاها» ـ وفي روايةٍ:"], [321.9, "«وأفضلُها» ـ «قولُ: لا إله إلا الله»."], [325.0, "فهذا دليلٌ على أنّ الإيمان نطقٌ باللسان أيضًا."]], "tr": [[302.0, "kim 'Lâ ilâhe illallah' derse, hakkı olan dışında canını ve malını benden korumuş olur;"], [309.0, "hesabı da Allah'a kalmıştır.\" Sahîhayn'de Ebû Hüreyre hadisinde Peygamber sallallâhu aleyhi ve sellem şöyle buyurur:"], [317.0, "\"İman altmış küsur —veya: yetmiş küsur— şubedir;"], [321.9, "en yükseği\" —bir rivayette: \"en faziletlisi\"— \"'Lâ ilâhe illallah' demektir.\" Bu, imanın aynı zamanda dille söylemek olduğuna delildir."]]}, {"reader": false, "ar": [[329.0, "وأمّا كونُه مبنيًّا على أعمال الجوارح،"], [333.0, "فهذه قد تواترت أدلّتُها؛"], [335.0, "فمنها قولُ الله عز وجل:"], [338.0, "<span class=\"ayah\">﴿وَمَا كَانَ اللَّهُ لِيُضِيعَ إِيمَانَكُمْ﴾<\/span> <span class=\"ref\">[البقرة: ١٤٣]<\/span>،"], [342.0, "والمقصود بالإيمان هنا: أي الصلاة إلى بيت المقدس."], [346.0, "وذلك أنّ الصحابة سألوا رسولَ الله صلى الله عليه وسلم بعد أن تغيّرت القبلة من بيت المقدس إلى البيت الحرام،"], [354.0, "قالوا: ما حالُ إخواننا الذين ماتوا قبل هذا التحويل؟"], [358.0, "فأنزل الله عز وجل:"], [359.0, "<span class=\"ayah\">﴿وَمَا كَانَ اللَّهُ لِيُضِيعَ إِيمَانَكُمْ﴾<\/span> <span class=\"ref\">[البقرة: ١٤٣]<\/span>."]], "tr": [[329.0, "İmanın azaların amelleri üzerine bina edilmesine gelince, bunun delilleri tevâtür derecesine ulaşmıştır."], [335.0, "Bunlardan biri Allah Azze ve Celle'nin şu sözüdür:"], [338.0, "<span class=\"ayah\">﴿Allah imanınızı zayi edecek değildir﴾<\/span> [Bakara 143]."], [342.7, "Burada iman ile kastedilen, Beytü'l-Makdis'e doğru kılınan namazdır."], [346.0, "Şöyle ki: Kıble Beytü'l-Makdis'ten Beytü'l-Harâm'a değiştikten sonra sahâbe Resûlullah sallallâhu aleyhi ve sellem'e sordular;"], [350.5, "dediler ki: \"Bu değişiklikten önce ölen kardeşlerimizin hâli ne olacak?\" Bunun üzerine Allah Azze ve Celle şunu indirdi:"], [358.0, "<span class=\"ayah\">﴿Allah imanınızı zayi edecek değildir﴾<\/span> [Bakara 143]."]]}, {"reader": false, "ar": [[363.0, "قال الإمام الحَلِيميّ رحمه الله تعالى:"], [365.0, "«أجمع المفسّرون على أنه أراد صلاتَكم إلى بيت المقدس، فثبت أنّ الصلاة إيمان، وهي عمل؛ فدلّ ذلك على أنّ الأعمال من الإيمان»."], [376.0, "وقال الإمام السعديّ رحمه الله تعالى:"], [379.0, "«في هذه الآية دليلٌ لمذهب أهل السنة والجماعة أنّ الإيمان تدخل فيه أعمالُ الجوارح»."]], "tr": [[363.0, "İmam Halîmî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [365.0, "\"Müfessirler, (Allah'ın bununla) Beytü'l-Makdis'e doğru kıldığınız namazı kastettiğinde icmâ etmişlerdir."], [368.8, "Böylece namazın iman olduğu sabit olmuştur;"], [371.3, "namaz ise ameldir. Bu da amellerin imandan olduğuna delâlet eder.\" İmam Sa'dî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [376.0, "\"Bu ayette, azaların amellerinin imana dahil olduğu yönündeki Ehl-i Sünnet ve'l-Cemaat mezhebine delil vardır.\""]]}, {"reader": false, "ar": [[387.0, "وكذلك أيضًا قولُ الله عز وجل:"], [390.0, "<span class=\"ayah\">﴿وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ حُنَفَاءَ﴾<\/span> <span class=\"ref\">[البينة: ٥]<\/span>،"], [395.0, "وهذا عملُ قلب، ثم قال:"], [398.1, "<span class=\"ayah\">﴿وَيُقِيمُوا الصَّلَاةَ﴾<\/span> <span class=\"ref\">[البينة: ٥]<\/span> وهي عملُ جوارح،"], [401.0, "<span class=\"ayah\">﴿وَيُؤْتُوا الزَّكَاةَ﴾<\/span> <span class=\"ref\">[البينة: ٥]<\/span> وهي من عمل الجوارح،"], [405.0, "<span class=\"ayah\">﴿وَذَٰلِكَ دِينُ الْقَيِّمَةِ﴾<\/span> <span class=\"ref\">[البينة: ٥]<\/span>. قال الإمام ابن كثير رحمه الله:"], [409.0, "«استدلّ كثيرٌ من الأئمّة كالزهريّ والشافعيّ بهذه الآية الكريمة على أنّ الأعمال داخلةٌ في مسمّى الإيمان». انتهى كلامُه."]], "tr": [[387.0, "Aynı şekilde Allah Azze ve Celle'nin şu sözü:"], [390.0, "<span class=\"ayah\">﴿Hâlbuki onlar, dini yalnız Allah'a has kılarak, hanîfler olarak O'na ibadet etmekten başkasıyla emrolunmadılar﴾<\/span> [Beyyine 5];"], [398.1, "bu, kalbin amelidir. Sonra buyurdu:"], [399.9, "<span class=\"ayah\">﴿Namazı kılmaları﴾<\/span> [Beyyine 5] —bu azaların amelidir— <span class=\"ayah\">﴿ve zekâtı vermeleri﴾<\/span> [Beyyine 5] —bu da azaların amelindendir— <span class=\"ayah\">﴿İşte dosdoğru din budur﴾<\/span> [Beyyine 5]."], [409.0, "İmam İbn Kesîr —Allah ona rahmet etsin— şöyle dedi:"], [412.8, "\"Zührî ve Şâfiî gibi imamların birçoğu bu kerim ayeti, amellerin iman adlandırmasına dahil olduğuna delil getirmiştir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[420.0, "ومن ذلك أيضًا حديثُ وفد عبد القيس،"], [423.0, "وهو في الصحيحين من حديث ابن عبّاسٍ رضي الله عنهما،"], [427.0, "قال: قَدِم وفدُ عبد القيس إلى النبيّ صلى الله عليه وسلم فقالوا:"], [431.6, "«يا رسول الله، إنّا نأتيك من شُقّةٍ بعيدة، وإنّ بيننا وبينك هذا الحيَّ من كفّار مُضَر، فمُرْنا بأمرٍ فَصْلٍ نُخبر به مَن وراءنا وندخل به الجنّة»."], [444.2, "قال: فأمرهم بأربع، ونهاهم عن أربع؛"], [447.4, "قال: أمرهم بالإيمان بالله وحده،"], [450.0, "ثم قال: «هل تدرون ما الإيمان بالله وحده؟» قالوا:"], [454.2, "الله ورسوله أعلم. قال:"], [456.0, "«شهادةُ أن لا إله إلا الله، وإقام ـ وأنّ محمدًا رسول الله ـ وإقامُ الصلاة، وإيتاءُ الزكاة، وصومُ رمضان، وأن تُعطوا خُمُسًا من المغنم»."], [469.0, "قال: ونهاهم عن أربع:"], [470.8, "عن الدُّبّاء، والحَنْتَم، والمُزفَّت،"], [472.5, "والنَّقير، وقال: «احفظوهنّ، وأخبِروا بهنّ مَن وراءكم»."]], "tr": [[420.0, "Bunlardan biri de Abdülkays heyetinin hadisidir;"], [422.6, "bu hadis Sahîhayn'de İbn Abbâs'ın —Allah ikisinden razı olsun— rivayetiyle geçer."], [427.4, "Dedi ki: Abdülkays heyeti Peygamber sallallâhu aleyhi ve sellem'e geldi ve dediler ki:"], [431.6, "\"Ey Allah'ın Resûlü! Biz sana uzak bir yoldan geliyoruz;"], [434.9, "seninle bizim aramızda Mudar kâfirlerinden şu kabile var."], [437.9, "Bize, geride bıraktıklarımıza haber vereceğimiz ve onunla cennete gireceğimiz kesin bir emir ver.\" (İbn Abbâs) dedi ki:"], [444.2, "Onlara dört şeyi emretti, dört şeyi de yasakladı."], [447.4, "Dedi ki: Onlara tek olan Allah'a imanı emretti;"], [450.9, "sonra \"Tek olan Allah'a imanın ne olduğunu biliyor musunuz?\" dedi."], [454.2, "\"Allah ve Resûlü daha iyi bilir\" dediler."], [455.5, "Buyurdu ki: \"Allah'tan başka ilâh olmadığına ve Muhammed'in Allah'ın Resûlü olduğuna şahitlik etmek, namazı kılmak, zekâtı vermek, Ramazan orucunu tutmak ve ganimetten beşte birini vermenizdir.\" Dedi ki:"], [469.0, "Onlara dört şeyi de yasakladı:"], [470.8, "Dubbâ, hantem, müzeffet ve nakîr (kaplarını);"], [473.5, "ve \"Bunları ezberleyin ve geride bıraktıklarınıza haber verin\" buyurdu."]]}, {"reader": false, "ar": [[476.0, "والشاهدُ منه أنّ النبيّ صلى الله عليه وسلم فسّر الإيمان بنطق اللسان في الشهادتين،"], [483.9, "وبعمل الجوارح؛ ممّا يدلّ على أنّ أعمال الجوارح داخلةٌ في الإيمان."], [488.0, "ومنها حديثُ أبي هريرة الذي ذكرتُه آنفًا في قوله صلى الله عليه وسلم:"], [495.0, "«الإيمانُ بضعٌ وسبعون شُعبةً، فأفضلُها قولُ: لا إله إلا الله، وأدناها إماطةُ الأذى عن الطريق، والحياءُ شعبةٌ من الإيمان»."]], "tr": [[476.0, "Buradaki delil yönü şudur: Peygamber sallallâhu aleyhi ve sellem imanı, iki şehadette dilin söylemesiyle ve azaların ameliyle tefsir etmiştir."], [485.0, "Bu da azaların amellerinin imana dahil olduğuna delâlet eder."], [488.0, "Bunlardan biri de az önce zikrettiğim Ebû Hüreyre hadisidir;"], [491.8, "sallallâhu aleyhi ve sellem'in şu sözünde:"], [495.0, "\"İman yetmiş küsur şubedir; en faziletlisi 'Lâ ilâhe illallah' demek, en aşağısı yoldan eziyet veren şeyi kaldırmaktır;"], [502.3, "hayâ da imandan bir şubedir.\""]]}, {"reader": false, "ar": [[505.0, "ومن عجائب هذا الحديث أنه دلّ على الأركان الثلاثة التي عليها قيامُ الإيمان:"], [512.0, "فقولُه: «قولُ لا إله إلا الله» هذا دليلٌ على نطق اللسان،"], [516.0, "وقولُه: «وأدناها إماطةُ الأذى عن الطريق» هذا دليلٌ على العمل،"], [522.0, "وقولُه: «والحياءُ شعبةٌ من الإيمان»،"], [526.0, "والحياءُ عملُ القلب. فهذا دليلٌ على أنّ اعتقاد القلب ونطقَ اللسان وعملَ الجوارح كلُّها داخلةٌ في مسمّى الإيمان."]], "tr": [[505.0, "Bu hadisin harika yönlerinden biri, imanın üzerinde durduğu üç rükne delâlet etmesidir:"], [512.0, "\"Lâ ilâhe illallah demek\" sözü dilin söylemesine delildir;"], [516.8, "\"en aşağısı yoldan eziyet veren şeyi kaldırmaktır\" sözü amele delildir;"], [522.8, "\"hayâ da imandan bir şubedir\" sözü —hayâ ise kalbin amelidir."], [527.0, "Bu da kalbin itikadının, dilin söylemesinin ve azaların amelinin hepsinin iman adlandırmasına dahil olduğuna delildir."]]}, {"reader": false, "ar": [[535.0, "ومنها أيضًا الأدلّةُ التي ينفي فيها النبيّ صلى الله عليه وسلم الإيمانَ عمّن عطّل شيئًا من العمل ـ كقوله صلى الله عليه ـ أو ارتكب شيئًا من الحرام،"], [547.0, "كقوله صلى الله عليه وسلم:"], [549.1, "«لا يزني الزاني حين يزني وهو مؤمن» ـ والزِّنا مخالفةٌ عمليّة ـ «ولا يسرق السارق حين يسرق وهو مؤمن، ولا يشرب الخمرَ حين يشربها وهو مؤمن، ولا يَغُلُّ حين يَغُلُّ وهو مؤمن» ـ فإيّاكم ـ «ولا ينتهب نُهبةً ذاتَ شرفٍ يرفع الناسُ إليه أبصارَهم فيها حين ينتهبها وهو مؤمن، فإيّاكم إيّاكم»."]], "tr": [[535.0, "Bunlardan biri de Peygamber sallallâhu aleyhi ve sellem'in, amelden bir şeyi terk eden —sallallâhu aleyhi (ve sellem'in) sözü gibi— veya haramdan bir şey işleyen kimseden imanı nefyettiği delillerdir."], [546.1, "Sallallâhu aleyhi ve sellem'in şu sözü gibi:"], [549.1, "\"Zina eden, zina ettiği sırada mümin olarak zina etmez\" —zina amelî bir muhalefettir— \"hırsız, çaldığı sırada mümin olarak çalmaz;"], [559.0, "içki içen, içtiği sırada mümin olarak içmez;"], [562.0, "ganimetten çalan, çaldığı sırada mümin olarak çalmaz\" —sakının!— \"insanların gözlerini kendisine kaldırıp baktığı değerli bir şeyi yağmalayan, yağmaladığı sırada mümin olarak yağmalamaz. Sakının, sakının!\""]]}, {"reader": false, "ar": [[574.0, "وفي صحيح الإمام البخاريّ من حديث ابن عبّاس:"], [577.0, "«ولا يقتل حين يقتل وهو مؤمن»."], [580.0, "قال عكرمة: قلتُ لابن عبّاس:"], [582.2, "كيف يُنزَع منه الإيمان؟"], [584.0, "فقال: هكذا ـ وشبّك بين أصابعه ثم أخرجها ـ فإن تاب عاد إليه هكذا ـ وشبّك بين أصابعه."], [592.0, "قال أبو عبد الله ـ يعني البخاريَّ رحمه الله ـ:"], [594.0, "«لا يكون هذا» ـ أي من وقع في هذه المحرّمات ـ «مؤمنًا تامًّا، ولا يكون له نورُ الإيمان»."]], "tr": [[574.0, "İmam Buhârî'nin Sahîh'inde İbn Abbâs'ın hadisinde (şu ziyade vardır):"], [577.0, "\"Adam öldüren, öldürdüğü sırada mümin olarak öldürmez.\" İkrime dedi ki:"], [580.0, "İbn Abbâs'a \"İman ondan nasıl çekilip alınır?\" dedim."], [584.0, "\"Böyle\" dedi —parmaklarını birbirine geçirdi, sonra çıkardı— \"eğer tövbe ederse ona böyle geri döner\" —ve parmaklarını birbirine geçirdi."], [592.0, "Ebû Abdillah —yani Buhârî, Allah ona rahmet etsin— şöyle dedi:"], [594.0, "\"Bu kimse\" —yani bu haramlara düşen kimse— \"tam mümin olmaz ve onun için imanın nuru olmaz.\""]]}]}, {"ts": "10:02", "title": "1. Külliye (devam): İmanı nefyeden hadisler, Buhârî'nin babları ve selefin sözleri", "paras": [{"reader": false, "ar": [[602.0, "فهذا دليلٌ على أنّ الأعمال داخلةٌ في مسمّى الإيمان."], [606.0, "ومنها أيضًا قولُ النبيّ صلى الله عليه وسلم:"], [608.0, "«واللهِ لا يؤمن» <span class=\"note\">(يكررها ثلاثًا)<\/span>،"], [610.4, "قالوا: مَن يا رسول الله؟"], [614.0, "قال: «من لا يأمَنُ جارُه بوائقَه»؛"], [617.0, "أي: دواهيَه وغوائلَه. وكذلك أيضًا قولُ النبيّ صلى الله عليه وسلم:"], [623.0, "«لا إيمانَ لمن لا أمانةَ له» ـ والأمانةُ عملٌ،"], [627.0, "عملٌ من أعمال الجوارح ـ «ولا دينَ لمن لا عهدَ له»."], [631.8, "والآياتُ والأحاديثُ في ذلك كثيرةٌ جدًّا."]], "tr": [[602.0, "Bu, amellerin iman adlandırmasına dahil olduğuna delildir."], [605.1, "Bunlardan biri de Peygamber sallallâhu aleyhi ve sellem'in şu sözüdür:"], [608.0, "\"Vallahi iman etmiş olmaz\" (üç kez tekrar ediyor)."], [610.8, "\"Kim, ey Allah'ın Resûlü?\" dediler."], [614.0, "Buyurdu ki: \"Komşusu onun şerlerinden emin olmayan kimse\";"], [617.0, "yani belâlarından ve kötülüklerinden. Aynı şekilde Peygamber sallallâhu aleyhi ve sellem'in şu sözü:"], [623.0, "\"Emaneti olmayanın imanı yoktur\" —emanet ameldir, azaların amellerinden bir ameldir— \"ahdi olmayanın dini yoktur.\" Bu konudaki ayetler ve hadisler pek çoktur."]]}, {"reader": false, "ar": [[635.0, "ولذلك قال الإمام ابن رجب رحمه الله عن حديث «لا يزني الزاني وهو مؤمن»،"], [641.0, "قال: «فلولا أنّ تركَ هذه الكبائر من مسمّى الإيمان لما انتفى اسمُ الإيمان عن مرتكب شيءٍ منها؛ لأنّ الاسم لا ينتفي إلا بانتفاء بعض أركان المسمّى أو واجباته»."], [655.0, "انتهى كلامه رحمه الله."]], "tr": [[635.0, "Bu yüzden İmam İbn Receb —Allah ona rahmet etsin— \"Zina eden, mümin olarak zina etmez\" hadisi hakkında şöyle dedi:"], [641.4, "\"Eğer bu büyük günahları terk etmek iman adlandırmasından olmasaydı, bunlardan birini işleyenden iman ismi nefyedilmezdi."], [647.5, "Çünkü isim, ancak adlandırılan şeyin bazı rükünlerinin veya vaciplerinin yok olmasıyla nefyedilir.\" Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[656.0, "ومن الأحاديث أيضًا قولُ النبيّ صلى الله عليه وسلم في الحديث المشهور،"], [660.0, "في حديث أبي مالكٍ الأشعريّ في صحيح الإمام مسلم،"], [665.6, "قال: «الطُّهورُ شطرُ الإيمان، والحمدُ لله تملأُ الميزان، وسبحان الله والحمدُ لله تملآن ـ أو تملأ ـ ما بين السماوات والأرض» إلى آخر الحديث."], [677.0, "حتى إنّ الإمام البخاريّ ـ من عبقريّته الفقهيّة العقديّة ـ أنه عقد أبوابًا كثيرةً في صحيحه كلُّها تدلّ على أنّ العمل من الإيمان،"], [688.0, "كقوله رحمه الله: «باب الجهاد من الإيمان» ـ والجهاد عملُ الجوارح ـ،"], [695.0, "«باب تطوّع قيام رمضان من الإيمان»،"], [700.0, "«باب صوم رمضان من الإيمان»،"], [703.0, "«باب الصلاة من الإيمان»،"], [706.0, "«باب اتّباع الجنائز من الإيمان»."]], "tr": [[656.0, "Hadislerden biri de Peygamber sallallâhu aleyhi ve sellem'in meşhur hadisteki sözüdür;"], [660.0, "İmam Müslim'in Sahîh'inde Ebû Mâlik el-Eş'arî'nin hadisinde buyurdu ki:"], [666.0, "\"Temizlik imanın yarısıdır; 'elhamdülillah' mizanı doldurur;"], [671.0, "'sübhânallah' ve 'elhamdülillah' göklerle yer arasını doldurur —veya doldurur—\" hadisin sonuna kadar."], [677.0, "Hatta İmam Buhârî'nin fıkhî ve akîdevî dehasındandır ki Sahîh'inde, hepsi amelin imandan olduğuna delâlet eden birçok bab açmıştır."], [686.7, "Mesela —Allah ona rahmet etsin— şöyle der:"], [690.0, "\"Cihad imandandır babı\" —cihad ise azaların amelidir—, \"Ramazan'da nafile kıyam (teravih) imandandır babı\", \"Ramazan orucu imandandır babı\", \"Namaz imandandır babı\", \"Cenazelere uymak imandandır babı.\""]]}, {"reader": false, "ar": [[710.0, "وهذا ما أجمع عليه أهلُ السنة والجماعة رحمهم الله تعالى؛"], [714.0, "فالذي دلّ عليه الكتاب والسنة وأجمع عليه السلفُ الصالح هو أنّ الإيمان مرتكِزٌ على هذه الأركان الثلاثة."], [725.0, "وقد تواترت كلمةُ أهل العلم على هذه الحقيقة:"], [728.0, "فعن عُبيد بن عُمَير الليثيّ أنه قال:"], [731.0, "«ليس الإيمانُ بالتمنّي، ولكنّ الإيمانَ قولٌ يُعقَل، وعملٌ يُعمَل»."], [736.0, "وعن الإمام الحسن البصريّ رحمه الله تعالى قال: «الإيمانُ قولٌ وعمل»."]], "tr": [[710.0, "Ehl-i Sünnet ve'l-Cemaat'in —Allah Teâlâ onlara rahmet etsin— icmâ ettiği şey budur."], [714.0, "Kitap ve Sünnet'in delâlet ettiği ve selef-i sâlihînin icmâ ettiği şey, imanın bu üç rükne dayandığıdır."], [725.0, "İlim ehlinin sözü bu hakikat üzerinde tevâtür derecesine ulaşmıştır."], [728.0, "Ubeyd b. Umeyr el-Leysî'den şöyle dediği rivayet edilir:"], [731.0, "\"İman temenni ile değildir; iman, akledilen bir söz ve yapılan bir ameldir.\" İmam Hasan-ı Basrî'den —Allah Teâlâ ona rahmet etsin— şöyle dediği rivayet edilir: \"İman söz ve ameldir.\""]]}, {"reader": false, "ar": [[741.0, "وقال الفُضيل بن عِياضٍ رحمه الله:"], [743.0, "«الإيمانُ عندنا داخلُه وخارجُه: الإقرارُ باللسان، والقبولُ بالقلب، والعملُ به»."], [751.0, "انتهى كلامه. وقال مالك بن أنس رحمه الله:"], [755.2, "«الإيمانُ قولٌ وعمل، يزيد وينقص»."], [757.0, "وقال الوليد بن مسلم رحمه الله:"], [759.8, "«سمعتُ الأوزاعيَّ ومالكَ بن أنس وسعيدَ بن عبد العزيز يُنكرون قولَ من يقول: إنّ الإيمان قولٌ بلا عمل، ويقولون: لا إيمان إلا بعمل، ولا عمل إلا بإيمان»."]], "tr": [[741.0, "Fudayl b. Iyâz —Allah ona rahmet etsin— şöyle dedi:"], [743.0, "\"Bize göre imanın içi ve dışı şudur:"], [746.7, "dille ikrar, kalple kabul ve onunla amel.\" Sözü burada bitti."], [751.0, "Mâlik b. Enes —Allah ona rahmet etsin— şöyle dedi:"], [755.2, "\"İman söz ve ameldir; artar ve eksilir.\" Velîd b."], [757.0, "Müslim —Allah ona rahmet etsin— şöyle dedi:"], [759.8, "\"Evzâî'yi, Mâlik b. Enes'i ve Saîd b."], [763.5, "Abdülazîz'i, 'İman amelsiz sözdür' diyenin sözünü reddederken işittim;"], [768.4, "onlar 'Amelsiz iman olmaz, imansız amel olmaz' diyorlardı.\""]]}, {"reader": false, "ar": [[773.0, "وقال أبو عُبيدٍ القاسم بن سلّام رحمه الله:"], [777.0, "«الأمر الذي عليه السنّة عندنا ما نصّ عليه علماؤنا ممّا اقتصصنا في كتابنا هذا: أنّ الإيمان بالنيّة والقول والعمل جميعًا»."], [787.0, "وقال الإمام المُزَنيّ رحمه الله:"], [790.1, "«الإيمانُ قولٌ وعمل، مع اعتقاده بالجَنان: قولٌ باللسان، وعملٌ بالجوارح والأركان، وهما سِيّان ونظامان وقرينان، لا نُفرّق بينهما؛ لا إيمانَ إلا بعمل، ولا عملَ إلا بإيمان»."]], "tr": [[773.0, "Ebû Ubeyd el-Kâsım b. Sellâm —Allah ona rahmet etsin— şöyle dedi:"], [777.0, "\"Bize göre sünnetin üzerinde olduğu iş, âlimlerimizin nas olarak belirttiği ve bu kitabımızda anlattığımız şeydir:"], [782.0, "İman niyet, söz ve amelin hepsiyledir.\" İmam Müzenî —Allah ona rahmet etsin— şöyle dedi:"], [787.0, "\"İman, kalple itikadıyla birlikte söz ve ameldir:"], [790.1, "dille söz, azalar ve organlarla amel."], [794.4, "Bu ikisi eşittir, birbirinin düzeni ve eşidir;"], [799.9, "aralarını ayırmayız. Amelsiz iman olmaz, imansız amel olmaz.\""]]}, {"reader": false, "ar": [[806.0, "وقال الإمام حربٌ الكرمانيّ رحمه الله تعالى:"], [810.2, "«اتّفقت الصحابة والتابعون فمن بعدهم من علماء السنة على أنّ الأعمال من الإيمان، وقالوا: إنّ الإيمان قولٌ وعملٌ وعقيدة»."], [821.1, "وقال الإمام الحافظ ابن عبد البرّ رحمه الله تعالى:"], [825.3, "«أجمع أهلُ الفقه والحديث على أنّ الإيمان قولٌ وعمل، ولا عملَ إلا بنيّة، إلا ما ذُكر عن أبي حنيفة وأصحابه؛ فإنهم ذهبوا إلى أنّ الطاعات لا تُسمّى إيمانًا»."], [841.0, "انتهى كلامه. وسيأتي تفصيله في قاعدة مُرجئة الفقهاء إن شاء الله تعالى."]], "tr": [[806.0, "İmam Harb el-Kirmânî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [810.2, "\"Sahâbe, tâbiûn ve onlardan sonraki sünnet âlimleri, amellerin imandan olduğunda ittifak etmişler ve 'İman söz, amel ve akîdedir' demişlerdir.\" İmam Hâfız İbn Abdilber —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [825.3, "\"Fıkıh ve hadis ehli, imanın söz ve amel olduğunda ve niyetsiz amelin olmadığında icmâ etmişlerdir;"], [832.3, "Ebû Hanîfe ve ashâbından nakledilen müstesna."], [835.2, "Onlar taatlerin iman diye adlandırılmayacağı görüşüne gitmişlerdir.\" Sözü burada bitti."], [841.0, "Bunun tafsilatı inşallah fukahâ Mürcie'si kaidesinde gelecek."]]}, {"reader": false, "ar": [[846.0, "قال الإمام الشافعيّ رحمه الله تعالى:"], [848.8, "«وكان الإجماعُ من الصحابة والتابعين ومن بعدهم ممّن أدركنا: أنّ الإيمان قولٌ وعملٌ ونيّة، لا يُجزئ واحدٌ من الثلاثة عن الآخر»."], [863.0, "وروى الإمام اللالكائيّ عن الإمام البخاريّ قولَه:"], [867.0, "«لقيتُ أكثرَ من ألف رجلٍ من العلماء بالأمصار، فما رأيتُ أحدًا منهم يختلف في أنّ الإيمان قولٌ وعمل، يزيد وينقص»."], [880.0, "وقال الإمام الأوزاعيّ رحمه الله:"], [882.5, "«لا يستقيم الإيمانُ إلا بالقول، ولا يستقيم الإيمانُ والقولُ إلا بالعمل، ولا يستقيم الإيمانُ والقولُ والعملُ إلا بنيّةٍ موافقةٍ للسنة»."], [896.0, "انتهى كلامه رحمه الله."]], "tr": [[846.0, "İmam Şâfiî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [848.8, "\"Sahâbe, tâbiûn ve onlardan sonra gelip yetiştiğimiz kimselerin icmâı şudur:"], [852.0, "İman söz, amel ve niyettir;"], [854.7, "üçünden biri diğerinin yerini tutmaz.\" İmam Lâlekâî, İmam Buhârî'den şu sözünü rivayet etti:"], [863.0, "\"Şehirlerde âlimlerden binden fazla adamla karşılaştım;"], [867.0, "hiçbirinin imanın söz ve amel olduğunda, artıp eksildiğinde ihtilaf ettiğini görmedim.\" İmam Evzâî —Allah ona rahmet etsin— şöyle dedi:"], [880.0, "\"İman ancak sözle doğru olur;"], [882.5, "iman ve söz ancak amelle doğru olur;"], [885.5, "iman, söz ve amel ancak sünnete uygun bir niyetle doğru olur.\" Sözü burada bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[898.0, "ونختم ـ إن شاء الله ـ بقول الإمام ابن تيميّة رحمه الله تعالى،"]], "tr": [[898.0, "İnşallah İmam İbn Teymiyye'nin —Allah Teâlâ ona rahmet etsin— sözüyle bitiriyoruz."]]}]}, {"ts": "15:02", "title": "1. Külliye (sonuç): İbn Teymiyye'nin nakli ve külliyenin özeti", "paras": [{"reader": false, "ar": [[902.0, "قال: «أمّا سائر الفقهاء من أهل الرأي والآثار بالحجاز والعراق والشام ومصر ـ منهم: مالك بن أنس، والليث بن سعد، وسفيان الثوريّ، والأوزاعيّ، والشافعيّ، وأحمد بن حنبل، وإسحاق بن راهويه، وأبو عُبيدٍ القاسم بن سلّام، وداود بن عليّ، والطبريّ، ومن سلك سبيلهم ـ فقالوا: الإيمان قولٌ وعمل: قولٌ باللسان وهو الإقرار، واعتقادٌ بالقلب، وعملٌ بالجوارح، مع الإخلاص بالنيّة الصادقة». والله أعلى وأعلم."]], "tr": [[902.0, "Dedi ki: \"Hicaz, Irak, Şam ve Mısır'daki re'y ve âsâr ehli fakihlerin geri kalanına —ki aralarında Mâlik b."], [918.3, "Enes, Leys b. Sa'd, Süfyân es-Sevrî, Evzâî, Şâfiî, Ahmed b."], [927.7, "Hanbel, İshâk b. Râhûye, Ebû Ubeyd el-Kâsım b."], [935.2, "Sellâm, Dâvûd b. Ali, Taberî ve onların yolunu tutanlar vardır— gelince, onlar şöyle demişlerdir:"], [935.8, "İman söz ve ameldir: dille söz —ki bu ikrardır—, kalple itikad ve azalarla amel;"], [936.4, "sâdık bir niyetle ihlâs ile birlikte.\" Allah en yüce ve en iyi bilendir."]]}, {"reader": false, "ar": [[937.0, "والخلاصة من هذه الكلّيّة هي أنّنا نؤمن إيمانًا جازمًا بأنّ الإيمان لا تقوم حقيقتُه شرعًا إلا إذا كان مبنيًّا على اعتقاد الجَنان،"], [948.9, "ونطق اللسان، وعمل الجوارح والأركان،"], [951.7, "على ما قرّره أهلُ السنة بإجماعهم. والله أعلم."]], "tr": [[937.0, "Bu külliyenin özeti şudur: Kesin bir imanla inanıyoruz ki imanın hakikati şer'an ancak kalbin itikadı, dilin söylemesi ve azaların ve organların ameli üzerine bina edildiğinde ayakta durur;"], [950.6, "Ehl-i Sünnet'in icmâlarıyla tespit ettiği üzere. Allah en iyisini bilir."]]}]}, {"ts": "15:56", "title": "2. Külliye: İmanı mutlak bilgi (ma'rifet) sayan herkes Cehmî ve kâfirdir", "paras": [{"reader": false, "ar": [[956.0, "الكلّيّة الثانية: <b>كلُّ من جعل الإيمانَ مطلقَ المعرفة فجهميٌّ كافر.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [965.1, "الجهميّة هم أتباع الجهم بن صفوان ـ عليه من الله ما يستحقّ ـ،"], [997.0, "وهم الذين يُنكرون أسماءَ الله عز وجل كلَّها وصفاتِه كلَّها،"], [1002.0, "نعوذ بالله من ذلك."], [1004.0, "ومذهبُهم أنّ الإيمان مطلقُ معرفة الربّ بالقلب؛"], [1010.0, "فكلُّ من عرف الله ولو مطلقَ المعرفة ـ يعني ولو واحدًا في المئة ـ فهو مؤمنٌ كاملُ الإيمان عند الجهم."]], "tr": [[956.0, "<b>2. külliye: İmanı mutlak bilgi (Allah'ı en alt düzeyde tanımak) sayan herkes Cehmî'dir, kâfirdir.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [965.1, "Cehmiyye, Cehm b. Safvân'ın —Allah'tan ona hak ettiği neyse o olsun— takipçileridir."], [997.5, "Onlar Allah Azze ve Celle'nin isimlerinin hepsini ve sıfatlarının hepsini inkâr edenlerdir;"], [1004.0, "bundan Allah'a sığınırız. Onların mezhebi, imanın Rabbi kalple mutlak olarak tanımak olduğudur."], [1012.2, "Allah'ı mutlak bir tanımayla —yani yüzde bir bile olsa— tanıyan herkes, Cehm'e göre imanı kâmil bir mümindir."]]}, {"reader": false, "ar": [[1022.0, "والكفرُ عند جهمٍ هو الجهلُ بالربّ؛"], [1029.0, "فمن كان عارفًا بالله ولو بمطلق المعرفة فهو مؤمنٌ كاملُ الإيمان عند جهم،"], [1036.0, "ومن جهل الله عز وجل الجهلَ المطلق فهو كافرٌ عند الجهميّة."], [1045.0, "فمن عرف الله عز وجل ولو بمعرفةٍ واحدة فإنه مؤمنٌ كاملُ الإيمان،"], [1056.0, "ولو فعل جميعَ المنكرات وجميعَ الموبقات،"], [1061.0, "بل وكلَّ أنواع الردّة ـ نعوذ بالله من ذلك ـ لا يُخرجونه من الإيمان مطلقًا."]], "tr": [[1022.0, "Cehm'e göre küfür, Rabbi bilmemektir."], [1029.0, "Kim Allah'ı mutlak bir tanımayla bile tanıyorsa Cehm'e göre imanı kâmil bir mümindir;"], [1035.5, "kim de Allah Azze ve Celle'yi mutlak olarak bilmiyorsa Cehmiyye'ye göre kâfirdir."], [1045.0, "Allah Azze ve Celle'yi tek bir bilgiyle bile tanıyan kimse, imanı kâmil bir mümindir;"], [1056.0, "bütün münkerleri ve bütün helak edici günahları, hatta irtidadın her türünü —bundan Allah'a sığınırız— işlese bile onu asla imandan çıkarmazlar."]]}, {"reader": false, "ar": [[1067.0, "فقالوا: من عرف ربَّه بقلبه فهو مؤمن،"], [1072.0, "ولو لم ينطق بلسانه،"], [1075.0, "ولو لم يقل: أشهد أن لا إله إلا الله وأشهد أنّ محمدًا رسول الله،"], [1082.0, "ولو لم يعمل شيئًا:"], [1084.0, "لا صلاةً ولا زكاةً ولا صومًا ولا حجًّا؛"], [1088.5, "يكفي المعرفةُ في الشهادة له بالإيمان،"], [1094.0, "ولو لم يُقِرَّ أصالةً بنبوّة رسول الله صلى الله عليه وسلم،"], [1099.0, "ولو لم يفهم شيئًا من القرآن."]], "tr": [[1067.0, "Dediler ki: Rabbini kalbiyle tanıyan mümindir;"], [1069.9, "diliyle söylemese de, \"Allah'tan başka ilâh olmadığına şahitlik ederim ve Muhammed'in Allah'ın Resûlü olduğuna şahitlik ederim\" demese de, hiçbir amel işlemese de —ne namaz, ne zekât, ne oruç, ne hac—;"], [1084.0, "onun iman ettiğine şahitlik etmek için tanımak yeterlidir;"], [1088.5, "Resûlullah sallallâhu aleyhi ve sellem'in nübüvvetini aslen ikrar etmese de, Kur'an'dan hiçbir şey anlamasa da."]]}, {"reader": false, "ar": [[1102.0, "وقد أجمع علماءُ الإسلام على أنّ هذا المذهب أخبثُ مذهبٍ نُقل في الإيمان،"], [1112.0, "وحكم كثيرٌ من أهل السنة والجماعة على أنّ معتقِدَه كافرٌ خالعٌ رِبقةَ الإسلام من عنقه بالكلّيّة."], [1123.0, "قال الإمام وكيعٌ رحمه الله تعالى:"], [1126.5, "«أهل السنة يقولون: الإيمان قولٌ وعمل، والمرجئة يقولون: إنّ الإيمان قولٌ بلا عمل، والجهميّة يقولون: إنّ الإيمان المعرفة». انتهى كلامه."]], "tr": [[1102.0, "İslâm âlimleri, bu mezhebin iman hakkında nakledilmiş en habis mezhep olduğunda icmâ etmişlerdir."], [1112.0, "Ehl-i Sünnet ve'l-Cemaat'ten birçoğu, buna inananın kâfir olduğuna, İslâm bağını boynundan tamamen çıkarmış olduğuna hükmetmiştir."], [1123.0, "İmam Vekî' —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1126.5, "\"Ehl-i Sünnet 'İman söz ve ameldir' der;"], [1130.7, "Mürcie 'İman amelsiz sözdür' der;"], [1134.5, "Cehmiyye 'İman ma'rifettir (tanımaktır)' der.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1142.3, "وقال الفُضيل بن عِياضٍ رحمه الله تعالى:"], [1146.7, "«إنّ أهل الإرجاء يقولون: إنّ الإيمان قولٌ بلا عمل، ويقول الجهميّة: الإيمانُ المعرفة بلا قولٍ ولا عمل، ويقول أهل السنة: الإيمانُ المعرفة والقول والعمل»."], [1161.7, "انتهى كلامه. وقال أبو الحسن الأشعريّ رحمه الله تعالى:"], [1167.0, "«الذي تفرّد به جهمٌ أنّ الإيمان هو المعرفة بالله فقط». انتهى كلامه."]], "tr": [[1142.3, "Fudayl b. Iyâz —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1146.7, "\"İrca ehli 'İman amelsiz sözdür' der;"], [1149.8, "Cehmiyye 'İman sözsüz ve amelsiz ma'rifettir' der;"], [1154.2, "Ehl-i Sünnet ise 'İman ma'rifet, söz ve ameldir' der.\" Sözü burada bitti."], [1161.7, "Ebü'l-Hasen el-Eş'arî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1167.0, "\"Cehm'in tek başına kaldığı görüş, imanın sadece Allah'ı tanımak olduğudur.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1176.0, "وقال الإمام القاضي العِمرانيّ رحمه الله:"], [1178.0, "«قالت الجهميّة: الإيمانُ التصديقُ بالقلب لا غير»."], [1184.0, "وقال الإمام البغداديّ رحمه الله:"], [1187.0, "«زعمت الجهميّة أنّ الإيمان هو المعرفة وحدها»."], [1191.0, "وقال ابن تيميّة رحمه الله:"], [1193.0, "«أمّا الجهميّة فيجعلونه تصديقَ القلب، فلا تكون الشهادتان ولا الصلاة ولا الزكاة ولا غيرُهنّ من الإيمان»."]], "tr": [[1176.0, "İmam Kâdî el-İmrânî —Allah ona rahmet etsin— şöyle dedi:"], [1178.0, "\"Cehmiyye 'İman yalnızca kalple tasdiktir, başka bir şey değil' dedi.\" İmam Bağdâdî —Allah ona rahmet etsin— şöyle dedi:"], [1187.0, "\"Cehmiyye, imanın yalnızca ma'rifet olduğunu iddia etti.\" İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [1193.0, "\"Cehmiyye'ye gelince, onlar imanı kalbin tasdiki sayarlar;"], [1197.1, "dolayısıyla iki şehadet, namaz, zekât ve diğerleri imandan olmaz.\""]]}]}, {"ts": "20:02", "title": "2. Külliye (devam): Cehmiyye'nin iman tanımının bâtıl lâzımları", "paras": [{"reader": false, "ar": [[1201.7, "وأمّا أهلُ العلم فقد ردّوا عليهم بردودٍ عظيمةٍ جدًّا،"], [1212.0, "يجمعها بيانُ تلك اللوازم الفاسدة من كلام الجهميّة في تعريف الإيمان."], [1219.0, "فهذا القول أظهرُ فسادًا من كلّ قولٍ قيل في الإيمان؛"], [1223.0, "فإنّ لازمه أنّ فرعونَ وقومَه كانوا مؤمنين كاملي الإيمان،"], [1230.0, "فإنهم عرفوا صدقَ موسى وهارون عليهما الصلاة والسلام ولم يؤمنوا بهما؛"], [1238.0, "ولهذا قال موسى لفرعون:"], [1240.0, "<span class=\"ayah\">﴿لَقَدْ عَلِمْتَ مَا أَنزَلَ هَٰؤُلَاءِ إِلَّا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ بَصَائِرَ﴾<\/span> <span class=\"ref\">[الإسراء: ١٠٢]<\/span>،"], [1245.0, "وقال تعالى: <span class=\"ayah\">﴿وَجَحَدُوا بِهَا وَاسْتَيْقَنَتْهَا أَنفُسُهُمْ ظُلْمًا وَعُلُوًّا ۚ فَانظُرْ كَيْفَ كَانَ عَاقِبَةُ الْمُفْسِدِينَ﴾<\/span> <span class=\"ref\">[النمل: ١٤]<\/span>."]], "tr": [[1201.7, "İlim ehline gelince, onlar Cehmiyye'ye çok büyük reddiyelerle cevap verdiler;"], [1207.1, "bunları bir araya getiren şey, Cehmiyye'nin iman tanımındaki sözlerinden doğan o fâsid lâzımları açıklamaktır."], [1219.0, "Bu söz, iman hakkında söylenmiş her sözden daha açık bir şekilde fâsiddir."], [1223.0, "Çünkü bunun lâzımı, Firavun ve kavminin imanı kâmil müminler olmasıdır;"], [1227.3, "zira onlar Mûsâ ve Hârûn'un —ikisine salât ve selâm olsun— doğruluğunu bildiler ama onlara iman etmediler."], [1235.1, "Bu yüzden Mûsâ Firavun'a şöyle dedi:"], [1238.0, "<span class=\"ayah\">﴿Bunları, birer ibret ve delil olarak ancak göklerin ve yerin Rabbinin indirdiğini sen de çok iyi biliyorsun﴾<\/span> [İsrâ 102]."], [1244.0, "Allah Teâlâ da şöyle buyurdu:"], [1246.2, "<span class=\"ayah\">﴿Kalpleri onlara kesin olarak inandığı hâlde, zulüm ve büyüklenme yüzünden onları inkâr ettiler. Bak, bozguncuların sonu nasıl oldu!﴾<\/span> [Neml 14]."]]}, {"reader": false, "ar": [[1253.0, "ومذهبٌ هذا لازمُه، بحيث يُدخِل أكثرَ الكافرين إلى وصف أعلى درجات الإيمان والمؤمنين،"], [1264.0, "فهذا ـ والله ـ مذهبٌ باطل."], [1268.0, "بل ومن لوازمه أيضًا أنّ أهل الكتاب من اليهود والنصارى كلَّهم مؤمنون كاملو الإيمان؛"], [1275.0, "فإنهم يعرفون النبيَّ صلى الله عليه وسلم كما يعرفون أبناءهم."], [1282.0, "بل ومن لوازمه أيضًا أنّ أبا طالبٍ مؤمنٌ كاملُ الإيمان عند جهم؛"], [1289.0, "فإنه كان يعرف النبيَّ صلى الله عليه وسلم،"], [1292.8, "ويعرف اللهَ، ويعرف نبوّةَ نبيّه صلى الله عليه وسلم،"], [1297.0, "ومع ذلك لم ينطق بالشهادتين،"], [1299.5, "حتى نُقل عنه أنه قال:"], [1302.0, "«ولقد علمتُ بأنّ دينَ محمّدٍ ... من خير أديان البريّة دينا / لولا الملامةُ أو حِذارُ مَسبّةٍ ... لوجدتَني سمحًا بذاك مُبينا» <span class=\"q\">؟ 21:47<\/span>"]], "tr": [[1253.0, "Lâzımı bu olan, kâfirlerin çoğunu imanın ve müminlerin en yüksek derecelerinin vasfına sokan bir mezhep —vallahi— bâtıl bir mezheptir."], [1268.0, "Hatta bunun lâzımlarından biri de Yahudi ve Hristiyanlardan Ehl-i Kitab'ın hepsinin imanı kâmil müminler olmasıdır;"], [1275.0, "çünkü onlar Peygamber sallallâhu aleyhi ve sellem'i kendi oğullarını tanıdıkları gibi tanırlar."], [1282.0, "Hatta lâzımlarından biri de Ebû Tâlib'in Cehm'e göre imanı kâmil bir mümin olmasıdır;"], [1289.0, "çünkü o Peygamber sallallâhu aleyhi ve sellem'i tanıyordu, Allah'ı tanıyordu, Peygamberinin sallallâhu aleyhi ve sellem nübüvvetini biliyordu;"], [1296.5, "buna rağmen iki şehadeti dile getirmedi."], [1299.5, "Hatta ondan şöyle dediği nakledilmiştir:"], [1302.0, "\"Andolsun bildim ki Muhammed'in dini, insanlığın dinlerinin en hayırlılarındandır."], [1305.0, "Kınanma ya da sövülme korkusu olmasaydı, beni bu konuda cömert ve açıkça ilan eden biri olarak bulurdun.\" <span class=\"q\">؟<\/span>"]]}, {"reader": false, "ar": [[1312.0, "بل وأعظمُ من ذلك أنه يلزم على مذهب الجهميّة أنّ إبليسَ ـ لعنه الله ـ مؤمنٌ كاملُ الإيمان؛"], [1320.0, "فإنّ إبليس لم يكفر كفرَ جهلٍ بربّه،"], [1325.0, "وإنما كفر كفرَ عنادٍ واستكبارٍ وإباء،"], [1329.0, "وإلا فهو عارفٌ بالله عز وجل؛"], [1333.0, "ولذلك دعاه لأنه يعلم أنه المدعوّ."], [1336.0, "قال الله عز وجل عنه:"], [1339.0, "<span class=\"ayah\">﴿قَالَ رَبِّ فَأَنظِرْنِي إِلَىٰ يَوْمِ يُبْعَثُونَ﴾<\/span> <span class=\"ref\">[الحجر: ٣٦]<\/span>،"], [1341.0, "فأقرّ بأنه ربُّه، <span class=\"ayah\">﴿قَالَ فَبِعِزَّتِكَ لَأُغْوِيَنَّهُمْ أَجْمَعِينَ﴾<\/span> <span class=\"ref\">[ص: ٨٢]<\/span>،"], [1346.0, "فأقسم بعزّة الله، وقال:"], [1348.8, "<span class=\"ayah\">﴿رَبِّ بِمَا أَغْوَيْتَنِي﴾<\/span> <span class=\"ref\">[الحجر: ٣٩]<\/span>، فأثبت له الربوبيّة."]], "tr": [[1312.0, "Hatta bundan daha büyüğü, Cehmiyye mezhebine göre İblis'in —Allah ona lanet etsin— imanı kâmil bir mümin olmasının gerekmesidir."], [1316.6, "Çünkü İblis Rabbini bilmemekten kaynaklanan bir küfürle kâfir olmadı;"], [1320.0, "o ancak inat, büyüklenme ve diretme küfrüyle kâfir oldu."], [1324.3, "Yoksa o Allah Azze ve Celle'yi tanıyandır;"], [1326.6, "bu yüzden O'na dua etti, çünkü kendisine dua edilenin O olduğunu biliyordu."], [1333.0, "Allah Azze ve Celle onun hakkında şöyle buyurdu:"], [1336.0, "<span class=\"ayah\">﴿Dedi ki: Rabbim! Öyleyse bana (insanların) diriltilecekleri güne kadar mühlet ver﴾<\/span> [Hicr 36];"], [1339.0, "böylece O'nun kendi Rabbi olduğunu ikrar etti."], [1340.7, "<span class=\"ayah\">﴿Dedi ki: Senin izzetine andolsun ki onların hepsini azdıracağım﴾<\/span> [Sâd 82];"], [1346.0, "böylece Allah'ın izzetine yemin etti."], [1348.8, "Ve şöyle dedi: <span class=\"ayah\">﴿Rabbim! Beni azdırmana karşılık…﴾<\/span> [Hicr 39];"], [1351.0, "böylece O'na rubûbiyyeti isbat etti."]]}, {"reader": false, "ar": [[1352.0, "بل كلُّ كافرٍ في الدنيا،"], [1357.0, "بل كلُّ كافرٍ في الدنيا على مذهب جهمٍ مؤمنٌ كاملُ الإيمان؛"], [1362.0, "فإنّ الله عز وجل ذكر في كتابه أنّ الكفّار مُقِرّون بتوحيد الربوبيّة إجمالًا،"], [1370.0, "كما قال الله عز وجل:"], [1372.1, "<span class=\"ayah\">﴿وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ لَيَقُولُنَّ اللَّهُ﴾<\/span> <span class=\"ref\">[لقمان: ٢٥]<\/span>."], [1377.0, "فإذًا كلُّ كافرٍ فلا بدّ أن يكون في قلبه ولو مطلقُ المعرفة بالله عز وجل،"], [1384.0, "وإن كان يجحد بها ظاهرًا؛"], [1387.0, "لكن إن كان في قلبه من الإيمان ما يُخفيه ويكتمه ولا يريد إظهاره،"], [1393.0, "فإنه كفيلٌ بأن يجعله في دائرة المؤمنين عند جهم."]], "tr": [[1352.0, "Hatta dünyadaki her kâfir —evet, dünyadaki her kâfir— Cehm'in mezhebine göre imanı kâmil bir mümindir."], [1362.0, "Çünkü Allah Azze ve Celle Kitabı'nda kâfirlerin icmâlen rubûbiyyet tevhidini ikrar ettiklerini zikretmiştir;"], [1368.1, "nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1372.1, "<span class=\"ayah\">﴿Andolsun, onlara gökleri ve yeri kimin yarattığını sorsan, elbette \"Allah\" derler﴾<\/span> [Lokmân 25]."], [1377.0, "O hâlde her kâfirin kalbinde, zahiren inkâr etse bile, Allah Azze ve Celle'yi mutlak düzeyde de olsa tanıma mutlaka vardır."], [1387.0, "Fakat kalbinde gizlediği, sakladığı ve açığa vurmak istemediği bir iman varsa, bu, Cehm'e göre onu müminler dairesine sokmaya yeterlidir."]]}, {"reader": false, "ar": [[1398.0, "وهذا المذهب كفرٌ؛ كفرٌ لأنه يتضمّن تعطيلَ الشرع كلِّه."], [1406.0, "ولذلك قال العلماء بأنّ الجهميّة كفروا لعدّة أمور:"], [1416.0, "منها نفيُهم الأسماءَ والصفاتِ عن الله عز وجل،"], [1421.0, "ومنها جعلُهم الإيمانَ مطلقَ المعرفة،"], [1424.0, "ولكفرهم أيضًا أسبابٌ أخرى ليس هذا مجالَ تفصيلها."], [1430.0, "فهذا المذهب في الحقيقة أنه مذهبٌ مناقضٌ للكتاب والسنة ولأصول الشريعة ولإجماع السلف،"], [1438.0, "وهو أفسدُ ما قيل في تعريف الإيمان. والله أعلم."]], "tr": [[1398.0, "Bu mezhep küfürdür; küfürdür, çünkü şeriatın tamamını ta'til etmeyi içerir."], [1406.0, "Bu yüzden âlimler Cehmiyye'nin birkaç sebeple kâfir olduğunu söylemişlerdir:"], [1416.0, "Bunlardan biri isim ve sıfatları Allah Azze ve Celle'den nefyetmeleri, biri de imanı mutlak ma'rifet saymalarıdır."], [1423.4, "Küfürlerinin başka sebepleri de vardır;"], [1426.2, "burası onları tafsil etme yeri değildir."], [1430.0, "Hakikatte bu mezhep Kitap'a, Sünnet'e, şeriatın usûlüne ve selefin icmâına aykırı bir mezheptir;"], [1437.4, "iman tanımında söylenmiş en fâsid sözdür. Allah en iyisini bilir."]]}]}, {"ts": "24:02", "title": "3. Külliye: Şer'î amellerin cinsini terk eden herkes mümin değildir", "paras": [{"reader": false, "ar": [[1442.0, "ومن الكلّيّات أيضًا: <b>كلُّ من ترك جنسَ الأعمال الشرعيّة فليس بمؤمن.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ من ترك جنسَ الأعمال الشرعيّة فليس بمؤمن.<\/b> أقول وبالله التوفيق:"], [1461.9, "اعلم ـ رحمك الله تعالى ـ أنّ أهل السنة متّفقون على أنّ الأعمال ركنٌ في الإيمان،"], [1471.0, "ولكن لا يقصد أهلُ السنة كلَّ عملٍ بخصوصه،"], [1476.4, "وإنما يقصدون به جنسَ الأعمال."], [1480.0, "وبناءً على ذلك، فكلُّ من نطق بالشهادتين وكان عنده جنسُ العمل الشرعيّ فإنه مؤمن."]], "tr": [[1442.0, "Külliyelerden biri de şudur: 3."], [1444.1, "külliye: Şer'î amellerin cinsini terk eden herkes mümin değildir. (Tekrar ediyor.) Şer'î amellerin cinsini terk eden herkes mümin değildir. Tevfik Allah'tandır, derim ki:"], [1461.9, "Bil ki —Allah Teâlâ sana rahmet etsin— Ehl-i Sünnet amellerin imanda bir rükün olduğunda ittifak etmiştir."], [1472.4, "Fakat Ehl-i Sünnet bununla her bir ameli tek tek kastetmez;"], [1480.0, "bununla amellerin cinsini kastederler. Buna göre iki şehadeti dile getiren ve kendisinde şer'î amel cinsi bulunan herkes mümindir."]]}, {"reader": false, "ar": [[1491.0, "وأمّا من نطق بالشهادتين ولم يعمل شيئًا ـ بمعنى أنه لم يُصلِّ،"], [1497.5, "ولم يُزكِّ، ولم يحُجّ،"], [1499.8, "ولم يعتمر، ولم يأتمر بشيءٍ من المأمورات الشرعيّة مطلقًا،"], [1504.2, "ولم ينتهِ عن المنهيّات الشرعيّة مطلقًا ـ فإنه يُعتبر كافرًا عند أهل السنة والجماعة."], [1511.0, "فأهلُ السنة والجماعة يجعلون الركنَ جنسَ العمل،"], [1518.0, "وهذا بخلاف المرجئة الذين لا يجعلون جنسَ الأعمال ركنًا في الإيمان."]], "tr": [[1491.0, "İki şehadeti dile getirip hiçbir amel işlemeyen —yani namaz kılmayan, zekât vermeyen, hacca gitmeyen, umre yapmayan, şer'î emirlerden hiçbirini asla yerine getirmeyen ve şer'î yasaklardan asla kaçınmayan— kimseye gelince, o Ehl-i Sünnet ve'l-Cemaat'e göre kâfir sayılır."], [1511.0, "Ehl-i Sünnet ve'l-Cemaat rüknü amel cinsi sayar."], [1518.5, "Bu, amellerin cinsini imanda rükün saymayan Mürcie'nin aksinedir."]]}, {"reader": false, "ar": [[1524.0, "وأضرب لكم مثالين حتى يتّضح الكلام."], [1528.0, "المثال الأوّل: هناك رجلٌ نطق بالشهادتين،"], [1534.0, "وصلّى وصام، ولكن ترك كثيرًا من المأمورات،"], [1540.0, "وفعل كثيرًا من المحظورات؛"], [1541.0, "فهل هو مؤمنٌ عند أهل السنة والجماعة؟"], [1545.0, "الجواب: نعم؛ لأنّ عنده جنسَ العمل،"], [1549.0, "وجنسُ الأعمال ركنٌ في الإيمان،"], [1552.0, "وأمّا آحادُها فليست ركنًا،"], [1553.7, "كما سيأتينا في كلّيّةٍ خاصّةٍ إن شاء الله."]], "tr": [[1524.0, "Söz açıklığa kavuşsun diye size iki örnek vereyim."], [1528.0, "Birinci örnek: İki şehadeti dile getirmiş, namaz kılmış, oruç tutmuş, fakat emredilenlerin birçoğunu terk etmiş, yasaklananların birçoğunu işlemiş bir adam var."], [1541.0, "Bu kimse Ehl-i Sünnet ve'l-Cemaat'e göre mümin midir?"], [1545.0, "Cevap: Evet; çünkü onda amel cinsi vardır ve amellerin cinsi imanda bir rükündür."], [1551.4, "Amellerin tek tek fertlerine gelince, onlar rükün değildir;"], [1554.5, "inşallah özel bir külliyede bize geleceği gibi."]]}, {"reader": false, "ar": [[1557.0, "المثال الثاني: ما رأيُكم في رجلٍ اكتفى من الإسلام كلِّه بالنطق بالشهادتين،"], [1564.6, "ثم لم يعمل شيئًا من المأمورات الشرعيّة؟"], [1569.0, "فهذا عند أهل السنة والجماعة ليس بمؤمن."], [1573.6, "لماذا؟ لأنه انهدم عنده ركنٌ من أركان الإيمان،"], [1579.4, "وهو عملُ الجوارح. فإذًا لا بدّ أن نُفرّق بين تخلُّف جنس العمل وبين تخلُّف آحاد العمل؛"], [1593.0, "فالذي يُعتبر كفرًا عند أهل السنة والجماعة هو أن يتخلّف جنسُ العمل."]], "tr": [[1557.0, "İkinci örnek: İslâm'ın tamamından yalnızca iki şehadeti dile getirmekle yetinip sonra şer'î emirlerden hiçbirini yapmayan bir adam hakkında ne dersiniz?"], [1569.0, "Bu kimse Ehl-i Sünnet ve'l-Cemaat'e göre mümin değildir."], [1573.6, "Neden? Çünkü onda imanın rükünlerinden biri —azaların ameli— yıkılmıştır."], [1582.0, "O hâlde amel cinsinin bulunmaması ile amelin tek tek fertlerinin bulunmaması arasında mutlaka ayrım yapmalıyız."], [1594.4, "Ehl-i Sünnet ve'l-Cemaat'e göre küfür sayılan şey, amel cinsinin bulunmamasıdır."]]}, {"reader": false, "ar": [[1601.0, "وبهذا نكون قد خالفنا المرجئةَ الذين لا يجعلون جنسَ الأعمال ركنًا في الإيمان؛"], [1608.0, "فمتى ما نطق الإنسانُ عندهم بالشهادتين ولم يفعل مأمورًا أو لم يترك محظورًا،"], [1615.0, "فإنه عندهم مؤمنٌ كامل،"], [1618.0, "كاملُ الإيمان. ولذلك ستأتينا كلّيّةٌ:"], [1622.0, "أنّ كلَّ من أخرج العملَ عن دائرة الإيمان فإنه من المرجئة،"], [1630.0, "كما عليه مقالةُ الجهميّة والأشاعرة والماتريديّة وغيرهم."]], "tr": [[1601.0, "Böylece amellerin cinsini imanda rükün saymayan Mürcie'ye muhalefet etmiş oluruz."], [1606.0, "Onlara göre insan iki şehadeti dile getirdiğinde, hiçbir emri yapmasa veya hiçbir yasağı terk etmese de, onlara göre kâmil bir mümindir, imanı kâmildir."], [1620.0, "Bu yüzden bize şu külliye gelecek:"], [1622.0, "Ameli iman dairesinin dışına çıkaran herkes Mürcie'dendir;"], [1627.4, "Cehmiyye'nin, Eş'arîlerin, Mâtürîdîlerin ve diğerlerinin görüşü olduğu gibi."]]}, {"reader": false, "ar": [[1637.0, "قال الإمام الشافعيّ رحمه الله:"], [1639.0, "«وكان الإجماعُ من الصحابة والتابعين ومن بعدهم ومن أدركناهم يقولون: الإيمانُ قولٌ وعملٌ ونيّة» ـ انتبه ـ «لا يُجزئ واحدٌ من الثلاثة إلا بالآخر»."]], "tr": [[1637.0, "İmam Şâfiî —Allah ona rahmet etsin— şöyle dedi:"], [1639.0, "\"Sahâbe, tâbiûn, onlardan sonrakiler ve yetiştiğimiz kimselerin icmâı şuydu;"], [1643.0, "derlerdi ki: İman söz, amel ve niyettir\" —dikkat et!— \"üçünden biri ancak diğeriyle birlikte yeterli olur.\""]]}, {"reader": false, "ar": [[1654.0, "وقال الإمام الآجُرّيّ رحمه الله تعالى:"], [1658.0, "«اعلموا ـ رحمنا الله وإيّاكم ـ أنّ الذي عليه علماءُ المسلمين أنّ الإيمان واجبٌ على جميع الخلق، وهو تصديقٌ بالقلب، وإقرارٌ باللسان، وعملٌ بالجوارح. ثم اعلموا أنه لا تُجزئ المعرفةُ بالقلب والتصديقُ إلا أن يكون معه الإيمانُ باللسان نطقًا، ولا تُجزئ معرفةٌ بالقلب ونطقٌ باللسان حتى يكون عملٌ بالجوارح؛ فإذا كملت فيه هذه الثلاثُ الخصال كان مؤمنًا. دلّ على ذلك الكتابُ والسنةُ وقولُ علماء المسلمين»."]], "tr": [[1654.0, "İmam Âcurrî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1658.9, "\"Bilin ki —Allah bize ve size rahmet etsin— Müslüman âlimlerin üzerinde olduğu görüş şudur:"], [1664.5, "İman bütün yaratılmışlara vaciptir; o, kalple tasdik, dille ikrar ve azalarla ameldir."], [1672.9, "Sonra bilin ki kalple tanıma ve tasdik, beraberinde dille söyleyerek iman olmadıkça yeterli olmaz;"], [1681.2, "kalple tanıma ve dille söyleme de azalarla amel olmadıkça yeterli olmaz."], [1688.4, "Bu üç haslet kişide tamamlandığında mümin olur."], [1691.1, "Buna Kitap, Sünnet ve Müslüman âlimlerin sözü delâlet etmiştir.\""]]}, {"reader": false, "ar": [[1695.0, "وقال الإمام الآجُرّيّ أيضًا رحمه الله:"], [1698.6, "«لا يصحّ الدينُ إلا بالتصديق بالقلب، والإقرار باللسان، والعمل بالجوارح، مثل الصلاة والزكاة والصيام والحجّ والجهاد وما أشبه ذلك»."], [1710.0, "وقال شيخ الإسلام ابن تيميّة رحمه الله تعالى:"], [1714.5, "«ومن الممتنع» ـ انتبهوا ـ «ومن الممتنع أن يكون الرجلُ مؤمنًا إيمانًا ثابتًا في قلبه بأنّ الله فرض عليه الصلاة والزكاة والصيام والحجّ، ويعيش دهرَه لا يسجد لله سجدةً، ولا يصوم رمضان، ولا يؤدّي لله زكاةً، ولا يحجّ إلى بيته؛ فهذا ممتنع، ولا يصدر هذا إلا مع نفاقٍ في القلب وزندقة، لا مع إيمانٍ صحيح»."]], "tr": [[1695.0, "İmam Âcurrî —Allah ona rahmet etsin— yine şöyle dedi:"], [1698.6, "\"Din ancak kalple tasdik, dille ikrar ve namaz, zekât, oruç, hac, cihad ve benzerleri gibi azalarla amel ile sahih olur.\" Şeyhülislâm İbn Teymiyye —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1714.5, "\"İmkânsızdır ki\" —dikkat edin!— \"imkânsızdır ki bir adam, Allah'ın kendisine namazı, zekâtı, orucu ve haccı farz kıldığına kalbinde sabit bir imanla iman eden bir mümin olsun da ömrü boyunca Allah'a bir secde etmeden, Ramazan orucunu tutmadan, Allah için zekât vermeden ve O'nun Evi'ni haccetmeden yaşasın."], [1738.5, "Bu imkânsızdır; bu ancak kalpteki bir nifak ve zındıklıkla birlikte ortaya çıkar, sahih bir imanla değil.\""]]}, {"reader": false, "ar": [[1746.0, "فالعلماء من أهل السنة يَنفون مسمّى الإيمان عمّن ترك جنسَ العمل."], [1753.0, "وقال الإمام محمد بن عبد الوهّاب رحمه الله تعالى:"], [1756.0, "«لا خلاف بين الأمّة أنّ التوحيد لا بدّ أن يكون بالقلب الذي هو العلم، واللسان الذي هو القول، والعمل الذي هو تنفيذ الأوامر والنواهي؛ فإن أخلّ بشيءٍ من هذا لم يكن الرجل مسلمًا. فإن أقرّ بالتوحيد ولم يعمل به فهو كافرٌ معاندٌ كفرعون وإبليس، وإن عمل بالتوحيد ظاهرًا وهو لا يعتقده باطنًا فهو منافقٌ خالصًا، أشرُّ من الكافرين». انتهى كلامه."]], "tr": [[1746.0, "Ehl-i Sünnet âlimleri amel cinsini terk edenden iman adlandırmasını nefyederler."], [1748.9, "İmam Muhammed b. Abdülvehhâb —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [1753.0, "\"Ümmet arasında şu konuda ihtilaf yoktur:"], [1753.7, "Tevhid mutlaka ilim olan kalple, söz olan dille ve emir ve yasakları yerine getirmek olan amelle olmalıdır."], [1756.0, "Bunlardan birinde eksiklik yaparsa adam Müslüman olmaz."], [1759.9, "Tevhidi ikrar edip onunla amel etmezse, Firavun ve İblis gibi inatçı bir kâfirdir."], [1773.4, "Tevhidle zahiren amel edip bâtınen ona inanmazsa, halis bir münafıktır, kâfirlerden daha şerlidir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1789.0, "وقال أيضًا رحمه الله:"], [1791.0, "«اعلم ـ رحمك الله تعالى ـ أنّ دين الله يكون على القلب بالاعتقاد، وبالحبّ وبالبغض، ويكون على اللسان بالنطق وترك النطق بكلمة الكفر، ويكون على الجوارح بفعل أركان الإسلام وترك الأفعال التي تُكفِّر؛ فإذا اختلّت واحدةٌ من هذه الثلاث كفر وارتدّ»."]], "tr": [[1789.0, "Yine —Allah ona rahmet etsin— şöyle dedi:"], [1789.5, "\"Bil ki —Allah Teâlâ sana rahmet etsin— Allah'ın dini kalpte itikad, sevgi ve buğz ile;"], [1791.0, "dilde söylemek ve küfür kelimesini söylememekle;"], [1795.9, "azalarda İslâm'ın rükünlerini yapmak ve küfre düşüren fiilleri terk etmekle olur."], [1805.0, "Bu üçünden biri bozulursa kişi kâfir ve mürted olur.\""]]}]}, {"ts": "30:13", "title": "3. Külliye (devam): Üç rüknün birbirini gerektirmesi ve özet", "paras": [{"reader": false, "ar": [[1813.0, "فإذا تخلّف اعتقادُ الجَنان كفر وارتدّ،"], [1817.0, "وإذا وُجد اعتقادُ الجَنان وتخلّف النطقُ باللسان ـ مع كمال القدرة ـ كفر وارتدّ،"], [1825.0, "وإذا وُجد الأمران وتخلّف جنسُ العمل كفر وارتدّ."], [1832.0, "والخلاصةُ من ذلك: أنّ من ظنّ أنه يقوم بالقلب إيمانٌ صحيحٌ دون ما يقتضيه من عمل الجوارح ـ مع العلم به والقدرة على أدائه ـ فقد تصوّر أمرًا ممتنعًا غيرَ موجودٍ في الواقع،"], [1848.1, "ونفى التلازمَ بين الظاهر والباطن،"], [1851.0, "وقال بقول المرجئة المذموم. والله أعلم."]], "tr": [[1813.0, "Kalbin itikadı bulunmazsa kişi kâfir ve mürted olur."], [1817.0, "Kalbin itikadı bulunur da —tam kudreti olduğu hâlde— dille söyleme bulunmazsa kâfir ve mürted olur."], [1824.3, "Bu ikisi bulunur da amel cinsi bulunmazsa kâfir ve mürted olur."], [1832.0, "Bunun özeti şudur: Kim kalpte, bildiği ve yapmaya gücü yettiği hâlde azaların amelinden gerektirdiği şey olmaksızın sahih bir imanın bulunabileceğini zannederse, imkânsız ve gerçekte var olmayan bir şey tasavvur etmiş, zahir ile bâtın arasındaki karşılıklı gerekliliği (telâzümü) nefyetmiş ve Mürcie'nin kınanmış sözünü söylemiş olur. Allah en iyisini bilir."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
