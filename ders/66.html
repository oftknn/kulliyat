<script>
const D={"no": 66, "vid": "91RT9eoUwNA", "title_ar": "الدرس (٦٦) من شرح كليات العقيدة — كليات النفي والإثبات وتفسير الصفة بلازمها والإضافة", "title_tr": "Şerhu Külliyyâti'l-Akîde — 66. Ders: Sıfatlar Babı (Nefy ve İsbat, Hem Kemal Hem Noksan Olan Sıfatlar, Sıfatı Lâzımıyla Tefsir, Muttasıl ve Munfasıl İzafet; Zıll ve Rahmet Meseleleri)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Allah'ın kendisinden nefyettiği her şey, O'nun zıddının kemaliyle vasıflı olmasındandır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.7, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.5, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [9.1, "أمّا بعد: فلا نزال في سياق شرح كلّيّات باب الصفات عند أهل السنّة والجماعة،"], [15.1, "وعندنا في هذا الدرس جُمَلٌ من الكلّيّات."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.7, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.0, "Bundan sonra: Hâlâ Ehl-i Sünnet ve'l-Cemaat nezdinde sıfatlar babının külliyelerinin şerhi bağlamındayız."], [15.1, "Bu derste elimizde birtakım külliyeler var."]]}, {"reader": false, "ar": [[18.1, "الكلّيّة الأولى: <b>كلُّ ما نفاه الله عن نفسه فلأنّه متّصفٌ بكمال ضدِّه.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[18.1, "<b>1. külliye: Allah'ın kendisinden nefyettiği her şey, O'nun o şeyin zıddının kemaliyle vasıflı olmasındandır.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[27.0, "أقول وبالله التوفيق: وذلك لأنّ المتقرِّر في الكلّيّة التي ستأتي بعد هذه الكلّيّة أنّ النفيَ المحضَ الذي لا يتضمّن ثبوتًا ليس بمدحٍ ولا كمال؛"], [51.0, "فلا يُمدَح الله عز وجل بالنفي المحض المجرّد عن تضمّن الإثبات."], [60.0, "فلو أنّك جئتَ إلى إنسانٍ لا يستطيع أن يظلم أحدًا،"], [65.0, "فقلتَ: إنّك إنسانٌ لا يُظلَم أحدٌ عنده،"], [69.0, "وأنت لا تقصد لكمال عدلِك،"], [71.2, "وإنما لعجزِك عن الظلم،"], [73.0, "فلا يُعتبر نفيُك للظلم عنه من باب التمدّح والكمال له."], [80.0, "فلا يدخل النفيُ في حيّز المدح إلا إذا تضمّن ثبوتَ كمال الضدّ."]], "tr": [[27.0, "Tevfik Allah'tandır, derim ki: Bu böyledir, çünkü bu külliyeden sonra gelecek külliyede yerleşik olan şudur:"], [47.4, "Hiçbir isbat (sübût) içermeyen salt nefy, ne övgüdür ne kemaldir."], [51.0, "Allah Azze ve Celle, isbat içermekten soyutlanmış salt nefy ile övülmez."], [60.0, "Meselâ hiç kimseye zulmetmeye gücü yetmeyen bir insana gelip \"Sen yanında kimseye zulmedilmeyen bir insansın\" desen ve bununla \"adaletinin kemalinden dolayı\" demeyi değil, \"zulme gücün yetmediğinden dolayı\" demeyi kastetsen, onun hakkında zulmü nefyetmen, onu övme ve ona kemal nispet etme kabilinden sayılmaz."], [80.0, "Nefy, ancak zıddın kemalinin sübûtunu içerirse övgü alanına girer."]]}, {"reader": false, "ar": [[87.0, "كما نفى الله عز وجل عن نفسه الظلمَ في قوله:"], [91.0, "<span class=\"ayah\">﴿وَلَا يَظْلِمُ رَبُّكَ أَحَدًا﴾<\/span> <span class=\"ref\">[الكهف: ٤٩]<\/span>،"], [93.3, "أي: لكمال عدله. وكما نفى عنه السِّنةَ والنومَ في قوله:"], [98.5, "<span class=\"ayah\">﴿لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>،"], [101.0, "أي: لكمال حياته وقيّوميّته؛"], [103.0, "فلأنّه ذو الحياة الكاملة وذو القيّوميّة الكاملة فإنّه لا تأخذه سِنةٌ ولا نوم."], [112.0, "وكما نفى عن نفسه العجزَ والإعياءَ والضعفَ في قوله عز وجل:"], [117.9, "<span class=\"ayah\">﴿وَمَا مَسَّنَا مِن لُّغُوبٍ﴾<\/span> <span class=\"ref\">[ق: ٣٨]<\/span>،"], [120.3, "لكمال قدرته عز وجل."], [123.0, "وكما نفى عن نفسه الصاحبةَ والولدَ في قوله عز وجل:"], [128.1, "<span class=\"ayah\">﴿مَا اتَّخَذَ صَاحِبَةً وَلَا وَلَدًا﴾<\/span> <span class=\"ref\">[الجن: ٣]<\/span>،"], [130.0, "وذلك لكمال أحديّته وصمديّته وغناه عن كلّ أحد."], [136.0, "ولذلك قال الله عز وجل:"], [140.0, "<span class=\"ayah\">﴿قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ﴾<\/span> <span class=\"ref\">[الإخلاص: ١–٢]<\/span>،"], [144.0, "ثم فرّع على كمال أحديّته وصمديّته قولَه:"], [148.0, "<span class=\"ayah\">﴿لَمْ يَلِدْ وَلَمْ يُولَدْ﴾<\/span> <span class=\"ref\">[الإخلاص: ٣]<\/span>."], [150.0, "وكذلك أيضًا لمّا نفى عن نفسه الوِلادةَ والولدَ في قوله:"], [157.4, "<span class=\"ayah\">﴿لَمْ يَلِدْ وَلَمْ يُولَدْ﴾<\/span>،"], [159.0, "وذلك لكمال حياته وقيّوميّته وصمديّته وأحديّته،"], [164.0, "وغناه عز وجل عن كلّ أحد."]], "tr": [[87.0, "Nitekim Allah Azze ve Celle <span class=\"ayah\">﴿Rabbin hiç kimseye zulmetmez﴾<\/span> [Kehf 49] sözünde kendisinden zulmü nefyetmiştir;"], [93.9, "yani adaletinin kemalinden dolayı. <span class=\"ayah\">﴿O'nu ne bir uyuklama tutar ne de uyku﴾<\/span> [Bakara 255] sözünde kendisinden uyuklamayı ve uykuyu nefyetmiştir;"], [101.5, "yani hayatının ve kayyûmiyyetinin kemalinden dolayı."], [103.0, "O, kâmil hayat sahibi ve kâmil kayyûmiyyet sahibi olduğu için O'nu ne uyuklama tutar ne uyku."], [112.0, "<span class=\"ayah\">﴿Bize hiçbir yorgunluk dokunmadı﴾<\/span> [Kâf 38] sözünde kendisinden acizliği, bitkinliği ve zayıflığı nefyetmiştir;"], [117.9, "Azze ve Celle'nin kudretinin kemalinden dolayı."], [123.0, "<span class=\"ayah\">﴿O ne bir eş edinmiştir ne de bir çocuk﴾<\/span> [Cin 3] sözünde kendisinden eşi ve çocuğu nefyetmiştir;"], [129.6, "bu da O'nun ehadiyyetinin, samediyyetinin ve herkesten müstağni oluşunun kemalindendir."], [136.0, "Bu sebeple Allah Azze ve Celle <span class=\"ayah\">﴿De ki: O Allah birdir. Allah Samed'dir﴾<\/span> [İhlâs 1–2] buyurmuş, sonra ehadiyyetinin ve samediyyetinin kemali üzerine <span class=\"ayah\">﴿Doğurmamış ve doğurulmamıştır﴾<\/span> [İhlâs 3] sözünü bina etmiştir."], [150.0, "Yine <span class=\"ayah\">﴿Doğurmamış ve doğurulmamıştır﴾<\/span> sözünde kendisinden doğurmayı ve çocuğu nefyetmesi de böyledir;"], [157.4, "bu da O'nun hayatının, kayyûmiyyetinin, samediyyetinin, ehadiyyetinin ve Azze ve Celle'nin herkesten müstağni oluşunun kemalindendir."]]}, {"reader": false, "ar": [[166.0, "وكما نفى عن نفسه النسيانَ في قوله:"], [170.0, "<span class=\"ayah\">﴿وَمَا كَانَ رَبُّكَ نَسِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٤]<\/span>،"], [172.0, "والنسيانُ المنفيُّ هنا بمعنى الغفلة والذهول عن الشيء،"], [176.0, "وذلك لكمال علمه وكمال إحاطته بكلّ شيء؛"], [181.0, "فهو الأوّل الذي ليس قبله شيء،"], [183.6, "والآخِر الذي ليس بعده شيء،"], [185.7, "والظاهر الذي ليس فوقه شيء،"], [187.9, "والباطن الذي ليس دونه شيء،"], [190.0, "وهو العليم الخبير الذي لا يعزُب عنه مثقالُ ذرّةٍ في السماوات ولا في الأرض."], [196.0, "وكما نفى عن نفسه الموتَ في قوله:"], [199.5, "<span class=\"ayah\">﴿وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ﴾<\/span> <span class=\"ref\">[الفرقان: ٥٨]<\/span>،"], [202.5, "وذلك لكمال حياته عز وجل."], [205.0, "وأيضًا في قول الله عز وجل:"], [209.0, "<span class=\"ayah\">﴿وَمَا كَانَ اللَّهُ لِيُعْجِزَهُ مِن شَيْءٍ فِي السَّمَاوَاتِ وَلَا فِي الْأَرْضِ﴾<\/span> <span class=\"ref\">[فاطر: ٤٤]<\/span>،"], [215.0, "وذلك لكمال قوّته وقدرته تبارك وتعالى."]], "tr": [[166.0, "Yine <span class=\"ayah\">﴿Rabbin unutkan değildir﴾<\/span> [Meryem 64] sözünde kendisinden unutmayı nefyetmiştir."], [167.7, "Burada nefyedilen unutma, bir şeyden gaflet etme ve habersiz kalma (zühûl) anlamındadır;"], [170.0, "bu da O'nun ilminin kemalinden ve her şeyi kuşatmasının kemalindendir."], [174.0, "O, kendisinden önce hiçbir şey olmayan Evvel'dir;"], [177.4, "kendisinden sonra hiçbir şey olmayan Âhir'dir;"], [181.0, "üstünde hiçbir şey olmayan Zâhir'dir;"], [184.0, "berisinde hiçbir şey olmayan Bâtın'dır."], [187.0, "O, göklerde ve yerde zerre ağırlığınca bir şeyin kendisinden gizli kalmadığı Alîm ve Habîr'dir."], [196.0, "<span class=\"ayah\">﴿Ölmeyen, diri olana tevekkül et﴾<\/span> [Furkân 58] sözünde kendisinden ölümü nefyetmiştir;"], [201.5, "bu da Azze ve Celle'nin hayatının kemalindendir."], [205.0, "Yine Allah Azze ve Celle'nin <span class=\"ayah\">﴿Göklerde ve yerde hiçbir şey Allah'ı aciz bırakamaz﴾<\/span> [Fâtır 44] sözü de böyledir;"], [213.9, "bu da Tebâreke ve Teâlâ'nın kuvvetinin ve kudretinin kemalindendir."]]}, {"reader": false, "ar": [[218.0, "وكذلك أيضًا نفى عن نفسه المِثلَ في قوله:"], [223.2, "<span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>، وفي قوله:"], [225.6, "<span class=\"ayah\">﴿وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ﴾<\/span> <span class=\"ref\">[الإخلاص: ٤]<\/span>،"], [227.0, "وفي قوله: <span class=\"ayah\">﴿فَلَا تَضْرِبُوا لِلَّهِ الْأَمْثَالَ﴾<\/span> <span class=\"ref\">[النحل: ٧٤]<\/span>،"], [230.0, "وكلُّ ذلك لكماله في ذاته وصفاته عن مشابهة مخلوقاته."], [235.0, "وكذلك نفى عن نفسه الأكلَ والشربَ في قوله:"], [239.7, "<span class=\"ayah\">﴿وَهُوَ يُطْعِمُ وَلَا يُطْعَمُ﴾<\/span> <span class=\"ref\">[الأنعام: ١٤]<\/span>،"], [242.4, "وذلك لكمال صمديّته؛ فإنّ الصمد ـ فإنّ من معاني الصمد عند السلف ـ أي:"], [250.1, "الذي لا جوفَ له،"], [251.8, "فلا يحتاج إلى أكلٍ ولا إلى شرب."], [255.0, "ولذلك استدلّ الله عز وجل على بطلان دعوى إلهيّة ابن مريم وأمّه عليهما السلام بقوله:"], [265.9, "<span class=\"ayah\">﴿كَانَا يَأْكُلَانِ الطَّعَامَ﴾<\/span> <span class=\"ref\">[المائدة: ٧٥]<\/span>. وكذلك أيضًا نفى عن نفسه العجزَ والإعياءَ في قوله:"], [279.0, "<span class=\"ayah\">﴿وَلَا يَئُودُهُ حِفْظُهُمَا﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>، أي: لكمال قوّته وقدرته."]], "tr": [[218.0, "Yine <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur﴾<\/span> [Şûrâ 11] sözünde, <span class=\"ayah\">﴿Hiçbir şey O'nun dengi değildir﴾<\/span> [İhlâs 4] sözünde ve <span class=\"ayah\">﴿Allah'a misaller getirmeyin﴾<\/span> [Nahl 74] sözünde kendisinden benzeri nefyetmiştir."], [228.0, "Bütün bunlar, O'nun zâtında ve sıfatlarında mahlûkatına benzemekten uzak oluşunun kemalindendir."], [232.8, "Yine <span class=\"ayah\">﴿O, doyurur ama doyurulmaz﴾<\/span> [En'âm 14] sözünde kendisinden yemeyi ve içmeyi nefyetmiştir;"], [239.7, "bu da samediyyetinin kemalindendir. Çünkü Samed —selef nezdinde Samed'in manalarından biri— içi boş olmayan (cevfi bulunmayan) demektir;"], [250.1, "dolayısıyla ne yemeye ne de içmeye muhtaçtır."], [252.3, "Bu sebeple Allah Azze ve Celle, Meryem oğlunun ve annesinin —ikisine de selâm olsun— ilah olduğu iddiasının bâtıllığına <span class=\"ayah\">﴿İkisi de yemek yerlerdi﴾<\/span> [Mâide 75] sözüyle delil getirmiştir."], [265.9, "Yine <span class=\"ayah\">﴿Onları (gökleri ve yeri) korumak O'na ağır gelmez﴾<\/span> [Bakara 255] sözünde kendisinden acizliği ve bitkinliği nefyetmiştir;"], [279.0, "yani kuvvetinin ve kudretinin kemalinden dolayı."]]}, {"reader": false, "ar": [[284.0, "وهكذا في كلّ نفيٍ يقابلك في أدلّة الوحيين،"], [290.0, "فإنّ الواجب عليك فيه أمران:"], [293.0, "الأمر الأوّل: أن تنفي ما نفاه الله عز وجل عن نفسه،"], [297.0, "والأمر الثاني: أن تُثبت لله عز وجل كمالَ ضدّ الصفة المنفيّة."]], "tr": [[284.0, "İki vahyin (Kitap ve Sünnet'in) delillerinde karşına çıkan her nefyde durum böyledir."], [293.0, "Onda sana vâcip olan iki şey vardır:"], [295.2, "Birincisi, Allah Azze ve Celle'nin kendisinden nefyettiğini nefyetmen;"], [298.0, "ikincisi, nefyedilen sıfatın zıddının kemalini Allah Azze ve Celle için isbat etmendir."]]}]}, {"ts": "05:03", "title": "2. Külliye: İsbat içermeyen hiçbir nefy ile Allah vasıflandırılamaz", "paras": [{"reader": false, "ar": [[303.0, "ويوضّح ذلك الكلّيّةُ التي بعدها:"], [307.0, "<b>كلُّ نفيٍ لا يتضمّن إثباتًا فلا يجوز وصفُ الله به.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[303.0, "Bunu, ondan sonraki külliye açıklar:"], [306.2, "<b>2. külliye: İsbat içermeyen hiçbir nefy ile Allah'ı vasıflandırmak caiz değildir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[328.0, "قال الإمام ابن تيميّة رحمه الله تعالى:"], [332.9, "«وينبغي أن يُعلم أنّ النفي ليس فيه مدحٌ ولا كمال إلا إذا تضمّن إثباتًا، وإلا فمجرّدُ النفي ليس فيه مدحٌ ولا كمال؛ لأنّ النفيَ المحضَ عدمٌ محض، والعدمُ المحضُ ليس بشيء، وما ليس بشيءٍ فهو كما قيل: ليس بشيء، فضلًا عن أن يكون مدحًا أو كمالًا. ولأنّ النفي المحض يوصف به المعدومُ والممتنع؛ فتقول: إنّ الجدار لا يُبصر ولا يسمع ولا يظلم، وكلُّ ذلك ليس لصلاحيّة الجدار للاتّصاف بنقيض ذلك، وإنما لعدم قابليّته للاتّصاف بشيءٍ من ذلك»."]], "tr": [[328.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [333.6, "\"Bilinmelidir ki nefyde, isbat içermedikçe ne övgü vardır ne kemal."], [341.4, "Aksi hâlde salt nefyde ne övgü vardır ne kemal."], [346.0, "Çünkü salt nefy, salt yokluktur;"], [348.2, "salt yokluk ise bir şey değildir."], [352.2, "Bir şey olmayan da denildiği gibi 'bir şey değildir';"], [357.0, "övgü veya kemal olması şöyle dursun!"], [361.3, "Bir de salt nefy ile yok olan ve imkânsız olan (mümteni') vasıflandırılır."], [368.1, "Meselâ 'Duvar görmez, işitmez, zulmetmez' dersin."], [373.0, "Bütün bunlar, duvarın bunların zıddıyla vasıflanmaya elverişli olmasından değil, bunlardan herhangi biriyle vasıflanmaya kabiliyetinin olmamasındandır.\""]]}, {"reader": false, "ar": [[385.0, "ثم قال ابن تيميّة رحمه الله تعالى:"], [390.0, "«ولأنّ النفي المحض يوصف به المعدومُ والممتنع، والمعدومُ والممتنعُ لا يوصف بمدحٍ ولا كمال. فلهذا كان عامّةُ ما وصف الله به نفسَه من النفي متضمِّنًا لإثبات مدح، كقوله: <span class=\"ayah\">﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span> إلى قوله: <span class=\"ayah\">﴿وَلَا يَئُودُهُ حِفْظُهُمَا﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>؛ فنفيُ السِّنة والنوم يتضمّن كمالَ الحياة والقيام، فهو مبيِّنٌ لكمال أنّه الحيّ القيّوم. وكذلك قوله: <span class=\"ayah\">﴿وَلَا يَئُودُهُ حِفْظُهُمَا﴾<\/span> أي: لا يَكرِثُه ولا يُثقله، وذلك مستلزمٌ لكمال قدرته وتمامها، بخلاف المخلوق القادر إذا كان يقدر على الشيء بنوعِ كُلفةٍ ومشقّة، فإنّ هذا نقصٌ في قدرته وعيبٌ في قوّته». انتهى كلامُه."]], "tr": [[385.0, "Sonra İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [389.3, "\"Bir de salt nefy ile yok olan ve imkânsız olan vasıflandırılır;"], [395.0, "yok olan ve imkânsız olan ise ne övgüyle ne de kemalle vasıflandırılır."], [400.1, "Bu sebeple Allah'ın kendisini nefy ile vasıflandırdığı şeylerin geneli bir övgünün isbatını içerir."], [404.9, "Meselâ <span class=\"ayah\">﴿Allah, O'ndan başka ilah yoktur; Hayy'dır, Kayyûm'dur. O'nu ne uyuklama tutar ne uyku﴾<\/span> [Bakara 255] sözünden <span class=\"ayah\">﴿Onları korumak O'na ağır gelmez﴾<\/span> [Bakara 255] sözüne kadar."], [413.6, "Uyuklamanın ve uykunun nefyi, hayatın ve (her şeyi) ayakta tutmanın kemalini içerir;"], [418.1, "O'nun Hayy ve Kayyûm oluşunun kemalini açıklar."], [421.8, "Yine <span class=\"ayah\">﴿Onları korumak O'na ağır gelmez﴾<\/span> sözü, yani O'nu yormaz, O'na ağırlık vermez demektir."], [429.6, "Bu da O'nun kudretinin kemalini ve tamlığını gerektirir."], [432.8, "Kudret sahibi mahlûk ise böyle değildir;"], [436.2, "o bir şeye bir tür zahmet ve meşakkatle güç yetirirse, bu onun kudretinde bir noksanlık ve kuvvetinde bir kusurdur.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[446.0, "ويؤكّد ذلك تلميذُه الإمام العلّامة ابن القيّم رحمه الله تعالى في قوله:"], [454.0, "«النفيُ المحض إن لم يتضمّن ثبوتًا فإنّ النفي كاسمه عدمٌ لا كمالَ فيه ولا مدح، فإذا تضمّن ثبوتًا صحّ المدحُ به: كنفي النسيان المستلزم لكمال العلم، ونفي اللُّغوب والإعياء والتعب المستلزم لكمال القوّة والقدرة، ونفي السِّنة والنوم المستلزم لكمال الحياة والقيّوميّة، ونفي الولد والصاحبة المستلزم لكمال الغنى والملك والربوبيّة، ونفي الوليّ والشريك والشفيع بدون الإذن المستلزم لكمال التوحيد والتفرّد بالكمال والإلهيّة والملك، ونفي الظلم المتضمّن لكمال العدل، ونفي إدراك الأبصار له <span class=\"ayah\">﴿لَا تُدْرِكُهُ الْأَبْصَارُ﴾<\/span> <span class=\"ref\">[الأنعام: ١٠٣]<\/span> المتضمّن لعظمته وأنّه أجلُّ من أن يُدرَك وإن رأته الأبصار، وإلا فليس في كونه لا يُرى مدحٌ بوجهٍ من الوجوه، فإنّ العدم المحض كذلك»،"], [520.0, "أي: ليس فيه مدحٌ ولا ثناء."]], "tr": [[446.0, "Bunu öğrencisi İmam Allâme İbnü'l-Kayyim —Allah ona rahmet etsin— de şu sözüyle te'kid eder:"], [453.3, "\"Salt nefy, bir sübût içermezse, nefy adı gibi yokluktur;"], [457.7, "onda ne kemal vardır ne övgü."], [460.4, "Bir sübût içerirse onunla övmek sahih olur:"], [464.1, "İlmin kemalini gerektiren unutmanın nefyi;"], [466.8, "kuvvetin ve kudretin kemalini gerektiren yorgunluğun, bitkinliğin ve usanmanın nefyi;"], [472.9, "hayatın ve kayyûmiyyetin kemalini gerektiren uyuklamanın ve uykunun nefyi;"], [480.0, "zenginliğin (gınâ), mülkün ve rubûbiyyetin kemalini gerektiren çocuğun ve eşin nefyi;"], [487.4, "tevhidin kemalini, kemalde, ilahlıkta ve mülkte tek oluşu gerektiren velînin, ortağın ve izinsiz şefaatçinin nefyi;"], [496.5, "adaletin kemalini içeren zulmün nefyi;"], [499.2, "<span class=\"ayah\">﴿Gözler O'nu idrak edemez﴾<\/span> [En'âm 103] (sözündeki) gözlerin O'nu idrak etmesinin nefyi gibi."], [505.4, "Bu sonuncusu O'nun azametini ve —gözler O'nu görse bile— idrak edilmekten yüce olduğunu içerir."], [513.7, "Aksi hâlde O'nun görülmemesinde hiçbir yönden övgü yoktur;"], [517.1, "zira salt yokluk da böyledir.\" Yani onda ne övgü vardır ne senâ."]]}, {"reader": false, "ar": [[527.0, "ويؤكّد ذلك أيضًا العلّامة ابن أبي العزّ الحنفيّ رحمه الله تعالى بقوله:"], [534.0, "«ومعلومٌ أنّ المدح إنما يكون بالصفات الثبوتيّة، وأمّا العدمُ المحض فليس بكمال فلا يُمدَح به، وإنما يُمدَح الربُّ تعالى بالنفي إذا تضمّن أمرًا وجوديًّا»."], [550.0, "انتهى كلامُه رحمه الله."], [552.0, "وأنا تركتُ المجالَ في شرح هذه القاعدة لهؤلاء العلماء،"], [557.0, "لأنّ كلامهم أعظمُ من كلام أحدنا،"], [561.0, "وإيصالَهم للمعلومة أكمل. والله أعلم."]], "tr": [[527.0, "Bunu Allâme İbn Ebi'l-İzz el-Hanefî —Allah ona rahmet etsin— de şu sözüyle te'kid eder:"], [534.0, "\"Bilinmektedir ki övgü ancak sübûtî sıfatlarla olur."], [536.9, "Salt yokluk ise kemal değildir;"], [538.7, "onunla övülmez. Rab Teâlâ nefy ile ancak o nefy vücûdî bir şey içerdiğinde övülür.\" —Sözü burada bitti, Allah ona rahmet etsin."], [550.0, "Bu kaidenin şerhinde meydanı bu âlimlere bıraktım;"], [553.7, "çünkü onların sözü bizden birinin sözünden daha büyüktür ve bilgiyi ulaştırmaları daha kâmildir. Allah en iyisini bilir."]]}]}, {"ts": "09:27", "title": "3. Külliye: Allah'ın kendisi için isbat ettiği her kemal, zıddı olan noksanlıkların nefyini içerir", "paras": [{"reader": false, "ar": [[567.0, "القاعدة الكلّيّة الثالثة: <b>كلُّ كمالٍ أثبته الله لنفسه فيتضمّن نفيَ ضدّه من النقائص.<\/b> <span class=\"note\">(يكررها)<\/span> واضحٌ هذا؟"], [593.0, "أقول وبالله التوفيق: وهي عكسُ القاعدة ـ وهي عكسُ الكلّيّة التي مضى شرحُها."]], "tr": [[567.0, "<b>3. külliye: Allah'ın kendisi için isbat ettiği her kemal, zıddı olan noksanlıkların nefyini içerir.<\/b> (Tekrar ediyor.) Bu açık mı?"], [593.0, "Tevfik Allah'tandır, derim ki: Bu, şerhi geçen kaidenin —şerhi geçen külliyenin— tersidir."]]}, {"reader": false, "ar": [[601.0, "فكما أنّ أهل السنّة يطلبون منك في الصفات المنفيّة أمرين:"], [606.0, "أن تنفي الصفةَ المنفيّة،"], [607.8, "وأن تُثبت لله عز وجل كمالَ ضدّها،"], [611.0, "فكذلك أيضًا أهلُ السنّة يطلبون منك وجوبًا في الصفات المثبَتة أمرين:"], [617.0, "أن تُثبت الصفةَ التي أثبتها الله عز وجل لنفسه،"], [622.0, "وأن تنفي النقصَ الذي يتضمّنه ضدُّها."], [631.0, "قال شيخ الإسلام ابن تيميّة رحمه الله تعالى:"], [635.0, "«لا بدّ للعبد أن يُثبت لله ما يجب إثباتُه له من صفات الكمال، وينفي عنه ما يجب نفيُه عنه ممّا يضادّ هذه الحال». انتهى كلامُه."]], "tr": [[601.0, "Ehl-i Sünnet nefyedilen sıfatlarda senden iki şey istediği gibi —nefyedilen sıfatı nefyetmen ve Allah Azze ve Celle için onun zıddının kemalini isbat etmen—, aynı şekilde Ehl-i Sünnet isbat edilen sıfatlarda da senden vücûben iki şey ister:"], [617.0, "Allah Azze ve Celle'nin kendisi için isbat ettiği sıfatı isbat etmen ve onun zıddının içerdiği noksanlığı nefyetmen."], [631.0, "Şeyhülislâm İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [635.0, "\"Kulun, kemal sıfatlarından Allah için isbatı vâcip olanı isbat etmesi ve bu hâle zıt olup O'ndan nefyedilmesi vâcip olanı da O'ndan nefyetmesi gerekir.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[651.0, "فإثباتُ العلوّ لله عز وجل يتضمّن نفيَ السُّفل،"], [656.0, "وإثباتُ الحياة لله عز وجل يتضمّن نفيَ الموت،"], [660.0, "وإثباتُ القدرة لله عز وجل يتضمّن نفيَ العجز،"], [664.0, "وإثباتُ السمع لله عز وجل يتضمّن نفيَ الصَّمَم،"], [668.0, "وإثباتُ الكلام لله عز وجل يتضمّن نفيَ الخَرَس،"], [673.0, "وإثباتُ البصر لله عز وجل يتضمّن نفيَ العمى،"], [680.0, "وهكذا في سائر صفات الكمال."], [685.0, "فكما أنّنا نطلب في النفي إثباتَ الضدّ،"], [688.7, "فكذلك نحن أيضًا نطلب في الإثبات نفيَ الضدّ. والله أعلم."]], "tr": [[651.0, "Allah Azze ve Celle için uluvvü (yücelik) isbat etmek, aşağılığın (süfl) nefyini içerir."], [657.0, "Allah Azze ve Celle için hayatı isbat etmek ölümün nefyini içerir."], [661.5, "Allah Azze ve Celle için kudreti isbat etmek acizliğin nefyini içerir."], [666.0, "Allah Azze ve Celle için işitmeyi isbat etmek sağırlığın nefyini içerir."], [671.1, "Allah Azze ve Celle için kelâmı isbat etmek dilsizliğin nefyini içerir."], [676.6, "Allah Azze ve Celle için görmeyi isbat etmek körlüğün nefyini içerir."], [685.5, "Diğer kemal sıfatlarında da böyledir."], [687.7, "Nefyde zıddın isbatını istediğimiz gibi, isbatta da zıddın nefyini isteriz. Allah en iyisini bilir."]]}]}, {"ts": "11:36", "title": "4. Külliye: Bir itibarla kemal, bir itibarla noksan olan her sıfat", "paras": [{"reader": false, "ar": [[696.0, "الكلّيّة الرابعة: كلُّ كمالٍ ـ كلُّ صفةٍ هي كمالٌ باعتبارٍ ونقصٌ باعتبار،"], [717.0, "فنُثبتها لله حالَ كمالها،"], [721.0, "وننفيها عن الله حالَ نقصها. <span class=\"note\">(يكررها)<\/span> أُعيدها ولّا واضح؟ ماشي."]], "tr": [[696.0, "<b>4. külliye:<\/b> Her kemal… <b>Bir itibarla kemal, bir itibarla noksan olan her sıfatı, kemal hâlinde Allah için isbat eder, noksan hâlinde Allah'tan nefyederiz.<\/b> (Tekrar ediyor.) Tekrar edeyim mi, yoksa açık mı? Peki."]]}, {"reader": false, "ar": [[744.0, "أقول وبالله التوفيق: اعلم ـ رحمنا الله وإيّاك ـ أنّ الصفات باعتبار إثباتها ونفيها عن الله عز وجل لا تخرج عن ثلاثة أقسام:"], [753.0, "الأوّل: صفاتٌ هي كمالٌ من كلّ وجه،"], [758.5, "فحيثما جئتَها من ها هنا أو ها هنا وجدتَها كمالًا،"], [763.0, "كالحياة والعلوّ والسمع والبصر والقوّة والقدرة والعلم."], [769.0, "فهذه يجب عليك أن تُثبتها لله عز وجل متفاديًا في إثباتها المحاذيرَ الخمسة:"], [776.0, "محذورَ التحريف، والتكييف، والتعطيل،"], [779.1, "والتمثيل، والإلحاد. وكلّيّتُنا هذه لا شأن لها بهذا القسم الأوّل."]], "tr": [[744.0, "Tevfik Allah'tandır, derim ki: Bil ki —Allah bize ve sana rahmet etsin— sıfatlar, Allah Azze ve Celle için isbat ve nefy edilmeleri bakımından üç kısımdan dışarı çıkmaz."], [753.0, "Birincisi: Her yönden kemal olan sıfatlar."], [757.5, "Onlara şuradan da gelsen buradan da gelsen kemal bulursun;"], [761.0, "hayat, uluvv, işitme, görme, kuvvet, kudret ve ilim gibi."], [769.0, "Bunları, isbatlarında beş sakıncadan —tahrif, tekyîf, ta'til, temsil ve ilhad sakıncasından— sakınarak Allah Azze ve Celle için isbat etmen vâciptir."], [785.0, "Bu külliyemizin bu birinci kısımla bir ilgisi yoktur."]]}, {"reader": false, "ar": [[789.0, "الثاني: صفاتٌ هي نقصٌ من كلّ وجه،"], [796.0, "فحيثما جئتَها من ها هنا أو ها هنا وجدتَها نقصًا،"], [800.0, "فيجب عليك فيها أمران:"], [802.0, "أن تنفيها عن الله عز وجل،"], [805.0, "وأن تُثبت لله عز وجل كمالَ ضدّها،"], [807.5, "كما بيّنّاه فيما مضى؛"], [809.0, "كالموت والغدر والظلم والخيانة والعجز."], [817.0, "فحيثما أتيتَ هذه الصفات فإنّها لا تكون إلا نقصًا."], [822.0, "وكلّيّتُنا لا شأن لها بهذا القسم الثاني."]], "tr": [[789.0, "İkincisi: Her yönden noksan olan sıfatlar."], [793.5, "Onlara şuradan da gelsen buradan da gelsen noksanlık bulursun."], [799.2, "Bunlarda sana iki şey vâciptir:"], [802.0, "Onları Allah Azze ve Celle'den nefyetmen ve —daha önce açıkladığımız gibi— Allah Azze ve Celle için zıtlarının kemalini isbat etmen."], [809.0, "Ölüm, hıyanetle ahdi bozma (gadr), zulüm, hainlik ve acizlik gibi."], [818.7, "Bu sıfatlara nereden gelsen, onlar ancak noksanlıktır."], [822.0, "Külliyemizin bu ikinci kısımla bir ilgisi yoktur."]]}, {"reader": false, "ar": [[826.0, "الثالث: صفاتٌ إن جئتَها من ها هنا وجدتَها كمالًا،"], [833.0, "وإن جئتَها من ها هنا وجدتَها نقصًا."], [836.0, "وكلّيّتُنا في هذا القسم."], [841.0, "فهل نُثبت هذا النوع من الصفات لله عز وجل مطلقًا؟"], [846.0, "الجواب: لا يجوز إثباتُها لله على وجه الإطلاق،"], [852.0, "لأنّ في بعض جوانبها نقصًا،"], [854.0, "والله عز وجل منزّهٌ عن النقص."], [857.0, "فإن قلت: وهل أنفيها عن الله عز وجل مطلقًا لِما فيها من النقص؟"], [863.0, "فأقول: لا يجوز نفيُها عن الله مطلقًا،"], [867.0, "لأنّ فيها جانبَ كمالٍ لائقٍ بالله عز وجل."], [870.0, "فإن قلت: وكيف العمل فيها؟"], [874.0, "فأقول: هو ما تنصّ عليه هذه الكلّيّة تمامًا،"], [878.0, "وهي أنّنا نُثبتها لله عز وجل حالَ كونها كمالًا،"], [882.0, "وننفيها عن الله عز وجل حالَ كونها نقصًا."], [885.0, "فيُعتبر هذا النوعُ من الصفات من الألفاظ المجمَلة التي يتوقّف إثباتُها أو نفيُها على الاستفصال،"], [899.0, "حتى يتميّز حقُّها من باطلها،"], [901.8, "فيُقبَل الحقّ ويُرَدّ الباطل،"]], "tr": [[826.0, "Üçüncüsü: Şuradan gelirsen kemal, buradan gelirsen noksan bulduğun sıfatlar."], [836.0, "Külliyemiz bu kısımdadır. Peki, bu tür sıfatları Allah Azze ve Celle için mutlak olarak isbat eder miyiz?"], [846.0, "Cevap: Onları Allah için mutlak olarak isbat etmek caiz değildir;"], [852.0, "çünkü bazı yönlerinde noksanlık vardır, Allah Azze ve Celle ise noksanlıktan münezzehtir."], [857.0, "Eğer \"İçlerindeki noksanlıktan dolayı onları Allah Azze ve Celle'den mutlak olarak nefyedeyim mi?\" dersen, derim ki:"], [863.0, "Onları Allah'tan mutlak olarak nefyetmek caiz değildir;"], [865.9, "çünkü onlarda Allah Azze ve Celle'ye lâyık bir kemal yönü vardır."], [870.0, "Eğer \"Peki, bunlarda nasıl amel edilir?\" dersen, derim ki:"], [874.0, "Tam olarak bu külliyenin ifade ettiği gibi:"], [877.0, "Onları kemal oldukları hâlde Allah Azze ve Celle için isbat eder, noksan oldukları hâlde Allah Azze ve Celle'den nefyederiz."], [885.0, "Bu tür sıfatlar, isbatı veya nefyi istifsâle (ayrıntısını sorup ayırmaya) bağlı olan mücmel lafızlardan sayılır;"], [895.7, "ta ki hakkı bâtılından ayrılsın, hak kabul edilsin ve bâtıl reddedilsin."]]}]}, {"ts": "15:04", "title": "4. Külliye (devam): Fer'ler — mekr, keyd, istihzâ ve suhriyye sıfatları", "paras": [{"reader": false, "ar": [[904.0, "كما سيأتينا في قاعدة المجمَلات إن شاء الله تعالى."], [910.0, "وعلى ذلك فروع: الأوّل:"], [911.7, "صفةُ المكر؛ فإنّ المكر ليس من قبيل القسم الأوّل حتى نُثبته لله مطلقًا،"], [919.0, "ولا من قبيل القسم الثاني حتى ننفيه عن الله عز وجل مطلقًا،"], [923.0, "وإنما هو كمالٌ من وجهٍ ونقصٌ من وجه."], [929.0, "فأمّا المكر ـ يرحمك الله ـ فأمّا المكرُ الابتدائيّ فلا جَرَمَ أنّه نقصٌ يُنزَّه الله عز وجل عنه،"], [936.0, "وذلك لأنّ المكر ابتداءً يتضمّن الظلم،"], [939.5, "والله عز وجل منزّهٌ عن الظلم."], [943.0, "وأمّا المكرُ الجزائيّ فإنّه يُعتبر كمالًا يوصف الله عز وجل به،"], [950.0, "لأنّه دليلٌ على كمال علمه عز وجل بالمكر وأهله،"], [957.0, "وأنّه قادرٌ القدرةَ التامّة على معاملتهم بمكرهم،"], [963.0, "وعلى أن لا يحيق المكرُ السيّئ إلا بأهله."], [968.0, "ولذلك لا تجد صفةَ المكر مضافةً لله عز وجل إلا من باب الجزاء والمقابلة،"], [977.0, "كقول الله عز وجل:"], [979.3, "<span class=\"ayah\">﴿وَيَمْكُرُونَ وَيَمْكُرُ اللَّهُ وَاللَّهُ خَيْرُ الْمَاكِرِينَ﴾<\/span> <span class=\"ref\">[الأنفال: ٣٠]<\/span>،"], [984.0, "وكقول الله عز وجل:"], [986.2, "<span class=\"ayah\">﴿وَمَكَرُوا مَكْرًا وَمَكَرْنَا مَكْرًا وَهُمْ لَا يَشْعُرُونَ ۝ فَانظُرْ كَيْفَ كَانَ عَاقِبَةُ مَكْرِهِمْ أَنَّا دَمَّرْنَاهُمْ وَقَوْمَهُمْ أَجْمَعِينَ ۝ فَتِلْكَ بُيُوتُهُمْ خَاوِيَةً بِمَا ظَلَمُوا﴾<\/span> <span class=\"ref\">[النمل: ٥٠–٥٢]<\/span>،"], [998.7, "الآيةَ بتمامها. فالمكرُ الابتدائيّ نقصٌ يُنزَّه الله عنه،"], [1004.5, "والمكرُ الجزائيّ كمالٌ يوصف الله به."]], "tr": [[904.0, "İnşallah mücmeller kaidesinde bize geleceği gibi."], [906.7, "Bunun üzerine bina edilen fer'ler vardır."], [910.0, "Birincisi: Mekr (tuzak kurma) sıfatı."], [911.0, "Mekr, Allah için mutlak olarak isbat edeceğimiz birinci kısımdan değildir;"], [913.0, "Allah Azze ve Celle'den mutlak olarak nefyedeceğimiz ikinci kısımdan da değildir."], [917.4, "Bilakis bir yönden kemal, bir yönden noksandır."], [919.7, "Mekr ise —Allah sana rahmet etsin (aksırana)— ibtidâî (karşılıksız, ilk başlatılan) mekr ise şüphesiz Allah Azze ve Celle'nin münezzeh tutulduğu bir noksanlıktır."], [929.0, "Çünkü ilk başlatılan mekr zulmü içerir;"], [930.2, "Allah Azze ve Celle ise zulümden münezzehtir."], [934.2, "Cezâî (karşılık olarak yapılan) mekr ise Allah Azze ve Celle'nin vasıflandığı bir kemal sayılır."], [943.0, "Çünkü bu, Azze ve Celle'nin mekri ve ehlini bilmesinin kemaline, onlara kendi mekirleriyle muamele etmeye tam bir kudretle gücü yettiğine ve kötü tuzağın ancak sahibini kuşatmasına (gücü yettiğine) delildir."], [958.5, "Bu sebeple mekr sıfatını Allah Azze ve Celle'ye ancak ceza ve karşılık babından izafe edilmiş bulursun."], [968.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [970.7, "<span class=\"ayah\">﴿Onlar tuzak kuruyorlardı, Allah da tuzak kuruyordu. Allah tuzak kuranların en hayırlısıdır﴾<\/span> [Enfâl 30]."], [979.3, "Ve Allah Azze ve Celle'nin şu sözü gibi:"], [984.0, "<span class=\"ayah\">﴿Onlar bir tuzak kurdular, Biz de onlar farkında olmadan bir tuzak kurduk. Bak, tuzaklarının sonu nasıl oldu: Biz onları ve kavimlerini topyekûn helâk ettik. İşte zulümleri yüzünden çökmüş, ıssız evleri﴾<\/span> [Neml 50–52] —ayetin tamamı."], [1001.0, "İbtidâî mekr, Allah'ın münezzeh tutulduğu bir noksanlıktır;"], [1004.5, "cezâî mekr ise Allah'ın vasıflandığı bir kemaldir."]]}, {"reader": false, "ar": [[1008.0, "ومنها صفةُ الكيد، ونقول فيها تمامًا ما قلناه في صفة المكر:"], [1014.0, "فإن كان المقصودُ به الكيدَ الابتدائيّ فإنّه نقصٌ لأنّه نوعُ ظلم،"], [1019.1, "والله منزّهٌ عن الظلم."], [1021.0, "وأمّا الكيدُ الجزائيّ فإنّه كمالٌ،"], [1023.8, "لأنّه دليلٌ على كمال قدرة الله عز وجل على المعاملة بالمثل،"], [1030.0, "وعلى كمال علمه بحقيقة الكيد وأهله."], [1034.0, "ولذلك لا تجد الكيدَ مضافًا لله عز وجل في الوحي إلا من باب الجزاء والمقابلة،"], [1042.0, "كقول الله عز وجل:"], [1044.2, "<span class=\"ayah\">﴿إِنَّهُمْ يَكِيدُونَ كَيْدًا ۝ وَأَكِيدُ كَيْدًا ۝ فَمَهِّلِ الْكَافِرِينَ أَمْهِلْهُمْ رُوَيْدًا﴾<\/span> <span class=\"ref\">[الطارق: ١٥–١٧]<\/span>."], [1050.0, "فالكيدُ الابتدائيّ نقصٌ يُنزَّه الله عنه،"], [1053.4, "والكيدُ الجزائيّ كمالٌ يوصف الله عز وجل به."]], "tr": [[1008.0, "Bunlardan biri de keyd (hile/tuzak) sıfatıdır."], [1010.2, "Onun hakkında da tam olarak mekr sıfatında söylediğimizi söyleriz:"], [1014.0, "Eğer kastedilen ibtidâî keyd ise o bir noksanlıktır;"], [1017.3, "çünkü bir tür zulümdür, Allah ise zulümden münezzehtir."], [1021.0, "Cezâî keyd ise kemaldir; çünkü Allah Azze ve Celle'nin misliyle muamele etmeye kudretinin kemaline ve keydin hakikatini ve ehlini bilmesinin kemaline delildir."], [1034.0, "Bu sebeple vahiyde keydi Allah Azze ve Celle'ye ancak ceza ve karşılık babından izafe edilmiş bulursun."], [1040.9, "Allah Azze ve Celle'nin şu sözü gibi:"], [1044.2, "<span class=\"ayah\">﴿Onlar bir tuzak kuruyorlar, Ben de bir tuzak kuruyorum. Sen kâfirlere mühlet ver, onlara biraz mühlet ver﴾<\/span> [Târık 15–17]."], [1050.0, "İbtidâî keyd, Allah'ın münezzeh tutulduğu bir noksanlıktır;"], [1052.9, "cezâî keyd ise Allah Azze ve Celle'nin vasıflandığı bir kemaldir."]]}, {"reader": false, "ar": [[1058.0, "ومنها صفةُ الاستهزاء، ونقول فيها كما قلنا في الصفتين السابقتين تمامًا:"], [1066.0, "فأمّا الاستهزاءُ الابتدائيّ فإنّه نقصٌ وجهلٌ يُنزَّه الله عز وجل عنه،"], [1073.0, "كما نزّه الله عنه نبيَّه موسى في قوله:"], [1077.8, "<span class=\"ayah\">﴿أَتَتَّخِذُنَا هُزُوًا قَالَ أَعُوذُ بِاللَّهِ أَنْ أَكُونَ مِنَ الْجَاهِلِينَ﴾<\/span> <span class=\"ref\">[البقرة: ٦٧]<\/span>."], [1083.0, "وأمّا الاستهزاءُ الجزائيّ فإنّه كمالٌ يوصف الله عز وجل به،"], [1090.0, "لأنّه دليلٌ على كمال العلم وكمال القدرة على المعاملة بالمثل."], [1095.0, "ولذلك لا تجدها مضافةً لله عز وجل في الوحي إلا من باب الجزاء والمقابلة،"], [1103.0, "كقول الله عز وجل عن المنافقين:"], [1106.6, "<span class=\"ayah\">﴿وَإِذَا خَلَوْا إِلَىٰ شَيَاطِينِهِمْ قَالُوا إِنَّا مَعَكُمْ إِنَّمَا نَحْنُ مُسْتَهْزِئُونَ ۝ اللَّهُ يَسْتَهْزِئُ بِهِمْ وَيَمُدُّهُمْ فِي طُغْيَانِهِمْ يَعْمَهُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٤–١٥]<\/span>."], [1117.0, "فالاستهزاءُ الابتدائيّ نقصٌ يُنزَّه الله عنه،"], [1121.0, "والاستهزاءُ الجزائيّ كمالٌ يوصف الله عز وجل به. وتحمّلوا كثرةَ الأمثلة."]], "tr": [[1058.0, "Bunlardan biri de istihzâ (alay etme) sıfatıdır."], [1060.8, "Onun hakkında da tam olarak önceki iki sıfatta söylediğimiz gibi söyleriz:"], [1066.0, "İbtidâî istihzâ, Allah Azze ve Celle'nin münezzeh tutulduğu bir noksanlık ve cehalettir."], [1072.4, "Nitekim Allah, peygamberi Mûsâ'yı da şu sözünde ondan tenzih etmiştir:"], [1077.8, "<span class=\"ayah\">﴿\"Bizimle alay mı ediyorsun?\" dediler. \"Cahillerden olmaktan Allah'a sığınırım\" dedi﴾<\/span> [Bakara 67]."], [1083.0, "Cezâî istihzâ ise Allah Azze ve Celle'nin vasıflandığı bir kemaldir;"], [1090.0, "çünkü ilmin kemaline ve misliyle muamele etmeye kudretin kemaline delildir."], [1095.0, "Bu sebeple vahiyde onu Allah Azze ve Celle'ye ancak ceza ve karşılık babından izafe edilmiş bulursun."], [1101.9, "Allah Azze ve Celle'nin münafıklar hakkındaki şu sözü gibi:"], [1106.6, "<span class=\"ayah\">﴿Şeytanlarıyla baş başa kaldıklarında ise \"Biz sizinle beraberiz, biz sadece alay ediyoruz\" derler. Allah da onlarla alay eder ve onları azgınlıkları içinde bocalayıp durmaları için başıboş bırakır﴾<\/span> [Bakara 14–15]."], [1117.0, "İbtidâî istihzâ, Allah'ın münezzeh tutulduğu bir noksanlıktır;"], [1120.3, "cezâî istihzâ ise Allah Azze ve Celle'nin vasıflandığı bir kemaldir. Örneklerin çokluğuna katlanın."]]}, {"reader": false, "ar": [[1128.0, "ومنها صفةُ السُّخرية، ونقول فيها ما قلناه في الصفات السابقة تمامًا:"], [1137.0, "فأمّا السخريةُ الابتدائيّة فإنّها ظلمٌ وجهلٌ يُنزَّه الله عز وجل عنها،"], [1144.0, "وأمّا السخريةُ الجزائيّة فإنّها كمالٌ يوصف الله عز وجل بها،"], [1150.0, "لأنّها دليلٌ على كمال العلم وكمال القدرة على المعاملة بالمثل وكمال الإحاطة."], [1160.0, "ولذلك لا تجدها مضافةً لله عز وجل في أدلّة الوحي إلا من باب الجزاء والمقابلة،"], [1168.0, "كقول الله عز وجل:"], [1170.0, "<span class=\"ayah\">﴿الَّذِينَ يَلْمِزُونَ الْمُطَّوِّعِينَ مِنَ الْمُؤْمِنِينَ فِي الصَّدَقَاتِ وَالَّذِينَ لَا يَجِدُونَ إِلَّا جُهْدَهُمْ فَيَسْخَرُونَ مِنْهُمْ سَخِرَ اللَّهُ مِنْهُمْ وَلَهُمْ عَذَابٌ أَلِيمٌ﴾<\/span> <span class=\"ref\">[التوبة: ٧٩]<\/span>."], [1183.0, "فالسخريةُ الابتدائيّة نقصٌ يُنزَّه الله عنه،"], [1187.0, "والسخريةُ الجزائيّة كمالٌ يوصف الله عز وجل به."]], "tr": [[1128.0, "Bunlardan biri de suhriyye (eğlenme, alaya alma) sıfatıdır."], [1132.5, "Onun hakkında da tam olarak önceki sıfatlarda söylediğimizi söyleriz:"], [1137.0, "İbtidâî suhriyye, Allah Azze ve Celle'nin münezzeh tutulduğu bir zulüm ve cehalettir."], [1144.0, "Cezâî suhriyye ise Allah Azze ve Celle'nin vasıflandığı bir kemaldir;"], [1150.0, "çünkü ilmin kemaline, misliyle muamele etmeye kudretin kemaline ve kuşatmanın kemaline delildir."], [1160.0, "Bu sebeple vahyin delillerinde onu Allah Azze ve Celle'ye ancak ceza ve karşılık babından izafe edilmiş bulursun."], [1166.8, "Allah Azze ve Celle'nin şu sözü gibi:"], [1170.0, "<span class=\"ayah\">﴿Sadakalar konusunda mü'minlerden gönüllü verenleri ve güçlerinin yettiğinden başka bir şey bulamayanları kınayıp onlarla alay edenler var ya, Allah da onlarla alay eder (onları alaylarına karşılık cezalandırır); onlar için elem verici bir azap vardır﴾<\/span> [Tevbe 79]."], [1183.0, "İbtidâî suhriyye, Allah'ın münezzeh tutulduğu bir noksanlıktır;"], [1186.3, "cezâî suhriyye ise Allah Azze ve Celle'nin vasıflandığı bir kemaldir."]]}]}, {"ts": "19:52", "title": "4. Külliye (devam): Nisyan ve ucb (taaccüb) sıfatları", "paras": [{"reader": false, "ar": [[1192.0, "ومنها كذلك النسيان؛ فإنّ له في لغة العرب معنيين:"], [1205.0, "الأوّل: نسيانٌ بمعنى الغفلة والذهول عن الشيء،"], [1208.5, "وهذا نقصٌ يُنزَّه الله عز وجل عنه،"], [1212.0, "وإنما النسيان بهذا المعنى من صفات المخلوق لا من صفات الخالق."], [1219.0, "وهو النسيانُ المنفيّ عن الله عز وجل في قوله:"], [1224.2, "<span class=\"ayah\">﴿لَا يَضِلُّ رَبِّي وَلَا يَنسَى﴾<\/span> <span class=\"ref\">[طه: ٥٢]<\/span>،"], [1227.1, "أي: لا يغفل ولا يذهل،"], [1230.0, "والمنفيُّ في قول الله عز وجل:"], [1232.6, "<span class=\"ayah\">﴿وَمَا كَانَ رَبُّكَ نَسِيًّا﴾<\/span> <span class=\"ref\">[مريم: ٦٤]<\/span>،"], [1234.8, "أي: ليس بغافلٍ ولا بذاهلٍ عن خلقه."]], "tr": [[1192.0, "Bunlardan biri de nisyan (unutma)dır."], [1200.0, "Onun Arap dilinde iki manası vardır."], [1205.0, "Birincisi: Bir şeyden gaflet etme ve habersiz kalma anlamında unutma."], [1209.5, "Bu, Allah Azze ve Celle'nin münezzeh tutulduğu bir noksanlıktır."], [1214.5, "Bu anlamdaki unutma, Yaratanın değil mahlûkun sıfatlarındandır."], [1219.0, "Bu, Allah Azze ve Celle'den <span class=\"ayah\">﴿Rabbim ne şaşırır ne de unutur﴾<\/span> [Tâhâ 52] sözünde nefyedilen unutmadır;"], [1227.7, "yani gaflet etmez ve habersiz kalmaz."], [1230.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rabbin unutkan değildir﴾<\/span> [Meryem 64] sözünde nefyedilen de budur;"], [1235.2, "yani mahlûkatından gâfil ve habersiz değildir."]]}, {"reader": false, "ar": [[1239.0, "وأمّا النسيانُ بمعنى التَّرك عن علمٍ وعَمدٍ عقوبةً وجزاءً ومقابلةً،"], [1248.0, "فهو كمالٌ يوصف الله عز وجل به،"], [1252.0, "لأنّه دليلٌ على كمال العلم والإحاطة،"], [1255.0, "وعلى كمال القدرة على المعاملة بالمثل."], [1259.0, "وهو النسيانُ المثبَت لله عز وجل في قوله:"], [1263.8, "<span class=\"ayah\">﴿نَسُوا اللَّهَ فَنَسِيَهُمْ﴾<\/span> <span class=\"ref\">[التوبة: ٦٧]<\/span>، أي:"], [1265.6, "تركوا الإيمانَ به وبرسله عمدًا وعدوانًا،"], [1269.0, "فتركهم جزاءً وعقوبة. وكقول الله عز وجل:"], [1275.0, "<span class=\"ayah\">﴿كَذَٰلِكَ أَتَتْكَ آيَاتُنَا فَنَسِيتَهَا﴾<\/span> أي:"], [1277.8, "تركتَها عن علمٍ وعمد،"], [1280.0, "<span class=\"ayah\">﴿وَكَذَٰلِكَ الْيَوْمَ تُنسَىٰ﴾<\/span> <span class=\"ref\">[طه: ١٢٦]<\/span> أي:"], [1282.5, "تُترَك عن علمٍ وعمد."], [1285.0, "وفي الحديث: «فإنّي أنساك اليومَ كما نسيتَني»،"], [1291.0, "أي: أتركُك عن علمٍ وعمد،"], [1294.0, "كما تركتَ الإيمانَ بي وبرسلي،"], [1297.0, "وكذّبتَ بهم عن علمٍ وعمد."], [1300.0, "فالنسيانُ بمعنى الغفلة والذهول نقصٌ يُنزَّه الله عنه،"], [1306.0, "والنسيانُ بمعنى الترك عن علمٍ وعمدٍ جزاءً ومقابلةً كمالٌ يوصف الله عز وجل به."]], "tr": [[1239.0, "Ceza, karşılık ve mukabele olarak bilerek ve kasten terk etme anlamındaki unutma ise Allah Azze ve Celle'nin vasıflandığı bir kemaldir;"], [1252.5, "çünkü ilmin ve kuşatmanın kemaline ve misliyle muamele etmeye kudretin kemaline delildir."], [1259.0, "Bu, Allah Azze ve Celle için <span class=\"ayah\">﴿Onlar Allah'ı unuttular, Allah da onları unuttu﴾<\/span> [Tevbe 67] sözünde isbat edilen unutmadır;"], [1265.6, "yani onlar kasten ve düşmanca O'na ve resullerine imanı terk ettiler, O da ceza ve azap olarak onları terk etti."], [1275.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1277.8, "<span class=\"ayah\">﴿Böyle! Sana ayetlerimiz geldi, sen onları unuttun﴾<\/span> —yani bilerek ve kasten terk ettin— <span class=\"ayah\">﴿bugün de sen öyle unutuluyorsun﴾<\/span> [Tâhâ 126] —yani bilerek ve kasten terk ediliyorsun."], [1285.0, "Hadiste de şöyle geçer: \"Sen beni unuttuğun gibi ben de bugün seni unutuyorum.\" Yani sen bana ve resullerime imanı bilerek ve kasten terk ettiğin ve onları bilerek ve kasten yalanladığın gibi, ben de seni bilerek ve kasten terk ediyorum."], [1300.0, "Gaflet ve habersiz kalma anlamındaki unutma, Allah'ın münezzeh tutulduğu bir noksanlıktır;"], [1306.0, "ceza ve karşılık olarak bilerek ve kasten terk etme anlamındaki unutma ise Allah Azze ve Celle'nin vasıflandığı bir kemaldir."]]}, {"reader": false, "ar": [[1315.0, "ومنها صفةُ العَجَب؛ فإنّ العجب له سببان:"], [1319.0, "عجبٌ بمعنى خفاء أسباب المتعجَّب منه،"], [1323.0, "وهو الذي يقول فيه العامّة:"], [1325.5, "إذا عُرف السببُ بطل العجب."], [1329.0, "وهذا العجبُ بهذا السبب نقصٌ يُنزَّه الله عز وجل عنه،"], [1336.0, "لأنّ قيامه في النفس مبنيٌّ على خفاء سببيّته،"], [1343.0, "والله عز وجل لا يخفى عليه شيءٌ في الأرض ولا في السماء؛"], [1348.0, "فلا يوصف بالعجب بهذا المعنى ـ أو بهذا السبب ـ إلا المخلوقُ فقط."]], "tr": [[1315.0, "Bunlardan biri de ucb (taaccüb, hayret) sıfatıdır."], [1319.0, "Taaccübün iki sebebi vardır. (Birincisi:) Kendisine hayret edilen şeyin sebeplerinin gizli olması anlamındaki taaccüp."], [1325.5, "Halkın \"Sebep bilinince hayret kalkar\" dediği budur."], [1329.0, "Bu sebebe dayanan bu taaccüp, Allah Azze ve Celle'nin münezzeh tutulduğu bir noksanlıktır;"], [1336.7, "çünkü onun nefiste oluşması, sebebinin gizli olmasına dayanır."], [1343.4, "Allah Azze ve Celle'ye ise yerde ve gökte hiçbir şey gizli kalmaz."], [1348.0, "Dolayısıyla bu anlamdaki —veya bu sebepteki— taaccüple sadece mahlûk vasıflanır."]]}, {"reader": false, "ar": [[1355.0, "وأمّا العجبُ الثاني فهو عجبٌ سببُه خروجُ الشيء عن حكم نظائره،"], [1362.0, "كالشابّ يخرج عن نظائره في الصَّبْوة،"], [1370.0, "كما قال صلى الله عليه وسلم:"], [1372.8, "«يعجب ربُّك إلى الشابّ ليست له صبوة»،"], [1376.0, "والحديث في إسناده كلام."], [1378.0, "وعلى ذلك قولُ الله عز وجل في قراءةٍ سبعيّة:"], [1383.0, "<span class=\"ayah\">﴿بَلْ عَجِبْتُ وَيَسْخَرُونَ﴾<\/span> <span class=\"ref\">[الصافات: ١٢]<\/span>. وفي قوله صلى الله عليه وسلم:"], [1391.0, "«عَجِبَ ربُّنا من قُنوط عباده وقُربِ غِيَرِه» ـ أي:"], [1396.3, "تغييرِه للأحوال ـ «ينظر إليكم أزِلين قَنِطين، فيظلّ يضحك، يعلم أنّ فرجَكم قريب»،"], [1404.8, "والحديث إسنادُه حسن. فالعجبُ إذا كان سببُه خفاءَ أسباب المتعجَّب منه فهو نقصٌ يُنزَّه الله عز وجل عنه،"], [1421.0, "والعجبُ إذا كان سببُه خروجَ الشيء عن حكم نظائره فإنّه كمالٌ يوصف الله به."]], "tr": [[1355.0, "İkinci taaccüp ise sebebi, bir şeyin benzerlerinin hükmünden dışarı çıkması olan taaccüptür."], [1361.4, "Gençlik heveslerinde (sabve) benzerlerinden ayrılan genç gibi."], [1365.8, "Nitekim Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1372.8, "\"Rabbin, gençlik hevesi (sabvesi) olmayan gence taaccüp eder.\" Bu hadisin isnadında söz vardır."], [1378.0, "Allah Azze ve Celle'nin yedi kıraatten birindeki <span class=\"ayah\">﴿Bilakis ben taaccüp ettim; onlar ise alay ediyorlar﴾<\/span> [Sâffât 12] sözü de bunun üzerinedir."], [1387.0, "Peygamber sallallâhu aleyhi ve sellem'in şu sözünde de böyledir:"], [1391.0, "\"Rabbimiz, kullarının ümitsizliğine ve (hâlleri) değiştirmesinin (gıyerinin) yakınlığına taaccüp etti\" —yani hâlleri değiştirmesinin— \"Sizi darlık içinde ve ümitsiz hâlde görür de gülmeye devam eder;"], [1402.7, "kurtuluşunuzun yakın olduğunu bilir.\" Bu hadisin isnadı hasendir."], [1407.0, "Taaccübün sebebi, kendisine hayret edilen şeyin sebeplerinin gizli olması ise, bu Allah Azze ve Celle'nin münezzeh tutulduğu bir noksanlıktır."], [1421.6, "Taaccübün sebebi, bir şeyin benzerlerinin hükmünden dışarı çıkması ise, bu Allah'ın vasıflandığı bir kemaldir."]]}, {"reader": false, "ar": [[1429.0, "وعليه قولُه صلى الله عليه وسلم لمن ضيّف ضيفَ رسول الله صلى الله عليه وسلم بطريقةٍ في الضيافة عجيبةٍ جدًّا،"], [1439.0, "خرجت عن نظائر الضيافة في العالم الإسلاميّ والعربيّ؛"], [1444.0, "فقال النبيّ صلى الله عليه وسلم:"], [1448.0, "«عجب ربُّكما من صنيعكما بضيفكما البارحة»."], [1452.0, "والخلاصة من هذه الكلّيّة:"], [1454.6, "أنّ الصفات التي هي كمالٌ من وجهٍ ونقصٌ من وجه،"], [1461.0, "فلا نُثبتها لله مطلقًا،"], [1463.2, "ولا ننفيها عن الله مطلقًا،"], [1466.0, "وإنما هي موقوفةٌ على الاستفصال،"], [1468.9, "حتى يتميّز حقُّها فيُقبَل،"], [1471.2, "من باطلها فيُرَدّ. والله أعلم."]], "tr": [[1429.0, "Peygamber sallallâhu aleyhi ve sellem'in, Resûlullah sallallâhu aleyhi ve sellem'in misafirini, İslâm ve Arap dünyasındaki misafirlik örneklerinin dışına çıkan çok şaşırtıcı bir misafirperverlik yoluyla ağırlayan kimseye söylediği söz de bunun üzerinedir."], [1444.0, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1448.0, "\"Dün gece misafirinize yaptığınızdan Rabbiniz taaccüp etti.\" Bu külliyenin hulâsası şudur:"], [1454.6, "Bir yönden kemal, bir yönden noksan olan sıfatları Allah için mutlak olarak isbat etmeyiz, Allah'tan mutlak olarak da nefyetmeyiz."], [1464.9, "Bilakis bunlar istifsâle bağlıdır; ta ki hakkı ayrılıp kabul edilsin, bâtılı ayrılıp reddedilsin. Allah en iyisini bilir."]]}]}, {"ts": "24:33", "title": "5. Külliye: Sıfatın aslına iman ederek onu lâzımlarından biriyle tefsir etmek açıklama ve beyandır", "paras": [{"reader": false, "ar": [[1473.8, "ومن الكلّيّات أيضًا: <b>كلُّ من فسّر صفةً لله بشيءٍ من لوازمها مع الإيمان بأصلها فتوضيحٌ وبيان.<\/b> <b>كلُّ من فسّر صفةً لله عز وجل بشيءٍ من لوازمها مع الإيمان بأصل اتّصاف الله بها فتوضيحٌ وبيان.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [1510.0, "<b>كلُّ من فسّر صفةً لله عز وجل بشيءٍ من لوازمها مع الإيمان بأصل اتّصاف الله بها فتوضيحٌ وبيان.<\/b>"]], "tr": [[1473.8, "Külliyelerden biri de şudur: 5."], [1475.0, "külliye: Allah'ın bir sıfatını, aslına iman etmekle birlikte lâzımlarından (gereklerinden) bir şeyle tefsir eden herkes(in yaptığı) açıklama ve beyandır.<b> <\/b>5."], [1489.0, "külliye: Allah Azze ve Celle'nin bir sıfatını, Allah'ın onunla vasıflı olmasının aslına iman etmekle birlikte lâzımlarından bir şeyle tefsir eden herkes(in yaptığı) açıklama ve beyandır. (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [1510.0, "<b>5. külliye: Allah Azze ve Celle'nin bir sıfatını, Allah'ın onunla vasıflı olmasının aslına iman etmekle birlikte lâzımlarından bir şeyle tefsir eden herkes(in yaptığı) açıklama ve beyandır.<\/b>"]]}, {"reader": false, "ar": [[1524.0, "أقول وبالله التوفيق: قوله:"], [1527.9, "«فتوضيحٌ وبيان»، أي: أنّه أمرٌ جائزٌ لا بأس به ولا حرج فيه."], [1535.0, "وقد جرت عادةُ أهل السنّة والجماعة أن يفسّروا الأشياء بلوازمها أو بضرب مثالٍ لها."], [1541.0, "وليس العبرةُ في أن يتعاطى المسلمُ شيئًا من لوازم صفات الله عز وجل،"], [1551.0, "وشيئًا من آثارها ومقتضياتها،"], [1555.0, "وإنما المنكَر في أن يُقيم اللازمَ مقامَ أصل الصفة،"], [1563.0, "فيجحد أصلَ اتّصاف الله عز وجل بها،"], [1567.0, "ويجعل المرادَ منها هذا اللازمَ دون أصل الاتّصاف بها."]], "tr": [[1524.0, "Tevfik Allah'tandır, derim ki: \"Açıklama ve beyandır\" sözü, yani bu caiz bir iştir;"], [1530.5, "bunda bir sakınca ve bir vebal yoktur."], [1535.0, "Ehl-i Sünnet ve'l-Cemaat'in âdeti, şeyleri lâzımlarıyla veya onlara bir misal vererek tefsir etmek şeklinde cereyan etmiştir."], [1541.0, "Mesele, Müslüman'ın Allah Azze ve Celle'nin sıfatlarının lâzımlarından, eserlerinden ve muktezâlarından bir şeyle meşgul olmasında değildir."], [1551.8, "Münker olan, lâzımı sıfatın aslının yerine koyması, böylece Allah Azze ve Celle'nin onunla vasıflı olmasının aslını inkâr etmesi ve ondan kastedilenin, onunla vasıflanmanın aslı değil de bu lâzım olduğunu söylemesidir."]]}, {"reader": false, "ar": [[1573.0, "فلو أنّ الأشاعرة قالوا:"], [1578.0, "إنّنا نؤمن بأنّ لله يدًا حقيقيّةً ذاتيّةً لائقةً بجلاله وعظمته،"], [1586.0, "من لوازمها النعمةُ والقدرة،"], [1589.0, "لقلنا: أصبتم وأحسنتم. ولكنّهم يجعلون هذا اللازمَ قائمًا مقامَ أصل اتّصاف الله بصفة اليد،"], [1602.0, "فيقولون: لا يجوز وصفُ الله عز وجل باليدين،"], [1606.0, "وإنما المرادُ بالنصّ النعمةُ والقدرة."]], "tr": [[1573.0, "Eğer Eş'arîler \"Allah'ın celâline ve azametine lâyık, hakikî, zâtî bir eli olduğuna iman ediyoruz;"], [1582.8, "nimet ve kudret onun lâzımlarındandır\" deselerdi, \"İsabet ettiniz ve güzel yaptınız\" derdik."], [1589.7, "Fakat onlar bu lâzımı, Allah'ın el sıfatıyla vasıflı olmasının aslının yerine koyarlar ve \"Allah Azze ve Celle'yi iki elle vasıflandırmak caiz değildir;"], [1605.0, "nastan kastedilen sadece nimet ve kudrettir\" derler."]]}, {"reader": false, "ar": [[1610.0, "وكذلك لو أنّهم قالوا:"], [1614.0, "إنّنا نؤمن بأنّ الله عز وجل له رحمةٌ هي صفتُه،"], [1620.7, "من مقتضياتها إثابةُ عباده،"], [1630.0, "لقلنا: أحسنتم وأصبتم. ولكنّهم جعلوا هذا اللازمَ قائمًا مقامَ أصل الصفة،"], [1639.0, "فقالوا: لا يوصف الله عز وجل بالرحمة،"], [1643.1, "وإنما المرادُ بالرحمة المضافة له إرادةُ الإنعام فقط، وإرادةُ الثواب فقط."]], "tr": [[1610.0, "Aynı şekilde \"Allah Azze ve Celle'nin, sıfatı olan bir rahmeti olduğuna iman ediyoruz;"], [1617.4, "kullarına sevap vermesi onun muktezâlarındandır\" deselerdi, \"Güzel yaptınız ve isabet ettiniz\" derdik."], [1630.7, "Fakat onlar bu lâzımı sıfatın aslının yerine koydular ve \"Allah Azze ve Celle rahmetle vasıflandırılmaz;"], [1640.8, "O'na izafe edilen rahmetten kastedilen sadece nimet vermeyi irade etmek ve sadece sevap vermeyi irade etmektir\" dediler."]]}, {"reader": false, "ar": [[1650.0, "ولو أنّهم قالوا: نؤمن بأنّ لله عز وجل غضبًا لائقًا بجلاله وعظمته،"], [1659.0, "من لوازمه الانتقامُ والعقوبةُ والعذاب،"], [1664.0, "لقلنا: أصبتم وأحسنتم. ولكنّهم جعلوا هذه اللوازمَ بديلًا عن أصل الصفة،"], [1674.0, "فقالوا: لا يجوز وصفُ الله عز وجل بالغضب،"], [1678.4, "وإنما المرادُ بالغضب المضاف له مجرّدُ إرادة الانتقام والعقوبة فقط."]], "tr": [[1650.0, "Eğer \"Allah Azze ve Celle'nin celâline ve azametine lâyık bir gazabı olduğuna iman ediyoruz;"], [1656.2, "intikam, ceza ve azap onun lâzımlarındandır\" deselerdi, \"İsabet ettiniz ve güzel yaptınız\" derdik."], [1664.9, "Fakat onlar bu lâzımları sıfatın aslına bedel kıldılar ve \"Allah Azze ve Celle'yi gazapla vasıflandırmak caiz değildir;"], [1677.9, "O'na izafe edilen gazaptan kastedilen sadece intikam ve ceza iradesidir\" dediler."]]}, {"reader": false, "ar": [[1684.0, "ولو أنّهم قالوا: نؤمن بأنّ لله عز وجل وجهًا لائقًا بجلاله وعظمته،"], [1692.0, "من لوازمه إثباتُ ذاته،"], [1700.0, "لقلنا: أصبتم وأحسنتم. ولكنّهم جعلوا هذا اللازمَ بديلًا عن الإيمان بأصل صفة الوجه،"], [1707.0, "فقالوا: لا يجوز وصفُ الله عز وجل بالوجه،"], [1711.8, "وإنما المرادُ بالوجه المضاف له الذاتُ فقط."]], "tr": [[1684.0, "Eğer \"Allah Azze ve Celle'nin celâline ve azametine lâyık bir yüzü (vechi) olduğuna iman ediyoruz;"], [1690.0, "zâtının isbatı onun lâzımlarındandır\" deselerdi, \"İsabet ettiniz ve güzel yaptınız\" derdik."], [1700.5, "Fakat onlar bu lâzımı, vech sıfatının aslına imana bedel kıldılar ve \"Allah Azze ve Celle'yi vech ile vasıflandırmak caiz değildir;"], [1711.2, "O'na izafe edilen vechten kastedilen sadece zâttır\" dediler."]]}, {"reader": false, "ar": [[1716.0, "ولو أنّهم قالوا: نؤمن بأنّ لله عز وجل نزولًا في ثلث الليل لائقًا بجلاله وعظمته،"], [1731.0, "من لوازمه رحمةُ عباده،"], [1736.0, "وإجابةُ دعائهم، والنظرُ في أحوالهم،"], [1740.0, "لقلنا: أحسنتم وأصبتم. ولكنّهم جعلوا هذا اللازمَ قائمًا مقامَ أصل الصفة،"], [1749.0, "فقالوا: لا يجوز وصفُ الله عز وجل بالنزول،"], [1752.0, "وإنما المرادُ بنزوله نزولُ مَلَكٍ من ملائكته،"], [1756.0, "أو نزولُ أمرٍ من أوامره،"], [1759.0, "أو نزولُ رحمةٍ من رحماته."]], "tr": [[1716.0, "Eğer \"Allah Azze ve Celle'nin gecenin (son) üçte birinde celâline ve azametine lâyık bir nüzulü olduğuna iman ediyoruz;"], [1724.0, "kullarına rahmet etmesi, dualarına icabet etmesi ve hâllerine bakması onun lâzımlarındandır\" deselerdi, \"Güzel yaptınız ve isabet ettiniz\" derdik."], [1741.0, "Fakat onlar bu lâzımı sıfatın aslının yerine koydular ve \"Allah Azze ve Celle'yi nüzulle vasıflandırmak caiz değildir;"], [1751.0, "O'nun nüzulünden kastedilen, meleklerinden bir meleğin inmesi, emirlerinden bir emrin inmesi veya rahmetlerinden bir rahmetin inmesidir\" dediler."]]}, {"reader": false, "ar": [[1762.0, "فمشكلةُ أهل البدع أنّهم يفسّرون الصفةَ بلوازمها،"], [1766.6, "لكن مع جحود أصل الصفة وتعطيلها عن الله عز وجل،"], [1775.0, "وهذا هو عينُ التحريف والتعطيل؛"], [1778.0, "فهو تعطيلٌ لأنّهم عطّلوا الله عز وجل عن أصل اتّصافه بما وصف به نفسَه في الوحيين،"], [1787.0, "وتحريفٌ لأنّهم أقاموا اللازمَ مقامَ أصل الصفة،"], [1797.0, "فلم يؤمنوا بالمعنى الذي تدلّ عليه هذه الصفة،"], [1803.0, "وإنما أنكروه وعطّلوه وجحدوا به،"], [1806.0, "وجعلوا هذا اللازمَ قائمًا مقامه."]], "tr": [[1762.0, "Bid'at ehlinin problemi, sıfatı lâzımlarıyla tefsir etmeleri ama bunu sıfatın aslını inkâr ederek ve onu Allah Azze ve Celle'den ta'til ederek yapmalarıdır."], [1772.5, "İşte bu, tahrif ve ta'tilin ta kendisidir."], [1778.0, "Ta'tildir; çünkü Allah Azze ve Celle'yi, iki vahiyde kendisini vasıflandırdığı şeyle vasıflı olmanın aslından ta'til ettiler (soyutladılar)."], [1786.4, "Tahriftir; çünkü lâzımı sıfatın aslının yerine koydular;"], [1790.7, "bu sıfatın delalet ettiği manaya iman etmediler, bilakis onu inkâr ettiler, ta'til ettiler, onu reddettiler ve bu lâzımı onun yerine koydular."]]}]}, {"ts": "30:09", "title": "5. Külliye (devam): Ehl-i Sünnet'in maiyyeti ve ﴿تَجْرِي بِأَعْيُنِنَا﴾'yı tefsiri bu kabilden mi?", "paras": [{"reader": false, "ar": [[1809.0, "فإن قلت: وهل يُعتبر تفسيرُ أهل السنّة للمعيّة العامّة بالعلم،"], [1815.5, "وتفسيرُهم للمعيّة الخاصّة بالنصر والسلطان والتأييد،"], [1819.4, "من هذا الباب ـ أي:"], [1833.7, "من الإيمان باللازم وجحد أصل الصفة؟"], [1837.9, "الجواب: بالطبع لا. بل إنّ أهل السنّة متّفقون عن بَكرة أبيهم،"], [1846.7, "من أوّلهم إلى آخرهم،"], [1849.0, "أنّ من صفات الله عز وجل المعيّةَ،"], [1853.6, "والتي من مقتضياتها ـ إن كانت عامّةً ـ الإحاطةُ والهيمنةُ والعلم،"], [1861.0, "لكن مع إيمانهم بأصل اتّصافه بالمعيّة."], [1867.0, "وإن كانت خاصّةً فمع إيمانهم بأصل اتّصاف الله عز وجل بها،"], [1875.0, "فإنّهم يجعلون من لوازمها النصرَ والسلطانَ والتأييد."]], "tr": [[1809.0, "Eğer \"Ehl-i Sünnet'in genel maiyyeti (beraberliği) ilimle, özel maiyyeti de yardım, hüccet (sultan) ve te'yid ile tefsir etmesi bu kabilden —yani lâzıma iman edip sıfatın aslını inkâr etme kabilinden— sayılır mı?\" dersen, cevap:"], [1842.0, "Elbette hayır. Bilakis Ehl-i Sünnet, istisnasız hepsi, ilkinden sonuncusuna kadar şu konuda ittifak hâlindedir:"], [1851.0, "Maiyyet, Allah Azze ve Celle'nin sıfatlarındandır."], [1855.6, "Eğer genel maiyyet ise, kuşatma, hâkimiyet ve ilim onun muktezâlarındandır;"], [1867.0, "ama onlar O'nun maiyyetle vasıflı olmasının aslına da iman ederler."], [1870.5, "Eğer özel maiyyet ise, Allah Azze ve Celle'nin onunla vasıflı olmasının aslına iman etmekle birlikte, yardım, hüccet ve te'yidi onun lâzımlarından sayarlar."]]}, {"reader": false, "ar": [[1881.0, "وكذلك تفسيرُ بعض أهل السنّة لقول الله عز وجل:"], [1885.9, "<span class=\"ayah\">﴿تَجْرِي بِأَعْيُنِنَا﴾<\/span> <span class=\"ref\">[القمر: ١٤]<\/span>، أي: على مرأىً منّا،"], [1890.0, "فليس ذلك من باب إنكار صفة العين،"], [1894.0, "ولكنّه تفسيرٌ للشيء بلازمه مع الإيمان بأصل اتّصاف الله عز وجل بالصفة."]], "tr": [[1881.0, "Aynı şekilde Ehl-i Sünnet'ten bazılarının Allah Azze ve Celle'nin <span class=\"ayah\">﴿Gözlerimizin önünde akıp gidiyordu﴾<\/span> [Kamer 14] sözünü \"Bizim görüşümüz altında\" diye tefsir etmesi de göz sıfatını inkâr etme kabilinden değildir;"], [1887.8, "bilakis bu, Allah Azze ve Celle'nin o sıfatla vasıflı olmasının aslına iman etmekle birlikte bir şeyi lâzımıyla tefsir etmektir."]]}, {"reader": false, "ar": [[1903.0, "ولذلك إذا رأيتَ أحدًا من أهل البدع ينسب لأحدٍ من أهل السنّة أنّه أوّل <span class=\"q\">؟ 31:43<\/span> الصفةَ الفلانيّة إلى كذا وكذا:"], [1917.0, "فلماذا تُنكرون علينا تأويلَنا وتُقِرّونهم على تأويلهم؟"], [1923.0, "فقل له: إنّ تفسير هذا السنّيّ لهذه الصفة إنما هو تفسيرٌ للّازم مع الإيمان بأصل اتّصاف الله عز وجل بهذه الصفة،"], [1937.0, "وتفسيرُ الصفة بشيءٍ من لوازمها مع الإيمان بأصل اتّصاف الله بها توضيحٌ وبيان."], [1945.0, "وأمّا أنتم يا أهل البدع فإنّكم تفسّرون الصفةَ بشيءٍ من لوازمها مع جحود وتعطيل أصل اتّصاف الله عز وجل بها،"], [1958.0, "وكلُّ من فسّر الصفةَ بشيءٍ من لوازمها مع جحود أصلها فمحرِّفٌ ومعطِّل."]], "tr": [[1903.0, "Bu sebeple bid'at ehlinden birinin, Ehl-i Sünnet'ten birine falan sıfatı şuna buna te'vil ettiğini <span class=\"q\">؟<\/span> nispet ettiğini ve \"Neden bizim te'vilimizi reddediyorsunuz da onları te'villeri üzerinde onaylıyorsunuz?\" dediğini görürsen, ona de ki:"], [1923.0, "Bu Sünnî'nin bu sıfatı tefsiri, Allah Azze ve Celle'nin bu sıfatla vasıflı olmasının aslına iman etmekle birlikte lâzımı tefsir etmektir."], [1934.5, "Allah'ın bir sıfatla vasıflı olmasının aslına iman ederek o sıfatı lâzımlarından bir şeyle tefsir etmek ise açıklama ve beyandır."], [1945.0, "Ey bid'at ehli, sizler ise sıfatı, Allah Azze ve Celle'nin onunla vasıflı olmasının aslını inkâr ve ta'til ederek lâzımlarından bir şeyle tefsir ediyorsunuz."], [1956.9, "Sıfatı, aslını inkâr ederek lâzımlarından bir şeyle tefsir eden herkes muharrif (tahrif eden) ve muattıldır (ta'til eden)."]]}, {"reader": false, "ar": [[1966.0, "ولعلّكم فرّقتم بين هذا وهذا."], [1970.0, "لأنّنا نرى أنّ هناك مؤلَّفاتٍ قد أُلِّفت في حصر التأويلات التي وردت على لسان بعض المفسّرين،"], [1982.0, "وعلى لسان بعض أهل العقائد،"], [1985.0, "ويجعلها هؤلاء تُكَأةً ليصحّحوا بها تحريفاتِهم وتعطيلاتِهم،"], [1993.0, "فيُرَدّ عليهم بمثل هذا الردّ."], [1995.1, "والله أعلم. وسيأتي توضيحٌ لها أكثرُ فيما يلي إن شاء الله."]], "tr": [[1966.0, "Umarım bununla bunun arasını ayırt etmişsinizdir."], [1970.0, "(Bunu söylüyorum,) çünkü bazı müfessirlerin ve bazı akîde ehlinin dilinden varid olan te'villeri toplamak için telif edilmiş eserler olduğunu görüyoruz."], [1980.8, "Bunlar (bid'at ehli), o te'villeri tahriflerini ve ta'tillerini sahih göstermek için bir dayanak edinirler."], [1988.7, "Onlara da bu cevap gibi bir cevapla reddiye verilir."], [1995.1, "Allah en iyisini bilir. İnşallah ileride bunun daha fazla açıklaması gelecek."]]}]}, {"ts": "33:19", "title": "6. Külliye: Kendi başına kâim olmayan her muttasıl muzâf, sıfatın mevsûfuna izafesidir", "paras": [{"reader": false, "ar": [[1999.0, "ومن الكلّيّات أيضًا ـ كم رقمُها؟"], [2006.0, "ـ: <b>كلُّ مضافٍ متّصلٍ لا يقوم بنفسه فإضافةُ صفةٍ إلى موصوفها.<\/b> <b>كلُّ مضافٍ متّصلٍ لا يقوم بنفسه فإضافةُ صفةٍ إلى موصوفها.<\/b> أُعيدها مرّةً ثالثة:"], [2031.0, "<b>كلُّ مضافٍ متّصلٍ لا يقوم بنفسه فإضافةُ صفةٍ إلى موصوفها.<\/b>"]], "tr": [[1999.0, "Külliyelerden biri de —numarası kaç?—:"], [2006.0, "6. külliye: Kendi başına kâim olmayan (ayakta durmayan) her muttasıl muzâf (Allah'a izafe edilen bitişik şey), sıfatın mevsûfuna izafesidir. 6."], [2017.1, "külliye: Kendi başına kâim olmayan her muttasıl muzâf, sıfatın mevsûfuna izafesidir. Üçüncü kez tekrar ediyorum:"], [2031.0, "<b>6. külliye: Kendi başına kâim olmayan her muttasıl muzâf, sıfatın mevsûfuna izafesidir.<\/b>"]]}, {"reader": false, "ar": [[2043.0, "أقول وبالله التوفيق: قال الإمام ابن تيميّة رحمه الله تعالى:"], [2052.4, "«ما أُضيف إلى الله من صفات فعله ممّا هو غيرُ بائنٍ عن الله» ـ أي:"], [2061.2, "متّصلٌ به ـ «فغيرُ مخلوق، وكلُّ شيءٍ أُضيف إلى الله بائنٍ عنه فمخلوق»."], [2068.7, "انتهى كلامُه. وقال أيضًا ـ انتبهوا ـ:"], [2077.9, "«إضافةُ الروح إلى الله عز وجل إضافةُ مُلكٍ لا إضافةُ وصف»."], [2085.0, "قلتُ: ويعني به قولَ الله عز وجل:"], [2089.4, "<span class=\"ayah\">﴿فَنَفَخْنَا فِيهَا مِن رُّوحِنَا﴾<\/span> <span class=\"ref\">[الأنبياء: ٩١]<\/span>."]], "tr": [[2043.0, "Tevfik Allah'tandır, derim ki: İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [2052.4, "\"Fiil sıfatlarından Allah'a izafe edilip Allah'tan ayrı olmayan\" —yani O'na bitişik olan— \"şey mahlûk değildir."], [2061.2, "Allah'a izafe edilip O'ndan ayrı olan her şey ise mahlûktur.\" —Sözü burada bitti."], [2068.7, "Yine şöyle demiştir —dikkat edin—:"], [2077.9, "\"Ruhun Allah Azze ve Celle'ye izafesi, mülk izafesidir, vasıf izafesi değildir.\" Derim ki:"], [2085.0, "Bununla Allah Azze ve Celle'nin <span class=\"ayah\">﴿Ona ruhumuzdan üfledik﴾<\/span> [Enbiyâ 91] sözünü kastediyor."]]}, {"reader": false, "ar": [[2096.0, "أُعيد كلامَه مرّةً أخرى:"], [2100.0, "«إضافةُ الروح إلى الله عز وجل إضافةُ مُلكٍ لا إضافةُ وصف؛ إذ كلُّ ما يُضاف إلى الله إن كان عينًا قائمةً بنفسها فهو مُلكٌ له، وإن كان صفةً قائمةً بغيرها ليس لها محلٌّ تقوم به فهو صفةٌ لله عز وجل»."]], "tr": [[2096.0, "Sözünü bir kez daha tekrar ediyorum:"], [2100.0, "\"Ruhun Allah Azze ve Celle'ye izafesi, mülk izafesidir, vasıf izafesi değildir."], [2104.2, "Zira Allah'a izafe edilen her şey, eğer kendi başına kâim bir ayn (varlık) ise O'nun mülküdür;"], [2111.3, "eğer başkasıyla kâim olan, kendisiyle kâim olacağı (başka) bir mahalli bulunmayan bir sıfat ise Allah Azze ve Celle'nin sıfatıdır.\""]]}, {"reader": false, "ar": [[2120.0, "وقال رحمه الله تعالى:"], [2128.0, "«ما أُضيف إلى الله عز وجل ـ أو قيل: هو منه ـ فعلى وجهين: إن كان عينًا قائمةً بنفسها فهو مملوكٌ له، و\"مِن\" لابتداء الغاية، كما قال الله عز وجل: <span class=\"ayah\">﴿فَأَرْسَلْنَا إِلَيْهَا رُوحَنَا﴾<\/span> <span class=\"ref\">[مريم: ١٧]<\/span>، وقال في المسيح: <span class=\"ayah\">﴿وَرُوحٌ مِّنْهُ﴾<\/span> <span class=\"ref\">[النساء: ١٧١]<\/span>. وما كان صفةً لا يقوم بنفسه كالعلم والكلام فهو الصفةُ له، كما يقال: كلامُ الله، وعلمُ الله». انتهى كلامُه."]], "tr": [[2120.0, "(İbn Teymiyye) —Allah ona rahmet etsin— şöyle demiştir:"], [2120.6, "\"Allah Azze ve Celle'ye izafe edilen —veya 'O'ndandır' denilen— şey iki türlüdür:"], [2121.7, "Eğer kendi başına kâim bir ayn ise O'nun mülküdür ve 'min' (-den) edatı başlangıç (ibtidâü'l-gâye) içindir."], [2128.0, "Nitekim Allah Azze ve Celle <span class=\"ayah\">﴿Ona ruhumuzu gönderdik﴾<\/span> [Meryem 17] buyurmuş, Mesîh hakkında da <span class=\"ayah\">﴿O'ndan bir ruhtur﴾<\/span> [Nisâ 171] buyurmuştur."], [2142.4, "İlim ve kelâm gibi kendi başına kâim olmayan bir sıfat ise, o O'nun sıfatıdır;"], [2155.5, "'Allah'ın kelâmı', 'Allah'ın ilmi' denildiği gibi.\" —Sözü burada bitti."]]}, {"reader": false, "ar": [[2164.0, "وقال أيضًا: «المضافُ إلى الله عز وجل نوعان؛ فإنّ المضاف إمّا أن يكون صفةً لا تقوم بنفسها، كالعلم والقدرة والكلام والحياة، وإمّا أن يكون عينًا قائمةً بنفسها. فالأوّل إضافةُ صفة، كقوله: <span class=\"ayah\">﴿وَلَا يُحِيطُونَ بِشَيْءٍ مِّنْ عِلْمِهِ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>، وقوله: <span class=\"ayah\">﴿إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ﴾<\/span> <span class=\"ref\">[الذاريات: ٥٨]<\/span>، وقوله: <span class=\"ayah\">﴿أَوَلَمْ يَرَوْا أَنَّ اللَّهَ الَّذِي خَلَقَهُمْ هُوَ أَشَدُّ مِنْهُمْ قُوَّةً﴾<\/span> <span class=\"ref\">[فصلت: ١٥]<\/span>،"]], "tr": [[2164.0, "Yine şöyle demiştir: \"Allah Azze ve Celle'ye izafe edilen iki türlüdür."], [2170.0, "Çünkü muzâf, ya ilim, kudret, kelâm ve hayat gibi kendi başına kâim olmayan bir sıfattır ya da kendi başına kâim bir ayndır."], [2179.5, "Birincisi sıfat izafesidir. Şu sözü gibi:"], [2181.9, "<span class=\"ayah\">﴿Onlar O'nun ilminden hiçbir şeyi kuşatamazlar﴾<\/span> [Bakara 255];"], [2187.7, "şu sözü: <span class=\"ayah\">﴿Şüphesiz rızık veren, kuvvet sahibi, metîn olan ancak Allah'tır﴾<\/span> [Zâriyât 58];"], [2194.0, "şu sözü: <span class=\"ayah\">﴿Onları yaratan Allah'ın kuvvetçe kendilerinden daha üstün olduğunu görmediler mi?﴾<\/span> [Fussilet 15];"]]}, {"reader": false, "ar": [[2201.0, "وقولُ النبيّ صلى الله عليه وسلم في الحديث الصحيح،"], [2205.1, "حديثِ الاستخارة: إذا همّ أحدُكم بالأمر فليركع ركعتين من غير الفريضة،"], [2210.1, "ثم ليقل: اللهمّ إنّي أستخيرك بعلمك،"], [2213.8, "وأستقدرك بقدرتك، وأسألك من فضلك،"], [2223.0, "وقولُه تعالى: <span class=\"ayah\">﴿وَتَمَّتْ كَلِمَتُ رَبِّكَ صِدْقًا وَعَدْلًا﴾<\/span> <span class=\"ref\">[الأنعام: ١١٥]<\/span>،"], [2229.0, "وقولُه: <span class=\"ayah\">﴿ذَٰلِكُمْ حُكْمُ اللَّهِ يَحْكُمُ بَيْنَكُمْ﴾<\/span> <span class=\"ref\">[الممتحنة: ١٠]<\/span>،"], [2233.0, "وقولُه: <span class=\"ayah\">﴿ذَٰلِكَ أَمْرُ اللَّهِ أَنزَلَهُ إِلَيْكُمْ﴾<\/span> <span class=\"ref\">[الطلاق: ٥]<\/span>»."], [2236.0, "قلتُ: أي كلُّ ذلك من باب إضافة الصفة إلى موصوفها."]], "tr": [[2201.0, "Peygamber sallallâhu aleyhi ve sellem'in sahih hadisteki, istihâre hadisindeki şu sözü:"], [2206.0, "'Biriniz bir işe niyet ettiğinde farz dışında iki rekât namaz kılsın, sonra şöyle desin:"], [2211.0, "Allah'ım! İlminle senden hayır diliyorum, kudretinle senden güç istiyorum ve fazlından istiyorum';"], [2217.3, "Allah Teâlâ'nın şu sözü: <span class=\"ayah\">﴿Rabbinin kelimesi doğruluk ve adalet bakımından tamamlanmıştır﴾<\/span> [En'âm 115];"], [2229.7, "şu sözü: <span class=\"ayah\">﴿Bu, Allah'ın hükmüdür; aranızda O hükmeder﴾<\/span> [Mümtehine 10];"], [2233.5, "şu sözü: <span class=\"ayah\">﴿Bu, Allah'ın size indirdiği emridir﴾<\/span> [Talâk 5].\" Derim ki:"], [2238.4, "Yani bunların hepsi sıfatın mevsûfuna izafesi babındandır."]]}, {"reader": false, "ar": [[2242.0, "ثم قال مفرِّعًا عن النوع الثاني،"], [2245.0, "قال: «والثاني إضافةُ عين، كقوله: <span class=\"ayah\">﴿وَطَهِّرْ بَيْتِيَ لِلطَّائِفِينَ﴾<\/span> <span class=\"ref\">[الحج: ٢٦]<\/span>، وقوله: <span class=\"ayah\">﴿نَاقَةَ اللَّهِ وَسُقْيَاهَا﴾<\/span> <span class=\"ref\">[الشمس: ١٣]<\/span>، وقوله: <span class=\"ayah\">﴿عَيْنًا يَشْرَبُ بِهَا عِبَادُ اللَّهِ﴾<\/span> <span class=\"ref\">[الإنسان: ٦]<\/span>. فالمضاف في الأوّل صفةٌ لله قائمةٌ به، ليست مخلوقةً له بائنةً عنه، والمضاف في الثاني مملوكٌ له، مخلوقٌ له، بائنٌ عنه، لكنّه مفضَّلٌ مشرَّف لِما خصّه الله به من الصفات التي اقتضت إضافتَه إلى الله تبارك وتعالى، كما خصّ ناقةَ صالحٍ من بين النُّوق، وكما خصّ بيتَه بمكّة من البيوت، وكما خصّ عبادَه الصالحين من بين الخلق."]], "tr": [[2242.0, "Sonra ikinci türü açıklayarak şöyle demiştir:"], [2244.0, "\"İkincisi ayn izafesidir. Şu sözü gibi:"], [2247.2, "<span class=\"ayah\">﴿Tavaf edenler için evimi temizle﴾<\/span> [Hac 26];"], [2253.8, "şu sözü: <span class=\"ayah\">﴿Allah'ın devesine ve onun su içme hakkına (dokunmayın)﴾<\/span> [Şems 13];"], [2263.4, "şu sözü: <span class=\"ayah\">﴿Allah'ın kullarının içtiği bir pınar﴾<\/span> [İnsân 6]."], [2266.8, "Birincideki muzâf, Allah'ın kendisiyle kâim olan sıfatıdır;"], [2268.8, "O'nun yarattığı, O'ndan ayrı bir şey değildir."], [2272.2, "İkincideki muzâf ise O'nun mülküdür, O'nun mahlûkudur, O'ndan ayrıdır;"], [2278.0, "fakat Allah'ın onu has kıldığı ve onun Allah Tebâreke ve Teâlâ'ya izafesini gerektiren sıfatlardan dolayı üstün kılınmış ve şereflendirilmiştir."], [2286.0, "Nitekim Sâlih'in devesini develer arasından, Mekke'deki evini evler arasından, sâlih kullarını da mahlûkat arasından has kılmıştır."]]}, {"reader": false, "ar": [[2293.0, "ومن هذا الباب قولُه عز وجل:"], [2296.0, "<span class=\"ayah\">﴿فَأَرْسَلْنَا إِلَيْهَا رُوحَنَا﴾<\/span> <span class=\"ref\">[مريم: ١٧]<\/span>، فإنّه وصف هذه الروحَ بأنّه <span class=\"ayah\">﴿تَمَثَّلَ لَهَا بَشَرًا سَوِيًّا﴾<\/span> <span class=\"ref\">[مريم: ١٧]<\/span>،"], [2302.0, "وأنّها استعاذت بالله منه إن كان تقيًّا،"], [2305.8, "وأنّه قال: <span class=\"ayah\">﴿إِنَّمَا أَنَا رَسُولُ رَبِّكِ﴾<\/span> <span class=\"ref\">[مريم: ١٩]<\/span>،"], [2309.0, "وهذا كلُّه يدلّ على أنّها» ـ أي:"], [2311.7, "هذه الروح ـ «عينٌ قائمةٌ بنفسها». انتهى كلامُه."]], "tr": [[2293.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Ona ruhumuzu gönderdik﴾<\/span> [Meryem 17] sözü de bu babdandır."], [2296.0, "Çünkü O, bu ruhu <span class=\"ayah\">﴿ona tam bir insan şeklinde göründü﴾<\/span> [Meryem 17] diye vasfetmiş;"], [2300.0, "onun (Meryem'in), eğer takvâ sahibi ise ondan Allah'a sığındığını ve onun <span class=\"ayah\">﴿Ben ancak Rabbinin elçisiyim﴾<\/span> [Meryem 19] dediğini bildirmiştir."], [2306.8, "Bütün bunlar onun\" —yani bu ruhun— \"kendi başına kâim bir ayn olduğuna delalet eder.\" —Sözü burada bitti."]]}]}, {"ts": "38:36", "title": "6. Külliye (devam): Sıfat izafesinin örnekleri", "paras": [{"reader": false, "ar": [[2316.0, "وأظنّ القاعدةَ واضحةً جدًّا."], [2320.0, "وعلى ذلك قولُ الله عز وجل:"], [2322.7, "<span class=\"ayah\">﴿بَلْ يَدَاهُ مَبْسُوطَتَانِ﴾<\/span> <span class=\"ref\">[المائدة: ٦٤]<\/span>، فإنّها من باب إضافة الصفة إلى موصوفها،"], [2327.0, "لأنّ اليد لا تقوم بنفسها."], [2329.0, "وكذلك قولُ الله عز وجل:"], [2332.6, "<span class=\"ayah\">﴿وَيَبْقَىٰ وَجْهُ رَبِّكَ﴾<\/span> <span class=\"ref\">[الرحمن: ٢٧]<\/span> هو من باب إضافة الصفة إلى موصوفها،"], [2338.0, "لأنّ الوجه لا يقوم بنفسه."], [2340.0, "وكذلك قولُ الله عز وجل:"], [2342.5, "<span class=\"ayah\">﴿حَتَّىٰ يَسْمَعَ كَلَامَ اللَّهِ﴾<\/span> <span class=\"ref\">[التوبة: ٦]<\/span>،"], [2344.5, "فإنّه من باب إضافة الصفة إلى موصوفها،"], [2348.0, "لأنّ الكلام لا يقوم إلا بغيره."]], "tr": [[2316.0, "Zannederim kaide gayet açıktır. Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bilakis O'nun iki eli de açıktır﴾<\/span> [Mâide 64] sözü bunun üzerinedir;"], [2322.7, "bu, sıfatın mevsûfuna izafesi babındandır, çünkü el kendi başına kâim olmaz."], [2329.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Rabbinin yüzü bâki kalır﴾<\/span> [Rahmân 27] sözü de sıfatın mevsûfuna izafesi babındandır, çünkü yüz kendi başına kâim olmaz."], [2340.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Ta ki Allah'ın kelâmını işitsin﴾<\/span> [Tevbe 6] sözü de sıfatın mevsûfuna izafesi babındandır, çünkü kelâm ancak başkasıyla kâim olur."]]}, {"reader": false, "ar": [[2351.0, "وكذلك قولُ الله عز وجل:"], [2354.4, "<span class=\"ayah\">﴿وَلَقَدْ سَبَقَتْ كَلِمَتُنَا لِعِبَادِنَا الْمُرْسَلِينَ ۝ إِنَّهُمْ لَهُمُ الْمَنصُورُونَ﴾<\/span> <span class=\"ref\">[الصافات: ١٧١–١٧٢]<\/span>؛"], [2364.0, "فجمع الله عز وجل في هذه الآية بين الإضافتين:"], [2368.0, "فأمّا قوله: <span class=\"ayah\">﴿كَلِمَتُنَا﴾<\/span> فهو من باب إضافة الصفة إلى موصوفها،"], [2373.6, "لأنّ الكلام لا يقوم إلا بغيره،"], [2377.0, "وقوله: <span class=\"ayah\">﴿لِعِبَادِنَا﴾<\/span> ـ <span class=\"ayah\">﴿لِعِبَادِنَا﴾<\/span> ـ فهذا من باب إضافة التشريف والتكريم،"], [2383.0, "لأنّ العباد أعيانٌ قائمةٌ بذاتها."], [2387.0, "وكذلك قولُ النبيّ صلى الله عليه وسلم في الحديث الصحيح:"], [2391.7, "«فيكشف ربُّ العزّة عن ساقه»،"], [2394.0, "فهذا من باب إضافة الصفة إلى موصوفها،"], [2398.1, "لأنّ الساق لا يقوم بنفسه."]], "tr": [[2351.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [2354.4, "<span class=\"ayah\">﴿Andolsun, gönderilen kullarımız hakkında sözümüz geçmiştir: Şüphesiz onlar, mutlaka yardım görecek olanlardır﴾<\/span> [Sâffât 171–172]."], [2364.0, "Allah Azze ve Celle bu ayette iki izafeyi bir araya getirmiştir:"], [2368.0, "<span class=\"ayah\">﴿Sözümüz (kelimemiz)﴾<\/span> ifadesi sıfatın mevsûfuna izafesi babındandır, çünkü kelâm ancak başkasıyla kâim olur."], [2377.7, "<span class=\"ayah\">﴿Kullarımız﴾<\/span> —<span class=\"ayah\">﴿kullarımız﴾<\/span>— ifadesi ise şereflendirme ve ikram izafesi babındandır, çünkü kullar zâtlarıyla kâim olan aynlardır."], [2387.0, "Peygamber sallallâhu aleyhi ve sellem'in sahih hadisteki \"İzzet sahibi Rab baldırını açar\" sözü de sıfatın mevsûfuna izafesi babındandır, çünkü baldır (sâk) kendi başına kâim olmaz."]]}, {"reader": false, "ar": [[2401.0, "وكذلك قولُ الله عز وجل:"], [2403.0, "«ينزل ربُّنا»، فإنّ النزول لا بدّ أن يُضاف إلى موصوفه،"], [2409.0, "وهو من باب إضافة الصفة إلى موصوفها."], [2412.0, "وكذلك قولُ النبيّ صلى الله عليه وسلم:"], [2415.0, "«إنّ قلوب العباد بين إصبعين من أصابع الله»،"], [2421.0, "فهذا من باب إضافة الصفة إلى موصوفها."], [2425.0, "وكذلك قولُ الله عز وجل:"], [2427.1, "«يضحك الله إلى رجلين يقتل أحدُهما الآخر، كلاهما يدخل الجنّة»،"], [2432.0, "فهذا من باب إضافة الصفة إلى موصوفها."], [2436.0, "وكذلك قولُ الله عز وجل:"], [2438.1, "<span class=\"ayah\">﴿بَلْ عَجِبْتُ وَيَسْخَرُونَ﴾<\/span> <span class=\"ref\">[الصافات: ١٢]<\/span>، فهذا من باب إضافة الصفة إلى موصوفها."]], "tr": [[2401.0, "(Hadisteki) \"Rabbimiz iner\" sözü de böyledir;"], [2403.0, "çünkü nüzulün mevsûfuna izafe edilmesi gerekir;"], [2407.8, "bu da sıfatın mevsûfuna izafesi babındandır."], [2412.0, "Peygamber sallallâhu aleyhi ve sellem'in \"Kulların kalpleri Allah'ın parmaklarından iki parmak arasındadır\" sözü de sıfatın mevsûfuna izafesi babındandır."], [2425.0, "\"Allah, biri diğerini öldüren ve ikisi de cennete giren iki adama güler\" sözü de sıfatın mevsûfuna izafesi babındandır."], [2436.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Bilakis ben taaccüp ettim; onlar ise alay ediyorlar﴾<\/span> [Sâffât 12] sözü de sıfatın mevsûfuna izafesi babındandır."]]}]}, {"ts": "40:45", "title": "7. Külliye: Kendi başına kâim her munfasıl muzâf, şeref, mülk veya yaratma izafesidir", "paras": [{"reader": false, "ar": [[2445.0, "ويؤكّد ذلك القاعدةُ الثانية،"], [2448.0, "والتي لن نذكر عليها إلا مجرّدَ التمثيل فقط:"], [2452.0, "الكلّيّة السابعة: <b>كلُّ مضافٍ منفصلٍ قائمٍ بنفسه فإضافةُ تشريفٍ أو مُلكٍ أو خلق.<\/b> <b>كلُّ مضافٍ منفصلٍ قائمٍ بنفسه فإضافةُ تشريفٍ أو مُلكٍ أو خلق.<\/b>"]], "tr": [[2445.0, "Bunu ikinci kaide te'kid eder;"], [2448.5, "onun için sadece misal vermekle yetineceğiz:"], [2452.0, "7. külliye: Kendi başına kâim olan her munfasıl muzâf (Allah'a izafe edilen ayrı şey), şereflendirme, mülk veya yaratma izafesidir. 7."], [2462.7, "külliye: Kendi başına kâim olan her munfasıl muzâf, şereflendirme, mülk veya yaratma izafesidir."]]}, {"reader": false, "ar": [[2476.0, "كقول الله عز وجل:"], [2478.3, "<span class=\"ayah\">﴿أَن طَهِّرَا بَيْتِيَ﴾<\/span> <span class=\"ref\">[البقرة: ١٢٥]<\/span>؛ فإضافةُ البيت هنا إضافةُ عينٍ منفصلةٍ عن الله عز وجل قائمةٍ بنفسها،"], [2485.0, "فهي من باب إضافة التشريف والتكريم."], [2488.0, "وكقوله: <span class=\"ayah\">﴿وَعِبَادُ الرَّحْمَٰنِ﴾<\/span> <span class=\"ref\">[الفرقان: ٦٣]<\/span>، فهذا من باب إضافة العين المنفصلة عن الله عز وجل والقائمة بنفسها،"], [2496.0, "فهي من باب إضافة التشريف والتكريم."], [2498.0, "وقولُ الله عز وجل:"], [2500.0, "<span class=\"ayah\">﴿سُبْحَانَ الَّذِي أَسْرَىٰ بِعَبْدِهِ﴾<\/span> <span class=\"ref\">[الإسراء: ١]<\/span>،"], [2502.0, "فهذا من باب إضافة التشريف والتكريم."], [2505.0, "وكقوله: <span class=\"ayah\">﴿هَٰذِهِ نَاقَةُ اللَّهِ لَكُمْ آيَةً﴾<\/span> <span class=\"ref\">[الأعراف: ٧٣]<\/span>،"], [2508.0, "فهو من باب إضافة التشريف والتكريم."], [2510.0, "وقولُ الله عز وجل:"], [2512.2, "<span class=\"ayah\">﴿وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ﴾<\/span> <span class=\"ref\">[الأحزاب: ٤٠]<\/span>،"], [2515.0, "فهو من باب إضافة التشريف والتكريم. والمسألة واضحة."]], "tr": [[2476.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Evimi temizleyin﴾<\/span> [Bakara 125] sözü gibi."], [2480.0, "Burada evin izafesi, Allah Azze ve Celle'den ayrı ve kendi başına kâim bir aynın izafesidir;"], [2485.0, "dolayısıyla şereflendirme ve ikram izafesi babındandır."], [2488.0, "Şu sözü gibi: <span class=\"ayah\">﴿Rahmân'ın kulları﴾<\/span> [Furkân 63];"], [2491.8, "bu da Allah Azze ve Celle'den ayrı ve kendi başına kâim olan aynın izafesi babındandır;"], [2496.3, "dolayısıyla şereflendirme ve ikram izafesi babındandır."], [2498.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Kulunu geceleyin yürüten (Allah) münezzehtir﴾<\/span> [İsrâ 1] sözü de şereflendirme ve ikram izafesi babındandır."], [2505.0, "Şu sözü gibi: <span class=\"ayah\">﴿İşte size bir mucize olarak Allah'ın devesi﴾<\/span> [A'râf 73];"], [2508.3, "bu da şereflendirme ve ikram izafesi babındandır."], [2510.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Fakat o, Allah'ın Resûlü ve peygamberlerin sonuncusudur﴾<\/span> [Ahzâb 40] sözü de şereflendirme ve ikram izafesi babındandır. Mesele açıktır."]]}]}, {"ts": "42:00", "title": "7. Külliye (devam): 1. mesele — Allah'a izafe edilen gölge (zıll)", "paras": [{"reader": false, "ar": [[2520.0, "ولكن نختم هذه القاعدة بمسألتين خطيرتين في باب الإضافة:"], [2529.0, "المسألةُ الأولى: إن قلت:"], [2533.4, "ما تقول في إضافة الظلّ إلى الله عز وجل في قوله صلى الله عليه وسلم:"], [2546.0, "«سبعةٌ يُظلّهم الله في ظلّه يوم لا ظلَّ إلا ظلُّه»؟"], [2552.0, "والأحاديثُ التي يُضيف اللهُ عز وجل الظلَّ له فيها كثيرةٌ جدًّا."], [2559.0, "فهل هذا من باب إضافة المتّصل أو من باب إضافة المنفصل؟"]], "tr": [[2520.0, "Fakat bu kaideyi izafe babındaki iki önemli meseleyle bitirelim."], [2533.4, "Birinci mesele: Eğer \"Peygamber sallallâhu aleyhi ve sellem'in 'Yedi kişi vardır ki, Allah onları, kendi gölgesinden başka hiçbir gölgenin bulunmadığı günde kendi gölgesinde gölgelendirir' sözünde gölgenin Allah Azze ve Celle'ye izafesi hakkında ne dersin?\" dersen —ki Allah Azze ve Celle'nin gölgeyi kendisine izafe ettiği hadisler pek çoktur—:"], [2559.0, "Bu, muttasıl (bitişik) izafesi babından mıdır, yoksa munfasıl (ayrı) izafesi babından mı?"]]}, {"reader": false, "ar": [[2569.0, "الجواب: لا بدّ أن تعلم ـ أيّها السنّيّ ـ أنّ هذه المسألة من مسائل الخلاف،"], [2578.7, "الدائرِ خلافُها بين أهل السنّة أنفسهم."], [2582.0, "والمتقرِّر في القواعد عند أهل السنّة والجماعة أنّ كلَّ مسألةٍ عقديّةٍ ثبت خلافُ أهل السنّة فيها فإنّها لا تُعتبر من مسائل الدين الكبار التي يُوالى ويُعادى عليها."], [2600.0, "وبناءً على ذلك فلا يجوز أن نجعلها مَناطًا للتبديع،"], [2606.0, "ولا للإخراج عن دائرة أهل السنّة،"], [2611.0, "ولا للتكفير من باب أَولى،"], [2615.0, "ولا يجوز أن نتراشق فيها بالتُّهَم."]], "tr": [[2569.0, "Cevap: Ey Sünnî, bilmelisin ki bu mesele, hakkındaki ihtilaf bizzat Ehl-i Sünnet arasında cereyan eden ihtilaf meselelerindendir."], [2582.0, "Ehl-i Sünnet ve'l-Cemaat nezdinde kaidelerde yerleşik olan şudur:"], [2588.6, "Hakkında Ehl-i Sünnet'in ihtilafı sabit olan her akîde meselesi, üzerine dostluk ve düşmanlık kurulan büyük din meselelerinden sayılmaz."], [2600.0, "Buna binaen onu bid'atçılıkla itham etmeye, Ehl-i Sünnet dairesinden çıkarmaya ve evleviyetle tekfire dayanak (menât) yapmamız caiz değildir."], [2613.4, "Onda birbirimize itham okları atmamız da caiz değildir."]]}, {"reader": false, "ar": [[2619.0, "فبما أنّ الخلاف فيها ثابتٌ عن أهل السنّة أنفسهم،"], [2625.0, "فحينئذٍ كلٌّ منّا يرجّح فيها ما يراه أقربَ إلى الحقّ والصواب،"], [2632.0, "مع سلامة الطرف الآخر من حقد القلب وسوء منطق الألفاظ،"], [2637.0, "أو التبديع والتفسيق والتضليل والتكفير. هذا أوّلًا. فهمتموها؟"]], "tr": [[2619.0, "Onda ihtilaf bizzat Ehl-i Sünnet'ten sabit olduğuna göre, o hâlde her birimiz onda hakka ve doğruya daha yakın gördüğünü tercih eder;"], [2631.4, "ama diğer taraf, kalbin kininden, lafızların kötü söylenişinden veya bid'atçılık, fasıklık, sapıklık ve küfür ithamından salim kalır. Bu birincisi. Anladınız mı?"]]}, {"reader": false, "ar": [[2646.0, "وأمّا ثانيًا: فاعلم ـ رحمك الله تعالى ـ أنّ لأهل السنّة هنا جُمَلًا من الأقوال،"], [2652.0, "منها ما هو قويّ ومنها ما هو ضعيف."], [2657.0, "وحتى لا أُطيل عليكم أقول:"], [2662.4, "إنّ أقوى ما قيل في هذه المسألة قولان:"], [2666.0, "القولُ الأوّل: أنّ المراد بالظلّ المضاف إلى الله إنما هو ظلُّ عرشه ـ إنما هو ظلُّ عرشه ـ."]], "tr": [[2646.0, "İkincisi: Bil ki —Allah Teâlâ sana rahmet etsin— Ehl-i Sünnet'in burada birtakım görüşleri vardır;"], [2653.2, "bunlardan bazısı kuvvetli, bazısı zayıftır."], [2657.0, "Size uzun tutmamak için derim ki:"], [2662.4, "Bu meselede söylenenlerin en kuvvetlisi iki görüştür."], [2666.0, "Birinci görüş: Allah'a izafe edilen gölgeden kastedilen, ancak O'nun Arşının gölgesidir —ancak Arşının gölgesidir."]]}, {"reader": false, "ar": [[2677.0, "وهذا قولُ أكثر أهل السنّة والجماعة،"], [2684.0, "بل هو القول المأثور عن جماعةٍ كثيرةٍ من السلف رحمهم الله تعالى."], [2689.0, "وذلك لأنّ الظلّ المطلق في بعض الأحاديث ورد مقيّدًا بالأسانيد المقبولة بأنّه ظلُّ العرش،"], [2707.0, "كما سيأتي إن شاء الله."], [2708.0, "والمتقرِّر في القواعد أنّ المطلق يُبنى على المقيّد مع الاتّفاق في الحكم والسبب."], [2718.0, "وبناءً على ذلك فيصحّ لنا أن نقول:"], [2721.5, "كلُّ حديثٍ فيه إضافةُ الظلّ إلى الله عز وجل فالمقصودُ به ظلُّ العرش."]], "tr": [[2677.0, "
