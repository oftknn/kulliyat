Bu, Ehl-i Sünnet ve'l-Cemaat'in çoğunluğunun görüşüdür;"], [2684.0, "hatta seleften —Allah onlara rahmet etsin— pek çok kimseden nakledilen görüştür."], [2689.0, "Çünkü bazı hadislerde mutlak olarak geçen gölge, makbul isnadlarla Arşın gölgesi olarak kayıtlı (mukayyed) gelmiştir;"], [2697.1, "inşallah geleceği gibi. Kaidelerde yerleşik olan şudur:"], [2708.0, "Hüküm ve sebepte ittifak bulunduğunda mutlak, mukayyed üzerine bina edilir."], [2718.0, "Buna binaen şöyle dememiz sahih olur:"], [2721.5, "Gölgenin Allah Azze ve Celle'ye izafe edildiği her hadiste kastedilen Arşın gölgesidir."]]}]}, {"ts": "45:30", "title": "1. mesele (devam): \"Arşın gölgesi\" rivayeti ve bu görüşü seçenler; ikinci görüş: gölge Allah'ın sıfatıdır", "paras": [{"reader": false, "ar": [[2730.0, "وذلك لِما رواه سعيد بن منصور رحمه الله تعالى في «سننه» من حديث سلمان رضي الله عنه بلفظ:"], [2742.0, "«سبعةٌ يُظلّهم الله في ظلّ عرشه»،"], [2745.0, "وذكر الحديث. وهي روايةٌ حسّن إسنادَها ابنُ حجر رحمه الله تعالى،"], [2752.3, "وجزم بها القرطبيّ وكذلك النوويّ،"], [2757.0, "بل واستشهد بها أبو العبّاس ابن تيميّة رحمه الله تعالى ونسبها للصحيحين،"], [2764.0, "واستدلّ بها الإمام ابن القيّم رحمه الله تعالى كما في «طريق الهجرتين»،"], [2771.0, "وكذلك اعتمدها الشيخ السعديّ رحمه الله تعالى في تفسيره."]], "tr": [[2730.0, "Bu, Saîd b. Mansûr'un —Allah ona rahmet etsin— \"Sünen\"inde Selmân'dan —Allah ondan razı olsun— rivayet ettiği şu lafızdan dolayıdır:"], [2737.2, "\"Yedi kişi vardır ki, Allah onları Arşının gölgesinde gölgelendirir\" —ve hadisi zikretti."], [2742.0, "Bu, İbn Hacer'in —Allah ona rahmet etsin— isnadını hasen gördüğü bir rivayettir."], [2744.0, "Kurtubî ve Nevevî de onu kesin olarak zikretmiştir."], [2746.3, "Hatta Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— onu delil olarak zikretmiş ve Sahîhayn'a nispet etmiştir."], [2759.9, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— de \"Tarîkü'l-hicreteyn\"de olduğu gibi onunla istidlal etmiştir."], [2768.7, "Şeyh es-Sa'dî —Allah ona rahmet etsin— de tefsirinde ona dayanmıştır."]]}, {"reader": false, "ar": [[2776.0, "بل هذا القول هو اختيار الإمام الحافظ ابن منده رحمه الله تعالى كما في كتاب «التوحيد»،"], [2785.0, "واختارها الإمام الطحاويّ رحمه الله تعالى كما في «مشكل الآثار»،"], [2790.0, "واختارها الإمام ابن عبد البرّ كما في «التمهيد»،"], [2795.0, "واختارها الإمام البغويّ كما في «شرح السنّة»،"], [2801.0, "واختارها الإمام ابن القيّم في أكثر من موضعٍ من كتبه،"], [2808.0, "والتي منها «طريق الهجرتين»،"], [2811.0, "بل واختارها الإمام ابن رجب كما في كتابه «فتح الباري»،"], [2817.0, "واختارها أيضًا السيوطيّ في كتابه «تمهيد الفَرْش في الخصال الموجبة لظلّ العرش»،"], [2826.0, "واختارها غيرُهم، رحم الله الجميع رحمةً واسعة."]], "tr": [[2776.0, "Hatta bu görüş, \"Kitâbü't-Tevhîd\"de olduğu gibi İmam Hâfız İbn Mende'nin —Allah ona rahmet etsin— tercihidir."], [2783.3, "\"Müşkilü'l-âsâr\"da olduğu gibi İmam Tahâvî —Allah ona rahmet etsin— onu tercih etmiştir."], [2789.0, "\"et-Temhîd\"de olduğu gibi İmam İbn Abdilber onu tercih etmiştir."], [2793.6, "\"Şerhu's-Sünne\"de olduğu gibi İmam Beğavî onu tercih etmiştir."], [2799.5, "İmam İbnü'l-Kayyim de kitaplarının birden fazla yerinde —ki bunlardan biri \"Tarîkü'l-hicreteyn\"dir— onu tercih etmiştir."], [2808.8, "Hatta İmam İbn Receb de \"Fethu'l-Bârî\" adlı kitabında olduğu gibi onu tercih etmiştir."], [2816.2, "Süyûtî de \"Temhîdü'l-ferş fi'l-hısâli'l-mûcibe li-zılli'l-arş\" adlı kitabında onu tercih etmiştir."], [2822.8, "Başkaları da onu tercih etmiştir."], [2826.6, "Allah hepsine geniş rahmetiyle rahmet etsin."]]}, {"reader": false, "ar": [[2830.0, "وهذا القول هو أقوى القولين في الأصحّ."], [2836.0, "ولكن لا يمنعنا من ذلك أن نقول أيضًا بالقول الثاني،"], [2841.0, "فنجعل الظلّ المضاف إلى الله عز وجل يصلح تأويلُه ـ أو تفسيرُه ـ بالظلّين:"], [2848.0, "الظلِّ الذي هو صفتُه،"], [2850.8, "والظلِّ الذي هو ظلُّ عرشه."], [2855.0, "وبه يتبيّن لك أنّ القول الآخر هو قولُ من قال:"], [2863.0, "بأنّه ظلٌّ هو صفةٌ لله عز وجل،"], [2866.0, "الله أعلم بكيفيّته، يُمَرُّ كما جاء في النصوص،"], [2872.0, "ونُثبته من غير تأويلٍ ولا تحريفٍ ولا تعطيلٍ ولا تكييفٍ ولا تمثيلٍ ولا إلحاد."]], "tr": [[2830.0, "En sahih olana göre bu görüş, iki görüşün en kuvvetlisidir."], [2836.0, "Fakat bu, ikinci görüşü de söylememize engel değildir."], [2840.5, "Böylece Allah Azze ve Celle'ye izafe edilen gölgenin iki gölgeyle te'vil —veya tefsir— edilmesinin uygun olduğunu söyleriz:"], [2855.0, "O'nun sıfatı olan gölge ve O'nun Arşının gölgesi olan gölge."], [2863.0, "Bununla sana açıkça anlaşılır ki diğer görüş, onun Allah Azze ve Celle'nin sıfatı olan bir gölge olduğunu söyleyenlerin görüşüdür:"], [2871.2, "Keyfiyetini Allah bilir; nasslarda geldiği gibi geçirilir;"], [2875.4, "onu te'vil, tahrif, ta'til, tekyîf, temsil ve ilhad olmaksızın isbat ederiz."]]}, {"reader": false, "ar": [[2882.0, "ولا يجوز أن نسمح لعقولنا أن تجعل عليه لوازمَ باطلة،"], [2888.0, "كبعض اللوازم على ظلّ المخلوق؛"], [2891.0, "فكما أنّ الله عز وجل ليس كمثله شيءٌ في ذاته،"], [2898.0, "فكذلك أيضًا ليس كمثله شيءٌ في صفاته، والتي منها ظلُّه."]], "tr": [[2882.0, "Aklımızın ona, mahlûkun gölgesindeki bazı lâzımlar gibi bâtıl lâzımlar yüklemesine izin vermemiz caiz değildir."], [2889.8, "Allah Azze ve Celle'nin zâtında O'nun benzeri hiçbir şey olmadığı gibi, sıfatlarında da —ki bunlardan biri O'nun gölgesidir— O'nun benzeri hiçbir şey yoktur."]]}, {"reader": false, "ar": [[2904.0, "ولكنّي لا أعلم عن أحدٍ من السلف الأوائل أنّه نصّ عليها بخصوصها،"], [2914.0, "إلا إذا قلنا بأنّ قاعدة السلف العامّة أنّ كلّ شيءٍ يُضاف إلى الله عز وجل ممّا لا يقوم بنفسه فإنّه من باب إضافة الصفة إلى موصوفها."], [2927.0, "ولكن لم أجد إلى ساعتي هذه من نصّ عليها بخصوصها،"], [2934.0, "كما وُجد من نصّ على أنّه ظلُّ العرش،"], [2940.0, "ممّن ذكرتُ لكم طرفًا من أسمائهم."], [2943.0, "ولكن حتى وإن لم نجد من نصّ عليها،"], [2946.0, "فلا جَرَمَ أنّه قولٌ مخرَّجٌ على القواعد المقرَّرة في التعامل مع صفات ـ مع صفات الله عز وجل."]], "tr": [[2904.0, "Fakat ilk selef âlimlerinden herhangi birinin özellikle bunu açıkça söylediğini bilmiyorum;"], [2913.2, "meğer ki şöyle diyelim: Selefin genel kaidesi şudur:"], [2919.4, "Allah Azze ve Celle'ye izafe edilip kendi başına kâim olmayan her şey, sıfatın mevsûfuna izafesi babındandır."], [2927.0, "Fakat bu saatime kadar özellikle bunu açıkça söyleyen birini bulamadım;"], [2934.0, "size isimlerinin bir kısmını zikrettiğim kimselerden onun Arşın gölgesi olduğunu açıkça söyleyenlerin bulunduğu gibi."], [2943.0, "Fakat bunu açıkça söyleyen birini bulamasak bile, şüphesiz bu, sıfatlarla —Allah Azze ve Celle'nin sıfatlarıyla— muamelede yerleşik kaideler üzerine tahric edilmiş bir görüştür."]]}, {"reader": false, "ar": [[2954.0, "ولذلك اختار هذا القولَ شيخُنا سماحةُ الشيخ عبد العزيز ابن باز رحمه الله،"], [2962.0, "واختاره الشيخ عبد العزيز الراجحيّ أيضًا،"], [2966.0, "واختاره شيخُنا الشيخ عبد الكريم الخضير،"], [2968.6, "وغيرُهم. ولكن لا أعلمه بعينه منسوبًا إلى أحدٍ من السلف الأوائل."], [2977.0, "ولكن كما قلتُ لكم في أوّل الأمر:"], [2980.1, "بأنّ أقوى ما قيل في الظلّ المضاف إلى الله عز وجل هما هذان القولان،"], [2989.0, "وإن حملنا الظلّ المضاف إلى الله عز وجل على الأمرين جميعًا فلا نكون مخطئين في ذلك،"], [2999.0, "لأنّهما قولان قال بهما أهلُ السنّة والجماعة."]], "tr": [[2954.0, "Bu sebeple bu görüşü hocamız Semâhatü'ş-Şeyh Abdülazîz b."], [2959.5, "Bâz —Allah ona rahmet etsin— tercih etmiştir."], [2964.7, "Şeyh Abdülazîz er-Râcihî de onu tercih etmiştir."], [2969.0, "Hocamız Şeyh Abdülkerîm el-Hudayr ve başkaları da onu tercih etmiştir."], [2977.0, "Fakat bizzat onun ilk selef âlimlerinden birine nispet edildiğini bilmiyorum."], [2978.7, "Ancak işin başında size söylediğim gibi:"], [2980.1, "Allah Azze ve Celle'ye izafe edilen gölge hakkında söylenenlerin en kuvvetlisi bu iki görüştür."], [2987.9, "Allah Azze ve Celle'ye izafe edilen gölgeyi her iki manaya birden hamledersek, bunda hata etmiş olmayız;"], [2998.4, "çünkü bunlar Ehl-i Sünnet ve'l-Cemaat'in söylediği iki görüştür."]]}]}, {"ts": "50:04", "title": "Şeyh'in tercihi · 2. mesele: Allah'a izafe edilen rahmet", "paras": [{"reader": false, "ar": [[3004.0, "فالقولُ الأقرب عندي في هذه المسألة هو حملُ الظلّ على هذين المحمَلين:"], [3013.0, "فيُفسَّر بأنّه ظلُّ العرش فيما ورد التقييدُ به،"], [3019.0, "ويُفسَّر على أنّه ظلُّه الذي هو صفتُه،"], [3023.1, "نُثبته كما نُثبت سائرَ صفاته."], [3026.0, "ونقول فيها بأنّ المتقرِّر في القواعد أنّ الاتّفاق في الأسماء لا يستلزم الاتّفاقَ في الصفات،"], [3035.0, "ونقول أيضًا بأنّ المتقرِّر في القواعد أنّ الاتّفاق في الاسم الكلّيّ العامّ لا يستلزم الاتّفاقَ بعد الإضافة والتقييد والتخصيص."]], "tr": [[3004.0, "Bu meselede bana göre en yakın görüş, gölgeyi bu iki manaya hamletmektir:"], [3010.5, "Kayıtla geldiği yerlerde Arşın gölgesi olarak tefsir edilir;"], [3013.0, "O'nun sıfatı olan gölgesi olarak da tefsir edilir ve onu diğer sıfatlarını isbat ettiğimiz gibi isbat ederiz."], [3021.9, "Bu konuda şöyle deriz: Kaidelerde yerleşik olan şudur:"], [3026.0, "İsimlerde ortaklık, sıfatlarda ortaklığı gerektirmez."], [3030.5, "Yine şöyle deriz: Kaidelerde yerleşik olan şudur:"], [3036.0, "Genel küllî isimde ortaklık, izafe, takyid ve tahsisten sonra ortaklığı gerektirmez."]]}, {"reader": false, "ar": [[3045.0, "فإن قلت: وهل لها من الصفات نظائر؟"], [3049.1, "فأقول: نعم، وهي المسألة الثانية،"], [3052.0, "وهي صفةُ الرحمة المضافة إلى الله عز وجل ـ وهي صفةُ الرحمة المضافة إلى الله عز وجل في الأدلّة كتابًا وسنّةً ـ؛"], [3063.0, "فإنّ الرحمة المضافة إلى الله عز وجل تنقسم إلى نوعين:"], [3070.0, "الأوّل: الصفةُ القائمة به تعالى،"], [3073.2, "وهذه ليست مخلوقةً ولا حدَّ لها،"], [3077.0, "فهو الرحمنُ الرحيم، <span class=\"ayah\">﴿وَرَبُّكَ الْغَفُورُ ذُو الرَّحْمَةِ﴾<\/span> <span class=\"ref\">[الكهف: ٥٨]<\/span>،"], [3081.8, "<span class=\"ayah\">﴿وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ﴾<\/span> <span class=\"ref\">[الأعراف: ١٥٦]<\/span>،"], [3086.0, "«إنّ رحمتي سبقت ـ أو قال: غلبت ـ غضبي»."], [3089.0, "فالرحمةُ المضافة إلى الله عز وجل في هذه النصوص وما يماثلها هي الرحمةُ التي هي صفتُه،"], [3098.0, "نُثبتها لله عز وجل على الوجه اللائق به."]], "tr": [[3045.0, "Eğer \"Sıfatlarda bunun benzerleri var mıdır?\" dersen, derim ki:"], [3049.1, "Evet. Bu, ikinci meseledir: Allah Azze ve Celle'ye izafe edilen rahmet sıfatı —Kitap ve Sünnet delillerinde Allah Azze ve Celle'ye izafe edilen rahmet sıfatı."], [3058.4, "Allah Azze ve Celle'ye izafe edilen rahmet iki türe ayrılır."], [3063.0, "Birincisi: O Teâlâ ile kâim olan sıfat."], [3065.8, "Bu mahlûk değildir ve onun bir sınırı yoktur."], [3070.0, "O, Rahmân ve Rahîm'dir. <span class=\"ayah\">﴿Rabbin bağışlayıcıdır, rahmet sahibidir﴾<\/span> [Kehf 58];"], [3077.7, "<span class=\"ayah\">﴿Rahmetim her şeyi kuşatmıştır﴾<\/span> [A'râf 156];"], [3082.5, "\"Şüphesiz rahmetim gazabımı geçmiştir\" —veya \"galip gelmiştir\" dedi."], [3089.0, "Bu nasslarda ve benzerlerinde Allah Azze ve Celle'ye izafe edilen rahmet, O'nun sıfatı olan rahmettir;"], [3096.2, "onu Allah Azze ve Celle için O'na lâyık olan şekilde isbat ederiz."]]}, {"reader": false, "ar": [[3101.0, "وأمّا النوع الثاني فهو الرحمةُ المخلوقة،"], [3105.0, "وهذه مئةُ رحمة، أنزل الله عز وجل منها رحمةً واحدةً في هذه الدنيا،"], [3117.0, "فبها يتراحم الخلقُ فيما بينهم."], [3120.0, "والدليل على ذلك ما في «الصحيح» من حديث أبي هريرة رضي الله عنه قال:"], [3125.6, "قال النبيّ صلى الله عليه وسلم ـ انتبهوا للّفظ ـ:"], [3130.3, "«إنّ الله خلق الرحمةَ يوم خلقها مئةَ رحمة، فأمسك عنده تسعًا وتسعين رحمة، وأرسل في خلقه كلِّهم رحمةً واحدة، فلو يعلم الكافرُ بكلّ الذي عند الله من الرحمة لم ييأس من الجنّة، ولو يعلم المؤمنُ بكلّ الذي عند الله من العذاب لم يأمن من النار»."]], "tr": [[3101.0, "İkinci tür ise mahlûk rahmettir."], [3104.3, "Bu yüz rahmettir; Allah Azze ve Celle bunlardan birini bu dünyaya indirmiştir;"], [3115.3, "mahlûkat onunla birbirine merhamet eder."], [3120.0, "Bunun delili, \"Sahîh\"te Ebû Hüreyre'den —Allah ondan razı olsun— rivayet edilen hadistir."], [3122.7, "Peygamber sallallâhu aleyhi ve sellem —lafza dikkat edin— şöyle buyurmuştur:"], [3125.6, "\"Allah rahmeti yarattığı gün onu yüz rahmet olarak yarattı."], [3130.3, "Doksan dokuz rahmeti kendi katında tuttu, bütün mahlûkatına bir tek rahmet gönderdi."], [3141.3, "Kâfir, Allah katındaki rahmetin tamamını bilseydi cennetten ümidini kesmezdi."], [3153.8, "Mü'min de Allah katındaki azabın tamamını bilseydi cehennemden emin olmazdı.\""]]}, {"reader": false, "ar": [[3160.0, "ورواه مسلم بلفظ: «إنّ لله مئةَ رحمة، أنزل منها رحمةً واحدةً بين الإنس والجنّ والبهائم والهوامّ، فبها يتراحمون، وبها يتعاطفون، وبها تعطف الوحشُ على ولدها، وأخّر الله عز وجل تسعًا وتسعين رحمةً يرحم بها عبادَه يوم القيامة»."]], "tr": [[3160.0, "Müslim de onu şu lafızla rivayet etmiştir:"], [3162.0, "\"Allah'ın yüz rahmeti vardır. Bunlardan bir tek rahmeti insanlar, cinler, hayvanlar ve haşereler arasına indirmiştir."], [3169.3, "Onunla birbirlerine merhamet ederler, onunla birbirlerine şefkat gösterirler, vahşi hayvan da onunla yavrusuna şefkat gösterir."], [3182.0, "Allah Azze ve Celle doksan dokuz rahmeti, kıyamet günü onlarla kullarına merhamet etmek için ertelemiştir.\""]]}, {"reader": false, "ar": [[3188.0, "فهذه الرحمة المضافة إلى الله عز وجل في هذه الأحاديث إنما هي الرحمةُ التي أُضيفت إلى الله إضافةَ تشريفٍ وتكريم،"], [3200.0, "كإضافة الجنّة، لقول الله عز وجل في قوله:"], [3203.0, "«أنتِ» ـ الجنّةُ ـ «رحمتي، أرحمُ بكِ من أشاء»،"], [3209.0, "فهي من باب إضافة التشريف والتكريم."]], "tr": [[3188.0, "Bu hadislerde Allah Azze ve Celle'ye izafe edilen bu rahmet, ancak Allah'a şereflendirme ve ikram izafesiyle izafe edilen rahmettir;"], [3196.9, "cennetin izafesi gibi. Nitekim Allah Azze ve Celle (kudsî hadiste) şöyle buyurmuştur:"], [3203.0, "\"Sen\" —yani cennet— \"benim rahmetimsin;"], [3206.0, "seninle dilediğime merhamet ederim.\" Bu da şereflendirme ve ikram izafesi babındandır."]]}, {"reader": false, "ar": [[3212.0, "ولعلّكم فهمتم هذه القاعدةَ الكلّيّة."], [3215.0, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمّد،"], [3218.0, "وعلى آله وأصحابه أجمعين. بارك الله فيكم."]], "tr": [[3212.0, "Umarım bu küllî kaideyi anlamışsınızdır."], [3215.0, "Allah daha yücedir ve daha iyi bilir."], [3216.7, "Allah, Peygamberimiz Muhammed'e, âline ve bütün ashâbına salât ve selâm etsin. Allah sizi mübarek kılsın."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();

  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
