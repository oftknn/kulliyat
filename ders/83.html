<script>
const D={"no": 83, "vid": "q8HbwdY9FNs", "title_ar": "الدرس (٨٣) من شرح كليات العقيدة — كليات باب الإيمان: أحكام الدنيا على الظواهر وأحكام الآخرة على السرائر، ومراتب الدين، والإسلام العام والخاص", "title_tr": "Şerhu Külliyyâti'l-Akîde — 83. Ders: İman Babının Külliyeleri (Dünya Hükümleri Zâhire, Ahiret Hükümleri Sırlara Göre; Selefin İman Tanımları; İslâm, İman ve İhsan Mertebeleri; Genel ve Özel İslâm)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Dünya hükümlerinin hepsi zâhire dayanır, sırlar ona tâbidir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.7, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.3, "وعلى آله وأصحابه الطيبين الطاهرين،"], [6.5, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [9.1, "أمّا بعد: عندنا في هذا الدرس جُمَلٌ من الكلّيّات المتعلّقة بمسألة الإيمان ومتعلَّقاته."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.7, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [10.0, "Bundan sonra: Bu derste iman meselesi ve onun taalluklarıyla ilgili bir grup külliye var."]]}, {"reader": false, "ar": [[16.0, "الكلّيّة الأولى: كلُّ أحكام الدنيا فمبنيّةٌ على الظواهر،"], [21.2, "والسرائرُ تَبَعٌ لها. <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [32.0, "وهذه الكلّيّة تُبيّن لك كيف يتعامل الإنسان مع إخوانه المسلمين،"], [39.0, "أو كيف يتعامل الإنسان مع الإنس في هذه الدنيا؛"], [48.0, "وهي أنه يبني هذه الأحكام الدنيويّة على الظواهر،"], [52.9, "ولا شأنَ له بسرائر الناس."], [56.0, "فإنّ البشر لا يعلمون الغيب،"], [57.8, "ولا يطّلعون على ما في القلوب؛"], [60.0, "فالواجب علينا معاملةُ الناس بما ظهر منهم من أقوالٍ وأفعال،"], [67.0, "ولا يجوز لنا أن نُنقّب عن قلوب الناس،"], [71.7, "ولا أن نشُقّ صدورهم،"], [74.0, "وإنما نتعامل معهم بما يُظهرونه."]], "tr": [[16.0, "1. külliye: Dünya hükümlerinin hepsi zâhirler (görünen hâller) üzerine bina edilir;"], [20.5, "sırlar (gizli iç hâller) ona tâbidir. (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [32.0, "Bu külliye sana insanın Müslüman kardeşlerine nasıl muamele edeceğini, ya da insanın bu dünyada insanlara nasıl muamele edeceğini açıklar."], [48.0, "Şöyle ki: Bu dünyevî hükümleri zâhirler üzerine bina eder;"], [52.9, "insanların sırlarıyla bir işi yoktur."], [56.0, "Çünkü beşer gaybı bilmez, kalplerde olana muttali olmaz."], [60.0, "O hâlde bize düşen, insanlara onlardan zâhir olan söz ve fiillerle muamele etmektir."], [68.8, "İnsanların kalplerini araştırmamız, göğüslerini yarmamız caiz değildir;"], [72.8, "onlara ancak açığa vurdukları şeyle muamele ederiz."]]}, {"reader": false, "ar": [[77.0, "وقد استند العلماءُ في تقرير هذه الكلّيّة على جُمَلٍ من الأدلّة كثيرةٍ من كتاب الله عز وجل وسنّة نبيّه صلى الله عليه وسلم؛"], [88.0, "منها قولُ الله عز وجل:"], [90.9, "<span class=\"ayah\">﴿فَإِن تَابُوا وَأَقَامُوا الصَّلَاةَ وَآتَوُا الزَّكَاةَ فَإِخْوَانُكُمْ فِي الدِّينِ﴾<\/span> <span class=\"ref\">[التوبة: ١١]<\/span>؛"], [96.0, "فعلّق أُخوّةَ الدين على أمورٍ ظاهرة:"], [98.8, "إن رأيناها منهم فهم إخوانُنا في الدين،"], [102.0, "وإن لم نرَها منهم فليسوا بإخوةٍ لنا في الدين."], [106.0, "فلا شأنَ لأُخوّة الدين والإيمان فيما بيننا إلا بما يظهر منهم،"], [114.0, "وأمّا سرائرُهم فنَكِلُها إلى الله عز وجل."]], "tr": [[77.0, "Âlimler bu külliyeyi tespit ederken Allah Azze ve Celle'nin Kitabı'ndan ve Peygamberi sallallâhu aleyhi ve sellem'in Sünneti'nden pek çok delile dayanmışlardır."], [86.6, "Bunlardan biri Allah Azze ve Celle'nin şu sözüdür:"], [90.9, "<span class=\"ayah\">﴿Eğer tövbe eder, namazı kılar ve zekâtı verirlerse artık dinde kardeşlerinizdir﴾<\/span> [Tevbe 11]."], [98.8, "(Allah) din kardeşliğini zâhir işlere bağlamıştır:"], [101.1, "Bunları onlarda görürsek dinde kardeşlerimizdir;"], [103.3, "onlarda görmezsek dinde bizim kardeşimiz değildirler."], [106.0, "Aramızdaki din ve iman kardeşliği, ancak onlardan zâhir olana bakar;"], [112.9, "sırlarını ise Allah Azze ve Celle'ye havale ederiz."]]}, {"reader": false, "ar": [[118.0, "ومنها كذلك قولُ الله عز وجل:"], [121.0, "<span class=\"ayah\">﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا ضَرَبْتُمْ فِي سَبِيلِ اللَّهِ فَتَبَيَّنُوا وَلَا تَقُولُوا لِمَنْ أَلْقَىٰ إِلَيْكُمُ السَّلَامَ لَسْتَ مُؤْمِنًا تَبْتَغُونَ عَرَضَ الْحَيَاةِ الدُّنْيَا فَعِندَ اللَّهِ مَغَانِمُ كَثِيرَةٌ﴾<\/span> <span class=\"ref\">[النساء: ٩٤]<\/span>؛"], [136.0, "فنبّه اللهُ عز وجل على قبول ظواهر الناس:"], [141.0, "فإذا سمعتم السلامَ من أحد،"], [143.0, "أو كلمةَ الإسلام من أحد،"], [145.0, "فلا حقَّ لكم ألّا تقبلوها،"], [149.0, "وإنما الواجبُ عليكم أن تقبلوها."]], "tr": [[118.0, "Bunlardan biri de Allah Azze ve Celle'nin şu sözüdür:"], [121.0, "<span class=\"ayah\">﴿Ey iman edenler! Allah yolunda sefere çıktığınızda iyice araştırın; size selâm veren kimseye, dünya hayatının geçici malını arzulayarak \"Sen mümin değilsin\" demeyin. Allah katında pek çok ganimet vardır﴾<\/span> [Nisâ 94]."], [136.0, "Allah Azze ve Celle insanların zâhirlerini kabul etmeye dikkat çekmiştir:"], [141.0, "Birinden selâm veya İslâm kelimesini işittiğinizde onu kabul etmeme hakkınız yoktur;"], [146.3, "aksine onu kabul etmeniz size vaciptir."]]}, {"reader": false, "ar": [[151.0, "وسببُ نزول هذه الآية هو ما في الصحيحين:"], [157.0, "أنّ راعيَ غنمٍ سلّم على جمعٍ من أصحاب النبيّ صلى الله عليه وسلم،"], [164.0, "فقال بعضُهم: إنما سلّم عليكم ليتّقيَ القتل،"], [168.0, "فقاموا عليه فقتلوه، واستاقوا النَّعَمَ إلى النبيّ صلى الله عليه وسلم؛"], [173.0, "فأنزل الله عز وجل عليهم هذه الآية،"], [177.0, "مُنكِرًا على أنهم لم يأخذوا بظاهر الحال."]], "tr": [[151.0, "Bu ayetin nüzul sebebi Sahîhayn'de geçen şu olaydır:"], [157.0, "Bir koyun çobanı Peygamber sallallâhu aleyhi ve sellem'in ashâbından bir topluluğa selâm verdi."], [165.1, "Bazıları \"Size sadece öldürülmekten korunmak için selâm verdi\" dedi;"], [168.7, "üzerine yürüyüp onu öldürdüler ve hayvanlarını Peygamber sallallâhu aleyhi ve sellem'e sürüp getirdiler."], [173.0, "Bunun üzerine Allah Azze ve Celle, hâlin zâhirini esas almamalarını kınayarak onlara bu ayeti indirdi."]]}, {"reader": false, "ar": [[181.0, "ومنها كذلك ما أخرجه الإمامُ البخاريّ في صحيحه من حديث أنسٍ رضي الله عنه،"], [189.0, "قال: قال النبيّ صلى الله عليه وسلم:"], [191.0, "«من صلّى صلاتَنا، واستقبل قبلتَنا، وأكل ذبيحتَنا، فذلك المسلمُ الذي له ذمّةُ الله وذمّةُ رسوله، فلا تُخفِروا اللهَ في ذمّته»."], [205.0, "وهذا دليلٌ على تعليق أُخوّة الدين والإيمان والحكمِ بالإسلام في الظاهر على أمورٍ ظاهرة؛"], [212.0, "من حقّقها فهو أخونا المسلم،"], [214.5, "ولا شأنَ لنا بباطنه أبدًا."]], "tr": [[181.0, "Bunlardan biri de İmam Buhârî'nin Sahîh'inde Enes'in —Allah ondan razı olsun— hadisinden rivayet ettiği şudur:"], [189.3, "Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [191.0, "\"Kim bizim namazımızı kılar, kıblemize yönelir ve kestiğimizi yerse, işte o, Allah'ın ve Resûlü'nün zimmeti (güvencesi) olan Müslümandır."], [203.2, "Allah'ın zimmetine ihanet etmeyin.\" Bu, din ve iman kardeşliğinin ve zâhirde İslâm ile hükmetmenin zâhir işlere bağlandığına delildir;"], [212.0, "bunları gerçekleştiren Müslüman kardeşimizdir ve onun bâtınıyla hiçbir şekilde işimiz yoktur."]]}, {"reader": false, "ar": [[217.0, "ومنها أيضًا ما في الصحيحين من حديث ابن عمر رضي الله عنهما،"], [221.0, "قال: قال النبيّ صلى الله عليه وسلم:"], [224.1, "«أُمرتُ أن أقاتل الناس حتى يشهدوا أن لا إله إلا الله وأنّ محمدًا رسول الله، ويُقيموا الصلاة، ويُؤتوا الزكاة؛ فإذا فعلوا ذلك عصموا منّي دماءَهم وأموالَهم إلا بحقّ الإسلام، وحسابُهم على الله»."], [240.0, "فهذا تعليقٌ لأُخوّة الدين والإيمان وعصمةِ الدماء والأموال بأمورٍ ظاهرة؛"], [247.0, "من حقّقها حقّقنا له ذلك."]], "tr": [[217.0, "Bunlardan biri de Sahîhayn'de İbn Ömer'in —Allah ikisinden razı olsun— hadisinde geçendir:"], [221.4, "Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [224.1, "\"İnsanlarla, Allah'tan başka ilâh olmadığına ve Muhammed'in Allah'ın Resûlü olduğuna şahitlik edinceye, namazı kılıncaya ve zekâtı verinceye kadar savaşmakla emrolundum."], [233.5, "Bunu yaptıklarında İslâm'ın hakkı dışında kanlarını ve mallarını benden korumuş olurlar;"], [240.0, "hesapları da Allah'a kalmıştır.\" Bu, din ve iman kardeşliğinin, kan ve malların dokunulmazlığının zâhir işlere bağlanmasıdır;"], [247.0, "bunları gerçekleştirene biz de bunu tanırız."]]}, {"reader": false, "ar": [[250.0, "ومنها أيضًا في حديث عبد الله بن طارق بن أَشْيَم رضي الله عنه،"], [255.0, "قال: سمعتُ النبيّ صلى الله عليه وسلم يقول:"], [259.0, "«من قال: لا إله إلا الله، وكفر بما يُعبَد من دون الله، حرُم مالُه ودمُه إلا بحقّه، وحسابُه على الله عز وجل»."], [270.0, "ووجهُ الشاهد منه كما ذكرتُ سابقًا."]], "tr": [[250.0, "Bunlardan biri de Abdullah b."], [251.9, "Târık b. Eşyem'in —Allah ondan razı olsun— hadisindedir;"], [255.5, "dedi ki: Peygamber sallallâhu aleyhi ve sellem'i şöyle derken işittim:"], [259.0, "\"Kim 'Lâ ilâhe illallah' der ve Allah'tan başka ibadet edilen şeyleri inkâr ederse, hakkı olan dışında malı ve kanı haram olur;"], [267.0, "hesabı da Allah Azze ve Celle'ye kalmıştır.\" Buradaki delil yönü daha önce zikrettiğim gibidir."]]}, {"reader": false, "ar": [[273.0, "وفي الصحيحين من حديث أسامة بن زيدٍ رضي الله عنهما،"], [277.0, "قال: بعث رسولُ الله صلى الله عليه وسلم سريّةً،"], [281.8, "فصبّحنا الحُرَقاتِ من جُهينة،"], [284.0, "فأدركتُ أنا وصاحبي الأنصاريُّ رجلًا منهم،"], [288.0, "فلمّا رأى شُعاعَ السيف قال:"], [289.9, "أسلمتُ لله ـ أو قال:"], [291.5, "لا إله إلا الله ـ،"], [293.0, "فكفّ الأنصاريُّ عنه، وعلوتُه بالسيف حتى بَرَد."], [298.0, "فجاء الخبرُ إلى النبيّ صلى الله عليه وسلم،"]], "tr": [[273.0, "Sahîhayn'de Üsâme b. Zeyd'in —Allah ikisinden razı olsun— hadisinde (şöyle geçer):"], [277.5, "Dedi ki: Resûlullah sallallâhu aleyhi ve sellem bir seriyye gönderdi;"], [282.4, "Cüheyne'nin Huraka (kolu)na sabah baskını yaptık."], [286.0, "Ben ve Ensâr'dan arkadaşım onlardan bir adama yetiştik."], [289.9, "Adam kılıcın parıltısını görünce \"Allah'a teslim oldum\" —veya \"Lâ ilâhe illallah\"— dedi."], [291.5, "Ensârî ondan elini çekti; ben ise onu kılıçla vurdum, nihayet soğudu (öldü)."], [298.0, "Haber Peygamber sallallâhu aleyhi ve sellem'e ulaştı;"]]}]}, {"ts": "05:02", "title": "1. Külliye (devam): Üsâme ve Mikdâd hadisleri, münafıklara muamele", "paras": [{"reader": false, "ar": [[302.0, "فدعاني وقال: «يا أسامة، أقتلتَه بعد أن قال: لا إله إلا الله؟» قال:"], [307.4, "قلتُ: يا رسول الله،"], [308.9, "إنما كان متعوّذًا. فقال:"], [310.5, "«أفلا شققتَ عن قلبه حتى تعلمَ أقالها أم لا؟ كيف تصنع بلا إله إلا الله إذا جاءت يوم القيامة؟»."]], "tr": [[302.0, "beni çağırdı ve \"Ey Üsâme!"], [303.7, "'Lâ ilâhe illallah' dedikten sonra mı onu öldürdün?\" dedi."], [307.4, "(Üsâme) dedi ki: \"Ey Allah'ın Resûlü, o sadece (ölümden) sığınmak için söyledi\" dedim."], [310.0, "Bunun üzerine buyurdu ki: \"Onu (gerçekten) söyleyip söylemediğini bilmek için kalbini yarıp baksaydın ya!"], [315.6, "Kıyamet günü 'Lâ ilâhe illallah' geldiğinde ona ne yapacaksın?\""]]}, {"reader": false, "ar": [[318.0, "ووجهُ الشاهد من هذا الحديث أنّ النبيّ صلى الله عليه وسلم أنكر على حِبِّه وابنِ حِبِّه أسامةَ بن زيدٍ رضي الله عنهما أنه نظر إلى باطن الرجل،"], [329.7, "وما مقصودُه من نُطقه بكلمة الشهادة،"], [332.3, "وهذا محرّمٌ لا يجوز."], [334.0, "وإنما كان الواجبُ على أسامة ـ رضي الله عنه وأرضاه ـ أن يكُفّ بمجرّد سماعه الرجلَ ينطق بكلمة الشهادة،"], [345.0, "حتى وإن كان ظاهرُ الحال يقتضي أنه كان متعوّذًا؛"], [348.6, "فإنّ مثل هذا الظاهر ـ عفوًا ـ فإنّ مثل هذا الظاهر لا ينبغي العملُ به أبدًا؛"], [354.0, "لأنه دخولٌ في النوايا،"], [356.7, "وتفسيرٌ للمقاصد، وأمورُ القلوب لا يعلمها إلا الله عز وجل."]], "tr": [[318.0, "Bu hadisteki delil yönü şudur:"], [320.2, "Peygamber sallallâhu aleyhi ve sellem, sevgilisi ve sevgilisinin oğlu Üsâme b."], [325.4, "Zeyd'i —Allah ikisinden razı olsun— adamın bâtınına ve şehadet kelimesini söylemekten maksadının ne olduğuna baktığı için kınamıştır;"], [334.0, "bu ise haramdır, caiz değildir."], [335.8, "Üsâme'ye —Allah ondan razı olsun ve onu razı etsin— vacip olan, adamın şehadet kelimesini söylediğini işitir işitmez elini çekmesiydi;"], [345.9, "hâlin zâhiri onun sığınmak için söylediğini gerektirse bile."], [348.6, "Çünkü bu tür bir zâhir —pardon— bu tür bir zâhirle asla amel edilmemelidir;"], [354.0, "zira bu, niyetlere girmek ve maksatları yorumlamaktır."], [358.0, "Kalplerin işlerini ise Allah Azze ve Celle'den başkası bilmez."]]}, {"reader": false, "ar": [[361.0, "ومنها أيضًا ما في الصحيحين من حديث المِقداد رضي الله عنه أنه قال:"], [368.8, "يا رسول الله، أرأيتَ إن لقيتُ رجلًا من الكفّار فقاتلني،"], [374.0, "فضرب إحدى يديَّ بالسيف فقطعها،"], [378.0, "ثم لاذ منّي بشجرةٍ فقال:"], [380.1, "أسلمتُ لله، أفأقتلُه يا رسول الله بعد أن قالها؟"], [385.0, "فقال صلى الله عليه وسلم:"], [386.4, "«لا تقتله». قال: قلتُ:"], [388.1, "يا رسول الله، إنه قد قطع يدي،"], [392.0, "وقال ذلك بعد أن قطعها،"], [394.5, "أفأقتلُه؟ قال: «لا تقتله؛ فإن قتلتَه فإنك بمنزلته قبل أن يقول كلمتَه التي قال، وهو بمنزلتك قبل أن تقتله»،"], [404.7, "أو كما قال صلى الله عليه وسلم."]], "tr": [[361.0, "Bunlardan biri de Sahîhayn'de Mikdâd'ın —Allah ondan razı olsun— hadisinde geçendir."], [367.0, "Dedi ki: \"Ey Allah'ın Resûlü!"], [368.8, "Ne dersin, kâfirlerden bir adamla karşılaşsam, benimle savaşsa, kılıçla ellerimden birine vurup kesse, sonra bir ağaca sığınıp 'Allah'a teslim oldum' dese, bunu söyledikten sonra onu öldüreyim mi, ey Allah'ın Resûlü?\" Sallallâhu aleyhi ve sellem \"Onu öldürme\" buyurdu."], [386.4, "(Mikdâd) dedi ki: \"Ey Allah'ın Resûlü, o benim elimi kesti, bunu da elimi kestikten sonra söyledi;"], [392.5, "onu öldüreyim mi?\" dedim. Buyurdu ki:"], [395.0, "\"Onu öldürme. Eğer onu öldürürsen, sen onun, söylediği o kelimeyi söylemeden önceki konumuna düşersin;"], [401.6, "o da senin, onu öldürmeden önceki konumuna geçer\" —ya da sallallâhu aleyhi ve sellem'in dediği gibi."]]}, {"reader": false, "ar": [[407.0, "والشاهدُ من هذا أنّ الكافر مهما فعل بك ـ أيّها المسلم ـ فإنه متى ما نطق بالشهادتين ولو في نفس الموقف،"], [417.0, "فإنّ الواجب عليك أن تكُفّ عنه،"], [420.2, "وأن تعتقد أنه صار معصومَ الدم والمال."], [424.7, "وإن كان لك عنده مَظلَمةٌ فتُطالبه بها على وجه القضاء،"], [431.3, "أو على وجه التقاضي؛"], [435.0, "ولكن لا يحلّ لك أن تُهدر دمَه بمجرّد خطئه عليك في أمرٍ إذا نطق بعده بالشهادتين."]], "tr": [[407.0, "Buradaki delil şudur: Ey Müslüman!"], [409.5, "Kâfir sana ne yaparsa yapsın, aynı anda bile olsa iki şehadeti söylediği anda ondan elini çekmen ve onun kanının ve malının dokunulmaz hâle geldiğine inanman sana vaciptir."], [424.7, "Eğer onda bir hakkın (uğradığın bir zulüm) varsa, onu yargı yoluyla veya dava yoluyla talep edersin."], [435.0, "Fakat sana karşı bir işte hata etti diye, ardından iki şehadeti söylemişse, onun kanını heder etmen sana helal değildir."]]}, {"reader": false, "ar": [[443.0, "ويدلّ على ذلك فعلُه صلى الله عليه وسلم أيضًا مع المنافقين؛"], [448.0, "فإنه كان يقبل ظواهرَهم،"], [450.0, "ويَذَرُ سرائرَهم إلى الله عز وجل."], [453.0, "فكانوا يحضرون معه المسجد ولا يطردهم،"], [456.5, "وكان لا يُقيم عليهم حدَّ الردّة،"], [459.9, "وكانوا يخرجون معه للجهاد،"], [462.3, "وكلُّ ذلك من… <span class=\"q\">؟ 07:33<\/span> وكانوا يعتذرون بين يديه أيضًا إذا تخلّفوا أو أخطؤوا،"], [468.2, "فيقبل عذرَهم، ويَذَرُ سرائرَهم إلى الله عز وجل."]], "tr": [[443.0, "Buna, sallallâhu aleyhi ve sellem'in münafıklara karşı tutumu da delâlet eder:"], [448.0, "Onların zâhirlerini kabul eder, sırlarını Allah Azze ve Celle'ye bırakırdı."], [451.0, "Onunla birlikte mescide gelirlerdi, onları kovmazdı;"], [453.0, "onlara irtidat haddi uygulamazdı; onunla birlikte cihada çıkarlardı."], [458.2, "Bütün bunlar (…) <span class=\"q\">؟<\/span>. Geri kaldıklarında veya hata ettiklerinde onun huzurunda özür dilerlerdi;"], [465.9, "o da özürlerini kabul eder, sırlarını Allah Azze ve Celle'ye bırakırdı."]]}, {"reader": false, "ar": [[472.0, "ومنها أيضًا قولُه صلى الله عليه وسلم:"], [476.7, "«إنما أنا بشرٌ، أقضي بنحو ممّا أسمع»."], [482.0, "وهذا واجبُ القاضي: أن يقضي بنحو ما يسمع،"], [485.6, "ولا شأنَ له بتفسير المقاصد،"], [487.8, "وتحميلِ الكلام ما لا يحتمل."]], "tr": [[472.0, "Bunlardan biri de sallallâhu aleyhi ve sellem'in şu sözüdür:"], [476.7, "\"Ben ancak bir beşerim; işittiğime göre hüküm veririm.\" Hâkimin görevi budur:"], [483.3, "İşittiğine göre hüküm verir; maksatları yorumlamakla ve sözü taşımadığı anlamla yüklemekle işi yoktur."]]}, {"reader": false, "ar": [[490.0, "وقد أجمع أهلُ العلم على أنّ أحكام الدنيا فيما بين العباد على الظواهر:"], [497.3, "في البيع، وفي الشراء،"], [499.9, "وفي الزواج، وفي القضاء،"], [502.4, "وفي الطلاق، وفي المواريث؛"], [505.0, "فكلُّ ذلك ممّا يُبنى على الظاهر."], [508.0, "فلا يزال الناسُ يتوارثون فيما بينهم عملًا بظواهر إسلامهم،"], [514.0, "ولا حقَّ لأحدٍ أن يبتليَ أحدًا في دينه ليستخرج ما في قلبه؛"], [519.0, "فإنّ ذلك من البدع المخالفة للسنّة."]], "tr": [[490.0, "İlim ehli, kullar arasındaki dünya hükümlerinin zâhirlere göre olduğunda icmâ etmiştir:"], [497.3, "Satışta, alışta, evlilikte, yargıda, boşamada ve mirasta;"], [501.1, "bunların hepsi zâhir üzerine bina edilir."], [505.0, "İnsanlar, İslâm'larının zâhiriyle amel ederek birbirlerine mirasçı olmaya devam ederler."], [511.3, "Hiç kimsenin, kalbindekini ortaya çıkarmak için birini dininde imtihana tâbi tutma hakkı yoktur;"], [519.0, "çünkü bu, Sünnet'e aykırı bid'atlerdendir."]]}, {"reader": false, "ar": [[523.0, "وعلى ذلك تواترت كلمةُ أهل العلم من أهل السنة والجماعة ـ رحم الله أمواتَهم،"], [529.8, "وثبّت أحياءَهم ـ. قال الإمام الشافعيّ رحمه الله:"], [534.0, "«فمن حكم على الناس بخلاف ما ظهر عليهم، استدلالًا على أنّ ما أظهروا يحتمل غيرَ ما أبطنوا، بدلالةٍ منهم أو غيرِ دلالة، لم يسلم عندي من خلاف التنزيل والسنّة؛ وذلك أن يقول قائلٌ: من رجع عن الإسلام ممّن وُلد على الإسلام قتلتُه ولم أستتبه، ومن رجع عنه ممّن لم يولد على الإسلام استتبتُه»."], [560.0, "انتهى كلامه. قال ذلك مُنكِرًا على من يُفسّر ظواهرَ الناس،"], [566.7, "ولا يعمل بظواهر إسلامهم."]], "tr": [[523.0, "Ehl-i Sünnet ve'l-Cemaat'ten ilim ehlinin —Allah ölmüşlerine rahmet etsin, yaşayanlarına sebat versin— sözü bu konuda tevâtür derecesine ulaşmıştır."], [531.0, "İmam Şâfiî —Allah ona rahmet etsin— şöyle dedi:"], [534.0, "\"Kim, açığa vurdukları şeyin gizledikleri şeyden başkasına ihtimal taşıdığını —onlardan bir delâletle veya delâletsiz— delil getirerek insanlar hakkında onlardan zâhir olanın aksine hüküm verirse, bana göre Kur'ân'a ve Sünnet'e muhalefetten kurtulmuş olmaz."], [550.0, "Bu, birinin şöyle demesidir: 'İslâm üzere doğmuş olup İslâm'dan dönen kimseyi tövbeye çağırmadan öldürürüm;"], [556.1, "İslâm üzere doğmamış olup ondan döneni ise tövbeye çağırırım.'\" Sözü burada bitti."], [560.0, "Bunu, insanların zâhirlerini yorumlayan ve onların İslâm'larının zâhiriyle amel etmeyen kimseyi kınayarak söylemiştir."]]}, {"reader": false, "ar": [[569.0, "وقال النوويّ رحمه الله تعالى:"], [573.0, "«القاعدةُ المعروفة في الفقه والأصول: أنّ الأحكام يُعمَل فيها بالظاهر، واللهُ يتولّى السرائر»."], [581.0, "انتهى كلامه. وقال ابن تيميّة رحمه الله:"], [584.0, "«إنّ الإيمان الذي عُلِّقت به أحكامُ الدنيا هو الإيمانُ الظاهر، وهو الإسلام؛ فالمسمّى واحدٌ في الأحكام الظاهرة»."], [595.6, "انتهى كلامه. وقال أيضًا:"], [598.1, "«الإيمانُ الظاهر الذي تجري عليه الأحكام في الدنيا لا يستلزم الإيمانَ في الباطن"]], "tr": [[569.0, "Nevevî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [573.0, "\"Fıkıh ve usûlde bilinen kaide şudur:"], [574.6, "Hükümlerde zâhirle amel edilir; sırları Allah üstlenir.\" Sözü burada bitti."], [581.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [584.0, "\"Dünya hükümlerinin bağlandığı iman, zâhir imandır;"], [588.3, "o da İslâm'dır. Zâhir hükümlerde adlandırılan şey birdir.\" Sözü burada bitti."], [595.6, "Yine şöyle dedi: \"Dünyada hükümlerin üzerine cereyan ettiği zâhir iman, bâtındaki imanı gerektirmez;"]]}]}, {"ts": "10:05", "title": "1. Külliye (sonuç): Şâtıbî ve İbn Hacer'in nakilleri · 2. Külliye: Ahiret hükümlerinin hepsi sırlara göredir", "paras": [{"reader": false, "ar": [[605.0, "الذي يكون صاحبُه من أهل السعادة في الآخرة»."], [609.0, "بمعنى أنّ ما يحمله من الإيمان في الباطن أمرُه إلى الله عز وجل،"], [614.0, "وإنما الشأنُ فيما بيننا ما يُظهره من الإيمان."], [619.0, "وقال الشاطبيّ رحمه الله تعالى:"], [622.2, "«إنّ أصل الحكم بالظاهر مقطوعٌ به في الأحكام خصوصًا، وبالنسبة إلى الاعتقاد في الغير عمومًا؛ فإنّ سيّد البشر ـ مع إعلامه بالوحي ـ يُجري الأمورَ على ظواهرها في المنافقين وغيرهم، وإن علم بواطنَ أحوالهم، ولم يكن ذلك بمُخرِجه عن جريان الظواهر على ما جرت عليه». انتهى كلامه."]], "tr": [[605.0, "sahibinin ahirette saadet ehlinden olmasını sağlayan (bâtın) imanı.\" Yani onun bâtında taşıdığı imanın işi Allah Azze ve Celle'ye kalmıştır;"], [614.0, "aramızdaki mesele ise onun açığa vurduğu imandır."], [619.0, "Şâtıbî —Allah Teâlâ ona rahmet etsin— şöyle dedi:"], [619.6, "\"Zâhirle hükmetme esası, özellikle hükümlerde ve genel olarak başkası hakkındaki kanaat bakımından kesindir."], [622.2, "Zira beşerin efendisi (Peygamber), vahiyle bildirilmesine rağmen münafıklar ve diğerleri hakkında işleri zâhirlerine göre yürütürdü;"], [634.2, "onların iç hâllerini bilse bile."], [637.9, "Bu bilgi, onu zâhirlerin cereyan ettiği yol üzere cereyan etmesinden çıkarmazdı.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[648.0, "وقال الإمام ابن حجر رحمه الله:"], [651.2, "«كلُّهم أجمعوا على أنّ أحكام الدنيا على الظاهر، واللهُ يتولّى السرائر»."], [657.0, "انتهى كلامه. والخلاصةُ من هذه الكلّيّة:"], [660.2, "أنّني أريد تقريرَ أمرٍ إيمانيٍّ عظيمٍ في التعامل في المجتمعات الإسلاميّة،"], [666.0, "وهي أنّنا نقبل ظواهرَ الناس،"], [668.6, "ولا حقَّ لنا أن نُفسّر مقاصدَ كلامهم،"], [672.3, "ولا أن نُحمّل مقاصدَ قلوبهم،"], [674.9, "ما لم يُظهروا شيئًا من ذلك."], [678.0, "ولأنّ المتقرّر في القواعد وجوبُ إحسان الظنّ بإخوانك المسلمين،"], [684.0, "وإنّ أعظم أسباب سوء الظنّ تفسيرُ المقاصد والنوايا ـ تفسيرُ المقاصد والنوايا ـ؛"], [694.0, "فسدًّا لذريعة فساد أُخوّة الدين والإيمان فلا بدّ أن يُسَدّ هذا الأمر. والله أعلم."]], "tr": [[648.0, "İmam İbn Hacer —Allah ona rahmet etsin— şöyle dedi:"], [651.2, "\"Hepsi, dünya hükümlerinin zâhire göre olduğunda, sırları ise Allah'ın üstlendiğinde icmâ etmişlerdir.\" Sözü burada bitti."], [660.2, "Bu külliyenin özeti şudur: İslâm toplumlarındaki muamelede büyük bir imanî meseleyi tespit etmek istiyorum:"], [667.6, "İnsanların zâhirlerini kabul ederiz; onlar bundan bir şey açığa vurmadıkça sözlerinin maksatlarını yorumlama, kalplerine maksatlar yükleme hakkımız yoktur."], [678.0, "Ayrıca kaidelerde Müslüman kardeşlerin hakkında hüsn-i zan beslemenin vacip olduğu sabittir;"], [683.3, "sû-i zannın en büyük sebebi ise maksatları ve niyetleri yorumlamaktır —maksatları ve niyetleri yorumlamak—."], [694.0, "Din ve iman kardeşliğinin bozulmasına giden yolu kapatmak için bu kapının mutlaka kapatılması gerekir. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[700.0, "وعكسُها الكلّيّةُ التي بعدها:"], [703.0, "كلُّ أحكام الآخرة على السرائر،"], [706.6, "والظواهرُ تَبَعٌ لها. <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [715.2, "وهي عكسُ الكلّيّة التي قبلها؛"], [722.0, "فإذا كانت أحكامُ الدنيا مبنيّةً على الظواهر والسرائرُ تبعٌ لها،"], [729.0, "فالأحكامُ فيما بين العبد وبين ربّه في الآخرة على السرائر والظواهرُ تبعٌ لها."], [737.0, "وعلى ذلك قامت الأدلّة،"], [739.0, "وأجمعت كلمةُ أهل العلم ـ رحم الله أمواتَهم، وثبّت أحياءَهم ـ."]], "tr": [[700.0, "Bunun tersi de ondan sonraki külliyedir:"], [703.0, "2. külliye: Ahiret hükümlerinin hepsi sırlara göredir;"], [708.1, "zâhirler ona tâbidir. (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [722.0, "Bu, önceki külliyenin tersidir. Dünya hükümleri zâhirler üzerine bina edilip sırlar ona tâbi olduğuna göre, ahirette kul ile Rabbi arasındaki hükümler de sırlara göredir, zâhirler ona tâbidir."], [737.0, "Deliller bunun üzerine kurulmuş, ilim ehlinin —Allah ölmüşlerine rahmet etsin, yaşayanlarına sebat versin— sözü bunun üzerinde birleşmiştir."]]}, {"reader": false, "ar": [[743.0, "قال الله عز وجل:"], [745.1, "<span class=\"ayah\">﴿يَوْمَ تُبْلَى السَّرَائِرُ﴾<\/span> <span class=\"ref\">[الطارق: ٩]<\/span>؛ بمعنى أنه ينظر في سريرة العمل قبل أن ينظر في موافقة ظاهره،"], [753.0, "فكلُّ عملٍ فسدت سريرتُه رُدَّ ظاهرُه."], [759.0, "فاللهُ عز وجل يختبر يوم القيامة السرائرَ التي كانت في الدنيا مخبّأةً في القلوب،"], [771.0, "فيختبر الإيمانَ والنفاق؛ فلا يبقى يوم القيامة أمرٌ باطنٌ إلا كشفه الله عز وجل."]], "tr": [[743.0, "Allah Azze ve Celle buyurdu:"], [745.1, "<span class=\"ayah\">﴿Sırların imtihan edildiği (ortaya döküldüğü) gün﴾<\/span> [Târık 9]."], [746.7, "Yani (Allah) amelin zâhirinin (şeriata) uygunluğuna bakmadan önce onun sırrına (niyetine) bakar;"], [752.5, "sırrı bozulan her amelin zâhiri de reddedilir."], [759.0, "Allah Azze ve Celle kıyamet günü, dünyada kalplerde gizlenmiş olan sırları imtihan eder;"], [767.1, "imanı ve nifakı imtihan eder."], [773.0, "Kıyamet günü Allah Azze ve Celle'nin açığa çıkarmadığı hiçbir gizli iş kalmaz."]]}, {"reader": false, "ar": [[779.0, "وقال الله عز وجل:"], [781.0, "<span class=\"ayah\">﴿أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي الْقُبُورِ ۝ وَحُصِّلَ مَا فِي الصُّدُورِ﴾<\/span> <span class=\"ref\">[العاديات: ٩-١٠]<\/span>؛"], [788.0, "فالمسألة ليست على ظواهر الأعمال،"], [792.0, "وإنما تُحصَّل العقائدُ وأعمالُ القلوب."], [797.0, "وقال الله عز وجل:"], [801.0, "<span class=\"ayah\">﴿إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا﴾<\/span> <span class=\"ref\">[الإسراء: ٣٦]<\/span>؛"], [807.0, "فمن جملة مَحَطّ السؤال:"], [809.0, "السؤالُ عمّا في الفؤاد،"], [811.0, "بمعنى سريرة الفؤاد. فالذي يعلم ذواتِ الصدور سيسألك عن ثلاثة أشياء:"], [819.0, "سيسألك عن سمعك ـ وهذا أمرٌ ظاهر ـ،"], [822.0, "ويسألك عن بصرك ـ وهذا أمرٌ ظاهر ـ،"], [824.0, "ويسألك عمّا تُكِنّه في صدرك وفؤادك وسريرتك؛"], [829.0, "فالسريرةُ هي مَحَطّ السؤال يوم القيامة."]], "tr": [[779.0, "Allah Azze ve Celle buyurdu:"], [781.0, "<span class=\"ayah\">﴿Bilmez mi ki kabirlerde olanlar dışarı çıkarıldığında ve göğüslerde olanlar ortaya çıkarıldığında…﴾<\/span> [Âdiyât 9-10]."], [788.0, "Demek ki mesele amellerin zâhirine göre değildir;"], [792.0, "akîdeler ve kalplerin amelleri ortaya çıkarılır."], [797.0, "Allah Azze ve Celle buyurdu:"], [801.0, "<span class=\"ayah\">﴿Şüphesiz kulak, göz ve gönül; bunların hepsi ondan sorumludur﴾<\/span> [İsrâ 36]."], [807.0, "Sorgunun konusu olan şeylerden biri, gönülde olandan, yani gönlün sırrından sorgulanmaktır."], [814.0, "Göğüslerin özünü bilen (Allah) seni üç şeyden sorguya çekecektir:"], [819.0, "Kulağından sorgulayacak —bu zâhir bir iştir—;"], [822.0, "gözünden sorgulayacak —bu zâhir bir iştir—;"], [824.0, "göğsünde, gönlünde ve sırrında sakladığından sorgulayacak."], [829.0, "Kıyamet günü sorgunun konusu sırdır."]]}, {"reader": false, "ar": [[832.0, "وقال الله عز وجل:"], [834.6, "<span class=\"ayah\">﴿يَوْمَ لَا يَنفَعُ مَالٌ وَلَا بَنُونَ ۝ إِلَّا مَنْ أَتَى اللَّهَ بِقَلْبٍ سَلِيمٍ﴾<\/span> <span class=\"ref\">[الشعراء: ٨٨-٨٩]<\/span>؛"], [843.0, "فإذا سلم ما في القلوب سلمت الظواهر."], [846.0, "وقال الله عز وجل:"], [848.7, "<span class=\"ayah\">﴿وَأَسِرُّوا قَوْلَكُمْ أَوِ اجْهَرُوا بِهِ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ﴾<\/span> <span class=\"ref\">[الملك: ١٣]<\/span>،"], [856.0, "وفيه دلالةٌ على محاسبة العباد على ما تُضمره صدورُهم."]], "tr": [[832.0, "Allah Azze ve Celle buyurdu:"], [834.6, "<span class=\"ayah\">﴿O gün ne mal fayda verir ne evlat; ancak Allah'a selim bir kalple gelen (kurtulur)﴾<\/span> [Şuarâ 88-89]."], [843.0, "Kalplerde olan selim olursa zâhirler de selim olur."], [846.0, "Allah Azze ve Celle buyurdu:"], [848.7, "<span class=\"ayah\">﴿Sözünüzü gizleyin veya açığa vurun; şüphesiz O, göğüslerin özünü bilendir﴾<\/span> [Mülk 13]."], [856.4, "Bunda, kulların göğüslerinin gizlediği şeyden hesaba çekileceğine delâlet vardır."]]}, {"reader": false, "ar": [[860.0, "ومنها أيضًا قولُه عز وجل:"], [863.5, "<span class=\"ayah\">﴿إِنَّ الْمُنَافِقِينَ يُخَادِعُونَ اللَّهَ وَهُوَ خَادِعُهُمْ﴾<\/span> <span class=\"ref\">[النساء: ١٤٢]<\/span>؛"], [871.0, "ووجهُ مخادعة الله عز وجل لهم أنهم يظنّون أنهم يُخفون ما في صدورهم عنه،"], [879.0, "وفي حقيقة الأمر أنّ بواطنَهم وسرائرَهم عنده عز وجل علانية."], [885.0, "وفي الصحيح من حديث عائشة رضي الله تعالى عنها قالت:"], [892.7, "قال النبيّ صلى الله عليه وسلم:"], [896.9, "«يغزو جيشٌ الكعبةَ، فإذا كانوا ببيداءَ من الأرض يُخسَف بأوّلهم وآخرهم»."]], "tr": [[860.0, "Bunlardan biri de Azze ve Celle'nin şu sözüdür:"], [863.5, "<span class=\"ayah\">﴿Şüphesiz münafıklar Allah'ı aldatmaya çalışırlar; hâlbuki O, onları aldatandır (aldatmalarının cezasını verendir)﴾<\/span> [Nisâ 142]."], [871.0, "Allah Azze ve Celle'nin onları aldatmasının yönü şudur:"], [875.0, "Onlar göğüslerinde olanı O'ndan gizlediklerini zannederler;"], [878.4, "hakikatte ise bâtınları ve sırları O'nun —Azze ve Celle— katında apaçıktır."], [885.0, "Sahîh'te Âişe'nin —Allah Teâlâ ondan razı olsun— hadisinde şöyle geçer:"], [892.7, "Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [896.9, "\"Bir ordu Kâbe'ye saldıracak; yerin düz bir arazisine (Beydâ'ya) vardıklarında öncekileri de sonrakileri de yere batırılacak.\""]]}]}, {"ts": "15:05", "title": "2. Külliye (devam): Niyetlerine göre diriltilme; ateşe ilk atılacak üç kişi hadisi", "paras": [{"reader": false, "ar": [[905.0, "قالت: قلتُ: يا رسول الله،"], [907.9, "كيف يُخسَف بأوّلهم وآخرهم وفيهم أسواقُهم ومن ليس منهم؟"], [913.0, "قال: «يُخسَف بأوّلهم وآخرهم، ثم يُبعَثون على نيّاتهم»؛"], [918.1, "أي: كلٌّ وسريرتُه. ومنها أيضًا ما في الصحيح من قوله صلى الله عليه وسلم:"], [926.0, "«فإذا فعلوا ذلك عصموا منّي دماءَهم وأموالَهم»؛"], [931.0, "فلمّا بيّن حكمَ الظاهر قال:"], [934.5, "«وحسابُهم على الله» عز وجل؛"], [939.0, "يعني: حسابُ بواطنهم موكولٌ إلى الله تبارك وتعالى."]], "tr": [[905.0, "(Âişe) dedi ki: \"Ey Allah'ın Resûlü, aralarında çarşı halkı ve onlardan olmayanlar varken öncekileri de sonrakileri de nasıl yere batırılır?\" dedim."], [913.6, "Buyurdu ki: \"Öncekileri de sonrakileri de yere batırılır;"], [918.1, "sonra niyetlerine göre diriltilirler\"; yani herkes kendi sırrıyla (diriltilir)."], [921.6, "Bunlardan biri de Sahîh'te geçen sallallâhu aleyhi ve sellem'in şu sözüdür:"], [926.0, "\"Bunu yaptıklarında kanlarını ve mallarını benden korumuş olurlar.\" Zâhirin hükmünü açıkladıktan sonra \"Hesapları da Allah'a kalmıştır\" buyurdu;"], [939.0, "yani bâtınlarının hesabı Allah Tebâreke ve Teâlâ'ya havale edilmiştir."]]}, {"reader": false, "ar": [[944.0, "وفي صحيح الإمام مسلم من حديث أبي هريرة رضي الله عنه قال:"], [949.4, "قال النبيّ صلى الله عليه وسلم:"], [952.0, "«إنّ أوّل الناس يُقضى عليه يوم القيامة رجلٌ استُشهد، فأُتي به فعرّفه نِعَمَه فعرفها، قال: فما عملتَ فيها؟ قال: قاتلتُ فيك حتى استُشهدتُ» ـ وهذا هو الظاهر ـ «فقال: كذبتَ، وإنما قاتلتَ ليقال: جريء، فقد قيل، ثم أُمر به فسُحب على وجهه حتى أُلقي في النار»."], [976.0, "فلمّا كان الحسابُ يوم القيامة على السرائر،"], [979.0, "لم ينفعه جهادُه الخالي عن سلامة السريرة في الدنيا."]], "tr": [[944.0, "İmam Müslim'in Sahîh'inde Ebû Hüreyre'nin —Allah ondan razı olsun— hadisinde (şöyle geçer):"], [949.4, "Peygamber sallallâhu aleyhi ve sellem buyurdu ki:"], [952.0, "\"Kıyamet günü hakkında ilk hüküm verilecek kişi şehit edilmiş bir adamdır."], [960.0, "Getirilir, (Allah) ona nimetlerini tanıtır, o da onları tanır."], [965.9, "'Bunlarda ne yaptın?' der. 'Senin yolunda şehit edilinceye kadar savaştım' der\" —bu zâhirdir— \"(Allah) 'Yalan söyledin;"], [976.0, "sen ancak \"cesur\" desinler diye savaştın;"], [976.9, "o da denildi' buyurur. Sonra onun hakkında emredilir, yüzüstü sürüklenir ve ateşe atılır.\" Kıyamet günü hesap sırlara göre olduğundan, dünyada sırrın selametinden yoksun olan cihadı ona fayda vermedi."]]}, {"reader": false, "ar": [[984.0, "ثم قال صلى الله عليه وسلم:"], [987.0, "«ورجلٌ تعلّم العلمَ وعلّمه، وقرأ القرآن، فأُتي به فعرّفه نِعَمَه فعرفها، قال: فما عملتَ فيها؟ قال: تعلّمتُ العلمَ وعلّمتُه، وقرأتُ فيك القرآن، فيقول: كذبتَ، وإنما تعلّمتَ العلمَ ليقال: عالم، وقرأتَ القرآن ليقال: قارئ»."], [1011.0, "قلتُ: فلمّا كان الحسابُ يوم القيامة على السرائر،"], [1016.0, "لم ينفعه تعليمُه ولا قراءتُه للقرآن الذي بناه على سريرةٍ فاسدة."]], "tr": [[984.0, "Sonra sallallâhu aleyhi ve sellem buyurdu ki:"], [985.0, "\"Bir de ilim öğrenip öğreten ve Kur'ân okuyan bir adam."], [987.0, "Getirilir, (Allah) ona nimetlerini tanıtır, o da onları tanır."], [992.6, "'Bunlarda ne yaptın?' der. 'İlim öğrendim, öğrettim ve senin için Kur'ân okudum' der."], [998.3, "(Allah) 'Yalan söyledin; sen ancak \"âlim\" desinler diye ilim öğrendin, \"kâri\" desinler diye Kur'ân okudun' buyurur.\" Derim ki:"], [1011.0, "Kıyamet günü hesap sırlara göre olduğundan, bozuk bir sır üzerine bina ettiği öğretmesi ve Kur'ân okuması ona fayda vermedi."]]}, {"reader": false, "ar": [[1023.0, "ثم قال صلى الله عليه وسلم:"], [1026.0, "«ورجلٌ وسّع اللهُ عليه، وأعطاه من أصناف المال كلِّه، فأُتي به فعرّفه نِعَمَه فعرفها، قال: فما عملتَ فيها؟ قال: ما تركتُ من سبيلِ خيرٍ تُحبّ أن يُنفَق فيها إلا أنفقتُ فيها لك، فقال: كذبتَ، ولكنّك أنفقتَ ليقال: جواد، فأُمر به فسُحب على وجهه حتى أُلقي في النار»."], [1051.0, "والشاهدُ من هذا الحديث هو ما بيّنتُه لكم:"], [1056.0, "وهي أنّ ظواهر الأعمال ـ وإن كانت عظيمةً ـ لا تنفع إذا بُنيت على سرائرَ فاسدة؛"], [1062.0, "فالحسابُ يوم القيامة إنما هو على السرائر، وليس على الظواهر."]], "tr": [[1023.0, "Sonra sallallâhu aleyhi ve sellem buyurdu ki:"], [1026.0, "\"Bir de Allah'ın rızkını genişlettiği ve her çeşit maldan verdiği bir adam."], [1034.0, "Getirilir, (Allah) ona nimetlerini tanıtır, o da onları tanır."], [1038.6, "'Bunlarda ne yaptın?' der. 'Harcanmasını sevdiğin hiçbir hayır yolu bırakmadım ki senin için ona harcamamış olayım' der."], [1051.0, "(Allah) 'Yalan söyledin; sen ancak \"cömert\" desinler diye harcadın' buyurur."], [1056.0, "Sonra onun hakkında emredilir, yüzüstü sürüklenir ve ateşe atılır.\" Bu hadisteki delil, size açıkladığım şeydir:"], [1062.0, "Amellerin zâhirleri ne kadar büyük olsa da bozuk sırlar üzerine bina edildiğinde fayda vermez."], [1065.6, "Kıyamet günü hesap ancak sırlara göredir, zâhirlere göre değil."]]}, {"reader": false, "ar": [[1068.0, "وفي الحديث عن محمود بن لَبيد قال:"], [1071.6, "خرج النبيّ صلى الله عليه وسلم فقال:"], [1076.0, "«يا أيّها الناس، إيّاكم وشركَ السرائر»،"], [1079.8, "قالوا: يا رسول الله،"], [1082.3, "وما شركُ السرائر؟ قال:"], [1084.8, "«يقوم الرجلُ فيُصلّي، فيُزيّن صلاتَه جاهدًا لما يرى من نظر الناس؛ فذلك شركُ السرائر»."], [1099.0, "ويقول صلى الله عليه وسلم:"], [1102.0, "«إنّ أوّل ما يُحاسَب عنه العبدُ من عمله يوم القيامة صلاتُه؛ فإن صلحت فقد أفلح وأنجح، وإن فسدت فقد خاب وخسر»."], [1112.0, "وصلاحُها وفسادُها أصالةً يكون على سرائرها،"], [1117.0, "وما يقوم في قلب المصلّي."]], "tr": [[1068.0, "Mahmûd b. Lebîd'den gelen hadiste şöyle denir:"], [1071.6, "Peygamber sallallâhu aleyhi ve sellem çıktı ve buyurdu ki:"], [1076.0, "\"Ey insanlar! Sırların şirkinden sakının.\" \"Ey Allah'ın Resûlü, sırların şirki nedir?\" dediler."], [1084.2, "Buyurdu ki: \"Adam kalkıp namaz kılar ve insanların kendisine baktığını gördüğü için namazını var gücüyle süsler;"], [1099.0, "işte bu, sırların şirkidir.\" Sallallâhu aleyhi ve sellem şöyle buyurur:"], [1102.0, "\"Kıyamet günü kulun amelinden ilk hesaba çekileceği şey namazıdır;"], [1104.8, "o düzgün olursa kurtuluşa ermiş ve başarmıştır, bozuk olursa hüsrana uğramış ve kaybetmiştir.\" Namazın düzgünlüğü ve bozukluğu da esas itibarıyla onun sırlarına ve namaz kılanın kalbinde bulunana göredir."]]}, {"reader": false, "ar": [[1122.0, "وفي الحديث ـ أو في الأثر ـ عن عمر بن الخطّاب رضي الله عنه قال:"], [1127.7, "«من أظهر لنا خيرًا أمِنّاه وقرّبناه، وليس لنا من سريرته شيء، اللهُ يحاسبه على سريرته»."], [1138.0, "وفي الحديث عن عبد الله بن مسعودٍ رضي الله عنه قال:"], [1144.0, "«أنتم أطولُ صلاةً، وأكثرُ اجتهادًا من أصحاب رسول الله صلى الله عليه وسلم، وهم كانوا أفضلَ منكم»."], [1153.9, "قيل له: بأيّ شيء؟"], [1159.0, "قال: «إنهم كانوا أزهدَ في الدنيا، وأرغبَ في الآخرة منكم»؛"], [1163.0, "يعني أنهم يبنون هذه العبادات ـ ولو كانت يسيرةَ الوقوع ـ على سرائرَ سليمة."]], "tr": [[1122.0, "Hadiste —veya eserde— Ömer b."], [1123.7, "Hattâb'dan —Allah ondan razı olsun— şöyle dediği rivayet edilir:"], [1127.7, "\"Bize hayır gösteren kimseye güveniriz ve onu yakın tutarız;"], [1131.6, "onun sırrından bize bir şey yoktur, Allah onu sırrından hesaba çeker.\" Abdullah b."], [1138.0, "Mes'ûd'dan —Allah ondan razı olsun— gelen hadiste şöyle dediği rivayet edilir:"], [1144.0, "\"Siz Resûlullah sallallâhu aleyhi ve sellem'in ashâbından daha uzun namaz kılıyor ve daha çok gayret ediyorsunuz;"], [1151.0, "hâlbuki onlar sizden daha faziletliydi.\" Ona \"Ne sebeple?\" denildi."], [1159.0, "Dedi ki: \"Onlar dünyaya karşı sizden daha zâhid, ahirete sizden daha istekliydiler.\" Yani onlar bu ibadetleri —miktarı az olsa bile— selim sırlar üzerine bina ediyorlardı."]]}, {"reader": false, "ar": [[1170.0, "وها هم الخوارج، فقد حدّث عنهم النبيّ صلى الله عليه وسلم أنه «يَحقِر أحدُكم صلاتَه مع صلاتهم، وصيامَه مع صيامهم، وصدقتَه مع صدقتهم»،"], [1183.0, "وأنهم قومٌ يقرؤون القرآن،"], [1185.9, "ويقومون الليل، ويبكون، ويتهجّدون،"], [1189.0, "ولكن لا يُجاوز إيمانُهم حناجرَهم."], [1194.0, "لماذا؟ لأنهم يبنون هذه العبادات على سرائرَ فاسدة،"], [1199.0, "مع أنهم صالحون في الظاهر، لكن ما نفعهم."]], "tr": [[1170.0, "İşte Hâricîler! Peygamber sallallâhu aleyhi ve sellem onlar hakkında şöyle haber vermiştir:"], [1175.8, "\"Biriniz kendi namazını onların namazının yanında, orucunu onların orucunun yanında, sadakasını onların sadakasının yanında küçük görür.\" Onlar Kur'ân okuyan, geceleri kıyam eden, ağlayan ve teheccüd kılan bir topluluktur;"], [1194.0, "fakat imanları gırtlaklarını geçmez. Neden?"], [1195.9, "Çünkü bu ibadetleri bozuk sırlar üzerine bina ediyorlar;"], [1199.4, "zâhirde salih olmalarına rağmen bu onlara fayda vermedi."]]}]}, {"ts": "20:02", "title": "2. Külliye (sonuç): Allah kalplere bakar; İbn Kayyim'in \"Sırların imtihan edildiği gün\" tefsiri", "paras": [{"reader": false, "ar": [[1202.0, "فلا ينبغي للإنسان أن يغترّ بصلاح جوارحه،"], [1207.0, "وإنما العبرةُ في سلامة قلبه وسريرته؛"], [1211.0, "ولأنّ السريرة هي مَحَطّ نظر الربّ،"], [1215.0, "كما قال صلى الله عليه وسلم:"], [1218.0, "«إنّ الله لا ينظر إلى صوركم ولا إلى أجسادكم، ولكن ينظر إلى قلوبكم وإلى أعمالكم»."]], "tr": [[1202.0, "İnsan azalarının salih olmasına aldanmamalıdır;"], [1205.6, "asıl ölçü kalbinin ve sırrının selametidir."], [1211.0, "Çünkü sır, Rabbin nazar ettiği yerdir;"], [1214.3, "nitekim sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1218.0, "\"Şüphesiz Allah sizin suretlerinize ve bedenlerinize bakmaz;"], [1221.6, "fakat kalplerinize ve amellerinize bakar.\""]]}, {"reader": false, "ar": [[1225.0, "يقول الإمام ابن القيّم رحمه الله تعالى في تفسير قوله:"], [1229.6, "<span class=\"ayah\">﴿يَوْمَ تُبْلَى السَّرَائِرُ﴾<\/span> <span class=\"ref\">[الطارق: ٩]<\/span> كلامًا جميلًا،"], [1234.0, "قال: «وفي التعبير عن الأعمال بالسرّ لطيفة، وهي أنّ الأعمال نتائجُ السرائر الباطنة؛ فمن كانت سريرتُه صالحةً كان عملُه صالحًا، فتبدو سريرتُه على وجهه نورًا وإشراقًا وحياءً. ومن كانت سريرتُه فاسدةً كان عملُه تابعًا لسريرته، لا اعتبارَ بصورته، فتبدو سريرتُه على وجهه سوادًا وظلمةً وشَيْنًا. وإن كان الذي يبدو عليه في الدنيا إنما هو عملُه لا سريرتُه، فيوم القيامة تبدو عليه سريرتُه، ويكون الحكمُ والظهورُ لها»."]], "tr": [[1225.0, "İmam İbn Kayyim —Allah Teâlâ ona rahmet etsin— <span class=\"ayah\">﴿Sırların imtihan edildiği gün﴾<\/span> [Târık 9] sözünün tefsirinde güzel bir söz söyler."], [1227.8, "Dedi ki: \"Amellerin 'sır' diye ifade edilmesinde ince bir nükte vardır:"], [1229.6, "Ameller, gizli sırların neticeleridir. Sırrı salih olanın ameli de salih olur;"], [1230.5, "sırrı yüzünde nur, parlaklık ve hayâ olarak görünür."], [1231.0, "Sırrı bozuk olanın ameli sırrına tâbi olur, suretine itibar edilmez;"], [1234.4, "sırrı yüzünde karalık, karanlık ve çirkinlik olarak görünür."], [1245.4, "Dünyada onda görünen sırrı değil ameli olsa da, kıyamet günü onda sırrı görünür;"], [1268.3, "hüküm ve açığa çıkış ona ait olur.\""]]}, {"reader": false, "ar": [[1276.0, "قلتُ: وهو معنى قوله عز وجل:"], [1280.3, "<span class=\"ayah\">﴿يَوْمَ تَبْيَضُّ وُجُوهٌ﴾<\/span> <span class=\"ref\">[آل عمران: ١٠٦]<\/span> ـ وهم من حسُنت سرائرُهم وصلحت أعمالُهم ـ <span class=\"ayah\">﴿وَتَسْوَدُّ وُجُوهٌ﴾<\/span> <span class=\"ref\">[آل عمران: ١٠٦]<\/span> ـ وهم من فسدت سرائرُهم ورُدّت أعمالُهم ـ."], [1293.0, "وقال ابن القيّم أيضًا:"], [1299.0, "«والسرائرُ جمعُ سريرة، وهي سرائرُ الله التي بينه وبين عبده في ظاهره وباطنه لله؛ فالإيمانُ من السرائر، وشرائعُه من السرائر، فتُختبَر ذلك اليوم حتى يظهر خيرُها من شرّها، ومؤدّيها من مضيّعها، وما كان لله ممّا لم يكن لله»."]], "tr": [[1276.0, "Derim ki: Bu, Allah Azze ve Celle'nin şu sözünün anlamıdır:"], [1280.3, "<span class=\"ayah\">﴿Bazı yüzlerin ağaracağı gün﴾<\/span> [Âl-i İmrân 106] —bunlar sırları güzel, amelleri salih olanlardır— <span class=\"ayah\">﴿ve bazı yüzlerin kararacağı (gün)﴾<\/span> [Âl-i İmrân 106] —bunlar da sırları bozulmuş, amelleri reddedilmiş olanlardır—."], [1293.0, "İbn Kayyim yine şöyle dedi:"], [1293.6, "\"Serâir, 'serîre'nin çoğuludur; bunlar Allah'ın, kendisiyle kulu arasında olan, kulun zâhirinde ve bâtınında Allah için olan sırlardır."], [1299.0, "İman sırlardandır, imanın şeriatleri (hükümleri) de sırlardandır."], [1304.1, "O gün bunlar imtihan edilir;"], [1308.8, "ta ki hayırlısı şerlisinden, onu edâ edeni zayi edeninden, Allah için olanı Allah için olmayandan ayrılıp ortaya çıksın.\""]]}, {"reader": false, "ar": [[1324.0, "قال عبد الله بن عمر رضي الله عنهما:"], [1328.4, "«يُبدي اللهُ يوم القيامة كلَّ سرٍّ، فيكون زَيْنًا في الوجوه، وشَيْنًا فيها»."], [1335.0, "والمعنى: أي تُختبَر السرائرُ بإظهارها،"], [1338.3, "وإظهارِ مقتضياتها من الثواب والعقاب،"], [1341.7, "والحمدِ والذمّ. والخلاصةُ من ذلك أنّ العبد ينبغي له أن ينظر في سريرته،"], [1348.0, "وأن يحرص الحرصَ الكاملَ على ألّا يرى اللهُ عز وجل من سريرته إلا كلَّ خيرٍ قبل يوم الفضائح. والله أعلم."]], "tr": [[1324.0, "Abdullah b. Ömer —Allah ikisinden razı olsun— şöyle dedi:"], [1328.4, "\"Allah kıyamet günü her sırrı açığa çıkarır;"], [1330.6, "(bu sır) yüzlerde ya bir güzellik ya da bir çirkinlik olur.\" Anlamı şudur:"], [1335.0, "Sırlar, açığa çıkarılmak ve sevap-ceza, övgü-yergi gibi gerektirdikleri sonuçların açığa çıkarılmasıyla imtihan edilir."], [1343.0, "Bundan çıkan özet şudur: Kul kendi sırrına bakmalı ve rezilliklerin ortaya döküleceği günden önce Allah Azze ve Celle'nin onun sırrında hayırdan başka bir şey görmemesine tam bir hırsla özen göstermelidir. Allah en iyisini bilir."]]}]}, {"ts": "22:38", "title": "3. Külliye: Selefin iman tanımlarındaki sözler, lafızları farklı olsa da anlamca birdir", "paras": [{"reader": false, "ar": [[1358.0, "ومن الكلّيّات أيضًا: <b>كلُّ أقوال السلف في تعريف الإيمان وإن اختلفت ألفاظُها فمتّفقةٌ في معانيها.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [1383.0, "اعلم ـ رحمك الله تعالى ـ أنّ اختلاف عبارات السلف في تفسير الإيمان إنما هو من باب اختلاف التنوّع،"], [1390.7, "لا من باب اختلاف التضادّ."], [1393.0, "فتارةً يُعرّف أهلُ السنّة الإيمانَ بأنه قولٌ وعملٌ فقط،"], [1401.0, "وتارةً يقولون: هو قولٌ وعملٌ ونيّة،"], [1406.0, "وتارةً يقولون: قولٌ وعملٌ ونيّةٌ واتّباعُ السنّة،"], [1414.0, "وتارةً يقولون: قولٌ باللسان،"], [1416.8, "واعتقادٌ بالجَنان، وعملٌ بالجوارح والأركان؛"], [1424.0, "إلى غير ذلك من المأثور من أقوالهم في الإيمان. وكلُّها تعريفاتٌ صحيحة."]], "tr": [[1358.0, "<b>3. külliye: Selefin iman tanımındaki bütün sözleri, lafızları farklı olsa da anlamlarında birleşir.<\/b> (Tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [1383.0, "Bil ki —Allah Teâlâ sana rahmet etsin— selefin imanı tefsir ederken kullandığı ifadelerin farklılığı, zıtlık ihtilafı kabilinden değil, ancak çeşitlilik ihtilafı kabilindendir."], [1393.0, "Ehl-i Sünnet bazen imanı yalnızca \"söz ve amel\" diye tanımlar;"], [1402.5, "bazen \"söz, amel ve niyet\" derler;"], [1407.5, "bazen \"söz, amel, niyet ve Sünnet'e uymak\" derler;"], [1415.4, "bazen de \"dil ile söz, kalp ile itikad, azalar ve organlarla amel\" derler;"], [1424.0, "iman hakkında onlardan nakledilen diğer sözler de böyledir. Bunların hepsi doğru tanımlardır."]]}, {"reader": false, "ar": [[1431.0, "فإنهم إذا قالوا: الإيمانُ قولٌ وعمل،"], [1436.0, "فيقصدون به قولَ القلب وقولَ اللسان،"], [1441.0, "وعملَ القلب وعملَ الجوارح؛"], [1447.0, "وهذا من باب التعريف المختصر."], [1451.0, "وإذا قالوا: قولٌ وعملٌ واعتقاد،"], [1460.0, "فهو من باب التفصيل الذي يُوضّح أكثر فقط."], [1462.0, "وإذا قالوا: ونيّة، فإنما يريدون به بيانَ أنّ هذه الأعمال الظاهرة لا تنفع إلا إذا كانت مبنيّةً على نيّةٍ صحيحة."]], "tr": [[1431.0, "Çünkü \"İman söz ve ameldir\" dediklerinde bununla kalbin sözünü ve dilin sözünü, kalbin amelini ve azaların amelini kastederler;"], [1447.0, "bu, kısa tanım kabilindendir. \"Söz, amel ve itikad\" dediklerinde bu, sadece daha çok açıklayan bir tafsil kabilindendir."], [1462.0, "\"Ve niyet\" dediklerinde ise bununla, bu zâhir amellerin ancak sahih bir niyet üzerine bina edildiğinde fayda vereceğini açıklamayı kastederler."]]}, {"reader": false, "ar": [[1477.0, "وإذا قالوا: قولٌ وعملٌ ونيّةٌ واتّباعُ السنّة،"], [1483.0, "فهذا دليلٌ على تفصيلٍ زائدٍ من باب اللوازم؛"], [1489.0, "وهي أنه لا تنفع هذه الأعمال،"], [1491.7, "ولا تلك التعبّدات، ولا امتثالُ تلك الشرائع إلا إذا وافقت السنّة."], [1499.0, "فإنّ المتقرّر بإجماع أهل السنّة والجماعة أنّ قبول الأعمال موقوفٌ على سلامة الباطن فيها والظاهر؛"], [1507.0, "فسلامةُ الباطن هي النيّةُ الصحيحة،"], [1510.3, "و(سلامةُ) الظاهر هي موافقتُه للسنّة."]], "tr": [[1477.0, "\"Söz, amel, niyet ve Sünnet'e uymak\" dediklerinde ise bu, lâzımlar kabilinden fazladan bir tafsile delildir:"], [1489.0, "Bu ameller, bu ibadetler ve bu şeriatlere uymak, ancak Sünnet'e uygun olduğunda fayda verir."], [1499.0, "Zira Ehl-i Sünnet ve'l-Cemaat'in icmâıyla sabit olan şudur:"], [1502.7, "Amellerin kabulü, onlarda bâtının ve zâhirin selametine bağlıdır."], [1507.0, "Bâtının selameti sahih niyettir; zâhirin (selameti) ise onun Sünnet'e uygun olmasıdır."]]}, {"reader": false, "ar": [[1515.0, "ولا يقصدون بذلك ما يقصده المرجئةُ من قَصْر الإيمان على القول دون العمل،"], [1526.0, "ولا على القول والاعتقاد دون عمل الجوارح؛"], [1532.0, "ولكنّ بعضهم يُفصّل أحيانًا،"], [1534.4, "وبعضهم يذكر بعضَ اللوازم التي تلزم."], [1538.0, "وهذا كلُّه يدخل تحت قولنا في الكلّيّة:"], [1541.7, "إنه من خلاف التنوّع لا من خلاف التضادّ. والله أعلم."]], "tr": [[1515.0, "Bununla Mürcie'nin kastettiğini, yani imanı amel olmaksızın söze ya da azaların ameli olmaksızın söz ve itikada hasretmeyi kastetmezler."], [1529.7, "Fakat bazıları bazen tafsil eder, bazıları da gereken bazı lâzımları zikreder."], [1538.0, "Bunların hepsi, külliyedeki \"Bu, zıtlık ihtilafı değil çeşitlilik ihtilafıdır\" sözümüzün altına girer. Allah en iyisini bilir."]]}]}, {"ts": "25:47", "title": "4. Külliye: Her iman İslâm'dır, tersi değil", "paras": [{"reader": false, "ar": [[1547.0, "ومن الكلّيّات أيضًا ـ وهي كلّيّةٌ خفيفة ـ:"], [1552.0, "<b>كلُّ إيمانٍ فإسلامٌ ولا عكس.<\/b> <span class=\"note\">(يكررها)<\/span> وذلك لأنّ مراتب الدين ثلاثةُ أقسام:"], [1568.0, "أوّلُها الإسلام، ثم يعلوه الإيمان،"], [1571.1, "ثم يعلوه الإحسان. فالمرتبةُ العليا تدخل فيها المرتبةُ السفلى،"], [1576.8, "والسفلى لا تدخل في العليا؛"], [1580.0, "يعني بمعنى أنه ليس كلُّ مسلمٍ مؤمنًا،"], [1586.0, "ولكنّ كلَّ مؤمنٍ فإنه مسلم."], [1589.0, "كما قال الله عز وجل:"], [1591.9, "<span class=\"ayah\">﴿قَالَتِ الْأَعْرَابُ آمَنَّا ۖ قُل لَّمْ تُؤْمِنُوا وَلَٰكِن قُولُوا أَسْلَمْنَا﴾<\/span> <span class=\"ref\">[الحجرات: ١٤]<\/span>؛"], [1597.0, "فأثبت لهم الإسلامَ ونفى عنهم الإيمان."], [1601.0, "ثم قال الله عز وجل:"], [1604.0, "<span class=\"ayah\">﴿وَلَمَّا يَدْخُلِ الْإِيمَانُ فِي قُلُوبِكُمْ﴾<\/span> <span class=\"ref\">[الحجرات: ١٤]<\/span>؛"], [1607.0, "فأثبت لهم إسلامًا بلا إيمان."]], "tr": [[1547.0, "Külliyelerden biri de —ki hafif bir külliyedir—:"], [1552.0, "4. külliye: Her iman İslâm'dır;"], [1553.8, "tersi değil. (Tekrar ediyor.) Bunun sebebi, dinin mertebelerinin üç kısım olmasıdır:"], [1568.0, "Birincisi İslâm'dır, onun üstünde iman, onun da üstünde ihsan vardır."], [1573.0, "Üst mertebeye alt mertebe dahildir;"], [1575.5, "alt mertebe ise üst mertebeye dahil değildir."], [1580.0, "Yani her Müslüman mümin değildir;"], [1582.2, "fakat her mümin Müslümandır. Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [1589.0, "<span class=\"ayah\">﴿Bedeviler \"İman ettik\" dediler. De ki: \"İman etmediniz; fakat 'Müslüman olduk (teslim olduk)' deyin\"﴾<\/span> [Hucurât 14]."], [1597.0, "Onlar için İslâm'ı isbat etmiş, imanı ise onlardan nefyetmiştir."], [1601.0, "Sonra Allah Azze ve Celle şöyle buyurmuştur:"], [1604.0, "<span class=\"ayah\">﴿Henüz iman kalplerinize girmedi﴾<\/span> [Hucurât 14]."], [1607.0, "Böylece onlar için imansız bir İslâm isbat etmiştir."]]}, {"reader": false, "ar": [[1610.0, "وقد ثبت في الصحيحين من حديث سعد بن أبي وقّاص رضي الله عنهما قال:"], [1615.5, "أعطى النبيّ صلى الله عليه وسلم رهطًا ـ وسعدٌ جالس ـ،"], [1621.0, "فأعطاهم وترك رجلًا هو أحبُّهم إليّ،"], [1626.0, "فقلتُ: يا رسول الله،"], [1627.0, "ما لك عن فلان؟"], [1628.0, "فوالله إنّي لأراه مؤمنًا،"], [1631.0, "فقال: «أو مسلمًا». فسكتُّ حتى غلبني ما أعلمُ منه،"], [1636.0, "فقلتُ: يا رسول الله،"], [1637.5, "ما لك عن فلان؟"], [1639.0, "فوالله إنّي لأراه مؤمنًا،"], [1642.0, "فقال: «أو مسلمًا». فسكتُّ حتى غلبني ما أعلمُ منه،"], [1647.0, "فقلتُ: يا رسول الله،"], [1648.0, "ما لك عن فلان؟"], [1649.0, "فوالله إنّي لأراه مؤمنًا،"], [1652.0, "فقال: «أو مسلمًا». ثم قال:"], [1654.5, "«يا سعد، إنّي لأُعطي الرجلَ وغيرُه أحبُّ إليّ منه، مخافةَ أن يكُبَّه الله في النار»،"], [1662.0, "مخافةَ أن يكُبَّه الله في النار."]], "tr": [[1610.0, "Sahîhayn'de Sa'd b. Ebî Vakkâs'ın —Allah ondan razı olsun— hadisinde sabit olmuştur;"], [1615.5, "dedi ki: Peygamber sallallâhu aleyhi ve sellem bir gruba (bağış) verdi —Sa'd da oturuyordu—."], [1620.0, "Onlara verdi ve aralarında bana en sevimli olan bir adamı bıraktı."], [1626.2, "\"Ey Allah'ın Resûlü, falana ne oldu?"], [1628.0, "Vallahi ben onu mümin görüyorum\" dedim."], [1631.3, "\"Yoksa Müslüman mı?\" buyurdu. Onun hakkında bildiklerim bana galip gelinceye kadar sustum;"], [1636.4, "sonra \"Ey Allah'ın Resûlü, falana ne oldu?"], [1639.0, "Vallahi ben onu mümin görüyorum\" dedim."], [1642.3, "\"Yoksa Müslüman mı?\" buyurdu. Onun hakkında bildiklerim bana galip gelinceye kadar sustum;"], [1647.2, "sonra \"Ey Allah'ın Resûlü, falana ne oldu?"], [1649.0, "Vallahi ben onu mümin görüyorum\" dedim."], [1652.7, "\"Yoksa Müslüman mı?\" buyurdu. Sonra şöyle buyurdu:"], [1654.5, "\"Ey Sa'd! Ben bir adama, başkası bana ondan daha sevimli olduğu hâlde, Allah onu yüzüstü ateşe atmasın diye veririm\" —Allah onu yüzüstü ateşe atmasın diye—."]]}, {"reader": false, "ar": [[1665.0, "والأدلّةُ على هذا متعدّدة؛"], [1668.0, "فإذًا كلُّ مؤمنٍ فإنه يوصَف بأنه مسلم،"], [1671.0, "ولكن ليس كلُّ مسلمٍ يوصَف بأنه مؤمن."]], "tr": [[1665.0, "Bunun delilleri çoktur. Demek ki her mümin Müslüman olarak vasfedilir;"], [1671.0, "fakat her Müslüman mümin olarak vasfedilmez."]]}]}, {"ts": "27:55", "title": "4. Külliye (devam): İmanı nefyedilip İslâm'ı isbat edilenlerin İslâm'ı hakkındaki görüşler", "paras": [{"reader": false, "ar": [[1675.0, "وهنا مسألةٌ مهمّة: اختلف العلماءُ رحمهم الله تعالى فيمن يَصدُق عليه اسمُ الإسلام لا الإيمان <span class=\"q\">؟ 28:01<\/span>:"], [1686.0, "أفيكون إسلامُه من الإسلام الذي يُمدَح به،"], [1690.0, "أم أنّ نفي الإيمان عنهم من باب الذمّ ـ فهمت؟"], [1696.0, "ـ في قوله: <span class=\"ayah\">﴿قَالَتِ الْأَعْرَابُ آمَنَّا ۖ قُل لَّمْ تُؤْمِنُوا وَلَٰكِن قُولُوا أَسْلَمْنَا﴾<\/span> <span class=\"ref\">[الحجرات: ١٤]<\/span>؟"], [1702.0, "فهل قَصْرُهم على الإسلام من باب الإسلام الذي يُثاب عليه صاحبُه ويُمدَح به،"], [1710.0, "أم أنّ هذا من باب قَصْر الذمّ؟"]], "tr": [[1675.0, "Burada önemli bir mesele var:"], [1678.0, "Âlimler —Allah Teâlâ onlara rahmet etsin— iman değil de İslâm isminin kendisine uyduğu <span class=\"q\">؟<\/span> kimse hakkında ihtilaf etmişlerdir:"], [1686.0, "Onun İslâm'ı, kendisiyle övülen İslâm'dan mıdır, yoksa onlardan imanın nefyedilmesi yerme kabilinden midir —anladın mı?— <span class=\"ayah\">﴿Bedeviler \"İman ettik\" dediler. De ki: \"İman etmediniz; fakat 'Müslüman olduk' deyin\"﴾<\/span> [Hucurât 14] sözünde?"], [1702.0, "Onların İslâm'la sınırlandırılması, sahibinin sevap kazandığı ve övüldüğü İslâm kabilinden midir, yoksa bu, yermek için sınırlandırma kabilinden midir?"]]}, {"reader": false, "ar": [[1713.0, "اختلف العلماءُ رحمهم الله تعالى في تلك النصوص التي يدّعي أصحابُها الإيمان،"], [1719.0, "فيأتي النصُّ نافيًا الإيمانَ ومُثبتًا الإسلام:"], [1722.0, "ما المرادُ بذلك؟ على أقوالٍ كثيرة."], [1726.0, "فمنهم من حمل ذلك الإسلامَ مع نفي الإيمان على إسلام المنافقين،"], [1737.0, "وهذا قال به طائفةٌ من السلف:"], [1741.0, "إنّ طائفةً من المنافقين ـ أعرابًا كانوا أو غيرَ أعراب ـ يعلم اللهُ عز وجل النفاقَ من قلوبهم،"], [1750.0, "إذ ادّعوا الإيمانَ، فأنزلهم عن هذه الرتبة العظيمة إلى رتبة الإسلام؛"], [1755.0, "وهي الرتبة التي يتعامل فيها المسلمُ مع أخيه الذي يدّعي الإسلامَ في الظاهر."], [1761.0, "فهذا دليلٌ على أنّ المسألة تَجري مَجرى الذمّ،"], [1766.5, "وليست مَجرى المدح. أنتم معي في هذا أم لا؟"]], "tr": [[1713.0, "Âlimler —Allah Teâlâ onlara rahmet etsin— sahiplerinin iman iddia ettiği, nassın ise imanı nefyedip İslâm'ı isbat ederek geldiği o nasların ne kastettiği hakkında pek çok görüş üzere ihtilaf etmişlerdir."], [1726.0, "Onlardan bir kısmı, imanın nefyiyle birlikte (anılan) o İslâm'ı münafıkların İslâm'ına hamletmiştir;"], [1737.7, "bunu selefin bir kısmı söylemiştir:"], [1741.0, "Bedevi olsun veya olmasın, münafıklardan bir grup vardır ki Allah Azze ve Celle kalplerindeki nifakı bilir;"], [1750.0, "iman iddia ettiklerinde (Allah) onları bu büyük mertebeden İslâm mertebesine indirmiştir."], [1755.0, "Bu, Müslümanın zâhirde İslâm iddia eden kardeşiyle muamele ettiği mertebedir."], [1761.0, "Bu da meselenin övgü yolunda değil, yergi yolunda cereyan ettiğine delildir."], [1769.0, "Bu konuda benimle misiniz, değil misiniz?"]]}, {"reader": false, "ar": [[1772.0, "ومن أهل العلم من قال:"], [1774.5, "إنما يُحمَل على إسلام من خاف القتل من الأعراب،"], [1779.3, "الذين يدخلون في الإسلام كراهيةً،"], [1782.7, "خوفًا من القتل أو السبي؛"], [1786.0, "فإنه إذا سُبي كافرًا فإنه سيكون مُسترَقًّا،"], [1790.9, "أو قد يُقتل. فخوفًا من السبي والقتل ادّعى الإسلام،"], [1795.0, "فلمّا ادّعى رتبةً فوق الإسلام جاء النصُّ نافيًا تلك الرتبةَ العليا،"], [1801.6, "ومُثبتًا له الرتبةَ الدنيا."], [1804.0, "أنتم معي في هذا أم لا؟ مستوعبين؟"]], "tr": [[1772.0, "İlim ehlinden bazıları da şöyle demiştir:"], [1774.5, "(Bu İslâm) ancak bedevilerden öldürülmekten korkan, öldürülme veya esir edilme korkusuyla istemeyerek İslâm'a giren kimsenin İslâm'ına hamledilir."], [1786.0, "Çünkü o, kâfir olarak esir alınırsa köleleştirilecek veya öldürülebilecektir."], [1793.0, "Esir edilme ve öldürülme korkusuyla İslâm iddia etmiştir;"], [1795.0, "İslâm'ın üstünde bir mertebe iddia edince de nass, o üst mertebeyi ondan nefyederek ve ona alt mertebeyi isbat ederek gelmiştir."], [1804.0, "Bu konuda benimle misiniz, değil misiniz? Kavradınız mı?"]]}]}, {"ts": "30:07", "title": "4. Külliye (sonuç): İbn Teymiyye'nin tercihi — nefy, vâki bir durumun nefyidir", "paras": [{"reader": false, "ar": [[1807.0, "وهذا قال به بعضُ السلف رحمهم الله تعالى،"], [1811.0, "ولكنّ الأصحَّ هو القولُ الثالث،"], [1815.0, "وهو الذي اختاره أبو العبّاس ابن تيميّة رحمه الله؛"], [1819.0, "وهي أن نقول: إنّ حقيقة هذا النفي الشرعيّ في الأدلّة أنه نفيٌ لأمرٍ واقع؛"], [1827.0, "يعني بمعنى أنهم لم يصلوا إلى مرتبة الإيمان،"], [1832.1, "وإنما لا يزالون في دائرة الإسلام."], [1836.0, "وإسلامُهم الذي أثبته النصُّ لهم هو ذلك الإسلامُ الصحيح الذي يُثاب عليه صاحبُه."], [1844.0, "فحقيقةُ هذا النفي ليس تشكيكًا في إسلامهم،"], [1849.0, "وإنما إثباتٌ لحقيقة أمرٍ:"], [1851.0, "أنهم لم يصلوا إلى الرتبة العليا التي يدّعونها،"], [1855.0, "وإنما لا يزالون في أوائل أمرهم."]], "tr": [[1807.0, "Bunu da selefin bir kısmı —Allah Teâlâ onlara rahmet etsin— söylemiştir."], [1815.4, "Fakat en sahih olanı üçüncü görüştür;"], [1819.0, "Ebü'l-Abbâs İbn Teymiyye'nin —Allah ona rahmet etsin— tercih ettiği de odur."], [1827.0, "Şöyle deriz: Delillerdeki bu şer'î nefyin hakikati, vâki olan bir durumun nefyidir;"], [1832.1, "yani onlar iman mertebesine ulaşmamışlardır, hâlâ İslâm dairesindedirler."], [1836.0, "Nassın onlar için isbat ettiği İslâm, sahibinin sevap kazandığı o sahih İslâm'dır."], [1844.0, "Bu nefyin hakikati onların İslâm'ı hakkında şüphe uyandırmak değildir;"], [1851.0, "bilakis şu durumun hakikatini isbattır:"], [1853.5, "Onlar iddia ettikleri üst mertebeye ulaşmamışlardır, hâlâ işlerinin başlangıcındadırlar."]]}, {"reader": false, "ar": [[1860.0, "ولذلك قال ابن تيميّة رحمه الله:"], [1862.7, "«وحقيقتُه أنّ من لم يكن من المؤمنين حقًّا يُقال له: إنه مسلم»."], [1868.0, "فالمقصودُ من هذا النفي إنما هو نفيُ هذه الدعوى التي هي الإيمان،"], [1876.0, "وليس تشكيكًا في حقيقة ما هم عليه من أمر الإسلام،"], [1883.0, "من أمر الإسلام. أنتم معي في هذا يا جماعة؟"]], "tr": [[1860.0, "Bu yüzden İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [1862.7, "\"Bunun hakikati şudur: Gerçek müminlerden olmayan kimseye 'Müslümandır' denir.\" Bu nefyden maksat, ancak iman olan bu iddianın nefyidir;"], [1874.7, "onların üzerinde bulundukları İslâm işinin hakikati hakkında şüphe uyandırmak değildir —İslâm işinin—."], [1885.0, "Bu konuda benimle misiniz, ey cemaat?"]]}, {"reader": false, "ar": [[1888.0, "وهذه الكلّيّة تدلّ على أنّ الإنسان إذا نطق بالشهادتين،"], [1896.0, "ولم يترقَّ بعدُ في مدارج الدين بالعمل بالمأمورات وترك المحظورات،"], [1901.0, "فإنه لا ينبغي أن يُزكّي نفسَه بالشهادة لها بالإيمان مباشرةً،"], [1907.0, "وإنما لا يزال في دائرة الإسلام؛"], [1911.0, "فالإسلامُ يكفي فيه النطقُ بالشهادتين."], [1914.0, "ثم إذا فعل الإنسانُ المأمورات،"], [1916.3, "وترك المحظورات، وترقّى في مدارج العمل،"], [1919.0, "حينئذٍ يزداد إيمانُه شيئًا فشيئًا حتى يصل إلى مرتبة الإحسان. والله أعلم."]], "tr": [[1888.0, "Bu külliye şuna delâlet eder:"], [1890.8, "İnsan iki şehadeti söyleyip de emredilenleri yapmak ve yasaklananları terk etmekle henüz dinin basamaklarında yükselmemişse, doğrudan nefsine imanla şahitlik ederek onu temize çıkarmamalıdır;"], [1905.2, "o hâlâ İslâm dairesindedir. İslâm'da iki şehadeti söylemek yeterlidir."], [1911.0, "Sonra insan emredilenleri yapar, yasaklananları terk eder ve amel basamaklarında yükselirse, işte o zaman imanı yavaş yavaş artar ve nihayet ihsan mertebesine ulaşır. Allah en iyisini bilir."]]}]}, {"ts": "32:05", "title": "5. Külliye: Her ihsan imandır, tersi değil", "paras": [{"reader": false, "ar": [[1925.0, "ومن الكلّيّات أيضًا ـ وهي كلّيّةٌ خفيفة ـ:"], [1928.0, "<b>كلُّ إحسانٍ فإيمانٌ ولا عكس.<\/b> <span class=\"note\">(يكررها)<\/span> يعني:"], [1937.8, "وليس كلُّ مؤمنٍ محسنًا."], [1946.8, "والإحسانُ هو أعلى مراتب الدين وأخصُّها،"], [1954.0, "وقد فسّره النبيّ صلى الله عليه وسلم بقوله:"], [1958.0, "«أن تعبدَ الله كأنّك تراه، فإن لم تكن تراه فإنه يراك»."], [1962.9, "ولا يمكن لأيّ شخصٍ أن يصل إلى هذه المرتبة العالية من المراقبة والعمل الصالح إلا إذا كان قد حقّق أصلَ الإيمان وكمالاتِه."]], "tr": [[1925.0, "Külliyelerden biri de —ki hafif bir külliyedir—:"], [1928.0, "5. külliye: Her ihsan imandır;"], [1937.8, "tersi değil. (Tekrar ediyor.) Yani her mümin muhsin değildir."], [1953.5, "İhsan, dinin en yüksek ve en has mertebesidir."], [1958.0, "Peygamber sallallâhu aleyhi ve sellem onu şu sözüyle tefsir etmiştir:"], [1960.7, "\"Allah'a, O'nu görüyormuşsun gibi ibadet etmendir;"], [1962.9, "sen O'nu görmüyorsan da O seni görür.\" Hiç kimse, imanın aslını ve kemâllerini gerçekleştirmiş olmadıkça murakabe ve salih amelin bu yüksek mertebesine ulaşamaz."]]}, {"reader": false, "ar": [[1975.0, "وقولُه في الكلّيّة: «ولا عكس»؛"], [1982.0, "أي: لا يصحّ العكس،"], [1984.0, "فلا يمكننا القولُ بأنّ كلَّ مؤمنٍ هو محسن؛"], [1987.0, "وذلك لأنّ الإيمان مرتبةٌ أدنى من مرتبة الإحسان."], [1994.0, "والقاعدةُ القرآنيّة أنّ لفظة الإحسان في القرآن يُراد بها كمالاتُ كلِّ عملٍ صالح ـ أنّ كلمة الإحسان في القرآن يُراد بها كمالاتُ كلِّ عملٍ صالح ـ."]], "tr": [[1975.0, "Külliyedeki \"tersi değil\" sözü, tersinin doğru olmadığı demektir;"], [1982.5, "her müminin muhsin olduğunu söyleyemeyiz."], [1985.5, "Çünkü iman, ihsan mertebesinden daha aşağı bir mertebedir."], [1994.0, "Kur'ânî kaide şudur: Kur'ân'da ihsan lafzıyla her salih amelin kemâlleri kastedilir —Kur'ân'da ihsan kelimesiyle her salih amelin kemâlleri kastedilir—."]]}, {"reader": false, "ar": [[2014.0, "وقد جمع الله عز وجل هؤلاء الثلاثة ـ المسلمين والمؤمنين والمحسنين ـ في آيةٍ واحدة،"], [2023.0, "في قول الله عز وجل:"], [2025.7, "<span class=\"ayah\">﴿ثُمَّ أَوْرَثْنَا الْكِتَابَ الَّذِينَ اصْطَفَيْنَا مِنْ عِبَادِنَا ۖ فَمِنْهُمْ ظَالِمٌ لِّنَفْسِهِ﴾<\/span> ـ وهي مرتبة الإسلام ـ <span class=\"ayah\">﴿وَمِنْهُم مُّقْتَصِدٌ﴾<\/span> ـ وهي مرتبة الإيمان ـ <span class=\"ayah\">﴿وَمِنْهُمْ سَابِقٌ بِالْخَيْرَاتِ بِإِذْنِ اللَّهِ﴾<\/span> <span class=\"ref\">[فاطر: ٣٢]<\/span>."]], "tr": [[2014.0, "Allah Azze ve Celle bu üç (grubu) —Müslümanları, müminleri ve muhsinleri— tek bir ayette bir araya getirmiştir;"], [2023.0, "Allah Azze ve Celle'nin şu sözünde:"], [2025.7, "<span class=\"ayah\">﴿Sonra Kitab'ı kullarımızdan seçtiklerimize miras bıraktık. Onlardan kimi kendine zulmedendir﴾<\/span> —bu İslâm mertebesidir— <span class=\"ayah\">﴿kimi orta yolu tutandır﴾<\/span> —bu iman mertebesidir— <span class=\"ayah\">﴿kimi de Allah'ın izniyle hayırlarda öne geçendir﴾<\/span> [Fâtır 32]."]]}, {"reader": false, "ar": [[2041.0, "وكذلك أيضًا في صحيح الإمام مسلم من حديث جبريل عليه السلام:"], [2047.0, "لمّا سأل النبيَّ صلى الله عليه وسلم عن الإسلام فسّره بالأعمال الظاهرة،"], [2053.0, "ولمّا سأله عن الإيمان فسّره بالأعمال الباطنة،"], [2058.0, "ولمّا سأله عن الإحسان فسّره بالأمرين جميعًا،"], [2062.0, "فسّره بالأمرين جميعًا. ومتى ما سمعتَ أهلَ السنّة يقولون:"], [2068.3, "«وهذا مقامُ المشاهدة» ـ وهذا يتكرّر كثيرًا في كلام ابن تيميّة والإمام ابن القيّم رحمهم الله وغيرِهما ـ فاعلم أنهم يريدون بها مرتبةَ الإحسان. والله أعلم."]], "tr": [[2041.0, "Aynı şekilde İmam Müslim'in Sahîh'inde Cibrîl aleyhisselâm hadisinde (geçer):"], [2047.0, "Peygamber sallallâhu aleyhi ve sellem'e İslâm'ı sorduğunda onu zâhir amellerle tefsir etti;"], [2052.0, "imanı sorduğunda onu bâtın amellerle tefsir etti;"], [2055.9, "ihsanı sorduğunda ise onu her iki şeyle birlikte tefsir etti —her ikisiyle birlikte tefsir etti—."], [2064.0, "Ehl-i Sünnet'in \"Bu, müşâhede makamıdır\" dediğini işittiğinde —bu, İbn Teymiyye'nin, İmam İbn Kayyim'in —Allah onlara rahmet etsin— ve başkalarının sözlerinde çokça tekrarlanır— bilmelisin ki bununla ihsan mertebesini kastederler. Allah en iyisini bilir."]]}]}, {"ts": "34:42", "title": "6. Külliye: İslâm veya iman tek başına anıldığında diğerini de kapsar; birlikte anıldıklarında ayrışırlar", "paras": [{"reader": false, "ar": [[2082.0, "ومنها أيضًا: كلّما ذُكر الإسلامُ أو الإيمانُ منفردًا دخل معه ما لم يُذكر،"], [2099.0, "وإن ذُكِرا خُصَّ الإسلامُ بعمل الظاهر،"], [2111.0, "والإيمانُ بعمل الباطن. <span class=\"note\">(يكررها)<\/span> كلّيّةٌ طويلةٌ شويّ."], [2114.0, "أقول وبالله التوفيق: فهذه الكلّيّة فيها جزئيّتان:"], [2118.0, "الجزئيّة الأولى: جزئيّة الافتراق،"], [2122.0, "والجزئيّة الثانية: جزئيّة الاجتماع."], [2126.0, "فتنصّ هذه الكلّيّة في أوّلها على جزئيّة الافتراق؛"], [2132.0, "وهي أنّ الإيمان إذا ذُكر في النصّ وحده دخل معه الإسلامُ تبعًا،"], [2137.0, "وإذا ذُكر الإسلامُ وحده دخل معه الإيمانُ تبعًا."]], "tr": [[2082.0, "Onlardan biri de şudur: 6."], [2084.2, "külliye: İslâm veya iman ne zaman tek başına anılırsa, anılmayan da onunla birlikte (anlamına) girer;"], [2103.5, "ikisi birlikte anılırsa İslâm zâhirin ameliyle, iman da bâtının ameliyle hususileşir. (Tekrar ediyor.) Biraz uzunca bir külliye."], [2114.0, "Tevfik Allah'tandır, derim ki: Bu külliyede iki cüz vardır:"], [2118.0, "Birinci cüz, ayrı anılma cüz'üdür;"], [2124.0, "ikinci cüz, birlikte anılma cüz'üdür."], [2127.2, "Bu külliye başında ayrı anılma cüz'ünü belirtir:"], [2132.0, "İman nasta tek başına anıldığında İslâm da ona tâbi olarak onunla birlikte girer;"], [2136.2, "İslâm tek başına anıldığında da iman ona tâbi olarak onunla birlikte girer."]]}, {"reader": false, "ar": [[2141.0, "وهذا كثيرٌ في اللغة:"], [2144.0, "كلفظ التوبة والاستغفار، ولفظ المشرك والكافر،"], [2149.0, "ولفظ الفقير والمسكين؛ فإنها ألفاظٌ يتّفق معناها عند افتراقها،"], [2158.0, "ويختلف معناها عند اجتماع ألفاظها."], [2161.0, "فمتى ما رأيتَ الدليلَ يذكر الإسلامَ وحده فالمرادُ به الدينُ كلُّه،"], [2167.0, "وإذا رأيتَ النصَّ يذكر الإيمانَ وحده فإنه يُراد به الدينُ كلُّه كذلك."], [2175.0, "فقولُ الله عز وجل:"], [2176.8, "<span class=\"ayah\">﴿إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ﴾<\/span> <span class=\"ref\">[آل عمران: ١٩]<\/span>؛ أي: والإيمان."]], "tr": [[2141.0, "Bu, dilde çoktur: Tövbe ve istiğfar lafzı, müşrik ve kâfir lafzı, fakir ve miskin lafzı gibi."], [2152.0, "Bunlar, ayrı anıldıklarında anlamları birleşen, lafızları bir araya geldiğinde ise anlamları ayrışan lafızlardır."], [2161.0, "Delilin İslâm'ı tek başına andığını gördüğünde bununla dinin tamamı kastedilir;"], [2166.5, "nassın imanı tek başına andığını gördüğünde de bununla yine dinin tamamı kastedilir."], [2175.0, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Şüphesiz Allah katında din İslâm'dır﴾<\/span> [Âl-i İmrân 19] sözü de böyledir; yani iman da (dahildir)."]]}, {"reader": false, "ar": [[2180.0, "وكذلك ما في الصحيحين من حديث ابن عبّاس رضي الله عنهما في قصّة وفد عبد القيس لمّا أتوا النبيَّ صلى الله عليه وسلم،"], [2191.8, "قال: «من القوم؟» ـ أو:"], [2193.4, "«من الوفد؟» ـ قالوا: ربيعة،"], [2195.0, "قال: «مرحبًا بالقوم ـ أو: بالوفد ـ غيرَ خزايا ولا ندامى»."], [2199.0, "فقالوا: يا رسول الله،"], [2200.3, "إنّا نأتيك من شُقّةٍ بعيدة،"], [2202.0, "وبيننا وبينك هذا الحيُّ من كفّار مُضَر،"], [2205.0, "وإنّا لا نستطيع أن نأتيك إلا في الشهر الحرام،"], [2209.0, "فمُرنا بأمرٍ فَصْلٍ نُخبر به من وراءنا،"], [2211.8, "وندخل به الجنّة. قال:"], [2213.5, "فأمرهم بأربعٍ، ونهاهم عن أربع:"], [2216.0, "أمرهم بالإيمان بالله وحده،"], [2218.0, "فقال: «هل تدرون ما الإيمانُ بالله وحده؟» قالوا:"], [2223.5, "الله ورسوله أعلم، قال:"], [2225.5, "«شهادةُ أن لا إله إلا الله وأنّ محمدًا رسول الله، وإقامُ الصلاة، وإيتاءُ الزكاة، وصومُ رمضان، وأن تُعطوا خُمُسًا من المغنم»."]], "tr": [[2180.0, "Aynı şekilde Sahîhayn'de İbn Abbâs'ın —Allah ikisinden razı olsun— hadisinde, Abdülkays heyetinin Peygamber sallallâhu aleyhi ve sellem'e geldiği kıssada (şöyle geçer):"], [2189.4, "\"Bu topluluk kim?\" —veya \"Bu heyet kim?\"— buyurdu."], [2192.2, "\"Rebîa\" dediler. \"Ne rezil ne de pişman olmuş olarak gelen topluluğa —veya heyete— merhaba\" buyurdu."], [2194.6, "\"Ey Allah'ın Resûlü, biz sana uzak bir yoldan geliyoruz;"], [2199.0, "bizimle senin aranda Mudar kâfirlerinden şu kabile var."], [2202.4, "Sana ancak haram ayda gelebiliyoruz."], [2205.0, "Bize, arkamızda bıraktıklarımıza haber vereceğimiz ve onunla cennete gireceğimiz kesin bir iş emret\" dediler."], [2213.0, "(Râvi) dedi ki: Onlara dört şeyi emretti, dört şeyi yasakladı:"], [2216.0, "Onlara yalnız Allah'a imanı emretti ve \"Yalnız Allah'a imanın ne olduğunu biliyor musunuz?\" buyurdu."], [2223.5, "\"Allah ve Resûlü daha iyi bilir\" dediler."], [2225.5, "Buyurdu ki: \"Allah'tan başka ilâh olmadığına ve Muhammed'in Allah'ın Resûlü olduğuna şahitlik etmek, namazı kılmak, zekâtı vermek, Ramazan orucunu tutmak ve ganimetten beşte birini vermenizdir.\""]]}, {"reader": false, "ar": [[2235.0, "والشاهدُ من ذلك أنه فسّر الإيمانَ ـ لمّا ذُكر مفردًا ـ بالإسلام؛"], [2240.0, "لأنّ الإيمان متى ما ذُكر مفردًا فإنه يُفسَّر بالإسلام، يُفسَّر بالإسلام أيضًا."]], "tr": [[2235.0, "Buradaki delil şudur: İman tek başına anılınca onu İslâm ile tefsir etmiştir."], [2239.5, "Çünkü iman ne zaman tek başına anılırsa İslâm ile de tefsir edilir —İslâm ile de tefsir edilir—."]]}, {"reader": false, "ar": [[2248.0, "الجزئيّة الثانية في قوله:"], [2250.8, "«وإن ذُكِرا معًا» إلى آخره."], [2259.0, "أقول: إذا رأيتَ النصَّ يذكر الإسلامَ والإيمانَ فاعلم أنهما يختلفان في المعنى؛"], [2266.0, "فيكون الإسلامُ معناه الأعمالَ الظاهرة،"], [2269.6, "والإيمانُ معناه الأعمالَ الباطنة."], [2273.0, "كما اجتمع في قول الله عز وجل:"], [2276.1, "<span class=\"ayah\">﴿قَالَتِ الْأَعْرَابُ آمَنَّا ۖ قُل لَّمْ تُؤْمِنُوا وَلَٰكِن قُولُوا أَسْلَمْنَا﴾<\/span> <span class=\"ref\">[الحجرات: ١٤]<\/span>؛"], [2280.0, "أي: أثبِتوا لأنفسكم الأعمالَ الظاهرةَ أوّلًا،"], [2284.0, "ولا حقَّ لكم أن تدّعوا شيئًا من أعمال القلوب الباطنة إلا بوجودها حقيقةً."]], "tr": [[2248.0, "İkinci cüz, \"ikisi birlikte anılırsa…\" sözündedir."], [2259.0, "Derim ki: Nassın İslâm'ı ve imanı (birlikte) andığını gördüğünde bil ki ikisi anlamca ayrışır:"], [2266.0, "İslâm'ın anlamı zâhir ameller, imanın anlamı bâtın ameller olur."], [2271.0, "Nitekim Allah Azze ve Celle'nin şu sözünde bir araya gelmişlerdir:"], [2276.1, "<span class=\"ayah\">﴿Bedeviler \"İman ettik\" dediler. De ki: \"İman etmediniz; fakat 'Müslüman olduk' deyin\"﴾<\/span> [Hucurât 14]."], [2280.0, "Yani önce kendiniz için zâhir amelleri isbat edin;"], [2284.0, "kalplerin bâtın amellerinden herhangi bir şeyi, ancak onlar gerçekten var olduğunda iddia etme hakkınız vardır."]]}, {"reader": false, "ar": [[2290.0, "وكذلك في حديث جبريل المشهور:"], [2294.0, "لمّا سُئل النبيّ صلى الله عليه وسلم عن الإسلام والإيمان،"], [2298.0, "فسّر الإسلامَ بالأعمال الظاهرة،"], [2301.0, "وفسّر الإيمانَ بالأعمال الباطنة."], [2304.0, "وعلى ذلك قولُ أهل العلم:"], [2306.0, "الأحكامُ في الدنيا على الإسلام،"], [2308.8, "وفي الآخرة على الإيمان."], [2311.0, "الأحكامُ في الدنيا على الإسلام؛"], [2313.2, "أي: على الأعمال الظاهرة،"], [2315.0, "وأمّا في الآخرة فإنها على الإسلام (أي: الإيمان). والأمرُ واضح."]], "tr": [[2290.0, "Aynı şekilde meşhur Cibrîl hadisinde de Peygamber sallallâhu aleyhi ve sellem'e İslâm ve iman sorulduğunda İslâm'ı zâhir amellerle, imanı bâtın amellerle tefsir etmiştir."], [2304.0, "İlim ehlinin şu sözü de buna dayanır:"], [2306.0, "\"Dünyada hükümler İslâm'a göre, ahirette ise imana göredir.\" Dünyada hükümler İslâm'a, yani zâhir amellere göredir;"], [2313.2, "ahirette ise İslâm'a (yani imana) göredir. Mesele açıktır."]]}]}, {"ts": "38:41", "title": "7. Külliye: Öncekilerin vasfedildiği her İslâm, genel anlamdaki İslâm'dır", "paras": [{"reader": false, "ar": [[2321.0, "الكلّيّة التي بعدها: <b>كلُّ إسلامٍ في النصوص وُصف به مَن قبلنا فيُراد به الإسلامُ بالمعنى العامّ لا بالخاصّ.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span> أقول وبالله التوفيق:"], [2356.0, "وهذه الكلّيّة تُبيّن لك إشكالًا يقع فيه البعض؛"], [2362.0, "وهي أنّ الله عز وجل خاطب بالإسلام مَن قبلنا،"], [2368.2, "ووصفهم بأنهم مسلمون، وأنّ الدين الذي بُعثوا به هو الإسلام؛"], [2373.0, "فما الفرقُ بين الإسلام العامّ والإسلام الخاصّ؟"], [2379.0, "الجوابُ هو ما تنصّ عليه هذه الكلّيّة:"], [2384.0, "وهي أنّ كلَّ إسلامٍ في النصوص يوصَف به مَن قبلنا فالمرادُ به الإسلامُ العامّ."]], "tr": [[2321.0, "Ondan sonraki külliye: 7. külliye:"], [2323.0, "Naslarda bizden öncekilerin kendisiyle vasfedildiği her İslâm'dan, özel değil genel anlamdaki İslâm kastedilir. (Üç kez tekrar ediyor.) Tevfik Allah'tandır, derim ki:"], [2356.0, "Bu külliye sana bazılarının düştüğü bir müşkili açıklar:"], [2362.0, "Allah Azze ve Celle bizden öncekilere İslâm ile hitap etmiş, onları Müslümanlar olarak vasfetmiş ve gönderildikleri dinin İslâm olduğunu bildirmiştir."], [2373.0, "O hâlde genel İslâm ile özel İslâm arasındaki fark nedir?"], [2384.0, "Cevap, bu külliyenin belirttiği şeydir:"], [2385.7, "Naslarda bizden öncekilerin kendisiyle vasfedildiği her İslâm'dan kastedilen genel İslâm'dır."]]}, {"reader": false, "ar": [[2390.0, "فإن قلتَ: وما المرادُ بالإسلام العامّ؟"], [2393.5, "فنقول: المرادُ به الاستسلامُ لله بالتوحيد،"], [2397.0, "والانقيادُ له بالطاعة، والخلوصُ من الشرك."], [2402.0, "فكلُّ من آمن بنبيّ زمانه،"], [2405.6, "وأقام توحيدَه في عقيدته،"], [2409.0, "فإنه يوصَف بأنه مسلمٌ بالإسلام العامّ."], [2414.0, "كقول الله عز وجل عن إبراهيم وإسماعيل عليهما السلام أنهما قالا:"], [2422.0, "<span class=\"ayah\">﴿رَبَّنَا وَاجْعَلْنَا مُسْلِمَيْنِ لَكَ﴾<\/span> <span class=\"ref\">[البقرة: ١٢٨]<\/span>؛"], [2424.4, "فالمرادُ بالإسلام هنا: الإسلامُ العامّ."], [2428.0, "وقولُ الله عز وجل:"], [2430.2, "<span class=\"ayah\">﴿إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ﴾<\/span> <span class=\"ref\">[آل عمران: ١٩]<\/span>؛ بمعناه الشامل."]], "tr": [[2390.0, "\"Genel İslâm'dan kastedilen nedir?\" dersen deriz ki:"], [2393.5, "Kastedilen, tevhid ile Allah'a teslim olmak, itaat ile O'na boyun eğmek ve şirkten arınmaktır."], [2402.0, "Zamanının peygamberine iman eden ve akîdesinde tevhidini ikame eden herkes, genel İslâm ile Müslüman olarak vasfedilir."], [2414.0, "Allah Azze ve Celle'nin İbrâhîm ve İsmâil —aleyhimesselâm— hakkında onların şöyle dediğini bildirmesi gibi:"], [2422.0, "<span class=\"ayah\">﴿Rabbimiz! Bizi sana teslim olmuş (iki Müslüman) kıl﴾<\/span> [Bakara 128]."], [2424.4, "Buradaki İslâm'dan kastedilen genel İslâm'dır."], [2426.8, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Şüphesiz Allah katında din İslâm'dır﴾<\/span> [Âl-i İmrân 19] sözü de kapsayıcı anlamıyladır."]]}]}, {"ts": "40:34", "title": "7. Külliye (devam): Mûsâ, Süleyman, İbrâhîm ve Ya'kûb'un diliyle İslâm", "paras": [{"reader": false, "ar": [[2434.0, "وقال الله عز وجل:"], [2436.6, "<span class=\"ayah\">﴿وَقَالَ مُوسَىٰ يَا قَوْمِ إِن كُنتُمْ آمَنتُم بِاللَّهِ فَعَلَيْهِ تَوَكَّلُوا إِن كُنتُم مُّسْلِمِينَ﴾<\/span> <span class=\"ref\">[يونس: ٨٤]<\/span>؛"], [2448.0, "والمرادُ به الإسلامُ العامّ."], [2450.0, "ويقول الله عز وجل عن سليمان عليه الصلاة والسلام:"], [2456.0, "<span class=\"ayah\">﴿أَلَّا تَعْلُوا عَلَيَّ وَأْتُونِي مُسْلِمِينَ﴾<\/span> <span class=\"ref\">[النمل: ٣١]<\/span>،"], [2459.0, "وقال أيضًا عنه: <span class=\"ayah\">﴿قَالَ يَا أَيُّهَا الْمَلَأُ أَيُّكُمْ يَأْتِينِي بِعَرْشِهَا قَبْلَ أَن يَأْتُونِي مُسْلِمِينَ﴾<\/span> <span class=\"ref\">[النمل: ٣٨]<\/span>؛"], [2468.0, "أي: مستسلمين، مُذعنين للتوحيد."], [2472.0, "وقال الله عز وجل عن سليمان أيضًا:"], [2476.6, "<span class=\"ayah\">﴿فَلَمَّا جَاءَتْ قِيلَ أَهَٰكَذَا عَرْشُكِ ۖ قَالَتْ كَأَنَّهُ هُوَ ۚ وَأُوتِينَا الْعِلْمَ مِن قَبْلِهَا وَكُنَّا مُسْلِمِينَ﴾<\/span> <span class=\"ref\">[النمل: ٤٢]<\/span>."]], "tr": [[2434.0, "Allah Azze ve Celle buyurdu:"], [2436.6, "<span class=\"ayah\">﴿Mûsâ dedi ki: \"Ey kavmim! Eğer Allah'a iman ettiyseniz ve Müslümanlar (teslim olanlar) iseniz yalnız O'na tevekkül edin\"﴾<\/span> [Yûnus 84]."], [2448.0, "Bundan kastedilen genel İslâm'dır. Allah Azze ve Celle, Süleyman —aleyhissalâtü vesselâm— hakkında şöyle buyurur:"], [2450.0, "<span class=\"ayah\">﴿Bana karşı büyüklük taslamayın ve bana teslim olarak (Müslümanlar olarak) gelin﴾<\/span> [Neml 31]."], [2456.0, "Yine onun hakkında şöyle buyurdu:"], [2461.0, "<span class=\"ayah\">﴿Dedi ki: \"Ey ileri gelenler! Onlar bana teslim olarak gelmeden önce hanginiz bana onun tahtını getirir?\"﴾<\/span> [Neml 38];"], [2468.0, "yani teslim olmuş, tevhide boyun eğmiş olarak."], [2472.0, "Allah Azze ve Celle yine Süleyman hakkında şöyle buyurdu:"], [2476.6, "<span class=\"ayah\">﴿(Belkıs) gelince \"Senin tahtın da böyle mi?\" denildi. \"Sanki o!\" dedi. \"Bize bundan önce ilim verilmişti; biz zaten teslim olmuştuk (Müslümandık).\"﴾<\/span> [Neml 42]."]]}, {"reader": false, "ar": [[2486.0, "وقال الله عز وجل:"], [2488.3, "<span class=\"ayah\">﴿وَوَصَّىٰ بِهَا إِبْرَاهِيمُ بَنِيهِ وَيَعْقُوبُ يَا بَنِيَّ إِنَّ اللَّهَ اصْطَفَىٰ لَكُمُ الدِّينَ فَلَا تَمُوتُنَّ إِلَّا وَأَنتُم مُّسْلِمُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٣٢]<\/span>،"], [2497.0, "وقال الله عز وجل:"], [2498.5, "<span class=\"ayah\">﴿أَمْ كُنتُمْ شُهَدَاءَ إِذْ حَضَرَ يَعْقُوبَ الْمَوْتُ إِذْ قَالَ لِبَنِيهِ مَا تَعْبُدُونَ مِن بَعْدِي قَالُوا نَعْبُدُ إِلَٰهَكَ وَإِلَٰهَ آبَائِكَ إِبْرَاهِيمَ وَإِسْمَاعِيلَ وَإِسْحَاقَ إِلَٰهًا وَاحِدًا وَنَحْنُ لَهُ مُسْلِمُونَ﴾<\/span> <span class=\"ref\">[البقرة: ١٣٣]<\/span>."], [2515.0, "والآياتُ في هذا المعنى كثيرة؛"], [2518.0, "فمتى ما رأيتَ الله عز وجل يخاطب بالإسلام مَن قبلنا،"], [2523.0, "فاعلم أنه يخاطبهم بالإسلام العامّ."]], "tr": [[2486.0, "Allah Azze ve Celle buyurdu:"], [2488.3, "<span class=\"ayah\">﴿İbrâhîm bunu oğullarına vasiyet etti, Ya'kûb da: \"Oğullarım! Allah sizin için bu dini seçti; o hâlde ancak Müslümanlar olarak ölün\"﴾<\/span> [Bakara 132]."], [2497.0, "Allah Azze ve Celle buyurdu:"], [2498.5, "<span class=\"ayah\">﴿Yoksa Ya'kûb'a ölüm geldiğinde siz orada mıydınız? Hani oğullarına \"Benden sonra neye ibadet edeceksiniz?\" demişti. Onlar da \"Senin ilâhına, ataların İbrâhîm, İsmâil ve İshâk'ın ilâhı olan tek ilâha ibadet edeceğiz; biz O'na teslim olanlarız (Müslümanlarız)\" demişlerdi﴾<\/span> [Bakara 133]."], [2515.0, "Bu anlamdaki ayetler çoktur. Allah Azze ve Celle'nin bizden öncekilere İslâm ile hitap ettiğini gördüğünde bil ki onlara genel İslâm ile hitap etmektedir."]]}]}, {"ts": "42:07", "title": "7. Külliye (sonuç): Genel ve özel İslâm'ın birleştiği ve ayrıldığı yönler", "paras": [{"reader": false, "ar": [[2527.0, "ثم اعلم ـ رحمك الله ـ أنّ الإسلام العامّ والإسلام الخاصّ يتّفقان في أمور،"], [2534.8, "ويختلفان في أمور. فيتّفقان في أصل حقيقة الدين؛"], [2543.0, "فالإسلامُ العامّ والخاصّ يقوم على أصلٍ دينيٍّ واحد،"], [2548.3, "وهو إفرادُ الله عز وجل بالعبوديّة،"], [2552.3, "والانقيادُ لحكمه؛ كما قال الله عز وجل:"], [2557.7, "<span class=\"ayah\">﴿أُولَٰئِكَ الَّذِينَ هَدَى اللَّهُ ۖ فَبِهُدَاهُمُ اقْتَدِهْ﴾<\/span> <span class=\"ref\">[الأنعام: ٩٠]<\/span>."], [2561.0, "ويتّفقان في أصل الدعوة إلى مكارم الأخلاق ونبذِ مساويها؛"], [2568.3, "فكِلا الإسلامين جاء بذلك،"], [2575.0, "مثلُ تحريم الشرك وعقوق الوالدين،"], [2579.0, "ومثلُ تحريم الظلم، وغيرِها."]], "tr": [[2527.0, "Sonra bil ki —Allah sana rahmet etsin— genel İslâm ile özel İslâm bazı hususlarda birleşir, bazı hususlarda ayrışır."], [2536.8, "Dinin hakikatinin aslında birleşirler: Genel ve özel İslâm tek bir dinî asıl üzerine kuruludur;"], [2546.3, "o da Allah Azze ve Celle'yi kulluğa has kılmak ve O'nun hükmüne boyun eğmektir."], [2555.0, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2557.7, "<span class=\"ayah\">﴿İşte onlar Allah'ın hidayet ettiği kimselerdir; sen de onların hidayetine uy﴾<\/span> [En'âm 90]."], [2561.0, "Güzel ahlâka davet etmek ve kötü ahlâkı atmak aslında da birleşirler;"], [2568.3, "iki İslâm da bunu getirmiştir:"], [2571.6, "Şirkin ve anne-babaya isyanın haram kılınması, zulmün haram kılınması ve diğerleri gibi."]]}, {"reader": false, "ar": [[2583.0, "ويتّفقان في مرجعهما؛ فإنّ مرجع الإسلام العامّ والخاصّ هو الله عز وجل،"], [2595.0, "فكلاهما يرجع إلى مصدرٍ واحد،"], [2598.6, "وهو الوحيُ الإلهيّ، والأمرُ الصادر من الله عز وجل."], [2604.0, "وأمّا اختلافُها ففي الشرائع فقط؛"], [2612.0, "فالإسلامُ بالمعنى العامّ شريعتُ
