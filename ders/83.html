ه قد نُسخت ـ أقصد:"], [2616.8, "الشرائعَ العمليّةَ الفقهيّة ـ. ومن المعلوم أنّ الله عز وجل قد بعث نبيَّه صلى الله عليه وسلم بشريعةٍ خاصّة،"], [2632.0, "وكما قال الله عز وجل:"], [2635.0, "<span class=\"ayah\">﴿لِكُلٍّ جَعَلْنَا مِنكُمْ شِرْعَةً وَمِنْهَاجًا﴾<\/span> <span class=\"ref\">[المائدة: ٤٨]<\/span>؛"], [2638.0, "وهذا أوّلُ أوجُه اختلافها."]], "tr": [[2583.0, "Döndükleri kaynakta da birleşirler: Genel ve özel İslâm'ın merciî Allah Azze ve Celle'dir;"], [2594.1, "her ikisi de tek bir kaynağa döner, o da ilâhî vahiy ve Allah Azze ve Celle'den sadır olan emirdir."], [2604.0, "Ayrışmaları ise yalnızca şeriatlerdedir: Genel anlamdaki İslâm'ın şeriati neshedilmiştir —amelî, fıkhî şeriatleri kastediyorum—."], [2616.8, "Bilinmektedir ki Allah Azze ve Celle Peygamberi sallallâhu aleyhi ve sellem'i özel bir şeriatle göndermiştir;"], [2629.0, "nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2635.0, "<span class=\"ayah\">﴿Sizden her biriniz için bir şeriat ve bir yol kıldık﴾<\/span> [Mâide 48]. Bu, ayrışmalarının ilk yönüdür."]]}, {"reader": false, "ar": [[2641.0, "ولذلك قال النبيّ صلى الله عليه وسلم:"], [2646.0, "«نحن معاشرَ الأنبياء إخوةٌ من علّات»؛"], [2653.0, "دينُنا ـ أي: عقائدُنا ـ واحدة،"], [2656.1, "وشرائعُنا مختلفة. وبه تعلمُ القاعدةَ التي اتّفق عليها أهلُ السنّة:"], [2663.0, "أنّ عقائد الأنبياء واحدة؛"], [2666.0, "فالعقائدُ لا يختلف فيها إسلامٌ عامٌّ ولا إسلامٌ خاصّ،"], [2671.0, "وإنما يختلف الإسلامُ العامُّ والخاصُّ بالشرائع."], [2675.0, "فقد نُسخ شيءٌ كثيرٌ من شرائع مَن قبلنا،"], [2680.0, "كما قال الله عز وجل:"], [2682.9, "<span class=\"ayah\">﴿وَيَضَعُ عَنْهُمْ إِصْرَهُمْ وَالْأَغْلَالَ الَّتِي كَانَتْ عَلَيْهِمْ﴾<\/span> <span class=\"ref\">[الأعراف: ١٥٧]<\/span>؛"], [2687.0, "فكم من محرَّمٍ على من قبلنا صار حلالًا لنا!"], [2691.0, "وكم من واجبٍ على من قبلنا سقط وجوبُه عن أمّتنا!"]], "tr": [[2641.0, "Bu yüzden Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [2646.0, "\"Biz peygamberler topluluğu baba bir (anaları ayrı) kardeşleriz.\" Dinimiz —yani akîdelerimiz— birdir, şeriatlerimiz farklıdır."], [2659.0, "Bununla Ehl-i Sünnet'in üzerinde ittifak ettiği kaideyi öğrenirsin:"], [2663.0, "Peygamberlerin akîdeleri birdir. Akîdelerde genel İslâm ile özel İslâm farklılaşmaz;"], [2669.9, "genel ve özel İslâm ancak şeriatlerde farklılaşır."], [2675.0, "Bizden öncekilerin şeriatlerinden pek çok şey neshedilmiştir;"], [2678.8, "nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [2682.9, "<span class=\"ayah\">﴿Onların ağır yüklerini ve üzerlerindeki zincirleri kaldırır﴾<\/span> [A'râf 157]."], [2687.0, "Bizden öncekilere haram olan nice şey bize helal olmuştur!"], [2691.0, "Bizden öncekilere vacip olan nice şeyin vücubu ümmetimizden düşmüştür!"]]}, {"reader": false, "ar": [[2695.0, "ولعلّنا نكتفي بهذا القدر،"], [2696.7, "والله أعلى وأعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[2695.0, "Belki bu kadarıyla yetinelim. Allah en yüce olandır ve en iyisini bilendir."], [2698.4, "Allah Peygamberimiz Muhammed'e salât ve selâm eylesin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
