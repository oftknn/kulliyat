[2577.0, "فالذي يُخاف منه في هذا الباب هو الغلوّ الذي دفع بعضَهم إلى اعتقاد أنّ الوليّ يمكن أن يطّلع على الغيب المطلق،"], [2586.0, "ومن المعلوم أنّ الغيب المطلق إنما هو من خصائص الله عز وجل."]], "tr": [[2556.0, "Sonra buna şunu da ekle:"], [2558.5, "Peygamberin haber verdiği gayb, tasdiki vâcip olan bir şeydir;"], [2563.1, "tevâtürle sabit olan gaybî haberlerden herhangi birinde peygamberi yalanlayan kâfir olur."], [2570.5, "Velî ise bize gaybdan bir şey haber verdiğinde, bu vâcip değildir —onu tasdik etmek vâcip değildir—."], [2580.0, "Bu babda korkulan şey, bazılarını velînin mutlak gayba muttali olabileceğine inanmaya sevk eden aşırılıktır (gulüv)."], [2586.4, "Bilindiği üzere mutlak gayb ancak Allah Azze ve Celle'nin hususiyetlerindendir."]]}]}, {"ts": "43:11", "title": "7. Külliye (sonu): İbn Hacer el-Heytemî'nin sözü · 8. Külliyenin metni ve kapanış", "paras": [{"reader": false, "ar": [[2591.0, "ويُجلّي هذا الأمرَ ابنُ حجرٍ الهيتميّ رحمه الله تعالى بقوله:"], [2597.0, "«الخواصّ يجوز أن يعلموا الغيبَ في قضيّةٍ أو قضايا، كما وقع لكثيرٍ منهم واشتهر، والذي اختصّ الله تعالى به إنما هو علمُ الجميع، وعلمُ مفاتح الغيب المشار إليها بقوله تعالى: <span class=\"ayah\">﴿إِنَّ اللَّهَ عِندَهُ عِلْمُ السَّاعَةِ وَيُنَزِّلُ الْغَيْثَ﴾<\/span> <span class=\"ref\">[لقمان: ٣٤]<\/span>»."]], "tr": [[2591.0, "İbn Hacer el-Heytemî —Allah ona rahmet etsin— bu meseleyi şu sözüyle açıklar:"], [2596.4, "\"Havâssın (seçkinlerin) bir veya birkaç meselede gaybı bilmesi caizdir;"], [2600.3, "nitekim onlardan birçoğunda bu vuku bulmuş ve meşhur olmuştur."], [2604.8, "Allah Teâlâ'nın kendisine has kıldığı şey ise ancak (gaybın) tamamının ilmi ve Allah Teâlâ'nın şu sözüyle işaret edilen gaybın anahtarlarının ilmidir:"], [2613.9, "<span class=\"ayah\">﴿Şüphesiz kıyamet saatinin bilgisi Allah katındadır. Yağmuru O indirir﴾<\/span> [Lokmân 34].\""]]}, {"reader": false, "ar": [[2618.0, "فغايةُ ما هنالك: أنّ الرسل والأنبياء تُخبر ببعض المغيّبات على وجه الوحي،"], [2625.0, "وأنّ الأولياء قد يشاركونهم في شيءٍ من ذلك على وجه العَرَض."], [2630.0, "ولكن لا يجوز أن نُثبت بإخبار الوليّ شيئًا من الغيب ـ أن نُثبت به شرعًا ليس بثابت،"], [2639.0, "أو نهدم شرعًا ثابتًا ـ؛"], [2641.0, "إذ لا يتعلّق بمثل هذا الغيب الذي يُخبر به هذا الوليُّ شيءٌ من الأحكام الشرعيّة أبدًا. والله أعلم."]], "tr": [[2618.0, "Meselenin varacağı son nokta şudur:"], [2620.3, "Resuller ve peygamberler bazı gaybî şeyleri vahiy yoluyla haber verirler;"], [2625.5, "velîler de bunun bir kısmında arızî olarak onlara ortak olabilirler."], [2629.5, "Fakat velînin haber vermesiyle gaybdan bir şey isbat etmemiz —onunla sabit olmayan bir şer'î hükmü isbat etmemiz veya sabit bir şer'î hükmü yıkmamız— caiz değildir."], [2641.7, "Çünkü velînin haber verdiği bu tür bir gayba hiçbir şer'î hüküm asla bağlanmaz. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[2651.0, "ولعلّنا ـ إن شاء الله ـ نقف عند هذا الحدّ،"], [2655.0, "لكن اكتبوا رأسَ القاعدة:"], [2657.0, "<b>كلُّ من التزم في الكرامة ما ليس بلازمٍ شرعًا فقائلٌ بالباطل.<\/b> <span class=\"note\">(يكررها)<\/span> والله أعلى وأعلم،"], [2670.0, "وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[2651.0, "İnşallah burada duralım. Fakat kaidenin başlığını (metnini) yazın:"], [2654.0, "<b>8. külliye: Keramet hakkında şer'an lâzım olmayan bir şeyi lâzım gören herkes bâtıl bir söz söylemiştir.<\/b> (Tekrar ediyor.) Allah en yüce olan ve en iyi bilendir."], [2670.0, "Allah Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];

  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
