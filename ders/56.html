<script>
const D={"no": 56, "vid": "ug4PW4coqGg", "title_ar": "الدرس (٥٦) من شرح كليات العقيدة — من كليات الكرامات", "title_tr": "Şerhu Külliyyâti'l-Akîde — 56. Ders: Keramet Külliyeleri (Kerametin Tarifi ve İsbatı, Kerametin Peygambere Âyet Oluşu, Velâyet, Şeytanî Hâller, İstikameti Terk Ettiren Hârikalar, Kul Olmaktan Çıkarmama, Gayba Dair Arızî Keşif)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Allah'ın bir velînin elinde dinî veya dünyevî bir maslahat için yarattığı her hârikulâde iş kerametir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.6, "والصلاةُ والسلامُ على رسول الله الأمين،"], [3.9, "وعلى آله وأصحابه الطيبين الطاهرين،"], [5.9, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [8.2, "أمّا بعد: عندنا في هذا المجلس العلميّ جُمَلٌ من الكلّيّات التي تتكلّم عن خارقٍ من خوارق العادات،"], [18.9, "وهو الكرامة. وقد ذكرتُ لكم جُمَلًا من الكلّيّات التي تتكلّم عن المعجزات في الدرس الماضي."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.0, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [11.6, "Bundan sonra: Bu ilim meclisinde elimizde, hârikulâde şeylerden (âdeti aşan olaylardan) birinden, yani kerametten bahseden birçok külliye var."], [25.1, "Geçen derste size mucizelerden bahseden birçok külliye zikretmiştim."]]}, {"reader": false, "ar": [[30.0, "فنقول وبالله التوفيق، ومنه نستمدّ العونَ والفضلَ وحسنَ التحقيق:"], [35.0, "الكلّيّة الأولى: <b>كلُّ أمرٍ خارقٍ للعادة يُجريه الله تعالى على يد وليٍّ لمصلحةٍ دينيّةٍ أو دنيويّةٍ فكرامة.<\/b> <span class=\"note\">(يكررها)<\/span> وأُعيدها مرّةً ثالثة:"], [66.2, "<b>كلُّ أمرٍ خارقٍ للعادة يُجريه الله تعالى على يد وليٍّ لمصلحةٍ دينيّةٍ أو دنيويّةٍ فكرامة.<\/b>"]], "tr": [[30.0, "Tevfik Allah'tandır deriz; yardımı, lütfu ve güzel tahkiki O'ndan dileriz:"], [34.4, "1. külliye: <b>1. külliye: Allah Teâlâ'nın bir velînin elinde dinî veya dünyevî bir maslahat için meydana getirdiği âdeti aşan her iş kerametir.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [66.2, "<b>Allah Teâlâ'nın bir velînin elinde dinî veya dünyevî bir maslahat için meydana getirdiği âdeti aşan her iş kerametir.<\/b>"]]}, {"reader": false, "ar": [[75.0, "أقول وبالله التوفيق: فالكرامة إنما تحصل للأولياء لا على سبيل المفاخرة،"], [83.0, "وإنما لقضاء شيءٍ من حاجات الدين أو الدنيا."], [85.0, "وقد أجمع أهلُ العلم على إثبات كرامات الأولياء،"], [91.0, "ولم يخالف في هذا إلا أهلُ البدع من المعتزلة وغيرهم."], [95.0, "فثبوتُ كرامات الأولياء أمرٌ مُجمَعٌ عليه؛"], [100.0, "فأهلُ السنّة قد أجمعوا عن بَكرة أبيهم على إثبات كرامات الأولياء،"], [105.0, "اعتمادًا على الكثير من النصوص من كتاب الله عز وجل وسنّة نبيّه صلى الله عليه وسلم."]], "tr": [[75.0, "Tevfik Allah'tandır, derim ki: Keramet velîlere övünme yoluyla değil, ancak din veya dünya ihtiyaçlarından birini gidermek için meydana gelir."], [84.8, "İlim ehli velîlerin kerametlerini isbat etmede icmâ etmiştir;"], [90.1, "buna ancak Mu'tezile ve diğerleri gibi bid'at ehli muhalefet etmiştir."], [94.2, "Velîlerin kerametlerinin sübutu üzerinde icmâ edilmiş bir iştir."], [100.0, "Ehl-i Sünnet, Allah Azze ve Celle'nin Kitabı'ndan ve Peygamberi sallallâhu aleyhi ve sellem'in sünnetinden pek çok nassa dayanarak, istisnasız hepsi birden velîlerin kerametlerini isbat etmede icmâ etmiştir."]]}, {"reader": false, "ar": [[115.0, "فأمّا من القرآن فقولُ الله عز وجل عن مريم:"], [120.0, "<span class=\"ayah\">﴿كُلَّمَا دَخَلَ عَلَيْهَا زَكَرِيَّا الْمِحْرَابَ وَجَدَ عِندَهَا رِزْقًا قَالَ يَا مَرْيَمُ أَنَّىٰ لَكِ هَٰذَا قَالَتْ هُوَ مِنْ عِندِ اللَّهِ إِنَّ اللَّهَ يَرْزُقُ مَن يَشَاءُ بِغَيْرِ حِسَابٍ﴾<\/span> <span class=\"ref\">[آل عمران: ٣٧]<\/span>."], [131.0, "قال ابنُ عبّاس: أي:"], [133.0, "وجد عندها الفاكهةَ الغضّةَ حين لا توجد الفاكهةُ عند أحد."], [137.7, "ـ وعليكم السلام ـ. وقال الطبريُّ رحمه الله تعالى في تفسيره:"], [144.0, "فاكهةَ الشتاء في الصيف،"], [146.5, "وفاكهةَ الصيف في الشتاء."], [149.0, "وهذا من جملة الكرامات."]], "tr": [[115.0, "Kur'an'dan (delillere) gelince, Allah Azze ve Celle'nin Meryem hakkındaki şu sözüdür:"], [120.0, "<span class=\"ayah\">﴿Zekeriyyâ ne zaman onun yanına, mihraba girse yanında bir rızık bulurdu. \"Ey Meryem! Bu sana nereden?\" derdi. O da: \"Bu, Allah katındandır. Şüphesiz Allah dilediğine hesapsız rızık verir\" derdi﴾<\/span> [Âl-i İmrân 37]."], [132.0, "İbn Abbâs şöyle dedi: Yani hiç kimsenin yanında meyve bulunmadığı bir vakitte onun yanında taze meyve bulurdu."], [138.7, "—Ve aleykümüsselâm.— Taberî —Allah ona rahmet etsin— tefsirinde şöyle dedi:"], [145.9, "Yazın kış meyvesini, kışın yaz meyvesini (bulurdu). Bu da kerametlerdendir."]]}, {"reader": false, "ar": [[151.0, "وأيضًا من جملة ما ذكره القرآنُ من الكرامات ما أجراه الله عز وجل على يد سارةَ زوجةِ إبراهيمَ الخليل عليه الصلاة والسلام."], [162.0, "قال الله عز وجل:"], [164.8, "<span class=\"ayah\">﴿وَامْرَأَتُهُ قَائِمَةٌ فَضَحِكَتْ﴾<\/span> ـ أي:"], [167.7, "فحاضت ـ <span class=\"ayah\">﴿فَبَشَّرْنَاهَا بِإِسْحَاقَ وَمِن وَرَاءِ إِسْحَاقَ يَعْقُوبَ قَالَتْ يَا وَيْلَتَىٰ أَأَلِدُ وَأَنَا عَجُوزٌ وَهَٰذَا بَعْلِي شَيْخًا إِنَّ هَٰذَا لَشَيْءٌ عَجِيبٌ قَالُوا أَتَعْجَبِينَ مِنْ أَمْرِ اللَّهِ رَحْمَتُ اللَّهِ وَبَرَكَاتُهُ عَلَيْكُمْ أَهْلَ الْبَيْتِ إِنَّهُ حَمِيدٌ مَّجِيدٌ﴾<\/span> <span class=\"ref\">[هود: ٧١–٧٣]<\/span> <span class=\"note\">(Şeyh «قالوا» yerine «قال» okuyor)<\/span>."]], "tr": [[151.0, "Kur'an'ın zikrettiği kerametlerden biri de Allah Azze ve Celle'nin, Halîl İbrâhîm'in —ona salât ve selâm olsun— hanımı Sâre'nin elinde meydana getirdiği şeydir."], [159.0, "Allah Azze ve Celle şöyle buyurur:"], [161.0, "<span class=\"ayah\">﴿Karısı da ayakta duruyordu, güldü﴾<\/span> —yani hayız gördü— <span class=\"ayah\">﴿Biz de ona İshak'ı, İshak'ın ardından da Yakub'u müjdeledik. \"Vay hâlime! Ben bir kocakarıyken ve şu kocam da bir ihtiyarken doğuracak mıyım? Bu gerçekten şaşılacak bir şey!\" dedi. (Melekler) dediler ki: \"Allah'ın emrine mi şaşıyorsun? Allah'ın rahmeti ve bereketleri üzerinizedir ey ev halkı! Şüphesiz O, övülmeye lâyıktır, şanı yücedir\"﴾<\/span> [Hûd 71–73]."]]}, {"reader": false, "ar": [[186.0, "ووجهُ الكرامة في هذه الآية:"], [188.5, "أنّ الله عز وجل أجرى سنّتَه الكونيّة أنّ الإنسان إذا بلغ مرحلةً من عمره فإنه يخرج عن حدّ القدرة على الولادة،"], [198.0, "فلمّا بُشِّرت على كِبَر سنّها ـ وهي عجوز ـ بالولادة،"], [205.0, "كان ذلك من جملة كراماتها."]], "tr": [[186.0, "Bu ayetteki kerametin yönü şudur:"], [188.5, "Allah Azze ve Celle'nin kevnî sünneti, insanın ömründe belli bir merhaleye ulaştığında doğurma gücü sınırının dışına çıkması şeklinde cereyan etmiştir."], [198.7, "Sâre ileri yaşında —kocakarı iken— doğumla müjdelenince, bu onun kerametlerinden oldu."]]}, {"reader": false, "ar": [[208.0, "وكذلك أيضًا في قصّة أصحاب الكهف،"], [213.0, "قال الله عز وجل عنهم:"], [215.3, "<span class=\"ayah\">﴿أَمْ حَسِبْتَ أَنَّ أَصْحَابَ الْكَهْفِ وَالرَّقِيمِ كَانُوا مِنْ آيَاتِنَا عَجَبًا﴾<\/span> <span class=\"ref\">[الكهف: ٩]<\/span>،"], [220.0, "إلى أن قال وهو يصفهم بالإيمان والهدى والثبات:"], [224.0, "<span class=\"ayah\">﴿نَّحْنُ نَقُصُّ عَلَيْكَ نَبَأَهُم بِالْحَقِّ إِنَّهُمْ فِتْيَةٌ آمَنُوا بِرَبِّهِمْ وَزِدْنَاهُمْ هُدًى وَرَبَطْنَا عَلَىٰ قُلُوبِهِمْ إِذْ قَامُوا فَقَالُوا رَبُّنَا رَبُّ السَّمَاوَاتِ وَالْأَرْضِ﴾<\/span> <span class=\"ref\">[الكهف: ١٣–١٤]<\/span>، الآياتِ بتمامها."]], "tr": [[208.0, "Aynı şekilde Ashâb-ı Kehf kıssasında da (keramet vardır)."], [211.8, "Allah Azze ve Celle onlar hakkında şöyle buyurur:"], [215.3, "<span class=\"ayah\">﴿Yoksa sen, Kehf ve Rakîm ashâbının âyetlerimiz içinde şaşılacak bir şey olduğunu mu sandın?﴾<\/span> [Kehf 9]."], [221.0, "Onları iman, hidayet ve sebatla nitelendirerek şöyle buyurmasına kadar:"], [224.0, "<span class=\"ayah\">﴿Biz sana onların haberini hakkıyla anlatıyoruz. Şüphesiz onlar Rablerine iman etmiş gençlerdi; biz de onların hidayetini artırdık. Kalkıp \"Rabbimiz göklerin ve yerin Rabbidir\" dedikleri zaman kalplerini sağlamlaştırdık﴾<\/span> [Kehf 13–14], ayetlerin tamamı."]]}, {"reader": false, "ar": [[237.0, "قال الإمامُ السعديّ رحمه الله تعالى في تفسيره:"], [242.0, "«استجاب الله دعاءهم، وقيّض لهم ما لم يكن في حُسبانهم»."], [247.0, "قال: <span class=\"ayah\">﴿فَضَرَبْنَا عَلَىٰ آذَانِهِمْ فِي الْكَهْفِ﴾<\/span> <span class=\"ref\">[الكهف: ١١]<\/span>،"], [251.3, "أي: أنمناهم. قوله: <span class=\"ayah\">﴿سِنِينَ عَدَدًا﴾<\/span> <span class=\"ref\">[الكهف: ١١]<\/span>،"], [255.2, "وهي ثلاثُمائة سنةٍ وتسعُ سنين."]], "tr": [[237.0, "İmam es-Sa'dî —Allah ona rahmet etsin— tefsirinde şöyle dedi:"], [241.4, "\"Allah onların duasına icabet etti ve onlara hesaba katmadıkları şeyi hazırladı.\" (Allah) buyurdu ki:"], [247.0, "<span class=\"ayah\">﴿Mağarada kulaklarına perde vurduk﴾<\/span> [Kehf 11], yani onları uyuttuk."], [252.1, "<span class=\"ayah\">﴿Nice yıllar﴾<\/span> [Kehf 11] sözü ise üç yüz dokuz yıldır."]]}, {"reader": false, "ar": [[259.0, "ووجهُ الكرامة في ذلك:"], [261.0, "أنّ الإنسان ـ في الأعمّ ـ أنّ الإنسان عادةً لا ينام مثلَ هذا النوم المتواصل أبدًا،"], [266.0, "ولكنّهم ناموا هذه النومة التي جعل الله عز وجل يُقلّبهم فيها عن حرّ الشمس ذاتَ اليمين وذاتَ الشمال،"], [277.0, "ثم قاموا واستيقظوا ولم يسقط منهم شعرة،"], [280.8, "ولم يُخترَق منهم جسد."], [283.0, "وهذا من أعظم الكرامات لهؤلاء الفتية،"], [286.3, "وهم ليسوا بأنبياء، وإنما هم من أولياء الله عز وجل."], [291.0, "فأجمع العلماءُ على أنّ هذا من كراماتهم."], [295.0, "فالله عز وجل يُكرم أولياءه ببعض الكرامات والفضائل."]], "tr": [[259.0, "Bundaki kerametin yönü şudur: İnsan —genel olarak— insan âdeten asla bu kadar kesintisiz bir uyku uyumaz."], [264.5, "Fakat onlar, Allah Azze ve Celle'nin onları güneşin sıcağından (korumak için) sağa ve sola çevirdiği bu uykuyu uyudular;"], [273.8, "sonra kalkıp uyandılar, onlardan ne bir kıl düştü ne de bir beden delindi (çürüdü)."], [281.9, "Bu, o gençler için kerametlerin en büyüklerindendir;"], [285.2, "hâlbuki onlar peygamber değildir, ancak Allah Azze ve Celle'nin velîlerindendir."], [290.1, "Âlimler bunun onların kerametlerinden olduğunda icmâ etmiştir."], [293.3, "Allah Azze ve Celle velîlerine bazı kerametler ve faziletler ikram eder."]]}]}, {"ts": "05:00", "title": "1. Külliye (devam): Sahâbenin kerametleri — Üseyd b. Hudayr ve İmrân b. Husayn", "paras": [{"reader": false, "ar": [[300.0, "ومن المعلوم أنّ خيرَ أولياء الله عز وجل بعد الأنبياء هم صحابةُ النبيّ صلى الله عليه وسلم."], [306.0, "وقد ذكرت لنا كتبُ الحديث والسِّيَر جُمَلًا كثيرةً جدًّا من هذه الكرامات التي أجراها الله عز وجل على يدَي هؤلاء الثُّلّة المباركة رضي الله عنهم وأرضاهم،"], [322.0, "وما ذلك إلا ببركة اتّباعهم لرسول الله صلى الله عليه وسلم."]], "tr": [[300.0, "Bilindiği üzere peygamberlerden sonra Allah Azze ve Celle'nin velîlerinin en hayırlısı Peygamber sallallâhu aleyhi ve sellem'in ashâbıdır."], [305.6, "Hadis ve siyer kitapları bize, Allah Azze ve Celle'nin —Allah onlardan razı olsun ve onları razı etsin— bu mübarek topluluğun elinde meydana getirdiği bu kerametlerden pek çoğunu zikretmiştir."], [322.0, "Bu da ancak onların Resûlullah sallallâhu aleyhi ve sellem'e uymalarının bereketiyledir."]]}, {"reader": false, "ar": [[327.0, "فمن ذلك ما رواه الإمامُ البخاريّ عن أُسَيد بن حُضَير رضي الله تعالى عنه قال:"], [334.5, "«بينما هو يقرأ من الليل سورةَ البقرة، وفرسُه مربوطةٌ عنده، إذ جالت الفرس، فسكت فسكنت، ثم قرأ فجالت، ثم سكت فسكنت، ثم قرأ فجالت»."], [346.6, "قال: «فخشيتُ على يحيى ـ وكان قريبًا من الفرس ـ أن تطأه»."], [352.0, "قال: «فرفعتُ بصري إلى السماء، فإذا مثلُ الظُّلّة فيها أمثالُ المصابيح، فعرجت حتى لا أكاد أراها»."]], "tr": [[327.0, "Bunlardan biri, İmam Buhârî'nin Üseyd b."], [329.0, "Hudayr'dan —Allah ondan razı olsun— rivayet ettiği şu hadistir:"], [333.0, "\"O gece Bakara sûresini okurken, atı da yanında bağlıyken at birden ürküp hareketlendi."], [338.1, "Sustu, at sakinleşti; sonra okudu, at yine hareketlendi;"], [341.2, "sonra sustu, sakinleşti; sonra okudu, yine hareketlendi.\" Dedi ki:"], [345.5, "\"Ata yakın olan (oğlum) Yahyâ'yı atın çiğnemesinden korktum.\" Dedi ki:"], [349.8, "\"Gözümü semaya kaldırdım; bir de baktım ki içinde kandiller gibi şeyler bulunan gölgelik gibi bir şey var."], [357.6, "Yükseldi, öyle ki neredeyse onu göremez oldum.\""]]}, {"reader": false, "ar": [[361.0, "«فلمّا أصبح جاء إلى النبيّ صلى الله عليه وسلم فأخبره الخبر، فقال: اقرأ يا ابنَ حُضَير، اقرأ يا ابنَ حُضَير»،"], [368.0, "إلى أن قال صلى الله عليه وسلم:"], [371.1, "«وتدري ما ذاك؟» قلتُ:"], [372.4, "«لا يا رسول الله»."], [374.0, "قال: «تلك الملائكةُ دنت لصوتك، ولو قرأتَ لأصبحت ينظر الناسُ إليها لا تتوارى عنهم»."], [381.0, "أو كما قال، رضي الله تعالى عنه وأرضاه."], [385.0, "ووجهُ الكرامة في ذلك:"], [387.2, "أنّ هذه السكينـ… أنّ الملائكة والسكينة تنزّلت لقراءة وليٍّ من أولياء الله عز وجل."]], "tr": [[361.0, "\"Sabah olunca Peygamber sallallâhu aleyhi ve sellem'e gelip olanı haber verdi."], [364.1, "(Peygamber) şöyle buyurdu: Oku ey İbn Hudayr, oku ey İbn Hudayr!\" Nihayet sallallâhu aleyhi ve sellem şöyle buyurdu:"], [369.8, "\"Onun ne olduğunu biliyor musun?\" Dedim ki:"], [372.0, "\"Hayır, ey Allah'ın Resûlü.\" Buyurdu ki:"], [374.0, "\"Onlar senin sesine yaklaşan meleklerdi."], [376.0, "Okumaya devam etseydin, sabaha insanlar onlara bakıyor olurdu;"], [379.5, "onlardan gizlenmezlerdi.\" Ya da buyurduğu gibi;"], [382.0, "Allah ondan razı olsun ve onu razı etsin."], [385.6, "Bundaki kerametin yönü şudur: Bu sekîne… melekler ve sekîne, Allah Azze ve Celle'nin velîlerinden bir velînin okuyuşu için indiler."]]}, {"reader": false, "ar": [[395.0, "وروى الإمامُ مسلمٌ في صحيحه عن مُطرِّف قال:"], [399.8, "قال لي عمرانُ بن حُصَين رضي الله تعالى عنه:"], [405.1, "«وقد كان يُسلَّم عليّ» ـ أي:"], [408.1, "تُسلّم عليه الملائكة ـ «حتى اكتويتُ فتُرِكت، ثم تركتُ الكيَّ فعاد»."], [413.6, "انتهى الحديث. وفي «سنن أبي داود» عنه رضي الله تعالى عنه أنه كان يسمع تسليمَ الملائكة،"], [422.7, "فلمّا اكتوى انقطع عنه،"], [424.0, "فلمّا ترك رجع إليه."], [427.0, "ووجهُ الكرامة في ذلك ظاهر."]], "tr": [[395.0, "İmam Müslim Sahîh'inde Mutarrif'ten rivayet eder;"], [398.0, "dedi ki: İmrân b. Husayn —Allah ondan razı olsun— bana şöyle dedi:"], [403.9, "\"Bana selâm veriliyordu\" —yani melekler ona selâm veriyordu— \"dağlanma tedavisi yaptırıncaya kadar;"], [410.4, "(dağlanınca selâm) terk edildi. Sonra dağlamayı bırakınca (selâm) geri döndü.\" Hadis bitti."], [416.1, "\"Sünen-i Ebî Dâvûd\"da da ondan —Allah ondan razı olsun— meleklerin selâmını işittiği, dağlanma yaptırınca bunun kesildiği, (dağlamayı) bırakınca da geri döndüğü rivayet edilir. Bundaki kerametin yönü açıktır."]]}]}, {"ts": "07:09", "title": "1. Külliye (devam): Hubeyb b. Adî, Âmir b. Füheyre ve Saîd b. Zeyd", "paras": [{"reader": false, "ar": [[429.0, "وروى الإمامُ البخاريّ عن خُبَيب بن عديّ رضي الله عنه لمّا أسره المشركون ـ وكان خُبَيبٌ قد قتل الحارثَ بن عامر يومَ بدر ـ فلبث عند هؤلاء المشركين أسيرًا،"], [443.0, "فكانت بنتُ الحارث تقول:"], [445.7, "«والله ما رأيتُ أسيرًا قطّ خيرًا من خُبَيب، والله لقد وجدتُه يومًا يأكل من قِطْفِ عنبٍ في يده، وإنه لمُوثَقٌ في الحديد، وما بمكّة من ثمر»."], [461.0, "وكانت تقول: «إنه لَرزقٌ من الله عز وجل رزقه خُبَيبًا»."], [466.3, "ووجهُ الكرامة في ذلك ظاهر."]], "tr": [[429.0, "İmam Buhârî, Hubeyb b. Adî'den —Allah ondan razı olsun— müşrikler onu esir aldıkları zamanki hâlini rivayet eder."], [436.9, "Hubeyb, Bedir günü Hâris b."], [439.1, "Âmir'i öldürmüştü; bu müşriklerin yanında esir olarak kaldı."], [443.7, "Hâris'in kızı şöyle derdi: \"Vallahi Hubeyb'den daha hayırlı bir esir asla görmedim."], [451.0, "Vallahi bir gün onu elindeki bir salkım üzümden yerken buldum;"], [456.0, "hâlbuki o demirlerle bağlıydı ve Mekke'de hiç meyve yoktu.\" Ve şöyle derdi:"], [462.1, "\"Bu, Allah Azze ve Celle'nin Hubeyb'e verdiği bir rızıktı.\" Bundaki kerametin yönü açıktır."]]}, {"reader": false, "ar": [[469.0, "وروى الإمامُ البخاريّ أيضًا في صحيحه من حديث هشام بن عروة قال:"], [474.7, "أخبرني أبي قال: «لمّا قُتل الذين قُتلوا ببئر مَعُونة، وأُسر عمرُو بن أميّة الضَّمْريّ، قال له عامرُ بن الطُّفَيل: مَن هذا؟ فأشار إلى قتيل، فقال له عمرُو بن أميّة: هذا عامرُ بن فُهَيرة» ـ وكان من حُفّاظ القرآن،"], [496.0, "وكان ممّن قُتل ببئر معونة ـ «فقال: لقد رأيتُه بعدما قُتل رُفع إلى السماء، حتى إنّي لأنظر إلى السماء بينه وبين الأرض، ثم وُضع»."]], "tr": [[469.0, "İmam Buhârî yine Sahîh'inde Hişâm b."], [471.3, "Urve hadisinden rivayet eder; dedi ki:"], [473.5, "Babam bana şöyle haber verdi:"], [476.6, "\"Bi'r-i Maûne'de öldürülenler öldürülüp Amr b."], [479.4, "Ümeyye ed-Damrî esir alınınca, Âmir b."], [483.0, "Tufeyl ona: Bu kim? dedi ve bir maktule işaret etti."], [487.3, "Amr b. Ümeyye ona: Bu Âmir b."], [490.8, "Füheyre'dir, dedi.\" —O, Kur'an hâfızlarındandı ve Bi'r-i Maûne'de öldürülenlerdendi.— \"(Âmir b. Tufeyl) dedi ki:"], [499.0, "Andolsun, onu öldürüldükten sonra semaya kaldırılmış gördüm;"], [502.5, "öyle ki onunla yer arasında semaya bakıyordum (gökyüzünü görüyordum). Sonra (yere) bırakıldı.\""]]}, {"reader": false, "ar": [[508.0, "وروى الإمامُ مسلمٌ في صحيحه أيضًا عن هشام بن عروة عن أبيه:"], [515.0, "أنّ أَرْوى بنتَ أُوَيس ادّعت على سعيد بن زيد أنه أخذ شيئًا من أرضها،"], [524.0, "فخاصمته إلى مروان بن الحكم،"], [527.0, "فقال سعيد: ما كنتُ ـ والله يا أمير المؤمنين ـ أن آخذَ من أرضها شيئًا بعد الذي سمعتُه من النبيّ صلى الله عليه وسلم."], [536.0, "قال: وماذا سمعتَ من رسول الله صلى الله عليه وسلم؟"], [540.0, "قال: سمعتُه يقول: «مَن أخذ شبرًا من الأرض ظلمًا طُوِّقَه <span class=\"q\">؟ 09:00<\/span> يومَ القيامة إلى سبع أرَضين»."]], "tr": [[508.0, "İmam Müslim yine Sahîh'inde Hişâm b."], [510.9, "Urve'den, o da babasından rivayet eder:"], [513.8, "Ervâ bint Üveys, Saîd b."], [517.0, "Zeyd'in arazisinden bir kısmını aldığını iddia etti ve onu Mervân b."], [523.4, "Hakem'e şikâyet etti. Saîd dedi ki:"], [526.4, "Vallahi ey emîrü'l-mü'minîn, Peygamber sallallâhu aleyhi ve sellem'den işittiğim şeyden sonra onun arazisinden bir şey alacak değilim."], [532.7, "(Mervân) dedi ki: Resûlullah sallallâhu aleyhi ve sellem'den ne işittin?"], [536.4, "Dedi ki: Onun şöyle buyurduğunu işittim:"], [538.8, "\"Kim haksız yere yerden bir karış alırsa, kıyamet günü yedi kat yere kadar o (toprak) ona tasma gibi geçirilir <span class=\"q\">؟<\/span>.\""]]}, {"reader": false, "ar": [[549.0, "فقال له مروان: لا أسألك بيّنةً بعد هذا."], [552.0, "فقال: «اللهمّ إن كانت كاذبةً فعَمِّ بصرَها، واقتلها في أرضها»."], [560.0, "فاستجاب الله عز وجل دعاءه."], [563.0, "ووجهُ الكرامة في ذلك:"], [565.0, "أنّ استجابة الدعاء من جملة الكرامات."], [568.0, "قال: «فما ماتت حتى ذهب بصرُها، ثم بينا هي تمشي في أرضها إذ وقعت في حفرةٍ فماتت»."]], "tr": [[549.0, "Mervân ona: Bundan sonra senden delil istemem, dedi."], [551.6, "(Saîd) dedi ki: \"Allah'ım! Eğer yalan söylüyorsa gözünü kör et ve onu kendi arazisinde öldür.\" Allah Azze ve Celle onun duasına icabet etti."], [566.0, "Bundaki kerametin yönü şudur: Duanın kabul edilmesi kerametlerdendir."], [569.4, "(Râvi) dedi ki: \"Gözü gitmeden ölmedi."], [572.2, "Sonra arazisinde yürürken bir çukura düştü ve öldü.\""]]}]}, {"ts": "09:36", "title": "1. Külliye (devam): Ümmü Eymen, iki sahâbînin ışığı · Kuşeyrî ve İbn Teymiyye'den nakiller", "paras": [{"reader": false, "ar": [[576.0, "ومنها أيضًا ما روى ابنُ سعدٍ في «الطبقات» من حديث عثمان بن القاسم رحمه الله تعالى قال:"], [583.0, "«لمّا هاجرت أمُّ أيمن أمست بالمُنصَرَف دون الرَّوحاء، فعطشت وليس معها ماء، وهي صائمة، فجهدها العطش، فدُلِّيَ عليها من السماء بدلوٍ من ماءٍ برِشاءٍ أبيض، فأخذته فشربت منه حتى رَوِيت. فكانت تقول: ما أصابني بعد ذلك عطش، ولقد تعرّضتُ للعطش بالصوم في الهواجر فما عطشتُ أبدًا بعد تلك الشَّربة، وإن كنتُ لأصوم في اليوم الحارّ فما أعطش»."]], "tr": [[576.0, "Bunlardan biri de İbn Sa'd'ın \"et-Tabakât\"ta Osman b."], [578.6, "el-Kâsım'dan —Allah ona rahmet etsin— rivayet ettiği şu haberdir;"], [582.1, "dedi ki: \"Ümmü Eymen hicret ettiğinde, Revhâ'nın berisindeki Munsaraf'ta akşamladı."], [588.1, "Susadı; yanında su yoktu ve oruçluydu."], [594.1, "Susuzluk onu bitkin düşürdü. Derken semadan beyaz bir ip ile bir kova su ona sarkıtıldı."], [603.6, "Onu aldı ve kanıncaya kadar içti."], [606.7, "Şöyle derdi: Bundan sonra bana hiç susuzluk isabet etmedi."], [612.3, "Öğle sıcaklarında oruç tutarak kendimi susuzluğa maruz bıraktım;"], [617.7, "o içişten sonra asla susamadım."], [619.8, "Sıcak günde oruç tutardım da susamazdım.\""]]}, {"reader": false, "ar": [[622.0, "وفي الحديث عن أنس بن مالك رضي الله تعالى عنه:"], [626.0, "أنّ رجلين من أصحاب النبيّ صلى الله عليه وسلم خرجا من عند النبيّ صلى الله عليه وسلم في ليلةٍ مظلمة ومعهما العصا،"], [640.0, "قال: فأنار <span class=\"q\">؟ 10:40<\/span> منها مثلُ المصباحين يُضيئان بين أيديهما،"], [648.0, "فلمّا افترقا صار مع كلّ واحدٍ منهما واحدٌ حتى أتى أهلَه."]], "tr": [[622.0, "Enes b. Mâlik'ten —Allah ondan razı olsun— gelen hadiste şöyle denir:"], [625.6, "Peygamber sallallâhu aleyhi ve sellem'in ashâbından iki adam karanlık bir gecede Peygamber sallallâhu aleyhi ve sellem'in yanından çıktılar;"], [633.0, "yanlarında asâ vardı. (Râvi) dedi ki:"], [638.2, "Ondan önlerini aydınlatan iki kandil gibi bir ışık parladı <span class=\"q\">؟<\/span>."], [648.0, "Ayrıldıklarında her birinin yanında onlardan biri kaldı, ta ki ailesine ulaşıncaya kadar."]]}, {"reader": false, "ar": [[652.0, "وعلى ذلك أجمع العلماء،"], [654.5, "وتواترت النصوص عن أهل السنّة والجماعة في إثبات الكرامات،"], [660.0, "بضوابطَ وشروطٍ سوف تأتينا في كلّيّاتٍ إن شاء الله تعالى."], [664.0, "قال الإمامُ القُشَيريّ رحمه الله تعالى:"], [667.7, "«قد ظهر على السلف من الصحابة والتابعين» ـ أي:"], [672.7, "تلك الكرامات ـ «ثم على مَن بعدهم من الكرامات ما بلغ حدَّ الاستفاضة، وقد صُنّف في ذلك كتبٌ كثيرة». انتهى كلامه."]], "tr": [[652.0, "Âlimler bunun üzerinde icmâ etmiş ve kerametlerin isbatında Ehl-i Sünnet ve'l-Cemaat'ten nasslar tevâtür derecesinde gelmiştir;"], [660.4, "bunun, inşallah ileride külliyelerde gelecek zâbıtları ve şartları vardır."], [664.0, "İmam el-Kuşeyrî —Allah ona rahmet etsin— şöyle dedi:"], [668.3, "\"Sahâbe ve tâbiînden olan selefte\" —yani o kerametler— \"sonra onlardan sonrakilerde, yaygınlık (istifâza) derecesine ulaşan kerametler zuhur etmiştir."], [676.7, "Bu konuda pek çok kitap telif edilmiştir.\" Sözü bitti."]]}, {"reader": false, "ar": [[681.0, "وقال الإمامُ ابنُ تيميّة رحمه الله تعالى:"], [684.0, "«ومن أصول السنّة» ـ ومن أصول أهل السنّة والجماعة ـ «التصديقُ بكرامات الأولياء، وما يُجري الله على أيديهم من خوارق العادات، في أنواع العلوم والمكاشفات، وأنواع القدرة والتأثيرات، كالمأثور عن سالف الأمم في سورة الكهف وغيرها، وعن صدر هذه الأمّة من الصحابة والتابعين وسائر قرون الأمّة، وهي موجودةٌ فيها إلى يوم القيامة». انتهى كلامه."]], "tr": [[681.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi:"], [684.0, "\"Sünnet'in usûlünden\" —Ehl-i Sünnet ve'l-Cemaat'in usûlünden— \"velîlerin kerametlerini ve Allah'ın onların elinde ilim ve mükâşefe türlerinde, kudret ve tesir türlerinde meydana getirdiği hârikulâde şeyleri tasdik etmektir."], [696.3, "Tıpkı Kehf sûresinde ve başka yerlerde geçmiş ümmetlerden nakledilenler ve bu ümmetin ilk dönemindeki sahâbe ve tâbiînden ve ümmetin diğer asırlarından nakledilenler gibi."], [707.5, "Bu (kerametler) kıyamet gününe kadar bu ümmette mevcuttur.\" Sözü bitti."]]}]}, {"ts": "11:52", "title": "1. Külliye (devam): Geçmiş ümmetlerdeki kerametler — bulut hadisi, mağaradaki üç kişi, Sâre ve zalim hükümdar", "paras": [{"reader": false, "ar": [[712.0, "وهذه الكرامات ليست مخصوصةً بأمّة محمد صلى الله عليه وسلم،"], [718.0, "بل هي في الأمم الماضية،"], [721.0, "كما في صحيح الإمام مسلم من حديث أبي هريرة رضي الله عنه قال:"], [725.5, "«بينما رجلٌ يمشي بفلاةٍ من الأرض إذ سمع صوتًا في سحابة: اسقِ حديقةَ فلانٍ ـ باسمه ـ، فتنحّى ذلك السحابُ فأفرغ ماءه في حَرّة، فإذا شَرْجةٌ من تلك الشِّراج استوعبت الماء، فتتبّع الماءَ حتى وقف على رجلٍ يُحوّل الماءَ بمِسحاته في حديقته»."]], "tr": [[712.0, "Bu kerametler Muhammed sallallâhu aleyhi ve sellem'in ümmetine has değildir;"], [716.8, "bilakis geçmiş ümmetlerde de vardır."], [719.2, "Nitekim İmam Müslim'in Sahîh'inde Ebû Hüreyre'den —Allah ondan razı olsun— gelen hadiste şöyle buyrulur:"], [724.0, "\"Bir adam ıssız bir arazide yürürken bir bulutun içinden bir ses işitti:"], [728.1, "Falanın —ismiyle— bahçesini sula! O bulut bir tarafa yöneldi ve suyunu taşlık bir yere boşalttı."], [734.3, "Bir de baktı ki o su yollarından bir su yolu suyu toplamış."], [740.0, "Suyu takip etti, nihayet bahçesinde küreğiyle suyu çeviren bir adamın yanında durdu.\""]]}, {"reader": false, "ar": [[747.0, "«فقال: أيْ فلان، ما اسمُك؟ فقال: اسمي كذا وكذا» ـ الاسمُ الذي سمعه في السحابة ـ «فقال: أيْ عبدَ الله، لِمَ تسألني عن اسمي؟ فقال: إنّي سمعتُ صوتًا في السحاب الذي هذا ماؤه يقول: اسقِ حديقةَ فلانٍ، لاسمك، فما تصنع فيها؟ فقال: أمّا إذ قلتَ ذلك، فإنّي أنظر إلى ما يخرج منها، فأتصدّق بثلثه، وآكلُ أنا وعيالي ثلثَه، وأردّ فيها ثلثَه»."], [776.0, "ووجهُ الكرامة في ذلك ظاهرةٌ واضحة."]], "tr": [[747.0, "\"Ona: Ey falan, adın ne?"], [748.2, "dedi. O da: Adım şudur, dedi\" —bulutta işittiği isim— \"(Bahçe sahibi) dedi ki:"], [755.0, "Ey Allah'ın kulu, adımı niçin soruyorsun?"], [756.2, "(Adam) dedi ki: Bu suyun geldiği bulutta senin adını söyleyerek:"], [758.8, "Falanın bahçesini sula, diyen bir ses işittim."], [761.5, "Sen bu bahçede ne yapıyorsun?"], [763.5, "(Bahçe sahibi) dedi ki: Madem bunu söyledin;"], [766.4, "ben bahçeden çıkan ürüne bakarım, üçte birini sadaka olarak veririm, üçte birini ben ve çoluk çocuğum yeriz, üçte birini de bahçeye geri koyarım.\" Bundaki kerametin yönü açık ve nettir."]]}, {"reader": false, "ar": [[780.0, "وفي الصحيحين من حديث ابن عمر ـ وهو الحديث الذي تحفظونه جميعًا ـ في الثلاثة الذين آواهم المبيتُ إلى غارهم،"], [788.9, "فانطبقت عليهم صخرةٌ من الجبل،"], [791.0, "فلم يستطيعوا إزاحتها، فتوسّل كلُّ واحدٍ منهم بشيءٍ من الأعمال الصالحة،"], [797.0, "فاستجاب الله عز وجل دعاءهم،"], [799.8, "وأزاح عنهم هذه الصخرة،"], [802.0, "فخرجوا يمشون. قال الإمامُ العينيّ رحمه الله تعالى في هذا الحديث:"], [807.0, "«فيه إثباتُ الكرامة للأولياء، ووقوعُ الكرامة لهم باختيارهم وطلبهم»."]], "tr": [[780.0, "Sahîhayn'de İbn Ömer'den gelen hadiste —hepinizin ezbere bildiği hadistir— geceyi geçirmek için bir mağaraya sığınan üç kişi (anlatılır)."], [787.7, "Dağdan bir kaya üzerlerine kapandı, onu yerinden oynatamadılar."], [790.6, "Her biri sâlih amellerinden biriyle tevessülde bulundu;"], [794.0, "Allah Azze ve Celle onların duasına icabet etti ve bu kayayı üzerlerinden kaldırdı;"], [799.8, "yürüyerek çıktılar. İmam el-Aynî —Allah ona rahmet etsin— bu hadis hakkında şöyle dedi:"], [805.2, "\"Bunda velîler için kerametin isbatı ve kerametin onların ihtiyar ve talebiyle meydana gelmesi vardır.\""]]}, {"reader": false, "ar": [[812.0, "ولمّا دخل إبراهيمُ وسارةُ في أرض ذلك الملك الظالم الجائر،"], [819.0, "خاف إبراهيمُ على سارة،"], [823.0, "فقال: إنه لا بدّ أن يأتينا منه شرّ،"], [828.0, "فإذا سألكِ عنّي فأقول:"], [830.7, "إنكِ أختي، وقولي: إنه أخي؛"], [834.0, "فإنّي لا أعلم اليومَ مسلمًا على وجه الأرض إلا أنا وأنتِ."], [838.0, "فجاء أناسٌ إلى ذلك الملك الجبّار وقالوا:"], [844.3, "إنه قد دخل في أرضك امرأةٌ لا تصلح إلا لك،"], [847.0, "فاستدعاها. وقام إبراهيمُ عليه الصلاة والسلام يصلّي."]], "tr": [[812.0, "İbrâhîm ile Sâre o zalim, ceberut hükümdarın topraklarına girdiklerinde İbrâhîm, Sâre için korktu ve şöyle dedi:"], [821.5, "Ondan bize mutlaka bir kötülük gelecek."], [826.1, "Eğer sana beni sorarsa, ben senin kardeşim olduğunu söylerim;"], [830.7, "sen de onun kardeşim olduğunu söyle."], [834.4, "Çünkü bugün yeryüzünde benden ve senden başka bir Müslüman bilmiyorum."], [837.3, "Derken bazı insanlar o zorba hükümdara gelip:"], [841.1, "Senin topraklarına ancak sana yakışacak bir kadın girdi, dediler."], [845.6, "Onu çağırttı. İbrâhîm —ona salât ve selâm olsun— da kalkıp namaz kılmaya başladı."]]}, {"reader": false, "ar": [[853.0, "فلمّا دخلت عليه مدّ يدَه إليها،"], [857.2, "فقُبِضت يدُه قبضةً شديدة،"], [860.0, "فقال لها: ادعي اللهَ أن يُطلق يدي ولا أضرّك،"], [864.0, "ففعلت، فعاد فقُبِضت أشدَّ من القبضة الأولى،"], [868.0, "فقال لها مثلَ ذلك،"], [870.5, "ففعلت، فعاد فقُبِضت أشدَّ من القبضتين الأُولَيين،"], [875.0, "فقال: ادعي اللهَ أن يُطلق يدي فلكِ اللهَ أن لا أضرّك، ففعلت، وأُطلقت يدُه."]], "tr": [[853.0, "Sâre onun yanına girince elini ona uzattı;"], [855.8, "eli şiddetle kasılıp tutuldu. Ona:"], [857.9, "Allah'a dua et de elimi serbest bıraksın, sana zarar vermeyeceğim, dedi."], [862.2, "O da (dua) etti. (Hükümdar) yine yeltendi;"], [864.0, "eli ilk tutulmasından daha şiddetli tutuldu."], [866.3, "Ona yine aynı şeyi söyledi, o da (dua) etti."], [869.9, "Yine yeltendi; eli önceki iki tutulmadan daha şiddetli tutuldu."], [873.7, "Dedi ki: Allah'a dua et de elimi serbest bıraksın;"], [876.5, "Allah'a söz veriyorum ki sana zarar vermeyeceğim."], [877.9, "O da (dua) etti ve eli serbest bırakıldı."]]}, {"reader": false, "ar": [[880.7, "ودعا الذي جاء بها فقال له:"], [884.0, "إنك إنما أتيتني بشيطان،"], [886.0, "ولم تأتني بإنسان، فأخرِجها من أرضي،"], [889.8, "وأعطِها هاجر. قال: فأقبلت تمشي،"], [892.4, "فلمّا رآها إبراهيمُ عليه الصلاة والسلام انصرف،"], [896.0, "فقال لها: مَهْيَم؟ ـ يعني:"], [898.0, "ما وراءك من الأخبار؟"], [900.0, "ـ قالت: خيرًا، كفّ اللهُ يدَ الفاجر،"], [903.8, "وأخدم خادمًا. قال أبو هريرة رضي الله تعالى عنه:"], [909.0, "فتلك أمُّكم يا بني ماءِ السماء."]], "tr": [[880.7, "Onu getireni çağırıp ona şöyle dedi:"], [883.0, "Sen bana ancak bir şeytan getirdin, bir insan getirmedin."], [886.0, "Onu topraklarımdan çıkar ve ona Hâcer'i ver."], [889.8, "(Râvi) dedi ki: (Sâre) yürüyerek geldi."], [891.9, "İbrâhîm —ona salât ve selâm olsun— onu görünce (namazdan) ayrıldı ve ona:"], [896.5, "Ne var ne yok? —yani arkanda ne haberler var?— dedi."], [900.0, "Dedi ki: Hayır! Allah fâcirin elini durdurdu ve bir hizmetçi verdi."], [905.0, "Ebû Hüreyre —Allah ondan razı olsun— dedi ki:"], [908.4, "İşte bu (Hâcer) sizin annenizdir, ey gök suyunun oğulları!"]]}]}, {"ts": "15:11", "title": "1. Külliye (sonu): Kurtubî, Tahâvî ve İbn Hamdân'dan nakiller", "paras": [{"reader": false, "ar": [[911.0, "قال أبو العبّاس القرطبيّ رحمه الله تعالى:"], [916.0, "«أي: عصمها الله منه بما أظهر من كرامتها، وأعطاها الله خادمًا، وهي هاجر»."], [922.0, "قال الإمامُ الطحاويّ رحمه الله تعالى:"], [926.0, "«لا نُفضّل أحدًا من الأولياء على أحدٍ من الأنبياء عليهم السلام، ونقول: نبيٌّ واحدٌ أفضلُ من جميع الأولياء، ونؤمن بما جاء من كراماتهم، وصحّ عن الثقات من رواياتهم»."]], "tr": [[911.0, "Ebü'l-Abbâs el-Kurtubî —Allah ona rahmet etsin— şöyle dedi:"], [915.3, "\"Yani Allah, onun kerametini ortaya çıkarmakla onu ondan korudu ve Allah ona bir hizmetçi verdi;"], [920.2, "o da Hâcer'dir.\" İmam et-Tahâvî —Allah ona rahmet etsin— şöyle dedi:"], [926.0, "\"Velîlerden hiçbirini peygamberlerden —onlara selâm olsun— hiçbirine üstün tutmayız ve deriz ki:"], [930.1, "Tek bir peygamber bütün velîlerden daha faziletlidir."], [932.7, "Velîlerin kerametlerinden (haber olarak) gelen ve sika (güvenilir) râvilerden rivayetleriyle sahih olarak sabit olan şeylere iman ederiz.\""]]}, {"reader": false, "ar": [[941.0, "وقال الإمامُ ابنُ حمدان الحنبليّ رحمه الله تعالى:"], [945.0, "«كرامةُ الأولياء حقّ، وأنكر الإمامُ أحمدُ على من أنكرها وضلّله، وهي خرقُ العادة في حقّ الوليّ بالمقدور للبشر <span class=\"q\">؟ 15:51<\/span>، وتوجد في زمن النبوّة وأشراط الساعة وغيرها» ـ يعني:"], [959.5, "سوف تستمرّ في أمّة محمد صلى الله عليه وسلم إلى أن تقوم الساعة ـ إلى أن قال رحمه الله:"], [967.0, "«وتعمّ الرجالَ والنساء، والوليُّ يسترها غالبًا ويُسِرّها»."], [974.0, "انتهى كلامه رحمه الله تعالى."], [976.0, "وتتّضح هذه الكلّيّة بضوابطها وقيودها وشروطها في الكلّيّات التي تأتي بعدها إن شاء الله."]], "tr": [[941.0, "İmam İbn Hamdân el-Hanbelî —Allah ona rahmet etsin— şöyle dedi:"], [945.0, "\"Velîlerin kerameti haktır. İmam Ahmed onu inkâr edeni reddetmiş ve onu sapıklıkla nitelemiştir."], [951.5, "O, velî hakkında beşerin gücü dahilindeki bir şeyle <span class=\"q\">؟<\/span> âdetin aşılmasıdır."], [956.7, "Nübüvvet zamanında, kıyamet alâmetleri (zamanında) ve başka zamanlarda bulunur.\" —Yani kıyamet kopuncaya kadar Muhammed sallallâhu aleyhi ve sellem'in ümmetinde devam edecektir.— Nihayet —Allah ona rahmet etsin— şöyle demiştir:"], [967.7, "\"Erkeklere ve kadınlara şâmildir. Velî onu çoğunlukla örter ve gizler.\" Sözü bitti, Allah ona rahmet etsin."], [977.5, "Bu külliye, inşallah kendisinden sonra gelecek külliyelerde zâbıtları, kayıtları ve şartlarıyla açıklık kazanacaktır."]]}]}, {"ts": "16:24", "title": "2. Külliye: Bir velînin her kerameti, onun tâbi olduğu peygamber için bir âyettir", "paras": [{"reader": false, "ar": [[984.0, "الكلّيّة الثانية: <b>كلُّ كرامةٍ لوليٍّ فهي آيةٌ للنبيّ الذي اتّبعه.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[984.0, "2. külliye: <b>2. külliye: Bir velînin her kerameti, onun tâbi olduğu peygamber için bir âyettir (delildir).<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1003.0, "أقول وبالله التوفيق: وذلك لأنّ الله عز وجل إنما يُجري هذه الكرامات لإظهار فضل هذا الوليّ،"], [1013.0, "وهذا الوليُّ إنما كان وليًّا باتّباعه لهذا النبيّ."], [1017.0, "فكلُّ من كان متابعًا لنبيّه المبعوث إليه كان أكثرَ كرامةً من غيره،"], [1028.0, "أي: ممّن لم يتابعه."]], "tr": [[1003.0, "Tevfik Allah'tandır, derim ki: Bunun sebebi şudur:"], [1006.8, "Allah Azze ve Celle bu kerametleri ancak bu velînin faziletini ortaya koymak için meydana getirir;"], [1015.0, "bu velî de ancak bu peygambere uymakla velî olmuştur."], [1019.7, "Kendisine gönderilen peygamberine uyan herkes, başkasından —yani ona uymayandan— daha çok kerametlidir."]]}, {"reader": false, "ar": [[1029.0, "ويوضّح هذه الكلّيّةَ أبو العبّاس ابنُ تيميّة رحمه الله تعالى في نقولٍ مطوّلة،"], [1035.0, "قال رحمه الله: «فأولياءُ الله المتّقون هم المقتدون بمحمدٍ صلى الله عليه وسلم، فيفعلون ما أمر به، وينتهون عمّا زجر عنه، ويقتدون به فيما بيّن لهم أن يتّبعوه فيه»."], [1051.0, "طيّب، إذا فعلوا ذلك ماذا يحصل لهم يا ابنَ تيميّة؟"], [1055.0, "قال رحمه الله: «فيؤيّدهم بملائكته وروحٍ منه، ويقذف الله في قلوبهم من أنواره، ولهم الكراماتُ التي يُكرم الله بها أولياءه المتّقين»."]], "tr": [[1029.0, "Bu külliyeyi Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— uzun nakillerde açıklar."], [1034.1, "—Allah ona rahmet etsin— şöyle der:"], [1036.8, "\"Allah'ın muttakî velîleri Muhammed sallallâhu aleyhi ve sellem'e uyanlardır."], [1042.4, "Onun emrettiğini yaparlar, men ettiğinden geri dururlar ve kendisine uymalarını açıkladığı şeylerde ona uyarlar.\" Peki, bunu yaptıklarında onlara ne olur ey İbn Teymiyye?"], [1052.6, "—Allah ona rahmet etsin— dedi ki:"], [1055.0, "\"(Allah) onları melekleriyle ve kendisinden bir ruhla destekler;"], [1060.0, "Allah onların kalplerine nurlarından atar."], [1063.3, "Onlar için, Allah'ın muttakî velîlerine ikram ettiği kerametler vardır.\""]]}, {"reader": false, "ar": [[1069.0, "«وخيارُ أولياء الله كراماتُهم لحُجّةٍ في الدين أو لحاجةٍ بالمسلمين، كما كانت معجزاتُ نبيّهم صلى الله عليه وسلم. وكراماتُ أولياء الله إنما حصلت ببركة اتّباع رسول الله صلى الله عليه وسلم، فهي في الحقيقة تدخل في معجزات الرسول صلى الله عليه وسلم»."], [1089.0, "انتهى كلامه. وقال رحمه الله تعالى:"], [1092.2, "«وكراماتُ الصالحين تدلّ على صحّة الدين الذي جاء به الرسول صلى الله عليه وسلم، لا تدلّ على أنّ الوليّ معصوم، ولا على أنه يجب طاعتُه في كلّ ما يقوله». انتهى كلامه."]], "tr": [[1069.0, "\"Allah'ın velîlerinin en hayırlılarının kerametleri, dinde bir hüccet veya Müslümanların bir ihtiyacı içindir;"], [1075.0, "tıpkı peygamberlerinin sallallâhu aleyhi ve sellem mucizelerinin böyle olduğu gibi."], [1079.4, "Allah'ın velîlerinin kerametleri ancak Resûlullah sallallâhu aleyhi ve sellem'e uymanın bereketiyle meydana gelmiştir;"], [1085.4, "dolayısıyla onlar hakikatte Resûl sallallâhu aleyhi ve sellem'in mucizelerine dahildir.\" Sözü bitti."], [1090.6, "—Allah ona rahmet etsin— şöyle de demiştir:"], [1094.4, "\"Sâlihlerin kerametleri, Resûl sallallâhu aleyhi ve sellem'in getirdiği dinin sıhhatine delalet eder;"], [1100.5, "velînin masum olduğuna ve söylediği her şeyde ona itaat etmenin vâcip olduğuna delalet etmez.\" Sözü bitti."]]}, {"reader": false, "ar": [[1108.0, "وقال الإمامُ ابنُ رجبٍ رحمه الله تعالى:"], [1111.7, "«والتحقيقُ أنها» ـ أي: الكرامات ـ «من جملة معجزات الأنبياء على كلّ حالٍ وفي كلّ زمان؛ لأنّ ما يُكرم الله بذلك أولياءه فإنما هو من بركة اتّباعهم للأنبياء وحسن اقتدائهم بهم، فدوامُ ذلك لأتباعهم وخواصّهم من جملة معجزاتهم وآياتهم». انتهى كلامه."]], "tr": [[1108.0, "İmam İbn Receb —Allah ona rahmet etsin— şöyle dedi:"], [1111.7, "\"Tahkik edilmiş görüş şudur ki onlar\" —yani kerametler— \"her hâlükârda ve her zamanda peygamberlerin mucizelerindendir."], [1118.5, "Çünkü Allah'ın bununla velîlerine ikram ettiği şey, ancak onların peygamberlere uymalarının ve onlara güzelce tâbi olmalarının bereketindendir."], [1126.8, "Bunun onların tâbilerinde ve seçkinlerinde devam etmesi de onların mucizeleri ve âyetlerindendir.\" Sözü bitti."]]}, {"reader": false, "ar": [[1136.0, "وقال القَسْطَلّانيّ رحمه الله تعالى بعد أن ذكر حديثَ إضاءة العصا ـ الذي ذكرتُه في الكلّيّة الأولى ـ قال:"], [1144.7, "«إكرامًا لهما ببركة نبيّهما، آيةً له عليه الصلاة والسلام، إذ خُصَّ بعضُ أصحابه بمثل هذه الكرامة عند حاجتهم إلى النور». انتهى كلامه."]], "tr": [[1136.0, "el-Kastallânî —Allah ona rahmet etsin— 1."], [1138.0, "külliyede zikrettiğim asânın aydınlatması hadisini zikrettikten sonra şöyle dedi:"], [1142.0, "\"(Bu), peygamberlerinin bereketiyle o ikisine bir ikram ve ona —salât ve selâm olsun— bir âyet olarak (meydana geldi);"], [1151.5, "zira ashâbından bazıları nura ihtiyaç duydukları anda böyle bir keramete mazhar kılınmıştır.\" Sözü bitti."]]}, {"reader": false, "ar": [[1157.0, "فالوليُّ ما صار وليًّا إلا باتّباع النبيّ صلى الله عليه وسلم،"], [1163.0, "فتكون الكرامةُ في حقّه دليلًا وشاهدًا على صدق النبيّ الذي يتّبعه؛"], [1169.0, "إذ إنه لم يُؤتَ الكرامةَ إلا باتّباعه والإيمان به."], [1173.0, "وعليه فلا يصحّ معارضةُ معجزة النبيّ بكرامة الوليّ،"], [1177.0, "كما يقوله المعتزلة ومن ضاهاهم من أهل البدع. والله أعلم."]], "tr": [[1157.0, "Velî ancak Peygamber sallallâhu aleyhi ve sellem'e uymakla velî olmuştur."], [1161.4, "Dolayısıyla keramet onun hakkında, uyduğu peygamberin doğruluğuna bir delil ve şahit olur;"], [1167.4, "çünkü kerameti ancak ona uymak ve ona iman etmekle verilmiştir."], [1171.7, "Buna göre, Mu'tezile'nin ve onlara benzeyen bid'at ehlinin dediği gibi peygamberin mucizesine velînin kerametiyle muâraza etmek (karşı çıkmak) sahih değildir. Allah en iyisini bilir."]]}]}, {"ts": "19:42", "title": "3. Külliye: Her muttakî mümin Allah'ın velîsidir", "paras": [{"reader": false, "ar": [[1182.0, "الكلّيّة الثالثة: <b>كلُّ مؤمنٍ تقيٍّ فهو لله وليّ.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span>"]], "tr": [[1182.0, "3. külliye: <b>3. külliye: Her muttakî mümin Allah'ın velîsidir.<\/b> (Üç kez tekrar ediyor.)"]]}, {"reader": false, "ar": [[1202.0, "أقول وبالله التوفيق: ومن المعلوم أنّ الولاية تتفاوت مراتبُها بتفاوت الاتّباع وامتثال أمر الشارع."], [1213.0, "ولذلك يقول الله عز وجل في بيان هذه الكلّيّة:"], [1217.7, "<span class=\"ayah\">﴿أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ الَّذِينَ آمَنُوا وَكَانُوا يَتَّقُونَ﴾<\/span> <span class=\"ref\">[يونس: ٦٢–٦٣]<\/span>."]], "tr": [[1202.0, "Tevfik Allah'tandır, derim ki: Bilindiği üzere velâyetin mertebeleri, (Peygamber'e) uymanın ve Şâri'in emrine boyun eğmenin farklılığına göre farklılık gösterir."], [1213.0, "Bu yüzden Allah Azze ve Celle bu külliyeyi açıklarken şöyle buyurur:"], [1217.7, "<span class=\"ayah\">﴿Bilin ki Allah'ın velîlerine hiçbir korku yoktur, onlar üzülmeyeceklerdir de. Onlar iman edip takvâ sahibi olanlardır﴾<\/span> [Yûnus 62–63]."]]}, {"reader": false, "ar": [[1226.0, "وقد ذكر الله تعالى أقسامَ أهل ولايته ممّن اصطفاهم لوراثة كتابه في قول الله عز وجل:"], [1233.0, "<span class=\"ayah\">﴿ثُمَّ أَوْرَثْنَا الْكِتَابَ الَّذِينَ اصْطَفَيْنَا مِنْ عِبَادِنَا فَمِنْهُمْ ظَالِمٌ لِّنَفْسِهِ وَمِنْهُم مُّقْتَصِدٌ وَمِنْهُمْ سَابِقٌ بِالْخَيْرَاتِ بِإِذْنِ اللَّهِ ذَٰلِكَ هُوَ الْفَضْلُ الْكَبِيرُ﴾<\/span> <span class=\"ref\">[فاطر: ٣٢]<\/span>."]], "tr": [[1226.0, "Allah Teâlâ, Kitabı'na vâris kılmak için seçtiği velâyet ehlinin kısımlarını şu sözünde zikretmiştir:"], [1230.8, "<span class=\"ayah\">﴿Sonra Kitab'ı kullarımızdan seçtiklerimize miras bıraktık. Onlardan kimi kendine zulmeder, kimi orta yolu tutar, kimi de Allah'ın izniyle hayırlarda öne geçer. İşte bu, büyük lütfun ta kendisidir﴾<\/span> [Fâtır 32]."]]}, {"reader": false, "ar": [[1243.0, "وذكر النبيُّ صلى الله عليه وسلم درجاتِ الولاية في حديث الوليّ المتّفق على صحّته بين أهل الحديث،"], [1253.0, "في قوله صلى الله عليه وسلم:"], [1255.0, "«مَن عادى لي وليًّا فقد آذنتُه بالحرب، وما تقرّب إليّ عبدي بشيءٍ أحبَّ إليّ ممّا افترضتُه عليه، ولا يزال عبدي يتقرّب إليّ بالنوافل حتى أُحبّه»، الحديثَ بتمامه."]], "tr": [[1243.0, "Peygamber sallallâhu aleyhi ve sellem de velâyetin derecelerini, hadis ehli arasında sahih olduğu üzerinde ittifak edilen velî hadisinde şu sözüyle zikretmiştir:"], [1253.3, "\"Kim benim bir velîme düşmanlık ederse, ben de ona savaş ilan ederim."], [1258.4, "Kulum bana, kendisine farz kıldığım şeyden daha sevimli bir şeyle yaklaşmamıştır."], [1264.4, "Kulum nafilelerle bana yaklaşmaya devam eder, ta ki onu severim.\" Hadisin tamamı."]]}, {"reader": false, "ar": [[1271.0, "وبناءً على ذلك فمن شرط كون الخارق كرامةً أن يكون مَن وقعت له من عباد الله المؤمنين."], [1282.0, "فمن لم يكن له مصدِّقًا فيما أخبر به،"], [1286.3, "ملتزمًا طاعتَه فيما أوجب وأمر،"], [1289.0, "فإنه ـ وإن جرى على يديه ما جرى من خوارق العادات ـ فإنّ أهل السنّة لا يعتبرونها كرامة."], [1297.0, "فلا يحكم أهلُ السنّة على خارق العادة الذي يُجريه الله على العباد بأنه كرامة إلا إذا أجراه الله عز وجل على يد أهل الإيمان."]], "tr": [[1271.0, "Buna binaen, hârikulâde şeyin keramet olmasının şartı, kendisine vuku bulan kimsenin Allah'ın mümin kullarından olmasıdır."], [1280.7, "(Peygamber'i) haber verdiği şeylerde tasdik etmeyen, vâcip kıldığı ve emrettiği şeylerde ona itaati üstlenmeyen kimsenin elinde ne kadar hârikulâde şey meydana gelirse gelsin, Ehl-i Sünnet onları keramet saymaz."], [1296.0, "Ehl-i Sünnet, Allah'ın kullar üzerinde meydana getirdiği hârikulâde bir şeyin keramet olduğuna, ancak Allah Azze ve Celle onu iman ehlinin elinde meydana getirmişse hükmeder."]]}, {"reader": false, "ar": [[1309.0, "وإلّا فإنّ خوارقَ العادات على يد الكفّار والفسّاق كثيرةٌ جدًّا،"], [1315.7, "كما سيأتينا في كلّيّةٍ خاصّة."], [1321.0, "فينبغي لنا أن لا نجزم بأيّ كرامةٍ لمجرّد جريانها على يد أحدٍ من الناس حتى ننظر مدى متابعته للكتاب والسنّة."], [1331.0, "بل الواجبُ علينا جميعًا أنّ كلَّ من يدّعي كرامةً أن نعرض أقوالَه وأفعالَه على الكتاب والسنّة؛"], [1342.0, "فإن كانت موافقةً لها فهي حقٌّ وصدقٌ وكرامةٌ من الله سبحانه،"], [1345.0, "وإن كانت مخالفةً لشيءٍ من ذلك فليُعلم أنه مخدوعٌ ممكورٌ به،"], [1350.7, "قد طمع منه الشيطانُ فلبّس عليه. والله أعلم."]], "tr": [[1309.0, "Aksi takdirde kâfirlerin ve fâsıkların elinde hârikulâde şeyler pek çoktur;"], [1314.3, "ileride özel bir külliyede geleceği gibi."], [1317.7, "Bu yüzden, insanlardan birinin elinde meydana geldi diye hiçbir kerametin (keramet olduğuna) kesin hüküm vermememiz, onun Kitap ve Sünnet'e ne ölçüde uyduğuna bakıncaya kadar (beklememiz) gerekir."], [1331.0, "Bilakis hepimize vâcip olan, keramet iddia eden herkesin sözlerini ve fiillerini Kitap ve Sünnet'e arz etmemizdir."], [1340.3, "Eğer onlara uygunsa hak, doğru ve Allah Sübhânehû'dan bir kerametir."], [1343.6, "Eğer onlardan bir şeye aykırıysa, bilinsin ki o aldatılmış, kendisine tuzak kurulmuş biridir;"], [1348.5, "şeytan ona göz dikmiş ve onu (hakkı bâtılla) karıştırmaya düşürmüştür. Allah en iyisini bilir."]]}]}, {"ts": "22:35", "title": "4. Külliye: Şeriate muhalefet edenlerin elinde meydana gelen her hârikulâde şey iblislerin aldatmacalarındandır", "paras": [{"reader": false, "ar": [[1355.0, "الكلّيّة الرابعة: <b>كلُّ خارقٍ للعادة جرى على يد المخالفين للشريعة فمن مخاريق الأبالسة.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span> أي:"], [1365.7, "أنّ الشياطين تُعينهم بمثل هذه الخوارق للعادة حتى تُلبّس على الناس."]], "tr": [[1355.0, "4. külliye: <b>4. külliye: Şeriate muhalefet edenlerin elinde meydana gelen âdeti aşan her şey iblislerin aldatmacalarındandır.<\/b> (Üç kez tekrar ediyor.) Yani şeytanlar, insanların kafasını karıştırmak için onlara bu tür hârikulâde şeylerle yardım ederler."]]}, {"reader": false, "ar": [[1391.0, "اعلموا ـ رحمكم الله تعالى ـ أنّ كراماتِ الأولياء سببُها الإيمانُ والتقوى،"], [1398.0, "والأحوالَ الشيطانيّة سببُها إتيانُ ما نهى الله عز وجل عنه ورسولُه صلى الله عليه وسلم."], [1406.0, "قال الإمامُ الشافعيّ رحمه الله تعالى:"], [1410.0, "«إذا رأيتم الرجلَ يمشي على الماء ويطير في الهواء فلا تغترّوا به حتى تعرضوا أمرَه على الكتاب والسنّة»."]], "tr": [[1391.0, "Bilin —Allah Teâlâ size rahmet etsin— ki velîlerin kerametlerinin sebebi iman ve takvâdır;"], [1398.5, "şeytanî hâllerin sebebi ise Allah Azze ve Celle'nin ve Resûlü sallallâhu aleyhi ve sellem'in yasakladığı şeyleri işlemektir."], [1406.7, "İmam eş-Şâfiî —Allah ona rahmet etsin— şöyle dedi:"], [1410.9, "\"Adamın su üzerinde yürüdüğünü ve havada uçtuğunu görürseniz, onun durumunu Kitap ve Sünnet'e arz edinceye kadar ona aldanmayın.\""]]}, {"reader": false, "ar": [[1419.0, "وقال ابنُ أبي جمرة رحمه الله تعالى:"], [1423.4, "«خرقُ العادة قد يكون للصدّيق والزنديق، وهي للزنديق من طريق الإملاء والإغواء، وإنما تقع التفرقةُ بينهما ـ ما هو منها كرامةٌ أو بلاءٌ وإغواء ـ بالاتّباع للكتاب والسنّة». انتهى كلامه."]], "tr": [[1419.0, "İbn Ebî Cemre —Allah ona rahmet etsin— şöyle dedi:"], [1422.8, "\"Âdetin aşılması sıddîk için de zındık için de olabilir;"], [1427.2, "zındık için ise imhal (mühlet verme) ve azdırma yoluyladır."], [1431.6, "İkisi arasındaki ayrım —ondan neyin keramet, neyin bela ve azdırma olduğu— ancak Kitap ve Sünnet'e uymakla olur.\" Sözü bitti."]]}, {"reader": false, "ar": [[1449.0, "وقال ابنُ تيميّة رحمه الله تعالى ـ انتبهوا لما يقول ـ:"], [1454.0, "«القولُ على الله بغير علم، والشركُ، والظلمُ، والفواحشُ، قد حرّمها الله تعالى ورسولُه صلى الله عليه وسلم، فلا تكون سببًا لكرامة الله تعالى بالكرامات عليها. فإذا كانت لا تحصل» ـ أي:"], [1470.5, "الكرامة ـ «بالصلاة والذكر وقراءة القرآن، بل تحصل بما يحبّه الشيطان، وبالأمور التي فيها شرك كالاستغاثة بالمخلوقات، أو كانت ممّا يُستعان بها على ظلم الخلق وفعل الفواحش، فهي من الأحوال الشيطانيّة لا من الكرامات الرحمانيّة»."]], "tr": [[1449.0, "İbn Teymiyye —Allah ona rahmet etsin— şöyle dedi —ne dediğine dikkat edin—:"], [1454.6, "\"Allah hakkında bilgisizce söz söylemek, şirk, zulüm ve hayâsızlıklar;"], [1459.0, "Allah Teâlâ ve Resûlü sallallâhu aleyhi ve sellem bunları haram kılmıştır."], [1463.0, "Dolayısıyla bunlar, Allah Teâlâ'nın bunlar karşılığında kerametlerle ikram etmesine sebep olmaz."], [1468.4, "(Bu hârikalar)\" —yani keramet— \"namaz, zikir ve Kur'an okumakla meydana gelmiyor, bilakis şeytanın sevdiği şeylerle ve mahlûklardan medet istemek gibi içinde şirk bulunan işlerle meydana geliyorsa, ya da halka zulmetmek ve hayâsızlık yapmak için kendileriyle yardım alınan şeylerdense, bunlar rahmânî kerametlerden değil, şeytanî hâllerdendir.\""]]}, {"reader": false, "ar": [[1488.0, "وقال رحمه الله تعالى:"], [1492.0, "«كراماتُ الأولياء لا بدّ أن يكون سببُها الإيمانَ والتقوى، فما كان سببُه الكفرَ والفسوقَ والعصيانَ فهو من خوارق أعداء الله، لا من كرامات أولياء الله. فمن كانت خوارقُه لا تحصل بالصلاة والقراءة والذكر وقيام الليل والدعاء، وإنما تحصل عند الشرك مثل دعاء الميّت والغائب، أو بالفسق والعصيان وأكل المحرّمات كالحيّات والزنابير والخنافس والدم وغيره من النجاسات، ومثل الغناء والرقص، لا سيّما مع النسوة الأجانب والمُردان»."]], "tr": [[1488.0, "—Allah ona rahmet etsin— şöyle de dedi:"], [1492.6, "\"Velîlerin kerametlerinin sebebi mutlaka iman ve takvâ olmalıdır."], [1496.4, "Sebebi küfür, fısk ve isyan olan şey ise Allah'ın velîlerinin kerametlerinden değil, Allah'ın düşmanlarının hârikalarındandır."], [1502.5, "Kimin hârikaları namaz, Kur'an okuma, zikir, gece namazı ve dua ile meydana gelmiyor da ancak ölüye ve gâibe dua etmek gibi şirk anında, ya da fısk, isyan ve yılanlar, eşek arıları, böcekler, kan ve diğer necasetler gibi haramları yemekle, ya da şarkı ve dans ile —özellikle yabancı kadınlar ve sakalı bitmemiş delikanlılarla birlikte— meydana geliyorsa…\""]]}, {"reader": false, "ar": [[1527.0, "«وحالةُ خوارقِه تنقص عند سماع القرآن، وتقوى عند سماع مزامير الشيطان، فيرقص ليلًا طويلًا، فإذا جاءت الصلاةُ صلّى قاعدًا، أو ينقر الصلاةَ نقرَ الديك، وهو يُبغض سماعَ القرآن وينفر عنه، ويتكلّفه، ليس له فيه محبّةٌ ولا ذوقٌ ولا لذّةٌ عند وجده، ويحبّ سماعَ المُكاء والتَّصدية، ويجد عنده مواجيد، فهذه أحوالٌ شيطانيّة، وهو ممّن يتناوله قولُه تعالى: <span class=\"ayah\">﴿وَمَن يَعْشُ عَن ذِكْرِ الرَّحْمَٰنِ نُقَيِّضْ لَهُ شَيْطَانًا فَهُوَ لَهُ قَرِينٌ﴾<\/span> <span class=\"ref\">[الزخرف: ٣٦]<\/span>»."]], "tr": [[1527.0, "\"Hârikalarının hâli Kur'an dinlerken azalır, şeytanın mizmarlarını (çalgılarını) dinlerken güçlenir."], [1532.0, "Uzun bir gece boyunca dans eder;"], [1535.0, "namaz vakti gelince oturarak kılar veya namazı horozun gagalaması gibi (çabucak) kılar."], [1539.0, "Kur'an dinlemekten nefret eder ve ondan kaçar;"], [1542.0, "onu zorlanarak dinler, onda kendini bulduğu (vecd) anında ne bir sevgisi, ne bir zevki, ne de bir lezzeti vardır."], [1549.5, "Islık ve el çırpma dinlemeyi sever ve orada birtakım vecdler bulur."], [1555.0, "İşte bunlar şeytanî hâllerdir ve o, Allah Teâlâ'nın şu sözünün kapsamına girenlerdendir:"], [1563.0, "<span class=\"ayah\">﴿Kim Rahmân'ın zikrinden göz yumarsa, biz ona bir şeytanı musallat ederiz de o, onun yakın arkadaşı olur﴾<\/span> [Zuhruf 36].\""]]}, {"reader": false, "ar": [[1570.0, "وقال رحمه الله تعالى:"], [1572.0, "«وتجد كثيرًا من هؤلاء عمدتُهم في اعتقاد كونه وليًّا لله أنه قد صدر عنه مكاشفةٌ في بعض الأمور، أو بعضُ التصرّفات الخارقة للعادة، مثل أن يشير إلى شخصٍ فيموت، أو يطير في الهواء إلى مكّة أو غيرها، أو يمشي على الماء أحيانًا، أو يملأ إبريقًا من الهواء، أو يُنفق بعضَ الأوقات ـ عفوًا ـ أو يُنفق بعضَ الأوقات من الغيب، أو يختفي أحيانًا عن أعين الناس»."]], "tr": [[1570.0, "—Allah ona rahmet etsin— şöyle de dedi:"], [1573.0, "\"Bunların birçoğunun, onun Allah'ın velîsi olduğuna inanmada dayanaklarının şu olduğunu görürsün:"], [1578.0, "Ondan bazı işlerde bir mükâşefe veya âdeti aşan bazı tasarruflar sâdır olmuştur."], [1583.1, "Mesela bir kişiye işaret eder de o ölür;"], [1586.1, "ya da havada Mekke'ye veya başka bir yere uçar;"], [1589.6, "ya da bazen su üzerinde yürür;"], [1593.5, "ya da havadan bir ibriği doldurur;"], [1595.1, "ya da bazı vakitler —pardon— bazı vakitler gaybdan infak eder;"], [1599.3, "ya da bazen insanların gözlerinden kaybolur.\""]]}, {"reader": false, "ar": [[1608.0, "«أو أنّ بعض الناس استغاث به وهو غائبٌ أو ميّت فرآه قد جاء فقضى حاجته، أو يُخبر الناسَ بما سُرق لهم، أو بحال غائبٍ لهم أو مريض، أو نحو ذلك من الأمور. وليس في شيءٍ من هذه الأمور ما يدلّ على أنّ صاحبها وليٌّ لله، بل قد اتّفق أولياءُ الله على أنّ الرجل لو طار في الهواء أو مشى على الماء لم يُغترّ به حتى يُنظر متابعتُه لرسول الله صلى الله عليه وسلم وموافقتُه لأمره ونهيه». انتهى كلامه."]], "tr": [[1608.0, "\"Ya da insanlardan biri, o gâib veya ölüyken ondan medet istemiş de onun gelip ihtiyacını giderdiğini görmüştür;"], [1614.7, "ya da insanlara çalınan eşyalarını, gâib olan yakınlarının veya hastalarının hâlini ya da buna benzer işleri haber verir."], [1621.4, "Bu işlerin hiçbirinde, sahibinin Allah'ın velîsi olduğuna delalet eden bir şey yoktur."], [1626.7, "Bilakis Allah'ın velîleri, bir adam havada uçsa veya su üzerinde yürüse, Resûlullah sallallâhu aleyhi ve sellem'e uyması ve onun emrine ve yasağına muvafakati incelenmedikçe ona aldanılmayacağında ittifak etmişlerdir.\" Sözü bitti."]]}]}, {"ts": "27:22", "title": "4. Külliye (devam): Şeytanî hâl sahiplerinden örnekler — Esved el-Ansî, Müseylime, Hâris ed-Dımaşkî", "paras": [{"reader": false, "ar": [[1642.0, "وقال أيضًا في شأن أصحاب الأحوال الشيطانيّة:"], [1646.0, "«هؤلاء» ـ أي: أصحابُ الأحوال الشيطانيّة ـ «تقترن بهم الشياطين وتتنزّل عليهم، فيُكاشفون الناسَ ببعض الأمور، ولهم تصرّفاتٌ خارقةٌ من جنس السحر، وهم من جنس الكهّان والسحرة الذين تتنزّل عليهم الشياطين»."]], "tr": [[1642.0, "Şeytanî hâl sahipleri hakkında şöyle de dedi:"], [1645.4, "\"Bunlara\" —yani şeytanî hâl sahiplerine— \"şeytanlar yoldaş olur ve üzerlerine iner."], [1653.0, "Böylece insanlara bazı işleri keşfederek bildirirler."], [1656.5, "Onların sihir cinsinden hârika tasarrufları vardır."], [1659.4, "Onlar, üzerlerine şeytanların indiği kâhinler ve sihirbazlar cinsindendir.\""]]}, {"reader": false, "ar": [[1665.0, "وقد حكى الإمامُ ابنُ تيميّة في «الفتاوى» جُمَلًا من الأمثلة على هؤلاء الذين أجرى الله عز وجل على أيديهم شيئًا من هذه الخوارق وهم مخالفون للشريعة،"], [1681.0, "فقال رحمه الله تعالى:"], [1683.9, "«الأسودُ العَنْسيّ» ـ بتسكين النون ـ «الذي ادّعى النبوّة، كان له من الشياطين من يُخبره ببعض الأمور الغيبيّة، فلمّا قاتله المسلمون كانوا يخافون من الشياطين أن يُخبروه بما يقولون فيه، حتى أعانتهم عليه امرأتُه لمّا تبيّن لها كفرُه، فقتلوه»."]], "tr": [[1665.0, "İmam İbn Teymiyye \"el-Fetâvâ\"da, şeriate muhalif oldukları hâlde Allah Azze ve Celle'nin ellerinde bu hârikalardan bir kısmını meydana getirdiği bu kimselere dair birçok örnek hikâye etmiştir."], [1679.7, "—Allah ona rahmet etsin— şöyle dedi:"], [1683.2, "\"Peygamberlik iddia eden el-Esved el-Ansî'nin\" —nûn sakin olarak— \"kendisine bazı gaybî işleri haber veren şeytanları vardı."], [1692.8, "Müslümanlar onunla savaşınca, şeytanların onun hakkında söylediklerini ona haber vermelerinden korkuyorlardı."], [1698.0, "Nihayet küfrü kendisine açıkça belli olunca karısı onlara yardım etti ve onu öldürdüler.\""]]}, {"reader": false, "ar": [[1706.0, "«وكذلك مسيلمةُ الكذّاب، كان معه من الشياطين من يُخبره بالمغيّبات، ويُعينه على بعض الأمور. وأمثالُ هؤلاء كثيرون، مثل الحارث الدمشقيّ الذي خرج بالشام زمنَ عبد الملك بن مروان وادّعى النبوّة، وكانت الشياطين يُخرجون رجليه من القيد إذا قُيّد، وتمنع السلاحَ أن ينفذ فيه، وتُسبّح الرخامةُ إذا مسحها بيده، وكان يُري الناسَ رجالًا وركبانًا على خيلٍ في الهواء، ويقول: هؤلاء هم الملائكة، وإنما كانوا جنًّا»."]], "tr": [[1706.0, "\"Aynı şekilde Yalancı Müseylime'nin de kendisine gaybî şeyleri haber veren ve bazı işlerde ona yardım eden şeytanları vardı."], [1717.0, "Bunların benzerleri çoktur. Mesela Abdülmelik b."], [1720.3, "Mervân zamanında Şam'da ortaya çıkıp peygamberlik iddia eden Hâris ed-Dımaşkî gibi."], [1726.0, "Şeytanlar, bağlandığında ayaklarını bukağıdan çıkarıyor, silahın ona işlemesine engel oluyorlardı."], [1732.0, "Mermer taşına eliyle dokunduğunda taş tesbih ediyordu."], [1736.3, "İnsanlara havada yaya ve atlı adamlar gösterir ve:"], [1741.7, "Bunlar meleklerdir, derdi; hâlbuki onlar cinlerdi.\""]]}, {"reader": false, "ar": [[1746.0, "«ولمّا أمسكه المسلمون ليقتلوه طعنه الطاعنُ بالرمح فلم ينفذ فيه، فقال له عبدُ الملك: إنك لم تُسمِّ الله، فسمّى اللهَ فطعنه فقتله. وهكذا أهلُ الأحوال الشيطانيّة تنصرف عنهم شياطينُهم إذا ذُكر عندهم ما يطردها، مثل آية الكرسيّ»."], [1768.0, "انتهى كلامه رحمه الله تعالى."]], "tr": [[1746.0, "\"Müslümanlar onu öldürmek için yakalayınca, mızrakçı ona mızrağı sapladı ama işlemedi."], [1750.5, "Abdülmelik ona: Sen Allah'ın adını anmadın, dedi."], [1753.9, "(Mızrakçı) Allah'ın adını anıp ona sapladı ve onu öldürdü."], [1758.0, "İşte şeytanî hâl ehli de böyledir:"], [1761.3, "Yanlarında Âyetü'l-Kürsî gibi şeytanları kovan bir şey anıldığında şeytanları onlardan uzaklaşır.\" Sözü bitti, Allah ona rahmet etsin."]]}, {"reader": false, "ar": [[1771.0, "وقال الإمامُ ابنُ حمدان رحمه الله:"], [1773.9, "«لا يلزم من صحّة الكرامات ووجودها صدقُ من يدّعيها بدون بيّنةٍ أو قرائنَ حاليّةٍ تفيد الجزمَ بذلك، وإن مشى على الماء وفي الهواء، أو سُخّرت له الجنُّ والسباع، حتى يُنظر خاتمتُه وموافقتُه للشرع في الأمر والنهي. فإن وُجد ذلك من نحو جاهلٍ فهو مَخْرَقةٌ ومكرٌ من إبليس، وإغواءٌ وإضلال»."], [1801.0, "انتهى كلامه. والله أعلم."]], "tr": [[1771.0, "İmam İbn Hamdân —Allah ona rahmet etsin— şöyle dedi:"], [1774.3, "\"Kerametlerin sahih ve mevcut olması, onu iddia edenin, bir delil veya bunu kesinleştiren hâlî karineler olmaksızın doğru olmasını gerektirmez;"], [1781.5, "su üzerinde ve havada yürüse veya cinler ve yırtıcı hayvanlar onun emrine verilse bile;"], [1787.0, "ta ki âkıbetine ve emir ve yasakta şeriate muvafakatine bakılıncaya kadar."], [1791.4, "Eğer bu, cahil gibi birinden görülürse, o İblis'ten bir aldatmaca ve tuzak, bir azdırma ve saptırmadır.\" Sözü bitti. Allah en iyisini bilir."]]}]}, {"ts": "30:04", "title": "5. Külliye: İstikameti terk etmeye sevk eden her hârikulâde şey keramet değildir", "paras": [{"reader": false, "ar": [[1804.0, "ومن الكلّيّات أيضًا: <b>كلُّ خارقٍ حمل على ترك الاستقامة فليس بكرامة.<\/b> ـ الظاهر بنكتفي بهالقاعدة،"], [1816.1, "نشرحها بس <span class=\"q\">؟ 30:11<\/span> ـ <b>كلُّ خارقٍ حمل على ترك الاستقامة فليس بكرامة.<\/b>"]], "tr": [[1804.0, "Külliyelerden biri de şudur: 5."], [1805.9, "külliye: İstikameti terk etmeye sevk eden âdeti aşan her şey keramet değildir. —Galiba bu kaideyle yetineceğiz, sadece onu şerh edelim <span class=\"q\">؟<\/span>.— İstikameti terk etmeye sevk eden âdeti aşan her şey keramet değildir."]]}, {"reader": false, "ar": [[1834.0, "أقول وبالله التوفيق: بل هو ـ والله ـ حسرةٌ وندامة،"], [1840.0, "وتلبيسٌ من الشيطان، ومكرٌ واستدراجٌ من الله عز وجل."], [1845.0, "ولذلك لا ينبغي أن تشتمل الكرامةُ على ترك شيءٍ من الواجبات،"], [1850.2, "أو فعل شيءٍ من المحرّمات أبدًا،"], [1853.0, "أو التزام شيءٍ من البدع المحدثات في دين الله عز وجل."], [1857.0, "وذلك لأنّ الوليّ إنما نال الكرامةَ بطاعة الله ورسوله وبإيمانه بهما،"], [1864.0, "فلا يمكن بحالٍ أن تكون تلك الكرامةُ سببًا لتركه شيئًا ممّا نالها به."]], "tr": [[1834.0, "Tevfik Allah'tandır, derim ki: Bilakis o —vallahi— bir hasret ve pişmanlık, şeytandan bir karıştırma (aldatma), Allah Azze ve Celle'den bir tuzak ve istidrâctır."], [1845.9, "Bu yüzden keramet asla vâciplerden birini terk etmeyi veya haramlardan birini işlemeyi ya da Allah Azze ve Celle'nin dininde sonradan uydurulmuş bid'atlerden birine bağlanmayı ihtiva etmemelidir."], [1855.9, "Çünkü velî kerameti ancak Allah'a ve Resûlü'ne itaat etmekle ve onlara imanıyla elde etmiştir."], [1862.7, "Dolayısıyla o kerametin, onu kendisiyle elde ettiği şeylerden birini terk etmesine sebep olması hiçbir şekilde mümkün değildir."]]}, {"reader": false, "ar": [[1870.0, "ثم إنّ المحرّم خبيث،"], [1873.0, "والله لا يُكرم عبدَه بشيءٍ خبيث."], [1876.0, "كما أنّ من دلائل الولاية الوقوفَ عند النصوص الشرعيّة،"], [1880.0, "فلا يكون وليًّا لله مَن أحدث في دين الله تعالى ما ليس منه."]], "tr": [[1870.0, "Sonra haram olan şey habistir (pistir);"], [1873.5, "Allah ise kulunu habis bir şeyle ikramlandırmaz."], [1876.9, "Ayrıca velâyetin delillerinden biri şer'î nassların sınırında durmaktır."], [1880.0, "Allah Teâlâ'nın dininde ondan olmayan bir şey ihdas eden kimse Allah'ın velîsi olamaz."]]}, {"reader": false, "ar": [[1885.0, "قال الإمامُ ابنُ الجوزيّ رحمه الله تعالى:"], [1888.0, "«قد لبّس إبليسُ على قومٍ من المتأخّرين، فوضعوا حكاياتٍ في كرامات الأولياء ليُشيّدوا بذلك باطلَهم، والحقُّ لا يحتاج لتشييدٍ بباطل»."], [1904.0, "ثم ساق رحمه الله تعالى قصّةً تُروى عن سهل بن عبد الله،"], [1908.0, "فيها أنّ أحد الأولياء اشترط عليه أن يرمي ما معه من الزاد ـ يعني:"], [1913.5, "بمعنى أنه قال: لن تكون وليًّا لله إلا إذا توكّلتَ عليه التوكّلَ الذي لا يجعلك تحمل شيئًا من الزاد ـ."]], "tr": [[1885.0, "İmam İbnü'l-Cevzî —Allah ona rahmet etsin— şöyle dedi:"], [1888.7, "\"İblis, müteahhirînden bir kavmin kafasını karıştırdı;"], [1893.0, "bâtıllarını bununla güçlendirmek için velîlerin kerametleri hakkında hikâyeler uydurdular."], [1901.6, "Hâlbuki hak, bâtılla güçlendirilmeye muhtaç değildir.\" Sonra —Allah ona rahmet etsin— Sehl b."], [1907.3, "Abdullah'tan rivayet edilen bir kıssa naklediyor:"], [1909.7, "Bu kıssada velîlerden birinin, yanındaki azığı atmasını ona şart koştuğu anlatılır —yani şöyle demiş:"], [1916.5, "Allah'a, sana hiç azık taşıtmayacak bir tevekkülle tevekkül etmedikçe O'nun velîsi olamazsın.—"]]}, {"reader": false, "ar": [[1923.0, "قال: اشترط عليه أن يرمي ما معه من الزاد حتى يُعطيه نورَ الولاية فتكون له خوارقُ العادات،"], [1933.0, "ففعل، إلى أن قال سهل:"], [1935.5, "«فغشيني نورُ الولاية». ثم علّق ابنُ الجوزيّ بقوله:"], [1940.2, "«ويدلّ على أنها حكايةٌ موضوعة قولُه: اطرح ما معك؛ لأنّ الأولياء لا يخالفون الشرع، والشرعُ نهى عن إضاعة المال»."]], "tr": [[1923.0, "Dedi ki: Ona velâyet nurunu vermesi ve böylece hârikulâde şeylere sahip olması için yanındaki azığı atmasını şart koştu;"], [1932.0, "o da yaptı. Nihayet Sehl şöyle dedi:"], [1935.0, "\"Velâyet nuru beni kapladı.\" Sonra İbnü'l-Cevzî şu sözüyle (buna) talikte bulundu:"], [1940.2, "\"Bunun uydurma bir hikâye olduğuna, onun 'Yanındakini at' sözü delalet eder."], [1945.1, "Çünkü velîler şeriate muhalefet etmezler;"], [1946.6, "şeriat ise malı zayi etmeyi yasaklamıştır.\""]]}, {"reader": false, "ar": [[1949.0, "ومثالُ ذلك أيضًا: مَن تحمله الجنُّ فيحجّ مع الناس بلا إحرام،"], [1957.0, "ولا مرورٍ بميقات، خداعًا من الجنّ له؛"], [1961.0, "فإنها لا تكون كرامةً لأنها صارت سببًا لترك المأمورات والوقوع في المحظورات."], [1967.0, "وكأن يرى شخصًا على صورة نبيٍّ أو مَلَكٍ أو صالحٍ يقول له:"], [1973.0, "قد أبحتُ لك الحرام،"], [1976.0, "وأحللتُ لك ـ وأحللتُه لك ـ أو أسقطتُ عنك التكاليف؛"], [1982.0, "فإنّ هذا ليس بكرامة؛"], [1983.7, "لأنّ الكرامة لا تكون مُعينةً على معصية الله عز وجل."]], "tr": [[1949.0, "Bunun bir örneği de şudur:"], [1952.1, "Cinlerin taşıdığı ve —cinlerin onu aldatması sonucu— ihramsız ve mîkattan geçmeksizin insanlarla birlikte hac yapan kimse."], [1961.0, "Bu keramet olmaz; çünkü emredilenleri terk etmeye ve yasaklara düşmeye sebep olmuştur."], [1966.7, "Ya da bir peygamber, melek veya sâlih bir kişi suretinde birini görmesi ve onun kendisine:"], [1973.0, "Haramı sana mubah kıldım, sana helâl kıldım —onu sana helâl kıldım— veya senden mükellefiyetleri düşürdüm, demesi gibi."], [1983.3, "Bu keramet değildir; çünkü keramet, Allah Azze ve Celle'ye isyana yardımcı olmaz."]]}]}, {"ts": "33:08", "title": "5. Külliye (devam): Şâtıbî'nin nakli, Abdülkâdir el-Geylânî kıssası ve kerametin şeriatin hükümlerini yıkmaması", "paras": [{"reader": false, "ar": [[1988.0, "قال الإمامُ الشاطبيّ رحمه الله تعالى:"], [1992.0, "«مخالفةُ الخوارق للشريعة دليلٌ على بطلانها في نفسها؛ وذلك أنها قد تكون في ظواهرها كالكرامات وليس كذلك، بل من أعمال الشيطان، كما يُحكى عن عبد القادر الجيلانيّ أنه عطش عطشًا شديدًا، فإذا سحابةٌ قد أقبلت وأمطرت عليه شِبهَ الرَّذاذ حتى شرب، ثم نُودي من السحابة: يا فلان، أنا ربُّك، وقد أحللتُ لك المحرّمات»."]], "tr": [[1988.0, "İmam eş-Şâtıbî —Allah ona rahmet etsin— şöyle dedi:"], [1992.7, "\"Hârikaların şeriate aykırı olması, kendi başına onların bâtıl olduğuna delildir."], [1999.1, "Çünkü onlar görünüşte kerametler gibi olabilir ama öyle değildir;"], [2003.5, "bilakis şeytanın işlerindendir. Nitekim Abdülkâdir el-Geylânî'den şöyle hikâye edilir:"], [2008.3, "Çok şiddetli susamış; derken bir bulut gelmiş ve üzerine çiseleme gibi yağmur yağdırmış, o da içmiş."], [2016.0, "Sonra buluttan şöyle seslenilmiş: Ey falan!"], [2018.5, "Ben senin Rabbinim; sana haramları helâl kıldım.\""]]}, {"reader": false, "ar": [[2022.0, "«فقال له: اذهب يا لعين، فاضمحلّت السحابة. وقيل له: بِمَ عرفتَ أنه إبليس؟ قال: بقوله: قد أحللتُ لك المحرّمات. هذا وأشباهه لو لم يكن الشرعُ حَكَمًا فيه لما عُرف أنها أحوالٌ شيطانيّة»."], [2040.0, "انتهى كلامُ الشاطبيّ رحمه الله تعالى."]], "tr": [[2022.0, "\"Ona: Defol ey lanetli! demiş;"], [2024.4, "bulut da dağılıp yok olmuş."], [2027.7, "Kendisine: Onun İblis olduğunu nereden bildin?"], [2029.5, "denilmiş. Demiş ki: Sana haramları helâl kıldım, sözünden."], [2033.0, "Bu ve benzerlerinde şeriat hakem olmasaydı, bunların şeytanî hâller olduğu bilinmezdi.\" Şâtıbî'nin —Allah ona rahmet etsin— sözü bitti."]]}, {"reader": false, "ar": [[2043.0, "فلا يجوز للوليّ أن يستعين بشيءٍ من الكرامات على معصية الله عز وجل؛"], [2049.0, "فإنّ أكملَ الكرامات ما كان مُعينًا على طاعة الله عز وجل."], [2053.0, "ومثالُه: لو شهد شاهدان عدلان في أمرٍ،"], [2056.8, "فرأى القاضي في منامه النبيَّ صلى الله عليه وسلم يقول له:"], [2062.8, "لا تحكم بهذه الشهادة فإنها باطل،"], [2066.0, "فإنه لا يجوز له العملُ بمقتضى هذه الرؤيا؛"], [2070.7, "لأنها تهدم قواعدَ الشريعة."]], "tr": [[2043.0, "Velînin kerametlerden herhangi birini Allah Azze ve Celle'ye isyan için kullanması caiz değildir;"], [2048.5, "çünkü kerametlerin en mükemmeli Allah Azze ve Celle'ye itaate yardımcı olandır."], [2052.3, "Bunun örneği şudur: İki âdil şahit bir konuda şahitlik etse, kadı da rüyasında Peygamber sallallâhu aleyhi ve sellem'i kendisine:"], [2061.7, "Bu şahitlikle hükmetme, çünkü o bâtıldır, derken görse, bu rüyanın gereğiyle amel etmesi ona caiz değildir;"], [2070.1, "çünkü bu, şeriatin kaidelerini yıkar."]]}, {"reader": false, "ar": [[2073.0, "وكذا لو حصلت له مكاشفةٌ وحدّثه من لا يراه بأنّ الماء الذي يريد الوضوءَ به مغصوبٌ أو نجس،"], [2083.0, "فإنه لا يجوز له أن يتركه ويتيمّم؛"], [2087.0, "لأنّ فتح هذا الباب يُبطل العملَ بالظاهر ويُلغي الشرائع."], [2091.0, "فمتى ما رأيتَ الوليَّ يترك شيئًا من المأمورات،"], [2095.3, "أو يفعل شيئًا من المحظورات،"], [2098.0, "بسبب شيءٍ أجراه الله على يديه من الكرامات،"], [2103.0, "فاعلم أنها من جملة الأحوال الشيطانيّة،"], [2106.6, "ومن المكر والمخادعة والاستدراج. والله أعلم."]], "tr": [[2073.0, "Aynı şekilde kendisine bir mükâşefe hâsıl olsa ve göremediği biri ona, abdest almak istediği suyun gasbedilmiş veya necis olduğunu söylese, onu bırakıp teyemmüm etmesi caiz değildir;"], [2087.0, "çünkü bu kapıyı açmak zahirle ameli iptal eder ve şeriatleri ortadan kaldırır."], [2092.1, "Velînin, Allah'ın elinde meydana getirdiği bir keramet sebebiyle emredilenlerden birini terk ettiğini veya yasaklardan birini işlediğini gördüğün zaman, bil ki bu şeytanî hâllerden, tuzak, aldatma ve istidrâctandır. Allah en iyisini bilir."]]}]}, {"ts": "35:10", "title": "6. Külliye: Hârikalar ne olursa olsun sahibini beşerlik ve kulluk mertebesinden yükseltmez", "paras": [{"reader": false, "ar": [[2110.0, "الكلّيّة السادسة: <b>كلُّ الخوارق مهما كانت لا ترفع صاحبَها عن مرتبة البشريّة والعبوديّة.<\/b> <span class=\"note\">(يكررها)<\/span> أُعيدها مرّةً ثالثة:"], [2135.0, "<b>كلُّ الخوارق مهما كانت لا ترفع صاحبَها عن مرتبة البشريّة والعبوديّة.<\/b>"]], "tr": [[2110.0, "6. külliye: <b>6. külliye: Âdeti aşan şeyler ne olursa olsun sahibini beşerlik ve kulluk mertebesinden yükseltmez.<\/b> (Tekrar ediyor.) Üçüncü kez tekrar ediyorum:"], [2135.5, "<b>Âdeti aşan şeyler ne olursa olsun sahibini beşerlik ve kulluk mertebesinden yükseltmez.<\/b>"]]}, {"reader": false, "ar": [[2141.0, "أقول وبالله التوفيق: اعلم ـ رحمنا الله وإيّاك ـ أنّ خرق العادة،"], [2147.8, "من كرامةٍ أو معجزة،"], [2150.0, "لا ترفع صاحبَها عن مقام البشريّة والعبوديّة أبدًا،"], [2154.0, "كما يفعله كثيرٌ من الصوفيّة،"], [2159.0, "وهم يحكون كثيرًا من الكرامات الباطلة التي أجراها الله عز وجل ـ زورًا وبهتانًا منهم على الله وشريعته ـ فيجعلونها سببًا لدعائهم من دون الله عز وجل،"], [2173.0, "أو الاستغاثة بهم من دون الله."]], "tr": [[2141.0, "Tevfik Allah'tandır, derim ki: Bil —Allah bize ve sana rahmet etsin— ki keramet olsun mucize olsun, âdetin aşılması sahibini asla beşerlik ve kulluk makamından yükseltmez;"], [2153.0, "sûfîlerin birçoğunun yaptığı gibi. Onlar, Allah Azze ve Celle'nin meydana getirdiğini (iddia ettikleri) pek çok bâtıl keramet hikâye ederler —Allah'a ve O'nun şeriatine karşı bir yalan ve iftira olarak— ve bunları, Allah Azze ve Celle'yi bırakıp onlara dua etmeye veya Allah'ı bırakıp onlardan medet istemeye sebep kılarlar."]]}, {"reader": false, "ar": [[2175.0, "فلا يجوز أن يُستغاث بأحدٍ ظهرت على يديه شيءٌ من هذه الكرامات؛"], [2180.0, "فكراماتُ الأولياء ليس فيها تجاوزٌ لحدود الشرع مهما كانت هذه الكرامة."], [2190.0, "فكلُّ خارقٍ أخرج العبدَ عن دائرة العبوديّة إلى دائرة الفخر والرياء والتسميع فإنها من باب الاستدراج؛"], [2201.0, "لأنّ هذه الخوارق إنما تحصل بمشيئة الله عز وجل،"], [2206.0, "ويترتّب عليها زيادةُ الإيمان به سبحانه وصدقُ التوكّل عليه."]], "tr": [[2175.0, "Elinde bu kerametlerden bir şey zuhur eden hiç kimseden medet istenmesi caiz değildir."], [2179.6, "Velîlerin kerametlerinde, keramet ne olursa olsun, şeriatin sınırlarını aşmak yoktur."], [2187.8, "Kulu kulluk dairesinden övünme, riya ve gösteriş (tesmî') dairesine çıkaran âdeti aşan her şey istidrâc kabîlindendir."], [2197.5, "Çünkü bu hârikalar ancak Allah Azze ve Celle'nin dilemesiyle meydana gelir ve onların neticesinde O'na —Sübhânehû— imanın artması ve O'na sadakatle tevekkül etmek meydana gelir."]]}, {"reader": false, "ar": [[2210.0, "فليست هي ولا المعجزاتُ قدرةً ذاتيّةً في النبيّ ولا الوليّ،"], [2215.0, "وليس ظهورُها بمحض إرادتهم أو رغبتهم،"], [2220.0, "وإنما هي من الله عز وجل."], [2222.0, "وهذه الكلّيّة تهدم جميعَ ما يقوله الصوفيّة مُسبِّبين دعاءهم لأوليائهم من دون الله عز وجل؛"], [2233.0, "فإذا أنكرتَ عليهم شيئًا ممّا يفعلونه عند قبور المعظَّمين من أوليائهم،"], [2240.0, "فإنهم يُبرّرون لك فعلَهم هذا بشيءٍ أجراه الله على يد هؤلاء الأولياء من الكرامات."]], "tr": [[2210.0, "Ne bunlar ne de mucizeler, peygamberde veya velîde bulunan zâtî bir kudret değildir;"], [2216.5, "ortaya çıkmaları da sadece onların iradesi veya arzusuyla değildir."], [2221.3, "Onlar ancak Allah Azze ve Celle'dendir."], [2225.0, "Bu külliye, sûfîlerin, Allah Azze ve Celle'yi bırakıp velîlerine dua etmelerine gerekçe göstererek söyledikleri her şeyi yıkar."], [2236.5, "Yücelttikleri velîlerinin kabirleri başında yaptıkları şeylerden birini onlara reddettiğinde, bu fiillerini sana, Allah'ın bu velîlerin elinde meydana getirdiği bir kerametle gerekçelendirirler."]]}, {"reader": false, "ar": [[2246.0, "فمهما بلغت الكراماتُ من العبد فإنه لا يزال عبدًا لله عز وجل،"], [2253.0, "لم يخرج عن بشريّته إلى دائرة الألوهيّة أو الربوبيّة،"], [2257.0, "ولم يخرج عن دائرة عبوديّته إلى انكشاف التكاليف عنه."]], "tr": [[2246.0, "Kerametler kulda hangi dereceye ulaşırsa ulaşsın, o yine Allah Azze ve Celle'nin kulu olmaya devam eder;"], [2254.8, "beşerliğinden ulûhiyyet veya rubûbiyyet dairesine çıkmamış, kulluk dairesinden de mükellefiyetlerin üzerinden kalkmasına çıkmamıştır."]]}]}, {"ts": "37:43", "title": "7. Külliye: Gayba dair bir şey kendisine arızî olarak keşfedilen herkes için bu bir kerametir", "paras": [{"reader": false, "ar": [[2263.0, "ومن الكلّيّات أيضًا ـ رحمك الله ـ:"], [2265.1, "<b>كلُّ من كُوشِف عَرَضًا بشيءٍ من الغيب فكرامة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2263.0, "Külliyelerden biri de şudur —Allah sana rahmet etsin—:"], [2264.8, "<b>7. külliye: Gayba dair bir şey kendisine arızî olarak keşfedilen herkes için (bu) bir kerametir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2274.0, "أقول: اعلم ـ رحمك الله تعالى ـ أنّ أنواع الكرامة عند أهل السنّة والجماعة تتلخّص في أمرين:"], [2296.0, "الأمرُ الأوّل: الكرامةُ بالمكاشفات،"], [2300.0, "سواءٌ أكانت مكاشفةً سمعيّةً فيسمع ما لا يسمع غيرُه،"], [2306.0, "أو كانت مكاشفةً بصريّةً فيرى ما لا يرى غيرُه،"], [2310.0, "أو يُقذف في قلبه شيءٌ من العلم الضروريّ الذي لا يجد بُدًّا من قبوله ولا يستطيع ردَّه."]], "tr": [[2274.0, "Derim ki: Bil —Allah Teâlâ sana rahmet etsin— ki Ehl-i Sünnet ve'l-Cemaat'e göre keramet türleri iki şeyde özetlenir."], [2297.7, "Birinci şey: Mükâşefelerle olan keramet."], [2302.0, "İster başkasının işitmediğini işittiği işitsel bir mükâşefe olsun, ister başkasının görmediğini gördüğü görsel bir mükâşefe olsun, ister kalbine, kabul etmekten başka çare bulamadığı ve reddetmeye gücü yetmediği zarurî bir ilim atılması olsun."]]}, {"reader": false, "ar": [[2318.0, "والقسمُ الثاني من الكرامات:"], [2321.1, "القدرةُ والتأثير، بأن يُمكَّن بسبب الكرامة ممّا لا يستطيعه غيرُه."], [2332.0, "وهذه الكلّيّة تتكلّم عن النوع الأوّل من الكرامات،"], [2337.0, "وهي الكرامةُ بالمكاشفة. فلم يُنكر أحدٌ من أهل السنّة والجماعة أنّ الاطّلاع على بعض الغيب قد يكون للوليّ،"], [2346.0, "وأنّ الإخبار عن بعض المغيّبات يمكن أن يقع لأحد العلماء والصالحين على وجه الكرامة،"], [2352.0, "ولم نقف على من ينفي ذلك من المتقدّمين."]], "tr": [[2318.0, "Kerametlerin ikinci kısmı: Kudret ve tesirdir;"], [2325.0, "yani keramet sebebiyle başkasının güç yetiremediği bir şeye muktedir kılınması."], [2333.2, "Bu külliye, kerametlerin birinci türünden, yani mükâşefe ile olan kerametten bahseder."], [2339.9, "Ehl-i Sünnet ve'l-Cemaat'ten hiç kimse, gaybın bir kısmına muttali olmanın velî için olabileceğini ve bazı gaybî şeyleri haber vermenin, âlimlerden ve sâlihlerden birinde keramet yoluyla vuku bulabileceğini inkâr etmemiştir."], [2353.0, "Mütekaddimînden bunu nefyeden birine de rastlamadık."]]}, {"reader": false, "ar": [[2356.0, "بل ما زالت ـ ولله الحمد والمنّة ـ كتبُ العقائد وأبوابُ الكرامات في مصنّفات العلماء تتناقل حكايةَ إخبار أبي بكرٍ الصدّيق وعمرَ بن الخطّاب رضي الله عنهما ببعض المغيّبات؛"], [2369.0, "كإخبار أبي بكرٍ بجنس الحمل الذي كان في بطن زوجته،"], [2373.7, "كما رواه مالكٌ في «الموطّأ»،"], [2376.0, "ونداءِ عمرَ بن الخطّاب لقائده ساريةَ ليتحصّن بالجبل ـ إن صحّ ذلك عنه ـ كما رواه الإمامُ اللالكائيّ،"], [2385.5, "وغيرها من الحوادث المشهورة."], [2388.0, "فلم يُنكر أحدٌ من أهل السنّة والجماعة ذلك أبدًا."]], "tr": [[2356.0, "Bilakis —hamd ve minnet Allah'adır— akîde kitapları ve âlimlerin eserlerindeki keramet babları, Ebû Bekir es-Sıddîk ile Ömer b."], [2364.3, "el-Hattâb'ın —Allah onlardan razı olsun— bazı gaybî şeyleri haber vermelerinin hikâyesini nakledip durmuştur."], [2369.5, "Mesela Mâlik'in \"el-Muvatta\"da rivayet ettiği üzere Ebû Bekir'in, hanımının karnındaki çocuğun cinsiyetini haber vermesi;"], [2375.1, "ve İmam el-Lâlekâî'nin rivayet ettiği üzere —eğer ondan sahih olarak sabitse— Ömer b."], [2381.8, "el-Hattâb'ın komutanı Sâriye'ye dağa sığınması için seslenmesi ve diğer meşhur hadiseler."], [2388.0, "Ehl-i Sünnet ve'l-Cemaat'ten hiç kimse bunu asla inkâr etmemiştir."]]}, {"reader": false, "ar": [[2392.0, "يقول الإمامُ ابنُ تيميّة رحمه الله تعالى:"], [2396.0, "«فإذا كان القلبُ معمورًا بالتقوى انجلت له الأمورُ وانكشفت، وكلّما قوي الإيمانُ في القلب قوي انكشافُ الأمور له، وعرف حقائقَها من بواطلها، وكلّما ضعف الإيمانُ ضعف الكشف». انتهى كلامه."]], "tr": [[2392.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle der:"], [2396.7, "\"Kalp takvâ ile mamur olduğunda işler ona açılır ve keşfolunur."], [2402.6, "Kalpte iman güçlendikçe işlerin ona keşfolunması da güçlenir ve onların hakikatlerini bâtıllarından ayırt eder."], [2410.0, "İman zayıfladıkça keşif de zayıflar.\" Sözü bitti."]]}]}, {"ts": "40:14", "title": "7. Külliye (devam): Mükâşefe türü kerametin suretleri ve bir işkâlin cevabı", "paras": [{"reader": false, "ar": [[2414.0, "وهذا النوع من الكرامات له صور:"], [2418.0, "فتارةً بأن يسمع العبدُ ما لا يسمعه غيرُه،"], [2422.0, "وتارةً بأن يرى ما لا يراه غيرُه يقظةً أو منامًا،"], [2427.0, "وتارةً بأن يعلم ما لا يعلمه غيرُه وحيًا وإلهامًا،"], [2432.0, "أو أن يُنزل الله عز وجل في قلبه علمًا ضروريًّا أو فِراسةً صادقة."], [2436.0, "بل إنّ أهل السنّة يجعلون صدقَ الرؤى ـ صدقَ الرؤى ـ من جملة ما يُكرم الله عز وجل به بعضَ المؤمنين."]], "tr": [[2414.0, "Kerametlerin bu türünün suretleri vardır:"], [2417.3, "Bazen kul başkasının işitmediğini işitir;"], [2420.0, "bazen başkasının görmediğini uyanıkken veya rüyada görür;"], [2424.0, "bazen başkasının bilmediğini vahiy (ilka) ve ilham yoluyla bilir;"], [2428.7, "ya da Allah Azze ve Celle onun kalbine zarurî bir ilim veya sâdık bir firaset indirir."], [2435.4, "Hatta Ehl-i Sünnet rüyaların sâdık olmasını —rüyaların sâdık olmasını— Allah Azze ve Celle'nin bazı müminlere ikram ettiği şeylerden sayar."]]}, {"reader": false, "ar": [[2445.0, "فسواءٌ سمّيناها كشفًا أو مشاهدةً أو مخاطبة،"], [2449.0, "أو قسّمناها على أنواعها:"], [2455.0, "فالسماعُ يُقال له مخاطبات،"], [2457.0, "والرؤيةُ يُقال لها مشاهدات،"], [2460.0, "والعلمُ يُقال له مكاشفة."]], "tr": [[2445.0, "İster onu keşif, müşâhede veya muhâtaba diye adlandıralım, ister türlerine göre taksim edelim:"], [2456.5, "İşitmeye muhâtabât, görmeye müşâhedât, bilmeye ise mükâşefe denir."]]}, {"reader": false, "ar": [[2462.0, "ولكن هنا إشكالٌ على هذه الكلّيّة لا بدّ من الإجابة عنه،"], [2468.0, "وهي أننا إذا قرّرنا أنّ من الكرامات أن يعلم بعضُ الأولياء شيئًا من الغيب،"], [2474.0, "فما الفرقُ بينه وبين النبيّ في هذه الحالة؟"], [2481.0, "فإنّ الأنبياء قد أطلعهم الله عز وجل على شيءٍ من الغيب،"], [2485.0, "فإذا قلنا بأنّ الأولياء قد يُطلعهم الله عز وجل أيضًا على شيءٍ من الغيب،"], [2491.0, "فقد يكون هنا إشكالٌ في هذه الكلّيّة."]], "tr": [[2462.0, "Fakat burada bu külliyeye yöneltilen ve cevaplanması gereken bir işkâl (problem) var:"], [2468.9, "Kerametlerden birinin bazı velîlerin gaybdan bir şey bilmesi olduğunu takrir edersek, bu durumda onunla peygamber arasındaki fark nedir?"], [2481.0, "Çünkü peygamberleri Allah Azze ve Celle gaybdan bir şeye muttali kılmıştır."], [2485.4, "Velîleri de Allah Azze ve Celle'nin gaybdan bir şeye muttali kılabileceğini söylersek, burada bu külliyede bir işkâl olabilir."]]}, {"reader": false, "ar": [[2498.0, "فأقول وبالله التوفيق: لا،"], [2501.0, "ليس هناك إشكالٌ في ذلك أبدًا ولله الحمد؛"], [2505.0, "وذلك لوجوب التفريق بين الأمر الدائم والعارض،"], [2510.0, "ولذلك قلتُ في الكلّيّة:"], [2513.2, "«عَرَضًا». فمن يدّعي من الأولياء أنه قد كُشف له الغيبُ كلُّه،"], [2520.0, "وأنه يستطيع أن يطّلع على ما في اللوح المحفوظ متى ما شاء أن يطّلع عليه،"], [2525.0, "فإنّ هذا كافرٌ باتّفاق أهل السنّة والجماعة."]], "tr": [[2498.0, "Tevfik Allah'tandır, derim ki: Hayır, bunda asla bir işkâl yoktur, hamd Allah'adır."], [2505.0, "Çünkü daimî olan iş ile arızî olan arasında ayrım yapmak gerekir;"], [2514.0, "bu yüzden külliyede \"arızî olarak\" dedim."], [2518.2, "Velîlerden kim gaybın tamamının kendisine keşfedildiğini ve Levh-i Mahfûz'da olana dilediği zaman muttali olabileceğini iddia ederse, bu kişi Ehl-i Sünnet ve'l-Cemaat'in ittifakıyla kâfirdir."]]}, {"reader": false, "ar": [[2529.0, "فالغيبُ الذي تُقرّره هذه الكلّيّة ليس هو الغيبَ الدائم كحالة الأنبياء؛"], [2536.0, "فإنّ الأنبياء يُطلعهم الله عز وجل على غيوبٍ كثيرةٍ على وجه الديمومة،"], [2541.0, "إذا شاء الله عز وجل أن يكشف شيئًا من الغيب لهم."], [2546.0, "وأمّا الأولياء فإنه قد يَعرِض للواحد منهم في عمره مرّةً أو مرّتين أو أقلّ أو أكثر،"], [2553.0, "لا على وجه الديمومة أبدًا."]], "tr": [[2529.0, "Bu külliyenin takrir ettiği gayb, peygamberlerin hâlinde olduğu gibi daimî gayb değildir."], [2536.4, "Çünkü Allah Azze ve Celle, gaybdan bir şeyi onlara keşfetmeyi dilediğinde, peygamberleri devamlılık yoluyla pek çok gayba muttali kılar."], [2545.1, "Velîlere gelince, onlardan birine ömründe bir veya iki kez, ya da daha az veya daha çok arız olabilir; asla devamlılık yoluyla değil."]]}, {"reader": false, "ar": [[2556.0, "ثم أضِف إلى هذا أنّ الغيب الذي يُخبر به النبيُّ واجبُ التصديق،"], [2562.0, "ويكفر من كذّب النبيَّ في شيءٍ من الأخبار الغيبيّة الثابتة بالتواتر."], [2569.0, "وأمّا الوليُّ إذا أخبرنا بشيءٍ من الغيب فإنه ليس بواجب ـ فإنه ليس تصديقُه بواجب ـ."],
