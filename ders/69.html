<script>
const D={"no": 69, "vid": "GYJAZN66gK8", "title_ar": "الدرس (٦٩) من شرح كليات العقيدة — كليات في باب الصفات: تنزيه الله عن النقص المحض، والاسم الكلي المطلق، وزيادة الصفة على الذات، والأفعال الاختيارية، وإثبات الصفات بخبر الآحاد", "title_tr": "Şerhu Külliyyâti'l-Akîde — 69. Ders: Sıfatlar Babının Külliyeleri (Kemal İçermeyen Noksanlıktan Tenzih, Mutlak Küllî İsimde Ortaklık, Sıfatın Zâta Zâit Bir Mana İfade Etmesi, İhtiyârî Fiilleri Nefyedenin Bid'at Ehlinden Oluşu, Âhâd Haberle Sabit Olan Sıfatın İsbatı)", "sections": [{"ts": "00:00", "title": "Giriş · 1. Külliye: Mahlûkta bulunan, hiçbir kemal içermeyen her noksanlıktan Allah tenzih edilmeye daha lâyıktır", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [1.8, "والصلاةُ والسلامُ على رسول الله الأمين،"], [4.5, "وعلى آله وأصحابه ومن تبعهم بإحسانٍ إلى يوم الدين."], [8.6, "أمّا بعد: فلا نزال ـ ولله الحمد ـ في سياق جُمَلٍ من الكلّيّات المتعلِّقة بباب الصفات عند أهل السنة والجماعة،"], [16.8, "وعندنا في هذا الدرس جُمَلٌ من الكلّيّات."], [20.0, "الكلّيّة الأولى: <b>كلُّ نقصٍ في المخلوق لا كمالَ فيه فاللهُ أحقُّ بالتنزيه عنه.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.4, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [8.6, "Bundan sonra: Hamd Allah'a, hâlâ Ehl-i Sünnet ve'l-Cemaat nezdinde sıfatlar babıyla ilgili birtakım külliyeler bağlamındayız."], [16.4, "Bu derste elimizde birtakım külliyeler var."], [20.0, "<b>1. külliye: Mahlûkta bulunan ve içinde hiçbir kemal olmayan her noksanlıktan Allah tenzih edilmeye daha lâyıktır.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[38.0, "أقول وبالله تعالى التوفيق:"], [41.0, "وهذه هي الكلّيّة الثانية ممّا تدخل تحت القياس الأَوْلَويّ."], [46.0, "وقد قلتُ لكم سابقًا بأنّ الأقيسة ثلاثةُ أقسام:"], [52.0, "قياسُ تمثيل، وهو القياس الذي يستعمله الأصوليّون،"], [57.0, "وأجمعنا وإيّاكم على أنه لا يجوز استعمالُه في حقّ الله عز وجل؛"], [64.0, "لأنّ الله <span class=\"ayah\">﴿لَيْسَ كَمِثْلِهِ شَيْءٌ ۖ وَهُوَ السَّمِيعُ الْبَصِيرُ﴾<\/span> <span class=\"ref\">[الشورى: ١١]<\/span>."], [67.0, "النوع الثاني: قياسُ الشمول،"], [69.8, "وهو القياس الذي تستوي فيه أفرادُه،"], [74.0, "وهو القياس الذي يستعمله المناطقةُ والفلاسفة،"], [78.0, "وهذا مبنيٌّ على استواء المقدّمتين؛"], [82.0, "والله عز وجل لا يُساويه ـ لا في ذاته ولا في صفاته ولا في أفعاله عز وجل ـ شيءٌ من المخلوقات حتى نُدخله في هذا القياس."], [95.0, "ولم يبقَ عندنا إلا القياسُ الثالث،"], [98.3, "وهو القياس الأَوْلَويّ. والقياس الأولويّ له كلّيّتان:"], [104.0, "كلّيّةٌ في الكمال الذي لا نقصَ فيه،"], [107.0, "وكلّيّةٌ في النقص الذي لا كمالَ فيه."], [112.0, "والكلّيّة التي معنا هي الكلّيّة الثانية التي تتخرّج على القياس الأولويّ. لعلّكم استوعبتم هذا."]], "tr": [[38.0, "Tevfik Allah Teâlâ'dandır, derim ki:"], [41.0, "Bu, kıyas-ı evlevî (evleviyet kıyası) altına giren külliyelerin ikincisidir."], [46.0, "Daha önce size kıyasların üç kısım olduğunu söylemiştim:"], [52.0, "(Birincisi) temsil kıyası; usûlcülerin kullandığı kıyastır."], [55.6, "Sizinle birlikte, onu Allah Azze ve Celle hakkında kullanmanın caiz olmadığı üzerinde ittifak ettik;"], [64.0, "çünkü Allah <span class=\"ayah\">﴿O'nun benzeri hiçbir şey yoktur; O işitendir, görendir﴾<\/span> [Şûrâ 11]."], [67.0, "İkinci tür: Şümul kıyası; fertlerinin eşit olduğu kıyastır."], [72.6, "Mantıkçıların ve filozofların kullandığı kıyas budur ve iki öncülün eşitliği üzerine kuruludur."], [82.0, "Allah Azze ve Celle'ye ise ne zâtında ne sıfatlarında ne de fiillerinde mahlûkattan hiçbir şey eşit değildir ki O'nu bu kıyasa dahil edelim."], [95.0, "Geriye bizde sadece üçüncü kıyas kaldı;"], [97.8, "o da kıyas-ı evlevîdir. Kıyas-ı evlevînin iki külliyesi vardır:"], [104.0, "Hiçbir noksanlık içermeyen kemal hakkında bir külliye ve hiçbir kemal içermeyen noksanlık hakkında bir külliye."], [112.0, "Elimizdeki külliye, kıyas-ı evlevî üzerine bina edilen ikinci külliyedir. Umarım bunu kavradınız."]]}, {"reader": false, "ar": [[121.0, "فأيُّ شيءٍ يُنزَّه عنه المخلوقُ من صفات النقص التي لا كمالَ فيها،"], [128.0, "فالله عز وجل أحقُّ وأولى بالتنزيه عنه؛"], [132.0, "فإنه لا يمكن أبدًا أن يُنزَّه المخلوقُ عن صفة النقص ثم نصفَ اللهَ عز وجل بها."], [139.0, "لكنّ هذا مشروطٌ بأن يكون نقصًا لا كمالَ فيه بوجهٍ من الأوجه."], [146.0, "وبناءً على ذلك: فالموتُ صفةُ نقصٍ في المخلوق لا كمالَ فيها،"], [152.0, "فالله أحقُّ أن يُنزَّه عن هذا،"], [154.0, "كما قال الله عز وجل:"], [156.3, "<span class=\"ayah\">﴿وَتَوَكَّلْ عَلَى الْحَيِّ الَّذِي لَا يَمُوتُ﴾<\/span> <span class=\"ref\">[الفرقان: ٥٨]<\/span>،"], [159.0, "وقال النبيّ صلى الله عليه وسلم:"], [162.0, "«أنت الحيُّ الذي لا يموت، والجنُّ والإنسُ يموتون» <span class=\"note\">(Buhârî, Müslim)<\/span>،"], [167.0, "وقال الله عز وجل:"], [169.2, "<span class=\"ayah\">﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>."]], "tr": [[121.0, "Mahlûkun tenzih edildiği, hiçbir kemal içermeyen noksanlık sıfatlarından herhangi biri, Allah Azze ve Celle'nin ondan tenzih edilmeye daha lâyık ve daha evlâ olduğu bir şeydir."], [132.0, "Çünkü mahlûkun bir noksanlık sıfatından tenzih edilip sonra Allah Azze ve Celle'yi onunla vasıflandırmamız asla mümkün değildir."], [139.0, "Fakat bu, hiçbir yönden kemal içermeyen bir noksanlık olması şartına bağlıdır."], [147.6, "Buna binaen: Ölüm, mahlûkta hiçbir kemal içermeyen bir noksanlık sıfatıdır;"], [151.5, "dolayısıyla Allah bundan tenzih edilmeye daha lâyıktır."], [153.7, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [156.3, "<span class=\"ayah\">﴿Ölümsüz, diri olana tevekkül et﴾<\/span> [Furkân 58]."], [158.5, "Peygamber sallallâhu aleyhi ve sellem de şöyle buyurmuştur:"], [162.0, "\"Sen ölmeyen Hayy'sın; cinler ve insanlar ise ölürler.\" Allah Azze ve Celle de şöyle buyurmuştur:"], [169.2, "<span class=\"ayah\">﴿Allah, O'ndan başka ilah yoktur; Hayy'dır, Kayyûm'dur﴾<\/span> [Bakara 255]."]]}, {"reader": false, "ar": [[173.0, "ونقول كذلك: الظلمُ صفةُ نقصٍ في المخلوق لا كمالَ فيها،"], [181.0, "فالله عز وجل أحقُّ أن يُنزَّه عنها،"], [184.0, "كما قال الله عز وجل:"], [186.8, "<span class=\"ayah\">﴿وَمَا رَبُّكَ بِظَلَّامٍ لِّلْعَبِيدِ﴾<\/span> <span class=\"ref\">[فصلت: ٤٦]<\/span>،"], [189.0, "<span class=\"ayah\">﴿وَلَا يَظْلِمُ رَبُّكَ أَحَدًا﴾<\/span> <span class=\"ref\">[الكهف: ٤٩]<\/span>،"], [191.9, "<span class=\"ayah\">﴿وَمَا أَنَا بِظَلَّامٍ لِّلْعَبِيدِ﴾<\/span> <span class=\"ref\">[ق: ٢٩]<\/span>."], [195.0, "وقال النبيّ صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل أنه قال:"], [201.5, "«يا عبادي، إنّي حرّمتُ الظلمَ على نفسي، وجعلتُه بينكم محرَّمًا، فلا تظالموا» <span class=\"note\">(Müslim)<\/span>."]], "tr": [[173.0, "Aynı şekilde deriz ki: Zulüm, mahlûkta hiçbir kemal içermeyen bir noksanlık sıfatıdır;"], [179.3, "dolayısıyla Allah Azze ve Celle ondan tenzih edilmeye daha lâyıktır."], [183.6, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [186.8, "<span class=\"ayah\">﴿Rabbin kullara zulmedici değildir﴾<\/span> [Fussılet 46], <span class=\"ayah\">﴿Rabbin hiç kimseye zulmetmez﴾<\/span> [Kehf 49], <span class=\"ayah\">﴿Ben kullara zulmedici değilim﴾<\/span> [Kâf 29]."], [195.0, "Peygamber sallallâhu aleyhi ve sellem de Rabbi Azze ve Celle'den rivayet ettiği (kudsî hadiste) O'nun şöyle buyurduğunu bildirmiştir:"], [201.5, "\"Ey kullarım! Ben zulmü kendime haram kıldım ve onu aranızda da haram kıldım; o hâlde birbirinize zulmetmeyin.\""]]}, {"reader": false, "ar": [[207.0, "فإذا قيل لك: هل يُوصَف اللهُ بالظلم؟"], [211.4, "فقل: لا يجوز وصفُ الله بالظلم،"], [215.1, "للدليل الأثريّ والنظريّ. فأمّا الأثريّ:"], [218.3, "فالآياتُ التي تنفي عن الله عز وجل صفةَ الظلم."], [224.0, "وأمّا النظريّ: فلهذه الكلّيّة؛"], [226.6, "لأنّ صفة الظلم من الصفات التي يُنزَّه عنها المخلوق،"], [232.4, "فالله عز وجل أحقُّ أن يُنزَّه عنها."]], "tr": [[207.0, "Sana \"Allah zulümle vasıflandırılır mı?\" denirse, de ki:"], [211.4, "Allah'ı zulümle vasıflandırmak, eserî (naklî) ve nazarî (aklî) delil sebebiyle caiz değildir."], [217.6, "Eserî delil: Allah Azze ve Celle'den zulüm sıfatını nefyeden ayetlerdir."], [224.0, "Nazarî delil ise bu külliyedir;"], [226.6, "çünkü zulüm sıfatı mahlûkun tenzih edildiği sıfatlardandır, dolayısıyla Allah Azze ve Celle ondan tenzih edilmeye daha lâyıktır."]]}, {"reader": false, "ar": [[237.0, "ومنها كذلك صفةُ الغدر؛"], [239.3, "فإنها من الصفات التي يُنزَّه عنها المخلوق ولا كمالَ فيها،"], [245.0, "فالله عز وجل أحقُّ أن يُنزَّه عنه."], [249.0, "ومن ذلك أيضًا صفاتُ إخلاف الوعد ـ صفاتُ إخلاف الوعد ـ صفةُ إخلاف الوعد؛"], [260.0, "فإنها من النقص في المخلوق الذي يُنزَّه عنه،"], [265.0, "فالله عز وجل أحقُّ أن يُنزَّه عنها."], [267.0, "ومنها كذلك صفةُ العجز والإعياء واللُّغوب ـ أي ضعفِ القدرة ـ فإنها من صفات النقص في المخلوق ممّا لا كمالَ فيه،"], [281.0, "فالله عز وجل أحقُّ أن يُنزَّه عنه."], [286.0, "وهكذا دواليك في كلّ نقصٍ في المخلوق،"], [288.1, "حتى لا نُطيل: فجميعُ صفات النقص التي يُنزَّه عنها المخلوقُ ممّا لا كمالَ فيه،"], [295.0, "فالله عز وجل أحقُّ أن يُنزَّه عنه."]], "tr": [[237.0, "Bunlardan biri de gadr (ahde vefasızlık, hainlik) sıfatıdır."], [239.3, "Bu, mahlûkun tenzih edildiği ve hiçbir kemal içermeyen sıfatlardandır;"], [243.9, "dolayısıyla Allah Azze ve Celle ondan tenzih edilmeye daha lâyıktır."], [249.0, "Bunlardan biri de vaadden dönme sıfatlarıdır —vaadden dönme sıfatları— vaadden dönme sıfatı."], [260.0, "Bu, mahlûkta bulunan ve (mahlûkun) tenzih edildiği bir noksanlıktır;"], [264.4, "dolayısıyla Allah Azze ve Celle ondan tenzih edilmeye daha lâyıktır."], [267.0, "Bunlardan biri de acz, bitkinlik ve yorgunluk (luğûb) sıfatıdır —yani kudretin zayıflığı—."], [276.5, "Bu, mahlûkta bulunan ve hiçbir kemal içermeyen noksanlık sıfatlarındandır;"], [280.0, "dolayısıyla Allah Azze ve Celle ondan tenzih edilmeye daha lâyıktır."], [286.0, "Sözü uzatmayalım; mahlûktaki her noksanlıkta durum böyledir:"], [289.0, "Mahlûkun tenzih edildiği, hiçbir kemal içermeyen bütün noksanlık sıfatlarından Allah Azze ve Celle tenzih edilmeye daha lâyıktır."]]}]}, {"ts": "05:00", "title": "1. Külliye (devam): Uyku ve çocuk sahibi olmanın bu külliyenin dışında kalması", "paras": [{"reader": false, "ar": [[300.0, "ويخرج من ذلك صفةُ النوم؛"], [302.0, "فإنّ النوم نقصٌ في المخلوق،"], [305.7, "أليس كذلك؟ ولكن هو كمالٌ من جهةٍ أخرى؛"], [311.0, "فإنّ المخلوق الذي ينام أكملُ من المخلوق الذي لا ينام."], [315.0, "والمخلوق الذي ينام لا يحتاج إلى مراجعة الطبيب،"], [319.0, "ولكنّ المخلوق الذي لا ينام يحتاج إلى مراجعة الطبيب."], [325.0, "فالنومُ كمالٌ فيه نقص،"], [327.5, "أو نقصٌ فيه كمال،"], [330.0, "ولذلك لا ينبغي أن يُخرَّج على كلّيّتنا هذه."], [334.0, "ولذلك فقد نفى الله عز وجل عن نفسه السِّنةَ والنوم في قوله عز وجل:"], [341.3, "<span class=\"ayah\">﴿لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ﴾<\/span> <span class=\"ref\">[البقرة: ٢٥٥]<\/span>."], [343.0, "وفي «صحيح الإمام مسلم» من حديث أبي موسى الأشعريّ رضي الله عنه قال:"], [349.4, "قام فينا رسولُ الله صلى الله عليه وسلم بخمس كلمات:"], [353.0, "«إنّ الله لا ينام، ولا ينبغي له أن ينام…» الحديثَ بتمامه."]], "tr": [[300.0, "Uyku sıfatı bunun dışında kalır."], [302.0, "Çünkü uyku mahlûkta bir noksanlıktır, değil mi?"], [308.0, "Fakat başka bir yönden kemaldir."], [311.0, "Zira uyuyan mahlûk, uyumayan mahlûktan daha mükemmeldir."], [313.0, "Uyuyan mahlûkun doktora gitmesine gerek yoktur;"], [315.0, "fakat uyumayan mahlûkun doktora gitmesi gerekir."], [317.5, "Uyku, içinde noksanlık bulunan bir kemal ya da içinde kemal bulunan bir noksanlıktır;"], [325.0, "bu yüzden bu külliyemiz üzerine bina edilmemelidir."], [329.4, "Bu sebeple Allah Azze ve Celle, <span class=\"ayah\">﴿O'nu ne bir uyuklama tutar ne de bir uyku﴾<\/span> [Bakara 255] sözünde uyuklamayı ve uykuyu kendisinden nefyetmiştir."], [341.3, "İmam Müslim'in \"Sahîh\"inde Ebû Mûsâ el-Eş'arî'nin —Allah ondan razı olsun— hadisinde şöyle der:"], [349.4, "Resûlullah sallallâhu aleyhi ve sellem aramızda kalkıp beş kelime söyledi:"], [353.0, "\"Şüphesiz Allah uyumaz; uyumak O'na yakışmaz…\" Hadisin tamamı."]]}, {"reader": false, "ar": [[360.0, "ومنها كذلك صفةُ الولادة؛"], [364.0, "فإنّ الولادة نقصٌ في المخلوق لحاجته لمن يسعى معه في أمور دينه ودنياه،"], [372.0, "ولكنها كمالٌ من جهةٍ أخرى."], [377.0, "فإذن هي ليست نقصًا محضًا،"], [380.0, "وإنما هي نقصٌ مَشُوبٌ بكمال."], [383.0, "ولذلك المخلوقُ الذي يُولَد له أكملُ من المخلوق الذي لا يُولَد له،"], [389.0, "بل إنّ الفقهاء جعلوا من جملة العيوب التي تُجيز الفسخَ أن يكون أحدُ الزوجين عقيمًا ـ بالنسبة للزوج ـ أو عاقرًا ـ بالنسبة للمرأة."], [405.0, "فبما أنه من جملة العيوب فلا يدخل معنا في هذه القاعدة."], [410.0, "ولذلك نفاه الله عز وجل عن نفسه في كتابه في قوله:"], [415.1, "<span class=\"ayah\">﴿لَمْ يَلِدْ وَلَمْ يُولَدْ﴾<\/span> <span class=\"ref\">[الإخلاص: ٣]<\/span>،"], [417.0, "وقال الله عز وجل:"], [418.8, "<span class=\"ayah\">﴿مَا اتَّخَذَ صَاحِبَةً وَلَا وَلَدًا﴾<\/span> <span class=\"ref\">[الجن: ٣]<\/span>."], [421.0, "والقاعدةُ والكلّيّة بذلك واضحةٌ، ولله الحمد."]], "tr": [[360.0, "Bunlardan biri de çocuk sahibi olma (velâdet) sıfatıdır."], [364.0, "Çocuk sahibi olmak mahlûkta bir noksanlıktır;"], [367.7, "çünkü mahlûk, din ve dünya işlerinde kendisiyle birlikte çalışacak birine muhtaçtır."], [377.0, "Fakat başka bir yönden kemaldir."], [383.0, "Öyleyse bu salt bir noksanlık değil, kemalle karışık bir noksanlıktır."], [387.0, "Bu yüzden çocuğu olan mahlûk, çocuğu olmayan mahlûktan daha mükemmeldir."], [391.0, "Hatta fakihler, nikâhın feshini caiz kılan kusurlar arasında eşlerden birinin kısır olmasını —erkek için \"akîm\", kadın için \"âkır\"— saymışlardır."], [405.0, "Madem ki (çocuğun olmaması) kusurlar arasındadır, (çocuk sahibi olmak) bizim bu kaidemize girmez."], [410.0, "Bu sebeple Allah Azze ve Celle onu Kitabında, <span class=\"ayah\">﴿Doğurmamış ve doğurulmamıştır﴾<\/span> [İhlâs 3] sözünde kendisinden nefyetmiştir."], [415.1, "Allah Azze ve Celle şöyle de buyurmuştur:"], [418.8, "<span class=\"ayah\">﴿O ne bir eş ne de bir çocuk edinmiştir﴾<\/span> [Cin 3]."], [421.0, "Kaide ve külliye bununla açıktır; hamd Allah'adır."]]}]}, {"ts": "07:05", "title": "2. Külliye: Mutlak küllî bir isimde ortak olan her iki şey, izafe, takyid ve tahsisten sonra birbirinden ayrılır", "paras": [{"reader": false, "ar": [[425.0, "ومن الكلّيّات أيضًا: <b>كلُّ متّفقَين في اسمٍ كلّيٍّ فيفترقان بعد الإضافة والتقييد والتخصيص.<\/b> <b>كلُّ متّفقَين في اسمٍ كلّيٍّ مطلقٍ فيفترقان بعد الإضافة والتقييد والتخصيص.<\/b> وأُعيدها مرّةً ثالثة:"], [453.1, "<b>كلُّ متّفقَين في اسمٍ كلّيٍّ مطلقٍ فيفترقان بعد الإضافة والتقييد والتخصيص.<\/b>"]], "tr": [[425.0, "Külliyelerden biri de şudur: 2."], [427.0, "külliye: Küllî bir isimde ortak olan her iki şey, izafe, takyid ve tahsisten sonra birbirinden ayrılır.<b> <\/b>2."], [439.0, "külliye: Mutlak küllî bir isimde ortak olan her iki şey, izafe, takyid ve tahsisten sonra birbirinden ayrılır. Üçüncü kez tekrar ediyorum:"], [453.1, "<b>2. külliye: Mutlak küllî bir isimde ortak olan her iki şey, izafe, takyid ve tahsisten sonra birbirinden ayrılır.<\/b>"]]}, {"reader": false, "ar": [[466.0, "أقول وبالله تعالى التوفيق:"], [468.8, "وهذا من جملة الأصول السُّنّيّة السلفيّة المتّفق عليها بين أهل السنة والجماعة،"], [477.0, "والتي قرّرها أبو العبّاس ابن تيمية رحمه الله تعالى وغيرُه في كثيرٍ من كتبه،"], [486.6, "لا سيّما في «التدمريّة»."], [489.0, "وذلك أنه ما من موجودَين إلا ولا بدّ أن يكون بينهما نوعُ اتّفاقٍ في الاسم الكلّيّ المطلق."], [497.0, "فإن قلتَ: وما تقصد بقولك:"], [500.6, "الاسم الكلّيّ المطلق؟ فأقول:"], [505.8, "هو الاسم بلا إضافة؛"], [510.0, "كقولك: «وجود» من غير أن تُضيفه إلى وجود الخالق أو وجود المخلوق،"], [520.0, "وكقولك: «علوّ» من غير أن تُضيفه إلى علوّ الخالق أو إلى علوّ المخلوق،"], [529.0, "وكقولك: «سمع» من غير أن تُضيفه لا إلى خالقٍ ولا إلى مخلوق."], [537.0, "فالاسمُ الكلّيّ المطلق هو الاسم بلا إضافةٍ ولا تقييدٍ ولا تخصيص."]], "tr": [[466.0, "Tevfik Allah Teâlâ'dandır, derim ki:"], [468.8, "Bu, Ehl-i Sünnet ve'l-Cemaat arasında üzerinde ittifak edilen sünnî-selefî asıllardandır."], [476.5, "Ebü'l-Abbâs İbn Teymiyye —Allah ona rahmet etsin— ve başkaları bunu kitaplarının çoğunda, bilhassa \"et-Tedmüriyye\"de takrir etmiştir."], [489.0, "Şöyle ki: Var olan her iki şey arasında mutlaka mutlak küllî isimde bir tür ortaklık bulunur."], [497.0, "\"Mutlak küllî isim sözünle neyi kastediyorsun?\" dersen, derim ki:"], [505.0, "İzafesiz isimdir. Meselâ \"varlık\" demen;"], [510.0, "onu ne Yaratıcı'nın varlığına ne de mahlûkun varlığına izafe etmeden."], [520.7, "\"Uluvv (yücelik)\" demen; onu ne Yaratıcı'nın uluvvüne ne de mahlûkun uluvvüne izafe etmeden."], [529.7, "\"İşitme\" demen; onu ne bir yaratıcıya ne de bir mahlûka izafe etmeden."], [537.0, "Mutlak küllî isim; izafesiz, takyidsiz ve tahsissiz isimdir."]]}, {"reader": false, "ar": [[546.0, "فإن قلتَ: وهل لهذا الاسم وجود؟"], [550.0, "فأقول: له وجودٌ في الأذهان،"], [554.0, "ولكن لا وجودَ له في الأعيان؛"], [558.0, "فليس في الأعيان شيءٌ مطلق،"], [563.0, "وإنما الموجود في الأعيان ـ أي فيما تُبصره العين ـ هو الشيءُ المقيَّد."], [572.0, "فلا أرى وجهًا مطلقًا عن صاحبه،"], [576.0, "ولا أرى يدًا مطلقةً عن الموصوف ـ عن الموصوفة به،"], [580.0, "ولا أرى سمعًا مطلقًا عن السامع،"], [584.0, "ولا بصرًا مطلقًا عن المُبصِر."], [587.0, "وإنما يرجع وجودُه إلى وجودٍ في الأذهان،"], [594.0, "ولكن يمتنع تحقُّقُه في الأعيان."]], "tr": [[546.0, "\"Bu ismin bir varlığı var mı?\" dersen, derim ki:"], [550.0, "Onun zihinlerde bir varlığı vardır, fakat dış âlemde (a'yânda) bir varlığı yoktur."], [558.0, "Dış âlemde mutlak hiçbir şey yoktur;"], [563.9, "dış âlemde —yani gözün gördüğü şeylerde— var olan, mukayyed şeydir."], [572.0, "Sahibinden mutlak (bağımsız) bir yüz görmem;"], [576.6, "onunla vasıflanandan mutlak bir el görmem;"], [579.4, "işitenden mutlak bir işitme, görenden mutlak bir görme görmem."], [587.0, "Onun varlığı ancak zihinlerdeki bir varlığa döner;"], [594.0, "dış âlemde gerçekleşmesi ise imkânsızdır."]]}]}, {"ts": "09:59", "title": "2. Külliye (devam): Küllî ismin zihinde bulunmasının hikmeti", "paras": [{"reader": false, "ar": [[599.0, "فإن قلتَ: ولماذا فُرِض وجودُه في الذهن؟"], [603.0, "فأقول: هذا من حكمة الله عز وجل،"], [606.5, "حتى نتعرّف عليه، وحتى تشتاق نفوسُنا إليه وإلى موعوده في الآخرة."], [616.0, "فإنه لو خاطبنا في الأمر الغيبيّ بأمرٍ ليس له اسمٌ كلّيٌّ يتصوّره الذهنُ تصوُّرَ معنًى،"], [627.0, "فإنّ النفوس ستكون جاهلةً بهذا الأمر الغيبيّ."], [632.0, "فلو أننا لا نتصوّر في أذهاننا معنى السمع لَما عرفنا معنى سمع الله عز وجل،"], [639.0, "ولو أنّ أذهاننا لم تتصوّر نعيمَ اللبن في الدنيا لَما اشتاقت نفوسُنا إلى اللبن في الجنة."], [649.0, "ولذلك من حكمة الله عز وجل أن خاطبنا في الأمور الغيبيّة بأمورٍ متقرِّرةٍ في أذهاننا،"], [657.0, "حتى يكون ذلك أدعى إلى عملنا لنيل هذا الأمر الغيبيّ."]], "tr": [[599.0, "\"Peki onun varlığı zihinde niçin takdir edilmiştir?\" dersen, derim ki:"], [603.0, "Bu, Allah Azze ve Celle'nin hikmetindendir;"], [606.0, "ta ki O'nu tanıyalım, nefislerimiz O'na ve O'nun âhiretteki vaadine özlem duysun."], [616.0, "Eğer bize gaybî bir hususta, zihnin manasını tasavvur edebileceği küllî bir ismi olmayan bir şeyle hitap etseydi, nefisler bu gaybî hususu bilmezdi."], [632.0, "Zihinlerimizde işitmenin manasını tasavvur etmeseydik, Allah Azze ve Celle'nin işitmesinin manasını bilemezdik."], [639.7, "Zihinlerimiz dünyadaki süt nimetini tasavvur etmeseydi, nefislerimiz cennetteki süte özlem duymazdı."], [649.0, "Bu yüzden Allah Azze ve Celle'nin hikmetindendir ki bize gaybî hususlarda zihinlerimizde yerleşik olan şeylerle hitap etmiştir;"], [655.9, "ta ki bu, o gaybî şeye ulaşmak için amel etmemize daha çok sevk etsin."]]}, {"reader": false, "ar": [[664.0, "فلو أنّ الله عز وجل خاطبنا بأسماءٍ ليس لها موجودٌ في الواقع،"], [672.0, "أو بصفاتٍ ليس لها معنًى ممّا يُدركه الذهن في الواقع،"], [678.0, "لَبقينا جُهّالًا بالله عز وجل،"], [680.2, "ولانقطع طريقُ التعرّف عليه."], [684.0, "ولو أنّ الله عز وجل سمّى نعيمَ الجنة بأسماءٍ غيرِ معهودةٍ لنا من أسماء النعيم في الدنيا،"], [693.0, "لَما اشتاقت نفوسُنا إلى هذا النعيم."], [697.0, "فلو أنّ الشارع قال لنا:"], [700.5, "إنّ من عمل منكم الصالحات فله في الجنة كذا وكذا وكذا ـ من الأسماء التي ليس لها معهودٌ في الذهن،"], [713.0, "وليس لها معنًى متقرِّرٌ في اللسان العربيّ ـ لَما طمعت نفوسُنا في هذا النعيم المجهول."]], "tr": [[664.0, "Allah Azze ve Celle bize vâkıada karşılığı olmayan isimlerle veya zihnin vâkıada idrak ettiği bir manası olmayan sıfatlarla hitap etseydi, Allah Azze ve Celle'yi bilmeyen cahiller olarak kalırdık ve O'nu tanıma yolu kesilirdi."], [685.5, "Allah Azze ve Celle cennet nimetini, dünyadaki nimet isimlerinden bize tanıdık gelmeyen isimlerle adlandırsaydı, nefislerimiz bu nimete özlem duymazdı."], [697.0, "Şâri' bize \"Sizden salih ameller işleyene cennette şu şu şu vardır\" deseydi —zihinde tanıdık bir karşılığı olmayan ve Arap dilinde yerleşik bir manası bulunmayan isimlerle— nefislerimiz bu meçhul nimete tamah etmezdi."]]}, {"reader": false, "ar": [[720.0, "وكم من أكلةٍ جميلةٍ تُحُدِّث بها في بعض البلاد،"], [725.0, "ولكن لا تجد نفسَك مشتاقةً لها؛"], [728.5, "لأنك لا تجد لها شيئًا متّفقًا معها ولو في الاسم الكلّيّ حتى تطمح نفسُك إليها."], [739.0, "لكن لو أنه قيل لك:"], [741.7, "إنها أكلةٌ مركّبةٌ من الفالوذج ومن العسل ومن كذا وكذا ممّا هو نعيمٌ متقرِّرٌ عندك،"], [750.2, "لَطمحت نفسُك إلى أكلها، أليس كذلك؟"]], "tr": [[720.0, "Bazı memleketlerde nice güzel yemeklerden bahsedilir;"], [723.9, "fakat nefsini onlara özlem duyar bulmazsın."], [728.5, "Çünkü onlarla —küllî isimde bile olsa— ortak olan bir şey bulamazsın ki nefsin ona yönelsin."], [739.0, "Fakat sana \"Bu, fâlûzecden (bir tür tatlı), baldan ve senin yanında yerleşik bir nimet olan şundan bundan yapılmış bir yemektir\" denilse, nefsin onu yemeye yönelirdi; değil mi?"]]}, {"reader": false, "ar": [[754.0, "فإذا قيل لك: ما حكمةُ الشرع أن يخاطبنا عن الأمور الغيبيّة بأشياءَ نجد لها حقائقَ ذهنيّةً أو معانيَ ذهنيّة؟"], [767.0, "فقل: لتشتاقَ نفوسُنا في أمور الترغيب،"], [771.1, "ولتنزجرَ نفوسُنا في أمور الترهيب."], [776.0, "فلو أنه قال: إنّني أعددتُ للكافرين والعُصاة في النار كذا وكذا من أنواع العذاب الأليم ـ ممّا لا تعرفه عقولُنا،"], [786.0, "ولا تتصوّره أذهانُنا، وليس له معهودٌ واقعيٌّ عندنا ـ لَما خافت نفوسُنا من هذا العذاب. تصوّرتم هذا؟ <span class=\"q\">؟ 13:15<\/span>"]], "tr": [[754.0, "Sana \"Şeriatın bize gaybî hususlar hakkında, zihnî hakikatlerini veya zihnî manalarını bulduğumuz şeylerle hitap etmesinin hikmeti nedir?\" denirse, de ki:"], [767.0, "Terğîb (teşvik) hususlarında nefislerimiz özlem duysun, terhîb (korkutma) hususlarında da nefislerimiz geri dursun diye."], [777.4, "Eğer \"Ben kâfirler ve günahkârlar için ateşte —akıllarımızın bilmediği, zihinlerimizin tasavvur etmediği ve yanımızda vâkıada tanıdık bir karşılığı olmayan— şu şu türden elem verici azaplar hazırladım\" deseydi, nefislerimiz bu azaptan korkmazdı."], [795.0, "Bunu tasavvur ettiniz mi? <span class=\"q\">؟<\/span>"]]}, {"reader": false, "ar": [[797.0, "فالاسمُ الكلّيّ المطلق مهمٌّ جدًّا،"], [804.0, "بينما كلُّ أهل البدع أنكروه."], [806.0, "وإنكارُه نفخةٌ إبليسيّة، ونفحةٌ شيطانيّةٌ خبيثة،"], [815.0, "يريد أن يقطع الطريقَ الذي تَعرِف به القلوبُ هذا الأمرَ الغيبيّ."], [819.0, "فالشيطان من أعظم مقاصده أن يقطع القلوبَ عن التعرّف على الله عز وجل؛"], [826.0, "فمتى ما قطع هذا الطريق ـ وهو ذلك المعنى الكلّيّ المطلق في الذهن ـ فإنّ نفوسنا لن تخاف من هذا الربّ،"], [836.0, "ولن تطمع فيما عنده من الثواب،"], [839.0, "ولن تنزجر فيما أعدّه لمخالفيه من العقاب."], [844.0, "لماذا؟ لأننا خُوطبنا في هذه الأمور الغيبيّة بأسماءٍ ليس لها معهودٌ في الذهن."]], "tr": [[797.0, "Mutlak küllî isim çok önemlidir;"], [800.2, "oysa bid'at ehlinin hepsi onu inkâr etmiştir."], [806.0, "Onu inkâr etmek iblisçe bir üfürük ve habis şeytanî bir esintidir;"], [815.7, "(şeytan bununla) kalplerin bu gaybî hususu tanıdığı yolu kesmek ister."], [819.0, "Şeytanın en büyük maksatlarından biri, kalpleri Allah Azze ve Celle'yi tanımaktan koparmaktır."], [826.0, "Bu yolu —ki o, zihindeki o mutlak küllî manadır— kestiği zaman, nefislerimiz bu Rab'den korkmaz, O'nun yanındaki sevaba tamah etmez ve O'na muhalefet edenler için hazırladığı cezadan dolayı geri durmaz."], [844.0, "Neden? Çünkü bu gaybî hususlarda bize zihinde tanıdık karşılığı olmayan isimlerle hitap edilmiş olur."]]}]}, {"ts": "14:12", "title": "2. Külliye (devam): Küllî isimde ortaklık, izafeden sonra ortaklığı gerektirmez; haram olan temsil", "paras": [{"reader": false, "ar": [[852.0, "فإن قلتَ: وهل الاتّفاقُ بين الشيئين في هذا الاسم الكلّيّ يستلزم الاتّفاقَ بعد الإضافة والتقييد والتخصيص؟"], [865.0, "فنقول: هذا مَحَطُّ رِحال كلّيّتنا؛"], [871.0, "فالكلّيّة تُجيبك عن هذا السؤال:"], [873.0, "لأنّ الاتّفاق في الاسم الكلّيّ المطلق لا يستلزم الاتّفاقَ بعد الإضافة والتقييد والتخصيص."], [882.0, "فإن قلتَ: وهل الأدلّة التي تنفي مماثلةَ الله بخلقه تنفي وجودَ هذه المماثلة والاتّفاق في الاسم الكلّيّ؟ الجواب: بالطبع لا."]], "tr": [[852.0, "\"İki şey arasında bu küllî isimdeki ortaklık, izafe, takyid ve tahsisten sonra da ortaklığı gerektirir mi?\" dersen, deriz ki:"], [865.0, "Külliyemizin yük indirdiği yer (asıl konusu) burasıdır."], [871.0, "Külliye sana bu sorunun cevabını verir:"], [873.0, "Çünkü mutlak küllî isimdeki ortaklık, izafe, takyid ve tahsisten sonra ortaklığı gerektirmez."], [882.0, "\"Allah'ın mahlûkatına benzerliğini nefyeden deliller, bu benzerliğin ve küllî isimdeki ortaklığın varlığını da nefyeder mi?\" dersen, cevap: Elbette hayır."]]}, {"reader": false, "ar": [[900.0, "وإنما كلُّ دليلٍ ينفي مماثلةَ الله بخلقه فإنه ينفي مماثلتَه لخلقه بعد الإضافة والتقييد والتخصيص."], [912.0, "فالتمثيلُ المحرَّم هو تمثيلُ صفات الله عز وجل بصفات خلقه بعد الإضافة،"], [920.0, "وأمّا إذا قُطِعت الإضافةُ وصار الاسمُ كلّيًّا مطلقًا،"], [926.0, "فليس الاتّفاقُ بين الاسمين من التمثيل الذي تنصّ الأدلّة على نفيه أو التحذير منه."]], "tr": [[900.0, "Bilakis Allah'ın mahlûkatına benzerliğini nefyeden her delil, O'nun mahlûkatına izafe, takyid ve tahsisten sonraki benzerliğini nefyeder."], [912.0, "Haram olan temsil, Allah Azze ve Celle'nin sıfatlarını izafeden sonra mahlûkatının sıfatlarına benzetmektir."], [920.7, "İzafe kesilip isim mutlak küllî hâle geldiğinde ise iki isim arasındaki ortaklık, delillerin nefyettiği veya ondan sakındırdığı temsilden değildir."]]}]}, {"ts": "15:38", "title": "2. Külliye (devam): Uygulamalı misaller (işitme, görme, el)", "paras": [{"reader": false, "ar": [[938.0, "فإن قلتَ: اضربْ لنا أمثلةً تطبيقيّةً على ما ذكرتَ،"], [944.1, "فأقول: الأمثلة كثيرة. منها:"], [947.6, "إذا قيل: سمعُ الله وسمعُ المخلوق،"], [951.1, "فالسمعُ يختلف باختلاف المضاف إليه؛"], [954.0, "فهنا ليس بين سمع الله ولا سمع المخلوق ولا مطلقُ التمثيل؛"], [960.0, "فسمعُ الله يخصُّه، لائقٌ بجلاله وعظمته،"], [965.0, "وسمعُ المخلوق يناسب حالَه وعجزَه وضعفَه."], [968.0, "لكن إذا حذفتَ الإضافتين فصار «سمع»،"], [972.0, "فهذا هو الاتّفاق في الاسم الكلّيّ المطلق،"], [977.0, "والاتّفاقُ في الاسم الكلّيّ المطلق لا ينجرّ بعد الإضافة والتقييد والتخصيص."]], "tr": [[938.0, "\"Söylediğine dair bize uygulamalı misaller ver\" dersen, derim ki:"], [944.8, "Misaller çoktur. Bunlardan biri: \"Allah'ın işitmesi ve mahlûkun işitmesi\" denildiğinde, işitme, izafe edildiği şeyin farklılığıyla farklılaşır."], [954.0, "Burada Allah'ın işitmesi ile mahlûkun işitmesi arasında mutlak bir temsil (benzerlik) dahi yoktur."], [960.0, "Allah'ın işitmesi O'na hastır, celâline ve azametine lâyıktır;"], [963.8, "mahlûkun işitmesi ise onun hâline, aczine ve zayıflığına uygundur."], [968.0, "Fakat iki izafeyi kaldırırsan ve (geriye sadece) \"işitme\" kalırsa, işte bu, mutlak küllî isimdeki ortaklıktır."], [977.0, "Mutlak küllî isimdeki ortaklık ise izafe, takyid ve tahsisten sonrasına çekilmez."]]}, {"reader": false, "ar": [[986.0, "ومثالٌ ثانٍ: إذا قيل لك:"], [988.8, "بصرُ الخالق وبصرُ المخلوق،"], [991.3, "فحينئذٍ ليس كمثل بصر الله عز وجل شيءٌ من بصر المخلوقات."], [998.0, "لكن إذا حذفتَ الإضافةَ فصار «بصر»،"], [1002.1, "فهذا هو الاسم الكلّيّ المطلق،"], [1006.0, "والاتّفاقُ في الاسم الكلّيّ المطلق لا يقتضي الاتّفاقَ ولا التماثلَ بعد الإضافة والتقييد والتخصيص."]], "tr": [[986.0, "İkinci bir misal: Sana \"Yaratıcı'nın görmesi ve mahlûkun görmesi\" denildiğinde, o zaman mahlûkatın görmesinden hiçbir şey Allah Azze ve Celle'nin görmesinin benzeri değildir."], [998.0, "Fakat izafeyi kaldırırsan ve (geriye) \"görme\" kalırsa, işte bu mutlak küllî isimdir."], [1006.0, "Mutlak küllî isimdeki ortaklık ise izafe, takyid ve tahsisten sonra ortaklığı da benzerliği de gerektirmez."]]}, {"reader": false, "ar": [[1014.0, "ومثالٌ ثالث: يدُ الخالق،"], [1016.7, "يدُ المخلوق؛ فليس كمثل يد الله عز وجل شيء؛"], [1024.0, "لأنّ الاسم هنا لم يَعُد اسمًا مطلقًا كلّيًّا،"], [1028.7, "وإنما أُضيف وقُيِّد وخُصِّص."], [1031.0, "فيدُ الله لائقةٌ بجلاله وعظمته،"], [1034.5, "ويدُ المخلوق تناسب ضعفَه وعجزَه وحالَه."], [1039.0, "لكن إذا حذفتَ الإضافة فصارت «يد»،"], [1041.8, "فإنك لا تُميّز بين يد الله ويد المخلوق في الاسم الكلّيّ،"], [1047.0, "وليس لهذه اليد المطلقة وجودٌ في الأعيان أصلًا،"], [1053.0, "والاتّفاقُ فيها لا يستلزم الاتّفاقَ بعد الإضافة والتقييد والتخصيص."], [1062.0, "وأظنّ الأمثلة واضحة، ولله الحمد والمنّة."]], "tr": [[1014.0, "Üçüncü bir misal: Yaratıcı'nın eli, mahlûkun eli."], [1018.1, "Allah Azze ve Celle'nin elinin benzeri hiçbir şey yoktur;"], [1024.0, "çünkü isim burada artık mutlak küllî bir isim değildir;"], [1027.5, "bilakis izafe edilmiş, takyid edilmiş ve tahsis edilmiştir."], [1031.0, "Allah'ın eli celâline ve azametine lâyıktır;"], [1033.8, "mahlûkun eli ise onun zayıflığına, aczine ve hâline uygundur."], [1039.0, "Fakat izafeyi kaldırırsan ve (geriye) \"el\" kalırsa, küllî isimde Allah'ın eli ile mahlûkun eli arasını ayırt edemezsin."], [1046.5, "Bu mutlak elin dış âlemde aslında hiçbir varlığı yoktur;"], [1052.1, "onda ortaklık ise izafe, takyid ve tahsisten sonra ortaklığı gerektirmez."], [1062.0, "Zannederim misaller açıktır; hamd ve minnet Allah'adır."]]}]}, {"ts": "17:46", "title": "2. Külliye (devam): İki sapkın ve aşırı fırka arasında hak yol", "paras": [{"reader": false, "ar": [[1066.0, "ونحن في هذه الكلّيّة بين فريقين ضالَّين متطرّفَين:"], [1075.0, "الفريق الأوّل قالوا: ليس بين صفات الله وصفات المخلوق اتّفاقٌ،"], [1082.6, "لا في الاسم الكلّيّ المطلق،"], [1085.9, "ولا بعد الإضافة والتقييد والتخصيص من باب أولى."], [1091.0, "وهؤلاء يُعطّلون القلوبَ عن معرفة الله عز وجل،"], [1096.0, "وهو الذي جرى عليه كثيرٌ من المعتزلة والجهميّة وغيرهم."], [1101.0, "ومنهم من قال بأنه كما أنّ بين الصفتين ـ مَن يُكمل؟"], [1110.8, "ـ اتّفاقًا في الاسم الكلّيّ المطلق،"], [1114.4, "فإنه ينجرّ إلى الاتّفاق بعد الإضافة والتقييد والتخصيص؛"], [1123.0, "وهم الممثِّلة الذين مثّلوا صفاتِ الله عز وجل بصفات خلقه."], [1128.0, "وكلا القولين باطل. والحقُّ أننا نقول:"], [1133.1, "إنهما متّفقان في شيءٍ ومختلفان في شيء؛"], [1137.8, "فمتّفقان في الاسم الكلّيّ المطلق،"], [1140.8, "ومختلفان بعد الإضافة والتقييد والتخصيص. والله أعلم."]], "tr": [[1066.0, "Biz bu külliyede iki sapkın ve aşırı fırka arasındayız:"], [1075.0, "Birinci fırka dedi ki: Allah'ın sıfatları ile mahlûkun sıfatları arasında ne mutlak küllî isimde ne de —evleviyetle— izafe, takyid ve tahsisten sonra hiçbir ortaklık yoktur."], [1091.0, "Bunlar kalpleri Allah Azze ve Celle'yi tanımaktan mahrum bırakırlar (ta'til ederler)."], [1096.6, "Mu'tezile'nin, Cehmiyye'nin ve başkalarının çoğunun gittiği yol budur."], [1101.0, "Onlardan bir kısmı da dedi ki:"], [1104.6, "İki sıfat arasında —kim tamamlar?— mutlak küllî isimde bir ortaklık olduğu gibi, bu, izafe, takyid ve tahsisten sonraki ortaklığa da çekilir."], [1123.0, "Bunlar, Allah Azze ve Celle'nin sıfatlarını mahlûkatının sıfatlarına benzeten Mümessile'dir."], [1128.0, "Her iki söz de bâtıldır."], [1131.0, "Hak olan şudur: Deriz ki, bu ikisi bir şeyde ortak, bir şeyde farklıdır:"], [1137.8, "Mutlak küllî isimde ortaktır, izafe, takyid ve tahsisten sonra farklıdır. Allah en iyisini bilir."]]}]}, {"ts": "19:05", "title": "3. Külliye: Allah'ın her sıfatının zâta zâit bir manası vardır ve zâttan ayrı değildir", "paras": [{"reader": false, "ar": [[1145.0, "الكلّيّة الثالثة: كلُّ صفةٍ لله فلها معنًى زائدٌ على الذات،"], [1151.8, "وليست بمنفصلةٍ عنها.<b> <\/b>كلُّ صفةٍ لله فلها معنًى زائدٌ على الذات،"], [1166.5, "وليست بمنفصلةٍ عنها. أُعيدها ثالثة:"], [1176.0, "كلُّ صفةٍ لله عز وجل فلها معنًى زائدٌ على الذات،"], [1182.8, "وليست بمنفصلةٍ عنها. أُعيدها مرّةً… رابعة؟ ماشي."]], "tr": [[1145.0, "3. külliye: Allah'ın her sıfatının zâta zâit (ilave) bir manası vardır ve o sıfat zâttan ayrı değildir. 3."], [1153.1, "külliye: Allah'ın her sıfatının zâta zâit bir manası vardır ve o sıfat zâttan ayrı değildir. Üçüncü kez tekrar ediyorum:"], [1176.0, "<b>3. külliye: Allah Azze ve Celle'nin her sıfatının zâta zâit bir manası vardır ve o sıfat zâttan ayrı değildir.<\/b> Bir kez daha… dördüncü kez mi tekrar edeyim? Tamam."]]}, {"reader": false, "ar": [[1191.0, "أقول وبالله تعالى التوفيق:"], [1193.0, "وهذه الكلّيّة جوابُ سؤالين مُجمَلين لا يجوز الإجابةُ بأحد الطرفين إلا بعد الاستفصال؛"], [1206.0, "لأنّ المتقرّر في القواعد أنّ الألفاظ المجملة لا تُقبَل مطلقًا لأنّ فيها باطلًا،"], [1214.6, "والباطلُ لا يُقبَل، ولا تُرَدّ مطلقًا لأنّ فيها حقًّا،"], [1225.3, "والحقُّ لا يُرَدّ، وإنما هي موقوفةٌ على الاستفصال حتى يتميّز حقُّها فيُقبَل،"], [1235.2, "من باطلها فيُرَدّ. ونحن بين طائفتين:"], [1242.1, "طائفةٌ تقول: إنّ صفات الله غيرُ ذاته،"], [1249.0, "وطائفةٌ تقول: إنّ صفات الله هي ذاتُه."], [1255.2, "وكلا الجملتين مجملة؛ فلا نقبلها مطلقًا ولا نردّها مطلقًا،"], [1267.0, "وإنما الحقُّ فيهما هو ما قرّرته هذه الكلّيّة."]], "tr": [[1191.0, "Tevfik Allah Teâlâ'dandır, derim ki:"], [1193.0, "Bu külliye, istifsâl (ayrıntısını sorup ayırma) yapılmadan iki taraftan biriyle cevap verilmesi caiz olmayan iki mücmel sorunun cevabıdır."], [1199.8, "Çünkü kaidelerde yerleşik olan şudur:"], [1206.0, "Mücmel lafızlar mutlak olarak kabul edilmez, çünkü içlerinde bâtıl vardır ve bâtıl kabul edilmez;"], [1214.0, "mutlak olarak reddedilmez de, çünkü içlerinde hak vardır ve hak reddedilmez."], [1226.0, "Bilakis bunlar istifsâle bağlıdır; ta ki hakkı bâtılından ayrılsın da hakkı kabul edilsin, bâtılı reddedilsin."], [1240.0, "Biz iki taife arasındayız: Bir taife \"Allah'ın sıfatları O'nun zâtının gayrıdır\" der;"], [1250.5, "bir taife de \"Allah'ın sıfatları O'nun zâtının kendisidir\" der."], [1255.2, "Her iki cümle de mücmeldir."], [1263.0, "Onu ne mutlak olarak kabul ederiz ne de mutlak olarak reddederiz;"], [1268.5, "ikisindeki hak, bu külliyenin takrir ettiği şeydir."]]}, {"reader": false, "ar": [[1273.0, "فنأتي لمن قال بأنّ صفات الله غيرُ ذاته،"], [1278.0, "فنقول: إنّ الغَيْريّة هنا لفظةٌ مجملة؛"], [1282.0, "فماذا تقصد بقولك: «غير الذات»؟"], [1284.9, "هل تقصد أنها منفصلةٌ عن ذات الله عز وجل،"], [1290.2, "كما تقوله الجهميّة؟ فإن قال:"], [1293.3, "نعم، فنقول: هذا المعنى باطل؛"], [1296.6, "لأنّ المتقرّر شرعًا وعقلًا وحسًّا وواقعًا أنّ الصفة لا تنفكّ عن موصوفها؛"], [1305.0, "فليس هناك كلامٌ ينفصل عن المتكلّم،"], [1307.7, "ولا سمعٌ ينفصل عن السامع،"], [1310.0, "ولا بصرٌ ينفصل عن المُبصِر،"], [1312.3, "ولا يدٌ تنفصل عن الموصوف بها."], [1315.0, "فمِن شأن الصفة أن تكون متّصلةً بالموصوف؛"], [1322.0, "فقولك: إنّ صفات الله غيرُ ذاته ـ بهذا المعنى ـ لا جَرَمَ أنه قولٌ باطل."]], "tr": [[1273.0, "\"Allah'ın sıfatları O'nun zâtının gayrıdır\" diyene gelir ve deriz ki:"], [1278.7, "Buradaki \"gayriyyet\" (başkalık) mücmel bir lafızdır."], [1282.0, "\"Zâtın gayrı\" sözünle neyi kastediyorsun?"], [1283.8, "Cehmiyye'nin dediği gibi, sıfatların Allah Azze ve Celle'nin zâtından ayrı olduğunu mu kastediyorsun?"], [1292.0, "\"Evet\" derse, deriz ki: Bu mana bâtıldır."], [1296.6, "Çünkü şer'an, aklen, hissen ve vâkıada yerleşik olan şudur:"], [1305.0, "Sıfat mevsufundan ayrılmaz. Konuşandan ayrılan bir konuşma, işitenden ayrılan bir işitme, görenden ayrılan bir görme, onunla vasıflanandan ayrılan bir el yoktur."], [1315.0, "Sıfatın şanı, mevsufa bitişik olmasıdır."], [1322.0, "Dolayısıyla \"Allah'ın sıfatları O'nun zâtının gayrıdır\" sözün —bu manayla— şüphesiz bâtıl bir sözdür."]]}, {"reader": false, "ar": [[1331.0, "وإن قال: أنا أقصد بقولي:"], [1334.1, "«صفاتُ الله غيرُ ذاته» أنها تُفيد معنًى زائدًا على الذات،"], [1340.4, "لكن ليست بمنفصلةٍ عنه،"], [1342.9, "فنقول: نعم، هذا المعنى حقّ،"], [1346.0, "ولكن لا نُعبِّر عن هذا الحقّ بهذا اللفظ البدعيّ المجمل،"], [1352.2, "وإنما نقول: اللهُ ذاتٌ وصفاتٌ قديم <span class=\"q\">؟ 22:35<\/span>."], [1361.0, "إيّاك أن تقول: اللهُ ذاتُه وصفاتُه،"], [1367.0, "وإنما قل: اللهُ بصفاته قديم."], [1371.0, "أنتم معي في هذا ولّا…؟"]], "tr": [[1331.0, "\"Allah'ın sıfatları O'nun zâtının gayrıdır\" sözümle, sıfatların zâta zâit bir mana ifade ettiğini, fakat ondan ayrı olmadığını kastediyorum\" derse, deriz ki:"], [1343.5, "Evet, bu mana haktır. Fakat bu hakkı bu bid'atçı, mücmel lafızla ifade etmeyiz;"], [1351.0, "bilakis \"Allah zât ve sıfatlarıyla kadîmdir\" deriz <span class=\"q\">؟<\/span>."], [1361.0, "Sakın \"Allah, zâtı ve sıfatları\" deme;"], [1368.6, "bilakis \"Allah sıfatlarıyla kadîmdir\" de."], [1371.0, "Bu konuda benimle misiniz, yoksa…?"]]}, {"reader": false, "ar": [[1375.0, "ثم ننتقل بعد ذلك إلى الكلمة الثانية:"], [1379.0, "الذين قالوا بأنّ صفة الله هي عينُ ذاته،"], [1385.0, "نقول: إنّ كلمة «العَيْنيّة» هنا كلمةٌ مجملة؛"], [1391.0, "فهل تقصد بأنها عينُ ذاته بمعنى أنها لا تُفيد معنًى زائدًا على الذات،"], [1398.0, "كما يقوله كثيرٌ من المعتزلة:"], [1400.3, "بأنّ علمَ الله هو عينُ ذاته،"], [1403.0, "وسمعَ الله هو عينُ ذاته؟"], [1406.0, "فهذا معنًى باطل؛ فإنّ الشرع والعقل والحسّ يدلّ على أنّ الصفة تُفيد معنًى زائدًا على الذات."], [1418.0, "فنقول: هذا إنسانٌ، وهذا علمُه؛"], [1422.9, "فإذن العلمُ يُفيد معنًى زائدًا على مجرّد الإنسانيّة والذات."], [1429.0, "فهدٌ وسمعُه؛ فالسمعُ زائدٌ على معنى الذات."]], "tr": [[1375.0, "Sonra bundan ikinci söze geçeriz:"], [1379.0, "\"Allah'ın sıfatı O'nun zâtının aynısıdır\" diyenler."], [1385.7, "Deriz ki: Buradaki \"ayniyyet\" kelimesi mücmel bir kelimedir."], [1391.0, "Onun zâtının aynısı olduğunu, zâta zâit bir mana ifade etmediği manasında mı kastediyorsun?"], [1398.0, "Nitekim Mu'tezile'nin çoğu \"Allah'ın ilmi O'nun zâtının aynısıdır, Allah'ın işitmesi O'nun zâtının aynısıdır\" der."], [1406.0, "Bu bâtıl bir manadır. Çünkü şer', akıl ve his, sıfatın zâta zâit bir mana ifade ettiğine delâlet eder."], [1418.0, "Deriz ki: Bu bir insandır, bu da onun ilmidir."], [1422.9, "Öyleyse ilim, salt insanlığa ve zâta zâit bir mana ifade eder."], [1429.0, "Fehd (adında biri) ve onun işitmesi: İşitme, zâtın manasına zâittir."]]}, {"reader": false, "ar": [[1437.0, "فإذا قال: أنا أقصد هذا المعنى،"], [1441.1, "فإننا نقول: بأنك قلتَ بالباطل."], [1447.0, "وأمّا إذا قال: بأنّني أقصد بأنّ صفة الله هي عينُ ذاته بمعنى أنها لا تنفصل عن الله عز وجل،"], [1455.0, "فنقول: هذا المعنى حقّ،"], [1457.0, "ولكن لا نُعبِّر عنه بهذا اللفظ البدعيّ،"], [1460.0, "وإنما نقول: اللهُ بصفاته."]], "tr": [[1437.0, "\"Ben bu manayı kastediyorum\" derse, deriz ki:"], [1442.5, "Bâtılı söyledin. Fakat \"Allah'ın sıfatının O'nun zâtının aynısı olduğunu, Allah Azze ve Celle'den ayrılmadığı manasında kastediyorum\" derse, deriz ki:"], [1455.5, "Bu mana haktır. Fakat onu bu bid'atçı lafızla ifade etmeyiz;"], [1459.6, "bilakis \"Allah sıfatlarıyla (birlikte)dir\" deriz."]]}, {"reader": false, "ar": [[1463.0, "فأنت ترى أنّ الكلّيّة تُجيب عن هذين المذهبين الباطلين،"], [1472.0, "المبنيَّين على جملتين مجملتين؛"], [1478.0, "فلم نقبل الإجمالَ فيهما،"], [1480.7, "وإنما فصّلناهما. والخلاصةُ من ذلك:"], [1483.1, "أنّ صفات الله عز وجل ليست بمنفصلةٍ عنه،"], [1487.0, "فكلُّ من اعتقد انفصالَ شيءٍ من صفات الله عن ذاته فقد قال بالباطل؛"], [1493.0, "وأنّ صفات الله تُفيد معنًى زائدًا على الذات،"], [1499.0, "فكلُّ من قال بأنّ صفات الله عز وجل هي عينُ ذاته،"], [1505.0, "ولا تُفيد شيئًا زائدًا على الذات،"], [1507.0, "فقد قال بالباطل. وأظنّها واضحة."]], "tr": [[1463.0, "Görüyorsun ki külliye, iki mücmel cümle üzerine kurulu bu iki bâtıl mezhebe cevap veriyor."], [1478.0, "İkisindeki icmali kabul etmedik, bilakis ikisini tafsil ettik."], [1483.1, "Bundan çıkan hulâsa şudur: Allah Azze ve Celle'nin sıfatları O'ndan ayrı değildir;"], [1487.8, "Allah'ın sıfatlarından herhangi birinin O'nun zâtından ayrı olduğuna inanan herkes bâtılı söylemiştir."], [1493.0, "Ve Allah'ın sıfatları zâta zâit bir mana ifade eder;"], [1499.0, "Allah Azze ve Celle'nin sıfatlarının O'nun zâtının aynısı olduğunu ve zâta zâit hiçbir şey ifade etmediğini söyleyen herkes bâtılı söylemiştir. Zannederim bu açıktır."]]}]}, {"ts": "25:11", "title": "4. Külliye: Allah Azze ve Celle'den ihtiyârî fiillerini nefyeden herkes bid'at ehlindendir", "paras": [{"reader": false, "ar": [[1511.0, "ومن الكلّيّات أيضًا: <b>كلُّ من نفى أفعالَه الاختياريّة فمن أهل البدع.<\/b> ـ كم رقمُها؟"], [1516.0, "ـ <b>كلُّ من نفى عن الله عز وجل أفعالَه الاختياريّة فمن أهل البدع.<\/b> أُعيدها ثالثة:"], [1546.0, "<b>كلُّ من نفى عن الله عز وجل أفعالَه الاختياريّة فمن أهل البدع.<\/b>"]], "tr": [[1511.0, "Külliyelerden biri de şudur: 4."], [1513.2, "külliye: O'nun ihtiyârî fiillerini nefyeden herkes bid'at ehlindendir.<b> —Numarası kaç?— <\/b>4."], [1516.0, "külliye: Allah Azze ve Celle'den ihtiyârî fiillerini nefyeden herkes bid'at ehlindendir. Üçüncü kez tekrar ediyorum:"], [1546.0, "<b>4. külliye: Allah Azze ve Celle'den ihtiyârî fiillerini nefyeden herkes bid'at ehlindendir.<\/b>"]]}, {"reader": false, "ar": [[1552.0, "أقول وبالله تعالى التوفيق:"], [1556.0, "اعلم ـ رحمك الله تعالى ـ أنّ هذه الكلّيّة هي مَحَطُّ نفي كثيرٍ من أهل البدع لصفات الله عز وجل الفعليّة؛"], [1573.0, "لأنّ أهل البدع يقولون بأنّ أفعال الله عز وجل الاختياريّة عبارةٌ عن حدوث شيءٍ في ذاته،"], [1583.4, "وذاتُه لا تقبل الحوادث ـ وذاتُه لا تقبل الحوادث ـ هكذا قالوا."], [1598.0, "فلمّا رأوا الاستواءَ صفةَ فعلٍ،"], [1602.0, "وهو أمرٌ حادثٌ على الذات،"], [1606.0, "قالوا: لا يُوصَف الله بالاستواء؛"], [1608.0, "لأنّ إثبات الاستواء يستلزم وصفَ الله بالحدوث. هكذا قالوا."]], "tr": [[1552.0, "Tevfik Allah Teâlâ'dandır, derim ki:"], [1556.0, "Bil —Allah Teâlâ sana rahmet etsin— bu külliye, bid'at ehlinden birçoğunun Allah Azze ve Celle'nin fiilî sıfatlarını nefyetmesinin odak noktasıdır."], [1573.0, "Çünkü bid'at ehli şöyle der:"], [1575.6, "Allah Azze ve Celle'nin ihtiyârî fiilleri, O'nun zâtında bir şeyin hâdis olmasından (meydana gelmesinden) ibarettir;"], [1583.4, "O'nun zâtı ise havâdisi kabul etmez —O'nun zâtı havâdisi kabul etmez—."], [1598.0, "Böyle dediler. İstivânın bir fiil sıfatı olduğunu, zât üzerinde hâdis bir iş olduğunu görünce \"Allah istivâ ile vasıflandırılmaz;"], [1608.0, "çünkü istivâyı isbat etmek Allah'ı hudûs ile vasıflandırmayı gerektirir\" dediler. Böyle dediler."]]}, {"reader": false, "ar": [[1615.0, "ولمّا رأوا بأنّ صفة الغضب شيءٌ يحدث،"], [1620.0, "وأنّ الرضا شيءٌ يحدث،"], [1624.0, "وأنّ النزولَ إلى السماء الدنيا في ثلث الليل الآخر شيءٌ يحدث،"], [1630.0, "وأنّ الرحمةَ شيءٌ يحدث،"], [1636.0, "قالوا: كلُّها صفاتٌ تُوجب وصفَ الله عز وجل بالحدوث،"], [1642.0, "وذاتُ الله عز وجل لا تقبل الحوادث."], [1645.0, "فالقاعدة الملعونة عندهم تقول بأنّ:"], [1648.4, "كلَّ صفةٍ تقتضي الحدوثَ فمنتفيةٌ عن الله عز وجل."], [1654.3, "أُعيدها مرّةً ثانية: كلُّ صفةٍ تستلزم أو تقتضي وصفَ الله عز وجل بالحدوث فإنها منتفيةٌ عن الله عز وجل."]], "tr": [[1615.0, "Gazap sıfatının hâdis olan (sonradan meydana gelen) bir şey olduğunu, rızanın hâdis olan bir şey olduğunu, gecenin son üçte birinde dünya semasına nüzulün hâdis olan bir şey olduğunu ve rahmetin hâdis olan bir şey olduğunu görünce, \"Bunların hepsi Allah Azze ve Celle'yi hudûs ile vasıflandırmayı gerektiren sıfatlardır;"], [1641.3, "Allah Azze ve Celle'nin zâtı ise havâdisi kabul etmez\" dediler."], [1645.0, "Onlara göre o lanetli kaide şöyle der:"], [1648.4, "Hudûsu gerektiren her sıfat Allah Azze ve Celle'den nefyedilmiştir."], [1654.3, "İkinci kez tekrar ediyorum: Allah Azze ve Celle'yi hudûs ile vasıflandırmayı lâzım kılan veya gerektiren her sıfat, Allah Azze ve Celle'den nefyedilmiştir."]]}, {"reader": false, "ar": [[1671.0, "قلنا لهم: ولماذا؟ قالوا:"], [1673.7, "لأنّ الصفة الحادثة لا تحُلّ إلا في حادث؛"], [1682.0, "فإذا كانت الصفةُ موصوفةً بالحدوث فيلزم من ذلك وصفُ ذات الله بالحدوث،"], [1692.0, "ومِن أخصِّ خصائص ألوهيّته وربوبيّته وصفُ ذاته بالقِدَم."], [1697.0, "والعلّةُ في ذلك شيءٌ آخر عَجَزَ أهلُ البدع أن يتجاوزوه."]], "tr": [[1671.0, "Onlara \"Niçin?\" dedik. Dediler ki:"], [1673.0, "\"Çünkü hâdis sıfat ancak hâdis olan bir şeyde bulunur (hulûl eder)."], [1682.0, "Sıfat hudûs ile vasıflanınca, bundan Allah'ın zâtının hudûs ile vasıflanması lâzım gelir."], [1688.2, "Oysa O'nun ulûhiyyetinin ve rubûbiyyetinin en has özelliklerinden biri, zâtının kıdem ile vasıflanmasıdır.\" Bunun (asıl) illeti ise başka bir şeydir ki bid'at ehli onu aşmaktan âciz kalmıştır."]]}]}, {"ts": "28:30", "title": "4. Külliye (devam): Bu kaidenin kökü — kelamcıların, âlemin hudûsunu havâdisle isbat etmesi", "paras": [{"reader": false, "ar": [[1710.0, "وبيانُه أن نقول ـ وأرجو أن أقول ولا أُطيل ـ:"], [1716.0, "هو أنّ أهل البدع أرادوا أن يردّوا على الفلاسفة الملاحدة في قِدَم العالم؛"], [1726.0, "فإنّ الفلاسفة الملاحدة يعتقدون قِدَمَ العالم،"], [1734.0, "أي: أنّ هذا العالم لا أوّلَ له."], [1737.0, "فأراد أهلُ البدع أن يردّوا عليهم هذا القول،"], [1742.0, "فبحثوا ونقّبوا عن شيءٍ يُلجِم الفلاسفةَ الملاحدة،"], [1751.0, "فقالوا: وجدناها! وهي أنّ هذا العالم تحدث فيه الأشياء وتتجدّد؛"], [1761.0, "ففيه طلوعُ شمسٍ وغروب،"], [1764.0, "فهو أمرٌ حادث، وفيه طلوعُ قمرٍ وغروب،"], [1769.9, "وهو أمرٌ حادث، وفيه شقاءٌ وسعادة،"], [1774.3, "وفيه حرٌّ وشتاء، وفيه كذا وفيه كذا من الأمور الحادثة."], [1783.0, "فقالوا: بما أنّ هذا العالم تجري عليه الحوادث ـ أو تجري فيه الحوادث ـ فجريانُ الحوادث فيه دليلٌ على حدوثه."], [1797.0, "وفرحوا بهذا الوجه في الردّ على الفلاسفة الملاحدة."]], "tr": [[1710.0, "Bunun açıklaması şudur —umarım uzatmadan söylerim—:"], [1716.0, "Bid'at ehli, âlemin kıdemi meselesinde mülhid filozoflara reddiye yapmak istedi."], [1721.4, "Çünkü mülhid filozoflar âlemin kadîm olduğuna, yani bu âlemin bir başlangıcı olmadığına inanırlar."], [1734.4, "Bid'at ehli onların bu sözünü reddetmek istedi;"], [1737.0, "mülhid filozofları susturacak bir şey aradılar, araştırdılar ve \"Bulduk!\" dediler:"], [1742.0, "O da bu âlemde şeylerin hâdis olması ve yenilenmesidir."], [1751.7, "Onda güneşin doğması ve batması vardır;"], [1761.0, "bu hâdis bir iştir. Onda ayın doğması ve batması vardır;"], [1768.4, "bu da hâdis bir iştir."], [1771.3, "Onda bedbahtlık ve mutluluk, sıcak ve kış, şu ve bu gibi hâdis işler vardır."], [1783.0, "Dediler ki: Madem bu âlemin üzerinde —veya içinde— havâdis cereyan ediyor, öyleyse içinde havâdisin cereyan etmesi onun hâdis olduğunun delilidir."], [1797.0, "Mülhid filozoflara reddiyede bu yolu bulmaya sevindiler."]]}]}, {"ts": "30:03", "title": "4. Külliye (devam): Mülhidlerin itirazı ve bid'at ehlinin ihtiyârî sıfatları nefyetmesi", "paras": [{"reader": false, "ar": [[1803.0, "فأورد عليهم الملاحدةُ شيئًا أعجزهم وجعلهم ينفون صفاتِ الله الاختياريّة ـ تبعتم معي؟"], [1814.0, "ـ فقالوا: وربُّكم الذي تدعوننا للإيمان به،"], [1818.0, "كتابُكم يصفه بأنه يرضى ويتكلّم ويغضب ويستوي وينزل ويمقت ويكره؛"], [1834.0, "أوَليست هذه حوادثَ في الذات؟"], [1837.3, "قالوا: بلى. قالوا: إذن حلولُ الحوادث فيه دليلٌ على حدوث ذاته."], [1846.0, "فبقي أهلُ البدع متحيّرين بين تصحيح أصلهم الباطل…،"], [1851.2, "ولكنهم رأوا بأنّ تصحيح أصلهم الباطل سيكسر حجّتَهم التي كسروا بها الملاحدةَ الفلاسفة؛"], [1870.0, "إذ ليس عند أهل البدع أيُّ دليلٍ يدلّ على حدوث العالم إلا هذا الدليلُ الذي أوقعهم في شرّ أعمالهم."]], "tr": [[1803.0, "Mülhidler onlara, kendilerini âciz bırakan ve Allah'ın ihtiyârî sıfatlarını nefyetmelerine yol açan bir itiraz yönelttiler —beni takip ettiniz mi?— Dediler ki:"], [1814.0, "\"Bizi kendisine imana çağırdığınız Rabbinizi Kitabınız;"], [1816.7, "razı olan, konuşan, gazaplanan, istivâ eden, nüzul eden, buğzeden (mekt) ve hoşlanmayan biri olarak vasıflandırıyor."], [1834.0, "Bunlar zâtta (meydana gelen) havâdis değil mi?\" \"Evet\" dediler."], [1839.3, "(Mülhidler) dediler ki: \"Öyleyse havâdisin O'nda hulûl etmesi, zâtının hâdis olduğunun delilidir.\" Bid'at ehli, bâtıl asıllarını düzeltmek ile… arasında şaşkın kaldı."], [1853.1, "Fakat bâtıl asıllarını düzeltmenin, mülhid filozofları kendisiyle yendikleri delillerini kıracağını gördüler."], [1870.0, "Zira bid'at ehlinin, âlemin hâdis olduğuna delâlet eden, kendilerini amellerinin en kötüsüne düşüren bu delilden başka hiçbir delili yoktur."]]}, {"reader": false, "ar": [[1881.0, "فقالوا: الحلُّ يسير: نَنفي <span class=\"q\">؟ 31:24<\/span> صفاتِ الله الاختياريّة،"], [1887.0, "ونُحرّفها ونُخرجها عن مدلولاتها الصحيحة،"], [1894.0, "أو نجعلها من صفاته القديمة قِدَمَ ذاته؛"], [1898.0, "فالله متكلّمٌ في الأزل ولا يتجدّد له كلام،"], [1904.0, "والله يغضب في الأزل ولا يتجدّد له غضب."], [1908.0, "كلُّ ذلك من باب المحافظة على دليلهم الباطل الذي جعلوه دليلًا على الفلاسفة في القول بقِدَم ـ أو في ردّ القول بقِدَم العالم. أرأيتم هذا؟"]], "tr": [[1881.0, "Dediler ki: \"Çözüm kolay: Allah'ın ihtiyârî sıfatlarını nefyederiz <span class=\"q\">؟<\/span>, onları tahrif eder ve sahih delâletlerinin dışına çıkarırız;"], [1898.0, "ya da onları, zâtının kıdemi gibi kadîm olan sıfatlarından sayarız."], [1903.1, "Buna göre Allah ezelde konuşandır, O'nun için yeni bir konuşma meydana gelmez;"], [1908.0, "Allah ezelde gazaplanır, O'nun için yeni bir gazap meydana gelmez.\" Bütün bunlar, filozoflara karşı kıdem sözünde —veya âlemin kıdemi sözünü reddetmede— delil edindikleri bâtıl delillerini korumak kabîlindendir. Bunu gördünüz mü?"]]}, {"reader": false, "ar": [[1923.0, "فإذا قيل لك: ما الذي يحمل أهلَ البدع على محاربة الصفات الاختياريّة ـ أي:"], [1931.3, "الصفات الفعليّة؛ أوَليست صفاتُ الله ذاتيّةً وفعليّة؟"], [1935.0, "ـ فالصفات الفعليّة يُنكرها أهلُ البدع،"], [1938.0, "وسببُ إنكارهم هي هذه القاعدة الملعونة:"], [1942.0, "أنّ كلَّ ما تحُلّه الحوادث فحادث."], [1948.0, "فيقولون لنا: لو أننا أثبتنا صفاتِ الله الاختياريّة لاستلزم ذلك وصفَ ذاته بماذا؟ بالحدوث."]], "tr": [[1923.0, "Sana \"Bid'at ehlini ihtiyârî sıfatlarla —yani fiilî sıfatlarla;"], [1924.1, "Allah'ın sıfatları zâtî ve fiilî değil midir?— savaşmaya sevk eden nedir?\" denirse:"], [1931.7, "Fiilî sıfatları bid'at ehli inkâr eder;"], [1935.0, "inkârlarının sebebi de şu lanetli kaidedir:"], [1942.0, "Havâdisin hulûl ettiği her şey hâdistir."], [1948.0, "Bize derler ki: \"Allah'ın ihtiyârî sıfatlarını isbat etseydik, bu, O'nun zâtını neyle vasıflandırmayı gerektirirdi? Hudûs ile.\""]]}]}, {"ts": "32:41", "title": "4. Külliye (devam): Külliyenin cevabı — \"hudûs\" mücmel bir lafızdır; doğrusu \"ihtiyârî / fiilî sıfatlar\"dır", "paras": [{"reader": false, "ar": [[1961.0, "فتأتي هذه الكلّيّة لتردّ عليهم:"], [1964.0, "بأنّ الحدوث من الألفاظ المجملة التي لا يجوز استعمالُها في حقّ الله عز وجل إلا بعد البيان والتفصيل،"], [1975.0, "ونستبدلها باللفظ الشرعيّ المتّفق عليه،"], [1978.3, "بأننا نقول: نؤمن بأنّ صفات الله عز وجل ذاتيّةٌ وفعليّة،"], [1985.0, "أو نقول: بأنّ صفات الله عز وجل منها ما هو ذاتيّ ومنها ما هو اختياريّ."], [1993.0, "فبدلَ أن نقول: إنها صفاتٌ حادثة،"], [1997.2, "نقول: هي صفاتٌ اختياريّة،"], [2000.0, "أي: خاضعةٌ لمشيئة الله عز وجل وحكمته،"], [2004.0, "متى ما شاء فعلها،"], [2005.8, "ومتى ما شاء لم يفعلها."], [2008.0, "وسيأتينا أنّ أفعاله الاختياريّة تابعةٌ لمشيئته وحكمته في كلّيّةٍ خاصّة إن شاء الله."], [2014.0, "وبذلك ـ أي: بهذه الكلّيّة ـ نخرج من هذا المأزق العظيم الذي أوقعنا فيه هؤلاء المبتدعة."]], "tr": [[1961.0, "İşte bu külliye onlara şöyle reddiye yapmak için gelir:"], [1964.0, "Hudûs, Allah Azze ve Celle hakkında beyan ve tafsil olmadan kullanılması caiz olmayan mücmel lafızlardandır."], [1972.6, "Onun yerine üzerinde ittifak edilen şer'î lafzı koyarız ve şöyle deriz:"], [1979.7, "Allah Azze ve Celle'nin sıfatlarının zâtî ve fiilî olduğuna iman ederiz."], [1986.1, "Ya da deriz ki: Allah Azze ve Celle'nin sıfatlarının bir kısmı zâtî, bir kısmı ihtiyârîdir."], [1995.1, "\"Bunlar hâdis sıfatlardır\" demek yerine \"Bunlar ihtiyârî sıfatlardır\" deriz;"], [2000.6, "yani Allah Azze ve Celle'nin meşîetine ve hikmetine tâbidir:"], [2004.9, "Dilediği zaman onu yapar, dilediği zaman yapmaz."], [2008.0, "İnşallah O'nun ihtiyârî fiillerinin meşîetine ve hikmetine tâbi olduğu, özel bir külliyede gelecek."], [2014.0, "Bununla —yani bu külliyeyle— bu bid'atçıların bizi düşürdüğü bu büyük çıkmazdan kurtuluruz."]]}, {"reader": false, "ar": [[2027.0, "فأنت ترى ـ وفّقك الله ـ أنّ لأهل البدع قاعدتين باطلتين في صفات الله الذاتيّة وفي صفاته الاختياريّة:"], [2044.0, "فإذا رأيتَ المبتدع يُنكر شيئًا من صفاته الذاتيّة فاعلم أنه يقف وراءها قاعدةُ:"], [2051.1, "الاتّفاقُ في الأسماء يستلزم الاتّفاقَ في الصفات،"], [2054.4, "وقد رددنا عليه. وإذا رأيتَ أحدًا من أهل البدع يُنكر صفاتِ الله الاختياريّة فاعرف أنه يقف وراءها قاعدةُ:"], [2066.3, "أنّ كلَّ ما تحُلّه الحوادث فهو حادث."], [2073.0, "وصوابُها: أننا لا نصفها بالحدوث؛"], [2076.6, "لأنّ الحدوث لفظةٌ مجملة،"], [2081.0, "وإنما نقول بأنها صفاتُه الفعليّة،"], [2084.6, "أو صفاتُه الاختياريّة. انتبهوا!"]], "tr": [[2027.0, "Görüyorsun —Allah seni muvaffak kılsın— bid'at ehlinin, Allah'ın zâtî sıfatları ve ihtiyârî sıfatları hakkında iki bâtıl kaidesi vardır:"], [2044.0, "Bid'atçının O'nun zâtî sıfatlarından bir şeyi inkâr ettiğini görürsen, bil ki bunun arkasında \"isimlerde ortaklık, sıfatlarda ortaklığı gerektirir\" kaidesi durmaktadır;"], [2056.0, "buna reddiye yaptık. Bid'at ehlinden birinin Allah'ın ihtiyârî sıfatlarını inkâr ettiğini görürsen, bil ki bunun arkasında \"havâdisin hulûl ettiği her şey hâdistir\" kaidesi durmaktadır."], [2073.0, "Doğrusu şudur: Onları hudûs ile vasıflandırmayız;"], [2076.6, "çünkü hudûs mücmel bir lafızdır."], [2078.7, "Bilakis onların O'nun fiilî sıfatları veya ihtiyârî sıfatları olduğunu söyleriz. Dikkat edin!"]]}]}, {"ts": "34:49", "title": "4. Külliye (devam): Sıfat mevsufuna tâbidir; bid'at ehlinin iki zâtı bir tutması", "paras": [{"reader": false, "ar": [[2089.0, "ولأنّ المتقرّر في القواعد ـ أثرًا ونظرًا ـ أنّ الصفة تختلف باختلاف الموصوف بها؛"], [2105.0, "فإن وُصِفَ بها ذاتٌ مخلوقةٌ فتكون مخلوقة،"], [2109.0, "وإن وُصِفَ بها ذاتٌ غيرُ مخلوقةٍ فلا تكون مخلوقة."], [2113.0, "فإذا قلنا: استواءُ الله،"], [2115.4, "فإيّاك أن تقول: إنّ الاستواء حادث،"], [2119.0, "وما حلّته الحوادث فهو حادث؛"], [2122.0, "لأنه استواءٌ وُصِفَ به الخالق،"], [2125.3, "فيكون استواؤه غيرَ مخلوق."], [2128.0, "وإذا قلتَ: غضبُ الخالق،"], [2130.5, "فإيّاك أن تقول: إنّ الغضب حادث،"], [2134.2, "وما حلّت فيه الحوادث فهو حادث؛"], [2138.0, "ولأننا أضفنا هذا الغضبَ إلى مَن؟"], [2142.1, "إلى الخالق، فيكون مناسبًا له."]], "tr": [[2089.0, "Ve (bir de) kaidelerde —eseren ve nazaran— yerleşik olan şudur:"], [2093.8, "Sıfat, onunla vasıflanan şeyin farklılığıyla farklılaşır."], [2105.0, "Onunla mahlûk bir zât vasıflanırsa (sıfat) mahlûk olur;"], [2109.4, "onunla mahlûk olmayan bir zât vasıflanırsa mahlûk olmaz."], [2113.0, "\"Allah'ın istivâsı\" dediğimizde, sakın \"İstivâ hâdistir;"], [2117.2, "havâdisin hulûl ettiği şey de hâdistir\" deme."], [2122.0, "Çünkü bu, Yaratıcı'nın kendisiyle vasıflandığı bir istivâdır;"], [2125.3, "dolayısıyla O'nun istivâsı mahlûk değildir."], [2128.0, "\"Yaratıcı'nın gazabı\" dediğinde de, sakın \"Gazap hâdistir;"], [2132.4, "havâdisin hulûl ettiği şey de hâdistir\" deme."], [2138.0, "Çünkü bu gazabı kime izafe ettik?"], [2142.1, "Yaratıcı'ya. Dolayısıyla O'na uygun olur."]]}, {"reader": false, "ar": [[2145.8, "فخطأُ أهل البدع وضلالُهم في أنهم جعلوها نوعًا واحدًا:"], [2155.0, "كما أننا استدللنا على حدوث العالم بحدوث الأشياء فيه،"], [2162.0, "فلا بدّ أن ننفي حدوثَ الأشياء في ذات الله حتى لا يستلزم حدوثَ ذاته."], [2173.0, "قلنا: لا قياسَ بين الذاتين <span class=\"q\">؟ 36:13<\/span>؛"], [2176.0, "فإننا معكم بأنّ العالم تحُلّه الحوادث فهو حادث؛"], [2182.5, "لأنها حلّت في ذاتٍ مخلوقة،"], [2187.0, "فتكون الحوادث التي حلّت فيه مخلوقة."], [2190.0, "وأمّا صفاتُ الله وأفعالُه الفعليّة وأفعالُه الاختياريّة فإنها تقوم ـ ما أنا قلتُ:"], [2198.3, "«تحُلّ» ـ تقوم في ذاتٍ غير مخلوقة،"], [2204.0, "فلا تكون مخلوقة؛ لأنّ المتقرّر في القواعد أنّ الصفة تتبع الموصوف،"], [2210.0, "فتكون الصفةُ مخلوقةً إذا أُضيفت إلى مخلوق،"], [2214.0, "ولا تكون مخلوقةً إذا أُضيفت لغير مخلوق."], [2217.0, "لكن عجزت عقولُهم أن يتصوّروا ذلك،"], [2222.0, "<span class=\"ayah\">﴿وَمَن يُرِدِ اللَّهُ فِتْنَتَهُ فَلَن تَمْلِكَ لَهُ مِنَ اللَّهِ شَيْئًا﴾<\/span> <span class=\"ref\">[المائدة: ٤١]<\/span>."], [2230.0, "هذا خلاصةُ هذه الكلّيّة."]], "tr": [[2145.8, "Bid'at ehlinin hatası ve sapıklığı, ikisini tek bir tür kılmalarındadır:"], [2155.0, "\"Nasıl ki âlemin hudûsuna, içindeki şeylerin hudûsuyla istidlal ettik;"], [2162.0, "öyleyse zâtının hudûsunu gerektirmesin diye Allah'ın zâtında şeylerin hudûsunu nefyetmemiz gerekir\" (dediler)."], [2173.0, "Dedik ki: İki zât arasında kıyas yoktur <span class=\"q\">؟<\/span>."], [2176.0, "Biz sizinle, âlemde havâdisin hulûl ettiği ve dolayısıyla onun hâdis olduğu hususunda beraberiz;"], [2182.5, "çünkü havâdis mahlûk bir zâtta hulûl etmiştir, dolayısıyla onda hulûl eden havâdis de mahlûktur."], [2190.0, "Allah'ın sıfatları, fiilî fiilleri ve ihtiyârî fiilleri ise —ben \"hulûl eder\" demedim— mahlûk olmayan bir zâtta kâimdir;"], [2198.3, "dolayısıyla mahlûk değildir. Çünkü kaidelerde yerleşik olan şudur:"], [2205.6, "Sıfat mevsufa tâbidir; sıfat mahlûka izafe edildiğinde mahlûk olur, mahlûk olmayana izafe edildiğinde mahlûk olmaz."], [2214.0, "Fakat akılları bunu tasavvur etmekten âciz kaldı."], [2217.0, "<span class=\"ayah\">﴿Allah kimin fitneye düşmesini dilerse, onun için Allah'a karşı hiçbir şey yapamazsın﴾<\/span> [Mâide 41]. Bu külliyenin hulâsası budur."]]}, {"reader": false, "ar": [[2233.0, "فإثباتُنا في هذه الكلّيّة للصفات الاختياريّة إنما هو متفرّعٌ عن آياتٍ كثيرةٍ تُثبت لله عز وجل هذه الأفعالَ الاختياريّة،"], [2246.0, "والتي تقدّم لنا في الكلّيّات السابقة طرفٌ كثيرٌ منها:"], [2250.0, "كاستواء الله عز وجل،"], [2252.0, "فهو من أفعاله الاختياريّة،"], [2254.0, "ورضاه، ورحمته، وغضبه، ومقته،"], [2256.9, "ونزوله إلى السماء الدنيا،"], [2264.0, "ونحو ذلك؛ كلُّ ذلك من الأفعال الاختياريّة التي تقوم في ذات الله عز وجل على حسب مشيئته وحكمته تبارك وتعالى. انتهى."]], "tr": [[2233.0, "Bu külliyede ihtiyârî sıfatları isbat etmemiz, Allah Azze ve Celle için bu ihtiyârî fiilleri isbat eden birçok ayetten neşet eder;"], [2246.4, "önceki külliyelerde bunlardan büyük bir kısmı geçmişti:"], [2250.0, "Allah Azze ve Celle'nin istivâsı gibi —ki bu O'nun ihtiyârî fiillerindendir—, rızası, rahmeti, gazabı, buğzu (mekti), dünya semasına nüzulü ve benzerleri."], [2265.1, "Bunların hepsi, Allah Azze ve Celle'nin zâtında, —Tebâreke ve Teâlâ— O'nun meşîetine ve hikmetine göre kâim olan ihtiyârî fiillerdendir. Bitti."]]}]}, {"ts": "38:00", "title": "Ta'kib: Usûldeki sapma fürûdaki sapmaya götürür", "paras": [{"reader": false, "ar": [[2280.0, "لكن تعقيبًا أقول: ولذلك ضلالُ الأصول ـ مَن يُكمل؟"], [2288.0, "ـ ضلالُ الأصول يُفضي إلى ضلال الفروع."], [2292.0, "واللهِ ما ضلّ إنسانٌ في فرعٍ إلا بعد أن ضلّ في أصل،"], [2297.0, "خاصّةً في أصول العقيدة."], [2300.0, "يجب عليك أن تكون أصولُك مُحكَمة،"], [2303.0, "متّفقةً مع كتاب الله وسنّة رسوله صلى الله عليه وسلم،"], [2307.0, "ومؤيَّدةً بفهم السلف الصالح،"], [2309.2, "ومقرَّرةً في كتب أهل العلم،"], [2312.0, "حتى لا تُنتج لك شيئًا من الفروع الضالّة."], [2316.0, "فهؤلاء لمّا ضلّوا في أنّ الاتّفاق في الأسماء يستلزم الاتّفاق في الصفات أنكروا وعطّلوا كثيرًا من صفات ذاته،"], [2324.0, "ولمّا ضلّوا في ـ أنّ في ـ مسألة الحدوث والحادث أنكروا كثيرًا وعطّلوا كثيرًا من صفات الله الاختياريّة."], [2333.0, "نسأل الله الثباتَ إلى الممات."]], "tr": [[2280.0, "Fakat bir ta'kib (ek açıklama) olarak derim ki:"], [2288.0, "Bu yüzden usûldeki sapma —kim tamamlar?— usûldeki sapma fürûdaki sapmaya götürür."], [2294.5, "Vallahi hiçbir insan, bir asılda sapmadıkça bir fer'de sapmamıştır;"], [2300.0, "bilhassa akîdenin usûlünde. Usûlünün muhkem olması, Allah'ın Kitabı'na ve Resûlü sallallâhu aleyhi ve sellem'in sünnetine uygun olması, selef-i sâlihînin anlayışıyla desteklenmiş ve ilim ehlinin kitaplarında takrir edilmiş olması sana vâciptir;"], [2316.0, "ta ki sana sapık fürûdan hiçbir şey üretmesin."], [2319.5, "Bunlar, isimlerde ortaklığın sıfatlarda ortaklığı gerektirdiği hususunda sapınca, (Allah'ın) zâtî sıfatlarının birçoğunu inkâr ve ta'til ettiler."], [2325.5, "Hudûs ve hâdis meselesinde sapınca da Allah'ın ihtiyârî sıfatlarının birçoğunu inkâr ve ta'til ettiler."], [2333.0, "Allah'tan ölünceye kadar sebat dileriz."]]}]}, {"ts": "38:56", "title": "5. Külliye: Sahih âhâd yolla sabit olan her sıfatı isbat etmek vâciptir", "paras": [{"reader": false, "ar": [[2336.0, "ومن الكلّيّات أيضًا: <b>كلُّ صفةٍ ثبتت بطريق الآحاد الصحيح فالواجبُ إثباتُها.<\/b> أظنّ واضح."], [2346.0, "<b>كلُّ صفةٍ ثبتت بطريق الآحاد الصحيح فالواجبُ إثباتُها.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2336.0, "Külliyelerden biri de şudur: 5."], [2341.0, "külliye: Sahih âhâd yolla sabit olan her sıfatı isbat etmek vâciptir. Zannederim açıktır."], [2345.5, "<b>5. külliye: Sahih âhâd yolla sabit olan her sıfatı isbat etmek vâciptir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2365.0, "أقول وبالله تعالى التوفيق:"], [2368.0, "وهذا بإجماع أهل السنة والجماعة رحمهم الله تعالى،"], [2374.0, "ولا تجد ـ في الأعمّ الأغلب ـ كتابًا يُقرّر شيئًا من العقائد إلا وهو ينصّ على هذه القاعدة:"], [2383.0, "أنّ خبر الآحاد الصحيح متى ما ثبت به شيءٌ من العقائد ـ في الأسماء أو الصفات،"], [2389.0, "أو في حقائق اليوم الآخر،"], [2391.0, "أو في أيّ أمرٍ غيبيّ ـ فإنّ الواجب علينا اعتقادُ مدلوله والإيمانُ بمقتضاه؛"], [2400.0, "فإنّ العبرة عند أهل السنة والجماعة ليست طريقَ الخبر، وإنما صحّةُ الخبر."]], "tr": [[2365.0, "Tevfik Allah Teâlâ'dandır, derim ki:"], [2368.0, "Bu, Ehl-i Sünnet ve'l-Cemaat'in —Allah Teâlâ onlara rahmet etsin— icmâıyladır."], [2375.0, "Akîdelerden bir şeyi takrir eden hemen hiçbir kitap bulamazsın ki bu kaideyi açıkça belirtmesin:"], [2383.0, "Sahih âhâd haberle akîdelerden bir şey —isim ve sıfatlarda, âhiret gününün hakikatlerinde veya herhangi bir gaybî hususta— sabit olduğu zaman, onun delâlet ettiği şeye inanmak ve gereğine iman etmek bize vâciptir."], [2400.0, "Çünkü Ehl-i Sünnet ve'l-Cemaat nezdinde itibar, haberin yoluna değil, haberin sıhhatinedir."]]}, {"reader": false, "ar": [[2408.0, "والمتقرّر في القواعد: أنّ كلَّ من حصر إثباتَ العقائد في المتواترات فمن أهل البدع ـ كما سيأتينا بعد قليل،"], [2421.7, "كلّيّةٌ تلي بعدها إن شاء الله ـ."], [2424.0, "والمتقرّر في القواعد: أنّ كلَّ من قسّم السنّة ـ انتبهوا ـ إلى متواترٍ وآحادٍ تقسيمَ قبولٍ وردٍّ فمن أهل البدع،"], [2439.0, "كما ذكرتُه لكم في أوائل كلّيّات ومقدّمات هذا الكتاب المبارك إن شاء الله."], [2448.0, "فجميعُ العقائد التي ثبت بها طريقُ الآحاد الصحيح فالواجبُ علينا إثباتُها."]], "tr": [[2408.0, "Kaidelerde yerleşik olan şudur: Akîdelerin isbatını mütevâtirlere hasreden herkes bid'at ehlindendir —birazdan, inşallah bundan sonra gelen külliyede geleceği gibi—."], [2422.1, "Yine kaidelerde yerleşik olan şudur:"], [2424.0, "Sünneti —dikkat edin— kabul ve ret taksimi olarak mütevâtir ve âhâd diye taksim eden herkes bid'at ehlindendir;"], [2439.0, "bunu size bu mübarek kitabın ilk külliyelerinde ve mukaddimelerinde zikretmiştim, inşallah."], [2448.0, "Sahih âhâd yolun kendisiyle sabit olduğu bütün akîdeleri isbat etmek bize vâciptir."]]}, {"reader": false, "ar": [[2457.0, "ولذلك فإننا نجد كثيرًا من صفات الله عز وجل يُثبتها أهلُ السنة والجماعة،"], [2463.3, "وطريقُ إثباتها خبرُ الآحاد،"], [2467.0, "أي: الخبر الذي ينقله الواحد والاثنان والثلاثة،"], [2472.0, "أو الأقلّ والأكثر، ما لم يبلغ مبلغَ التواتر."], [2477.0, "فلا أعلم سُنّيًّا سلفيًّا يُوقِف إثباتَ شيءٍ من العقائد على تواتر المنقول."]], "tr": [[2457.0, "Bu yüzden Allah Azze ve Celle'nin sıfatlarından birçoğunu Ehl-i Sünnet ve'l-Cemaat'in isbat ettiğini, isbat yollarının ise âhâd haber olduğunu görürüz;"], [2467.7, "yani tevâtür derecesine ulaşmadığı sürece bir, iki, üç veya daha az ya da daha çok kişinin naklettiği haber."], [2478.4, "Akîdelerden bir şeyin isbatını nakledilenin mütevâtir olmasına bağlayan hiçbir sünnî-selefî bilmiyorum."]]}, {"reader": false, "ar": [[2486.0, "وبناءً على ذلك فإننا نُثبت لله عز وجل صفةَ الضحك،"], [2493.0, "فللّه ضحكٌ يليق بجلاله وعظمته،"], [2498.0, "وطريقُ إثباته خبرُ آحاد."], [2503.0, "ونُثبت لله عز وجل صفةَ الأصابع،"], [2507.0, "فللّه أصابعُ تليق بجلاله وعظمته،"], [2510.3, "وطريقُ إثباتها خبرُ آحاد."], [2514.0, "ونُثبت لله عز وجل صفةَ القدم أو الرِّجل،"], [2519.2, "فللّه عز وجل رِجلٌ أو قدمٌ تليق بجلاله وعظمته،"], [2525.0, "وطريقُ إثباتها خبرُ آحاد."], [2529.0, "ونُثبت لله عز وجل صفةَ الفرح،"], [2534.0, "فللّه عز وجل فرحٌ يليق بجلاله وعظمته،"], [2540.0, "وطريقُ إثباته خبرُ آحاد."], [2543.0, "وهكذا دواليك في صفاتٍ كثيرةٍ نُثبتها لله عز وجل،"], [2549.0, "وطريقُ إثباتها إنما هو خبرُ الآحاد الصحيح."]], "tr": [[2486.0, "Buna binaen Allah Azze ve Celle için gülme (dahik) sıfatını isbat ederiz;"], [2493.8, "Allah'ın celâline ve azametine yakışan bir gülmesi vardır;"], [2503.0, "isbat yolu âhâd haberdir. Allah Azze ve Celle için parmaklar sıfatını isbat ederiz;"], [2509.0, "Allah'ın celâline ve azametine yakışan parmakları vardır;"], [2514.0, "isbat yolu âhâd haberdir. Allah Azze ve Celle için ayak (kadem veya ricl) sıfatını isbat ederiz;"], [2521.8, "Allah Azze ve Celle'nin celâline ve azametine yakışan bir ayağı vardır;"], [2529.0, "isbat yolu âhâd haberdir. Allah Azze ve Celle için sevinme (ferah) sıfatını isbat ederiz;"], [2536.2, "Allah Azze ve Celle'nin celâline ve azametine yakışan bir sevinmesi vardır;"], [2543.0, "isbat yolu âhâd haberdir. Allah Azze ve Celle için isbat ettiğimiz birçok sıfatta durum böyledir;"], [2549.6, "bunların isbat yolu ancak sahih âhâd haberdir."]]}]}, {"ts": "42:33", "title": "5. Külliye (devam): Sünnîyi bid'atçıdan ayıran soru; bid'at ehlinin mütevâtir naslara muamelesi", "paras": [{"reader": false, "ar": [[2553.0, "ولذلك جعل أهلُ السنة ممّا يُمتحَن به الإنسانُ لتُعرَف سُنّيّتُه من بدعيّته هذا السؤال:"], [2570.0, "أتثبت العقائدُ بخبر الآحاد أم لا؟"], [2574.0, "فإن قال: لا، فمن أهل البدع،"], [2579.0, "وإن قال: نعم، فمن أهل السنة في هذه الجزئيّة."]], "tr": [[2553.0, "Bu yüzden Ehl-i Sünnet, sünnîliği bid'atçılığından ayırt edilsin diye insanın imtihan edildiği şeyler arasında şu soruyu kılmıştır:"], [2570.0, "\"Akîdeler âhâd haberle sabit olur mu, olmaz mı?\" \"Hayır\" derse bid'at ehlindendir;"], [2580.4, "\"Evet\" derse bu cüz'î meselede Ehl-i Sünnet'tendir."]]}, {"reader": false, "ar": [[2586.0, "ثم إنك لو نظرتَ إلى تعامل أهل البدع مع المتواترات لوجدتَ أنهم ينفونها ولا يُثبتونها أيضًا."], [2601.0, "فإنّ وجهَ الله ثابتٌ بالأدلّة المتواترة،"], [2604.0, "فهل أثبته أهلُ البدع أم حرّفوه؟"], [2607.0, "الجواب: بل حرّفوه. ويدُ الله عز وجل ثابتةٌ بالأدلّة المتواترة،"], [2615.0, "فهل أثبتها أهلُ البدع أو حرّفوها؟"], [2618.0, "الجواب: بل حرّفوها. وعلوُّ الله ذاتًا ثابتٌ بالأدلّة المتواترة،"], [2627.0, "فهل أثبته أهلُ البدع أو حرّفوه؟"], [2630.0, "الجواب: بل حرّفوه. وهكذا في صفاتٍ كثيرةٍ ثبتت بأدلّةٍ متواترة،"], [2638.0, "ومع ذلك فإنّ أهل البدع لم يرتضوها،"], [2640.9, "ولم يُثبتوها، ولم يؤمنوا بها،"], [2643.0, "وإنما حرّفوها وأخرجوها عن مدلولاتها الصحيحة."], [2647.0, "فكيف يقولون بأننا لا نُثبت العقائد إلا بالمتواترات؟!"]], "tr": [[2586.0, "Sonra bid'at ehlinin mütevâtirlere muamelesine baksan, onları da nefyettiklerini ve isbat etmediklerini görürsün."], [2594.8, "Allah'ın vechi mütevâtir delillerle sabittir;"], [2601.0, "bid'at ehli onu isbat mı etti, yoksa tahrif mi etti?"], [2604.0, "Cevap: Bilakis tahrif ettiler. Allah Azze ve Celle'nin eli mütevâtir delillerle sabittir;"], [2609.0, "bid'at ehli onu isbat mı etti, yoksa tahrif mi etti?"], [2615.5, "Cevap: Bilakis tahrif ettiler. Allah'ın zâtıyla uluvvü mütevâtir delillerle sabittir;"], [2619.0, "bid'at ehli onu isbat mı etti, yoksa tahrif mi etti?"], [2627.0, "Cevap: Bilakis tahrif ettiler. Mütevâtir delillerle sabit olan birçok sıfatta durum böyledir;"], [2631.0, "buna rağmen bid'at ehli onlara razı olmadı, onları isbat etmedi, onlara iman etmedi;"], [2640.9, "bilakis onları tahrif etti ve sahih delâletlerinin dışına çıkardı."], [2647.0, "O hâlde nasıl olur da \"Akîdeleri ancak mütevâtirlerle isbat ederiz\" derler?!"]]}, {"reader": false, "ar": [[2655.0, "فهذا يدلّك على أنّ القوم لا يريدون إثباتَ شيءٍ لله أصالةً،"], [2661.0, "لكنهم قدروا على الآحاد لظنّيّته،"], [2667.0, "فقالوا: نستطيع أن نردّه سندًا ومتنًا ـ أي:"], [2673.9, "روايةً ودراية ـ. وأمّا المتواترات فإنهم لو ردّوها سندًا لكفروا،"], [2685.0, "فقالوا: إذن نقبلها إسنادًا ولا نُغيّر فيها شيئًا،"], [2695.0, "ولكن نأتي إلى معانيها فنُحرّفها إلى معانٍ أخرى تتّفق مع معقولنا."]], "tr": [[2655.0, "Bu sana gösterir ki bu topluluk aslında Allah için hiçbir şey isbat etmek istemiyor."], [2659.9, "Fakat âhâd habere, zannî oluşu sebebiyle güç yetirdiler ve \"Onu senet ve metin yönünden —yani rivayet ve dirayet yönünden— reddedebiliriz\" dediler."], [2673.9, "Mütevâtirlere gelince, onları senet yönünden reddetselerdi kâfir olurlardı."], [2685.7, "Bu yüzden \"Öyleyse onları isnad yönünden kabul ederiz ve onlarda hiçbir şeyi değiştirmeyiz;"], [2696.4, "fakat manalarına gelir, onları aklımıza uygun başka manalara tahrif ederiz\" dediler."]]}]}, {"ts": "45:07", "title": "5. Külliye (devam): Hulâsa · Dersin sonu", "paras": [{"reader": false, "ar": [[2707.0, "فهذا يُفيدك بأنّ القوم أصلًا ليسوا حريصين على ما يثبت في العقائد حتى يشترطوا فيها المتواترات،"], [2718.0, "وإنما هذا من باب التلبيس على الناس."], [2723.0, "فحقيقةُ القوم أنهم لا يريدون أصلًا إثباتَ صفة؛"], [2728.0, "فقدروا على الآحاد سندًا ومتنًا فردّوه،"], [2732.0, "وقدروا على المتواترات معنًى وإن أقرّوا بها لفظًا."], [2740.0, "والخلاصةُ من ذلك: أنه لا يجوز أن نردّ شيئًا ثبت لله عز وجل،"], [2747.0, "أو شيئًا ثبت في أيّ أمرٍ من أمور الغيب،"], [2751.0, "وتكون علّةُ ردّنا له أنّ طريقه آحاد."], [2756.0, "فمتى ما صحّ الحديثُ ـ الخبرُ الآحاد ـ بأمرٍ غيبيّ فالواجبُ علينا إثباتُه واعتقادُه والإيمانُ بمدلوله."]], "tr": [[2707.0, "Bu sana şunu ifade eder:"], [2709.7, "Bu topluluk aslında akîdelerde neyin sabit olduğuna hırslı değildir ki onlarda mütevâtir olmayı şart koşsun;"], [2718.7, "bu ancak insanları aldatma (telbis) kabîlindendir."], [2723.0, "Bu topluluğun hakikati şudur: Aslında hiçbir sıfatı isbat etmek istemezler."], [2728.0, "Âhâd habere senet ve metin yönünden güç yetirip onu reddettiler;"], [2733.4, "mütevâtirlere ise —lafız olarak ikrar etseler de— mana yönünden güç yetirdiler."], [2741.6, "Bundan çıkan hulâsa şudur: Allah Azze ve Celle için sabit olan bir şeyi veya gayb işlerinden herhangi bir işte sabit olan bir şeyi, reddimizin illeti yolunun âhâd olması olmak üzere reddetmemiz caiz değildir."], [2756.0, "Hadis —âhâd haber— gaybî bir hususta sahih olduğu zaman, onu isbat etmek, ona inanmak ve delâlet ettiği şeye iman etmek bize vâciptir."]]}, {"reader": false, "ar": [[2768.0, "والله أعلم، وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[2768.0, "Allah en iyisini bilir. Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");

        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}

}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
