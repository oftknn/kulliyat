<script>
const D={"no": 37, "vid": "uNfv5mXsc8A", "title_ar": "الدرس (٣٧) من شرح كليات العقيدة — من كليات توحيد الألوهية: الدعاء", "title_tr": "Şerhu Külliyyâti'l-Akîde — 37. Ders: Ulûhiyyet Tevhidi Külliyeleri (Duanın İki Türü, İbadet Duası ile İstek Duasının Birbirini Gerektirmesi, İbadet Duasını Allah'tan Başkasına Yöneltmek, Sadece Allah'ın Gücü Yeten Şeyi Başkasından İstemek, Mabudun Kendisine İbadet Edenden Teberrîsi)", "sections": [{"ts": "00:00", "title": "1. Külliye: Kur'an'daki «dua» lafzı hem ibadet duası hem istek duası ile tefsir edilir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.3, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.7, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.5, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [11.9, "أمّا بعد: لقد دخلنا في الدرس الماضي في الكلّيّات المتعلّقة بتوحيد الألوهية،"], [18.0, "وأخذنا جُمَلًا منها، وها نحن نُكمل سياقَ الكلّيّات في هذا الباب العظيم."], [24.0, "وعندنا جُمَلٌ من الكلّيّات."], [26.1, "الكلّيّة الأولى: <b>كلُّ ما ورد في القرآن من لفظ «دعا» وما تصرّف منه فيُفسَّر بدعاء العبادة والمسألة.<\/b> <span class=\"note\">(يكررها)<\/span>"]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [2.3, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [13.0, "Bundan sonra: Geçen derste ulûhiyyet tevhidiyle ilgili külliyelere girmiştik ve onlardan bir kısmını almıştık."], [19.5, "İşte bu büyük babdaki külliyelerin akışını tamamlıyoruz."], [22.5, "Elimizde birtakım külliyeler var. <b>1. külliye: Kur'an'da «dua etti» (دعا) lafzından ve ondan türeyen kelimelerden gelen her şey, ibadet duası ve istek duası ile tefsir edilir.<\/b> (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[51.0, "أقول وبالله التوفيق: والأمرُ في ذلك واضحٌ ولله الحمد."], [60.0, "وبيانُه أن نقول: إنّ أهل السنة والجماعة ـ رحمهم الله تعالى ـ يقسمون الدعاء إلى قسمين:"], [66.0, "إلى دعاءِ عبادة، وإلى دعاءِ مسألة."], [69.0, "ودعاءُ العبادة هو فعلُ الطاعة التي يرجو العبدُ بها ثوابَ الله عز وجل؛"], [75.0, "كالصلاة، فإنها طاعةٌ إنما يفعلها الإنسان سائلًا ربَّه الثوابَ عليها،"], [82.0, "فهي في حقيقتها دعاء،"], [84.0, "ولكن لا يتضمّن رفعَ يدين،"], [86.5, "وإنما يتضمّن أفعالًا وتعبُّداتٍ يفعلها."], [89.0, "وكذلك الصدقة فإنها دعاءُ عبادة؛"], [94.0, "لأنها عبادةٌ يفعلها الإنسان راجيًا ثوابَها من الله عز وجل،"], [99.0, "فكأنه سأل اللهَ الثواب،"], [100.8, "ولكن ليس عن طريق مسألة،"], [103.0, "وإنما عن طريق عبادةٍ يقدّمها لله،"], [106.0, "ينوي بها ثوابَ الله."]], "tr": [[51.0, "Tevfik Allah'tandır, derim ki: Bu konudaki mesele açıktır, hamd Allah'a."], [60.0, "Açıklaması şudur: Ehl-i Sünnet ve'l-Cemaat —Allah onlara rahmet etsin— duayı iki kısma ayırırlar:"], [65.1, "İbadet duası ve istek duası."], [67.0, "İbadet duası, kulun onunla Allah Azze ve Celle'nin sevabını umduğu itaati yapmasıdır."], [72.7, "Namaz gibi: Namaz bir itaattir;"], [74.5, "insan onu ancak Rabbinden onun karşılığında sevap isteyerek kılar."], [80.6, "Dolayısıyla o, hakikatinde bir duadır;"], [83.0, "ama elleri kaldırmayı içermez, yaptığı birtakım fiilleri ve taabbudları içerir."], [87.5, "Sadaka da böyledir, o da bir ibadet duasıdır."], [94.0, "Çünkü insanın sevabını Allah Azze ve Celle'den umarak yaptığı bir ibadettir."], [99.0, "Sanki Allah'tan sevap istemiştir; ama bir istek yoluyla değil, Allah'a sunduğu ve onunla Allah'ın sevabına niyet ettiği bir ibadet yoluyla."]]}, {"reader": false, "ar": [[108.0, "وكذلك سائرُ التعبُّدات العمليّة أيضًا كلُّها تدخل تحت دائرة دعاء العبادة:"], [118.0, "فرميُ الجمرات دعاءُ عبادة،"], [121.0, "والطوافُ بالبيت دعاءُ عبادة،"], [123.4, "والسعيُ بين الصفا والمروة دعاءُ عبادة،"], [127.0, "والوقوفُ بعرفة والمبيتُ بمزدلفة ومِنًى كلُّه من دعاء العبادة."], [132.4, "والصلاةُ بركوعها وقيامها وسجودها وقعودها وسلامها كلُّها من باب دعاء العبادة."], [139.0, "وكذلك الزكواتُ الواجبة والصدقاتُ المندوبة،"], [142.4, "كلُّ ذلك ممّا يدخل تحت دائرة دعاء العبادة؛"], [148.0, "لأنها تعبُّداتٌ يقدّمها لله عز وجل،"], [151.6, "لربّه، راجيًا الثوابَ والأجر،"], [154.0, "ولكنه لم يرجُ الثوابَ والأجرَ عن طريق دعاءٍ ورفعِ يدين،"], [159.0, "وإنما عن طريق تعبُّدٍ مشروعٍ يفعله لله عز وجل."]], "tr": [[108.0, "Diğer bütün amelî taabbudlar da aynı şekilde ibadet duası dairesine girer:"], [116.6, "Cemrelere taş atmak ibadet duasıdır;"], [119.5, "Beyt'i (Kâbe'yi) tavaf etmek ibadet duasıdır;"], [122.8, "Safâ ile Merve arasında sa'y etmek ibadet duasıdır;"], [127.0, "Arafat'ta vakfe, Müzdelife'de ve Minâ'da gecelemek, bunların hepsi ibadet duasındandır."], [132.4, "Namaz da rükûu, kıyamı, secdesi, oturuşu ve selâmıyla tamamen ibadet duası babındandır."], [138.4, "Farz zekâtlar ve mendup sadakalar da böyledir;"], [142.4, "bunların hepsi ibadet duası dairesine giren şeylerdendir."], [146.4, "Çünkü bunlar, kişinin sevap ve ecir umarak Allah Azze ve Celle'ye, Rabbine sunduğu taabbudlardır."], [154.0, "Ama o, sevabı ve ecri dua ve el kaldırma yoluyla değil, Allah Azze ve Celle için yaptığı meşru bir taabbud yoluyla ummuştur."]]}, {"reader": false, "ar": [[164.0, "ويقابلُ هذا الدعاءَ دعاءُ المسألة،"], [166.7, "وهو دعاءُ الطلب اللسانيّ من الله عز وجل."], [171.0, "وبما أنّ العلماء قسموا الدعاءَ الواردَ في الكتاب والسنة إلى هذين النوعين،"], [178.0, "فحينئذٍ جاءت هذه الكلّيّة لتقرّر بأنّ لفظة «دعا» متى ما مرّت عليك في القرآن،"], [186.4, "بأيّ صيغةٍ وبأيّ تصريف،"], [189.0, "فإنه يصحّ أن تفسّرها بدعاء العبادة تارةً،"], [193.2, "وبدعاء المسألة تارةً، ما لم تدلّ القرينةُ على ترجيح أحد النوعين على الآخر."], [199.0, "كقول الله عز وجل:"], [201.9, "<span class=\"ayah\">﴿وَقَالَ رَبُّكُمُ ادْعُونِي﴾<\/span> <span class=\"ref\">[غافر: ٦٠]<\/span>، فيصحّ أن تقول:"], [206.1, "«اسألوني» فتفسّرها بدعاء المسألة،"], [208.8, "أو «اعبدوني» فتفسّرها بدعاء العبادة."], [213.0, "ويكون معنى <span class=\"ayah\">﴿أَسْتَجِبْ لَكُمْ﴾<\/span> <span class=\"ref\">[غافر: ٦٠]<\/span>:"], [215.7, "أي اسألوني أستجبْ لكم دعاءكم،"], [219.1, "أو اعبدوني فأُثيبَكم بالاستجابة."]], "tr": [[164.0, "Bu duanın karşısında istek duası vardır;"], [166.2, "o da Allah Azze ve Celle'den dil ile talepte bulunma duasıdır."], [170.5, "Âlimler Kitap ve Sünnet'te geçen duayı bu iki türe ayırdıklarına göre, işte bu külliye şunu takrir etmek için gelmiştir:"], [178.6, "«Dua etti» lafzı Kur'an'da hangi kalıpta ve hangi türetilmiş hâliyle karşına çıkarsa çıksın, onu bazen ibadet duası, bazen istek duası ile tefsir etmen sahihtir;"], [189.0, "yeter ki karine iki türden birini diğerine tercih etmeye delâlet etmesin."], [193.8, "Allah Azze ve Celle'nin şu sözü gibi:"], [196.2, "<span class=\"ayah\">﴿Rabbiniz dedi ki: Bana dua edin﴾<\/span> [Mü'min 60]."], [198.6, "Burada «Benden isteyin» deyip onu istek duası ile tefsir etmen de, «Bana ibadet edin» deyip ibadet duası ile tefsir etmen de sahihtir."], [209.5, "<span class=\"ayah\">﴿Size icabet edeyim﴾<\/span> [Mü'min 60] kısmının anlamı da şöyle olur:"], [215.0, "Benden isteyin, duanıza icabet edeyim;"], [217.7, "ya da Bana ibadet edin, icabetle sizi mükâfatlandırayım."]]}, {"reader": false, "ar": [[226.0, "وكذلك قولُ الله عز وجل:"], [228.8, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ تَدْعُونَ مِن دُونِ اللَّهِ عِبَادٌ أَمْثَالُكُمْ﴾<\/span> <span class=\"ref\">[الأعراف: ١٩٤]<\/span>،"], [233.2, "يصحّ أن تفسّرها: تسألون،"], [235.4, "وتعبدون. وبالمناسبة: فإنّ السلف عند تفسير هذه اللفظة بخصوصها تجد أنهم يختلفون فيها على قولين؛"], [244.0, "فمن السلف من يفسّرها بدعاء العبادة،"], [246.9, "ومنهم من يفسّرها بدعاء المسألة،"], [249.2, "وهو من باب خلاف التنوّع،"], [251.6, "لا من باب خلاف التضادّ."], [254.0, "وكقول الله عز وجل:"], [256.3, "<span class=\"ayah\">﴿وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ﴾<\/span> <span class=\"ref\">[البقرة: ١٨٦]<\/span>؛"], [261.4, "أي أقبلُ عبادةَ العابد،"], [263.7, "أو أستجيبُ دعاءَ السائل."]], "tr": [[226.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [229.3, "<span class=\"ayah\">﴿Allah'ı bırakıp da dua ettikleriniz, sizin gibi kullardır﴾<\/span> [A'râf 194]."], [233.2, "Bunu «istedikleriniz» ve «ibadet ettikleriniz» diye tefsir etmen sahihtir."], [237.1, "Yeri gelmişken: Selefin özellikle bu lafzı tefsir ederken iki görüşe ayrıldığını görürsün."], [242.3, "Seleften kimisi onu ibadet duası ile, kimisi istek duası ile tefsir eder;"], [246.9, "bu da tezat ihtilafı babından değil, çeşitlilik (tenevvü') ihtilafı babındandır."], [250.7, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [253.5, "<span class=\"ayah\">﴿Kullarım sana Beni sorduklarında, (bilsinler ki) şüphesiz Ben çok yakınım; dua edenin duasına icabet ederim﴾<\/span> [Bakara 186]."], [260.3, "Yani ibadet edenin ibadetini kabul ederim, ya da isteyenin duasına icabet ederim."]]}, {"reader": false, "ar": [[266.0, "وكذلك قولُ الله عز وجل:"], [269.0, "<span class=\"ayah\">﴿ادْعُوا رَبَّكُمْ تَضَرُّعًا وَخُفْيَةً﴾<\/span> <span class=\"ref\">[الأعراف: ٥٥]<\/span>؛"], [272.0, "أي اسألوه تضرُّعًا وخُفيةً،"], [274.0, "أو اعبدوه تضرُّعًا وخُفيةً،"], [277.0, "فكلاهما صحيح. وكذلك قولُ الله عز وجل:"], [281.0, "<span class=\"ayah\">﴿فَادْعُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ﴾<\/span> <span class=\"ref\">[غافر: ١٤]<\/span>،"], [283.0, "فإنه يصحّ أن تفسّرها:"], [285.0, "فاسألوا اللهَ مخلصين له الدعاء،"], [288.0, "أو فاعبدوا اللهَ مخلصين له التعبُّد."], [291.0, "وكذلك قولُ الله عز وجل:"], [294.0, "<span class=\"ayah\">﴿وَضَلَّ عَنْهُم مَّا كَانُوا يَدْعُونَ مِن قَبْلُ﴾<\/span> <span class=\"ref\">[فصلت: ٤٨]<\/span>؛"], [298.0, "أي ما كانوا يعبدون،"], [299.5, "أو ما كانوا يسألون من دون الله عز وجل."]], "tr": [[266.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [269.0, "<span class=\"ayah\">﴿Rabbinize yalvararak ve gizlice dua edin﴾<\/span> [A'râf 55]."], [273.0, "Yani O'ndan yalvararak ve gizlice isteyin, ya da O'na yalvararak ve gizlice ibadet edin;"], [278.6, "ikisi de sahihtir. Allah Azze ve Celle'nin şu sözü de böyledir:"], [282.6, "<span class=\"ayah\">﴿Dini Allah'a has kılarak O'na dua edin﴾<\/span> [Mü'min 14]."], [285.6, "Bunu «Duayı O'na has kılarak Allah'tan isteyin» ya da «Taabbudu O'na has kılarak Allah'a ibadet edin» diye tefsir etmen sahihtir."], [293.4, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [296.3, "<span class=\"ayah\">﴿Daha önce dua ettikleri şeyler onlardan kaybolup gitmiştir﴾<\/span> [Fussılet 48]."], [299.5, "Yani Allah Azze ve Celle'yi bırakıp ibadet ettikleri ya da istedikleri şeyler."]]}]}, {"ts": "05:03", "title": "1. Külliye (devam): Örnek ayetler ve İbn Teymiyye'nin sözü", "paras": [{"reader": false, "ar": [[303.0, "وكقول الله عز وجل:"], [306.0, "<span class=\"ayah\">﴿إِنَّ رَبِّي لَسَمِيعُ الدُّعَاءِ﴾<\/span> <span class=\"ref\">[إبراهيم: ٣٩]<\/span>؛"], [309.0, "أي لَمُجيبُ السؤال، ولَمُثيبُ العابدِ على عبادته،"], [317.0, "فيصحّ أن تفسّر الدعاء هنا بأنه دعاءُ العبادة ودعاءُ المسألة."], [322.0, "وكذلك قولُ الله عز وجل:"], [324.0, "<span class=\"ayah\">﴿وَمَنْ أَضَلُّ مِمَّن يَدْعُو مِن دُونِ اللَّهِ مَن لَّا يَسْتَجِيبُ لَهُ إِلَىٰ يَوْمِ الْقِيَامَةِ وَهُمْ عَن دُعَائِهِمْ غَافِلُونَ﴾<\/span> <span class=\"ref\">[الأحقاف: ٥]<\/span>،"], [333.0, "فقد ورد لفظُ الدعاء في هذه الآية في موضعين:"], [336.8, "في أوّلها وآخرها، وكلاهما يصحّ تفسيرُه بدعاء العبادة تارةً،"], [341.0, "وبدعاء المسألة تارةً أخرى."], [345.0, "وكذلك قولُ الله عز وجل:"], [347.0, "<span class=\"ayah\">﴿قُلْ مَا يَعْبَأُ بِكُمْ رَبِّي لَوْلَا دُعَاؤُكُمْ﴾<\/span> <span class=\"ref\">[الفرقان: ٧٧]<\/span>؛"], [351.0, "أي لولا سؤالُكم، أو لولا عبادتُكم."]], "tr": [[303.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [306.8, "<span class=\"ayah\">﴿Şüphesiz Rabbim duayı işitendir﴾<\/span> [İbrâhîm 39]."], [309.9, "Yani isteğe icabet edendir ve ibadet edeni ibadetinden dolayı mükâfatlandırandır."], [318.0, "Dolayısıyla buradaki duayı hem ibadet duası hem istek duası diye tefsir etmen sahihtir."], [322.8, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [325.5, "<span class=\"ayah\">﴿Allah'ı bırakıp da kıyamet gününe kadar kendisine cevap veremeyecek olanlara dua edenden daha sapık kim vardır? Onlar bunların dualarından habersizdirler﴾<\/span> [Ahkâf 5]."], [333.8, "Bu ayette dua lafzı iki yerde geçmiştir:"], [335.9, "başında ve sonunda. İkisini de bazen ibadet duası, bazen de istek duası ile tefsir etmek sahihtir."], [341.9, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [346.2, "<span class=\"ayah\">﴿De ki: Duanız olmasaydı Rabbim size ne diye değer versin﴾<\/span> [Furkân 77]."], [351.0, "Yani isteğiniz olmasaydı, ya da ibadetiniz olmasaydı."]]}, {"reader": false, "ar": [[355.0, "وهكذا دَوالَيك في كلِّ موضعٍ ورد فيه «دعا» وما تصرّف منها،"], [363.0, "سواءٌ خُوطب بها المفرد،"], [365.4, "أو خُوطب بها المثنّى أو الجماعة."], [369.0, "وتقسيمُ الدعاء إلى دعاء العبادة ودعاء المسألة أمرٌ مهمّ،"], [374.7, "سينفعنا في الكلّيّات القادمة إن شاء الله."], [377.0, "وكذلك قولُ الله عز وجل:"], [379.0, "<span class=\"ayah\">﴿وَأَنَّ الْمَسَاجِدَ لِلَّهِ فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا﴾<\/span> <span class=\"ref\">[الجن: ١٨]<\/span>؛"], [385.0, "أي فلا تسألوا معه أحدًا،"], [388.0, "أو لا تعبدوا معه أحدًا. والله أعلم."]], "tr": [[355.0, "«Dua etti» lafzının ve ondan türeyenlerin geçtiği her yerde de böyle devam eder;"], [361.9, "ister tekil, ister ikil, ister çoğul muhatap alınsın."], [366.0, "Duanın ibadet duası ve istek duası diye ayrılması önemli bir meseledir;"], [371.9, "inşallah gelecek külliyelerde bize faydası olacaktır."], [374.7, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [376.7, "<span class=\"ayah\">﴿Mescitler şüphesiz Allah'ındır. O hâlde Allah ile birlikte hiç kimseye dua etmeyin﴾<\/span> [Cin 18]."], [382.6, "Yani O'nunla birlikte hiç kimseden istemeyin, ya da O'nunla birlikte hiç kimseye ibadet etmeyin. Allah en iyisini bilir."]]}, {"reader": false, "ar": [[392.0, "قال الإمام ابنُ تيميّة رحمه الله تعالى:"], [397.0, "«فإنّ الدعاء في القرآن يُراد به هذا تارةً، وهذا تارةً، ويُراد به مجموعُهما، وهما متلازمان؛ فإنّ دعاءَ المسألة هو طلبُ ما ينفع الداعي، وطلبُ كشفِ ما يضرّه ودفعِه. فهو يدعو للنفع والضرّ دعاءَ المسألة، ويدعو خوفًا ورجاءً دعاءَ العبادة»."], [425.0, "انتهى كلامه رحمه الله."]], "tr": [[392.0, "İmam İbn Teymiyye —Allah ona rahmet etsin— şöyle demiştir:"], [396.3, "\"Kur'an'daki dua ile bazen bu, bazen şu kastedilir;"], [399.7, "bazen de ikisinin toplamı kastedilir."], [401.8, "İkisi birbirinden ayrılmaz (mütelâzım)dır. Çünkü istek duası, dua edene fayda veren şeyi istemek ve ona zarar veren şeyin giderilmesini ve def edilmesini istemektir."], [416.6, "Kişi fayda ve zarar için istek duasıyla dua eder;"], [419.9, "korku ve ümitle de ibadet duasıyla dua eder.\" Onun —Allah ona rahmet etsin— sözü burada bitti."]]}]}, {"ts": "07:07", "title": "2. Külliye: Her ibadet duası istek duasını gerektirir, her istek duası ibadet duasını içerir", "paras": [{"reader": false, "ar": [[427.0, "ومن الكلّيّات أيضًا: كلُّ دعاءِ عبادةٍ فمستلزمٌ لدعاء المسألة،"], [448.0, "وكلُّ دعاءِ مسألةٍ فمتضمّنٌ لدعاء العبادة. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[427.0, "Külliyelerden biri de şudur: 2."], [431.0, "külliye: Her ibadet duası istek duasını gerektirir (müstelzimdir);"], [448.0, "her istek duası da ibadet duasını içerir (mütedammındır). (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[455.0, "أقول وبالله التوفيق: وهذه الكلّيّة قد نصّ عليها الإمامان الجليلان الفاضلان:"], [461.0, "ابنُ تيميّة رحمه الله،"], [463.7, "وتلميذُه الإمامُ العلّامة ابنُ القيّم،"], [467.0, "وغيرُهما من أهل السنة والجماعة."], [471.0, "وذلك لأنك متى ما كنتَ في دعاء عبادة فإنّ دعاء العبادة لا بدّ وأن يستلزم دعاءَ المسألة؛"], [483.0, "فإنه إن لم يحملْك طلبُ ثواب الله عز وجل على هذا التعبُّد فإنك لن تتعبّد."], [490.0, "فكلُّ من تعبّد لله بأيّ نوعٍ من أنواع العبادة فمن لوازم تعبُّده أنه يسأل اللهَ عز وجل الثوابَ على هذا التعبُّد،"], [500.3, "والوقايةَ من النار، ودخولَ الجنة،"], [503.3, "ومغفرةَ الذنوب، وسترَ العيوب."]], "tr": [[455.0, "Tevfik Allah'tandır, derim ki: Bu külliyeyi iki yüce ve faziletli imam açıkça ifade etmiştir:"], [462.3, "İbn Teymiyye —Allah ona rahmet etsin— ve talebesi imam, allâme İbnü'l-Kayyim;"], [469.4, "Ehl-i Sünnet ve'l-Cemaat'ten başkaları da (ifade etmiştir)."], [473.5, "Bu şundandır: Sen ne zaman bir ibadet duası içinde olursan, ibadet duası mutlaka istek duasını gerektirir."], [484.3, "Çünkü seni bu taabbuda Allah Azze ve Celle'nin sevabını istemek sevk etmezse, taabbud etmezsin."], [490.4, "Dolayısıyla ibadet türlerinden herhangi biriyle Allah'a taabbud eden herkesin taabbudunun lâzımlarından biri, Allah Azze ve Celle'den bu taabbuda karşılık sevap, ateşten korunmayı, cennete girmeyi, günahların bağışlanmasını ve ayıpların örtülmesini istemesidir."]]}, {"reader": false, "ar": [[506.0, "فنحن إنما نريد بتعبُّداتنا شيئًا من الله عز وجل."], [511.0, "فإذًا كلُّ من تعبّد لله بشيءٍ من دعاء العبادة ـ صلاةً،"], [515.8, "ركوعًا، سجودًا، طوافًا، رميًا ـ فإنّ تعبُّده هذا يستلزم أن ينطويَ قلبُه على سؤال الله عز وجل أن يُثيبَه على دعائه."], [529.0, "فصدق قولُنا بأنّ دعاء العبادة يستلزم دعاءَ المسألة،"], [533.0, "لكن ليس دعاءَ المسألة لسانيًّا، وإنما بدلالة الحال."]], "tr": [[506.0, "Biz taabbudlarımızla ancak Allah Azze ve Celle'den bir şey isteriz."], [510.4, "O hâlde ibadet duasından bir şeyle —namaz, rükû, secde, tavaf, taş atma— Allah'a taabbud eden herkesin bu taabbudu, kalbinin, Allah Azze ve Celle'nin kendisini duasından dolayı mükâfatlandırmasını isteme duygusunu taşımasını gerektirir."], [525.4, "Böylece \"ibadet duası istek duasını gerektirir\" sözümüz doğru çıkmış oldu;"], [531.0, "ancak bu, dil ile yapılan bir istek duası değil, hâlin delâletiyle (olan bir istektir)."]]}, {"reader": false, "ar": [[537.0, "وكذلك من وقف داعيًا لربّه عز وجل،"], [544.0, "سائلًا بلسانه شيئًا من حوائج الدين والدنيا،"], [548.0, "فإنّ مجرّد توحيد الله بالسؤال،"], [550.2, "ورفعِ اليدين إلى الله،"], [552.0, "واعتقادِ وجوده، وأنه القادرُ على ما تريد،"], [555.2, "هو في ذاته عبادة."], [557.1, "فإذًا دعاءُ المسألة يتضمّن بصورته أنك تعبد الله."]], "tr": [[537.0, "Aynı şekilde Rabbine Azze ve Celle dua ederek duran, diliyle din ve dünya ihtiyaçlarından bir şey isteyen kimse de böyledir:"], [548.9, "Sırf istekte Allah'ı birlemek, elleri Allah'a kaldırmak, O'nun varlığına ve istediğin şeye gücü yetenin O olduğuna inanmak, bizzat kendisi bir ibadettir."], [556.5, "O hâlde istek duası, sureti itibarıyla Allah'a ibadet ettiğini içerir."]]}, {"reader": false, "ar": [[563.0, "وسواءٌ عبّرنا في الوجهين بالاستلزام دون التضمّن فإنه جائز،"], [570.0, "لأنّ تضمُّن الشيء هو ما يلزم منه؛"], [575.0, "أو عبّرنا في الجهتين بالتضمّن فإنه جائز،"], [581.0, "لأنّ استلزام الشيء يتضمّنه."], [585.0, "ولكن مراعاةً للتعبير الوارد عن أهل السنة والجماعة قلنا في دعاء العبادة:"], [595.2, "إنه يستلزم أن تكون سائلًا بدلالة الحال لا بالمقال."]], "tr": [[563.0, "İki yönde de tedammun (içerme) yerine istilzam (gerektirme) ile ifade etsek bu caizdir;"], [570.7, "çünkü bir şeyin içerdiği, ondan lâzım gelen şeydir."], [575.0, "Ya da iki yönde de tedammun ile ifade etsek bu da caizdir;"], [582.7, "çünkü bir şeyi gerektirmek onu içermektir."], [587.2, "Fakat Ehl-i Sünnet ve'l-Cemaat'ten gelen ifadeye riayet ederek ibadet duası hakkında şöyle dedik:"], [595.8, "O, senin sözle değil hâlin delâletiyle isteyen biri olmanı gerektirir."]]}]}, {"ts": "10:01", "title": "2. Külliye (devam): Namazda iki duanın birleşmesi ve secdedeki duanın fazileti", "paras": [{"reader": false, "ar": [[601.0, "إلّا إذا كان دعاءُ العبادة في ذاته يتضمّن دعواتٍ في ثناياه؛"], [608.3, "كالصلاة، فإنها مشتملةٌ على نوعي الدعاء:"], [612.0, "فقيامُك دعاءُ عبادة، وقراءةُ الفاتحة وما تيسّر من القرآن دعاءُ عبادة،"], [619.0, "وركوعُك ورفعُك وسجودُك وجلوسُك وسلامُك وتشهّدُك كلُّها دعاءُ عبادة؛"], [624.0, "لكنّ دعاءَك في السجود،"], [627.0, "ودعاءَك في الجلسة بين السجدتين،"], [629.0, "هذا دعاءُ مسألة. وما أجملَ أن يجتمع الدعاءان <span class=\"q\">؟ 10:31<\/span>!"]], "tr": [[601.0, "Ancak ibadet duası bizzat kendisi, içinde birtakım dualar barındırıyorsa (durum farklıdır)."], [607.0, "Namaz gibi; o, iki dua türünü de kapsar:"], [611.4, "Kıyamın ibadet duasıdır; Fâtiha'yı ve Kur'an'dan kolayına geleni okuman ibadet duasıdır;"], [617.8, "rükûun, (rükûdan) kalkışın, secden, oturuşun, selâmın ve teşehhüdün, hepsi ibadet duasıdır."], [623.3, "Ama secdedeki duan ve iki secde arasındaki oturuştaki duan, işte bu istek duasıdır."], [629.7, "İki duanın bir araya gelmesi ne güzeldir <span class=\"q\">؟<\/span>!"]]}, {"reader": false, "ar": [[634.0, "ولذلك كلّما عظُمت جهةُ التعبُّد عظُم وقعُه وأثرُه."], [640.8, "فدعاءُ المسألة منفصلًا عن دعاء العبادة له فضلُه،"], [647.0, "لكن زِدْ عظمتَه بأن تجعله في عبادة،"], [651.0, "وزِدْ عظمتَه بأن تجعله في أفضل أجزاء هذه العبادة."], [657.0, "ولذلك دعاءُ المسألة في السجود أعظمُ الدعاء،"], [660.6, "و«أقربُ ما يكون العبدُ من ربّه وهو ساجد»."], [665.0, "لماذا؟ لأنه جمع عدّةَ فضائل في دعاء المسألة:"], [670.0, "فهو دعاءُ مسألة، وهذه فضيلةٌ أولى؛"], [673.9, "وفعلُه ساجدًا لله عز وجل،"], [677.1, "وهذه فضيلةٌ ثانية؛ ثم وضع دعاءه في قالَبِ تعبُّدٍ وهي الصلاة،"], [685.0, "فلا جرمَ أنّ هذا له فضيلتُه."]], "tr": [[634.0, "Bu yüzden taabbud yönü ne kadar büyük olursa, (duanın) etkisi ve tesiri de o kadar büyük olur."], [644.6, "İbadet duasından ayrı olarak istek duasının da kendine has bir fazileti vardır;"], [650.4, "ama onu bir ibadetin içinde yaparak büyüklüğünü artır, onu bu ibadetin en faziletli kısımlarında yaparak büyüklüğünü artır."], [658.6, "Bu yüzden secdedeki istek duası duaların en büyüğüdür ve \"Kulun Rabbine en yakın olduğu an, secdede olduğu andır.\" Niçin?"], [666.2, "Çünkü istek duasında birçok fazileti bir araya getirmiştir:"], [670.0, "Bu bir istek duasıdır, bu birinci fazilettir;"], [673.9, "onu Allah Azze ve Celle'ye secde ederek yapmıştır, bu ikinci fazilettir;"], [679.0, "sonra duasını bir taabbud kalıbının, yani namazın içine koymuştur."], [684.1, "Şüphesiz bunun da kendine has bir fazileti vardır."]]}, {"reader": false, "ar": [[688.0, "فإن كان في ثلث الليل الآخر أيضًا فضيلةٌ،"], [692.8, "فضيلةٌ زائدة. وكلّما عظُمت جهاتُ التعبُّد كلّما كان أعظمَ فضلًا،"], [701.0, "وأرجى استجابةً بإذنه عز وجل."], [704.0, "ولذلك قلتُ لكم بأنّ الدعاء الواردَ في القرآن حيثما تصرّف فيصحّ تفسيرُه بالأمرين؛"], [714.0, "لأنه إن كان السياق يتكلّم عن دعاء عبادة فهو متضمّنٌ لدعاء المسألة،"], [719.6, "فيصحّ تفسيرُ اللفظ الوارد بالتفسيرين،"], [722.0, "وإن كان اللفظ الواردُ يتكلّم عن دعاء المسألة فهو متضمّنٌ لدعاء العبادة. كما قال الناظم:"]], "tr": [[688.0, "Eğer bu, gecenin son üçte birinde olursa, bu da bir fazilettir, ilave bir fazilettir."], [694.0, "Taabbud yönleri ne kadar büyük olursa fazilet bakımından o kadar büyük olur ve Allah Azze ve Celle'nin izniyle icabete daha çok ümit edilir."], [707.4, "Bu yüzden size dedim ki:"], [710.1, "Kur'an'da geçen dua lafzı hangi türetilmiş hâliyle gelirse gelsin, onu iki anlamla tefsir etmek sahihtir."], [717.8, "Çünkü siyak bir ibadet duasından bahsediyorsa o, istek duasını içerir;"], [721.1, "dolayısıyla geçen lafzı iki tefsirle de açıklamak sahihtir."], [724.3, "Geçen lafız istek duasından bahsediyorsa o da ibadet duasını içerir. Nâzımın dediği gibi:"]]}, {"reader": false, "ar": [[730.3, "«إنّ الدعاءَ هو العبادةُ، وهو في ... عَقْدِ الشرائعِ يا فتى نوعانِ ۝ فدعاءُ مسألةٍ، كذاك عبادةٌ ... وكلاهما في النصِّ يتّفقانِ»؛"], [740.0, "كلاهما في النصّ يتّفقان. والله أعلم."]], "tr": [[730.3, "\"Dua, ibadetin ta kendisidir; ey genç, şeriatlerin düzeninde o iki türdür:"], [734.1, "İstek duası ve aynı şekilde ibadet (duası);"], [737.5, "ikisi de nassta birleşir.\" İkisi de nassta birleşir. Allah en iyisini bilir."]]}]}, {"ts": "12:25", "title": "3. Külliye: İbadet duasından bir şeyi Allah'tan başkasına yönelten şirke düşmüştür", "paras": [{"reader": false, "ar": [[745.0, "الكلّيّة الثالثة: <b>كلُّ من صرف شيئًا من دعاء العبادة لغير الله فقد أشرك<\/b>،"], [751.1, "بلا تفصيل. أي: «بلا تفصيل» هذه ليست من القاعدة،"], [755.0, "لكن «بلا تفصيل» من باب الشرح فقط."], [758.0, "تقول الكلّيّة: <b>كلُّ من صرف شيئًا من دعاء العبادة لغير الله فقد أشرك.<\/b> <span class=\"note\">(يكررها)<\/span> وذلك لأنّ دعاء العبادة يوصف من صرفه لغير الله عز وجل بأنه مشركٌ بلا تفصيل."]], "tr": [[745.0, "<b>3. külliye: İbadet duasından herhangi bir şeyi Allah'tan başkasına yönelten kimse şirke düşmüştür<\/b>;"], [750.6, "tafsilatsız olarak. Yani bu \"tafsilatsız\" ifadesi kaideden değildir;"], [754.1, "\"tafsilatsız\" sadece şerh babındandır. Külliye şöyle der:"], [757.1, "<b>3. külliye: İbadet duasından herhangi bir şeyi Allah'tan başkasına yönelten kimse şirke düşmüştür.<\/b> (Tekrar ediyor.) Bu şundandır:"], [767.7, "İbadet duasını Allah Azze ve Celle'den başkasına yönelten kimse, tafsilatsız olarak müşrik diye nitelenir."]]}, {"reader": false, "ar": [[789.0, "لا نقول: صرفَ دعاءِ العبادة فيما يقدر عليه الله <span class=\"q\">؟ 13:09<\/span>؛"], [794.0, "لا، إنما هذا التفصيل يأتينا في دعاء المسألة،"], [798.0, "وأمّا دعاءُ التعبُّد فإنه لا تفصيل فيه؛"], [803.0, "لقول الله عز وجل:"], [806.0, "<span class=\"ayah\">﴿وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ ۚ إِنَّ الَّذِينَ يَسْتَكْبِرُونَ عَنْ عِبَادَتِي سَيَدْخُلُونَ جَهَنَّمَ دَاخِرِينَ﴾<\/span> <span class=\"ref\">[غافر: ٦٠]<\/span>."], [813.0, "وقال الله عز وجل:"], [815.4, "<span class=\"ayah\">﴿قُلْ إِنَّ صَلَاتِي﴾<\/span> ـ وهي دعاءُ عبادة ـ <span class=\"ayah\">﴿وَنُسُكِي﴾<\/span> ـ وهو دعاءُ عبادة ـ ثم قال:"], [823.7, "<span class=\"ayah\">﴿وَمَحْيَايَ وَمَمَاتِي لِلَّهِ رَبِّ الْعَالَمِينَ ۝ لَا شَرِيكَ لَهُ ۖ وَبِذَٰلِكَ أُمِرْتُ وَأَنَا أَوَّلُ الْمُسْلِمِينَ﴾<\/span> <span class=\"ref\">[الأنعام: ١٦٢–١٦٣]<\/span>."], [833.0, "ويقول الله عز وجل في أقصر سورةٍ في القرآن:"], [838.6, "<span class=\"ayah\">﴿فَصَلِّ﴾<\/span> ـ وهو دعاءُ عبادة ـ <span class=\"ayah\">﴿لِرَبِّكَ وَانْحَرْ﴾<\/span> <span class=\"ref\">[الكوثر: ٢]<\/span>،"], [842.3, "والنحرُ لله عز وجل دعاءُ عبادة."]], "tr": [[789.0, "\"İbadet duasını Allah'ın gücü yettiği şeyde yöneltmek\" (ile ayırırız) <span class=\"q\">؟<\/span> demeyiz;"], [792.9, "hayır, bu tafsilat bize istek duasında gelecek."], [795.5, "İbadet duasına gelince, onda tafsilat yoktur."], [797.5, "Çünkü Allah Azze ve Celle şöyle buyurur:"], [800.9, "<span class=\"ayah\">﴿Rabbiniz dedi ki: Bana dua edin, size icabet edeyim. Bana ibadet etmeyi büyüklüklerine yediremeyenler, aşağılanmış olarak cehenneme gireceklerdir﴾<\/span> [Mü'min 60]."], [809.8, "Allah Azze ve Celle şöyle buyurdu:"], [812.5, "<span class=\"ayah\">﴿De ki: Şüphesiz benim namazım﴾<\/span> —ki o ibadet duasıdır— <span class=\"ayah\">﴿kurbanım (ibadetim)﴾<\/span> —ki o da ibadet duasıdır— sonra şöyle buyurdu:"], [820.5, "<span class=\"ayah\">﴿hayatım ve ölümüm âlemlerin Rabbi Allah içindir. O'nun hiçbir ortağı yoktur. Ben bununla emrolundum ve ben Müslümanların ilkiyim﴾<\/span> [En'âm 162–163]."], [831.1, "Allah Azze ve Celle Kur'an'ın en kısa sûresinde şöyle buyurur:"], [835.5, "<span class=\"ayah\">﴿Namaz kıl﴾<\/span> —ki bu ibadet duasıdır— <span class=\"ayah\">﴿Rabbin için ve kurban kes﴾<\/span> [Kevser 2]."], [841.0, "Allah Azze ve Celle için kurban kesmek de ibadet duasıdır."]]}, {"reader": false, "ar": [[846.0, "فإن قلتَ: ولماذا ذكر الصلاةَ والنحرَ ولم يذكر غيرَهما من دعاء العبادة؟"], [851.0, "نقول: إنّ العبادة إمّا أن تكون بدنيّةً محضة،"], [856.1, "أو ماليّةً محضة. فأعلى رتبةٍ في التعبُّدات البدنيّة المحضة هي الصلاة،"], [865.0, "فيدخل ما دونها فيها من باب أولى."], [871.0, "وأعظمُ التعبُّدات الماليّة المحضة الذبحُ لله عز وجل والنحر،"], [878.0, "فيدخل ما دونها من التعبُّدات الماليّة من باب أولى."], [883.0, "فتخصيصُ ذكر العبادتين في هذه السورة دون غيرهما من دعاء العبادة إنما هو تخصيصُ أعظميّة؛"], [892.0, "فما دون الصلاة من العبادات البدنيّة يدخل من باب أولى،"], [898.0, "وما دون النحر من العبادات الماليّة يدخل من باب أولى."]], "tr": [[846.0, "Eğer \"Neden namazı ve kurbanı zikretti de ibadet duasından başkasını zikretmedi?\" dersen, deriz ki:"], [851.6, "İbadet ya sırf bedenî ya da sırf malî olur."], [857.4, "Sırf bedenî taabbudlarda en yüksek mertebe namazdır;"], [862.4, "ondan aşağısı evleviyetle onun içine girer."], [867.9, "Sırf malî taabbudların en büyüğü de Allah Azze ve Celle için hayvan boğazlamak ve kurban kesmektir;"], [880.0, "malî taabbudlardan ondan aşağısı evleviyetle (onun içine) girer."], [884.6, "Dolayısıyla bu sûrede ibadet duasından diğerleri değil de bu iki ibadetin özellikle zikredilmesi, en büyük oldukları için yapılmış bir tahsistir."], [896.8, "Bedenî ibadetlerden namazdan aşağısı evleviyetle girer;"], [900.0, "malî ibadetlerden kurbandan aşağısı evleviyetle girer."]]}]}, {"ts": "15:03", "title": "3. Külliye (devam): İbadet duasının başkasına yöneltilmesini yasaklayan ayetler ve örnekler", "paras": [{"reader": false, "ar": [[903.0, "فاللهُ عز وجل أمرنا أن نصرف الصلاةَ والنحرَ له،"], [908.0, "ويدخل ما لم يُذكر فيهما،"], [913.0, "ويدخل ما لم يُذكر فيهما،"], [916.0, "وكلاهما من دعاء العبادة،"], [919.0, "فلا يجوز صرفُها لغير الله عز وجل."], [922.0, "ولذلك قال الله عز وجل:"], [924.0, "<span class=\"ayah\">﴿لَا تَسْجُدُوا﴾<\/span> ـ والسجودُ دعاءُ عبادةٍ يتضمّن دعاءَ المسألة ـ <span class=\"ayah\">﴿لَا تَسْجُدُوا﴾<\/span>،"], [931.0, "أي لا تصرفوا دعاءَ العبادة ـ وهو السجود ـ <span class=\"ayah\">﴿لِلشَّمْسِ وَلَا لِلْقَمَرِ وَاسْجُدُوا لِلَّهِ الَّذِي خَلَقَهُنَّ إِن كُنتُمْ إِيَّاهُ تَعْبُدُونَ﴾<\/span> <span class=\"ref\">[فصلت: ٣٧]<\/span>،"], [940.0, "فيدخل في ذلك كلُّ دعاءِ عبادة."]], "tr": [[903.0, "Allah Azze ve Celle bize namazı ve kurbanı O'na yöneltmemizi emretmiştir;"], [907.4, "bu ikisinde zikredilmeyenler de (bu emre) girer, bu ikisinde zikredilmeyenler de girer."], [915.4, "İkisi de ibadet duasındandır; dolayısıyla onları Allah Azze ve Celle'den başkasına yöneltmek caiz değildir."], [921.6, "Bu yüzden Allah Azze ve Celle şöyle buyurdu:"], [924.0, "<span class=\"ayah\">﴿Secde etmeyin﴾<\/span> —secde, istek duasını da içeren bir ibadet duasıdır— <span class=\"ayah\">﴿Secde etmeyin﴾<\/span>, yani ibadet duasını —ki o secdedir— yöneltmeyin:"], [934.0, "<span class=\"ayah\">﴿Güneşe de aya da secde etmeyin. Eğer yalnız O'na ibadet ediyorsanız, onları yaratan Allah'a secde edin﴾<\/span> [Fussılet 37]."], [940.4, "Bunun içine her ibadet duası girer."]]}, {"reader": false, "ar": [[944.0, "ولذلك قال الله عز وجل:"], [946.0, "<span class=\"ayah\">﴿وَمَن يَدْعُ مَعَ اللَّهِ إِلَٰهًا آخَرَ لَا بُرْهَانَ لَهُ بِهِ فَإِنَّمَا حِسَابُهُ عِندَ رَبِّهِ ۚ إِنَّهُ لَا يُفْلِحُ الْكَافِرُونَ﴾<\/span> <span class=\"ref\">[المؤمنون: ١١٧]<\/span>."], [955.0, "وقال الله عز وجل:"], [957.0, "<span class=\"ayah\">﴿وَلَا تَدْعُ﴾<\/span> ـ أي لا تعبدْ ـ <span class=\"ayah\">﴿مِن دُونِ اللَّهِ مَا لَا يَنفَعُكَ وَلَا يَضُرُّكَ ۖ فَإِن فَعَلْتَ فَإِنَّكَ إِذًا مِّنَ الظَّالِمِينَ﴾<\/span> <span class=\"ref\">[يونس: ١٠٦]<\/span>."], [963.0, "وقال الله عز وجل:"], [965.0, "<span class=\"ayah\">﴿وَأَنَّ الْمَسَاجِدَ﴾<\/span> ـ وهي دعاءُ عبادة،"], [970.0, "أي الصلاة ـ <span class=\"ayah\">﴿لِلَّهِ فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا﴾<\/span> <span class=\"ref\">[الجن: ١٨]<\/span>."], [973.0, "وقال الله عز وجل:"], [975.9, "<span class=\"ayah\">﴿فَاسْجُدُوا لِلَّهِ وَاعْبُدُوا﴾<\/span> <span class=\"ref\">[النجم: ٦٢]<\/span>. والآياتُ في ذلك كثيرة."]], "tr": [[944.0, "Bu yüzden Allah Azze ve Celle şöyle buyurdu:"], [946.0, "<span class=\"ayah\">﴿Kim Allah ile birlikte, hakkında hiçbir delili bulunmayan başka bir ilâha dua ederse, onun hesabı ancak Rabbinin katındadır. Şüphesiz kâfirler kurtuluşa eremez﴾<\/span> [Mü'minûn 117]."], [953.5, "Allah Azze ve Celle şöyle buyurdu:"], [956.5, "<span class=\"ayah\">﴿Dua etme﴾<\/span> —yani ibadet etme— <span class=\"ayah\">﴿Allah'ı bırakıp sana fayda da zarar da veremeyecek şeylere. Eğer bunu yaparsan, o takdirde sen zalimlerden olursun﴾<\/span> [Yûnus 106]."], [961.7, "Allah Azze ve Celle şöyle buyurdu:"], [963.0, "<span class=\"ayah\">﴿Mescitler﴾<\/span> —ki bu ibadet duasıdır, yani namaz— <span class=\"ayah\">﴿şüphesiz Allah'ındır. O hâlde Allah ile birlikte hiç kimseye dua etmeyin﴾<\/span> [Cin 18]."], [972.0, "Allah Azze ve Celle şöyle buyurdu:"], [973.7, "<span class=\"ayah\">﴿Artık Allah'a secde edin ve (O'na) ibadet edin﴾<\/span> [Necm 62]. Bu konudaki ayetler çoktur."]]}, {"reader": false, "ar": [[980.0, "وبناءً على ذلك: فكلُّ من صرف شيئًا من أنواع دعاء العبادة لغير الله فقد كفر،"], [986.0, "وأشرك الشركَ الأكبرَ المخرجَ من الملّة بالكلّيّة."], [989.0, "فمن ركع لغير الله فقد صرف دعاءَ عبادةٍ لغير الله،"], [994.0, "فيكون مشركًا. ومن سجد لغير الله فقد صرف دعاءَ عبادةٍ لغير الله،"], [999.2, "فيكون مشركًا. ومن صلّى لغير الله عز وجل،"], [1003.0, "فصلّى للصنم أو للقبر،"], [1006.0, "فيكون قد صرف دعاءَ عبادةٍ لغير الله، فيكون مشركًا."]], "tr": [[980.0, "Buna göre: İbadet duası türlerinden herhangi bir şeyi Allah'tan başkasına yönelten herkes küfre girmiş, kişiyi milletten tamamen çıkaran büyük şirke düşmüştür."], [987.7, "Allah'tan başkası için rükû eden, ibadet duasını Allah'tan başkasına yöneltmiştir;"], [992.0, "dolayısıyla müşrik olur. Allah'tan başkasına secde eden, ibadet duasını Allah'tan başkasına yöneltmiştir;"], [997.1, "dolayısıyla müşrik olur. Allah Azze ve Celle'den başkası için namaz kılan, puta ya da kabre namaz kılan kimse, ibadet duasını Allah'tan başkasına yöneltmiş olur; dolayısıyla müşrik olur."]]}, {"reader": false, "ar": [[1011.0, "ومن حجّ للقبور والمشاهد ـ فهو لا يحجّ لمكّة والمناسك،"], [1016.6, "وإنما يحجّ للقبور، كما يفعله الرافضة وعُبّادُ القبور وغُلاةُ الصوفية،"], [1023.0, "فإنهم يحجّون للمشاهد وقبور أوليائهم،"], [1026.0, "حتى يقول قائلُهم بأنّ الحجّ إلى مشهد فلانٍ وفلانٍ أعظمُ عند الله من ألف حجّةٍ لبيت الله الحرام ـ فيكونون قد صرفوا دعاءَ عبادة؛"], [1037.0, "لأنّ الحجّ بمناسكه دعاءُ عبادة."], [1040.0, "وكذلك الطوافُ يُقصد به التقرّبُ إلى الميّت أو القبر أو الصنم،"], [1045.0, "يكون قد صرف دعاءَ عبادةٍ لغير الله عز وجل."]], "tr": [[1011.0, "Kabirlere ve meşhedlere (türbelere) hacceden kimse —ki o Mekke'ye ve menâsike değil, kabirlere hacceder;"], [1019.0, "Râfıza'nın, kabir perestlerin ve aşırı sûfîlerin yaptığı gibi."], [1023.0, "Onlar meşhedlere ve velîlerinin kabirlerine hacceder;"], [1026.0, "hatta içlerinden biri, falan ve falanın meşhedine haccın Allah katında Beytullâh-ı Harâm'a yapılan bin hacdan daha büyük olduğunu söyler— böyleleri ibadet duasını (Allah'tan başkasına) yöneltmiş olurlar."], [1037.0, "Çünkü hac, menâsikiyle birlikte bir ibadet duasıdır."], [1040.5, "Ölüye, kabre ya da puta yaklaşmanın kastedildiği tavaf da böyledir;"], [1044.5, "(bunu yapan) ibadet duasını Allah Azze ve Celle'den başkasına yöneltmiş olur."]]}, {"reader": false, "ar": [[1049.0, "وكذلك الذبحُ تقرُّبًا وتعظيمًا هو من دعاء العبادة،"], [1053.0, "فصرفُه لغير الله عز وجل شرك."], [1056.0, "وكذلك من نذر لغير الله عز وجل،"], [1059.0, "فقال: نذرٌ للملائكة، نذرٌ للأنبياء،"], [1062.1, "نذرٌ للأولياء والصالحين؛ كلُّ ذلك من باب صرف دعاء العبادة لغير الله عز وجل،"], [1069.1, "فيكون شركًا. وكذلك التقرُّب للأموات بالصدقات؛"], [1072.9, "فهو يتصدّق ـ أي يفعل دعاءَ العبادة:"], [1076.0, "صدقةً ـ لا متقرّبًا بها إلى الله عز وجل،"], [1080.0, "وإنما متزلّفًا بها إلى هذا الميّت أو إلى هذا الوليّ،"], [1084.0, "فيكون ذلك من باب الشرك الأكبر."], [1087.0, "وهكذا نقوله في كلّ دعاءِ عبادةٍ صُرف لغير الله عز وجل."]], "tr": [[1049.0, "Yaklaşmak ve tazim etmek için hayvan boğazlamak da böyledir;"], [1052.5, "o, ibadet duasındandır, dolayısıyla onu Allah Azze ve Celle'den başkasına yöneltmek şirktir."], [1057.3, "Allah Azze ve Celle'den başkası için adakta bulunan da böyledir:"], [1061.5, "\"Meleklere adak, peygamberlere adak, velîlere ve sâlihlere adak\" der."], [1065.8, "Bunların hepsi ibadet duasını Allah Azze ve Celle'den başkasına yöneltme babındandır;"], [1070.0, "dolayısıyla şirk olur. Sadakalarla ölülere yaklaşmak da böyledir:"], [1074.0, "Kişi sadaka verir —yani bir ibadet duasını, sadakayı yapar— ama onunla Allah Azze ve Celle'ye yaklaşmak için değil, bu ölüye ya da bu velîye yaranmak için yapar."], [1084.5, "Bu da büyük şirk babından olur."], [1087.0, "Allah Azze ve Celle'den başkasına yöneltilen her ibadet duası hakkında da böyle deriz."]]}]}, {"ts": "18:13", "title": "4. Külliye: Sadece Allah'ın gücü yettiği bir şeyde Allah'tan başkasına istek duasıyla dua eden şirke düşmüştür", "paras": [{"reader": false, "ar": [[1093.0, "ويوضّح ذلك الكلّيّةُ الرابعة:"], [1096.0, "<b>كلُّ من دعا غيرَ الله دعاءَ مسألةٍ في الأمر الذي لا يقدر عليه إلا الله فقد أشرك.<\/b>"]], "tr": [[1093.0, "Bunu 4. külliye açıklar: 4."], [1096.6, "külliye: Sadece Allah'ın gücü yettiği bir şeyde Allah'tan başkasına istek duasıyla dua eden herkes şirke düşmüştür."]]}, {"reader": false, "ar": [[1106.0, "أقول وبالله التوفيق: وهذه الكلّيّة تتكلّم عن حكم صرف النوع الثاني من نوعي الدعاء لغير الله عز وجل،"], [1116.0, "وهي صرفُ دعاء المسألة لغير الله،"], [1119.2, "وهنا يأتي التفصيل بإجماع أهل السنة والجماعة."], [1123.0, "وذلك أنّ دعاء المسألة في بعض جزئيّاته لا يدخل في مسمّى العبادة أصلًا،"], [1129.0, "وفي بعض جزئيّاته يدخل في مسمّى العبادة."], [1133.0, "فإن قلتَ: ومتى يخرج دعاءُ المسألة عن مسمّى التعبُّد أصلًا؟"], [1138.0, "نقول: إذا تساءل الناسُ فيما بينهم أمرًا مقدورًا عليه،"], [1143.0, "وهذا أمرٌ كثيرٌ في كتاب الله عز وجل وسنّة نبيّه صلى الله عليه وسلم."]], "tr": [[1106.0, "Tevfik Allah'tandır, derim ki: Bu külliye, iki dua türünden ikincisini Allah Azze ve Celle'den başkasına yöneltmenin hükmünden bahseder;"], [1114.9, "o da istek duasını Allah'tan başkasına yöneltmektir."], [1118.7, "İşte burada, Ehl-i Sünnet ve'l-Cemaat'in icmâıyla tafsilat gelir."], [1122.5, "Şöyle ki: İstek duası, bazı cüz'î hâllerinde aslında ibadet kavramına hiç girmez;"], [1127.6, "bazı cüz'î hâllerinde ise ibadet kavramına girer."], [1131.3, "Eğer \"İstek duası ne zaman ibadet kavramının tamamen dışına çıkar?\" dersen, deriz ki:"], [1137.5, "İnsanlar kendi aralarında güç yetirilebilen bir şeyi birbirlerinden istediklerinde."], [1141.9, "Bu, Allah Azze ve Celle'nin Kitabı'nda ve Peygamberi'nin sallallâhu aleyhi ve sellem Sünneti'nde çokça geçen bir şeydir."]]}, {"reader": false, "ar": [[1150.0, "فإنه ثبت عنه صلى الله عليه وسلم أنه ربّما سأل غيرَه أشياءَ كثيرةً ممّا يقدر عليه المسؤول."], [1159.0, "فمتى ما كان دعاءُ المسألة متوجّهًا لغير الله،"], [1163.0, "لكن في الأمر الذي يقدر عليه المخلوق،"], [1166.0, "فإنّ هذا لا يدخل في حيّز التعبُّدات أصلًا،"], [1169.0, "ولا يُعتبر صرفُه لغير الله موجبًا لشيءٍ من العقوبات أو الأوصاف الشرعيّة."], [1177.0, "ففي «صحيح الإمام مسلم» من حديث عائشة رضي الله عنها قالت:"], [1183.0, "قال لي النبيّ صلى الله عليه وسلم:"], [1186.0, "«يا عائشة، ناوليني الخُمْرةَ من المسجد»؛"], [1189.8, "وهذا سؤال، فهو دعاءُ مسألة،"], [1192.8, "ولكنه في الأمر الذي يقدر عليه المسؤول."], [1197.0, "والأمثلةُ على ذلك كثيرة."]], "tr": [[1150.0, "Çünkü Peygamber sallallâhu aleyhi ve sellem'den, istenen kişinin gücünün yettiği birçok şeyi zaman zaman başkasından istediği sabit olmuştur."], [1159.5, "Dolayısıyla istek duası Allah'tan başkasına yöneldiğinde, ama mahlûkun gücünün yettiği bir şeyde olduğunda, bu aslında taabbudlar alanına hiç girmez."], [1167.9, "Onu Allah'tan başkasına yöneltmek de herhangi bir cezayı ya da şer'î vasfı gerektirir sayılmaz."], [1176.3, "İmam Müslim'in Sahîh'inde Âişe radıyallâhu anhâ'dan gelen hadiste şöyle dedi:"], [1181.4, "Peygamber sallallâhu aleyhi ve sellem bana şöyle buyurdu:"], [1185.6, "\"Ey Âişe, mescitten seccadeyi (humra) bana uzatıver.\" Bu bir istektir, dolayısıyla istek duasıdır;"], [1193.4, "ama istenen kişinin gücünün yettiği bir şeydedir. Bunun örnekleri çoktur."]]}, {"reader": false, "ar": [[1199.0, "بل لا تقوم مصالحُ الناس إلا إذا حكمنا على ذلك النوع <span class=\"q\">؟ 19:59<\/span>؛"], [1205.0, "لأنّ الأصل فيه الجوازُ والحِلُّ والإباحة،"], [1209.0, "ولا يتعلّق بشيءٍ من العقيدة أو التوحيد أبدًا."], [1214.0, "إلّا أنّ الأدلّة دلّت على أنّ تركَ سؤال المخلوق ـ ولو في الأمر المقدور عليه ـ من باب كمالات التوكّل؛"], [1223.0, "لكن حتى وإن فعله فإنه لا ينقص من إيمانه،"], [1230.0, "ولا من توحيده، ولا من عقيدته شيء."]], "tr": [[1199.0, "Hatta insanların maslahatları ancak bu tür hakkında (caizlik) hükmü verdiğimizde <span class=\"q\">؟<\/span> ayakta durur."], [1206.3, "Çünkü bunda asıl olan caizlik, helallik ve mubahlıktır;"], [1211.5, "akîde ya da tevhid ile asla bir ilgisi yoktur."], [1216.8, "Ancak deliller, mahlûktan istemeyi —gücü yetilen bir şeyde bile olsa— terk etmenin tevekkülün kemal derecelerinden olduğunu göstermiştir."], [1225.8, "Ama kişi bunu yapsa bile, imanından, tevhidinden ve akîdesinden hiçbir şey eksilmez."]]}, {"reader": false, "ar": [[1234.0, "فقد ثبت عن النبيّ صلى الله عليه وسلم أنه أخذ العهدَ على بعض أصحابه ألّا يسألوا الناسَ شيئًا،"], [1240.0, "فكان سوطُ أحدهم يسقط فلا يقول لمن دونه ـ أو لمن أسفلَ منه ـ:"], [1245.7, "ناولني. وفي حديث ثوبان رضي الله عنه قال:"], [1250.3, "قال النبيّ صلى الله عليه وسلم:"], [1252.0, "«من يكفلُ لي ألّا يسألَ الناسَ شيئًا وأكفلُ له الجنة؟» قال ثوبان:"], [1259.3, "أنا. فما سأل الناسَ شيئًا حتى مات."]], "tr": [[1234.0, "Peygamber sallallâhu aleyhi ve sellem'den sabit olmuştur ki, bazı ashabından insanlardan hiçbir şey istememeleri üzerine söz almıştır."], [1239.2, "Onlardan birinin kamçısı düşerdi de, kendisinden aşağıdakine —ya da aşağıda olana— \"Onu bana uzatıver\" demezdi."], [1245.3, "Sevbân radıyallâhu anh hadisinde şöyle dedi:"], [1248.0, "Peygamber sallallâhu aleyhi ve sellem buyurdu:"], [1250.9, "\"Kim insanlardan hiçbir şey istemeyeceğine dair bana kefil olur da ben de ona cennete kefil olayım?\" Sevbân \"Ben\" dedi."], [1260.0, "Ölünceye kadar insanlardan hiçbir şey istemedi."]]}, {"reader": false, "ar": [[1263.0, "فهذا من باب كمالات التوكّل على الله عز وجل،"], [1268.0, "وكمالات انقطاع علائق القلب من نفع الخلائق،"], [1274.0, "وهذه حالةٌ لا يستطيعها كلُّ أحد،"], [1277.0, "وإنما هي مقصورةٌ على من يسّرها الله عز وجل عليه."], [1282.0, "ولكننا نتكلّم عن صرف دعاء المسألة المتعلّق بمسائل التوحيد،"], [1287.0, "هذا لا يكون إلا فيما لو سألتَ غيرَ الله الأمرَ الذي لا يقدر عليه إلا الله تبارك وتعالى،"], [1295.0, "فحينئذٍ نقول: هنا قد كفرتَ وخرجتَ عن ملّة الإسلام بالكلّيّة."]], "tr": [[1263.0, "Bu, Allah Azze ve Celle'ye tevekkülün kemal derecelerinden ve kalbin bağlarının mahlûkatın faydasından tamamen kopmasının kemal derecelerindendir."], [1274.0, "Bu, herkesin güç yetirebileceği bir hâl değildir;"], [1277.5, "Allah Azze ve Celle'nin kendisine kolaylaştırdığı kimselere mahsustur."], [1281.0, "Fakat biz, tevhid meseleleriyle ilgili olan istek duasını (Allah'tan başkasına) yöneltmekten bahsediyoruz."], [1287.4, "Bu ancak, sadece Allah Tebâreke ve Teâlâ'nın gücü yettiği bir şeyi Allah'tan başkasından istediğinde olur."], [1293.7, "İşte o zaman deriz ki:"], [1296.0, "Burada küfre girdin ve İslam milletinden tamamen çıktın."]]}, {"reader": false, "ar": [[1300.0, "وسِرُّ ذلك: أنك لم تخصَّ هذا المخلوقَ بسؤاله أمرًا لا يقدر عليه المخلوق إلا لأنك تعتقد أنّ له قدرةً في تصرُّفٍ خفيٍّ في الكون لا يقدر عليه إلا هو،"], [1317.0, "فكأنك وصفتَه بشيءٍ من صفات الربوبية،"], [1322.0, "فجعلتَ له تدبيرًا لا يستطيعه سائرُ البشر،"], [1326.0, "أو تصريفًا في الكون لا يستطيعه سائرُ البشر."], [1329.0, "أنت خصصتَ هذا المسؤولَ بهذا السؤال الذي لا يقدر عليه المخلوقون لأنك تعتقد فيه شيئًا،"], [1337.0, "هذا الاعتقادُ هو الذي يجعلك خارجًا عن دائرة الإسلام بالكلّيّة."]], "tr": [[1300.0, "Bunun sırrı şudur: Sen, mahlûkun gücünün yetmediği bir şeyi istemekle bu mahlûku ancak, onun kâinatta yalnızca kendisinin güç yetirebildiği gizli bir tasarrufa kudreti olduğuna inandığın için hususileştirdin."], [1315.2, "Sanki onu rubûbiyyet sıfatlarından bir şeyle nitelemiş, ona diğer insanların güç yetiremeyeceği bir tedbir (idare) ya da kâinatta diğer insanların güç yetiremeyeceği bir tasarruf vermiş oldun."], [1329.0, "Sen, mahlûkların güç yetiremeyeceği bu isteği bu istenen kişiye, onun hakkında bir şeye inandığın için tahsis ettin."], [1337.7, "İşte bu inanç, seni İslam dairesinden tamamen çıkaran şeydir."]]}, {"reader": false, "ar": [[1344.0, "ولذلك ستأتينا كلّيّةٌ بعد قليل:"], [1347.1, "«كلُّ من غلا في مخلوقٍ حتى وصفه بشيءٍ من مقتضيات الربوبية فقد أشرك»."], [1355.0, "فلا يستقيم أبدًا في العقل ولا في فطرة الناس أن يخصّوا أحدًا بسؤالٍ خارجٍ عن دائرة قدرة المخلوقين،"], [1371.0, "إلا وهم يعتقدون فيه شيئًا من خصائص الربوبية أو الألوهية،"], [1375.0, "وأنه قادرٌ على بعض التصرّف الذي لا يقدر عليه غيره،"], [1380.0, "أو التدبير الذي لا يقدر عليه غيره."], [1383.0, "وخلاصتُه: أنه إنما فعل ذلك لاعتقاده أنّ له تدبيرًا خفيًّا في الكون،"], [1388.0, "وهذا هو حقيقةُ الشرك."]], "tr": [[1344.0, "Bu yüzden az sonra bize şu külliye gelecek:"], [1348.3, "\"Bir mahlûk hakkında, onu rubûbiyyetin gereklerinden bir şeyle niteleyecek kadar aşırıya giden herkes şirke düşmüştür.\" İnsanların, mahlûkların kudret dairesinin dışındaki bir istekle birini hususileştirmeleri, ancak onun hakkında rubûbiyyet ya da ulûhiyyet hasletlerinden bir şeye ve onun başkasının güç yetiremeyeceği bir tasarrufa ya da başkasının güç yetiremeyeceği bir tedbire gücü yettiğine inanmalarıyla olur;"], [1378.5, "bu ne akla ne de insanların fıtratına asla uygun düşmez."], [1382.6, "Özeti şudur: Kişi bunu, ancak onun kâinatta gizli bir tedbiri olduğuna inandığı için yapmıştır. İşte şirkin hakikati budur."]]}, {"reader": false, "ar": [[1391.0, "وقد وردت الأدلّةُ بكون هذا شركًا."], [1395.0, "وبالمناسبة: تجدون أنني أستدلّ بالآية تحت كلّيّاتٍ متعدّدةٍ من الدعاء؛"], [1401.0, "لأنها يصحّ أن تستدلّ بها على تحريم صرف دعاء العبادة،"], [1406.0, "ويصحّ أن تستدلّ بنفس الآية على تحريم صرف دعاء المسألة في الأمر الذي لا يقدر عليه إلا الله."], [1416.0, "وقد تنوّعت الأدلّةُ في هذا التحريم وبيانِ خطورته في العقيدة:"], [1423.0, "فتارةً تجد أنّ الله عز وجل يذكره بصيغة الأمر،"], [1431.0, "كقول الله عز وجل:"], [1433.8, "<span class=\"ayah\">﴿وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ﴾<\/span> <span class=\"ref\">[غافر: ٦٠]<\/span>،"], [1438.0, "ومن المتقرّر في القواعد أنّ الأمر بالشيء نهيٌ عن ضدّه،"], [1445.0, "فلمّا أمرنا اللهُ عز وجل أن ندعوه فهو يتضمّن ألّا ندعوَ غيرَه."]], "tr": [[1391.0, "Bunun şirk olduğuna dair deliller gelmiştir."], [1393.7, "Yeri gelmişken: Duayla ilgili birden fazla külliyenin altında aynı ayeti delil getirdiğimi görüyorsunuz."], [1400.4, "Çünkü onu ibadet duasını (Allah'tan başkasına) yöneltmenin haramlığına delil getirmen sahih olduğu gibi, aynı ayeti sadece Allah'ın gücü yettiği bir şeyde istek duasını (başkasına) yöneltmenin haramlığına delil getirmen de sahihtir."], [1413.8, "Bu haramlık ve bunun akîdedeki tehlikesinin açıklanması hususunda deliller çeşitlenmiştir:"], [1418.8, "Bazen Allah Azze ve Celle'nin bunu emir kalıbıyla zikrettiğini görürsün."], [1424.4, "Allah Azze ve Celle'nin şu sözü gibi:"], [1428.7, "<span class=\"ayah\">﴿Rabbiniz dedi ki: Bana dua edin, size icabet edeyim﴾<\/span> [Mü'min 60]."], [1436.7, "Kaidelerde yerleşmiş olan şudur: Bir şeyi emretmek, onun zıddını yasaklamaktır."], [1442.9, "Allah Azze ve Celle bize kendisine dua etmemizi emrettiğine göre, bu, O'ndan başkasına dua etmememizi de içerir."]]}, {"reader": false, "ar": [[1452.0, "وكذلك قولُ الله عز وجل:"], [1454.8, "<span class=\"ayah\">﴿فَادْعُوهُ مُخْلِصِينَ لَهُ الدِّينَ﴾<\/span> <span class=\"ref\">[غافر: ٦٥]<\/span>،"], [1457.0, "ادعوه مخلصين له الدين،"], [1461.0, "أي لا تدعوا غيرَه."], [1462.0, "وتارةً يأتينا بصيغة النهي،"], [1466.0, "كقول الله عز وجل:"], [1468.7, "<span class=\"ayah\">﴿وَأَنَّ الْمَسَاجِدَ لِلَّهِ فَلَا تَدْعُوا مَعَ اللَّهِ أَحَدًا﴾<\/span> <span class=\"ref\">[الجن: ١٨]<\/span>."], [1474.0, "فقد نوّعت الأدلّةُ في بيان خصوصيّة الله عز وجل بهذا الدعاء:"], [1478.0, "فتارةً بالأمر أن يُدعى الله،"], [1481.5, "والأمرُ بالشيء نهيٌ عن ضدّه؛"], [1486.0, "وتارةً بالنهي عن دعاء غير الله،"], [1489.5, "والنهيُ عن الشيء أمرٌ بضدّه؛"], [1493.0, "وتارةً يقرنه بالوعيد، يعني:"], [1497.7, "أنكم إن دعوتم غيري فأنتم متوعَّدون عندي بالعقوبة."]], "tr": [[1452.0, "Allah Azze ve Celle'nin şu sözü de böyledir:"], [1454.8, "<span class=\"ayah\">﴿Dini O'na has kılarak O'na dua edin﴾<\/span> [Mü'min 65]."], [1459.5, "Dini O'na has kılarak O'na dua edin, yani O'ndan başkasına dua etmeyin."], [1464.5, "Bazen de bize nehiy (yasak) kalıbıyla gelir."], [1468.7, "Allah Azze ve Celle'nin şu sözü gibi:"], [1472.0, "<span class=\"ayah\">﴿Mescitler şüphesiz Allah'ındır. O hâlde Allah ile birlikte hiç kimseye dua etmeyin﴾<\/span> [Cin 18]."], [1476.9, "Deliller, bu duanın Allah Azze ve Celle'ye mahsus olduğunu açıklamada çeşitlenmiştir:"], [1480.8, "Bazen Allah'a dua edilmesini emrederek —bir şeyi emretmek onun zıddını yasaklamaktır—;"], [1487.2, "bazen Allah'tan başkasına dua etmeyi yasaklayarak —bir şeyi yasaklamak onun zıddını emretmektir—;"], [1493.0, "bazen de onu tehditle birlikte zikrederek."], [1497.7, "Yani: Eğer Benden başkasına dua ederseniz, katımda cezayla tehdit edilmişsinizdir."]]}]}, {"ts": "25:04", "title": "4. Külliye (devam): Delillerin çeşitliliği — tehdit, ulûhiyyetin takriri, inkâr, meydan okuma", "paras": [{"reader": false, "ar": [[1504.0, "كقول الله عز وجل:"], [1506.0, "<span class=\"ayah\">﴿فَلَا تَدْعُ مَعَ اللَّهِ إِلَٰهًا آخَرَ فَتَكُونَ مِنَ الْمُعَذَّبِينَ﴾<\/span> <span class=\"ref\">[الشعراء: ٢١٣]<\/span>."], [1510.0, "وتارةً بتقرير أنه المستحقُّ للألوهية والعبادة،"], [1519.0, "كقوله: <span class=\"ayah\">﴿وَلَا تَدْعُ مَعَ اللَّهِ إِلَٰهًا آخَرَ ۘ لَا إِلَٰهَ إِلَّا هُوَ ۚ كُلُّ شَيْءٍ هَالِكٌ إِلَّا وَجْهَهُ﴾<\/span> <span class=\"ref\">[القصص: ٨٨]<\/span>."], [1527.0, "وتارةً يقرّر اللهُ ذلك بمعنى الإنكار على الداعي،"], [1537.0, "كقوله: <span class=\"ayah\">﴿وَلَا تَدْعُ مِن دُونِ اللَّهِ مَا لَا يَنفَعُكَ وَلَا يَضُرُّكَ﴾<\/span> <span class=\"ref\">[يونس: ١٠٦]<\/span>،"], [1543.0, "وهذا صيغةُ إنكار؛ إذ كيف ـ كأنه قال:"], [1546.8, "كيف تدعو من دون الله ما لا ينفعك ولا يضرّك؟!"]], "tr": [[1504.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1506.0, "<span class=\"ayah\">﴿Allah ile birlikte başka bir ilâha dua etme; yoksa azap edilenlerden olursun﴾<\/span> [Şuarâ 213]."], [1510.8, "Bazen de ulûhiyyete ve ibadete layık olanın O olduğunu takrir ederek."], [1519.9, "Şu sözü gibi: <span class=\"ayah\">﴿Allah ile birlikte başka bir ilâha dua etme. O'ndan başka ilâh yoktur. O'nun zâtı dışında her şey helak olacaktır﴾<\/span> [Kasas 88]."], [1529.2, "Bazen de Allah bunu dua edeni kınama (inkâr) anlamıyla takrir eder."], [1538.1, "Şu sözü gibi: <span class=\"ayah\">﴿Allah'ı bırakıp sana fayda da zarar da veremeyecek şeylere dua etme﴾<\/span> [Yûnus 106]."], [1544.3, "Bu bir inkâr kalıbıdır; çünkü nasıl —sanki şöyle demiştir:"], [1547.2, "Allah'ı bırakıp sana fayda da zarar da veremeyecek şeye nasıl dua edersin?!"]]}, {"reader": false, "ar": [[1554.0, "وتارةً بمعنى الإخبار والاستخبار،"], [1557.4, "كقول الله عز وجل:"], [1559.0, "<span class=\"ayah\">﴿قُلْ أَرَأَيْتُم مَّا تَدْعُونَ مِن دُونِ اللَّهِ أَرُونِي مَاذَا خَلَقُوا مِنَ الْأَرْضِ أَمْ لَهُمْ شِرْكٌ فِي السَّمَاوَاتِ ۖ ائْتُونِي بِكِتَابٍ مِّن قَبْلِ هَٰذَا أَوْ أَثَارَةٍ مِّنْ عِلْمٍ إِن كُنتُمْ صَادِقِينَ﴾<\/span> <span class=\"ref\">[الأحقاف: ٤]<\/span>."], [1573.0, "وتارةً بصيغة الإنكار المغلَّظ،"], [1577.0, "كقول الله عز وجل:"], [1579.0, "<span class=\"ayah\">﴿قُلِ ادْعُوا الَّذِينَ زَعَمْتُم مِّن دُونِ اللَّهِ ۖ لَا يَمْلِكُونَ مِثْقَالَ ذَرَّةٍ فِي السَّمَاوَاتِ وَلَا فِي الْأَرْضِ وَمَا لَهُمْ فِيهِمَا مِن شِرْكٍ وَمَا لَهُ مِنْهُم مِّن ظَهِيرٍ﴾<\/span> <span class=\"ref\">[سبأ: ٢٢]<\/span> <span class=\"note\">(Şeyh «من دونه» diyor)<\/span>."]], "tr": [[1554.0, "Bazen de haber verme ve soru sorma anlamıyla."], [1557.8, "Allah Azze ve Celle'nin şu sözü gibi:"], [1560.0, "<span class=\"ayah\">﴿De ki: Allah'ı bırakıp da dua ettiklerinizi gördünüz mü? Gösterin bana, yeryüzünden neyi yaratmışlar? Yoksa onların göklerde bir ortaklığı mı var? Eğer doğru söyleyenlerseniz, bundan önceki bir kitabı ya da bir ilim kalıntısını bana getirin﴾<\/span> [Ahkâf 4]."], [1571.6, "Bazen de ağır bir inkâr kalıbıyla."], [1573.8, "Allah Azze ve Celle'nin şu sözü gibi:"], [1578.0, "<span class=\"ayah\">﴿De ki: Allah'ı bırakıp da (ilâh) sandıklarınıza dua edin. Onlar ne göklerde ne de yerde zerre ağırlığınca bir şeye sahip değillerdir. Onların ikisinde (göklerde ve yerde) hiçbir ortaklıkları yoktur; O'nun da onlardan hiçbir yardımcısı yoktur﴾<\/span> [Sebe' 22] <span class=\"note\">(Şeyh «O'nu bırakıp» diyor)<\/span>."]]}, {"reader": false, "ar": [[1591.0, "وكقول الله عز وجل:"], [1593.0, "<span class=\"ayah\">﴿وَالَّذِينَ تَدْعُونَ مِن دُونِهِ مَا يَمْلِكُونَ مِن قِطْمِيرٍ ۝ إِن تَدْعُوهُمْ لَا يَسْمَعُوا دُعَاءَكُمْ وَلَوْ سَمِعُوا مَا اسْتَجَابُوا لَكُمْ ۖ وَيَوْمَ الْقِيَامَةِ يَكْفُرُونَ بِشِرْكِكُمْ ۚ وَلَا يُنَبِّئُكَ مِثْلُ خَبِيرٍ﴾<\/span> <span class=\"ref\">[فاطر: ١٣–١٤]<\/span>."], [1606.0, "وتارةً يُخبر بأنّ هؤلاء الذين استفرغتم أعمارَكم في دعائهم سيتبرّؤون منكم يوم القيامة،"], [1618.0, "كقول الله عز وجل:"], [1619.9, "<span class=\"ayah\">﴿وَمَنْ أَضَلُّ مِمَّن يَدْعُو مِن دُونِ اللَّهِ مَن لَّا يَسْتَجِيبُ لَهُ إِلَىٰ يَوْمِ الْقِيَامَةِ وَهُمْ عَن دُعَائِهِمْ غَافِلُونَ ۝ وَإِذَا حُشِرَ النَّاسُ كَانُوا لَهُمْ أَعْدَاءً وَكَانُوا بِعِبَادَتِهِمْ كَافِرِينَ﴾<\/span> <span class=\"ref\">[الأحقاف: ٥–٦]<\/span> <span class=\"note\">(Şeyh burada «من دون الله» kısmını okumuyor)<\/span>."]], "tr": [[1591.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1593.0, "<span class=\"ayah\">﴿O'nu bırakıp da dua ettikleriniz, bir hurma çekirdeğinin zarına bile sahip değillerdir. Onlara dua etseniz duanızı işitmezler; işitseler bile size cevap veremezler. Kıyamet gününde de sizin şirkinizi inkâr ederler. (Her şeyden) haberdar olan (Allah) gibi kimse sana haber veremez﴾<\/span> [Fâtır 13–14]."], [1606.7, "Bazen de, ömürlerinizi kendilerine dua etmekle tükettiğiniz bu kimselerin kıyamet gününde sizden teberrî edeceklerini (uzak duracaklarını) haber verir."], [1618.0, "Allah Azze ve Celle'nin şu sözü gibi:"], [1619.9, "<span class=\"ayah\">﴿Allah'ı bırakıp da kıyamet gününe kadar kendisine cevap veremeyecek olanlara dua edenden daha sapık kim vardır? Onlar bunların dualarından habersizdirler. İnsanlar (mahşerde) toplandığında, onlar bunlara düşman olurlar ve onların ibadetlerini inkâr ederler﴾<\/span> [Ahkâf 5–6] <span class=\"note\">(Şeyh burada «Allah'ı bırakıp» kısmını okumuyor)<\/span>."]]}, {"reader": false, "ar": [[1632.0, "وتارةً بسلب ملكيّة المدعوّ ما تدعوه به،"], [1640.0, "كقول الله عز وجل:"], [1643.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ تَدْعُونَ مِن دُونِ اللَّهِ عِبَادٌ أَمْثَالُكُمْ ۖ فَادْعُوهُمْ فَلْيَسْتَجِيبُوا لَكُمْ إِن كُنتُمْ صَادِقِينَ﴾<\/span> <span class=\"ref\">[الأعراف: ١٩٤]<\/span>."], [1651.0, "وكقول الله عز وجل:"], [1653.0, "<span class=\"ayah\">﴿يَا أَيُّهَا النَّاسُ ضُرِبَ مَثَلٌ فَاسْتَمِعُوا لَهُ ۚ إِنَّ الَّذِينَ تَدْعُونَ مِن دُونِ اللَّهِ﴾<\/span> ـ إيش؟"], [1661.0, "لا ـ <span class=\"ayah\">﴿لَن يَخْلُقُوا ذُبَابًا وَلَوِ اجْتَمَعُوا لَهُ ۖ وَإِن يَسْلُبْهُمُ الذُّبَابُ شَيْئًا لَّا يَسْتَنقِذُوهُ مِنْهُ﴾<\/span> <span class=\"ref\">[الحج: ٧٣]<\/span>."], [1670.0, "وكما قال الله عز وجل:"], [1672.0, "<span class=\"ayah\">﴿مَا يَمْلِكُونَ مِن قِطْمِيرٍ﴾<\/span> <span class=\"ref\">[فاطر: ١٣]<\/span>؛"], [1674.0, "أي كيف تتركون دعاءَ من خزائنُه عامرةٌ في السماوات والأرض،"], [1680.0, "ويملك كلَّ شيء، وتُقبِلُ قلوبُكم على دعاء من لا يملك قِطميرًا ـ وهي لُفافةُ النواة؟!"], [1686.0, "<span class=\"ayah\">﴿سُبْحَانَكَ هَٰذَا بُهْتَانٌ عَظِيمٌ﴾<\/span> <span class=\"ref\">[النور: ١٦]<\/span>،"], [1689.0, "ولكنّ «الإنسانَ ظلومٌ كفّار» <span class=\"note\">(mushafta: <span class=\"ayah\">﴿إِنَّ الْإِنسَانَ لَظَلُومٌ كَفَّارٌ﴾<\/span> <span class=\"ref\">[إبراهيم: ٣٤]<\/span>)<\/span>."]], "tr": [[1632.0, "Bazen de dua edilenin, kendisinden istediğin şeye sahip olmadığını bildirerek."], [1636.5, "Allah Azze ve Celle'nin şu sözü gibi:"], [1643.0, "<span class=\"ayah\">﴿Allah'ı bırakıp da dua ettikleriniz, sizin gibi kullardır. Eğer doğru söyleyenlerseniz, haydi onlara dua edin de size cevap versinler﴾<\/span> [A'râf 194]."], [1650.5, "Allah Azze ve Celle'nin şu sözü gibi:"], [1653.0, "<span class=\"ayah\">﴿Ey insanlar! Bir misal verildi, onu dinleyin: Allah'ı bırakıp da dua ettikleriniz﴾<\/span> —ne?"], [1657.0, "Hayır— <span class=\"ayah\">﴿bunun için bir araya gelseler bile bir sinek dahi yaratamazlar. Sinek onlardan bir şey kapsa, onu ondan kurtaramazlar﴾<\/span> [Hac 73]."], [1666.6, "Allah Azze ve Celle'nin buyurduğu gibi:"], [1668.9, "<span class=\"ayah\">﴿Bir hurma çekirdeğinin zarına bile sahip değillerdir﴾<\/span> [Fâtır 13]."], [1671.6, "Yani hazineleri göklerde ve yerde dolu olan ve her şeye sahip olana dua etmeyi nasıl bırakıyor da, kalpleriniz bir kıtmîre —ki o hurma çekirdeğinin zarıdır— bile sahip olmayana dua etmeye yöneliyor?!"], [1682.7, "<span class=\"ayah\">﴿Seni tenzih ederiz, bu büyük bir iftiradır﴾<\/span> [Nûr 16]."], [1685.3, "Fakat \"insan çok zalim, çok nankördür\" <span class=\"note\">(mushafta: <span class=\"ayah\">﴿Şüphesiz insan çok zalim, çok nankördür﴾<\/span> [İbrâhîm 34])<\/span>."]]}]}, {"ts": "28:13", "title": "4. Külliye (devam): «Dua ibadetin ta kendisidir»", "paras": [{"reader": false, "ar": [[1693.0, "وتارةً يخبرنا بأنّ الدعاء هو حقيقةُ العبادة،"], [1702.0, "كما أخرجه الترمذيُّ في «جامعه» بإسنادٍ صحيح من حديث النعمان بن بشير،"], [1707.1, "في قول النبيّ صلى الله عليه وسلم:"], [1710.0, "«إنّ الدعاءَ هو العبادة»؛"], [1712.0, "بمعنى أنّ العبادة التي جئتُكم بها من عند الله حقيقتُها أنها دعاء؛"], [1718.0, "لأنّ المشروعات إمّا أن تكون من دعاء العبادة،"], [1722.0, "أو من دعاء المسألة،"], [1724.0, "ولا يخرج مشروعٌ عن واحدٍ من هذين النوعين."]], "tr": [[1693.0, "Bazen de duanın ibadetin hakikati olduğunu bize haber verir."], [1702.4, "Nitekim Tirmizî bunu Câmi'inde sahih bir isnadla Nu'mân b."], [1706.2, "Beşîr hadisinden, Peygamber sallallâhu aleyhi ve sellem'in şu sözünde rivayet etmiştir:"], [1710.5, "\"Şüphesiz dua, ibadetin ta kendisidir.\" Yani size Allah katından getirdiğim ibadetin hakikati, onun bir dua olmasıdır."], [1718.0, "Çünkü meşru kılınan şeyler ya ibadet duasından ya da istek duasındandır;"], [1723.5, "hiçbir meşru şey bu iki türden birinin dışına çıkmaz."]]}, {"reader": false, "ar": [[1728.0, "فالنبيّ عليه الصلاة والسلام جاءنا بالشهادتين وهي دعاءُ عبادة،"], [1733.2, "وبالصلاة وهي دعاءُ عبادة،"], [1734.8, "وبالحجّ وهو دعاءُ عبادة،"], [1736.4, "وبالصوم وهو دعاءُ عبادة،"], [1738.0, "وبالمسألة وهي دعاءُ مسألة،"], [1740.7, "وغيرِ ذلك. فإذًا لا تخرج التعبُّداتُ المشروعة عن كونها دعاءً؛"], [1747.4, "إذن العبادةُ هي الدعاءُ بنوعيه."], [1751.0, "وقال الله عز وجل:"], [1753.7, "<span class=\"ayah\">﴿قُلْ إِنَّمَا أَدْعُو رَبِّي وَلَا أُشْرِكُ بِهِ أَحَدًا﴾<\/span> <span class=\"ref\">[الجن: ٢٠]<\/span>."], [1759.0, "وأخبر الله عز وجل أنّ دعاءَ غيره شركٌ في آياتٍ كثيرة،"], [1764.1, "حتى لا أُطيلَ عليكم."]], "tr": [[1728.0, "Peygamber aleyhissalâtu vesselâm bize iki şehadeti getirdi, o bir ibadet duasıdır;"], [1732.8, "namazı getirdi, o bir ibadet duasıdır;"], [1734.4, "haccı getirdi, o bir ibadet duasıdır;"], [1736.0, "orucu getirdi, o bir ibadet duasıdır;"], [1738.0, "istemeyi getirdi, o bir istek duasıdır;"], [1740.7, "ve bunlardan başkasını. Demek ki meşru taabbudlar dua olmaktan çıkmaz;"], [1745.4, "o hâlde ibadet, iki türüyle birlikte duanın ta kendisidir."], [1750.2, "Allah Azze ve Celle şöyle buyurdu:"], [1753.0, "<span class=\"ayah\">﴿De ki: Ben ancak Rabbime dua ederim ve O'na hiç kimseyi ortak koşmam﴾<\/span> [Cin 20]."], [1759.9, "Allah Azze ve Celle, O'ndan başkasına dua etmenin şirk olduğunu birçok ayette haber vermiştir; sözü size uzatmayayım."]]}, {"reader": false, "ar": [[1766.0, "فاللهُ عز وجل هو المستحقُّ لأن يُدعى،"], [1770.2, "ولا يُدعى غيرُه. ولذلك صار أكرمَ شيءٍ على الله عز وجل الدعاءُ."], [1778.0, "وأخبر اللهُ عز وجل ـ في الحديث الحسن ـ بأنه «حييٌّ كريم، يستحيي إذا رفع الرجلُ إليه يديه أن يردّهما صِفرًا»."], [1787.0, "وقال صلى الله عليه وسلم:"], [1789.0, "«لا يردُّ القضاءَ إلا الدعاءُ»."], [1791.0, "وقال صلى الله عليه وسلم:"], [1793.1, "«ليس شيءٌ أكرمَ على الله من الدعاء»."]], "tr": [[1766.0, "Dua edilmeye layık olan Allah Azze ve Celle'dir;"], [1769.6, "O'ndan başkasına dua edilmez. Bu yüzden Allah Azze ve Celle katında en kıymetli şey dua olmuştur."], [1778.0, "Allah Azze ve Celle —hasen hadiste— kendisinin \"hayâ sahibi ve kerem sahibi olduğunu;"], [1782.7, "kişi ellerini O'na kaldırdığında onları boş çevirmekten hayâ ettiğini\" haber vermiştir."], [1787.0, "Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1789.4, "\"Kazayı ancak dua geri çevirir.\" Peygamber sallallâhu aleyhi ve sellem şöyle buyurdu:"], [1793.1, "\"Allah katında duadan daha kıymetli hiçbir şey yoktur.\""]]}, {"reader": false, "ar": [[1796.0, "وبناءً على ذلك: فدعاءُ الأموات شركٌ أكبرُ مخرجٌ من الملّة؛"], [1802.0, "لأنه دعاءُ مسألةٍ في أمرٍ لا يقدر عليه إلا الله،"], [1807.0, "فإنّ الميّت عاجزٌ عن نفع نفسه بأقلّ الأشياء،"], [1811.0, "فكيف تطلب منه أن ينفعك في أعظم الأشياء؟!"], [1814.0, "وكذلك دعاءُ الغائبين أيضًا هو من الشرك الأكبر؛"], [1820.0, "لأنك لم تدعُ هذا الغائبَ إلا لاعتقادك أنّ له تصرُّفًا خفيًّا في الكون،"], [1826.1, "يسمعك ويُغيثك. وكذلك دعاءُ الحاضرين في الأمر الذي لا يقدر عليه إلا الله عز وجل؛"], [1835.0, "لأنك لم تفعل ذلك إلا لاعتقادك أنّ له تصرُّفًا خفيًّا في الكون."]], "tr": [[1796.0, "Buna göre: Ölülere dua etmek, kişiyi milletten çıkaran büyük şirktir."], [1801.4, "Çünkü bu, sadece Allah'ın gücü yettiği bir şeyde istek duasıdır."], [1806.0, "Ölü, en küçük şeyde bile kendisine fayda vermekten âcizdir;"], [1810.0, "en büyük şeylerde sana fayda vermesini ondan nasıl istersin?!"], [1813.2, "Gâiblere (orada olmayanlara) dua etmek de büyük şirktendir."], [1817.6, "Çünkü bu gâibe ancak, onun kâinatta seni işiten ve sana yardım eden gizli bir tasarrufu olduğuna inandığın için dua edersin."], [1827.0, "Sadece Allah Azze ve Celle'nin gücü yettiği bir şeyde hazır olanlara dua etmek de böyledir."], [1835.4, "Çünkü bunu ancak, onun kâinatta gizli bir tasarrufu olduğuna inandığın için yaparsın."]]}]}, {"ts": "30:40", "title": "4. Külliye (devam): İbn Huzeyme, İbn Teymiyye, İbnü'l-Kayyim ve İbn Akîl'den nakiller", "paras": [{"reader": false, "ar": [[1840.0, "وما أجملَ ما قاله ابنُ خزيمة رحمه الله تعالى!"], [1845.0, "قال: «هل سمعتم عالمًا يُجيز أن يقول الداعي: أعوذ بالكعبة من شرّ ما خلق؟ أو يُجيز أن يقول: أعوذ بالصفا والمروة، أو: أعوذ بعرفاتٍ ومِنًى من شرّ ما خلق؟» يقول:"], [1860.4, "سمعتم أحدًا يقول كذا؟"], [1862.0, "«هذا لا يقوله ولا يُجيز القولَ به مسلمٌ يعرف دينَ الله؛ محالٌ أن يستعيذ مسلمٌ بخلقٍ من خلق الله»."], [1872.0, "يعني ـ ها يا جماعة ـ أنه لا يمكن أن يصرف هذا التعبُّدَ العظيم لغير الله تبارك وتعالى."], [1881.0, "ثم قال: «والاستعاذةُ بغير الله دعاءٌ لغير الله»."]], "tr": [[1840.0, "İbn Huzeyme'nin —Allah ona rahmet etsin— söylediği söz ne güzeldir!"], [1844.4, "Şöyle dedi: \"Dua eden kişinin 'Yarattığı şeylerin şerrinden Kâbe'ye sığınırım' demesini caiz gören bir âlim işittiniz mi?"], [1851.0, "Ya da 'Safâ ile Merve'ye sığınırım' veya 'Yarattığı şeylerin şerrinden Arafat'a ve Minâ'ya sığınırım' demesini caiz gören (bir âlim işittiniz mi)?\" Diyor ki:"], [1862.5, "Böyle diyen birini işittiniz mi?"], [1864.3, "\"Allah'ın dinini bilen hiçbir Müslüman bunu söylemez ve söylenmesini caiz görmez."], [1869.5, "Bir Müslümanın Allah'ın yarattıklarından bir yaratığa sığınması muhaldir.\" Yani —ey cemaat— bu büyük taabbudu Allah Tebâreke ve Teâlâ'dan başkasına yöneltmesi mümkün değildir."], [1881.0, "Sonra şöyle dedi: \"Allah'tan başkasına sığınmak, Allah'tan başkasına duadır.\""]]}, {"reader": false, "ar": [[1884.0, "وقد نقل الإمامُ ابنُ تيميّة الإجماعَ على ما قرّرته هذه الكلّيّة،"], [1889.0, "فقال رحمه الله: «فمن جعل الملائكةَ والأنبياءَ وسائطَ يدعوهم ويتوكّل عليهم ويسألهم جلبَ المنافع ودفعَ المضارّ ـ مثل أن يسألهم غفرانَ الذنب»،"], [1899.1, "وهذا أمرٌ لا يقدر عليه إلا الله،"], [1902.0, "«وهدايةَ القلوب»، وهو أمرٌ لا يقدر عليه إلا الله،"], [1905.0, "«وتفريجَ الكروب وسدَّ الفاقات ـ فهو كافرٌ بإجماع المسلمين». انتهى كلامه."]], "tr": [[1884.0, "İmam İbn Teymiyye, bu külliyenin takrir ettiği şey üzerine icmâ nakletmiştir."], [1887.6, "Şöyle demiştir —Allah ona rahmet etsin—:"], [1889.5, "\"Kim melekleri ve peygamberleri vasıtalar edinir, onlara dua eder, onlara tevekkül eder ve onlardan faydaları celbetmeyi ve zararları defetmeyi isterse —mesela onlardan günahın bağışlanmasını istemek gibi\", ki bu sadece Allah'ın gücü yettiği bir şeydir, \"kalplerin hidayetini (istemek gibi)\", ki bu da sadece Allah'ın gücü yettiği bir şeydir, \"sıkıntıların giderilmesini ve yoksullukların kapatılmasını (istemek gibi)— o, Müslümanların icmâıyla kâfirdir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[1911.0, "وقال رحمه الله: «فكلُّ من غلا في نبيٍّ أو رجلٍ صالح، وجعل فيه نوعًا من الإلهيّة، مثل أن يدعوَه من دون الله، بأن يقول: يا سيّدي فلان أغثني، أو أجِرني، أو أنت حسبي، أو أنا في حسبك؛ فكلُّ هذا شركٌ وضلال، يُستتاب صاحبُه، فإن تاب وإلا قُتل»."], [1935.0, "انتهى كلامه رحمه الله."]], "tr": [[1911.0, "(İbn Teymiyye) —Allah ona rahmet etsin— şöyle dedi:"], [1912.8, "\"Bir peygamber ya da sâlih bir adam hakkında aşırıya giden ve onda bir tür ilâhlık gören herkes —mesela Allah'ı bırakıp ona dua etmesi gibi;"], [1920.3, "'Ey efendim falan, bana yetiş' ya da 'beni koru' ya da 'sen bana yetersin' ya da 'ben senin himayendeyim' demesi gibi— bunların hepsi şirk ve dalâlettir."], [1928.5, "Sahibinden tevbe etmesi istenir; tevbe ederse (ne âlâ), yoksa öldürülür.\" Onun —Allah ona rahmet etsin— sözü burada bitti."]]}, {"reader": false, "ar": [[1938.0, "وقال أيضًا: «لم يقل أحدٌ من علماء المسلمين إنه يُستغاث بشيءٍ من المخلوقات في كلّ ما يُستغاث فيه اللهُ تعالى، لا بنبيٍّ، ولا بملَك، ولا بصالح، ولا غير ذلك؛ بل هذا ممّا يُعلم بالاضطرار من دين الإسلام أنه لا يجوز إطلاقُه»."], [1958.0, "انتهى كلامه. وقال أيضًا في موضعٍ آخر:"], [1961.0, "«ومن قال: إنّ ميّتًا من الموتى ـ نفيسةَ أو غيرَها ـ تُجير الخائف، وتخلّص المحبوس، وتقضي الحوائج؛ فهو ضالٌّ مشرك، فإنّ الله سبحانه هو الذي يُجير ولا يُجار عليه، وبابُ الحوائج إلى الله هو دعاؤه بصدقٍ وإخلاص»."]], "tr": [[1938.0, "Yine şöyle dedi: \"Müslüman âlimlerden hiçbiri, Allah Teâlâ'dan yardım istenen her şeyde mahlûkattan bir şeyden yardım istenebileceğini söylememiştir;"], [1944.9, "ne bir peygamberden, ne bir melekten, ne bir sâlihten, ne de başkasından."], [1950.3, "Aksine bunun mutlak olarak söylenmesinin caiz olmadığı, İslam dininden zarurî olarak bilinen şeylerdendir.\" Sözü burada bitti."], [1957.5, "Başka bir yerde de şöyle dedi:"], [1959.8, "\"Kim ölülerden bir ölünün —Nefîse veya başkasının— korkana eman verdiğini, hapsedileni kurtardığını ve ihtiyaçları giderdiğini söylerse, o sapık bir müşriktir."], [1972.0, "Çünkü eman veren ve kendisine karşı eman verilemeyen, ancak Allah Sübhânehû'dur."], [1977.8, "Allah'a ihtiyaçları arz etmenin kapısı, O'na sıdk ve ihlasla dua etmektir.\""]]}, {"reader": false, "ar": [[1984.0, "وقال رحمه الله: «سؤالُ الميّت والغائب ـ نبيًّا كان أو غيرَه ـ من المحرّمات المنكَرة باتّفاق أئمّة المسلمين، لم يأمر اللهُ به ولا رسولُه صلى الله عليه وسلم، ولا فعله أحدٌ من الصحابة ولا التابعين لهم بإحسان، ولا استحسنه أحدٌ من أئمّة المسلمين، وهذا ممّا يُعلم بالاضطرار من دين المسلمين». انتهى كلامه."]], "tr": [[1984.0, "(İbn Teymiyye) —Allah ona rahmet etsin— şöyle dedi:"], [1987.4, "\"Ölüden ve gâibden —peygamber olsun ya da başkası— istemek, Müslümanların imamlarının ittifakıyla münker haramlardandır."], [1993.4, "Ne Allah ne de Resûlü sallallâhu aleyhi ve sellem bunu emretmiştir;"], [1997.0, "ne sahabeden ne de onlara güzellikle tâbi olanlardan hiç kimse bunu yapmıştır;"], [2001.0, "Müslümanların imamlarından hiç kimse de bunu güzel görmemiştir."], [2004.8, "Bu, Müslümanların dininden zarurî olarak bilinen şeylerdendir.\" Sözü burada bitti."]]}, {"reader": false, "ar": [[2009.0, "وقال الإمامُ ابنُ القيّم رحمه الله وهو يبيّن أنواعَ الشرك:"], [2013.0, "«ومن أنواعه طلبُ الحوائج من الموتى، والاستغاثةُ بهم، والتوجّهُ إليهم، وهذا أصلُ شرك العالَم؛ فإنّ الميّت قد انقطع عملُه، وهو لا يملك لنفسه ضرًّا ولا نفعًا، فضلًا عمّن استغاث به وسأله قضاءَ حاجته، أو سأله أن يشفع له إلى الله عز وجل»."], [2036.0, "وقال الإمامُ أبو الوفاء ابنُ عقيلٍ الحنبليّ رحمه الله:"], [2041.5, "«إنّ من يعظّم القبور، ويخاطب الموتى بقضاء الحوائج، ويقول: يا مولاي، أو: يا سيّدي عبدَ القادر، افعل لي كذا؛ هو كافرٌ بهذه الأوضاع، ومن دعا ميّتًا وطلب قضاءَ الحوائج منه فهو كافر»."]], "tr": [[2009.0, "İmam İbnü'l-Kayyim —Allah ona rahmet etsin— şirkin türlerini açıklarken şöyle dedi:"], [2012.6, "\"Onun türlerinden biri de ihtiyaçları ölülerden istemek, onlardan yardım dilemek ve onlara yönelmektir."], [2019.7, "Bu, âlemin şirkinin aslıdır. Çünkü ölünün ameli kesilmiştir;"], [2023.9, "o kendisine bile ne bir zarar ne de bir fayda verebilir;"], [2028.4, "kaldı ki ondan yardım dileyen, ihtiyacını gidermesini isteyen ya da Allah Azze ve Celle katında kendisine şefaat etmesini isteyen kimseye (versin).\" İmam Ebü'l-Vefâ İbn Akîl el-Hanbelî —Allah ona rahmet etsin— şöyle dedi:"], [2042.1, "\"Kabirleri tazim eden, ölülere ihtiyaçlarını gidermeleri için hitap eden ve 'Ey mevlâm' ya da 'Ey efendim Abdülkâdir, bana şunu yap' diyen kimse, bu hâllerle kâfirdir."], [2054.9, "Bir ölüye dua eden ve ondan ihtiyaçlarını gidermesini isteyen kimse kâfirdir.\""]]}]}, {"ts": "34:21", "title": "4. Külliye (sonu): Müşriklerin Allah'ı yeryüzü krallarına kıyas etmesi", "paras": [{"reader": false, "ar": [[2061.0, "ثم أختم ذلك بنقلٍ عظيمٍ عن ابن تيميّة،"], [2063.7, "قال: «والعجبُ من ذي عقلٍ سليم يستوحي ممّن هو ميّت، ويستغيث به، ولا يستغيث بالحيّ الذي لا يموت! فيقول أحدُهم: إذا كانت لك حاجةٌ إلى ملِكٍ توسّلتَ إليه بأعوانه، فهكذا يُتوسَّل إليه» ـ أي إلى الله عز وجل ـ «بالشيوخ. وهذا كلامُ أهل الشرك والضلال؛ فإنّ الملِك لا يعلم حوائجَ رعيّته، ولا يقدر على قضائها وحده، ولا يريد ذلك إلا لغرضٍ يحصل له بسبب ذلك؛ واللهُ أعلمُ بكلّ شيء، <span class=\"ayah\">﴿يَعْلَمُ السِّرَّ وَأَخْفَى﴾<\/span> <span class=\"ref\">[طه: ٧]<\/span>، وهو على كلّ شيءٍ قدير، فالأسبابُ منه وإليه»."], [2125.0, "انتهى كلامه رحمه الله."]], "tr": [[2061.0, "Sonra bunu İbn Teymiyye'den büyük bir nakille bitiriyorum."], [2062.7, "Şöyle dedi: \"Sağlam akıl sahibi birinin ölü olandan medet (vahiy/ilham) beklemesi ve ondan yardım dilemesi de, hiç ölmeyecek olan Hayy'dan (diri olandan) yardım dilememesi ne şaşılacak şeydir!"], [2079.1, "İçlerinden biri şöyle der: 'Bir krala ihtiyacın olduğunda, onun yardımcılarını ona vesile edinirsin;"], [2087.0, "işte O'na da' —yani Allah Azze ve Celle'ye— 'şeyhler vesile edinilir.' Bu, şirk ve dalâlet ehlinin sözüdür."], [2096.6, "Çünkü kral, tebaasının ihtiyaçlarını bilmez, onları tek başına gidermeye gücü yetmez ve bunu ancak bu sebeple kendisine hâsıl olacak bir maksat için ister."], [2107.6, "Allah ise her şeyi en iyi bilendir;"], [2110.3, "<span class=\"ayah\">﴿O, gizliyi de ondan daha gizli olanı da bilir﴾<\/span> [Tâhâ 7]."], [2116.6, "O her şeye gücü yetendir;"], [2119.1, "sebepler O'ndandır ve O'na döner.\" Onun —Allah ona rahmet etsin— sözü burada bitti."]]}, {"reader": false, "ar": [[2127.0, "فقياسُ أهل الشرك قضاءَ الحوائج من الله عز وجل على ما يحصل عند ملوك الأرض؛"], [2135.0, "فإنّ ملوك الأرض لا يعلمون حوائجَ رعيّتهم،"], [2138.0, "ولا يسألون عنها، فهم محتاجون لهؤلاء الحُجّاب والأعوان ليوصلوا حوائجَ الرعيّة لهم."], [2145.0, "وغالبًا ملوكُ الأرض لا يبذلون الأموالَ لأصحاب الحوائج إلا لرغبةٍ أو رهبةٍ يستجلبونها أو يستدفعونها."], [2156.0, "أمّا الله عز وجل فإنه لا يخفى عليه شيءٌ من حوائج خلقه،"], [2161.0, "بل إنه ما تمرّ ليلةٌ من الليالي إلا وينزل اللهُ عز وجل فيها فيقول:"], [2167.0, "«من يسألني فأُعطيَه؟ من يدعوني فأستجيبَ له؟ من يستغفرني فأغفرَ له؟» وفي رواية الإمام مسلم:"], [2175.4, "فيمدّ يده: «من يُقرض غيرَ عَدُومٍ ولا ظَلوم؟» حتى ينفجر الفجر. والله أعلم."]], "tr": [[2127.0, "Müşrikler, ihtiyaçların Allah Azze ve Celle tarafından giderilmesini, yeryüzü krallarının yanında olanlara kıyas etmişlerdir."], [2132.3, "Oysa yeryüzü kralları tebaalarının ihtiyaçlarını bilmezler ve onları sormazlar;"], [2136.3, "bu yüzden tebaanın ihtiyaçlarını kendilerine ulaştırmaları için bu kapıcılara ve yardımcılara muhtaçtırlar."], [2140.6, "Yeryüzü kralları çoğunlukla ihtiyaç sahiplerine malı, ancak elde etmek istedikleri bir arzu ya da savuşturmak istedikleri bir korku için verirler."], [2152.0, "Allah Azze ve Celle'ye gelince, O'na yarattıklarının ihtiyaçlarından hiçbir şey gizli kalmaz."], [2157.7, "Hatta hiçbir gece geçmez ki Allah Azze ve Celle o gecede nüzul etmesin ve şöyle buyurmasın:"], [2162.7, "\"Benden isteyen yok mu, ona vereyim?"], [2164.9, "Bana dua eden yok mu, ona icabet edeyim?"], [2167.5, "Benden bağışlanma dileyen yok mu, onu bağışlayayım?\" İmam Müslim'in rivayetinde ise:"], [2172.5, "Elini uzatır (ve buyurur): \"Fakir olmayan ve zulmetmeyen (Rabbe) kim borç verir?\" Bu, fecir doğuncaya kadar (devam eder). Allah en iyisini bilir."]]}]}, {"ts": "36:22", "title": "5. Külliye: Her mabud, kıyamet günü kendisine ibadet edenden teberrî eder", "paras": [{"reader": false, "ar": [[2183.3, "ومن الكلّيّات أيضًا: <b>كلُّ معبودٍ فسيتبرّأ من عابده ويكون له عدوًّا يوم القيامة.<\/b> كلُّ معبودٍ من دون الله عز وجل فسيتبرّأ من عابده ويكون له عدوًّا يوم القيامة. <span class=\"note\">(يكررها)<\/span>"]], "tr": [[2183.3, "Külliyelerden biri de şudur: 5."], [2185.3, "külliye: Her mabud, kendisine ibadet edenden teberrî edecek (uzak duracak) ve kıyamet günü ona düşman olacaktır. Allah Azze ve Celle'yi bırakıp ibadet edilen her mabud, kendisine ibadet edenden teberrî edecek ve kıyamet günü ona düşman olacaktır. (Tekrar ediyor.)"]]}, {"reader": false, "ar": [[2230.0, "أقول وبالله التوفيق: وهذا بغضّ النظر عن المعبود،"], [2234.0, "سواءٌ أكان من المعبود العُلويّ أو المعبود السُّفليّ."], [2241.0, "وأعني بالمعبود العُلويّ: أي الملائكة."], [2245.0, "وأعني بالمعبود السُّفليّ: أي الأنبياءَ والأولياءَ والأوثانَ والأشجارَ والأحجارَ والكهوفَ والمغاراتِ وغيرَها ممّا عُبِد من دون الله عز وجل."], [2255.0, "فإنّ كلَّ من عُبِد من دون الله عز وجل فإنه لا بدّ وأن يتبرّأ ممّن يعبده يوم القيامة."]], "tr": [[2230.0, "Tevfik Allah'tandır, derim ki: Bu, mabudun kim olduğuna bakılmaksızın böyledir;"], [2234.0, "ister yukarı âlemden bir mabud olsun ister aşağı âlemden bir mabud."], [2242.6, "Yukarı âlemden mabud ile melekleri kastediyorum."], [2246.1, "Aşağı âlemden mabud ile de peygamberleri, velileri, putları, ağaçları, taşları, kovukları, mağaraları ve Allah Azze ve Celle'yi bırakıp ibadet edilen diğer şeyleri kastediyorum."], [2256.8, "Çünkü Allah Azze ve Celle'yi bırakıp ibadet edilen herkes, kıyamet günü kendisine ibadet edenden mutlaka teberrî edecektir."]]}, {"reader": false, "ar": [[2266.0, "وقد أخبر القرآنُ بهذه الحقيقة في آياتٍ متعدّدة،"], [2272.0, "فقال الله عز وجل:"], [2274.0, "<span class=\"ayah\">﴿وَاتَّخَذُوا مِن دُونِ اللَّهِ آلِهَةً لِّيَكُونُوا لَهُمْ عِزًّا ۝ كَلَّا﴾<\/span> ـ أي ليس الأمرُ كما يظنّون،"], [2285.0, "بل حقيقةُ الأمر أنه ماذا؟"], [2288.0, "ـ <span class=\"ayah\">﴿سَيَكْفُرُونَ بِعِبَادَتِهِمْ وَيَكُونُونَ عَلَيْهِمْ ضِدًّا﴾<\/span> <span class=\"ref\">[مريم: ٨١–٨٢]<\/span>."], [2293.0, "فقولُه: <span class=\"ayah\">﴿سَيَكْفُرُونَ﴾<\/span> أي سيتبرّؤون،"], [2295.0, "وقولُه: <span class=\"ayah\">﴿ضِدًّا﴾<\/span> أي عدوًّا يعاديهم ويتبرّأ منهم أمام الله عز وجل، ومن عبادتهم."]], "tr": [[2266.0, "Kur'an bu hakikati birçok ayette haber vermiştir."], [2268.9, "Allah Azze ve Celle şöyle buyurmuştur:"], [2272.5, "<span class=\"ayah\">﴿Kendilerine bir izzet (güç kaynağı) olsunlar diye Allah'ı bırakıp ilâhlar edindiler. Hayır!﴾<\/span> —yani iş onların sandığı gibi değil;"], [2282.0, "peki işin hakikati nedir?— <span class=\"ayah\">﴿(O ilâhlar) onların ibadetlerini inkâr edecekler ve onların aleyhine hasım olacaklar﴾<\/span> [Meryem 81–82]."], [2289.6, "<span class=\"ayah\">﴿İnkâr edecekler﴾<\/span> sözü \"teberrî edecekler\" demektir."], [2294.0, "<span class=\"ayah\">﴿Hasım﴾<\/span> sözü de onlara düşmanlık eden ve Allah Azze ve Celle'nin huzurunda onlardan ve onların ibadetlerinden teberrî eden bir düşman demektir."]]}, {"reader": false, "ar": [[2304.0, "ولذلك قال الإمامُ مجاهدٌ رحمه الله في قول الله عز وجل:"], [2309.0, "<span class=\"ayah\">﴿وَيَكُونُونَ عَلَيْهِمْ ضِدًّا﴾<\/span>: «أي عونًا عليهم، وضدَّهم، تخاصمهم وتكذّبهم»."], [2315.0, "وقال قتادة: «قُرَناءَ في النار، يلعن بعضُهم بعضًا، ويكفر بعضُهم ببعض»."]], "tr": [[2304.0, "Bu yüzden İmam Mücâhid —Allah ona rahmet etsin— Allah Azze ve Celle'nin <span class=\"ayah\">﴿ve onların aleyhine hasım olacaklar﴾<\/span> sözü hakkında şöyle demiştir:"], [2309.7, "\"Yani onların aleyhine yardımcı ve onlara karşı hasım olurlar;"], [2313.7, "onlarla husumet ederler ve onları yalanlarlar.\" Katâde de şöyle demiştir:"], [2317.5, "\"Ateşte birbirine yoldaş olurlar; birbirlerine lanet ederler ve birbirlerini inkâr ederler.\""]]}, {"reader": false, "ar": [[2322.0, "وقال الله عز وجل:"], [2323.8, "<span class=\"ayah\">﴿وَمَنْ أَضَلُّ مِمَّن يَدْعُو مِن دُونِ اللَّهِ مَن لَّا يَسْتَجِيبُ لَهُ إِلَىٰ يَوْمِ الْقِيَامَةِ وَهُمْ عَن دُعَائِهِمْ غَافِلُونَ ۝ وَإِذَا حُشِرَ النَّاسُ كَانُوا لَهُمْ أَعْدَاءً﴾<\/span> ـ أي عدوًّا ـ <span class=\"ayah\">﴿وَكَانُوا بِعِبَادَتِهِمْ كَافِرِينَ﴾<\/span> <span class=\"ref\">[الأحقاف: ٥–٦]<\/span>؛ أي يتبرّؤون منهم."]], "tr": [[2322.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [2323.8, "<span class=\"ayah\">﴿Allah'ı bırakıp da kıyamet gününe kadar kendisine cevap veremeyecek olanlara dua edenden daha sapık kim vardır? Onlar bunların dualarından habersizdirler. İnsanlar (mahşerde) toplandığında, onlar bunlara düşman olurlar﴾<\/span> —yani düşman— <span class=\"ayah\">﴿ve onların ibadetlerini inkâr ederler﴾<\/span> [Ahkâf 5–6]; yani onlardan teberrî ederler."]]}]}, {"ts": "39:02", "title": "Meleklerin, Îsâ aleyhisselâmın ve uyulanların teberrîsi", "paras": [{"reader": false, "ar": [[2342.0, "وقال الله عز وجل عن الملائكة،"], [2347.0, "قال: <span class=\"ayah\">﴿وَيَوْمَ يَحْشُرُهُمْ جَمِيعًا ثُمَّ يَقُولُ لِلْمَلَائِكَةِ أَهَٰؤُلَاءِ إِيَّاكُمْ كَانُوا يَعْبُدُونَ ۝ قَالُوا سُبْحَانَكَ أَنتَ وَلِيُّنَا مِن دُونِهِم ۖ بَلْ كَانُوا يَعْبُدُونَ الْجِنَّ ۖ أَكْثَرُهُم بِهِم مُّؤْمِنُونَ﴾<\/span> <span class=\"ref\">[سبأ: ٤٠–٤١]<\/span>."]], "tr": [[2342.0, "Allah Azze ve Celle melekler hakkında şöyle buyurmuştur:"], [2345.8, "<span class=\"ayah\">﴿O gün (Allah) onların hepsini toplar, sonra meleklere: \"Bunlar size mi ibadet ediyorlardı?\" der. (Melekler) derler ki: \"Sen (her türlü noksandan) münezzehsin! Bizim velimiz onlar değil, Sensin. Hayır, onlar cinlere ibadet ediyorlardı; çoğu onlara iman ediyordu.\"﴾<\/span> [Sebe' 40–41]."]]}, {"reader": false, "ar": [[2366.0, "وقال الله عز وجل عن عيسى ـ وقد عُبِد في الأرض من دون الله عز وجل ـ:"], [2373.0, "<span class=\"ayah\">﴿وَإِذْ قَالَ اللَّهُ يَا عِيسَى ابْنَ مَرْيَمَ أَأَنتَ قُلْتَ لِلنَّاسِ اتَّخِذُونِي وَأُمِّيَ إِلَٰهَيْنِ مِن دُونِ اللَّهِ ۖ قَالَ سُبْحَانَكَ مَا يَكُونُ لِي أَنْ أَقُولَ مَا لَيْسَ لِي بِحَقٍّ ۚ إِن كُنتُ قُلْتُهُ فَقَدْ عَلِمْتَهُ ۚ تَعْلَمُ مَا فِي نَفْسِي وَلَا أَعْلَمُ مَا فِي نَفْسِكَ ۚ إِنَّكَ أَنتَ عَلَّامُ الْغُيُوبِ ۝ مَا قُلْتُ لَهُمْ إِلَّا مَا أَمَرْتَنِي بِهِ أَنِ اعْبُدُوا اللَّهَ رَبِّي وَرَبَّكُمْ ۚ وَكُنتُ عَلَيْهِمْ شَهِيدًا مَّا دُمْتُ فِ
