يهِمْ ۖ فَلَمَّا تَوَفَّيْتَنِي كُنتَ أَنتَ الرَّقِيبَ عَلَيْهِمْ ۚ وَأَنتَ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ﴾<\/span> <span class=\"ref\">[المائدة: ١١٦–١١٧]<\/span>."]], "tr": [[2366.0, "Allah Azze ve Celle, yeryüzünde Allah Azze ve Celle'yi bırakıp kendisine ibadet edilmiş olan Îsâ hakkında şöyle buyurmuştur:"], [2372.5, "<span class=\"ayah\">﴿Allah: \"Ey Meryem oğlu Îsâ! İnsanlara, 'Allah'ı bırakıp beni ve annemi iki ilâh edinin' diye sen mi söyledin?\" dediğinde, o şöyle der: \"Sen münezzehsin! Hakkım olmayan bir şeyi söylemek bana yakışmaz. Eğer onu söylemişsem, sen onu zaten bilirsin. Sen benim içimde olanı bilirsin, ben ise senin zâtında olanı bilmem. Şüphesiz gaybları hakkıyla bilen ancak Sensin. Ben onlara, bana emrettiğin şeyden başkasını söylemedim: 'Benim de Rabbim, sizin de Rabbiniz olan Allah'a ibadet edin.' Aralarında bulunduğum sürece onların üzerine şahit idim. Beni vefat ettirince (aralarından alınca) üzerlerine gözetleyici yalnız Sen oldun. Sen her şeye şahitsin.\"﴾<\/span> [Mâide 116–117]."]]}, {"reader": false, "ar": [[2408.0, "وقال الله عز وجل:"], [2410.0, "<span class=\"ayah\">﴿إِذْ تَبَرَّأَ الَّذِينَ اتُّبِعُوا مِنَ الَّذِينَ اتَّبَعُوا وَرَأَوُا الْعَذَابَ وَتَقَطَّعَتْ بِهِمُ الْأَسْبَابُ﴾<\/span> <span class=\"ref\">[البقرة: ١٦٦]<\/span>."], [2420.0, "وقال الله عز وجل:"], [2421.5, "<span class=\"ayah\">﴿وَقَالَ إِنَّمَا اتَّخَذْتُم مِّن دُونِ اللَّهِ أَوْثَانًا مَّوَدَّةَ بَيْنِكُمْ فِي الْحَيَاةِ الدُّنْيَا ۖ ثُمَّ يَوْمَ الْقِيَامَةِ يَكْفُرُ بَعْضُكُم بِبَعْضٍ وَيَلْعَنُ بَعْضُكُم بَعْضًا وَمَأْوَاكُمُ النَّارُ وَمَا لَكُم مِّن نَّاصِرِينَ﴾<\/span> <span class=\"ref\">[العنكبوت: ٢٥]<\/span> <span class=\"note\">(Şeyh «من ناصر» diyor)<\/span>."]], "tr": [[2408.0, "Allah Azze ve Celle şöyle buyurmuştur:"], [2410.0, "<span class=\"ayah\">﴿O zaman kendilerine uyulanlar, kendilerine uyanlardan teberrî ederler; azabı görürler ve aralarındaki bütün bağlar kopar﴾<\/span> [Bakara 166]."], [2420.4, "Allah Azze ve Celle şöyle buyurmuştur:"], [2421.9, "<span class=\"ayah\">﴿(İbrâhim) dedi ki: \"Siz, dünya hayatında aranızdaki sevgi (bağı) yüzünden Allah'ı bırakıp putlar edindiniz. Sonra kıyamet gününde birbirinizi inkâr edecek ve birbirinize lanet edeceksiniz. Varacağınız yer ateştir; hiç yardımcılarınız da yoktur.\"﴾<\/span> [Ankebût 25]."]]}, {"reader": false, "ar": [[2437.0, "فأعظمُ ما يريده المعبودُ من عابده:"], [2440.8, "نُصرتُه، وعِزُّه، وحمايتُه، ومَنَعتُه،"], [2443.3, "وكلُّ ذلك لا حقيقةَ له عند الله عز وجل."], [2449.0, "فأوّلُ ما يخذُلُ المعبودَ ممّن كان يعبده،"], [2453.0, "وأوّلُ من يتبرّأ من المعبود مَن كان يعبده،"], [2457.0, "وأوّلُ جدارٍ ينهدم على المعبود هو جدارُ من كان يعبده."], [2464.0, "فنسأل الله عز وجل أن يُحيِيَنا على التوحيد،"], [2468.1, "وأن يُميتَنا عليه، وآخرُ دعوانا أنِ الحمدُ لله ربِّ العالمين،"], [2473.0, "وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[2437.0, "Mabudun kendisine ibadet edenden istediği en büyük şey;"], [2440.8, "onun yardımı, izzeti (güç vermesi), himayesi ve koruyup savunmasıdır."], [2445.8, "Bunların hepsinin Allah Azze ve Celle katında hiçbir hakikati yoktur."], [2451.3, "Mabudu ilk yüzüstü bırakan, ona ibadet edenlerdir;"], [2454.5, "mabuddan ilk teberrî eden, ona ibadet edendir;"], [2457.7, "mabudun üzerine ilk yıkılan duvar, ona ibadet edenin duvarıdır."], [2463.3, "Allah Azze ve Celle'den bizi tevhid üzere yaşatmasını ve onun üzere öldürmesini dileriz."], [2469.3, "Son duamız, âlemlerin Rabbi Allah'a hamd olsun (demektir)."], [2472.6, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;

const doc=document.getElementById("doc"),AR=[],TR=[];

  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });

let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
