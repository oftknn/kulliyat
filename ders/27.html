<script>
const D={"no": 27, "vid": "q7PiUzLOhXk", "title_ar": "الدرس (٢٧) من شرح كليات العقيدة — كليات في باب البدع", "title_tr": "Şerhu Külliyyâti'l-Akîde — 27. Ders: Bid'at Babına Dair Külliyeler (İbadeti Başlatma ve Bitirme, Dünyevî İhdas, Müçtehidin Hatası, Mükeffir ve Müfessık Bid'at Sahibi)", "sections": [{"ts": "00:00", "title": "1. Külliye: İbadeti ondan olmayan bir şeyle sürekli olarak başlatan veya bitiren bid'atçidir", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.2, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.5, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.3, "ومن تبعهم بإحسانٍ إلى يوم الدين،"], [11.6, "أمّا بعد: فنبدأ مستعينين بالله عز وجل في كلّيّاتنا العشر في باب البدع."], [18.8, "الكلّيّة الأولى: كلُّ من افتتح التعبُّدَ ـ أو نقول:"], [23.2, "ابتدأ التعبُّدَ ـ أو ختمه بما ليس منه دوامًا فمبتدِع."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.7, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."], [11.0, "Bundan sonra: Allah Azze ve Celle'den yardım dileyerek bid'at babındaki on külliyemize başlıyoruz."], [16.6, "<b>1. külliye: İbadete —ya da \"ibadeti başlatan\" diyelim— ondan olmayan bir şeyle sürekli olarak başlayan veya onu ondan olmayan bir şeyle sürekli olarak bitiren herkes bid'atçidir.<\/b>"]]}, {"reader": false, "ar": [[28.1, "أقول وبالله التوفيق: وذلك لأنّ من مقاصد الشريعة حمايةَ العبادات،"], [32.0, "ومن صور هذه الحماية الشرعية لها أنها حفظتها في أوائلها وفي نهاياتها."], [42.0, "فلا يجوز للإنسان أن يفتتح تعبُّدًا بما ليس منه شرعًا،"], [48.0, "ولا يجوز أن يختتمه بما ليس منه شرعًا."], [53.0, "فمن باب المحافظة على التعبُّد ألّا تبتدئ بما ليس منه،"], [56.9, "ولا أن تختمه بما ليس منه."], [59.0, "وعلى ذلك دلّت الأدلّة الشرعية الصحيحة."]], "tr": [[28.1, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [30.9, "İbadetleri korumak şeriatın maksatlarındandır. Şeriatın ibadetleri bu şekilde korumasının bir sureti de onları başlangıçlarında ve sonlarında muhafaza etmesidir."], [39.5, "İnsanın bir ibadeti şer'an ondan olmayan bir şeyle başlatması caiz değildir;"], [47.4, "onu şer'an ondan olmayan bir şeyle bitirmesi de caiz değildir."], [53.0, "İbadeti muhafaza etmek kabîlindendir ki onu ondan olmayan bir şeyle başlatmazsın ve ondan olmayan bir şeyle bitirmezsin."], [58.6, "Sahih şer'î deliller de buna delâlet etmiştir."]]}, {"reader": false, "ar": [[64.0, "ففي رمضان مثلًا يقول النبيّ صلى الله عليه وسلم:"], [68.5, "«لا تقدّموا رمضانَ بصوم يومٍ أو يومين، إلا رجلٌ كان يصوم صومًا فليصمه»."], [75.0, "قلتُ: لأنه يُتوسَّع في صيام العادة ما لا يُتوسَّع في صيام الابتداء."], [82.0, "فلا يجوز للإنسان أن يحتاط لصيام شهر رمضان فيصومَ قبله يومًا أو يومين على أنها من رمضان؛"], [91.0, "لأنه افتتح التعبُّد بما ليس منه،"], [94.0, "فسدّ الشارعُ هذا الإحداثَ والبدعةَ بهذا النهي."]], "tr": [[64.0, "Mesela Ramazan'da Nebî ﷺ şöyle buyurur:"], [66.5, "\"Ramazan'ın önüne bir veya iki günlük oruçla geçmeyin;"], [69.5, "ancak (âdet edindiği) bir orucu tutmakta olan kimse müstesna, o onu tutsun.\" Derim ki:"], [75.6, "Çünkü âdet orucunda, (yeni) başlanan oruçta tanınmayan bir genişlik tanınır."], [80.8, "İnsanın, Ramazan orucu için ihtiyat yapıp Ramazan'dan sayarak ondan önce bir veya iki gün oruç tutması caiz değildir;"], [88.9, "çünkü (bu durumda) ibadeti ondan olmayan bir şeyle başlatmış olur."], [93.0, "Şâri' de bu ihdas ve bid'atin yolunu bu yasakla kapatmıştır."]]}, {"reader": false, "ar": [[100.0, "وكذلك نهى الشارعُ عن صيام يوم العيد،"], [104.0, "كما في الصحيح أنّ النبيّ صلى الله عليه وسلم نهى عن صوم يوم الفطر والأضحى؛"], [110.0, "حتى لا يُختَم شهرُ رمضان بما ليس منه."], [115.0, "فانظر كيف حافظ الشارعُ على عبادة الصيام،"], [120.0, "فنهى أن تُفتتَح بما ليس منها،"], [123.5, "ونهى أن تُختَم بما ليس منها."], [127.0, "وهذا ليس في الصيام خاصّة،"], [129.8, "وإنما نأخذ منه قاعدةً عامّة،"], [132.6, "وهي ما تنصّ عليه هذه الكلّيّة."]], "tr": [[100.0, "Aynı şekilde Şâri' bayram günü oruç tutmayı da yasaklamıştır."], [104.0, "Nitekim Sahîh'te geçtiği üzere Nebî ﷺ Ramazan bayramı ve Kurban bayramı günü oruç tutmayı yasaklamıştır;"], [109.5, "Ramazan ayı ondan olmayan bir şeyle bitirilmesin diye."], [113.8, "Bak, Şâri' oruç ibadetini nasıl muhafaza etti:"], [117.9, "Onun ondan olmayan bir şeyle başlatılmasını da yasakladı, ondan olmayan bir şeyle bitirilmesini de yasakladı."], [125.8, "Bu yalnızca oruca mahsus değildir;"], [128.1, "bilakis biz bundan genel bir kaide çıkarırız, o da bu külliyenin açıkça ifade ettiği şeydir."]]}, {"reader": false, "ar": [[136.0, "وكذلك أيضًا في صحيح الإمام مسلم من حديث السائب بن يزيد رضي الله عنه قال:"], [144.5, "«صلّيتُ مع معاوية ـ رضي الله تعالى عنه ـ الجمعةَ في المقصورة» ـ والمقصورة:"], [151.4, "مكانٌ يصلّي فيه معاوية وحاشيته ـ قال:"], [155.6, "«فلمّا سلّم الإمام قمتُ في مقامي فصلّيتُ ركعتين، فقام» ـ أي معاوية ـ «ثم دخل فدعاني وقال: لا تَعُدْ لما فعلت؛ إذا صلّيتَ الجمعة فلا تَصِلْها بصلاةٍ حتى تكلَّمَ أو تخرج؛ فإنّ النبيّ صلى الله عليه وسلم نهى أن تُوصَل صلاةٌ بصلاةٍ حتى نتكلّم أو نخرج»."], [185.0, "ممّا يدلّ على أنه لا يجوز لأحدٍ أن يبتدئ التعبُّد بما ليس منه،"], [191.2, "ولا أن يختمه بما ليس منه."]], "tr": [[136.0, "Yine İmam Müslim'in Sahîh'inde es-Sâib b."], [138.9, "Yezîd'den —Allah ondan razı olsun— gelen hadiste şöyle dedi:"], [143.4, "\"Muâviye —Allah ondan razı olsun— ile birlikte cumayı maksûrede kıldım\" —maksûre, Muâviye'nin ve maiyetinin namaz kıldığı yerdir— dedi ki:"], [155.0, "\"İmam selam verince yerimde kalkıp iki rekât kıldım."], [159.4, "Bunun üzerine\" —yani Muâviye— \"kalktı, sonra içeri girdi, beni çağırdı ve dedi ki:"], [168.4, "Yaptığını bir daha yapma. Cumayı kıldığında konuşmadıkça veya (yerinden) çıkmadıkça onu başka bir namaza bitiştirme;"], [179.1, "çünkü Nebî ﷺ, konuşmadıkça veya çıkmadıkça bir namazın başka bir namaza bitiştirilmesini yasakladı.\" Bu da hiç kimsenin ibadeti ondan olmayan bir şeyle başlatmasının ve ondan olmayan bir şeyle bitirmesinin caiz olmadığını gösterir."]]}, {"reader": false, "ar": [[194.0, "وعليه كراهيةُ كثيرٍ من أهل العلم الإحرامَ لأحد النُّسُكين قبل بلوغ الميقات المحدَّد لك؛"], [203.0, "فلا ينبغي للإنسان أن يُحرِم قبل بلوغه للميقات؛"], [208.0, "لأنه سوف يَصِل التعبُّد ـ أو سوف يفتتح التعبُّد ـ بإحرامٍ ليس من نُسُكه المحدَّد له."], [217.0, "فكذلك سائر التعبُّدات، وهذا من باب الحماية للشرع."]], "tr": [[194.0, "Birçok ilim ehlinin, iki nüsükten (hac veya umre) biri için sana belirlenmiş mîkâta varmadan önce ihrama girmeyi mekruh görmesi de buna dayanır."], [204.2, "İnsanın mîkâta varmadan önce ihrama girmesi uygun değildir;"], [208.6, "çünkü ibadeti, kendisi için belirlenmiş nüsükten olmayan bir ihramla bitiştirmiş —ya da ibadeti öyle bir ihramla başlatmış— olur."], [217.7, "Diğer bütün ibadetler de böyledir; bu, şeriatı koruma kabîlindendir."]]}, {"reader": false, "ar": [[225.0, "وكذلك الأذكار الشرعية: لا تُبدأ بما ليس منها،"], [228.7, "ولا تُختَم بما ليس منها."], [231.0, "والصلاة لا تُبدأ بما ليس منها،"], [233.7, "ولا تُختَم بما ليس منها."], [236.0, "والصيام لا يُبدأ بما ليس منه،"], [238.2, "ولا يُختَم بما ليس منه."], [240.0, "وصلاة الجنازة لا تُبدأ بما ليس منها ـ كما يفعله بعض أهل البدع بالنداء لها بـ«الصلاة جامعة» في بعض البلدان ـ ولا أن تُختَم بما ليس منها من بعض الأذكار التي تقال قبل رفع الجنازة."]], "tr": [[225.0, "Şer'î zikirler de böyledir: Onlardan olmayan bir şeyle başlatılmaz, onlardan olmayan bir şeyle bitirilmez."], [231.5, "Namaz ondan olmayan bir şeyle başlatılmaz, ondan olmayan bir şeyle bitirilmez."], [236.4, "Oruç ondan olmayan bir şeyle başlatılmaz, ondan olmayan bir şeyle bitirilmez."], [240.6, "Cenaze namazı ondan olmayan bir şeyle başlatılmaz —bazı bid'at ehlinin bazı beldelerde onun için \"es-Salâtu câmia\" diye nidâ etmesi gibi—;"], [251.5, "cenaze kaldırılmadan önce söylenen bazı zikirler gibi ondan olmayan şeylerle de bitirilmez."]]}, {"reader": false, "ar": [[258.0, "ولا ينبغي أن تُبدأ صلاةُ الجمعة بما ليس منها،"], [263.0, "كقراءة القرآن الذي يُعقَد في كثيرٍ من بلاد المسلمين قبل صعود الإمام،"], [270.0, "ولا أن تُختَم بما ليس منها،"], [273.0, "كصلاة كثيرٍ من أهل الإسلام بعدها صلاةَ الظهر؛"], [280.0, "فإنّ من الناس من ابتدع هذه البدعة احتياطًا لكون الجمعة لم تُقبَل،"], [287.1, "فيكونون قد صلّوا بعدها الظهر،"], [290.0, "فيقبل الله عز وجل منهما ما شاء."], [293.0, "وهذا من البدع، وهو وصلٌ لصلاة الجمعة بما ليس منها."]], "tr": [[258.0, "Cuma namazının, pek çok Müslüman beldesinde imam (minbere) çıkmadan önce düzenlenen Kur'ân okuma gibi ondan olmayan bir şeyle başlatılması uygun değildir;"], [268.7, "Müslümanlardan birçoğunun ondan sonra öğle namazı kılması gibi ondan olmayan bir şeyle bitirilmesi de uygun değildir."], [276.9, "Çünkü insanlardan bazıları, cuma kabul olmamıştır diye ihtiyaten bu bid'ati çıkarmıştır;"], [285.4, "böylece ondan sonra öğleyi de kılmış olurlar da Allah Azze ve Celle ikisinden dilediğini kabul eder (diye düşünürler)."], [293.0, "Bu, bid'atlerdendir ve cuma namazını ondan olmayan bir şeye bitiştirmektir."]]}, {"reader": false, "ar": [[299.0, "ولا أن تُفتتَح الخطبةُ بما ليس منها،"], [303.1, "ولا تُختَم بما ليس منها،"], [306.0, "وهكذا دواليك سائر التعبُّدات."], [309.0, "ولا تُفتتَح العمرةُ بما ليس منها،"], [311.7, "ولا تُختَم بما ليس منها."], [314.0, "ولا يُفتتَح الحجُّ بما ليس منه،"], [317.3, "ولا يُختَم بما ليس منه."], [320.0, "ولا يُفتتَح الطوافُ بما ليس منه،"], [322.7, "ولا يُختَم بما ليس منه."], [325.0, "ولا يُفتتَح ـ أو يُبتدأ ـ في رمي الجمرات بما ليس منه،"], [331.0, "ولا يُختَم بما ليس منه."], [334.0, "وبه تعلم أنّ من أبواب البدع والمحدثات في التعبُّدات:"], [339.0, "أن تُفتتَح التعبُّداتُ بما ليس منها،"], [341.0, "أو تُختتَم بما ليس منها."]], "tr": [[299.0, "Hutbe de ondan olmayan bir şeyle başlatılmaz, ondan olmayan bir şeyle bitirilmez;"], [305.4, "diğer bütün ibadetler de bu şekilde devam eder."], [309.9, "Umre ondan olmayan bir şeyle başlatılmaz, ondan olmayan bir şeyle bitirilmez."], [314.5, "Hac ondan olmayan bir şeyle başlatılmaz, ondan olmayan bir şeyle bitirilmez."], [320.0, "Tavaf ondan olmayan bir şeyle başlatılmaz, ondan olmayan bir şeyle bitirilmez."], [324.5, "Şeytan taşlamaya da ondan olmayan bir şeyle başlanmaz —ya da girişilmez—, ondan olmayan bir şeyle bitirilmez."], [333.4, "Bununla anlarsın ki ibadetlerdeki bid'at ve muhdes işlerin kapılarından biri, ibadetlerin onlardan olmayan bir şeyle başlatılması veya onlardan olmayan bir şeyle bitirilmesidir."]]}]}, {"ts": "05:45", "title": "1. Külliye (devam): \"Sürekli olarak\" kaydı — Arızî olarak caiz olan, sürekli olarak caiz olmaz", "paras": [{"reader": false, "ar": [[345.0, "فإن قلتَ: ولماذا قيّدتَ القاعدة بقولك:"], [349.5, "«دوامًا»؟ فأقول: لأنّ المتقرّر في القواعد أنه يجوز عَرَضًا ما لا يجوز دوامًا."], [360.0, "فلو أنك داومتَ على البسملة قبل الأذان فتكون مبتدعًا؛"], [366.9, "لأنك افتتحتَ الأذان بما ليس منه على وجه الدوام."], [371.0, "ولكن إن وقعت منك التسمية مرةً أو مرتين،"], [374.7, "لا على وجه الديمومة والاستمرار،"], [377.0, "فنقول: إنّ ذلك لا بأس به إن شاء الله؛"], [380.0, "فإنّ من المحدثات ما لا يدخل في دائرة البدع المنكرة إلا إذا اكتسب صفةَ الديمومة والاستمرار."]], "tr": [[345.0, "Şayet \"Kaideyi neden 'sürekli olarak' sözünle kayıtladın?\" dersen, derim ki:"], [352.4, "Çünkü kaidelerde yerleşik olan şudur:"], [355.8, "Sürekli olarak caiz olmayan şey arızî olarak (ara sıra) caiz olur."], [364.5, "Ezandan önce besmeleye devam etsen bid'atçi olursun;"], [368.7, "çünkü ezanı sürekli olarak ondan olmayan bir şeyle başlatmış olursun."], [373.3, "Fakat besmele senden bir iki defa, devamlılık ve süreklilik şeklinde olmaksızın vâki olursa, inşallah bunda bir sakınca yoktur deriz."], [381.0, "Çünkü muhdes şeylerden bazıları, ancak devamlılık ve süreklilik vasfı kazandığında münker bid'atler dairesine girer."]]}, {"reader": false, "ar": [[390.0, "ولو أنك قرأتَ آيةً قبل الأذان ـ كما يفعله بعض المسلمين في بعض البلاد من أنه إذا أراد أن يؤذّن قرأ:"], [401.0, "<span class=\"ayah\">﴿وَقُلِ الْحَمْدُ لِلَّهِ الَّذِي لَمْ يَتَّخِذْ وَلَدًا وَلَمْ يَكُن لَّهُ شَرِيكٌ فِي الْمُلْكِ وَلَمْ يَكُن لَّهُ وَلِيٌّ مِّنَ الذُّلِّ ۖ وَكَبِّرْهُ تَكْبِيرًا﴾<\/span> <span class=\"ref\">[الإسراء: ١١١]<\/span>،"], [411.1, "ثم يبدأ في تكبيرات الأذان ـ فإذا افتتح الأذانَ بهذه الآية دوامًا فإنّ ذلك قد افتتح الأذان بما ليس منه."], [423.0, "ولكن إن قالها مرةً أو مرتين،"], [426.8, "لا على وجه الديمومة والاستمرار،"], [430.0, "فنقول: ذلك لا بأس به؛"], [432.5, "إذ يجوز عرضًا ما لا يجوز دوامًا."]], "tr": [[390.0, "Ezandan önce bir ayet okusan —bazı beldelerde bazı Müslümanların yaptığı gibi;"], [397.1, "ezan okumak istediğinde <span class=\"ayah\">﴿De ki: Hamd, çocuk edinmeyen, mülkünde ortağı olmayan, âcizlikten dolayı bir dosta ihtiyacı olmayan Allah'a mahsustur. O'nu tekbir ederek yücelt﴾<\/span> [İsrâ 111] ayetini okur, sonra ezanın tekbirlerine başlar— ezanı bu ayetle sürekli olarak başlatırsa, bu kişi ezanı ondan olmayan bir şeyle başlatmış olur."], [421.5, "Fakat onu bir iki defa, devamlılık ve süreklilik şeklinde olmaksızın söylerse bunda bir sakınca yoktur deriz;"], [431.0, "zira sürekli olarak caiz olmayan şey arızî olarak caiz olur."]]}, {"reader": false, "ar": [[436.0, "ومن أجل ذلك كره جمهورُ العلماء التثويبَ بعد الفراغ من الأذان،"], [444.3, "والتثويبُ هو: دعاء الأمير إلى الصلاة في موضع الأذان؛"], [454.0, "فإذا فرغ المؤذّن من أذانه قال:"], [457.8, "الصلاةَ الصلاةَ يا أمير المؤمنين،"], [461.0, "الصلاةَ الصلاةَ يا أمير المؤمنين،"], [464.2, "في موضع أذانه. فإن فعل ذلك لا على وجه الديمومة والاستمرار فيكون ذلك جائزًا من باب الأمر بالمعروف،"], [476.0, "لكن إذا كان ذلك على جهة الديمومة والاستمرار فإننا نمنعه؛"], [482.5, "إذ يجوز عرضًا ما لا يجوز دوامًا."]], "tr": [[436.0, "Bu yüzden âlimlerin cumhuru ezanı bitirdikten sonra tesvîbi mekruh görmüştür."], [442.9, "Tesvîb, emîri ezan okunan yerde namaza çağırmaktır:"], [450.0, "Müezzin ezanını bitirince ezan okuduğu yerde \"Namaz, namaz ey mü'minlerin emîri!"], [460.4, "Namaz, namaz ey mü'minlerin emîri!\" der."], [464.2, "Bunu devamlılık ve süreklilik şeklinde olmaksızın yaparsa, iyiliği emretme kabîlinden caiz olur."], [472.6, "Fakat bu devamlılık ve süreklilik şeklinde olursa onu men ederiz;"], [479.9, "zira sürekli olarak caiz olmayan şey arızî olarak caiz olur."]]}, {"reader": false, "ar": [[487.0, "ومن أجل ذلك أيضًا كره كثيرٌ من أهل العلم المداومةَ على المصافحة بعد الفراغ من الصلاة عمّن على يمينك أو شمالك،"], [499.0, "مصافحةً تقصد بها أنها من باب تكميل الصلاة،"], [503.9, "أو من باب ما يُشرع فعله بعد الفراغ من الصلاة،"], [510.0, "مع أنك قد سلّمتَ عليهم قبل ذلك."], [515.0, "فإن فعل ذلك أحيانًا،"], [517.8, "لا على وجه الديمومة والاستمرار،"], [522.0, "فإنّ ذلك جائز؛ لكن إذا اتّخذه الإنسان فعلًا دائمًا مواظبًا عليه فإنّ ذلك من البدع المحدثة."]], "tr": [[487.0, "Yine bu yüzden birçok ilim ehli, namazı bitirdikten sonra sağındakilerle veya solundakilerle tokalaşmaya devam etmeyi mekruh görmüştür;"], [497.3, "bununla namazı tamamlama kabîlinden ya da namazı bitirdikten sonra yapılması meşru olan şeyler kabîlinden olduğunu kastettiğin bir tokalaşma."], [509.4, "Hâlbuki daha önce onlara selam vermişsindir."], [514.3, "Bunu bazen, devamlılık ve süreklilik şeklinde olmaksızın yaparsa caizdir."], [522.0, "Fakat insan bunu devamlı ve üzerinde ısrarla durduğu bir fiil edinirse, bu muhdes bid'atlerdendir."]]}, {"reader": false, "ar": [[534.0, "وكذلك الاجتماعُ على الأذكار بعد الصلاة:"], [541.0, "إن اتّخذه الناس هِجِّيرى،"], [543.6, "وصار ذلك هو فعلَهم الدائم،"], [546.8, "فإنّ ذلك من البدع المحدثة؛"], [550.0, "لكن إن فُعل مرةً ـ لا سيّما على وجه التعليم ـ فإنّ ذلك جائزٌ لا بأس به ولا حرج فيه."], [559.0, "وكالجهر بما يُشرع فيه الإسرار،"], [562.5, "أو الإسرار بما يُشرع فيه الجهر:"], [569.0, "إن فُعل لا على وجه الديمومة والاستمرار ـ لا سيّما إذا اقترن بفعله مصلحةٌ شرعية ـ فإنه جائزٌ لا بأس به،"], [578.0, "ولكن إن كان ذلك على وجه الديمومة والاستمرار فإنه محرّمٌ لا يجوز."]], "tr": [[534.0, "Namazdan sonra zikirler için toplanmak da böyledir:"], [541.6, "İnsanlar bunu âdet edinir ve bu onların devamlı fiili hâline gelirse, bu muhdes bid'atlerdendir."], [550.5, "Fakat bir defa yapılırsa —özellikle öğretmek maksadıyla— caizdir, bunda bir sakınca ve bir beis yoktur."], [558.0, "Gizli okunması meşru olanı açıktan okumak veya açıktan okunması meşru olanı gizli okumak da böyledir:"], [570.7, "Devamlılık ve süreklilik şeklinde olmaksızın yapılırsa —özellikle yapılmasına şer'î bir maslahat eşlik ederse— caizdir, bir sakıncası yoktur."], [578.6, "Fakat bu, devamlılık ve süreklilik şeklinde olursa haramdır, caiz değildir."]]}, {"reader": false, "ar": [[587.0, "فبان لك أنّ قول المصنّف في الكلّيّة:"], [592.1, "«دوامًا» هو أنه يريد أن يلفت نظرك إلى أنه يجوز أحيانًا وعَرَضًا ما لا يجوز دوامًا واستمرارًا."], [607.0, "ولعلّ الكلّيّة قد اتّضحت، والله أعلم."]], "tr": [[587.0, "Böylece sana açıkça ortaya çıktı ki musannifin külliyedeki \"sürekli olarak\" sözü, sürekli ve devamlı olarak caiz olmayan şeyin bazen ve arızî olarak caiz olduğuna dikkatini çekmek istemesidir."], [605.8, "Umarım külliye açıklığa kavuşmuştur. Allah en iyisini bilir."]]}]}, {"ts": "10:10", "title": "2. Külliye: Dünyevî her ihdasta asıl helalliktir; şer'î delile aykırı olan hariç", "paras": [{"reader": false, "ar": [[610.0, "الكلّيّة الثانية: كلُّ إحداثٍ دنيويٍّ فالأصلُ فيه الحِلُّ،"], [617.1, "إلا ما خالف دليلَ الشرع. <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [657.0, "اعلم ـ رحمك الله تعالى ـ أنّ المحدثات عندنا تنقسم إلى قسمين:"], [663.0, "إلى محدثاتٍ في أمرٍ دينيّ،"], [666.0, "وإلى محدثاتٍ في أمرٍ دنيويّ."], [671.0, "فالأصل في المحدثات الدينية المنع،"], [675.0, "وهي قاعدتنا التي تقول:"], [677.5, "كلُّ إحداثٍ في الدين فهو ردّ،"], [681.0, "وعليه قول النبيّ صلى الله عليه وسلم:"], [684.0, "«من أحدث في أمرنا هذا ما ليس منه فهو ردّ»."]], "tr": [[610.0, "2. külliye: Dünyevî her ihdasta asıl helalliktir;"], [615.8, "şer'î delile aykırı olan hariç. (Tekrarlıyor.) Tevfik Allah'tandır, derim ki:"], [655.9, "Bil —Allah Teâlâ sana rahmet etsin— ki bize göre muhdes şeyler iki kısma ayrılır:"], [664.2, "Dinî bir işteki muhdesler ve dünyevî bir işteki muhdesler."], [671.8, "Dinî muhdeslerde asıl, yasaklıktır. Bu, \"Dinde yapılan her ihdas reddedilmiştir\" diyen kaidemizdir."], [679.4, "Nebî ﷺ'in şu sözü de buna delildir:"], [682.7, "\"Kim bizim bu işimizde (dinimizde) ondan olmayan bir şey ihdas ederse, o reddedilmiştir.\""]]}, {"reader": false, "ar": [[689.0, "والقسم الثاني: الإحداث في أمرٍ دنيويّ،"], [696.0, "وقاعدته هي هذه الكلّيّة،"], [699.0, "وهي أنّ الأصل جوازُ المحدثات الدنيوية."], [703.0, "فللمسلمين أن يخترعوا في أمور دنياهم ما يشاؤون ممّا به قِوامُ دنياهم،"], [713.0, "بغضّ النظر عن باب هذا الإحداث:"], [716.0, "أهو في الأمور العادية،"], [718.7, "أو الاجتماعية، أو الأسرية،"], [721.4, "أو المالية، أو العسكرية،"], [724.1, "أو السياسية. فلهم أن يُحدثوا من المخترعات ما شاؤوا،"], [735.0, "ولهم أن يسبحوا في اكتشاف الأشياء كما يشاؤون،"], [740.0, "والإسلام لا يقف حجرَ عثرةٍ في طريق التقدّم والصناعة والاختراع والإحداث،"], [748.0, "لكن لا يكون ذلك على حساب مخالفة دليل الشرع."]], "tr": [[689.0, "İkinci kısım: Dünyevî bir işteki ihdas."], [696.0, "Bunun kaidesi de bu külliyedir;"], [699.7, "o da dünyevî muhdeslerde aslın caizlik olmasıdır."], [704.5, "Müslümanlar dünya işlerinde, dünyalarının ayakta durmasını sağlayan şeylerden dilediklerini icat edebilirler."], [713.5, "Bu ihdasın hangi alanda olduğuna bakılmaksızın:"], [716.7, "âdetlere dair işlerde mi, sosyal işlerde mi, aile işlerinde mi, mâlî işlerde mi, askerî işlerde mi, siyasî işlerde mi."], [734.4, "Dilediklerini icat edebilirler, eşyayı keşfetmede diledikleri gibi yüzebilirler (derinleşebilirler)."], [740.0, "İslam; ilerlemenin, sanayinin, icadın ve yenilik yapmanın önünde bir engel taşı olarak durmaz."], [749.1, "Fakat bu, şer'î delile aykırılık pahasına olamaz."]]}, {"reader": false, "ar": [[753.0, "فكما أنه لا يجوز إحداثُ شيءٍ في الدين إلا وعليه دليل،"], [761.0, "فكذلك لا يجوز منعُ إحداثٍ في الدنيا إلا وعلى ذلك المنع دليل."], [769.0, "فوصفُ الإسلام بأنه دينٌ يوجب أن يتأخّر ـ دينٌ أوجب تأخُّرَ المسلمين،"], [778.5, "وأوجب تقدُّمَ الكفّار عليهم ـ فإنّ ذلك من باب تعليق الكسل والفتور بالشريعة والدين؛"], [788.0, "وإلا فالإسلام أبدًا لا يقف حجرَ عثرةٍ أمام أيّ اكتشافٍ عسكريّ،"], [794.0, "ولا يقف حجرَ عثرةٍ أمام أيّ اختراعٍ دنيويّ،"], [800.0, "ما دام في أمرٍ يرجع إلى الدنيا وإقامتها،"], [806.0, "ولا تعلُّقَ له بالدين."]], "tr": [[753.0, "Dinde üzerinde bir delil bulunmadıkça bir şeyi ihdas etmek caiz olmadığı gibi, dünyada da o yasağa dair bir delil bulunmadıkça bir ihdası yasaklamak caiz değildir."], [767.7, "İslam'ın, geri kalmayı gerektiren bir din —Müslümanların geri kalmasını ve kâfirlerin onların önüne geçmesini gerektiren bir din— olarak nitelenmesi ise tembelliği ve gevşekliği şeriata ve dine bağlamak kabîlindendir."], [786.7, "Yoksa İslam hiçbir askerî keşfin önünde asla bir engel taşı olarak durmaz, hiçbir dünyevî icadın önünde de engel taşı olarak durmaz;"], [798.4, "dünyaya ve onun ayakta tutulmasına dönük bir işte olduğu ve dinle bir ilgisi bulunmadığı sürece."]]}, {"reader": false, "ar": [[808.0, "إلا أنّ هذه الكلّيّة ليست مطلقة،"], [811.0, "وإنما هي مقيّدةٌ بقولنا:"], [814.0, "«ما لم يخالف دليلَ الشرع»."], [818.0, "فإذا كان الإحداث ـ فإذا كان هذا المحدَثُ الدنيويُّ على خلاف دليل الشرع فلا جرمَ أننا نمنعه. والله أعلم."]], "tr": [[808.0, "Ancak bu külliye mutlak değildir;"], [810.5, "bilakis \"şer'î delile aykırı olmadıkça\" sözümüzle kayıtlıdır."], [815.6, "Şayet bu ihdas —şayet bu dünyevî muhdes şey şer'î delile aykırı ise, şüphesiz onu men ederiz. Allah en iyisini bilir."]]}]}, {"ts": "13:49", "title": "3. Külliye: Hakkı arayarak içtihad eden kimsenin şer'î hatası bağışlanmıştır", "paras": [{"reader": false, "ar": [[829.0, "ومن الكلّيّات أيضًا: <b>كلُّ من وقع في خطأٍ شرعيٍّ مجتهدًا طالبًا للحقّ فخطؤه مغفور.<\/b> <span class=\"note\">(يكررها)<\/span> أعيدها مرةً ثالثة:"], [870.0, "<b>كلُّ من وقع في خطأٍ شرعيٍّ مجتهدًا طالبًا للحقّ فخطؤه مغفور.<\/b>"]], "tr": [[829.0, "Külliyelerden biri de şudur: 3."], [831.7, "külliye: Hakkı arayarak içtihad eden kimse şer'î bir hataya düşerse, hatası bağışlanmıştır. (Tekrarlıyor.) Üçüncü defa tekrar ediyorum:"], [870.5, "<b>Hakkı arayarak içtihad eden kimse şer'î bir hataya düşerse, hatası bağışlanmıştır.<\/b>"]]}, {"reader": false, "ar": [[875.0, "أقول وبالله التوفيق: وذلك لأنّ الله عز وجل قد أكرم هذه الأمّة العظيمة المرحومة بأن غفر لمجتهديها خطأَهم الذي وقعوا فيه عن اجتهادٍ وتأويلٍ أو شبهة،"], [895.0, "مع كمال استفراغهم لطلب الحقّ فيه."], [899.0, "وذلك لأنّ البشرية لا توصف بالكمال المطلق،"], [904.0, "وإنما بمطلق الكمال. فالعالِم ـ وإن كان قد بلغ الرتبة العالية في علمه ـ فلا يزال ذا علمٍ قليل،"], [915.5, "كما قال الله عز وجل:"], [918.0, "<span class=\"ayah\">﴿وَفَوْقَ كُلِّ ذِي عِلْمٍ عَلِيمٌ﴾<\/span> <span class=\"ref\">[يوسف: ٧٦]<\/span>،"], [921.0, "<span class=\"ayah\">﴿وَمَا أُوتِيتُم مِّنَ الْعِلْمِ إِلَّا قَلِيلًا﴾<\/span> <span class=\"ref\">[الإسراء: ٨٥]<\/span>."]], "tr": [[875.0, "Tevfik Allah'tandır, derim ki: Bu şundandır:"], [878.7, "Allah Azze ve Celle bu büyük ve merhamete mazhar ümmete, müçtehitlerinin;"], [884.9, "hakkı aramak için bütün güçlerini tamamen harcamalarıyla birlikte içtihad, te'vil veya şüphe sonucu düştükleri hatalarını bağışlayarak ikramda bulunmuştur."], [896.3, "Bu da şundandır: İnsanoğlu mutlak kemal ile değil, ancak kemalin bir derecesi (mutlaku'l-kemâl) ile nitelenir."], [904.9, "Âlim, ilminde yüksek bir mertebeye ulaşmış olsa bile yine de az ilim sahibidir."], [912.4, "Nitekim Allah Azze ve Celle şöyle buyurmuştur:"], [915.5, "<span class=\"ayah\">﴿Her ilim sahibinin üstünde daha iyi bilen biri vardır﴾<\/span> [Yûsuf 76];"], [919.8, "<span class=\"ayah\">﴿Size ilimden ancak az bir şey verilmiştir﴾<\/span> [İsrâ 85]."]]}, {"reader": false, "ar": [[926.0, "وكما قال الخضرُ لموسى عليه الصلاة والسلام ـ لمّا انتهت قصّتهما،"], [933.0, "ورأى عصفورًا قد وضع منقارَه وأخذ قطرةً من الماء ـ فقال:"], [938.6, "«ما علمي وعلمُك في علم الله إلا كما نقَر منقارُ هذا العصفور»."], [945.0, "وبناءً على ذلك فلا يُستغرَب صدورُ الخطأ من أيّ أحدٍ كان،"], [952.2, "وإن بلغ في العلم مبلغَه."]], "tr": [[926.0, "Ve Hızır'ın Mûsâ'ya —ona salât ve selâm olsun— söylediği gibi;"], [931.7, "kıssaları sona erdiğinde bir serçenin gagasını (suya) koyup bir damla su aldığını gördü ve şöyle dedi:"], [939.1, "\"Benim ilmim ve senin ilmin, Allah'ın ilmi yanında ancak bu serçenin gagasının gagaladığı (aldığı) kadardır.\" Buna göre ilimde ulaşabileceği yere ulaşmış olsa bile kim olursa olsun herhangi birinden hata sâdır olması yadırganmaz."]]}, {"reader": false, "ar": [[955.0, "ولذلك يقول الله عز وجل في آخر سورة البقرة ـ وهي الآيتان اللتان أكرم الله عز وجل بهما أمّةَ محمدٍ صلى الله عليه وسلم،"], [967.9, "واللتان قال فيهما النبيّ صلى الله عليه وسلم:"], [971.1, "«من قام بهما في ليلةٍ كفتاه»،"], [975.0, "«وما قُرئتا في بيتٍ إلا نفر الشيطانُ منه إلى ثلاث»،"], [982.0, "كما في الحديث الذي يُروى عن النبيّ صلى الله عليه وسلم ـ قال الله عز وجل في آخرها:"], [991.1, "<span class=\"ayah\">﴿رَبَّنَا لَا تُؤَاخِذْنَا إِن نَّسِينَا أَوْ أَخْطَأْنَا﴾<\/span> <span class=\"ref\">[البقرة: ٢٨٦]<\/span>."], [997.0, "والنسيانُ الذي هو ضدّ الذِّكر،"], [1000.0, "والخطأُ الذي هو ضدّ القصد."]], "tr": [[955.0, "Bu yüzden Allah Azze ve Celle Bakara sûresinin sonunda şöyle buyurur —bunlar, Allah Azze ve Celle'nin Muhammed ﷺ'in ümmetine ikram ettiği iki ayettir;"], [967.4, "Nebî ﷺ onlar hakkında, Nebî ﷺ'den rivayet edilen hadiste geçtiği üzere şöyle buyurmuştur:"], [973.6, "\"Kim bir gecede onlarla (namaza) kalkarsa ona yeterler\";"], [978.3, "\"Bir evde okunduklarında şeytan üç (gece) o evden kaçar.\"— Allah Azze ve Celle onun sonunda şöyle buyurmuştur:"], [987.7, "<span class=\"ayah\">﴿Rabbimiz! Unutursak veya hata edersek bizi sorumlu tutma﴾<\/span> [Bakara 286]."], [994.4, "(Buradaki) unutma, hatırlamanın zıddı olan unutmadır;"], [999.4, "hata ise kastın zıddı olan hatadır."]]}, {"reader": false, "ar": [[1003.0, "فمن لم يقصد المخالفة ويتعمّدها مع كونه عالمًا بأنها مخالفة،"], [1010.0, "وإنما أوقعه فيها الاجتهاد،"], [1012.5, "مع كمال علم الله بطلبه للحقّ فيها،"], [1017.1, "وإرادته موافقةَ مراد الله فيها،"], [1021.0, "ولكنه أخطأ عن اجتهادٍ أو شبهةٍ أو تأويل،"], [1025.0, "فإنّ الله عز وجل يغفر له خطأه."]], "tr": [[1003.0, "Kim muhalefeti, onun bir muhalefet olduğunu bilerek kastetmez ve ona kasten yönelmezse, onu buna düşüren şey içtihad olursa —Allah'ın, onun bu meselede hakkı aradığını ve Allah'ın muradına uymayı istediğini tam olarak bilmesiyle birlikte— ama o içtihad, şüphe veya te'vil sonucu hata ederse, Allah Azze ve Celle onun hatasını bağışlar."]]}]}, {"ts": "17:07", "title": "3. Külliye (devam): \"Müçtehit\" ve \"hakkı arayan\" kayıtları", "paras": [{"reader": false, "ar": [[1027.0, "فإن قلتَ: وهل هذا في أهل الاجتهاد فقط؟"], [1032.1, "الجواب: نعم. وأمّا من ليس من أهل الاجتهاد فلا يحلّ له أن ينقّب في الأدلّة ـ كتابًا وسنّةً ـ ليعرف مرادَ الله فيها؛"], [1046.0, "لأنّ مراد الله في الأدلّة لا بدّ أن يكون عن طريق استدلالٍ صحيح،"], [1053.8, "والعامّيّ ليس من أهل النظر ولا معرفة الاستدلال الصحيح،"], [1060.0, "فيكون متخبّطًا قائلًا على الله ما لا يعلم."], [1064.0, "فكلُّ من وقع مخطئًا من العوامّ فإنه آثمٌ إذا كان في مقدوره سؤالُ أهل العلم؛"], [1079.0, "لقول الله عز وجل:"], [1081.0, "<span class=\"ayah\">﴿فَاسْأَلُوا أَهْلَ الذِّكْرِ إِن كُنتُمْ لَا تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[النحل: ٤٣]<\/span>."]], "tr": [[1027.0, "Şayet \"Bu sadece içtihad ehli için mi geçerlidir?\" dersen, cevap:"], [1033.3, "Evet. İçtihad ehlinden olmayana gelince, Allah'ın muradını öğrenmek için delilleri —Kitap ve Sünnet'i— kurcalaması ona helal değildir."], [1044.1, "Çünkü delillerdeki Allah'ın muradı, ancak sahih bir istidlal yoluyla (bilinebilir)."], [1050.5, "Âmmî ise nazar ehlinden ve sahih istidlali bilenlerden değildir;"], [1057.0, "bu yüzden (körlemesine) sağa sola saldıran ve Allah hakkında bilmediğini söyleyen biri olur."], [1064.8, "Avamdan hataya düşen herkes, ilim ehline sormaya gücü yetiyorsa günahkârdır."], [1076.1, "Çünkü Allah Azze ve Celle şöyle buyurmuştur:"], [1080.5, "<span class=\"ayah\">﴿Eğer bilmiyorsanız zikir ehline sorun﴾<\/span> [Nahl 43]."]]}, {"reader": false, "ar": [[1084.0, "فإن قلتَ: ولماذا قلتَ:"], [1087.5, "«طالبًا للحقّ»؟ فأقول: لأنه ليس كلُّ من نظر في الأدلّة يكون طالبًا فيها الحقّ؛"], [1096.0, "فكثيرٌ من الناس إنما ينظر فيها لينصر قولَه،"], [1101.0, "أو ينصر قولَ إمامه المعظَّم عنده،"], [1106.0, "أو ينصر به قولَ طائفةٍ تريد منه أن يُسعفها في شهواتها باجتهاده،"], [1115.0, "أو يريد أن يُحِقَّ باطلًا أو يُبطِل حقًّا."]], "tr": [[1084.0, "Şayet \"Neden 'hakkı arayarak' dedin?\" dersen, derim ki:"], [1089.0, "Çünkü delillere bakan herkes onlarda hakkı arıyor değildir."], [1093.1, "İnsanların birçoğu onlara ancak kendi görüşüne yardım etmek için, ya da yanında büyük saydığı imamının görüşüne yardım etmek için, ya da içtihadıyla kendi arzularına destek vermesini ondan isteyen bir grubun görüşüne onunla yardım etmek için bakar;"], [1112.8, "ya da bir bâtılı hak göstermek veya bir hakkı iptal etmek ister."]]}, {"reader": false, "ar": [[1122.0, "ولذلك يقول النبيّ صلى الله عليه ـ يقول عمرُ رضي الله عنه لزياد بن حُدَير:"], [1129.0, "«هل تعرف ما يهدم الإسلام؟ قال: قلتُ: لا، قال: يهدم الإسلامَ ثلاثة: زلّةُ عالم، وجدالُ المنافق بالكتاب، وحكمُ الأئمة المضلّين»."], [1143.0, "فكم من منافقٍ إنما حمله على النظر في آيات الكتاب والسنّة طلبُ نصرة شهوته،"], [1150.1, "أو طلبُ تقرير الباطل الذي يريده!"], [1155.0, "وكم من المشركين الذين استدلّوا على شركهم بالآيات والأحاديث!"], [1161.0, "وكم من أهل البدع الذين استدلّوا على بدعتهم بالآيات والأحاديث!"], [1165.9, "فلا بدّ أن نقيّد مَن خطؤه مغفورٌ بقولنا: «طالبًا للحقّ»."]], "tr": [[1122.0, "Bu yüzden Nebî ﷺ şöyle buyurur— Ömer —Allah ondan razı olsun— Ziyâd b."], [1127.5, "Hudayr'a şöyle der: \"İslam'ı neyin yıktığını biliyor musun?"], [1130.5, "(Ziyâd) dedi ki: Hayır, dedim."], [1133.0, "(Ömer) dedi ki: İslam'ı üç şey yıkar:"], [1136.5, "Âlimin sürçmesi, münafığın Kitap'la mücadelesi ve saptırıcı imamların hükmü.\" Nice münafık vardır ki onu Kitap ve Sünnet'in ayetlerine bakmaya sevk eden şey, ancak kendi arzusuna yardım etmek ya da istediği bâtılı yerleştirmek arzusudur!"], [1156.3, "Nice müşrik vardır ki şirklerine ayetler ve hadislerle delil getirmişlerdir!"], [1162.0, "Nice bid'at ehli vardır ki bid'atlerine ayetler ve hadislerle delil getirmişlerdir!"], [1166.3, "Bu yüzden hatası bağışlanan kimseyi \"hakkı arayarak\" sözümüzle kayıtlamamız gerekir."]]}]}, {"ts": "19:33", "title": "3. Külliye (devam): Bu hüküm fıkıh ve akîde meselelerini kapsar; kesin delil ve icmâ olan meseleler istisnadır", "paras": [{"reader": false, "ar": [[1173.0, "فإن قلتَ: وهل هذا الخطأ المغفور يكون في مسائل الفقه فقط،"], [1181.0, "أم يتجاوزه إلى مسائل العقائد أيضًا؟"], [1185.0, "الجواب: هو عامّ؛ لا يُخَصّ به المسائل الفقهية العملية،"], [1192.0, "ولا يُخَصّ به المسائل العقدية العلمية،"], [1196.0, "وإنما يُخَصّ به ـ إيش؟"], [1198.2, "ـ المجتهدُ الذي يطلب الحقّ."]], "tr": [[1173.0, "Şayet \"Bağışlanan bu hata sadece fıkıh meselelerinde mi olur, yoksa akîde meselelerine de geçer mi?\" dersen, cevap:"], [1185.7, "O geneldir; amelî fıkıh meselelerine tahsis edilmez, ilmî akîde meselelerine de tahsis edilmez;"], [1196.0, "bilakis —neye?— hakkı arayan müçtehide tahsis edilir."]]}, {"reader": false, "ar": [[1202.0, "فإذا نظر الإنسان في شيءٍ من أدلّة الصفات،"], [1206.0, "وطلب فيها الحقّ، ونظر فيها إلى كلام العلماء،"], [1211.0, "واجتهد واستفرغ وسعه، ثم اختار فيها قولًا،"], [1214.0, "فكان القولُ الذي اختاره هو القولَ الخطأ عند الله،"], [1218.0, "فالله عز وجل يغفر له خطأه هذا؛"], [1221.0, "لأنه كان عن اجتهادٍ قاصدًا للحقّ،"], [1225.0, "وإنما وقع فيه عن شبهةٍ أو تأويل."]], "tr": [[1202.0, "İnsan sıfatların delillerinden birine bakar, onda hakkı arar, bu konuda âlimlerin sözlerine bakar, içtihad eder ve bütün gücünü harcar, sonra bir görüşü seçer de seçtiği görüş Allah katında hatalı görüş olursa, Allah Azze ve Celle onun bu hatasını bağışlar."], [1219.7, "Çünkü bu, hakkı kastederek yapılan bir içtihaddan kaynaklanmıştır;"], [1224.3, "ona ancak bir şüphe veya te'vil sebebiyle düşmüştür."]]}, {"reader": false, "ar": [[1228.0, "ولذلك فكم سيغفر الله عز وجل لأئمّةٍ وقعوا في شيءٍ من التأويل العقديّ أو الخطأ البدعيّ،"], [1237.0, "فوقعوا في تحريفٍ، أو وقعوا في شركٍ،"], [1241.7, "أو وقعوا في بدعة،"], [1245.0, "لكنّ وقوعهم لم يكن عن قصدٍ للمخالفة،"], [1249.9, "وإنما عن اجتهاد، فسلكوا هذا الطريق لظنّهم أنه أرضى لله عز وجل،"], [1258.8, "وأقرب إلى مرضاته وعبادته."], [1261.0, "فلا يُخَصّ به المسائل الفقهية،"], [1264.4, "بل هو شاملٌ للمسائل الفقهية والمسائل العقدية."]], "tr": [[1228.0, "Bu yüzden Allah Azze ve Celle, akîdevî bir te'vile veya bid'î bir hataya düşen, tahrife düşen, şirke düşen ya da bid'ate düşen nice imamı bağışlayacaktır;"], [1240.4, "fakat onların (buna) düşmesi muhalefeti kastetmekten değil, ancak içtihaddan kaynaklanmıştır."], [1247.1, "Bu yolu, Allah Azze ve Celle'yi daha çok razı edeceğini, O'nun rızasına ve O'na ibadete daha yakın olduğunu zannettikleri için tutmuşlardır."], [1259.9, "Dolayısıyla (bu hüküm) fıkıh meselelerine tahsis edilmez;"], [1264.4, "bilakis fıkıh meselelerini de akîde meselelerini de kapsar."]]}, {"reader": false, "ar": [[1270.0, "إلا أننا نستثني الشركَ الصريح الذي دلّت الأدلّة القاطعة والإجماعُ ـ دلّت الأدلّة القاطعة والإجماعُ ـ على كونه شركًا أو مخالفةً شرعية؛"], [1285.0, "فهنا نقطع دائرةَ الاجتهاد فيه،"], [1288.0, "ونوجب على الناظر أن يأخذ بدلالة الدليل القطعيّ،"], [1293.3, "أو يأخذ بالإجماع القطعيّ؛"], [1296.0, "فكيف يجتهد في مسألةٍ فيها دليلٌ قطعيّ،"], [1299.5, "أو يجتهد في مسألةٍ فيها إجماعٌ قطعيّ؟!"], [1303.0, "وإنما نقصد تلك المسائل التي يكون الدليل فيها محتمَلًا أو ظنّيًّا،"], [1309.6, "أو يعارضه ما هو مساوٍ له عند الناظر فيه."]], "tr": [[1270.0, "Ancak kesin delillerin ve icmâın —kesin delillerin ve icmâın— şirk ya da şer'î bir muhalefet olduğuna delâlet ettiği açık şirki istisna ederiz."], [1284.4, "Burada onda içtihad dairesini keseriz ve bakan kişinin kesin delilin delâletini ya da kesin icmâı almasını vacip kılarız."], [1294.7, "Kesin delil bulunan bir meselede nasıl içtihad eder ya da kesin icmâ bulunan bir meselede nasıl içtihad eder?!"], [1303.6, "Biz ancak delilin muhtemel veya zannî olduğu ya da ona bakan kişiye göre kendisine denk bir şeyin onunla çeliştiği meseleleri kastediyoruz."]]}, {"reader": false, "ar": [[1315.0, "وأمّا المسائل الإجماعية، أو المسائل ذات الأدلّة القطعية،"], [1322.0, "فهنا نخطّئه ونؤثّمه؛ لأنه أدخل اجتهاده فيما لا يقبل دخولَ الاجتهاد فيه."], [1333.0, "فلا يأتيني رجلٌ يقول:"], [1335.8, "إنني أجزتُ الذبح لغير الله اجتهادًا؛"], [1340.0, "لأننا سنردّ قوله بأنّ الذبح لغير الله ـ تعبُّدًا وتعظيمًا ـ محرّمٌ بالأدلّة القطعية والإجماع."], [1348.0, "ولا يأتيني رجلٌ يقول:"], [1352.0, "إنني أنكرتُ وجودَ الله عن اجتهادٍ وتأويلٍ وشبهة؛"], [1356.0, "فإننا نقول: إنك أدخلتَ اجتهادك ـ أدخلتَ نفسك في أمرٍ أدلّتُه قطعية، والإجماعُ عليه قطعيّ."]], "tr": [[1315.0, "İcmâî meselelere ya da kesin delilleri olan meselelere gelince, burada onu hatalı sayarız ve günahkâr sayarız;"], [1326.7, "çünkü içtihadını, içtihadın girmesini kabul etmeyen bir alana sokmuştur."], [1331.0, "Bana hiç kimse gelip \"Ben Allah'tan başkası için kurban kesmeyi içtihaden caiz gördüm\" demesin;"], [1339.3, "çünkü onun sözünü, Allah'tan başkası için —ibadet ve tazim maksadıyla— kurban kesmenin kesin deliller ve icmâ ile haram olduğunu söyleyerek reddederiz."], [1349.7, "Bana hiç kimse gelip \"Ben Allah'ın varlığını içtihad, te'vil ve şüphe sonucu inkâr ettim\" demesin;"], [1356.7, "çünkü ona deriz ki: Sen içtihadını —kendini, delilleri kesin ve üzerindeki icmâı kesin olan bir işe soktun."]]}, {"reader": false, "ar": [[1365.0, "لكن لو جاءنا رجلٌ وقال:"], [1367.0, "إنني قلتُ في يدَي الله عز وجل:"], [1370.9, "النعمة والقدرة، عن تأويلٍ واجتهاد،"], [1373.0, "لقلنا: إنّ المسألة فيها خفاءٌ لكثرة الخلاف فيها،"], [1377.7, "وتجاذبِ أدلّة هؤلاء وأدلّة هؤلاء."], [1381.0, "أنتم معي ـ إخوان ـ في هذا؟ إيه."]], "tr": [[1365.0, "Fakat bize biri gelip \"Ben Allah Azze ve Celle'nin iki eli hakkında, te'vil ve içtihad sonucu 'nimet ve kudret' dedim\" dese, deriz ki:"], [1373.6, "Bu meselede, hakkındaki ihtilafın çokluğu ve şunların delilleriyle bunların delillerinin birbirini çekiştirmesi sebebiyle bir kapalılık vardır."], [1381.6, "Kardeşler, bu konuda benimle misiniz? Evet."]]}]}, {"ts": "23:04", "title": "3. Külliye (devam): Külliyenin üç şartı ve delilleri", "paras": [{"reader": false, "ar": [[1384.0, "والخلاصة من ذلك: أنّ هذه الكلّيّة لا بدّ أن تكون مضبوطةً بشروط:"], [1394.0, "الشرط الأول: أن يكون المخطئ مجتهدًا."], [1399.0, "وبناءً على اشتراط هذا الشرط فخطأُ العامّيّ عن قصدٍ <span class=\"q\">؟ 23:23<\/span> وكمالِ قدرةٍ على سؤال أهل العلم،"], [1410.0, "هذا خارجٌ عن هذه الكلّيّة."]], "tr": [[1384.0, "Bunun özeti şudur: Bu külliyenin birtakım şartlarla zabtedilmesi gerekir."], [1392.7, "Birinci şart: Hata edenin müçtehit olması."], [1397.5, "Bu şartın konulmasına göre, âmmînin kasten <span class=\"q\">؟<\/span> ve ilim ehline sormaya tam gücü yeterken yaptığı hata bu külliyenin dışındadır."]]}, {"reader": false, "ar": [[1412.0, "الثاني: أن يكون طالبًا للحقّ بقلبه،"], [1416.1, "بإرادةٍ يعلمها الله عز وجل منه."], [1422.0, "وبناءً على اشتراط هذا الشرط فمن كان خطؤه عن سبق إصرارٍ وترصُّدٍ لطلب شهواته من الدليل فإنه خارجٌ عن هذه الكلّيّة."], [1433.0, "الثالث: أن يكون ـ أن تكون المسألة من المسائل التي يُقبَل فيها دخولُ الاجتهاد."], [1445.0, "وبناءً على ذلك فالمسائل التي كانت الأدلّة فيها قطعيةً متواترة،"], [1452.0, "أو ثبت فيها الإجماع القطعيّ، فالمخطئ فيها آثم."]], "tr": [[1412.0, "İkincisi: Allah Azze ve Celle'nin ondan bildiği bir iradeyle kalbiyle hakkı arıyor olması."], [1422.6, "Bu şartın konulmasına göre, hatası, delilden arzularını elde etmek için önceden kararlaştırılmış bir ısrar ve pusu (tasarlama) ile olan kimse bu külliyenin dışındadır."], [1435.7, "Üçüncüsü: Meselenin, içtihadın girmesinin kabul edildiği meselelerden olması."], [1445.0, "Buna göre delillerin kesin ve mütevâtir olduğu ya da kesin icmâın sabit olduğu meselelerde hata eden günahkârdır."]]}, {"reader": false, "ar": [[1459.0, "ويدلّ على ذلك قولُ النبيّ صلى الله عليه وسلم في الحديث الصحيح:"], [1465.0, "«إذا اجتهد الحاكمُ فحكم فأصاب فله أجران، وإن أخطأ فله أجرٌ واحد»."], [1474.0, "وفي مرّةٍ ـ أو نقول:"], [1476.7, "في غزوة خيبر ـ قال النبيّ صلى الله عليه ـ لا،"], [1481.6, "في غزوة بني قريظة ـ قال النبيّ صلى الله عليه وسلم:"], [1487.0, "«لا يصلّينّ أحدُكم العصرَ إلا في بني قريظة»."], [1495.0, "فاختلفوا في تأويل كلام النبيّ صلى الله عليه وسلم:"], [1499.0, "فمنهم من صلّى في الطريق لمّا حان وقت صلاة العصر،"], [1503.0, "ومنهم من أخّرها حتى خرج وقتها ليصلَ بني قريظة، عملًا بظاهر الحديث."]], "tr": [[1459.0, "Buna Nebî ﷺ'in sahih hadisteki şu sözü delâlet eder:"], [1463.5, "\"Hâkim içtihad edip hüküm verir ve isabet ederse ona iki ecir vardır;"], [1471.2, "hata ederse ona bir ecir vardır.\" Bir defasında —ya da Hayber gazvesinde diyelim— Nebî ﷺ buyurdu ki— hayır, Benî Kurayza gazvesinde— Nebî ﷺ şöyle buyurdu:"], [1487.0, "\"Hiçbiriniz ikindiyi Benî Kurayza'dan başka yerde kılmasın.\" Bunun üzerine Nebî ﷺ'in sözünün te'vilinde ihtilaf ettiler:"], [1498.6, "Kimisi ikindi namazının vakti girince yolda kıldı;"], [1501.4, "kimisi de hadisin zahiriyle amel ederek Benî Kurayza'ya varmak için vakti çıkana kadar onu erteledi."]]}, {"reader": false, "ar": [[1509.0, "وعلم النبيّ صلى الله عليه وسلم بكلا القولين،"], [1512.8, "وعملِ كلا الطائفتين، وصوّب كلَّ واحدةٍ منهما على اجتهادها،"], [1519.0, "ولم ينكر على أحدٍ منهم؛"], [1521.0, "فلو كان أحدهم مذنبًا لأمره بالإعادة أو بالتوبة. والله أعلم."]], "tr": [[1509.0, "Nebî ﷺ her iki görüşü ve her iki grubun amelini öğrendi;"], [1513.7, "her birini kendi içtihadı üzere doğru saydı ve hiçbirini kınamadı."], [1519.0, "Şayet onlardan biri günahkâr olsaydı, ona (namazı) iade etmesini ya da tövbe etmesini emrederdi. Allah en iyisini bilir."]]}]}, {"ts": "25:29", "title": "4. Külliye: Mükeffir bid'at sahibine kâfirlere muamele edildiği gibi muamele edilir", "paras": [{"reader": false, "ar": [[1529.0, "ومن الكلّيّات أيضًا ـ الكلّيّة الرابعة،"], [1532.5, "أو: من الكلّيّات أيضًا ـ:"], [1540.0, "<b>كلُّ ذي بدعةٍ مكفِّرةٍ فيُعامَل معاملةَ الكفرة.<\/b> <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [1574.0, "وذلك لأنّ البدعة باعتبار أحكامها تنقسم إلى قسمين:"], [1579.0, "إلى بدعةٍ مكفِّرة، أي توجب لصاحبها الكفر،"], [1585.0, "وإلى بدعةٍ مفسِّقة، أي توجب لصاحبها الفسق."]], "tr": [[1529.0, "Külliyelerden biri de —4. külliye, ya da:"], [1532.5, "külliyelerden biri de— şudur: 4."], [1540.0, "külliye: Mükeffir (küfre götüren) bir bid'at sahibi olan herkese kâfirlere muamele edildiği gibi muamele edilir. (Tekrarlıyor.) Tevfik Allah'tandır, derim ki:"], [1577.0, "Bu şundandır: Bid'at, hükümleri itibarıyla iki kısma ayrılır:"], [1582.0, "Mükeffir bid'at, yani sahibine küfrü gerektiren;"], [1585.9, "ve müfessık bid'at, yani sahibine fıskı gerektiren."]]}, {"reader": false, "ar": [[1591.0, "وقد ذكرتُ لكم سابقًا ضوابطَ البدعة:"], [1596.0, "متى تكون مكفِّرة، ومتى تكون مفسِّقة."], [1601.0, "ولو أننا جعلنا هاتين القاعدتين قبلها برقمها الخاصّ بها لكان أقربَ إلى الترتيب."], [1611.0, "وهذه الكلّيّة في القسم الأول،"], [1614.6, "وهي البدع المكفِّرة. فإذا كان الإنسان المبتدع ـ فإذا كان المبتدع محكومًا عليه بكفره ببدعته فإنني أتعامل معه كما أتعامل مع الكافر الأصليّ."]], "tr": [[1591.0, "Size daha önce bid'atin zâbıtlarını, ne zaman mükeffir ne zaman müfessık olduğunu zikretmiştim."], [1601.7, "Bu iki kaideyi bundan önce kendilerine has numaralarıyla koysaydık, tertibe daha uygun olurdu."], [1612.5, "Bu külliye birinci kısımla, yani mükeffir bid'atlerle ilgilidir."], [1618.9, "Bid'atçi insan —bid'atçi, bid'ati sebebiyle kâfir olduğuna hükmedilmişse, ona aslî kâfire muamele ettiğim gibi muamele ederim."]]}, {"reader": false, "ar": [[1630.0, "لأنّ الكفر ينقسم إلى كفرِ أصالةٍ وإلى كفرِ ردّة،"], [1636.9, "وكلا الكفرين يوجبان تعاملًا واحدًا؛"], [1644.0, "بل إنّ كفر الردّة مبناه على التغليظ وعدم الإقرار،"], [1648.0, "فإنّ صاحبه يُستتاب، فإن تاب وإلا قُتل،"], [1653.0, "وصاحبُ الكفر الأصليّ لا يُستتاب من كفره."], [1657.0, "فكفرُ الردّة أغلظ، أغلظ من كفر الأصالة."]], "tr": [[1630.0, "Çünkü küfür, aslî küfür ve irtidat küfrü olmak üzere ikiye ayrılır;"], [1635.9, "her iki küfür de aynı muameleyi gerektirir."], [1640.2, "Hatta irtidat küfrü, ağırlaştırma ve (o hâl üzere) bırakmama esasına dayanır:"], [1647.6, "Sahibinden tövbe etmesi istenir; tövbe ederse (ne âlâ), yoksa öldürülür."], [1653.0, "Aslî küfür sahibinden ise küfründen dolayı tövbe etmesi istenmez."], [1657.0, "Dolayısıyla irtidat küfrü aslî küfürden daha ağır, daha ağırdır."]]}, {"reader": false, "ar": [[1663.0, "فإذا قيل لك مثلًا:"], [1665.8, "هل نصلّي على المبتدع الكافر إذا مات؟"], [1672.0, "فتقول: لا يجوز الصلاة عليه؛"], [1675.3, "لأننا نعامله معاملة الكفرة."], [1678.0, "وإن قيل لك: هل نغسّله ونكفّنه؟"], [1683.0, "فقل: لا نغسّله ولا نكفّنه؛"], [1686.3, "لأننا نعامله معاملة الكفرة."], [1689.0, "فإن قيل لك: وهل ندفنه في مقابر المسلمين؟"], [1693.0, "فقل: لا ندفنه؛ لأننا نعامله معاملة الكفرة."], [1697.0, "فإن قيل: وهل تُقبَل روايته للحديث إذا روى؟"], [1702.0, "الجواب: لا نقبلها؛ لأننا نعامله معاملة الكفرة."], [1708.0, "فإن قيل: وهل تُقبَل شهادته في باب القضاء؟"], [1712.0, "فقل: لا نقبلها؛ لأننا نعامله معاملة الكفرة."]], "tr": [[1663.0, "Mesela sana \"Kâfir bid'atçi ölünce cenaze namazını kılar mıyız?\" denirse, şöyle dersin:"], [1669.2, "Cenaze namazını kılmak caiz değildir;"], [1672.7, "çünkü ona kâfirlere muamele edildiği gibi muamele ederiz."], [1677.3, "Sana \"Onu yıkar ve kefenler miyiz?\" denirse, de ki:"], [1681.8, "Onu yıkamayız ve kefenlemeyiz; çünkü ona kâfirlere muamele edildiği gibi muamele ederiz."], [1689.0, "Sana \"Onu Müslümanların mezarlığına defneder miyiz?\" denirse, de ki:"], [1692.0, "Onu defnetmeyiz; çünkü ona kâfirlere muamele edildiği gibi muamele ederiz."], [1696.4, "\"Hadis rivayet ettiğinde rivayeti kabul edilir mi?\" denirse, cevap:"], [1700.8, "Onu kabul etmeyiz; çünkü ona kâfirlere muamele edildiği gibi muamele ederiz."], [1706.5, "\"Yargı babında şahitliği kabul edilir mi?\" denirse, de ki:"], [1711.0, "Onu kabul etmeyiz; çünkü ona kâfirlere muamele edildiği gibi muamele ederiz."]]}, {"reader": false, "ar": [[1717.0, "فإن قيل لك: وهل نزوّجه ابنتنا المسلمة إذا تقدّم إلينا خاطبًا؟"], [1724.0, "فقل: لا يجوز تزويجه؛"], [1727.0, "لأننا نعامله معاملة الكفرة."], [1730.0, "فإن قيل لك: وهل يجوز للمسلم أن يتزوّج بمبتدعةٍ مرتدّة؟"], [1737.0, "الجواب: لا يجوز الزواج بها؛"], [1740.6, "لأننا نعاملها معاملة الكفرة."], [1744.0, "فإن قيل لك: وهل يرث المبتدعُ الكافرُ من قريبه إذا مات؟"], [1752.0, "فقل: لا يرثه؛ لأنه «لا يرث الكافرُ من المسلم، ولا المسلمُ الكافرَ»."]], "tr": [[1717.0, "Sana \"Bize görücü olarak gelirse Müslüman kızımızı ona nikâhlar mıyız?\" denirse, de ki:"], [1724.0, "Onu evlendirmek caiz değildir; çünkü ona kâfirlere muamele edildiği gibi muamele ederiz."], [1731.4, "Sana \"Bir Müslümanın mürted bid'atçi bir kadınla evlenmesi caiz midir?\" denirse, cevap:"], [1738.4, "Onunla evlenmek caiz değildir; çünkü ona kâfirlere muamele edildiği gibi muamele ederiz."], [1746.1, "Sana \"Kâfir bid'atçi, akrabası ölünce ona mirasçı olur mu?\" denirse, de ki:"], [1753.3, "Ona mirasçı olmaz; çünkü \"Kâfir Müslümana, Müslüman da kâfire mirasçı olmaz.\""]]}, {"reader": false, "ar": [[1759.0, "فإن قيل لك: وهل يُورَث المبتدعُ الكافر إذا مات؟"], [1765.0, "الجواب: لا يرثه أبناؤه المسلمون،"], [1769.0, "وإنما يكون ماله فيئًا لبيت مال المسلمين."], [1776.0, "فإن قيل لك: وهل يُستغفَر له،"], [1779.0, "أو يُدعى له بالرحمة إذا مات؟"], [1782.0, "فقل: لا يُدعى له ولا يُستغفَر له؛"], [1786.8, "لأنه في حكمنا كافر."], [1792.0, "فإن قلتَ: وهل يكون وليًّا على نكاح ابنته المسلمة؟"], [1801.0, "الجواب: لا يكون وليًّا في نكاحها؛"], [1808.0, "لأنه لا ولايةَ لكافرٍ على مسلمة."]], "tr": [[1759.0, "Sana \"Kâfir bid'atçi ölünce ona mirasçı olunur mu?\" denirse, cevap:"], [1765.0, "Müslüman çocukları ona mirasçı olmaz;"], [1768.2, "malı ancak Müslümanların beytülmâli için fey olur."], [1772.7, "Sana \"Ölünce onun için istiğfar edilir mi ya da rahmet duası edilir mi?\" denirse, de ki:"], [1782.7, "Ona dua edilmez ve onun için istiğfar edilmez;"], [1787.5, "çünkü o bizim hükmümüzde kâfirdir."], [1793.4, "Şayet \"Müslüman kızının nikâhında velî olur mu?\" dersen, cevap:"], [1801.8, "Onun nikâhında velî olamaz; çünkü kâfirin Müslüman bir kadın üzerinde velâyeti yoktur."]]}]}, {"ts": "30:13", "title": "5. Külliye: Müfessık bid'at sahibine muvahhidlerin âsilerine muamele edildiği gibi, daha ağır olarak muamele edilir", "paras": [{"reader": false, "ar": [[1813.0, "ولعلّ الأمر واضح، ويزداد وضوحًا بالكلّيّة التي بعدها،"], [1819.0, "وهي الكلّيّة الخامسة أو السادسة."], [1824.0, "طيّب: كلُّ ذي بدعةٍ مفسِّقةٍ فيُعامَل معاملةَ عُصاة الموحّدين،"], [1834.9, "ويُزاد في التغليظ عليه. <span class=\"note\">(يكررها)<\/span> أقول وبالله التوفيق:"], [1843.0, "وهذه الكلّيّة هي القسم الثاني من أقسام البدعة باعتبار أحكامها،"], [1856.0, "ونقول في فروعها عكسَ ما قلناه في فروع الكلّيّة التي قبلها."]], "tr": [[1813.0, "Umarım mesele açıktır; ondan sonraki külliyeyle daha da açıklığa kavuşur;"], [1817.2, "o da 5. —ya da 6.— külliyedir."], [1824.0, "Pekâlâ: <b>5. külliye: Müfessık (fıska götüren) bir bid'at sahibi olan herkese, muvahhidlerin âsilerine muamele edildiği gibi muamele edilir ve ona karşı daha da sert davranılır.<\/b> (Tekrarlıyor.) Tevfik Allah'tandır, derim ki:"], [1847.1, "Bu külliye, hükümleri itibarıyla bid'atin kısımlarından ikinci kısımdır."], [1858.1, "Bunun fer'î meselelerinde, önceki külliyenin fer'î meselelerinde söylediğimizin tersini söyleriz."]]}, {"reader": false, "ar": [[1865.0, "فهل تصحّ إمامةُ المبتدع؟"], [1867.6, "الجواب: إن كان ممّن يكفر ببدعته فلا تصحّ إمامته،"], [1873.4, "وإن كان ممّن لا يكفر ببدعته فإمامته صحيحة،"], [1879.0, "إلا أنّ الصلاة خلف غيره من أهل السنّة أَولى."], [1884.0, "هل تنعقد الإمامة للمبتدع؟"], [1886.9, "أقصد إمامةَ الدنيا: الخلافة."], [1893.0, "هل تنعقد الإمامة للمبتدع؟"], [1896.0, "الجواب: إن كان ممّن يكفر ببدعته فلا تنعقد له الإمامة العظمى،"], [1901.0, "وإن كان ممّن لا يكفر ببدعته فتنعقد له الإمامة العظمى؛"], [1910.0, "إلا أنّ الإمام الأعظم متى ما كان أجمعَ للشروط المعتبرة في الإمامة كلّما كانت إمامته للناس وإدارته لهم أتمَّ وأكمل."]], "tr": [[1865.0, "Bid'atçinin imamlığı sahih olur mu?"], [1867.6, "Cevap: Bid'ati sebebiyle kâfir olanlardan ise imamlığı sahih olmaz;"], [1872.8, "bid'ati sebebiyle kâfir olmayanlardan ise imamlığı sahihtir."], [1877.3, "Ancak Ehl-i Sünnet'ten başkasının arkasında na
