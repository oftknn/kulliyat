<script>
const D={"no": 58, "vid": "BY0fbMjrBKE", "title_ar": "الدرس (٥٨) من شرح كليات العقيدة — من كليات الأسماء والصفات", "title_tr": "Şerhu Külliyyâti'l-Akîde — 58. Ders: İsim ve Sıfatlar Külliyeleri (İsimlerin Tevkîfîliği, İsimlerin Hüsnâ Oluşu, Nassla Sabit Olmayan İsim, Sabit İsmin Yerine Başka Lafız Koymak, İsmin Sıfatı Tazammunu, Çift İsimler, İsimlerin Sayılamaması, İhtilaflı İsimler, İsimlerde İlhad)", "sections": [{"ts": "00:00", "title": "Giriş: Kitabın durumu ve üçüncü bab: İsim ve sıfatlar · 1. Külliye: Allah'ın bütün isimleri tevkîf üzerine kuruludur", "paras": [{"reader": false, "ar": [[0.0, "الحمدُ لله ربِّ العالمين،"], [2.3, "والصلاةُ والسلامُ على رسول الله الأمين،"], [5.7, "وعلى آله وأصحابه الطيبين الطاهرين،"], [8.6, "ومن تبعهم بإحسانٍ إلى يوم الدين."]], "tr": [[0.0, "Âlemlerin Rabbi Allah'a hamd olsun."], [1.7, "Salât ve selâm, Allah'ın emin Resûlü'ne, onun temiz ve pâk âline ve ashâbına ve kıyamet gününe kadar onlara güzellikle tâbi olanlara olsun."]]}, {"reader": false, "ar": [[12.0, "من باب إخباركم بما جرى في هذا الكتاب:"], [16.7, "نحن تجاوزنا خمسمائة كلّيّة ـ ولله الحمد والمنّة ـ إلى الآن،"], [22.0, "وصدر منه للتحقيق مجلّدان،"], [24.4, "ولله الحمد والمنّة، قد انتهيتُ من مراجعتها إلى هذه القاعدة،"], [30.2, "إلى هذه القاعدة. وأسأل الله أن ينفع به المسلمين،"], [34.2, "وأن يجعله خالصًا لوجهه الكريم."]], "tr": [[12.0, "Bu kitapta olup biteni size haber vermek kabilinden:"], [16.7, "Allah'a hamd ve minnet olsun, şu ana kadar beş yüz külliyeyi geçtik."], [22.0, "Ondan iki cilt tahkik için çıktı;"], [24.9, "Allah'a hamd ve minnet olsun, bu kaideye kadar —bu kaideye kadar— gözden geçirmesini bitirdim."], [32.0, "Allah'tan onu Müslümanlara faydalı kılmasını ve onu kerîm vechi için hâlis kılmasını dilerim."]]}, {"reader": false, "ar": [[36.0, "ننتقل في هذا الدرس ـ بإذن الله عز وجل ـ إلى بابٍ من الأبواب العقديّة العظيمة،"], [46.0, "وأنا أعتبره الباب الثالث؛"], [47.0, "لأنّ الباب الأول: كلّيّات الربوبيّة ومتعلّقاتها،"], [52.0, "والباب الثاني: كلّيّات الألوهيّة ومتعلّقاتها،"], [56.0, "والآن نبدأ في الباب الثالث،"], [58.7, "وهو كلّيّات باب الأسماء والصفات ومتعلّقاته."], [62.0, "وسوف نبقى فيه دروسًا كثيرةً بإذن الله عز وجل حتى نفصّله،"], [68.0, "ونذكر كلَّ ما يتعلّق به من التقريرات والردود."], [73.0, "وقواعده خفيفة، ولكن قد تطول عليكم ببعض النقول،"], [78.0, "ببعض النقول قليلًا. فنقول مستعينين بالله عز وجل:"]], "tr": [[36.0, "Bu derste Allah Azze ve Celle'nin izniyle büyük akîde bablarından birine geçiyoruz;"], [44.1, "ben onu üçüncü bab sayıyorum."], [47.0, "Çünkü birinci bab: rubûbiyyet külliyeleri ve taallukları;"], [49.3, "ikinci bab: ulûhiyyet külliyeleri ve taallukları idi."], [53.6, "Şimdi üçüncü baba başlıyoruz; o da isim ve sıfatlar babının külliyeleri ve taalluklarıdır."], [62.0, "Allah Azze ve Celle'nin izniyle onu tafsilatlı işleyinceye ve onunla ilgili bütün takrirleri ve reddiyeleri zikredinceye kadar birçok ders bu babda kalacağız."], [73.0, "Kaideleri hafiftir, fakat bazı nakillerle —bazı nakillerle— biraz uzayabilir."], [78.0, "Allah Azze ve Celle'den yardım dileyerek deriz ki:"]]}, {"reader": false, "ar": [[83.0, "الكلّيّة الأولى: <b>كلُّ أسماء الله مبناها على التوقيف.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ أسماء الله عز وجل مبناها على التوقيف.<\/b>"]], "tr": [[83.0, "1. külliye: 1. külliye: Allah'ın bütün isimleri tevkîf (nassa bağlılık) üzerine kuruludur. (Tekrar ediyor.) 1."], [87.6, "külliye: Allah Azze ve Celle'nin bütün isimleri tevkîf üzerine kuruludur."]]}, {"reader": false, "ar": [[92.0, "أقول وبالله التوفيق: وهذا بإجماع أهل السنّة والجماعة."], [99.0, "وهذا يرجع إلى أصلٍ عظيمٍ عند أهل السنّة والجماعة،"], [104.0, "وهي أنّ ما كان غيبيًّا فيكون توقيفيًّا،"], [107.0, "وأسماءُ الله عز وجل غيبيّة."], [111.0, "فحينئذٍ لا يجوز لنا أن نُثبت لله من الأسماء إلا ما أثبته لنفسه في كتابه،"], [117.0, "أو أثبته له نبيُّه صلى الله عليه وسلم في صحيح سنّته."], [122.0, "فلا يجوز لنا أن نسمّي الله عز وجل بما لم يسمِّ به نفسَه؛"], [130.0, "لأنّ أحدًا من الخلق لا يعرف ما يستحقّه الله عز وجل من الأسماء."], [136.0, "فلا الملائكةُ يعرفون ما يستحقّه الله من الأسماء إلا بالوحي،"], [143.0, "ولا الأنبياءُ ولا الرسلُ ولا المكلَّفون من الإنس والجنّ يعلمون هذه الأسماء على وجه التفصيل إلا بإخبار الله عز وجل لهم."]], "tr": [[92.0, "Tevfik Allah'tandır, derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'in icmâıyla böyledir."], [99.0, "Bu, Ehl-i Sünnet ve'l-Cemaat katında büyük bir asla dayanır:"], [104.0, "Gaybî olan şey tevkîfîdir; Allah Azze ve Celle'nin isimleri de gaybîdir."], [111.0, "O hâlde Allah için isimlerden ancak O'nun Kitabı'nda kendisi için isbat ettiğini veya Peygamberi sallallâhu aleyhi ve sellem'in sahih sünnetinde O'nun için isbat ettiğini isbat etmemiz caizdir."], [122.0, "Allah Azze ve Celle'yi, kendisini isimlendirmediği bir isimle isimlendirmemiz caiz değildir."], [130.0, "Çünkü yaratılmışlardan hiç kimse Allah Azze ve Celle'nin hak ettiği isimleri bilemez."], [136.0, "Melekler de Allah'ın hak ettiği isimleri ancak vahiyle bilirler;"], [142.0, "nebîler, resuller ve insanlardan ve cinlerden mükellef olanlar da bu isimleri tafsilatlı olarak ancak Allah Azze ve Celle'nin onlara haber vermesiyle bilirler."]]}, {"reader": false, "ar": [[152.0, "ولذلك فإنّ هناك أسماءً يستحقّها الله عز وجل لم تزل في علم الغيب،"], [159.3, "قد استأثر الله عز وجل بها،"], [162.0, "كما سيأتينا في بعض الكلّيّات إن شاء الله."], [164.0, "وبما أنّه بابٌ غيبيّ فليس للاجتهاد فيه مدخل،"], [171.0, "وإنما هو توقيفيٌّ على ثبوت النصّ،"], [175.0, "وعلى ذلك نصّ أهلُ العلم."]], "tr": [[152.0, "Bu sebeple Allah Azze ve Celle'nin hak ettiği, hâlâ gayb ilminde olan ve Allah Azze ve Celle'nin kendi ilmine tahsis ettiği isimler vardır;"], [162.8, "inşallah bazı külliyelerde bu gelecek."], [164.0, "Bu, gaybî bir bab olduğuna göre içtihadın burada yeri yoktur;"], [171.0, "o ancak nassın sübûtuna bağlı, tevkîfîdir."], [174.3, "İlim ehli de bunu açıkça belirtmiştir."]]}, {"reader": false, "ar": [[179.0, "قال ابن أبي زَمَنِين رحمه الله تعالى:"], [184.0, "«اعلم أنّ أهل العلم بالله وبما جاءت به أنبياؤه ورسلُه ـ انتبهوا، انتبهوا للعبارة ـ يرون الجهلَ بما لم يُخبر به تبارك وتعالى عن نفسه علمًا»."], [199.0, "فهمتموها؟ أُعيدها مرّةً ثانية بدون ما أشرحها:"], [205.0, "«اعلم أنّ أهل العلم بالله وبما جاءت به أنبياؤه ورسلُه يرون الجهلَ بما لم يُخبر به تبارك وتعالى عن نفسه علمًا»."], [215.0, "يعني: أن تُخبر بجهلك فيما لم يُطلعك الوحيُ عليه،"], [220.0, "هذا خيرٌ عند الله عز وجل وأفضل من أن تتكلّم وأن تتقوّل على الله عز وجل بلا علم."], [227.0, "فحقيقةُ العلم في الأمور الغيبيّة أن تُخبر بجهلك عنها. فهمتموها؟"]], "tr": [[179.0, "İbn Ebî Zemenîn rahimehullâh şöyle dedi:"], [184.0, "\"Bil ki Allah'ı ve O'nun nebîlerinin ve resullerinin getirdiğini bilen ilim ehli —dikkat edin, ifadeye dikkat edin— Tebâreke ve Teâlâ'nın kendisi hakkında haber vermediği şeyi bilmemeyi ilim sayarlar.\" Anladınız mı?"], [199.0, "Şerh etmeden ikinci kez tekrar ediyorum:"], [205.0, "\"Bil ki Allah'ı ve O'nun nebîlerinin ve resullerinin getirdiğini bilen ilim ehli, Tebâreke ve Teâlâ'nın kendisi hakkında haber vermediği şeyi bilmemeyi ilim sayarlar.\" Yani vahyin seni muttali kılmadığı şey hakkında bilmediğini söylemen, Allah Azze ve Celle katında, Allah Azze ve Celle hakkında ilimsiz konuşmandan ve uydurmandan daha hayırlı ve daha üstündür."], [227.0, "Gaybî işlerde ilmin hakikati, onlar hakkında bilmediğini söylemendir. Anladınız mı?"]]}, {"reader": false, "ar": [[234.0, "«والعجزَ عمّا لم يدعُ له إيمانًا، وأنّهم إنما ينتهون من وصفه بصفاته وأسمائه إلى حيث انتهى في كتابه وعلى لسان نبيّه صلى الله عليه وسلم». انتهى كلامه."]], "tr": [[234.0, "\"...ve (Allah'ın) davet etmediği şeyden âciz kalmayı iman sayarlar."], [241.1, "Onlar O'nu sıfatları ve isimleriyle vasfetmekte ancak O'nun Kitabı'nda ve Peygamberi sallallâhu aleyhi ve sellem'in dilinde durduğu yerde dururlar.\" Sözü bitti."]]}, {"reader": false, "ar": [[250.0, "وقال أبو منصور البغداديّ رحمه الله تعالى:"], [254.9, "«إنّ مأخذ أسماء الله عز وجل التوقيفُ عليها: إمّا بالقرآن، وإمّا بالسنّة الصحيحة، وإمّا بإجماع الأمّة عليه، ولا يجوز إطلاقُ اسمٍ عليه من طريق القياس»."], [270.0, "انتهى كلامه. والمتقرِّر في قواعد أهل السنّة والجماعة ألّا مدخل للقياس في مسائل الغيبيّات أبدًا."]], "tr": [[250.0, "Ebû Mansûr el-Bağdâdî rahimehullâh şöyle dedi:"], [254.9, "\"Allah Azze ve Celle'nin isimlerinin kaynağı onlarda tevkîftir:"], [258.8, "ya Kur'ân'la, ya sahih sünnetle ya da ümmetin onun üzerindeki icmâıyla."], [264.5, "O'na kıyas yoluyla bir isim nispet etmek caiz değildir.\" Sözü bitti."], [270.0, "Ehl-i Sünnet ve'l-Cemaat'in kaidelerinde yerleşik olan şudur:"], [274.1, "Gaybî meselelerde kıyasın asla yeri yoktur."]]}, {"reader": false, "ar": [[277.0, "وقال ابن حزمٍ رحمه الله تعالى:"], [281.0, "«لا يجوز أن يُسمّى الله تعالى، ولا أن يُخبَر عنه إلا بما سمّى به نفسه، أو أخبر به عن نفسه في كتابه، أو على لسان رسوله صلى الله عليه وسلم، أو صحّ به إجماعُ جميع أهل الإسلام المتيقَّن، ولا مزيد. وحتى وإن كان المعنى صحيحًا فلا يجوز أن يُطلق عليه تعالى اللفظ». انتهى كلامه."]], "tr": [[277.0, "İbn Hazm rahimehullâh şöyle dedi:"], [281.0, "\"Allah Teâlâ'nın, ancak Kitabı'nda veya Resûlü sallallâhu aleyhi ve sellem'in dilinde kendisini isimlendirdiği veya kendisi hakkında haber verdiği şeyle ya da bütün İslâm ehlinin kesin icmâının sahih olarak bulunduğu şeyle isimlendirilmesi ve O'nun hakkında haber verilmesi caizdir;"], [299.8, "fazlası değil. Mânâ sahih olsa bile, o lafzın Teâlâ'ya nispet edilmesi caiz değildir.\" Sözü bitti."]]}]}, {"ts": "05:11", "title": "1. Külliye (devam): Lafzın sahih olması nispetin sahih olmasını gerektirmez · Âlimlerin nakilleri", "paras": [{"reader": false, "ar": [[311.0, "والمتقرِّر في القواعد أنّ صحّة اللفظ لا تدلّ على صحّة الإطلاق؛"], [318.0, "فقد يكون اللفظ صحيحًا،"], [319.8, "لكن لا يجوز أن نُطلقه على الله عز وجل باعتبار كونه اسمًا من أسمائه."]], "tr": [[311.0, "Kaidelerde yerleşik olan şudur: Lafzın sahih olması, onun (Allah'a) nispetinin sahih olduğunu göstermez."], [318.0, "Lafız sahih olabilir, fakat onu Allah Azze ve Celle'ye O'nun isimlerinden bir isim olması itibarıyla nispet etmemiz caiz olmaz."]]}, {"reader": false, "ar": [[326.0, "وقال ابن عبد البرّ رحمه الله تعالى:"], [330.0, "«لا نسمّيه ولا نصفه ولا نُطلق عليه إلا ما سمّى به نفسَه، على ما تقدّم ذِكرُنا له من وصفه لنفسه، لا شريك له، ولا ندفع ما وصف به نفسه؛ لأنه دفعٌ للقرآن». انتهى كلامه."]], "tr": [[326.0, "İbn Abdilberr rahimehullâh şöyle dedi:"], [327.1, "\"O'nu ancak kendisini isimlendirdiği şeyle isimlendirir, vasfeder ve O'na nispet ederiz;"], [330.0, "daha önce zikrettiğimiz, O'nun kendisini vasfetmesi üzere —O'nun ortağı yoktur—."], [337.4, "O'nun kendisini vasfettiği şeyi de reddetmeyiz;"], [341.7, "çünkü bu, Kur'ân'ı reddetmektir.\" Sözü bitti."]]}, {"reader": false, "ar": [[348.0, "وقال البزدويّ الحنفيّ رحمه الله تعالى:"], [350.8, "«أسامي الله، أسامي الله تعالى عند أهل السنّة والجماعة توقيفيّة؛ لأنّه ليس لأحدٍ أن يسمّي الله تعالى باسمٍ إلا أن يأذن الله تعالى له»."], [366.0, "انتهى كلامه. وسيأتي مزيدٌ من البيان لهذه الكلّيّة فيما يأتي بعدها إن شاء الله، والله أعلم."]], "tr": [[348.0, "Hanefî Pezdevî rahimehullâh şöyle dedi:"], [350.8, "\"Allah'ın isimleri —Allah Teâlâ'nın isimleri— Ehl-i Sünnet ve'l-Cemaat katında tevkîfîdir."], [355.8, "Çünkü Allah Teâlâ izin vermedikçe hiç kimsenin Allah Teâlâ'yı bir isimle isimlendirme hakkı yoktur.\" Sözü bitti."], [366.0, "İnşallah bundan sonra gelecek olanlarda bu külliyenin daha fazla açıklaması gelecek. Allah en iyisini bilir."]]}]}, {"ts": "06:15", "title": "2. Külliye: Allah'ın bütün isimleri hüsnâdır (en güzeldir)", "paras": [{"reader": false, "ar": [[375.0, "الكلّيّة الثانية: <b>كلُّ أسماء الله حُسنى.<\/b>"]], "tr": [[375.0, "2. külliye: <b>2. külliye: Allah'ın bütün isimleri hüsnâdır (en güzeldir).<\/b>"]]}, {"reader": false, "ar": [[378.0, "أقول وبالله التوفيق: وهذا بإجماع أهل السنّة والجماعة أيضًا،"], [384.0, "وقد دلّ عليها كتابُ الله عز وجل؛"], [387.0, "فقال الله عز وجل:"], [389.0, "<span class=\"ayah\">﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٠]<\/span>،"], [392.0, "وقال الله عز وجل:"], [394.0, "<span class=\"ayah\">﴿قُلِ ادْعُوا اللَّهَ أَوِ ادْعُوا الرَّحْمَٰنَ ۖ أَيًّا مَّا تَدْعُوا فَلَهُ الْأَسْمَاءُ الْحُسْنَىٰ﴾<\/span> <span class=\"ref\">[الإسراء: ١١٠]<\/span>،"], [402.0, "وقال الله عز وجل:"], [404.3, "<span class=\"ayah\">﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ﴾<\/span> <span class=\"ref\">[طه: ٨]<\/span>،"], [409.0, "وقال الله عز وجل:"], [410.4, "<span class=\"ayah\">﴿هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ ۖ عَالِمُ الْغَيْبِ وَالشَّهَادَةِ ۖ هُوَ الرَّحْمَٰنُ الرَّحِيمُ﴾<\/span> <span class=\"ref\">[الحشر: ٢٢]<\/span>،"], [415.0, "إلى أن قال: <span class=\"ayah\">﴿هُوَ اللَّهُ الْخَالِقُ الْبَارِئُ الْمُصَوِّرُ ۖ لَهُ الْأَسْمَاءُ الْحُسْنَىٰ﴾<\/span> <span class=\"ref\">[الحشر: ٢٤]<\/span>."]], "tr": [[378.0, "Tevfik Allah'tandır, derim ki: Bu da Ehl-i Sünnet ve'l-Cemaat'in icmâıyla böyledir."], [384.0, "Allah Azze ve Celle'nin Kitabı buna delâlet etmiştir."], [387.0, "Allah Azze ve Celle şöyle buyurdu:"], [389.0, "<span class=\"ayah\">﴿En güzel isimler Allah'ındır; O'na onlarla dua edin﴾<\/span> [A'râf 180]."], [394.0, "Allah Azze ve Celle şöyle buyurdu:"], [395.7, "<span class=\"ayah\">﴿De ki: İster Allah deyin, ister Rahmân deyin; hangisiyle dua ederseniz edin, en güzel isimler O'nundur﴾<\/span> [İsrâ 110]."], [404.3, "Allah Azze ve Celle şöyle buyurdu:"], [406.7, "<span class=\"ayah\">﴿Allah, O'ndan başka ilah yoktur; en güzel isimler O'nundur﴾<\/span> [Tâhâ 8]."], [410.4, "Allah Azze ve Celle şöyle buyurdu:"], [411.8, "<span class=\"ayah\">﴿O, kendisinden başka ilah olmayan Allah'tır; gaybı da şehâdeti (görüneni) de bilendir. O, Rahmân'dır, Rahîm'dir﴾<\/span> [Haşr 22];"], [417.1, "şu sözüne kadar: <span class=\"ayah\">﴿O; yaratan, var eden, şekil veren Allah'tır. En güzel isimler O'nundur﴾<\/span> [Haşr 24]."]]}, {"reader": false, "ar": [[424.0, "قال الإمام ابن القيّم رحمه الله تعالى:"], [428.6, "«أسماؤه تعالى كلُّها مدحٌ وثناءٌ وتمجيد، ولذلك كانت حُسنى، وصفاتُه كلُّها صفاتُ كمال»."], [440.0, "وقال الشيخ محمود الآلوسيّ رحمه الله تعالى:"], [444.6, "«والحُسنى تأنيثُ الأحسن، وهي أفعلُ تفضيل، ومعنى ذلك أنها أحسنُ الأسماء وأجلُّها؛ لإنبائها عن أحسن المعاني وأشرفها»."], [459.0, "انتهى كلامهم رحمهم الله."]], "tr": [[424.0, "İmam İbnü'l-Kayyim rahimehullâh şöyle dedi:"], [425.3, "\"O'nun —Teâlâ— isimlerinin hepsi medih, senâ ve temcîddir (yüceltmedir);"], [428.6, "bu yüzden hüsnâdır. Sıfatlarının hepsi de kemal sıfatlarıdır.\" Şeyh Mahmûd el-Âlûsî rahimehullâh şöyle dedi:"], [440.0, "\"Hüsnâ, 'ahsen' kelimesinin müennesidir; ism-i tafdîldir."], [444.6, "Bunun mânâsı, onların isimlerin en güzeli ve en yücesi olmasıdır;"], [449.8, "çünkü en güzel ve en şerefli mânâları haber verirler.\" Sözleri bitti, Allah onlara rahmet etsin."]]}, {"reader": false, "ar": [[460.0, "وقد نصّ أهلُ السنّة على سببيّة هذا الحُسن في أسماء الله عز وجل في عدّة أمور:"], [469.0, "الأمر الأوّل: أنها تُطلق على الله عز وجل،"], [475.0, "فاكتسبت هذه الأسماءُ صفةَ الحُسن لأنها تُطلق على أعظم الأشياء وأكمل الأشياء عز وجل،"], [488.0, "وأنتم تعرفون أنّ الاسم يجمُل بجمال من أُطلق عليه."]], "tr": [[460.0, "Ehl-i Sünnet, Allah Azze ve Celle'nin isimlerindeki bu güzelliğin sebebini birkaç şeyde açıkça belirtmiştir."], [469.0, "Birinci husus: Bu isimler Allah Azze ve Celle'ye nispet edilir."], [475.0, "Bu isimler, en büyük ve en kâmil varlığa —Azze ve Celle— nispet edildikleri için güzellik vasfını kazanmıştır."], [488.7, "Biliyorsunuz ki isim, nispet edildiği kişinin güzelliğiyle güzelleşir."]]}, {"reader": false, "ar": [[494.0, "الأمر الثاني: أنها أسماءٌ تُفيد الكماليّة بمفردها،"], [498.8, "غيرَ مفتقرةٍ إلى ضميمةٍ أخرى."], [502.5, "فـ«الله» عز وجل يُفيد الكمال المطلق غيرَ مضافٍ إلى شيءٍ آخر،"], [508.0, "«الرحمن» يُفيد الكمال المطلق غيرَ مضافٍ إلى شيءٍ آخر،"], [512.0, "«القدّوس، السلام، المؤمن، المهيمن، العزيز، الجبّار، السميع، البصير» وغيرُها من أسماء الله عز وجل؛"], [523.4, "تجد أنّ كلَّ اسمٍ منها يُفيد كمالًا،"], [526.7, "يُفيد الكمال المطلق، فلا يفتقر كمالُ شيءٍ منها إلى ضميمة شيءٍ آخر ليُفيد كمالَه."]], "tr": [[494.0, "İkinci husus: Bunlar, başka bir lafız eklenmesine muhtaç olmaksızın tek başlarına kemal ifade eden isimlerdir."], [502.5, "\"Allah\" Azze ve Celle ismi, başka bir şeye izafe edilmeksizin mutlak kemal ifade eder."], [507.6, "\"er-Rahmân\" başka bir şeye izafe edilmeksizin mutlak kemal ifade eder."], [511.6, "\"el-Kuddûs, es-Selâm, el-Mü'min, el-Müheymin, el-Azîz, el-Cebbâr, es-Semî', el-Basîr\" ve Allah Azze ve Celle'nin diğer isimleri de böyledir;"], [523.4, "her birinin kemal, mutlak kemal ifade ettiğini görürsün."], [526.9, "Hiçbirinin kemali, kemalini ifade etmek için başka bir şeyin eklenmesine muhtaç değildir."]]}, {"reader": false, "ar": [[535.0, "الأمر الثالث: أنّ كلَّ اسمٍ منها يتضمّن صفةَ كمال؛"], [540.8, "فـ«العزيز» يتضمّن صفةَ كمالٍ وهي العزّة،"], [545.5, "و«الحكيم» يتضمّن صفةَ كمالٍ وهي الحكمة."], [551.0, "فلأنها تُطلق على الله صارت حُسنى،"], [554.0, "ولأنها تُفيد الكماليّة المطلقة بمفردها صارت حُسنى،"], [560.0, "ولأنها تتضمّن صفاتِ كمالٍ صارت حُسنى،"], [565.0, "<span class=\"ayah\">﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٠]<\/span>. والله أعلم."]], "tr": [[535.0, "Üçüncü husus: Her biri bir kemal sıfatını tazammun eder (içerir)."], [540.8, "\"el-Azîz\" bir kemal sıfatını, yani izzeti;"], [543.3, "\"el-Hakîm\" bir kemal sıfatını, yani hikmeti içerir."], [546.8, "Allah'a nispet edildikleri için hüsnâ oldular;"], [551.0, "tek başlarına mutlak kemal ifade ettikleri için hüsnâ oldular;"], [555.5, "kemal sıfatlarını içerdikleri için hüsnâ oldular."], [560.0, "<span class=\"ayah\">﴿En güzel isimler Allah'ındır; O'na onlarla dua edin﴾<\/span> [A'râf 180]. Allah en iyisini bilir."]]}]}, {"ts": "09:31", "title": "2. Külliye (devam): İsim değil haber yoluyla nispet: \"ed-Dehr\" ve \"el-Kadîm\"", "paras": [{"reader": false, "ar": [[571.0, "وبناءً على ذلك: فكلُّ اسمٍ يُطلق على الله عز وجل في الكتاب أو السنّة ـ أو نقول:"], [579.6, "كلُّ شيءٍ يُطلق على الله في الكتاب أو السنّة ـ وهو لا يُفيد في ذاته مفردًا معنًى كماليًّا مطلقًا،"], [589.0, "فإنه يُعتبر من باب إطلاق الخبريّة،"], [591.7, "لا من باب إطلاق الأسماء؛"], [594.0, "كـ«الدهر»، ففي الصحيحين من حديث أبي هريرة رضي الله عنه قال:"], [600.3, "قال النبيّ صلى الله عليه وسلم فيما يرويه عن ربّه عز وجل:"], [604.1, "«لا تسبّوا الدهر، فإنّ الله هو الدهر»،"], [608.0, "وفي روايةٍ: «يؤذيني ابنُ آدم، يسبّ الدهر، وأنا الدهر، بيدي الأمر، أقلّب الليل والنهار»."]], "tr": [[571.0, "Buna binaen: Kitap veya Sünnet'te Allah Azze ve Celle'ye nispet edilen —ya da şöyle diyelim:"], [579.6, "Kitap veya Sünnet'te Allah'a nispet edilen— ve kendi başına tek olarak mutlak bir kemal mânâsı ifade etmeyen her isim, isim nispeti babından değil, haber yoluyla nispet babından sayılır."], [594.0, "\"ed-Dehr\" (zaman) gibi. Sahîhayn'da Ebû Hüreyre radıyallâhu anh'ın hadisinde, Peygamber sallallâhu aleyhi ve sellem'in Rabbi Azze ve Celle'den rivayet ettiği şeyde şöyle buyurduğu geçer:"], [604.1, "«Dehre (zamana) sövmeyin; çünkü Dehr, Allah'tır.» Bir rivayette de:"], [608.9, "«Âdemoğlu bana eziyet ediyor; dehre sövüyor. Hâlbuki Dehr benim; iş benim elimdedir, geceyi ve gündüzü ben evirip çeviririm.»"]]}, {"reader": false, "ar": [[615.0, "فإضافةُ الدهريّة إلى الله ليست إضافةَ أسماء."], [617.0, "لماذا؟ لأنّ الدهر من الأعلام الجامدة التي لا تُفيد كماليّةً بمفردها،"], [623.0, "ولا تدلّ على صفة كمال."], [626.0, "فليس الدهرُ من أسماء الله الحسنى في الأصحّ،"], [630.0, "وإنما إطلاقُه على الله عز وجل في هذا النصّ إنما هو من باب إطلاق الخبريّة."], [637.0, "وأنتم تعرفون أنّ المتقرِّر في القواعد أنّه يُتوسَّع في إطلاق الخبر ما لا يُتوسَّع في إطلاق الأسماء."]], "tr": [[615.0, "Dehrin Allah'a izafesi, isim izafesi değildir."], [617.0, "Niçin? Çünkü \"dehr\", tek başına kemal ifade etmeyen ve bir kemal sıfatına delâlet etmeyen câmid isimlerdendir."], [626.0, "Bu yüzden en sahih görüşe göre \"ed-Dehr\", Allah'ın Esmâ-i Hüsnâ'sından değildir."], [630.9, "Bu nasta onun Allah Azze ve Celle'ye nispeti, sadece haber yoluyla nispet babındandır."], [637.0, "Biliyorsunuz ki kaidelerde yerleşik olan şudur:"], [640.0, "Haber yoluyla nispette, isim nispetinde genişletilmeyen ölçüde genişlik tanınır."]]}, {"reader": false, "ar": [[645.0, "وكذلك «القديم»؛ فإنّ الحقّ أنّه لا يجوز إطلاقه على الله عز وجل اسمًا،"], [652.0, "وإن كان يجوز إطلاقه من باب الخبريّة فقط."], [657.0, "وأمّا إطلاقه على أنّه من أسمائه الحسنى فإنه لا يصحّ؛"], [662.7, "لعدم وجود الدليل الدالّ عليه أوّلًا،"], [666.0, "ولأنه لا يتضمّن صفةَ كمالٍ بمفرده،"], [671.0, "وليس هو من الأسماء التي يُتمدَّح ويُثنى على صاحبها بها. والله أعلم."]], "tr": [[645.0, "\"el-Kadîm\" de böyledir. Doğrusu, onun Allah Azze ve Celle'ye isim olarak nispet edilmesi caiz değildir;"], [652.0, "sadece haber yoluyla nispet edilmesi caiz olsa da."], [657.0, "Onun O'nun Esmâ-i Hüsnâ'sından biri olarak nispet edilmesine gelince, bu sahih değildir."], [662.7, "Önce ona delâlet eden bir delil bulunmadığı için;"], [666.0, "ayrıca tek başına bir kemal sıfatını içermediği ve sahibinin kendisiyle övüldüğü ve senâ edildiği isimlerden olmadığı için. Allah en iyisini bilir."]]}]}, {"ts": "11:22", "title": "3. Külliye: İsimlerden, isbatına dair nas gelmeyen her şeyin Allah'a isim olarak nispeti caiz değildir", "paras": [{"reader": false, "ar": [[682.0, "الكلّيّة الثالثة: <b>كلُّ ما لم يرد النصُّ بإثباته من الأسماء فلا يجوز إطلاقه اسمًا على الله.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ ما لم يرد النصُّ بإثباته من الأسماء فلا يجوز إطلاقه اسمًا على الله تعالى.<\/b>"]], "tr": [[682.0, "3. külliye: 3. külliye: İsimlerden, isbatına dair nas gelmeyen her şeyin Allah'a isim olarak nispet edilmesi caiz değildir. (Tekrar ediyor.) 3."], [699.7, "külliye: İsimlerden, isbatına dair nas gelmeyen her şeyin Allah Teâlâ'ya isim olarak nispet edilmesi caiz değildir."]]}, {"reader": false, "ar": [[712.0, "أقول: وقيّدتُ هذه الكلّيّة بقولي:"], [714.8, "«فلا يجوز إطلاقه اسمًا»؛"], [717.0, "لأنّه قد يجوز إطلاقه خبرًا."], [720.0, "وذلك لأنّه يجب الوقوف في أسماء الله الحسنى على ما جاء به الكتاب والسنّة،"], [728.0, "فلا يُزاد فيها ولا يُنقص."], [731.0, "وأجمع أهلُ السنّة والجماعة على أنّه لا مدخل في أسماء الله عز وجل للقياس،"], [739.0, "فلا يجوز أن نُثبت شيئًا من أسماء الله عز وجل بالقياس."]], "tr": [[712.0, "Derim ki: Bu külliyeyi \"isim olarak nispet edilmesi caiz değildir\" sözümle kayıtladım;"], [717.0, "çünkü haber olarak nispet edilmesi caiz olabilir."], [720.0, "Bu da, Esmâ-i Hüsnâ'da Kitap ve Sünnet'in getirdiğinde durmanın vacip olmasındandır;"], [726.3, "onlara ne ekleme yapılır ne de onlardan eksiltilir."], [731.0, "Ehl-i Sünnet ve'l-Cemaat, Allah Azze ve Celle'nin isimlerinde kıyasın yeri olmadığında icmâ etmiştir;"], [738.4, "Allah Azze ve Celle'nin isimlerinden herhangi birini kıyasla isbat etmemiz caiz değildir."]]}, {"reader": false, "ar": [[744.0, "وأجمع أهلُ السنّة والجماعة على أنّه لا مدخل للعقل استقلالًا،"], [749.0, "على أنّه لا مدخل للعقل استقلالًا في إثبات شيءٍ من أسماء الله عز وجل."], [756.0, "وأجمع أهلُ السنّة على أنّه لا مدخل للرؤى والمنامات والأحلام والمكاشفات في إثبات شيءٍ من أسماء الله عز وجل ما لم يرد به دليلُ الكتاب والسنّة."], [770.0, "وأجمع العلماء ـ وأجمع أهلُ السنّة ـ على أنّ صحّة الاسم في ذاته لا تُسوِّغ إطلاقه على الله عز وجل ما لم يثبت به دليلٌ خاصّ،"], [781.0, "ما لم يثبت به دليلٌ خاصّ."], [783.0, "وأجمع أهلُ السنّة على أنّه لا مدخل للاستحسان،"], [786.8, "للاستحسان في إطلاق شيءٍ من الأسماء على الله عز وجل."]], "tr": [[744.0, "Ehl-i Sünnet ve'l-Cemaat, Allah Azze ve Celle'nin isimlerinden herhangi birinin isbatında aklın müstakil olarak yeri olmadığında —aklın müstakil olarak yeri olmadığında— icmâ etmiştir."], [756.0, "Ehl-i Sünnet, Kitap ve Sünnet'in delili gelmedikçe Allah Azze ve Celle'nin isimlerinden herhangi birinin isbatında rüyaların, uykuda görülenlerin, düşlerin ve mükâşefâtın (keşiflerin) yeri olmadığında icmâ etmiştir."], [770.0, "Âlimler —Ehl-i Sünnet— ismin kendi başına sahih olmasının, hususi bir delille sabit olmadıkça —hususi bir delille sabit olmadıkça— onun Allah Azze ve Celle'ye nispet edilmesini caiz kılmadığında icmâ etmiştir."], [783.0, "Ehl-i Sünnet, Allah Azze ve Celle'ye isimlerden herhangi birini nispet etmede istihsanın —istihsanın— yeri olmadığında icmâ etmiştir."]]}, {"reader": false, "ar": [[793.0, "وأجمع أهلُ السنّة على أنّ كلَّ من سمّى الله بما لم يسمِّ به نفسه فإنه ملحدٌ في أسمائه،"], [802.4, "داخلٌ في قول الله عز وجل:"], [806.0, "<span class=\"ayah\">﴿وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٠]<\/span>."], [810.0, "ولذلك تواترت النقولُ عنهم بأنّ من جملة صور الإلحاد في الأسماء:"], [818.0, "أن نُطلق على الله عز وجل شيئًا من الأسماء لم يرد بجواز إطلاقه دليلٌ خاصٌّ من كتاب الله عز وجل وسنّة رسوله صلى الله عليه وسلم."]], "tr": [[793.0, "Ehl-i Sünnet, Allah'ı kendisini isimlendirmediği bir isimle isimlendiren herkesin O'nun isimlerinde ilhad eden (sapan) biri olduğunda ve Allah Azze ve Celle'nin şu sözünün kapsamına girdiğinde icmâ etmiştir:"], [806.0, "<span class=\"ayah\">﴿O'nun isimleri hakkında ilhad edenleri (sapanları) bırakın﴾<\/span> [A'râf 180]."], [812.7, "Bu sebeple onlardan şu hususta nakiller tevatür etmiştir:"], [818.0, "İsimlerde ilhadın suretlerinden biri, nispet edilmesinin caizliğine dair Allah Azze ve Celle'nin Kitabı'ndan ve Resûlü sallallâhu aleyhi ve sellem'in sünnetinden hususi bir delil gelmemiş bir ismi Allah Azze ve Celle'ye nispet etmemizdir."]]}, {"reader": false, "ar": [[829.0, "وأجمع أهلُ السنّة رحمهم الله على أنّ كلَّ من سمّى الله بما لم يسمِّ به نفسه أنّه قائلٌ على الله بلا علم،"], [840.0, "وهذا مُحرَّمٌ بالإجماع؛ في قول الله عز وجل:"], [842.0, "<span class=\"ayah\">﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ ۚ إِنَّ السَّمْعَ وَالْبَصَرَ وَالْفُؤَادَ كُلُّ أُولَٰئِكَ كَانَ عَنْهُ مَسْئُولًا﴾<\/span> <span class=\"ref\">[الإسراء: ٣٦]<\/span>،"], [849.0, "وفي قول الله عز وجل:"], [852.0, "<span class=\"ayah\">﴿قُلْ إِنَّمَا حَرَّمَ رَبِّيَ الْفَوَاحِشَ مَا ظَهَرَ مِنْهَا وَمَا بَطَنَ وَالْإِثْمَ وَالْبَغْيَ بِغَيْرِ الْحَقِّ﴾<\/span>،"], [857.7, "إلى أن قال: <span class=\"ayah\">﴿وَأَن تَقُولُوا عَلَى اللَّهِ مَا لَا تَعْلَمُونَ﴾<\/span> <span class=\"ref\">[الأعراف: ٣٣]<\/span>."]], "tr": [[829.0, "Ehl-i Sünnet —Allah onlara rahmet etsin— Allah'ı kendisini isimlendirmediği bir isimle isimlendiren herkesin Allah hakkında ilimsiz söz söyleyen biri olduğunda icmâ etmiştir."], [839.1, "Bu da icmâ ile haramdır;"], [840.8, "Allah Azze ve Celle'nin şu sözünde:"], [842.0, "<span class=\"ayah\">﴿Hakkında bilgin olmayan şeyin ardına düşme. Çünkü kulak, göz ve kalp; bunların hepsi ondan sorumludur﴾<\/span> [İsrâ 36]."], [848.3, "Ve Allah Azze ve Celle'nin şu sözünde:"], [852.0, "<span class=\"ayah\">﴿De ki: Rabbim ancak açık ve gizli hayâsızlıkları, günahı, haksız yere saldırmayı haram kıldı﴾<\/span>;"], [856.9, "şu sözüne kadar: <span class=\"ayah\">﴿ve Allah hakkında bilmediğiniz şeyleri söylemenizi (haram kıldı)﴾<\/span> [A'râf 33]."]]}, {"reader": false, "ar": [[862.0, "ولأنّ تسمية الله تعالى بما لم يسمِّ به نفسَه،"], [868.0, "أو إنكارَ ما سمّى به نفسه،"], [870.7, "جنايةٌ في حقّه سبحانه وتعالى،"], [873.0, "فوجب سلوكُ الأدب في ذلك،"], [875.0, "والاقتصارُ على ما جاء به النصّ."]], "tr": [[862.0, "Ayrıca Allah Teâlâ'yı kendisini isimlendirmediği bir isimle isimlendirmek veya kendisini isimlendirdiği şeyi inkâr etmek, O'nun —Sübhânehû ve Teâlâ— hakkında bir cinayettir (suçtur)."], [873.0, "Bu yüzden bunda edebe uymak ve nassın getirdiğiyle yetinmek vacip oldu."]]}, {"reader": false, "ar": [[879.0, "ويضرب لنا الإمامُ الغزاليّ رحمه الله تعالى مثالًا جميلًا في قوله،"], [888.0, "وهو أنّه لا يجوز لنا أن نسمّي رسولَ الله صلى الله عليه وسلم باسمٍ لم يسمِّ به أبوه،"], [897.0, "لم يسمِّه به أبوه ولا سمّى به نفسَه،"], [902.0, "وكذا كلُّ كبيرٍ من الخلق."], [906.0, "فإذا امتنع ذلك في حقّ المخلوقين ـ واضحٌ الكلام؟"], [911.0, "ـ فامتناعُه في حقّ الله عز وجل أولى."], [915.0, "وهذا من عظيم الأدب مع الله عز وجل."]], "tr": [[879.0, "İmam Gazzâlî rahimehullâh sözünde bize güzel bir misal verir:"], [887.5, "Resûlullah sallallâhu aleyhi ve sellem'i babasının vermediği bir isimle —babasının ona vermediği ve kendisinin de kendine vermediği bir isimle— isimlendirmemiz caiz değildir;"], [900.8, "yaratılmışlardan her büyük kişi de böyledir."], [906.0, "Bu, yaratılmışlar hakkında yasak olunca —söz açık mı?— Allah Azze ve Celle hakkında yasak olması evleviyetle (öncelikle) gerekir."], [915.0, "Bu, Allah Azze ve Celle'ye karşı edebin büyüklüğündendir."]]}]}, {"ts": "15:20", "title": "3. Külliye (devam): Âlimlerin nakilleri · Külliyenin semeresi: İsim olarak sabit olmayan lafızlar", "paras": [{"reader": false, "ar": [[920.0, "قال الإمام البغويّ رحمه الله تعالى:"], [923.8, "«ذكر أهلُ المعاني: الإلحادُ في أسماء الله: تسميتُه بما لم يتسمَّ به، ولم ينطق به كتابُ الله ولا سنّةُ رسوله صلى الله عليه وسلم»."], [938.9, "انتهى كلامه. وقال الإمام ابن حزمٍ رحمه الله تعالى:"], [945.0, "«منع تعالى أن يُسمّى إلا بأسمائه الحسنى، وأخبر أنّ من سمّاه بغيرها فقد ألحد». انتهى كلامه."]], "tr": [[920.0, "İmam Begavî rahimehullâh şöyle dedi:"], [923.8, "\"Meânî ehli şunu zikretmiştir: Allah'ın isimlerinde ilhad, O'nu kendisinin isimlenmediği, Allah'ın Kitabı'nın ve Resûlü sallallâhu aleyhi ve sellem'in sünnetinin dile getirmediği bir isimle isimlendirmektir.\" Sözü bitti."], [938.9, "İmam İbn Hazm rahimehullâh şöyle dedi:"], [943.3, "\"Teâlâ, ancak Esmâ-i Hüsnâ'sıyla isimlendirilmesine izin verdi ve O'nu bunlardan başkasıyla isimlendirenin ilhad ettiğini haber verdi.\" Sözü bitti."]]}, {"reader": false, "ar": [[955.0, "فإن قلت: وما الثمرة من هذه الكلّيّة؟"], [958.0, "فأقول: الثمرةُ منها أنّنا نردّ كلَّ اسمٍ يأتي به إنسانٌ ليس مستندًا إلى دليلٍ صحيح؛"], [968.0, "فالواجب في مثل ذلك الوقوفُ على النصّ الشرعيّ."], [972.0, "وبناءً على ذلك فـ«المقصود» ليس من أسماء الله عز وجل،"], [976.0, "فالتعبيد له ليس بصحيح."]], "tr": [[955.0, "Eğer \"Bu külliyenin semeresi nedir?\" dersen, derim ki:"], [958.0, "Semeresi şudur: Bir insanın getirdiği, sahih bir delile dayanmayan her ismi reddederiz."], [968.0, "Böyle bir durumda vacip olan, şer'î nassta durmaktır."], [972.0, "Buna binaen \"el-Maksûd\", Allah Azze ve Celle'nin isimlerinden değildir;"], [974.4, "dolayısıyla ona \"Abd\" ekleyerek ad koymak (Abdülmaksûd) sahih değildir."]]}, {"reader": false, "ar": [[981.0, "وكذلك «الباقي» ليس من أسمائه عز وجل لعدم ثبوت الدليل،"], [989.0, "وكذلك «الآتي» أخذًا من قول الله عز وجل:"], [993.4, "<span class=\"ayah\">﴿أَن يَأْتِيَهُمُ اللَّهُ﴾<\/span> <span class=\"ref\">[البقرة: ٢١٠]<\/span>، وكذلك «الآخذ»،"], [996.5, "وكذلك «الأبد»، وكذلك «الناظر»،"], [1003.0, "وكذلك «السامع»، وكذلك «الناصر»،"], [1010.0, "وكذلك «العالي»؛ فليس هذا من أسماء الله عز وجل."]], "tr": [[981.0, "Aynı şekilde \"el-Bâkî\", delil sabit olmadığı için O'nun —Azze ve Celle— isimlerinden değildir."], [986.6, "Allah Azze ve Celle'nin <span class=\"ayah\">﴿Allah'ın onlara gelmesini﴾<\/span> [Bakara 210] sözünden alınarak \"el-Âtî\" de böyledir."], [993.4, "\"el-Âhiz\" de böyledir, \"el-Ebed\" de böyledir, \"en-Nâzır\" de böyledir, \"es-Sâmi'\" de böyledir, \"en-Nâsır\" de böyledir, \"el-Âlî\" de böyledir."], [1013.0, "Bunlar Allah Azze ve Celle'nin isimlerinden değildir."]]}, {"reader": false, "ar": [[1016.0, "وكذلك «القائم»، وكذلك «الفعّال»،"], [1022.0, "وكذلك «الفالق»، وكذلك «الرشيد»،"], [1029.0, "وكذلك «الأزليّ»، وكذلك «الباطش»،"], [1036.0, "وكذلك «التامّ»، وكذلك «الجوهر»،"], [1043.0, "وكذلك «الحنّان» في الأصحّ،"], [1047.0, "وكذلك «الدائم»، وكذلك «الدليل»،"], [1054.0, "وكذلك «الناصر» ـ ذكرتُه أم لم أذكره؟ نعم."]], "tr": [[1016.0, "\"el-Kâim\" de böyledir, \"el-Fa''âl\" de böyledir, \"el-Fâlik\" de böyledir, \"er-Reşîd\" de böyledir, \"el-Ezelî\" de böyledir, \"el-Bâtış\" de böyledir, \"et-Tâmm\" de böyledir, \"el-Cevher\" de böyledir, en sahih görüşe göre \"el-Hannân\" da böyledir, \"ed-Dâim\" de böyledir, \"ed-Delîl\" de böyledir, \"en-Nâsır\" da böyledir —onu zikrettim mi, zikretmedim mi? Evet (zikrettim)."]]}, {"reader": false, "ar": [[1060.0, "وكذلك اسمُ «العقل الفعّال» أو «العلّة الفاعلة»،"], [1067.0, "وقد سمّاه بها الفلاسفة."], [1072.0, "وكذلك «الأب» كما يُطلقه النصارى على الله عز وجل."], [1078.0, "فكلُّ ذلك ممّا لم يرد به دليلٌ بخصوصه."]], "tr": [[1060.0, "Felsefecilerin O'nu isimlendirdiği \"el-Aklü'l-Fa''âl\" (faal akıl) veya \"el-İlletü'l-Fâile\" (fâil illet) ismi de böyledir."], [1072.0, "Hristiyanların Allah Azze ve Celle'ye nispet ettiği gibi \"el-Eb\" (Baba) da böyledir."], [1078.5, "Bunların hepsi, hususi olarak hakkında delil gelmeyen şeylerdendir."]]}, {"reader": false, "ar": [[1082.0, "وكذلك «الساتر» أو «الستّار»،"], [1087.0, "وهما اسمان مشهوران على ألسنة كثيرٍ من الناس،"], [1093.0, "ولم يَرِدا في الكتب الصحيحة،"], [1095.0, "ولم يثبت فيهما نصٌّ بخصوصه."], [1098.0, "وقد كثر في الناس التسمّي بـ«عبد الستّار» عند الناس،"], [1102.0, "أليس كذلك؟ كما أنّه اشتهر على الألسنة قولُ:"], [1106.8, "«يا ساتر» ـ باعتبار كونه اسمًا لا خبرًا ـ عند رؤية الشيء الذي يُفزع الإنسان."], [1117.0, "وبناءً على ذلك فإنّ التسمّي بـ«عبد الساتر» أو بـ«عبد الستّار» لا يصحّ."]], "tr": [[1082.0, "\"es-Sâtir\" veya \"es-Settâr\" da böyledir."], [1087.0, "Bunlar birçok insanın dilinde meşhur olan iki isimdir;"], [1092.5, "sahih kitaplarda geçmemiştir ve hususi olarak haklarında bir nas sabit olmamıştır."], [1098.0, "İnsanlar arasında \"Abdüssettâr\" adını almak çoğalmıştır, öyle değil mi?"], [1103.0, "Aynı şekilde insanı korkutan bir şey görüldüğünde —haber olarak değil isim olarak— \"Yâ Sâtir!\" demek dillerde meşhur olmuştur."], [1117.0, "Buna binaen \"Abdüssâtir\" veya \"Abdüssettâr\" adını almak sahih değildir."]]}, {"reader": false, "ar": [[1126.0, "وإنما الذي ثبت «الستّير»؛"], [1131.0, "لِما أخرجه أبو داود والنسائيّ والبيهقيّ وأحمد عن يعلى بن أميّة مرفوعًا،"], [1137.0, "في قول النبيّ صلى الله عليه وسلم:"], [1140.0, "«إنّ الله حييٌّ ستّيرٌ يحبّ التستّر والحياء، فإذا اغتسل أحدكم فليتوارَ بشيء» أو قال:"], [1149.0, "«فليستتر بشيء»، وهو حديثٌ صحيح."]], "tr": [[1126.0, "Sabit olan ise \"es-Sittîr\"dir. Ebû Dâvûd, Nesâî, Beyhakî ve Ahmed'in Ya'lâ b."], [1135.0, "Ümeyye'den merfû olarak rivayet ettiği hadiste Peygamber sallallâhu aleyhi ve sellem şöyle buyurmuştur:"], [1140.0, "«Şüphesiz Allah hayâ sahibidir, çok örtendir (Sittîr'dir); örtünmeyi ve hayâyı sever. Sizden biri yıkandığında bir şeyle gizlensin» ya da «bir şeyle örtünsün» buyurdu. Bu, sahih bir hadistir."]]}, {"reader": false, "ar": [[1151.0, "ومن ذلك تسميتُه بـ«الشيء» أو «الموجود» أو «الذات»؛"], [1162.0, "فلا يُقال لله تعالى:"], [1164.7, "يا موجود، ولا: يا شيء،"], [1168.2, "ولا: يا ذات. فهذه لا يصحّ إطلاقها على الله عز وجل في باب التسمية."]], "tr": [[1151.0, "Bundan biri de O'nu \"eş-Şey'\" (şey), \"el-Mevcûd\" (var olan) veya \"ez-Zât\" diye isimlendirmektir."], [1162.0, "Allah Teâlâ'ya \"Yâ Mevcûd!\", \"Yâ Şey'!\" veya \"Yâ Zât!\" denmez."], [1168.8, "Bunların isimlendirme babında Allah Azze ve Celle'ye nispet edilmesi sahih değildir."]]}, {"reader": false, "ar": [[1176.0, "وكذلك «الصاحب»؛ فإنها تُطلق على الله عز وجل إطلاقَ خبريّة،"], [1184.0, "ولا يجوز إطلاقها على وجه الاسميّة."], [1188.0, "ففي قول النبيّ صلى الله عليه وسلم:"], [1192.0, "«اللهمّ أنت الصاحبُ في السفر» <span class=\"note\">(Müslim)<\/span>؛"], [1196.0, "وهذا من باب إطلاق الأخبار،"], [1198.5, "لأنه قيّده بقوله: «في السفر»."]], "tr": [[1176.0, "\"es-Sâhib\" de böyledir. Bu, Allah Azze ve Celle'ye haber yoluyla nispet edilir;"], [1184.0, "isim olarak nispet edilmesi caiz değildir."], [1188.0, "Peygamber sallallâhu aleyhi ve sellem'in şu sözünde olduğu gibi:"], [1192.0, "«Allah'ım! Yolculukta yoldaş (Sâhib) sensin» <span class=\"note\">(Müslim)<\/span>."], [1196.0, "Bu, haber yoluyla nispet babındandır;"], [1198.5, "çünkü onu \"yolculukta\" sözüyle kayıtlamıştır."]]}]}, {"ts": "20:01", "title": "3. Külliye (devam): \"es-Sâni'\", \"el-Ârif\" ve benzerleri · Külliyenin özeti", "paras": [{"reader": false, "ar": [[1201.0, "وكذلك «الصانع» و«المعطي» و«الضارّ» و«النافع» و«المانع»؛"], [1218.0, "كلُّ هذا من باب التسمية لله عز وجل بما لم يرد به دليلٌ ولا نصٌّ من كتاب الله عز وجل ولا سنّة رسوله صلى الله عليه وسلم."]], "tr": [[1201.0, "\"es-Sâni'\", \"el-Mu'tî\", \"ed-Dârr\", \"en-Nâfi'\" ve \"el-Mâni'\" de böyledir."], [1214.4, "Bütün bunlar, Allah Azze ve Celle'yi, hakkında Allah Azze ve Celle'nin Kitabı'ndan ve Resûlü sallallâhu aleyhi ve sellem'in sünnetinden delil ve nas gelmeyen bir şeyle isimlendirme babındandır."]]}, {"reader": false, "ar": [[1232.0, "وكذلك إطلاقُ «العارف»؛ فهو ليس من أسماء الله عز وجل،"], [1239.0, "بل وليس من صفاته أيضًا،"], [1242.0, "وإنما يصحّ أن نُطلقه على الله من باب الأخبار:"], [1246.0, "«تعرّفْ على الله في الرخاء يعرفْك في الشدّة»،"], [1251.0, "لكن لا يجوز أن نُطلق «العارف» إطلاقَ تسمية ولا إطلاقَ صفة."]], "tr": [[1232.0, "\"el-Ârif\" nispeti de böyledir. O, Allah Azze ve Celle'nin isimlerinden değildir;"], [1239.6, "hatta sıfatlarından da değildir. Onu Allah'a ancak haber babından nispet etmemiz sahihtir:"], [1246.0, "«Bollukta Allah'ı tanı ki darlıkta O da seni tanısın.» Fakat \"el-Ârif\"i ne isim olarak ne de sıfat olarak nispet etmemiz caizdir."]]}, {"reader": false, "ar": [[1258.0, "وكذلك إطلاقُ «العالِم» <span class=\"q\">؟ 20:58<\/span> على الله عز وجل؛"], [1265.0, "فإنّه لم يرد بجواز إطلاقه دليلٌ من كتاب الله عز وجل ولا سنّة رسوله صلى الله عليه وسلم."], [1276.0, "وستأتينا قاعدةٌ توضّح ذلك كلَّه،"], [1280.0, "كلّيّاتٌ سوف توضّح ذلك كلَّه إن شاء الله."]], "tr": [[1258.0, "Allah Azze ve Celle'ye \"el-Âlim\" <span class=\"q\">؟<\/span> nispeti de böyledir."], [1265.0, "Onun nispet edilmesinin caizliğine dair Allah Azze ve Celle'nin Kitabı'ndan ve Resûlü sallallâhu aleyhi ve sellem'in sünnetinden bir delil gelmemiştir."], [1276.0, "Bütün bunları açıklayan bir kaide —inşallah bütün bunları açıklayacak külliyeler— bize gelecektir."]]}, {"reader": false, "ar": [[1283.0, "والخلاصةُ من هذه الكلّيّة:"], [1286.0, "أنّه لا يجوز لنا أن نسمّي الله إلا بما سمّى به نفسه في كتابه،"], [1290.9, "أو سمّاه به نبيُّه صلى الله عليه وسلم في صحيح سنّته،"], [1295.4, "كما أسلفت. والله أعلم."]], "tr": [[1283.0, "Bu külliyenin özeti şudur: Allah'ı ancak O'nun Kitabı'nda kendisini isimlendirdiği veya Peygamberi sallallâhu aleyhi ve sellem'in sahih sünnetinde O'nu isimlendirdiği şeyle isimlendirmemiz caizdir;"], [1293.3, "daha önce söylediğim gibi. Allah en iyisini bilir."]]}]}, {"ts": "21:37", "title": "4. Külliye: Allah için sabit olan hiçbir ismin yerine, onun mânâsını ifade eden başka bir lafız konulamaz", "paras": [{"reader": false, "ar": [[1297.0, "الكلّيّة الرابعة: <b>كلُّ ما ثبت لله من الأسماء فلا يجوز الاستعاضةُ عنه بما يعبّر عن معناه.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ ما ثبت لله من الأسماء فلا يجوز الاستعاضةُ عنه بما يعبّر عن معناه.<\/b> واضحةٌ الكلّيّة؟"]], "tr": [[1297.0, "4. külliye: 4. külliye: Allah için sabit olan isimlerden hiçbirinin yerine, onun mânâsını ifade eden bir lafız koymak caiz değildir. (Tekrar ediyor.) 4."], [1307.0, "külliye: Allah için sabit olan isimlerden hiçbirinin yerine, onun mânâsını ifade eden bir lafız koymak caiz değildir. Külliye açık mı?"]]}, {"reader": false, "ar": [[1322.0, "ويوضّح هذه الكلّيّةَ ابنُ القيّم رحمه الله تعالى في قوله:"], [1331.8, "«جميعُ ما أطلقه الله على نفسه من صفاته العُلى أكملُ معنًى ولفظًا ممّا لم يُطلقه ـ انتبهوا ـ فالعليمُ الخبير أكملُ من الفقيه والعارف، والكريمُ الجواد أكملُ من السخيّ، والخالقُ البارئ المصوِّر أكملُ من الصانع الفاعل، ولهذا لم تجئ هذه في أسمائه الحسنى، والرحيمُ والرؤوف أكملُ من الشفيق والمُشفق؛ فعليك بمراعاة ما أطلقه سبحانه على نفسه من الأسماء والصفات». انتهى كلامه."]], "tr": [[1322.0, "İbnü'l-Kayyim rahimehullâh bu külliyeyi şu sözüyle açıklar:"], [1326.3, "\"Allah'ın yüce sıfatlarından kendisine nispet ettiği her şey, mânâ ve lafız bakımından nispet etmediğinden daha kâmildir —dikkat edin—."], [1336.8, "el-Alîm el-Habîr, el-Fakîh ve el-Ârif'ten daha kâmildir."], [1341.3, "el-Kerîm el-Cevâd, es-Sahî'den (cömert) daha kâmildir."], [1345.6, "el-Hâlık el-Bâri' el-Musavvir, es-Sâni' el-Fâil'den daha kâmildir;"], [1353.2, "bu yüzden bunlar (es-Sâni' ve el-Fâil) O'nun Esmâ-i Hüsnâ'sında gelmemiştir."], [1363.4, "er-Rahîm ve er-Raûf, eş-Şefîk ve el-Müşfik'ten daha kâmildir."], [1372.0, "O hâlde Sübhânehû'nun kendisine nispet ettiği isim ve sıfatları gözetmen gerekir.\" Sözü bitti."]]}, {"reader": false, "ar": [[1382.0, "وإطلاقُ اسم «القويّ» على الله هو المشروع،"], [1391.0, "ولكن لا يجوز أن تعبّر عنه بقولك:"], [1395.8, "«البطل الشجاع». والله أعلم."]], "tr": [[1382.0, "\"el-Kavî\" isminin Allah'a nispet edilmesi meşru olandır;"], [1385.7, "fakat onu \"el-Batal eş-Şücâ'\" (kahraman, cesur) sözünle ifade etmen caiz değildir. Allah en iyisini bilir."]]}]}, {"ts": "23:22", "title": "5. Külliye: Allah Teâlâ'nın her ismi mutlak kemal sıfatlarından bir sıfatı içerir", "paras": [{"reader": false, "ar": [[1402.0, "ومن الكلّيّات أيضًا: <b>كلُّ اسمٍ لله تعالى فيتضمّن صفةً من صفات الكمال المطلق.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ اسمٍ لله تعالى فيتضمّن صفةً من صفات الكمال المطلق.<\/b>"]], "tr": [[1402.0, "Külliyelerden biri de şudur: 5."], [1404.0, "külliye: Allah Teâlâ'nın her ismi, mutlak kemal sıfatlarından bir sıfatı içerir.<b> (Tekrar ediyor.) <\/b>5."], [1417.0, "külliye: Allah Teâlâ'nın her ismi, mutlak kemal sıfatlarından bir sıfatı içerir."]]}, {"reader": false, "ar": [[1425.0, "قال ابن تيميّة رحمه الله تعالى:"], [1432.0, "«كلُّ اسمٍ من أسمائه يدلّ على الذات المسمّاة، وعلى الصفة التي تضمّنها الاسم؛ كالعليم يدلّ على الذات والعلم، والقدير يدلّ على الذات والقدرة، والرحيم يدلّ على الذات والرحمة». انتهى كلامه."]], "tr": [[1425.0, "İbn Teymiyye rahimehullâh şöyle dedi:"], [1432.0, "\"O'nun isimlerinden her isim, isimlendirilen zâta ve ismin içerdiği sıfata delâlet eder."], [1438.4, "el-Alîm; zâta ve ilme, el-Kadîr;"], [1442.0, "zâta ve kudrete, er-Rahîm; zâta ve rahmete delâlet ettiği gibi.\" Sözü bitti."]]}, {"reader": false, "ar": [[1452.0, "وقد أجمع أهلُ السنّة والجماعة على تقرير هذه الكلّيّة،"], [1458.0, "واعتبروا أنّ من الإلحاد في أسماء الله عز وجل:"], [1462.8, "أن تؤمن بها اسمًا وتجحد الصفةَ التي تضمّنها ذلك الاسم،"], [1469.0, "كما هو منهج المعتزلة؛"], [1474.0, "فإنّ المعتزلة يؤمنون بأسماء الله عز وجل،"], [1478.0, "ولكن لا يصفونه بصفاتها،"], [1480.0, "فيقولون: عليمٌ بلا علم،"], [1484.0, "وقديرٌ بلا قدرة، وقويٌّ بلا قوّة،"], [1488.0, "وسميعٌ بلا سمع، وبصيرٌ بلا بصر، والعياذ بالله."]], "tr": [[1452.0, "Ehl-i Sünnet ve'l-Cemaat bu külliyenin takririnde icmâ etmiş ve şunu Allah Azze ve Celle'nin isimlerinde ilhaddan saymışlardır:"], [1462.8, "Onlara isim olarak iman edip o ismin içerdiği sıfatı inkâr etmen;"], [1468.3, "Mu'tezile'nin yolu olduğu gibi. Mu'tezile, Allah Azze ve Celle'nin isimlerine iman eder, fakat O'nu bu isimlerin sıfatlarıyla vasfetmez."], [1480.8, "Şöyle derler: İlimsiz Alîm, kudretsiz Kadîr, kuvvetsiz Kavî, işitmesiz Semî', görmesiz Basîr. Allah'a sığınırız."]]}, {"reader": false, "ar": [[1494.0, "وهذا من جملة الإلحاد في أسماء الله عز وجل."], [1499.0, "ولذلك فيجب علينا أن نؤمن بالأسماء،"], [1502.0, "وأن نؤمن بالصفات التي تضمّنتها تلك الأسماء؛"], [1505.0, "فـ«الحكيم» اسمه والحكمةُ صفته،"], [1508.3, "و«العليم» اسمه والعلمُ صفته،"], [1512.3, "و«الخبير» اسمه والخبرةُ المطلقة صفته،"], [1517.0, "و«الحيّ» اسمه والحياةُ الكاملة التي لم تُسبق بعدمٍ ولا يلحقها زوالٌ صفته،"], [1528.0, "وهكذا في سائر أسماء الله عز وجل."]], "tr": [[1494.0, "Bu, Allah Azze ve Celle'nin isimlerinde ilhadın bir parçasıdır."], [1499.0, "Bu yüzden isimlere iman etmemiz ve o isimlerin içerdiği sıfatlara iman etmemiz vaciptir."], [1502.0, "\"el-Hakîm\" O'nun ismi, hikmet O'nun sıfatıdır;"], [1503.3, "\"el-Alîm\" O'nun ismi, ilim O'nun sıfatıdır;"], [1505.0, "\"el-Habîr\" O'nun ismi, mutlak haberdarlık O'nun sıfatıdır;"], [1510.7, "\"el-Hayy\" O'nun ismi, öncesinde yokluk bulunmayan ve ardından zeval gelmeyen kâmil hayat O'nun sıfatıdır."], [1524.2, "Allah Azze ve Celle'nin diğer isimlerinde de böyledir."]]}, {"reader": false, "ar": [[1531.0, "وكلُّ من سلب الأسماءَ عن صفاتها فإنه ينفي كونها حُسنى،"], [1539.9, "ويقدح في مدح الله عز وجل والثناء عليه بها. والله أعلم."]], "tr": [[1531.0, "İsimleri sıfatlarından soyan herkes, onların hüsnâ oluşunu nefyetmiş ve Allah Azze ve Celle'nin onlarla övülmesine ve senâ edilmesine dil uzatmış olur. Allah en iyisini bilir."]]}]}, {"ts": "25:47", "title": "6. Külliye: Kemali ancak başkasının eklenmesiyle tamamlanan şey Esmâ-i Hüsnâ'dan değildir", "paras": [{"reader": false, "ar": [[1547.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما لا يتمّ كمالُه إلا بضميمة غيره فليس من الأسماء الحسنى.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ ما لا يتمّ كمالُه إلا بضميمة غيره فليس من الأسماء الحسنى.<\/b>"]], "tr": [[1547.0, "Külliyelerden biri de şudur: 6."], [1549.0, "külliye: Kemali ancak başkasının eklenmesiyle tamamlanan her şey Esmâ-i Hüsnâ'dan değildir.<b> (Tekrar ediyor.) <\/b>6."], [1563.7, "külliye: Kemali ancak başkasının eklenmesiyle tamamlanan her şey Esmâ-i Hüsnâ'dan değildir."]]}, {"reader": false, "ar": [[1576.0, "وذلك لأنّ من شروط كثيرٍ من أهل السنّة في الاسم الأحسن:"], [1585.0, "أن يدلّ على كمالٍ مطلقٍ منفردًا،"], [1589.0, "غيرَ محتاجٍ إلى غيره ليدلّ على كماليّته."], [1594.0, "فأسماءُ الله عز وجل تُفيد وصفَه بكمالٍ مطلقٍ مفردةً،"], [1602.0, "غيرَ مفتقرةٍ إلى ما يقترن بها في إفادة كماليّته المطلقة."]], "tr": [[1576.0, "Çünkü Ehl-i Sünnet'ten birçoğunun \"ahsen\" (en güzel) isim için koyduğu şartlardan biri, kemalini göstermek için başkasına muhtaç olmaksızın tek başına mutlak bir kemale delâlet etmesidir."], [1594.0, "Allah Azze ve Celle'nin isimleri, O'nun mutlak kemalini ifade etmede kendileriyle birlikte anılacak bir şeye muhtaç olmaksızın, tek başlarına O'nun mutlak kemalle vasfedildiğini ifade eder."]]}, {"reader": false, "ar": [[1610.0, "وبناءً على ذلك فليس من الأسماء في الأصحّ:"], [1616.0, "«القابض الباسط»؛ لأنّ الباسط لا يكمُل إلا بالقابض،"], [1625.0, "والقابض لا يكمُل إلا بالباسط،"], [1628.0, "وإنما هي من جملة ما يُخبَر به عن الله عز وجل،"], [1635.0, "فهي من جملة أفعاله."]], "tr": [[1610.0, "Buna binaen en sahih görüşe göre \"el-Kâbız el-Bâsıt\" isimlerden değildir."], [1616.0, "Çünkü el-Bâsıt (genişleten) ancak el-Kâbız (daraltan) ile, el-Kâbız da ancak el-Bâsıt ile kemale erer."], [1629.3, "Bunlar ancak Allah Azze ve Celle hakkında haber verilen şeylerdendir; O'nun fiillerindendir."]]}, {"reader": false, "ar": [[1637.0, "ونقول أيضًا: وليس من أسمائه في الأصحّ:"], [1646.0, "«المانع المعطي»، وإنما هي من جملة ما يُخبَر به عن الله عز وجل؛"], [1654.0, "لأنّ المانع لا يتمّ كمالُه إلا بالمعطي،"], [1661.0, "والمعطي لا يتمّ كمالُه إلا بالمانع."], [1665.0, "فمن يمنع مطلقًا فليس بممدوح،"], [1670.0, "ومن يُعطي مطلقًا فليس بممدوح،"], [1675.0, "وإنما المنعُ الممدوح ما كان في محلّه،"], [1678.0, "والإعطاءُ الممدوح ما كان في محلّه."]], "tr": [[1637.0, "Şunu da deriz: En sahih görüşe göre \"el-Mâni' el-Mu'tî\" O'nun isimlerinden değildir;"], [1649.5, "bunlar ancak Allah Azze ve Celle hakkında haber verilen şeylerdendir."], [1654.0, "Çünkü el-Mâni'in (men edenin) kemali ancak el-Mu'tî (veren) ile, el-Mu'tî'nin kemali de ancak el-Mâni' ile tamamlanır."], [1665.0, "Mutlak olarak men eden övülmüş değildir;"], [1670.8, "mutlak olarak veren de övülmüş değildir."], [1676.0, "Övülen men, yerinde olandır; övülen verme de yerinde olandır."]]}, {"reader": false, "ar": [[1683.0, "ونقول أيضًا: ليس من أسمائه في الأصحّ:"], [1688.0, "«النافع الضارّ»؛ لأنّ النافع لا يتمّ كمالُه إلا بضميمة غيره،"], [1699.0, "والضارّ لا يتمّ كمالُه إلا بضميمة غيره،"], [1703.0, "ولكن من جملة ما يُخبَر به عن الله عز وجل أنّه ينفع ويضرّ من شاء،"], [1713.0, "بحكمته وعدله وفضله عز وجل."], [1717.0, "أنتم معي ولّا لا يا جماعة؟"], [1722.0, "فمثلُ هذه الأسماء لا يكمُل كمالُها إلا بضميمة غيرها،"], [1731.0, "فلا نعتبرها من جملة الأسماء الحسنى."]], "tr": [[1683.0, "Şunu da deriz: En sahih görüşe göre \"en-Nâfi' ed-Dârr\" O'nun isimlerinden değildir."], [1688.0, "Çünkü en-Nâfi'in (fayda verenin) kemali ancak başkasının eklenmesiyle, ed-Dârr'ın (zarar verenin) kemali de ancak başkasının eklenmesiyle tamamlanır."], [1701.9, "Fakat Allah Azze ve Celle hakkında haber verilen şeylerden biri, O'nun hikmeti, adaleti ve fazlıyla —Azze ve Celle— dilediğine fayda ve zarar vermesidir."], [1717.0, "Benimle misiniz, değil misiniz ey cemaat?"], [1722.0, "Bu tür isimlerin kemali ancak başkasının eklenmesiyle tamamlanır;"], [1730.3, "bu yüzden onları Esmâ-i Hüsnâ'dan saymayız."]]}]}, {"ts": "28:56", "title": "6. Külliye (devam): Meselede Ehl-i Sünnet içindeki ihtilaf · \"ez-Zâhir el-Bâtın\" ve \"el-Evvel el-Âhir\"", "paras": [{"reader": false, "ar": [[1736.0, "ولكنّ هذه مسألةٌ قد اختلف فيها أهلُ العلم من أهل السنّة والجماعة،"], [1743.0, "فهي من المسائل التي ثبت الخلافُ فيها في دائرة أهل السنّة."], [1750.7, "والمتقرِّر في القواعد أنّ كلَّ مسألةٍ عقديّةٍ ثبت الخلافُ فيها بين أهل السنّة أنفسهم فلا تُعتبر من المسائل الكبار التي يُوالى ويُعادى عليها."]], "tr": [[1736.0, "Fakat bu, Ehl-i Sünnet ve'l-Cemaat'ten ilim ehlinin ihtilaf ettiği bir meseledir;"], [1743.7, "Ehl-i Sünnet dairesi içinde ihtilafın sabit olduğu meselelerdendir."], [1750.7, "Kaidelerde yerleşik olan şudur: Ehl-i Sünnet'in kendi arasında ihtilafın sabit olduğu her akîde meselesi, üzerine dostluk ve düşmanlık kurulan büyük meselelerden sayılmaz."]]}, {"reader": false, "ar": [[1765.0, "وذلك لأنّ من أهل السنّة من يجعلون أسماءَ الله تنقسم إلى قسمين:"], [1772.0, "إلى اسمٍ مفرد، وإلى اسمٍ مقترن،"], [1775.0, "ويسمّون الأسماءَ المقترنة بالأسماء المزدوجة،"], [1779.5, "كابن القيّم وغيره. ولكنّ الأقرب إن شاء الله هي أنّ هذه الأسماء لم يرد ـ انتبه ـ بجواز التسمية بها دليلٌ خاصّ،"], [1794.0, "وإنما ورد أنها من جملة أفعاله:"], [1798.0, "ينفع ويضرّ، ويُعطي ويمنع،"], [1801.1, "ويقبض ويبسط؛ كلُّها وردت في أدلّة الشرع على أنها أفعالٌ وأخبار،"], [1811.0, "ولا يتضمّن شيءٌ منها شروطَ الاسميّة في اللغة العربيّة."]], "tr": [[1765.0, "Çünkü Ehl-i Sünnet'ten bazıları —İbnü'l-Kayyim ve başkaları gibi— Allah'ın isimlerini iki kısma ayırır:"], [1772.0, "tek isim ve birlikte anılan isim."], [1775.8, "Birlikte anılan isimlere \"çift isimler\" derler."], [1782.0, "Fakat inşallah daha yakın olan şudur:"], [1786.5, "Bu isimlerle isimlendirmenin caizliğine dair —dikkat et— hususi bir delil gelmemiştir."], [1794.0, "Gelen, bunların O'nun fiillerinden olduğudur:"], [1798.0, "Fayda verir ve zarar verir, verir ve men eder, daraltır ve genişletir."], [1806.0, "Bunların hepsi şer'î delillerde fiiller ve haberler olarak gelmiştir;"], [1811.7, "hiçbiri Arap dilindeki isim olma şartlarını içermez."]]}, {"reader": false, "ar": [[1820.0, "فإن قلت: وماذا تقول في قول الله عز وجل:"], [1824.5, "«هو الظاهر والباطن» <span class=\"note\">(Hadîd 3'ten)<\/span>؟ فنقول:"], [1826.7, "إنّ «الظاهر» يُفيد معنًى كماليًّا مفردًا،"], [1830.8, "و«الباطن» يُفيد معنًى كماليًّا مفردًا،"], [1834.7, "و«الأوّل» و«الآخر» أيضًا؛"], [1837.2, "الأوّليّة المطلقة تُفيد معنًى كاملًا،"], [1842.0, "والآخريّة المطلقة تُفيد معنًى كاملًا،"], [1846.0, "فهي من جملة أسماء الله عز وجل بالإجماع،"], [1851.6, "معنًى كاملًا. فمن كان أوّلًا بالأوّليّة المطلقة فهو كامل،"], [1859.0, "ومن كان آخرًا بالآخريّة المطلقة فهو كامل،"], [1862.0, "ومن كان ظاهرًا بالظاهريّة المطلقة فهو كامل،"], [1866.0, "ومن كان باطنًا بالباطنيّة المطلقة فهو كامل."]], "tr": [[1820.0, "Eğer \"Allah Azze ve Celle'nin 'O, Zâhir'dir ve Bâtın'dır' <span class=\"note\">(Hadîd 3'ten)<\/span> sözü hakkında ne dersin?\" dersen, deriz ki:"], [1826.0, "\"ez-Zâhir\" tek başına kemal mânâsı ifade eder;"], [1830.3, "\"el-Bâtın\" tek başına kemal mânâsı ifade eder."], [1834.7, "\"el-Evvel\" ve \"el-Âhir\" de öyledir:"], [1837.2, "Mutlak evveliyet kâmil bir mânâ ifade eder, mutlak âhiriyet kâmil bir mânâ ifade eder."], [1844.4, "Bu yüzden bunlar icmâ ile Allah Azze ve Celle'nin isimlerindendir;"], [1849.5, "kâmil bir mânâdır. Mutlak evveliyetle evvel olan kâmildir;"], [1854.0, "mutlak âhiriyetle âhir olan kâmildir;"], [1859.9, "mutlak zâhiriyetle zâhir olan kâmildir;"], [1864.3, "mutlak bâtıniyetle bâtın olan kâmildir."]]}, {"reader": false, "ar": [[1869.0, "فهذه الأسماء ليست بمفتقرةٍ إلى غيرها لتُفيد كماليّتها،"], [1878.0, "فليست هي كالقابض والباسط؛"], [1883.0, "فإنّ البسط مطلقًا مذموم،"], [1885.0, "وإنّ القبض مطلقًا مذموم،"], [1889.0, "لكن إذا قلت: «القابض الباسط» فإنك تُطلقها على من لا يقبض إلا إذا اقتضت الحكمةُ أن يقبض،"], [1896.0, "ولا يبسط إلا إذا اقتضت الحكمةُ أن يبسط، وهكذا."]], "tr": [[1869.0, "Bu isimler, kemallerini ifade etmek için başkasına muhtaç değildir."], [1876.5, "el-Kâbız ve el-Bâsıt gibi değildirler."], [1883.0, "Çünkü mutlak olarak genişletmek yerilmiştir, mutlak olarak daraltmak da yerilmiştir."], [1890.2, "Fakat \"el-Kâbız el-Bâsıt\" dediğinde bunu, ancak hikmet daraltmayı gerektirdiğinde daraltan ve ancak hikmet genişletmeyi gerektirdiğinde genişleten zâta nispet etmiş olursun. Diğerleri de böyledir."]]}, {"reader": false, "ar": [[1902.0, "قال ابن القيّم رحمه الله تعالى:"], [1907.0, "«وأمّا أن يُثنى عليه بمجرّد المنع» ـ بالمانع يعني فقط ـ «ومجرّد الانتقام» ـ فيُقال له:"], [1917.4, "يا منتقم، على أنّ الانتقام،"], [1921.0, "على أنّ المنتقم اسم ـ قال:"], [1923.9, "«ومجرّد الإضرار» ـ فتُطلق عليه:"], [1926.8, "يا نافع فقط، أو تقول:"], [1929.6, "يا مانع فقط، أو تقول:"], [1933.2, "يا ضارّ فقط. ابنُ القيّم يتكلّم عن هذه الأشياء إذا أُطلقت لوحدها غيرَ مضمومةٍ إلى ما يوجب كمالها."]], "tr": [[1902.0, "İbnü'l-Kayyim rahimehullâh şöyle dedi: \"O'na sadece men ile senâ edilmesi\" —yani sadece \"el-Mâni'\" ile— \"sadece intikam ile\" —O'na \"Yâ Müntekım!\" denmesi;"], [1917.4, "intikamın, yani \"el-Müntekım\"in isim olduğunu kabul etsek bile— (İbnü'l-Kayyim) dedi ki:"], [1923.9, "\"ve sadece zarar verme ile\" —yani O'na sadece \"Yâ Nâfi'!\" demen ya da sadece \"Yâ Mâni'!\" demen ya da sadece \"Yâ Dârr!\" demen—."], [1933.2, "İbnü'l-Kayyim bu şeylerden, kemallerini gerektiren şeye eklenmeksizin tek başlarına nispet edildikleri durumda bahsediyor."]]}, {"reader": false, "ar": [[1942.2, "أُعيدها مرّةً أخرى؛ قال:"], [1945.4, "«وأمّا أن يُثنى عليه بمجرّد المنع، ومجرّد الانتقام، ومجرّد الإضرار، فلا يسوغ. فهذه الأسماء المزدوجة» ـ أنتم معي؟"], [1958.0, "ـ «فهذه الأسماء المزدوجة تجري الأسماءُ منها مجرى الاسم الواحد»."], [1968.0, "يعني: لا ننظر إلى مفرديها ـ وإنما،"], [1968.6, "عفوًا ـ لا ننظر إلى كلّ مفردةٍ منها على حدة،"], [1977.0, "وإنما ننظر إليها مجموعةً،"], [1980.0, "فهي بمجموعها عبارةٌ عن الاسم."]], "tr": [[1942.2, "Bir kez daha tekrar ediyorum;"], [1945.4, "dedi ki: \"O'na sadece men, sadece intikam ve sadece zarar verme ile senâ edilmesi ise caiz değildir."], [1958.0, "Bu çift isimler\" —benimle misiniz?— \"bu çift isimlerin içindeki isimler tek bir isim hükmündedir.\" Yani onların iki tekiline bakmayız —ancak, pardon— onlardan her bir tekile ayrı ayrı bakmayız;"], [1977.8, "onlara toplu olarak bakarız. Onlar toplamıyla isim yerindedir."]]}, {"reader": false, "ar": [[1984.0, "يقول ابن القيّم: «فهذه الأسماء المزدوجة تجري الأسماءُ منها مجرى الاسم الواحد الذي يمتنع فصلُ حروف بعضه عن بعض»."], [1999.8, "انتبهوا: مثل «السميع»؛ فصِّلِ الحروف،"], [2002.2, "ها؟ ذهب الاسم. فيقول:"], [2004.7, "كما أنّنا في الاسم المفرد لا يكون اسمًا يدلّ على كمالٍ تامٍّ إلا بضميمة حروفه،"], [2014.2, "فكذلك هاتان المفردتان. إيوه،"], [2016.7, "بازدواجها يتمّ الاسم، بازدواجها يتمّ الاسم."]], "tr": [[1984.0, "İbnü'l-Kayyim diyor ki: \"Bu çift isimlerin içindeki isimler, harflerinin birbirinden ayrılması mümkün olmayan tek bir isim hükmündedir.\" Dikkat edin:"], [1999.8, "\"es-Semî'\" gibi; harflerini ayır, ha?"], [2001.4, "İsim gitti. Şöyle diyor: Tek isimde, ancak harflerinin bir araya gelmesiyle tam bir kemale delâlet eden bir isim olduğu gibi, bu iki tekil de öyledir."], [2016.1, "Evet, çift olmalarıyla isim tamamlanır; çift olmalarıyla isim tamamlanır."]]}, {"reader": false, "ar": [[2021.1, "والخلاف بيننا وبينهم خلافٌ في عبارة؛"], [2028.0, "فنحن نشترط في الاسميّة إطلاقًا على الله عز وجل أن تدلّ على الكمال المطلق بمفردها غيرَ مفتقرةٍ إلى ضميمتها،"], [2039.0, "وهم يقولون: هي وضميمتُها عبارةٌ عن الاسم الكامل."], [2044.0, "يعني: بمعنى أنّ من أراد أن يتسمّى بـ«عبد المانع» لا بدّ أن يقول:"], [2049.0, "«عبد المانع المعطي»، وإذا أراد أن يتسمّى بـ«عبد النافع» فيُقال:"], [2057.5, "«عبد النافع الضارّ»، أو بـ«عبد الباسط» فيُقال: «عبد القابض الباسط»."]], "tr": [[2021.1, "Bizimle onlar arasındaki ihtilaf bir ifade ihtilafıdır."], [2028.0, "Biz, Allah Azze ve Celle'ye isim olarak nispet edilmede, eklenen lafza muhtaç olmaksızın tek başına mutlak kemale delâlet etmesini şart koşarız."], [2040.2, "Onlar ise \"O ve eklenen lafız birlikte kâmil isim yerindedir\" derler."], [2045.6, "Yani şu mânâda: \"Abdülmâni'\" adını almak isteyen \"Abdülmâni' el-Mu'tî\" demelidir."], [2049.0, "\"Abdünnâfi'\" adını almak isterse \"Abdünnâfi' ed-Dârr\" denir."], [2057.5, "Ya da \"Abdülbâsıt\" (adını almak isterse) \"Abdülkâbız el-Bâsıt\" denir."]]}, {"reader": false, "ar": [[2064.0, "ولذلك قلتُ لكم: إنّ الخلاف بيننا وبينهم في هذه الجزئيّة يقرب أن يكون خلافًا لفظيًّا في إطلاقٍ:"], [2074.0, "هل هو اسمٌ أو ليس باسم."], [2076.0, "والله أعلم. فهمتم هذا؟ ماشي."]], "tr": [[2064.0, "Bu yüzden size dedim ki:"], [2065.8, "Bu cüz'î meselede bizimle onlar arasındaki ihtilaf, \"O bir isim midir, değil midir?\" şeklindeki bir nispette lafzî bir ihtilaf olmaya yakındır."], [2076.0, "Allah en iyisini bilir. Bunu anladınız mı? Tamam."]]}, {"reader": false, "ar": [[2081.0, "وكذلك من الأمثلة عليها:"], [2086.0, "«الخافض الرافع»، ومنها أيضًا:"], [2090.7, "«المحيي المميت»، ومنها أيضًا:"], [2095.7, "«المعزّ المذلّ»؛ فكلُّ هذه من جملة الأخبار التي نُخبر بها عن الله عز وجل،"], [2106.0, "ولكن لا نجعلها من جملة الأسماء الحسنى."]], "tr": [[2081.0, "Bunun örneklerinden biri de \"el-Hâfız er-Râfi'\"dir (alçaltan, yükselten)."], [2090.7, "Bunlardan biri de \"el-Muhyî el-Mümît\"tir (dirilten, öldüren)."], [2095.7, "Bunlardan biri de \"el-Muizz el-Müzill\"dir (aziz kılan, zelil kılan)."], [2103.4, "Bunların hepsi, Allah Azze ve Celle hakkında verdiğimiz haberlerdendir;"], [2106.9, "fakat onları Esmâ-i Hüsnâ'dan saymayız."]]}]}, {"ts": "35:09", "title": "7. Külliye: Allah'ın isimlerinin tamamını ancak O sayabilir", "paras": [{"reader": false, "ar": [[2109.0, "ومن الكلّيّات أيضًا: <b>كلُّ ما لله من الأسماء فلا يُحصيه إلا هو.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ ما لله من الأسماء فلا يُحصيه إلا الله.<\/b> <b>كلُّ ما لله من الأسماء فلا يُحصيه إلا الله تعالى.<\/b>"]], "tr": [[2109.0, "Külliyelerden biri de şudur: 7."], [2116.0, "külliye: Allah'ın isimlerinin tamamını ancak O sayabilir.<b> (Tekrar ediyor.) <\/b>7."], [2119.7, "külliye: Allah'ın isimlerinin tamamını ancak Allah sayabilir.<b> <\/b>7."], [2125.4, "külliye: Allah'ın isimlerinin tamamını ancak Allah Teâlâ sayabilir."]]}, {"reader": false, "ar": [[2129.0, "أقول: وهذه قاعدةٌ مُجمَعٌ عليها من أهل السنّة والجماعة."], [2135.0, "والدليل على ذلك الحديثُ الذي تحفظونه جميعًا،"], [2140.0, "في قول النبيّ صلى الله عليه وسلم:"], [2144.0, "«أسألك بكلّ اسمٍ هو لك»،"], [2149.0, "ثم فصّل هذا الإجمال بقوله:"], [2152.0, "«سمّيتَ به نفسك» ـ وهذا النوع الأوّل ـ «أو أنزلتَه في كتابك» ـ وهذا النوع الثاني ـ «أو علّمتَه أحدًا من خلقك» ـ وهذا النوع الثالث ـ ثم جاءنا الشاهد من هذه الكلّيّة،"], [2165.0, "وهي قوله صلى الله عليه وسلم:"], [2168.0, "«أو استأثرتَ به في علم الغيب عندك»."]], "tr": [[2129.0, "Derim ki: Bu, Ehl-i Sünnet ve'l-Cemaat'in üzerinde icmâ ettiği bir kaidedir."], [2135.0, "Bunun delili, hepinizin ezbere bildiği hadiste Peygamber sallallâhu aleyhi ve sellem'in şu sözüdür:"], [2142.9, "«Senin olan her isimle senden isterim.» Sonra bu icmâli şu sözüyle tafsil etti:"], [2152.0, "«...ki onunla kendini isimlendirdin» —bu birinci türdür— «veya onu Kitabında indirdin» —bu ikinci türdür— «veya onu yaratıklarından birine öğrettin» —bu üçüncü türdür—."], [2161.2, "Sonra bu külliyedeki delil yeri geldi;"], [2163.5, "o da onun sallallâhu aleyhi ve sellem şu sözüdür:"], [2168.0, "«...veya onu katındaki gayb ilminde kendine tahsis ettin.»"]]}, {"reader": false, "ar": [[2172.0, "ومن المعلوم أنّ هذا التوسّل لا يكون بشيءٍ معدوم،"], [2176.2, "وإنما يكون بشيءٍ موجود."], [2178.0, "فهذا دليلٌ على أنّ هناك أسماءً قد استأثر الله عز وجل بعلمها،"], [2186.0, "وهي من جملة الغيب المطلق الذي لا يعلمه ملكٌ مقرّب ولا نبيٌّ مرسل ولا وليٌّ صالح."]], "tr": [[2172.0, "Bilindiği gibi bu tevessül, yok olan bir şeyle olmaz;"], [2175.2, "ancak var olan bir şeyle olur."], [2178.0, "Bu, Allah Azze ve Celle'nin ilmini kendine tahsis ettiği isimlerin bulunduğuna delildir."], [2185.3, "Bunlar, ne mukarreb bir meleğin ne mürsel bir nebînin ne de sâlih bir velînin bildiği mutlak gaybdandır."]]}, {"reader": false, "ar": [[2195.0, "ولا يجوز أن يتخوّض الإنسانُ فيها كما يفعله أقطابُ الصوفيّة؛"], [2201.0, "فيأتي أحدهم ويقول: قد كُشف لي شيءٌ من هذه الأسماء،"], [2209.0, "فيدعو اللهَ عز وجل بها."], [2211.0, "فإنها إن خفيت على ملائكة الله وعلى أنبيائه ورسله ـ وهم خيرُ أهل السماء والأرض ـ فلأن تخفى على من دونهم من الأولياء والصالحين من باب أولى."]], "tr": [[2195.0, "İnsanın, sûfîlerin kutuplarının yaptığı gibi bunlara dalması caiz değildir."], [2201.0, "Onlardan biri gelir ve \"Bu isimlerden bir kısmı bana keşfolundu\" der ve Allah Azze ve Celle'ye onlarla dua eder."], [2211.0, "Bu isimler Allah'ın meleklerine, nebîlerine ve resullerine —ki onlar göklerin ve yerin ehlinin en hayırlılarıdır— gizli kaldıysa, onlardan aşağıda olan velîlere ve sâlihlere gizli kalması evleviyetle gerekir."]]}, {"reader": false, "ar": [[2223.1, "ولعلّه ـ والله أعلم ـ أنها هي الأسماء التي سيتوسّل النبيُّ صلى الله عليه وسلم بها إلى ربّه في أمر الشفاعة؛"], [2238.0, "لأنه قال: «فيفتح اللهُ عليّ من محامده» ـ أي بأسمائه وصفاته ـ «وحُسنِ الثناء عليه ما لم يفتحه على أحدٍ من قبلي» <span class=\"note\">(Buhârî, Müslim)<\/span>."]], "tr": [[2223.1, "Belki de —Allah en iyisini bilir— bunlar, Peygamber sallallâhu aleyhi ve sellem'in şefaat meselesinde Rabbine tevessül edeceği isimlerdir."], [2232.8, "Çünkü o şöyle buyurmuştur: «Allah bana kendisine hamd etme yollarından» —yani isimlerinden ve sıfatlarından— «ve kendisine güzel senâdan, benden önce hiç kimseye açmadığı şeyi açar» <span class=\"note\">(Buhârî, Müslim)<\/span>."]]}, {"reader": false, "ar": [[2254.0, "ومن المعلوم أنّ المسلمين لا يزالون يتوسّلون إلى الله عز وجل بهذه الأسماء المذكورة في الكتاب والسنّة؛"], [2265.0, "فإنّ المسلمين يحمدون الله عز وجل بها،"], [2269.1, "ويدعونه بها، ويتوسّلون إليه بها."], [2272.0, "فما هذه المحامد وحسنُ الثناء على الله عز وجل من الأمر الذي لم يفتحه على أحدٍ قبله؟"], [2284.0, "فلعلّه ـ والله أعلم ـ أنّه يُوحى إليه بهذه الأسماء التي اختصّ الله عز وجل بعلمها،"], [2293.0, "فيتوسّل إلى ربّه عز وجل بها،"], [2297.0, "وإنما نظنّ ظنًّا وما نحن بمستيقنين."]], "tr": [[2254.0, "Bilindiği gibi Müslümanlar, Kitap ve Sünnet'te zikredilen bu isimlerle Allah Azze ve Celle'ye tevessül etmeye devam etmektedir."], [2263.5, "Müslümanlar onlarla Allah Azze ve Celle'ye hamd eder, onlarla O'na dua eder ve onlarla O'na tevessül eder."], [2272.0, "O hâlde, ondan önce kimseye açılmayan şeyden olan bu hamd yolları ve Allah Azze ve Celle'ye güzel senâ nedir?"], [2284.0, "Belki de —Allah en iyisini bilir— Allah Azze ve Celle'nin ilmini kendine has kıldığı bu isimler ona vahyedilir ve o da onlarla Rabbi Azze ve Celle'ye tevessül eder."], [2297.0, "Ancak biz bir zan ediyoruz; kesin bilenlerden değiliz."]]}, {"reader": false, "ar": [[2301.0, "وهذا يتضمّن أنّ هناك صفاتٍ قد استأثر الله عز وجل بها أيضًا،"], [2310.0, "لا يعلمها أحدٌ من الخلق؛"], [2313.0, "لأنّنا قلنا بأنّ كلَّ اسمٍ من أسماء الله عز وجل فإنه لا بدّ وأن يتضمّن صفة."], [2319.0, "فإذا كان هناك أسماءٌ قد استأثر الله عز وجل بها في علم الغيب،"], [2324.0, "فإذًا هناك صفاتٌ قد تضمّنتها هذه الأسماء،"], [2327.7, "قد استأثر الله عز وجل بها أيضًا في علم الغيب."]], "tr": [[2301.0, "Bu, Allah Azze ve Celle'nin kendine tahsis ettiği ve yaratılmışlardan hiç kimsenin bilmediği sıfatların da bulunduğunu içerir."], [2313.0, "Çünkü Allah Azze ve Celle'nin isimlerinden her ismin mutlaka bir sıfatı içerdiğini söyledik."], [2317.9, "Allah Azze ve Celle'nin gayb ilminde kendine tahsis ettiği isimler varsa, o hâlde bu isimlerin içerdiği ve Allah Azze ve Celle'nin yine gayb ilminde kendine tahsis ettiği sıfatlar da vardır."]]}]}, {"ts": "38:53", "title": "7. Külliye (devam): \"Allah'ın doksan dokuz ismi vardır\" hadisi: Sayının değil sevabın hasrı", "paras": [{"reader": false, "ar": [[2333.0, "فإن قلت: وكيف نفعل بما في الصحيحين من حديث أبي هريرة رضي الله عنه،"], [2340.0, "قال: قولُ النبيّ صلى الله عليه وسلم:"], [2342.0, "«إنّ لله تسعةً وتسعين اسمًا، مائةً إلا واحدًا، من أحصاها دخل الجنّة»؟"], [2349.0, "فقد استدلّ بعضُ العلماء ـ كابن حزمٍ رحمه الله ـ بهذا الحديث على أنّ أسماء الله تعالى محصورةٌ في هذا العدد."]], "tr": [[2333.0, "Eğer \"Sahîhayn'da Ebû Hüreyre radıyallâhu anh'ın hadisinde geçen, Peygamber sallallâhu aleyhi ve sellem'in «Allah'ın doksan dokuz, yüzden bir eksik ismi vardır; kim onları sayarsa (ihsâ ederse) cennete girer» sözünü ne yapacağız?\" dersen:"], [2349.0, "Bazı âlimler —İbn Hazm rahimehullâh gibi— bu hadisi, Allah Teâlâ'nın isimlerinin bu sayıyla sınırlı olduğuna delil getirmiştir."]]}, {"reader": false, "ar": [[2358.0, "وهذا الذي قاله ابنُ حزمٍ وفهمه من هذا الحديث لم يوافقه عليه عامّةُ أهل العلم،"], [2369.0, "بل نقل بعضهم ـ كالنوويّ ـ اتّفاقَ العلماء على أنّ أسماء الله تعالى ليست بمحصورةٍ في هذا العدد."], [2380.0, "وكأنّهم ينقلون قولَ ابن حزمٍ في هذه المسألة نقلَ شذوذ،"], [2386.0, "أي لبيان شذوذه، وليست هي بأوّل شذوذاته عن أقوال أهل العلم،"], [2396.0, "رحم الله الجميع رحمةً واسعة."]], "tr": [[2358.0, "İbn Hazm'ın söylediği ve bu hadisten anladığı bu görüşe ilim ehlinin geneli katılmamıştır."], [2368.3, "Hatta bazıları —Nevevî gibi— âlimlerin, Allah Teâlâ'nın isimlerinin bu sayıyla sınırlı olmadığında ittifak ettiğini nakletmiştir."], [2380.0, "Sanki onlar bu meselede İbn Hazm'ın görüşünü şâz bir görüş olarak, yani şâzlığını beyan etmek için naklediyorlar."], [2389.0, "Bu, onun ilim ehlinin görüşlerinden ayrıldığı şâz görüşlerinin ilki de değildir."], [2396.0, "Allah hepsine geniş rahmetiyle rahmet etsin."]]}, {"reader": false, "ar": [[2398.0, "وقد اختلف أهلُ العلم في بيان معنى هذا الحديث،"], [2403.0, "ولكنّ الأقرب عندي هو أنّه حصرُ الثواب في العدد،"], [2407.5, "وليس حصرًا للعدد. بمعنى:"], [2409.7, "أنّني لو قلت: إنّ عندي تسعةً وتسعين بيتًا شعريًّا،"], [2415.5, "مائةً إلا واحدًا، من حفظها وهبتُه أو أهديتُه كذا وكذا؛"], [2424.0, "فهل هذا التركيب اللغويّ يُفيد أنّني لم أقل في الدنيا إلا تسعةً وتسعين بيتًا من الشعر؟"], [2431.0, "الجواب: لا، ولكن عندي ثوابٌ فحصرتُ هذا الثواب في عدديّةٍ معيّنة."], [2436.0, "فهذا الحديث إنما هو حصرُ الثواب في العدديّة."]], "tr": [[2398.0, "İlim ehli bu hadisin mânâsını açıklamakta ihtilaf etmiştir."], [2403.0, "Fakat bana göre daha yakın olan, bunun sayının hasrı değil, sevabın sayıda hasrı olduğudur."], [2411.6, "Şu mânâda: Eğer \"Benim doksan dokuz, yüzden bir eksik şiir beytim var;"], [2418.1, "kim onları ezberlerse ona şunu şunu bağışlarım veya hediye ederim\" desem, bu dil yapısı dünyada doksan dokuz beytten başka şiir söylemediğimi mi ifade eder?"], [2431.0, "Cevap: Hayır. Fakat benim bir mükâfatım vardır;"], [2433.3, "bu mükâfatı belirli bir sayıyla sınırladım."], [2436.0, "Bu hadis de ancak sevabın sayıyla sınırlandırılmasıdır."]]}, {"reader": false, "ar": [[2442.0, "فاللهُ عز وجل لمّا خلق جنّته جعل لها طرقًا كثيرة،"], [2447.0, "وجعل من طرقها أن يُحصي العبدُ من أسمائه هذا العدد."], [2452.0, "فليس هذا دليلًا على أنّه ليس له من الأسماء إلا هذا العدد،"], [2457.0, "ولكن من أراد جنّته،"], [2459.3, "أو أن يسلك طريقًا من طرق تحصيل الجنّة،"], [2464.0, "فليُحصِ من أسماء الله عز وجل بقدر هذا العدد."]], "tr": [[2442.0, "Allah Azze ve Celle cennetini yarattığında ona birçok yol kıldı;"], [2446.5, "o yollardan biri de kulun O'nun isimlerinden bu sayıyı ihsâ etmesidir."], [2452.0, "Bu, O'nun bu sayıdan başka ismi olmadığına delil değildir."], [2455.8, "Fakat kim O'nun cennetini isterse veya cenneti elde etme yollarından birine girmek isterse, Allah Azze ve Celle'nin isimlerinden bu sayı kadarını ihsâ etsin."]]}, {"reader": false, "ar": [[2470.0, "وكقول العربيّ: إنّ عندي تسعةً وتسعين درهمًا أعددتُها للصدقة؛"], [2479.0, "فهل هذا دليلٌ على أنّني لا أملك إلا هذه الدراهم؟"], [2484.0, "الجواب: لا، ولكن عندي عملٌ خيريّ وهو الصدقة،"], [2488.0, "فأعددتُ له من ماليّتي بهذا المقدار."], [2494.0, "فالصحيح في فهم هذا الحديث:"], [2497.5, "أنّه حصرٌ للثواب ـ أي الجنّة ـ في هذا العدد ـ أي التسعة والتسعين ـ وليس حصرًا لأسماء الله عز وجل، كما مثّلتُ لكم."]], "tr": [[2470.0, "Arabın şu sözü gibi: \"Sadaka için hazırladığım doksan dokuz dirhemim var.\" Bu, bu dirhemlerden başka bir şeye sahip olmadığıma delil midir?"], [2484.0, "Cevap: Hayır. Fakat benim bir hayır amelim, yani sadakam vardır;"], [2488.0, "malımdan onun için bu miktarı hazırladım."], [2494.0, "Bu hadisi anlamada sahih olan şudur:"], [2497.5, "Bu, sevabın —yani cennetin— bu sayıda —yani doksan dokuzda— hasredilmesidir;"], [2504.7, "size misal verdiğim gibi Allah Azze ve Celle'nin isimlerinin hasredilmesi değildir."]]}, {"reader": false, "ar": [[2513.0, "ولذلك قال شيخ الإسلام ابن تيميّة رحمه الله:"], [2520.0, "«فهذا يشير ـ إلى حديث ابن مسعود ـ: «أو استأثرتَ به في علم الغيب عندك» يدلّ على أنّ لله أسماءً فوق تسعةٍ وتسعين»."], [2534.0, "انتهى. وقال النوويّ رحمه الله تعالى:"], [2539.0, "«اتّفق العلماء على أنّ هذا الحديث ليس فيه حصرٌ لأسمائه سبحانه وتعالى، فليس معناه أنّه ليس له أسماءٌ غير هذه التسعة والتسعين، وإنما مقصود الحديث أنّ هذه التسعة والتسعين من أحصاها دخل الجنّة، فالمرادُ الإخبارُ عن دخول الجنّة بإحصائها، لا الإخبارُ بحصر الأسماء»."], [2568.0, "انتهى كلامه رحمه الله."]], "tr": [[2513.0, "Bu yüzden Şeyhülislâm İbn Teymiyye rahimehullâh şöyle dedi:"], [2520.0, "\"Bu —İbn Mes'ûd hadisine işaret ediyor—:"], [2523.7, "«...veya onu katındaki gayb ilminde kendine tahsis ettin» sözü, Allah'ın doksan dokuzdan fazla ismi olduğuna delâlet eder.\" Bitti."], [2539.0, "Nevevî rahimehullâh şöyle dedi: \"Âlimler, bu hadiste O'nun —Sübhânehû ve Teâlâ— isimlerinin hasredilmediğinde ittifak etmiştir."], [2550.5, "Bunun mânâsı, O'nun bu doksan dokuzdan başka ismi olmadığı değildir."], [2558.5, "Hadisin maksadı ancak şudur: Bu doksan dokuzu kim ihsâ ederse cennete girer."], [2568.0, "Murad, isimlerin hasrını haber vermek değil, onları ihsâ etmekle cennete girileceğini haber vermektir.\" Sözü bitti, Allah ona rahmet etsin."]]}]}, {"ts": "42:51", "title": "7. Külliye (devam): Allah'ın kendine tahsis ettiği isimler karşısındaki vazifemiz", "paras": [{"reader": false, "ar": [[2571.0, "فإن قلت: وهل نحن مطالَبون بمعرفة هذه الأسماء التي استأثر الله بها في علم الغيب؟"], [2582.0, "الجواب: بل نحن متعبَّدون بالسكوت عنها،"], [2586.0, "وتفويضِ علمها إلى الله تبارك وتعالى،"], [2591.0, "وأن نقول فيها: الله أعلم بها؛"], [2594.0, "حتى لا نكون ممّن يقولون على الله عز وجل بلا علم،"], [2598.0, "فندخل في قول الله عز وجل:"], [2601.0, "<span class=\"ayah\">﴿وَلَا تَقْفُ مَا لَيْسَ لَكَ بِهِ عِلْمٌ﴾<\/span> <span class=\"ref\">[الإسراء: ٣٦]<\/span>،"], [2605.0, "وندخل في قول الله عز وجل:"], [2608.0, "<span class=\"ayah\">﴿إِنَّ الَّذِينَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ لَا يُفْلِحُونَ﴾<\/span> <span class=\"ref\">[النحل: ١١٦]<\/span>."]], "tr": [[2571.0, "Eğer \"Allah'ın gayb ilminde kendine tahsis ettiği bu isimleri bilmekle yükümlü müyüz?\" dersen, cevap:"], [2582.0, "Bilakis biz onlar hakkında susmak, ilmini Allah Tebâreke ve Teâlâ'ya havale etmek ve onlar hakkında \"Allah onları daha iyi bilir\" demekle kulluk etmekle yükümlüyüz."], [2594.0, "Tâ ki Allah Azze ve Celle hakkında ilimsiz söz söyleyenlerden olmayalım da Allah Azze ve Celle'nin şu sözünün kapsamına girmeyelim:"], [2601.0, "<span class=\"ayah\">﴿Hakkında bilgin olmayan şeyin ardına düşme﴾<\/span> [İsrâ 36];"], [2604.4, "ve Allah Azze ve Celle'nin şu sözünün kapsamına girmeyelim:"], [2608.0, "<span class=\"ayah\">﴿Allah'a karşı yalan uyduranlar kurtuluşa eremezler﴾<\/span> [Nahl 116]."]]}, {"reader": false, "ar": [[2612.0, "فالواجب على المسلم أن يتعبّد لله عز وجل بتفويض علم هذه الأسماء إلى الله عز وجل."], [2618.0, "ثم اعلم ـ رحمك الله تعالى ـ أنّ كلَّ من يدّعي طريقًا للعلم بشيءٍ من هذه الأسماء فإنه دجّالٌ كذّابٌ مفترٍ؛"], [2629.0, "لأنّ طريقها الوحيد للعلم إنما هو الوحي،"], [2634.0, "وقد انقطع الوحيُ بموت النبيّ صلى الله عليه وسلم،"], [2639.0, "فلا طريق إلى العلم بها أبدًا."]], "tr": [[2612.0, "Müslümana vacip olan, bu isimlerin ilmini Allah Azze ve Celle'ye havale ederek Allah Azze ve Celle'ye kulluk etmesidir."], [2618.0, "Sonra bil —Allah Teâlâ sana rahmet etsin— ki bu isimlerden bir şeyi bilmeye bir yol olduğunu iddia eden herkes deccal, yalancı ve müfterîdir."], [2629.0, "Çünkü onları bilmenin tek yolu vahiydir;"], [2633.3, "vahiy de Peygamber sallallâhu aleyhi ve sellem'in vefatıyla kesilmiştir."], [2638.4, "Dolayısıyla onları bilmeye asla bir yol yoktur."]]}, {"reader": false, "ar": [[2641.0, "فإن قلت: حتى عن طريق الرؤى؟"], [2643.7, "فنقول: حتى عن طريق الرؤى."], [2646.0, "وبناءً على ذلك فتعلم أنّ معنى الغيب في قول النبيّ صلى الله عليه وسلم:"], [2654.0, "«أو استأثرتَ به في علم الغيب عندك» أنّه الغيب المطلق،"], [2659.0, "ولا يمكن أن يكون الغيبَ النسبيَّ بحالٍ من الأحوال،"], [2663.0, "إلا إذا شاء الله عز وجل. والله أعلم."]], "tr": [[2641.0, "Eğer \"Rüyalar yoluyla bile mi?\" dersen, deriz ki:"], [2646.0, "Rüyalar yoluyla bile. Buna binaen Peygamber sallallâhu aleyhi ve sellem'in «...veya onu katındaki gayb ilminde kendine tahsis ettin» sözündeki gaybın mânâsının mutlak gayb olduğunu, hiçbir şekilde nisbî gayb olamayacağını bilirsin;"], [2661.7, "ancak Allah Azze ve Celle dilerse (başka). Allah en iyisini bilir."]]}]}, {"ts": "44:26", "title": "8. Külliye: Ehl-i Sünnet arasında isimlendirmesinde ihtilaf bulunan isim, kulun dininde isbat veya nefy ile imtihan edildiği şeylerden değildir", "paras": [{"reader": false, "ar": [[2666.0, "ومن الكلّيّات أيضًا: <b>كلُّ اسمٍ وقع في التسمية به خلافٌ بين أهل السنّة فليس ممّا يُبتلى به العبدُ في دينه إثباتًا أو نفيًا.<\/b> <span class=\"note\">(يكررها)<\/span> <b>كلُّ اسمٍ وقع في التسمية به خلافٌ بين أهل السنّة فليس ممّا يُبتلى به العبدُ في دينه إثباتًا ونفيًا.<\/b> أُعيدها مرّةً ثالثة:"], [2699.0, "<b>كلُّ اسمٍ وقع في التسمية به خلافٌ بين أهل السنّة فليس ممّا يُبتلى به العبدُ في دينه إثباتًا ونفيًا.<\/b>"]], "tr": [[2666.0, "Külliyelerden biri de şudur: 8."], [2670.0, "külliye: Ehl-i Sünnet arasında onunla isimlendirme hususunda ihtilaf bulunan her isim, kulun dininde isbat veya nefy olarak imtihan edildiği şeylerden değildir.<b> (Tekrar ediyor.) <\/b>8."], [2681.0, "külliye: Ehl-i Sünnet arasında onunla isimlendirme hususunda ihtilaf bulunan her isim, kulun dininde isbat ve nefy olarak imtihan edildiği şeylerden değildir. Üçüncü kez tekrar ediyorum:"], [2699.0, "<b>8. külliye: Ehl-i Sünnet arasında onunla isimlendirme hususunda ihtilaf bulunan her isim, kulun dininde isbat ve nefy olarak imtihan edildiği şeylerden değildir.<\/b>"]]}, {"reader": false, "ar": [[2708.0, "أقول وبالله التوفيق: وهذا لأنّ المتقرِّر في القواعد أنّ كلَّ مسألةٍ عقديّةٍ ثبت الخلافُ فيها بين أهل السنّة أنفسهم فإنها لا تُعتبر من مسائل الدين الكبار التي يُوالى ويُعادى عليها،"], [2722.3, "أو يُبتلى بها المسلمُ إثباتًا أو نفيًا."], [2725.0, "ولا يجوز أن نجعلها مناطًا لتبديع بعضنا،"], [2732.0, "ولا مناطًا لتفسيق بعضنا،"], [2735.0, "ولا مناطًا لتكفير بعضنا،"], [2738.0, "ولا مناطًا لإخراج بعضنا بعضًا من دائرة أهل السنّة والجماعة،"], [2748.0, "فضلًا عن إخراج بعضنا بعضًا من دائرة الإسلام أصالةً."]], "tr": [[2708.0, "Tevfik Allah'tandır, derim ki: Bu, kaidelerde yerleşik olan şundandır:"], [2712.0, "Ehl-i Sünnet'in kendi arasında ihtilafın sabit olduğu her akîde meselesi, üzerine dostluk ve düşmanlık kurulan veya Müslümanın isbat ya da nefy olarak onunla imtihan edildiği büyük din meselelerinden sayılmaz."], [2725.0, "Onu birbirimizi bid'atçi saymaya, birbirimizi fâsık saymaya, birbirimizi tekfir etmeye ve birbirimizi Ehl-i Sünnet ve'l-Cemaat dairesinden çıkarmaya —birbirimizi aslen İslâm dairesinden çıkarmak şöyle dursun— dayanak (menât) yapmamız caiz değildir."]]}, {"reader": false, "ar": [[2753.0, "وليست مناطًا للولاء ولا للبراء،"], [2758.0, "ولا مناطًا للحبّ والبغض،"], [2762.0, "ولا مناطًا للخصومة والنزاع،"], [2767.0, "ولا مناطًا للتراشق بالتُّهم أو تحذير بعضنا من بعض."]], "tr": [[2753.0, "O, ne velâ (dostluk) ne de berâ (uzak durma) için, ne sevgi ve buğz için, ne husumet ve çekişme için, ne de birbirimize itham atmak veya birbirimizi birbirimizden sakındırmak için bir dayanaktır."]]}, {"reader": false, "ar": [[2774.0, "لأنها مسألةٌ عقديّةٌ خفيفة،"], [2776.7, "وخفّتها ترجع إلى أنّ أهل السنّة أنفسهم قد اختلفوا فيها؛"], [2788.0, "كاسم الله «المحسن»، فإنّ أهل السنّة لا يزالون يختلفون فيه:"], [2795.0, "هل هو من جملة الأسماء أو لا؟"], [2799.0, "وكاسم الله «الحنّان»، فإنّ أهل السنّة لا يزالون يختلفون فيه."], [2805.0, "وكما يُسمّى بالأسماء المزدوجة التي شرحتُها لكم آنفًا،"], [2812.0, "فإنّ أهل السنّة لا يزالون يختلفون فيها،"], [2818.0, "وغير ذلك ممّا يطول وصفه."]], "tr": [[2774.0, "Çünkü o hafif bir akîde meselesidir;"], [2777.4, "hafifliği de Ehl-i Sünnet'in kendisinin onda ihtilaf etmiş olmasına dayanır."], [2788.0, "Allah'ın \"el-Muhsin\" ismi gibi; Ehl-i Sünnet onun isimlerden olup olmadığında hâlâ ihtilaf etmektedir."], [2799.0, "Allah'ın \"el-Hannân\" ismi gibi; Ehl-i Sünnet onda hâlâ ihtilaf etmektedir."], [2805.0, "Az önce size şerh ettiğim, çift isimler diye adlandırılanlar gibi;"], [2812.0, "Ehl-i Sünnet onlarda hâlâ ihtilaf etmektedir."], [2815.7, "Bunlardan başka, anlatması uzun sürecek şeyler de vardır."]]}, {"reader": false, "ar": [[2821.0, "وهذا يدلّك على أنّ أسماء الله عز وجل منها ما هو متّفقٌ عليه بين أهل السنّة والجماعة،"], [2830.0, "وهذا هو الذي يجب علينا الأخذ بمقتضى الإجماع فيه،"], [2834.0, "وأن نُنكر الإنكارَ المغلَّظ على من خالف شيئًا منه،"], [2838.0, "وأن نُخرج من دائرة السنّة من،"], [2841.0, "من خالف فيه أو أنكره أو جحده."], [2846.0, "وهناك أسماءٌ قد ثبت خلافُ أهل السنّة أنفسهم فيها،"], [2851.0, "فهي التي تدخل تحت هذه الكلّيّة؛"], [2854.0, "فكلٌّ منّا فيها يعبد ربّه بما أدّاه إليه فيها اجتهادُه،"], [2861.0, "مع سلامة الطرف الآخر من حقد القلب وسوء منطق الألفاظ. والله أعلم."]], "tr": [[2821.0, "Bu sana şunu gösterir: Allah Azze ve Celle'nin isimlerinden bir kısmı Ehl-i Sünnet ve'l-Cemaat arasında üzerinde ittifak edilmiştir."], [2830.4, "Bunda icmâın gereğini almamız, ondan herhangi bir şeye muhalefet edene sert bir şekilde karşı çıkmamız ve onda muhalefet edeni, onu inkâr edeni veya reddedeni Sünnet dairesinden çıkarmamız vaciptir."], [2846.0, "Bir kısım isimlerde de Ehl-i Sünnet'in kendi arasındaki ihtilaf sabittir;"], [2851.0, "işte bu külliyenin kapsamına girenler bunlardır."], [2854.0, "Bunlarda her birimiz, içtihadının kendisini ulaştırdığı şeyle Rabbine kulluk eder;"], [2859.6, "karşı tarafın da kalp kininden ve kötü sözlerden selamette olmasıyla birli
