kte. Allah en iyisini bilir."]]}]}, {"ts": "47:47", "title": "9. Külliye: Allah'ı kendisini isimlendirmediği bir isimle isimlendiren herkes O'nun isimlerinde ilhad etmiştir", "paras": [{"reader": false, "ar": [[2867.0, "ومن الكلّيّات أيضًا: <b>كلُّ من سمّى الله بما لم يسمِّ به نفسَه فملحدٌ في أسمائه.<\/b> <span class=\"note\">(يكررها ثلاثًا)<\/span> <b>كلُّ من سمّى الله بما لم يسمِّ به نفسَه فملحدٌ في أسمائه.<\/b>"]], "tr": [[2867.0, "Külliyelerden biri de şudur: 9."], [2871.0, "külliye: Allah'ı kendisini isimlendirmediği bir isimle isimlendiren herkes O'nun isimlerinde ilhad etmiştir (sapmıştır).<b> (Üç kez tekrar ediyor.) <\/b>9."], [2885.7, "külliye: Allah'ı kendisini isimlendirmediği bir isimle isimlendiren herkes O'nun isimlerinde ilhad etmiştir."]]}, {"reader": false, "ar": [[2895.0, "أقول وبالله التوفيق: ودليلُ ذلك قولُ الله عز وجل:"], [2900.0, "<span class=\"ayah\">﴿وَلِلَّهِ الْأَسْمَاءُ الْحُسْنَىٰ فَادْعُوهُ بِهَا ۖ وَذَرُوا الَّذِينَ يُلْحِدُونَ فِي أَسْمَائِهِ﴾<\/span> <span class=\"ref\">[الأعراف: ١٨٠]<\/span>."], [2906.0, "وقد تقدّم لنا في مقدّمات هذا الكتاب المبارك أنّ الإلحاد هو الميلُ عمّا يجب اعتقادُه في الباب العقديّ."]], "tr": [[2895.0, "Tevfik Allah'tandır, derim ki: Bunun delili Allah Azze ve Celle'nin şu sözüdür:"], [2900.0, "<span class=\"ayah\">﴿En güzel isimler Allah'ındır; O'na onlarla dua edin. O'nun isimleri hakkında ilhad edenleri (sapanları) bırakın﴾<\/span> [A'râf 180]."], [2908.5, "Bu mübarek kitabın mukaddimelerinde, ilhadın akîde babında inanılması vacip olan şeyden sapmak olduğu geçmişti."]]}, {"reader": false, "ar": [[2915.0, "فإذا أثبت الله عز وجل في كتابه اسمًا له،"], [2920.0, "أو أثبته له نبيُّه صلى الله عليه وسلم في صحيح سنّته،"], [2924.0, "فالواجب علينا إثباتُه، فإذا جحده الإنسانُ أو كذّب به فيكون ملحدًا بهذا التكذيب والجحد."]], "tr": [[2915.0, "Allah Azze ve Celle Kitabı'nda kendisi için bir isim isbat ettiğinde veya Peygamberi sallallâhu aleyhi ve sellem sahih sünnetinde O'nun için onu isbat ettiğinde, onu isbat etmemiz vaciptir."], [2927.0, "İnsan onu inkâr eder veya yalanlarsa, bu yalanlama ve inkârla mülhid olur."]]}, {"reader": false, "ar": [[2933.0, "وكذلك إذا سمّى العبدُ ربَّه بما لم يسمِّ به نفسه،"], [2941.0, "فهذا نوعُ إلحادٍ آخر في أسماء الله عز وجل؛"], [2944.0, "وذلك كإلحاد الفلاسفة بتسمية الله عز وجل بـ«العقل الفعّال»،"], [2951.0, "وهي تسميةٌ لم ترد في الكتاب ولا في السنّة،"], [2956.1, "وكتسمية بعضهم لله عز وجل «العلّة»،"], [2963.0, "فيُطلقون على الله عز وجل «العلّة»،"], [2967.0, "وكتسمية النصارى لله عز وجل بـ«الأب»،"], [2972.0, "ونحو ذلك من الأسماء التي لم يرد بها كتابٌ ولا سنّةٌ ولا إجماع؛"], [2982.0, "فذلك كلُّه من الإلحاد في أسماء الله عز وجل."]], "tr": [[2933.0, "Aynı şekilde kul Rabbini, O'nun kendisini isimlendirmediği bir isimle isimlendirirse, bu da Allah Azze ve Celle'nin isimlerinde başka bir ilhad türüdür."], [2939.3, "Felsefecilerin Allah Azze ve Celle'yi \"el-Aklü'l-Fa''âl\" diye isimlendirerek ilhad etmeleri gibi;"], [2942.3, "bu, ne Kitap'ta ne de Sünnet'te gelen bir isimlendirmedir."], [2944.0, "Bazılarının Allah Azze ve Celle'yi \"el-İllet\" diye isimlendirmesi gibi;"], [2952.1, "Allah Azze ve Celle'ye \"illet\" derler."], [2956.8, "Hristiyanların Allah Azze ve Celle'yi \"el-Eb\" (Baba) diye isimlendirmesi ve hakkında ne Kitap ne Sünnet ne de icmâ gelmeyen buna benzer isimler gibi."], [2982.0, "Bunların hepsi Allah Azze ve Celle'nin isimlerinde ilhaddandır."]]}]}, {"ts": "49:45", "title": "10. Külliye: İsmin içerdiği sıfatı inkâr eden herkes mülhiddir · Dersin kapanışı", "paras": [{"reader": false, "ar": [[2985.0, "ومن الكلّيّات أيضًا: <b>كلُّ من أنكر الصفةَ التي يتضمّنها الاسمُ فملحد.<\/b> خفيفتان،"], [2993.1, "ها؟ <b>كلُّ من أنكر الصفةَ التي يتضمّنها الاسمُ فملحد.<\/b>"]], "tr": [[2985.0, "Külliyelerden biri de şudur: 10."], [2988.0, "külliye: İsmin içerdiği sıfatı inkâr eden herkes mülhiddir. (Bu son) ikisi hafif, değil mi?"], [2995.0, "<b>10. külliye: İsmin içerdiği sıfatı inkâr eden herkes mülhiddir.<\/b>"]]}, {"reader": false, "ar": [[3001.0, "وذلك كالمعتزلة؛ فإنهم ملاحدةٌ في هذا الباب،"], [3006.0, "لأنهم يُثبتون لله عز وجل الأسماءَ مجرّدةً عن صفاتها،"], [3011.0, "بزعم أنّه لا يُوصف إلا الأجسام،"], [3014.5, "والجسميّةُ ممتنعةٌ على الله عز وجل."], [3018.0, "فيُعطّلون باب الصفات كلَّه،"], [3021.0, "سواءٌ الصفاتُ المستقلّة عن الأسماء أو الصفاتُ التي تضمّنتها الأسماء،"], [3028.0, "فيُطلقون على الله عز وجل الاسمَ فقط،"], [3031.0, "ويجحدون أو يحرّفون الصفةَ التي تضمّنها ذلك الاسم."], [3037.0, "فهذا نوعُ إلحادٍ في أسماء الله عز وجل،"], [3041.0, "كما تقرّر عند أهل السنّة والجماعة."]], "tr": [[3001.0, "Mu'tezile gibi; onlar bu babda mülhidlerdir."], [3004.8, "Çünkü onlar, ancak cisimlerin vasfedilebileceği ve cisimliğin Allah Azze ve Celle hakkında imkânsız olduğu iddiasıyla Allah Azze ve Celle için isimleri sıfatlarından soyulmuş olarak isbat ederler."], [3018.0, "Böylece sıfatlar babının tamamını —isimlerden bağımsız sıfatları da, isimlerin içerdiği sıfatları da— ta'til ederler."], [3027.2, "Allah Azze ve Celle'ye sadece ismi nispet eder, o ismin içerdiği sıfatı inkâr ya da tahrif ederler."], [3037.0, "Ehl-i Sünnet ve'l-Cemaat katında yerleştiği üzere bu, Allah Azze ve Celle'nin isimlerinde bir ilhad türüdür."]]}, {"reader": false, "ar": [[3044.0, "وآخرُ دعوانا أن الحمد لله ربِّ العالمين،"], [3046.0, "وصلّى الله وسلّم على نبيّنا محمد."]], "tr": [[3044.0, "Son duamız, âlemlerin Rabbi Allah'a hamd olsun demektir."], [3045.7, "Allah, Peygamberimiz Muhammed'e salât ve selâm etsin."]]}]}]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0")};
document.getElementById("tar").textContent=D.title_ar;document.getElementById("ttr").textContent=D.title_tr;
document.getElementById("yl").innerHTML='<a href="https://www.youtube.com/watch?v='+D.vid+'" target="_blank" rel="noopener">YouTube\'da aç</a> · <a href="../pdf/'+String(D.no).padStart(2,"0")+'.pdf" target="_blank" rel="noopener">PDF indir</a>';
const doc=document.getElementById("doc"),AR=[],TR=[];
D.sections.forEach(sec=>{
  const h=document.createElement("h2");h.innerHTML='<span class="t"></span><span></span>';
  h.children[0].textContent=sec.ts;h.children[1].textContent=sec.title;doc.appendChild(h);
  const st=sec.paras.length&&sec.paras[0].ar.length?sec.paras[0].ar[0][0]:0;h.children[0].onclick=()=>seek(st);
  sec.paras.forEach(p=>{
    const r=document.createElement("div");r.className="row"+(p.reader?" reader":"");
    r.innerHTML='<div class="tr-col"></div><div class="ar-col" lang="ar"></div>';
    if(p.reader){r.children[0].insertAdjacentHTML("beforeend",'<span class="who">Okuyucu</span>');r.children[1].insertAdjacentHTML("beforeend",'<span class="who">القارئ</span>')}
    p.ar.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[1].appendChild(e);AR.push({t,e,r})});
    p.tr.forEach(([t,x])=>{const e=document.createElement("span");e.className="s";e.innerHTML=x+" ";e.onclick=()=>seek(t);r.children[0].appendChild(e);TR.push({t,e,r})});
    doc.appendChild(r);
  });
});
let cur=0,ia=-1,it=-1,player=null;
const pick=(L,c)=>{let lo=0,hi=L.length-1,k=-1;while(lo<=hi){const m=(lo+hi)>>1;if(L[m].t<=c){k=m;lo=m+1}else hi=m-1}return k};
function mark(L,k,old){if(k===old)return old;L.forEach((s,i)=>{s.e.className=i===k?"s now":i<k?"s past":"s"});return k}
function render(){
  const ka=pick(AR,cur+0.3),kt=pick(TR,cur+0.3);
  if(ka!==ia){if(ia>=0)AR[ia].r.classList.remove("on");ia=mark(AR,ka,ia);
    if(ka>=0){AR[ka].r.classList.add("on");
      if(document.getElementById("follow").checked){const ph=document.querySelector(".player").offsetHeight,b=AR[ka].e.getBoundingClientRect();
        if(b.top<ph+20||b.bottom>innerHeight-20)window.scrollTo({top:scrollY+b.top-ph-(innerHeight-ph)/2+b.height/2,behavior:"smooth"})}}}
  it=mark(TR,kt,it);
}
function seek(t){if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}cur=t;render()}
window.onYouTubeIframeAPIReady=function(){player=new YT.Player("yt",{videoId:D.vid,playerVars:{playsinline:1,rel:0},
  events:{onReady:()=>{clearTimeout(ft);setInterval(()=>{try{cur=player.getCurrentTime()||0;render()}catch(e){}},250)},onError:()=>{document.getElementById("warn").hidden=false}}})};
const ft=setTimeout(()=>{document.getElementById("warn").hidden=false},10000);
const tg=document.createElement("script");tg.src="https://www.youtube.com/iframe_api";document.head.appendChild(tg);
</script></body></html>
